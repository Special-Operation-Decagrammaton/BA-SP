[translation]
"10045050-1" = "第5話;脱落からの浮上をかけて"
"10045050-2" = "[ns] \"……ョウ……！\""
"10045050-3" = "[ns] \"キキョウ……！\""
"10045050-4-キキョウ" = "ゴホッ、ゴホッ！#n……ゲホッ、ゲホッ！"
"10045050-5-ナグサ" = "キキョウ！"
"10045050-6-キキョウ" = "先生……？"
"10045050-7" = "[s1] \"目を覚ましてくれてよかった……。\"\n[s2] \"浅いところで助かったよ。\""
"10045050-8-キキョウ" = "ゴホッ……！"
"10045050-9-キキョウ" = "い、一体……どうなったの？試合は？"
"10045050-10-ナグサ" = "試合はもう終わったよ。決勝に進んだのはチセさんとイズナさん。 "
"10045050-11-ナグサ" = "私たちは全員脱落。"
"10045050-12-キキョウ" = "……！！"
"10045050-13-キキョウ" = "まさか、私のせいで……？"
"10045050-14-レンゲ" = "そんな気にすんなって！仲間を助けるのは当然だろ？"
"10045050-15-キキョウ" = "私のせいだ……。"
"10045050-16-キキョウ" = "私は泳げない……水が怖いって最初から言っておけば……こんなことにはならなかったのに。"
"10045050-17-ユカリ" = "水が嫌いなのではなくて……怖がっていたんですの？"
"10045050-18-キキョウ" = "……アウトドアは苦手だから、水辺に行く機会なんてなかった。"
"10045050-19-キキョウ" = "当然、泳ぐこともできないし、深い水に入るのなんて死んでも御免。"
"10045050-20-キキョウ" = "でも……百花繚乱の作戦参謀である私が、そんなこともできないなんて言い出せなくて……。"
"10045050-21-キキョウ" = "本当にごめん。私が余計な意地を張ったせいで……。"
"10045050-22-レンゲ" = "だから、気にするなって！そもそも、これはアタシの責任でもあるんだ。"
"10045050-23-レンゲ" = "幼なじみなのに、そんなことも気づいてやれなかったんだから。"
"10045050-24-レンゲ" = "アタシこそ、ごめん。"
"10045050-25-キキョウ" = "違う、悪いのは私。"
"10045050-26-レンゲ" = "いや、アタシが悪いんだって！"
"10045050-27-キキョウ" = "どう考えても私が！"
"10045050-28-レンゲ" = "いいや、アタシが……！"
"10045050-29-ユカリ" = "ふふっ、お二人は本当に仲良しですの。"
"10045050-30-ユカリ" = "キキョウ先輩。あまり気にしないでください。"
"10045050-31-ユカリ" = "身共は、先輩が無事だっただけで十分ですわ。"
"10045050-32-キキョウ" = "……みんな、私を恨まないの？"
"10045050-33-ナグサ" = "どうして？大会に出たのは親睦を深めるのが目的だったよね？#n勝ち負けは関係ないよ。"
"10045050-34-キキョウ" = "その通りですの。ご自分を責めすぎないでください。"
"10045050-35-キキョウ" = "でも……。"
"10045050-36" = "[ns] \"心配しないで！チャンスはまだ残ってるよ！\""
"10045050-37-ユカリ" = "どういうこと？"
"10045050-38" = "[s3] \"それは後のお楽しみに取っておこう。\"\n[s4] \"みんな、ビーチバレー会場でまた会おう！\""
"10045050-39-キキョウ" = "……？"
"10045050-40-シズコ" = "早いもので、百夜水上祭も終盤に差し掛かってきましたね～"
"10045050-41-シズコ" = "でも、こうして終わりに近づいていくのは寂しい……ですよね？"
"10045050-42-シズコ" = "そんな皆さんの熱い声援にお応えして、追加試合を用意しました！#nそれがこちら……！"
"10045050-43-シズコ" = "敗者復活戦！"
"10045050-44-シズコ" = "水上障害物レースで脱落した8人が2人1組のチームになって、トーナメント方式でビーチバレーを行います！"
"10045050-45-シズコ" = "この敗者復活戦で優勝したチームは、追加で最終戦に進出できますよ！"
"10045050-46-シズコ" = "お祭りはまだまだ続きます！#n皆さん、がんばってくださいね、にゃんにゃん！"
"10045050-47" = "[ns] \"ランダムに決まった組分けと対戦カードを発表するよ！\""
"10045050-48" = "[log]ビーチバレー第1試合！[/log]"
"10045050-49" = "VS"
"10045050-50-スケバンリーダー" = "おっ、キキョウと一緒か。#nそれに、初戦の相手も悪くないな。"
"10045050-51-キキョウ" = "……。"
"10045050-52-スケバンリーダー" = "なんでよりによってあいつらなんだ……！"
"10045050-53-スケバンリーダー" = "まだだ！私たちにだって、勝てる可能性はある！"
"10045050-54" = "[ns] \"次はこちら！\" "
"10045050-55" = "[log]ビーチバレー第2試合！[/log]"
"10045050-56" = "VS"
"10045050-57-ユカリ" = "ナグサ先輩とチーム！これはですてぃにーですの！"
"10045050-58-ユカリ" = "先輩と一緒なら優勝間違いなしですわ！"
"10045050-59-ユカリ" = "うん、頑張ろうね。"
"10045050-60-ミモリ" = "ど、どうしましょう？ 相手が強すぎます……！"
"10045050-61-ミモリ" = "もっと自信を持ってください。#n私たちだって、ここまで勝ち残っているんですから。"
"10045050-62-ミモリ" = "ふふっ……修行相手として、申し分ありませんね。"
"10045050-63-シズコ" = "これは面白い対戦カードになりました！"
"10045050-64-シズコ" = "第1試合は、休憩を挟んだ後に！"
"10045050-65" = "[ns] \"みんな、チャンネルはそのままで……！\""
"10045050-66-キキョウ" = "（結局、私たちか先輩たち、どっちかは脱落する）"
"10045050-67-キキョウ" = "（でも、もしまた私のせいでレンゲまで敗退することになったら……）"
"10045050-68-キキョウ" = "（……）"
"10045050-69-キキョウ" = "（私がやらなきゃ……）"
"10045050-70-キキョウ" = "（今度は水の上じゃないし、私にもできるはず……！）"
"10045050-71-キキョウ" = "（初戦の相手もそこまで強くない。レンゲがいれば大丈夫）"
"10045050-72-キキョウ" = "（なのに、どうして……）"
"10045050-73-キキョウ" = "（……どうして、嫌な予感がするの？）"
