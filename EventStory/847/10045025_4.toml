[translation]
"10045025-1" = "[log]70名脱落！[/log]"
"10045025-2" = "[log]試合終了！[/log]"
"10045025-3-ナグサ" = "みんな、ありがとう。おかげで突破できたよ。"
"10045025-4-チセ" = "お疲れ様でした！"
"10045025-5-ユカリ" = "激しい戦いだったね……。"
"10045025-6-ユカリ" = "皆さんがいなければ、どうなっていたことか……。"
"10045025-7-キキョウ" = "……。"
"10045025-8-レンゲ" = "キキョウ？勝ったのに嬉しくないのか？"
"10045025-9-キキョウ" = "……髪が濡れた。"
"10045025-10-キキョウ" = "濡れるのは、やっぱり嫌い。"
"10045025-11-キキョウ" = "……なに？その目。"
"10045025-12-キキョウ" = "言いたいことがあるならはっきり言ったら？"
"10045025-13-レンゲ" = "いや、そういえば……キキョウが水に入るのって、お風呂の時くらいしか見たことないよな。"
"10045025-14-キキョウ" = "濡れて乱れた姿を、他人に見られたくないだけ。"
"10045025-15-レンゲ" = "なんか猫っぽいんだよな……。"
"10045025-16-キキョウ" = "（猫っぽいと思わせておければ問題ない）"
"10045025-17-キキョウ" = "（大事なのは「キキョウは水が嫌い」と認識させること）"
"10045025-18-キキョウ" = "（そうすれば、もし水に落ちたとしても堂々と言い訳ができる）"
"10045025-19-キキョウ" = "（今のところは計画通り）"
"10045025-20-シズコ" = "皆さん、本当にお疲れさまでしたっ！"
"10045025-21-シズコ" = "この後、少し休憩時間を挟みます。"
"10045025-22-シズコ" = "次の種目に備えて、しっかり休んでくださいね！"
"10045025-23" = "[ns] \"次の種目はこれだ！\""
"10045025-24" = "[log]暴走ジェットボート！[/log]"
"10045025-25-シズコ" = "ドリフトとダイブを繰り返すジェットボート！#n振り落とされたら失格です！"
"10045025-26" = "[ns] \"残り10人になるまで続けるにゃん！\""
"10045025-27-シズコ" = "ライフセーバーさんたちをしっかり配置してますので、皆さん安心して思いっきり楽しんでくださいね、にゃんにゃん！"
"10045025-28-キキョウ" = "……嘘でしょ。"
