[translation]
"10045070-1" = "第7話;百花繚乱 vs 百花繚乱"
"10045070-2-ナグサ" = "勝てたのはユカリのお陰だね。"
"10045070-3-ユカリ" = "とんでもありません！身共とナグサ先輩、二人で掴んだ勝利ですの！"
"10045070-4-ナグサ" = "……そうだね。"
"10045070-5-ナグサ" = "（人は支え合いながら生きていくもの）"
"10045070-6-ナグサ" = "（一人で全部背負う必要も、自分の弱さを恥じる必要もない）"
"10045070-7-ナグサ" = "（……そうだよね、アヤメ？）"
"10045070-8-ナグサ" = "ユカリ、次の相手はレンゲとキキョウだよ。勝てそう？"
"10045070-9-ユカリ" = "お二人の強さは身共が一番存じておりますの！"
"10045070-10-ナグサ" = "ですが、身共たちのちーむわ～くも負けておりませんわ！"
"10045070-11-ユカリ" = "勝利にこだわりすぎず、最善を尽くすだけですの！"
"10045070-12-ナグサ" = "うん、ユカリらしいね。"
"10045070-13-ナグサ" = "私も、右腕の調子が戻ってきたから。"
"10045070-14-ナグサ" = "悔いのない試合にしようね。"
"10045070-15-ユカリ" = "ええ！もちろんですの！"
"10045070-16-レンゲ" = "キキョウ、作戦を考えよう。"
"10045070-17-レンゲ" = "今までは何とかなったけど、今度の相手は別格だ。"
"10045070-18-キキョウ" = "何かいい案はあるの？"
"10045070-19-レンゲ" = "え、ないけど？作戦参謀はキキョウだろ？頼りにしてるからな！"
"10045070-20-キキョウ" = "……はぁ、まぁ、そうだろうと思った。"
"10045070-21-レンゲ" = "……。"
"10045070-22-キキョウ" = "私の予想が正しければ、ナグサ先輩とユカリは正面突破を狙ってくるはず。"
"10045070-23-キキョウ" = "奇策やトリックを仕掛けてくることはないだろうね。何故なら……。"
"10045070-24-レンゲ" = "それこそ、キキョウが一番苦手とする戦い方だから。"
"10045070-25-キキョウ" = "そう。奇策の真骨頂は奇襲。#n真正面から勢いで押されたら、どうしたって分が悪い。"
"10045070-26-キキョウ" = "となると、私たちがやるべきことも一つだけ。"
"10045070-27-レンゲ" = "真っ向勝負ってことか。"
"10045070-28-キキョウ" = "奇抜な作戦があまり意味をなさないのなら――"
"10045070-29-キキョウ" = "少しでも「チームワーク」の優れたほうが勝つ。"
"10045070-30-レンゲ" = "なら、有利なのはアタシらだな！"
"10045070-31-キキョウ" = "……どうして？"
"10045070-32-レンゲ" = "お前と何年一緒にいると思ってんだ？#nチームワークなら、他の誰にも負けないさ。"
"10045070-33-レンゲ" = "レンゲ……。"
"10045070-34-レンゲ" = "お前とアタシが組むんだ。勝てるよ。"
"10045070-35-キキョウ" = "……。"
"10045070-36-キキョウ" = "あんたは本当に……。"
"10045070-37-キキョウ" = "分かった。作戦を考える。"
"10045070-38-キキョウ" = "私とあんただから実現できる作戦を。"
"10045070-39-レンゲ" = "ああ、よろしくな！"
"10045070-40" = "しばらくして……。"
"10045070-41-シズコ" = "涙あり、ドラマありの敗者復活戦もいよいよ決勝戦！"
"10045070-42" = "[ns] \"本戦への切符を手にするのは、どちらのチームか！\""
"10045070-43-レンゲ" = "師匠はどっちが勝つと思ってるんだろう？"
"10045070-44-キキョウ" = "余計なことは考えないの。"
"10045070-45-キキョウ" = "相手に集中して。"
"10045070-46-レンゲ" = "いい表情じゃん。調子が戻ってきたみたいだね。"
"10045070-47-ナグサ" = "参ったな……二人とも、目つきが変わったね。"
"10045070-48-ユカリ" = "覚悟を決めたのは、身共たちも同じですの！"
"10045070-49-ユカリ" = "皆様に御覧に入れて差し上げましょう。"
"10045070-50-ユカリ" = "百花繚乱の名に恥じない――真剣勝負を！"
"10045070-51-シズコ" = "それでは試合を始めますっ！"
"10045070-52" = "[ns] \"最初のサーブはナグサ選手のようですね。\""
"10045070-53-シズコ" = "強力なスパイクサーブがさく裂！果たして受け止められるのか！"
"10045070-54-キキョウ" = "レンゲ！"
"10045070-55-レンゲ" = "あいよっ……！"
"10045070-56" = "[ns] \"危なげなくサーブを受け止めました！\""
"10045070-57-キキョウ" = "「零式」いくよ！"
"10045070-58-レンゲ" = "任せろっ！"
"10045070-59-ユカリ" = "零式、とは……！？"
"10045070-60-レンゲ" = "はあぁぁっ！！！"
"10045070-61-ユカリ" = "……！！"
"10045070-62-シズコ" = "あっと、キキョウ選手の正確なトスに続いて、レンゲ選手の時間差攻撃！#nナグサ選手、釣られて反応してしまいました！"
"10045070-63-ユカリ" = "やられた……！"
"10045070-64-ユカリ" = "身共がおりますの！"
"10045070-65-ユカリ" = "あいたぁーっ！！"
"10045070-66-レンゲ" = "これを受けるの……！？"
"10045070-67-レンゲ" = "さすがユカリ！そうこなくっちゃ！"
"10045070-68-ナグサ" = "お返し……！"
"10045070-69-レンゲ" = "今度は私が……！"
"10045070-70-レンゲ" = "頼んだ！"
"10045070-71-レンゲ" = "くっ……！"
"10045070-72-レンゲ" = "ナイスレシーブ！#n次は――青春Sだ！"
"10045070-73-キキョウ" = "せ、せいしゅん――"
"10045070-74-レンゲ" = "恥ずかしがってんのか！？"
"10045070-75-キキョウ" = "せ、青春S！！！"
"10045070-76-シズコ" = "鋭いスパイクが一直線！止められるか……！？"
"10045070-77-ユカリ" = "……！！"
"10045070-78-ユカリ" = "あっ！！"
"10045070-79-シズコ" = "ビーチに突き刺さりました！得点ですっ！"
"10045070-80" = "[ns] \"空いたスペースを狙い撃ちするスパイクだったね！\""
"10045070-81-ナグサ" = "キキョウ……迷いはなくなったの？"
"10045070-82-キキョウ" = "……素直になるって決めた。"
"10045070-83-キキョウ" = "どんな私でも、信じて応援してくれる人がそばにいる――そのことを、思い出せたから。"
"10045070-84-キキョウ" = "[ruby=みんな]百花繚乱[/ruby]のおかげだよ。"
"10045070-85-ナグサ" = "頼もしい作戦参謀だね。"
"10045070-86-ユカリ" = "ここからが本当の勝負ですの！"
"10045070-87-レンゲ" = "望むところだ！手加減なしでいくよ！"
"10045070-88-キキョウ" = "こちらこそ。"
"10045070-89-ナグサ" = "やっと右腕も温まってきたところだから。"
"10045070-90-キキョウ" = "そういうの、中二病っぽいからやめてって……。"
"10045070-91-シズコ" = "何やら大事なお話をしていたようですが……。"
"10045070-92-シズコ" = "どこか、選手の皆さんの顔が晴れやかになっているように見えます！"
"10045070-93" = "（白熱した接戦はデュースにもつれ込み……）"
"10045070-94" = "（気づけばスコアボードは20対20を示していた）"
"10045070-95-シズコ" = "きっ、決まったー！"
"10045070-96-シズコ" = "敗者復活の権利を獲得したのは……！"
