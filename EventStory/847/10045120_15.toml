[translation]
"10045120-1" = "エピローグ;物語の幕引き"
"10045120-2" = "春#nが#n炎#nゆ"
"10045120-3" = "夏#nの#n終#nわ#nり#nに"
"10045120-4" = "秋#nの#n風"
"10045120-5" = "[log=치세 수영복]春が炎ゆ[/log]"
"10045120-6" = "[log=치세 수영복]夏の終わりに[/log]"
"10045120-7" = "[log=치세 수영복]秋の風[/log]"
"10045120-8" = "（結局、会場全体が大爆発を起こし、海の底へ沈んだ）"
"10045120-9" = "（そのままにするわけにもいかず、みんなで後片付けをすることになった……）"
"10045120-10-シズコ" = "会場は壊れちゃったけど……終わり良ければすべて良し！"
"10045120-11-フィーナ" = "その通りデス！胸アツなお祭りデシタ！"
"10045120-12-ウミカ" = "皆さん、お疲れ様でした。#n片付けまで手伝っていただいて、本当にありがとうございます。"
"10045120-13-ナグサ" = "楽しませてもらったから、これくらいはさせてもらわないと。#n後輩が優勝してるんだし。"
"10045120-14-イズナ" = "優勝はアタシだけじゃないからな？"
"10045120-15-イズナ" = "その通り！レンゲ殿との同時優勝です！"
"10045120-16-レンゲ" = "決着がつかなかったのだけは残念だけど、楽しいお祭りだったよ。"
"10045120-17-イズナ" = "イズナも同じ気持ちです！"
"10045120-18-ユカリ" = "本戦だけでなく、エキシビションマッチも大盛り上がりでしたわ！"
"10045120-19-レンゲ" = "たしかに。"
"10045120-20-レンゲ" = "爆発が無かったらどんな展開になってたんだろうな。"
"10045120-21-ミモリ" = "あら？キキョウさんはどちらに？お姿が見えませんが……。"
"10045120-22-レンゲ" = "たぶん今ごろ、別の場所で残骸を片付けてるんじゃないかな？"
"10045120-23-レンゲ" = "ついでに水泳の特訓もしてたりしてな。"
"10045120-24-キキョウ" = "すー……はー……すー……。"
"10045120-25-キキョウ" = "ぶくぶく……ぱっ……ぶくぶく……ぱっ……！"
"10045120-26-キキョウ" = "（これがレンゲの言ってた「力を抜いて楽しむ」って感覚なのかな？）"
"10045120-27-キキョウ" = "（よし……犬かきなら、もう完璧）"
"10045120-28-キキョウ" = "（そろそろ次のステップに進んでも――）"
"10045120-29" = "[ns1] \"すっごい上手になってるね！\"\n[ns2] \"さすが、飲み込みが早いね！\""
"10045120-30-キキョウ" = "せっ、あぅっ、ぶくぶく……せんせっ！？"
"10045120-31" = "[ns] \"だ、大丈夫！？\""
"10045120-32-キキョウ" = "……！！"
"10045120-33" = "[ns3] \"もう上がっちゃうの？\"\n[ns4] \"ごめん、邪魔しちゃったかな。\""
"10045120-34-キキョウ" = "ちょうどこっちの片付けが終わったところだったから。#n練習もこれでおしまい。"
"10045120-35-キキョウ" = "……何？その表情。私の恥ずかしい姿をもっと見たかったとか？"
"10045120-36" = "[s5] \"恥ずかしくなんてないよ。\"\n[s6] \"キキョウは弱点を克服したんだから。\""
"10045120-37-キキョウ" = "この程度じゃまだまだだよ。"
"10045120-38-キキョウ" = "でも、今回の件で色々と学んだことがあるの。"
"10045120-39-キキョウ" = "これからはできないことがあったら、意地を張らずに素直に話すようにする。"
"10045120-40-キキョウ" = "こんな私でも、一番に応援してくれる仲間がいるって分かったから。"
"10045120-41-キキョウ" = "言っておくけど……この話、秘密だからね？分かってる？"
"10045120-42" = "[s] \"もちろん！その代わり、私とも一緒に水泳の練習をして欲しいな！\""
"10045120-43-キキョウ" = "な、なんで……？"
"10045120-44-キキョウ" = "……仕方ない。秘密をばらされるわけにはいかないし。"
"10045120-45-レンゲ" = "おっ、キキョウ！先生と一緒に泳ぐのか？"
"10045120-46-キキョウ" = "レンゲ！？"
"10045120-47-ユカリ" = "みんなで泳ごうか。片付けも終わったし。"
"10045120-48-ユカリ" = "ですのー！"
"10045120-49-レンゲ" = "よし！あそこの岩まで競争だ！"
"10045120-50-レンゲ" = "あっ、そうだ、先生。#nさっきの紹介文書いたのって先生だよな？"
"10045120-51-レンゲ" = "覚悟しておけよ！"
"10045120-52-キキョウ" = "あぁ、そういえば。"
"10045120-53" = "[ns7] \"ふふふっ、その通り！\"\n[ns8] \"バレてしまっちゃぁ仕方ない！\""
"10045120-54" = "[ns] \"捕まえられるものなら、捕まえてごらん！\""
"10045120-55-キキョウ" = "ふふっ、その余裕、いつまでもつかな……？"
"10045120-56-ユカリ" = "では皆様、いち、にの、さんでスタートですの！"
"10045120-57-レンゲ" = "い～ち！"
"10045120-58-レンゲ" = "に～！"
"10045120-59" = "[ns] \"さんっ！\""
"10045120-60" = "どこまでも澄んだ青い空に、じりじりと照りつける太陽。#n夏は、ここにある。"
"10045120-61" = "これは、友情と青春が織りなす、ひと夏の物語――"
"10045120-62" = "百ヨリ出ズル一輪ノ～いざ尋常に、水上勝負～"
