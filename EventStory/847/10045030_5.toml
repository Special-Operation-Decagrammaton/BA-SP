[translation]
"10045030-1" = "第3話;第二回戦：暴走ジェットボート"
"10045030-2-ナグサ" = "そろそろ機嫌なおしなよ。"
"10045030-3-ナグサ" = "気分転換に何か食べる？"
"10045030-4-キキョウ" = "……今はいい。"
"10045030-5-キキョウ" = "焼き鳥は後でにする。"
"10045030-6-ナグサ" = "……焼き鳥をあげるとは言ってないよ。"
"10045030-7-ナグサ" = "もぐもぐ。"
"10045030-8-キキョウ" = "食べながら言われても説得力ないんだけど……。"
"10045030-9-キキョウ" = "……やっぱり、私にも一本ちょうだい。"
"10045030-10-キキョウ" = "少しでも体力を回復しておかないと。"
"10045030-11-キキョウ" = "（ボートの上で耐えるにはどうすれば……）"
"10045030-12-ナグサ" = "はい、どうぞ。"
"10045030-13-ユカリ" = "この焼き鳥、絶品ですの！"
"10045030-14-レンゲ" = "一応、ボートを見ておかないか？#n焼き鳥なら食べ歩きもできるし。"
"10045030-15-レンゲ" = "あれかな？"
"10045030-16-ユカリ" = "こんなに豪快なボートに乗るのは初めてですの！"
"10045030-17" = "[ns1] \"一回戦突破おめでとう。\"\n[ns2] \"みんなも下見かな？\""
"10045030-18-キキョウ" = "このボート……本当に安全なの？"
"10045030-19-キキョウ" = "水に落ちたら、すぐに助けてもらえるんでしょうね？"
"10045030-20" = "[s3] \"うん。ライフセーバーが待機してるし、\"\n[s4] \"いざという時の備えはしてあるから安心してね。\""
"10045030-21-ユカリ" = "……だといいけど。"
"10045030-22-キキョウ" = "（泳げなくてもどうにか誤魔化せそう……）"
"10045030-23-レンゲ" = "なんだよ？落ちるのが怖いのか？"
"10045030-24-キキョウ" = "そ、そんなわけないじゃない。"
"10045030-25-キキョウ" = "作戦参謀の役目は、あらゆる状況に備えること。#nそれを忘れたわけじゃないでしょう？"
"10045030-26-キキョウ" = "それに、前の試合で私たちを妨害してきた連中もそのまま残ってる。"
"10045030-27-キキョウ" = "また何か仕掛けてくるかもしれない。"
"10045030-28" = "[s5] \"それはどうだろうね。\"\n[s6] \"自分のことで精一杯じゃないかな？\""
"10045030-29-キキョウ" = "……そもそも落ちないでいるのが難しいってことね。"
"10045030-30-ユカリ" = "それなら、こういうのはいかがでしょうか？"
"10045030-31-ユカリ" = "腕を組んで、安全バーをしっかり掴む！これで安心ですわ！"
"10045030-32-キキョウ" = "おっ、楽しそうだな！いいんじゃないか？"
"10045030-33-キキョウ" = "水着で密着なんて……。#nでも、他に方法はなさそうね。"
"10045030-34-ナグサ" = "私が一番左に座って、レンゲが一番右。"
"10045030-35-ナグサ" = "ユカリとキキョウは真ん中に座るのでどうかな。"
"10045030-36-キキョウ" = "ナグサ先輩が両腕を使えるからこその作戦だね！"
"10045030-37-キキョウ" = "まだ本調子じゃないって言ってなかった？"
"10045030-38-キキョウ" = "これぐらいなら、もう大丈夫。"
"10045030-39-レンゲ" = "ふふっ、見せてあげる……黄昏の影に眠りし真の力を。"
"10045030-40-レンゲ" = "本気で心配になるからやめて……。"
"10045030-41-ユカリ" = "ともかく、これで準備は万全ですわ！二回戦も全員で突破いたしましょう！"
"10045030-42" = "しばらくして……。"
"10045030-43-シズコ" = "さぁ！第二回戦の準備が整ったようです！"
"10045030-44-シズコ" = "予告通り、今回の種目は暴走するジェットボート！"
"10045030-45-シズコ" = "30人の選手が2台のジェットボートに分かれて乗り、最後の10人が残るまで無限にダイブとドリフトが繰り返されます！"
"10045030-46-シズコ" = "運転は次第に荒く……ワイルドになっていきますので、吹っ飛ばされないよう気をつけてくださいね、にゃんにゃん！"
"10045030-47" = "[ns] \"選手一同、乗船！\""
"10045030-48-ナグサ" = "作戦は覚えてる？腕を組んで安全バーをしっかり掴むこと。"
"10045030-49-ユカリ" = "はい！もちろんですの！"
"10045030-50-シズコ" = "準備はよろしいですね～？"
"10045030-51-シズコ" = "第二回戦、暴走ジェットボート……！"
"10045030-52" = "[ns] \"始めっ――！！\""
"10045030-53-レンゲ" = "うわっ！？速っ！？"
"10045030-54-ユカリ" = "きゃあああああああああぁぁぁぁっ！！"
"10045030-55-ナグサ" = "できるだけ密着して！支えあわないと……！"
"10045030-56-レンゲ" = "こんなデタラメな……！！"
"10045030-57-レンゲ" = "キキョウ！もっとしっかりアタシの身体に掴まれ……！"
"10045030-58-レンゲ" = "あり……がとう！"
"10045030-59-レンゲ" = "れ、レンゲの背中……意外と柔らかいのね。"
"10045030-60-レンゲ" = "こっち背中じゃないんだけど！？"
"10045030-61-レンゲ" = "あ……ごめん。"
"10045030-62-レンゲ" = "謝るなよ！"
"10045030-63-ユカリ" = "きゃあああああんっ！！"
"10045030-64-キキョウ" = "きゃっ……！#nユ……ユカリ、それ、私の尻尾……！"
"10045030-65-ユカリ" = "し、失礼いたしました！#nですが身共、手を離すと落ちて――"
"10045030-66-キキョウ" = "で、でも、そこは……っ！"
"10045030-67-ユカリ" = "申し訳ないですのおおお……！！"
"10045030-68-キキョウ" = "だ、大丈夫……どうにか耐えるから……ああっ……！"
"10045030-69-ナグサ" = "みんなの力を一つに……！"
"10045030-70-キキョウ" = "こんな形で一つになりたくはなかったんだけど……！"
"10045030-71-レンゲ" = "これが青春だーっ！"
"10045030-72-シズコ" = "次々と悲鳴が上がってます……！"
"10045030-73-シズコ" = "誰だよ！こんな無茶苦茶な種目を考え――ブクブクブク。"
"10045030-74-シズコ" = "ぎゃああああっ！！"
"10045030-75-シズコ" = "水しぶきを上げながら、続々と脱落者が出ております！"
"10045030-76-シズコ" = "最後まで、しっかり見届けてくださいね、にゃんにゃん！"
