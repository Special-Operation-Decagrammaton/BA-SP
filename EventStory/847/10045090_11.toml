[translation]
"10045090-1" = "第9話;最終戦：押し出しゲーム"
"10045090-2-シズコ" = "皆さ～ん！まずは、100人から勝ち残った4人に拍手を！"
"10045090-3-シズコ" = "そしてここからは……4人が1人になる戦い……！#nその第1試合が始まります！"
"10045090-4-シズコ" = "青コーナー！神機妙算な策で相手を翻弄する、百花繚乱の作戦参謀！"
"10045090-5-シズコ" = "水が苦手という噂は本当なのか！？[ruby=きりゅう]桐生[/ruby]キキョウ！"
"10045090-6-キキョウ" = "誰？その噂流してるの。"
"10045090-7-キキョウ" = "続いて赤コーナー！百花繚乱の突撃隊長にして猪突猛進の鬼教官！"
"10045090-8-シズコ" = "ピンク色のハートで青春を追いかけるのは……[ruby=ふわ]不破[/ruby]レンゲ！"
"10045090-9-レンゲ" = "……誰だよ、この紹介文書いたの。"
"10045090-10" = "[ns] \"…………！？\""
"10045090-11-シズコ" = "先生？どうかしました？"
"10045090-12" = "[s] \"あ、いや、急に寒気がしただけ……。\""
"10045090-13-シズコ" = "そうですか……？"
"10045090-14-シズコ" = "まぁ、気を取り直して！選手のお二方。準備はよろしいですね……？"
"10045090-15-シズコ" = "いざ尋常に～#n――勝負！"
"10045090-16-レンゲ" = "……何だよ、仕掛けてこないのか？"
"10045090-17-キキョウ" = "それはこっちのセリフ。#n丸腰の私なんて怖くないでしょう？"
"10045090-18-レンゲ" = "へっ、無策のやつがそんな目するかよ。"
"10045090-19-レンゲ" = "……やっぱり諦めてなかったんだな？"
"10045090-20-キキョウ" = "……真剣勝負がしたいって言ったのはあんたでしょ？#nなら、それに応えるのが「友達」だからね。"
"10045090-21-レンゲ" = "じゃ、正々堂々戦って、勝ちをもらうとしようかな。"
"10045090-22-キキョウ" = "さあ？それはどうだろうね。"
"10045090-23-レンゲ" = "ふぅん？"
"10045090-24-キキョウ" = "御託はもういいよ。来ないならこっちから行くけど。"
"10045090-25-レンゲ" = "そうこなくっちゃ。それなら――"
"10045090-26-レンゲ" = "直接確かめてやるよ……！"
"10045090-27-シズコ" = "さぁ始まりましたーっ！"
"10045090-28-レンゲ" = "へぇ、意外とやるじゃん。#n部屋で本ばっか読んでたやつの力じゃないな？"
"10045090-29-キキョウ" = "体力作りぐらい、私だってしてるから。"
"10045090-30-キキョウ" = "それに……力さえ上回れば私に勝てると思った？#n本当、昔から何も変わらないね。"
"10045090-31-レンゲ" = "昔？どのぐらい昔だ？"
"10045090-32-キキョウ" = "あれは七歳の時……#n一緒にブランコに乗って、どっちが高く漕げるか競争したよね。"
"10045090-33-レンゲ" = "……え？"
"10045090-34-キキョウ" = "結果は私の勝ち。#nだってあなた、力任せに漕いでるだけだったもの。"
"10045090-35-キキョウ" = "罰ゲームはたしか……一週間、お菓子を買いに行かされてたんだっけ。"
"10045090-36-レンゲ" = "い、いつの話をしてるんだよ！？"
"10045090-37-キキョウ" = "……今だけど！"
"10045090-38-レンゲ" = "ぐっ！？"
"10045090-39-シズコ" = "ここでキキョウ選手の足払いが決まったぁ！#nレンゲ選手、倒れてしまいました！"
"10045090-40-キキョウ" = "このまま決めさせてもらうよ。"
"10045090-41-シズコ" = "キキョウ選手、畳みかけます！#n寝技に持ち込まれたレンゲ選手、これは少々苦しいか～？"
"10045090-42" = "[ns] \"相手の動きを封じて、じわじわと体力を奪う作戦だ！\""
"10045090-43-シズコ" = "まるでこんがらがった糸のように相手を絡めとる動き！#nもがくレンゲ選手ですが抜け出せません！"
"10045090-44-レンゲ" = "くっ、なかなかやるじゃん……！"
"10045090-45-レンゲ" = "でも、これで終わっちゃいられないよなっ……！"
"10045090-46-キキョウ" = "完璧に押さえこんだと思ったのに。"
"10045090-47-レンゲ" = "お前から学んだんだよ、頭を使って力を温存する方法をな。"
"10045090-48-レンゲ" = "それに、何を狙ってんのかも見ておきたかったし。"
"10045090-49-キキョウ" = "……レンゲも成長してるんだね。"
"10045090-50-レンゲ" = "さっきの技、トライアングルチョークだったか？#nまさかあんな技まで仕込んでるとは思わなかったよ。"
"10045090-51-キキョウ" = "あれは「あやとり」の応用よ。"
"10045090-52-レンゲ" = "あんな「あやとり」があるかぁ！！"
"10045090-53-キキョウ" = "複雑に絡み合うって意味では、似てるかも？"
"10045090-54-レンゲ" = "……まぁ、そういうことにしてあげるよ。"
"10045090-55-レンゲ" = "で、次はどうするつもりだ？#n忠告しておくけど、同じ手は食わないからな？"
"10045090-56-ユカリ" = "キキョウ先輩……戦うことを選んだんですのね。"
"10045090-57-ユカリ" = "チームじゃなくて、自分のために戦ってる。嬉しいね。"
"10045090-58-ユカリ" = "ですが、このまま持久戦になったら、やはりレンゲ先輩のほうが有利でしょうか……。"
"10045090-59-ユカリ" = "状況的にはそうだね。"
"10045090-60-ユカリ" = "でも……キキョウにとってはそうじゃないかもしれない。#nなにせキキョウは――"
"10045090-61-ユカリ" = "百花繚乱の作戦参謀！"
"10045090-62-ユカリ" = "きっと奇策を駆使してレンゲ先輩の隙を突くはずですの！"
"10045090-63-キキョウ" = "……こういうのはどう？"
"10045090-64-レンゲ" = "どこ踏んでるのさ。そこには何も……。"
"10045090-65-レンゲ" = "うわっ！？"
"10045090-66-シズコ" = "キキョウ選手！浮き島を揺らしてレンゲ選手の体勢を崩しましたっ！"
"10045090-67-キキョウ" = "このまま押し出す……！"
"10045090-68-レンゲ" = "させないよ……！！"
"10045090-69-キキョウ" = "はぁ……はぁ……。"
"10045090-70-レンゲ" = "ふうぅぅぅ……。"
"10045090-71-レンゲ" = "……なあ、どうして急に本気で戦う気になったんだ？"
"10045090-72-キキョウ" = "レンゲが真剣に戦いたいって言ったから。"
"10045090-73-レンゲ" = "それだけじゃないだろ？"
"10045090-74-キキョウ" = "それは……。"
"10045090-75-レンゲ" = "……諦めたくなかったの。もう、私一人の戦いじゃない。"
"10045090-76-レンゲ" = "……どういう意味だ？"
"10045090-77-キキョウ" = "もちろん、最初は棄権しようと思ってた。"
"10045090-78-キキョウ" = "ここでレンゲに勝ちを譲れば、百花繚乱としては優勝に近づくから。"
"10045090-79-キキョウ" = "でも……よくよく考えたら、それじゃダメだって気づいたの。"
"10045090-80-キキョウ" = "……みんなが、こんな私を応援してくれた。"
"10045090-81-キキョウ" = "ナグサ先輩、ユカリ。"
"10045090-82-キキョウ" = "力を貸してくれたみんな。"
"10045090-83-キキョウ" = "先生と、たくさんの観客。"
"10045090-84-キキョウ" = "あとは……レンゲ、あんたも。"
"10045090-85-キキョウ" = "私は自分の弱さを隠すために必死になってた。#nそれでも、そんな私をみんなは応援してくれた。"
"10045090-86-キキョウ" = "だから……最後まで諦めない。"
"10045090-87-キキョウ" = "百花繚乱の誇りにかけて。"
"10045090-88-キキョウ" = "私を信じてくれたみんなに応えるために。"
"10045090-89-キキョウ" = "レンゲと私――みんなとの「友情」のために。"
"10045090-90-レンゲ" = "そう！それだよそれ！#nやっとらしくなってきたじゃん！"
"10045090-91-レンゲ" = "それじゃ、続きをやろうか。こっからは……。"
"10045090-92-レンゲ" = "青春の時間だよ！"
"10045090-93-シズコ" = "す、凄まじい戦いです！目が追い付きません……！"
"10045090-94" = "[ns1] \"「力」のレンゲか！\"\n[ns2] \"「技」のキキョウか！\""
"10045090-95-キキョウ" = "くっ……！"
"10045090-96-レンゲ" = "これで……決める！"
"10045090-97-キキョウ" = "絶対に……負けない！"
"10045090-98-ナグサ" = "あれは……！"
"10045090-99-ユカリ" = "なんと……！！"
"10045090-100-シズコ" = "この勝負の行方は……！？"
"10045090-101-シズコ" = "勝者は……！"
"10045090-102" = "[ns] \"[ruby=ふわ]不破[/ruby]レンゲ……！\""
"10045090-103-キキョウ" = "（……）"
"10045090-104-キキョウ" = "（……そっか。負けちゃったんだ、私）"
"10045090-105-キキョウ" = "（体が重い。このまま、海の底へ沈んでいくみたい……）"
"10045090-106-キキョウ" = "（……でも、ここで終わるわけにはいかない。#nレンゲに教えてもらったんだから）"
"10045090-107-キキョウ" = "（証明するんだ。私も、やればできるんだって……！）"
"10045090-108-キキョウ" = "ぷはぁっ……！"
"10045090-109-レンゲ" = "おっ、うまくなってるじゃん！"
"10045090-110-キキョウ" = "ふうぅぅぅ……。"
"10045090-111-レンゲ" = "これで、もう水は怖くないな。"
"10045090-112-キキョウ" = "うん、まだぎこちないけど。"
"10045090-113" = "[ns] \"二人とも、最高だったよ！\""
"10045090-114-ユカリ" = "感動的な試合でしたわ……！"
"10045090-115-ナグサ" = "本当にお疲れ様。"
"10045090-116-キキョウ" = "みんな……ありがとう。"
