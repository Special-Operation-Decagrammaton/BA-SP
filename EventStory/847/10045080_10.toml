[translation]
"10045080-1" = "第8話;互いの矜持"
"10045080-2-ナグサ" = "もぐもぐ……。"
"10045080-3-ナグサ" = "いい勝負のあとの焼き鳥は格別だね。"
"10045080-4-ユカリ" = "ええ、悔いはありませんの！"
"10045080-5-チセ" = "イズナもビーチバレーやりたかったです……！"
"10045080-6-ミモリ" = "では、後で一緒にやりませんか？"
"10045080-7-チセ" = "賛成～"
"10045080-8-イズナ" = "なんとっ！今から楽しみです！！"
"10045080-9-百鬼夜行サークル部員A" = "あの……私も混ぜてもらったり……？"
"10045080-10-ナグサ" = "もちろん。次は一緒のチームにする？"
"10045080-11-百鬼夜行サークル部員A" = "こっ、光栄です！"
"10045080-12-ユカリ" = "ところで、レンゲ先輩とキキョウ先輩はどちらに行かれたのでしょう？"
"10045080-13-ユカリ" = "試合が終わった後からお姿が見えませんが……。"
"10045080-14-ナグサ" = "ああ、二人なら……。"
"10045080-15-ナグサ" = "水泳の猛特訓中だよ。"
"10045080-16-シズコ" = "敗者復活の権利を獲得したのは……！"
"10045080-17-シズコ" = "レンゲ・キキョウチームですっ！"
"10045080-18-キキョウ" = "やった……私たち、勝ったんだ……！"
"10045080-19-レンゲ" = "よし、それじゃ約束を果たしに行こうか？"
"10045080-20-キキョウ" = "約束？あ……。"
"10045080-21-レンゲ" = "そう！今から水泳の特訓だ！"
"10045080-22-キキョウ" = "今すぐ……！？"
"10045080-23-レンゲ" = "ほら、行くよ！"
"10045080-24-ユカリ" = "ふふ、キキョウ先輩ならきっとすぐ泳げるようになるはずですの！"
"10045080-25-ユカリ" = "うん。"
"10045080-26-ユカリ" = "キキョウなら、大丈夫。"
"10045080-27-キキョウ" = "ぷっ、ぷはっ……！"
"10045080-28-レンゲ" = "もっと腕と脚を大きく動かして！体の力を抜いて！"
"10045080-29-キキョウ" = "力を抜いて動けだなんて……矛盾したことできるわけないでしょ！？"
"10045080-30-レンゲ" = "自然に逆らわず、流れに身を任せるのが大事なんだ。#n泳ぐっていうのは、そういうこと！"
"10045080-31-レンゲ" = "コツさえ掴めばすぐだよ！"
"10045080-32-レンゲ" = "慣れてきたら、もっとかっこいい泳ぎ方も教えてあげるからな！"
"10045080-33-キキョウ" = "ん？もっとかっこいい……？"
"10045080-34-キキョウ" = "レンゲ、聞いてなかったけど、これは何ていう泳ぎ方なの？"
"10045080-35-キキョウ" = "うん？ああ、これはね――"
"10045080-36-レンゲ" = "犬かき！"
"10045080-37-キキョウ" = "犬かき。"
"10045080-38-キキョウ" = "……え？"
"10045080-39-キキョウ" = "犬かき……！？"
"10045080-40-キキョウ" = "百花繚乱の作戦参謀たる私が……犬かきを練習していた……！？"
"10045080-41-レンゲ" = "そんなこと気にしてる場合じゃないだろ？基本が大事なんだから！"
"10045080-42-キキョウ" = "犬かき……私が犬かき……。"
"10045080-43-レンゲ" = "敗者復活戦の盛り上がりも冷めやらぬ中ではありますが――"
"10045080-44-レンゲ" = "間もなく、決勝戦の種目と対戦カードの発表を行いますっ！"
"10045080-45-レンゲ" = "選手の皆さんは、競技場まで集合してください～！にゃんにゃん！"
"10045080-46-レンゲ" = "決勝戦、水に入る種目じゃないといいな……。"
"10045080-47-キキョウ" = "もしそうなら……犬かきで乗り切るしか……。"
"10045080-48-キキョウ" = "とにかく行こう。遅れるのが一番良くない。"
"10045080-49" = "しばらくして……。"
"10045080-50-シズコ" = "泣いても笑ってもこれが最後……#n決勝戦の種目と対戦カードの発表を行いますっ！"
"10045080-51-シズコ" = "まずは種目の発表から！"
"10045080-52" = "[ns] \"百夜水上祭のトリを飾る種目は……！\""
"10045080-53" = "[log]押し出しゲーム！[/log]"
"10045080-54-シズコ" = "浮き島の上から相手を押し出したら勝ち！海に落ちたら負けです！"
"10045080-55-シズコ" = "武器の使用は一切禁止！体一つでの勝負になります～！"
"10045080-56-シズコ" = "小細工無しの一本勝負です！"
"10045080-57-レンゲ" = "おぉ……負けたら犬かき確定だな。"
"10045080-58-キキョウ" = "（波に揺れる浮き島の上で、武器なしの直接対決……）"
"10045080-59-キキョウ" = "（水中戦じゃないのは助かるけど、誰と当たっても私には不利……）"
"10045080-60-シズコ" = "それでは、これより対戦カードを決定します～！"
"10045080-61-シズコ" = "選手の皆さん、この箱の中からボールを一つずつ引いてくださ～い。"
"10045080-62-シズコ" = "ボールには1と2の番号が書かれています。#n同じ番号を引いた人が初戦の相手となります！"
"10045080-63" = "[ns] \"最初はイズナ選手！\""
"10045080-64-イズナ" = "はいっ！主殿！"
"10045080-65-イズナ" = "どれにしようかな～？#n……これです！"
"10045080-66-イズナ" = "おおっ！イズナは2番です！"
"10045080-67" = "[ns] \"次はレンゲ選手！\""
"10045080-68-レンゲ" = "う～ん……。決めたっ！"
"10045080-69-レンゲ" = "おっ、アタシは1番か。"
"10045080-70" = "[ns] \"続いてチセ選手！\""
"10045080-71-チセ" = "どっちかな～？"
"10045080-72-チセ" = "あ、2番～"
"10045080-73" = "[ns] \"となるとキキョウ選手は……。\""
"10045080-74-キキョウ" = "……1番。"
"10045080-75-シズコ" = "はい！これで対戦カードが決まりました～！"
"10045080-76-シズコ" = "第1試合はキキョウ選手対レンゲ選手！"
"10045080-77-シズコ" = "第2試合はイズナ選手対チセ選手！"
"10045080-78-シズコ" = "そして各試合の勝者が決勝戦で対決しますっ……！"
"10045080-79-ユカリ" = "いきなりぶつかるなんてね。"
"10045080-80-ユカリ" = "お二人が決勝戦で戦うお姿を観たかったですの……。"
"10045080-81-ユカリ" = "ちょっと残念かな。"
"10045080-82-ユカリ" = "ナグサ先輩は……どちらが勝つとお考えですの？"
"10045080-83-ユカリ" = "……レンゲが有利だとは思う。"
"10045080-84-ユカリ" = "それに、仮にキキョウが決勝まで進んだとしても、勝つのは厳しいだろうね。"
"10045080-85-ナグサ" = "イズナさんは忍者だし……。"
"10045080-86-ナグサ" = "チセさんは……前回大会の優勝者だから。"
"10045080-87-ユカリ" = "ええっ！そうだったんですの！？"
"10045080-88-ナグサ" = "でも、それは本人が一番よく分かっているはず。となれば……。"
"10045080-89-ナグサ" = "勝負を捨てて、レンゲに譲る可能性が高い。"
"10045080-90-ユカリ" = "つまり、キキョウ先輩はわざと負けるおつもりなんですの……？"
"10045080-91-ナグサ" = "キキョウはチームのためなら、自分を犠牲にする覚悟がある子だよ。"
"10045080-92-ユカリ" = "それは……。"
"10045080-93-ナグサ" = "それに、幼馴染とは本気で戦いにくいものだからね。#nキキョウが試合を譲る理由はたくさんあるんだよ。"
"10045080-94-ナグサ" = "もちろん、個人的にはキキョウが全力を尽くす姿を見たいと思ってる。"
"10045080-95-ナグサ" = "でも……それを決めるのはあの子自身だから。"
"10045080-96-ユカリ" = "キキョウ先輩……。"
"10045080-97-レンゲ" = "なあ、まさかとは思うけど……変なこと考えてないよな？"
"10045080-98-キキョウ" = "……そういうのはむしろあんたの得意分野でしょう？"
"10045080-99-キキョウ" = "最近は師弟モノの小説にハマってるんだっけ？"
"10045080-100-レンゲ" = "ど、どうしてそれを知ってるんだ……！？"
"10045080-101-レンゲ" = "……いや、そうじゃなくて！#nちゃんと戦うつもりはあるのかって聞いてんだよ。"
"10045080-102-キキョウ" = "レンゲは、私と戦いたいの？"
"10045080-103-レンゲ" = "ズルするのが嫌なだけだよ。"
"10045080-104-キキョウ" = "ズル？これは作戦。#n決勝ならともかく、ここで私たちが本気で戦うのは得策じゃない。"
"10045080-105-キキョウ" = "決勝に行けるのが確定してるなら、#n少しでも余力を残しておいたほうがいい。"
"10045080-106-キキョウ" = "後はどっちが進むかを決めるだけ。"
"10045080-107-キキョウ" = "私と、あんた。この種目で見込みがあるのはどっちか。"
"10045080-108-キキョウ" = "考えるまでもないでしょ？"
"10045080-109-レンゲ" = "キキョウ……。"
"10045080-110-レンゲ" = "私は百花繚乱が勝つ可能性を最大化したい。"
"10045080-111-レンゲ" = "……それで勝ち進んだって、意味ないじゃん！"
"10045080-112-キキョウ" = "だろうね。あんたならそういうと思った。#n……戦うんでしょう？ほら、準備して。"
"10045080-113-レンゲ" = "ちょっ、話はまだ――"
"10045080-114-キキョウ" = "続きは後でいくらでも聞くよ。"
"10045080-115-キキョウ" = "……あんたは間違いなく、高みに行ける子だから。"
"10045080-116-レンゲ" = "……。"
"10045080-117" = "一方その頃、近くの雑貨店。"
"10045080-118-スケバンリーダー" = "くそっ、くそっ……！"
"10045080-119-スケバンリーダー" = "全部あのタヌキのせいだ！"
"10045080-120-スケバンリーダー" = "組む相手が強けりゃ、こんなことには……。#nきっと運営の奴ら、組み合わせを操作してやがったんだ！"
"10045080-121-スケバンリーダー" = "許せねぇよなぁ……。"
"10045080-122-スケバンリーダー" = "そこのあなた。少しお話を伺いたいのですが。"
"10045080-123-スケバンリーダー" = "はあ？何だよ？ 今忙しいんだ、どっか行――"
"10045080-124-スケバンリーダー" = "……あれ？"
"10045080-125-ワカモ" = "……。"
"10045080-126-スケバンリーダー" = "お、お前は……「災厄の狐」！？なんでこんな所に……！"
"10045080-127-ワカモ" = "どうやら浜辺が騒がしいようで、様子を見に来たのです。"
"10045080-128-ワカモ" = "それはさておき……質問をしていたのは私なのですが……。"
"10045080-129-ワカモ" = "質問に質問で返さないでいただけますか？"
"10045080-130-ワカモ" = "ひっ！わ、分かった！なんでも答えるから！"
"10045080-131-スケバンリーダー" = "（こ、こいつをうまく使えば……私をコケにしたヤツらに一泡吹かせてやれるかもしれねえ！）"
"10045080-132-スケバンリーダー" = "……あっちの浜辺でな、百鬼夜行の最強を決める大会をやってんだ。"
"10045080-133-スケバンリーダー" = "でもあいつら、自分たちに都合がいいように勝敗を操作してやがってよぉ。#nだから、全部ぶち壊してやろうと思って。"
"10045080-134-スケバンリーダー" = "お前も一枚噛まねぇか？お前を差し置いて百鬼夜行の最強を決めるなんておかしいだろ？"
"10045080-135-ワカモ" = "それは……さして興味の湧かない話ですね。"
"10045080-136-スケバンリーダー" = "で、でも「シャーレの先生」とかいうヤツも来て、一緒になって好き勝手やってるって話で！"
"10045080-137-スケバンリーダー" = "お前、それ聞いてムカつかないのかよ？"
"10045080-138-ワカモ" = "今、何と……？"
"10045080-139-ワカモ" = "先生が……いらっしゃるんですか？"
"10045080-140-ワカモ" = "そ、そうだ！その先生が審査員をしてるんだよ！"
"10045080-141-ワカモ" = "先生が「最強」を審査する大会……？#nなぜそれを早く言わないのですか。"
"10045080-142-ワカモ" = "うふふ……うふふふ♡"
"10045080-143-ワカモ" = "あなた様、待っていてくださいね……今、お傍に参ります……！"
"10045080-144-スケバンリーダー" = "おい！待ってくれ！"
"10045080-145-スケバンリーダー" = "……ふっ、ま、どうでもいいか。"
"10045080-146-スケバンリーダー" = "「災厄の狐」を放り込めただけで十分だ。"
"10045080-147-スケバンリーダー" = "よし、私も行って大暴れしてやる！最後に笑うのは、この私だ！"
