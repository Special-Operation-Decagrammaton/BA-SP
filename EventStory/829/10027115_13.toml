[translation]
"10027115-1" = "同人会場"
"10027115-2-タカネ" = "……。"
"10027115-3-タカネ" = "結局、間に合いませんでしたわね……「知識解放戦線」。"
"10027115-4-タカネ" = "ある程度予想はしておりましたが――奇跡は起こらないからこそ、奇跡と呼ぶもの。"
"10027115-5-タカネ" = "仕方がありません。評論家であり、会長として公平さは守るべきもの。"
"10027115-6-タカネ" = "いつかまた、別の機会に縁があることを願って、この辺りで……。"
"10027115-7-メル" = "待って！！！"
"10027115-8-モミジ" = "「知識解放戦線」、ただいま着きました！"
"10027115-9-タカネ" = "……バカな。#n本当に、時間内に原稿を完成させたというのですか！？"
"10027115-10-メル" = "そうだよ……受け取りなさい！"
"10027115-11-タカネ" = "これは、たしかに……！"
"10027115-12-タカネ" = "原稿は、たしかに頂きました。"
"10027115-13-タカネ" = "ですが、正直まだ信じられません……#n途中で何か違法な手段でも使ったのではありませんか？"
"10027115-14-モミジ" = "私たちを一体何だと思ってるの……"
"10027115-15" = "[ns] \"みんな……本当に……一生懸命……頑張ったから……。\""
"10027115-16-タカネ" = "せ、先生！？ここで倒れるのは……！"
"10027115-17" = "[s] \"大丈夫！まだいける！\""
"10027115-18-タカネ" = "……本当に大丈夫なのですよね？"
"10027115-19-メル" = "……先生が手伝ってくれなかったら……#nきっと、完成しなかったと思います。"
"10027115-20-モミジ" = "……ここまで来るだけでも、事務局に、工務部に……はあ……。"
"10027115-21-タカネ" = "事務局と工務部の名前がなぜここで出てくるのか理解できませんが、とにかく分かりました。"
"10027115-22-タカネ" = "そういえば……お二人は、ちゃんと仲直りできたのですね？"
"10027115-23-モミジ" = "そもそも、そんな深刻なケンカじゃなかったし。#nというか、元はと言えば……"
"10027115-24-モミジ" = "……メル先輩？"
"10027115-25-メル" = "……いや、うん。ごめん。#nちゃんと謝って仲直りしたよ……"
"10027115-26-タカネ" = "そうなのですね。まずは、おめでとうと言っておきましょうか。#n原稿の内容とクオリティに関しては……"
"10027115-27-タカネ" = "……。"
"10027115-28-タカネ" = "読まなくても、皆さんの姿を見れば十分察しがつきますわ。"
"10027115-29-メル" = "へん。また素直になれないパターンね。こういう時すっごく分かりやすいのよ、あんた。このメル様にできないとでも思った？ビックリした？感動した？"
"10027115-30-メル" = "流石はメルリー様……私の狭き視野では到底計り知れない、心の広い偉大なお方！……って、驚いてるんでしょう！？"
"10027115-31-タカネ" = "本当に、貴女という人は……！"
"10027115-32-メル" = "うわっ！？最後までそれ！？"
"10027115-33-タカネ" = "貴女もほんっとうに変わりませんわね！"
"10027115-34-メル" = "それ、こっちのセリフだけど！？"
"10027115-35-タカネ" = "少しは成長してくださいな！"
"10027115-36-メル" = "いや、私はいつでも成長中ですけど！？"
"10027115-37" = "[ns1] \"ささ、ちゃんと原稿はできたよ。\"\n[ns2] \"あとは、タカネに見てもらうだけ。\""
"10027115-38-タカネ" = "……お二方が和解した時点で、状況は変わってしまったような気もしますが……"
"10027115-39-タカネ" = "手順は正しく踏まなければ。そして私も、評論家としての役目を全ういたします。"
"10027115-40-タカネ" = "それではメルリーさん。#n貴女の原稿、読ませていただきますわ。"
"10027115-41-？？？" = "ストップ、ストーップ。タンマですよ。"
"10027115-42-タカネ" = "誰……？"
"10027115-43-タカネ" = "あら？"
"10027115-44-ヤクモ" = "いや～やりましたね、メル。#nメルならやってくれると信じてました。"
"10027115-45-タカネ" = "ヤクモ！？"
"10027115-46-タカネ" = "へ、編集長……いえ、部長！？"
