[translation]
"10027120-1" = "第12話;レッドウィンターの平凡なる一日"
"10027120-2-メル" = "ヤクモ！？"
"10027120-3-タカネ" = "へ、編集長……いえ、部長！？"
"10027120-4-ヤクモ" = "友情と努力と根性のストーリー……実に素晴らしかったです。#nどこかに記録でも残しておきたくなるぐらい。それで、ですが……。"
"10027120-5-メル" = "（……なんか嫌な予感。こいつが理由もなく褒めるわけないし……）"
"10027120-6-ヤクモ" = "まずは、あのときお約束した「原稿」の話をしましょうか！"
"10027120-7-モミジ" = "……原稿、ですか？"
"10027120-8-メル" = "えっと……これには事情があって。#nこの間、こいつに原稿の執筆を頼まれたんだよね……。"
"10027120-9-メル" = "（なんでこのタイミングで……？）"
"10027120-10-ヤクモ" = "ちゃんと覚えていたんですね！#nなので……"
"10027120-11-ヤクモ" = "メルの描いた「ルナ22巻」の原稿を、頂いていきますよ！"
"10027120-12-メル" = "えっ！？これはダメだけど！？#nこれは、モミジのために描いたものだし！"
"10027120-13-ヤクモ" = "あれぇ？でも契約書、交わしましたよねぇ？"
"10027120-14-メル" = "それは……！確かに、そうだけど……！"
"10027120-15" = "[s] \"「ルナ」じゃないとダメなの？\""
"10027120-16-ヤクモ" = "ええ。メルさんの「ルナ」でなければ……"
"10027120-17-ヤクモ" = "でも私だって鬼じゃないですよぉ？著作権をくれ、と言っているわけではありません。正式に貸していただけないかと、お願いをしているのです。"
"10027120-18-ヤクモ" = "まぁ……長期譲渡になる可能性も、それなりにありますけどねぇ。"
"10027120-19" = "[s] \"メルが描いた同人誌で、一体何を……？\""
"10027120-20-メル" = "そ、そうだよ！同人誌で何する気？#nまさか……出版でもするの？"
"10027120-21-メル" = "いくら私が幻の「ルナ22巻」の結末を描き上げた素晴らしい同人誌を出したとしても！そんなのアウトだからね！？"
"10027120-22-タカネ" = "……。"
"10027120-23-ヤクモ" = "……。"
"10027120-24-モミジ" = "メル先輩……。"
"10027120-25-メル" = "私、なんか変なこと言った！？"
"10027120-26-ヤクモ" = "私は常識人ですよぉ？二次創作同人原稿を作者に無断で商業出版だなんて……ダメだって分かってますよぉ。"
"10027120-27-メル" = "じゃなきゃ何？どうして私の原稿を……？"
"10027120-28-ヤクモ" = "簡単なお話です。#nまずは今回の騒ぎを振り返りましょう。"
"10027120-29-ヤクモ" = "ことの発端――メルは友人と喧嘩しました。そして仲直りをするために、自分に害となることを知りながら渡された毒を飲み干した。"
"10027120-30-メル" = "……その毒、あんたに渡されたんだけどね。"
"10027120-31-ヤクモ" = "とにかくです。メルはかの有名なシャーレの先生に助力を請い、更には犬猿の仲であるライバルとぶつかり、和解し……認められるための努力を惜しまなかった。その結果……"
"10027120-32-メル" = "あんたんとこの部長でしょ？なんとかしてくんない？"
"10027120-33-タカネ" = "……そう言われましても。部長は元々ああいう方です。突拍子もないことを思いついては実行する……おそらく、今回は……。"
"10027120-34-ヤクモ" = "……訪れたクライマックス、メルは自分のすべてを絞り出して作品を作り上げた……！#nまさに友情とバイオレンス、ハプニングとイベントてんこ盛りの……"
"10027120-35-ヤクモ" = "素晴らしいエンターテインメント！そう思いませんか！？"
"10027120-36" = "[s] \"言われてみれば……たしかに？\""
"10027120-37-メル" = "コラ！そこ同意しない！"
"10027120-38-ヤクモ" = "そこでです。私、[ruby=あらまき]荒槇[/ruby]ヤクモは決めました。そう……実は、メルが出版部に来たその瞬間、頭の中ではすでに百年の計が立っていたのです。"
"10027120-39-ヤクモ" = "涙なしでは見られないメルの大冒険を、レッドウィンターに留まらず、キヴォトスの全生徒に売り飛ば……いえ、見てもらいたいと。"
"10027120-40-ヤクモ" = "この大騒動劇を、必ずや我が出版部の力で、「実写映画化」してみせると！！！"
"10027120-41-モミジ" = "……へ？"
"10027120-42-メル" = "……は？"
"10027120-43-タカネ" = "はい……？"
"10027120-44" = "[ns] \"出版部って、そんなことまでしてるの？\""
"10027120-45-ヤクモ" = "もちろんです。昨今、出版業界と映画業界の協力は主流になってきましたから。ネット小説が映画化したり、逆に人気映画を小説化して出版したり、と。"
"10027120-46-ヤクモ" = "つまりIPの拡張は、時代の流れに応えるマストな事業手段なのです！"
"10027120-47-タカネ" = "流石は部長……侮れませんね。"
"10027120-48-メル" = "あんたまで感心してどうすんのよ！"
"10027120-49-ヤクモ" = "というわけで……原稿、お借りしますね。使い道は無限にあります！映画のプロモーションにも活用できそうですし……"
"10027120-50-ヤクモ" = "……おっと、そんな顔しないでください。あとでちゃんとお返ししますから。期間は少々……いえ、結構長引きそうですけどねぇ。"
"10027120-51-メル" = "ど、どれぐらい？"
"10027120-52-ヤクモ" = "映画製作が順調に進む前提で、あと1年……？いえ、2年くらいでしょうか？"
"10027120-53-メル" = "そんなに待てないわよ！ダメ！絶対！貸さない！"
"10027120-54-ヤクモ" = "そう言わずにぃ～私はそんなに信用なりませんかぁ？#n出版部の底力、しっかりお見せしますって。"
"10027120-55-メル" = "何度言っても、ダメなものはダメだから！"
"10027120-56-ヤクモ" = "そうですか……分かりました。"
"10027120-57-メル" = "あれ、すんなりと諦めてくれた……？いや、あんたっていつも大人しくなった途端、とんでもないことをするよね……"
"10027120-58-ヤクモ" = "私は鬼じゃありません。しかし、ここレッドウィンターには契約を守らない傍若無人な態度に罰を下す鬼が存在するのです！"
"10027120-59-ヤクモ" = "レッドウィンター連邦学園の校則に訴えます！#n事務局のみなさん！ここですよ！"
"10027120-60-マリナ" = "ここに友人との約束を守らないいけない子と……"
"10027120-61-マリナ" = "我が事務局を倒し逃亡した問題児がいると聞いたぞ！"
"10027120-62" = "[s] \"その問題児の中に、私も入ってたりする……？\""
"10027120-63-マリナ" = "せ、先生！？どうしてここに……！？"
"10027120-64-マリナ" = "もしかして、校則を破ったいけない子って……先生のことだったのか！？"
"10027120-65" = "[s] \"それは違うんだけど！\""
"10027120-66-マリナ" = "ふむ……残念だが、レッドウィンターの神聖な校則を破ったのなら、たとえ先生相手だとしても見逃すことはできない！"
"10027120-67-マリナ" = "何が何でも反省室に連れて行く！大丈夫だ！反省室なら私もよく行ってるからな！それなりに快適だ！"
"10027120-68" = "[s] \"だから、違うってば！\""
"10027120-69-メル" = "事務局まで巻き込むなんて、ヤクモ、あんた……！"
"10027120-70-ヤクモ" = "契約とは、非情なものですよぉ。ムフフ。"
