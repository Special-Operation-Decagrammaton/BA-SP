[translation]
"10027070-1" = "第7話;歯車"
"10027070-2" = "レッドウィンター連邦学園・図書館"
"10027070-3-メル" = "あいつ、行った？"
"10027070-4" = "[s] \"うん。タカネは帰ったよ。\""
"10027070-5-メル" = "そう……そっか……。"
"10027070-6" = "[ns] \"メル！？\""
"10027070-7-メル" = "へーきへーき。眠くてちょっとふらついただけ。#n緊張が解けたらよくあることだから、気にしないで。"
"10027070-8-メル" = "漫画家も大変だって？#nへへ……先生にそう言ってもらえるの何か嬉しいな。"
"10027070-9-メル" = "じゃあ、私はちょっと寝るね……#nキヴォトスの終焉とかでもない限りはそっとしておいて……ほしいな……"
"10027070-10" = "（メルはそのまま倒れるように、再び眠りについた……）"
"10027070-11" = "（気を失ったメルをベッドに寝かせ、図書館の椅子にしばらく身を任せた）"
"10027070-12" = "[ns] \"電話……？誰だろ……。\""
"10027070-13" = "[ns] \"モミジ！？\""
"10027070-14" = "レッドウィンター連邦学園・山道"
"10027070-15-モミジ" = "こ、こんにちは。先生。お元気にしていましたか？"
"10027070-16-モミジ" = "はい。私はまあ……大丈夫です。元気です。"
"10027070-17-モミジ" = "……。"
"10027070-18-モミジ" = "ええと、先生。最近少し……悩みがありまして。#n先生にご相談したくて……。"
"10027070-19-モミジ" = "その……"
"10027070-20-モミジ" = "……。"
"10027070-21-モミジ" = "メル先輩に、ついての……"
"10027070-22" = "[s] \"メルとケンカした話？\""
"10027070-23-モミジ" = "は、はい！？ど、どうして先生がそれを……！？"
"10027070-24-モミジ" = "え？今もう……「知識解放戦線」の図書館にいらっしゃる！？#nど、どういうことですか！？"
"10027070-25-モミジ" = "そうだったんですね。#nメル先輩が……。"
"10027070-26-モミジ" = "えっと、先生……"
"10027070-27-モミジ" = "私も……メル先輩と仲直りしたい、です。"
"10027070-28-モミジ" = "もちろん、メル先輩は自己中で視野も狭いし、うるさいし、傍若無人なくせに変なところで臆病だけど……"
"10027070-29-モミジ" = "でも、根が悪い人では、ないですから……"
"10027070-30-モミジ" = "『ルナ』に関しても、ちょっと私が感情的になりすぎちゃっただけで……#n感想としては、そう思われる事もあるよな、という内容でした。"
"10027070-31-モミジ" = "メル先輩は……作家ですから。"
"10027070-32-モミジ" = "たぶん……作品への観点が違うのだと思います。"
"10027070-33-モミジ" = "ただ、作品を悪く言われたせいでカッとなってしまって……メル先輩に少しキツくあたってしまって……"
"10027070-34-モミジ" = "はは……それに、メル先輩は謝るの苦手なので、ここは私が先に謝ったほうがいいかもしれません。"
"10027070-35" = "[ns1] \"それなんだけどね、モミジ。\"\n[ns2] \"メルは今、『ルナ』最終巻の二次創作同人誌を描いているよ。\""
"10027070-36-モミジ" = "ええっ！？ど、どういう事ですか？"
"10027070-37-モミジ" = "私が「知識解放戦線」を離れている間に、一体何が……！？"
"10027070-38" = "（モミジに今まであったことを説明した……）"
"10027070-39-モミジ" = "……。"
"10027070-40-モミジ" = "…………。"
"10027070-41-モミジ" = "……………………。"
"10027070-42" = "[s] \"えっと、モミジ……？\""
"10027070-43-モミジ" = "こういう時、どんな反応をしたらいいのか、よく分かりません……。"
"10027070-44" = "[s] \"その気持ち、分かる気がする……。\""
"10027070-45-モミジ" = "メル先輩がそんな事を……先生はそれを全部見ていたんですよね？#n同人誌はもう半分くらい完成していて、期日まであと2日……？"
"10027070-46-モミジ" = "これ、現実なんですよね？#n私、何か変な夢とか見ているわけじゃないですよね？"
"10027070-47-モミジ" = "厳然たる事実、ですか？そんな……どうして現実というのはかくも辛く、私たちに厳しいのでしょう。"
"10027070-48-モミジ" = "というか、メル先輩も……誰もそこまでしろなんて言わなかったでしょうに……"
"10027070-49-モミジ" = "本当に、いつも思いますが……一度これと決めたら、誰が何と言っても止まらないんですよね……。"
"10027070-50" = "[s] \"でも、メルはモミジのためにその同人誌を描いたんだよ。\""
"10027070-51-モミジ" = "……はい。"
"10027070-52-モミジ" = "それは……分かります。へへ、なんだか変な気分です。"
"10027070-53-モミジ" = "他のことはわかりませんが……メル先輩の『ルナ』は、やっぱり一度読んでみたいですね。"
"10027070-54-？？？" = "それ……本当？"
"10027070-55-モミジ" = "！？"
"10027070-56" = "[s] \"！？\""
"10027070-57-メル" = "……。"
"10027070-58-モミジ" = "め、メル先輩！？"
"10027070-59-メル" = "いや、その。ちょっと目覚めちゃってさ。#nそしたら先生が急に図書館の外に出て行ったから……。"
"10027070-60-モミジ" = "じゃ、じゃあ私たちの会話、全部聞いちゃったんですか！？"
"10027070-61-メル" = "全部じゃないけど……ある程度は……。"
"10027070-62-モミジ" = "ふええええ……。"
"10027070-63-メル" = "うう……。"
"10027070-64" = "[ns] \"うううううーん……。\""
"10027070-65-メル" = "せ、先生！？せめて何か一言くらい……一緒に困らないでくださいよぉ！"
"10027070-66-メル" = "そ、そうだよ先生！この空気ちょっとどうにかしてよ！"
"10027070-67" = "[s] \"大人だからって、すべてのことに対処できるわけじゃないんだよ……。\""
"10027070-68-メル" = "そんな一般論で逃げてる場合じゃないでしょ！"
"10027070-69-モミジ" = "その……メル先輩、私……。"
"10027070-70-メル" = "う、うん。その……。"
"10027070-71-モミジ" = "……。"
"10027070-72-メル" = "……。"
"10027070-73" = "[s] \"直接会ってから考えるのはどうかな？\""
"10027070-74-モミジ" = "先生！？"
"10027070-75-メル" = "先生！？"
"10027070-76-モミジ" = "か……顔を見て話すのが大事……？"
"10027070-77-メル" = "で、でも、そんな急に……ほら、心の準備とかあるじゃん！？"
"10027070-78-モミジ" = "躊躇してたら進まないのは、そうかもしれませんが……"
"10027070-79-メル" = "……。"
"10027070-80-モミジ" = "……。"
"10027070-81-メル" = "ねぇ、モミジ……"
"10027070-82-モミジ" = "は、はい？"
"10027070-83-メル" = "とりあえず……会って、話そっか？"
"10027070-84-モミジ" = "そ、そう……しましょうか？"
