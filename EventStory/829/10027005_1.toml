[translation]
"10027005-1" = "プロローグ;知識解放戦線のとある一日"
"10027005-2" = "レッドウィンター連邦学園・図書館"
"10027005-3-メル" = "げほっ、げほっ!"
"10027005-4-モミジ" = "だ、大丈夫ですか……？"
"10027005-5-メル" = "ホコリ多すぎ！！このままじゃ肺が真っ黒になっちゃうよ！"
"10027005-6-モミジ" = "仕方ないですよ……お掃除とホコリは切っても切り離せない関係ですから……"
"10027005-7-モミジ" = "図書館をきれいに片付けたって、誰も来ないのに……#nこの行為ってなんか意味あるの？"
"10027005-8-メル" = "きれいになって喜ぶの、昼寝に来るチェリノ会長くらいでしょ。"
"10027005-9-メル" = "昼寝常連なんだから、蔵書の持ち込みくらい許可してくれたっていいのに……"
"10027005-10-モミジ" = "そうですね……で、でも！お掃除するのは良いことですよ！"
"10027005-11-モミジ" = "私たちは図書館で生活してるわけですし……！"
"10027005-12-メル" = "うえぇ……重い腰あげて掃除してんだから、そういう事いわないでよ～"
"10027005-13-モミジ" = "それに、お掃除ってたまにお宝を発掘したりするし……"
"10027005-14-モミジ" = "やってるうちにいいことありますよ！#n絶版になって久しいレア本とか見つけたりするかもしれませんし！"
"10027005-15-メル" = "……レア本って言っても、自分にとって価値がなかったら意味ないんだけど……？"
"10027005-16-メル" = "私たち「知識解放戦線」にとっては、価値があるものですよ……！#nそれに、読んでみたら意外とハマるかもしれません。"
"10027005-17-モミジ" = "新しいコンテンツが不足しすぎて、みんないつも供給に飢えてるくらいですし……！"
"10027005-18-メル" = "いや……古いものを否定するつもりはないけどさぁ……#n新しいコンテンツって言って絶版になって久しい昔の本や漫画を渡されても困らない？"
"10027005-19-モミジ" = "なんでそんなこと言うんですか！"
"10027005-20-モミジ" = "……！#nメル先輩、ちょっと来てください！"
"10027005-21-メル" = "え？どうしたの？#n何か見つかった？"
"10027005-22-モミジ" = "はい！『ルナ』4巻から21巻が！#nこんな宝物がまだ図書館で眠っていたなんて……！"
"10027005-23-メル" = "……『ルナ』？"
"10027005-24-モミジ" = "えっ……！？まさか、『ルナ』を知らないんですか？#nメル先輩はそれで「知識解放戦線」を名乗っているんですか！？"
"10027005-25-メル" = "いや、知らないけど……どんな作品なの？"
"10027005-26-モミジ" = "レジェンド級の名作ですよ！？ちょっと先輩に失望しました……。"
"10027005-27-モミジ" = "『ルナ』という名の2人が、偶然、同じような理由で同居することになり、そこから起こる様々な事件を扱った……"
"10027005-28-モミジ" = "愛と人生とパンクとバンドと映画と……とにかくあらゆるジャンルの粋を集めたと言っても過言ではない作品なんですよ！"
"10027005-29-モミジ" = "諸事情で最終巻の22巻は……ちょっと、アレですが……"
"10027005-30-モミジ" = "とにかく！この伝説的な作品を知らずに生きてきたなんて……メル先輩の時間が可哀想です！"
"10027005-31-メル" = "私の時間は可哀想で、私は可哀想じゃないの！？"
"10027005-32-メル" = "私がメル先輩を可哀想だと思うわけないじゃないですか！"
"10027005-33-メル" = "それはそうだけどさ！"
"10027005-34-モミジ" = "ちょうど1巻から3巻までは私が持ってるので、この機会に先輩も『ルナ』を履修しましょう！"
"10027005-35-メル" = "え～それ絶対履修しなきゃダメなヤツ？"
"10027005-36-モミジ" = "私たちは「知識解放戦線」です。すべての知識は平等に大切なものです！#nそれは『ルナ』も例外ではありません！"
"10027005-37-メル" = "100%我欲じゃん！！#n「知識解放戦線」を利用すんな！"
"10027005-38-メル" = "ふぁあ……読み終わった……#nもうこんな時間？"
"10027005-39-モミジ" = "どうでした？どうでした？"
"10027005-40-メル" = "うーん……ざっくり言うと――"
"10027005-41-モミジ" = "ざっくり言うと？"
"10027005-42-メル" = "悪くはなかったよ。"
"10027005-43-モミジ" = "そうですよね！レジェンドですもの！"
"10027005-44-メル" = "でもさ、これ……一発ネタばっかり乱発してない？"
"10027005-45-モミジ" = "それはどういう……？"
"10027005-46-メル" = "なんというか……ストーリーラインが雑なんだよね。#nキャラが終始、物語都合で動かされてるっていうか……#n葛藤させるためにトラブルが急に湧いてきたり、扱いに困ったキャラを雑に退場させたり……"
"10027005-47-モミジ" = "そ、それは……連載当時もたまに挙がっていた批判では、ありますが……"
"10027005-48-モミジ" = "で、ですが！ちゃんとキャラは全員魅力的に描かれてますよ！#n16巻でスタジオのマネージャーとルナがぶつかった時のシーンなんて印象的で……！"
"10027005-49-メル" = "うん。キャラクター造形は秀逸だと思う。#n出た時代を考慮したら、むしろ流行を先取りしていたと評価すべきだろうね。"
"10027005-50-メル" = "でも、その結果無理矢理ねじ込まれたキャラ回のシナリオが破綻しちゃったり、設定矛盾起こしちゃったりしてるし……"
"10027005-51-メル" = "最終章なんか特にそうじゃない？#n21巻とかまともな話が全然ないんだけど……"
"10027005-52-メル" = "本当に22巻で完結するのコレ？風呂敷広げすぎてるから、ちゃんと伏線全部回収するのか気になって仕方ないんだけど。"
"10027005-53-モミジ" = "22巻は……ありません。"
"10027005-54-メル" = "え？最終巻ないの？なんで？"
"10027005-55-モミジ" = "……ですか。"
"10027005-56-メル" = "モミジ？どうしたの？"
"10027005-57-モミジ" = "メル先輩に『ルナ』の何がわかるって言うんですか！！"
"10027005-58-メル" = "……え、ええ！？"
"10027005-59-メル" = "最終巻がどうして存在しないのかなんて、むしろ私が聞きたいくらいです！！"
"10027005-60-モミジ" = "それに……！"
"10027005-61-メル" = "そ、それに……？"
"10027005-62-モミジ" = "偉そうに批判するメル先輩は、名作を作ってきたっていうんですか！？"
"10027005-63-モミジ" = "適当に風呂敷を広げて、伏線丸投げのストーリーを作るのは、先輩も同じじゃないですか！"
"10027005-64-モミジ" = "設定を作り込まないで描きたいシーンから適当に構成するからそうなるんですよ！"
"10027005-65-モミジ" = "やりたい物語のためにキャラを振り回してるのは、先輩だって同じなのに……#nどうして『ルナ』を偉そうに批判できるのか私にはわかりません！#n批判だけなら小学生だってできるんですよ！"
"10027005-66-メル" = "も、モミジ？急にどうしたの？"
"10027005-67-モミジ" = "もう……我慢の限界なんです。この際、言いたいことを言わせていただきます！"
"10027005-68-モミジ" = "私のパンケーキ天ぷらを食べたの、メル先輩だったんですね！？#nそうかそうか、あなたはそういう人だったんですね……"
"10027005-69-メル" = "その辺に1日置きっぱなしだったから食べていいものかと……#nというか、そんなに食べられたくないんだったら名前でも書いておきなよ。"
"10027005-70-モミジ" = "そもそも、自分で買ってないものを勝手に触らないのって常識ですよね！？"
"10027005-71-メル" = "いつも本当に……やりたい放題やって……！"
"10027005-72-モミジ" = "メル先輩なんて大嫌いです！"
"10027005-73-メル" = "……！"
"10027005-74-メル" = "言わせておけば……私に我慢してることが一つもないとでも！？"
"10027005-75-メル" = "大体、モミジだってこの前……！"
"10027005-76-モミジ" = "なんで同じ本がまた入ってきたのかと思ったら、二重で発注してたのあんただったのね！？"
"10027005-77-モミジ" = "げ、限定版のためには仕方なかったんです！#n入手が難しいんですよ！？"
"10027005-78-メル" = "そのせいで2ヶ月も蔵書申請禁止されちゃったじゃん！"
"10027005-79-モミジ" = "私が好き勝手してるって言うけど、モミジだって大概じゃん！"
"10027005-80-モミジ" = "うう……それはそれ、これはこれ、です！"
"10027005-81-メル" = "いや、一緒でしょ。"
"10027005-82-メル" = "ううっ……！"
"10027005-83-メル" = "はん……！"
"10027005-84-モミジ" = "もういいです！先輩なんか知りません！"
"10027005-85-モミジ" = "お一人でどうぞご自由になさってください！"
"10027005-86-メル" = "一人の方が気楽でいいわよ！"
"10027005-87-メル" = "モミジなんか知らない！"
"10027005-88-メル" = "……。"
"10027005-89-メル" = "……本当に出ていっちゃった。"
"10027005-90-メル" = "まぁ、別にいいんだけどさ！私一人の方が自分のペースで進められるし！"
"10027005-91-メル" = "自分のペースで……"
"10027005-92-メル" = "……。"
"10027005-93-メル" = "いや……よくないよ！？"
"10027005-94" = "#video;10027"
