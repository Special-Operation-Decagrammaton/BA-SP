[translation]
"10039010-1" = "第1話;イメージチェンジ"
"10039010-2" = "48時間前"
"10039010-3-？？？" = "……ふぅ、これで最後です！"
"10039010-4-ヒナタ" = "思ったよりも早く終わりましたね。#nこれもマリーさんのおかげです。#nありがとうございました！"
"10039010-5-マリー" = "むしろ、重い荷物を全て運んでくださったヒナタさんのおかげのような……。"
"10039010-6-マリー" = "こちらこそ、ありがとうございます。"
"10039010-7-マリー" = "そ、そんな……！"
"10039010-8-ヒナタ" = "……あっ、すみません。"
"10039010-9-ヒナタ" = "って、私のじゃ……。"
"10039010-10-マリー" = "……私のみたいです。"
"10039010-11-マリー" = "……？"
"10039010-12-ヒナタ" = "マリーさん？"
"10039010-13-マリー" = "えっと、サクラコ様から連絡が来まして。"
"10039010-14-マリー" = "ただ、内容が……。"
"10039010-15-ヒナタ" = "次の仕事の連絡でしょうか？"
"10039010-16-マリー" = "そうかもしれません。#n「緊急支援要請」とだけ送られてきました。"
"10039010-17-マリー" = "……何か問題でも起きたのでしょうか？"
"10039010-18-マリー" = "失礼します……。"
"10039010-19-マリー" = "……サクラコ様？"
"10039010-20-マリー" = "入ってもよろしいでしょうか？"
"10039010-21-マリー" = "……！？"
"10039010-22-マリー" = "さ、サクラコ様！？#nそれにミネ様まで……！"
"10039010-23-サクラコ" = "……。"
"10039010-24-サクラコ" = "多忙な中、急に呼び立ててしまいすみません。"
"10039010-25-サクラコ" = "マリーが来てくれなければ、大変なことになっていたので……。"
"10039010-26-ミネ" = "……おそらく、すぐにでも決着をつけていたでしょう。"
"10039010-27-ミネ" = "け、決着とは、いったい何があったのですか！？"
"10039010-28-サクラコ" = "……？"
"10039010-29-サクラコ" = "……はい？"
"10039010-30-サクラコ" = "私たちは戦っていたのでしょうか……？"
"10039010-31-ミネ" = "……？"
"10039010-32-ミネ" = "サクラコさんが、そのつもりだったのでは……？"
"10039010-33-ミネ" = "先ほど「衝突する前に、マリーの声を聞かなくては」と言っておりましたよね？"
"10039010-34-サクラコ" = "……？？？"
"10039010-35-サクラコ" = "また誤解を……。"
"10039010-36-サクラコ" = "私はただ意見を求めたかっただけで……。"
"10039010-37-ミネ" = "つまり……？"
"10039010-38-ミネ" = "あ、あの……！"
"10039010-39-マリー" = "もしかして、私のせいで問題が……？"
"10039010-40-ミネ" = "……いえ、そうではありません。"
"10039010-41-ミネ" = "どうかご心配なさらないでください。#n私達はマリーさんを咎めに来たわけではありませんので。"
"10039010-42-サクラコ" = "また困らせてしまいましたね……申し訳ありません。"
"10039010-43-サクラコ" = "順を追って説明しますと……。"
"10039010-44-ミネ" = "……お待ちください。"
"10039010-45-ミネ" = "ここは私が説明しましょう。"
"10039010-46-ミネ" = "サクラコさんでは、誤解を生んでしまうかもしれませんから。"
"10039010-47-サクラコ" = "……はい？"
"10039010-48-サクラコ" = "え、ええと……？"
"10039010-49-サクラコ" = "……何故でしょうか？"
"10039010-50-サクラコ" = "……。"
"10039010-51-ミネ" = "今日の話し合いだけですら、いくつも誤解を生んでいたかと。"
"10039010-52-サクラコ" = "……うっ。"
"10039010-53-サクラコ" = "分かりました……では、お任せします。"
"10039010-54-マリー" = "サクラコ様……。"
"10039010-55-ミネ" = "……では、まず私たちが置かれている状況をご説明します。"
"10039010-56-ミネ" = "マリーさんもご存知の通り、現在トリニティ[ruby=カーニバル]謝肉祭[/ruby]が開催されていますよね。"
"10039010-57-ミネ" = "そのなかで「アイドルイベント」が行なわれるそうなのです。"
"10039010-58-ミネ" = "これは、トリニティだけでなく、他学園からも参加者を募る大きな催し。"
"10039010-59-ミネ" = "開催期間中は、組織間の関係性を抜きにして、交流を深める決まり。"
"10039010-60-ミネ" = "これを生かして、私たちのイメージチェンジを図ろうと考えました。"
"10039010-61-ミネ" = "……まさに、絶好の機会ですから。"
"10039010-62-ミネ" = "救護騎士団やシスターフッドが抱えるマイナスイメージを払拭するのです！"
"10039010-63-ミネ" = "わ、私たちにそのようなイメージが……？"
"10039010-64-サクラコ" = "はい、残念ながら……。"
"10039010-65-サクラコ" = "マリーは初耳かもしれませんが、立場上どうしても疑いをかけられやすいのです。"
"10039010-66-サクラコ" = "例えば、陰謀を企てているのではないか、生徒を監禁しているのではないか、など……。"
"10039010-67-ミネ" = "救護騎士団も、救護のていで暴力を振るい、街を破壊して回っていると誤解されており……。"
"10039010-68-ミネ" = "みなさんのために職務を全うしているはずなのに、です。"
"10039010-69-マリー" = "ど、どうしてなのでしょう……？"
"10039010-70-サクラコ" = "私にも、よく分かりません……。"
"10039010-71-ミネ" = "この問題を解決するためには、何だってやってみせましょう。"
"10039010-72-ミネ" = "それが、たとえ初めての行ないだとしても。"
"10039010-73-マリー" = "初めて、ですか……？"
"10039010-74-サクラコ" = "……はい、マリー。"
"10039010-75-サクラコ" = "私とミネ団長は今日から……。"
"10039010-76-サクラコ" = "……アイドルになるのです！"
"10039010-77-マリー" = "アイドル……！？"
"10039010-78-サクラコ" = "似合わないことは承知のうえです。#n私もミネ団長も、アイドルのような可愛いものに興味はありませんから……。"
"10039010-79-ミネ" = "……？"
"10039010-80-ミネ" = "いえ、むしろ私は……。"
"10039010-81-ミネ" = "頑張ったところで滑稽に映るかもしれませんが、その覚悟はできております。"
"10039010-82-ミネ" = "……お待ちください！"
"10039010-83-ミネ" = "アイドルが滑稽と言いましたか！？"
"10039010-84-サクラコ" = "はい、それでも皆様から親しみを持っていただけるのなら……。"
"10039010-85-ミネ" = "……！"
"10039010-86-サクラコ" = "私は、どのような格好も甘んじて受け入れましょう。"
"10039010-87-マリー" = "……サクラコ様。"
"10039010-88-マリー" = "分かりました。それでは……私も全力で皆さんのサポートをいたします。"
"10039010-89-マリー" = "私にできることがありましたら、なんでも仰ってください。"
"10039010-90-サクラコ" = "マリー……！"
"10039010-91-ミネ" = "マリーさん……！"
"10039010-92-ミネ" = "ありがとうございます。#nさっそくですが、まずはこちらを……。"
"10039010-93-マリー" = "これは……？"
"10039010-94-サクラコ" = "私とミネ団長がそれぞれ考えた「アイドルの企画書」です。"
"10039010-95-サクラコ" = "「衣装」、「ダンス」、「曲」の三つに別けて案を出したのですが、#nなかなか意見がまとまらず……。"
"10039010-96-ミネ" = "ええ、マリーさんに決めていただければ、と。"
"10039010-97-ミネ" = "サクラコさんも私も、それがいいと考えました。"
"10039010-98-マリー" = "わ、私が決めるんですか！？"
"10039010-99-サクラコ" = "はい、マリーは私たちよりもアイドルに詳しいでしょうから。"
"10039010-100-サクラコ" = "普段からお店でポイントを貯めたり、セルフレジを使ったり、トレンドを知っているように。"
"10039010-101-サクラコ" = "それくらいでしたら、私は普通に……。"
"10039010-102-サクラコ" = "相談を通して、若者の意見を聞く機会も多いでしょう。"
"10039010-103-ミネ" = "年の差はほとんどないと思いますが……。"
"10039010-104-サクラコ" = "つまり、私やミネ団長とは違い、今時の学生として適任なのです！"
"10039010-105-サクラコ" = "おかしくありませんか！？"
"10039010-106-ミネ" = "どうして私がサクラコさんと同じ立場に！？全てサクラコさんのお話でしょう！"
"10039010-107-ミネ" = "たしかに、そこまでアイドルには詳しくありませんが、#n可愛いものは好きですから、興味はありました！"
"10039010-108-ミネ" = "なのに「騎士団誓約」の内容を歌詞に加えたのですか？#nいくら何でも、あれが不自然なことくらい私でさえ分かります！"
"10039010-109-サクラコ" = "ですから、それはオリジナリティを出すためだと説明したではありませんか！"
"10039010-110-ミネ" = "サクラコさんこそ、「聖歌」を推していたでしょう！"
"10039010-111-ミネ" = "皆様から、とても評判ですよ？"
"10039010-112-ミネ" = "その「皆様」とは誰なのですか！"
"10039010-113-サクラコ" = "聖堂の皆様です！"
"10039010-114-ミネ" = "それは当然でしょう！"
"10039010-115-サクラコ" = "マリーも聖歌は好きですよね！？"
"10039010-116-マリー" = "えっ？#nも、もちろん聖歌は好きですが……。"
"10039010-117-サクラコ" = "言った通りでしょう、ミネ団長！"
"10039010-118-ミネ" = "それとこれとは別ですよね！？"
"10039010-119-ミネ" = "……ふぅ。#nマリーさんのお力を借りようとした理由、分かっていただけましたか？"
"10039010-120-ミネ" = "マリーさんなら、公正に選んでくださると信じております。"
"10039010-121-ミネ" = "サクラコさんの企画になったとしても、異論はございません。"
"10039010-122-マリー" = "……ええと。"
"10039010-123-マリー" = "その……。"
"10039010-124-マリー" = "ええ、マリーにお任せします！"
"10039010-125-マリー" = "あぅ……。"
"10039010-126-サクラコ" = "さあ、お選びください！#n私たちが進むべき道を！"
"10039010-127-マリー" = "そ、その！"
"10039010-128-マリー" = "少し……。"
"10039010-129-マリー" = "……考える時間を、頂けませんか？"
"10039010-130-マリー" = "――という話になってしまいまして。"
"10039010-131" = "[s1] \"大変だったね……。\"\n[s2] \"お疲れ様、マリー。\""
"10039010-132-マリー" = "あはは……。"
"10039010-133-マリー" = "ですが、サクラコ様とミネ団長のお気持ちは理解しました。"
"10039010-134-マリー" = "誰かのためを思う一心で、頑張っているのだと。"
"10039010-135-マリー" = "お二人は組織を率いる立場で、色々な問題に直面しているのでしょう。"
"10039010-136-マリー" = "それに対して、私は目の前の仕事をこなすだけ……。"
"10039010-137-マリー" = "ですから、こんな私でもお役に立てるのならサポートしたいのです。"
"10039010-138-マリー" = "ただ……。"
"10039010-139-マリー" = "片方の意見を肯定すると、もうひとつの意見を否定することになってしまい、#nどうすれば良いのか分からず……。"
"10039010-140" = "[ns3] \"マリー。\"\n[ns4] \"ほかの部活を見て回るのはどうかな？\""
"10039010-141-マリー" = "……えっ。"
"10039010-142-マリー" = "もしかして……。"
"10039010-143-マリー" = "……手伝って、くださるんですか？"
"10039010-144-マリー" = "ほかの部活を一緒に見て回る……？"
"10039010-145-マリー" = "お、お気持ちは嬉しいのですが……。"
"10039010-146-マリー" = "先生はお仕事で忙しいでしょうし、負担をかけるわけにはいきません。"
"10039010-147-マリー" = "……はい？"
"10039010-148-マリー" = "気にする必要はない、と？"
"10039010-149" = "[s5] \"マリーの力になりたいんだ。\"\n[s6] \"みんなの力になりたいんだ。\""
"10039010-150-マリー" = "先生……。"
"10039010-151-マリー" = "……ふふっ。"
"10039010-152-マリー" = "ありがとうございます。"
"10039010-153-マリー" = "そこまで言ってくださったのに……。"
"10039010-154-マリー" = "遠慮しては、却って失礼ですよね。"
"10039010-155-マリー" = "ここはご厚意に、甘えさせていただきます。"
"10039010-156-マリー" = "今は、余計なことを考えず……。"
"10039010-157-マリー" = "期待に応えられるよう、頑張ります。"
"10039010-158-マリー" = "……先生。"
"10039010-159-マリー" = "いつも通り、お手伝いをするだけのはずでしたが……。"
"10039010-160-マリー" = "……今は、明日からの時間を楽しみにしている自分がいます。"
"10039010-161-マリー" = "……では先生、よろしくお願いいたしますね。"
