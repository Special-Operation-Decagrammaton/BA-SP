[translation]
"10039150-1" = "後日談その7;騒がしい展覧会"
"10039150-2" = "（展覧会が開かれているアートギャラリー会場に向かった）"
"10039150-3" = "（謝肉祭開催期間中とは思えないほど閑散としていた）"
"10039150-4" = "（しかし、飾られている作品の数はとても多かった）"
"10039150-5" = "[ns] \"あ……。\""
"10039150-6" = "[ns] \"……ナギサ？\""
"10039150-7-ナギサ" = "先生……？"
"10039150-8-ナギサ" = "おはようございます、先生。"
"10039150-9-ナギサ" = "こちらには、どのようなご用件で……。"
"10039150-10" = "[s] \"展覧会があるって聞いたから、気になって。\""
"10039150-11-ナギサ" = "ふふ、そうでしたか。#nようこそいらっしゃいました。"
"10039150-12-ナギサ" = "実は私が、この展覧会の主催者なんです。"
"10039150-13" = "[s] \"ナギサは絵画が好きなんだね。\""
"10039150-14-ナギサ" = "ええ、ここの学芸員をしております。#nせっかくですから、展示について説明してもよろしいでしょうか？"
"10039150-15" = "（ナギサの説明は、とても分かりやすかった）"
"10039150-16-ナギサ" = "――など、ティーパーティーが保有する作品が中心ですが、#n実は私が描いた絵も展示しているのですよ。"
"10039150-17" = "[s] \"すごいね！？\""
"10039150-18-ナギサ" = "そこまで褒められるほどの腕前ではありませんが……。"
"10039150-19-ナギサ" = "……見に来てくださったワイルドハントの方からは、#nそれなりに好評でした。"
"10039150-20-ナギサ" = "あそこの学院は芸術の都とも呼ばれております。"
"10039150-21-ナギサ" = "そのような場所で学んでいる方からも好評で、喜ばしい限りです。#n作品のレベルも展示の動線も、一定の水準を超えられたようで安心しました。"
"10039150-22-ナギサ" = "……。"
"10039150-23-ナギサ" = "あ……。"
"10039150-24-ナギサ" = "ごめんなさい……。"
"10039150-25-ナギサ" = "先生には、このような回りくどい言い方をしたくなかったのですが……。"
"10039150-26" = "[s1] \"大丈夫だよ。\"\n[s2] \"それだけこのギャラリーが好きなんだよね。\""
"10039150-27-ナギサ" = "うぅ……。"
"10039150-28-ナギサ" = "……は、はい。"
"10039150-29-ナギサ" = "自分の好きな物事が、専門としている方に褒められる経験は貴重で……。"
"10039150-30-ナギサ" = "素直に、嬉しかったのです。"
"10039150-31-ナギサ" = "私自身が認められたようで……。"
"10039150-32" = "[s] \"……うん。\""
"10039150-33-ナギサ" = "普段は、こうして本音を打ち明ける機会などないのですが……。"
"10039150-34-ナギサ" = "やはり先生の前では、自然と自分をさらけ出せるような気がしています。"
"10039150-35-ナギサ" = "……。"
"10039150-36-ナギサ" = "せっかくお越しいただいたわけですし、#nもう少しお話に付き合ってもらってもよろしいでしょうか？"
"10039150-37" = "[s3] \"うん、私でよければ。\"\n[s4] \"ナギサと過ごす時間は楽しいからね。\""
"10039150-38-ナギサ" = "……ふふっ、ありがとうございます。"
"10039150-39-ナギサ" = "実は、この展覧会……#n謝肉祭の計画当初は存在しなかったのです。"
"10039150-40-ナギサ" = "ティーパーティーの皆さんと議論するなかで、様々な策を考えておりました。"
"10039150-41-ナギサ" = "利益の追求や政治的な影響をどのようにコントロールしていこうか、と。"
"10039150-42-ナギサ" = "しかし、ふと気づいたのです。"
"10039150-43-ナギサ" = "……一人の生徒として、純粋に謝肉祭を楽しみたい自分がいることに。"
"10039150-44-ナギサ" = "……。"
"10039150-45-ナギサ" = "そうして、展覧会の開催申し込みをしました。"
"10039150-46" = "[s] \"そんな経緯があったんだね。\""
"10039150-47-ナギサ" = "ええ。"
"10039150-48-ナギサ" = "私が絵画を見て味わった感動を、皆さんと共有したかったのですが……。"
"10039150-49-ナギサ" = "思った以上に来場される方が少なく……。"
"10039150-50" = "[s] （それは……）"
"10039150-51" = "[ns] \"こ、これからたくさん来てくれるよ！\""
"10039150-52-ナギサ" = "でしたら良いのですが……。"
"10039150-53-ナギサ" = "……先生が来てくださっただけでも、展覧会を開いた甲斐がありました。"
"10039150-54" = "[s] \"頑張ったね、ナギサ。\""
"10039150-55" = "[ns5] \"いつだって、私はナギサを応援してるよ。\"\n[ns6] \"一人の生徒として、ね。\""
"10039150-56-ナギサ" = "先生……。"
"10039150-57-ナギサ" = "……ありがとう、ございます。"
"10039150-58-ナギサ" = "そのお言葉、大切にいたします。"
"10039150-59" = "[s] \"……あと、ナギサを応援してるのは私だけじゃないよ。\""
"10039150-60-ナギサ" = "それは、どういう……。"
"10039150-61-？？？" = "あははっ！#nなに、このロールケーキの絵！"
"10039150-62-？？？" = "如何にも、ナギサらしいね。"
"10039150-63-ナギサ" = "この声は……。"
"10039150-64-ミカ" = "やっほ～ナギちゃん！#nセイアちゃんも連れて来ちゃった☆"
"10039150-65-セイア" = "ああ、ここは落ち着くね。#nナギサにとっては、不本意だろうが……。"
"10039150-66-ナギサ" = "ミカさん、セイアさん……。"
"10039150-67" = "[ns] \"元気そうだね、二人とも。\""
"10039150-68-ミカ" = "せ、先生？"
"10039150-69-セイア" = "やあ、先生。"
"10039150-70-セイア" = "[ruby=カーニバル]謝肉祭[/ruby]を見にくるとは聞いていたが、#nまさかここで会うとは。"
"10039150-71-ミカ" = "え、そうなの……？#n私、聞いてないけど！？"
"10039150-72-ナギサ" = "お二人とも、わざわざ来てくださったのですね。"
"10039150-73-ミカ" = "ああ、ミカが提案してくれんだ。#nどうせつまらなくて人がいないだろうから行ってあげよう、と言われてね。"
"10039150-74-ミカ" = "そ、そこまで言ってないよ！？"
"10039150-75-ナギサ" = "なるほど……ミカさんはそう思っていたのですね？"
"10039150-76" = "[s] \"大切な友達なんだね。\""
"10039150-77-ナギサ" = "……。"
"10039150-78-ミカ" = "……あはは、感動した？#nハンカチ貸してあげよっか？"
"10039150-79-ナギサ" = "……。"
"10039150-80-ナギサ" = "…………。"
"10039150-81-ナギサ" = "……お二人とも、今日は来ていただき、ありがとうございました。"
"10039150-82-ミカ" = "えっ？"
"10039150-83-セイア" = "ん……？"
"10039150-84-ナギサ" = "今日くらいは、素直になってみようと思いまして……。"
"10039150-85-ナギサ" = "先生に作品の説明をしている途中だったのですが、#nよろしければ一緒にどうでしょう？"
"10039150-86-ミカ" = "うんっ！#nナギちゃんの説明、楽しみだね☆"
"10039150-87-ミカ" = "今日は特別な日になりそうだ。"
"10039150-88" = "[ns] \"よろしくね、ナギサ。\""
"10039150-89-ナギサ" = "こほん……。"
"10039150-90-ナギサ" = "それでは皆さん、こちらの作品をご覧ください。"
"10039150-91" = "（ナギサの説明が終わる頃には、少しずつ人が集まり始めた）"
"10039150-92" = "（展覧会は、無事に成功を収める）"
"10039150-93" = "（……ミカとセイアは途中から眠気と戦っていたが、ナギサは最後まで楽しそうに説明を続けた）"
