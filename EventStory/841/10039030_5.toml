[translation]
"10039030-1" = "第3話;アイドルの道：ダンス"
"10039030-2-フブキ" = "……アイドルについて学びたい？"
"10039030-3-フブキ" = "別に良いけど、教えられるようなことあるかな。"
"10039030-4-フブキ" = "曲も衣装も、気づいたら用意されてたし……。"
"10039030-5-フブキ" = "そうだ、習ってる途中のダンスの振り付けなら教えられるよ～。"
"10039030-6-マリー" = "気づいたら……？"
"10039030-7-キリノ" = "あ、それは本官がご説明します！#n実は私たちがアイドルイベントに参加する理由は、#n民間企業から支援要請が入ったからなんです。"
"10039030-8-キリノ" = "本官とフブキがよく利用するドーナッツ屋さんから、#n宣伝のためにアイドルをやってほしいと言われまして……。"
"10039030-9" = "[s1] \"……支援要請？\"\n[s2] \"……それでアイドルに！？\""
"10039030-10-キリノ" = "はい、そうなのです！"
"10039030-11-キリノ" = "おかしな話でしょ？なんでドーナッツ屋さんの宣伝しなきゃいけないのさ……しかもアイドルの格好で……。"
"10039030-12-キリノ" = "上からの命令だし、仕方ないけどさ……。"
"10039030-13-キリノ" = "フブキ、これも市民対応の一環ですよ！"
"10039030-14-キリノ" = "市民の皆さんから、生活安全局が頼りにされている証拠ですし。"
"10039030-15-キリノ" = "仕事には変わりないじゃん……。"
"10039030-16-キリノ" = "それで、シスターさんはアイドルについて知りたいのですね？"
"10039030-17-キリノ" = "お役に立てるか分かりませんが、#nフブキが言うようにダンスの振り付けなら教えられると思います！"
"10039030-18-キリノ" = "たしか、こうでしたっけ……？"
"10039030-19-キリノ" = "……あれ。#nフブキ、やってみてくれませんか？"
"10039030-20-フブキ" = "えぇ？#n人目もあるし、私は遠慮しておくよ。"
"10039030-21-キリノ" = "おかしいですね、これで合っているはずですが……。"
"10039030-22-マリー" = "……？"
"10039030-23" = "[ns3] （練習中なのかな……？）\n[ns4] （何の動きなんだろう……？）"
"10039030-24-キリノ" = "……だ、大体こんな感じだった気がします。"
"10039030-25-キリノ" = "まぁ、私たちも何回かレッスンを受けただけだからね。"
"10039030-26-フブキ" = "おかげで、いつもの仕事は減らしてもらえたけど……。"
"10039030-27" = "[ns5] （ダンスの練習も仕事のような……）\n[ns6] （慣れないダンスのほうが大変な気も……）"
"10039030-28-キリノ" = "先生もお察しの通り……。"
"10039030-29-フブキ" = "むしろ、サボれる時間が減って困ってるんだよね。"
"10039030-30-キリノ" = "フ～ブ～キ～！"
"10039030-31-フブキ" = "わ、分かったって。"
"10039030-32-フブキ" = "意外なところでダンスも役立つみたいだし、頑張ってみようかな。"
"10039030-33-マリー" = "例えば、どんなところで……？"
"10039030-34-マリー" = "何かあった時、人目を惹いて時間を稼げます！"
"10039030-35-キリノ" = "家族とはぐれてしまった子を保護した時などにも役立つはずです！"
"10039030-36-マリー" = "……なるほど！"
"10039030-37-マリー" = "時間を稼いでも、どうにもならない場合もあるけどねぇ。"
"10039030-38-マリー" = "それより、シスターさんは――"
"10039030-39" = "[ns7] \"この音は……。\"\n[ns8] \"警報！？\""
"10039030-40-マリー" = "……事件です！#nフブキ、出動しますよ！"
"10039030-41-フブキ" = "えぇ、私たちは動かなくても良いんじゃない？"
"10039030-42-フブキ" = "だって、アイドル期間は――"
"10039030-43-フブキ" = "目の前で事件が起きてるんですから、見過ごすわけにはいきません！"
"10039030-44-フブキ" = "まずは現場の状況を……。"
"10039030-45-フブキ" = "もしかして、ドーナッツ屋さんが……。"
"10039030-46-キリノ" = "……？"
"10039030-47-キリノ" = "……どうしたのさ。"
"10039030-48-マリー" = "宣伝を頼まれたお店ですか……？"
"10039030-49-フブキ" = "こうしてる場合ではありません！#nフブキ、早く行きましょう！"
"10039030-50-キリノ" = "いや、だから……って、うわっ！"
"10039030-51-ヘルメット団員A" = "動くな、大人しくしてろ！"
"10039030-52-ヘルメット団員A" = "痛い目に遭いたくなかったら、さっさとドーナッツを寄越せ！"
"10039030-53-ヘルメット団員A" = "ひぃっ、どうか命だけは……！"
"10039030-54-ヘルメット団員B" = "ドーナッツさえ渡せば、危害を加える気はねぇよ。#nだからさっさとしろってんだ！"
"10039030-55-アルバイト" = "で、ではまずお会計を……！"
"10039030-56-ヘルメット団員A" = "ナメてんのかタコ！"
"10039030-57-アルバイト" = "ててて、店長は今日不在でして……！"
"10039030-58-アルバイト" = "コイツ、話通じねぇな。"
"10039030-59-ヘルメット団員A" = "チッ、このままじゃ……。"
"10039030-60-ヘルメット団員B" = "おい、来たぞ！"
"10039030-61-ヘルメット団員B" = "クソ、今日はやけに早くないか？"
"10039030-62-ヘルメット団員B" = "こうなった以上、こいつを人質にして立てこもるか……#nなんなら逃亡用の車両もゲットできるかもしれないし。"
"10039030-63-アルバイト" = "うぅ、どうして……。"
"10039030-64-ヘルメット団員A" = "おめーのせいだろ！"
"10039030-65-アルバイト" = "えっ……？#n強盗に来たあなたたちのせいですよね！"
"10039030-66-ヘルメット団員B" = "……たしかに。"
"10039030-67-ヘルメット団員A" = "納得してる場合か！"
"10039030-68-キリノ" = "フブキ、立てこもり事件のようです！"
"10039030-69-フブキ" = "その割には怪我人いなさそうだけど？"
"10039030-70-ヴァルキューレの生徒A" = "ちょうど良いところに！"
"10039030-71-ヴァルキューレの生徒A" = "事件が発生してから、20分以上経過しています！"
"10039030-72-ヴァルキューレの生徒A" = "逃走用の車を要求されてまして……。"
"10039030-73-フブキ" = "公安局か警備局は動いてるの？"
"10039030-74-ヴァルキューレの生徒A" = "来るはずですが、時間がかかるようで……。"
"10039030-75-ヴァルキューレの生徒A" = "ここは私たちだけで何とかするしかありません。"
"10039030-76-フブキ" = "はぁ、結局こうなるなんてね。"
"10039030-77-フブキ" = "あれ、生活安全局のフブキちゃんじゃない？"
"10039030-78-フブキ" = "もしかして、いつもお世話になってるドーナッツ屋さんを助けるために！"
"10039030-79-フブキ" = "あのお店に依頼されて、今はアイドル活動もしてるんだっけ？"
"10039030-80-フブキ" = "いや、私は……。"
"10039030-81-フブキ" = "……あっ、フブキちゃん！"
"10039030-82-フブキ" = "こっちだよ、こっち！"
"10039030-83-フブキ" = "おい、静かにしてろ！"
"10039030-84-フブキ" = "ああもう、クソッ！"
"10039030-85-フブキ" = "た、助けにきたよ……？"
"10039030-86-キリノ" = "フブキもやる気になったのですね！"
"10039030-87-キリノ" = "では、急いで犯人を制圧して、人質を救出しなくては！"
"10039030-88-キリノ" = "何か良い方法はないでしょうか……！"
"10039030-89" = "[ns9] \"ま、マリー……！\"\n[ns10] \"危ないよ！？\""
"10039030-90-ヘルメット団員A" = "だ、誰だ！"
"10039030-91-ヘルメット団員B" = "……トリニティのシスターか！？"
"10039030-92-ヘルメット団員B" = "シスターフッドの奴が、どうしてこんなところに……。"
"10039030-93-アルバイト" = "……？"
"10039030-94-ヘルメット団員B" = "……？？？？？"
"10039030-95-アルバイト" = "……何してんだ？"
"10039030-96-アルバイト" = "これは……！"
"10039030-97-ヘルメット団員B" = "お前は黙ってろ！#nおいシスター、何してんのかって聞いてんだよ！"
"10039030-98-ヘルメット団員B" = "おい、黙ってないで答えろ！"
"10039030-99-ヘルメット団員B" = "急に踊りだして、頭イカれちまったか？"
"10039030-100-マリー" = "じ……。"
"10039030-101-ヘルメット団員B" = "……じ？"
"10039030-102-マリー" = "じっ！"
"10039030-103-ヘルメット団員A" = "……じっ？"
"10039030-104-マリー" = "時間を！"
"10039030-105-マリー" = "時間を稼いでいます！"
"10039030-106-アルバイト" = "……しまった！"
"10039030-107-アルバイト" = "よしっ！"
"10039030-108-ヘルメット団員B" = "バカ、逃がすな！"
"10039030-109-キリノ" = "皆さん、確保してください！"
"10039030-110-フブキ" = "本当に役立つとか……。"
"10039030-111-フブキ" = "……普通、思わないでしょ。"
