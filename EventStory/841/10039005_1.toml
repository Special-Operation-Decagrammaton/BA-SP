[translation]
"10039005-1" = "プロローグ;奪取"
"10039005-2-マリー" = "……申し訳ありません、先生。"
"10039005-3-マリー" = "私のために、ご尽力してくださったのに。"
"10039005-4-マリー" = "まさか、こんな結果になってしまうとは……。"
"10039005-5-マリー" = "……私のせいです。"
"10039005-6-マリー" = "全ての責任は、私にあります。"
"10039005-7-マリー" = "ですが……。"
"10039005-8-マリー" = "このまま放っておくわけにはいきません。"
"10039005-9-マリー" = "先生……。"
"10039005-10-マリー" = "……どうか、私の罪をお赦しください。"
"10039005-11" = "\"あの噂、聞いた……？\""
"10039005-12" = "\"二時間後にトリニティ・スクエアで何か起きる、ってやつだよね。\""
"10039005-13" = "\"学園祭期間なのに……。\""
"10039005-14" = "\"……どうなるんだろう。\""
"10039005-15" = "[log]\"大事に発展する可能性もあるんじゃない？\"[/log]"
"10039005-16-マリー" = "おい、突っ立ってないで退けっつーの！"
"10039005-17-マリー" = "……チッ、ナメてんのか？"
"10039005-18-マリー" = "あれ、その服装は……。"
"10039005-19-マリー" = "……トリニティのシスターじゃねぇか。"
"10039005-20-マリー" = "い、いきなり何すんだよ？"
"10039005-21-ヘルメット団" = "なんか言えってんだ！"
"10039005-22-ヘルメット団" = "……降りてください。"
"10039005-23-ヘルメット団" = "は……？"
"10039005-24-マリー" = "降りてください、と言ったんです。"
"10039005-25-マリー" = "え……な、なんだ？"
"10039005-26-ヘルメット団" = "バイクを……借りる……？"
"10039005-27-ヘルメット団" = "とりあえず銃口を下ろして――"
"10039005-28-ヘルメット団" = "ひっ！？"
"10039005-29-ヘルメット団" = "ごめんなさい。#n今は説明する時間がないんです。"
"10039005-30-ヘルメット団" = "でもどうして、トリニティのシスターがバイクを……。"
"10039005-31-マリー" = "わ、分かった！分かったから！！"
"10039005-32-ヘルメット団" = "……ありがとうございます。#n必ずお返ししますので、どうかお許しください。"
"10039005-33-ヘルメット団" = "シスターさん、一言で良い……理由を聞かせてくれないか？"
"10039005-34-マリー" = "……はい。"
"10039005-35-マリー" = "これは――"
"10039005-36-マリー" = "\"――トリニティを、救うためです。\""
"10039005-37" = "#video;10039"
