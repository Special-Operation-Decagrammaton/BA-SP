[translation]
"10039140-1" = "後日談その6;うちらも生徒でしょ！"
"10039140-2" = "（どこも盛り上がっているなか、人があまりいない場所があった）"
"10039140-3" = "[ns] \"……このあたりは、アートギャラリー会場だったような。\""
"10039140-4-トリニティの生徒A" = "今頃、展覧会を見て回ってるはずが……。"
"10039140-5-トリニティの生徒B" = "ヘルメット団が道を占拠しているだなんて……。"
"10039140-6-トリニティの生徒A" = "せっかくの学園祭なのに……。"
"10039140-7" = "[ns] \"……。\""
"10039140-8" = "[ns] （ヘルメット団を探しに行く）"
"10039140-9-ラブ" = "チッ。"
"10039140-10-通りすがりの生徒" = "ひっ！な、何でもありません……！"
"10039140-11-ラブ" = "じろじろ見て、何だっての。"
"10039140-12-ヘルメット団C" = "隊長、さっきからいろんな人に見られてますよ。"
"10039140-13-ヘルメット団B" = "何もしてないのに……。"
"10039140-14-ヘルメット団C" = "ははっ、ビビってるに決まってる！#nお嬢様には刺激が強いのかもな！"
"10039140-15" = "[s] \"道を塞ぐのは良くないよ。\""
"10039140-16-ラブ" = "あぁ？"
"10039140-17-ラブ" = "……え。"
"10039140-18-ラブ" = "しゃ、シャーレの先生！？"
"10039140-19-ヘルメット団C" = "なんで先生がここに！？"
"10039140-20-ヘルメット団B" = "ま、まだ何もしてないぞ！"
"10039140-21" = "[s] \"落ち着いて。先生として、生徒の指導に来ただけだから。\""
"10039140-22-ラブ" = "指導……！？"
"10039140-23-ラブ" = "ま、まだ何もしてないわよ！？"
"10039140-24" = "[s1] \"ここを占拠されると、みんなの迷惑になっちゃうんだ。\"\n[s2] \"周りからの視線は、きっとここを占拠してるからだよ。\""
"10039140-25-ラブ" = "……えっ？"
"10039140-26-ヘルメット団C" = "けど、ほかに座るところがないし……。"
"10039140-27-ヘルメット団B" = "グラウンドのほうは、人が多くて……。"
"10039140-28-ラブ" = "というか、せっかく来たのに誰も案内してくれないし薄情だわ。"
"10039140-29" = "[s] \"みんなも[ruby=カーニバル]謝肉祭[/ruby]を見に来たの？\""
"10039140-30-ラブ" = "……まぁ、そうだけど。"
"10039140-31-ヘルメット団B" = "かーにばる……？"
"10039140-32-ヘルメット団B" = "そんな名前だったんだ……。"
"10039140-33-ラブ" = "トリニティの行事がどんなもんなのか、偵察に来ただけよ！"
"10039140-34-ヘルメット団A" = "実際、すごかったな……。"
"10039140-35-ラブ" = "……ま、まぁ。"
"10039140-36-ヘルメット団B" = "といっても、お金がないから見てるだけだけど……。"
"10039140-37-ヘルメット団C" = "屋台の料理、どれも美味しそうだったな……。"
"10039140-38-一同" = "……。"
"10039140-39-ヘルメット団A" = "い、今のはわざとだ！"
"10039140-40-ラブ" = "そうよ！#nうちらヘルメット団の連携だわ！"
"10039140-41-ラブ" = "ほら、怖いでしょ？#nははっ……は、はは……。"
"10039140-42" = "[ns3] \"もし良かったら……。\"\n[ns4] \"一緒に謝肉祭を見て回らない？\""
"10039140-43-ラブ" = "はぁ……？"
"10039140-44" = "[s5] \"ちょうどたこ焼きを食べたかったんだけど……。\"\n[s6] \"一人で食べ切れる自信がないんだ。\""
"10039140-45-ラブ" = "……。"
"10039140-46-ヘルメット団C" = "隊長、ひょっとしてチャンスなのでは……。"
"10039140-47-ヘルメット団B" = "シャーレの先生が、ここまで言ってるんですし……。"
"10039140-48-ラブ" = "そ、そう……？"
"10039140-49-ヘルメット団C" = "ほかの生徒は、先生と一緒に謝肉祭を回ったって聞きましたし……。"
"10039140-50-ヘルメット団B" = "自分たちも、一度くらいは……。"
"10039140-51-ラブ" = "う、うるさいわ！#nそんなに言われなくても分かったから……！"
"10039140-52" = "[ns7] \"焼きそばも気になるなぁ……。\"\n[ns8] \"射的もヨーヨー釣りも……！\""
"10039140-53-ラブ" = "く、くっ……！"
"10039140-54-一同" = "隊長……！"
"10039140-55-ラブ" = "……ふっ、先生。"
"10039140-56-ラブ" = "そこまで言うなら……つ、付き合ってあげてもいいわ。"
"10039140-57" = "[s] \"じゃあ、一緒に行こうか。\""
"10039140-58-ヘルメット団A" = "さすがは隊長！"
"10039140-59-ヘルメット団B" = "信じてましたよ！"
"10039140-60-ヘルメット団C" = "これで、うちらも先生と遊べるんだ……！"
"10039140-61-ラブ" = "ふ、ふふふ……ふふっ！"
"10039140-62" = "（こうしてヘルメット団の子たちと一緒に、謝肉祭を見て回った）"
"10039140-63-ヘルメット団A" = "あちっ！"
"10039140-64-ヘルメット団B" = "出来立てのたこ焼きって、こんなに熱かったのか……！？"
"10039140-65-ヘルメット団C" = "たこ焼きって、本当は温かかったんだ……。"
"10039140-66-ラブ" = "あっつ！ほ、ふぁ！んっ！#nお、美味しい！"
"10039140-67" = "[s9] \"ゆ、ゆっくり食べてね……？\"\n[s10] \"まだいっぱいあるから……！\""
"10039140-68-ヘルメット団A" = "くっ、惜しい～！"
"10039140-69-ラブ" = "あと少しで等身大ぬいぐるみをゲットできるチャンスだったのに……！"
"10039140-70-ヘルメット団B" = "でも、もうお金が……。"
"10039140-71" = "[ns] \"私が出すから、もう一回やってみる？\""
"10039140-72-ラブ" = "……う、うぅ。"
"10039140-73-ラブ" = "お、お願い……。"
"10039140-74-ラブ" = "し、します……先生。"
"10039140-75" = "[s] （お金を支払う）"
"10039140-76-ヘルメット団A" = "やった、ぬいぐるみゲットだ！"
"10039140-77-ヘルメット団B" = "おめでとうございます、隊長！"
"10039140-78-ラブ" = "はははっ！#nこれがジャブジャブヘルメット団のリーダー、[ruby=こまかぜ]河駒風[/ruby]ラブの力！"
"10039140-79-ラブ" = "先生、ハイタッチよ！"
"10039140-80-ヘルメット団A" = "う、うぅ……感動した。"
"10039140-81-ヘルメット団B" = "演劇が、こんなに素晴らしいものだったなんて……。"
"10039140-82-ヘルメット団B" = "特にクライマックスが……！"
"10039140-83-ラブ" = "ば、バカ！#nこんなんで泣くんじゃないわよ！"
"10039140-84-ラブ" = "こんな演劇、ち、ちっとも面白くないし！"
"10039140-85-ヘルメット団B" = "でも隊長、目の周りが赤いですよ……？"
"10039140-86-ヘルメット団B" = "もしかして、隊長も……？"
"10039140-87-ラブ" = "う、うるさいわね！#nちょっと目に埃が入っただけよ！"
"10039140-88" = "[ns11] \"やっぱり……。\"\n[ns12] \"みんなも本当は謝肉祭が楽しみだったんだね。\""
"10039140-89-一同" = "……。"
"10039140-90-ヘルメット団A" = "それは……。"
"10039140-91-ラブ" = "でも、うちらは不良だから……。"
"10039140-92" = "[s] \"今はただの生徒じゃない？\""
"10039140-93" = "[ns] \"私と一緒に、普通に過ごしてるだけだよね。\""
"10039140-94-ラブ" = "……。"
"10039140-95-一同" = "……。"
"10039140-96-ラブ" = "ま、まぁ……。"
"10039140-97-ラブ" = "別に最初から、問題を起こしに来たわけじゃないけど……。"
"10039140-98-ラブ" = "こうやって先生と一緒に遊ぶのも……わ、悪くなかったわ。"
"10039140-99-ラブ" = "よし、先生。"
"10039140-100-ラブ" = "今日は最後まで、思いっきり遊び尽くすわよ！"
"10039140-101" = "（その後もラブたちと楽しい時間を過ごした）"
"10039140-102" = "（予想以上に出費が嵩んでしまったが、彼女たちの笑顔を見られて安心した）"
