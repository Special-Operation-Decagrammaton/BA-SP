[translation]
"10039100-1" = "後日談その2;ウタハとアイドル"
"10039100-2" = "アイドルコンテストの予選ステージ"
"10039100-3-観客A" = "今度はどのようなコンセプトのアイドルでしょうね。"
"10039100-4-観客B" = "どのグループも衣装が素敵でした。"
"10039100-5-観客C" = "ええ、とても楽しみです。"
"10039100-6-ヒビキ" = "ふぅ、緊張する……。"
"10039100-7-コトリ" = "これはエンジニア部のデビューステージとも言えますからね。#n緊張して当然です。"
"10039100-8-ヒビキ" = "うん、ウタハ先輩はリラックスできてると良いんだけど。"
"10039100-9-ヒビキ" = "あ、先生もステージを見に来たの？"
"10039100-10-コトリ" = "おはようございます、先生！"
"10039100-11" = "[s1] \"おはよう！\"\n[s2] \"エンジニア部も見に来たんだね。\""
"10039100-12-ヒビキ" = "うん、先輩を応援しようと思って。"
"10039100-13" = "[ns] \"ウタハも出場してるんだったね？\""
"10039100-14-コトリ" = "はい、これは私たちのデビューライブなのです！"
"10039100-15-ヒビキ" = "先輩のステージ、期待してて。"
"10039100-16-ヒビキ" = "あ、始まりそう……。"
"10039100-17-コトリ" = "もう説明は不要ですね。"
"10039100-18" = "（生徒たちの様々なステージを眺めた）"
"10039100-19-司会者" = "さて、次のステージは～！"
"10039100-20-司会者" = "ミレニアムサイエンススクールから！"
"10039100-21-司会者" = "奇抜な発明品で有名な、エンジニア部の[ruby=しらいし]白石[/ruby]ウタハさんで～す！"
"10039100-22-観客A" = "あら、あの服装は……？"
"10039100-23-観客B" = "普通のアイドル衣装ではなさそうですね。"
"10039100-24-観客C" = "隣のロボットは……？"
"10039100-25-観客B" = "さ、さぁ……エンジニアの要素でしょうか？"
"10039100-26-司会者" = "それでは、ミュージックスタート！"
"10039100-27-コトリ" = "ついに始まりますね……！"
"10039100-28-ヒビキ" = "頑張って、先輩……。"
"10039100-29-観客B" = "……あら？"
"10039100-30-観客B" = "もしかして……。"
"10039100-31-観客C" = "え、演歌……？"
"10039100-32-観客A" = "……アイドルコンテストのはずですが？"
"10039100-33-観客B" = "どういうことでしょう……。"
"10039100-34" = "[ns] \"こ、これは……。\""
"10039100-35-ヒビキ" = "音程もリズムも完璧……！"
"10039100-36-コトリ" = "この曲はウタハ先輩の十八番ですから！"
"10039100-37-コトリ" = "ヒビキ、そろそろ時間です！#n私たちで熱く燃え上がるステージにしましょう！"
"10039100-38-ヒビキ" = "うん！#n全力でサポートしよう。"
"10039100-39" = "[ns] \"サポートって……？\""
"10039100-40-コトリ" = "それは私から説明を！#n熱く燃え上がる――"
"10039100-41-ヒビキ" = "先生も見ててね。#nきっと、先輩も喜んでくれるから。"
"10039100-42" = "[s] \"う、うん……。\""
"10039100-43-ヒビキ" = "さあ、行くよ……！"
"10039100-44-雷ちゃん" = "ピッ！ピピッ！"
"10039100-45-観客A" = "み、ミラーボールまで！？"
"10039100-46-観客B" = "あのロボットが、まさかミラーボールの役割を！？"
"10039100-47-観客C" = "それもホール全体に照明が届くほど……！"
"10039100-48-コトリ" = "良い調子ですね！#n注目をバッチリ集めています！"
"10039100-49-観客B" = "こんなステージ、初めてだ……。"
"10039100-50-観客B" = "え、演歌でミラーボールを……。"
"10039100-51" = "[s] \"本当に大丈夫なの……？\""
"10039100-52-ヒビキ" = "うん。あれを見て、先生。"
"10039100-53-観客C" = "……？"
"10039100-54-観客C" = "ずっと聞いていると、何だか楽しくなってきたね。"
"10039100-55-観客C" = "リズムに合わせて、勝手に足が……。"
"10039100-56-観客B" = "不思議と中毒性があるような……。"
"10039100-57-観客C" = "この切ない歌詞も良いですね……。"
"10039100-58-観客C" = "「染みる」って、こういうことを言うのかな？"
"10039100-59" = "[s3] \"こ、これは……。\"\n[s4] \"もしかして……！？\""
"10039100-60-コトリ" = "ふっふっふ……トリニティのお嬢様にとって、とても新鮮でしょう！"
"10039100-61-コトリ" = "それにウタハ先輩の歌声なら、皆さんの心に響くこと間違いなしですから！"
"10039100-62-ヒビキ" = "もうすぐクライマックス……装置を起動するよ！"
"10039100-63-観客A" = "こ、これは……。"
"10039100-64-観客B" = "何の装置！？"
"10039100-65-観客C" = "とても派手ですね……！"
"10039100-66-コトリ" = "ここは私が説明しましょう！#n暗いステージにインパクトを与えるため、ナパーム弾を配合していまして――"
"10039100-67" = "[s] \"危ないよね！？\""
"10039100-68-ヒビキ" = "安心して、先生。#n人に燃え移る心配はないよ。"
"10039100-69" = "[s] \"なら良いんだけど……。\""
"10039100-70-ヒビキ" = "万が一に備えて準備もしてあるから。"
"10039100-71-ヒビキ" = "そろそろかな……。"
"10039100-72-ヒビキ" = "……今！"
"10039100-73-観客A" = "これは……雨、ですか？"
"10039100-74-観客B" = "屋内なのに！？"
"10039100-75-コトリ" = "天井近くにドローン型のスプリンクラーを待機させておきました！#nヒビキの操作で火を消すと同時に――"
"10039100-76-ヒビキ" = "歌詞の内容と合わせた演出になってるの。"
"10039100-77-観客B" = "これも、舞台演出の一種なのでしょうか……？"
"10039100-78-観客B" = "すれ違う恋に、滲み出る雨水……感動しました。"
"10039100-79-観客B" = "……これは、涙？"
"10039100-80-観客C" = "最初は戸惑いましたが……。"
"10039100-81-観客C" = "……とても印象的なステージでしたね。"
"10039100-82-ウタハ" = "ありがとうございました。"
"10039100-83-司会者" = "……し、白石ウタハさんのステージでした～！"
"10039100-84" = "[ns5] \"思った以上に……。\"\n[ns6] \"良い反応だったね！\""
"10039100-85-ヒビキ" = "半分くらいはね。"
"10039100-86-ヒビキ" = "全員を満足させるのは、さすがに難しかった。"
"10039100-87" = "[ns7] \"……たしかに。\"\n[ns8] \"……なるほど。\""
"10039100-88-コトリ" = "ですが、最善を尽くしたのでオッケーです！#n先輩の歌も、完璧でした！"
"10039100-89-ヒビキ" = "うん、やれることはやった。"
"10039100-90" = "（予選の結果が発表された）"
"10039100-91" = "（エンジニア部は観客審査こそ良かったが、決勝進出には至らなかった）"
"10039100-92" = "[ns] \"……。\""
"10039100-93-ウタハ" = "……。"
"10039100-94-ウタハ" = "ふふっ、無事に落ちて良かった。"
"10039100-95-ヒビキ" = "そうだね。"
"10039100-96" = "[s] \"……えっ？\""
"10039100-97-ウタハ" = "実は、一曲しか準備できなかったんだ。"
"10039100-98-ウタハ" = "また同じ曲を披露しても、インパクトがないだろう。"
"10039100-99-コトリ" = "決勝戦の舞台は広いですから、効果的な演出を考えるには、もっと時間が必要でした！"
"10039100-100-ウタハ" = "ああ、結果は重要じゃない。"
"10039100-101-ウタハ" = "今日の私たちは、トリニティで演歌の素晴らしさをアピールできた。"
"10039100-102-ヒビキ" = "エンジニア部という名前もね。"
"10039100-103" = "[ns] \"……そっか。\""
"10039100-104" = "[ns] \"本当にそれでいいの？\""
"10039100-105-ウタハ" = "まぁ、悔いがないと言えば嘘になるよ。"
"10039100-106-ウタハ" = "だが、楽しい思い出になった。#nみんなはどうだい？"
"10039100-107-ヒビキ" = "はい、とても貴重な経験でしたね！#n先輩のおかげで、自分もステージに立っているかのような気分を味わえました！"
"10039100-108-ヒビキ" = "私も楽しかった。#n喜んでくれる人たちの顔が見られたから。"
"10039100-109" = "[s9] \"うん、良いステージだったね。\"\n[s10] \"みんな、お疲れ様。\""
"10039100-110-ウタハ" = "ふふっ、あとは純粋に楽しむだけだ。"
"10039100-111-ウタハ" = "先生も良かったら、一緒に見て回らないかい？"
"10039100-112" = "（その後、エンジニア部と謝肉祭を満喫した。風の噂によると、しばらくしてトリニティに演歌同好会が新設されたらしい……）"
