[translation]
"10039060-1" = "第6話;頂上決戦"
"10039060-2-トリニティの生徒B" = "……今の見た？"
"10039060-3-トリニティの生徒A" = "すごいスピードだった……。"
"10039060-4-トリニティの生徒A" = "……うん、カッコ良かったね。"
"10039060-5-トリニティの生徒B" = "でも……。"
"10039060-6-トリニティの生徒B" = "バイクに乗ってた人……。"
"10039060-7-トリニティの生徒A" = "あれ、たぶん……。"
"10039060-8-トリニティの生徒A" = "……シスターさん、だよね？"
"10039060-9" = "（急いでマリーに言われた場所へ向かった）"
"10039060-10-？？？" = "先生！"
"10039060-11" = "[ns1] \"マリー！？\"\n[ns2] \"本当にバイクに……。\""
"10039060-12-マリー" = "急にお呼び立てして、申し訳ありません……。"
"10039060-13-マリー" = "……ですが、先生がいてくだされば、最悪の事態は免れるはずです。"
"10039060-14-マリー" = "ヘルメットは、こちらをお使いください。"
"10039060-15" = "[s3] \"分かった、ありがとう。\"\n[s4] バイクの後ろに座る。"
"10039060-16-マリー" = "しっかりつかまってください、先生！"
"10039060-17-マリー" = "……では、出発します！"
"10039060-18-？？？" = "何かあるの？"
"10039060-19-？？？" = "シスターフッドと救護騎士団が部の存続をかけて決闘するんだって！"
"10039060-20-？？？" = "えっ、こんな時期に……？"
"10039060-21-？？？" = "むしろ、今だからじゃない？"
"10039060-22-ヒフミ" = "え、えっと……どういうことなのでしょう？"
"10039060-23-ヒフミ" = "いきなり決闘だなんて……。"
"10039060-24-アズサ" = "……なるほど。#n謝肉祭の隙を狙ったのか。"
"10039060-25-ヒフミ" = "それに決闘なら、すぐに終わる。"
"10039060-26-コハル" = "なに言ってるの！？#nおかしいわよ！"
"10039060-27-ハナコ" = "たしかに、コハルちゃんの言う通りですが……。"
"10039060-28-ハナコ" = "……些細な問題から決闘に発展してしまった可能性も否定できません。"
"10039060-29-ハナコ" = "ただ話が食い違っているだけという線も考えられますが……。"
"10039060-30-ハナコ" = "……ふふっ。#n楽しそうですし、そっとしておきましょうか。"
"10039060-31-ヒフミ" = "た、楽しそうって……。"
"10039060-32-シスターフッドの生徒A" = "この騒ぎは、いったい……。"
"10039060-33-シスターフッドの生徒A" = "サクラコ様は？"
"10039060-34-シスターフッドの生徒A" = "何度も電話してますが、ずっと繋がりません……。"
"10039060-35-シスターフッドの生徒B" = "モモトークも既読が付くだけですし……。"
"10039060-36-シスターフッドの生徒A" = "本当に何かが起きて……？"
"10039060-37-シスターフッドの生徒B" = "詳細は一部のメンバーにしか知らされていないとかでしょうか……。"
"10039060-38-シスターフッドの生徒B" = "私たちとてサクラコ様の考えを、全て理解できているわけではないですから……。"
"10039060-39-シスターフッドの生徒A" = "そうだとしても……。"
"10039060-40-シスターフッドの生徒B" = "ええ、もし決闘になってしまったら……。"
"10039060-41-シスターフッドの生徒A" = "勝ち目がないのでは！？#n相手はあのミネ団長なのですから！"
"10039060-42-シスターフッドの生徒B" = "となれば……。"
"10039060-43-シスターフッドの生徒B" = "私たちにできることを探さねばなりませんね。"
"10039060-44-シスターフッドの生徒A" = "……！"
"10039060-45-ハナエ" = "何がどうなっているんでしょう……。"
"10039060-46-ハナエ" = "決闘だなんて……ミネ団長から何か聞いてます？"
"10039060-47-ハナエ" = "いえ……私も初耳です……。"
"10039060-48-セリナ" = "団長のことですし、あり得ない話ではありませんが……これはいくらなんでも……。"
"10039060-49-ハナエ" = "何か誤解があったような気がします……。"
"10039060-50-セリナ" = "わあぁぁ……！み、皆さん、落ち着いてください！"
"10039060-51-セリナ" = "私たちは戦いに来ているわけではないんですよ……！？"
"10039060-52-セリナ" = "……？"
"10039060-53-セリナ" = "あの方たちは……。"
"10039060-54-セリナ" = "……！"
"10039060-55-セリナ" = "……ナギサ様……！？"
"10039060-56-ミカ" = "ねぇ、ナギちゃん……？"
"10039060-57-ナギサ" = "本当なの？"
"10039060-58-ミカ" = "いくら何でも、こんな日に争いを起こそうとするわけないじゃん。"
"10039060-59-ミカ" = "私たちが顔を出したら、余計にこじれるかもよ？"
"10039060-60-ナギサ" = "……ミカさん。"
"10039060-61-ナギサ" = "ティーパーティーは常に、ありとあらゆる事態に備えなければなりません。"
"10039060-62-ナギサ" = "ミカさんには、あちらのシスターフッドと救護騎士団の兵力が見えないのですか？"
"10039060-63-ナギサ" = "「決闘」と聞いてますが、#n我々ティーパーティーへ反旗を翻す計画をしている可能性もあります。"
"10039060-64-ナギサ" = "これは、トリニティの内戦を招きかねない事案です。"
"10039060-65-ナギサ" = "むしろ、こんな日だからこそ警戒すべきでした。"
"10039060-66-ナギサ" = "いざとなったら、その時はミカさんが……。"
"10039060-67-ミカ" = "……わ、私！？"
"10039060-68-ミカ" = "え、なに？#n私が戦うの……？"
"10039060-69-ミカ" = "ナギちゃん本気？#nそのために連れてきたの！？"
"10039060-70-ナギサ" = "全てはトリニティの安寧のためなのです！"
"10039060-71-ミカ" = "い、いやいや！"
"10039060-72-ミカ" = "私それ関係なくない！？#nそれに、まだ自粛中だし……。"
"10039060-73-ミカ" = "ねえ、ナギちゃん！#nお願いだから、もう少し冷静になろうよ！"
"10039060-74-ミカ" = "どうしよう、もう先生に連絡するしか……！"
"10039060-75-ナギサ" = "……。"
"10039060-76-ナギサ" = "……ついに現れましたね、当事者のお二人が。"
"10039060-77-ミネ" = "……時間通りですね、サクラコさん。"
"10039060-78-ミネ" = "結論は出せましたか？"
"10039060-79-サクラコ" = "ええ。"
"10039060-80-サクラコ" = "もちろんです。"
"10039060-81-サクラコ" = "このような重大な場に遅れるはずが――"
"10039060-82-サクラコ" = "それより、どうしたのでしょうか。"
"10039060-83-サクラコ" = "この人の数は……。"
"10039060-84-ミネ" = "救護騎士団の皆さんも揃ってますね……。"
"10039060-85-ミネ" = "……何かあったのでしょうか？"
"10039060-86-サクラコ" = "……どうやら、情報は正しかったようですね。"
"10039060-87-ナギサ" = "サクラコさん、ミネ団長。"
"10039060-88-ミネ" = "……ナギサさん？"
"10039060-89-ミネ" = "謝肉祭でお忙しいはずの方が、どうしてここに……？"
"10039060-90-ナギサ" = "この期に及んで白を切るとは……ずいぶんと侮られたものですね？"
"10039060-91-ミネ" = "……？"
"10039060-92-ミネ" = "……はい？"
"10039060-93-ナギサ" = "ティーパーティーのホストとして、正式に問います。"
"10039060-94-ナギサ" = "ここに集まっている理由をお答えください。"
"10039060-95-ミネ" = "……それは、「[ruby=カーニバル]謝肉祭[/ruby]運営委員長」でなく、#n「ティーパーティーのホスト」としての質問、ですか？"
"10039060-96-ナギサ" = "はい、何か問題でも？"
"10039060-97-ミネ" = "……なるほど。"
"10039060-98-ミネ" = "お答えしましょう。"
"10039060-99-ミネ" = "――そちらとは関係ない話です。"
"10039060-100-ナギサ" = "…………。"
"10039060-101-ナギサ" = "…………！"
"10039060-102-ナギサ" = "……ミカさん！"
"10039060-103-ミカ" = "ナギちゃん！？もうちょっと冷静になって！？"
"10039060-104-ミカ" = "も、もうちょっと話を……。"
"10039060-105-ナギサ" = "ミカ！"
"10039060-106-ミカ" = "あ～っ！#nもう、ナギちゃんったら！"
"10039060-107-ミカ" = "うぅ……どうなっても知らないんだからね！！"
"10039060-108-ミネ" = "……？"
"10039060-109-ミネ" = "銃を構えて、どうしたのですか！？"
"10039060-110-ミネ" = "ティーパーティーは……ナギサ様は何をお考えで！？#nついに自暴自棄になってしまったのですか！？"
"10039060-111-ミネ" = "……ナギサ様がご乱心であるのなら、私が救護騎士団の団長として受けて立ちます。"
"10039060-112-ミネ" = "サクラコさん、準備を！"
"10039060-113-サクラコ" = "……え？"
"10039060-114-ミネ" = "早く……！"
"10039060-115-サクラコ" = "え、えぇ……！？"
"10039060-116-サクラコ" = "どうしてこんなことに……！？"
"10039060-117-サクラコ" = "最初からこれを狙っていたのですね、サクラコ様……！"
"10039060-118-サクラコ" = "総員、戦闘準備！！"
"10039060-119-ミネ" = "戦闘態勢、用意！"
"10039060-120-セリナ" = "え、ええええええっ！？"
"10039060-121-ナギサ" = "よくも、こんな日にクーデターを……！"
"10039060-122-ミネ" = "いいえ！#nこれは権力に対する抗議です！"
"10039060-123-サクラコ" = "どうして、私は何も……！"
"10039060-124-ミカ" = "本当に知らないんだからね！"
"10039060-125" = "[log=마리]お待ちください！[/log]"
"10039060-126-マリー" = "……皆さん！"
"10039060-127-マリー" = "どうか……。"
"10039060-128-マリー" = "戦いをやめてください！！"
