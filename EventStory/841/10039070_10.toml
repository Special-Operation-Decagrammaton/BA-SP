[translation]
"10039070-1" = "第7話;[ruby=Antique Seraphim]アンティーク・セラフィム[/ruby]・ビギニング"
"10039070-2" = "[log=마리]\"皆さん、どうか戦いをやめてください！\"[/log]"
"10039070-3-ナギサ" = "……？"
"10039070-4-ミカ" = "せ、先生！？"
"10039070-5-サクラコ" = "マリーさん……それに、先生……。"
"10039070-6-サクラコ" = "どうして、こちらに？"
"10039070-7-サクラコ" = "それよりも、そのバイクは……。"
"10039070-8-マリー" = "事情は分かりませんが、戦いはやめてください！"
"10039070-9-マリー" = "まずは話し合いをしましょう！#nシャーレの先生もお連れしましたから！"
"10039070-10-マリー" = "……ほかでもない、平和と安全を象徴する[ruby=カーニバル]謝肉祭[/ruby]の開催期間中です！"
"10039070-11-マリー" = "皆さん、どうか銃を下ろしてください！"
"10039070-12" = "[ns1] \"みんな、とりあえず落ち着こうか。\"\n[ns2] \"何があったのか、説明してくれる？\""
"10039070-13-ナギサ" = "……。"
"10039070-14-ナギサ" = "……また、先生の手を煩わせてしまうとは。"
"10039070-15-ナギサ" = "少し長くなるかもしれませんが、最初からご説明しましょう。"
"10039070-16-ナギサ" = "トリニティにおいて、重大な――"
"10039070-17-ナギサ" = "……よく来てくれました！"
"10039070-18-ナギサ" = "実はマリーにお願いがあるのです。"
"10039070-19-ナギサ" = "……？"
"10039070-20-ナギサ" = "……はい？"
"10039070-21-マリー" = "……？"
"10039070-22-マリー" = "わ、私にですか……？"
"10039070-23-サクラコ" = "はい……もちろん、無理強いはしません。"
"10039070-24-ミネ" = "……！"
"10039070-25-ミネ" = "ちょうど私も、サクラコさんと同じ考えでした。"
"10039070-26-サクラコ" = "ふふ。ありがとうございます、ミネ団長。"
"10039070-27-マリー" = "すみません……。"
"10039070-28-マリー" = "お話が見えてこないのですが……。"
"10039070-29-ミネ" = "……ふふっ。"
"10039070-30-サクラコ" = "おそらく私たちは同じ結論に至ったのでしょう。"
"10039070-31-サクラコ" = "……マリー。"
"10039070-32-ミネ" = "マリーさん。"
"10039070-33-サクラコ" = "……アイドルグループの[ruby=リーダー]指導者[/ruby]になってくれませんか？"
"10039070-34-マリー" = "はい！？"
"10039070-35-ナギサ" = "……！？"
"10039070-36" = "[ns3] \"マリーをアイドルグループの……。\"\n[ns4] \"[ruby=リーダー]指導者[/ruby]に！？\""
"10039070-37-サクラコ" = "まずは謝らせてください。#n今まで練習に必死だったあまりに、マリーの気持ちを考えられていませんでした。"
"10039070-38-サクラコ" = "ですが、思い返すとアイドルについて話しているマリーは、#nとても楽しそうな表情をしていたと気づいたのです。"
"10039070-39-サクラコ" = "私たちよりも、マリーのほうが……。"
"10039070-40-サクラコ" = "「アイドル」に[ruby=ふさわ]相応[/ruby]しいと思うのです。"
"10039070-41-サクラコ" = "……私なりに、アイドルとはどのような存在なのかを考えてみました。"
"10039070-42-サクラコ" = "そして舞台に立ち、#n素敵なパフォーマンスで皆を笑顔にする者がそうなのだと思ったのです。"
"10039070-43-サクラコ" = "まさしく、光のように。"
"10039070-44-サクラコ" = "……この結論に至った時、ふとマリーの顔が浮かんだのです。"
"10039070-45-サクラコ" = "マリーこそ、誰よりもアイドルに相応しい存在……。"
"10039070-46-サクラコ" = "そして、私たちにとっての「アイドル」。"
"10039070-47-ミネ" = "もっと早く気づいていれば……。"
"10039070-48-ミネ" = "そもそも、グループの方向性やレッスンの内容は、#nマリーさんが決めてくれましたね。"
"10039070-49-ミネ" = "……ぜひ、リーダーになっていただけないでしょうか？"
"10039070-50-ミネ" = "私とサクラコさんの目標は、あくまでマイナスイメージを払拭するため。#nリーダーの座に拘っているわけではありませんから。"
"10039070-51-ミネ" = "マリーはシスターフッドでも、クラスでも信頼されているでしょう。"
"10039070-52-サクラコ" = "だからこそ、任せられると思ったのです。"
"10039070-53-マリー" = "え、えっと、つまり……。"
"10039070-54-マリー" = "わ、私が……。"
"10039070-55-マリー" = "私が、アイドルに……？"
"10039070-56-ミネ" = "……はい、その通りです。"
"10039070-57-ミネ" = "突然の提案で、混乱させてしまったかもしれませんが……。"
"10039070-58-サクラコ" = "……マリー。"
"10039070-59-サクラコ" = "一緒にアイドルをやりませんか？"
"10039070-60-マリー" = "皆さん……。"
"10039070-61-マリー" = "あれ……。"
"10039070-62-マリー" = "では、この集まりは……。"
"10039070-63" = "[ns5] \"指導者って……。\"\n[ns6] \"アイドルグループのリーダーのことだったんだね……。\""
"10039070-64-サクラコ" = "……？"
"10039070-65-サクラコ" = "そう、ですが……？"
"10039070-66-ミネ" = "まさか先生まで来てくださるとは思いませんでしたが、#n私たちの行く末を決める重大な場面でしたから助かりました。"
"10039070-67-ミネ" = "……？"
"10039070-68-ミネ" = "どうかされましたか……？"
"10039070-69-ミネ" = "……はっ。"
"10039070-70-ミネ" = "もしかして、私たちはマリーさんに無理強いを……！？"
"10039070-71-ミネ" = "……！"
"10039070-72-サクラコ" = "そうだったのですか！？#n申し訳ありません、無理にとは……！"
"10039070-73-マリー" = "い、いえ、違います！"
"10039070-74-マリー" = "実は、やってみたいと思っていましたので……と、とても嬉しいです！"
"10039070-75-マリー" = "……うぅ。"
"10039070-76-マリー" = "い、今の言葉は忘れてください……！"
"10039070-77-マリー" = "……ではなく、私もアイドルになって良いのでしょうか？"
"10039070-78-マリー" = "歌のパートは決まっていますし、衣装の準備がこれからとなると……。"
"10039070-79" = "[ns7] \"それなら心配いらないよ。\"\n[ns8] 写真を取り出す。"
"10039070-80-マリー" = "……？"
"10039070-81-マリー" = "……せ、先生！？"
"10039070-82-ミネ" = "これは……！"
"10039070-83-サクラコ" = "事前にご用意してくださったのですね。"
"10039070-84-ミネ" = "……ありがとうございます、先生。"
"10039070-85-マリー" = "で、ですが……！"
"10039070-86-マリー" = "ううぅ……！"
"10039070-87" = "[ns] \"……マリー。\""
"10039070-88" = "[ns9] \"みんな、マリーを大事に思ってるんだよ。\"\n[ns10] \"正直に答えてくれると嬉しいな。\""
"10039070-89-マリー" = "そんな……。"
"10039070-90-マリー" = "……うぅ。"
"10039070-91-マリー" = "で、では……。"
"10039070-92-マリー" = "……………………。"
"10039070-93-マリー" = "よ……。"
"10039070-94-マリー" = "よろしく……お願い、しますね。"
"10039070-95-マリー" = "……えへへっ。"
"10039070-96" = "[ns11] \"この破壊力は……！\"\n[ns12] \"す、すごい……！\""
"10039070-97-一同" = "マリー！マリー！マリー！マリー！"
"10039070-98-マリー" = "み、皆さん……！？"
"10039070-99-マリー" = "う、うぅ……。"
"10039070-100-ミカ" = "……。"
"10039070-101-ミカ" = "ねえ、ナギちゃん。"
"10039070-102-ミカ" = "言いたいことは？"
"10039070-103-ナギサ" = "み、ミカさん……。"
"10039070-104-ナギサ" = "これは、その……。"
"10039070-105-ミカ" = "……なぁに？"
"10039070-106-ナギサ" = "えっと……。"
"10039070-107-ナギサ" = "……いえ。"
"10039070-108-ミカ" = "……ふ～ん☆"
"10039070-109-ミカ" = "とりあえず、帰ろっか。"
"10039070-110-ミカ" = "ずっとここにいても、お邪魔だろうし。"
"10039070-111-ミカ" = "……お話は、あとで聞かせてもらうね？"
