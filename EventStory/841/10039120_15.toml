[translation]
"10039120-1" = "後日談その4;生活安全局による広報活動"
"10039120-2-フブキ" = "あの話、聞いた？"
"10039120-3-キリノ" = "はい！#n新しい監視カメラの導入と道路交通法の改正なら、すでに聞いています！"
"10039120-4-フブキ" = "いや、それじゃなくて……というか、そんなのあった？"
"10039120-5-フブキ" = "とにかく！"
"10039120-6-フブキ" = "今度、トリニティで[ruby=カーニバル]謝肉祭[/ruby]が開催されるらしいよ。"
"10039120-7-キリノ" = "それでしたか、楽しみですね！"
"10039120-8-フブキ" = "……はぁ、私たちはどうせ見回りでしょ。"
"10039120-9-フブキ" = "要するに、仕事が増えるだけ。"
"10039120-10-キリノ" = "市民の安全が守れるなら、それで良いではありませんか！"
"10039120-11-フブキ" = "キリノは相変わらず元気だねぇ。#n私は考えるだけでも面倒なのに……。"
"10039120-12-キリノ" = "余計なことを考えるから、面倒に思うのかもしれないですよ！"
"10039120-13-フブキ" = "たしかに、考えるのもやめとこうかな……。"
"10039120-14-ヴァルキューレの生徒" = "[ruby=カーニバル]謝肉祭[/ruby]に派遣されてきた方たちですね？"
"10039120-15-キリノ" = "はい！"
"10039120-16-ヴァルキューレの生徒" = "お疲れ様です、これをお渡ししておきます。"
"10039120-17-キリノ" = "何かの衣装でしょうか……？"
"10039120-18-ヴァルキューレの生徒" = "私も分からないんですが、上からの指示なので……。"
"10039120-19-ヴァルキューレの生徒" = "それでは、よろしくお願いします！"
"10039120-20-キリノ" = "これは……。"
"10039120-21-キリノ" = "……「謝肉祭の対応用衣装」？"
"10039120-22-フブキ" = "ま、とりあえず着替えてみる？"
"10039120-23" = "（しばらくして……）"
"10039120-24-フブキ" = "なにこれ……！"
"10039120-25-フブキ" = "いつも通りの市民対応じゃなかったの！？"
"10039120-26-キリノ" = "さ、さあ……。"
"10039120-27-キリノ" = "手違いで私たちのもとに届いたのでは……？"
"10039120-28-キリノ" = "上に抗議するしかないね！"
"10039120-29-キリノ" = "抗議ですか……？"
"10039120-30-カンナ" = "公安局長だ。用件は――"
"10039120-31-カンナ" = "……生活安全局か。"
"10039120-32-フブキ" = "この服、説明してほしいんだけど！"
"10039120-33-カンナ" = "何の話だ……。"
"10039120-34-フブキ" = "さっき急に渡されたんだけど、これ着て警備しろって言うの！？"
"10039120-35-カンナ" = "……ん？"
"10039120-36-カンナ" = "ああ、なるほど……。"
"10039120-37-カンナ" = "そういうことか。"
"10039120-38-フブキ" = "早く教えてよ！"
"10039120-39-キリノ" = "この衣装、本当に私たちが着るんですか！？"
"10039120-40-カンナ" = "二人とも、落ち着いて聞いてくれ。#nそれは今回の任務において、非常に重要なものだ。"
"10039120-41-キリノ" = "……えっ？"
"10039120-42-カンナ" = "民間企業から物資の支援を受ける代わりに、#n特別な衣装を着るよう指示があった。"
"10039120-43-カンナ" = "要するに……。"
"10039120-44-カンナ" = "企業の宣伝とヴァルキューレのイメージアップが目的で決定したらしい。"
"10039120-45-フブキ" = "き、聞いておりませんが！？"
"10039120-46-フブキ" = "ちょっと、責任が重すぎない？"
"10039120-47-フブキ" = "そもそも、これを着たくらいでイメージが変わると思ってるの？"
"10039120-48-カンナ" = "……少なくとも、私はよく似合っていると思う。"
"10039120-49-キリノ" = "たしかに、可愛いですが……。"
"10039120-50-カンナ" = "とにかく、上の決定には逆らえない。#n悪いが頑張ってくれ。"
"10039120-51-フブキ" = "なら局長も一緒に着てよ！"
"10039120-52-カンナ" = "おっと、通信が不安定のようだ……では、失礼する。"
"10039120-53-フブキ" = "もしもし？もしもし！？"
"10039120-54-フブキ" = "今、絶対に逃げたよね！？"
"10039120-55-キリノ" = "うーん……とりあえず、着るしかないようですね。"
"10039120-56-フブキ" = "ただでさえ面倒なのに、こんな格好まで……。"
"10039120-57-フブキ" = "こうなった以上、ストライキするよ！"
"10039120-58" = "（そして、謝肉祭当日……）"
"10039120-59-フブキ" = "……。"
"10039120-60-キリノ" = "……。"
"10039120-61-トリニティの生徒" = "あの、トイレはどこですか？"
"10039120-62-キリノ" = "廊下の奥にあります！"
"10039120-63-トリニティの生徒" = "ありがとうございます。"
"10039120-64-ウタハ" = "すまない、ステージ参加者の控え室を教えてもらいたいのだが……。"
"10039120-65-キリノ" = "204号から212号室です。#nそこを右に曲がって、階段をお上がりください！"
"10039120-66-ウタハ" = "そうか、ありがとう。"
"10039120-67-キリノ" = "どういたしまして、頑張ってくださいね！"
"10039120-68-フブキ" = "さっきから何やってるの、私たちもアイドルとして参加してるのに。"
"10039120-69-キリノ" = "はっ、そうでした。#nつい、いつもの癖で……。"
"10039120-70-キリノ" = "さっきの方、アイドルのステージで着物姿とは、珍しいですね……。"
"10039120-71-フブキ" = "ドーナッツ屋さんの宣伝衣装よりマシじゃない？"
"10039120-72-キリノ" = "前向きに考えましょうよ、フブキ！"
"10039120-73-フブキ" = "はぁ……。"
"10039120-74-キリノ" = "開催期間中はドーナッツが食べ放題になりましたし……。"
"10039120-75-キリノ" = "新商品を先に味わえることになったんですから。"
"10039120-76-フブキ" = "それはラッキーだけどさぁ……。"
"10039120-77-フブキ" = "行きつけのドーナッツ屋さんに依頼されたと分かったせいで、#n断れなかったじゃん……。"
"10039120-78-キリノ" = "ほら、張り切って行きますよ！"
"10039120-79-フブキ" = "面倒くさい……。"
"10039120-80-スタッフ" = "参加者の確認を行います。#n「プリティードーナッツ・ポリスガールズ」の皆さん、いらっしゃいますか？"
"10039120-81-キリノ" = "はい、こちらです！"
"10039120-82-フブキ" = "うぅ、名前も恥ずかしい……。"
"10039120-83-フブキ" = "まぁ、正式な参加者じゃなくて、#n協賛者としてステージに立つわけだからマシかな……。"
"10039120-84-キリノ" = "頑張りましょう！#n歌と踊りで、安全について周知する良い機会ですから！"
"10039120-85-キリノ" = "フブキだって、頑張って練習していたではありませんか！"
"10039120-86-フブキ" = "けど、みんなの前でやるのは……。"
"10039120-87-フブキ" = "はぁ、緊張で胃が……。"
"10039120-88-キリノ" = "だ、大丈夫ですか？#nまずは深呼吸でも……。"
"10039120-89-スタッフ" = "お名前を確認します。#n[ruby=なかつかさ]中務[/ruby]キリノさん？"
"10039120-90-キリノ" = "はい、ほんか……いえ、私です！"
"10039120-91-スタッフ" = "[ruby=ねむがき]合歓垣[/ruby]フブキさん？"
"10039120-92-フブキ" = "……はい。"
"10039120-93-？？？" = "た、助けてください……。"
"10039120-94-フブキ" = "ん……？"
"10039120-95" = "ちょっと、ここ！#n人が挟まってるよ？"
"10039120-96" = "だ、大丈夫！？"
"10039120-97-マリー" = "あ、ありがとうございます……。"
"10039120-98-キリノ" = "どうしてこんなところに……？"
"10039120-99-マリー" = "その、出番が近くなったら緊張して……。"
"10039120-100-マリー" = "人目のないところで深呼吸していたら、携帯を落としてしまったんです。#nそれを拾おうとしていたら……。"
"10039120-101-キリノ" = "大事に至らなくて良かったです……。"
"10039120-102-マリー" = "おかげ様で助かりました。本当にありがとうございます。"
"10039120-103-マリー" = "……あ、お二人もコンテストに参加されるんですか？"
"10039120-104-キリノ" = "ヴァルキューレの生活安全局として、ですが……。"
"10039120-105-フブキ" = "要するに、仕事だよ。"
"10039120-106-キリノ" = "……そうです！"
"10039120-107-マリー" = "なるほど……。"
"10039120-108-マリー" = "今日も平和のために……。"
"10039120-109-キリノ" = "そうだ、あの時は助かったよ。"
"10039120-110-キリノ" = "大活躍でしたね！"
"10039120-111" = "ふふ、ありがとうございます。"
"10039120-112-マリー" = "では、お二人も頑張ってくださいね。"
"10039120-113-キリノ" = "はい、シスターさんも頑張ってください！"
"10039120-114-フブキ" = "シスターさん、可愛かったね。"
"10039120-115-キリノ" = "そうですね。#n私たちのように、シスターフッドもイメージアップで参加しているのでしょうか？"
"10039120-116-フブキ" = "たぶん？"
"10039120-117-フブキ" = "ま、私はドーナッツのためだけど。"
"10039120-118-キリノ" = "あはは……。"
"10039120-119-キリノ" = "そういえば、何だか緊張が解けてませんか？"
"10039120-120-フブキ" = "たしかに……。"
"10039120-121-フブキ" = "シスターさんと話してたからかな。"
"10039120-122-キリノ" = "人の心に寄り添うのが得意な方なのかもしれませんね。"
"10039120-123-スタッフ" = "――ガールズ」の皆さん！"
"10039120-124-スタッフ" = "「プリティードーナッツ・ポリスガールズ」の皆さん、いらっしゃいませんか？"
"10039120-125-キリノ" = "あ、はい！こちらです！"
"10039120-126-キリノ" = "フブキ、いよいよ出番ですよ！"
"10039120-127-フブキ" = "はぁ、ついにこの時間が……。"
"10039120-128-キリノ" = "ほら立ってください！#n早く行きますよ！"
"10039120-129-フブキ" = "分かったよ……。"
"10039120-130" = "（その後、ライブで宣伝したドーナッツ屋の売上は、倍以上になったらしい）"
