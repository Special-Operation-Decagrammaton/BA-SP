[translation]
"10039035-1-キリノ" = "――シスターさん！"
"10039035-2-キリノ" = "本当に素晴らしい活躍でした！#nご協力ありがとうございます……！"
"10039035-3-マリー" = "お、お役に立てたならなによりです……。"
"10039035-4-フブキ" = "いやぁ、大助かりだったよ。"
"10039035-5" = "[s1] \"キリノの動きを完全にコピーしてたよ。\"\n[s2] \"マリーはダンスが上手なんだね。\""
"10039035-6-マリー" = "つい夢中になっていました……えへへ。"
"10039035-7-マリー" = "そういえば、二人はアイドルについて勉強してるんだっけ？"
"10039035-8-フブキ" = "せっかく助けてくれたのに、ダンスをちょっと教えただけってのもねぇ。"
"10039035-9-マリー" = "い、いえ……私のことはお気になさらず！"
"10039035-10-マリー" = "ふふっ、大丈夫。"
"10039035-11-フブキ" = "私が何かするわけじゃないよ。"
"10039035-12-フブキ" = "シスターさんも一緒にダンスレッスンを受けてみない？"
"10039035-13-フブキ" = "私が……。"
"10039035-14-フブキ" = "……ううん、キリノが話を通しとくから。"
"10039035-15-キリノ" = "つ、ついにフブキがやる気を……！"
"10039035-16-フブキ" = "生徒が増えると楽できるしね～。"
"10039035-17" = "[s3] （いつも通りのフブキだった……）\n[s4] \"マリーにとっても良い話だと思う。\""
"10039035-18-マリー" = "皆さん……！"
"10039035-19-マリー" = "フブキ～、キリノ～！"
"10039035-20-フブキ" = "……げっ。"
"10039035-21-アルバイト" = "助けてくれてありがとー！流石うちの常連さん！"
"10039035-22-アルバイト" = "ライブ、楽しみにしてるよ！#nその日はシフト入れずに……#nというか、臨時休業にして店長も行くんじゃないかな！"
"10039035-23-キリノ" = "う……。"
"10039035-24" = "[ns5] \"二人とも、人気なんだね。\"\n[ns6] \"大活躍だったね。\""
"10039035-25-マリー" = "なるほど……。"
"10039035-26-マリー" = "もし、アイドルになったら……。"
"10039035-27-マリー" = "……ふふっ。"
"10039035-28-マリー" = "とても楽しそうですね。"
"10039035-29" = "ダンス、クリア"
