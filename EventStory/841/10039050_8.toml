[translation]
"10039050-1" = "第5話;争いの予兆"
"10039050-2-？？？" = "はぁ、はぁ……。"
"10039050-3-？？？" = "……ふぅ。"
"10039050-4-？？？" = "ま、待って、ください……！"
"10039050-5-ミネ" = "……どうしたのですか、サクラコさん。"
"10039050-6-ミネ" = "まだ休憩時間ではありませんが……。"
"10039050-7-サクラコ" = "や、休みたいのではなく、おかしいと思いませんか？"
"10039050-8-サクラコ" = "今はダンスレッスンですよね？"
"10039050-9-ミネ" = "……？"
"10039050-10-ミネ" = "はい、そうですが。"
"10039050-11-ミネ" = "以前インターネットで調べたところ……。"
"10039050-12-サクラコ" = "アイドルは練習中、ジャージで練習していました。"
"10039050-13-サクラコ" = "このように、ステージ本番の衣装ではなく！"
"10039050-14-ミネ" = "それがどうしたのですか？"
"10039050-15-サクラコ" = "な、何かおかしなことを言いましたか……？"
"10039050-16-サクラコ" = "ジャージのほうが動きやすいではありませんか！"
"10039050-17-サクラコ" = "――だからです、サクラコさん。"
"10039050-18-ミネ" = "それでは練習になりません。"
"10039050-19-サクラコ" = "どういう意味でしょう……？"
"10039050-20-ミネ" = "こんな言葉を聞いたことはありませんか？"
"10039050-21-ミネ" = "……常に本番のつもりで練習するべきである、と。"
"10039050-22-サクラコ" = "……！"
"10039050-23-ミネ" = "サクラコさんの考えも分かります。"
"10039050-24-ミネ" = "ですが……素人だからこそ、当日に近い状態で練習しなくては間に合わないのではないですか？"
"10039050-25-サクラコ" = "そ、それでも……！"
"10039050-26-ミネ" = "常に本番のつもりで！"
"10039050-27-サクラコ" = "うっ……。"
"10039050-28-サクラコ" = "しかし、慣れないうちから動きづらい格好で踊っても、練習のペースが……。"
"10039050-29-サクラコ" = "このままでは、通しで踊れるようになるまで何日かかるか……。"
"10039050-30-サクラコ" = "いっそ、マリーに助言を求めては――"
"10039050-31-ミネ" = "サクラコさん！"
"10039050-32-サクラコ" = "……！？"
"10039050-33-サクラコ" = "困り事があるたびに、彼女を呼ぶとは……。"
"10039050-34-ミネ" = "マリーさんを何だと思っているのですか！？"
"10039050-35-サクラコ" = "えっ……！？"
"10039050-36-ミネ" = "サクラコさんに悪気はないかもしれませんが……。"
"10039050-37-ミネ" = "マリーさんからすれば先輩からの命令ですから、断りづらいでしょう！"
"10039050-38-サクラコ" = "……うっ。"
"10039050-39-サクラコ" = "で、では、先生にお願いするのは……。"
"10039050-40-ミネ" = "ダメです！"
"10039050-41-サクラコ" = "ええ、どうしてですか？"
"10039050-42-サクラコ" = "そもそも、他人任せなのが良くないのです！"
"10039050-43-ミネ" = "助けを求めるのが悪いとは言っておりません！#nただ、まずは自分で努力するべきでしょう！"
"10039050-44-ミネ" = "良いですか？#n私たちは、先生にもマリーさんにも充分お世話になっています。"
"10039050-45-ミネ" = "ですから、ここは二人で解決しなければいけません！"
"10039050-46-サクラコ" = "う、うっ……！"
"10039050-47-サクラコ" = "ミネ団長の意見は理解できますが、このままでは……！"
"10039050-48-ミネ" = "ええ、スケジュールが厳しいのは承知しています。"
"10039050-49-ミネ" = "しかし、それは他人任せにしても良い理由にはなりません。"
"10039050-50-ミネ" = "むしろ、こういった時こそ私たちの力の見せ所ではないでしょうか？"
"10039050-51-ミネ" = "これまで手を貸してくれた皆さんに、#n最高のパフォーマンスでお返しをしましょう。"
"10039050-52-サクラコ" = "……はい。"
"10039050-53-ミネ" = "ですから、もし誰かから連絡が来ても強い思いでスルーしてください。"
"10039050-54-ミネ" = "アイドルとしての活動が終わるまでは。"
"10039050-55-サクラコ" = "……はい、分かりました。"
"10039050-56-サクラコ" = "……。"
"10039050-57-サクラコ" = "しかし……。"
"10039050-58-サクラコ" = "振り付けすら合わせられないというのに、どうすれば良いのでしょう。"
"10039050-59-サクラコ" = "そもそも、アイドルに関する知識が……。"
"10039050-60-サクラコ" = "私はサクラコさんほどアイドルについて知らないわけでは……。"
"10039050-61-ミネ" = "アイドルソングも聞きますし。"
"10039050-62-サクラコ" = "でしたら、ミネ団長は私たちに足りていないものが分かりますか？"
"10039050-63-ミネ" = "それは……。"
"10039050-64-ミネ" = "……？"
"10039050-65-ミネ" = "……あっ。"
"10039050-66-サクラコ" = "……？"
"10039050-67-サクラコ" = "何か思い当たりましたか？"
"10039050-68-ミネ" = "……ええ。"
"10039050-69-ミネ" = "まさか、こんなにも大事な役割を忘れていたなんて。"
"10039050-70-サクラコ" = "大事な、役割……？"
"10039050-71-ミネ" = "そうです。"
"10039050-72-ミネ" = "ほかのアイドルグループには存在し、私たちのグループには存在しないもの。"
"10039050-73-ミネ" = "……それは、リーダーです。"
"10039050-74-サクラコ" = "なるほど……。"
"10039050-75-サクラコ" = "つまり、指導者のことでしょうか？"
"10039050-76-ミネ" = "ええ。#nグループの方向性を決め、導く役割です。"
"10039050-77-ミネ" = "もっと早く気づくべきでした……！"
"10039050-78-サクラコ" = "たしかに、指導者が不在では立ち行きませんね。"
"10039050-79-サクラコ" = "とすれば、リーダーには私よりもアイドルに詳しいミネ団長でしょうか？"
"10039050-80-サクラコ" = "いえ、そう簡単に決められるものではありません。"
"10039050-81-ミネ" = "知識が多いだけでリーダーが務まるわけではありませんから。"
"10039050-82-ミネ" = "最初にアイドル活動を提案し、#n手続きを進めてくださったサクラコさんが相応しいとも言えます。"
"10039050-83-ミネ" = "ですので、すぐに決めるのは難しそうです。"
"10039050-84-ミネ" = "それぞれ考える時間が必要でしょう。"
"10039050-85-ミネ" = "少しお疲れのようですし、休憩ついでに頭を整理するのはいかがですか？"
"10039050-86-サクラコ" = "……お気づきでしたか。"
"10039050-87-サクラコ" = "ここはありがたく、そういたしましょう。"
"10039050-88-サクラコ" = "……ひとまず着替えを済ませてきます。"
"10039050-89-ミネ" = "では……。"
"10039050-90-ミネ" = "二時間後、トリニティ・スクエアの噴水前で。"
"10039050-91-サクラコ" = "ええ。"
"10039050-92-サクラコ" = "……そこで、私たちの指導者を決めるとしましょう。"
"10039050-93-サクラコ" = "指導者に違いはありませんが……。"
"10039050-94-サクラコ" = "ほかの方々には、内密に進めましょう。"
"10039050-95-サクラコ" = "もちろん、シャーレの先生にも。"
"10039050-96-サクラコ" = "――これは、私たちのグループの問題ですから！"
"10039050-97-ミネ" = "サクラコさんの表現は、相変わらず……。"
"10039050-98-サクラコ" = "……何か間違っておりましたか？"
"10039050-99-ミネ" = "いえ、大丈夫です。"
"10039050-100-ミネ" = "では、また後ほどお会いしましょう。"
"10039050-101" = "？"
"10039050-102-ナギサ" = "……久しぶりの穏やかな時間ですね。"
"10039050-103-ナギサ" = "空も晴れていますし、[ruby=カーニバル]謝肉祭[/ruby]も順調……。"
"10039050-104-ナギサ" = "今年は例年よりも皆さん積極的に参加してくださっていますし……。"
"10039050-105-ナギサ" = "……紅茶を楽しむ余裕も出てくるというもの。"
"10039050-106-ナギサ" = "ふふっ、とっておきの茶葉を使ったからでしょうか。"
"10039050-107-ナギサ" = "……はぁ。"
"10039050-108-ナギサ" = "まったく、ミカさんはどこにいるのです。"
"10039050-109-ナギサ" = "セイアさんは部屋でお休みでしょうが……。"
"10039050-110-ナギサ" = "こういう日くらい……。"
"10039050-111-ナギサ" = "皆さんと……。"
"10039050-112-ナギサ" = "……そうですね。"
"10039050-113-ナギサ" = "いつも[ruby=わたくし]は私が[/ruby]呼び出しておりますが……。"
"10039050-114-ナギサ" = "たまにはこちらから伺うとしましょう。"
"10039050-115-ナギサ" = "特にトラブルは起きていないようですし――"
"10039050-116-ティーパーティーの監察官" = "な、ナギサ様！"
"10039050-117-ティーパーティーの監察官" = "……何度も申し上げておりますが、大きな音は立てないように。"
"10039050-118-ナギサ" = "ティーパーティーの一員として、気品ある行動を心がけてください。"
"10039050-119-ティーパーティーの監察官" = "申し訳ありません、ナギサ様……。"
"10039050-120-ティーパーティーの監察官" = "ですが、一大事でして！"
"10039050-121-ティーパーティーの監察官" = "一大事、とは？"
"10039050-122-ナギサ" = "何があったのですか？"
"10039050-123-ナギサ" = "学園祭のことでしたら、クラスの皆さんにお任せしたはずです。"
"10039050-124-ティーパーティーの監察官" = "えっと、情報局から報告が入りました。"
"10039050-125-ナギサ" = "情報局から、ですか……？"
"10039050-126-ティーパーティーの監察官" = "はい、ナギサ様。"
"10039050-127-ティーパーティーの監察官" = "シスターフッドの[ruby=うたずみ]歌住[/ruby]サクラコと救護騎士団の[ruby=あおもり]蒼森[/ruby]ミネが……。"
"10039050-128-ティーパーティーの監察官" = "二時間後、トリニティ・スクエアでグループの「指導者」を決めるとのことです……！"
"10039050-129-ナギサ" = "……？"
"10039050-130-ナギサ" = "……はい？"
"10039050-131-ナギサ" = "シスターフッドと救護騎士団が、指導者を……。"
"10039050-132-ナギサ" = "どういった経緯なのでしょうか？"
"10039050-133-ティーパーティーの監察官" = "詳しくは私も……。"
"10039050-134-ティーパーティーの監察官" = "ですが報告によりますと、お二人の様子はまるで戦いの前のようだったと……。"
"10039050-135-ナギサ" = "よりにもよって、この学園祭期間中に……なぜ？"
"10039050-136-ナギサ" = "彼女たちの間に、何が……。"
"10039050-137-ナギサ" = "（……むしろ、この時期を狙って？）"
"10039050-138-ナギサ" = "（学園祭でティーパーティーの力が分散している今だからこそ……）"
"10039050-139-ナギサ" = "（このタイミングでシスターフッドと救護騎士団が手を組めば、その規模は私たちを上回るでしょう）"
"10039050-140-ナギサ" = "（……）"
"10039050-141-ナギサ" = "（…………）"
"10039050-142-ナギサ" = "……っ！"
"10039050-143-ナギサ" = "……ふぅ、まずは落ち着きましょう。"
"10039050-144-ナギサ" = "ここで取り乱してしまえば、また同じ過ちを繰り返すことに。"
"10039050-145-ナギサ" = "信じるのです、皆さんを。"
"10039050-146-ナギサ" = "……まずは連絡してみましょう。"
"10039050-147-ナギサ" = "……サクラコさんは、留守のようですね。"
"10039050-148-ナギサ" = "では、ミネ団長に……。"
"10039050-149-ナギサ" = "……。"
"10039050-150-ナギサ" = "も、モモトークを送ってみましょうか。"
"10039050-151-ナギサ" = "「ご無沙汰しております」"
"10039050-152-ナギサ" = "「ただ今、妙な噂を耳に挟みまして……」"
"10039050-153-ナギサ" = "「ミネ団長とサクラコさんが何か計画している、と。もしよろしければ、事情を聞かせていただけませんか……？」"
"10039050-154-ナギサ" = "……これで大丈夫なはずです。"
"10039050-155-ナギサ" = "すぐに返信が……。"
"10039050-156-ナギサ" = "……なぜ電話には出られなかったのでしょう。"
"10039050-157-ナギサ" = "「お久しぶりです」"
"10039050-158-ナギサ" = "「こちらの問題ですので、ティーパーティーはどうかお気になさらず」"
"10039050-159-ナギサ" = "……？"
"10039050-160-ナギサ" = "な、ナギサ様……？"
"10039050-161-ナギサ" = "…………。"
"10039050-162-ティーパーティーの監察官" = "ナギサ様、ご指示を。"
"10039050-163-ナギサ" = "…………。"
"10039050-164-ナギサ" = "ミカさんを……。"
"10039050-165-ティーパーティーの監察官" = "……はい？"
"10039050-166-ナギサ" = "……ミカさんを呼んでください、今すぐに！"
"10039050-167" = "（校内の出し物やイベントを見て回っていた）"
"10039050-168" = "[ns1] （一日じゃ回りきれそうもない……）\n[ns2] （すごい規模だ……）"
"10039050-169" = "[ns3] （……電話だ）\n[ns4] 電話に出る。"
"10039050-170-？？？" = "……せい！"
"10039050-171-？？？" = "先生！"
"10039050-172-？？？" = "良かったです、つながりました。"
"10039050-173" = "[s5] \"マリー？\"\n[s6] \"何の音……？\""
"10039050-174-マリー" = "突然すみません、あまり時間が……！"
"10039050-175-マリー" = "バイクのエンジン音がうるさくてすみません……！"
"10039050-176" = "[ns7] \"……え？\"\n[ns8] \"……バイク？\""
"10039050-177-マリー" = "場所をお伝えするので、よろしければ……#nいえ、是が非でも来ていただけないでしょうか？"
"10039050-178-マリー" = "……緊急事態なんです！"
"10039050-179-マリー" = "詳細は会ってからお話します！"
"10039050-180-マリー" = "私も状況を把握できていないのですが……。"
"10039050-181-マリー" = "もしかしたら、トリニティで……。"
"10039050-182-マリー" = "内戦が起きるかもしれません！"
