[translation]
"10039020-1" = "第2話;アイドルの道：衣装"
"10039020-2-ノノミ" = "……なるほど。"
"10039020-3-ノノミ" = "でしたら、お任せください！"
"10039020-4-ノノミ" = "まずはビジュアルでしょう、可愛いは正義ですから！"
"10039020-5" = "[s1] \"の、ノノミ……！？\"\n[s2] \"さっきまでと目が……。\""
"10039020-6-マリー" = "び、ビジュアルですか？"
"10039020-7-ノノミ" = "あれ、思っていたよりも反応が……。"
"10039020-8-ノノミ" = "実は、私たちもアイドルの準備をしているんです。"
"10039020-9-ノノミ" = "なので、気になることがあれば何でも質問してくださいね！"
"10039020-10-マリー" = "……！"
"10039020-11-マリー" = "ありがとうございます！"
"10039020-12-マリー" = "ところで、その……。"
"10039020-13-マリー" = "ノノミさん以外の方は、どちらに……？"
"10039020-14-ノノミ" = "それはですね……。"
"10039020-15-ノノミ" = "……ふふっ、ちょうど良いかもしれません。"
"10039020-16-ノノミ" = "よろしければ、少し手伝っていただけませんか？"
"10039020-17" = "[s3] \"うん、もちろん。\"\n[s4] \"何をすれば良いの？\""
"10039020-18-ノノミ" = "もしかしたら、少し汗をかくかもしれませんが……。"
"10039020-19-ノノミ" = "……？"
"10039020-20-マリー" = "汗？"
"10039020-21-ノノミ" = "あとで説明しますね☆"
"10039020-22-ノノミ" = "みんな、恥ずかしがり屋さんで困っていたところなんです。"
"10039020-23-マリー" = "は、はい！"
"10039020-24-マリー" = "私でよろしければ、ぜひ！"
"10039020-25-ノノミ" = "ありがとうございます～！"
"10039020-26-ノノミ" = "もちろん先生も、一緒に来てくれますよね？"
"10039020-27" = "[s5] （少し嫌な予感がするけど……）\n[s6] \"……分かった。\""
"10039020-28-マリー" = "うんうん！"
"10039020-29-ノノミ" = "二人とも、私に付いてきてくださいね～☆"
"10039020-30-ノノミ" = "大丈夫ですか、シロコちゃん？"
"10039020-31-ノノミ" = "ん、手強い。"
"10039020-32-シロコ" = "ここまで抵抗されるとは思わなかった。"
"10039020-33-ノノミ" = "ホシノ先輩は？"
"10039020-34-シロコ" = "……あっち。"
"10039020-35-ホシノ" = "う、うへぇ……ごめんね。#nおじさん、そろそろ限界かも……。"
"10039020-36-ノノミ" = "ホシノ先輩まで……。"
"10039020-37" = "[ns7] \"ほ、ホシノ！？\"\n[ns8] \"いったい何が起きてるの！？\""
"10039020-38-マリー" = "……戦闘ですか！？"
"10039020-39-マリー" = "ノノミ、この人は……？"
"10039020-40-シロコ" = "トリニティの生徒だよね？"
"10039020-41-ノノミ" = "はい、シスターフッドのマリーさんです。#n先生と一緒にお手伝いに来てくれました。"
"10039020-42-ノノミ" = "……そうですね、まずは状況を説明しなくてはいけませんね。"
"10039020-43-ノノミ" = "イヤよ、着るわけないでしょ！"
"10039020-44" = "[ns9] \"……この声は？\"\n[ns10] \"セリカ……？\""
"10039020-45-ホシノ" = "あれ、先生も来てたんだ。"
"10039020-46-ホシノ" = "いやぁ、恥ずかしいところを見られちゃったね。"
"10039020-47-ホシノ" = "うちの後輩たち、すっごい照れ屋さんでさ。#n「説得」するつもりが、逆にやられちゃったんだ。"
"10039020-48-ホシノ" = "……何の話かって？"
"10039020-49-ホシノ" = "アイドルです！"
"10039020-50-マリー" = "……はい？"
"10039020-51-マリー" = "アイドル、ですか……？"
"10039020-52-マリー" = "この状況と、どのような関係があるのか私には……。"
"10039020-53-ホシノ" = "トリニティの学園祭で、アイドルイベントがあるでしょ？"
"10039020-54-ホシノ" = "そこでアビドスもユニットを結成しようって話になったんだ。"
"10039020-55-ホシノ" = "……「例の約束」もあったところだし？"
"10039020-56-ホシノ" = "まだ参加枠は残っているようですから！"
"10039020-57-ホシノ" = "……ん、一年生の二人ユニット。"
"10039020-58" = "[ns11] \"なるほど……。\"\n[ns12] \"そんな話もあったね。\""
"10039020-59-シロコ" = "いやぁ、自分たちで言い出したんだから。"
"10039020-60-ホシノ" = "そうだよね……セリカちゃん、アヤネちゃん？"
"10039020-61-セリカ" = "た、たしかに言ったけど……！"
"10039020-62-セリカ" = "でも、だからって[ruby=・   ・   ・   ・]こんな服[/ruby]を着るとか聞いてないわよ！"
"10039020-63-アヤネ" = "そ、そうですよ！#nいくら何でも、これは無理です！"
"10039020-64" = "[ns] （……こんな服？）"
"10039020-65-ノノミ" = "でも、その衣装は実際にアイドルさんが着るものですよ？"
"10039020-66-ノノミ" = "絶対に似合いますから。"
"10039020-67-ノノミ" = "で、ですが……。"
"10039020-68-ノノミ" = "恥ずかしがってないで、早くお披露目しちゃいましょう☆"
"10039020-69-シロコ" = "このままじゃ参加締め切りに間に合わない。#n早く写真を撮らせて。"
"10039020-70-シロコ" = "アヤネちゃん、聞いた？#n時間まで逃げるわよ！"
"10039020-71-シロコ" = "う、うん！"
"10039020-72-ホシノ" = "まさか、アヤネちゃんがヘリまで使うとは思わなかったよ。"
"10039020-73-ホシノ" = "うへぇ、よっぽど恥ずかしかったんだね。"
"10039020-74-ノノミ" = "力尽くで連れ出すわけにはいきませんが……。"
"10039020-75-ノノミ" = "先生とシスターさんがいれば、何とかなるかもしれないです。"
"10039020-76-マリー" = "え、ええ！？"
"10039020-77-マリー" = "私は、その……！"
"10039020-78-マリー" = "ごめんねぇ。#nちょっとおじさんたちに手を貸してくれないかな？"
"10039020-79-マリー" = "……だって、「約束」したしねぇ？"
"10039020-80-シロコ" = "ん、約束は大事。"
"10039020-81" = "[ns13] \"……たしかに。\"\n[ns14] \"約束は守らないとね。\""
"10039020-82-ホシノ" = "……！"
"10039020-83-マリー" = "……分かりました。"
"10039020-84-マリー" = "微力ながらお手伝いいたします！"
"10039020-85-ノノミ" = "うんうん！#nありがとうございます、マリーさん、先生！"
"10039020-86-ノノミ" = "それじゃあ……！"
"10039020-87-ノノミ" = "行きますよ～☆"
