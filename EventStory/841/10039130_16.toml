[translation]
"10039130-1" = "後日談その5;ジャスティス☆プリンセス"
"10039130-2" = "（正義実現委員会が演劇を準備していると聞き、様子を見に行くことに）"
"10039130-3-イチカ" = "先生、こっちっすよ！"
"10039130-4" = "[s] \"イチカ！？格好良いね、その衣装！\""
"10039130-5-イチカ" = "ははっ。#n何の役か分かりますか？"
"10039130-6" = "[s] \"王子様の役だよね？\""
"10039130-7-イチカ" = "正解っす！#nまぁ、成り行きで決まって。"
"10039130-8-イチカ" = "でも、結構練習したんすよ。"
"10039130-9-イチカ" = "せっかくですし、先生も見ていってください。"
"10039130-10" = "[s1] \"もちろん。\"\n[s2] \"どんな演劇なの？\""
"10039130-11-イチカ" = "えっと、「麻痺した森の姫」という古典劇っす。"
"10039130-12-イチカ" = "題名の通り、王子様が数々の苦難を乗り越えて、#n麻痺したお姫様を救う物語っすね。"
"10039130-13-イチカ" = "これが意外と面白いんすよ。#nそれじゃ、行きましょうか。"
"10039130-14" = "（劇場の座席に座っているツルギを発見した）"
"10039130-15-ツルギ" = "せ、せせせせ、先生！？"
"10039130-16" = "[s3] \"おはよう、ツルギ。\"\n[s4] \"隣、座っても良いかな？\""
"10039130-17-ツルギ" = "うあぁぁ、きええぇぇぇ……。"
"10039130-18-ツルギ" = "あっ、すみません。#nここでは静かにしないと……。"
"10039130-19-ツルギ" = "……お、おはようございます、先生。どうぞ、こちらにお座りください……。"
"10039130-20" = "（ツルギの隣に座って、劇の練習を眺めた）"
"10039130-21-正義実現委員会部員" = "ああ、姫が誕生した！"
"10039130-22-ツルギ" = "次の台詞は……。"
"10039130-23-ツルギ" = "「我々が姫に贈り物をご用意しました」……。"
"10039130-24-正義実現委員会部員" = "我々が姫に贈り物をご用意しました！"
"10039130-25-ツルギ" = "「姫、これは美しさです」……。"
"10039130-26-正義実現委員会部員" = "姫、これは美しさです。"
"10039130-27" = "[ns] \"もしかして、台詞を全部覚えてるの？\""
"10039130-28-ツルギ" = "あっ、はい……。"
"10039130-29-ツルギ" = "せっかく、みんなが頑張っているわけですし……。"
"10039130-30" = "[s] \"すごいね！ツルギはどんな役なの？\""
"10039130-31-ツルギ" = "……役は、ありません。#n私は小道具の準備や脚本の話し合いに参加するだけで……。"
"10039130-32-ツルギ" = "恋愛小説を読んでいたのが、役に立ったようです。"
"10039130-33-ツルギ" = "……それに、私よりも相応しい生徒は多いですから。"
"10039130-34-ツルギ" = "私なんて、みんなに怖がられるだけですし……。"
"10039130-35" = "[s] \"……そっか、台詞まで覚えてるのに。\""
"10039130-36-ツルギ" = "気にしないでください……見ているだけでも楽しいですから。"
"10039130-37-ツルギ" = "私には、これで充分です……。"
"10039130-38" = "[s5] \"ツルギがそう言うのなら……。\"\n[s6] \"本番も楽しみにしてるね。\""
"10039130-39-ツルギ" = "ふふ……はい、自信作です。"
"10039130-40" = "（こうして、この日はツルギと練習を見学した）"
"10039130-41" = "（翌日、本番の演劇を見るために再びトリニティへ足を運んだ）"
"10039130-42" = "[ns7] \"こんなに観客が……！\"\n[ns8] \"すごい人気だね！\""
"10039130-43-イズナ" = "あっ、主殿！"
"10039130-44-ツクヨ" = "おー、先生殿！"
"10039130-45-ツクヨ" = "こ、こんにちは、先生……。"
"10039130-46" = "[s9] \"みんなも来てたんだ！\"\n[s10] \"劇を見にきたの？\""
"10039130-47-ミチル" = "ふっふっふっ、その通り！"
"10039130-48-ミチル" = "舞台では、いろんな演技や道具を使って、#n非現実を現実にしてるでしょ！"
"10039130-49-ミチル" = "つまり、演劇は忍術と似てると言える！"
"10039130-50-ミチル" = "というわけで、これも修行の一環！"
"10039130-51-イズナ" = "さすがです、部長……！#nイズナも頑張ります、ニンニン！"
"10039130-52-ミチル" = "それに、私たちの様子を撮影して「別学園の生徒の反応」ってタイトルをつけて投稿すれば、「少女忍法帖ミチルっち」の再生回数が伸びるんじゃないかなって……。"
"10039130-53-ツクヨ" = "き、きっと効果は、あると思います……#nトリニティ[ruby=カーニバル]謝肉祭[/ruby]は、キヴォトス全域で注目される、巨大イベントですから……。"
"10039130-54-ツクヨ" = "こ、こういう時に使う言葉があったような……。"
"10039130-55-ツクヨ" = "えっと、漁夫の利……？"
"10039130-56-ツクヨ" = "虎の威を借る狐、でしたっけ……？"
"10039130-57-ミチル" = "まあ、難しい言葉は置いといて～！"
"10039130-58" = "[s11] \"そういう作戦だったのか……！\"\n[s12] \"さすがは忍術研究部！\""
"10039130-59-イズナ" = "主殿も劇を見に来たのですか？"
"10039130-60-イズナ" = "イズナたちと一緒に見るのはどうでしょう！"
"10039130-61-ミチル" = "先生殿なら歓迎だよ。#n良いリアクションが撮れそうだし！"
"10039130-62" = "[s] \"ごめんね、ちょっと用事があって……。\""
"10039130-63" = "[ns] \"私は行かなきゃいけないんだ。\""
"10039130-64-イズナ" = "なるほど、任務でしたら仕方ありません！#n何かあれば、いつでもイズナに連絡してください！"
"10039130-65-ミチル" = "が、頑張って、ください……先生。"
"10039130-66-ミチル" = "私たちは始まる前に撮影練習でもしてようかな。"
"10039130-67" = "（場内の撮影許可は、あとで忘れずに聞いておこう……）"
"10039130-68" = "[ns] \"あれは……。\""
"10039130-69-正義実現委員会部員" = "……困りましたね。"
"10039130-70-正義実現委員会部員" = "ど、どうすれば……。"
"10039130-71-ツルギ" = "……まずは、代わりの人を探さなくてはなりません。"
"10039130-72-イチカ" = "あ、先生。#n今日も来てくれたんすね。"
"10039130-73-ツルギ" = "先生……！"
"10039130-74-ツルギ" = "せ、先生……。"
"10039130-75" = "[s] \"みんな、何かあったの？\""
"10039130-76-イチカ" = "その……。"
"10039130-77-ハスミ" = "実は……。"
"10039130-78-ハスミ" = "姫役の生徒が、来る途中でロケットに当たり負傷したとのことです。"
"10039130-79" = "[s] \"そんな……。\""
"10039130-80-ハスミ" = "幸い、大事には至らなかったようですが、舞台に上がるのは厳しく……。"
"10039130-81-イチカ" = "はあ……。"
"10039130-82-イチカ" = "姫役は火の輪くぐりをしたり、銃弾を避ける場面があるんすよね。"
"10039130-83-イチカ" = "だから、できる人は限られてるんすよ……。"
"10039130-84" = "[s] \"大変な役だね……。\""
"10039130-85-イチカ" = "なるべく原作通りの劇にしたかったっすから……。"
"10039130-86-ハスミ" = "とにかく、急いで代わりの方を……。"
"10039130-87-イチカ" = "このままじゃ、劇が中止に……。"
"10039130-88-ツルギ" = "きえぇぇ……。"
"10039130-89" = "[ns13] \"適任者なら、ここにいると思うよ。\"\n[ns14] \"ツルギが演じるのはどう？\""
"10039130-90-ツルギ" = "っ！？"
"10039130-91-ツルギ" = "げ、げほ、げほ……！#nぐふあぁっ……！"
"10039130-92-ハスミ" = "先生、それは……。"
"10039130-93" = "[s15] \"ツルギなら全部の台詞を覚えてるし……。\"\n[s16] \"身体能力は、言うまでもないよね。\""
"10039130-94" = "[ns] \"姫役にピッタリじゃないかな。\""
"10039130-95-ツルギ" = "せ、先生……！？"
"10039130-96-ハスミ" = "たしかに、一理あります。"
"10039130-97-ツルギ" = "ハスミ……！？"
"10039130-98-ハスミ" = "先生の仰る通り、ツルギこそ姫役に適任だと思います。"
"10039130-99-ツルギ" = "わ、私は……姫なんて、似合わないのに……。"
"10039130-100-イチカ" = "私も同意見っす。"
"10039130-101-ツルギ" = "い、イチカまで……？"
"10039130-102-イチカ" = "ツルギ先輩、この演劇に本気だったすよね？"
"10039130-103-イチカ" = "練習もみんなより早く来て舞台をセッティングしたり、#n脚本の構成や衣装の用意までやってくれたじゃないっすか。"
"10039130-104-イチカ" = "演者の立ち位置も頭に入ってるでしょうし、#nツルギ先輩なら行けると思うっす！"
"10039130-105-ツルギ" = "で、でも……。"
"10039130-106-ツルギ" = "演技力もなければ……。"
"10039130-107" = "普段から、恋愛小説や映画をたくさん見ているでしょう？"
"10039130-108-ツルギ" = "けど……。"
"10039130-109-ハスミ" = "たまに名シーンを真似してるところも見ていますよ。"
"10039130-110-ツルギ" = "そ、それは！"
"10039130-111-ツルギ" = "恥ずかしいから、やめて……。"
"10039130-112-ハスミ" = "恥ずかしがらなくて良いのです。#nツルギの経験は、きっと役立ちます。"
"10039130-113-ツルギ" = "……。"
"10039130-114-イチカ" = "絶対大丈夫っすよ！"
"10039130-115" = "[s] \"私も、ツルギならできると思う。\""
"10039130-116-ツルギ" = "え、えっと……。"
"10039130-117-ツルギ" = "う、うぅ……。"
"10039130-118-ツルギ" = "……やって、みる。"
"10039130-119-イチカ" = "ありがとうございます、ツルギ。"
"10039130-120-イチカ" = "じゃ、さっそく着替えるっすよ！"
"10039130-121-ツルギ" = "き、きええぇ……。"
"10039130-122-ハスミ" = "ふぅ、これで姫役は何とかなりましたが……。"
"10039130-123" = "[s] \"まだ問題が残ってるの？\""
"10039130-124-ハスミ" = "はい、実は……。"
"10039130-125-ハスミ" = "木の役の方もロケットに巻き込まれたようで……。"
"10039130-126-ハスミ" = "どこかに頼める方がいれば良いのですが……。"
"10039130-127" = "[ns17] \"ちょうど適任の子に心当たりがあるから……。\"\n[ns18] \"お願いしてみようか？\""
"10039130-128-ハスミ" = "ほ、本当ですか？"
"10039130-129" = "[ns] （忍術研究部に連絡する）"
"10039130-130-ミチル" = "おー！"
"10039130-131-ミチル" = "それなら、我々忍術研究部にどーんと任せて！"
"10039130-132-ツクヨ" = "主殿のお役に立てるだなんて、イズナ嬉しいです！"
"10039130-133-ツクヨ" = "木の役でしたら、自信あります……！"
"10039130-134" = "[s19] \"目立つ役じゃないけど……。\"\n[s20] \"……それでも大丈夫？\""
"10039130-135-ツクヨ" = "学芸会では、いつも木の役をしていましたので。"
"10039130-136-ツクヨ" = "ほかの役をできなかったのは、少し残念でしたが……。"
"10039130-137-ツクヨ" = "忍術研究部に入ってから、人にはそれぞれ役割があると学びました！"
"10039130-138-ミチル" = "ツクヨ……。"
"10039130-139-ミチル" = "ツクヨ殿……。"
"10039130-140-ツクヨ" = "どんな役も、大切ですから。#n私は今の自分が……好き、です。"
"10039130-141-ツクヨ" = "それに……。"
"10039130-142-ツクヨ" = "正義実現委員会の皆さんの役に立てるなら、とても嬉しいです！"
"10039130-143-ミチル" = "イズナもそう思います！"
"10039130-144-ミチル" = "よく言ってくれたよ、ツクヨ！"
"10039130-145-ミチル" = "劇に出演するんだし、二本は動画投稿できそうだね！"
"10039130-146" = "[s21] \"それが目的だったの！？\"\n[s22] \"ありがとう、みんな。\""
"10039130-147" = "（こうして各自、演劇の準備に取りかかった）"
"10039130-148-観客" = "正義実現委員会の演劇、楽しみじゃない？"
"10039130-149-観客" = "しかも、「麻痺した森の姫」なんだってね。"
"10039130-150-観客" = "すごい！#nもう満席だよ？"
"10039130-151-観客" = "あそこにワイルドハントの生徒も来てるよ！"
"10039130-152" = "[s] \"みんな、頑張って……！\""
"10039130-153-観客" = "そろそろ始まりそう……！"
"10039130-154-ナレーション" = "昔、昔……。"
"10039130-155-ナレーション" = "あるところに、お姫様がいました。"
"10039130-156" = "[ns] \"おぉ……！\""
"10039130-157-ツルギ" = "わあ、お姫様役、めっちゃ綺麗！"
"10039130-158-ツルギ" = "正義実現委員会にあんな子いたっけ？"
"10039130-159" = "[ns] \"ツルギ、緊張してるのかな……？\""
"10039130-160-ツルギ" = "……。"
"10039130-161-ツルギ" = "[ruby=ワスレナグサ]勿忘草[/ruby]が、美しく咲いていますね。"
"10039130-162" = "[s] \"おお……！\""
"10039130-163-ツルギ" = "声、きれい……。"
"10039130-164-ツルギ" = "本物のお姫様みたい……！"
"10039130-165" = "（心配とは裏腹に、ツルギの演技はとても素晴らしかった）"
"10039130-166-ツルギ" = "その時、姫は糸紡ぎの針に刺されてしまう……！"
"10039130-167-ツルギ" = "きゃっ……！"
"10039130-168-ナレーション" = "こうして姫の体は麻痺してしまいました……。"
"10039130-169-ナレーション" = "姫よ、どうして……。"
"10039130-170-観客" = "あぁ……。"
"10039130-171-観客" = "もう結末は分かっているけど……。"
"10039130-172-観客" = "初めて見た時と同じくらい緊張するね……！"
"10039130-173-イチカ" = "おお、美しき姫よ……！"
"10039130-174-イチカ" = "夜空の如く漆黒の髪、薔薇にも勝る紅い唇を守るため……。"
"10039130-175-イチカ" = "……白馬に乗って、急ぎお迎えに参りました！"
"10039130-176-イチカ" = "わぁ！#n王子役の人、誰なんだろう……格好良い！"
"10039130-177-イチカ" = "やばい……私、好きになりそう！"
"10039130-178" = "（その後も演劇は順調に進み、いよいよクライマックスに）"
"10039130-179-ツルギ" = "（このパートは、体の力を抜いて……）"
"10039130-180-ツルギ" = "（せ、先生……！）"
"10039130-181-ツルギ" = "（先生と目が……！）"
"10039130-182-ツルギ" = "（……私を見て！）"
"10039130-183" = "[ns23] 身振り手振りで応援する。\n[ns24] （ツルギ、頑張れ！）"
"10039130-184-ツルギ" = "（先生が……私に、エールを……！）"
"10039130-185-ツルギ" = "（い、いけない。先生を意識すると……う、うぅぅぅぅ！）"
"10039130-186-ツルギ" = "く、くぅぅううう……ぎえええぇぇええええぇぇぇっ！！！！"
"10039130-187-イチカ" = "ひ、姫……。"
"10039130-188-イチカ" = "……姫！"
"10039130-189-イチカ" = "これで大丈夫です……！"
"10039130-190-イチカ" = "ご安心を、姫！"
"10039130-191-ツルギ" = "き、きえええぇぇ……！"
"10039130-192-イチカ" = "たとえ何があろうと、あなたの味方で在り続けると誓いましたから……！"
"10039130-193-ツルギ" = "ぐ、ぐうぉぉぉ……！！"
"10039130-194-観客" = "……姫役の人、急にどうしたんだろう？"
"10039130-195-観客" = "本当に麻痺してるとか……？"
"10039130-196" = "[s] （しまった……！）"
"10039130-197-ワイルドハントの生徒" = "こ、これは……！"
"10039130-198-ワイルドハントの生徒" = "まさか……表現主義を演劇に持ち込んでいるのですね！？"
"10039130-199-観客" = "え……？"
"10039130-200-ワイルドハントの生徒" = "とてもリアリティで迫力があります！"
"10039130-201-ワイルドハントの生徒" = "役そのものに、ここまで溶け込むだなんて……。"
"10039130-202-ワイルドハントの生徒" = "まさか、トリニティで新たな見識を広められるとは……素晴らしい！"
"10039130-203-観客A" = "ワイルドハントの生徒が拍手してる……！"
"10039130-204-観客B" = "え、どういうこと？"
"10039130-205-観客C" = "よく分かんないけど、たぶんすごいんじゃない！？"
"10039130-206" = "[ns] \"この歓声は……。\""
"10039130-207-イチカ" = "（何がどうなってるか分からないっすけど……）"
"10039130-208-イチカ" = "（ツルギ先輩、このまま続けるっすよ！）"
"10039130-209-ツルギ" = "ぐおおおおおおぉっ！！"
"10039130-210" = "（正義実現委員会の演劇は、成功に終わった）"
"10039130-211" = "（しかし、カーテンコールで拍手をもらったツルギは、その場で気絶してしまった）"
