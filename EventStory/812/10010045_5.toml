[translation]
"10010045-1" = "第4話;スラムの要塞へ（２）"
"10010045-2-ヘルメット団B" = "な、何なんだよもうっ！"
"10010045-3-ヘルメット団B" = "良いから撤退だ！さっさと逃げるぞ！"
"10010045-4" = "（突然のことに驚いたのか、ヘルメット団は次々に逃げ出していった）"
"10010045-5-ヨシミ" = "あははっ、ざまぁないわね！"
"10010045-6-アイリ" = "ヨシミちゃん、その台詞すごいチンピラっぽい……。"
"10010045-7-カズサ" = "良いんじゃん、似合ってるし。"
"10010045-8-ヨシミ" = "あははははははっ！！一昨日来やがれってのよ！"
"10010045-9-カズサ" = "うわ、ノリノリだ……まあとりあえず、店主さんもトラックも無事に取り戻せたし。一件落着かな。"
"10010045-10-アイリ" = "先生、ありがとうございました！"
"10010045-11" = "[s1] \"ううん、みんなお疲れ様。\"\n[s2] \"あんまり怪我も無くて良かった。\""
"10010045-12-ナツ" = "あ。"
"10010045-13-ナツ" = "あ。"
"10010045-14-ナツ" = "そういえば……。"
"10010045-15-ヒナタ" = "……？"
"10010045-16-ヒナタ" = "えっと、どうかしましたか？そんなにじっと見られると……。"
"10010045-17-ナツ" = "シスターさんがちゃんと戦ってるところ、初めて見たかも。すごいね。"
"10010045-18-ヒナタ" = "す、「すごい」とは……！？"
"10010045-19-ナツ" = "すみません、悪気は無いんです。"
"10010045-20-カズサ" = "ただ、「かっこよかった」と言いたいんじゃないでしょうか。"
"10010045-21-ヨシミ" = "あっ、確かに！最初機関銃で正門をぶっ壊したところとか、スカッとしちゃった！"
"10010045-22-ナツ" = "実際、こっちの戦力のうち結構な割合を担ってたもんね。ひとりだけ戦車みたいな感じで。"
"10010045-23-ヒナタ" = "せ、戦車！？いえ、そんな、私はその……！"
"10010045-24-ヒナタ" = "……あれ。あらためて聞くとそれ、素直に誉め言葉として受け取って良いんでしょうか！？"
"10010045-25-カズサ" = "……ナツ。"
"10010045-26-ナツ" = "うん、ごめんなさい。あくまで誉め言葉のつもりだよ。"
"10010045-27-ナツ" = "まあ何にせよこれ……褒章は、シスターさんが受け取るのが良いんじゃないかな。"
"10010045-28-ヒナタ" = "えっと、これは……"
"10010045-29-ヒナタ" = "「ミラクル5000」、その最後のひとつ。"
"10010045-30-ナツ" = "もちろん私たちも食べたいところだけど、シスターさんは何か込み入った事情があるみたいだし。"
"10010045-31-ナツ" = "さっきまでの雄姿を見てたら、"
"10010045-32-ナツ" = "満場一致だと思うんだけど……どう？"
"10010045-33-カズサ" = "私は賛成！"
"10010045-34-カズサ" = "店主さんも解放できて、これからまた作ってもらえるだろうし。別に急ぐ理由は無いよ。"
"10010045-35-ヨシミ" = "もう5日も我慢してるんだから、あと1日くらい平気！"
"10010045-36-ヒナタ" = "み、みなさん……。"
"10010045-37-？？？" = "……いや、その必要は無い。"
"10010045-38-ヒナタ" = "……？"
"10010045-39-ヒナタ" = "えっと、あなたは……？"
"10010045-40-スイーツ屋の店主" = "……何せ、こうして解放してくれたんだからね！"
"10010045-41-ヒナタ" = "こんな状況で、店主である私が何もしないわけにはいかないさ。最近作れなくってヤキモキしてたし……。"
"10010045-42-ヒナタ" = "よし、早速今からケーキを作ろう！"
"10010045-43-スイーツ屋の店主" = "個数限定と言わず、材料の限りいくらでも作るぞ！「ミラクル5000」パーティだ！"
"10010045-44-ナツ" = "……。"
"10010045-45-ナツ" = "……にひ。"
"10010045-46-ナツ" = "これぞ「ミラクル」……だね。"
