[translation]
"10010145-1" = "第14話;イット・サーヴズ・ユー・ライト（４）"
"10010145-2" = "（……）"
"10010145-3-ウイ" = "お、おかえりなさい、先生……そろそろかと思っていましたが……。"
"10010145-4-ウイ" = "その表情……ど、どうやら、上手く行ったようですね。"
"10010145-5-ウイ" = "す、少し、肩の荷が下りました。"
"10010145-6-ウイ" = "……？あ、その、私はSNSとかあまり見ないので……ニュースとかは、今でも新聞とかから時々……。"
"10010145-7-ウイ" = "ま、まあ新聞の方には、そもそも最初から載っていませんでしたが……内容的に、そうしたかったんですかね。"
"10010145-8-ウイ" = "とにかく、まあ、お疲れ様でした……私も、疲れましたし。"
"10010145-9-ウイ" = "……本当に疲れましたよ、はい。"
"10010145-10-ウイ" = "け、結構な時間と集中力を……それに最後は……。"
"10010145-11-ウイ" = "自分の力で解決もできず、心配しかできずに時間ばかりが過ぎていくのは、どうしても……。"
"10010145-12-ウイ" = "こ、今回は偶然上手く行きましたが、「万が一」と考え始めると、きりが無いですし……。"
"10010145-13-ウイ" = "ヒナタさんがまたうっかりをやらかす可能性も、十分に考えられましたし……。"
"10010145-14-ウイ" = "こ、これだから外の方は……細かく見てあげないとダメですし、すぐ変なことしますし……心配、させますし……。"
"10010145-15-ウイ" = "私の考えや気分なんて知ったことない、って感じで……ね、眠れなく、なりますし……。"
"10010145-16-ウイ" = "はぁ……すみません、また変なことを……。"
"10010145-17-ウイ" = "そ、その、お気になさらず……。"
"10010145-18-ウイ" = "何と言いますか、えっと……。"
"10010145-19-ウイ" = "……やっぱり外の方は嫌いです。"
"10010145-20" = "[s1] \"ウイは優しいね。\"\n[s2] \"ウイは責任感が強いね。\""
"10010145-21-ウイ" = "へ、変なことを言わないでください……ああ、もう……。"
"10010145-22-ウイ" = "へ、変なことを言わないでください……ああ、もう……。"
"10010145-23-ウイ" = "とにかく、その話はここまでで……。"
"10010145-24-ウイ" = "と、ところで、持ってきてくれましたか……？"
"10010145-25" = "[s3] \"はい、これ。\"\n[s4] 持ってきたものを渡す。"
"10010145-26-ウイ" = "ふ、ふふ……。"
"10010145-27-ウイ" = "ふ、ふふ……。"
"10010145-28-ウイ" = "あ、ありがとうございます……いただきます……。"
"10010145-29-ウイ" = "……このレモンスムージー、ですか？"
"10010145-30-ウイ" = "そう、ですね……。"
"10010145-31-ウイ" = "い、今さら、ですが……。"
"10010145-32-ウイ" = "私、甘いもの……ケーキとか、あんまり好きではなくって……。"
"10010145-33-ウイ" = "ほ、本も机も、汚れますし……何かを読む時は、こういう飲み物の方が合ってますし……。"
"10010145-34-ウイ" = "どれだけ寒くても、こういう飲み物が……。"
"10010145-35-ウイ" = "……。"
"10010145-36-ウイ" = "なので、すみません……あ、あの時も言いましたがケーキの件は、私のただの意地悪、みたいなもので……。"
"10010145-37-ウイ" = "……？"
"10010145-38-ウイ" = "次からは、レモンスムージーを持ってくる……？"
"10010145-39-ウイ" = "……次も来るつもり、ということですか。"
"10010145-40-ウイ" = "ふぅ……。"
"10010145-41-ウイ" = "なるほど、「先生」ですもんね……。"
"10010145-42-ウイ" = "であれば……予防線は、やめるとしましょうか。"
"10010145-43-ウイ" = "あんまり、こういうのはどうかと思うのですが……。"
"10010145-44-ウイ" = "では次は、アイスアメリカーノでお願いします……。"
"10010145-45-ウイ" = "……それが本当に、私の好きなものなので。"
"10010145-46-ウイ" = "うっ……す、酸っぱい……。"
"10010145-47-ウイ" = "さ、最初から、アイスアメリカーノでお願いしておくべき、でしたかね……。"
"10010145-48-ウイ" = "……ふぅ。"
"10010145-49-ウイ" = "先生は……そろそろ、シャーレに着いた頃でしょうか……。"
"10010145-50-ウイ" = "では……。"
"10010145-51-ウイ" = "よ、ようやく、落ち着いたことですし……。"
"10010145-52-ウイ" = "経典の完璧なコピー……こっそり作るには、しんどい作業でしたね……。"
"10010145-53-ウイ" = "……。"
"10010145-54-ウイ" = "今でもまだ、秘密にまみれたシスターフッド……。"
"10010145-55-ウイ" = "さて、その秘密……見せてもらうとしましょうか……。"
"10010145-56" = "どたばたシスターと古書館の魔術師"
