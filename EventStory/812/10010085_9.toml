[translation]
"10010085-1" = "第8話;少し似た人たち（２）"
"10010085-2-ヒナタ" = "あ、あれですね。救護騎士団の……！"
"10010085-3-ヒナタ" = "……あれ？"
"10010085-4-ヒナタ" = "そういえば先生、今さらですが……どうして救護騎士団の本館ではなく、こちらの別館に……？"
"10010085-5-ヒナタ" = "何か理由でもありましたか？"
"10010085-6-ヒナタ" = "……あ、お知り合いの方がこちらに？"
"10010085-7-ヒナタ" = "すっごく話が早い方……？"
"10010085-8" = "[s1] \"多分そろそろ来ると思う。\"\n[s2] \"気が利くっていうか……うん、そんな感じ。\""
"10010085-9-ヒナタ" = "それはどういう……？"
"10010085-10-ヒナタ" = "それはどういう……？"
"10010085-11-？？？" = "お久しぶりです、先生。お待ちしてました。"
"10010085-12-ヒナタ" = "あれ、どこから……？"
"10010085-13-ヒナタ" = "ふふっ。こうしてお会いするのもそうですし、先生の方から来ていただくのは本当に久しぶりな気がしますね。何だか嬉しいです。"
"10010085-14-セリナ" = "あ、こんにちは、ヒナタさん。お会いできて嬉しいです。"
"10010085-15-ヒナタ" = "こ、こんにちは！こちらこそです……！"
"10010085-16-ヒナタ" = "……あれ？どうして私のお名前を……？"
"10010085-17-ヒナタ" = "先ほど先生が仰っていた、救護騎士団の方ですよね？おそらくお会いしたことは無いと思うのですが……。"
"10010085-18-ヒナタ" = "……あっ、いえ、失礼しました。"
"10010085-19-ヒナタ" = "とにかく用件をお話しないとですね。あらためて一応、ヒナタです。今日はその――"
"10010085-20-セリナ" = "はい、用件は存じています。ちょうどお越しになる頃かと思ってましたし。"
"10010085-21-ヒナタ" = "……え？"
"10010085-22-セリナ" = "急いでるんですよね、こちらへどうぞ。"
"10010085-23-ヒナタ" = "えっと、先生……？"
"10010085-24-ヒナタ" = "先に連絡をしておいてくださった、ということでしょうか……？"
"10010085-25" = "[s3] \"……そう思ってもらった方が、今は話が速いかも。\"\n[s4] \"話すと長くなりそうだから、後で説明するね。\""
"10010085-26-ヒナタ" = "そ、そう思ってもらった方が……？"
"10010085-27-ヒナタ" = "え、っと……。"
"10010085-28-ヒナタ" = "……？"
"10010085-29-セリナ" = "「精聖薬」ですよね、確かに救護騎士団が普段から保有しているものです。"
"10010085-30-セリナ" = "今はあまり使われていないものなので、倉庫から出さないといけなくって。"
"10010085-31-セリナ" = "普段であれば、色々と手続きや承認が必要なのですが……。"
"10010085-32-セリナ" = "今回は時間が無いことですし、こっそり持ち出しちゃいましょう。報告書については何とかしておきますので。"
"10010085-33-セリナ" = "えっと……あ、2本ぐらいで足りますよね？ヒナタさん？"
"10010085-34-ヒナタ" = "は、はい……！"
"10010085-35-ヒナタ" = "えっと、先生……？"
"10010085-36-ヒナタ" = "本数の話も、すでに……？"
"10010085-37" = "[s5] \"そうじゃないけど、そのうち慣れると思う。\"\n[s6] \"すごく準備の良い、優しい子でね。”"
"10010085-38-ヒナタ" = "そ、そうでしたか……すごい方ですね……。"
"10010085-39-ヒナタ" = "そ、そうでしたか……すごい方ですね……。"
"10010085-40" = "確か、あっちの壁に……。"
"10010085-41-セリナ" = "……あら？"
"10010085-42-セリナ" = "すみません、何やら連絡が……。"
"10010085-43-セリナ" = "……はい、はい。あ、今すぐですか？"
"10010085-44-セリナ" = "えーっと……いえ、大丈夫だと思います。はい、承知しました。"
"10010085-45-セリナ" = "えっと、実はその……。"
"10010085-46-セリナ" = "先生、すみません……。"
"10010085-47" = "[s7] \"大丈夫、行ってきてあげて。\"\n[s8] \"ここまでありがとね、助かった。\""
"10010085-48-セリナ" = "はい、ありがとうございます。"
"10010085-49-セリナ" = "はい、ありがとうございます。"
"10010085-50-セリナ" = "ヒナタさんもすみません。最後までご一緒したかったのですが、急に患者さんが殺到したようで……。"
"10010085-51-セリナ" = "な、何かあったんですか……？"
"10010085-52-セリナ" = "ああ、いえ。今週は正義実現委員会の定期巡回がありまして。"
"10010085-53-セリナ" = "いつも通り、郊外の方まであちこちを回っているようなのですが……。"
"10010085-54-セリナ" = "その過程でまあ、色々あったようでして。"
"10010085-55-ヒナタ" = "な、なるほど……。"
"10010085-56-ヒナタ" = "それは大変そうですね、人手も不足しそうですし……。"
"10010085-57-セリナ" = "はい……ここは別館ということもあって、あまり救護騎士団のメンバーも来ていなくって。"
"10010085-58-セリナ" = "特に今のこの時間帯は、対応できるのが私だけなので……。"
"10010085-59-ヒナタ" = "えっ！？ということはお一人で、この病棟の患者さん全員を……！？"
"10010085-60-セリナ" = "はい。それで場合によっては時々、少し患者さん一人ひとりへのカバーが少々足りなくなってしまうこともあるのですが……。"
"10010085-61-セリナ" = "ですが、やむを得ないことですので。とにかく私は、私にできることをするだけです。私ひとりにやれることには、限界があるとしても。"
"10010085-62-ヒナタ" = "……！"
"10010085-63-セリナ" = "そんな状況でして、すみません。少し席を外しますね。"
"10010085-64-セリナ" = "できるだけ早く戻りますので。"
"10010085-65-ヒナタ" = "……。"
"10010085-66-ヒナタ" = "あ、あの……。"
"10010085-67-ヒナタ" = "えっと、先生、その……じ、時間がないのは分かっているんです。ですが、それでも私は……！"
"10010085-68" = "[s9] \"手伝いに行く？\"\n[s10] \"大丈夫、こっちは私が探しておくから。\""
"10010085-69-ヒナタ" = "……！"
"10010085-70-ヒナタ" = "……！"
"10010085-71-ヒナタ" = "あ、ありがとうございます！行ってきます！"
"10010085-72-セリナ" = "あ、ヒナタさん。"
"10010085-73-セリナ" = "お手伝いいただけるんですね、ありがとうございます。お忙しい中すみません……。"
"10010085-74-ヒナタ" = "えっと、私まだ何も話してませんが……いえ、お手伝いはさせていただきたいものの……。"
"10010085-75" = "（……）"
"10010085-76" = "[ns] ふたりを見届けてから、例の薬を探す。"
"10010085-77" = "（その後問題なく薬を見つけた頃、二人が帰ってきた）"
"10010085-78" = "（困ってる人を放っておけない二人は、どちらも先ほどより明るい顔で戻ってきた）"
