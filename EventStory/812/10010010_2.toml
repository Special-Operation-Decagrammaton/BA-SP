[translation]
"10010010-1" = "第1話;秘密裏に何とか……"
"10010010-2-シミコ" = "……なるほど。"
"10010010-3-シミコ" = "そういった経緯でこちらにお越しになったと。その実際の本が、こちら……"
"10010010-4-シミコ" = "いえ、最早「本だったもの」ですね……。"
"10010010-5-シミコ" = "うぅ、すみません！本当にすみません……！！"
"10010010-6-シミコ" = "い、いえその、責めているわけではなく……。"
"10010010-7-シミコ" = "ま、まずは落ち着きましょうヒナタさん……！"
"10010010-8-シミコ" = "……あと何より、図書館ではもう少し声のボリュームを小さく。"
"10010010-9-ヒナタ" = "は、はい……。"
"10010010-10-シミコ" = "ふぅ。とにかく、このままでは大変なことになりますね……"
"10010010-11-シミコ" = "トリニティとしても相当重要なものですし、万が一経典が失われたなんてことが発覚したら、どれだけの騒ぎになることか……。"
"10010010-12-シミコ" = "あれ、そういえば箱はどうしたんですか？"
"10010010-13-シミコ" = "今までの話を聞く限り、入れ物の箱があったのでは……？"
"10010010-14-シミコ" = "……え。式典会場である、聖堂の祭壇に？"
"10010010-15-シミコ" = "中身が空のまま、箱だけ置いてきたということですか？"
"10010010-16-シミコ" = "……なるほど。空っぽだと触っただけでバレるので、代わりに『カーマスートラ』を入れてきた、と。"
"10010010-17-シミコ" = "確かにそれなら、少しはごまかせますが……うーん……。"
"10010010-18-シミコ" = "……え？"
"10010010-19-シミコ" = "……今、『カーマスートラ』って言いました？ど、どうして……！？"
"10010010-20" = "[s] \"ちょうどあったっていうか……。\""
"10010010-21-シミコ" = "ちょうど持ってるような本ですかそれ！？"
"10010010-22-シミコ" = "どうして『カーマスートラ』を！？ああいえ、そちらをツッコみたかったわけではないのですが……！"
"10010010-23-シミコ" = "え、ハナコさんが持っていたもの先生が預かっていて……？"
"10010010-24" = "[s1] \"ちょっとその場でバタバタしたこともあって、アクシデントが……。\"\n[s2] \"ヒナタのせいじゃなくって、私が持ってたせいで……。\""
"10010010-25-シミコ" = "ど、どういうことなんですかそれは……。"
"10010010-26-シミコ" = "ど、どういうことなんですかそれは……。"
"10010010-27-シミコ" = "と、とにかく今すぐにでも、それ以外の他の本に入れ替えたいところですが……。"
"10010010-28-シミコ" = "何度も忍び込めば、警備にバレる可能性も上がりますし……経典さえ元通りになれば、少なくとも今はまだ「代わりに箱に何が入っていても問題無い」というのは一応事実です。"
"10010010-29-シミコ" = "この粉々になった経典を式典までに「復元」して、会場に戻す。それができなければ……"
"10010010-30-シミコ" = "サクラコさんが公衆の面前で『カーマスートラ』を読む、と……。"
"10010010-31-ヒナタ" = "さ、サクラコ様に、そんなことをさせるわけには……。"
"10010010-32-ヒナタ" = "私としても、それでトリニティが分裂するような騒動になるのは嫌ですね……信用して相談してくださったことですし、私も一肌脱ぎましょう。"
"10010010-33-ヒナタ" = "と、言いたい気持ちは本当なのですが、うーん……。"
"10010010-34-シミコ" = "すみません、私の実力ではちょっと……。"
"10010010-35-シミコ" = "私も司書として、ある程度「壊れた本の修復」などは行うのですが、あくまで普通の司書のレベルと言いますか……。"
"10010010-36-シミコ" = "ここまでの破損状態ですと、私の手に負えるとはとても……。"
"10010010-37-シミコ" = "「修復」というより「復元」ですし……私よりもちゃんとした、「専門家」にお願いしないと難しそうです。"
"10010010-38" = "[s3] \"なるほど……。\"\n[s4] \"「専門家」……？\""
"10010010-39-シミコ" = "はい。「修復」が傷口に絆創膏を貼ったり、薬を塗るようなものだとすると、「復元」は本格的な手術と言いましょうか……。"
"10010010-40-シミコ" = "はい。「修復」が傷口に絆創膏を貼ったり、薬を塗るようなものだとすると、「復元」は本格的な手術と言いましょうか……。"
"10010010-41-シミコ" = "ですので司書の私ではなく、その分野の「専門家」が必要な領域かと。"
"10010010-42-シミコ" = "それにこの本は「古書」……ある意味では「古代の遺物」とも言えるものです。"
"10010010-43-シミコ" = "破れたページを繋ぎ直そうにも、そもそもこの古文書の解読が出来なくてはなりません。"
"10010010-44-シミコ" = "こんな作業ができるのは、トリニティ……いえ、もしかしたらキヴォトス全体でもそう多くないかもしれません。"
"10010010-45-シミコ" = "つ、つまり無理ということでしょうか……！？"
"10010010-46-ヒナタ" = "ううっ！こっ、このままでは……！！"
"10010010-47-シミコ" = "あ、その、ヒナタさん。"
"10010010-48-ヒナタ" = "……？"
"10010010-49-シミコ" = "……お静かに。"
"10010010-50-ヒナタ" = "すみません……。"
"10010010-51" = "[s5] \"さすがはシミコ。\"\n[s6] \"強い……。\""
"10010010-52-シミコ" = "ふぅ……。"
"10010010-53-シミコ" = "話を戻しますと、方法が全く無いわけではありません。"
"10010010-54-シミコ" = "伝手と言いますか……ひとり、いますので。これを修復可能な方が。"
"10010010-55-シミコ" = "何と言いますかその、やや頼みにくい方ではありますが……古書をこの上なく知り尽くし、誰よりもこの種の経験を積み、そしてもう数週間も顔を見ていない方が。"
"10010010-56" = "[s7] \"……？\"\n[s8] （最後の方に、気になる言葉が）"
"10010010-57-シミコ" = "すごい方なのは確かです。「古書館の魔術師」と呼ばれるくらいですから。"
"10010010-58-シミコ" = "すごい方なのは確かです。「古書館の魔術師」と呼ばれるくらいですから。"
"10010010-59-シミコ" = "もちろん実際に魔法を使うわけではないのですが、その技量や問題解決の様から付けられた「あだ名」です。"
"10010010-60-シミコ" = "ただ、その……。"
"10010010-61-シミコ" = "うーん……。"
"10010010-62-シミコ" = "ちょっと人見知りと言いますか、他者への警戒が強いと言いますか、太陽嫌いと言いますか……。"
"10010010-63-シミコ" = "基本的に古書館に引きこもっていて、ほとんど外に出ないタイプでして……。"
"10010010-64-シミコ" = "対人関係が苦手、あるいは社会性がその……いえ、もちろん悪い方ではないのですが……。"
"10010010-65-シミコ" = "まあ、隠していても仕方ありませんね。"
"10010010-66-シミコ" = "その方は私と同じ「図書委員会」所属、そのトップ……"
"10010010-67-シミコ" = "ウイ委員長、です。"
