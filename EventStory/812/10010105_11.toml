[translation]
"10010105-1" = "第10話;終わらせないために（２）"
"10010105-2" = "（……疲れが取れたからか、自然と目が覚めた）"
"10010105-3-ウイ" = "……お、お目覚めですか、先生。"
"10010105-4-ウイ" = "お、思ったより、早かったですね……もしかして、作業の音が気になりましたか……？"
"10010105-5-ウイ" = "もう一方は……寝言を言いながら、ぐっすりですが……。"
"10010105-6" = "んんっ……くすぐったいです、ふふっ……。"
"10010105-7" = "……さ、さっきから、ずっとこんな感じです"
"10010105-8" = "いったい、どんな夢を見ているのか……さっきまで、かなり疲弊した様子だったのに……。"
"10010105-9" = "[s1] \"……ウイも、お疲れ様。ありがとう。\"\n[s2] \"作業は順調？\""
"10010105-10" = "ま、まあ、そうですね……。"
"10010105-11" = "任せてくださいと啖呵を切って、だ、ダメでしたとは言えないので……。"
"10010105-12" = "あと……だいたい一時間くらいで、完成しそうです。"
"10010105-13" = "[s3] \"すごい速さだね、あんなバラバラだったのに……。\"\n[s4] \"さすがは魔術師。\""
"10010105-14-ウイ" = "そ、そうやって褒められても、何も出ませんが……。"
"10010105-15-ウイ" = "まあ、嫌ではないものの……そもそも褒められることも、少ないので……。"
"10010105-16-ウイ" = "と、とにかく……はい、ありがとうございます……。"
"10010105-17-ウイ" = "……。"
"10010105-18-ウイ" = "こ、これは、ですね……。"
"10010105-19-ウイ" = "作業中のひとり言……そ、そんなものだと、思ってください。"
"10010105-20-ウイ" = "じ、実はケーキを取ってきて欲しいというのは……やや嫌がらせのようなもの、と言いますか。"
"10010105-21-ウイ" = "む、無茶な案件を持ち込まれたので、少しこっちも無理なことを言おうと……口から出てしまったんです。"
"10010105-22-ウイ" = "ですので正直なところ、期待はしていませんでした……。"
"10010105-23-ウイ" = "ですがヒナタさんは、そして先生はちゃんと買ってきて……トラブルも解決してて……ヒナタさんなりに正しくあろうと、ずっと頑張って……。"
"10010105-24-ウイ" = "だ、だからと言って、すぐに見方を変えるわけではありませんが……。"
"10010105-25-ウイ" = "えっと……。"
"10010105-26" = "[s5] \"それもあって、頑張ってくれてるんだ。\"\n[s6] \"……少し感じるところがあったとか？\""
"10010105-27-ウイ" = "どう、ですかね……。"
"10010105-28-ウイ" = "どう、ですかね……。"
"10010105-29-ウイ" = "な、「仲良くなった」だなんて、簡単に言うつもりもありません……ですが……。"
"10010105-30" = "以前だったら、その……ここで寝てくださいとは、絶対に言いませんでした……多分。"
"10010105-31" = "じ、自分でも、不思議です……。"
"10010105-32" = "それに、こ、こんな遅い時間に……。"
"10010105-33" = "こうして、だ、誰かと話しているなんて、その、不思議な感じで……。"
"10010105-34" = "もしかしたら……あくまで「もしかしたら」という話、ですが……。"
"10010105-35" = "その分、私も……。"
"10010105-36" = "こ、こう、向き合うと言いますか……。"
"10010105-37" = "その……。"
"10010105-38" = "ふあっ……！良く寝ました。"
"10010105-39-ウイ" = "……。"
"10010105-40-ヒナタ" = "……あ、あれ？ここは……。"
"10010105-41-ヒナタ" = "そ、そうでした。経典の復元を……。"
"10010105-42-ヒナタ" = "えっと、今の時間は……？"
"10010105-43-ヒナタ" = "あっ、寮の点呼の時間、過ぎてしまいました……。"
"10010105-44-ヒナタ" = "……点呼の、時間？"
"10010105-45-ヒナタ" = "ヒナタさん、ようやくお目覚め――"
"10010105-46-ヒナタ" = "点呼の時間！？"
"10010105-47-ウイ" = "……な、何ですか急に。"
"10010105-48" = "[ns7] \"ヒナタ……？\"\n[ns8] \"どうしたの？\""
"10010105-49-ヒナタ" = "た、たたたたた大変です先生！点呼、点呼の時間を過ぎてしまいました……！？"
"10010105-50-ヒナタ" = "た、たたたたた大変です先生！点呼、点呼の時間を過ぎてしまいました……！？"
"10010105-51-ヒナタ" = "いつの間にもう、こんな時間に……！ど、どうすれば……！？"
"10010105-52-ウイ" = "……何を騒いでいるのかと思ったら。寮の点呼くらいでそんなにうるさくしないでください。それにまだ作業中で……"
"10010105-53-ヒナタ" = "だだだ、だって！怒られちゃいます！居眠りをして点呼に遅れるだなんて、他のシスターに知られたらどんな叱責を受けることか……！"
"10010105-54-ウイ" = "し、シスターフッドは厳しいんですね……内情についてはあんまり知りませんが、イメージ通りといえばイメージ通りでしょうか。というか、静かにしてください……。"
"10010105-55-ヒナタ" = "ど、どうしましょう！？い、一体何と言えば……！？このままですと私……！"
"10010105-56-ウイ" = "静かに……"
"10010105-57-ウイ" = "し……"
"10010105-58-ヒナタ" = "ま、まずとにかく寮に連絡を……！"
"10010105-59-ウイ" = "静かにしなさい！！！！"
"10010105-60-ヒナタ" = "ひいいっ！？"
"10010105-61" = "[s9] \"あー……。\"\n[s10] \"今のは仕方ない……。\""
"10010105-62-ウイ" = "静かにしなさいって何度言えば分かるんですか！？ねぇ！？"
"10010105-63-ウイ" = "静かにしなさいって何度言えば分かるんですか！？ねぇ！？"
"10010105-64-ウイ" = "す、すみません……！？で、ですがその、えっと……！"
"10010105-65-ヒナタ" = "うぅ、ごめんなさい……。"
"10010105-66-ウイ" = "スマホはマナーモードに！！"
"10010105-67-ウイ" = "はいっ、すぐに切り替えます……！"
"10010105-68-ヒナタ" = "……？"
"10010105-69-ヒナタ" = "……え？"
"10010105-70-ウイ" = "……今度は何ですか。"
"10010105-71-ヒナタ" = "えっと……。"
"10010105-72-ヒナタ" = "え、嘘ですよね？今の、メッセージ……。"
"10010105-73-ヒナタ" = "全体連絡が……。"
"10010105-74-ウイ" = "……全体連絡？"
"10010105-75-ヒナタ" = "えっと、「お知らせです。明日に予定されていた経典の公開および朗読の式典につきまして……"
"10010105-76-ヒナタ" = "……。"
"10010105-77" = "[s11] \"ヒナタ……？\"\n[s12] \"続きは……？\""
"10010105-78-ヒナタ" = "「ご出席される方々の全会一致で、日程を早めることになりました」"
"10010105-79-ヒナタ" = "「ご出席される方々の全会一致で、日程を早めることになりました」"
"10010105-80-ヒナタ" = "「式典の開催時間は、今夜の12時とします」……"
"10010105-81-ヒナタ" = "……12時？"
"10010105-82-ウイ" = "……。"
"10010105-83-ウイ" = "今夜の12時って……"
"10010105-84-ウイ" = "あと1時間後、ですね……。"
