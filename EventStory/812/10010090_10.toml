[translation]
"10010090-1" = "第9話;終わらせないために（１）"
"10010090-2-ウイ" = "……はい、問題無いです。"
"10010090-3-ウイ" = "「[ruby=みずごけにかわ]水苔膠[/ruby]」も溶かせましたし、薬の方も十分ありますし……。"
"10010090-4-ウイ" = "け、ケーキもあることですし……準備完了ですね。は、始めましょうか……。"
"10010090-5-ウイ" = "あ、ありがとうございます……！"
"10010090-6-ヒナタ" = "えっと、この後私は何をすれば……？"
"10010090-7-ヒナタ" = "あ、掃除でもしましょうか？もしくは何かお手伝いを……。"
"10010090-8-ウイ" = "で、では……。"
"10010090-9-ヒナタ" = "では……？"
"10010090-10-ウイ" = "よ、余計なことはせず、昼寝でもしててください……。"
"10010090-11-ヒナタ" = "……え？"
"10010090-12-ウイ" = "……あぁ。"
"10010090-13-ウイ" = "ま、また言葉が……。"
"10010090-14-ウイ" = "す、すみません……その、悪い意味では無いんです。こ、言葉通り、と言いますか……。"
"10010090-15-ウイ" = "ぜ、全部が分かるわけではありません。ですが材料を見るだけで、分かることがあります。"
"10010090-16-ウイ" = "きっと、たくさんの事があったのだと……。"
"10010090-17-ウイ" = "で、ですので、寝ててください。あとは私の仕事ですから……と言いますか、相当眠そうですし……。"
"10010090-18-ウイ" = "……先生も、です。"
"10010090-19-ヒナタ" = "あ、えっと……先生……？"
"10010090-20" = "[s1] \"じゃあお言葉に甘えて、少しだけ休ませてもらおっか。\"\n[s2] 横になっても良さそうな場所を探す。"
"10010090-21-ウイ" = "そ、そこ……使っても、構いません。"
"10010090-22-ウイ" = "そ、そこ……使っても、構いません。"
"10010090-23-ウイ" = "きちんとしたベッドでは、ありませんが……寝心地は悪くないので……。"
"10010090-24-ウイ" = "……。"
"10010090-25-ウイ" = "あ、あの……本当に念のためですが……。"
"10010090-26-ウイ" = "に、匂いの話などをしたら、問答無用で、追い出しますので……！"
"10010090-27" = "[s3] \"了解。ありがとう。\"\n[s4] \"じゃあ、後はお任せするね。\""
"10010090-28-ウイ" = "……お、お疲れ様でした。"
"10010090-29-ウイ" = "……お、お疲れ様でした。"
"10010090-30-ウイ" = "ゆっくり、お休みいただければと……ここからは、私の仕事なので。"
