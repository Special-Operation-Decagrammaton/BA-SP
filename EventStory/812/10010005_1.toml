[translation]
"10010005-1" = "プロローグ;経典復活大作戦！"
"10010005-2-ヒナタ" = "あ、先生！突然のお願いになってしまい、すみません……。"
"10010005-3-ヒナタ" = "お越しいただいてありがとうございます、安心しました……！"
"10010005-4" = "[s1] \"ううん、気にしないで。\"\n[s2] \"ところで、何があったの？\""
"10010005-5-ヒナタ" = "実はですね……。"
"10010005-6-ヒナタ" = "実はですね……。"
"10010005-7-ヒナタ" = "まずは、こちらを見ていただければと。"
"10010005-8" = "[ns3] \"木の箱……？\"\n[ns4] \"と、その中に古い本？何だか古代の遺物みたいな……？\""
"10010005-9-ヒナタ" = "はい。仰る通りこれは、先日トリニティの発掘区域にて発見された「経典」です。"
"10010005-10-ヒナタ" = "はい。仰る通りこれは、先日トリニティの発掘区域にて発見された「経典」です。"
"10010005-11-ヒナタ" = "歴史的にもかなり重要な経典のようでして、これによって「新クィニセクストゥム公会議」で宣布された内容の、新たな解釈ができそうなんですとか。"
"10010005-12-ヒナタ" = "これから先、シスターたちの経典に関する学びの内容が変わるのではないか……というくらいの、大きな発見なのです。"
"10010005-13" = "[s] \"えっと……とりあえず、喜ばしいことなんだよね？\""
"10010005-14-ヒナタ" = "は、はい！すみません、私の説明が下手で……。"
"10010005-15-ヒナタ" = "シスターフッドだけでなく、トリニティ総合学園にとってもすごく良いお知らせ……と言っても過言ではありません。"
"10010005-16-ヒナタ" = "この経典が発見されて以来、学園のあちこちがまるでお祭りのような雰囲気になってるくらいでして。"
"10010005-17-ヒナタ" = "この発見を祝う式典も予定されているんです。そこではサクラコ様が、その経典の前半部分を朗読されることになってまして……。"
"10010005-18" = "サクラコ様の古代語、聞かれたことはありますか？発音がとっても綺麗で、すっごく美しいんですよ……！"
"10010005-19-ヒナタ" = "トリニティの他の生徒さんたちも招待されますので、シスターフッドとしても万全の準備をしなくてはいけません。"
"10010005-20-ヒナタ" = "こういったせっかくの機会ですので、ぜひ先生にもご出席いただけたらなと思いまして。こうしてお呼びさせていただいた次第です。"
"10010005-21-ヒナタ" = "お忙しい中ありがとうございます、先生。"
"10010005-22" = "[s] \"ううん、そういうことなら喜んで。\""
"10010005-23-ヒナタ" = "ふふっ。あ、実はその式典の会場、トリニティの離れにある古い聖堂で行うことになったんです。数百名ほど参加できるような、大きめの場所でして。"
"10010005-24-ヒナタ" = "せっかくの古い経典だから、古い聖堂の遺跡で……という感じなのでしょうか？ちょっと理由は分からないのですが……。"
"10010005-25-ヒナタ" = "ともかくこの式典で様々な準備が行われているのですが、私はこの経典を保管しておきつつ、その聖堂まで持っていく役割を頂きまして。"
"10010005-26-ヒナタ" = "……あっ。"
"10010005-27-ヒナタ" = "ずっと開けられていなかったせいでしょうか、ほこりがたくさん……。"
"10010005-28-ヒナタ" = "さっさっ、と……。"
"10010005-29-ヒナタ" = "……？"
"10010005-30-ヒナタ" = "あ、あれ……？"
"10010005-31" = "[s5] \"ものの見事に、バラバラに……。\"\n[s6] \"経典が、崩れた……。\""
"10010005-32-ヒナタ" = "きゃああぁぁぁっ！？"
"10010005-33-ヒナタ" = "えっ、ええっ！？こ、これは、どうして！？わ、私は、私は……！！？！？"
"10010005-34" = "[s7] \"ヒナタ、とりあえず落ち着こう！\"\n[s8] \"とにかく直さないと……！\""
"10010005-35-ヒナタ" = "そ、そうですね！？まだバラバラになっただけですし、どうにか直して……！"
"10010005-36-ヒナタ" = "そ、そうですね！？まだバラバラになっただけですし、どうにか直して……！"
"10010005-37-ヒナタ" = "よいしょ、よいしょっ……！"
"10010005-38-ヒナタ" = "これをこう、もう一度束ねて……っ！"
"10010005-39-ヒナタ" = "か、紙が崩れちゃいました！？ど、どうしてですか！？"
"10010005-40-ヒナタ" = "ちょっと優しく触っただけなのに、どうしてこんなボロボロと……！？"
"10010005-41-ヒナタ" = "え、あ、古い材質だから……？た、確かに……？で、ですがこれは……！"
"10010005-42-ヒナタ" = "あああっ、汗でインクが滲んで……！？"
"10010005-43-ヒナタ" = "と、とりあえずページを、バラバラにならないように……！"
"10010005-44-ヒナタ" = "ああ、何だか拾えば拾うほど崩れて……！ああ、ああっ……！？"
"10010005-45-ヒナタ" = "うえぇぇぇぇぇっ……！？"
"10010005-46-ヒナタ" = "……。"
"10010005-47" = "[ns] \"……。\""
"10010005-48-ヒナタ" = "……。"
"10010005-49-ヒナタ" = "えっ、と……。"
"10010005-50-ヒナタ" = "その、先生……。"
"10010005-51-ヒナタ" = "私、いったいどうすれば……？"
"10010005-52" = "#video;10010"
