[translation]
"10026060-1" = "第6話;調査ポイントD「忘れ去られた灯台」"
"10026060-2-ヒナタ" = "よいしょっ……"
"10026060-3-ヒナタ" = "まずは、ひとつ……。"
"10026060-4-ヒナタ" = "ふぅ……灯台の中も、思っていたより物が多いですね。"
"10026060-5-ヒナタ" = "聖徒会の方が使っていたと聞いて、もう少し整理されていると思っていたのですが……"
"10026060-6-ヒナタ" = "あれ……？"
"10026060-7-ヒナタ" = "先生、どうかされましたか？#n他のみなさんと一緒に行動していたのでは……？"
"10026060-8" = "[s1] \"ヒナタ一人じゃ大変だと思って……\"\n[s2] \"なにか力になれないかな？\""
"10026060-9-ヒナタ" = "そ、そんな……！大丈夫です。#nそこまで気を使っていただいては、申し訳ないですし……"
"10026060-10-ヒナタ" = "普段から物品の管理で慣れていますから、問題ありませんよ。"
"10026060-11-ヒナタ" = "で、ですが……先生の立場からしてみれば、危なっかしくて不安ですよね……。"
"10026060-12-ヒナタ" = "立場なんて関係なく、ですか……？"
"10026060-13-ヒナタ" = "……ふふ。"
"10026060-14-ヒナタ" = "そうですね。ここまで言ってくださっているのに、断るのも申し訳ないですし……"
"10026060-15-ヒナタ" = "お言葉に甘えて、手伝っていただいてもよろしいでしょうか？"
"10026060-16-ヒナタ" = "でも、大きい物は私にお任せくださいね。"
"10026060-17-ヒナタ" = "……それでは、お願いします。"
"10026060-18" = "（その後、ヒナタと一緒に手がかりを灯台の外へ運び出した）"
"10026060-19-ヒナタ" = "ふぅ……今ので最後でしたね。"
"10026060-20-ヒナタ" = "みなさんは、まだ内部の調査を続けるみたいなので……#n私たちはここで待っていましょうか？"
"10026060-21-ヒナタ" = "本当にお疲れ様でした、先生。改めて、感謝いたします。"
"10026060-22-ヒナタ" = "……ん？いま、何か変な音がしませんでしたか……？"
"10026060-23-ヒナタ" = "……！"
"10026060-24-ヒナタ" = "やっぱり……ここにも！"
"10026060-25-ヒナタ" = "これは……完全に包囲されてしまいましたね。#nまさか、ここまで多いとは思いませんでした。"
"10026060-26-ヒナタ" = "……え？"
"10026060-27-ヒナタ" = "他の方々も呼んだ方が良さそう、ですか……？"
"10026060-28-ヒナタ" = "うーん……それは……"
"10026060-29" = "[ns3] \"……ヒナタ？\"\n[ns4] \"どうかしたの？\""
"10026060-30-ヒナタ" = "あ、えっと……その、何名いらっしゃるのか確認してました。"
"10026060-31-ヒナタ" = "ウイさんたちには、なるべく調査に集中してほしくて……"
"10026060-32-ヒナタ" = "なので……私だけでなんとかならないかな……と。"
"10026060-33" = "[ns] \"…………？？？\""
"10026060-34" = "[ns5] \"えっ、1人で戦うってこと？\"\n[ns6] \"少なくとも数十人は居るよね……！？\""
"10026060-35-ヒナタ" = "そ、そうですが……"
"10026060-36-ヒナタ" = "聖堂では、色々ありますし……この程度の戦闘なら、日常的に……"
"10026060-37-ヒナタ" = "あれ、何かおかしかったでしょうか……？"
"10026060-38-ヒナタ" = "こ、これくらいの戦闘、よくありますよね！？"
"10026060-39-ヒナタ" = "……き、来ます！"
"10026060-40-ヒナタ" = "ここは私が食い止めます！先生、よろしければ……"
"10026060-41" = "[s7] \"分かった、準備はいい？\"\n[s8] \"任せて、指揮は私が執るから。\""
"10026060-42-ヒナタ" = "……はい！"
"10026060-43-ヒナタ" = "ありがとうございます、先生！！"
