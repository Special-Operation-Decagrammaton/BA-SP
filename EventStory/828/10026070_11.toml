[translation]
"10026070-1" = "第7話;レモンである理由"
"10026070-2" = "（地図に記された場所を全て調査し、再び海辺に戻ってきた）"
"10026070-3-ウイ" = "んん……"
"10026070-4-ウイ" = "…………あれ？"
"10026070-5" = "[s1] \"ウイ？\"\n[s2] \"何か引っかかることでもあった？\""
"10026070-6-ウイ" = "あ、えっと……地図を見ながら、調査内容を振り返ってました。"
"10026070-7-ウイ" = "そしたら、何か違和感がありまして。"
"10026070-8-ウイ" = "……ひとつずつ、説明します。"
"10026070-9-ウイ" = "まず、ここ……おそらく訓練場として使われていた、迷路のような遺跡。"
"10026070-10-ウイ" = "次に調査したのは、ここの地下拠点ですね。"
"10026070-11-ウイ" = "そして、残るはレモン農園と灯台。#nおかしいところはありませんでした……レモン農園を除いて。"
"10026070-12-ウイ" = "作りは古かったですが、間違いなくトリニティ様式でしたし……"
"10026070-13-コハル" = "ね、ねぇ……ハナコ……？"
"10026070-14-コハル" = "あの人……ここに着いた時と雰囲気がちょっと違うような……？"
"10026070-15-ハナコ" = "……そうですね。"
"10026070-16-ヒナタ" = "ウイさん、夢中になると……まるで普段とは別人です。"
"10026070-17-ハナコ" = "ふふっ、あれが本来のウイさんなのかもしれませんね。"
"10026070-18-ウイ" = "調査する前は、拷問の悲鳴が世間に知られないよう、人目[ruby=はばか]を憚っ[/ruby]て聖徒会が用意した牢獄や処刑場かと思っていましたが……"
"10026070-19-ウイ" = "残念ながら、私の予想は外れてしまったようです。"
"10026070-20-ヒナタ" = "……は、ははっ、はは……。"
"10026070-21-ウイ" = "……あ。す、すみません……。"
"10026070-22-ウイ" = "怖がらせたかったわけではなくて、余計な心配だったな、と。"
"10026070-23-ウイ" = "ですが、これでは拍子抜けのような……？"
"10026070-24-ウイ" = "そう思ったら、その……"
"10026070-25" = "[s3] \"まだどこか、腑に落ちないんだね。\"\n[s4] \"じゃあ、もう少し調査してみようか。\""
"10026070-26-ウイ" = "まあ、調べても何も出ないかもしれません。#nむしろ、その可能性の方が高いですが……"
"10026070-27-ウイ" = "「もしも」の可能性を探ってこそ、発見できる事もあるので。#n調べると決めた以上、最後まで諦めるわけにはいかないです。"
"10026070-28-ウイ" = "「これで十分」と簡単に線引きしてしまうようでは、研究者としては何も成し遂げられませんから。"
"10026070-29-ウイ" = "そこに何も見つからなかったとしても、必ず何かあるはず、と視点を変えてみるのが大切です。諦めない気持ちを忘れてはいけません。"
"10026070-30-ウイ" = "……今度は、視点を変えてみましょうか。#n「この場所の役割」から、"
"10026070-31-ウイ" = "「閉鎖された理由」に。"
"10026070-32-ハナコ" = "そうですね。伝統を重んじ記録を怠らない彼女たちが、何故この島を捨て、記録からも消し去ったのか。"
"10026070-33-ハナコ" = "まだ私たちの知らない情報があるのかもしれません。"
"10026070-34-ウイ" = "同じことを、考えました。聖徒会らしくないな、と……"
"10026070-35-ウイ" = "ですが、その理由とは……？"
"10026070-36-ウイ" = "訓練場、地下拠点、灯台……ここまでは、良いでしょう。"
"10026070-37-ウイ" = "……ただ、どうしてこの島にはレモンが？"
"10026070-38-ウイ" = "……もしかして。"
"10026070-39-ヒナタ" = "ウイさん……？"
"10026070-40-ウイ" = "……この地図を見てください。#nレモン農園だけ、位置が浮いていませんか？"
"10026070-41-ハナコ" = "他にも収穫しやすい場所はあったはずなのに、不自然ですね。"
"10026070-42-ハナコ" = "島内では、ここでしかレモンの木を見ませんでしたし、おそらく外部から持ち込まれたものでしょう。"
"10026070-43-ウイ" = "島で長期滞在するにしても、主食にはなり得ないレモンを……#nきっと、それだけの理由があったはず。"
"10026070-44-ハナコ" = "……レモン……レモン……。"
"10026070-45" = "[ns5] \"ウイ……？\"\n[ns6] \"き、急にバーナーを取り出してどうしたの？\""
"10026070-46-ウイ" = "うーん……やっぱり、アレしか考えられませんね。"
"10026070-47-ウイ" = "これで、よし……。"
"10026070-48" = "[ns7] \"う、ウイ！？\"\n[ns8] \"火傷はない……！？\""
"10026070-49-ハナコ" = "あら……大胆ですね♡"
"10026070-50-ハナコ" = "大人しそうな方ほど、実は……"
"10026070-51-コハル" = "それ以上はダメっ！"
"10026070-52-ヒナタ" = "う、ウイさん！？な、何をしているんですか！？#n貴重な地図が……！"
"10026070-53-ウイ" = "……私の見立ては正しかったようですね。レモン汁で書かれた部分は、酸の影響で水分の保持能力が低くなるので、[ruby=あぶ]炙[/ruby]ると先に焦げて浮かび上がります。"
"10026070-54-ウイ" = "これが、本当の目的地でしょう。"
"10026070-55-ヒナタ" = "……！？え、あれ？これは……？#nさっきまで無かった目印が、二つも……！"
"10026070-56-ウイ" = "特定の人にだけ、情報を伝えるために使われていました。#n「炙り出し」と呼ばれています。"
"10026070-57-ヒナタ" = "今となっては、多くの方が知っているので、あまり使われませんが……#n古い地図なので……コレだ、と思いまして。"
"10026070-58-ハナコ" = "効果を知らなければ、地図を火で炙ろうとは思わないでしょう。#nそれに……知っていたとしても、実際に試す人は少ないはずです。"
"10026070-59-ウイ" = "まったく、嬉しくない仕掛けを施したものですね。#nこの子の気持ちを考えなかったのでしょうか。"
"10026070-60-ウイ" = "……いや、もしかしたら、聖徒会はそこまで考えて……。"
"10026070-61-ウイ" = "とにかく、次の目的地が決まりましたね。#nこの浮かび上がった二か所が――"
"10026070-62-ウイ" = "――隠された、秘密の場所なのでしょう。"
"10026070-63-ウイ" = "では、行きますか。"
"10026070-64-ヒナタ" = "う、ウイさん！本当にすごいです、ウイさん！！"
"10026070-65-ヒナタ" = "私には想像もできませんでした！"
"10026070-66-ヒナタ" = "まだまだお手伝いしますから！張り切っていきましょう、ウイさん！！"
"10026070-67-ウイ" = "んあっ……！2m！！2m……！！"
"10026070-68-ハナコ" = "ふふっ♪"
"10026070-69-ハナコ" = "では、私たちも付いていきましょう。"
