[translation]
"10026065-1-ヒナタ" = "ふぅ……"
"10026065-2-ヒナタ" = "意外と大変ではありませんでしたね！これで、みなさんの邪魔をせずに……"
"10026065-3-ヒナタ" = "先生、顔色が優れませんが……"
"10026065-4-ヒナタ" = "も、もしかしてお怪我を！？#n全て防いだはずなのに……そんな！"
"10026065-5-ヒナタ" = "……あ、怪我ではないんですね？ほっ……安心しました……。"
"10026065-6-ヒナタ" = "先生が怪我をされてたら、みなさんに顔向けできないところでした。"
"10026065-7-ヒナタ" = "あれ、この足音は……？"
"10026065-8-？？？" = "な、何事ですか！？爆発音が聞こえてきたんですけど……！"
"10026065-9-ヒナタ" = "せ、先生……！それにヒナタさんも……！"
"10026065-10-ハナコ" = "お2人とも無事のようですね。やっぱり、先ほどの音は……"
"10026065-11-ヒナタ" = "えっと……お、音ですか？"
"10026065-12-ヒナタ" = "そ、その……これはですね！えーっと……！"
"10026065-13-ヒナタ" = "……はっ。"
"10026065-14-ヒナタ" = "な、何もありませんでしたよ！#n皆さん、どうされました？"
"10026065-15-ヒナタ" = "調査をされていたはずですよね……？#nこうしている場合では……"
"10026065-16-ウイ" = "……どういうことでしょう？#n中にいても、何十発と聞こえてきましたが……"
"10026065-17-ウイ" = "私には話せない、ということですか……？"
"10026065-18" = "[s1] \"本当に何でもないよ！\"\n[s2] \"ウイたちは、気にせずに調査を続けてね！\""
"10026065-19-ウイ" = "……？それはどういう……"
"10026065-20-ハナコ" = "……ふふっ、なるほど。"
"10026065-21-ハナコ" = "私たちの思い過ごしのようですね。#nさあ、戻って続きに取り掛かるとしましょうか？"
"10026065-22-ウイ" = "……？？？？？？？？"
"10026065-23-ウイ" = "ハナコさんまで、急にどうしたんですか？#nもしかして、何か企んでいるのでは……。"
"10026065-24-ハナコ" = "まあまあ、先生も何でもないと仰っているじゃないですか♪#nもし何かあれば、連絡してきますよ。さあ、戻って調査を続けましょう。"
"10026065-25-ハナコ" = "いえ、あの……その前に、本当に何もなかったのか確認してからでも――"
"10026065-26-ハナコ" = "コ・ゼ・キ・先・輩？"
"10026065-27-ウイ" = "ひ、ひぃっ……！？"
"10026065-28-ウイ" = "わ、分かりましたよ、もう！#n戻ればいいんでしょう？"
"10026065-29-ウイ" = "そ、それでは戻りますが……何かあれば、いつでも連絡を……。"
"10026065-30-コハル" = "……ふふっ♡"
"10026065-31" = "[s] \"ありがとう、ハナコ。\""
"10026065-32-ハナコ" = "あら、何のことでしょう？"
"10026065-33-ハナコ" = "それでは私たちも戻りましょうか、コハルちゃん？"
"10026065-34-コハル" = "え、えっ……？あ、う……うん……。"
"10026065-35" = "[ns3] \"誤魔化すには大きすぎたね。\"\n[ns4] \"後でハナコにお礼を言わないと。\""
"10026065-36-ヒナタ" = "あ、あはは……そうですね。#nウイさんにも、トリニティに戻ったら謝ろうと思います。"
"10026065-37-ヒナタ" = "……これで、良かったのでしょうか？"
"10026065-38-ヒナタ" = "その……悪気がないとはいえ、隠し事をしてしまったのには変わりありませんし……"
"10026065-39-ヒナタ" = "シスターとして、許されぬことを……"
"10026065-40" = "[s5] \"大丈夫、私も共犯だから。\"\n[s6] \"秘密ができちゃったね。\""
"10026065-41-ヒナタ" = "……ふふ。ありがとうございます、先生。"
"10026065-42-ヒナタ" = "そう言っていただいて、心が軽くなりました。"
"10026065-43-ヒナタ" = "では、お言葉に甘えて……"
"10026065-44-ヒナタ" = "私たちだけの秘密ですね。"
"10026065-45" = "（その後、ヒナタと荷物番をしながら少し休憩をとった）"
