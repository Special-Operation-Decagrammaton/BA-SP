[translation]
"10026090-1" = "第9話;島に眠る秘密"
"10026090-2-コハル" = "はあ、はあ……はぁ……"
"10026090-3-コハル" = "はあ……息が、苦し……ほんとに……疲れたぁっ……"
"10026090-4-ヒナタ" = "ここまで来れば……もう、大丈夫そうですね。"
"10026090-5-ハナコ" = "ウイさんも、怪我はありませんか？"
"10026090-6-ウイ" = "は、はい……はあ……はぁ……いったい、どうして……"
"10026090-7" = "[s1] \"全員無事だね？\"\n[s2] \"はぐれずに済んで良かったよ。\""
"10026090-8-ウイ" = "はあ、はあ……はぁ……どうして、私が……こんなに走り回らなくては……"
"10026090-9-ウイ" = "「こんなもの」のために、なぜ苦労を……"
"10026090-10-ウイ" = "はあ……はぁ……"
"10026090-11-ウイ" = "はい……？"
"10026090-12-ウイ" = "……ああ。「こんなもの」が何か気になる、と？#nどう説明しましょう……。"
"10026090-13-ウイ" = "ウイさん、私たちが滝の中で見た……"
"10026090-14-ウイ" = "あっ、はい。ですが、その前に……"
"10026090-15-ウイ" = "じ、実はですね。この地図に記された場所は……"
"10026090-16-ウイ" = "新しく浮かび上がってきたポイントも合わせて、総合的に判断すると……"
"10026090-17-ウイ" = "な、何の音ですか！？も、もしかして、またミメシスが……？"
"10026090-18-ヒナタ" = "い、いえ……ただ地面が抜けて[ruby=つまづ]、躓い[/ruby]ただけです……すみません。"
"10026090-19" = "[s3] \"ヒナタ……！\"\n[s4] \"大丈夫！？怪我は？\""
"10026090-20-ヒナタ" = "は、はい……大丈夫です。なんともありません。#nいきなりでしたので、少し驚きはしましたけど……"
"10026090-21-ヒナタ" = "それにしても、なぜこんな所に穴が……？"
"10026090-22-ヒナタ" = "……あれ？何か足元に……。"
"10026090-23-ヒナタ" = "……これは……何の箱でしょう？"
"10026090-24-ハナコ" = "見るからに古そうですね。もしかして……"
"10026090-25-ハナコ" = "この穴は、箱を埋めておくために掘られた、なんて。"
"10026090-26-ウイ" = "……！"
"10026090-27-ヒナタ" = "それでは、この中に――"
"10026090-28-ヒナタ" = "――ちょ、ちょっと待ってください。ヒナタさん！"
"10026090-29-ウイ" = "今までの流れから考えて……それに触れては……！"
"10026090-30-ヒナタ" = "……はい？何か言いましたか……？"
"10026090-31" = "[ns] \"……こうなるよね。\""
"10026090-32-コハル" = "あはは……ずっと同じパターンでしたから。"
"10026090-33-ハナコ" = "でも、今までとは少し違いますね……？"
"10026090-34-コハル" = "な、なんでこんなに多いの……！？"
"10026090-35-コハル" = "それにアレ、初めて見るんだけど……！#n本当に大丈夫！？"
"10026090-36-ハナコ" = "ふふっ。どうやら、この箱はかなり重要みたいですね。#nいよいよ正解にたどり着いたのでしょうか？"
"10026090-37-コハル" = "笑ってる場合なの！？"
"10026090-38-ハナコ" = "箱の中身は、彼女たちと戦ってからのお楽しみですね、先生。"
"10026090-39-ハナコ" = "……それでは、お願いします♡"
