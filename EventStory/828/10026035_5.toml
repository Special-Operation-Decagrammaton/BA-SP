[translation]
"10026035-1-コハル" = "はあ、はあ……はあ……。"
"10026035-2-コハル" = "もう、何なのよ、あいつら……！#nなんでここに居るの！？"
"10026035-3-コハル" = "それに……どうしてあんな格好を……！？"
"10026035-4-コハル" = "うぅっ……ビックリして腰が抜けちゃった……"
"10026035-5" = "[s1] \"コハル、大丈夫？\"\n[s2] \"どこも怪我してない？\""
"10026035-6-コハル" = "う、うん……とりあえず、何とか……"
"10026035-7-コハル" = "ひいいぃっ！！む、無理！やっぱり無理っ！"
"10026035-8" = "[s3] \"それじゃ……はい。\"\n[s4] \"しっかり掴まっててね。\""
"10026035-9-コハル" = "……せ、先生！？"
"10026035-10-ウイ" = "……結局、不審な点は見つかりませんでしたね。#nこの場所は、何に使われていたのでしょう……？"
"10026035-11-ウイ" = "……ところで、遅いですね……あの二人。#nひょっとして、道に迷ったとか……"
"10026035-12-ハナコ" = "かなりの広さでしたからね。"
"10026035-13-ヒナタ" = "そんな……私が探しに行ってみましょうか？"
"10026035-14-ウイ" = "いえ、それはやめておきましょう。闇雲に探しては、ミイラ取りがミイラになるようなものです。探しに行くとしても、何か事前に対策を……"
"10026035-15-ハナコ" = "……あ、来ましたよ。"
"10026035-16" = "[ns5] \"やっと戻ってこられた……。\"\n[ns6] \"本当にビックリしたね。\""
"10026035-17-ハナコ" = "良かったです、先生。無事に戻ってきてくださって、一安心です。"
"10026035-18-ハナコ" = "ちょうど、お二人を探しにいこうかと話し合っていたところでした。"
"10026035-19-ハナコ" = "え？私たちは、特に何もありませんでしたが……"
"10026035-20-ハナコ" = "……それは本当ですか？"
"10026035-21-ハナコ" = "水着を着た[ruby=ミメシス]複製[/ruby]が……？"
"10026035-22-ヒナタ" = "み、ミメシスですか！？"
"10026035-23-ハナコ" = "あら、なるほど……"
"10026035-24-ハナコ" = "たしかに、あり得ない話ではありませんね。ここは聖徒会の遺跡ですし。"
"10026035-25-ウイ" = "ど、どうして誰も、水着にはツッコまないんですか……？"
"10026035-26-ハナコ" = "ふふっ……水着かどうかなんて、些細な問題ですから。"
"10026035-27-ハナコ" = "……ところで。"
"10026035-28-ハナコ" = "私も予想外のことがあったのですが……♡"
"10026035-29" = "[s7] \"……予想外？\"\n[s8] \"ハナコたちも何か見つけたの？\""
"10026035-30-ハナコ" = "先生……"
"10026035-31-ハナコ" = "まずは、おんぶしている人を降ろしてからお話をしましょう。"
"10026035-32" = "[s] \"…………？\""
"10026035-33" = "[ns] \"…………。\""
"10026035-34-ハナコ" = "……コハルちゃん♡"
"10026035-35-ハナコ" = "私たちが居ない間に、お二人ともそれはそれは熱い時間を過ごしてきたんですね♡"
"10026035-36-コハル" = "ほ、本当にすごかったんだから！ハナコも絶対、驚くわよ！"
"10026035-37-コハル" = "……って、ん？"
"10026035-38-コハル" = "な、なに言ってんの！？"
"10026035-39-ハナコ" = "何か間違っていましたか？"
"10026035-40-ハナコ" = "先生の背中に、そんな風にぎゅうっと抱きついて……♡"
"10026035-41" = "……？"
"10026035-42" = "えっと……その、これは……"
"10026035-43" = "い、いや！いやいやいやいやいやいや！！！違うから、信じて！！！#n本当に違うって、そうじゃないの！"
"10026035-44" = "こっ、これは、ただ腰が抜けちゃって……！"
"10026035-45-ハナコ" = "……あら♡"
"10026035-46" = "違うってば！違うの！！違うから！！！#nそういうんじゃないから！！！"
"10026035-47-コハル" = "本当に違うんだってばっ！！！！！"
