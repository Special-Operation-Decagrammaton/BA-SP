[translation]
"10026010-1" = "第1話;通りすがりの一般人A"
"10026010-2" = "＜これまでのお話＞"
"10026010-3-ヒナタ" = "これは、先日トリニティの発掘区域にて発見された「経典」です。"
"10026010-4-ヒナタ" = "私はこの経典を保管しておきつつ……"
"10026010-5-ヒナタ" = "……あっ。"
"10026010-6-ウイ" = "本の復元、でしたっけ……何か貴重な本でも……？"
"10026010-7-ウイ" = "なああああぁぁぁぁぁぁぁぁぁぁっ！！？！？"
"10026010-8-ウイ" = "「水苔膠」、そして「精聖薬」が必要です。"
"10026010-9-ウイ" = "と、とにかくそれを、持ってきていただけたら……その材料を溶かして、何とか復元させます。"
"10026010-10-ウイ" = "……か、完成しました。経典の復元、完了です。"
"10026010-11-ウイ" = "これは……先生にお渡しします。あとで伝えてあげてください……"
"10026010-12-ウイ" = "先生は……そろそろ、シャーレに着いた頃でしょうか……。"
"10026010-13-ウイ" = "では……。"
"10026010-14-ウイ" = "経典の完璧なコピー……こっそり作るには、しんどい作業でしたね……。"
"10026010-15-ウイ" = "秘密にまみれたシスターフッド……前から気になっていました。"
"10026010-16-ウイ" = "さて、その秘密……見せてもらうとしましょうか……。"
"10026010-17" = "＜現在＞"
"10026010-18-サクラコ" = "この度は、ウイさんもご存知の「例の件」について「お話」をさせていただきたく……"
"10026010-19-ウイ" = "「お話」……？"
"10026010-20-ウイ" = "人をこんなところに「拉致」しておいて……よくもそんな事が言えたものです……"
"10026010-21-サクラコ" = "拉致……？#n何か誤解されているようですが……"
"10026010-22-サクラコ" = "拉致だなんて……先ほども申し上げましたが、私たちはただ、お話をしたいだけなのです。"
"10026010-23-サクラコ" = "あっ、あんな風に囲まれたら、断りようが無いじゃないですか。"
"10026010-24-ウイ" = "それも……「[ruby=シスターフッド]謎に包まれた秘密主義集団[/ruby]」からの要請だなんて。"
"10026010-25-ウイ" = "ええ……もちろん分かっておりますとも。#n私たちが世間からどのように思われているのかなど。"
"10026010-26-サクラコ" = "ですが、生徒を騙したり、陰謀を企てたりしているわけではありませんので……"
"10026010-27-サクラコ" = "私たちとしても、その認識は不本意と申しますか……"
"10026010-28-サクラコ" = "噂が独り歩きすることで、皆様との間に距離ができてしまいますし。"
"10026010-29-サクラコ" = "誰だって秘密の1つや2つ抱えているもの――#nですので、全く謂れのない疑いなのです。"
"10026010-30-ウイ" = "――っ。あ、怪しい人たちに限って……"
"10026010-31-ウイ" = "……いつも、似たようなこと、を……"
"10026010-32-ウイ" = "そ、それで、どうして私をこんなところに？"
"10026010-33-ウイ" = "い、一体、何をする気、なのですか……？"
"10026010-34-ウイ" = "と、取り囲んで威圧すれば、簡単に屈すると思ったんですか！？"
"10026010-35-サクラコ" = "ですから、先ほどから、何度も申し上げている通り――"
"10026010-36-サクラコ" = "――可能であれば、「お願い」を聞いていただければと。"
"10026010-37-サクラコ" = "……先日、ウイさんが「公議会の経典」の複写を作った事を確認しました。"
"10026010-38-ウイ" = "……！！！！！！"
"10026010-39-ウイ" = "な、なぜ今になって……！"
"10026010-40-ウイ" = "数日前にシスターフッドの方が古書館の周辺をうろついてたのは……まさか……"
"10026010-41-サクラコ" = "――お話は、まだ途中です。"
"10026010-42-サクラコ" = "もちろん、経典自体は歴史的資料の一つですので、中身は誰にでも閲覧する権利があります。ですが、無断で複写、というのは……せめてご相談いただきたかったのですが……"
"10026010-43-ウイ" = "ううぅ……シスターフッドに知られた以上、言い逃れは……"
"10026010-44-ウイ" = "……はっ！？"
"10026010-45-ウイ" = "ひ、ヒナタさんはどうしているんですか！？#nこの件、彼女も――"
"10026010-46-サクラコ" = "……はい？"
"10026010-47-サクラコ" = "シラを切るつもりですね……！#n彼女もこの件の関係者なのにここにいないという事は……"
"10026010-48-サクラコ" = "け、消されてしまう……私の事も、彼女みたいに闇に葬ろうとしてるのですよね！？"
"10026010-49-ウイ" = "ヒナタさん……ごめんなさい……私が余計なことをしたから……ヒナタさんを巻き込んでしまった……"
"10026010-50-サクラコ" = "……はい？"
"10026010-51-ウイ" = "ごめんなさい、ヒナタさん……私のせいです……"
"10026010-52-サクラコ" = "ちょっと待ってください。少し落ち着いて聞いていただきたいのですが……#nその、どうして急にヒナタさんが？"
"10026010-53-ウイ" = "ああ……次は私の番。拷問を受けて、誰も知らない場所に島流しに……"
"10026010-54-サクラコ" = "あの、ウイさん……私の話を……"
"10026010-55-ウイ" = "ですが、私が消えたとしても――"
"10026010-56-ウイ" = "――真実は変わりません！！"
"10026010-57-サクラコ" = "一体なにを仰っているのですか！？#n私たちは、ウイさんにお願いがあって……！"
"10026010-58-サクラコ" = "本当に、何かを企んでいるわけではありませんので……そういう目で見るのはおやめください……！"
"10026010-59-？？？" = "うふふっ……"
"10026010-60-？？？" = "まったく……見ていて飽きませんね♡"
"10026010-61-？？？" = "……サクラコさんも、ウイさんも。"
"10026010-62-サクラコ" = "……！？"
"10026010-63-サクラコ" = "ど、どなたですか……！？"
"10026010-64-サクラコ" = "ここは秘匿された場所だというのに……！"
"10026010-65-ハナコ" = "ふふっ、通りすがりの通行人Aです♡"
"10026010-66-ウイ" = "ひ、ひぃっ……！？あなたは……！！"
"10026010-67-ウイ" = "深夜の水着女……[ruby=うらわ]浦和[/ruby]ハナコ！？#nというか、どうして水着を……！？"
"10026010-68-サクラコ" = "どうやってここまで……？#n外には見張りがいたはず……"
"10026010-69-ハナコ" = "うふふ♡あら、こんなところに秘密の通路が……"
"10026010-70-ウイ" = "ふ、2人とも知り合いだったんですか！？#nや、やっぱり裏で繋がっていたんですね！？"
"10026010-71-ウイ" = "あんな恐ろしい人との繋がりまであったなんて……#nやっぱりシスターフッドは怪しいところだったんですね！！"
"10026010-72-サクラコ" = "誤解なんです、ウイさん！本当に信じてください！#nハナコさんがここに来るなんて……想定外で……！"
"10026010-73-ウイ" = "この状況でその言葉を信じろって言うんですか！？#n無理があるとは思わないんですか！？"
"10026010-74-サクラコ" = "お、仰る通りなんですが！#n私がウイさんの立場なら、間違いなくそう思ってしまうでしょうし……！"
"10026010-75-ウイ" = "ヒナタさんと話をさせてください！#nわ、私は秘密主義集団になんて屈しません！"
"10026010-76-サクラコ" = "ですから、どうしてヒナタが出てくるのですか！？私の言うことは、何ひとつ信じてくださらないのですか！？"
"10026010-77-ヒナタ" = "えっと、その……"
"10026010-78-サクラコ" = "ヒナタさん……！？"
"10026010-79-ヒナタ" = "ご、ごめんなさい……遅れてしまいまして……。"
"10026010-80-サクラコ" = "ヒナタさん、どうしてここに……！？"
"10026010-81-ハナコ" = "うふふっ♡ちょっと落ち着いてお話、しませんか？"
"10026010-82-ハナコ" = "私も、通りすがりの一般人Aとしてちょっと気になるところがありまして♡"
"10026010-83-ハナコ" = "い、一般人A……！？#n夜中に水着で徘徊するような人が……！？"
"10026010-84-ハナコ" = "まあまあ、細かいことは気にしないでくださいな。――たしかに、ウイさんが無断で経典を複写した事を過ちというのならばそうでしょう。"
"10026010-85-ウイ" = "うっ……！！"
"10026010-86-ハナコ" = "ですが、サクラコさんが仰っていたように、経典は誰にでも閲覧する権利があるもの。それなのにこのように詰め寄っては、陰謀論をウイさんが信じてしまうのも致し方ないのでは？"
"10026010-87-ウイ" = "それ以前に、シスターフッドが一生徒に圧力をかけるだなんて……あんまり穏やかではありませんね。"
"10026010-88-ハナコ" = "サクラコさんの言葉遣いは誤解を招きやすいですし……#nこのようなやり方を続けていては、シスターフッドの秘密主義という汚名はいつまでも濯げませんよ？"
"10026010-89-ハナコ" = "事実、ウイさんはこの通り怖がっていますし……ヒナタさんが私の元に相談に来るくらいですから。"
"10026010-90-サクラコ" = "この場で誰よりも胡散臭いのは、ハナコさんなのでは……"
"10026010-91-サクラコ" = "そ、それに、私はウイさんを怖がらせるつもりなど……！"
"10026010-92-サクラコ" = "その……あまり他人に聞かれたくないお話だったので、人目を避けただけで……"
"10026010-93-ハナコ" = "ふふ。まさに、そういう秘密主義がシスターフッドの問題だと言っているんです。"
"10026010-94-ハナコ" = "ということで、通りすがりの一般人Aからの提案です♪"
"10026010-95-ハナコ" = "ウイさんは、ヒナタさんが困っていた時に手を差し伸べてくれましたね。#nそして、深夜に訪れた私のことも、決して突き放さずに助けてくれました。"
"10026010-96-ハナコ" = "サクラコさんがみなさんの前であられもない言葉を読み上げてしまう未来を回避する事にも貢献しています。"
"10026010-97-サクラコ" = "……はい？そ、そのようなことが、あったのですか……？"
"10026010-98-ヒナタ" = "ご、ごめんなさい……私が悪いんです……。"
"10026010-99-ハナコ" = "つまり、この場にいる私たちは全員、何らかの形でウイさんのお世話になっているのです。"
"10026010-100-ハナコ" = "ですから今回は、ウイさんに「チャンス」を与えてはいかがでしょう？"
"10026010-101-サクラコ" = "……チャンス、とは？"
"10026010-102-ハナコ" = "ウイさんにはシスターフッドの仕事を手伝っていただく代わりに、この件を見逃してください。"
"10026010-103-ハナコ" = "いかがですか？そう悪い話ではないと思いますよ。サクラコさんだって、何も図書委員会と真っ向から揉めたいわけではありませんよね？"
"10026010-104-ウイ" = "……た、助ける？わ、私が……シスターフッドを？"
"10026010-105-サクラコ" = "い、いえ。そんなつもりでウイさんをお呼びしたわけでは……"
"10026010-106-ハナコ" = "ふふ♡ですが、サクラコさん……色々と溜まってますよね？#n先送りにしていたシスターフッドの問題が、それはもう……いっぱい♡"
"10026010-107-ハナコ" = "たとえば、例の「遺跡」とか……"
"10026010-108-ウイ" = "遺跡……？"
"10026010-109-ヒナタ" = "そんなものが……？"
"10026010-110-サクラコ" = "ど、どうしてそれを……？"
"10026010-111-ハナコ" = "ふふっ♡それでは、取引成立ですね。"
"10026010-112-ハナコ" = "私たちで遺跡の問題を解決する代わりに、サクラコさんはウイさんの件を見逃す、ということで♪"
"10026010-113-ハナコ" = "ここからは……"
"10026010-114-ハナコ" = "……私に全てお任せください♡"
"10026010-115-ハナコ" = "みなさん揃いましたよ～！先生、お願いします～！"
"10026010-116" = "[ns] カメラのスイッチを押す。"
"10026010-117-ウイ" = "……？？？？？"
