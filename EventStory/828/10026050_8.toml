[translation]
"10026050-1" = "第5話;調査ポイントC「レモン農園」"
"10026050-2" = "（地図に記された次の場所は、レモンの木が生い茂っていた）"
"10026050-3" = "（もう長いこと、手入れされた気配はない）"
"10026050-4" = "[ns1] \"もしかして、迷子になっちゃったかな……？\"\n[ns2] \"誰か近くに居ると助かるんだけど……。\""
"10026050-5-？？？" = "あら、先生。こちらにいらっしゃったのですか？"
"10026050-6" = "[ns] \"会えて良かった。実は迷っちゃって……。\""
"10026050-7-ハナコ" = "先生もでしたか。#nたしかに、ここは木があまりにも多いですし……"
"10026050-8-ハナコ" = "これはもう、農園ではなく森と言った方が良いような。"
"10026050-9-ハナコ" = "ふふっ……。"
"10026050-10-ハナコ" = "……はい？"
"10026050-11-ハナコ" = "……どうして「農園」と呼ばれていると知っていたのか、ですか……？"
"10026050-12-ハナコ" = "それは……。"
"10026050-13-ハナコ" = "……そう、ですね。"
"10026050-14-ハナコ" = "どう説明したものでしょう？"
"10026050-15-ハナコ" = "……私の直感、ですかね。"
"10026050-16-ハナコ" = "その顔は信じていませんね……？#nですが私もまだ判断に迷っているのです。"
"10026050-17-ハナコ" = "初めから先生は、何か裏があると気づいていたように思います。"
"10026050-18-ハナコ" = "色々と聞きたいことがありますよね？#nなぜ、こんな島に……それも、わざわざコハルちゃんを連れて。"
"10026050-19-ハナコ" = "どうして、何もお聞きにならなかったんですか？"
"10026050-20" = "[s3] \"たしかに、気にはなるけど……\"\n[s4] \"ハナコのこと、信じてるから。\""
"10026050-21-ハナコ" = "あらら……。"
"10026050-22-ハナコ" = "うふふ♡予想外の反応が返ってきましたね。"
"10026050-23-ハナコ" = "私、思っていたよりも先生に信頼されているのでしょうか？"
"10026050-24-ハナコ" = "全てが解決したら、折を見てお話ししますので……"
"10026050-25" = "[s] \"……。\""
"10026050-26" = "[ns7] \"でも、一人で抱えずに話してくれると嬉しいな。\"\n[ns8] \"……それとも、私じゃ頼りないかな？\""
"10026050-27-ハナコ" = "…………。"
"10026050-28-ハナコ" = "ふふ……。"
"10026050-29-ハナコ" = "……そう言われると、弱りましたね。"
"10026050-30-ハナコ" = "これでバトンは私に渡ったのでしょうか？"
"10026050-31-ハナコ" = "自分から何かを打ち明けるのは、あまり慣れていませんが……"
"10026050-32-ハナコ" = "せっかく気にかけてくださっているのですから、#n今日は先生の仰る通りにしましょう。"
"10026050-33-ハナコ" = "……夏ですからね。"
"10026050-34-ハナコ" = "――おそらく先生は。"
"10026050-35-ハナコ" = "この状況を、ウイさんやコハルちゃんのために、私が用意したと思っているのでしょう。"
"10026050-36-ハナコ" = "私が詳しいお話をせずとも、取り立てて心配する素振りを見せず、信じてくださったわけですから。"
"10026050-37-ハナコ" = "捉えようによっては、ここはリゾート地と言えますし。"
"10026050-38-ハナコ" = "ここでなら、ちょっとしたバカンス気分を味わえますよね。"
"10026050-39-ハナコ" = "遺跡を調査する名目で訪れましたが、みんな水着姿で過ごしているわけですし。"
"10026050-40-ハナコ" = "ウイさんの問題とコハルちゃんの希望……"
"10026050-41-ハナコ" = "その2つを同時に解決できるピッタリの計画になっている、と。"
"10026050-42-ハナコ" = "……先生は、そう思ったのではないでしょうか？"
"10026050-43-ハナコ" = "その認識で、概ね間違ってはいません。"
"10026050-44-ハナコ" = "…………。"
"10026050-45-ハナコ" = "ですが、先生。"
"10026050-46-ハナコ" = "もし……もしもの話ですが。"
"10026050-47-ハナコ" = "このような時間が必要だったのは、ウイさんやコハルちゃんだけではなかった。"
"10026050-48-ハナコ" = "……としたら、どうでしょう？"
"10026050-49" = "[s9] \"それって……。\"\n[s10] \"つまり……？\""
"10026050-50-ハナコ" = "そうですね……まあ、つまりーー"
"10026050-51-ハナコ" = "私も、年相応の女の子ですから。"
"10026050-52-ハナコ" = "周囲からどう思われているのかは別として、心は一人の平凡な少女。"
"10026050-53-ハナコ" = "たまには肩の荷を下ろして、みんなと笑って楽しい時間を過ごしたいと思っても、おかしくないでしょう？"
"10026050-54-ハナコ" = "2人のためというのは……自分に対する言い訳です。"
"10026050-55-ハナコ" = "その実、心では誰よりもこんな時間を望んでいた。"
"10026050-56-ハナコ" = "……みんなと海に行きたかった。"
"10026050-57-ハナコ" = "ふふっ。ただ、それだけのお話です。"
"10026050-58" = "[s] \"……。\""
"10026050-59-ハナコ" = "な、何か言っていただけると助かるのですが……"
"10026050-60-ハナコ" = "……やはり、私には似合わないでしょうか？"
"10026050-61" = "[s11] \"ハナコにも余裕ができたんだなって……\"\n[s12] \"そういう風に言えるようになったことが、嬉しくて。\""
"10026050-62-ハナコ" = "…………。"
"10026050-63-ハナコ" = "そうですか？"
"10026050-64-ハナコ" = "でも……考えてみたらそうかもしれませんね。"
"10026050-65-ハナコ" = "ですが、せっかく無人島まで来て、2人きりで過ごせる貴重な時間を……"
"10026050-66-ハナコ" = "いつもの冗談や世間話で無駄にはしたくありませんでした。#nそういったお話なら、戻ってからもできますし。"
"10026050-67-ハナコ" = "……先生。"
"10026050-68-ハナコ" = "これからは、もう少し……もう少しだけ。"
"10026050-69-ハナコ" = "私も、ワガママになっても良いでしょうか？"
"10026050-70" = "[s] \"もちろん。\""
"10026050-71-ハナコ" = "……あら？"
"10026050-72-ハナコ" = "そんな簡単に返事をしてしまって……本当に大丈夫ですか？"
"10026050-73-ハナコ" = "もしかしたら……先生が思っている以上に、負担かもしれませんよ？"
"10026050-74" = "[s13] \"夏だからね。\"\n[s14] \"年相応の女の子、でしょ？\""
"10026050-75-ハナコ" = "……ふふ。"
"10026050-76-ハナコ" = "では、この先も期待しちゃいますよ？"
"10026050-77-ハナコ" = "……知ってますよね？#n私、こう見えてもかなり記憶力がいいんです。"
"10026050-78-ハナコ" = "今日の約束、忘れませんからね♡"
"10026050-79" = "（その後、ハナコとレモン農園を見て回ってから拠点に戻った）"
"10026050-80" = "（拠点に戻ると、ハナコと2人きりだったせいで、何度もコハルに死刑を言い渡された）"
