[translation]
"10021016-1-ニュース" = "――「シャーレの[USERNAME]先生」が重体になってから、75日が経過しました。"
"10021016-2-ニュース" = "あの事件以降、破壊された「シャーレ」の建物では――蘇生の可能性について数々の議論が行なわれ――各医療従事者は――"
"10021016-3-ニュース" = "一方、キヴォトスでは奇妙な事件が――"
"10021016-4-シロコ" = "ただいま……。"
"10021016-5-シロコ" = "……。"
"10021016-6-シロコ" = "……まだこんなに、借金が……"
"10021016-7-シロコ" = "だめ……私が、頑張らないと……"
"10021016-8-シロコ" = "一人でも……がんばらないと……"
"10021016-9-シロコ" = "……。"
"10021016-10-シロコ" = "……先生、"
"10021016-11-シロコ" = "私……"
"10021016-12-シロコ" = "私は、どうしたら……！"
"10021016-13-ニュース" = "――そ、速報です！！"
"10021016-14-ニュース" = "「先生」の意識が戻らなくなってから、100日が経過した本日――病院より緊急発表がありました――"
"10021016-15-ニュース" = "世論はこの事に関して――"
"10021016-16-ニュース" = "医療関係者は[USERNAME]先生の回復は見込めないと判断――蘇生は不可能と――"
"10021016-17-ニュース" = "これ以上の延命治療は無意味であると――"
"10021016-18-ニュース" = "あっ、今速報が入りました！現在キヴォトスの――"
"10021016-19-シロコ" = "（……うん。もう、いいや）"
"10021016-20-シロコ" = "（もう……がんばらなくて、いい）"
"10021016-21-シロコ" = "（あ、マフラー……）"
"10021016-22-シロコ" = "ああ……そっか。"
"10021016-23-シロコ" = "……そう。"
"10021016-24-シロコ" = "（前が、よく見えない……）"
"10021016-25-シロコ" = "（血を流し過ぎて……？傷の手当もせず、何日も、食べてないから？――それとも……）"
"10021016-26-シロコ" = "（このままじゃ、私……）"
"10021016-27-シロコ" = "（私、こうやって……終わるんだ）"
"10021016-28-シロコ" = "（……そっか）"
"10021016-29-シロコ" = "（もう、苦しまなくていいんだ……）"
"10021016-30-シロコ" = "（よかった……）"
"10021016-31-シロコ" = "（でも、それなら……どうして……）"
"10021016-32-シロコ" = "（……先生、）"
"10021016-33-シロコ" = "（私は……）"
"10021016-34-シロコ" = "（どうして、ここに[ruby=うまれ]存在[/ruby]したんだろう）"
"10021016-35-シロコ" = "（……）"
"10021016-36-シロコ" = "（……）"
"10021016-37-シロコ" = "（……そっか）"
"10021016-38-シロコ" = "（私も……みんなも、）"
"10021016-39-シロコ" = "……苦しむために、生まれてきたんだ。"
"10021016-40-シロコ" = "……？"
"10021016-41-無名の司祭A" = "「色彩」が、ついに[ruby=アヌビス]死の神[/ruby]と接触した――"
"10021016-42-無名の司祭B" = "「色彩」を導いたことが、「苦しみ」なのか「死」をもたらすのかは分からぬ――#nだが、これで最後｡"
"10021016-43-無名の司祭C" = "「忘れられた神々」をこの世界から追放できるようになった……この世界に、終焉を呼び寄せられるのだ。"
"10021016-44-無名の司祭D" = "ようやく、彼らは我々と同じ運命を辿る。"
"10021016-45-無名の司祭E" = "名が無いために呼ばれず、呼ぶことができないが故に存在しない「名もなき神」のように、お前たちも同じ結末へと向かうだろう。"
"10021016-46-無名の司祭F" = "数多の危険があったが、色彩を引き寄せられたのは僥倖だった。"
"10021016-47-無名の司祭A" = "司祭は神を崇めるがゆえ、「崇高」を所有できる。"
"10021016-48-無名の司祭B" = "ここに新たな「崇高」を迎え――手に入れるのだ。"
"10021016-49-無名の司祭A" = "すべての命を「[ruby=あのよ]別の場所[/ruby]」に導く死の神――"
"10021016-50-無名の司祭A" = "「アヌビス」を。"
"10021016-51-無名の司祭D" = "これからお前は「色彩」によって顕現した己の「恐怖」で、この世界を塗りつぶしていくだろう。"
"10021016-52-無名の司祭E" = "それまで――死も……安息も、許されぬ。"
"10021016-53-無名の司祭F" = "「色彩の[ruby=きょうどうしゃ]嚮導者[/ruby]」と成り、あらゆる存在を無に帰すまで。"
"10021016-54-無名の司祭G" = "すべての時空の「忘れられた神々」が消滅するまで――"
"10021016-55-市民１" = "うあぁぁぁあああああ！！"
"10021016-56-市民２" = "な、何だアレは！！"
"10021016-57-市民３" = "い、いやぁぁぁあああ――！！！"
"10021016-58-市民4" = "うわぁぁぁあああああ！！"
"10021016-59" = "[ns] 目を開ける。"
"10021016-60" = "[ns] 身体を起こす。"
"10021016-61" = "[ns1] （うまく口が動かない）\n[ns2] （前がよく見えない）\n[ns3] （身体がなんだか重い）"
"10021016-62" = "[ns] 身体についている装置を外す。"
"10021016-63-医者" = "……[USERNAME]先生！？い、一体……"
"10021016-64-医者" = "あなたは、指一本動かすどころか、意識を取り戻すことだって絶望的な――"
"10021016-65" = "[s] 口を開く。"
"10021016-66-医者" = "い、今は口を開くことも難しいでしょう……か、顔には触れないでください、プレートでようやく――"
"10021016-67-医者" = "ハッ……！それよりも、今すぐ逃げてください――"
"10021016-68-医者" = "うわぁぁああああ！に、逃げろ！！"
"10021016-69" = "[ns] ベッド横のシッテムの箱と、大事な物を手に取る。"
"10021016-70" = "[ns] シッテムの箱の電源を入れる。"
"10021016-71-A.R.O.N.A" = "……生体認証完了。[USERNAME]先生を確認。"
"10021016-72-A.R.O.N.A" = "ご命令を、先生。"
"10021016-73" = "[s] やるべきことを伝える。"
"10021016-74-A.R.O.N.A" = "……命令を確認。"
"10021016-75-A.R.O.N.A" = "分かりました。これより私A.R.O.N.Aが先生の目と耳、そして足になります。"
"10021016-76-A.R.O.N.A" = "こちらです、先生。"
"10021016-77-無名の司祭A" = "おお、「箱」[ruby=あるじ]の主が[/ruby]近づいている……！！"
"10021016-78-無名の司祭B" = "あの者は、「終わった」のでは？#n死の神はあの者を――あの箱を、相手できるのか？"
"10021016-79-無名の司祭C" = "だが、あの者の能力にも限界がある。不完全な身体でできることはそう多くない。"
"10021016-80-無名の司祭A" = "ああ。まずは箱……箱を壊すべきだ。"
"10021016-81-無名の司祭B" = "あの者が奇跡を起こせぬよう、阻止せねば。"
"10021016-82-無名の司祭C" = "アレさえ無ければ、あの者はもはや何者でもない。"
"10021016-83-シロコ" = "もう、先生を守る方法は無い。"
"10021016-84-シロコ" = "[USERNAME]先生。"
"10021016-85-シロコ" = "これで……"
"10021016-86-シロコ" = "これで、全部……終わるはずだから。"
"10021016-87-シロコ" = "……。"
"10021016-88-シロコ" = "だめ……私、"
"10021016-89-シロコ" = "私には……できない。"
"10021016-90" = "[ns4] （銃弾は外れたけど……）\n[ns5] （これ以上は、からだが……）"
"10021016-91-シロコ" = "先生、ごめんなさい……私のせいで、"
"10021016-92-シロコ" = "私が間違ったせいで……"
"10021016-93-シロコ" = "……わたし、が、いきて、いるから……"
"10021016-94-シロコ" = "こ……これは……"
"10021016-95" = "色彩が……先生を……？"
"10021016-96" = "い、イヤ…………"
"10021016-97" = "や、やめ……ろ……"
"10021016-98" = "ヤ……ヤダヤダヤダヤダヤダヤダ……"
"10021016-99" = "せん、せ…………"
"10021016-100" = "わたし、の、せいで……そん、な……"
"10021016-101" = "あ……ああ……あああぁあああああああ……"
"10021016-102-シロコ" = "いやぁぁぁああああああああぁっ――――！！！！！！"
"10021016-103-アロナ" = "これは……！！"
"10021016-104-アロナ" = "ぷ、プレナパテスが立ち上がります先生！！"
"10021016-105-アロナ" = "まだ、こんな力が……。"
"10021016-106-アロナ" = "「アトラ・ハシースの箱舟」の全エネルギーが……プレナパテスに、集中しています！"
"10021016-107-アロナ" = "先生！プレナパテスを止めないと……！！"
"10021016-108-アロナ" = "現在プレナパテスの「シッテムの箱」はダウンした状態です！#n無力化するなら、今です！"
