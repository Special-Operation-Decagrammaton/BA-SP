[translation]
"10021022-1" = "「脱出シーケンス」：残り1回"
"10021022-2" = "[ns] （ああ……）"
"10021022-3-シロコ" = "…………！………………！！"
"10021022-4-シロコ" = "………………………………。"
"10021022-5" = "[ns1] （結局こうなってしまうんだ……）\n[ns2] （伝えるべきことを、伝えられなかった……）"
"10021022-6" = "[ns] でも……やらなくては。"
"10021022-7" = "[ns3] 「大人」の責任を果たす。\n[ns4] 「先生」の義務を全うする。"
"10021022-8-無名の司祭A" = "「色彩」が、箱[ruby=あるじ]の主と[/ruby]接触した！"
"10021022-9-無名の司祭B" = "この事態は想定していない……色彩があの者の「苦しみ」に反応したのか、それとも――"
"10021022-10-無名の司祭C" = "不可能だ。あの者は「崇高」、「神秘」、「恐怖」のいずれも有していない。「色彩」が無価値な存在に接触する理由など無い。"
"10021022-11-無名の司祭D" = "つまり――何を意味する？"
"10021022-12-無名の司祭E" = "あの者が、死の神の代わりに「色彩の[ruby=きょうどうしゃ]嚮導者[/ruby]」になるというのか？"
"10021022-13-無名の司祭F" = "理解できぬ。"
"10021022-14-無名の司祭A" = "理解できぬ。"
"10021022-15-無名の司祭B" = "理解できぬ。"
"10021022-16-無名の司祭C" = "理解できぬ――だが、あの「箱」を我々が所有できるのなら、理解する必要も無い。"
"10021022-17-無名の司祭D" = "箱[ruby=あるじ]の主よ[/ruby]――お前の望み通り、「色彩の嚮導者」の役割を与えよう。"
"10021022-18-無名の司祭E" = "お前に「[ruby=プレナパテス]偽りの先生[/ruby]」の名を、与える。"
"10021022-19-無名の司祭F" = "「色彩の嚮導者」は我々無名の司祭の意志を代弁するのみ。#n己の意志を持てると思うな。"
"10021022-20-無名の司祭G" = "「箱」の力は、我々が預かる。"
"10021022-21-無名の司祭A" = "お前はこの選択を……未来永劫、後悔するだろう――！！"
"10021022-22" = "[ns5] \"プレナパテスが……伝えたいことがあるみたい。\"\n[ns6] \"「色彩の嚮導者」になってまでここに来た理由を――\""
"10021022-23-シロコ" = "先生……ごめんなさい……私のせいで、"
"10021022-24-シロコ" = "私が生きている、せいで……私が、死ねなかったから……"
"10021022-25-シロコ" = "私が、間違ったせいで……"
"10021022-26-シロコ" = "……先生？"
"10021022-27" = "自分の生を、悔やんだり――責めないで。"
"10021022-28" = "幸せになりたいと願う気持ちを――否定しないで。"
"10021022-29" = "生きることを諦めて、苦しみから解き放たれた――だなんて悲しい事を言わないで。"
"10021022-30" = "苦しむために生まれてきた――なんて、思わないで。"
"10021022-31" = "そんな事は絶対にないのだから。"
"10021022-32" = "どんな[ruby=こども]生徒[/ruby]も、そう思う必要なんて無いのだから。"
"10021022-33" = "子どもの「世界」が、苦しみで溢れているのなら……"
"10021022-34" = "子どもが、絶望と悲しみの淵でその生を終わらせたいと願うのなら――"
"10021022-35" = "そんな願いが、この世界のどこかにまだ存在するというのなら――"
"10021022-36" = "それは――"
"10021022-37" = "その「世界」の責任者のせいであって、子どもが抱えるものじゃない――"
"10021022-38" = "世界の「責任を負う者」が抱えるものだよ。"
"10021022-39" = "たとえ罪を犯したとしても、赦されないことをしたとしても――"
"10021022-40" = "[ruby=こども]生徒[/ruby]が責任を負う世界なんて、あってはならないんだよ。"
"10021022-41" = "いつ、いかなる時であっても――"
"10021022-42" = "子どもと共に生きていく[ruby=・]大[/ruby][ruby=・]人[/ruby]が背負うべき事だからね。"
"10021022-43" = "い、いや、だ……"
"10021022-44" = "だ、だめ……や……やめ、てお願い……"
"10021022-45" = "あ……あぁあああああああ……"
"10021022-46" = "せん、せぇええええええええ――――！！！！！！！"
"10021022-47-無名の司祭A" = "驕るな――！！"
"10021022-48-無名の司祭B" = "アレは、お前の知る[ruby=こども]生徒[/ruby]ではない！！"
"10021022-49-無名の司祭C" = "アレは神が顕現したもの――「神秘」であり、「恐怖」であり、「崇高」……「光」であり、「絶対者」！！"
"10021022-50-無名の司祭B" = "アレは「観念」で……お前が理解できない、畏怖すべき対象なのだ！！"
"10021022-51-無名の司祭A" = "想像界で表象され、現実界へと至る――象徴界の記号であり[ruby=メタファー]隠喩[/ruby]なのだ！！！"
"10021022-52" = "[ns] （違う、）"
"10021022-53" = "[ns7] （あの子は……）\n[ns8] （あの子は、ただ……）"
"10021022-54" = "[ns9] （純粋に……自転車と、運動が大好きな……）\n[ns10] （仲間のために、覆面を作って強盗を行うことだって厭わない……）\n[ns11] （アビドス高等学校の……砂狼シロコだよ。）"
"10021022-55" = "[ns] 私の「世界」で苦しんでいる、ただの「子ども」だよ。"
"10021022-56-無名の司祭A" = "お前はこの選択を……未来永劫、後悔するだろう――！！"
"10021022-57" = "[ns] そうなのかもしれない……でも、"
"10021022-58" = "大人として――子供を守り、先生として生徒を守るため。#n大人の責任――先生の義務を、果たすためだよ。"
"10021022-59" = "どんな方法だったとしても、#nいかなる代償を支払うことになったとしても。"
"10021022-60-シロコ" = "せん、せい……？"
"10021022-61-A.R.O.N.A" = "分かりました。仰せの通りに。"
"10021022-62-A.R.O.N.A" = "たとえ、世界の終焉を招くとしても。"
"10021022-63" = "[ns] プレナパテスの言葉に耳を傾ける。"
"10021022-64" = "生徒たちを……よろしく、お願いします。"
"10021022-65" = "[ns] 応える"
