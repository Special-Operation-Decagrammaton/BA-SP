[translation]
"10047010-1" = "第1話;運命的な再会"
"10047010-2" = "（休憩がてら、とある広場を訪れたところ……）"
"10047010-3" = "[ns1] \"カッコイイ……。\"\n[ns2] \"どこかで聴いたことがあるような……。\""
"10047010-4-通行人B" = "う、ウソだろ？#nこんなすごい演奏を、女子高生が……！？"
"10047010-5-通行人B" = "このデスメタル……魂がたぎるぜ！！"
"10047010-6" = "[ns] \"女子高生……デスメタル……。\""
"10047010-7" = "[ns] \"ああ！この演奏は……！！\""
"10047010-8-ツムギ" = "ふふ。みなさん、ありがとうございます。"
"10047010-9-ツムギ" = "私の名は[ruby=しいな]椎名[/ruby]ツムギ。#n不思議の国から参りました。"
"10047010-10-ツムギ" = "もっとも、童話の国など存在しませんが――"
"10047010-11-ツムギ" = "――「フィーリング」。"
"10047010-12-ツムギ" = "……は大事ですから。"
"10047010-13" = "[ns] \"やっぱり、ツムギだったんだ！\""
"10047010-14-ツムギ" = "おや？あなたは……。"
"10047010-15-ツムギ" = "これは……思わぬ再会ですね。"
"10047010-16-ツムギ" = "ああ……「あの子」の言っていた#n「巡り合い」とはこのことですか。"
"10047010-17-ツムギ" = "なるほど……。#n運命の赤い糸は、フィクションではなかったのですね。"
"10047010-18-ツムギ" = "せっかく再会したのです。#n少し、語り合いませんか？"
"10047010-19-ツムギ" = "今日のライブは、もう幕を降ろしましたので。"
"10047010-20" = "[s] \"喜んで！\""
"10047010-21-ツムギ" = "では、参りましょうか。"
"10047010-22-ツムギ" = "――不思議の国へ。"
"10047010-23" = "[s] \"不思議の国って……。\""
"10047010-24" = "[ns3] \"公園の森のこと？\"\n[ns4] \"会場のこと？\""
"10047010-25-ツムギ" = "ふふっ……それは後のお楽しみということで。"
"10047010-26-ツムギ" = "さあ、こちらへ。きっと忘れられない体験となるでしょう。"
"10047010-27-ツムギ" = "不思議の国へようこそ。#n……さて、ご感想は？"
"10047010-28" = "[s] \"ここ……普通のカフェだよね？\""
"10047010-29-ツムギ" = "……先生。#n「不思議」とは、「普通と異なるもの」を意味するのですよ。"
"10047010-30-ツムギ" = "先生と二人でカフェに来るのは、今日が初めてですよね？#nつまり、[ruby=・]普[/ruby][ruby=・]通[/ruby][ruby=・]と[/ruby][ruby=・]は[/ruby][ruby=・]違[/ruby][ruby=・]う[/ruby]状況。#nこれを「不思議」と言わずして、何と言いましょう？"
"10047010-31" = "[s] \"たしかに、そう言われると……。\""
"10047010-32-ツムギ" = "とはいえ……先生と生徒を結ぶ関係が#n「不思議」のままというのも……#n[ruby=いささ]些[/ruby]か寂しいではありませんか。"
"10047010-33-ツムギ" = "ですから……いかがでしょう？#n物語をひとつ、進めてみるというのは。"
"10047010-34" = "[s] \"お互いのことをもっと知りたいってことかな？\""
"10047010-35-ツムギ" = "ふふ、それではまるで私がデートに誘っているようではないですか。"
"10047010-36-ツムギ" = "いえ、否定はしませんよ。こういった展開では――"
"10047010-37-ツムギ" = "――「エモーション」。"
"10047010-38-ツムギ" = "……が大事ですから。"
"10047010-39-ツムギ" = "ひとつ、聞かせてください。"
"10047010-40-ツムギ" = "先日の私の公演……楽しんでいただけましたか？"
"10047010-41-ツムギ" = "キェェェェェ！人間の死が社会の福祉だぁぁぁぁぁぁ！！！"
"10047010-42-ツムギ" = "ウォェェェェェェェェェェェェッ！！！！"
"10047010-43-ツムギ" = "先生？"
"10047010-44" = "[s5] \"あ、えっと……。\"\n[s6] \"た、楽しかったよ……。\""
"10047010-45-ツムギ" = "ふふ、それは良かったです。"
"10047010-46-ツムギ" = "あのときは打ち上げにご招待できず、申し訳ありませんでした。#nメンバーが人見知りでして……。"
"10047010-47-ツムギ" = "いつか先生にご紹介できるといいのですが。"
"10047010-48" = "[s] \"みんな、ワイルドハントのバンド部なんだっけ？\""
"10047010-49-ツムギ" = "いえ、さまざまな学園の生徒が集まっています。"
"10047010-50-ツムギ" = "そもそも、ワイルドハントにバンド部はありませんので。"
"10047010-51-ツムギ" = "ふふっ、「芸術学院」なのに、不思議ですよね？"
"10047010-52-ツムギ" = "より正確に言うならば、公式の部活そのものが存在しないのです。"
"10047010-53-ツムギ" = "学科の学びがそのまま芸術活動に繋がっているため、#n部活動をする必要はない――という方針なので。"
"10047010-54-ツムギ" = "それでも、私のように別途許可を取れば、#n学外の子と活動することもできますし……。"
"10047010-55-ツムギ" = "学内の同好の士で集まり、ひっそりと活動する子もいます。"
"10047010-56-ツムギ" = "……ふむ。#nまだまだワイルドハントのことをご紹介したいのですが――#nこの場で語るには、どうにも余白が足りないようです。"
"10047010-57-ツムギ" = "なのでここは端的に……#nワイルドハントとは、芸術家たちのための――#n「夢と希望のワンダーランド」のような場所なのです。"
"10047010-58" = "[s] \"夢と希望のワンダーランド……？\""
"10047010-59-ツムギ" = "夢や志を持って入学し、思うままに追求できる学院ですから。"
"10047010-60-ツムギ" = "ああ、せっかくですし、いっそ……。"
"10047010-61-ツムギ" = "この椎名ツムギが、先生のウサギを務めましょうか。"
"10047010-62" = "[s] \"それは……どういう意味……？\""
"10047010-63-ツムギ" = "さながら、少女をワンダーランドへと導いたウサギのように。#n私が先生をワイルドハントへご招待します。"
"10047010-64-ツムギ" = "もちろん、本当のウサギではありませんが――"
"10047010-65-ツムギ" = "――「雰囲気づくり」。"
"10047010-66-ツムギ" = "……は大事ですから。"
"10047010-67-ツムギ" = "私と共に学院を巡り、語り合いませんか？"
"10047010-68-ツムギ" = "あわせて、寮の友人たちもご紹介できればと。"
"10047010-69-ツムギ" = "みんなに先生の話をしたところ、目を輝かせておりまして。"
"10047010-70" = "[s] \"いいね。私も楽しみだよ！\""
"10047010-71-ツムギ" = "ふふ、では決まりですね。"
"10047010-72-ツムギ" = "ただ、今は難しいので……。#nそれでは後日、じっくり見学といきましょうか。"
"10047010-73-ツムギ" = "もちろん私は役目通りに、バニーガールの姿で――"
"10047010-74" = "[s] \"そこまでしなくて大丈夫だよ！\""
"10047010-75-ツムギ" = "ふむ……それは残念ですね……。"
"10047010-76-ツムギ" = "バニーガールとギターは、#n「こちら側」でそれなりに歴史のある組み合わせなのですよ。"
"10047010-77-ツムギ" = "先生にもぜひ、お見せしたかったのですが……。"
"10047010-78" = "[s7] \"今回は……。\"\n[s8] \"普通の格好でお願いしたいかな。\""
"10047010-79-ツムギ" = "ふっ……では次回以降のお楽しみということで。"
"10047010-80-ツムギ" = "そろそろ注文しましょうか。メニューは……。"
"10047010-81-ツムギ" = "……これは！#n先生、こちらをご覧ください。"
"10047010-82-ツムギ" = "「一口でメロメロ。悪魔のスイーツフェア！」だそうです。"
"10047010-83-ツムギ" = "こちらの「ベリーベリーケーキ」など、#n写真を見ているだけでメロメロになってしまいそうです……！"
"10047010-84" = "[s] \"びっくりするくらいベリーが盛られてるね……。\""
"10047010-85-ツムギ" = "ベリーが目玉のように見えるのも、とってもチャーミングですね。"
"10047010-86-ツムギ" = "そういえば……#n寮にはこれと似たアクセサリーを好む先輩がいるんですよ。"
"10047010-87-ツムギ" = "他にもいつもとんがり帽子をかぶっている子や、#n個性的なファッションの子……。"
"10047010-88-ツムギ" = "……ふふ、ご紹介するのが楽しみです。"
"10047010-89" = "[s9] \"個性的な子たちなんだね。\"\n[s10] \"面白そうな子たちなんだね。\""
"10047010-90" = "（この時、私はまだ気づいていなかった）"
"10047010-91" = "（物語は、すでに始まっていたことに……）"
