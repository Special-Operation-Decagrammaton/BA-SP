[translation]
"10047060-1" = "第6話;それぞれの夢"
"10047060-2" = "[ns] \"……屋根裏部屋だ。\""
"10047060-3-ツムギ" = "ふふ、まるでシンデレラのよう……。"
"10047060-4-ツムギ" = "本当のシンデレラでもなければ、#n灰の中の豆を探してもいませんが――"
"10047060-5-レナ" = "もういいから！それよりどうするの？#nどうやってここから出るつもり？"
"10047060-6" = "[ns] \"ここは何のための部屋なの？\""
"10047060-7-エリ" = "生徒を外界から隔絶し、マナを奪う空間です……。"
"10047060-8-エリ" = "ある種の「結界」と言えば良いでしょうか……！"
"10047060-9-レナ" = "ただの反省室でしょ……。"
"10047060-10" = "[s] \"な、なるほど……。\""
"10047060-11-ツムギ" = "例えるなら「牢屋」でしょうか。#nそれほど抑圧はされませんが……。"
"10047060-12-カノエ" = "ここ……意外と良いよ、あったかいし……ご飯も出る。"
"10047060-13-カノエ" = "だから……みんな、心配いらない……。"
"10047060-14-カノエ" = "すぐ出られるはず……。"
"10047060-15-エリ" = "そうです！こういう時こそ、前向きにいきましょう！"
"10047060-16-レナ" = "みんなのんき過ぎ。"
"10047060-17-レナ" = "何でついてきちゃったんだろ……はぁ。"
"10047060-18-レナ" = "何が魔法陣よ……。次こそは、絶対止めるんだから。"
"10047060-19" = "[ns1] \"魔法陣、か……。\"\n[ns2] \"そういえばみんな、どうしてオカルトにハマったの？\""
"10047060-20-ツムギ" = "特にこれといったきっかけはありません。"
"10047060-21-ツムギ" = "私はみんなと楽しい時間が過ごせれば、それでいいのです。"
"10047060-22-ツムギ" = "バンドと同じように。"
"10047060-23-ツムギ" = "ふふ……それで十分ではないですか？"
"10047060-24-カノエ" = "イヒッ、そうだねぇ……楽しければ……それでいい。"
"10047060-25-カノエ" = "この世界は……闇に覆われている……。"
"10047060-26-カノエ" = "生き抜くなら……楽しみは多ければ、多いほど……良い。"
"10047060-27" = "[s] \"カノエは、どうしてオカルトを……？\""
"10047060-28-カノエ" = "私は……ただ、好きなだけ……。"
"10047060-29-カノエ" = "「好き」に……理由はいらないよねぇ？"
"10047060-30-カノエ" = "そしてオカルトは……意外と、勉強になる……。"
"10047060-31-カノエ" = "エリちゃんが言ったように……#n芸術とオカルトは、切り離せない存在だから。"
"10047060-32-カノエ" = "ちなみに……成績はいい方だよ……イヒッ……。"
"10047060-33-エリ" = "うう……尊敬します、先輩！"
"10047060-34-エリ" = "私もカノエ先輩を見習わないと……#n実技試験でいつも緊張しちゃうから……。"
"10047060-35" = "[s] \"そうなんだ？\""
"10047060-36-エリ" = "……実は私、落ちこぼれなんです。"
"10047060-37-エリ" = "入学するまで、絵に自信を持っていたのですが……#nここにはもっと凄い子たちがたくさんいました。"
"10047060-38-エリ" = "いくら頑張っても実力は伸びず……#n学科の友達の前に立つと、いつも小さくなってしまうんです。"
"10047060-39-エリ" = "みんなが素敵な作品を生み出してるのに……#n私は今まで納得できるものを作れていません。"
"10047060-40" = "[s] \"だから、美術館で友達と会った時に緊張してたんだね。\""
"10047060-41-エリ" = "え、えへへ……情けないですよね。"
"10047060-42-エリ" = "でも、これではいけないと思い……#n実力をつける方法を探して――"
"10047060-43-エリ" = "気づけば、オカルトの虜になっていました。"
"10047060-44-エリ" = "いつか「創世の影像」のような作品を生み出せたら――"
"10047060-45-エリ" = "その時こそ、みんなの前に堂々と立てるんです！"
"10047060-46-エリ" = "変、ですかね……。"
"10047060-47" = "[ns3] （懸命に、自分の夢を追う生徒がいる）\n[ns4] （なら、先生がすべきことはなにか――）"
"10047060-48" = "[ns] \"なにも変じゃないよ。世界は可能性に満ちているからね。\""
"10047060-49-エリ" = "にゅっふっふ……！そうですよね？#nやはり、マスターなら応援してくださると思いました！"
"10047060-50-レナ" = "先生も「そっち側」だったんだ……。"
"10047060-51-レナ" = "何度も言うけど、私はオカルトなんて信じないからね。"
"10047060-52-レナ" = "変な噂も、おかしな現象も、全部みんなの勘違い。"
"10047060-53-レナ" = "悪魔も運命も、未来予知も……魔法だって。#nこの目で見ないと信じられない。"
"10047060-54" = "[s] \"そうだね。理性的に考えるのも重要だと思うよ。\""
"10047060-55-ツムギ" = "ですが、そんなレナちゃんも素敵な夢を追っているんです。#nいつかキヴォトス最高のファッションデザイナーになる、と言っていましたよね？"
"10047060-56-レナ" = "ゆ、夢は大きい方がいいでしょ？#n学科の成績も良い方だし……。"
"10047060-57-ツムギ" = "そうですね……。#n私の夢は、みんなとずっと、夢と希望に満ちた日々を送ることです……ふふっ。"
"10047060-58-ツムギ" = "カノエ先輩の夢は、なんですか？"
"10047060-59-カノエ" = "……秘密ぅ。"
"10047060-60-エリ" = "教えてくださいよ～！みんな話したじゃないですかぁ。"
"10047060-61-カノエ" = "そんなに、知りたい……？"
"10047060-62-カノエ" = "仕方ないなぁ……私の夢はねぇ……。"
"10047060-63-カノエ" = "前世の絆を取り戻すこと……。"
"10047060-64" = "[ns] \"んん……？\""
"10047060-65-カノエ" = "私の前世には、強い絆で結ばれた相手がいた……#n最近、気づいたんだ……イヒッ。"
"10047060-66" = "[ns5] \"そ、そうなんだね……。\"\n[ns6] \"い、いいと思うよ……。\""
"10047060-67-カノエ" = "イヒヒ……。"
"10047060-68-ツムギ" = "……お忘れですか？あなた方は反省室にいるんですよ？"
"10047060-69-ツムギ" = "あ！ご、ごめんなさい！"
"10047060-70-レナ" = "……まあ、反省するとは最初から思っていませんでしたが。"
"10047060-71-レナ" = "あ、あれ？"
"10047060-72-寮監隊の幹部" = "さあ、どうぞ。今回は特別に注意のみとしておきます。"
"10047060-73-寮監隊の幹部" = "ただし、次は評議会に報告しますからね。"
"10047060-74-カノエ" = "イヒッ、ありがとう……やっぱりミリアちゃんは話がわかるねぇ。"
"10047060-75-ミリア" = "シャーレの先生を拘禁したと知られたら……#n一体何を言われるか分かりませんから。"
"10047060-76-ミリア" = "さぁ、お帰りください。私の気が変わる前に。"
"10047060-77-エリ" = "あ、ありがと！"
"10047060-78-エリ" = "ふう、助かりました……！"
"10047060-79" = "[ns] \"いまの子も寮監隊？\""
"10047060-80-カノエ" = "そう……昔から世話になっている友達だよ……。"
"10047060-81-カノエ" = "寮監隊の、幹部たちの中でも……話が通じる方でねぇ……。"
"10047060-82" = "[ns] \"……そうなんだ。\""
"10047060-83-ツムギ" = "では、寮に戻りましょうか。部屋の掃除もしないとです。"
"10047060-84-レナ" = "あっ……！そういえば、めちゃくちゃになってた！"
"10047060-85-エリ" = "えへへ……ごめんなさい。"
"10047060-86" = "[ns] \"私も手伝うよ。\""
"10047060-87-レナ" = "ちゃんと綺麗にしてね？止めなかった先生にも責任あるんだから。"
"10047060-88-レナ" = "私もまあ……ちょっと手伝うよ。"
"10047060-89-カノエ" = "やっぱり、レナちゃんは優しいねぇ……イヒッ……。"
"10047060-90-レナ" = "ほ、褒められても嬉しくないし！"
"10047060-91-ミリア" = "……こんなところで再会するとは。"
"10047060-92-ミリア" = "ふふっ……[USERNAME]先生。"
