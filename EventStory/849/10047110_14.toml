[translation]
"10047110-1" = "エピローグ;日常は続いていく"
"10047110-2" = "[ns] \"素晴らしい作品ができたのはよかったけど。\""
"10047110-3" = "[ns] \"また反省室かぁ……。\""
"10047110-4-レナ" = "自業自得でしょ。#nむしろ、これだけで済んでびっくりというか……。"
"10047110-5-カノエ" = "そういえば……レナちゃんもいるんだねぇ……？"
"10047110-6-レナ" = "自首したの。立ち入り禁止の場所に入って鐘を鳴らしたんだし。"
"10047110-7-レナ" = "私は先輩どもと違って、真面目な生徒だからね。"
"10047110-8-ツムギ" = "やっぱり、レナちゃんだったのですね。"
"10047110-9-カノエ" = "イヒッ、滅亡の鐘を鳴らすとは……大胆だねぇ……。"
"10047110-10-レナ" = "滅亡ってどこが？あんなの全部でたらめだから！"
"10047110-11-エリ" = "でも、願いが叶う魔法は発動しましたよ？"
"10047110-12-レナ" = "願いが叶ったのはエリ先輩だけでしょ。"
"10047110-13-ツムギ" = "いいえ、私も叶いました。"
"10047110-14-ツムギ" = "今度、対バンがあるのですが、#nどんな曲で相手を圧倒しようかと悩んでいて……。"
"10047110-15-ツムギ" = "でも、今回の追走劇の中で、自然と歌詞やメロディーが浮かんできたんです。"
"10047110-16-ツムギ" = "ふふっ、おかげさまで一件落着です。"
"10047110-17-ツムギ" = "既に頭の中にメロディーはできていて……聞きますか？"
"10047110-18-レナ" = "だ、大丈夫！私は穏やかなツムギ先輩が好きなの！"
"10047110-19-ツムギ" = "私はいつも穏やかですよ？"
"10047110-20-ツムギ" = "つまり……いつも私のことが好き、ということでしょうか？"
"10047110-21-レナ" = "シャーッ！！"
"10047110-22-カノエ" = "実は私も……気づいたことがあるの……。"
"10047110-23-レナ" = "今度は何よ？"
"10047110-24-カノエ" = "前世の大切な存在を……思い出したんだぁ……イヒッ。"
"10047110-25-カノエ" = "最初は……そんな気がしてただけ……#nでも、どんどん確信に変わっていって……。"
"10047110-26-カノエ" = "相手が誰か、知りたくなぁい……？"
"10047110-27-レナ" = "いや別に……どうせまた意味わかんないこと言うつもりでしょ？"
"10047110-28-カノエ" = "レナちゃんは……前世を信じないんだ。"
"10047110-29-カノエ" = "あの触れ合いの日々を忘れたなんて……悲しいよぉ……。"
"10047110-30-レナ" = "な、何言ってんの？"
"10047110-31-レナ" = "まさか、前世で私が先輩と……？"
"10047110-32-カノエ" = "私たちは……互いをとても大切にしていたのに……。"
"10047110-33-カノエ" = "私は飼い主で……。"
"10047110-34-カノエ" = "レナちゃんは、愛らしい猫……。"
"10047110-35-レナ" = "シャーッ！やめろーっ！"
"10047110-36-ツムギ" = "ですが、レナちゃんが愛らしいのは事実ですよ？"
"10047110-37-レナ" = "シャーッ！もう！！"
"10047110-38-エリ" = "ふふっ、でも……本当に、ありがとうございました。#nレナちゃんの力があったからこそ、みんなで一歩進めたんです。"
"10047110-39-レナ" = "私は何も得られなかったけど……？"
"10047110-40-エリ" = "にゅふふ、レナちゃんの願いも叶っています。"
"10047110-41-レナ" = "え？どんな？"
"10047110-42-エリ" = "みんなと楽しく過ごしたい、という願いです。"
"10047110-43-レナ" = "だだ、誰がそんなお願いなんか！"
"10047110-44-レナ" = "お、覚えてなさい！オカルトは迷信だって証明してやるんだから！"
"10047110-45-ツムギ" = "ふふ、はい。分かっています。"
"10047110-46-ツムギ" = "最近、寝る前に星占いの本を読んでいる……#nなんて知らないですし。"
"10047110-47-レナ" = "……！"
"10047110-48-ツムギ" = "私が錬金釜を使っている時、こっそり覗いてたのも……#n気づいてないよぉ。"
"10047110-49-レナ" = "……！！"
"10047110-50-エリ" = "にゅふふ。#nタロットがなぜ当たるのか熱心に聞いてくれたのは……#n忘れたくないですけど。"
"10047110-51-レナ" = "……！！！"
"10047110-52" = "[s] \"レナも……実はオカルトに興味が？\""
"10047110-53-レナ" = "んもーっ！ほんっとうるさい連中ね！"
"10047110-54-エリ" = "にゅふふ、では次の作品を考えますか。"
"10047110-55-エリ" = "今度はどんな風にみなさんをビックリさせましょう？"
"10047110-56-レナ" = "……びっくりさせないとダメなの？"
"10047110-57-エリ" = "みんなを驚かせてこそ、革新的な芸術といえます！"
"10047110-58-ツムギ" = "革新的……。"
"10047110-59-ツムギ" = "それでしたら、評議会長が所有する博物館へ行きませんか？"
"10047110-60-ツムギ" = "あそこは、ワイルドハントでも伝説的な芸術品たちが眠る場所。"
"10047110-61-ツムギ" = "非公開にしている理由さえ秘密の、禁断の地……。"
"10047110-62-ツムギ" = "そこならば、「創世の影像」に隠された学院の秘密を、#n見つけられるかもしれません。"
"10047110-63-カノエ" = "個人の博物館……私も、気になる。"
"10047110-64-カノエ" = "どんなオカルトがあるかなぁ……イヒッ……。"
"10047110-65-エリ" = "カノエ先輩も行ったことがないのですか？"
"10047110-66-カノエ" = "そう……評議会長を除いて……#n入ったことのある者は、いない――"
"10047110-67-カノエ" = "あの「慈愛の怪盗」でさえ。"
"10047110-68-レナ" = "そ、そんな場所に忍び込もうって、本気！？"
"10047110-69-エリ" = "にゅふふ、みなさんとなら不可能などありません！#nそうですよね？"
"10047110-70-レナ" = "あぁ……この顔……本気だ……。"
"10047110-71-レナ" = "先生、なんとかしてよ！また何かやらかすよ！？"
"10047110-72" = "[ns] \"話を聞いた感じ、実は私も気になるんだよね……。\""
"10047110-73" = "[ns1] \"でも、まずは普通のやり方から試してみよう。\"\n[ns2] \"一般生徒も入れてもらえるように、頑張ってみるよ。\""
"10047110-74-カノエ" = "普通じゃないやり方は、任せてねぇ……。"
"10047110-75-カノエ" = "イヒッ……イヒヒヒッ……！"
"10047110-76-ツムギ" = "こうなったカノエ先輩は、もう誰にも止められません。#n私も胸が高鳴ります。"
"10047110-77-エリ" = "にゅふふ、これで次の活動は決まりましたね！"
"10047110-78-エリ" = "オカルト研究会の会長として、宣言いたします！"
"10047110-79-エリ" = "次の目標は……「評議会長の博物館」！#nそこに秘められしオカルトを、一つ残らず暴きましょう！"
"10047110-80-レナ" = "はぁ……もうやだぁ……。"
"10047110-81" = "（果たして次のオカ研の計画は成功するのか……）"
"10047110-82-ミリア" = "……ふふ、興味深い……次回も楽しみにしておりますよ。"
"10047110-83-ミリア" = "「寮監隊の幹部」として。そして――"
"10047110-84-ミリア" = "「慈愛の怪盗」としても。"
"10047110-85-ミリア" = "また会える日が、楽しみです。"
"10047110-86-ミリア" = "どのような演目になるか……私にもまだ、分かりませんが。#nふふふっ……。"
"10047110-87" = "我らオカルト研究会！～学院の不思議と古の呪文～"
