[translation]
"10059040-1" = "第4話;怪しい流通業者"
"10059040-2" = "（翌日、芸術評議会を訪れた）"
"10059040-5-マナミ" = "ごきげんよう。お待ちしておりました。"
"10059040-6-マナミ" = "昨日の労をねぎらって小粋な冗談でも交わしたいところですが――#nあいにく、そうも言っていられません。"
"10059040-7-マナミ" = "さっそく本題に入りましょう。"
"10059040-8-マナミ" = "カノン書記官。お願いします。"
"10059040-13-カノン" = "昨日の調査により、我々は違法組織の帳簿と多数の関係者を確保しました。"
"10059040-14-カノン" = "それらをもとに取引の流れを追い、評議会が至った結論は――"
"10059040-15-カノン" = "――ワイルドハントの名が、資金洗浄に利用されている。"
"10059040-16" = "[s] \"想像以上に深刻だね……。\""
"10059040-17-ウララ" = "昨日捕らえた関係者から、話を聞こうと説得を試みました。"
"10059040-18-ウララ" = "そうですね。いわゆる、飴と鞭でしょうか……#nマナミ様が鞭を振るわれて、そのあとでわたくしが飴を差し出すような……。"
"10059040-19-ウララ" = "ただ、その……まさかマナミ様が文字通り鞭を振るわれるとは……。"
"10059040-20-カノン" = "実に見応えのある記録でした。"
"10059040-24-ウララ" = "と、ともかく……わたくしは相手の警戒を解いて、情報を得ようとしたのです。"
"10059040-25-ウララ" = "ですが結局、何も聞き出せませんでした。"
"10059040-26-ウララ" = "皆さん、冬場の寒さに耐える蕾のように口が堅くて……。"
"10059040-27-ウララ" = "そして何より、依頼人をひどく恐れているようでした。"
"10059040-28-ウララ" = "「裏切れば、永遠に消される」と。"
"10059040-29-ウララ" = "決まって同じことを口にするのです。"
"10059040-30-ウララ" = "依頼人の正体は掴めていませんが、裏の世界ではかなり名の知れた存在だと思われます。"
"10059040-31-マナミ" = "相手は、犯罪組織の中でも相当な大物。"
"10059040-32-マナミ" = "自らは姿を見せず、物資と資金だけを動かしながら、#n強大な影響力を有しているようです。"
"10059040-33" = "[s] \"心当たりはある？\""
"10059040-34-マナミ" = "やはり、あの泥棒猫が――"
"10059040-35-マナミ" = "と言いたいところですが、どうやら異なるようですね。"
"10059040-36-マナミ" = "あの臆病な逃亡者が、犯罪者に恐れられるほどの大物だとは思えません。#n状況から見て、第三者がいるのでしょう。"
"10059040-37-マナミ" = "……ですが、肝心の正体が掴めない。"
"10059040-38-マナミ" = "まずは学院内部の取り締まりを強化し、関係者を洗い出す必要がありそうです。"
"10059040-39-マナミ" = "ついでに、泥棒猫を捕まえる手がかりも見つかれば良いのですが。"
"10059040-40-マナミ" = "捕まえた暁には……生涯牛乳だけを飲む刑に処します。"
"10059040-41-マナミ" = "特別に情けをかけて、用意するのはプレミアムミルクにしましょう。"
"10059040-42-マナミ" = "毎日届けられる新鮮な牛乳を、それはもう飽きるほど――"
"10059040-46-マナミ" = "――ん？待ってください。"
"10059040-47-マナミ" = "毎日届けられる……新鮮な牛乳？"
"10059040-55-マナミ" = "この商品が学院に出回り始めたのはいつ頃でしたか？"
"10059040-56-カノン" = "2ヶ月前です。"
"10059040-57-マナミ" = "では、例の不審な買い手が現れたのは？"
"10059040-58-ウララ" = "……そちらも、おおよそ2ヶ月前です。"
"10059040-59-マナミ" = "……妙ですね。"
"10059040-60" = "[s] \"どうして急に牛乳の話を？\""
"10059040-61-マナミ" = "不審な買い手と、牛乳の流通。何の関係もないように思えますが……。#nどうにも、時期が重なりすぎています。"
"10059040-62-マナミ" = "無関係と判断するのは、調べてからでも遅くないでしょう。"
"10059040-63-マナミ" = "カノン書記官、すぐに牛乳の流通業者へ繋いでください。"
"10059040-64-マナミ" = "私が直接、話を聞きます。"
"10059040-67-カノン" = "仰せのままに。"
"10059040-73-牛乳流通業者" = "これはこれは、評議会長！いかがされましたかな？"
"10059040-74-マナミ" = "ごきげんよう。"
"10059040-75-マナミ" = "突然のご連絡で恐縮ですが、少々確認したいことがありまして。"
"10059040-76-マナミ" = "御社の流通経路を一通り確認させていただきたいのです。#nよろしいでしょうか？"
"10059040-77-牛乳流通業者" = "はい？また唐突な話ですね。"
"10059040-78-牛乳流通業者" = "まあ別に構いませんが……いつ頃をお考えで？"
"10059040-79-マナミ" = "今すぐです。"
"10059040-80-牛乳流通業者" = "今すぐ！？"
"10059040-81-マナミ" = "何か不都合でも？"
"10059040-82-牛乳流通業者" = "い、いえ！すぐに伺ってご案内いたします！"
"10059040-87" = "[ns] \"向こうの対応、ずいぶん早いね？\""
"10059040-88-マナミ" = "こちらの機嫌を損ねたくはないのでしょう。#n我が学院の物流を任されるのは生中なことではありませんから。"
"10059040-89-マナミ" = "犯罪に関与しているかどうかは、また別の話ですが。"
"10059040-90-マナミ" = "鬼が出るか蛇が出るか……迎えが着き次第、流通経路を見せてもらいましょう。"
"10059040-92" = "（ほどなくして流通業者が到着し、共に関連施設を確認して回った）"
"10059040-94-牛乳流通業者" = "弊社の乳製品は品質には自信がありますが、反面、日持ちはあまりしません。"
"10059040-95-牛乳流通業者" = "そのため、迅速かつ安定した輸送手段が必要でした。"
"10059040-96-牛乳流通業者" = "そこで選んだのが、ハイランダー鉄道学園との協業です。"
"10059040-97-牛乳流通業者" = "キヴォトス全域に広がる鉄道網のおかげで、理想的な配達を実現しています。"
"10059040-98-牛乳流通業者" = "すべての輸送はハイランダーの協力のもとで行われており、#n関係者以外が途中で介入することはできません。"
"10059040-99-牛乳流通業者" = "つまり部外者が紛れ込む余地はない、ということです。"
"10059040-107-牛乳流通業者" = "こちらが、弊社の物流を一元管理しているコントロールルームです。"
"10059040-108-牛乳流通業者" = "カメラが24時間態勢で列車を監視し、異常があればすぐに察知できます。"
"10059040-109-牛乳流通業者" = "また、映像はサーバーに自動でバックアップされ、1年間保存されます。"
"10059040-110-牛乳流通業者" = "確認を希望されている直近2ヶ月分も、すべて残っていますよ。"
"10059040-111-牛乳流通業者" = "ご希望でしたら、今すぐ一緒に確認いたしましょう。"
"10059040-117-牛乳流通業者" = "こちらは帳簿の保管庫です。#n設備としては銀行の秘密金庫にも引けを取らないでしょう。"
"10059040-118-牛乳流通業者" = "警備員が24時間、必ず二人一組で常駐し、出入りも厳重に管理しています。"
"10059040-119-牛乳流通業者" = "もっとも、私が同行していれば中への出入りは自由です。"
"10059040-120-牛乳流通業者" = "さあ、ご覧になりたいのはいつの帳簿でしょうか？#nすべて、包み隠さずお見せしますよ。"
"10059040-125" = "（その後も施設を見て回ったが、これといった異常は見つからなかった）"
"10059040-127-牛乳流通業者" = "どうやらご理解を得られたようで何よりです。"
"10059040-128-牛乳流通業者" = "それでは、どうぞお気をつけてお帰りください。"
"10059040-132-マナミ" = "業者の言う通り、たしかに管理は徹底されていましたね。"
"10059040-133-マナミ" = "……不自然なほどに。"
"10059040-134" = "[s] \"完璧すぎて、逆に怪しいってこと？\""
"10059040-135-マナミ" = "ええ。嘘は真実の中に隠してこそ力を発揮するもの。"
"10059040-136-カノン" = "解釈するのであれば……これは一般論の話です。#nマナミ様が日頃からそうしているという意味ではありません。"
"10059040-137-マナミ" = "なんにせよ、牛乳の取引記録を銀行の金庫にも劣らない設備で守っている……#nどう考えても過剰です。"
"10059040-138-マナミ" = "業者に案内された場所だけを見て、すべてを知った気になるのは早計でしょうね。"
"10059040-139-マナミ" = "……どれほど管理が行き届いていても、現場の隅々にまで目が届くとは限らない。"
"10059040-140-マナミ" = "どんな些細な噂でも構いません。#n少しでも引っかかるものはすべて拾っていきましょう。"
"10059040-141-カノン" = "でしたら、手分けした方が効率的ですね。"
"10059040-142-カノン" = "調べる範囲が広くなるでしょうから。"
"10059040-143-ウララ" = "あ、あの……では、支え合う一対の鳥のように……二人一組で動きませんか？"
"10059040-144-ウララ" = "先生は……どなたと一緒なら動きやすいでしょうか？"
"10059040-145-カノン" = "おや。控えめなウララ様にしては踏み込んだ質問ですね。"
"10059040-146-カノン" = "私たち3人のうち、誰を選ぶのか――ということですか。"
"10059040-147-ウララ" = "えぇっ！？そっ、そういう意味に聞こえてしまいましたか！？"
"10059040-148-ウララ" = "す、すみません、そんなつもりではなくて……！#nわたくしはマナミ様のご判断に従います！"
"10059040-149-マナミ" = "ふむ……。"
"10059040-150-マナミ" = "シャーレの代表である先生と行動を共にするのであれば、#n学院の代表である私がご一緒するのが自然でしょう。"
"10059040-151-マナミ" = "ですが、今回はウララ副会長にお任せします。"
"10059040-152-マナミ" = "カノン書記官は、何を言っても私について来るでしょうから……。"
"10059040-153-カノン" = "当然です。マナミ様の歩みを記録することは、書記官である私の務めですから。"
"10059040-154-カノン" = "ましてや今回のような重要な調査であれば、なおさらです。"
"10059040-155-カノン" = "美しい記憶を、失われない形で後世へ送り届けること。#nそれこそが、私にとって至上の喜びなのですから。"
"10059040-156-カノン" = "マナミ様。天と地が我々を分かつその時まで――#nいいえ。たとえ天地に歯向かうことになろうとも、どこまでもお供します。"
"10059040-157" = "[s] \"……マナミも大変なんだね。\""
"10059040-158-マナミ" = "ふふっ、もう慣れたものですよ。"
"10059040-159-マナミ" = "カノン書記官も、悪気があってのことではありませんから。"
"10059040-160-マナミ" = "理由はどうあれ、私はカノン書記官と行動します。"
"10059040-161-マナミ" = "ですので先生。ウララ副会長をよろしくお願いいたします。"
"10059040-162-マナミ" = "私も信頼を置く優秀な副会長です。#nきっと先生の力になってくれるでしょう。"
"10059040-166-カノン" = "解説します――"
"10059040-167-カノン" = "私の大事なウララ副会長に妙な真似をしたらただじゃおかない。という意味です。"
"10059040-171" = "[ns] \"言われなくても分かってるよ！\""
"10059040-172-マナミ" = "それなら安心ですね。"
"10059040-173-マナミ" = "では、情報収集を始めましょう。#n互いの報告は、明日の午前、評議会室で。"
"10059040-181-ウララ" = "あはは……申し訳ありません。#nわたくしたちのせいで、ずいぶん気を遣わせてしまっていますよね？"
"10059040-182" = "[s] \"そんなことないよ。むしろ、力になれて嬉しいかな。\""
"10059040-183-ウララ" = "ふふ……マナミ様もカノン様も、悪戯がお好きな方ですから……。"
"10059040-184-ウララ" = "困った時は、どうぞ遠慮なくわたくしに仰ってくださいね。"
"10059040-185-ウララ" = "こう見えても副会長ですから……。#n先生の進む先にある夜露を払う程度のことはできますので……。"
"10059040-186" = "[s1] \"お気持ちだけもらっておくね。\"\n[s2] \"ウララには十分気にかけてもらってるし。\""
"10059040-189-ウララ" = "そ、そうですか……。"
"10059040-190-ウララ" = "そんなふうに言っていただけるなんて……とても嬉しいです。"
"10059040-191" = "[s] （なんだか……心まで癒やされる香りがする……）"
"10059040-192-ウララ" = "……あっ、いけません。こうしている場合ではありませんね。"
"10059040-193-ウララ" = "さっそく調査を始めましょう。"
"10059040-194-ウララ" = "お二人に負けないくらい、たくさん情報を集めるのです！"
"10059040-199" = "（その後、どこか浮き立って見えるウララと共に、列車の路線を回ってみた）"
"10059040-213" = "（いくつもの噂を耳にしたが、その多くはこれといって意味のない話だった）"
"10059040-214" = "（――最後に聞いた噂を除いては）"
"10059040-216" = "牧場近くの駅"
"10059040-217-運転士の生徒" = "はい？牛乳の流通業者ですか……？"
"10059040-221-運転士の生徒" = "うーん、あの噂、本当なのかな……。"
"10059040-222-ウララ" = "どのような噂でしょうか？"
"10059040-223-運転士の生徒" = "いえ……本当に、ただの噂なんですけどね？"
"10059040-224-運転士の生徒" = "プレミアムミルクを納品している業者についての話で――"
"10059040-225-運転士の生徒" = "有名な囚人と繋がっているらしい、と……。"
"10059040-229-ウララ" = "まさか……七囚人の誰か、ですか？"
"10059040-230-運転士の生徒" = "そうらしいです。"
"10059040-231-運転士の生徒" = "えっと、たしか……こんな呼び名だったと思います。"
"10059040-235" = "[log=하이랜더 기관사]拝金のブローカー[/log]"
"10059040-238" = "[ns] \"拝金の……ブローカー？\""
"10059040-241-ウララ" = "かなり……危険な香りがしてきましたね。"
