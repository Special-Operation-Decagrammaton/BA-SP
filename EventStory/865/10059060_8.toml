[translation]
"10059060-1" = "第6話;学院に潜む怪盗"
"10059060-2-ミリア" = "そのご様子では……またあの高圧的な評議会長に無理を言われたのですね？"
"10059060-3-ウララ" = "ま、まさか。無理を言われただなんて、そんな。"
"10059060-4-ウララ" = "……苦しい状況なのは、確かですけれど。"
"10059060-5-ウララ" = "この状況が続けば、わたくしだけでなく、ミリア様にも危険が及びます。"
"10059060-6-ウララ" = "マナミ様が最も憎んでいるあなたを……#nよりによってわたくしが匿っていたのですから。"
"10059060-7-ウララ" = "きっと退学程度では済まされないでしょうね。"
"10059060-8-ミリア" = "この機会に、マナミさんにはステージを下りていただくというのはいかがでしょう？#n評議会長の役を降板させるのです。"
"10059060-9-ミリア" = "積み重なった不満を利用すれば、決して不可能ではないと思いますし――"
"10059060-10-ミリア" = "あなたには、自ら率いる「バラ園」もあるのでしょう？#nその気になれば、十分に成し遂げられるはずです。"
"10059060-11-ウララ" = "それは……できません。"
"10059060-12-ウララ" = "わたくしは嘘偽りなく、あの方を敬愛しています。"
"10059060-13-ウララ" = "「あの出来事」を経験しながら、それでも評議会長の座にまで辿り着いた。"
"10059060-14-ウララ" = "もしも同じ状況に置かれたとき……わたくしには到底真似できません。"
"10059060-15-ミリア" = "……たしかに。その点については評価に値します。"
"10059060-16-ウララ" = "わたくし達とマナミ様の価値観が異なることは理解しています。"
"10059060-17-ウララ" = "ですが、今は内輪で争っている場合ではありません。#n手を取り合い、共通の敵に立ち向かうべきです。"
"10059060-18-ウララ" = "芸術を金儲けの道具としか見ないクズに……#n好き勝手に利用されるわけにはいきませんから。"
"10059060-19-ミリア" = "あなたの口から、そんなにも荒っぽい言葉が出るとは。"
"10059060-20-ミリア" = "いえ、それだけ看過できない問題だということですね。"
"10059060-24-ミリア" = "そしてそれは、私も同感です。#nこの件を黙って見過ごすつもりはありません。"
"10059060-25-ミリア" = "相手が七囚人ともあれば、なおさらです。"
"10059060-26-ウララ" = "黒幕を……ご存じなのですね？"
"10059060-27-ミリア" = "私も私なりに、情報を集めていましたから。"
"10059060-28-ミリア" = "おそらく、今回の事件を裏で糸引く者は「拝金のブローカー」。"
"10059060-29-ミリア" = "牛乳の流通を隠れ蓑にして、#nブラックマーケットで様々な違法事業を取り仕切っている七囚人です。"
"10059060-30-ウララ" = "そこまでご存じでしたら……接触する手立てをお持ちなのでは？"
"10059060-31-ミリア" = "残念ながら。#n七囚人だからといって、互いのことをよく知っているわけではありません。"
"10059060-32-ミリア" = "ですが、ブローカーと繋がりのある人物なら、心当たりがあります。"
"10059060-33-ミリア" = "七囚人同士が争うような事態を、最も嫌う方。"
"10059060-34-ミリア" = "その方を頼れば、この騒ぎを収める糸口くらいは見つかるかも。"
"10059060-35-ウララ" = "……裏の世界に顔が利く方のようですね。"
"10059060-36-ウララ" = "では、そちらはお任せします。"
"10059060-40-ウララ" = "ああ、そうそう。これだけは忘れないでください。"
"10059060-41-ウララ" = "あなたが正体を隠したまま、こうして学院生活を続けられているのは――#nすべてわたくしのおかげだということを。"
"10059060-42-ウララ" = "ふふ……これでは弱みを握って利用しているみたいですね。"
"10059060-43-ウララ" = "申し訳ありません。決してそんなつもりで言ったわけではないのですが……。"
"10059060-44-ミリア" = "ええ、分かっています。あなたの善意には、いつも感謝していますから。"
"10059060-45-ウララ" = "うぅ……そう言っていただけると、救われます。"
"10059060-46-ウララ" = "では、あとのことはよろしくお願いいたします。わたくしはこれで……。"
"10059060-52-ミリア" = "……あれほど柔らかな方なのに、付け入る隙はまるでない。"
"10059060-53-ミリア" = "やはり、美しいバラには棘があるものなのでしょうか。"
"10059060-55" = "翌日――"
"10059060-62-寮監隊員A" = "おや、ミリア様。お出かけですか？"
"10059060-63-ミリア" = "ええ。#nこのような状況ではありますが、外部の調査も疎かにするわけにはいきませんから。"
"10059060-64-ミリア" = "なにか、事件に関する情報を拾えれば良いのですが。"
"10059060-65-寮監隊員B" = "内部であれだけ大掛かりな検査をしたのに何も出ませんでしたからね。"
"10059060-66-寮監隊員A" = "良い成果を祈ってます！学院の未来がかかってますから！"
"10059060-67-ミリア" = "お二人も、それぞれの持ち場で最善を尽くしてください。"
"10059060-69-ミリア" = "（私に学院の未来がかかっているだなんて。滑稽な話です）"
"10059060-71" = "繁華街のとある事務所"
"10059060-74-ミリア" = "私です。"
"10059060-75-？？？" = "どうぞ、お入りください。"
"10059060-81-ミリア" = "突然のご無礼、お許しください。"
"10059060-85-ニヤニヤ教授" = "お気になさらず。思えば、顔を合わせるのも久しぶりですから。"
"10059060-86-ニヤニヤ教授" = "こちらへどうぞ。美味しいお茶やお菓子を用意してありますよ。"
"10059060-91-ミリア" = "それにしても驚きました。#nあなたの仕事場が、まさかこんな繁華街にあるとは。"
"10059060-92-ニヤニヤ教授" = "木を隠すなら森の中、と言うでしょう？"
"10059060-93-ニヤニヤ教授" = "あなたがワイルドハントに身を潜めているのと同じですよ。"
"10059060-94-ニヤニヤ教授" = "それで、学院生活はいかがです？何か不自由はありませんか？"
"10059060-95-ミリア" = "折しも、学院生活についてお話があるのです。"
"10059060-96-ミリア" = "近頃のワイルドハントは大事件の渦中にありまして。"
"10059060-97-ミリア" = "何者かが生徒の作品を[ruby=マネーロンダリング]資金洗浄[/ruby]に利用しているのです。"
"10059060-98-ミリア" = "ワイルドハントの生徒としても、慈愛の怪盗としても……#n到底、見過ごすことはできません。"
"10059060-99-ニヤニヤ教授" = "ほむ。"
"10059060-100-ニヤニヤ教授" = "新しい商売を始める、とブローカーが言っていましたね……。"
"10059060-101-ミリア" = "目的をご存じなら、ご説明いただけますか？"
"10059060-102-ニヤニヤ教授" = "まずは、あなたを不快な目に遭わせてしまったことをお詫びします。"
"10059060-103-ニヤニヤ教授" = "私がもう少し気を配っておくべきでした。"
"10059060-104-ニヤニヤ教授" = "ブローカーも、あなたがワイルドハントにいるとは知らずに進めたのでしょう。"
"10059060-105-ニヤニヤ教授" = "[ruby=・]ミ[/ruby][ruby=・]リ[/ruby][ruby=・]ア[/ruby]の正体を知っている者は2人しかいませんから。"
"10059060-106-ニヤニヤ教授" = "私と――ワイルドハント芸術評議会の副会長さん。"
"10059060-107-ミリア" = "……そこに、[USERNAME]先生も加えてください。"
"10059060-108-ニヤニヤ教授" = "ほむ。それはまた……。#nどうして見抜かれたんです？"
"10059060-109-ミリア" = "顔を合わせた瞬間に。"
"10059060-110-ニヤニヤ教授" = "やはり、侮れない方ですね。"
"10059060-111-ニヤニヤ教授" = "まあ、あの方とあなたの間にあった事を考えれば、#n正体を言いふらす真似はしないでしょう。"
"10059060-112-ニヤニヤ教授" = "せめてもの、不幸中の幸いですね。"
"10059060-113-ニヤニヤ教授" = "話を戻しましょう。"
"10059060-114-ニヤニヤ教授" = "このままでは、あなたとブローカーの対立は深まる一方です。"
"10059060-115-ミリア" = "すでに許容の範疇を越えておりますが。"
"10059060-116-ニヤニヤ教授" = "……手が付けられなくなる前に、私が間に入るしかなさそうですね。"
"10059060-117-ニヤニヤ教授" = "とはいえ、伝え方が難しいですね。#nあなたのことをブローカーに話すわけにもいきませんし。"
"10059060-118-ニヤニヤ教授" = "下手をすれば、秘密を知る者がまた1人増えてしまいますから。"
"10059060-119-ニヤニヤ教授" = "かといって商売をやめさせるほどの理由付けには、いささか口実が弱い……。"
"10059060-120-ニヤニヤ教授" = "ほむ……何かないものでしょうか。"
"10059060-124-ニヤニヤ教授" = "……ああ。"
"10059060-125-ニヤニヤ教授" = "[USERNAME]先生は評議会に協力しているのでしたね？"
"10059060-126-ミリア" = "ええ。積極的に。"
"10059060-127-ニヤニヤ教授" = "なるほど。"
"10059060-128-ニヤニヤ教授" = "それなら、うまく調整できるかもしれません。"
"10059060-129-ニヤニヤ教授" = "さっそく連絡してみましょう。"
"10059060-137-拝金のブローカー" = "アンタか。"
"10059060-138-ニヤニヤ教授" = "お久しぶりです。お元気でしたか？"
"10059060-139-拝金のブローカー" = "前置きはいい。用件は？"
"10059060-140-拝金のブローカー" = "時は金なり、だろ？"
"10059060-141-ニヤニヤ教授" = "お変わりないようで安心しました。"
"10059060-142-ニヤニヤ教授" = "実は、あなたが最近始めた商売について少しお話がありまして。"
"10059060-143-ニヤニヤ教授" = "ちょっとした伝手から、気になる話を耳にしたんです。"
"10059060-144-拝金のブローカー" = "私を嗅ぎ回ってる奴がいるらしいけど、それの話？"
"10059060-145-ニヤニヤ教授" = "シャーレが、ワイルドハントの芸術評議会に肩入れしているそうです。"
"10059060-146-ニヤニヤ教授" = "[USERNAME]先生はご存じでしょう？"
"10059060-147-拝金のブローカー" = "ああ、あの偽善者。"
"10059060-148-拝金のブローカー" = "なんだ、あいつだったんだ。"
"10059060-152-拝金のブローカー" = "どうせいつかはぶつかると思ってたけど。"
"10059060-153-拝金のブローカー" = "片づける良い機会か。"
"10059060-154-ニヤニヤ教授" = "ほむ。相変わらず好戦的ですね。"
"10059060-155-ニヤニヤ教授" = "できれば、今はまだ先生との衝突は避けていただきたいのですよ。"
"10059060-156-ニヤニヤ教授" = "私たちの大義のためにも、ここで悪目立ちするのは得策ではありませんから。"
"10059060-157-拝金のブローカー" = "だから？今回の商売から手を引けって？"
"10059060-158-拝金のブローカー" = "舐めてんの？"
"10059060-159-拝金のブローカー" = "私の領分に余計な口出しはするな、って言ったはずだけど。"
"10059060-160-拝金のブローカー" = "アンタもミルクタンクに詰めて沈めてあげよっか？"
"10059060-161-ニヤニヤ教授" = "手を引けと言っているわけではありませんよ。#n大義のために慎重に動こう、と言っているだけです。"
"10059060-162-ニヤニヤ教授" = "私が準備している「アレ」、あなたも楽しみにしているでしょう？"
"10059060-163-拝金のブローカー" = "……チッ。"
"10059060-164-拝金のブローカー" = "まあ……。"
"10059060-165-拝金のブローカー" = "アンタの言う通り、シャーレが噛んでるなら面倒ではある。"
"10059060-166-拝金のブローカー" = "余計な金まで飛びそうだし……。"
"10059060-167-拝金のブローカー" = "……クソッ。"
"10059060-172-拝金のブローカー" = "いいよ。アンタの顔を立てて、やり方を変えてやる。"
"10059060-173-拝金のブローカー" = "ぐずぐず時間をかけず、一気にケリをつける方法で。"
"10059060-174-拝金のブローカー" = "場所と時間を送るから、「伝手」とやらに回して。"
"10059060-175-拝金のブローカー" = "私が直接、話をつける。"
"10059060-176-ニヤニヤ教授" = "実にあなたらしいやり方ですね。"
"10059060-177-拝金のブローカー" = "言っとくけど――"
"10059060-178-拝金のブローカー" = "余計な真似したらただじゃおかないから。"
"10059060-179-拝金のブローカー" = "アンタも、先生も。"
"10059060-180-ニヤニヤ教授" = "……ええ。肝に銘じておきます。"
"10059060-184-ニヤニヤ教授" = "さて、これで舞台は整いました。"
"10059060-185-ニヤニヤ教授" = "あとは……先生と評議会の交渉力次第、といったところでしょうか？"
"10059060-189-ミリア" = "いいえ。"
"10059060-190-ミリア" = "これは芸術に携わる私たちの矜持です。"
