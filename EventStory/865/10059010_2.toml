[translation]
"10059010-1" = "第1話;芸術評議会からの招待"
"10059010-2" = "[ns] \"つまり……ワイルドハントの生徒会長？\""
"10059010-3-マナミ" = "ええ、その通りです。"
"10059010-4-マナミ" = "忘れもしない[ruby=・]あ[/ruby][ruby=・]の[/ruby][ruby=・]日[/ruby]から、こうしてお会いできる日を待ち望んでおりました。"
"10059010-5-カノン" = "学院を騒がせた元凶を前にしたら、どんな気持ちが湧き上がるのか……#nとマナミ様が仰っていたことは秘密です。"
"10059010-6-マナミ" = "ふふっ、魔法陣事件は……ええ。"
"10059010-7-マナミ" = "たいへん印象深かったですよ？"
"10059010-8" = "[s] \"その節は迷惑をかけたね。\""
"10059010-9-眼帯の少女" = "ご心配なく。マナミ様は寛大なお方ですので。"
"10059010-10-マナミ" = "ご紹介の途中でしたね。#n先ほどから補足を入れてくれているこちらは、[ruby=くおんじ]久遠寺[/ruby]カノン。"
"10059010-11-マナミ" = "芸術評議会のすべてを記録する書記官です。"
"10059010-12-カノン" = "はい。私はすべてを記録します。"
"10059010-13-カノン" = "今この出会いも、先生が私たちを見て瞬きをした回数まで記録する予定です。"
"10059010-14" = "[s] \"えっ、そんなことまで？\""
"10059010-15-カノン" = "あらゆることを詳細に記録する。それが私の特技です。#nそして、可能たらしめている特殊能力こそ――"
"10059010-16-カノン" = "「記憶の湖」です。"
"10059010-17-カノン" = "記憶の湖――それは眼帯の奥に眠る、森羅万象の[ruby=レコード]記録[/ruby]。"
"10059010-18-カノン" = "私だけが足を浸すことを許された、境界の向こう側の心象です。"
"10059010-22" = "[ns1] \"…………。\"\n[ns2] （今日はいつも以上に気を引き締めよう……）"
"10059010-28-マナミ" = "おや、話が長くなってしまいましたね。そろそろ公演が始まるようです。"
"10059010-29-マナミ" = "歓談はここまでにいたしましょう。#n公演中に私語を交わすのはマナー違反ですから。"
"10059010-30-マナミ" = "それでは、どうぞ楽しいご鑑賞を。"
"10059010-33" = "（そうしてマナミ、カノンと共にバレエのガラコンサートを鑑賞した）"
"10059010-34" = "（ティアラをつけた美しいバレリーナたちの幻想的な舞踊と、#n甘美な音楽が調和した――）"
"10059010-35" = "（まさに、夢と幻想の舞台だった）"
"10059010-43-マナミ" = "ふふっ、ガラコンサートという形式は実に見事ですね。"
"10059010-44-マナミ" = "いわば舞台の上で催される祝祭。"
"10059010-45-マナミ" = "いくつもの作品から、最も輝かしい瞬間を集め、観客を魅了する夢の舞台。"
"10059010-46-マナミ" = "もちろん通常公演にも、物語の全容を味わえるという美しさがありますけれどね。"
"10059010-47-マナミ" = "……では、ここで質問です。"
"10059010-48-マナミ" = "先生は通常公演とガラコンサート、どちらがお好みでしょうか？"
"10059010-49" = "[s3] \"物語を最後まで楽しめる通常公演かな。\"\n[s4] \"見どころを幅広く楽しめるガラコンサートかな。\""
"10059010-52-カノン" = "ふむ、なるほど。"
"10059010-53-カノン" = "マナミ様。これで先生の嗜好を把握できました。"
"10059010-57" = "[ns] \"何か間違った答えだったりする……？\""
"10059010-58-マナミ" = "まさか。"
"10059010-59-マナミ" = "どちらを選んだかに大きな意味はないのです。"
"10059010-60-マナミ" = "なぜなら、見える景色は人の数だけ異なります。芸術に正解はありませんので。"
"10059010-61" = "[s] \"そっか……マナミはどっちが好きなの？\""
"10059010-62-マナミ" = "そうですね……どちらかといえば通常公演かもしれません。"
"10059010-63-マナミ" = "始まりから終わりまで。美しい踊りで物語を追えるところが好きなのです。"
"10059010-64-マナミ" = "なかでも「しっかり者のスズの兵隊」という作品は特に気に入っています。"
"10059010-65-マナミ" = "原典は、一本足のおもちゃの兵隊とバレリーナ人形を描いた悲しい物語。"
"10059010-66-マナミ" = "ですが以前、ハッピーエンドに脚色して上演されたことがありまして。"
"10059010-67-マナミ" = "悲劇を喜劇へと反転させる構成が、美しい踊りと相まって実に魅力的だ、と。#n評論家からも評価されています。"
"10059010-68" = "[s] \"それは私も見てみたいな。\""
"10059010-69-カノン" = "マナミ様。その作品は――"
"10059010-70-マナミ" = "ええ。分かっています。"
"10059010-74-マナミ" = "残念ながら、劇場で見ることは当分難しいでしょう。"
"10059010-75-マナミ" = "作品の構想と主演を担っていたバレリーナが、足首の怪我で引退してしまったので。"
"10059010-76-マナミ" = "……皮肉なものです。#n一本足の兵隊を描いた物語で、そのような怪我を負うだなんて。"
"10059010-77-マナミ" = "以来、彼女以外に踊りこなせる者がおらず、公演は事実上休止しています。"
"10059010-78" = "[s] \"それは……すごく残念だね。\""
"10059010-82-マナミ" = "……ええ。"
"10059010-83-マナミ" = "この世に永遠などありません。"
"10059010-84-マナミ" = "夜空に輝く星でさえ、いつかは光を失うもの……。"
"10059010-89-マナミ" = "だからこそ私は、[ruby=・]輝[/ruby][ruby=・]け[/ruby][ruby=・]る[/ruby][ruby=・]一[/ruby][ruby=・]瞬[/ruby]を博物館に保管しているのです。"
"10059010-90-マナミ" = "「しっかり者のスズの兵隊」も、最後の公演を収めた映像を収蔵しています。"
"10059010-91-マナミ" = "ぜひいつか、ご一緒に鑑賞いたしましょう。"
"10059010-92-マナミ" = "その機会があれば、ですが。"
"10059010-93" = "[s] （簡単には見せてくれなさそうだ……）"
"10059010-94-マナミ" = "ふふっ、こうして外部の方と語らうのも久しぶりです。"
"10059010-95-マナミ" = "おかげで楽しい時間を過ごせました。"
"10059010-96-カノン" = "解釈は……必要ありませんね。これは、本当に楽しかったという意味です。#n誤解なさらぬよう。"
"10059010-97-マナミ" = "ええ。これなら、先生への警戒を幾分か下げても大丈夫そうですね。"
"10059010-98" = "[s] \"やっぱり警戒してたんだ……。\""
"10059010-99-マナミ" = "学院をあれほど賑わせた方を簡単に信じるわけにはいきませんから。#n……とはいえ、わずかばかりの点数は加算されました。"
"10059010-100-マナミ" = "そこで、さらなる加点を獲得できる機会を差し上げようと思うのですが……#nいかがでしょう。"
"10059010-101-マナミ" = "名誉挽回の機会――欲しくはありませんか？"
"10059010-102" = "[s] \"何なりとお申し付けください……！\""
"10059010-103-マナミ" = "前向きな姿勢は嫌いではありませんよ。"
"10059010-104-マナミ" = "では、カノン書記官。用意していたものを。"
"10059010-109" = "[ns] \"これは……招待状？\""
"10059010-110-マナミ" = "はい。評議会長の名においてお渡しする、正式な招待状です。"
"10059010-111" = "[s5] \"これを用意してたってことは――\"\n[s6] \"私がここに来るって知ってたってこと？\""
"10059010-114-マナミ" = "ふふっ。私はただ、今日の公演を楽しみに来ただけです。"
"10059010-115-マナミ" = "招待状は、万一に備えて常に持ち歩いております。"
"10059010-116-カノン" = "せっかく上げた点数を、これでまた失いましたね。残念です。"
"10059010-117" = "[s] \"うぐっ……！\""
"10059010-118-マナミ" = "なんにせよ、招待状はお渡ししました。#n続きは公式の場でお話しいたしましょう。"
"10059010-119-マナミ" = "きっと、感覚を共有する楽しい時間になるはずです。"
"10059010-121" = "（どんな話をされるのだろうか――）"
"10059010-122" = "（一抹の不安を抱えながら迎えた翌日）"
"10059010-127-怖そうな寮監隊員" = "……。"
"10059010-128-투명" = "（凄まじい威圧感を放つ生徒が、正門の前に立っていた）"
"10059010-129-怖そうな寮監隊員" = "あれ？外部の人？どうしたの？"
"10059010-130" = "[s] \"シャーレの[USERNAME]だけど……。\""
"10059010-131-怖そうな寮監隊員" = "ああ、あなたが。"
"10059010-132-怖そうな寮監隊員" = "……なんだか緊張した顔をしてるね。"
"10059010-133-怖そうな寮監隊員" = "寮監隊の幹部に会うのは初めて？"
"10059010-134" = "[s] \"ミリアには会ったことあるかな。\""
"10059010-135-怖そうな寮監隊員" = "ミリア。可愛かったでしょう。"
"10059010-136-怖そうな寮監隊員" = "とても優秀な隊員だよ。"
"10059010-137-サヨ" = "あ、人の話ばっかり。私は[ruby=こしろ]小城[/ruby]サヨ。"
"10059010-138-サヨ" = "ワイルドハントの寮監隊長よ。"
"10059010-139" = "[s] （ただ者じゃない雰囲気だと思った……！！）"
"10059010-140-サヨ" = "今日は評議会から、先生をお迎えするように言われてるんだ。"
"10059010-141-サヨ" = "魔法陣事件のことも報告を受けてるよ。"
"10059010-142-サヨ" = "不在にしてたけど、あの時に会えてたらもっとよかったのにね。"
"10059010-143-サヨ" = "反省室でゆっくり[ruby=・]お[/ruby][ruby=・]話[/ruby][ruby=・]し[/ruby]するの、すごく好きだから。"
"10059010-144" = "[s] \"そ、そうなんだ……。\""
"10059010-145-サヨ" = "ひとまず持ち物検査は省略するね。"
"10059010-146-サヨ" = "正式に招待されたお客様が、怪しいものを持ち込むはずないもの。"
"10059010-147-サヨ" = "そうでしょう？"
"10059010-148" = "[s] \"もちろん！\""
"10059010-149-サヨ" = "まあ、どっちでもいいんだけどね。"
"10059010-150-サヨ" = "持ち込んでたなら、あの時できなかったお話をする良い機会だし。"
"10059010-151" = "[s] \"何も持ってないから安心して！\""
"10059010-152-サヨ" = "うん。信じるね。"
"10059010-153-サヨ" = "じゃあ、こっち。みんな待ってるから。"
"10059010-159-サヨ" = "評議会は本館にあるんだ。"
"10059010-160-サヨ" = "先生はここに入るの、初めてかな？"
"10059010-161-サヨ" = "緊張しなくていいよ。"
"10059010-162-サヨ" = "悪いことしたら、私に叱られちゃうけど……先生は良い子でしょ？"
"10059010-163" = "[s] \"も、もちろん！\""
"10059010-168-サヨ" = "評議会長。先生を連れてきたよ。"
"10059010-169-マナミ" = "ご苦労様です。どうぞ、お入りください。"
"10059010-173-サヨ" = "だって。入っていいってさ。"
"10059010-178" = "[ns] \"おお……。\""
"10059010-179-マナミ" = "お待ちしておりました、先生。"
"10059010-180-マナミ" = "芸術評議会――ワイルドハントの中枢へようこそ。"
"10059010-181-カノン" = "ご覧なさい。壁面に掲げられしは、この場に相応しき学院の代表作――"
"10059010-182-カノン" = "「創世の影像」の原本です。"
"10059010-183-マナミ" = "この作品を背負うということは、学院のすべてを背負うということ。"
"10059010-184-マナミ" = "私たち評議会は、重責を胸に学院を運営しているのです。"
"10059010-185-マナミ" = "では、その担い手である役員をご紹介いたしましょう。"
"10059010-186-マナミ" = "まずは、私の左にいるカノン書記官。"
"10059010-189-カノン" = "ごきげんよう。昨日ぶりですね。"
"10059010-190-カノン" = "先生が今日こそは、マナミ様から高得点を獲得できるよう祈っております。"
"10059010-193-ウララ" = "ふふ……もう、カノン様ったら……。"
"10059010-194-ウララ" = "ごきげんよう。わたくしは[ruby=うんりんいん]雲林院[/ruby]ウララ。#n評議会の副会長を務めております。"
"10059010-195-ウララ" = "この逢瀬が、芳しく咲く花のように……美しく記憶に残ることを願っています。"
"10059010-199" = "[ns] \"あれ……バラの香りが……？\""
"10059010-200-ウララ" = "ふふ……わたくしに香りが残っていたようです。#n日頃、バラ園の面倒を見ておりまして。"
"10059010-201-ウララ" = "……こほん。先生、お会いできて嬉しいです。評議会へようこそ。"
"10059010-202" = "[s] \"よろしくね。\""
"10059010-205-マナミ" = "さて先生。お越しいただきありがとうございます。"
"10059010-206-マナミ" = "ささやかながら、おもてなしをさせていただければと。"
"10059010-207-マナミ" = "ウララ副会長。"
"10059010-212-ウララ" = "先生はご存じでしょうか？"
"10059010-213-ウララ" = "最近流行しているプレミアムミルクです。"
"10059010-214-ウララ" = "味もさることながら健康にも良いと評判でして。#nお口に合うといいのですが……。"
"10059010-219" = "[ns7] （ウララからマイナスイオンが出てる気がする……）\n[ns8] \"ありがとう。いただくね。\""
"10059010-227" = "[ns] \"美味しい……シャーレにも置こうかな。\""
"10059010-229-マナミ" = "ウララ副会長は私を支えながら、学院運営の多岐にわたる務めを果たしています。"
"10059010-230-マナミ" = "本日のおもてなしも、ウララ副会長がご用意したものです。#nどうぞ気兼ねなくお召し上がりください。"
"10059010-234-カノン" = "解説します……私が大切にしている副会長の厚意です。#n残そうものなら大幅減点ですよ。という意味です。"
"10059010-238-ウララ" = "い、いえ……そんな。"
"10059010-239-ウララ" = "その時は、わたくしが先生の好みを汲み取れなかったということですから……。"
"10059010-240" = "[s9] \"ううん。すごく美味しいよ。\"\n[s10] \"ありがたくいただくね。\""
"10059010-243-ウララ" = "ふふ……わたくしの内に湧くこれはまるで、#n恵みの雨を喜ぶ草花のような心地でしょうか。"
"10059010-244-マナミ" = "挨拶も済んだところで、そろそろ本題に入りましょうか。"
"10059010-245-マナミ" = "まずは、先生をお呼びした理由から。"
"10059010-246-マナミ" = "近頃、学院内で不穏な勢力の活動が確認されています。"
"10059010-247-マナミ" = "生徒同士の問題であれば内部で対処したのですが、今回は少し様子が異なりまして。"
"10059010-248-マナミ" = "ワイルドハント芸術評議会はこの問題を解決するため、#nシャーレの先生へ正式に協力を要請します。"
"10059010-252-マナミ" = "学院に潜む闇を暴くべく、そのお力をお貸しください。"
