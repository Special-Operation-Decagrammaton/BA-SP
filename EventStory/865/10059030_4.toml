[translation]
"10059030-1" = "第3話;ブラックマーケット調査"
"10059030-2" = "（次の日）"
"10059030-8-サヨ" = "ここ……かな？"
"10059030-9-サヨ" = "書記官が言っていたブラックマーケットは。"
"10059030-10-ヒロミ" = "……隊長。#nブラックマーケットはこうも簡単に来られる場所なんですか？"
"10059030-11-ヒロミ" = "もっと人目につかない所に隠れているものだとばかり。"
"10059030-12-07" = "出入りしやすいから、いろんな人が集まるんだって。"
"10059030-13-サヨ" = "普通の生徒が、モモフレンズのグッズを探しに来るらしいよ。"
"10059030-14-サヨ" = "スケバンから身を守れるだけの力は持っているんだろうけど。"
"10059030-15-サヨ" = "それにしても……こんな場所を最初に作ったのは誰なんだろう。"
"10059030-16-サヨ" = "一度、ゆっくりお話してみたいな。"
"10059030-17-ヒロミ" = "それは私も気になりますね。無法地帯の元祖はどこの誰なんだか。"
"10059030-21-マナミ" = "ふふっ、皆さんやる気に満ちていて何よりです。"
"10059030-22-マナミ" = "さっそく調査を始めましょうか。"
"10059030-23-マナミ" = "可能な限り多くの芸術品を回収し、学院へ持ち帰るのです。"
"10059030-24-ウララ" = "り、寮監隊の皆さん……どうか、よろしくお願いします……。"
"10059030-25-カノン" = "当のウララ様には、あまり覇気を感じませんが……。"
"10059030-26-ウララ" = "こ、こういう場所はどうにも慣れなくて……。"
"10059030-27-マナミ" = "優しすぎるところはウララ副会長の長所であり短所ですね。#nもう少し自信をお持ちなさい。"
"10059030-28-カノン" = "ふむ……ウララ様。#nこう叫んでみるのはいかがでしょう。"
"10059030-32-カノン" = "貴様らァ！！全員まとめてかかってこい――っ！！"
"10059030-33-ウララ" = "えぇっ……！？"
"10059030-34-カノン" = "さあ、ウララ様も。#nマナミ様のお言葉通り、まずは自信を持つことですよ。"
"10059030-39-ウララ" = "き、ききき、きさまらぁ～！#nぜ、ぜぜ、全員まとめて……かかって……かかって、きて、ください……！"
"10059030-42-マナミ" = "ふふっ、その意気です。"
"10059030-48" = "[ns] \"みんな、向こうから誰か来るよ？\""
"10059030-51-スケバンA" = "何だ？ワイルドハントの優等生どもじゃねぇか。"
"10059030-52-スケバンB" = "おい、てめぇら！人のシマで何してやがる！？"
"10059030-53-スケバンC" = "目障りなんだよ、痛い目見る前にとっとと失せな……！！"
"10059030-54-マナミ" = "あら。初手から活きのいい獲物が餌にかかりましたね。"
"10059030-55-ウララ" = "わ、わたくしは餌だったのですか……！？"
"10059030-56-スケバンA" = "てめぇら……うちらを前にして、ふざけてんのか！？"
"10059030-57-スケバンB" = "舐めた真似したツケ、きっちり払わせてやる……！"
"10059030-58-マナミ" = "さて。代償を払うのはどちらでしょうね。"
"10059030-59-マナミ" = "サヨ寮監隊長。"
"10059030-64-サヨ" = "私の出番だね。"
"10059030-65-サヨ" = "準備はいい？"
"10059030-69-スケバンA" = "な、何だよ……？"
"10059030-70-スケバンB" = "こいつ、圧が急に――！"
"10059030-71-サヨ" = "それじゃあ……。"
"10059030-72-サヨ" = "みんなで楽しく「お話」しようか。"
