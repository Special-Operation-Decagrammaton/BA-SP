[translation]
"10059090-1" = "第9話;交渉決裂"
"10059090-5-組織員A" = "学院の武装組織と聞いて少しは期待したが……大したことねぇな。"
"10059090-6-組織員B" = "油断するな。お前の悪い癖だ。"
"10059090-7-組織員C" = "油断するな。お前の悪い癖だ。"
"10059090-8-組織員A" = "二人して同じこと言うな！"
"10059090-11-ヒロミ" = "あいつら……私たちを前にして、舐めた口を利いてくれるじゃないか……！"
"10059090-12-ミリア" = "以前、耳にしたことがあります。#nブローカーの直属の部下は、いずれも選りすぐりの精鋭だと。"
"10059090-13-ミリア" = "破格の報酬を受け取るほどの実力者ばかりを集めているそうです。"
"10059090-14-組織員A" = "なあ？私たちがどうして顔を隠してるか分かるか？"
"10059090-15-組織員A" = "全員、とんでもない懸賞金がかかってるんだ。#n裏に詳しけりゃ、顔を見ただけで分かるような猛者ばかり。"
"10059090-16-組織員B" = "そんな私たちに、実力相応の値をつけたのはボスだけだった。"
"10059090-17-組織員C" = "ボスのとこは誰でも入れるような組織じゃねぇんだ。#n言ってみれば裏社会の一流企業ってところかな。"
"10059090-18-組織員A" = "で、お前らの給料はどうなんだ？#nこっちの半分くらいは貰ってんのか？"
"10059090-19-ヒロミ" = "うるさい！金目当てで寮監隊にいるとは思わないことだ！"
"10059090-20-ミリア" = "……エスコートされたとあれば、こちらも、少し本気でお相手しましょうか。"
"10059090-21-サヨ" = "そうだね。手加減するのはもう十分かな。"
"10059090-29-ウララ" = "……寮監隊の方は思っていた以上に長引いていますね。"
"10059090-30-カノン" = "予測では、とうに決着がついているはずなのですが……。"
"10059090-31-カノン" = "どうやら、ただの雑兵ではないようです。"
"10059090-32-マナミ" = "……。"
"10059090-33-ブラックマーケット幹部" = "ふふふ、我々は一騎当千の猛者ばかり！"
"10059090-34-ブラックマーケット幹部" = "大規模学園の武装組織と互角に渡り合えるほどなのですよ。"
"10059090-35-ブラックマーケット幹部" = "強くなければ生き残れない。この世界は弱肉強食……！"
"10059090-36-ブラックマーケット幹部" = "皆様が歯向かっているのは、そんな精鋭を従える――我らがボス！#n勝ち目などありませんよ！"
"10059090-37-ブラックマーケット幹部" = "さあ、今ならまだ遅くありません。#n大人しくひれ伏して、こちらの条件を受け入れるというのなら――！"
"10059090-38-拝金のブローカー" = "邪魔。"
"10059090-43-ブラックマーケット幹部" = "くぁっ……！"
"10059090-48-拝金のブローカー" = "喋りすぎ。"
"10059090-49-拝金のブローカー" = "時は金なり、だからね。"
"10059090-50" = "[s] \"本当に、何でもお金で考えるんだね。\""
"10059090-51-拝金のブローカー" = "そうやって生きてきたから。"
"10059090-52" = "[s] \"この世には、お金じゃ解決できないこともあるよ。\""
"10059090-53-拝金のブローカー" = "……。"
"10059090-57-拝金のブローカー" = "だから？"
"10059090-58-拝金のブローカー" = "それ、今日聞いた中で、一番ムカつくんだけど。"
"10059090-59-拝金のブローカー" = "お礼に、すぐ楽にしてあげる。"
"10059090-60-拝金のブローカー" = "アンタたち、逃げ道を塞いで。"
"10059090-61-拝金のブローカー" = "私を怒らせた分、利子つけて払ってもらうよ。"
