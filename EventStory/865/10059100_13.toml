[translation]
"10059100-1" = "第10話;喜劇の舞台"
"10059100-2" = "（マナミの個人博物館を訪れた翌日）"
"10059100-6" = "（あそこで目にしたティアラが、どうしても頭から離れなかった）"
"10059100-7" = "（間違いなくあのティアラは――）"
"10059100-11" = "[ns1] \"収集とは、時を越える「感覚の芸術」……。\"\n[ns2] \"まさか……。\""
"10059100-15" = "（気になって、過去のバレエ公演について調べ始めた）"
"10059100-16" = "（すると……）"
"10059100-17" = "[ns] \"……やっぱり。\""
"10059100-19" = "（見つけてしまった）"
"10059100-20" = "（ワイルドハントバレエ団の演目――しっかり者のスズの兵隊）"
"10059100-23" = "（あのティアラを身につけ、バレリーナ人形役として眩いばかりに舞う――）"
"10059100-24" = "（マナミの姿を）"
"10059100-26-マナミ" = "なかでも「しっかり者のスズの兵隊」という作品は特に気に入っています。"
"10059100-27-マナミ" = "原典は、一本足のおもちゃの兵隊とバレリーナ人形を描いた悲しい物語。"
"10059100-28-マナミ" = "ですが以前、ハッピーエンドに脚色して上演されたことがありまして。"
"10059100-30" = "（けれど、マナミが舞台に立っていたのは去年の夏までだった）"
"10059100-33" = "（その夏を境に、マナミは舞台に立てなくなった）"
"10059100-34" = "（なぜなら……）"
"10059100-37" = "[log]ワイルドハント最高峰のバレリーナ[/log]"
"10059100-39" = "[log][ff4444]足首の負傷により、引退は避けられず！[-][/log]"
"10059100-44" = "（どうして怪我をしたのか、回復の見込みはあるのか、今後どうするのか……）"
"10059100-45" = "（マナミがすべての取材を拒否していたため、詳しいことは分からなかった）"
"10059100-46" = "（リハビリのおかげで日常生活に支障はなくなったものの、#n復帰は絶望的との記事もあった）"
"10059100-47" = "（マナミのバレリーナとしての物語は、あまりにも呆気なく幕を下ろしたのだ）"
"10059100-50-マナミ" = "この世に永遠などありません。"
"10059100-51-マナミ" = "夜空に輝く星でさえ、いつかは光を失うもの……。"
"10059100-53" = "（……結局、彼女は夢を失った）"
"10059100-54" = "（誰よりも輝いていた星は、彼女が最も望まぬ形で終わりを迎えた）"
"10059100-55" = "（それでも――）"
"10059100-57-マナミ" = "いつか、ここよりもずっと大きな博物館を作りたいと思っています。"
"10059100-58-マナミ" = "私一人の記憶ではなく、生徒全員の思い出を収める博物館を。"
"10059100-59-マナミ" = "そこに残された思い出が、夢を追いかける生徒の心の支えになればと願って。"
"10059100-60-マナミ" = "いかがでしょう。素敵な博物館になると思いませんか？"
"10059100-65" = "（――皆のために、前へ進み続けていた）"
"10059100-69-マナミ" = "ふふっ。ええ。私は、皆のためのキュレーターになりたいのです。"
"10059100-70-マナミ" = "それが、評議会長になった理由ですから。"
"10059100-72" = "（夢を失ったあの子が、新しい夢へ手を伸ばしている）"
"10059100-77" = "[ns] （そんなマナミの思いを）"
"10059100-79" = "[ns] （こんなところで砕くわけにはいかない！！）"
"10059100-82-拝金のブローカー" = "……目つきが変わったね。"
"10059100-83-拝金のブローカー" = "少しは期待してあげる。"
"10059100-84-拝金のブローカー" = "がっかりさせないでよ。"
