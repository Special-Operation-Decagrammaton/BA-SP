[translation]
"10059050-1" = "第5話;大規模な捜索"
"10059050-2" = "（翌日。芸術評議会に集まり、情報交換を行った）"
"10059050-3" = "（そして、一連の事件に同じ人物が関わっている可能性が浮かび上がった）"
"10059050-5" = "[ns1] \"拝金のブローカー……。\"\n[ns2] \"私もまだ会ったことないな……。\""
"10059050-8-ウララ" = "ブラックマーケットを拠点に活動する、名の知れた囚人だそうです。"
"10059050-9-ウララ" = "違法な商品の流通を仲介して、その手数料で利益を得ているとのことで……。"
"10059050-10-ウララ" = "さらに鉄道輸送を武器に、様々な違法事業にも手を広げているようです。"
"10059050-11-ウララ" = "そのうちの1つなのか、プレミアムミルクの流通にも関わっているという噂が。"
"10059050-12-ウララ" = "今のところ噂の域を出ないため、ヴァルキューレも動けていないそうです……。"
"10059050-13-マナミ" = "……私が得た情報とも一致しますね。#nだとすれば、そのブローカーは――"
"10059050-14" = "[s3] \"牛乳の流通網を使って作品を運び出して。\"\n[s4] \"それを資金洗浄に利用してるってこと？\""
"10059050-17-カノン" = "決定的な証拠はまだ出ていませんが、その可能性は高いでしょう。"
"10059050-18-カノン" = "慈愛の怪盗に続いて、別の七囚人と相対することになりそうですね。"
"10059050-19-マナミ" = "取り急ぎ、学院内の乳製品の流通には規制をかけました。#nですがそれだけでは何の解決にもなりません。"
"10059050-20-マナミ" = "ワイルドハントの名が違法行為に利用されたという事実は消えないのですから。"
"10059050-21-マナミ" = "いま必要なのは確かな証拠です。"
"10059050-22-マナミ" = "そこで、学院内部の本格的な捜索を行います。"
"10059050-23-マナミ" = "ブローカーと結託し、生徒をそそのかした何者かがいるはずです。"
"10059050-24-マナミ" = "そうでなければ、我が生徒たちが金に目を眩ませ……#n作品も誇りも自ら売り渡すなどあり得ません。"
"10059050-25-マナミ" = "ウララ副会長。直ちに寮監隊を招集してください。"
"10059050-26-マナミ" = "寮の隅々まで徹底的に調べ上げます。アリ1匹、見逃すつもりはありません。"
"10059050-27-ウララ" = "その……申し上げにくいのですが、マナミ様。#nこれほど大規模な抜き打ち検査を行えば、生徒から相当な反発が……。"
"10059050-28-マナミ" = "これは学院の威信に関わる問題です。これ以上、野放しにはできません。"
"10059050-29-マナミ" = "不満の声が上がったなら、すべて私の命令だと伝えなさい。"
"10059050-30-マナミ" = "学院の名誉を守るためならば、私自身がどう思われようと構いません。"
"10059050-31-ウララ" = "う……うぅ。"
"10059050-35-ウララ" = "……分かりました。寮監隊を招集します。"
"10059050-41" = "[ns] \"本当に大丈夫なの？\""
"10059050-42-マナミ" = "……大丈夫です。"
"10059050-43-マナミ" = "これで……学院と生徒を守れるのなら。"
"10059050-52-寮監隊員A" = "抜き打ち検査だ！全員、両手を頭の上に！ゆっくり外へ出ろ！"
"10059050-53-ツムギ" = "あらまあ。こんなことは初めてですね。"
"10059050-54-レナ" = "シャーッ！私の知らないところで何かやらかしたの！？"
"10059050-55-カノエ" = "イヒヒッ……さあ、どうだろうねぇ……。"
"10059050-56-エリ" = "まさか……評議会長の博物館への潜入計画がバレたのですか？"
"10059050-57-寮監隊員A" = "何をぶつぶつ言ってるんだ？"
"10059050-58-寮監隊員A" = "怪しいな。今すぐ身体検査だ。"
"10059050-59-寮監隊員A" = "まずはあなた。帽子を脱いで！"
"10059050-60-エリ" = "ぼっ！？えっ、えぇっ！？"
"10059050-61-エリ" = "なんて破廉恥な！は、裸になれだなんて、よくもそんなことを平然と……！"
"10059050-62-寮監隊員B" = "馬鹿なこと言ってないで早く脱いでください。"
"10059050-68-エリ" = "きゃあああっ……！！"
"10059050-71-ウララ" = "本当に申し訳ありません……#nできることなら、わたくしもこんなことはしたくなかったのですが……。"
"10059050-72-ウララ" = "評議会長のご命令ですので……。"
"10059050-73-カノエ" = "副会長まで来てるってことは……やっぱりバレちゃったのかなぁ。#nイヒッ、ならここは――"
"10059050-77-カノエ" = "ごめんなさぁい……。ほんの出来心だったんですぅ。#n今回だけは見逃してくださぁい……。"
"10059050-78-寮監隊員A" = "可哀想なふりをしても無駄だ！全員まとめて連行するぞ……！"
"10059050-79-ツムギ" = "致し方ありませんね。きちんと説明するしかなさそうです。"
"10059050-80-レナ" = "うぅぅ、なんで私までこんな目に遭うのよ、もう……。"
"10059050-82" = "一方、別の場所でも……。"
"10059050-85-ヒロミ" = "ミ、ミヨちゃん……？#nどうして持ち込み禁止の高カフェイン飲料が部屋にあるの……？"
"10059050-86-ミヨ" = "あ、えっと……こ、これは、その……！"
"10059050-87-リツ" = "こ、これは作品に使おうと思ってて！空き缶！空き缶だから！"
"10059050-88-フユ" = "そ、そうです！#n禁止品を新たな芸術へと昇華させるプロジェクトを進めていたのです！"
"10059050-89-サヨ" = "うーん……持ち込んだのは、本当に空き缶だけなんだね？"
"10059050-90-サヨ" = "それなら、問題ないね。"
"10059050-91-ヒロミ" = "問題ないわけないでしょう！仕事が大ざっぱすぎます！"
"10059050-92-ヒロミ" = "ミヨちゃん。見つけてしまった以上、見過ごすわけにはいかないよ。"
"10059050-93-ヒロミ" = "みんな、ついてきて。大ごとになる前にね。"
"10059050-94-リツ" = "急いで全部飲んでよかった……。"
"10059050-95-フユ" = "しーっ！"
"10059050-96-ミヨ" = "うぅぅぅ……ごめんなさい、ヒロミちゃん……。"
"10059050-102-ワイルドハントの生徒A" = "な、なによ？私が何したっていうの！？"
"10059050-103-寮監隊員A" = "こんな有害図書を隠し持っておいて、よくそんな顔ができるな。"
"10059050-104-ワイルドハントの生徒A" = "有害図書！？この[ruby=・]芸[/ruby][ruby=・]術[/ruby][ruby=・]的[/ruby]な漫画が！？"
"10059050-105-寮監隊員A" = "この[ruby=・]怪[/ruby][ruby=・]し[/ruby][ruby=・]い[/ruby]漫画のどこが芸術的なんだ！"
"10059050-106-ワイルドハントの生徒A" = "はあ？あんた、これまだ読んでないでしょ？#n読んでたら絶対そんなこと言えないから！"
"10059050-107-ワイルドハントの生徒A" = "検閲と編集のギリギリを綱渡りする、傑作中の傑作なんだって！"
"10059050-111-寮監隊員A" = "……本当に？"
"10059050-112-寮監隊員A" = "そう言われると……気になってきたな……。"
"10059050-117-寮監隊員A" = "けっ、けしからん……！！"
"10059050-118-寮監隊員B" = "ちょっと、早く閉じて！あんたも一緒に捕まえるよ！？"
"10059050-119-寮監隊員A" = "ご、ごめん！"
"10059050-124-寮監隊員B" = "妙な真似はせず、大人しくついてきてください！#n少しでも怪しい者は全員連行せよとのご命令です！"
"10059050-125-ワイルドハントの生徒A" = "うぅ……！評議会長だからって何してもいいの！？こんなの横暴よ！！"
"10059050-127" = "（その後も、大規模な抜き打ち検査は続いた）"
"10059050-129-カノン" = "マナミ様。今のところ、拝金のブローカーに繋がる報告はありません。"
"10059050-130-カノン" = "報告自体は上がっていますが、ほどんどが些細なものです。"
"10059050-131-カノン" = "目立つものでも、マナミ様の博物館への侵入を企てていた者がいた程度でしょうか。"
"10059050-132-マナミ" = "第4寮404号室の方々ですか？"
"10059050-133-カノン" = "まさしく。"
"10059050-134-マナミ" = "次は私の博物館に目をつけるだろうことは、とうに分かっていました。"
"10059050-135-マナミ" = "隠されていると、かえって覗きたくなる方々ですから。#n他に特筆すべきことはありますか？"
"10059050-136-カノン" = "……やはり、生徒からは相当な反発が出ているようです。"
"10059050-137-カノン" = "ご指示通り寮監隊が抑え込んではいますが……。"
"10059050-138-マナミ" = "構いません。反発は織り込み済みです。#nそのまま続けてください。"
"10059050-139-マナミ" = "今は何よりも調査が優先です。#n何としても、ブローカーと結託している人物を見つけ出さなければなりません。"
"10059050-140" = "[s] \"あくまで……もしもの話だけどさ。\""
"10059050-145" = "[ns5] \"ブローカーと結託した人なんていなかったら――\"\n[ns6] \"金に目が眩んだ生徒が自分からやってたとしたら――\""
"10059050-148-マナミ" = "作品を売り渡した生徒を、厳しく処分するほかないでしょう。"
"10059050-149-マナミ" = "二度と、同じことを繰り返させないためにも。"
"10059050-150-カノン" = "……。"
"10059050-152-カノン" = "……以上がマナミ様のご意向です。#nウララ様。引き続き調査をお願いします。"
"10059050-157-ウララ" = "（うぅ……これ以上、生徒を刺激し続けるのはよくありません……）"
"10059050-158-ウララ" = "（このような捜索が続けば、[ruby=・]あ[/ruby][ruby=・]の[/ruby][ruby=・]方[/ruby]の身も危うくなってしまいますし……）"
"10059050-163-ウララ" = "（斯くなる上は……）"
"10059050-164-ウララ" = "（申し訳ありません、マナミ様）"
"10059050-165-ウララ" = "（ご命令に……背かせていただきます）"
"10059050-169-ウララ" = "あの……寮監隊の皆さん？#n急ぎの用ができてしまったので、少し外します。"
"10059050-170-ウララ" = "何かありましたら、すぐに連絡してください。"
"10059050-171-寮監隊員A" = "はい！こちらはお任せください！"
"10059050-178-ウララ" = "……わたくしです。"
"10059050-179-ウララ" = "申し訳ありませんが、今回の件について……お話ししたいことがあります。"
"10059050-180-ウララ" = "……はい。ありがとうございます。#nそれでは、あの場所でお待ちしています。"
"10059050-187-ウララ" = "あら、もういらしていたのですね。"
"10059050-188-ウララ" = "申し訳ありません。突然お呼び立てしてしまい。"
"10059050-192-ミリア" = "いえ、ちょうど私も、あなたとは一度ゆっくりお話ししたいと思っていましたから。"
"10059050-193-ミリア" = "……記録に残らない、安全な場所で。"
"10059050-194-ウララ" = "ふふ……そうでしたか。思惑が一致して何よりです。"
"10059050-195-ウララ" = "では……単刀直入に申し上げます。"
"10059050-196-ウララ" = "誰にも悟られぬよう、お願いしたいことがあるのです。"
"10059050-197-ウララ" = "寮監隊のミリア様ではなく――"
"10059050-199" = "[log=우라라]慈愛の怪盗。[/log]"
"10059050-201" = "[log=우라라][ruby=きよすみ]清澄[/ruby]アキラ様に。[/log]"
