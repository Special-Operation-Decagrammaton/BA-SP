[translation]
"10059095-3-マナミ" = "……！"
"10059095-4-カノン" = "マナミ様……！ご無事ですか？"
"10059095-5-マナミ" = " ……ええ。まだ、戦えます。"
"10059095-6-ウララ" = "マナミ様……。"
"10059095-9-拝金のブローカー" = "……何これ。"
"10059095-10-拝金のブローカー" = "舐めてんの？"
"10059095-11-拝金のブローカー" = "この程度なら、最初から力で潰しとくんだった。"
"10059095-12-拝金のブローカー" = "とんだ無駄足じゃん。"
"10059095-13-ブラックマーケット幹部" = "さすがボス！お見事です！"
"10059095-14-ブラックマーケット幹部" = "さあ、評議会の皆様！もう諦めて、己の無力を受け入れるのです！"
"10059095-15-ブラックマーケット幹部" = "流通に関する権限を明け渡すだけ！簡単なことでしょう？"
"10059095-16-ブラックマーケット幹部" = "金が湯水のように流れ込む――#n利益第一の芸術学院へと生まれ変わらせて差し上げましょう！"
"10059095-17-マナミ" = "……させません。"
"10059095-18" = "[s1] \"うん。そんなことはさせない。\"\n[s2] \"ここから指揮の仕方を変えるよ。\""
"10059095-23" = "[ns] \"マナミが足首を気にせず、力を発揮できる形に。\""
"10059095-24-マナミ" = "……。"
"10059095-25-マナミ" = "先生……ご存じだったのですか？"
"10059095-26" = "[s] \"うん。私の生徒のことだから。\""
"10059095-30" = "[ns3] \"でも、このやり方はできれば避けたかった。\"\n[ns4] \"マナミの過去に触れてしまうようで。\""
"10059095-34-マナミ" = "……ふふっ。"
"10059095-35-マナミ" = "構いません。"
"10059095-36-マナミ" = "過去のことは、もう気にしないと決めましたから。"
"10059095-37-拝金のブローカー" = "……指揮を変える？"
"10059095-38-拝金のブローカー" = "そんなことで、あの雑魚どもが私に勝てるとでも思ってる？"
"10059095-39" = "[s] \"雑魚じゃない。\""
"10059095-41" = "[ns] \"大切な、私の生徒たちだ。\""
