[translation]
"10059080-1" = "第8話;D-Day"
"10059080-2" = "（一週間後。ついにD-Dayを迎えた）"
"10059080-4" = "秘密交渉の場所"
"10059080-8" = "[ns] （凄まじい緊張感だ……）"
"10059080-19-ブラックマーケット幹部" = "いやはや皆様。お久しぶりでございます。"
"10059080-20-ブラックマーケット幹部" = "できれば、このような形での再会は避けたかったのですが。"
"10059080-21-マナミ" = "予想通りの大所帯ですね。"
"10059080-22-ブラックマーケット幹部" = "はぁ……あの時、あれほど穏便にお帰りいただこうとしたのに。"
"10059080-23-ブラックマーケット幹部" = "ここまで踏み込まれてしまっては、こちらも本気でお相手するしかないでしょう？"
"10059080-24-マナミ" = "そちらは全員お揃いですか？肝心な方が見当たりませんが。"
"10059080-25-ブラックマーケット幹部" = "ボスは少々遅れておいでです。"
"10059080-26-ブラックマーケット幹部" = "急な商談が入りましてね。"
"10059080-31-ブラックマーケット幹部" = "ああ、噂をすれば。ちょうど到着されたようです。#n皆様、くれぐれも失礼のないように。"
"10059080-36-拝金のブローカー" = "……ああ。後始末は任せる。"
"10059080-37-拝金のブローカー" = "ちゃんと沈むようにしておいた。余計な手間はかからないはず。"
"10059080-38-拝金のブローカー" = "それじゃ。次の予定があるから。"
"10059080-42-拝金のブローカー" = "……ふん。"
"10059080-47-拝金のブローカー" = "全員揃ってるな。"
"10059080-48" = "[s] \"君が……。\""
"10059080-49-拝金のブローカー" = "アンタが[USERNAME]先生か。"
"10059080-50-拝金のブローカー" = "私が誰かはもう知ってるんでしょ？"
"10059080-51-拝金のブローカー" = "なら自己紹介なんて無駄は省いて、さっさと始めよう。"
"10059080-52-拝金のブローカー" = "時は金なり、だろ？"
"10059080-53" = "[s] \"まずは、お互いの要求を確認しよう。\""
"10059080-54-マナミ" = "こちらの望みはシンプルです。"
"10059080-55-マナミ" = "本日をもって、ワイルドハントの作品に関わる一切の違法取引から手を引くこと。"
"10059080-56-マナミ" = "そして金輪際、芸術をあなた方の商売に利用しないこと。#n以上2点を書面でお約束ください。"
"10059080-57-マナミ" = "我が学院から完全に手を引いていただきます。"
"10059080-58-拝金のブローカー" = "……アンタ、交渉する気ある？"
"10059080-59-拝金のブローカー" = "おい。"
"10059080-60-ブラックマーケット幹部" = "はいっ！私が対応いたします！"
"10059080-66-マナミ" = "気に入りませんね。端役が交渉の席に着くと？"
"10059080-70-ブラックマーケット幹部" = "いえ、大きな勘違いをされているようですので。"
"10059080-71-ブラックマーケット幹部" = "この交渉で、あなた方が要求できることなど何一つありません。"
"10059080-72-ブラックマーケット幹部" = "この場自体、ボスの厚意で成立しているもの。#n条件まで突きつけようなど、あまりにも図々しい。"
"10059080-73-ブラックマーケット幹部" = "大人しく、こちらの条件をお飲みください。"
"10059080-74-マナミ" = "……！"
"10059080-75-ブラックマーケット幹部" = "そう怖い顔をなさらずに。"
"10059080-76-ブラックマーケット幹部" = "こちらも「交渉」の席として臨んでいます。#nボスも、あなた方の望みの1つくらいなら聞き入れてくださるとのことです。"
"10059080-77-ブラックマーケット幹部" = "ですから、そちらの第一条件は受け入れましょう。"
"10059080-78-ブラックマーケット幹部" = "ブラックマーケットで行われている、#nワイルドハントの作品の取引はすべて中止いたします。"
"10059080-79-ブラックマーケット幹部" = "ただし、条件があります。"
"10059080-80-ブラックマーケット幹部" = "これは「交渉」ですから。#n代わりに、ワイルドハントの作品の正式な流通権をいただきたい。"
"10059080-81-マナミ" = "あなた方が正式に……我が学院の作品を扱う、と？"
"10059080-82-拝金のブローカー" = "そう。正規ルートの合法的な商売でね。"
"10059080-83-拝金のブローカー" = "私に任せてくれれば、今よりよっぽど高く売れると思うけど。"
"10059080-84-ブラックマーケット幹部" = "まさにwin-win！双方に利益のある理想的な取引でしょう？"
"10059080-85-ブラックマーケット幹部" = "いかがです？悪い話ではないと思いますが。"
"10059080-88-マナミ" = "その言葉を、どう信じろと？"
"10059080-89-拝金のブローカー" = "契約書は嘘をつかない。"
"10059080-90-拝金のブローカー" = "契約書の重みくらい、評議会長なら分かるでしょ。"
"10059080-91-拝金のブローカー" = "草案も、そっちに作らせてあげる。"
"10059080-92-拝金のブローカー" = "これでも、相当譲ってるつもりだけど。"
"10059080-93-マナミ" = "……初めから、それが目的で我が学院に近づいたのですか？"
"10059080-94-拝金のブローカー" = "まさか。"
"10059080-95-マナミ" = "あなたが一方的に契約を破る可能性は？"
"10059080-96-拝金のブローカー" = "契約書の重みくらい、評議会長なら分かるでしょ？"
"10059080-97-マナミ" = "……。"
"10059080-98-マナミ" = "よく分かりました。"
"10059080-99-マナミ" = "お言葉を返すようで恐縮ですが――"
"10059080-100-マナミ" = "お話になりません。"
"10059080-101-拝金のブローカー" = "……あ？"
"10059080-102-マナミ" = "そもそもの発端は、生徒の作品を資金洗浄に利用するという卑劣な行い。"
"10059080-103-マナミ" = "その張本人が、今度はワイルドハントの作品を正式に流通させて金を稼ぐと？"
"10059080-107-マナミ" = "寝言は夢で仰ってください。"
"10059080-108-ブラックマーケット幹部" = "貴様、ボスに向かって――！！"
"10059080-109-拝金のブローカー" = "好きに言わせておきな。どこまで吠えるのか聞いてやる。"
"10059080-110-マナミ" = "世の中をお金でしか測れないあなたと、いかなる協力関係も築けません。"
"10059080-111-マナミ" = "私たちが芸術と向き合うのは、お金を稼ぐためではありません。"
"10059080-112-マナミ" = "夢を追いかけるためです。"
"10059080-113-マナミ" = "純粋に創作を楽しみ、自分だけの道を見つけようと懸命にもがく生徒の未来を――#nあなた方の都合で汚さないでください。"
"10059080-114-マナミ" = "私たちの夢を踏みにじるものは、断じて許しません。"
"10059080-119-拝金のブローカー" = "……ふん。"
"10059080-120-拝金のブローカー" = "詭弁だね。"
"10059080-121-拝金のブローカー" = "学院のトップなら、アンタも分かってるはずでしょ。"
"10059080-122-拝金のブローカー" = "カネがあれば罪だろうと消せる。#nカネがない奴は、やってもいない罪まで背負わされる。"
"10059080-123-拝金のブローカー" = "カネを持ってるやつが強い。それがこの世界の現実だ。"
"10059080-124-マナミ" = "私の知る世界とは根本的に異なるようですね。"
"10059080-125-マナミ" = "これ以上、あなたと言葉を交わしても無駄でしょう。"
"10059080-126-拝金のブローカー" = "あーあー……。"
"10059080-127-拝金のブローカー" = "いいね。やっぱり、大したプライドだ。"
"10059080-128-拝金のブローカー" = "その代償が何かも、分かってるんだろうね？"
"10059080-129-マナミ" = "もちろんです。"
"10059080-130-拝金のブローカー" = "なら、望み通りにしてあげる。"
"10059080-134-拝金のブローカー" = "交渉は決裂だ。"
"10059080-135-ウララ" = "うぅ……や、やはりこうなってしまうのですね……。"
"10059080-136-カノン" = "初めから、話の通じる相手だとは思っていませんでした。"
"10059080-137-マナミ" = "皆さん――構えてください。"
"10059080-141-拝金のブローカー" = "評議会の連中は私が潰す。残りはアンタらに任せる。"
"10059080-142-ブラックマーケット幹部" = "承知しました！"
"10059080-146-ブラックマーケット幹部" = "お前ら！一人残らず叩き潰せ！！"
"10059080-154-サヨ" = "あら。そんなに自信満々で大丈夫？"
"10059080-155-ヒロミ" = "犯罪者のくせに、勢いだけは一丁前なのか……。"
"10059080-156-ミリア" = "（ここでは、寮監隊のミリアとして戦うべきでしょうね）"
