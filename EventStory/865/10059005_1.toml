[translation]
"10059005-1" = "プロローグ;偶然（？）の出会い"
"10059005-3" = "（空が澄み渡った、とある日のこと）"
"10059005-4" = "（バレエの公演に招待され、舞踊芸術会館を訪れた）"
"10059005-7" = "舞踊芸術会館"
"10059005-8" = "[ns] \"どうも、こんにちは。\""
"10059005-11-公演企画主" = "これはこれは。ようこそお越しくださいました、先生。"
"10059005-12-公演企画主" = "舞踊芸術の発展にお力添えいただき、誠にありがとうございます。"
"10059005-13-公演企画主" = "本日はガラコンサート。#n様々な演目を贅沢にお楽しみいただける構成です。"
"10059005-17-公演企画主" = "さあ、こちらへ。一番良いお席をご用意しております。#nどうぞごゆっくりお楽しみください。"
"10059005-19" = "（そうして案内についていき――）"
"10059005-23" = "（指定された席に腰を下ろした）"
"10059005-25" = "[ns] \"……楽しみだ。\""
"10059005-30-眼帯の少女" = "あら……驚きました。[USERNAME]先生ではありませんか？"
"10059005-31-隣の席の少女" = "ふふ、奇遇ですね。お会いできて光栄です、先生。"
"10059005-32" = "[s] \"こんにちは。私を知ってくれてるんだね。\""
"10059005-33-隣の席の少女" = "ふふっ、このような偶然に恵まれるだなんて思いも寄りませんでした。"
"10059005-34-隣の席の少女" = "実は以前、先生には少々お世話になったことがありまして。#n一度お目にかかりたいと思っておりました。"
"10059005-39-眼帯の少女" = "解説します……ずっと復讐の機会を窺っていた、という意味です。"
"10059005-43" = "[ns] \"ふくっ――！？\""
"10059005-44-隣の席の少女" = "ふふっ、カノン書記官。#nそんな言い方では、まるで私が先生を恨んでいるみたいではありませんか。"
"10059005-45-隣の席の少女" = "ご安心ください。私は先生を好ましく思っているんですよ？"
"10059005-49-隣の席の少女" = "――本当に。"
"10059005-53" = "[ns] \"私……何かしたっけ……？\""
"10059005-54-隣の席の少女" = "ふふっ。さあ、どうでしょう？"
"10059005-55-隣の席の少女" = "少なくとも、私の心に偽りはありませんよ。"
"10059005-56-隣の席の少女" = "ですので――"
"10059005-61-隣の席の少女" = "こちらのチケットに、サインをいただけませんか？"
"10059005-62-隣の席の少女" = "先生との邂逅を、残しておきたいのです。"
"10059005-66-眼帯の少女" = "解説します……先生の筆跡を確認したい、という意味です。"
"10059005-67-眼帯の少女" = "筆跡が偽造しやすいものだった場合、取引時に注意する必要がありますから。"
"10059005-68-隣の席の少女" = "ふふっ、カノン書記官。#nそんな言い方では、まるで私が先生を信用していないみたいではありませんか。"
"10059005-69-隣の席の少女" = "ご安心ください。それなりに信用しておりますよ。"
"10059005-70-隣の席の少女" = "――今のところは。"
"10059005-71-隣の席の少女" = "さあ、こちらにサインをお願いいたします。"
"10059005-75" = "[ns] \"わかった……。\""
"10059005-79-隣の席の少女" = "ふふっ、ありがとうございます。#nこちらは私の博物館に、大切に収蔵いたしますね。"
"10059005-80" = "[s] \"博物館？\""
"10059005-81-隣の席の少女" = "私、個人で博物館を持っておりまして。#nさまざまな品を集めるのが趣味なのです。"
"10059005-85-隣の席の少女" = "収集とは……[ruby=・]感[/ruby][ruby=・]覚[/ruby][ruby=・]の[/ruby][ruby=・]芸[/ruby][ruby=・]術[/ruby]。"
"10059005-86-隣の席の少女" = "時を越えて、作品に宿る感情や歴史を感じ取ることができるのです。"
"10059005-87-隣の席の少女" = "――このチケットもそう。"
"10059005-88-隣の席の少女" = "元は何の変哲もないチケットですが、今は新たな意味を得ました。"
"10059005-89-隣の席の少女" = "私はこのチケットを見るたび、先生と共にした時間を思い返すでしょう。"
"10059005-90-隣の席の少女" = "つまり些細なものでも特別になり得る――ロマンチックだと思いませんか？"
"10059005-91" = "[s] \"それはたしかに。\""
"10059005-92-隣の席の少女" = "場合によってはゴミさえも記念品になります。"
"10059005-93-隣の席の少女" = "……ちょうど、後で捨てようと思っていたティッシュがポケットに。"
"10059005-94-隣の席の少女" = "これも、今日の記念品として取っておくことにしましょう。"
"10059005-95-隣の席の少女" = "このティッシュを見るたびに、先生と語り合ったことを思い出すのです。"
"10059005-96" = "[s] \"ティッシュで思い出すのはどうなんだろう……。\""
"10059005-97-隣の席の少女" = "ふふっ、冗談ですよ、冗談。"
"10059005-98-隣の席の少女" = "このティッシュは後で捨てておきます。"
"10059005-99-隣の席の少女" = "思い出の断片がゴミ箱に収まってしまうのは、少々惜しくもありますが。"
"10059005-100" = "[s] \"思い出も一緒に捨てるの！？\""
"10059005-101-隣の席の少女" = "申し上げた通り、収集とは感覚の芸術。#n手放すということは、そこに宿る思い出も共に捨てられる――当然の帰結です。"
"10059005-102-隣の席の少女" = "ですが、どうかご心配なく。#n捨てられずに済むよう、価値を更新していく方法もありますから。"
"10059005-106-眼帯の少女" = "解説します……今後は先生次第。期待しています、という意味です。"
"10059005-110" = "[ns1] （なんか独特な生徒だ……）\n[ns2] \"そういえば、その制服……ワイルドハント？\""
"10059005-113-隣の席の少女" = "あら。まだ自己紹介をしていませんでしたね。"
"10059005-114-隣の席の少女" = "これはとんだご無礼を。改めてご挨拶申し上げます。"
"10059005-115-隣の席の少女" = "私の名前は[ruby=うるわし]雲類鷲[/ruby]マナミ。"
"10059005-119-マナミ" = "ワイルドハント芸術評議会の評議会長を務めております。"
