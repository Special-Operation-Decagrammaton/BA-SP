[translation]
"10051005-1" = "プロローグ;ラーメンと陰謀"
"10051005-2" = "[log]忍者たる者、忘るべからず。[/log]"
"10051005-3" = "[log]麺は極太！[/log]"
"10051005-4" = "[log]背脂追加！[/log]"
"10051005-5" = "[log]仕上げにラー油を一回し！[/log]"
"10051005-6" = "百鬼夜行某所のラーメン屋"
"10051005-7-ミチル" = "これぞ忍者流！ラーメンを嗜む新作法！"
"10051005-8-ミチル" = "し、「新・忍者定食」です！"
"10051005-9-ミチル" = "みなさん、お待たせしました！ニンニン！"
"10051005-10-ミチル" = "「少女忍法帖ミチルっち」！忍者とラーメン編！"
"10051005-11-ミチル" = "始まります！！！"
"10051005-12-ミチル" = "……あっ、ちょっと待った！"
"10051005-13-ミチル" = "カメラ、なんか傾いてない？"
"10051005-14-ミチル" = "三脚のせいかな……？"
"10051005-15-ミチル" = "えっ！？ご、ごめんなさい……。#n私がもっと、気をつけておけば……。"
"10051005-16-ミチル" = "いやいや、セッティングしたのは私なんだから。"
"10051005-17-ミチル" = "心配ご無用！もう一度撮り直せば大丈夫です！"
"10051005-18-ミチル" = "それでは気を取り直して――"
"10051005-19" = "ガシャーン！"
"10051005-20-ラーメン同好会のメンバーB" = "店長！このスープどうなってんの！？#nゆるすぎて麺に絡まないだろ！"
"10051005-21-ラーメン同好会のメンバーB" = "麺の茹で加減も足りないな！"
"10051005-22-ラーメン同好会のメンバーB" = "麺とスープの一体感が失われてるじゃんか！"
"10051005-23-ラーメン同好会のメンバーB" = "いや、ウチのラーメンはもう何年もこのレシピで……。"
"10051005-24-ラーメン同好会のメンバーB" = "ってそれより！#n味が気に入らないからって、テーブルをひっくり返されては困ります！"
"10051005-25-ラーメン同好会のメンバーB" = "他のお客様にもご迷惑ですから！"
"10051005-26-ミチル" = "らっ……ラーメンが直撃して、カメラが……！"
"10051005-27-ミチル" = "うっ……うぅっ……。"
"10051005-28-ミチル" = "終わった……！"
"10051005-29-ミチル" = "ぶ、部長……これからどうすれば……。"
"10051005-30-ミチル" = "……。"
"10051005-31-ミチル" = "（ああ、もうっ！！あの厄介客め……！このまま引き下がるわけには――）"
"10051005-32-ミチル" = "（でも……私、あいつらに勝てるのかな？）"
"10051005-33-ミチル" = "（いや、私は1人じゃない……）"
"10051005-34-ミチル" = "（ツクヨとイズナがいる……！）"
"10051005-35-ミチル" = "……忍者たる者、いかなる窮地にあっても――"
"10051005-36-ミチル" = "不義に背を向けることはない……！"
"10051005-37-ラーメン同好会のメンバーA" = "お？なんだぁ？"
"10051005-38-ツクヨ" = "部長……？"
"10051005-39-ミチル" = "くらえ！忍法・キラキラファイアーの術！"
"10051005-40-ラーメン同好会のメンバーB" = "ぐあああっ……あ？何とも……ない？"
"10051005-41-ラーメン同好会のメンバーB" = "……花火？"
"10051005-42-ラーメン同好会のメンバーB" = "なんか……ピカピカするだけで痛くもかゆくもないし？"
"10051005-43-ラーメン同好会のメンバーB" = "なんにせよ、ケンカを売ってきたってことだよな……！"
"10051005-44-ラーメン同好会のメンバーB" = "てか、忍法って何なんだ？"
"10051005-45-ラーメン同好会のメンバーB" = "それはわから――"
"10051005-46-店長" = "後ろに下がっていて……ください！"
"10051005-47-店長" = "あ、ありがとうございます！"
"10051005-48-ラーメン同好会のメンバーB" = "ぐぅっ……！"
"10051005-49-ラーメン同好会のメンバーB" = "注意を逸らしておいて、後ろから不意打ちとは卑怯な……。"
"10051005-50-ミチル" = "ふっふっふ、相手の注意を引いて、背後を取る。これこそが――"
"10051005-51-ミチル" = "『忍法・キラキラファイアーの術！』の真の使い方！"
"10051005-52-イズナ" = "さすが部長！#n「忍者三人寄れば虎をも制す」戦略とはこれなのですね！"
"10051005-53-ミチル" = "もっちろん！"
"10051005-54-ミチル" = "……あれ、そうだっけ？"
"10051005-55-ツクヨ" = "あ、あの……。"
"10051005-56-ミチル" = "ツクヨ？どうしたの？"
"10051005-57-ツクヨ" = "かかったスープは、拭き取ったんですが……。"
"10051005-58-ツクヨ" = "カメラの電源が……入りません……！"
"10051005-59" = "……。"
"10051005-60-ミチル" = "……。"
"10051005-61-一同" = "えええぇぇぇっ！？"
"10051005-62-ニヤ" = "ふむ……。"
"10051005-63-ニヤ" = "機敏で無駄のない動き……さらに店主の安全にまで気を使える……。"
"10051005-64-ニヤ" = "にゃはは。これなら、護衛任務も任せられるかもしれませんねぇ……。"
"10051005-65-ニヤ" = "前々から忍術研究部の腕前は存じておりましたが……まだ新たな発見があるとは。"
"10051005-66-ニヤ" = "……これなら。"
"10051005-67-ニヤ" = "「あの任務」に抜擢するのも……悪くないかも？"
