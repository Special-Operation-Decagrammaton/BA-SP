[translation]
"10051090-1" = "第9話;意図された偶然"
"10051090-2" = "シャーレ・オフィス"
"10051090-3-イズナ" = "あっ、主殿……！"
"10051090-4-イズナ" = "あの……その……。"
"10051090-5-イズナ" = "部長が……部長の様子がおかしいんです……！"
"10051090-6" = "[s1] \"イズナ、ひとまず落ち着こう。\"\n[s2] \"それで、ミチルの様子がどうしたの？\""
"10051090-7-イズナ" = "先日……一緒にラーメンを食べて別れた時までは元気だったのですが……。"
"10051090-8-イズナ" = "あの日以来、何かが変わってしまったんです！"
"10051090-9" = "[s] \"変わった？\""
"10051090-10-イズナ" = "上手く言えないのですが……#n目に生気がないというか……やる気を失った……？気弱になった……？"
"10051090-11-イズナ" = "昨日なんて、こんなことがあったんです！"
"10051090-12" = "百鬼夜行商店街"
"10051090-13-イズナ" = "ふぅ、ごちそうさまでした！"
"10051090-14-イズナ" = "今日も「忍者定食」は期待を裏切らないですね！"
"10051090-15-イズナ" = "ですよね、部長？"
"10051090-16-ミチル" = "……。"
"10051090-17-ミチル" = "部長？"
"10051090-18-ミチル" = "あ？う、うん。そうだね、美味しかったよ。"
"10051090-19-ミチル" = "何か、あったんですか……？"
"10051090-20-ミチル" = "え？いやいや、何もないって。大丈夫だよ。"
"10051090-21-イズナ" = "（どう見ても大丈夫じゃないです……）"
"10051090-22-イズナ" = "それでは、来週撮影する「少女忍法帖ミチルっち」の内容について話し合いませんか？"
"10051090-23-イズナ" = "あっ、そうです！あそこの呉服屋さんの隣に、新しいお茶屋さんができてたんです！#nそこで話しましょう！"
"10051090-24-ミチル" = "いや、来週は動画撮るつもりないし……。"
"10051090-25-イズナ" = "ネタがまだなら、相談しなきゃいけませんよね！#nイズナ、アイデア出しでもどんと来いです！"
"10051090-26-ミチル" = "いや、だから私は……。"
"10051090-27-ミチル" = "あのお茶屋さん、お団子のセットがおすすめだって聞きました！"
"10051090-28-ミチル" = "行きましょう、部長！ちょうどあそこに……！"
"10051090-29-ミチル" = "ちょ、ちょっと待って、イズナ、実は……。"
"10051090-30" = "ドカーン！"
"10051090-31-ミチル" = "ええっ……！？"
"10051090-32-ミチル" = "誰かが呉服屋さんの前で煙幕を使ったみたいです！"
"10051090-33-魑魅一座B" = "よし！煙幕の効果はバッチリだ！"
"10051090-34-魑魅一座B" = "こんな不親切な店に入ったら、客がかわいそうだからな！"
"10051090-35-魑魅一座B" = "そうそう！客の要望を無視して、自分の都合ばっかり押しつけてくるんだもんな！"
"10051090-36-魑魅一座B" = "こんな店、潰れて当然だろ！"
"10051090-37-呉服屋の店主" = "ちょっと！人の店の前で何してるのよ！？"
"10051090-38-魑魅一座A" = "何って、お前が客の要望を無視するからだろ？"
"10051090-39-呉服屋の店主" = "私が、無視したって……？"
"10051090-40-呉服屋の店主" = "タコ焼きとコーヒーを出せなんて要望、呉服屋にどうやって応えろって言うのよ！？"
"10051090-41-魑魅一座B" = "客が頼んだら出せばいいだけだろ？ガタガタうるさいな！"
"10051090-42-魑魅一座B" = "そんな頭の固いやり方で、商売やってけると思ってんのか？"
"10051090-43-呉服屋の店主" = "何言ってんの！？#n商売できてない原因はあなた達なんですけど！？"
"10051090-44-魑魅一座B" = "くっ……論理的に返された……！"
"10051090-45-魑魅一座B" = "怯むな！私たちは報酬だけを考えるんだ！"
"10051090-46-呉服屋の店主" = "ちょっと、報酬？それ、誰からもらってるの？"
"10051090-47-魑魅一座B" = "あっ、つい口が……！"
"10051090-48-イズナ" = "部長！魑魅一座が呉服屋さんの前で騒ぎを起こしてます！"
"10051090-49-イズナ" = "イズナたちが行って……って、あれ？部長？"
"10051090-50-ミチル" = "え？なに？"
"10051090-51-イズナ" = "部長！今こそ動く時です！"
"10051090-52-ミチル" = "う、うん？そ、そうかもだけど……。"
"10051090-53-ミチル" = "でもさ、ああいうのって……百花繚乱の担当、じゃないかな……？"
"10051090-54-ミチル" = "それに、今はツクヨもいないし……。"
"10051090-55-イズナ" = "ツクヨ殿がいないからって、忍者の精神まで失われるわけではありません！"
"10051090-56-ミチル" = "ううぅ、それはそうなんだけど……。"
"10051090-57-イズナ" = "ぶ、部長！"
"10051090-58" = "シャーレ・オフィス"
"10051090-59-イズナ" = "……という事があったんです。"
"10051090-60-イズナ" = "部長……すごくしょんぼりしてて、何に対しても自信なさげで……。"
"10051090-61-イズナ" = "イズナ、あんな部長を見るのは初めてで……。"
"10051090-62" = "[s] \"たしかに、それはいつものミチルじゃないね……。\""
"10051090-63-イズナ" = "主殿もそう思いますか？"
"10051090-64-イズナ" = "一体、どうしてなんでしょう……？"
"10051090-65" = "[s] \"イズナはどう思う？\""
"10051090-66-イズナ" = "……。"
"10051090-67-イズナ" = "多分……理由は分かっている気がします。"
"10051090-68-イズナ" = "ツクヨ殿が、忍術研究部に戻ってこないこと……だと思います……。"
"10051090-69-イズナ" = "部長が気落ちしてしまっているので……イズナは、あえて明るく振る舞おうとしました。"
"10051090-70-イズナ" = "2人とも沈んでいては、前に進めないと思ったんです。"
"10051090-71-イズナ" = "でも……もうどうすればいいのか、イズナには分かりません……！"
"10051090-72-イズナ" = "ツクヨ殿とはいまだに連絡が取れませんし……。#n新年記念ファッションショーの準備映像はずっとアップされているので、#n元気ではあるみたいなのですが……。"
"10051090-73" = "[s] \"じゃあ、一緒にツクヨの居場所を探してみようか。\""
"10051090-74-イズナ" = "そうしたいのですが……部長は動こうとしないと思います。"
"10051090-75-イズナ" = "ツクヨ殿と会うのを意図的に避けているような気がして……。"
"10051090-76-イズナ" = "それでも、どうにかして2人を会わせなければいけません。"
"10051090-77-イズナ" = "そうしないと、解決の糸口はつかめないと思うんです。"
"10051090-78" = "[s3] \"ミチルとツクヨを会わせたいんだよね？\"\n[s4] \"それなら、いいアイデアが思いついたかも。\""
"10051090-79-イズナ" = "本当ですか！？"
"10051090-80" = "[s] \"準備ができたら連絡するから、少し時間をもらえるかな。\""
"10051090-81-イズナ" = "はい！お待ちしております！"
"10051090-82-ニヤ" = "なるほど……それであれば、難しくはありませんね。"
"10051090-83-ニヤ" = "うまく話をつけておきましょう。"
"10051090-84" = "[s] \"急にこんなお願いしてごめんね。\""
"10051090-85-ニヤ" = "にゃはは、謝る必要はありません。むしろ、感謝したいくらいですから。"
"10051090-86-ニヤ" = "だってこれしきのことで、先生の「1回限定・無制限使用券」を手に入れたようなわけですし？"
"10051090-87" = "[s] \"それ、どこで発行されてるの……！？\""
"10051090-88-ニヤ" = "にゃはは、何をしていただくか……今から楽しみにしていてくださいね？"
"10051090-89-ニヤ" = "それはそれとして。#nそちらでも魑魅一座が騒ぎを起こしていたんですね。"
"10051090-90-ニヤ" = "年末に入ってから、ちょ～っとおいたが過ぎるんですよねぇ。#nまぁ、こっちは追々考えることにいたしましょう。"
"10051090-91-ニヤ" = "はてさて、先生のお願いを実現するには、どこに連絡したものか……。"
"10051090-92-ニヤ" = "う～ん……。"
"10051090-93-ニヤ" = "「百鬼夜行新年記念ファッションショー運営委員会」……まずはここですかね。"
"10051090-94" = "（数日後、ついに大晦日が目前に迫った）"
"10051090-95-ミチル" = "つまり……ここで忍者のイベントが開かれるってこと？"
"10051090-96-イズナ" = "その通りです！"
"10051090-97-ミチル" = "私たち、わざわざおめかしして来る必要あったのかな……？"
"10051090-98-イズナ" = "もうすぐ新年ですから！こぞって綺麗な服を着て来るはずです！#nイズナたちだけ普段着というわけにはいきません！"
"10051090-99-ミチル" = "そう言われればそうかもだけど……。"
"10051090-100-ミチル" = "あれ？でもここって裏口じゃない？#nイベント会場の正門は反対側なんじゃ……？"
"10051090-101-スタッフ" = "あぁ、お待ちしてました。"
"10051090-102-スタッフ" = "[ruby=ちどり]千鳥[/ruby]ミチルさん、[ruby=くだ]久田[/ruby]イズナさんですね？"
"10051090-103-イズナ" = "はい、そうです！"
"10051090-104-ミチル" = "イズナ、予約までしておいたの？"
"10051090-105" = "[s] \"やあ、2人とも。\""
"10051090-106-ミチル" = "ふにゃあっ！？先生殿まで！？"
"10051090-107-ミチル" = "ってことは……相当すごいイベントなんだね……！？"
"10051090-108-スタッフ" = "それではまず、こちらのインカムをお付けください。"
"10051090-109-ミチル" = "……うん？インカム？"
"10051090-110-ミチル" = "おぉ、イベントの案内を無線でしてくれるの？"
"10051090-111-スタッフ" = "皆さんのお仕事は簡単です。#n人混みの中を巡回して、不審者がいれば報告または制圧してください。"
"10051090-112-ミチル" = "不審者がいたら制圧して……って、ちょっと待って。"
"10051090-113-ミチル" = "仕事？制圧！？"
"10051090-114-ミチル" = "イズナ、これってまさか……。"
"10051090-115-スタッフ" = "百鬼夜行新年記念ファッションショーへようこそ、警備員の皆さん。"
"10051090-116-ミチル" = "な、なにこれーーー！？"
"10051090-117-ミチル" = "警備員！？私たち騙されたってこと！？これ雇用詐欺だよ！主催側の陰謀だ！"
"10051090-118-イズナ" = "陰謀ではありません！"
"10051090-119-イズナ" = "この仕事は、イズナが引き受けたんです！"
"10051090-120-ミチル" = "えっ？それって……どういう意味？"
"10051090-121-ミチル" = "っていうかこの建物――"
"10051090-122-ミチル" = "ツクヨが出るファッションショーの会場じゃない！？"
"10051090-123-ミチル" = "これのどこが忍者イベントなのさ！"
"10051090-124-イズナ" = "忍者が参加するなら、それが何であろうと「忍者イベント」です！"
"10051090-125-イズナ" = "まさか部長……ツクヨ殿は忍者の心を持っていない、と言うつもりではないですよね？"
"10051090-126-ミチル" = "そ、それは違うけど……！"
"10051090-127-ミチル" = "私は……ツクヨを……。"
"10051090-128-ミチル" = "……時間です。行きましょう。"
"10051090-129-イズナ" = "いざ、参りましょう！"
"10051090-130-ミチル" = "く、くうぅぅぅ……！"
