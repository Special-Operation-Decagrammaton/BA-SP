[translation]
"10051100-1" = "第10話;ショーの終幕"
"10051100-2" = "ファッションショー控室"
"10051100-3-シャインキャット" = "……いよいよ本番だね。"
"10051100-4-シャインキャット" = "準備はいい？"
"10051100-5-ツクヨ" = "……。"
"10051100-6-シャインキャット" = "緊張しなくてもいいよ。でも、心の準備だけはしておいて。"
"10051100-7-シャインキャット" = "今日は事実上、君の本当のデビューステージになるんだから。"
"10051100-8-ツクヨ" = "本当の……デビュー？"
"10051100-9-シャインキャット" = "今までのステージは、どれも小規模だった。#nだから多少拙いウォーキングでも大した問題にはならなかった。"
"10051100-10-シャインキャット" = "もちろん、それでもある程度注目はされたけど……あくまで[ruby=・]新[/ruby][ruby=・]人[/ruby][ruby=・]と[/ruby][ruby=・]し[/ruby][ruby=・]て[/ruby]の話。"
"10051100-11-シャインキャット" = "だけど今日は違う。#n新年を祝うこのショーは、これまでより何倍も多くの人が君を見ることになる。"
"10051100-12-シャインキャット" = "だから今日が終われば、君の名前はもっと広く知れ渡る。"
"10051100-13-シャインキャット" = "今日をもって――君は真のプロモデルへと生まれ変わるんだよ。"
"10051100-14-ツクヨ" = "プロの……モデル……。"
"10051100-15-ツクヨ" = "本当に……私が……？"
"10051100-16-シャインキャット" = "そうさ。感慨深い？"
"10051100-17-ツクヨ" = "……。"
"10051100-18-シャインキャット" = "それとも、まだ未練があるのかな？まだ戻りたいと思ってる？"
"10051100-19-ツクヨ" = "わ、私は……。"
"10051100-20-ツクヨ" = "えっと……。"
"10051100-21-シャインキャット" = "そんな時は、今までの努力を思い出しなさい。"
"10051100-22-シャインキャット" = "過酷な食事管理に運動、ポージングのトレーニング、その他にもたくさん。"
"10051100-23-シャインキャット" = "君の才能、そしてその努力を無駄にしないで。#nわかった？"
"10051100-24-ツクヨ" = "は、はい……。"
"10051100-25" = "時間です。準備をお願いします。"
"10051100-26-シャインキャット" = "よし、行ってきなさい。"
"10051100-27-ツクヨ" = "……はい。"
"10051100-28-イズナ" = "前回のファッションショーより、ずっと人が多いですね！"
"10051100-29-ミチル" = "そうだね……規模も大きくなってる……。"
"10051100-30-ミチル" = "このステージを……もうすぐ、ツクヨが歩くんだよね？"
"10051100-31-イズナ" = "そうです。"
"10051100-32-イズナ" = "……そしてショーが終わったら、ツクヨ殿に直接会えるかもしれません。"
"10051100-33-イズナ" = "最後に退場する時、モデルと警備員は同じ通路を使うそうなので。"
"10051100-34-ミチル" = "ツクヨ……。"
"10051100-35-ミチル" = "ねえ、イズナ……。"
"10051100-36-イズナ" = "はい！"
"10051100-37-ミチル" = "私……本当にツクヨに会うべきかな？"
"10051100-38-イズナ" = "はい！？"
"10051100-39-ミチル" = "あ……。"
"10051100-40-イズナ" = "……始まりました。"
"10051100-41-ミチル" = "……ツクヨだ。"
"10051100-42-イズナ" = "……ツクヨ殿です。"
"10051100-43-ミチル" = "……人が輝くって、ああいうことなんだね。"
"10051100-44-イズナ" = "歩き方が、前よりずっと自然になっています。"
"10051100-45-ミチル" = "もう完全に……モデルだね……。"
"10051100-46-ミチル" = "素敵な服を着て、ステージの上で――"
"10051100-47-ミチル" = "スポットライトを一身に浴びながら……全力で走って――"
"10051100-48-ミチル" = "走って――"
"10051100-49-ミチル" = "待って、走ってる？"
"10051100-50-ミチル" = "ツクヨ！？なんで急に走り出してるの！？"
"10051100-51-イズナ" = "えええっ！？"
"10051100-52-イズナ" = "部長！ツクヨ殿がステージから飛び降りました！！"
"10051100-53-ミチル" = "なんでぇぇぇぇ！？"
"10051100-54" = "[log]（1分前）[/log]"
"10051100-55-ツクヨ" = "（こんなに人が多いなんて……）"
"10051100-56-ツクヨ" = "（ふぅ……）"
"10051100-57-ツクヨ" = "（大丈夫……練習した通りに歩けば……）"
"10051100-58-ツクヨ" = "（そう、こうして歩いていけば……）"
"10051100-59-ツクヨ" = "（その先に……私は、何になれるんだろう？）"
"10051100-60-ツクヨ" = "（あっ、始まった……！）"
"10051100-61-ツクヨ" = "（……あれ？）"
"10051100-62-ツクヨ" = "（観客席のあの人、何してるの……？）"
"10051100-63-ツクヨ" = "（な、な、なんで！？）"
"10051100-64-ツクヨ" = "（あの人のバッグの中……爆弾が！？）"
"10051100-65-ツクヨ" = "（しかも、ピンを抜こうとしてる！？）"
"10051100-66-ツクヨ" = "（周りの人たち、なんで気づかないんですか……！？）"
"10051100-67-ツクヨ" = "（まさか、ステージからじゃないと見えてないとか……？）"
"10051100-68-ツクヨ" = "（ひぃぃ……！）"
"10051100-69-ツクヨ" = "（なぜ、そんなことを……？）"
"10051100-70-ツクヨ" = "（ううん、理由よりも先に――）"
"10051100-71-ツクヨ" = "（まずは爆発を阻止しないと！）"
"10051100-72-ツクヨ" = "（叫ぶ？ダメ。それだと混乱を招くだけ……！）"
"10051100-73-ツクヨ" = "（どうすれば……！）"
"10051100-74" = "[log]忍者とは[wa:1040]どんな[/log]"
"10051100-75" = "[log]窮地でも――[/log]"
"10051100-76-ツクヨ" = "決して諦めないもの……！"
"10051100-77-ツクヨ" = "えいっ！"
"10051100-78" = "タタタッ！"
"10051100-79-ミチル" = "ツクヨ！？なんで急に走り出してるの！？"
"10051100-80-イズナ" = "えええっ！？"
"10051100-81-イズナ" = "部長！ツクヨ殿がステージから飛び降りました！！"
"10051100-82" = "ドドン！！！"
"10051100-83-ツクヨ" = "……捕まえました！"
"10051100-84-シャインキャット" = "あの子、何をやってるの……！？"
"10051100-85-スタッフ" = "ひいいぃぃっ……！"
"10051100-86-ミチル" = "ツクヨ！"
"10051100-87-イズナ" = "ツクヨ殿！"
"10051100-88-ミチル" = "何してるの！？ドレスがボロボロじゃん！？"
"10051100-89-ミチル" = "しかも……ファッションショーが……！"
"10051100-90-ツクヨ" = "部長！とにかくこの人のバッグを！"
"10051100-91-ツクヨ" = "中に爆弾が入ってます！"
"10051100-92-イズナ" = "バッグ確保！本当に爆弾が入っています！"
"10051100-93-ミチル" = "えぇっ！？"
"10051100-94-ミチル" = "これ！威力が凄すぎてコンビニとかスーパーでも販売禁止にされてるやつじゃん！？"
"10051100-95-ミチル" = "っていうか、ツクヨ、大丈夫！？"
"10051100-96-ツクヨ" = "はい、私は、大丈夫です。"
"10051100-97-ツクヨ" = "ちょっとだけ、ドレスが……破れましたけど……。"
"10051100-98-ツクヨ" = "えへへ、ちょっと……みっともないですね？"
"10051100-99-ミチル" = "そ、それどころじゃないでしょ！？モデルがドレスを破るって……！"
"10051100-100-ミチル" = "そのドレス、すごく高いやつなんじゃ……！"
"10051100-101-ツクヨ" = "部長、大丈夫です。"
"10051100-102-ミチル" = "大丈夫じゃないでしょ！"
"10051100-103-ミチル" = "だって、ツクヨは――"
"10051100-104-ミチル" = "――モデルなんだから！"
"10051100-105-ツクヨ" = "……はい？"
"10051100-106-ミチル" = "……え？"
"10051100-107-ミチル" = "違うの？"
"10051100-108-ツクヨ" = "私はツクヨですよ？"
"10051100-109-ミチル" = "え、いや、えっと、そういう意味じゃなくて……。"
"10051100-110-ツクヨ" = "いえ、これで合ってます。"
"10051100-111-ツクヨ" = "私は[ruby=おおの]大野[/ruby]ツクヨ、です。#n背が高くて、気弱で、忍者が好きな……ただの高校生。それが、私です。"
"10051100-112-ミチル" = "……モデルは？"
"10051100-113-ツクヨ" = "正直、よくわかりません。"
"10051100-114-ツクヨ" = "たしかに周りの人は、私を最高のモデルって褒めてくれます。"
"10051100-115-ツクヨ" = "でも、そう言われる度に……モデルとして当然だとされることをこなす度に……。"
"10051100-116-ツクヨ" = "……合わない服を無理に着てるみたいに、苦しくて……辛くなりました。"
"10051100-117-ミチル" = "合わない服……。"
"10051100-118-ツクヨ" = "部長も見ましたよね？合わない服は、無理に着れば――"
"10051100-119-ツクヨ" = "……いつか、破けてしまうんです。"
"10051100-120-ミチル" = "ツクヨ……。"
"10051100-121-ツクヨ" = "部長……私、戻ります。"
"10051100-122-ツクヨ" = "――忍術研究部に。"
"10051100-123-ミチル" = "……。"
"10051100-124-ミチル" = "う……うぅ……。"
"10051100-125-ツクヨ" = "ぶ、部長……！？"
"10051100-126-ツクヨ" = "ど、どうして泣くんですか！？"
"10051100-127-ミチル" = "私……ツクヨが戻ってこないと思ってた……。"
"10051100-128-ミチル" = "だって、あんなにすごい才能があるんだもん……。"
"10051100-129-ミチル" = "だから、引き止めちゃいけないって、思った。"
"10051100-130-ミチル" = "下手に引き戻したら、大切な才能を潰すかもしれないって……。"
"10051100-131-ミチル" = "だから……戻らない方がいいって、自分に言い聞かせて……応援してた……。#nツクヨは、ステージの上で本当に輝いてたから。"
"10051100-132-ミチル" = "でも……。"
"10051100-133-ミチル" = "でも、やっぱり……ツクヨに戻ってきてほしかった……！"
"10051100-134-ミチル" = "一緒に活動してた時間が楽しかったから！"
"10051100-135-ミチル" = "だから……だから……！"
"10051100-136-ツクヨ" = "部長……。"
"10051100-137-ツクヨ" = "ところで、ツクヨ殿。"
"10051100-138-イズナ" = "今、下敷きになっている人……もぞもぞ動いています！"
"10051100-139-ミチル" = "はっ……！"
"10051100-140-ツクヨ" = "い、いけない、すっかり忘れてました……！"
"10051100-141-ツクヨ" = "……あれ？#nこの人……どこかで見たような……？"
"10051100-142-ミチル" = "あ……！"
"10051100-143-ミチル" = "この前のショーの時！#n戦闘に巻き込まれて運ばれてったモデルだ！"
"10051100-144-イズナ" = "イズナも思い出しました！#nこの人が搬送されたから、代わりにツクヨ殿が出ることになったんです！"
"10051100-145-ツクヨ" = "な、なんでこの人がまた……？"
"10051100-146-倒れていたモデル" = "うう……頭が……。"
"10051100-147-倒れていたモデル" = "ま、待って、私の爆弾はどこ！？"
"10051100-148-ツクヨ" = "ば、爆弾は、私たちが押収しました。"
"10051100-149-ツクヨ" = "どうして、こんなことを……？"
"10051100-150-倒れていたモデル" = "どうして？よく言うわよ。"
"10051100-151-倒れていたモデル" = "全部、あんたのせいじゃない！"
"10051100-152-ツクヨ" = "はい！？"
"10051100-153-倒れていたモデル" = "あの日、あんたが私の居場所を奪ったのよ！"
"10051100-154-倒れていたモデル" = "ステージも、衣装も、スポットライトも、称賛も……。"
"10051100-155-倒れていたモデル" = "本当は全部、私のものだったのに！"
"10051100-156-ミチル" = "なに言ってるのさ。#nツクヨだって、あの時は望んでステージに立ったわけじゃないのに。"
"10051100-157-倒れていたモデル" = "う、うるさいっ……！"
"10051100-158-倒れていたモデル" = "とにかく……爆弾1つ奪われたぐらいで、私は屈しない！"
"10051100-159-倒れていたモデル" = "もう終わりよ！このファッションショーをぶっ壊してやるんだから！"
"10051100-160-ミチル" = "もう十分壊してると思うけど！？"
"10051100-161-倒れていたモデル" = "うるさい！こっちよ、魑魅一座！！"
"10051100-162-ミチル" = "そ、外から魑魅一座が大勢押し寄せています！"
"10051100-163-ミチル" = "まさか、あいつが全部雇ったの……？"
"10051100-164-ミチル" = "ということは……呉服屋さんで騒いでた魑魅一座も……。"
"10051100-165-ミチル" = "シャインキャットさんの配達員を襲ってたのも……？"
"10051100-166" = "[s1] \"ニヤも言ってたね。\"\n[s2] \"最近、魑魅一座の暴走が増えてるって……。\""
"10051100-167-倒れていたモデル" = "あはははっ！正解だよ、デコボコの忍者さんたち！"
"10051100-168-倒れていたモデル" = "そう！魑魅一座を雇ったのは私！全部私が仕組んだの！"
"10051100-169-倒れていたモデル" = "外から少しずつこのショーをぶっ壊すためにね！！"
"10051100-170-ツクヨ" = "ぶ、部長、敵が多すぎます……！"
"10051100-171-ミチル" = "大丈夫だよ、ツクヨ。"
"10051100-172-ミチル" = "指揮、お願いしていいかな、先生殿？"
"10051100-173" = "[s] \"もちろん！\""
"10051100-174-ミチル" = "よし、忍術研究部！"
"10051100-175-ミチル" = "いくよ！！"
