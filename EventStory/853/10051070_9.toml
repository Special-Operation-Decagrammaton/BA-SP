[translation]
"10051070-1" = "第7話;見知らぬ空白"
"10051070-2" = "「少女忍法帖ミチルっち」撮影現場"
"10051070-3-ニヤ" = "にゃはは～。どうも。"
"10051070-4-ニヤ" = "カメラからドレスまで……お貸ししたものがしっかり活用されているのを見ると、こちらとしても嬉しくなりますね。"
"10051070-5-イズナ" = "ニヤ殿……！"
"10051070-6-イズナ" = "もしやドレスを回収しにいらしたのですか！？"
"10051070-7-ニヤ" = "いえいえ、返却は都合のいい時で構いませんよ。"
"10051070-8-イズナ" = "それなら、ゲスト出演でしょうか！？"
"10051070-9-イズナ" = "忍の道はいつでも開かれていますよ！にんにん！"
"10051070-10-ニヤ" = "生憎、それもハズレでして……。"
"10051070-11-ミチル" = "じゃあ陰陽部の部長が何の用なのさ。ただの偶然？"
"10051070-12-ニヤ" = "まぁ、通りすがり……みたいなものでしょうか。"
"10051070-13-ニヤ" = "それより……やはり、ツクヨさんはいらしていないようですね。"
"10051070-14-ミチル" = "そうなの。しかも、ずっと連絡が取れないんだよね……。"
"10051070-15-ミチル" = "……ん？「やっぱり」ってどういう意味？"
"10051070-16-ニヤ" = "ああ、ツクヨさんは忍術研究部を抜けたと伺ったので。"
"10051070-17-イズナ" = "えええぇっ！？"
"10051070-18-ミチル" = "そ、そんなの聞いてないんだけど！？"
"10051070-19-ニヤ" = "その反応も予想通りと言いますか……。"
"10051070-20-ニヤ" = "みなさん、忍者以外には興味がなさそうですからね……。"
"10051070-21-ミチル" = "えっ？いやいやいや！冗談だよね？"
"10051070-22-ミチル" = "だって私は部長だよ！？部長が知らないってどういうこと！？"
"10051070-23-ニヤ" = "ん～、「ron-ro」とか「ハートガールズ」って雑誌、読んでたりします？"
"10051070-24-ミチル" = "何それ？"
"10051070-25-ニヤ" = "では「BiBi」もご存じないでしょうね……SNSはやってますか？"
"10051070-26-ミチル" = "「少女忍法帖ミチルっち」チャンネルなら運営してるよ。"
"10051070-27-ニヤ" = "つまり、SNSもやってない、と。#nそれなら当然、あの番組もご覧になっていないのでしょうね。"
"10051070-28-ミチル" = "何の話？"
"10051070-29-ニヤ" = "百聞は一見に如かず。こちらは、クロノスチャンネルにアップされた動画です。"
"10051070-30-シノン" = "では最後の質問です！#nツクヨさんの今後の目標を、一言で教えていただけますか！"
"10051070-31-ツクヨ" = "あ、あの……これから、か、かっこいいファッションモデルになれるよう、#n頑張り、ます……！"
"10051070-32-シノン" = "そんなツクヨさんのこれからの活躍、楽しみに――"
"10051070-33-ミチル" = "え……。"
"10051070-34-ミチル" = "こ、これって……。"
"10051070-35-ミチル" = "え……？ツクヨが、モデル……？#nずっと……モデル活動するってこと？"
"10051070-36-イズナ" = "部長……。"
"10051070-37-ニヤ" = "……。"
"10051070-38-ミチル" = "なんで……いつからなの……？"
"10051070-39-ニヤ" = "先日のファッションショーで、ツクヨさんが代理モデルとして出演したそうですね。"
"10051070-40-ニヤ" = "あの時のステージ、ファッション業界では大反響だったそうで～"
"10051070-41-ニヤ" = "おそらくはその直後、「シャインキャット・エージェンシー」がスカウトしたようです。"
"10051070-42-ニヤ" = "まさか、丸っきりご存知ないとは思いませんでしたが。"
"10051070-43-ミチル" = "……。"
"10051070-44-ミチル" = "全然知らなかった……。"
"10051070-45-ニヤ" = "……この話をするには、少し時期が悪かったかもしれませんね。"
"10051070-46-ニヤ" = "では、今日はこれで失礼します。"
"10051070-47-イズナ" = "部長……ツクヨ殿は……。"
"10051070-48-ミチル" = "イズナ……あのステージに立ってたツクヨの姿、覚えてる？"
"10051070-49-イズナ" = "……もちろんです。"
"10051070-50-ミチル" = "どうだった？"
"10051070-51-イズナ" = "……綺麗だな、って思いました。"
"10051070-52-ミチル" = "それから？"
"10051070-53-イズナ" = "それから……うぅ……。"
"10051070-54" = "まるで、別世界の人みたいだって思わなかった？"
"10051070-55-イズナ" = "……！"
"10051070-56-ミチル" = "私たちはステージの下、一番暗い隅っこから見上げてて――"
"10051070-57-ミチル" = "ツクヨは、ステージの一番高くて明るい場所に立ってた。"
"10051070-58-イズナ" = "でも部長……忍者とは、一番暗いところで熱い心を灯す存在……ですよね？"
"10051070-59-ミチル" = "うん。だからこそ……ツクヨは、私たちのことを……。"
"10051070-60-ミチル" = "あ、そうそう。1つ言い忘れてました。"
"10051070-61-ミチル" = "うにゃぁっ！？"
"10051070-62-ミチル" = "まだ帰ってなかったの！？"
"10051070-63-ミチル" = "ええ。真の目的を果たしていなかったなと思いまして、にゃはは。"
"10051070-64-ミチル" = "目的？さっき通りすがりって……。"
"10051070-65-ミチル" = "意図された偶然ってあるじゃないですか～"
"10051070-66-ミチル" = "……全然意味わかんない！"
"10051070-67-ミチル" = "意図があるなら、それもう偶然じゃないよね！？"
"10051070-68-ミチル" = "こういう言葉遊びが必要な場もあるというわけでして～"
"10051070-69-ミチル" = "まぁ、今はまったく必要無いので、本題に入りましょうか。#nツクヨさんは今日の撮影を欠席されるみたいですので――"
"10051070-70-ニヤ" = "良かれと思って、代わりの撮影アシスタントを手配しておきました！"
"10051070-71-ミチル" = "撮影アシスタント……ですか！？"
"10051070-72-ミチル" = "えっと……ニヤらしくない気配りはありがたいけど……。"
"10051070-73-ミチル" = "でも、ツクヨの代わりって、簡単じゃ――"
"10051070-74" = "[ns] \"こんにちは。本日限定の臨時アシスタントです。\""
"10051070-75-ミチル" = "どっひゃぁああ！？"
"10051070-76-イズナ" = "主殿！"
"10051070-77-ミチル" = "いきなり出てくるなんて心臓に悪いでしょ！"
"10051070-78" = "[s1] \"これもアンブッシュかな。\"\n[s2] \"挨拶の前の1度だけなら、許されていたのでは？\""
"10051070-79-ミチル" = "流石は先生殿！私の教えをちゃんと覚えて――"
"10051070-80-ミチル" = "……ってそうじゃなくて！#nニヤ、まさか先生殿を撮影アシスタントにしたの？どうやって！？"
"10051070-81-ニヤ" = "にゃはは、細かいことはいいじゃないですか～"
"10051070-82-ニヤ" = "では、用事は済みましたので、今度こそ失礼します～"
"10051070-83-イズナ" = "主殿！お会いできて嬉しいです！"
"10051070-84-イズナ" = "不意打ちだと感動も一入です！ニンニン！"
"10051070-85-ミチル" = "先生殿が撮影に加わるなんて……。"
"10051070-86-ミチル" = "これは予想外すぎる展開だよ……。"
"10051070-87-ミチル" = "えっと、それじゃあ……撮影を始めてもいいのかな……？"
"10051070-88-ミチル" = "ん？ツクヨ抜きでいいのか、って？"
"10051070-89-ミチル" = "良くは無いけど……電話は繋がらないし、モモトークには返信無いし……#n居場所すら分からないから、どうしようもなくて……。"
"10051070-90" = "[s3] \"ツクヨの居場所はわからないけど……。\"\n[s4] \"連絡を取る方法ならあるよ。\""
"10051070-91-ミチル" = "ツクヨに連絡取れるの！？"
"10051070-92-イズナ" = "本当ですか！？"
"10051070-93-ミチル" = "ど、どうやって！？"
"10051070-94" = "[s] \"ニヤから、マネージャーの連絡先をもらったんだ。\""
"10051070-95-ミチル" = "……！"
"10051070-96-イズナ" = "部長！今すぐ電話しましょう！"
"10051070-97-ミチル" = "もちろん！"
"10051070-98-ミチル" = "その前に……すぅぅ……はぁぁ……。"
"10051070-99" = "[s] \"深呼吸してるの？\""
"10051070-100-ミチル" = "知らない人に電話するのって怖いから……じゃなくて、慎重にいかなきゃだから！"
"10051070-101-ミチル" = "それじゃあ……先生殿から教えてもらった番号に電話を……ふぅぅ……。"
"10051070-102" = "プルルルル……。"
"10051070-103" = "カチッ。"
"10051070-104-マネージャー" = "はい、もしもし。"
"10051070-105-ミチル" = "あ……あの、こんにちは！"
"10051070-106-マネージャー" = "はい？どちら様ですか？"
"10051070-107-ミチル" = "そ、そうだ！実はその、ツクヨという忍者……じゃなくて、モデルさん、そちらにいますか？"
"10051070-108-マネージャー" = "ツクヨですか？"
"10051070-109-マネージャー" = "……ああ、また記者か。"
"10051070-110-マネージャー" = "いいですか？記者会見も行いましたし、プレスリリースも出してますよね？"
"10051070-111-マネージャー" = "今は少し手が離せませんので、これで失礼します。"
"10051070-112-ミチル" = "ちょ、ちょっと待って！私は記者じゃないの！"
"10051070-113-ミチル" = "私は[ruby=ちどり]千鳥[/ruby]ミチル！ツクヨの友達だよ！！"
"10051070-114-マネージャー" = "あなたが……ミチルさん？"
"10051070-115-ミチル" = "えっ？私のこと知ってるの？"
"10051070-116-ミチル" = "まさか、「少女忍法帖ミチルっち」のチャンネル登録者……！？"
"10051070-117-マネージャー" = "にんぽ……なんですって？"
"10051070-118-マネージャー" = "すみませんが、そのようなチャンネルは存じ上げません。#nあなたの名前を知ってるのは、ツクヨさんが話してたからです。"
"10051070-119-マネージャー" = "それで、用件は何ですか？"
"10051070-120-ミチル" = "そ、そう！用件！あなた達、ツクヨに何をしたの！？"
"10051070-121-マネージャー" = "はい？"
"10051070-122-ミチル" = "電話に出ないし、モモトークも既読にならないんだよ！"
"10051070-123-マネージャー" = "ああ、そんなことで……。"
"10051070-124-ミチル" = "そんなこと……？"
"10051070-125-マネージャー" = "仕事に集中してもらうために連絡を遮断するのは、プロの世界ではよくあることです。"
"10051070-126-マネージャー" = "今は、ツクヨさんのスマートフォンを一時的にお預かりしています。"
"10051070-127-ミチル" = "預かってる！？"
"10051070-128-マネージャー" = "それに今、ツクヨさんがどれだけ真剣に撮影に取り組んでるか、わかってますか？"
"10051070-129-ミチル" = "ツクヨが……？"
"10051070-130-マネージャー" = "ええ。ですから、お話はここまでにさせていただきます。"
"10051070-131-ミチル" = "ちょっ、ちょっと待って！少しでいいからツクヨと話を――"
"10051070-132-マネージャー" = "ツクヨさんについてはご心配なく。今晩、私たちのチャンネルで撮影風景の動画が公開されますので、そちらをご確認ください。"
"10051070-133-マネージャー" = "それでは、失礼します。"
"10051070-134-イズナ" = "ぶ、部長……。"
"10051070-135-ミチル" = "……。"
"10051070-136-ミチル" = "よし、もう泣き言はおしまい。"
"10051070-137-イズナ" = "部長！？"
"10051070-138-ミチル" = "ツクヨだって今日、動画をアップするって言ってたじゃん。#nだったら私たちも負けてられない！"
"10051070-139-ミチル" = "ツクヨがいなくても……今の私たちにできることをやろう！"
"10051070-140-ミチル" = "何より、先生殿も手伝ってくれるんだし！#n……ね？"
"10051070-141" = "[s] \"もちろん！\""
"10051070-142-ミチル" = "じゃあイズナ……撮影準備だ！"
"10051070-143-イズナ" = "はいっ！部長！"
"10051070-144-ミチル" = "――さて、今日の「少女忍法帖ミチルっち」のテーマは！#n……潜入状況での忍法！"
"10051070-145-ミチル" = "どこにどんな暗器を仕込むべきか、どの流派の技を活用するべきか！"
"10051070-146-ミチル" = "そのすべてを！私が――"
"10051070-147-ミチル" = "私……が……。"
"10051070-148-ミチル" = "……。"
"10051070-149" = "[s] \"ミチル、大丈夫？\""
"10051070-150-イズナ" = "部長……やっぱり、今日の撮影は別の日に延期した方が……。"
"10051070-151-ミチル" = "ふぅぅ……。"
"10051070-152-ミチル" = "いや、撮影は……このまま続ける……！"
