[translation]
"10051045-1-ヘルメット団幹部" = "くっ……悔しい……！"
"10051045-2-ミチル" = "やった……。"
"10051045-3-ミチル" = "ふふふ……見よ、すべての者たちよ……！#n最後まで立っていられるのは――忍者なのだ！！"
"10051045-4-イズナ" = "お疲れさまでした！ニンニン！"
"10051045-5" = "[s] \"怪我はない？\""
"10051045-6-ミチル" = "先生のおかげで、みんな無事、です……！"
"10051045-7-ミチル" = "まぁ、あっちは無事じゃなさそうだけど……。"
"10051045-8-ミチル" = "それにしても、こんなに大勢で衣装を盗みに来るなんて、すごい執念だよね……。"
"10051045-9-イズナ" = "部長！まずは衣装を回収しましょう！"
"10051045-10-ミチル" = "あっ、そうだった！そのために探してたんだもんね。"
"10051045-11-ツクヨ" = "ふ、服は、あのバッグの中、だと思います……。#n最後まで、大切そうに抱えてた、ので……。"
"10051045-12-ミチル" = "えーっと……おっ！カバンは無事みたいだね。"
"10051045-13-ミチル" = "これで目的の物は確保完りょ――"
"10051045-14-ミチル" = "……あれ？#n地面に倒れてるこの人……誰？"
"10051045-15-正体不明の生徒" = "……。"
"10051045-16-正体不明の生徒" = "せ、戦闘が始まったときには、いなかったような……？"
"10051045-17-正体不明の生徒" = "イズナも心当たりはありません！"
"10051045-18-正体不明の生徒" = "なんだろ、戦闘に巻き込まれた一般人かな？"
"10051045-19-正体不明の生徒" = "とりあえず手当てを――"
"10051045-20-シャインキャット" = "ちょっと、私の作品は見つかったの？"
"10051045-21-ミチル" = "あ、うん。ちゃんと取り返したよ。"
"10051045-22-シャインキャット" = "よくやってくれた。これで一件落着だね。"
"10051045-23-シャインキャット" = "カバンの中身は……うん？#nちょっと待って……そこに倒れてるのって……。"
"10051045-24-シャインキャット" = "そ、そんな……!"
"10051045-25-シャインキャット" = "そんなあああぁぁぁ――――！！！"
