[translation]
"10051010-1" = "第1話;断れない申し出"
"10051010-2" = "百鬼夜行・第38旧校舎のとある教室"
"10051010-3" = "（ラーメン屋での騒動から一夜明けて、翌日……）"
"10051010-4-ツクヨ" = "部長……どういうご用件、でしょうか？"
"10051010-5-ツクヨ" = "じ、重大発表って……。"
"10051010-6-イズナ" = "あっ！カメラの修理が終わったんですか！？"
"10051010-7-ミチル" = "そ、それはまだで……。"
"10051010-8-ミチル" = "いい修理屋がなかなか見つからなくてさ、あはは。"
"10051010-9-ミチル" = "……まぁ、修理代が出せないだけなんだけど。"
"10051010-10-ツクヨ" = "では……まさか廃部命令が……！？"
"10051010-11-ミチル" = "ないない。"
"10051010-12-ミチル" = "そもそも私たちは正式な部活じゃないし。廃部も何もないでしょ。"
"10051010-13-ミチル" = "2人に集まってもらった真の目的は――"
"10051010-14-ミチル" = "陰陽部に呼び出されたから、何の話か共有しようと思ってさ。"
"10051010-15-イズナ" = "や、やっぱり、昨日の騒動についてでしょうか……。"
"10051010-16-イズナ" = "それはないと思います！"
"10051010-17-イズナ" = "あれは正当防衛でした！"
"10051010-18-イズナ" = "まぁ、ラーメン屋のことではあるんだよね……。"
"10051010-19-イズナ" = "はい？"
"10051010-20-イズナ" = "昨日の件、ニヤの耳に入ったんだってさ。"
"10051010-21-イズナ" = "えええっ！？"
"10051010-22-ミチル" = "それで、話したいことがあるから今日中に陰陽部に来てくれ、って。"
"10051010-23-ミチル" = "あ、できるだけ内密に。っていう一言も添えてね。"
"10051010-24-ツクヨ" = "そ、それって……。"
"10051010-25-ツクヨ" = "何か厄介なことを押し付けられるんじゃ……。"
"10051010-26-ミチル" = "うーん、流石にそんなことはしないと思いたいけど……。"
"10051010-27-ミチル" = "いや、あの陰険部長だしなぁ……。"
"10051010-28-ミチル" = "とにかく！詳しいことは、帰ってきたら話すよ！"
"10051010-29-イズナ" = "が、頑張って……ください！"
"10051010-30-イズナ" = "行ってらっしゃいませ！ニンニン！"
"10051010-31" = "陰陽部・部室"
"10051010-32-ニヤ" = "ご足労をおかけしてすみません。忍術研究部の部長さん。"
"10051010-33-ニヤ" = "昨日のラーメン屋での戦い……いやぁ、実にお見事でした。"
"10051010-34-ミチル" = "あのお店にいたの？なんで？"
"10051010-35-ニヤ" = "ラーメン屋は、ラーメンを食べるところでは？"
"10051010-36-ミチル" = "え、ニヤもラーメン食べるんだ……。"
"10051010-37-ミチル" = "なんか、懐石料理とか食べてそうなイメージだけど……。"
"10051010-38-ニヤ" = "まさかぁ、そんなに高尚なものじゃございませんよ。"
"10051010-39-ニヤ" = "ともあれ、花火を使った……#nあの大雑把な忍法、とても楽しませてもらいました。にゃはは。"
"10051010-40-ミチル" = "大雑把ってなにさ！"
"10051010-41-ニヤ" = "はて。「大雑把さ」も、戦術の一部だったのでは？"
"10051010-42-ニヤ" = "花火で視線を誘導し、隙を突いて背後を取る……まさに声東撃西の戦法。"
"10051010-43-ニヤ" = "しかも店主の安全にまで配慮を欠かさない……。"
"10051010-44-ニヤ" = "私は非常に感銘を受けましたよ？"
"10051010-45-ミチル" = "そ、それは……。"
"10051010-46-ミチル" = "その通り！"
"10051010-47-ミチル" = "見る目あるじゃん！"
"10051010-48-ニヤ" = "にゃははっ、やはりそうでしたか。"
"10051010-49-ニヤ" = "あれほどのチームプレイ、一朝一夕にできるものではありません。"
"10051010-50-ニヤ" = "素早い判断、勇敢な行動、そして流れるような連携――"
"10051010-51-ニヤ" = "日頃からどれほど過酷な訓練を積んでいるか、よくわかりました。"
"10051010-52-ミチル" = "あ……ありがと……？"
"10051010-53-ミチル" = "（訓練なんか別にしてないんだけど！？）"
"10051010-54-ミチル" = "（付き合いが長いから息が合ってるだけで……）"
"10051010-55-ミチル" = "（っていうか、今日に限ってやたらと褒めてくる……）"
"10051010-56-ミチル" = "（何か企んでないと、こんなこと言うタイプじゃないよね？）"
"10051010-57-ニヤ" = "では、前置きはこの辺で。"
"10051010-58-ミチル" = "ひっ！？"
"10051010-59-ニヤ" = "本題に入りましょうか。"
"10051010-60-ニヤ" = "単刀直入に言うと、[ruby=あなた方]忍術研究部[/ruby]の力をお借りしたいのです。"
"10051010-61-ミチル" = "……え？"
"10051010-62-ミチル" = "あれ？処分とかの話じゃないの？"
"10051010-63-ニヤ" = "はい？"
"10051010-64-ニヤ" = "騒動を収めた立役者だというのに、処分される筋合いはないのでは？"
"10051010-65-ミチル" = "え、あ……。"
"10051010-66-ミチル" = "なんで正論言ってくるのさ……！"
"10051010-67-ニヤ" = "別に、今日に限った話ではないと思いますけどねぇ。"
"10051010-68-ニヤ" = "こほん、話を戻しましょう。#n陰陽部は、あなた方の力をお借りしたいと考えています。"
"10051010-69-ニヤ" = "極めて重要な――護衛任務の依頼がありまして。"
"10051010-70-ミチル" = "護衛……！？"
"10051010-71-ニヤ" = "シャインキャット――この名前はご存じですか？"
"10051010-72-ミチル" = "シャインキャット……？"
"10051010-73-ミチル" = "ごめん、初耳。"
"10051010-74-ニヤ" = "では、ご説明から。"
"10051010-75-ニヤ" = "シャインキャットとは、キヴォトスで最も名の知れたファッションデザイナーです。"
"10051010-76-ニヤ" = "少しでもファッションに興味があれば、知らない人はいないでしょう。"
"10051010-77-ニヤ" = "大型ファッションショーのスケジュールも、その一言で動くほど。"
"10051010-78-ニヤ" = "シャインキャットが来なければ、ショーは始まらない――#nそんな暗黙の了解さえ存在するのだとか。"
"10051010-79-ニヤ" = "そしてこの度、百鬼夜行で行われるファッションショーに出席することが決まりました。"
"10051010-80-ニヤ" = "というわけで……。"
"10051010-81-ニヤ" = "その護衛を、忍術研究部にお任せしたいのです！"
"10051010-82-ミチル" = "おぉ……！"
"10051010-83-ミチル" = "……ん？#nちょ、ちょっと待って！？なんか話飛びすぎじゃない！？"
"10051010-84-ニヤ" = "そうでしょうか？"
"10051010-85-ニヤ" = "ラーメン屋の一件で、この任務に最適だと判断したのですが……。"
"10051010-86-ニヤ" = "何か問題でも……？"
"10051010-87-ミチル" = "評価してくれるのはありがたいけど……。"
"10051010-88-ミチル" = "こういうのは百花繚乱の子たちの方が向いてるんじゃない！？"
"10051010-89-ミチル" = "も、もちろん、最後に残るのは忍者だって思ってるけどさ……！？"
"10051010-90-ニヤ" = "ふむ……[ruby=・]純[/ruby][ruby=・]粋[/ruby][ruby=・]な[/ruby][ruby=・]戦[/ruby][ruby=・]闘[/ruby][ruby=・]力[/ruby]であれば、あちらに軍配が上がるでしょうね。"
"10051010-91-ニヤ" = "ですが戦闘力だけで護衛を選ぶなら、会場に燃料気化爆弾でも置いておけば済む話じゃないですか？"
"10051010-92-ミチル" = "そういう理屈になるの……？"
"10051010-93-ニヤ" = "ええ。優れた護衛とは、戦闘力だけで語れるものではありません。"
"10051010-94-ニヤ" = "迅速さ、隠密性、そして綿密な連携――"
"10051010-95-ニヤ" = "多くの人が集まる場では、そういった要素こそ重要になります。"
"10051010-96-ニヤ" = "そして私は、皆さんに、その資質を見出しました。"
"10051010-97-ニヤ" = "……これでもご納得いただけませんか？"
"10051010-98-ミチル" = "たしかに、素早さと隠密行動は忍者の基本だけど……。"
"10051010-99-ニヤ" = "ああそれと、あまり重く考えなくていいですよ？"
"10051010-100-ニヤ" = "シャインキャット氏の身辺警護は、あちらの専属チームが担当します。"
"10051010-101-ニヤ" = "皆さんは、会場の人混みに紛れて警備にあたる――"
"10051010-102-ニヤ" = "いわゆる「アンダーカバー」を担っていただこうかと。"
"10051010-103-ミチル" = "アンダーカバー……！"
"10051010-104-ニヤ" = "もちろん、心ばかりですが謝礼もご用意しております。"
"10051010-105-ミチル" = "ほ、本当に！？"
"10051010-106-ニヤ" = "いやぁ～、滅相も無い。"
"10051010-107-ニヤ" = "権力を盾にタダ働きなんて……させるわけないじゃないですかぁ。"
"10051010-108-ミチル" = "ハッキリ否定されると、それはそれで怪しいんだけど……。"
"10051010-109-ミチル" = "で、その報酬って？"
"10051010-110-ニヤ" = "にゃはは。"
"10051010-111-ニヤ" = "陰陽部の倉庫には、色々な物が眠ってまして。"
"10051010-112-ニヤ" = "つい最近、保管状態の良いカメラが発見されたんですよ。"
"10051010-113-ミチル" = "カメラ？"
"10051010-114-ニヤ" = "そう、画質も良くて、バッテリーも大容量。"
"10051010-115-ニヤ" = "忍術研究部のカメラよりも、ハイスペックなんじゃないですかねぇ。"
"10051010-116-ミチル" = "……！"
"10051010-117-ニヤ" = "昨日、カメラが豚骨スープまみれになりましたよね？"
"10051010-118-ニヤ" = "となると、故障している可能性が高い――"
"10051010-119-ニヤ" = "新しいカメラが必要なのではないですか？"
"10051010-120-ミチル" = "なんでそこまで知ってるのさ……。"
"10051010-121-ニヤ" = "もしも依頼を受けてくだされば――そのカメラ、差し上げますよ。"
"10051010-122-ニヤ" = "共用の備品なので、お譲りすることはできませんが……。"
"10051010-123-ニヤ" = "「9999年レンタル」という扱いにしておけば問題ないでしょう。"
"10051010-124-ミチル" = "それ……返すより先に土に還るやつじゃん……。"
"10051010-125-ニヤ" = "それで、どうされますか？"
"10051010-126-ミチル" = "うーん……。"
"10051010-127-ミチル" = "忍者とは、困っている者を見捨てぬもの……。"
"10051010-128-ミチル" = "よしっ！その依頼、引き受けよう！"
"10051010-129-ミチル" = "……あ！断じて、カメラ目的じゃないからね！？"
"10051010-130-ミチル" = "もらえるなら、もちろんありがたくいただくけど！"
"10051010-131-ニヤ" = "にゃはは！では契約成立ということで。"
"10051010-132-ニヤ" = "ここからは――"
"10051010-133-ニヤ" = "依頼の「条件」についてお話しましょう。"
"10051010-134-ミチル" = "なにそのスーツケース！？"
"10051010-135-ニヤ" = "今回の依頼において、最も重要なものです。"
"10051010-136-ニヤ" = "任務の遂行にあたって、皆さんがクリアすべき条件――"
"10051010-137-ニヤ" = "それが、この中に詰まっています。"
"10051010-138-ミチル" = "そんな話聞いてないんだけど！？"
"10051010-139-ニヤ" = "ですが先ほど、契約は成立しました。"
"10051010-140-ニヤ" = "まさか忍者が、一度口にしたことを撤回したりは……しませんよねぇ？"
"10051010-141-ミチル" = "ぐっ……！"
"10051010-142-ニヤ" = "ふふ、それでは――"
"10051010-143" = "カチャッ……。"
"10051010-144-ニヤ" = "一緒に、中身を確認しましょうか。"
"10051010-145-ミチル" = "その前に1つ聞かせて。"
"10051010-146-ニヤ" = "はい？"
"10051010-147-ミチル" = "私だけを呼んだのって……このスーツケースのせい？"
"10051010-148-ニヤ" = "いいえ？"
"10051010-149-ミチル" = "じゃ、じゃあ……？"
"10051010-150-ニヤ" = "それは――"
"10051010-151-ニヤ" = "――面白いから？"
"10051010-152-ミチル" = "……。"
"10051010-153-ミチル" = "……さっさと開けて。"
