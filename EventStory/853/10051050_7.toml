[translation]
"10051050-1" = "第5話;花開く時"
"10051050-2" = "ファッションショー会場裏庭の森"
"10051050-3-シャインキャット" = "今回のショーは、もう終わりだ……！"
"10051050-4-ミチル" = "衣装は取り返せてるんだよね……？"
"10051050-5-シャインキャット" = "そうだね。だけど――"
"10051050-6-シャインキャット" = "ぜんっぜん、ありがたくなんかない！！"
"10051050-7-ミチル" = "ひ、ひえっ！？"
"10051050-8-シャインキャット" = "これ！どうするの！？#n衣装があっても、それを着るモデルが倒れてたら意味ないだろう！？"
"10051050-9-シャインキャット" = "君たちの戦闘のせいだ！！"
"10051050-10-ミチル" = "いやいや、それを私たちのせいにされても……。"
"10051050-11-ミチル" = "も、もしかして……倒れているこの方が……。"
"10051050-12-イズナ" = "今日のファッションショーに出演予定だったモデルさんですか！？"
"10051050-13-ミチル" = "そもそも！なんでこんなとこで倒れてるのさ！"
"10051050-14" = "[s] \"戦闘に巻き込まれたんじゃないかな……。\""
"10051050-15-ミチル" = "戦ったのは私たちとヘルメット団だけのはずだよ？#nこの人、どっから出てきたの……？"
"10051050-16-イズナ" = "部長！この方、衣装が入っているカバンに手を伸ばしたまま倒れています！"
"10051050-17-イズナ" = "つまり、倒れる直前までカバンを目指していたということ……！"
"10051050-18-イズナ" = "カバンを取り返そうと戦闘に飛び込んできて、流れ弾に当たったに違いありません！"
"10051050-19-ミチル" = "なるほど、それなら説明がつくね……！"
"10051050-20-ツクヨ" = "す、すごく論理的な推論です……！"
"10051050-21-ミチル" = "これぞ忍者らしい推理ってやつだよ！"
"10051050-22-シャインキャット" = "今は推理ごっこをしてる場合じゃない！それに、「忍者らしい」って何！？"
"10051050-23-シャインキャット" = "とにかく……ほら！起きて！君がこのショーの主役なんだから！#n起きなさい！お願いだから起きてぇぇぇ！！"
"10051050-24-シャインキャット" = "あの……すみませんが、そこをどいてください。#nその状態じゃあ、いくら揺さぶっても起きませんよ。"
"10051050-25-シャインキャット" = "何だって！？"
"10051050-26-シャインキャット" = "脳震盪です。#n見てください。顎と後頭部に、直撃した痕があります。"
"10051050-27-シャインキャット" = "無理に意識を戻しても、数時間は身体をまともに動かせないでしょう。"
"10051050-28-シャインキャット" = "そ、そんな……！"
"10051050-29-シャインキャット" = "それなら、自然に目覚めたとしても……ランウェイは無理ってこと？"
"10051050-30-シャインキャット" = "この状態の人をランウェイに立たせるつもりですか……？"
"10051050-31-シャインキャット" = "いいから、できるの？できないの？"
"10051050-32-シャインキャット" = "……かなりふらつくと思います。"
"10051050-33-シャインキャット" = "何より、今は安静にさせなければ。"
"10051050-34-シャインキャット" = "はぁ、そうか……。"
"10051050-35-シャインキャット" = "分かった。専門家がそう言うなら、それが正しいのだろうね……。"
"10051050-36-シャインキャット" = "それでは、搬送させていただきます。"
"10051050-37-シャインキャット" = "でも……私のショーはどうすれば……ああ……。"
"10051050-38-シャインキャット" = "……仕方ない、他に手が無いのだから。"
"10051050-39-シャインキャット" = "……君たち。"
"10051050-40-ミチル" = "はい！？"
"10051050-41-シャインキャット" = "……まあ、努力は認めよう。"
"10051050-42-シャインキャット" = "……もう少し射撃の腕が良ければ、言うこと無しだったんだけど。"
"10051050-43-シャインキャット" = "私は先に戻らせてもらうよ。"
"10051050-44" = "ファッションショー控室"
"10051050-45-シャインキャット" = "はぁ……。"
"10051050-46-シャインキャット" = "はあああぁぁぁぁ……。"
"10051050-47-シャインキャット" = "どうする……？差し迫ったショーをどうすればいいのか……。"
"10051050-48-スタッフ" = "あの、シャインキャット様……急いで、モデルの代役を手配するのはどうでしょうか？"
"10051050-49-シャインキャット" = "着眼点は悪くない。"
"10051050-50-シャインキャット" = "だが……ほら、この服、分かるだろうか？これを見て何を感じる？"
"10051050-51-スタッフ" = "え、ええと……とても、美しいです……？"
"10051050-52-シャインキャット" = "違う、サイズを見なさい、サイズを！この大きくて美しいサイズをよく見て！"
"10051050-53-シャインキャット" = "私は身長180cm級のモデルを想定して、この服をデザインしたんだ。"
"10051050-54-シャインキャット" = "で？控室に、そんなモデルがいるかい？"
"10051050-55-スタッフ" = "い、いませんっ！"
"10051050-56-シャインキャット" = "そう。180cm超えなんてそうそういない！そんな都合よく――"
"10051050-57-シャインキャット" = "……待って。1人……いたな。"
"10051050-58-スタッフ" = "えっ、誰のことですか？"
"10051050-59-シャインキャット" = "[ruby=おおの]大野[/ruby]ツクヨ。"
"10051050-60-スタッフ" = "誰です？それ。"
"10051050-61-シャインキャット" = "はぁ！？正面入口にいた警備員だよ！それに、さっきの現場にもいただろう！？"
"10051050-62-シャインキャット" = "君、ショーのスタッフのくせに、警備員の名前も覚えてないわけか！？"
"10051050-63-スタッフ" = "普通は一人ひとりなんて覚えませんよ……！"
"10051050-64-シャインキャット" = "いいから！あの子を連れてきなさい。今すぐ！！"
"10051050-65-スタッフ" = "えっ、本当に……？警備員をモデルにするんですか！？"
"10051050-66-シャインキャット" = "一目見たときから、私は見抜いていた。あの子には才能がある。#n身長だけじゃない。あの雰囲気、体のバランス……完璧だった。"
"10051050-67-シャインキャット" = "この服にふさわしいのは、彼女しかいない。"
"10051050-68-スタッフ" = "じ、冗談じゃないんですよね！？"
"10051050-69-シャインキャット" = "冗談を言ってるように見えるのか！？"
"10051050-70-スタッフ" = "い、いえ！すぐ連れてきます！！"
"10051050-71" = "ファッションショー会場裏庭の森"
"10051050-72-ツクヨ" = "え、ええっ！？わ、私がモデル……！？"
"10051050-73-スタッフ" = "はい、時間がないんです！"
"10051050-74-ツクヨ" = "で、でも……モデルの勉強なんてしたこと、ないんですけど……！？#n私、なんかが……舞台に立てるはず、ない……です。"
"10051050-75-スタッフ" = "私もそう思いますよ！？#nでも、シャインキャット様が「絶対連れてこい！」って……！"
"10051050-76-ツクヨ" = "ひ、ひえぇ……。"
"10051050-77-スタッフ" = "お願いです、人助けだと思って……！#nシャインキャット様はちゃんと報酬もくれますから……！"
"10051050-78-ツクヨ" = "う、うぅ……で、でも……！"
"10051050-79-スタッフ" = "控室の場所はご存知ですよね？#n私はあとで合流しますので、先に行っててください！"
"10051050-80-ツクヨ" = "ぶ、部長……どうしたらいいんでしょう……！"
"10051050-81-ツクヨ" = "こんな大きなショーで、私がモデルだなんて……。"
"10051050-82-ツクヨ" = "みんなきっと、私みたいに背ばっかり大きい子なんて、好きじゃない……。"
"10051050-83-ツクヨ" = "きっと、たくさんの人がブーイングして……。"
"10051050-84-ツクヨ" = "それで私は絶望して、部屋にこもって……#n「柴犬ワン蔵」監督の映画を見続けながら……ゆっくりと枯れていくんです……。"
"10051050-85-ツクヨ" = "いや、そんなことはないよ。"
"10051050-86-ミチル" = "ツクヨ。初めて会ったとき、私がなんて言ったか覚えてる？"
"10051050-87-ツクヨ" = "……体がすごく大きい、って。"
"10051050-88-ミチル" = "そ、そういうことも言ったけど！"
"10051050-89-ミチル" = "だからこそ、忍者として最強だって言ったじゃん！"
"10051050-90-ツクヨ" = "……！"
"10051050-91-ミチル" = "最強の忍者にとって、こんな困難なんて何でもないよ！"
"10051050-92-ツクヨ" = "部長……！"
"10051050-93-ミチル" = "それに、業界トップのデザイナーからのご指名だよ？"
"10051050-94-ミチル" = "胸を張っていこう！"
"10051050-95-ミチル" = "もしも上手くいかないことがあったとしても――"
"10051050-96-ミチル" = "こういうのは全部、主催者側の責任！これは先生殿の名言集にも書いてあるんだから！"
"10051050-97" = "[s1] \"そんなこと言ったっけ！？\"\n[s2] \"私の名言集なんて存在してるの！？\""
"10051050-98-ツクヨ" = "ふぅ……。"
"10051050-99-ツクヨ" = "……分かりました。私、やってみます！"
"10051050-100" = "ファッションショー控室"
"10051050-101-シャインキャット" = "入りなさい。"
"10051050-102-シャインキャット" = "来たね。覚悟はできたのかい？"
"10051050-103-ツクヨ" = "……はい！"
"10051050-104-シャインキャット" = "君には確かな才能がある。#nだけど、それだけで生きていけるほど、この道は甘くない。"
"10051050-105-シャインキャット" = "だからこそ、この道を最後まで歩ききることができたなら、栄光は君のものだ。#nこの私が保証しよう。"
"10051050-106-ツクヨ" = "そ、そんなの……望んでないですけど……。"
"10051050-107-シャインキャット" = "それより、今の格好……忍者だって言ってたかな。"
"10051050-108-シャインキャット" = "よく知らないけど、もうお別れだ。"
"10051050-109-シャインキャット" = "今日、君が輝かせるべき衣装は、私の作品なんだから。"
"10051050-110-シャインキャット" = "ほら、早く着替えてきなさい。更衣室はあっちだよ。"
"10051050-111-ツクヨ" = "あの……。"
"10051050-112-シャインキャット" = "なに？時間がないから、手短にね。"
"10051050-113-ツクヨ" = "そ……その、モデルをやるのは……今日だけ、です……。"
"10051050-114-ツクヨ" = "この任務が終わったら、私は忍術研究部に戻りますから……！"
"10051050-115-ツクヨ" = "……着替えてきます。"
"10051050-116-シャインキャット" = "ふふ……。"
"10051050-117-シャインキャット" = "……世間が、それを許すかな？"
"10051050-118" = "ファッションショーメインステージ"
"10051050-119-ミチル" = "ツクヨ……上手くやってるかな……。"
"10051050-120-イズナ" = "どんな姿でステージに現れるのでしょうか？"
"10051050-121-イズナ" = "イズナ、ワクワクしてきました！"
"10051050-122-ミチル" = "あ、そろそろ始まるみたい！"
"10051050-123-イズナ" = "……部長。"
"10051050-124-ミチル" = "……うん？"
"10051050-125-イズナ" = "私たち……今、何を見たんでしょう……？"
"10051050-126-ミチル" = "うーん……。"
"10051050-127-ミチル" = "……芸術？"
