[translation]
"10051030-1" = "第3話;才能との邂逅"
"10051030-2" = "陰陽部・部室"
"10051030-3-ニヤ" = "なるほど。昨日の今日でそんなことが。"
"10051030-4-ミチル" = "うん……成り行きで……。"
"10051030-5-ニヤ" = "ドレスは修理していただいたので、問題ありませんが……。"
"10051030-6-ニヤ" = "ですが困りましたね……#n陰陽部には、あれより大きいドレスはもう無いんですよ。"
"10051030-7-ミチル" = "ええっ！？"
"10051030-8" = "[s] \"近くのお店で買ったりはできないの？\""
"10051030-9-ニヤ" = "既にブティックには連絡したんですけど……。"
"10051030-10-ニヤ" = "ツクヨさんのサイズとなると、オーダーメイドじゃないと厳しいみたいでして。"
"10051030-11-ミチル" = "じゃあ、今すぐ注文を――！"
"10051030-12-ニヤ" = "イベント開始は1時間後なのに？"
"10051030-13-ミチル" = "はっ……！"
"10051030-14-ニヤ" = "仕方ありません。"
"10051030-15-ニヤ" = "こうなってしまった以上、手は1つだけです。"
"10051030-16-ミチル" = "方法があるの！？"
"10051030-17-ニヤ" = "もちろん。"
"10051030-18-ニヤ" = "ただ……ちょっと胸が痛むやり方ではありますが……。"
"10051030-19-ミチル" = "うん……？"
"10051030-20" = "（1時間後……）"
"10051030-21" = "（忍術研究部の護衛任務が始まった）"
"10051030-22" = "ファッションショー宴会会場内部"
"10051030-23-ミチル" = "わっ、人がいっぱい……頭がクラクラする……。"
"10051030-24-ミチル" = "でも、やることやらないと！"
"10051030-25-ミチル" = "応答せよ、アンダーカバー02。聞こえてる？"
"10051030-26-イズナ" = "はいっ！こちらアンダーカバー02、よく聞こえます！"
"10051030-27-ミチル" = "現在位置は？"
"10051030-28-イズナ" = "指示通り、宴会場の東側で待機中です！"
"10051030-29-ミチル" = "了解、引き続きよろしく！"
"10051030-30-ミチル" = "イズナは大丈夫そうだね。次は……。"
"10051030-31-ミチル" = "アンダーカバー03、聞こえるかな？"
"10051030-32" = "ファッションショー宴会会場正面玄関"
"10051030-33-ツクヨ" = "は、はい、アンダーカバー03です……聞こえて、ます……。"
"10051030-34-ツクヨ" = "か、会場の正面入口で待機中です……。"
"10051030-35-ミチル" = "ツクヨ、ごめんね……。"
"10051030-36-ミチル" = "1人だけ会場の外になっちゃって……。"
"10051030-37-ミチル" = "ドレスを着てないと会場内には入れない、って主催側が言ってて……。"
"10051030-38-ツクヨ" = "ぶ、部長が謝ることじゃ、ありません！"
"10051030-39-ツクヨ" = "私が、大きすぎただけ、ですから……。"
"10051030-40-ツクヨ" = "ふ、普段着のほうが落ち着きますし……！"
"10051030-41-ミチル" = "そう言ってくれてありがとね。"
"10051030-42-ミチル" = "よしっ！任務が無事に終わったら、ラーメン食べに行こう！"
"10051030-43-ミチル" = "この前の撮影のリベンジもしないとだし！"
"10051030-44-ツクヨ" = "は、はい！"
"10051030-45-ツクヨ" = "麺は極太！背脂追加！仕上げにラー油を――"
"10051030-46-ツクヨ" = "あっ！"
"10051030-47-ミチル" = "どうしたの！？"
"10051030-48-ツクヨ" = "し、シャインキャットさんが到着しました！"
"10051030-49-ミチル" = "VIP到着確認！各自、配置につけ！"
"10051030-50-ミチル" = "……これで合ってるよね？"
"10051030-51-ツクヨ" = "（落ち着いて、落ち着いて……！）"
"10051030-52-ツクヨ" = "（怪しい人がいないかだけ、ちゃんと見ていれば大丈夫……！）"
"10051030-53-シャインキャット" = "君。"
"10051030-54-ツクヨ" = "は、はい！？"
"10051030-55-シャインキャット" = "ここで何をしているのかな？"
"10051030-56-ツクヨ" = "え、えっと……け、警備を……。"
"10051030-57-シャインキャット" = "もうすぐショーが始まるというのに？#nどうしてモデルが会場の外でうろうろしてるんだ？"
"10051030-58-ツクヨ" = "えっ！？"
"10051030-59-シャインキャット" = "驚いてる暇があるなら、さっさと控室に戻りなさい！"
"10051030-60-ツクヨ" = "あ、あ、あの……！"
"10051030-61-ツクヨ" = "わ、私はモデルじゃ、ないんです……けど！！"
"10051030-62-シャインキャット" = "そうなのかい？"
"10051030-63-シャインキャット" = "どう見てもモデルにしか見えないけど……。"
"10051030-64-ツクヨ" = "わ、私はただの警備担当で……。"
"10051030-65-ツクヨ" = "……そうか。"
"10051030-66-シャインキャット" = "私の勘違いだったのなら、すまなかった。"
"10051030-67-シャインキャット" = "でも……。"
"10051030-68-シャインキャット" = "はあ……もったいない。"
"10051030-69-シャインキャット" = "その体格、その資質……それで警備とはね……。"
"10051030-70-ツクヨ" = "はい……？"
"10051030-71-シャインキャット" = "ただの独り言だよ。"
"10051030-72-シャインキャット" = "気にしないでほしい。"
"10051030-73-シャインキャット" = "才能があるからといって、その道に進む必要があるわけじゃないからな。"
"10051030-74-シャインキャット" = "とはいえ……ふむ……。"
"10051030-75-ツクヨ" = "……？"
"10051030-76-ツクヨ" = "やっぱり、見逃すには惜しいね。"
"10051030-77-シャインキャット" = "君、名前は？"
"10051030-78-ツクヨ" = "はい！？"
"10051030-79-ツクヨ" = "お、[ruby=おおの]大野[/ruby]ツクヨ、です……。"
"10051030-80-ツクヨ" = "忍術研究部所属で、年齢は――"
"10051030-81-シャインキャット" = "ああ、所属なんてどうでもいい。"
"10051030-82-シャインキャット" = "大野ツクヨ。覚えておこう。"
"10051030-83-シャインキャット" = "君も、私のことを覚えておくといい。"
"10051030-84-シャインキャット" = "……はい、これ。"
"10051030-85-ツクヨ" = "め、名刺……！"
"10051030-86-シャインキャット" = "じゃあ、私はこれで。"
"10051030-87-ツクヨ" = "（い、今のは何だったんでしょう……？）"
"10051030-88-ツクヨ" = "（あんなすごい人が、私の名前を……？しかも名刺まで……？）"
"10051030-89-ツクヨ" = "（な、何を考えているのかまったく分かりません……）"
"10051030-90-ツクヨ" = "（うぅ……）"
"10051030-91-ツクヨ" = "（だ、ダメダメ、気にしちゃダメ！）"
"10051030-92-ツクヨ" = "（私は自分の任務をきっちり果たせばいいだけ……！）"
"10051030-93-ツクヨ" = "……よし！大野ツクヨ、外部警備作戦を開始します！"
"10051030-94" = "ファッションショー控室"
"10051030-95-シャインキャット" = "準備は順調？"
"10051030-96-スタッフ" = "もちろんです！すべて滞りなく！"
"10051030-97-シャインキャット" = "当然、衣装はちゃんと保管されてるだろうね？"
"10051030-98-シャインキャット" = "どれもこの世に1着しかない……替えが利かないのだから。"
"10051030-99-スタッフ" = "はいっ！奥の部屋にしっかりと！"
"10051030-100-スタッフ" = "直射日光が入らず、除湿・消臭も万全の環境です！"
"10051030-101-スタッフ" = "一度、確認されますか？"
"10051030-102-シャインキャット" = "あぁ、そうしよう。"
"10051030-103-シャインキャット" = "そろそろモデルたちが着替える時間だからね。"
"10051030-104-シャインキャット" = "衣装がある部屋はどこだ？"
"10051030-105-スタッフ" = "ご案内します。"
"10051030-106-スタッフ" = "こちらへどうぞ！"
"10051030-107-スタッフ" = "こちらが……あれっ？"
"10051030-108-スタッフ" = "鍵が……開いてる……？"
"10051030-109-シャインキャット" = "どうしたんだ？"
"10051030-110-スタッフ" = "い、いえ……なんでもありません！"
"10051030-111-スタッフ" = "衣装はこの部屋に……。"
"10051030-112-スタッフ" = "ひ、ひえええええっ……！"
"10051030-113-シャインキャット" = "な、何ごと！？"
"10051030-114-スタッフ" = "そ、そんなはずは……！"
"10051030-115-スタッフ" = "しゃっ、しゃっ、シャインキャット様ぁ……！"
"10051030-116-スタッフ" = "も、も、申し訳ございませんっ！！"
"10051030-117-スタッフ" = "大変です！！"
"10051030-118-シャインキャット" = "要領を得ないな……ちゃんと説明しなさい！"
"10051030-119-スタッフ" = "そ、それが……。"
"10051030-120-スタッフ" = "シャインキャット様の作品が……全部……！！"
"10051030-121-スタッフ" = "い、いや……これは夢だ、夢に違いない……！"
"10051030-122-シャインキャット" = "いいから、どきなさい！"
"10051030-123-シャインキャット" = "この部屋で、あってるんだよね……？"
"10051030-124-シャインキャット" = "私の作品はどこ……！？"
"10051030-125-スタッフ" = "も、申し訳ございません！#nついさっきまでは確かに……！"
"10051030-126-シャインキャット" = "つべこべ言わない！"
"10051030-127-シャインキャット" = "今すぐ犯人を捕まえてきなさい！！"
"10051030-128-スタッフ" = "はいっ！？"
"10051030-129-シャインキャット" = "言ってる意味がわからないのか！？#n私の作品を盗んだ犯人を！今すぐ！目の前に連れてこいと言っているんだ！！"
"10051030-130-シャインキャット" = "それができなければ、全員クビだ！分かった！？"
"10051030-131-スタッフ" = "ひ、ひぃっ！分かりました！！"
