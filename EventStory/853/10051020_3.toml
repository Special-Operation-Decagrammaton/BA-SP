[translation]
"10051020-1" = "第2話;依頼の条件"
"10051020-2" = "百鬼夜行・第38旧校舎のとある教室"
"10051020-3-ミチル" = "……と、いうわけで。#n護衛を任されることになったよ！"
"10051020-4-イズナ" = "おおおっ！"
"10051020-5-イズナ" = "さすがです、部長……！"
"10051020-6-ツクヨ" = "ご、護衛……。"
"10051020-7-ツクヨ" = "足を引っ張らないよう、私も頑張ります……！"
"10051020-8-ミチル" = "あ、あれ……？"
"10051020-9-ミチル" = "面倒なことを持ってきたって、怒られるかと思ってたんだけど……。"
"10051020-10-ツクヨ" = "まさか！"
"10051020-11-イズナ" = "これは、名高い御仁の護衛を通じて、忍術研究部の名を世に広める好機……！"
"10051020-12-イズナ" = "断る理由など、1つもございません！"
"10051020-13-ツクヨ" = "わ、私もそう思います……！"
"10051020-14-ミチル" = "ツクヨ……イズナ……。#nそれじゃあさ、ちょっと聞きたいんだけど……。"
"10051020-15-ミチル" = "2人はシャインキャットって知ってる？"
"10051020-16-イズナ" = "初めて聞きました！"
"10051020-17-ミチル" = "返事早っ！？"
"10051020-18-ミチル" = "え、じゃあ、知らないのになんで有名って分かったの？"
"10051020-19-イズナ" = "説明の中で部長が言っていたからです！"
"10051020-20-ミチル" = "あ、そっか。"
"10051020-21-ミチル" = "まぁ私も、ニヤから聞いて初めて知ったんだけど……。"
"10051020-22-ツクヨ" = "あ、あの……。"
"10051020-23-ツクヨ" = "私、知ってます……。"
"10051020-24-ミチル" = "おぉ……！"
"10051020-25-ツクヨ" = "古典美の現代的再解釈を斬新な様式で確立し――"
"10051020-26-ツクヨ" = "ふ、ファッション界のパラダイムを覆した方です……！"
"10051020-27-ツクヨ" = "だから、現存する全てのデザイナーのロールモデルとまで言われていて……。"
"10051020-28-ミチル" = "なんか詳しい……！"
"10051020-29-ツクヨ" = "そう、ですか……？"
"10051020-30-ミチル" = "ま、とにかく！賛成してくれてありがとう！"
"10051020-31-ミチル" = "だが！"
"10051020-32-ミチル" = "忍者とはプロ！プロとは、報酬なくして動かぬもの！"
"10051020-33-ミチル" = "ということで……じゃじゃーん！"
"10051020-34-ミチル" = "報酬の前払いとして、カメラをもらってきたよ！"
"10051020-35-ミチル" = "これで「少女忍法帖ミチルっち」の撮影を再開できるね！"
"10051020-36-ツクヨ" = "おおおっ！"
"10051020-37-ツクヨ" = "すごい、です……！"
"10051020-38-ツクヨ" = "これ、今までのものより、ずっと高性能です……！"
"10051020-39-ツクヨ" = "このカメラなら、もっと鮮明に部長の忍法を映せます！"
"10051020-40-ツクヨ" = "それに、防水機能付きです！"
"10051020-41-ツクヨ" = "ほ、本当ですね……！"
"10051020-42-ツクヨ" = "ということは……沸騰したラーメンのスープの中でも撮影できそうです！"
"10051020-43-ミチル" = "ふふ、喜んでもらえて何よりだよ。"
"10051020-44-ミチル" = "でも、忍者とは「忍」ぶ者……！"
"10051020-45-ミチル" = "だからこそ、喜びはひとまず脇に置いて――#n任務を完遂するためのブリーフィングを始める！"
"10051020-46-ツクヨ" = "はいっ！"
"10051020-47-ツクヨ" = "部長……！"
"10051020-48-ミチル" = "まずは、陰陽部から預かったものを見てみよう！"
"10051020-49-ツクヨ" = "スーツケース、ですか……？"
"10051020-50-イズナ" = "イズナ、ワクワクしてきました！"
"10051020-51-イズナ" = "中には一体何が……。"
"10051020-52-イズナ" = "もしかして、忍法が記された巻物ですか！？"
"10051020-53-ミチル" = "これに入っているのは、今回の任務の必須アイテム！"
"10051020-54-ミチル" = "それは――"
"10051020-55-ミチル" = "――ドレスだよ！"
"10051020-56-ツクヨ" = "ドレス……？"
"10051020-57-ツクヨ" = "ドレス……ですか……？"
"10051020-58-イズナ" = "おおっ！こんな華やかな衣装、初めて見ました！"
"10051020-59-ツクヨ" = "本当に綺麗……。"
"10051020-60-ツクヨ" = "わ、私の大きな身体には全然似合わないですけど……。"
"10051020-61-ミチル" = "えっと……まぁ、服自体は気に入ってくれたみたいでよかった。"
"10051020-62-ミチル" = "というのも、これ、私たちが着るんだよね。"
"10051020-63-イズナ" = "えええぇぇぇっ！？"
"10051020-64-イズナ" = "この服装だと動きにくいのではないでしょうか！？"
"10051020-65-ツクヨ" = "ま、まさか……。"
"10051020-66-ツクヨ" = "私たち……ファッションショーのステージに、立つんですか……？"
"10051020-67-ツクヨ" = "そ、それが忍の道だと、部長が仰るなら……。"
"10051020-68-ツクヨ" = "が、頑張り、ます……！"
"10051020-69-ミチル" = "いやいや！私たちの任務はあくまで護衛！"
"10051020-70-ミチル" = "会場の観衆に紛れ込んで、不審な動きがあれば真っ先に制圧するのが今回の仕事！"
"10051020-71-ミチル" = "でもそのためには、会場内を自由に動けなきゃいけないでしょ？"
"10051020-72-ツクヨ" = "そう、ですね……？"
"10051020-73-ミチル" = "で、こういうフォーマルな格好じゃないと入れない場所もあるらしいんだよ。"
"10051020-74-ミチル" = "例えば……ほら、えっと……偉い人たちが集まる……なんだっけ……。"
"10051020-75-ツクヨ" = "え、宴会場でしょうか？"
"10051020-76-ミチル" = "それ！宴会場！"
"10051020-77-ツクヨ" = "ど、ドレスコードがあるんですね……。"
"10051020-78-ミチル" = "うん。だから、陰陽部が衣装を用意してくれたってわけ。"
"10051020-79-ツクヨ" = "でも、イズナちゃんも言ってた、みたいに……。"
"10051020-80-ツクヨ" = "動きにくくないですか……？#n柔軟性や俊敏性は、忍者にとって基本中の基本、なのに……。"
"10051020-81-ツクヨ" = "そ、それに、私には全然合わないような……！"
"10051020-82-ツクヨ" = "着れたとしても……少し動いたら、服が破けてしまうかも……！"
"10051020-83-イズナ" = "でしたら、みんなで試着してみましょう！"
"10051020-84-ツクヨ" = "え？"
"10051020-85-ツクヨ" = "……！"
"10051020-86-イズナ" = "部長、いつも言っていましたよね。"
"10051020-87-イズナ" = "「忍者とはどんな窮地でも、決して諦めないもの」……と！"
"10051020-88-イズナ" = "だからこそ、こんなことで挫けるわけにはいきません！"
"10051020-89-イズナ" = "試着して慣れておけば――"
"10051020-90-イズナ" = "本番は楽に動けるはずです！"
"10051020-91-ミチル" = "……たしかに、今のうちに慣れておけばやりやすくなるね。"
"10051020-92-ミチル" = "それに忍者とは、どんな状況にも自然と溶け込める者……！"
"10051020-93-ミチル" = "ドレスなんかで挫けちゃいられない！"
"10051020-94-イズナ" = "その通りです！ニンニン！"
"10051020-95-イズナ" = "ではイズナ、1番に試着させていただきます！"
"10051020-96-イズナ" = "私のドレスはこれですか？"
"10051020-97-ミチル" = "うん、それがイズナの分。で、こっちがツクヨの……。"
"10051020-98-ツクヨ" = "ひ、ひぇええ……！"
"10051020-99-イズナ" = "ドレス姿のイズナ、参上です！"
"10051020-100-ミチル" = "おおっ……！"
"10051020-101-ツクヨ" = "わあ……！"
"10051020-102-ミチル" = "なになに、似合ってるじゃん！"
"10051020-103-ツクヨ" = "き、綺麗です……！"
"10051020-104-イズナ" = "そ、そうですか？えへへっ。"
"10051020-105-イズナ" = "こんなに褒めていただけるだなんて思いませんでした……！"
"10051020-106-ミチル" = "動きにくくない？"
"10051020-107-イズナ" = "ところどころ締めつけはありますが……。"
"10051020-108-イズナ" = "慣れれば問題ありません！"
"10051020-109-イズナ" = "それより、こんなに綺麗で華やかな服を着るのは初めてで……。"
"10051020-110-イズナ" = "イズナ、とってもドキドキしています！"
"10051020-111-ミチル" = "おおっ、いいね、いい感じ！"
"10051020-112-ミチル" = "よし、それじゃあ……。"
"10051020-113-ミチル" = "次はツク――"
"10051020-114-ツクヨ" = "ぶ、部長！お先に、どうぞ……！"
"10051020-115-ツクヨ" = "きっと、よく似合うと思います！"
"10051020-116-ミチル" = "え、そ、そうかな？"
"10051020-117-ミチル" = "じゃあ、えっと……これが私ので……。"
"10051020-118-ミチル" = "これを……ここに通せばいいのかな……？"
"10051020-119-イズナ" = "上下が逆です！"
"10051020-120-ミチル" = "嘘っ！？"
"10051020-121-ミチル" = "これ、着方が複雑すぎるよ……！"
"10051020-122-ツクヨ" = "こ、ここから順番に着ていくと……。"
"10051020-123-ツクヨ" = "それから、ここをしっかり締めれば――"
"10051020-124-ミチル" = "おお……！"
"10051020-125-イズナ" = "部長！髪をおろしてみませんか？"
"10051020-126-イズナ" = "そのほうが似合いそうです！"
"10051020-127-ミチル" = "髪型まで変えるの！？"
"10051020-128-ミチル" = "べ、別にそこまでしなくても……。"
"10051020-129-ツクヨ" = "た、試しにやってみませんか……？"
"10051020-130-ツクヨ" = "た、たまたまヘアアイロンを持ってますので……！"
"10051020-131-ミチル" = "そんなの持ってたの……！？"
"10051020-132-ミチル" = "ど、どうかな……？"
"10051020-133-イズナ" = "おおっ！全然雰囲気が違います！"
"10051020-134-ツクヨ" = "清楚で、少女みたいで……。"
"10051020-135-ツクヨ" = "忍者の可能性って、無限大なんですね……！"
"10051020-136-ミチル" = "そ、そんなに持ち上げないでよ……！"
"10051020-137-ミチル" = "ちょっと恥ずかしいんだから……！"
"10051020-138-ミチル" = "そ、それに……正直、こういう服はツクヨの方が一番似合う気がするし……！"
"10051020-139-ツクヨ" = "え、ええっ！？"
"10051020-140-イズナ" = "その通りです！"
"10051020-141-イズナ" = "ツクヨ殿も早く着てみましょう！"
"10051020-142-ツクヨ" = "ひ、ひぇえ……！"
"10051020-143-ツクヨ" = "そ、それなら……私も……。"
"10051020-144-ツクヨ" = "あの……これ、本当に私のサイズなんでしょうか……？"
"10051020-145-ツクヨ" = "全然……入らなくて……。"
"10051020-146-ミチル" = "最初はちょっときつく感じるから大丈夫だよ。"
"10051020-147-ツクヨ" = "ううぅ……！"
"10051020-148-ツクヨ" = "それにこれ、裾が短すぎませんか……？"
"10051020-149-ミチル" = "これくらいなら十分長いんじゃない？"
"10051020-150-ツクヨ" = "そう、ですか……？#nや、やっぱり、私が大きすぎるだけ……でしょうか……。"
"10051020-151-ツクヨ" = "私なんて、ただ大きいだけですから……。"
"10051020-152-ツクヨ" = "ちゃんと着られる服すら、なくなってきてて……！"
"10051020-153-ツクヨ" = "うぅっ……！"
"10051020-154-イズナ" = "そんなことありません！あと少しです！"
"10051020-155-ツクヨ" = "で、でも……！"
"10051020-156-ツクヨ" = "こ、こんなに無理やり押し込んだら……！"
"10051020-157" = "ビリィィィィッ！"
"10051020-158-ミチル" = "あっ……。"
"10051020-159-イズナ" = "ドレスが破れて……！"
"10051020-160-ミチル" = "ぼ、ボタンも全部、飛んで……！"
"10051020-161-ミチル" = "うぅっ……。"
"10051020-162-ミチル" = "やっぱり、私にはこんな綺麗な服は着られないんです……。"
"10051020-163-ミチル" = "大きいだけで、可愛くもなくて……。"
"10051020-164-ミチル" = "そ、そんなことないよ！#nでも……ごめん、無理やり着せようとしちゃって……！"
"10051020-165-イズナ" = "ツクヨ殿、大丈夫ですか？"
"10051020-166-ミチル" = "私は平気、ですけど……。"
"10051020-167-ミチル" = "こ、この服って、陰陽部から借りたもの、ですよね……？"
"10051020-168-ミチル" = "こ、このせいで陰陽部に怒られたり……。"
"10051020-169-ミチル" = "か、カメラを取り上げられたりしたら……。"
"10051020-170-ミチル" = "「少女忍法帖ミチルっち」の撮影ができなくなって――"
"10051020-171" = "[s] \"大丈夫だよ。破れた服は直せばいいから。\""
"10051020-172-ミチル" = "そうそう、修繕して返せばOKだって。"
"10051020-173-ミチル" = "きっとこれくらいなら綺麗に直せるよ！"
"10051020-174-ミチル" = "だからあんまり深刻に――"
"10051020-175-ミチル" = "――先生殿！？なんでここに！？"
"10051020-176" = "[s] \"近くに用事があったから、寄ってみた。\""
"10051020-177-ミチル" = "来た理由は置いとくとして……。"
"10051020-178-ミチル" = "……いつからそこにいたの！？！？"
"10051020-179-ミチル" = "せ、先生……！？"
"10051020-180-イズナ" = "主殿……！？"
"10051020-181-ミチル" = "もしかして……着替え中も……？"
"10051020-182-ミチル" = "にっ――忍法！「曲者退治の術」！！"
"10051020-183" = "[s] \"ちょ、ちょっと待って……！\""
