[translation]
"10058040-1" = "第4話;Time On Target"
"10058040-2-エリナ" = "今の何！？ミサイルをあんな風に動かせるの！？"
"10058040-3-アンナ" = "撃ち落とされないようにわざと不安定な動きをさせて、#nその上で完璧に着弾させるなんて……。"
"10058040-4-エリナ" = "そういうことじゃなくて！あんなぶっ飛んだチームしかいないのかってこと！"
"10058040-5-ラナ" = "ただのレースだと思って参加したのは、私たちだけみたい。"
"10058040-6-アンナ" = "エリナはゲヘナカップに詳しいんでしょ！？"
"10058040-7-エリナ" = "ラジオや新聞ではバイアスロンみたいなものって言ってたの！"
"10058040-8-エリナ" = "マジの「戦い」なんて思わないでしょ！"
"10058040-9-ラナ" = "「息を吸った」って小説にわざわざ書かないのと同じ。"
"10058040-14-アンナ" = "ラナ、ストップ！！向こうで戦いが始まってる！"
"10058040-15-エリナ" = "なんで！？どこ行っても戦場じゃん！！"
"10058040-16-アンナ" = "あそこの茂みに入って迂回しよう！"
"10058040-17-ラナ" = "こんなことになるなら、前面に芝刈り機をつけておくんだった。"
"10058040-18-エリナ" = "いいから、早く！！"
"10058040-21-ハルナ" = "アカリさん、反対側にもお願いします。"
"10058040-22-ハルナ" = "美食のように、砲撃も追求するとしましょう。#nあの戦車には練習台になっていただきますわ。"
"10058040-23-イズミ" = "うわーん！誰か交代して～！さっきから砲弾を入れて腰が痛いんだけど～！"
"10058040-24-ジュンコ" = "イズミが装填手やるって言ったんじゃない！今は交代できないわよ！"
"10058040-25-イズミ" = "そう[ruby=・]て[/ruby][ruby=・]ん[/ruby]っていうから、#nえび[ruby=・]天[/ruby]みたいな美味しいものだと思ってたのに～！"
"10058040-26-アカリ" = "このままどんどん撃ちますよ～★"
"10058040-32-正義実現委員会部員A" = "履帯両方破損！走行不能です！"
"10058040-33-イチカ" = "あちゃー、完全に遊ばれちゃってるっすね。"
"10058040-34-イチカ" = "マシロ、反撃できるっすか？"
"10058040-37-正義実現委員会部員A" = "ひゃあっ……！"
"10058040-38-マシロ" = "なんとも言えません。先ほど砲身に被弾してしまったので。"
"10058040-39-マシロ" = "弾道を補正できれば何とかなると思いますが……。"
"10058040-40-イチカ" = "ああ……それなら大丈夫っす。#n薬室が損傷したら砲塔内で爆発するかもしれないっすから。"
"10058040-41-イチカ" = "それじゃあ……皆さん、お疲れ様でした。"
"10058040-44-イチカ" = "あっちは気が済むまでやる気みたいなんで、その間お茶でもどうっすか？#nこの戦車、ポットがあるんすよ。"
"10058040-45-マシロ" = "それでは、ミルクティーをお願いします。"
"10058040-46-正義実現委員会部員A" = "わ、私はミルクなしの砂糖だけでお願いします……！"
"10058040-47-イチカ" = "ちょーっと待っててくださいね～"
"10058040-48-イチカ" = "ん……？というか、なんか静かっすね。もしかして弾切れっすか？"
"10058040-49-マシロ" = "あれは……。"
"10058040-50-マシロ" = "イチカ先輩。照準器でゲヘナの戦車を見てもらってもいいですか？"
"10058040-51-イチカ" = "了解っす。どれどれ……。"
"10058040-60-イチカ" = "あの人は……誰っすか？"
"10058040-61-イチカ" = "マシロ、たしか読唇術使えたっすよね？何言ってるか分かりますか？"
"10058040-62-マシロ" = "遠いので、はっきりとは分かりませんが……。"
"10058040-68-マシロ" = "「あれだけ言ったのに。もう我慢できない。」"
"10058040-69-マシロ" = "「ハ[ruby=・]ウ[/ruby]ナ、ア[ruby=・]ハ[/ruby]リ、[ruby=・]シ[/ruby][ruby=・]ュ[/ruby]ンコ、[ruby=・]ヒ[/ruby]ズミ。」"
"10058040-70-マシロ" = "「私のトラック、返して。」"
"10058040-72-チアキ" = "おーっと！ここでまさかの大波乱です！"
"10058040-73-チアキ" = "予選をすっ飛ばし、給食部の戦車で勝手に乱入してきた美食研究会ですが……#nなんと、給食部部長、フウカさんの手によってリタイアする結果となってしまいました！"
"10058040-74-チアキ" = "まあ、そんな日もあります！"
"10058040-75" = "[s] \"乱入ってアリなの！？\""
"10058040-76-チアキ" = "いや、普通にダメですよ？"
"10058040-77-チアキ" = "最後まで生き残っても優勝はできないので、#nここで脱落してよかったかもしれません！"
"10058040-78-イブキ" = "でも、すごく面白かったね～！"
"10058040-80-イチカ" = "ど、どういうことっすか……？"
"10058040-81-マシロ" = "あ、みんな外に出て逃げていきますね。残ったのは一人です。"
"10058040-82-マシロ" = "「置いていかないでってば。うわーん。」"
"10058040-83-マシロ" = "「もう、覚えてなさいよ。いつか絶対仕返ししてやるんだから。」"
"10058040-84-イチカ" = "も、もういいっす。"
"10058040-85-正義実現委員会部員A" = "では、修理して移動しますか？"
"10058040-86-イチカ" = "そうっすね……。"
"10058040-87-イチカ" = "！！"
"10058040-88-イチカ" = "敵の砲撃が来るっす！"
"10058040-95-マシロ" = "この連射間隔……挟み撃ちにされているかもしれません！"
"10058040-96-正義実現委員会部員A" = "きゃあああ！！！"
"10058040-101-フブキ" = "当たったらラッキーってことで――"
"10058040-102-フブキ" = "同時に何発も命中なんて、すごいね。"
"10058040-103-公安局の生徒A" = "練習の賜物だね！次の目標は？"
"10058040-106-コノカ" = "当然、本丸っしょ！周りの雑魚も片づけたし！"
"10058040-107-生活安全局の生徒A" = "全隊員に伝達。偏角2745、射角550、交通整理用、装薬8号。#n準備できた者から報告！"
"10058040-108-フブキ" = "偏角2745、射角550、交通整理用、装薬8号――"
"10058040-109-公安局の生徒" = "こちらミニパト3号、射撃準備完了。"
"10058040-110-生活安全局の生徒A" = "撃て！"
"10058040-114-チアキ" = "おーっと！そうこうしている内にヴァルキューレ警察学校の#n「ミニパト3号チーム」が最後の5つ目の的を砲撃！現在1位です！"
"10058040-115-イブキ" = "あのお姉ちゃんたち、最初からずっと動いてないよー？"
"10058040-116" = "[s] \"スタートラインのそばに停車したままだね。\""
"10058040-117-チアキ" = "要は全部の的に当ててスタートラインに戻ってくればいいので！#nその場で解決してしまおうということでしょう！"
"10058040-118-チアキ" = "ひじょ～に卑怯な手かもしれませんが……#nルール上は禁止されてないので、オッケーってことで！"
"10058040-119-チアキ" = "一応ルールは守ってるってところが、警察らしいですね！あはは！"
"10058040-120-チアキ" = "このままヴァルキューレチームがゴールするとレース終了です！#nドッキドキの結果が気になるなら！？"
"10058040-121-イブキ" = "チャンネルは、そのままだよ！"
"10058040-123-フブキ" = "スタート地点で的を全部撃って終わりなんて――"
"10058040-124-フブキ" = "やるじゃん、副局長。"
"10058040-127-コノカ" = "ランチタイム逃すわけにはいかないっしょ！"
"10058040-128-コノカ" = "それに今日の占い、「あまり時間をかけるな」だったし。"
"10058040-129-コノカ" = "だからこうやってさっさと片づければ、不運も飛んでくってわけ！あははは！！"
"10058040-130-コノカ" = "パパッと優勝して、豚骨ラーメンでも食いに行くぞ！"
"10058040-131-キリノ" = "うぅ……ルール違反ではありませんが、何だか罪悪感が……。"
"10058040-132-コノカ" = "ルールに則ってやってんだから良いに決まってんだろ！#nほら、ちゃっちゃと出発す――"
"10058040-133-コノカ" = "はぇ？"
"10058040-136-？？？" = "もう誰もいないよね！？"
"10058040-137-？？？" = "もうさすがに大丈夫でしょ！アンナは心配しすぎ～！"
"10058040-139-アンナ" = "え？"
"10058040-140-コノカ" = "あ？"
"10058040-143-アンナ&コノカ" = "うわあ！！？"
"10058040-144-アンナ" = "ラナ！！バックして！！！全速でバック！！！！"
"10058040-145-コノカ" = "何ぼーっとしてんだ！！さっさと撃て！！"
"10058040-146-公安局の生徒" = "副局長！弾はもう使い切ってしまいました！"
"10058040-147-フブキ" = "キリノ！早く発進して！！"
"10058040-148-コノカ" = "にしてもすごいな、あの戦車！#n公道ならチューニングパーツだけで矯正局行きだぞ！？"
"10058040-150-エリナ" = "あのアホみたいに大きな戦車、なに！？"
"10058040-151-アンナ" = "さっき丘の下をめちゃくちゃにしたのって、あれ！？"
"10058040-152-アンナ" = "何してるの、ラナ！！早く逃げないと！！"
"10058040-153-ラナ" = "眠ってる熊なのに？"
"10058040-154-アンナ" = "え？熊？"
"10058040-155-ラナ" = "あれ。弾も撃ってこないし、動きもしない。"
"10058040-156-エリナ" = "え……？"
"10058040-158-コノカ" = "出発、しゅっぱーつ！！！"
"10058040-159-キリノ" = "了解です！！！"
"10058040-160-キリノ" = "シートベルト、よし！！"
"10058040-161-フブキ" = "そうそう、シートベルト……。"
"10058040-162-フブキ" = "え！？"
"10058040-163-キリノ" = "ブレーキを踏みながらエンジンをかける！！#nギア、よし！バックミラー調整、よし！！"
"10058040-164-コノカ" = "何してんのぉ！？！？！？"
"10058040-165-キリノ" = "出発前の点検です！"
"10058040-166-キリノ" = "どこまでやりましたっけ！？そうだ！方向指示器、よし！！"
"10058040-167-公安局の生徒" = "路上教習じゃないんだよっ！！！！！"
"10058040-170-ミニパト3号チーム" = "ぐあああ！！！！"
"10058040-173-アンナ" = "はぁっ……はっ……。"
"10058040-174-エリナ" = "はあ……はあ……。"
"10058040-175-ラナ" = "おお、ファーストブラッド。"
"10058040-176-アンナ" = "倒したの……？私たちが……自分の手で……？"
"10058040-177-エリナ" = "あ、あはは……手が震えてる……。"
"10058040-178-ラナ" = "うん。"
"10058040-179-ラナ" = "ゾクゾクッ。"
"10058040-180-アンナ" = "ラナはどうしてそんなに冷静なの！？"
"10058040-181-エリナ" = "そんなこと言ってる場合じゃないでしょ！！止まってたらやられちゃうよ！！"
"10058040-182-ラナ" = "出発～"
"10058040-191-生活安全局の生徒A" = "副局長、大丈夫ですか！？"
"10058040-192-コノカ" = "やっぱ、占いって当たるんだよな……。"
"10058040-193-コノカ" = "きええっ……！"
