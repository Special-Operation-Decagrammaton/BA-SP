[translation]
"10058050-1" = "第5話;弱い者の話は聞かない"
"10058050-2-チアキ" = "おおーっと！これはどういうことでしょう！#nヴァルキューレ警察学校チーム、派手な爆発と共に脱落です～！"
"10058050-3-チアキ" = "優勝なんて朝飯前って感じだったんですけどね～"
"10058050-4-イブキ" = "イブキは朝ごはん食べたよー！"
"10058050-5-チアキ" = "戦車戦の基本はヒットアンドアウェイ！#nスタート地点付近で得点を重ねていましたが、#n奇襲攻撃を許してしまいましたね！"
"10058050-6-チアキ" = "今回初出場の183号特別クラスは、これが初撃破です！#nおめでとうございます～！！"
"10058050-7-チアキ" = "それでは、再び現場の様子を見る前に――"
"10058050-8-チアキ" = "先生、締めをお願いします！"
"10058050-11" = "[ns] \"チャンネルは、そのままだよ！\""
"10058050-12-チアキ" = "ありがとうございます！！"
"10058050-17-ヘルメット団" = "ぐはっ！！！"
"10058050-23-アコ" = "イオリ！戦車をもう少し近くに寄せてください！この銃で直接殴ってやります！"
"10058050-24-イオリ" = "興奮しすぎだって……。チナツも止めてよ。"
"10058050-25-チナツ" = "無理です。さっきから、#n「万魔殿主催の大会で優勝カップを奪い取るのが風紀委員会の宿命だ」#nなんて言い出してますし……。"
"10058050-26-チナツ" = "一度スイッチが入った行政官を止められるのは、委員長だけです。"
"10058050-27-アコ" = "ほら、もっと撃ち込みなさい！優勝の栄光は、委員長のものです！"
"10058050-28-イオリ" = "……ん？なんだ、あの光？"
"10058050-29-アコ" = "光なんてどうでもいいでしょう！？目の前の敵にもうちょっと集中し――"
"10058050-35-アコ" = "きゃあああっ！！！"
"10058050-38-カリン" = "あの人、戦車の上で銃を振り回してた。"
"10058050-39-ネル" = "変な不良みてぇな奴だな……。"
"10058050-40-ネル" = "アスナ、プリズム砲は問題なかったか？"
"10058050-41-アスナ" = "だいじょーぶ！問題なしだよ～！"
"10058050-42-ネル" = "まさか、ゲーム開発部のチビどもにやられるとはな……#nまあ、直せたから良かったけどよ。"
"10058050-43-ネル" = "しっかし、やっぱ4人だときちーな……。#nトキは昨日からどこに行っちまったんだ？"
"10058050-44-カリン" = "連絡も取れないから心配だ。"
"10058050-45-アカネ" = "トラブルに巻き込まれていなければ良いのですが……。"
"10058050-46-ネル" = "そう簡単にやられる奴じゃないだろ？ 心配すんなって。#nつーか……なんでどいつもこいつも、うちの戦車を見るなりすげー勢いで噛みついてくるんだ！？"
"10058050-47-アスナ" = "もしかして、一番変だからー？あははっ！"
"10058050-48-ネル" = "まあ、エンジニア部の奴らが作ったからな……。"
"10058050-49-ネル" = "こんなヘンテコ戦車、他には一台もな……。"
"10058050-55-ネル" = "……はあ？"
"10058050-56-カリン" = "これは、私たちのと同じプリズム砲……？"
"10058050-60-トキ" = "プリズムではありません。プリティメイドです。"
"10058050-61-ネル" = "お前、どこほっつき歩いてたんだよ！！んで、何だその戦車は！！！"
"10058050-62-トキ" = "私も同じものをエンジニア部の方にお願いしました。"
"10058050-63-トキ" = "ネル先輩に、一度勝ちたいと思いまして。"
"10058050-64-ネル" = "あいつら、それを引き受けたのか！？"
"10058050-68-ウタハ" = "ミラーマッチはロマンだからね。"
"10058050-69-コトリ" = "設計図も、一度しか使わないのはもったいないです！"
"10058050-70-ヒビキ" = "面白そうだし。"
"10058050-71-ネル" = "あいつら、ったく……！"
"10058050-72-ネル" = "いいぜ、かかってこい！！ぶっ壊してやる！！"
"10058050-75" = "[ns] \"ミラーマッチ！ミラーマッチ！ミラーマッチ！\""
"10058050-76-チアキ" = "これは予想外の展開ですね！#n行方をくらましていた部員が同じ型の戦車に乗ってくるとは！"
"10058050-77-イブキ" = "どっちが勝つんだろう？楽しみ～！"
"10058050-78-チアキ" = "同じ戦車同士なら、後は乗組員の腕で決まります！#nあっ！そんなことを言っている内に始まりました！"
"10058050-79-チアキ" = "カメラが追いつきません！防御も回避も一切ない、ノーガードの殴り合いです！"
"10058050-105-ネル" = "んだよ、トキもエンジニア部の奴らも大したことねぇな！"
"10058050-106-ネル" = "おら！戦車もぶっ壊れたぞ！もうあきらめろ！"
"10058050-107-トキ" = "……。"
"10058050-110-ネル" = "な、なんだ！？"
"10058050-115-トキ" = "何かという質問に答えますと……スーパープリティメイドです。"
"10058050-116-トキ" = "ピース、ピース。"
"10058050-117-ネル" = "んなこと聞いてねぇよ！！！！"
"10058050-118-トキ" = "今回の勝負は、私の勝ちです。"
"10058050-121-ネル" = "お、おい！！！"
"10058050-126-審判" = "そこのロボットメイドさん！失格です！降りてください！"
"10058050-131-アスナ" = "失格なの？"
"10058050-132-トキ" = "私はスーパープリティメイドです。"
"10058050-133-審判" = "そんなことはどうでもいいです。変身した選手は、ルール上戦車と判定します。"
"10058050-134-審判" = "戦車は1チーム当たり1台が原則なので、2台ですと反則になります。"
"10058050-135-ネル" = "ははは！ざまあみろ！"
"10058050-136-審判" = "それと……車体の損傷で走行不能のため、C&Cチームも脱落となります。"
"10058050-137-ネル" = "んだと！？"
"10058050-138-アスナ" = "あはは！あ～面白かった～！"
"10058050-139-カリン" = "予想よりは長く残った。"
"10058050-140-アカネ" = "ゲヘナは温泉が多いようなので、#nそれを堪能してからカラオケにでも行きましょうか？"
"10058050-141-ネル" = "お前たち、なんでそんなにあっさりしてんだよ！？"
"10058050-142-アスナ" = "みんなで十分楽しんだし、それでいいんじゃない？"
"10058050-143-ネル" = "トキ、お前はこっちに来い！！もう一度勝負だ！！さっきのは反則だろ！！"
"10058050-144-トキ" = "嫌です。"
"10058050-145-トキ" = "先輩は下手なので。"
"10058050-146-トキ" = "雑魚は相手にしません。"
"10058050-147-ネル" = "誰が雑魚だゴルァ！！！"
"10058050-153-アスナ" = "二人とも、はっや～い！あはは！"
"10058050-154-カリン" = "ふふっ、まだ力が有り余っているようだな。"
"10058050-157-アンナ" = "あれって、パワードスーツとかいうやつ！？すごい！！"
"10058050-158-エリナ" = "それより、こっちの細い道を行ったら3つ目の的だよ！早く行こう！"
"10058050-159-アンナ" = "さっきみたいに、また誰かに会ったらどうしよう……！"
"10058050-160-エリナ" = "そうならないために脇道使うんだって！"
"10058050-161-アンナ" = "それで変速機に負担がかかったら？"
"10058050-162-エリナ" = "も～！じゃあどうするの！？"
"10058050-163-ラナ" = "あ。"
"10058050-164-ラナ" = "前に、戦車。"
"10058050-165-アンナ" = "ここにも敵が！！"
"10058050-166-アンナ" = "装填！装填！早く早く早く！！"
"10058050-167-エリナ" = "ぐぎぎぎぃ～！砲弾、重すぎるって～！なんで揚弾機外すかなぁ！？"
"10058050-168-アンナ" = "的以外を砲撃するなんて思ってなかったもの！レースだって聞いてたし！"
"10058050-172-エリナ" = "ひ、HEAT弾装填！標的情報はよ～！"
"10058050-183-アンナ" = "1時の方向！距離、130！"
"10058050-184-アンナ" = "現在、敵の戦車は……。"
"10058050-189-アンナ" = "……ヒッチハイク中？"
