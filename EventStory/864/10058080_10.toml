"10058080-105-チェリノ" = "これ以上、引き延ばす必要はない。次弾を装填しろ！"
"10058080-106-事務局員A" = "予備の弾が隅にあるので、今引っ張り出しています！"
"10058080-107-チェリノ" = "早くしないと、お前も粛清するぞ！！"
"10058080-109-ヒフミ" = "そんな……！"
"10058080-110-コハル" = "せっかく助けてあげたのに、うわあぁぁぁん！"
"10058080-112-アンナ" = "どうしよう！どうしたらいいの！？"
"10058080-113-エリナ" = "とにかく、狙いを定めなきゃ……。"
"10058080-114-エリナ" = "……そうだ！！"
"10058080-115-エリナ" = "アンナ、砲弾を抜いて！！"
"10058080-116-アンナ" = "急にどうしたの！？今さら降参でもするつもり？"
"10058080-117-エリナ" = "んなわけないでしょ！いいから、早く！！！"
"10058080-118-アンナ" = "わ、分かったわよ！！"
"10058080-121-エリナ" = "どいた、どいたぁ！！"
"10058080-122-アンナ" = "どうして砲尾に頭を押し付けるのよ！？危ないでしょ！"
"10058080-123-エリナ" = "もぉ！うるさ～いっ！黙って、見とけ～！！"
"10058080-127-エリナ" = "右に5！下に10！"
"10058080-130-エリナ" = "よしっ！！装填！！"
"10058080-133-エリナ" = "撃てっ！撃てっ！撃てっ！撃てっ！撃てえええぇぇぇ！！！"
"10058080-134-アンナ" = "発射！！！"
"10058080-138-チェリノ" = "なんだ！？"
"10058080-141-チェリノ" = "うわあああぁぁぁっ！？"
"10058080-142" = "ドン！！！！！"
"10058080-148-ヒフミ" = "やりましたね。最後まで諦めなかったアンナさんたちの勝利です。"
"10058080-149-アズサ" = "私たちの犠牲も報われた。"
"10058080-150-コハル" = "再試験……今から嫌なんだけど……。"
"10058080-151-ハナコ" = "あら♡心配しないでください、コハルちゃん。#nあんなことやこんなこと、ぜ～んぶ教えてあげますからね。"
"10058080-152-コハル" = "本当に落ち込んでるんだから、やめてっ！"
"10058080-154-アンナ" = "て、敵戦車、撃破……。"
"10058080-155-エリナ" = "やりぃ……。"
"10058080-159-アンナ" = "エリナぁ！？"
"10058080-160-アンナ" = "うぅっ……私も、緊張が解けて……。"
"10058080-165-ラナ" = "こうなるから、睡眠は大事。"
"10058080-167-チアキ" = "やはり強いぞレッドウィンターからの刺客！#n難しい状況でしたが、臨機応変に対応して生き残りました！"
"10058080-168-チアキ" = "照準器が壊れたから、砲身をのぞき込んで照準を合わせるなんて……前代未聞です！"
"10058080-169-チアキ" = "183号は撃破数2両を記録しました。ダークホースの名に相応しい活躍です！"
"10058080-170-チアキ" = "一方、ランキング2位の阿慈谷ヒフミさん率いる#n補習授業部チームが脱落してしまいました。#n本大会はまさに、一寸先は闇とも言える波乱の展開を見せています。"
"10058080-171-イブキ" = "みんな、すごく怒ってるみたい。仲良しじゃないの？"
"10058080-172-イブキ" = "イブキのおやつを分けて、とめたほうがいいのかな……？"
"10058080-173-チアキ" = "大丈夫だよ、イブキちゃん！これはスポーツだからね！"
"10058080-174-チアキ" = "そうですよね、先生！"
"10058080-175" = "[s] \"みんな、ケンカを繰り返しながら成長していくんだよ！\""
"10058080-176-イブキ" = "ほんと！？それなら……イブキもたくさんケンカして、いっぱい大きくなる！"
"10058080-177" = "[s] \"そういうことじゃないよ、イブキ！\""
"10058080-178-チアキ" = "先生の戸惑った顔、いただき～！あはは！"
"10058080-179-チアキ" = "……はい。では、試合はこのままクライマックスに向かいます！"
"10058080-180-イブキ" = "チャンネルは――"
"10058080-181" = "[s] \"――そのままだよ！\""
"10058080-186-アンナ" = "あ、あのぉ……。チェリノ会長？"
"10058080-187-アンナ" = "おケガはありませんか？へへっ……。"
"10058080-188-チェリノ" = "お前らが、おいらの戦車を撃破したのだな！？"
"10058080-189-アンナ" = "くぅん……。"
"10058080-190-エリナ" = "怒らないでください！これには、深いワケが……。"
"10058080-191-チェリノ" = "レッドウィンターが優勝するとは言ったが、#n足を引っ張りあってどうするんだ！！この反乱分子め！！"
"10058080-192-エリナ" = "きぃん……。"
"10058080-193-チェリノ" = "お前らは、戻ったら粛清だ！粛清！！"
"10058080-194-ラナ" = "チェリノ会長。"
"10058080-195-チェリノ" = "なんだ、お前。まだ言い訳があるのか？"
"10058080-196-ラナ" = "チェリノ会長。私たちはクーデターを起こしたのではありません。"
"10058080-197-アンナ" = "ちょっと、ラナ！！"
"10058080-198-エリナ" = "会長は今怒ってるんだから、謝っておけばいいんだよ！！"
"10058080-199-チェリノ" = "クーデターを起こしたのではない？どういうことだ？"
"10058080-200-ラナ" = "私たちはクーデターを起こしたのではなく……#nただ、会長が乗っている戦車を壊しただけです。"
"10058080-204-チェリノ" = "おいらが乗っている戦車を壊しただけだと……？"
"10058080-205-ラナ" = "そうです。#n会長が優勝してこいと言ったので、優勝するために会長の戦車を倒したのです。"
"10058080-206-ラナ" = "チェリノ会長が優勝すれば、私たちは優勝できませんから。"
"10058080-207-ラナ" = "クーデターの意図はありません。だから宣言もしませんでした。"
"10058080-212-チェリノ" = "クーデターではなく、優勝するためにおいらを攻撃したというのか？"
"10058080-213-チェリノ" = "……。"
"10058080-217-チェリノ" = "なんだ、そういうことか！お前たちはレースをしただけということだな！"
"10058080-218-アンナ" = "えっ！？"
"10058080-219-エリナ" = "ええっ！？"
"10058080-220-チェリノ" = "勘違いしそうになったじゃないか！#nレースを口実にクーデターを起こし、#nおいらを引きずり降ろそうとしているのかと思ったぞ！"
"10058080-221-チェリノ" = "それなら問題ないのだ。良い勝負だった！"
"10058080-222-ラナ" = "クーデターなんて、とんでもないです。事務局は面白くなさそうなので。"
"10058080-223-チェリノ" = "トモエ！こいつらは粛清名簿から消すように！"
