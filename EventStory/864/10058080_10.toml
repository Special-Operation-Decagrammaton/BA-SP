[translation]
"10058080-1" = "第8話;クーデター、じゃない？"
"10058080-2" = "ドン！！！！"
"10058080-5-トモエ" = "会長、ご指示を。#nクルセイダーは我々との距離が開いたため、装甲を貫通できずにいます。"
"10058080-6-チェリノ" = "それなら、身動き取れない183号のやつらから粛清しよう。"
"10058080-7-チェリノ" = "履帯が切れて、おいらを狙うこともできないからな！"
"10058080-8-トモエ" = "分かりました！各員！狙いを定め、砲撃を開始してください！"
"10058080-9-事務局員A" = "了解！"
"10058080-14-コハル" = "え、エンジンが止まっちゃった！"
"10058080-15-コハル" = "赤いランプが光ってるけど大丈夫なの！？"
"10058080-16-ヒフミ" = "オーバーヒートです。ラジエーターが壊れちゃったみたいですね……#n今エンジンをかけたら焼き付いてしまいます。"
"10058080-17-アズサ" = "敵の戦車、私たちから狙いを外した。"
"10058080-18-アズサ" = "183号から撃つつもりだ。"
"10058080-19-コハル" = "どうして逃げないの！？あんなに時間稼いだのに！"
"10058080-20-ハナコ" = "逃げられないんです。戦車の履帯が切れているので。"
"10058080-21-ハナコ" = "砲塔もなしでは、反撃すら……。"
"10058080-22-アズサ" = "それでも……戦車を捨てずに、履帯を直そうと頑張ってる。"
"10058080-23-アズサ" = "泣きながらだけど……最後まで、逃げずに……。"
"10058080-24-コハル" = "じゃあどうするの？もう、打つ手はないんでしょ？"
"10058080-25-ヒフミ" = "……一つだけ、あります。"
"10058080-26-コハル" = "ヒフミ……？"
"10058080-27-ヒフミ" = "自分たちで車体を回せないなら、私たちが回してあげればいいんです。"
"10058080-28-ヒフミ" = "つまり……クルセイダーちゃんをぶつけて方向転換させます。"
"10058080-29-ハナコ" = "そうは言っても……私たちが今エンジンをかけたら……。"
"10058080-30-アズサ" = "エンジンが焼き付く。そうでなくとも、代わりに砲弾が当たるかもしれない。"
"10058080-31-ヒフミ" = "コハルちゃん。"
"10058080-32-コハル" = "じゃあ、優勝できないじゃん……#nそしたら、また補習授業して……勉強して……。"
"10058080-33-アズサ" = "コハル。"
"10058080-34-コハル" = "……。"
"10058080-35-コハル" = "うぅぅ……。"
"10058080-36-コハル" = "……同じこと考えてるなら、私に言わせないで！"
"10058080-41-ハナコ" = "コハルちゃん♡"
"10058080-42-コハル" = "損することが分かってるのに……#n放っておけなくて足突っ込んじゃうとこ、ほんっとうにムカつく！"
"10058080-43-コハル" = "補習授業、絶対助けなさいよ！じゃないと絶交するから！うわあぁぁぁ！！！"
"10058080-46-コハル" = "みんな、行くわよ！！！"
"10058080-48-チェリノ" = "捕まえたぞ、反乱分子め！"
"10058080-49-チェリノ" = "おいらに反抗するやつらは、零距離粛清だ！"
"10058080-50-ラナ" = "もう少しで直せるのに……。"
"10058080-51-アンナ" = "お……。"
"10058080-52-エリナ" = "わっ……た……。"
"10058080-53-アンナ" = "ごめんなさい、補習授業部のみなさん。あんなに助けていただいたのに……。"
"10058080-54-エリナ" = "やっぱ……砲塔、回るようにしとけば良かったなぁ……。"
"10058080-55-エリナ" = "あとちょっと……車体が、横に向いたら……。"
"10058080-58-チェリノ" = "撃てー！"
"10058080-61-チェリノ" = "？"
"10058080-65-アンナ" = "きゃあっ！？な、何かぶつかった！？"
"10058080-66-エリナ" = "補習授業部の人たちが、私たちの身代わりに……！"
"10058080-67-ラナ" = "追突事故みたいだね。保険会社を呼ぼうか。"
"10058080-69-ヒフミ" = "みなさん！これで狙えるはずです！"
"10058080-70-アズサ" = "この距離なら問題ない。"
"10058080-71-チェリノ" = "な、なんだと！？やつら、反撃に出る気か！"
"10058080-74-アンナ" = "補習授業部のみなさん！！！"
"10058080-75-エリナ" = "どうせ粛清されるなら、やるっきゃない！！！"
"10058080-76-エリナ" = "真剣勝負だ！！もらったチャンスは、無駄にしない！！"
"10058080-77-アンナ" = "もう、後には引けない！！！"
"10058080-83-アンナ" = "AP弾、装填！！"
"10058080-86-エリナ" = "撃てっ！撃てっ！撃てっ！撃てっ！撃てえええぇぇぇ！！！"
"10058080-90-チェリノ" = "この距離でも当たらないとは。[ruby=あじたに]阿慈谷[/ruby]ヒフミ、アテが外れたな。"
"10058080-92-ヒフミ" = "くっ……。"
"10058080-95-アンナ" = "ひいぃっ！！！"
"10058080-96-エリナ" = "何してんの！！どうやったらこの距離で外せるワケ～！？"
"10058080-97-アンナ" = "照準器が壊れて、ゼロインがズレてるの！！"
"10058080-98-エリナ" = "それならズレた分、照準を調整すればいいでしょ！"
"10058080-102-アンナ" = "またダメ！！"
