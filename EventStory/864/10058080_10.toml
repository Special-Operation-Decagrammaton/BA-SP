"10058080-225-アンナ" = "はあああぁぁぁ……！"
"10058080-228-ヒフミ" = "みなさん、大丈夫ですか？"
"10058080-229-ハナコ" = "は～い！いつもどおり、弾力があってツヤツヤです！"
