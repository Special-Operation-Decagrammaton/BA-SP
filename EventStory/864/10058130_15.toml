[translation]
"10058130-1" = "後日談その1;空冷0気筒"
"10058130-2" = "（レース前日）"
"10058130-3" = "ゲヘナカップ宿泊施設"
"10058130-6-アズサ" = "暑い。"
"10058130-7-コハル" = "ほんっと暑い！ムカつく！！やってらんない！！！"
"10058130-8-ヒフミ" = "あはは……結局、クルセイダーちゃんのエアコンは直せませんでしたね。"
"10058130-9-ハナコ" = "私はピタっとしてベタベタするのも良いと思いますよ。"
"10058130-10-コハル" = "嫌っ！汗かいてるのにくっついたら気持ち悪いでしょ！"
"10058130-11-ハナコ" = "そういうのは、本で見るほうが好きなんですよね？"
"10058130-12-コハル" = "な、何言ってんの！？そんなの知らないもん！"
"10058130-13-ハナコ" = "それなら……コハルちゃんのカバンに入っている#n『戦車装備教範』、今から一緒に見ても良いですか？"
"10058130-14-コハル" = "そ、それは……！あんたには難しいからダメ！"
"10058130-15-ハナコ" = "なるほど……。"
"10058130-16-コハル" = "何よ、その目！？"
"10058130-17-ハナコ" = "別の表紙でカモフラージュなんて、古典的ですね。"
"10058130-18-コハル" = "！！！"
"10058130-19-アズサ" = "出発前から一生懸命に読んでたね。教範は全ての戦術の基本だ。"
"10058130-20-アズサ" = "良ければ、私も読みたい。"
"10058130-21-コハル" = "ダメったらダメ！！！"
"10058130-22-ヒフミ" = "あはは、大丈夫ですよ。教範がなくても修理する方法はありますから。"
"10058130-23-ヒフミ" = "そろそろ、注文した「涼しくなるもの」が到着するはずなんですが……。"
"10058130-24-アズサ" = "涼しくなるもの？"
"10058130-28-ハナコ" = "こんな時間に誰でしょう？お隣さんですかね？"
"10058130-29-ハナコ" = "コハルちゃん。#n夜に呼び鈴が鳴ったら、その後何が起こるか……よく知ってますよね？"
"10058130-30-コハル" = "質問の意図が不純なんだけど！最っ低！"
"10058130-31-アズサ" = "離れて、催涙弾を投げ込まれるかもしれない。"
"10058130-32-ヒフミ" = "防毒マスク、今回も持ってきたんですね。"
"10058130-37-イブキ" = "やっほー！ぱんでもにうむ・そさえてぃーだよー！"
"10058130-38-イブキ" = "荷物を届けに来たの！"
"10058130-41-イブキ" = "わっ！う、宇宙人！？こわい～！！"
"10058130-42-アズサ" = "宇宙人じゃない。[ruby=しらす]白洲[/ruby]アズサだ。よろしく。"
"10058130-43-コハル" = "それ、早く外しなさいよ！その子びっくりしてるじゃん！"
"10058130-44-ハナコ" = "コハルちゃんのも私が外してあげますね……♡"
"10058130-45-コハル" = "死刑、死刑、死刑っ！！"
"10058130-46-イブキ" = "しけい？イブキ、悪い子……？"
"10058130-47-コハル" = "そ、そうじゃなくて……！"
"10058130-50-イブキ" = "そうなんだ！おいしいキャンディーをありがとう！"
"10058130-54-イブキ" = "お姉ちゃん、ここって616号室だよね？ここにサインしてくれる？"
"10058130-55-ヒフミ" = "ありがとうございます！重いのにご苦労様です！"
"10058130-56-ハナコ" = "[ruby=パンデモニウム・ソサエティー]万魔殿って、ゲ[/ruby]ヘナの生徒会ですよね？宅配業務もするんですか？"
"10058130-57-イブキ" = "うん！みんな忙しいから、イブキがお手伝いしてるんだ！"
"10058130-58-イブキ" = "えへへ！いろんな人に会えて楽しいよ！"
"10058130-59-ハナコ" = "あら、偉いですね。"
"10058130-60-ハナコ" = "コハルちゃんと一緒で[ruby=・]オ[/ruby][ruby=・]ト[/ruby][ruby=・]ナ[/ruby]です！"
"10058130-61-コハル" = "決まってんでしょ、私はエリートなんだから大人……。"
"10058130-64-コハル" = "ん？もしかして、からかってる……？"
"10058130-65-ハナコ" = "からかってませんよ～"
"10058130-70-コハル" = "どうして急に抱きつくの！？"
"10058130-72-ヒフミ" = "ここにサインですね……はいっ！ありがとうございます！"
"10058130-73-イブキ" = "うん！明日のレース、頑張ってね！"
"10058130-77-ハナコ" = "ところで、何を注文したんですか？"
"10058130-81-ヒフミ" = "壊れたのはエアコンのエバポレーターなので……#n冷媒を直接冷やせば、冷たい風が出てくると思って……。"
"10058130-82-ヒフミ" = "さっきドライアイスを注文したんです！"
"10058130-83-ヒフミ" = "早く、保冷バッグに移さないと……。"
"10058130-88-ヒフミ" = "これは……。"
"10058130-89-アズサ" = "ドライアイスじゃないけど、涼しそうではあるね。"
"10058130-90-コハル" = "中身間違われちゃったってこと？#n616ってあるし、この部屋宛てではあるんだよね？"
"10058130-94-ヒフミ" = "はい、そのはずなんですけど……。"
"10058130-95-ハナコ" = "車両点検を受けた時に故障の話をしたので、運営さんが送ってくれたのでしょうか？"
"10058130-96-コハル" = "そんなはず……なくはないの？運営が送ってくるなんて……。"
"10058130-97-ハナコ" = "これは……レーシングスーツですね。"
"10058130-98-ヒフミ" = "レーシングスーツ、ですか？"
"10058130-99-ハナコ" = "はい！広告でもこういう衣装を着た人を見るでしょう？"
"10058130-100-ヒフミ" = "それは出場選手じゃなくて、進行の人たちが着ているような……。"
"10058130-101-アズサ" = "トリニティとは違う風習かもしれない。涼しそうだし、機能的で良いと思う。"
"10058130-102-ヒフミ" = "うーん……ドライアイスがないなら、エアコンは機能しないでしょうし……。"
"10058130-103-ヒフミ" = "制服だと熱中症の恐れもあるので、これを着たほうが良いかもしれませんね。"
"10058130-104-コハル" = "でも2着しかないわよ？"
"10058130-105-アズサ" = "もしかしたら、戦車長と副戦車長の分だけなのかも。"
"10058130-106-ハナコ" = "でしたら、ヒフミちゃんとアズサちゃんの分ですね！"
"10058130-107-ハナコ" = "私たちは念のために持ってきた水着を着ましょう、コハルちゃん！"
"10058130-108-コハル" = "何言ってんの？私は水着なんて持ってきてないけど。"
"10058130-109-ハナコ" = "コハルちゃんの分も私が持ってきてます。非常時に備えて、当然のことです。"
"10058130-110-コハル" = "どんな非常時よ！？"
"10058130-111-アズサ" = "戦場に出るための鎧、気に入った。"
"10058130-112-ヒフミ" = "熱中症も心配ですし……せっかく運営さんが準備してくださったんですから、#n遠慮なく着させてもらいましょう。"
"10058130-113-コハル" = "水着で戦車に乗るなんておかしいでしょ！"
"10058130-114-ヒフミ" = "え！？"
"10058130-116-イブキ" = "ふんふん～るんるん～♪"
"10058130-117-イブキ" = "えっと～"
"10058130-118-イブキ" = "616号室にドライアイス、配達完了！"
"10058130-119-イブキ" = "それと919号室にマコト先輩の服を配達したら、お仕事終わり！"
"10058130-120-イブキ" = "えへへ！"
