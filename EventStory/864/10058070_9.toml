[translation]
"10058070-1" = "第7話;赤信号"
"10058070-3-エリナ" = "チェリノ……会長……？"
"10058070-4-アンナ" = "会長がどうしてあんなところに……？"
"10058070-5-ラナ" = "お変わりなく何より。背も全然伸びてない。"
"10058070-6-アンナ" = "出場してたの！？どうして！？#nというか、私たちが優勝するにはチェリノ会長に勝たなきゃいけないってこと！？"
"10058070-7-エリナ" = "もし勝っちゃったら粛清されるんじゃない！？"
"10058070-8-アンナ" = "さっきの様子だと実力も相当みたい。#n6キロ以上離れたところを砲撃してきたし。"
"10058070-9-エリナ" = "とりあえず避けて進もう！#nそのうち他のチームが会長を撃破するかもしれないし！"
"10058070-10-エリナ" = "いや、でも……勝てるチームなんているかな……#nあっ、そうだ！あのふわふわで眠そうな目の人だったら……。"
"10058070-11-ラナ" = "ゲヘ[ruby=パンデモニウム・ソサエティー]ナの万魔殿、虎[/ruby]丸チーム[ruby=なつめ]の棗イ[/ruby]ロハ。"
"10058070-12-エリナ" = "そうそう！逃げていればあの人がやっつけてくれると思わない？#nそうすれば、私たちは粛清されな～い！！"
"10058070-13-エリナ" = "双眼鏡貸して！あっちの様子を見て動かなきゃ！"
"10058070-15-エリナ" = "とりあえず、ひたすらチェリノ会長が行く方向と反対に逃げ……。"
"10058070-22-エリナ" = "ど、どこ行った～！？"
"10058070-23-アンナ" = "もう！！双眼鏡で見てるのに分からないの！？"
"10058070-24-エリナ" = "おかしいよ！！絶対、あっちにいたのに！！"
"10058070-27-アンナ" = "ラナ、エンジンを切って！音でバレちゃうかも！"
"10058070-28-ラナ" = "？"
"10058070-29-ラナ" = "燃料節約のため、とっくに切ってる。"
"10058070-30-アンナ" = "えっ……？"
"10058070-31-チェリノ" = "他の戦車に後ろを取られないよう気を付けろ。"
"10058070-32-チェリノ" = "基本中の基本だ。"
"10058070-33-アンナ&エリナ" = "ひえええっ！！！！！"
"10058070-35-チアキ" = "おーっと！これは下剋上対決だー！！"
"10058070-36-チアキ" = "183号特別クラスが、レッドウィンターの生徒会である事務局と大激突！"
"10058070-37-チアキ" = "ここでイブキちゃんにチームの紹介をお願いします！"
"10058070-38-イブキ" = "うん！ええっと、レッドウィンターの事務局は、会長の名前が「れんかわチェリノ」だって！"
"10058070-39-イブキ" = "何さいなのか書いてないけど、お姉ちゃんなのかな？"
"10058070-40-イブキ" = "戦車は「しゅくせい君1号」で、キヴォトス戦車ランキング2位！"
"10058070-42" = "[ns] \"チェリノってそっちの方面でも有名だったの？\""
"10058070-43-チアキ" = "前号の「週刊[ruby=ぱんでも]万魔殿[/ruby]特別編」で裏表紙のモデルにもなりましたよ！"
"10058070-44-チアキ" = "この界隈ではすごくすご～く有名な実力者なんです！"
"10058070-45-チアキ" = "これに対する183号特別クラスの戦績は0戦0勝0敗！"
"10058070-46-チアキ" = "Eloレーティングも基本の1500。未勝利かつ無敗という謎めいたチームです！"
"10058070-47-チアキ" = "すでに戦車レースマニアの間では#n「破壊に飢えた地獄より降臨せしマッシャー」#nとも呼ばれ始めている183号特別クラス！"
"10058070-48-チアキ" = "本大会のために3人で戦車を作ったそうですが、#nどのような活躍を見せてくれるでしょうか！"
"10058070-50-アンナ" = "ふあぁぁぁーん！"
"10058070-51-エリナ" = "ひえぇぇぇーん！"
"10058070-52-ラナ" = "やっぱり、チビ会長の戦車はかっこいい。"
"10058070-53-アンナ" = "感心してる場合じゃないでしょ！！"
"10058070-56-チェリノ" = "こいつらはレッドウィンターの生徒たちなのか？#nどこかで見たような気もするが……。"
"10058070-57-トモエ" = "会長。報告によると、#n彼女たちはレッドウィンター連邦学園の183号特別クラスチームとのことです。"
"10058070-58-チェリノ" = "ふむ。……なんだか戦車は奇妙だし、みんな怯えているな。"
"10058070-59-チェリノ" = "他の生徒が見たら、おいらの権威が失墜しかねない。"
"10058070-60-チェリノ" = "装填手、HEAT弾だ。準備ができたら零距離射撃！"
"10058070-61-チェリノ" = "おいらの優勝を阻むものは、全て消してしまえ！"
"10058070-66-アンナ" = "ここで、おしまい……。"
"10058070-67-エリナ" = "ひぃん……。"
"10058070-72-アンナ" = "？"
"10058070-73-エリナ" = "？"
"10058070-77-チェリノ" = "？？"
"10058070-81-アンナ" = "きゃあああっ！！！"
"10058070-82-トモエ" = "チェリノ会長、襲撃です！！！"
"10058070-83-チェリノ" = "この機動性、このエンジン音。久方ぶりだな……。"
"10058070-86-チェリノ" = "[ruby=あじたに]阿慈谷[/ruby]、ヒフミ……！"
"10058070-88-チアキ" = "いやぁ～！！ここでライバルが登場！！運命的ですね！！"
"10058070-89-チアキ" = "レッドウィンター事務局の粛清君1号チームが、#nトリニティ補習授業部のクルセイダーちゃんチームに不意打ちを食らいました！"
"10058070-90-チアキ" = "戦車ランキング2位タイの実力者、#n阿慈谷ヒフミさんが率いる恐ろしいチームです！"
"10058070-91" = "[s] \"ヒフミが戦車ランキング2位なの！？\""
"10058070-92-チアキ" = "あれ？知らなかったんですか？"
"10058070-93-チアキ" = "ゲヘナでも有名な選手ですよ！#nその活躍ぶりからついた二つ名は[ruby=ティターニア]妖精女王[/ruby]！"
"10058070-94" = "[s] \"悪名？可愛らしい名前だけど？\""
"10058070-95-チアキ" = "それがですね――"
"10058070-96-チアキ" = "森の中で出くわしたら、絶対に逃げられないからつけられたらしいです！"
"10058070-97" = "[s] \"それで、妖精女王……！\""
"10058070-98-チアキ" = "他にもっとやばい名前もあるとかないとか！"
"10058070-101-チアキ" = "ところで、なぜ補習授業部チームが#nレッドウィンター事務局チームと対戦することになったのでしょうか？"
"10058070-102-チアキ" = "183号特別クラスチームがやられるのを待ってもよかったですよね！"
"10058070-104" = "補習授業部チーム"
"10058070-105" = "（少し前）"
"10058070-106-ヒフミ" = "困りましたね……。"
"10058070-107-コハル" = "どうしたの、ヒフミ？"
"10058070-108-ヒフミ" = "私たちを攻撃したチームが、昨日会った183号の人たちを狙っているようです。"
"10058070-109-ヒフミ" = "183号の人たちは気付いてないようなので、このままだとやられてしまいます。"
"10058070-110-アズサ" = "こっちの騒動に気を取られて、#n周りの様子が分からなかったのか。初歩的なミスだ。"
"10058070-111-ハナコ" = "つまり、私たちを狙っていた相手は目標を変えたということですね？"
"10058070-112-ヒフミ" = "はい。砲身はまだこちらを向いていますが、#nすぐに183号の方へ目標を切り替えると思います。"
"10058070-113-コハル" = "じゃあ、その隙に逃げちゃえばいいんじゃないの？#n的は全部当てたし、後はゴールすればおしまいでしょ！"
"10058070-114-ヒフミ" = "コハルちゃんの言うとおりです。でも……。"
"10058070-115-アズサ" = "それは、183号を見殺しにするということ。"
"10058070-116-コハル" = "……！"
"10058070-117-ハナコ" = "うーん……それはそうですね……。"
"10058070-118-ハナコ" = "しかし、私たちに取れる手段はあるのでしょうか？#nこの距離から撃っても向こうの装甲は突破できないでしょうし。"
"10058070-119-アズサ" = "また私たちが狙われたら、この低地では孤立してしまう。"
"10058070-120-ヒフミ" = "クルセイダーちゃんのエンジンを酷使したから、少し冷ます必要もありますね。"
"10058070-121-コハル" = "……。"
"10058070-122-ヒフミ" = "……。"
"10058070-123-コハル" = "よく分からないけど……私たちが[ruby=・]代[/ruby][ruby=・]わ[/ruby][ruby=・]り[/ruby][ruby=・]に[/ruby][ruby=・]戦[/ruby][ruby=・]う[/ruby]のは損なんでしょ？"
"10058070-124-ヒフミ" = "そうですね、コハルちゃん。優勝のチャンスを逃す……というか……。"
"10058070-125-コハル" = "じゃあ183号を助けて、私たちも逃げればいいじゃん。"
"10058070-128-ハナコ" = "コハルちゃん！"
"10058070-129-コハル" = "元々あっちは私たちの戦いに割り込んできたんだから！"
"10058070-130-コハル" = "でも再試験も勉強も嫌っ！だから、逃げるのを手伝って終わり！#n私たちは、私たちのやり方で優勝するの！"
"10058070-131-コハル" = "このまま逃げたら、ずっと気になっちゃいそう……だから……。"
"10058070-132-アズサ" = "……。"
"10058070-133-コハル" = "あ、アズサ？"
"10058070-137-アズサ" = "やっぱり私は、こういうコハルが好きだ。"
"10058070-140-コハル" = "え、ええっ！？急に！？どうして！？"
"10058070-141-コハル" = "って、ハナコはなんでニコニコしてるの？#n……もしかして、私なにか見落としてる？"
"10058070-142-ハナコ" = "いいえ、コハルちゃん。何も見落としてはいません。ですが……。"
"10058070-148-ハナコ" = "たとえ見落としていたとしても、そんなコハルちゃんだから良いんですよ。"
"10058070-150-コハル" = "そんな私って、何！？"
"10058070-151-ヒフミ" = "あはは、ハナコちゃん。その言い方だと、コハルちゃんが勘違いしちゃいます。"
"10058070-152-ヒフミ" = "みなさんの意見はどうですか？"
"10058070-153-ハナコ" = "天才コハルちゃんの意見に賛成です。"
"10058070-154-アズサ" = "私も心が痛む。賛成。"
"10058070-155-アズサ" = "「大事な過程」をもう少し楽しめるように手伝おう。"
"10058070-160-ヒフミ" = "コハルちゃん！距離を取ったらダメです！もっと追い込んでください！"
"10058070-161-コハル" = "初めて運転するんだから分かんないわよ！！"
"10058070-162-ヒフミ" = "大変だと思いますが、もう少しです！"
"10058070-165-ヒフミ" = "撃ちます！砲尾に気をつけてください！"
"10058070-169-ヒフミ" = "183号のみなさん！逃げてください！"
"10058070-170-チェリノ" = "あいつら、同盟を結んでいたのか？#nこの状況で助けようとするとは、無謀なことを！"
"10058070-172-アンナ" = "トリニティの人たちだ！！どうしてここに！？"
"10058070-173-エリナ" = "助けに来てくれたってこと？っていうか、あの人たち水着！？"
"10058070-174-ラナ" = "空気抵抗を減らすため？"
"10058070-175-アンナ" = "そんなこと言ってる場合！？早く逃げないと！！"
"10058070-179-ラナ" = "履帯が壊れて空回りしてる。直さないと。"
"10058070-180-アンナ" = "うあああー！！エリナ！！ハンマー持ってきて！！早く早く早く！！"
"10058070-181-エリナ" = "わ、分かった！ちょっと待って！"
"10058070-183-チェリノ" = "絶対に距離を取るな！砲身を向けられないよう、死角から接近しろ！"
"10058070-184-チェリノ" = "この距離では、やつらの火力でもやられるぞ！"
"10058070-185-チェリノ" = "むむ……やつらが攻撃できなくなったのは良いが、#nこのままではおいらたちも攻撃できないな……。"
"10058070-186-チェリノ" = "火力でこちらが勝っている以上、この膠着状態は望ましくない。"
"10058070-187-チェリノ" = "何か妙案は……。"
"10058070-190-マリナ" = "か、会長！！"
"10058070-191-チェリノ" = "何だマリナ。せっかく機会を与えてやったというのに、また裏切るつもりか？"
"10058070-192-マリナ" = "滅相もございません！先日のクーデターは誤解です！"
"10058070-193-マリナ" = "この不肖マリナに、信頼回復のチャンスをお与えください！"
"10058070-194-マリナ" = "敵の戦車に飛び乗る「対戦車突撃」の許可を！チェリノ様！"
"10058070-195-チェリノ" = "……。"
"10058070-196-チェリノ" = "ふむ、素晴らしい忠誠心だ。"
"10058070-197-チェリノ" = "敵戦車を制圧し、この私に優勝カップをもたらした暁には……。"
"10058070-198-チェリノ" = "おいらが直々に、お前に勲章をやろう。"
"10058070-199-マリナ" = "会長が直々に……！"
"10058070-200-チェリノ" = "トモエ。「あれ」を。"
"10058070-201-トモエ" = "はい、会長。こちらホイップクリームです。"
"10058070-202-チェリノ" = "マリナ……お前のもたらす勝利は、#nこのホイップクリームのように滑らかで甘美なものになるはずだ。"
"10058070-205-チェリノ" = "トモエ！マリナの準備をさせろ！"
"10058070-207-チアキ" = "戦車の上に飛び乗るなんて、まるで海賊みたいですね！ヨーホー！"
"10058070-208-イブキ" = "あのお姉ちゃん、すごーい！"
"10058070-209" = "[s] \"これ、アリなの……？\""
"10058070-210-チアキ" = "はい！ルールにないのでオッケーです！"
"10058070-211-チアキ" = "ルールが緩いと、みんなメチャクチャするので3倍は面白くなりますよ！"
"10058070-212-チアキ" = "この激闘を生で見られる183号チームが羨ましいです！"
"10058070-215-ヒフミ" = "誰か飛び乗ってきます！"
"10058070-216-コハル" = "しょ、正気なの！？"
"10058070-217-アズサ" = "妨害されるだけでも致命的だ。ひとまず対処を……！"
"10058070-219-マリナ" = "うおおおっ！！レッドウィンターのために！！"
"10058070-223-マリナ" = "あっ、靴紐が！？"
"10058070-224-マリナ" = "うぎゃあああっ！！！"
"10058070-228-トモエ" = "はぁ……#nマリナ委員長、試合前に靴紐を結んでおくようあれほど言ったのに……。"
"10058070-229-チェリノ" = "情けないやつめ！"
"10058070-238-アンナ" = "んぎぎ……この固定ピンっ！！どうして抜けないの！！"
"10058070-239-アンナ" = "仕方ない、先にテンションスプロケットから外すわよ！エリナ、ハンマー！"
"10058070-240-アンナ" = "子犬号、お願い！！言うことを聞いて！！"
"10058070-241-アンナ" = "このままだと助けに来てくれた補習授業部の人たちがやられちゃう！！"
"10058070-248-エリナ" = "（こんなこと、危なすぎるでしょ……）"
"10058070-249-エリナ" = "（怖い、怖いよぉ……）"
"10058070-250-アンナ" = "エリナ、何してるの！早くハンマーを出して！"
"10058070-251-エリナ" = "……。"
"10058070-252-エリナ" = "もう、やめよう。"
"10058070-255-アンナ" = "え！？"
"10058070-256-ラナ" = "……！"
"10058070-257-エリナ" = "これ以上は危ないだけだよ。"
"10058070-258-エリナ" = "さっきだって……ちょっと運が悪ければ、ラナの頭を直撃してた。"
"10058070-259-エリナ" = "レースに出ようなんて、欲張り言ってごめん。もう、諦めよう――"
"10058070-260-アンナ" = "エリナがやろうって言ったんでしょ！！"
"10058070-261-エリナ" = "……！！"
"10058070-262-アンナ" = "「自信を持て」って、「一緒にかっこよく成功しよう」って！#n私に言ったわよね！"
"10058070-268-アンナ" = "私をその気にさせたんだから、最後まで責任取りなさいよ！！バカぁ～！！"
"10058070-271-エリナ" = "アンナ……。"
"10058070-275-アンナ" = "ラナだって、諦めてない！"
"10058070-276-エリナ" = "ラナ……。"
"10058070-277-ラナ" = "自分の頭は自分で守るから、大丈夫。"
"10058070-283-ラナ" = "最後までやってみよう。それがきっと「大事な過程」になるよ。"
"10058070-291-ラナ" = "諦めない戦車のほうがかっこいいから、エリナも諦めないで。"
"10058070-293-ラナ" = "私たちが作った子犬号を……#nキヴォトスで一番かっこいい、諦めない戦車にしよう。"
"10058070-294-エリナ" = "うっ、ううっ……！"
"10058070-297-エリナ" = "……オッケー！！"
"10058070-298-エリナ" = "どいた、どいたぁ！！ハンマー様のお通りだぁ！"
"10058070-299-エリナ" = "ぐあああっ！！"
