[translation]
"10058100-1" = "第10話;183号、解散します！"
"10058100-2-エリナ" = "ゴホッ、ゴホッ！"
"10058100-3-アンナ" = "火山灰、さらにひどくなってきたわね……。"
"10058100-4-アンナ" = "中で小さく丸まっておきましょうか。"
"10058100-5-エリナ" = "ゴホッ、これなら少しはちゃんと見えると思ったんだけどなぁ……。"
"10058100-6-アンナ" = "大丈夫？"
"10058100-7-エリナ" = "ゴホッ、ゴホッ！大丈夫。ラナは？"
"10058100-8-エリナ" = "……ラナ？"
"10058100-9-ラナ" = "ふと……。"
"10058100-10-アンナ" = "ラナ！？どうしたの？どこか痛い？"
"10058100-11-ラナ" = "そうじゃない。"
"10058100-12-ラナ" = "優勝することを考えてた。"
"10058100-13-エリナ" = "今からウキウキしちゃってんの？あはは！"
"10058100-14-ラナ" = "そうじゃない。"
"10058100-15-ラナ" = "優勝したら、アンナとエリナとはお別れになる。"
"10058100-16-ラナ" = "友達とお別れするのは嫌。"
"10058100-17-アンナ&エリナ" = "えっ？"
"10058100-18-アンナ" = "優勝して恩赦をもらったら、もう会えないと思ってたの？"
"10058100-19-ラナ" = "エリナとアンナは、183号の解散を望んでいるでしょ？"
"10058100-20-エリナ" = "もぉ、ラナってば！めっちゃ可愛い～！"
"10058100-21-アンナ" = "ラナ。183号が特別クラスから解放されても、私たちはずっと友達よ！"
"10058100-22-エリナ" = "もっちろん！アンナと絶交してもラナとは友達だから！"
"10058100-23-アンナ" = "こっちのセリフなんだけど！？"
"10058100-24-ラナ" = "それじゃ、ずっと友達なんだね？"
"10058100-25-アンナ" = "そうよ！183号特別クラスは解散して、#n「183号研究所」を作ってほしいって言いましょう！"
"10058100-26-エリナ" = "それじゃ特別クラスと同じでしょ～！もぉ！"
"10058100-29-エリナ" = "……そろそろこの辺で会いそうな気が――"
"10058100-33-エリナ" = "――したんだけど……。"
"10058100-34-エリナ" = "あ、あれ……？"
"10058100-35-エリナ" = "こんな換気口あったっけ……？"
"10058100-36-エリナ" = "作ってるときは気付かなかった……なぁ……。は、はは……。"
"10058100-39-エリナ" = "しまった！！！"
"10058100-40-アンナ" = "ラナ！！右に急旋回！！早く！！"
"10058100-45-万魔殿の部員C" = "装填完了！"
"10058100-46-イロハ" = "なるほど、思っていたよりも装甲が薄いですね。"
"10058100-47-イロハ" = "APHE弾では、貫通してしまい致命的なダメージにはなりません。#nやはり車体を狙わなくては。"
"10058100-48-イロハ" = "砲手。次は照準器の三角形の頂点に狙いを定めてください。#n真ん中ではありません。"
"10058100-49-万魔殿の部員A" = "了解です！"
"10058100-50-イロハ" = "操縦手。ギアを4速にして、1時方向へ前進。アクセル全開。"
"10058100-51-万魔殿の部員B" = "は、はいっ！"
"10058100-52-イロハ" = "雑な設計かと思いましたが、意表を突かれましたね。"
"10058100-53-イロハ" = "敵が見えたら、合図を待たず撃って構いません。"
"10058100-54-イロハ" = "中止の時はすぐに言いますので。"
"10058100-55-万魔殿の部員A" = "はい！砲尾確保！狙いを定めて、よし！"
"10058100-56-万魔殿の部員A" = "撃ちます！！"
"10058100-63-アンナ" = "すぐ横に落ちたわ！！"
"10058100-64-エリナ" = "ら、ラナぁ！！もうちょっとゆっくり運転して！！吐きそう、うえぇっ！！"
"10058100-65-アンナ" = "砲弾をかわすなんてすごいけど！！う、うぅっ……！！"
"10058100-66-ラナ" = "二度とバックミラーに映らないようにしてやる。"
"10058100-67-アンナ" = "それって、ただ逃げるってこと！？"
"10058100-68-エリナ" = "とにかく隠れて！！砲塔がないから、後退しながら攻撃はできないんだよ！"
"10058100-69-エリナ" = "そうだ！前の火山灰雲に突っ込もう！"
"10058100-71-万魔殿の部員A" = "ちっ……！"
"10058100-72-万魔殿の部員A" = "戦車長！敵戦車、火山灰雲に遮られ見失いました！"
"10058100-73-イロハ" = "これでは、100メートル先も見えませんね……。"
"10058100-74-イロハ" = "砲手。32度、火山灰がゆっくり流れている方向へ……発射。"
"10058100-75-万魔殿の部員A" = "撃ちます！"
"10058100-79-アンナ" = "ひぃっ！！また当たりそうになった！！"
"10058100-80-エリナ" = "しっかりして！！今の砲弾が火山灰を吹き飛ばしたよ！"
"10058100-81-エリナ" = "敵が見えるチャンス！"
"10058100-82-アンナ" = "ラナ、停止！エリナ！敵12時の方向、AP弾！"
"10058100-83-エリナ" = "装填完了！発射っ！！"
"10058100-89-アンナ" = "やった！！当たった！！"
"10058100-90-エリナ" = "いえ～いっ！ど真ん中～っ！"
"10058100-91-ラナ" = "……。"
"10058100-92-ラナ" = "しっかり掴まって！！"
"10058100-95-アンナ" = "え！？"
"10058100-99-エリナ" = "ひいぃ……当たるかと思ったぁ……。"
"10058100-100-アンナ" = "どういうこと！？向こうの戦車、何ともないみたいだけど！？"
"10058100-101-エリナ" = "あんなのあり！？反則でしょ！？"
"10058100-103-万魔殿の部員A" = "ちっ、すばしっこいな……。"
"10058100-104-イロハ" = "被害状況を報告してください。"
"10058100-105-万魔殿の部員D" = "車体前面に弾が当たりましたが、貫通はしていません。弾は恐らくAP弾かと。"
"10058100-106-イロハ" = "前面は虎丸の一番装甲が固い部分。痛くもかゆくもありません。"
"10058100-107-イロハ" = "砲手、報告してください。"
"10058100-108-万魔殿の部員A" = "すみません。また火山灰の中に逃げられて見失いました。"
"10058100-109-イロハ" = "ふむ。"
"10058100-110-イロハ" = "車両停止。ギアをニュートラルにして、現在の位置で待機。"
"10058100-111-イロハ" = "向こうの音を聞いて探しましょう。"
"10058100-113-イロハ" = "逃げてないで、真っ向勝負しにきてください。"
"10058100-114-イロハ" = "お望みどおり、ちゃんと相手になってあげますから。"
"10058100-116-エリナ" = "ゴホッ、ゴホッ……。"
"10058100-117-アンナ" = "エリナ、大丈夫？"
"10058100-118-エリナ" = "うん、ゴホッ。大丈夫だから……。"
"10058100-119-エリナ" = "ラナ、エンジンはどう？"
"10058100-120-ラナ" = "フィルターに火山灰が詰まって止まった。"
"10058100-121-ラナ" = "フィルターを外して、代わりにアンナのストッキングを張っておいたから……#n当分は持つと思う。"
"10058100-122-アンナ" = "ひぃん……良いことがあるたびに履いていたのに……まあ、仕方ないか。"
"10058100-123-エリナ" = "ゴホッ、大丈夫だよ。どうせアンナはストッキングを履いても脚太いから。"
"10058100-124-エリナ" = "いっそ、足にペンキでも塗っとくほうがいいかも？ゴホッ、ははは……。"
"10058100-125-アンナ" = "……そんなこと言う元気があるなら、まだ大丈夫そうね。"
"10058100-126-アンナ" = "（火山灰がひどすぎる。これ以上の時間稼ぎは無理か……）"
"10058100-127-ラナ" = "暑い……。"
"10058100-128-アンナ" = "（みんなも、子犬号も……もう限界ね……）"
"10058100-130-エリナ" = "もう、やめよう。"
"10058100-131-エリナ" = "これ以上は危ないだけだよ。"
"10058100-133-アンナ" = "（諦めたく、ない……）"
"10058100-134-エリナ" = "砲弾もあと、高速徹甲弾が一発……。"
"10058100-135-エリナ" = "正面からの突破は無理。でも側面や後面を取らせてくれる相手じゃない。"
"10058100-136-アンナ" = "伊達に絶対王者と呼ばれてないわね。#nあっちには砲塔があるのに、必ず正面から向かってきているし。"
"10058100-137-ラナ" = "私たちのことは見えていないはずなのに、見えているかのように撃ってくる。"
"10058100-138-エリナ" = "火山灰が舞ってて吹雪みたいだね。#nものすご～くあついことを除いたら……ゴホッ、ゴホッ！"
"10058100-139-アンナ" = "……。"
"10058100-141-エリナ" = "ゴホッ、ゴホッ！"
"10058100-143-エリナ" = "ゴホッ……。"
"10058100-146-アンナ" = "！！"
"10058100-147-アンナ" = "音……。"
"10058100-148-アンナ" = "……これなら、いけるかも。"
"10058100-149-エリナ" = "アンナ？"
"10058100-150-アンナ" = "仮説は検証しないと！"
"10058100-151-アンナ" = "一泡、吹かせてやりましょう！！"
"10058100-156-イロハ" = "音が聞こえなくなりましたね。逃げたのでしょうか。"
"10058100-157-イロハ" = "ゆっくり離れましょう。ギアを2速にして、静かに……。"
"10058100-158-イロハ" = "あ――"
"10058100-164-イロハ" = "あれは……。"
"10058100-167-イロハ" = "射撃中止を言い忘れてました……！"
"10058100-168-イロハ" = "罠です！！！射撃中――"
"10058100-169-万魔殿の部員A" = "撃ちます！"
