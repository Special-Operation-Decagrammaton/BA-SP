[translation]
"10058020-1" = "第2話;今からお互いに……"
"10058020-3" = "競技場"
"10058020-4" = "（レース当日）"
"10058020-8-エリナ" = "よっしゃー！やるぞー！"
"10058020-9-アンナ" = "カフェイン、補給完了！"
"10058020-10-アンナ" = "とうとう、本当の本当に始まるのね……！"
"10058020-11-アンナ" = "見て！昨日見た戦車が集まってるわ！"
"10058020-12-エリナ" = "ちょっ！落っこちるって！座って準備しなよ～！"
"10058020-13-アンナ" = "こんな光景、次にいつ見られるか分からないのよ！？#n記念写真くらい撮っておかないと！"
"10058020-14-ラナ" = "ブイー"
"10058020-15-アンナ" = "いいわね、ラナ！ブイ！"
"10058020-16-エリナ" = "恥をかくだの何だの言ってたくせに……。"
"10058020-17-アンナ" = "その話はやめて！"
"10058020-20-ラナ" = "あっ。"
"10058020-21-ラナ" = "先生が来た。"
"10058020-22-アンナ&エリナ" = "先生！？"
"10058020-23" = "[s1] \"やあ！\"\n[s2] \"準備は順調？\""
"10058020-26-アンナ" = "当然です！私たちは、183号特別クラスですから！"
"10058020-27-アンナ" = "レースを見に来てくださったのですか？それとも、シャーレのお仕事ですか？"
"10058020-28" = "[s] \"[ruby=パンデモニウム・ソサエティー]万魔殿の招待で[/ruby]、レースを解説することになってるんだ。\""
"10058020-29-エリナ" = "えっ！先生が解説するんですか！？な、なんか緊張してきた……。"
"10058020-30-ラナ" = "偏った解説をお願いします。"
"10058020-31-アンナ" = "それはさすがに……！#nただ、心持ちこちらに注目した実況をしていただけるだけで十分です！"
"10058020-32-エリナ" = "それが偏った解説でしょ。"
"10058020-33-アンナ" = "先生のおかげで、ここまで来ることができました。"
"10058020-34-アンナ" = "必ず優勝するので、見ていてください！"
"10058020-36" = "[ns] \"みんなが楽しめたら、それで十分だよ！\""
"10058020-37-エリナ" = "ありがとうございます！でも、絶対に優勝もします！"
"10058020-38-エリナ" = "そうだ、ちょうど写真を撮ってたところなんです！先生も一緒に撮りましょ～！"
"10058020-39-アンナ" = "う、腕が限界……！みんな早く集まって！"
"10058020-41" = "[ns] みんなと一緒にカメラの前に立つ。"
"10058020-42-アンナ" = "はいっ！ピロシキー！"
"10058020-50-イロハ" = "ふぅ……。"
"10058020-51-チアキ" = "イロハちゃん！「週刊[ruby=ぱんでも]万魔殿[/ruby]」の表紙だよ～！はいチーズ！"
"10058020-52-チアキ" = "もっと胸を張って！いや、そのダウナーな感じもアリか……？"
"10058020-53-チアキ" = "ちょっとイロハちゃん！戦車の中に隠れないでよ～！"
"10058020-54-イロハ" = "別に隠れているわけじゃないです。"
"10058020-55-イロハ" = "チアキが「勝手に」写真を撮って「勝手に」記事を書くのが嫌なんですよ。"
"10058020-57-チアキ" = "そんなぁー！嘘は書いてないのにー！"
"10058020-58-イロハ" = "……前回「戦車は私の家族のような存在」と言ったら、#nふざけた記事のタイトルをつけましたよね？"
"10058020-59-チアキ" = "あはは……#n読者をワクワクさせるために、ちょ～っと大袈裟に書いたけど……。"
"10058020-60-サツキ" = "どんなタイトルだったの？"
"10058020-61-イロハ" = "『[ruby=なつめ]棗イ[/ruby]ロハ、隠された家族がいた』"
"10058020-62-チアキ" = "か、家族が増えるのは良いことでしょ？"
"10058020-63-イロハ" = "チアキ……頭蓋骨はいくつの骨で構成されているか、知ってますか？"
"10058020-64-チアキ" = "この前の特集記事で取材したから知ってるよ！23個だよね！"
"10058020-65-イロハ" = "今からそれを、230個に増やしてあげましょうか？"
"10058020-66-チアキ" = "ひえっ……！"
"10058020-67-チアキ" = "あっはっは！私は今のままで十分かな～！"
"10058020-68-マコト" = "イロハ！まさか宣伝活動をしないつもりか！？"
"10058020-69-マコト" = "それは許さんぞ！万魔殿の威容を、キヴォトス全土に轟かせるのだ！"
"10058020-70-イロハ" = "一体何の関係があるんですか……。"
"10058020-71-マコト" = "キキキッ、理由を挙げれば100では足りん！まず――"
"10058020-72-イロハ" = "もう結構です。本当に理由を聞きたかったわけではないので"
"10058020-73-イロハ" = "降りますから、駄々をこねないでください。"
"10058020-78-イロハ" = "……これでいいですね？"
"10058020-79-チアキ" = "あれ？あのセクシーなユニフォームじゃないの？"
"10058020-80-マコト" = "わざわざ特注で作ったというのに、何故いつもの服装なんだ！"
"10058020-81-イロハ" = "何度も言ってるじゃないですか……。#nあれはレースアンバサダーの衣装であって、選手が着るものじゃありません。"
"10058020-82-マコト" = "よく聞け、イロハ。万魔殿はゲヘナのトップで、お前は万魔殿の戦車長……。"
"10058020-83-マコト" = "つまり……#nゲヘナの注目度は、お前がいかに目立つかにかかっているということだ！"
"10058020-84-マコト" = "情報部から、シャーレの先生はそのような服装が好きだという報告があった。"
"10058020-85-マコト" = "解説として招待された先生が、その姿を見て魅了されれば……#nゲヘナがこのキヴォトスを支配するのも時間の問題だ！"
"10058020-86-イロハ" = "だから、それはレースに出る人が着るのではなく……。"
"10058020-87-イロハ" = "はぁ……もう説明するのも面倒になってきた……。"
"10058020-88-イロハ" = "……それなら、その服をちゃんと配ってから言ってください。#nないものを着ることはできません。"
"10058020-89-イロハ" = "それに……#n万魔殿の議長であり、大会実行委員長であるマコト先輩はどうして着ないんですか？"
"10058020-90-マコト" = "キキキッ！良い質問だ！"
"10058020-91-マコト" = "当然、万魔殿を代表するこのマコト様も……#n先生を引き入れるために、この身を捧げるつもりだ！"
"10058020-92-マコト" = "サツキ！[ruby=・]ア[/ruby][ruby=・]レ[/ruby]を持ってきてくれ！"
"10058020-93-サツキ" = "ええ、マコトちゃん！もう準備できてるわよ！"
"10058020-94-サツキ" = "じゃあ――"
"10058020-104-マコト" = "これは、つまり……。"
"10058020-105-マコト" = "なるほど、バカに[ruby=・]だ[/ruby][ruby=・]け[/ruby][ruby=・]見[/ruby][ruby=・]え[/ruby][ruby=・]る[/ruby]服ということか！"
"10058020-106-マコト" = "キッ、キキキッ。すぐに着てやろう！"
"10058020-111-イロハ" = "そんなもの、あるわけないでしょう……。"
"10058020-112-イロハ" = "よく見てください。箱の中は空っぽです。"
"10058020-113-サツキ" = "あ、あら……？服はどこにいっちゃったのかしら？#n箱は開けていないはずだけど……。"
"10058020-114-イブキ" = "昨日、イブキが持ってきた時は重かったよ！"
"10058020-115-マコト" = "ふ、服がなくなっただと？"
"10058020-116-イロハ" = "着替える服もないのに、なんで脱ごうとしてるんですか。"
"10058020-117-チアキ" = "ポーズはそのままで！あ～、いいシャッターチャンスだったのにぃ～！"
"10058020-118-マコト" = "これは万魔殿の権威に対する挑戦だ！"
"10058020-119-イロハ" = "どっちでも良いですが、そろそろレースの時間ですよ。"
"10058020-120-マコト" = "やはり風紀委員の仕業か！？[ruby=そらさき]空崎[/ruby]ヒナめ、お前にはやらんぞ！"
"10058020-121-イロハ" = "はいはい。虎丸チーム、総員乗車！"
"10058020-124-万魔殿の部員B" = "総員、乗車！"
"10058020-125-イブキ" = "行ってらっしゃい！頑張ってね、イロハ先輩！"
"10058020-126-イロハ" = "ありがとうございます。イブキも、楽しんでください。"
"10058020-127-イブキ" = "うん！"
"10058020-128-サツキ" = "イロハ。イブキちゃんを連れていかなくても大丈夫なの？"
"10058020-129-イロハ" = "はい。イブキは賢いですが、レースは危険を伴いますので。"
"10058020-130-イロハ" = "イブキもちゃんと分かってくれて良かったです。"
"10058020-131-マコト" = "チアキ！書きとめておけ！#n「この[ruby=はぬま]羽沼[/ruby]マコトは、窃盗犯に対し……」"
"10058020-132-イロハ" = "はあ……スタートの合図は、サツキ先輩がしてください。"
"10058020-133-イロハ" = "虎丸、発進。"
"10058020-138-サツキ" = "みんな～、準備はいいかしら～？"
"10058020-139-サツキ" = "ゲヘナカップ、そろそろ始まるわよ？"
"10058020-142-サツキ" = "ルールは簡単。サーキット内の全ての的を砲撃して、ここに戻ってくること！"
"10058020-143-サツキ" = "良い子のみんなは、もうちゃんと覚えたかしら？"
"10058020-146-サツキ" = "速く走るのも大事だけど――"
"10058020-148-サツキ" = "ルールを守って――"
"10058020-151-アンナ" = "スパーギア、ヘリカルギア、ベベルギア、ラックギア……。"
"10058020-152-エリナ" = "ブツブツ言って、どしたの？"
"10058020-153-アンナ" = "緊張してるから、思いついたままギアの種類を言ってるの……。"
"10058020-154-エリナ" = "それって効果ある？"
"10058020-155-アンナ" = "少しは……。"
"10058020-156-エリナ" = "そっか……。"
"10058020-157-エリナ" = "水平リーベぼくの船名前があるシップスクラークか……。"
"10058020-158-アンナ" = "ハイポイドギア、サイクロイドギア……。"
"10058020-159-ラナ" = "10 PRINT こんにちは 先生 20 END RUN。"
"10058020-160-サツキ" = "準備できたわね？それじゃあ――"
"10058020-164-サツキ" = "スタート～！"
"10058020-167-アンナ" = "戦車、前進！"
"10058020-168-ラナ" = "出発～"
"10058020-171-アンナ" = "速度では負けないわ！こっちにはターボチャージャーもついてるんだから！"
"10058020-172-エリナ" = "序盤の主導権を握るのが大事！まず先頭に立って――"
"10058020-175-アンナ" = "い、今のは何！？タイヤがパンクした音！？"
"10058020-176-エリナ" = "戦車にタイヤなんてないでしょ！隣の戦車が爆発したんだよ！"
"10058020-177-アンナ" = "ええーっ！？"
"10058020-180-レーシングヘルメット団A" = "何もかもぶっ壊せ！！！"
"10058020-181-レーシングヘルメット団B" = "ライバルを排除するのが、勝利への近道だー！"
"10058020-182-アンナ" = "なにこれ！？"
"10058020-183-レーシングヘルメット団A" = "なんだぁ？あのヘンテコなボロ車は？"
"10058020-184-レーシングヘルメット団B" = "何でもいいよ！ぶっ壊しちゃえー！！ヒャッホー！！！"
"10058020-185-エリナ" = "どぅわあああ！！こっちにきたああああああ！！！！"
