[translation]
"10058060-1" = "第6話;逃げれば3、参加すれば1"
"10058060-3-エリナ" = "あの、えっと……聞きたいことは山ほどあるんだけど……。"
"10058060-4-アンナ" = "何から聞けばいいのか……。"
"10058060-7-ミチル" = "ぷはあーっ！！"
"10058060-8-ミチル" = "すっごく甘くておいしいね！このお水、お砂糖でも入ってる？"
"10058060-9-ツクヨ" = "た、助かりました……乗せていただき、ありがとうございます！"
"10058060-10-アンナ" = "えっと、何から聞けばいいかしら……。"
"10058060-11-イズナ" = "何やら、私たちに聞きたいことがあるご様子！"
"10058060-12-イズナ" = "こんなこともあろうかと、部長が質問と回答を書いてくれています！"
"10058060-13-ミチル" = "レース前日までに、散々あれこれ聞かれたからね……。"
"10058060-16-アンナ" = "えっと……。"
"10058060-17-アンナ" = "「1番。はい、戦車です。砲と車体があるということで、#n運営に戦車だと認められました。私も納得はしていません。」"
"10058060-18-エリナ" = "「2番。ゲヘナカップをテーマにネタ動画を撮ろうと段ボールで作ったのですが……#nふざけて書いた参加申込書を誤って出してしまい、本戦まで来てしまいました。」"
"10058060-19-ツクヨ" = "すみません、すみません……#n本当に参加するものだと思って出しちゃいました……。"
"10058060-20-ミチル" = "気にしないで！参加するなら逃げずに戦おうって言ったのは、私だからさ！"
"10058060-21-アンナ" = "あ、そうなんですね……。"
"10058060-22-アンナ" = "すごく大変そうですけど、どうして交替し……。"
"10058060-23-ミチル" = "その答えは7番。うぅ……疲れ果てて眠くなってきた……。"
"10058060-24-エリナ" = "「7番。元々交替しながら進む予定でしたが、#n運営からレース中の部品構成の変更に当たると言われたので、#nそれからずっとこの状態です。」"
"10058060-25-エリナ" = "あ～、部品判定なんだぁ。"
"10058060-26-イズナ" = "砲塔を少しでも軽くするためにヘリウムガスも吸ったのですが、#n効果はありませんでした！"
"10058060-27-エリナ" = "アプローチの方向性は間違ってないんだけどね。"
"10058060-28-ミチル" = "ああっ！そういえば、まだ自己紹介をしてなかった！忍者の基本なのに！"
"10058060-29-ミチル" = "ドーモ、お初にお目にかかります、敵戦車殿。#n小生、百鬼夜行連合学院忍術研究部部長、ミチルと申す。"
"10058060-30-ツクヨ" = "お、[ruby=おおの]大野[/ruby]ツクヨです。忍術研究部の部員です！"
"10058060-31-イズナ" = "[ruby=くだ]久田[/ruby]イズナです！#n忍術研究部部員で砲塔を担当しています！ニン……。"
"10058060-32-イズナ" = "あっ！砲塔らしくやらないと！"
"10058060-33-イズナ" = "パンパン！！"
"10058060-34-ミチル" = "え！？そんなルールあったの！？"
"10058060-35-ツクヨ" = "ぶ、ブーンブーン！"
"10058060-36-ラナ" = "ブーンブーン。"
"10058060-37-アンナ" = "私たちもやるの！？"
"10058060-38-エリナ" = "んなワケないでしょ！私たちは部品じゃないんだから！"
"10058060-39-エリナ" = "えーっと、こっちも自己紹介しておくね。#n私たちはレッドウィンター連邦学園の183号特別クラス。#nこのガチャガチャうるさいのはアンナ、私はエリナ。"
"10058060-40-アンナ" = "誰がガチャガチャうるさいよ！#nやっぱり、私ばっかり勲章持ってるからって僻んでるんでしょ！"
"10058060-41-エリナ" = "うんうん、そだねー。それで、運転席にいるのはラナ。"
"10058060-42-ラナ" = "ブーンブーン。"
"10058060-43-ツクヨ" = "あ、あの……改めて、乗せていただきありがとうございます。"
"10058060-44-ミチル" = "敵同士なのに、助けてくれてありがとう！"
"10058060-45-アンナ" = "いいんですよ！戦車に乗れば、みんな仲間です！"
"10058060-46-アンナ" = "どこまで送ればいいですか？"
"10058060-47-ミチル" = "丘の上まで連れっててもらえれば……#n坂がきつくて、とてもじゃないけど登れなさそうでさ……。"
"10058060-48-ミチル" = "でも、残りは私たちの力でやり遂げてみせる！"
"10058060-49-エリナ" = "ホントに大丈夫？危ないし、すっごく大変だと思うけど。"
"10058060-50-アンナ" = "もう少し休んでから出発してもいいんじゃないですか？"
"10058060-51-ミチル" = "気持ちはありがたいけど、忍者とは一処にとどまらず、むやみに頼らないもの！"
"10058060-52-ツクヨ" = "こ、ここまで来たら……最後まで頑張ってみたいんです……！"
"10058060-53-イズナ" = "イズナも同じ思いです！"
"10058060-54-ミチル" = "にしても……183号殿の戦車はすごく不思議な形だねぇ！#n私たちが言うことじゃないけど。"
"10058060-55-ミチル" = "こういうの、高いんでしょ？"
"10058060-56-イズナ" = "私たちもお小遣いを貯めて、テープをたっくさん買いました！"
"10058060-57-アンナ" = "実は……廃品で作ったものだから、材料費はかかっていないんです。"
"10058060-58-ミチル" = "すごい！廃品から戦車を作ったの！？私たちは忍術の道具がやっとなのに！"
"10058060-59-アンナ" = "……さっきから気になっていたんですけど、「忍術」って何ですか？"
"10058060-60-ミチル" = "うにゃあっ！？忍術を知らないの？"
"10058060-61-ミチル" = "忍術というのは！つまり！"
"10058060-62-ミチル" = "えっと……すごく複雑なもので……。"
"10058060-63-イズナ" = "隠れて偵察したり、シュババババッ！と現れたりするんです！"
"10058060-64-ミチル" = "そうそう！そのとおり！"
"10058060-65-アンナ" = "隠れて偵察して、突然現れる？"
"10058060-66-エリナ" = "あ～、分かった分かった！"
"10058060-67-アンナ&エリナ" = "百鬼夜行の事務局の人たちってことか（ね）！"
"10058060-68-ツクヨ" = "事務局、ですか？"
"10058060-69-ミチル" = "たぶんそれ！"
"10058060-70-イズナ" = "よく分かりませんが……似たようなものがあるなら、そうだと思います！"
"10058060-73-イズナ" = "改めて、助けていただきありがとうございます！"
"10058060-74-ミチル" = "この恩は、決して忘れないよ！"
"10058060-75-ツクヨ" = "おかげさまで、また頑張れます……！"
"10058060-77-アンナ" = "絶対に完走してくださいね！応援してますから！"
"10058060-78-エリナ" = "ケガしないでね～！"
"10058060-79-ラナ" = "お別れです。かっこいい戦車よ。"
"10058060-81-ミチル" = "行くよ！"
"10058060-82-ツクヨ" = "は、はいっ！"
"10058060-83-イズナ" = "パンパン！！"
"10058060-86-アンナ" = "……私たちは、すごく頑張ってきたと思ってた。"
"10058060-87-アンナ" = "戦車も作って、予選も何とか通過して。"
"10058060-88-アンナ" = "けどあの人たちは、段ボール戦車でここまで来たのね。"
"10058060-89-アンナ" = "なんてかっこいいの……！私もあの不屈の闘志を見習わなきゃ。"
"10058060-90-ラナ" = "諦めない戦車、かっこいい。"
"10058060-91-エリナ" = "……。"
"10058060-92-アンナ" = "エリナ？考え込んでどうしたの？"
"10058060-95-エリナ" = "う、ううん。何もない。それよか、早く出発しよ。"
"10058060-96-エリナ" = "ラナ、3つ目の的に向かおう！"
"10058060-97-ラナ" = "今はダメ。"
"10058060-98-ラナ" = "丘の下、乱戦になってる。"
"10058060-99-アンナ" = "うわ～、やっぱり遅かったか～"
"10058060-101" = "アビドスチーム・ホルス1号"
"10058060-104-セリカ" = "外れた！アヤネちゃん、このまままっすぐに進んで！"
"10058060-105-アヤネ" = "ちょ、直進ー！"
"10058060-106-ノノミ" = "装填完了～"
"10058060-109-シロコ" = "聞こえる？ファウスト。別名、[ruby=あじたに]阿慈谷[/ruby]ヒフミ。"
"10058060-110-シロコ" = "水着戦車団の名は譲らないから。"
"10058060-111-セリカ" = "シロコ先輩！！無線で挑発してどうするの！"
"10058060-112-セリカ" = "撃つわよ！"
"10058060-113-ノノミ" = "駐退距離、確保～"
"10058060-120" = "補習授業部チーム・クルセイダーちゃん"
"10058060-122-コハル" = "ひゃあっ！！やられた！！"
"10058060-123-コハル" = "だ、脱出しなきゃ！！"
"10058060-124-ハナコ" = "あら、ヒフミ隊長の指示もないのに敵前逃亡はダメですよ。"
"10058060-125-ハナコ" = "安心してください、ちゃんとエアバッグもありますから♡"
"10058060-130-コハル" = "死刑っ！！水着姿でそんなことしないで！！"
"10058060-131-ハナコ" = "戦車内のエアコンが故障しているので、水着姿なのは仕方がありません。"
"10058060-132-ハナコ" = "もしかして、水着でもまだ暑いですか？"
"10058060-137-コハル" = "ああもう！！近づかないで！！出ていって！！"
"10058060-141-ヒフミ" = "あはは……砲弾は装甲で弾かれたので大丈夫ですよ、コハルちゃん。"
"10058060-142-ヒフミ" = "アズサちゃん、標的の左側を狙ってくれますか？#n合図を送ったらすぐに右折します。"
"10058060-143-アズサ" = "分かった、ファウスト。"
"10058060-144-ヒフミ" = "そ、そんなこと覚えなくていいですよ！"
"10058060-145-アズサ" = "響きがかっこよくて。ヒフミにぴったり。"
"10058060-146-コハル" = "なにのんきなこと言ってるの！集中してっ！"
"10058060-147-ヒフミ" = "アズサちゃん、いきますよ。3、2……。"
"10058060-148-アズサ" = "……1、発射！"
"10058060-152-アズサ" = "砲身の先に直撃。もう一発いこう、ヒフミ。"
"10058060-153-ヒフミ" = "いえ、その必要はありません。しばらくの間、無力化できればいいので。"
"10058060-156-ヒフミ" = "アビドスのみなさん、聞こえますか！おケガはないですか？"
"10058060-159-アヤネ" = "はい、大丈夫です！全員無事で……。"
"10058060-160-シロコ" = "ファウスト、まだ終わってない。行くとこまで行こう。"
"10058060-161-ヒフミ" = "あはは……みなさんがご無事で良かったです。"
"10058060-163-セリカ" = "先輩！！まだアヤネちゃんが話してるでしょ！"
"10058060-164-セリカ" = "無線機をこっちに渡しなさい！没収よ、没収！"
"10058060-165-アヤネ" = "砲身の先端が曲がっているので、もう砲撃は無理ですね……それでは……。"
"10058060-169-シロコ" = "ファウスト！いざ尋常に勝負！"
"10058060-174-ノノミ" = "シロコちゃん、戦車より速いですね☆"
"10058060-175-セリカ" = "感心してる場合じゃないでしょ！先輩、早く！この隙に何とかするわよ！"
"10058060-178-コハル" = "何あの人！？さっきから誰かの名前を呼んで――"
"10058060-181-コハル" = "というか、速っ！銃弾も全部避けてるじゃん！"
"10058060-182-コハル" = "戦車を降りて戦ってもいいの！？戦車レースなのに？"
"10058060-183-ハナコ" = "競技規則にないことは、何をしても失格事由にならないようです。"
"10058060-184-ハナコ" = "それと……同じチームの人の耳を噛むことも、失格事由にはならないんですよ？"
"10058060-188-コハル" = "ひ、ひやあぁん……。"
"10058060-189-コハル" = "って、何してるのよ！！"
"10058060-190-ハナコ" = "えへへっ。なんだか水餃子みたいに見えて、つい♡"
"10058060-191-コハル" = "変態！死刑っ！！！"
"10058060-196-コハル" = "あ、あれ！？あの人は！？さっきまで照準器で見えてたのに！！"
"10058060-206-コハル" = "どこに行ったの……？"
"10058060-211-コハル" = "きゃあぁっ！！"
"10058060-213-シロコ" = "逃がさない。"
"10058060-214-シロコ" = "出てきて、みんなで勝負しよう……。"
"10058060-217-セリカ" = "うわあっ！！ごめん！！シロコ先輩！！"
"10058060-218-ホシノ" = "うへ～セリカちゃん、先輩にそんなに不満溜まってたの？"
"10058060-219-セリカ" = "やられた砲身の先端を切り落としたら、こうなっちゃったの！#nわざとじゃないから！！"
"10058060-220-アヤネ" = "シロコ先輩、大丈夫ですか！？"
"10058060-224-セリカ" = "親指を立ててる！大丈夫みたい！"
"10058060-225-ノノミ" = "ところで、シロコちゃんはどこを見ているんでしょうか……？#n明後日の方向を見て笑っていますが……。"
"10058060-226-ホシノ" = "学校の裏庭にある柿の木から落ちた時のことを思い出すね～"
"10058060-227-セリカ" = "ひとまずこのピンチを切り抜けないと！次弾装填！！"
"10058060-229-コハル" = "はぁ……はぁ……心臓が止まるかと思った！"
"10058060-230-コハル" = "どうするの！？あっち、まだ戦おうとしてるけど！撃破したんじゃないの！？"
"10058060-231-アズサ" = "決して屈しない闘志、気に入った。"
"10058060-232-コハル" = "感心してる場合じゃないでしょ！"
"10058060-233-ヒフミ" = "えっと……このまま戦っても、いつまでも終わらないと思います。"
"10058060-234-ヒフミ" = "お互いすべての弾を撃ち尽くしても、決着はつかないでしょう。"
"10058060-235-ハナコ" = "本当ですか？私たちの方が有利だと思ったんですが。"
"10058060-236-ヒフミ" = "あちらは砲身が短くなって、[ruby=・]砲[/ruby][ruby=・]口[/ruby][ruby=・]速[/ruby][ruby=・]度[/ruby]が落ちました。#n外れたのもそのせいです。"
"10058060-237-ヒフミ" = "それなら速度に関係なく貫通力が一定している化学エネルギー弾を使うべきですが、#n装甲に弾かれた時の音がAP弾のそれでした。"
"10058060-238-コハル" = "ほ、[ruby=・]砲[/ruby][ruby=・]速[/ruby][ruby=・]口[/ruby][ruby=・]度[/ruby]？"
"10058060-239-ハナコ" = "なるほど。いわゆる弾道学のお話ですね。"
"10058060-240-アズサ" = "なら貫通力が著しく落ちているだろう。"
"10058060-241-ヒフミ" = "おそらく、今ごろ……。"
"10058060-244-コハル" = "ひゃぁっ！？"
"10058060-245-ハナコ" = "やはり、あちらの砲撃では私たちの装甲を突破することはできませんね。"
"10058060-246-アズサ" = "音だけで弾の種類を判別できるなんて、ヒフミは戦士みたいだな。"
"10058060-247-ヒフミ" = "あ、あはは……あくまで趣味程度ですが……。"
"10058060-248-コハル" = "ああもう！つまりは、私たちが勝つってことでしょ！？"
"10058060-249-アズサ" = "いや、そうじゃない。#nこっちも向こうの装甲を貫通できないから、走行不能にして逃げる計画だった。"
"10058060-250-アズサ" = "つまり、引き分け。いくら撃ち合っても時間の無駄ということだ。"
"10058060-251-ヒフミ" = "そうですね。引き分けで手を打つのが最善かもしれません。"
"10058060-252-コハル" = "（ヒフミは戦車に乗ると、ちょっと人が変わる気が……）"
"10058060-253-ヒフミ" = "今の状態で無線が使えるか分からないので、直接話をしてきます。"
"10058060-257-ヒフミ" = "あ、あの！アビドスのみなさ～ん！"
"10058060-259-アヤネ" = "ヒフミさんが体を乗り出してハンカチを振っています！"
"10058060-260-アヤネ" = "でも服装が……これ、水着……ですか……？"
"10058060-261-ホシノ" = "なんであんな格好なのかは分からないけど……やっぱりこれ以上は無意味だよね～。#nヒフミちゃんも分かってるみたい。"
"10058060-262-セリカ" = "どうして？まだピンピンしてるでしょ？"
"10058060-263-ホシノ" = "だって――"
"10058060-264-ホシノ" = "ふあぁ――"
"10058060-267-ホシノ" = "…………ふにゃ。"
"10058060-268-セリカ" = "途中で寝ないで、最後までちゃんと言いなさいよ！！"
"10058060-269-ノノミ" = "これは……交渉の要求、でしょうか？#nシロコちゃんも連れてこないといけないので、こちらとしてはありがたいですが。"
"10058060-270-セリカ" = "シロコ先輩、大丈夫かな……？さっきから穏やかな表情で花占いしてるけど……。"
"10058060-271-アヤネ" = "それでは、シロコ先輩と合流しつつ、休戦を提案しに行きましょうか。"
"10058060-276-アヤネ" = "失礼します！"
"10058060-277-セリカ" = "ひとまず休戦ってことにし――"
"10058060-280-ホシノ" = "ふにゃ……うあっ！？"
"10058060-281-ホシノ" = "全員しっかり掴まって！！砲弾が飛んでくる！！"
"10058060-282-ノノミ" = "ええっ！？"
"10058060-283" = "ドッカーン！！"
"10058060-284-事務局員A" = "距離8500メートル、敵戦車1両撃破！"
"10058060-285-事務局員B" = "第二目標、クルセイダー！煙幕展開後に離脱！見失いました！"
"10058060-286-？？？" = "ふむ、なかなかの速さだ。#nやはりトリニティの「[ruby=ティターニア]妖精女王[/ruby]」を先に捕まえるべきだったかな。"
"10058060-287-？？？" = "終わったのか、トモエ？"
"10058060-290-トモエ" = "いえ、書記長。"
"10058060-291-トモエ" = "これは始まりです。"
"10058060-294-コハル" = "何なの、アレ！？"
"10058060-295-ハナコ" = "みなさん、大丈夫ですか？アビドスの方たちが突然爆発しましたが……。"
"10058060-296-アズサ" = "私は大丈夫。#n南東7000メートルの高地から砲撃されたみたいだ。"
"10058060-297-ヒフミ" = "ここでしばらく止まりましょう。#n草で隠れて、私たちの位置は分からないはずです。"
"10058060-298-アズサ" = "でもこの位置は圧倒的に不利だ。#n敵が隙を見せない限りここから一歩も動けない。"
"10058060-299-ヒフミ" = "そうですね、アズサちゃん。#n煙幕を張っても位置を予測して撃ってきたので、逃げるのは無理でしょうね。"
"10058060-300-ヒフミ" = "望遠鏡でしばらく観察します。#n音と威力を考えると、撃っているのはおそらく56口径100ミリのHE弾でしょう。#n使う人は珍しいですが。"
"10058060-301-コハル" = "どうしてそんなこと知ってるの……？"
"10058060-302-ヒフミ" = "あはは、たまたま知ってただけですよ。#n……あ！例の戦車、あっち側に撃ち始めましたよ！えっと、あそこは……。"
"10058060-303-アズサ" = "ヒフミ？"
"10058060-304-ヒフミ" = "……！"
