[translation]
"10058030-1" = "第3話;交戦規定？"
"10058030-2-チアキ" = "さあ始まりました、ゲヘナカップ！#n初っ端から、砲撃合戦の影響で#n全80チームのうち50チームがスタートできなかったみたいですね！"
"10058030-3-チアキ" = "改めまして、本日の解説は[ruby=もとみや]元宮[/ruby]チアキ、#n[ruby=たんが]丹花[/ruby]イブキ！そしてシャーレの先生でお送りします！"
"10058030-4" = "[s] \"シャーレの先生です！\""
"10058030-5-イブキ" = "ババーン！っておっきな弾を撃つ戦車がいたよ！"
"10058030-6-チアキ" = "はいっ！イブキちゃんの言うとおり、本大会のダークホースである#nトリニティ総合学園の「救護騎士団チーム」が大活躍ですね！"
"10058030-7-チアキ" = "しかし重い装甲と巨大な砲塔が災いしてか、どんどん速度が落ちています！"
"10058030-8-チアキ" = "これはレースですから、強さだけではなくスピードも大事ですよ～！"
"10058030-9-チアキ" = "撃破数1位をとっても意味がありませんからね！現在の順位はビリです！"
"10058030-10" = "[s] \"サーキットを外れてもいいの？\""
"10058030-11-チアキ" = "もちろんです！本大会で一番大事なルールは#n「全ての的を砲撃してスタートラインまで戻ってくる」ですから！"
"10058030-12-チアキ" = "つまり……サーキットを外れても、どの的から砲撃してもオッケーってことです！"
"10058030-13-チアキ" = "それどころか、他の戦車を破壊しても問題ありません！"
"10058030-14-イブキ" = "わあ～！ゲヘナっぽくって楽しいね！"
"10058030-15-チアキ" = "ではここで歴代の大会記録をご紹介します！"
"10058030-16-チアキ" = "大会終了の最短記録は53秒！#n戦車が全てスタートラインで破壊されたので優勝者は出ませんでした！"
"10058030-17-チアキ" = "一方、最長記録は455日と8時間！#n優勝が決まる頃には、中継の視聴率は0%でした！"
"10058030-18-イブキ" = "あれ？そういえば、マコト先輩は大会に出ないの？"
"10058030-19-チアキ" = "マコト先輩は免許の筆記試験に落ちちゃったから出られないんです！"
"10058030-20-イブキ" = "めんきょの試験って、そんなに難しいの？"
"10058030-21-チアキ" = "難しさの問題じゃなかったみたいですよ？#nマコト先輩、「ゲヘナは常に前進する！」とか言って、#nマークシートを無視して文章で回答してたようですし、そのせいですかね。"
"10058030-22-イブキ" = "そうなんだ……。次は受かるといいね！"
"10058030-23-チアキ" = "さすが、イブキちゃんはやさしいですね！#n様々な試験を控えているみなさんが、良い結果を出せるように祈っています！"
"10058030-24-チアキ" = "では中継カメラに戻ります！#nミレニアムサイエンススクールの「C&Cチーム」を見てみましょう！"
"10058030-25-イブキ" = "チャンネルは、そのままだよ！"
"10058030-33-アカネ" = "目標に命中。マニホールド異常なし。"
"10058030-34-カリン" = "プリズムセンサー、安定稼働中。充電完了。"
"10058030-35-アスナ" = "すご～い！この戦車、光がババーンって出るよ！"
"10058030-36-ネル" = "知らずに撃ってたのか！？ったく、マニュアルくらい読んどけよ……。"
"10058030-37-アスナ" = "あははっ！実際に触るほうが早く覚えると思って！"
"10058030-38-ネル" = "スマホの機種変じゃねえんだぞ？"
"10058030-39-ネル" = "しっかし、そんなんで当てるなんてよ。すげぇじゃん。"
"10058030-40-アスナ" = "目標をセンターに入れてスイッチを押すだけだよ？"
"10058030-41-ネル" = "はっ！アスナらしいな。#nいつも思いつくままにやって、うまくいっちまうんだからな……。"
"10058030-42-アカネ" = "部長、このまま進みますか？"
"10058030-43-ネル" = "ああ！ガンガン行って、とっとと片付けようぜ！"
"10058030-46-カリン" = "停止！！！"
"10058030-50-アカネ" = "1時方向から敵のミサイル！"
"10058030-51-アカネ" = "煙幕遮蔽、開始します！"
"10058030-57-ネル" = "何だあれ！？戦車レースでミサイル撃っていいのか！？"
"10058030-58-アカネ" = "ルール上、武器の制限はありませんから……。"
"10058030-59-カリン" = "私たちもビームを撃ったし……。"
"10058030-60-ネル" = "チッ、しかも誘導ミサイルかよ。#n煙幕遮蔽してなきゃヤバかったな。よくやった、アカネ。"
"10058030-61-アスナ" = "でも、これじゃ私たちのプリズム砲も当たらないよ？"
"10058030-62-ネル" = "そりゃそうだが、時間を稼げただけで十分だ。"
"10058030-63-ネル" = "移動するぞ！C&Cを攻撃するとは、どこのどいつだ？"
"10058030-64-ネル" = "見つけ次第、ぶっ飛ばしてやる！"
"10058030-65-カリン" = "とりあえず、煙幕に隠れながら移動しよう……。"
"10058030-66-アカネ" = "っ！部長、ロケットブースターの音です！"
"10058030-67-ネル" = "ハッタリだ！この煙の中で撃って、当たるもんかよ！"
"10058030-70-ネル" = "何だ！？あれ！？"
"10058030-71-アカネ" = "来ます！！"
"10058030-74-ネル" = "くっ……。"
"10058030-75-ネル" = "こいつは……ただモンじゃねぇな……。"
"10058030-78-モモイ" = "いぇ～い、一撃っ！C&Cも楽勝じゃん！"
"10058030-79-アリス" = "ネル先輩、すごく怒っていると思います……。"
"10058030-80-モモイ" = "勝負は無情だからね！怒られる筋合いはないよ！"
"10058030-81-ミドリ" = "ユズちゃん、今のミサイルの動きはなんだったの？"
"10058030-82-ユズ" = "これ、手動誘導するタイプのやつだったから……なんか手に馴染んでて。"
"10058030-83-ユズ" = "煙幕をなぞるように動かしたら引っ掛かるかな、って。格ゲーの要領でやってみた……。"
"10058030-84-モモイ" = "さすがUZQueen！ジョイスティックさえあれば無敵だね！"
"10058030-85-ケイ" = "モモイ。暴れるなら、あなたは歩いてください。#n3人乗りの戦車に5人も乗るのは無理があります。"
"10058030-86-モモイ" = "ひどい！それならケイが降りればいいでしょ！"
"10058030-87-ケイ" = "嫌です。モモイたちにアリスを任せると、何が起きるか分からないので。"
"10058030-88-アリス" = "ユズ、すごいです！"
"10058030-89-アリス" = "こういう時に言わなければいけないセリフがあります！"
"10058030-90-アリス" = "や、やっつけられましたか！？"
"10058030-94-一同" = "そのセリフはダメえええ！！！"
"10058030-97-ネル" = "て……てめぇらか……！"
"10058030-98-ネル" = "ゲーム開発部！！チビ！！おでこ！！双子！！"
"10058030-99-ネル" = "アカネ！！アクセル全開だ！！！"
"10058030-100-ネル" = "ぶちのめせ！！！！"
"10058030-104-モモイ" = "だからあのセリフはダメなんだって～！！"
"10058030-105-ケイ" = "敵戦車が急速接近しています！"
"10058030-106-ミドリ" = "ユズちゃん、どんどん撃っちゃって！！"
"10058030-107-ユズ" = "う、うん！！発射！！！"
"10058030-113-ネル" = "避けられねぇなら、ぶっ壊してやるまでだ！！！"
"10058030-114-ネル" = "かかってこい！！！"
"10058030-118-ケイ" = "ミサイルをサブマシンガンで迎撃！？"
"10058030-119-ケイ" = "どんな反射神経をしているんですか！！"
"10058030-120-ユズ" = "キャンセル技があるのを忘れてた……。"
"10058030-121-アリス" = "ユズ、今こそ格ゲーからシューティングにジャンル変更する時です！"
"10058030-122-ケイ" = "何でもいいから早くしてください！！！来ます！！！"
"10058030-124-ネル" = "てめぇら、ぶっ飛ばすぞ！！"
"10058030-125-カリン" = "レンズシステム、正常に稼働中。"
"10058030-126-アスナ" = "充電完了～！"
"10058030-127-ネル" = "撃てぇ！！"
"10058030-132-アリス" = "うぁっ！！"
"10058030-133-ケイ" = "吸気系破損！作動しません！"
"10058030-134-モモイ" = "エンジンもかからない！！もう終わりだー！！"
"10058030-135-ミドリ" = "ユズちゃん、大丈夫？"
"10058030-136-ユズ" = "だ、大丈夫だけど……潜望鏡が壊れちゃったから、見ながらがちょっと……！"
"10058030-137-モモイ" = "どうしよう！？"
"10058030-138-アリス" = "アリス、昨日は楽しくて眠れなかったのでセーブしていません……！"
"10058030-139-ミドリ" = "ユズちゃん、落ち着いて。私を見て。絶対できるから。"
"10058030-140-ユズ" = "でも、飛んでいくミサイルを見ながら狙わなきゃ……。"
"10058030-141-ミドリ" = "先週、お姉ちゃんと#n『トップ・オブ・ファイターズ』#nをやった時のことを思い出して。"
"10058030-142-ミドリ" = "お姉ちゃんに負けてあげるために、目のマッサージをしながらやったけど……#nそれでも全勝だったよね。"
"10058030-143-モモイ" = "あれはチートだったじゃん！！"
"10058030-144-ミドリ" = "今度は、私たちがユズちゃんの目になるよ。"
"10058030-145-ユズ" = "ミドリ……。"
"10058030-146-ユズ" = "……やってみる！"
"10058030-150-ケイ" = "ミサイルを頭上に撃ってどうするんですか！？"
"10058030-154-ネル" = "なんだぁ？とんちんかんなとこに撃ちやがって。"
"10058030-155-ネル" = "大事なミサイルをそんな……。"
"10058030-156-ネル" = "！！！！！"
"10058030-161-ネル" = "上から来るのかよっ！！！"
"10058030-167-アリス" = "やっつけられ――"
"10058030-170-モモイ" = "ダメ！！"
"10058030-171-ケイ" = "とりあえず、ダメです！"
"10058030-172-アリス" = "うっ！ううっ！"
"10058030-173-ミドリ" = "さすがだね。外の様子を聞いただけでドンピシャで当てるなんて。"
"10058030-174-ユズ" = "ううん、当たる直前に撃ち落された。もう一発撃てば……！"
"10058030-175-モモイ" = "え？ミサイル、もうないよ？"
"10058030-176-ミドリ" = "え？"
"10058030-177-ケイ" = "どういうことですか！？"
"10058030-178-モモイ" = "ユウカが5発あれば十分だって言って、予算をくれなかったじゃん。"
"10058030-179-アリス" = "アリス、見たことあります！#nフェイクのボスに騙されて、爆弾を使い果たすステージです！"
"10058030-180-ユズ" = "そういうことはもっと早く言ってほしかったな……。"
"10058030-181-モモイ" = "優勝するよりC&Cを倒したほうが、実績になるかと思って……。"
"10058030-184-ユズ" = "そうだね……。"
"10058030-185-ミドリ" = "たしかに、キルラインで我慢できないよね……。"
"10058030-186-ケイ" = "なぜ納得できるんですか！？"
"10058030-193-アリス" = "チビメイド様、すごく怒ってるみたいです……。"
"10058030-197-モモイ" = "この戦車の上まで来たの！？"
"10058030-198-ミドリ" = "終わった……。"
"10058030-204-ネル" = "度胸あんじゃねぇか、ゲーム開発部。"
"10058030-205-ネル" = "「おでこ」が撃ったんだろ？やるな、お前。"
"10058030-207-モモイ" = "ネル先輩！！これはあくまでスポーツだし！"
"10058030-211-ネル" = "そうだな。#nてめぇらがミサイルをしれっと5発も撃ち込んできたのもスポーツだ。"
"10058030-212-ネル" = "んじゃ、これもスポーツだよな！！！"
"10058030-221-一同" = "うああああっ！！！"
"10058030-223-アンナ" = "い、今？"
"10058030-224-エリナ" = "今今！ごーごー！"
"10058030-225-ラナ" = "今――"
"10058030-228-アンナ&エリナ" = "この隙に逃げろー！！！"
