"10058025-5-アンナ" = "きゃあああっ！！！"
"10058025-8-レーシングヘルメット団A" = "キルマークにしてやるよ！！"
"10058025-9-アンナ" = "撃たないでください！撃たないでください！！うわあああん！！！"
"10058025-10-エリナ" = "反則～！これ反則だって～！"
