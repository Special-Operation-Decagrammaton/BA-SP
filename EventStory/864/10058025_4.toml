"10058025-83-イロハ" = "はい。それが唯一のルールです。"
"10058025-86-イロハ" = "[ruby=・]最[/ruby][ruby=・]初[/ruby][ruby=・]に[/ruby]というのは……#n言い換えれば、前に他の戦車がいないということです。"
"10058025-87-アンナ" = "それって、前を走るライバルの戦車を破壊するってことですか！？"
"10058025-88-イロハ" = "そういうことです。ほら、モタモタしてるとやられますよ。"
"10058025-89-イロハ" = "虎丸、前進！"
