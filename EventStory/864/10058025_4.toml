"10058025-24-アンナ" = "……。"
"10058025-25-エリナ" = "……。"
"10058025-26-アンナ" = "う、うあっ……。"
"10058025-27-？？？" = "救護が必要な場に救護を！"
"10058025-29-ミネ" = "これより、移動式野戦病院にて、救護活動を開始します！"
"10058025-30-ミネ" = "私は悲しいです。#n理由もなく他人に暴力を行使するなんて……。"
"10058025-31-ミネ" = "救護が必要不可欠だと断定します。"
"10058025-32-ミネ" = "救護騎士団の信念と誇り、そして決意を皆さんにお伝えいたします！"
"10058025-33-セリナ" = "団長！次弾、装填しました！"
"10058025-34-ミネ" = "素晴らしいです、セリナ！ハナエ、次に救護が必要な方はどちらでしょう！"
"10058025-35-ハナエ" = "あっちにもこっちにもいます！"
"10058025-36-ミネ" = "もっと近くに寄せてください！私を、救護の場に！"
"10058025-44-アンナ" = "私たちを攻撃してた戦車が、あんなところまで飛んでいっちゃった！"
"10058025-45-エリナ" = "うわあ～ん！怖いよぉ～！"
"10058025-48-アンナ" = "あ、あの戦車！！"
"10058025-49-アンナ" = "この前見た絶対王者！？"
"10058025-54-イロハ" = "先日の風変わりな戦車……。"
"10058025-55-イロハ" = "あなた方、スタートもしないで何をしてるんですか？"
"10058025-57-アンナ" = "聞いてください！みんなが急に砲撃を始めたんです！"
"10058025-58-アンナ" = "クーデターでも起きたのでしょうか！？"
"10058025-59-イロハ" = "クーデターだなんて……ゲヘナでそんな複雑なことは起きませんよ。"
"10058025-60-アンナ" = "う、撃たないでくださいぃ……。#n私たちの戦車は装甲もしょぼいし、大したことないんです。うわあああん！"
"10058025-67-万魔殿の部員A" = "3時方向から敵の砲撃！跳弾したため被害はありません！"
"10058025-68-イロハ" = "はぁ……。ちょっと待っていてください。"
"10058025-73-チアキ" = "イロハ選手！敵の先制攻撃をものともせず、一発で制圧しました！"
"10058025-74-チアキ" = "砲塔リングにしっかり差し込みましたね！さすがランキング1位！"
"10058025-75-イブキ" = "痛そう～！"
"10058025-80-イロハ" = "あなた方が余計なことをしなければ、こちらからは何もしません。面倒なので。"
"10058025-81-イロハ" = "というか、本戦まで上がってきたのにルールも知らないんですか？"
