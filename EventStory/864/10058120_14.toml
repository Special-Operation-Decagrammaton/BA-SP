[translation]
"10058120-1" = "第12話;そこに行ったらお便りします"
"10058120-4-レッドウィンターの生徒A" = "来たよ！"
"10058120-5-レッドウィンターの生徒B" = "お疲れ様ー！初出場で優勝なんて、すごい！"
"10058120-6-レッドウィンターの生徒C" = "かっこいー！！ほんとにほんとによく頑張ったね！"
"10058120-7-トモエ" = "それでは、これよりゲヘナカップ優勝祝賀会を開催いたします。"
"10058120-8-トモエ" = "まず、チェリノ会長による表彰です。"
"10058120-9-チェリノ" = "ゲヘナカップに優勝した183号。前に。"
"10058120-13-チェリノ" = "183号特別クラス学級委員長、[ruby=にき]仁木[/ruby]アンナ。"
"10058120-16-チェリノ" = "183号特別クラス副学級委員長、[ruby=にき]二木[/ruby]エリナ。"
"10058120-19-チェリノ" = "そして183号特別クラス[ruby=・]副[/ruby][ruby=・]副[/ruby]学級委員長、[ruby=ふるはた]古畑[/ruby]ラナ。"
"10058120-20-チェリノ" = "書記長である私の悲願であった、ゲヘナカップ優勝杯を持ち帰ってくれたこと。#n大いに称えよう。"
"10058120-21-チェリノ" = "巨大なゲヘナの戦車に、正面から立ち向かった勇気。"
"10058120-22-チェリノ" = "そして最後まで諦めないレッドウィンター精神。"
"10058120-23-チェリノ" = "諸君の活躍は、みんなに大きな感動を与えた。"
"10058120-24-チェリノ" = "レッドウィンター事務局の権限で、#n183号特別クラスには「努力髭勲章」を授与する！"
"10058120-28-アンナ" = "あ、ありがとうございます……！"
"10058120-29-エリナ" = "やったぁ……！夢じゃないよね……！？"
"10058120-30-チェリノ" = "事務局、そしておいらは……レッドウィンターのみんなが、#n功績に見合ったものを与えられるべきだと考えている。"
"10058120-31-チェリノ" = "ということで、発案者は誰だ？"
"10058120-32-アンナ" = "え、それは……。"
"10058120-33-アンナ" = "副学級委員長です！#nエリナが励ましてくれなければ、参加すらできませんでした！"
"10058120-34-エリナ" = "ええっ！？なんでいきなり謙遜してんの！？"
"10058120-35-エリナ" = "わ、私は提案しただけです！学級委員長のアンナが一番頑張ってくれました！"
"10058120-36-エリナ" = "それにラナも、先生も……みんなで力を合わせました！"
"10058120-37-ラナ" = "ブイ。"
"10058120-40-チェリノ" = "そうか、学級委員長の仁木アンナが主導し、お前たちはそれに従ったのだな。"
"10058120-41-チェリノ" = "つまり――"
"10058120-42-チェリノ" = "仁木アンナの指示で事務局を襲撃し、おいらの銅像を削った……。"
"10058120-43-チェリノ" = "さらに窓ガラスを盗んだ上、広場を砲撃したというのだな？"
"10058120-44-アンナ" = "え、えへへ……大したことありません、会長。"
"10058120-47-アンナ" = "え！？"
"10058120-48-チェリノ" = "事務局が知らないとでも思ったか！？この反乱分子め！！"
"10058120-49-アンナ" = "そ、それは！！つまり！！"
"10058120-52-チェリノ" = "賞は賞で、罰は罰！"
"10058120-53-チェリノ" = "183号全員、特別クラスに無期限在留だ！！！！"
"10058120-55-アンナ&エリナ" = "うあああぁぁぁん！！！"
"10058120-57-ラナ" = "……こうして、私たちは183号特別クラスに戻りました。"
"10058120-59-ラナ" = "みんな、元気に過ごしています。#n先生がいらっしゃる前に比べたら、確実に変わっている気がします。"
"10058120-60-ラナ" = "アンナはさらに見栄っ張りになり、エリナはからかい方が上手くなっています。"
"10058120-61-ラナ" = "「戦車レースはインパクトが足りなかった！#nもっとデカイの一発食らわせよう！」と二人は言っていますが……。"
"10058120-64-ラナ" = "研究テーマを決める段階からRWWEをしていて、#n選ぶのにちょっと時間がかかっています。"
"10058120-65-ラナ" = "みんなが先生に会いたがっているので……#n研究テーマが決まる頃、また遊びに来ていただけると嬉しいです。"
"10058120-66-ラナ" = "追伸。約束どおり、銅像と窓ガラスは元に戻しました。"
"10058120-69-ラナ" = "2人の親友と共に。古畑ラナより。"
"10058120-71" = "[ns] \"……そうなんだ。\""
"10058120-74" = "[ns1] \"ところで、これを直接持ってきたってことは……。\"\n[ns2] \"もう研究テーマが決まったの？\""
"10058120-77-ラナ" = "そうではありません。手紙を出そうと思ったら、切手が不足していたのです。"
"10058120-78-ラナ" = "ここに来るのは2回目ですが、やはり大変ですね。"
"10058120-84-ラナ" = "すぅ……すぅ……。"
"10058120-99" = "Start Your Engines!～183号よ永遠に！～"
