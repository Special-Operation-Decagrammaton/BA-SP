[translation]
"10058110-1" = "第11話;Off your Tank!"
"10058110-3-チアキ" = "それでは！表彰式に移ります！"
"10058110-4-サツキ" = "進行の都合上、私[ruby=きょうごく]、京極サ[/ruby]ツキが発表するわね。"
"10058110-8-サツキ" = "優勝。レッドウィンター連邦学園183号特別クラス！"
"10058110-22-アンナ" = "本当に、優勝したのね……。"
"10058110-23-エリナ" = "う、うぅ……ゆむ……夢じゃないよね？"
"10058110-26-アンナ" = "どうして撃つのよ！！！普通は自分の頬をつねるでしょ！！"
"10058110-27-エリナ" = "それだと痛いでしょ！！うああぁぁん！"
"10058110-28-ヒフミ" = "おめでとうございます！"
"10058110-29-アズサ" = "おめでとう、レッドウィンターの戦士たち。"
"10058110-30-コハル" = "助けてあげて良かった！優勝なんて、すごいじゃない！"
"10058110-33-アンナ" = "補習授業部のみなさん……。"
"10058110-34-エリナ" = "おかげで優勝できました、うああぁぁん！"
"10058110-40-アズサ" = "……？"
"10058110-41-ハナコ" = "あら、ふふっ。"
"10058110-42-チアキ" = "こんな嬉しい瞬間に、みなさんどうして泣いているんですか！#nふふふっ！シャッターチャンスには違いありませんが！"
"10058110-43-アンナ" = "しゃ、写真！？"
"10058110-44-エリナ" = "ちょっと待ってぇ！？"
"10058110-45-アンナ" = "ラナはどこに行ったの？ラナー！"
"10058110-46-エリナ" = "また迷子ぉ！？"
"10058110-47-アズサ" = "さっき、あっちに一人で歩いていくのを見た。"
"10058110-48-アズサ" = "迷子じゃないと思う。行くべき所に行くという目をしていた。"
"10058110-49-アンナ" = "え？"
"10058110-51-チアキ" = "はい、チーズ！"
"10058110-52-エリナ" = "ち、チーズ！？！？"
"10058110-57-ラナ" = "あの、ふわふわさん。"
"10058110-58-イロハ" = "おや。さっきの操縦手の方ですね。"
"10058110-59-イロハ" = "優勝、おめでとうございます。"
"10058110-60-ラナ" = "失礼でなければ、聞きたいことがあります。"
"10058110-61-ラナ" = "どうして、悲しみや悔しさを感じていないのですか？"
"10058110-62-イロハ" = "はい？"
"10058110-63-ラナ" = "うまく言葉にできなくてごめんなさい。#n決してからかっているわけではないんです。"
"10058110-64-ラナ" = "ふわふわさんは負けたのに、何故か気分が良さそうに見えました。"
"10058110-65-ラナ" = "本当にそうなら、どうしてなのか教えてください。"
"10058110-66-イロハ" = "私からも聞かせてください。何故、それを聞くんですか？"
"10058110-67-ラナ" = "友達が心配だから、です。"
"10058110-68-ラナ" = "友達は……ここに来る前も、来てからも悩んでいました。"
"10058110-69-ラナ" = "失敗や危険を恐れ、諦めようとしました。"
"10058110-70-イロハ" = "……はい。"
"10058110-71-ラナ" = "みんなに恥をかかせたくない、危険な目に遭わせたくない――"
"10058110-72-ラナ" = "そのような理由からでしょう。"
"10058110-73-ラナ" = "友達は、自分たちのことを弱虫だと言いますが……#n私の考えは違います。諦めることも、一つの勇気だと思うからです。"
"10058110-74-イロハ" = "……。"
"10058110-75-ラナ" = "しかし、もし友達がまた挫折を味わうことになったとしても――"
"10058110-76-ラナ" = "今まで友達がいなかった私には、#n友達として自分に何ができるのか分かりません……。"
"10058110-77-ラナ" = "だから……#nいつか友達に慰めが必要な時、かけてあげられる言葉が知りたいのです。"
"10058110-78-ラナ" = "「私の知り合いが、こう言ってた」と。"
"10058110-79-イロハ" = "ほう。"
"10058110-80-イロハ" = "そういうことでしたら、分かりました。"
"10058110-81-イロハ" = "たしかに、気分は良かったですよ。"
"10058110-82-イロハ" = "何故なら、みなさんが全力で戦ってくれたからです。"
"10058110-85-イロハ" = "それで負けたからといって、悔しがる必要はありません。"
"10058110-86-イロハ" = "私は……お互い全力で戦ったなら、それで良いと思っています。"
"10058110-87-イロハ" = "サボったりダラダラするのも好きですけど、#nたまにはこういうのも悪くはありません。"
"10058110-88-イロハ" = "「好きなことを全力で頑張る」人の目、嫌いじゃないですから。#nまあ、毎回は疲れますけど。"
"10058110-89-イロハ" = "それに……#n少しでも諦めたくないなら、とりあえずやってみるのは大事だと思います。"
"10058110-90-イロハ" = "「あの時、やっておけば……」と後悔するのが一番面倒ですから。#n面倒なことは嫌いなんです。"
"10058110-91-ラナ" = "なるほど。勉強になりました。"
"10058110-92-ラナ" = "もう一つ質問させてください。#n私たちと戦ったことは、ふわふわさんにとっても「大事な過程」になりましたか？"
"10058110-93-イロハ" = "それは……。"
"10058110-97-万魔殿の部員A" = "あ、あの！！"
"10058110-98-万魔殿の部員A" = "す、すみません！！イロハ戦車長！！すごく緊張してしまい……！"
"10058110-99-万魔殿の部員B" = "どうでもいいことを質問して申し訳ございません！！"
"10058110-100-イロハ" = "戦車長、ですか。"
"10058110-101-イロハ" = "レースは終わりました。「戦車長」と呼ぶ必要はありません。"
"10058110-102-イロハ" = "負けることもあります。安心してください。こんなことで怒りはしませんから。"
"10058110-103-イロハ" = "戦車に乗っている間は少し神経質になってしまうんです。#nお詫びをしたいので、打ち上げを兼ねて食事でも行きましょう。"
"10058110-106-万魔殿の部員A" = "イロハ先輩……！"
"10058110-107-イロハ" = "異論もないようなので、そうしましょうか。"
"10058110-108-万魔殿の部員B" = "カラオケも一緒に行きませんか！？"
"10058110-109-イロハ" = "聞いているだけでも良いなら。では……。"
"10058110-110-マコト" = "[ruby=なつめ]棗イ[/ruby]ロハ！！！！"
"10058110-111-マコト" = "どうなってるんだ！！！ゲヘナが優勝を逃すとは！！！"
"10058110-112-マコト" = "[ruby=パンデモニウム・ソサエティー]万魔殿の権威が[/ruby]！！！マコト様の権威があぁ！！！"
"10058110-113-イロハ" = "はぁ。また逃げなくてはいけませんね。"
"10058110-114-イロハ" = "虎丸、総員乗車！"
"10058110-115-イロハ" = "目的地、ハンバーガーショップ！"
"10058110-116-万魔殿の部員たち" = "はいっ！！！"
"10058110-120-イロハ" = "あ……まだ答えていませんでしたね。"
"10058110-124-イロハ" = "私にとっても「大事な過程」なんだと思います。良い経験をしましたから。"
"10058110-127-イロハ" = "虎丸、出発！"
"10058110-132-マコト" = "棗イロハーーー！！！"
"10058110-135-ラナ" = "お別れです。ゲヘナで出会った「大事な過程」さん。"
"10058110-136-アンナ" = "ラナ！早くおいで！！"
"10058110-137-エリナ" = "先生が写真を撮ってくれるって！！みんな集まってるよぉ～！"
"10058110-147-アンナ" = "記念写真……！研究室の壁に掛けなきゃ……！"
"10058110-148-エリナ" = "ついに、優勝か……！とうとう……！うああぁぁ！"
"10058110-149-アンナ" = "ちょっと、エリナ！！押さないで！"
"10058110-150-エリナ" = "はぁ～？押してないですけどぉ～！？狭いから、あっち行って！！"
"10058110-151-アンナ" = "私のほうが先だったんだから、エリナがあっち行きなさいよ！#nこっちはラナと私だけでいいの！"
"10058110-152-エリナ" = "よく見たら、アンナ灰だらけじゃん！服着替えてきたら！？"
"10058110-153-アンナ" = "それはエリナもでしょ！！"
"10058110-154-ラナ" = "トロフィー持って、ピース。"
"10058110-155" = "[ns] \"じゃあ、撮るよ！\""
"10058110-157" = "[ns] \"はい、チーズ！\""
