[translation]
"10058150-1" = "後日談その3;駆け抜けた所に楽園はある"
"10058150-3" = "ゲヘナカップ・ゴール"
"10058150-4" = "（レース終了後の夜）"
"10058150-10-万魔殿の部員A" = "そこ、抜けなければハンマーで壊してもいいよ。"
"10058150-11-万魔殿の部員A" = "どうせ、また新しく作るんだから。"
"10058150-12-万魔殿の部員B" = "でも、なんかもったいないですね。みんなで一生懸命作ったのに。"
"10058150-13-万魔殿の部員A" = "たしかにそうだけど、また頑張ればいいでしょ。"
"10058150-14-万魔殿の部員A" = "早く終わらせて、打ち上げにでも行こう！"
"10058150-15-万魔殿の部員B" = "いいですね！それなら、どんどん壊します！よいしょ！"
"10058150-16-万魔殿の部員B" = "ここを叩けば……。"
"10058150-19-万魔殿の部員A" = "誰か手伝いに来てくれたのかな？"
"10058150-20-万魔殿の部員B" = "戦車で撤去しようとしてくれてるみたいです。"
"10058150-21-万魔殿の部員A" = "いや、あれは戦車じゃなくて……。"
"10058150-23-謎の戦車のエンジン" = "ひいぃ……ふうっ……はあっ……。"
"10058150-24-謎の戦車のギア" = "うにゃあ……げへっ……くはぁ……。"
"10058150-25-謎の戦車の砲塔" = "あっ！ゴールが見えました！もう少しですよ！"
"10058150-27-ミチル" = "へぇっ……へっ……な、なに！？みんなどこに行ったの？"
"10058150-28-ツクヨ" = "ひいぃ……。"
"10058150-29-イズナ" = "まだ誰もゴールしてないみたいです！私たちが優勝ですね！"
"10058150-30-ミチル" = "さすがにそれはないでしょ！"
"10058150-33-万魔殿の部員A" = "せん……。"
"10058150-34-万魔殿の部員B" = "……しゃ？"
"10058150-37-イズナ" = "ああっ……ゴールが……。"
"10058150-38-ミチル" = "撤去してる……？まさか……もう終わったの……？"
"10058150-39-ツクヨ" = "か、完走したのに……。"
"10058150-40-イズナ" = "きゅう……。"
"10058150-44-万魔殿の部員A" = "ま、まだゴールしていませんよ！"
"10058150-45-万魔殿の部員A" = "ラインまで、あと少しです！！"
"10058150-46-万魔殿の部員B" = "が、頑張れ！！頑張れ！！"
"10058150-50-忍者タンク" = "ぶぅぅぅんっ！"
"10058150-53-忍者タンク" = "ゴールイン～！"
