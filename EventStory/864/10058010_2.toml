[translation]
"10058010-1" = "第1話;お土産は優勝カップで"
"10058010-3-アンナ" = "聞いて！大事件よ！"
"10058010-4-アンナ" = "枕に綿が入っているわ！"
"10058010-5-エリナ" = "わっ、ホントだ！しかも、ポリエステルじゃなくてコットンじゃん！"
"10058010-6-アンナ" = "宿泊費が無料……ってことは、このふかふかの枕も使い放題ってことなのかしら？"
"10058010-7-エリナ" = "そりゃそうでしょ！記念に持って帰っていいか、後で聞こ～"
"10058010-8-ラナ" = "蛇口も、ひねったらすぐに水が出てきた。"
"10058010-9-エリナ" = "夜通し出しっぱなしにしなくても、ちゃんと出てくるの？すご～い！"
"10058010-10-アンナ" = "ゲヘナって、ブルジョワ学園なのね……。"
"10058010-11-アンナ" = "はっ！そうだ、写真撮っておかなくちゃ！#n帰ってみんなに言っても信じてもらえないでしょうし！"
"10058010-20-ラナ" = "アンナ隊長、窓の外に報告対象を発見しました。"
"10058010-21-アンナ" = "何かしら？ラナ隊員。報告をお願いするわ。"
"10058010-22-ラナ" = "12時の方向……リゾートの中庭に、準備中のビュッフェを確認。"
"10058010-23-エリナ" = "ビュッフェ！？食べ放題の！？"
"10058010-24-アンナ" = "総員、突撃！！！"
"10058010-25-エリナ" = "全速力で走るよ～！ちょっとでもカロリー消費しなきゃ！！"
"10058010-30-ハルナ" = "ふふっ、さすがですわね。#nビュッフェでここまで鮮度を保つとは。"
"10058010-31-ハルナ" = "お疲れ様でした、フウカさん。"
"10058010-32-フウカ" = "新しい給食部のトラックのおかげね。#nパワーがあるからトレーラーも牽引できたし。"
"10058010-33-フウカ" = "……言っておくけど、トラックには触らないでね。怒るわよ。"
"10058010-34-ハルナ" = "あら、デザートもあるのですね？"
"10058010-35-フウカ" = "話をそらさないで！！"
"10058010-39-アンナ" = "みんな、本戦出場者なのよね。すごく強そう……。"
"10058010-40-エリナ" = "な～に弱気になってんのさ！#n私たちも出場者なんだから、どーんと胸張ってこ！"
"10058010-41-アンナ" = "あれ、そういえばラナは？#nこんな人が多いところではぐれたら、迷子になってしまうわ……。"
"10058010-42-？？？" = "すごい。たしかに、そうすれば簡単だね。"
"10058010-43-？？？" = "さらに部品を減らすことも可能ですが……#n引火の恐れがあります。"
"10058010-44-アンナ" = "……ラナの声よ！"
"10058010-51-ラナ" = "どこに行ってたの？こんなに人が多いんだから、迷子になってしまう。"
"10058010-52-エリナ" = "それはこっちの台詞！！"
"10058010-53-ラナ" = "紹介するね。こちら、ミレニアムサイエンススクールのエンジニア部の方々。"
"10058010-54-ウタハ" = "部長の[ruby=しらいし]白石[/ruby]ウタハだ。"
"10058010-55-コトリ" = "[ruby=とよみ]豊見[/ruby]コトリです！#n説明や解説ならお任せください！"
"10058010-56-ヒビキ" = "[ruby=ねこづか]猫塚[/ruby]ヒビキだよ。好きなものは、自爆機能。"
"10058010-57-アンナ" = "レッドウィンター連邦学園の[ruby=にき]仁木[/ruby]アンナです。#nこちらは[ruby=にき]二木[/ruby]エリナと[ruby=ふるはた]古畑[/ruby]ラナ。"
"10058010-58-エリナ" = "ところで……自爆機能が好きって……？"
"10058010-59-ヒビキ" = "あっ、つい……。"
"10058010-62-アンナ" = "爆発ボルトで部品を切り離すほうですか？#nそれとも、全体を完全に破壊するほう？"
"10058010-63-エリナ" = "もしかして……エンジンルームにガスが充満して、そこに火花が引火するほう？"
"10058010-64-ラナ" = "あるいは、全てのデータを消去するほうですか？"
"10058010-68-エンジニア部" = "どこから話そうか（しましょうか）！"
"10058010-71-ラナ" = "……ここをこうして、終わりです。"
"10058010-72-ラナ" = "発電所をハッキングして自爆させるのは、メドヴィクを食べるより簡単です。"
"10058010-73-アンナ" = "ふふん。さすが、私のラナね！"
"10058010-74-エリナ" = "はぁ～！？だ～れのラナだって～！？"
"10058010-75-ヒビキ" = "自爆をこんな芸術的な境地にまで引き上げるなんて、感動したよ。"
"10058010-76-コトリ" = "パンチカードでOSを上書きするのに3ヶ月かかることを除けば、#n技術的には完璧ですね！"
"10058010-77-ラナ" = "問題ありません。カードリーダーを並列化すれば1ヶ月で十分です。"
"10058010-78-ウタハ" = "それに……エンジニア部の新素材ポリマーを紙の代わりに使えば、#n重量を半分にできるはずだよ。"
"10058010-85-アンナ" = "初対面の方と30分以上話しても……。"
"10058010-86-ウタハ" = "誰も驚いたり、特別扱いしないなんてね……。"
"10058010-87-コトリ" = "しかも、最後まで説明を聞いてくれるなんて……。#nれ、連絡先を交換しませんか？研究協力ということで！"
"10058010-88-ラナ" = "VHFの周波数も連絡先に該当しますか？#nモモトークは天気が悪いと受信できないので。"
"10058010-89-ヒビキ" = "よかったらまたこういう話、したい。"
"10058010-90-？？？" = "よお、ちょっといいか？"
"10058010-92-ネル" = "お前らが作った戦車だけどよ、#nでかくて赤いのは自爆ボタンだから押すなって言ってたよな？"
"10058010-93-ネル" = "30個くらいあるんだが、どれが押しちゃダメなやつなんだ！？"
"10058010-94-ヒビキ" = "直径6.2センチ、R155、G17、B30の赤色のボタンだよ。"
"10058010-95-ネル" = "アール155……って何の話だよ！？普通に場所を教えろよ！"
"10058010-96-ウタハ" = "スタートボタンの横。ちょっと大きいほうだね。"
"10058010-97-ネル" = "んな変なとこにつけんな！間違って押したらどうすんだよ！？"
"10058010-100-ネル" = "……ん？こいつらは？"
"10058010-101-ウタハ" = "レッドウィンターの方々さ。"
"10058010-102-ウタハ" = "自分たちで戦車を作って参加したらしい。"
"10058010-103-ネル" = "戦車を作った……？へぇ、面白ぇじゃん。"
"10058010-104-ネル" = "[ruby=みかも]美甘[/ruby]ネル、メイド部の部長だ。#n……あたしも今回のレースに出るぜ。"
"10058010-105-アンナ" = "しゅ、出場されるんですね！よろしくお願いします！"
"10058010-106-ネル" = "うちの部員が出る出るってうるさくてよ……。ま、よろしくな。"
"10058010-107-エリナ" = "んじゃ！ライバルですね！#n優勝するのは私たちですから！"
"10058010-108-アンナ" = "え、エリナ！？突然失礼でしょ！！"
"10058010-109-ネル" = "ははっ！いい目してるじゃねぇか！#nそうだよな、出るからには優勝を狙わねぇとな！"
"10058010-110-エリナ" = "へっへ～ん♪そうですよね！"
"10058010-111-アンナ" = "び、ビックリした……。喧嘩になるかと思った……。"
"10058010-112-ネル" = "あと、自爆ボタンはいらないから外せ。#nやらねぇならこっちで勝手に引き抜いとくけどよ。"
"10058010-113-コトリ" = "あのボタンは、引っ張っても自爆するので気をつけてください！"
"10058010-114-ネル" = "なんでそこまでして自爆させてぇんだよ！？"
"10058010-115-ネル" = "それから……えーっと、レッドウィンターつったっけ？明日は本気でやり合おうぜ。"
"10058010-116-ネル" = "覚悟しとけよ！"
"10058010-120-ウタハ" = "私も会えて良かったよ。明日のレース、頑張って。"
"10058010-126-アンナ" = "そっか……これって、競争なのよね……。"
"10058010-127-アンナ" = "レースなんだから……仕方がない、けど……。"
"10058010-130-アンナ" = "……誰かが1位になるってことは、#n他の誰かは1位になれないってことなのよね。"
"10058010-131-エリナ" = "うん。次は、本戦で勝たなきゃね。"
"10058010-132-アンナ" = "ここまで来て負けたら、悔しすぎるし……。"
"10058010-133-エリナ" = "特別クラスは砲撃で吹き飛んじゃったから、戻ったら絶対凍えちゃうよ～！"
"10058010-134-アンナ&エリナ" = "ひぃ～ん……。"
"10058010-135-ラナ" = "ふむ……。"
"10058010-136-ラナ" = "アンナ、エリナ。急にナーバスになって、どうしたの。"
"10058010-137-アンナ" = "なんか、急に緊張してきて……。"
"10058010-138-エリナ" = "みんな余裕ある感じじゃん？うちってば砲塔もないんだよ？"
"10058010-139-エリナ" = "だから、回転砲塔にしようって言ったのにぃ……。"
"10058010-140-ラナ" = "意見交換1回目……。"
"10058010-141-アンナ" = "そうよ……私のせい……的を狙う時は車体ごと回転させないといけないし……。"
"10058010-142-ラナ" = "？"
"10058010-143-エリナ" = "あ、あの時私も同意しちゃったし……。#n今更どーこー言ってもしゃーないよね、ごめん……。"
"10058010-144-アンナ&エリナ" = "ひぃ～ん……。"
"10058010-149-ラナ" = "（いつも[ruby=Red Winter Wrestling Engineers]ならこの辺でRWWEが始まるのに[/ruby]）"
"10058010-150-ラナ" = "（二人とも喧嘩する力すらないみたい）"
"10058010-151-ラナ" = "（平和過ぎて……ちょっと気持ち悪い）"
"10058010-156-アンナ" = "はあ……こんな時はサウナに入れば頭がスッキリするのに……。"
"10058010-157-エリナ" = "こんなとこでレッドウィンター式のサウナなんて無理でしょ～"
"10058010-158-アンナ&エリナ" = "はぁ……。"
"10058010-159-ラナ" = "（サウナ……！）"
"10058010-160-ラナ" = "（そうだ。熱いお湯をつけた木の枝で体をたたけばスッキリするはず）"
"10058010-161-ラナ" = "（みんなの元気を取り戻さないと）"
"10058010-165-アンナ" = "183号に戻れって言われたら、戦車にテントを張って過ごす……？"
"10058010-166-エリナ" = "想像しただけで、さぶくなってきた～"
"10058010-167-アンナ&エリナ" = "うあああん……。"
"10058010-172-ラナ" = "これは葉っぱがないからダメ。"
"10058010-176-ラナ" = "これは……微妙。"
"10058010-180-ラナ" = "……これだ！"
"10058010-183-ラナ" = "茂みの向こうから音がする……。"
"10058010-188-ヒフミ" = "コハルちゃん、白いペンキの缶を持ってきてくれますか？"
"10058010-189-コハル" = "うん、任せて！"
"10058010-190-ハナコ" = "この藍色のペンキで、身体に水着のペイントしたら涼しそうですね。"
"10058010-191-コハル" = "ペンキの臭いで頭おかしくなったの！？"
"10058010-192-アズサ" = "こっちの緑色なら、迷彩になる。"
"10058010-193-ヒフミ" = "あはは……油性だから後で落とすの大変ですよ。"
"10058010-194-ヒフミ" = "それでは……。"
"10058010-199-ラナ" = "……。"
"10058010-200-ヒフミ" = "あれ？"
"10058010-201-ラナ" = "おや、道に迷ってしまったのでしょうか。"
"10058010-202-コハル" = "こっちの台詞なんだけど……。"
"10058010-203-ハナコ" = "あらあら、迷子ちゃんですか？"
"10058010-204-ラナ" = "そう呼ばれることも多いですが、本名はラナと言います。"
"10058010-205-アズサ" = "[ruby=しらす]白洲[/ruby]アズサ。"
"10058010-206-ラナ" = "そうですか。名字は何ですか？"
"10058010-207-コハル" = "いつまでやるのよ！"
"10058010-209-ラナ" = "……それで、サウナで体を叩く時に使う枝を探していたのです。"
"10058010-210-ラナ" = "ちょうどいいものを見つけました。"
"10058010-211-コハル" = "みんなで裸になってそんなことするなんて……！エッチなのはダメ！死刑！！"
"10058010-212-ラナ" = "死刑にはなりません。レッドウィンターにおいてサウナは今は合法なので。"
"10058010-213-ハナコ" = "木の枝でお互いを叩くなんて、レッドウィンターの風習は興味深いですね。"
"10058010-214-ラナ" = "みんなの緊張をほぐして、不安を和らげたいのです。"
"10058010-215-ハナコ" = "なんて立派なんでしょう！#nコハルちゃんも緊張したら、同じようにしてあげますからね♡#n叩き合いっこしましょう♡"
"10058010-216-コハル" = "絶対に嫌っ！"
"10058010-217-アンナ" = "ラナー！どこにいるのー？"
"10058010-218-エリナ" = "ラーナー！"
"10058010-220-ラナ" = "友達の声がします。"
"10058010-221-ラナ" = "道に迷ったみたいです。"
"10058010-222-ヒフミ" = "あはは……多分ラナさんを探しにきたんじゃないですか？"
"10058010-228-アンナ" = "ラナ！ずっと捜してたのよ！"
"10058010-229-エリナ" = "誰かに連れ去られたのかと思ったじゃん！"
"10058010-230-ラナ" = "二人とも元気が無さそうだったから、サウナの準備してた。"
"10058010-234-ラナ" = "枝はこれでいい？"
"10058010-235-エリナ" = "そんなんでやられたら……#n緊張がほぐれるどころか、しばらく歩けなくなりそうなんだけど……。"
"10058010-236-アンナ" = "サウナというよりお仕置きね……。"
"10058010-237-エリナ" = "それで、この人たちは？"
"10058010-240-ラナ" = "明日レースに出場する、トリニティ総合学園の補習授業部の方々。"
"10058010-241-ラナ" = "今は戦車を整備しているところ。"
"10058010-242-ハナコ" = "ご紹介に預かりました、トリニティの補習授業部です。"
"10058010-243-ヒフミ" = "こんばんは。[ruby=あじたに]阿慈谷[/ruby]ヒフミです。"
"10058010-244-ヒフミ" = "ラナさんがおっしゃってたアンナさんとエリナさんですね？"
"10058010-245-アンナ" = "はい！183号の仁木アンナです。こちらはエリナです。"
"10058010-246-アンナ" = "えっと……ラナは何を話してました？"
"10058010-247-ラナ" = "これまでのことを話してた。ちょっと前まで、やる気をなくしてたこととか。"
"10058010-248-ラナ" = "安心して。雪原で鼻水出しながら泣いてた話はしてないよ。"
"10058010-249-アンナ" = "今、話しちゃったじゃない！！"
"10058010-250-エリナ" = "まあ、事実だからしゃーない。"
"10058010-251-ヒフミ" = "厳しい環境の中、自分たちで戦車を作るなんてすごいです！"
"10058010-252-アズサ" = "即席のブービートラップはよく作ったけど、#n戦車なんて誰にでも作れるものじゃない。"
"10058010-253-ハナコ" = "みんなで汗みずくになりながら柔肌を寄せ合って夢中になるなんて……いいですね♡"
"10058010-254-コハル" = "わざと言ってるでしょ！？"
"10058010-255-アズサ" = "いや、ハナコの言う通り。汗を流して頑張るのは、良いことだ。"
"10058010-256-ラナ" = "今回、もし優勝できなかったら……#nこの先もずっと特別クラスに残らないといけません。"
"10058010-257-アンナ" = "そうなんです。ここに来て急に実感が湧いちゃって……。"
"10058010-258-アンナ" = "もう乗り越えたつもりだったのに……#nまた失敗するんじゃないかって、どうしても怖くなってしまうんです……。"
"10058010-259-エリナ" = "他の選手を見てたら余計に……自信もなくなってきちゃって……。"
"10058010-260-アンナ&エリナ" = "ひぃん……。"
"10058010-261-ラナ" = "それでこの有様なのです。"
"10058010-262-コハル" = "げ、元気出して！よく分かんないけど、大丈夫よ！"
"10058010-265-ヒフミ" = "うーん……。"
"10058010-266-ヒフミ" = "部外者の私が口を挟むようなことではないかもしれませんが、#nあくまで私個人の意見として聞いていただけますか？"
"10058010-267-ヒフミ" = "同じ経験をしたわけではないですが……#n私は、試練も失敗も、悪いことばかりではないと思っています。"
"10058010-268-エリナ" = "うぅ……それって、失敗しても良いってことですか？"
"10058010-269-ヒフミ" = "望んでた結果じゃないかもしれないし、#n苦い記憶は残ってしまうかもしれませんが……。"
"10058010-270-ヒフミ" = "友達と一緒に頑張ってきた「過程」は無くなりません。"
"10058010-271-アンナ" = "過程……。"
"10058010-272-ヒフミ" = "その大事な過程こそが、良い結果なのだと……私は思っています。"
"10058010-273-ヒフミ" = "だって、友達との思い出作りは唯一無二ですからね！"
"10058010-274-ヒフミ" = "たとえ未来がどうなったとしても、#nそのかけがえのない思い出が消えることはありません。"
"10058010-275-ヒフミ" = "だから、その……「今を楽しむことに集中しましょう！」ということで……。"
"10058010-276-ヒフミ" = "あはは……私はそう思っている、というだけですが。#nあまり深く考えないでくださいね！"
"10058010-279-ハナコ" = "ふふっ。いかがですか？みなさんのお役に立てましたか？"
"10058010-280-ラナ" = "ふむ。"
"10058010-281-ラナ" = "42億9496万7296点！"
"10058010-282-コハル" = "どういうこと！？数字多くない！？"
"10058010-283-エリナ" = "なるほど、ラナより1点高いってわけね。あはは……。"
"10058010-284-エリナ" = "これはラナ流のお礼の言葉だよ。"
"10058010-285-アンナ" = "たしかに、最初は戦車の完成だけで良かったのに……#n予選参加、本戦優勝へと……いつの間にか目標が高くなっていました。"
"10058010-286-アンナ" = "目の前の階段を上るうちに、#n無意識にハードルを引き上げ続けていたのだと思います。"
"10058010-287-アンナ" = "大きな目標に囚われすぎていた自分に、ようやく気がつくことができました。ありがとうございます。"
"10058010-288-エリナ" = "まあ、特別クラスにいるのも悪くはないかなー。アンナと一緒は嫌だけど。"
"10058010-289-アンナ" = "それはこっちのセリフよ！"
"10058010-290-ラナ" = "ふむ。喧嘩を始めたということは、元気になったということですね。"
"10058010-291-ラナ" = "最高のアドバイスのお返しになるものはありませんが、#nもしよろしければこの枝を受け取っていただけませんか？"
"10058010-292-ラナ" = "これで緊張をほぐす必要はなくなりましたが、#nとても可能性を感じる枝なので……。"
"10058010-293-ラナ" = "グリップ感、打撃感共に良く……耐久性も問題なさそうです。"
"10058010-294-エリナ" = "それは枝じゃなくて棒！"
"10058010-295-アズサ" = "だけど……たしかに銃の使用が難しい状況では役に立ちそうだ。"
"10058010-296-アズサ" = "よければ私がもらっておこう。"
