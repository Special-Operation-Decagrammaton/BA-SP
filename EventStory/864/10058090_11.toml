[translation]
"10058090-1" = "第9話;全力を尽くす"
"10058090-2-チアキ" = "もしもーし？183号の方たちですよね？"
"10058090-6-エリナ" = "……。"
"10058090-9-アンナ" = "突然変な顔して、どうしたの？まあ、元々変だけど。"
"10058090-10-エリナ" = "し～っ！し～っ！繋がらないフリしてんだから、空気読んでよ！"
"10058090-11-エリナ" = "運営から良い連絡が来るはずないでしょ！"
"10058090-12-アンナ" = "た、たしかに……！"
"10058090-13-チアキ" = "いえいえいえ！反則とか失格とかではありませんので、ご心配なく！"
"10058090-14-チアキ" = "えー、残りチームが少なくなってきましたので……#n大会ルールに従い、各チームの位置情報をお知らせします。"
"10058090-15-チアキ" = "183号特別クラスの子犬[ruby=パンデモニウム・ソサエティー]号と万魔殿の虎[/ruby]丸号の#n熱い勝負を楽しみにしています！"
"10058090-16-チアキ" = "では、私は再び中継席に戻ります！"
"10058090-17-エリナ" = "え？あ、はい……。"
"10058090-20-エリナ" = "残りチーム少ないの！？マジ！？"
"10058090-21-エリナ" = "しかもあの虎丸が相手って、やばっ！"
"10058090-22-アンナ" = "本当だ。大体だけど、地図にお互いの位置が記されてる……。"
"10058090-23-アンナ" = "うーん……。"
"10058090-24-アンナ" = "エリナ、これって……。"
"10058090-25-エリナ" = "んー……その……なんていうか……。"
"10058090-26-ラナ" = "チェックをかけられてる。"
"10058090-27-エリナ" = "そう！やっぱりラナが一番賢いね～！"
"10058090-28-アンナ" = "あっちは、私たちが今壊した的が最後のものみたいね。"
"10058090-29-アンナ" = "そうなると、当ててからゴールに近いのはイロハさんのほうか。"
"10058090-30-アンナ" = "スピードは私たちの方が上だから、追い越すことはできるけど……。"
"10058090-31-エリナ" = "下手に遠回りしてると、あっちが先にゴールしちゃうね。"
"10058090-32-ラナ" = "でも、まともに戦ったら一瞬でゲームオーバー。"
"10058090-33-エリナ" = "あっちもこの状況は把握してるはずだから……。"
"10058090-34-アンナ" = "結局、真っ向勝負になるわね。"
"10058090-35-エリナ" = "あっちがゴールしてから、安全に行くって方法もあるよ。"
"10058090-36-エリナ" = "確実に準優勝できるし……。"
"10058090-37-エリナ" = "それが、一番賢い選択かもね～"
"10058090-41-エリナ" = "分かってる。そんなことしないよ。#nここまで来るの、め～っちゃ大変だったし！"
"10058090-43-エリナ" = "みんな本気で戦ってたんだから……#n私たちだけ、逃げるわけにはいかないっしょ！"
"10058090-45-アンナ" = "そうね。私たちだけの力で来たわけじゃないもの。"
"10058090-47-ラナ" = "始めたからには、ちゃんとした終わりが見たい。"
"10058090-49-アンナ" = "行くわよ！子犬号が最高の戦車だって、証明するの！"
"10058090-50-アンナ" = "エリナ、一番貫通力が高い弾をお願い！"
"10058090-51-エリナ" = "毎晩、優勝カップでお湯を沸かしてお茶を飲もう！"
"10058090-52-ラナ" = "それなら、私は毎朝シリアル――"
"10058090-63-一同" = "183号、大成功しよー！"
"10058090-65-チアキ" = "「183号、大成功しよー！」だなんて、素敵な掛け声ですね！"
"10058090-66-チアキ" = "果たして！#nゲヘナが守り続けてきた優勝カップは、#nレッドウィンターの手に渡ってしまうのでしょうか？"
"10058090-67-チアキ" = "どうやって優勝カップでお湯を沸かすつもりなのかも気になるところです！"
"10058090-68-チアキ" = "では、いよいよ運命の決戦です！"
"10058090-69-イブキ" = "チアキ先輩ー！他の先輩がメモをくれたんだけど、「かざんばい」ってなあに？"
"10058090-70-チアキ" = "イブキちゃん。#n火山灰は火山が噴火した時に出てくるホコリみたいなものですよ！"
"10058090-71-チアキ" = "情報によると、コース終盤に位置する火山の活動が活発化しているとのことです！"
"10058090-72-チアキ" = "視界の悪化など、#n火山灰がレース展開にどう影響を及ぼすかも大きな見どころですね！"
"10058090-73-チアキ" = "ゲヘナ[ruby=パンデモニウム・ソサエティー]学園万魔殿所属[/ruby]、#n[ruby=なつめ]棗イ[/ruby]ロハさんの「虎丸号」が防衛に成功するのか！？"
"10058090-74-チアキ" = "レッドウィンター連邦学園183号特別クラス所属、#n[ruby=にき]仁木[/ruby]アンナさんの「子犬号」が初のタイトルを奪うのか！？"
"10058090-75-チアキ" = "猛虎と猛犬の対決をご覧いただきましょう！では、現場のカメラに繋ぎます！"
"10058090-79-アンナ" = "げほっ、げほっ。"
"10058090-80-アンナ" = "なんか、噴火が激しくなってるような……。"
"10058090-81-エリナ" = "たしかに……火砕流とかはないみたいだけど、火山灰がすごいね。"
"10058090-82-アンナ" = "ラナ、エンジンはどう？"
"10058090-83-ラナ" = "周囲の空気に比例して温度が上がってるけど、まだ大丈夫。"
"10058090-84-エリナ" = "ううっ、火山灰が積もってきた……屋根でも付ければ良かったかな。"
"10058090-85-アンナ" = "たぶん、それだといろいろ不便だったでしょうね。#nこんな環境だなんて予想できなかったし、仕方がないわ。"
"10058090-86-？？？" = "183号特別クラス、子犬号のみなさん。共通チャンネルから失礼します。"
"10058090-87-イロハ" = "こちらは万魔殿の虎丸チーム。戦車長の棗イロハです。"
"10058090-90-アンナ" = "虎丸チームって言った！？"
"10058090-91-エリナ" = "ご、ご用件は何でしょうか……？"
"10058090-92-イロハ" = "今日はお互いに頑張ったので、休憩がてら話でもしましょう。"
"10058090-93-イロハ" = "いくつか確認したいこともありますし。#n安心してください。攻撃はしませんから。"
"10058090-94-イロハ" = "2時の方向に前進してください。こちらは砲塔を後ろに向けておきます。"
"10058090-95-アンナ" = "何を企んでるのかしら？"
"10058090-96-エリナ" = "う～ん、なんだろう？……あれ？#nさっきまであそこにいたのに、火山灰のせいで見えなくなっちゃった。"
"10058090-97-アンナ" = "先に見えたら、攻撃してもいいんじゃない？"
"10058090-98-ラナ" = "本当に話したいのかも。退屈なんだよ。"
"10058090-99-アンナ" = "まさか。いくら退屈でもそれはないでしょ。"
"10058090-100-エリナ" = "……分かりました。こちらは砲塔がないので何もできませんけど。"
"10058090-101-イロハ" = "撃ちたいなら撃っても構いませんよ。挑戦は拒みませんから。"
"10058090-102-イロハ" = "では、実際に会って話をしましょう。"
"10058090-106-アンナ" = "……舐められてるのかしら？"
"10058090-107-エリナ" = "とりあえず話を聞いてみよ～よ。仮説は検証しないと。"
"10058090-108-アンナ" = "ラナ、気を付けながら行って！"
"10058090-119-アンナ" = "到着しました。183号特別クラスの学級委員長、仁木アンナです。"
"10058090-124-イロハ" = "来ましたか。"
"10058090-125-イロハ" = "ふむ……。"
"10058090-126-アンナ" = "お、お話って何ですか……？"
"10058090-127-イロハ" = "私は選手であると同時に、この大会の進行係でもありまして。#nいくつか確認したいことがあります。"
"10058090-128-イロハ" = "戦車は正常に作動しますか？火器や走行に問題はありませんか？"
"10058090-129-アンナ" = "もちろんです！ここまで2両も撃破したんですから！"
"10058090-130-イロハ" = "分かりました。レース続行の能力アリと記録しておきます。"
"10058090-131-イロハ" = "火山灰が降っていますが、棄権する気はありますか？"
"10058090-132-エリナ" = "まさか！ぜ～ったいにしません！"
"10058090-133-イロハ" = "分かりました。別に挑発してるわけではないので、悪しからず。"
"10058090-134-イロハ" = "選手に重大な危険が及ぶおそれがある場合、#n残った選手の過半数が賛成すれば試合を中止にできます。"
"10058090-135-イロハ" = "みなさんの戦車には屋根が無いようですが、大丈夫ですか？#n火山灰はここからどんどん激しくなりますよ？"
"10058090-136-イロハ" = "私は中止に同意します。レースはこれからもたくさんありますし、#n優勝にこだわっているわけではないので。"
"10058090-137-イロハ" = "みなさんが同意すれば……#nレースはこのまま中止になり、我々は共に準優勝扱いになります。"
"10058090-138-ラナ" = "ふわふわさんは、私たちを脱落させて優勝しないんですか？"
"10058090-139-イロハ" = "ふ、ふわふわさん？"
"10058090-140-イロハ" = "さっき言いましたが……#nそちらから先に手を出してこない限り、戦うつもりはありません。"
"10058090-141-アンナ" = "まさか、私たちを侮っているんですか？"
"10058090-142-イロハ" = "いえ、そうではありません。#n好みというか、信念というか……癖と言ってもいいかもしれませんね。"
"10058090-143-イロハ" = "どうしますか？#n私は、みなさんがここで棄権しても臆病者だとは思いませんよ？"
"10058090-146-アンナ" = "エリナ。"
"10058090-147-エリナ" = "ラナ。"
"10058090-148-ラナ" = "アンナ。"
"10058090-149-アンナ" = "お断りします！"
"10058090-150-エリナ" = "私たち、全力でやるって決めたんです！"
"10058090-151-エリナ" = "たしかに、他にも大会はあるけど……#nこの大会で全力を尽くせるのは、今だけですから！"
"10058090-152-エリナ" = "最初は参加したいって想いだけで来ちゃったけど……#n今は、めーっちゃ優勝したくなっちゃいました！"
"10058090-153-ラナ" = "私たち3人で作った戦車がどこまでいけるのか知るためにも、#n最後まで戦いたいのです。"
"10058090-154-ラナ" = "だって、諦めない戦車はかっこいいから。"
"10058090-155-アンナ" = "それに……。"
"10058090-156-アンナ" = "きちんと勝って、過去の失敗に「ざまあみろ！」って言いたいんです！"
"10058090-157-エリナ" = "アンナ……！"
"10058090-158-アンナ" = "ブイ！"
"10058090-159-アンナ" = "そういうことなので、申し訳ありませんが単独優勝は譲れません！"
"10058090-160-エリナ" = "絶対に諦めない……いや、諦めるなんて無理です！"
"10058090-161-イロハ" = "ほう。"
"10058090-162-イロハ" = "みなさん、スタートの時とは目つきが変わりましたね。良い変化です。"
"10058090-163-アンナ" = "「こわい～やめて～」って言ってた人はどこに行ったのかしら？"
"10058090-164-エリナ" = "燃料浪費者は黙っててぇ……！"
"10058090-165-アンナ" = "ふふふっ！"
"10058090-166-イロハ" = "良いでしょう。#n今からこの火山をそれぞれ反対方向に回って、エンカウントしたら決闘です。"
"10058090-167-イロハ" = "虎丸チーム、総員乗車！エンジン始動！"
"10058090-172-アンナ" = "い、言ってしまった……。"
"10058090-173-エリナ" = "でっかい重戦車と絶対王者を相手に挑発しちゃった……。"
"10058090-174-ラナ" = "？"
"10058090-175-ラナ" = "今からでも撤回する？"
"10058090-176-アンナ&エリナ" = "しない！！！"
