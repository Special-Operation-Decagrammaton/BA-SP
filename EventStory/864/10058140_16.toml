[translation]
"10058140-1" = "後日談その2;戦士たちの楽園"
"10058140-3" = "閉幕の祝賀パーティー"
"10058140-4-チアキ" = "イッツー！"
"10058140-5-イブキ" = "パーティータイム！だよ～！"
"10058140-9-マコト" = "祝うにはまだ早いぞ！！#nイロハの奴は逃げ、服を盗んだ犯人もまだ捕まっていないんだからな！"
"10058140-10-チアキ" = "まあまあ！大会は無事終わったんだから、いいじゃないですか！"
"10058140-11-サツキ" = "でも、本当に不思議よね。#n荷物を受け取った時には、たしかに重みを感じたのに……。"
"10058140-13-アズサ" = "服が盗まれたのか……ゲヘナも経済的に困ってるみたいだね。"
"10058140-14-ハナコ" = "水着が1着あれば、人は十分生きていけるのですが……。"
"10058140-15-コハル" = "あんたは早く服を着なさいよ！！それしかないの！？"
"10058140-16-コハル" = "レースは終わったのに、どうしてまた水着なの！？"
"10058140-17-ハナコ" = "さっき着ていた水着は汗でびしょびしょになってしまったので……#nこのような場には清潔でサラっとした水着を着てくるのがマナーかと。"
"10058140-18-ハナコ" = "それとも、コハルちゃんはびしょびしょの私のほうが好きですか？"
"10058140-19-コハル" = "い、嫌っ！！近づかないで！！"
"10058140-23-コハル" = "うわああぁぁん！"
"10058140-25-ヒフミ" = "あはは……#nですが、誰もケガすることなく無事にレースが終わって良かったです。"
"10058140-26-アズサ" = "ん？"
"10058140-31-アズサ" = "あなたは、あの時の……。"
"10058140-32-ラナ" = "ふむ。"
"10058140-33-ラナ" = "また会えたので、今は敵ですね。"
"10058140-34-アズサ" = "うん、そうだね。"
"10058140-38-エリナ" = "ラナと同じ漫画を読んでるんだね～。"
"10058140-39-アズサ" = "類は友を呼ぶからね。"
"10058140-40-ラナ" = "よく考えると前に再会しているので、#n今は一周回って友達になったということです。"
"10058140-41-アズサ" = "不変の法則だ。また会えば敵、さらに会えば戦友。"
"10058140-42-アンナ" = "前回も敵というより、味方でしたけどね。"
"10058140-46-ヒフミ" = "こんばんは、183号のみなさん！"
"10058140-47-ハナコ" = "改めて、優勝おめでとうございます。"
"10058140-48-アンナ" = "ヒフミさん！ハナコさん！昨日から本当にお世話になりました！"
"10058140-49-エリナ" = "ううっ……#nもう一滴も出ないと思ってたけど、みんなの顔を見たらまた涙が……。"
"10058140-50-アンナ" = "や、やめてよ。私まで泣いちゃうじゃない……ひぃん……。"
"10058140-51-ヒフミ" = "ふふっ。せっかくのパーティーなんですから、一緒に楽しくお祝いしましょう！"
"10058140-52-アズサ" = "あの二人は泣き虫だね。"
"10058140-53-ラナ" = "他にもいろいろな側面がありますが、はぁ……今は泣き虫のようです。"
"10058140-54-アンナ&エリナ" = "うあぁん！ありがとー！！"
"10058140-56-ネル" = "あー！すっきりした！思いっきり暴れた後のパーティーってのも悪くねぇな！"
"10058140-57-ネル" = "だろ？お前ら！"
"10058140-67-モモイ" = "私たちの上であんだけ暴れたんだから、そりゃすっきりするでしょ……。"
"10058140-68-ユズ" = "デコピンされたところが、たんこぶになってそう……。"
"10058140-69-ケイ" = "アリスが何をしたって言うんですか！とばっちりです！"
"10058140-70-アリス" = "チビメイド様は戦車より強いと思います！"
"10058140-71-ミドリ" = "銃を撃つのが違反じゃないなんて、このレースおかしい……。"
"10058140-72-ネル" = "文句ばっか言いやがって！勝負は勝負だろうがぁ！"
"10058140-75-ネル" = "……ほんとに痛むのか？……悪ぃ。"
"10058140-76-モモイ" = "痛いよ！！ひどすぎる！！ちゃんと謝って！！"
"10058140-77-ネル" = "ちっ。たしかにやりすぎちまったかもな。悪か……。"
"10058140-78-ウタハ" = "ここにいたのかい、ネル？プリズム戦車はどうだった？"
"10058140-79-ネル" = "あ、ちょっと待ってろお前ら。ウタハ、戦車は問題なかったぜ。"
"10058140-80-アスナ" = "ビームがババーン！って出てくるの、すっごくかっこよかったよー！"
"10058140-81-ウタハ" = "満足してもらえたなら、エンジニアとしては嬉しい限りだ。"
"10058140-82-ウタハ" = "それでは、ここにサインを。"
"10058140-83-ネル" = "ああ、そういや後払いだったな……。"
"10058140-89-ネル" = "あぁ？なんで2枚なんだよ？"
"10058140-90-ウタハ" = "C&Cからの注文は2台だからさ。"
"10058140-91-ネル" = "んなわけねーだろ！！1台しか……。"
"10058140-94-ネル" = "おい、[ruby=あすま]飛鳥馬[/ruby]トキ。"
"10058140-95-トキ" = "はい、トキです。"
"10058140-96-トキ" = "いかがされましたか？"
"10058140-97-ネル" = "良い度胸じゃねぇか！堂々とC&C名義で決済しやがって！！"
"10058140-98-トキ" = "名案だと思ったのですが、#n先々のことまで考えが及ばなかったのは失敗でしたね。"
"10058140-99-ネル" = "てめぇ、今日という今日は……！"
"10058140-100-トキ" = "代筆していただいたネル先輩のサインは完璧だったのに……#nすみません、モモイ。"
"10058140-101-モモイ" = "ああっ！！バラしちゃダメじゃん！！"
"10058140-104-モモイ" = "……あっ！"
"10058140-105-ネル" = "……ははっ。"
"10058140-109-ネル" = "当然、ボコられる覚悟はできてんだよなぁ？"
"10058140-117-ゲーム開発部一同" = "ぎゃあああああっ！"
"10058140-122-シロコ" = "ん、花火。すごい。"
"10058140-123-セリカ" = "というか今、悲鳴が聞こえなかった！？"
"10058140-124-ホシノ" = "ふぁあー……おじさんはパーティーより寝ていたいかなー。"
"10058140-125-ノノミ" = "先輩！そんなこと言ってないで、一緒にパーティーを楽しみましょう☆"
"10058140-126-ホシノ" = "パジャマパーティーだったらよかったんだけどねー。"
"10058140-127-アヤネ" = "みんな無事にレースを終えられたことは良かったのですが……。"
"10058140-128-アヤネ" = "私たちの戦車、完全に壊れてしまいましたね。修理費はどうしましょう……？"
"10058140-129-セリカ" = "砲身は壊れて、自力走行も2速ギアがやっとって……#nもうまともなトコないわね。"
"10058140-130-シロコ" = "それなら問題ない。どうせタダだから。"
"10058140-131-セリカ" = "タダってどういうこと？"
"10058140-132-シロコ" = "これは、カイザーローンが校門の前に停めてたやつだから。"
"10058140-133-シロコ" = "元に戻しておけばいいだけ。"
"10058140-134-アヤネ" = "それって、まさか盗んできたってことですか？"
"10058140-135-シロコ" = "無断駐車したってことは、その土地の持ち主が使うことに同意したってこと。"
"10058140-136-シロコ" = "カイザーローンが不法投棄したゴミは、毎日私たちが片づけてるでしょ。"
"10058140-137-セリカ" = "そ、それとこれとは違うでしょ！"
"10058140-138-ホシノ" = "昔のこと思い出すなぁー。"
"10058140-139-ホシノ" = "うちの後輩……どこかに行くと、いつも何か拾ってきてたよねー。"
"10058140-140-ノノミ" = "恩返しする猫みたいでしたね☆"
"10058140-141-セリカ" = "思い出に浸ってる場合じゃないでしょ！！"
"10058140-142-セリカ" = "もう……これ、どうやって戻すの！？"
"10058140-143-シロコ" = "簡単だよ。カイザーローンの戦車なんだし……。"
"10058140-144-シロコ" = "銀行の前に駐車しよう。"
"10058140-145-セリカ" = "誤解されるわよ！！！"
"10058140-149-ネル" = "待て！！"
"10058140-150-モモイ" = "うわああぁぁん！！"
"10058140-152-コハル" = "いやあぁ！！水着ハグはやめて！！"
"10058140-156-ハナコ" = "えいっ♡えいっ♡"
"10058140-158-ヒフミ" = "もう、泣くのはおしまいですよ～！"
"10058140-159-アンナ" = "わああぁぁん！"
"10058140-160-エリナ" = "ひいいぃぃん！"
"10058140-163-チアキ" = "こうして、ゲヘナカップは無事に幕を下ろしました！"
"10058140-164-チアキ" = "先生！最後に一言お願いします！"
"10058140-165" = "[ns] \"うん！\""
"10058140-167" = "[ns] \"青春だなぁ！\""
