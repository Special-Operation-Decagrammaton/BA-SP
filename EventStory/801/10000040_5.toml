[translation]
"10000040-1" = "第4話;修行部の変わり者たち"
"10000040-2-シズコ" = "もう、倒しても倒してもキリがない……！"
"10000040-3-シズコ" = "せめてフィーナもいれば……！"
"10000040-4-？？？" = "そこまでだよ！[ruby=すだまいちざ]魑魅一座[/ruby]・路上流！"
"10000040-5-魑魅一座A" = "だ、誰だ！？"
"10000040-6-？？？" = "何だ誰だと聞かれたら、答えてやるのが人情ね！"
"10000040-7" = "（ドドンッ！！！）"
"10000040-8-カエデ" = "シュババッ！！"
"10000040-9-カエデ" = "派手に！"
"10000040-10-カエデ" = "可憐に……。"
"10000040-11-カエデ" = "う、美しく……！で、合ってます……？"
"10000040-12-ツバキ" = "ばっちり！"
"10000040-13-ツバキ" = "街の平和を守るため、美少女三人組の修行部……！"
"10000040-14-ツバキ" = "ここに参上！！"
"10000040-15-ミモリ" = "参上―……。"
"10000040-16-カエデ" = "えと、参上、です……。"
"10000040-17-ツバキ" = "ふふーん！完璧な登場演出！ね、ツバキ先輩！"
"10000040-18-ミモリ" = "ふぁ……そう？"
"10000040-19-カエデ" = "えっと……カエデちゃん、何だかすごい見られてる気が……。"
"10000040-20-シズコ" = "……ね、言ったでしょう？変わり者だって。"
"10000040-21-魑魅一座A" = "……。"
"10000040-22-魑魅一座A" = "……はっ！？つ、つい見惚れてしまったが、お前たちは何者だ！？"
"10000040-23-カエデ" = "私たちは、素敵なレディーになるために日々修行を続ける「修行部」！"
"10000040-24" = "それが目的なのは、カエデだけでしょ？"
"10000040-25-ツバキ" = "私は別にそんな修行もしてないし……とにかく寝られればそれで。"
"10000040-26-ツバキ" = "ふぁ……眠い。ここで寝ていい？"
"10000040-27-カエデ" = "魑魅一座と対峙しながらも全く動じないツバキ先輩、かっこいい……！"
"10000040-28-カエデ" = "ああっ、でもツバキ先輩！ここで寝ちゃダメ……！"
"10000040-29-ミモリ" = "あはは……でも、目標があるというのは良いことだと思います。"
"10000040-30-カエデ" = "そうだよミモリ先輩！素敵なレディーになるための修行ついでに、街の治安も守らなきゃ！"
"10000040-31-カエデ" = "ということで、私たち修行部の出番だよ！"
"10000040-32" = "魑魅一座・路上流、覚悟！"
"10000040-33-ツバキ" = "うん、覚悟～。"
"10000040-34-ミモリ" = "そ、それでは、覚悟してください！"
"10000040-35-魑魅一座A" = "ぐああっ！また強くなってないかあいつら！？"
"10000040-36-シズコ" = "無駄無駄！こっちには先生がいるんだから！"
"10000040-37-魑魅一座A" = "ちっ、一体何者なんだシャーレ……！"
"10000040-38-魑魅一座B" = "あの馬っ……忍者もどきはまだか！？"
"10000040-39-魑魅一座B" = "えっと、確かそろそろ……。"
"10000040-40" = "イズナ流忍法！四方八方もくもくの術！"
"10000040-41-シズコ" = "ば、爆発！？"
"10000040-42-カエデ" = "え、うわっ！？"
"10000040-43-ツバキ" = "うーん……あれ、先生は？"
"10000040-44-ミモリ" = "せ、先生……！？"
"10000040-45-魑魅一座A" = "よし今のうちだ、全員突撃！"
"10000040-46-イズナ" = "イズナ、予告通りに再び参上しました！"
"10000040-47" = "[s] \"けほっけほっ！イズナ……！？\""
"10000040-48-イズナ" = "イズナ、あの後気が付きました！"
"10000040-49-イズナ" = "たとえ先生が私の夢を認めてくれたかっこいい大人……いえ、かっこよくて悪い大人だとしても！"
"10000040-50-イズナ" = "こうやって敵として出会ってしまった以上……先生を倒して説得しなければなりません！"
"10000040-51-イズナ" = "それこそが、イズナの歩む忍びの道！忍者としての宿命だと！"
"10000040-52" = "[s] \"……どういうこと？\""
"10000040-53-イズナ" = "さあ、お覚悟を！先生！"
"10000040-54-イズナ" = "イズナは、先生のことを打ち倒してみせます！"
"10000040-55-イズナ" = "やあっ！！"
