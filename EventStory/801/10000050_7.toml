[translation]
"10000050-1" = "第5話;お祭りは開かれて"
"10000050-2-雇い主" = "……またやられたのか？それに、イズナ殿はどうした？"
"10000050-3-魑魅一座A" = "あいつは役に立たない！何が忍者だ……！"
"10000050-4-魑魅一座B" = "今日もここに来る途中に、やるべきことがあるからって……。"
"10000050-5-雇い主" = "ふむ、それなりに使えると思っていたのだが……。"
"10000050-6-雇い主" = "（所詮この程度か……）"
"10000050-7-魑魅一座B" = "このままだと桜花祭を邪魔しようにも、あのシャーレの先生とかいう大人にやられっぱなしっす。"
"10000050-8-雇い主" = "シャーレの先生か……それほどの力を持っているとは、にわかには信じがたいが……まあ良い。"
"10000050-9-雇い主" = "今、商店街にはどれぐらいの魑魅一座が来ている？"
"10000050-10-魑魅一座A" = "えっと、だいたい120人ぐらい……？"
"10000050-11-雇い主" = "……そろそろ仕掛け時か。"
"10000050-12-雇い主" = "今から言うことをよく聞け。"
"10000050-13" = "（ひそひそひそひそ……）"
"10000050-14-魑魅一座A" = "えっ、本当にそんなことを……？"
"10000050-15-魑魅一座B" = "マジっすか？本当にやっちゃっていいんすか？"
"10000050-16-雇い主" = "大きな変数は取り除いておくに限る。"
"10000050-17-雇い主" = "この処理さえ上手くいけば計画は成功するはず。そうすればお前たちにも契約通り、成果報酬を渡せる。悪い話では無いだろう。"
"10000050-18-魑魅一座A" = "まあ、あたしらにだって成功させるつもりはあるからね。分かったよ。"
"10000050-19-魑魅一座B" = "はいっ！かしこまっす！"
"10000050-20-雇い主" = "……くれぐれも、イズナ殿には内密にな。"
"10000050-21-雇い主" = "さて、いい加減仕上げの時間だ。"
"10000050-22" = "百夜堂"
"10000050-23" = "（日が暮れた頃、作戦会議のために百夜堂に全員が集まった）"
"10000050-24-ミモリ" = "ところで元凶のお話、具体的にはどうします？"
"10000050-25-シズコ" = "一番確実な方法があるわ。"
"10000050-26-シズコ" = "まず街に出て、どこかで悪さをしてる魑魅一座を見つけたら、一気に包囲するの。"
"10000050-27-シズコ" = "お祭り運営委員会だけでは成しえなかった大掛かりな作戦だけど、修行部もいる今なら可能なはず！"
"10000050-28" = "包囲して～、その後はどうする……？"
"10000050-29-シズコ" = "もちろん全員で一気に撃退！拘束！"
"10000050-30-シズコ" = "それで、そいつらから元凶を吐かせれば終わり！"
"10000050-31-シズコ" = "必要なら多少過激な方法もやむなし！"
"10000050-32-ツバキ" = "サスガ委員長！"
"10000050-33-フィーナ" = "悪党たちには小指ザクリの刑デスね！"
"10000050-34-カエデ" = "うわっ……"
"10000050-35-カエデ" = "あら……"
"10000050-36-カエデ" = "ふあぁ……"
"10000050-37" = "[s] あんぐり"
"10000050-38-フィーナ" = "えっと……よく考えると、フィーナもそれはちょっとやり過ぎだと思いマスよ、委員長……。"
"10000050-39-シズコ" = "なんで私の発案みたいな言い方してんの！？"
"10000050-40-シズコ" = "とにかく、魑魅一座を捕まえて元凶について吐かせる！"
"10000050-41-シズコ" = "もう時間が無いの。"
"10000050-42-シズコ" = "百夜ノ春ノ桜花祭のクライマックスは明日……"
"10000050-43-カエデ" = "あっ、聞いたことある！花火でしょ、ホログラムの！パンパンパーンって！"
"10000050-44-シズコ" = "ええ、盛り上がりも最高潮。桜花祭のラストを飾るのに相応しい新たな花火を用意したわ。"
"10000050-45-ツバキ" = "もしその時に魑魅一座が暴れたら、「騒ぎ」じゃ済まなそうだね～……。"
"10000050-46-シズコ" = "もしそんなことになったら、責任を問われて私たちお祭り運営委員会は……。"
"10000050-47-ミモリ" = "シズコちゃん……。"
"10000050-48-シズコ" = "……ううん、もしものことはその時また考える。"
"10000050-49-シズコ" = "まずは早いところ元凶を探す！それで私がこれまで受けてきたストレスをそっくりそのまま叩き込んでやらないと、腹の虫がおさまんない！絶対ボコボコにしてやるんだからっ！！"
"10000050-50" = "[s] \"もう取り繕う気も無さそうだね。\""
"10000050-51" = "こ、細かいことはいいんです！"
"10000050-52" = "（こうしてお祭り運営委員会、そして修行部と一緒に街へパトロールに行くことになったのだけれど……）"
"10000050-53-シズコ" = "あいつらいっつも呼ばれなくても来るくせに、なんでいざ探そうとすると出てこないわけ！？"
"10000050-54-フィーナ" = "フィーナ、分かった気がしマス！リモコンと同じデス！"
"10000050-55-フィーナ" = "いざ探そうと思うと見つからないものデス！フィーナ、リモコンを探してて最終的には冷蔵庫から出てきたことがありマス！"
"10000050-56-カエデ" = "分かる分かる！たしかマフィンの法則だったっけ、そんな感じの！"
"10000050-57-カエデ" = "美味しそうな法則だね、なんか違う気がするけど～。"
"10000050-58-カエデ" = "ですが、騒ぎがないおかげで、皆さん普通にお祭りを楽しめていますね。"
"10000050-59-シズコ" = "うぅっ、何で出てこないの魑魅一座……っ！"
"10000050-60-シズコ" = "ううん、きっと今にもどこかで暴れようとしてるはず……！"
"10000050-61" = "うあああん～！パパ～、ママ～！どこ～！？"
"10000050-62-ミモリ" = "あらっ、迷子の子が……？"
"10000050-63-ミモリ" = "放っておけない事案発生！！ツバキ先輩！"
"10000050-64-ミモリ" = "うん、出動～。"
"10000050-65-シズコ" = "え、えっ？ま、待って……！？"
"10000050-66-公演スタッフ" = "あっ、シズコさん！ようやく見つけました！"
"10000050-67-公演スタッフ" = "明日の花火の準備で、ご相談なのですが……。"
"10000050-68-シズコ" = "うっ！？よりによってこのタイミングで……！"
"10000050-69-シズコ" = "でもお祭り運営委員会の委員長として知らんぷりなんてできないし……フィーナ！後はお願い！"
"10000050-70-シズコ" = "先生と二人で魑魅一座を見つけて、監視しておいて！"
"10000050-71-フィーナ" = "了解デス！フィーナにお任せあれ！"
"10000050-72" = "急にみんな忙しくなってきマシタね！"
"10000050-73" = "[s] \"魑魅一座がいなければ、これが普通の光景なんだよね。\""
"10000050-74-フィーナ" = "ハイ、お頭の言う通りかと！"
"10000050-75-フィーナ" = "魑魅一座がいなかったら、ワタシたちお祭り運営委員会も他のみんなも、準備や何やらで走り回ってたと思いマス！"
"10000050-76-フィーナ" = "そうやって良い意味で忙しくしてたはずなのに、こうして違う意味で忙しくなってしまうダナンテ……。"
"10000050-77-フィーナ" = "はっ、がっかりしてる場合ではアリマセン！今お頭と一緒にいるのは、フィーナだけ！"
"10000050-78-フィーナ" = "特攻隊長として、隙を見せたらマズいシーンですね！『仁義なきニャンニャンパンチ』で見ました！"
"10000050-79" = "[s] \"よろしくね、フィーナ。\""
"10000050-80-フィーナ" = "ハイっ！お頭の身辺警護、そして桜花祭の治安……。"
"10000050-81-フィーナ" = "どちらもこの特攻隊長フィーナにお任せあれ、デス！"
"10000050-82" = "（ガチャン！）"
"10000050-83" = "[s1] \"言ってるそばからトラブル！？\"\n[s2] \"魑魅一座！？\""
"10000050-84-不良生徒A" = "はぁ？これが失敗！？"
"10000050-85-不良生徒B" = "本気で言ってんのか！？"
"10000050-86-露店商のおじさん" = "で、でもここ、端っこが割れて……。"
"10000050-87-不良生徒A" = "よく見えねえなあ！成功したんだから、大人しく商品券を出しな！"
"10000050-88-不良生徒B" = "3千円のお祭り商品券を貰ったら、それを使ってまた挑戦して、この店のかたぬきが無くなるまで無限ループし続けてやる！"
"10000050-89-露店商のおじさん" = "ひ、ひいいっ！！どうしてそんな残酷なことを！そんなのうちはどう対処したらいいんだ！？"
"10000050-90-不良生徒A" = "くくくっ！これがあたいらかたぬきの達人の、桜花祭の楽しみ方さ！"
"10000050-91-不良生徒B" = "あたしたちの目に留まったことを後悔しな！"
"10000050-92-フィーナ" = "あれは……！桜花祭で毎回現れるという「かたぬきチンピラ」！"
"10000050-93" = "[s] \"何その風物詩……。\""
"10000050-94-フィーナ" = "かたぬき屋サンたちなら誰もが恐れる相手デス！お頭！"
"10000050-95-フィーナ" = "ここはお頭と、フィーナの出番かと！"
"10000050-96-フィーナ" = "桜花祭の平和を乱す問題児は、フィーナたちが許しマセン！"
