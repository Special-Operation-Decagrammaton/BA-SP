[translation]
"10004030-1" = "第3話;ちょっとした仕返し"
"10004030-2" = "梅花園の付近の公園"
"10004030-3-シュン" = "到着です！"
"10004030-4" = "[s1] \"ここって……。\"\n[s2] \"……公園？\""
"10004030-5-シュン" = "はい、そうです。"
"10004030-6-シュン" = "はい、そうです。"
"10004030-7-シュン" = "梅花園の近くにある割には、あまり誰も来ないので、ゆっくり休みたい時なんかにピッタリなんです。"
"10004030-8-シュン" = "私もお仕事の合間によく……"
"10004030-9-シュン" = "いえ、シュンお姉ちゃんがここに来るのを、何度か見たことがあります！"
"10004030-10-シュン" = "良い感じの場所がたくさんあるのですが、私のおすすめのポイントはここ！"
"10004030-11-シュン" = "木で作られた、この椅子とテーブルです！"
"10004030-12-シュン" = "座るとちょうどテーブルが良い位置にあって、胸を支えてくれるのですっごく楽なんです！"
"10004030-13-シュン" = "肩こりが辛いときはよくここで――"
"10004030-14" = "[s3] \"……胸？\"\n[s4] \"……肩こり？\""
"10004030-15-シュン" = "あっ……え、えっとですね……。"
"10004030-16-シュン" = "その、つまり……もしこの先成長して胸も大きくなれば、そうなるだろうなっていう……！"
"10004030-17-シュン" = "将来性はものすっごいですので！"
"10004030-18" = "[s5] \"それはそうだね。\"\n[s6] \"何だかそのセリフ、聞いたことあるような……？\""
"10004030-19-シュン" = "と、とにかく！"
"10004030-20-シュン" = "と、とにかく！"
"10004030-21-シュン" = "せっかく公園に来たんですし、先生も遊びましょう！"
"10004030-22-シュン" = "何にしますか？シーソーでも良いですし、あのバネがついた動物の乗り物も楽しそうですし……。"
"10004030-23-シュン" = "あ、ブランコも良いですよね！"
"10004030-24-シュン" = "以前からブランコに乗って、後ろから押してもらいたいと思ってたんです！先生、行きましょう！"
"10004030-25" = "[s] \"えっと、シュンを探しに来たんじゃなかったっけ……？\""
"10004030-26-シュン" = "あ、あぅ……。"
"10004030-27-ココナ" = "あれ、先生？この公園にいるなんて珍しいですね。"
"10004030-28-シュン" = "こ、ココナちゃん……！？どうしてここに？"
"10004030-29-ココナ" = "えっと、そっちの子は？"
"10004030-30-ココナ" = "多分初めましてだと思うけど、梅花園に新しく来た子だったり？"
"10004030-31-シュン" = "は、はいっ！そうでした！つい最近こちらに来た、シュエリンです！"
"10004030-32-シュン" = "（もしかして、ココナちゃんも私が誰だか気づいてないのでしょうか……？）"
"10004030-33-シュン" = "（良かったです。私だと分かった上で先ほどの場面を見られていたら、流石に恥ずかしいですからね……）"
"10004030-34-シュン" = "（ですが、ちょっと寂しいですね。少し幼くなったとはいえ、妹に気が付いてもらえないというのは……）"
"10004030-35-ココナ" = "……何だかすごく親近感があるんだけど、私たちどこかで会ったことある？"
"10004030-36-ココナ" = "シュン姉さんに聞けば分かるかな……あ、そうそう。シュン姉さんがどこかに行っちゃったんですよ、先生。それでもしかしたらここに来てるかなって思いまして。"
"10004030-37" = "[s] \"ココナも、シュンを探してたの？\""
"10004030-38-ココナ" = "はい、さっきから連絡が取れないんです。"
"10004030-39-ココナ" = "急にいなくなっちゃったので、シュン姉さんの分まで園児たちのおやつの準備をしなくちゃで、大変だったんですよ……。"
"10004030-40-シュン" = "（そ、そのひまわり組のおやつの準備は、もともとココナちゃんの担当でしたよね……！？）"
"10004030-41-ココナ" = "確かに、最近のシュン姉さんはちょっと様子が変でしたが……。"
"10004030-42-ココナ" = "まあ多分、またいつもの悩みだと思います。"
"10004030-43-ココナ" = "どんどん歳を重ねてしまう、とか、お肌の調子が、とか……そんなこと気にしなくても良いのに。"
"10004030-44-シュン" = "（「そんなこと」ではありません！一大事なんですよ！？）"
"10004030-45-ココナ" = "そもそも、日ごろ「最近体重が……」って言ってる傍から甘いものを食べてるし……こう考えると、結構シュン姉さんって子どもっぽいんですよね。"
"10004030-46-ココナ" = "もしかしたら今頃、どこかで甘いタンフールーでも食べながら、時間のことを忘れちゃってるだけなのかもしれません。"
"10004030-47-シュン" = "（せ、先生の前で何てことを……！）"
"10004030-48-シュン" = "（タンフールーの件は、確かに一部当たってはいますが……それでも、いくらココナちゃんとはいえ許せません！）"
"10004030-49-シュン" = "……ココナちゃんも十分子どもっぽいですよ！人参なんて苦くて食べられないって、毎回こっそりよけてるじゃないですか！"
"10004030-50-ココナ" = "えっ、ど、どうしてあなたがそれを知ってるの？"
"10004030-51-シュン" = "シュンお姉ちゃんが言ってました。ココナ教官は好き嫌いばっかりするから、まだまだ子どもなんですよって。"
"10004030-52-ココナ" = "うぅ……！どうしてシュン姉さん、子どもたちにそういうことを言っちゃったの……！？"
"10004030-53-ココナ" = "……こほん。えっとね、あなたはまだ小さいから分からないかもしれないけど、私はもう立派なレディーなの。"
"10004030-54-ココナ" = "レディーにはそれぞれの個性があって、私はたまたま「人参が苦手」っていう個性を持っちゃっただけで……。"
"10004030-55-シュン" = "嘘です。本当のレディーは嫌いな食べ物もちゃんと食べられます。"
"10004030-56-シュン" = "それに、「背を高くするためのばんざい体操」を毎朝やったりもしません！"
"10004030-57-ココナ" = "ど、どうしてそれを……！？他の人にバレないように、早朝にだけやるようにしてたのに……！"
"10004030-58-シュン" = "ところであの体操、あんまり効果は無いと思いますよ。玄龍門のキサキ会長も以前やってましたが、結局意味無かったと言ってやめられてましたし。"
"10004030-59-シュン" = "ですから好き嫌いばかりしてると、あとついでにお姉ちゃんの悪口を言っていると、ココナちゃんはいつまでもその身長のままです！"
"10004030-60-ココナ" = "うっ、ううぅぅっ……！"
"10004030-61-ココナ" = "あなたの顔、覚えたからね！覚えておきなさいよ！"
"10004030-62-シュン" = "そうやって言う方ほど、大したことないんですよーだ！"
"10004030-63-シュン" = "（な、何だか、心に浮かんでくるままに好き放題喋ってしまいましたが……スッキリしました！）"
"10004030-64-シュン" = "（こんなに好き勝手できるなんて……この身体、結構悪くないですね！）"
"10004030-65" = "[s] \"……シュエリン？\""
"10004030-66-シュン" = "あ……。"
"10004030-67" = "[s] \"お姉さんをあんまりからかっちゃダメだよ？\""
"10004030-68-シュン" = "えっと、お姉さんは一応私の方なのですが……。"
"10004030-69-シュン" = "ですが、確かに言い過ぎたかもしれません……。"
"10004030-70" = "[s] \"今度ココナに会ったら、ちゃんと謝ろうね？\""
"10004030-71-シュン" = "はーい。"
"10004030-72-シュン" = "……。"
"10004030-73-シュン" = "シュンお姉ちゃんはここにもいないみたいですし……別の場所に行きましょうか！"
"10004030-74" = "[ns] \"ま、待ってシュエリン……！\""
