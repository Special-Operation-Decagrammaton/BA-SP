[translation]
"10004075-1" = "第7話;教官としての"
"10004075-2-サヤ" = "うぅ……なんという災難……。"
"10004075-3-サヤ" = "まさかよりにもよってあのタイミングで、ヴァルキューレの生徒が現れるなんて……。"
"10004075-4-サヤ" = "それにシュンも、思いっきりとぼけるし！そのせいでぼく様と先生が、「幼い少女を無理やり押さえつけて何かを飲ませようとしていた二人組」みたいに思われたじゃないか！！"
"10004075-5" = "[s] \"まあ意図はともかく、おおよそ事実だけどね……。\""
"10004075-6-サヤ" = "それにしても、このままだとマズいのだ……。"
"10004075-7-サヤ" = "こうなったら、もっと強力な麻痺薬を……？"
"10004075-8" = "[s1] \"……ううん、大丈夫。\"\n[s2] \"私が一度、直接シュンと話してみる。\""
"10004075-9-サヤ" = "でも説得しようにも、今の幼いシュンは話なんて聞いてくれなさそうだぞ……？"
"10004075-10-サヤ" = "でも説得しようにも、今の幼いシュンは話なんて聞いてくれなさそうだぞ……？"
"10004075-11-サヤ" = "それにきっと真正面から行っても、またシュンのいたずらに巻き込まれて撒かれちゃうと思うけど……。"
"10004075-12-サヤ" = "……それにそもそも、今日はぼく様に付き合ってくれる約束じゃなかったのか……？"
"10004075-13" = "[s3] \"それについては、本当にごめん……。\"\n[s4] \"また今度、一緒にお出かけしよう。\""
"10004075-14-サヤ" = "……ま、仕方ないのだ。生徒の命運がかかってるんだし。先生とのお出かけを楽しみにしていたのは、ぼく様だけじゃないみたいだし……。"
"10004075-15-サヤ" = "その代わり今度お出かけする時は、ラー油たっぷりで大盛の刀削麺を奢ってもらうのだ！ちゃんとスケジュール空けてよ、先生！"
"10004075-16" = "[s] \"うん、約束。\""
"10004075-17-サヤ" = "ふーっふっふっ……！じゃあ、今日の実験はここまでかな。あ、何かぼく様の助けが必要になったら、いつでも連絡して良いぞ！"
"10004075-18-サヤ" = "……ぼく様たち[ruby=せんがいきょう]山海経[/ruby]の時々頼りない教官を、よろしく頼むのだ。先生。"
"10004075-19" = "[ns] \"……うん、任せて。\""
"10004075-20-シュン" = "……みんな嫌いです。"
"10004075-21-シュン" = "言うことを聞かない梅花園の子たちも、自分の当番を押し付けるココナちゃんも……私を元の身体に戻そうとする先生も嫌いです！"
"10004075-22-シュン" = "どうしてみんな、私をいじめるんですか……！？"
"10004075-23" = "[s] \"ごめんね、いじめたかったわけじゃないんだけど……。\""
"10004075-24-シュン" = "せ、先生！？"
"10004075-25-シュン" = "またいつの間に……！？"
"10004075-26-シュン" = "どうしても、私に例の解毒剤を飲ませようと？"
"10004075-27-シュン" = "いくら先生でも、そうはさせません。元の姿には、絶対に戻りませんから！"
"10004075-28" = "[s] \"……それは、どうして？\""
"10004075-29-シュン" = "当然でしょう！わざわざあの身体に戻りたいなんて思いません！"
"10004075-30-シュン" = "お肌はガサガサで、少し走ると息切れして、すぐに肩が凝って……。"
"10004075-31-シュン" = "……それに、みんな責任ばっかり押し付けてきて……。"
"10004075-32-シュン" = "……梅花園の教官には、ものによっては玄龍門の幹部に比肩するほどの特権が与えられています。ただしその代わり、責任もかなり重いです。"
"10004075-33-シュン" = "お仕事の間は、子どもたちが目を覚ましてから眠るまでの間、ひと時も目を離すわけにはいきません。何かが起きれば全て事後処理をしなくてはいけませんし、それらに忙殺されて、本来私も山海経の生徒として受けるはずだった普通の授業を受けられない……そんなこともざらです。"
"10004075-34-シュン" = "……私は、疲れました。子どもたちの面倒を見ていても、辛いことばっかりで……。"
"10004075-35" = "[s] \"……本当にそう思う？\""
"10004075-36-シュン" = "今日一日、子どもみたいに好き勝手に過ごしてみて……すっごく楽でした。"
"10004075-37-シュン" = "先生も大人ですから、ご存知ですよね？子どもたちの面倒を見るということが、どれだけ大変なことなのか……。"
"10004075-38-シュン" = "責任を負うというのは、すっごく大変です。疲れます。しんどいです。先生も今日一日私の面倒を見て、疲れましたよね？"
"10004075-39" = "[s] \"疲れてないと言ったら噓だけど、それ以上に嬉しかったよ。\""
"10004075-40-シュン" = "嬉しかった……？"
"10004075-41-シュン" = "な、何のことですか！？お世辞はやめてください！あんなにトラブルに巻き込まれて、色んなところで怒られて、嬉しいわけがないじゃないですか！？"
"10004075-42-シュン" = "サヤさんとの約束も守れなくなってしまって、お仕事も忙しいはずなのにお金も時間も使ってしまって、ヴァルキューレの方にも怒られて……。"
"10004075-43-シュン" = "それなのに、何が嬉しかったって言うんですか……！？"
"10004075-44" = "[s] \"シュンの笑顔を見られたことが。\""
"10004075-45-シュン" = "笑顔……。"
"10004075-46-シュン" = "え、笑顔が何だって言うんですか！？笑顔で抗争が止まるんですか！？"
"10004075-47-シュン" = "子どもたちの笑顔が、何かの役に立つんですか！？"
"10004075-48-シュン" = "だってそれは、それは……っ。"
"10004075-49" = "[s5] \"……それは、シュンもよく知ってるでしょう？\"\n[s6] \"子どもたちの純粋な笑顔が、どれだけかけがえのないものなのか。\""
"10004075-50-シュン" = "……。"
"10004075-51-シュン" = "……。"
"10004075-52-シュン" = "……私は、迷惑だと思ってしまいました。「嫌い」だと、言ってしまいました。"
"10004075-53-シュン" = "たとえこれが薬の副作用だとしても……いつも私のことを信じてそばにいてくれた、あの天使のような子たちに対して、そんなことを口にして……あの子たちを置いて、教官の責任から逃げ出しました。"
"10004075-54-シュン" = "こんな、こんな私に……。"
"10004075-55-シュン" = "まだ子どもたちの前に立つ資格は、あるんでしょうか……？"
"10004075-56" = "[s] \"あの子たちには、シュンが必要だよ。\""
"10004075-57-シュン" = "どうして、そう思うんですか……？"
"10004075-58" = "[s] \"見て、あっち。\""
"10004075-59-シュン" = "……？"
"10004075-60-梅花園の園児A" = "ねえねえココナちゃーん、シュンお姉ちゃんはどこ行ったの～？"
"10004075-61-梅花園の園児B" = "ココナちゃんのご飯はやだー！"
"10004075-62-ココナ" = "だからココナちゃんじゃなくて、「ココナ教官」！"
"10004075-63-ココナ" = "料理の腕は仕方ないでしょ！シュン姉さんがとびっきり上手なんだから……！"
"10004075-64-ココナ" = "……もし今日姉さんが見つからなかったら、ちゃんと私のを食べなさいよ？"
"10004075-65-梅花園の園児B" = "やーだー！シュンおねえちゃんのが良いのーー！"
"10004075-66-梅花園の園児A" = "シュンおねぇちゃん……どこぉー……？うぁぁぁぁん……！"
"10004075-67-ココナ" = "ちょっ、泣かないの！泣いてもシュン姉さんが帰ってくるわけじゃないんだから……！"
"10004075-68-ココナ" = "っていうか、泣きたいのは、私の方で……。"
"10004075-69-ココナ" = "シュン姉さん、本当にどこ行ったの……うぅっ、うぇぇぇぇぇっ……！"
"10004075-70-シュン" = "……。"
"10004075-71-シュン" = "……確かに、あの子たちを放っておくわけにはいきませんね。"
"10004075-72-シュン" = "先生。解毒剤、頂いても良いですか？"
"10004075-73" = "[ns] シュンに解毒剤を渡す。"
"10004075-74-シュン" = "ありがとうございます。"
"10004075-75-シュン" = "……今日は本当に、たくさんご迷惑をおかけしました。"
"10004075-76-ココナ" = "もうシュン姉さんったら、戻ってきたらたっぷり文句言ってやるんだから……！"
"10004075-77-シュン" = "あら、今言っていただいても良いんですよ？"
"10004075-78-ココナ" = "ね、姉さん！？い、いつの間に……！？"
"10004075-79-シュン" = "はい、お待たせしました♡"
"10004075-80-シュン" = "いくら辛くても、梅花園の教官が子どもたちの前で涙を見せちゃダメですよ。ココナちゃんもまだまだですね。"
"10004075-81-ココナ" = "べ、別に泣いてないから……っ！"
"10004075-82-ココナ" = "そ、それよりどこに行ってたの！？シュン姉さんがいないから子どもたちのおやつの準備も、晩ご飯を作るのも、私がしないといけなくなったんだよ……！？"
"10004075-83-シュン" = "おやつの準備は、元々ココナちゃんの当番だったような……。"
"10004075-84-シュン" = "でも、ごめんなさい。急にいなくなったりして……。"
"10004075-85-シュン" = "今度、ココナちゃんが好きな「バーゲンダッツ」のキャラメル味お餅入りを買ってあげますね。"
"10004075-86-ココナ" = "えっ、やった……って、アイスクリーム一個じゃごまかされないよ……！？"
"10004075-87-ココナ" = "……で、でも今回は特別に、許してあげる。シュン姉さん、いっつも頑張ってるし……。"
"10004075-88-梅花園の園児A" = "あ、シュンおねえちゃん！どこ行ってたのー？"
"10004075-89-梅花園の園児B" = "ココナちゃんのご飯はイヤ～！早く作って～！"
"10004075-90-シュン" = "こらっ、ココナちゃんが一生懸命作ってくれたのに、そんなことを言ってはダメですよ！"
"10004075-91-シュン" = "ですが今日のは私のせいですし……そうですね、では今日は食後のデザートに、美味しいパンケーキを作りましょう！"
"10004075-92-梅花園の園児たち" = "わぁー！やったぁ！シュンおねえちゃん大好き！"
"10004075-93-シュン" = "ふふっ。ですから、ココナちゃんが作ってくれた晩ご飯も美味しくいただきましょうね？"
"10004075-94-梅花園の園児たち" = "は～い！！"
"10004075-95-シュン" = "……そういえば、シュエリンとして挨拶をしていませんでしたね。"
"10004075-96-シュン" = "……先生、本当にありがとうございました。"
"10004075-97" = "[s] \"……うん。またね、シュエリン。\""
"10004075-98-シュン" = "……はい、また！"
"10004075-99" = "そうして、シュンのことが見えなくなるまで、その後姿をじっと見ていた。"
