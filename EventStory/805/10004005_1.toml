[translation]
"10004005-1" = "プロローグ;天使たちと共に"
"10004005-2" = "山海経・とある陶磁器工房"
"10004005-3-シュン" = "みなさん、ここが[ruby=せんがいきょう]山海経[/ruby]一番の陶磁器職人である、猫田さんの工房ですよ～。"
"10004005-4-シュン" = "まずは猫田さんにあらためてご挨拶をして、今日は陶磁器についてたくさん学びましょうね！"
"10004005-5-梅花園の園児たち" = "「「「よろしくおねがいしまーーす！」」」"
"10004005-6-シュン" = "猫田さん。今日はこうして見学させてくださって、本当にありがとうございます。"
"10004005-7-猫田" = "ま、構わないさ。"
"10004005-8-猫田" = "子どもたちは学園都市の未来。こうして儂の仕事を見ることで、梅花園の中に何か新しい夢を持つ子が生まれたのなら……それは、どの作品にも負けないくらい価値がある。"
"10004005-9-シュン" = "ふふ、そう言っていただけますとありがたいです。"
"10004005-10-シュン" = "では、さっそく見学を……"
"10004005-11-梅花園の園児A" = "猫田さーん、この粘土はなぁにー？"
"10004005-12-猫田" = "ふむ、それは今度の展示会に出す予定の新しい陶磁器で――"
"10004005-13-梅花園の園児B" = "あは、もちもちして柔らかそ～！"
"10004005-14-梅花園の園児B" = "ぶにっ！えへへっ！"
"10004005-15-猫田" = "儂が10時間かけて作った、陶磁器の原型がーーー！？"
"10004005-16-シュン" = "み、みなさん！勝手に作品に触っちゃだめですよ！"
"10004005-17-シュン" = "す、すみません、私の目が届かず……！"
"10004005-18-猫田" = "いや、大丈夫だ……こんなこともあろうかと、予備の原型があるからな。"
"10004005-19-猫田" = "それより、私も見間違いでなければ……あの窯の上に登っているのはまさか……。"
"10004005-20-梅花園の園児C" = "すごーい！たかーい！！あははっ！"
"10004005-21-シュン" = "み、みなさん！窯の上は危ないから、登ってはいけません……！"
"10004005-22-シュン" = "シュンおねーちゃーん、泥団子投げられた～！！"
"10004005-23" = "そっちが先に手榴弾投げてきたんじゃ～ん！"
"10004005-24-シュン" = "お、お友達には泥団子も手榴弾も投げてはいけません！"
"10004005-25-梅花園の園児F" = "この「かま」で、とーじきを焼くのかな？"
"10004005-26-梅花園の園児G" = "たぶん。でもなんか火が弱いね？"
"10004005-27-梅花園の園児F" = "よし、じゃあ手伝ってあげよー！"
"10004005-28-シュン" = "か、窯に白リン弾を投げてはいけません！"
"10004005-29-猫田" = "も、燃えている……窯が、私の工房が……っ！？"
"10004005-30-梅花園の園児H" = "シュンおねえちゃん、トイレ～！"
"10004005-31-梅花園の園児I" = "つかれた～！"
"10004005-32-シュン" = "み、みなさん、お願いですからちょっと待ってください……！！！"
"10004005-33" = "#video;10004"
