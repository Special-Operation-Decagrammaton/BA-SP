[translation]
"80000117-1" = "バレンタインもお祭り"
"80000117-2-ウミカ" = "バレンタインデーですね、先生！"
"80000117-3" = "[s] \"そ、そうだね……！\""
"80000117-4-ウミカ" = "バレンタインは、チョコレートのお祭りといえるのではないでしょうか！"
"80000117-5" = "[s] \"確かにそうかも……。\""
"80000117-6-ウミカ" = "ドキドキしながらチョコを準備し……。"
"80000117-7-ウミカ" = "当日は街が可愛いチョコで埋め尽くされて、みんなが幸せになる……。"
"80000117-8-ウミカ" = "素晴らしいことだと思います。"
"80000117-9-ウミカ" = "というわけで……ここはお祭りらしく、チョコ花火を打ち上げるのはどうでしょう！"
"80000117-10" = "[s] \"チョコ花……火……！？\""
"80000117-11-ウミカ" = "はい！"
"80000117-12-ウミカ" = "チョコを詰めた花火を打ち上げて、辺り一面にチョコの雨を降らすんです！"
"80000117-13-ウミカ" = "チョコを塗った手持ち花火で花火とチョコの香りの両方を楽しめるものとかもいいですね！"
"80000117-14" = "[s] \"そ、それはどうだろうね……！\""
"80000117-15-ウミカ" = "そうですか……。"
"80000117-16-ウミカ" = "でもそうですね……今日は特に捻らなくても盛り上がっているような気がします。"
"80000117-17-ウミカ" = "それに……。"
"80000117-18-ウミカ" = "私も……。"
"80000117-19-ウミカ" = "いつもお祭りのことだけを考えているわけではないんですよ？"
"80000117-20-ウミカ" = "百夜堂ではバレンタインに合わせ、特別な商品を用意しているんです。"
"80000117-21-ウミカ" = "和菓子とチョコをセットにして販売しておりまして――"
"80000117-22-ウミカ" = "これが結構人気なんです。"
"80000117-23-ウミカ" = "バレンタイン限定品としても、バレンタインを忘れていた人たちの受け皿としても機能しているみたいで――"
"80000117-24" = "[s] \"百夜堂は商売上手だね……！\""
"80000117-25-ウミカ" = "あ、あはは……それは社長のアイデアですよ！"
"80000117-26-ウミカ" = "私にはそこまで思いつきませんでした。"
"80000117-27" = "[s1] \"ウミカはまだ1年生でしょ？\"\n[s2] \"これからだよ！\""
"80000117-28-ウミカ" = "はい！いつか私も社長のような経営者になり――"
"80000117-29-ウミカ" = "キヴォトス中を巻き込んで……！"
"80000117-30-ウミカ" = "すごく素敵な――"
"80000117-31-ウミカ" = "――盛り上がるお祭りを催したいです！"
"80000117-32" = "[s3] \"応援するよ！\"\n[s4] \"でも、花火はほどほどにね……！\""
"80000117-33-ウミカ" = "ありがとうございます！"
"80000117-34-ウミカ" = "そのためにも、一日一日を大事にしつつ、過ごしていきたいです！"
"80000117-35-ウミカ" = "……その。"
"80000117-36-ウミカ" = "そ、それでですね……？"
"80000117-37-ウミカ" = "いつも……応援してくださる先生に……！"
"80000117-38-ウミカ" = "ちゃんと……した……。"
"80000117-39-ウミカ" = "……。"
"80000117-40-ウミカ" = "……恩返しをしたいと思いまして！"
"80000117-41-ウミカ" = "日頃色々していただいていることに比べたら、小さなものですが……。"
"80000117-42-ウミカ" = "少しでも感謝の気持ちを伝えたくて……！"
"80000117-43-ウミカ" = "どうか、受け取ってください！"
"80000117-44" = "[ns] \"これは……神輿のチョコ？\""
"80000117-45-ウミカ" = "えへへ……気づきましたか？"
"80000117-46-ウミカ" = "お祭りと言えば、神輿ですよね！"
"80000117-47-ウミカ" = "せっかくだし、私らしいチョコにしてみました！"
"80000117-48-ウミカ" = "ちなみに、屋根も開きますよ！"
"80000117-49" = "[s] \"すごく凝ってるね……！\""
"80000117-50-ウミカ" = "そして、神輿の中には――"
"80000117-51-ウミカ" = "私にとって……。"
"80000117-52-ウミカ" = "特別なチョコを、入れています。"
"80000117-53-ウミカ" = "……先生、ご存じですか？"
"80000117-54-ウミカ" = "神輿は神様の乗り物だと言われています。"
"80000117-55-ウミカ" = "お祭りが盛り上がる中――"
"80000117-56-ウミカ" = "神様は神輿を通してみんなのもとを訪れて………"
"80000117-57-ウミカ" = "私たちを見守ってくれているんです。"
"80000117-58-ウミカ" = "なので、神輿の中には普通、[ruby=しんもつ]神物[/ruby]を入れておくものですが……"
"80000117-59-ウミカ" = "そうしなかったのは、神輿の神様の役割が……"
"80000117-60-ウミカ" = "先生みたいだな、と思ったからです。"
"80000117-61" = "[s] \"え？私が？\""
"80000117-62-ウミカ" = "は、はい。"
"80000117-63-ウミカ" = "……先生は、いつも私たちを見守ってくれていますから。"
"80000117-64-ウミカ" = "だから、想いを込めたチョコを……"
"80000117-65-ウミカ" = "神物として納めています。"
"80000117-66-ウミカ" = "せっかくですので……"
"80000117-67-ウミカ" = "神輿の屋根を開けて……"
"80000117-68-ウミカ" = "神物のチョコから召し上がっていただいてもいいでしょうか？"
"80000117-69-ウミカ" = "食べる順番に、本当は意味なんてないのかもしれません……"
"80000117-70-ウミカ" = "でも……"
"80000117-71" = "[s5] \"ありがとう。\"\n[s6] \"ちょっと照れるけど、いただくね。\""
"80000117-72-ウミカ" = "はい！"
"80000117-73-ウミカ" = "わ、私はお茶でも淹れてきますので……！"
"80000117-74-ウミカ" = "ごゆっくり召し上がってください！"
"80000117-75-ウミカ" = "し、失礼します……！"
"80000117-76" = "（顔を赤くしたままキッチンに入っていくウミカの背中を見つめながら……）"
"80000117-77" = "（想いが込められた神物のチョコを、ゆっくりと手に取った）"
