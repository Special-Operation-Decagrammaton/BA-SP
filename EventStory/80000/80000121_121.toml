[translation]
"80000121-1" = "鉄砂掌チョコレート"
"80000121-2-レイジョ" = "来てくださりありがとうございます。"
"80000121-3-レイジョ" = "……先生はいつも多忙とお見受けしますが……大丈夫だったのでしょうか？"
"80000121-4" = "[s] \"気にしないで！\""
"80000121-5-レイジョ" = "ありがとうございます。"
"80000121-6-レイジョ" = "……"
"80000121-7-レイジョ" = "……なんと、言いますか。"
"80000121-8-レイジョ" = "先生はもうご存じですよね？"
"80000121-9-レイジョ" = "……こういった行事には、慣れているでしょうから。"
"80000121-10-レイジョ" = "はい、バレンタインのチョコレートを用意したんです。もう他の方からいただいているかもしれませんが……。"
"80000121-11" = "[s1] \"レイジョのチョコが初めてだよ！\"\n[s2] \"うん、そうだよ。\""
"80000121-12-レイジョ" = "そ、そうですか。もっと特別なものをご用意すればよかったかもしれません……"
"80000121-13-レイジョ" = "私からのチョコレートは何でも嬉しいよ、ですか？ "
"80000121-14-レイジョ" = "ありがとうございます。"
"80000121-15-レイジョ" = "微力ながら、少しでも記憶に残るものを、と……用意していました。"
"80000121-16-レイジョ" = "それでは、先生……"
"80000121-17-レイジョ" = "――受け取ってください！"
"80000121-18" = "[ns] \"……拳？\""
"80000121-19-レイジョ" = "はい、この形状は……"
"80000121-20-レイジョ" = "このチョコレートの製法と密接な関わりがあるのです！"
"80000121-21-レイジョ" = "……す、すみません。つい熱く……ご説明しますね。"
"80000121-22-レイジョ" = "……"
"80000121-23-レイジョ" = "先生は「鉄砂掌」についてご存じでしょうか？"
"80000121-24-レイジョ" = "器を砂で満たし、そこに手を突き入れる修練法です。"
"80000121-25-レイジョ" = "最初は砂。次に炒り豆や小石、果ては鉄球まで……練度に応じた硬さのものを器に入れて、突き……"
"80000121-26-レイジョ" = "指と拳を、鋼鉄へ変えていくのです。"
"80000121-27-レイジョ" = "今回は、私らしいチョコレートを考えた結果……"
"80000121-28-レイジョ" = "鉄砂掌を、チョコレート作りに取り入れてみたんです！"
"80000121-29-レイジョ" = "カカオ豆で満たした器に拳を打ち込み――"
"80000121-30-レイジョ" = "チョコレートとして形にする。それが私らしいチョコだな、と！"
"80000121-31" = "[s] \"……つまり、カカオ豆で特訓したってこと？\""
"80000121-32-レイジョ" = "そ、そういうことになりますね。"
"80000121-33-レイジョ" = "どう申し上げればよいのでしょう……。"
"80000121-34-レイジョ" = "そうなったらいいなと思ってやっていたことではあるのですが――"
"80000121-35-レイジョ" = "本当に拳でカカオ豆を粉砕できるとは、思っていませんでした……。"
"80000121-36-レイジョ" = "せっかくなので、そのままチョコレートにしてしまおう！と、"
"80000121-37-レイジョ" = "自分の拳を刻み込んでみたのですが――"
"80000121-38-レイジョ" = "いかがでしょうか……？"
"80000121-39-レイジョ" = "私も、チョコレートも、変わって……いますか？"
"80000121-40" = "[s] \"……。\""
"80000121-41" = "[ns] \"文字通り、レイジョの手作りチョコだね！\""
"80000121-42-レイジョ" = "え、ええ……"
"80000121-43-レイジョ" = "……"
"80000121-44-レイジョ" = "た、確かに……"
"80000121-45-レイジョ" = "先生のおっしゃる通りではありますが……"
"80000121-46-レイジョ" = "改めて言われると……恥ずかしいものですね。"
"80000121-47" = "（レイジョのチョコを……パクパク食べる！）"
"80000121-48-レイジョ" = "せ、先生！？！"
"80000121-49" = "[s] \"これがレイジョの鍛え抜かれた拳……！\""
"80000121-50-レイジョ" = "は、はい！？"
"80000121-51-レイジョ" = "そ、そうだけど、そうではないと言いますか……！"
"80000121-52-レイジョ" = "い、いかがでしたか……！"
"80000121-53-レイジョ" = "先生……？"
"80000121-54-レイジョ" = "私の修練の成果は……？"
"80000121-55" = "[s3] \"最高だよ！\"　\n[s4] \"もっと食べたい！\"　"
"80000121-56-レイジョ" = "ほ、本当ですか！？"
"80000121-57-レイジョ" = "……嘘ではなさそうですね。"
"80000121-58-レイジョ" = "分かりました。"
"80000121-59-レイジョ" = "実は、余分に作っていたんです。"
"80000121-60-レイジョ" = "……私が期待していた反応とは……ちょっと違いましたが……"
"80000121-61-レイジョ" = "……"
"80000121-62-レイジョ" = "ありがとうございます、先生。"
"80000121-63-レイジョ" = "残った分も、思う存分召し上がってください。"
"80000121-64-レイジョ" = "お茶をご用意しますね。"
"80000121-65" = "（レイジョと商会やチョコレート、武術の話で盛り上がり、穏やかな時を過ごした）"
