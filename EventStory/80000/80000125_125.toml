[translation]
"80000125-1" = "プレゼンテーション"
"80000125-2-リオ" = "――バレンタインの本質とは「何」だと思う？"
"80000125-3" = "[s] \"な、なんだろう……。\""
"80000125-4-リオ" = "祝日であり――"
"80000125-5-リオ" = "3人の殉教者が聖人となった日であり――"
"80000125-6-リオ" = "鳥[ruby=つがい]が番を[/ruby]見つける日――"
"80000125-7-リオ" = "でも、現代では製菓会社によって、その意味合いが変質しているわ。"
"80000125-8-リオ" = "身近な者にチョコレートを贈る日と定めたことにより――"
"80000125-9-リオ" = "この時期はチョコを求める者が急増した。結果、企業の増収に繋がっているわね。"
"80000125-10-リオ" = "今ではすっかり、チョコレートを贈る日に……先生も、そう認識しているのでしょう？"
"80000125-11" = "[s] \"リオはどう過ごしてたの？\""
"80000125-12-リオ" = "私は……企業の都合から生まれた祝日に参加するなんて、無意味だと思っていたわ。"
"80000125-13-リオ" = "非合理的ですもの。"
"80000125-14-リオ" = "……そう、今まではね。"
"80000125-15" = "[s] \"今はどうなの……？\""
"80000125-16-リオ" = "……先生を[ruby=ここ]隠れ家[/ruby]に呼んだ理由にも繋がるわね。"
"80000125-17-リオ" = "……。"
"80000125-18-リオ" = "最近、一見非合理的なものにも――"
"80000125-19-リオ" = "隠された合理性があるのではないかと感じているの。"
"80000125-20-リオ" = "どんなものにも、産まれたことに理由があり――"
"80000125-21-リオ" = "いままで見落としてきたとすれば……それを見つけたい。"
"80000125-22-リオ" = "この結論に至るまでに、先生の影響があったことは否定できないわ。"
"80000125-23" = "[s] \"なるほど。それで私を……？\""
"80000125-24-リオ" = "もう分かったのではなくて？この件は先生にも責任があるのよ。"
"80000125-25-リオ" = "今回、バレンタインに贈られるチョコのデータを分析してみたところ……。"
"80000125-26-リオ" = "……。"
"80000125-27-リオ" = "非合理的そのものだったわ。"
"80000125-28-リオ" = "一貫性はなくて当たり前。共通する数値も確認できない。"
"80000125-29-リオ" = "「想いを込めた手作りこそ至高」派――"
"80000125-30-リオ" = "「大企業の高級チョコこそ嬉しい」派――"
"80000125-31-リオ" = "「安物でも、思い出になればいい」派――"
"80000125-32-リオ" = "――「自らをチョコでコーティングし、プレゼントする」派。"
"80000125-33" = "[s] \"最後のは特殊すぎる事例だからね！？\""
"80000125-34-リオ" = "そ、そうかしら？#nつまり――"
"80000125-35-リオ" = "この2月14日は、それぞれが特別な贈り物のために、無我夢中になる日……と理解したわ。"
"80000125-36-リオ" = "そこで、私も、私なりに納得できるチョコを考えてみたの。"
"80000125-37-リオ" = "その一、高級既製品にも、結局は量産品ならではの妥協がある。"
"80000125-38-リオ" = "その二、個人レベルでは、大企業が追求する食品工学に追いつくことはできない。"
"80000125-39-リオ" = "――だから私は、食品工学の観点からアプローチをした、手作りチョコレートを作ると決めたわ。"
"80000125-40-リオ" = "チョコレートは、カカオマスやカカオバター、乳製品、砂糖などをミックスしたもの……。"
"80000125-41-リオ" = "その品質を左右するのは、特に含有量が多い「カカオ」よ。"
"80000125-42-リオ" = "今回は、希少種のクリオロカカオを用意したわ。"
"80000125-43-リオ" = "細かいレシピは、市販の高級チョコレートをリバースエンジニアリングし――"
"80000125-44-リオ" = "私が直接設計した「アバンギャルド君 Type.ショコラティエ」で、全工程を再現。"
"80000125-45-リオ" = "――そこまでは良かったわ。#nでも、味以上に心理的影響が大きい要素があると気付いたの。"
"80000125-46-リオ" = "……チョコレートの形状よ。"
"80000125-47-リオ" = "そこで、思考を重ねていったの……。"
"80000125-48-リオ" = "私は、なぜ今の私になっていったのか。"
"80000125-49-リオ" = "私を示すのに適したものは何か……とね。"
"80000125-50-リオ" = "そうして、このチョコレートが完成した。"
"80000125-51" = "[ns] \"これは……ミレニアムの校章？\""
"80000125-52-リオ" = "そう。"
"80000125-53-リオ" = "ミレニアムサイエンススクールがなければ、今の私はいなかった。"
"80000125-54-リオ" = "想像してみたの。私が他の学園に通っている姿を……。"
"80000125-55-リオ" = "ゲヘナやトリニティ、百鬼夜行、レッドウィンター、山海経、ハイランダー、ワイルドハント、オデュッセイアなど……学園はたくさんあり――"
"80000125-56-リオ" = "それぞれの環境に影響を受けた私になっていたでしょうね。"
"80000125-57-リオ" = "でも、ミレニアムサイエンススクールに入学したからこそ、今の[ruby=つかつき]調月[/ruby]リオがいるの。"
"80000125-58-リオ" = "つまり、このチョコレートは……私そのものといってもいい。"
"80000125-59-リオ" = "だから、この形が最適と考えたわ。"
"80000125-60-リオ" = "一つ一つの可能性を合理的に考察し、導き出した……理性的な回答よ。"
"80000125-61-リオ" = "……。"
"80000125-62-リオ" = "これは……何かしら……？"
"80000125-63" = "[s] \"うん……？\""
"80000125-64-リオ" = "チョコレートの製造は、工学の産物である#n「アバンギャルド君 Type.ショコラティエ」に任せ……。"
"80000125-65-リオ" = "全ての過程は合理的に進行した……はず……。"
"80000125-66" = "[s] \"……？\""
"80000125-67-リオ" = "先生、答えてちょうだい。本当に合理的に製造されたのなら……。"
"80000125-68-リオ" = "そこに感情が入り込む余地など、ないわよね？"
"80000125-69" = "[s] \"まあ……そうだね。\""
"80000125-70-リオ" = "そうよね……。"
"80000125-71-リオ" = "そのはずなのに……。"
"80000125-72-リオ" = "何故か、とても――"
"80000125-73-リオ" = "――「恥ずかしい」と感じているわ。"
"80000125-74-リオ" = "おかしなことだとは思わなくて？"
"80000125-75-リオ" = "感情を徹底的に排したというのに――"
"80000125-76-リオ" = "それでも、感情が生まれてしまった。"
"80000125-77-リオ" = "専門家でも見落とすような、ミクロな領域で起きた出来事ならば理解ができるのだけれど。"
"80000125-78-リオ" = "でも、チョコレート製造の工程において、私が見落とす要素なんてないはず。"
"80000125-79-リオ" = "もしかして、どこかに落ち度が……？"
"80000125-80" = "[s1] \"そんなことないよ。\"\n[s2] \"リオの気持ちが伝わってきて嬉しかった。ありがとう！\""
"80000125-81-リオ" = "……！"
"80000125-82-リオ" = "一体何をしたというの！？"
"80000125-83-リオ" = "お礼を言われたら、さっきの倍以上……恥ずかしく……っ！"
"80000125-84-リオ" = "どういうつもり！？先生！"
"80000125-85" = "[s3] \"お、落ち着いて……\"\n[s4] \"もう一度言うね。ありがとう、リオ。\""
"80000125-86-リオ" = "……っ！"
"80000125-87-リオ" = "……"
"80000125-88-リオ" = "そ、そう思ってもらえたなら……"
"80000125-89-リオ" = "……"
"80000125-90-リオ" = "……嬉しいわ、先生。"
