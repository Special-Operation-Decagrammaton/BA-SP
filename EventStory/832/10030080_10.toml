[translation]
"10030080-1" = "エピローグ;三日坊主"
"10030080-2" = "（年明け1週間後）"
"10030080-3" = "ヴェリタス・休憩室"
"10030080-4-ハレ" = "う……ぐううっ……"
"10030080-5-コタマ" = "ハレ先輩、頑張って！あとちょっと！"
"10030080-6-コタマ" = "もう少し……もう少しで新記録です……！"
"10030080-7-ハレ" = "ううっ…………きた！"
"10030080-8-マキ" = "先輩すごい！前回の記録から10kgも追加したのに、もう成功！？"
"10030080-9-コタマ" = "私も成長したはずですが、まだまだハレさんには追いつけませんね。"
"10030080-10-ハレ" = "そこまで言われると、ちょっと恥ずかしい……"
"10030080-11-ハレ" = "でも……ここ数日トレーニングを頑張ったから。"
"10030080-12-ハレ" = "「筋力」を使う運動なら、ある程度できそうかも。"
"10030080-13-マキ" = "それじゃ今度は「持久力」をメインにしてみよっか……？"
"10030080-14-チヒロ" = "……ただいま。"
"10030080-15-マキ" = "あ、先輩！おかえりー！"
"10030080-16-コタマ" = "久しぶりです、副部長。"
"10030080-17-ハレ" = "部室で会うのは元旦ぶりだよね？何してたの？"
"10030080-18-チヒロ" = "うん。セキュリティ顧問を引き受けてる企業から新年会に誘われて、あちこち行ってたんだ。"
"10030080-19-チヒロ" = "挨拶回りが忙しくて、声が枯れた気がする……"
"10030080-20-マキ" = "先輩、ちょっと無理しすぎじゃない……？"
"10030080-21-コタマ" = "仕事なら別の依頼も見つかりますが、一度失った健康はそう簡単に取り戻せません。"
"10030080-22-ハレ" = "……来週は少し休んだら？"
"10030080-23-チヒロ" = "そうだね……休息は大事だし。"
"10030080-24-チヒロ" = "でも、大事な時期に外部の活動を休むわけにはいかないから。心配してくれてありがとう。"
"10030080-25-チヒロ" = "そういえば、あんた達はここ最近何してたの？"
"10030080-26-チヒロ" = "さっき部室の外まで聞こえてきたんだけど、何か運動の話をしてなかった？"
"10030080-27-チヒロ" = "前までは部室から出ようとすらしなかったのに、自分たちから運動の話をするなんて……キャンプに連れて行った成果かと思ったら嬉しくなったよ。"
"10030080-28-ハレ" = "あ、それは……"
"10030080-29-コタマ" = "たしかに運動の計画、とも言えますが……"
"10030080-30-マキ" = "「フィットネス・シミュレーター」の育成モードをやってたの！"
"10030080-31-チヒロ" = "……ん？"
"10030080-32-マキ" = "あ、先輩は「フィットネス・シミュレーター」知らない？#n出たばかりのゲームだよ。"
"10030080-33-マキ" = "ゲームの中で選手になって、いろんな身体能力を鍛えるゲーム！#n現実のトレーニングをリアルに体験できるから話題になったの！"
"10030080-34-マキ" = "ただ、1周目で育てられる選手のステータスに上限があって……"
"10030080-35-マキ" = "高ステータスの選手を手に入れるためには、周回しないといけないんだよね。"
"10030080-36-チヒロ" = "つまり、さっき言ってた「筋力」とか「持久力」は現実の話じゃなくて……"
"10030080-37-チヒロ" = "……ゲームのキャラクターの話？"
"10030080-38-マキ" = "うん！"
"10030080-39-チヒロ" = "念のため聞くけど……"
"10030080-40-チヒロ" = "あんた達、最後に部室を出たのはいつ？"
"10030080-41-コタマ" = "昨日……いや、一昨日かな？"
"10030080-42-コタマ" = "もっと前です。元旦に戻ってきてから外には出ていません。"
"10030080-43-マキ" = "「フィットネス・シミュレーター」の育成モードはクリアに3日以上かかるって言うし、仕方ないよね。"
"10030080-44-チヒロ" = "……来週の予定は？"
"10030080-45-マキ" = "あ、来週はレトロゲーム「BOOM」シリーズのリブート作、「BOOMエターナル」が発売されるよ。"
"10030080-46-マキ" = "キヴォトスで最も熱い新作！#n真理を追求するヴェリタスのメンバーとして、レビューせずにはいられない！"
"10030080-47-コタマ" = "そういえば、「BOOMエターナル」のプレイ動画をSNSにアップすれば、「妖怪MAX」の限定商品が当たるって見たような……"
"10030080-48-コタマ" = "発売最速クリアRTAをするチャンスです。"
"10030080-49-マキ" = "チヒロ先輩もどう？#nリリース当日にオールで――"
"10030080-50-チヒロ" = "あんた達…………"
"10030080-51-チヒロ" = "もう一度お説教が必要みたいだね！？"
"10030080-52-マキ" = "うわ～ん！ごめんなさい～！！"
"10030080-53" = "（電脳）新春行進曲"
