[translation]
"10030030-1" = "第3話;退屈はハッカーをも殺す"
"10030030-2-チヒロ" = "……あれ、今って何時だろ。"
"10030030-3-チヒロ" = "本に集中しすぎて時間を忘れてた……"
"10030030-4-チヒロ" = "先生はどう？退屈じゃなかった？"
"10030030-5" = "[s1] \"おかげで久しぶりにゆっくりできたよ。\"\n[s2] \"じっくり読書ができて楽しかったよ。\""
"10030030-6-チヒロ" = "それなら良かった。#n場所が変わるだけで、集中力は変わるって言うし。"
"10030030-7-チヒロ" = "こういう環境は、読書やプログラミングにピッタリだね。"
"10030030-8-チヒロ" = "今回は電子機器を置いてきちゃったけど、今度はオフラインで進められる作業をするのも良さそう。"
"10030030-9-チヒロ" = "……そういえば、みんなちゃんと休めてるかな？"
"10030030-10-チヒロ" = "……ん？どこ行っちゃったんだろ。"
"10030030-11" = "[s] \"近くを散策でもしてるんじゃない？\""
"10030030-12-チヒロ" = "そう……まぁ、そんなに遠くには行かないか。"
"10030030-13-チヒロ" = "……どっかで変なイタズラでもしてないといいけど。"
"10030030-14-チヒロ" = "先生、ちょっと探しに行ってみない？"
"10030030-15-チヒロ" = "たぶん、近くに居ると思うし。"
"10030030-16" = "[s3] \"さすがチヒロ、冷静だね。\"\n[s4] \"うん、一緒に行こう。\""
"10030030-17" = "（しばらくして……）"
"10030030-18-ハレ" = "これは違う……あれでもない……"
"10030030-19-チヒロ" = "……ここで何してるの、ハレ？"
"10030030-20-ハレ" = "あ、先輩。"
"10030030-21-ハレ" = "ちょっと草を探してて……"
"10030030-22-チヒロ" = "ん？四つ葉のクローバーでも探してるの？"
"10030030-23-チヒロ" = "息抜きにはいいかもしれないけど、この辺にクローバーって生えてたかな……"
"10030030-24-ハレ" = "いや、クローバーじゃなくて……"
"10030030-25-ハレ" = "……エナジードリンクと似た味がする草を探してたの。"
"10030030-26-チヒロ" = "……え？"
"10030030-27-チヒロ" = "なに言ってるの、エナドリ味の草なんて存在しないでしょ。"
"10030030-28-ハレ" = "ううん。例えばこの草は少し苦味があるけど甘さもしっかりあって、口に含むと舌がピリッと……"
"10030030-29-ハレ" = "まるでエナドリのような刺激が……"
"10030030-30-チヒロ" = "それ、アレルギー反応じゃないの！？"
"10030030-31-チヒロ" = "ハレ、ちょっとそれ止めて！危ない。"
"10030030-32-ハレ" = "でも……ジッとしてると手足が震えるの……もう、耐えられない……"
"10030030-33-ハレ" = "カフェインが……カフェインが足りない……"
"10030030-34-チヒロ" = "これは……カフェインの離脱症状……？"
"10030030-35-チヒロ" = "どうしよう、近くにコンビニなんてないのに……"
"10030030-36" = "[ns5] \"来る途中で買ったコーヒーが水筒に残ってるんだけど……\"\n[ns6] \"これでも良かったら飲む？\""
"10030030-37-ハレ" = "……うん。"
"10030030-38-ハレ" = "ふぅ……生き返った。"
"10030030-39-ハレ" = "エナドリほどではないけど、カフェインを摂取できて少し元気になった。"
"10030030-40-ハレ" = "ありがとう先生、助かったよ。"
"10030030-41-ハレ" = "もう少しで、危ない草に手を出すところだった……"
"10030030-42" = "[s7] \"役に立てたみたいで良かったけど……\"\n[s8] \"その言い方は誤解を招くからね！？\""
"10030030-43-チヒロ" = "たった半日で離脱症状が出るなんて……普段から飲む量を減らしたら？"
"10030030-44-ハレ" = "なに言ってるの、エナドリはハッカーの燃料だよ！？"
"10030030-45-ハレ" = "食事しなくても徹夜はできるけど、エナドリ無しじゃ1行もコードなんて書けないよ！"
"10030030-46-ハレ" = "次のキャンプは、粉末タイプのエナドリを持ってこよう……"
"10030030-47-チヒロ" = "あれ、またキャンプに行くの？"
"10030030-48-チヒロ" = "てっきり、もう嫌気が差したかと思ってたけど……そうじゃないなら良かった。"
"10030030-49-チヒロ" = "またそのうち、みんなでキャンプの予定を立てようか。"
"10030030-50-ハレ" = "うっ……"
"10030030-51-チヒロ" = "あ、そうだ。マキとコタマは？一緒じゃないの？"
"10030030-52-ハレ" = "コタマ先輩は分からないけど……"
"10030030-53-ハレ" = "マキなら、あっちの洞窟に向かってたよ。"
"10030030-54-ハレ" = "岩を見て、何かひらめいたって言ってた。"
"10030030-55-チヒロ" = "……ひらめいた？"
"10030030-56" = "[s] \"洞窟ってことは……彫刻かな？\""
"10030030-57-チヒロ" = "でも、そんな道具はバッグに入ってなかったはずだけど……"
"10030030-58-チヒロ" = "……まあ、見に行ってみようか。"
"10030030-59-マキ" = "んー、この色じゃなくて、もっとこう……"
"10030030-60-マキ" = "スプレーさえあれば……#nいや、ここは赤だけでも……"
"10030030-61-チヒロ" = "……何してるの、マキ？"
"10030030-62-マキ" = "あ、チヒロ先輩。"
"10030030-63-マキ" = "えっと……思った通りの色が作れなくて。"
"10030030-64-チヒロ" = "……色？今日は何を描いてるの？"
"10030030-65-マキ" = "そう、これ見て！まだ途中なんだけど――"
"10030030-66-マキ" = "洞窟壁画！"
"10030030-67-チヒロ" = "なっ、これは……"
"10030030-68-チヒロ" = "すごい……どうやって描いたの？"
"10030030-69-マキ" = "絵の具の代わりに粘土と炭の粉を混ぜて、顔料を作ってみたの。"
"10030030-70-マキ" = "昔はこうやって壁画を描いてたってネットで見たから、真似してみたんだけど……#n思ったより難しいね。"
"10030030-71" = "[s9] \"たしかに、すごい出来だとは思うけど……\"\n[s10] \"……どうして壁画を？\""
"10030030-72-マキ" = "えっとね……電波の入る場所を探して歩いてたら、いきなりパッ！ってインスピレーションが湧いたんだ！"
"10030030-73-マキ" = "えっとね……電波の入る場所を探して歩いてたら、いきなりパッ！ってインスピレーションが湧いたんだ！"
"10030030-74-マキ" = "でも、紙もキャンバスも無いし……"
"10030030-75-マキ" = "かといって、燃え上がる芸術魂は抑えられなくて…"
"10030030-76-マキ" = "だから、洞窟をキャンバス代わりに描いたってわけ！"
"10030030-77-チヒロ" = "なるほどね……"
"10030030-78-チヒロ" = "ここに来てまでグラフィティを描かなきゃダメだったの？"
"10030030-79-マキ" = "あ！これはグラフィティじゃないよ！？#nグラフィティは、解放的な場所で行なわれるストリートアートの1つだから！"
"10030030-80-マキ" = "それに持ち主が存在する街の壁と違って、洞窟の壁ならいくら絵を描いても困る人は居ないでしょ？"
"10030030-81-チヒロ" = "居るから！"
"10030030-82-チヒロ" = "たとえば……この壁画を本当に遺跡だと思い込んで調査しちゃう人が居たらどうするの。"
"10030030-83-マキ" = "まっさかぁ～、そんなの居ないって！"
"10030030-84" = "[s] \"真ん中に描かれてる大きいのは……？\""
"10030030-85-マキ" = "あ、それは立体主義的に再構築したミレニアムタワー！"
"10030030-86-マキ" = "理論と論証を重視するミレニアムのイメージをうまく表現できるように、タワーを幾何学的な模様で表現してみたんだ。"
"10030030-87" = "[s] \"じゃあ、この周りの蟻みたいなのは……\""
"10030030-88-マキ" = "それは昼食後のミレニアム生。"
"10030030-89-マキ" = "みんなコーヒーを買おうとカフェに集まるから、いつもすごいことになってるの……"
"10030030-90" = "[s] \"タワーの上に立ってるツノの生えた生物は……？\""
"10030030-91-マキ" = "それは……セミナーで領収書の処理をするユウカ先輩。"
"10030030-92-マキ" = "……ちょっと不気味な感じになっちゃったね。"
"10030030-93-チヒロ" = "こんなとこでまでユウカに意地悪しないの。"
"10030030-94-チヒロ" = "マキは何の恨みがあって、いつもユウカにイタズラを……"
"10030030-95-マキ" = "イタズラじゃなくて、真面目な芸術活動だってば～！！"
"10030030-96-チヒロ" = "はぁ……コタマがどこに行ったか知らない？"
"10030030-97-チヒロ" = "さっきハレにも聞いたけど、知らないみたいで。"
"10030030-98-マキ" = "あ、コタマ先輩なら……"
"10030030-99-マキ" = "森に用があるって言って、あっちの方に行ったよ。"
"10030030-100-チヒロ" = "一人で森に……？"
"10030030-101" = "[s] \"どうしたの？\""
"10030030-102-チヒロ" = "んー杞憂かもしれないけど、この時期は食べ物を探しに動物がキャンプ場まで来たりするから……"
"10030030-103-チヒロ" = "もしかしたら、クマに遭遇するかも。"
"10030030-104" = "[s] \"大変だ……！\""
"10030030-105-チヒロ" = "コタマはなにかに集中してると、周囲への注意が散漫になっちゃうし……"
"10030030-106-チヒロ" = "早く探しに行こう。"
"10030030-107-チヒロ" = "あ、マキ！戻る前にちゃんと壁画を消してね。"
"10030030-108-マキ" = "あっ、チヒロ先輩！待ってよ～！"
