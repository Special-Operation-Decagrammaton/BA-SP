[translation]
"10044020-1" = "第2話;消えた列車を追って"
"10044020-2-ノゾミ" = "勝手に発車しちゃったの？システムの誤作動で？"
"10044020-3-駅員A" = "は、はい……。#n一応、乗務員室の権限で制御はできるのですが――"
"10044020-4-アオバ" = "い、今、乗務員室には誰もいないんですけど……。"
"10044020-5-ノゾミ" = "なんでこっち見るのさ。"
"10044020-6-アオバ" = "あ、遊んでなければ、こんなことにはならなかったのに……。"
"10044020-7-ノゾミ" = "悩んでても始まらないし！追いかけるよ！"
"10044020-8-ヒカリ" = "イレギュラー発生ー。"
"10044020-9-アオバ" = "ま、まずは路線図を確認して――"
"10044020-10-駅員A" = "今からなら、地下鉄に乗ったほうが早いですよ。"
"10044020-11-ノゾミ" = "おっけ。急ぐよ。"
"10044020-12-ヒカリ" = "地下鉄ーめんどくさーい……。"
"10044020-13-ノゾミ" = "――てなわけでさ。"
"10044020-14" = "[ns1] \"なるほど。\"\n[ns2] \"だいたい状況は分かったよ。\""
"10044020-15-アオバ" = "あ、あなたは……もしかして、シャーレの先生ですか！？"
"10044020-16-アオバ" = "な、なんで先生がここに……？"
"10044020-17-ヒカリ" = "ヒカリが呼んだー。"
"10044020-18-アオバ" = "どうして！？"
"10044020-19-ヒカリ" = "困ったら呼んでいいって言われたからー？"
"10044020-20-アオバ" = "そ、そんなの社交辞令だと思いますけど……！？"
"10044020-21-アオバ" = "えっ……わ、私に……何か……？"
"10044020-22-アオバ" = "あっ、え、えと……貨物輸送管理部2年、[ruby=うつみ]内海[/ruby]アオバ、です……。"
"10044020-23" = "[s] \"よろしく、アオバ。\""
"10044020-24-アオバ" = "よ、よろしくはしなくても……いいですけど……。"
"10044020-25-ノゾミ" = "え？2年生だったの？"
"10044020-26-アオバ" = "は、はい……お二人は1年生ですよね？"
"10044020-27-ヒカリ" = "アオバが先輩ー？"
"10044020-28-アオバ" = "い、いまさら先輩扱いされたいとも思ってないですけど……。"
"10044020-29-アオバ" = "そもそも期待してないし……。"
"10044020-30-ノゾミ" = "おっ、来た来た！乗り込めー！"
"10044020-31-ヒカリ" = "ほいー。"
"10044020-32-アオバ" = "はぁ、どうして私がこんな連中と一緒に……。"
"10044020-33-ヒカリ" = "うおー、ゆれるゆれるー。"
"10044020-34-ノゾミ" = "地下鉄ならこんなもんでしょ。ま、しゃーないしゃーない。"
"10044020-35-アオバ" = "そ、そういうのはよくないと思うんですけど……。"
"10044020-36-ヒカリ" = "どういうのー？"
"10044020-37-アオバ" = "わ、悪口は言わないほうが……。#nは、ハイランダーの制服を着ているんですし……。"
"10044020-38-ノゾミ" = "なんで？事実っしょ？"
"10044020-39-アオバ" = "じ、事実だとしても……。"
"10044020-40-アオバ" = "[ruby=時と場所と場合]TPO[/ruby]ってあるじゃないですか……。"
"10044020-41-ノゾミ" = "難しいこと考えて大変だね。"
"10044020-42-アオバ" = "なんでこんなのが幹部をやれてるんだろ……。"
"10044020-43-ノゾミ" = "そんなことより、後のことを考えなきゃ。"
"10044020-44-ノゾミ" = "どうやって言い訳する？"
"10044020-45-ヒカリ" = "時間通りならー問題ないかなー？"
"10044020-46-ノゾミ" = "パヒャヒャッ！たしかに！パパッとリカバリーしちゃおっか。"
"10044020-47-スケバンA" = "おい、あれ見ろよ。"
"10044020-48-スケバンC" = "ん？ハイランダーの連中じゃん。"
"10044020-49-スケバンB" = "そういやこの前、運賃を値上げしたんだっけ。いい迷惑だぜ……。"
"10044020-50-スケバンA" = "勝手なことされると参っちゃうよな。#nま、うちらは金払ってないからいいけどよ。"
"10044020-51-スケバンC" = "つーか、地下鉄ってハイランダーなんだっけ？"
"10044020-52-スケバンB" = "列車も地下鉄も似たようなもんだろ？"
"10044020-53-スケバンA" = "関係ないね。どうせ金持ってんだろうし、ちょっとくらい分けてもらおうぜ。"
"10044020-54-ノゾミ" = "つり革体操ー、インフィニティ・スパイラル・スピンー。"
"10044020-55-ノゾミ" = "パヒャヒャッ、10点！10点！10点！"
"10044020-56" = "[ns3] \"ヒカリ、つり革にぶら下がるのはやめようか。\"\n[ns4] \"ノゾミも、あまり大声は出さないでね。\""
"10044020-57-ヒカリ" = "はーい。"
"10044020-58-ノゾミ" = "ごめんなさーい。"
"10044020-59-アオバ" = "せ、先生の言うことは素直に聞くんですね……。"
"10044020-60-アオバ" = "あ、あの……すべての幹部がこうってわけじゃないので……。#nは、ハイランダーのこと、誤解しないでくださいね……。"
"10044020-61" = "[s] \"今は私がついているから大丈夫だよ。\""
"10044020-62-アオバ" = "はい……。#nうぅ……こっちまで恥ずかしくなってくるんですけど……。"
"10044020-63-スケバンA" = "おい、ハイランダー！"
"10044020-64-スケバンB" = "お前ら、地下鉄の運賃を上げたんだってな？"
"10044020-65-スケバンB" = "うちらみてぇな貧乏人は乗るなって言いてぇのか？あぁん？"
"10044020-66-ノゾミ" = "地下鉄は私らの所管じゃないよ？"
"10044020-67-スケバンC" = "え……あ、そうなの？"
"10044020-68-スケバンA" = "所管じゃないからなんだってんだ！"
"10044020-69-スケバンA" = "お前らだって列車走らせるだけで金とってるじゃねぇか。#n代わりに責任取れっつってんだよ！"
"10044020-70-アオバ" = "い、言いがかり過ぎるんですけど……。"
"10044020-71-スケバンB" = "とにかく、そのなんだ……？イシャキン……？ってもんをよこせ！"
"10044020-72-ヒカリ" = "慰謝料のことー？"
"10044020-73-スケバンC" = "それだ、それ！バイショーしろ、バイショウ！"
"10044020-74-スケバンB" = "てか、お前今うちらのこと馬鹿にした？"
"10044020-75-スケバンB" = "こりゃ「イシャキン」追加だぜ～。"
"10044020-76-ノゾミ" = "ノゾミ、お金あるー？"
"10044020-77-ノゾミ" = "ううん？運賃も先生が出してくれたじゃん。"
"10044020-78-ヒカリ" = "ヒカリたちもーびんぼー。"
"10044020-79-スケバンA" = "おい、んなこと通じると思ってんのか？"
"10044020-80-スケバンB" = "金がねぇなら弾でもよこせ！"
"10044020-81" = "[ns] \"みんな、ちょっと落ち着こうか……。\""
"10044020-82-スケバンC" = "あん？大人ぁ？"
"10044020-83-スケバンB" = "ちょうどいい。大人なら金もあんだろ？お前が払ってくれてもいいんだぜ？"
"10044020-84" = "[s5] \"私もお金に余裕があるわけじゃないんだけど……。\"\n[s6] \"とりあえず、落ち着いて話を……！\""
"10044020-85-スケバンC" = "話して解決するわけねぇだろ！？"
"10044020-86-スケバンB" = "うちらだってこんなことしたくないんだよ！"
"10044020-87-スケバンB" = "でも勉強は嫌いだし、金もない！もう喧嘩以外やることないんだぜ！？"
"10044020-88-ヒカリ" = "成績悪いのにー性格も悪いのー？"
"10044020-89-スケバンA" = "あぁん！？ナメてんのか！？"
"10044020-90-アオバ" = "わ、私も、その気持ち分かります……。"
"10044020-91-スケバンA" = "あぁん？"
"10044020-92-アオバ" = "わ、私も古典のテスト、毎回赤点なので……よく分かります。"
"10044020-93-スケバンC" = "なんだ、お前も勉強できねぇのか。そんで？"
"10044020-94-アオバ" = "で、でも……勉強がイヤで逃げたのは、ご自身の選択ですよね……？"
"10044020-95-アオバ" = "なら、そ、その結果も、素直に受け入れるべきでは……？"
"10044020-96-スケバンA" = "はぁ！？なんでだよ！？"
"10044020-97-スケバンB" = "なんでそんなこと言うんだよ。ちょっとくらい優しくしてくれたっていいじゃねぇか！"
"10044020-98-アオバ" = "ど、どうしてですか……？"
"10044020-99-スケバンB" = "……そりゃ、誰だって優しくされてぇだろ？"
"10044020-100-アオバ" = "あ、頭お花畑なんですね……。#nせ、世界はもともと冷たくて酷いんですけど……。"
"10044020-101-アオバ" = "だ、誰も責任なんて取ってくれやしないのに、どうして人任せでいられるんですか……？"
"10044020-102-スケバンA" = "だ、だって！う、うちらだって愛されたいんだぜ！？"
"10044020-103-アオバ" = "ふ、ふふ……期待をするから、失望するんです……。#nお、お馬鹿さん、ですね……。"
"10044020-104-アオバ" = "だ、誰だって……傷つくのは嫌じゃないですか……。"
"10044020-105-アオバ" = "き、期待しなければ、傷つくこともないのに……ふふふ……。"
"10044020-106-スケバンB" = "こ、こいつ……。"
"10044020-107-スケバンC" = "なんか……もういいか。"
"10044020-108-スケバンA" = "い、行くぞ……！"
"10044020-109-ノゾミ" = "よく撃退したね！#nすっごいマイナスオーラじゃん！"
"10044020-110-アオバ" = "ふ、普通だと思うんですけど……？"
"10044020-111-ヒカリ" = "生きてて楽しくないのー？"
"10044020-112-アオバ" = "え……？生きるのに……楽しさって要ります……？"
"10044020-113-アオバ" = "もっっっちろん！！楽しくないなら、やる必要も、理由もないじゃん？"
"10044020-114-ヒカリ" = "あぐりー。"
"10044020-115" = "[ns7] \"人生は、人それぞれだからね。\"\n[ns8] \"アオバが、少しでも未来に期待できるようになるといいね。\""
"10044020-116-アオバ" = "き、期待しないで……おきます……。"
"10044020-117-アオバ" = "あ、ここです。"
"10044020-118-ノゾミ" = "大人しく待っててくれよ～？"
"10044020-119-ヒカリ" = "うぉー、ロストトレインー。"
"10044020-120" = "[ns] \"行こう、アオバ。\""
"10044020-121-アオバ" = "は、はい……。"
