[translation]
"10044010-1" = "第1話;嵐の前の騒がしさ"
"10044010-2" = "[log]数時間前……[/log]"
"10044010-3-ノゾミ" = "――というわけで、お前たちを呼んだ。"
"10044010-4-ノゾミ" = "なんだ、ただの貨物輸送じゃん。"
"10044010-5-ヒカリ" = "つまんなーい。"
"10044010-6-ノゾミ" = "重要な任務だと言ったはずだ。#nもう一度説明が必要か？"
"10044010-7-ノゾミ" = "いーよ別に。どうせやることは一緒だし。"
"10044010-8-ヒカリ" = "運ぶだけー。"
"10044010-9-ノゾミ" = "はぁ……どのみち、他に対応できる者もいないしな……。"
"10044010-10-ノゾミ" = "整備士を一人サポートにつける。#nお前らは運転に集中してくれ。"
"10044010-11-ノゾミ" = "いいか？時間通り、安全に、貨物を目的地まで――"
"10044010-12-ノゾミ" = "はいはい、分かってるって。"
"10044010-13-ヒカリ" = "あさめしまえー。"
"10044010-14-ノゾミ" = "お前たち、もっと真面目に――"
"10044010-15-ノゾミ" = "話長すぎ！#nヒカリ、行こ行こ。"
"10044010-16-ヒカリ" = "おぉーしゅっぱーつ。"
"10044010-17-？？？" = "クククッ。これはこれは……頼もしい方々のようだ。"
"10044010-18-？？？" = "お恥ずかしい限りです。#nあれでも力量はたしかですので……。"
"10044010-19-？？？" = "むしろ、こういう任務には適しているのかもしれませんな。"
"10044010-20-？？？" = "ご依頼の遂行に関しては、ご心配なく。"
"10044010-21-？？？" = "ええ、もちろん。そうでなくては。ククッ……。"
"10044010-22" = "貨物列車出発駅"
"10044010-23-ノゾミ" = "これで運ぶの？やっぱいつもと同じじゃん。"
"10044010-24-ヒカリ" = "重要任務っぽくしとくー？ステッカー貼るとかー。"
"10044010-25-ノゾミ" = "パヒャヒャッ！逆に目立って、色んなやつらに狙われるかも？"
"10044010-26-ノゾミ" = "面白そうだし、今度やってみよっか！"
"10044010-27-？？？" = "あ、あのぉ……。"
"10044010-28-？？？" = "し、CCCの幹部がここにいるって聞いてきたんですけど……。"
"10044010-29-ノゾミ" = "私らに何か用？"
"10044010-30-ヒカリ" = "だーれ？"
"10044010-31-？？？" = "あ、よかった。えへへ……。"
"10044010-32-アオバ" = "わ、私は……[ruby=うつみ]内海[/ruby]アオバです……。"
"10044010-33-アオバ" = "せ、整備士で……事務局から連絡があったはずなんですけど……。"
"10044010-34-ノゾミ" = "あー、なんかそんなこと言ってたね。"
"10044010-35-ヒカリ" = "ニューフェイスー。"
"10044010-36-ノゾミ" = "列車のことは任せたよ。#nトラブったら、私らじゃ対処できないし！パヒャヒャッ！"
"10044010-37-アオバ" = "う、運転だけが取り柄で、運よく幹部になったというのは本当なんですね……。"
"10044010-38-ノゾミ" = "……ん？"
"10044010-39-アオバ" = "う、運を転がすのが上手なんだな……って……。"
"10044010-40-ノゾミ" = "や、なんか違うこと言ってたっしょ……。"
"10044010-41-アオバ" = "お、お二人は運転に集中してもらえたら……後はお任せください。"
"10044010-42-ノゾミ" = "んー……まあいっか。"
"10044010-43-ヒカリ" = "ヒカリは、ヒカリー。#nノゾミが、ノゾミー。"
"10044010-44-アオバ" = "あ、はい……よろしくお願いします……。"
"10044010-45-アオバ" = "そ、それにしても、幹部でも現場に出るんですね……#n現場の事なんて何も分かってないと思ってましたけど……。"
"10044010-46-ノゾミ" = "もちろん！現場は知ってるし――#nあれ……？それ、褒めてなくね？"
"10044010-47-アオバ" = "――な、なんちゃってぇ……へへ……。"
"10044010-48-ノゾミ" = "もうちょっとごまかし方あるだろ！？"
"10044010-49-ヒカリ" = "許さぬー、くらえー。"
"10044010-50-ヒカリ" = "うおおー！"
"10044010-51-ヒカリ" = "いたっ――"
"10044010-52-アオバ" = "――くない？ち、力弱すぎませんか……？"
"10044010-53-ヒカリ" = "ガスけつーぱわーだせないー。"
"10044010-54-ノゾミ" = "出発まで暇だし、駅員室借りよっか。"
"10044010-55-ノゾミ" = "待ちながら……アレ、頼んじゃう？"
"10044010-56-ヒカリ" = "ペパロニピザー。"
"10044010-57-ノゾミ" = "パヒャヒャッ！やっぱ仕事前にはピザだよね！"
"10044010-58-アオバ" = "ま、待ってください。勝手に入ったら……。"
"10044010-59-ノゾミ" = "なんで？"
"10044010-60-アオバ" = "きゅ、急に幹部が来たら……え、駅員さん、困っちゃうと思うんですけど……。"
"10044010-61-ノゾミ" = "そんなことなくない？"
"10044010-62-アオバ" = "え……ふ、普通に気まずいですけど……。"
"10044010-63-ヒカリ" = "ノープロブレムー。"
"10044010-64-ノゾミ" = "そうそう。私ら気にしないし。"
"10044010-65-アオバ" = "そ、それはそっち側だから言えることで……。"
"10044010-66-ノゾミ" = "気にしすぎ気にしすぎ！"
"10044010-67-アオバ" = "……。"
"10044010-68-アオバ" = "はぁ……これだから幹部は……。"
"10044010-69-駅員A" = "なんかシステムの調子おかしくない？"
"10044010-70-駅員B" = "どうしたの？"
"10044010-71-駅員A" = "自動発車システムが、さっきからずっと発車信号を送ってるの。"
"10044010-72-駅員B" = "まあ……運転手がコントロールできるし、大丈夫でしょ。"
"10044010-73-駅員A" = "そうなんだけど、なんか気になっちゃって。"
"10044010-74-駅員B" = "いいって。私たちでどうにかできる事でもないし。"
"10044010-75-駅員A" = "まあ、そうだね。"
"10044010-76-ヒカリ" = "ヒカリー、とーじょー。"
"10044010-77-ヒカリ" = "えっ！？こっ、困ります！ここは関係者以外――"
"10044010-78-ノゾミ" = "CCCだよ。邪魔するね～！"
"10044010-79-駅員B" = "CCC！？どっ、どういったご用件で――"
"10044010-80-駅員A" = "ま、まさか、抜き打ち検査！？"
"10044010-81-ノゾミ" = "あぁ～気にしないで。暇つぶしに来ただけだからさ。"
"10044010-82-ノゾミ" = "パヒャヒャッ。このソファ、ちょっと借りるよ？"
"10044010-83-ヒカリ" = "ハイパーダイブー。"
"10044010-84-駅員B" = "え……？あ、はい……。"
"10044010-85-アオバ" = "なんか、すみません……。"
"10044010-86-駅員A" = "いえ、ちょっとビックリしましたけど……ごゆっくりどうぞ……。"
"10044010-87-アオバ" = "すみません……って、私のせいではないんですけど……。"
"10044010-88-駅員A" = "なんで急に来るかな……。"
"10044010-89-駅員B" = "うぅ、お腹痛くなってきたかも……。"
"10044010-90-駅員A" = "気にしないでって言われてもねぇ……。"
"10044010-91-駅員B" = "はぁ……早く帰ってくんないかな……。"
"10044010-92-駅員A" = "あー、そういえばどっかの駅はクロノスが取材に来てるんだっけ。"
"10044010-93-駅員B" = "うわ……急いで掃除とかやってそう……。"
"10044010-94-駅員A" = "それに比べりゃマシかぁ……。"
"10044010-95" = "10分後……"
"10044010-96-ヒカリ" = "ピザ来たー。"
"10044010-97-ノゾミ" = "もう？爆速だね。パヒャッ！"
"10044010-98-駅員A" = "え、ピザ……？"
"10044010-99-配達員" = "ピザの配達にあがりましたー。"
"10044010-100-ヒカリ" = "こっちー。"
"10044010-101-配達員" = "こちらがご注文の……ペパロニピザのLサイズと、コーラです。"
"10044010-102-配達員" = "どうも、ありがとうございましたー。"
"10044010-103-ヒカリ" = "そんじゃ早速――"
"10044010-104-ヒカリ" = "――って。"
"10044010-105-ヒカリ" = "ちょい待ち！"
"10044010-106-配達員" = "はい？"
"10044010-107-ノゾミ" = "これ！どういうこと！？"
"10044010-108-ノゾミ" = "どう運んだらこうなるわけ！？"
"10044010-109-ヒカリ" = "ぐちゃぐちゃー。"
"10044010-110-配達員" = "腹に入れば同じだろ？細かいことぐだぐだ言ってんじゃねぇよ。"
"10044010-111-ノゾミ" = "は？"
"10044010-112-配達員" = "つーか早く届けてやったんだから感謝して欲しいくらいだぜ。"
"10044010-113-配達員" = "デリバリーは早さが命！待ち時間はお客様の損失だからな！"
"10044010-114-ノゾミ" = "いや、それ以前の問題でしょ。ヒカリ、お店に電話して！"
"10044010-115-ヒカリ" = "うおおー、無限コールスタートー。"
"10044010-116-配達員" = "は？ごちゃごちゃ言ってねぇで早く食えよ！冷めちまうじゃねぇか！"
"10044010-117-アオバ" = "も、問題起こさないで欲しいんですけど……。"
"10044010-118-駅員A" = "ああ……駅員室がめちゃくちゃに……。"
"10044010-119-配達員" = "はっ！喧嘩を売る相手は選ぶべきだったな！#n道路の支配者が誰なのか……思い知らせてやるよ！"
"10044010-120-ノゾミ" = "ばーか！私らはハイランダー！道路なんて使わないっての！"
"10044010-121-配達員" = "なっ……！#nブロロロ疾走連合として、この借りは絶対に返してやるからな！"
"10044010-122-配達員" = "覚えてやがれよ……！"
"10044010-123-ノゾミ" = "はぁ……しょーもな。"
"10044010-124-ヒカリ" = "空腹値100％……1秒ごとに5億のダメージ……。"
"10044010-125-ノゾミ" = "ちゃんとしたの持ってきてくれるみたいだし、もうちょっと我慢だね。"
"10044010-126-アオバ" = "こ、これが幹部のやり方……。"
"10044010-127-アオバ" = "そ、それより、あれ大丈夫なんですか……？#nぼ、暴走族に目をつけられたんですけど……。"
"10044010-128-ノゾミ" = "関係ないっしょ。どうせ私らは列車移動だし。"
"10044010-129-アオバ" = "あ、いえ……お二人のことじゃなくて……私の心配なんですけど……。"
"10044010-130-アオバ" = "っていうか、私がお二人のこと心配するわけないじゃないですか……。"
"10044010-131-ノゾミ" = "ヒカリ、アタック！"
"10044010-132-ヒカリ" = "むーりー、はらへりー。"
"10044010-133" = "（時は流れ……）"
"10044010-134-ヒカリ" = "充電かんりょー。"
"10044010-135-ノゾミ" = "そろそろ行こっか。"
"10044010-136-駅員A" = "あっ！出発されるのですね！"
"10044010-137-アオバ" = "ほんと自由気ままですね……。#n付き合わされる方の身にもなってほしいんですけど。"
"10044010-138-ノゾミ" = "じゃあね～！"
"10044010-139-ヒカリ" = "アディオース。"
"10044010-140-アオバ" = "ご、ご迷惑をおかけしました……！"
"10044010-141-駅員B" = "ははは……はい……どうも……。"
"10044010-142-駅員B" = "ふぅ……やっと行ったね……。"
"10044010-143-駅員A" = "だね……。"
"10044010-144-アオバ" = "ま、まずは点検から始めますので……。"
"10044010-145-ノゾミ" = "ちゃっちゃとよろしくね～"
"10044010-146-ノゾミ" = "あれ？"
"10044010-147-アオバ" = "ど、どうしました……？"
"10044010-148-ノゾミ" = "列車……どこだっけ？"
"10044010-149-アオバ" = "はい？"
"10044010-150-ノゾミ" = "乗り場……は間違えてないね。"
"10044010-151-アオバ" = "えっ？……え？"
"10044010-152-ヒカリ" = "家出かなー？"
"10044010-153-アオバ" = "じょ、冗談のつもりなら面白くないんですけど……。"
"10044010-154-ヒカリ" = "おーまじめー。"
"10044010-155-ノゾミ" = "え、マジでどこ行った？"
"10044010-156-アオバ" = "……。"
"10044010-157-アオバ" = "ええええ！？！？！？！？"
