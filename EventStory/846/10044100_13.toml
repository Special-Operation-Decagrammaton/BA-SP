[translation]
"10044100-1" = "第10話;分からぬ世界で少女は笑う"
"10044100-2-暴走族ボス" = "こんのガキどもが……！"
"10044100-3-暴走族A" = "そ、総長……！もうダメかも！"
"10044100-4-暴走族ボス" = "ち、ちくしょう……うちらの野望が……！！"
"10044100-5-？？？" = "ククッ……これはこれは、賑やかな出迎えですね。"
"10044100-6-暴走族A" = "こ、この声は――"
"10044100-7-依頼人" = "ハイランダー鉄道学園の皆さん、ご苦労様でした。"
"10044100-8-依頼人" = "ククッ、どうやら想定外のトラブルがあったようですな？"
"10044100-9-暴走族ボス" = "依頼人！来ていたのか……！"
"10044100-10" = "[ns] \"あ……。\""
"10044100-11-アオバ" = "あ、あなたが依頼人ですか……？"
"10044100-12-ノゾミ" = "ちょうどいいじゃん。さっさと書類にサインもらっちゃお！"
"10044100-13-アオバ" = "いやいやいや、待ってください！#n見るからに悪い人じゃないですか！"
"10044100-14-ヒカリ" = "それはそれー、これはこれー。"
"10044100-15-依頼人" = "ククッ……積荷を確認させてもらいましたが――"
"10044100-16-依頼人" = "品物には傷一つありませんでした。列車はひどい有様ですがね。"
"10044100-17-依頼人" = "ククッ、やはりハイランダーに任せて正解でしたなぁ。"
"10044100-18-ノゾミ" = "当然のことをしたまでだよ。"
"10044100-19-依頼人" = "ククッ、流石です……。"
"10044100-20-依頼人" = "サインは……ああ、ここに。#nこれで、最後にあなた方がサインをすれば、依頼は完了です。"
"10044100-21-依頼人" = "皆さんは任務を終え、私は品物を受け取る。"
"10044100-22-依頼人" = "さあ、どうぞサインを。ククッ……。"
"10044100-23-アオバ" = "いいんですか！？本当に！？"
"10044100-24-ヒカリ" = "終わりー。"
"10044100-25-ノゾミ" = "任務完了～！"
"10044100-26-依頼人" = "ククッ、ククククッ……ガハハハッ！！"
"10044100-27-依頼人" = "この時をどれほど待ちわびたことか……！！"
"10044100-28-アオバ" = "せ、先生……本当によかったんでしょうか……。"
"10044100-29-アオバ" = "も、もう取り返しのつかないことに……！"
"10044100-30-依頼人" = "おや……？これはこれは……ククッ、先生ではありませんか。"
"10044100-31-依頼人" = "その節は大変お世話になりまして……ククッ！"
"10044100-32-アオバ" = "……え？"
"10044100-33" = "[ns] \"お久しぶりです。奇遇ですね。\""
"10044100-34-アオバ" = "え、っと……。"
"10044100-35-アオバ" = "せ、先生の……お知り合いですか？"
"10044100-36" = "[s1] \"社会福祉で有名な実業家の方だよ。\"\n[s2] \"奨学金にもたくさん援助してくれてるんだ。\""
"10044100-37-アオバ" = "……はい？？"
"10044100-38-依頼人" = "ククッ、そのように紹介されると気恥ずかしいですな。#n私はただ小さなビジネスをいくつか経営しているだけですから……。"
"10044100-39-依頼人" = "僅かばかりでも生徒の役に立てれば、と。ククッ……！！"
"10044100-40-アオバ" = "って、なんで誤解されるような喋り方してるんですか！勘違いしましたけど！？"
"10044100-41-依頼人" = "ああ、何故かよく言われますが――"
"10044100-42-依頼人" = "私には皆目見当もつきませんなぁ。ガハハハッ！！"
"10044100-43-アオバ" = "そ、その笑い方も原因の一つだと思うんですけど……！"
"10044100-44-依頼人" = "なんにせよ、無事に運んでくださった皆さんに感謝を。"
"10044100-45-依頼人" = "これが無ければ始まらないもので。"
"10044100-46-依頼人" = "おかげで、行事を滞りなく進められます。"
"10044100-47-ノゾミ" = "行事？これって何に使うの？"
"10044100-48-依頼人" = "ククッ、それはですな――"
"10044100-49-依頼人" = "「チャリティーオークション」というのを、ご存知でしょうか？"
"10044100-50-ヒカリ" = "知らなーい。"
"10044100-51-依頼人" = "慈善活動の一環として開催される貴重品のオークションでして。"
"10044100-52-依頼人" = "生じた収益は、公正なルートを経て、生徒の奨学金給付などに使われるのです。"
"10044100-53-依頼人" = "こういった美術品やら骨董品は、資産家らに大変人気がありましてな。"
"10044100-54-依頼人" = "資金集めの種にうってつけという訳ですよ。ククッ……。"
"10044100-55-依頼人" = "社会貢献できる上に、節税効果もある。"
"10044100-56-依頼人" = "ククッ、まさに一石二鳥ではありませんか！ガハハハッ！！"
"10044100-57-アオバ" = "だから、その喋り方なんとかしてほしいんですけど！？"
"10044100-58-依頼人" = "さて。キヴォトス・トランスポーター連盟……略して、ブロロロ疾走連合の皆さん？"
"10044100-59-ノゾミ" = "その呼び名、付き合ってあげるんだ……。"
"10044100-60-暴走族ボス" = "うっ……。"
"10044100-61-依頼人" = "クククッ……。こうもトラブル続きでは――"
"10044100-62-依頼人" = "信頼関係を築き直す必要がありそうですね。ククッ……。"
"10044100-63-暴走族ボス" = "さ、先に裏切ったのはお前のはずだ！"
"10044100-64-暴走族ボス" = "そもそも、その荷物だって最初はうちらに任せるって話だったろ？"
"10044100-65-依頼人" = "それは……あなた方のサービスの質が悪いからでしょう……？"
"10044100-66-依頼人" = "昨日、私はお寿司を注文したはずですが……#nシャリとネタがバラバラになって、もはや海鮮丼になってましたからねぇ。"
"10044100-67-ノゾミ" = "うわ、ひっど。"
"10044100-68-依頼人" = "くっ……そ、それは……。"
"10044100-69-依頼人" = "そんなあなた方に、貴重品の輸送を任せられると本気でお考えで？"
"10044100-70-暴走族ボス" = "で、でも、うちらはスピードが命なんだ！"
"10044100-71-依頼人" = "ええ。あなた方の強みは存じていますとも。"
"10044100-72-依頼人" = "ですから……ククッ、その長所を最大限活かせるよう、私がサポートして差し上げましょう。"
"10044100-73-暴走族ボス" = "ほ、本当か！？"
"10044100-74-依頼人" = "ただし！それは、これまでのことを償ってからの話です。"
"10044100-75-暴走族ボス" = "そ、それは……まだうちらにチャンスをくれるのか……？"
"10044100-76-暴走族ボス" = "……分かった。できる限りの弁償をしよう。"
"10044100-77-暴走族ボス" = "それから……初心に戻って一からやり直す。"
"10044100-78-暴走族ボス" = "今度こそ、プロの配達屋として、誠実に働いてみせるから。"
"10044100-79-暴走族B" = "そ、総長……。"
"10044100-80-暴走族ボス" = "……夢を諦めるつもりじゃねぇよ。ただちょっとだけ、ゆっくり歩くのさ。"
"10044100-81-暴走族ボス" = "お前らと一緒なら、できるはずだからな。"
"10044100-82-暴走族A" = "総長……。"
"10044100-83-暴走族ボス" = "あ、あの……いい話っぽいですけど……そんなことないですからね？"
"10044100-84-暴走族ボス" = "くっ……！"
"10044100-85-暴走族ボス" = "あ、ああ……そうだったな。#n一週間使える送料無料クーポンを受け取ってくれ。"
"10044100-86-アオバ" = "い、要らないんですけど……！"
"10044100-87-暴走族ボス" = "い、一枚じゃ足りないか……？#nそ、それなら……に、二枚で……！"
"10044100-88-ヒカリ" = "今度こそ任務完了だね。"
"10044100-89-ヒカリ" = "ガスけつーはらへりー。"
"10044100-90" = "[ns] \"みんな、本当にお疲れ様。\""
"10044100-91-ヒカリ" = "先生もお疲れ様ー、よしよしー。"
"10044100-92-ノゾミ" = "パヒャヒャッ！今回は結構楽しめたかな。"
"10044100-93-ノゾミ" = "先生、また呼んでもいいよね？"
"10044100-94-アオバ" = "ちょ、ちょっと……少しは遠慮というものを……。"
"10044100-95" = "[ns3] \"いつでもどうぞ。\"\n[ns4] \"生徒の頼みに応えるのが先生だからね。\""
"10044100-96-アオバ" = "……え、えぇ？"
"10044100-97-アオバ" = "じゃ、じゃあ……。"
"10044100-98-アオバ" = "わ、私が呼んでも……来て、くれますか……？"
"10044100-99" = "[s] \"もちろん。\""
"10044100-100-アオバ" = "……。"
"10044100-101-アオバ" = "はぁ……だ、ダメだって分かってるのに……。"
"10044100-102-アオバ" = "こ、こんなの、期待しちゃうじゃないですかぁ……。"
"10044100-103-ノゾミ" = "あ、そうだ。任務の報告書をまとめないと……。"
"10044100-104-ヒカリ" = "先生ーヘルプミー。"
"10044100-105" = "[s] \"うっ、書類仕事……。\""
"10044100-106-ノゾミ" = "せっかくだし、シャーレでやるのはどう？"
"10044100-107-ノゾミ" = "パヒャヒャッ！そうと決まったら、ヒカリ行くよ！"
"10044100-108-ヒカリ" = "しゅっぱーつ。"
"10044100-109-アオバ" = "こ、これで任務完了、ですよね……？"
"10044100-110-ノゾミ" = "うん！最後のサインまでもらったし！#nまぁ、報告書は作んないとだけど……。"
"10044100-111-アオバ" = "ふぅ……本当に長い一日でした。"
"10044100-112-アオバ" = "……お二人も、お疲れ様でした。#n幹部のこと、現場の敵だって思ってたんですけど――"
"10044100-113-アオバ" = "責任感、ちゃんとあるんですね。#nちょっとだけ見直しました。ほんのちょっとだけ、ですけど……。"
"10044100-114-ヒカリ" = "んー？もっと大きな声で言ってー？"
"10044100-115-アオバ" = "な、なんでもないんですけど……！"
"10044100-116-アオバ" = "も、もちろん変な幹部も多いですし？#n幹部はやっぱり幹部だと思ってますけど……。"
"10044100-117-ノゾミ" = "それ褒めてんの？"
"10044100-118-アオバ" = "ま、まぁ……私なりに……。"
"10044100-119-ノゾミ" = "パヒャヒャッ！まっ、そういうことにしとこっか。"
"10044100-120-ヒカリ" = "アオバ、かっこよかったー。"
"10044100-121-ヒカリ" = "摩擦係数オーバードライブまたやろうねー。"
"10044100-122-アオバ" = "も、もうやりたくないんですけど……。"
"10044100-123-アオバ" = "じゃ、じゃあ、私は寮に戻りますね……では……。"
"10044100-124-ノゾミ" = "一緒に来ないの？"
"10044100-125-アオバ" = "え、わ、私もですか……？"
"10044100-126-ヒカリ" = "ワンチームー。"
"10044100-127-アオバ" = "で、でも任務は終わりましたし……。"
"10044100-128-ノゾミ" = "遠足は帰るまでが遠足、って言うっしょ？"
"10044100-129-アオバ" = "それは、どういう……。"
"10044100-130" = "[ns] \"みんなで夜ご飯食べに行こっか。\""
"10044100-131-アオバ" = "い、いいんですか？一緒に行っても……。"
"10044100-132-ヒカリ" = "「みんなで」だよー？"
"10044100-133-ノゾミ" = "パヒャヒャッ！行こ行こ！好きなもん全部頼んでいい？"
"10044100-134-アオバ" = "え、遠慮って知ってます……？"
"10044100-135-ヒカリ" = "使える時に使うのがー先生チャンスー。"
"10044100-136-アオバ" = "うぅ、褒めたそばからこれですか……。"
"10044100-137" = "[ns] \"ははっ……今日もお疲れ様！\""
"10044100-138" = "ハイランダー鉄道爆走事件〜そして列車はなくなった〜"
