[translation]
"10044030-1" = "第3話;さらに消えた列車を追って"
"10044030-2" = "貨物駅"
"10044030-3-駅員" = "えー、勝手に発車したの？また？"
"10044030-4-駅員" = "私たちにも理由が分からず……そもそも時刻表に載ってない列車ですし……。"
"10044030-5-アオバ" = "おいかけっこー。"
"10044030-6-アオバ" = "や、やっぱり期待するから失望する羽目になるんだ……。"
"10044030-7" = "[ns] \"行き先は分かる？\""
"10044030-8-駅員" = "し、調べてみます……！"
"10044030-9-ノゾミ" = "こんなことしてる場合じゃないんだけどなー。"
"10044030-10-ヒカリ" = "見つけたらーフルスロットルー。"
"10044030-11-ノゾミ" = "ま、「なるようになる」っていうし？"
"10044030-12-アオバ" = "見つけました！列車は今、上り線を走行中です！"
"10044030-13-アオバ" = "お、追いかける方法は――"
"10044030-14-駅員" = "ここからだとバスしかないですね。"
"10044030-15-アオバ" = "うっ……バス……。"
"10044030-16-ヒカリ" = "追いつければ何でもいいし！#n上にバレる前に早く行こ！"
"10044030-17-ノゾミ" = "バビューン、しゅばばばばー。"
"10044030-18-アオバ" = "……。"
"10044030-19-ノゾミ" = "……。"
"10044030-20-ノゾミ" = "バス来ないんだけど！！"
"10044030-21-ノゾミ" = "歩いたほうが早いかもー？"
"10044030-22-ノゾミ" = "なんで時間通りに来ないわけ？#nこの時刻表は飾りなの！？"
"10044030-23-アオバ" = "……。"
"10044030-24" = "[s1] \"アオバ、大丈夫？\"\n[s2] \"ちょっと顔色悪いけど。\""
"10044030-25-アオバ" = "あ、はい……。"
"10044030-26-アオバ" = "……。"
"10044030-27-アオバ" = "じ、実は私……乗り物酔いが、ひどくて……。"
"10044030-28-ヒカリ" = "ふらふらー、げろげろー？"
"10044030-29-アオバ" = "はい……特にバスとか車だと――"
"10044030-30-アオバ" = "そ、想像するだけで……おぇ……。"
"10044030-31-ノゾミ" = "あーあ、これだから車は。列車なら酔いにくいのにね。"
"10044030-32-アオバ" = "はぁ……ふぅ……。"
"10044030-33-アオバ" = "はい……だから、ハイランダーに、入学したんです……。"
"10044030-34" = "[ns3] \"ちょっとだけ乗るのも大変そう？\"\n[ns4] \"酔い止め薬買ってこようか。\""
"10044030-35-アオバ" = "バス来ちゃったよ！"
"10044030-36-アオバ" = "せ、先生……私は……大丈夫、なので……。"
"10044030-37-アオバ" = "まだ我慢できるうちに……早く行きましょう……！"
"10044030-38" = "[s] \"本当に無理そうだったら言ってね。\""
"10044030-39-アオバ" = "は、はい……。"
"10044030-40-ノゾミ" = "遅かったじゃん！5分も待たされたんだけど！？"
"10044030-41-バス運転手 " = "ワハハッ！すまんすまん。渋滞に捕まってな。"
"10044030-42-バス運転手 " = "暴走族が暴れてたんで遅くなっちまった！"
"10044030-43-ヒカリ" = "バスはぜいじゃくー。"
"10044030-44-ノゾミ" = "線路なら邪魔者いないのにね。"
"10044030-45-バス運転手 " = "バスにはバスの長所があるもんさ。"
"10044030-46-バス運転手 " = "にしても、ハイランダーの生徒さんもバスに乗ることあるんだな。"
"10044030-47" = "[s5] \"急ぎの用事がありまして。\"\n[s6] \"運転よろしくお願いします。\""
"10044030-48-バス運転手 " = "ま、とにかく座った座った！発車しまーす！"
"10044030-49-ヒカリ" = "背中トントンしてあげるー。"
"10044030-50-アオバ" = "お、お構いなく……。"
"10044030-51-ヒカリ" = "ヒカリ108式、サウザンドハンマー。"
"10044030-52-アオバ" = "あっ、あう……や、やめてください……余計に酔いが……。"
"10044030-53-アオバ" = "うっぷ――"
"10044030-54-ノゾミ" = "パヒャヒャッ！ビニール袋いる？いつでも言って！"
"10044030-55" = "[ns] \"アオバ、大丈夫？深呼吸しよう。\""
"10044030-56-アオバ" = "すー……はぁぁ……世界は……本当にしんどいことばかりですけど……。"
"10044030-57-アオバ" = "ん？ハイランダーのみんな、どうかしたのかい？"
"10044030-58-ノゾミ" = "アオバがゲロ吐きそうだって！！"
"10044030-59-アオバ" = "ち、違います！！いや、違わないですけど！！！"
"10044030-60-アオバ" = "は、恥ずかしいので、大きな声で言わないで――"
"10044030-61-アオバ" = "おえっ……！き、ぎもぢわるぃ……。"
"10044030-62-バス運転手 " = "すまないが、もうちょっとの辛抱だ。"
"10044030-63-バス運転手 " = "できるだけ頑張ってみるからさ！"
"10044030-64-ヒカリ" = "アクセル全開でーちょっぱやー？"
"10044030-65-バス運転手 " = "はっはっは、そりゃ無理だな。ダイヤは守らないと。"
"10044030-66-ヒカリ" = "列車といっしょー。"
"10044030-67-ノゾミ" = "でもバスってすぐ遅れるじゃん？#n停留所が多すぎるんじゃない？"
"10044030-68-バス運転手 " = "その分、小回りが利くのが利点だからね。"
"10044030-69-バス運転手 " = "君たちだって、必要だからバスを使ってくれてるんだろう？ハハッ！"
"10044030-70-ノゾミ" = "パヒャヒャッ、今日はそういうことにしといてあげる！"
"10044030-71-バス運転手 " = "おっと、また暴走族だ。"
"10044030-72-バス運転手 " = "こらぁ！危ないぞ！"
"10044030-73-バス運転手 " = "うるせぇ！ノロマなデカブツは引っ込んでろ！"
"10044030-74-バス運転手 " = "あいつら……ったくもう！"
"10044030-75-バス運転手 " = "総長がお呼びだ～！急げ！"
"10044030-76" = "[ns] \"また渋滞か……。\""
"10044030-77-ノゾミ" = "やっぱバスダメじゃん！なんとかならないの？"
"10044030-78-ヒカリ" = "もーむりー。"
"10044030-79-ノゾミ" = "ってか、前に進むだけなのに、なんで渋滞とかするわけ？"
"10044030-80-アオバ" = "……。"
"10044030-81-ヒカリ" = "背中トントンするー？"
"10044030-82-アオバ" = "い、いらない、です……ふぅ、ふぅ……。"
"10044030-83-ノゾミ" = "渋滞って理解できないんだけどさ――"
"10044030-84-ノゾミ" = "ハイランダーの生徒として、どう思う？"
"10044030-85-アオバ" = "こ、この話今しないとダメ……ですか？"
"10044030-86" = "[s] \"アオバ、大丈夫？\""
"10044030-87-アオバ" = "こ、この二人さえ大人しければ、なんとか……。"
"10044030-88-アオバ" = "う、運転手さんも気遣ってくれているみたいですし……。"
"10044030-89-暴走族ボス" = "おい！ソレはうちらに任せる約束だっただろ！？"
"10044030-90-依頼人" = "ククッ。理由はあなた方が一番よく分かっているのでは？"
"10044030-91-依頼人" = "雑な配達で貴重品を破損させ……事故を起こしてヴァルキューレに追われ……。"
"10044030-92-暴走族ボス" = "そっ、それは……。"
"10044030-93-暴走族ボス" = "でも、スピードならうちらが一番じゃんか！"
"10044030-94-暴走族ボス" = "だって道路のアウトローなんだぜ？"
"10044030-95-依頼人" = "ええ、ええ、もちろん存じておりますとも。"
"10044030-96-依頼人" = "しかし、適材適所というものでして。#n今回の依頼は何より安全性を重視しておりますので。"
"10044030-97-依頼人" = "ゆえに、より安全が保障される鉄道輸送を選んだだけのことです。ククッ……。"
"10044030-98-暴走族ボス" = "くそっ……うちらが負けた……？#nそんなの認めねぇぞ。"
"10044030-99-依頼人" = "それを決めるのはあなた方ではありませんよ。#nともあれ、話は以上です。では――"
"10044030-100-暴走族ボス" = "まっ、待て！話はまだ――"
"10044030-101-暴走族ボス" = "ちくしょう切りやがった！！"
"10044030-102-暴走族ボス" = "うちらがどれだけこの仕事のために準備したか分かってんのか！？"
"10044030-103-暴走族" = "ボス、大丈夫……？"
"10044030-104-暴走族ボス" = "ボスじゃねぇ！総長！！"
"10044030-105-暴走族" = "ご、ごめん……！"
"10044030-106-暴走族ボス" = "……で、何の用だ？"
"10044030-107-暴走族" = "し、指示された通り、全員集まってるけど、どうする？"
"10044030-108-暴走族ボス" = "……。"
"10044030-109-暴走族ボス" = "こうなったら、やるしかない。"
"10044030-110-暴走族" = "なにを……？"
"10044030-111-暴走族ボス" = "奪われたチャンスは、自分たちの手で取り戻すんだ！"
"10044030-112-暴走族" = "おお……！なんかカッコいい！"
"10044030-113-暴走族ボス" = "うちらの仕事を横取りしたやつめ……覚悟しろよ……！"
"10044030-114-バス運転手 " = "ハイランダーのみんな！ここで降りるんだよな？"
"10044030-115-ノゾミ" = "やっと着いた……。"
"10044030-116-ヒカリ" = "アワートレイン、どこかなー。"
"10044030-117" = "[ns] \"アオバ、具合はどう？\""
"10044030-118-アオバ" = "ぎ、ギリギリでしたが、なんとか……うっぷ……。"
"10044030-119-アオバ" = "よく我慢した。偉いぞ！"
"10044030-120-アオバ" = "お、おかげさまで……ありがとうございます……。"
"10044030-121-バス運転手 " = "ハハッ！いつだってお客様第一だからな！"
"10044030-122-バス運転手 " = "バスだって悪かないだろ？"
"10044030-123-アオバ" = "は、はい……。"
"10044030-124-ノゾミ" = "そもそもバスに乗らなきゃ酔わなかったよね？"
"10044030-125-ヒカリ" = "列車は快適ー。"
"10044030-126-アオバ" = "よ、余計な事言わないで欲しいんですけど……。"
"10044030-127-ノゾミ" = "でもまあ、ちょっとだけ見直したかも？パヒャヒャッ！"
"10044030-128-ヒカリ" = "またくるねーじゃねー。"
"10044030-129-ヒカリ" = "ああ！"
"10044030-130" = "[ns] \"ありがとうございました！\""
"10044030-131-ヒカリ" = "背中トントンーもう大丈夫ー？"
"10044030-132-アオバ" = "そ、それ、叩きたいだけですよね……？"
"10044030-133-ノゾミ" = "ちゃっちゃと列車を回収するよ！"
