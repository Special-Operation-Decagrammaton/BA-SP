[translation]
"10044090-1" = "第9話;活路を開く一手"
"10044090-2-ノゾミ" = "アオバ、どうする？"
"10044090-3-アオバ" = "ええっ！？わ、私に聞かれましても……。"
"10044090-4-ヒカリ" = "ヒカリたちは運転専門ー。"
"10044090-5-アオバ" = "か、肝心な時に使えな――"
"10044090-6-アオバ" = "じゃなくて……！わ、私だってこの状況じゃ……！"
"10044090-7-アオバ" = "ひ、非常ブレーキなら……こっちもダメ……。"
"10044090-8-アオバ" = "さ、さっきの戦闘で壊れた……？"
"10044090-9-ヒカリ" = "つんだー？"
"10044090-10-ノゾミ" = "このままだとノンストップ激走コースかな？"
"10044090-11-ノゾミ" = "終点まで突っ走っちゃったら――もう届けるどころじゃないかも？"
"10044090-12-ノゾミ" = "結局任務は大失敗ってわけ！パヒャヒャッ！"
"10044090-13-ヒカリ" = "ぜんいん、懲戒処分ー。"
"10044090-14-アオバ" = "う、上から言われた通りに仕事しに来て……。"
"10044090-15-アオバ" = "や、やっとの思いでここまで来たのに……。"
"10044090-16-アオバ" = "うう……最初から引き受けるんじゃなかった！#n幹部連中と関わって良かったことなんて一度もなかったじゃないですか！？"
"10044090-17-アオバ" = "過去の自分をぶん殴ってやりたいですけどっ！！"
"10044090-18-アオバ" = "ちょ、ちょっとでも期待したら……やっぱり裏切られるんだ……。"
"10044090-19-アオバ" = "でも、でも……ここまで来てこんなの……あんまりですけど……。"
"10044090-20" = "[ns1] \"落ち着いて解決策を探そう。\"\n[ns2] \"まだ助かる方法があるかもしれない。\""
"10044090-21-ヒカリ" = "せんせー、ビルにクモの糸発射したらとまるかなー？"
"10044090-22" = "[s] \"それでは止まらないかな……。\""
"10044090-23-ヒカリ" = "じゃあー、線路に降りて全身で止めてみるとかー？"
"10044090-24" = "[s] \"それも、できないかなぁ……。\""
"10044090-25-ヒカリ" = "万策尽きたー。"
"10044090-26-アオバ" = "ほ、他に……他にできることは……。"
"10044090-27-アオバ" = "な、何か使えそうなものは持ってませんか？"
"10044090-28-ノゾミ" = "私、チョコバーあるよ。あとで食べようと思ってたやつ。"
"10044090-29-アオバ" = "ま、真面目に考えて欲しいんですけど……！"
"10044090-30-アオバ" = "か、貨物……は論外だし……手持ちの工具と……。"
"10044090-31-アオバ" = "銃と銃弾は……使ったところでどうにも……。"
"10044090-32-アオバ" = "あ、あとは……あとは…さっき誰かが落としていった爆弾も――"
"10044090-33-アオバ" = "……。"
"10044090-34-アオバ" = "い、いや、まさか……いける？"
"10044090-35-アオバ" = "爆弾！"
"10044090-36" = "[s] \"いいアイデアが浮かんだみたいだね。\""
"10044090-37-アオバ" = "あ、あるかもしれません……助かる方法……！"
"10044090-38-ヒカリ" = "おぉー。"
"10044090-39-ノゾミ" = "なになに？"
"10044090-40-アオバ" = "ぶ、ブレーキは、摩擦で速度を落とす仕組みです。"
"10044090-41-アオバ" = "つ、つまり別の方法で、摩擦さえ大きくしてやればいいんです。"
"10044090-42-ヒカリ" = "できるのー？"
"10044090-43-アオバ" = "あ、あるんですよ。"
"10044090-44-アオバ" = "こ、この状況からでもやれる方法が……！"
"10044090-45" = "しばらくして……"
"10044090-46-ヒカリ" = "駅見えたよー。"
"10044090-47-アオバ" = "じゅ、準備はいいですか……！"
"10044090-48-ノゾミ" = "いつでも！"
"10044090-49-ヒカリ" = "スタンバイー。"
"10044090-50-アオバ" = "も、もしこれでもダメだったら……。"
"10044090-51" = "[ns3] \"ふ、不安ではあるけど、私はアオバを信じるよ！\"\n[ns4] \"これしかないんだよね！？\""
"10044090-52-アオバ" = "は、はい……！余計なことは……無視！"
"10044090-53-駅員" = "そろそろ着く時間だけど――"
"10044090-54-駅員" = "あれかな？"
"10044090-55-駅員" = "……。"
"10044090-56-駅員" = "え……ちょっとスピード出し過ぎじゃない……？"
"10044090-57-駅員" = "これ、止まれる……？"
"10044090-58-ノゾミ" = "予測地点、つうかー。"
"10044090-59-ノゾミ" = "合図して！！"
"10044090-60-アオバ" = "3……。"
"10044090-61-アオバ" = "2……。"
"10044090-62-アオバ" = "……1。"
"10044090-63" = "少し前のこと――"
"10044090-64-アオバ" = "こ、この爆弾を使うんです。"
"10044090-65-ヒカリ" = "どこにー？"
"10044090-66-アオバ" = "……れ、列車の車輪を爆破します。"
"10044090-67-アオバ" = "車輪がなくなると、摩擦力が上がるんです……当たり前のこと、ですけど……。"
"10044090-68-ノゾミ" = "ん……つまり？"
"10044090-69-ヒカリ" = "摩擦係数ーオーバードライブー。"
"10044090-70-アオバ" = "そ、その通りです……！"
"10044090-71-アオバ" = "こ、これなら確実に停車[ruby=・]は[/ruby]できます……。"
"10044090-72-アオバ" = "も、もちろん列車も線路も大変なことにはなりますけど……。"
"10044090-73-アオバ" = "で、でも、もうこれしか――！！"
"10044090-74-ノゾミ" = "パヒャヒャッ、すっごいハチャメチャだけど――"
"10044090-75-ノゾミ" = "いいよ！乗った！！"
"10044090-76" = "[ns] \"みんなのことを信じるよ！？\""
"10044090-77-アオバ" = "い、今できる最善ですから……。"
"10044090-78-ノゾミ" = "列車は修理すればいいし、線路もまた敷けばいいからさ！"
"10044090-79-ヒカリ" = "プライオリティー。"
"10044090-80-アオバ" = "今ですっ！！"
"10044090-81-アオバ" = "う、うわああーっ！！"
"10044090-82-ヒカリ" = "先生ー掴まってー。"
"10044090-83-ノゾミ" = "パヒャヒャッ！！順調にスピード落ちてるよ！"
"10044090-84-アオバ" = "こ、このまま……このまま……。"
"10044090-85-アオバ" = "だ、大丈夫……止まって……止まって……！"
"10044090-86" = "[ns] \"うわああっ……！！\""
"10044090-87" = "[log]駅まで100M[/log]"
"10044090-88" = "[log]50M[/log]"
"10044090-89" = "[log]30M[/log]"
"10044090-90" = "[log]15M[/log]"
"10044090-91" = "[log]5M[/log]"
"10044090-92" = "[log]ハイランダー貨物列車停止位置まで0M[/log]"
"10044090-93" = "[log]停車成功[/log]"
"10044090-94-アオバ" = "と、止まった……？#nやった……やりましたよ……！！"
"10044090-95-ヒカリ" = "任務完了ー。"
"10044090-96-ノゾミ" = "パヒャヒャッ！なんとかなったね！！"
"10044090-97" = "[ns] \"みんな……怪我はない？\""
"10044090-98-アオバ" = "は、はい……大丈夫です……！"
"10044090-99-ノゾミ" = "問題なーし！"
"10044090-100-ヒカリ" = "ヒカリ、先生守ったよー？褒めて褒めてー。"
"10044090-101-駅員" = "えー、これどうしよう……。"
"10044090-102-駅員" = "えっと、皆さん大丈夫ですか……？"
"10044090-103-ノゾミ" = "パヒャヒャッ、もちろん！定時運行！安全輸送！完璧っしょ？"
"10044090-104-駅員" = "安全……完璧……？"
"10044090-105-駅員" = "酷い有様ですが……。"
"10044090-106-駅員" = "ま、まあ……到着は到着ですね……はは……。"
"10044090-107-駅員" = "とりあえず、手続きに必要な書類を持ってきますので、少々お待ちください。"
"10044090-108-アオバ" = "こ、これで依頼人のサインをもらえば、すべて終わりですよね……？"
"10044090-109-ヒカリ" = "だいせーこー。"
"10044090-110-アオバ" = "あ、後始末のことも考えて欲しいんですけど……。"
"10044090-111-アオバ" = "はぁ、やだなぁ……怒られるのかなぁ……どうして私の人生はこう……。"
"10044090-112-？？？" = "ハハハッ！お勤めご苦労！！"
"10044090-113-ノゾミ" = "ん？"
"10044090-114-暴走族ボス" = "待ち伏せした甲斐があったぜ。"
"10044090-115-暴走族ボス" = "流石はハイランダー。時間ぴったりだったな！"
"10044090-116-暴走族A" = "てかさっきの何だったんだ？"
"10044090-117-暴走族B" = "あれがハイランダー式なのか……？"
"10044090-118-暴走族ボス" = "静かに！#nおい、お前ら。うちらのこと、まだ忘れてないよな？"
"10044090-119-ヒカリ" = "ヒカリたちのファンー？"
"10044090-120-暴走族ボス" = "んなわけねぇだろ！#nうちらはキヴォトス・トランスポーター連盟……略して、ブロロロ疾走連合だ！"
"10044090-121-アオバ" = "ど、どう略せばそうなるんですか……？"
"10044090-122-暴走族ボス" = "キヴォトスの配送業を掌握し……いずれは流通のトップに立つ組織だ！"
"10044090-123-暴走族" = "くぅ～っ！でっけぇ野望！滾るぜ！"
"10044090-124-ノゾミ" = "で、それがなんだって言うのさ？"
"10044090-125-暴走族ボス" = "よくもうちらの仕事を横取りしやがったな！"
"10044090-126-暴走族ボス" = "お前らのせいで予定が台無しになっちまったんだよ！"
"10044090-127-アオバ" = "よ、横取り……？"
"10044090-128-暴走族ボス" = "その列車の積荷は、元々うちらが運ぶはずだったんだ。"
"10044090-129-暴走族ボス" = "なのにお前らが横取りしたせいで……！"
"10044090-130-アオバ" = "べ、別にそんなことしてないんですけど……。"
"10044090-131-アオバ" = "わ、私たちは言われた仕事をしただけですし……。"
"10044090-132-暴走族A" = "あぁ？ナメてんのか！？"
"10044090-133-ノゾミ" = "ピザすらまともに運べないのが悪いんじゃん？"
"10044090-134-暴走族" = "う、うるせぇ！いいから、その積荷を置いて、お前らはとっとと帰りな！"
"10044090-135-暴走族ボス" = "配送業に身を置く同志として……ここまで運んだ技術は認めよう。"
"10044090-136-暴走族ボス" = "だが、最後に届けるのは――うちら「ブロロロ疾走連合」だぜ！！"
"10044090-137-アオバ" = "し、支離滅裂なことばっかり……。"
"10044090-138-ヒカリ" = "秘密の先生パワー見せてー。"
"10044090-139-ヒカリ" = "ここ押せば変身するのー？えいっ、えいっー。"
"10044090-140" = "[s5] \"そんな能力があれば嬉しいけど……。\"\n[s6] \"わっ！ヒカリ！くすぐったいよ……！\""
"10044090-141-暴走族ボス" = "おい……馬鹿にしてんのか！？"
"10044090-142-暴走族ボス" = "積み上げた努力が、目の前で水の泡になる気持ち――"
"10044090-143-暴走族ボス" = "お前らにも味わわせてやる！"
