[translation]
"10044075-1-構成員" = "こいつら……強い！"
"10044075-2-ブラックマーケット幹部" = "くそっ！ブラックマーケットを掌握できたはずなのに……。"
"10044075-3-アオバ" = "う、噂の尾ひれがどんどん大きく……。"
"10044075-4-ヒカリ" = "もしかしてほんとにすごいのかもー？"
"10044075-5-ノゾミ" = "みんなお宝に目がくらんでるんだね。パヒャッ！"
"10044075-6-イオリ" = "ふう……。"
"10044075-7-イオリ" = "だいたい片付いたな。"
"10044075-8" = "[ns1] \"ありがとう、イオリ。\"\n[ns2] \"風紀委員会のおかげで助かったよ。\""
"10044075-9-イオリ" = "うちの自治区内で起きてる騒ぎだし、鎮圧までは当然なんだけど……。"
"10044075-10-イオリ" = "見逃してやるかどうかは……。"
"10044075-11-イオリ" = "……。"
"10044075-12-イオリ" = "まあでも、先生だからな。"
"10044075-13" = "[s] \"信じてくれるんだ……！\""
"10044075-14-イオリ" = "後で必ず説明に来ること！先生、忘れるなよ？"
"10044075-15-イオリ" = "じゃあ、私はこれで――"
"10044075-16-ノゾミ" = "いい活躍だったよ！"
"10044075-17-イオリ" = "別にこれくらい……。"
"10044075-18-イオリ" = "エース級の活躍だったよー？"
"10044075-19-アオバ" = "ほ、本当にありがとうございました……おかげで命拾いしました……。"
"10044075-20-アオバ" = "こ、このご恩はいつか必ず……。"
"10044075-21-イオリ" = "いいって、そんなの。"
"10044075-22-イオリ" = "……気をつけて行きなよ、ハイランダー。"
"10044075-23-イオリ" = "あ、先生もな。"
"10044075-24" = "[s] \"うん、ありがとう、イオリ。\""
"10044075-25-ノゾミ" = "やっぱ先生は顔広いね！"
"10044075-26-アオバ" = "ど、どうせこの世は人脈がすべて……私みたいな人間はどう生きていけば……。"
"10044075-27-ヒカリ" = "アオバ、友達いないー？"
"10044075-28-アオバ" = "こ、言葉の暴力って、知ってます？"
"10044075-29-ヒカリ" = "いなさそー。"
"10044075-30-アオバ" = "い、いい勝負だと思うんですけど……。"
"10044075-31-ヒカリ" = "ヒカリは友達多いよー、先生も友達ー。"
"10044075-32-アオバ" = "せ、先生は先生なんじゃ……。"
"10044075-33-アオバ" = "え……？"
"10044075-34-ヒカリ" = "アオバも友達なるー？"
"10044075-35-アオバ" = "いえ、そうではなく……この箱……。"
"10044075-36-ノゾミ" = "少し角が潰れちゃってるね。さっきの爆弾のせいかな？"
"10044075-37-アオバ" = "な、中身は無事みたいですが……。"
"10044075-38-アオバ" = "でも、まさか……こんなモノが、積まれていたなんて……。"
"10044075-39" = "[ns] \"これは……。\""
"10044075-40-暴走族ボス" = "げほっげほっ……全員無事か……？"
"10044075-41-暴走族" = "そ、総長……うちら、これからどうすりゃいいんだ？"
"10044075-42-暴走族" = "風紀委員会まで出てきて、列車は逃しちまったし……。"
"10044075-43-暴走族" = "もう滅茶苦茶だよ……。"
"10044075-44-暴走族ボス" = "……。"
"10044075-45-暴走族" = "このままじゃ計画は……。"
"10044075-46-暴走族ボス" = "いや……まだ手はある。"
"10044075-47-暴走族ボス" = "いつだって答えは――道路の上にあった。"
"10044075-48-暴走族ボス" = "今はまだ見つかってないだけ……！"
"10044075-49-暴走族ボス" = "そうか！こうすりゃいいんだ！"
"10044075-50-暴走族" = "総長？"
"10044075-51-暴走族ボス" = "うちらは列車の目的地を知ってる。#nもともとはうちらの仕事だったんだからな。"
"10044075-52-暴走族ボス" = "つまり……目的地に先回りして――"
"10044075-53-暴走族ボス" = "やつらが到着する直前で、積荷を奪う！！"
"10044075-54-暴走族ボス" = "それをうちらが依頼人に渡す！！"
"10044075-55-暴走族" = "そんなのあり！？"
"10044075-56-暴走族" = "う、うちは頭悪いから分かんないけど……それって配達って言えるのかな……？"
"10044075-57-暴走族ボス" = "当たり前だ！"
"10044075-58-暴走族ボス" = "途中なんて関係ない！最後に届けたやつが配達人だ！"
"10044075-59-暴走族" = "そ、そうかな……？"
"10044075-60-暴走族ボス" = "ああ！うちらがキヴォトスの運送業界を牛耳る日も近い！"
"10044075-61-暴走族" = "お、おーっ……！"
"10044075-62-暴走族ボス" = "よし、行くぞ！スピードで負けるんじゃねぇぞ！！"
