[translation]
"10044070-1" = "第7話;列車と先生と銀髪の少女"
"10044070-2-？？？" = "おい、そこの列車！"
"10044070-3" = "[ns] \"この声は……。\""
"10044070-4-イオリ" = "ここはゲヘナ自治区だ！これ以上、ゲヘナでの騒ぎは許さないぞ！"
"10044070-5" = "[ns] \"イオリ！！！\""
"10044070-6-イオリ" = "……？"
"10044070-7-イオリ" = "え？"
"10044070-8-イオリ" = "せ、先生！？なんでここに！？"
"10044070-9" = "[s1] \"かくかくしかじかで……！\"\n[s2] \"あとで説明するから、助けてくれない？\""
"10044070-10-イオリ" = "先生と列車！？#nまた！？"
"10044070-11-イオリ" = "はぁ……今度は何に巻き込まれたんだ？"
"10044070-12" = "[s3] \"さすがイオリ！話が早くて助かるよ！\"\n[s4] \"助けてくれたら、足でもなんでも舐めるから！！\""
"10044070-13-イオリ" = "ばっ、バカ！このヘンタイ！死ねっ！！"
"10044070-14-イオリ" = "いや、どっちみち事情は聞かせてもらうけどさ……。"
"10044070-15-イオリ" = "……。"
"10044070-16-イオリ" = "…………。"
"10044070-17-イオリ" = "はぁ……面倒事に決まってるのに……！"
"10044070-18-ノゾミ" = "せ、先生……ゲヘナの生徒とも面識があるんですね……。"
"10044070-19-ヒカリ" = "先生ー、足舐めたことあるのー？"
"10044070-20-ノゾミ" = "もしかして私らのも舐めたかったり？パヒャッ！"
"10044070-21-構成員" = "屋根を破るぞ！"
"10044070-22-ブラックマーケット幹部" = "乗務員室を占拠しろ！"
"10044070-23-アオバ" = "あわっ……！もうここまで……！"
"10044070-24-ヒカリ" = "一番乗りー。"
"10044070-25-ノゾミ" = "パヒャヒャッ！ちょっとは真面目にやらないとかな？"
"10044070-26-アオバ" = "ど、どうすれば……！！"
"10044070-27-構成員" = "がはっ！なっ、なんだ！？"
"10044070-28-構成員" = "くそっ！ゲヘナの風紀委員会か……！！"
"10044070-29-イオリ" = "はぁ……まったく……。"
"10044070-30-イオリ" = "あとで全部説明してもらうからな！"
"10044070-31" = "[ns5] \"ありがとう！！！\"\n[ns6] \"さすがイオリ！！\""
"10044070-32-ヒカリ" = "パヒャヒャッ！いい腕してるじゃん！"
"10044070-33-ヒカリ" = "ちょーカッコいいー、きゅーせいしゅー。"
"10044070-34-イオリ" = "な、なんだ、こいつら……。"
"10044070-35-ノゾミ" = "私らも運動しよっか！"
"10044070-36-アオバ" = "ぎ、業務範囲外なんですけど……！"
"10044070-37-イオリ" = "先生、指揮をお願い！！"
