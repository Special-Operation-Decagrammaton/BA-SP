[translation]
"10041020-1" = "第2話;役割分担"
"10041020-2-セイア" = "……ふぅ。"
"10041020-3-セイア" = "なんとか戻れたか。#n遅れてはいないようだ。"
"10041020-4-セイア" = "そこにトリニティ生もいる。この列に混ざれば自然だろうか。"
"10041020-5-セイア" = "気づかれぬように調査を進めるのは手間だが……。"
"10041020-6-セイア" = "致し方ない。自分で決めたことだからね。"
"10041020-7-セイア" = "さて……。"
"10041020-8-？？？" = "あっ！ティーパーティーさん見っけ！探したよ～？"
"10041020-9-カリン" = "今までどこに居たの？"
"10041020-10-カリン" = "移動や見学は自由だが、護衛がついていることを忘れないで欲しい。#n急に姿を消さないでくれ。"
"10041020-11-カリン" = "会場付近は比較的安全ではあるが……。"
"10041020-12-カリン" = "ご自身の立場を、弁えてもらえると助かる。どこかへ行く時にはひと言くれ。"
"10041020-13-セイア" = "済まない。少し道に迷っていたんだ。"
"10041020-14-セイア" = "ところで、先生の姿が見えないようだが……？"
"10041020-15-アスナ" = "ご主人様？ご主人様はねー。"
"10041020-16-セイア" = "（……ご主人様？）"
"10041020-17-カリン" = "せ、先輩……！今は「先生」……！！"
"10041020-18-セイア" = "（……？？）"
"10041020-19-セイア" = "（先生、君は彼女たちと一体何を……？）"
"10041020-20-アスナ" = "あっ、そうだ先生！先生は他校生の面倒を見てて忙しいんだって！"
"10041020-21-カリン" = "トリニティ総合学園の生徒を引率しているらしい。"
"10041020-22-カリン" = "あなたなら把握しているものだと思ったが、意外だな。"
"10041020-23-セイア" = "……引率？"
"10041020-24-セイア" = "……そうか。なるほど。"
"10041020-25-セイア" = "（しかし、なぜ先生が……？）"
"10041020-26-セイア" = "（わざわざ……）"
"10041020-27-セイア" = "いや、先生のことだ。何か考えがあるのだろう。"
"10041020-28-アスナ" = "どうかしたの？"
"10041020-29-アスナ" = "顔色があんまよくないよ？"
"10041020-30-セイア" = "いや……むしろ、足取りが軽くなったよ。"
"10041020-31-セイア" = "自由の身になったからには、楽しい時間を送るべきだろう。"
"10041020-32-セイア" = "君たちと行動を共にすれば良いのだね。"
"10041020-33-カリン" = "そっ！よろしくね～！"
"10041020-34-カリン" = "よろしく頼む。他のメンバーも、ここには居ないがそれぞれの持ち場でサポートする。"
"10041020-35-トキ" = "お呼びですか？"
"10041020-36-アカネ" = "気にしなくて大丈夫ですよ。#nトキさんは引率に集中していただければと。"
"10041020-37-トキ" = "なるほど……承知しました。"
"10041020-38-カリン" = "……そういうことだから、思う存分EXPOを楽しんでくれ。"
"10041020-39-セイア" = "君たちの噂は私も知るところだ。頼りにしているよ。"
"10041020-40-セイア" = "では――"
