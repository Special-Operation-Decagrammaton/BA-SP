[translation]
"10041010-1" = "第1話;自身の証明"
"10041010-2" = "[log]1週間前[/log]"
"10041010-3-？？？" = "何故ですか？そもそも、お忘れかもしれませんが――"
"10041010-4-？？？" = "忘れるも何も、元は私の管轄。戻るだけさ。"
"10041010-5-？？？" = "君はもしかして――"
"10041010-6-？？？" = "――「[ruby=ゆりぞの]百合園[/ruby]セイア」にはできない、と。#nそう考えているのかい？"
"10041010-7-？？？" = "そうではなく……"
"10041010-8" = "[ns] \"……ん？\""
"10041010-9-？？？" = "セイアちゃん、今日はなんかご機嫌斜め？"
"10041010-10-？？？" = "今頃気づいたのか。君らしいといえばそうだが……。"
"10041010-11-？？？" = "言い方ちょっとキツくない！？"
"10041010-12-？？？" = "セイアさん落ち着いてください。#nミカさんも、まずはセイアさんのお話を伺いましょう。"
"10041010-13-？？？" = "はぁ……これ以上、言の葉を紡ぐ必要があるのかね？"
"10041010-14-？？？" = "ちゃんとお話しようって決めたばっかだと思うけど？"
"10041010-15-？？？" = "お二人とも……これではティーパーティー同士で争っていると思われかねません。"
"10041010-16-？？？" = "そもそも「争い」になるのかね？#n決定権はナギサにしかないだろう？"
"10041010-17-？？？" = "セイアちゃん！"
"10041010-18" = "[ns1] \"な、何事……？\"\n[ns2] 音がする方に向かう。"
"10041010-19-セイア" = "……？"
"10041010-20-セイア" = "先生……？"
"10041010-21-ミカ" = "何でここに……？"
"10041010-22-ミカ" = "さっきの聞こえちゃってた……？#nえっと……。"
"10041010-23-ミカ" = "別にケンカしてたわけじゃないよ！ただ……。"
"10041010-24-ナギサ" = "はぁ……。"
"10041010-25-ナギサ" = "――私がお呼びしたのです。"
"10041010-26-ミカ" = "ナギサが……？"
"10041010-27-ミカ" = "ナギちゃんが？"
"10041010-28-ナギサ" = "杞憂であればよかったのですが……念のため。"
"10041010-29-ナギサ" = "本来は自分たちで解決すべきことですが。"
"10041010-30-ミカ" = "……あっ！"
"10041010-31-ミカ" = "悩んだり、不安がある時は誰かにちゃんと相談する。"
"10041010-32-ミカ" = "……そう約束したもんね？"
"10041010-33-セイア" = "なるほど……たしかにそうだね。"
"10041010-34-セイア" = "しかし……先生を呼び出してまで説き伏せようとはね。"
"10041010-35-ミカ" = "もー、セイアちゃん、そういう言い方良くないと思う！"
"10041010-36-ナギサ" = "私は本気です。"
"10041010-37-ナギサ" = "これは、セイアさんの身を案じてこそ。"
"10041010-38-ナギサ" = "その点、どうかご理解ください……。"
"10041010-39-ミカ" = "そうだよ！ナギちゃんはセイアちゃんが心配で言ってるんだよ。"
"10041010-40-ミカ" = "たしかに普段は、誤解されるようなことばっかするけど……！"
"10041010-41-ナギサ" = "ミカさん……。"
"10041010-42" = "[ns3] \"詳しい話を聞いてもいいかな？\"\n[ns4] \"お互いにちゃんと理由があるはずだから、話し合おう。\""
"10041010-43-ミカ" = "それは私より、セイアさんのほうが適任かと。"
"10041010-44-ミカ" = "よろしければ、説明をお願いしても？"
"10041010-45-セイア" = "……意外だね。"
"10041010-46-セイア" = "私の知っているナギサはそのような振る舞いをしなかったと記憶しているが。"
"10041010-47-ナギサ" = "そういう日だってあると思うよ……？"
"10041010-48-ナギサ" = "ナギちゃんはセイアちゃんのために言ってるんだし……。"
"10041010-49-ミカ" = "ナギちゃん……。"
"10041010-50-セイア" = "……失言だった。済まない。"
"10041010-51-セイア" = "私とて理解はしている。君たちが納得できるような――"
"10041010-52-セイア" = "いや、君たちを「安心」させられるような根拠が必要なのだと。"
"10041010-53-セイア" = "もちろん、ナギサの言葉を疑うべくもない。"
"10041010-54-セイア" = "しかし君たちが私の心配をしてくれるというならば。"
"10041010-55-セイア" = "その権利は同様に、私にも有って然るべきじゃないのかい？"
"10041010-56-ナギサ" = "セイアさん……。"
"10041010-57-セイア" = "……済まない、先生。内輪のことで時間を取ってしまった。私から経緯を説明しよう。"
"10041010-58" = "[s5] \"ありがとう、よろしくね。\"\n[s6] \"何があったの？\""
"10041010-59-セイア" = "……来たる「ミレニアム[ruby=エキスポ]EXPO[/ruby]」に、誰が「トリニティの代表」として参加するかで話が平行線になっていてね。"
"10041010-60-セイア" = "ミレニアムEXPOは、ミレニアムサイエンススクールが主催する、大規模な技術披露の場だ。此度の開催にあたっては、生徒間交流を目的に、トリニティも参加することになっている。"
"10041010-61-セイア" = "そこに……ナギサと私、それぞれ自分が出席すべきだと主張しているのだよ。"
"10041010-62-セイア" = "……最近のナギサの業務量は常の倍以上となっている。#n疲労も蓄積しているだろう。"
"10041010-63-セイア" = "ただでさえ綱渡りを続けている現状だ。#n外交に回す余力が今の彼女に残っているとは到底思えない。"
"10041010-64-セイア" = "そもそも、このような対応は従来であれば私が担っていた。"
"10041010-65-セイア" = "もちろん今なお、私はティーパーティーとしての資格も不足なく満たしている。"
"10041010-66-セイア" = "……だが、ナギサは私の療養と安全を優先すべきだと譲らなくてね。"
"10041010-67-ナギサ" = "確かに、セイアさんの状態は良くなりました。ですがそれは相対的なものに過ぎません。"
"10041010-68-ナギサ" = "寛解はしていますが、完治とは言い切れない。#nこれは私個人の感想ではなく、救護騎士団の見解でもあります。"
"10041010-69-ナギサ" = "ましてやセイアさんは頼みの綱――予知能力を失っています。#n不測の事態に備えることも叶いません。"
"10041010-70-ナギサ" = "私からすれば、セイアさんは保護対象に他ならないのです。"
"10041010-71-セイア" = "またその話かい？"
"10041010-72-ナギサ" = "そういった面ではミカさんの方が安心と言えます。"
"10041010-73-ミカ" = "ナギちゃんは私のこと何だと思ってるのかなぁ？"
"10041010-74-ナギサ" = "ミレニアムサイエンススクール周辺は、比較的治安の良いエリアです。#n犯罪に巻き込まれる可能性も、そう高くはないでしょう。"
"10041010-75-ナギサ" = "しかし摩訶不思議な実験が日常的に行われており、#nそれによる事故が他の学園より頭一つ抜けて多いのも事実。"
"10041010-76-ナギサ" = "万が一、セイアさんが不慮の事故にでも遭ったら……"
"10041010-77-セイア" = "ナギサ、君ならば事故に巻き込まれないという保証でもあるのかい？"
"10041010-78-ナギサ" = "……私はセイアさんのことを言っているのです。私とは関係ありません。"
"10041010-79-ミカ" = "それはなんか違くない……？"
"10041010-80-ミカ" = "というか、何で私は候補に居ないの？"
"10041010-81-ナギサ" = "ミカさんは現状「トリニティの代表」としての立場に、無理がありますので……。"
"10041010-82-ミカ" = "あ……えへへ。そうだった、ごめんね。"
"10041010-83-セイア" = "もしミカが向かうことになっていたら……#n今度はどんな問題を起こすのかと、気が気じゃなかっただろうね。"
"10041010-84-ミカ" = "……。 "
"10041010-85" = "[s7] \"……とりあえず、話し合いができるようになったみたいでよかった。\"\n[s8] \"私はセイアの気持ちを応援してあげたいかな。\""
"10041010-86-ナギサ" = "先生、嬉しいお言葉ですが今は……。"
"10041010-87-ナギサ" = "……えっ？"
"10041010-88-ナギサ" = "セイアさんに賛成、ですか？"
"10041010-89-ナギサ" = "……セイアさんに？"
"10041010-90-セイア" = "先生？"
"10041010-91-セイア" = "……私に、か？"
"10041010-92" = "[s9] \"私もついていくなら大丈夫じゃないかな。\"\n[s10] \"何かあったらすぐに連絡するから。\""
"10041010-93-ミカ" = "あれぇ……。"
"10041010-94-ミカ" = "なんか意外……先生呼ばない方がよかったんじゃないかな、これ？"
"10041010-95-セイア" = "……彼女が受け入れるか次第ではあるが。"
"10041010-96-ナギサ" = "ええと……。"
"10041010-97-ナギサ" = "なるほど……先生のお考えはそうなのですね。"
"10041010-98-ナギサ" = "ふぅ……。"
"10041010-99-ナギサ" = "わかりました。では先生の仰るようにいたしましょう。"
"10041010-100-セイア" = "……ナギサ？"
"10041010-101-ミカ" = "あっさり認めちゃうんだ！？"
"10041010-102-ミカ" = "本当にいいの……？ナギちゃん。"
"10041010-103-ナギサ" = "みなさんの私に対するイメージは一体……？"
"10041010-104-ナギサ" = "なにも、セイアさんの外出を禁じたいわけではありません。#n身の安全を第一に考えているだけですので。"
"10041010-105-ナギサ" = "正直、先生がセイアさんに同行してくださったとしても、安全が保障されるとは考えにくいです。"
"10041010-106-ナギサ" = "ええ、私が心配性というのはよくわかっています。"
"10041010-107-ナギサ" = "それに、これまでも幾度となく私たちを助けてくださった先生のことですから。"
"10041010-108-ナギサ" = "今回も先生ならなんとかしてくださる、と――"
"10041010-109-ナギサ" = "そう――信じております。"
"10041010-110" = "[s11] \"ありがとね、ナギサ。\"\n[s12] \"きっと、なんとかなるから。心配しないで。\""
"10041010-111-ナギサ" = "はい……どうか、無事に終わりますよう。"
"10041010-112-セイア" = "……ナギサ。"
"10041010-113-セイア" = "先生を信じるのだね……私ではなく。"
"10041010-114" = "[log]現在[/log]"
"10041010-115-セイア" = "自身が一番理解しているとも。結局これは――己の問題である、と。"
"10041010-116-セイア" = "「預言の力を失った百合園セイアに価値はない」"
"10041010-117-セイア" = "……あの二人がそう思っていないことなど、百も承知だ。"
"10041010-118-セイア" = "しかし、私も所詮は子供。#n感情を完全に制御できるわけではない。"
"10041010-119-セイア" = "つまるところ、不完全で脆く……発展途上の存在なのだから。"
"10041010-120-セイア" = "然ればこそ、ミレニアムEXPOへの参加は固持せざるを得なかった。"
"10041010-121-セイア" = "やり遂げれば、他の誰でもなく……自分で自分を認められる、そう思ったんだ。"
"10041010-122-セイア" = "……私の我儘に、先生を付き合わせてしまったね。"
"10041010-123" = "[s13] \"そんなことないよ。\"\n[s14] \"必要な過程だよ。決して悪いことじゃない。\""
"10041010-124-セイア" = "また君は……。"
"10041010-125-セイア" = "そうか。少し気が楽になったよ。"
"10041010-126-セイア" = "……ならば。"
"10041010-127-セイア" = "一つ、お願いを聞いてはもらえないだろうか。"
"10041010-128-セイア" = "この試練を通して「証明」するために。"
"10041010-129-セイア" = "……自分の足で立てると、実感するために。"
"10041010-130-セイア" = "今回のミレニアムEXPOでの活動を……"
"10041010-131-セイア" = "先生、君が別途――"
"10041010-132-セイア" = "……到着か。"
"10041010-133-セイア" = "ひとまず後で……また説明しよう。"
