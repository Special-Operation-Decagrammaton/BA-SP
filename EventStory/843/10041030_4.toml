[translation]
"10041030-1" = "第3話;リオの不安"
"10041030-2" = "――1時間前。"
"10041030-3" = "セイアの出発後、リオの隠れ家にて。"
"10041030-4-リオ" = "……。"
"10041030-5-ネル" = "……？"
"10041030-6-ネル" = "んだよ急に黙り込んで……何か不安なのか？"
"10041030-7-リオ" = "……不安を口にした覚えなどないのだけれど。"
"10041030-8-ネル" = "顔に出てんだよ。"
"10041030-9-リオ" = "まさか――貴女の勘違いではなくて？"
"10041030-10-リオ" = "……いえ、違うわね。"
"10041030-11-リオ" = "……顔に出ていたかしら。"
"10041030-12-ネル" = "あたしが死ぬほど嫌いなことが二つあってな。一つは、何か話そうとして途中でやめること。もう一つは――"
"10041030-13-リオ" = "怒らせるつもりはないの。"
"10041030-14-ネル" = "分かってるから逆に腹立ってんだよ。"
"10041030-15-ネル" = "はぁ……。"
"10041030-16-ネル" = "マジでその察してオーラやめろよな。"
"10041030-17-ネル" = "言いてえことがあんなら早くしろ！このやり取り、不毛だろうがよ。"
"10041030-18-リオ" = "それは……そうだけれど……。"
"10041030-19-リオ" = "でも……貴女の反応が予測できないのも事実。#nだからより情報を収集してから……"
"10041030-20-ネル" = "情報収集する必要あるか！？仮定の話でいいだろうがよ！"
"10041030-21-ネル" = "言わねえなら、あたしは知らねえからな！"
"10041030-22-リオ" = "より適切なタイミングが――"
"10041030-23-ネル" = "あたしらしかいないのに何をそんなに心配してんだよ！"
"10041030-24-リオ" = "私たち、だけ……。"
"10041030-25-リオ" = "いいのかしら……それで。"
"10041030-26-ネル" = "あーもう、まどろっこしいな……マジでお前じゃなかったら、ここまで付き合ってないからな！？"
"10041030-27-ネル" = "いつまでうじうじしてんだよ。"
"10041030-28-ネル" = "最初から手伝うつもりがなかったらここにいねえよ。#nお前が何言おうと今更引くわけねえだろ。"
"10041030-29-ネル" = "できねえことは言うからさっさと話せ！"
"10041030-30-リオ" = "……分かったわ。"
"10041030-31-リオ" = "当初の計画にはなかった変数――[ruby=ゆりぞの]百合園[/ruby]セイアのことよ。"
"10041030-32-ネル" = "だろうな。で？"
"10041030-33-ネル" = "何かやらかしそうで心配なのか？それともあたしらの動きを察知してる気配でも？"
"10041030-34-リオ" = "いいえ。私は彼女の思考や性格を信頼しているわ。立場的にもそうならざるを得ない。"
"10041030-35-リオ" = "彼女は間違いなく「プラス」の要素よ。"
"10041030-36-リオ" = "少なくとも、その行動の如何によって、マイナスに働くことは無いと予測しているの。"
"10041030-37-ネル" = "あん？じゃあ何が問題なんだよ？"
"10041030-38-リオ" = "……問題は、彼女の内面。"
"10041030-39-リオ" = "今の彼女は……私の知る百合園セイアとは、どこか雰囲気が違った。"
"10041030-40-リオ" = "何かに追われているような……どこか焦りを感じているような言動をしているのよ。"
"10041030-41-リオ" = "彼女の口から「自分の証明」という言葉を発したことも。#n先生と来ているのにその言及を避けていることも……不自然だわ。"
"10041030-42-ネル" = "そうだな……大抵のことは先生を頼った方がスムーズに進むからな。"
"10041030-43-ネル" = "ったく、証明だの資格だの、しょうもねえ。"
"10041030-44-ネル" = "自分がねえやつらが言いそうな台詞だ。"
"10041030-45-リオ" = "……とにかく。"
"10041030-46-リオ" = "力を失ったとはいえ彼女の勘は無視できないわ。#n有用な情報源となるかもしれない。"
"10041030-47-リオ" = "とはいえあくまで「プラスアルファ」と考えるべきよ。#n最初から彼女に頼った計画を立ててはならない。"
"10041030-48-リオ" = "彼女の提案はありがたいけれど、私たちは当初の予定通りに進めるわ。"
"10041030-49-リオ" = "「ミレニアムデータセンター」に向かって、準備期間のデータを確認して来てもらえるかしら。"
"10041030-50-ネル" = "データセンターねぇ。この学園で一番セキュリティが厳しいとこだろ？"
"10041030-51-ネル" = "並の奴なら近づくことすらできねえだろうな。"
"10041030-52-リオ" = "[ruby=みかも]美甘[/ruby]ネルなら可能、という計算だったのだけれど？"
"10041030-53-ネル" = "……ハッ！"
"10041030-54-ネル" = "おいおい、たまには可愛いことも言えるじゃねえか！あたしに不可能はねえよ。"
"10041030-55-ネル" = "リオはここでのんびり待っててくれ。"
"10041030-56-ネル" = "……すぐ戻るからよ。"
