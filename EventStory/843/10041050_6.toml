[translation]
"10041050-1" = "第5話;惑い"
"10041050-2" = "――1時間前。"
"10041050-3" = "セイアの出発後、リオの隠れ家にて。"
"10041050-4-リオ" = "……ネル。"
"10041050-5-ネル" = "あん？"
"10041050-6-リオ" = "一つ聞きたいことがあるの。"
"10041050-7-リオ" = "ただ、業務とは関係のない質問なのだけれど……。"
"10041050-8-ネル" = "何だよ。"
"10041050-9-リオ" = "この質問をした時、貴女がどういう反応をするか、#nこれまでの情報を鑑みればある程度は予想できる。でも、まだ確信が持てないの。"
"10041050-10-ネル" = "で？"
"10041050-11-リオ" = "これを聞いたらあなたは――"
"10041050-12-ネル" = "っとによぉ！？"
"10041050-13-ネル" = "いい加減にしろよな！？"
"10041050-14-ネル" = "言いたいことがあるなら早く言え！"
"10041050-15-リオ" = "……ごめんなさい。"
"10041050-16-リオ" = "……[ruby=ゆりぞの]百合園[/ruby]セイアの件よ。"
"10041050-17-ネル" = "何かトラブルでも起こしそうだからか？それとも情緒不安定に見えるからか？"
"10041050-18-リオ" = "いえ、彼女の能力は申し分ない。信頼に値するわ。"
"10041050-19-リオ" = "ただ……さっきのやり取りが。"
"10041050-20-ネル" = "……なんか言ってたか？"
"10041050-21-ネル" = "……ああ。そういえばちょっと言い争ってたな。"
"10041050-22-リオ" = "ええ。彼女はすぐに納得して、反省の言葉を口にした。"
"10041050-23-リオ" = "でも、他人に見せる姿と本音は違うのだと。#n私も最近理解し始めるようになったの。"
"10041050-24-リオ" = "だから……もし、彼女が……"
"10041050-25-リオ" = "私の発言で……気分を害していたりなどしていたら……と。"
"10041050-26-ネル" = "……は？"
"10041050-27-リオ" = "負の感情を抱いてはいないだろうか、という懸念よ。"
"10041050-28-リオ" = "よく理解できないというなら説明を変えるわ。彼女の内面と感情的な問題で――"
"10041050-29-ネル" = "いや、分からないとかじゃなくて。"
"10041050-30-ネル" = "つまり、嫌われてたらどうしよう？ってことだよな？"
"10041050-31-リオ" = "……そこまでは言ってないわ。"
"10041050-32-ネル" = "いや、そういうことだろ。"
"10041050-33-リオ" = "でも……あの時、私はああ言うしかなかった。"
"10041050-34-リオ" = "これは学園に関わる問題よ。自分の感情よりも遥かに重大だわ。"
"10041050-35-リオ" = "彼女を説得しなければならなかった。#n説得するには、全ての理由を挙げるしかなかった。"
"10041050-36-リオ" = "けれど、それはそれとして。#n彼女が私に否定的な眼差しを向けると考えると……"
"10041050-37-リオ" = "私は……"
"10041050-38-ネル" = "んっとによぉ！"
"10041050-39-ネル" = "気にするとこがそこかよ！？"
"10041050-40-ネル" = "その程度で嫌うならそもそも協力関係なんかになってねえだろ！？"
"10041050-41-ネル" = "あれはそういうのでもないことくらい、見りゃ分かんだろ。"
"10041050-42-ネル" = "それに、譲れねえラインだったんだろ？じゃあ仕方ないんじゃねえの？"
"10041050-43-ネル" = "つか、言いたい放題言った後で、うじうじ悩むなよ。"
"10041050-44-ネル" = "言った言葉の取り返しなんてつかねえんだから。"
"10041050-45-ネル" = "ってか、あたしのことはどうなんだ？"
"10041050-46-ネル" = "何であたしには聞いてこないんだ？"
"10041050-47-リオ" = "……美甘ネル。"
"10041050-48-リオ" = "貴女はその場で反論するもの。今までのデータがそれを証明しているわ。"
"10041050-49-リオ" = "私がどのように接しても、貴女は自分の感情と判断を優先する。違う？"
"10041050-50-ネル" = "それは単細胞って意味か？"
"10041050-51-リオ" = "別にそういう意味ではなかったのだけれど……。"
"10041050-52-リオ" = "理解を得るにあたって、その表現が分かりやすいと言うのであれば……そうね。そうとも言えるわ。"
"10041050-53-ネル" = "あたしが単細胞なのは認めるけど、言っていいことと悪いことがあるだろうがよ！#n今まで我慢してたけどもう無理だ！"
"10041050-54-リオ" = "ち、ちょっと……！今データ検索を……！ "
"10041050-55-リオ" = "……！！監視網に反応が！"
"10041050-56-リオ" = "ふぃ、フィットネスセンターよ！ここに向かってちょうだい、ネル！"
"10041050-57-ネル" = "あーもう！！！知るかよ！！"
