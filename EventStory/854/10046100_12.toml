[translation]
"10046100-1" = "夏、問題児、浜辺にて"
"10046100-2-イチカ" = "……はい？"
"10046100-3-ナギサ" = "ですから、ビーチを一般開放することにしました。"
"10046100-4-ナギサ" = "また、宣伝も兼ねてクロノススクールの報道部もお呼びしています。"
"10046100-5-イチカ" = "やっぱり、別荘の件が原因で……？"
"10046100-6-ナギサ" = "いえ、それは関係ありませんので、ご心配なく。"
"10046100-7-ナギサ" = "イチカさん……このビーチを、どう思いますか？"
"10046100-8-イチカ" = "えーっと……綺麗、ですね？"
"10046100-9-ナギサ" = "同感です。私も、とても美しいと思っています。"
"10046100-10-ナギサ" = "それを、ただ寝かせておくのは勿体ないと思いまして。#nせっかくなら、皆さんに使っていただこうかと。"
"10046100-11-イチカ" = "は、はぁ……いいお考えだと思います。"
"10046100-12-イチカ" = "それで……私が呼ばれた理由は……？"
"10046100-13-ナギサ" = "一つ、お願いしたいことがありまして。"
"10046100-14-ナギサ" = "このバカンスの期間中、ビーチのパトロールをしていただきたいのです。"
"10046100-15-イチカ" = "パトロール、ですか？"
"10046100-16-ナギサ" = "ええ。夏休み真っ只中ですし、オープン直後は大勢の方で賑わうでしょう。#nその分、事件や事故が起きやすくなります。"
"10046100-17-ナギサ" = "事と次第によっては、ティーパーティーが責任を問われることにもなりかねません。"
"10046100-18-イチカ" = "なるほど……。#n承知しました。"
"10046100-19-ナギサ" = "急なお願いとなり、申し訳ありません。"
"10046100-20-イチカ" = "いえいえ。任せてください！"
"10046100-21-ナギサ" = "ふふ、頼もしいですね。"
"10046100-22-ナギサ" = "ですが、そこまでハードな任務にはならないとも思っています。#nどうにも私は心配しすぎるきらいがありますから。"
"10046100-23-ナギサ" = "イチカさんも一人の観光客として、#n無理のない範囲で対応していただければ大丈夫ですので。"
"10046100-24-ナギサ" = "早々、大きな問題など起こりませんから。"
"10046100-25-？？？" = "ハーハッハッハッハ！！"
"10046100-26-カスミ" = "許可は得た！もはや邪魔するものはなにもないっ！！#nさあ、温泉開発に取りかかるぞ！！"
"10046100-27-メグ" = "みんな！部長に続けーっ！！"
"10046100-28-チンピラA" = "ふっふっふ、準備は整った。"
"10046100-29-チンピラB" = "オープンしたてのビーチにまともな店があるわけねぇからな。#nがっぽり稼がせてもらおうぜ！"
"10046100-30-チンピラA" = "この発想とフットワークの軽さ……うちら、商売の天才じゃない？"
"10046100-31-ハルナ" = "あら？#nこちらのお店……焼きそばが7000円、アイスは3000円……なるほど。"
"10046100-32-ハルナ" = "値段に見合うだけの自信がある……そう解釈してよろしいのでしょうか？"
"10046100-33-アカリ" = "美食研究会として、味見しないわけにはいきませんよね★"
"10046100-34-イチカ" = "はは、大きな問題なんて起こらない……。"
"10046100-35-イチカ" = "起こらない……。"
"10046100-36-イチカ" = "――起こさせないっす。"
