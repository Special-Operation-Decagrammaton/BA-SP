[translation]
"10052060-1" = "ケテル：最もきらびやかに輝く至高の王冠 "
"10052060-2-トキ" = "ケテルのエリアに進入しました。"
"10052060-3-トキ" = "未だに意味は分かりませんが、セフィラの数字は1だそうです。"
"10052060-4-アリス" = "おぉ……すごいです、トキ！アリスはそれすら知りませんでした！"
"10052060-5-トキ" = "預言者の表記情報を読んだだけですよ。かわいいアリス。"
"10052060-6-アリス" = "トキは几帳面なのですね！十分すごいと思います！"
"10052060-7-アリス" = "ありがとうございます。なでなでしてあげます。"
"10052060-8-アリス" = "はい！"
"10052060-9-ヒマリ" = "ケテルは1番目の預言者とも言えますが……。"
"10052060-10-ヒマリ" = "私たちがケテルに遭遇したのは、ずいぶん後になってからでしたね。"
"10052060-11-ヒマリ" = "覚えていますか？廃墟の水没地区でのこと。"
"10052060-12" = "[s] \"うん。鬼ごっこをしたよね。\""
"10052060-13-ヒマリ" = "ええ。私たちが鬼側でしたね。"
"10052060-14" = "[s] \"珍しくヒマリも現場に来てたっけ。\""
"10052060-15-ケイ" = "その話は私も知っています。#nデカグラマトンを直接見たくて、子供のように目を輝かせ、興奮していたと。"
"10052060-16-ケイ" = "私も似たような話を聞きました。"
"10052060-17-ヒマリ" = "……2人とも、一体誰にそんなデマを吹き込まれたのですか？#nさては、リオですね？"
"10052060-18-トキ" = "エイミです。"
"10052060-19-ヒマリ" = "そうでしたか……#nエイミったら、たまに物事を直観的に捉えることができないのですよね。"
"10052060-20-エイミ" = "私は見たままを正直に言っただけだよ？"
"10052060-21-ヒマリ" = "エイミ！？"
"10052060-22-リオ" = "（本当だったのね……）"
"10052060-23-アリス" = "大丈夫です、ヒマリ先輩！#nアリスも新しいゲームの発売前日には、そういう気分になりますから！"
"10052060-24-ヒマリ" = "そ、そうですか？#nあ、いえ、別にあの時の私は興奮したり、はしゃいだりしてませんでしたからね？"
"10052060-25-ヒマリ" = "デカグラマトンという「現象」の1つをこの目で確かめたら、騒動に決着をつけられるかもしれない。そんな期待をしていただけです。"
"10052060-26-ヒマリ" = "結局、1つ片づいたと思ったら、また別の可能性が広がってしまい……。"
"10052060-27-ヒマリ" = "気づけば今の状況に至ってしまった、というわけです。"
"10052060-28-ヒマリ" = "この結果を予測し、備えることができなかったのは、私としては痛恨のミスでした。"
"10052060-29-トキ" = "ヒマリ部長、私の知らない間に予言能力でも得たのですか？"
"10052060-30-ヒマリ" = "まさか。#nもちろん、私がオカルトを研究する理由の1つではありますが……。"
"10052060-31-ヒマリ" = "その領域については、確実な答えを得られていない状況です。"
"10052060-32-トキ" = "でしたら、どうして予測できなかった結果にまで、わざわざ責任をとろうとしているのですか？"
"10052060-33-ヒマリ" = "……！"
"10052060-34-リオ" = "（よく言ってくれたわ、トキ）"
"10052060-35-ケイ" = "よく言ってくれましたね、トキ。"
"10052060-36-ユズ" = "あの……お話し中にごめんなさい……。"
"10052060-37-ユズ" = "また降下するんですか！？"
"10052060-38-ヒマリ" = "そうよ。それが最も合理的だもの。"
"10052060-39-ヒマリ" = "ええ。一番戦略的な方法です。"
"10052060-40-ヒマリ" = "地上ルートで、ケテルの十字砲火を突破するのは困難ですので。"
"10052060-41-ヒマリ" = "降下時の安全性については心配いりませんよ。"
"10052060-42-ヒマリ" = "それに、降下作戦はすでに何度も経験しているではないですか。"
"10052060-43-ユズ" = "け、経験が多いからって怖くないわけじゃなくて……！"
"10052060-44-トキ" = "珍しくユズが積極的に発言していますね。#nこれは本気で怖がっている証拠です。"
"10052060-45-ヒマリ" = "ですが降下用のポッドは、ゲーム開発部の皆さんの意見を積極的に反映しているのですよ？"
"10052060-46-ユズ" = "わたしが使うことになるとは思わなかったんです！"
"10052060-47-リオ" = "みんな、降下の時間よ。準備してちょうだい。"
"10052060-48-トキ" = "ひぃぃっ！？"
"10052060-49-トキ" = "ユズ、大丈夫ですか？"
"10052060-50-ユズ" = "や、やっぱり、これは……！"
"10052060-51-ユズ" = "降下チームはポッドに搭乗してください。繰り返します――"
"10052060-52-SYSTEM" = "降下用ポッド射出準備、完了。"
"10052060-53-エイミ" = "じゃあ、始めよっか。"
"10052060-54-トキ" = "先頭はお任せください。"
"10052060-55-エイミ" = "ヒマリ部長、モモイ。フォローはよろしくね。"
"10052060-56-ユズ" = "ひぃぃぃぃぃっ……！"
"10052060-57-ヒマリ" = "降下開始！"
"10052060-58-モモイ" = "よぉし……このレバーを押せばいいんだよね？"
"10052060-59-ミドリ" = "お姉ちゃん……お願いだから慎重にね。"
"10052060-60-モモイ" = "私は大真面目だよ！"
"10052060-61-ユズ" = "きゃぁぁぁああああぁぁぁ――！！！"
"10052060-62-リオ" = "（鬼気迫る悲鳴ね……）"
