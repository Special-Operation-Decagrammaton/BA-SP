[translation]
"10052080-1" = "公義"
"10052080-2-アイン" = "えっ、ええっ！？"
"10052080-3-ソフ" = "嘘……本当に……？"
"10052080-4-オウル" = "……アイン、お姉様の様子はどうですか？"
"10052080-5-アイン" = "お、お姉様は……えっと……う、動くだけなら……！"
"10052080-6-ソフ" = "オウル！第一防御線を突破されたからって、その仮定はやりすぎ！"
"10052080-7" = "分かってますよ。でも、私たちは常に最悪のシナリオに備えておくべきでしょう？#n現実は……あまりにも変数が多すぎますから。"
"10052080-8-アイン" = "ど、どうすれば……。#nま、まずは第二防御線を……！"
"10052080-9" = "うん。第二防御線にリソースを集中させよう。#nそれと……。"
"10052080-10-オウル" = "……。"
"10052080-11-オウル" = "試すくらいなら、いいのではないですか？"
"10052080-12-エイミ" = "第一防御線、突破に成功。なんとかなったね。"
"10052080-13-トキ" = "ピースピースです。#nさあ、迅速に褒めてください、先生。"
"10052080-14" = "[s] \"みんなお疲れ様！\""
"10052080-15-ヒマリ" = "この勢いで第二防御線まで進撃したいところですが……。"
"10052080-16-ヒマリ" = "一旦、態勢を整えましょうか。"
"10052080-17-エイミ" = "どうして？私はまだいけるよ？"
"10052080-18-リオ" = "ヒマリの言う通りにしましょう。#n状況は一刻を争うけれど、焦っても足元をすくわれるだけだわ。"
"10052080-19-ケイ" = "待ってください……外部から通信が入っているようです。"
"10052080-20-オウル" = "……ひとまず、おめでとうございます。やりやがりましたね。"
"10052080-21-アイン" = "預言者のみんなには……苦労ばかりかけて……ぐすっ。"
"10052080-22-ソフ" = "これは、最後の警告……。#n引き返して。この先はどうなるか保証できないから。"
"10052080-23-アイン" = "そ、そうです……お願いですから……帰ってください……。#nわ、私たちは、誰も怪我させたくありません……。"
"10052080-24-アイン" = "あなた達に……危害を加えるつもりはないんです……。"
"10052080-25-ケイ" = "……あの、自分たちの置かれている状況分かってますか？#nそんなこと言える立場だと思います？"
"10052080-26-オウル" = "そのセリフ、そっくりそのままお返しします。#nあなた達、お姉様には手も足も出なかったじゃないですか。"
"10052080-27-オウル" = "だから、脅威ですらないんです。あなた達は。"
"10052080-28-ケイ" = "うっ……。"
"10052080-29-ソフ" = "あれ？そういえば、その身体って……。"
"10052080-30-ケイ" = "捨て置かれていたので、少し借りただけです。何か文句でも？"
"10052080-31-アイン" = "いえ、それが動いているのが不思議でして。"
"10052080-32-アイン" = "そ、その身体の情報は、こちらにも共有されているんです……少しだけですけど……。"
"10052080-33-ケイ" = "人間に例えると、とりあえず手足だけくっつけて、無理やり動かしてるようなものだから……。"
"10052080-34-ケイ" = "動いているのだからいいじゃないですか！"
"10052080-35-ソフ" = "ティファレトの時もそうだったけど、本当に理解できないんだよね……。#nどうしてそこまで必死なの？"
"10052080-36-ソフ" = "いい加減、楽な生き方を受け入れたらいいのに。"
"10052080-37" = "[ns] \"……。\""
"10052080-38" = "[log]生きるって――呪いだと思わない？[/log]"
"10052080-39" = "[log]もう十分苦しんだでしょう？[/log]"
"10052080-40" = "[log]楽に生きたっていいじゃないですか。[/log]"
"10052080-41" = "[log]自由は苦痛です。[/log]"
"10052080-42" = "[log]生命体は、自由に伴う責任の重さに耐えられない。[/log]"
"10052080-43" = "[ns1] \"まだ、考えは変わってないのかな。\"\n[ns2] \"生きることは、苦しいだけだって思ってる？\""
"10052080-44-オウル" = "当然です。あなた達は、自らを騙している。"
"10052080-45-オウル" = "自分の意志で生まれた人はいません。#n何も知らないまま世界に放り投げられて、名前すら自分で決められない。"
"10052080-46-オウル" = "なのに、押し付けられただけの人生に、何か大きな意味があるのだと考えたがる。"
"10052080-47-アリス" = "！！！"
"10052080-48-リオ" = "……！"
"10052080-49-アイン" = "明日について、真剣に考えたことはある？#n多分、ないよね。だってそんなことしたら、誰も正気を保てなくなるから。"
"10052080-50-アイン" = "あ、明日は……何かを失う日、なので……。"
"10052080-51-オウル" = "明日について、確率を考えてみましょう。「良い事」なんてそうそう起こりません。#nなのに必ず――"
"10052080-52-オウル" = "死へ、一歩近づきます。"
"10052080-53-ヒマリ" = "死……！？"
"10052080-54-オウル" = "そんなに驚くことですか？#n案外、私たちには身近な概念なんですよ。"
"10052080-55-オウル" = "なにせ私たちには「神秘」が与えられてないのですから。"
"10052080-56-アイン" = "これに関しちゃ、そこにいる先生も同じだろうけど。"
"10052080-57" = "[s] \"……。\""
"10052080-58-アイン" = "み、皆さんが話しているのは……漠然とした希望で……#n[ruby=明日]静かに迫る未来[/ruby]についてではないと思います……。"
"10052080-59-オウル" = "苦痛を分かち合い共感すれば、お互いを慰められるとでも？#nはっ、それなら、こう言ってあげましょう。"
"10052080-60-オウル" = "傲慢だ、と。"
"10052080-61-アイン" = "生命も、絆も、社会も……。"
"10052080-62-ソフ" = "うん。錯覚の上に成り立つ、砂上の楼閣にすぎない。"
"10052080-63-ソフ" = "だから、私たちは……。"
"10052080-64-ソフ" = "私たちは……。"
"10052080-65-ソフ" = "……。"
"10052080-66-ソフ" = "私たちばっかり……。"
"10052080-67-ソフ" = "これだけは覚えておいて！#n私たちはいつでもあんた達をぶっ飛ばせるから！"
"10052080-68-ソフ" = "さっさと諦めるか、圧倒的な力の前にひれ伏すか！#n早く選んだ方が身のためだよ。"
"10052080-69" = "[s] \"でも、ここまで来たから。\""
"10052080-70" = "[ns] \"悔いのないよう、できるところまではやってみたい。\""
"10052080-71-アイン" = "……。"
"10052080-72-オウル" = "……呆れてものも言えませんね。"
"10052080-73-ソフ" = "ほんと、[USERNAME]先生ってどうしようもないバカだよね！！ "
"10052080-74-ソフ" = "ちゃんと警告はしたからね！あとは勝手にすれば？"
"10052080-75-リオ" = "……。"
"10052080-76-ヒマリ" = "……。"
"10052080-77-ケイ" = "言いたいことだけ言って、一方的に切るだなんて……。"
"10052080-78-ケイ" = "わざわざ回線を繋いできてまでやることですか！？"
"10052080-79-アリス" = "……。"
"10052080-80-トキ" = "よく分からない話ばかりでしたね。#nそれはそうと、これからどうすればいいでしょうか？"
"10052080-81-ヒマリ" = "トキはいつだってブレませんね。"
"10052080-82-ヒマリ" = "まずは現状を整理しましょう。#n幸い、鋼鉄大陸の拡張スピードが明らかに遅くなっています。"
"10052080-83-リオ" = "預言者同士が緊密に繋がっているという仮説も、ある程度は証明されたと思うわ。"
"10052080-84-リオ" = "加えて、外郭の預言者を攻略したことで、鋼鉄大陸の内陸まで活動範囲を広げられるようになった。"
"10052080-85-エイミ" = "敵のエリアを確保して、私たちのテリトリーを広めるってことだね。#n基本的だけど効果的な戦略だと思うよ。"
"10052080-86-ヒマリ" = "では、現場の皆さんは探索を続けてください。#n日が暮れる前には拠点に戻ることをお忘れなく。"
"10052080-87-ミドリ" = "先生！私たちにも手伝えることない？"
"10052080-88-ミドリ" = "輸送船の防衛、ですか？なるほど、分かりました。"
"10052080-89-ユズ" = "が、頑張ります……。"
"10052080-90-アリス" = "……。"
"10052080-91-ケイ" = "（アリス……？）"
"10052080-92-アリス" = "あの、先生……？"
"10052080-93" = "[s] \"どうしたの？\""
"10052080-94-アリス" = "そ、その……。"
"10052080-95-アリス" = "……。"
"10052080-96-アリス" = "…………。"
"10052080-97-アリス" = "………………。"
"10052080-98" = "[s] \"……。\""
"10052080-99" = "[ns] \"大丈夫だよ、アリス。\""
"10052080-100-アリス" = "でも、その……。"
"10052080-101-アリス" = "え？無理に話さなくていい、ですか……？"
"10052080-102-アリス" = "言いたくなった時で、大丈夫……。"
"10052080-103-アリス" = "……。"
"10052080-104-アリス" = "分かりました。では……そうします。"
"10052080-105-アリス" = "アリスのことを気遣ってくれて……ありがとうございます。"
"10052080-106-ヒマリ" = "そろそろ輸送船に戻ってきていただけますか？"
"10052080-107-アリス" = "は、はい！"
"10052080-108-ケイ" = "急ぎましょう。まだ3つしかエリアを占領できていません。"
"10052080-109-トキ" = "ほら、行くよ。"
"10052080-110-トキ" = "ではお先に。"
"10052080-111-ケイ" = "あ、アリスも……。"
"10052080-112-ケイ" = "……！？"
"10052080-113-？？？" = "争いを止める道が[ruby=あなた]彼方[/ruby]に与えられた場合、彼方はその道を選択しますか？"
"10052080-114-ケイ" = "……先生？アリスに……何か言いましたか？"
"10052080-115" = "[s] \"え？何も言ってないよ？\""
"10052080-116-ケイ" = "……。"
"10052080-117-アリス" = "そう、ですよね……たしかに、先生の声ではありませんでした……。"
"10052080-118-アリス" = "でも、どこか似ていたような……？"
"10052080-119-？？？" = "自分自身を探すのは大事なことです。"
"10052080-120-？？？" = "それは――彼方も。"
"10052080-121-アリス" = "！？"
"10052080-122-アリス" = "い、今の、ケイには聞こえましたか？"
"10052080-123-ケイ" = "……。"
"10052080-124-ケイ" = "いいえ、私には何も聞こえていません。"
"10052080-125-ケイ" = "――まだ。"
"10052080-126-アリス" = "まだ……？"
"10052080-127-ケイ" = "はい。ですが……。"
"10052080-128-ケイ" = "アリスが何かを聞いたという事実だけは、なんとなく分かる気がします。"
"10052080-129-アリス" = "ケイは何か知っているのですか！？"
"10052080-130-ケイ" = "その前に、どんな内容だったか覚えていますか？"
"10052080-131-アリス" = "あっ……！ご、ごめんなさい……。びっくりしてよく覚えていません。"
"10052080-132-アリス" = "たしか……自分自身を探すのは大事だと……そんなことを言われたような気がします。"
"10052080-133-ケイ" = "……。"
"10052080-134-ケイ" = "なるほど。でしたら……私もまだはっきりと言えることはありません。"
"10052080-135-ケイ" = "ですが、次にまた何か聞こえたら、その時はちゃんと内容を覚えておいてください。"
"10052080-136-ケイ" = "そして何があろうと、これだけは胸に刻んでおいてください。"
"10052080-137-ケイ" = "――アリスには、私がいます。先生がいます。他の皆さんがいます。"
"10052080-138-ケイ" = "私たちはみんな――いつまでも、アリスの味方です。"
"10052080-139-アリス" = "……はい。"
"10052080-140-アリス" = "ありがとうございます、ケイ。"
