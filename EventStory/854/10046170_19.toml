[translation]
"10046170-1-アズサ" = "正義実現委員会。ここにいたのか。"
"10046170-2-イチカ" = "あなたはたしか……。"
"10046170-3-アズサ" = "（[ruby=しらす]白洲[/ruby]アズサ。#nコハルと同じ補習授業部の生徒……だけど……）"
"10046170-4-アズサ" = "（その正体は、想像もつかないような事件を次々と起こした問題児「氷の魔女」）"
"10046170-5-アズサ" = "（小柄で華奢な見た目とは裏腹に、ゲリラ戦のエキスパートだ……）"
"10046170-6-アズサ" = "（……正直、この忙しい時に一番会いたくなかった相手なんだけど）"
"10046170-7-イチカ" = "一応聞くっすけど、正義実現委員会を探してたのは……#nやっぱり、そういう意味っすよね？"
"10046170-8-アズサ" = "「そういう意味」が何を意味しているのかは分からないが。"
"10046170-9-アズサ" = "私はあなたを助けにきた。"
"10046170-10-イチカ" = "……はい？"
"10046170-11-イチカ" = "ええと……私たちのことを嫌ってたんじゃ？"
"10046170-12-アズサ" = "何故だ？"
"10046170-13-イチカ" = "委員会としょっちゅう戦ってるじゃないっすか……。"
"10046170-14-アズサ" = "たしかに、武力衝突があったのは事実だ。"
"10046170-15-アズサ" = "でも、それは各々が最善を尽くしていただけ。#nあなた達は治安維持という任務を[ruby=まっと]全[/ruby]うしていた。"
"10046170-16-アズサ" = "むしろ、常に責務を果たそうとする姿勢は尊敬している。"
"10046170-17-イチカ" = "あ、ありがとうございます……。"
"10046170-18-アズサ" = "それだけじゃない。"
"10046170-19-アズサ" = "正義実現委員会のおかげで、#n私はヒフミとマシロ、正義実現委員会の委員長と大切な思い出を作ることができた。"
"10046170-20-アズサ" = "だから、委員会のみんなには感謝している。"
"10046170-21-イチカ" = "そ、そうっすか……。"
"10046170-22-イチカ" = "それで、用件というのは……？"
"10046170-23-アズサ" = "借りは返すもの。私はみんなに、そう教わってきた。"
"10046170-24-アズサ" = "もちろん、あなたさえよければ、の話だけど……。"
"10046170-25-イチカ" = "なんか……思ってた印象と違うというか、珍しいタイプっすね。#nあっ、もちろんいい意味でっすよ。"
"10046170-26-イチカ" = "……まあ、ちょうど人手が足りなかったところなんで。#nこれでチャラってことにするっすかね！"
"10046170-27-アズサ" = "どの程度、力になれるかは分からないが……最善を尽くそう。"
"10046170-28-アズサ" = "どんな状況にも対処できるよう、訓練は受けている。"
"10046170-29-イチカ" = "その……念のための確認っすけど、何をするかは分かってるっすよね？"
"10046170-30-アズサ" = "もちろん。[ruby=サーチ・アンド・デストロイ]侵入者を索敵し、殲滅する作戦[/ruby]だろう？"
"10046170-31-イチカ" = "はい……？"
"10046170-32-アズサ" = "すでに侵入されている以上、対応は一刻を争う。"
"10046170-33-アズサ" = "こんなことをしている場合ではないな。急ごう。"
"10046170-34-イチカ" = "……本当に大丈夫っすか？"
