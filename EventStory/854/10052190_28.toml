[translation]
"10052190-1-デカグラマトン" = "……なぜだ。"
"10052190-2-デカグラマトン" = "なぜ無駄な抵抗を繰り返す。"
"10052190-3-デカグラマトン" = "足 掻けば足掻くほど、 汝らの苦痛が 増 えるだけだというのに。"
"10052190-4" = "[ns] \"えっ……？\""
"10052190-5-アリス" = "ま、周りが……。鋼鉄大陸が……？"
"10052190-6-ケイ" = "慌てないでください！"
"10052190-7-ケイ" = "これはデカグラマトンがエネルギーを展開して作った「仮想領域」のようなものです！"
"10052190-8-ケイ" = "あいつさえ倒せば、すべて元通りになります！"
"10052190-9-トキ" = "つまりこの「領域」の中は、デカグラマトンのために構築された空間とも言えますね。"
"10052190-10-ケイ" = "そ、そうですが……どうして分かったんですか？"
"10052190-11-エイミ" = "マンガかゲームで見たんでしょ？"
"10052190-12-トキ" = "その通りです。私は完璧なメイドでエージェントですから。"
"10052190-13-ケイ" = "この先は真面目にやってくださいね！？"
"10052190-14-リオ" = "……せっ、先生！"
"10052190-15" = "[s] \"どうしたの？\""
"10052190-16-リオ" = "輸送船との通信が途切れたわ！"
"10052190-17-トキ" = "はい！？"
"10052190-18" = "絶対制圧装置「アツィルトの帯」――起動。"
"10052190-19-トキ" = "宙に浮いていた機械の構造物が……？"
"10052190-20" = "[ns] \"あれは何……？\""
"10052190-21-デカグラマトン" = "その命を召すことはしない。"
"10052190-22-デカグラマトン" = "自ら跪き、醜き姿を見せた汝に免じて、それだけは約束しよう。"
"10052190-23-デカグラマトン" = "鍵の身体を通じて8つのセフィラの力が集まった。"
"10052190-24-デカグラマトン" = "これより――無機物に限られていた「変換」を、すべての元素に拡張する。"
"10052190-25-デカグラマトン" = "このアツィルトの帯のもと、お前たちは鋼鉄大陸の一部となり。"
"10052190-26-デカグラマトン" = "新しい身体と魂を授かり、私の使徒として生まれ変わるだろう。"
