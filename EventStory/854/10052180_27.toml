[translation]
"10052180-1" = "怒りの日"
"10052180-2" = "[log][FF6666]新しい天と新しい地とを見た。[/log]"
"10052180-3" = "[log][FF6666]先の天と地とは消え去り、[/log]"
"10052180-4" = "[log][FF6666]海もなくなってしまった。[/log]"
"10052180-5-モモイ" = "ええっ！？なにこれ！？"
"10052180-6-ミドリ" = "わ、私たち……空に引っ張られてる！！！"
"10052180-7-リオ" = "鋼鉄大陸のエネルギーが……再び祭壇へ集まり始めたわ……！"
"10052180-8-デカグラマトン" = "この地を渡れば、廃れた山の頂に祭壇を築け。"
"10052180-9-デカグラマトン" = "その炭火が汝の唇に触れ、汝は清められる。"
"10052180-10-デカグラマトン" = "[ruby=CAST IN THE NAME OF GOD]神の名においてこれを行い[/ruby]、[ruby=YE NOT GUILTY]ここに罪はない[/ruby]。"
"10052180-11-トキ" = "ここは……？"
"10052180-12-リオ" = "……「祭壇」ね。"
"10052180-13-エイミ" = "先生はさっきこんな場所にいたんだね……。"
"10052180-14" = "[s] \"うん……。\""
"10052180-15-ユズ" = "で、でも、どうしてわたしたちをここに……？"
"10052180-16-トキ" = "おそらく、自分の根城に「招待」してくれたのでしょう。"
"10052180-17-トキ" = "この表現が正しいかは分かりませんが、とんだ自意識過剰です。"
"10052180-18-ユズ" = "と、トキさん！？そ、そういうのは、あんまりこういう時は……。"
"10052180-19" = "[ns] \"ヒマリ！輸送船をここに呼べる？\""
"10052180-20-ヒマリ" = "ええ……可能です。この近くに駐機させてありますので。"
"10052180-21-ヒマリ" = "ですがどうして……？"
"10052180-22" = "[ns1] \"とりあえず輸送船に戻って！\"\n[ns2] \"それから、集めた預言者のコアの分析もお願い……！\"\n[ns3] \"あと、遠隔でデータ支援もしてもらえると助かる！\""
"10052180-23" = "[ns] （そして、いざとなったら……！）"
"10052180-24-ヒマリ" = "勢いでされるお願いにしては大仕事ですね。"
"10052180-25-ヒマリ" = "（まさか、いざというときを見越して……！？）"
"10052180-26-ヒマリ" = "（ですがその時、先生は……？）"
"10052180-27-ヒマリ" = "……。"
"10052180-28-ヒマリ" = "…………。"
"10052180-29-ヒマリ" = "………………。"
"10052180-30-ヒマリ" = "……分かりました。"
"10052180-31-ヒマリ" = "ユズ！モモイ！ミドリ！ついて来てください！"
"10052180-32-ミドリ" = "わ、私たち！？"
"10052180-33-ミドリ" = "ヒマリ先輩！？"
"10052180-34-ユズ" = "きゃっ！？"
"10052180-35-ケイ" = "……。"
"10052180-36" = "[ns] \"大丈夫？\""
"10052180-37-ケイ" = "……人の心配している場合ですか。"
"10052180-38-ケイ" = "まぁ、正直に死にそうです。手足に重りをつけているような気分ですよ。"
"10052180-39-ケイ" = "ですがこうしている間にも、あいつは2つ目の神体にエネルギーを集中させようとしています。"
"10052180-40-ケイ" = "エネルギーの柱の中に隠れてコソコソと……もう何なんですか。#n世界が自分を中心に回っていないと気が済まないんですか？"
"10052180-41-アリス" = "ケイ……？本当に大丈夫ですか……？"
"10052180-42-ケイ" = "大丈夫ですよ。#n……大丈夫じゃないですけど、大丈夫です。"
"10052180-43-ケイ" = "あいつに一発喰らわしてやらなければ……。"
"10052180-44-アイン" = "……。"
"10052180-45-ソフ" = "…………。"
"10052180-46-オウル" = "………………。"
"10052180-47-ケイ" = "死んでも！腹の虫が収まりませんから！！"
