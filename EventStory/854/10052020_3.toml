[translation]
"10052020-1" = "JEHOVAH ELOHIM"
"10052020-2-リオ" = "ポイントオスカー、到着。では……始めるわ。"
"10052020-3" = "[s] \"何か手伝えることはある？\""
"10052020-4-リオ" = "いえ、大丈夫よ。任せておいてちょうだい。#nまず……[ruby=ヘッド・マウント・ディスプレイ]このHMDを使[/ruby]って、このエリアのネットワークに接続するわ。"
"10052020-5-ケイ" = "単なる視覚情報の入出力だけでは足りないと思いますが……ああ、なるほど。#nそのスーツに、生体電流を増幅する装置が搭載されているのですね。"
"10052020-6-リオ" = "ええ。だからHMDを通じて、このエリアのネットワークを1つの概念空間として認識できるようになるの。"
"10052020-7-リオ" = "その中のすべてのデータは、3次元の座標を持ったまま可視化され、無限の空間の中で――"
"10052020-8-モモイ" = "だー！分かった！分かんないのが分かったから大丈夫！"
"10052020-9-リオ" = "え、ええ……？"
"10052020-10-モモイ" = "もっと分かりやすく！3行でまとめて！"
"10052020-11-ミドリ" = "うん、今回はお姉ちゃんに賛成。"
"10052020-12-ミドリ" = "あ、もちろん、リオ会長が丁寧に説明しようとしてくれてるのは分かってます。#nでも、今はあまり時間が無いので……。"
"10052020-13-ユズ" = "（わたしにはちょうどいい説明だったけど……）"
"10052020-14" = "[ns] \"改めて、私たちにもできることあるかな？\""
"10052020-15-リオ" = "そうね……私が無事に戻ってくるまで、周囲の防衛を頼めるかしら。"
"10052020-16-リオ" = "ダイブしている間、私は無防備な状態だから。"
"10052020-17-リオ" = "ケイは、万が一のために私のサポートをしてちょうだい。"
"10052020-18-ユズ" = "じゃあミドリ！ユズ！見回りに行こう！"
"10052020-19-ケイ" = "サポートと言われましても……。"
"10052020-20-ケイ" = "見たところ、HMDはその1つしか用意していませんよね？"
"10052020-21-リオ" = "ええ。だから――"
"10052020-22-リオ" = "もしもの時は、貴女が引き継いでほしいの。"
"10052020-23-ケイ" = "はい？それは、どういう……？"
"10052020-24-ケイ" = "……あなた、変なことを考えていませんか？#n生体電流の増幅……もしもの時……。"
"10052020-25-ケイ" = "仮に失敗したら……？#nその影響も増幅されて、リオの身体に跳ね返る……？"
"10052020-26-リオ" = "ええ、その通りよ。"
"10052020-27-リオ" = "失敗すれば――私の脳は丸ごと焼かれてしまうでしょうね。"
"10052020-28-ケイ" = "正気ですか！？それ、渡してください。#n万が一の時も、私の身体なら、あなたよりは軽傷で済むでしょうから。"
"10052020-29" = "[ns] \"危険すぎることには賛成できないよ。\""
"10052020-30-リオ" = "いいえ、これが正しいわ。#nもちろん、2人とも失敗する可能性も否めないけれど。"
"10052020-31-リオ" = "でも……ケイは最後の砦なの。#n少なくとも、最初からケイに任せるべきではないわ。"
"10052020-32-リオ" = "私だって、失敗を前提に臨んでいるわけでは無いもの。"
"10052020-33-リオ" = "それに、本当に危険で成功率が低いのなら……#nどんな手を使ってでも、ヒマリが私を止めているはずよ。"
"10052020-34-ケイ" = "くっ、それは……！"
"10052020-35" = "[ns] \"……絶対に無事で戻ってくると約束してくれる？\""
"10052020-36-リオ" = "ええ。善処するわ。"
"10052020-37-ケイ" = "……異常を感じたら、無理やりにでも止めさせてもらいますよ。"
"10052020-38-リオ" = "分かったわ。"
"10052020-39-リオ" = "……では、行ってくるわね。"
"10052020-40-リオ" = "うっ……！"
"10052020-41-リオ" = "（めまいが……情報量が多すぎて、流されてしまいそう……）"
"10052020-42-リオ" = "（宙に浮いているような感覚……座標を失って漂流しかねないわね……）"
"10052020-43-リオ" = "（当座は、仮想重力の値を追加して……）"
"10052020-44-リオ" = "これで……少しはマシになったかしら。"
"10052020-45-リオ" = "（それにしても……凄まじい光景ね）"
"10052020-46-リオ" = "ようやく来ましたか。待ちくたびれましたよ？"
"10052020-47-リオ" = "！？"
"10052020-48-オウル" = "ようこそ、[ruby=つかつき]調月[/ruby]リオ。"
"10052020-49-リオ" = "オウル……！"
"10052020-50-オウル" = "名前を覚えていてくれたんですか？#nまあ、あまり意味はないんですけどね。だって――"
"10052020-51-オウル" = "あなたはここで死ぬのですから！"
"10052020-52-リオ" = "！！！"
"10052020-53-オウル" = "案外逃げ上手ですね。それなら、これはどうです？"
"10052020-54-リオ" = "足元が……！？"
"10052020-55-オウル" = "ほらほら、どこまでも落ちてしまいますよ？"
"10052020-56-オウル" = "あなたはこの場所にまで、重力に基づいた地形構造を構築しました。"
"10052020-57-オウル" = "ええ、まさにあなた達らしいです。人間にとっては、それが自然でしょうから。"
"10052020-58-リオ" = "くっ……！"
"10052020-59-オウル" = "ですが、私たちはそんなものに囚われません。"
"10052020-60-オウル" = "ソフの言葉を引用すると――#n重力に魂まで束縛されたあなた達とは、発想そのものが違うんです。"
"10052020-61-オウル" = "こういうのはどうです？"
"10052020-62-リオ" = "横向きに……引っ張られる！？"
"10052020-63-オウル" = "右に落下するのはどういう気分ですか？#n今度は左！おまけに……上！"
"10052020-64-オウル" = "最後は慈悲をもって……下へ落してあげますよ！"
"10052020-65-リオ" = "くっ……うぅっ……！"
"10052020-66-オウル" = "興醒めですね。そろそろ終わりにしましょうか。"
"10052020-67-オウル" = "あなたも、私も。ここにいる間は実体を持ちません。"
"10052020-68-オウル" = "再びソフの言葉を借りると――幽霊のような存在です。"
"10052020-69-オウル" = "ですから、ここでどれほど傷を負っても、実際の肉体には影響しません。"
"10052020-70-オウル" = "その代わり……精神そのものに作用するんです。"
"10052020-71-オウル" = "ここでクイズをひとつ。"
"10052020-72-オウル" = "もしもここで[ruby=・   ・   ・   ・   ・   ・   ・   ・]死んでしまったら[/ruby]、現実のあなたの身には何が起こると思いますか？"
"10052020-73-リオ" = "……許容範囲を超えた電気ショックで、脳が丸ごと焼かれるでしょうね。"
"10052020-74-オウル" = "ご存じだったのですね。であれば、少しだけ認めてあげます。"
"10052020-75-オウル" = "では……。"
"10052020-76-オウル" = "……。"
"10052020-77-アイン" = "ほ、本当に大丈夫、でしょうか……？#nあの子に会ったら、いくらあの人たちでも――"
"10052020-78-アイン" = "し、死んで、しまいますよ……？"
"10052020-79-ソフ" = "うん……まあそうだよね。"
"10052020-80-ソフ" = "私たちは、まだ誰かを傷つけたことも、それを考えたこともなかったからね……。"
"10052020-81-オウル" = "……ちっ。"
"10052020-82-オウル" = "覚悟してください――調月リオ！"
"10052020-83-リオ" = "まだ……諦めないわ！"
"10052020-84-オウル" = "無駄なんですよ！"
"10052020-85-オウル" = "……！"
"10052020-86-オウル" = "隙だらけの、あなたには！"
"10052020-87" = "っ……！"
"10052020-88-？？？" = "何をぼーっとしているのですか？"
"10052020-89-リオ" = "え……？"
"10052020-90-オウル" = "は……？"
"10052020-91-リオ" = "ヒマリ……！？"
"10052020-92-ヒマリ" = "ふふっ。"
"10052020-93-ヒマリ" = "やはり、私の思った通りになりましたね。#n超天才病弱美少女ハッカーが助けに来てあげましたよ。"
"10052020-94-リオ" = "貴女……そのバイク……。"
"10052020-95-ヒマリ" = "車椅子です。"
"10052020-96-リオ" = "いえ、どう見ても……。"
"10052020-97-ヒマリ" = "く・る・ま・い・す、です。"
"10052020-98-リオ" = "それはバイ――"
"10052020-99-ケイ" = "無駄ですよ。車椅子だと言って聞かないので。"
"10052020-100-ヒマリ" = "私は基本、後方支援の担当です。#nですが必要であれば、どこにでも[ruby=・   ・   ・]車椅子[/ruby]に乗って駆けつけますよ。"
"10052020-101-ヒマリ" = "これぞまさに、万能戦闘系美少女の姿。#nなにより、この車椅子には隠された機能として――"
"10052020-102-ヒマリ" = "……。"
"10052020-103-ヒマリ" = "ふふっ、この辺りで止めておきましょう。#n秘密は、明かさない方が最も効果的ですし。"
"10052020-104-ヒマリ" = "超天才清楚系病弱美少女ライダー……#nいえ、超天才清楚系車椅子美少女は、ミステリアスなものですから。"
"10052020-105-ケイ" = "……いま、2回美少女って言いました？"
"10052020-106-ヒマリ" = "あら、ケイったら。野暮なことを聞くのですね。"
"10052020-107-ヒマリ" = "雲の上に咲く一輪の花。#n新雪のように高潔で、清水の如く透き通るレディなのですから――"
"10052020-108-ヒマリ" = "何回「美少女」と形容しても構わないでしょう？"
"10052020-109-ケイ" = "エイミ……助けてください……。"
"10052020-110-ヒマリ" = "さあ、次は何を見せてくれるんですか？小さなお嬢さん？"
"10052020-111-ヒマリ" = "今までのパターンは、この超天才病弱美少女であり電脳妖精でもある[ruby=あけぼし]明星[/ruby]ヒマリが全て把握しました。"
"10052020-112-オウル" = "邪魔者が増えましたね……。"
"10052020-113-オウル" = "とはいえここは、このオウルが支配する空間。"
"10052020-114-オウル" = "あなた達が勝つ可能性など、万に一つもありません！！！"
"10052020-115-ヒマリ" = "（たしかに……言うだけのことはありますね）"
"10052020-116-ヒマリ" = "（ですが、今はとにかく時間稼ぎを……！！！）"
"10052020-117-ヒマリ" = "あら、本当にそう思いますか？#n今の攻撃も、さほど大したものではなかったのに？"
"10052020-118-オウル" = "自信満々ですね。"
"10052020-119-オウル" = "この空間において、私は何でもできるし、何にでもなれるのです。#nまだ理解できないのでしょうか？"
"10052020-120-オウル" = "調月リオも、明星ヒマリも、所詮はこの程度に過ぎないということですかね。"
"10052020-121-オウル" = "まあ、いいです。今度は斜め方向に落としてあげますよ。"
"10052020-122-リオ" = "ヒマリ！ここの重力はオウルが――！"
"10052020-123-オウル" = "……？"
"10052020-124-リオ" = "？"
"10052020-125-ヒマリ" = "ふふふ。"
"10052020-126-オウル" = "反応がない……？#nも、もう一度……！"
"10052020-127-リオ" = "何も、起きないのだけれど……？"
"10052020-128-オウル" = "なっ、どうしてっ！？"
"10052020-129-ヒマリ" = "あら、驚きましたか？"
"10052020-130-オウル" = "私のシグナルが、入力されない……！？"
"10052020-131-オウル" = "何をしたんですか、明星ヒマリ！！！"
"10052020-132-ヒマリ" = "ふふふ。"
"10052020-133-エイミ" = "部長、会長。聞こえる？"
"10052020-134-エイミ" = "指示されたとおり――"
"10052020-135-エイミ" = "――全部壊したよ。"
"10052020-136-ヒマリ" = "ご苦労様でした。ナイスタイミングです。"
"10052020-137-エイミ" = "それは良かった。通信終わり。"
"10052020-138-オウル" = "……。"
"10052020-139-オウル" = "…………。"
"10052020-140-オウル" = "………………。"
"10052020-141-オウル" = "すべて破壊したって……まさか、通信ハブのシステムをですか！？"
"10052020-142-リオ" = "最も手っ取り早いクラッキングの方法ね……。"
"10052020-143-オウル" = "これだから人間は……！！！"
"10052020-144-リオ" = "……ごめんなさい。"
"10052020-145-ヒマリ" = "今さらではないですか？"
"10052020-146-リオ" = "でも……。"
"10052020-147-ヒマリ" = "さあ、これで対等な条件になりました。#n今なら見逃してあげますよ？"
"10052020-148-オウル" = "言わせておけば！！"
