[translation]
"10052090-1" = "コクマー：王国を守りし古代の守護者 "
"10052090-2" = "[ns] \"ねぇ、ケイちゃん。\""
"10052090-3-ケイ" = "なんですか？"
"10052090-4" = "[s] \"ケイちゃんを戦闘に参加させていいのかな……。\""
"10052090-5-ケイ" = "今さらですか？"
"10052090-6" = "[s] \"だって心配で……。\""
"10052090-7-ケイ" = "またからかっているなら、怒りますよ。"
"10052090-8-エイミ" = "大丈夫だよ、先生。いざとなったら私に任せて。"
"10052090-9" = "[s] \"エイミは最高のエージェントだもんね。\""
"10052090-10-トキ" = "今、最高のエージェントと言いましたか。"
"10052090-11" = "[s] \"あ、えっと、もちろんトキもだよ！うん！\""
"10052090-12-トキ" = "満足したので、これで失礼します。"
"10052090-13-ケイ" = "私は何を見せられているんですか……。"
"10052090-14-エイミ" = "そういえば、コクマーを発見したのってリオ会長だったよね。"
"10052090-15-リオ" = "え？ええ……そうね。"
"10052090-16-リオ" = "地面から急に工作船が現れるのだもの。あれには驚かされたわね。"
"10052090-17-エイミ" = "まさに「特異現象」って感じだね。"
"10052090-18-ケイ" = "……。"
"10052090-19-ケイ" = "リオ。特異現象捜査部を立ち上げた張本人として、今の状況についてどう思いますか？"
"10052090-20-エイミ" = "あれ？ケイもそれ知ってるの？"
"10052090-21-ケイ" = "まあ……今までのデータやヒストリーは、おおよそ学習していますので。"
"10052090-22-ケイ" = "これ、言ってませんでしたっけ……？"
"10052090-23-リオ" = "そうだったのね……。"
"10052090-24-リオ" = "えっと、今の状況について、だったわね。#n感慨深い……という表現は、こういうときに使うのかしら？"
"10052090-25-エイミ" = "……！"
"10052090-26-エイミ" = "……！"
"10052090-27" = "なぜ、そんな表情を？"
"10052090-28" = "あ……いえ、その。"
"10052090-29-リオ" = "なぜ、そんな表情を？"
"10052090-30-エイミ" = "あ……いえ、その。"
"10052090-31-エイミ" = "会長も、昔に比べて変わったなって思って。"
"10052090-32-ケイ" = "ド直球に言いますね！？"
"10052090-33-リオ" = "それは……良い意味と受け取っていいのかしら？それとも……。"
"10052090-34-エイミ" = "急に判断力落ちてませんか！？"
"10052090-35-エイミ" = "ケイ、落ち着いて。いちいち怒ってたら、感情回路にエラーが生じちゃうかもよ？"
"10052090-36-リオ" = "否定はできないわ。貴女の身体は、まだ完全には分析できていないのだから。"
"10052090-37-リオ" = "致命的なエラーが生じたら対処できないかもしれないわ。"
"10052090-38-ケイ" = "あー……、もう……っ！"
"10052090-39" = "[s] \"……ケイちゃん、大丈夫？\""
"10052090-40-ケイ" = "私がストレスで倒れてしまったら、あなた達のせいですからね……。"
"10052090-41-アリス" = "ケイ！？ダメです！アリス、そんなの嫌です！"
"10052090-42-ケイ" = "いえ……言ってみただけですよ……。"
"10052090-43" = "[s] \"苦労が多いね……。\""
"10052090-44-ケイ" = "分かってくれてありがとうございます、先生……。"
"10052090-45-エイミ" = "さあ、仕事の時間だよ、ケイ。先生は安全な場所を探して。"
"10052090-46-ケイ" = "仕事をしていたほうが、余計なことを考えずに済みますね……。"
"10052090-47-エイミ" = "じゃあ、始めよっか。"
