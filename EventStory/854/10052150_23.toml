[translation]
"10052150-1" = "ダアト：影に隠れし深淵の知恵 "
"10052150-2-ヒマリ" = "あの子たち、何をやっているのでしょう？"
"10052150-3-リオ" = "あれは……まさか！？"
"10052150-4-エイミ" = "おー。"
"10052150-5-ユズ" = "ひ、ひいいぃぃぃ！？！？"
"10052150-6" = "ユズちゃん大丈夫！？#nって、お姉ちゃんは何してるの！？"
"10052150-7-モモイ" = "ミドリ……私、今まで誤解してたのかもしれない……！"
"10052150-8-ミドリ" = "なんの話！？"
"10052150-9-モモイ" = "宇宙戦艦はいけるネタだと思ってた……でもシナリオライターたるもの、あらゆる可能性を超えた、その先を見据えるべきだった……！"
"10052150-10" = "巨大変身合体恐竜ロボット！この手があったか！"
"10052150-11-ミドリ" = "そんなこと言ってる場合！？"
"10052150-12-トキ" = "1つだけ、確かなことがあります。"
"10052150-13-トキ" = "ここにネル先輩がいたら……きっとこう言っていたでしょう。"
"10052150-14-トキ" = "――「最高にイカしてる」と。"
"10052150-15" = "[s1] \"あれは巨大変身合体恐竜ロボットじゃないよ、モモイ！\"\n[s2] \"巨大変身合体「怪獣」ロボットだ！\""
"10052150-16-ヒマリ" = "……。"
"10052150-17-ケイ" = "その話、いま必要ですか！？"
"10052150-18-ヒマリ" = "分類学はたしかに大事な学問ですが……それにしたって巨大すぎませんか？#nしかも、こっちへ向かって来ています！"
"10052150-19-リオ" = "……。"
"10052150-20-リオ" = "みんな、心配はいらないわ。"
"10052150-21-ヒマリ" = "リオ？あなた、まさか……。"
"10052150-22-リオ" = "そうよ。万が一のために、用意したものがあるの。"
"10052150-23-リオ" = "ネオアバンギャルド君――"
"10052150-24-リオ" = "――出撃。"
"10052150-25-ヒマリ" = "これは……！"
"10052150-26-エイミ" = "ネオアバンギャルド君……？"
"10052150-27-ソフ" = "……。"
"10052150-28-オウル" = "……。"
"10052150-29-ソフ" = "ぷっ！あははははっ！なにそれ！変なの！"
"10052150-30-オウル" = "小さすぎませんか？とてもダアトの相手にはなりませんよ？"
"10052150-31-アイン" = "か、かわいいですね……！えへへ……。"
"10052150-32-リオ" = "多くの場合、大きさは問題になるわね。"
"10052150-33-リオ" = "だけど、今は違うわ。"
"10052150-34-アイン" = "はい……？"
"10052150-35-リオ" = "ケイ、いいかしら？"
"10052150-36-ケイ" = "……まあ、約束したことですからね。#nいいでしょう。さっそく始めますよ。"
"10052150-37-ケイ" = "ああ、その前に1つだけ。#nアイン、ソフ、オウル。あなた達にお礼を言わせてください。"
"10052150-38-アイン" = "はい！？"
"10052150-39-ソフ" = "どういう意味……？"
"10052150-40-オウル" = "どうせハッタリです！今のダアトは最強！無敵！ですから！#nあなた達に勝算なんてないんですよ！"
"10052150-41-リオ" = "[ruby=・]今[/ruby][ruby=・]の[/ruby][ruby=・]条[/ruby][ruby=・]件[/ruby]では、きっとそうね。"
"10052150-42-リオ" = "でも、打開の策はすべて整っているの。"
"10052150-43-リオ" = "名もなき神々の力で作られた、この鋼鉄大陸において……！"
"10052150-44-リオ" = "小細工の跡が見えるようだけれど、その修正にも慣れてきたわ。"
"10052150-45-オウル" = "名もなき神々の力……。"
"10052150-46-ソフ" = "「王女」と「鍵」がいるからって……。"
"10052150-47-アイン" = "……。"
"10052150-48-アイン" = "ま、まさか……！！！"
"10052150-49-ケイ" = "簡単なことです。1度起きたことは2度目だって起こります。#nそして2度目は、1度目よりも容易く進めることができる。"
"10052150-50-ケイ" = "「色彩」がキヴォトスに舞い降りようとした日がありました。"
"10052150-51-リオ" = "私たちはその力に対抗し、その力の一部を応用した。"
"10052150-52-リオ" = "選り好みなんてしていられない。#n使えるものはすべて使わないと、生き残れなかったから。"
"10052150-53-ケイ" = "闘争はあなた達の専売特許ではありません。生き物なら、誰だって同じです。"
"10052150-54-ケイ" = "鋼鉄大陸は、名もなき神々の力を活用して作られました。"
"10052150-55-リオ" = "そして、その地に立つ8の預言者は、いつの間にかその力の影響を受けていた。"
"10052150-56-リオ" = "そのすべてと戦った末に、ここは名もなき神々の力で充満するようになった。"
"10052150-57-リオ" = "さらに、その預言者のコアを吸収しているケイが、今ここに居る。"
"10052150-58-ケイ" = "エネルギーが存在し、それを分析できて、ひいては再現できるとすれば――"
"10052150-59-ケイ" = "当然、そのエネルギーを好きなように加工し、応用することもできるということです。"
"10052150-60-ソフ" = "それって、つまり……！"
"10052150-61-ケイ" = "何をうろたえているのですか？#nその力は元々、私とアリスに帰すべきものですよ。"
"10052150-62-ケイ" = "文句は受け付けませんので、悪しからず。"
"10052150-63-オウル" = "じゃあ、そのネオなんとかを……！"
"10052150-64-リオ" = "ええ。再び「物質の巨大化」をするわ。"
"10052150-65-モモイ" = "さいっこう！！"
"10052150-66-ミドリ" = "うん……すごい！"
"10052150-67-ミドリ" = "（でも……デザインはもう少しなんとかならなかったのかな……）"
"10052150-68-ヒマリ" = "……これが「切り札」ですか。"
"10052150-69-リオ" = "ごめんなさい。ここは敵地で、迂闊に話しては盗聴されると考えていたわ。"
"10052150-70-ヒマリ" = "だから、ケイにだけ話していたのですね。"
"10052150-71-リオ" = "ええ。セキュリティに関しては、ケイが一番安全だもの。"
"10052150-72-エイミ" = "あれ？巨大ネオアバンギャルド君が――"
"10052150-73-トキ" = "ユズに、[ruby=ジェントルに]丁寧に[/ruby]手を差し伸べています。"
"10052150-74-ユズ" = "え、えええええ！？"
"10052150-75-リオ" = "当然だわ。だって――"
"10052150-76-リオ" = "ネオアバンギャルド君を操縦するのは……ユズ、貴女よ。"
"10052150-77-ユズ" = "そんなの聞いてないんですけど！？！？！？"
"10052150-78-アリス" = "あぁっ！ユズがスラスラと自分の意見を言っています！#nこれは本当にショックだという意味です！"
"10052150-79-リオ" = "でも、アバンギャルド君を操縦した経験はあるでしょう？"
"10052150-80-アリス" = "たしかに！UZQueen専用機に改造されたアバンギャルド君がありました！"
"10052150-81-リオ" = "ええ。私もその記録は把握しているわ。だから、ユズ――"
"10052150-82" = "ネオアバンギャルド君に乗ってちょうだい。"
"10052150-83-ユズ" = "う、うううぅぅぅぅぅ……！！！"
"10052150-84-ユズ" = "ど、どうやって操縦すれば……！？"
"10052150-85-リオ" = "ネオアバンギャルド君は脳波で作動することになっているわ。"
"10052150-86-リオ" = "……今のところ。"
"10052150-87-ユズ" = "今のところ！？"
"10052150-88-リオ" = "ええ。ネオアバンギャルド君は今のところ、貴女の思う通りに動くはずよ。"
"10052150-89-ユズ" = "そ、そそそそ、そんなこと言われても……！"
"10052150-90-ソフ" = "いけ、ダアト！蹴っ飛ばせ！"
