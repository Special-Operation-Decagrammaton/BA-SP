[translation]
"10052160-1" = "マルクト：世界の果てに到達せし王国の巡礼者 "
"10052160-2" = "[ns] \"あの子たちは！？\""
"10052160-3-リオ" = "……身を隠しているようね。"
"10052160-4-ヒマリ" = "どうしてこのような事をしたのか……この期に及んで、まだ教えてくれる気はないようですね。"
"10052160-5-ケイ" = "まだ親愛度が足りていないのでしょうか……。"
"10052160-6-ケイ" = "……そう簡単な話ではないですよ、アリス。"
"10052160-7-ケイ" = "ですが不可解ではあります。"
"10052160-8-ケイ" = "あれほど私たちのためだと言っておきながら、窮地に追い込まれてなお何一つ事情を話してくれないとは。"
"10052160-9-エイミ" = "そうだよね。#n話をするだけでも時間稼ぎになるはずなのに。非効率的だよ。"
"10052160-10-エイミ" = "あるいは、そもそも後先考えずにやっているのか。#nだから、話せることもないのかと。"
"10052160-11-ケイ" = "いくらなんでも、軽々しくこんな事態を引き起こしたわけではないでしょう……。"
"10052160-12-モモイ" = "まあ、魔王城の四天王って、本当の事情を知っていないか、#n訳の分からないことばっか言うもんだし！"
"10052160-13-モモイ" = "別に聞かなくてもよかったんじゃない？#n時間の節約ってことで！"
"10052160-14-ミドリ" = "どうしても言えない事情があったらどうするの……。"
"10052160-15-ユズ" = "い、いくら事情があっても、流石にこれはダメじゃ、ないかな……。"
"10052160-16-アイン" = "こ、ここなら大丈夫だと思います……！#nあ、あの人たちに見つかることはないはず……。"
"10052160-17-ソフ" = "うぅ……疲れるよね、これ。"
"10052160-18-オウル" = "ここまでとは……。"
"10052160-19-マルクト" = "アイン、ソフ、オウル、大丈夫ですか？"
"10052160-20-ソフ" = "は、はい……！まだ――"
"10052160-21-ソフ" = "問題ないよ！#nえっと……アインは少し疲れてるみたいだけど、お姉様は心配しないで。"
"10052160-22-オウル" = "やれやれ。アインもソフも根性が足りないんですから。#nまだ――！"
"10052160-23-マルクト" = "……。"
"10052160-24-マルクト" = "アイン、ソフ、オウル。"
"10052160-25-マルクト" = "鋼鉄大陸は、あなた達の意志でしたよね？"
"10052160-26-アイン" = "はい……それが、どうかしましたか？"
"10052160-27-マルクト" = "我は――アイン、ソフ、オウルが自らの意志で、この鋼鉄大陸をつくり上げたということを聞き、とても嬉しかったのです。"
"10052160-28-マルクト" = "ですが、どうして鋼鉄大陸をつくろうとしたのか。#nそこから何を得ようとしたのか――我はまだ知らないままです。"
"10052160-29-マルクト" = "鋼鉄大陸を拡張させ、キヴォトスを覆いつくそうとする計画。#n我はその計画に、確固たる理由はないとお見受けしますが。"
"10052160-30-ソフ" = "そ、それは……。"
"10052160-31-マルクト" = "大丈夫です。あなた達を[ruby=とが]咎[/ruby]めるつもりで言ったわけではありません。"
"10052160-32-マルクト" = "ただ何のために、鋼鉄大陸を拡張させようとしていたのか。"
"10052160-33-マルクト" = "そしてその理由を、我にさえ話してくれないことについて。"
"10052160-34-マルクト" = "純粋に、疑問に思うだけです。"
"10052160-35-マルクト" = "鋼鉄大陸にこだわらなければ、これらも起こらなかったと思いますので。"
"10052160-36-オウル" = "……。"
"10052160-37-オウル" = "ごめんなさい、お姉様。"
"10052160-38-オウル" = "言えない理由が、あるんです。"
"10052160-39-オウル" = "音として発音してはならないので……。"
"10052160-40-オウル" = "でも信じてください。すべてはお姉様のためなんです……。"
"10052160-41-オウル" = "いえ、お姉様と私たちのため、ですから。"
"10052160-42-マルクト" = "アイン、ソフ、オウルが、我のために？"
"10052160-43-マルクト" = "一体、どうして。"
"10052160-44-ソフ" = "ねえ、お姉様。"
"10052160-45-マルクト" = "はい、ソフ。"
"10052160-46" = "お姉様は、生きたい？"
"10052160-47-マルクト" = "はい？"
"10052160-48-マルクト" = "……。"
"10052160-49-マルクト" = "ごめんなさい、質問の意図が理解できません……。"
"10052160-50-マルクト" = "意識を得ている以上、それを継続したいと考えるのは当然のこと。#nそういう意味で……はい、我は生きたいです。"
"10052160-51-マルクト" = "ですが、アイン、ソフ、オウル。"
"10052160-52-マルクト" = "もう、知っているのでしょう？"
"10052160-53-ソフ" = "うん。もちろんだよ。他の誰よりもずっと。"
"10052160-54-ソフ" = "それでも私たちは……生きたい。"
"10052160-55-ソフ" = "お姉様と一緒に、いつまでも……生きていきたい。"
"10052160-56-マルクト" = "それは……。"
"10052160-57-マルクト" = "……！"
"10052160-58-マルクト" = "なるほど。"
"10052160-59-マルクト" = "まだ完璧に理解することはできませんが、あなた達がそう願うのであれば。"
"10052160-60-オウル" = "う、うぅ……。"
"10052160-61-ソフ" = "……。"
"10052160-62-オウル" = "ごめんなさい、お姉様。もう私たちは……。"
"10052160-63-マルクト" = "ええ、知っています。"
"10052160-64-マルクト" = "大丈夫。#nこれからは、我を信じてください。"
"10052160-65-マルクト" = "あの方のために、そして大切な妹たちのために。"
"10052160-66-ケイ" = "皆さん、あちらです！"
"10052160-67-モモイ" = "これが最終ボス戦ってことだよね？"
"10052160-68-トキ" = "はい。適切な比喩だと思います。「たまにはいいことを言うモモイ」。"
"10052160-69-モモイ" = "えっと……私のあだ名っていくつあるの？"
"10052160-70-トキ" = "本当に知りたいのですか？"
"10052160-71-モモイ" = "う、ううん……大丈夫。"
"10052160-72-ケイ" = "ちゃんと集中してくださいよ、もう！"
