[translation]
"10046160-1-セイア" = "やあ、待ちわびたよ。"
"10046160-2-セイア" = "ついに私の出番がきたようだね。"
"10046160-3-イチカ" = "……セイア様？"
"10046160-4-セイア" = "さて、行こうか。"
"10046160-5-イチカ" = "ちょっ、行く？どこへっすか！？"
"10046160-6-セイア" = "パトロールをするのではなかったのかい？"
"10046160-7-イチカ" = "私はそうっすけど……危ないっすから。#nセイア様は安全な場所に……。"
"10046160-8-セイア" = "なるほど、理解した。"
"10046160-9-イチカ" = "それじゃあ――"
"10046160-10-セイア" = "つまり、ティーパーティーの[ruby=ゆりぞの]百合園[/ruby]セイアが担うべき役割ではない――"
"10046160-11-セイア" = "――そう言いたいのだね？"
"10046160-12-イチカ" = "えーっと……まあ、はい。"
"10046160-13-セイア" = "ふむ……私をティーパーティーの百合園セイアと定義し――#n君を正義実現委員会の[ruby=なかまさ]仲正[/ruby]イチカと定義づける。#nその違い。その理由は、何だろうか。"
"10046160-14-イチカ" = "……はい？"
"10046160-15-イチカ" = "役割とは、実体を伴わないものだ。#n例えば……君と私が無人島に漂着したとしよう。#nその場所で、平時の肩書きは意味を成さないだろう？"
"10046160-16-イチカ" = "……？"
"10046160-17-セイア" = "つまるところ、役割とは社会規範が作り上げた蜃気楼にすぎない。#n可変する以上、それは決して定数などではない。#n社会が変数であるならば、役割も変数であってしかるべきだ。"
"10046160-18-イチカ" = "……。"
"10046160-19-セイア" = "即ち、定義の問題だ。#nここを二人だけの社会だと定義すれば……#n私が肯定するだけで、社会の半数が肯定を示したことになる。"
"10046160-20-セイア" = "話はこれで十分だろう。さあ、行こうか。"
"10046160-21-イチカ" = "……い、いやいや！全然説明になってないっすよ！？"
"10046160-22-イチカ" = "腕が鳴るな。なに、後れを取るつもりは無いよ。"
"10046160-23-イチカ" = "セイア様！"
