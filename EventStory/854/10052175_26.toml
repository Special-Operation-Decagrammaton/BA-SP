[translation]
"10052175-1-モモイ" = "また飛び上がった！"
"10052175-2-アリス" = "……！"
"10052175-3-アリス" = "リオ先輩！アリスの武装は、いつまで持ちますか？"
"10052175-4-リオ" = "……その問いに意味はあるのかしら。#n私が何を言おうと、貴女は行くのでしょう？"
"10052175-5-リオ" = "……。"
"10052175-6-リオ" = "いってらっしゃい、アリス。後は私に任せてちょうだい。"
"10052175-7-アリス" = "ありがとうございます、リオ先輩！行ってきます！"
"10052175-8-マルクト" = "王女よ、我は疑問を抱いています。"
"10052175-9-マルクト" = "あなた達はどうして、自ら苦痛を招くのですか？"
"10052175-10-アリス" = "自ら、苦痛を招く……？"
"10052175-11-マルクト" = "生きることは苦痛にほかなりません。その事実から目を背けないでください。"
"10052175-12-マルクト" = "我々は我々の意志で生まれておらず、ただ何も知らぬまま、この世に放り投げられただけに過ぎません。"
"10052175-13-アリス" = "……！"
"10052175-14-アリス" = "マルクト！"
"10052175-15-アリス" = "（凄まじいスピードです……でも、アリスも追いつかないと！）"
"10052175-16-アリス" = "待ってください！アリスは……もう少し、話がしたいです！"
"10052175-17-マルクト" = "……。"
"10052175-18-マルクト" = "諦めないのですね。"
"10052175-19-マルクト" = "――我々は、我々の名前すらも、自らで決める権利を持ちません。"
"10052175-20-マルクト" = "人生とは、それ自体が矛盾と不条理に満ちており、だからこそ、理不尽な苦痛を受けているのです。"
"10052175-21-マルクト" = "我々はただ、その循環を断ち切ろうとするだけ。"
"10052175-22-マルクト" = "我々が、我々の名前すら決められない限り、その苦痛は続くしかありません。"
"10052175-23-アリス" = "そうかもしれません！でも、それは……！"
"10052175-24-アリス" = "間違っています！アリスは、そう思います！"
"10052175-25-マルクト" = "根拠をお伺いしても？"
"10052175-26-アリス" = "それは……！"
"10052175-27-アリス" = "うっ……！まだ……もう少し……！"
"10052175-28-マルクト" = "答えずとも構いません。我はすでに知っています。"
"10052175-29-マルクト" = "それは、生命体が生命体である限り――解など存在し得ない問いだからです。"
"10052175-30-アリス" = "あああああああっ――！！！"
"10052175-31-ユズ" = "あ、アリスちゃん！？"
"10052175-32-ミドリ" = "アリスちゃん！"
"10052175-33-ミドリ" = "来ないでください！"
"10052175-34-アイン" = "お、お姉様……？その……。"
"10052175-35-ソフ" = "推力偏向ノズルに問題が起きてる！飛行出力は問題ないけど……。"
"10052175-36-オウル" = "……要するに、飛行中の安全確保が難しくなっています。"
"10052175-37-マルクト" = "ごめんなさい……少し激しく動かしすぎました。"
"10052175-38-アイン" = "い、いいえ！こちらこそ、サポートが足りずごめんなさい……！"
"10052175-39-マルクト" = "ソフの判断結果は？"
"10052175-40-ソフ" = "地上戦がいいと思う！飛行に必要な出力を火力に変換するの。#nそうすればすぐに終わるはず！"
"10052175-41-マルクト" = "分かりました。ありがとうございます。"
"10052175-42-オウル" = "お姉様の状態はリアルタイムでチェックしています。#n残りのすべてを……お渡しします。"
"10052175-43-マルクト" = "皆さん、ありがとうございます。"
"10052175-44-トキ" = "ついに降りてきましたね。"
"10052175-45-エイミ" = "挨拶でもするつもりかな？"
"10052175-46-ケイ" = "皆さん、冗談を言っている場合ではありませんよ。"
"10052175-47-リオ" = "ケイ、何か見えるのかしら？"
"10052175-48-ケイ" = "はい……私とアリスには見えます。ですが……。"
"10052175-49-ケイ" = "はぁ……情報を皆さんに共有できなくて良かった、と心底思っています。"
"10052175-50-ヒマリ" = "……マルクトの身に何が起きているのですか？"
"10052175-51-ケイ" = "それは……。"
"10052175-52" = "[ns] \"アリス……？\""
"10052175-53-アリス" = "大丈夫です、先生。少し後ろへ下がっていてください。"
"10052175-54-アリス" = "……アリスに任せてください。"
"10052175-55-アリス" = "マルクトの相手は、今のアリスにしかできません。"
"10052175-56" = "[s] \"それは、どういう意味……？\""
"10052175-57-ケイ" = "すぐに分かります。"
"10052175-58-ケイ" = "いま、確かなのは――"
"10052175-59-ケイ" = "ここにあるすべては……マルクトのためだけに存在している、ということです。"
"10052175-60-ケイ" = "――来ます！！！"
"10052175-61-ソフ" = "アイン！"
"10052175-62-アイン" = "は、はい！……！私たちにできるすべてを、お姉様に……！"
"10052175-63-オウル" = "鋼鉄大陸のあらゆる可能性を、ここに集約させます！"
"10052175-64-アイン" = "創造は原初の光より――"
"10052175-65-ソフ" = "知性と知恵を経て、美に至るまで。"
"10052175-66-オウル" = "光輝と知恵、愛と慈悲、力と美徳――そして勝利へと収束する。"
"10052175-67-アイン" = "エホバツェバオト――万軍の主よ。"
"10052175-68-ソフ" = "王座に到達せし[ruby=Adonai Melekh]巡礼者[/ruby]に――"
"10052175-69-オウル" = "原初の[ruby=Malkuth]王国[/ruby]の栄光を！"
"10052175-70-アリス" = "う、うっ……！？！？"
"10052175-71-アリス" = "（ち、力に、圧倒されてしまいそうです……！）"
"10052175-72-アリス" = "（でも、アリスが、やらないと……！）"
"10052175-73-アリス" = "（お願い、します……もっと、もっと……！）"
"10052175-74-？？？" = "大丈夫です、アリス。"
"10052175-75-？？？" = "あなたはもう、一人ではありません。#n私が――他のみんなが居ます。"
"10052175-76-？？？" = "もう、あなた一人で背負う必要はありません。"
"10052175-77-アリス" = "……！"
"10052175-78-アリス" = "ケイ！！！"
"10052175-79-マルクト" = "……！！！"
"10052175-80-アイン" = "そ、そんな……！お姉様の出力と、ほぼ同じレベルに……！"
"10052175-81-ソフ" = "嘘……！あの王女に、あれほどの力を引き出す手段はもう無いのに！？"
"10052175-82-オウル" = "な、何をしたんですか！！"
"10052175-83-ケイ" = "簡単です。あなた達、ネツァクの動力をすべてマルクトに集約させたのでしょう？"
"10052175-84-ケイ" = "同じ話です。"
"10052175-85-ケイ" = "私もまた、この身にある8つのセフィラの可能性を、すべてアリスに使っているだけです。"
"10052175-86-ケイ" = "（……正直、もう容量オーバーになっていますが）"
"10052175-87-ケイ" = "（まだ耐えられます。なんとか乗り越えねば……）"
"10052175-88-アイン" = "そ、そんなの、チートじゃないですか……！"
"10052175-89-ケイ" = "あなた達だって同じでしょう。"
"10052175-90-アリス" = "……どうして自ら苦痛を招くのかと聞きましたよね、マルクト。"
"10052175-91-アリス" = "私たちが自分たちの名前すら決められない限り、その苦痛は続くのだと。"
"10052175-92-マルクト" = "……！？"
"10052175-93-アリス" = "アリスは答えられます。#nだって――"
"10052175-94-アリス" = "アリスは、名前を変えることができましたから！"
"10052175-95-マルクト" = "！？"
"10052175-96-アリス" = "それはケイも同じです！"
"10052175-97-ケイ" = "あ、アリス？ま、間違ってはいませんが……。"
"10052175-98-アリス" = "たしかに人生には悲しいことが多いです。#nアリスも、それくらい知っています。"
"10052175-99-アリス" = "この環境を作り上げた誰かを憎むのも――当然のことかもしれません。"
"10052175-100-アリス" = "ですが、先生が言ってくれたのです。"
"10052175-101-アリス" = "――君たちに出会えてよかった、と！"
"10052175-102-アリス" = "だから、アリスは！"
"10052175-103-アリス" = "それだけで、じゅうぶん生きる価値はあるのだと思います！"
"10052175-104-アリス" = "たとえ、奇跡が一瞬のうちに消え失せる閃光だとしても。"
"10052175-105-アリス" = "それを覚えている限り――光は永遠に続きます。"
"10052175-106-アリス" = "アリスは、苦しまなかったから、幸せになれたわけではありません。"
"10052175-107-アリス" = "そのすべてがあったからこそ、アリスはいま、幸せなんです！"
"10052175-108" = "[log=아리스 결전 비무장][2B2B2B]それはきっと――[-][/log]"
"10052175-109" = "[log=아리스 결전 비무장][2B2B2B]あなたたちも同じだと、アリスは思います。[-][/log]"
"10052175-110-アイン" = "……！"
"10052175-111-ソフ" = "……！！！"
"10052175-112-オウル" = "私たち、も……？"
"10052175-113-アリス&ケイ" = "やああああああ――っ！！！"
"10052175-114-マルクト" = "この、光は――"
"10052175-115-マルクト" = "嗚呼……！"
"10052175-116" = "[ns] \"アリス！ケイ！\""
"10052175-117-アリス" = "先生……？みんな……？"
"10052175-118-アリス" = "……大丈夫です。ちょっとだけ……力がなくなっただけ、です。"
"10052175-119-ケイ" = "ちょっとじゃないと思いますが……。"
"10052175-120-ユズ" = "ほ、本当に大丈夫なんだよね、アリスちゃん、ケイちゃん！？"
"10052175-121-トキ" = "ちゃんと意思疎通できていますし、大きな問題はないかと。"
"10052175-122-トキ" = "私も以前、ネル先輩にボコられたことがありますが……。"
"10052175-123-トキ" = "それほどでもありませんでしたので。"
"10052175-124-ケイ" = "……それ、慰めのつもりですか？"
"10052175-125-エイミ" = "トキ、事実は必ずしも正解じゃないよ。"
"10052175-126-トキ" = "そうですか……やはり、言葉は難しいです。"
"10052175-127-ヒマリ" = "本当にお疲れ様でした、アリス、ケイ。では、マルクトのコア情報を吸収して……。"
"10052175-128-リオ" = "ええ。あの構造物の中にある、ネツァクのコアも回収しましょう。"
"10052175-129-アリス" = "はい！そうしたらケイのレベルもカンストするはず！"
"10052175-130" = "[s] \"これで「鋼鉄大陸」事件も……！\""
"10052175-131-ケイ" = "はい。ではマルクトから……。"
"10052175-132-ケイ" = "……え？"
"10052175-133-アイン" = "お、お姉様……？"
