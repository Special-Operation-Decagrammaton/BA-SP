[translation]
"10052095-1-エイミ" = "コクマー、沈黙を確認。"
"10052095-2-エイミ" = "それにしても……はぁ……。#nここ暑いね……あのときより、もっと……。"
"10052095-3" = "[s1] \"今は戦闘服のままで我慢してほしいかな。\"\n[s2] \"エイミが危険にさらされるのは見たくないから。\""
"10052095-4-ケイ" = "……あの、エイミ？#n悪いのですが……お願いがありまして……。"
"10052095-5-エイミ" = "うん？いいよ。ここに長居するって話以外なら。"
"10052095-6-ケイ" = "あ、えっと……ここの気温や気圧は他のエリアと大きく異なっていて――"
"10052095-7-ケイ" = "コアの情報抽出に、もう少し時間がかかりそうです……。"
"10052095-8" = "[ns] \"エイミ！？\""
"10052095-9-ケイ" = "すみません……。"
"10052095-10-ケイ" = "ううん……ケイは悪くないよ……。"
"10052095-11-エイミ" = "悪いのは……この世界、なんだから……。"
"10052095-12-ケイ" = "まるで、あの子たちみたいなことを言いますね……。"
