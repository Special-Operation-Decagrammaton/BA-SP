[translation]
"10052140-1" = "慈悲"
"10052140-2-オウル" = "あ、あわ、あわわわ……！！！"
"10052140-3-オウル" = "う、嘘でしょう……！？そんな……！"
"10052140-4-ソフ" = "……。"
"10052140-5-ソフ" = "警報切って。"
"10052140-6-SYSTEM" = "警報、出力中止。"
"10052140-7-アイン" = "ソ、ソフ……？"
"10052140-8-オウル" = "いいのですか！？"
"10052140-9-ソフ" = "これくらい、何の影響もないよ。"
"10052140-10-ソフ" = "違う？"
"10052140-11-オウル" = "……。"
"10052140-12-オウル" = "ま、まあ……。"
"10052140-13" = "アイン、準備の進捗はどう？"
"10052140-14" = "も、もうすぐ終わります！"
"10052140-15-オウル" = "お、両方ですか？"
"10052140-16-アイン" = "はい！"
"10052140-17-ソフ" = "そっか。じゃあ……。"
"10052140-18-オウル" = "どうするつもりですか？"
"10052140-19-ソフ" = "どうするもなにも。すぐそこまで来てるんだから。"
"10052140-20-ソフ" = "歓迎挨拶くらいはしてあげないとでしょ？"
"10052140-21-オウル" = "……。"
"10052140-22-オウル" = "たしかに。まだコアは2つ、こちら側にありますし。"
"10052140-23-オウル" = "奪われたコアだって、取り戻せます。"
"10052140-24-ソフ" = "そういうこと。"
"10052140-25-オウル" = "では、ソフ……行くのですね？"
"10052140-26-ソフ" = "直接、顔を拝みに行くよ。"
"10052140-27-アイン" = "わ、私も行きますか……？"
"10052140-28-ソフ" = "アインはここに残ってて。"
"10052140-29-ソフ" = "私たちのことより、アインの作業のほうが大事だから。"
"10052140-30-アイン" = "は、はい……！"
"10052140-31-ヒマリ" = "中央のネツァクのエリアを除く、鋼鉄大陸の全エリアの奪取に成功しました。"
"10052140-32-モモイ" = "まさか……本当にできちゃったね……。"
"10052140-33-リオ" = "正しく手順を踏めば、概ねは最終目標までたどり着くものよ。#nそこまで驚くことでもないわ。"
"10052140-34-ミドリ" = "それって、もしも順番通りに進まなかったら……？"
"10052140-35-エイミ" = "その時は……。"
"10052140-36-エイミ" = "鋼鉄大陸に覆われたキヴォトスで、どうやって生きてくか悩んでたかも？"
"10052140-37-ユズ" = "は、はい……！？"
"10052140-38-トキ" = "終わりよければすべてよし、という言葉もあります。#n今は上手くいったので、すべてよしです。"
"10052140-39-ケイ" = "そんな大雑把な……。"
"10052140-40-ケイ" = "限りなく不可能に近いことを成し遂げたのですよ？"
"10052140-41-リオ" = "ゼロではない限り、可能性は閉ざされないわ。"
"10052140-42-アリス" = "アリスは心配していませんでした！#n先生とみんなが居てくれました！それに、リオ会長も！"
"10052140-43-リオ" = "わ、私……？"
"10052140-44-アリス" = "はい！「光落ち」です！"
"10052140-45-アリス" = "あれ？それだと……リオ先輩はもともと敵だったということになってしまいます……！"
"10052140-46-アリス" = "ごめんなさい、リオ先輩！そういうつもりでは……！"
"10052140-47-リオ" = "気にしていないわ。それにあのときの私は……そういう側面もあったもの……。"
"10052140-48-アリス" = "ありがとうございます、リオ先輩！"
"10052140-49-？？？" = "すべての始まりについて、考えたことはありますか？"
"10052140-50-アリス" = "！？"
"10052140-51-？？？" = "例えば、こういう質問があるとします。"
"10052140-52-ケイ" = "……！"
"10052140-53-？？？" = "我々はどこから来たのか？"
"10052140-54-？？？" = "我々の目的は何なのか？"
"10052140-55-？？？" = "我々はどこへ向かうのか？"
"10052140-56-アリス" = "ケイ……！"
"10052140-57-ケイ" = "はい、私も聞こえています。"
"10052140-58-？？？" = "ともすれば神とは、従う者たちへの規律なのかもしれません。"
"10052140-59-ヒマリ" = "アリス？ケイ？どうかしましたか？"
"10052140-60-アリス" = "え？あ、そ、それが……！"
"10052140-61-ケイ" = "いえ、何でもありません。大丈夫です。"
"10052140-62-アリス" = "あ、ありがとうございます、ケイ……。"
"10052140-63-ケイ" = "こういう時のための私ですから。"
"10052140-64-アリス" = "でも……あれはどういう意味だったのでしょう？#nケイは何か知っていますか？"
"10052140-65-ケイ" = "……詳細までは分かりません。"
"10052140-66-ケイ" = "おそらく、私たちの始まりと……関係しているのだと思います。"
"10052140-67-エイミ" = "みんな、気をつけて。何かが近づいてきてる。"
"10052140-68-ソフ" = "……。"
"10052140-69-オウル" = "……。"
"10052140-70" = "[s1] \"ソフちゃん！オウルちゃん！\"\n[s2] \"アインちゃんは一緒じゃないの？\""
"10052140-71-ソフ" = "……呆れた。"
"10052140-72-オウル" = "げっ……。"
"10052140-73-エイミ" = "ダメだよ。挨拶には挨拶を返さないと。"
"10052140-74-オウル" = "のんきに挨拶を交わす仲になった覚えはありませんよ、[ruby=いずみもと]和泉元[/ruby]エイミ。"
"10052140-75-エイミ" = "その呼び方は長すぎて効率的じゃないよ。これからはエイミって呼んで。"
"10052140-76-オウル" = "……はい？"
"10052140-77-エイミ" = "エイミ。"
"10052140-78-オウル" = "いや、ですから……。"
"10052140-79-エイミ" = "エイミ。"
"10052140-80-ソフ" = "……分かったよ、エイミ。"
"10052140-81-エイミ" = "うん、よくできました。"
"10052140-82-ソフ" = "……。"
"10052140-83-ソフ" = "8人の預言者に勝って、ネツァクの支配権をほとんど持っていったのは……#n正直、すごいとは思うよ。"
"10052140-84-オウル" = "……ちっ。"
"10052140-85-トキ" = "提案があるのですが、過去は水に流して編入して来ませんか？"
"10052140-86-トキ" = "先生に再確認したところ、今なら選り取り見取りだそうです。"
"10052140-87-トキ" = "もちろん、どこを選ぶかは皆さんの自由です。#nキヴォトスは数千の学園が集まる、巨大な学園都市――"
"10052140-88-トキ" = "皆さんには、数千の可能性があるとも言えます。"
"10052140-89-トキ" = "ですがやはり、私はミレニアムサイエンススクールをおすすめします。"
"10052140-90-オウル" = "何度言わせれば気が済むんですか。必要ありません。"
"10052140-91-トキ" = "今なら特別に、リオ様が直々にデザインした記念品ももらえます。"
"10052140-92-リオ" = "え……？そんなものを準備した覚えはないのだけれど……。"
"10052140-93-ヒマリ" = "話を合わせてください！"
"10052140-94-リオ" = "わ、分かったわ……。"
"10052140-95-ヒマリ" = "とにかく、キヴォトス――特にミレニアムは、どんな生徒でも歓迎しますよ？"
"10052140-96-ソフ" = "いや、本当に要らないんだって。"
"10052140-97-ソフ" = "（こんな会話をしてると情けなくなってくるけど、アインのために時間稼ぎをしなきゃいけないし……）"
"10052140-98" = "[s] \"私はみんなのことを諦めないからね。\""
"10052140-99-オウル" = "私たちも考えは変わりませんよ。#nそもそも毎回その話題じゃないですか。話のレパートリー少なすぎませんか？#nとはいえ、これといって話したい話題なんて、お互い無いと思いますが。"
"10052140-100-ミドリ" = "え？じゃあ何しに来たの？"
"10052140-101-ミドリ" = "どちらかというと、いつもそちらが話をしに来ているような……。"
"10052140-102-オウル" = "うっ。"
"10052140-103-ソフ" = "そ、それは、その……！"
"10052140-104-ソフ" = "まあ、ここまで来たんだし？#nだから顔くらい見ておこうかなって。それだけ！"
"10052140-105" = "[s] \"そっか、良い子たちだね。偉い偉い。\""
"10052140-106" = "ではせっかくですし、もう少し交流を深めてみましょう。"
"10052140-107-オウル" = "これ以上何をさせようって言うんですか。#n下手なことをして、情が移りでもしたら困るのはあなた方では？"
"10052140-108-ヒマリ" = "あら、私はすでに移っていますよ？"
"10052140-109-ソフ" = "それ本気？あんた達にとって私たちは、世界を金属で覆いつくそうとする――#n正体不明の悪党なんだよ？"
"10052140-110-エイミ" = "子供のいたずらみたいなものだよ。#n今からでも学園に行って勉強すればいいんだよ。"
"10052140-111-ヒマリ" = "ええ、その通りです。まだ色々と未熟な時期でしょうからね。"
"10052140-112-ヒマリ" = "……まあ、年を重ねても未熟なままの人もいますが。"
"10052140-113-ユズ" = "ひ、ヒマリ先輩……！"
"10052140-114-ヒマリ" = "大丈夫ですよ。"
"10052140-115-リオ" = "誰の話かしら？あの子たち……ではなさそうだけど……。"
"10052140-116-ヒマリ" = "……ほら、見ての通り。"
"10052140-117-ユズ" = "は、はい……。"
"10052140-118" = "[s] \"とにかく、人は勉強すべきなんだからね。\""
"10052140-119-オウル" = "そもそも人ではないのですが。"
"10052140-120" = "[s] \"人だよ。分別を弁えて、礼儀を知れば、何も違いはない。\""
"10052140-121-ソフ" = "なんか勘違いしてるみたいだから教えてあげるけどさ、私たちは知識なんて最初から全部プログラミングされてるからね？"
"10052140-122-ソフ" = "……どうせ人間じゃないんだから。"
"10052140-123" = "[s3] \"全部知ってるつもりになるのは――\"\n[s4] \"まだ知らないことが多い証拠だよ！\""
"10052140-124-トキ" = "先生のおっしゃる通りです。学びに終わりはないという言葉もあります。"
"10052140-125-トキ" = "ですので先生。#n学園に帰ったら、ここで過ごした時間分の個別指導をお願いします。"
"10052140-126-トキ" = "それが、先生としての義務ではありませんか？"
"10052140-127-ケイ" = "それ……本当に勉強のためですか？"
"10052140-128-アリス" = "アリスも一緒に勉強したいです！"
"10052140-129-トキ" = "そ、それは……。"
"10052140-130-トキ" = "分かりました。かわいいアリスの頼みなら仕方ありません。"
"10052140-131-ソフ" = "なに？この茶番……。"
"10052140-132-ソフ" = "……。"
"10052140-133-ソフ" = "とにかく、だからあんた達はいつも後悔するんだよ。"
"10052140-134-ソフ" = "すべてを自分本位に変えておきながら、「こんなことになるとは思わなかった」とか「そんなつもりじゃなかった」とか言って。"
"10052140-135-ソフ" = "その対象が他人であろうが、自然であろうが、世界そのものであろうが。"
"10052140-136-ソフ" = "すべてを滅茶苦茶にしておいて、責任を取る素振りすら見せない。"
"10052140-137-ソフ" = "そんなことやってて、悔いは残らないの？"
"10052140-138-ソフ" = "過去に戻って、もう一度やり直したいとか思わないわけ？"
"10052140-139" = "[s] \"……後悔なんてたくさんあるよ。\""
"10052140-140-リオ" = "……。"
"10052140-141" = "[s5] \"もしもチャンスがあれば、次こそは！って。\"\n[s6] \"誰だって思ったことはあるんじゃないかな。\""
"10052140-142-ヒマリ" = "……。"
"10052140-143" = "[s] \"でも後悔は残っても、過去に戻りたいとは思わない。\""
"10052140-144-オウル" = "……どうしてですか？"
"10052140-145" = "[s] \"前へ進むために、過去を顧みるのだから。\""
"10052140-146-ケイ" = "……！"
"10052140-147" = "[s7] \"最後まで歩き抜くために。\"\n[s8] \"これまで歩んできた道のりを振り返るんだよ。\""
"10052140-148" = "[ns9] \"先人の後を継いで道を切り開くことこそ――\"\n[ns10] \"私たちの生き方だから。\""
"10052140-149-アイン" = "……！"
"10052140-150-アイン" = "人間の、生き方……。"
"10052140-151-アイン" = "じゃあ、私たちは……？"
"10052140-152-アイン" = "……。"
"10052140-153-マルクト" = "アイン？そこにいますか？"
"10052140-154-アイン" = "は、はい！お姉様！"
"10052140-155-アイン" = "ごめんなさい。アインには負担をかけてしまいました。#nですが、我は確かに生まれ変わっています。"
"10052140-156-アイン" = "こ、こちらこそ、ご、ごめんなさい！私たちが弱いあまり……結局、お姉様の手を借りてしまって……！"
"10052140-157-アイン" = "いいえ。我も姉として、アイン、ソフ、オウルに頼られて嬉しく思います。"
"10052140-158-マルクト" = "皆の力になれて、本当に、嬉しいのです。"
"10052140-159-アイン" = "は、はい……！"
"10052140-160-アイン" = "……。"
"10052140-161-アイン" = "ソフ、オウル。き、聞こえますか？ま、まだ大丈夫です……。"
"10052140-162-アイン" = "私たちはまだ――負けません！"
"10052140-163-アイン" = "[ruby=Daath]ダアト[/ruby]の準備が終わりました！#nもうすぐそちらへ向かいます！"
"10052140-164-ソフ" = "そっか。"
"10052140-165-ソフ" = "じゃあ……！"
"10052140-166-オウル" = "ええ。"
"10052140-167-オウル" = "時間稼ぎは十分です。"
"10052140-168-ソフ" = "さあ――聞け！"
"10052140-169-ソフ" = "壊れたものは直せばいい！穢れた神聖には再び光を灯せばいい！"
"10052140-170-オウル" = "私たちはまだやり直せます！あなた達が諦めないのと同じように！#nえっと、それと――"
"10052140-171-ソフ" = "広がる可能性！"
"10052140-172-オウル" = "知識を通じた悟り！"
"10052140-173-ソフ&オウル" = "コクマーの知恵！ゲブラの勇気！"
"10052140-174-ソフ&オウル" = "不離一体から差し込む無形の影！！！"
"10052140-175-ヒマリ" = "あの子たち、何をやっているのでしょうか？"
"10052140-176-リオ" = "あれは……まさか！？"
