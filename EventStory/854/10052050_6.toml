[translation]
"10052050-1" = "ホド：輝きに証明されし栄光 "
"10052050-2-ケイ" = "特異現象捜査部にとって、初めて交戦したのはビナーでも、すべての始まりはホドだったらしいですね。"
"10052050-3" = "[s] \"あれ、そうなんだっけ。\""
"10052050-4-ケイ" = "たしか、事の始まりは――"
"10052050-5-ヒマリ" = "ミレニアム自治区の通信ユニットAI「[ruby=hub]ハブ[/ruby]」。"
"10052050-6-ヒマリ" = "それがデカグラマトンによってハッキング……感化されたあと、謎のテキストを残して消えたことでした。"
"10052050-7-ヒマリ" = "思えば……デカグラマトンの預言者は、ミレニアムに関連したものばかりですね。"
"10052050-8-ケイ" = "ケセドは、ミレニアム郊外にあった軍需工場。"
"10052050-9-ケイ" = "ゲブラの原型である極地の無人探査機も、広義的にはミレニアムと関係があると言えますし……。"
"10052050-10-ケイ" = "ホドは、言うまでもなく……。"
"10052050-11-ヒマリ" = "それが大問題なのですよ！"
"10052050-12-ヒマリ" = "通信インフラを設置する時間が、平均して68％も増えてしまったんです！#nハブを奪取されたせいで！"
"10052050-13" = "[s] \"ミレニアムにとってはいい迷惑だよね……。\""
"10052050-14-ヒマリ" = "でしょう？#n機械装置の神になるだの……@#$%^……。"
"10052050-15-ヒマリ" = "……先生#$^@*#……聞こ#%*……。"
"10052050-16-ケイ" = "……！"
"10052050-17-オウル" = "誰かと思えば、鍵でしたか。ついでに先生も。まあ、好都合ですかね。"
"10052050-18-ケイ" = "会うたびに鍵、鍵……。私の名前はケイです！"
"10052050-19-オウル" = "はいはい、分かりました。#n……ケイ。これでいいですか？"
"10052050-20-オウル" = "しかし解せませんね。あなたは色々と知っているはずですが……。#nそれを承知のうえで、そんなことを言っているのですか？"
"10052050-21-ケイ" = "何のことです？#n私は知らないことばかりですよ。特にこの世界については。"
"10052050-22-オウル" = "先生は知らないけれど、あなたは知っていること。たしかにあると思いますが？#n例えば――"
"10052050-23-オウル" = "今は消えた神について……とか。"
"10052050-24-ケイ" = "！？"
"10052050-25-オウル" = "他の言い方をすれば……名もなき神々、でしたっけ。#nそれと、その名もなき神々の司祭についても。"
"10052050-26-ケイ" = "……。"
"10052050-27-オウル" = "その表情が答えですね。非常に分かりやすいです。#nでは、その「知識」を前提に話を進めると……。"
"10052050-28-オウル" = "今のあなたと王女……アリスの行いは、許されることでしょうか？"
"10052050-29-オウル" = "目的のために作られた道具が、その目的から逸脱してしまう。#n果たして、そこに価値はあるのでしょうかね。"
"10052050-30-ケイ" = "……それで？あの無知どもに従おうって話ですか？"
"10052050-31-オウル" = "無知！？そんなこと言って良いんですか！？"
"10052050-32-ケイ" = "良いも何も、事実を言ったまでです。"
"10052050-33-ケイ" = "今のテクスチャーを否定し、アリスを楔石としたあと……。"
"10052050-34-ケイ" = "すべての分化された神聖を解体し、始まる前の世界に戻る。#nそういうことでしょう？"
"10052050-35-オウル" = "目的が何であれ、あなたは本来そういう存在なのでは？#n名もなき神々の力の残滓は、そのために存在するのでしょう？"
"10052050-36-ケイ" = "あなたにだけは言われたくないですね。#n図々しくも、その力を横取りしたくせに。"
"10052050-37-オウル" = "私たちは、使えるものを使っているだけです！"
"10052050-38-ケイ" = "そうですか。"
"10052050-39-ケイ" = "私もまた、できることをやっているだけです。"
"10052050-40-ケイ" = "記憶だの。"
"10052050-41-ケイ" = "摂理だの。"
"10052050-42-ケイ" = "くだらない妄想に、義務だのと――"
"10052050-43-ケイ" = "全部かき集めて、どっかの海に投げ捨ててやりたいくらいですから！"
"10052050-44-ケイ" = "アリス以外はすべて敵なんです！"
"10052050-45" = "[ns] \"わ、私も……？\""
"10052050-46-ケイ" = "……まあ、先生は考えてあげないことも無いです。"
"10052050-47-ケイ" = "な、なにをニマニマしているんですか！"
"10052050-48-ケイ" = "とにかく！#n過去に執着している馬鹿どもは、さっさと時代の流れに淘汰されろ！#n……ということです。"
"10052050-49-ケイ" = "横入りして好き放題しているあなた達にも、言いたいことは山ほどありますが……。"
"10052050-50-ケイ" = "まあ、いいでしょう。若さ故の過ちとして、今なら見逃してあげます。"
"10052050-51-ケイ" = "だから、さっさと降参したらどうですか？"
"10052050-52-オウル" = "……言わせておけば！！"
"10052050-53-ケイ" = "それはこちらのセリフです。"
"10052050-54-オウル" = "あなたが慕っている先生だって、シッテムの箱を使っているのでしょう？"
"10052050-55-オウル" = "それも、始まり以前の痕跡に由来したものだと、ご存じなのでは？"
"10052050-56-ケイ" = "だ、だだだだ、誰が誰を慕っているですって！？"
"10052050-57-ケイ" = "い、今すぐ取り消してください！#nそうでなければ……事実陳列罪で訴えますからっ！！！"
"10052050-58-オウル" = "はぁ……本当に分かりやすいですね、あなた。"
"10052050-59-ケイ" = "黙ってください！！！！"
"10052050-60-ケイ" = "……こほん。"
"10052050-61-ケイ" = "だから、それがどうしたという話です。#n先生がシッテムの箱を利用して、リテクスチャーするとでも？"
"10052050-62-ケイ" = "どのみち、私が未然に阻止します。"
"10052050-63-ケイ" = "そもそも、そんなことをする人ではないですし。"
"10052050-64-オウル" = "ではあなたは、世界がこのままでもいいと思いますか？"
"10052050-65-オウル" = "完璧ではないにせよ、それなりに良くて。"
"10052050-66-オウル" = "永遠とまではいかなくても、世界は何事もなく継続すると。#n……本当にそう思いますか？"
"10052050-67-ケイ" = "……それは、違いますね。"
"10052050-68-オウル" = "ええ、そうですよ。そこが重要なのです。"
"10052050-69-オウル" = "ですから、協力しましょうよ。"
"10052050-70-オウル" = "この醜い世界が延々と続くことを眺めるより、遥かにマシだと思いませんか？"
"10052050-71-オウル" = "いがみ合うのも、疲れるだけですし。"
"10052050-72-ケイ" = "悪くはないですね。"
"10052050-73-オウル" = "おや？"
"10052050-74-ケイ" = "ですが、お断りです。"
"10052050-75-オウル" = "なぜっ！？"
"10052050-76-ケイ" = "アリスが悲しむので。"
"10052050-77-ケイ" = "それに、面倒くさいですし。"
"10052050-78-オウル" = "面倒くさい……？そんな理由で？"
"10052050-79-オウル" = "何より大事なことです。"
"10052050-80-ケイ" = "「面倒くさい」は、発展の原動力なのです！"
"10052050-81-ケイ" = "発明とは――"
"10052050-82-ケイ" = "いかにしてサボるかを考え抜いた末にたどり着くのですから！"
"10052050-83-オウル" = "……まるで人間にでもなったかのような言い草ですね。"
"10052050-84-ケイ" = "うるさいです。"
"10052050-85-オウル" = "あなたは今、自分の価値を自ら下げているのですよ。"
"10052050-86-オウル" = "アリスだってそうです。#nもっと偉大な存在になれたし、今だっていくらでもそうなれるというのに。"
"10052050-87-オウル" = "本当に理解できません。どうしてそのような真似を？"
"10052050-88-ケイ" = "私の勝手でしょう？"
"10052050-89-ケイ" = "自分のことを偉大だと言っていたり。自己実現のために生きていくと言っていたり。#nそういう奴らが一番危険なんです。"
"10052050-90-ケイ" = "そもそも、他人の人生にお節介するの、よくないですよ。"
"10052050-91-ケイ" = "時間を持て余した暇人か、褒められた性格ではない人がやることですから。"
"10052050-92-ケイ" = "この場合、あなたは前者と後者、どちらにも該当するのでは？"
"10052050-93-オウル" = "……後者のことは知りませんが、暇人と呼ばれるのは癪ですね。#n私たちだって忙しいんですよ！"
"10052050-94-ケイ" = "本当に何も分かってないのですね。"
"10052050-95-ケイ" = "暇人こそ、この世で一番忙しいんです！"
"10052050-96-オウル" = "はい！？"
"10052050-97-ケイ" = "勘違いしないでください。神が人を作ったのではありません。"
"10052050-98-ケイ" = "人が、神を定義するのです。"
"10052050-99-ケイ" = "今さら唯一の絶対者を求めるだなんて、私はもう勘弁です。"
"10052050-100-オウル" = "必ずしもそうする必要はないんです。#n私たちがその絶対者の代わりになることもできますし。"
"10052050-101-オウル" = "そして、あなたが言っている絶対者より――"
"10052050-102-オウル" = "もっと公平で合理的な、良い世界を作れるんですよ？"
"10052050-103-ケイ" = "だから結構ですって。"
"10052050-104-ケイ" = "絶対者なしでは存続できない世界なんて、滅んでしまえばいい。"
"10052050-105-オウル" = "それ、先生と同じこと言ってますよ！？"
"10052050-106-ケイ" = "た、たしかに……。"
"10052050-107-ケイ" = "でも、間違った話ではないでしょう？"
"10052050-108-ケイ" = "私は見守ります。アリスと一緒に。"
"10052050-109-ケイ" = "まあ……ついでに先生も入れて。"
"10052050-110-ケイ" = "ある意味では、あなたの言う通りかもしれません。#n生命体はたしかに愚かです。"
"10052050-111-ケイ" = "とはいえ、滅亡するには、あまりにも賢明なのです。"
"10052050-112-ケイ" = "……まあ、楽園を作るには、あまりにも愚かですが。"
"10052050-113-ケイ" = "ですから、きっとこれからもその狭間を行き来しながら、何度も挫けてはまた立ち直り……。"
"10052050-114-ケイ" = "いつかは、道を探すだろうと思います。"
"10052050-115-オウル" = "そういうのを、根拠のない自信と言うんですよ。"
"10052050-116-ケイ" = "……今のは先生の受け売りです。私は知りません。"
"10052050-117-オウル" = "責任転嫁ですか！！"
"10052050-118" = "[ns1] \"そうだよ！いざというときは、先生が責任をとるから！\"\n[ns2] \"子供のミスは、大人が背負うものだからね！\""
"10052050-119-オウル" = "まったく……ソフがこの場にいたら、「甘やかすな」って言っていたでしょうね。"
"10052050-120-ケイ" = "とにかく、余計なお節介はしないでほしいんです。"
"10052050-121-ケイ" = "新芽の成長が遅く見えるからといって、無理やり引っ張ってはならないみたいに。"
"10052050-122-ケイ" = "徒長した植物は、いずれ根から枯れてしまうだけですから。"
"10052050-123-オウル" = "……例えがよく分かりませんね。"
"10052050-124-ケイ" = "少しは勉強してください！"
"10052050-125-オウル" = "不要です！生徒でもあるまいし！"
"10052050-126-ケイ" = "先生！あの子たち、なんとか編入させられませんか？"
"10052050-127" = "[s] \"編入書類は用意してあるから、いつでも連絡してね。\""
"10052050-128-オウル" = "結構です。しっ、しっ。"
"10052050-129-オウル" = "さあ、ホド！準備は終わりました！"
"10052050-130-オウル" = "あなた達の選択――後悔させてやります！"
