[translation]
"10046280-1-正義実現委員会部員" = "い、イチカ先輩！"
"10046280-2-イチカ" = "あれ、何か用っすか？道に迷ったとか……？"
"10046280-3-正義実現委員会部員" = "い、いえ！"
"10046280-4-正義実現委員会部員" = "えっと、イチカ先輩が一人でパトロールしてるって聞いて……。"
"10046280-5-イチカ" = "ああ、なるほど。"
"10046280-6-正義実現委員会部員" = "ゆ、勇気を振り絞って来たんですけど……。"
"10046280-7-正義実現委員会部員" = "その……ご迷惑でしたか……？"
"10046280-8-正義実現委員会部員" = "私の力なんて、大したことない……ですし……。"
"10046280-9-イチカ" = "…………。"
"10046280-10-イチカ" = "ちょっと手伝ってもらってもいいっすか？"
"10046280-11-正義実現委員会部員" = "えっ……！？"
"10046280-12-イチカ" = "実は、私もそろそろ限界だったんすよね。"
"10046280-13-イチカ" = "休暇中のところ申し訳ないっすけど、少しつきあって欲しいっす。"
"10046280-14-正義実現委員会部員" = "は、はい！ぜひ！"
"10046280-15-イチカ" = "ふふっ、助かるっす。じゃ、行くっすよ！"
"10046280-16-正義実現委員会部員" = "は、はいっ！"
