"10014040-34-アイリ" = "今日から私たちの部活は「放課後スイーツ部」から#n「放課後スイーツ団」に変えることにしたのだ。"
"10014040-35-アイリ" = "今日から私たちの部活は「放課後スイーツ部」から#n「放課後スイーツ団」に変えることにしたのだ。"
