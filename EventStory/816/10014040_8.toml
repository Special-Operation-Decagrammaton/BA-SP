"10014040-47-レイサ" = "もしかしたら、本当に悔い改めてるのではないかと思ったのに……やっぱり！#nそんな事ないですよね！！"
"10014040-48-レイサ" = "あなたの邪悪な本性は、そう簡単に変わるようなものではないでしょうから！"
"10014040-49-レイサ" = "「放課後スイーツ団」……なんという恐ろしい名前！！"
