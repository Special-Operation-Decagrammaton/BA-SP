"10014040-80-アイリ" = "あなたが誰かは知りませんが……私たちも黙っていませんから！！"
"10014040-81-カズサ" = "……なに？"
"10014040-82-レイサ" = "決闘成立ですね……いいでしょう。#n覚悟してください！！"
"10014040-83-ナツ" = "私たち「放課後スイーツ団」の結束を見せてやろう！！"
