"10014040-51-レイサ" = "さらに、また先生を誘拐して……！#n公権力まで掌握しようとするなんて！！"
"10014040-52-レイサ" = "やはり、あなたは再起のチャンスを窺っていた……"
"10014040-53-レイサ" = "そう、復活のために新しい組織を立ち上げたのですね[ruby=きょうやま]杏山[/ruby]カズサ！"
"10014040-54-レイサ" = "いえ……"
"10014040-55-レイサ" = "「キャスパリーグ」！！"
"10014040-56-トリニティの生徒B" = "何の話……？#nキャス……なに？"
"10014040-57-トリニティの生徒B" = "キャスパリーグって伝説のスケバンでしょ？#nあの子たちスケバンなの？"
"10014040-58-ナツ" = "……キャスパ……なに？"
"10014040-59-ナツ" = "誘拐……！？"
