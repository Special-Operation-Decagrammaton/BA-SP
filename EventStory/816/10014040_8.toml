"10014040-17-カズサ" = "……？"
"10014040-18-カズサ" = "……？？？"
"10014040-19-ナツ" = "ハッハッハ！#n慌ててるねぇ。なかなか可愛い顔をするじゃあないか。"
"10014040-20-アイリ" = "あ、当たり前です！#nわ、私たちは怖いですからね！ふ、不良なんですから！"
"10014040-21-ヨシミ" = "えー……これで合ってる？#n本当に大丈夫？"
"10014040-22-カズサ" = "……なに？"
"10014040-23" = "[s3] \"……？？？\"\n[s4] （不良のコスプレ……？）"
"10014040-24-カズサ" = "あ、あんた達……ここで何してるの？#n……その格好は一体？"
"10014040-25-カズサ" = "あ、あんた達……ここで何してるの？#n……その格好は一体？"
"10014040-26-アイリ" = "か、カズサちゃん！#nカズサちゃんが何者だったとしても、私たちはカズサちゃんと一緒だよ！"
"10014040-27-カズサ" = "それはありがたいけど……#nそれ以上に、今なにしてるのか聞いてるんだけど……。"
