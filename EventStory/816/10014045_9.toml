[translation]
"10014045-1-ヨシミ" = "こいつ、威勢の割には大したことなかったわね。"
"10014045-2-ヨシミ" = "もう床に伸びちゃってるけど……もしかして気絶しちゃった？"
"10014045-3-アイリ" = "こ、こっちは4人だし……先生もいますから……"
"10014045-4-ヨシミ" = "そうね。#nまったく、一体なんなのよコレ……"
"10014045-5-ナツ" = "やはり素晴らしい、誰も私たちを止められない！！#nこの勢いで周辺を占拠するのだ！！"
"10014045-6-ヨシミ" = "キャス……"
"10014045-7-ナツ" = "キャスパ……"
"10014045-8-ヨシミ" = "……キャスパリーグ、でしょ。"
"10014045-9-ナツ" = "い、いや。さすがにそれは違うと思うけど……"
"10014045-10-カズサ" = "ねぇ……ちょっと……"
"10014045-11-カズサ" = "お願いだから、もうやめて。"
"10014045-12" = "[s1] \"その……みんな、カズサを理解しようとしてるんだと思う。\"\n[s2] \"やり方はどうかとは思うけどね。\""
"10014045-13-カズサ" = "はぁ……またそんな風に言って……"
"10014045-14-カズサ" = "はぁ……またそんな風に言って……"
"10014045-15-カズサ" = "……いや、もう我慢できない。"
"10014045-16-カズサ" = "先生には申し訳ないけど、これ以上は黙ってられない。#n言いたいことは言わせて。"
"10014045-17-カズサ" = "……あのさ。"
"10014045-18-カズサ" = "もう、こんな馬鹿なことはやめて。#nお願いだから。"
"10014045-19-カズサ" = "ただでさえ、あの馬鹿のせいで大変なのに。#nこれ以上面倒を増やさないで。"
"10014045-20-ナツ" = "……！"
"10014045-21-アイリ" = "……！？"
"10014045-22-アイリ" = "カ、カズサちゃん！？#n私たちは、ただ……！"
"10014045-23-ナツ" = "私達を関わらせたくないのならもう遅いよ。"
"10014045-24-ナツ" = "だって私たちは同じ船に乗ることにした……"
"10014045-25-ヨシミ" = "ちょっと、まずはカズサの話を聞こうよ。#n言い訳は後でいいでしょ！"
"10014045-26-ナツ" = "……はい。"
"10014045-27-カズサ" = "はぁ……ありがとう、ヨシミ。#nあんたに感謝する日が来るなんてね。"
"10014045-28-カズサ" = "どうしてこんな事したのかはなんとなく分かるし、その気持ちはありがたいけど。#n……もうやめて。"
"10014045-29-カズサ" = "理解しようとしてくれる気持ちは嬉しいんだけどさ。#n私、そんな事頼んだっけ。"
"10014045-30-カズサ" = "今まで言ってなかった理由を考えて。"
"10014045-31-アイリ" = "そ、それは……。"
"10014045-32-カズサ" = "……この際だからハッキリ言っておくけど。"
"10014045-33-カズサ" = "私にとっては、全部忘れたい事なの。"
"10014045-34-カズサ" = "空気悪くしてごめん。そういうことだから、今後は触れないで。#n私も今回の事は見なかったことにするから。"
"10014045-35-カズサ" = "それに、あいつも……"
"10014045-36-カズサ" = "……いいや。#nちょっと疲れた……ごめん、詳しいことは後でまた。"
"10014045-37-カズサ" = "じゃあ……。"
"10014045-38-ナツ" = "カズサちゃん……。"
"10014045-39-ナツ" = "……うーん。"
"10014045-40-ヨシミ" = "……。"
"10014045-41-ヨシミ" = "……？"
"10014045-42-ヨシミ" = "あ、起きた。"
"10014045-43-レイサ" = "…………。"
"10014045-44-アイリ" = "……いえ……起きたのではなく……。"
"10014045-45" = "[s] \"……聞いてたんだね。\""
"10014045-46-ナツ" = "……あちゃー。"
"10014045-47-ナツ" = "さっきの言葉を全部聞いたのだな……ううむ、ちょっと困ったね。"
"10014045-48-アイリ" = "えっ？#nナツちゃん、それってどういうこと……？"
"10014045-49-レイサ" = "…………。"
