[translation]
"10014075-1-カズサ" = "はぁ、はぁ……"
"10014075-2-ヨシミ" = "も、もう……この辺でいいんじゃないの……"
"10014075-3-アイリ" = "この辺りなら大丈夫かな……？#nトリニティ自治区まで来たし……"
"10014075-4-ヨシミ" = "っていうか、逃げる必要があったの？#nほぼ勝ったようなものだったじゃん……？"
"10014075-5-アイリ" = "いや、あれ以上の時間稼ぎは本当に危ない。#nそろそろヴァルキューレのサツが来る頃だったから……"
"10014075-6-カズサ" = "あの場に残ってたら、今頃みんな捕まってただろうね。"
"10014075-7-ヨシミ" = "そ、そうなんだ……。"
"10014075-8-ヨシミ" = "……ところで「サツ」って何？"
"10014075-9-カズサ" = "……あ。"
"10014075-10" = "[s1] \"専門用語が……\"\n[s2] \"たぶん、ヴァルキューレ警察学校のことだよ。\""
"10014075-11-ヨシミ" = "ああ……警察学校の生徒の事か……。#nつか、よく先生もそんなの知ってるね。"
"10014075-12-ヨシミ" = "ああ……警察学校の生徒の事か……。#nつか、よく先生もそんなの知ってるね。"
"10014075-13-ナツ" = "そして、キャスパリーグの復活を阻止しようとした彼女らは……#n逆に一掃されてしまったのであった。"
"10014075-14-ナツ" = "ああ……世界は魔獣の復活を防ぐ事ができず、再び闇の時代へ――"
"10014075-15-カズサ" = "やめてよ！！！"
"10014075-16-カズサ" = "もう！！"
"10014075-17-カズサ" = "やめて"
"10014075-18-カズサ" = "って！！"
"10014075-19-カズサ" = "言った"
"10014075-20-カズサ" = "でしょ！"
"10014075-21-カズサ" = "サイアク！！"
"10014075-22-ナツ" = "あ、ああ～！！あああ～～～！！これ、が……"
"10014075-23-アイリ" = "あはは……"
"10014075-24-ヨシミ" = "……くくっ。"
"10014075-25" = "[s3] \"楽しそうだね、ヨシミ。\"\n[s4] \"ここ最近で一番の笑顔だよ。\""
"10014075-26-ヨシミ" = "……うん、もちろん。"
"10014075-27-ヨシミ" = "……うん、もちろん。"
"10014075-28-ヨシミ" = "今最高に楽しいから……このままでいさせて。"
"10014075-29-ヨシミ" = "……ところで、こいつはどうするの？"
"10014075-30-ヨシミ" = "こいつ……？#nあー……"
"10014075-31-アイリ" = "そういえば……壁を壊した時からもう気絶していましたね……"
"10014075-32-ナツ" = "うーん。戦うどころか、私たちの顔も見てないだろうね。"
"10014075-33-アイリ" = "でも幸い、特に怪我したりは……なさそうです！"
"10014075-34-カズサ" = "……そう。じゃ、気にしなくていいよ。#nまあ、適当にこの辺のベンチに寝かせておけばいいから。"
"10014075-35-アイリ" = "え、ええ！？！？#nカ、カズサちゃん！？"
"10014075-36-ヨシミ" = "いやちょっと……いくらなんでも、気絶した人をそのままベンチに放置は……"
"10014075-37-カズサ" = "……いや待って、私を信じて。#nこいつ本当に大丈夫だから。"
"10014075-38-カズサ" = "知ってて言ってる……こういうの何回も見てきてるし。#nってか、そもそもこいつ、ベンチで寝るの好きだし。"
"10014075-39-ナツ" = "なるほど……悪縁から育まれた信頼関係か。"
"10014075-40-ナツ" = "……ロマンだね。"
"10014075-41" = "[s5] \"……うん、確かに。\"\n[s6] \"今回はナツの話が正しいかもね。\""
"10014075-42-カズサ" = "もう、うるさいよ！！#n何がロマンよ……"
"10014075-43-カズサ" = "もう、うるさいよ！！#n何がロマンよ……"
"10014075-44-カズサ" = "……うーん。"
"10014075-45-ヨシミ" = "……何してんの？"
"10014075-46-アイリ" = "カズサちゃん、それ……挑戦状？#nレイサちゃんに返すの？"
"10014075-47-カズサ" = "まぁ……私が持っててもしょうがないから、持ち主に返す。#nそれだけ。"
"10014075-48-ナツ" = "なるほど。ツンデレってことか。"
"10014075-49-カズサ" = "やめろって言ったよね。"
"10014075-50-カズサ" = "はぁ、ホント疲れた……どうしてこんな事に……"
"10014075-51-カズサ" = "いーい腹時計を持ってらっしゃるわねぇ？"
"10014075-52-カズサ" = "みんな一晩中頑張ったからね……"
"10014075-53-ヨシミ" = "うむ。糖分補給が必要だな。"
"10014075-54" = "[s7] \"じゃあ、何か食べに行こうか。\"\n[s8] \"今日は先生の奢りだよ。\""
"10014075-55-放課後スイーツ部" = "……やったー！！"
