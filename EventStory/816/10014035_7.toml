[translation]
"10014035-1" = "（その日の夕方）"
"10014035-2-カズサ" = "……あれ、早く来てたんだ。#nお待たせして申し訳ないです。"
"10014035-3" = "[s1] \"いま来たとこだから気にしないで。\"\n[s2] \"のんびりしてるのが好きだから大丈夫。\""
"10014035-4-カズサ" = "まあ、そう言ってくれるのはありがたいけど……"
"10014035-5-カズサ" = "まあ、そう言ってくれるのはありがたいけど……"
"10014035-6-カズサ" = "いつもそう言ってくれるから、逆に本当に大丈夫なのか分からなくなるね……。"
"10014035-7-カズサ" = "……冗談だよ。#nどちらでもありがたいという事実には変わりはないし。"
"10014035-8-カズサ" = "それで、用件は？#n何かいい解決方法でもあった？"
"10014035-9-カズサ" = "……[ruby=うざわ]宇沢[/ruby]？"
"10014035-10-カズサ" = "あいつがどうしたの？#nもしかして、また先生に何かしたの？"
"10014035-11-カズサ" = "……ん？"
"10014035-12-カズサ" = "直接話したこと？私が？#n急にどうしたのさ……"
"10014035-13-カズサ" = "正直、話したことなんかないよ。#nあんな風に突っかかってくるのに、会話なんか無理だよね。"
"10014035-14-カズサ" = "それにあいつ見てると何か……#n決闘とか言ってるくせに、それを楽しんでるっていうか。"
"10014035-15-カズサ" = "それがあまりにも昔のまますぎて……見てると疲れるっていうか。"
"10014035-16-カズサ" = "……ところでそれがどうしたの？"
"10014035-17-カズサ" = "……？"
"10014035-18-カズサ" = "もうちょっと分かったら話す……？#nそう……。"
"10014035-19-カズサ" = "……ん？"
"10014035-20-カズサ" = "っていうかもしかして、先生あいつに会った？"
"10014035-21-カズサ" = "……そう。"
"10014035-22-カズサ" = "あいつ、何か言ってた？"
"10014035-23" = "[s3] \"……うん、色々。\"\n[s4] 聞いた話を全部話す。"
"10014035-24-カズサ" = "……。"
"10014035-25-カズサ" = "……？"
"10014035-26-カズサ" = "……。"
"10014035-27-カズサ" = "………。"
"10014035-28-カズサ" = "………………。"
"10014035-29" = "[s5] \"……カズサ、大丈夫？\"\n[s6] \"もう頭あげた方が……。\""
"10014035-30-カズサ" = "……はぁ……すーっ……。#nはぁ……。"
"10014035-31-カズサ" = "……はぁ……すーっ……。#nはぁ……。"
"10014035-32-カズサ" = "ご、ごめん。先生……ちょっと……。#nもうちょっとだけ、頭を冷やしてもいいかな……。"
"10014035-33-カズサ" = "本当に……。#n本当にそう言ってたの……？"
"10014035-34-カズサ" = "不良の神話……獣のオーラ……"
"10014035-35-カズサ" = "キャスパリーグ……？"
"10014035-36" = "[s7] \"独特のネーミングセンスだよね。\"\n[s8] \"もしかして、そのあだ名が恥ずかしかったり？\""
"10014035-37-カズサ" = "いや正気……？#n先生、もしかしてからかってる？"
"10014035-38-カズサ" = "あったり前でしょ！！！"
"10014035-39-カズサ" = "もう最悪！ほんっともう！！#nあいつ、マジでそんなこと言ったの！？"
"10014035-40-カズサ" = "あいつ、マジでいつまであんな事言ってんのよ！？#n恥ずかしくないワケ！？"
"10014035-41-カズサ" = "ねえ、その場に他の人いたりした？#nまさか……他にも聞いた人いたの？"
"10014035-42-カズサ" = "い、いない？いないよね？お願いだからいないって言って、先生！#n先生しか聞いてないって！ねぇ、お願い……！！"
"10014035-43-カズサ" = "……ああ……そう。"
"10014035-44-カズサ" = "他の自警団と……倒れていたスケバン……？#n結構な人が聞いたんだね……？"
"10014035-45-カズサ" = "……え？#n放課後スイーツ部のみんなも……？なんで？"
"10014035-46" = "[s9] \"それは私の不手際で……。\"\n[s10] \"本当に申し訳ありませんでした。\""
"10014035-47-カズサ" = "……ふふ……。"
"10014035-48-カズサ" = "……ふふ……。"
"10014035-49-カズサ" = "ふふ……はは……。#n噂が広がっちゃうな～……もう一生フードかぶって生きないとね♪"
"10014035-50" = "[s11] \"カズサ……。\"\n[s12] \"カズサが壊れた……。\""
"10014035-51-カズサ" = "くそ……マジ最悪……。"
"10014035-52-カズサ" = "くそ……マジ最悪……。"
"10014035-53-カズサ" = "ううっ……もう恥ずかしすぎて、生きていけない……。"
"10014035-54-カズサ" = "もう終わり……私は一生、厨二病患者としてレッテルを貼られるんだ……。"
"10014035-55-カズサ" = "……え？"
"10014035-56-カズサ" = "別にそう悲観するほどの事じゃない、って？"
"10014035-57-カズサ" = "……先生。"
"10014035-58-カズサ" = "先生も宇沢に感化されちゃったかもしれないけど……。"
"10014035-59-カズサ" = "普通に考えてみてよ。#nキャスパリーグだのなんだの言ったって、結局はただのスケバン。"
"10014035-60-カズサ" = "ただ喧嘩が強いだけの子どもだったっていうだけ。#n別にすごくなんてない。"
"10014035-61-カズサ" = "世間を知らない、分別のない子ども……。"
"10014035-62-カズサ" = "……そう。#nそれなのに自分の事を特別だなんて思っていた、過去の自分が余計恥ずかしいの。"
"10014035-63-カズサ" = "だからもう忘れたいんだ……。#nあの時の全てを消してしまいたい。"
"10014035-64-カズサ" = "私さ。ある時、急に目が覚めて悟ったんだ……#nいくら格好つけたって、傍から見たらただ幼稚で情けないだけっていう事に。"
"10014035-65-カズサ" = "先生は優しいから気遣ってくれるけど……。#n残念ながら私はそんな気休めで楽になるほどバカじゃないんだ。"
"10014035-66-カズサ" = "言ったでしょ？#n誰だって、忘れたい過去の一つや二つ持ってるものだって。"
"10014035-67" = "[s13] \"忘れたい過去……か。\"\n[s14] \"蓋をしたいんだね、カズサは。\""
"10014035-68-カズサ" = "……はあ。"
"10014035-69-カズサ" = "……はあ。"
"10014035-70-カズサ" = "まぁ、そういう事。#nでもよかった。先生が宇沢に上手く説明してくれたって話だし……。"
"10014035-71-カズサ" = "今後も少しずつ説得すれば聞いてくれるかな。#nちょっとその道のりが大変だろうけど。"
"10014035-72-カズサ" = "まぁ、結局は必要になる事だし……割り切らないとね。"
"10014035-73-カズサ" = "……ふぅ。"
"10014035-74-カズサ" = "……なんだっていいけど……。#n早く終わってほしいな。"
