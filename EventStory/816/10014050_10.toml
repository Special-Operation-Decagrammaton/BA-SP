"10014050-58-レイサ" = "せ、先生……！？"
"10014050-59" = "[s9] \"これは……仕方ないね。\"\n[s10] \"とりあえず私に指揮を取らせて、レイサ。\""
"10014050-60-レイサ" = "あ……"
