"10014050-16-レイサ" = "……え？それはどういう……#nすみません、よく分かりません……。"
"10014050-17-レイサ" = "……え？それはどういう……#nすみません、よく分かりません……。"
"10014050-18-レイサ" = "杏山カズサはスケバンではないのですから。#nもう倒す必要も、挑戦する必要もなくなりました……。"
