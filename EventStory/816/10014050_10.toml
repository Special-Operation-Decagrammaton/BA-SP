"10014050-28-レイサ" = "……まあ、そもそも連絡するような相手もいませんが。#nあはは……。"
"10014050-29-レイサ" = "それはともかく。#n……先生はどうしてこんな事を私に聞くんですか？"
"10014050-30-レイサ" = "もしかして……"
"10014050-31-？？？" = "ここにいた！！自警団のチビ！！"
