"10014050-46" = "[s7] \"……あ、まさか。\"\n[s8] \"話がこじれてきたような。\""
"10014050-47-スケバンA" = "ちょ、ちょっと待ってください！#nそれは誤解です！！そんな組織はありません！！"
"10014050-48-スケバンA" = "ちょ、ちょっと待ってください！#nそれは誤解です！！そんな組織はありません！！"
