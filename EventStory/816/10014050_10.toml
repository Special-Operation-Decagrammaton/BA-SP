"10014050-33" = "[ns] \"……！？\""
"10014050-34-スケバンB" = "ああ、こいつで間違いない！！"
"10014050-35-スケバンB" = "おい！応援全員呼べ！逃がすなよ！#n今が絶好のチャンスだからな！"
"10014050-36" = "[s5] \"逃すなよ……？\"\n[s6] \"絶好のチャンス？\""
"10014050-37-スケバンA" = "あ？何だよ。#n大人も一緒にいんじゃん……。"
"10014050-38-スケバンA" = "あ？何だよ。#n大人も一緒にいんじゃん……。"
