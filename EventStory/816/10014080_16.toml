[translation]
"10014080-1" = "第8話;封印された魔獣は……"
"10014080-2" = "（……翌日）"
"10014080-3-カズサ" = "やっほ、先生。"
"10014080-4-カズサ" = "……ふふ。今度は私が先生を待つ番だからね。"
"10014080-5-カズサ" = "先生は普段こんな早くに来てるんだね。"
"10014080-6" = "[s1] \"早いね、カズサ。\"\n[s2] \"約束の時間はだいぶ先なのに……\""
"10014080-7-カズサ" = "……ん？いや、別に用事があるわけじゃないんだけど。"
"10014080-8-カズサ" = "……ん？いや、別に用事があるわけじゃないんだけど。"
"10014080-9-カズサ" = "ただ、先生がいつもどのくらい早く約束の時間に来てるのか確かめたかっただけ。"
"10014080-10-カズサ" = "まあ、こんな風に余裕ができたのも、全部先生のおかげだよ。"
"10014080-11-カズサ" = "……ありがとう、先生。#n心から感謝してる。"
"10014080-12" = "[s3] \"前より態度がちょっとラフになったね。\"\n[s4] \"話し方に余裕が出てきたね、カズサ。\""
"10014080-13-カズサ" = "まあ……そうだね。"
"10014080-14-カズサ" = "まあ……そうだね。"
"10014080-15-カズサ" = "実は今回のこと……先生に話すまでは、どうすればいいか見当もつかなくて。"
"10014080-16-カズサ" = "相談したのも、藁をもつかむ思いだったんだけど……お願いして正解だった。"
"10014080-17-カズサ" = "……途中までは、ちょっと頼りなくてムカついたけどね。"
"10014080-18-カズサ" = "……先生さ。"
"10014080-19-カズサ" = "今回のこと、実は最初から全部分かってたんじゃない？#n……ただ、私がどう受け止めるかの問題だって。"
"10014080-20-カズサ" = "だから、[ruby=うざわ]宇沢[/ruby]じゃなくて私を呼び出し続けた。#nそうだよね？"
"10014080-21-カズサ" = "……どうして直接言ってくれなかったの？"
"10014080-22-カズサ" = "その……純粋に気になって。#n先生は、ずっと見守るばっかりだったから。"
"10014080-23-カズサ" = "「受け止め方次第」、「前向きに考えよう」、「気持ち次第だよ」……#nそうやって、雑に励ませばいいだけだったと思うんだよ。事実、そうだし。"
"10014080-24-カズサ" = "今になって自分でも思うし、私も相談されたらそう言うと思う。"
"10014080-25" = "[s5] \"……そりゃ「今になって」でしょ。\"\n[s6] \"言葉で解決する問題じゃなかったからね。\"\n[s7] \"見守ることが必要だったから。\""
"10014080-26-カズサ" = "……うーん。"
"10014080-27-カズサ" = "……うーん。"
"10014080-28-カズサ" = "……うーん。"
"10014080-29-カズサ" = "そっか。正直、まだちょっと分からないところも多いけど……"
"10014080-30-カズサ" = "まあ……大丈夫。#nある程度は、そうだね……分かったし。"
"10014080-31-カズサ" = "……ん？"
"10014080-32-カズサ" = "……なんて？"
"10014080-33-カズサ" = "まだ一つ聞いてないこと？#n……なに？"
"10014080-34-カズサ" = "……スケバンをやめた理由？#nえ……言ってなかったっけ？"
"10014080-35-カズサ" = "……もっと詳しい理由、ねぇ。"
"10014080-36-カズサ" = "でも、本当に大した理由じゃないんだけど……"
"10014080-37-カズサ" = "あんまり面白くないし、期待してたらガッカリすると思うけど。#n大丈夫そう？"
"10014080-38-カズサ" = "……あ、はい。わかったわかった……。#nここまでお世話になったんだから、それくらい言いますよ。"
"10014080-39-カズサ" = "まあ、その……"
"10014080-40-カズサ" = "本当になんでもない日にさ。#nいつものように喧嘩して、勝利に酔いしれながら家に帰ってたの。"
"10014080-41-カズサ" = "そしたら……偶然、ある子が目に入って。"
"10014080-42" = "道の片隅にあるきれいなカフェで、ケーキやパフェを食べながら騒いでて。"
"10014080-43" = "なんで食べてるのか分からない……チョコミントを食べながら友達と笑っててさ。"
"10014080-44-カズサ" = "自分でもよく分からないけど……それを見て、足が止まったの。"
"10014080-45-カズサ" = "不思議だよね。本当に何でもなかったのに。#nなんでだろう……"
"10014080-46" = "……すごく楽しそうだったんだ。#n可愛くて、やわらかくて……暖かい笑顔だった。"
"10014080-47-カズサ" = "あの時の私じゃ、どう逆立ちしたって真似できない雰囲気でさ。"
"10014080-48-カズサ" = "そう思ったら……急にあの子みたいになりたくなって。"
"10014080-49-カズサ" = "……あんな素敵な女の子になりたかった。#nホント、それだけ。"
"10014080-50-カズサ" = "バカみたいに真似してたら、いつの間にかこうなってたの。"
"10014080-51-カズサ" = "まあ……そういう事で、昔の自分は忘れたかったんだよね。"
"10014080-52-カズサ" = "今回はちょっと……それがいき過ぎて、ヒステリー気味だったかも。"
"10014080-53-カズサ" = "あの子達と全く同じになる必要はなかったのに……"
"10014080-54-カズサ" = "……？"
"10014080-55-カズサ" = "……ん。"
"10014080-56-カズサ" = "……はは。"
"10014080-57-カズサ" = "……なるほど、そっか。#nそういうことだったんだ。"
"10014080-58-カズサ" = "先生……"
"10014080-59-カズサ" = "……本当……大人ってずるいね。"
"10014080-60" = "[s8] \"部室に戻ろっか。\"\n[s9] \"これで、相談は終わりだね。\""
"10014080-61-カズサ" = "……うん。"
