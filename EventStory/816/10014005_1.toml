[translation]
"10014005-1" = "プロローグ;先生に相談したいこと"
"10014005-2-？？？" = "……もしもし？"
"10014005-3-？？？" = "あ、本当に繋がるんだ。"
"10014005-4-？？？" = "その……先生、今シャーレにいる？"
"10014005-5" = "[s1] \"あれ、この声は……？\"\n[s2] \"もしかして放課後スイーツ部の……？\""
"10014005-6-カズサ" = "……あ、ごめん。自分からかけておいて挨拶してなかったね。#nすみません。"
"10014005-7-カズサ" = "トリニティ総合学園1年生。#n放課後スイーツ部の[ruby=きょうやま]杏山[/ruby]カズサです。"
"10014005-8-カズサ" = "あー……えっと、その……"
"10014005-9-カズサ" = "はぁ……これどう言えばいいんだろ……。"
"10014005-10-カズサ" = "先生、時間大丈夫？#nよかったらちょっと……今から会える？"
"10014005-11-カズサ" = "場所は……踏切のあたり。#n写真撮って送るね。"
"10014005-12" = "[s3] \"急に二人きりに！？\"\n[s4] \"いいけど……どうしたの？\""
"10014005-13-カズサ" = "……ふぅん。#nみんなが言ってた事、ちょっと分かってきたかも。"
"10014005-14-カズサ" = "まぁ、誰かさんと違って、私は冗談が通じる方だけどさ。"
"10014005-15-カズサ" = "んー……まぁ、そんな大したことじゃないんだけど……。"
"10014005-16-カズサ" = "その……先生に相談したいことがあって。"
"10014005-17-カズサ" = "でも、今まで相談とかした事なかったから、どうすればいいか分からなくて……。"
"10014005-18-カズサ" = "それで……とりあえずこうして連絡したの。"
"10014005-19-カズサ" = "……その。"
"10014005-20-カズサ" = "何かやり方がおかしかったり、先生が忙しいとかだったら……すみません。"
"10014005-21" = "[s5] \"電話してくれてありがとう。\"\n[s6] \"生徒を助けるのが私の仕事だから気にしないで。\""
"10014005-22-カズサ" = "そ、そう？"
"10014005-23-カズサ" = "そ、そう？"
"10014005-24-カズサ" = "……よかった。"
"10014005-25-カズサ" = "ありがとう先生。#nそう言ってくれて、少し安心した。"
"10014005-26-カズサ" = "でも、今まであんまり連絡してこなかったのに、こういう時だけ頼るのは……#nちょっと嫌だから……。"
"10014005-27-カズサ" = "代わりといっては何だけど、飲み物くらいは奢らせて。#nそっちの方が私も気が楽だし。"
"10014005-28-カズサ" = "……ん？"
"10014005-29-カズサ" = "ああ……相談内容？"
"10014005-30-カズサ" = "うーん……そうだね……先生も事態を把握しておいたほうがいいだろうし……。"
"10014005-31-カズサ" = "まぁ……その……簡単にいうと……。"
"10014005-32-カズサ" = "私……最近……。"
"10014005-33-カズサ" = "ストーカー……されてるみたいで。"
"10014005-34" = "#video;10014"
