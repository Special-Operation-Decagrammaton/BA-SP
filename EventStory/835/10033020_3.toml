[translation]
"10033020-1" = "第2話;Like a roller coaster"
"10033020-2-ゲヘナの生徒A" = "出発まだ～？"
"10033020-3-ゲヘナの生徒B" = "いや事前説明なっが。"
"10033020-4-ゲヘナの生徒A" = "とにかく行っちゃえば良いのにね。#nあー喉乾いた。"
"10033020-5-ゲヘナの生徒B" = "って言いながら勝手に飲まないでくれない！？"
"10033020-6-ゲヘナの生徒A" = "一口だけだから～。"
"10033020-7-ゲヘナの生徒B" = "あんた、一口って言っていつも半分以上飲むじゃん！"
"10033020-8-エリカ" = "騒がしいね、いつも通りだけど。"
"10033020-9-キララ" = "あ、グレネード弾飛んでる。"
"10033020-10-エリカ" = "対戦車榴弾まで……#nあれって、グレネードランチャーと同じ規格で使えるんだ。"
"10033020-11-キララ" = "いやー盛り上がってきたね！"
"10033020-12-エリカ" = "修学旅行、ちゃんと始まるのかな……。"
"10033020-13-キララ" = "まぁヒナっちとか風紀委員が何とかしてくれるっしょ。"
"10033020-14-エリカ" = "それにしても、百鬼夜行か……#nどんなとこなんだろうね。"
"10033020-15-キララ" = "観光で有名なんだし、まぁ良いとこなんじゃない？"
"10033020-16-エリカ" = "そうだね……何かまた演説が始まりそうだし、ひと眠りしようかな。#n落ち着いたら起こして。"
"10033020-17-キララ" = "ならあたしも一緒に寝るー！"
"10033020-18-マコト" = "キキキッ、よくぞ集まってくれたな。ゲヘナの学友ども。"
"10033020-19-マコト" = "このマコト様の尊顔を拝みに来たこと、#n殊勝だと誉めてやろうではないか！"
"10033020-20-マコト" = "見ているか、イロハ！#nこれぞ私の、栄華の象徴だ！"
"10033020-21-サツキ" = "ふぁぁ……。"
"10033020-22-イロハ" = "はいはい、良かったですね、過半数が居眠りしてますけど。#nもう半分は暴れてますけど。"
"10033020-23-チアキ" = "さっすが先輩！#n記念に一枚撮っておきましょう！"
"10033020-24-イブキ" = "イブキも！チアキ先輩、イブキも写真撮る～！"
"10033020-25-チアキ" = "うん、じゃあ撮ろっか！#nイブキちゃんは真ん中ね、マコト先輩は端っこ！"
"10033020-26-イロハ" = "チアキ、堂々と言いますね……。"
"10033020-27-チアキ" = "まぁまぁ、それでこそマコト先輩でしょ！"
"10033020-28-マコト" = "イブキが映えるなら、一向に構わん！"
"10033020-29-マコト" = "さぁ、諸君。#n修学旅行の開始に伴って、ひとつ問おう。"
"10033020-30-マコト" = "このマコト様の功績を称える準備は完璧か！？"
"10033020-31-マコト" = "この修学旅行が生まれたのも、全て[ruby=パンデモニウムソサエティー]は万魔殿…[/ruby]…#nそして[ruby=はぬま]羽沼[/ruby]マコト様がいたからこそ！"
"10033020-32-マコト" = "風紀委員会などを崇めることは無い。#n何せあやつらは所詮、百花繚乱とコソコソ面倒な会合をしているだけ！"
"10033020-33-イロハ" = "あー……これ長くなりますね……。"
"10033020-34-マコト" = "……つまるところ、このマコト様が偉大だから、というわけだ！"
"10033020-35-マコト" = "さぁ、準備は整った！"
"10033020-36-マコト" = "行くぞイロハ！#n出発の号令として、派手に鐘を鳴らすのだ！"
"10033020-37-イロハ" = "どこに鐘があるんですか……良いから行きますよ。"
"10033020-38-イロハ" = "さぁイブキ、手を。"
"10033020-39-イブキ" = "わーい、しゅっぱーつ！"
"10033020-40-エリカ" = "あ、イブキちゃん。"
"10033020-41-キララ" = "イブキちゃん、じゃあねー！行ってくるね～！"
"10033020-42-イブキ" = "え、イブキも一緒に行くんだよー！？"
"10033020-43-キララ" = "あ、そうだったんだ。ごめんね。"
"10033020-44-キララ" = "あははっ、じゃあもっともっと楽しくなりそう！"
"10033020-45-エリカ" = "バス、向こうの方だっけ？"
"10033020-46-キララ" = "多分そのはず！#nんしょっ……あー、荷物入れ過ぎたかも！"
"10033020-47-エリカ" = "少し減らしていったら？#n百鬼夜行は観光地なんだし、向こうでも色々揃ってるでしょ。"
"10033020-48-キララ" = "確かに！#n百鬼夜行全体が、きっと準備万端で待っててくれてるよね！"
"10033020-49-ウミカ" = "というわけで、修学旅行当日となってしまいました……！"
"10033020-50-ウミカ" = "今日は全力で皆さんを……#nってあれ、スケジュール表が無い！？"
"10033020-51" = "[ns] \"これじゃない？\""
"10033020-52-ウミカ" = "あ、ありがとうございます！#nあとは、他の皆さんが来れば……。"
"10033020-53" = "[s1] \"着替えに手間取ってるのかな？\"\n[s2] \"ウミカが用意してくれた衣装、楽しみだな。\""
"10033020-54-ウミカ" = "はい！#nこのお祭りのために、特別に誂えたものです！"
"10033020-55" = "[s] （……結局、修学旅行は「お祭り」なのかな）"
"10033020-56-ウミカ" = "……？#nどうかされましたか？"
"10033020-57-ウミカ" = "……わ、私は着ませんよ？#nそういうタイプでもないですし、着たくないわけではありませんが……。"
"10033020-58-ウミカ" = "いつもそういう役目は社長だったので、どうも照れてしまうと言いますか……。"
"10033020-59-ウミカ" = "と、とにかく！"
"10033020-60-ウミカ" = "採寸からデザインまでこの手で行いましたので、完璧……なはずです！#n楽しみにしててください！"
"10033020-61" = "[s] \"それはもう。\""
"10033020-62" = "おっ待たせ―！！"
"10033020-63-フィーナ" = "どうデスか、この格好！"
"10033020-64" = "[s] \"すごい、いつもと違う雰囲気で良いね！\""
"10033020-65-フィーナ" = "えへへっ！#n不肖フィーナ、今回はガイドも頑張りマス！"
"10033020-66-カエデ" = "えへへっ、どうかな？#n私、いつも以上の大人なレディーって感じじゃない！？"
"10033020-67" = "[s] \"凛々しくて大人っぽい！最高！\""
"10033020-68-カエデ" = "ふふんっ！#nこれで私も、大人なレディーにして最強のバトラーに……！"
"10033020-69-カエデ" = "……バトラーは関係ない？#nそうかな、こういうポジションってどのアニメでも強い気もするけど……。"
"10033020-70-ツバキ" = "ふあぁ……何とか、寝ないで着替えられた……。"
"10033020-71" = "[s] \"そ、それはお疲れ様……！ツバキも綺麗だね！\""
"10033020-72-ツバキ" = "夢を見るのも、夢を見せるのも、全部修行だから……。"
"10033020-73" = "[ns3] \"なるほど……とにかく、準備完了だね！\"\n[ns4] \"じゃあウミカ、よろしく！\""
"10033020-74-ウミカ" = "はい、ではあらためて説明を！"
"10033020-75-ウミカ" = "この後15時に、ゲヘナのバスが到着します！"
"10033020-76-ウミカ" = "20分ほどで下車が完了する予定ですが……これはあくまで目安！"
"10033020-77-ウミカ" = "恐らく人数からして、15時27分頃までかかると見て良いでしょう！"
"10033020-78-フィーナ" = "ではざっくり、15時30分に移動開始になりそうデスね！"
"10033020-79-ウミカ" = "そ、そうですね！#nそこからは、人力車で移動します！"
"10033020-80-ウミカ" = "えぇっと、人力車で一度に移動できる人数と、所要時間の目安は……。"
"10033020-81-カエデ" = "それなら、人力車担当に直接聞いてみるのはどう？#nあっちの方が詳しいと思うし！"
"10033020-82-ウミカ" = "な、なるほど！？#nですが、見積もりも無しでは迷惑になってしまうような……！？"
"10033020-83" = "[ns5] \"落ち着いて、みんなならできるよ。\"\n[ns6] \"ウミカを信じてくれる、みんなを信じて！\""
"10033020-84-ウミカ" = "え、えぇっと……！？#nしょ、承知しました！"
"10033020-85-ウミカ" = "では、移動の件は省略。最初に見学する場所は……あ、あれ？#nツバキ部長、以前の予定と変わっているような……！？"
"10033020-86-ツバキ" = "ふぁ……その次の場所が、受け入れ時間に間に合わなそうだったから……。"
"10033020-87-ウミカ" = "そ、そうでしたか！#nでは、スケジュールの調整と印刷を……！"
"10033020-88-ツバキ" = "印刷して、向こうにも送ったから大丈夫～……。"
"10033020-89-ウミカ" = "い、いつの間に！？"
"10033020-90-ツバキ" = "すぅ、すぅ……。"
"10033020-91-カエデ" = "ツバキ先輩は修行部の部長だもん！#nやる時はやるんだから！"
"10033020-92-フィーナ" = "ナルホド！#n能ある鷹は爪を隠す、とはこのことデスね！"
"10033020-93-ウミカ" = "あ、ありがとうございます！#nで、では次に……！"
"10033020-94-エリカ" = "ここで一旦お昼って感じ？"
"10033020-95-キララ" = "だね。あ、駅弁だ！"
"10033020-96-エリカ" = "ここってもう百鬼夜行だよね？#n味も期待できそう。"
"10033020-97-キララ" = "どれどれ～……煮物に焼き鮭、卵焼きにおにぎり。#nザ・お弁当って感じで良いね！"
"10033020-98-エリカ" = "……よく考えると、「駅」じゃないのに「駅弁」で良いのかな。"
"10033020-99-キララ" = "確かに、じゃあ「バス弁」で！"
"10033020-100-エリカ" = "……また爆発してる。"
"10033020-101-キララ" = "どうせおかずの取り合いでしょー？"
"10033020-102-エリカ" = "まあ、バスが大破しなければ良いかな。"
"10033020-103-キララ" = "とにかく食べよー！"
"10033020-104-エリカ" = "長引いてるね、やっぱこれ美味しいからかな？"
"10033020-105-キララ" = "あたしたちも参加する？"
"10033020-106-エリカ" = "んー……私はパス、髪の毛崩れちゃうし。"
"10033020-107-キララ" = "おー、対戦車ロケット飛んでる。"
"10033020-108-ウミカ" = "で、では時間も迫ってきたので、担当区域を確認しつつ解散にします！"
"10033020-109-フィーナ" = "フィーナ、今日は粉骨砕身の覚悟で参りマス！"
"10033020-110" = "[s] \"比喩に留めておいてね……？\""
"10033020-111-ウミカ" = "カエデ、よろしくお願いします！#n後で一気に人が来ると思いますが、無理せず、でもスマートに！"
"10033020-112-カエデ" = "オッケー！まっかせて！"
"10033020-113" = "[s] \"レディーとして、信じてるからね！\""
"10033020-114-ウミカ" = "ツバキ部長も、お願いしますね！#n起きててくださいね！"
"10033020-115-ツバキ" = "うん……ぐぅ……。"
"10033020-116-ウミカ" = "部長ぉ！？"
"10033020-117" = "[s] \"だ、大事な時には絶対起きてくれるから！\""
"10033020-118" = "（そうして数多の生徒が、期待と興奮を抱きながら……）"
"10033020-119" = "（一部では不安も沢山抱えてるみたいだけど……）"
"10033020-120" = "（ゲヘナ学園の、修学旅行が幕を開ける！）"
"10033020-121-エリカ" = "これが百鬼夜行かぁ……。"
"10033020-122-キララ" = "何かこう……雅だね！"
"10033020-123-エリカ" = "ざっくりだなぁ……。"
"10033020-124-キララ" = "でも分かるでしょ？"
"10033020-125-ウミカ" = "ひぃ、ひぃ、ふぅ……ひぃ、ひぃ、ふぅ……。"
"10033020-126" = "[s] \"ウミカ、大きく息を吸って。\""
"10033020-127-ウミカ" = "すぅー……はぁ……よし！"
"10033020-128-ウミカ" = "こ、こんにちは、ゲヘナ学園の皆さん！#n百鬼夜行へようこそ！"
"10033020-129-フィーナ" = "ヨウコソー！"
"10033020-130-エリカ" = "ガイドさんか、そりゃ修学旅行なんだし居るよね。"
"10033020-131-キララ" = "何あれ、可愛いー！！"
"10033020-132-ウミカ" = "か、かわ……？"
"10033020-133-フィーナ" = "イェーイ！#nありがとうございマース！"
"10033020-134-エリカ" = "ってあれ、先生じゃん！#nせーんせー！"
"10033020-135-キララ" = "まさか旅行中に会えるなんて、運命じゃん！"
"10033020-136" = "[s] \"キララ、エリカ！\""
"10033020-137-エリカ" = "もしかして、先生も一緒に回ってくれるの？#n楽しそう！"
"10033020-138-エリカ" = "久しぶりだね……#nとりあえず、握手でもしておく？"
"10033020-139" = "[s] \"こうして会えて嬉しいよ。\""
"10033020-140-キララ" = "あはっ、しばらく外にいたからかな。#n先生の手、あったかいね？"
"10033020-141-エリカ" = "お察しの通り、ひと騒ぎもふた騒ぎもあると思うけど。よろしく。"
"10033020-142-キララ" = "ま、先生なら何とかしてくれるでしょ！"
"10033020-143" = "[s] \"引率として、やれるだけのことをするよ。\""
"10033020-144-キララ" = "修学旅行が終わったら、それはそれでまた会ってくれるよね？"
"10033020-145-エリカ" = "今から終わった後の話……？"
"10033020-146-キララ" = "だってー、エリカちゃんも先生とお話したいでしょ？"
"10033020-147-エリカ" = "まぁ、それはそうだけど……。"
"10033020-148-キララ" = "じゃあ決定！#nあとで連絡先交換しよーね、先生！"
"10033020-149-ゲヘナの生徒A" = "私のバッグどこー？"
"10033020-150-ゲヘナの生徒B" = "もしかしてだけど、あたしが座ってるこれ？"
"10033020-151-ゲヘナの生徒A" = "あー！それそれ！っていうか早くお尻上げてよ。#nなんでこの期に及んで座り続けるの！？"
"10033020-152-ウミカ" = "で、では皆さん！#n今後のスケジュールについてですが――"
"10033020-153-ゲヘナの生徒B" = "だってぇ、地面は汚れるしお尻痛いし……。"
"10033020-154-ゲヘナの生徒A" = "自分のを使えば良いでしょ！"
"10033020-155-ゲヘナの生徒B" = "いーやーだー！あんたのが良いの！"
"10033020-156-ウミカ" = "え、えっと、スケジュールのお話を……"
"10033020-157-ゲヘナの生徒A" = "何言ってんの！？#n動かないなら無理やり吹っ飛ばすよ！？"
"10033020-158-ゲヘナの生徒B" = "それでも良いもん！#n世界の終わりまで持っていってやる！"
"10033020-159-ウミカ" = "（お、落ち着いて、私……ミスは許されない、ハプニングも絶対ダメ……ここは深呼吸して……！）"
"10033020-160-ウミカ" = "こ、この「百鬼夜行連合学院」は、#n観光業を中心として発達した学園自治区ですっ！"
"10033020-161-ウミカ" = "春は花見、夏は花火、紅葉や温泉など、#n季節によって異なるものを主軸としたお祭りが開かれます……！"
"10033020-162-ウミカ" = "お越しいただく方に、しっかり満足していただけるよう……。"
"10033020-163-ウミカ" = "一つの組織が束ねるのではなく、#nすべての部活と委員会がそれぞれに独立し、日々全力で取り組んでいます！"
"10033020-164-ウミカ" = "そういった成り立ちなので、一時期はパワーバランスが怪しい時期もありましたが、#n今ではにゃにゅっ……！"
"10033020-165-フィーナ" = "（！？）"
"10033020-166-キララ" = "……なんて？"
"10033020-167-エリカ" = "ガイドちゃん、頑張ってー！"
"10033020-168-フィーナ" = "ハイっ！とにかくゲヘナ学園の生徒の皆サン！"
"10033020-169-フィーナ" = "とにかく今回の修学旅行が、忘れられない思い出となりマスように！"
"10033020-170-フィーナ" = "全力で楽しんでクダサイ！#n以上デスっ！"
"10033020-171" = "[ns] \"よし、とにかく次に進めよう！\""
"10033020-172-ウミカ" = "はっ、はいっ……！"
"10033020-173-人力車の生徒" = "ではまず百鬼夜行の名物「人力車ツアー」から始めます！"
"10033020-174-人力車の生徒" = "はいはーい！早く乗っちゃってください！#n風のように速く、でも安全にご案内しますよー！"
"10033020-175-キララ" = "へえ、これが人力車……。"
"10033020-176-キララ" = "面白そー！私こっち側！"
"10033020-177-人力車の生徒" = "落ちないように気をつけてくださいねー！#nでは、出発～！"
"10033020-178-ウミカ" = "か、カバーありがとうございます、フィーナ……#nいっぱいいっぱいになってしまい……。"
"10033020-179-フィーナ" = "イエイエ、こういう時はお互い様デス！"
"10033020-180" = "[s] \"そうだね。肩の力、少しずつ抜いていこう。\""
"10033020-181-フィーナ" = "それにワタシにとっても、初の音頭で楽しかったデス！"
"10033020-182" = "[ns] \"うん。じゃあ私たちも行こうか？\""
"10033020-183-フィーナ" = "おっと、その目はこちらに乗りたいと見えた！"
"10033020-184-フィーナ" = "イエス！3人お願いしマス！"
"10033020-185-人力車の生徒" = "合点招致！それでは、おとなしく乗っててくださいねー……#n張り切って行きましょう！"
