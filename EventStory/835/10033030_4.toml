[translation]
"10033030-1" = "第3話;この出会いはどこまでも"
"10033030-2-ウミカ" = "じ、人力車はいかがでしたでしょうか？"
"10033030-3-ウミカ" = "次はこちらの、展望台へと登っていきます！"
"10033030-4-キララ" = "すごい、きれーい！"
"10033030-5-エリカ" = "当たり前だけど、ゲヘナと全然違うね。"
"10033030-6-キララ" = "ねぇねぇ、写真撮ろ！エリカちゃんも！"
"10033030-7-エリカ" = "うん、そうだね。"
"10033030-8-キララ" = "あ、せっかくだし……そこのガイドちゃんたちー！"
"10033030-9-ウミカ" = "わ、私たちもですかぁ！？"
"10033030-10-エリカ" = "写真はみんなで撮った方が楽しいでしょー？#nあ、今更だけどあたしキララ、[ruby=よざくら]夜桜[/ruby]キララ！"
"10033030-11-エリカ" = "[ruby=はたみ]旗見[/ruby]エリカだよ。"
"10033030-12-ウミカ" = "共に肩を並べることで、義理と友情を形にする……#nこれもまた任侠……！"
"10033030-13-フィーナ" = "ご挨拶が遅れました、[ruby=あさひな]朝比奈[/ruby]フィーナと申しマス！#nお会いできて嬉しいデス！"
"10033030-14-ウミカ" = "お、お祭り運営委員会の、[ruby=さとはま]里浜[/ruby]ウミカです……！#n至らないことばかりですが、よろしくお願いしますっ！"
"10033030-15-カエデ" = "私は[ruby=いさみ]勇美[/ruby]カエデ！#n素敵で完璧なレディーになるために修行中の身なの！"
"10033030-16-キララ" = "へぇー！#nでもカエデちゃん、もう立派なレディーだと思うけどな？"
"10033030-17-カエデ" = "えっ、そ、そうかな！？#nそれは嬉しいかも……！"
"10033030-18-カエデ" = "で、でもでも！#nまだ成長途中だから、今よりもーっとカッコよくて完璧なレディーになるから！"
"10033030-19-ツバキ" = "[ruby=かすが]春日[/ruby]ツバキ……ふぁ。#n今晩眠れなかったら、私に言ってね……布団から耳栓まで、準備できてるから……。"
"10033030-20-エリカ" = "そ、そっか……#nまあ修学旅行だし、「まだ寝たくない」って人の方が多そうだけど……。"
"10033030-21-ツバキ" = "ほらほらツバキ先輩、ちゃんと立って！"
"10033030-22-ツバキ" = "んぅ……。"
"10033030-23" = "じゃあ行っくよー！"
"10033030-24" = "ほらウミカ、笑ってクダサイ！"
"10033030-25" = "えっ、えぇっ……！？"
"10033030-26" = "はい、チーズ！"
"10033030-27" = "――！"
"10033030-28-キララ" = "うん、バッチリ！#n後で写真送るね、あ、今のうちに連絡先交換しよっか？"
"10033030-29-エリカ" = "……ごめんね。#nキララちゃん、いつもこういう距離感だから。困ったら言って。"
"10033030-30-ウミカ" = "皆さん、お疲れ様でした……！"
"10033030-31-ウミカ" = "この展望台から見えるご神木。#nあれは百鬼夜行連合学院の象徴であり誇りなのです！"
"10033030-32-ウミカ" = "ナント！#nその神木を祀るお祭りが、ちょうど明日開かれるのです！"
"10033030-33-ウミカ" = "みんなが来るタイミングとぴったり合うなんて、すっごいねー！"
"10033030-34-ツバキ" = "神木祭……何とか起きてないと……。"
"10033030-35-ウミカ" = "（このために神木祭の日程を調整してくださった皆さん、ありがとうございます……！）"
"10033030-36-キララ" = "あはっ、その調子だとみんなも楽しみにしてるお祭りなんだね？"
"10033030-37-エリカ" = "さっきの説明だと、#nお祭りを元にして生まれた学園地区、みたいな感じだったしね。"
"10033030-38" = "[s] \"確かに、しょっちゅうお祭りだらけだし。\""
"10033030-39-ウミカ" = "やはり、お祭りは良いものですから。"
"10033030-40-ウミカ" = "日常から離れ、一つの目的のために皆が集う……。"
"10033030-41-ウミカ" = "非日常の中で、笑い、喜び、思いもよらない体験を得る日……！"
"10033030-42-ウミカ" = "百鬼夜行だけではありません、この感覚はキヴォトス全体にあるもの……#nだからこそ、各地でまだ見たこともないお祭りが無限にあるんです！"
"10033030-43-ウミカ" = "皆さんが通うゲヘナ学園にもありますよね！#n11日の11時11分から始まるバラのお祭りや、みんなでトマトを投げ合うお祭りなどなど……！"
"10033030-44-エリカ" = "そ、そんなお祭りあったっけ……？"
"10033030-45-エリカ" = "さぁ……私たちと違って、普通の部活の人なら知ってるんじゃない？"
"10033030-46-キララ" = "それにしても、ウミカちゃんは本当にお祭りが好きなんだね！#nすっごく楽しそうに喋ってたし！"
"10033030-47-ウミカ" = "すっ、すみません！#nつい早口に……！"
"10033030-48" = "[s] \"良いんじゃないかな、本当に好きだってことが伝わってきて。\""
"10033030-49-ウミカ" = "先生までぇ……！？"
"10033030-50-エリカ" = "それにしても神木祭かぁ、どういうお祭りになるんだろうね？"
"10033030-51-エリカ" = "そこでまた問題が起きなきゃ良いけど……。"
"10033030-52-ゲヘナの生徒A" = "うわっ、なにこれ！？#nこの部分だけ地面がツルツルしてる！"
"10033030-53-ゲヘナの生徒B" = "急に転んだと思ったら……大丈夫？"
"10033030-54-ウミカ" = "も、申し訳ありません……！#nお怪我は……！？"
"10033030-55-フィーナ" = "この部分、何か変デスね……#n何かで磨かれているような？"
"10033030-56-カエデ" = "変なの、本当にこの部分だけだね？"
"10033030-57-ツバキ" = "……ご神木が、一番よく見える場所……。"
"10033030-58-ゲヘナの生徒D" = "えっ、何それ楽しそう！#n私も滑りたい！"
"10033030-59-ゲヘナの生徒D" = "ちょっと横入りしないで！#n撃つよ！？"
"10033030-60-ウミカ" = "み、皆さん！？#nあの、これからご神木のお話を……。"
"10033030-61-ゲヘナの生徒D" = "ゲヘナにルールなんか無用でしょ！"
"10033030-62-ゲヘナの生徒D" = "いやここゲヘナじゃないけど！？"
"10033030-63-ウミカ" = "え、えぇっと、#nご神木の起原については諸説あるものの、一番有力なものとしては……"
"10033030-64-キララ" = "……これ、止めた方が良い？"
"10033030-65-キララ" = "んー、誰かが地雷とか撒き始めたら動こっか？"
"10033030-66-ゲヘナの生徒E" = "ああもう、争ってる場合じゃないでしょ？#nこういう時は――"
"10033030-67-キララ" = "あ、何とかなりそう。"
"10033030-68-ゲヘナの生徒E" = "一か所じゃなくて、全面滑り台にしちゃえば良いの！"
"10033030-69-ゲヘナの生徒E" = "「「「「それだ！！！」」」」"
"10033030-70" = "[ns] \"それかなぁ！？\""
"10033030-71-ゲヘナの生徒E" = "うわめっちゃ滑る！"
"10033030-72-ゲヘナの生徒B" = "私も私もー！"
"10033030-73-ゲヘナの生徒B" = "とにかく床を磨け！何使っても良いから！"
"10033030-74-ウミカ" = "み、皆さん！？#nその、えぇっとぉ……！？"
"10033030-75-ゲヘナの生徒C" = "爆弾の勢いで滑ったら、もっと楽しくない？"
"10033030-76-ゲヘナの生徒D" = "確かに、どこまで進むか競争しよう！"
"10033030-77-ゲヘナの生徒A" = "それ、落ちたらどうするの？"
"10033030-78-ゲヘナの生徒B" = "まぁ何とかなるでしょ！"
"10033030-79-ウミカ" = "ダメですってばぁ！"
"10033030-80-エリカ" = "ウミカちゃん、苦労人だねぇ？"
"10033030-81-エリカ" = "……止めよっか。"
"10033030-82-キララ" = "あははっ、流石にそうだね！"
"10033030-83-カエデ" = "な、何とか落ち着いたみたい……？"
"10033030-84-フィーナ" = "デハ不肖フィーナ、皆さんを次の場所へご案内しマス！"
"10033030-85-ツバキ" = "ふぁ……動いたら疲れた……眠い……。"
"10033030-86" = "[ns] \"みんな、お疲れ様……。\""
"10033030-87-ウミカ" = "はぁ、はぁ……ゲヘナの皆さん、元気ですね……。"
"10033030-88-ウミカ" = "お二方も、助けていただいてすみません……。"
"10033030-89-エリカ" = "あははっ、大したことじゃないって！"
"10033030-90-エリカ" = "まあ、私たちにとってはいつものことだし。"
"10033030-91" = "[s] \"二人とも、本当にありがとね。\""
"10033030-92-キララ" = "嬉しいけど、これくらいでお礼してたらキリがないと思うよ？"
"10033030-93-エリカ" = "まあ、下手したらあと100回くらい起きるだろうね。#n今日だけでも。"
"10033030-94" = "[s] \"そうだよねぇ……。\""
"10033030-95-キララ" = "ま、とにかく次のとこに行こっか。#n先生もウミカちゃんも、落ち着いたらゆっくり来てね～！"
"10033030-96-エリカ" = "じゃあ、また後で。#nこういうことが積み重ならないことを祈るね。"
"10033030-97-ウミカ" = "うぅ、スケジュールに12分も遅れが……#n何とかしないと……！"
"10033030-98" = "[s1] \"まだ何とかなるはず……。\"\n[s2] \"もともと余裕を持ったスケジュールだったし……。\""
"10033030-99-ウミカ" = "ですが、始まったばかりなのにこれでは……。"
"10033030-100-ウミカ" = "こういう時、一体どうすれば……。"
"10033030-101" = "[s] \"ウミカ、大事なことを教えるね。\""
"10033030-102-ウミカ" = "は、はいっ……。"
"10033030-103" = "[s] \"……無駄かもしれない努力が、必要な時もある。\""
"10033030-104-ウミカ" = "先生ぇ！？"
