[translation]
"10033110-1" = "エピローグ;思い出はいつだって輝いて"
"10033110-2-ニヤ" = "ゲヘナの皆さんが来る以上、ある程度の混乱は予想済みでしたが……#n箱を開けたらまあ予想以上。"
"10033110-3-ニヤ" = "でもさすがはお祭り運営委員会のウミカさん、そして先生。#n感謝ですわあ。"
"10033110-4-ニヤ" = "今回も面白……ではなく、素晴らしかったねぇ。"
"10033110-5" = "[s] \"ニヤも結構、いろいろ心配だったんじゃない？\""
"10033110-6-ニヤ" = "……と言うんは、どういう？"
"10033110-7" = "[s1] \"色々と、都合の良い部分があったし？\"\n[s2] \"風紀委員会との会合の場所とか、気を遣ってるなって。\""
"10033110-8-ニヤ" = "あは～、それは偶然の一致じゃないです？"
"10033110-9-ニヤ" = "私はただ、こうした方が面白いんやないかな～って弄っただけよ。"
"10033110-10-ニヤ" = "その結果、誰かにとって意味が生まれたんなら……#nそれはそれで僥倖。"
"10033110-11-ニヤ" = "ただそれだけのことじゃないです？"
"10033110-12" = "[s] \"……うん、じゃあそういうことで。\""
"10033110-13-ニヤ" = "そういう事にしてくださると嬉しいですわぁ♪"
"10033110-14-アラタ" = "うぅ、どうしてこんな目に……。"
"10033110-15-アラタ" = "まぁちょっとだけ、ちょっとだけやり過ぎたけどさぁ！"
"10033110-16-魑魅一座B" = "そうだそうだ！#nちゃんと鎮火作業だって頑張ったのに！"
"10033110-17-魑魅一座B" = "神木祭も無事に終わったのに！"
"10033110-18-ニヤ" = "それとこれとは別だと思いませんか、魑魅一座の皆さん？"
"10033110-19-ニヤ" = "参ったなぁ。#n不満の声なんて聞いた日には、掃除のエリアを倍にするかもしれませんねぇ～？"
"10033110-20-アラタ" = "！？"
"10033110-21-魑魅一座B" = "いやいやいや！#n見てくださいよ、一生懸命掃除中じゃないですか！"
"10033110-22-魑魅一座B" = "そうですよ！お掃除最高ー！#n百鬼夜行が綺麗になって嬉しいなあ！"
"10033110-23-カホ" = "それはそれは。"
"10033110-24-ニヤ" = "じゃあ後はよしなに。"
"10033110-25-アラタ" = "……もう行った？"
"10033110-26-アラタ" = "……ああもう悔しいっ！#nくそっ、くそぉっ！見てろよ、次こそはあたしたちの手で……！"
"10033110-27-魑魅一座B" = "あ、天狗のお面行列！#nもう始まってる！"
"10033110-28-魑魅一座B" = "山伏もいる！#n私あれ好きー！"
"10033110-29-魑魅一座" = "お前たち、ちゃんと掃除しろ！#n後で見られたら本当に怒られるぞ！？"
"10033110-30-魑魅一座A" = "ちょっと待っててリーダー！#nこれだけ見てから！"
"10033110-31-魑魅一座A" = "相撲だ相撲だーっ！#nやれーっ！"
"10033110-32-アラタ" = "だ～か～ら～～っ！"
"10033110-33-ヒナ" = "……まさか先生が来てるなんて、知らなかった。"
"10033110-34" = "[s] \"ちょっとした成り行きでね……。\""
"10033110-35-ヒナ" = "何にせよお疲れ様。#nでも先に言ってくれれば、私も……"
"10033110-36" = "[s] \"？\""
"10033110-37-ヒナ" = "……何でもない。#nただ……。"
"10033110-38-ヒナ" = "こうして、最後に少しでも会えて良かった。"
"10033110-39" = "[s] \"そうだね、私もヒナに会えて嬉しいよ。\""
"10033110-40-ヒナ" = "そ、そう……？"
"10033110-41-アコ" = "ちょっと待ってください。#n私がここにいることを忘れていませんか！？"
"10033110-42-アコ" = "ただでさえ百花繚乱との会合の間、#n延々と続く万魔殿の妨害を上手く処理してきたというのに！"
"10033110-43-アコ" = "あのタヌキたち……#n修学旅行なのですから、おとなしく旅行を楽しめば良いものを……#n直接邪魔するわ嫌味なメッセージを送ってくるわ、一体何なのですか！？"
"10033110-44-アコ" = "そもそもの話、#nなぜ百鬼夜行側との会合に出るのが私たちになるんですか！"
"10033110-45-アコ" = "普通に考えたら万魔殿が出るべきでしょう！#nどう考えても仕事を押し付けただけじゃないですか、中身だって結局――"
"10033110-46-アコ" = "……。"
"10033110-47-ヒナ" = "まあ、起きたことはもう仕方がない。#nせっかくだし、あとはお祭りを楽しんだら？"
"10033110-48-ヒナ" = "い、委員長……！？"
"10033110-49" = "[ns3] \"じゃあ、私が百鬼夜行を案内してあげる。\"\n[ns4] \"この数日間、みっちり教えてもらったから。\""
"10033110-50-ヒナ" = "せっ、先生が、直接……！？"
"10033110-51-アコ" = "……じゃあ、よろしく。"
"10033110-52-ヒナ" = "ふ、ふんっ！#n委員長に免じて、今回だけは大目に見てあげても良いですよ？"
"10033110-53" = "[s] \"なら、そういうことで。\""
"10033110-54-ウミカ" = "それでは皆さん、またのお越しをお待ちしています！"
"10033110-55-フィーナ" = "出会いには別れが付き物……。"
"10033110-56-フィーナ" = "デスが、悲しむことはありマセン！#nいつかきっと、また会えるはずデスから！"
"10033110-57-カエデ" = "バイバーイ！#n今度はムシクイーンバトル一緒にしようねー！"
"10033110-58-ツバキ" = "……あ、もうこんな時間。#nじゃあ、またね……。"
"10033110-59-エリカ" = "おかげで、本当に楽しかった。#nありがとね。"
"10033110-60-キララ" = "ウミカちゃん、フィーナちゃん、カエデちゃん、ツバキちゃん！#n先生も、元気でね！"
"10033110-61-エリカ" = "まぁ先生は多分、またどこかですぐ会うでしょ。"
"10033110-62-キララ" = "まっ、そうかもね！"
"10033110-63-キララ" = "あっ、ゲヘナに来たら連絡してね、すぐ迎えに行くから！#nばいばーい、チュっ！"
"10033110-64" = "[ns] \"それじゃあ、また！\""
"10033110-65" = "（かくして今回の修学旅行は、無事に終わりを迎えた）"
"10033110-66" = "（新しい出会い、新しい絆、新しい思い出……）"
"10033110-67-マコト" = "キシシ……#nマコト様の威光は、今や百鬼夜行にまで届き……むにゃむにゃ……。"
"10033110-68" = "（そして新しい夢（？）を抱えながら……）"
"10033110-69-フィーナ" = "というわけで、打ち上げデース！"
"10033110-70-フィーナ" = "乾杯！"
"10033110-71-ツバキ" = "乾杯……。"
"10033110-72-ウミカ" = "ウミカちゃん、話は聞きました。#n大変でしたね。"
"10033110-73-ウミカ" = "い、いえ、そんな……！"
"10033110-74-ウミカ" = "カエデちゃんもツバキちゃんも、お疲れ様でした。"
"10033110-75-カエデ" = "えへへっ……！"
"10033110-76-カエデ" = "これでまた、素敵なレディーに一歩近づけたかも！"
"10033110-77-カエデ" = "もう聞いたと思うけど、ウミカ本当にすごかったんだよ！"
"10033110-78-フィーナ" = "ワタシも胸が熱くなりマシタ！#n燃え盛る炎を背に、カッコよく宣言する姿……！"
"10033110-79-ウミカ" = "あ、あれはあくまで、エリカさんやキララさんが……。"
"10033110-80-ウミカ" = "それから、先生がいてくださったおかげで……。"
"10033110-81-ツバキ" = "でも……#n全部の流れを変えたのは、確かにウミカだったよ……。"
"10033110-82-ウミカ" = "そ、そんなことは……！#nそもそも皆さんがいなかったら、私は……！"
"10033110-83-？？？" = "何言ってるの！#nこういう時は、素直に褒められておきなさいって！"
"10033110-84-フィーナ" = "ハッ！"
"10033110-85-ウミカ" = "こ、この声は……！？"
"10033110-86-ユカリ" = "お祭り運営委員会の委員長殿！"
"10033110-87-シズコ" = "話はぜーんぶ聞かせてもらったわ！"
"10033110-88-シズコ" = "よく頑張ったわね。#nウミカだから、今回の修学旅行が成功したのよ。"
"10033110-89-ウミカ" = "……。"
"10033110-90-ウミカ" = "私、だから……？"
"10033110-91" = "[s] \"素直に受け取ったら？\""
"10033110-92-ウミカ" = "そうよ。私も先生も、他のみんなもそう言ってるじゃない！#nもっと自信を持って！"
"10033110-93-シズコ" = "胸を張りなさい、私がやり遂げたんだって。#nこの先どんな依頼が来たって、全部を最高のお祭りにしてやるんだって！"
"10033110-94-ウミカ" = "……まだ、実感がありません。#nですが……。"
"10033110-95-ウミカ" = "「全部を最高のお祭りに」……その言葉は、すごく響きました！"
"10033110-96-シズコ" = "え゛、そこ！？"
"10033110-97-ウミカ" = "今回の修学旅行も、#n最終的には素晴らしいお祭りになりましたし……。"
"10033110-98" = "[ns] （……本当に、お祭りだったのかもしれないな）"
"10033110-99-ウミカ" = "さて、次は何をしましょうか！"
"10033110-100-フィーナ" = "モチロン、次のお祭りの準備デス！#nワタシたちは、お祭り運営委員会デスから！"
"10033110-101-ウミカ" = "では次の商店街祭りについてですが、舞踊グループを結成しましょう！#nそれから笛と三味線と太鼓の[ruby=こと]箏[/ruby]のグループも集った上で――"
"10033110-102-シズコ" = "ちょ、ちょっと待って！今から！？#nいくらなんでも早すぎ――"
"10033110-103-カエデ" = "なになに？#n楽しそう、私も混ぜてー！"
"10033110-104-ツバキ" = "お昼寝は、後でにしようかな……。"
"10033110-105-ウミカ" = "その、先生。"
"10033110-106" = "[ns] \"どうしたの？\""
"10033110-107-ウミカ" = "こんな言葉だけで足りないことは、承知の上ですが……。"
"10033110-108-ウミカ" = "本当にありがとうございました。"
"10033110-109" = "[s5] \"私も、これだけじゃ足りないと思うけど。”\n[s6] \"何よりもまず、おめでとう。\""
"10033110-110-ウミカ" = "……？"
"10033110-111-ウミカ" = "あ、お祭りを無事終えられたから、ということでしょうか……？"
"10033110-112-ウミカ" = "えへへ……ありがとうございます。"
"10033110-113-ウミカ" = "……。"
"10033110-114-ウミカ" = "先生。"
"10033110-115-ウミカ" = "百鬼夜行に来たら、いつでも私たちの元を訪ねてください。"
"10033110-116-ウミカ" = "その時は必ずや……#n今回よりもっと素敵な、最高のお祭りをお見せしますから！"
"10033110-117" = "にぎにぎとゆきゆきて"
