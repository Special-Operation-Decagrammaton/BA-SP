[translation]
"10033100-1" = "第10話;それでもできること"
"10033100-2-ウミカ" = "ダメぇぇっ！！！"
"10033100-3-カエデ" = "花火上がっちゃった！？"
"10033100-4-ツバキ" = "……とりあえず、火を止めよう。"
"10033100-5-フィーナ" = "水……！#nイエ、消火器は……！？"
"10033100-6-ウミカ" = "早く止めないと神木祭が……チセ様が……！"
"10033100-7-チセ" = "真昼に花火……舞台を囲むみたいに……。"
"10033100-8-チセ" = "……きれい。"
"10033100-9" = "[ns1] \"熱っ……！\"\n[ns2] \"花火、いつまで打ち上がり続けるの！？\""
"10033100-10-ウミカ" = "これでは近づけません……！"
"10033100-11-カエデ" = "これは、周りの建物も危ないのデハ……！？"
"10033100-12-カエデ" = "ああもーどうしよー！？"
"10033100-13-ウミカ" = "こ、これじゃあ……。"
"10033100-14-アラタ" = "リーダーどうします！？"
"10033100-15-魑魅一座A" = "花火、計画通りに打ち上がりましたけど……#nせ、成功ですかね！？"
"10033100-16-アラタ" = "……違う。"
"10033100-17-アラタ" = "こんな……こんなのを望んだわけじゃ……。"
"10033100-18-魑魅一座A" = "リーダー危ない！"
"10033100-19-魑魅一座B" = "熱っ！？"
"10033100-20-ウミカ" = "（私のせいで……私が、勝手に花火を運んだから……）"
"10033100-21-ウミカ" = "（違う、そもそも……）"
"10033100-22-ウミカ" = "（スケジュールが、遅れなければ……昨日、ちゃんとガイドができてたら……）"
"10033100-23-ウミカ" = "（遅れを巻き返そうなんて思う事態に、ならなかったら……）"
"10033100-24-ウミカ" = "（我ながら名案、なんて……調子に乗って、早い時間から花火を勝手に動かして……）"
"10033100-25-ウミカ" = "（……）"
"10033100-26-ウミカ" = "（……私は、バカだ）"
"10033100-27-ウミカ" = "（社長だったら、こんなことにはならなかった……）"
"10033100-28-ウミカ" = "（私じゃなくて、社長だったら……）"
"10033100-29-ウミカ" = "（私が全部台無しにした……百鬼夜行のお祭りも、ゲヘナのみんなの思い出も……）"
"10033100-30-ウミカ" = "ぐすっ……うっ、うぅっ……。"
"10033100-31" = "[ns] （ウミカの元へ近づく）"
"10033100-32" = "[ns] （手を差し伸べる）"
"10033100-33-ウミカ" = "せん、せい……？"
"10033100-34" = "[s] \"顔を上げて、ウミカ。\""
"10033100-35-ウミカ" = "私のせいで、全部ダメになってしまいました……。"
"10033100-36-ウミカ" = "予定通り、全部上手くやるどころか、"
"10033100-37-ウミカ" = "余計なことをして、全部台無しに……。"
"10033100-38-ウミカ" = "すみません……そもそも、何もするべきじゃなかったんです。#n私なんかが、思い上がって、勝手に動いて、全部壊して……。"
"10033100-39-ウミカ" = "ごめんなさい……#n私の、私のせいで、こんな……。"
"10033100-40" = "[s3] \"泣かないで、ウミカ。\"\n[s4] \"それでもウミカの頑張りは消えてない。\""
"10033100-41-ウミカ" = "でも、それじゃダメなんです！#n頑張っても、考えても、走り回っても、#nそれでも、ゲヘナの皆さんの思い出を汚してしまった事実は……！"
"10033100-42" = "[s] \"見て、みんなの顔を。\""
"10033100-43-ウミカ" = "……？"
"10033100-44-ゲヘナの生徒" = "何か雰囲気変わってきたね？"
"10033100-45-ゲヘナの生徒B" = "まぁこれもお祭りの一環でしょ、すごい光景だし。"
"10033100-46-ゲヘナの生徒B" = "爆発したり燃え盛ったりヤバいね。#n百鬼夜行、あたしらよりカオスじゃん。"
"10033100-47-ゲヘナの生徒" = "確かに……#nてかそう言われると、負けてらんなくない？"
"10033100-48-ゲヘナの生徒B" = "ね、グレネードランチャーある？"
"10033100-49-ゲヘナの生徒B" = "あるけど、何に使うの？"
"10033100-50-ゲヘナの生徒A" = "遅延信管を使えば、綺麗に打ち上がりそうじゃない？"
"10033100-51-ゲヘナの生徒B" = "あ、花火の代わり的な？"
"10033100-52-ゲヘナの生徒A" = "そうそう！"
"10033100-53-ゲヘナの生徒B" = "良いじゃん、やるなら派手にやろっか。"
"10033100-54-アラタ" = "ど、どうしよう、こんな、これじゃ……。"
"10033100-55-魑魅一座B" = "リーダー！しっかりしてください！"
"10033100-56-魑魅一座A" = "そうですよ、リーダーがブレたら魑魅一座は終わりですって！"
"10033100-57-アラタ" = "……っ！"
"10033100-58-チセ" = "視界が全部、花で燃えて……。"
"10033100-59-チセ" = "何だか、夢みたい。"
"10033100-60-ウミカ" = "……？"
"10033100-61-ウミカ" = "どうして、みんな……そんな顔で……。"
"10033100-62" = "[ns] \"それはそうだよ、私が言うまでもないけど。\""
"10033100-63-ウミカ" = "……？"
"10033100-64" = "[ns] \"……ここは百鬼夜行で、彼女たちはゲヘナだもの。\""
"10033100-65-ウミカ" = "…………！"
"10033100-66-ウミカ" = "ど、どういう反応をすれば良いのか、迷ってしまいますが……。"
"10033100-67-ウミカ" = "それでも、私の失敗はやはり……！"
"10033100-68" = "[s5] \"まだ終わってないよ。\"\n[s6] \"それにウミカは一人じゃない。\""
"10033100-69-フィーナ" = "ウミカ！#n大丈夫デスか！？"
"10033100-70-ウミカ" = "フィーナ……。"
"10033100-71-カエデ" = "何かすごいことになってきたけど、こういう時こそ力を合わせないと！"
"10033100-72-ウミカ" = "力を……。"
"10033100-73-カエデ" = "うん！#n百鬼夜行のみんなと……それに、ゲヘナのみんなとも！"
"10033100-74-ウミカ" = "で、でも、これは全部私のミスで、他の人に背負わせるのは……。"
"10033100-75-ツバキ" = "そんなこと、無いんじゃないかな。"
"10033100-76-ウミカ" = "ツバキ先輩……？"
"10033100-77" = "[ns7] \"助けを求めることと、責任を負わせることは一緒じゃない。\"\n[ns8] \"誰だって、支え合って生きてるから。\""
"10033100-78-ウミカ" = "……社長なら、こんな時――"
"10033100-79-フィーナ" = "委員長も同じデス！"
"10033100-80-ウミカ" = "はい……？"
"10033100-81" = "[ns9] \"シズコだって、頑張り屋だけど完璧じゃない。\"\n[ns10] \"むしろ頼るのが上手だから、社長なんじゃないかな。\""
"10033100-82-ウミカ" = "……。"
"10033100-83-？？？" = "先生ー！#nウミカちゃーん！"
"10033100-84-ウミカ" = "皆さん……！"
"10033100-85-キララ" = "悪い予感がして来てみたけど……。"
"10033100-86-キララ" = "あははっ、どう見てもヤバそうだね！"
"10033100-87" = "[s] \"どうにか鎮火したいんだけど、助けてもらえる？\""
"10033100-88-エリカ" = "やっぱりか……#nみんなは「これもお祭りだよ」って盛り上がってたけど。"
"10033100-89-キララ" = "んー……多分これ、人手が要るよね？"
"10033100-90-エリカ" = "ゲヘナも全員動かないと……#nでも、この状況でどうする？"
"10033100-91-キララ" = "だーいじょーぶ！#n方法ならあるよ！"
"10033100-92-ウミカ" = "ほ、本当ですか！？"
"10033100-93-キララ" = "だって、ここにいるじゃん！#nこの修学旅行をまとめてきてくれた「ガイドさん」たちがさ！"
"10033100-94-ウミカ" = "が、ガイド……。"
"10033100-95" = "[ns] \"さあ、最後まで引っ張ってあげて。\""
"10033100-96-ウミカ" = "……最後まで、私が。"
"10033100-97-ウミカ" = "……先生、皆さん。"
"10033100-98-ウミカ" = "最後まで、成し遂げたいと思います。"
"10033100-99-ウミカ" = "そのために……#nもう少しだけ、手伝っていただけないでしょうか？"
"10033100-100-ウミカ" = "もちろん！"
"10033100-101-ウミカ" = "皆さーん！#nこのお祭りを楽しんでいただいている、百鬼夜行とゲヘナ学園の皆さーん！"
"10033100-102-ウミカ" = "次の流れを、案内しまーす！！"
"10033100-103-ウミカ" = "炎に包まれた広場と巫女！"
"10033100-104-ウミカ" = "この窮地を救えるのは、ここにいる皆さんです！"
"10033100-105-ウミカ" = "ご神木は既に、幸運を分けてくださっています！"
"10033100-106-ウミカ" = "あとは、皆さんの力があれば！！"
"10033100-107-ゲヘナの生徒" = "え、えぇ……？"
"10033100-108-キララ" = "エリカちゃん、行こっか？"
"10033100-109-エリカ" = "うん、何とかしないとね。"
"10033100-110-キララ" = "じゃあ行ってくるね！#n先生、ウミカちゃん！"
"10033100-111-ウミカ" = "はい、お願いします！"
"10033100-112-キララ" = "みんなー！#n今の聞いてたー！？"
"10033100-113-ゲヘナの生徒" = "あー、このお祭りでしょ？#n力を貸してって言われても、何をすれば……。"
"10033100-114-エリカ" = "簡単だよ、火を消して巫女さんを助けるだけ。"
"10033100-115-ゲヘナの生徒" = "まあそれもそっか。#n一応確認するんだけど、この流れも全部織り込み済みなんだよね？"
"10033100-116-キララ" = "そうそう！#nでも火は本物みたいだし、早く動いちゃお！"
"10033100-117-エリカ" = "向こうでも始まったみたいだね。"
"10033100-118-フィーナ" = "カエデ、こちらデス！"
"10033100-119-カエデ" = "もっと水ちょーだい！#nバケツでも消火器でも良いから！"
"10033100-120-ツバキ" = "慎重に、でも急いでねー……#n順番に、ひとつずつ～。"
"10033100-121-ゲヘナの生徒" = "よーっし、じゃあ行こう！"
"10033100-122-エリカ" = "何なら先に終わらせちゃおうか？"
"10033100-123-ゲヘナの生徒" = "な、なるほど……そうと分かれば話は早い！"
"10033100-124-ゲヘナの生徒" = "私たちも混ぜろーー！！"
"10033100-125-ウミカ" = "魑魅一座の皆さん、何で動かないんですか！"
"10033100-126-アラタ" = "え、えぇ、あたし……？"
"10033100-127-ウミカ" = "当然です、やるからには全力で！#nお祭りが滅茶苦茶になるのは、そちらも望んでないでしょう！？"
"10033100-128-ウミカ" = "……！"
"10033100-129-アラタ" = "……うん、それはそうだ。"
"10033100-130-アラタ" = "あたしたちが始めたことだし……目的は、このお祭りを守ること。"
"10033100-131-アラタ" = "……魑魅一座、集合！"
"10033100-132-魑魅一座B" = "は、はいっ！#nリーダー、一体何をすれば！？"
"10033100-133-魑魅一座B" = "こ、このままじゃ私たちのご神木が……お祭りが……！"
"10033100-134-アラタ" = "そのご神木を、あたしたちが守るんだ！"
"10033100-135-アラタ" = "それがあたしたちのお祭りを、百鬼夜行を守ることにつながる！"
"10033100-136-魑魅一座A" = "了解！"
"10033100-137-魑魅一座B" = "私たちのお祭りなんだから、私たちの手で！"
"10033100-138-イオリ" = "はぁ、はぁ……#n何か、もう大体解決した感じ……？"
"10033100-139-チナツ" = "だいぶ鎮火できているようですね、お疲れ様でした。"
"10033100-140" = "[s] \"風紀委員のみんな……！あれ、会合は？\""
"10033100-141-チナツ" = "その会合が、すぐ向こうで開かれてまして。"
"10033100-142-イオリ" = "あの陰陽部のニヤって人が、急に休憩とか言い出して……#nふと外に出たら、火の手が上がってたからさ。"
"10033100-143-イオリ" = "ああもう、何をしたらこうなるんだよ……。"
"10033100-144-チナツ" = "今からでも、できることはありそうですね。#n手伝いましょう。"
"10033100-145-ユカリ" = "学園と学園……#n委員会や部活の垣根を超えて、一丸となって危機に対処する……。"
"10033100-146-ユカリ" = "なんて美しく、胸がいっぱいになる光景なのでしょう……！#n身共は感激いたしました！"
"10033100-147-レンゲ" = "アタシらもじっとしていられないな、キキョウ？"
"10033100-148-レンゲ" = "うん。百花繚乱、行こう。"
"10033100-149" = "[ns] \"もしかして、ニヤは最初から……。\""
"10033100-150-ウミカ" = "それでは改めて、神木祭の巫女のご紹介へ移ります！"
"10033100-151-ウミカ" = "皆さんのご参加によって、再び儀式は再開されます。#n舞台に上がった巫女は、この後――"
"10033100-152-キララ" = "百鬼夜行のお祭り、本当に観客が参加するんだね。"
"10033100-153-キララ" = "あははっ、ビックリだね！#nでも貴重な体験になったかも！"
"10033100-154-ゲヘナの生徒" = "だね、すんごいリアルだったり。#n巫女の人、燃えちゃうかと思った。"
"10033100-155-エリカ" = "まあ、それはそうだね……。"
"10033100-156-キララ" = "伊達に「観光で有名な学校」って呼ばれてないね。"
"10033100-157-キララ" = "うん、もうちょっと長くいたかったなー。"
"10033100-158-エリカ" = "そしたら今度は、どんな事件が起きるやら……。"
"10033100-159-ゲヘナの生徒" = "事件？"
"10033100-160-エリカ" = "ううん、何でもない。#nね、キララちゃん。"
"10033100-161-キララ" = "どうしたの？"
"10033100-162-エリカ" = "良かったね。"
"10033100-163-キララ" = "んー……？"
"10033100-164-ウミカ" = "今ご覧になっている舞は、祈りと奉納を表現しており――"
"10033100-165-キララ" = "……うん、良かった。"
"10033100-166-エリカ" = "ね。"
"10033100-167-チセ" = "……。"
"10033100-168-チセ" = "花が舞い"
"10033100-169-チセ" = "喜び満ちて"
"10033100-170-チセ" = "幕となる"
