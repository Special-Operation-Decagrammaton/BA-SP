[translation]
"10033045-1" = "[ns] \"……というわけなんだけど。\""
"10033045-2-メグ" = "うーん……こうなったら仕方ない！"
"10033045-3-メグ" = "工芸品も動かなくなっちゃったってことは、#n水脈が無くなっちゃったのかもしれないし？"
"10033045-4-アラタ" = "くっ、一度撤退だ……！"
"10033045-5-エリカ" = "何とかなったみたいだね。"
"10033045-6-キララ" = "解決解決ー♪"
"10033045-7-ウミカ" = "お二人は、お客さんのはずなのに……#n申し訳ないです……。"
"10033045-8-ウミカ" = "それから、本当にありがとうございます。"
"10033045-9-キララ" = "あはっ、まぁ放っておくとあたしらも困るし？"
"10033045-10-エリカ" = "余計なお世話じゃなかった？"
"10033045-11-ウミカ" = "と、とんでもないです……！#nむしろどうお礼をすれば良いものか……。"
"10033045-12-キララ" = "堅いなぁ。#nガイドとお客さんである前に、あたしたち友達でしょ？"
"10033045-13-ウミカ" = "と、友達……？"
"10033045-14-キララ" = "あれ、違った？#nだってもう写真も撮ったし、連絡先も交換したし。"
"10033045-15-エリカ" = "……こういう子なんだよね。"
"10033045-16-エリカ" = "大丈夫、距離感しんどくない？"
"10033045-17-ウミカ" = "い、いえ、そんなことは！#nむしろ恐縮と言いますか、何と言いますか……。"
"10033045-18-ウミカ" = "光栄……いえ、嬉しい、です。"
"10033045-19-キララ" = "じゃあ今後もよろしくね！#nはい、友情の握手！"
"10033045-20-ウミカ" = "は、はい……！"
"10033045-21-カエデ" = "あ、良いなー！#n私も、私も混ぜて！"
"10033045-22-フィーナ" = "一緒に苦難を乗り越えたのデスから、もう我々は「友」です！"
"10033045-23-ツバキ" = "次のスケジュールが始まったら……起こして……ぐぅ……。"
"10033045-24-エリカ" = "ずっと思ってたけど……#nこっちはこっちで、不思議な子だらけだね。"
"10033045-25-ウミカ" = "（でも、スケジュールの遅れはもう34分……）"
"10033045-26-ウミカ" = "（こ、今度こそ巻き返しを……！）"
