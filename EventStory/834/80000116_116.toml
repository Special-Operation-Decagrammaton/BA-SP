[translation]
"80000116-1" = "器に[ruby=ふさわ]相応[/ruby]しいプレゼント"
"80000116-2" = "（バレンタイン当日の朝、マコトから連絡が来た）"
"80000116-3-マコト" = "キシシッ、今日はバレンタインデー……"
"80000116-4-マコト" = "知人や友人、恋人なんかに……感謝の気持ちでチョコレートを贈る日だ。"
"80000116-5-マコト" = "全ては製菓会社の陰謀に過ぎない、という指摘もあるが……"
"80000116-6-マコト" = "キキキッ！#nイベントを楽しめないようでは、人としての面白さに欠けるだろう！"
"80000116-7-マコト" = "こういった余興を楽しんでこそ、優秀なリーダー足り得る。"
"80000116-8-マコト" = "毎年バレンタインデーが近づくと、様々なところに万魔殿としてチョコレートを贈っているからな。……いつもは私が用意してるわけではないが。"
"80000116-9-マコト" = "そこでだ、先生。この後、時間はあるか？"
"80000116-10-マコト" = "残りの時間を使って、お前のために最高のチョコレートを贈ろう。"
"80000116-11" = "[s] \"うん、時間ならあるよ。\""
"80000116-12-マコト" = "キシシッ！そうか、それは良かった。"
"80000116-13-マコト" = "では、後ほど待ち合わせ場所を連絡する！待っているぞ、先生よ！"
"80000116-14" = "[ns] \"マコトに言われた場所まで来てはみたけど……\""
"80000116-15-マコト" = "キシシッ、来たか先生！"
"80000116-16" = "[s1] \"お待たせ、マコト。ところで……どうしてドレス姿なの？\"\n[s2] \"それに、ここって……パーティー会場だよね？\""
"80000116-17-マコト" = "ああ、これらは全て先生のために用意したものだ。"
"80000116-18-マコト" = "うん……？なぜかって？"
"80000116-19-マコト" = "キシシッ、それくらい分かっているだろう。"
"80000116-20-マコト" = "当然、バレンタインデーだからだ！"
"80000116-21-マコト" = "今日は感謝の気持ちでチョコレートを贈る日だが……私はこう思ったのだ。"
"80000116-22-マコト" = "ただチョコレートを渡すだけでは……"
"80000116-23-マコト" = "──面白みに欠けるのではないか、とな。"
"80000116-24-マコト" = "ありきたりなプレゼントを用意してはサプライズ感も無い。#nそれに何より……"
"80000116-25-マコト" = "私の器が小さく見えてしまうと思ってな！"
"80000116-26" = "[s] \"……普通で良くない？\""
"80000116-27-マコト" = "否！断じて良くない！"
"80000116-28-マコト" = "そこで考えたのだ！#nこのマコト様に[ruby=ふさわ]相応[/ruby]しいバレンタインデーのプレゼントは何だろうかと。"
"80000116-29-マコト" = "何を贈れば、そこらの凡人とは比べようもない特別なものになるのかと！"
"80000116-30-マコト" = "そうやって悩みに悩んだ末──"
"80000116-31-マコト" = "キシシッ！ついに私は思いついたのだ！"
"80000116-32-マコト" = "そう、単にチョコレートを贈るのではなく、ゲヘナのパーティー会場を先生のためだけに貸し切り……"
"80000116-33-マコト" = "バレンタインパーティーを行えば良いとな！"
"80000116-34" = "[s] \"気持ちは嬉しいけど、ちょっと申し訳ないような……\""
"80000116-35-マコト" = "キキッ！遠慮は無用だ！"
"80000116-36-マコト" = "それに、まだ主役の紹介はしていない……あれを見てくれ！"
"80000116-37" = "[ns] \"……チョコレートファウンテン？\""
"80000116-38-マコト" = "ああ、その通りだ。"
"80000116-39-マコト" = "これくらいでなくては、このマコト様が贈るプレゼントに相応しくないだろう。"
"80000116-40-マコト" = "キシシッ……どうだ、先生？もっと驚いたり嬉しがっても良いぞ？"
"80000116-41-マコト" = "しかも、なんとゲヘナでも最高級のカカオを使用した……#nゲヘナ、いや……キヴォトスで最も豪華なチョコレートファウンテンだからな！"
"80000116-42" = "[s3] \"あまりにも予想外で驚いたけど……\"\n[s4] \"マコトらしいプレゼントだね。\""
"80000116-43" = "[ns] \"私のためにこれだけしてくれて、本当に嬉しいよ。\""
"80000116-44-マコト" = "うむむ！？"
"80000116-45" = "[s] \"……どうかしたの、マコト？\""
"80000116-46-マコト" = "いや……一瞬、先生の言葉を聞いて胸の奥に不思議な感じがしたのだが……"
"80000116-47-マコト" = "キシシッ。どうやら、これは……"
"80000116-48-マコト" = "……バレンタインデーの準備で疲れが溜まっているのかもしれないな！"
"80000116-49-マコト" = "だが、今はせっかく準備したのだから、楽しまなくてはもったいない。"
"80000116-50" = "[s] \"……これは……どうやって楽しめばいいの？\""
"80000116-51-マコト" = "ふっ。なんだ、分からないのか？"
"80000116-52-マコト" = "キキッ。よし、ここは私がチョコレートファウンテンの楽しみ方を教えてやろう。"
"80000116-53-マコト" = "まずは食べたいお菓子を選ぶのだが……最初はマシュマロがいいぞ。"
"80000116-54-マコト" = "それで、マシュマロをフォークに刺したらチョコレートファウンテンに……"
"80000116-55-マコト" = "……ん？"
"80000116-56" = "[s] \"あっ！マコト、気をつけ……！\""
"80000116-57" = "プシャアアアアアアッ！！！"
"80000116-58-マコト" = "あああああああっ！？何が起こってる！？"
"80000116-59-マコト" = "ちょ、ちょっと！うぷっ、待ってくれ……！"
"80000116-60-マコト" = "ぐはああああっつ！？"
"80000116-61-マコト" = "……これは一体……なぜだ？#nバッテリーの熱で暴走したのか……？"
"80000116-62-マコト" = "先生が来る前に動作を確認しようと思って、5時間連続で動かし続けたからなのか……？"
"80000116-63-マコト" = "それとも……私の威厳に相応しくなるよう出力を5倍にしたのが原因なのか……？"
"80000116-64" = "[s5] \"暴走して当たり前だよね！？\"\n[s6] \"それよりマコト、怪我してない！？\""
"80000116-65-マコト" = "キキッ……キキキッ……"
"80000116-66-マコト" = "ああ、何ともない。"
"80000116-67-マコト" = "チョコレートが少し付いたくらいで大げさな。"
"80000116-68" = "[s] \"少しってレベルじゃないような……ドレスの裾まで汚れてるよ。\""
"80000116-69-マコト" = "どこにも問題は無い！このマコト様が、たかがチョコレートを被ったくらいで！"
"80000116-70-マコト" = "むしろ、おかげで確信を得た！"
"80000116-71" = "[s] \"……確信って？\""
"80000116-72-マコト" = "やはり、私が用意したチョコレートファウンテンなだけある。"
"80000116-73-マコト" = "最高級のチョコレートを使ったおかげで、これ以上ないくらい美味しいぞ！"
"80000116-74" = "[s] \"ものすごいポジティブだね！？マコトらしいけど！\""
"80000116-75-マコト" = "さあ、そんなところに突っ立ってないで、早く先生も来るがいい！"
"80000116-76-マコト" = "それとも、まずは私の指に付いたチョコを舐めてみるか？"
"80000116-77-マコト" = "マシュマロと一緒に味わう前に、チョコ本来の味を堪能した方が私の言葉を確実に理解できるだろう！"
"80000116-78-マコト" = "さあ！私の指を舐めるのだ！"
"80000116-79" = "[s] \"いやいや、いいから！普通に食べさせて！\""
"80000116-80-マコト" = "……うむ。"
"80000116-81-マコト" = "……そこまで強く断られると……さすがに傷つくのだが。"
"80000116-82-マコト" = "とにかく……バレンタインデーはまだまだ終わっていない！"
"80000116-83-マコト" = "私が用意したのはチョコレートファウンテンだけではない！#n本当のバレンタインはこれからだ！"
"80000116-84-マコト" = "いったん着替えてこよう！ここで待っているのだ、先生！"
"80000116-85-マコト" = "キシシッ！こうなったからには、今日一日、マコト様が用意した特別なバレンタインデーを堪能させてやろう！"
"80000116-86-マコト" = "家に帰るまでがバレンタインデーだ！"
"80000116-87" = "[ns] \"そうだね、せっかくのバレンタインデーだし……\""
"80000116-88" = "[ns] \"次は何を見せてくれるのか楽しみにしてるね。\""
"80000116-89" = "（予想外の出来事が連続して驚いたが、マコトが用意してくれたチョコレートはどれも美味しく、楽しい時間を過ごせた）"
