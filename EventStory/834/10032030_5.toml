[translation]
"10032030-1" = "第3話;怪しい奴ら"
"10032030-2-アル" = "……なっ！"
"10032030-3-アル" = "何なのよ、これぇーーー！！"
"10032030-4-ムツキ" = "あはははは！アルちゃん、すっごくいい反応！"
"10032030-5-ムツキ" = "そんなの「怪しい奴ら」に決まってるじゃん？#n爆弾まで大量に見つかるなんて！"
"10032030-6-カヨコ" = "正確には「リストに載っていない身元不明の奴ら」ね。#nアランチーノ以外の勢力。"
"10032030-7-カヨコ" = "もしかすると、テロリストかライバル組織かもしれない。"
"10032030-8-カヨコ" = "……それより、軽く回った程度でこれだけの数が出てくるなんて、後どのくらい残ってるのやら……"
"10032030-9-カヨコ" = "ど、ど、どうしてみんな落ち着いていられるの！？"
"10032030-10-カヨコ" = "これだけのテロリストと爆弾が見つかったのよ！？#nどう考えてもおかしくない！？"
"10032030-11-アル" = "そもそもオペラハウスは劇を見る場所であって、誰かに危害を加えるための場所じゃないわよ！？"
"10032030-12" = "[s1] \"え、今さら……！？\"\n[s2] \"一応、自覚はあったんだね……\""
"10032030-13-アル" = "か、からかってる場合じゃないでしょ、先生！"
"10032030-14-アル" = "まずは、どうして爆弾なんて設置したのか聞き出さないと！！"
"10032030-15-アル" = "う、うっ……！どうして分かったんだ？#n完璧に隠していたはずなのに……！"
"10032030-16-アル" = "専門家でもなければ、発見できない位置だったのに……一体どうやって？"
"10032030-17-カヨコ" = "運が悪かったね、こっちにも爆弾の専門家が居るからさ。"
"10032030-18-ムツキ" = "ハルカちゃんは、普段から数えきれないほどの爆弾を設置してるからね。#n場所を特定するのなんて、朝飯前だよ？"
"10032030-19-ハルカ" = "へ、へへっ……えへへへっ……"
"10032030-20-ムツキ" = "むしろ、こっちは別に探すつもりじゃなかったのに、こんな見つかっちゃうなんて……#nちょっとツメが甘いんじゃない～？"
"10032030-21-工作員A" = "そ、そんなバカな……！"
"10032030-22-工作員B" = "私たちを邪魔するってことは……お前たち、アランチーノの部下か！？"
"10032030-23-カヨコ" = "どこ向いて喋ってるの？まずは、こっちの質問に答える。"
"10032030-24-工作員B" = "ひぃぃぃっ！？"
"10032030-25-工作員B" = "し、知らない！本当に！！#nただ、命令されたんだ……アランチーノを[ruby=や]殺[/ruby]れって……！"
"10032030-26-カヨコ" = "……なるほど。つまり依頼されたってことね？"
"10032030-27-カヨコ" = "でも、爆弾だと無関係な人まで巻き添えになる。それに爆音で周囲の目を集めてしまうでしょう。"
"10032030-28-カヨコ" = "なのに、爆弾を使う理由なんてある？方法なら他にも色々あるのに。"
"10032030-29-工作員B" = "使わない理由も無いだろ？#nこれが一番確実だと思っただけだ。"
"10032030-30-工作員B" = "それに無関係の人が巻き込まれたところで、私たちの知ったことじゃないからな！"
"10032030-31-カヨコ" = "……確実に始末したかったわけね。"
"10032030-32-カヨコ" = "……あんた達の他は？どれくらい残ってる？"
"10032030-33-工作員A" = "さ、さあ……詳しくは知らんが、それらしき奴は何人か……"
"10032030-34-工作員A" = "そ、そうか……！お前たちも依頼を引き受けたんだな！？"
"10032030-35-工作員A" = "き、急に襲いかかってきたから、アランチーノ側かと思ってたが……#n聞いてくれ、私たちは敵じゃない！"
"10032030-36-工作員A" = "だから離してくれ！#n……そ、そうだ！手を組もう！お前たちにとっても、悪くない話じゃないか？"
"10032030-37-工作員A" = "ここで揉めてたって意味は無いだろう……#nお、おい！そこの変なの、お前がリーダーだろ？何とか言ってくれよ！"
"10032030-38-工作員A" = "いいから、まずはこれを外し……"
"10032030-39-工作員A" = "はず、し……"
"10032030-40-工作員A" = "ひぐっ……！？"
"10032030-41" = "[ns4] \"……気絶しちゃった。\"\n[ns5] \"……容赦ないね。\""
"10032030-42-ハルカ" = "い……"
"10032030-43-ハルカ" = "今、なんて言いました……？"
"10032030-44-ハルカ" = "アル様に向かって「おい」……？「変なの」……？"
"10032030-45-ハルカ" = "お前なんかがアル様によくもそんな暴言を……"
"10032030-46-ハルカ" = "許せません……"
"10032030-47-ハルカ" = "許せません許せません許せません許せません許せません……！！"
"10032030-48-工作員B" = "ひ、ひぃぃぃっ！？！？わ、私は何も言ってないぞ！？"
"10032030-49-アル" = "……ハルカ、もういいわ。"
"10032030-50-アル" = "……！！"
"10032030-51-ハルカ" = "……は、はいっ！"
"10032030-52-ハルカ" = "状況は大体分かったわ。#n爆弾を仕掛けて、オペラハウスごと吹き飛ばそうって算段ね……"
"10032030-53-アル" = "たしかに面白い発想だわ……手っ取り早くもある。"
"10032030-54-工作員B" = "じゃ、じゃあ……！！"
"10032030-55-工作員B" = "……でも、残念だったわね。"
"10032030-56-アル" = "私たち便利屋68は、あなた達のような小物と手を組まないのよ。"
"10032030-57-工作員B" = "こ、小物だと……！？"
"10032030-58-工作員B" = "デカい口叩きやがって……！"
"10032030-59-工作員B" = "たかが私たちを捕まえたくらいで調子に乗るなよ！#nこのオペラハウスに、どれだけ集まってると思う！？"
"10032030-60-工作員B" = "もし仲間たちが知れば……！"
"10032030-61-カヨコ" = "……そうだね。"
"10032030-62-カヨコ" = "なら、その前に口を封じるだけ。"
"10032030-63-工作員B" = "うぐっ……！"
"10032030-64-カヨコ" = "……続けて、社長。"
"10032030-65-アル" = "……あっ、うん。"
"10032030-66-アル" = "みんな、聞いてちょうだい。#n……ドン・アランチーノは、私たちの獲物よ。"
"10032030-67-アル" = "他の連中に譲ることも、手を組むことも論外。#nこれは私たちの仕事なんだから。"
"10032030-68-アル" = "……ターゲットが現れる前に、もう一度オペラハウスを見て回りましょう。"
"10032030-69-ムツキ" = "え～全部調べるの？大変じゃない？"
"10032030-70-カヨコ" = "連絡係から貰ったリストもあるし、不可能ではない。#n……時間は少しかかるけど。"
"10032030-71-アル" = "目的は何ひとつ変わってないわ。#n任務を遂行し、報酬を受取る。"
"10032030-72-アル" = "相手が誰であれ、社長の私の行く手を遮る者は、全員邪魔者よ。#nそして、邪魔者は排除するのみ。"
"10032030-73-アル" = "……行きましょう。"
"10032030-74-ハルカ" = "あ、アル様！私も……！！"
"10032030-75-カヨコ" = "はぁ……"
"10032030-76-カヨコ" = "……結局こうなっちゃったね、先生。"
"10032030-77-カヨコ" = "ああ言ってるけどさ、社長は……"
"10032030-78" = "[s6] \"大丈夫だよ、分かってるから。\"\n[s7] \"アルらしいね。\""
"10032030-79-ムツキ" = "くふふ……無関係な人まで巻き添えになるのは阻止したいんだろうね～さすがアルちゃん。"
"10032030-80-カヨコ" = "まあ、本当にオペラハウスが爆発したら、一般の観客も大変なことになるし。"
"10032030-81-ムツキ" = "どんどん面白くなってきたじゃん。いいね、いいね～！"
"10032030-82-カヨコ" = "というわけで、先生……"
"10032030-83-カヨコ" = "……もう少し、お願いね。"
