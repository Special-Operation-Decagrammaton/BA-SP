[translation]
"10032075-1-アル" = "ひ、ひとまず何とかなったのかしら……？"
"10032075-2-カヨコ" = "みたいだね。でも、ここが見つかるのも時間の問題だと思うけど……"
"10032075-3-ハルカ" = "あれ、ここは……"
"10032075-4-アル" = "どうしたの、ハルカ？"
"10032075-5-ハルカ" = "い、いえ！何でもありません！！"
"10032075-6-サオリ" = "これで一安心か……"
"10032075-7-サオリ" = "……先生には、頭が上がらないな。"
"10032075-8-サオリ" = "それと……"
"10032075-9-サオリ" = "便利屋68にも……"
"10032075-10-アル" = "ふふっ、気にする必要は無いわ。私たちはただ、利益を考えて動いただけよ。"
"10032075-11-アル" = "何も、あなたのために動いたわけじゃない。"
"10032075-12-サオリ" = "……そうか。"
"10032075-13-サオリ" = "だが私からすれば、恩を受けたことには変わりない。"
"10032075-14-サオリ" = "お前たちが居なかったら、あのまま奴らに利用するだけされて捨てられていた。"
"10032075-15-サオリ" = "代わりと言ってはアレだが……"
"10032075-16-アル" = "これって……"
"10032075-17-サオリ" = "お礼だ。もはや、私の依頼は失敗したも同然だからな。"
"10032075-18-サオリ" = "受けた恩は返す。それがこの世界のルールだと聞いた。"
"10032075-19-サオリ" = "……ふっ。"
"10032075-20-サオリ" = "そう言っていたのは、お前たちだろう。"
"10032075-21-アル" = "……っ。"
"10032075-22-アル" = "へぇ～私たちって信頼されてるんだ？"
"10032075-23-アル" = "で、でも、こんなあっさり譲られて、いいのかしら……？"
"10032075-24-ムツキ" = "まぁまぁ、別にいいじゃん～"
"10032075-25-ムツキ" = "ターゲットも確保したわけだし～"
"10032075-26-アル" = "これで……"
"10032075-27-ムツキ" = "依頼完了だよね？"
"10032075-28-カヨコ" = "……まあ、そうなるね。"
"10032075-29-ハルカ" = "本当に依頼完了ですか……！？"
"10032075-30-ハルカ" = "さ、さすがアル様です！最初からこれを狙っていたんですね……！？"
"10032075-31-アル" = "……へ？"
"10032075-32-アル" = "あ、うぇっ……？"
"10032075-33-サオリ" = "……！"
"10032075-34-サオリ" = "これが真のアウトロー……！"
"10032075-35-サオリ" = "まさか、そういう理由で私を……"
"10032075-36-サオリ" = "素晴らしい、感心したぞ。"
"10032075-37" = "[s1] \"何だかんだ丸く収まったし……\"\n[s2] \"結果オーライってことで……\""
"10032075-38-アル" = "ふ、ふふ……ええ、こうなることを見越していたのよ。"
"10032075-39-アル" = "それじゃ、短い間だったけど同盟もおしまいね。"
"10032075-40-アル" = "お互い、後腐れなく別れま……"
"10032075-41-アル" = "見つけたぞ！こっちだ！！"
"10032075-42-ギャングの組織員" = "こいつら！よくも逃げやがったな！！"
"10032075-43-ギャングの組織員" = "おい！集まれ！今度こそボスを取り戻すぞ！！"
"10032075-44-カヨコ" = "……っ、思ったより早かったか。"
"10032075-45-カヨコ" = "逃げ道は確保してるけど、何か手を打って時間を稼がないと。"
"10032075-46-サオリ" = "協力しよう。退路を確保する必要があるな。#n何か使えそうな物は……"
"10032075-47-サオリ" = "……おっと、ちょうどいい物が。"
"10032075-48-サオリ" = "これだけ大きなゴミ箱があれば……それも鉄製か。"
"10032075-49-サオリ" = "……ふむ、重量も申し分ないな。"
"10032075-50-ハルカ" = "……？"
"10032075-51-ハルカ" = "あれ……"
"10032075-52-ハルカ" = "…………あっ。"
"10032075-53-ハルカ" = "…………！？！？"
"10032075-54" = "[s3] \"どうしたの、ハルカ。\"\n[s4] \"顔色がすごく悪いけど……\""
"10032075-55-ハルカ" = "い、いえ！その、あれは……！"
"10032075-56" = "[s5] \"あれ……？\"\n[s6] \"あれって何……？\""
"10032075-57-ハルカ" = "あ、あの……"
"10032075-58-ハルカ" = "あのゴミ箱は……！！"
"10032075-59-サオリ" = "……くっ！好き勝手させるか。"
"10032075-60-カヨコ" = "ボスを取り返すために、いよいよ本気を出してきたみたい。#nこのままじゃジリ貧だね。"
"10032075-61-アル" = "さ、さあ、早く逃げるわよ！"
"10032075-62-カヨコ" = "で、ですから……！あのゴミ箱は……！"
"10032075-63-アル" = "……ハルカ、どうかしたの？"
"10032075-64-アル" = "あのゴミ箱って……？"
"10032075-65-ハルカ" = "その……さ、さっき……"
"10032075-66-ハルカ" = "回収した爆弾を……全部あの中に……"
"10032075-67-ハルカ" = "い、入れました……"
"10032075-68-ハルカ" = "えっと、なので……あのゴミ箱の中身は、全部爆弾のはずです……"
"10032075-69-アル" = "……ゴミ箱の中身？"
"10032075-70-アル" = "……爆弾？"
"10032075-71-ムツキ" = "オペラハウスの中で回収した爆弾のことじゃない？#n爆弾は全部ゴミ箱に捨てたって、ハルカちゃんが言ってたよね？"
"10032075-72-アル" = "……なるほど。"
"10032075-73-アル" = "思い出したわ！あの爆弾ね！"
"10032075-74-カヨコ" = "……待って。"
"10032075-75-カヨコ" = "じゃあ今、その危険物を盾にしてるってこと？"
"10032075-76-サオリ" = "……ん？何の話だ？"
"10032075-77-ハルカ" = "あ、榴弾が……"
"10032075-78-ムツキ" = "こっち飛んでくるよ！！"
"10032075-79" = "[ns] \"……あっ。\""
"10032075-80" = "[ns] \"結局こうなるなんて……\""
