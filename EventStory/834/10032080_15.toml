[translation]
"10032080-1" = "エピローグ;こういう日もある"
"10032080-2-店主" = "天ぷらうどん、いっちょ上がり！"
"10032080-3" = "[s1] \"あ、どうも。\"\n[s2] 会釈して料理を受け取る。"
"10032080-4-店主" = "みんないい服を着てるってのに、汚れちまってるじゃないか！#n工事現場にでも居たのかい？"
"10032080-5-店主" = "まっ、美味いモン食ってイヤなことなんて忘れちまおう！はっはっは！"
"10032080-6" = "[s3] \"ありがとうございます、大将。\"\n[s4] \"あはは……まあ色々と。\""
"10032080-7-カヨコ" = "……なんとか全員座れたね。"
"10032080-8-カヨコ" = "五人掛けの屋台に六人で座るなんて。"
"10032080-9-カヨコ" = "や、やっぱり狭いですよね！？私だけ立って食べますので！#nい、いえ、いっそのこと椅子になれば……！"
"10032080-10-ムツキ" = "ううん、ハルカちゃん。そのまま座ってていーよ！"
"10032080-11-ムツキ" = "それより、アルちゃん。依頼全部パーになったけど、これからどうするの？"
"10032080-12-アル" = "アルちゃんじゃなくて、社長でしょ！"
"10032080-13-ムツキ" = "依頼を成功させて、もっとハードボイルドになるとか、いろいろ言ってたけど……"
"10032080-14-ムツキ" = "結局、ターゲットの確保も失敗したし、オペラハウスは崩壊しちゃったね。"
"10032080-15-アル" = "し、仕方ないじゃない！あんな爆発が起こったら……"
"10032080-16-アル" = "無事に抜け出せただけでも奇跡よ！？少しでも遅れてたら……"
"10032080-17-アル" = "ニュースの時間です。本日、オペラハウスで大規模の爆発があり、建物が倒壊しました。"
"10032080-18-アル" = "通報に駆けつけたヴァルキューレ警察学校によりますと、観客と関係者のほとんどが犯罪組織と関わっており……"
"10032080-19-カヨコ" = "……事件の原因は組織間の対立と見られております。ヴァルキューレは、現場に残っていた全員の身柄を確保し、現在取り調べを行なっているとのことです。"
"10032080-20-カヨコ" = "全員仲良く、ヴァルキューレに連行されてたかも。#nしかも、ギャングの奴らと一緒に。"
"10032080-21-カヨコ" = "今回の事件で、アランチーノは……いや、ギャング連合は終わったも同然ね。"
"10032080-22-カヨコ" = "まあ、依頼人も逮捕されちゃったし、私たちが受け取るはずだった報酬も……"
"10032080-23-ハルカ" = "すみません……私が爆弾をゴミ箱に捨てたせいで……"
"10032080-24-カヨコ" = "ううん、ハルカが気にする必要は無いよ。むしろ、良かったんじゃないかな。"
"10032080-25-カヨコ" = "あいつら、ボスを取り返すためなら、ひたすら私たちを追いかけてきただろうし……"
"10032080-26-カヨコ" = "[ruby=ああひも、おあじはんあえだ]……私も同じ考えだ。[/ruby]"
"10032080-27-カヨコ" = "[ruby=ひふれい]失礼[/ruby]……"
"10032080-28-サオリ" = "……私も同じ考えだ。"
"10032080-29-サオリ" = "おかげで、無事に脱出できたからな。それに、奴らと手を切ることもできた。"
"10032080-30" = "[s5] \"お腹空いたでしょ？もっと頼んでいいよ。\"\n[s6] \"今日は私の奢りだから。\""
"10032080-31-サオリ" = "……そ、そんな！？"
"10032080-32-サオリ" = "……いや、ここは素直に礼を言うべきか。"
"10032080-33-サオリ" = "ありがとう、先生。この恩は必ず……！"
"10032080-34-ムツキ" = "なになに？もう私たちは仲間だって言いたいの？"
"10032080-35-カヨコ" = "実際、最後は仲間になったからね。#nそもそも衝突してた原因は、お互いが引き受けていた依頼のせいだし。"
"10032080-36-カヨコ" = "細かいこと気にしてたら、裏社会で仕事なんか続けられないって……"
"10032080-37-カヨコ" = "……よく言ってるでしょ、社長。"
"10032080-38-ムツキ" = "へ？わ、私……！？"
"10032080-39-アル" = "え、ええ、もちろんよ！私たちのことを何だと思っているのよ！#n仕事に私情を挟むわけないじゃない！"
"10032080-40-アル" = "……だから、気にしなくていいわ。#nどんな仕事であれ、依頼を遂行し報酬を受け取る。"
"10032080-41-アル" = "それが我々、便利屋68のモットーよ。"
"10032080-42-ムツキ" = "まあ、今回は失敗しちゃったけどね～"
"10032080-43-アル" = "だ、だから細かいことは気にしないでって！#nこういう日もあるでしょう？"
"10032080-44-アル" = "ええ、そうよ！仕事を続けていると、これくらい起きるものなんだから！"
"10032080-45-サオリ" = "……！"
"10032080-46-サオリ" = "なるほど……そうやって受け流すのか。"
"10032080-47-サオリ" = "以前は、依頼人に騙されて報酬を受け取れない日も多々あったが……"
"10032080-48-サオリ" = "こういう日もある、か……よし、覚えておこう。"
"10032080-49-カヨコ" = "いや、そこは流しちゃダメでしょ。いったい何があったの……"
"10032080-50-アル" = "……あ。"
"10032080-51-アル" = "そういえば、先生。"
"10032080-52-アル" = "教材用のBDは……？"
"10032080-53-ムツキ" = "劇以前に、オペラハウスごと崩壊したんだし、当然無理じゃない？"
"10032080-54-サオリ" = "……あ。"
"10032080-55-ムツキ" = "……あ。"
"10032080-56-ハルカ" = "……あ。"
"10032080-57-カヨコ" = "……あ。"
"10032080-58" = "[ns] \"……あはは。\""
"10032080-59" = "[ns] \"まぁ……\""
"10032080-60" = "[ns] \"……こういう日もあるよ。\""
"10032080-61" = "0068 オペラより愛をこめて！"
