[translation]
"10032045-1-ドン·アランチーノ" = "はぁ……はぁ……"
"10032045-2-ドン·アランチーノ" = "こ、これは一体どういうことだ……！？"
"10032045-3-ドン·アランチーノ" = "私を狙う連中が居るとは聞いていたが……"
"10032045-4-ドン·アランチーノ" = "まさか、この場の全員がそうだとは思わんかったぞ……！"
"10032045-5-ドン·アランチーノ" = "護衛も散り散りになってしまったし……"
"10032045-6-ドン·アランチーノ" = "おい！「切り札」は今どこにいる？緊急事態だ！早く連れてこい！！"
"10032045-7-ドン·アランチーノ" = "私か？今、出演者控え室の近くだ！ああ、そこで合流しよう！"
"10032045-8-ドン·アランチーノ" = "チッ、控え室まで行かなくては……！だが、そこまで行けば後は……！"
"10032045-9-ドン·アランチーノ" = "私の「切り札」が……！"
"10032045-10-ドン·アランチーノ" = "クソッ、もうここまで追ってきたか……！！"
"10032045-11-ドン·アランチーノ" = "だが、もう控え室は目と鼻の……！"
"10032045-12-？？？" = "待っていたぞ。どうやら私の出番のようだな。"
"10032045-13-ドン·アランチーノ" = "……こ、この声は！"
"10032045-14-ドン·アランチーノ" = "説明は後だ、ひとまず中へ。"
"10032045-15-アル" = "……ど、どこに行ったのよ！？"
"10032045-16-ハルカ" = "し、出演者の控え室の方です！あちこちに戦いの跡が……！"
"10032045-17-ムツキ" = "中でも戦ってるのかな？それとも、もう終わったとか？"
"10032045-18-カヨコ" = "……どちらにせよ部屋の中に入ったのは確かね。#nまだ逃げてないといいんだけど。"
"10032045-19" = "[ns] \"……どうしたの？カヨコ。\""
"10032045-20-カヨコ" = "ううん、ちょっと気になって。"
"10032045-21-カヨコ" = "どうしてわざわざ、自分から逃げ場のない部屋に入ったのか……"
"10032045-22" = "[s1] \"逃げ場としては最悪だと思うけど……\"\n[s2] \"慌てて考えなしに入ったとか……？\""
"10032045-23-カヨコ" = "……それは分からない。でも、そんな初歩的なミスをするとは思えないね。"
"10032045-24-カヨコ" = "「何重にも策を弄する人物」だと聞いてるし……"
"10032045-25-アル" = "待って。じゃあ、あの部屋の中には罠が仕掛けられている可能性も……"
"10032045-26-ハルカ" = "大人しくアル様の餌食になってくださいいいいぃぃ！！"
"10032045-27-アル" = "は、ハルカ！ちょっと待ちなさい！"
"10032045-28-アル" = "一人で入ったら危ないわよ……！"
"10032045-29-アル" = "……は、ハルカ！？"
"10032045-30" = "[ns3] \"ハルカが飛んだ……！？\"\n[ns4] \"だ、大丈夫？ハルカ！？\""
"10032045-31-？？？" = "……これは厄介なことになったな。"
"10032045-32-？？？" = "今回の依頼人を狙う者は多いと聞いていたが……"
"10032045-33-？？？" = "まさか、お前たちまで現れるとは……便利屋68。"
"10032045-34" = "[ns5] \"……！？\"\n[ns6] \"こ、この声は……！\""
"10032045-35-アル" = "だ、誰……！？"
"10032045-36-カヨコ" = "たぶん、アランチーノが言ってた「切り札」ね。"
"10032045-37-カヨコ" = "でも、この声どこかで聞き覚えがあるような……"
"10032045-38" = "[ns] \"…………え。\""
"10032045-39-カヨコ" = "…………。"
"10032045-40-カヨコ" = "…[ruby=じょうまえ]…錠前サ[/ruby]オリ？"
