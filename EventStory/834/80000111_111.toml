[translation]
"80000111-1" = "青春全力投球"
"80000111-2" = "シャーレ執務室"
"80000111-3-レンゲ" = "師匠も知っての通り、今日はバレンタインデーだ！"
"80000111-4" = "[s] \"うん、そうだね。\""
"80000111-5-レンゲ" = "バレンタインデーは青春イベントの代表と言っても過言じゃあない。"
"80000111-6-レンゲ" = "「一年で最も青春らしい日は？」という質問があったとしたら……"
"80000111-7-レンゲ" = "「入学式」、「卒業式」、「学園祭」、「花火大会」、「クリスマス」、「新年」と肩を並べる存在――"
"80000111-8-レンゲ" = "それが、バレンタインデー。"
"80000111-9" = "[s] \"代表って言うわりに候補が多いような……？\""
"80000111-10-レンゲ" = "別におかしくないだろ？"
"80000111-11-レンゲ" = "それに、アタシたち青春を追い求める者にとっては毎日が青春みたいなものだし。"
"80000111-12-レンゲ" = "もし誰かにさっきの質問をされたら、アタシは迷うことなくこう答えるよ。"
"80000111-13-レンゲ" = "今日が一番青春らしい日だと！"
"80000111-14-レンゲ" = "先生……いや、師匠と過ごす時間はいつだって青春なんだけどさ。"
"80000111-15" = "[s1] \"代表の話はどこに行ったの！？！\"\n[s2] \"もちろん、そう言ってもらえるのはすごく嬉しいけどね！？\""
"80000111-16-レンゲ" = "まあ、そういうわけで……"
"80000111-17-レンゲ" = "一大青春イベントのバレンタインデーを大人しく過ごすなんて、「青春師弟」にあるまじき行いだよ。"
"80000111-18-レンゲ" = "それなら、やるべきことは一つじゃないか？"
"80000111-19" = "[s] \"やるべきことって……？\""
"80000111-20-レンゲ" = "師匠と共に「青春活動」に邁進する「青春経験者」として……"
"80000111-21-レンゲ" = "今日を一生忘れられない最高のバレンタインデーにする！"
"80000111-22-レンゲ" = "だから決めたんだ。"
"80000111-23-レンゲ" = "最高のバレンタインチョコレートを作って、先生にプレゼントすると。"
"80000111-24-レンゲ" = "どうだ、師匠？私の計画は！"
"80000111-25" = "[s] \"レンゲからチョコレートをもらえるなんて、すごく嬉しいよ。\""
"80000111-26-レンゲ" = "へへっ、そうだろう？"
"80000111-27-レンゲ" = "今まで師匠と積み重ねてきた数々の青春イベントを活かして……"
"80000111-28-レンゲ" = "[ruby=ふわ]不破[/ruby]レンゲの全力投球を楽しみにしててほしい！"
"80000111-29" = "[s] \"もちろん、楽しみにし……\""
"80000111-30-レンゲ" = "じゃあ先生、また後で会おう！"
"80000111-31" = "[ns] \"……言い切る前に行っちゃった。\""
"80000111-32" = "（その後、レンゲが来るのをシャーレで待っていたが……）"
"80000111-33" = "（一向に音沙汰が無かった）"
"80000111-34" = "（レンゲと別れてから3時間後……）"
"80000111-35" = "[ns] \"もしもし、レンゲ？\""
"80000111-36-レンゲ" = "ごめん、師匠！#nちょっと時間がかかりそうだから、先に電話だけでもと思って。"
"80000111-37-レンゲ" = "問題なく進んではいるから、もう少し待っててくれ！"
"80000111-38" = "[s] \"うん、分かったよ。あまり無理しないでね。\""
"80000111-39-レンゲ" = "大丈夫、そろそろコツが掴めそうなんだ。じゃ！"
"80000111-40" = "（電話をもらってから3時間後……）"
"80000111-41" = "[ns] \"あ、レンゲ。チョコレート作りは順調？\""
"80000111-42-レンゲ" = "その話なんだけど……"
"80000111-43-レンゲ" = "ごめん、師匠！もう少し！本当にもう少し！#nすでにほぼ完成してるというか……"
"80000111-44-レンゲ" = "大体80%くらい……78%……いや、67……ううん、50%くらいは……！"
"80000111-45" = "[s] \"ほぼ完成って言葉はどこに行ったの！？\""
"80000111-46-レンゲ" = "だ、大丈夫！#nほら、始めた時点で半分終わったようなもんって言葉があるだろ？"
"80000111-47" = "[s] \"50%すら怪しく思えてきたような……\""
"80000111-48-レンゲ" = "き、気のせいだから！#nそれにまだ今日は終わってない！"
"80000111-49-レンゲ" = "じゃあ！師匠！今度は完成したら連絡する！"
"80000111-50" = "（そして、また3時間後……）"
"80000111-51" = "[ns] \"もしも……\""
"80000111-52-レンゲ" = "ごめん！師匠！本当にもう少しなんだ……！"
"80000111-53-レンゲ" = "ついさっき、湯煎って言葉を知ったところだから任せてほしい！"
"80000111-54-レンゲ" = "どうやらチョコレートを直火に当てるのはマズかったみたい！"
"80000111-55-レンゲ" = "青春って学びの連続なんだな！"
"80000111-56" = "[s] \"う、うん……\""
"80000111-57-レンゲ" = "それじゃ師匠……今度こそ完成したら連絡する！"
"80000111-58" = "（最後に電話がかかってきてから3時間が経過した……）"
"80000111-59" = "[ns] \"電話すら来なくなったけど……レンゲ、大丈夫かな。\""
"80000111-60" = "（待ってみようかと思ったけど……）"
"80000111-61" = "[ns] \"やっぱり、様子を見に行ってみよう。\""
"80000111-62" = "百花繚乱・厨房"
"80000111-63" = "[ns] \"電気が消えてる……\""
"80000111-64" = "（レンゲの姿を探して、いろいろな場所を回っていると……）"
"80000111-65-レンゲ" = "ううっ、どうしてもチョコレートの形が……#nこのままじゃ時間が……"
"80000111-66" = "[s] \"……レンゲ？\""
"80000111-67-レンゲ" = "せ、先生……？#nどうしてここに……？"
"80000111-68-レンゲ" = "……電話が来なかったから心配で？"
"80000111-69-レンゲ" = "……くっ。"
"80000111-70-レンゲ" = "ごめん！先生！それが……！"
"80000111-71" = "[ns] \"なかなか思い通りのチョコレートができなかったの？\""
"80000111-72-レンゲ" = "ごめん、先生……！"
"80000111-73-レンゲ" = "最高のバレンタインデーにするために、最強のバレンタインチョコレートを作りたかったのに……"
"80000111-74-レンゲ" = "あんな自信満々に言っておいて、結局こんな時間まで先生を待たせて……"
"80000111-75-レンゲ" = "……そりゃあ、ロクに料理ができない私にチョコレートを作れるわけ……ない、よな……"
"80000111-76-レンゲ" = "あはは……自分が今すごく恥ずかしいよ……"
"80000111-77-レンゲ" = "ごめん……みっともないよな……？"
"80000111-78-レンゲ" = "そもそも、アタシなんかがチョコレートを渡そうとしたのが間違いだったん――"
"80000111-79" = "[s] \"それは違うよ、レンゲ。\""
"80000111-80-レンゲ" = "せ、先生……？"
"80000111-81" = "[s3] \"チョコレートをくれるって聞いて……\"\n[s4] \"すごく嬉しかったんだ、レンゲの気持ちが。\""
"80000111-82-レンゲ" = "……チョコレート作りに失敗したくらいじゃガッカリしないって？"
"80000111-83-レンゲ" = "むしろ……？"
"80000111-84" = "[s] \"失敗も青春の1ページだし、また挑戦すればいいだけだから。\""
"80000111-85" = "[ns] \"一緒に作ろっか。だって、私はレンゲの師匠でしょう？\""
"80000111-86-レンゲ" = "……ありがとう。"
"80000111-87-レンゲ" = "先生……いや、師匠……！"
"80000111-88-レンゲ" = "失敗ばかりで、ちょっと気が弱くなってたみたいだ！"
"80000111-89-レンゲ" = "こんなのアタシらしくないな！"
"80000111-90-レンゲ" = "……よし。"
"80000111-91-レンゲ" = "……それじゃ、悪いけど師匠。"
"80000111-92-レンゲ" = "チョコレート、一緒に作ってくれないか……？"
"80000111-93" = "[s] \"うん、もちろんだよ。\""
"80000111-94" = "（こうして、チョコレート作りを再開し……）"
"80000111-95-レンゲ" = "おぉ……つ、ついに……"
"80000111-96-レンゲ" = "先生のおかげで、なんとか日付が回る前に完成したよ……！"
"80000111-97" = "[s] \"ふぅ……良かったね、レンゲ。\""
"80000111-98-レンゲ" = "……うん。本当にありがとう、師匠。"
"80000111-99-レンゲ" = "いつも思うんだ……師匠の教えが無かったらどうなってたんだろうって。"
"80000111-100-レンゲ" = "師匠が居てくれて、良かった……本当に。"
"80000111-101-レンゲ" = "あ！こうしてる場合じゃない。一緒に作ってもらったから、アタシのチョコレートとは言えないかもしれないけど……"
"80000111-102-レンゲ" = "師匠！日付が変わる前に、このチョコレートを……"
"80000111-103" = "[s] \"うん、一緒に食べよっか。\""
"80000111-104" = "（そうしてレンゲと力を合わせて作ったチョコレートは、とても温かくて美味しかった）"
