[translation]
"80000110-1" = "局長のブレンドコーヒー"
"80000110-2" = "（バレンタイン当日の朝、シャーレの仕事でヴァルキューレ警察学校を訪れた）"
"80000110-3" = "ヴァルキューレ警察学校・行政室"
"80000110-4-カンナ" = "うーん、困ったな……"
"80000110-5-カンナ" = "……ん？"
"80000110-6-カンナ" = "[USERNAME]先生、おはようございます。"
"80000110-7-カンナ" = "こんな時間にいらっしゃるなんて……何か緊急の案件でしょうか？"
"80000110-8-カンナ" = "……今週のパトロール日程の確認に？"
"80000110-9-カンナ" = "……そうでしたか、安心しました。"
"80000110-10-カンナ" = "思いがけぬタイミングで先生とお会いしたものですから、何か起きたのかと思ってしまいました。"
"80000110-11" = "[s] \"カンナは何をしてたの？\""
"80000110-12-カンナ" = "いつものように事件の報告書を作成していたところです。"
"80000110-13-カンナ" = "作戦中に消耗した弾丸の支出内訳や榴弾で発生した商店街の被害経緯を――"
"80000110-14-カンナ" = "ところで、今日は外がやけに騒がしいですね。#n何かイベントでもあるのでしょうか……？"
"80000110-15-カンナ" = "……バレンタインデー？"
"80000110-16-カンナ" = "ああ、もうそんな時期でしたか。"
"80000110-17-カンナ" = "駅周辺のお店にチョコレートが並んでいたので、なんとなくそろそろだとは思っていましたが……ここ数日、仕事が忙しくすっかり忘れていました。"
"80000110-18-カンナ" = "バレンタインデーか……この時期はD.U.各地でバレンタイン関連のイベントが行われる関係で、我々もパトロールを強化しています。"
"80000110-19-カンナ" = "特に小さな事故が頻繁に発生するため、生活安全局の生徒がいつも出動していて……"
"80000110-20-カンナ" = "……まぁ、重犯罪を扱う私たち公安局と直接の関係はありませんが。"
"80000110-21-カンナ" = "………。"
"80000110-22-カンナ" = "先生、せっかく来てくださったのですから、コーヒーでもいかがですか？"
"80000110-23-カンナ" = "よろしければ、すぐに淹れてきます。"
"80000110-24" = "[s] \"じゃあ、お願いしてもいい？\""
"80000110-25-カンナ" = "はい、それでは「いつもの」を用意してきます。"
"80000110-26-カンナ" = "どうぞ。"
"80000110-27" = "[s] \"ありがとう、いただきます。\""
"80000110-28" = "[ns1] \"あれ……？\"\n[ns2] \"「いつもの」と少し違うような……？\""
"80000110-29-カンナ" = "……何か問題でも？"
"80000110-30" = "[s] \"いや、味はいつも通り美味しいんだけど……\""
"80000110-31" = "[ns] \"ほのかにチョコレートの香りがするような。\""
"80000110-32-カンナ" = "コーヒーはフルーツとも言いますし、チョコレートの香りがする豆も多いですから。"
"80000110-33-カンナ" = "丁寧に焙煎されたコーヒー豆からチョコレートの香りがしても、おかしいところはありません。"
"80000110-34" = "[s] \"でも……これって普段と同じコーヒー豆だよね？\""
"80000110-35-カンナ" = "はい、いつものコーヒー豆を使いました。"
"80000110-36-カンナ" = "ただ、もしいつもより甘いとしたら……"
"80000110-37-カンナ" = "焙煎する過程で、[ruby=・   ・]感情[/ruby]が混ざったのかもしれませんね。"
"80000110-38-カンナ" = "……では、今日もお互い頑張りましょう。"
"80000110-39" = "（その後、カンナが淹れてくれた甘いコーヒーを飲んでから、自分の仕事を再開した）"
