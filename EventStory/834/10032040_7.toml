[translation]
"10032040-1" = "第4話;想定外の事態"
"10032040-2-ドン·アランチーノ" = "全員下がれ！道を開けろ！"
"10032040-3-ドン·アランチーノ" = "ふうむ……思った以上に良いところだ、悪くない。"
"10032040-4-ドン·アランチーノ" = "席まで案内しろ、遅れて入場するなんて恥晒しは御免だからな。"
"10032040-5-ドン·アランチーノ" = "……本当に行かれるんですか？"
"10032040-6-ドン·アランチーノ" = "ボスを狙っているとの情報は、すでにいくつも入ってきています。"
"10032040-7-ドン·アランチーノ" = "おそらく、このオペラハウスでも……なのに、あえて劇をご覧になるだなんて……"
"10032040-8-ドン·アランチーノ" = "……黙ってろ。"
"10032040-9-ドン·アランチーノ" = "…………。"
"10032040-10-ギャングの組織員B" = "愚かな奴め。そんなことに怯えていたら、奴らの思うツボだ。"
"10032040-11-ドン·アランチーノ" = "スケジュールは予定通り進めよ。#n我々を狙う脅威が居るのなら、正面から立ち向かってやろうじゃないか。"
"10032040-12-ドン·アランチーノ" = "なにせ、今日は「切り札」を用意してあるのだ。"
"10032040-13-ドン·アランチーノ" = "……切り札、ですか？"
"10032040-14-ドン·アランチーノ" = "……フッ。まあ、気にするな。お前は警戒を怠るな。"
"10032040-15-ドン·アランチーノ" = "分かったのなら、さっさと道を案内しろ。いつまで立たせておくつもりだ？"
"10032040-16-ドン·アランチーノ" = "……はいっ！では、こちらへ……"
"10032040-17-ムツキ" = "……あんな大勢の人を従えてたら、逆に目立つんじゃない？"
"10032040-18-アル" = "いっそのこと、身を隠すよりも堂々と表に立つ方が賢明だと考えたんでしょうね。"
"10032040-19-ムツキ" = "……実際、私たちとしては不都合だわ。#nなにせ、あの数の護衛をくぐり抜けてさらわなければいけないもの。"
"10032040-20-アル" = "他の連中が、なぜオペラハウスごと吹き飛ばそうとしてたのか理解できたわ。"
"10032040-21-アル" = "わ、私がやりましょうか？今からでも爆弾を……！"
"10032040-22" = "[s1] \"お、落ち着いて、ハルカ……！\"\n[s2] \"そんなことしたら、全部水の泡だよ……！\""
"10032040-23-カヨコ" = "急がなくて大丈夫。#n護衛の存在は想定内だし、機会はいくらでもあるから。"
"10032040-24-カヨコ" = "むしろ気になるのは……「切り札」という言葉と、周囲の空気かな。"
"10032040-25-アル" = "たしかに……怪しいわね。"
"10032040-26-アル" = "……え？"
"10032040-27-アル" = "周囲の空気って……？"
"10032040-28-カヨコ" = "……周りをよく見て、社長。"
"10032040-29-ムツキ" = "うーん、なんか動揺してるような気が……"
"10032040-30-アル" = "そ、それは、いきなり大物が現れたんだから、緊張するのも……"
"10032040-31-カヨコ" = "……違う。これは、そういう雰囲気じゃない。"
"10032040-32-カヨコ" = "全員、視線は逸らしつつ、ボスの動きを注視している。#nそれにボスだけじゃなくて、フロア全体を……"
"10032040-33-カヨコ" = "これって、もしかして……"
"10032040-34" = "[s3] \"リストに載っていない「怪しい人」……？\"\n[s4] \"まだ残ってたんだね……\""
"10032040-35-アル" = "……？"
"10032040-36-アル" = "……えっ？"
"10032040-37-カヨコ" = "ま、待って。おかしくないかしら？"
"10032040-38-アル" = "怪しい連中は全て処理したはず！#nリストの残りの人は、みんな一般人だったわよ！？"
"10032040-39-アル" = "一般人がボスを狙うだなんて……"
"10032040-40-アル" = "……！！"
"10032040-41-アル" = "最初から、全員「怪しい奴ら」だったってこと……？"
"10032040-42-カヨコ" = "まぁ……"
"10032040-43-カヨコ" = "……そうなるね。"
"10032040-44-カヨコ" = "……残念だけど。"
"10032040-45-アル" = "なっ……"
"10032040-46-アル" = "何ですってーーー！？！？！？"
"10032040-47-ムツキ" = "あははははっ！！"
"10032040-48-ムツキ" = "一般の観客を守るために怪しい奴を探していたのに、実は全員怪しかったってこと？"
"10032040-49-ムツキ" = "何それ、超ウケる～！！"
"10032040-50-ムツキ" = "わ、笑ってる場合じゃないわよ！？"
"10032040-51-ムツキ" = "だって、すごくない？こんなの全く予想できなかったもん。"
"10032040-52-ムツキ" = "アルちゃんは？先生はどう思う？こんなの予想できた？"
"10032040-53" = "[s5] \"たしかに、驚いたね。\"\n[s6] \"私も予想外だったよ。\""
"10032040-54-ムツキ" = "こ、こんなのおかしいわよ！じゃあ、身元確認はどうしたっていうの！？招待状は！？#n何なのよ、全然話が違うじゃない！"
"10032040-55-カヨコ" = "まあ、リストなんて簡単に偽造できるし。#nそもそも、名簿を疑わなかったのが甘かったね……"
"10032040-56-ムツキ" = "アルちゃん～私たちだって誰かがリストを偽造してくれたおかげで、ここに入れたんだよ～？"
"10032040-57-アル" = "だから、どうしてそんな冷静なのよ！"
"10032040-58-アル" = "ううぅ……胃が痛いわ。"
"10032040-59-アル" = "落ち着きなさい、[ruby=りくはちま]陸八魔[/ruby]アル。#nこれからどうすればいい？考えるのよ。"
"10032040-60-アル" = "今すぐ何かが起こるとは思えない。#nきっと、まだみんな様子を伺っているはず……"
"10032040-61-アル" = "そ、そうよ！焦る必要は無いわ！ご、護衛だって居るんだもの。"
"10032040-62-アル" = "……じゃあ、あえて先手を打つ？それとも誰かが手出しするのを見守る？#nいや、それで先にターゲットの身柄を奪われたら……"
"10032040-63-アル" = "うおおおおぉっ！！覚悟しろ！ドン・アランチーノ！！"
"10032040-64" = "[ns7] \"……すごい勢いだね。\"\n[ns8] \"……誰かが突撃してるけど。\""
"10032040-65-アル" = "どうして！？！？"
"10032040-66-アル" = "バカなの！？あんだけ護衛がたくさん居るのに！？！？"
"10032040-67-カヨコ" = "まぁでも、あの数じゃオペラハウスに居る全員を相手にするのは難しそうだね。"
"10032040-68-カヨコ" = "どうする、社長？私たちも行く？それとも様子を見ようか？"
"10032040-69-アル" = "あっ……えっと、とりあえず落ち着きましょう。まずは様子を……"
"10032040-70-アル" = "おい、そこのクズども！邪魔すんじゃない！"
"10032040-71-アル" = "えっ、クズ……？"
"10032040-72-アル" = "……私たちのこと？"
"10032040-73-カヨコ" = "……あ。"
"10032040-74-カヨコ" = "社長、それに反応しちゃ……"
"10032040-75-ハルカ" = "アル様に向かってクズ？よくもよくもよくもそんな暴言を――！！！"
"10032040-76-ハルカ" = "許さない許さない許さない許さない！許さなあああぁぁあああああい！！！"
"10032040-77-カヨコ" = "……はぁ。"
"10032040-78-ムツキ" = "あははははっ！！やっぱりハルカちゃん、面白い！！"
"10032040-79-アル" = "……あぁ。"
"10032040-80-アル" = "あっ、えぅ……うっ……"
"10032040-81" = "[s9] \"……アル？\"\n[s10] \"これからどうする？\""
"10032040-82-アル" = "……はっ！"
"10032040-83-アル" = "どうするも何も、こうなった以上仕方ないわね……みんな、手加減しなくていいわ！"
"10032040-84-アル" = "追いましょう！みんな、ボスを捕まえるのよ！"
