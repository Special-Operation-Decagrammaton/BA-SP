[translation]
"10032065-1-サオリ" = "……ここか。"
"10032065-2-サオリ" = "……応援はまだか？思ったより遅いな。"
"10032065-3-サオリ" = "いや、愚痴を言っている場合じゃない。#nこうなれば、応援が駆けつけるまで依頼人を守るだけだ。"
"10032065-4-サオリ" = "幸い、ここの地形は作戦の遂行に適している。"
"10032065-5-サオリ" = "…………。"
"10032065-6-サオリ" = "便利屋68……"
"10032065-7-サオリ" = "もうたどり着いたのか……厄介な。"
"10032065-8" = "[s1] \"追いついたよ、サオリ。\"\n[s2] \"カヨコの言った通りだね。\""
"10032065-9-サオリ" = "先生まで……"
"10032065-10-アル" = "……待って。"
"10032065-11-アル" = "アランチーノは一緒じゃなかったの？"
"10032065-12-アル" = "……それと、あなたが担いでいるその袋は何かしら。"
"10032065-13-カヨコ" = "まさかと思うけど、もしかして……"
"10032065-14" = "[s3] \"ドン・アランチーノを……\"\n[s4] \"袋の中に入れて運んだの……？\""
"10032065-15-サオリ" = "……？"
"10032065-16-サオリ" = "……そうだが、何か問題でも？"
"10032065-17-カヨコ" = "…………？"
"10032065-18-カヨコ" = "…………？"
"10032065-19" = "[ns] \"…………？\""
"10032065-20-ハルカ" = "た、たしかに良い方法かもしれませんが……"
"10032065-21-ムツキ" = "あははははっ！何それ！大胆すぎる！！"
"10032065-22-カヨコ" = "いや、良いわけないでしょ。完全にアウトだから。"
"10032065-23-サオリ" = "な、なんだ……？#nまるで私の行動がおかしいかのような口ぶりだが。"
"10032065-24-サオリ" = "それに先生は、なぜさっきから便利屋68と一緒に居るんだ？"
"10032065-25-サオリ" = "BDはどうなった？"
"10032065-26-カヨコ" = "……冗談なのかしら？それとも本気で？"
"10032065-27-カヨコ" = "たぶん、あっちはあっちで感覚がズレてるんだと思う……"
"10032065-28-サオリ" = "……ふむ。"
"10032065-29-サオリ" = "今はBDよりも優先するべきことができた、と……？#nそれはどういう……"
"10032065-30-サオリ" = "……！"
"10032065-31-サオリ" = "ちょうどいいタイミングだ。"
"10032065-32-アル" = "な、なに！？黒い車が次々と……！"
"10032065-33-ムツキ" = "すっごい数だね？"
"10032065-34-カヨコ" = "……遅かったか。"
"10032065-35-ハルカ" = "わ、私が全部……！"
"10032065-36-カヨコ" = "待って、ハルカ。まずは様子を見よう。"
"10032065-37-カヨコ" = "たぶん、ボスの救出に来た主力……流石に数が多すぎる。"
"10032065-38-サオリ" = "みんな、よく来てくれた。依頼人はここに……"
"10032065-39-サオリ" = "動くな！すでに包囲されてる！！"
"10032065-40-サオリ" = "命が惜しけりゃ、大人しくボスを返せ！"
"10032065-41-サオリ" = "……なん、だと？"
"10032065-42" = "[ns5] \"サオリを囲んだ……？\"\n[ns6] \"どうしてサオリに銃口を……？\""
"10032065-43-サオリ" = "何か誤解があるようだな。"
"10032065-44-サオリ" = "私はお前たちの敵ではない。"
"10032065-45-サオリ" = "こうして依頼人を連れてきたじゃないか。"
"10032065-46-サオリ" = "依頼人……？誰だ？何の話をしている！！"
"10032065-47-サオリ" = "誰って、それは……"
"10032065-48-サオリ" = "……この人だが？"
"10032065-49-サオリ" = "自分を護衛し、安全な場所まで連れて行くよう命じられた。"
"10032065-50-サオリ" = "…………？"
"10032065-51-サオリ" = "な……"
"10032065-52-ギャングの組織員A" = "何をバカみたいなこと言ってんだ！！そう言われて信じろと！？"
"10032065-53-サオリ" = "……？"
"10032065-54-サオリ" = "……ああ、その通りだ。"
"10032065-55-ギャングの組織員A" = "バカにするのも大概にしろ！"
"10032065-56-ギャングの組織員A" = "嘘にも限度ってモンがあってだな！！"
"10032065-57-サオリ" = "どうしてこうなった……"
"10032065-58-サオリ" = "私は誰もバカになどしていない。"
"10032065-59-サオリ" = "そもそも、こちらの世界で私はまだ新人だ。#nベテランのお前たちをバカになどするわけないだろう？"
"10032065-60-ギャングの組織員A" = "あいつ、さっきから何を言ってるんだ……？"
"10032065-61-ギャングの組織員A" = "うちのボスをさらっておいて、言い訳しようってか！？"
"10032065-62-サオリ" = "さらう……？どういう意味だ？"
"10032065-63-サオリ" = "これは効率的に移動するための手段だ。#nおかげで、お前たちとも合流できたじゃないか。"
"10032065-64-サオリ" = "何か問題でもあるのか？"
"10032065-65-アル" = "……本気だったみたいね。"
"10032065-66-カヨコ" = "…………。"
"10032065-67" = "[s7] \"サオリなら、そう考えてもおかしくない……かな。\"\n[s8] \"効率とは、一体……\""
"10032065-68-サオリ" = "……うむ。"
"10032065-69-サオリ" = "困ったな、疑いが晴れそうもない。"
"10032065-70-サオリ" = "こうなった以上、本人に証言してもらおう。"
"10032065-71-サオリ" = "おい、起きろ。いつまで寝てるんだ。"
"10032065-72-サオリ" = "……おい。"
"10032065-73-サオリ" = "うっ、うぅぅ……"
"10032065-74-ギャングの組織員A" = "こ、こいつ！今ボスを殴ったぞ！？"
"10032065-75-サオリ" = "……？？？"
"10032065-76-サオリ" = "いや、殴ってなどいない。起こそうとしただけだが……"
"10032065-77-ギャングの組織員A" = "もう待てねぇ！どうせ相手は一人！全員構えろ！"
"10032065-78-ギャングの組織員A" = "[ruby=や]殺[/ruby]っちまえ！！"
"10032065-79-サオリ" = "な、なぜだ！？どうしてそうなる！？"
"10032065-80-サオリ" = "……まさか！"
"10032065-81-サオリ" = "私はまた騙されたのか……！！"
"10032065-82-サオリ" = "うまく利用され、捨てられるだなんて……！！"
"10032065-83" = "[s9] \"今回はちょっと違うような……\"\n[s10] \"サオリ、その……\""
"10032065-84-アル" = "……ふぅ。"
"10032065-85-アル" = "……ハルカ。"
"10032065-86-アル" = "は、はい！アル様！！"
"10032065-87-アル" = "……戦う準備をしなさい。錠前サオリに手を貸すわよ。"
"10032065-88-ハルカ" = "は、はい！"
"10032065-89-ハルカ" = "……はい？"
"10032065-90-ムツキ" = "えっ？"
"10032065-91-ムツキ" = "アルちゃん、今なんだって？手を貸すって……？"
"10032065-92-カヨコ" = "……社長？"
"10032065-93-ムツキ" = "あれ……あの人って、敵じゃなかったんですか……？"
"10032065-94-ムツキ" = "あ、い、いえ！口答えをするつもりじゃ……！#nす、すぐに準備します！"
"10032065-95" = "[ns11] \"……アル？\"\n[ns12] \"サオリを助けてくれるの？\""
"10032065-96-アル" = "……ふんっ。助けるだなんて、語弊があるわ。"
"10032065-97-アル" = "私は、ただ依頼を遂行するだけよ。だって、絶好のチャンスじゃない？"
"10032065-98-アル" = "まずは錠前サオリに協力してあの数を何とかしてから、ボスを連れ去る。#n呉越同舟といったところかしら？"
"10032065-99-アル" = "利益のためなら、誰とでも手を組む。それがハードボイルドの世界よ。"
"10032065-100-アル" = "協力なんて無いって、さっき言ってたような気がするけどね～"
"10032065-101-アル" = "べ、別に仲間になるわけじゃないし、細かいことは気にしないで！"
"10032065-102-ムツキ" = "……それに、これはあくまでターゲットを確保するため！"
"10032065-103" = "[s13] \"……ありがとう、アル。\"\n[s14] \"やっぱり頼もしいね。\""
"10032065-104-アル" = "……ふふ、前置きが長くなったわ。"
"10032065-105-アル" = "みんな……"
"10032065-106-アル" = "今度こそ行くわよ！！"
"10032065-107-アル" = "……突撃！！"
