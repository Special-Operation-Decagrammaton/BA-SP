[translation]
"80000098-1" = "バレンタイン挑戦状"
"80000098-2-？？？" = "……あ！先生～！！"
"80000098-3" = "[s1] \"……この音は！\"\n[s2] 落ち着いて受け止める構えをとる。"
"80000098-4-？？？" = "とりゃあーーーっ！！"
"80000098-5" = "（その直後、レイサが突っ込んできたが、慣れたものでうまく受け止められた）"
"80000098-6-レイサ" = "来てくださったんですね、先生！待っていました！"
"80000098-7-レイサ" = "先生もご存知かと思いますが！#n今日は先生にチョコレートを差し上げる、恩返しの日！"
"80000098-8-レイサ" = "でも、私は分かっています。今日の先生は、とても忙しいと！#n先生に会いたいのは、私だけじゃないでしょうから！"
"80000098-9-レイサ" = "なので速やかに！先生の時間を奪いすぎてしまわないよう！"
"80000098-10-レイサ" = "さっそく、こちらをどうぞ！"
"80000098-11" = "[ns3] \"挑戦状？……いや、違う！\"\n[ns4] \"チョコレート、だよね……？\""
"80000098-12-レイサ" = "ふ・ふ・ふ～！仰る通り！挑戦状の形をしたチョコレートです！"
"80000098-13-レイサ" = "といっても市販品に少し手を加えただけですが……"
"80000098-14-レイサ" = "で、でも挑戦状にはなっていて……"
"80000098-15" = "[ns5] \"あれ、すごく長いような……\"\n[ns6] \"挑戦状というか……これ、手紙……？\""
"80000098-16-レイサ" = "……！！"
"80000098-17-レイサ" = "わああああああっー！！！"
"80000098-18-レイサ" = "ダ、ダメです！先生、ストップ！！#n今ここで読んでどうするんですか！？"
"80000098-19-レイサ" = "は、はい！？挑戦状って、すぐに確認するものじゃなかったのかって？#nそれは……そうかもしれませんが……！"
"80000098-20-レイサ" = "と、とにかくダメです！今はダメなんです！！#n帰ってから！一人のときに読んでください！絶対ですよ！！"
"80000098-21-レイサ" = "う、ううぅ……"
"80000098-22-レイサ" = "い、今さらですけど……"
"80000098-23-レイサ" = "市販品に手を加えただけのものよりも……"
"80000098-24-レイサ" = "やっぱり、手作りの方が嬉しかったりします……？"
"80000098-25-レイサ" = "私は器用じゃないですし、お菓子作りもあまり詳しくないので、今回はこうなってしまいましたが……"
"80000098-26-レイサ" = "……ごめんなさい。#nやっぱり、先生の時間を無為に奪ってしまいましたね……"
"80000098-27-レイサ" = "……はい？"
"80000098-28-レイサ" = "そうじゃない？むしろ、嬉しかった……？#nど、どうしてですか……？"
"80000098-29" = "[s7] \"レイサが勇気を出してくれたから。\"\n[s8] \"レイサにもらえたのが嬉しいんだよ。\""
"80000098-30-レイサ" = "……！"
"80000098-31-レイサ" = "……えへ。"
"80000098-32-レイサ" = "……えへへ。"
"80000098-33" = "（その後、一緒にチョコレートを食べてから、帰ってレイサの「挑戦状」を読んだ）"
"80000098-34" = "（それは、いろんなステッカーやペンで彩られた、世界で一番可愛い「挑戦状」だった）"
