[translation]
"10032050-1" = "第5話;手慣れてそうで不器用に"
"10032050-2-サオリ" = "便利屋68……"
"10032050-3-カヨコ" = "……[ruby=じょうまえ]錠前[/ruby]サオリ。"
"10032050-4-カヨコ" = "切り札って、まさか……"
"10032050-5-カヨコ" = "……はぁ。"
"10032050-6-カヨコ" = "本当にややこしくなったね、社長。"
"10032050-7-アル" = "……誰？"
"10032050-8-カヨコ" = "誰って……錠前サオリでしょ。"
"10032050-9-カヨコ" = "アリウス出身の傭兵。"
"10032050-10-カヨコ" = "前にも戦ったことあるけど、もう忘れたの？"
"10032050-11-アル" = "じょうまえ、さおり……？"
"10032050-12-アル" = "……っ！"
"10032050-13-アル" = "じょ、錠前サオリ！？以前、私たちのお金を踏み倒した奴と戦ってた時に怪しいヘルメットを被ってたあの……！？"
"10032050-14-アル" = "うん、そうだよ。ハルカちゃんが挨拶って言って、派手にやらかした時の！"
"10032050-15-アル" = "え！？雰囲気とか全然違うけど！？完全に別人じゃない！！"
"10032050-16-ムツキ" = "くふふ！#nそれを言うなら私たちもじゃない～？"
"10032050-17-ムツキ" = "お互いドレス姿なんだし～別にいいじゃん～！"
"10032050-18-サオリ" = "よりによって、お前たちだなんて……"
"10032050-19-サオリ" = "だが、こうなった以上は全力で行かせてもらうぞ！"
"10032050-20-カヨコ" = "聞いた？アルちゃん、全力だって。"
"10032050-21-アル" = "なんで！？！？"
"10032050-22-カヨコ" = "あっちも仕事だからでしょ。"
"10032050-23-サオリ" = "……ん？"
"10032050-24-サオリ" = "待て、そこに居るのは……"
"10032050-25" = "[s1] \"サオリ、よく似合ってるね。\"\n[s2] \"今日はここで何をしてるの？\""
"10032050-26-サオリ" = "……なっ。"
"10032050-27-サオリ" = "……先生？"
"10032050-28-サオリ" = "…………？"
"10032050-29-サオリ" = "…………！？！？！？"
"10032050-30-サオリ" = "ど、どうして先生がここに……！？"
"10032050-31-サオリ" = "……え？"
"10032050-32-サオリ" = "わ、私か……？"
"10032050-33-サオリ" = "私は、もちろん仕事で来た……"
"10032050-34-サオリ" = "ここで待機して、有事の際は護衛するよう命令された。"
"10032050-35-サオリ" = "会場で浮かないよう、ドレスまで用意されていてだな……"
"10032050-36-サオリ" = "…………ドレス。"
"10032050-37-サオリ" = "はっ！こ、これは違う！私のものじゃない！"
"10032050-38-サオリ" = "作戦上、必要だからと与えられたもので……！"
"10032050-39-サオリ" = "たしかにデザインは私が選んだが……！#nあくまで仕事のため……！"
"10032050-40-サオリ" = "自分の好みとか、そういうのでは……！#nいや、まぁ……多少は気に入っているが……！"
"10032050-41-サオリ" = "ちちち違う！これは、そう……ドレスコードだ！"
"10032050-42-ムツキ" = "……急になんか、挙動不審になってるけど。"
"10032050-43-カヨコ" = "そうだね。ちょっとイメージと違うような……"
"10032050-44-カヨコ" = "あんな人だったっけ……"
"10032050-45-サオリ" = "そ、そういう先生こそ、どうしてここに……！？"
"10032050-46-サオリ" = "……え？"
"10032050-47-サオリ" = "教材用のBDを作りに来た、だと？連邦生徒会から頼まれて？"
"10032050-48-サオリ" = "そうか……先生も仕事で来ているのか。"
"10032050-49-サオリ" = "ふむ、お互い大変だな。"
"10032050-50-サオリ" = "おい！何ニヤニヤしながら会話なんかしてんだ！？"
"10032050-51-サオリ" = "いいからさっさと私を安全な場所まで案内しろっ！！"
"10032050-52-サオリ" = "ああ……すまない。つい、うっかりしていた。"
"10032050-53-サオリ" = "というわけで、悪いが先生……"
"10032050-54-サオリ" = "……仕事に戻らせてもらう。"
"10032050-55-サオリ" = "依頼人の避難が済んだら、また連絡するとしよう。それじゃ……"
"10032050-56-ドン·アランチーノ" = "……！"
"10032050-57-ドン·アランチーノ" = "…………！"
"10032050-58-？？？" = "なに、なに？まさかこのまま逃げるつもり？"
"10032050-59-？？？" = "そんなのって寂しくない？"
"10032050-60-ムツキ" = "先生とだけ話して、こっちはシカトするわけ？"
"10032050-61-ムツキ" = "ひどいなぁ～私たちだって話たいこと、た～くさんあるのに。"
"10032050-62-ムツキ" = "他でもない……"
"10032050-63-ムツキ" = "私たちの間柄でね。"
"10032050-64-サオリ" = "便利屋68……"
"10032050-65-サオリ" = "今、お前たちと戦う気は無い。"
"10032050-66-カヨコ" = "それはこっちの台詞だね。"
"10032050-67-カヨコ" = "一つ提案しよう。"
"10032050-68-カヨコ" = "依頼人を置いて行きなさい。そうすれば、私たちも大人しくする。"
"10032050-69-サオリ" = "そう来るか……"
"10032050-70-サオリ" = "……残念だが、その提案は受け入れられない。"
"10032050-71-サオリ" = "こちらも信頼で仕事を請け負っているからな。"
"10032050-72-サオリ" = "与えられた仕事は、何があっても遂行する。そうでなければ次の仕事に繋がらないからな。"
"10032050-73-アル" = "…………。"
"10032050-74-アル" = "カ……"
"10032050-75-アル" = "カッコいい……"
"10032050-76-アル" = "感心してどうするのよ、社長。"
"10032050-77" = "[s3] \"アルの気持ちも分かるよ。\"\n[s4] \"たしかに、カッコいいよね。\""
"10032050-78-ムツキ" = "あ～あ、残念。仕事だから譲れないのは、こっちだって一緒なのにさ～"
"10032050-79-ムツキ" = "交渉が決裂したなら……"
"10032050-80-ハルカ" = "うあああああぁぁぁぁぁ！！！"
"10032050-81-ムツキ" = "……最後までやるしかないよねっ。"
"10032050-82-サオリ" = "……やはり、こうなってしまうのか。"
"10032050-83-サオリ" = "ここは私が食い止めるから、早く走れ。"
"10032050-84-サオリ" = "走れ、だと……？"
"10032050-85-ドン·アランチーノ" = "……私に命令するのか？"
"10032050-86-サオリ" = "依頼主はあなただからな。さあ、走れ。"
"10032050-87-サオリ" = "……早く！！"
"10032050-88-ドン·アランチーノ" = "……！！！！"
"10032050-89-ムツキ" = "逃すかっ～！"
"10032050-90-アル" = "は、ハルカ、もう大丈夫なの？怪我とか……"
"10032050-91-カヨコ" = "アル様の計画を邪魔するなぁぁぁぁぁ！！！"
"10032050-92-カヨコ" = "……大丈夫みたいね。"
