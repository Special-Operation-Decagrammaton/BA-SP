[translation]
"10032060-1" = "第6話;とんでもない誤解"
"10032060-2-カヨコ" = "……こっち。"
"10032060-3-カヨコ" = "おかしいね、さっきよりも速くなってる。#nあの依頼人を連れて、こんなに早く移動できるなんて……"
"10032060-4-ムツキ" = "何か手を打ったようね。まあ、他でもな[ruby=じょうまえ]い錠前サ[/ruby]オリなんだし……"
"10032060-5-カヨコ" = "それより……"
"10032060-6-カヨコ" = "この道は、地下の駐車場に繋がっているはず……"
"10032060-7-カヨコ" = "……部下と合流して脱出される前に追いつかないと。"
"10032060-8-カヨコ" = "やたらと人が倒れているけれど……仲間割れでもしたのかしら？"
"10032060-9-カヨコ" = "いや、たぶん錠前サオリにやられたんだと思う。"
"10032060-10-アル" = "なるほど、流石だわ……"
"10032060-11-アル" = "……え？"
"10032060-12-アル" = "一人で？これだけの人数を？"
"10032060-13" = "[s1] \"まあ、サオリだからね……\"\n[s2] \"こういう場所で戦うのには慣れてるからかな。\""
"10032060-14-アル" = "……結構詳しいんだね、先生。"
"10032060-15-カヨコ" = "まさか、こっち方面の知り合いが居たなんて……いや、先生なら不思議じゃないか。"
"10032060-16-カヨコ" = "……でも、やっぱり困らせたよね。"
"10032060-17-カヨコ" = "先生の立ち場的に、どっちの味方をするわけにもいかないでしょ。#n今からでも帰るのはどう？私たちのことはいいから。"
"10032060-18-カヨコ" = "……うん？"
"10032060-19-カヨコ" = "そうはいかないって、どうして……"
"10032060-20" = "[s3] \"騒ぎが大きくなる前に防がないと。\"\n[s4] \"もし誰かが巻き込まれたら大変だからね。\""
"10032060-21-ムツキ" = "いや～まさに先生らしい答えだね！"
"10032060-22-ムツキ" = "まぁ……そうだよね。"
"10032060-23-カヨコ" = "もうすぐ駐車場に着くよ、急ごう。"
"10032060-24-カヨコ" = "ドン・アランチーノに脱出された時点で、錠前サオリの勝ちだから。"
"10032060-25-ムツキ" = "その前にこっちの手に渡れば、私たちの勝ちだけどね！！"
"10032060-26-ハルカ" = "わ、私も頑張ります！！"
"10032060-27" = "[ns5] \"……アル？\"\n[ns6] \"どうしたの？何か考え事？\""
"10032060-28-アル" = "う、ううん！？"
"10032060-29-アル" = "えっと……ただ、このままでいいのか心配で……"
"10032060-30-アル" = "その、先生は……"
"10032060-31-アル" = "BDを作るはずだったのに……"
"10032060-32" = "[ns7] \"……BD？\"\n[ns8] \"……あっ。\""
"10032060-33-アル" = "これじゃあ、本来の目的を達成できないでしょう……？"
"10032060-34-アル" = "先生には先生の仕事があったのに、私たちのせいで……"
"10032060-35-アル" = "案内役をするつもりが、こちらの仕事に巻き込んじゃって……"
"10032060-36-アル" = "…………そ、それだけよ！"
"10032060-37-アル" = "でも、そうね！先生はうちの経営顧問なんだから！"
"10032060-38-アル" = "……え？"
"10032060-39-アル" = "BDのことは気にしなくていいって？#nでも、大切な仕事なんじゃ……"
"10032060-40" = "[s9] \"これも私にとって大切な仕事だから。\"\n[s10] \"それに私は、アルたちの経営顧問なんでしょ？\""
"10032060-41-アル" = "…………。"
"10032060-42-アル" = "……先生。"
"10032060-43-アル" = "ふ、ふふっ……気に入ったわ。"
"10032060-44-アル" = "そこまで言ってくれるのなら、もう何も遠慮する必要は無いわね。"
"10032060-45-アル" = "でも、心配無用よ。便利屋68は、受けた恩を何があっても返すのが信条。"
"10032060-46-アル" = "この恩は、いつか必ず……便利屋の名にかけて！"
"10032060-47-アル" = "さあ、先生！もうすぐ駐車場に着くわよ！！"
