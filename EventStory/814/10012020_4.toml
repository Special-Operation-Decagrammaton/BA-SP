"10012020-105-ジャブジャブヘルメット団A" = "……あっ！"
"10012020-106-セリカ" = "……えっ？"
"10012020-107-ジャブジャブヘルメット団B" = "ここだ！ヤツらがこっちにいるぞ！！"
"10012020-108-ジャブジャブヘルメット団B" = "隊長、ここです！ヤツらを見つけました！！"
