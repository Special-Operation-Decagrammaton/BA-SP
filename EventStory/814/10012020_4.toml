[translation]
"10012020-1" = "第2話;もう少しそれっぽい言い訳を"
"10012020-2-ジャブジャブヘルメット団A" = "……えっ！？な、何の音？"
"10012020-3-ジャブジャブヘルメット団B" = "何かが墜落した音に聞こえたけど……。ヘリ？飛行機？"
"10012020-4-？？？" = "……とりあえず、自然の音ではないわね。"
"10012020-5-？？？" = "人為的な音がするって事は、人がいるって事よ。"
"10012020-6-ジャブジャブヘルメット団A" = "……ラブ隊長！？"
"10012020-7-ラブ" = "うふふ……面白い流れになってきたわね。"
"10012020-8-ラブ" = "まだ誰も見つけてないポイントだと思ってたのに……他にライバルがいたなんてね。"
"10012020-9-ラブ" = "今回の「リゾート狩り」は……面白くなりそう。"
"10012020-10-ラブ" = "うちらジャブジャブヘルメット団のターゲットに近づくネズミは……"
"10012020-11-ラブ" = "文字通り……。"
"10012020-12-ラブ" = "ひどい目に遭わせてやるわよ！"
"10012020-13-セリカ" = "うう……油断した……。"
"10012020-14-セリカ" = "ちょっとよそ見した間にいなくなるなんて……。"
"10012020-15" = "[s1] \"……セリカ？\"\n[s2] \"誰を探してるの？\""
"10012020-16-セリカ" = "あっ、先生！ちょうど良かった。ホシノ先輩見なかった？"
"10012020-17-セリカ" = "あっ、先生！ちょうど良かった。ホシノ先輩見なかった？"
"10012020-18-セリカ" = "アヤネちゃんと先輩たちがヘリに物を取りに行ってる間、二人でちょっとこの辺を片付けようと思ったんだけど……。"
"10012020-19" = "[s3] \"かくれんぼでもしてるのかな。\"\n[s4] \"ホシノを探してくればいいんだね、任せて！\""
"10012020-20-セリカ" = "何でちょっと楽しそうなの……。"
"10012020-21-セリカ" = "うん。ちょっとお願い、先生。私はまだ片付けが残ってるから。"
"10012020-22-セリカ" = "そんなに遠くには行ってないはずだけど……もしかしたらこの建物のどこかにいるかも。"
"10012020-23-セリカ" = "あ！あと、先輩を見つけたら必ず私に連絡してね。"
"10012020-24-セリカ" = "ホシノ先輩に頼まれたからって、代わりに片付けとかしないでよ！"
"10012020-25-セリカ" = "分かった？ホシノ先輩を見つけたら私に連絡！約束だからね！！"
"10012020-26" = "（その後、ホシノを探しに建物の中を一周してみた）"
"10012020-27" = "（一度歩いたところだったから、それほど道に迷わなかった）"
"10012020-28" = "（……？）"
"10012020-29-ホシノ" = "……ありゃ、先生。どうしてここに？"
"10012020-30" = "[s5] \"……ホシノ？\"\n[s6] \"ホシノを探してたんだ。\""
"10012020-31-ホシノ" = "えっ……おじさんを探してたの？"
"10012020-32-ホシノ" = "何かおじさんに用事でもあった？"
"10012020-33-ホシノ" = "あー……セリカちゃんに何も言わなかったもんね、ごめんごめん。"
"10012020-34-ホシノ" = "うへ～……おじさん、掃除道具を探してたらこんなとこまで来ちゃってさ。"
"10012020-35-ホシノ" = "見えるとこにいないからって、サボってると思われるなんて……おじさん、ちょっと傷ついちゃったぞ。"
"10012020-36-ホシノ" = "それに、セリカちゃんがあんなに頑張ってるのに、おじさん一人サボるなんてできると思う？"
"10012020-37-ホシノ" = "普段の行い……？"
"10012020-38-ホシノ" = "うへ～……その部分をちょっとこう、なんとか……ね？"
"10012020-39-ホシノ" = "……うん？"
"10012020-40-ホシノ" = "ああ、さっきまで見てたもの？"
"10012020-41-ホシノ" = "……相変わらず鋭いねぇ、先生は。"
"10012020-42-ホシノ" = "まあ、ここには後輩たちもいないし……先生だから、まあいっか。"
"10012020-43-ホシノ" = "なんだかちょっと、気になることがあってね。"
"10012020-44" = "[ns7] \"昔のお祭りのポスター……だね。\"\n[ns8] \"アビドスにも似たようなものがあったよね。\""
"10012020-45-ホシノ" = "……うへ。"
"10012020-46-ホシノ" = "……うへ。"
"10012020-47" = "[s] \"……ホシノ。\""
"10012020-48-ホシノ" = "……みんなには言わないでね。"
"10012020-49-ホシノ" = "せっかくの休暇なのに、余計なことを気にしちゃったら、楽しめなくなっちゃうからさ。"
"10012020-50-ホシノ" = "ここまで来て楽しめないなんて、そんなの悲しいじゃん。こういうのはおじさんの領分ってわけ。"
"10012020-51" = "[s] \"……。\""
"10012020-52-ホシノ" = "……だから、そんな顔しないでってば。"
"10012020-53-ホシノ" = "大丈夫だからさ……おじさんにどーんと任せておいてよ。ね？"
"10012020-54" = "[s9] \"……とりあえず一緒に整理しようか。\"\n[s10] \"せっかくだし、ここも掃除しよっか。\""
"10012020-55-ホシノ" = "うへ……。"
"10012020-56-ホシノ" = "うへ……。"
"10012020-57-ホシノ" = "嬉しいけど、わざわざそこまでしなくていいのに。"
"10012020-58-ホシノ" = "ここは端っこの部屋だし、片付けるならセリカちゃんがいる方にしようよ。"
"10012020-59-ホシノ" = "……………………。"
"10012020-60-ホシノ" = "うう……分かったよ先生。いいよ、一緒にやろう。"
"10012020-61-ホシノ" = "も～、おじさんは先生にそうやって見つめられるのが一番困るんだよ～"
"10012020-62-ホシノ" = "そしたら掃除道具を持ってきてもらおうかな。私は先に片付けてるから。"
"10012020-63-ホシノ" = "……逃げないから、心配しないで。"
"10012020-64" = "[s] 掃除道具を取ってくる。"
"10012020-65" = "（その後、ホシノと一緒に周辺を掃除した）"
"10012020-66" = "（まるでリゾートが運営されているかのような、キレイな室内になった）"
"10012020-67-ホシノ" = "へえ……こんな広いところでも、二人でなんとか掃除できるもんだねぇ。"
"10012020-68-ホシノ" = "先生もお疲れ様。手伝ってくれてありがとね～"
"10012020-69" = "[s11] \"気にしないで。大したことないから。\"\n[s12] \"ホシノ掃除得意なんだね。\""
"10012020-70-ホシノ" = "……いつもそんな風に引き受けちゃうと、どこまでもお願いしちゃうよ？"
"10012020-71-ホシノ" = "……いつもそんな風に引き受けちゃうと、どこまでもお願いしちゃうよ？"
"10012020-72-ホシノ" = "うへ……でも、どこか気分がいい感じ。"
"10012020-73-ホシノ" = "……うん、そうだね。"
"10012020-74-ホシノ" = "アビドスとは違って、片付ければちゃんと……"
"10012020-75-？？？" = "見つけた！！ここにいたのね、先輩！！"
"10012020-76-ホシノ" = "……う、うん？"
"10012020-77-ホシノ" = "人がちょっとよそ見してる間にこんなところに！"
"10012020-78-セリカ" = "私一人で片付けながら探すの、どれだけ大変だったと……！たまには先輩も……"
"10012020-79-セリカ" = "掃除……を……って"
"10012020-80-セリカ" = "……え？"
"10012020-81-セリカ" = "すっごく綺麗に掃除されてる……？"
"10012020-82" = "[s13] \"ほとんどホシノがやってたよ。\"\n[s14] \"私はちょっと手伝っただけだよ。\""
"10012020-83-セリカ" = "ほ、本当に……？ホシノ先輩が……？"
"10012020-84-セリカ" = "ほ、本当に……？ホシノ先輩が……？"
"10012020-85-ホシノ" = "ふっふっふ。セリカちゃんが驚いた顔も可愛いねぇ～"
"10012020-86-セリカ" = "ホシノ先輩……。"
"10012020-87-ホシノ" = "うへへ……そんなに喜んでくれるなんて……ちょっと照れるね。"
"10012020-88-ホシノ" = "どうだい、セリカちゃん……おじさんのこと、見直したかな？"
"10012020-89-ホシノ" = "先輩……あんまり掃除得意じゃないのかなって思ってたけど……"
"10012020-90-セリカ" = "こんなにできるなら……どうして……"
"10012020-91-セリカ" = "どうして……今まで、真面目にやってくれなかったの……？"
"10012020-92-ホシノ" = "……え？"
"10012020-93-ホシノ" = "あれ、えっ……。"
"10012020-94-ホシノ" = "待って……先生……もしかして今、おじさんちょっとピンチだったり……？"
"10012020-95" = "[s15] \"……自業自得かも。\"\n[s16] \"頑張れ、ホシノ\""
"10012020-96-ホシノ" = "ええっ！？ここまで来ておじさんを裏切るの……！？"
"10012020-97-ホシノ" = "ええっ！？ここまで来ておじさんを裏切るの……！？"
"10012020-98-ホシノ" = "自業自得よ、ホシノ先輩。"
"10012020-99-セリカ" = "ちょっとこっちに来て話をするわよ！"
"10012020-100-セリカ" = "……え？"
"10012020-101-ホシノ" = "……ありゃ、誰か来たのかな？"
"10012020-102-セリカ" = "先輩たちかな。ちょうど良かった！"
"10012020-103-セリカ" = "みんな聞いて、ホシノ先輩が……"
