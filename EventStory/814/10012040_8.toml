"10012040-10-ワカモ" = "ちょっと、聞いてんの？ねえ、ワカモってば！！"
"10012040-11-ラブ" = "先生がそのような下劣な派閥争いに加担するなんてありえません……ということは……。"
"10012040-12-ワカモ" = "まさか……先生は……誘拐されて……？"
"10012040-13-ラブ" = "ちょっと！なに一人でブツブツ呟いてんのさ……人の話聞いてる！？"
"10012040-14-ワカモ" = "……！！！"
"10012040-15-ワカモ" = "……ええ、ええ！お優しい先生のことです。悪い狐に騙されてしまったのですね……！"
"10012040-16-ワカモ" = "……ワカモ！！"
"10012040-17-ワカモ" = "……ければ……。"
