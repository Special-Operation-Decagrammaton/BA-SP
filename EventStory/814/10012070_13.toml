"10012070-18-ホシノ" = "あはは、役割交代ってことだよ。"
"10012070-19-ホシノ" = "先生が寝てる間私が見張ってたからね、今度は先生の番。"
"10012070-20-ホシノ" = "おじさんは今からちょっと一眠りするからさ。"
"10012070-21-ホシノ" = "うへ……もう少ししたらみんなのとこに行くってことで、どうかな？"
"10012070-22-ホシノ" = "その前にみんなが来そうなときは、先に起こしてね……約束だよ、先生～"
"10012070-23-ホシノ" = "……zzz。"
