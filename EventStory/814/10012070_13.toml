"10012070-77-アヤネ" = "まだ完全に直ったとは言えないですが……"
"10012070-78-アヤネ" = "少なくとも試してみる価値はあると思います！"
"10012070-79-シロコ" = "……えっと、アヤネちゃん？試すって、何を……。"
"10012070-80-ノノミ" = "……なるほど～☆"
"10012070-81-ノノミ" = "そういえば、私たちほとんど修理終わってましたよね？"
"10012070-82-シロコ" = "ん、良い判断。"
"10012070-83-シロコ" = "うんうん！アヤネちゃんが朝早くから修理してくれてたおかげで、もうほとんど終わってますし。"
"10012070-84-ノノミ" = "これなら追いつくことも簡単です！"
"10012070-85-ノノミ" = "ちょうど格納庫には使える武器も多かったですし……。"
"10012070-86-ノノミ" = "修理ついでに……ちょっとだけ、手を加えてみましょうか？"
