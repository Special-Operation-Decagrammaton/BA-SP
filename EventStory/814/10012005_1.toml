"10012005-19-ホシノ" = "ま、まぁまぁ、話し終わるのを待ってあげようよ……せっかくアヤネちゃんがみんなを集めたんだし、ね？"
"10012005-20-ノノミ" = "うんうん！大型備品がどうしたんですか？アヤネちゃん！"
