[translation]
"10012015-1-セリカ" = "あいたたた……。"
"10012015-2-セリカ" = "みんな大丈夫？怪我はない？"
"10012015-3-シロコ" = "うん……アヤネも無事。"
"10012015-4-アヤネ" = "あ、ありがとうございます、シロコ先輩。"
"10012015-5-セリカ" = "せ、先生……！？先生は大丈夫なの！？"
"10012015-6-ノノミ" = "よいしょっと……みなさん無事ですよ～"
"10012015-7-ホシノ" = "うへ～……もう着いたの？起こし方が乱暴じゃない～？"
"10012015-8-アヤネ" = "ノノミ先輩！ホシノ先輩！"
"10012015-9" = "[s1] \"ありがとう。皆のおかげで無事だよ。\"\n[s2] \"心配してくれてありがとう、セリカ\""
"10012015-10-ノノミ" = "ふふっ、どういたしまして～"
"10012015-11-セリカ" = "なっ！だ、誰が心配なんか……！ただ聞いただけよ！"
"10012015-12-ホシノ" = "みんな無事でよかった。誰か怪我でもしてたら、おじさん泣いてたよ～。"
"10012015-13-シロコ" = "……幸い、水着も無事だった。"
"10012015-14-シロコ" = "この状況で気にするポイントそこ！？"
"10012015-15-セリカ" = "い、いやまぁ。着替え持ってきてないから、破れたら困るけど……。"
"10012015-16" = "[s3] \"せっかくの水着が汚れなくてよかった。\"\n[s4] \"怪我がなくてよかった。\""
"10012015-17-シロコ" = "……本当？"
"10012015-18-シロコ" = "……本当？"
"10012015-19-セリカ" = "も、もう！すぐそういう事言う……。"
"10012015-20" = "[ns] \"……アヤネ？\""
"10012015-21-アヤネ" = "な、何でもありません……！怪我人がいなくてよかったです。"
"10012015-22-アヤネ" = "とりあえず、目的の島には着きましたね。"
"10012015-23-アヤネ" = "ただ、乗ってきたヘリは……"
"10012015-24-アヤネ" = "……ん。これはしばらく乗れそうにないね。"
"10012015-25-シロコ" = "修理すれば動かせるだろうけど……時間が必要。"
"10012015-26-シロコ" = "すみません。私がもう少しうまく運転できていたら……"
"10012015-27-セリカ" = "運転とは関係なく急に壊れたんだから、アヤネちゃんが謝ることじゃないわよ。"
"10012015-28-セリカ" = "出発前の整備の時だって異常がないか何度も点検したし……"
"10012015-29-セリカ" = "それなのに急に壊れちゃったんだから……こんなの、誰の責任でもないわよ！"
"10012015-30-セリカ" = "もし責任があるとしたら売ったやつらよ。だからアヤネちゃんが気にすることじゃないわ。"
"10012015-31-アヤネ" = "そ、それは……。"
"10012015-32" = "[s5] \"セリカの言う通り、アヤネのせいじゃないよ。\"\n[s6] \"まずはリゾートへ行こう。もしかしたら修理する方法があるかもしれないし。\""
"10012015-33-アヤネ" = "先生まで……ありがとうございます。"
"10012015-34-アヤネ" = "先生まで……ありがとうございます。"
"10012015-35-アヤネ" = "リゾートに行けば……何か、方法が見つかりますよね？"
"10012015-36-ノノミ" = "うんうん！急がば回れ！です。"
"10012015-37-ノノミ" = "パンフレットによれば、ものすごくリッチで大きなリゾートらしいので、部品や整備できる人もいるかもしれません。"
"10012015-38-ノノミ" = "……先生は大丈夫？さっきちょっとふらついてたけど……。"
"10012015-39" = "[s] \"大丈夫、心配しないで。\""
"10012015-40-ホシノ" = "……みんなたくましく育ったねぇ。おじさんは嬉しいよ。"
"10012015-41-ホシノ" = "ところで、せっかくの空気に水を差すようで悪いんだけどさ……。"
"10012015-42-ホシノ" = "その……みんなが言ってる「ものすごくリッチで大きなリゾート」って……"
"10012015-43-ホシノ" = "あれのこと……？"
"10012015-44-セリカ" = "何よあれーーーー！？！？！？"
"10012015-45-セリカ" = "こ、これ何？本当にここで合ってるの？"
"10012015-46-セリカ" = "ここも……。"
"10012015-47-セリカ" = "ここも……！！"
"10012015-48-セリカ" = "……全部、ただの廃墟じゃない！人っ子一人いないし！！"
"10012015-49-セリカ" = "ねえ、違う島に来たんじゃないの？本当にここなの？"
"10012015-50-シロコ" = "……いや。座標上、確かにここで合ってる。"
"10012015-51-シロコ" = "どうみても「リゾート」と呼ぶには無理がありますが……。"
"10012015-52-アヤネ" = "これじゃあまるで……"
"10012015-53-ホシノ" = "……あ。"
"10012015-54-ホシノ" = "うへー……そっか、そういうことかぁ。"
"10012015-55-セリカ" = "な、なに？どうしたの？何か分かったの？"
"10012015-56-セリカ" = "……えっとね、セリカちゃん。"
"10012015-57-アヤネ" = "私たちが当たったリゾート利用券……この「土地」の利用権だったみたい。"
"10012015-58-アヤネ" = "ほら、ここに小さく……「チケットを所有する者にリゾート地を利用する権利を与えるものとする。当該地の状態については保証いたしかねます」って……。"
"10012015-59-セリカ" = "ちょっと待って…………これって詐欺よね！？"
"10012015-60-アヤネ" = "そんな……信じらんない……"
"10012015-61-セリカ" = "景品がお金じゃなくても前向きに……いい機会だからゆっくりしようって……"
"10012015-62-セリカ" = "そう思ったのに……どうしてこんな……。"
"10012015-63-セリカ" = "……悔しい、私たちが何したっていうのよ……。"
"10012015-64-アヤネ" = "セリカちゃん……。"
"10012015-65-ノノミ" = "…………。"
"10012015-66-セリカ" = "……くすん。"
"10012015-67" = "[s7] \"……まだ諦めるには早いよ。\"\n[s8] \"むしろ今からがスタートかもしれないよ。\""
"10012015-68-セリカ" = "……先生？"
"10012015-69-セリカ" = "……先生？"
"10012015-70-ノノミ" = "うんうん！先生の言う通りですよ、セリカちゃん！"
"10012015-71-ノノミ" = "想像とはちょっと違うけど、空気も水も綺麗な島に来たのは事実ですし！"
"10012015-72-ノノミ" = "遊ぶための道具は揃ってますから、思いっきりバカンスを楽しみましょう～！"
"10012015-73-ノノミ" = "ん。持ってきた備品は全部無事だったから、ヘリから取ってくればいいよ。"
"10012015-74-シロコ" = "あと、さっき倉庫とか設備を確認してきたんだけど……状態は良好だったよ。"
"10012015-75-シロコ" = "ちょっと古くて錆びてたり、ホコリを被ってるだけだし。手入れしたら全然使える。"
"10012015-76-セリカ" = "ノノミ先輩……シロコ先輩。"
"10012015-77-セリカ" = "……そうだよセリカちゃん。まだ諦めるには早いよ！"
"10012015-78-アヤネ" = "ここがリゾート地なことに変わりはないし……"
"10012015-79-アヤネ" = "ヘリもリゾートも、私たちが修理すればいいんだよ。"
"10012015-80-アヤネ" = "設備の修理は慣れっこだしね！前向きにいこうよ、セリカちゃん。"
"10012015-81-ノノミ" = "ん。設備の補修や整備は、私たちアビドス高等学校の十八番。"
"10012015-82-ノノミ" = "うんうん！この広いリゾート地と無人島が、ぜーんぶ私たちの物になったってことですよ！"
"10012015-83-ノノミ" = "どう楽しむかは、これからの私たちにかかってるんです！"
"10012015-84-ノノミ" = "アヤネちゃんの言う通り、これから最高の休暇を過ごせばいいだけですからね☆"
"10012015-85-シロコ" = "うへ……おじさんも頑張るかぁ。"
"10012015-86-セリカ" = "みんな……。"
"10012015-87" = "[s9] \"まだ泣くのは早いよ、セリカ。\"\n[s10] \"泣くのはいろいろ試した後でも遅くないよ。\""
"10012015-88-セリカ" = "……だ、誰が泣いてるって！？"
"10012015-89-セリカ" = "……ああもう、覚悟しなさいよ！！こうなったら思いっきり遊んでやる！！"
"10012015-90-セリカ" = "私は絶対に諦めないわよ！ここで「最高の休暇」を過ごしてやるんだから！！"
"10012015-91-一同" = "おーー！！"
