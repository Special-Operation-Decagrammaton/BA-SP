[translation]
"10012065-1" = "第6話;真夏の夜の夢"
"10012065-2-アヤネ" = "よいしょ……っと。"
"10012065-3-アヤネ" = "ふう、これで全部運び終わりました。"
"10012065-4-アヤネ" = "こっちも大体終わったわ。先生の方は？"
"10012065-5" = "[s1] \"こっちも全部終わったよ。\"\n[s2] \"イタタ、腰が……。\""
"10012065-6-セリカ" = "そこに置いといてくれたら、後は私がやるから。"
"10012065-7-セリカ" = "全然痛がってないじゃない……。"
"10012065-8-アヤネ" = "急にバーベキューパーティだなんて……"
"10012065-9-アヤネ" = "まだ修理も終わってないのに、こんなことしている場合でしょうか……？"
"10012065-10-ホシノ" = "大丈夫だよ、アヤネちゃん。"
"10012065-11-ホシノ" = "私たちもちょっとは休まないとね。ずっと掃除ばっかしてたらバカンスの意味がないじゃん？"
"10012065-12-ホシノ" = "せっかく海に来たんですから、記念撮影もしましょう☆遊ぶ時はちゃんと遊ばないとですよ～！"
"10012065-13-セリカ" = "……先輩たち、準備するのもバカンスのうちとかなんとか言ってなかったっけ。"
"10012065-14-ホシノ" = "あははは……。"
"10012065-15-ホシノ" = "もう終わった話は忘れようよ～"
"10012065-16-ホシノ" = "あと残ってるのって、ヘリの修理だけじゃん？その辺は明日やればいいしさ～"
"10012065-17-ホシノ" = "準備はこれで終わりです！"
"10012065-18-ノノミ" = "今からはバカンスの時間ですからね～☆"
"10012065-19-アヤネ" = "ヘリ……。"
"10012065-20-ノノミ" = "心配することないですよ、アヤネちゃん。"
"10012065-21-ノノミ" = "倉庫に部品もいっぱいありましたし、明日みんなでやれば大丈夫です。"
"10012065-22-シロコ" = "うん。修理に最低でも一日はかかるし、一気にやるなら今日じゃなくて明日からやった方がいい。"
"10012065-23-シロコ" = "それに、暗いところでの整備は危ないからね。明日頑張るために、今日はゆっくり羽を伸ばそう。"
"10012065-24-ノノミ" = "うんうん！これは全部必要な休息なんですよ！"
"10012065-25-アヤネ" = "ノノミ先輩、シロコ先輩……。"
"10012065-26-セリカ" = "……そういえばあの変なヤツら、あれからずっと見ないわね？"
"10012065-27-セリカ" = "警備システムのおかげなのかしら？"
"10012065-28-セリカ" = "もしかしたら島の外に追い出されたのかも……"
"10012065-29-アヤネ" = "あの時の警備ロボットだけでも、かなりの数いましたし。"
"10012065-30-ノノミ" = "向こうも何か移動手段あるだろうし、それに乗って帰ったんじゃないかね～"
"10012065-31-ノノミ" = "わざとではなかったんですが、酷いことをしちゃったかもですね……"
"10012065-32-ホシノ" = "最初に攻撃してきたのはあっちなんだし、気にすることないんじゃない？"
"10012065-33-セリカ" = "私たちは自分たちのリゾートを守っただけだし……"
"10012065-34-セリカ" = "……ん。先生も守った。"
"10012065-35-セリカ" = "そうそう！先生も守っ……！"
"10012065-36-シロコ" = "たのは、今は関係ないでしょ！？"
"10012065-37-セリカ" = "ああもう！荷物運んだならシート敷いて！私、準備してくるから！"
"10012065-38-アヤネ" = "あはは……じゃあ、私もセリカちゃんを手伝いに行ってきますね。"
"10012065-39-ホシノ" = "……うへ、青春だねぇ～"
"10012065-40" = "[s] \"じゃあ私たちも始めよっか。\""
"10012065-41-ホシノ" = "……うん、そうしよっか。"
"10012065-42" = "（楽しく時間を過ごしていたら、いつの間にか夜になっていた）"
"10012065-43" = "（疲れて眠っている対策委員会の子たちを置いて、夜の空気に当たりながら砂浜を散歩した）"
"10012065-44" = "（……。）"
"10012065-45-？？？" = "ここにいらっしゃったんですね、先生。"
"10012065-46" = "[s] \"……？\""
"10012065-47-ノノミ" = "……ジャーン！ノノミの登場、ですよ☆"
"10012065-48-ノノミ" = "ちょっとお姿が見えないと思って……何をされてたんですか？"
"10012065-49" = "[s3] \"風にあたりに来たんだ。\"\n[s4] \"ここが一番涼しいからね。\""
"10012065-50-ノノミ" = "そうなんですね～じゃあ、私も……。"
"10012065-51-ノノミ" = "そうなんですね～じゃあ、私も……。"
"10012065-52" = "[ns5] \"……ノノミ？\"\n[ns6] \"隣に！？\""
"10012065-53-ノノミ" = "ふふっ、私も涼みに来たんです。"
"10012065-54-ノノミ" = "ふふっ、私も涼みに来たんです。"
"10012065-55-ノノミ" = "ちょっと暑くて寝苦しかったですし……"
"10012065-56-ノノミ" = "他のみんなは、くたくたになってぐっすり寝てますよ。"
"10012065-57-ノノミ" = "シロコちゃんも、セリカちゃんも、アヤネちゃんも……。"
"10012065-58-ノノミ" = "そして……。"
"10012065-59" = "[s7] \"……ノノミ？\"\n[s8] \"どうしたの？\""
"10012065-60-ノノミ" = "いえ、大したことじゃないんです。"
"10012065-61-ノノミ" = "いえ、大したことじゃないんです。"
"10012065-62-ノノミ" = "ただ……こんな風に色んなことを忘れて遊べたのは初めてだなって。"
"10012065-63-ノノミ" = "私たちはいつも、学校のことで頭がいっぱいだったから……。"
"10012065-64-ノノミ" = "たまには、こうやって何も考えないではしゃぐのも、いいものですね。"
"10012065-65-ホシノ" = "……帰ったらまた学校の問題と向き合わなきゃいけないけど、こういう休暇も大事だよね～。"
"10012065-66-ノノミ" = "……あれ、ホシノ先輩？"
"10012065-67-ホシノ" = "どんな面白い話をしているのかな？二人っきりで。"
"10012065-68-ホシノ" = "あれ、さっきまで先輩、クジラを枕にしてお休みになってませんでしたか？"
"10012065-69-ホシノ" = "そそ。んで、今起きたの～。"
"10012065-70-ホシノ" = "うへ、私も暑くて目が覚めた……ってとこかな？"
"10012065-71-ノノミ" = "あはは……先輩でも寝苦しい時があるんですね……。"
"10012065-72-ホシノ" = "いい雰囲気だね～。おじさん、こういうの嫌いじゃないよ。久しぶりにのんびりできたよ。"
"10012065-73-ノノミ" = "先輩はいつものんびりしてますよ～？墜落するヘリの中でも眠れるくらい☆"
"10012065-74-ホシノ" = "ノノミちゃん、いつもよりちょっとツッコミが強くない～？"
"10012065-75-ホシノ" = "なになに～？他の子がいないから、ツッコミが強くなってるのか、それとも夏の海だからなのか。おじさん、ビックリしちゃった。"
"10012065-76-ノノミ" = "うーん……。"
"10012065-77-ノノミ" = "とりあえずは夏の海のせいってことで？"
"10012065-78-ホシノ" = "うーむ、悲しいねぇ。うちの繊細で可愛い後輩たちが、どうしてこんな風に育っちゃったのか……"
"10012065-79-ノノミ" = "うふふ、「繊細で可愛い」はお互い様じゃないですか？"
"10012065-80-ノノミ" = "バーベキューパーティの時も……いつもと違って、先輩は色々手伝ってくれましたしね。"
"10012065-81-ホシノ" = "な、夏の海って怖いね！？ノノミちゃ～ん！？"
"10012065-82-ホシノ" = "……ま、まぁおじさんがテキパキ手伝ってるのは珍しいかもだけどさ！雰囲気の影響なのかな！？"
"10012065-83-ホシノ" = "ああ、もしかしたらバーベキューセットの影響もあるかも……"
"10012065-84-ホシノ" = "元々はアビドス砂祭りで使うために買ったものだったからねぇ。"
"10012065-85-ノノミ" = "……先輩。"
"10012065-86-ホシノ" = "……ほら。"
"10012065-87-ホシノ" = "ノノミちゃんにそんな顔させちゃうから、こういう話はしないんだよ。"
"10012065-88-ホシノ" = "シロコちゃんも、アヤネちゃんも、セリカちゃんも同じ。"
"10012065-89-ホシノ" = "うちの可愛い後輩たちに余計な悩みを増やしたくないんだ。今でも十分頑張ってくれてるからね。"
"10012065-90-ノノミ" = "……でも、今は言いましたよね。"
"10012065-91-ホシノ" = "そりゃあ、今だから……真夏の夜の海だからさ。"
"10012065-92-ホシノ" = "だからノノミちゃんも……その顔はここだけにして、忘れようね。約束だぞ？"
"10012065-93-ノノミ" = "……はい、分かりました。約束です☆"
"10012065-94-ノノミ" = "……うん。"
"10012065-95-ノノミ" = "せっかくですし、もう少し続けましょう？"
"10012065-96-ノノミ" = "「ここだけ」のお話ですから。"
"10012065-97-ホシノ" = "うへ……続けるの？おじさん、そろそろ限界だよ～もうやめちゃダメ？"
"10012065-98-ノノミ" = "ダメです。次にいつこういう機会があるか分からないでしょう？"
"10012065-99-ノノミ" = "ね？先生。"
"10012065-100" = "[s9] \"そうだね。\"\n[s10] \"まあ、真夏の夜の海だからね。\""
"10012065-101-ホシノ" = "うへ～先生まで！！おじさんの味方はいないの～？"
"10012065-102-ホシノ" = "うへ～先生まで！！おじさんの味方はいないの～？"
"10012065-103" = "（その後、二人と夜中まで会話をしてそのまま眠った）"
