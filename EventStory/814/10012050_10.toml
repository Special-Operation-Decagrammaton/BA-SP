[translation]
"10012050-1" = "第5話;招かれざる客"
"10012050-2-アヤネ" = "……ここです。"
"10012050-3-アヤネ" = "ここがリゾートの制御室……電気、ガスをはじめとしたすべての動力源が集まっている場所ですね。"
"10012050-4-セリカ" = "やっと色々終わらせたっていうのに、今度は制御室……？"
"10012050-5-ホシノ" = "いやぁ～本当に素晴らしいバカンスだよ、セリカちゃん？"
"10012050-6-セリカ" = "何が素晴らしいバカンスよ！！いつまでたっても休めないじゃない！"
"10012050-7-アヤネ" = "まぁまぁ……動力源の確保が終わったらのんびり休めますから。"
"10012050-8-アヤネ" = "これからの「バカンス」のためにも、安全確認は大事ですよ。"
"10012050-9-アヤネ" = "……うん。設備に問題はないみたい。"
"10012050-10-シロコ" = "基盤は古いけど、破損はない。ちょっとホコリ被ってるだけ。"
"10012050-11-シロコ" = "この地図によると……"
"10012050-12-シロコ" = "格納庫兼、倉庫もあるみたい。"
"10012050-13-アヤネ" = "……格納庫がある、ということは！"
"10012050-14-ホシノ" = "ヘリの部品も見つかるかもしれないね。"
"10012050-15-ホシノ" = "良かった！これで修理ができますね☆"
"10012050-16-ホシノ" = "でも、格納庫は手動では開かないみたい。制御室で電気を確保するのが先かな。"
"10012050-17-セリカ" = "……建物の掃除から始まって、どんどん無人島開拓みたいになってるわね。"
"10012050-18-セリカ" = "まぁまぁ、細かいことは気にしない気にしない。準備するのもバカンスのうちだよ。"
"10012050-19-ホシノ" = "んじゃ、目的の場所もわかったことだし、"
"10012050-20-セリカ" = "行ってみよ～"
"10012050-21-ノノミ" = "……誰もいないみたいですね？"
"10012050-22-セリカ" = "誰かいる方が怖いでしょ……"
"10012050-23-ホシノ" = "もしかしたらさっきの連中がいるかもしれないし、警戒するに越したことはないよ～"
"10012050-24-アヤネ" = "そうですね……。"
"10012050-25-アヤネ" = "さっきの連中が先に掌握しているなら、監視システムを利用しない理由はない。"
"10012050-26-シロコ" = "だから、ここは私たちが初めて来たんだと思う。ホコリもかなり積もってるし。"
"10012050-27-アヤネ" = "これ、本当に電源入るの？"
"10012050-28-アヤネ" = "……やってみますね。"
"10012050-29-アヤネ" = "ついた！"
"10012050-30-セリカ" = "なんだ、心配して損した。結構あっさりつくのね。"
"10012050-31-ホシノ" = "電源入れるだけなら、普通押したらつくよ～"
"10012050-32-セリカ" = "わ、分かってるわよ！？って、そういう意味じゃなくて！"
"10012050-33-アヤネ" = "私も驚きました。だいぶ古い設備だから、作動しないと思ってたのに……。"
"10012050-34-アヤネ" = "保管状態が良かったからなんでしょうね……これで……"
"10012050-35-アヤネ" = "……あれ、これは一体？"
"10012050-36-アヤネ" = "「リゾート防御システム」……？"
"10012050-37-ノノミ" = "すご～い！そういうのがあるんですね！警備システムの一種でしょうか？"
"10012050-38-ホシノ" = "勝手に守ってくれるってことなのかな？うへ、すごいね。"
"10012050-39-セリカ" = "至れり尽くせりじゃない！これで安全に過ごせるわね。"
"10012050-40-セリカ" = "アヤネちゃん、早く押しちゃいなさいよ。"
"10012050-41-アヤネ" = "あ、はい……。"
"10012050-42-アヤネ" = "……ついた、んですか？"
"10012050-43-ホシノ" = "何か動き出したみたいね。"
"10012050-44-ノノミ" = "あ、モニターに監視カメラの映像が出てますよ！リゾートが一望できますね～！"
"10012050-45-ホシノ" = "これで一件落着だね～。"
"10012050-46" = "<System Message>"
"10012050-47" = "「リゾート防御システム」、"
"10012050-48" = "「リゾート防御システム」、活性化、"
"10012050-49" = "自己監視モード、ニ、入リマス。"
"10012050-50" = "<System Message>"
"10012050-51" = "スキャニング"
"10012050-52" = "スキャニング…"
"10012050-53" = "スキャニング……。"
"10012050-54-アヤネ" = "リゾート全体をスキャンしているのでしょうか……"
"10012050-55-アヤネ" = "すごい……最先端の防衛システムですね。"
"10012050-56-ホシノ" = "カイザーにもこういうのあったよね～"
"10012050-57-アヤネ" = "……もしかしたら、それ以上にすごいシステムかもしれません。"
"10012050-58" = "<System Message>"
"10012050-59" = "……スキャニングヲ終了シマス。"
"10012050-60" = "<System Message>"
"10012050-61" = "リゾート内、許可サレテナイ人員、"
"10012050-62" = "ガ"
"10012050-63" = "多数、"
"10012050-64" = "多数、発見"
"10012050-65" = "多数、発見サレマシタ。"
"10012050-66-ホシノ" = "おお、なんかすごいね～"
"10012050-67-ホシノ" = "……ってあれ？「許可されてない人員」……？"
"10012050-68-ノノミ" = "あれ……。"
"10012050-69" = "<System Message>"
"10012050-70" = "逮捕ノ為、自律防犯機ヲ、"
"10012050-71" = "投入シマス。"
"10012050-72-アヤネ" = "……ま、待ってください！"
"10012050-73-アヤネ" = "眠っていた警備ロボットが動き出しました！……かなりの数います！"
"10012050-74-ホシノ" = "なんかあいつら、動きが変じゃない？これじゃあまるで……"
"10012050-75-ノノミ" = "こちらに向かってるみたい……ですね？"
"10012050-76-ホシノ" = "……あ、そういうやつか～"
"10012050-77" = "[s1] \"……やっぱりそういう流れなのね。\"\n[s2] \"まあ、私たちも別に許可されてたわけじゃないもんね。\""
"10012050-78-セリカ" = "ちょ、ちょっと何言ってるの……！？私たちにはチケットが……許可もらってるんじゃないの……？"
"10012050-79-セリカ" = "ちょ、ちょっと何言ってるの……！？私たちにはチケットが……許可もらってるんじゃないの……？"
"10012050-80-ノノミ" = "チケットはありますけど、警備プログラムの認証手続きとかしたわけじゃないですしねぇ……。"
"10012050-81-ホシノ" = "たとえチケットがあったとしても、ここは制御室だしねぇ……宿泊客が来る場所じゃないじゃん？"
"10012050-82-シロコ" = "……警備ロボットの姿が見え始めた。数十、"
"10012050-83-シロコ" = "いや、数百機以上いる！"
"10012050-84-ホシノ" = "ど、どうしよう！？これからどうするの！？"
"10012050-85-アヤネ" = "お、落ち着いてセリカちゃん。ここは制御室だよ。身元を登録すれば多分大丈夫だから！"
"10012050-86-ホシノ" = "問題はアヤネちゃんが登録してる間、あいつらからここを守り抜けるかってところだよね～"
"10012050-87-ホシノ" = "ああもう！ここに来てからこんなんばっか！！やってらんないわよ！"
"10012050-88-ノノミ" = "……先生？"
"10012050-89" = "[s3] \"うん。一緒に止めようか。\"\n[s4] \"指揮は任せて。\""
"10012050-90-シロコ" = "……来るよ。"
