[translation]
"10012010-1" = "第1話;本当に、人生何が起こるか分からない"
"10012010-2-アヤネ" = "……というのが今朝までの状況でした。"
"10012010-3-アヤネ" = "なんだか……幸運が続きすぎて怖いくらいですが。"
"10012010-4" = "[s1] \"なるほど……色んなことがあったんだね。\"\n[s2] \"すごい豪運だね！\""
"10012010-5-アヤネ" = "そ、そうですね。自分でもちょっと……未だに現実味がないです。"
"10012010-6-アヤネ" = "そ、そうですね。自分でもちょっと……未だに現実味がないです。"
"10012010-7-ホシノ" = "まぁまぁ、生きてりゃこんなこともあるよ……おじさんもちょっとビックリしちゃったけどさ。"
"10012010-8-ノノミ" = "うんうん！きっと今まで頑張ってきた分が報われたんですよ！"
"10012010-9-ノノミ" = "先生もそう思いますよね？"
"10012010-10-ノノミ" = "あ、えっとですね。今回先生をお呼びしたのは……"
"10012010-11-シロコ" = "先生は対策委員会の顧問だから。こういう時は呼ばないと、と思って。"
"10012010-12-ホシノ" = "ま、それを伝えるためだけに呼んだわけじゃないんだけどねぇ～"
"10012010-13-ホシノ" = "……実は。"
"10012010-14-アヤネ" = "セリカちゃんが当たったの、「リゾート利用券」だったんです。あはは……。"
"10012010-15-セリカ" = "わ、私だって知らなかったの！「1等」って聞いたら商品券か現金だと思うじゃない普通！"
"10012010-16-ホシノ" = "まぁまぁ。現金だったとしても借金の返済に充てられちゃうんだし、逆に良かったんじゃない？"
"10012010-17-ホシノ" = "いい機会だから、たまには思いっきり羽根を伸ばそうよ。リゾートでゆっくりできるなんて、あんまりないよ～？"
"10012010-18-ノノミ" = "そうですよ！なので、みんなでバカンスに行くことにしたんです～！"
"10012010-19-ノノミ" = "今までずっと、みんな学校のために頑張ってきたじゃないですか。たまにはこんな休暇もいいかなって☆"
"10012010-20-アヤネ" = "……はい。なので、先生にご連絡したわけです。"
"10012010-21-アヤネ" = "えっと、その……もし、先生さえよろしければ……。"
"10012010-22" = "[s3] \"一緒に連れて行ってくれるの？\"\n[s4] \"リゾート楽しみだね！\""
"10012010-23-シロコ" = "もちろん。"
"10012010-24-シロコ" = "もちろん。"
"10012010-25-シロコ" = "それに、ちょっと遠いところにあるから引率の大人がいないとね。"
"10012010-26-ホシノ" = "先生もまさか、こんな可愛い生徒たちをそのまま送り出したりしないよね？"
"10012010-27-セリカ" = "せ、先生……まさか、私たちだけで行かせたりなんかしないよね？"
"10012010-28" = "[s5] \"もちろん。よろしくね。\"\n[s6] \"もちろん！人生って何が起こるか分からないね。\""
"10012010-29-ノノミ" = "よし！それじゃあこれで決定ですね☆"
"10012010-30-ノノミ" = "よし！それじゃあこれで決定ですね☆"
"10012010-31-シロコ" = "ん。すぐに準備するね。"
"10012010-32-アヤネ" = "私もヘリを整備してきますね！"
"10012010-33-ホシノ" = "うへー、みんな忙しないね～"
"10012010-34-ホシノ" = "青春だね、青春。おじさんには眩しいや……。"
"10012010-35-ホシノ" = "ん？ああ、私も楽しみだよ。"
"10012010-36-ホシノ" = "なんてったって、リゾートだからね。"
"10012010-37-ホシノ" = "アビドスの日差しは強かったからさ～。ここみたいに「あったかい日差し」の下でダラダラできるなんて、最高じゃない？"
"10012010-38-ホシノ" = "生きてたらこんなこともあるんだねぇ……"
"10012010-39-ホシノ" = "本当に……。"
"10012010-40-ホシノ" = "人生ってのは本当、分かんないもんだね……。"
"10012010-41" = "?"
