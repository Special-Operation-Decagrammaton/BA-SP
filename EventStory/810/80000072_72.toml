[translation]
"80000072-1" = "優しい心"
"80000072-2" = "大聖堂・外郭秘密の道"
"80000072-3" = "（仕事が落ち着いてそうな時間に合わせて聖堂を訪れた）"
"80000072-4-？？？" = "ふんふん～、ふんふん～ふんふふん～～♪"
"80000072-5-？？？" = "……うん、こんなところでしょうか。#nやっぱり綺麗になると、スッキリしますね。"
"80000072-6-？？？" = "そういえば以前、こういうタイミングで先生が来て――"
"80000072-7" = "[s1] \"お疲れ様、ヒナタ。\"\n[s2] \"急に振り向かれてびっくりしたよ。\""
"80000072-8-ヒナタ" = "……せ、先生！？"
"80000072-9-ヒナタ" = "ビックリしました、まさか本当にいらっしゃるとは……！！"
"80000072-10-ヒナタ" = "も、もしかして先ほどのひとり言や鼻歌って……#nうぅ、は、恥ずかしい……！"
"80000072-11-ヒナタ" = "……？　そ、そうですかね？"
"80000072-12-ヒナタ" = "もし楽しそうに見えたとしたら、それはおそらく、……。"
"80000072-13-ヒナタ" = "い、いえ、何でもありません。ところで、今日は何かご用が……？"
"80000072-14-ヒナタ" = "……バレンタイン？"
"80000072-15-ヒナタ" = "はっ、そ、そうでした！#nいつの間に当日になって……！"
"80000072-16-ヒナタ" = "す、すみません！#n前もって準備しようと思ってたのに、聖堂の作業に夢中になって……！"
"80000072-17" = "[s3] \"ご、ごめん、せがみに来たわけじゃなくて……。\"\n[s4] \"ヒナタは本当に、いつも頑張ってて偉いね。\""
"80000072-18-ヒナタ" = "あ、ありがとうございます……。#nせっかくなので、何かプレゼントをしたかったのですが……。"
"80000072-19-ヒナタ" = "あ、ありがとうございます……。#nせっかくなので、何かプレゼントをしたかったのですが……。"
"80000072-20-ヒナタ" = "……あっ！しょ、少々お待ちください！！"
"80000072-21-ヒナタ" = "……お、お待たせしました！先生、こちらを……！"
"80000072-22" = "[ns5] \"丸いチョコ……？\"\n[ns6] \"何だか可愛らしいね？\""
"80000072-23-ヒナタ" = "は、はい。いつも、聖堂に来られる子どもたちに配っているものなのですが……。"
"80000072-24-ヒナタ" = "は、はい。いつも、聖堂に来られる子どもたちに配っているものなのですが……。"
"80000072-25-ヒナタ" = "あ、数は沢山ありますので、ご安心ください。ありあわせの物で申し訳ないのですが、せめてこれくらいはと思い、先生の好きそうな味を選んでみました……！"
"80000072-26-ヒナタ" = "……？#nあ、そ、そうですね。一応全種類食べたことはあります。#n子どもたちの好みに合わせるためにも、知っておく必要があったので。"
"80000072-27-ヒナタ" = "あまりその、普段から沢山食べるわけではないのですが……。"
"80000072-28" = "[s] \"ヒナタは本当に優しいんだね。\""
"80000072-29-ヒナタ" = "い、いえ、そんなことは！#nこれくらいは、はい……！"
"80000072-30-ヒナタ" = "そ、そういえば、先生は苦手な味とか無いでしょうか？#n何種類か選んできてしまいましたが……。"
"80000072-31-ヒナタ" = "……そ、そうですか。"
"80000072-32-ヒナタ" = "安心しました……！"
"80000072-33-ヒナタ" = "良かった……。"
"80000072-34-ヒナタ" = "……ふふっ。"
"80000072-35" = "（その後ヒナタと一緒に、チョコを分け合って美味しく頂いた）"
