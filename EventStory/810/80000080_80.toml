[translation]
"80000080-1" = "最強のチョコサウルス！"
"80000080-2" = "（バレンタインデー当日の朝）"
"80000080-3-カエデ" = "先生先生！大変だよ！"
"80000080-4" = "[s] \"おはよう、カエデ。今日も元気そうだね。\""
"80000080-5-カエデ" = "えへへ、そう？"
"80000080-6-カエデ" = "まあ、見ての通りめっちゃ元気だよ！#n朝ご飯だってたくさん食べたし！"
"80000080-7" = "[s] \"それはよかった。毎日健康で偉いね。\""
"80000080-8-カエデ" = "ふふーん……"
"80000080-9-カエデ" = "――じゃなくて！"
"80000080-10-カエデ" = "いやもちろん先生が褒めてくれるのはすごく嬉しいんだけど！"
"80000080-11-カエデ" = "今はそれどころじゃないんだってば！先生、大変だよ！"
"80000080-12" = "[s] \"何かあったの？\""
"80000080-13-カエデ" = "それがねそれがね！"
"80000080-14-カエデ" = "今朝テレビを見て知ったんだけど……"
"80000080-15-カエデ" = "今日はバレンタインデーなんだって！"
"80000080-16" = "[ns] \"う、うん。そう……だね？\""
"80000080-17-カエデ" = "ごくっ……バレンタインデーってあれだよね……？"
"80000080-18-カエデ" = "チョコレートと火薬が、甘くほろ苦いハーモニーを奏でる日……！"
"80000080-19" = "[s] \"……えっと、その話はどこから……？\""
"80000080-20-カエデ" = "ん？インターネットだよ？"
"80000080-21" = "[s] \"……今度一緒にインターネットの使い方を勉強しようね。\""
"80000080-22-カエデ" = "勉強？んんんー"
"80000080-23-カエデ" = "……まあいいよ！"
"80000080-24-カエデ" = "先生と勉強するの、面白いから！"
"80000080-25-カエデ" = "とにかくそれは置いといて――"
"80000080-26-カエデ" = "バレンタインデーって、チョコレートをプレゼントする日でもあるらしいよ！"
"80000080-27-カエデ" = "特に手作りだと最高なんだって！"
"80000080-28-カエデ" = "だから私もチョコレートを作りたかったんだけど……"
"80000080-29-カエデ" = "ミモリ先輩とツバキ先輩に「一人で火を使うのは危険だから」って#n止められちゃってね？"
"80000080-30" = "[s] \"まあ、確かにカエデ一人じゃ危ないかもね……。\""
"80000080-31-カエデ" = "でも、だからって手伝ってもらったら、私の手作りチョコレートじゃ#nなくなっちゃうでしょ？それは嫌だよ！"
"80000080-32-カエデ" = "せっかくだし、自分で作ったチョコレートを先生にプレゼントしたいもん！"
"80000080-33" = "[s] \"ありがとう。でもカエデがくれるものなら、何でも嬉しいよ？\""
"80000080-34-カエデ" = "……ほんとに？"
"80000080-35-カエデ" = "自分で作らなくても、先生は喜んでくれる……"
"80000080-36-カエデ" = "むむむむむ～……！"
"80000080-37-カエデ" = "あ！"
"80000080-38-カエデ" = "先生！いいこと思いついたよ！"
"80000080-39-カエデ" = "ちょっと待ってて！"
"80000080-40" = "[ns] \"えっ？あの……？\""
"80000080-41-カエデ" = "おっ待たせー！じゃじゃーん！"
"80000080-42" = "[s] \"これは……？\""
"80000080-43-カエデ" = "「恐竜発掘チョコレート」だよ！"
"80000080-44-カエデ" = "チョコレートでできた板の中に、恐竜の形をした#nチョコレートが隠されてるんだって！"
"80000080-45-カエデ" = "それを壊さないように掘り出す……っていうのが、#nこれの楽しみ方らしいよ！"
"80000080-46-カエデ" = "というわけで、今から私がズババっと恐竜を#n掘り出して、先生にプレゼントしてあげる！"
"80000080-47-カエデ" = "手作りチョコレートに比べたら物足りないかもしれないけど……"
"80000080-48-カエデ" = "これが私らしい方法だって思うから！"
"80000080-49" = "[s] \"カエデ……！\""
"80000080-50-カエデ" = "えへへっ、楽しみにしててね！それじゃあ始めるよ！"
"80000080-51" = "（その後、カエデの恐竜発掘チャレンジが始まった）"
"80000080-52-カエデ" = "最初はティラノサウルス！"
"80000080-53-カエデ" = "いくよ！はああっ！"
"80000080-54-カエデ" = "あああっ！？ティラノサウルスの顔が割れちゃった！"
"80000080-55-カエデ" = "つ、次だよ次！"
"80000080-56-カエデ" = "二つ目はトリケラトプス！角がすごく素敵な恐竜だよ！"
"80000080-57-カエデ" = "今度は必ず……！"
"80000080-58-カエデ" = "いざっ！！"
"80000080-59-カエデ" = "うええぇ！？トリケラトプスの胴体がーー！"
"80000080-60-カエデ" = "だ、大丈夫！まだ一つ残ってるから！"
"80000080-61-カエデ" = "最後は……"
"80000080-62-カエデ" = "プテラノドン！#n翼がすごくかっこいい翼竜だよ！"
"80000080-63-カエデ" = "今度こそ……絶対成功させてみせる！"
"80000080-64-カエデ" = "うおおおおおっ！"
"80000080-65" = "（恐竜の発掘に、並々ならぬやる気を出してくれたカエデだったが……）"
"80000080-66" = "（結局、すべて失敗に終わってしまった）"
"80000080-67-カエデ" = "うわああぁん！一つも成功しなかったよ～！！"
"80000080-68-カエデ" = "楽しみにしててって言ったのに、こんな結果だなんて……#nううっ……ごめんね先生……。"
"80000080-69" = "[s] \"気にしないで、大丈夫だから。\""
"80000080-70-カエデ" = "でも……せっかくのバレンタインデーだし……"
"80000080-71-カエデ" = "私の手で発掘した、かっこいい恐竜チョコレートをプレゼントしたかったのに……"
"80000080-72-カエデ" = "私、失敗ばかりで……"
"80000080-73-カエデ" = "……ぐすん。"
"80000080-74" = "[s] \"カエデ。\""
"80000080-75-カエデ" = "……？"
"80000080-76" = "[s] \"大事なのは結果じゃないよ。\""
"80000080-77" = "[ns] \"カエデが私のために頑張ってくれただけでも十分嬉しい。\""
"80000080-78-カエデ" = "……だから……割れたチョコレートでも大丈夫……？"
"80000080-79-カエデ" = "そう言ってもらえるのはすごく嬉しいけど……でも……"
"80000080-80-カエデ" = "……あ！"
"80000080-81-カエデ" = "割れたチョコレート……私らしい方法……。"
"80000080-82-カエデ" = "先生！ちょっと待ってて！"
"80000080-83" = "[s] \"えっ？どうしたの？\""
"80000080-84-カエデ" = "この欠片を……こうやって……"
"80000080-85-カエデ" = "……よし！かんせーい！"
"80000080-86-カエデ" = "見て！私が作った、私だけの特別なチョコレート――"
"80000080-87-カエデ" = "その名も――「最強のチョコサウルス」！"
"80000080-88" = "[s] \"最強の……チョコサウルス……！\""
"80000080-89-カエデ" = "割れてない部分を使って作ってみたんだ！#nどう？普通の恐竜よりずっと強そうでしょ！？"
"80000080-90" = "[s] \"うん、カエデらしいプレゼントをありがとう。\""
"80000080-91-カエデ" = "えへへっ、どういたしまして！それにしても……"
"80000080-92-カエデ" = "チョコレート見てたら食べたくなっちゃった！#nねえ先生！私も一緒に食べていい！？"
"80000080-93" = "（そうしてカエデと一緒に、手作りチョコサウルスを味わった）"
