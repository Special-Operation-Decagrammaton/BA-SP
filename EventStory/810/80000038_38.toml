[translation]
"80000038-1" = "ロシアンルーレット・チョコレート！"
"80000038-2" = "（ムツキに呼ばれて、久しぶりに便利屋68のオフィスを訪れた）"
"80000038-3-ムツキ" = "がおーーーーっ！"
"80000038-4" = "[ns] \"ムツキ！？\""
"80000038-5-ムツキ" = "きゃはははっ！びっくりした、先生？"
"80000038-6-ムツキ" = "私の前で隙を見せたらダメなんだよ～？"
"80000038-7-ムツキ" = "そんなことしたら、ムツキちゃんに食べられちゃうんだから！"
"80000038-8-ムツキ" = "くふふっ、これからは～ちゃんと気を付けないとだよ？"
"80000038-9" = "[s1] \"そうだね……。\"\n[s2] \"ところで、今日は……？\""
"80000038-10-ムツキ" = "うん、先生を今日呼んだのは～"
"80000038-11-ムツキ" = "うん、先生を今日呼んだのは～"
"80000038-12-ムツキ" = "じゃーん！ゲームをしようと思って！"
"80000038-13" = "[ns3] \"これ、シリンダーの形……？\"\n[ns4] \"ロシアンルーレット……の、チョコ？\""
"80000038-14-ムツキ" = "うんっ、この間色々検索してたら、面白そうだなって思って！！"
"80000038-15-ムツキ" = "うんっ、この間色々検索してたら、面白そうだなって思って！！"
"80000038-16-ムツキ" = "まさにロシアンルーレットチョコ！"
"80000038-17-ムツキ" = "ちょうど今日はバレンタインデーだし？せっかくだから先生とこれで遊びたいなーって！"
"80000038-18-ムツキ" = "すっごく楽しみにしてたの！"
"80000038-19-ムツキ" = "一緒に遊んでくれるよね、ね？"
"80000038-20" = "[s5] \"それはもちろん遊びたい気持ちもあるのだけど……。\"\n[s6] \"ロシアンルーレット、ちょっと怖いね……。\""
"80000038-21-ムツキ" = "あはっ、そこまで怖がらなくても大丈夫だよ～。"
"80000038-22-ムツキ" = "あはっ、そこまで怖がらなくても大丈夫だよ～。"
"80000038-23-ムツキ" = "ルールは簡単。ここにある6個のチョコレートの中にはものすごく辛いチョコがあるの。"
"80000038-24" = "[s] \"えーっと、6個中2個が当たりって箱に書いてあるね。\""
"80000038-25-ムツキ" = "うん。それで先生と私がチョコを半分こして、"
"80000038-26-ムツキ" = "辛いのを食べたら負け！"
"80000038-27-ムツキ" = "どう？面白そうでしょ？"
"80000038-28" = "[s] \"バレンタインデーなのに、なぜこんな怖い思いを……。\""
"80000038-29-ムツキ" = "先生は大人なんだから、逃げたりしないよね？"
"80000038-30" = "[s] \"そ、それは……。\""
"80000038-31-ムツキ" = "もちろんこれまでのムツキちゃんの勝率を考えたら、先生が怖がるのも無理はないけどー。"
"80000038-32-ムツキ" = "んー、まあ遊んでくれないなら仕方ないな～。"
"80000038-33-ムツキ" = "それじゃあ今日だけは勘弁してあげる。運が良かったね、先生？"
"80000038-34" = "[s] \"に、逃げるとはまだ言ってない……！\""
"80000038-35-ムツキ" = "くふふっ！やっぱり先生はそうじゃないと！"
"80000038-36-ムツキ" = "はいっ、じゃあ先生が先に3つ選んで良いよ。"
"80000038-37-ムツキ" = "私が持ってきたんだし、私じゃなくて先生が先に選ぶ方がフェアでしょ？"
"80000038-38" = "[s] \"なるほど、確かに。じゃあ……。\""
"80000038-39" = "（チョコレートを3つ選んだ）"
"80000038-40-ムツキ" = "くふふっ、じゃあ一気に3ついっちゃう？"
"80000038-41-ムツキ" = "さーて、どっちが勝つかな～？"
"80000038-42-ムツキ" = "さん、にー、"
"80000038-43-ムツキ" = "いちっ！"
"80000038-44" = "[ns] \"………っ！？！？\""
"80000038-45" = "[ns7] \"げほっ、げほっ……！！\"\n[ns8] \"これ、3つ全部辛いんだけど！？\""
"80000038-46-ムツキ" = "ぷっ……くふふっ……。"
"80000038-47-ムツキ" = "ぷっ……くふふっ……。"
"80000038-48-ムツキ" = "あはははっ！！私の勝ちーー！くふふっ♪"
"80000038-49-ムツキ" = "それはそうだよね、だって～。"
"80000038-50-ムツキ" = "予め3箱分買って、全部開けてから「辛いやつだけ」を6つ入れておいたんだもん！"
"80000038-51-ムツキ" = "だから実際のところこのゲームは、最初にチョコを食べちゃった人が負けなの！あははっ！"
"80000038-52" = "[s] \"騙された……っ！\""
"80000038-53-ムツキ" = "え～？でも私は「ここにある6個のチョコレート」としか言ってないよ？"
"80000038-54-ムツキ" = "この中に2個しか辛いのが無いとは言ってないし。"
"80000038-55-ムツキ" = "先生が「箱にそう書いてあるね」って言ったから、「うん」って言っただけだもん。"
"80000038-56" = "[s] \"た、確かに……！？\""
"80000038-57-ムツキ" = "あははっ、また私の勝ちだね！"
"80000038-58-ムツキ" = "うーん、ここまで来ると自分の才能が怖い……くふふっ！"
"80000038-59" = "[s] \"……。\""
"80000038-60-ムツキ" = "あれ、先生どうかした？"
"80000038-61-ムツキ" = "えっと、もしかしてすごく辛かった？多分、そんなに辛くないはず……"
"80000038-62" = "[s] \"まだ、まだゲームは終わってない！\""
"80000038-63-ムツキ" = "……先生？あの、目が結構マジなんだけど……？"
"80000038-64" = "[s9] \"はい、ムツキの分のチョコ。\"\n[s10] \"どっちかが辛いのを引いたら終りってルールは無いはず……？\""
"80000038-65-ムツキ" = "え、ま、まあその、それは……。"
"80000038-66-ムツキ" = "え、ま、まあその、それは……。"
"80000038-67-ムツキ" = "きゃ～！先生に食べられちゃうーーっ！"
"80000038-68-ムツキ" = "先生に無理やり～！！"
"80000038-69" = "[s] \"ムツキ！？ストップ、それは誤解される！？\""
"80000038-70-ムツキ" = "くふふっ、隙ありっ！"
"80000038-71-ムツキ" = "やっぱり慌ててる先生の顔、好きだな～！"
"80000038-72-ムツキ" = "うん、今日も楽しかった！じゃあねー、くふふっ！"
"80000038-73-ムツキ" = "あ、余った二箱分のチョコレートもここに置いておくね。私からのプレゼント！"
"80000038-74-ムツキ" = "また遊ぼうね、先生！"
"80000038-75" = "[ns] \"完全に負けた……。\""
"80000038-76" = "（ムツキが置いていったチョコは、意外と辛い方もすごく美味しかった）"
