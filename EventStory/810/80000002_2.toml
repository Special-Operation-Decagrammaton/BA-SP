[translation]
"80000002-1" = "発注ミス"
"80000002-2" = "シャーレ・「エンジェル24」"
"80000002-3-ソラ" = "い、いらっしゃいませ、先生……！"
"80000002-4-ソラ" = "……あの。"
"80000002-5-ソラ" = "先生、チョコレートとか欲しくありませんか……？"
"80000002-6-ソラ" = "今エンジェル24でチョコレートをおひとつ買うと、さらに無料で一つプレゼント中なんです！"
"80000002-7-ソラ" = "両手に花（？）のチャンスですよ！"
"80000002-8" = "[s] \"い、今はちょっと……。\""
"80000002-9-ソラ" = "ですよね……。"
"80000002-10-ソラ" = "うぅ……これ、どうしましょう……。"
"80000002-11" = "[s] 何か事情がありそうなので聞いてみる。"
"80000002-12-ソラ" = "実はその、バレンタインデーということで張り切ってチョコを発注したのですが、数量を間違えてしまい……。"
"80000002-13-ソラ" = "20個くらいで良いかなと思っていたところを20箱注文してしまって……。"
"80000002-14-ソラ" = "なので仕方なく「1個無料キャンペーン」ということにしたのですが、そもそもここ、お客さんもほぼ来ないせいで……うぅ……。"
"80000002-15-ソラ" = "これが本店の方にバレたら、私はもう……。"
"80000002-16-ソラ" = "このままではお小遣いどころか、とんでもない金額の賠償金を抱えてしまうんじゃ……！？"
"80000002-17" = "[s] \"じゃあ外に出て、売りに行ってみるとかは？\""
"80000002-18-ソラ" = "え、それは……。"
"80000002-19-ソラ" = "も、もちろん、ここでただ待っているよりかは売れてくれるかもしれませんが……。"
"80000002-20-ソラ" = "こんなたくさん、売れますかね……？"
"80000002-21" = "[s1] \"きっと大丈夫。\"\n[s2] \"私も手伝うよ。\""
"80000002-22-ソラ" = "（うぅ、色々怪しい噂がある「先生」に借りを作っても大丈夫なのかな……）"
"80000002-23-ソラ" = "（うぅ、色々怪しい噂がある「先生」に借りを作っても大丈夫なのかな……）"
"80000002-24-ソラ" = "（でも他に方法も無いし、そんなに悪い人じゃない気も……しなくもない、し……）"
"80000002-25-ソラ" = "で、では……はい、よろしくお願いします！"
"80000002-26" = "（ソラと一緒に外に出て、頑張ってチョコレートを売った。）"
"80000002-27" = "（通りすがりの生徒たちが思いのほか興味を示してくれたおかげで、すぐに完売となった。）"
"80000002-28-ソラ" = "す、すごいです先生……！あんなにたくさんあったのに、こんな早く売り切れるなんて！"
"80000002-29-ソラ" = "それに、何だかトリニティやゲヘナの有名な方もいらっしゃったような……"
"80000002-30-ソラ" = "この先生、本当に一体何者なんだろう……。"
"80000002-31" = "[s] \"……？\""
"80000002-32-ソラ" = "い、いえ！何でもありません！"
"80000002-33-ソラ" = "正体はともかく、頼れるのは確か……？"
"80000002-34-ソラ" = "あの、先生。実は一つチョコが余ってまして……。"
"80000002-35-ソラ" = "よろしければ、受け取っていただけませんか？"
"80000002-36-ソラ" = "あ、いえ！お店の物を勝手にとか、うっかりとかではありません！"
"80000002-37-ソラ" = "これはその、ちゃんと自腹で買った私からのチョコレートで……。"
"80000002-38-ソラ" = "ハッピーバレンタインデー、です。"
