[translation]
"80000081-1" = "バレンタインも、忍者の、精神で……！"
"80000081-2" = "（バレンタインデー当日の朝）"
"80000081-3-ツクヨ" = "ついに、この日が……"
"80000081-4-ツクヨ" = "バレンタインデー……"
"80000081-5-ツクヨ" = "大切な人に、チョコレートを贈る日……"
"80000081-6-ツクヨ" = "チョコレートは、用意、しましたが……"
"80000081-7-ツクヨ" = "ただ渡すだけでは、喜んでもらえない、ですよね……"
"80000081-8-ツクヨ" = "「バレンタインも忍者の精神を忘れずにね！」と、言われましたし……"
"80000081-9-ツクヨ" = "でも、忍者らしいバレンタインって……？"
"80000081-10-ツクヨ" = "忍者らしく、忍者らしく……忍者らし……"
"80000081-11-ツクヨ" = "あっ……もしかして、これなら……！"
"80000081-12" = "[ns1] \"ふぅ、外回りの仕事は終わったけど……。\"\n[ns2] \"次は書類の山が……。\""
"80000081-13" = "[ns] \"まずは一枚……。\""
"80000081-14-？？？" = "…………。"
"80000081-15" = "[ns] \"何か物音が……って、聞き間違えかな？\""
"80000081-16" = "[ns] \"次は報告書を……。\""
"80000081-17-？？？" = "…………うう。"
"80000081-18" = "[ns] \"……ん？いや、今は集中しないと。\""
"80000081-19" = "[ns] \"とにかく期限が近いものから……。\""
"80000081-20-？？？" = "う、ううっ……"
"80000081-21" = "[ns] \"だ、誰かいるの！？\""
"80000081-22-？？？" = "うっ、うぅっ……ぐすん……"
"80000081-23" = "（誰もいないはずの執務室に、謎の声が……）"
"80000081-24" = "[ns] \"ま、まさか……お化け！？\""
"80000081-25-？？？" = "うぅ……た、助けてください……先生ぃ……。"
"80000081-26" = "[s] \"もしかして、ロッカーの中……？\""
"80000081-27" = "[ns] \"どうしてこんなところに……？\""
"80000081-28-ツクヨ" = "せ、先生ぇ……出られなく、なってしまい……"
"80000081-29-ツクヨ" = "た、助けて……いただけませんか……？#nぐすん……。"
"80000081-30" = "（その後、ツクヨから経緯を聞いた）"
"80000081-31-ツクヨ" = "その……今日は、バレンタインデー、ですよね……。"
"80000081-32-ツクヨ" = "一年に一度、大切な人に、チョコレートを渡す日……"
"80000081-33-ツクヨ" = "そこで……先生に、と思って来たのですが……"
"80000081-34" = "[s] \"ですが……？\""
"80000081-35-ツクヨ" = "うぅ……でも、普通に渡すだけじゃ、気持ちが伝わらないのでは、と……"
"80000081-36-ツクヨ" = "それに「何事も忍者らしく頑張って！」と言われたので……"
"80000081-37" = "[s] \"あー……誰の言葉か分かった気がする……。\""
"80000081-38-ツクヨ" = "どうすれば、先生が喜んでくれるか……自分なりに、悩んで……"
"80000081-39" = "[s] \"それでロッカーに隠れてたんだね。\""
"80000081-40-ツクヨ" = "はい……それで、入るところまでは、良かったのですが……#nいざ、先生にチョコレートを渡そうとしたら、抜けられなくなって、しまって……"
"80000081-41-ツクヨ" = "や、やっぱり、この身体のせい……ですよね？"
"80000081-42-ツクヨ" = "私が大きいから……そのせいで……"
"80000081-43-ツクヨ" = "こんな風に、迷惑、かけてしまって……"
"80000081-44-ツクヨ" = "うううっ……す、すみません……！！"
"80000081-45" = "[s] \"そんなことないよ。安心して、ツクヨ。\""
"80000081-46" = "[ns] \"それより、私のためを思ってくれたのが嬉しい。\""
"80000081-47-ツクヨ" = "そ、そう、ですか……？"
"80000081-48-ツクヨ" = "ずっと、これで良いのか……先生に喜んでもらえるか、心配で、心配で……"
"80000081-49-ツクヨ" = "でも……"
"80000081-50-ツクヨ" = "忍者の鉄則その壱！#n「忍者とはいついかなる状況でも、躊躇わずに挑戦するもの」！"
"80000081-51-ツクヨ" = "……という心構えを、忘れずに……頑張って、作りました！"
"80000081-52" = "[ns] \"……？\""
"80000081-53-ツクヨ" = "えっと、どうか、しましたか……？"
"80000081-54-ツクヨ" = "あっ、もしかして……"
"80000081-55-ツクヨ" = "さっきまで……胸元でギュって、してた、から……"
"80000081-56-ツクヨ" = "うっ、うぅ……"
"80000081-57-ツクヨ" = "こんなことに、なるとは……"
"80000081-58-ツクヨ" = "私の体温で、溶けちゃうなんて……"
"80000081-59-ツクヨ" = "す、すすっ……すみません……！"
"80000081-60-ツクヨ" = "こんな、贈り物に、なってしまって……！"
"80000081-61" = "[s] \"そ、そっか……。\""
"80000081-62-ツクヨ" = "こんなもの、お渡しする、わけには……！"
"80000081-63-ツクヨ" = "ちょ、チョコレートは、また今度……いえ、明日にでも……！"
"80000081-64" = "[ns] \"待って、ツクヨ！\""
"80000081-65-ツクヨ" = "せ、先生……？"
"80000081-66" = "[s] \"私はそれが欲しい！\""
"80000081-67-ツクヨ" = "ほ、本当、ですか……？"
"80000081-68" = "[s] \"ツクヨが用意してくれたチョコだもの！\""
"80000081-69-ツクヨ" = "でっ、では……！"
"80000081-70" = "[ns] \"ありがとね、ツクヨ。じゃあ仕事が終わったら――\""
"80000081-71-ツクヨ" = "あの……せ、先生！#nよ、よ、よろしければ……！"
"80000081-72-ツクヨ" = "今、ここで感想を……聞かせて、いただき、たい、のですがっ……"
"80000081-73-ツクヨ" = "だ、ダメでしょうか……？"
"80000081-74" = "[s3] \"こ、この場で……？\"\n[s4] （ツクヨの体温で溶けたチョコを……本人の目の前で！？）"
"80000081-75-ツクヨ" = "……あっ。"
"80000081-76-ツクヨ" = "……あっ。"
"80000081-77-ツクヨ" = "やっぱり……"
"80000081-78-ツクヨ" = "……こんな、チョコレート……"
"80000081-79-ツクヨ" = "食べてほしいなんて、言われても、困るだけ……ですよね。"
"80000081-80-ツクヨ" = "あ、あははっ……すみません。#n私、迷惑ばっかり、かけて……"
"80000081-81" = "[s] \"そんなことない！\""
"80000081-82-ツクヨ" = "はい……？"
"80000081-83" = "[s] \"だって、ツクヨが作ってくれたんだから！\""
"80000081-84-ツクヨ" = "あっ……。"
"80000081-85" = "（気恥ずかしい気持ちを振り払って、チョコレートを食べた）"
"80000081-86" = "[ns] \"うん、やっぱり美味しいよ！\""
"80000081-87-ツクヨ" = "わぁっ……"
"80000081-88-ツクヨ" = "よ、良かったぁ……！"
"80000081-89-ツクヨ" = "私、これからも精一杯、頑張ります！"
"80000081-90-ツクヨ" = "もっと、もっと……忍者として！"
"80000081-91" = "[s] \"う、うん！楽しみにしてるね！\""
"80000081-92-ツクヨ" = "えへへっ！"
"80000081-93" = "（また次も、似たようなトラブルが起こりそうな予感はさておき……）"
"80000081-94" = "（ツクヨから貰ったチョコを味わい、バレンタインデーを楽しんだ）"
