[translation]
"80000018-1" = "会計の限界"
"80000018-2" = "ミレニアム・セミナーのオフィス"
"80000018-3-ユウカ" = "そういえば、もう来週はバレンタイン……。"
"80000018-4-ユウカ" = "きっと先生は、他の生徒たちからもチョコレートをたくさんもらうんだろうけど……。"
"80000018-5-ユウカ" = "食べきれないくらいチョコをもらうって分かってるのに、わざわざ私までプレゼントする必要あるのかしら……？"
"80000018-6-ユウカ" = "……。"
"80000018-7-ユウカ" = "けど贈り物は仕事上大事だし、他の学園の生徒もプレゼントするのに、私だけっていうのも……。"
"80000018-8-ユウカ" = "うん。やっぱり何かちょうど良さそうなものでも渡そう。"
"80000018-9-ユウカ" = "……「ビジネス相手のための、プレゼント用チョコレートセット」。"
"80000018-10-ユウカ" = "中身も綺麗だし、評判も悪くない……先生の好きな味のも多いはず。"
"80000018-11-ユウカ" = "値段は……1万円！？"
"80000018-12-ユウカ" = "うっ……生徒から先生への贈り物の額としては、ちょっと高すぎるかしら？そもそも日頃から、先生には無駄遣いを注意しているわけだし……。"
"80000018-13-ユウカ" = "だからといって安いのだと見劣りするし、先生もがっかり……じゃなくて礼儀がなってないし……どうしよう……。"
"80000018-14-ユウカ" = "えっと、じゃあ、こうすれば…………。"
"80000018-15" = "シャーレ・オフィス"
"80000018-16" = "（バレンタインデー当日の朝）"
"80000018-17-ユウカ" = "おはようございます、先生。"
"80000018-18" = "[s] \"おはよう、ユウカ。\""
"80000018-19-ユウカ" = "あの……先生、今日が何の日かご存知でしょうか？"
"80000018-20" = "[s1] \"ふんどしの日？\"\n[s2] \"……煮干しの日？\""
"80000018-21-ユウカ" = "……はい？そんな変な記念日があるんですか？"
"80000018-22-ユウカ" = "……はい？そんな変な記念日があるんですか？"
"80000018-23-ユウカ" = "ではなくて、今日はバレンタインデーです！シャーレのカレンダーにも書いておいたでしょう？"
"80000018-24-ユウカ" = "と、とにかく、なので……別にそんな張り切ったわけではないのですが、何もしないということにするにはお世話になり過ぎてますし……。"
"80000018-25-ユウカ" = "……私からの、バレンタインデーチョコレートです。"
"80000018-26-ユウカ" = "も、もちろん全部食べなくても大丈夫です。このチョコレートは義理――いえ、ビジネス的な意味での物ですから！"
"80000018-27" = "[s] \"ありがとう、大切に食べるね。\""
"80000018-28" = "[ns] \"……この領収書は？\""
"80000018-29-ユウカ" = "そ、それは、ええっと……！"
"80000018-30-ユウカ" = "以前先生に、5000円を超えるものは勝手に買うなと言ってたのに、私だけが高いチョコを買うのもおかしいと思って……。"
"80000018-31-ユウカ" = "こういう日にやたら高いチョコを買ってくる、重い女の子と思われるのも嫌だし……"
"80000018-32-ユウカ" = "と、とにかく！私は意味のない義理チョコに大金を使うーーそんなだらしない女ではないので！"
"80000018-33-ユウカ" = "このチョコレートはぴったり5000円のものです！誤解しないでくださいね！"
"80000018-34-ユウカ" = "こ、これはあくまでも……今後の先生との関係性を保つための、ビジネス的な意味でのプレゼントですので！"
"80000018-35" = "（その後ユウカの財布からはみでた、分割決済した5000円の領収書をもう一枚見てしまったが、それについては見なかったことにした。）"
