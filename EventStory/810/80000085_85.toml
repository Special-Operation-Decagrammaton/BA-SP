[translation]
"80000085-1" = "SRT、補給します！"
"80000085-2" = "（ある日ミヤコの頼みで、シャーレの調理実習室を貸すことになった）"
"80000085-3-ミヤコ" = "先生、場所を貸していただきありがとうございます。"
"80000085-4-ミヤコ" = "簡単な料理なら、公園でも作れるのですが……"
"80000085-5-ミヤコ" = "今から作るものは、他の隊員に知られたくなかったので。"
"80000085-6" = "[s] \"大丈夫だよ、必要な時はいつでも来てね。\""
"80000085-7" = "[ns] \"ところで、何を作るの？\""
"80000085-8-ミヤコ" = "その……もうすぐバレンタインデーでしょう？#n街のお店には、色んな種類のチョコレートが並んでいましたし。"
"80000085-9-ミヤコ" = "なのに私たちのキャンプには、硬くて苦い、#n軍用チョコレートしかなかったので……"
"80000085-10-ミヤコ" = "いつも頑張っているみんなのために、#n何か甘いものを作ってあげたいと思ったんです。"
"80000085-11-ミヤコ" = "そういえば、バターや卵に砂糖まで頂いてしまって……本当にありがとうございました。"
"80000085-12-ミヤコ" = "手持ちの食材だけでは、正直足りないと思っていたので。"
"80000085-13-ミヤコ" = "先生に助けていただけなかったら、#n今回の作戦は計画段階で終わっていたでしょう。"
"80000085-14" = "[s] \"気にしないで。食材が余って困ってたから。\""
"80000085-15-ミヤコ" = "ふふ、ありがとうございます。"
"80000085-16-ミヤコ" = "あ、焼き上がったみたいですね。"
"80000085-17-ミヤコ" = "取り出してきます。"
"80000085-18" = "[ns] \"わあ……！おいしそう！\""
"80000085-19-ミヤコ" = "チョコレートを使った、キャロットケーキです。"
"80000085-20-ミヤコ" = "生地に細かく切ったにんじんを入れると、#n食感がよくなって、甘さも和らぐんですよ。"
"80000085-21-ミヤコ" = "……まあ一番のメリットは、小麦粉を節約できるという点ですが。"
"80000085-22" = "[s] \"すごいね……どこでやり方を習ったの？\""
"80000085-23-ミヤコ" = "どこで……というわけではありませんが、特殊部隊はよく野営をしますので。#n簡単な調理くらいはできるようになりました。"
"80000085-24-ミヤコ" = "SRT特殊学園にいた時も、#n時々飯ごうをオーブン代わりにして、小さなパンを焼いたりしましたね。"
"80000085-25-ミヤコ" = "ふふ、なんだか懐かしいです……。"
"80000085-26-ミヤコ" = "……4つあるので、3つはみんなに渡して……。"
"80000085-27-ミヤコ" = "……先生。よろしければこのケーキ、#n受け取っていただけませんか？"
"80000085-28-ミヤコ" = "せっかく作りましたし……日頃のお礼もできたら、と。"
"80000085-29" = "[s1] \"でもこのケーキ……。\"\n[s2] \"ミヤコの分じゃ……？\""
"80000085-30-ミヤコ" = "……私は、作っている途中に味見をしましたので。"
"80000085-31-ミヤコ" = "……私は、作っている途中に味見をしましたので。"
"80000085-32-ミヤコ" = "それに、ウサギに甘いものは良くないと言いますし……。"
"80000085-33-ミヤコ" = "このケーキを、一緒に……？"
"80000085-34-ミヤコ" = "……いいのですか？#n分けて食べるには、もともと少ない量だと思うのですが……。"
"80000085-35" = "[s3] \"私がミヤコと食べたいんだ。\"\n[s4] \"甘い物は誰しも、食べ過ぎると良くないからね。\""
"80000085-36-ミヤコ" = "……ふふ、そうですね。"
"80000085-37-ミヤコ" = "……ふふ、そうですね。"
"80000085-38-ミヤコ" = "いつも気遣ってくださって、ありがとうございます。#nでは、いただきましょう。"
"80000085-39" = "（ミヤコと一緒に、甘いキャロットケーキを味わった）"
