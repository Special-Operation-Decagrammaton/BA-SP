[translation]
"80000048-1" = "主殿と忍者の味を"
"80000048-2-イズナ" = "あ、主殿！ちょうど主殿のもとに馳せ参じようかと思っていたところでした！"
"80000048-3-イズナ" = "イズナがそう考えた途端に、こうして現れてくださるなんて……これも何かの忍術でしょうか！？"
"80000048-4" = "[s1] \"いや、特にそういうわけではないかな……。\"\n[s2] \"ちょっとシャーレの仕事の関係でね。\""
"80000048-5-イズナ" = "主殿の忍術ではない、ということは……。"
"80000048-6-イズナ" = "主殿の忍術ではない、ということは……。"
"80000048-7-イズナ" = "つまり逆に、主殿に会いたいというイズナの切実な願いが、新たな能力を開花させたのでしょうか！？"
"80000048-8-イズナ" = "このところ頑張って忍術を勉強していましたので、その甲斐があったのかもしれません！"
"80000048-9" = "[s] \"そ、そうかもね……？ところで今日は、何か用事とか？\""
"80000048-10-イズナ" = "あ、そうです！主殿、今日はバレンタインデーですよね？"
"80000048-11-イズナ" = "バレンタインデーといえば、イズナはやはりチョコレートだと思うのです！"
"80000048-12" = "[s] \"うん、確かに。\""
"80000048-13-イズナ" = "ということでイズナ、「例のモノ」を手に入れることに成功しました！ご覧ください！"
"80000048-14" = "[ns] \"これ……手裏剣？\""
"80000048-15-イズナ" = "はい！しかし手裏剣だけではありません、他にも撒菱や苦無など！"
"80000048-16-イズナ" = "忍者の使う道具がたくさん入っているのです！"
"80000048-17-イズナ" = "最近「百鬼夜行・渦巻映画村」で販売されている大人気商品、特製忍者グッズ49番「チョコレートセット」です！"
"80000048-18-イズナ" = "これは柴犬ワン蔵監督の代表作「犬連れ忍者」にも出ているグッズでして……！"
"80000048-19-イズナ" = "イズナ、これを手に入れるために夜中から並び……何とか手に入れることができました！"
"80000048-20" = "[s] \"……忍者で柴犬でチョコレート？\""
"80000048-21-イズナ" = "この鮮やかな色つや、そして甘いチョコレートの香り……。"
"80000048-22-イズナ" = "イズナ、このセットを手にしているだけで、何だか忍術がたくさん使えるようになった気分です……"
"80000048-23-イズナ" = "やっぱり忍具は良いですね！見ているだけで楽しいです！"
"80000048-24-イズナ" = "……はっ！いえ、気分の問題だけではなく、イズナはすでに立派な忍者なのですが！"
"80000048-25-イズナ" = "そうですよね、主殿！"
"80000048-26" = "[s] \"色々よく分からないけど、イズナが喜んでるのは嬉しい。\""
"80000048-27-イズナ" = "そ、そうですか？えへへっ……。"
"80000048-28-イズナ" = "で、ではなく！主殿、こちらを受け取ってください！"
"80000048-29" = "[ns3] \"え、これ私が貰って良いの？\"\n[ns4] \"イズナが苦労して買ったんじゃ……？\""
"80000048-30-イズナ" = "それはそうなのですが……。"
"80000048-31-イズナ" = "それはそうなのですが……。"
"80000048-32-イズナ" = "イズナ、本来の目的としてはこのチョコを、主殿と一緒に食べたいなと思いまして……。"
"80000048-33" = "[s] \"イズナ……！\""
"80000048-34-イズナ" = "そのために、主殿を探していたんです！"
"80000048-35-イズナ" = "早速一緒に食べましょう、きっと忍者の味がするはずですから！"
"80000048-36" = "[s] \"なるほど、忍者の味でござるか。\""
"80000048-37-イズナ" = "ああっ、チョコを渡しただけでもう主殿が立派な忍者に！？"
"80000048-38-イズナ" = "イズナも負けてはいられません！イズナはこの撒菱のチョコを頂きます！主殿にはこちらの手裏剣チョコを！"
"80000048-39-イズナ" = "さあ主殿、どうぞ！ニンニン～！"
"80000048-40" = "（そうやってニコニコ笑いながらチョコを差し出してくるイズナと一緒に、忍者チョコのセットを美味しく食べた）"
