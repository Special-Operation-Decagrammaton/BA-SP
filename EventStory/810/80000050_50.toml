[translation]
"80000050-1" = "私のすべてをあなたに"
"80000050-2" = "（バレンタインデーを迎え、何かの騒ぎが起きた時に備えて街をパトロールしてる時）"
"80000050-3" = "（視角の端から……）"
"80000050-4" = "[ns] \"……。\""
"80000050-5" = "（路地裏を曲がると……）"
"80000050-6" = "[ns] \"…………。\""
"80000050-7" = "[ns] \"……ワカモ？\""
"80000050-8-？？？" = "あらあら……。"
"80000050-9-ワカモ" = "つい前に出たい気持ちを抑えつつ、できるだけ気づかれないようにと思ったのですが……。"
"80000050-10-ワカモ" = "ふふっ……ですが、"
"80000050-11-ワカモ" = "私の存在に気が付いてくださったというのは、胸が熱くなるほど嬉しいことですね。"
"80000050-12-ワカモ" = "ああ、このままでは私、また我慢が出来なくなってしまいそうです……。"
"80000050-13" = "[s1] \"ワカモ、結構目立つし……。\"\n[s2] \"ところで、どうしたの？\""
"80000050-14-ワカモ" = "ああ、本日あなた様のもとを訪れたのは……"
"80000050-15-ワカモ" = "ああ、本日あなた様のもとを訪れたのは……"
"80000050-16-ヘルメット団" = "勝手にあたしらの縄張りでチョコなんか売りやがって、喧嘩売ってんのか！？"
"80000050-17-ワカモ" = "実は、その……"
"80000050-18-チンピラ" = "何言ってんだ、ここはもう私たちのエリアだっての！"
"80000050-19-ヘルメット団" = "はぁ！？それならもう、今から白黒つけてやる！"
"80000050-20-チンピラ" = "良い度胸だ、かかって来い！"
"80000050-21-ワカモ" = "……少々騒がしいですねぇ？"
"80000050-22" = "[s] \"ちょっ、ちょっと待ってて！話し合ってくるから！\""
"80000050-23" = "（ワカモが暴れてしまう前に、何とか状況を落ち着かせることができた）"
"80000050-24-ワカモ" = "ふふっ……お疲れ様でした、先生。"
"80000050-25-ワカモ" = "こんな日ですし、これくらいの騒ぎでしたら我慢できるかと思ったのですが……。"
"80000050-26" = "[s] \"あ、そうなの？\""
"80000050-27-ワカモ" = "はい♡本日はバレンタインデー、このような日まで騒ぎを起こしては、あなた様も困ってしまうでしょう？"
"80000050-28-ワカモ" = "そうです、そんなことよりもあなた様のことを訪れた理由はただ一つ。"
"80000050-29-ワカモ" = "こちらを……"
"80000050-30" = "[ns] \"あ、チョコレート……。\""
"80000050-31-ワカモ" = "はい、どうしてもこれをあなた様にお渡ししたくって……。"
"80000050-32-ワカモ" = "早朝よりあなた様を探して、彷徨い歩いていたのですが……。"
"80000050-33-ワカモ" = "ようやく会うことができて、私は幸せです……"
"80000050-34-ワカモ" = "ふふっ♡"
"80000050-35-ワカモ" = "やはり運命ですね……♡"
"80000050-36" = "[s] \"見つかってからしばらく尾行されてた気がするけど、あれは……？\""
"80000050-37-ワカモ" = "そんなことより、ぜひこの場で味わっていただけませんか？"
"80000050-38-ワカモ" = "そしてどうか、すぐにご感想をお伺いしたく……。"
"80000050-39" = "[s] \"あ、うん。じゃあありがたく……\""
"80000050-40" = "（ワカモの前でチョコを口に入れようとしたものの……）"
"80000050-41-ワカモ" = "ふふっ、ふふふふふっ……さあ、さあ……！早く私のチョコを、"
"80000050-42-ワカモ" = "私を、あなた様の体内に……！"
"80000050-43" = "[s] （チョコレートを一旦口から離す）"
"80000050-44-ワカモ" = "あっ……召し上がっては、いただけないのですか……？"
"80000050-45" = "[s3] \"えーっと……\"\n[s4] 再び口の中に入れようとする。"
"80000050-46-ワカモ" = "ふふっ、ふふふっ……♡ああ、もう少し……"
"80000050-47-ワカモ" = "ふふっ、ふふふっ……♡ああ、もう少し……"
"80000050-48-ワカモ" = "もう少しで私の、私のすべてを……！"
"80000050-49" = "[s] （チョコレートをもう一度口から離す）"
"80000050-50-ワカモ" = "あぁっ……先生、どうして……？"
"80000050-51" = "[s5] \"あの、本当に念のためなんだけど……。\"\n[s6] \"このチョコ、何か普通は入れないものとか入ってる……？\""
"80000050-52-ワカモ" = "はい、それはもうたっぷり……♡"
"80000050-53-ワカモ" = "はい、それはもうたっぷり……♡"
"80000050-54" = "[s] \"何を！？\""
"80000050-55-ワカモ" = "何をと申されますと、それはもちろん……"
"80000050-56-ワカモ" = "私のこの、抑えきれないほどの愛情です！"
"80000050-57-ワカモ" = "それをいち早く味わっていただきたくって……"
"80000050-58-ワカモ" = "どうかしましたか？"
"80000050-59" = "[s] \"本当にごめん……。\""
"80000050-60-ワカモ" = "……？"
"80000050-61" = "（変なことは考えず、ワカモがくれたチョコレートを美味しく食べた）"
"80000050-62" = "[ns] \"うん、美味しい。ありがとね、ワカモ。\""
"80000050-63-ワカモ" = "あぁ、食べてくださったんですね……ようやく、私のが……。"
"80000050-64-ワカモ" = "そんな激しく口の中で弄んで、"
"80000050-65-ワカモ" = "私の全てがこもったものを飲み込まれて……。"
"80000050-66-ワカモ" = "私のすべては、今あなた様のお腹の中でゆっくりと一つに……！"
"80000050-67" = "[s] \"あの、ワカモさん……？\""
"80000050-68-ワカモ" = "ふふっ……いえ、お気になさらず。"
"80000050-69-ワカモ" = "あなた様に食べていただけたことが、あまりにも嬉しくって……。"
"80000050-70-ワカモ" = "さぁ、これで終わりではありません。せっかくですのでこの後、ご一緒に過ごしませんか？"
"80000050-71" = "[s] \"それは全然喜んでって感じなんだけど、その……。\""
"80000050-72-ワカモ" = "ああ、私のものを受け入れてくださったあなた様と、今日一日ずっと……"
"80000050-73-ワカモ" = "ふふふっ……"
"80000050-74-ワカモ" = "今日は、最高の一日になりそうです♡"
"80000050-75" = "[s] \"……？\""
"80000050-76" = "（何だか背筋の凍る予感もありつつ、その後ワカモと楽しく過ごした）"
