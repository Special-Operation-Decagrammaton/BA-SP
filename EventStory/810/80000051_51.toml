[translation]
"80000051-1" = "より苦く、より甘く"
"80000051-2" = "ゲヘナ学園・第17学生食堂"
"80000051-3" = "（ハルナから連絡を受けて、学食へと訪れた）"
"80000051-4" = "[s] \"えっと、待ち合わせ場所はここで合ってるはず……。\""
"80000051-5-ハルナ" = "ふふっ、先生。ようこそお越しくださいました。"
"80000051-6" = "[s] \"あ、ハル――\""
"80000051-7-ハルナ" = "はぁっ！"
"80000051-8" = "[ns] \"んむっ！？\""
"80000051-9" = "（突然口の中いっぱいに、抹茶の苦みとチョコレートの甘味とが広がった）"
"80000051-10" = "[ns] \"んん……ごくんっ。これ、抹茶チョコレート？\""
"80000051-11-ハルナ" = "はい、正解ですわ。さすがは先生、勘が良いですね。"
"80000051-12" = "[s] \"勘というか、舌……？\""
"80000051-13-ハルナ" = "それなりに良いブランドの抹茶チョコレートだったのですが、いかがでしたか？"
"80000051-14" = "[s] \"うん。苦くて甘くて美味しかった。\""
"80000051-15-ハルナ" = "なるほど……そうですか、参考になりました。"
"80000051-16-ハルナ" = "……何をしているのか、ですか？"
"80000051-17-ハルナ" = "ふふっ。先生もご存じの通り、本日はバレンタインデー……大切な方へ、スイーツをプレゼントする日です。"
"80000051-18-ハルナ" = "主流はチョコレートですが、最近はケーキやキャンディー、マカロンといったプレゼントも増えてきました。"
"80000051-19-ハルナ" = "ここで先生に質問です、このスイーツたちの共通点は何だと思われますか？"
"80000051-20" = "[s] \"えーっと……\""
"80000051-21-ハルナ" = "時間切れです。"
"80000051-22" = "[s] \"時間制限あり！？そして早い！！\""
"80000051-23-ハルナ" = "先生、美食というのは往々にして時間制限があるものなのですよ？美味しいのはその一瞬、ということは珍しくもありません。"
"80000051-24-ハルナ" = "という冗談はさておき、その答えは「甘味」です。"
"80000051-25" = "[s] \"まあ、スイーツだもんね……？\""
"80000051-26-ハルナ" = "はい、ある意味では当然かもしれません。しかし私はこう思ったのです。どうしてバレンタインデーには甘い物をプレゼントするのか、と。"
"80000051-27-ハルナ" = "悩みに悩んだ末、私は気が付きました。"
"80000051-28-ハルナ" = "……これは比喩だと。"
"80000051-29" = "[s] \"比喩……？\""
"80000051-30-ハルナ" = "大事な方に感謝を届けたいというこの気持ち……。"
"80000051-31-ハルナ" = "つまりは、相手への想いが「甘味」として表現されているのではと！"
"80000051-32" = "[s] \"……なるほど？\""
"80000051-33-ハルナ" = "そこで、私はこんな仮説を思いつきました。もしその通り想いが甘さに繋がるのであれば、感謝の気持ちを込めれば込めるほど……"
"80000051-34-ハルナ" = "そのスイーツはさらに甘くなるのでは、と！"
"80000051-35" = "[s] \"そう、かも……？\""
"80000051-36-ハルナ" = "というわけでこちらに、抹茶チョコレートの材料をご用意いたしました。"
"80000051-37-ハルナ" = "どうして抹茶チョコレートなのか？"
"80000051-38-ハルナ" = "それはもちろん、苦味と甘みが同時に感じられるものだからです。甘みだけを比べるよりも、きっと分かりやすいでしょう。"
"80000051-39-ハルナ" = "今こそ究明の時です。"
"80000051-40-ハルナ" = "さあ先生、共に究極に甘いチョコレートを作るとしましょう！"
"80000051-41" = "[s] \"それはつまり……\""
"80000051-42-ハルナ" = "どうかしましたか？もちろん協力してくださいますよね？"
"80000051-43" = "[s] \"えっと、その前にその甘さって仮説通りなら……\""
"80000051-44-ハルナ" = "協力、してくださいますよね？"
"80000051-45" = "[s] \"……はい。\""
"80000051-46-ハルナ" = "ふふっ、では始めましょう！"
"80000051-47" = "（そうしてハルナと一緒に、抹茶チョコレートを作り始めた）"
"80000051-48-ハルナ" = "ふむ……火の調節に失敗してしまいましたね。急にボウルが爆発するとは……"
"80000051-49-ハルナ" = "ふふっ、ゲヘナにおいて「学生食堂の冷蔵庫には魔物が住んでいる」というのは有名なお話……"
"80000051-50-ハルナ" = "しかし今さら、それしきのことで諦める私ではございません！"
"80000051-51-ハルナ" = "さあ、続けましょう！"
"80000051-52" = "[ns] \"色々と大丈夫かな……。\""
"80000051-53" = "（そうして様々な苦難を乗り越え、ようやく抹茶チョコレートが完成した）"
"80000051-54-ハルナ" = "ふふっ、遂に完成です……先生のために作った、究極の手作り抹茶チョコレート！"
"80000051-55-ハルナ" = "ではご賞味ください。先ほどの抹茶チョコレートよりもさらに甘いかどうか、確認していただければと。"
"80000051-56" = "[s] \"じゃあ、頂きます。\""
"80000051-57-ハルナ" = "ふふふっ……！"
"80000051-58" = "（期待に満ちたハルナの視線を受けつつも、何も繕う必要などないくらい……）"
"80000051-59" = "[s] \"うん、甘くて美味しい。さっきのチョコよりもずっと。\""
"80000051-60-ハルナ" = "やはりそうでしたか！成功です、究極の美食へ向けてさらに新たなもう一歩を踏み出しましたわ……！"
"80000051-61" = "[s] \"もちろん、ハルナの気持ちがこもってるからね。\""
"80000051-62-ハルナ" = "！？！！！？！？！？"
"80000051-63-ハルナ" = "わ、私の気持ち……ま、まあ、ええ、確かにそれはそうなのですが……？"
"80000051-64-ハルナ" = "そう、ですわね……？"
"80000051-65" = "[s] \"ハルナ？どうかした？\""
"80000051-66-ハルナ" = "……なるほど。これは予想していませんでした。"
"80000051-67-ハルナ" = "（一等好きな御方と向き合っている時のこの気持ち、この突き上げるような感覚……そしてその感想から再び生まれる、この甘さは……）"
"80000051-68-ハルナ" = "ふ、ふふふっ……なるほど、良い勉強になりましたわ。"
"80000051-69-ハルナ" = "では先生、私はこれで失礼いたします。"
"80000051-70-ハルナ" = "あ、残りのチョコレートもぜひ全部食べてくださいね。それでは……！"
"80000051-71" = "[ns] \"ちょっ、ハルナ！？\""
"80000051-72" = "（すごい勢いで去っていくハルナを見送ってから、もう一度抹茶チョコを味わった）"
"80000051-73" = "（ほんのり苦いけれど、やっぱりものすごく甘かった）"
