[translation]
"80000035-1" = "とにかく準備したので！"
"80000035-2-アコ" = "まあ、こんなものでしょうか。あとこっちの書類を……。"
"80000035-3" = "[ns] \"アコ、この書類どこに置けば良いかな？\""
"80000035-4-アコ" = "あぁ、それはこちらに。"
"80000035-5-アコ" = "ふぅ……急に忙しくなってしまったので、助かりました。"
"80000035-6-アコ" = "こういう時は、猫の手ならぬ先生の手も役に立つものですね。"
"80000035-7" = "[s] \"それは何より……。\""
"80000035-8-アコ" = "何やら不満そうな顔ですが、文句は受け付けませんよ。"
"80000035-9-アコ" = "ですが、そうですね……仕方ありません。書類を一枚片付けるたびに、ひとつご褒美を差し上げましょう。"
"80000035-10" = "[s] \"チョコレートだ、ありがとう。\""
"80000035-11-アコ" = "では、引き続きお願いいたしますね？"
"80000035-12" = "[ns] \"この書類もOK、ここに置いておくね。\""
"80000035-13-アコ" = "はい。ありがとうございます、ではこれをどうぞ。"
"80000035-14" = "[s] \"頂きます。\""
"80000035-15-アコ" = "ではこちらのチョコを……。"
"80000035-16-アコ" = "はい、ではこれを……。"
"80000035-17-アコ" = "お疲れ様です、どうぞ。"
"80000035-18" = "（そうやってアコから、書類を渡すたびにチョコレートを貰い続け……）"
"80000035-19" = "[ns] \"……もしかしてだけどこのチョコ、アコの手作り？\""
"80000035-20-アコ" = "なっ！？"
"80000035-21-アコ" = "い、一体いつからそのことに……！？"
"80000035-22" = "[s1] \"最初にチョコをくれたタイミングで。\"\n[s2] \"何となく初めの方から。\""
"80000035-23-アコ" = "最初から気づいていたのに、知らない振りをしていたと……！？"
"80000035-24-アコ" = "最初から気づいていたのに、知らない振りをしていたと……！？"
"80000035-25-アコ" = "ああもう、性格悪いですね！！"
"80000035-26" = "[s] \"ごめん、嬉しくって……。\""
"80000035-27-アコ" = "はぁ……まあ、そんなことはバレても構いません。どうでも良いことですので。"
"80000035-28-アコ" = "それより……。"
"80000035-29-アコ" = "せっかくバレたんですから、感想の一つでもくださいね。"
"80000035-30-アコ" = "それなりにちゃんと作りましたし……。"
"80000035-31" = "[s] \"じゃあ、せっかくだしひと休みする？コーヒー淹れてくるから。\""
"80000035-32-アコ" = "……まあ、良いでしょう。"
"80000035-33-アコ" = "エスプレッソでお願いします。"
"80000035-34" = "（その後もアコから仕事の愚痴を聞きながら、ゆっくりチョコレートとコーヒーを味わった）"
