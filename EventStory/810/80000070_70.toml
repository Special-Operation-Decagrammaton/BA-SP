[translation]
"80000070-1" = "あの日読んだロマンチック"
"80000070-2" = "（ツルギと約束をし、トリニティの教室へと訪れた）"
"80000070-3" = "（少し早く着いたせいか、まだツルギの姿は見えない）"
"80000070-4" = "[s1] \"とりあえず、中で待たせてもらおうかな。\"\n[s2] \"時間、合ってたかな……？\""
"80000070-5" = "[ns3] \"……あっ。\"\n[ns4] \"来た。\""
"80000070-6" = "ひゃあぁぁぁぁぁっはぁーーー！！！"
"80000070-7" = "ひゃあぁぁぁぁぁっはぁーーー！！！"
"80000070-8-ツルギ" = "すみませんお待たせしましたぁ！！"
"80000070-9" = "[s5] \"ううん、全然待ってないよ。\"\n[s6] \"ところでツルギ、今日は……？\""
"80000070-10-ツルギ" = "あ、ありがとうございます……。"
"80000070-11-ツルギ" = "そ、それは……！！"
"80000070-12-ツルギ" = "実はえっと、その……！"
"80000070-13-ツルギ" = "わ、わわ私が先生を、こうしてお呼びしたのは……っ！"
"80000070-14" = "[s] \"したのは……？\""
"80000070-15-ツルギ" = "……。"
"80000070-16-ツルギ" = "違う、もっと、あんな感じで……。"
"80000070-17" = "[s] \"……？\""
"80000070-18-ツルギ" = "……きっ。"
"80000070-19" = "[s] \"……き？\""
"80000070-20-ツルギ" = "きゃぁっはぁぁぁぁぁぁぁっ！！！！"
"80000070-21" = "（…………）"
"80000070-22" = "（…………）"
"80000070-23" = "[ns7] 落としていったチョコレートを拾う。\n[ns8] \"……チョコレートありがとね、ツルギ。\""
