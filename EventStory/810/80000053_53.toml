[translation]
"80000053-1" = "そんな風に食べないで！"
"80000053-2" = "（コハルから連絡をもらって、下校時間に合わせてトリニティの校門前で待っていた）"
"80000053-3" = "（たくさんの生徒の中から、何だか変な歩き方をしているコハルを見つけた）"
"80000053-4-コハル" = "せ、先生遅い！！"
"80000053-5" = "[s1] \"……あれ？\"\n[s2] \"えっと、今コハルが来たような……？\""
"80000053-6-コハル" = "や、違う、これじゃない……えっと、こんなことが言いたかったんじゃなくて……。"
"80000053-7-コハル" = "そ、そりゃ私は今学校が終わったから……あ、あれ？私何言ってるの……？"
"80000053-8-コハル" = "と、とにかく！大事なのはそんなことじゃなくて……！"
"80000053-9-コハル" = "は、はいっ！！これ貰って！良いから、何も言わないで早く！"
"80000053-10" = "[ns3] \"あ、チョコレート。\"\n[ns4] \"バレンタインのプレゼントってことで貰って良い？\""
"80000053-11-コハル" = "そ、そうだけど……どうしてそんなに平常心なわけ！？バレンタインのチョコなのよ！生徒からの、特別な！！"
"80000053-12-コハル" = "そ、そうだけど……どうしてそんなに平常心なわけ！？バレンタインのチョコなのよ！生徒からの、特別な！！"
"80000053-13-コハル" = "も、もうちょっと何かこう、反応とかあるでしょ！？私だけうるさくしてるみたいじゃん！？"
"80000053-14-コハル" = "……って、先生？"
"80000053-15-コハル" = "な、何で開けて……え、今食べるの？"
"80000053-16-コハル" = "え、いや別にダメじゃないけど……。"
"80000053-17-コハル" = "……あっ！？"
"80000053-18" = "[s5] \"……コハル？\"\n[s6] \"どうしたの？\""
"80000053-19-コハル" = "や、その……買う時にはあんまり気にしてなかったっていうか……。"
"80000053-20-コハル" = "や、その……買う時にはあんまり気にしてなかったっていうか……。"
"80000053-21-コハル" = "そ、そのラッピングの柄とか、チョコの模様とかが、その……。"
"80000053-22" = "[s] \"……柄？\""
"80000053-23-コハル" = "な、何でもない！気にしないで！あくまでそういうラッピング！それだけだから、他意は無いから！"
"80000053-24-コハル" = "……。"
"80000053-25-コハル" = "な、何でそんな変な食べ方するの！？普通に食べて！あと箱も大事に扱って！"
"80000053-26" = "[s] \"普通だと思うけど……？\""
"80000053-27-コハル" = "ひゃあぁぁぁっ……！？な、何でそんな舐るみたいに……！"
"80000053-28-コハル" = "やっぱりわざとでしょ、分かってるんでしょ！？こんな公共の場で……！"
"80000053-29-コハル" = "そうやって私のこと辱めて、めちゃくちゃに……！"
"80000053-30-コハル" = "も、もしかしてこの状況も狙い通り！？私が見てるのを楽しんで、それを他の生徒たちに見られてるのも……！？"
"80000053-31" = "[s7] \"？？？\"\n[s8] \"コハル……？\""
"80000053-32-コハル" = "最っ低！変態！！！"
"80000053-33-コハル" = "最っ低！変態！！！"
"80000053-34-コハル" = "バーカ！お粗末様！！死刑だ死刑っ！！"
"80000053-35" = "（コハルが怒ってる理由がほぼ分からないまま、結局最後までその場でありがたく味わった）"
