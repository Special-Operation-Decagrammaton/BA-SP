[translation]
"80000090-1" = "保安委員長の勲章"
"80000090-2-マリナ" = "先生、急に呼び出してすまない。"
"80000090-3-マリナ" = "私一人では解決できそうにない問題が生じてな。"
"80000090-4-マリナ" = "ぜひ先生の知恵を貸してほしい。"
"80000090-5" = "[s1] \"うん、大丈夫だよ。\"\n[s2] \"どんな問題が起きたの？\""
"80000090-6-マリナ" = "先生は「チェリョンカ」というチョコレートを知っているか？"
"80000090-7-マリナ" = "先生は「チェリョンカ」というチョコレートを知っているか？"
"80000090-8-マリナ" = "レッドウィンター連邦学園で生産されているのだが、ミルクのバランスによる甘みが評判で、学園外でも愛されている。"
"80000090-9-マリナ" = "ただ、原材料の供給が不安定でな……思うように生産量が伸びないという問題が存在した。"
"80000090-10-マリナ" = "そこでチェリノ会長から、チェリョンカ工場の管理監督者に任じられたのだ。#n今月になって、ようやく昨年比200％の生産量を達成したのだが……。"
"80000090-11" = "[s] \"すごい、200%も！？\""
"80000090-12" = "[ns] \"でも何だか、表情が暗いけど……？\""
"80000090-13-マリナ" = "私の功績を認めたチェリノ会長が、特別に勲章を下さってな……"
"80000090-14-マリナ" = "……これだ。"
"80000090-15" = "[ns] \"……チョコレート？\""
"80000090-16-マリナ" = "ああ。この「特別功労勲章チョコレート」は他の勲章と違い、チェリョンカと同じ成分のミルクチョコレートで作られている。"
"80000090-17-マリナ" = "チョコレートの生産量を上げたのだから、ならばチョコレートを、というお気持ちはよく分かるのだが……"
"80000090-18-マリナ" = "このままでは、いずれ腐ってしまうだろう。#nだが、チェリノ会長から頂いた勲章を、冷蔵庫に入れたままというのも……"
"80000090-19-マリナ" = "要は、勲章の保管方法に悩んでいるわけだ。"
"80000090-20-マリナ" = "先生、何か良い案は無いだろうか？"
"80000090-21" = "[s3] \"チョコレートなんだし……\"\n[s4] \"食べちゃうのはどうかな？\""
"80000090-22-マリナ" = "く、勲章を食べろと！？#nそれでは無くなってしまうじゃないか！"
"80000090-23-マリナ" = "く、勲章を食べろと！？#nそれでは無くなってしまうじゃないか！"
"80000090-24-マリナ" = "これを貰うまで、私は数ヶ月にも及ぶ苦労を重ねてきた。"
"80000090-25-マリナ" = "なのに食べてしまったら、その努力と矜持を証明できなくなる……。"
"80000090-26-マリナ" = "そんなこと、出来るわけないだろう！"
"80000090-27" = "[s] \"勲章が無くても、マリナの努力は証明できるよ。\""
"80000090-28-マリナ" = "ほう……そんな方法があるのか？"
"80000090-29-マリナ" = "褒美に受け取ったのは、この勲章だけなのだが……"
"80000090-30" = "[s] \"マリナの頑張りは、みんなが覚えてるはず。\""
"80000090-31" = "[ns] \"形がなくなっても、記憶には残ってるから。\""
"80000090-32-マリナ" = "……であれば、この勲章は先生に食べてもらいたい。"
"80000090-33" = "[s5] \"私に……？\"\n[s6] \"マリナにとって、そんな大事な物を……？\""
"80000090-34-マリナ" = "もちろん、大事な物に変わりはない。#nしかし、私は先生の助言がなければ、勲章が消えるのを惜しんで腐らせていたはずだ。"
"80000090-35-マリナ" = "もちろん、大事な物に変わりはない。#nしかし、私は先生の助言がなければ、勲章が消えるのを惜しんで腐らせていたはずだ。"
"80000090-36-マリナ" = "それこそ勲章の価値を……そしてチェリノ会長のご厚意を無下にするところだった。"
"80000090-37-マリナ" = "その助言への恩返しをしたいのだが……あいにく私が今持っているのは、これだけだ。"
"80000090-38-マリナ" = "私の努力と矜持は、他の生徒たちが覚えていてくれる。#nありがたいことに、その価値が変わることはないだろう。"
"80000090-39-マリナ" = "ならばせめて、消えるとしてもこの勲章……"
"80000090-40-マリナ" = "私の名誉は、それを気づかせてくれた先生にこそ、受け取ってほしい。"
