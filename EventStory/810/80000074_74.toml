[translation]
"80000074-1" = "慣れないこと"
"80000074-2" = "（カズサから連絡をもらい、放課後に空き教室を訪れた）"
"80000074-3-カズサ" = "先生、時間通り来てくれたんだ。"
"80000074-4-カズサ" = "あ、いや……頼み事があるとか、そういうんじゃないけど……"
"80000074-5-カズサ" = "……わ、わざわざ口にさせたいの？#n今日はバレンタインデーだって、分かってるでしょ。"
"80000074-6-カズサ" = "だから、先生にあげようと思って……はい、これ。"
"80000074-7" = "[ns1] \"苺を使ったチョコケーキ？\"\n[ns2] \"ありがと、美味しそうだね。\""
"80000074-8-カズサ" = "まあ、その……こういう日なのにあげないのも、逆に意識してるみたいじゃん……。"
"80000074-9-カズサ" = "まあ、その……こういう日なのにあげないのも、逆に意識してるみたいじゃん……。"
"80000074-10-カズサ" = "ほ、ホントにそれだけだから。#nでもどうせ、先生のことだし他の子からもたくさん貰ってるでしょ。#nだから別に、要らなかったら……良いんだけど。"
"80000074-11-カズサ" = "……そ、そんなに嬉しいの？"
"80000074-12-カズサ" = "……え？いや、まあそれは私も嬉しいけど……ちゃんと食べてよ。腐っちゃうし。"
"80000074-13-カズサ" = "……はぁ、またそんなこと軽く言っちゃってさ……。"
"80000074-14-カズサ" = "……何でもないよ。#n先生の人たらしは今に始まったことじゃないし。"
"80000074-15-カズサ" = "そういえば……てきとうに選んじゃったけど、味が好みじゃなかったら――"
"80000074-16-カズサ" = "……ん？"
"80000074-17-カズサ" = "チョコレートじゃなくてケーキにした理由……？"
"80000074-18-カズサ" = "うーん、特に具体的な何かがあったわけじゃないけど。"
"80000074-19-カズサ" = "普段から、苺のケーキを食べてるからかな……。#nバレンタインデーだから、チョコバージョンが売ってて。"
"80000074-20-カズサ" = "……え？"
"80000074-21-カズサ" = "べ、別にそういうわけじゃないし。"
"80000074-22-カズサ" = "そ、そんなに食い意地張ってるように見える？"
"80000074-23-カズサ" = "もうっ、そこまで言うなら自分で食べるけど！？#nせっかく先生のために買ってきたのに……！"
"80000074-24-カズサ" = "……普段プレゼントとか、一緒に何か食べたりとかしないでしょ？#nだから、けっこう私なり悩んで……"
"80000074-25-カズサ" = "……似合わないことだってくらい、分かってる。でも、でもさぁ……！"
"80000074-26-カズサ" = "……え、この間行ったケーキ屋さん？"
"80000074-27-カズサ" = "いや、覚えてるけど……？#nうん、その前に、スイーツ差し入れに行った時も……"
"80000074-28-カズサ" = "だから何――"
"80000074-29-カズサ" = "……"
"80000074-30-カズサ" = "……？"
"80000074-31-カズサ" = "……あれ？"
"80000074-32-カズサ" = "……意外とプレゼントしてるし、一緒に食べにも行ってる？"
"80000074-33" = "[s3] \"そうだね、割とよく。\"\n[s4] \"日常的なことって、特に意識しないよね。\""
"80000074-34-カズサ" = "えっと、その……。"
"80000074-35-カズサ" = "……先生。"
"80000074-36-カズサ" = "もしかして、その……一応聞いてみたいんだけど……。"
"80000074-37-カズサ" = "私って、結構……"
"80000074-38-カズサ" = "私ってめんどくさい、かな……？"
"80000074-39" = "[s5] \"そんなことないよ。\"\n[s6] \"とりあえず、一緒にこのケーキ食べない？\""
"80000074-40-カズサ" = "…………。"
"80000074-41-カズサ" = "…………。"
"80000074-42-カズサ" = "……はぁ。"
"80000074-43-カズサ" = "ちょっと最近、浮かれすぎだったかも……。"
"80000074-44" = "（その後、カズサは気恥ずかしさを振り払うように、ケーキの上のイチゴをフォークで勢いよく刺した）"
"80000074-45" = "（二人でケーキを食べ終えた後も、カズサの頬はまだ少し赤かった）"
