[translation]
"80000028-1" = "チョコレート味の秘薬"
"80000028-2" = "サヤの研究室"
"80000028-3" = "（連絡を受けて、サヤの研究室を訪れた。）"
"80000028-4-サヤ" = "ぼく様の研究室へようこそなのだ、先生！"
"80000028-5-サヤ" = "今日は先生に試してみたい薬があって、ここに呼んだのだ。"
"80000028-6-サヤ" = "それはこの……チョコレートで作った、不老不死の霊薬！"
"80000028-7-サヤ" = "外に出たらチョコがやたら安く売り出されてたから、せっかくだしチョコレートを使った霊薬を作ってみたのだ。"
"80000028-8" = "[s] 逃げる。"
"80000028-9-サヤ" = "ちょっ、どうして逃げるのだ先生！"
"80000028-10-サヤ" = "これも全ては、錬丹術の発展のために必要なことなのに！"
"80000028-11" = "[s] \"チョコレートでどうやって不老不死の薬を……？\""
"80000028-12-サヤ" = "チョコレートには抗酸化作用のある成分がたくさん含まれているのだ。"
"80000028-13-サヤ" = "これらの成分を取り出して濃縮、そして他の色んな材料と混ぜれば、身体の年齢を戻すことができそうだと思わないか？"
"80000028-14-サヤ" = "それで完成したのが、この薬。"
"80000028-15-サヤ" = "さあ、先生。心配せずにグイッと行くのだ。チョコを使ってることもあって、味も悪くないはず。"
"80000028-16" = "[s] 覚悟を決めて、サヤから渡された薬を飲む。"
"80000028-17-サヤ" = "効果はどうだ？若返ったか？"
"80000028-18" = "[s] \"よく分からないかも……。\""
"80000028-19-サヤ" = "そうなのか……？うーん、若返らなかったとしても、身体が光るとか毛が生えるとか、そういう効果はあるはずなのに……。"
"80000028-20" = "[s] \"その副作用を知ってて飲ませたんだね……。\""
"80000028-21-サヤ" = "まあまあ。とりあえず、成分の分析でもしてみるのだ。"
"80000028-22-サヤ" = "うーん、これは……あんなにたくさん材料を混ぜたのに、完成品の成分はほぼ普通のチョコレートになってるのだ。中和されちゃったかな？"
"80000028-23-サヤ" = "最終的にはただのチョコレートになった、と……。"
"80000028-24-サヤ" = "仕方ない。失敗作っぽくて申し訳ないけど、これは先生にあげるのだ。"
"80000028-25-サヤ" = "どうせチョコなんだし、そもそもぼく様はそんなにチョコレート好きじゃないし。"
"80000028-26-サヤ" = "それに今日普通に渡したら、なんか変な感じになるし……。"
"80000028-27-サヤ" = "え、今日……？もしかして先生、本気で聞いてるのか？"
"80000028-28-サヤ" = "……。"
"80000028-29-サヤ" = "やっぱり、深刻な副作用が出てるかもしれないのだ。このままここで、検査でもするか？"
