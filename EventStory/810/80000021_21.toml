[translation]
"80000021-1" = "特別なエナジードリンク"
"80000021-2" = "（シャーレの仕事の関係で、ハレに助けを求めるためにヴェリタスの部室を訪れていた）"
"80000021-3" = "（ハレに手伝ってもらい、5時間ほど経った頃……）"
"80000021-4" = "ヴェリタス・部室"
"80000021-5-ハレ" = "このノードかな。うん、違法な武器を販売してる不良たちの取引記録が……"
"80000021-6-ハレ" = "あれ、大丈夫？先生？"
"80000021-7-ハレ" = "何だか、すごく疲れた顔してるけど。"
"80000021-8" = "[s] \"お願いしてる立場なのにごめん……。\""
"80000021-9-ハレ" = "……あ、でも確かに。もうこんな時間。"
"80000021-10-ハレ" = "ごめん、私昼夜逆転してるから……全然気が付かなかった。"
"80000021-11" = "[s] \"大丈夫。気にしないで。\""
"80000021-12" = "[ns] \"何か目が覚めそうな飲み物とかあったりする……？\""
"80000021-13-ハレ" = "目が覚める飲み物……コーヒーは切れてるから……。"
"80000021-14-ハレ" = "あ、そういえば。"
"80000021-15-ハレ" = "はい、どうぞ。「妖怪MAX」。"
"80000021-16-ハレ" = "カフェインたっぷりだから、すぐに目が覚めると思う。"
"80000021-17" = "[s] \"ありがとう。あれ、初めて見たデザインかも。\""
"80000021-18-ハレ" = "うん、これは今年のバレンタイン限定の「妖怪MAX」だから。"
"80000021-19-ハレ" = "限定版だから、もう手に入らないだろうけど……。"
"80000021-20-ハレ" = "先生に渡すなら全然アリかなって。"
"80000021-21" = "（ハレに貰った「妖怪MAX」のチョコレート味は、中々刺激的な味だったけれど、確かに目は覚めた。）"
