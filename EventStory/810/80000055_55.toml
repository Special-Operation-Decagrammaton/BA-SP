[translation]
"80000055-1" = "どこから食べれば……？"
"80000055-2" = "（ちょうど時間通りに到着すると、噴水の前でマリーが待っていた）"
"80000055-3-マリー" = "あ、先生……！わざわざお越しいただき、ありがとうございます。"
"80000055-4-マリー" = "えっと、用件はその……実は……。"
"80000055-5-マリー" = "……。"
"80000055-6-マリー" = "こ、これを……！"
"80000055-7" = "[ns1] \"何これすごい！？\"\n[ns2] \"チョコレート、だよね……！？\""
"80000055-8-マリー" = "い、一応チョコレートです……！"
"80000055-9-マリー" = "は、はい！"
"80000055-10-マリー" = "今日はバレンタインデー……。"
"80000055-11-マリー" = "日頃から感謝を伝えたい方に、チョコレートを通じて気持ちを伝える日だと聞きました。"
"80000055-12-マリー" = "でしたら、やはり先生にはどうしてもお渡ししたいなと思ったんです。"
"80000055-13-マリー" = "ただ、何をお渡しすればと悩んでいるうちに、考え込んでしまい……。"
"80000055-14-マリー" = "気が付いたらなぜか、これを買っていて……。"
"80000055-15-マリー" = "や、やっぱり変でしょうか……？もっと普通のチョコレートの方が……。"
"80000055-16" = "[s3] \"ううん、良いと思うよ。\"\n[s4] \"インパクトもあって良いんじゃないかな。\""
"80000055-17-マリー" = "そ、そうでしたか……？"
"80000055-18-マリー" = "そ、そうでしたか……？"
"80000055-19-マリー" = "ふふっ……。"
"80000055-20-マリー" = "ありがとうございます、先生。"
"80000055-21-マリー" = "その、ずっと緊張していたんです。"
"80000055-22-マリー" = "これで大丈夫なのか、そもそもお渡しして良いのか、と……。"
"80000055-23-マリー" = "ですがお渡しできて良かったです。先生に、気持ちを伝えることができて……。"
"80000055-24-マリー" = "……？"
"80000055-25-マリー" = "先生、どうされましたか？そんなにチョコレートを見つめられて……。"
"80000055-26-マリー" = "……え？"
"80000055-27-マリー" = "これを食べるのは色々な面で大丈夫なのか……？"
"80000055-28-マリー" = "……。"
"80000055-29-マリー" = "……え、っと。"
"80000055-30-マリー" = "それは、その……。"
"80000055-31-マリー" = "あ、頭の部分はちょっとアレですが……手も、ちょっと……服の裾とか、でしたら……？"
"80000055-32-マリー" = "あ、あれ、どこまでなら食べても大丈夫なのでしょうか……！？"
"80000055-33-マリー" = "わ、私たちは一体、どうすれば……！！"
"80000055-34" = "（その後マリーとしばらく、どの部分なら食べて良いのかで一緒に悩んだ）"
"80000055-35" = "（……結局何時間悩んでも答えが出ず、マリーもそれで納得したようなので、大事に飾っておくことにした）"
