"80000054-6-スズミ" = "……あ、私ですか？私は飲み物と弾薬の補充を。"
"80000054-7-スズミ" = "……ああ。"
"80000054-8-スズミ" = "そう言えば、本日はバレンタインデーでしたね。何やら内装が綺麗になっていたと思ったら、なるほど。"
"80000054-9-スズミ" = "バレンタインデー……。"
"80000054-10-スズミ" = "……。"
"80000054-11" = "[s1] \"……スズミ？\"\n[s2] \"どうした？\""
"80000054-12-スズミ" = "いえ。せっかくこうしてお会いできたのに、ただの偶然と見過ごすには少しもったいないと。"
"80000054-13-スズミ" = "いえ。せっかくこうしてお会いできたのに、ただの偶然と見過ごすには少しもったいないと。"
"80000054-14-スズミ" = "何か先生に、お渡しできればと思いまして。"
"80000054-15-スズミ" = "あ、もちろんそれが嫌でなければ、ですが……。"
"80000054-16-スズミ" = "……嫌なわけが無い、ですか？"
"80000054-17-スズミ" = "……流石は先生ですね、ありがとうございます。"
"80000054-18-スズミ" = "では、何だかその場で選ぶのも申し訳ないのですが……。"
"80000054-19-スズミ" = "こちらなど、いかがでしょうか？"
"80000054-20" = "[s3] \"星の形……。\"\n[s4] \"キラキラしてる！\""
"80000054-21-スズミ" = "いかがでしょう？"
"80000054-22-スズミ" = "いかがでしょう？"
"80000054-23-スズミ" = "……理由、ですか？"
"80000054-24-スズミ" = "ああいえ、その……何か具体的な理由というよりも、直感的にと言いましょうか。"
"80000054-25-スズミ" = "……確かにそう考えると、なぜなのでしょう。"
"80000054-26" = "[s5] \"スズミらしいと思うよ。\"\n[s6] \"閃光弾といえばこれ、みたいな？\""
"80000054-27-スズミ" = "そ、それはまた反応に困ると言いますか……。"
"80000054-28-スズミ" = "そ、それはまた反応に困ると言いますか……。"
"80000054-29-スズミ" = "何か、別のものにしましょうか。"
"80000054-30-スズミ" = "……はい？これが良い、ですか？"
"80000054-31" = "[s] \"せっかくスズミが選んでくれたものだから。\""
"80000054-32-スズミ" = "……。"
"80000054-33-スズミ" = "……承知しました。それでは、これを。"
"80000054-34-スズミ" = "先生のお時間を頂いてしまってすみません、そろそろ行きましょうか。"
"80000054-35-スズミ" = "……せっかくですし、先生。"
"80000054-36-スズミ" = "帰り道は久しぶりにエスコート、させていただけませんか？"
"80000054-37" = "（そうしてスズミにエスコートしてもらいながら、安心安全にシャーレまで帰った）"
