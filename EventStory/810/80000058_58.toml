[translation]
"80000058-1" = "悩んだ末に"
"80000058-2" = "（公園に向かうと、ブランコに座ってそわそわしているアイリの姿が見えた）"
"80000058-3-アイリ" = "……。"
"80000058-4-アイリ" = "せ、先生！？いつからそこに……！？"
"80000058-5-アイリ" = "さ、さっきですか？そうでしたか……すみません、ちょっと考えこんじゃってまして……えへへ……。"
"80000058-6-アイリ" = "きょ、今日はその、もしかしたらご存じかと思いますが……。"
"80000058-7-アイリ" = "あ、いえ、先生はお忙しいですし、分かっててほしいと思っているわけではないのですが……。"
"80000058-8-アイリ" = "あ、えっと、それだともしかしてこれは、ご迷惑なのでは……！？"
"80000058-9" = "[s1] \"何となくは分かってるかも。\"\n[s2] \"私の自惚れじゃなければ、バレンタインデーだから、とか？\""
"80000058-10-アイリ" = "……！"
"80000058-11-アイリ" = "……！"
"80000058-12-アイリ" = "は、はい、そうです……。"
"80000058-13-アイリ" = "えっと……。"
"80000058-14-アイリ" = "分かってても緊張しちゃいますね……ど、どうぞっ！"
"80000058-15" = "[ns3] \"……。\"\n[ns4] （やっぱりいつものフレーバーだ！）"
"80000058-16-アイリ" = "……。"
"80000058-17-アイリ" = "……。"
"80000058-18-アイリ" = "せ、先生？その……？"
"80000058-19-アイリ" = "……え？"
"80000058-20-アイリ" = "チョコミント……？"
"80000058-21-アイリ" = "や、やっぱりダメでしたか！？すみません、実は自分でも迷ったのですが……！"
"80000058-22-アイリ" = "何だかラインナップを見てグルグル悩んでいる内に、結局戻ってきたと言いますか……。"
"80000058-23-アイリ" = "すみません、上手く説明できないのですが……あはは……。"
"80000058-24-アイリ" = "何だか一周回って、いつも通りになっちゃった感じですね……。"
"80000058-25" = "[s5] \"色々考えてくれたんだね、ありがとう。\"\n[s6] \"ううん、嬉しいよ。\""
"80000058-26-アイリ" = "……！"
"80000058-27-アイリ" = "……！"
"80000058-28-アイリ" = "あ、ありがとうございます……！"
"80000058-29-アイリ" = "……あ、その。"
"80000058-30-アイリ" = "実はこれ、普通のチョコミントでは無いんです。"
"80000058-31-アイリ" = "見ての通りチョコレートとミントの比率も斬新ですし、普通は使わないようなペニーロイヤルを上手く使っていて……！"
"80000058-32-アイリ" = "……そのお顔、もしかして分からない感じです？"
"80000058-33-アイリ" = "ちゃ、ちゃんと見てください！全然違うんですよ……！"
"80000058-34-アイリ" = "これはペニーロイヤルという普通なら食べられないミントでして、それを特殊な製法によって……！"
"80000058-35-アイリ" = "……"
"80000058-36-アイリ" = "……ね、すごいと思いません？"
"80000058-37" = "[s] \"……\""
"80000058-38" = "（申し訳ないことにあまり理解はできなかったものの、美味しく頂いた）"
