[translation]
"10055080-1" = "第8話;ライフ・オブ・ビス丸"
"10055080-2-マコト" = "全部外れました！"
"10055080-3-マコト" = "ちっ！小さくてすばしっこいな。"
"10055080-4-マコト" = "というよりは私たちが下手なだけな気がします！"
"10055080-5-チアキ" = "外れたなら当たるまで撃てばいい！続けろ！"
"10055080-6-イブキ" = "ううん……。"
"10055080-7-イブキ" = "あっ！"
"10055080-8-イブキ" = "これをーこうしたらー……。"
"10055080-9-イブキ" = "じゃじゃーん！"
"10055080-10-マコト" = "まだだ、もう一度だ！"
"10055080-11-マコト" = "マコト先輩、マコト先輩！"
"10055080-12-イブキ" = "あっ、今はキャプテンだった……！"
"10055080-13-イブキ" = "キャプテンマコト！"
"10055080-14-マコト" = "ん？どうしたイブキ？"
"10055080-15-マコト" = "……おお！？これはもしや艦砲の弾道表か？"
"10055080-16-イブキ" = "うん！これで悪い人たちお説教！"
"10055080-17-マコト" = "よくやったイブキ！でも……どこでこれを？"
"10055080-18-イブキ" = "イブキが作った！"
"10055080-19-マコト" = "……この一瞬で、自分で計算しただと……！？"
"10055080-20-イブキ" = "うん！こういう大砲はあんまりライフリングがないから、正確には計算できないけど……。"
"10055080-21-マコト" = "照準を調整した感じ、変わる距離が同じだったの！#nだからどんな角度で撃てば当たりやすくなるか、計算してみたんだ！"
"10055080-22-イブキ" = "どう？イブキえらい？賢い？"
"10055080-23-マコト" = "分かってはいたが……本当にゾッとするほどの才能だ……！"
"10055080-24-マコト" = "よくやったイブキ！諸君、全員注目！"
"10055080-25-マコト" = "奴らをギャフンと言わせる時が来た！#n指示に従って、全ての大砲の角度を調整せよ！"
"10055080-26-トライデントの部員A" = "うわっ、あいつら急に射撃の腕が上がった！？"
"10055080-27-トライデントの部員A" = "誰か前装式の有効射程知ってる人～？"
"10055080-28-トライデントの部員B" = "そんな化石の射程なんて誰が知ってるのよ？"
"10055080-29-トライデントの部員C" = "あっちの口径の方が大きいし、射程距離の戦いだと不利かも……？"
"10055080-30-トライデントの部員B" = "いや、でもこっちは現代の兵器だよ！？"
"10055080-31-トライデントの部員A" = "でも機関銃じゃ効かないでしょ！こっちは一撃貰ったら沈没だよ！？"
"10055080-32-トライデントの部員A" = "キャプテン！なんとかしてよ！"
"10055080-33-スミカ" = "……えっ？私ですか？"
"10055080-34-スミカ" = "いえいえキャプテンだなんて、そんなそんな！#n私たちは各々の役割をこなしてるだけです！"
"10055080-35-トライデントの部員A" = "おい、逃げたぞ！捕まえろ！"
"10055080-36-トライデントの部員B" = "一人だけとんずらするつもり！？"
"10055080-37-スミカ" = "ちょ、ちょっとやめてください！私キャプテンですけど！？#nこれ反乱ですよね！？"
"10055080-38-トライデントの部員C" = "……体当たりでいこう。"
"10055080-39-トライデントの部員A" = "……え？"
"10055080-40-トライデントの部員C" = "手元の武器じゃ無理でしょ？あっちとの射程差も分からないし。"
"10055080-41-トライデントの部員C" = "つまり一番の[ruby=・   ・]武器[/ruby]をゼロ距離でぶち込んじゃえばいいんですよ。"
"10055080-42-トライデントの部員A" = "……いやなんでそうなるんです？"
"10055080-43-トライデントの部員A" = "いいや！それが正しいかもよ！？"
"10055080-44-トライデントの部員A" = "今も昔も、海戦は体当たりが一番だし！"
"10055080-45-スミカ" = "昔のことは知りませんが、今は違います……。"
"10055080-46-スミカ" = "え？私だけが常識人みたいな、そんな状況じゃないですよね？"
"10055080-47-トライデントの部員B" = "……合ってるよ。"
"10055080-48-トライデントの部員B" = "「速度×質量＝パワー」！！"
"10055080-49-スミカ" = "さあ！全速前進ー！！"
"10055080-50-スミカ" = "ヨーソロー！"
"10055080-51-スミカ" = "……。"
"10055080-52-チアキ" = "うああああっ！？"
"10055080-53-イロハ" = "突っ込んできた！？バカですか！？"
"10055080-54-イロハ" = "なっ！？このビス丸に穴がっ！？"
"10055080-55-イロハ" = "いつの間に名前まで……。"
"10055080-56-海賊A" = "キャプテン！奴ら、こっちの船を奪おうとしてます！！"
"10055080-57-海賊B" = "船に開いた穴から侵入を！！"
"10055080-58-マコト" = "これは……[ruby=マン・オブ・パンデモニウム]我が万魔船も、[/ruby]見くびられたものだ。"
"10055080-59-マコト" = "お前らっ！！存分にもてなしてやれっ！！！！"
