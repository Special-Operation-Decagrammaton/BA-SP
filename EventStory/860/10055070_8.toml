[translation]
"10055070-1" = "第7話;Fools in August"
"10055070-2-トライデントの部員A" = "……今日は霧がひどいな。"
"10055070-3-トライデントの部員A" = "こんな日に見回りなんて……。"
"10055070-4-トライデントの部員B" = "まあどうせ何もないでしょ。"
"10055070-5-トライデントの部員B" = "今日は特に申請もなかったし、AISにも何もないし。"
"10055070-6-トライデントの部員B" = "適当に見て……。"
"10055070-7-トライデントの部員B" = "……んん？"
"10055070-8-トライデントの部員B" = "ちょっと、こっちに双眼鏡ちょうだい。"
"10055070-9-トライデントの部員B" = "…………。"
"10055070-10-スミカ" = "スターボードにて、報告！"
"10055070-11-？？？" = "……。"
"10055070-12-？？？" = "…………。"
"10055070-13-？？？" = "スターボード、どうしました？"
"10055070-14-？？？" = "報告を続けてください。"
"10055070-15-トライデントの部員A" = "あ、スミカちょうどいいところに！"
"10055070-16-スミカ" = "「キャプテン」です！"
"10055070-17-トライデントの部員B" = "キャプテンって、別にくじ引きで決めたのに……。"
"10055070-18-スミカ" = "キャ・プ・テン・っ！"
"10055070-19-トライデントの部員B" = "分かった分かった、キャプテン。"
"10055070-20-トライデントの部員A" = "ほんと肩書きとか好きだよね……。"
"10055070-21-スミカ" = "というか、なんで途中で報告をやめたんですか？"
"10055070-22-スミカ" = "居眠りしてて見間違えたとか……じゃないですよね？"
"10055070-23-トライデントの部員A" = "あ、そうそう。"
"10055070-24-スミカ" = "いや……でも、これって。"
"10055070-25-トライデントの部員B" = "あんたも見たでしょ？"
"10055070-26-トライデントの部員A" = "いやそうだけど……でも有り得ないじゃん？"
"10055070-27-スミカ" = "ちょっと、コソコソしないでください！"
"10055070-28-スミカ" = "このハルピュイア号で起きること全部、キャプテンは把握しないといけないんですから！！"
"10055070-29-トライデントの部員A" = "……らしいよ？"
"10055070-30-トライデントの部員A" = "えー……はあ、じゃあ言っちゃうよ？"
"10055070-31-トライデントの部員A" = "スターボードにて、報告！"
"10055070-32-トライデントの部員A" = "帆船1隻、方位010度！距離1000ヤード！"
"10055070-33-トライデントの部員A" = "真正面から本船に接近中！"
"10055070-34-スミカ" = "……あの。私のことが嫌いなのは分かりますが。"
"10055070-35-スミカ" = "部長でも副部長でもない私がキャプテンになって気に食わないのは分かります。#nでも見回りに毎回お二人が同行できるわけじゃありません。"
"10055070-36-スミカ" = "だから私は航海の安全のために、たとえ～皆さんに嫌われたと～しても！#nこの役割を担おうと……。"
"10055070-37-スミカ" = "いや、変人扱いしないで！？"
"10055070-38-トライデントの部員A" = "自分の目で確かめてよ！"
"10055070-39-スミカ" = "……いや、どうせ何もな――"
"10055070-40-スミカ" = "……？"
"10055070-41-スミカ" = "何ですかあれ？"
"10055070-42-トライデントの部員A" = "だから帆船だって。"
"10055070-43-スミカ" = "なんですか帆船って！？"
"10055070-44-トライデントの部員A" = "はあ？知らないの？昔の軍艦！大砲も載ってるやつ！"
"10055070-45-スミカ" = "そうじゃなくて！！というか1000ヤード！？目の前じゃないですか！"
"10055070-46-スミカ" = "あんな船がすぐそこにあるのに誰も気づかなかったんですか！？"
"10055070-47-トライデントの部員A" = "こんなひどい霧の中で、これ以上見えないよ。"
"10055070-48-トライデントの部員A" = "そうだ、レーダーは？レーダーはどうしたんですか！"
"10055070-49-スミカ" = "レーダーにはまだ何の信号もありません！"
"10055070-50-トライデントの部員A" = "……動力なし？無線封鎖？"
"10055070-51-トライデントの部員B" = "……軍艦って言っていたよね？"
"10055070-52-トライデントの部員A" = "つまり……大砲を装備した軍艦が、エンジンを切ったまま向かって来てるってこと？"
"10055070-53-トライデントの部員B" = "……。"
"10055070-54-トライデントの部員A" = "……キャプテン、どうする？"
"10055070-55-スミカ" = "なんでよりによって私がキャプテンの日にこんなことが？いっそのこと何も知りませんとか言っちゃう？いやでもキャプテンなのに知らないというのも責任者として……。"
"10055070-56-スミカ" = "あ、そうだ！まだ敵だと決まったわけじゃないんですよね？"
"10055070-57-スミカ" = "無線通信はどうですか？"
"10055070-58-スミカ" = "それがさっきからやってみてるけど、応答なし。"
"10055070-59-スミカ" = "サーチライトで警告は？"
"10055070-60-スミカ" = "だいぶ前からやってるけど反応なし。"
"10055070-61-スミカ" = "右に舵切ろうか？"
"10055070-62-スミカ" = "そ、それはダメです！"
"10055070-63-スミカ" = "1000ヤードしかないのに無理に舵を切って傾いたら……？それに攻撃でもされたら沈没……！悠久のハルピュイア号が私の責任によって！？それだけはダメ……！！"
"10055070-64-スミカ" = "キャプテン！音声をキャッチしました！"
"10055070-65-スミカ" = "船長帽らしきものを被った人の声です。"
"10055070-66-スミカ" = "おお！今そっちに行きます！"
"10055070-67-スミカ" = "いや、やっぱ時間ないのでデッキに流してください！"
"10055070-68-スミカ" = "まあ、どうせただの誤解だと思いますけど～"
"10055070-69-スミカ" = "だってオデュッセイアですよ？ど～このバカが海で私たちに喧嘩を売るんですか？"
"10055070-70-？？？" = "真の海賊がやることと言えば一つ！"
"10055070-71-？？？" = "キヴォトス中の金銀財宝を略奪するのだ！ヨーホホ！"
"10055070-72-トライデントの部員A" = "…………。"
"10055070-73-スミカ" = "…………。"
"10055070-74-スミカ" = "……いや待てよ。"
"10055070-75-スミカ" = "相手は旧式の船に乗ったただの寄せ集め海賊。一方こちらは精鋭部隊トライデント。今ここで奴らを打ちのめせば当然功績は私に……！"
"10055070-76-スミカ" = "キャプテン？"
"10055070-77-スミカ" = "すぅー……はぁー……。"
"10055070-78-スミカ" = "総員、戦闘配置へ！海賊を掃討します！！"
"10055070-79-トライデントの部員A" = "アイアイキャプテン！！"
"10055070-80-マコト" = "くそっ、海軍の奴ら、もう匂いを嗅ぎつけて！？"
"10055070-81-マコト" = "海軍ってなんですか！？本当の海賊でもないのに！？"
"10055070-82-イロハ" = "そんなことはどうだっていい！#n今マコト様の船がハチの巣にされているのだぞ！"
"10055070-83-マコト" = "やられっぱなしでたまるか！"
"10055070-84-マコト" = "諸君！これより私の指示に従って応戦する！"
"10055070-85-マコト" = "……何をしている？"
"10055070-86-海賊A" = "いや、その……戦うったって。"
"10055070-87-海賊A" = "どうやって？"
"10055070-88-マコト" = "この船には立派な大砲がついていただろう？"
"10055070-89-マコト" = "無理です。"
"10055070-90-マコト" = "さっき言おうとしたんですが、この船の大砲、中まで完全に錆びついてます。"
"10055070-91-マコト" = "表面だけ綺麗にすればいいって話じゃありません。"
"10055070-92-マコト" = "……そうか、お前たちもそれを知っててじっとしていたのか。"
"10055070-93-海賊A" = "はい……実はこの船、武装はないです。"
"10055070-94-海賊A" = "それにあっしら、戦ったこともないです、キャプテン。"
"10055070-95-マコト" = "理解した。"
"10055070-96-マコト" = "お前らがどれだけ愚か者なのかをな！！"
"10055070-97-マコト" = "大砲が錆びている？それがどうした！"
"10055070-98-マコト" = "だからって船が海の藻屑になるのをただ見てるつもりか！？"
"10055070-99-海賊A" = "いやだって……。"
"10055070-100-海賊A" = "ダメなものはダメだし……。"
"10055070-101-マコト" = "できない理由か？やらない理由なのか？"
"10055070-102-マコト" = "戦ったこともないと言っていたな。なら大砲が使えるかどうかも分からないのだろう。"
"10055070-103-マコト" = "なのに使う前から諦めるだと？それでもお前らは船乗りか！？"
"10055070-104-マコト" = "気合いが足りない！そもそも火器ってもんは気合いがあればなんとかなる！"
"10055070-105-マコト" = "いやそんなデタラメ……。"
"10055070-106-海賊A" = "自分を信じられないなら私を信じろ！"
"10055070-107-マコト" = "大砲は絶対に使えるはずだ！"
"10055070-108-マコト" = "みな所定の位置に移動！装填、発射準備！"
"10055070-109-海賊A" = "……でも無理なもんは無理ですよ、キャプテン。"
"10055070-110-海賊B" = "この船の大砲は……。"
"10055070-111-マコト" = "お前らがやらないなら構わん！"
"10055070-112-マコト" = "[ruby=われわれ]万魔船[/ruby]がやる！"
"10055070-113-サツキ" = "う、うん！？私たち！？"
"10055070-114-チアキ" = "あっ、はいはい！私やってみたいです！大砲の装填！"
"10055070-115-イブキ" = "イブキも手伝う！"
"10055070-116-サツキ" = "私はやめとくわね？みんな頑張って頂戴。"
"10055070-117-イロハ" = "何をバカげた……。"
"10055070-118" = "[s] \"イロハもやらない？\""
"10055070-119-イロハ" = "……でも、やるまでずっとああなんでしょうから。"
"10055070-120-イロハ" = "あの人には目の前で見せないと。できないものはできないって。"
"10055070-121-イロハ" = "どうせ勘違いなのに。説明すればいいものを……。"
"10055070-122-イロハ" = "本当めんどくさくて、イライラする人。"
"10055070-123-チアキ" = "よいしょ、よいしょ！"
"10055070-124-チアキ" = "よいしょ、よいしょ！"
"10055070-125-チアキ" = "どう？イブキ力になれてる？"
"10055070-126-チアキ" = "はい！おかげですごく軽いです！"
"10055070-127-イロハ" = "はあ……このタイプは、まず火薬を入れればいいんでしたっけ。"
"10055070-128-イブキ" = "あっ、ダメだよ！イロハ先輩！"
"10055070-129-イブキ" = "最初は火薬袋を入れないと！"
"10055070-130-イブキ" = "あううう……！"
"10055070-131-イロハ" = "あっ、イブキ！重い物は私が持ちますから！"
"10055070-132-イブキ" = "い、イロハ先輩！ありがとう！まだイブキの力じゃ……。"
"10055070-133-イブキ" = "次は砲弾！こうやってひもの束を入れて固定して……。"
"10055070-134-イブキ" = "最後に火薬を入れて火をつけるの！"
"10055070-135-イロハ" = "おお……すごく詳しいんですね。"
"10055070-136-イブキ" = "うん！いっぱい勉強したんだ！"
"10055070-137-海賊A" = "……。"
"10055070-138-海賊A" = "……。"
"10055070-139-マコト" = "諸君、装填はできたか！"
"10055070-140-イロハ" = "はあ、一応……。"
"10055070-141-マコト" = "返事が小さい！"
"10055070-142-イロハ" = "はい、キャプテン！"
"10055070-143-イロハ" = "あとは火をつけたらドカーン！って発射するよ！"
"10055070-144-マコト" = "さすがじゃないか、素晴らしい！"
"10055070-145-マコト" = "最初の一撃は私の号令に合わせて撃つ！"
"10055070-146-マコト" = "狙うはあの忌々しい海軍どもの船！"
"10055070-147-海賊A" = "無駄だって。"
"10055070-148-海賊A" = "できるわけないのに、バッカみたい……。"
"10055070-149-マコト" = "ヨーホホ！見ているがいい！"
"10055070-150-マコト" = "このマコト様が奇跡を起こして見せよう！"
"10055070-151-マコト" = "よーい……。"
"10055070-152-マコト" = "――撃て！！！"
"10055070-153-イロハ" = "……は？"
"10055070-154-イロハ" = "そんな、あり得ない……。"
"10055070-155-チアキ" = "わあ！すごい音！"
"10055070-156-イブキ" = "イブキもやってみる！えいっ！"
"10055070-157-マコト" = "ヨーホホ！やっぱり気合いの問題だったな。"
"10055070-158-海賊A" = "……大砲が使えた？"
"10055070-159-海賊B" = "あの日以来、二度と発射されなかった大砲が……。"
"10055070-160-マコト" = "諸君、反撃はここからだ！次を装填しろ！！"
"10055070-161-海賊たち" = "アイアイ！キャプテン！！！"
