[translation]
"10055110-1" = "後日談その2;海賊、忍者、万魔殿"
"10055110-2-イブキ" = "よっほっほ！"
"10055110-3-イブキ" = "イブキはおそろしー海賊だー！"
"10055110-4-イブキ" = "イブキがキャプテンで、くまさんが副キャプテン……。"
"10055110-5-イブキ" = "そしてニンペロさんは忍者！"
"10055110-6" = "[s1] \"忍者……？\"\n[s2] \"先生は？\""
"10055110-7-イブキ" = "あ、先生！"
"10055110-8-イブキ" = "海賊のこと、結構気に入ったようですねイブキ。"
"10055110-9-イブキ" = "うん！あのね、海賊はすごくカッコイイの！"
"10055110-10-イロハ" = "カッコイイのかは分からないですけど……イブキが好きならよかったです。"
"10055110-11-マコト" = "忍者に続き今度は海賊か。"
"10055110-12-マコト" = "もちろん、一番はマコト様だろうがな！キキキキッ！"
"10055110-13-イブキ" = "忍者……海賊……マコト先輩……？"
"10055110-14-マコト" = "全部好きってことだ！！！"
"10055110-15-マコト" = "「好き」に優劣などない！！！"
"10055110-16-？？？" = "あ、今不安になって無理やりまとめましたね。"
"10055110-17-イブキ" = "あっ。"
"10055110-18-イブキ" = "いいこと思いついた！忍者海賊万魔殿はどう？"
"10055110-19-マコト" = "よい！！！"
"10055110-20-マコト" = "分かってないのに適当な返事しないでください。"
"10055110-21-マコト" = "イブキの提案がよくないわけがないだろう！！"
"10055110-22-イロハ" = "いやまあ、そうですけど……。"
"10055110-23-イロハ" = "忍者海賊万魔殿って……怪しすぎませんか？"
"10055110-24" = "[ns3] \"忍者に、海賊……？\"\n[ns4] \"イブキは天才だった？\""
"10055110-25-マコト" = "……？"
"10055110-26-イロハ" = "私が世間についていけてないのでしょうか？"
"10055110-27-チアキ" = "あははっ！イロハちゃんは空気読まない派だもんね。"
"10055110-28-イロハ" = "その反対だと思ってますけど……？"
"10055110-29-チアキ" = "ん～そうかなあ？"
"10055110-30-チアキ" = "う……チアキ？"
"10055110-31-チアキ" = "あはは！ごめんごめん、でもイロハちゃんが不安そうな姿、珍しいからつい。"
"10055110-32-チアキ" = "あの……チアキ。"
"10055110-33-チアキ" = "え？"
"10055110-34-イロハ" = "すみませんでした。"
"10055110-35-イロハ" = "その、不安にさせましたよね。船でのこと。"
"10055110-36-チアキ" = "……！"
"10055110-37-チアキ" = "今の顔、今の顔もう一回だけ！"
"10055110-38-イロハ" = "ああっ、もう！今のなしです！"
"10055110-39-チアキ" = "もう一回だけ～～！お願い！撮らせて～～！！"
"10055110-40-イロハ" = "二度とするかっ！！"
