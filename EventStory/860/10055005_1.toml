[translation]
"10055005-1" = "プロローグ;キャスト・ガール・アウェイ"
"10055005-2" = "（蒸し暑さが続く、とある夏の日……）"
"10055005-3" = "（[ruby=パンデモニウム・ソサエティー]万魔殿から1通[/ruby]のビデオレターが届いた）"
"10055005-4-マコト" = "……。"
"10055005-5-マコト" = "…………。"
"10055005-6-チアキ" = "マコトせんぱーい？#n無言はちょっと……。"
"10055005-7-マコト" = "ん？ああ、もう回っているのか。"
"10055005-8-マコト" = "さっき声かけましたよ？#nやり直します？"
"10055005-9-マコト" = "いや、構わん。#nこの程度、どうということはない！キキッ！"
"10055005-10-マコト" = "――先生よ、喜ぶがいい！"
"10055005-11-マコト" = "今年の夏は酷暑が続いていて、先生も頭を悩ませていただろう？#nだが、このマコト様に任せれば良い！"
"10055005-12-マコト" = "先日――契約が無事成立してな。この栄光ある旅に先生も参加できることとなったのだ！キキキッ！"
"10055005-13-マコト" = "嬉しいだろう？きっと、驚いて腰を抜かしていることだろう。"
"10055005-14-マコト" = "……しかしビデオメッセージゆえに、顔を見れないのが残念だ。"
"10055005-15-イロハ" = "まぁ、だいたい想像つきますけどね。"
"10055005-16-イロハ" = "マコト先輩、そろそろ本題に入ってください。"
"10055005-17-マコト" = "キキキッ！言わずとも、先生なら当然把握していることだろう――"
"10055005-18-イブキ" = "マコト先輩たち何のお話してるのー？"
"10055005-19-マコト" = "あっ、イブキちゃん！"
"10055005-20-イブキ" = "先生にビデオレター？イブキもお話する！"
"10055005-21-イブキ" = "イブキちゃんこっち来て！#nはい、チーズ！"
"10055005-22-イブキ" = "チーズっ！えへへっ！どう？イブキ映ってる？"
"10055005-23-イブキ" = "はい、バッチリ！#n今日も万魔殿は絶好調です！"
"10055005-24-イブキ" = "あ、そうだ先生！#nイブキたちとの旅行の準備はちゃんとしてる？"
"10055005-25-イブキ" = "歯ブラシと歯磨き粉と……水着とパジャマと――"
"10055005-26-イブキ" = "あ！おやつも忘れないようにね！おやつは300円までです！#nはい、イブキと約束！"
"10055005-27-マコト" = "キキキッ！イブキ偉いぞ！完璧な説明だ！"
"10055005-28-マコト" = "……というわけだ。#nこの夏、我々は豪華客船を貸し切り――超豪華なクルーズ旅行を予定している！"
"10055005-29-マコト" = "風紀委員の連中が地獄の合宿で汗水流している間、我々は優雅に超超超超豪華旅行を楽しむというわけだ！"
"10055005-30-マコト" = "そして先生を招待し――風紀委員会との格の違いを見せつけてやろう！キキキキッ！"
"10055005-31-イロハ" = "はぁ……そんなことをして何の意味があるんですか。"
"10055005-32-イロハ" = "とりあえず、数泊はする予定ですので。#n来る時は連絡してください。"
"10055005-33" = "[ns1] （夏のバカンス……もうそんな時期）\n[ns2] （せっかく誘ってくれたし……行こうかな）"
"10055005-34" = "（そうして、しばし日常を離れ――ロマンチックな船旅へと向かった）"
"10055005-35" = "[log]漂 流  7 日 目[/log]"
"10055005-36-マコト" = "みっ……みずぅ……！"
"10055005-37" = "[ns3] \"マコト！！気をしっかり！マコトぉ――っ！！\"\n[ns4] \"ど、どうしてこんなことに……！！！\""
"10055005-38" = "（……事の起こりは7日前）"
