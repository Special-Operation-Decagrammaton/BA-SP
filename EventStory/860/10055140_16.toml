[translation]
"10055140-1" = "デイ・オブ・ザ・ロブスター"
"10055140-2" = "[log]漂 流 〇 日 目[/log]"
"10055140-3" = "[ns1] \"……今頃みんなはどうしてるんだろう。\"\n[ns2] \"元気にしてるかなぁ……。\""
"10055140-4-マコト" = "朝から弱気とはらしくないな、先生よ。"
"10055140-5-マコト" = "この私が統治するネオ・ゲヘナでの生活に、何か不満でもあるのか？"
"10055140-6" = "[s] \"ネオ……ゲヘナ？\""
"10055140-7-マコト" = "ああ、今朝……私は目覚めたのだ！"
"10055140-8-マコト" = "マコト様がいるこの船こそが真のゲヘナなのだと！"
"10055140-9-マコト" = "よって、ここを「ネオ・ゲヘナ」と名付けたのだ！"
"10055140-10-マコト" = "……どうした、先生？何か言いたげな顔だな。"
"10055140-11" = "[s3] \"その考え方は大事だなと思って。\"\n[s4] \"やっぱりマコトはたくましいね。\""
"10055140-12-マコト" = "キシシッ！要は褒めているということか！"
"10055140-13-マコト" = "先生も安心してこの時間を楽しんでくれ！救助隊はじき到着する！"
"10055140-14-チアキ" = "なるほど～！"
"10055140-15-チアキ" = "海での生活にはそんな悩みがあるんですね！"
"10055140-16-チアキ" = "おや、先生！"
"10055140-17-チアキ" = "え？あ、こちらはですね――"
"10055140-18-チアキ" = "ご紹介します！取材に協力いただいている、お魚のヨナさんです！"
"10055140-19-チアキ" = "袖振り合うも他生の縁！いえ、エラ振り合うも他生の縁！"
"10055140-20-チアキ" = "この広い海で出会えた奇跡！とても他人とは思えません！"
"10055140-21-チアキ" = "そんなわけで、色々とインタビューしていたんです。"
"10055140-22-チアキ" = "先生はどうされました？"
"10055140-23" = "[s5] \"えっと……少し立ち寄っただけ。\"\n[s6] \"インタビュー……頑張ってね。\""
"10055140-24-チアキ" = "はい！ありがとうございます！！"
"10055140-25-チアキ" = "それで、巨大魚に飲み込まれた話の続きなんですが――"
"10055140-26-イロハ" = "はぁ……本当、目も当てられませんね。"
"10055140-27" = "[s7] \"イロハ！\"\n[s8] \"よかった！大丈夫だったんだ――\""
"10055140-28-イロハ" = "……どうしました？幽霊でも見たような顔して。"
"10055140-29-イロハ" = "え？これですか？"
"10055140-30-イロハ" = "見ての通り虎丸ですけど？"
"10055140-31-イロハ" = "何か問題でも？"
"10055140-32-イロハ" = "主砲、装甲、異常なし……。"
"10055140-33-イロハ" = "特に変わったところはありませんが……？"
"10055140-34-イロハ" = "先生の気のせいじゃないんですか？"
"10055140-35-イロハ" = "……じゃあ、私は見回りがあるのでこれで。"
"10055140-36-イロハ" = "いきましょう、虎丸。"
"10055140-37-イロハ" = "ブーン。"
"10055140-38-サツキ" = "……陸に戻るまで、そっとしておいた方がよさそうね。"
"10055140-39" = "[s9] \"サツキ！！\"\n[s10] \"無事だったんだね！！\""
"10055140-40-サツキ" = "その言い方だと無事じゃない人もいるように聞こえるんだけど……。"
"10055140-41-サツキ" = "今の状況を見ると、そうじゃないとは言い切れないわよね。"
"10055140-42-サツキ" = "それにしても……マコトちゃんはさておき、イロハやチアキまで……。"
"10055140-43-サツキ" = "これじゃ万魔殿の面子は丸つぶれね。"
"10055140-44" = "[s11] \"マコトはさておくんだ……。\"\n[s12] \"みんな、ストレスが溜まっちゃってるみたいだね。\""
"10055140-45-サツキ" = "そうね、私だってここまで長引くとは思ってなかったもの。"
"10055140-46-サツキ" = "せんせ～！"
"10055140-47-イブキ" = "サツキ先輩もやっほー！"
"10055140-48-サツキ" = "イブキちゃん、船の上で走ったら危ないわよ？"
"10055140-49-イブキ" = "あっ！うん、気をつける……。"
"10055140-50-サツキ" = "それで、そんなに急いでどうしたの？"
"10055140-51-イブキ" = "あのね！あっちに島があったの！"
"10055140-52-サツキ" = "まさか。この近くに島なんて……。"
"10055140-53-イブキ" = "はっ！まさか、イブキちゃんまで幻覚を！？"
"10055140-54-サツキ" = "……ん？先生？"
"10055140-55-サツキ" = "ぼーっとしてどうしたの？気を付けないと海に落ちちゃう――"
"10055140-56" = "[ns] \"り……。\""
"10055140-57-サツキ" = "り？"
"10055140-58" = "[ns] \"陸だ！！！\""
"10055140-59-サツキ" = "え！ほ、本当！？"
"10055140-60-イロハ" = "陸！？"
"10055140-61-マコト" = "なっ、本当かそれは！？"
"10055140-62-サツキ" = "……本当に、こんな大きな島があるなんて。"
"10055140-63-イロハ" = "今のところ、人の気配はないですね。無人島でなければいいのですが。"
"10055140-64-イロハ" = "何を言う、イロハ！無人島の方が良いに決まっているだろう！"
"10055140-65-イロハ" = "え？"
"10055140-66-マコト" = "無人島ということは……このマコト様が、この島の最初の発見者ということになる！"
"10055140-67-マコト" = "キシシッ！今日からこの島の名前は「マコト島」だ！"
"10055140-68-イロハ" = "……どうやったらそんなポジティブ思考になれるんですか。"
"10055140-69-イブキ" = "ん？"
"10055140-70-イブキ" = "わあ～かわいいヤドカリさんだ！"
"10055140-71-チアキ" = "本当だ、かわいい！写真撮るね！"
"10055140-72-イブキ" = "いぇ～い、万魔殿ヤドカリ～！"
"10055140-73-チアキ" = "え？万魔殿ヤドカリ……？"
"10055140-74-イブキ" = "そうだよ！これはマコト先輩。こっちはサツキ先輩……。"
"10055140-75-チアキ" = "おおっ！たしかに、殻の色がマコト先輩たちの髪色と一緒！"
"10055140-76-チアキ" = "じゃあ、こっちの黒い子は万魔殿ヤドカリの書記？"
"10055140-77-イロハ" = "……なるほど、それなりに生態系は整っているんですね。"
"10055140-78-イロハ" = "つまり食料調達ができる可能性が高い、と。"
"10055140-79-イロハ" = "イブキには申し訳ないですが、この子たちも……。"
"10055140-80-マコト" = "なんだとっ！？"
"10055140-81-マコト" = "こいつを食べるというのか！？"
"10055140-82-イロハ" = "び、ビックリした……今度は何ですか。"
"10055140-83-イロハ" = "何ですか、ではない！"
"10055140-84-マコト" = "食糧など言語道断！こいつは正真正銘のファイターだ！"
"10055140-85-イロハ" = "…………。"
"10055140-86-イロハ" = "……はい？"
"10055140-87-マコト" = "純真無垢な目の奥にたぎる熱い闘志……お前、タダのヤドカリではないな！？"
"10055140-88-マコト" = "お前の正体はなんだ！"
"10055140-89-イブキ" = "言え！一体なんなのだ！"
"10055140-90-サツキ" = "あら、おめでとうヤドカリさん。マコトちゃんがこんな風に褒めるなんて珍しいわよ。"
"10055140-91-チアキ" = "いやいや……。"
"10055140-92-イロハ" = "ヤドカリ一匹に、そんな大袈裟な……。"
"10055140-93-チアキ" = "あははっ！でもいつものみんなに戻ったみたいでよかった！"
"10055140-94-イロハ" = "……まあ、そうですね。落ち込んでいるよりかは。"
"10055140-95-マコト" = "分かったぞ！こいつはサメなのだ！#nたとえ体が小さかろうと、気概はサメに勝るとも劣らん！"
"10055140-96-マコト" = "今からお前は「タイガーシャーク丸」だ！"
"10055140-97-マコト" = "ヤドカリ界の頂点……。#nいやそれを飛び越え、甲殻類最強のチャンピオンになるのだ！"
"10055140-98-ホシノ" = "うへ～"
