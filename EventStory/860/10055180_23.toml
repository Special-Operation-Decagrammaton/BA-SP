[translation]
"10055180-1" = "夕闇の高飛車トライアムヴィレイト"
"10055180-2-マコト" = "諸君、私は非常に重要な事実に気が付いた。"
"10055180-3-マコト" = "あ、そうですか。イブキ、暗いので足元に注意してください。"
"10055180-4-マコト" = "うん！イロハ先輩も気をつけてね！"
"10055180-5-マコト" = "我々の優勝を左右する、とんでもない手がかりだ。"
"10055180-6-マコト" = "みんな、夜の海の何がそんなに好きなの！？ちょっとチアキ、離れないで！"
"10055180-7-マコト" = "分っかりました～！でも、もう少しで商店街につきますので～"
"10055180-8-マコト" = "気になるだろう？気になって、夜も眠れなくなるはずだ！"
"10055180-9-マコト" = "そうだろう！？"
"10055180-10" = "[s1] \"う、うん！！\"\n[s2] \"すごく気になる！！\""
"10055180-11-マコト" = "キシシッ！よくぞ聞いてくれた。"
"10055180-12-マコト" = "それは――敵が現れる順番が決まっているということだ！"
"10055180-13-マコト" = "最初に出会ったのは誰か、思い出してみるがいい。"
"10055180-14-イロハ" = "……たしかアビドスでしたね。"
"10055180-15-マコト" = "ああ。名もほとんど忘れられた、弱小学園だ。その次は……。"
"10055180-16-チアキ" = "ヴァルキューレ警察学校、ですよね？#n公安局長、ずっと怒った顔してましたけど……何かあったのでしょうか？"
"10055180-17-マコト" = "ふむ、連邦生徒会の犬ではあるがアビドスとはワケが違う。#nそして、直前の学園はというと……。"
"10055180-18-サツキ" = "百鬼夜行連合学院。なるほど、マコトちゃんの言いたいことは分かったわ。"
"10055180-19-マコト" = "流石だサツキ。そうだ、百鬼夜行は我々ゲヘナとは比べるまでもないが、#nそれでも相当な規模の学園になる。"
"10055180-20-マコト" = "つまり、我々の相手はどんどん強くなっている！#nとなれば……百鬼夜行よりも強く、ゲヘナに匹敵する強敵――"
"10055180-21-マコト" = "いや、宿敵とも言える「あの学園」と対峙するのも時間の問題ということだ！"
"10055180-22-イブキ" = "宿敵ー？"
"10055180-23-？？？" = "オーッホッホッホッホ！順調に勝ち進んでいるようですね！"
"10055180-24-？？？" = "しかし快進撃もそこまでです！"
"10055180-25-マコト" = "やはり来たか……！"
"10055180-26-イロハ" = "何ですかこのベタな展開……。"
"10055180-27-ナギサ" = "どこの馬の骨とも知れない……。#nそれも、ヤドカリごときが旋風を巻き起こしているようで。"
"10055180-28-ナギサ" = "夕闇の高飛車#nトライアムヴィレイト"
"10055180-29-ナギサ" = "「クラブファイト」は血統のスポーツだと……その身をもって知ってもらいます！"
"10055180-30-マコト" = "はっ！好き勝手言ってくれる！"
"10055180-31-ナギサ" = "ヤドカリ風情がトリニティの名カニに勝てるとでも？#n身の程知らずも甚だしいですね。"
"10055180-32-ナギサ" = "そんなもの、夢のまた夢のお話ですよ！オーッホッホッホ！"
"10055180-33-ミカ" = "な、ナギちゃんどうしたの……？"
"10055180-34-ミカ" = "ストレス？それとも、ロールケーキの賞味期限切れてた？"
"10055180-35-セイア" = "……。"
"10055180-36-セイア" = "……！"
"10055180-37-セイア" = "……そうじゃないだろう？ミカ。"
"10055180-38-ミカ" = "え？"
"10055180-39-セイア" = "真の友人であるならば、我々のやるべきことは一つだ。"
"10055180-40-ミカ" = "ど、どういう意味……？"
"10055180-41-セイア" = "要するに……。"
"10055180-42-セイア" = "その貧相なヤドカリ……見ているだけで、せっかくのお茶が不味くなりますわ！"
"10055180-43-ミカ" = "セイアちゃん！？"
"10055180-44-ナギサ" = "オーッホッホッホ！"
"10055180-45-ミカ" = "ナギちゃんまで！？"
"10055180-46-ミカ" = "……あーもうっ！知らないから！！"
"10055180-47-ミカ" = "さあ、かかっておいでなさい！身の程を分からせてやりますわ！！"
"10055180-48-マコト" = "ついに本性を現したな！ティーパーティー！"
"10055180-49-マコト" = "3対1とは卑怯だぞ！"
"10055180-50-ナギサ" = "3対1……？ふっ。"
"10055180-51-マコト" = "何がおかしい？"
"10055180-52-ナギサ" = "先ほどお伝えしたように、クラブファイトとは血統のスポーツ……。"
"10055180-53-ナギサ" = "つまり、選手の優劣がそのまま勝敗を分けます。"
"10055180-54-ナギサ" = "では……我々トリニティの、最高の選手をご紹介しましょう！"
"10055180-55-ヒフミ" = "えっ……な、なんですか？というか、どこですかここ！？"
"10055180-56-マコト" = "そ、そいつは！？"
"10055180-57-マコト" = "……誰だ？"
"10055180-58-ナギサ" = "ヒフミさんです。"
"10055180-59-マコト" = "……名前を聞いても分からん！"
"10055180-60-ナギサ" = "ヒフミさんを知らないなんて……お里が知れますね。"
"10055180-61-ナギサ" = "では……お願いしますわ！ヒフミさん！"
"10055180-62-ヒフミ" = "へっ！？ナギサ様！？これはどういう状況で……えっ！？"
"10055180-63-ヒフミ" = "ええ～っ！？"
