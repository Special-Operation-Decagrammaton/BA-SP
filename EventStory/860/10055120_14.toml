[translation]
"10055120-1" = "後日談その3;夢の戦艦"
"10055120-2-漁師" = "……そんなことがあったのか。"
"10055120-3-漁師" = "すまない、わしの管理不足で苦労をかけてしまったね。"
"10055120-4-イロハ" = "い、いえ大丈夫です。"
"10055120-5-イロハ" = "ちゃんと忠告は頂いていましたし。遠くに出た私たちの責任ですから。"
"10055120-6-漁師" = "にしても……。"
"10055120-7-漁師" = "このピカピカの船はどうしたんだい……？"
"10055120-8-漁師" = "ん？壊した船の補償だが。"
"10055120-9-マコト" = "もしかして足りなかっただろうか。"
"10055120-10-漁師" = "とんでもない、その逆じゃ！"
"10055120-11-漁師" = "あの船はタダで廃棄できればラッキーなもんじゃ。なのにこんな最新式の船……。"
"10055120-12-マコト" = "モノの価値は値段が全てじゃないだろう？"
"10055120-13-マコト" = "数十年もの歳月を共にした船なんだ。"
"10055120-14-マコト" = "それを私たちは壊してしまったのだ。最善の補償をすべきだろう。"
"10055120-15-漁師" = "……今どき珍しい生徒じゃのう。"
"10055120-16-漁師" = "羽沼マコトと言ったかね？その名は絶対に覚えておこう。"
"10055120-17-マコト" = "キキキッ！民草は一人たりとも逃さん！"
"10055120-18-マコト" = "これがマコト様の帝王学だ！"
"10055120-19-マコト" = "そうか……船か。"
"10055120-20-マコト" = "マコトちゃん？"
"10055120-21-サツキ" = "用件は終わったんでしょう？ため息なんてついてどうしたのよ。"
"10055120-22-マコト" = "……結局沈んでしまった、ビス丸は。"
"10055120-23-サツキ" = "相手があれだったんじゃあね。"
"10055120-24-サツキ" = "もしかして本気で勝てると思ってたの？"
"10055120-25-マコト" = "それは違う。"
"10055120-26-マコト" = "もちろんこの世のほとんどは気合いで解決できるが、あの時は明らかな劣勢だった。"
"10055120-27-マコト" = "ただ……やっぱり残念だ。"
"10055120-28-サツキ" = "残念って？"
"10055120-29-マコト" = "あの全身を貫く揺れ！胸を震わせる轟音、そして爆煙！"
"10055120-30-マコト" = "自分で体験して気が付いたのだ！水上艦と艦砲の威力、その可能性について！"
"10055120-31-マコト" = "ビス丸を失ったのは、やはりとてつもない損失だ！"
"10055120-32-マコト" = "……いいや、過去を悔やんでいる場合ではない！我々は前に進む！"
"10055120-33-マコト" = "ゲヘナに到着次第、ビス丸2号の建艦計画に着手だ！"
"10055120-34-？？？" = "はあ？"
"10055120-35-マコト" = "ビス丸1号よりデカいのはもちろん、オデュッセイアのどんな船にも勝る、超巨大戦艦を作るのだ！"
"10055120-36-サツキ" = "ふうん？まあいいんじゃない？"
"10055120-37-サツキ" = "でもそんなお金、私たちにあったかしら？"
"10055120-38-マコト" = "風紀委員の予算を削ればいい！奴らには身に余るほどの予算が当てられているのだからな！"
"10055120-39-マコト" = "一度で二つの問題を解決できる！さすがはこのマコト様の妙策だ。"
"10055120-40-イロハ" = "解決どころかまた問題が増えそうですね。"
"10055120-41-イロハ" = "おおっ！すでに大スクープの予感がします！"
"10055120-42-イロハ" = "「万魔殿議長、弾劾」とかなら良い記事になると思います。"
"10055120-43-マコト" = "キキキッ！見ているがいい、オデュッセイアよ！"
