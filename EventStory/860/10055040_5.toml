[translation]
"10055040-1" = "第4話;ガイスターシップ"
"10055040-2-マコト" = "……つまり、あの大きな船が霧と共に現れたと？"
"10055040-3-チアキ" = "まさに噂の幽霊船……ですね。"
"10055040-4-チアキ" = "いつもなら心霊特集！まさに特ダネ！と喜んでるところですが……。"
"10055040-5-マコト" = "博物館にありそうなくらい古いな。"
"10055040-6-イブキ" = "イブキ、これ知ってる！ガレオン船だよね。"
"10055040-7-チアキ" = "ガレオン？あ、聞いたことあります！#nたしかオールを漕いで動かす船ですよね？"
"10055040-8-イブキ" = "ううん、それはガレー船！もっと古い船だよ！"
"10055040-9-チアキ" = "あちゃー間違えちゃったか……#nお恥ずかしや、あはは。"
"10055040-10-サツキ" = "ガレーもガレオン船も、今となっては消えてしまったものね。"
"10055040-11-チアキ" = "消えてしまった……？#nでも……。"
"10055040-12-サツキ" = "そう。本来存在するはずのない、キヴォトス中のどこの海にもない船舶。"
"10055040-13-サツキ" = "その船が私たちの前に現れた、ということよ。"
"10055040-14-チアキ" = "それってまるで……。"
"10055040-15-マコト" = "……なるほど。これが幽霊船伝説の正体か。"
"10055040-16-マコト" = "よし、決めた。"
"10055040-17-マコト" = "あれを奪って陸へ戻る。"
"10055040-18-イロハ" = "……は？"
"10055040-19-サツキ" = "ちょ、ちょっとマコトちゃん！本気！？"
"10055040-20-マコト" = "ん？何か問題でも？"
"10055040-21-サツキ" = "幽霊船よ？幽霊船！本当に幽霊がいたらどうするのよ！"
"10055040-22-マコト" = "おかしなことを言うな？#n幽霊なんて居るわけがないだろう。"
"10055040-23-マコト" = "あれ程の船なら船員もそれなりにいるはずだ。#nそして船に異常を感じたなら表に出てくるだろう。"
"10055040-24-マコト" = "しかし未だに誰も出てこない……ということは、捨てられた船なのだろう。#n幽霊船の噂だって、どうせ寂れた船を見て、好き勝手言っているだけにすぎん。"
"10055040-25-チアキ" = "うわ、マコト先輩が真顔で常識人的な発言を！？"
"10055040-26-マコト" = "それに――"
"10055040-27-マコト" = "不安なら無理についてこなくとも良い。"
"10055040-28-イロハ" = "……え？"
"10055040-29-マコト" = "言葉通りの意味だ。船に居たければ好きにするがいい。"
"10055040-30-マコト" = "こちらに来たい者だけ私の後に続け。#nこのマコト様が先導してやろう。"
"10055040-31-チアキ" = "あっ、マコト先輩！一人じゃ危ないですよ！"
"10055040-32-イロハ" = "…………。"
"10055040-33-サツキ" = "マコトちゃん、変ね。"
"10055040-34-イロハ" = "そうですか？いつもと同じだと思いますけど。#n自分勝手で、強引で……。"
"10055040-35-サツキ" = "違う。そういう話じゃないわ。"
"10055040-36-サツキ" = "マコトちゃんと私は結構似ているの。痛いことと、怖いものが大嫌いで……。#nだから、あんな危ない場所に自分から入りに行くことなんて絶対にしない。"
"10055040-37-イロハ" = "そうですね……いつもなら私に行けって言いそうなのに。"
"10055040-38-サツキ" = "……なんだか嫌な感じ。"
"10055040-39-サツキ" = "幽霊船が現れて、マコトちゃんの雰囲気がおかしくなった。"
"10055040-40-サツキ" = "まさかあの船は、精神に影響を与えて……？"
"10055040-41-イブキ" = "イブキもいくー！"
"10055040-42-イロハ" = "えっ……？でも、危険です。"
"10055040-43-イブキ" = "イブキ知ってるよ！#n私たち、実は漂遊……？漂流、してるんだよね？"
"10055040-44-イブキ" = "それでイロハ先輩もマコト先輩とケンカしてて……。"
"10055040-45-イロハ" = "イブキどうしてそれを……。"
"10055040-46-イブキ" = "イブキもみんなの役に立ちたい！"
"10055040-47-イブキ" = "イブキも万魔殿の一員、だからね！"
"10055040-48-イロハ" = "イブキ……。"
"10055040-49-イロハ" = "……分かりました。その代わり、私のそばから絶対に離れないでくださいね。"
"10055040-50-サツキ" = "ええっ！？あなた達も行くの！？"
"10055040-51-イロハ" = "ええ、まあ……やっぱり、チアキが心配なので。"
"10055040-52-サツキ" = "ちょっと！それじゃあ私一人きりじゃない！？"
"10055040-53-イロハ" = "そうなりますね？#nまあ、一人くらいは船を守ってもいいかなと。"
"10055040-54-サツキ" = "うう……！"
"10055040-55-サツキ" = "…………。"
"10055040-56-イロハ" = "いや本当に。無理してついてこなくて大丈夫ですから。"
"10055040-57-サツキ" = "待って頂戴！今考えてるから！"
"10055040-58-サツキ" = "……私も行く。"
"10055040-59-イロハ" = "えっ本当に？大丈夫ですか？"
"10055040-60-サツキ" = "こんな状況で一人でいられるわけないじゃない！#n普通の人ならそうよ！まともな人間ならそうなの！"
"10055040-61-イロハ" = "そこまでではないかと……。"
"10055040-62-イブキ" = "サツキ先輩！イブキと手繋ご～"
"10055040-63-イブキ" = "ぎゅって！ずっと手繋いでたら絶対怖くないよ！"
"10055040-64-サツキ" = "イブキちゃん……。"
"10055040-65-サツキ" = "ふう……い、いいわ。心の準備はできたわよ。#n幽霊でもなんでもかかってきなさい！"
"10055040-66-イロハ" = "だから居ませんって。幽霊が居るわけないじゃないですか。"
"10055040-67-イロハ" = "……。"
"10055040-68-イロハ" = "……結局来ちゃいましたね。"
"10055040-69-イロハ" = "マコト先輩は……。"
"10055040-70-サツキ" = "奇襲！？みんな下がってください！"
"10055040-71-サツキ" = "……なんだ、お前たちだったか。"
"10055040-72-イロハ" = "マコト先輩……？"
"10055040-73-イロハ" = "今の銃撃は……？"
"10055040-74-マコト" = "ああ、私だ。"
"10055040-75-マコト" = "私はてっきり、幽霊かと……。"
"10055040-76-イロハ" = "……？さっき幽霊なんて信じてないって……。"
"10055040-77-チアキ" = "あっ、イロハちゃん！来てたんだ！"
"10055040-78-イロハ" = "ああ、まあそういうことになりました。"
"10055040-79-イロハ" = "というか、少しは引き留めてくれてもいいじゃないですか。私やサツキ先輩はともかく、先生やイブキは本当に危ないんですよ。"
"10055040-80-チアキ" = "あはは、ごめん……でもその前に銃声がさ？"
"10055040-81-チアキ" = "……？そういえばマコト先輩が銃を使ってるの、初めてかも……？"
"10055040-82-サツキ" = "じゃあ誰も居ないのよね？安全なのよね？"
"10055040-83-マコト" = "ああ、間違いない。"
"10055040-84-マコト" = "ここまで騒ぎがあったというのに誰一人出てこない……。"
"10055040-85-マコト" = "つまりこの船には……。"
"10055040-86-サツキ" = "ああ……。"
"10055040-87-イロハ" = "サツキ先輩！しっかりしてください！！"
"10055040-88-マコト" = "幽霊だと！？"
"10055040-89-マコト" = "本当に現れるとは……しかしこちらにも対策はある！"
"10055040-90-マコト" = "イロハ、「アレ」だ！！「アレ」を準備しろ！！"
"10055040-91-イロハ" = "何のことかは分かりませんが、漂流中の私たちには何もありません！！"
"10055040-92-チアキ" = "わあっ！撃ってきましたよ！？"
"10055040-93-イロハ" = "なんで幽霊が銃なんか……いや、そんなこと言っている場合じゃないです！"
"10055040-94-イロハ" = "全員元の船に戻りましょう！"
"10055040-95-イブキ" = "先輩！後ろにも幽霊のお姉ちゃんたち！"
"10055040-96-イロハ" = "えっ、いつの間に！？"
"10055040-97-サツキ" = "う、うぅん……なあに？なんだかすごく怖い夢を見たような……。"
"10055040-98-サツキ" = "……って現実！？"
"10055040-99-チアキ" = "ああっ！これでは無限ループです！"
"10055040-100-マコト" = "チアキ、サツキを支えろ！中へ逃げるぞ！イブキはこっちへ！"
"10055040-101-チアキ" = "はいっ！！サツキ先輩、お気を確かに！！"
"10055040-102" = "[ns1] \"……バキッ？\"\n[ns2] \"あ、これは終わっ……。\""
"10055040-103-チアキ" = "あっ、床が……！！#n先生、サツキ先輩！"
"10055040-104-チアキ" = "大丈夫です、掴みまし――"
"10055040-105-チアキ" = "やっぱ一人じゃ無理かも……！"
"10055040-106" = "（……そして私たちは、船底へ落ちていった）"
