[translation]
"10055020-1" = "第2話;少女漂流記"
"10055020-2-イロハ" = "……何回やっても同じですね。"
"10055020-3-イロハ" = "完全に繋がらなくなりました。通信装置も止まっています。"
"10055020-4-チアキ" = "直すのも無理な感じ？"
"10055020-5-イロハ" = "ざっくりとしか見られていないのでなんともですが……戦車長として見た感じでは……。"
"10055020-6-イロハ" = "エンジンが天寿を全うしたというのが正しいですね。"
"10055020-7-サツキ" = "ええと……どういうこと？#n直せるの？直せないの？"
"10055020-8-イロハ" = "一応、直せます。#n新しいエンジンかパーツを調達できれば、ですが。"
"10055020-9-サツキ" = "こんな沖合で？"
"10055020-10-イロハ" = "はい……なので、不可能でしょうね。"
"10055020-11-チアキ" = "……イロハちゃん、もしかして怒ってる？"
"10055020-12-イロハ" = "…………。"
"10055020-13-イロハ" = "……はあ、すみません。#nらしくなかったですね。頭にきてしまって、つい。"
"10055020-14-イロハ" = "そもそも元凶以外は全員被害者だというのに。"
"10055020-15-サツキ" = "一旦、状況をまとめてみない？"
"10055020-16-サツキ" = "チアキはマコトちゃんを連れてきて頂戴。"
"10055020-17-チアキ" = "はい！承りました！"
"10055020-18-サツキ" = "イロハは物資の確認をお願い。#n今後の生存計画に関わるもの。"
"10055020-19-サツキ" = "あと、修理に使える予備パーツがないか、もう一度見てきて頂戴。"
"10055020-20-イロハ" = "せっかくの休暇がどうしてこんな面倒なことに……仕方ありませんね、行ってきます。"
"10055020-21-サツキ" = "今できるのはこんなものかしら。"
"10055020-22" = "[s] \"サツキは落ち着いているんだね。\""
"10055020-23-サツキ" = "そんなことないわ。私だって不安よ。"
"10055020-24-サツキ" = "でも、不安になっていたって、しょうがないでしょう？"
"10055020-25-サツキ" = "普段ならマコトちゃんがなんとかしてくれるんだけど……。"
"10055020-26-サツキ" = "ん？マコトちゃんのこと？ええ、信頼しているわ。"
"10055020-27-サツキ" = "当然でしょう？マコトちゃんはすごい人だもの。"
"10055020-28" = "[s1] \"そうなの……？\"\n[s2] \"すごい信頼だ……。\""
"10055020-29-サツキ" = "ふーん？シャーレの先生は、人を評価する基準が違うのかしらね？"
"10055020-30-サツキ" = "興味深いけれど……まあ今はそんなこと重要じゃないわ。"
"10055020-31-サツキ" = "この話は、無事に陸に戻ってからゆっくり、ね。"
"10055020-32-サツキ" = "とりあえず今は……そうね。"
"10055020-33-サツキ" = "マコトちゃんが来るまで待ちましょうか。"
"10055020-34-マコト" = "……そうか。そんな事態になっていたのだな。"
"10055020-35-マコト" = "イロハ、なぜすぐに知らせなかった！"
"10055020-36-マコト" = "報、連、相は基本だろう！"
"10055020-37-イロハ" = "いや、私も今知ったばかりですので。"
"10055020-38-イロハ" = "というかマコト先輩、船酔いでずっと死んでたじゃないですか。"
"10055020-39-イロハ" = "ええいっ！定型の返答しかできないのか！？御役所仕事ばかりしおって！"
"10055020-40-イロハ" = "……言い出したのはマコト先輩じゃないですか。"
"10055020-41-マコト" = "細かいことはどうでもいい！"
"10055020-42-イロハ" = "サツキ、現状報告！"
"10055020-43-サツキ" = "エンジン停止。陸上との通信は不可。#nまさに漂流状態ね。"
"10055020-44-サツキ" = "せめてもの救いは、それなりに物資が残ってるってところかしら？"
"10055020-45-イロハ" = "と言っても1週間分程度しかありません。#nこんな船で長期クルーズは無理ですし、ほとんど陸上に置いてきましたので。"
"10055020-46-イロハ" = "1週間分？なら何の問題もないじゃないか。"
"10055020-47-イロハ" = "…………。"
"10055020-48-マコト" = "キシシッ、訳が分からないという顔だなイロハ。#nしかし常識的に考えてみるがいい。"
"10055020-49-マコト" = "他の誰でもなくこの我々、万魔殿の幹部全員と連絡が取れない、前代未聞の事態だぞ？#nそれも一週間。"
"10055020-50-マコト" = "他のメンバーはもちろん、ゲヘナが総力を挙げて捜索することだろう。"
"10055020-51-チアキ" = "あれ？私たちってそんなにすごかったんですか？"
"10055020-52-マコト" = "万魔殿の書記ともあろう者が何を言っている？#n当たり前だろう！"
"10055020-53-サツキ" = "言われてみればたしかにそうね。心配して損したわ。"
"10055020-54-マコト" = "つまり、我々は1週間の船旅を思う存分楽しめばいいというわけだ！"
"10055020-55-イロハ" = "……いつもこうなんですよね。"
"10055020-56-マコト" = "ん？なんだその不満そうな顔は？"
"10055020-57-イロハ" = "いえ、別に何も。"
"10055020-58-イロハ" = "まあでも一理あると思います。そこまで遠くに出たわけでもないですし、運が良ければ他の船と出会えるかも……。"
"10055020-59-イロハ" = "それこそ、巡洋中のオデュッセイア海洋高等学校に会えるかもしれません。"
"10055020-60-マコト" = "キシシッ！ようやく理解できたようだな！このマコト様がそばにいて、万が一が起こり得ることなどない！"
"10055020-61-マコト" = "安心してバカンスを楽しむがいい！"
"10055020-62" = "[log]漂 流  4 日 目[/log]"
"10055020-63-マコト" = "…………。"
"10055020-64-イロハ" = "…………。"
"10055020-65-マコト" = "今日は何日目だ……？"
"10055020-66-イロハ" = "さあ。"
"10055020-67-マコト" = "食糧もずいぶんと減ったようだが。"
"10055020-68-イロハ" = "そうですね。"
"10055020-69-マコト" = "少し……ほんのわずかに、思ったのだが。"
"10055020-70-マコト" = "――危険な状況なのでは？"
"10055020-71-イロハ" = "いえ。#nかなり危険な状況です。"
"10055020-72" = "[ns3] \"だ、大丈夫！\"\n[ns4] \"すぐに救助隊が……！\""
"10055020-73-マコト" = "……せめて目を見ていってくれませんか。"
"10055020-74-イロハ" = "まぁ、まだ物資はあるので保つでしょうが……。"
"10055020-75-イロハ" = "あと1週間……それくらいなら大丈夫でしょう。"
"10055020-76" = "[s5] \"前も1週間って言ってなかった？\"\n[s6] \"まだあるの？\""
"10055020-77-イロハ" = "それは……。"
"10055020-78-イロハ" = "……先生、ちょっといいですか。"
"10055020-79-イロハ" = "……ここなら大丈夫ですね。"
"10055020-80-イロハ" = "察しているかとは思いますが。"
"10055020-81-イロハ" = "物資をこっそり管理していたんです。"
"10055020-82-イロハ" = "4人分を5人分っぽく見せたり、デザートを無くすとか。"
"10055020-83-イロハ" = "まあ当たり前ですよね……。"
"10055020-84-イロハ" = "というか、常識的に考えて、遭難してるのに料理を元の日程で消費するなんておかしくないですか！？"
"10055020-85" = "[s7] \"たしかに！\"\n[s8] \"このことは他の人には……？\""
"10055020-86-イロハ" = "誰も知りません。どのみち、物資の管理は私がしているので。"
"10055020-87-イロハ" = "まず、マコト先輩に知られてもいいことはありません。"
"10055020-88-イロハ" = "サツキ先輩はどう出るか分からないので教えていません。#nどういう行動をするか未知数なので。"
"10055020-89-イロハ" = "チアキは比較的話が通じる方ですが、ウソが苦手で秘密を共有するには向いておらず。"
"10055020-90-イロハ" = "イブキは……。"
"10055020-91-？？？" = "あ！先生！"
"10055020-92-イブキ" = "あっ、イロハ先輩もいる！"
"10055020-93-イロハ" = "どうしましたイブキ？"
"10055020-94-イブキ" = "うん、あのね！あっちにイルカさんが……。"
"10055020-95-イブキ" = "あっ消えちゃった！さっきまでいたんだよ！"
"10055020-96-イロハ" = "イブキ、楽しめてますか？"
"10055020-97-イブキ" = "うん！すっごく楽しいよ！"
"10055020-98-イブキ" = "イロハ先輩は楽しくない？"
"10055020-99-イロハ" = "……私も楽しいですよ。"
"10055020-100-イブキ" = "えへへ！よかった！"
"10055020-101-イロハ" = "イブキには……分かりますよね？先生。"
"10055020-102" = "[s9] \"漂流していることは秘密なんだよね？\"\n[s10] \"心配しそうだもんね。\""
"10055020-103-イロハ" = "こう言ってしまうのは失礼かもしれませんが――"
"10055020-104-イロハ" = "――先生と一緒で、本当によかったです。"
"10055020-105-イロハ" = "もしも、私たちだけだった場合……はぁ。"
"10055020-106-イロハ" = "とはいえ、そろそろ本気で対策を考えなくてはいけません。"
"10055020-107-イロハ" = "1週間とは言いましたが、救助がいつ来るのかも分かりません。#n物資を節約するだけではいずれ限界が……。"
"10055020-108-イロハ" = "…………。"
"10055020-109-イロハ" = "……はぁ。"
"10055020-110-イロハ" = "何で私が頭を悩ませないといけないんでしょうか……本当に面倒くさいです。"
"10055020-111" = "[s11] \"わ、私もなるべく手伝うから！\"\n[s12] \"一緒に頑張ろう。\""
"10055020-112-イロハ" = "そもそも先生は招待された賓客だというのに……お互い大変ですね。"
"10055020-113-イロハ" = "……ひとまず目の前のことを一つずつ片づけていきましょうか。"
"10055020-114-イロハ" = "[ruby=サバイバル]生存に[/ruby]おいて一番大事なのは――"
"10055020-115-イロハ" = "――食糧ですから。"
"10055020-116-チアキ" = "……。"
"10055020-117-チアキ" = "あ、先生。"
"10055020-118" = "[s13] \"目が死んでる……！\"\n[s14] \"大丈夫？何かあった！？\""
"10055020-119-チアキ" = "いえ……何もなかったんです。"
"10055020-120-チアキ" = "それが、問題でして……。"
"10055020-121-チアキ" = "漂流当初は大スクープだと思っていたんですが……気づいてしまったんです。"
"10055020-122-チアキ" = "漂流とは――何の変化も刺激もない日々を繰り返すだけだということに！"
"10055020-123-チアキ" = "こんなの監獄に等しいです……、#n一応、手記を書き残していますが……。"
"10055020-124-チアキ" = "やっぱり、読者の反応がないというのは……。"
"10055020-125-チアキ" = "いつか、これを見つけた誰かが読んでくれたら嬉しいな……。"
"10055020-126-イロハ" = "なに不吉なことを言っているんですか……。"
"10055020-127-チアキ" = "あ、イロハちゃん。"
"10055020-128-チアキ" = "あれ、それは？"
"10055020-129-チアキ" = "釣り竿です。#nちょっと手伝っていただけませんか？"
"10055020-130-チアキ" = "釣り竿？そんなのあったんだ。"
"10055020-131-チアキ" = "予備パーツを探してる時に見つけました。#n床の隙間に落ちていたのですが、おそらく前に借りた人のものかと。"
"10055020-132-チアキ" = "素人が使って釣れるかは分かりませんが……何もしないよりはマシかと思いまして。"
"10055020-133-チアキ" = "ナイスアイデア！はいはーい！やるやる！"
"10055020-134-イロハ" = "そんなにテンション上がるようなことですか……？"
"10055020-135-チアキ" = "退屈すぎてしんどくて！ちょうどよかったー！"
"10055020-136-イロハ" = "釣り竿はちょうど2本あります。はい、どうぞ。"
"10055020-137-イロハ" = "……簡単に釣れるとは思っていませんでしたが。"
"10055020-138-イロハ" = "まさかこんなにかからないとは。"
"10055020-139-チアキ" = "釣りは時間との戦いだからね！"
"10055020-140-チアキ" = "ルアーフィッシングだとボウズはよくあることだし！"
"10055020-141-イロハ" = "……意外と詳しいんですね。"
"10055020-142-チアキ" = "あはっ！実は私、釣り部名誉部員なので！"
"10055020-143-イロハ" = "うちの学園にそんなのありましたっけ……。"
"10055020-144-チアキ" = "あるよー！といっても全然活動はできてないけど……。"
"10055020-145-イロハ" = "……その部活、存在する意味あるんでしょうか。"
"10055020-146-チアキ" = "あるよ！今ヒノム火山にダムを作ってるから……順調に行けば、2年後にゲヘナ学園を通る川ができる予定なんだ！"
"10055020-147-チアキ" = "学園を横断する川……絶対この目で見たくない？"
"10055020-148-イロハ" = "もはや本末転倒というか……。"
"10055020-149-イロハ" = "いえ、これは私が間違ってました。うちの生徒がやることを深く考えるべきではないですね。"
"10055020-150-チアキ" = "……。"
"10055020-151-イロハ" = "……なんですか？急に人の顔をまじまじと。"
"10055020-152-チアキ" = "前から思ってたんだけど……。"
"10055020-153-チアキ" = "イロハちゃんって、ゲヘナ学園に全然興味ないですよね。"
"10055020-154-イロハ" = "……？"
"10055020-155-イロハ" = "あ、いやそうですが……唐突ですね。"
"10055020-156-チアキ" = "いやほら、イロハちゃんは万魔殿でしょ？#n万魔殿は一応、ゲヘナの生徒会のようなものだし。"
"10055020-157-イロハ" = "生徒会のような、というか生徒会ですね。"
"10055020-158-イロハ" = "そうそう。でも生徒会の仕事って学園に愛がないとできないじゃん。"
"10055020-159-イロハ" = "そうですね……いえ、あまりそういう風に考えたことはないですが。"
"10055020-160-イロハ" = "目の前に仕事があるからやっています。#nそれくらいは愛がなくてもできますから。"
"10055020-161-チアキ" = "あのさ……。"
"10055020-162-チアキ" = "イロハちゃんはどうして万魔殿に――"
"10055020-163-イロハ" = "……！チアキ、かかってます！"
"10055020-164-チアキ" = "あ、ああっ！？わわわわっ！！イロハちゃん、助けて！！"
"10055020-165-イロハ" = "釣り部なんですよね！？"
"10055020-166-チアキ" = "実際にやったのは初めてで！"
"10055020-167-イロハ" = "もう……！貸してください！"
"10055020-168-イロハ" = "つ、つかまえっ……！#nこれ、どうしたら……！？"
"10055020-169-チアキ" = "イロハちゃん！ほら、網！"
"10055020-170-イロハ" = "ちょっ、待ってください、こいつ、活きがよすぎて……！！"
"10055020-171-イロハ" = "いたた……。"
"10055020-172" = "[s15] \"大丈夫！？\"\n[s16] \"派手にぶつかったよね？\""
"10055020-173-イロハ" = "……大したことないです。思いの外大きな音を立ててしまいましたが。"
"10055020-174-투명" = "イロハちゃん、起こしてー。"
"10055020-175-イロハ" = "自分で立てるでしょう。甘えないでください。"
"10055020-176-チアキ" = "つめたーい。"
"10055020-177-チアキ" = "っと捕まえた魚は……あ！先生が持っててくれたんですね！"
"10055020-178-イロハ" = "私たちが捕まえたの、本当にこれですか……？"
"10055020-179-チアキ" = "おおっ！すごい大物！"
"10055020-180-イロハ" = "小物かと。"
"10055020-181-イロハ" = "かかった時はもっと大きく見えたんですが……。"
"10055020-182-イロハ" = "まあでも、自給自足ができると証明できたのは大きな前進です。"
"10055020-183-チアキ" = "え？"
"10055020-184-イロハ" = "どうしました？"
"10055020-185-チアキ" = "いや、自給自足って……。"
"10055020-186-チアキ" = "これ、食べるの？"
"10055020-187-イロハ" = "そうですが？"
"10055020-188-チアキ" = "どうやって……？"
"10055020-189-イロハ" = "焼いたり……？"
"10055020-190-イロハ" = "そういえば、燃料を節約していたんでした。#nでは刺身に……。"
"10055020-191-イロハ" = "イロハちゃん、生きた魚さばけるの？"
"10055020-192-イロハ" = "……。"
"10055020-193-チアキ" = "……。"
"10055020-194-イロハ" = "……そうだ、チアキってたしか給食部にも入ってましたよね？"
"10055020-195-イロハ" = "安心しました。チアキに任せられますね。"
"10055020-196-イロハ" = "き、給食部は違うけどっ！？"
"10055020-197-チアキ" = "わ、私、生き物をさばくのはちょっと本当……。"
"10055020-198-チアキ" = "あっ！先生に頼むとか……。"
"10055020-199-イロハ" = "……それも悪くありませんが。"
"10055020-200-イロハ" = "先生に頼るのは最後の手段にしておきましょう。"
"10055020-201" = "[ns17] \"私ってそんなに頼りない……？\"\n[ns18] \"全然やるよ。\""
"10055020-202-イロハ" = "そういう話ではなく……。"
"10055020-203-イロハ" = "先生は招待客なんです。"
"10055020-204-イロハ" = "……まあこんな状況でそんなこと、意味がないかもしれませんが。#n少なくとも一人はそう思ってるってことです。"
"10055020-205-チアキ" = "あはは……マコト先輩もね、一応責任感あるし……。"
"10055020-206-イロハ" = "あの人が責任感……？本気で言ってるんですか、それ。"
"10055020-207-チアキ" = "えーと、口に出さないだけで、そう思っているんじゃないかな～なんて……。"
"10055020-208-イロハ" = "とにかく。魚は私がなんとかします。"
"10055020-209-チアキ" = "おおっ！もしやイロハちゃんの手作り料理！？万魔殿に来て初めて！！"
"10055020-210-チアキ" = "遭難も悪いことばかりじゃないね！"
"10055020-211-イロハ" = "言っておきますが、期待はしないでください。私も初めてなので。"
"10055020-212-イロハ" = "まずウロコを……。"
"10055020-213-イロハ" = "いや頭……うわあっ！？"
"10055020-214-マコト" = "一応聞こう。"
"10055020-215-マコト" = "イロハ……この、謎の物体？はなんだ……？"
"10055020-216-チアキ" = "……刺身です。"
"10055020-217-イロハ" = "チアキ！もう、いつまで笑ってるんですか！！"
"10055020-218-チアキ" = "だってさあ、これを見たら……あはははっ！"
"10055020-219-サツキ" = "あら、騒がしいと思ったら釣りなんてしていたのね。"
"10055020-220-サツキ" = "でもこれ……食べられるのかしら？"
"10055020-221-イブキ" = "……あむ。"
"10055020-222-イブキ" = "わあ！イブキこれ知ってる！しんせん？な味！"
"10055020-223-チアキ" = "あははっ！たしかに新鮮な味です！"
"10055020-224-サツキ" = "……イブキちゃん、本当に大丈夫？"
