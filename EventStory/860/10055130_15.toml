[translation]
"10055130-1" = "後日談その4;海の賑やかな伝令者"
"10055130-2-スミカ" = "き、来ちゃいました、ゲヘナ学園……。"
"10055130-3-スミカ" = "さすがはキヴォトス三大学園といいますか……外壁から床材までピカピカです。"
"10055130-4-スミカ" = "ま、まあまあ！こんなもんですよね。"
"10055130-5-スミカ" = "オデュッセイアの「オリュンポス号」の相手にはなりませんから！"
"10055130-6-スミカ" = "……恥ずかしいからあまりキョロキョロしないようにしよ。"
"10055130-7-スミカ" = "とはいえ、部長ってば心配性なんだから。"
"10055130-8-スミカ" = "学園間の問題は「アイランド」に任せればいいのに、なんでわざわざ謝罪なんか。"
"10055130-9-スミカ" = "まあ……おかげで陸に来れたし、いっか。"
"10055130-10-スミカ" = "お使いの内容自体は簡単なものだし……。"
"10055130-11-スミカ" = "ちょ～っと時間が余るかもしれないし～初めての場所で、道に迷うかもしれないし～……。"
"10055130-12-スミカ" = "ちょ～ど！ゲヘナのビオトープは独特な植生の名所で種類豊富！昆虫コレクターたちの間でも大人気の場所！"
"10055130-13-スミカ" = "ええ……ぐ～ぜん！貴重な昆虫とお会いできるかもしれない……ふっふっふ……。"
"10055130-14-スミカ" = "あっ、こうしている場合じゃない。早くお使いを終わらせましょう！"
"10055130-15-風紀委員" = "あのー突然すみませんー。"
"10055130-16-風紀委員" = "ん？あなたは……？"
"10055130-17-スミカ" = "私、オデュッセイア海洋高等学校から派遣された、外交使節の[ruby=こもり]小森[/ruby]スミカと申します。"
"10055130-18-風紀委員" = "が、外交使節？"
"10055130-19-スミカ" = "ああ、そう難しい顔しなくて大丈夫です。ただ道を聞きたいだけでして。"
"10055130-20-スミカ" = "お会いしたい方は――"
"10055130-21-スミカ" = "……あれ？そういえばお名前を知らないんでした。"
"10055130-22-風紀委員" = "えっと、ゲヘナにはいっぱい人がいるから、名前を知らないんじゃちょっと……。"
"10055130-23-風紀委員" = "何か特徴とかはないですか？"
"10055130-24-スミカ" = "あ、それなら簡単です。ゲヘナのすごく偉い人なんです。"
"10055130-25-風紀委員" = "偉い人……。"
"10055130-26-マコト" = "あと、印象的な銀色の髪です。"
"10055130-27-マコト" = "……ん？"
"10055130-28-マコト" = "あと！すごく強い人です。"
"10055130-29-マコト" = "ああ、それなら間違いありません。"
"10055130-30-ヒナ" = "私たちの委員長、[ruby=そらさき]空崎[/ruby]ヒナさんですね。"
"10055130-31-スミカ" = "なるほど、空崎ヒナさん。覚えておきます。"
"10055130-32-スミカ" = "その方はどこに行けば会えますか？"
"10055130-33-風紀委員" = "あ、ええっと……。"
"10055130-34-風紀委員" = "実はこの時期は、あまり会うのはオススメしないというか……。"
"10055130-35-スミカ" = "……？"
"10055130-36-風紀委員" = "一応場所は言っておきますね。ここから――"
"10055130-37" = "ヒノム火山94-13地区・麓"
"10055130-38-スミカ" = "ぜぇ……ぜぇ……ぜぇ……！"
"10055130-39-スミカ" = "暑い！熱い！！なんで私がこんな……！！"
"10055130-40-スミカ" = "というか常人はこんなとこ1日で来れませんよ！？私だからできたワケで……！"
"10055130-41-スミカ" = "青い海がこんなにも恋しくなるなんて……。"
"10055130-42-투명" = "あれ？珍しいな。"
"10055130-43-イオリ" = "一般人がこんなとこまで来るなんて、そうそうないぞ。"
"10055130-44-イオリ" = "もしかして私たちに用？"
"10055130-45-スミカ" = "ああ、やっと人が……！"
"10055130-46-スミカ" = "はい、ぜひお会いしたい方がいまして。空崎ヒナさん、という人で……。"
"10055130-47-イオリ" = "ああ、委員長？委員長、お客さんだよ。"
"10055130-48-투명" = "ん？この時期に？"
"10055130-49-ヒナ" = "風紀委員の夏の合宿訓練……それなりに有名だと思ってたけど。"
"10055130-50-イオリ" = "それでもってことは、きっと急用なんでしょうね。"
"10055130-51-スミカ" = "……。"
"10055130-52-ヒナ" = "……。"
"10055130-53-スミカ" = "どちらさまで？"
"10055130-54-ヒナ" = "……？私を呼んだのでしょう？空崎ヒナよ。"
"10055130-55-スミカ" = "万魔殿の、トップじゃ……ない！？"
"10055130-56-ヒナ" = "！？"
"10055130-57" = "（そしてスミカは白目で下山したのであった）"
"10055130-58" = "（一方……マコトと間違われ、憂鬱なヒナだった）"
