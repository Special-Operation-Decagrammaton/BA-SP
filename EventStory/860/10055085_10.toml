[translation]
"10055085-1-マコト" = "ヨーホホ！見たか、[ruby=マン・オブ・パンデモニウム]我が万魔船の底[/ruby]力を！！"
"10055085-2-トライデントの部員A" = "こいつら、普通の海賊じゃないぞ！？"
"10055085-3-トライデントの部員B" = "特にあの銀髪の船長……只者じゃねえ、スミカも一撃だったけど！？"
"10055085-4-トライデントの部員A" = "あいつって結構強くなかった……？"
"10055085-5-トライデントの部員A" = "後退！後退です！"
"10055085-6-トライデントの部員A" = "あれ？ピンピンしてる。"
"10055085-7-トライデントの部員B" = "さっき倒れてたよな……？ちゃんと見たぞ。"
"10055085-8-トライデントの部員A" = "いきなり本気を見せるわけないでしょう、当然です！本気は隠せば隠すほどいいんですから！"
"10055085-9-トライデントの部員A" = "なんかイイ感じに言ってるけど、要はテキトーにやったってことだろ……？"
"10055085-10-トライデントの部員B" = "本気出せば勝てるってこと？"
"10055085-11-スミカ" = "……正直、あの人の相手はちょっと自信ないですね。"
"10055085-12-スミカ" = "そうですね……体感的に、副部長の相手をしてるような感じ？というか。"
"10055085-13-トライデントの部員A" = "はっ？そんなんただの化け物じゃん！"
"10055085-14-トライデントの部員B" = "あっ、囲まれるっ！逃げるぞ！！"
"10055085-15-マコト" = "我がビス丸に土足で上がりおって……無事に帰れると思うか？"
"10055085-16-マコト" = "一人も残さずサメの餌食にしてやれ！"
"10055085-17-チアキ" = "あのぉ……マコト先輩が戦ってる姿、初めて見たんですが……。"
"10055085-18-チアキ" = "にしても強すぎませんか……？"
"10055085-19-サツキ" = "あれはトランス状態よ！"
"10055085-20-チアキ" = "えっ？催眠の時のアレ、ですか？"
"10055085-21-サツキ" = "そう。今のマコトちゃんは、自分を極悪非道な海賊船長と信じ込んでるわ。"
"10055085-22-サツキ" = "そのおかげでいつも以上の力を出せてるの。"
"10055085-23-チアキ" = "思い込みだけで強くなるんですか？"
"10055085-24-サツキ" = "もちろん。心理状態は身体に影響を及ぼすって、スポーツ分野ではすでに常識よ。"
"10055085-25-サツキ" = "私の催眠術でみんなが強くなるのも、それの応用ってわけ。"
"10055085-26-チアキ" = "なるほど！よく分かりましたっ！"
"10055085-27-サツキ" = "一気に信憑性なくなりましたけど！？"
"10055085-28-サツキ" = "でも、普通は自己暗示でここまでの効果は出ないわ……#nさすがマコトちゃんってところかしら。"
"10055085-29-サツキ" = "……バカ単純ってことではなく？"
"10055085-30-海賊A" = "奴らが逃げたぞ！"
"10055085-31-海賊B" = "勝った！！"
"10055085-32-マコト" = "キャプテン！マコト！キャプテン！マコト！"
"10055085-33-マコト" = "ヨーホホ！見たかこれが我々の……！"
"10055085-34-マコト" = "なっ、なんだこの揺れは！？"
"10055085-35-マコト" = "た、大変ですキャプテンマコト！"
"10055085-36-海賊A" = "敵の増員です！機関銃じゃなく本物の艦砲です！"
"10055085-37-マコト" = "増員！？ここは遠洋だぞ？どこから増員が来るというのだ！？"
"10055085-38" = "[s1] \"なんだか既視感が……。\"\n[s2] \"見たことあるような流れだ。\""
"10055085-39-マコト" = "水平線向こうに！奴らが現れました！"
"10055085-40-マコト" = "艦隊……大規模な艦隊です！"
"10055085-41-マコト" = "トライデントのメイン艦隊が到着しました！！"
"10055085-42-マコト" = "卑怯な奴らめ……援軍を呼ぶだと？"
"10055085-43-マコト" = "みな、応戦だ！あいつらも全員、サメの餌食にしてやれ！！"
"10055085-44-海賊A" = "無理です！こっちの大砲じゃそもそも届きません！"
"10055085-45-海賊B" = "巡視船とはワケが違います！こっちの砲弾が効くわけないっす！？"
"10055085-46-海賊A" = "ええいっ！また泣き言か！"
"10055085-47-マコト" = "根性のない奴らだ！私がやる！"
"10055085-48-マコト" = "うあっ！？滑っ……。"
"10055085-49" = "[ns3] \"あっ、マコト！？\"\n[ns4] マコトに向かって走る。"
"10055085-50" = "[ns5] （届か、ない……！）\n[ns6] （このままじゃマコトが海に……！）"
"10055085-51-イロハ" = "……何やってるんですか！！"
"10055085-52-イロハ" = "気は確かですか！？海に落ちるとこでしたよ！？"
"10055085-53-マコト" = "い、イロハ？"
"10055085-54-マコト" = "お前は私を、嫌ってるとばかり……。"
"10055085-55-イロハ" = "……ああっもう！"
"10055085-56-マコト" = "本物のバカなんです！？#nこんな状況でそんなこと気にしてる場合ですか！？"
"10055085-57-イロハ" = "というか、マコト先輩カナヅチですよね！？"
"10055085-58-マコト" = "なっ、どうやってそれを！？マコト様最大の秘密をっ！？"
"10055085-59-イロハ" = "水泳の授業全部休んでるのに、知らないわけないでしょうが！！"
"10055085-60-イロハ" = "それに私はそもそも……！"
"10055085-61-イロハ" = "先に謝ってくるような先輩、なんて……。"
"10055085-62-海賊A" = "また着弾しました！"
"10055085-63-海賊B" = "し、沈んでしまう……！！"
"10055085-64" = "（そしてビス丸は海の底へ沈んでいった）"
