[translation]
"10055190-1" = "不凍の港の無敵徹甲"
"10055190-2-イロハ" = "ここは……温泉でしょうか？"
"10055190-3-チアキ" = "浜辺に温泉って、なんだかロマンチックですね～！"
"10055190-4-イロハ" = "ロマンチックというより、ミスマッチな感じがしますけど……。"
"10055190-5-マコト" = "……。"
"10055190-6-サツキ" = "マコトちゃん？さっきから何を考え込んでるの？"
"10055190-7-マコト" = "……あ。"
"10055190-8-マコト" = "んなあああっ！しまったあああ！！"
"10055190-9-サツキ" = "び、びっくりした！いきなり何なの！？"
"10055190-10-マコト" = "……ああ、私としたことがつい取り乱してしまった。"
"10055190-11-サツキ" = "ほんとにもう！心臓止まっちゃったらどうするのよ！！"
"10055190-12-マコト" = "いやなに、たった今、本当に重大なことを思い出してな。"
"10055190-13-マコト" = "ゲヘナには……トリニティの他にも、まだ越えるべき壁があったのだ！"
"10055190-14-イロハ" = "トリニティの他に……？どこかありましたっけ？"
"10055190-15-マコト" = "イロハ、お前は私と一緒にいただろう！何故分からん！"
"10055190-16-イロハ" = "一緒にいた……？"
"10055190-17-イロハ" = "フッフッフッ、鋭いな。さすがはマコト議長だ。"
"10055190-18-チェリノ" = "そうだ、我こそレッドウィンター連邦学園の生徒会長であり、#n環境美化部部長兼、書記長兼、運動部代表兼、清掃部部長兼……！"
"10055190-19-チェリノ" = "不凍の港の#n無敵徹甲"
"10055190-20-チェリノ" = "あ……あと、環境美化部部長と……。"
"10055190-21-トモエ" = "風紀委員長兼、給食部部長……。#nそして今月の最優秀プリン試食家として選ばれた、チェリノ会長で御座います。"
"10055190-22-チェリノ" = "おお、そうだ！よくぞ言ってくれた！"
"10055190-23-チェリノ" = "そして今は……この温泉の女将であり、最強のクラブファイターでもある！"
"10055190-24-イロハ" = "……え？"
"10055190-25-イロハ" = "もしかしてマコト先輩、トリニティよりレッドウィンターを警戒してたんですか？"
"10055190-26-マコト" = "そ、そんなことはない！"
"10055190-27-マコト" = "もしかすると……ゲヘナ学園が！私の率いるこの代で！"
"10055190-28-マコト" = "ただのチビが率いるレッドウィンターなんかに、#n引けを取るかもしれないという不安など、微塵も感じたことはない！！"
"10055190-29-イロハ" = "不安の内容がやけに具体的ですね……。"
"10055190-30-サツキ" = "レッドウィンターなんて、特に警戒が必要とは思えないけど……。"
"10055190-31-マコト" = "サツキ、お前は見ていないからそんなことが言えるのだ！"
"10055190-32-マコト" = "果てしなく広大な領土、無数の生徒！"
"10055190-33-マコト" = "万一このマコト様のように優秀な指導者が現れ、生徒を団結させたなら……#nその底力はゲヘナを超え、キヴォトス三大学園をも圧倒しうるのだぞ！"
"10055190-34-チェリノ" = "さすがマコト議長！よくご存じで！！"
"10055190-35-チェリノ" = "前回のクーデターは失敗に終わりましたが、#n次こそはレッドウィンターをより良い……。"
"10055190-36-チェリノ" = "ん？マリナ、またクーデターを計画していたのか？"
"10055190-37-チェリノ" = "……どうやら、粛清が足りなかったようですね。"
"10055190-38-チェリノ" = "ち、違います！前回の粛清以来、私は完全に事務局に忠誠を誓っております！"
"10055190-39-チアキ" = "あんなんですよ？優秀な指導者が……なんでしたっけ？"
"10055190-40-チアキ" = "あはははっ！私たちよりひどい学園もあるんだね～！"
"10055190-41-イロハ" = "チアキって……。"
"10055190-42-イロハ" = "たまにしれっと無慈悲なこと言いますよね。"
"10055190-43-チアキ" = "ふぇっ！？"
"10055190-44-チェリノ" = "ええい！うるさい！とにかく目的はこれなのだろう！"
"10055190-45-チェリノ" = "無敵のカニ、「粛清君2号」で蹴散らしてやる！"
"10055190-46-サツキ" = "なっ、なんだあの巨大カニは！？"
"10055190-47-サツキ" = "これ、反則じゃないの？"
"10055190-48-トモエ" = "ふふふ、反則ではありません。#n「クラブファイト」は甲殻類であればどんな種だって参加できます。"
"10055190-49-トモエ" = "頑張ってチェリノ書記長にふさわしいカニを見つけた甲斐がありました。"
"10055190-50-イロハ" = "ああっ！？ヤドカリたちがあまりの大きさにビビってます！"
"10055190-51-マコト" = "なんだと！？立て、タイガーシャーク丸！お前はこの程度で折れる奴ではない！"
"10055190-52-イロハ" = "……反応がありません。"
"10055190-53-マコト" = "まさか！戦いが始まる前に負けを認めると言うのか！？"
"10055190-54-イブキ" = "……そっか、怖いんだね。"
"10055190-55-イブキ" = "大丈夫だよ。イブキが、おてて握っててあげる。"
"10055190-56-チアキ" = "おおっ！？まるでイブキちゃんの気持ちが伝わったかのように、#nヤドカリが足を……！"
"10055190-57-マコト" = "もしや……開花したのか……！？"
"10055190-58-マコト" = "イブキのクラブファイターとしての才能が……！！"
"10055190-59-イブキ" = "一緒に戦えば怖くないよ！"
"10055190-60-イブキ" = "いこう、カニカニさん！一緒に悪いカニさんを懲らしめるよ！"
"10055190-61-イブキ" = "カニ～！"
