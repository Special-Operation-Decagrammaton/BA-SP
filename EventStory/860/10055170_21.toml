[translation]
"10055170-1" = "光と影が交差するアクロバティック"
"10055170-2-イブキ" = "夕焼け、綺麗だね～"
"10055170-3-イロハ" = "そうですね……。"
"10055170-4-イロハ" = "何の心配もせずにゆっくり過ごせるなんて、いつぶりだろ……。"
"10055170-5-サツキ" = "あなたたち、ここに居たのね。"
"10055170-6-イロハ" = "あ、サツキ先輩。"
"10055170-7-イロハ" = "……マコト先輩は？たしか一緒でしたよね。"
"10055170-8-サツキ" = "マコトちゃんは勝負相手を探し回ってるわ。#nクラブファイトが随分と気に入ったみたい。"
"10055170-9-サツキ" = "私はちょっと疲れたから、後のことはチアキに任せてきちゃった。"
"10055170-10-イロハ" = "……あの二人で大丈夫ですか？"
"10055170-11-サツキ" = "ん～、たしかに何か面倒事が起きちゃうかも。#nまあでも、私はここにいるから関係ないわ。"
"10055170-12-イロハ" = "……サツキ先輩がマコト先輩と長く付き合えてる理由、分かった気がします。"
"10055170-13-イロハ" = "……。"
"10055170-14-イロハ" = "はあ……本当に……ほんと～に面倒くさいけど……。"
"10055170-15-イロハ" = "マコト先輩が何かしでかしたらもっと面倒くさいから……。"
"10055170-16-イロハ" = "ちょっと様子を見に行ってきます。先生とサツキ先輩はイブキをお願いしますね。"
"10055170-17-サツキ" = "ええ。イブキちゃんはおとなしいもの。お安い御用よ。"
"10055170-18-サツキ" = "……。"
"10055170-19-サツキ" = "……えっと、どちらさま？"
"10055170-20-チセ" = "あ、サツキ先輩！"
"10055170-21-イブキ" = "こっちはチセお姉ちゃん！イブキと友達になってくれたの！"
"10055170-22-サツキ" = "この一瞬で？"
"10055170-23-サツキ" = "……怪しいわ。"
"10055170-24-サツキ" = "そこのあなた、ちょっといいかしら？"
"10055170-25-チセ" = "かいがら～。"
"10055170-26-サツキ" = "ん……？"
"10055170-27-チセ" = "拾ってたらここに着いた。"
"10055170-28-チセ" = "光と影が交差する#nアクロバティック"
"10055170-29-チセ" = "誰が置いたんだろ？"
"10055170-30-サツキ" = "……誰も置いてないと思うけど。"
"10055170-31-チセ" = "じゃあなんであるの？"
"10055170-32-サツキ" = "そうねぇ……この世には潮流とか、風とか、モノを動かすものがたくさんあるの。"
"10055170-33-サツキ" = "その内のどれかの仕業じゃない？"
"10055170-34-チセ" = "海ってすごいね。"
"10055170-35-サツキ" = "へえ、やるじゃない。大自然の偉大さが分かるのね。#nじゃあ……危険性も分かるでしょう？"
"10055170-36-チセ" = "危険？"
"10055170-37-サツキ" = "そうよ、海には危険がいっぱいなの。#n熱い太陽に荒れ狂う波、それに脱水症状だって……。"
"10055170-38-チセ" = "太陽はあったかいから好き。"
"10055170-39-サツキ" = "……どうやら意見が分かれたようね。"
"10055170-40-サツキ" = "にゃは～"
"10055170-41-ニヤ" = "これはこれは～うちのチセが世話になってるみたいで～"
"10055170-42-サツキ" = "あなたはたしか……百鬼夜行の陰陽部部長？"
"10055170-43-ニヤ" = "んにゃ？あえて自己紹介しなかったんですが……。#nご存じなのでしたら説明が省けて助かります～"
"10055170-44-ニヤ" = "では……挨拶はこれくらいにして、本題に移りましょか。"
"10055170-45-ニヤ" = "ん……カホ、よろしく。"
"10055170-46-カホ" = "ええっ！？そこまで言っておいて、私にパスですか！？"
"10055170-47-ニヤ" = "私はあくまで見守る側だから～"
"10055170-48-カホ" = "はあ……私たち陰陽部が、こうして訪ねた理由は――"
"10055170-49-カホ" = "万魔殿に「[ruby=かいしょうせん]蟹承戦[/ruby]」を申し込むためです。"
"10055170-50-イブキ" = "蟹承戦……？クラブファイトじゃなくて？"
"10055170-51-ニヤ" = "世間的にはそのように伝わっているようですね。#nですが、元々は百鬼夜行のとある地方に代々伝わる文化が広まったもので――"
"10055170-52-ニヤ" = "カホ、長くなっちゃうから。"
"10055170-53-カホ" = "そ、そうですね。#nそちらでいう、クラブファイトのようなものと思っていただいて問題ないです。"
"10055170-54-ニヤ" = "まあ、私たちはただの見物客なんですけどね～"
"10055170-55-カホ" = "できることなら、私が戦いたいくらいでしたが……。"
"10055170-56-カホ" = "この大会の華は、蟹との絆を持つ「クラブ・ファイター」――"
"10055170-57-カホ" = "――「和楽姫」の光る場所なのです！"
"10055170-58-チセ" = "うん。私と勝負しよう。"
"10055170-59-サツキ" = "えっ！？正直、勝負とか興味ないんだけど……。"
"10055170-60-ニヤ" = "ほうほう。"
"10055170-61-ニヤ" = "ならば、今回の勝負は我々の不戦勝……ということでよろしいですか？"
"10055170-62-サツキ" = "ええ。そもそも私は天下一蟹とかいう大会に興味ないし。"
"10055170-63-ニヤ" = "ふふ。でしたら万魔殿の星はこちらで……。"
"10055170-64-イブキ" = "ダメー！"
"10055170-65-サツキ" = "イブキちゃん？"
"10055170-66-イブキ" = "星がなくなったら、マコト先輩が悲しんじゃう！"
"10055170-67-イブキ" = "持っていくなら、まずイブキと勝負だよ！"
"10055170-68-サツキ" = "待って！イブキちゃんに、そんな危険なことさせられないわ！"
"10055170-69-ニヤ" = "いえ、特に危険というわけでは……。"
"10055170-70-サツキ" = "よりによって、戦いが嫌いな私とイブキちゃんしかいない時に来るなんて……。"
"10055170-71-サツキ" = "……！？も、もしかして！わざとこのタイミングを狙ったの！？"
"10055170-72-ニヤ" = "そんなまさかぁ～"
"10055170-73-ニヤ" = "たしかに、マコト議長が対戦相手を探し回ってるのは見ましたけど～"
"10055170-74-ニヤ" = "それで、「今の万魔殿は狙い目だ」とか～"
"10055170-75-ニヤ" = "そんなことは思ってませんよ～"
"10055170-76-サツキ" = "くっ！まさか情報戦で押されるなんて……。"
"10055170-77-サツキ" = "わ、分かったわ！私が相手をしてあげる！"
"10055170-78-ニヤ" = "ほお～？"
"10055170-79-サツキ" = "情報戦でやられたままなんて、万魔殿の情報部長として許せないわ！"
"10055170-80-サツキ" = "受けて立ってやろうじゃない！"
"10055170-81-ニヤ" = "……これはちょ～っと予想外の展開になってきましたねぇ。"
"10055170-82-ニヤ" = "まあ、これも一興ということで！"
"10055170-83-チセ" = "名前。"
"10055170-84-サツキ" = "え？"
"10055170-85-チセ" = "教えて。"
"10055170-86-サツキ" = "……京極サツキよ。#n誰にでも教えてるわけじゃないから、あまり言いふらさないでね。"
"10055170-87-チセ" = "うん、じゃあ始めるよー"
"10055170-88-チセ" = "万魔殿、京極サツキの挑戦を受けるー"
"10055170-89-チセ" = "立会い人は先生。見届け人はニヤ部長とカホ副部長。"
"10055170-90-サツキ" = "な、なんだか本格的ね……。"
"10055170-91-カホ" = "はい。先ほどお伝えしたように、蟹承戦は長い歴史を持つ伝統ですから。"
"10055170-92-カホ" = "それじゃあ両者、両カニは、位置について……。"
"10055170-93-カホ" = "いざ尋常に、勝負！！"
