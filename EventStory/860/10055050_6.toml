[translation]
"10055050-1" = "第5話;死せる悪魔の社会"
"10055050-2-イブキ" = "せんせー？"
"10055050-3-イロハ" = "ぐ……これはダメそうですね。"
"10055050-4-イロハ" = "想像以上に深いです。ただの穴ではなく、層が分かれているようで……。"
"10055050-5-イロハ" = "できることなら、助けたいのですが……。"
"10055050-6-マコト" = "イロハ、急げ！奴らが来るぞ！"
"10055050-7-イロハ" = "……こちらもこんな状況ですので。#nすみませんが今は各自頑張りましょう。"
"10055050-8-マコト" = "待っていろサツキ、チアキ、先生！必ず助けに来る！"
"10055050-9-イブキ" = "先生、先輩！すぐに戻るね！"
"10055050-10-サツキ" = "…………。"
"10055050-11-サツキ" = "あ、ああ……。"
"10055050-12-チアキ" = "さ、サツキ先輩しっかり！！"
"10055050-13-チアキ" = "先生、どうしましょう！？#nサツキ先輩は暗いのと怖いのがダメなんです！"
"10055050-14" = "[s1] \"まず明かりを探そう！\"\n[s2] \"少し明るくなれば大丈夫なはず！\""
"10055050-15-チアキ" = "なるほど！ナイスアイデアです！"
"10055050-16-チアキ" = "先生！サツキ先輩！"
"10055050-17-チアキ" = "部屋の電気は見つかりませんでしたが、ランタンがありました！"
"10055050-18-サツキ" = "よくやったわチアキ！早く明かりをつけて頂戴！"
"10055050-19-チアキ" = "はい！よおし、光れ！"
"10055050-20-サツキ" = "なによ、普通の部屋じゃない。怖がって損したわ。"
"10055050-21-チアキ" = "あははっ、幽霊船も大した事ないですね！"
"10055050-22-チアキ" = "というかイロハちゃんの言う通りでした。#nイロハちゃんたちとは違う階みたいです。"
"10055050-23-サツキ" = "……。"
"10055050-24-チアキ" = "サツキ先輩？"
"10055050-25-サツキ" = "静かに。今、分析中よ。"
"10055050-26-チアキ" = "あっ、はいっ。"
"10055050-27-サツキ" = "……。"
"10055050-28-サツキ" = "…………。"
"10055050-29-サツキ" = "あのー……サツキ先輩？"
"10055050-30-チアキ" = "私たち、早く逃げた方が……。"
"10055050-31-サツキ" = "そんなこと知ってるわ！#nでも……。"
"10055050-32-サツキ" = "そのために情報が必要でしょう？私たちは誰に追われているのかしら？"
"10055050-33-チアキ" = "あ……誰でしょうね？"
"10055050-34-チアキ" = "急だったからあまりちゃんと見ていませんが……幽霊？いや海賊？"
"10055050-35-サツキ" = "……いいわ。一つずつ考えていきましょう。#nチアキはこの部屋をどう思う？"
"10055050-36-チアキ" = "えっ、私ですか？えっと……古いですね。古風な感じ、といいますか。#nトリニティっぽさもあるような。"
"10055050-37-チアキ" = "うーん、よく分からないですね。先生はどうですか？"
"10055050-38-サツキ" = "まずこの家具。陸上ならありふれているけど……。"
"10055050-39-チアキ" = "というか、エンジンのない帆船にこういった空間があること自体贅沢よ。#n個人の家具があるのはもちろん、個室があるということ自体が特殊なの。"
"10055050-40-サツキ" = "それなりに地位の高い人物の部屋……もしくは貴賓室。#nでも、それなら六分儀や海図なんて要らないわね。"
"10055050-41-サツキ" = "つまりここは航海士の中でも上級職……船長室である可能性が高いわ。"
"10055050-42-チアキ" = "お、おお……ということは……？"
"10055050-43-サツキ" = "ここの集団は船長を中心とした序列やルールがあると考えられるわ。#nまあこれだけの船を運用するなら当然なんでしょうけれど。"
"10055050-44-サツキ" = "……正確には「そうだった」と言うべきかしら。#n幽霊船伝説が本当なら、船長は追い出されたはずだもの。"
"10055050-45-サツキ" = "……この海図も気になるわね。#n何か分かるかしら。"
"10055050-46-チアキ" = "うーん……すごく古い……？"
"10055050-47-チアキ" = "ごめんなさい、全然わかんないです。"
"10055050-48-サツキ" = "ふふっ、初心者にしては悪くないわ。#nただ、この海図は状態が悪いわね。羊皮紙は保存環境によってすぐに劣化するの。"
"10055050-49-サツキ" = "地図は内容を見たら大体の制作時期が分かるのよ。#nたとえばここに描かれた海路はキヴォトスで最も一般的な航路だったけど……。"
"10055050-50-サツキ" = "アビドス自治区を経由する運河が開通してからは使われてないわ。#nつまりこれが作られたのは運河の開通前と言える。"
"10055050-51-サツキ" = "さっきの六分儀もそうね。GPSがあれば必要ないし……。"
"10055050-52-サツキ" = "私たちが今使っているこのランタンも。#nほら、溶けた蝋がこびりついているでしょう？#n電気もガスも無い生活を送っていたようね。"
"10055050-53-サツキ" = "本当、数百年前の船に乗っているみたい。"
"10055050-54-サツキ" = "以上のことから……。"
"10055050-55-サツキ" = "ことから……？"
"10055050-56-チアキ" = "この船は、本物の幽霊船……パタリ。"
"10055050-57-チアキ" = "ああっ！サツキ先輩起きてください！！"
"10055050-58-サツキ" = "あ、ああ……どこまで話したかしら。"
"10055050-59-サツキ" = "えっと、この船は数百年前のものだって……。"
"10055050-60-サツキ" = "……それより、もっと怖い何かがあった気がするんだけど。"
"10055050-61-チアキ" = "い、いえ何もありません！もっとお話してください！"
"10055050-62-サツキ" = "……？まあいいわ、思い出せないんだもの。#nきっと大したことじゃないわね。"
"10055050-63-サツキ" = "まず、この船と船員が本当に数百年前の物を使っているなら、勝ち目があるかもしれないわ。"
"10055050-64-チアキ" = "勝ち目？"
"10055050-65-サツキ" = "ええ。いくら管理が行き届いたものでも、数百年も前の銃がまともに使えるとは思えない。"
"10055050-66-サツキ" = "さっきはビックリして逃げちゃったけど、私たちの方が戦力は上のはずよ。"
"10055050-67-サツキ" = "でもやっぱり、戦闘は怖いし嫌……代わりにチアキがやっつけてくれない？"
"10055050-68-チアキ" = "あはは……頑張ってサツキ先輩を守ります！"
"10055050-69-サツキ" = "言ったわね？絶対そうしてよ？"
"10055050-70-サツキ" = "……あら？そんなぼうっとして、どうかしたの先生。"
"10055050-71" = "[s3] \"いや、サツキはすごいなと思って。\"\n[s4] \"こんな状況でも落ち着いてるね。\""
"10055050-72-サツキ" = "落ち着いてる？そうね……まあチアキやイロハよりはそうかもしれないわ。"
"10055050-73-サツキ" = "あの子たちは「2年生」だもの。"
"10055050-74-サツキ" = "ん？どうしたのかしら？"
"10055050-75-サツキ" = "ああ、先生はゲヘナ生で換算したら「1年生」じゃないかしら？#n分からないことがたくさんあるのも当然ね。知る必要もないけど。"
"10055050-76-サツキ" = "そうね……経験の差、とだけ言っておくわ。"
"10055050-77-サツキ" = "先生には、いつか詳しく話す日がくるかもしれないわね。"
"10055050-78-サツキ" = "でもあまり面白い話ではないから、進んで口にしたくはないけど。"
"10055050-79-サツキ" = "ひとまずここに用はもうないわ。#nこれ以上の情報もなさそうね。"
"10055050-80-サツキ" = "脱出するにはデッキに戻らなくちゃいけないし……。"
"10055050-81-サツキ" = "そろそろ行きましょうか？"
"10055050-82-チアキ" = "あれ？先生、呼びました？"
"10055050-83" = "[s5] \"ちょっと気になることがあって。\"\n[s6] \"サツキは万魔殿でもいつもこんな感じ？\""
"10055050-84-チアキ" = "んーそんなこともないです。"
"10055050-85-チアキ" = "いや、むしろサツキ先輩のこんな姿、初めて見ました！"
"10055050-86-チアキ" = "正直、ちょっとワクワクします！まだ私の知らない一面があるなんて！"
"10055050-87-チアキ" = "……ん？いや、そんなことはないか……。"
"10055050-88-チアキ" = "そういえばサツキ先輩のことは、知らないことだらけです。"
"10055050-89-チアキ" = "いつもマコト先輩のそばで難しい話をしているイメージしかないし。"
"10055050-90-チアキ" = "でも先輩たちは私が入学する前の話はしてくれないんですよ～"
"10055050-91-チアキ" = "黒幕みたいな人っていうか、秘密のベールに包まれているっていうか。"
"10055050-92-チアキ" = "やっぱり情報部長なだけあるんでしょうか？"
"10055050-93" = "[s7] \"サツキってそんなに秘密が多いんだ？\"\n[s8] \"どちらかと言えばストレートで素直な方と思ってた。\""
"10055050-94-チアキ" = "うーん？やっぱり、先生と私たちでは視点が違うんでしょうか？"
"10055050-95-チアキ" = "あっ！！今すっごい良い記事を思いつきました！"
"10055050-96-チアキ" = "その名も「先生の視点から見た生徒とは！？」特集！"
"10055050-97-チアキ" = "どうですか？反響ありそうじゃないですか？#n無事戻れたらちゃんと取材させてくださいね！"
"10055050-98-チアキ" = "ちょっと、何を二人で楽しそうにしてるのよ！早く来て頂戴！？#nこっちは一人なのよ！"
"10055050-99-チアキ" = "あわわ、はいはい！元宮チアキ参りますー！！"
"10055050-100-チアキ" = "ここは倉庫でしょうか？"
"10055050-101-チアキ" = "ちょっと暗すぎるわ！明かりはないの？"
"10055050-102-チアキ" = "さっきのランタン、持ってくればよかったですね。#nいや今持ってきましょうか？"
"10055050-103-サツキ" = "いや行かないで！人数が減るじゃない！？"
"10055050-104-サツキ" = "……仕方ないわね。"
"10055050-105-サツキ" = "先生、手握っててくれる？"
"10055050-106-サツキ" = "そうよ、その調子。絶対離さないでよ、絶対！"
"10055050-107-サツキ" = "この規模の倉庫なら、情報が山のようにあるはず……。#nバッと探して、パッと手がかりだけ見つければ――"
"10055050-108-サツキ" = "…………。"
"10055050-109-サツキ" = "やっぱりダメ、チアキ！さあ出動よ！"
"10055050-110-チアキ" = "はいっ！元宮チアキ、突撃します！"
"10055050-111-チアキ" = "何か手がかりは……。"
"10055050-112-チアキ" = "ん？これ……。"
"10055050-113-チアキ" = "先生、サツキ先輩！ここにこんな物が！"
"10055050-114" = "[s9] \"ハンカチ？\"\n[s10] \"なんかマークがある……。\""
"10055050-115-チアキ" = "私が知っているものとはちょっと違いますが……。"
"10055050-116-チアキ" = "でも間違いありません！これはゲヘナの校章です！"
"10055050-117-サツキ" = "ゲヘナの校章？ちょっと見せて頂戴。"
"10055050-118-サツキ" = "よくやったわチアキ。大きな収穫よ。"
"10055050-119-サツキ" = "このハンカチのマーク、たしかにゲヘナのものだわ。"
"10055050-120-チアキ" = "じゃあこの海賊……実はゲヘナの生徒だったのでしょうか？"
"10055050-121-サツキ" = "でもどうしてこれが……？"
"10055050-122-チアキ" = "こんな面白い子たち、私が知らないはずないのにな～"
"10055050-123-サツキ" = "…………。"
"10055050-124-チアキ" = "あの、サツキ先輩？"
"10055050-125-サツキ" = "……つまり、あれは……そういう……。"
"10055050-126" = "[s11] \"すごい集中力……。\"\n[s12] \"一瞬で集中モードに入っちゃった。\""
"10055050-127-チアキ" = "あはは、そうですね。"
"10055050-128-サツキ" = "……というか私たち、大丈夫なんでしょうか？"
"10055050-129-チアキ" = "結構長い間迷子になってる気がするんですが、そろそろ海賊がここに来ても……。"
"10055050-130-チアキ" = "うわああっ！？本当に出た～～っ！？"
"10055050-131-チアキ" = "きゃあっ！チアキ、先生！早く退治して！！"
"10055050-132-？？？" = "ヨーホホ！ここに居たのだな！"
"10055050-133" = "[s] \"この声は……。\""
"10055050-134" = "[ns] \"もしかしてマコト？\""
"10055050-135-マコト" = "いいや、それは違うな。"
"10055050-136-マコト" = "これからは「キャプテンマコト」と呼ぶがいい！"
