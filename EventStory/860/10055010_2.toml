[translation]
"10055010-1" = "第1話;ロマンティック・クルージング"
"10055010-2" = "（晴れた空）"
"10055010-3" = "（静かにさざなみが立ち、潮風が頬を撫でる）"
"10055010-4" = "（船旅には絶好の日和だった）"
"10055010-5-マコト" = "――それで。"
"10055010-6-マコト" = "我々の船はどこにある？"
"10055010-7-漁師" = "キミ……羽沼マコトといったか。"
"10055010-8-マコト" = "ああ。この私が万魔殿の最高議長でありゲヘナ唯一の指導者。#n天上天下唯我独尊――羽沼マコト様だ。"
"10055010-9-漁師" = "てんじょうてん……？まあいい、ほらここに署名があるだろう？#n「羽沼マコト」って。"
"10055010-10-マコト" = "いいや、そんなはずはない！"
"10055010-11" = "このちんけな船が！？"
"10055010-12" = "こんな――少しの波で沈没しそうなおんぼろ船が……！"
"10055010-13" = "我々の乗るクルーズ船だと！？"
"10055010-14-マコト" = "イロハ！どういうことだこれは！？"
"10055010-15-イロハ" = "どういうことも何も……私が提案したものを全部却下したのはマコト先輩じゃないですか。#nそんなものよりこっちのほうがお得だ、とかなんとか言って。"
"10055010-16-マコト" = "い、いやそれはそうだが……#nたしかに、やけに安いとは思ったが……。"
"10055010-17-マコト" = "はっ……！まさか風紀委員が、卑劣な罠を仕掛けて……！？"
"10055010-18-イロハ" = "はぁ……そんなわけないでしょう。#nそろそろ現実を見てください。"
"10055010-19-イロハ" = "つまり……値段に釣られてこの船を契約した、ってことで合ってます？"
"10055010-20-イロハ" = "というか、契約前に分かりますよね普通……。"
"10055010-21-マコト" = "ええいっ！この程度、些事だ！大体、マコト様だって事前に――"
"10055010-22-漁師" = "ん、何かトラブルかのう？#n一応、事前に確認の写真も送っているのだが……。"
"10055010-23-マコト" = "……だそうですけど。"
"10055010-24-マコト" = "万魔殿の議長であるこのマコト様に、いちいち確認する暇があるとでも！？"
"10055010-25-イロハ" = "開き直りもここまでくるといっそ芸術的ですね。"
"10055010-26-サツキ" = "じゃあ、旅行はキャンセルかしら？"
"10055010-27-マコト" = "当然だ！こんな船で旅行に行ったなど知られてみろ？我々は世間の笑いものだ！"
"10055010-28-イブキ" = "旅行……キャンセル？"
"10055010-29-イブキ" = "いかないの……？"
"10055010-30-イブキ" = "もしかして……イブキのせい？#nイブキがいい子にしてなかったから？"
"10055010-31-マコト" = "ぬぁっ！？"
"10055010-32-マコト" = "そ、んなことはないぞイブキ！#n船は海に浮かべばいい！大きさの違いなど些事だ！"
"10055010-33-マコト" = "うむ！私が間違っていた。我々は予定通り船旅ができるというわけだ。#nそうだろう先生！？"
"10055010-34" = "[ns] \"そういうこったぁ！！！\""
"10055010-35-イロハ" = "……はぁ、仕方ないですね。"
"10055010-36-イロハ" = "マコト先輩はともかく、イブキを悲しませるわけにはいきませんので。"
"10055010-37-サツキ" = "マコト先輩もイロハちゃんも、なんだかんだ言って、イブキちゃんに甘いですね！"
"10055010-38-サツキ" = "ふぅん？まあ、私はどっちでもいいけど……#nなんだか、思ってたのとはちょっと違うわね。"
"10055010-39-漁師" = "ふむ……話がまとまったようじゃな。"
"10055010-40-漁師" = "まあ、こんな見た目の船じゃが、30年間頑張っておる。"
"10055010-41-漁師" = "それに、万が一床に穴が開いたとしても、この周辺はオデュッセイア海洋高等学校の巡回エリアだから大丈夫じゃ。#n救難信号を送れば、沈む前には助けてくれるはずじゃ。はっはっは！"
"10055010-42-サツキ" = "……それ、冗談だとしても笑えないわ。#n本当に大丈夫なのよね？"
"10055010-43-チアキ" = "サツキ先輩、怖がらなくても大丈夫ですよ！でも怯えてるサツキ先輩の顔もいいですね！記念に1枚、はい、チーズ！"
"10055010-44-漁師" = "ああ、そうじゃもう一つ……。あまり、遠くへ行き過ぎないようにな。"
"10055010-45-サツキ" = "あの、マコトちゃん……これ本当は危険なんじゃない？"
"10055010-46-漁師" = "いや、そういう話ではなくてのう。#n……最近、幽霊船が出るっていう噂があるんじゃよ。"
"10055010-47-サツキ" = "ゆっ、幽霊船……！？"
"10055010-48-漁師" = "わしよりはキミらの方が詳しそうじゃが……知らんのかね？"
"10055010-49-チアキ" = "噂とゴシップなら、万魔殿の書紀であるこの私――元宮チアキにおまかせあれ！#n……聞いたことがあります！"
"10055010-50-チアキ" = "むかーしむかし……海の秘宝を見つけた海賊は、財宝を独り占めすべく船長を追い出しました。"
"10055010-51-チアキ" = "海神の怒りに触れた海賊たちは、今も霧の中をさまよい続けているのだとか……。"
"10055010-52-チアキ" = "……あれ？自分が読んだ時は結構怖かったんですが。"
"10055010-53-サツキ" = "その話、情報部長の私でも初耳だわ。詳しいのねチアキ。"
"10055010-54-チアキ" = "えへへっ、ありがとーございます！"
"10055010-55-マコト" = "ふむ、議長であるマコト様もだ。#nおい、戦車長――イロハは聞いたことあるか？"
"10055010-56-イロハ" = "え？何ですか……急に。#n私はやりませんよ。"
"10055010-57-イロハ" = "一応、聞いたことあります。"
"10055010-58-イロハ" = "SNSのトレンドでよく回ってくるので。#n知らない人の方が少ないと思いますよ。"
"10055010-59-チアキ" = "なんでそんな噂が出回るのよ……気味悪いわねぇ。"
"10055010-60-チアキ" = "結構、目撃情報があったらしいですよ？"
"10055010-61-サツキ" = "目撃情報？"
"10055010-62-チアキ" = "はい！なんでも、同じ場所、同じ時間で船を見た人がそこそこいるみたいなんです。"
"10055010-63-チアキ" = "本当に……幽霊船なのかもしれませんね。"
"10055010-64-漁師" = "キミたちも、あの噂を検証しにきたのかい？"
"10055010-65-チアキ" = "あれっ、船長さんは信じてないんですか？"
"10055010-66-漁師" = "当然じゃ。ここで何年漁師をやってると思っておる。#nそもそも幽霊船が実在するなら、わしがとっくの昔に目撃しておるわい。"
"10055010-67-漁師" = "例の噂のせいで街中が騒がしくて仕方ない……はぁ。"
"10055010-68-チアキ" = "あちゃ～……それもそうですよね。"
"10055010-69-チアキ" = "昔話なのに、最近になって目撃情報が出るっていうのがそもそもおかしいですし……。"
"10055010-70-チアキ" = "そう考えると、最初に噂の投稿を見てから急激に見るようになった気も……。"
"10055010-71-チアキ" = "なんか流行ってるんですかね？誰かが言い出したから、自分も見たって言ってる人が増えているだけかもしれませんが。"
"10055010-72-サツキ" = "結局ただの嘘ってこと？#nこんな噂を広めて、何の得があるっていうのかしら……。"
"10055010-73-漁師" = "まぁ、噂はともかく……最近霧が多いのは本当じゃ。#nちょっとでも海の様子がおかしかったらすぐに引き返すんじゃぞ。"
"10055010-74-漁師" = "海は気まぐれなもの。慎重に事を運ぶにこしたことはない。"
"10055010-75-マコト" = "キキキッ！この晴天で何を言う。心配することなどない。"
"10055010-76-イロハ" = "マコト先輩、フラグ立てないでください。"
"10055010-77-サツキ" = "お！それじゃあ行くんですね？いい写真がいっぱい撮れそうです！"
"10055010-78-サツキ" = "でも、この船ちょっと小さいわね……くっついて乗らないと。"
"10055010-79-イブキ" = "じゃあイブキは先生のお膝に座るね！"
"10055010-80-マコト" = "い、イブキぃ！？私の膝も空いているぞ？イブキ～～！？"
"10055010-81-サツキ" = "へぇ、結構いいんじゃない？"
"10055010-82-チアキ" = "たしかに、パワースポットって感じがしますね！#nあ、イロハちゃん、はいチーズ！"
"10055010-83-イロハ" = "勝手に撮らないでください。肖像権の侵害です。"
"10055010-84-チアキ" = "あははっ！記念撮影だってば！せっかくの海なんだから。"
"10055010-85-チアキ" = "……あれ？そういえばマコト先輩がいないですね。"
"10055010-86-サツキ" = "マコトちゃんなら中にいるわ。#n酔っちゃったみたい。"
"10055010-87-イロハ" = "酔うのになんで船旅なんて計画したんだか。"
"10055010-88-チアキ" = "「豪華客船」に惹かれたとか！#nマコト先輩、そういうの好きだし？"
"10055010-89-イロハ" = "はぁ……見栄を張りたいだけのような。"
"10055010-90-チアキ" = "んー……でもなんだか心配だし……私見てこよっかな。#n念のためカメラも持って――"
"10055010-91-イロハ" = "カメラ……？"
"10055010-92-チアキ" = "普段、気合を入れた写真ばかりなので、たまには弱った姿もあるとギャップになっていいかな～と！"
"10055010-93-イロハ" = "ああ、そういう……1枚くらいはあってもいいんじゃないですかね。"
"10055010-94" = "[s] \"マコトにも弱いものがあるんだ……。\""
"10055010-95-チアキ" = "マコト先輩は隠してますけどね！あんまり触れないようにしてあげた方がいいですよ！"
"10055010-96-チアキ" = "それではとつげーき！"
"10055010-97-チアキ" = "マコト先輩～失礼しまーす！"
"10055010-98-マコト" = "ああ、チアキと……先生か。どうかしたのか？"
"10055010-99-チアキ" = "先輩の様子が気になりまして！大丈夫ですか？#nあとお写真お撮りしても？"
"10055010-100-マコト" = "き、キキッ……ああ、問題ない。"
"10055010-101" = "[s] \"大丈夫？無理しないでね。\""
"10055010-102-マコト" = "キキッこの程度……万魔殿の議長たる者。"
"10055010-103-マコト" = "いつどこでも堂々と……うっぷ……！"
"10055010-104" = "[s1] \"無理して喋るから……。\"\n[s2] \"ゆっくり休んで。\""
"10055010-105-マコト" = "ああ。先生の厚意に甘えて休むとしよう。"
"10055010-106-チアキ" = "マコト先輩、元気なかったねぇ。"
"10055010-107-イロハ" = "そうですね。いつもあれくらい静かならいいんですが。"
"10055010-108-チアキ" = "イロハちゃん辛辣ぅ！"
"10055010-109-イブキ" = "サツキ先輩！見て！カモメ！"
"10055010-110-サツキ" = "あら、本当ね。船についてきているのかしら。"
"10055010-111-チアキ" = "ふっふーん？"
"10055010-112-イロハ" = "……なんですか急に。"
"10055010-113-チアキ" = "イロハちゃん、なんだか浮かれてる？"
"10055010-114-イロハ" = "なんのことですか？"
"10055010-115" = "[s] \"こうやってみんなでお出かけするのっていいよね。\""
"10055010-116-イロハ" = "まあ……悪くはないですね。"
"10055010-117-チアキ" = "……？いま変な音しませんでした？#nプシュー、みたいな。"
"10055010-118-イロハ" = "あれは……ディーゼルエンジンの音ですね。#nでも今のは……。"
"10055010-119-イロハ" = "嫌な予感がします。#n見に行きましょう。"
"10055010-120-イロハ" = "これは……。"
"10055010-121-イロハ" = "エンジンが、止まってしまいました。"
"10055010-122" = "[log]漂 流  1 日 目[/log]"
