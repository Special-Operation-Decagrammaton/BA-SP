[translation]
"10055200-1" = "メスデク、泡となる白昼夢の投影"
"10055200-2-カイザーPMC理事（？）" = "シャーレの先生か。"
"10055200-3-カイザーPMC理事（？）" = "ああ……そうだ、私だ。#n前カイザーPMCの理事であり、前オクトパスバンクの営業職員の。"
"10055200-4-カイザーPMC理事（？）" = "……今は何者でもない、ただの私だ。"
"10055200-5-カイザーPMC理事（？）" = "しかし先生が私をまだ「カイザーPMC理事」と呼ぶのなら、#n今この瞬間だけはそうなのだろう。"
"10055200-6-カイザーPMC理事（？）" = "そもそもこの世界の本質は先生が決めているのだから。"
"10055200-7-カイザーPMC理事（？）" = "そろそろ気付いていると思うが……。"
"10055200-8-カイザーPMC理事（？）" = "これはあくまで一つの白昼夢――海面まで上れば泡となって消えてしまうような、#nそんな話だ。"
"10055200-9-カイザーPMC理事（？）" = "……まるで私のようにな。"
"10055200-10-カイザーPMC理事（？）" = "一時はカイザーグループという大企業の理事として、#n富と権力のすべてを手にした……。"
"10055200-11-カイザーPMC理事（？）" = "しかし今となっては、何もかもが水の泡だ。"
"10055200-12-カイザーPMC理事（？）" = "世界は……平等に価値がなく、そして虚しい。"
"10055200-13-カイザーPMC理事（？）" = "……失礼。また我が身を嘆いてしまった。"
"10055200-14-カイザーPMC理事（？）" = "今から君が相まみえる存在は……。#nあるはずの無い夢の頂――膨大な悪夢の集合体。"
"10055200-15-カイザーPMC理事（？）" = "その名も、メガトン・スーパー・デンジャラス・クラブ……略して、メスデク。"
"10055200-16-カイザーPMC理事（？）" = "……先生よ、これは炎暑が見せるひとときの夢。#n一度過ぎ去ってしまったものは二度と戻ってこない。"
"10055200-17-カイザーPMC理事（？）" = "そんな場所で、君はどんな価値を見出す？"
