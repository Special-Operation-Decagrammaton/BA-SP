[translation]
"10055160-1" = "東奔西走、年中無休マッドドッグ"
"10055160-2-イブキ" = "わあ！お祭りだ～！"
"10055160-3-サツキ" = "へぇ、結構賑わってるのね。"
"10055160-4-チアキ" = "おお！結構大きなイベントなんですね！テンション上がってきました！"
"10055160-5-イブキ" = "美味しそうな匂い～"
"10055160-6-サツキ" = "ふふっ、久々に海鮮以外が食べられそうね。"
"10055160-7-チアキ" = "へいへーい、そこの可愛いおねーさんたち。"
"10055160-8-コノカ" = "ちょーっとこっちに来てもらえます？"
"10055160-9-チアキ" = "ヴァルキューレ！？チアキ、一体何やらかしたのよ！"
"10055160-10-チアキ" = "へっ！？な、何もしてませんよ～！"
"10055160-11-カンナ" = "副局長、いきなり呼び止めたら驚くだろう。"
"10055160-12-コノカ" = "あー、たしかに。さーせん。"
"10055160-13-カンナ" = "本当に反省してるのか？まったく……。コホン、失礼した。"
"10055160-14-カンナ" = "改めて、我々はヴァルキューレ警察学校の者だ。"
"10055160-15-カンナ" = "東奔西走、#n年中無休マッドドッグ"
"10055160-16-カンナ" = "今はこの島の治安を担当している。"
"10055160-17-カンナ" = "そちらの噂はかねがね。なんでも、対策委員会を倒したとか。"
"10055160-18-イロハ" = "それは事実ですが……どうしてそれを？"
"10055160-19-コノカ" = "こんな小さい島っすから、噂はすーぐ広まるんすよ。"
"10055160-20-コノカ" = "対策委員会は優勝候補の一つでしたし。"
"10055160-21-カンナ" = "これはちょっとした事件だ。"
"10055160-22-カンナ" = "それに、ザリガニとヤドカリは明らかな上下関係にある生物……。"
"10055160-23-カンナ" = "町の秩序に加えて、生態系を乱されたとあっては、我々も黙ってはいられない。"
"10055160-24-マコト" = "……キキキッ。なるほど。"
"10055160-25-マコト" = "そんな言い訳をしてまで私たちの邪魔をしたいのか？"
"10055160-26-マコト" = "いいだろう。その挑戦、受けて立とうではないか！"
"10055160-27-カンナ" = "……フッ。"
"10055160-28-マコト" = "何がおかしい？"
"10055160-29-カンナ" = "これは失礼……確かに、対策委員会は強力な優勝候補だったが……。"
"10055160-30-カンナ" = "順位は公安局よりも下だった。"
"10055160-31-カンナ" = "挑戦者は、そちらの方だ。"
"10055160-32-マコト" = "お……面白い！"
"10055160-33-マコト" = "連邦生徒会の犬ごときに、本気を出すまでもないわ！"
"10055160-34-イロハ" = "うわ、雑魚みたいなセリフ。"
"10055160-35-マコト" = "うるさいぞイロハ！"
"10055160-36-マコト" = "さあチアキ！万魔殿の書記として、威厳を見せてこい！"
"10055160-37-チアキ" = "えっえっ！？私ですか！？急すぎません！？"
"10055160-38-イロハ" = "おおっ！"
"10055160-39-イロハ" = "頑張ってください、チアキ。応援してます。"
"10055160-40-チアキ" = "イロハちゃん、今すごい喜んでなかった！？"
"10055160-41-イロハ" = "いや、いつもは私がそっち側なんで。はたから見てる分には楽しいもんですね。"
"10055160-42-チアキ" = "ひ、ひどい！"
"10055160-43-チアキ" = "うぅ……こうなった以上、やるしかありませんね！"
"10055160-44-チアキ" = "いきますよ、ブラックドリー！私たちの絆を見せつけてやりましょう！"
"10055160-45-コノカ" = "ふっ、選手が決まったみたいっすね。"
"10055160-46-コノカ" = "それじゃ両カニ、位置について……！"
"10055160-47-コノカ" = "クラブ、ファイッ！！"
