[translation]
"10002010-1" = "第1話;夏の海辺とお邪魔虫（１）"
"10002010-2-ヒフミ" = "では、一番簡単にできそうなことから始めましょう！"
"10002010-3-ヒフミ" = "えっと、この中で行くと……"
"10002010-4-ヒフミ" = "「砂のお城と砂風呂作り」！"
"10002010-5-ヒフミ" = "えへへ、これなら普通にできそうです！"
"10002010-6-ヒフミ" = "では、まずは私が作ってみることにします！"
"10002010-7-ヒフミ" = "先生、良い感じのタイミングで写真を撮ってくださいね！"
"10002010-8-ヒフミ" = "楽しそうな感じで写るようにお願いします！"
"10002010-9" = "[s1] \"なんだか本末転倒というか……。\"\n[s2] \"楽しそうな姿をじゃなくて、楽しそうに写るように……？\""
"10002010-10-ヒフミ" = "も、もちろん純粋に楽しみたい気持ちはあるのですが、"
"10002010-11-ヒフミ" = "も、もちろん純粋に楽しみたい気持ちはあるのですが、"
"10002010-12-ヒフミ" = "まずはミッションをこなさないとですし……！"
"10002010-13-ヒフミ" = "失敗して爪は嫌なので、どうにか成功させないと……"
"10002010-14-ツルギ" = "……。"
"10002010-15-ヒフミ" = "ひいぃっ！？す、すみません！な、何かご気分でも害しましたか……！？"
"10002010-16" = "[s] \"大丈夫、ツルギも楽しそうだし。\""
"10002010-17-ヒフミ" = "そ、そうなんですか……？"
"10002010-18-ヒフミ" = "ではあらためて、"
"10002010-19-ヒフミ" = "水を入れて……"
"10002010-20" = "ここに穴を……"
"10002010-21-ヒフミ" = "んしょっ！"
"10002010-22-ツルギ" = "……。"
"10002010-23-ヒフミ" = "少しずつ濡らして……崩れないように……。"
"10002010-24-ツルギ" = "……。"
"10002010-25-ヒフミ" = "できました！完成です！！"
"10002010-26-ツルギ" = "……。"
"10002010-27-ヒフミ" = "い、いかがでしょうツルギさん？お気に召しましたか……？"
"10002010-28" = "ダダダダダダダダッ！！"
"10002010-29-ヒフミ" = "きゃっ！？……ああっ、せっかくの砂のお城が！？"
"10002010-30-チンピラB" = "あはははははははっ！"
"10002010-31-チンピラA" = "誰の許可もらって、ここで砂遊びなんかやってるわけ？あぁん？"
"10002010-32-チンピラB" = "この[ruby=むいがはま]無為ヶ浜[/ruby]は、昨日からあたしらのもんなんだけど！ショバ代はどうしたよ！？"
"10002010-33-ヒフミ" = "えっ、えぇ……！？"
"10002010-34-ツルギ" = "……！？"
"10002010-35-ツルギ" = "……。"
"10002010-36-チンピラA" = "えぇぇぇぇぇっ！？"
"10002010-37-チンピラB" = "吹っ飛ばされた！？なんつぅ怪力だよ！？"
"10002010-38-ツルギ" = "てめぇらあああぁぁぁーーーー！！！"
"10002010-39-アズサ" = "……よくも、"
"10002010-40-アズサ" = "ヒフミが作った砂の城を壊したな。"
"10002010-41-ヒフミ" = "え、はい……！？"
"10002010-42-アズサ" = "許せない……協力するよ、正義実現委員会の委員長。"
"10002010-43-ツルギ" = "きしゃああぁぁぁぁぁーーー！！"
