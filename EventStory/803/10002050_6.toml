[translation]
"10002050-1" = "第5話;泳ぎを習得する（１）"
"10002050-2-ヒフミ" = "では、せっかく海に来たわけですし、泳ぐとしましょう！"
"10002050-3-ヒフミ" = "あ、でもリストには「泳ぎを習得する」と書かれてますね……。"
"10002050-4-ヒフミ" = "ただ泳いでいる写真を撮るのではなく、泳げない人に教えているところを撮らないといけないのでしょうか？"
"10002050-5-ヒフミ" = "こ、この中に、泳げない人っていらっしゃいますか？"
"10002050-6-ヒフミ" = "私は、泳げないというほどではないので……。"
"10002050-7-アズサ" = "海に来たのは初めてだけど、訓練としての水泳なら習得済み。"
"10002050-8-マシロ" = "私も、ある程度泳いだことはあります。"
"10002050-9-ツルギ" = "……。"
"10002050-10-ツルギ" = "……ひひ。"
"10002050-11" = "[s1] \"ツルギも泳げるんだね。\"\n[s2] \"どうやらみんな泳げるみたいだね。\""
"10002050-12-ヒフミ" = "だ、だとすると……"
"10002050-13-ヒフミ" = "だ、だとすると……"
"10002050-14-ヒフミ" = "これは、どう頑張っても実行できないということですか……！？"
"10002050-15-アズサ" = "……！"
"10002050-16-アズサ" = "なるほど、そういう罠か。"
"10002050-17-アズサ" = "昔の物語にもある、珍しくもないやり方だ。遠回しに拒絶するために、あえて無理難題をふっかける……。"
"10002050-18-アズサ" = "やられた……！"
"10002050-19-ヒフミ" = "さ、流石にそういうことではないと思いたいですが……。"
"10002050-20-ヒフミ" = "にしても、困りましたね……。"
"10002050-21-ヒフミ" = "……習得しているように見える写真なら、「できないふり」、でも良いのでしょうか？"
"10002050-22-アズサ" = "なるほど。書かれていることは「泳ぎを習得する」だとしても、ミッション自体は「そういうシーンの写真を撮る」こと。"
"10002050-23-アズサ" = "毒を以て毒を制す、そういうことか。ヒフミ、その考えは悪くない。"
"10002050-24-アズサ" = "問題無いな、監視役？"
"10002050-25-マシロ" = "え、私ですか？"
"10002050-26-マシロ" = "まあ、大丈夫なんじゃないでしょうか。多分……。"
"10002050-27-アズサ" = "よし。じゃあ監視役の許可も下りたことだし、始めるとしよう。"
"10002050-28-アズサ" = "ところで、教わる役と教える役は誰がやる？"
"10002050-29-ヒフミ" = "やっぱりここは、"
"10002050-30-ヒフミ" = "先生じゃないでしょうか……？"
"10002050-31" = "[s] \"……私？\""
"10002050-32-ヒフミ" = "「ふり」だとバレないように、説得力のことを考えると……教えるといったら先生かなと思いまして。"
"10002050-33" = "[s] \"なるほど、私で良ければ喜んで。\""
"10002050-34-ヒフミ" = "あ、ありがとうございます！"
"10002050-35-ヒフミ" = "えっと、でしたらあまり深くないところで、先生に手を繋いでいただいて……"
"10002050-36-ヒフミ" = "それで、てきとうにバタ足をする……"
"10002050-37-ヒフミ" = "そんな感じで良さそうですね？"
"10002050-38-ヒフミ" = "えっと、では教わる方を……"
"10002050-39-ヒフミ" = "……あ、あれ？みなさんどこに……？"
"10002050-40-マシロ" = "そういえば私泳げないんでした、溺れそうですー、先生助けてくださーい。"
"10002050-41-アズサ" = "緊急事態につき支援を要請する。繰り返す、緊急事態につき支援を要請する。"
"10002050-42-ツルギ" = "くへぁっ！あぶっ、あっぷ！くへぁぐぼぼぼぼっ！ぐへっ、けへっ！！うぇっ！？ぎゃぶっ、ごぼぼっ……！！？"
"10002050-43-ヒフミ" = "え……あれ？"
"10002050-44" = "[s3] \"みんな演技が上手だね。\"\n[s4] \"……ツルギ、もしかして本当に溺れてない？\""
"10002050-45-ヒフミ" = "み、みなさんさっき泳げるって――"
"10002050-46-ヒフミ" = "み、みなさんさっき泳げるって――"
"10002050-47" = "ダダダダダダダダッ！！"
"10002050-48-ヒフミ" = "きゃっ！？"
"10002050-49-チンピラB" = "見ろ！あいつら何だか知らねえけど、溺れてやがるぜ！"
"10002050-50-チンピラA" = "ナイスタイミング！これはチャンスだ！"
"10002050-51-チンピラA" = "さっきの仕返しをしてやろう！"
"10002050-52-チンピラA" = "おい！みんなを連れてこい！"
"10002050-53-ツルギ" = "ふー、ふー……ああん？"
"10002050-54-マシロ" = "……戦闘ですか？"
"10002050-55-チンピラB" = "……え？"
"10002050-56-チンピラA" = "あれぇ……？"
"10002050-57-チンピラA" = "そういえばその辺り、膝くらいまでの深さしかなかったな……？"
