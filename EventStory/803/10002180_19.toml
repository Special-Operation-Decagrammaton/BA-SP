[translation]
"10002180-1" = "後日談その5;狙撃手の矜持"
"10002180-2" = "（その後スイカ割りに使ったスイカを、みんなで食していた）"
"10002180-3-ヒフミ" = "このスイカ、冷たくて美味しいです！"
"10002180-4-マシロ" = "そうですね。ちょっと砂が付いてしまいましたが、甘くて良い感じです。"
"10002180-5-ヒフミ" = "こんなに砂が付いてしまったのはその、銃を使ったからだと思うのですが……。"
"10002180-6-ヒフミ" = "えっと、あ、アズサちゃんはどうです？美味しいですか？"
"10002180-7-アズサ" = "水分補給には最適だね。ただ、こういう摂取方法では、あまりにも簡単に多量の水分が摂取できてしまうことが、逆にデメリットかな。"
"10002180-8-アズサ" = "不意の利尿作用にどう対応するか、その方策を考えておかないと……。"
"10002180-9-ヒフミ" = "あわわわっ！"
"10002180-10-ヒフミ" = "そ、そういう話は今はダメです！他の方もいますし、その、せ、先生もいらっしゃいますし……！"
"10002180-11-ツルギ" = "す、すすすスイカ……！せ、先生と一緒に、す、スイカ……きひひひひひっ、モグモグ……。"
"10002180-12-ツルギ" = "くひひひひひ、ひひっ……。"
"10002180-13-イズミ" = "モグモグモグモグ……うーん、美味しい～！"
"10002180-14-イズミ" = "スイカってすごいよね！塩を振っても美味しいし、砂糖をかけても美味しいし！"
"10002180-15-イズミ" = "はっ、だとするともしかして……わさびを付けても美味しかったり！？"
"10002180-16-ヒフミ" = "はいっ！？わ、わさびは流石に、無理なのではないでしょうか……！？"
"10002180-17-ヒフミ" = "（それにしても良かったです。ようやく、ちょっと平和なひと時が……スイカ割りという名の狙撃合戦も、中断してもらえましたし……）"
"10002180-18-ヒフミ" = "さて、では食べ終わったら次の項目を始めましょうか？"
"10002180-19-ヒフミ" = "えっと、ハスミさんからもらったリストで残っているのは……"
"10002180-20-イズミ" = "あ、そういえば私、一つ気になることがあるんだけど……。"
"10002180-21-ヒフミ" = "は、はい。なんでしょう、イズミさん？"
"10002180-22-イズミ" = "結局さっきのあのスイカ割り？の勝負は、どっちが勝ったの？"
"10002180-23-ヒフミ" = "……はい？"
"10002180-24-ヒフミ" = "ちゅ、中断させたイズミさんがそれを言いますか！？というかその話題、再燃させちゃ駄目です！！"
"10002180-25-アズサ" = "……そういえば、まだ決着はついてない。"
"10002180-26-マシロ" = "危うく失念するところでした、ありがとうございます。このまま曖昧にしてしまっては、正義実現委員会の名折れです！"
"10002180-27-アズサ" = "それはこっちも同じ。明確な結論を出さずに戦場から退くなんて……補習授業部の名にかけて、そんなことは出来ない。"
"10002180-28-ヒフミ" = "アズサちゃん！？補習授業部の看板にそんな重さは無いと思いますよ！？"
"10002180-29-アズサ" = "にしても、勝負を続けようにもスイカがもう無いし……。"
"10002180-30-マシロ" = "では、別のものを使いましょう！"
"10002180-31-マシロ" = "あのヤシの木の実なんていかがでしょうか？"
"10002180-32-アズサ" = "なるほど。私としてはもっと難易度を高くして、あの浜辺の岩に乗っかっている小石でも構わない。"
"10002180-33-マシロ" = "そういうことであれば、あの水平線あたりに浮かんでいるブイでも大丈夫です！"
"10002180-34-ヒフミ" = "お、お二人ともちょっと待ってください……！"
"10002180-35-ヒフミ" = "ここで競っても何にもなりませんし、危ないですし……それよりもその、ハスミさんから渡されたリストを……！"
"10002180-36" = "[s] \"まあスポーツの範疇だと思うし、良いんじゃないかな？\""
"10002180-37-ヒフミ" = "先生まで！？"
"10002180-38-アズサ" = "そういえば、ちょうどここに先生が海岸のお店で購入した「1/7スケールフィギュア」……？とかいうものがある。"
"10002180-39-アズサ" = "ちょうど分かりやすくて良い的になりそうだ。先生、ちょっと借りるね。"
"10002180-40" = "[s] \"無益な争いは止めた方が良いと先生は思うな！！！！\""
"10002180-41" = "（ドタバタ……ドカン！！パキィィィンッ！）"
"10002180-42-ヒフミ" = "ど、どうして結局こうなっちゃうんですかぁぁっ！？"
"10002180-43-イズミ" = "モグモグ……。"
"10002180-44-イズミ" = "うん！"
"10002180-45-イズミ" = "スイカにわさびも結構合うね！！"
