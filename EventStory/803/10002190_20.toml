[translation]
"10002190-1" = "後日談その6;ある種のエクストリームスポーツ"
"10002190-2-ヒフミ" = "ビーチバレー……つまり、二人一組でチームを組み、砂浜で行う形のバレーボールです。"
"10002190-3-ヒフミ" = "……なのですが、トリニティの体育の授業では「6人制のバレーボール」しかやったことがないので、ビーチバレーの動きやルールはちょっと良く分からないんですよね……。"
"10002190-4-ヒフミ" = "だからといって、6人制にするには人数が足りませんし……。"
"10002190-5-ヒフミ" = "というわけで、今回は特別にスケバンのみなさんに、お相手をお願いすることにしました！"
"10002190-6-チンピラA" = "あんたら正気か……？あそこまでドンパチやっておいて、ボール遊びに付き合えって？"
"10002190-7-チンピラB" = "いくら負けた身とはいえ、こっちにだってプライドがあんだよ！"
"10002190-8-チンピラA" = "あたしらがそんな「はいそうですか」って言うわけが――"
"10002190-9" = "……ありまーす！やりたいです！ぜひやらせてください！"
"10002190-10-チンピラB" = "じ、実は結構前から、ビーチバレーに興味あったんだよなぁ～。"
"10002190-11-チンピラA" = "みんなでやるビーチバレー楽しみだなー！うぇ～い！！！"
"10002190-12-ヒフミ" = "こんなに快く応じてくださるなんて……。"
"10002190-13-ヒフミ" = "ありがとうございます！"
"10002190-14-ヒフミ" = "では、早速始めましょうか？"
"10002190-15-ヒフミ" = "さて、ネットも設置できましたし……"
"10002190-16-ヒフミ" = "それでは、ツルギさんのサーブからお願いします！"
"10002190-17-チンピラA" = "ちっ、泣く子も黙ると有名なあたしらスケバンが、どうしてこんなことに……。"
"10002190-18-チンピラB" = "はぁ……ま、所詮ボール遊びだ。難しいことでもないし、てきとーに付き合って解散ってことにしよう。"
"10002190-19-チンピラA" = "あ、そっちにサーブ来――"
"10002190-20-チンピラC" = "ぐぼぁぁっっ！？"
"10002190-21-チンピラA" = "なっ！？"
"10002190-22-チンピラB" = "な、何だ？空襲か！？"
"10002190-23-チンピラA" = "い、いや、ただボールが飛んできただけ……の、はず。"
"10002190-24-ヒフミ" = "つ、ツルギさん。次のサーブをお願いします……できれば、もうちょっと緩めに……。"
"10002190-25-チンピラA" = "ぐああぁっっ！"
"10002190-26-チンピラB" = "だ、大丈夫か！？衛生兵！衛生兵ーー！！"
"10002190-27-チンピラB" = "こ、こんなのビーチバレーじゃない……。"
"10002190-28-チンピラB" = "一方的な暴力だ！"
"10002190-29-チンピラB" = "暴力反対！どうか平和的な解決を……っ！"
"10002190-30" = "（その後、ツルギのサーブはスケバンが全員行動不能になるまで続いた。）"
