[translation]
"10002150-1" = "後日談その2;完全無欠な砂の城？"
"10002150-2-マシロ" = "ふう……しかしいくら戦闘になったとはいえ、あの大きなお城が、ここまで一瞬で崩れてしまうだなんて……。"
"10002150-3-マシロ" = "アズサさんの言う通り、「全ては虚しいもの」なのかもしれませんね……。"
"10002150-4" = "[s] \"すごいお城だったのに、残念……。\""
"10002150-5-マシロ" = "はい、同感です。しかし私としては、まだまだ足りなかったのだと思います。"
"10002150-6-マシロ" = "そもそも砂のお城の価値というものは……。"
"10002150-7-マシロ" = "防御力で決まるものですから！"
"10002150-8-マシロ" = "濡れた砂というのは簡単に手に入る素材ですが、同時に外からの力で簡単に崩れてしまう素材でもあります。"
"10002150-9-マシロ" = "もっと、強い材料を手に入れなくては……。"
"10002150-10-マシロ" = "例えば……そうですね、砂にセメントを混ぜるのはいかがでしょう？少しは強固になるのではないでしょうか？"
"10002150-11-アズサ" = "いや、それでモルタルを生み出したとしても、引張強度が心許ない。簡単に崩れてしまう可能性がある。"
"10002150-12-アズサ" = "さっきのような攻撃にも耐えられるようにするためには、他の方法も組み合わせた方が良い。"
"10002150-13-マシロ" = "なるほど、ではどのような材料を使えば……？"
"10002150-14-アズサ" = "モルタル自体は素材として悪くない。原材料の価格も安いし、簡単に手に入る。"
"10002150-15-アズサ" = "ただ、さっきも言ったように問題は抗張力。"
"10002150-16-アズサ" = "つまり……モルタルの中に、鉄筋を埋め込めば良い。"
"10002150-17-アズサ" = "そうすればきっと、さっきのとは比べ物にならないほど強固なお城になるはず。"
"10002150-18-マシロ" = "なるほど。"
"10002150-19-マシロ" = "さすがはアズサさんです、また一つ賢くなりました。"
"10002150-20-マシロ" = "今までアズサさんのことは、恐縮ながら問題児としか認識できておりませんでしたが……こんなノウハウをお持ちだったなんて、驚きました。素晴らしいです。"
"10002150-21-アズサ" = "それはこっちの台詞。これまでずっと、あくまでもあの頑迷な正義実現委員会のメンバーとして見ていたけれど……。"
"10002150-22-アズサ" = "ここまでの柔軟な対応力、こういう者もいるんだと思わされた。考えを改めよう。"
"10002150-23" = "[s] \"それはもはや、「砂のお城」じゃないんじゃ……？\""
"10002150-24-アズサ" = "いえ、材料にしっかり「砂」が入ってます！"
"10002150-25-アズサ" = "防衛目的で構築したものだから、れっきとした「お城」だよ。"
"10002150-26-一同" = "「「だから砂のお城（です）！」」"
"10002150-27" = "[s] \"息ピッタリだね……？\""
"10002150-28-アズサ" = "……さて、じゃああらためて「砂のお城」を作るために、セメントと鉄筋を探しに行こうか。"
"10002150-29-アズサ" = "それでは、私は地盤をならしておきますので！"
"10002150-30" = "（その後も、マシロとアズサはますます意気投合していき、海辺に「砂の城」という名のトーチカを築き始めた……。）"
