[translation]
"10002105-1" = "第10話;スイカ割り（２）"
"10002105-2-イズミ" = "うぅ、悔しい……。"
"10002105-3-イズミ" = "た、たとえ私が負けたとしても……。"
"10002105-4-イズミ" = "食べ物で遊ぶことは、許されない……。"
"10002105-5-イズミ" = "覚えておいて……いつか岐路に立った時、あなたたちは……。"
"10002105-6-ヒフミ" = "はぁ、はぁ……。"
"10002105-7-マシロ" = "……。"
"10002105-8-ヒフミ" = "な、なんで私たち、こんなに全力で戦っているのでしょうか……。"
"10002105-9-マシロ" = "間違いなく勝ったはずなのに、勝った感じがしませんね……。"
"10002105-10-マシロ" = "この方の食べ物に対する気持ちだけは、私たちよりもずっと強かったと思います。"
"10002105-11-ヒフミ" = "いえ、そういうお話ではなく……。"
"10002105-12" = "（その後、スイカの匂いに釣られて起きたイズミと一緒に海の家へと戻り、スイカ割りに使ったスイカもできるだけ回収して美味しく頂いた）"
