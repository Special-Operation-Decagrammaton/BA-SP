[translation]
"10043080-1" = "第8話;人生も、9回裏2アウトから"
"10043080-2-スミレ" = "診せてください。"
"10043080-3-スミレ" = "ぐうぅっ……。"
"10043080-4-監督" = "ど、どうだ？"
"10043080-5-レイ" = "大丈夫ですよね、先輩？"
"10043080-6-スミレ" = "うーん……"
"10043080-7-レイ" = "せ、先輩？"
"10043080-8-スミレ" = "骨に異常はありません。"
"10043080-9-スミレ" = "ですが、今日バットを握るのは難しいでしょう。"
"10043080-10-スミレ" = "下手をすれば、靭帯を損傷してしまいます。"
"10043080-11-レイ" = "そ、そんな……！"
"10043080-12-犯人" = "なんで4番バッターがこんなところにいるんだ！"
"10043080-13-犯人" = "……。"
"10043080-14-犯人" = "いや、俺のせいだな……"
"10043080-15-犯人" = "最初からこんな計画をしていなければ……。"
"10043080-16-犯人" = "でも……。"
"10043080-17-犯人" = "勝つ姿を……せめて、納得できる負けが見たかった！"
"10043080-18-監督" = "……納得いく試合なんてないさ。"
"10043080-19-監督" = "努力を積み重ねるしかない。"
"10043080-20-レイ" = "監督……！"
"10043080-21-スミレ" = "素晴らしいお言葉です。"
"10043080-22-アナウンサー" = "フォアボール！ブレーブス、またしても出塁！"
"10043080-23-アナウンサー" = "9回裏2アウト……満塁です！"
"10043080-24-解説者" = "こう言うのはなんですが……"
"10043080-25-解説者" = "この状況……「あれ」を期待してしまいますね。"
"10043080-26-アナウンサー" = "打席に立つのは4番バッター！"
"10043080-27-アナウンサー" = "スタジアムにご来場の皆様！ついに、この瞬間が訪れました！！"
"10043080-28" = "[ns] \"ほ、ほんとに9回裏2アウト満塁なの！？\""
"10043080-29-レイ" = "……「野球は9回裏2アウトから本番！」と冗談で言ったりもしますけど、"
"10043080-30-レイ" = "まさかこうなるとは……"
"10043080-31-レイ" = "ど、どうしましょう、監督！誰か代打はいないんですか……？"
"10043080-32-監督" = "い、今残っているバッターは？"
"10043080-33-自称野手研究家" = "……打率六分九厘の打者と、五分三厘の打者だけだ。"
"10043080-34-自称野手研究家" = "……ま、そのへんのやつに振らせた方がマシだな。"
"10043080-35-自称投手研究家" = "くっ……今回も負けるのか……！"
"10043080-36" = "[ns] \"……1つだけ方法が！\""
"10043080-37-監督" = "せ、先生……？"
"10043080-38-レイ" = "どんな方法ですか！？"
"10043080-39" = "[s] \"レイ。\""
"10043080-40-レイ" = "なんですか？"
"10043080-41" = "[s] \"バッターボックスに立とう。\""
"10043080-42-レイ" = "……え？"
"10043080-43-レイ" = "わ、私……？"
"10043080-44-レイ" = "ここで打てるのは……私しかいない、ですか？"
"10043080-45-レイ" = "……ミレニアム野球部の4番バッターの出番ですって！？"
"10043080-46-レイ" = "ちょっと待ってください！"
"10043080-47-レイ" = "いくらなんでも無茶ぶりですよ！"
"10043080-48-レイ" = "私の実力くらい、わかってるはずなのに……"
"10043080-49-レイ" = "せ、先生！？！？"
"10043080-50" = "（レイの両肩を力強く掴む）"
"10043080-51-レイ" = "せ、先生、痛……くはないですが……。"
"10043080-52-レイ" = "ちょっと……近いです……。"
"10043080-53" = "[s] レイと目を合わせる。"
"10043080-54-レイ" = "せ、せん……！"
"10043080-55" = "[s] \"いつも通りやれば、大丈夫！\""
"10043080-56-レイ" = "ど、どこからその自信が！？"
"10043080-57" = "[s1] \"レイの打率は8分。つまり8パーセント。\"\n[s2] \"今いる誰よりも、首位打者に近い！\""
"10043080-58-レイ" = "……ええ？"
"10043080-59" = "[ns3] \"自分を信じて！\"\n[ns4] \"それか……私を信じて！\""
"10043080-60" = "[ns5] \"ブレーブスが負けるのは……\"\n[ns6] \"今日に限った話じゃないんでしょ？\""
"10043080-61-レイ" = "そ、それを言われると……！"
"10043080-62-犯人" = "は、反論できない……。"
"10043080-63-監督" = "う、うっ……！"
"10043080-64-監督" = "うむ……最近の野球は、統計と理論が重視されつつあるが……。"
"10043080-65-監督" = "最後に勝負を決めるのは数字じゃない――"
"10043080-66-監督" = "――人だ！"
"10043080-67-スミレ" = "レイさん。何度負けても、多くのファンがこのチームを応援し続けています。"
"10043080-68-スミレ" = "これこそ、確率や統計では測れない現象ではないですか。"
"10043080-69-スミレ" = "トレーニング部の部長として、私も応援しています。"
"10043080-70-レイ" = "先輩……！"
"10043080-71-レイ" = "……行ってきます。"
"10043080-72-アナウンサー" = "おや！？打席に立ったのは、今回初登場の選手です！"
"10043080-73-アナウンサー" = "あの人物は一体誰なのか……！スタジアムの期待が高まります！"
"10043080-74-期待するファンA" = "代打の人、誰だろう……？"
"10043080-75-期待するファンB" = "9回裏2アウトで、まだ主力バッターが残っていたなんて……。"
"10043080-76-そわそわするファン" = "た、頼む！なんとかしてくれっ！"
"10043080-77-緊張したファン" = "ああもう……ヒヤヒヤして見てられない！"
"10043080-78-祈るファン" = "か、神様仏様なんとか様……ううぅ…！"
"10043080-79-解説者" = "3ボール2ストライク……フルカウントです。そして、9回裏満塁。"
"10043080-80-解説者" = "ここですべてが決まると言っていいでしょう。"
"10043080-81-アナウンサー" = "……ピッチャーが一塁へ牽制！幸い、ランナーの足が速かった！"
"10043080-82-解説者" = "ピッチャーも緊張しているようですね……。"
"10043080-83-レイ" = "（みんなの歓声も）"
"10043080-84-レイ" = "（あふれる熱気も）"
"10043080-85-レイ" = "（今の私には聞こえないし……感じない……）"
"10043080-86-アナウンサー" = "ピッチャー、再び牽制！今度は三塁！"
"10043080-87-レイ" = "（先生は、自分を信じろって言っていた）"
"10043080-88-レイ" = "（それか、先生の判断を信じてって）"
"10043080-89-レイ" = "（正直、やれるかは分からない……）"
"10043080-90-スミレ" = "トレーニング部の部長として、私も応援しています。"
"10043080-91-スミレ" = "（でも、先輩が、みんなが、応援してくれてる）"
"10043080-92-監督" = "……納得いく試合なんてないさ。"
"10043080-93-監督" = "（……ほんと、そうだよね）"
"10043080-94-ハナエ" = "私の応援が、誰かの勇気になるのなら――"
"10043080-95-ハナエ" = "（そして……）"
"10043080-96" = "[log]みんなを見守るのが――[/log]"
"10043080-97" = "[log]――好きだから、かな。[/log]"
"10043080-98-レイ" = "（諦めようとして）"
"10043080-99-レイ" = "（それでも、諦めきれないこと……）"
"10043080-100-レイ" = "（……）"
"10043080-101-レイ" = "（……いつも通りやればいい）"
"10043080-102-レイ" = "（……そうですよね）"
"10043080-103-アナウンサー" = "ピッチャー振りかぶって……勝負の一球！"
"10043080-104-スミレ" = "頑張ってください！"
"10043080-105-スミレ" = "結果なんて、気にしなくていいんです！"
"10043080-106-スミレ" = "レイさん……諦めずに、進み続けてください！"
"10043080-107" = "打った！！！"
"10043080-108" = "これは……！"
"10043080-109" = "飛んだ！これは大きい……！外野フェンスを越えて行きそうだぞぉ！？"
"10043080-110" = "これは会心の一発です！"
"10043080-111-アナウンサー" = "越えた！越えた！放物線がフェンスを越えました！"
"10043080-112-アナウンサー" = "コーギー・ブレーブス！！最後の最後で、逆転サヨナラ満塁ホームランです！！！"
"10043080-113-解説者" = "いやぁ、こんな奇跡ってあるんですねぇ……！"
"10043080-114-アナウンサー" = "コーギー・ブレーブス！！歴史的初勝利が、今この瞬間、歴史に刻まれました！"
"10043080-115-レイ" = "（みんながなんと言っていたのかは、あまり覚えていない）"
"10043080-116-レイ" = "（ただ、全力でバットを振った後は……）"
"10043080-117-レイ" = "（弧を描く白い影を、目で追い続けていた）"
"10043080-118-感激したファンA" = "やったあぁぁぁぁ！私たちの勝ちよーっ！"
"10043080-119-感激したファンB" = "っしゃああああぁぁっ！"
"10043080-120-涙を流すファン" = "う、うぅっ……生きているうちにこの日を迎えられるなんて……！"
"10043080-121-気絶していたファン" = "……え？サヨナラで！？ブレーブスが勝った！？マジ！？"
"10043080-122-半信半疑のファン" = "……これ、夢じゃないよね！？"
"10043080-123-犯人" = "ありがとうございます……。"
"10043080-124-犯人" = "まさか、本当に勝つなんて……。"
"10043080-125-犯人" = "この瞬間を……何度夢見たことか……。"
"10043080-126-監督" = "長かった……本当に……。"
"10043080-127-監督" = "い、いや、まだだ！これは我々の始まりにすぎん！"
"10043080-128-ハナエ" = "凄い歓声ですね……！"
"10043080-129-ハナエ" = "皆さんとっても楽しそうで、なによりです！"
