[translation]
"10043040-1" = "第4話;偶然の出会い"
"10043040-2-レイ" = "観客でいっぱいですね。"
"10043040-3-レイ" = "レイダースのファンもいるから当然か……。"
"10043040-4-レイ" = "探し出せるかな……。"
"10043040-5-？？？" = "――いけ！いけ！がんばれーっ！"
"10043040-6-レイ" = "華やかな応援団もいていいですね。"
"10043040-7-レイ" = "ブレーブスのファン層は、その……ちょっと……あれなので……。"
"10043040-8" = "[s] \"あれ？この声は……？\""
"10043040-9-レイ" = "先生？"
"10043040-10-ハナエ" = "フレー！フレー！がんばれー！"
"10043040-11-ハナエ" = "チーム名は……えっと……と・に・か・く！"
"10043040-12-ハナエ" = "空の向こうまで、飛んでけーっ！"
"10043040-13-ハナエ" = "あれ……？"
"10043040-14-ハナエ" = "先生！！！"
"10043040-15-ハナエ" = "えへへ、ここでお会いできるなんて！"
"10043040-16" = "[s] \"わっ、ハナエ！ちょっと落ち着こうか！\""
"10043040-17-ハナエ" = "……先生、この方は……？"
"10043040-18-ハナエ" = "こんにちは！トリニティ総合学園1年、救護騎士団所属[ruby=あさがお]朝顔[/ruby]ハナエです！『救護が必要な場に救護を』！"
"10043040-19" = "[s] \"今日も元気だね！\""
"10043040-20-ハナエ" = "はい！えっと、そちらの方は？"
"10043040-21-レイ" = "私は――"
"10043040-22-レイ" = "こほん。ミレニアムサイエンススクール1年、[ruby=のまさ]野正[/ruby]レイです。#n一応……トレーニング部です。"
"10043040-23-レイ" = "――そして！ミレニアム野球部の4番バッターです！"
"10043040-24-ハナエ" = "ええっ！……すごいです！"
"10043040-25-レイ" = "ハナエさん……野球はお好きですか……！？"
"10043040-26-ハナエ" = "いえ、わかりません！"
"10043040-27-レイ" = "そ、そうですか……。"
"10043040-28-ハナエ" = "そういえば、野球好きのみなさんって……頭痛持ちの方が多いのでしょうか？"
"10043040-29-ハナエ" = "なぜか試合中に苦しみ出す方が多くて……先生やレイさんも気をつけてくださいね！"
"10043040-30-ハナエ" = "古書館にあった医学書によると――"
"10043040-31" = "頭痛の原因は、脳に流れ込んだ悪い「気」のせいなのだとか！"
"10043040-32-ハナエ" = "開頭手術をして、中身をお酢で消毒しちゃえば――"
"10043040-33-ハナエ" = "どんな痛みもポン！と治るらしいです！"
"10043040-34" = "[s] \"それ、絶対にやっちゃだめだからね！？\""
"10043040-35-ハナエ" = "そうですか？別の原因となると……「黒胆汁の過度な分泌」でしょうか……。"
"10043040-36-ハナエ" = "それならタツナミソウの種を煎じて、蜂蜜と一緒に服用するのが有効です！"
"10043040-37-レイ" = "（初めて聞く治療法だけど……）"
"10043040-38-レイ" = "（さすが名門校、独自の医療が確立されているんですね……）"
"10043040-39" = "[ns] \"……ところで、ハナエは何してたの？\""
"10043040-40-ハナエ" = "応援です！チアガールなので！"
"10043040-41-ハナエ" = "先生、レイさん！ご覧ください！"
"10043040-42-ハナエ" = "頑張れ、頑張れ！ファイト！"
"10043040-43-ハナエ" = "明日のためにー……打て！打て！"
"10043040-44-レイ" = "ここまで情熱的にブレーブスを応援してくれていたとは……。"
"10043040-45-レイ" = "きっと、選手陣にも想いが伝わってますよ！"
"10043040-46-ハナエ" = "ありがとうございます！ところで、「ブレーブス」って何ですか？"
"10043040-47-レイ" = "……え、ええーっ！？"
"10043040-48-レイ" = "今試合中のチーム……ですよ？"
"10043040-49-レイ" = "長年のライバル「アビシニアン・レイダース」に勝てるよう、応援してくれていたんじゃ……？"
"10043040-50-ハナエ" = "そうなんですね！よく分かっていませんでした！"
"10043040-51-ハナエ" = "私はただ、応援してほしいと言われたので……。"
"10043040-52-ハナエ" = "ワクワクしながらスタジアムに来たんです！"
"10043040-53-レイ" = "本当にそれだけなんですか？"
"10043040-54-ハナエ" = "はい！"
"10043040-55-ハナエ" = "応援することで、誰かが勇気を出せるのなら……。"
"10043040-56-ハナエ" = "それが一番の幸せです！"
"10043040-57-ハナエ" = "団長もきっと――"
"10043040-58" = "これも一つの救護、と言ってくれるはずです！"
"10043040-59-ハナエ" = "試合が終わるまで、どちらのチームにも元気でいてほしいですね！"
"10043040-60" = "[s] \"うん。たしかにそうだね。\""
"10043040-61" = "いろいろな感情が渦巻く試合の中で……。"
"10043040-62-レイ" = "こんなにも純粋な方がいるだなんて……。"
"10043040-63-レイ" = "……もしかしたら、私。"
"10043040-64-レイ" = "なにか、大切なものを見失っていたのかもしれません……。"
"10043040-65" = "[s] \"私たちも応援された気がするね。\""
"10043040-66-レイ" = "そうだ、ハナエさん。一つ伺いたいのですが。"
"10043040-67-レイ" = "スタジアムで、怪しい人を見かけませんでしたか？"
"10043040-68-レイ" = "例えば、やけに勝敗にこだわる人とか。"
"10043040-69-ハナエ" = "うーん……ごめんなさい！分かりません！"
"10043040-70-レイ" = "そう、ですか……。"
"10043040-71-レイ" = "そういう方は、観客席のあちこちにいそうですし……。"
"10043040-72-レイ" = "はぁ……どこから犯人の手掛かりを掴めばいいのか……。"
"10043040-73-ハナエ" = "？？犯人……？"
"10043040-74-レイ" = "あ、いえ！色々ありまして……。"
"10043040-75-レイ" = "とにかく……ハナエさん、みんなに元気を送ってくれてありがとうございます。"
"10043040-76-レイ" = "……ブレーブスにはいま、そういった声が一番必要なので！"
"10043040-77-ハナエ" = "……？お役に立てたようで嬉しいです！"
"10043040-78-応援団長" = "ハナエちゃん、こっちにもお願いしていいかな？"
"10043040-79-ハナエ" = "はーい！今すぐ！"
"10043040-80-ハナエ" = "それでは、先生！レイさん！失礼します！"
"10043040-81" = "[ns] \"行ってしまった……。\""
"10043040-82-レイ" = "元気な方ですね。変な例えかもしれませんが……。"
"10043040-83-レイ" = "まるで、球場を沸かせるホームランのようです。"
"10043040-84" = "[s] \"ホームラン？\""
"10043040-85-レイ" = "……。"
"10043040-86-レイ" = "ええ。私は、ホームランこそが野球の華だと思っていまして。"
"10043040-87-レイ" = "ピッチャーを追い詰め、ミスを誘える安打のほうが、良いという人もいます。"
"10043040-88-レイ" = "でも……。"
"10043040-89-レイ" = "ホームランは試合の状況に関わらず、100％得点になるんです。"
"10043040-90-レイ" = "中には、最高のチームプレイという見方もあるんですよ。"
"10043040-91-レイ" = "統計や数字で野球を語ること自体は嫌いではありません。でも――"
"10043040-92-レイ" = "私にとって、ホームランは特別で……。"
"10043040-93-レイ" = "なんと言えばいいんでしょうね。うまく説明できないんですけど……ホームランが与える力、といいますか。"
"10043040-94-レイ" = "勝っているチームにとっては勝利の追い風になりますし――負けているチームにとっては、これから巻き返せるというきっかけにもなり得る。"
"10043040-95-レイ" = "そんな美しい球が描くアーチが――"
"10043040-96-レイ" = "どこまでも飛んで行く、ボールの白い影が――"
"10043040-97-レイ" = "――そして、悠々とホームベースを踏むバッターの姿が。"
"10043040-98-レイ" = "みんなに希望を与えてくれるんです。"
"10043040-99-レイ" = "だからこそ、手に入れるのが難しいものだと思っていたんですが……。"
"10043040-100-レイ" = "ハナエさんのような人はきっと、いてくれるだけで周囲が明るくなりますね。"
"10043040-101-レイ" = "……私にも、ああいう純粋さがあればなぁ。"
"10043040-102" = "[s] \"レイも、純粋に野球が好きなように見えるよ？\""
"10043040-103-レイ" = "……うーん。"
"10043040-104-レイ" = "どうしても、試合なので……。"
"10043040-105-レイ" = "勝敗を考えてしまうんです。"
"10043040-106-レイ" = "ご存知の通り、私たちミレニアム野球部は強豪ではありません。"
"10043040-107-レイ" = "エンジニア部のピッチングマシンにすら勝てませんから。"
"10043040-108-レイ" = "それでも、私は野球が好きなんです。"
"10043040-109-レイ" = "だからこそ、試合結果はどんなものであれ受け入れるべきなんですが……。"
"10043040-110-レイ" = "でも……へへっ、やっぱり勝ちたくなっちゃいます。"
"10043040-111-レイ" = "納得がいく試合をして――"
"10043040-112-レイ" = "――勝利を、スタジアムに刻みたい。"
"10043040-113-レイ" = "きっと、ここのみんなも、ブレーブスに対してそう思っているはずです。"
"10043040-114-レイ" = "……熱い人が多いですから。"
"10043040-115-レイ" = "こういうとき、誰かがホームランを打ってくれたらなぁ。"
"10043040-116-レイ" = "それで、試合に勝てれば……なんて。"
"10043040-117-優しいファン" = "いいこと言うねえ。"
"10043040-118-優しいファン" = "ブレーブスの試合は、暖かく見守るのがマナーだよね。"
"10043040-119-レイ" = "ど、どちら様ですか！？"
"10043040-120-レイ" = "あっ、「ブレーブス如来様」！"
"10043040-121-レイ" = "えっ、20年間、笑顔でブレーブス戦を見守っているという……あの！？"
"10043040-122-優しいファン" = "ほっほっほっ。私はただの野球好きにすぎませんよ。"
"10043040-123-レイ" = "そんな方が……。"
"10043040-124-レイ" = "やっぱり野球はいいですね！"
"10043040-125-レイ" = "初対面の人でも、すぐに打ち解けられますし。"
"10043040-126-レイ" = "同じ光景を見て、気持ちが一つになる！"
"10043040-127-レイ" = "これが野球……いえ、スポーツの素晴らしさですよ！"
"10043040-128-アナウンサー" = "3ボール1ストライクから……打った！セカンドフライ！"
"10043040-129-解説者" = "あーっと……！"
"10043040-130-アナウンサー" = "ここで痛恨のエラー！"
"10043040-131-アナウンサー" = "その間にランナーは悠々とホームイン……！"
"10043040-132-解説者" = "初歩的なミスですねぇ……これで失点するのはたまったもんじゃありません。"
"10043040-133-元優しいファン" = "……。"
"10043040-134-元優しいファン" = "この役立たずどもが！てめぇらは選手失格だ！"
"10043040-135-元優しいファン" = "捕球ミスとかありえねえだろ！！"
"10043040-136-元優しいファン" = "もうこんな試合やめちまえ！！！"
"10043040-137" = "[s] \"あ、暖かく見守るんじゃ！？\""
"10043040-138-レイ" = "……。"
"10043040-139-レイ" = "先生……これは……"
"10043040-140-レイ" = "「仏の顔も三度まで」ですね……。"
