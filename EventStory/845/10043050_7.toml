[translation]
"10043050-1" = "第5話;大切なのは折れない心"
"10043050-2-スミレ" = "……そうでしたか。#nレイさんもお疲れでしょう。"
"10043050-3" = "[s] \"観客席を見てまわるだけでも一苦労だもんね。\""
"10043050-4-スミレ" = "体力的にも精神的にも……"
"10043050-5-スミレ" = "労力のかかる作業だと思います。"
"10043050-6" = "[s] \"スミレも大丈夫？\""
"10043050-7-スミレ" = "私は平気です。体力には自信がありますから。"
"10043050-8-スミレ" = "……そういえば、さきほど数名の不審人物を見つけたんです。"
"10043050-9-スミレ" = "この格好ならば怪しまれません。"
"10043050-10-スミレ" = "行きましょう！"
"10043050-11-スミレ" = "まず、あちらの方です。"
"10043050-12-記録中の観客" = "3球目は……ストレートを空振り。"
"10043050-13-記録中の観客" = "4球目……フォークボールはストライクならず。"
"10043050-14-記録中の観客" = "5球目はヒット。#n……だけど、これはショートフライか。この試合のチーム打率は……。"
"10043050-15-記録中の観客" = "防御率の方も……。"
"10043050-16-スミレ" = "トレーナー。あの方はさっきからずっと試合を記録しています。"
"10043050-17" = "[s] \"たしかに、普通の観客には見えないかも……。\""
"10043050-18-スミレ" = "はい。野球に詳しくない私から見ても……。"
"10043050-19-スミレ" = "執拗に試合を記録している姿は、不自然です。"
"10043050-20-スミレ" = "では、様子をうかがってきますね。"
"10043050-21-スミレ" = "「ドリンクの売り子さん」として。"
"10043050-22-記録中の観客" = "[ruby=打撃指標数]OPS[/ruby]を計算すれば……。"
"10043050-23-スミレ" = "こんにちは！ドリンクはいかがですか？"
"10043050-24-記録中の観客" = "うわっ！？……びっくりした。"
"10043050-25-記録中の観客" = "……1杯頼むよ。"
"10043050-26-スミレ" = "はい、どうぞ。"
"10043050-27-記録中の観客" = "ええと……次のバッターは……。"
"10043050-28-スミレ" = "何を記録しているんですか？"
"10043050-29-記録中の観客" = "あぁ……バッターの打率やピッチャーの球種をちょっとな……。"
"10043050-30-記録中の観客" = "なんだよ、記録してたら悪いのか？"
"10043050-31-記録中の観客" = "……。"
"10043050-32-記録中の観客" = "お前には関係ないだろ！"
"10043050-33-スミレ" = "（見ましたか、トレーナー？）"
"10043050-34" = "[s1] （……話を聞いたほうがいいかも）\n[s2] （荒っぽいことはだめだよ？）"
"10043050-35-スミレ" = "（はい、トレーナー！）"
"10043050-36-記録していた観客" = "くっ……！試合情報をブックメーカーにアップして、がっぽり稼ぐ計画が……！"
"10043050-37-スミレ" = "違法な賭博サイトに情報を上げるなんて……。"
"10043050-38-記録していた観客" = "応援してやってんだ、こんくらいいいだろ！"
"10043050-39-スミレ" = "いいえ。"
"10043050-40-スミレ" = "ファンは選手に力を与える大切な存在ではありますが……。"
"10043050-41-スミレ" = "……ルールは守るべきです！"
"10043050-42-スミレ" = "利用客のマナーが悪いジムは、活気を失ってしまいますからね！"
"10043050-43-記録していた観客" = "ちっ……！"
"10043050-44-スミレ" = "別の計画は阻止したようですが……。"
"10043050-45-スミレ" = "例の犯人ではありませんでしたね。"
"10043050-46" = "[s] \"でも、スミレの言っていたことは正しいよ。\""
"10043050-47-スミレ" = "ありがとうございます。トレーナー。"
"10043050-48-スミレ" = "さあ、捜索に戻りましょう！"
"10043050-49-スミレ" = "次はあちらに！"
"10043050-50-太鼓の応援団B" = "いけ！いけ！頑張れ！"
"10043050-51-太鼓の応援団B" = "勝利の太鼓で力を送るぞー！"
"10043050-52" = "[ns] \"ただの応援団じゃない！？\""
"10043050-53-スミレ" = "いいえ、トレーナー。"
"10043050-54-スミレ" = "太鼓で応援していると見せかけて……。"
"10043050-55-スミレ" = "モールス信号を送っています！"
"10043050-56" = "（スミレの考えすぎかと思いきや……）"
"10043050-57-太鼓の応援団一同" = "な、なぜ……ブレーブスのファンに紛れ、サインを流出させる計画がバレたんだ……！"
"10043050-58-スミレ" = "モールス信号は一通り勉強しました！暗号を使用する部活に、トレーニングを推奨することもありますから。"
"10043050-59" = "[s3] \"トレーニングのために……\"\n[s4] \"そこまで……！\""
"10043050-60-スミレ" = "これだけは言わせてください。"
"10043050-61-スミレ" = "公正なルールがあるからこそ、勝利は価値あるものとなります。"
"10043050-62-スミレ" = "ルールを破る人がいたら、どんな勝利だって意味はありません。"
"10043050-63-スミレ" = "公正な戦いのためにも「スポーツマンシップ」を守らなくては……。"
"10043050-64-太鼓の応援団B" = "……で、でも、私だって怖いんだ。"
"10043050-65-太鼓の応援団B" = "万が一、レイダースが負けたらって……。"
"10043050-66-太鼓の応援団B" = "想像してみろよ。連勝続きの中で、初めて負けたらどうなるか……。"
"10043050-67-太鼓の応援団B" = "でも……ボールと同じで、どこに転がっていくか分からないのが勝負か……。"
"10043050-68" = "[s5] \"ボールがどこへ転がっても受け入れるのが、\"\n[s6] \"「スポーツ」です。\""
"10043050-69" = "[ns7] \"勝利を焦って、\"\n[ns8] \"不安をなくしたいのはわかりますが……\""
"10043050-70-太鼓の応援団一同" = "……。"
"10043050-71-太鼓の応援団一同" = "……そうだな。悪かった……。"
"10043050-72-スミレ" = "そこまで熱くなるのも、野球愛ゆえです。"
"10043050-73-スミレ" = "その情熱を、どこかに向けたいとお考えでしたら……"
"10043050-74-スミレ" = "ミレニアムのジムでトレーニングに励むのはいかがですか？"
"10043050-75" = "[s] \"スミレ……意外と営業向きかもね……。\""
"10043050-76-スミレ" = "営業、ですか……？"
"10043050-77-スミレ" = "またしても、犯人ではありませんでした……。"
"10043050-78-スミレ" = "なかなか簡単にはいきませんね。"
"10043050-79" = "[s] \"決めてかかるのも危ないからね……。\""
"10043050-80-スミレ" = "はい……反省しています。"
"10043050-81-スミレ" = "モールス信号はスタジアムの歓声に紛れ、伝わることはなかったようです。"
"10043050-82-スミレ" = "……皆さんの熱気には、感心するしかありません。"
"10043050-83" = "[s] \"ま、まあね……\""
"10043050-84-スミレ" = "はい。皮肉ではなく、素直に感心しましたが……。"
"10043050-85-スミレ" = "……すみません。私は建前や冗談が得意ではなく。"
"10043050-86-スミレ" = "周りからも、真面目すぎると言われることがあります。"
"10043050-87-スミレ" = "もう少しユーモアのある性格だったなら……。"
"10043050-88-スミレ" = "ときどき、そう思うことがありますね。"
"10043050-89" = "[ns9] \"でも、そこが……\"\n[ns10] \"スミレの良いところじゃない？\""
"10043050-90-スミレ" = "ありがとうございます。"
"10043050-91-スミレ" = "ふふっ……トレーナーは、どんなことにも美点を見つけてくれそうですね。"
"10043050-92-スミレ" = "あっ……その、私なりの冗談……です。"
"10043050-93-スミレ" = "気にしてないよ、ですか？そ、それでしたら……"
"10043050-94-スミレ" = "……。"
"10043050-95-スミレ" = "なぜ私が会場の熱気に感心したかというと……"
"10043050-96-スミレ" = "諦めずに挑戦を続けるチームと、応援をやめないファンの皆さんに、心を動かされたのです。"
"10043050-97-スミレ" = "トレーナー。"
"10043050-98-スミレ" = "いえ……[ruby=・]先[/ruby][ruby=・]生[/ruby]。"
"10043050-99" = "[s] \"……！？\""
"10043050-100" = "[ns] （スミレの話に耳を傾ける）"
"10043050-101-スミレ" = "私は……"
"10043050-102-スミレ" = "挑戦を続ける人が好きなんです。"
"10043050-103-スミレ" = "私自身、トレーニングを応援する側でもありますしね。"
"10043050-104-スミレ" = "ですが、「挑戦」は何よりも難しい。その理由はわかりますか……？"
"10043050-105" = "[s] \"意志を試される……から？\""
"10043050-106-スミレ" = "そうなんです。"
"10043050-107-スミレ" = "人の心には、裏表があります。"
"10043050-108-スミレ" = "「なりたい自分」と「やりたいこと」は違うものですよね。"
"10043050-109-スミレ" = "例えば――"
"10043050-110-スミレ" = "ある方が、ダイエットに挑戦するとします。"
"10043050-111-スミレ" = "「なりたい自分」を目指して、食事管理や運動に挑む――"
"10043050-112-スミレ" = "ですが、そんな中でも「やりたいこと」が頭をよぎります。"
"10043050-113-スミレ" = "きっと、チーズやベーコンのたっぷり入ったクリームパスタを想像するだけで――"
"10043050-114-スミレ" = "食事管理をやめたくなってしまうでしょう。"
"10043050-115" = "[ns] \"なんだか私もお腹が空いてきたよ。\""
"10043050-116-スミレ" = "ふふっ、そうですか。"
"10043050-117-スミレ" = "――その人が誘惑に負け、ついスイーツカフェに入ったとしましょう。"
"10043050-118-スミレ" = "ひさびさに食べるチョコアイスは、その甘さが口の中に広がり、とても美味しいはず。"
"10043050-119-スミレ" = "きっと、幸せですよね。"
"10043050-120-スミレ" = "……ですが、「なりたい自分」からは遠ざかっていく。"
"10043050-121-スミレ" = "そうして、些細なことで固めた決意は崩れてしまうんです。"
"10043050-122-スミレ" = "私は単純な性格ではありますが――"
"10043050-123-スミレ" = "私とトレーニング部が、物好きと思われていることくらいは知っています。"
"10043050-124-スミレ" = "それでも……誰かの決意を後押しして、「なりたい自分」にしてあげたいと思っているのです。"
"10043050-125-スミレ" = "トレーニングを終え、疲れ果てた方々の中にも――"
"10043050-126-スミレ" = "トレーニングを投げ出さず。"
"10043050-127-スミレ" = "翌日、再びジムへと訪れる方が現れます。"
"10043050-128-スミレ" = "そういう人の理想に向かうお手伝いができるのなら……"
"10043050-129-スミレ" = "それは――とても素晴らしいことだと思っています。"
"10043050-130-スミレ" = "誰かに決意させることは、私にはできません。"
"10043050-131-スミレ" = "だから、私は目標に向かって頑張る人が好きなんです。"
"10043050-132-スミレ" = "そして、それを導く人のことも。"
"10043050-133-スミレ" = "そういう意味で……先生のことを、好ましく思っています。"
"10043050-134" = "[s] \"す、スミレ！？\""
"10043050-135-スミレ" = "ふふっ、どうしてそんなに驚くんですか？"
"10043050-136-スミレ" = "トレーナー？"
"10043050-137" = "（突然の言葉に、固まってしまった……）"
"10043050-138" = "（スミレの視線が向けられたその時……）"
"10043050-139-喉が渇いた観客" = "お？売り子さん、やっと見つけた！"
"10043050-140-喉が渇いた観客" = "飲み物ありませんか？#n今、他に誰もいなくて……。"
"10043050-141-スミレ" = "誰もいない……？"
"10043050-142" = "[s] \"どういうこと？\""
"10043050-143-スミレ" = "ひとまず……こちら、ドリンクです。"
"10043050-144-喉が渇いた観客" = "ありがとう！助かったぁー！"
"10043050-145-スミレ" = "……おかげで生き返りました！"
"10043050-146-スミレ" = "いつから他の売り子さんがいなくなりました？"
"10043050-147-スミレ" = "……1回？いや、2回表？場内が盛り上がったときだったかな……"
"10043050-148-スミレ" = "一番ドリンクの需要が高まる時に姿を消した、と……。"
"10043050-149-スミレ" = "トレーナー、これは……"
"10043050-150-スミレ" = "ええ。私も怪しいと思います。その売り子さんたちの行き先に、きっと……。"
"10043050-151-ハナエ" = "ふぁあ……ずっと応援歌を歌ってたら、喉が渇いて……。"
"10043050-152" = "[ns] \"ハナエ、また会ったね。\""
"10043050-153-ハナエ" = "あれ？"
"10043050-154-ハナエ" = "先生！"
"10043050-155-ハナエ" = "なるほど！スミレさんはみなさんにドリンクを配っているのですね！"
"10043050-156-スミレ" = "そうなんです。一杯どうぞ。"
"10043050-157-ハナエ" = "ありがとうございます！ごくっごくっ……ぷはぁ！"
"10043050-158-ハナエ" = "これでまた、元気よく応援できそうです！"
"10043050-159-ハナエ" = "スミレさん……まるで救護騎士団みたいですね！"
"10043050-160-スミレ" = "ふふっ。どちらかと言えば、健康騎士団でしょうか。"
"10043050-161-ハナエ" = "それも素敵ですね！"
"10043050-162-ハナエ" = "そういえば――"
"10043050-163-ハナエ" = "他の売り子さんはあちらに向かってましたけど……スミレさんは行かなくていいんですか？"
"10043050-164-スミレ" = "！！！"
"10043050-165" = "[s] \"あっちというと……\""
"10043050-166-ハナエ" = "あの目立つ席です！"
"10043050-167-スミレ" = "あそこは……"
"10043050-168" = "[s] \"バックネット裏の席……？\""
"10043050-169-ハナエ" = "ええ！"
"10043050-170-ハナエ" = "応援歌をあそこから歌ったら、とっても響きそうです！"
"10043050-171-スミレ" = "（スタジアム全体を見渡せる席に、他の売り子が……）"
"10043050-172-スミレ" = "（つまり……？）"
"10043050-173-レイ" = "先生！スミレ先輩！今さっき犯人から連絡が！"
"10043050-174-レイ" = "また、一方的に訳の分からないことを言っていたんですが……。"
"10043050-175-レイ" = "その中に手がかりがあったかもしれません！"
"10043050-176" = "[s] \"本当に！？\""
"10043050-177-スミレ" = "お手柄ですレイさん。#nそれで、手がかりとは……？"
"10043050-178-レイ" = "電波です！スタジアムを周りながら通話をしていたら……。"
"10043050-179-レイ" = "場所によって、ノイズが変化していたんです！"
"10043050-180-レイ" = "一番ノイズが少ない場所に、きっと……！"
"10043050-181-スミレ" = "電波状況を分析し、位置を特定するのですね。"
"10043050-182" = "[s] \"じゃあ、次は……！\""
"10043050-183-スミレ" = "ええ、トレーナー。"
"10043050-184-スミレ" = "次の電話が勝負ですね！"
"10043050-185-レイ" = "今度こそ、犯人の居場所を突き止めてみせます！"
