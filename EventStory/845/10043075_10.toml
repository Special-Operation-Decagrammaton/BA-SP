[translation]
"10043075-1-レイ" = "やった！"
"10043075-2-犯人" = "ば、馬鹿な……！"
"10043075-3-スミレ" = "それでは、聞かせてください。"
"10043075-4-スミレ" = "なぜこのようなことを？"
"10043075-5-スミレ" = "……本当にわからないのか？"
"10043075-6-犯人" = "……。"
"10043075-7-犯人" = "お前らの！"
"10043075-8-犯人" = "野球が！！"
"10043075-9-犯人" = "下手すぎるからだよ！！！"
"10043075-10-監督" = "ほ、本当にそんな理由で……！？"
"10043075-11-犯人" = "他にあるわけないだろ！"
"10043075-12-犯人" = "ブレーブスは、野球が下手だ……。"
"10043075-13-犯人" = "キヴォトス最低と言っていい……！"
"10043075-14-犯人" = "どうして、いつもいつも負けちまうんだよ！"
"10043075-15-レイ" = "た、たしかに、負けるのは悔しいですが……。"
"10043075-16" = "[s] \"やっぱりファンだったのか……。\""
"10043075-17-スミレ" = "そうだ、試合のほうはどうなっていますか？"
"10043075-18-スミレ" = "こうしている間にも、ゲームは続いているはずです。"
"10043075-19-犯人" = "そ、そうだった！"
"10043075-20-監督" = "……9回、最後のピッチャーがマウンドに立った。もう私にできることはない……。"
"10043075-21-監督" = "選手を、皆を信じるしか……。"
"10043075-22-アナウンサー" = "三者三振！スリーアウト、チェンジです！#nさあ、ブレーブス最後の攻撃が始まります！"
"10043075-23-アナウンサー" = "試合はいよいよ9回裏、泣いても笑ってもこれが最後！"
"10043075-24-犯人" = "おお……！追加の失点はなかったな！"
"10043075-25-犯人" = "これで、8番・9番・1番バッターに続き、3番バッターまで耐えられたら……。"
"10043075-26-レイ" = "4番バッターの出番ですね！そこでサヨナラホームランを決める……！"
"10043075-27-スミレ" = "トレーナー、私は野球に詳しくないのですが、ここでレイさんの言う「サヨナラホームラン」を打てる確率は――"
"10043075-28" = "[s] \"スミレ、野球は運も大事な要素なんだよ\""
"10043075-29-スミレ" = "そ、そうですか。"
"10043075-30-4番バッター" = "うぅっ……！"
"10043075-31-レイ" = "ど、どうしました！？"
"10043075-32-4番バッター" = "イテテ……さっき、手首に奴らの流れ弾が当たって……！"
"10043075-33-レイ" = "な、なんとぉーーっ！？"
