[translation]
"10043060-1" = "第6話;グラウンド炎上"
"10043060-2-レイ" = "ノイズを辿ると決めた以上、今やれることはないんですが……。"
"10043060-3" = "[s] \"ちょっと休もうか？\""
"10043060-4-レイ" = "ええ……。"
"10043060-5-レイ" = "こうして待っているだけというのも疲れますね……。"
"10043060-6-レイ" = "野球って……。"
"10043060-7-レイ" = "……不思議なスポーツですよね。"
"10043060-8" = "[s] \"どんな風に？\""
"10043060-9-レイ" = "一番は、ボールを持つ側が守備になるところですね。"
"10043060-10-レイ" = "サッカー、バスケ、バレーなどは、ボールを持ったら攻撃側になるものです。"
"10043060-11-レイ" = "野球は……守備側のピッチャーが、攻撃側のバッターにボールを投げ――"
"10043060-12-レイ" = "バッターがどのようにボールを打つかで、試合の流れが決まるのですから。"
"10043060-13-レイ" = "ヒットを打っても運悪く野手に取られればアウトですし、守備側がゴロに翻弄され、二塁打になることも……。"
"10043060-14-レイ" = "だから、運も実力も必要なんですよね……。"
"10043060-15-レイ" = "応援するチームには努力が報われてほしいといつも思っているんです。#nでも――"
"10043060-16-レイ" = "エラーが出たら、ときには応援している側が感情的になってしまうこともある。"
"10043060-17-レイ" = "……そういうところも、不思議だなって思います。"
"10043060-18-レイ" = "好きなのに、どうして感情的になってしまうのでしょうか。"
"10043060-19" = "[s1] \"普段の努力が報われるように……\"\n[s2] \"願っているからじゃない？\""
"10043060-20-レイ" = "たしかに……そうかもしれません。"
"10043060-21-レイ" = "そう思うと、先生は変わった方ですよね。"
"10043060-22" = "[s] \"私？\""
"10043060-23-レイ" = "今回の件……正直、ここまで手伝ってくださる理由は先生にないと思っています。"
"10043060-24-レイ" = "野球ファンと、一部のガム愛好家以外には、全く関係ない話なのに――"
"10043060-25-レイ" = "先生はこうして親身になってくれています。"
"10043060-26-レイ" = "どうして、ここまでしてくれるんでしょう？"
"10043060-27-レイ" = "それがよくわからなくて……。"
"10043060-28-レイ" = "あ、「私が好きだからこうしているだけだよ」みたいなのはナシですからね！"
"10043060-29" = "[ns] \"そうだね……。\""
"10043060-30" = "[ns] \"みんなを見守るのが好きだから、かな。\""
"10043060-31-レイ" = "ええっ？わ、私たちを？"
"10043060-32" = "[s3] \"うん。みんなは可能性の塊だから。\"\n[s4] \"それが開花していくのを……見守りたいんだと思う。\""
"10043060-33" = "[ns5] \"「目標」へ一歩近づくための手伝いを。\"\n[ns6] \"私ができるのなら……。\""
"10043060-34" = "[ns7] \"それだけで嬉しい……かな。\"\n[ns8] \"心からそう思ってるよ。\""
"10043060-35-レイ" = "……スミレ先輩。"
"10043060-36" = "[s] \"えっ？\""
"10043060-37-レイ" = "あっ、いや、先輩みたいだなって思いました。"
"10043060-38-レイ" = "……へへっ。"
"10043060-39-レイ" = "ありがとう、ございます……。"
"10043060-40-レイ" = "……初めてです……こんな話をするの……。"
"10043060-41-謎の声" = "7回表の守備が終わったな。おい、攻守交代だぞ。"
"10043060-42-レイ" = "……！え、ええ！"
"10043060-43-謎の声" = "7回裏で、こちらが攻撃。得点は18対21。"
"10043060-44-謎の声" = "……乱打戦の泥仕合じゃねぇか。"
"10043060-45-謎の声" = "お互い、交代できるピッチャーは残り一人。監督、お前ならどんな作戦にするんだ？"
"10043060-46-監督" = "あ、ああ！交代ピッチャーの体力を先に消耗させたほうがいい……。"
"10043060-47-監督" = "ファウル連発で粘ってみるのはどうだ？"
"10043060-48-レイ" = "ファウルを！？"
"10043060-49-監督" = "そう。なるべくファウルボールを打って、相手のピッチャーを疲れさせるんだ。"
"10043060-50-監督" = "体力を消耗させれば、球威を下げることも――"
"10043060-51-謎の声" = "……無駄な足掻きだ！"
"10043060-52-監督" = "ええっ！？"
"10043060-53-レイ" = "どうしてですか！残り3回、相手側のピッチャーの球威が下がれば――"
"10043060-54-レイ" = "9回裏でチャンスを掴むことだって……。"
"10043060-55-謎の声" = "そんな器用なバッターじゃないだろ！"
"10043060-56-謎の声" = "ファウルを狙ってみろ、下手すりゃ三振だ！"
"10043060-57-謎の声" = "ブレーブスに普通の戦術は無理だって、少しは自覚しろよ！"
"10043060-58-監督" = "う、うぅ……！"
"10043060-59-レイ" = "い、いくらなんでも言い過ぎです！"
"10043060-60-レイ" = "こうなりゃもうイチかバチかだ！"
"10043060-61-謎の声" = "全力でスイングして、少しでもヒットさせるしかない！"
"10043060-62-レイ" = "じゃ、じゃあ！ファウル2回ぶん……#nバントで粘ってからフルスイングに切り替えるのはどうでしょう！？"
"10043060-63-レイ" = "スリーバントのファウルはいずれにせよアウトなので……"
"10043060-64-レイ" = "これなら1人あたり最低3球は投げることになり、#n多少なりとも相手ピッチャーを消耗させられます……！"
"10043060-65-レイ" = "……。"
"10043060-66-謎の声" = "珍しく良い案を出すじゃないか。"
"10043060-67-レイ" = "珍しくって……。"
"10043060-68-謎の声" = "いいだろう。バントでツーファウルまで粘ってから、ヒットを狙え！"
"10043060-69-謎の声" = "相手のピッチャーを消耗させつつ、得点も狙う……"
"10043060-70-謎の声" = "それでいい！7回以降の終盤には、どんでん返しが良く起きると言うからな！"
"10043060-71-レイ" = "ええ！"
"10043060-72-アナウンサー" = "7回裏、ブレーブス、ラッキーセブンの攻撃です。スコアは18対21。まだチャンスはあります。"
"10043060-73-解説者" = "意外かもしれませんが、ブレーブスは昔から追い上げが激しいチームです。"
"10043060-74-解説者" = "……いつも、そこからあと一歩及ばないのですが。"
"10043060-75-アナウンサー" = "さあ、今回はどのような試合を見せてくれるのか！ブレーブスのバッターが打席に立ちます！"
"10043060-76-選手" = "この構えは……バントを狙っているのでしょうか？"
"10043060-77-解説者" = "ピッチャーの投球数を増やす作戦ですかね。"
"10043060-78-アナウンサー" = "さあ、レイダースのピッチャーが投げました！"
"10043060-79-監督" = "頼む……！ファウルラインを越えてくれ……！"
"10043060-80-レイ" = "うっ……緊張してきた……！"
"10043060-81-アナウンサー" = "おおっと！ボールは打ちあがってピッチャー正面……！#n捕球してワンアウト！初球はピッチャーフライでした！"
"10043060-82-解説者" = "……言葉が出ませんね。"
"10043060-83-解説者" = "無理矢理にでも安打を狙ったほうがよかったような……。"
"10043060-84-監督" = "……。"
"10043060-85-レイ" = "……。"
"10043060-86-レイ" = "なんて……ことでしょう……。"
"10043060-87-謎の声" = "もうお前らの作戦には従わん！言った通りにしろーっ！"
"10043060-88-レイ" = "せ、先生？このままではまずいです！"
"10043060-89" = "[s] \"な、何が？\""
"10043060-90-レイ" = "この様子だと次も、その次も同じく初球アウトになってしまいます……#nつまり、あと2球でチェンジしちゃう可能性が……！"
"10043060-91-レイ" = "犯人との通話が切れて、ノイズで場所を特定できなくなってしまうかも……！"
"10043060-92" = "[s] \"それは……まずいね……！\""
"10043060-93" = "[ns] \"待ってください！たしかにバントは失敗しましたが……！\""
"10043060-94-謎の声" = "はぁ？もっと安全な作戦にしようだと？"
"10043060-95-謎の声" = "バッターに何度もタイムをさせて、ピッチャーの呼吸を乱す……か。"
"10043060-96-謎の声" = "悪くないかもな。"
"10043060-97-謎の声" = "……。"
"10043060-98-謎の声" = "いいだろう。それならアウトにはならない。"
"10043060-99-謎の声" = "よし、決まりだ！"
"10043060-100-レイ" = "やりましたね！これで犯人との通話時間も稼げそうです！"
"10043060-101-選手" = "ブレーブス、ここに来て、タイム回数が増えすぎなような気も……。"
"10043060-102-アナウンサー" = "ああーやはり！ただいま、審判よりバッターに退場処分が下されました！"
"10043060-103-解説者" = "タイムも限度を超えると、試合の妨害行為と判断される場合もありますからね。"
"10043060-104-監督" = "くっ……！"
"10043060-105-謎の声" = "もうお前らの言うことなど聞かん……！"
"10043060-106-謎の声" = "これ以上無駄口を叩くなら、予告通り――"
"10043060-107-レイ" = "……先生！犯人の居場所が特定できたみたいです……！"
"10043060-108-スミレ" = "トレーナー、レイさん。犯人の居場所ですが……"
"10043060-109" = "[s] \"どこ！？\""
"10043060-110-レイ" = "バックネット裏の席です……！"
"10043060-111" = "[s] \"やっぱり……！\""
"10043060-112-スミレ" = "ええ。"
"10043060-113-スミレ" = "ハナエさんの言っていたあそこですね。"
"10043060-114-スミレ" = "スタジアム全体が見渡せる、個室観覧席があるそうです。"
"10043060-115-レイ" = "たしかに、あそこなら邪魔は入りませんね。"
"10043060-116-レイ" = "……監督とブレーブスの選手たちにも知らせておきます！"
"10043060-117" = "（一方、ブレーブスのバッターは……）"
"10043060-118" = "（案の定、二者連続で初球アウトに倒れ、攻守交代となった……）"
