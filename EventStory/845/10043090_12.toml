[translation]
"10043090-1" = "第9話;仕上げのトレーニング"
"10043090-2" = "（歴史的大勝利から一夜明け……）"
"10043090-3" = "（翌日……）"
"10043090-4" = "ミレニアム陸上トラック"
"10043090-5-レイ" = "あ、先生！"
"10043090-6" = "[s] \"レイ、この大量の野球用品は……？\""
"10043090-7-レイ" = "コーギー・ブレーブスから謝礼としていただいたんです！"
"10043090-8-レイ" = "選手として契約したいというお話もありましたが……。"
"10043090-9-レイ" = "それは、流石にお断りしました！"
"10043090-10" = "[s] \"専属となると、負担も大きいもんね。\""
"10043090-11-レイ" = "そもそも、私はミレニアム野球部の4番バッター、[ruby=のまさ]野正[/ruby]レイですから！"
"10043090-12-レイ" = "ミレニアム野球部の復興を担う者として、他のチームには行けません！"
"10043090-13" = "[s] \"そうだ！がんばらないとね！\""
"10043090-14-レイ" = "これは、野球部でありがたく使わせていただきます。"
"10043090-15-レイ" = "……部費もかつかつでしたしね。"
"10043090-16-レイ" = "それにしても、まだ信じられません！#nまさか私が――"
"10043090-17-レイ" = "――ホームランを打ったなんて！"
"10043090-18-レイ" = "いままで、練習中ですら打てなかったのに！"
"10043090-19" = "[s] \"そうだったんだ……。\""
"10043090-20-レイ" = "どうしてそんな目で見るんですか？"
"10043090-21-レイ" = "私は昨日、ホームランを打って生まれ変わったんですから！"
"10043090-22-レイ" = "見ていてください、先生！"
"10043090-23-レイ" = "今日から、ミレニアム最強打者の活躍が始まりますよ！"
"10043090-24-レイ" = "さあ掛かってこい、ピッチングマシン！"
"10043090-25-レイ" = "どんな変化球だろうと――"
"10043090-26-レイ" = "全部打ち返してやるーっ！"
"10043090-27" = "（レイは意気揚々と練習場へ向かっていき……）"
"10043090-28" = "（……ピッチングマシンに大敗していた）"
"10043090-29-レイ" = "な、なぜぇ！？"
"10043090-30-レイ" = "いや、負けるのはまだいいけど！！"
"10043090-31-レイ" = "打率が8分から7分9厘に下がってます！"
"10043090-32" = "[s] \"えっと……肩に力が入りすぎ、とか？\""
"10043090-33-レイ" = "て、定番のアドバイスではありますが……がくっ……！"
"10043090-34-スミレ" = "お二人とも、ここにいたんですね。"
"10043090-35-スミレ" = "先輩……？"
"10043090-36" = "[ns1] \"おはよう、スミレ。\"\n[ns2] \"その服が気に入ったんだね。\""
"10043090-37-スミレ" = "ええ。"
"10043090-38-スミレ" = "やはり昨日の試合の影響でしょうか。"
"10043090-39-スミレ" = "私も……あのホームランに感動しました。"
"10043090-40-スミレ" = "あの瞬間を忘れたくないと思い、気付けば――"
"10043090-41-スミレ" = "この服に着替えていました。"
"10043090-42-スミレ" = "トレーニングウェアと比べ、動きづらい部分もありますが……。"
"10043090-43-スミレ" = "パフォーマンスを向上させるのは、数字だけではありませんから。"
"10043090-44" = "[s] \"それもそうだね！\""
"10043090-45-スミレ" = "それに――"
"10043090-46-スミレ" = "昨日は大切なことを学びました。"
"10043090-47-スミレ" = "「過ぎたるは猶及ばざるが如し」です。"
"10043090-48" = "[ns] \"たしかに、何事もやりすぎはよくないね。\""
"10043090-49-スミレ" = "……はい。"
"10043090-50-スミレ" = "昨日の騒ぎは、野球への度を過ぎた愛情が原因です。"
"10043090-51-スミレ" = "まるで、トレーニングのオーバーワークのように。"
"10043090-52-スミレ" = "トレーニングも度を過ぎれば、疲労が蓄積してしまうもの。"
"10043090-53-スミレ" = "改めて、そのことに気付かされました。"
"10043090-54" = "[s3] \"そういう体験から学んでいくのが――\"\n[s4] \"スミレの素敵なところだね。\""
"10043090-55-スミレ" = "ふふっ、ありがとうございます。トレーナー。"
"10043090-56-レイ" = "復活……しました！"
"10043090-57-スミレ" = "レイさん、休憩は十分ですか？"
"10043090-58-レイ" = "はい！"
"10043090-59-レイ" = "ミレニアム野球部を率いる4番バッターとして……。"
"10043090-60-レイ" = "立ち止まっている暇はありません！"
"10043090-61-スミレ" = "その意気です！レイさん！"
"10043090-62-スミレ" = "私もこれまでと同じく、全力でサポートします！"
"10043090-63-レイ" = "……あれ？"
"10043090-64-レイ" = "なにか……胸騒ぎが……。"
"10043090-65-スミレ" = "……不安なことでも？そんなときこそ、体を動かしてリラックスしましょう。"
"10043090-66-スミレ" = "今日は持久力強化メニューがいいですね。"
"10043090-67-レイ" = "そ、そのですね……？"
"10043090-68-レイ" = "昨日試合を終えたばかりですし……。"
"10043090-69-レイ" = "今日……くらいはぁ……！"
"10043090-70-レイ" = "……っ！"
"10043090-71-スミレ" = "どこへ行くのですか？"
"10043090-72-スミレ" = "ジムはあちらですよ、レイさん？"
"10043090-73-レイ" = "……。"
"10043090-74-レイ" = "ああぁぁぁ……！"
"10043090-75-レイ" = "トレーニングもうやだあぁぁっ！"
"10043090-76" = "[ns5] \"わ、私は用事を思い出したから……\"\n[ns6] \"レイとスミレのことは、いつも応援してるよ！\""
"10043090-77-スミレ" = "何を言っているのですか、先生？"
"10043090-78-スミレ" = "さぁ――"
"10043090-79-スミレ" = "[ruby=・]会[/ruby][ruby=・]員[/ruby]の皆さま、ジムはあちらです！"
"10043090-80" = "[s] \"！！！！\""
"10043090-81" = "[ns] \"もうトレーニングは――\""
"10043090-82-一同" = "――こりごりだあぁぁ……！"
"10043090-83" = "プレイボール！～目指せ！満塁ホームラン～"
