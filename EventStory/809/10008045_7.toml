[translation]
"10008045-1-アル" = "はあ、はあ、はぁ……。"
"10008045-2-アル" = "ふぅ……。"
"10008045-3-アル" = "っていやいやいや！！何よこの状況、流石に何かおかしいんじゃない！？"
"10008045-4-アル" = "一体全体どこから湧いてくるのよ、まるでキッチンのあれみたいに……！！"
"10008045-5-アル" = "何なのよもう、賽銭箱に蜂蜜でも塗られてるわけ……？"
"10008045-6-アル" = "カブトムシじゃないんだから……。"
"10008045-7" = "[s] \"みんな、賽銭箱を狙ってるみたいだけど……。\""
"10008045-8-カヨコ" = "うん。気になるのは、どうして「賽銭箱が盗まれてること」をみんな知ってるのかっていう……。"
"10008045-9-カヨコ" = "情報が流れるのが早すぎる、まるで大々的に報道でもされたみたいに……。"
"10008045-10-セリカ" = "……あっ、まさか！？"
"10008045-11-ムツキ" = "ん？どしたのバイトちゃん？"
"10008045-12-セリカ" = "ちょっと待って……確か今日、クロノス報道部の誰かが来てたような……。"
"10008045-13-セリカ" = "もしかしたらだけど、そこから……。"
"10008045-14-セリカ" = "……やっぱり！"
"10008045-15-セリカ" = "SNSに情報が出てる！"
"10008045-16-カイテンブラック" = "では、アディオス！"
"10008045-17-シノン" = "ご覧いただけましたでしょうか！？今の映像はつい先ほど「大吉殿」の会場で起きた、賽銭箱強奪事件の様子です！"
"10008045-18-シノン" = "凶悪な指名手配犯「カイテンジャー」は、現在も賽銭箱を持って逃走しています！"
"10008045-19-シノン" = "そしてこの賽銭箱に関しまして、続けてもう一度「大吉殿」の管理人さんのインタビューをご覧ください！"
"10008045-20-亀島五郎" = "許せません、"
"10008045-21-亀島五郎" = "私共の賽銭箱が……！"
"10008045-22-亀島五郎" = "中身もそうですが、何よりもあの賽銭箱には、みなさんの願いごとが詰まっているのです！"
"10008045-23-亀島五郎" = "このまま放っておくわけにはいきません……！"
"10008045-24-亀島五郎" = "何より大事なのは、願いが詰まったあの賽銭箱そのもの！"
"10008045-25-亀島五郎" = "ということで、あのカイテンジャーを捕まえた方には……"
"10008045-26-亀島五郎" = "その賽銭箱の中のお金を、全て差し上げましょう！"
"10008045-27-シノン" = "ご覧いただけましたか？やや不謹慎な気もしてしまいますが、「背に腹は代えられない」とはこのことでしょうか！？そうして元日から始まったこの追撃戦、推定約8桁の賽銭箱を求めて争う新年早々白熱の大競争！"
"10008045-28-シノン" = "参加者の資格などはありません、誰にとってもある意味平等なチャンス！"
"10008045-29-シノン" = "何だか、とんでもない天罰が下る気もしますが……まあ、その辺りは自己責任でお願いします！"
"10008045-30-シノン" = "私たちクロノス報道部は、あくまで事実をお伝えするまでです！"
"10008045-31-マイ" = "新年早々、中々の特ダネですね！"
"10008045-32-シノン" = "ではでは、自己責任で罰当たりな皆さんはどうぞこの欲望のレースにご参加ください！！"
"10008045-33-シノン" = "さあ、賽銭箱の行方や如何に！？"
"10008045-34-シノン" = "この続報が気になる方は、ぜひクロノス報道部のチャンネル登録、"
"10008045-35-シノン" = "高評価、通知のONをお願いいたします！真実と事実は、いつもみなさんのすぐそばに！"
"10008045-36-アル" = "何やっちゃってくれてるのよおおぉぉぉ！？！？"
"10008045-37-カヨコ" = "そういうことか……それでこんなにわらわらと。"
"10008045-38-アル" = "あはっ、"
"10008045-39-アル" = "じゃあまだまだこんなもんじゃなさそうだね？"
"10008045-40-セリカ" = "何か変な流れになってきたわね……。"
"10008045-41-セリカ" = "こうなったら、協力を要請して……！"
"10008045-42-アル" = "ちょっと待ったぁぁっ！！"
"10008045-43-セリカ" = "……え？"
"10008045-44" = "どしたのアルちゃん？協力してくれる数が多いのは良いことじゃない？もしかして、お金の分け前が減るから？"
"10008045-45-アル" = "賽銭箱は取り返す、それで元の場所にそのまま戻すわ。"
"10008045-46-アル" = "賽銭箱のお金も、そのままにね！！"
"10008045-47-カヨコ" = "……！？"
"10008045-48-カヨコ" = "……。"
"10008045-49-ムツキ" = "それまたどうして？わざわざあの管理人が良いよって言ってたのに。"
"10008045-50-アル" = "……ふふっ、聞きなさいムツキ室長。"
"10008045-51-アル" = "私たちがそんなくだらない理由のために動いていたら、「便利屋68」のイメージはどうなると思う？"
"10008045-52-アル" = "風格も無ければ品格も無い、プライドも無いとなっては三流も同然よ。そんなの、私は許せない。"
"10008045-53-アル" = "それに、これしきのことが私たちの手で解決できず、助けを求めるだなんて……"
"10008045-54-アル" = "そんなの、私たち便利屋の名が廃るわ！これくらい私たちの手で解決してみせる！"
"10008045-55-アル" = "これは社長命令よ、何を言われても覆さないわ。"
"10008045-56-カヨコ" = "……まあ、社長命令なら仕方ない。"
"10008045-57-ハルカ" = "そ、それがハードボイルドなんでしょうか……？"
"10008045-58-ムツキ" = "まっ、"
"10008045-59-ムツキ" = "アルちゃんがそれで良いならそうしよっかな。"
"10008045-60-セリカ" = "……ここで正論とか、やるじゃん。あんたたちの社長。"
"10008045-61-セリカ" = "それに、まあカッコよくて良いんじゃない？"
"10008045-62-セリカ" = "……うん、乗った。"
"10008045-63-セリカ" = "まあ、私もみんなが新年の願いを込めたお賽銭を貰うわけにはいかないし……とりあえず、バイト代だけちゃんと貰えれば。"
"10008045-64-セリカ" = "どうせ先輩たちは年明けで寝てるだろうし、さっきのメッセージ一個じゃ起きないだろうし……よし、じゃあ私たちでさっさと解決しよう！"
"10008045-65" = "[s] \"うん。じゃああらためて、追いかけよっか。\""
"10008045-66-会場のお客さんC" = "「穢れ」が付いたりしたら……？"
"10008045-67-会場のお客さんC" = "「穢れ」が付いたりしたら……？"
"10008045-68-会場のお客さんC" = "「穢れ」が付いたりしたら……？"
"10008045-69-アル" = "（と、とにかく、このごたごたに乗じて穢れが付いちゃう前に……！）"
"10008045-70-アル" = "は、早く！急いで追撃するわよ！！"
