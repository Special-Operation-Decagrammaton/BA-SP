[translation]
"10008040-1" = "第4話;集まる邪魔者たち"
"10008040-2-チンピラ１" = "ひゃははっ！賽銭箱は私たちのものだ！"
"10008040-3-チンピラ２" = "賽銭箱さえ手に入れば……！"
"10008040-4-チンピラ３" = "普段から胸の内に秘めていた、あの夢がついに……！"
"10008040-5-アル" = "邪魔よっ！！"
"10008040-6-チンピラ２" = "そ、そんな、戦闘パートも無しだなんて雑な……ぐはっ！"
"10008040-7-傭兵バイトA" = "見つけた！あいつらをどうにかすれば賽銭箱が……！"
"10008040-8-傭兵バイトB" = "賽銭箱を奪って、今度新しく出る銃火器を……！"
"10008040-9-傭兵バイトA" = "せ、せめて話を、銃火器語りを……。"
"10008040-10-アル" = "はぁ、はぁ……。"
"10008040-11-カヨコ" = "やっぱりこれ、何かがおかしいような……。"
"10008040-12-アル" = "んー？今度は何？"
"10008040-13-チンピラ１" = "あそこだ！"
"10008040-14-ヘルメット団A" = "逃がすか！"
"10008040-15-傭兵バイトたち" = "行けっ、総員突撃！！"
"10008040-16-セリカ" = "な、何か一気に集まってきた！？"
"10008040-17-アル" = "ああもう何なのよぉ！？"
