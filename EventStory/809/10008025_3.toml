[translation]
"10008025-1" = "第2話;混乱はいつも突然に"
"10008025-2-セリカ" = "ちょっと！爆発音が聞こえたけど、どうしたの！？"
"10008025-3-ムツキ" = "あ、バイトちゃんお疲れ～。ちょっとこいつらがねー……"
"10008025-4-カイテンピンク" = "はっはっはっ！"
"10008025-5-セリカ" = "あ、あれって……！？"
"10008025-6-カヨコ" = "……その反応だと、やっぱり予定してたイベントとかじゃないみたいだね。"
"10008025-7-セリカ" = "絶対違う！お正月のヒーローショーとか聞いたことないし！"
"10008025-8-会場のお客さんA" = "あいつら、カイテンジャーだ……！"
"10008025-9-会場のお客さんB" = "「一度現れたら周囲を焦土と化してしまう」という、あの！？"
"10008025-10-会場のお客さんC" = "ど、どうしてここに……！？"
"10008025-11-ムツキ" = "あれさ、実はバイトちゃんのお仲間だったりしない？覆面水着団の新しいコスチュームとか。"
"10008025-12-セリカ" = "絶対に違うから！？あんなのが仲間とか嫌！"
"10008025-13-セリカ" = "あとそれは忘れて、黒歴史なのっ！！"
"10008025-14" = "[s] \"カイテンジャー……！？\""
"10008025-15-セリカ" = "あれ、先生知ってるの？"
"10008025-16" = "[s1] \"いや、初めて見るはずなんだけど……。\"\n[s2] \"BD、技術ノート……！うっ、頭が……！\""
"10008025-17-カイテンブラック" = "ふはははっ、なかなかやるではないか！"
"10008025-18-カイテンブラック" = "レッド、舐めてかかると痛い目見るぞ！"
"10008025-19-カイテンイエロー" = "ふん、だとしても問題は無い。"
"10008025-20-カイテンレッド" = "ああ、"
"10008025-21-カイテンレッド" = "我々の目的は戦うことではない！"
"10008025-22" = "とうっ！"
"10008025-23-一同" = "さ、賽銭箱が……！？"
"10008025-24-アル" = "……え？"
"10008025-25-セリカ" = "ちょぉっ！？"
"10008025-26-カイテングリーン" = "レッド、賽銭箱の奪取完了しました。しっかり成果給に反映しておいてください。"
"10008025-27-カイテンレッド" = "流石、給料が絡むとしっかりしてるな！グリーン！"
"10008025-28-カイテンブラック" = "これで第一目標は完了。"
"10008025-29-カイテンレッド" = "はっはっはっ！よし、このお金は我々カイテンジャーが公明正大に使わせてもらうこととする！"
"10008025-30-カイテンレッド" = "この賽銭箱、確かに貰い受けたぞ！"
"10008025-31-アル" = "ちょっ、何してんのよっ！？"
"10008025-32-カイテンブラック" = "では、アディオス！"
"10008025-33" = "[ns3] \"賽銭箱が……。\"\n[ns4] \"盗まれた……？\""
"10008025-34-アル" = "ええぇぇぇぇぇぇっ！？"
"10008025-35-セリカ" = "ちょっ、これ私の責任じゃないわよね！？これでバイト代無くなったりしないわよね！？"
"10008025-36-アル" = "くくっ、ふふふっ……！"
"10008025-37-アル" = "あははははっ！何あいつら、意味わかんない！賽銭箱持っていってるし、あははははははっ！"
"10008025-38-カヨコ" = "何この状況……。"
"10008025-39-ハルカ" = "あ、アル様！？ど、どどどどどうしましょう！？"
"10008025-40-アル" = "そんなの決まってるでしょう！すぐに追いかけるわよ！"
"10008025-41" = "そうだよ、賽銭箱を取り返さないと！"
"10008025-42-カヨコ" = "うーん……。"
"10008025-43-カヨコ" = "……これ、追いかける必要ある？"
"10008025-44-セリカ" = "えぇっ！？"
"10008025-45-カヨコ" = "盗まれたのは賽銭箱だし、取り返したってそれが私たちのお金になるわけでもない。"
"10008025-46-カヨコ" = "それにあいつら、結構厄介だよ。指名手配されてる悪党だし、相手をするにはそこそこリスクがある。"
"10008025-47-セリカ" = "……っ！べ、別に良いわよ！どうせあんたたちに頼らなくたって、自分で何とかするから！"
"10008025-48-セリカ" = "自分の力で何とかする！アビドスのことも、今回のこともっ！"
"10008025-49-セリカ" = "じゃあ、私はもう行くから！"
"10008025-50" = "[s] \"セリカ。\""
"10008025-51-セリカ" = "止めないで先生！早く行かないと……！"
"10008025-52-アル" = "……私たちも行くわ。"
"10008025-53-ムツキ" = "えっ！？"
"10008025-54-セリカ" = "ど、どういうこと……！？"
"10008025-55-アル" = "……カヨコの言うことは、確かに正しいわ。"
"10008025-56-アル" = "もう私たちのお願いごとは済んだのだし、わざわざ自分たちから危険を背負う必要も無い。"
"10008025-57-アル" = "でもね……我々便利屋68はいつから、損得を計算して動く集団になったのかしら？"
"10008025-58-カヨコ" = "ふぅ……。"
"10008025-59-アル" = "計算上はやる必要ないわ。"
"10008025-60-アル" = "でもね、これはあくまでも気分の問題……"
"10008025-61-アル" = "年明け早々、この私たちが入れたお金を盗むなんて許せない、それだけよ！！"
"10008025-62-ムツキ" = "へぇ……。"
"10008025-63-ハルカ" = "あ、アル様……！！"
"10008025-64-カヨコ" = "……まあ、そう言うと思ったけど。"
"10008025-65-カヨコ" = "逃走ルートは大体絞れた。今から急げば、15分以内には追いつけるはず。"
"10008025-66-カヨコ" = "先生もいるから、もう少し早まるかもね。"
"10008025-67-ムツキ" = "ふーん、なるほど～？"
"10008025-68-ムツキ" = "カヨコちゃん。アルちゃんが最初っからそう言うの分かってて、調べてたんでしょ？"
"10008025-69-カヨコ" = "……まあ、いつものパターンだから。"
"10008025-70-セリカ" = "な、何か色[ruby=しゃく]々癪な[/ruby]感じもするけど……"
"10008025-71-セリカ" = "今はお礼とか言わないから。賽銭箱を取り返して、全部終わってからね！"
"10008025-72" = "[s] \"じゃあ、みんなで追いかけよっか。\""
"10008025-73-ハルカ" = "さ、流石はアル様です！これが真のアウトローの振る舞いなんですね！また一つ学びました……！"
"10008025-74-ムツキ" = "まあ、元々アルちゃんは衝動的なところあるからね～。"
"10008025-75" = "ふふっ……それを言うなら「衝動」じゃなくて、「アウトローの気質」と言ってくれるかしら？"
"10008025-76-アル" = "（事業が潰れませんように、事業が潰れませんように、事業が潰れませんように、事業が潰れませんように、事業が潰れませんように、事業が潰れませんように……っ！！）"
"10008025-77-会場のお客さんC" = "「穢れ」が付いたりしたら……？"
"10008025-78-会場のお客さんC" = "蓄積された願いが丸っと裏返って、大変なことに……！"
"10008025-79-アル" = "（賽銭箱を取り返せなかったら、あの願いが裏返って……！）"
"10008025-80-アル" = "（ぜ、絶対に、何としてでも取り返さないと！！！）"
