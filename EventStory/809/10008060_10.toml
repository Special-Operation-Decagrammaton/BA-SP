[translation]
"10008060-1" = "第6話;取り戻したい理由"
"10008060-2" = "[ns] \"とりあえず状況を整理してみようか？\""
"10008060-3-セリカ" = "うん。まず賽銭箱を巡る一連の流れは、犯罪組織「黒亀組」の大規模な詐欺だった。"
"10008060-4-ハルカ" = "そ、それでカイテンジャーが、正義と言いつつ、賽銭箱を盗み……。"
"10008060-5-ムツキ" = "で、他の問題児たちやら風紀委員会やらが大集合～！"
"10008060-6-ムツキ" = "あっちこっちがめちゃくちゃなドタバタレースになってるってことだね、あはっ！"
"10008060-7-カヨコ" = "……新年早々慌ただしいね、全く。"
"10008060-8-アル" = "ふふっ……。"
"10008060-9-アル" = "まあ良いわ！とにかく良かった良かった！"
"10008060-10-アル" = "……社長？"
"10008060-11-ムツキ" = "ふ～ん？アルちゃん、安心したーって感じだね？"
"10008060-12-アル" = "い、いやそのっ……！？"
"10008060-13-ムツキ" = "くふふっ、もしかしてぇ……アルちゃんの願い事が「裏返る」なんてことはない、って分かったから？"
"10008060-14-アル" = "っ！？"
"10008060-15-アル" = "まさかとは思うけど……ずっと賽銭箱を追いかけてた理由って、それ……？"
"10008060-16-アル" = "ち、違うわよ！"
"10008060-17-アル" = "あ、あくまでちょっと、気になってたぐらいで……"
"10008060-18-アル" = "ほ、ほら！新年早々、嫌な気持ちで始めるのは避けたいでしょう！？"
"10008060-19-ムツキ" = "あははっ！"
"10008060-20-ムツキ" = "それにアルちゃん、すっごい切実なお願い事してたもんね！"
"10008060-21-アル" = "い、いや……それはだからその……！"
"10008060-22-カヨコ" = "はぁ……ムツキ、この辺にしておいてあげよう。"
"10008060-23-ハルカ" = "わ、私はアル様の気持ちも理解できます！はい！"
"10008060-24-ムツキ" = "あはははっ！"
"10008060-25-ムツキ" = "まあ、でも色々分かってきたことだし……んー、全部詐欺なら、もう帰っちゃう？"
"10008060-26-ムツキ" = "それかどうせ詐欺だったなら、あらためてあの賽銭箱の中身を手に入れちゃうのもアリかも？"
"10008060-27-カヨコ" = "社長、どうする？"
"10008060-28-アル" = "……やることは変わらないわ。取り戻して、返すだけよ。"
"10008060-29-ムツキ" = "えっ？"
"10008060-30-アル" = "みんな、お願い事をしたでしょう？"
"10008060-31-アル" = "当たり前だけど、それが叶ってほしいからこそお願い事をしたはず。"
"10008060-32-アル" = "そうよね？"
"10008060-33-アル" = "どっかの誰かさんは、趣味を我慢してでも願ったわけだし……。"
"10008060-34-カヨコ" = "……。"
"10008060-35-アル" = "どっかの誰かさんは、工事現場で頑張って働いた大事なお金を入れたわけだし……！"
"10008060-36-ハルカ" = "アル様……。"
"10008060-37-カヨコ" = "（ハルカはその辺、あんまり気にしてなさそうだけど……）"
"10008060-38-ムツキ" = "（私はオモチャのお金だったけど……）"
"10008060-39-アル" = "確かにこの状況は、犯罪組織と変なやつらに振り回されているだけかもしれない。それでも……"
"10008060-40-アル" = "あの願いは本物だったんだから……！"
"10008060-41-アル" = "それを、汚させるわけにはいかないわ！"
"10008060-42-ハルカ" = "……あ、アル様！そこまで、私たちのことを……！"
"10008060-43-ムツキ" = "うーん、アルちゃんはやっぱりアルちゃんだね～。"
"10008060-44-カヨコ" = "……こうやって、たまに刺してくるんだから。"
"10008060-45-セリカ" = "ほんっと、時々だけど良いこと言うわよね……？"
"10008060-46" = "[s] \"流石はアル社長だね。\""
"10008060-47-アル" = "つまり、私たちの目的は変わらないわ！"
"10008060-48-アル" = "どんな事情があったって、とにかく賽銭箱は取り返す。そう決めたの！"
"10008060-49-アル" = "さあ、付き合ってもらうわよ？"
"10008060-50-ハルカ" = "……まあ、仕方ない。"
"10008060-51-ムツキ" = "くふふっ、まあそっちの方が面白そうだし！良いよ！"
"10008060-52-ハルカ" = "は、はい！"
"10008060-53-アル" = "分かった分かった。"
"10008060-54" = "[s] \"じゃ、行こっか。\""
"10008060-55-アル" = "ところで……カイテンジャーはどこに行ったのかしら？"
"10008060-56-ムツキ" = "あはっ、"
"10008060-57-ムツキ" = "締まらないところまで含めてアルちゃんだねー。"
"10008060-58-カヨコ" = "……まあ、"
"10008060-59-カヨコ" = "手がかりならあるよ。"
"10008060-60-アル" = "カヨコ！さすがは私たち便利屋68の頼れる課長……！"
"10008060-61-カヨコ" = "大げさな……"
"10008060-62-カヨコ" = "とにかくさっきの風紀委員会が言ってた資金洗浄の件、賽銭箱、それからカイテンジャーの意図を推測すると……"
"10008060-63-カヨコ" = "多分……"
"10008060-64" = "ブラックマーケット・路地裏"
"10008060-65-カイテンレッド" = "ふぅ……"
"10008060-66-カイテンレッド" = "ここまで来れば、流石に振り切っ――"
"10008060-67-アル" = "見つけたわよっ！"
"10008060-68-カイテンレッド" = "なっ、"
"10008060-69-カイテンレッド" = "どうして我々の位置が……！？"
"10008060-70-ムツキ" = "わ～お、バッチリ！流石はカヨコっち！"
"10008060-71-カヨコ" = "別に難しい話じゃない。違法な物を違法な物だと分かって奪ったんだとしたら……"
"10008060-72-カヨコ" = "それを処理するにも、違法なルートが必要。つまり、ブラックマーケットを通すしかない。"
"10008060-73-カヨコ" = "まあこれぐらい、風紀委員会もすぐに気づくと思うけど。"
"10008060-74-カイテンレッド" = "それでも風紀委員会より早かったわ！それだけでお手柄よカヨコ！"
"10008060-75-アル" = "さあ、賽銭箱を大人しく返しなさい！"
"10008060-76-カイテンレッド" = "ははっ、何をくだらないことを！"
"10008060-77-アル" = "く、くだらない……！？"
"10008060-78-カイテンレッド" = "一度奪った時点でこの賽銭箱は我々のもの、カイテンジャーの資金だ！返すわけが無いだろう！"
"10008060-79" = "[s] \"完全に悪役の台詞だ……。\""
"10008060-80-カイテンレッド" = "何をっ！我々は正義そのもの！「正義」で辞書を引けば、そこには我々の名前があるはず！"
"10008060-81-カイテンレッド" = "こうなったら全員で総攻撃だ！すべては我々の、夢のために……！"
"10008060-82-ムツキ" = "みーんな同じこと言ってるね？夢がどうとか。"
"10008060-83-カヨコ" = "はぁ……。"
"10008060-84-アル" = "そっちがそう来るなら、私たちも実力行使で……！"
"10008060-85-アル" = "さあ、行くわよ！"
