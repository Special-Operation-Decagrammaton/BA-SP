[translation]
"10008055-1-イオリ" = "ぐっ！"
"10008055-2-イオリ" = "先生、まさか問題児たちの肩を持つつもり！？"
"10008055-3" = "[s1] \"肩を持つっていうか……。\"\n[s2] \"とりあえず話を聞いてほしいんだけど……。\""
"10008055-4" = "（イオリに、これまでのことを説明した）"
"10008055-5-イオリ" = "つまり……便利屋68もそこのアビドスの生徒も、賽銭箱の中身を狙ってるわけじゃなくって。"
"10008055-6-イオリ" = "あくまで、本当に取り返そうとしてるってこと？"
"10008055-7-イオリ" = "……私にそれを信じろと？"
"10008055-8" = "[s] \"信じて！お願い！\""
"10008055-9-カヨコ" = "それ以上言っても無駄かもよ。相変わらず、頭が固いんだから……。"
"10008055-10-イオリ" = "はぁっ！？"
"10008055-11-アコ" = "イオリ、状況はいかがですか？全部片付きました？"
"10008055-12-イオリ" = "あっ、アコちゃん！それがその、邪魔をされて……。"
"10008055-13-アコ" = "邪魔を……？……まさか、黒亀組ですか！？"
"10008055-14-カヨコ" = "（……黒亀組？）"
"10008055-15-イオリ" = "いや、便利屋68とアビドスのひとり。あと先生。"
"10008055-16-アル" = "別に邪魔も何もしてないわよ！いきなり襲ってきたのはそっちでしょう！？"
"10008055-17-アコ" = "……便利屋68にアビドス、それに先生？"
"10008055-18" = "[s] \"やっ、アコ。あけましておめでとう。\""
"10008055-19-アコ" = "どうして先生が……えっと、あけましておめでとうございます。"
"10008055-20-アコ" = "ではなく待ってください、これは一体……？"
"10008055-21-アコ" = "なるほど……おおよそ把握しました。便利屋68のみなさんはアビドスのその方と一緒に、賽銭箱を取り返そうと追撃中。それにあたってシャーレと協力……と言いますか、味方に引きずり込んだと。"
"10008055-22-アコ" = "何ともズルいやり方ですね……。"
"10008055-23-アル" = "？"
"10008055-24-カヨコ" = "ところで、風紀委員会は暇そうだね。問題児を追いかけてると思いきや、通りすがりの人に喧嘩を売るなんて。"
"10008055-25-アコ" = "あら、これはどうも。普通の会話に見せかけて意外と負けず嫌いなその言い方、相変わらずカヨコさんらしいですね。"
"10008055-26-カヨコ" = "まあ、こっちからしても邪魔されてる状況だからね。早めにどいてほしい。"
"10008055-27-アコ" = "そうですか……。"
"10008055-28-カヨコ" = "……。"
"10008055-29-アル" = "くふふっ。さて、どうなるのかな～？"
"10008055-30-アル" = "？？？"
"10008055-31" = "[s] \"えっと……。\""
"10008055-32-アコ" = "はあ……"
"10008055-33-アコ" = "まあ、構いません。"
"10008055-34-アコ" = "……イオリ、私は問題児たちを片付けるように言いましたが、シャーレと揉め事を起こせとは言ってないんですよ？"
"10008055-35-アコ" = "何をしているんですか、全くもう。"
"10008055-36-アコ" = "もしかしてイオリは風紀委員会の仕事が好き過ぎて、正月だとしても帰りたくないとかそういうことなんですか？"
"10008055-37-イオリ" = "何その白々しい方向転換！？っていうかアコちゃん、私のせい！？せっかくの休日に出動したのにこの仕打ち！？"
"10008055-38-イオリ" = "アコちゃんこそ私に任せっきりで、今まで何してたのさ！？"
"10008055-39-アコ" = "情報を集めていたら遅くなっただけです。"
"10008055-40-アコ" = "カイテンジャーが賽銭箱を盗んだことから始まった、この小さな一連の騒動。"
"10008055-41-アコ" = "実は今回の事態で重要なのはそこではありません。"
"10008055-42" = "[s] \"どういうこと？\""
"10008055-43-アコ" = "結論から申し上げますと、今回の「大吉殿」での一連の出来事……これらは、黒亀組という組織が絡んでる大々的な詐欺ですね。"
"10008055-44-アル" = "えぇっ！？"
"10008055-45" = "[s] \"黒亀組……？\""
"10008055-46-アコ" = "はい。犯罪組織「黒亀組」……そしてその「大吉殿」は、[ruby=マネーロンダリング]資金洗浄[/ruby]のための場所と言えるでしょう。"
"10008055-47-アル" = "なっ、ど、どういうこと！？"
"10008055-48-アコ" = "言った通りの意味です、その賽銭箱は不法資金のために使われていたのでしょう。"
"10008055-49-アコ" = "難しいお話ではありません。不法に集めた資金を、まずは賽銭箱の中に入れておく。これだけで、ヴァルキューレ警察学校などの治安機関の視線を逸らすことができます。"
"10008055-50-アコ" = "こういった扱いであれば、多少疑わしくとも無理に賽銭箱をどうこうしようとはなりません。"
"10008055-51-アコ" = "もちろん、相当の規模の金額が動けば話は別でしょう。しかし黒亀組は、もう一つの手段を用意していました。"
"10008055-52" = "[s] \"もう一つの手段って、もしかして……\""
"10008055-53-アコ" = "はい、"
"10008055-54-アコ" = "あのマスコミやSNSの利用です。"
"10008055-55-アコ" = "「願い事が叶う場所」だなんていう、あんな面白味の無いキャッチフレーズでしたが、実際のところ効果は絶大。有名な場所として知られるようになりました。"
"10008055-56-アコ" = "こうしてご覧の通り、それに引き付けられて訪ねてくる「おバカさんたち」で埋め尽くされるほどに。"
"10008055-57-アル" = "うっ……！？"
"10008055-58-カヨコ" = "……大々的な宣伝によって、ここでお賽銭を入れる人の数が増える。"
"10008055-59-カヨコ" = "もちろん自然と、お賽銭の額もどんどん膨らんでいく……"
"10008055-60-カヨコ" = "元々あった黒亀組の不法資金がどれくらいあったのか、分からなくなるくらいに。"
"10008055-61" = "[s] \"木を隠すなら森の中……。\""
"10008055-62" = "あら、とっくに見抜いていた……という感じですね？やはり、流石はカヨコさんです。"
"10008055-63-カヨコ" = "はぁ、何そのわざとらしい言い方……。"
"10008055-64-アコ" = "そもそも「大吉殿」って、ああいった場所の名称としては少しおかしいでしょう？それに「願いが叶う」などと、噂程度ならまだしも自分たちで言い出すなんて、罰当たりと言いますかおかしい話です。"
"10008055-65-アル" = "ちょっ、ちょっと待って！それじゃあ「願い事が叶う場所」っていうのも、「穢れが付いたらお願い事が裏返る」っていうのも、全部嘘……？"
"10008055-66-アコ" = "穢れ……裏返る……？そういったお話は、完全に初耳ですが……？"
"10008055-67-アル" = "……そ、そう！ま、まあ知ってたわよ！全部詐欺だったんでしょう、ええ知ってたわ！"
"10008055-68" = "じゃあ、「賽銭箱を取り戻したら全部お渡しします」っていうのは……"
"10008055-69-アコ" = "盗難事件として扱われてしまえば、必然的にヴァルキューレなどの機関が介入してきます。それを一時的にでも止めようと思ったのではないでしょうか？"
"10008055-70-アコ" = "「警察の方々がいらっしゃるようなことではありません、これはあくまでお正月のイベントですから」……そのような言い分で。"
"10008055-71-カヨコ" = "あはははっ！"
"10008055-72-ムツキ" = "そこまで考えられたサプライズイベントだったってこと？"
"10008055-73-カヨコ" = "あと多分、黒亀組の狙い目はそれだけじゃなくって……"
"10008055-74-セリカ" = "わ、私はそんな場所に、巫女さんとして雇われてたわけ……！？"
"10008055-75-セリカ" = "っていうか犯罪組織が巫女さんを雇わないでよ、巫女さんたちに失礼じゃん！"
"10008055-76-アコ" = "まあ黒亀組が掌握する前からそういう場所でしたので、巫女の方々には何も知らされていないでしょうけど……。"
"10008055-77" = "[s3] \"何はともあれ、セリカの巫女姿は良いと思う！\"\n[s4] \"何はともあれ、セリカの巫女さんとしての心は本物だと思う！\""
"10008055-78-セリカ" = "え、えぇっ……！？ま、まあ別に変なとこに雇われたこと自体は、そこまで気にしてるわけじゃないけど……そういう風に言ってくれるのは嬉しいかな……。"
"10008055-79-セリカ" = "え、えぇっ……！？ま、まあ別に変なとこに雇われたこと自体は、そこまで気にしてるわけじゃないけど……そういう風に言ってくれるのは嬉しいかな……。"
"10008055-80-セリカ" = "私はちゃんとやることやって、"
"10008055-81-セリカ" = "約束通りバイト代さえ貰えればそれで良いし。"
"10008055-82" = "[s5] \"だとすると、カイテンジャーは……\"\n[s6] \"もしかして、本当に正義のために……？\""
"10008055-83-アコ" = "まあ、解釈によってはそう捉えることもできるかもしれませんね？「正義」というものを、どのように定義するか次第ですが。"
"10008055-84-アコ" = "まあ、解釈によってはそう捉えることもできるかもしれませんね？「正義」というものを、どのように定義するか次第ですが。"
"10008055-85-アコ" = "もしかしたら、義賊的なことをしたいのかもしれませんが……。"
"10008055-86-アコ" = "ただ、正確なところは分かりません。元々カイテンジャーについては、その正体も目的もいまいち分かっていませんので。"
"10008055-87-アコ" = "それはまあ正直なところ、どうでも良いのです。我々風紀委員会として大事なことは、ゲヘナ付近で起きているこの混乱を片付けること。"
"10008055-88" = "[s] \"なるほど。\""
"10008055-89-アコ" = "はい。相手がカイテンジャーであれ、黒亀組であれ、校内の問題児であれ構いません。委員長が席を外しているこのタイミングで風紀を乱すなら、私がそれを正すのみ。"
"10008055-90-アコ" = "というわけで、時間を無駄にしてはいられません。イオリ、引き続き問題児たちを追ってください……それから、先生。"
"10008055-91-アコ" = "新年の初日だというのに、相変わらず余計な騒動に巻き込まれているようですが……お人よしも大概にした方が良いですよ。"
"10008055-92-アコ" = "では、また。"
"10008055-93-イオリ" = "アコちゃん、私に休ませる気ないな……。"
"10008055-94-イオリ" = "……ふう。"
"10008055-95-イオリ" = "じゃあ便利屋、お前たちもこれ以上面倒な騒ぎを起こすなよ！"
"10008055-96-イオリ" = "先生も、またね。今年もよろしく。……じゃあ引き続き、問題児を追いかけるとしよう。風紀委員会、行くぞ！"
"10008055-97-風紀委員たち" = "はいっ！！"
"10008055-98" = "（そうして風紀委員会は、風のように去っていった）"
