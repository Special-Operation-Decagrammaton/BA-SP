[translation]
"10008110-1" = "第11話;大吉殿攻防戦"
"10008110-2-黒亀組の組員A" = "ぼ、ボス！かなりの数が押し寄せてきており、武力衝突が発生しております！"
"10008110-3-黒亀組の組員A" = "このままですと、事務所まで押し寄せてくるのも時間の問題です！"
"10008110-4-亀島五郎" = "くっ……！まさかここまで邪魔をされることになるとは……！！"
"10008110-5-亀島五郎" = "予定より早いですが、仕方ありません。"
"10008110-6-亀島五郎" = "賽銭箱を持って脱出しましょう！"
"10008110-7-アル" = "見つけたわよ！"
"10008110-8-亀島五郎" = "なっ！？もしやこの事態、あなた方が……！？"
"10008110-9-アル" = "ええそうよ、よくも散々コケにしてくれたわね！"
"10008110-10-アル" = "SNSがどうとか偉そうに言ってたけれど、"
"10008110-11-アル" = "そういう当人ほどSNSで滅びるものなのよ！"
"10008110-12-カヨコ" = "……まあ、一理あるね。"
"10008110-13-セリカ" = "バイトだからって、ただ従順なだけだと思わないでよね！"
"10008110-14-セリカ" = "逃がさないんだから！"
"10008110-15-亀島五郎" = "ぐっ、生意気な……！"
"10008110-16-亀島五郎" = "もっと兵力を集めなさい！"
"10008110-17-亀島五郎" = "また来たところで同じこと。数を増やせばあなた方ごとき、制圧するのは朝飯前……！"
"10008110-18-黒亀組の組員A" = "そ、それが……現在黒亀組の兵力の大半が、正門付近で邪魔されてるとかで……！"
"10008110-19-亀島五郎" = "ど、どういうことですか！？"
"10008110-20-ホシノ" = "さぁ、やっていこうか～！"
"10008110-21-ノノミ" = "悪い子たちにはお仕置きですよ～☆"
"10008110-22-シロコ" = "……夢を踏みにじった代償は大きい。"
"10008110-23-亀島五郎" = "せ、正門以外にいる分を呼べば良いではありませんか！"
"10008110-24-黒亀組の組員B" = "それだけではありません！正門以外にも、あちこちから別の襲撃者が……！"
"10008110-25-亀島五郎" = "……！！"
"10008110-26-イオリ" = "黒亀組、だったか……。"
"10008110-27-イオリ" = "元旦からこんな騒ぎを起こすなんて、"
"10008110-28-イオリ" = "何を考えてるんだ！"
"10008110-29-イオリ" = "休日出勤の怒りを見せてやる、行け！"
"10008110-30-風紀委員たち" = "はいっ！！"
"10008110-31-アコ" = "気持ちは分かるのですが、その言い方はちょっと風紀委員会としてどうかと……。"
"10008110-32-アコ" = "まあ今日くらいは許容ですかね。"
"10008110-33-アコ" = "とりあえず、好きなだけ暴れさせておきましょうか。"
"10008110-34-アコ" = "……では黒亀組のみなさん、あなたたちを全員拘束させてもらいます。"
"10008110-35-亀島五郎" = "な、なぜ、どうしてこんなことに……！"
"10008110-36-アル" = "ふふっ……その答え、教えてあげましょうか？"
"10008110-37-アル" = "何故ならそれは……"
"10008110-38-アル" = "私たち、便利屋68を敵に回したからよ！"
"10008110-39-ハルカ" = "か、かっこいいです！アル様！"
"10008110-40-カヨコ" = "……いや、偶然と協力のおかげだと思うけど。"
"10008110-41-ムツキ" = "アルちゃんは一度調子に乗ると止まらないからね～！くふふっ！"
"10008110-42-セリカ" = "……あんたたちの社長、周りから時々「図々しい」とか言われない？"
"10008110-43-アル" = "う、うるさいわね！"
"10008110-44-アル" = "とにかく、今こそ私たちの意地を見せる時よ！"
"10008110-45-アル" = "もちろん先生も、お願いね？"
"10008110-46" = "[s] \"うん。じゃあ、行こうか。\""
