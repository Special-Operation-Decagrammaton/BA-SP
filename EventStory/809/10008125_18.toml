[translation]
"10008125-1-カイテンイエロー" = "ははははははっ！やはりダメだったか！"
"10008125-2-カイテンレッド" = "うむ！まだ機体の調整が足りなかったな！"
"10008125-3-カイテンブラック" = "レッド！次は性能と出力をもっと変えよう！"
"10008125-4-カイテンピンク" = "……毎回思うんだけど、もしかして一生懸命なの私だけ？何かいっつもふざけてない？ねえ？"
"10008125-5-カイテングリーン" = "ところでレッド。そろそろ契約期間が終わりますが、延長しますか？"
"10008125-6-カイテンレッド" = "おっと困った！その金はもうMk.1に使ってしまったな、どうしたものか！"
"10008125-7-カイテンレッド" = "まあとにかくこの場は、撤退するとしよう！"
"10008125-8-カイテンレッド" = "しかしこれで終わりではないぞ！我々の戦いは、まだまだ続くのだからな！"
"10008125-9-カイテンレッド" = "回り続けるレールはやがて……正義の未来へと繋がる！"
"10008125-10-カイテンレッド" = "無限回転寿司戦隊・カイテンジャー、退場っ！"
"10008125-11-アル" = "これって、結局……"
"10008125-12-アル" = "わ、私たちのお金は、全部吹き飛んだってこと！？嘘でしょぉぉぉっ！？"
"10008125-13-アル" = "あ、アル様！わ、私は大丈夫ですので！お金でしたら、また稼ぎますので！"
"10008125-14-アル" = "はぁ、全く……。"
"10008125-15-ムツキ" = "あはっ！やっぱり最後はこんな感じだったね！"
"10008125-16-セリカ" = "……私、もう帰って良い？"
"10008125-17" = "[s] \"えっと……お疲れ様。\""
"10008125-18" = "（新年初日の大騒ぎは、こうして幕を閉じた）"
