[translation]
"10008050-1" = "第5話;風紀委員会参戦"
"10008050-2-アル" = "ど、どっちに行けば良いの！？"
"10008050-3-カヨコ" = "今までの逃走ルートを考えると、多分――"
"10008050-4-風紀委員A" = "不審者を発見しました！"
"10008050-5-アル" = "えっ、不審者？って、つまりカイテンジャー！？"
"10008050-6-アル" = "どこどこ、どこにいるの！？"
"10008050-7-風紀委員B" = "フォーメーションA、包囲網を構築せよ！"
"10008050-8-カヨコ" = "これって、もしかして……。"
"10008050-9-アル" = "ちょっ、待ちなさい！"
"10008050-10-アル" = "不審者ってまさか……！？"
"10008050-11-イオリ" = "ようやく捉えたぞ、この問題児どもめ！もうこれ以上は逃がさな――"
"10008050-12" = "[s] \"あ、イオリだ。\""
"10008050-13-イオリ" = "って、先生……？えっと、あけましておめでとう……。"
"10008050-14-イオリ" = "先生がどうしてここに？それに、そこの問題児どもと一緒で……。"
"10008050-15-アル" = "だ、誰が問題児よ！？"
"10008050-16-イオリ" = "お前たち以外に誰がいるんだ、便利屋！"
"10008050-17" = "[s] \"あけましておめでとう。イオリの方こそ、どうしてここに？\""
"10008050-18-イオリ" = "そりゃ、私はもちろん……"
"10008050-19-カヨコ" = "こんな深夜に大勢でいるってことは、"
"10008050-20-ムツキ" = "あはっ。"
"10008050-21-ムツキ" = "もしかして風紀委員みんな暇してたから、仲良く集まってるとか？"
"10008050-22-イオリ" = "そんな訳あるかっ！"
"10008050-23-イオリ" = "新年早々こっちは働いてるんだ！"
"10008050-24" = "[s] \"やっぱり風紀委員会の仕事で？\""
"10008050-25-イオリ" = "うん。さっきの「大吉殿」の生放送の件で、今この辺りがすごいことになってて……。"
"10008050-26-イオリ" = "賽銭箱狙いのやつが大量発生して、もうあちこちめちゃくちゃだよ。"
"10008050-27-イオリ" = "こいつらを始めとして、うちの学園の問題児共がどいつもこいつも暴れてるし、アコちゃんは事態を収拾するまで帰ってくるなって言うし……。"
"10008050-28-イオリ" = "何なんだもう、新年早々！"
"10008050-29-イオリ" = "……それもこれも、全部お前たちのせいだ！"
"10008050-30-アル" = "違うわよ！？"
"10008050-31-アル" = "元凶は私たちじゃないし、そもそも私たちだって被害者みたいなもので……！"
"10008050-32-セリカ" = "そうよ！今はこんなことしてる場合じゃないの！"
"10008050-33-イオリ" = "……被害者？"
"10008050-34-イオリ" = "お前たちも賽銭箱を狙ってるくせに、何を図々しいことを……。"
"10008050-35-アル" = "そっ、それはその、事情があって……！"
"10008050-36-イオリ" = "やっぱり狙ってるんじゃないか！この問題児め！"
"10008050-37-イオリ" = "風紀のために、この場でお前たちを撃退する！あと私の正月休みのために！"
"10008050-38-イオリ" = "だから事情が、ってああもうっ！"
"10008050-39" = "[s] \"その、みんな一旦落ち着いて……\""
"10008050-40-ムツキ" = "あははっ！良いよ良いよ、やろっか！"
"10008050-41-カヨコ" = "戦闘準備OK。"
"10008050-42-ハルカ" = "あ、アル様！私にお任せください！"
"10008050-43-アル" = "だから待ちなさいよぉっ！"
