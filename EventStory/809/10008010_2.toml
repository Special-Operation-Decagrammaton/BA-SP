[translation]
"10008010-1" = "第1話;訪れた先で"
"10008010-2" = "（新年を迎えて、最近SNSで流行りの場所へと来ていた）"
"10008010-3" = "（お正月向けの場所ということもあってか、もはや身動きが取れないほど混み合っている）"
"10008010-4" = "[s] \"お正月って感じがする……。\""
"10008010-5-ムツキ" = "……あっ、先生！"
"10008010-6-ムツキ" = "あけましておめでとー！"
"10008010-7-アル" = "……あら？奇遇ね、先生？"
"10008010-8-ハルカ" = "あ、あああああけましておめでとうございます！先生……！"
"10008010-9-カヨコ" = "や、先生。あけましておめでとう。"
"10008010-10" = "[s] \"みんな、あけましておめでとう。\""
"10008010-11-アル" = "ふふっ。まあ、あけましておめでとう、と言っておこうかしら。"
"10008010-12-アル" = "ところで先生はどうしてここに？"
"10008010-13-カヨコ" = "何か面白そうなことないかな～って、ぶらぶらしてたとか？"
"10008010-14-カヨコ" = "シャーレの仕事の一環とかでしょ、お疲れ様。"
"10008010-15" = "[s] \"そんなところかな。それよりみんな、素敵な格好だね。\""
"10008010-16-アル" = "……ふふっ、さすがは先生ね。"
"10008010-17-アル" = "そう、この着物は最高級の素材が使われている上に、模様の一つ一つまで職人が手で縫いつけた逸品！そして全体的にバランスと調和が保たれつつも、存在感溢れるこのゴージャスなデザイン！"
"10008010-18-アル" = "この良さに気が付くだなんて、やはり我々便利屋68のパートナー！"
"10008010-19-アル" = "ま、普通にお店でレンタルしたやつだけどね。くふふっ♪"
"10008010-20-アル" = "ちょぉっ！？"
"10008010-21-アル" = "……。"
"10008010-22" = "[s1] \"どこの物だとしても、みんな似合ってると思うよ。\"\n[s2] \"それでも、みんなすごく可愛くて綺麗で良いね。\""
"10008010-23-ムツキ" = "へぇ～……。"
"10008010-24-ムツキ" = "へぇ～……。"
"10008010-25-アル" = "そうやってまたストレートな……。"
"10008010-26-ハルカ" = "あ、あああありがとうございます……！?"
"10008010-27-アル" = "ま、まあ！？今日のために揃えた戦闘服のようなものだから……！？"
"10008010-28" = "[s] \"戦闘服……？\""
"10008010-29-アル" = "と、とにかく！その、私たちはこのまま会場の方に行くけれど……。"
"10008010-30-アル" = "も、もし先生が良かったら、一緒にどうかしら……？"
"10008010-31-ムツキ" = "見た感じ、先生今日はひとりなんでしょ？一緒に行こうよ～！"
"10008010-32" = "[s] \"うん、喜んで。\""
"10008010-33-シノン" = "ハッピーニューイヤー！視聴者のみなさんおはようございます、そしてあけましておめでとうございます！"
"10008010-34-シノン" = "クロノス報道部所属、アイドルレポーターの[ruby=かわる]川流[/ruby]シノンです！"
"10008010-35-シノン" = "早速ですが、この場所がどこなのかご存じでしょうか！？"
"10008010-36-シノン" = "今やキヴォトスでも知らない人の方が少ないのでは、というほど有名な場所！"
"10008010-37-シノン" = "「願い事が叶う場所」として大人気な、あの「[ruby=だいきちでん]大吉殿[/ruby]」です！"
"10008010-38-シノン" = "さらに本日は特別なゲストとして、"
"10008010-39-シノン" = "「大吉殿」の管理人の方をお迎えしております！どうぞ！"
"10008010-40-亀島五郎" = "どうも、あけましておめでとうございます。「大吉殿」の管理を担当している者です。"
"10008010-41-シノン" = "本日はよろしくお願いします！"
"10008010-42-シノン" = "「大吉殿」は「願い事が叶う場所」として現在SNS上でかなり話題になっておりますが、そのことについてはどうお考えでしょうか？"
"10008010-43-亀島五郎" = "はっはっは。それが本当かどうか……という部分については、私共としても何とも申し上げにくい部分ではあるのですが。"
"10008010-44-亀島五郎" = "何はともあれそういった噂の結果として、これだけの方々が来てくださる。それだけみなさんが楽しんでくださっているというのは、嬉しいことだなと。それだけは確実に申し上げられますね。"
"10008010-45-シノン" = "なるほど、ありがとうございます！それでは続けてこの「大吉殿」そのものや、今回のイベントについて詳しくお伺いしたく……！"
"10008010-46-亀島五郎" = "そうですね。まず私共は、非常にインテリジェンスかつスマートな運営を――"
"10008010-47-暗黒街のドン" = "おや、ご無沙汰しております。先日は大変お世話になりましたな。"
"10008010-48-ギャングのボス" = "今年もどうにか、連邦生徒会の目を誤魔化すことができて何より……。"
"10008010-49-怪しい会社の社長" = "ところで、最近弊社で買収した業者についてなんですが……"
"10008010-50-どことなく凄そうな要人" = "なるほど。確かに先日締結した、山海経における建設契約の中にも何やら……"
"10008010-51" = "[s] \"すごい賑わってるね。\""
"10008010-52-アル" = "ふふっ、そうね。こうして騒々しい中でも牽制や推察、情報戦が行われているのよ。"
"10008010-53-アル" = "銃を撃っていないというだけで、今はもう既に戦闘中みたいなもの……。"
"10008010-54-アル" = "だから身だしなみには気を付けなさいね。私たちだって、今もかなり見られているわ。あちこちから熱い視線が感じられるでしょう？"
"10008010-55-ムツキ" = "そうでもないと思うけど？"
"10008010-56-アル" = "ま、まだ遠巻きに観察されてるだけよ。さあ先生、もっと胸を張りなさい。私たち便利屋68の後ろについてくると良いわ。ただ相手はいつどこから出てくるか分からないから、油断せず……"
"10008010-57-セリカ" = "あ、お手洗いはあちらになりまーす！"
"10008010-58-セリカ" = "おみくじはこちらで引けますよー！"
"10008010-59" = "[s] \"セリカ！\""
"10008010-60-セリカ" = "……"
"10008010-61-セリカ" = "せ、先生！？"
"10008010-62-セリカ" = "あ、あけましておめでとう……！"
"10008010-63-ムツキ" = "あら、あなたは……。"
"10008010-64-ムツキ" = "アビドスのバイトちゃんじゃーん！"
"10008010-65-セリカ" = "それに、便利屋68まで……？どうしてあんたたちがここにいるの？"
"10008010-66" = "[s] \"あけましておめでとう。セリカはここで、巫女さんのバイト？\""
"10008010-67-セリカ" = "あ、うん。ここの時給、結構良いんだよね。休みの日だからって遊んでばっかりいられないし、こういう時は稼ぎ時だから。"
"10008010-68" = "[s] \"頑張ってるね、お疲れ様。\""
"10008010-69-セリカ" = "えへへ……ま、まあ、褒めても何も出ないけど？"
"10008010-70-セリカ" = "ちょっと迷ったけど、ここまで時給が良いアルバイトもなかなか見つからなくってさ。"
"10008010-71-セリカ" = "……だから便利屋68。あんたたちが何を企んでるかは知らないけど、ここを爆発なんてさせたらタダじゃおかないからね。"
"10008010-72-アル" = "そ、そんなことしないわよ！？私たちのことを、暇さえあれば爆発させる面白集団とでも思ってるわけ！？"
"10008010-73-アル" = "私たちはただ、普通にここに来ただけで……！"
"10008010-74-セリカ" = "……ま、別に本気で疑ってるわけじゃないけどさ。"
"10008010-75-セリカ" = "とにかく、みんなお願い事をしに来たんでしょう？"
"10008010-76" = "[s] \"やっぱりそれ目的が多いの？\""
"10008010-77-セリカ" = "うん、SNSで流行ってることもあってね。"
"10008010-78-セリカ" = "ほら、案内するから。"
"10008010-79-セリカ" = "お賽銭ならこっちだよ。"
"10008010-80-ムツキ" = "ありがとー、バイトちゃん♪"
"10008010-81-セリカ" = "到着ー。"
"10008010-82-カヨコ" = "ものすごい列だね……"
"10008010-83-カヨコ" = "回ってくるまで結構時間かかりそう。"
"10008010-84-ムツキ" = "……ねぇねぇ。何かあの賽銭箱、変じゃない？思いっきり「金庫」って書いてあるけど？"
"10008010-85-セリカ" = "あー、何かここの管理人さんからの指示でって聞いた気がする。あまりにもたくさんの人がくるから、厳重に管理する目的で金庫を流用したとか何とか……？"
"10008010-86-アル" = "そ、そう……。"
"10008010-87-セリカ" = "何せその「願い事が叶う場所」って噂のせいで、こうして人の波がすごいことになってるし。"
"10008010-88-アル" = "……みんな、そういうの好きなのね。"
"10008010-89-セリカ" = "でも実際に「願い事を叶えてもらったから」って、お礼に来る人もいるんだよね。それも結構な数。"
"10008010-90-アル" = "そ、そうなの……！？"
"10008010-91-セリカ" = "まあ本当かどうかは知らないけど……私も後でバイト代が入って落ち着いた頃に、一度お願い事しに来るつもり。"
"10008010-92-セリカ" = "じゃあ私は戻るね。便利屋、あんまり暴れたりしないでよ？"
"10008010-93-セリカ" = "先生、また後でね。"
"10008010-94-アル" = "……。"
"10008010-95-会場のお客さんA" = "願いごと、本当に叶うのでしょうか……？"
"10008010-96-会場のお客さんB" = "私は信じますよ！実際に「叶った」って言ってる方も、結構いらっしゃいましたし……！"
"10008010-97-会場のお客さんA" = "確かに、私の周りにも……。"
"10008010-98-アル" = "ふ、ふーん……？"
"10008010-99-カヨコ" = "（アルちゃん、ソワソワし始めたね）"
"10008010-100-カヨコ" = "（……）"
"10008010-101-会場のお客さんC" = "ですがそれが本当なら、ある意味では危険とも言えます……。"
"10008010-102-会場のお客さんB" = "危険？どうしてです？"
"10008010-103-会場のお客さんC" = "かなりの数の方々が、お賽銭と同時に願いごとをしている……つまりあの賽銭箱には、相当な念が込められているはずです。"
"10008010-104-会場のお客さんC" = "それに、元々ここは幾つか曰く付きの場所でもあります。こういう場所ですから、「念」の強さというものは尚更です。そんな賽銭箱に、もし「穢れ」が付いたりしたら……"
"10008010-105-会場のお客さんA" = "「穢れ」が付いたりしたら……？"
"10008010-106-会場のお客さんC" = "蓄積された願いが丸っと裏返って、大変なことに……！"
"10008010-107-会場のお客さんB" = "いやいや、まさかそんなこと……。"
"10008010-108-会場のお客さんC" = "願いというのは表裏一体、願いと呪いの区別は難しいです。「人を呪わば穴二つ」という言葉もあるように、油断してはなりません……本当に「願い事が叶う場所」ならば、尚のこと……！"
"10008010-109-会場のお客さんA" = "……ごくり。"
"10008010-110-カヨコ" = "……気にしない方が良いよ？"
"10008010-111-アル" = "い、一体何のことかしら？"
"10008010-112-アル" = "私がそんな、何の根拠もないオカルト話に振り回されるとでも？"
"10008010-113-アル" = "よく考えてみなさい、単純な確率の話よ。"
"10008010-114-アル" = "これだけ大勢の人が集まれば、偶然願いが叶う人も、逆のことが起きる人もいるわ。"
"10008010-115-アル" = "だからそんな話がよく聞こえてきて、噂になってはまた広まっていく。それだけの事よ。"
"10008010-116-アル" = "あるいは逆に、ここを流行らせるためにわざとそういう噂を流したとも考えられるわ。"
"10008010-117-アル" = "それくらい分からなくて、私が社長をやっているとでも思って？"
"10008010-118-ムツキ" = "……。"
"10008010-119-ムツキ" = "へー……。"
"10008010-120" = "[ns] \"私たちの番だね。\""
"10008010-121-アル" = "ふふっ、ようやくね。"
"10008010-122-ハルカ" = "は、はいっ……！"
"10008010-123-ムツキ" = "……今更だけど、これって本当に意味あるの？"
"10008010-124-ムツキ" = "特に評判が上がるとも思えないし、人は多いしうるさいし。"
"10008010-125-カヨコ" = "まあ、アルが思い描いてたのとは色々違ってる気もするけど……せっかくここまで来たんだし、お願い事だけでもして帰れば良いんじゃない？"
"10008010-126-カヨコ" = "えっと……あった、5万円。"
"10008010-127-ムツキ" = "5万円！？"
"10008010-128-アル" = "か、カヨコ！？確かに大金を用意するようには言ったけれど、そこまでの金額を……！？"
"10008010-129-カヨコ" = "社長がこの金額で驚いてどうするのさ……。"
"10008010-130-カヨコ" = "元々新作のアルバムを買おうと思って貯めてたお金だけど。まあ新年の願い事にパッと使うのも、それはそれで悪くないかな。"
"10008010-131-カヨコ" = "……。"
"10008010-132-アル" = "あ、あぁっ……。"
"10008010-133-ハルカ" = "で、では次は私です！"
"10008010-134-ハルカ" = "ここ数カ月、深夜の工事現場で寝る間も惜しんで働いた……"
"10008010-135-ハルカ" = "30万円です！"
"10008010-136-ムツキ" = "いぃっ！？"
"10008010-137-カヨコ" = "！？"
"10008010-138-アル" = "な、何ですってぇ！？"
"10008010-139-ハルカ" = "私みたいなクズが役に立つには、これくらいしかできないので……。"
"10008010-140-ハルカ" = "一時は身体がガタガタになり、そのまま倒れてしまうかと思いましたが……。"
"10008010-141-ハルカ" = "それでも、こうしてお役に立てるだなんて……！嬉しいです！"
"10008010-142-ハルカ" = "ま、待っ――"
"10008010-143-ムツキ" = "いやー、綺麗に入ったね……。"
"10008010-144-カヨコ" = "……。"
"10008010-145-ハルカ" = "……。"
"10008010-146-ハルカ" = "……はい、お願いごと完了です！"
"10008010-147-ムツキ" = "えっと……ハルカちゃん、本当に大丈夫……？"
"10008010-148-ハルカ" = "だ、大丈夫、とは……？"
"10008010-149-ハルカ" = "とにかくお役に立てたのであれば、光栄ですが……。"
"10008010-150-アル" = "……。"
"10008010-151" = "[s] \"えっと、じゃあ私の番かな。\""
"10008010-152" = "[ns] 賽銭箱にお金を入れる。"
"10008010-153" = "[ns] \"……。\""
"10008010-154-ムツキ" = "じゃ、次はアルちゃんの番だよ。"
"10008010-155-アル" = "そ、そうね……！？"
"10008010-156-アル" = "……よし。"
"10008010-157-ムツキ" = "へぇ……。"
"10008010-158-ムツキ" = "なるほどねー。アルちゃんが何をしたかったのか、ちょっとだけ分かったかも。"
"10008010-159-カヨコ" = "そうだね、黙ってれば雰囲気は出てる。"
"10008010-160-カヨコ" = "あれで大金を投げたら、確かに威厳も感じられるかな。"
"10008010-161-ハルカ" = "アル様……素敵です……。"
"10008010-162-アル" = "……ふふっ。"
"10008010-163-アル" = "（ど、どうすれば良いのよこの状況ーーー！？）"
"10008010-164-アル" = "（5万円って、超大金じゃない！？カヨコ、自分の趣味を我慢してまでそんなお金を！？）"
"10008010-165-アル" = "（ハルカも30万円って何よ！？とんでもない金額じゃないの！？）"
"10008010-166-アル" = "（一時期毎朝のように顔色が悪かったのはそのせい！？そんなに頑張って稼いだお金を、あんな簡単に！？）"
"10008010-167-アル" = "（わ、私、5千円しか持ってきてないのに……！どうすれば……！？）"
"10008010-168-アル" = "（この空気の中で、5千円出すの！？社長の私が！？）"
"10008010-169-アル" = "……アルちゃん？"
"10008010-170-アル" = "（シュバッ！）"
"10008010-171-ムツキ" = "動きが速すぎて、アルちゃんのお賽銭がいくらなのか見えなかった……。"
"10008010-172-アル" = "……自分の金額を見たら、みんながプレッシャーを感じ過ぎると思ったから……とか？"
"10008010-173-ムツキ" = "ふーん……？まあ良いけど、アルちゃんはどんなお願いごとをするんだろうね？"
"10008010-174-アル" = "えっと……？"
"10008010-175-ムツキ" = "アルちゃん……？"
"10008010-176-アル" = "…………………っ！"
"10008010-177-ムツキ" = "アルちゃん、泣いてる……？"
"10008010-178-アル" = "（事業が潰れませんように、事業が潰れませんように、事業が潰れませんように、事業が潰れませんように、事業が潰れませんように、事業が潰れませんように……っ！！）"
"10008010-179-アル" = "（お願い！ほんっっっとにお願い！！ご利益あるんでしょう！？願えば叶うんでしょう！？）"
"10008010-180-アル" = "（こんなに大金を入れたんだから、何とかしなさいよーーーーー！！！！）"
"10008010-181-ムツキ" = "な、なんかすごい切実な感じだけど……何を願ってるんだろ？"
"10008010-182-アル" = "何となく分かる気がするけど……。"
"10008010-183-ムツキ" = "じゃあ、最後は私の番かな？"
"10008010-184-ムツキ" = "じゃじゃーん！1億円～～！"
"10008010-185-カヨコ" = "いやいやいや……。"
"10008010-186-ハルカ" = "いっ、1億円ですか！？すごいですっ！"
"10008010-187-アル" = "ええぇぇっ！？"
"10008010-188" = "[s] \"それって、ゲームとかの……？\""
"10008010-189-ムツキ" = "うん、そう！"
"10008010-190-ムツキ" = "お金をたくさん用意するのは大変だし、まあこれでも良いかなって思って。ボードゲームのお金をね。"
"10008010-191-ムツキ" = "くふふっ、それじゃあ……！"
"10008010-192-アル" = "ちょぉっと待ったあぁぁぁっ！！"
"10008010-193-ムツキ" = "ん？アルちゃん、どしたの？"
"10008010-194-アル" = "いや、その……ムツキ、それはマズいんじゃないかしら？"
"10008010-195-ムツキ" = "マズい？どうして？"
"10008010-196-アル" = "その、やっぱりきちんとした方が良いんじゃなくって……？ほら新年だし、あと、賽銭箱に穢れとか付くと良くないし……。"
"10008010-197-ムツキ" = "……穢れ？"
"10008010-198-アル" = "ね、願いごとが裏返ったりしたら、困るじゃない……？"
"10008010-199-ムツキ" = "あははっ！アルちゃん何言ってるの？"
"10008010-200-ムツキ" = "その話はさっき、自分で「オカルト話」って言ってたじゃ～ん？"
"10008010-201-ムツキ" = "大丈夫大丈夫、そんなこと起きっこないって。"
"10008010-202-ムツキ" = "まさか罰当たりなことをしたからって、賽銭箱が急に爆発したりしないだろうし――"
"10008010-203-アル" = "爆発したじゃないのよぉ！？"
