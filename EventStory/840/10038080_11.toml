[translation]
"10038080-1" = "第8話;幾度道を違えたとしても"
"10038080-2-カグヤ" = "京劇部長カグヤ、門主様に拝謁いたします。"
"10038080-3-キサキ" = "どうじゃ、カグヤ。#n玄龍門に代わって行なった業務は、性に合っておったか？"
"10038080-4-カグヤ" = "大変な部分も多いですが……なんとかなるのではないかと。"
"10038080-5-キサキ" = "そうさな……であれば、京劇部の名を変えるべきじゃろうな。#nじゃが、その場合、京劇はこの先誰が受け継ぐのじゃ？"
"10038080-6-キサキ" = "ああ……妾は其方の意向を知らなんだ。#n形骸化した玄龍門が京劇を演じれば良いのかえ？"
"10038080-7-カグヤ" = "……。"
"10038080-8-キサキ" = "聞こう。#n何を望んでおる？"
"10038080-9-キサキ" = "このまま、玄龍門の代わりになることが京劇部の目的かの？"
"10038080-10-カグヤ" = "滅相もないです。#n京劇部は京劇のために存在する部活ですので。"
"10038080-11-カグヤ" = "そして、その過程で山海経の伝統を守り受け継いでいこうと思っております。"
"10038080-12-キサキ" = "ほう。#n其方が語る山海経の伝統とは――何を指す？"
"10038080-13-カグヤ" = "この場で話せるものではないかと。"
"10038080-14-キサキ" = "ふむ、良いじゃろう。ならば代わりに妾が話してやろう。#nそれは――思想や行動様式ではないかえ？"
"10038080-15-カグヤ" = "……。"
"10038080-16-キサキ" = "道徳のない強者から弱者を守り、受けた恩を忘れず。#n正道を進むのが我らの誇りであろう？"
"10038080-17-カグヤ" = "何故、改め[ruby=わたくし]て私に[/ruby]尋ねるのでしょう？"
"10038080-18-キサキ" = "――其方に、信じてほしいからじゃ。"
"10038080-19-カグヤ" = "それは……どういうことでしょうか？"
"10038080-20-キサキ" = "妾の行動に疑問を持っているのじゃろう？#n其方も、玄龍門の一部も疑念を抱いておるのじゃろう？"
"10038080-21-キサキ" = "逆に問おう。其方らが守ってきた山海経の伝統は――そんな脆いものかえ？"
"10038080-22-カグヤ" = "！！"
"10038080-23-一同" = "！！！"
"10038080-24-キサキ" = "外部から新たな風が吹いてきたからと、根本からひっくり返るようなものかえ？"
"10038080-25-カグヤ" = "それ、は……！"
"10038080-26-キサキ" = "であれば――信じるのじゃ。"
"10038080-27-キサキ" = "其方自身を信じられないのなら、今まで連綿と受け継がれてきた歴史の重さを信じるが良い。"
"10038080-28-キサキ" = "山海経の歴史と伝統は、その程度で揺らぐほど浅くはないじゃろう？"
"10038080-29-カグヤ" = "門主様……！"
"10038080-30-キサキ" = "ふふ……最後に一つだけ問おう。#n山海経の伝統を破壊しているのは――妾か、カイか？"
"10038080-31-カグヤ" = "その答えは……明白かと。"
"10038080-32-キサキ" = "なればこそ――京劇部はこの道を開けるべきではないのかえ？"
"10038080-33-カグヤ" = "門主様が開けてくださるのなら、恐悦至極に存じます。"
"10038080-34-キサキ" = "ほう……面白いことを言うのう。"
"10038080-35-キサキ" = "それは本分の問題か、それとも実利の問題かえ？"
"10038080-36-カグヤ" = "――両方でございます。"
"10038080-37-キサキ" = "ふむ――申してみよ。"
"10038080-38-カグヤ" = "まず一つ。若返り現象には、原因がございます。"
"10038080-39-キサキ" = "ほう……？"
"10038080-40-キサキ" = "なるほど。薬の問題、じゃな。"
"10038080-41-カグヤ" = "私めの意向を汲んでいただき、身の置き所がありません。"
"10038080-42-キサキ" = "して、もう一つは？"
"10038080-43-カグヤ" = "……。"
"10038080-44-カグヤ" = "もう一度、門主様に申し上げます。"
"10038080-45-カグヤ" = "この場で、私を倒してくださいませ。"
"10038080-46" = "[s] \"えっ……！\""
"10038080-47-キサキ" = "……続けよ。"
"10038080-48-カグヤ" = "そうでなければ――門主の権威を取り戻すことは叶わないでしょう。"
"10038080-49-カグヤ" = "誰も門主様の命令に従おうとしないでしょうし――#n門主様の意思を理解しようとしないでしょう。"
"10038080-50-カグヤ" = "今は門主自ら令を下さねばなりません。#nそのために、御身のお力を発揮しなければならぬ時でございます。"
"10038080-51-キサキ" = "法道とは、力を見せぬために存在するものではあるが――"
"10038080-52-カグヤ" = "しかして、乱世には中々まかり通らないものでございます。"
"10038080-53-カグヤ" = "守るべきものはすぐに紙切れとなり、道理は無道徳な者の道具に成り下がる。"
"10038080-54-カグヤ" = "力を見せなければならない状況というのは悲劇です。#n私自身も、それをよく理解しております。"
"10038080-55-カグヤ" = "しかし――やむを得ない状況で、躊躇してはなりません。#n君主とはそういうものです。"
"10038080-56-カグヤ" = "歪んだ大地の上でも、正道を見つける必要があります。"
"10038080-57-カグヤ" = "巨悪を許してはなりません。"
"10038080-58-カグヤ" = "そうでなければ、人が人として生きていけなくなってしまいます。"
"10038080-59-カグヤ" = "そして……この場の反逆者は、他の誰でもない――私ですので。"
"10038080-60-カグヤ" = "銃を上げてください、門主様。#n躊躇ってはなりませぬ。"
"10038080-61-カグヤ" = "皆を導くべき立場にあるのは門主様ご自身である、と。#n天に轟くほどの声で宣言しなければならないのです。"
"10038080-62-カグヤ" = "君主の道とは、時に火薬と弾痕を覚悟せねばなりませぬ。"
"10038080-63-キサキ" = "――其方が、京劇を通して妾に諫言を伝えようとしたことを覚えておるぞ。"
"10038080-64-キサキ" = "それについては、どう思っているのじゃ？"
"10038080-65-カグヤ" = "今にして思えば、もっと慎重に事を成すべきであったと思っておりますが……。"
"10038080-66-カグヤ" = "それでも、諫言を申し上げたことに……一切の後悔はありません。"
"10038080-67-カグヤ" = "それが私の「忠義」であり、選んだ道ですので。"
"10038080-68-カグヤ" = "幾度時間を巻き戻したとしても……#n私は百度諫言し、千度投獄され、何度だろうと喜んで追放されましょう！"
"10038080-69-キサキ" = "ふふっ、面白いやつじゃのう。"
"10038080-70-キサキ" = "して――「忠義」を語る者に銃を向けろと？"
"10038080-71-カグヤ" = "……。"
"10038080-72-カグヤ" = "諫言を申し上げた当時の私と、今の私は違います。#nそれを区別していただかなければ。"
"10038080-73-カグヤ" = "今の私は反逆者です。その事実は変わりません。"
"10038080-74-カグヤ" = "反逆者は処分し、見せしめにすべきです。"
"10038080-75-カグヤ" = "そうでなければ筋が通りません。#n皆に正道を示せなくなってしまいます！"
"10038080-76-キサキ" = "それは、其方の意志で為したものではないじゃろうに。"
"10038080-77-カグヤ" = "……。"
"10038080-78-カグヤ" = "こんなことは申し上げたくなかったのですが……#nそうまで言われますと、私も生意気な口を開くしかなさそうです。"
"10038080-79-キサキ" = "聞こう、許す。"
"10038080-80-カグヤ" = "門主様ご自身も、自らの意志でその座に居るわけではないと存じます。"
"10038080-81-カグヤ" = "だというのに、すべての責務を、一人で背負おうとしているではありませんか。"
"10038080-82-カグヤ" = "私は、いつもそんな門主様を尊敬してきました。"
"10038080-83-カグヤ" = "そんな門主様が、山海経にいらっしゃってよかったと思っておりました。"
"10038080-84-カグヤ" = "門主様のために私の犠牲が必要であるのなら――千度やり直そうとも、喜んでこの身を御身に捧げましょう！"
"10038080-85-キサキ" = "それが――其方の道か？"
"10038080-86-カグヤ" = "ええ――私の道です。"
"10038080-87-キサキ" = "であれば――妾はその道を歩まぬ。"
"10038080-88" = "[ns] \"キサキ……！\""
"10038080-89-カグヤ" = "どういう……意味でしょうか？"
"10038080-90-キサキ" = "其方は、そこで見ているが良い。"
"10038080-91-キサキ" = "山海経の門主が――これから歩む道を。"
"10038080-92-カグヤ" = "門主様……？"
