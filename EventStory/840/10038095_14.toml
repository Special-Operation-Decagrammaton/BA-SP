[translation]
"10038095-1-サヤ" = "いつまでここに居ればいいのか、ずっと気が気じゃなかったのだ！ありがとうなのだ、門主……"
"10038095-2-キサキ" = "元気そうじゃのうサヤ。#nさて、時間がない。急ぐとしよう。"
"10038095-3-サヤ" = "急ぐって……どこに？"
"10038095-4-キサキ" = "それは無論――錬丹術研究会に、じゃ。"
"10038095-5-サヤ" = "えっ！？でも、門主……大丈夫なのか？"
"10038095-6-サヤ" = "身体は……無理をしすぎているのでは？"
"10038095-7-キサキ" = "ふふ……そんなことを気にしておったのか。"
"10038095-8-キサキ" = "今はそれよりも大事なことがあるじゃろうて。#nまずは、其方の錬丹術研究会を取り戻すのが先決じゃ。"
"10038095-9-キサキ" = "先に行くぞ。ついて来るがよい。"
"10038095-10-サヤ" = "も、門主！？門主！！待つのだ！"
"10038095-11-ミナ" = "どうかされましたか？"
"10038095-12-ミナ" = "門主様なら、絶対錬丹術研究会を取り戻してくださる。#n何をそんなに慌てる必要があるんだ？"
"10038095-13-サヤ" = "そ、それは……！"
"10038095-14-サヤ" = "いや……何でもないのだ！"
"10038095-15-サヤ" = "（門主の体の状態が心配だけど……）"
"10038095-16-サヤ" = "（錬丹術研究会を取り戻さなければ、薬が作れないのも事実なのだ……）"
