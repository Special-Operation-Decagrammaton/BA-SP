[translation]
"10038085-1-カグヤ" = "恐悦至極に、存じます……"
"10038085-2-キサキ" = "ご苦労じゃった、カグヤ。"
"10038085-3-キサキ" = "怪我人を治療せよ。#n特にカグヤの状態がよくない。安全な場所に移送し、手厚く看護するのじゃ。"
"10038085-4-キサキ" = "これらすべての裁決と処分は、事が終わった後に行うものとする。"
"10038085-5-一同" = "承知いたしました！"
"10038085-6-ミナ" = "玄龍門、集合！各々、やるべきことを為せ！"
"10038085-7-穏健派の玄龍門の構成員C" = "道は開けた！このチャンスを逃してはならない！"
"10038085-8-穏健派の玄龍門の構成員C" = "六和閣を取り返すぞ！門主様に仕えよ！"
"10038085-9-キサキ" = "ご苦労じゃった。ミナ。"
"10038085-10-ミナ" = "とんでもございません。やっと、お力になることができ、安心いたしました。"
"10038085-11-キサキ" = "……良いのか？我らは背水の陣じゃ。ひとたび失敗すれば、後はない。"
"10038085-12-ミナ" = "いざとなったら門主様を切り捨てて一人で生きる道を探せ、と？"
"10038085-13-キサキ" = "……。"
"10038085-14-ミナ" = "心配しないでください、とは言いません。#n門主様は、心優しいお方ですから。"
"10038085-15-ミナ" = "門主様が私を見捨てることはあっても、私が門主様を見限ることは絶対にありません。"
"10038085-16-キサキ" = "……そうか。"
"10038085-17-ミナ" = "さあ、次はどこに行きますか？#nやはり錬丹術研究会ですか？"
"10038085-18-キサキ" = "――地下牢へ参る。"
"10038085-19-ミナ" = "地下牢……ですか？"
