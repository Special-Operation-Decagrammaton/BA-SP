[translation]
"10038105-1-カイ" = "いったい、何故……？"
"10038105-2-キサキ" = "まだ分からないのか？#nならば、教えてやらねばなるまいな。"
"10038105-3-キサキ" = "其方が山海経で発生させ――我々が「若返り現象」と名付けたものを覚えておるか？"
"10038105-4-カイ" = "それは……身体年齢と構造を退行させ、子供時代に戻す……"
"10038105-5-カイ" = "まさか！？"
"10038105-6-キサキ" = "その通り。#nお陰様で、一番調子が良かった頃に戻っておる。"
"10038105-7-カイ" = "いつからだ……！？"
"10038105-8-キサキ" = "さて、いつからじゃろうな？"
"10038105-9-カイ" = "キサキ……！"
"10038105-10-キサキ" = "ふふ、墓穴を掘ったのう――[ruby=しんたに]申谷[/ruby]カイ。"
"10038105-11-キサキ" = "さて、どうする？#nこのまま騒動を引き起こすつもりであるのなら――"
"10038105-12-キサキ" = "いつまででも、付き合ってやろうぞ？"
"10038105-13-カイ" = "……。"
"10038105-14-カイ" = "私の負けだ――少なくとも、今回は。"
"10038105-15-カイ" = "それで――私をどう処分するつもりなのかお聞かせ願えるかね？"
"10038105-16-カイ" = "山海経で手に負えないから矯正局に送ったのだろう？"
"10038105-17-キサキ" = "……。"
"10038105-18-キサキ" = "そうさな、其方は山海経では手に負えぬ生徒じゃった……"
"10038105-19-キサキ" = "しかし、玄龍門の裁決は変わらぬ。"
"10038105-20-キサキ" = "其方は再び矯正局に移送され――更に厳重な場所へ収監されるじゃろう。"
"10038105-21-カイ" = "ククッ……変わらないね、キサキ。#n世間にはこんな言葉があるのを知っているかい？"
"10038105-22-カイ" = "同じことを繰り返しながら、違う結果を期待するのは――正気の沙汰ではない、ということを。"
"10038105-23-キサキ" = "……なんとでも言うがよい。"
"10038105-24-キサキ" = "其方がどこで何をしようとも、玄龍門は何度でも其方を相手しよう。"
"10038105-25-カイ" = "呆れた……ああ、興醒めだ。#nそれなら今度は先生に聞こうかね。"
"10038105-26" = "[s] \"うん？私？\""
"10038105-27-カイ" = "そう。先生には昔から興味があってねぇ。"
"10038105-28-カイ" = "話によれば、先生は[ruby=・   ・   ・   ・   ・   ・   ・   ・   ・]すべての生徒の味方[/ruby]になってくれる大人だというじゃないか。"
"10038105-29" = "[s] \"うん、そうだよ。\""
"10038105-30-カイ" = "それは――私にも当てはまるのかな？"
"10038105-31" = "[s] \"もちろん。\""
"10038105-32-カイ" = "ほう？"
"10038105-33-キサキ" = "先生……！"
"10038105-34" = "[s1] \"カイがこれ以上他の生徒を利用しないと約束してくれるのなら。\"\n[s2] \"私はいつでも、カイの味方になるよ。\""
"10038105-35-カイ" = "なるほど……条件つきか。"
"10038105-36-カイ" = "でも、先生。私は反省しないと思うがねぇ？"
"10038105-37" = "[s3] \"それならカイには「勉強」が必要だね。\"\n[s4] \"指導が必要になったら、私を呼んで。\""
"10038105-38" = "[ns] \"私はできれば……どんな生徒も諦めたくないから。\""
"10038105-39-キサキ" = "先生……"
"10038105-40-カイ" = "……。"
"10038105-41-カイ" = "ふむ……これも個人的な好奇心なのだが……"
"10038105-42-カイ" = "あくまで、仮定の話として。"
"10038105-43-カイ" = "どれほど無茶苦茶で、救いようがない生徒がいたとして――"
"10038105-44-カイ" = "決して反省などせず――そうさね、世間の表現を借りるのなら化け物同然の生徒がいたとして。"
"10038105-45-カイ" = "それでも先生は、同じ選択をするのかね？"
"10038105-46" = "[ns5] \"だとしても私は最善を尽くすよ。\"\n[ns6] \"私たちにはそれ以外できることがないから。\""
"10038105-47-カイ" = "それが本当に――万に一つも改善の見込みがない生徒だとしたら？"
"10038105-48" = "[s] \"一つだけお願いがある、カイ。\""
"10038105-49" = "[ns] \"君が、君自身を諦めないでほしい。\""
"10038105-50-カイ" = "……！"
"10038105-51-カイ" = "クッ、ククッ……ははははは！これは不意を突かれた！#nなるほど、ここでそう出るとは！"
"10038105-52-カイ" = "ははっ！ああ、構わないよ。私を捕まえると良い。#n先生の顔を立てて、ここは素直に従おう！"
"10038105-53-カイ" = "私自身を諦めないでほしい、か……ああ、楽しかった。本当に楽しかったよ。"
"10038105-54-キサキ" = "では、[ruby=しんたに]申谷[/ruby]カイ。其方には最後にやるべきことがある。"
"10038105-55-カイ" = "ああ、なんでも言うと良い。#n今の私はとても機嫌がいいからねぇ。"
"10038105-56-キサキ" = "山海経には若返り現象の完全な治療薬が必要じゃ。"
"10038105-57-カイ" = "ふむ……若返り現象が同化する性質を持っていたように、治療薬にも同じ性質を持つよう調剤もできる。"
"10038105-58-カイ" = "それを散布することは何の問題もない。すぐにでもできるよ。"
"10038105-59-カイ" = "ククッ……でもいいのかい？#n治療薬が広まれば、君も元の病弱な体に戻ってしまうんじゃないかね？"
"10038105-60-キサキ" = "些末な事じゃ。"
"10038105-61-キサキ" = "山海経が正常化し、月影祭を無事に開催できるのであれば――"
"10038105-62-キサキ" = "そうしない理由が、一体どこにあるというのじゃ？"
"10038105-63-カイ" = "……最後まで凡夫の一人でいるつもりなんだねぇ。"
"10038105-64-カイ" = "まあ、勝手にすれば良いさ。#nいつか君がこの選択を後悔したとしても――私は知らないよ。"
"10038105-65-キサキ" = "ああ、言うまでもないことじゃ。"
