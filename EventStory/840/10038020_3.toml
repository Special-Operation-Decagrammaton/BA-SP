[translation]
"10038020-1" = "第2話;噂"
"10038020-2-レイジョ" = "あ、先生。こちらです。"
"10038020-3" = "[s] \"レイジョが呼ぶなんて珍しいね。嬉しいよ。\""
"10038020-4-レイジョ" = "そう言っていただけて、私も嬉しいです。"
"10038020-5-レイジョ" = "さて……ここは桃源郷の最奥に位置する茶室でして――"
"10038020-6-レイジョ" = "玄武商会内部で話し合いをする際によく利用する場所なんです。"
"10038020-7" = "[s] \"だから、普段と雰囲気が違うんだね。\""
"10038020-8-レイジョ" = "はい。そしてここは防音室なので、私たちの話が外に漏れることはありません。"
"10038020-9-レイジョ" = "わざわざここに先生をお呼び立てしたのは……玄武商会の現状を内密に話すためです。"
"10038020-10-レイジョ" = "既にご存知かとは思うのですが――玄武商会は現在、人の立ち入りを制限しています。"
"10038020-11-レイジョ" = "会長が子供になってしまって……現在、玄龍門によって保護されています。"
"10038020-12-レイジョ" = "そのため……現在の玄武商会の責任者は、一時的に私になりました。"
"10038020-13-レイジョ" = "正直、私には荷が重いです。#n今だって胃が痛くて……昨日はあまり眠れなかったくらいです。"
"10038020-14-レイジョ" = "不幸中の幸いと言えばいいのかは分からないのですが……現在玄武商会全体が営業を停止しておりますので、商会を運営する必要がありません。"
"10038020-15-レイジョ" = "本当にそれが良い事かと問われると難しいところですが……。"
"10038020-16" = "[s] \"それはマズいんじゃないの！？\""
"10038020-17-レイジョ" = "はい……事態はかなり深刻です。#nまぁ、本当はそんなこともないんですが……ちょっとふざけてみました。"
"10038020-18-レイジョ" = "とはいえ、先生にはルミ会長が動けない現状と、山海経に流れている噂をお伝えしなければと思い……。"
"10038020-19-レイジョ" = "もちろん、先生が玄龍門に招かれて山海経にいるというのは承知しています。"
"10038020-20-レイジョ" = "ですが、玄武商会の現状については、おそらく玄龍門からは伝えられないと思いますので。"
"10038020-21-レイジョ" = "この後、玄龍門の幹部とのミーティングがありますよね？"
"10038020-22-レイジョ" = "その前に、こちら側の現状と視点をお伝えしたほうが、先生の判断材料が増えると思った次第です。"
"10038020-23" = "[s] \"ありがとう……今どうなってるのかは理解したよ。\""
"10038020-24-レイジョ" = "山海経の内部事情に巻き込む形になってしまって申し訳ございません。こういう表現はあまり好きではありませんが……このご時世ですので。"
"10038020-25-レイジョ" = "それと、巷ではとある生徒の噂が広まっておりまして……。"
"10038020-26" = "[s] \"その生徒って……もしかして[ruby=しんたに]申谷[/ruby]カイ？\""
"10038020-27-レイジョ" = "そう、ですが……。#nどうして先生がその名を……？"
"10038020-28" = "（キサキとの会話を話した）"
"10038020-29-レイジョ" = "そうだったのですね。#n門主様は……"
"10038020-30-レイジョ" = "……"
"10038020-31-レイジョ" = "はい。現在、主に3年生を中心に[ruby=しんたに]申谷[/ruby]カイの噂が広まっている状態です。"
"10038020-32-レイジョ" = "3年生が中心になっているというのが厄介で……1年生や2年生は、全く知らないかただの都市伝説だと思っているみたいなので心配はないのですが。"
"10038020-33-レイジョ" = "彼女の噂を皮切りに、不穏な噂が増えてきて――今、山海経は混乱の最中にあります。"
"10038020-34-レイジョ" = "それこそ、以前の交流会をやり玉にあげた噂もありますし……。"
"10038020-35-レイジョ" = "そうですね……具体的には――"
"10038020-36" = "そういえば、京劇部のカグヤ部長はどうなったんだろ？"
"10038020-37" = "表向きは自粛してるってことになってるけど……#n玄龍門に物申したから捕まってるっていう噂もあるよね。"
"10038020-38" = "でもさ……[ruby=しんたに]申谷[/ruby]カイが本当に帰ってきたなら……"
"10038020-39" = "門主様が何かしたかもしれないよね……"
"10038020-40" = "退学させられて、七囚人とまで呼ばれるほどの生徒が――"
"10038020-41" = "何事もなく、山海経に戻れるわけないし……"
"10038020-42" = "え、でも……カイを退学させたのって門主様だったんでしょ？"
"10038020-43" = "それも含めて何か裏があるんじゃない……？"
"10038020-44" = "なんか雲行き怪しいよね。このままで大丈夫なのかな。"
"10038020-45" = "玄龍門を信じていいの？門主様の考えてること分かんないんだけど……"
"10038020-46-レイジョ" = "こんな風に、噂を聞いた生徒が不安を漏らしていて……"
"10038020-47-レイジョ" = "3年生を中心に、玄龍門への不信感が募っている状態です。"
"10038020-48-レイジョ" = "……もちろん、私たち玄武商会と玄龍門はあまり仲が良くありません。それは事実です。"
"10038020-49-レイジョ" = "ですが、玄武商会の活動は、玄龍門が存在しているからこそ成立しているところがあるというのも事実。"
"10038020-50-レイジョ" = "私だってそれは理解しています。ただ、重箱の隅をつつくようなやり方と――"
"10038020-51-レイジョ" = "これは伝統に反しているだとか、山海経のプライドを捨てているだとか……#n逐一文句を口にしながら営業妨害をしてくるのが……本当に！"
"10038020-52-レイジョ" = "申し訳ございません、話が逸れました。#nはぁ……やっぱり、月影祭が近づいているからこんなことになっているのでしょうか……"
"10038020-53" = "[s] \"月影祭と何か関係あるの？\""
"10038020-54-レイジョ" = "そうですね……まず、先生は月影祭についてどの程度ご存知ですか？"
"10038020-55-レイジョ" = "なるほど……豊穣を祈願しその年の実りを祝う季節行事……#nそうですね。それが一般的な認識でしょう。"
"10038020-56-レイジョ" = "……ですが、月影祭には少し違った側面もあります。"
"10038020-57-レイジョ" = "月影祭の前後に、月に旅立った神仙が下界に下ってくるという伝説もありまして……"
"10038020-58" = "[s] \"神仙？\""
"10038020-59-レイジョ" = "普通の人が修行を重ねて悟りを開き……特別な存在になったものを神仙と呼びます。"
"10038020-60-レイジョ" = "月影祭には、神仙を称えるという側面もあるのですよ。"
"10038020-61-レイジョ" = "月に旅立った神仙がこの地に舞い戻り、下界を周遊した後、また旅に出るという伝説です。"
"10038020-62-レイジョ" = "そして――神仙がやってくると、奇妙な出来事が起こると言われているのです。"
"10038020-63-レイジョ" = "はい……今、山海経で起きている一連の現象は、月影祭と関係があるのではないか、と考える人が出てきたくらいです。"
"10038020-64-レイジョ" = "私個人としては、ただの迷信だと思っていましたが……。"
"10038020-65-レイジョ" = "ここまで立て続けに不可思議なことが起こると、そうなのではないかと少しだけ思ってしまいますね……"
"10038020-66" = "（レイジョから噂を聞いた後、すぐに玄龍門へ向かった）"
"10038020-67" = "（玄龍門での会議は混沌を極めていた）"
"10038020-68-玄龍門の構成員A" = "玄武商会への立ち入りを制限してもなお、若返り現象は広がり続けています……#n可及的速やかに対策が必要です！"
"10038020-69-玄龍門の構成員B" = "そもそも原因が判明しておりません！#n一体いつまで成果のあがらない調査を続ければよいのでしょうか。"
"10038020-70-玄龍門の構成員A" = "調査は難航するばかりか、終わりが見えず現場は疲弊しています。"
"10038020-71-ミナ" = "だが、少なくとも若返り現象が起こる生徒の急増は抑えられているだろう？#n無駄ではない。"
"10038020-72-玄龍門の構成員B" = "ですが……全生徒の状況を把握し、保護するのは物理的に不可能です。#n根本的な原因が判明していないのに、現象が収まるとは思えません！"
"10038020-73-玄龍門の構成員B" = "お願いします、門主様！#n月影祭の開催はどうか……！"
"10038020-74-ミナ" = "慎め！門主様の[ruby=ごぜん]御前[/ruby]だぞ！"
"10038020-75-ミナ" = "――構わぬよ。今は現場の話を聞く時じゃろうて。"
"10038020-76-キサキ" = "それに状況が状況じゃ。焦るのも無理はない。"
"10038020-77-キサキ" = "――続けるがよい。"
"10038020-78-玄龍門の構成員A" = "はっ！他にも、不吉な噂が広まり続けておりまして……"
"10038020-79-玄龍門の構成員B" = "ただの噂だけであれば問題ないのですが、一部の生徒の間では今の玄龍門を疑問視する声もあがっており……"
"10038020-80-玄龍門の構成員A" = "京劇部の自粛とカグヤの行方の件も相まって、玄龍門に疑念を抱く生徒が増えてきています。"
"10038020-81-玄龍門の構成員B" = "以前よりも業務がやりにくくなっています……ふとした瞬間に敵意や冷たい視線を向けられるといいますか……"
"10038020-82-キサキ" = "ふむ……それは問題じゃのう。#nして、此度の事態に関して、其方らの意見はどうじゃ？"
"10038020-83-玄龍門の構成員A" = "……"
"10038020-84-玄龍門の構成員B" = "……非常に、申し上げにくいのですが。"
"10038020-85-キサキ" = "良い、許す。"
"10038020-86-玄龍門の構成員A" = "今回の月影祭は山海経のみで行なうべきかと。"
"10038020-87-ミナ" = "それは……！"
"10038020-88-玄龍門の構成員B" = "ミナ執行部長……残念ながら、現在多くの生徒が今回の原因を他校生のせいにしています。"
"10038020-89-キサキ" = "……"
"10038020-90-玄龍門の構成員A" = "このような状況で例年通り月影祭を行えば、今度こそ玄龍門に対して反抗する生徒が出ることでしょう。"
"10038020-91-玄龍門の構成員B" = "も、もちろん例年通り開催し、今の山海経には問題などないとアピールすることもできるでしょう。ですが……"
"10038020-92-玄龍門の構成員A" = "……"
"10038020-93-キサキ" = "――既に存在する問題に蓋をすることはできぬ、ということじゃな。"
"10038020-94-キサキ" = "であれば、それを認め――策を講じる必要がある。"
"10038020-95-ミナ" = "門主様……！"
"10038020-96-玄龍門の構成員B" = "そ、それは……その……！"
"10038020-97-キサキ" = "妾の憶測が間違っておるかの？"
"10038020-98-玄龍門の構成員B" = "い、いえ。むしろ、ここまで丁寧に汲み取ってくださり感謝いたします。#nですが……"
"10038020-99-キサキ" = "――それだけでは足りぬということじゃな。あい分かった。"
"10038020-100-キサキ" = "……"
"10038020-101-キサキ" = "では――此度の月影祭は、山海経のみで行なう事とする。#nよって――外部の立ち入りの一切を禁じる。"
"10038020-102-玄龍門の構成員A" = "門主様！"
"10038020-103-玄龍門の構成員B" = "門主様……！"
"10038020-104-キサキ" = "また、玄武商会への立ち入り制限は現状のままとする。#nただし、保護された後、無事を確認できた生徒には通行の自由を許す。"
"10038020-105-ミナ" = "……"
"10038020-106-キサキ" = "空言に対しては毅然とした態度で接すれば良いが、万に一つということもある。"
"10038020-107-キサキ" = "そして、現時刻より――山海経全土の警備を強化せよ。"
"10038020-108-キサキ" = "以上を玄龍門の門主、[ruby=りゅうげ]竜華[/ruby]キサキの裁決とする。"
"10038020-109-玄龍門の構成員B" = "承知いたしました、門主様！"
"10038020-110-玄龍門の構成員B" = "直ちに公表いたします！"
"10038020-111-ミナ" = "本当に、これでよろしかったのですか……？"
"10038020-112-キサキ" = "うむ。今は現場の声を優先すべきじゃろうて。"
"10038020-113-キサキ" = "……"
"10038020-114-キサキ" = "どれ、視察に行くとするかの。#nミナ、支度を。"
"10038020-115-ミナ" = "……！？い、いけません門主様！#n現場が混乱いたします……！今はお控えを。"
"10038020-116-キサキ" = "――それは[ruby=このえ]近衛[/ruby]ミナとしてか、それとも執行部長としての意見か。どちらじゃ？"
"10038020-117-ミナ" = "……！"
"10038020-118-ミナ" = "――執行部長としての諌言です。"
"10038020-119-ミナ" = "我々の部下である構成員を……そして玄龍門を、信じていただきたく。"
"10038020-120-キサキ" = "……そうか。"
"10038020-121-キサキ" = "あい分かった。であれば、妾は私室に戻る。#n何かあったらすぐに知らせるのじゃぞ。"
"10038020-122-ミナ" = "はい、門主様。"
"10038020-123-ミナ" = "はああああ……"
"10038020-124" = "[s] \"お疲れ、ミナ……。\""
"10038020-125-ミナ" = "ふっ……この程度は日常茶飯事だ。"
"10038020-126" = "[s] \"こんな時でもいつも通りでいられるのはすごいことだよ。\""
"10038020-127-ミナ" = "え、えっ……？"
"10038020-128-ミナ" = "そ、そんな事を言われても別に嬉しくなどないぞ？"
"10038020-129-ミナ" = "あくまでも私は粛々と、ハードボイルドに任務を遂行するだけだからな。"
"10038020-130-ミナ" = "では私も部屋に戻るとしよう。#n断じて疲れているわけではないからな！"
"10038020-131-ミナ" = "ふっ、分かっていてくださったか。#nやはり先生は私の理解者だな。それでは、失礼する。"
"10038020-132-ミナ" = "伝え忘れていたが、先生も……一応、外部の人間になる。#nだから、その……"
"10038020-133-ミナ" = "ええと……"
"10038020-134-ミナ" = "……しばらくは、あまり目立たないようにすることだな。"
"10038020-135-ミナ" = "そうだな……誰かと長く通話をするだとか――"
"10038020-136-ミナ" = "門主様がお忍びで出ていったとしても、それについて行ったりするだとか……。"
"10038020-137" = "[s1] \"そっか、今の山海経はかなり不安定だもんね。\"\n[s2] \"できるかぎり善処するけど、どうしようもない時はごめんね。\""
"10038020-138-ミナ" = "すまない……力及ばず面目ない。"
"10038020-139-ミナ" = "先生が善処してくださっても、どうにもならない時もある……それだけは理解していてくれ。"
"10038020-140-ミナ" = "わかっているからゆっくり休んで来い？い、言ったな！#n私は断じて疲れているから席を外すわけでは……！"
"10038020-141-ミナ" = "分かった……！分かったから押さないでくれ！"
"10038020-142" = "（人がいなくなると急に部屋が静かに感じられる……）"
"10038020-143" = "（端末を取り出したものの、今はどこかに連絡をとるのは控えるべきだろう）"
"10038020-144" = "（そういえば……）"
"10038020-145-玄龍門の構成員" = "現状、「若返る」以外の現象はまだ観察されておりません。また、例外的に訓育支援部、梅花園の園児は影響を受けないとのことです！以上です！"
"10038020-146-ミナ" = "だが、少なくとも若返り現象が起こる生徒の急増は抑えられているだろう？#n無駄ではない。"
"10038020-147" = "[ns] \"これって……もしかして。\""
"10038020-148" = "（ふと、一人生徒の顔が浮かぶ）"
"10038020-149" = "（通話は避けるべきだろう。そっとモモトークを開いた）"
"10038020-150" = "[ns] \"「お疲れ様、シュン。今何してるの？」と送る……。\""
"10038020-151-シュン" = "「あら、先生？ご無沙汰しております」"
"10038020-152-シュン" = "「先生からご連絡いただけるなんて……今日は良いことがあるかもしれませんね」"
"10038020-153-シュン" = "「そういえば、いま山海経にいらっしゃってるのですよね？お時間があればぜひ梅花園にお立ち寄りください」"
"10038020-154" = "[s] \"「行きたいのは山々なんだけど、ちょっと事情があってね……」\""
"10038020-155-シュン" = "「事情、ですか……？」"
"10038020-156" = "（シュンに今の状況と玄龍門で起きていることを説明した）"
"10038020-157-シュン" = "「……」"
"10038020-158-シュン" = "「そうだったのですね。そんなことが……」"
"10038020-159-シュン" = "「ふふっ、私にいい案があります。少々お待ちいただけますか？」"
"10038020-160-シュン" = "「先生がこうしてモモトークでご連絡くださって良かった」"
"10038020-161" = "[s] \"「ん？どういう意味？」\""
"10038020-162-シュン" = "「少々お待ち下さいね。すぐに分かりますから」"
"10038020-163" = "？"
"10038020-164-シュエリン" = "こんにちは、先生！"
"10038020-165" = "[ns] \"シュ……シュエリン！\""
"10038020-166-シュエリン" = "はい！先生のシュエリンです！"
"10038020-167-シュエリン" = "ふふっ。玄龍門といえども、梅花園の園児を無碍に扱うことはできませんから。#nなので、私の方からお伺いしたんです。"
"10038020-168-シュエリン" = "あ！私が梅花園の園児かどうかは、気にするところではありませんからね？"
"10038020-169-シュエリン" = "どうしてシュエリンの姿なのかは……その……"
"10038020-170-シュエリン" = "私も「若返り現象」の影響で……。"
"10038020-171-シュエリン" = "あ、大丈夫です！ココナちゃんにはまだ見つかってませんし、他の園児にも気づかれていません。"
"10038020-172-シュエリン" = "しかし、子供の身体は良いですね。#n肩こりもないですし、身体も軽くて……！"
"10038020-173-シュエリン" = "あ、でもこんなことをしている場合じゃありません！#n門主様をお助けしないと。"
"10038020-174-シュエリン" = "何をするつもりかは……ふふ、見てのお楽しみです。"
"10038020-175-キサキ" = "本当に……シュン教官なのか？"
"10038020-176-シュエリン" = "はい。何度も確認した通り、私はシュンです。"
"10038020-177-キサキ" = "ああ……たしかに、シュン教官しか知り得ない事を知っておる。#nじゃが、それでもにわかには信じ難い。"
"10038020-178-キサキ" = "それに……其方、そのような性格じゃったか？"
"10038020-179-シュエリン" = "えっ！？わ、私は元からこうですよ……？"
