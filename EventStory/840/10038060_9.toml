[translation]
"10038060-1" = "第6話;遠い未来の私たち"
"10038060-2-レイジョ" = "……狭くないですか、先生？"
"10038060-3" = "[s1] \"私は大丈夫だけど。\"\n[s2] \"キサキとミナ……ルミは？\""
"10038060-4-レイジョ" = "3人……いえ、2人と1人のことならご心配なく。#n玄武商会で一番安全な場所に案内済みです。"
"10038060-5-レイジョ" = "先生も、後ほどそちらにご案内いたします。"
"10038060-6-レイジョ" = "それに、門主様に借りを作ることができたのですから、悪いことばかりではありません。"
"10038060-7-レイジョ" = "すべては無事に……門主様が元の座を取り戻されてからにはなりますが。"
"10038060-8" = "[s] \"外はどんな感じになってるの？\""
"10038060-9-レイジョ" = "はい。まず、ルミ会長はまだ若返り現象から戻っておりません。"
"10038060-10-レイジョ" = "同様の現象に陥っている生徒は皆、あまり出歩けない状態になってしまっています。"
"10038060-11-レイジョ" = "特に、会長のように顔が広い生徒はなおさら。"
"10038060-12-レイジョ" = "ですが、玄武商会の情報網は未だ健在ですので、ここにいても外部の情報を得ることはできます。"
"10038060-13-レイジョ" = "そして、玄龍門の現状ですが……"
"10038060-14-レイジョ" = "玄龍門内外で、門主様に対する批判……というか、非難の声が大きくなっているようで。"
"10038060-15-レイジョ" = "ええ……私も最初は自分の耳を疑いました。"
"10038060-16-レイジョ" = "もちろん、すべての玄龍門の構成員がそうではありませんが、強硬派の構成員を中心にキサキ門主に対しての疑問や非難の声が上がっているそうです。"
"10038060-17-レイジョ" = "彼女たちが問題視しているのは、門主様が今の座――"
"10038060-18-レイジョ" = "他の学園でいうところの、生徒会長に就いた経緯についてです……"
"10038060-19-強硬派の玄龍門の構成員" = "そもそも、キサキ門主の擁立そのものがおかしかったのです！"
"10038060-20-強硬派の玄龍門の構成員" = "本来、門主は3年生が担うもの。#nだというのに、キサキ門主は2年生で門主の座に就きました！"
"10038060-21" = "結果、キサキ門主が伝統を破って門主の座に就いたのではありませんか！"
"10038060-22-穏健派の玄龍門の構成員" = "ですがそれは……玄龍門の推戴によるものではありませんか？"
"10038060-23-穏健派の玄龍門の構成員" = "それに、そうなった原因は前門主が失脚したからですし……"
"10038060-24-穏健派の玄龍門の構成員" = "門主の失脚は、本来起きてはならない不祥事……致し方のないことではありませんか。"
"10038060-25-強硬派の玄龍門の構成員" = "結果、キサキ門主が伝統を破って門主の座に就いたのではありませんか！"
"10038060-26-強硬派の玄龍門の構成員" = "言い換えれば、キサキ門主は最初から伝統に反していたと言えます！"
"10038060-27-穏健派の玄龍門の構成員" = "伝統に反すると分かっていても、満場一致の決定だったではありませんか。#nいまさらそれを蒸し返すのですか？"
"10038060-28-強硬派の玄龍門の構成員" = "だからこそ！最初からおかしかったこれらを正す時が来たのではありませんか！"
"10038060-29" = "[ns] \"キサキには伝えないほうがいいんじゃないかな……。\""
"10038060-30-レイジョ" = "伝えなければ、後で「なぜ、早く伝えなかったのか」と仰るかと。"
"10038060-31-レイジョ" = "「そもそも門主たるもの、どのような評価も受け入れるべきじゃからの」と仰ると思いますよ。"
"10038060-32-レイジョ" = "え、今の似てました？#nそうですか……ありがとうございます。"
"10038060-33-レイジョ" = "……先生は本当にとても接しやすい方ですね。"
"10038060-34" = "[s] \"私は生徒の味方だからね！\""
"10038060-35-レイジョ" = "私としては、先生とどう接すればいいのか悩んでしまいますが……。"
"10038060-36-レイジョ" = "な、何でもありません。#n話を続けましょう。"
"10038060-37-レイジョ" = "これらの騒動を巻き起こした張本人の錬丹術研究会――[ruby=しんたに]申谷[/ruby]カイは、自分で事件を起こしておいて、後のことにはさほど興味がないようでした。"
"10038060-38-カイ" = "ほう？玄龍門で[ruby=こうろんおつばく]の甲論乙駁が[/ruby]、想定以上に激しくなっている……？"
"10038060-39-カイ" = "――キサキ門主がいない今、玄龍門と山海経をどのように統治すべきか。"
"10038060-40-カイ" = "そして、キサキ門主を主として戴き続ける正統性があるのか？"
"10038060-41-カイ" = "はぁ……それって、仙丹と関係があるのかね？"
"10038060-42-カイ" = "そんな巷説に付き合う暇があるのなら、仙丹の完成に尽力すべきだよ。"
"10038060-43-カイ" = "材料も加工も足りず――なにより、[ruby=まんねんじん]萬年参[/ruby]の数が圧倒的に足りていない。"
"10038060-44-カイ" = "足りないものがあれば玄龍門に要請を。それでも足りなければ玄武商会にも。#n私は研究室に戻らせてもらうよ。"
"10038060-45-カイ" = "まったく――役立たずばかりだ。"
"10038060-46-レイジョ" = "……その関係で、半ば活動が止まっている玄武商会にも錬丹術研究会から圧力をかけられている状況です。"
"10038060-47-レイジョ" = "「普段の山海経」であれば、こうした事態の仲裁をするのが玄龍門の役割ですが……今は……。"
"10038060-48-強硬派の玄龍門の構成員" = "玄武商会も責任から逃れることはできません！"
"10038060-49-強硬派の玄龍門の構成員" = "今回の一件も、玄武商会を筆頭とする「外部勢力」が！"
"10038060-50-強硬派の玄龍門の構成員" = "商会に立ち入り制限を課したことを恨み、わざと月影祭を中止に追い込もうとこのような騒動を起こしたに違いありません！"
"10038060-51-強硬派の玄龍門の構成員" = "それは行き過ぎた憶測ではありませんか……？#n証拠はあるのですか？"
"10038060-52-強硬派の玄龍門の構成員" = "ここにいる皆さんも、いま一度ご自身の立ち位置を見直してみてください！#n自分が山海経の伝統を守る玄龍門の味方なのか、それとも他の味方なのか！"
"10038060-53-強硬派の玄龍門の構成員" = "門主の座が一時的に空いているいま、我々が玄龍門と山海経を守らねば、誰が守るというのです！"
"10038060-54-穏健派の玄龍門の構成員" = "……すべてが混乱の渦中にあるので、試金石が必要だというのは同意します。"
"10038060-55-穏健派の玄龍門の構成員" = "ですが、誰を擁立すれば良いのですか……？"
"10038060-56-強硬派の玄龍門の構成員" = "我々が今もっともすべきことは――伝統を重んじる立場に立ち戻ることです。"
"10038060-57-穏健派の玄龍門の構成員" = "どのように……？"
"10038060-58-強硬派の玄龍門の構成員" = "最も山海経の伝統に携わっている部活や人物を当たってみるのが最適かと。"
"10038060-59" = "[ns] \"玄龍門がキサキの代わりを探そうとしている……？\""
"10038060-60-レイジョ" = "……"
"10038060-61-レイジョ" = "正直に言えば、そもそも私は玄龍門についてあまり良い感情を持っていません。"
"10038060-62-レイジョ" = "しかし、山海経に玄龍門が必要不可欠であることは認めています。#nそれはおそらく、今後も変わることはないでしょう。バランスを維持するのに必要なのですから。"
"10038060-63-レイジョ" = "そんな玄龍門が「伝統」に反しているからと、キサキ門主様を追い出そうとするなんて……"
"10038060-64" = "[s] \"……。\""
"10038060-65" = "[ns] \"さっきの話を続けてもらえる？\""
"10038060-66-レイジョ" = "分かりました。現状手に入れた情報は、一通りお伝えできたかと。"
"10038060-67-レイジョ" = "結局、玄龍門の強硬派は――キサキ門主の代わりを見つけるということに、ほとんど合意しました。"
"10038060-68-穏健派の玄龍門の構成員" = "京劇部、ですか……？"
"10038060-69-強硬派の玄龍門の構成員" = "……総合的に考えて、京劇部が最適ではありませんか？#n山海経の伝統そのものである京劇を守り続けている部活ですから。"
"10038060-70-強硬派の玄龍門の構成員" = "そして、京劇自体が体力を必要としますし、カグヤの厳しい鍛錬を耐え抜いた京劇部の戦闘力は山海経の中でも屈指のレベルです。"
"10038060-71-穏健派の玄龍門の構成員" = "ですが、果たしてそれは正しいといえるのでしょうか……。#nそれが本当に、伝統を守った決定だと言えるのですか？"
"10038060-72-強硬派の玄龍門の構成員" = "……。"
"10038060-73-強硬派の玄龍門の構成員" = "私はこう思います。"
"10038060-74-強硬派の玄龍門の構成員" = "それを判断するためにも――カグヤを釈放し、意見を聞いてみるべきだと。"
"10038060-75" = "[ns] \"なんだか雲行きが怪しくなっているね。\""
"10038060-76-レイジョ" = "この風向きについて、どう考えていくべきなのか……私にも分かりません。"
"10038060-77-レイジョ" = "だから、先生にご相談したく。"
"10038060-78-レイジョ" = "あ、とはいっても、そこまで重たく捉える必要はありません。"
"10038060-79-レイジョ" = "それに、こうしてお話を聞いていただいただけでも、十分すぎるくらいですから。"
"10038060-80" = "[s5] \"そうだね……私個人の意見としては……。\"\n[s6] \"これはあくまで個人的な意見だから、聞き流してほしいんだけど。\""
"10038060-81-レイジョ" = "ありがとうございます、先生。#nあ、授業みたいにしてみますか？"
"10038060-82-レイジョ" = "起立、礼、着席の号令をしましょうか？#nあ、いらないですか……すみません。"
"10038060-83-レイジョ" = "「権力の空白」、ですか？聞いたことはありますが……。"
"10038060-84-レイジョ" = "……なるほど。#n普通は権力が消えたところに、野心家が入り込むさまを指すけれど――"
"10038060-85-レイジョ" = "第三者が一人を擁立し、そのポジションに押し上げることもある……。"
"10038060-86-レイジョ" = "権力、つまり権限とは――責任とその所在の話。"
"10038060-87-レイジョ" = "そうですね……事件や騒動というのは無くならず、それに対する責任の所在追及は必ず発生するもの。"
"10038060-88-レイジョ" = "そして、誰かが最終的な責任を負い、裁決を下さなければならない……"
"10038060-89-レイジョ" = "そういう意味では、野心家がその場におさまってくれた方が、個人としては幸せに過ごせるかもしれない……そうですね。"
"10038060-90-レイジョ" = "少なくとも、野心家個人としては、あふれる名利への渇望と欲望を満たすことができるでしょう。"
"10038060-91-レイジョ" = "でも、個人の意思ではなく周囲の推戴でその地位に就くことになってしまったのなら、それは……。"
"10038060-92-レイジョ" = "……。"
"10038060-93-レイジョ" = "私の知っているカグヤ部長は、少なくとも野心家ではありません。"
"10038060-94-レイジョ" = "ただ頑固で融通が利かない――どちらかといえば、職人や芸術家に近いタイプです。"
"10038060-95" = "[s7] \"うん。だから、もしもカグヤが「推戴」されてしまったら。\"\n[s8] \"それは……。\""
"10038060-96-レイジョ" = "……そうですね。"
"10038060-97-レイジョ" = "それはおそらく――私たち全員にとっての……悲劇になりえるかもしれません。"
"10038060-98-強硬派の玄龍門の構成員" = "釈放です。出てきてください、カグヤ部長。"
"10038060-99-カグヤ" = "唐突ですね。これは門主様の裁決ですか？"
"10038060-100-穏健派の玄龍門の構成員" = "……"
"10038060-101-強硬派の玄龍門の構成員" = "……[ruby=・   ・   ・]玄龍門[/ruby]の、裁決です。"
"10038060-102-カグヤ" = "その真意を伺っても？"
"10038060-103-強硬派の玄龍門の構成員" = "事情説明は後ほど。とりあえず今は、ここを出ましょう。"
"10038060-104-強硬派の玄龍門の構成員" = "……以上が、山海経で起こった騒動の経緯です。"
"10038060-105-カグヤ" = "ちょ、ちょっと待ってください。#nつまり……門主様が行方をくらまし、[ruby=しんたに]申谷[/ruby]カイが戻ってきて錬丹術研究会を動かし……いえ、その前に！"
"10038060-106-カグヤ" = "若返り現象のせいで玄武商会は事実上の営業停止……？"
"10038060-107-カグヤ" = "その上、月影祭さえも開催できるかどうかもわからない……？"
"10038060-108-カグヤ" = "どうして、このような事態に……！？"
"10038060-109-穏健派の玄龍門の構成員" = "……。"
"10038060-110-カグヤ" = "――カグヤ部長。#nこの混乱と無秩序を正すためにも、一時的にで構いません。"
"10038060-111-強硬派の玄龍門の構成員" = "玄龍門は、最も山海経の伝統を守り抜ける集団が必要だと結論づけました。"
"10038060-112-カグヤ" = "それが――京劇部である、と。"
"10038060-113-穏健派の玄龍門の構成員" = "そうです。"
"10038060-114-カグヤ" = "光栄に思います。#nところで…[ruby=わたくし]…私を[/ruby]この場に呼んだのは、別の理由があるように見えますが。"
"10038060-115-強硬派の玄龍門の構成員" = "ええ――単刀直入に申し上げましょう。"
"10038060-116-強硬派の玄龍門の構成員" = "一時的で構いません――門主の座にお上がりください。"
"10038060-117-穏健派の玄龍門の構成員" = "……！"
"10038060-118-カグヤ" = "今の山海経には伝統と秩序が必要です。#n以前の尋問の通りであれば、あなたも[ruby=しんたに]申谷[/ruby]カイの一時的な復学には賛成だと聞いております。"
"10038060-119-強硬派の玄龍門の構成員" = "そして、現在その条件は満たされており――#nともすれば、あなたの望み通りの山海経に導くこともできるでしょう。"
"10038060-120-穏健派の玄龍門の構成員" = "……"
"10038060-121-レイジョ" = "門主様と会長にどう伝えれば良いのでしょう……。"
"10038060-122" = "[s] \"……私が何とかしてみるよ。\""
"10038060-123-レイジョ" = "ありがとうございます。#nですが……問題は山積みです。私たちは、これから様々な可能性を念頭に置いて次の一手を考えなければなりません。"
"10038060-124-レイジョ" = "カグヤ部長がその座に就くことに関しても、問題が無いわけではありません。"
"10038060-125-レイジョ" = "正統性という観点で、議論の余地が生まれるのは明白かと。"
"10038060-126-レイジョ" = "そうですね……現状、正統性を確保できるのは、[ruby=しんたに]申谷[/ruby]カイだけでしょう。"
"10038060-127-レイジョ" = "キサキ門主様を今の状況に追いやった元凶ですし……その……当人としてもまだ情状酌量の余地がある事情を持っています。"
"10038060-128-レイジョ" = "……本来であれば、卒業生となっていた人ですから。"
"10038060-129-レイジョ" = "ですが、錬丹術研究会はこの問題から手を引くことにしたようで。#n少なくとも[ruby=しんたに]申谷[/ruby]カイがその資格を――"
"10038060-130-レイジョ" = "どんな形であれ、玄龍門……あるいは他の部活に移管する意思を示してくれていたら、もっとスムーズに事が進んでいたのかもしれません。"
"10038060-131-レイジョ" = "ですが、現状は……"
"10038060-132" = "[s] \"結局、カグヤの選択次第だね。\""
"10038060-133-レイジョ" = "はい……"
"10038060-134-レイジョ" = "その選択にすべてがかかっていると言っても過言ではありません。"
"10038060-135-カグヤ" = "――理解しました。"
"10038060-136-カグヤ" = "山海経の現状も……いま、必要としているのが伝統の維持と秩序の修復というのも。"
"10038060-137-強硬派の玄龍門の構成員" = "それでは……！"
"10038060-138-穏健派の玄龍門の構成員" = "……。"
"10038060-139-カグヤ" = "……。"
"10038060-140-カグヤ" = "――お断りします。#n門主の座に就くことだけは、決してできません。"
"10038060-141-強硬派の玄龍門の構成員" = "なぜですか！？"
"10038060-142-穏健派の玄龍門の構成員" = "……！"
"10038060-143-カグヤ" = "玄龍門は今――私と京劇部に、山海経の伝統を守るために伝統を破壊しろという矛盾した要請をしているからです。"
"10038060-144-強硬派の玄龍門の構成員" = "そ、それは……！"
"10038060-145-カグヤ" = "そして、キサキ門主様の行方が明らかになっていないのに私がその座に就くのは、#n反逆に他ならず、忠義に反しております。"
"10038060-146-穏健派の玄龍門の構成員" = "（カグヤ部長……）"
"10038060-147-カグヤ" = "私はあくまで、京劇を公演する女優でしかありません。#nそれは部員たちも同じこと。"
"10038060-148-カグヤ" = "私が部員を厳しく鍛錬してきたのは事実ですが……それはあくまで京劇のためでしかありません。"
"10038060-149-カグヤ" = "ひいては「山海経」のためであり――それ以外の意図はありません。"
"10038060-150-カグヤ" = "私が利己的な思いでこのようなことを行なっていたのであれば――#n天罰を受け、退学処分となったとしても甘んじて受け入れます。"
"10038060-151-強硬派の玄龍門の構成員" = "しかし、今の山海経は……！"
"10038060-152-カグヤ" = "……ええ。おっしゃりたいことも、玄龍門の立場も理解しております。"
"10038060-153-カグヤ" = "たしかに、この状況が続けば山海経に通う全ての生徒に被害が及ぶでしょう……"
