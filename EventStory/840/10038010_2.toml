[translation]
"10038010-1" = "第1話;異変"
"10038010-2-玄武商会のメンバーA" = "屋台の手配は終わってる？公演の機材は？"
"10038010-3-玄武商会のメンバーB" = "一つずつやろう……頭パンクしそう。"
"10038010-4-玄武商会のメンバーA" = "人手が足りなさすぎる……月影祭は目の前なのに！"
"10038010-5-玄武商会のメンバーB" = "屋台の運営に回りたい……。"
"10038010-6-玄武商会のメンバーA" = "まあまあ。毎年やってるんだし、今年はちょっとは早く片付くかもよ？"
"10038010-7-玄武商会のメンバーB" = "去年も思ったけど、お祭りの準備って本当に大変だよね。"
"10038010-8-玄武商会のメンバーA" = "噂で聞いたんだけど、一年中お祭りの準備をしている学園もあるんだって。百鬼……夜行だったかな？"
"10038010-9-玄武商会のメンバーB" = "すご……よく一年中できるね。どんな生活してるんだろ。"
"10038010-10-ルミ" = "みんな準備は進んでる？#nちょっと仕事量多いかな？"
"10038010-11-玄武商会のメンバーA" = "か、会長！こ、この程度全然大丈夫です！"
"10038010-12-玄武商会のメンバーB" = "月影祭は玄武商会最大のイベントですからね！任せてください！"
"10038010-13-ルミ" = "なら良いんだけど……お祭りが終わったらみんなでゆっくり休もうね。#nあと一踏ん張り、頑張ろっか。"
"10038010-14-レイジョ" = "たしかに、月影祭はかきいれ時ではありますが……。"
"10038010-15-レイジョ" = "だからといって、会場の設営から治安維持まで私たちに半分押しつけるなんて……。"
"10038010-16-ルミ" = "まあまあ。その代わり、玄龍門の子たちもうるさく言ってこないし。#n持ちつ持たれつって言うじゃん？"
"10038010-17-レイジョ" = "はぁ……どう考えてもしわ寄せが私にきていると思いますが。"
"10038010-18-ルミ" = "あはは……いつも頼りにしてるよ、レイジョ。"
"10038010-19-レイジョ" = "玄龍門側から余計な言いがかりがなければ良いのですが。#nそうでなくとも、交流会以来……。"
"10038010-20-ルミ" = "まぁまぁ。その話、今は……いや、当分はしまっておこっか。"
"10038010-21-レイジョ" = "京劇の舞台で一体何が起きているのでしょう？#n会長は何か知っていますか？"
"10038010-22-レイジョ" = "玄龍門は、些細な事故の一点張りで――"
"10038010-23-レイジョ" = "公演を担当していた京劇部は、全員謹慎処分になっている。"
"10038010-24-ルミ" = "あたしだって、あの日の出来事が気にならないと言ったら嘘になるけど……。"
"10038010-25-ルミ" = "うーん……やっぱこの話題はここまで！今はお祭りの準備が最優先だからね。"
"10038010-26-レイジョ" = "……。"
"10038010-27-レイジョ" = "はい。承知いたしました、会長。"
"10038010-28-レイジョ" = "（玄龍門が本気で隠そうとしているのなら、それを解き明かすのは不可能……）"
"10038010-29-？？？" = "うわああああっ！？"
"10038010-30-ルミ" = "どうしたの？火傷でもした！？"
"10038010-31-ルミ" = "……まさか。"
"10038010-32-レイジョ" = "これは……一体どういう事でしょう？"
"10038010-33-玄武商会のメンバーA" = "あ、あんた……その姿……！"
"10038010-34-幼くなった玄武商会のメンバーB" = "わ、私にも分からない……気がついたら縮んでて……！"
"10038010-35-玄武商会のメンバーA" = "さっきまでなんともなかったよね？#n何か変なものでも食べた？"
"10038010-36-幼くなった玄武商会のメンバーB" = "食べてないよ！今日は一日中、お祭りの現場チェックで忙しいからチャーハンしか……。"
"10038010-37-幼くなった玄武商会のメンバーB" = "あれ……？#nねえ、君も……？"
"10038010-38-幼くなった玄武商会のメンバーA" = "えっ！？私も！？なんで！？"
"10038010-39-幼くなった玄武商会のメンバーB" = "どういうこと！？"
"10038010-40-レイジョ" = "ど、どうしましょう。会長！"
"10038010-41-ルミ" = "とりあえず、玄龍門に連絡を――それから、錬丹術研究会にも。"
"10038010-42-レイジョ" = "玄龍門に……ですか！？"
"10038010-43-ルミ" = "うん。今は緊急事態だからね。#nそれに――"
"10038010-44-ルミ" = "えっ……？"
"10038010-45-レイジョ" = "ええっ……！？"
"10038010-46-ルミ" = "あたしまで！？！？"
"10038010-47-ミナ" = "なん……だと！？"
"10038010-48-キサキ" = "――それは、まことか？"
"10038010-49-玄龍門の構成員" = "は、はいっ！現在、玄武商会を中心に――"
"10038010-50-玄龍門の構成員" = "原因不明の「若返り現象」が起こっています！"
"10038010-51-玄龍門の構成員" = "玄武商会の会長、[ruby=あけしろ]朱城[/ruby]ルミの保護および調査結果は以下の通りです！"
"10038010-52-ルミ" = "うーん……保護室とはいえ、取り調べを受けているような……妙な気分。"
"10038010-53-ルミ" = "ご容赦ください、ルミ会長。"
"10038010-54-玄龍門の構成員" = "この現象について、何か心当たりはありませんか？"
"10038010-55-ルミ" = "心当たり、ねぇ……。"
"10038010-56-ルミ" = "特に変なものを口にした覚えもないし、移動したりもしてない。"
"10038010-57-ルミ" = "最近は「怪しい食材」を入荷したりもしてないよ？"
"10038010-58-ルミ" = "月影祭で変な料理を出すわけにもいかないからね。"
"10038010-59-ルミ" = "ということは……本当に何もしていないのに、急に玄武商会のメンバーが子供になってしまった、ということですか？"
"10038010-60-ルミ" = "まあ、そうなるね。#n最初はうちの子たちがそうなって、続けてあたしもって感じ。"
"10038010-61-ミナ" = "商売のためなら形振り構わない玄武商会の言葉を、鵜呑みになどできるものか！"
"10038010-62-ミナ" = "きっと隠していることがあるはずだ！"
"10038010-63-キサキ" = "――そこまでじゃ。この件が本当に玄武商会の仕業であるのなら、ルミ会長に害が及ぶはずもない。"
"10038010-64-キサキ" = "本人に害が及ぶようなものは、下策じゃからの。"
"10038010-65-ミナ" = "そ、それは……たしかに……そう、ですね。"
"10038010-66-キサキ" = "――報告を続けるがよい。"
"10038010-67-玄龍門の構成員" = "はっ！この現象は、対象を中心に同化していく性質があるようでして……。"
"10038010-68-玄龍門の構成員" = "現地で調査を行っている構成員の間では、「若返り現象」と呼ばれ――"
"10038010-69-玄龍門の構成員" = "――玄武商会を中心に、山海経全土に広がりつつあるようです！"
"10038010-70-キサキ" = "ふむ……同化のきっかけは突き止められたかの？"
"10038010-71-玄龍門の構成員" = "そ、そこまではまだ……！#nですが、最初に変化した生徒たちが起点となったことは明らかなようです！"
"10038010-72-玄龍門の構成員" = "現状、「若返る」以外の現象はまだ観察されておりません。また、例外的に訓育支援部、梅花園の園児は影響を受けないとのことです！以上です！"
"10038010-73-キサキ" = "ああ、ご苦労じゃった。#nであれば――"
"10038010-74-キサキ" = "現場の玄龍門の構成員に、身体に合う装備を支給せよ。#nまた、いつ現象が起こった生徒が現れても良いように装備の十全な確保を。"
"10038010-75-キサキ" = "それと同時に――可及的速やかに原因の調査を行なうように。"
"10038010-76-キサキ" = "調査がある程度完了するまで、関係者以外の玄武商会への立ち入りを制限する。"
"10038010-77-キサキ" = "これが、玄龍門の門主、[ruby=りゅうげ]竜華[/ruby]キサキの裁決じゃ。"
"10038010-78-玄龍門の構成員" = "は！承知いたしました！"
"10038010-79-キサキ" = "ミナ。今回ばかりは其方の力を借りることになりそうじゃ。"
"10038010-80-キサキ" = "現場に立ってくれるかの？"
"10038010-81-ミナ" = "！！！"
"10038010-82-ミナ" = "ご心配なく、門主様！#n必ず期待に応えて見せましょう！"
"10038010-83-キサキ" = "ふう……"
"10038010-84" = "[s] \"ミナを現場に行かせたのはどうして？\""
"10038010-85-キサキ" = "実利だけを見れば、ミナをわざわざ現場に派遣する必要はない。"
"10038010-86-キサキ" = "じゃが、現場に行かせることで……玄龍門の構成員と生徒に、あることを伝えようと思っての。"
"10038010-87-キサキ" = "ふふ、そんな大層なものではない。"
"10038010-88-キサキ" = "じゃが、山海経に何が起きようとも――玄龍門の門主は、山海経を裏切らないということじゃ。"
"10038010-89" = "[s1] \"キサキがそれをわざわざ伝えなければならないというのが……。\"\n[s2] \"少し、悲しいね。\""
"10038010-90-キサキ" = "……そう思ってくれるのか。"
"10038010-91-キサキ" = "ふふ、先生には心から感謝しないといけないのう。#nそうさな――昔であれば、このようなことをする必要もなかった。"
"10038010-92-キサキ" = "じゃが、今は――しなければならない。"
"10038010-93" = "[s] \"私も現地で何か手伝おうか？\""
"10038010-94-キサキ" = "先生が？ふむ……。"
"10038010-95-キサキ" = "止めはせぬが、勧めたくはないかの。"
"10038010-96-キサキ" = "これは妾の推測じゃが――今は、先生でさえも歓迎されない状況じゃろうからの。"
"10038010-97-山海経の生徒A" = "最近何か騒がしいね。"
"10038010-98-山海経の生徒B" = "玄武商会通りに立ち入り制限かかってるし……"
"10038010-99-山海経の生徒A" = "商会通りに行くには、玄龍門が発行した通行証が必要なんだって。#nそれに、ほとんどのお店は営業してないみたいだし。"
"10038010-100-山海経の生徒B" = "あそこの麻婆豆腐好きだったのになぁ、残念……"
"10038010-101-山海経の生徒A" = "というか、私たちは大丈夫なのかな？"
"10038010-102-山海経の生徒B" = "何が？"
"10038010-103-山海経の生徒A" = "例の……アレ、だよ。"
"10038010-104-山海経の生徒B" = "……"
"10038010-105-山海経の生徒A" = "玄龍門は、子供になるだけで大した異常が起こるわけじゃないって言ってたけど……。"
"10038010-106-山海経の生徒B" = "でもやっぱり、子供になったら色々不便なんじゃない？"
"10038010-107-山海経の生徒A" = "まぁ、そうだよね……"
"10038010-108-山海経の生徒B" = "というか、初めて子供になった人がでたのって、玄武商会通りらしいじゃん？"
"10038010-109-山海経の生徒A" = "やっぱ他校生が出入りしてたからなんじゃない……？#nこの前も何か色々あったみたいだし。"
"10038010-110-山海経の生徒B" = "なんか揉め事起きてたんだっけ？#n何かが起きたとしてもおかしくないよね……"
"10038010-111-山海経の生徒A" = "月影祭、大丈夫かな。毎年他校生が観光にくるじゃん？#n問題起きそう……。"
"10038010-112-山海経の生徒A" = "そういえば、六和閣にシャーレの先生が来てるんだって。#nでも、先生も結局は……外部の人だよね？"
"10038010-113-山海経の生徒B" = "ここまで事が大きくなってるんだし、もう何か対策立ててるんじゃないかな？#nミナ執行部長が現場に出てるくらいだし。"
"10038010-114-山海経の生徒A" = "まあ、それなら安心だけどさ……"
"10038010-115-山海経の生徒B" = "それに、玄武商会が原因だと断定もできないんじゃない？#nまだ調査中みたいだから。"
"10038010-116-山海経の生徒A" = "でも、どっちかなんじゃないの？#n玄武商会が原因じゃないなら、やっぱり……。"
"10038010-117-サヤ" = "ま、待ってほしいのだ！絶対おかしいのだ！錬丹術研究会は今回の事件とは関係ないのだ！"
"10038010-118-玄龍門の構成員" = "あなたは重要参考人となっています。ご同行、願えますか――[ruby=やくし]薬子[/ruby]サヤ会長。"
"10038010-119-玄龍門の構成員" = "嫌疑がかかっている以上、晴らすのであればご協力をお願いしたく。#n私どもとしても仕事ですので。ご容赦ください。"
"10038010-120-玄龍門の構成員" = "……玄武商会が原因でないのなら、と生徒から錬丹術研究会に疑いの目が向いている状態です。"
"10038010-121-サヤ" = "だから違うのだ！錬丹術研究会は……錬丹術研究会は……！"
"10038010-122-サヤ" = "（も、もしかして！以前、シュン教官に渡した「若返りの秘薬」の情報が流出したのだ……？）"
"10038010-123-サヤ" = "その……前に錬丹術研究会で作った、肌が柔らかくなる薬のせい……だったり？"
"10038010-124-玄龍門の構成員" = "そんなものを作っていたのですか？初耳です。"
"10038010-125-玄龍門の構成員" = "薬の内容が気になりますね。今度、サンプルでもいいので少しだけ……"
"10038010-126-サヤ" = "そうしたら取り調べを免除してくれるのだ？"
"10038010-127-玄龍門の構成員" = "それはそれ、これはこれです。"
"10038010-128-サヤ" = "そうだろうとは思っていたけど！ひどいのだ！"
"10038010-129-サヤ" = "うううう……何か面倒事が起きたら、錬丹術研究会を疑うのも仕方ないことだけど……。"
"10038010-130-サヤ" = "たしかに、客観的な事実だけ見たらそうだけど！そうではあるけど！"
"10038010-131-サヤ" = "でも、濡れ衣なのだ！今回ばかりは、ぼく様は何もしてないのだ！"
"10038010-132-玄龍門の構成員" = "「今回ばかりは」……？"
"10038010-133-サヤ" = "……口が滑ったのだ！"
"10038010-134-玄龍門の構成員" = "まあ、ただの取り調べですからね。"
"10038010-135-サヤ" = "でも、結局逮捕したりするんじゃないのか？"
"10038010-136-玄龍門の構成員" = "まぁ……その可能性がないとは言い切れませんね。"
"10038010-137-サヤ" = "結局そうなっちゃうやつなのだ！ひどいのだ！"
"10038010-138-ミナ" = "中間報告をさせていただきます。門主様。"
"10038010-139-ミナ" = "現錬丹術研究会長のサヤは素直に尋問に応じていますが、今のところ特に手がかりになるような証言はありませんでした。"
"10038010-140-キサキ" = "……今のところ？#n何かひっかかるところでも？"
"10038010-141-ミナ" = "……ええと、その。#nこれは尋問に参加した私の感想でしかないのですが……"
"10038010-142-ミナ" = "サヤ会長が「何か」を隠しているような気がします。"
"10038010-143-ミナ" = "今回、山海経の「若返り現象」について、全く知らないような口ぶりではありませんでした。"
"10038010-144-キサキ" = "ふむ、完全に否定しなかった、と？それは妙じゃのう。#nサヤはああ見えて、嘘をつくのが苦手じゃというのに……。"
"10038010-145-キサキ" = "ん？どうしたのじゃ、先生。何か心当たりでもあるのかえ？"
"10038010-146" = "[s] \"え、いや！何でもないよ！うん！\""
"10038010-147-キサキ" = "ふむ……？まあ、良い。先生の言葉を信じるとしよう。"
"10038010-148-キサキ" = "先生がわざわざ隠し立てているのであれば、それ相応の理由があるはずじゃからのう？"
"10038010-149-キサキ" = "あい分かった。続けるがよい。"
"10038010-150-ミナ" = "はい！そして……生徒たちの間で、また別のよからぬ噂が広まっておりまして……。"
"10038010-151-キサキ" = "ふむ――この状況で良い噂が流布するとは思えぬが。"
"10038010-152-キサキ" = "わざわざ報告したということは、それ相応の理由があるのじゃろう？"
"10038010-153-ミナ" = "は、はい！それが、その……"
"10038010-154-山海経の生徒A" = "ねぇ、あの噂聞いた？"
"10038010-155-山海経の生徒B" = "え、いっぱいあるけど……どれ？"
"10038010-156-山海経の生徒A" = "あれあれ！錬丹術研究会の会長が帰ってきたってヤツ。"
"10038010-157-山海経の生徒B" = "え？錬丹術研究会の会長って[ruby=やくし]薬子[/ruby]サヤでしょ。どっか行ってたの？"
"10038010-158-山海経の生徒A" = "じゃなくて、前代の会長……"
"10038010-159-山海経の生徒B" = "え、誰……？"
"10038010-160-山海経の生徒A" = "私も小耳に挟んだだけだけど。五塵の……[ruby=びこう]獼猴[/ruby]だっけ？七囚人の一人の。"
"10038010-161-山海経の生徒B" = "うちの学校に七囚人がいたの？"
"10038010-162-山海経の生徒A" = "らしいよ。元々彼女が錬丹術研究会の会長だったけど、退学させられたんだって。"
"10038010-163-山海経の生徒B" = "初めて聞いた。なんて名前？"
"10038010-164-山海経の生徒A" = "――[ruby=しんたに]申谷[/ruby]カイ。"
"10038010-165-山海経の生徒B" = "初めて聞いた……"
"10038010-166-山海経の生徒A" = "3年生だと、まだ知ってる人いるらしいよ。"
"10038010-167-キサキ" = "それは――まことか？"
"10038010-168-ミナ" = "はい……内容の重さに比べて、生徒への影響はそこまで大きくないのですが、このような噂が広まっているということ自体が……"
"10038010-169-キサキ" = "……"
"10038010-170-キサキ" = "退学になった生徒が、何の手続きもなく母校に戻るのは難しい。"
"10038010-171-キサキ" = "まして、それがあの[ruby=しんたに]申谷[/ruby]カイであれば……なおさらじゃ。"
"10038010-172-キサキ" = "彼の者の名を覚えている生徒の間では、看過できぬ問題となろう。これがデマであれば、可及的速やかに収める必要がある。"
"10038010-173-ミナ" = "承知しました、門主様！"
"10038010-174-キサキ" = "ふう……"
"10038010-175" = "[s] \"聞いてもいいかな？\""
"10038010-176-キサキ" = "ん？どうしたのじゃ、先生。"
"10038010-177-キサキ" = "ああ、[ruby=しんたに]申谷[/ruby]カイのことか……。"
"10038010-178-キサキ" = "……。"
"10038010-179-キサキ" = "――カイについて語るのは難しい、と言ったら、其方はどうする？"
