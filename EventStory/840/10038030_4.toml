[translation]
"10038030-1" = "第3話;大人と子供、子供、子供。"
"10038030-2-シュエリン" = "普段は賑やかな公園なのに……"
"10038030-3-キキ" = "今はほとんど人がいませんね。寂しく感じます。"
"10038030-4-シュエリン" = "京劇の練習をする人も、おやつを食べ歩く生徒の姿も……"
"10038030-5-キキ" = "……"
"10038030-6-シュエリン" = "あ、でも屋台はまだありますね！#n先生、私たちも何か食べましょう。私、エッグタルトが食べたいです！"
"10038030-7-キキ" = "キキも！ちゃんと後で歯磨き頑張りますから！いいですよね？"
"10038030-8" = "[s] \"う……うん、いいよ……。\""
"10038030-9-一同" = "ありがとうございます、先生！"
"10038030-10-シュエリン" = "最近、桃源郷で「[ruby=クレープ]班戟[/ruby]」を売り始めたらしいんです！"
"10038030-11-シュエリン" = "伝統に反するといって、3年生の……お姉さん……はあんまり食べようとしませんが……。"
"10038030-12-シュエリン" = "でも一度食べたら、やみつきになるって噂なんです！"
"10038030-13-キキ" = "「[ruby=クレープ]班戟[/ruby]」って何ですか？#nキキ、初めて聞きました。"
"10038030-14-シュエリン" = "ふっふっふ……「[ruby=クレープ]班戟[/ruby]」はですね！"
"10038030-15-シュエリン" = "薄い生地の中に生クリームとフルーツをたっぷり入れて固めたフルーツクリームケーキなんです！"
"10038030-16-シュエリン" = "一番有名なのはマンゴーですが……抹茶、チョコレート、イチゴ……#n生地に合うものであればどんなものでもいれることができます！"
"10038030-17-シュエリン" = "すごく美味しそうです……！"
"10038030-18-キキ" = "先生！キキも食べてみたいです！"
"10038030-19" = "[s] \"さっきエッグタルトを食べたばっかだよ……？\""
"10038030-20-一同" = "先生、お願い！お願い！"
"10038030-21-シュエリン" = "濃厚な抹茶と一緒にいただいたら……絶対美味しいです！"
"10038030-22-キキ" = "あま～い「[ruby=クレープ]班戟[/ruby]」を濃いめの抹茶で口直し……想像するだけで無限に食べられそう……！"
"10038030-23-一同" = "本当にダメですか……？#n先生、お願い！お願い！"
"10038030-24" = "[ns] \"しょうがないなぁ……。\""
"10038030-25-シュエリン" = "わーい！ありがとうございます！"
"10038030-26-キキ" = "先生、大好き！"
"10038030-27-キキ" = "だ、大丈夫ですか！？急にむせて……"
"10038030-28-キキ" = "先生、大丈夫ですか？変なところに入っていませんか？"
"10038030-29" = "[s] \"だ、大丈夫……。\""
"10038030-30-シュエリン" = "食べてばかりなので、お散歩して消化しましょうか！"
"10038030-31-キキ" = "いいですね！#nここはいつ来ても心が落ち着きますし、お散歩に最適です。"
"10038030-32-シュエリン" = "パンダいるかな……あ、あそこにいますね！"
"10038030-33-キキ" = "パンダって……近づいて大丈夫なんですか？#nパンダも熊ですし……"
"10038030-34-シュエリン" = "大丈夫です！ここの子たちは人に慣れてるんですよ！"
"10038030-35-シュエリン" = "特に竹が好きなので……これを渡してあげれば……！"
"10038030-36-子パンダ" = "メエ？"
"10038030-37-子パンダ" = "ウォン！"
"10038030-38-シュエリン" = "ほら、美味しそうに食べてくれるんです！"
"10038030-39-キキ" = "わぁ、いいですね！#nキキも！キキもやりたいです！"
"10038030-40" = "[s] \"人に慣れてるとはいえ、あんまり近寄りすぎないようにね……。\""
"10038030-41-一同" = "は～い！"
"10038030-42-シュエリン" = "ただいま～！"
"10038030-43-キキ" = "ふあ……すごい楽しい一日でした。#nキキ、とっても満足です！"
"10038030-44-シュエリン" = "本当ですか？それはよかったです！"
"10038030-45-キキ" = "先生はどうでしたか？"
"10038030-46" = "[s] \"生徒が満足したなら、よかった……。\""
"10038030-47-キキ" = "むぅ……私たちは生徒じゃなくて園児ですよ？"
"10038030-48" = "[s] \"2人が満足したなら、よかった……。\""
"10038030-49-シュエリン" = "なんか先生疲れてませんか……？"
"10038030-50-シュエリン" = "気にしなくてもいいと言われても……うーん……。"
"10038030-51-ココナ" = "あ、先生！梅花園へようこそ！今日、梅花園の子と遊んでくださったとお聞きしました！お疲れ様でした。"
"10038030-52-ココナ" = "あれ？君、しばらく見なかった子じゃない？#n隣の子は……？"
"10038030-53-シュエリン" = "こ、この間、転校してきたキキちゃんです！#nシュンお姉ちゃんに面倒を見るよう頼まれて！"
"10038030-54-キキ" = "こんにちは、ココナ教官！キキと言います。よろしくお願いします！"
"10038030-55-ココナ" = "……！"
"10038030-56-ココナ" = "先生、今の聞きましたか？私のこと、教官って……！"
"10038030-57-ココナ" = "なんですかその目は……！頭撫でないでください！"
"10038030-58-ココナ" = "もう、変なことずっと言って……世界が正常に動いている……ってなんですかそれ。"
"10038030-59-シュエリン" = "わ、私、シュンお姉ちゃんを探してきますね！"
"10038030-60-キキ" = "キキも一緒に行きます！"
"10038030-61-ココナ" = "ま、待って！シュン姉さんは……！"
"10038030-62-ココナ" = "うぅ、シュン姉さんどこに行っちゃったんだろ……今日一度も見かけてなくて……"
"10038030-63" = "[s] \"シュンの事は……私に任せて。\""
"10038030-64-ココナ" = "先生が？それはとても楽……いえ、ありがたいですけど……。"
"10038030-65-ココナ" = "無理に先生がやる必要はないと思いますけど……うーん、今日の先生なんか変ですね。"
"10038030-66-ココナ" = "じゃあ、シュン姉さんのことはお願いしますね。#n私は他の園児の面倒を見ないといけないので。"
"10038030-67-ココナ" = "まあ、私は立派な梅花園の教官ですから！#nこれくらい当然できますが……！えっへん！"
"10038030-68-シュエリン" = "ふう。バレても何もないとは思いますが、危ないところでした。#nココナちゃんは変なところで勘がいいですからね……"
"10038030-69-キキ" = "ふむ……"
"10038030-70-キキ" = "ふう……お忍びで抜け出すという目的は無事達成できたのう。皆、ご苦労じゃった。"
"10038030-71-シュエリン" = "……ご満足いただけましたでしょうか、門主様？"
"10038030-72-キキ" = "そうさな……"
"10038030-73-？？？" = "キサキ……？"
"10038030-74-キキ" = "！！？？"
"10038030-75-キキ" = "初めまして！今日転校してきたキキって言います。#nどちらさまですか？"
"10038030-76-ルミ" = "……"
"10038030-77-キキ" = "……"
"10038030-78-ルミ" = "キサキ……何してるの……？"
"10038030-79-キキ" = "い、いえ……キキ、です……"
"10038030-80-ルミ" = "いや、それは無理があるよ。"
"10038030-81-キキ" = "……"
"10038030-82" = "ふむ。やはり其方の目は欺けないのう。"
"10038030-83-ルミ" = "……説明をお願いしてもいいかな？"
"10038030-84" = "[s] \"そうだね……まずは場所を変えようか。\""
"10038030-85-ルミ" = "うん、人いないね。#n……ここなら、よっぽどの事がなければ声も聞こえないかな？"
"10038030-86-ルミ" = "もしも誰かが通りがかったとしても、先生が園児と一緒にいるだけにしか見えないし。"
"10038030-87-ルミ" = "だから、正直に話して。#nキサキ、一体何やってるの？"
"10038030-88-キサキ" = "……大したことではない。"
"10038030-89-キサキ" = "お忍びに最適な服を着ているだけじゃ。"
"10038030-90-ルミ" = "ああ、なるほどね。"
"10038030-91-ルミ" = "まあ、キサキがよくお忍びで山海経を歩き回ってることくらい知ってるけど……。"
"10038030-92-ルミ" = "別にその格好じゃなくても良くない？"
"10038030-93-キサキ" = "お忍びの格好は、様々な事情が考慮されて然るべきじゃ。今はこれが最適でな。"
"10038030-94-ルミ" = "まあ、いいや。キサキがそういうならそうなんだろうけど……#nほら、昔うちのメンバーに変装して商会に入ったこともあったでしょ？"
"10038030-95-キサキ" = "ふふ、覚えておるぞ。最初はうまくいくかと思ったのじゃが。"
"10038030-96-ルミ" = "でも、キサキ、料理が下手すぎてバレちゃったんだよね！"
"10038030-97-ルミ" = "まぁ、気づいたのがあたしでよかったよ。#n他の子にバレてたら政治問題に発展するところだったんだから。"
"10038030-98-キサキ" = "その時の借りは返したつもりじゃが。"
"10038030-99-ルミ" = "ああ、わかってるよ。#nちょっと懐かしくなっちゃってね。"
"10038030-100-キサキ" = "ところで、なぜ其方は梅花園に？"
"10038030-101-ルミ" = "あたし？今、月影祭の雲行きが怪しいじゃない？#nだから、余った月餅を子供たちに分けてあげようと思って。"
"10038030-102-ルミ" = "キサキも食べる？いくつか残ってるんだよね。"
"10038030-103-キサキ" = "月餅か……懐かしいのう。ありがたくいただくとしよう。"
"10038030-104-ルミ" = "先生もどう？玄武商会の月餅は美味しいよ。"
"10038030-105" = "[s] \"じゃあ遠慮なく……。\""
"10038030-106" = "（一口食べると、香ばしくて濃厚な味が口の中に広がった）"
"10038030-107" = "（私たちはしばらく何も言わず、静かに月餅を食べた……）"
"10038030-108-キサキ" = "……昔を思い出すのう、妾たちが初めて月餅を作って食べた時のことじゃ。"
"10038030-109-ルミ" = "げっ、それまだ覚えてるんだ……？"
"10038030-110-キサキ" = "卵黄とクルミ、あんこが入った月餅じゃったのう。"
"10038030-111-ルミ" = "もう……そういうのは忘れてほしいんだけど……"
"10038030-112-キサキ" = "ふふっ、あまりにも強烈だったからのう。#nあんこからは少し焦げた味がしたし、卵黄は半熟で、クルミは粉々に砕けて食感が消えておった。"
"10038030-113-ルミ" = "月餅を型に入れたのはキミだったのに。"
"10038030-114-キサキ" = "ああ。そのせいであちこち壊れたり、形がつぶれたりもした。"
"10038030-115-キサキ" = "到底月餅とは言えない、そんなシロモノじゃったのう……。"
"10038030-116-ルミ" = "まあ、最初から完璧になんてできないよ。"
"10038030-117-キサキ" = "ああ、そうさな……。"
"10038030-118-キサキ" = "ふふ、今でも昨日の事のように覚えておるよ。"
"10038030-119-ルミ" = "……あたしも。#nあの頃からかな、料理人を目指すようになったのは。"
"10038030-120-キサキ" = "其方の望む姿にはなれたのか？"
"10038030-121-ルミ" = "どうだろう。まあまあ近づいているような気はするよ。#nキサキは？"
"10038030-122-キサキ" = "妾は……分からないな。#nなにせ、妾は一度たりとも自身の意志で門主になろうと思ったことがないからの。"
"10038030-123-ルミ" = "……"
"10038030-124-ルミ" = "……キサキは頑張ってると思うよ。"
"10038030-125-ルミ" = "まあ、商会が営業できてないから今月の売上が苦しいのはあるけどね。"
"10038030-126-キサキ" = "……すまぬ。"
"10038030-127-ルミ" = "いやいや、これは仕方ないでしょ。"
"10038030-128-ルミ" = "みんなある程度は蓄えがあるし、今月くらいなら大丈夫だよ。それに……。"
"10038030-129-ルミ" = "あたしがこんな風になっちゃったわけだし。"
"10038030-130-ルミ" = "……とは言っても、後でうちの子を[ruby=なだ]宥[/ruby]めるのはちょっと苦労しそうだけど。"
"10038030-131-キサキ" = "色々と苦労をかけるの。"
"10038030-132-ルミ" = "キサキほどじゃないよ。#nまあ、それに初心を忘れなければ、なんとかなると思ってるよ。"
"10038030-133-キサキ" = "初心、か……"
"10038030-134-ルミ" = "どうかしたの？"
"10038030-135-キサキ" = "いや……其方にはそういう芯があるのじゃろうな。"
"10038030-136-キサキ" = "しかし、妾にそのようなものがあるかと問われると……あまり自信がない。"
"10038030-137-ルミ" = "キサキ……"
"10038030-138" = "[s] \"それはそれでいいんじゃないかな？\""
"10038030-139-キサキ" = "……どういう意味じゃ？"
"10038030-140" = "[s1] \"だって、初心を忘れた時には問題が発生するものだけど、\"\n[s2] \"そもそもないのなら、忘れる心配もないんじゃない？\""
"10038030-141-キサキ" = "ふむ……そうさな。"
"10038030-142-キサキ" = "たしかに、元より存在しないものを忘れるのは難しい。ふふ、その通りじゃ。#n目から鱗が落ちたようじゃ。"
"10038030-143-キサキ" = "して、妾の振る舞いは先生からはどう映る？"
"10038030-144" = "[s] \"……キサキが最善を尽くしていることは、私もよく知っているよ。\""
"10038030-145-キサキ" = "……そうか。"
"10038030-146-キサキ" = "しかし、最善を尽くしているだけでは儘ならぬことも多い。"
"10038030-147-ルミ" = "玄武商会でもたまに言う言葉だね。"
"10038030-148-ルミ" = "「一生懸命炒めてどうするの。上手く炒めないとね」って、"
"10038030-149-キサキ" = "うむ、その通り。#n例えば錬丹術研究会で多くの労力を費やしたとて、必ずしも妙薬の生成に成功するとは限らないように、な。"
"10038030-150-ルミ" = "あはは……あんまサヤをからかわないであげて。"
"10038030-151-キサキ" = "特定個人の話をしているつもりではなかったのじゃが……。"
"10038030-152-キサキ" = "（待て、錬丹術研究会じゃと……？）"
"10038030-153-ミナ" = "はい……内容の重さに比べて、生徒への影響はそこまで大きくないのですが、このような噂が広まっているということ自体が……"
"10038030-154-キサキ" = "（今、錬丹術研究会の会長は不在……）"
"10038030-155-ミナ" = "現錬丹術研究会長のサヤは素直に尋問に応じていますが、今のところ特に手がかりになるような証言はありませんでした。"
"10038030-156-キサキ" = "（「若返り現象」は錬丹術研究会と関係があると考えられている。であれば……）"
"10038030-157-サヤ" = "ちょ、ちょっと！濡れ衣なのだ！#n錬丹術研究会は今回の事態とは無関係なのだ！"
"10038030-158-キサキ" = "（視点を変えて考えるのじゃ。妾が山海経に戻ろうとした場合、まず障害になるのは……？）"
"10038030-159-キサキ" = "退学になった生徒が、何の手続きもなく母校に戻るのは難しい。"
"10038030-160-キサキ" = "まして、それがあの[ruby=しんたに]申谷[/ruby]カイであれば……なおさらじゃ。"
"10038030-161-キサキ" = "……！"
"10038030-162-ルミ" = "ちょっと、キサキ……どうしたの？"
"10038030-163-キサキ" = "見落としておった……今もっとも危険なのは錬丹術研究会じゃ！"
"10038030-164-ルミ" = "錬丹術研究会？どうして！？"
"10038030-165-ミナ" = "門主様？どうされましたか？"
"10038030-166-キサキ" = "ミナ。今すぐ錬丹術研究会がどんな状態なのか調べるのじゃ。"
"10038030-167-ミナ" = "……！そうでなくても、ちょうどそれを申し上げようとしたところです。錬丹術研究会からの急報です！"
