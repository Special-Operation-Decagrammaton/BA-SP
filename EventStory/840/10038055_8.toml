[translation]
"10038055-1" = "[ns] \"キサキ！\""
"10038055-2-キサキ" = "動くな、先生！"
"10038055-3-キサキ" = "ここは……危険じゃ。離れておれ。"
"10038055-4-キサキ" = "其方、一体何をしたのじゃ……！#nその身体、まともではあるまい？"
"10038055-5-カイ" = "ああ――仙丹を飲んだのさ。"
"10038055-6-カイ" = "それより普段表に出ず、部下任せにしている君には――少々分が悪かったかな？"
"10038055-7-キサキ" = "何を……！"
"10038055-8-カイ" = "そうだろう？#n現に今だって悩んでいるのではないのかね？"
"10038055-9-カイ" = "玄武商会と山海経全体、そして月影祭のこと。#n統率がとれなくなりつつある、玄龍門と京劇部……。"
"10038055-10-カイ" = "口では山海経の伝統を守ると言いながら――"
"10038055-11-カイ" = "心の奥底では、違う考えを抱いているのではないかね？"
"10038055-12-キサキ" = "……！？"
"10038055-13-カイ" = "ククッ。君は実に分かりやすいねぇ。全部、表情に出ているよ？"
"10038055-14-キサキ" = "戯言を……！"
"10038055-15-キサキ" = "ここまできて未だなお虚勢を張るというのかい？#nこれまでの君の行動が――その心を十分に証明しているというのに。"
"10038055-16-カイ" = "玄龍門の君たちだって、うすうす気がついているのだろう？"
"10038055-17-カイ" = "山海経の伝統を守らねければならない玄龍門の門主が――#n心の奥底では、別の考えを抱いているかもしれないってことをさ。"
"10038055-18-玄龍門の構成員A" = "……！"
"10038055-19-玄龍門の構成員B" = "（やっぱり……門主様は……！）"
"10038055-20-玄龍門の構成員A" = "（はぁ？あんな犯罪者の話を鵜呑みにするの？）"
"10038055-21-玄龍門の構成員B" = "（で、でも……）"
"10038055-22-玄龍門の構成員A" = "（……）"
"10038055-23-カイ" = "ククッ、ハハハハハッ……！"
"10038055-24-カイ" = "忠誠を捧げる者は、貫けばいい。#n疑念を抱く者は、そうすればいい。"
"10038055-25-カイ" = "どれほど偉大な統治者であったとしても、人の心まではどうしようもないものさ。"
"10038055-26-カイ" = "さあ、全てを詳らかにしようじゃあないか――君に、私と同じ経験を。"
"10038055-27-キサキ" = "なにを……？"
"10038055-28-カイ" = "同じように――追放される苦しみを味わわせてやろう。"
"10038055-29-カイ" = "同じように――無所属の生徒であるが故の苦難を経験させてやろう。"
"10038055-30-カイ" = "同じように――どこにも属すことができず彷徨う虚しさを味わわせてやろう。"
"10038055-31-キサキ" = "それは、其方が……！"
"10038055-32-カイ" = "君が私を[ruby=・   ・   ・   ・]こうした[/ruby]のだよ――キサキ。"
"10038055-33-キサキ" = "妾、が……？"
"10038055-34-カイ" = "そうさ。#n他の誰でもない――君が。"
"10038055-35-カイ" = "私が復讐に胸を燃やすのも――怨みを抱くのも。#nすべて――君のせいだ。"
"10038055-36-カイ" = "そう――この情念は、門主が背負うものだろう？"
"10038055-37-キサキ" = "……っ！？"
"10038055-38-カイ" = "花が散り洪水となっても――雷が落ちたとしても。#n天変地異でさえ、君の責任となる。"
"10038055-39-カイ" = "それが――山海経の門主だろう？"
"10038055-40-キサキ" = "妾は……！"
"10038055-41-キサキ" = "山海経のため……生徒が苦しむのを救うために……。"
"10038055-42-カイ" = "だから――大事の前の小事として、私を切り捨てたのだろう？"
"10038055-43-キサキ" = "……！！！"
"10038055-44-カイ" = "ククッ……そう、それだ。#nその顔が見たかったんだよ、キサキ。"
"10038055-45-カイ" = "見ろ、玄龍門。これが君たちの門主だ。#n君たちの山海経であり、過去に取り残された残滓だよ。"
"10038055-46-カイ" = "伝統を守ることなど興味がなく――門主の意味すら正しく理解できていない。"
"10038055-47-カイ" = "名利欲があったのなら、まだ理解ができたというのに――#n自身の真の望みにさえも気づけぬ愚か者だよ。"
"10038055-48-玄龍門の構成員A" = "……"
"10038055-49-玄龍門の構成員B" = "……！"
"10038055-50-カイ" = "ククッ……私の知る玄龍門は、自らの思考を放棄した集団だった。"
"10038055-51-カイ" = "しかし、今は自分で考える時ではないかね？"
"10038055-52-カイ" = "君たちの足で歩き、君たちの口で答えるべきだ。#nその手で選び――その目で見届けよ。"
"10038055-53-カイ" = "今の玄龍門に――キサキは必要か？"
"10038055-54-カイ" = "山海経に――キサキは必要か？"
"10038055-55-玄龍門の構成員A" = "……！"
"10038055-56-玄龍門の構成員B" = "……！"
"10038055-57" = "[ns] \"ミナ！レイジョ！\""
"10038055-58-ミナ" = "！？"
"10038055-59-レイジョ" = "！？"
"10038055-60" = "[s] \"この場から離れるよ！キサキをお願い！\""
"10038055-61-ミナ" = "わ、わかった。先生！"
"10038055-62-レイジョ" = "はい！"
"10038055-63-カイ" = "……"
"10038055-64-カイ" = "興醒めだよ。#nあと少しだったというのに……。"
"10038055-65-カイ" = "……。"
"10038055-66-カイ" = "先手を打って行動するとは……ふむ。#nシャーレの先生は、思った以上に大きな変数として作用する人物だったのだねぇ。"
"10038055-67-カイ" = "まあ、いいか。"
"10038055-68-カイ" = "私の目標は、完璧な仙丹を生み出すこと。#n他がどうなろうと構わないからねぇ。"
"10038055-69-カイ" = "ククッ……それではもう一度、すべてを始めよう。"
"10038055-70-カイ" = "今度こそ、誰にも邪魔されずに成し遂げてみせようじゃあないか。"
