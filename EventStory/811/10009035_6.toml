[translation]
"10009035-1" = "[ns] \"また脱出って、一体何が起きて……。\""
"10009035-2-フブキ" = "まさか、昼食の親子丼を使って手錠を外すだなんて……。"
"10009035-3-キリノ" = "流石は「災厄の狐」さん……。"
"10009035-4" = "[s] \"ごめん、全然意味が分からない。\""
"10009035-5-フブキ" = "でも心配しないで。今度こそ、今度こそ大丈夫！ちゃんと晩ご飯のメニューは、「蕎麦」にしておいたから！"
"10009035-6" = "[s] \"メニューの問題！？\""
"10009035-7-フブキ" = "まあまあ大丈夫、"
"10009035-8-フブキ" = "今度はちゃんと気を付けるから！"
"10009035-9-キリノ" = "失敗を重ねながらもヴァルキューレ警察学校はこうして日々進化していくんだそうです！本官も頑張ります！"
"10009035-10-フブキ" = "じゃ、ありがとね先生！"
"10009035-11-キリノ" = "失礼します！"
"10009035-12" = "[s] \"う、うん……。\""
"10009035-13-セナ" = "では、私たちもパトロールを頑張りましょうか。"
"10009035-14" = "[s] （本当に大丈夫かな……）"
