[translation]
"10009065-1-セナ" = "「七囚人」……でしたか。"
"10009065-2-セナ" = "今度は矯正局から脱出の知らせさえ無いまま、こうして姿を現すとは。やはり侮れませんね。"
"10009065-3-セナ" = "ですが、今度こそ終わりです。先生の指揮もあって既に他の問題児たちは無力化、装備も無効化してあります。"
"10009065-4-セナ" = "覚悟は良いですか、災厄の狐。"
"10009065-5-ワカモ" = "……！"
"10009065-6-セナ" = "窮地に追い込まれたと分かるや否や、逃走ですか？"
"10009065-7-セナ" = "……良いでしょう。これ以上死体……"
"10009065-8-セナ" = "いえ、負傷者を増やすわけにはいきません。こうなったら、一対一で。"
"10009065-9-セナ" = "先生、私はこのまま災厄の狐を追います。"
"10009065-10-セナ" = "この辺りは片付きましたが、どこからか問題児たちの残党が来てもおかしくありません。できるだけ早めにヴァルキューレの生徒たちとの合流を。"
"10009065-11" = "[s] \"あ、セナ……！\""
"10009065-12" = "（セナはすごい勢いで、ワカモの後を追いかけていった）"
"10009065-13" = "（少しの間、この後どう動くべきかについて悩んでいた時）"
"10009065-14-チヒロ" = "先生大丈夫！？怪我は！？"
"10009065-15" = "[s] \"うん、大丈夫。チヒロの方は？\""
"10009065-16-チヒロ" = "……待って。もしかして今、ひとり？"
"10009065-17-チヒロ" = "一緒にいたゲヘナの子は？"
"10009065-18-チヒロ" = "……一対一で追撃？やられたっ……！"
"10009065-19" = "[s] \"……？\""
"10009065-20-チヒロ" = "最初っからワカモの狙いはこれだった。わざと騒ぎを大きくして、ありとあらゆる目を自分に向けさせて……。"
"10009065-21-チヒロ" = "いや、詳しく説明してる場合じゃない。先生、落ち着いて私の指示に従って。今その辺りのシステムをハッキングしたから。"
"10009065-22" = "[s] \"ハッキング！？そんな簡単に！？\""
"10009065-23-チヒロ" = "このまま監視カメラとか信号を利用して、先生を安全な区域に誘……"
"10009065-24-チヒロ" = "…………い、………通し……………………"
"10009065-25-チヒロ" = "……聞…………場…………………………"
"10009065-26" = "[ns] \"通信が……。\""
"10009065-27" = "（チヒロとの連絡が途絶え途絶えになり、次に取るべき行動を悩んでいたが……）"
"10009065-28-？？？" = "ふふっ、ようやく見つけました……♡"
"10009065-29" = "[s] \"……？\""
"10009065-30" = "（同時刻、別の場所では……）"
"10009065-31-ヴァルキューレの生徒A" = "D.U.の商店街地区で「災厄の狐」が出没！本部の支援を要請する！"
"10009065-32-ヴァルキューレの生徒A" = "他の問題児たちまで大量に現れてて、現場の戦力だけじゃとても……！"
"10009065-33-ヴァルキューレの生徒A" = "こちらD.U.西地区！"
"10009065-34-ヴァルキューレの生徒A" = "西地区、繋がった！ちょうど良かった、こちらに支援を……！"
"10009065-35-ヴァルキューレの生徒B" = "西地区にて、矯正局から姿を消した「災厄の狐」が出現！手遅れになる前にどうか支援を……！"
"10009065-36-ヴァルキューレの生徒A" = "……えっ！？"
"10009065-37-ヴァルキューレの生徒B" = "繰り返す、こちら西地区！目の前にワカモが……！"
"10009065-38-ヴァルキューレの生徒C" = "どういうこと！？災厄の狐は今D.U.の中央通りに……！"
"10009065-39-フブキ" = "ふ、フブキ！これは……！？"
"10009065-40-フブキ" = "ああもう、何これ！っていうか多分これは全部……！"
"10009065-41-チヒロ" = "うん、全部「偽物」のはず。ワカモは最初からこれを狙って、矯正局の脱獄を試みたんだ。"
"10009065-42-チヒロ" = "みんなの視線を逸らして、誰にも邪魔されない形で先生と対峙するために……！"
"10009065-43-キリノ" = "……はいぃっ！？"
"10009065-44-フブキ" = "今すぐ先生に連絡を……！"
"10009065-45-チヒロ" = "無理。こっちからの通信は全部妨害されてる。"
"10009065-46-チヒロ" = "災厄の狐、一体どうやってあんな複雑なジャミングを……"
"10009065-47-フブキ" = "……あ。"
"10009065-48-チヒロ" = "ねぇ、ちょっと。今の「あ」ってもしかして……。"
"10009065-49-チヒロ" = "いや、もうそんなこと言ってる場合じゃないね。"
"10009065-50-チヒロ" = "連絡がつかない以上、もう手段は他に無い。"
"10009065-51-チヒロ" = "運転、できるでしょ？"
"10009065-52-チヒロ" = "……私？"
"10009065-53-ワカモ" = "ふふっ……♡これでしばらくは、遠距離から騒がしくされる心配もございません。"
"10009065-54-ワカモ" = "何となく奪ってきたものだったのですが、ヴァルキューレ警察学校の装備はなかなか便利ですねぇ。"
"10009065-55-ワカモ" = "そうは思いませんか、先生？"
"10009065-56" = "[s] \"ワカモ……。\""
"10009065-57-ワカモ" = "あぁ、この瞬間をどれだけ待ち望んだことか。"
"10009065-58-ワカモ" = "本当に、かなりの時間がかかってしまいましたね……あなた様の傍にはいつも誰かがいて、だいぶ苦労してしまいました。"
"10009065-59-ワカモ" = "本当に、あちこちから邪魔されてばかりで……。"
"10009065-60-ワカモ" = "何度も考え、策を練りました。どうすれば、あなたの元へ近づけるのか……。"
"10009065-61-ワカモ" = "誰からの邪魔もされずにこうしてあなた様の目の前に立つために、何をすれば良いのかと。"
"10009065-62" = "[s] \"そのために、ヴァルキューレを……？\""
"10009065-63-ワカモ" = "ふふっ。最大限派手に暴れまわり、私に視線を集中させる。注目が集まるようできるだけ派手に、華麗に、強烈に。"
"10009065-64-ワカモ" = "重ねに重ねて、ようやくです。やっとあなた様の元へ辿り着きました。"
"10009065-65" = "あぁ、そろそろ耐えられそうにありません……。"
"10009065-66" = "[ns] \"……っ！\""
"10009065-67-ワカモ" = "ようやく、私の願いが成就します……！"
"10009065-68-ワカモ" = "先生、どうかこれを……。"
"10009065-69" = "[s] \"……これ、チョコレート？\""
"10009065-70-ワカモ" = "はい♡あなた様のためだけに用意した、私からのチョコレートです♡"
"10009065-71" = "[s] \"これって……。\""
"10009065-72-フブキ" = "まぁ、せっかくのバレンタインデーだからね。チョコレートを渡して、渡し合って、幸せを感じられる日。"
"10009065-73-セナ" = "はい、何せバレンタインデーは大切な日。それぞれが胸に秘めた大事な思いを形にする特別な日ですから。"
"10009065-74" = "[ns] \"つまり、そういう……？\""
"10009065-75-ワカモ" = "一目惚れなんです……。"
"10009065-76-ワカモ" = "このワカモ、あなた様を初めて一目見た時から……ずっとずっとあなた様のことを恋しく思い、その溢れんばかりの想いをやっとの思いで抑えてまいりました。"
"10009065-77-ワカモ" = "そしてようやくこうして二人っきりで、"
"10009065-78-ワカモ" = "あなた様にチョコレートをお渡しできるタイミングが……！"
"10009065-79" = "[s] \"全部、このチョコを渡すために……？\""
"10009065-80-ワカモ" = "はい♡"
"10009065-81" = "[s] \"……。\""
"10009065-82" = "[s1] \"……これはありがたく受け取るね、すごく嬉しい。\"\n[s2] \"でも色々やり過ぎ！\""
"10009065-83-ワカモ" = "あぁ……っ！そこまで言ってくださるなんて……。"
"10009065-84-ワカモ" = "仕方ないこととはいえ、もっと早く行動に移せなかった自分を恨みます。そうすればもう少し早く、こうしてあなた様とお話が出来ましたのに……！"
"10009065-85-ワカモ" = "ふふっ、ふふふふっ……。"
"10009065-86" = "[s3] \"でもね、ワカモ。\""
"10009065-87-ワカモ" = "……？"
"10009065-88" = "[s4] \"こういうやり方は困るから、あんまり良くないと思うよ。\""
"10009065-89-ワカモ" = "えっ……こ、困る、ですか？"
"10009065-90" = "[s5] \"こういう方法は、間違ってる。\""
"10009065-91-ワカモ" = "ま、間違ってる……？"
"10009065-92-ワカモ" = "え、えぇっ……！？"
"10009065-93" = "[ns6] \"今日あちこちで色んな騒ぎになって。\""
"10009065-94" = "[ns7] \"それで、色んな人が怪我したよね。\""
"10009065-95" = "[ns8] \"そういうのは、あんまり良くないと思う。\""
"10009065-96-ワカモ" = "……！？"
"10009065-97-ワカモ" = "で、ですが先生……！"
"10009065-98-ワカモ" = "バレンタインデーと云うものは、自分の気持ちを素直に、そして全力でお伝えする日だと伺いました！"
"10009065-99-ワカモ" = "私はただ、この想いをどうにかお伝えしたくって……！"
"10009065-100" = "[s] \"それは本当に嬉しい、でも他人に被害を与えるやり方はダメだよ。\""
"10009065-101-ワカモ" = "わ、私は……！"
"10009065-102" = "[s9] \"今日、ワカモと同じことを考えてる人がたくさんいたと思う。\"\n[s10] \"その機会を失っちゃった人だって、もしかしたらいるかもしれない。\""
"10009065-103-ワカモ" = "……っ！"
"10009065-104-ワカモ" = "……っ！"
"10009065-105" = "[s] \"それを無視されると、私もこれを喜んで受け取れない。\""
"10009065-106-ワカモ" = "……っ！？"
"10009065-107-ワカモ" = "そ、そんな……？"
"10009065-108-ワカモ" = "私はただ、あなた様のことが……。"
"10009065-109-ワカモ" = "それを、喜んでいただけなくなる……？"
"10009065-110-ワカモ" = "だ、ダメ、ダメです。"
"10009065-111-ワカモ" = "それは、だって、あなた様に嫌われては、私は、私は……！"
"10009065-112" = "[s] \"……これからは、違うやり方を考えられるって信じてるよ。\""
"10009065-113-ワカモ" = "！！！"
"10009065-114-ワカモ" = "信じて、くださるのですか……？過ちを犯した私を、嫌わずに、いてくださるのですか……？"
"10009065-115" = "[s11] \"一回でダメなんてことは言わないよ、ワカモも大切な生徒だから。\"\n[s12] \"これからは頑張るって、約束してほしいな。\""
"10009065-116-ワカモ" = "私が、先生の……大切な、生徒……。"
"10009065-117-ワカモ" = "あ、あぁ……も、もちろん、もちろんです！はい！きっと、いえ必ずや！"
"10009065-118-ワカモ" = "このワカモあなた様に、先生に誓います！"
"10009065-119-ワカモ" = "これからは絶対に……！"
"10009065-120-ワカモ" = "先生がやるなと言われるのでしたら、そういったことは決して致しません……！"
"10009065-121" = "[s] \"じゃあ、約束。\""
"10009065-122-ワカモ" = "はい、約束です……！"
"10009065-123-ワカモ" = "あぁ、先生……私の先生……♡"
"10009065-124-ワカモ" = "また、私と先生の大事な時間を邪魔しようとする輩が……。"
"10009065-125-ワカモ" = "ですが……約束、致しましたから。あなた様と私の交わした、二人だけ約束……。"
"10009065-126-ワカモ" = "これさえあれば私、たとえ再びここで別れることになろうとも、きっと耐えてみせます。"
"10009065-127-ワカモ" = "では、またすぐお迎えに上がりますね。先生。"
"10009065-128" = "[s] \"あ、うん……？\""
"10009065-129-ワカモ" = "ふふっ。また再会できる時を、心待ちにしておりますね。"
"10009065-130-ワカモ" = "たとえ身体は離れても……あなた様のこと、心よりお慕いしておりますので♡"
"10009065-131-チヒロ" = "先生、無事！？"
"10009065-132-キリノ" = "あっ、フブキあそこです！災厄の狐さんが逃げて……！"
"10009065-133-フブキ" = "逃がすかぁ！待てーーーーっ！"
"10009065-134" = "（そうして再び騒がしくなる中で、しばらくの間ワカモがくれたチョコレートをじっと見つめていた）"
