[translation]
"10009010-1" = "第1話;襲撃その一"
"10009010-2" = "D.U.・中央通り沿い"
"10009010-3-セナ" = "ふむ。なかなか死た……"
"10009010-4-セナ" = "いえ、負傷者が出る気配はありませんね。"
"10009010-5" = "[s] \"良いことだね……。\""
"10009010-6-セナ" = "……ええ、そうですね。言っておきますが先生、私は決して興味本位で死……"
"10009010-7-セナ" = "負傷者を見たいと思っているわけでは……。"
"10009010-8-セナ" = "いえ、少しは見てみたいのですが。"
"10009010-9" = "[s] \"素直だ……。\""
"10009010-10-セナ" = "……しかしながら、せっかくのイベントですから何も起きないに越したことは無い。そう思っているのも事実です。"
"10009010-11-セナ" = "私たちの部はその活動内容からして、活躍の機会が無いことが平和を意味しますので。"
"10009010-12" = "[s] \"セナは真面目だね。\""
"10009010-13-セナ" = "……まあ、やはり多少残念ではありますが。"
"10009010-14" = "[s] \"そっかぁ……。\""
"10009010-15" = "（そうやってセナと色々会話をしつつ、大通りの終わりに着いた頃……）"
"10009010-16-チヒロ" = "……セキュリティシステムの再起動、OK。"
"10009010-17-チヒロ" = "これできちんと動くはずです。"
"10009010-18-店長" = "ありがとうございます！速いですね、さすがはヴェリタス！安心しました……！"
"10009010-19-チヒロ" = "いえ、大したことじゃありませんから。"
"10009010-20-チヒロ" = "じゃあ私はこれで。"
"10009010-21" = "[s] \"あっ、チヒロ。\""
"10009010-22-チヒロ" = "あれ、先生？"
"10009010-23-チヒロ" = "そっちの子は……ゲヘナの？"
"10009010-24-チヒロ" = "何してるの？バレンタインデーに二人っきりってことは……"
"10009010-25-チヒロ" = "あーその、何て言うのかな。えっと……"
"10009010-26-セナ" = "先生とパトロールを行っております。"
"10009010-27-セナ" = "死体確保のために。"
"10009010-28-チヒロ" = "し、死体？確保……？いったいどんな不法なことをやってるの？"
"10009010-29" = "[s] \"普通のパトロールだよ……チヒロの方は？\""
"10009010-30-チヒロ" = "何か怪しいけど……"
"10009010-31-チヒロ" = "ま、事情があるんだね。"
"10009010-32-チヒロ" = "私の方は……まあ、ヴァルキューレ警察学校からの依頼で。色々システムの整備とか、セキュリティの点検とか。"
"10009010-33-チヒロ" = "この辺に設置された通信機器が老朽化してないか、スプリンクラーとかのシステム制御部分が変になってないか、そういうチェックをね。"
"10009010-34-チヒロ" = "これだけ賑わってる状態だし、色々と気を付けておかないといけないことが多いから。"
"10009010-35" = "[s] \"チヒロも大変だね、お疲れ様。\""
"10009010-36-チヒロ" = "……ま、それほどでもないよ。"
"10009010-37-チヒロ" = "ヴェリタスに正式に入ってきた依頼だし。ヒマリがしばらく席を外してる以上、私がちゃんとしないとね。"
"10009010-38-チヒロ" = "それにほら、バレンタインデーだからさ。"
"10009010-39-チヒロ" = "大切な日でしょ。今日という日を安全に、大事に過ごせるように。そのためならこれくらいの手間は、ね。"
"10009010-40" = "[s] \"やっぱりチヒロはすごいね。\""
"10009010-41-チヒロ" = "だから、そんなんじゃないってば……。"
"10009010-42-チヒロ" = "ふう。じゃあ、せっかくだし……先生もパトロール中なんだよね？"
"10009010-43-チヒロ" = "次のところに向かうんだけど、方向が同じなら一緒に行かない？"
"10009010-44-セナ" = "はい。いつどこで死体、"
"10009010-45-セナ" = "ではなく負傷者がいるかも分かりません。迅速に始めましょう。"
"10009010-46-チヒロ" = "……本当に、危ないことしてたりしないよね？"
"10009010-47" = "[s] \"だ、大丈夫……。\""
"10009010-48-フブキ" = "いやー……護送は退屈だねぇ。"
"10009010-49-キリノ" = "フブキ、そんなにだらけていたら警備局長に怒られますよ……！"
"10009010-50-フブキ" = "まあまあ、むしろキリノの方は固くなり過ぎだよ。"
"10009010-51-キリノ" = "で、ですが護送中の対象が対象だけに……！"
"10009010-52-フブキ" = "えー、心配し過ぎじゃない？"
"10009010-53-キリノ" = "心配もしますよ……。"
"10009010-54-キリノ" = "なにせ、"
"10009010-55-キリノ" = "七囚人の中でも一番凶悪だと言われるあの「災厄の狐」さんですよ！？"
"10009010-56-キリノ" = "実際にたった一人で多くの問題児たちを扇動しつつ、いつぞやは連邦生徒会の面々を翻弄するほどの騒動を起こしていたって聞きましたし……！"
"10009010-57-キリノ" = "まあ、あの時は連邦生徒会長の失踪でバタバタしてたんだし。しょうがないでしょ。"
"10009010-58-キリノ" = "それを加味しても油断はできません。それに、先日とある噂を聞きました。"
"10009010-59-フブキ" = "噂……？"
"10009010-60-キリノ" = "「災厄の狐」さんは非常に邪悪で、その上とんでもなくずる賢くって……！"
"10009010-61-キリノ" = "ちょっと言葉を交わしただけで憑りつかれてしまうような、恐ろしい能力を持っているとか持っていないとか！？"
"10009010-62-フブキ" = "……それ、何の漫画？"
"10009010-63-フブキ" = "まあ、とにかく落ち着きなよキリノ。心配いらないって。"
"10009010-64-キリノ" = "ど、どうしてフブキはそこまで落ち着いてるんですか……。"
"10009010-65-フブキ" = "私たち生活安全局だけならまだしも、ここには警備局のやつらもあんなにいるんだよ？"
"10009010-66-フブキ" = "まああの綺麗な仮面やら服を剥ぐのは流石に躊躇したけど、逮捕した後に武器やらなんやらは全部回収したし。いくら災厄の狐と言ったって、あれでどうやって逃げるのさ？"
"10009010-67-フブキ" = "文字通り魔法でも使わない限り、まさかこの状況で脱走なんて――"
"10009010-68-フブキ" = "えぇー……？"
"10009010-69-キリノ" = "脱走したじゃないですかぁ！？"
"10009010-70-セナ" = "……爆発？"
"10009010-71-チヒロ" = "どうしたの急に、どこかのパイプでも爆発した？"
"10009010-72" = "[s] \"これ、ただの爆発じゃなくって……。\""
"10009010-73-アナウンサー" = "緊急速報です！先ほど、矯正局へと向かっていたヴァルキューレの車両が爆破！"
"10009010-74-アナウンサー" = "そこで多数の問題児集団が、暴行を働いているというニュースが入りました！"
"10009010-75-フブキ" = "先生、今どこ！？"
"10009010-76" = "[s] \"フブキ！？\""
"10009010-77-フブキ" = "護送中の車両が爆発して、「災厄の狐」が脱走した！そのタイミングで何か色んなやつらが襲ってきて、ヴァルキューレの装甲車やら装備やらが奪われて……！"
"10009010-78-フブキ" = "先生、助けて！このままじゃ……！"
"10009010-79-フブキ" = "始末書どころか、私の休暇が削られかねない！！"
"10009010-80-フブキ" = "「災厄の狐」が向かった方向は……！"
"10009010-81" = "[ns] \"……方向、こっちだったみたいだね。\""
"10009010-82-？？？" = "ふふふっ……匂いがしますねぇ。"
"10009010-83-ワカモ" = "決して、決して逃しはしません……！"
"10009010-84" = "#video;10009"
