[translation]
"10009040-1" = "第4話;襲撃その四"
"10009040-2-ヴァルキューレの生徒A" = "やはり「悪い警官」戦術ではダメだな。"
"10009040-3-ヴァルキューレの生徒B" = "やはり学ぶべきは「北風と太陽」……「良い警官」戦術の方で行こう！"
"10009040-4-ヴァルキューレの生徒A" = "よし！"
"10009040-5-ヴァルキューレの生徒B" = "やあワカモ、先ほどは済まなかったな。"
"10009040-6-ヴァルキューレの生徒B" = "こちらも気が立っていてな……せっかくのバレンタインデーだ、お詫びも兼ねてマカロンでもどうだ？"
"10009040-7-ヴァルキューレの生徒A" = "お互いこれを食べて落ち着きながら……"
"10009040-8-ヴァルキューレの生徒B" = "……え？"
"10009040-9-ヴァルキューレの生徒たち" = "い、いないだと……！？どこへ行った！？"
"10009040-10" = "（気を取り直して、セナと一緒にパトロールを……）"
"10009040-11" = "[s] \"……ちょっと待って。\""
"10009040-12-セナ" = "はい？"
"10009040-13" = "[s] \"何だか嫌な気配が……。\""
"10009040-14-フブキ" = "先生！"
"10009040-15" = "[s] \"来ると思った！\""
"10009040-16-ワカモ" = "もう少し、もう少しです……もうすぐ、この手で……！"
