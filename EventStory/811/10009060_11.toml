[translation]
"10009060-1" = "第6話;決着"
"10009060-2" = "矯正局南支部・第9矯正施設"
"10009060-3-キリノ" = "警備局の方々、忙しそうですね。"
"10009060-4-フブキ" = "まあ、今や前までとは比べ物にならないくらい、警備のレベルを上げてるからね……。"
"10009060-5-フブキ" = "ここまでやって脱獄されたら、"
"10009060-6-フブキ" = "もう「やっちゃいました」じゃ済まないだろうなぁ……。"
"10009060-7-フブキ" = "それが分かってるからこそ、ここまでガチガチに防備を固めてるんだろうけど。"
"10009060-8-キリノ" = "そうですね。それにミレニアムのお二人が、特にネットワーク周りのセキュリティをチェックしてくれてますし！"
"10009060-9-フブキ" = "その当人たち、さっき到着するやいなや「これ、本当にセキュリティとしての意味ある……？」とか言いながらげんなりした顔してたけどね。"
"10009060-10-フブキ" = "まあこれで流石に大丈夫……なはずなんだけど。"
"10009060-11-キリノ" = "フブキ、何か気になることでも？"
"10009060-12-フブキ" = "何かスッキリしないっていうか、引っ掛かるっていうか……。"
"10009060-13-フブキ" = "……考えすぎかねぇ。"
"10009060-14-フブキ" = "あの、ところでフブキ。"
"10009060-15-フブキ" = "さっき捕まえてからというものの「災厄の狐」さんがずっと無言で、すごく怖いのですが！？"
"10009060-16-フブキ" = "……まあ、舌先三寸で相手を惑わすようなやつらしいし、何も話しかけられない方がむしろ良いんじゃない？"
"10009060-17-キリノ" = "それは全部嘘だって、さっきフブキが言ってたじゃないですか……！？"
"10009060-18-フブキ" = "え、そうだっけ。"
"10009060-19-フブキ" = "まぁまぁ……。"
"10009060-20-フブキ" = "えーっと、そこの災厄の狐。"
"10009060-21-フブキ" = "一応警告しておくけど。"
"10009060-22-フブキ" = "いい加減にそろそろ、変なこと考えるのはやめた方が良いよ。"
"10009060-23-フブキ" = "こちとらあんたが脱獄したせいで始末書どころか、有休も成果給も消えるところだったんだから！"
"10009060-24-キリノ" = "え？フブキ、成果給なんて貰ったことありましたっけ？"
"10009060-25-フブキ" = "今そういうは良いの！警告なんだから、軽い見栄くらい張っても良いでしょ！"
"10009060-26-キリノ" = "な、なるほど！ではえっと……わ、私だって、反省文を100枚も書かされることになったんですからね！"
"10009060-27-キリノ" = "うっ、反省文を100枚も……。"
"10009060-28-フブキ" = "何で自分の見栄でダメージ受けるのさ！本当じゃないんでしょ！？"
"10009060-29-フブキ" = "まあとにかく……"
"10009060-30-フブキ" = "何にせよ、よくここまで暴れたもんだよ。"
"10009060-31-フブキ" = "最初の方はザルだったとはいえ、それは素直に驚いてる。"
"10009060-32-フブキ" = "「災厄の狐」っていうのも、強ち誇張じゃなかったみたいだね。"
"10009060-33-フブキ" = "……。"
"10009060-34-フブキ" = "ねぇ、あんたシャーレの先生を狙ってたでしょ？"
"10009060-35-フブキ" = "それは何で？前に負かされたから、その分の復讐とか？……まあ、別に何でも良いんだけどさ。"
"10009060-36-フブキ" = "とにかく、今度こそ諦めた方が良い。今回はヴァルキューレだけじゃなく、色んなところからみんな来てるんだから。"
"10009060-37-ワカモ" = "そうですね。いくら災厄の狐さんだとしても、ここまで厚い警備をかいくぐれるはずはありません！"
"10009060-38-ワカモ" = "……。"
"10009060-39-ワカモ" = "……だんまり？"
"10009060-40-フブキ" = "それとも、落ち込んでるとか？"
"10009060-41-フブキ" = "まぁ、それは分からなくもないけど。せっかく矯正局から脱獄できたと思ったのに、こうして捕まっちゃったらそりゃ気落ちもするよ。"
"10009060-42-フブキ" = "でも悪いけど諦めてもらうよ。もう今は私たちだけじゃない、みんなの目線が集中してるんだから。"
"10009060-43-キリノ" = "フブキ、あの……。"
"10009060-44-フブキ" = "ん？どしたのキリノ。"
"10009060-45-キリノ" = "その、何と言いますか。フブキの言い方が何だかフラグっぽく聞こえてしまうと言いますか……。"
"10009060-46-フブキ" = "何言ってんのキリノ、"
"10009060-47-フブキ" = "フラグなんて信じてたらヴァルキューレやってられないよ。"
"10009060-48-フブキ" = "まさか今の発言のせいで、脱獄されちゃうわけでも――"
"10009060-49-フブキ" = "いぃっ！？"
"10009060-50-キリノ" = "な、何が起きたんです！？"
"10009060-51-チヒロ" = "ねぇ、そっちにちゃんとワカモいるよね！？"
"10009060-52-フブキ" = "……え？"
"10009060-53-キリノ" = "は、はいっ！目の前にいますが……！？"
"10009060-54-チヒロ" = "……じゃあこの状況は一体どういうこと？監視カメラにワカモが映って……"
"10009060-55-チヒロ" = "待って、一人じゃない！？"
"10009060-56-チヒロ" = "二人、いや三人……！？"
"10009060-57-フブキ" = "……っ！"
"10009060-58-フブキ" = "キリノ、そいつの仮面取って！"
"10009060-59-キリノ" = "え、"
"10009060-60-キリノ" = "えぇっ！？"
"10009060-61-チンピラ１" = "あ、バレた。"
"10009060-62-キリノ" = "だ、だだっ誰ですか！？"
"10009060-63-フブキ" = "……やられた。入れ替わってたなんて……！"
"10009060-64-フブキ" = "待った、ってことは本人は……！？"
"10009060-65-フブキ" = "いったい何が起きてるんですかこれ！？"
"10009060-66-チヒロ" = "……まさかっ！"
"10009060-67-ワカモ" = "あぁ、だいぶ時間がかかってしまいました……。"
"10009060-68-ワカモ" = "このワカモ、ずっとこの瞬間だけを待ちわびて……。"
"10009060-69-ワカモ" = "ようやく全ての視線が私から外れ、矯正局の方へと向きました。"
"10009060-70-ワカモ" = "さぁ、ようやくお伺いできますわ……"
"10009060-71-ワカモ" = "……先生♡"
