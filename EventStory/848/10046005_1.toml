[translation]
"10046005-1" = "プロローグ;苦渋の選択"
"10046005-2" = "[log]これまでのあらすじ[/log]"
"10046005-3-ハスミ" = "……カバンを今日中にティーパーティーに持って行ってほしいのです。"
"10046005-4-ハスミ" = "また、カバンはトリニティ自治区から離れた場所にあるため……。"
"10046005-5-？？？" = "ハーハッハッハッハ！"
"10046005-6-カスミ" = "先生は何用で、わざわざこんな僻地に来たんだ？"
"10046005-7-イチカ" = "[ruby=きぬがわ]鬼怒川[/ruby]、カスミ……？"
"10046005-8-イチカ" = "……ゲヘナの指名手配犯じゃないっすか。"
"10046005-9" = "（紆余曲折の末、カバンは温泉開発部の部長――鬼怒川カスミの手に渡り）"
"10046005-10-イオリ" = "何なんだよ、この組み合わせは――！？"
"10046005-11-イオリ" = "この列車、ゲヘナ行きだろ……？#n何でトリニティの正義実現委員がここにいるんだよ！？"
"10046005-12-イオリ" = "それにカスミって……あのカスミか……！？"
"10046005-13-イオリ" = "まさか先生、ずっとアイツと一緒にいたんじゃないよな……？#nなあ……違うと言ってくれ！！"
"10046005-14" = "（ゲヘナ風紀委員会の乱入で、状況はさらに混迷を極め……）"
"10046005-15-カスミ" = "つまりトリニティの子と先生は、私の言いなりになるしかない。#nなあ、そこのお嬢ちゃん？"
"10046005-16-カスミ" = "まあ、見てみなって。あのお嬢ちゃんがどんな選択をするか……#nこのカバンを取り戻すためにイオリちゃんを撃つはずさ。"
"10046005-17-カスミ" = "なあ？正義実現委員の……ええと。"
"10046005-18-カスミ" = "……ニカちゃん？"
"10046005-19-カスミ" = "そうだろ？この中身、割れたらまずいんだろう？"
"10046005-20-イチカ" = "…………。"
"10046005-21-イオリ" = "あーーっもう！！さっきからカバン、カバン、カバンってもう……！！！"
"10046005-22-イチカ" = "…………。"
"10046005-23-イオリ" = "たかがカバン1つでぐだぐだと――"
"10046005-24-カスミ" = "……おっ？"
"10046005-25-カスミ" = "あは！あはははっ！！"
"10046005-26-カスミ" = "ハーハッハッハッハ！！！"
"10046005-27-カスミ" = "ほら、だから言っただろう！？"
"10046005-28-カスミ" = "こちらの勝ちは目に見えていたじゃないか～まったく。"
"10046005-29-カスミ" = "お嬢ちゃんは、こちらにカバンがある以上絶対――"
"10046005-30-カスミ" = "……ごふっ！？"
"10046005-31-イチカ" = "…………あ。"
"10046005-32-イチカ" = "……撃っちゃったっす。"
"10046005-33" = "（……こうしてトリニティとゲヘナを騒がせた列車事件は、#n苦い後味を残して幕を下ろしたのだった）"
"10046005-34-カスミ" = "どうしても！と言うから来てみれば……。"
"10046005-35-カスミ" = "まさか、[ruby=・]イ[/ruby][ruby=・]チ[/ruby][ruby=・]カ[/ruby]ちゃんからのラブコールだったとは。"
"10046005-36-イチカ" = "……。"
"10046005-37-カスミ" = "先生を動かしてまで、私を呼びだすとはねぇ。"
"10046005-38-カスミ" = "私を捕らえるため……ではなさそうだ。#nはてさて、一体どういうご用向きかな？"
"10046005-39-イチカ" = "……。"
"10046005-40-イチカ" = "……っす。"
"10046005-41-カスミ" = "ん～？"
"10046005-42-イチカ" = "助けて……ほしいっす。"
"10046005-43-カスミ" = "……ほぅ？"
"10046005-44-カスミ" = "は、ははっ！ハーハッハッハッハ！！"
"10046005-45-カスミ" = "どういう風の吹き回しだ？#nあのイチカちゃんからそんな言葉を聞けるだなんて。"
"10046005-46-カスミ" = "ああ、安心してくれ。もちろん助けるとも。私たちの仲じゃあないか。"
"10046005-47-イチカ" = "…………。"
"10046005-48-カスミ" = "だが……お嬢ちゃんは決して非力ではないだろう？#n列車の時だって、一人ですべて片付けていたと思うのだが。"
"10046005-49-カスミ" = "それに比べて私は、善良でか弱い一般人なものでね。#n場合によっては～力不足かも……分からんなぁ？"
"10046005-50-イチカ" = "……あの時のことは――"
"10046005-51-イチカ" = "――私が悪かったっす。"
"10046005-52-イチカ" = "だから、許してほしいっす。"
"10046005-53-カスミ" = "なるほど、そう聞こえてしまったか。"
"10046005-54-カスミ" = "……我々は似ている。あの列車で、私はそう言ったはずだ。"
"10046005-55-カスミ" = "これは私の話なんだが……。#nたとえどれほど小さな恨みであっても、決して忘れはしない。"
"10046005-56-カスミ" = "君には心底嫌われているものだとばかり思っていたのだがね。"
"10046005-57-イチカ" = "…………。"
"10046005-58-カスミ" = "おやおやおや？勘違いではなかったようだ！#nそう、その眼だ。私への[ruby=てきがいしん]敵愾心[/ruby]に満ちた、その眼。"
"10046005-59-イチカ" = "…………。"
"10046005-60-カスミ" = "実に面白い。それでも私に頭を下げるのかね？#nはてさて一体何のために？"
"10046005-61-カスミ" = "詳しく、聞かせてもらおうじゃないか。"
"10046005-62" = "#video;10046"
