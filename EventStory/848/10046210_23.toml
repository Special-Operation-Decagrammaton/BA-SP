[translation]
"10046210-1-ヒナ" = "……やっぱり。"
"10046210-2-ヒナ" = "最近、妙に静かだと思ったら。これが理由だったのね。"
"10046210-3-イチカ" = "……ゲヘナの風紀委員長！？"
"10046210-4-ヒナ" = "ああ、気をつかわせてしまったかしら。"
"10046210-5-ヒナ" = "用事が終わればすぐに帰るから。"
"10046210-6-イチカ" = "あ、いや……その……。"
"10046210-7-イチカ" = "どうして、その格好を……？"
"10046210-8-ヒナ" = "海だもの。濡れてもいい服装を選んだだけよ。"
"10046210-9-イチカ" = "あー……なるほどっすね。"
"10046210-10-イチカ" = "それで、用事っていうのは……？"
"10046210-11-イチカ" = "遊びに来た……わけじゃなさそうっすけど。"
"10046210-12-ヒナ" = "……そうね。変な誤解を招く前に、きちんと釈明させてもらうわ。"
"10046210-13-ヒナ" = "まず、事前通達もせず立ち入ってごめんなさい。#nこれは風紀委員会からの正式な謝罪として受け取ってちょうだい。"
"10046210-14-ヒナ" = "えっ！？いやいや、顔を上げてください！"
"10046210-15-ヒナ" = "ゲヘナの風紀委員長として、その影響力を考慮すべきだったわ。"
"10046210-16-ヒナ" = "ただし今回の訪問は、あくまで[ruby=そらさき]空崎[/ruby]ヒナ個人によるもの。"
"10046210-17-イチカ" = "……。"
"10046210-18-ヒナ" = "と言ったところで、正義実現委員会としては納得できないわよね。"
"10046210-19-イチカ" = "そうっすね……。"
"10046210-20-ヒナ" = "用事というのは、問題児の取り締まり。#nすでにいくつかの騒ぎを起こしているようだし。"
"10046210-21-イチカ" = "まあ、はい……。"
"10046210-22-ヒナ" = "でも、風紀委員会がティーパーティーの私有地に立ち入っては、話がややこしくなる。一般公開されているとはいえね。"
"10046210-23-ヒナ" = "それはそれとして、ゲヘナ生が起こす騒ぎを放置もできない。#nこれ以上、事を荒立てたくはないの。"
"10046210-24-イチカ" = "だから、一人で来たんすか……？"
"10046210-25-イチカ" = "ええ、個人というスタンスをとれば、いくらか政治的リスクを抑えられるから。"
"10046210-26-ヒナ" = "……まあ、苦肉の策だけど。"
"10046210-27-ヒナ" = "そこで、一つ提案があるの。"
"10046210-28-ヒナ" = "よかったら、[ruby=・]外[/ruby][ruby=・]部[/ruby][ruby=・]の[/ruby][ruby=・]ボ[/ruby][ruby=・]ラ[/ruby][ruby=・]ン[/ruby][ruby=・]テ[/ruby][ruby=・]ィ[/ruby][ruby=・]ア[/ruby]を一人、#nパトロールに加えてもらえないかしら？"
"10046210-29-イチカ" = "風紀委員長をですか！？"
"10046210-30-ヒナ" = "違うわ。ただの空崎ヒナよ。"
"10046210-31-イチカ" = "あ、そうでした。#nその、ヒナさん……が手伝ってくださるなら、大助かりっす！"
"10046210-32-ヒナ" = "ありがとう。じゃあ、決まりね。"
"10046210-33-イチカ" = "なんというか……今なら誰にも負けない気がするっす。"
"10046210-34-ヒナ" = "別にそうでもないわ。#n正義実現委員会には、立派な先輩たちがいるでしょう？"
"10046210-35-ヒナ" = "特別私の方が秀でているわけでもないもの。"
"10046210-36-ヒナ" = "では、行きましょう。"
"10046210-37-イチカ" = "……あれが、ゲヘナの風紀委員長。"
"10046210-38-イチカ" = "誰かさんがやたらと怖がるのも、少しは分かるというか……。"
"10046210-39-イチカ" = "……あれ？#nなのに、問題児たちの素行が一向に改善されないのは……。"
"10046210-40-イチカ" = "……。"
"10046210-41-イチカ" = "深く考えるのはやめよう。"
