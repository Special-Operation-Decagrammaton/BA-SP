[translation]
"10046030-1" = "第3話;ストーリーテラーのシナリオ"
"10046030-2-？？？" = "ナギサ、起きてくれ。"
"10046030-3-？？？" = "到着だ。"
"10046030-4-セイア" = "おや、先生。#n出迎えがあるとは思わなかった。"
"10046030-5-セイア" = "待たせて済まない。#nもっとスピードを出すべきだったな。"
"10046030-6-セイア" = "ナギサ、ナギサ。"
"10046030-7-ナギサ" = "う、うぅん……。#nもう陸地に着いたのですか……？"
"10046030-8-セイア" = "ずっと陸地を走っていたのだが……空を飛ぶ夢でも見ていたのかい？"
"10046030-9-ナギサ" = "いえ、そもそも眠ってなどいません……#nとにかく、今日からは動かない地面だけを陸地と呼ぶことにします。"
"10046030-10-セイア" = "ナギサ、地面は元々動かないものだよ。"
"10046030-11-ナギサ" = "セイアさん……運転のクセは、まだ直っていなかったのですね……。"
"10046030-12-セイア" = "まるで私が危険運転をしたかのような言い草だね。#n法定速度を遵守したつもりだが？"
"10046030-13-ナギサ" = "この辺りの道路には速度制限なんて無いではありませんか！！"
"10046030-14-ナギサ" = "……あ、先生。"
"10046030-15-ナギサ" = "到着早々、お見苦しい姿を……。"
"10046030-16-セイア" = "こんなビーチで、堅苦しい挨拶はいただけないな。"
"10046030-17-セイア" = "……ん？先生？"
"10046030-18-セイア" = "まるで不思議なものを見るかのような目をしているね。"
"10046030-19" = "[s1] \"二人とも……。\"\n[s2] \"……楽しむ気満々だね！\""
"10046030-20-セイア" = "当然だ。遊びに来ているのだから。"
"10046030-21-セイア" = "普段の生活を忘れ……僅かばかりの逸脱が許される日。#n変わらず無為に過ごすのは、勿体無いだろう？"
"10046030-22-ナギサ" = "私は違います。#nお二人があまりにも強く言うものですから……。"
"10046030-23-セイア" = "また始まったか。"
"10046030-24-セイア" = "今日はプライベートだろう？他人の目もない。#n好きに楽しむがいいさ。"
"10046030-25-ナギサ" = "失礼。"
"10046030-26-セイア" = "[ruby=ゆりぞの]百合園[/ruby]セイアだ。#n君はティーパーティーの……ああ、かけ間違いではない。"
"10046030-27-セイア" = "知っての通り、ナギサは休暇中だ。#n……そう。該当業務はすべて私のほうへ回してくれ。では。"
"10046030-28-ナギサ" = "セイアさん……？"
"10046030-29-セイア" = "約束を忘れるには些か早すぎるだろう。#nそれとも、端から守るつもりがなかったのかい？"
"10046030-30-セイア" = "すでにケリをつけた議題だ。#n今日の業務はすべて――"
"10046030-31-ナギサ" = "……セイアさんにお任せする。#nはい、たしかにそのように約束していました。"
"10046030-32-ナギサ" = "しかし、連絡手段を奪うのは流石に――"
"10046030-33-セイア" = "約束と関係ない、とは言うまいな？"
"10046030-34-セイア" = "敢えて遠方まで足を運び、バカンスを楽しむ理由は何か。"
"10046030-35-セイア" = "ルーチン化した日常生活から離れ、心身ともに休息できる環境をつくる。#nそれが、本来の目的だと理解しているがね。"
"10046030-36-セイア" = "それとも、私の理解に誤りでも？"
"10046030-37-ナギサ" = "……いえ。セイアさんのおっしゃる通りです。"
"10046030-38-セイア" = "では、このスマホは私が預かっておこう。"
"10046030-39-セイア" = "日常との連絡手段が残っていては、君を仕事から分離したとは言えないからね。"
"10046030-40-ナギサ" = "それは飛躍しすぎでは……。"
"10046030-41-セイア" = "まぁ、君がどんな選択をしようと、私は構わないさ。"
"10046030-42-セイア" = "だが、ミカはどう思うだろうね？"
"10046030-43-ナギサ" = "……！"
"10046030-44-セイア" = "ナギサは最初から約束を守るつもりがなかった……#nそれを知ってしまったミカは、果たしてどんな表情をするだろうか。"
"10046030-45-セイア" = "ふむ、俄然興味が湧いてきた。#nナギサは私の好奇心を満たしてくれるか否か、さあ楽しみだね。"
"10046030-46-ナギサ" = "くっ……！"
"10046030-47-ナギサ" = "はあ、分かりました。私のスマホはセイアさんにお預けします。"
"10046030-48-ナギサ" = "ミカさんだけで手一杯なのに……。"
"10046030-49-ナギサ" = "どうしてセイアさんまで……。"
"10046030-50-セイア" = "ふむ、あれでナギサは押しに弱いのか。"
"10046030-51-セイア" = "どうだい、先生。#nミカの真似事……我ながら、中々の出来だったと思うのだが。"
"10046030-52" = "[s3] \"今のって、ミカの真似だったの？\"\n[s4] \"似てる……かな？\""
"10046030-53-セイア" = "おや、冴えない反応だね。"
"10046030-54-セイア" = "まあいいさ。次また挑戦してみよう。#nまだ、ナギサの真似が残っているからね。"
"10046030-55-セイア" = "先生。"
"10046030-56-セイア" = "もしかすると……いや、確実に君は「特別な何か」を見ることになる。#n強いて言うならば……これはある種の前日譚。"
"10046030-57-セイア" = "「お姫様を乗せたカボチャの馬車。#n　その馬車引きネズミは、どこから来たのか」"
"10046030-58-セイア" = "そう、これはそういう物語だ。"
"10046030-59-セイア" = "……あぁ、つい悪い癖が出てしまったね。そう難しい話ではないのさ。"
"10046030-60-セイア" = "平たく言えば……。"
"10046030-61-セイア" = "すなわち……。"
"10046030-62-セイア" = "いや、やめておこう。"
"10046030-63" = "[s5] \"き、気になる！\"\n[s6] \"続き……続きは！？\""
"10046030-64-セイア" = "ふふ、ネタバレはよくないからね。"
"10046030-65-セイア" = "「先に知っている」ことほど、面白味に欠けるものもないさ。"
"10046030-66-セイア" = "……シリアスな話をするつもりはなかったんだ。"
"10046030-67-セイア" = "そう重く捉えないでくれ。#n無論、これを聞けば先生が戸惑うだろうことは、想定の範疇だがね。"
"10046030-68-セイア" = "この目で見たい……確かめたいという悪い癖は、中々治らないものだ。"
"10046030-69-セイア" = "……ん？何か言いたげな顔だね。"
"10046030-70-セイア" = "治すつもりなんて微塵もないくせに。#n君が考えているのはそんなところかな？"
"10046030-71-セイア" = "然らば、私からの返事は至ってシンプルだ。#n当然だろう？とね。"
"10046030-72-セイア" = "その「悪い癖」だって、今の百合園セイアを構成する一要素なのだから。"
"10046030-73-セイア" = "もしかすると、治すという表現自体、語弊があるのかもしれない。#nこれはより根深いところに作用する、根源的な変化の話だからね。"
"10046030-74-セイア" = "とはいえ、今日はさすがに自重しようか。"
"10046030-75-セイア" = "自己中心的で、後先考えないおてんば娘が、苦心の末に用意した一日だからね。"
"10046030-76-セイア" = "あくまで、同じティーパーティーの一員として――"
"10046030-77-セイア" = "いや、友人として、誠心誠意臨まなければ失礼だろうさ。"
"10046030-78" = "（ドサッ！バターン！）"
"10046030-79-セイア" = "今の音は？"
"10046030-80-セイア" = "砂浜のほうからだな。"
"10046030-81" = "[s7] \"あっ、そういえば……！\"\n[s8] （さっき押収した温泉開発部の資材がまだ……！）"
"10046030-82-ナギサ" = "ええと……。"
"10046030-83-ナギサ" = "これは……何でしょうか。"
"10046030-84-ナギサ" = "こんなものがあった記憶はないのですが……。"
"10046030-85-ミカ" = "な、ナギちゃん！？"
"10046030-86-ミカ" = "わ、私が全部説明するから！"
"10046030-87-ナギサ" = "いいえ、結構です。"
"10046030-88-ミカ" = "（ど、どうしよう……）"
"10046030-89-ミカ" = "（やっぱり怪しまれてる！）"
"10046030-90-ミカ" = "（このままだと……）"
"10046030-91-ナギサ" = "危険が潜む場所で、のんきに遊んでなどいられません。"
"10046030-92-ナギサ" = "より安全なところへ移動しましょう。"
"10046030-93-ナギサ" = "ここから一番近いセーフハウスは――"
"10046030-94-ミカ" = "じゃ、じゃあ、このバカンスは……？"
"10046030-95-ナギサ" = "もちろん、中止です。"
"10046030-96-ミカ" = "ダメぇぇぇぇーっ！！！"
"10046030-97-ナギサ" = "っ！？#nいきなり大声を出して、どうしたのですか？"
"10046030-98-ミカ" = "あ、ううん！ナギちゃん、これはね！"
"10046030-99-ナギサ" = "はぁ……大方予想がつきますが……#n困りましたね……。"
"10046030-100-ミカ" = "ちゃんと説明するから！"
"10046030-101-ナギサ" = "いえ、結構です。"
"10046030-102-ナギサ" = "この件に関しては、黙認することにいたしましょう。"
"10046030-103-ミカ" = "……え？"
"10046030-104-ナギサ" = "可能性の一つとして、想定はしていました。#n私たちの代になってからは、使ってこなかったのですから。"
"10046030-105-ナギサ" = "今さら、私有地だから荷物を除けろと言っても、近隣住民は納得しないでしょう。"
"10046030-106-ナギサ" = "……ですが、この量には少々驚きました。#nどこかで工事でも行われるのでしょうか？"
"10046030-107-ミカ" = "え……あれ？"
"10046030-108-ミカ" = "あ、あぁ～そういえば！今朝、工事の関係者さんが来たんだ！#nちょっとここに物を置かせてもらう、とか言ってたような～？"
"10046030-109-ミカ" = "報告するの忘れちゃってた☆"
"10046030-110-ナギサ" = "はい？#nそれは……そちらの方が問題かと。"
"10046030-111-ミカ" = "ごめんってば～準備で忙しかったんだよ～"
"10046030-112" = "それよりさ、早くお昼食べない？私お腹空いちゃった！"
"10046030-113-ナギサ" = "まったく、あなたはいつもいつも……。"
"10046030-114-ミカ" = "…………。"
"10046030-115-ミカ" = "なんとか、誤魔化せたかな……？"
"10046030-116-セイア" = "ミカ。"
"10046030-117-ミカ" = "わっ、セイアちゃん！いたの？"
"10046030-118-セイア" = "ああ。楽しそうだったから、声をかけるのはためらわれてね。"
"10046030-119-セイア" = "良い演技だった。#nトリニティを欺いてみせただけのことはある。"
"10046030-120-ミカ" = "そ、その話するのあり！？"
"10046030-121-セイア" = "ふふ、すまない。#n君の慌てた様子を見ていると、つい意地悪を言いたくなってしまうんだ。"
"10046030-122-セイア" = "それより今日のナギサは……なるほど、やはり。"
"10046030-123-セイア" = "予想より早い気はするが、長らく多忙を極めていたからね。"
"10046030-124" = "[s9] \"やはりって？\"\n[s10] \"やっぱり気になる……！\""
"10046030-125-セイア" = "落ち着かない様子を見せる者はここにもいたか。"
"10046030-126-セイア" = "言うのは構わないが。"
"10046030-127-セイア" = "…………。"
"10046030-128-セイア" = "いや、ネタバレはよしておこう。"
"10046030-129-ミカ" = "セイアちゃんはす～ぐそういう言い方するんだから。"
"10046030-130-セイア" = "これが私の性分なものでね。#nむしろ、そろそろ君が汲み取れるようになって欲しいくらいだ。"
"10046030-131-ミカ" = "むっかぁ……！"
"10046030-132-ミカ" = "はぁ……ここは我慢しないと。"
"10046030-133-セイア" = "ふむ？"
"10046030-134-ミカ" = "計画は順調だし、別に怒る必要はないもんね！"
"10046030-135-ミカ" = "あとは材料さえ届けば、お昼のバーベキューを始められるし――"
"10046030-136-ミカ" = "あれ、今何時？"
"10046030-137-ミカ" = "12時40分……？"
"10046030-138-ミカ" = "う～ん……12時半には届くはずなのに……。"
"10046030-139-ミカ" = "なんか嫌な予感……。"
"10046030-140-ミカ" = "う、ううん！大丈夫！"
"10046030-141-ミカ" = "まさかトラブルなんて……。"
"10046030-142-ミカ" = "13時に……なっちゃった……。"
"10046030-143-ミカ" = "ちょっと電話してみるね。"
"10046030-144-ミカ" = "あ、もしもし？#n今日、バーベキ――"
"10046030-145-ミカ" = "えっ！？"
"10046030-146-ミカ" = "ま、待って。どういうこと？#n……え？"
"10046030-147-ミカ" = "トラックが襲撃されて……って、聞き間違いだよね……？"
"10046030-148-ミカ" = "え、ごめん、もうちょっと詳しく説明してくれる？"
"10046030-149-ミカ" = "うん、うん。"
"10046030-150-ミカ" = "配送してたトラックがジャックされて、失踪中……？"
"10046030-151-ミカ" = "どうしてそうなるの！？"
"10046030-152-ミカ" = "いやいや！運んでるのって、お金とか宝石じゃないんだよ？"
"10046030-153-ミカ" = "も、もちろん一番良いものではあるけど……食材だよ？"
"10046030-154-ミカ" = "今、叫び声が聞こえたような……なにかトラブルでも？"
"10046030-155-ミカ" = "き、気のせいじゃないかな？#n大丈夫だから、ナギちゃんは休んでて！"
"10046030-156-イチカ" = "あの……何かあったんすか？"
"10046030-157-ミカ" = "い、イチカちゃん！？ならいっか……。"
"10046030-158-ミカ" = "えと……信じられないと思うんだけど……。"
"10046030-159-イチカ" = "うーん……食材目当てにトラックを襲いそうな集団っすか……。"
"10046030-160-イチカ" = "少なくとも、片手じゃ足りないくらいは思いつくっすね……。"
"10046030-161-ミカ" = "そんなに！？"
"10046030-162-イチカ" = "まあ……この仕事をしてると、色々あるんすよ。"
"10046030-163-イチカ" = "それより、どうするっすか？#n今から買い物に行くにしても、時間かかっちゃいますし……。"
"10046030-164-イチカ" = "あ。一応持ってきたパンとソーセージがあるっす。#n味気ないっすけど、お昼にはなると思うっすよ。"
"10046030-165-ミカ" = "それは……ダメ！"
"10046030-166-イチカ" = "どうしてっすか？"
"10046030-167-ミカ" = "お昼はバーベキューって、ナギちゃんに言っちゃったんだもん。"
"10046030-168-ミカ" = "なのにバーベキューじゃなかったら、バカンスはそこで終わりなんだよ！"
"10046030-169-イチカ" = "いや……それはちょっと飛躍しすぎじゃないっすか……？"
"10046030-170-ミカ" = "用意できなかった理由に、ナギちゃんが気づいたら……？"
"10046030-171-イチカ" = "あー……それは、ちょっとヤバいかもっすね。"
"10046030-172-ミカ" = "でしょ！？#nでも、いきなりバーベキューの準備なんてできないよ……。"
"10046030-173" = "[ns11] \"可能性が……あるかも、しれない。\"\n[ns12] \"でも、この手だけは……使いたくなかったのに……！\""
"10046030-174" = "[ns] \"使いたくなかったのにっ！！！\""
"10046030-175-ミカ" = "せ、先生！？大丈夫？"
"10046030-176-ミカ" = "えーと……その方法だと、先生が困ることになっちゃうの？"
"10046030-177-ミカ" = "無理はしなくていいんだよ？#nあくまで私たちの問題だからね。"
"10046030-178-ミカ" = "え？心配なのは……私？どういうこと？"
"10046030-179-ミカ" = "私のことなら、別に遠慮しなくていいよ。"
"10046030-180-ミカ" = "どんな方法かは知らないけど、今日のためなら何でもするって決めたからね！"
"10046030-181-？？？" = "……なるほど。事情は分かりました。"
"10046030-182-ハルナ" = "美食について私たちを頼ったのは――"
"10046030-183-ハルナ" = "良い選択と言えるでしょう。うふふっ。"
