[translation]
"10046060-1" = "第6話;今再び、交渉の先、手にするモノ"
"10046060-2-イチカ" = "……ダメっぽいっすね。"
"10046060-3-イチカ" = "地面が完全に陥没してるっす。#n施設の再建どころか、このビーチの安全性すら怪しいくらい――"
"10046060-4-ミカ" = "どうしてこうなっちゃうんだろ……。"
"10046060-5-ミカ" = "なんで……どうして、よりによって今日なの？"
"10046060-6-イチカ" = "ミカ様……。"
"10046060-7-ミカ" = "…………。"
"10046060-8-ミカ" = "……ううん、誰も悪くない。"
"10046060-9-ミカ" = "私も知ってるよ。だから、大丈夫。"
"10046060-10-ミカ" = "……ごめんね、みんな手伝ってくれたのに。"
"10046060-11-ミカ" = "でも……なんでこうなっちゃうかなぁ……。"
"10046060-12-イチカ" = "こんなの、事故じゃないですか。"
"10046060-13-イチカ" = "ミカ様の頑張りが無駄になるわけじゃ……！"
"10046060-14-ミカ" = "ありがとう、イチカちゃん。"
"10046060-15-ミカ" = "でもさ、こうなったら……のんきに遊ぶのは無理だよね。"
"10046060-16-ミカ" = "素直に……ナギちゃんとセイアちゃんに言おう。"
"10046060-17-ミカ" = "帰る準備、始めよっか。寮に着くのが遅くなっても良くないもんね。"
"10046060-18-イチカ" = "いや、でも……それは……。"
"10046060-19-イチカ" = "…………。"
"10046060-20-イチカ" = "先生……何かないですか？"
"10046060-21-イチカ" = "ほらその、全部解決できちゃう秘策とか……#nせめて、ミカ様を元気づける何かとか……。"
"10046060-22" = "[s1] \"ごめん、今回ばかりはさすがに……。\"\n[s2] \"みんなの安全が第一だよ。\""
"10046060-23-イチカ" = "……ですよね。"
"10046060-24-イチカ" = "地盤が不安定ってことは、ここら一帯が危ないってことですし。"
"10046060-25-イチカ" = "先生の立場からして――#nいえ、護衛の私からしても、ここで中止にするのが賢明な判断ですね。"
"10046060-26-イチカ" = "…………。"
"10046060-27-イチカ" = "……地盤。"
"10046060-28-イチカ" = "地盤の安全さえ確保できれば……？"
"10046060-29-イチカ" = "可能性が……あるかも、しれないっす。"
"10046060-30-イチカ" = "でも、この手だけは……使いたくなかったのに……！"
"10046060-31-イチカ" = "……。"
"10046060-32-イチカ" = "…………。"
"10046060-33-イチカ" = "……………………。"
"10046060-34-イチカ" = "使いたくなかったのにっ！！！"
"10046060-35" = "[s3] \"イチカ……大丈夫？\"\n[s4] \"そこまで嫌なら無理しなくても……。\""
"10046060-36-イチカ" = "いえ。もう覚悟はできてるっす。"
"10046060-37-イチカ" = "いつもヘラヘラしてる私でも……。"
"10046060-38-イチカ" = "誠意を見せる時くらい分かってます。"
"10046060-39-イチカ" = "先生、一つお願いがあります。"
"10046060-40-カスミ" = "なるほど、なるほど……。"
"10046060-41-カスミ" = "説明ご苦労。状況は理解したよ。"
"10046060-42-カスミ" = "依頼内容は地盤の調査と……別荘の再建だね？"
"10046060-43-イチカ" = "温泉開発部ほどの専門家はいないと思ってるっす。#nあんまり認めたくはないっすけど……。"
"10046060-44-カスミ" = "努力が認められるというのは、ふむ……実に心地良いものだ。"
"10046060-45-カスミ" = "ただ……取引には、対価が必要だろう？"
"10046060-46-イチカ" = "…………。"
"10046060-47-カスミ" = "まず、君たちが押収した資材を返してもらおうか。"
"10046060-48-イチカ" = "……私が保証するっす。"
"10046060-49-カスミ" = "次に……ビーチの一部を少しばかり譲って欲しいんだ。#nまだ開発する場所が残っていてね。"
"10046060-50-イチカ" = "……それは、私の一存では決められないっす。"
"10046060-51-カスミ" = "残念だなぁ？その程度の覚悟だったなんて……。#n交渉のテーブルから降りてしまいそうだ。"
"10046060-52-イチカ" = "…………。"
"10046060-53-カスミ" = "おや？そう睨まないでおくれよ。"
"10046060-54-イチカ" = "……睨んでないっす。"
"10046060-55-イチカ" = "ビーチの件……なんとか説得してみるっす。"
"10046060-56-カスミ" = "……安請け合いは身を滅ぼすぞ？"
"10046060-57" = "でもなぁ、私は欲張りなんだ。#nこうなると、ついつい欲が出ちゃってなぁ？"
"10046060-58-イチカ" = "…………私に。"
"10046060-59-カスミ" = "うん？"
"10046060-60-イチカ" = "私にできることなら、なんでもします。#nだから……。"
"10046060-61-カスミ" = "は？"
"10046060-62-カスミ" = "まさか、そこまで切羽詰まっているのかい？"
"10046060-63-カスミ" = "ふむ……。#nいいだろう。助けてあげるとしようか。"
"10046060-64-イチカ" = "ほんとっすか！？"
"10046060-65-カスミ" = "他でもないイチカちゃんの頼みじゃあ仕方ない。"
"10046060-66-カスミ" = "……その代わり、追加で要求を一つ。"
"10046060-67-カスミ" = "きちんと説明してもらおうか。#n一体なぜ、ここまでするのかね？"
"10046060-68-イチカ" = "特に理由はないっすよ。"
"10046060-69-カスミ" = "いや、ある。"
"10046060-70-カスミ" = "それに……なんでもする、と言っただろう？"
"10046060-71-カスミ" = "まさか、舌の根も乾かぬうちに……自分の言ったことを撤回などしないよなぁ？"
"10046060-72-カスミ" = "さあ、私の気が変わる前に――素直に言ったほうが賢明だぞ？"
"10046060-73-イチカ" = "はぁ……一生分かり合える気がしないっすね。"
"10046060-74-イチカ" = "ミカ様を助けたい。それだけっすよ。"
"10046060-75-カスミ" = "おぉ……それは実に素晴らしい。"
"10046060-76-カスミ" = "だが足りないな。まだ本音を隠すつもりかね。"
"10046060-77-カスミ" = "恥ずかしがり屋のイチカちゃんのために……私が手伝ってあげようじゃないか。"
"10046060-78-カスミ" = "これは風の噂で聞いたんだが――#nあのミカというお嬢さん、相当やんちゃだったらしいじゃないか。"
"10046060-79-イチカ" = "…………。"
"10046060-80-カスミ" = "そう怖い顔をしないでくれ。#n私とてトリニティの恥部を暴くつもりはないさ。"
"10046060-81-カスミ" = "ただ……評判の通りであるならば――"
"10046060-82-カスミ" = "果たして、そこまでの忠誠を尽くすような相手なのだろうか？と思ってしまってね。"
"10046060-83-イチカ" = "……忠誠じゃないっす。"
"10046060-84-カスミ" = "ほぉ？じゃあ、友達にでもなったつもりかね？"
"10046060-85-イチカ" = "……友達。"
"10046060-86-イチカ" = "……は。"
"10046060-87-イチカ" = "よくもまぁ思ってもないことがぽんぽん出てくるっすね。"
"10046060-88-カスミ" = "……おっ、ちょっとは話す気になってくれたのかな？"
"10046060-89-カスミ" = "で、なぜだ？"
"10046060-90-イチカ" = "これまでは……ミカ様のこと、正直よく知らなかったんすよ。"
"10046060-91-イチカ" = "それが今日初めて、隣で補佐することになって。"
"10046060-92-イチカ" = "この人が噂のティーパーティーか、と。#n最初の感想なんてそんなもんっすよ。"
"10046060-93-イチカ" = "でも、今日ずっと一緒にいて……。"
"10046060-94-イチカ" = "…………。"
"10046060-95-イチカ" = "輝いてるなぁ……まぶしいなぁ……って思ったんです。#n……私と違って。"
"10046060-96-イチカ" = "普通、友達のためにここまでする？私にはできる？って。#n……できないっすよ、あんなこと。"
"10046060-97-イチカ" = "私は、あの輝きが消えてほしくない。"
"10046060-98-イチカ" = "……それだけっす。"
"10046060-99-カスミ" = "…………。"
"10046060-100-カスミ" = "なるほどな。"
"10046060-101-イチカ" = "柄じゃないことは自分が一番分かってるっすよ。"
"10046060-102-カスミ" = "……似た者同士、か。#n我ながらよく言ったものだな。"
"10046060-103-カスミ" = "…………。"
"10046060-104-カスミ" = "いいだろう。自分のした約束は守らねばな。"
"10046060-105-イチカ" = "助けてくれるんすか……？"
"10046060-106-カスミ" = "ああ、この業界は信頼ありきだ。二言は無いさ。"
"10046060-107-カスミ" = "とはいえなぁ……悪いが私一人でどうにかできる気がしないんだな、これが。"
"10046060-108-カスミ" = "こらこら、話は最後まで聞くものだぞ？"
"10046060-109-カスミ" = "私も、私なりに誠意を見せる時が来たってことさ。"
"10046060-110-カスミ" = "こほん。"
"10046060-111-カスミ" = "おーい、みんな～集まってくれ！"
"10046060-112-温泉開発部の部員A" = "なになに～？"
"10046060-113-温泉開発部の部員B" = "奪還作戦は今晩じゃなかったっけ。"
"10046060-114-カスミ" = "あぁ、それはボツになった。"
"10046060-115-イチカ" = "……奪還作戦？"
"10046060-116-カスミ" = "一つ、建築の案件を請け負うことになった。"
"10046060-117-カスミ" = "あらかじめ言っておくが、これは温泉とは何の関係もない。"
"10046060-118-カスミ" = "だから強要はしない。#nこのビーチでボランティアをしたいやつは、手を挙げてくれ。"
"10046060-119-温泉開発部の部員A" = "私やるよ！部長のことだし、きっと何かあるんでしょ？"
"10046060-120-温泉開発部の部員A" = "失敗してきた温泉は数知れず……建物を建てるだけなら余裕だからね～"
"10046060-121-メグ" = "うーん、話難しくて途中からよく分かんなかったけど……#nカスミ部長の友達を助けよう！ってことだよね？"
"10046060-122-メグ" = "それならいつでも歓迎だよ！"
"10046060-123-カスミ" = "はっ……。"
"10046060-124-カスミ" = "……ははっ、ハーハッハッハ！！なんて頼もしい部員なんだ！"
"10046060-125-カスミ" = "よかったな、イチカちゃん！"
"10046060-126-イチカ" = "だ――"
"10046060-127-イチカ" = "誰が友達っすか！！！！"
