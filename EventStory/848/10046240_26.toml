[translation]
"10046240-1-マシロ" = "イチカ先輩。"
"10046240-2-マシロ" = "手伝いに来ました。"
"10046240-3-イチカ" = "マシロ？今日は非番っすよね？"
"10046240-4-マシロ" = "それはそうなのですが、正義の力が必要な気がしまして。"
"10046240-5-イチカ" = "はは……さすがマシロっすね。"
"10046240-6-イチカ" = "でも、昨日も別の作戦に参加してたじゃないっすか。"
"10046240-7-イチカ" = "休むことも任務のうちっすよ。"
"10046240-8-マシロ" = "実は……最近、力不足を感じていて……。"
"10046240-9-マシロ" = "目立つ活躍がないと言いますか、存在感が薄いような気がして……。"
"10046240-10-イチカ" = "狙撃手なら、それでいいのでは？"
"10046240-11-イチカ" = "むしろ存在感が薄いほうが、良いと思うっすけど。"
"10046240-12-マシロ" = "それは違います！#n存在感は狙撃手の力そのものなんです！"
"10046240-13-マシロ" = "優れた狙撃手は、一発の銃弾で三人の敵を無力化すると言われています。#nハスミ先輩が、その最たる例ですよね。"
"10046240-14-イチカ" = "うーん……ハスミ先輩はどちらかというと、#n敵三人を直接倒すって感じっすけどね……。"
"10046240-15-イチカ" = "（[ruby=しずやま]静山[/ruby]マシロ……1年生の中でもずば抜けて優秀……ではあるけど）"
"10046240-16-イチカ" = "（ものすごく真面目というか、情熱的というか……#nもう少し加減ができればなぁ……）"
"10046240-17-イチカ" = "（正直、ちょっと相性がよくないんだよな……）"
"10046240-18-マシロ" = "それと……イチカ先輩が一人でパトロールしていると聞きました。"
"10046240-19-イチカ" = "はい？あ、ああ……まあ、なんとなくっす。"
"10046240-20-マシロ" = "一人では寂しくありませんか？"
"10046240-21-イチカ" = "……まさか、それが理由っすか？"
"10046240-22-マシロ" = "……。"
"10046240-23-イチカ" = "いやぁ、後輩に心配かけちゃうなんて……私もまだまだっすね。"
"10046240-24-イチカ" = "はは……いい先輩には、程遠いみたいっす。"
"10046240-25-イチカ" = "んじゃ、気合い入れてくんで、援護頼むっすよ！"
"10046240-26-マシロ" = "はい！お任せください！"
