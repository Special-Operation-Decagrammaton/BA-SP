[translation]
"10046260-1-イズナ" = "サササッ……。"
"10046260-2-イズナ" = "シュババッ……。"
"10046260-3-イチカ" = "……。"
"10046260-4-イチカ" = "すみませ～ん……ちょっとお話いいっすか？"
"10046260-5-イズナ" = "は、はいっ！？イズナのことですか！？"
"10046260-6-イチカ" = "お名前はイズナさん……っと。ご所属は？"
"10046260-7-イズナ" = "忍者です！"
"10046260-8-イチカ" = "はい、忍者っすね……。"
"10046260-9-イチカ" = "……忍者？"
"10046260-10-イチカ" = "忍者……そんな学園、聞いたことないんすけど……。"
"10046260-11-イズナ" = "なんと！学園についてでしたか！#nイズナは百鬼夜行連合学院の生徒です！"
"10046260-12-イチカ" = "……！"
"10046260-13-イチカ" = "あっ、なるほど……つまり、ごっこ遊びってことっすね。"
"10046260-14-イズナ" = "なぁっ！？"
"10046260-15-イズナ" = "ごっこ遊びではありません！"
"10046260-16-イズナ" = "まだ未熟者ですが、イズナは正真正銘の忍者です！"
"10046260-17-イチカ" = "はい？え、まあ……はい……。"
"10046260-18-イチカ" = "……ところで、ここで何をしてたんすか？"
"10046260-19-イチカ" = "忍術修行をしていました！ニンニン！"
"10046260-20-イズナ" = "あれは数日前のこと……#nイズナはまだ修行が足りないことを痛感しました。#nもっと強くなるべきだと……！"
"10046260-21-イチカ" = "に、忍術、っすか……。"
"10046260-22-イズナ" = "ちなみに、あなたはどちら様でしょうか？"
"10046260-23-イズナ" = "イズナ流忍法――砂浜隠れ身の術！#n……を見破ったのですから、只者ではないとお見受けします！"
"10046260-24-イチカ" = "隠れ身の術……？#nああ、あの布を被ってたやつのことっすか……？"
"10046260-25-イチカ" = "あ、えと、私は正義実現委員会のイチカっす。#n今はビーチのパトロール中っすね。"
"10046260-26-イズナ" = "正義実現委員会……！#nイチカ殿は正義を実現するために暗躍しているのですね！#nまさに忍者のお手本のようなお方です！"
"10046260-27-イズナ" = "イズナは修行に没頭するあまり、その手があったことに気がつきませんでした……。"
"10046260-28-イチカ" = "イチカ殿さえよければ、イズナも暗躍に参加したいです！"
"10046260-29-イチカ" = "……はい？#nえっと……手伝ってくれるって意味っすか？"
"10046260-30-イチカ" = "ちょうど人手は足りなかったんで、助かるっすけど……。"
"10046260-31-イズナ" = "喜んでイズナもご一緒します！"
"10046260-32-イチカ" = "……この状況に慣れちゃってる自分が怖いなぁ。"
