[translation]
"10046040-1" = "第4話;交渉の先、手にするモノ"
"10046040-2-ハルナ" = "詳しい事情は存じませんが……。"
"10046040-3-ハルナ" = "バーベキューの食材が必要になった。#nそれも、今すぐ、焼く準備まで整った状態で……というお話でしたね？"
"10046040-4-ミカ" = "う、うん！そうなの！"
"10046040-5-ミカ" = "あなた達なら持ってるかもしれない……って先生が。"
"10046040-6-ミカ" = "なんで？とは思うけど……先生の言うことだし。"
"10046040-7-イズミ" = "というか、急に必要になるってどんな状況？"
"10046040-8-イズミ" = "え～？たまにない？#n今はこれじゃないとダメ！みたいな時。"
"10046040-9-イズミ" = "それ、わざわざ他学園の生徒にまで頼むほどのこと？"
"10046040-10-イズミ" = "ティーパーティーって、偉いんでしょ？#n部下に命令すればすぐ持ってきてくれそうなのに。"
"10046040-11-イズミ" = "ティーパーティー……？#nいつでもお茶とクッキーが食べられるってこと！？いいなぁ～！"
"10046040-12-イズミ" = "いや、そんなわけ……あるかも……？"
"10046040-13-ハルナ" = "ともかく。"
"10046040-14-ハルナ" = "ちょうどここに、バーベキューセットが一式。#n質に関しても申し分ありません。"
"10046040-15" = "[s1] \"え、本当に！？\"\n[s2] \"ダメ元だったのに！\""
"10046040-16-ミカ" = "えっ！？先生が驚くとこ！？"
"10046040-17-ミカ" = "でもなんとかなりそうで良かった！#nこれであとは交渉だけだね！"
"10046040-18-ミカ" = "ゲヘナの……ハルナちゃん、だっけ。"
"10046040-19-ミカ" = "そのバーベキューセット、譲ってくれないかな？"
"10046040-20-ミカ" = "あ、もちろんタダってわけじゃないよ！#nお金ならちゃんと払うから。言い値で――"
"10046040-21-ミカ" = "って、そんなに余裕はないんだけど……。"
"10046040-22-ミカ" = "でも、できる限り頑張るから！"
"10046040-23-ハルナ" = "他でもないティーパーティーの方がおっしゃるのですから。#nさぞや良い取引になるのでしょう。"
"10046040-24-ミカ" = "じゃあ……！"
"10046040-25-ハルナ" = "ですが、お断りします。"
"10046040-26-ミカ" = "どうして！？"
"10046040-27-ハルナ" = "私たちは美食家です。美食の価値と、そこから得られる経験。#nそれはまさにプライスレス。"
"10046040-28-ハルナ" = "それを金銭で引き換えようだなんて……#nその安直な発想は、侮辱にさえ思えるほど。"
"10046040-29-ハスミ" = "……やはり。"
"10046040-30-ハスミ" = "ミカ様。ここからは私たちにお任せください。"
"10046040-31-イチカ" = "ハスミ先輩……ちょっと待ってほしいっす。"
"10046040-32-イチカ" = "ちゃんと話し合えば――"
"10046040-33-イチカ" = "……いや、ダメっすね。#nどうせ、話にならないっすよ。"
"10046040-34-ハスミ" = "今回ばかりは、先生にも非があります。"
"10046040-35" = "[s3] \"え？\"\n[s4] \"私も？\""
"10046040-36-ハスミ" = "よりによって――頼む相手が美食研究会だなんて。"
"10046040-37-ハスミ" = "あの者がトリニティ自治区で起こした数々の事件を、ご存じないのですか？"
"10046040-38-ハスミ" = "あまつさえ、ミカ様の前に連れて来るなど――"
"10046040-39" = "[s5] \"は、ハスミが思うほど危険な……。\"\n[s6] \"き、危険な子たちじゃ、ない……とは思うけど……！\""
"10046040-40-ハスミ" = "危険性があることは理解しているのではありませんか！"
"10046040-41-ハスミ" = "やはり交渉中断です。今すぐ……！"
"10046040-42-ミカ" = "ま、待って！"
"10046040-43-ミカ" = "待って、ハスミちゃん。"
"10046040-44-ミカ" = "もうちょっとだけ話してみない？#nもしかしたら妥協点が見つかるかもしれないし。"
"10046040-45-ミカ" = "ここで騒ぎを起こしたら、もっと大変なことになると思う。"
"10046040-46-ミカ" = "ナギちゃんとセイアちゃんに気づかれたら、ほら……。#nだから、お願い。"
"10046040-47-ミカ" = "今日だけは、何事もなく終わらせたい。"
"10046040-48-ハスミ" = "ミカ様……。"
"10046040-49-ハスミ" = "分かりました。"
"10046040-50-ハスミ" = "ただし、少しでも危険だと判断した場合は――#n介入させていただきます。"
"10046040-51-ミカ" = "うん、ありがとう！"
"10046040-52-ミカ" = "その、ハルナちゃん？"
"10046040-53-ミカ" = "さっきはごめんね。#nハルナちゃんの気持ち、ちゃんと考えてなくて。"
"10046040-54-ハルナ" = "ふふ、構いませんわ。よくあることですので。"
"10046040-55-ハルナ" = "むしろ、理解しようとする姿勢には、素直に感服するくらいですわ。"
"10046040-56-ミカ" = "ありがとう。#nその……美食はお金じゃないんだよね？"
"10046040-57-ミカ" = "だったら、こうするのはどう？#n今譲ってくれたら、後でもっと良いバーベキューセットをあげる！"
"10046040-58-ハルナ" = "なるほど、物々交換……ということですわね。"
"10046040-59-ハルナ" = "美食には美食を――"
"10046040-60-ハルナ" = "ええ、悪くありません。"
"10046040-61-ミカ" = "じゃ、じゃあ……！"
"10046040-62-ハルナ" = "ここはお気持ちを汲んで、できる限り譲歩したいところですが……。"
"10046040-63-ハルナ" = "やはり、お断りします。"
"10046040-64-ミカ" = "いける流れだったじゃん！"
"10046040-65-ハルナ" = "私にとっても苦渋の決断なのです。#nミカさんの提案は、美食の議論そのものですから。"
"10046040-66-ハルナ" = "――美味しいものを食べた時の幸せは、どれほど続くのか。"
"10046040-67-ハルナ" = "一週間？一日？一時間？#nいいえ。ひと際輝くのは、その瞬間だけ。"
"10046040-68-ハルナ" = "対して、美食を美食たらしめるための仕込みに果ては無く――#n費やされた時間は当然、不可逆です。"
"10046040-69-ハルナ" = "即ち――美食とは、刹那の幸せを味わうために、膨大な時間を犠牲にする行為である。#n……私はそう定義しておりますわ。"
"10046040-70-ハルナ" = "ですので、ミカさんの提案はお断りさせていただきます。"
"10046040-71-ハルナ" = "私たちは、[ruby=・]今[/ruby]バーベキューをするために準備してきたのですから。#nそれだけで、断る理由としては十分かと。"
"10046040-72-ミカ" = "え……つまり、どういう意味？#nなんかセイアちゃんみたいなこと言うんだね。"
"10046040-73-ハスミ" = "交渉決裂、ですね。#nここはお任せください、ミカ様。"
"10046040-74-ミカ" = "ハスミちゃん！？"
"10046040-75-ハスミ" = "先ほども申し上げたとおり、ゲヘナ相手に「常識」は通じません。"
"10046040-76-ハスミ" = "美食研究会なら尚のこと。話し合うだけ無駄です。"
"10046040-77-アカリ" = "あら、それは聞き捨てならないですね～"
"10046040-78-ジュンコ" = "そうよ！ちょっと言いすぎじゃない！？"
"10046040-79-ハスミ" = "日頃の行いを振り返ったらいかがですか！？"
"10046040-80-ハスミ" = "妥協など、言語道断！"
"10046040-81-ハルナ" = "あら、それはこちらの台詞ですわ。"
"10046040-82-ハルナ" = "美食の道に妥協などありません。#nそれはこのバーベキューも同じこと。"
"10046040-83-ハスミ" = "イチカ！"
"10046040-84-イチカ" = "はいっす！"
"10046040-85-ミカ" = "ま、待って！みんな落ち着いて！"
"10046040-86-イチカ" = "ご心配には及びません。これも交渉です。"
"10046040-87-イチカ" = "その手段が、言葉から銃弾に変わっただけのこと。"
"10046040-88-イチカ" = "まあ、そういうことっすね。"
"10046040-89" = "[ns7] \"あ～結局こうなっちゃうのか。\"\n[ns8] \"言葉で交渉できると良かったけど……。\""
"10046040-90-ハルナ" = "――お待ちください。"
"10046040-91-ハルナ" = "最後に、一つお伺いしても？"
"10046040-92-ハルナ" = "ミカさん。"
"10046040-93-ミカ" = "え、私？"
"10046040-94-ハルナ" = "なぜ、そこまでバーベキューにこだわるのですか？"
"10046040-95-ハルナ" = "こだわりを持ち、美食の道を歩む方とは思えませんし……。"
"10046040-96-ハルナ" = "「今すぐ、どうしても」という部分に……#nやんごとない理由がおありのようにお見受けしますが。"
"10046040-97-ミカ" = "そ、それは……。"
"10046040-98-ミカ" = "……心配性の友達がいてね。"
"10046040-99-ミカ" = "ちょっとでも計画からずれると、不安になっちゃう子でさ。"
"10046040-100-ミカ" = "例えば、お昼のメニューが予定と違ったら――#nそれだけで何かトラブルがあったのかってあれこれ考えだしちゃうような……。"
"10046040-101-ミカ" = "ほんと、面倒な性格だよね？"
"10046040-102-ミカ" = "本当に大切な友達なんだけど、私じゃ力になれなくて……。"
"10046040-103-ミカ" = "ううん、むしろトラブルばっか起こして、迷惑かけっぱなしでさ。"
"10046040-104-ミカ" = "だから今日だけでも、何も気にせずゆっくり休ませてあげたかったんだ。"
"10046040-105-ミカ" = "……ちょっと、できそうにないんだけどね。"
"10046040-106-ハルナ" = "なるほど……そのような事情が……。"
"10046040-107-ハルナ" = "ですが、だからといって……。"
"10046040-108-イズミ" = "ねえ。"
"10046040-109-イズミ" = "これ、あげちゃダメかな？"
"10046040-110-ハルナ" = "イズミさん……？"
"10046040-111-イズミ" = "美味しいものってさ、楽しく食べたらもっと美味しくなるでしょ？"
"10046040-112-イズミ" = "でも、今の話聞いちゃったら……#n私、これ食べてもあんまり美味しくないと思うんだ。"
"10046040-113-ジュンコ" = "私も賛成。"
"10046040-114-ハルナ" = "ジュンコさんまで……？"
"10046040-115-ジュンコ" = "なんか……ほっとけないっていうか。"
"10046040-116-ジュンコ" = "バーベキューじゃないと絶対ダメってわけでもないし？"
"10046040-117-ジュンコ" = "……そもそもバーベキューだって知ったのも、ついさっきだったし。"
"10046040-118-ハルナ" = "なるほど。ではアカリさんは……。"
"10046040-119-ハルナ" = "あら、愚問でしたか？"
"10046040-120-アカリ" = "さすがハルナ。私のことよく分かってますね★"
"10046040-121-ハルナ" = "……皆さんのご意見は分かりました。"
"10046040-122-ハルナ" = "いいでしょう。これは、あなたにお譲りします。"
"10046040-123-ミカ" = "ほんと！？"
"10046040-124-ジュンコ" = "いいの！？"
"10046040-125" = "[s] \"え！？\""
"10046040-126-ハルナ" = "み、皆さん？私のことを何だと思っているのですか？"
"10046040-127-ジュンコ" = "え、正直に言ったほうがいい？"
"10046040-128-ハルナ" = "いえ……もう十分ですわ……。"
"10046040-129-ハルナ" = "もちろん対価はいただきます。"
"10046040-130-ハルナ" = "より上質な食材との物々交換――ですから。"
"10046040-131-ミカ" = "うん、ありがとう！ちゃんと持ってくるね！"
"10046040-132-ハルナ" = "では、こちらをお持ちください。"
"10046040-133-ミカ" = "やった！早く戻って――"
"10046040-134-ミカ" = "……。"
"10046040-135-ミカ" = "え？"
"10046040-136" = "[s9] \"どうしたの？\"\n[s10] \"食材に何か問題が？\""
"10046040-137-ミカ" = "このセット……箱から中身まで全部――#n私が用意してたものと同じ……。"
"10046040-138-イチカ" = "あーあ。"
"10046040-139-イチカ" = "終わりっすね、これ。"
"10046040-140-ハスミ" = "つまり、そもそもトラックを襲ったのが美食研究会だったと……？"
"10046040-141-ハスミ" = "やはり交渉決裂です！！！"
"10046040-142-ハスミ" = "ミカ様！ご命令を！！"
"10046040-143-ミカ" = "…………。"
"10046040-144-イチカ" = "（あ、これダメかも。もう止める理由もないし……）"
"10046040-145-イチカ" = "（友達想いで抑えてはいたけど、ミカ様は元々強硬派）"
"10046040-146-イチカ" = "（もう衝突は避けられないだろうし……）"
"10046040-147-イチカ" = "（ナギサ様にどう報告するか考えとくか）"
"10046040-148-ミカ" = "……よかった。無事に見つかって。"
"10046040-149-ミカ" = "ごめん、ハスミちゃん。今回は見逃してあげてくれる？#n……お願い。"
"10046040-150-ハスミ" = "……はい？"
"10046040-151-ミカ" = "気持ちはよく分かるよ。#nでも、あんまり遅くなっちゃう前に戻りたいの。"
"10046040-152-ハスミ" = "……ミカ様はそれで良いのですか？"
"10046040-153-ミカ" = "うん。今はもっと大事なことがあるからね。"
"10046040-154-イチカ" = "…………。"
"10046040-155-イズミ" = "よ、よく分かんないけど命拾いした？"
"10046040-156-イズミ" = "風紀委員長に会ったみたいな気分だったよ……。"
"10046040-157-ハルナ" = "ふふ……ふふふっ……。"
"10046040-158-ハルナ" = "どうやら幸運が転がり込んだようです。"
"10046040-159-ハルナ" = "日頃の行いが良いからでしょうか。"
"10046040-160-ジュンコ" = "よくそんなこと言えるわね……。"
"10046040-161-アカリ" = "友情って本当に素晴らしいですよね★"
"10046040-162-ミカ" = "やっぱりお昼には遅すぎるかな？"
"10046040-163-イチカ" = "うーん……急いでも15時ぐらいになりそうっすね。"
"10046040-164-ハスミ" = "準備は私たちが進めておきますので、ミカ様はお二人のほうへ……！"
"10046040-165-ミカ" = "ありがとう！じゃあ、お願いね！"
"10046040-166-ナギサ" = "う、うぐぐっ……！"
"10046040-167-セイア" = "ナギサ、さっきから力が入りすぎだ。"
"10046040-168-セイア" = "もっと身体の緊張を解いてやらねば。#nふむ……やはり言葉では難しいか。"
"10046040-169-セイア" = "ほら、ここだ。ここをもう少し伸ばして――"
"10046040-170-ナギサ" = "痛っ……！？"
"10046040-171-ナギサ" = "ほ、骨を折るつもりですか！？"
"10046040-172-セイア" = "大げさすぎないかい……？"
"10046040-173-セイア" = "おや、先生。ミカも一緒か。"
"10046040-174" = "[s11] \"何してるの？\"\n[s12] \"楽しそうだね。\""
"10046040-175-セイア" = "ヨガだよ。私の趣味でね。"
"10046040-176-ナギサ" = "セイアさんが誘ってくださって……。"
"10046040-177-セイア" = "まさか、素直につきあってくれるとは思わなかったよ。"
"10046040-178-セイア" = "そういえば、昼餉の支度は順調かい？#n何やらいい香りがしてきたが。"
"10046040-179-ミカ" = "あ～ちょっと時間かかっちゃうかも。いま焼き始めたところなんだ。"
"10046040-180-ミカ" = "待たせちゃってごめんね。"
"10046040-181-ナギサ" = "お昼はたしかバーベキューでしたよね？#n準備にそれほど時間はかからないと思いますが……。"
"10046040-182-ナギサ" = "――あ。"
"10046040-183-ナギサ" = "では、紅茶の準備をお願いしても？"
"10046040-184-ミカ" = "……え？"
"10046040-185-ナギサ" = "この分だと、食事を終えた頃には午後のティータイムになるでしょうから。"
"10046040-186-ミカ" = "あ、あれ？"
"10046040-187-ナギサ" = "ご準備、お願いしますね。"
