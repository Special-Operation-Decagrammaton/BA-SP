[translation]
"10046190-1-ツルギ" = "イチカ。"
"10046190-2-イチカ" = "ツルギ先輩！？"
"10046190-3-ツルギ" = "任務……交代するか？"
"10046190-4-ツルギ" = "い、いえ！ツルギ先輩が動くほどのことでは！"
"10046190-5-ツルギ" = "これぐらい、私がなんとかしてみせるっす。"
"10046190-6-ツルギ" = "こんなところで、無理をする必要はない。"
"10046190-7-ツルギ" = "……はは、やっぱお見通しっすよね。"
"10046190-8-ツルギ" = "たしかに、ちょっと厳しいっす。#nでも……。"
"10046190-9-ツルギ" = "……。"
"10046190-10-ツルギ" = "……うーん、普段なら素直に従ってるところなんすけどね。"
"10046190-11-ツルギ" = "不服か？"
"10046190-12-ツルギ" = "いえ、そうじゃないっす。"
"10046190-13-ツルギ" = "今回は、私にも譲れない理由があって……。"
"10046190-14-ツルギ" = "だから、せめて隣で手伝わせてほしいっす！"
"10046190-15-ツルギ" = "……そうか。"
"10046190-16-ツルギ" = "ハスミの言っていた思わぬ収穫とはこれのことか……きひっ！"
"10046190-17-ツルギ" = "きひひひ……！！"
"10046190-18-ツルギ" = "……私は手加減しない。分かっているな？"
"10046190-19-ツルギ" = "はい！どこまでもついて行くっすよ！"
"10046190-20-ツルギ" = "……その根性、悪くない。"
"10046190-21-ツルギ" = "では、始めよう。"
"10046190-22-ツルギ" = "きひひひ……。"
"10046190-23-ツルギ" = "きえええぇぇぇぇぇぇっ！！！"
