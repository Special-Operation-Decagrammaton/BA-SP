[translation]
"10046025-1-カスミ" = "イチカちゃん……。#n君は、親しき仲にも礼儀ありという言葉を知らんのか？"
"10046025-2-イチカ" = "そんな仲になった覚えはないっすよ！"
"10046025-3-カスミ" = "ツレないねぇ～せっかく似た者同士だというのに。"
"10046025-4-イチカ" = "誰がっすか！！もう逃がさないっすよ！！"
"10046025-5-カスミ" = "ハハッ！威勢が良いじゃないか！"
"10046025-6-ハスミ" = "…………。"
"10046025-7-ハスミ" = "あ、すみません。目の前の光景が信じられなくて……。"
"10046025-8-ハスミ" = "あれほど感情を露わにするイチカは、初めて見ました。"
"10046025-9-ハスミ" = "よほど因縁でもあるのでしょうか？"
"10046025-10" = "[s1] \"話すと長くなるけど……。\"\n[s2] \"あはは……色々あったね……。\""
"10046025-11-ハスミ" = "そう、なのですね……？"
"10046025-12-カスミ" = "うーーん！やはり正面突破はまだ無理があったな！#n全員――撤収！"
"10046025-13-イチカ" = "逃がすかーっ！ハスミ先輩！私に追わせてほしいっす！"
"10046025-14-イチカ" = "初めての合同作戦を思い出しますね。#nいいでしょう。撃ち漏らしは私が対応します。"
"10046025-15-？？？" = "二人ともストーップ！！"
"10046025-16-イチカ" = "……ミカ様？"
"10046025-17-ミカ" = "ごめんね。温泉開発部を追うのは、もうやめてもらっていいかな。"
"10046025-18-ハスミ" = "それでは、結局……！"
"10046025-19-ミカ" = "うん、分かってるよ。"
"10046025-20-ミカ" = "でも、もうすぐナギちゃんたちが到着する時間なの。"
"10046025-21-ミカ" = "今回の目的は、ナギちゃんにゆっくり休んでもらうこと。"
"10046025-22-ミカ" = "戦ってるところとか、その痕跡とかをナギちゃんが見たら……。#nきっと不安がっちゃう。"
"10046025-23-ミカ" = "だから、あの子たちのことは後回し。"
"10046025-24-ミカ" = "今考えないといけないのは――"
"10046025-25-ミカ" = "騒ぎを起こさないこと……ナギちゃんに心配をかけないこと……。"
"10046025-26-ミカ" = "……。"
"10046025-27-ミカ" = "二人にも、先生にも迷惑をかけると思う。#nでも……そうさせてほしいんだ。"
"10046025-28" = "[s3] \"ミカは偉いね。\"\n[s4] \"私も全力で手伝うよ。\""
"10046025-29-イチカ" = "……私たちこそ、申し訳ございません。#n目先に囚われ、大事を見落とすところでした。"
"10046025-30-イチカ" = "今回のバカンスは、ナギサ様に休んでいただくためのもの……。"
"10046025-31-イチカ" = "もっと先にやるべきことがあるっすよね。面目ないっす。"
"10046025-32-イチカ" = "証拠隠滅は手早く。もう時間がありません。"
"10046025-33-ハスミ" = "……凄まじい量ですね。"
"10046025-34-ハスミ" = "これだけあれば、建物の一つや二つ、簡単に建てられるでしょう……。#nここで一体何を企んでいたのでしょうか？"
"10046025-35-イチカ" = "温泉建設っすね。たぶん。"
"10046025-36-ハスミ" = "……温泉開発部の悪名は伊達ではないと。"
"10046025-37-ハスミ" = "とはいえ、これだけ押収しておけば、しばらくは静かになるでしょう。"
"10046025-38-ハスミ" = "活動が数日止まるだけで、十分なのですから。"
"10046025-39-ミカ" = "あはは……うん、そうだといいね。"
"10046025-40-ミカ" = "このバカンスさえ無事に終われば――"
"10046025-41-ミカ" = "あとは、どうなってもいいから。"
"10046025-42-ハスミ" = "ミカ様？"
"10046025-43-ミカ" = "ううん、なんでもない。"
"10046025-44-ミカ" = "ありがとね☆"
"10046025-45-イチカ" = "い、いえ！当然のことをしたまでっす！"
"10046025-46-ミカ" = "ええ、イチカの言う通りです。#nこれが私たちの仕事ですから。"
"10046025-47-ミカ" = "それでも、お礼を言いたかったんだ。"
"10046025-48-ミカ" = "……えへへっ。"
"10046025-49-イチカ" = "ミカ様……？？"
"10046025-50" = "[s5] \"……ミカ？\"\n[s6] \"何か思いついたの……？\""
"10046025-51-ミカ" = "あ、ううん。ただ……。"
"10046025-52-ミカ" = "なんというか……今回はうまくいきそうな気がして！"
"10046025-53-ミカ" = "……うん！"
"10046025-54-ミカ" = "きっと大丈夫！"
