[translation]
"10046220-1-ヒフミ" = "あ、あはは……こんにちは。"
"10046220-2-イチカ" = "あっ！戦車泥棒！"
"10046220-3-ヒフミ" = "えっ！？そんな風に覚えられていたんですか！？"
"10046220-4-イチカ" = "まさか、あなたまで騒ぎを起こすつもりっすか？"
"10046220-5-ヒフミ" = "ち、違います！逆です！"
"10046220-6-ヒフミ" = "私たちは、お手伝いに来たんです！"
"10046220-7-イチカ" = "手伝い……私[ruby=・]た[/ruby][ruby=・]ち[/ruby]……？"
"10046220-8-ヒフミ" = "補習授業部のみんなで、#nパトロールのお手伝いをしよう！ということになって……。"
"10046220-9-イチカ" = "それは嬉しいっすけど……またどうして？"
"10046220-10-ヒフミ" = "みんなで話し合ったんです。"
"10046220-11-ヒフミ" = "普段トリニティを守ってくれているから、#nこういう時くらいは正義実現委員会の方には休んでもらいたいなって。"
"10046220-12-ヒフミ" = "あっ、これを思いついたのは私じゃないんですけどね。"
"10046220-13-ヒフミ" = "……考えてくれたのは、アズサちゃんとコハルちゃん。"
"10046220-14-イチカ" = "コハルが……？"
"10046220-15-ヒフミ" = "はい！#n委員会の皆さんがお忙しいのに、自分だけ休むのは気が引けるみたいで……。"
"10046220-16-イチカ" = "ははっ、コハルらしいっすね。"
"10046220-17-イチカ" = "でも、アズサさんはなぜ……？"
"10046220-18-イチカ" = "……まあ、考えても仕方ないっすか。"
"10046220-19-イチカ" = "んじゃ、よろしくっす！"
"10046220-20-ヒフミ" = "あれっ、いいんですか？"
"10046220-21-イチカ" = "ちょうど人手が足りなかったんすよ。#nこっちからお願いしたいくらいで。"
"10046220-22-イチカ" = "それで、他の皆さんは……？"
"10046220-23-ヒフミ" = "あ、それが……イチカさんがどこにいらっしゃるか分からなくて、#n手分けして探していたところなんです。"
"10046220-24-イチカ" = "それじゃあ、パトロールしながら一人ずつ探していくっすかね。"
"10046220-25-ヒフミ" = "あはは……なんだか仕事を増やしてしまったような……。"
"10046220-26-ヒフミ" = "至らない私ですが……。"
"10046220-27-ヒフミ" = "よろしくお願いします！"
