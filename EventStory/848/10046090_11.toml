[translation]
"10046090-1" = "第9話;こうして日々は続いてく"
"10046090-2-イチカ" = "あ、先生。来てくれたんすね。"
"10046090-3-イチカ" = "なんか久しぶりに会った気分っす。#nそんなに時間経ってないんすけどね。"
"10046090-4-イチカ" = "えと、ティーパーティーに寄るんすよね？"
"10046090-5-イチカ" = "道中、お供しますね。"
"10046090-6-イチカ" = "……あれから、面倒事になる前に、ナギサ様が手を打ちました。"
"10046090-7-イチカ" = "ティーパーティーのプライベートビーチを、一般開放することにしたんです。"
"10046090-8-イチカ" = "おかげで温泉開発部の乱入は、なんとか誤魔化せたんすけど……。"
"10046090-9-イチカ" = "代わりに、ビーチはキヴォトス各地からのお客さんで賑わってしまって……。"
"10046090-10-イチカ" = "その後のことは、あまり思い出したくないっす。は、はは……。"
"10046090-11-？？？" = "ん～？それってどういう意味かな～？"
"10046090-12-？？？" = "これでもかみ砕いたつもりだったのだが……致し方ない。#n幼児でも理解できるくらい簡単に説明しよう。"
"10046090-13-イチカ" = "……はは、私はここまでにしておくっす。"
"10046090-14-イチカ" = "余計なことに首を突っ込みたくはないっすからね。"
"10046090-15" = "[s1] \"案内ありがとう、イチカ。\"\n[s2] \"そうだ。一つ聞いてもいいかな。\""
"10046090-16-イチカ" = "……はい？温泉開発部っすか？"
"10046090-17-イチカ" = "えーと、私が知ってるのは……。"
"10046090-18-ナギサ" = "はあ……。"
"10046090-19-ナギサ" = "お二人とも……毎日喧嘩して、よく飽きませんね……。"
"10046090-20-セイア" = "それは語弊があるな。#n喧嘩とは、対等な知性を持つ者同士でしか成り立たない。"
"10046090-21-ナギサ" = "またそうやって……。"
"10046090-22-セイア" = "へえ～？#nセイアちゃん、喧嘩上手なんだ～？"
"10046090-23-ナギサ" = "乗せられやすいのも困りものですね……。"
"10046090-24-ミカ" = "喧嘩……自信はないな。"
"10046090-25-セイア" = "……上手く加減をする自信がね。"
"10046090-26-ミカ" = "なにそれ？どういう意味？"
"10046090-27" = "[ns3] \"みんな、おはよう。\"\n[ns4] \"今日も仲良いね。\""
"10046090-28-ミカ" = "せ、先生！？来てたの？"
"10046090-29-ナギサ" = "私がお呼びしました。#nビーチでの一件について、後片づけが残っていますから。"
"10046090-30-ナギサ" = "あまりに多くの利害関係が絡んでしまったので……#nシャーレの仲裁なしでは難しいと判断しました。"
"10046090-31-ナギサ" = "ビーチを一般公開しただけで、あれほどの騒ぎになるとは……。"
"10046090-32-ナギサ" = "先生にはしばらくお付き合いいただくことになるかと……。#n本当に、面目次第もありません。"
"10046090-33" = "[s5] \"気にしなくていいんだよ。よろしく！\"\n[s6] \"私のことは好きなだけ使っていいからね！\""
"10046090-34-ミカ" = "じゃあ――！！"
"10046090-35-ナギサ" = "ダメです。"
"10046090-36-ミカ" = "まだ言ってないのに！？"
"10046090-37-ナギサ" = "ミカさんは早く、ビーチの予算管理表を提出してください。#n審査を通過するまで、先生とは距離を置くように。"
"10046090-38-ミカ" = "えっ、ヤだよ。"
"10046090-39-ナギサ" = "ヤじゃありません。#nそもそも、進んで責任者になったのはミカさんでしょう？#nいつまでもお休み気分でいられては困ります。"
"10046090-40-ミカ" = "またお説教～？#nナギちゃんだってビーチではしゃいでたのに～"
"10046090-41-ナギサ" = "あの時と今は違いますから。#n時と場合に応じた態度をとる。それが品位というものです。"
"10046090-42-ナギサ" = "ティーパーティーは他の生徒の模範となるべき立場。#nただでさえ、最近のトリニティは風紀が緩んでいるのですから。"
"10046090-43-ナギサ" = "……セイアさんも、ですよ！"
"10046090-44-セイア" = "私は何も言っていないが……？"
"10046090-45-ミカ" = "うっ、耳が痛い……。"
"10046090-46" = "[s] \"ビーチでの姿が嘘みたいだね。\""
"10046090-47-ミカ" = "だね、へへっ。"
"10046090-48-？？？" = "ん？"
"10046090-49-？？？" = "おぉ～これはこれは。"
"10046090-50-カスミ" = "こんなところまで、何のご用かな？"
"10046090-51-カスミ" = "うん？ああ、他の部員か。"
"10046090-52-カスミ" = "例の「ボランティア活動」が、風紀委員長の耳に入ったようでな。"
"10046090-53-カスミ" = "今、風紀委員会と出くわすのは少々遠慮したいところでね。"
"10046090-54-カスミ" = "我[ruby=パンデモニウム・ソサエティー]らが万魔殿の議[/ruby]長様が、またかき乱してくれるまで、しばし自粛中ってわけさ。"
"10046090-55-カスミ" = "これ幸いと、部員たちは夏季休暇を満喫中だ！ハーハッハッハ！"
"10046090-56-カスミ" = "ん？私だけがここにいる理由か？"
"10046090-57-カスミ" = "先生も知っての通り、私は人気者だろう？"
"10046090-58-カスミ" = "私と一緒では、休みが休みにならない。"
"10046090-59-カスミ" = "……という言い訳をして、読書の時間を確保したわけさ。"
"10046090-60-カスミ" = "良質なアウトプットのためには、インプットが欠かせないからなぁ！#nハーハッハッハ！"
"10046090-61-カスミ" = "ともあれ、温泉開発部は臨時休業中だ。#n誰を探しに来たのかは知らんが、部員の行方は私も把握していなくてね。"
"10046090-62-カスミ" = "なんだ、私に用があったのか。"
"10046090-63-カスミ" = "頼み事には対価が伴ってしかるべきだが……。"
"10046090-64-カスミ" = "でもまあ、先生には普段から世話になっている。#nここらで誠意を見せておくのも悪くはない。"
"10046090-65-カスミ" = "どれ。用件を聞こうじゃないか。"
"10046090-66" = "[s7] \"ちょっと聞きたいことがあって。\"\n[s8] \"あの時、どうしてイチカを助けることにしたの？\""
"10046090-67-カスミ" = "その質問は、前提から間違っているぞ。"
"10046090-68-カスミ" = "奪われた工事資材も、プライベートビーチを開発できる権利も――#n対価はすべて受け取っている。"
"10046090-69-カスミ" = "善意で人助けをしたような言い草だが……あれは契約上の行いだった。#nそれだけの話さ。"
"10046090-70-カスミ" = "…………。"
"10046090-71-カスミ" = "ふむ、不服そうだ。#nこう言えばおおよそ納得してくれるんだがね。"
"10046090-72-カスミ" = "本音を引きずり出してもロクなことはないぞ？"
"10046090-73-カスミ" = "……特に理由はない。"
"10046090-74-カスミ" = "そんな気分だった。"
"10046090-75-カスミ" = "嘘？嘘じゃないさ。"
"10046090-76-カスミ" = "誰にだってそんな時はあるものだろう？"
"10046090-77-カスミ" = "普段なら絶対しないようなことを、やってしまう日。"
"10046090-78-カスミ" = "ちょうどそういう日だったんだよ。あのお嬢ちゃんも、私も。"
"10046090-79-カスミ" = "つまり、言わぬが花ってものさ。"
"10046090-80-カスミ" = "これ以上掘り起こすのはやめにしないか？"
"10046090-81-？？？" = "部長～～！！"
"10046090-82-カスミ" = "わぷっ！？"
"10046090-83-メグ" = "あれ、先生もいる！アイス買ってきたんだ！一緒に食べよ！"
"10046090-84-メグ" = "あ、2個しかないんだった。これは部長と先生にあげる！#n私、もう1個買ってくるね！"
"10046090-85-カスミ" = "え……と？"
"10046090-86-カスミ" = "いやいや、待ってくれ。"
"10046090-87-カスミ" = "……なぜメグがここに？"
"10046090-88-メグ" = "部長、どうしたの？#n自分から呼んだのに変な顔して……。"
"10046090-89-カスミ" = "その……実はメグも読書家だった……とかか？#n私が知らなかっただけで。"
"10046090-90-メグ" = "あんまり好きじゃないかな～？#n絵がいっぱいのやつならいいけど、部長が読んでるのって小さい文字ばっかだし。"
"10046090-91-カスミ" = "まあ、そうだよな。そうだろうと思ったが。"
"10046090-92-カスミ" = "それなら、何をしにここへ？"
"10046090-93-メグ" = "やりたいことやっていいって言ったのは部長だよ？#nだから、やりたいことをやってるの！"
"10046090-94-カスミ" = "ん？うーーーーん？"
"10046090-95-温泉開発部の部員A" = "あれ？メグも来てたんだ。"
"10046090-96-温泉開発部の部員A" = "ごめん、メグの分も買ってくればよかったね。"
"10046090-97-カスミ" = "……私の伝え方に問題があったかな？"
"10046090-98-カスミ" = "たしか、夏休みだと伝えたはずだが……。"
"10046090-99-温泉開発部の部員A" = "いや、まぁ……退屈してるんじゃないかなって思って。"
"10046090-100-温泉開発部の部員A" = "部長って一人になると、どっか閉じこもって本ばっか読むでしょ？"
"10046090-101-温泉開発部の部員A" = "意外と、考えることは同じだったっていうか……。"
"10046090-102-温泉開発部の部員A" = "そそ！私もさっき合流したんだ！"
"10046090-103-温泉開発部の部員C" = "あれ？みんな集まってるじゃん。"
"10046090-104-温泉開発部の部員D" = "もしかして、私たちだけ遅れた感じ？"
"10046090-105-カスミ" = "は……。"
"10046090-106-カスミ" = "ははっ。"
"10046090-107-カスミ" = "ハーハッハッハッハ！！先生、見たまえよ。"
"10046090-108-カスミ" = "……ははっ、ハーハッハッハ！！なんて頼もしい部員なんだ！"
"10046090-109-カスミ" = "その……悪いが、先生。"
"10046090-110" = "[s9] \"うん、また来るね！\"\n[s10] \"カスミ、もしかして照れてる？\""
"10046090-111-カスミ" = "……照れてる？"
"10046090-112-カスミ" = "ははっ。"
"10046090-113-カスミ" = "つまり、言わぬが花ってものさ。"
"10046090-114" = "夏空のやくそく"
