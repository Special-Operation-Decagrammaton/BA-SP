[translation]
"10046080-1" = "第8話;ストーリーテラーも役者也"
"10046080-2-ミカ" = "…………。"
"10046080-3-ハスミ" = "…………。"
"10046080-4-ナギサ" = "…………。"
"10046080-5-ナギサ" = "ええと……。"
"10046080-6-ナギサ" = "……こ、これはどういう催しで……？"
"10046080-7-ナギサ" = "ミカさん、これは一体どういうことですか？"
"10046080-8-ミカ" = "な、ナギちゃん……！違うの！これは……！"
"10046080-9-ナギサ" = "いいえ、説明は不要です。"
"10046080-10-ナギサ" = "別荘に爆弾が仕掛けられていた……これが意味することは明白。"
"10046080-11-ナギサ" = "――バカンスは終了です！"
"10046080-12-ナギサ" = "ここにいる全員を逮捕しなさい！#n真相が明らかになるまで、身柄を拘束します！"
"10046080-13-ナギサ" = "それと、事件の首謀者である[ruby=みその]聖園[/ruby]ミカは――"
"10046080-14-ナギサ" = "一日三食ロールケーキに変更です！！"
"10046080-15-ナギサ" = "……カ！"
"10046080-16-ナギサ" = "ミカ！大丈夫ですか？"
"10046080-17-ナギサ" = "爆発のショックで、もしかして……？"
"10046080-18-ミカ" = "な、ナギちゃん、違うの……。"
"10046080-19-ミカ" = "これは……その……。"
"10046080-20-ナギサ" = "ごめんなさい、ミカさん。"
"10046080-21-ミカ" = "……え？"
"10046080-22-ミカ" = "どうして、ナギちゃんが謝るの？"
"10046080-23-ナギサ" = "どうしてって……今の爆発は私のせいでしょう？"
"10046080-24-ナギサ" = "ミカさんの頑張りを台無しにして……ごめんなさい。"
"10046080-25-ミカ" = "い、いやいや！そうじゃなくて！ナギちゃん、本当にそれでいいの？"
"10046080-26-ナギサ" = "はい？話が見えないのですが……。"
"10046080-27-ミカ" = "だって、爆発したんだよ？別荘が！"
"10046080-28-ナギサ" = "そうですね？"
"10046080-29-ミカ" = "私のせいでしょ？常識的に考えて！？"
"10046080-30-ミカ" = "関係者全員を拘束して、24時間事情聴取するんじゃないの！？"
"10046080-31-ナギサ" = "ミカさんの中の私のイメージはいったい……。"
"10046080-32-ナギサ" = "何も考えず、好奇心のままにスイッチを押したのは私です。"
"10046080-33-ナギサ" = "……なぜ別荘に爆弾が仕掛けられていたのか。なぜ起爆スイッチがこんなところに落ちていたのか。#nそれはそれで別の問題ですが。"
"10046080-34-ナギサ" = "ですが……ええ。一つ、よく分かりました。"
"10046080-35-ナギサ" = "ミカさん。"
"10046080-36-ナギサ" = "ビーチに来てからというもの、ずっと様子が変だと思っていたのです。"
"10046080-37-ナギサ" = "事故を防ぐために、裏で頑張ってくれていたのですね？"
"10046080-38-ミカ" = "……信じてくれるの？"
"10046080-39-ナギサ" = "はい？"
"10046080-40-ミカ" = "だって、私だよ？"
"10046080-41-ミカ" = "やることなすこと全部ダメで、みんなにもたくさん悪いことして……。"
"10046080-42-ミカ" = "そんな私を、信じてくれるの？"
"10046080-43-ナギサ" = "何を言うのかと思ったら……あなたはバカですか？#nいえ、とうの昔から知っていたことですが。"
"10046080-44-ナギサ" = "――もちろん、信じますよ。"
"10046080-45-ミカ" = "うぅ……。"
"10046080-46-ミカ" = "……うわああん！"
"10046080-47-ナギサ" = "どうして泣くのですか……。"
"10046080-48-ミカ" = "だって、ナギちゃんが……うぅ、うわああん！"
"10046080-49-セイア" = "ミカ。"
"10046080-50-ミカ" = "……うん。"
"10046080-51-セイア" = "もう落ち着いたのかい？"
"10046080-52-ミカ" = "……うん。"
"10046080-53-セイア" = "相変わらず、君は忙しないな。#n一人で気がはやり、急に泣き出すなど……。"
"10046080-54-セイア" = "本当に手のかかる……子供のようだ。"
"10046080-55-セイア" = "ナギサ、君も同じだよ。"
"10046080-56-ナギサ" = "はい！？"
"10046080-57-セイア" = "おてんば娘は勝手に泣き出しただけだ。#n君が気に病むことなど一つもないというのに。"
"10046080-58-セイア" = "これが「幼馴染」なのかな。"
"10046080-59-ミカ" = "ねえ、ナギちゃん。"
"10046080-60-ナギサ" = "あの、ミカさん。"
"10046080-61-ミカ" = "あ……お先にどうぞ。"
"10046080-62-ナギサ" = "いいえ、ミカさんが。"
"10046080-63-ミカ" = "いやいや。"
"10046080-64-ナギサ" = "いえいえ。"
"10046080-65-セイア" = "……漫才でもしてるのかい？"
"10046080-66-セイア" = "いや、漫才は「ボケ」と「ツッコミ」で成立するもの……。#n「ボケ」だけとは新しいな。"
"10046080-67-ミカ" = "一番「ボケ」てるのってセイアちゃんだよね！？"
"10046080-68-セイア" = "ミカが「ツッコミ」か……まぁ、それも悪くないが……#nそろそろ、現実の問題に向き合うべきではないかね？"
"10046080-69-ミカ" = "現実の問題？"
"10046080-70-セイア" = "ああ。寝所が無くなった。"
"10046080-71-ミカ" = "あ。"
"10046080-72-ナギサ" = "あ。"
"10046080-73" = "[s] \"あ。\""
"10046080-74-セイア" = "まあ、この際テント泊を楽しもうじゃないか。"
"10046080-75-ハスミ" = "セイア様……非常に申し上げにくいのですが。"
"10046080-76-ハスミ" = "あいにく、テントの用意はしておらず……。"
"10046080-77-ハスミ" = "その……市街地まで買いに行くのなら、そのままホテルで宿泊したほうがよろしいかと……。"
"10046080-78-セイア" = "それについては問題ない。#nハスミ、イチカ。ついてきてくれ。私の車に何個か載せてあるんだ。"
"10046080-79-セイア" = "割り振りは……そうだな。ハスミとイチカはこれを使ってくれ。#n私たち三人はこっちを。"
"10046080-80-セイア" = "先生は……ああ、そわそわしなくても大丈夫だ。#n私の一人用テントがある。#n小型ではあるが、一人で使うのだから、贅沢とも言えるかな？"
"10046080-81" = "[s1] \"その、ありがたいんだけど……。\"\n[s2] \"なんでテントを3つも……？\""
"10046080-82-セイア" = "外泊するのだから、不測の事態に備えるべきだろう？"
"10046080-83-セイア" = "このまま遭難したとしても、2週間は粘れる用意がある。#n救助隊が来るには十分な時間さ。"
"10046080-84-ハスミ" = "……昔から、セイア様はそういうところがありましたね。#n用意周到といいますか、いつも二歩先を見通しているといいますか。"
"10046080-85-セイア" = "ふふ、淑女の嗜みと言ってくれ。"
"10046080-86-セイア" = "さて。ハスミ、イチカ……先生。"
"10046080-87-セイア" = "テントの設営を手伝ってくれるかい？"
"10046080-88-セイア" = "あの二人には、もう少し話し合いが必要みたいだからね。"
"10046080-89" = "（みんなでテントを設営し、就寝する準備を整えた）"
"10046080-90" = "（ナギサは予想外のテント泊を楽しんでいるように見えた）"
"10046080-91" = "（……しばらくして、外が静かになる頃）"
"10046080-92-セイア" = "先生、もう寝てしまったかい？"
"10046080-93" = "[ns3] \"ううん、入っていいよ。\"\n[ns4] \"むにゃむにゃ、もう寝てるよ。\""
"10046080-94-セイア" = "まだ起きているのだね。では、失礼するよ。"
"10046080-95-セイア" = "……二人で使うには窮屈だな。"
"10046080-96-セイア" = "まぁ、内緒話にはちょうどいいだろう。"
"10046080-97-セイア" = "「お姫様を乗せたカボチャの馬車。#nその馬車引きネズミは、どこから来たのか」"
"10046080-98-セイア" = "ハッピーエンド。その裏側の物語。#n誰も気にしないし、本来は描かれることすらない物語。"
"10046080-99-セイア" = "それは、[ruby=・]舞[/ruby][ruby=・]台[/ruby][ruby=・]装[/ruby][ruby=・]置[/ruby]の物語。"
"10046080-100-セイア" = "知っての通り、ティーパーティーのホストは私が務める予定だった。"
"10046080-101-セイア" = "意外に思ったことはないかい？#n本質的にその適性が高いのは、私よりもナギサだというのに。"
"10046080-102-セイア" = "けれど、あの当時ホストとして推薦されたのは私だった。#n……どうして、「あの頃のナギサ」ではなかったのか。"
"10046080-103-セイア" = "単純なことさ。"
"10046080-104-セイア" = "「ネズミは馬車を引くために、馬に変わった」"
"10046080-105-セイア" = "好奇心の赴くままにボタンを押す。#nあれこそ「あの頃の[ruby=きりふじ]桐藤[/ruby]ナギサ」だ。"
"10046080-106-セイア" = "何時如何なる場合でも気品と余裕に満ち溢れ、ハプニングすらも楽しみながら乗り越える。彼女はそういう子だ……そういう子だった。"
"10046080-107-セイア" = "……驚くのも無理はない。#n先生が見てきた姿は、「今のナギサ」だったからね。"
"10046080-108-セイア" = "私[ruby=・]た[/ruby][ruby=・]ち[/ruby]は、あまり良い友達ではなかった。#n良い友達になってあげたかったが、できなかった。"
"10046080-109-セイア" = "結局、ナギサは馬車を引かなければならなくなった。#nお姫様がお城に着くまで、物語がハッピーエンドを迎えるまで――ずっと、独りで。"
"10046080-110-セイア" = "幸いにして、馬車はお城までたどり着いた。#nけれど、役目を終えた「馬」はしかして本来の姿を忘れてしまった。"
"10046080-111-セイア" = "これは一種の贖いだ。#n知っているとも。これが、真の解決策足りえないことなど。"
"10046080-112-セイア" = "だが、彼女はまだネズミに戻ることができる。#nネズミの姿を完全には忘れていない。#n――来るかもしれないその時を思うと、不安で仕方がないんだ。"
"10046080-113-セイア" = "……これでは、ナギサばかりを偏執的だとは言えないな。"
"10046080-114-セイア" = "結局のところ、これは先生にとっての「ネタバレ」ですらない。#n本筋から外れた……知る必要性のないことだ。"
"10046080-115-セイア" = "だが、もう隠すことも、そうする理由も無くなったからね。"
"10046080-116" = "[s5] \"ナギサには聞いてみたの？\"\n[s6] \"今の生活をどう思ってるのか。\""
"10046080-117-セイア" = "……冗談なら笑えないな。当然、聞いていない。#n厳密に言えば、聞けないが正しいか。"
"10046080-118" = "[s] \"なら、大丈夫だと思うよ。\""
"10046080-119-セイア" = "その根拠を聞かせてもらっても？"
"10046080-120" = "[s7] \"秘密だよ。\"\n[s8] \"ネタバレはよくないからね。\""
"10046080-121-セイア" = "……！"
"10046080-122-セイア" = "ふふ、これは一本取られたね。たしかに、私が言った通りだ。#nなんでも先に知ることになれば、面白味に欠けるものだと。"
"10046080-123-セイア" = "だが言い換えれば、期待して良いほど面白い物語になる……#nそう解釈していいのかい？"
"10046080-124" = "[s9] \"うーん、どうかな。でも、ナギサの変化は……。\"\n[s10] \"とても特別であると同時に、とても普通のことだからね。\""
"10046080-125-セイア" = "ふむ……分かるようで分からないな。#nこういった役割は本来私が担うものなのに。"
"10046080-126-セイア" = "……ああ、ネタバレ禁止は理解している。"
"10046080-127-セイア" = "答えの存在を先生が保証してくれた。今はそれで十分だ。#nいつかその解を得る日を、心待ちにしよう。"
"10046080-128-ミカ" = "セイアちゃん、早く戻ってきて！大変なの！"
"10046080-129-ミカ" = "ナギちゃんが3連続でジョーカーを引いてるんだよ！？"
"10046080-130-ナギサ" = "ふふ、ミカ……かつて私が、天使の右手と称されたことをお忘れですか？"
"10046080-131-セイア" = "……おや、お呼びがかかってしまった。"
"10046080-132-セイア" = "ここにいることがバレては面倒だ。"
"10046080-133-セイア" = "では、私はこれで失礼するよ。"
"10046080-134-ミカ" = "セイアちゃん！遅い！"
"10046080-135-ナギサ" = "セイアさんを巻き込むのですね？#nですが、私の優位は揺らぎませんよ。"
"10046080-136-セイア" = "相変わらず、面白味に欠ける遊戯をしているのだね。"
"10046080-137-ミカ" = "そんなこと言うなら混ぜてあげないよ？"
"10046080-138-セイア" = "ふふ、目新しい遊戯を提案しよう。"
"10046080-139-セイア" = "おそらく二人は見たことがないであろう――「ゲーム機」というやつだ。"
"10046080-140-ミカ" = "わ、私たちだってビデオゲームくらい知ってるよ！？ね、ナギちゃん？"
"10046080-141-ナギサ" = "も、もちろんです！娯楽の一種、ですよね？"
"10046080-142-ナギサ" = "まさかセイアさんがそのような物を持っているとは思いませんでしたが。"
"10046080-143-ミカ" = "ああ。先の交流会で、ミレニアムの……友人たちが贈ってくれたものだ。"
"10046080-144-ミカ" = "え、セイアちゃんにお友達がいるの？"
"10046080-145-セイア" = "おや？交友関係は、君よりも遥かにマシだと思うが？"
"10046080-146-ミカ" = "へえ？でも、お休みの日は部屋にこもってばっかだよね？"
"10046080-147-セイア" = "友人との予定を[ruby=・]作[/ruby][ruby=・]れ[/ruby][ruby=・]な[/ruby][ruby=・]い[/ruby]のと[ruby=・]作[/ruby][ruby=・]ら[/ruby][ruby=・]な[/ruby][ruby=・]い[/ruby]のには、雲泥の差があるのだよ。"
"10046080-148-ナギサ" = "交友関係でしたら、私も――"
"10046080-149-ミカ" = "ごめん……ナギちゃんは、その……。"
"10046080-150-セイア" = "ああ、ナギサは論外だね。"
"10046080-151-ナギサ" = "はい！？"
"10046080-152-ナギサ" = "どうしてですか！！私にだってお友達は――"
"10046080-153-ミカ" = "それって、一歩後ろで「ナギサ様」ってついてくる子たちじゃないよね……？"
"10046080-154-セイア" = "普通、そういう関係は友人と呼ばない。主従関係と言う。"
"10046080-155-ミカ" = "うわっ、セイアちゃん……ストレートにいったね！？"
"10046080-156-セイア" = "そろそろ、現実と向き合う必要があるからね。"
