[translation]
"10046230-1-コハル" = "せ、先輩！"
"10046230-2-イチカ" = "あれ、コハル？何か用っすか？"
"10046230-3-イチカ" = "手伝いに来ました！私も正義実現委員会の一員なので！"
"10046230-4-イチカ" = "うーん……でも、今の所属は……。"
"10046230-5-イチカ" = "……。"
"10046230-6-イチカ" = "ま、頼んじゃいますか。"
"10046230-7-コハル" = "ほ、本当ですか！？"
"10046230-8-イチカ" = "もちろんっす。#nコハルみたいな優秀な後輩がいてくれたら、私も心強いっすから。"
"10046230-9-コハル" = "イチカ先輩と、初めての合同作戦……！"
"10046230-10-コハル" = "わ、私、頑張ります！"
"10046230-11-イチカ" = "頼りにしてるっすよ！"
"10046230-12-コハル" = "や、やった！"
"10046230-13-コハル" = "頑張って活躍して、正義実現委員会に復帰してやるんだから！"
"10046230-14-イチカ" = "……。"
"10046230-15-イチカ" = "補習授業部にいるのは成績のせいっすよね……？#nそれとこれとは関係ないんじゃ……。"
"10046230-16-イチカ" = "まあ、無粋なことは言いっこなしで。"
