[translation]
"10057060-1" = "第6話;みんなの物は、みんなの物"
"10057060-7-アンナ" = "うぅ……。#n懲戒処分受けてから、レッドウィンターの中心部に来るのは初めてな気がする……。"
"10057060-8-エリナ" = "な～にビビってんの～？こーゆー時は、ドーンと構えればいいんだって！"
"10057060-9-ラナ" = "山を下りるだけで大変だった。足が痛い。"
"10057060-10-エリナ" = "もうちょっと頑張って！途中で荷車に乗せてあげるから！"
"10057060-15-エリナ" = "ひぃん……。#nせっかくここまで来たのに、夜だからズナーミャカフェが閉まってる……。"
"10057060-16-エリナ" = "……それより、先生は私たちと一緒にいて大丈夫なんですか？"
"10057060-17" = "[s] \"責任者が必要でしょう？\""
"10057060-19" = "[ns] \"使ったら返すんだよね……？\""
"10057060-24-アンナ" = "と、当然です！私たちは窃盗団ではありませんから！"
"10057060-25-アンナ" = "レッドウィンター内で、少し移動するだけです。"
"10057060-26-エリナ" = "そろそろ、各自の担当を決めよーか。"
"10057060-27-エリナ" = "電線に使う銅は……。"
"10057060-28-ラナ" = "私がやる。"
"10057060-29-エリナ" = "ラナがやってくれるの？"
"10057060-30-ラナ" = "うん。この近くに目を付けてたものがあるから。"
"10057060-31-エリナ" = "よ～しっ！任せた！"
"10057060-32-エリナ" = "ラナ。もし誰かに疑われたら、どうするんだっけ？"
"10057060-33-ラナ" = "かわいそうに見えるよう、可愛らしく泣く。"
"10057060-34-エリナ" = "そうそう。それでも逮捕されたら、どうする？"
"10057060-35-ラナ" = "思いつく限りの183号以外の人の名前を全て出して、#nレッドウィンター全体を混乱させて行政組織を麻痺させる。"
"10057060-36-エリナ" = "やっぱり、私たちの中でラナが一番賢いね～！"
"10057060-37-ラナ" = "うん。"
"10057060-39-アンナ" = "エリナ、チタンはどうやって手に入れるの？"
"10057060-40-エリナ" = "方法はあるけど……一度には難しいから一緒に回りながら探そう。"
"10057060-41-エリナ" = "それじゃあ183号特別クラス、作戦開始！"
"10057060-43-一同" = "おー！"
"10057060-51-ラナ" = "銅……。電線を切るとみんなが困る。人を困らせたらダメって怒られた。"
"10057060-52-ラナ" = "でも、銅像は広場にたくさんあるから……1個ぐらい借りてもいいよね。"
"10057060-56-ラナ" = "チビ会長、左耳をちょっとお借りします。"
"10057060-57-ラナ" = "たくさん削ると目立つから、電線に使う分だけ。"
"10057060-61-ラナ" = "うーん。ちょっと不揃いになってる。"
"10057060-62-ラナ" = "非対称、良くない。"
"10057060-63-ラナ" = "右も削ってバランスを取ってあげますね。"
"10057060-69-ラナ" = "うーん……。"
"10057060-70-ラナ" = "左右のバランスはいいけど、今度は顔が大きく見える。"
"10057060-71-ラナ" = "会長、可愛くしてあげますね。"
"10057060-83-アンナ" = "どうして壁からペンキを削り落としているの？もう乾いちゃってるのに？"
"10057060-84-エリナ" = "材料の調達！めーっちゃ詰め込まないと。"
"10057060-89-エリナ" = "ズルッ！ううっ、まだ来たばっかりなのに風邪ひきそう……。"
"10057060-90-アンナ" = "エリナ、レッドウィンターの生徒なのに寒さに弱いよね？"
"10057060-91-エリナ" = "う、うるさいっ！#nズルルッ。最近は大丈夫だったのに……#nメチルアミンが切れたせいで風邪薬も作れないって、ほんっとありえない！"
"10057060-92-エリナ" = "外に出るだけで大変なんだけど！ズルズル、フンッ！！"
"10057060-97-アンナ" = "しーっ、静かに！！夜間立ち入り禁止区域なんだから、見つかったら終わりよ！"
"10057060-98-エリナ" = "は、鼻水なんて思いどおりにできないでしょ！自律神経系には逆らえないって！"
"10057060-99-エリナ" = "うう……ゴホゴホ、ゲホッ……。"
"10057060-100-アンナ" = "どうしてわざわざ事務局に来たの？#n他にペンキが塗られている所はいくらでもあるのに。"
"10057060-101-エリナ" = "ここで「借りれば」、罪悪感がないからかな？"
"10057060-102-エリナ" = "それに事務局が、いっちばん高いペンキを使っているから！#n他の安っぽいペンキは石灰分が多くてムリ！"
"10057060-103-アンナ" = "チェリノ会長に知られでもしたら、永遠に183号で……。"
"10057060-111-エリナ" = "ズルズル……どうしたの？"
"10057060-112-アンナ" = "しーーーっ！！！"
"10057060-113-アンナ" = "廊下の向こう側で音がした。巡回中みたい！静かにしないと！"
"10057060-127-アンナ" = "ま、マリナ保安委員長！？"
"10057060-128-エリナ" = "ば、バレたらおしまいじゃん！うっ……。"
"10057060-132-エリナ" = "げ、ゲホッ。ゴホゴホッ！"
"10057060-140-親衛隊" = "どうかなさいましたか？マリナ委員長。"
"10057060-141-マリナ" = "あっちから人の気配を感じたのだが。"
"10057060-142-マリナ" = "ふむ……。"
"10057060-144-アンナ" = "（しーっ！しーーーっ！！！）"
"10057060-145-エリナ" = "（ちょっ！息できないんだけど！？）"
"10057060-146-アンナ" = "（ここで咳したらバレちゃうから！我慢して！！）"
"10057060-147-エリナ" = "ううっ……！ううっ……！"
"10057060-153-マリナ" = "夜間の巡回は、なんだか心細く感じるな。"
"10057060-154-マリナ" = "ただの夜間警備の点検とはいえ、久しぶりで勘が鈍っているみたいだ。"
"10057060-155-マリナ" = "次の階の巡回が終わったら、一度休むとしよう。"
"10057060-166-エリナ" = "ぷはあっ……はあ……。"
"10057060-167-アンナ" = "だ、大丈夫？少しは落ち着いた？"
"10057060-168-アンナ" = "咳を我慢するのは大変よね、よく頑張っ――"
"10057060-173-エリナ" = "ぶえーっくしゅん！！！！！"
"10057060-179-マリナ" = "不審者だ！！捕まえろ！！！"
"10057060-181-アンナ" = "ちょっ！？目に入ったわよ！？"
"10057060-182-エリナ" = "ひぃ～ん！！咳もくしゃみも止めるなんてムリ～！！！"
"10057060-187-親衛隊" = "絶対に逃がすな！！！"
"10057060-192-アンナ&エリナ" = "ぎゃあああん！！！"
