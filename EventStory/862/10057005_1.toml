[translation]
"10057005-1" = "プロローグ"
"10057005-2" = "シャーレ・オフィス"
"10057005-5" = "（暖かくて、だんだん眠気が……）"
"10057005-11" = "[ns1] \"どうぞ。\"\n[ns2] \"開いてますよ。\""
"10057005-16" = "[ns3] \"なんで入ってこないんだろう？\"\n[ns4] ドアを開けてみる。"
"10057005-24-？？？" = "あ……。"
"10057005-25-？？？" = "あなたは……シャーレの、先生……ですか？"
"10057005-26" = "[s] \"そうだよ。ふらふらしているけど大丈夫……？\""
"10057005-27-？？？" = "みんなの面倒を見てくれて、何でも解決してくれる……。"
"10057005-28-？？？" = "シャーレの、先生……。"
"10057005-33-？？？" = "やっと、会えた……。"
"10057005-37" = "[ns] \"大丈夫！？\""
"10057005-45" = "シャーレ・休憩室"
"10057005-48-セリナ" = "幸い、どこにも問題はありませんでした。"
"10057005-49-セリナ" = "栄養失調でもなさそうなので、過労だと思います。"
"10057005-50" = "[s] \"それなら良かった。\""
"10057005-52" = "[ns5] \"ところで、セリナ。\"\n[ns6] \"いつの間に来てたの？\""
"10057005-56-セリナ" = "も、もうこんな時間ですね。最近、時計が本当に早くて困ります。"
"10057005-57-セリナ" = "それでは、私はこれで……。#n目を覚ましたら、白湯を飲ませてあげてくださいね。"
"10057005-60" = "[ns] （一体、どこから入ったんだろう……）"
"10057005-65-？？？" = "う、うぅ……。"
"10057005-71-？？？" = "先生……。"
"10057005-75-？？？" = "なるほど。ラジオで聞いていた通りの見た目ですね。"
"10057005-76" = "[s] \"おはよう。具合はどう？\""
"10057005-77-？？？" = "問題ありません。ここまでは想定内ですので。"
"10057005-78-ラナ" = "そうだ……初めまして。#n私はレッドウィンター連邦学園の[ruby=ふるはた]古畑[/ruby]ラナと申します。"
"10057005-79-ラナ" = "急なお願いで恐縮ですが、先生にお力をお借りできないでしょうか。"
"10057005-80" = "[s7] \"私の力？\"\n[s8] \"何を手伝えばいいの？\""
"10057005-85-ラナ" = "止めて欲しいのです――"
"10057005-86-ラナ" = "終わりのない[ruby=・]争[/ruby][ruby=・]い[/ruby]を。"
"10057005-87" = "[s] \"争い……クーデターとか？\""
"10057005-88-ラナ" = "いえ、クーデターではありません。"
"10057005-89-ラナ" = "この[ruby=・]争[/ruby][ruby=・]い[/ruby]を止められるのは……。"
"10057005-92-ラナ" = "先生、あなただけなのです。"
"10057005-94" = "？"
"10057005-98" = "#video;10057"
