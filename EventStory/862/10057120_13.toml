[translation]
"10057120-1" = "第12話;それぞれにとっての平和"
"10057120-14-ミノリ" = "労働者の権利を！さらなる保障を！"
"10057120-22-親衛隊" = "やめさせろ！"
"10057120-30-ミノリ" = "圧政者を引きずり下ろし、週休5日制を勝ち取るぞ！"
"10057120-31-ミノリ" = "総員、突撃！！！"
"10057120-35-アンナ" = "事務局ってこっちだったっけ？昼に来るのは久しぶりだから迷うわね……。"
"10057120-36-エリナ" = "なんて～？銃声で～！よく聞こえない～！"
"10057120-37-アンナ" = "まあ、大丈夫よね！ラナもちゃんとついてきて！"
"10057120-38-ラナ" = "気圧変化が……うう……。"
"10057120-39-エリナ" = "ひぃん……。せっかく昼間に来たのに、#nクーデターのせいでズナーミャカフェ閉まってるじゃ～ん……。"
"10057120-40-エリナ" = "あの～、射撃中にごめんなさ～い。通りま～す。"
"10057120-45-エリナ" = "は～い、ありがとうございま～す。続きをどうぞ～"
"10057120-46-親衛隊" = "射撃、開始！！"
"10057120-56-アンナ" = "そういえば、今日はなんだか暖かいわね。"
"10057120-57-アンナ" = "ここ数日吹雪で大変だったけど、なんかうまくいきそう。"
"10057120-62-エリナ" = "あっ、手榴弾だ。"
"10057120-65-エリナ" = "すうーっ、甘いTNTの匂い。これ、だれの～？"
"10057120-66-工務部の部員" = "ごめんなさい！私が投げたんだけど、手が滑っちゃって！"
"10057120-67-エリナ" = "んじゃ、あっちに投げますねー。ほいっ！"
"10057120-71-親衛隊" = "ぐはぁっ！！"
"10057120-75-アンナ" = "本戦に行けたのはいいけど、なんか気が抜けちゃったわね。"
"10057120-76-アンナ" = "突然クーデターが起きて、予選出場者が私たちだけになるなんて。"
"10057120-77-エリナ" = "だから後でもう一度予選をやるんだって～#n私たちは本戦進出確定ってことで。"
"10057120-78-ラナ" = "予選会場で燃料をたっぷり入れてもらえて良かった。"
"10057120-79-エリナ" = "タダなのは良いんだけど、もらい過ぎでしょ。ガソリン臭～い……。"
"10057120-82-親衛隊" = "射撃停止！射撃停止！誰だ！"
"10057120-83-アンナ" = "こんにちは、183号です。ハンコをもらいに来ました。"
"10057120-84-親衛隊" = "あ、執務室に行くんですね。今はちょっと混雑しているかと。"
"10057120-85-親衛隊" = "2階で検問にあったら、1階で確認したと言ってください。"
"10057120-86-アンナ" = "分かりました。みなさん、お昼ご飯は？"
"10057120-87-親衛隊" = "実は……交代が来ないので、まだ……。"
"10057120-88-アンナ" = "それなら、事務局に言っておきますね。"
"10057120-89-親衛隊" = "ありがとうございます！"
"10057120-91" = "事務局内"
"10057120-96-ラナ" = "私たち……服もほとんど持ってないよね。3人分の服がスーツケース1つに収まっちゃう。"
"10057120-97-エリナ" = "じゃあ、あとでショッピングも行こう！#nゲヘナは暖かいらしいし、新しい服が必要でしょ！"
"10057120-98-アンナ" = "そうね。ゲヘナには火山もあるから。"
"10057120-99-エリナ" = "水着も買いたいけど、高いかな～？"
"10057120-100-アンナ" = "後払いはできるかしら？どのみち、優勝賞金は私たちのものだし！"
"10057120-103-アンナ" = "あっ、1階の隊員さんがお昼の交代をしてほしいそうですよ。"
"10057120-104-親衛隊" = "本当だ、もうこんな時間……ありがとうございます！"
"10057120-107-ラナ" = "賞金が出たらノートパソコンを買いたい。"
"10057120-108-エリナ" = "いっくらでも！ラナは1台ぐらい持ってなきゃ！"
"10057120-109-ラナ" = "パンチカードリーダーがついてるものにする。"
"10057120-110-アンナ" = "今時そんなの売ってる？"
"10057120-113-親衛隊" = "生徒会長を守れ！中には誰も入れるな！"
"10057120-118-マリナ" = "同志よ！チェリノを追放せよ！総員、突入！革命成就は目の前だ！"
"10057120-124-エリナ" = "あの～、事務局に入るために並んでます？"
"10057120-125-工務部の部員" = "いえ、前の人が倒れたら銃を拾おうと思って。"
"10057120-126-エリナ" = "んじゃ、並ばなくていいね。ありがとうございます！"
"10057120-130-アンナ" = "クーデターではなく別件で来ました。通りますね～"
"10057120-139-アンナ" = "失礼します。外出許可証にハンコをもらいに来ました。"
"10057120-142-アンナ" = "ドアはないのね。失礼します。"
"10057120-143-？？？" = "こ、こんにちは……。"
"10057120-144-アンナ" = "こんにちは！チェリノ会長は？"
"10057120-145-？？？" = "親衛隊を集めてくるとのことで、今はいらっしゃいません。"
"10057120-146-？？？" = "私もハンコをもらいに来たんですが、ちょうどいらっしゃらなくて……。"
"10057120-147-自称レッドウィンター生徒会長" = "だから、私が生徒会長をやることにしました。"
"10057120-148-自称レッドウィンター生徒会長" = "えーっと、ハンコハンコ……。"
"10057120-152-自称レッドウィンター生徒会長" = "これは保安委員会のだから違う。これは勲章。うーん……。"
"10057120-153-ラナ" = "ふむ。ハンコって、こんな形なんだ。"
"10057120-156-自称レッドウィンター生徒会長" = "見つかりました！書類をください。"
"10057120-157-自称レッドウィンター生徒会長" = "ゲヘナカップですか。お気をつけて。"
"10057120-158-自称レッドウィンター生徒会長" = "次の方、どうぞ～"
"10057120-162-ノドカ" = "シグレちゃん！私たちの番だよ！"
"10057120-163-ノドカ" = "会長が変わった今がチャンス！復学書類にハンコをもらおう！"
"10057120-164-シグレ" = "こんな簡単に停学解除できるなんて思わなかったよ。"
"10057120-165-ノドカ" = "復学の承認をもらいに来ました！"
"10057120-166-自称レッドウィンター生徒会長" = "あー、はいはい。えーっと……。"
"10057120-170-自称レッドウィンター生徒会長" = "あれ？システムには、227号特別クラスなんてありませんよ？"
"10057120-171-ノドカ" = "え！？そんなはずないです！！"
"10057120-172-シグレ" = "どうしたんだろう？何かのエラーかな？"
"10057120-179-アンナ" = "とうとう外出許可をもらったわ！"
"10057120-180-エリナ" = "私たち、ホントにゲヘナカップに出場するんだねー！"
"10057120-181-エリナ" = "……ん？ラナ、何描いてるの？"
"10057120-183-ラナ" = "記憶が薄れる前にスケッチしておく。"
"10057120-184-ラナ" = "レッドウィンターでプロトコルに使用されるセキュリティキー設計図のコピー。"
"10057120-185-ラナ" = "認証機器管理の脆弱性を利用して権限昇格してみようかと。"
"10057120-187-エリナ" = "何のことかさっぱりだけど、面白そ～！"
"10057120-188-アンナ" = "あれ？ところで、先生は？"
"10057120-190-ラナ" = "用事があるからって先に帰ったよ。本戦会場で会おうって。"
"10057120-191-ラナ" = "それと、クーデターはあまり好きじゃないって言ってた。"
"10057120-193-エリナ" = "そうなんだ……なら、先生には必ず本戦で活躍を見せよう！"
"10057120-194-アンナ" = "目標は優勝よ！"
"10057120-195-アンナ" = "よしっ！183号、万歳！！"
"10057120-199-一同" = "ばんざーい！！"
"10057120-201" = "It's our Engine! ～183号を脱出せよ！～"
"10057120-205" = "It's our Engine! ～183号を脱出せよ"
"10057120-208" = "It's our Engine! ～183号を脱出"
