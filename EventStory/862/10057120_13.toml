"10057120-242-エリナ" = "ねえ、何してんの～？"
"10057120-244-アンナ" = "え？外出許可証をなくさないように、クリップでまとめたのよ。"
"10057120-245-エリナ" = "そんなに強く挟んだら、取り出す時に大変でしょ。"
"10057120-247-ラナ" = "「意見交換」1回目。"
"10057120-248-アンナ" = "じゃあ、どうしたらいいの？"
"10057120-249-エリナ" = "ほら～、こうするんだよ。"
"10057120-250-アンナ" = "ちょっと！それじゃ紙に穴が開いちゃうじゃない！"
"10057120-252-ラナ" = "「意見交換」2回目。"
"10057120-253-エリナ" = "この美的センス、分っかんないかな～？"
