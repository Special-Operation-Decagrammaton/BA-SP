[translation]
"10057010-1" = "第1話;183号特別クラス"
"10057010-6" = "[ns1] \"寒っ……。\"\n[ns2] \"本当に、こっちで合ってるの？\""
"10057010-9-ラナ" = "はい。方向は合っています。"
"10057010-10-ラナ" = "問題は距離ですね。まだ時間がかかります。"
"10057010-11-ラナ" = "私が無理を言ったせいで――"
"10057010-12-ラナ" = "本当にすみません、先生。"
"10057010-13" = "[s3] \"だ、大丈夫だよ……。\"\n[s4] \"ラナが悪いわけじゃないし……。\""
"10057010-16-ラナ" = "信号弾を撃ちます……。"
"10057010-23-ラナ" = "これで……助けに、来てくれるはずです。"
"10057010-24-ラナ" = "見ていたら……ですけど……。"
"10057010-28-ラナ" = "風が、強く……。"
"10057010-29-ラナ" = "だんだん、眠く……。"
"10057010-34" = "[ns5] \"寝ちゃダメだよ……絶対……。\"\n[ns6] \"私が風避けになるから……。\""
"10057010-40" = "（ねむ、い……）"
"10057010-53-？？？" = "ねえ、起きてちょうだい。"
"10057010-54-？？？" = "ふわぁ！？ね、寝てないけどぉ！"
"10057010-55-？？？" = "はぁ……ストーブつけると、すぐ寝るよね。"
"10057010-56-？？？" = "寝てたんじゃないよ！えーっと、なんだっけ……。#nそ、そう！[ruby=・]め[/ruby][ruby=・]い[/ruby][ruby=・]そ[/ruby][ruby=・]う[/ruby]してただけ！"
"10057010-60" = "知らない所"
"10057010-63-見知らぬ人の声A" = "ラナは？"
"10057010-64-見知らぬ人の声B" = "さっき起きて、顔洗いにいったよ～"
"10057010-65-見知らぬ人の声B" = "買い物に行ってしばらく帰ってこないと思ったら……。#nなんで知らない人と一緒に戻ってきたんだろ？"
"10057010-66-見知らぬ人の声B" = "この人ってさ～、なんか、で……でじゃ……。"
"10057010-67-見知らぬ人の声A" = "「[ruby=デジャヴ]既視感[/ruby]」？"
"10057010-68-見知らぬ人の声B" = "それそれ！なんか既視感すごくない？"
"10057010-69-見知らぬ人の声A" = "たしかにどこかで見たことあるような……誰だったかしら……。"
"10057010-74" = "[ns] \"シャーレの先生です……。\""
"10057010-76-見知らぬ人の声A&B" = "う、うわあああっ！！！"
"10057010-77-見知らぬ人の声A" = "お、起きていたんですか！？"
"10057010-78-見知らぬ人の声B" = "ビックリしたぁ～！もう平気なんですか？"
"10057010-79" = "[s] \"うん、体も温まったから大丈夫。\""
"10057010-80-見知らぬ人の声A" = "信号弾を見て駆けつけたら、#n雪山でラナと一緒に倒れていたので本当に驚きました。"
"10057010-81-見知らぬ人の声A" = "ラナも無事でよかったです。"
"10057010-85-見知らぬ人の声B" = "というか、先生って……。"
"10057010-89-見知らぬ人の声B" = "あの、シャーレの先生！？ほんとに！？"
"10057010-90" = "[s7] \"そ、そうだよ……。\"\n[s8] \"そんなに驚くようなことかな……。\""
"10057010-93-見知らぬ人の声B" = "ひゃ～、やば～"
"10057010-94-見知らぬ人の声A" = "雑誌で見たことある人に似ていると思いましたけど……まさか……。"
"10057010-95-見知らぬ人の声B" = "あ、そだ！せんせーせんせー！「あの記事」ほんとなんですかぁ！？"
"10057010-96" = "[s] \"ど、どの記事……！？\""
"10057010-97-見知らぬ人の声A" = "「レッドベア」の特集記事のことです。#nもちろん、私たちは信じていませんが。"
"10057010-98-見知らぬ人の声B" = "そうそう！「レッドベア」なんて胡散臭い記事ばっかだし！"
"10057010-99-見知らぬ人の声B" = "まぁ、ガチの嘘はないって聞いたけど……。"
"10057010-104" = "[ns9] （……）\n[ns10] （後でヤクモに話を聞かないと）"
"10057010-109-見知らぬ人の声A&B" = "あ、あはははは……。"
"10057010-112-見知らぬ人の声A" = "な、なるほど……。#n先生にもご事情があったんですね。"
"10057010-113-見知らぬ人の声A" = "あっ、すみません。#n自己紹介がまだでしたね。"
"10057010-117-アンナ" = "私は183号特別クラスの学級委員長で機械工学の主任、アンナと申します。#n以後お見知りおきを。"
"10057010-118-アンナ" = "レッドウィンター科学アカデミーの主席活動委員で連邦名誉発明家、#n第一級髭勲章を受賞、そして――"
"10057010-119-見知らぬ人の声B" = "長っ！いつまでやんの！？"
"10057010-120-エリナ" = "はいはーい！私はエリナ！"
"10057010-121-エリナ" = "同じく183号特別クラスの……副学級委員長兼、化学主任で～す！#n以上終わり！"
"10057010-122-アンナ" = "肩書が短く済んで良かったじゃない。"
"10057010-123-アンナ" = "研究を頑張ったらもっと長い自己紹介ができるのにねぇ？"
"10057010-124-エリナ" = "はぁ～？#n羨ましくないし！そんなに自己紹介が好きなら、ずっとしてればいいじゃん！"
"10057010-125" = "[s11] \"183号特別クラス？\"\n[s12] \"227号特別クラスと何か関係があるの？\""
"10057010-130-アンナ" = "227号？"
"10057010-131-エリナ" = "なにそれ？"
"10057010-135-ノドカ" = "くしゅっ！"
"10057010-136-シグレ" = "もう、布団掛けないで寝るからだよ。"
"10057010-137-ノドカ" = "うぅ……誰かが私の噂でもしてるのかな？"
"10057010-140-アンナ" = "227号のことは分かりませんが……#n私たち183号はレッドウィンター有数の研究組織です。"
"10057010-141-アンナ" = "レッドウィンターきっての科学者が集まって、あらゆるコア技術を開発――"
"10057010-142-アンナ" = "ネジや飲食物をはじめ……電子機器、電気製品など様々なものを作っています。"
"10057010-143-エリナ" = "えっへん！"
"10057010-145" = "[s] （息ぴったりだな……）"
"10057010-148-エリナ" = "ねえ、先生に「アレ」見せよーよ！"
"10057010-149-アンナ" = "え、「アレ」！？今！？"
"10057010-150-アンナ" = "ほ、ほら……会ったばっかりだし、ちょっと早すぎるんじゃ……。"
"10057010-151-アンナ" = "こういうのは……信頼関係を築いてからの方が……。"
"10057010-152-エリナ" = "何言ってんの、むしろ今見せないと！味方に引き込むのは早い方がいいって！"
"10057010-153-アンナ" = "だ、ダメ！やっぱりちょっと恥ずかしいわ！！"
"10057010-154-エリナ" = "ほら、覚悟決めて！見せたからって減るもんじゃないんだから！"
"10057010-159-エリナ" = "先生！私の手を握って、目をつぶったままついてきてください！"
"10057010-160" = "[s] \"え？わ、わかった……？\""
"10057010-164-アンナ" = "だ、ダメだって！！ちょっと待ってちょうだい！！"
"10057010-170-エリナ" = "先生～、まだですよ～！"
"10057010-171-アンナ" = "ねぇ、やっぱりやめようってば！"
"10057010-172-エリナ" = "もう、いつまで言ってんの！早く準備して！"
"10057010-173-アンナ" = "もう、知らないんだから！！"
"10057010-177-エリナ" = "先生、もういいですよ！"
"10057010-178-エリナ" = "ビックリして腰を抜かさないでくださいね？"
"10057010-179" = "[ns13] （恐る恐る目を開ける）\n[ns14] （やむを得ず目を開ける）"
"10057010-184" = "[ns] \"これは？\""
"10057010-186-エリナ" = "ジャジャーン！！どうです？すごいでしょ！"
"10057010-187-アンナ" = "この状態で見せてもガッカリさせるだけなのに……！もう！"
"10057010-188-エリナ" = "そんなことないって！ねぇ先生！これが何なのか、分かりますよね？"
"10057010-189" = "[s15] \"うーん……かっこいい、トラクター……かな？\"\n[s16] \"あ……すごい、装甲車……かな？\""
"10057010-194-アンナ&エリナ" = "失礼な！！！"
"10057010-195-アンナ" = "どこからどう見ても戦車じゃないですか！"
"10057010-196-エリナ" = "これだから素人は！"
"10057010-197" = "[s] \"戦車……？\""
"10057010-198-アンナ" = "ええ、私たちが製作中の戦車です。"
"10057010-199-アンナ" = "これは車体で、あとは砲塔を設置するだけなんですが……。"
"10057010-200-エリナ" = "これでも十分でしょ！先生なら分かってくれるはず！"
"10057010-201" = "[s] \"あ、改めて見ると……すごくかっこいいね！\""
"10057010-205-アンナ&エリナ" = "でしょう！？"
"10057010-206-アンナ" = "砲塔の装甲は傾斜させようと思っているんです。#nそうすると弾が滑るので、防御力が上がるんです。"
"10057010-207-エリナ" = "え～？それだと車内が狭くなるから半球形にしようって話し合ったじゃん！"
"10057010-208-アンナ" = "え？そうだっけ？"
"10057010-209-エリナ" = "すっとぼけんな～！"
"10057010-216-ラナ" = "先生。"
"10057010-217" = "[s17] \"ラナ！体調は大丈夫？\"\n[s18] \"一体これは……？\""
"10057010-220-ラナ" = "あれが「意見交換」です。"
"10057010-221-ラナ" = "「説得」まで、あと2回やります。"
