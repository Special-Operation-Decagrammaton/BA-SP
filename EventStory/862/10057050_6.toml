[translation]
"10057050-1" = "第5話;なんで戦車なの？"
"10057050-3" = "[log]戦車レース予選まで[/log]"
"10057050-5" = "[log]D-3[/log]"
"10057050-9-エリナ" = "良いニュースは、戦車の製作が順調なこと――"
"10057050-10-エリナ" = "悪いニュースは、例の超低価格プリンの研究が成功してしまったことです！"
"10057050-11-エリナ" = "見た目も感触もプリンなのに……#n水の比率を限界まで上げたせいで、口に入れた瞬間になくなってしまうんです！"
"10057050-12-エリナ" = "まあ……#n指示どおり「口の中でとろける」プリンにしたんだから文句は言われないでしょ……。"
"10057050-13-エリナ" = "これを給食で食べるみんな、先に謝らせて！ごめんね～！"
"10057050-14-エリナ" = "とにかく……戦車のほうは、昨日から驚くほどうまくいってます！"
"10057050-15" = "[s] \"アンナとの意見調整も順調？\""
"10057050-16-エリナ" = "そっちもうまくいってる……ような気がします！先生のおかげです！"
"10057050-17-エリナ" = "アンナは賢い上に実力もあるんです。戦車の設計が専門分野なので頼りにもなるし。"
"10057050-18-エリナ" = "だけど協力する時はちょっと分からず屋……あ、これは言い過ぎかな……。"
"10057050-19-エリナ" = "ほら、あれ……何て言うんだっけ？#n「頑固で、相手の言うことを聞いてくれない人」のこと。"
"10057050-20" = "[s] \"そ、その言葉は……思い出さなくていいかも！\""
"10057050-21-エリナ" = "エンジニアとして相応しくないところがあるというか……#n実際、全然相応しくないのかも。"
"10057050-22-エリナ" = "でも私たちの中で、実際に動く戦車を作れるのはアンナだけだから……#n信じるっきゃないです！"
"10057050-23-エリナ" = "何か、勝つ秘策があるんだと思います。#nいつも無駄に威張ってるわけじゃないだろうし！"
"10057050-24-エリナ" = "それに、山の上はもうやです！#n寒くてすぐ風邪ひいちゃうし、甘いデザートもかわいい服も売ってないんですもん！"
"10057050-28-エリナ" = "あ、もちろん……デザートも服も、あくまで研究の参考資料として……ですよ？"
"10057050-29-エリナ" = "えへへ……！"
"10057050-30" = "[s] \"研究は大事、だよね！\""
"10057050-32" = "[ns] \"他にもいろいろあるのに、なんで戦車なの？\""
"10057050-33-エリナ" = "戦車は、機械・化学・電子が集まった重工業なので！#n苦労して勉強したことを実践するのにピッタリだと思いません？"
"10057050-34-エリナ" = "鋼板の熱処理・火薬の配合・燃料と潤滑油の合成に関しては全て化学ですから！"
"10057050-35-エリナ" = "それに、めちゃかっこいいし！"
"10057050-38-アンナ" = "エリナ、そんな話をしていたんですね。私の前でも言ってくれたらいいのに。"
"10057050-39-アンナ" = "確かにエリナとは意見が合わないことが多いです。#n目標は同じなのに方法が全く違うというか。ふぅ……。"
"10057050-40-アンナ" = "専攻から経歴まで何もかも違うので仕方ないですが。例えば……。"
"10057050-44-アンナ" = "先生は、追加の燃料タンクを戦車の横につけて走るとどうなると思いますか？"
"10057050-45-アンナ" = "危険でしょうか、安全でしょうか？"
"10057050-46" = "[s] \"砲弾が当たって燃えたら危ないような……。\""
"10057050-47-アンナ" = "ふふっ、たしかに見た目は危険そうですよね。"
"10057050-48-アンナ" = "でも、実際はむしろ安全性が向上するんです。#n燃料タンクが戦車を保護してくれるので！"
"10057050-49" = "[s] \"そうなの？どんな風に？\""
"10057050-50-アンナ" = "そもそも……外部の燃料タンクに火がついても、#n車体が鋼鉄ですから大きな影響はありません。"
"10057050-51-アンナ" = "それに、燃料は砲弾の威力を軽減してくれます。"
"10057050-52-アンナ" = "つまりこの設計にすることで、#n燃料タンクの容積と防御力の問題を同時に解決できて一石二鳥というわけです！"
"10057050-53-アンナ" = "特に成形炸薬弾の場合は……#n燃料が貫通力を下げるので、空間装甲の役割も果たしてくれるんですよ！"
"10057050-54-アンナ" = "一見危険そうに見えても、実はそうではないという好例ですね。"
"10057050-55-アンナ" = "でもエリナにこれを提案すると、すごい顔をするんです。"
"10057050-56-アンナ" = "普段はクールを装っていますが、意外と小心者なんですよね、彼女。"
"10057050-57" = "[s] \"戦車の製作は順調なの？\""
"10057050-61-アンナ" = "……ええ！以前とは比べ物にならないスピードで進んでいます。"
"10057050-62-アンナ" = "以前なら「RWWE」で1つずつ決めていたので時間がかかっていたんです。#nレスリングに集中しすぎて、何で争っていたのか忘れることもあったくらいですし。"
"10057050-63-アンナ" = "……先生に助けていただかなかったら、どうなっていたことやら。"
"10057050-64" = "[s] \"他にもいろいろあるのに、なんで戦車なの？\""
"10057050-65-アンナ" = "……戦車にした理由、ですか？"
"10057050-66-アンナ" = "チェリノ会長が「ゲヘナカップで勝つのだ！」と言った時、#n事務局員がここまで大会ポスターを貼りに来たんです。"
"10057050-67-アンナ" = "その時何気なく「戦車なんて久しぶり」って言ったら、エリナが興奮しちゃって。"
"10057050-68-アンナ" = "そのままやる流れになっちゃったんです。"
"10057050-69-アンナ" = "まぁ、言うまでもありませんが……私がいなければ製作できませんからね！#nレッドウィンター……いや、キヴォトス最高の戦車設計者ですから！"
"10057050-70-アンナ" = "戦車……それは機械工学の集大成といえます。動力・構造・材料・加工――#nそれら全てが1枚の設計図から始まり、素晴らしい機械生態系を成しているんです！"
"10057050-71-アンナ" = "このような機会に私が参加しないのは、工学に対する冒涜と言えるでしょう。"
"10057050-72-アンナ" = "溶接の手順も全て私が作成しました！#n溶接の順序が雑だと、残留応力で車体がねじれてしまいますから！"
"10057050-73-アンナ" = "ふぅ……アカデミー主席の天才も楽じゃないですね。#nこんな所でも、戦車を作る運命だなんて。"
"10057050-74-アンナ" = "今のうちに優勝時のスピーチを考えておかないと……。"
"10057050-76-ラナ" = "そうですか、進展があったなら良かったです。"
"10057050-77-ラナ" = "あ、足元にご注意ください。ゴムホースを整理していたので。"
"10057050-78-ラナ" = "2人の意見が合わないのはいつものことです。#n似ているのに、合う部分がひとつもないんです。"
"10057050-82-ラナ" = "……私ですか？本業の電算管理が一段落したところです。"
"10057050-83" = "[s] \"ハッキングしたのに電算を任されてるんだ……。\""
"10057050-84-ラナ" = "厳密に言うと、少し違います。"
"10057050-85-ラナ" = "チェリノ会長は私が物を盗んだと思っています。#n報告をちゃんと聞いていなかったのでしょう。"
"10057050-86-ラナ" = "なので、私に盗む物がない電算をさせるよう指示しました。"
"10057050-87" = "[s] \"そう……なんだ。\""
"10057050-88-ラナ" = "そうなんです。"
"10057050-89-ラナ" = "すでに電算局があるにも関わらず、あえて別の電算業務をさせるというのは疑問です。"
"10057050-90-ラナ" = "以前、電算局でアヒルの発注数が少なかったので調整したりしたことはあるのですが……#nその後、発注ミスなどが多かったので、別の電算部署が必要になったのだと推測しています。"
"10057050-91-ラナ" = "まあ、経緯はどうあれ電算の管理を任されているのです。#n……あ、そういえば。#n気になったので、先生が仰っていた「227号特別クラス」について調べてみました。"
"10057050-92-ラナ" = "サーバー室の奥深くに眠っていて、見つけるのに苦労しました。"
"10057050-97-ラナ" = "こちらです。"
"10057050-98" = "[s] \"これは何？マークシート？\""
"10057050-99-ラナ" = "「パンチカード」といって、レッドウィンターの電算管理に使っているものです。"
"10057050-100-ラナ" = "穴を開けてデータを記録するタイプの記録媒体ですね。"
"10057050-101-ラナ" = "容量が非常に小さく、1枚に80文字しか入れられません。"
"10057050-102" = "[s] \"何で未だにそれを使ってるの？\""
"10057050-103-ラナ" = "「とりあえず動くから」です。"
"10057050-104-ラナ" = "詳細は分かりませんが、変えない理由はそのくらいのものでしょう。"
"10057050-105-ラナ" = "レッドウィンターは指導者を除いて、特に変える理由がないものは変えません。#nここの電子技術はそのレベルなんです。"
"10057050-106-ラナ" = "実際に見て、触れられる……信頼性が高いものなので、私好みではありますが。"
"10057050-107-ラナ" = "とにかく。#n227号特別クラスの名簿と管理履歴があると思われるので、読み込んでみます。"
"10057050-108-ラナ" = "パンチカードは読み込ませた並びどおり実行されるから、#nカードの順番に注意して……。"
"10057050-113" = "[ns] \"足元に気をつけて！\""
"10057050-114-ラナ" = "あっ。"
"10057050-119-ラナ" = "……。"
"10057050-120" = "[s3] \"大丈夫？ケガはない？\"\n[s4] \"カードがバラバラになっちゃった……ね。\""
"10057050-123-ラナ" = "……。"
"10057050-124-ラナ" = "大した情報はなかったと思います。#n重要事項ならチェリノ会長が覚えているでしょうし。"
"10057050-125-ラナ" = "……話を戻しますが、あの2人の作業スピードが上がったのは良いことです。"
"10057050-126-ラナ" = "補助をしているだけの私と違って、2人の進捗は戦車の完成時期を左右するので。"
"10057050-127" = "[s] \"ラナは戦車に興味ないの？\""
"10057050-128-ラナ" = "ええ。「興味があるかないか」で言ったら、ないほうだと思います。"
"10057050-129-ラナ" = "戦車はかっこよくて、技術的に興味深くて……#n強くてかっこいいということ以外は大したことありません。"
"10057050-130" = "[s] \"大したことないって言うわりに「かっこいい」が2回も出てきたね……。\""
"10057050-131-ラナ" = "私は183号が恩赦を受けたり、賞をもらったりすることには興味がないんです。"
"10057050-132-ラナ" = "ただ……#n私にとってたった2人しかいない友達の、やりたいことを手伝いたいだけなのです。"
"10057050-133-ラナ" = "友達ができたのは初めてなので、今の気持ちが正しいのかは分かりませんが。"
"10057050-141-アンナ" = "ラナー！残っている材料はある？"
"10057050-145-アンナ" = "あっ、先生もいらっしゃったんですね！"
"10057050-146-エリナ" = "ふぅ……うまく行き過ぎても問題になるなんて……。"
"10057050-147-エリナ" = "あれ？なんでパンチカードがゴミ箱にあるの？"
"10057050-149-ラナ" = "材料は、車庫になければもうない。"
"10057050-151-エリナ" = "うぁ～！せっかく順調なのに～！！"
"10057050-152-アンナ" = "まあ……ないなら仕方ないわね。"
"10057050-153" = "[s] \"どうしたの？\""
"10057050-154-エリナ" = "いつもなら、1個作るのに時間がめっちゃかかってたんだけど……。"
"10057050-155-エリナ" = "急にスピードが上がったから、#nこれまで集めておいた廃品や材料を使い切っちゃったんです。"
"10057050-156-エリナ" = "材料をたくさん溜めておけるほど、ここは広くないし。"
"10057050-157-アンナ" = "簡単に手に入るものでもないから、お金で解決することもできません。"
"10057050-158-エリナ" = "チタン、銅、高純度強化ガラス……どこで手に入れればいいの～？"
"10057050-159" = "[s] \"どうしたらいいかな？\""
"10057050-160-アンナ" = "これまでに作ったものを解体して、#n材料を節約しながら作り直せば完成するかもしれませんが……。"
"10057050-161-アンナ" = "そうなると、予選当日には間に合わないかもしれません。"
"10057050-170-アンナ" = "ラナ、何か良い方法でも思いついたの？"
"10057050-172-ラナ" = "材料はある。あのスローガンを見て。"
"10057050-173-エリナ" = "「レッドウィンターの施設はみんなの公共財産。#n自分の物のように大切にしよう！」ってやつ？あれがどうしたの？"
"10057050-174-ラナ" = "「自分の物」って書いてある。"
"10057050-179-ラナ" = "つまり、「私たちの物」。"
"10057050-180-アンナ" = "レッドウィンターの施設が「私たちの物」？"
"10057050-181-エリナ" = "「みんなの公共財産」……がぁ～？"
"10057050-182-ラナ" = "うん。"
"10057050-184-ラナ" = "学園を襲う。"
