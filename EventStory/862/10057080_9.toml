[translation]
"10057080-1" = "第8話;喜びと心配"
"10057080-3" = "[log]戦車レース予選まで[/log]"
"10057080-5" = "[log]D-1[/log]"
"10057080-27" = "[log]戦車レース予選[/log]"
"10057080-29" = "[log]D-Day[/log]"
"10057080-32-エリナ" = "ついに来てしまった……。"
"10057080-36-エリナ" = "予選当日！！！"
"10057080-40-ラナ" = "パチパチパチ。"
"10057080-41" = "[s] \"パチパチパチ。\""
"10057080-42-エリナ" = "拍手くらい、口で言わずちゃんとやってよ！先生も！"
"10057080-43-ラナ" = "手が凍ってるから嫌だ。"
"10057080-44" = "[s] \"今日はすごく寒くて……。\""
"10057080-45-エリナ" = "まあたしかに。金属も、触ってると痛くなるくらい冷えてるもんね～#n昨夜の作業は大変だった……。"
"10057080-46-エリナ" = "ストーブも朝方には消えちゃったし、風邪ひいちゃいそう……。"
"10057080-47-エリナ" = "とにかく、なんとか予選に間に合ったね！みんな、お疲れ～！"
"10057080-48-エリナ" = "特に、アンナ！お疲れさん。"
"10057080-55-アンナ" = "え？う、うん！あはは……そんな大したことでも……。"
"10057080-56-エリナ" = "じゃあ、今度こそ先生に完璧なものをお披露目しま～す！#n口ドラム、スタート！"
"10057080-61-エリナ" = "ドドドドドドドド！"
"10057080-62-ラナ" = "ドドドドドドドドー。"
"10057080-63" = "[s] \"ドドドドドドドドー！\""
"10057080-67-エリナ" = "ジャジャーン！！"
"10057080-75" = "[ns] \"お！わあ！！え？わあ！！！\""
"10057080-77" = "[ns] \"あれ……？戦車って、こんな形……だったっけ？\""
"10057080-78-エリナ" = "失礼な！！"
"10057080-79-エリナ" = "――とは言ってみたけど。#nううっ、やっぱりそうなるかぁ……。"
"10057080-80-エリナ" = "よくある回転するような砲塔は、部品が足りなくてムリでした。"
"10057080-81-エリナ" = "だから砲を固定することにしたんです！#n最低限の防壁もないけど……一応、戦車です！"
"10057080-85-エリナ" = "で、でも！やれることは全部やったんですよ！？#nリン酸塩フィルムで防錆処理も完璧だし！"
"10057080-86-ラナ" = "ちゃんとレースの規定に則っているので、参加資格については問題ありません。"
"10057080-87-ラナ" = "砲塔がなければ、車体そのものを回せばいいんです。"
"10057080-88-エリナ" = "とにかく、完成はしたんだから万事オッケ～！"
"10057080-89-エリナ" = "名前も決めたんですよ！その名も「子犬号」！"
"10057080-90" = "[s] \"車体に何か……いろいろと付いてるね。\""
"10057080-91-エリナ" = "かっこいいでしょ！廃車置き場で拾ってきたものを付けたんです！"
"10057080-92-エリナ" = "初めてみる部品だから何だろ～って思ったら、#nスクラップしておいた記事に載ってたんですよ！"
"10057080-93-エリナ" = "取り締まられた暴走族の車に付いていたので、#n恐らくスピードアップのための物だと思います！"
"10057080-94-エリナ" = "きっとこれが速さの秘密なんですよ！"
"10057080-95-ラナ" = "見ているだけでもワクワクするので、士気の向上も期待できますね！"
"10057080-96" = "[s] （楽しそうなエリナたちを見守る）"
"10057080-100-エリナ" = "あっ、そうだ！早速テストしてみないと！"
"10057080-101-エリナ" = "戦車の専門家であるアンナさん！テストお願いしま～す！"
"10057080-107-アンナ" = "う、うん……。"
"10057080-111-アンナ" = "まずは外観チェック。車体のボルトとナットの締め具合を確認……。"
"10057080-112-エリナ" = "2、4、6……うん！問題なし！"
"10057080-113-アンナ" = "……次、砲弾積載状態の確認及び照準器のチェック。"
"10057080-117-エリナ" = "確認、異常なし！目盛りが少しずれているのは、会場に着いてから直すね。"
"10057080-122-エリナ" = "ちょっと、緊張しすぎじゃない？うまくいくから、心配ないって！"
"10057080-123-アンナ" = "うん……あはは……。"
"10057080-124-アンナ" = "……油圧と電気系統をチェック。ラナ、お願い。"
"10057080-130-ラナ" = "油圧、正常。電圧は……。"
"10057080-134-ラナ" = "おかしい。定格は12ボルトなのに11.2ボルトって表示されてる。"
"10057080-135-エリナ" = "え！？つまり、どういうこと？"
"10057080-136-ラナ" = "11.6ボルト以下だとエンジンがかからない。"
"10057080-142-エリナ" = "嘘でしょ！？じゃあ、どうするの？"
"10057080-143-ラナ" = "予備のバッテリーに交換すればいい。"
"10057080-149-ラナ" = "バックアップのないシステムはシステムじゃない。だから二重化構成にしてた。"
"10057080-153-ラナ" = "うん。14.3ボルト。過充電だけど問題ない。"
"10057080-154-エリナ" = "び、びっくりしたぁ～、も～"
"10057080-155-ラナ" = "大げさ。"
"10057080-157-アンナ" = "……。"
"10057080-158-エリナ" = "時間に余裕があったら、エンジンあっためるのも兼ねて繁華街に寄ろう！#n私たちもカフェで糖分を補給しないと！えへへ、服とか見ちゃう？"
"10057080-162-アンナ" = "あ、うん。"
"10057080-163-エリナ" = "ついでにみんなに自慢しよーよ！#n廃品で作ったって言ったら、びっくりすると思わない？"
"10057080-164-エリナ" = "「[ruby=にき]仁木[/ruby]アンナ、すごい～」って言われたいでしょ？"
"10057080-165-アンナ" = "うん、そうだね……。"
"10057080-166-エリナ" = "テンション低っ！はいはい！繁華街に行くのは予選が終わってからにしまーす！"
"10057080-167-エリナ" = "じゃあ、チェックを続けよう！次は――"
"10057080-171-エリナ" = "……ねぇ、まだチェックすることあるの～？#n遅れちゃうから早く出発しよーよ！"
"10057080-172-アンナ" = "もう少しだけ見たほうがいいと思う……。"
"10057080-173-エリナ" = "リストは全部チェックしたでしょ～？あとはエンジンをかけるだけじゃん！"
"10057080-174-アンナ" = "でも念のため、初めからもう一度だけ……。"
"10057080-175-エリナ" = "いつもは自信たっぷりのくせに、急にどうしたの？"
"10057080-176-エリナ" = "心配ないって！みんなで力を合わせてできた作品でしょ！もっと自信持と～よ！"
"10057080-177-エリナ" = "もちろん！今回優勝したらアンナとも、#nこの雪しかない山奥ともサヨナラだけどね！やっほーい！"
"10057080-178-エリナ" = "予選通過したら、どこに行こうかな～？#nやっぱりズナーミャカフェ？いや、洋服が先か！"
"10057080-179-アンナ" = "そうじゃなくて、つまり……。"
"10057080-180-エリナ" = "あ、ごめん！忘れてた！"
"10057080-181-エリナ" = "ラナ！エンジンかけて！この[ruby=・]怪[/ruby][ruby=・]物[/ruby]の雄たけびが聞きたい！！"
"10057080-183-ラナ" = "がおがおー。"
"10057080-191-エリナ" = "え？"
"10057080-192-エリナ" = "エンジン、かからないの？もう一度やってみて！"
"10057080-199-エリナ" = "ど、どうしたんだろう？またバッテリーのトラブル？"
"10057080-200-ラナ" = "バッテリーの問題ではなく――"
"10057080-205-ラナ" = "燃料がない。"
"10057080-209-エリナ" = "あちゃ～！リストに「燃料注入」の項目を入れるのを忘れてた～！"
"10057080-210-エリナ" = "アンナ、担当でしょ！早く燃料入れて！"
"10057080-216-アンナ" = "……こんなことになるなら、もっと自信を持てば良かった。"
"10057080-217-エリナ" = "え？何？"
"10057080-218-エリナ" = "時間ないんだよ！燃料はどこ？"
"10057080-226-ラナ" = "……！"
"10057080-231-アンナ" = "あっちにある。"
"10057080-235-アンナ" = "……ストーブに。"
