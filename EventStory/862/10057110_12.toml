[translation]
"10057110-1" = "第11話;ただし全ての摩擦は無視するものとする"
"10057110-2" = "183号車庫"
"10057110-4-ラナ" = "先生。よろしければ運転をしていただけますか？"
"10057110-5-ラナ" = "ギアはニュートラルにしておき、車体が一方に偏らないようにお願いします。"
"10057110-6-ラナ" = "ブレーキは絶対に踏んではいけません。"
"10057110-7" = "[s] \"分かった！\""
"10057110-11-アンナ" = "ラナ、燃料がないのにどうするつもりなの？"
"10057110-12-エリナ" = "残念なのは分かるけど……十分頑張ったし、もう休んでも……。"
"10057110-14-ラナ" = "早く乗って、砲弾を装填して。"
"10057110-15-ラナ" = "この戦車は作用反作用の法則で動くから。"
"10057110-19-アンナ" = "……！"
"10057110-26-アンナ" = "よいしょ！"
"10057110-28-エリナ" = "どういうこと！？アンナもどうして乗ってるの？"
"10057110-29-アンナ" = "引き上げるから、手をつかんで！"
"10057110-30-エリナ" = "う、うわあっ！"
"10057110-34-アンナ" = "砲弾装填！"
"10057110-35-エリナ" = "ちょっと、何なの～？"
"10057110-36-アンナ" = "化学者なのに分からないの？作用反作用の法則！"
"10057110-37-アンナ" = "作用と反作用！"
"10057110-38-エリナ" = "作用と反作用……。"
"10057110-42-エリナ" = "まさか、砲撃の反動で動かすってこと！？"
"10057110-44-ラナ" = "駐退距離、確保。"
"10057110-45-アンナ" = "砲尾、確保！"
"10057110-46-エリナ" = "車庫の中で砲撃したら183号はどうなるの～！"
"10057110-47-アンナ" = "どうせ……。"
"10057110-51-アンナ" = "もうボロボロでしょ！"
"10057110-52-ラナ" = "撃て！"
"10057110-64-エリナ" = "ほんとに壊れちゃった！！！あれでもみんなで過ごした家なのに～！！"
"10057110-66-アンナ" = "よしっ！ちゃんと反動で後進してるわ！履帯もしっかり回ってる！"
"10057110-67-アンナ" = "直属研究所に復帰したら、こういう交通手段も研究してみようかな？"
"10057110-68-ラナ" = "次弾、装填。"
"10057110-69-アンナ" = "了解！"
"10057110-72-エリナ" = "もう一発！？"
"10057110-73-ラナ" = "撃て！"
"10057110-76-アンナ" = "速くなった！？"
"10057110-77-エリナ" = "砲弾もちゃんと飛んで安心した～！#nそれにしても遠くまでいくなあ……。"
"10057110-78-エリナ" = "装薬にジフェニルアミンを添加したのがよかったのかも。#n古い火薬だから不発になるかと思ってた。"
"10057110-81-エリナ" = "でも、あっちの方向って何があったっけ？"
"10057110-84-レッドウィンターの生徒A" = "吹雪が止んで、少し暖かくなったね。"
"10057110-85-レッドウィンターの生徒B" = "それにしても……こうしてみんなを呼び出して、何の話だろ？"
"10057110-88-チェリノ" = "レッドウィンターの諸君！今日は栄えあるゲヘナカップの予選だ！"
"10057110-95-チェリノ" = "これより、諸君の士気を高める銅像の除幕式を行う！"
"10057110-96-チェリノ" = "レッドウィンターがゲヘナカップを制するのだ！"
"10057110-99-レッドウィンターの生徒A" = "私たちの士気と生徒会長の銅像が、どう関係あるの？"
"10057110-100-レッドウィンターの生徒B" = "しっ、しーっ！聞こえちゃったらどうするの！？"
"10057110-103-レッドウィンターの生徒A" = "あれ、山から何か飛んできて――"
"10057110-109-チェリノ" = "お、おいらの銅像が爆発した！？"
"10057110-113-レッドウィンターの生徒A" = "革命……なの？"
"10057110-114-レッドウィンターの生徒B" = "今？ここで？"
"10057110-117-工務部の部員" = "革命だ！！"
"10057110-118-チェリノ" = "反乱分子め！この輝かしい場で革命だと！！"
"10057110-119-チェリノ" = "親衛隊！！親衛隊！！！"
"10057110-122-マリナ" = "？？？"
"10057110-123-チェリノ" = "マリナ、まさかお前の仕業なのか？窓ガラスと銅像の件で罰を与えたからか？"
"10057110-126-マリナ" = "もう、知らない……。"
"10057110-129-マリナ" = "革命の敵、連河チェリノの糾弾を開始する！！"
"10057110-130-チェリノ" = "やっぱりお前か！！"
"10057110-132-エリナ" = "何だろ？学園の方騒がしくない……？"
"10057110-133-アンナ" = "ラナ、このまま続けて撃つの？砲弾も残り少ないんだけど……。"
"10057110-134-アンナ" = "これで山の下の競技場まで行くのなら、あと数百発は必要よ。"
"10057110-138-ラナ" = "ううん。あと一発でいい。"
"10057110-140-エリナ" = "一発？"
"10057110-142-ラナ" = "うん。あと一発で、位置エネルギーが十分な斜面まで行く。"
"10057110-144-エリナ" = "さっぱり理解できないんだけど、どういうこと？"
"10057110-147-アンナ" = "あ、あれ！！前！！ううん！！後ろ！！後ろ？？後ろにー！！！"
"10057110-148-エリナ" = "アンナも急にどうしたの……。"
"10057110-151-エリナ" = "く！！！下ってる！！！後ろに！！違う、前に！！！"
"10057110-152-アンナ" = "坂！！激坂！！！後ろに！！ううん、前かな？やっぱ、後ろに！！！"
"10057110-154-ラナ" = "うん。"
"10057110-155-ラナ" = "行こう。"
"10057110-159-一同" = "うわあああああっ！！！"
"10057110-162-アンナ&エリナ" = "きゃあああああっ！！！"
"10057110-163-ラナ" = "これ、いけるんだ。"
"10057110-164-アンナ" = "ちょっとぉ！！失敗する可能性があったってこと！？"
"10057110-165-ラナ" = "うん。97％ぐらい。"
"10057110-166-エリナ" = "実行する確率じゃないってぇ！？"
"10057110-167-ラナ" = "その代わり、成功率は3％もある。"
"10057110-168-アンナ&エリナ" = "「も」じゃなくて「しか」！！！"
"10057110-171-アンナ&エリナ" = "きゃああああああああっ！！！"
"10057110-173" = "レッドウィンター・戦車競技場"
"10057110-175-ゲヘナの監督官" = "うーむ……おかしいですね。まだ誰も来ないなんて。"
"10057110-176-ゲヘナの監督官" = "事務局側から連絡はありませんでしたか？"
"10057110-177-レッドウィンターの監督官" = "先ほどこちらから連絡してみたんですが、応答がありませんでした。#n何があったのやら……。"
"10057110-181-チアキ" = "うぅ……。寒すぎて予選が中止になったんじゃないですか？"
"10057110-182-レッドウィンターの監督官" = "え？これくらいなら暖かいほうですが……。"
"10057110-185-ゲヘナの監督官" = "ん？あれは何でしょう？"
"10057110-186-レッドウィンターの監督官" = "あれは……雪崩かな？"
"10057110-190-チアキ" = "どれどれ……。"
"10057110-198-？？？" = "きゃあああああっ！！！"
"10057110-201-チアキ" = "え～っ……？"
"10057110-202-ゲヘナの監督官" = "チアキ書記、あれは何でしょうか？"
"10057110-203-チアキ" = "うーん、これはなんというか――"
"10057110-204-チアキ" = "遊園地の絶叫アトラクション……？"
"10057110-207-ゲヘナの監督官" = "こ、こっちに来るー！！！"
"10057110-214-エリナ" = "う、うぁ……。"
"10057110-215-アンナ" = "天国も寒くて雪だらけ……どこにも楽園なんてないのね……。"
"10057110-216-エリナ" = "いや、ここは地獄でしょ。事務局いるし……。"
"10057110-218-ゲヘナの監督官" = "あの……失礼ですが、どのような用件で……。"
"10057110-221-チアキ" = "……あれ？先生じゃないですか！"
"10057110-222-チアキ" = "こんなところで会えるなんて、思ってもみませんでした！"
"10057110-223-チアキ" = "でも、ど～して戦車の操縦席にいるんです？"
"10057110-224" = "[s] \"チ……チア、キ……？こ、こんにちは……。\""
"10057110-228-レッドウィンターの監督官" = "これ、戦車……？いや、装甲車か……？"
"10057110-232-エリナ" = "失礼……な……。"
"10057110-233-アンナ" = "これ……参加申込書……ううっ、吐き気が……。"
"10057110-236-チアキ" = "あはは……めっちゃ強く握ってたみたいですね。文字が……。"
"10057110-237-チアキ" = "チーム名は何ですか？"
"10057110-241-アンナ" = "「183号特別クラス」です！"
"10057110-242-エリナ" = "アンナ、エリナ、ラナ。それと顧問にシャーレの先生！"
"10057110-243-ラナ" = "戦車も準備してきました。"
"10057110-246-183号特別クラス" = "参加を申し込みます！！"
