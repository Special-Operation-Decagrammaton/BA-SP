[translation]
"10057100-1" = "第10話;友達を捜しに"
"10057100-6-ラナ" = "先生。手、離さないでください。"
"10057100-7" = "[s] \"ちゃんと握ってるよ。アンナは大丈夫？\""
"10057100-10-アンナ" = "ええ。ちゃんと握っています。"
"10057100-11-アンナ" = "足元も見えないほど、吹雪が……。#n先生、ラナと一緒に183号に戻ってください。エリナは私が連れて帰ります。"
"10057100-12-ラナ" = "断固、拒否します！"
"10057100-15-アンナ" = "……ラナが「拒否する」だなんて、初めて聞いた。"
"10057100-16-ラナ" = "友達はいつも一緒。だから、私も行く。"
"10057100-17" = "[s] \"ラナ、100点！\""
"10057100-18-ラナ" = "ふふっ、初めて100点をもらいました。"
"10057100-19-アンナ" = "そ、そうね。あはは……。"
"10057100-20-アンナ" = "だけど、今エリナがどの方向にいるのかも分からないし……どうしたら……。"
"10057100-24-ラナ" = "アンナ？"
"10057100-25-アンナ" = "しーっ。ちょっと聞いて。"
"10057100-28-アンナ" = "……。"
"10057100-30-？？？" = "（げほっ……）"
"10057100-31-アンナ" = "……誰かが咳してる。"
"10057100-33-？？？" = "（げほっ、ごほっ……）"
"10057100-34-アンナ" = "先生、こっちです！先に行きますね！！"
"10057100-39-ラナ" = "アンナ、一緒に行こう！"
"10057100-42-アンナ" = "エリナー！！"
"10057100-43-アンナ" = "返事して！！お願い！！！"
"10057100-44-アンナ" = "うわっ！！"
"10057100-48-アンナ" = "あいたたた、石が……。"
"10057100-51-アンナ" = "エリナ！！！"
"10057100-52-エリナ" = "……。"
"10057100-54-アンナ" = "エリナ……。"
"10057100-55-アンナ" = "……燃料は、わざと使い切ったの。"
"10057100-56-アンナ" = "どうせ完成なんてするはずないって決めつけてた。#nだって……私は大失敗して、ここに来たんだから。"
"10057100-57-アンナ" = "最初は……失敗するのは運が悪いからだと思ってた。"
"10057100-58-アンナ" = "それなのに、ここに来ても失敗ばかり……。"
"10057100-59-アンナ" = "いつしか、私にとって失敗は「偶然」から「必然」になった。"
"10057100-60-アンナ" = "自信がある、何でもできるって大口叩いてたけど……自分が一番よく分かってた。"
"10057100-61-アンナ" = "今の私は「何をしても失敗する」って。"
"10057100-63-ラナ" = "……。"
"10057100-65-アンナ" = "だから無駄な期待はせず、ただ毎日温かく過ごすほうがいいと思ったの。"
"10057100-66-アンナ" = "燃料を節約したって、どうせ戦車が動くはずないんだから。"
"10057100-69-エリナ" = "……。"
"10057100-71-アンナ" = "みんなの目の前で壊れる戦車を見るのが怖かった。"
"10057100-72-アンナ" = "過去のことだから大丈夫って考えるようにしてたけど、ふと思い出すと体が震えるの。"
"10057100-73-アンナ" = "戦車が完成したら……今度はレッドウィンターの広場じゃなくて、#nキヴォトス全体が見ている前で恥をかくことになる……。"
"10057100-74-アンナ" = "また戦車を作ることが怖かった。#nエリナがポスターを見て「戦車を作ろう」なんて……。"
"10057100-75-アンナ" = "あんなこと言わなければ……。"
"10057100-78-アンナ" = "何も知らないくせに！"
"10057100-79-アンナ" = "何も知らないくせに……毎日喧嘩しても、私を信じてくれて。"
"10057100-80-アンナ" = "……そんなの、嬉しいに決まってるじゃない。#n科学者なら……いえ、誰だってそう。"
"10057100-81-アンナ" = "絶望してたこと全部、何でもないように思えてきて……。"
"10057100-82-アンナ" = "辛かった記憶は、消えないのに……いつの間にか、逃げることすらできなくなってた！"
"10057100-84-ラナ" = "先生……。"
"10057100-85" = "[s1] \"大丈夫だよ、ラナ。\"\n[s2] \"もう少し見守ろう。\""
"10057100-89-エリナ" = "……。"
"10057100-91-アンナ" = "意見が合わなくて作業が進まなかった時は、内心ほっとしてた。"
"10057100-92-アンナ" = "「今回は残念だったけど、次頑張ろう」って言って、はぐらかせるから。"
"10057100-93-アンナ" = "新しい挑戦なんてしないで、昔の自慢話だけで過ごしたかったの。"
"10057100-94-アンナ" = "……そうしたら先生が来た。"
"10057100-95-アンナ" = "……本当に奇跡が起きるなんて、思ってなかった。"
"10057100-96-ラナ" = "……。"
"10057100-97-アンナ" = "ボルトが1つはまるたび……溶接がきれいにくっつくたび……私は怖かった。"
"10057100-98-アンナ" = "現実が……戦車が壊れて笑いものになる未来が、確実に近づいているって――"
"10057100-99-アンナ" = "不安だった。自分でも呆れちゃうくらいに……本当に、最悪。"
"10057100-100-アンナ" = "……もちろん、みんなや先生のせいじゃない。"
"10057100-101-アンナ" = "大きな失敗を怖がって、小さなミスをしてしまった……仁木アンナが悪いの。"
"10057100-102-アンナ" = "ねえ、エリナ……。"
"10057100-107-アンナ" = "……逃げて、ごめん。"
"10057100-108-アンナ" = "正直に怖いって言えなくて、ごめん。"
"10057100-109-アンナ" = "それで全てを台無しにして、ごめん。"
"10057100-110-アンナ" = "全部……全部、ごめん……。"
"10057100-112-エリナ" = "……。"
"10057100-113-ラナ" = "あの、エリナ……。"
"10057100-118-エリナ" = "びえええーん！！！"
"10057100-119-アンナ" = "え、ええっ！？"
"10057100-123-エリナ" = "バカッ！バカぁ！！バカぁ～！！！"
"10057100-124-エリナ" = "アンナって、ほんっとイラつく！げほっ、初めて会ったときからずっとサイアク～！"
"10057100-125-エリナ" = "何も知らないって！？ごほっ！"
"10057100-126-エリナ" = "失敗したのは、自分だけだって思ってるの！？"
"10057100-127-エリナ" = "失敗したら「運が悪かった」ってテキトーに流せばいいじゃん！#n威張るなら、最後まで威張り通してよ！なんで自信を持たないの！？"
"10057100-128-エリナ" = "アンナが誇るべきなのは自分自身でしょ！？ちっぽけな勲章なんてどうでもいい！！"
"10057100-129-エリナ" = "そこが意味分かんなくて、はじめっからイヤだった！#n直さないんなら、これからもず～っとイヤ！"
"10057100-130-エリナ" = "アンナは……隙あらば自慢する学級委員長で、友達でしょ？#n否定したって、友達なのは変わらないからね。"
"10057100-131-エリナ" = "学級委員長だから堂々として欲しいし、友達だから元気出して欲しいの！"
"10057100-135-アンナ" = "そう、だったんだ……なのに、私は……。"
"10057100-139-エリナ" = "戦車を作ろうって誘った時……「やろう」って言ってくれて、すっごく嬉しかった。"
"10057100-140-エリナ" = "一緒にかっこよく成功して、過去の失敗に「ざまあみろ！」って言いたかったんだよ！"
"10057100-141-エリナ" = "アンナもおんなじだと思ってた！なのに……それなのに……！！ズルズル。"
"10057100-142-アンナ" = "うっ、ううっ……。"
"10057100-143-エリナ" = "ごほっ……。私はアンナの一番近くにいたのに、全然分からなかった……。"
"10057100-144-エリナ" = "戦車作りを重荷に感じてたなんて、思いもしなかった……。#n煽れば、ムキになってやる気が出るって……。"
"10057100-145-エリナ" = "私が……そういう人間だから……。"
"10057100-146-エリナ" = "わ、私こそ……ごめん、ごめんねえええ……。"
"10057100-148-アンナ&エリナ" = "うわあああああん！！！"
"10057100-150-アンナ" = "ごめんねえええ！！"
"10057100-151-エリナ" = "私もごめえええん！！"
"10057100-152-アンナ" = "エリナー……。"
"10057100-153-エリナ" = "うわあああん……こ、来ないで……へっ、へっ……へえっ――"
"10057100-155-エリナ" = "ぶえっくしょん！！！"
"10057100-157-アンナ" = "もう！！また目に入ったじゃないの！"
"10057100-158-エリナ" = "くしゃみが出るから来ないでって言ったのにぃ～！うえ～ん！"
"10057100-165" = "[ns3] \"ちょうど吹雪も収まったね……。\"\n[ns4] \"みんな、大丈夫？\""
"10057100-168-アンナ" = "ええ、先生。すみません。遠くまで来ていただいたのに、ご迷惑ばかり……。"
"10057100-169-アンナ" = "ラナもごめんね。みんなで頑張ったのに、私が全部台無しにしちゃった。"
"10057100-170-エリナ" = "気にしなくていいよ。また出ればいいんだし。"
"10057100-171-エリナ" = "これからは悩みがあったら隠さず話すこと！そして、次は絶対みんなで出場するよ！"
"10057100-172-アンナ" = "うわ～ん！第一級髭勲章をかけて誓います！"
"10057100-173-エリナ" = "また勲章、勲章って！うえ～ん！"
"10057100-177-ラナ" = "くしゃみ……なみだ……相互作用。"
"10057100-181-アンナ" = "ラナ？"
"10057100-182-エリナ" = "頑張ってくれたのにごめんね。戻って休もう。"
"10057100-184-ラナ" = "……。"
"10057100-185-ラナ" = "休まないよ？"
"10057100-189-アンナ" = "ラナ、もう出場はできないの。燃料が一滴も残ってないから……。"
"10057100-190-エリナ" = "もしあっても、山道を戻ってまた下ると時間がかかるし。"
"10057100-191-エリナ" = "今からじゃ間に合わないって。"
"10057100-193-ラナ" = "……3、5。3、1……。"
"10057100-194-ラナ" = "子犬号は何トン？燃料分は抜いて。"
"10057100-196-アンナ" = "えっと、今の状態だと……10.1トンぐらい。"
"10057100-198-ラナ" = "初速と発射時の運動エネルギーは？"
"10057100-200-エリナ" = "初速は秒速680メートル、砲弾は6.1キロだから約1.53メガジュール。"
"10057100-201-エリナ" = "それがどうしたの？その枝はなに？"
"10057100-203-ラナ" = "バッテリー不要の電卓。"
"10057100-206-ラナ" = "……ふむ。やっぱり大丈夫。"
"10057100-210-ラナ" = "全員、乗車！"
