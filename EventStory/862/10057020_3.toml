[translation]
"10057020-1" = "第2話;いつものこと"
"10057020-4-アンナ" = "だったら、装甲の重さはどうするのよ？#nある程度狭くても我慢すべきよ。"
"10057020-5-エリナ" = "私はみんなの体格を計算して言ってんの～！"
"10057020-10-ラナ" = "2回目の「意見交換」です。「説得」まであと1回です。"
"10057020-12-アンナ" = "死角を容積に含めるから余裕があるように見えるけど……#n計算はちゃんとしているの？"
"10057020-13-アンナ" = "それに、鋳造砲塔は圧延処理ができないでしょう！？"
"10057020-14-エリナ" = "うちの設備じゃ圧延処理自体できないでしょうが！"
"10057020-15-エリナ" = "学級委員長だの、主任だのをやる前に……#n「考えて話す協会」の会長をやった方がいいんじゃないの？"
"10057020-19-ラナ" = "結局、3回目までに結論は出ませんでしたね。"
"10057020-20-ラナ" = "先生。「説得」に備えて、少し離れることをオススメします。"
"10057020-21" = "[s] \"え？わ、分かった……。\""
"10057020-26-アンナ" = "ふぅ……こうなったら仕方がないわね。"
"10057020-27-エリナ" = "はぁ……それはこっちのセリフ～"
"10057020-41-アンナ&エリナ" = "おりゃあーっ！！！！！"
"10057020-45" = "[ns] \"？？？？？？？？？？？\""
"10057020-48-ラナ" = "便宜上「RWWE」と呼ぶ討論です。"
"10057020-49-ラナ" = "「Red Winter Wrestling Engineers」の略ですが……。"
"10057020-54-アンナ" = "「ゲヘナ・スープレックス」！！"
"10057020-55-エリナ" = "ぐはっ！！"
"10057020-62-ラナ" = "2人とも同じくらいのレベルで議論するので平行線になりがちで……。"
"10057020-63-ラナ" = "そのうちにどんどんヒートアップし――"
"10057020-67-エリナ" = "せいっ！「足4の字固め」！！"
"10057020-68-アンナ" = "ぐぎぎ……！相変わらず、こっちの説得もしょぼいのね！"
"10057020-69-ラナ" = "……。"
"10057020-70-ラナ" = "……最終的に、レスリング勝負になるんです。#n2人とも言っていることは正しいので力によって決着をつけるしかなくて。"
"10057020-75-アンナ" = "はあっ！さっさと納得しなさい！！"
"10057020-76-エリナ" = "そっちこそ！勲章ひっぺがされても知らないかんね！？"
"10057020-82" = "[ns] \"危なくなる前に止めないと。\""
"10057020-83-ラナ" = "大丈夫です、先生。"
"10057020-84-ラナ" = "2人とも普段研究ばかりの運動不足ですから、威嚇しあうレッサーパンダ程度の力しかありません。"
"10057020-85-ラナ" = "レッサーパンダが喧嘩したところで……。"
"10057020-86" = "[s] \"そう……なんだ。\""
"10057020-87-アンナ" = "傾斜装甲！！"
"10057020-88-エリナ" = "鋳造装甲！！"
"10057020-92-ラナ" = "はい、そこまで。"
"10057020-96-アンナ" = "はあっ……はあっ……ラナ、どうだった？"
"10057020-97-エリナ" = "私のほうが「説得力」あったでしょ？"
"10057020-102-ラナ" = "今回は、アンナの勝ち。"
"10057020-107-アンナ" = "ほら！やっぱり！"
"10057020-109-ラナ" = "エリナは今回、ポジショニングが上手くいってなかった。"
"10057020-111-エリナ" = "ぐぬぬーっ！悔しい～っ！"
"10057020-112-アンナ" = "連邦科学アカデミー会員に相応しい知的な勝利ね！！"
"10057020-117-ラナ" = "ここまでの結果です。"
"10057020-118-ラナ" = "[ruby=にき]仁木[/ruby]アンナが235勝、[ruby=にき]二木[/ruby]エリナが234勝。#n引き分け13。"
"10057020-119" = "[s] \"2人とも「ニキ」さんなの？\""
"10057020-124-アンナ&エリナ" = "姉妹ではありませんからね！！"
"10057020-125-アンナ" = "よりによって、どうして同じ「ニキ」なのよ！？もうたくさん！"
"10057020-126-エリナ" = "まーったく！ぜーんぜん！似てないのに！"
"10057020-128" = "[ns1] （姉妹だなんて誰も言ってないけど……）\n[ns2] \"ラナが言っていた、止めてほしい争いって……。\""
"10057020-131-ラナ" = "はい。そうです、先生。"
"10057020-132-ラナ" = "この2人を、どうにかしてください。"
