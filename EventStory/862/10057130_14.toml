[translation]
"10057130-1" = "後日談その1;ゲヘナに行くと"
"10057130-2" = "ゲヘナカップ競技場"
"10057130-6-ラナ" = "到着。"
"10057130-12-エリナ" = "腰、痛～！椅子のクッション、もっと柔らかくしとけば良かった！"
"10057130-13-アンナ" = "見て、戦車がいっぱいある！私、ちょっと行ってくるわね！！"
"10057130-16-エリナ" = "待って、一緒に行こー！！"
"10057130-21-マコト" = "キキキッ……。この得体のしれない車は何だ？"
"10057130-22-マコト" = "レッドウィンターの奴らだな。キキッ……ゲヘナカップによくぞ来て――"
"10057130-26-ラナ" = "駐車係さんですね。よろしくお願いします。"
"10057130-30-マコト" = "？？？"
"10057130-34-アンナ" = "おおー……！"
"10057130-45-アンナ" = "強敵だらけの予感がするわね……！"
"10057130-46-エリナ" = "どの戦車もかっこいいねぇ……。"
"10057130-47-アンナ" = "子犬号だって負けてないわ！通行料も割引してもらったんだから！"
"10057130-48-エリナ" = "それはサイズが小さいからでしょ……。"
"10057130-51-アンナ" = "ねえ！あそこ！見にいくわよ！"
"10057130-54-エリナ" = "速っ！ちょっと待ってよー！！"
"10057130-58-アンナ" = "垂直装甲なのに、防御力が高そう……。"
"10057130-61-アンナ" = "……砲は88ミリ。見事な戦車ね。"
"10057130-62-エリナ" = "すご～い。めっちゃ重そうだけど、ちゃんと動くのかな？"
"10057130-63-アンナ" = "一緒に写真でも撮るのはどう？ "
"10057130-64-エリナ" = "う～ん……でも、持ち主が出てきたらマズイからな～"
"10057130-69-イロハ" = "何ですか。あなた方は。"
"10057130-70-アンナ" = "うわあっ！！本当に出てきた！！"
"10057130-71-エリナ" = "そりゃいるでしょ！？"
"10057130-72-イロハ" = "まるで幽霊でも見たような顔ですね……。"
"10057130-73-イロハ" = "危ないので戦車から離れていてください。"
"10057130-74-アンナ" = "は、はいっ！すみません！！"
"10057130-75-エリナ" = "もぉ～！めっちゃ恥ずかしいんだけど！"
"10057130-81-ラナ" = "私たちの戦車、別のところに止めたほうがいいかも。"
"10057130-82-ラナ" = "変なところに駐車されてる。何回か車体を擦ってたし。"
"10057130-84-エリナ" = "操縦席を戦闘室に移したのがマズかったかなー？"
"10057130-85-アンナ" = "それは仕方ないでしょ。#nそうだラナ、エンジンが大きくなったから……操縦席、狭くて暑かったでしょ？"
"10057130-87-ラナ" = "ううん。ちょうど良かったよ。暖かくて、よく眠れた。"
"10057130-88-エリナ" = "それ、運転の時に一番ダメなやつじゃない！？"
"10057130-90-イロハ" = "ふむ……。"
"10057130-97-イロハ" = "奇抜な発想の戦車……。"
"10057130-98-イロハ" = "あなた方、面白いですね。"
"10057130-99-クロノスの記者生徒" = "イロハ選手！本大会の絶対王者として、コメントをお願いします！"
"10057130-100-イロハ" = "はあ……これだから外に出たくなかったんです。"
"10057130-101-イロハ" = "ここは人が多いので、あちらに移動しましょう。"
"10057130-105-エリナ" = "え？あの人、絶対王者だったの？"
"10057130-106-エリナ" = "じっとこっちを見てくるから、何かと思ってたけど……。"
"10057130-107-エリナ" = "あんな立派な戦車に比べたら、こっちのはヘンテコだと思うよね～"
"10057130-110-アンナ" = "せ……。"
"10057130-111-エリナ" = "あっ、怒らないで。バカにしてる感じはしなかったし――"
"10057130-116-アンナ" = "戦車って言ってくれた！！"
"10057130-117-アンナ" = "ほら！やっぱり誰がどう見ても戦車よ！！あの人、見る目あるわね！！"
"10057130-118-アンナ" = "私って、ほんとに天才！"
"10057130-119-エリナ" = "あ、あはは……。アンナが嬉しそうで何よりだよ……。"
