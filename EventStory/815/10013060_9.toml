[translation]
"10013060-1" = "第6話;玄武の使者たち（１）"
"10013060-2-ウミカ" = "ここですね！今ネットでも話題の#n「全てに代価を要求する玄武の使者たち」がいるリゾートというのは！"
"10013060-3" = "[s] \"かなり賑やかなところだね。\""
"10013060-4-ミモリ" = "そうですね。しかも人が多いだけじゃなく……"
"10013060-5-イズナ" = "くんくん――むむっ、何やらすごくおいしそうな匂いがいっぱいします！"
"10013060-6-チセ" = "……先生、私のお腹、鳴ってる～。"
"10013060-7" = "[s] \"それじゃあ、何か買って食べようか。\""
"10013060-8-イズナ" = "はい！イズナ、賛成です！"
"10013060-9-ミモリ" = "花より団子、という言葉もありますからね。"
"10013060-10-シズコ" = "ところで……一見平和そうに見えるけど、本当にここが「リゾート狩り」として……"
"10013060-11-シズコ" = "悪名高い場所であってるの？"
"10013060-12-シズコ" = "その件についてはネットで調べてみたんですけどー。"
"10013060-13-ウミカ" = "どうやらこのリゾートの管理全般は、あの有名な「玄武商会」が受け持っているみたいなんです。"
"10013060-14" = "[s] \"玄武商会って山海経の？\""
"10013060-15-シズコ" = "身バレ待ったなしの名前じゃない！"
"10013060-16-ウミカ" = "でも不思議なんですよね。"
"10013060-17-ウミカ" = "口コミを見ると、サービスに関して炎上しているみたいで……"
"10013060-18-シズコ" = "それは妙な話ね。玄武商会って料理に厳しいことで有名じゃない。#nなら、サービスが悪評を受けるとは思えないんだけど……"
"10013060-19-シズコ" = "詳しいことは、直接確認してみるしかなさそうですね。"
"10013060-20-チセ" = "ん～？あっちで騒ぎが起きてるよ。"
"10013060-21-チセ" = "あれは……お客さんと従業員の方、でしょうか？"
"10013060-22-かわいそうな客A" = "ひ、ひどいです！ただ椅子に座っただけなのに料金を請求するだなんて！"
"10013060-23-かわいそうな客A" = "ああ？何がひどいってんだ！使うなら利用料をもらうのがトーゼンだろ！"
"10013060-24-かわいそうな客A" = "それと椅子だけじゃないからな！箸に触れた料金と、グラスに触れた料金。"
"10013060-25-玄武商会のメンバーA（？）" = "あっ、今テーブルにも触ったな！それも請求させてもらうぞ！"
"10013060-26-かわいそうな客A" = "あ、あんまりだぁ～～！！"
"10013060-27-玄武商会のメンバーA（？）" = "ははは！私たちは玄武商会だぞ？#nなら、高級なサービスをしている分の対価はしっかり払ってもらわないとな！"
"10013060-28-玄武商会のメンバーA（？）" = "そ～れ～が～！正当な費用請求なわけないでしょぉおお！！！"
"10013060-29" = "[s] \"あっ、シズコ！\""
"10013060-30-かわいそうな客A" = "な、何だお前は！？営業妨害だぞ！"
"10013060-31-シズコ" = "サービスというのは、提供する側の技術代や土地代――様々な要因で価格が決まっているもの……どのような値をつけるのかも、提供側の裁量だと分かっているわ。"
"10013060-32-玄武商会のメンバーA（？）" = "特にこういったリゾート施設みたいな非日常なところだと……財布のヒモが緩んじゃうのも仕方ないし。"
"10013060-33-シズコ" = "それを狙ってちょ～っと高い値段でサービスを提供するのも、需要と供給の関係から生じる自然なことだってのは重々理解してるわ！"
"10013060-34-シズコ" = "でもねぇ、それにも限度ってものがあるでしょ！"
"10013060-35-シズコ" = "椅子に座った料金？箸に、グラスに、テーブルに触った料金？#n意味分かんないわよそれ！"
"10013060-36-シズコ" = "そうです！まったく、商売を何だと思ってるんですか！#nぼったくりはアウトですよ！"
"10013060-37-ウミカ" = "「全てに対価を要求する玄武の使者たち」ってどんな意味なのか気になってたけど……"
"10013060-38-玄武商会のメンバーA（？）" = "文字通りすべてのものに費用を請求する悪徳リゾートだったってわけね！"
"10013060-39-シズコ" = "あの玄武商会がどうしてこんなことを……！"
"10013060-40" = "[s] \"いや、あの子たちは黒亀組だよ。\""
"10013060-41-シズコ" = "えっ？"
"10013060-42-ウミカ" = "ということは……玄武商会では、ない？"
"10013060-43-かわいそうな客A" = "ええ！？そうだったんですかぁ！？"
"10013060-44-玄武商会のメンバーA（？）" = "くそっ、バレた！"
"10013060-45-玄武商会のメンバーA（？）" = "ええい、こうなったら応援だ！応援を呼べ！"
"10013060-46-シズコ" = "玄武商会じゃなくて黒亀組って……何がどうなってるんですか？"
"10013060-47" = "[s] \"確か黒亀組は瓦解したはずなんだけどね……。\""
"10013060-48-黒亀組の組員A" = "一体何事だ？突然呼び出しおって……"
"10013060-49-？？？" = "些細なトラブルならお前たちだけでも解決できるだろうに……"
"10013060-50-シズコ" = "あっ。"
"10013060-51-ミモリ" = "あら。"
"10013060-52" = "[s] \"あっ。\""
"10013060-53-ニャン天丸" = "…………あ。"
"10013060-54-イズナ" = "にゃ、にゃにゃにゃ、ニャン天丸！？"
"10013060-55-ニャン天丸" = "ま、待て！なぜ貴様らがここに……！？"
"10013060-56-ニャン天丸" = "……いや、よく考えてみたら然程おかしなことでもないか。"
"10013060-57-ニャン天丸" = "儂が手にしているこの契約書に書いてあった「百鬼夜行お祭り運営委員会」という名前を目にした時点で、"
"10013060-58-ニャン天丸" = "この事態も考えなくはなかった。"
"10013060-59" = "[s] \"ここで何を？\""
"10013060-60-ニャン天丸" = "ふんっ！何を、だと？見ての通り商売をしている。"
"10013060-61-ニャン天丸" = "別にサービスを押し売りしているわけでもないし、商売に必要な「リゾート使用権」もこの通りちゃんと持っている。やましい点など一つもないが？"
"10013060-62" = "[s] \"いやいや、玄武商会を騙っていたでしょ。\""
"10013060-63-ニャン天丸" = "コホン！それはあくまで事業の一環として儂の手腕を振るっていただけじゃ！"
"10013060-64-ニャン天丸" = "滅びかけた組織を再興し、新たな事業を推し進めているに過ぎん！#nそうじゃろう？"
"10013060-65-黒亀組の組員たち" = "はいっ！その通りです！"
"10013060-66-イズナ" = "そうやって、今度はどんな悪巧みをするつもりですか！"
"10013060-67-ニャン天丸" = "悪巧みとは失礼な。別に、ただ良い機会だと思っただけだ。"
"10013060-68-ニャン天丸" = "この「リゾート使用権」どう見ても何者かが仕掛けた罠だろう？#nそんなものに見事引っかかるとは、実に情けないな。お祭り運営委員会。"
"10013060-69-シズコ" = "！！"
"10013060-70-ニャン天丸" = "だが見ろ。そのおかげで、またこうして組織の人員を集め、リゾート地を手に入れることができた！再起のための土台を得られたことに感謝するべきかな？"
"10013060-71-ニャン天丸" = "全て知っているのなら話は早いですね！その契約書、今すぐ返してください！"
"10013060-72-ニャン天丸" = "ふんっ。返せと言われて、はいどうぞ、と渡すバカがいるか！"
"10013060-73-ウミカ" = "そもそも、この状況を招いたのは貴様のミスだろう。#nなあ、[ruby=かわわ]河和[/ruby]シズコよ！"
"10013060-74-シズコ" = "そ、それは……"
"10013060-75-シズコ" = "どうせ金に目がくらんで、身の丈に合わない欲でもかいたんだろう？"
"10013060-76-シズコ" = "考えなしに名義を貸した挙げ句がこのザマとは……がっかりだ。"
"10013060-77-シズコ" = "ち、違います！社長には考えが――"
"10013060-78" = "[s] \"シズコはそんな単純な考えで動くような子じゃない。\""
"10013060-79-ウミカ" = "……先生？"
"10013060-80-ニャン天丸" = "口先だけなら何とでも言える！だが、忘れるなよ。#n貴様らは、ここに足を踏み入れた時点で既に終わりだということをな！"
"10013060-81-ニャン天丸" = "契約書を持った者は皆――「リゾート狩り」の対象だ！"
"10013060-82-ニャテ・マサムニェ" = "故に、我々の手で貴様らの全てを奪ってくれるわ！"
"10013060-83-ミモリ" = "皆さん！気をつけてください！"
"10013060-84-イズナ" = "主殿！イズナも一緒に戦います！"
"10013060-85-チセ" = "よ～し、燃やすね～。"
