[translation]
"10013020-1" = "第2話;まずは状況を整理しよう"
"10013020-2" = "（みんなが準備のためにしばらく席を外していると――）"
"10013020-3-ニヤ" = "こんな状況で意地を張るなんて……わざわざそんな非効率的なやり方をする必要もないでしょうに。"
"10013020-4-ニヤ" = "それにミモリちゃんとチセまで協力するとは……いやはや、衝撃でしたねぇ～。"
"10013020-5-ニヤ" = "先生はその辺り、ちゃんと理解されてます？"
"10013020-6" = "[s] \"まあ、正直「これが正解」とは断言できないけど。\""
"10013020-7" = "[ns] \"でもシズコが決めたことだから、応援してあげたいかな。\""
"10013020-8-ニヤ" = "……なるほど。つまり先生も否定はしてない、と？"
"10013020-9-ニヤ" = "にゃはは～。はいはい、わかりましたよっと。#n退屈な話はここまでにしましょう。"
"10013020-10-ニヤ" = "私の助言が無意味なら、ダラダラ喋っても仕方がありませんし。#nそれでは、これで――"
"10013020-11" = "[s] \"うん。頼んだよ、ニヤ。\""
"10013020-12-ニヤ" = "ん～？先生が何をおっしゃっているのか、さっぱり分かりませんねぇ～？#nにゃはは♪"
"10013020-13-シズコ" = "あ、先生！いらしてたんですね。"
"10013020-14" = "[s] \"シズコ！？その格好は……。\""
"10013020-15-シズコ" = "ああ、これですか？"
"10013020-16-シズコ" = "海での激しい戦闘が予想されますからね！#n水に濡れても大丈夫な格好をと思いまして。"
"10013020-17-シズコ" = "その結果……"
"10013020-18-シズコ" = "こうして水着に着替えたわけです！"
"10013020-19-シズコ" = "どうでしょう？この[ruby=かわわ]河和[/ruby]シズコが考えた備えあれば憂いなしの戦略！そして全天候を完璧に網羅したプロフェッショナルな姿！"
"10013020-20" = "[s] \"あー、うん……。\""
"10013020-21-シズコ" = "ふふふっ♪"
"10013020-22-シズコ" = "……ふぅ。"
"10013020-23-シズコ" = "そ、それで、ですね。えっと、そういうわけなんですけど――"
"10013020-24-シズコ" = "その……もし、よろしければ、先生から見た……その……"
"10013020-25-シズコ" = "か……か、感想とか――"
"10013020-26-シズコ" = "あーーーーーるじどのぉぉぉお！！"
"10013020-27" = "[ns] \"うわっ！い、イズナ！？\""
"10013020-28-イズナ" = "はい！不肖イズナ、シズコ殿と同じく！"
"10013020-29-イズナ" = "夏の海に相応しい装束に着替えてきました！"
"10013020-30-イズナ" = "いかがですか、主殿？イズナ、かっこよく変身できてますか？"
"10013020-31" = "[ns] \"あ、うん。かっこいいよ。\""
"10013020-32-シズコ" = "ちょ、ちょっと！イズナ……！"
"10013020-33-シズコ" = "あらあら、みんな元気いっぱいですね。うふふ。"
"10013020-34-シズコ" = "先生、私も着替えたよー。"
"10013020-35-チセ" = "これで――"
"10013020-36-ミモリ" = "海の上、走れるかな？"
"10013020-37" = "[s] \"たぶん……無理だと思う。\""
"10013020-38-チセ" = "そうなの？"
"10013020-39-イズナ" = "ですがチセ殿！"
"10013020-40-イズナ" = "たとえ今は難しくとも、修行を怠らなければ――"
"10013020-41-イズナ" = "いつか忍者のように走れると、イズナは思います！はい！たぶん！"
"10013020-42" = "[s] \"もちろん自信を持つのはいいことなんだけど……！\""
"10013020-43" = "[ns] \"みんな水着に着替えたんだね。\""
"10013020-44-イズナ" = "はい、そうなんです。"
"10013020-45-イズナ" = "イズナの水着は部長とツクヨ殿が選んでくれたんです！任務先が海だと言ったら、必要になるかもしれないからと！なるほど、このような時に使われるのですね！"
"10013020-46-イズナ" = "ニヤ部長がー海で着ると強くなれるよって。"
"10013020-47" = "[s] \"そ、そうなんだ……ミモリは？\""
"10013020-48-イズナ" = "えっ？あっ、私は……その……"
"10013020-49-ミモリ" = "海に行くとツバキちゃんとカエデちゃんに言ったら……私に似合うものを見繕ってくれて……"
"10013020-50-ミモリ" = "一応、遊びに行くのではなく、シズコちゃんが危険かもしれないから行くのだと伝えたんですけど……"
"10013020-51-ミモリ" = "幻滅……されましたよね？"
"10013020-52" = "[ns1] \"まさか。せっかく、というのもあるからね。\"\n[ns2] \"みんな、とても似合ってるよ。\""
"10013020-53-ミモリ" = "そ、そうですか……"
"10013020-54-ミモリ" = "で、ですよね！皆さん準備万端で流石です！あはは……。"
"10013020-55-ウミカ" = "はい！皆さん、本当によく似合ってます！"
"10013020-56-ミモリ" = "新しいお祭りでも始まったのかなって思うくらいです！"
"10013020-57-ミモリ" = "こんなことなら、私も水着を持ってくればよかったなぁ～。"
"10013020-58-ミモリ" = "こんな眼福の一大イベントが開催されるなんて……海にきて良かった～！"
"10013020-59-シズコ" = "先生もそう思いますよね？ね？"
"10013020-60" = "[s] \"う、うん……そう、だね？\""
"10013020-61-シズコ" = "ウミカ、先生が困ってるから……。"
"10013020-62-ホシノ" = "さてさて、みんな集まったことだし、情報交換といこうか？"
"10013020-63-アヤネ" = "ニヤさんが調査してくれた情報によると、現在、この「ロスト・パラダイス・リゾート」で頭角を現しているグループはこのようになっているみたいです。"
"10013020-64-アヤネ" = "大体７つくらいに分かれているのね……"
"10013020-65-シロコ" = "ん。その中でも「リゾート狩り」を積極的にやっているのが、このヘルメット団。"
"10013020-66-セリカ" = "私たちもこの間戦ったわね。とにかく騒がしい連中だった。"
"10013020-67-ミモリ" = "活動拠点や移動経路があちこちに形成されていると見たほうが良さそうですね。"
"10013020-68-アヤネ" = "はい……ただ、このヘルメット団が特殊なだけで、ほとんどのグループは存在を隠そうとしているのか、水面下で活動しているようで……"
"10013020-69-アヤネ" = "正式な名前というよりは、通称で呼ばれているみたいなんです。"
"10013020-70" = "[s] \"通称？\""
"10013020-71-アヤネ" = "例えば、ここから一番近い島を占領しているグループは――"
"10013020-72-シズコ" = "「幻の泉脈を探す硫黄の鉱夫たち」……？"
"10013020-73-ノノミ" = "ロマンティックなお名前ですね☆"
"10013020-74" = "[s] \"ロマンティック……かなぁ？\""
"10013020-75-ミモリ" = "他にも「敗者を破滅に導く白い耳の怪物たち」とか……。"
"10013020-76-イズナ" = "あっ！「全てに代価を要求する玄武の使者たち」というグループもあるみたいですよ、主殿！"
"10013020-77-イズナ" = "まるで忍者と敵対する悪党みたいな名前ですね！"
"10013020-78" = "[s] \"イズナの善悪の基準がよく分からないんだけど……。\""
"10013020-79-シズコ" = "……ええと、漫画の設定か何かです？"
"10013020-80-ウミカ" = "そして、最後の一つは――"
"10013020-81-ウミカ" = "「片っ端から喧嘩を売って回るヘルメット団」です。"
"10013020-82-シズコ" = "それ、ただのヘルメット団じゃない！"
"10013020-83-シズコ" = "これで情報は大体全部かしら。"
"10013020-84-シズコ" = "むむむ…これじゃあ情報を得たというより、むしろ謎が謎を呼んだような……"
"10013020-85-ミモリ" = "うーん……シズコちゃん、これからどうします？"
"10013020-86-シズコ" = "うーん……この場合……"
"10013020-87-シズコ" = "より効率的に動くには……"
"10013020-88-シズコ" = "……よし、決めた。"
"10013020-89-シズコ" = "ここからは二手に分かれましょう。"
"10013020-90" = "[s] \"え？「リゾート狩り」をするのに？\""
"10013020-91-シズコ" = "はい。たしかに戦力は分散しますが、その分効率的に攻略できると思いますので。"
"10013020-92-シズコ" = "それに、こうしている間にも、百夜堂の評判はどんどん落ちてしまっているかもしれませんし……"
"10013020-93-シズコ" = "つまりこれは、時間との勝負なんです！"
"10013020-94" = "[s3] \"わかった。それならチームは……\"\n[s4] \"アビドスと百鬼夜行――で分けた方が良さそうだね。\""
"10013020-95-シズコ" = "はい。私たちはこのポイントに向かいますので、アビドスの皆さんはこっちをお願いします！"
"10013020-96-ホシノ" = "うへ～了解。んじゃ、それでいいかな？"
"10013020-97-シズコ" = "はい。それでは、みんなで――"
"10013020-98-ウミカ" = "出発しましょう！"
"10013020-99-イズナ" = "承知です！ニンニン！"
"10013020-100" = "[s] \"みんなで頑張ろう。\""
"10013020-101-シズコ" = "それじゃあ、今から「ロスト・パラダイス・リゾート」の占領戦を……"
"10013020-102-シズコ" = "始めるわよ！"
