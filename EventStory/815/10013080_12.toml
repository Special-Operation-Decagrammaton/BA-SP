[translation]
"10013080-1" = "第8話;ヘルメット団！最後の決戦！"
"10013080-2-ミモリ" = "ここですね！"
"10013080-3-ウミカ" = "やっと着いたー！ここが「ロスト・パラダイス・リゾート」の中で最大勢力を誇るというヘルメット団のリゾートね！"
"10013080-4-ウミカ" = "ですが、これは……"
"10013080-5-シズコ" = "今まで見たリゾートと、雰囲気が違う気がします……！"
"10013080-6" = "[ns] \"人が全然いないね……？\""
"10013080-7-チセ" = "あ……"
"10013080-8" = "[s] \"どうしたの、チセ？\""
"10013080-9-チセ" = "キラキラテントウムシさん。"
"10013080-10-イズナ" = "はい？テントウムシ……？"
"10013080-11-ヘルメット団A" = "だぁぁれが赤と黒が素敵に調和したテントウムシだ！！！！"
"10013080-12" = "[s] \"聞こえてたの！？\""
"10013080-13-シズコ" = "あなたが噂のヘルメット団幹部？"
"10013080-14-ミモリ" = "まるで待ち構えていたかのように、私たちを包囲したということは……"
"10013080-15-イズナ" = "い、イズナたち、敵の術中にはまっていたということですか！？"
"10013080-16-ラブ" = "ええ、そうよ！ここは最初からあんたらの墓場として目星をつけてた場所。#nそこに自ら足を運んでくるなんて酔狂なことね！"
"10013080-17" = "[s] \"でも、どうして私たちがここに来ることを知ってたの？\""
"10013080-18-？？？" = "顧客に対するアフターケアは確実に責任を持つ。"
"10013080-19-？？？" = "それがカイザーコーポレーションの社訓だからだ。"
"10013080-20" = "[ns] \"薄々予感はしていたけれど……。\""
"10013080-21-カイザーPMC理事（？）" = "久しぶりだな、シャーレの先生。"
"10013080-22" = "[s1] \"カイザー理事……！\"\n[s2] \"結構満喫してない！？\""
"10013080-23-シズコ" = "あっ、あなたは！オクトパスバンクで会った職員さん！"
"10013080-24-ウミカ" = "またお会いしましたね！？"
"10013080-25" = "[s] \"しかも担当者だったの！？\""
"10013080-26-カイザーPMC理事（？）" = "そう、この「ロスト・パラダイス・リゾート」に良い商品があると唆し、そちらのお嬢さん方に取引を提案したのはこの私だ。"
"10013080-27-カイザーPMC理事（？）" = "以前、貴様とアビドスの連中に関わってしまったことで大損害を受けた後、理事の座を辞任させられ――"
"10013080-28-カイザー営業職員" = "今では「オクトパスバンク」の営業職員だ！！"
"10013080-29" = "[s] \"なるほど、そんな経緯が……じゃなくて！\""
"10013080-30-カイザー営業職員" = "しかし……ここで一体何をしているんだ？"
"10013080-31-カイザー営業職員" = "今はリゾート運営に尽力せねばならん時だろう？"
"10013080-32-カイザー営業職員" = "何って……そんなの、あんたが勝手にばら撒いた契約書を回収してるに決まってるじゃない！"
"10013080-33-シズコ" = "そうです！私たちに使用権を売りつけておきながら、まさかこんな詐欺まがいなことを企んでいただなんて！"
"10013080-34-シズコ" = "はて？私はただ、君たちが銀行を訪れた際、良い商品があると提案しただけだが。"
"10013080-35-シズコ" = "あの時は強要もしなければ強制もしなかった。#n金を稼ぎたい一心でその商品を買ったのは君たちじゃないか。"
"10013080-36-ウミカ" = "それは……！"
"10013080-37-ウミカ" = "しかし困るな。勝手に他のリゾートに赴き、使用権を回収しようとするなど……"
"10013080-38-シズコ" = "そのような越権行為は見過ごすわけにはいかない。だから、アフターケアサービスのためにここまで出向いてきたのだ。"
"10013080-39-シズコ" = "ボディーガードを同伴させてな。"
"10013080-40-ラブ" = "ケッ！"
"10013080-41-ミモリ" = "……屁理屈ですね。先にシズコちゃんたちを騙したのは、あなたでしょうに……"
"10013080-42" = "[ns] \"最初から百夜堂を狙っていたんでしょう？\""
"10013080-43-カイザー営業職員" = "お祭り運営委員会は良い商品になるからな。#n百鬼夜行連合学院で祭りを開催できる権限、それを放っておくなどもったいない。"
"10013080-44-カイザー営業職員" = "故に、今回の一件で百夜堂の名誉を失墜させる。"
"10013080-45-カイザー営業職員" = "そのために様々な連中をこの群島に呼び寄せたのだ。"
"10013080-46-カイザー営業職員" = "そして百鬼夜行の名が傷ついたところで、満身創痍となった百夜堂を買収する。"
"10013080-47-カイザー営業職員" = "――どうだ、完璧な計画だろう？"
"10013080-48-カイザー営業職員" = "……しかし、その計画もまた貴様に邪魔されてしまったな。シャーレの先生。"
"10013080-49" = "[s] \"邪魔された？\""
"10013080-50-カイザー営業職員" = "今回はどんな手を使ったんだ？"
"10013080-51-カイザー営業職員" = "百夜堂の支えにでもなったか？#n諦めずに戦えと、そんな甘い言葉でも囁いたのか？"
"10013080-52-カイザー営業職員" = "無意味だな。そんなものより、もっと現実的な提案を私がしてやろう。"
"10013080-53-シズコ" = "……どういうこと？"
"10013080-54-カイザー営業職員" = "契約を結ぼうじゃあないか。私が貴様らに投資してやる。"
"10013080-55-ウミカ" = "と、投資を？#n私たちにオクトパスバンク……いや、カイザーコーポレーションが、ですか？"
"10013080-56-カイザー営業職員" = "ああ。ここまで辿り着いたのだ。腕の立つ連中には違いない。"
"10013080-57-カイザー営業職員" = "ここに来るまでの間、様々な者たちとフランチャイズ契約を結んだのだろう？#nならば、我々もそこに手を貸してやろうじゃないか。"
"10013080-58-カイザー営業職員" = "もちろん、これまでお祭り運営委員会の名で契約書を配布してしまったせいで、多少名前に傷はついているかもしれんが。"
"10013080-59-カイザー営業職員" = "しかしそれも全て金で解決できる問題だ。"
"10013080-60-カイザー営業職員" = "さあ、我々が投資してやろう。"
"10013080-61-カイザー営業職員" = "より多くの金を稼げるチャンスだ。今度こそちゃんとした契約関係をもって――"
"10013080-62-カイザー営業職員" = "お祭り運営委員会がここ、「ロスト・パラダイス・リゾート」を運営し莫大な利益を得るのだ。"
"10013080-63-カイザー営業職員" = "……余程のバカでもない限り、蹴ることのない話だと思うがね？"
"10013080-64-シズコ" = "社長……"
"10013080-65-シズコ" = "シズコちゃん……"
"10013080-66-ウミカ" = "…………"
"10013080-67-ウミカ" = "たしかに、すごく魅力的な提案ですね。"
"10013080-68-イズナ" = "シズコ殿……"
"10013080-69-シズコ" = "……でも。"
"10013080-70-シズコ" = "断ります。"
"10013080-71-カイザー営業職員" = "なんだと……？本気か？"
"10013080-72-シズコ" = "ニヤがね、こう言ってたんです。"
"10013080-73-シズコ" = "カイザーコーポレーションに騙されたのなら、今すぐ帰ってこいって。"
"10013080-74-シズコ" = "向こうが汚い手を使うなら、こっちもそうすればいいって。#nだから、そこに残る必要はない、って。"
"10013080-75-シズコ" = "でも……私は残ることにした。"
"10013080-76-シズコ" = "もちろん、百鬼夜行の――百夜堂の「ブランド価値」を守りたいからってのもあるんですけど……"
"10013080-77-シズコ" = "それ以上に……"
"10013080-78-シズコ" = "お祭りをバカにするやつらを、私は見過ごす事なんてできない！#nだからここにいるんです！"
"10013080-79-カイザー営業職員" = "戯言を……"
"10013080-80-シズコ" = "温泉開発部と契約したのは、"
"10013080-81-シズコ" = "純粋に自分たちが見つけたいものに向かって、"
"10013080-82-シズコ" = "努力していたからだし――"
"10013080-83-シズコ" = "ムシクイーン大会の子たちと契約したのは、面白いと思うから開く……"
"10013080-84-シズコ" = "そんなお祭りの余興みたいな理由だったから。"
"10013080-85-シズコ" = "でも、あんたたちは違う。ニャン天丸と同じ……"
"10013080-86-シズコ" = "こうしている間にも、あちこちの島で「リゾート狩り」が行われていて、多くのお客さんが被害を受けているはず……"
"10013080-87-シズコ" = "一番楽しくあるはずの夏の休暇が――あんたの私利私欲のせいで壊されてるのよ！"
"10013080-88-シズコ" = "そんなの絶対に許せない！"
"10013080-89-シズコ" = "この状況を作ったカイザーコーポレーションも同罪よ。だから――"
"10013080-90-シズコ" = "私の答えはこう！"
"10013080-91-シズコ" = "論外！完全にお断り！絶対NO！"
"10013080-92-ミモリ" = "社長……！"
"10013080-93-ウミカ" = "シズコちゃん！"
"10013080-94-カイザー営業職員" = "……そんなくだらない理由でチャンスを蹴るだと？#nそれがどれほど愚かな選択か、理解しているのか？"
"10013080-95" = "[s] \"愚かな選択じゃない。シズコが決めたことだ。\""
"10013080-96-カイザー営業職員" = "貴様……"
"10013080-97" = "[s3] \"私は最初から何もしてないし、全部シズコが決めたことだ。\"\n[s4] \"生徒を信じ、ついて行っているに過ぎないよ。\""
"10013080-98-カイザー営業職員" = "バカな……！そんな信念が一体何になるというのだ！"
"10013080-99-カイザー営業職員" = "……まあいい。ここで怒ったところで滑稽なだけだしな。"
"10013080-100-カイザー営業職員" = "ならば、こちらもヘルメット団の名をもって「リゾート狩り」をするだけだ。"
"10013080-101-カイザー営業職員" = "ラブ、全員集めろ！"
"10013080-102-カイザー営業職員" = "あはは！その言葉を待ってたよ！"
"10013080-103-ラブ" = "全員集合！"
"10013080-104-イズナ" = "あわわわわ！もも、ものすごい数ですよ！？どうしましょう、主殿！？"
"10013080-105-イズナ" = "みんなで、お祭りするの？"
"10013080-106-ウミカ" = "まあ、お祭りと言えばお祭りなんですけど……どうします？社長。"
"10013080-107-シズコ" = "と、とにかく後退しながら逃げ道を……！"
"10013080-108-ラブ" = "はっ、まさか逃げられると思ってんの？ほら、後ろも塞いで！"
"10013080-109" = "[ns] \"まずい！囲まれ……た？\""
"10013080-110-ラブ" = "今回は腕の立つメンバーを選抜したの！さあ、その実力を見せつけてやりな！"
"10013080-111-？？？" = "よ～し、作戦成功。"
"10013080-112-？？？" = "これ、成功したの！？ていうか、本当にこれでいいの！？"
"10013080-113-？？？" = "それだけすごい作戦だったってことですね～☆"
"10013080-114-シロコ" = "ん。「ヘルメット団に偽装して疑われずに潜り込む作戦」大成功。"
"10013080-115" = "[s] \"………。\""
"10013080-116-シズコ" = "………………えっ？えええええ！？"
"10013080-117-ラブ" = "……ちょっと、何してんの？#n早くあいつらの退路を塞ぎなって！"
"10013080-118" = "[s] \"いや、その……。\""
"10013080-119-ラブ" = "……待て、ラブ。"
"10013080-120-カイザー営業職員" = "貴様が言っていた腕の立つ新入りというのは、まさか……"
"10013080-121-ラブ" = "新入りがどうかした？"
"10013080-122-ラブ" = "あ、あんたは……！あの時の！"
"10013080-123-ラブ" = "あれ？気のせい？"
"10013080-124-ホシノ" = "と、とにかく！戦闘準備！"
"10013080-125-ホシノ" = "うへぇ～。"
"10013080-126-ラブ" = "え……ええええええ！？あ、あんたは！！"
"10013080-127-カイザー営業職員" = "…………。"
"10013080-128-ミモリ" = "……あらあら。"
"10013080-129-チセ" = "あ、先生。蝶々……"
"10013080-130-カイザー営業職員" = "あ、アビドスだと……！何故貴様らがここに！？#nラブ、これはどういうことだ！？"
"10013080-131-ラブ" = "ちょ、ちょっと待って！うちはただ、ちょっと変だけど、すっごくクールで個性的なヘルメットをかぶったやつらだと思って！！"
"10013080-132-シズコ" = "たしかに、先生の言う通り、すごいやり方ですね……。"
"10013080-133" = "[s] \"さすがに私もこれは予想できなかったなー。\""
"10013080-134-セリカ" = "私らも、あんた達が仕組んだリゾート使用権が当たったから来たのよ！"
"10013080-135-セリカ" = "今回のことは全て……カイザー理事！あなたの仕業だったんですね！"
"10013080-136-セリカ" = "いや、そんなはずは……#n私はあくまで騒動を起こす問題児のみを選んで使用権を……。"
"10013080-137-カイザー営業職員" = "待て。今、「当たった」と言ったな。それはどういうことだ？"
"10013080-138" = "[s] \"そういえば、セリカがどこで当てたのか聞いてなかったね。\""
"10013080-139-セリカ" = "えっ？どこって……"
"10013080-140-セリカ" = "柴関ラーメン屋で大将がやってたくじで、だけど……。"
"10013080-141" = "[ns] \"そういうことだったんだ。\""
"10013080-142-シロコ" = "まあ、そのおかげでみんなここに集まれたんだけどねー。"
"10013080-143-シズコ" = "うん！すっごく心強いよ！"
"10013080-144" = "[ns] \"それじゃあ、百鬼夜行とアビドスの共同作戦、スタート！\""
