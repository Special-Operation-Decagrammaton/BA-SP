[translation]
"10013005-1" = "プロローグ;夏はまだ終わらない"
"10013005-2-アヤネ" = "先生、着きましたよ！"
"10013005-3" = "[s1] \"送ってくれてありがとう、アヤネ。\"\n[s2] \"そっちも忙しいのに、ごめんね。\""
"10013005-4-アヤネ" = "とんでもないです！先生にはいつもお世話になっていますから。"
"10013005-5-アヤネ" = "それに、みんなと約束しましたし……先生を無事にシャーレまで送り届けるって。"
"10013005-6-アヤネ" = "……って、今は無駄話をしている場合じゃありませんでした。#n先生、荷物を持ってすぐオフィスに――"
"10013005-7-アヤネ" = "――あれ？入口に誰かいますね……"
"10013005-8" = "[s] \"えっ？\""
"10013005-9-？？？" = "あら～先生。ひょっとして、今休暇から帰ってきたところです？"
"10013005-10-ニヤ" = "しかもこ～んなかわいい子と一緒に？"
"10013005-11-アヤネ" = "は、はい！？か、か、かわいい……ですか！？"
"10013005-12-ニヤ" = "んふふ、その初々しい反応。初めてカホと会った時を思い出すわぁ。"
"10013005-13-ニヤ" = "ほんと、可愛らしい。"
"10013005-14" = "[s] \"ニ、ニヤ……？\""
"10013005-15-ニヤ" = "もう、ニヤさん。先生と隣の生徒さんが困ってるじゃないですか。#n今日の目的をどうかお忘れなく。"
"10013005-16-ニヤ" = "にゃはは～、ごめんごめん。#nつい楽しくなってしまって～。"
"10013005-17" = "[s] \"ミモリも一緒って……なんだか珍しい組み合わせだね。\""
"10013005-18-ミモリ" = "まあ、雑談はこれくらいにして。"
"10013005-19-ニヤ" = "――百鬼夜行として正式に相談したいことがあり、こちらに参った次第です。"
"10013005-20-フィーナ" = "ノォォォォ！！センセイ！大変デース！"
"10013005-21-フィーナ" = "委員長が……！委員長とウミカがぁぁぁあ！！"
"10013005-22" = "[s] \"フィーナまで！？シズコに何かあったの？\""
"10013005-23-フィーナ" = "それがですね…シズコちゃんがどうやら大変な事になっているらしく……"
"10013005-24" = "[s] \"百夜堂に行ってシズコに詳しい話を……。\""
"10013005-25-ニヤ" = "シズコさんなら、いま百夜堂にはいませんよ。"
"10013005-26-ニヤ" = "委員長は海に行きマシタ！"
"10013005-27" = "[s] \"…………海？\""
"10013005-28-フィーナ" = "ええ。聞いた話ですが、シズコさんは今――"
"10013005-29-ミモリ" = "「ロスト・パラダイス・リゾート」？だったかにいるらしく……"
"10013005-30" = "[s] \"「ロスト・パラダイス・リゾート」？どこかで聞いたような……。\""
"10013005-31-アヤネ" = "先生……そこって、さっきまで私たちがいたリゾートじゃないですか？"
"10013005-32" = "[s] \"……えっ？\""
"10013005-33-アヤネ" = "皆さん、もう降りて大丈夫ですよ。"
"10013005-34-チセ" = "とうちゃ～く。"
"10013005-35-ミモリ" = "ここが「ロスト・パラダイス・リゾート」ですか……。"
"10013005-36-アヤネ" = "正確にはちょっと違うんですけどね……。"
"10013005-37" = "[s] \"アビドスの件で大変なのに……本当にありがとう、アヤネ。\""
"10013005-38-アヤネ" = "いえいえ！私もちょうど戻らなきゃと思っていたところでしたので。#nまたこうして先生と一緒に戻る事になるとは思いませんでしたが……。"
"10013005-39-ニヤ" = "みなさん、無事に到着したみたいですね～♪"
"10013005-40" = "[s] \"うん、到着したよ。……ニヤは来なかったけどね。\""
"10013005-41-ニヤ" = "にゃはは～♪まあ、私とアツ～い時間を過ごしたいという先生のお気持ちはわからなくもないですが。"
"10013005-42-ニヤ" = "陰陽部の部長である以上、おいそれと席を外すわけにはいきませんからねぇ。"
"10013005-43-ニヤ" = "代わりと言ってはなんですが、チセとミモリさんが一緒なわけですし。#n私への愛はそのお二人に伝えてくださいな～。"
"10013005-44" = "[s] \"はいはい……。\""
"10013005-45-ミモリ" = "アハハ……"
"10013005-46-チセ" = "うん、部長の代わりにがんばるね～。"
"10013005-47-フィーナ" = "センセイ、すみマセン！フィーナも委員長を助けるためにご一緒したかったデス！でも――"
"10013005-48-フィーナ" = "フィーナには、百夜堂のシマを守るという使命が……！"
"10013005-49" = "[s] \"大丈夫だよ。こっちは私たちに任せて。\""
"10013005-50-フィーナ" = "はい、センセ――いや、お頭！"
"10013005-51-ニヤ" = "シズコさんは、多分そこの「海の家」にいるはずです。"
"10013005-52" = "[s] \"「海の家」……か。\""
"10013005-53" = "[ns] \"んん！？\""
"10013005-54-ミモリ" = "あちらで何かあったみたいですね。"
"10013005-55-チンピラA" = "つ、強い！これがリゾート狩りを企んでいるという、例の黒幕の力なんだな！"
"10013005-56-チンピラB" = "侮れないな……！百鬼夜行のお祭り運営委員会！"
"10013005-57-シズコ" = "だーかーらー！あなた達が何を言ってるのか、さっぱり分かんないんですけど！！"
"10013005-58-ウミカ" = "そうですよ！いきなりやってきてお店の邪魔して！何なんですか！"
"10013005-59-イズナ" = "今日だけで5回目ですよ！5回目！#nイズナも、そろそろ堪忍袋の緒が切れてしまいそうです！"
"10013005-60-チンピラA" = "この状況でもとぼけるとはな……さすが黒幕だ。"
"10013005-61-チンピラA" = "今回はこの辺で勘弁しておいてやる！だが、これで終わりだと思うなよ！"
"10013005-62-イズナ" = "なんでだろ……勝ったはずなのに、全然スッキリしないんですけど！？"
"10013005-63" = "[s] \"シズコ？\""
"10013005-64-チセ" = "シズコちゃん……！"
"10013005-65-ミモリ" = "タヌキさんこんにちは～。"
"10013005-66-イズナ" = "えっ！？先生！？それにミモリとチセも！？"
"10013005-67-シズコ" = "あ、主殿！？"
"10013005-68-シズコ" = "シャーレの先生！？"
"10013005-69" = "[s] \"えっと……何があったの？\""
"10013005-70-シズコ" = "それが、その……うぅ……"
"10013005-71-イズナ" = "うわあぁぁぁぁぁぁん！！！ぜん゛ぜぇ゛～！#nほんと、今日は「大変」って言葉じゃ片付かないレベルなんです～！！"
"10013005-72" = "百夜堂 ロスト・パラダイス・リゾート支店"
"10013005-73-イズナ" = "まさか、主殿がお越しくださるなんて！"
"10013005-74-イズナ" = "もしかして、イズナの活躍を見に来てくれたんですか？ニンニン！"
"10013005-75" = "[s] \"用事があってね。ところで、どうしてイズナがここに？\""
"10013005-76-イズナ" = "イズナはシズコ殿の依頼で護衛をしておりました！"
"10013005-77-イズナ" = "きっとシズコ殿は、将来キヴォトス最強の忍者となるイズナの可能性を見抜いたに違いありません！"
"10013005-78-シズコ" = "えっ？"
"10013005-79-シズコ" = "忍者って目新しいし、"
"10013005-80-シズコ" = "宣伝効果あるかな～と思ってお願いはしたけど……。"
"10013005-81-イズナ" = "へっ！？それじゃあ、イズナの真価を見抜いていたわけではないのですかー！？"
"10013005-82-イズナ" = "（しゅん）"
"10013005-83" = "[s] \"バイトをしているイズナも可愛いよ。\""
"10013005-84-イズナ" = "そ、そうですか？えへへっ♪"
"10013005-85" = "[s3] \"そういえば、ニヤとフィーナから聞いたよ。\"\n[s4] \"シズコとウミカが大変だって。\""
"10013005-86-ウミカ" = "たしかに、大変と言えば大変ですね。実は――"
"10013005-87-シズコ" = "今日、営業妨害が5回！半日で5回もあったんです！"
"10013005-88" = "[s] \"それは災難だったね……。\""
"10013005-89-ウミカ" = "はい……今日、お店を開けるや否や変なお客様が続々とやってきて……。#n「権利者を倒す！」だの「リゾート狩り」だのとわけの分からない事を……"
"10013005-90-ウミカ" = "ひょっとして、私が知らないお祭りとかだったんでしょうか？"
"10013005-91-シズコ" = "いやいや！そんなわけないでしょ！"
"10013005-92" = "[s] \"「権利者」……「リゾート狩り」……。\""
"10013005-93-アヤネ" = "あの、シズコさん。"
"10013005-94-シズコ" = "つかぬ事をお聞きしますが……「リゾート使用権」などが当たったりしましたか？"
"10013005-95-シズコ" = "え？いや、私たちは……"
"10013005-96-シズコ" = "フッフッフ……。#n実は、私たちお祭り運営委員会は「リゾート使用権」を正式に購入したのです！"
"10013005-97-ウミカ" = "あくまで事業の一環として、だけどね。"
"10013005-98" = "[s] \"「購入」ということは、あの穴だらけの契約書にサインを？\""
"10013005-99-ウミカ" = "え？穴だらけって、どういうことですか？"
"10013005-100" = "[s] \"ん？\""
"10013005-101-シズコ" = "んん？"
"10013005-102-ミモリ" = "えっと……どうも話が噛み合ってないみたいですね。"
"10013005-103-ミモリ" = "アヤネさんは何かご存知ですか？"
"10013005-104-ミモリ" = "先生と一度こちらにいらしたと仰ってましたし。"
"10013005-105-アヤネ" = "それが……私もこの状況をどう説明すればいいのか……。"
"10013005-106-シズコ" = "えっ？先生、ここに来たことあるんですか？"
"10013005-107" = "[s] \"えっと……実は、この群島全体で「リゾート狩り」というのが起きてるんだ。\""
"10013005-108-シズコ" = "それって、さっきのスケバンたちが言っていたヤツですよね？"
"10013005-109-シズコ" = "えっと……あの契約書には不備があって……#n他にも権利を持っていると主張している人がいる……？どうして……？"
"10013005-110" = "（混乱しているシズコに、現在ここで起きている事の説明をすることに）"
"10013005-111" = "[s] \"まず、シズコが持っている使用権を確認しようか。\""
"10013005-112" = "（本契約書の契約者は、「ロスト・パラダイス・リゾート」の「使用権限」を得る）"
"10013005-113" = "（上記の「使用権限」とはリゾート内全ての土地、備品及び設備にする権限及び#n　それにより得た全ての収益と資源もまた所有できるものとして）"
"10013005-114" = "（契約書の所有者はその全ての権利を保障されるものする）"
"10013005-115-シズコ" = "……えっと、契約内容はちゃんと合意したものですけど……#nどの辺に不備があるんですか？"
"10013005-116" = "[s] \"問題はその契約書……水着スケバンを含めて複数人が持っているんだ。\""
"10013005-117" = "（アビドスでセリカがくじに当選して「リゾート使用権」を手に入れたこと、#n　そしてヘルメット団も同じようなものを持っていたことを話した）"
"10013005-118" = "（最初はまるで島だけに限られた使用権のように見えていた契約書が、実際にはこの#n「ロスト・パラダイス・リゾート」群島全体の権利を含めている契約書であること）"
"10013005-119-ウミカ" = "つまり……先生の仰る通りであれば、「ロスト・パラダイス・リゾート」には#n私たち以外にも同じ契約書を持った方が集まっていて――"
"10013005-120-ウミカ" = "契約書の不備に気付いて、お互いに自分の利権を主張するため「リゾート狩り」をしているという事ですね！？"
"10013005-121-シズコ" = "いや、それこそ意味がわからないですよ！#nっていうか、先生はどうしてそんなこと――"
"10013005-122" = "[s] \"ついさっきまでアヤネ達とその騒動に巻き込まれていて……。\""
"10013005-123" = "[ns]（そういえば、この群島のどこかにまだシロコたちが……）"
"10013005-124-イズナ" = "わわっ！また敵襲ですか！？"
"10013005-125-シズコ" = "今度は誰！？これで6回目よ！？"
"10013005-126-ノノミ" = "は～い、しゅ～ご～う。"
"10013005-127-ホシノ" = "みんなで仲良く！登場です☆"
"10013005-128" = "[s] \"あ、あれは……！！\""
"10013005-129-セリカ" = "やっと見つけたわよ！「リゾート狩り」の元凶！"
"10013005-130-セリカ" = "百鬼夜行連合学院のお祭り運営委員会ってのはあんた達？#n私たちを騙したツケ、ここで払ってもらうんだから！"
"10013005-131-シロコ" = "そう、これは……正義の裁き。"
"10013005-132-ノノミ" = "ふふ☆「正義」の裁きですよ～。"
"10013005-133-ホシノ" = "それじゃあ、みんな。準備はいい～？"
"10013005-134-ホシノ" = "ええ、行くわよ！！"
"10013005-135-アヤネ" = "………………えっ？"
"10013005-136-アヤネ" = "えええええっ！？あ、あれ、先輩たちですよね！？"
"10013005-137" = "[ns] \"……もう、何がなんだか……。\""
"10013005-138-シズコ" = "これって……"
"10013005-139-シズコ" = "一体どういう状況なのよぉぉぉぉおお！？"
"10013005-140" = "#video;10013"
