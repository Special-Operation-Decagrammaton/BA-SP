[translation]
"10042060-1" = "第6話;やるべきこと"
"10042060-2-アコ" = "……。"
"10042060-3-アコ" = "こ、これは……。"
"10042060-4" = "[s] \"だから言ったでしょ……？\""
"10042060-5-アコ" = "こ、こんなの信じられるわけないでしょう！"
"10042060-6-アコ" = "やっぱりドッキリですか？それとも悪い夢？#nは、早く目を覚まさないと……！"
"10042060-7-アコ" = "痛っ！"
"10042060-8-アコ" = "では、現実……？"
"10042060-9-フウカ" = "（あれ……）"
"10042060-10-ジュリ" = "（私もやった覚えが……）"
"10042060-11-アコ" = "人は理解不能な事態に遭遇すると不可解な行動をとる、とはよく言いますが……#nまさにそれですね。"
"10042060-12-アコ" = "だまらっしゃい！"
"10042060-13-アコ" = "巨大なパンケーキと聞いてはいましたが、まさかここまでとは……。"
"10042060-14-アコ" = "うぅ。余剰火力で先生を困らせる計画が……。"
"10042060-15" = "[s] \"そんなことを考えてたんだ……。\""
"10042060-16-アコ" = "……っ！"
"10042060-17-アコ" = "結果的には大正解でしたし、むしろ感謝するところじゃないですか！？"
"10042060-18-アコ" = "早く「そうだね」と言ってください！#nなんですか、その顔は……！"
"10042060-19" = "[s] \"そうだね……ごめん、泣かないでアコ。\""
"10042060-20-アコ" = "な、泣いてませんけど！？"
"10042060-21-アコ" = "……。"
"10042060-22-アコ" = "はぁ、良いでしょう。#n総員、発砲準備！"
"10042060-23-風紀委員" = "はい！88ミリFlaK36対空砲、発砲準備！"
"10042060-24-アコ" = "お、お待ちください。行政官……！"
"10042060-25-アコ" = "何ですか……？"
"10042060-26-チナツ" = "それが……。"
"10042060-27-風紀委員" = "……！#nターゲットが……。"
"10042060-28-風紀委員" = "「パンケーキ」の移動速度があまりにも早く、照準が合いません！"
"10042060-29-風紀委員" = "建物を盾にしているせいで……。"
"10042060-30-風紀委員" = "このまま発砲すれば、市街地に甚大な被害が！"
"10042060-31-チナツ" = "……はい？"
"10042060-32-チナツ" = "……その通りです。"
"10042060-33-アコ" = "ちょっと、待ってください……。"
"10042060-34-アコ" = "パンケーキが、建物間を高速移動。#n照準が合わず、このままでは市街地に被害が……。"
"10042060-35-アコ" = "い、いったいどういう状況ですか？"
"10042060-36" = "[s1] \"……アコ、大丈夫？\"\n[s2] \"「構わず撃て！」とは言わないんだね。\""
"10042060-37-アコ" = "私を何だと思ってるんですか……。"
"10042060-38-アコ" = "うっ……。"
"10042060-39-アコ" = "（今は、あれを倒さなければなりません……）"
"10042060-40-アコ" = "（ですが、砲撃で市街地が巻き添えになっては本末転倒）"
"10042060-41-アコ" = "（それに、[ruby=パンデモニウム・ソサエティー]あの万魔殿のタ[/ruby]ヌキたちは必ず難癖をつけてくるはず……！）"
"10042060-42-セナ" = "……行政官。"
"10042060-43-アコ" = "……今度は何ですか！？"
"10042060-44-セナ" = "後ろ。"
"10042060-45-アコ" = "……？"
"10042060-46-アコ" = "どういう――"
"10042060-47-アコ" = "きゃああぁぁぁぁあああっ！？！？"
"10042060-48-チナツ" = "パンちゃんの触手が、アコ行政官に！"
"10042060-49-チナツ" = "あ、足首を掴んで逆さまに……！？"
"10042060-50-チナツ" = "行政官、大丈夫ですか！？"
"10042060-51-アコ" = "あ、あああっ！！は、早く！早く何とかしてくださいっ！"
"10042060-52-アコ" = "何ですか、これはっ！き、気持ち悪い！#nぬるぬるして……もう、最悪！！！"
"10042060-53-アコ" = "……んうっっ！？！？"
"10042060-54" = "[ns] \"アコの口に、パンちゃんの触手が……！\""
"10042060-55-セナ" = "なるほど。これまでの人たちも全員……。"
"10042060-56-アコ" = "へいえいいふんへひひてるばあいえすか！？#n（冷静に分析してる場合ですか！？）"
"10042060-57-アコ" = "はやふ！なんおあひてくあはい！！#n（早く！何とかしてください！！）"
"10042060-58-フウカ" = "え、えっと、どうすればいいの！？"
"10042060-59-セナ" = "分かりません。私にあのような趣味はありませんので。"
"10042060-60-チナツ" = "そもそも、行政官は何を言っているのでしょう……？"
"10042060-61-ジュリ" = "……。"
"10042060-62-ジュリ" = "早く止めなきゃ……！！"
"10042060-63-チナツ" = "ジュリ……？"
"10042060-64-チナツ" = "何をするつもりですか……？"
"10042060-65-セナ" = "まだ解決策はありませんが……。"
"10042060-66-ジュリ" = "それでも、何とかしないと！"
"10042060-67-ジュリ" = "……私が、やります。"
"10042060-68" = "[s3] \"……ジュリ！？\"\n[s4] \"何をするつもりなの……？\""
"10042060-69-ジュリ" = "私……料理が上手くなりたかったんです。#nでも、ずっと変わりませんでした。"
"10042060-70-ジュリ" = "なのに今日はなぜか上手くいって……。#n料理が出来上がった時は、本当に嬉しくて……。"
"10042060-71-ジュリ" = "また次も……。"
"10042060-72-ジュリ" = "自分の手で、作りたい……と、思ったんです。"
"10042060-73-チナツ" = "ジュリ……い、いきなりどうしたの！？"
"10042060-74-セナ" = "……なるほど、フラグですか。"
"10042060-75-チナツ" = "先輩！？！？"
"10042060-76-ジュリ" = "大丈夫です、先輩。#n心配しないでください。"
"10042060-77-ジュリ" = "ここは――"
"10042060-78-ジュリ" = "私に任せてください。"
"10042060-79-ジュリ" = "――これは、私が「やるべきこと」ですから。"
"10042060-80" = "[ns5] \"ジュリ……！\"\n[ns6] \"そのセリフはいけない！！！\""
"10042060-81-ジュリ" = "先生……。"
"10042060-82-ジュリ" = "……。"
"10042060-83-ジュリ" = "私のこと、忘れないでくださいね。"
"10042060-84-ジュリ" = "ここは……私が何とかします。"
"10042060-85-ジュリ" = "後はお願いしますね。"
"10042060-86-ジュリ" = "……では、行ってきます。"
"10042060-87-フウカ" = "それ、死亡フラグだから！！！"
