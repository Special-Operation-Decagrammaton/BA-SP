[translation]
"10042050-1" = "第5話;WHAT A LOVELY DAY"
"10042050-2-セナ" = "おかしいですね。"
"10042050-3" = "[s] \"何が？\""
"10042050-4-セナ" = "ある地点から痕跡が途切れています。#nネバネバも、ソースまみれになった生徒もいません。"
"10042050-5-ジュリ" = "か、代わりに……。"
"10042050-6-ジュリ" = "倒れている生徒が増えているような……？"
"10042050-7-ジュリ" = "「パターン」に変化が生じたのでしょうか？"
"10042050-8" = "[s1] \"「パターン」か……。\"\n[s2] \"チナツも大分慣れてきたね。\""
"10042050-9-チナツ" = "私、ですか……？"
"10042050-10-セナ" = "まず、サンプルをひとつ確保するとしましょう。#nあちらで倒れている犠牲者にします。"
"10042050-11-フウカ" = "大丈夫ですか？#n……どうしよう、意識がないみたい。"
"10042050-12-セナ" = "私にお任せください。"
"10042050-13-ジュリ" = "どうにかできるんですね！？#n流石セナさんです！"
"10042050-14-ジュリ" = "ひ、ひいっ！？"
"10042050-15-ジュリ" = "痛っ！#n何するんだ！"
"10042050-16" = "[s] \"そ、それは流石に……。\""
"10042050-17-セナ" = "気付け薬代わりには最適かと。"
"10042050-18-チナツ" = "部長……それって、突然興奮する患者を鎮静化させたり、気絶したふりをする生徒を確かめる時のですよね……？"
"10042050-19-セナ" = "ええ。どんな時でも使えるからこそ、万能法として知られているのですよ。"
"10042050-20-セナ" = "それにゲヘナ生が相手なら、手加減する必要はありませんから。"
"10042050-21-フウカ" = "一応、患者なのに……。"
"10042050-22-チナツ" = "すみません、本当に悪気はないのですが……。"
"10042050-23-ジュリ" = "と、とりあえず！#n目を覚ました生徒さんに話を聞いてみましょう！"
"10042050-24-混乱状態のゲヘナの生徒" = "……どうして、私はこんなところに？"
"10042050-25-セナ" = "あなたはしばらく意識を失っていたのです。#n動くパンケーキを見ませんでしたか？"
"10042050-26-セナ" = "パンケーキ……？#n待って、何か思い出せそうな……。"
"10042050-27-セナ" = "あれだ！#n暴れ回る紫の巨大パンケーキ！！"
"10042050-28-チナツ" = "厳密に言えば、あれはパンケーキではありません。#nパンケーキの形をした何かです。"
"10042050-29-チナツ" = "よろしければ、私たちと一緒に来ませんか？#n道案内をお願いしたいのですが。"
"10042050-30-混乱状態のゲヘナの生徒" = "一緒に……？"
"10042050-31-混乱状態のゲヘナの生徒" = "は、ははっ……。"
"10042050-32-混乱状態のゲヘナの生徒" = "ふざけないで……！#nこのままじゃ、全員やられちまう！"
"10042050-33-混乱状態のゲヘナの生徒" = "あんたも！私も！全員！#n逃げられっこない！"
"10042050-34" = "[s3] \"い、いきなりどうしたの！？\"\n[s4] \"お、落ち着いて！\""
"10042050-35-セナ" = "パニックに陥っていますね。"
"10042050-36-フウカ" = "！？"
"10042050-37-ジュリ" = "皆さん、隠れてください！"
"10042050-38-チナツ" = "あちらに安全な場所が！"
"10042050-39-セナ" = "全員逃げられましたか？"
"10042050-40-セナ" = "あっ……。"
"10042050-41-ジュリ" = "ど、どうかしましたか？"
"10042050-42-セナ" = "……あれを。"
"10042050-43-混乱状態のゲヘナの生徒" = "来た……ついに来たぁ！"
"10042050-44-混乱状態のゲヘナの生徒" = "あぁ、これでようやく……！"
"10042050-45-フウカ" = "どうしたの、あれ？"
"10042050-46-セナ" = "正気を失ったら、ああなることがあります。#n特に問題ではありません。"
"10042050-47-フウカ" = "いや、この状況を問題視してほしいんだけど！？"
"10042050-48-混乱状態のゲヘナの生徒" = "終焉が訪れる！運命からは逃れられない！"
"10042050-49-混乱状態のゲヘナの生徒" = "お前が歩んできた道には、ソースを残してきた！"
"10042050-50-混乱状態のゲヘナの生徒" = "さあ、パンケーキよ！#n目を覚ませ！声をあげて銃を構えろ！"
"10042050-51-混乱状態のゲヘナの生徒" = "私を見ろ！私はここにいる！"
"10042050-52-混乱状態のゲヘナの生徒" = "嗚呼っ！なんて素晴らしい日だ！"
"10042050-53-混乱状態のゲヘナの生徒" = "お前を遮るものがいれば、嘲笑うが良い！"
"10042050-54-混乱状態のゲヘナの生徒" = "お前を追うものがいれば、引き裂くが良い！"
"10042050-55-混乱状態のゲヘナの生徒" = "そして、お前を罵るものがいれば……。"
"10042050-56-混乱状態のゲヘナの生徒" = "愛するが良い！！！！"
"10042050-57" = "[ns5] \"……えっ。\"\n[ns6] \"……行っちゃった。\""
"10042050-58-ジュリ" = "……大丈夫、でしょうか？"
"10042050-59-ジュリ" = "先ほども言った通り、正気を失っているだけで、命に別状はないはずです。"
"10042050-60-セナ" = "症状は特殊なようにも見えますが、致命傷というほどでもないでしょう。#nいたって自然治癒可能な範疇です。"
"10042050-61-フウカ" = "いやそんなことなくない……！？"
"10042050-62-チナツ" = "部活間の抗争やスケバン同士の衝突などと同程度の……日常茶飯事ですから。"
"10042050-63-チナツ" = "給食部の皆さんは普段忙しいので……。"
"10042050-64-チナツ" = "ゲヘナで起きている事件や事故の規模について、あまり詳しくないかもしれませんね。"
"10042050-65-チナツ" = "……知らなくて済むのなら、それに越したことはありませんが。"
"10042050-66-フウカ" = "（知らなくていいで済む問題じゃなくない？）"
"10042050-67" = "[ns] \"相変わらず、ゲヘナはカオスだね……。\""
"10042050-68-セナ" = "朝になれば日が昇り、昼になれば給食が出て、救急医学部には死体……いえ、負傷者が搬送される。"
"10042050-69-セナ" = "そう――何があろうと、ゲヘナはいつものように回る、という意味です。#nもちろん、多少のノイズはあるかもしれませんが。"
"10042050-70-チナツ" = "それは、私たち風紀委員会とヒナ委員長の尽力の賜物であって……！"
"10042050-71-チナツ" = "……いえ、何でもありません。"
"10042050-72-セナ" = "ところで……。#nさっき、振動を感じませんでしたか？"
"10042050-73-ジュリ" = "振動、ですか？"
"10042050-74-フウカ" = "たしかに、なんか変な音が聞こえたような……？"
"10042050-75-セナ" = "はい。"
"10042050-76-セナ" = "……どうやら、もう探す必要はないのかもしれません。"
"10042050-77" = "[s] \"……どういう意味？\""
"10042050-78-セナ" = "直接、目にしたほうが早いかと。"
"10042050-79-セナ" = "あちらです。"
"10042050-80" = "[log]セナは無言のまま、とある方角を指し示す。[/log]"
"10042050-81" = "[log]その先には――[/log]"
