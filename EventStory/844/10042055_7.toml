[translation]
"10042055-1-フウカ" = "ねぇジュリ、口に出すか悩んだんだけど……。"
"10042055-2-フウカ" = "その、えっと……。"
"10042055-3-ジュリ" = "だ、大丈夫です……話してください。"
"10042055-4-フウカ" = "……よく、ここまで育ったね？"
"10042055-5-ジュリ" = "せ、先輩！？"
"10042055-6" = "[ns1] \"頭がくらくらする……。\"\n[ns2] \"パンちゃんは成長期だったんだね……。\""
"10042055-7-チナツ" = "たしかに、もう探す必要はありませんね。"
"10042055-8-セナ" = "ええ、実に興味深いです。"
"10042055-9-フウカ" = "そんなこと言ってる場合！？"
"10042055-10-セナ" = "……そうですね。"
"10042055-11-セナ" = "どうやら――"
"10042055-12-セナ" = "――冗談を言っている場合ではなさそうです。"
