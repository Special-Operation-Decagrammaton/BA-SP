[translation]
"10042030-1" = "第3話;バイオハザード"
"10042030-2-救急医学部の部員" = "搬送準備、完了しました。"
"10042030-3-救急医学部の部員" = "お疲れ様です。"
"10042030-4-救急医学部の部員" = "あの、こんなことを言って良いのか分かりませんが……。"
"10042030-5-救急医学部の部員" = "カフェでさっき、アレを見かけました。"
"10042030-6-救急医学部の部員" = "アレ……？"
"10042030-7-救急医学部の部員" = "……ああ、例のモンスターですか。"
"10042030-8-ジュリ" = "！？"
"10042030-9-ジュリ" = "（そういえば、あの方……さっきいらっしゃっていた……！）"
"10042030-10-救急医学部の部員" = "詳しくお聞きしても？"
"10042030-11-救急医学部の部員" = "はい、友達とカフェにいたら……。"
"10042030-12-救急医学部の部員" = "緑のネバネバをまとった紫パンケーキが見えたんです。"
"10042030-13-救急医学部の部員" = "……緑と紫、ですね。"
"10042030-14-救急医学部の部員" = "一瞬だったから、うろ覚えですが……触手のようなものが生えてました。"
"10042030-15-救急医学部の部員" = "それがビュッて通り過ぎていったんです。"
"10042030-16-救急医学部の部員" = "うう……思い出すだけで気持ち悪い。"
"10042030-17-救急医学部の部員" = "なるほど……モンスターの行き先に心当たりはありますか？"
"10042030-18-救急医学部の部員" = "いえ、そこまでは。#nそもそも、こんなところまで来ているとも思っていなくて。"
"10042030-19-救急医学部の部員" = "分かりました。とりあえずこの死体……いえ、負傷者を搬送後、経過観察をお願いします。"
"10042030-20-救急医学部の部員" = "はい、部長。"
"10042030-21-セナ" = "まだ状況は掴みきれていませんが……。"
"10042030-22-セナ" = "確実に言えるのは――"
"10042030-23-セナ" = "――私が来た以上、事態を見過ごすわけにはいきません。"
"10042030-24" = "[s1] \"おお、カッコ良い。\"\n[s2] \"ドクターセナ、って呼んでも良い？\""
"10042030-25-セナ" = "ドクター……？"
"10042030-26-セナ" = "つまり、私を信頼してくださるのですね。"
"10042030-27-セナ" = "ありがとうございます、嬉しいです。"
"10042030-28-セナ" = "――この状況、個人的にも少し興味が湧いてきまして。"
"10042030-29-セナ" = "少なくとも……不良を救急車に投げ込むよりは、そそられる事案です。"
"10042030-30-チナツ" = "それで……どうするのですか？"
"10042030-31-セナ" = "そうですね……さしあたっては、痕跡を追いかけようかと。"
"10042030-32-ジュリ" = "だ、大丈夫でしょうか……？#nすでに一人、やられてしまいましたが……。"
"10042030-33-セナ" = "大丈夫です、そちらのほうが面白そうですし。"
"10042030-34-ジュリ" = "え……？"
"10042030-35-チナツ" = "面白い……？"
"10042030-36-セナ" = "はい、自分でも驚くほど。#n普段でしたら、事件を前に「面白い」なんて思うことはないのですが……。"
"10042030-37-セナ" = "今は形容できない何かが、私の心を惹きつけているのです。"
"10042030-38" = "[s3] \"イオリがあんな状態になってしまう事態だから……。\"\n[s4] \"対応策を練った方が良いんじゃないかな……？\""
"10042030-39-セナ" = "ご安心ください。#nこう見えて楽し……失礼、真面目に臨んでおりますから。"
"10042030-40-フウカ" = "（一体どこが……）"
"10042030-41-セナ" = "それでは、追跡を始めるとしましょう。#n先陣は私が。"
"10042030-42" = "[ns] \"……すごい光景だね。\""
"10042030-43-フウカ" = "廊下にもネバネバが落ちてる……。"
"10042030-44-チナツ" = "量が少し多くなってきたような気がします……。"
"10042030-45-セナ" = "チナツ、訂正を。#n少しではなく、明らかに増えています。"
"10042030-46-ジュリ" = "量が増えたらどうなるんですか！？"
"10042030-47-セナ" = "分かりません。#nそれを解明するために進んでいるのですから。"
"10042030-48-セナ" = "……ますます気になってきますね。"
"10042030-49-フウカ" = "楽しんでる場合じゃないと思うけど……。"
"10042030-50-フウカ" = "う、うう……。"
"10042030-51-フウカ" = "……こっちから声が！"
"10042030-52-セナ" = "なるほど。#n次の死体、それか手がかり……いえ、犠牲者でしょうか。"
"10042030-53-ジュリ" = "せ、セナさん！？#nちょっと待ってください！"
"10042030-54-粘液まみれのゲヘナの生徒" = "う、うう……。"
"10042030-55" = "[ns] \"だ、大丈夫？何があったの！？\""
"10042030-56-粘液まみれのゲヘナの生徒" = "あっちの教室から、変な音が聞こえて……。"
"10042030-57-粘液まみれのゲヘナの生徒" = "様子を見に行ったら……。"
"10042030-58" = "[ns5] \"それは……。\"\n[ns6] \"フラグだ……！\""
"10042030-59-ジュリ" = "先生は一体何のお話を……。"
"10042030-60-セナ" = "フラグとは、立てたら回収するのがお約束。#n定番中の定番――つまり、テンプレという意味です。"
"10042030-61-セナ" = "……この説明で、ご理解いただけたでしょうか。"
"10042030-62-フウカ" = "真面目にやってないってことは分かったわよ……。"
"10042030-63-チナツ" = "すみません。#n先輩は昔からこういうところがあって……。"
"10042030-64-セナ" = "この状況はイオリの時と似ていますね。#n違いがあるとすれば――"
"10042030-65-セナ" = "ネバネバの量が2倍に増えている点くらいでしょうか。"
"10042030-66-ジュリ" = "そ、そんなに！？"
"10042030-67-フウカ" = "ネバネバ、あっちに続いてるみたい。"
"10042030-68-セナ" = "教室のほうですね、行ってみましょう。"
"10042030-69-フウカ" = "こ、これは！？"
"10042030-70-チナツ" = "うわっ……。"
"10042030-71-セナ" = "ネバネバの強度が増しています。#n少なくとも、人を壁に貼りつけられる程度には。"
"10042030-72-セナ" = "もちろん――量も。"
"10042030-73-セナ" = "ひとつ確認したいのですが、アレの大きさはどのくらいでしたか？"
"10042030-74-ジュリ" = "え、えっと、普通のパンケーキサイズでした……。"
"10042030-75-セナ" = "なるほど。#nでは皆さん……。"
"10042030-76-セナ" = "この量のソースが、普通のパンケーキに使われていたと思いますか？"
"10042030-77" = "[s] \"使われてないだろうね。\""
"10042030-78-セナ" = "はい、先ほど廊下で見つけた死体……いえ、犠牲者に付着していたネバネバの量は、イオリの時よりも明らかに多くなっています。"
"10042030-79-セナ" = "つまり――"
"10042030-80-セナ" = "――アレは、成長しています。"
"10042030-81-ジュリ" = "！！！"
"10042030-82" = "[ns7] \"こんな短時間で……？\"\n[ns8] \"現実的に有り得ないんじゃ……？\""
"10042030-83-ジュリ" = "……お言葉ですが、先生。"
"10042030-84-セナ" = "そもそも、この状況そのものが非現実的だとは思いませんか？"
"10042030-85" = "[s9] \"そ、それは……。\"\n[s10] \"否定できない……。\""
"10042030-86-セナ" = "はい。#nこういう場面において、常識は通じません。"
"10042030-87-セナ" = "理に適うか否かの問題ではありません。"
"10042030-88-セナ" = "大切なのは、目の前で起きている事象を受け入れ……。"
"10042030-89-セナ" = "変化を興味深く……いえ、注意深く観察し、備えることです。"
"10042030-90-ジュリ" = "！！！"
"10042030-91-ジュリ" = "近くの教室からですね。#n急ぎましょう。"
"10042030-92" = "[ns] \"こ、これは……！？\""
"10042030-93-ジュリ" = "ど、どうして、こんなことに……。"
"10042030-94-ジュリ" = "ここまで来ると呆れを通り越して感心するわね……。"
"10042030-95-セナ" = "私の推測が正しければ、アレは人を襲う度に成長しています。"
"10042030-96-セナ" = "このまま放っておけば、ゲヘナ中が……。"
"10042030-97-セナ" = "某企業の工場があったアライグマシティのようになってしまうかもしれません。"
"10042030-98-ジュリ" = "アライグマシティ、ですか……？"
"10042030-99" = "[ns11] \"アライグマシティって……？\"\n[ns12] \"それって、もしかして……。\""
"10042030-100-セナ" = "……まさか、ご存じないのですか？"
"10042030-101-セナ" = "正体不明の実験で、化け物が蔓延するようになった――"
"10042030-102-セナ" = "――ゲームの都市を。"
"10042030-103-セナ" = "先生はご存知なのですね。"
"10042030-104-セナ" = "では、この先何が起こるのか――言わずとも分かるはずです。"
"10042030-105-セナ" = "お伝えするタイミングを逃していましたが……。"
"10042030-106-セナ" = "この現象について、以前小耳に挟んだことがあります。#nあのような個体の出現も、初めてではありません。"
"10042030-107-セナ" = "もちろん、ここまで興味深い……失礼、凄まじいものだとは想像もしませんでしたが。"
"10042030-108-ジュリ" = "し、知っていたんですか？#nあれを！？"
"10042030-109-セナ" = "私も今日までは、ただの怪談や噂の類だと思っていました。"
"10042030-110-セナ" = "巷で聞く「給食部には魔物が棲んでいる」――といったもののように。"
"10042030-111-フウカ" = "な、何の話！？#n根拠は！？"
"10042030-112-セナ" = "あくまで、ただの噂です。#n噂に根拠などありません。"
"10042030-113-セナ" = "とにかく、今のこの状況は――"
"10042030-114-セナ" = "普段より、遥かに恐ろしく、規模の大きい事態だと推測しています。"
"10042030-115-ジュリ" = "はいぃ！？"
"10042030-116" = "[ns13] \"大規模……！？\"\n[ns14] \"恐ろしい……！？\""
"10042030-117-セナ" = "はい。だからこそ、ここまで興味をそそられ――"
"10042030-118-セナ" = "――いえ、恐ろしい問題を見て見ぬふりなどできません。"
"10042030-119-ジュリ" = "そ、そんな……！"
"10042030-120-ジュリ" = "私のせいでゲヘナの皆さんが……！"
"10042030-121-セナ" = "……？#nいえ。そこまで深刻に考える必要はありませんよ。"
"10042030-122-セナ" = "皆さん、ソースの味が不味すぎて気を失っているだけですから。"
"10042030-123-セナ" = "この程度の事故など、2、3ヶ月に1回は起きていますので。"
"10042030-124-セナ" = "温泉開発部や他のテロ団体に比べれば、さしたる問題ではないかと。"
"10042030-125-ジュリ" = "そう言っていただけるとホッとしますが、それはそれで少し悲しいような……！？"
"10042030-126-チナツ" = "温泉開発部と比較されている時点で、かなりの一大事なんですが……。"
"10042030-127-チナツ" = "……はぁ。"
"10042030-128-チナツ" = "仕方ありません。#nこのカードは切りたくなかったのですが……。"
"10042030-129" = "[s15] \"何か方法でもあるの？\"\n[s16] \"切りたくなかった……？\""
"10042030-130-チナツ" = "ええ……ですが、流石に使うしかないかと。"
"10042030-131-チナツ" = "もし、この[ruby=パンデモニウム・ソサエティー]件が万魔殿の耳[/ruby]に入ってしまえば――"
"10042030-132-チナツ" = "さらなる問題に発展してしまいますので。"
"10042030-133" = "ゲヘナ学園・風紀委員会の教室"
"10042030-134-アコ" = "何でしょうか。#nいま、手が離せないので要件はなるべく手短に――"
"10042030-135-アコ" = "……はい？"
"10042030-136-アコ" = "それは、どういう……。"
