[translation]
"10042005-1" = "プロローグ;誰かの休日は誰かの平日"
"10042005-2" = "ゲヘナ学園・校庭"
"10042005-3-フウカ" = "……。"
"10042005-4-フウカ" = "信じられない！！"
"10042005-5-フウカ" = "給食部の仕事がお休みだなんて……！"
"10042005-6-フウカ" = "げ、現実だよね……？"
"10042005-7-フウカ" = "どうか夢じゃありませんように……！"
"10042005-8-フウカ" = "痛っ……やっぱ現実だ……。"
"10042005-9-フウカ" = "ついにお休みが……あ！先生に伝えないと。"
"10042005-10-フウカ" = "昨日、もしかしたら休みになるかもって送ったメッセージの返信、きてるかな……。"
"10042005-11-フウカ" = "ちょっと見てみよ……。"
"10042005-12-フウカ" = "「お休みおめでとう！」"
"10042005-13-フウカ" = "「今日一日くらいは、ゆっくり遊んでね」"
"10042005-14-フウカ" = "「やりたいことを目一杯楽しんでほしいな」"
"10042005-15-フウカ" = "……やっぱり先生は優しいな。"
"10042005-16-フウカ" = "でも、遊ぶっていっても何すれば良いんだろう……。"
"10042005-17-フウカ" = "……うーん。"
"10042005-18-フウカ" = "外に出てみたら何かあるかな？"
"10042005-19-フウカ" = "せっかくだから、普段行かないところに行ってみよう。"
"10042005-20-ジュリ" = "あれ？#n先輩、おはようございます！"
"10042005-21-フウカ" = "おはよう！聞いてジュリ、さっき先生からお休みおめでとうのメッセージをもらったの。"
"10042005-22-ジュリ" = "わぁ、本当ですか？#n良かったですね！"
"10042005-23-フウカ" = "あれ？ジュリってバイトとかしてたっけ？"
"10042005-24-ジュリ" = "実は、近くのカフェでウェイトレスをすることになったんです。"
"10042005-25-フウカ" = "せっかくのお休みの日に……？"
"10042005-26-フウカ" = "ジュリも休んだほうがいいと思うけど……？"
"10042005-27-ジュリ" = "気にしないでください、先輩。#n私、このお仕事が楽しいんです。"
"10042005-28-ジュリ" = "お料理がダメな私でも、料理を提供することで自分が作ったものを味わっていただけてる気持ちになれて……。"
"10042005-29-ジュリ" = "私、とても幸せなんです！"
"10042005-30-フウカ" = "ジュリ……。"
"10042005-31-フウカ" = "そっか……じゃあ、応援してるね。"
"10042005-32-ジュリ" = "ありがとうございます！#nところで、先輩はどちらに？"
"10042005-33-フウカ" = "うーん、行き先は特に決まってないの。"
"10042005-34-フウカ" = "とりあえず外に出てみた感じ。こういう日ってあんまりないし……。"
"10042005-35-フウカ" = "行き先の候補はたくさんあるんだけどね。#nショッピングモール、スタジアム、美術館……あ、カラオケとかもいいかも！"
"10042005-36-フウカ" = "まぁ、全部周ることはできないんだけど。"
"10042005-37-フウカ" = "時間の許す限り、色々行ってみるつもり。"
"10042005-38-ジュリ" = "なるほど……。"
"10042005-39-ジュリ" = "（たしかに、フウカ先輩が休んでいるところ、見たことありません……）"
"10042005-40-ジュリ" = "今日が最高の休日になるよう、陰ながら応援していますね！"
"10042005-41-フウカ" = "うん、ジュリもバイト頑張ってね。"
"10042005-42-ジュリ" = "はい！いってらっしゃい、先輩！"
"10042005-43-フウカ" = "いってきます！"
"10042005-44-ジュリ" = "私もそろそろ行かないと。#n今日は、絶対に先輩を頼らないようにしなきゃ。"
"10042005-45-ジュリ" = "何が起きようと必ず自分で解決してみせます！#n見ていてくださいね、フウカ先輩！"
"10042005-46" = "ゲヘナ近郊のパンケーキカフェ"
"10042005-47-ゲヘナの生徒B" = "イチゴパンケーキひとつ。#nあっ、バタートッピングで！"
"10042005-48-ジュリ" = "はい、ご注文承りました！"
"10042005-49-ゲヘナの生徒B" = "私はチョコパンケーキにコーヒークリームトッピングで。"
"10042005-50-ジュリ" = "かしこまりました。#nお飲み物はどうされますか？"
"10042005-51-ゲヘナの生徒B" = "うーん……大丈夫かな？"
"10042005-52-ゲヘナの生徒B" = "えー、ドリンクセットにしない？"
"10042005-53-ジュリ" = "（ここはマニュアル通りに……）"
"10042005-54-ジュリ" = "パンケーキはとても甘く、量が多いので――"
"10042005-55-ジュリ" = "紅茶かコーヒーをお供にすれば、さらに美味しく召し上がれるのですが……#nよろしければいかがでしょう？"
"10042005-56-ゲヘナの生徒B" = "うーん……じゃあ、頼んでみる？"
"10042005-57-ゲヘナの生徒B" = "良いんじゃない？#n別の味挟んだほうが美味しくなりそうだし。"
"10042005-58-ゲヘナの生徒B" = "それじゃあ、私は紅茶で。"
"10042005-59-ゲヘナの生徒B" = "私はアイスコーヒー！"
"10042005-60-ジュリ" = "はい、かしこまりました。#nまた、当店では期間限定パフェもご用意しております。"
"10042005-61-ゲヘナの生徒B" = "パフェ……。"
"10042005-62-ジュリ" = "美味しいですよ。#n私もプライベートでよく注文するんです。"
"10042005-63-ゲヘナの生徒B" = "じゃあ頼んじゃおうよ！#n2つお願いします！"
"10042005-64-ジュリ" = "かしこまりました、少々お待ちください！"
"10042005-65-店長" = "良い接客だったよ。ありがとう。"
"10042005-66-ジュリ" = "本当ですか？#nありがとうございます、えへへ……。"
"10042005-67-店長" = "ああ。臨時じゃなくてメインスタッフとして働いてほしいくらいだよ。"
"10042005-68-ジュリ" = "お、お気持ちは嬉しいのですが、私には給食部のお仕事もありますので……。"
"10042005-69-店長" = "そうだよなぁ……いやぁ噂には聞いたことあったけど、ゲヘナの給食部はすごいんだね。"
"10042005-70-ジュリ" = "そ、そんなに、ですか……？"
"10042005-71-店長" = "あの人数の給食を毎日……しかも丁寧に作ってるんだろう？#nそれにこの接客能力……惜しいなぁ。"
"10042005-72-ジュリ" = "あ、ありがとうございます！#nそんな風に伝わっているなんて……恐縮です。"
"10042005-73-店長" = "たまに変なモンスターが出ることもあるって聞いたけど……#n流石にデマだよな？"
"10042005-74-ジュリ" = "は、はい！#nも、もも、もちろんです！"
"10042005-75-店長" = "まぁ、午後もよろしく頼むよ。#nおかげで今日の売上も順調だ！"
"10042005-76-店長" = "このままいけば――"
"10042005-77-ジュリ" = "！？"
"10042005-78-店長" = "！？"
"10042005-79-店長" = "一体何が！？"
"10042005-80-店長" = "倉庫からだ……！"
"10042005-81" = "カフェの倉庫"
"10042005-82-ジュリ" = "み、皆さん大丈夫ですか！？"
"10042005-83-ジュリ" = "う、うぅ……。"
"10042005-84-ジュリ" = "ブリュレ用のバーナーの新しいヤツ、火が出るか試したら……。"
"10042005-85" = "……うっ。"
"10042005-86-ジュリ" = "気絶してしまいました！"
"10042005-87-店長" = "こ、こりゃあ大変だ！"
"10042005-88-店長" = "どうしてバーナーで爆発が！？"
"10042005-89-店長" = "やば……さっき火薬こぼしちゃったんだよね。"
"10042005-90-店長" = "はぁ！？危ないだろう！"
"10042005-91-店長" = "やっぱ掃除しなきゃダメ？"
"10042005-92-店長" = "当たり前だろ！！"
"10042005-93-店長" = "あははっ、ごめんなさ～い。"
"10042005-94-店長" = "まったく……ジュリさんを見習ってほしいよ……。"
"10042005-95-ジュリ" = "あ、あはは……。"
"10042005-96-ジュリ" = "（調理師さんが動けない以上、どうすれば……）"
"10042005-97-待つ客A" = "すいませ～ん！#n注文したパンケーキ、まだですか～？"
"10042005-98-待つ客B" = "グレープフルーツジュースって、こんなに時間かかるっけ……？"
"10042005-99-待つ客A" = "いくら混んでるからって、遅くない……？"
"10042005-100-待つ客B" = "ほんと……。#n口コミ見て来たのに、ガッカリ。"
"10042005-101-ジュリ" = "て、店長！#nお客様から不満の声が……！"
"10042005-102-店長" = "ど、どうすれば……。"
"10042005-103-店長" = "ジュリさん、すまない……臨時手当を出すから――"
"10042005-104-店長" = "頼む、パンケーキを作ってくれ！"
"10042005-105-ジュリ" = "はい！？"
"10042005-106-ジュリ" = "（……私が、パンケーキを！？）"
"10042005-107-ジュリ" = "ご、ごめんなさい……！"
"10042005-108-ジュリ" = "私、料理ができないんです！"
"10042005-109-ジュリ" = "どういうことだ？#nジュリさんは給食部なんだろう？"
"10042005-110-ジュリ" = "……！"
"10042005-111-ジュリ" = "そう、ですが……。"
"10042005-112-店長" = "レシピは単純だ。#n生地もストックがあるから、後は焼くだけ。"
"10042005-113-店長" = "トッピングもそう多くない……頼む、この通り！"
"10042005-114-ジュリ" = "で、ですが……。"
"10042005-115-ジュリ" = "そういう問題では……。"
"10042005-116-店長" = "……無理を言ってすまなかったね。"
"10042005-117-店長" = "そうだ、代わりに部長さん呼んでもらえるかな？#n[ruby=あいきよ]愛清[/ruby]フウカさんだったか……？"
"10042005-118-ジュリ" = "えっ！？フウカ先輩を、ですか！？"
"10042005-119-店長" = "今日は給食部が休みだからシフトに入ってくれてるんだろう？"
"10042005-120-店長" = "なら、彼女も休みだと思っているのだが……。"
"10042005-121-店長" = "時給は通常の2倍……いや3倍払うから、何とか力添えしてもらえないだろうか？"
"10042005-122-ジュリ" = "！！！！"
"10042005-123-ジュリ" = "（ここで、先輩を？）"
"10042005-124-フウカ" = "（ほとんどないお休みを……）"
"10042005-125-フウカ" = "（……邪魔するわけにはいきません）"
"10042005-126-フウカ" = "（先輩は、いつも給食部のために頑張ってくれてます……）"
"10042005-127-ジュリ" = "（だから、せめて今日だけでも……！）"
"10042005-128-店長" = "ジュリさんが言いづらいなら、私から連絡しても……。"
"10042005-129-ジュリ" = "店長、私がやりますっ！"
"10042005-130-店長" = "えっ……？"
"10042005-131-店長" = "もちろん、ジュリさんがやってくれるなら助かるが……。"
"10042005-132-店長" = "本当に大丈夫なのか……？"
"10042005-133-店長" = "え、えっと……フウカ先輩、今日はご予定があるので……。"
"10042005-134-ジュリ" = "ここは私が何とかします！"
"10042005-135-ジュリ" = "もしかしたら、私でも……！"
"10042005-136-店長" = "ただ焼くだけだよ……？"
"10042005-137-店長" = "まあ、お願いできるなら助かるよ。#nありがとう、ジュリさん。"
"10042005-138" = "カフェのキッチン"
"10042005-139-ジュリ" = "ふ、ふぅ……。"
"10042005-140-ジュリ" = "（正直、ちょっと怖いです……）"
"10042005-141-ジュリ" = "（いくら失敗しても練習なら問題ありませんでしたが……）"
"10042005-142-ジュリ" = "（今回はそうもいきません。私の料理が、お客様の口に……）"
"10042005-143-ジュリ" = "（いつか、ちゃんとした料理が作れるようになりたい気持ちはありますが……）"
"10042005-144-ジュリ" = "ねえ、パンケーキいつ来るの……？"
"10042005-145-ジュリ" = "食材は、すべて揃ってる……。"
"10042005-146-ジュリ" = "本当は……怖いです。"
"10042005-147-ジュリ" = "でも、先輩の邪魔をするわけにはいきません！"
"10042005-148-ジュリ" = "（お願いします）"
"10042005-149-ジュリ" = "（私の祈りを聞き届けてください）"
"10042005-150-ジュリ" = "（……今回限りで構いません）"
"10042005-151-ジュリ" = "（私を、助けてください……）"
"10042005-152-ジュリ" = "（先輩のお休みを、守れるように！）"
"10042005-153-ジュリ" = "う、[ruby=うしまき]牛牧[/ruby]ジュリ！"
"10042005-154-ジュリ" = "い、いきます！！！"
"10042005-155-ジュリ" = "あれ……？"
"10042005-156-ジュリ" = "意外と、悪くないような……？"
"10042005-157" = "#video;10042"
