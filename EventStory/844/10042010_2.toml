[translation]
"10042010-1" = "第1話;奇跡のような"
"10042010-2" = "カフェのキッチン"
"10042010-3-ジュリ" = "あれ……？"
"10042010-4-ジュリ" = "意外と、悪くないような……？"
"10042010-5-ジュリ" = "いえ、見た目だけの可能性もあります。"
"10042010-6-ジュリ" = "味見を……。"
"10042010-7-ジュリ" = "お、良くできてるね。#n急いでるから持ってくよ！"
"10042010-8-ジュリ" = "て、店長！？#nそれは……！"
"10042010-9-待ちに待った客A" = "やっときたよ～お腹ぺこぺこ。#nいただきまーす！"
"10042010-10-ジュリ" = "（だ、ダメ……！）"
"10042010-11-ジュリ" = "ん～♪やっぱ、ここのパンケーキ美味しい！"
"10042010-12-ジュリ" = "一口ちょうだい！"
"10042010-13-ジュリ" = "ちょっ、一口じゃなくない！？#nそれ半分っていうんだけど！？"
"10042010-14-ジュリ" = "美味しそうだったから、つい♪#nごめんごめん。"
"10042010-15-ジュリ" = "あれ……？"
"10042010-16-ジュリ" = "（美味しい……？私の料理が？）"
"10042010-17-ジュリ" = "（これは、夢じゃないですよね……？）"
"10042010-18-ジュリ" = "痛っ！"
"10042010-19-ジュリ" = "（……げ、現実？）"
"10042010-20-ジュリ" = "お客さんの反応を見にきたのかい？"
"10042010-21-店長" = "分かるよ。自分が作った料理を美味しそうに食べてくれる姿を見てると、こっちまで幸せをもらえるからね。"
"10042010-22-店長" = "ゆっくり見ていってと言いたいところだけど、追加注文が届いてるんだ。#nキッチンの方をお願いしてもいいかな？"
"10042010-23-ジュリ" = "え……？"
"10042010-24-ジュリ" = "は、はい！頑張ります！"
"10042010-25-ジュリ" = "追加注文がこんなに……。"
"10042010-26-ジュリ" = "か、感心してる場合じゃありません！#n早く手を動かさないと！"
"10042010-27-ジュリ" = "パンケーキ、上がりました！"
"10042010-28-ジュリ" = "こちら、提供お願いします！"
"10042010-29-店長" = "ありがとう、ジュリさん！このまま頼むよ！"
"10042010-30-ジュリ" = "1番テーブルさん、提供お願いします！"
"10042010-31-ジュリ" = "3番テーブルさん、お待たせしました！"
"10042010-32-ジュリ" = "あれ……？今、何かいたような……？"
"10042010-33-ジュリ" = "き、気のせいですよね……？"
"10042010-34-ジュリ" = "それにしても……#nちゃんとした料理が作れるなんて……幸せです！"
"10042010-35-ジュリ" = "きゃあああぁぁぁぁっ！？"
"10042010-36-ジュリ" = "え？"
"10042010-37-ジュリ" = "ひ、悲鳴……？"
"10042010-38-ゲヘナの生徒A" = "な、な、なにこれ！？"
"10042010-39-ゲヘナの生徒A" = "くねくね動いてる……！"
"10042010-40-ゲヘナの生徒A" = "うっ、服に変なのついちゃった！#n気持ち悪っ！"
"10042010-41-ゲヘナの生徒B" = "は、早く逃げなきゃ！"
"10042010-42-驚いた客" = "なにあれ！！#nひいぃぃっ！？こ、こっち来ないで！！"
"10042010-43-ショックを受けた客" = "た、助けてぇっ！#nわ、私なんか食べても、美味しくないんだからっ！"
"10042010-44-ショックを受けた客" = "な、なんだよこいつ！あ、あっち行けっ！"
"10042010-45-驚いた客" = "ちょ、ちょっと！"
"10042010-46-ジュリ" = "お、お客様を襲っちゃダメです！"
"10042010-47-不運な客" = "うわあぁっ！？！？"
"10042010-48-ジュリ" = "お、お客様！？"
"10042010-49-店長" = "じゅ、ジュリさん！？大丈夫？怪我は？"
"10042010-50-店長" = "アレは一体なんなんだ……！？"
"10042010-51-ジュリ" = "は、はい、大丈夫です。#nあれは……その――"
"10042010-52-店長" = "逃げた！"
"10042010-53-ジュリ" = "ど、どうしましょう！#nカフェの評判が……！"
"10042010-54-店長" = "うちの評判以前に、一体アレはなんなんだ……？"
"10042010-55-ジュリ" = "……電話？"
"10042010-56-ジュリ" = "……先生！？"
"10042010-57-ジュリ" = "も、もしもし……？"
"10042010-58" = "[s] \"おはよう、ジュリ。バイトの調子はどう？\""
"10042010-59-ジュリ" = "そ、それが……。"
"10042010-60" = "[s1] \"……何かあったの？\"\n[s2] \"忙しいならまた掛け直すね……。\""
"10042010-61-ジュリ" = "え、えっとですね……！"
"10042010-62-ジュリ" = "キャーッ！！#nパンケーキが動いてる！！！"
"10042010-63-ジュリ" = "に、逃げた！？"
"10042010-64-フウカ" = "ジュリ！？#n今の声は……！？"
"10042010-65-ジュリ" = "せ、先輩！？#n今、先生と一緒なんですか？"
"10042010-66-フウカ" = "あ、うん……ちょうど先生から連絡をもらって……。"
"10042010-67" = "[s3] \"状況は大体分かった。\"\n[s4] \"とりあえず、私たちもそっちに向かうね！\""
"10042010-68-ジュリ" = "で、でも、せっかくのお休みの日に……！"
"10042010-69-フウカ" = "大丈夫、気にする必要ないわ。"
"10042010-70-フウカ" = "困ってる後輩を助けるのは当然だもの。"
"10042010-71-フウカ" = "気を遣ってくれてありがとうね。"
"10042010-72-フウカ" = "でも、今はそれよりも事態を収拾しなきゃ。"
"10042010-73-ジュリ" = "は、はい……。"
"10042010-74" = "[ns] （こういう時は……）"
"10042010-75" = "ゲヘナ学園・風紀委員会の教室"
"10042010-76-イオリ" = "ん？"
"10042010-77-イオリ" = "って、この番号は……。"
"10042010-78-イオリ" = "先生？"
"10042010-79" = "[s] \"イオリ、いま大丈夫？\""
"10042010-80-イオリ" = "……急にどうしたんだ？"
"10042010-81" = "[s5] \"イオリに手伝ってもらいたくて。\"\n[s6] \"ちょっとこっちに来てくれる？\""
"10042010-82-イオリ" = "急に何……？#n面倒事でも起きたの？"
"10042010-83" = "[s7] \"流石イオリ！話が早くて助かるよ！\"\n[s8] \"そうとも言えるかな。\""
"10042010-84-イオリ" = "はあ、分かった……。"
"10042010-85-チナツ" = "……先生からですか？"
"10042010-86-イオリ" = "うん。ちょっと来てほしいって。"
"10042010-87-チナツ" = "何かあったのでしょうか……。"
"10042010-88-イオリ" = "さあ？詳しくは知らないけど、どうせくだらないことだよ。"
"10042010-89-イオリ" = "[ruby=ゲヘナ]ここ[/ruby]ではモンスターでも現れない限り、大したことないわけだし。"
"10042010-90-チナツ" = "たしかにそうですね。とりあえず、現場に行ってから考えましょうか。"
"10042010-91-イオリ" = "うん、行こう！"
