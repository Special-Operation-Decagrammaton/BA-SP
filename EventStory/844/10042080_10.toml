[translation]
"10042080-1" = "第8話;結実"
"10042080-2-チナツ" = "……。"
"10042080-3-フウカ" = "……やった？"
"10042080-4-セナ" = "そのセリフは、少しマズいですね……。"
"10042080-5-イオリ" = "私が様子を見てくる！"
"10042080-6-イオリ" = "先生はそこで待機してて！"
"10042080-7-チナツ" = "どうぞ、私の後ろへ！"
"10042080-8-ジュリ" = "う、うぅ……。"
"10042080-9-ジュリ" = "給食部員を一人発見！#n次は……。"
"10042080-10-アコ" = "……。"
"10042080-11-イオリ" = "ネバネバまみれになって気絶したアコちゃんを発見。#nそれと……。"
"10042080-12-イオリ" = "さっきまで、あんなに大きかったのに……。"
"10042080-13-イオリ" = "元の大きさに戻った個体を発見。"
"10042080-14" = "[ns] \"イオリ、それ危ないんじゃ！？\""
"10042080-15-イオリ" = "大丈夫、もう動きは止まってるし。"
"10042080-16-イオリ" = "たぶん……気絶してる。"
"10042080-17-アコ" = "……。"
"10042080-18-イオリ" = "……。"
"10042080-19-アコ" = "あ、アコちゃん？#nその……。"
"10042080-20-アコ" = "なにも言わないでください！#nあんな醜態を晒すなんて……！"
"10042080-21-イオリ" = "わ、分かったよ。"
"10042080-22-イオリ" = "よくも……よくもやってくれましたね！"
"10042080-23-アコ" = "巻きついた挙げ句、ネバネバをかけて……うぇえ……まだ口の中気持ち悪い。"
"10042080-24-アコ" = "あ、あんなものに汚されてしまうなんて……もう、私……。"
"10042080-25" = "[s1] \"あ、アコ？大丈夫……？\"\n[s2] \"あれはただのパンケーキソースだから……。\""
"10042080-26-アコ" = "先生は黙っていてくださいっ！"
"10042080-27-アコ" = "アレに復讐しなければ――"
"10042080-28-イオリ" = "アコちゃん、危ない！"
"10042080-29-アコ" = "――んうっ！？！？"
"10042080-30-アコ" = "んうぅっ！？！？んぬぅーっ！？"
"10042080-31" = "[ns3] \"うわっ！アコの顔に飛びかかった……！\"\n[ns4] \"イオリの時と同じ……！？\""
"10042080-32-イオリ" = "うっ、なんだかデジャブ……。"
"10042080-33-イオリ" = "……あのソース、味が最悪だったんだよな。"
"10042080-34-フウカ" = "大人しくなった……？"
"10042080-35-ジュリ" = "パンちゃん……。"
"10042080-36-ジュリ" = "今まで色んなことがありましたね……。"
"10042080-37-ジュリ" = "私のミスで皆さんに迷惑をかけて、どうすれば良いか悩んでいましたが……。"
"10042080-38-ジュリ" = "パンちゃんが無事元の姿に戻って、良かったです！"
"10042080-39-フウカ" = "……うん、そうだね。"
"10042080-40-フウカ" = "じゃあ……。"
"10042080-41-ジュリ" = "ああっ！？"
"10042080-42" = "[ns5] \"フウカがパンちゃんを……！\"\n[ns6] \"ゴミ箱に捨てた！？\""
"10042080-43-フウカ" = "地面を駆けずり回った食べ物なんて不衛生だからね。#n廃棄しないと。"
"10042080-44-ジュリ" = "そ、それは……そうですが！"
"10042080-45-セナ" = "なるほど、正論ですね。"
"10042080-46-ヒナ" = "…………。"
"10042080-47-チナツ" = "これで……すべて終わったんですよね？"
"10042080-48-イオリ" = "……たぶん。"
"10042080-49-イオリ" = "はぁ、もうコリゴリだよ……。"
"10042080-50" = "[ns] \"すごい一日だったね……。\""
"10042080-51-アコ" = "これで、終わり……！？#nいえ、私は絶対に許しません！！！"
"10042080-52-イオリ" = "アコちゃん、復活したの？"
"10042080-53-アコ" = "一度も死んでませんけど！？#nそれで、パンちゃんというのはどちらに！？"
"10042080-54-ジュリ" = "あ……パンちゃんでしたら、ゴミ箱に。#nもう完全に動かなくなりました。"
"10042080-55-アコ" = "……。"
"10042080-56-アコ" = "ま、まあ、それなら良いのですが……。"
"10042080-57-アコ" = "……この鬱憤を、一体どう晴らせば？"
"10042080-58" = "[s7] \"アコ、ソースで服が……。\"\n[s8] \"まずは、シャワーを浴びようか……？\""
"10042080-59-アコ" = "！！！！！"
"10042080-60-アコ" = "あぁ、もう！最悪ですっ！！！！"
"10042080-61" = "[log]こうして、ゲヘナ学園を賑わせたパンちゃん事件は、数々の騒動を巻き起こした後、終息した。[/log]"
"10042080-62" = "[log]……ゲヘナ生の間では「些細なハプニング」と呼ばれたり、呼ばれなかったりするらしい。[/log]"
"10042080-63" = "[log]数日後[/log]"
"10042080-64" = "ゲヘナ学園・厨房"
"10042080-65-フウカ" = "ジュリ、玉ねぎは？"
"10042080-66-ジュリ" = "はい！こちらに！"
"10042080-67-フウカ" = "ありがとう！#n炒めている間に、ジャガイモとニンジンもお願い！"
"10042080-68-ジュリ" = "ジャガイモは水にさらしてアク抜きもしますか？"
"10042080-69-フウカ" = "うん、お願い！#n今日のメニューは肉じゃがだからね！"
"10042080-70" = "ゲヘナ学園・学生食堂"
"10042080-71-ゲヘナの生徒A" = "この肉じゃが、なんか味薄くない？"
"10042080-72-ゲヘナの生徒B" = "牛だと思ってたのに、豚かぁ……。"
"10042080-73-ゲヘナの生徒A" = "私、しらたき入ってるの好きなのになぁ……。"
"10042080-74-ゲヘナの生徒B" = "漬物、もっとないの？#n少ないんだけど。"
"10042080-75-ハルナ" = "今日のランチは「肉じゃが」なのですね。"
"10042080-76-ハルナ" = "肉じゃがには様々な家庭の流派が存在するもの。#n肉は何を使っているのか、しらたきやサツマイモは入れるのか――"
"10042080-77-ハルナ" = "さあ、フウカさんの流派を――拝見するとしましょう。"
"10042080-78-フウカ" = "ちょっ、何でハルナまでいるのよー！！！"
"10042080-79-フウカ" = "はぁ、今日もなんとか乗り切った……。"
"10042080-80-ジュリ" = "お疲れ様でした、先輩。"
"10042080-81-フウカ" = "本当に、いつも大変だよね。#n手間がかかる割に時間が全然足りなくて……。"
"10042080-82-フウカ" = "どれだけ頑張ってもみんな分かってくれないし……！"
"10042080-83-ジュリ" = "ごめんなさい、先輩。#n私がもっとお役に立てていれば……。"
"10042080-84-フウカ" = "ううん、そんなことないよ。#nジュリがいてくれてるから成り立ってるんだよ。"
"10042080-85-フウカ" = "……私一人じゃ、給食部の運営なんて無理。"
"10042080-86-ジュリ" = "そう言っていただけると嬉しいのですが……戦力外通告みたいで少し悲しいです。"
"10042080-87" = "[ns] \"ジュリ、フウカ！お疲れ様！\""
"10042080-88-フウカ" = "あ、先生！"
"10042080-89-ジュリ" = "先生、それは……？"
"10042080-90-フウカ" = "ジュースの差し入れ、ですか？"
"10042080-91-フウカ" = "……ありがとうございます、嬉しいです。"
"10042080-92-ジュリ" = "あ、私コップを持ってきますね！"
"10042080-93-フウカ" = "ジュリ、一緒に食べるお菓子でも……。"
"10042080-94-ジュリ" = "……。"
"10042080-95-ジュリ" = "あの……先輩、先生。"
"10042080-96-ジュリ" = "その……お菓子なら、私が用意したものがありまして……。"
"10042080-97-ジュリ" = "あっ！も、もちろん、全然断っても大丈夫です！#n怖かったり不安だったりするでしょうから……。"
"10042080-98-フウカ" = "ジュリが用意したもの？"
"10042080-99-フウカ" = "……。"
"10042080-100-フウカ" = "そう言われると気になるんだけど、見せてもらえる？"
"10042080-101" = "[s] \"見てみたいな！\""
"10042080-102-ジュリ" = "うう……本当にいいんですか？"
"10042080-103-ジュリ" = "……少々お待ちください！"
"10042080-104-フウカ" = "わあ！すごく美味しそう！"
"10042080-105" = "[ns] \"これ、ジュリが作ったの？\""
"10042080-106-ジュリ" = "えへへ……はい。#nあの後、カフェで色々教わって……。"
"10042080-107-ジュリ" = "たくさん練習して、ついに完成させたんです。"
"10042080-108-ジュリ" = "よろしければ……食べてくださりますか？"
"10042080-109-フウカ" = "……。"
"10042080-110-フウカ" = "先生？"
"10042080-111" = "[s] \"うん、一緒に食べよう！\""
"10042080-112-フウカ" = "ほら、ジュリも。"
"10042080-113-ジュリ" = "あ、ありがとうございます！"
"10042080-114-ジュリ" = "本当に、嬉しいです……。"
"10042080-115" = "（その後、みんなで一緒にジュリのパンケーキを食べた）"
"10042080-116" = "（普通のパンケーキと少し違う味だったけど……）"
"10042080-117" = "（そこには、ジュリの真心と……）"
"10042080-118" = "（たしかな「愛情」が込められていた）"
"10042080-119" = "パンデミック・ハザード～奇跡の一枚～"
