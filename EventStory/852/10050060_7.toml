[translation]
"10050060-1" = "第6話;誰もいない場所"
"10050060-2-マシロ" = "皆さんお揃いでしょうか？"
"10050060-3-正義実現委員会部員B" = "は、はいっ！"
"10050060-4-マシロ" = "皆さんご存じとは思いますが、トリニティでじわじわ広がっている非公認図書の追跡任務を進行中です。"
"10050060-5-マシロ" = "が、数日が経過した今もなお、これといった進捗がありません。"
"10050060-6-正義実現委員会部員B" = "はい……。"
"10050060-7-マシロ" = "そして先日、ナギサ様から懸念の言葉を頂きました。"
"10050060-8-正義実現委員会部員B" = "な、ナギサ様が直々に……！？"
"10050060-9-マシロ" = "はい……これが私一人の問題なら、甘んじて受け入れたことでしょう。"
"10050060-10-マシロ" = "しかしもしこれが、我々の「正義を実現しようとする意志」の問題なら……。"
"10050060-11-マシロ" = "「トリニティの正義」そのものの根本的な問題ならば！"
"10050060-12-マシロ" = "当然我々は、存在価値を証明すべきだと思いませんか！？"
"10050060-13-正義実現委員会部員B" = "は、はいっ！！"
"10050060-14-正義実現委員会部員A" = "あの……ところで、何をどうしたら……。"
"10050060-15-マシロ" = "一つ考えがあります。"
"10050060-16-マシロ" = "他の方も思いついたかもしれませんが、現状を見た感じ、他に方法はないでしょう。"
"10050060-17-マシロ" = "難題にぶつかった時には、奇策より上策を講じろと言いますよね……よって。"
"10050060-18-マシロ" = "正義実現委員会のあらゆるヒューマンリソースを、トリニティ全域へと広げます！"
"10050060-19-正義実現委員会部員A" = "い……いつから、ですか？"
"10050060-20-マシロ" = "今！この瞬間からです！みなさん、無理なお願いというのは分かっています。でもあと少しだけ、もう少しだけ頑張ってもらえませんか？"
"10050060-21-マシロ" = "私も、先頭に立って現場に行って参ります！"
"10050060-22-正義実現委員会部員B" = "ま、待ってくださいマシロさん～～！"
"10050060-23-タカネ" = "……今日は1冊も売れませんでしたわ。"
"10050060-24-ヤクモ" = "というか、売り場さえ確保できませんでしたね……。"
"10050060-25-ヤクモ" = "正義実現委員会、でしたでしょうか？あの黒い制服を着た方々。今日はやけによく見ますねぇ。"
"10050060-26-ヤクモ" = "んん……レッドウィンターを生き抜いたスキルの一つ、出版部部長の危険センサーが強く反応しています。"
"10050060-27-タカネ" = "も、もしかして本当に感付かれたのでは！？"
"10050060-28-トリニティの生徒" = "タカネ姫！あと侍女の方も！こちらにいらしたんですね！"
"10050060-29-ヤクモ" = "……！え、ええ……！ごきげんよう。"
"10050060-30-ヤクモ" = "……私はいつから侍女に？"
"10050060-31-トリニティの生徒" = "こんにちは。状況的に駆け足で説明することをお許しください。"
"10050060-32-タカネ" = "か、構いませんわ。どうかされたのです？"
"10050060-33-トリニティの生徒" = "ええ……結論から言いますと、正義実現委員会が、お二人を探しております。"
"10050060-34-タカネ" = "……やはりそうでしたか。今日はやけに見回りの方がいると思っていましたわ。"
"10050060-35-トリニティの生徒" = "ええ。そういうことです……#nそのせいかトリニティ全体で不穏な雰囲気が……。"
"10050060-36-タカネ" = "そんな……私たちのせいですわ……まさかこんなことになるなんて、本当に申し訳ございません。"
"10050060-37-トリニティの生徒" = "い、いえ！思い返せば、そうでもなかったかも……というか、タカネ姫に非はありませんから！"
"10050060-38-トリニティの生徒" = "……ただ、教科書以外の本をすべて回収しようとしているみたいです。"
"10050060-39-トリニティの生徒" = "申し訳ありませんが、タカネ姫……これ以上お力になるのは難しそうです。"
"10050060-40-タカネ" = "いいえ、ここまで助けていただいたのですから本当になんとお礼を申し上げるべきか……。"
"10050060-41-トリニティの生徒" = "可哀想なタカネ姫……ここでも苦難を強いられるなんて……ぐすっ……。"
"10050060-42-ヤクモ" = "誰か私のことも慰めてくれませんか？"
"10050060-43-トリニティの生徒" = "ともかく、正義実現委員会がいない場所に避難された方がいいかと。"
"10050060-44-ヤクモ" = "そんな場所があるのです？"
"10050060-45-トリニティの生徒" = "ごめんなさい、そこまでは私たちも……。"
"10050060-46-トリニティの生徒" = "ですが、外部の方にしか発見できないような、そんな場所があるのかもしれません。"
"10050060-47-トリニティの生徒" = "どうかお体に気をつけて。次はトリニティで素敵な思い出が作れますように。"
"10050060-48-タカネ" = "ありがとうございます。素敵な思い出はもうすでにたくさん頂きましたわ。"
"10050060-49-トリニティの生徒" = "とんでもないです、それではまたいつの日か！"
"10050060-50-ヤクモ" = "……どこで道を間違えたのでしょう。"
"10050060-51-タカネ" = "……最初からだったのでは？本当にこれでいいのですか部長！？"
"10050060-52-ヤクモ" = "正直なところ、私もよく分かりませんが……でも最後までいってみることが大事なのでは？"
"10050060-53-タカネ" = "時と場合によっては、最後までいかない方が大事かもしれませんわ。"
"10050060-54-ヤクモ" = "とにかくさっきの生徒さんが言ってくれたように、正義実現委員会のいない場所を探してみましょう。"
"10050060-55-ヤクモ" = "……まずは身を隠してから。"
"10050060-56-タカネ" = "うぅ……こういう時、先生がいれば……。"
"10050060-57-タカネ" = "部長、あちらが安全なのでは？"
"10050060-58-ヤクモ" = "ええ、たしかに見回りが少ない。"
"10050060-59-タカネ" = "というか、そもそも人気がないというか……。"
"10050060-60-ヤクモ" = "そちらの方が好都合でしょう。"
"10050060-61-ヤクモ" = "ここは……図書館？のようですね。"
"10050060-62-タカネ" = "図書館でも、なんだか雰囲気が違うような気がしますわ……。"
"10050060-63-タカネ" = "古い本が多いですが……状態が良いものばかりです。"
"10050060-64-タカネ" = "ということはおそらく、専門の管理人がいるはず……。"
"10050060-65-タカネ" = "あら……？"
"10050060-66-ヤクモ" = "タカネ？どうかしましたか？"
"10050060-67-ヤクモ" = "うわあああっ！？"
"10050060-68-ウイ" = "図書館では、静かに。"
"10050060-69-ウイ" = "はぁ……また外の人が……。"
"10050060-70-ウイ" = "……でもこの人たち、トリニティの人ではないような……？"
"10050060-71-ウイ" = "それに本のようなものをたくさん持ってるし……。"
"10050060-72-ウイ" = "えっと……事情はよく分からないし、理解したくもありませんが……。"
"10050060-73-ウイ" = "とにかく……出版関係の方々なんですね？"
"10050060-74-タカネ" = "え、ええ……騒ぎを起こしてしまい申し訳ありませんでした、[ruby=こぜき]古関[/ruby]ウイさん。"
"10050060-75-ウイ" = "いえ、分かってるならいいです……それにこちら側の方のようですし。"
"10050060-76-ウイ" = "何より……みんなのこと、大事にしているようだし……。"
"10050060-77-ヤクモ" = "「みんな」……？"
"10050060-78-ウイ" = "あ……失礼。本のことです。"
"10050060-79-タカネ" = "そういえばウイさんは、古書館を管理している、図書委員会の委員長とおっしゃいましたよね？"
"10050060-80-タカネ" = "トリニティの中央図書館はキヴォトス最大規模で、この世のあらゆる蔵書があると聞いたのですが……。"
"10050060-81-タカネ" = "そんな場所を間近で見られるなんて光栄ですわ。"
"10050060-82-ヤクモ" = "念願の場所に来られてよかったですねぇ。"
"10050060-83-ウイ" = "その噂は……少々、大げさな気がしますが……でも、できるだけたくさんの子たちを守りたいのは本当です……。"
"10050060-84-ヤクモ" = "なるほど、そうですか。では本を延滞する人たちを罰しようとして建物一つが消し飛んだという話も、でたらめなんですね？"
"10050060-85-ウイ" = "それは本当です。"
"10050060-86-ヤクモ" = "！？"
"10050060-87-ウイ" = "あの子たちを大事にできない人たちですから。むしろ優しいくらいだと思いますが。"
"10050060-88-ウイ" = "……とにかく、お二人の子の話は読ませてもらいました。"
"10050060-89-ウイ" = "……よかったと思います。個人的には好きですよ。"
"10050060-90-ヤクモ" = "えーっと、ちなみにあれは漫画ですが……。"
"10050060-91-ウイ" = "……それがどうかしましたか？漫画も本であることには変わりません。"
"10050060-92-タカネ" = "そ、それに一部のシーンとか表現とか、そのあたりがやや気になると言っていた方もいたり、と……。"
"10050060-93-ウイ" = "そうなんですね。まあ、外の人たちからするとそういうこともあるかもしれませんね。"
"10050060-94-ウイ" = "……普段本を読まない人に耐性がないだけと思いますが。"
"10050060-95-ウイ" = "さきほど、正義実現委員会が二人を追っていると言いましたよね？"
"10050060-96-タカネ" = "え、ええ……お恥ずかしながら。"
"10050060-97-ウイ" = "正義実現委員が独断で……。こんな些細な事に、あれほどの人を動かすことはないはず……。"
"10050060-98-ウイ" = "……。"
"10050060-99-ウイ" = "……ティーパーティーですね。"
"10050060-100-ヤクモ" = "！？それはまだ話してないはず、ですが……。"
"10050060-101-ウイ" = "そのくらいはまあ……。"
"10050060-102-ウイ" = "これだからお偉いさんは……この子たちの価値も分からないでしょうに。"
"10050060-103-ウイ" = "とにかく。しばらくここで過ごすといいです。"
"10050060-104-タカネ" = "そ、そんな、ご面倒をかけてしまっていいのです……？"
"10050060-105-ウイ" = "……[ruby=・]こ[/ruby][ruby=・]っ[/ruby][ruby=・]ち[/ruby][ruby=・]側[/ruby]の方々のようなので。でもあまり深く考えないでもらえると。長居されても困るといいますか……。"
"10050060-106-ヤクモ" = "いやぁ、助かりますよウイさん！ではしばらくお世話になりますね。"
"10050060-107-ウイ" = "あと、もう一つ。"
"10050060-108-ヤクモ" = "ん……？"
"10050060-109-ウイ" = "……3メートル距離を置くように。"
"10050060-110-タカネ" = "えっ……？"
"10050060-111-ウイ" = "難しいなら出ていっていただきます……。"
"10050060-112-ヤクモ" = "む……分かりました、それがここのルールなら致し方ない。"
"10050060-113-ウイ" = "ルールといいますか、厳密には私の問題ではありますが……。"
"10050060-114-タカネ" = "ん？今なにかおっしゃいましたか？ウイさん。"
"10050060-115-ウイ" = "……3メートル。"
"10050060-116-タカネ" = "は、はい……。"
"10050060-117-タカネ" = "部長、私たちこれでいいのでしょうか……？"
"10050060-118-ヤクモ" = "冷静に考えれば、よくないのでしょうねぇ……。"
"10050060-119-ヤクモ" = "ですが、何か試すことも許されない状況ですし。"
"10050060-120-タカネ" = "何かいい案はないのですか？"
"10050060-121-ヤクモ" = "とりあえずここに居ていいと言われたのですから、しばらくは身を潜めましょう。そしてほとぼりが冷めた頃、レッドウィンターに戻る、と。"
"10050060-122-ヤクモ" = "そんな目で見ないでくださいよ……私だってこれが一番じゃないことは分かっていますから。"
"10050060-123-ヤクモ" = "ですが人生には時折、一つしかない選択肢を取らなければならない時がありますよね？"
"10050060-124-ヤクモ" = "私は奥の方で少し休みますので、何かあれば言ってください。"
"10050060-125-タカネ" = "と、部長は言いましたが……。"
"10050060-126-タカネ" = "うぅ……こういう話ではなく、もっと褒められるような話をしたかったのに……。"
"10050060-127" = "[ns] \"あれ、この番号は……？\""
"10050060-128-タカネ" = "こ、こんにちは、先生。"
"10050060-129-タカネ" = "こ、こうして急にご連絡したのは、その……。"
"10050060-130-タカネ" = "うぅ……どこから話したらよいものか……。"
"10050060-131" = "[s] \"大丈夫。まず思いついたことから話してみて。\""
"10050060-132-タカネ" = "はい……まず私たちは、なりゆきでトリニティに来ており……。"
"10050060-133" = "[s] \"ん？奇遇だね、私もトリニティにいるよ。\""
"10050060-134-タカネ" = "えっ、先生も！！？"
