[translation]
"10050070-1" = "第7話;One Last Chance"
"10050070-2-ウイ" = "あ……先生、こんにちは。"
"10050070-3-ウイ" = "えっと、話はある程度聞いてます……どうぞ中へ。"
"10050070-4" = "[s] \"ごめんね、ウイ。\""
"10050070-5-ウイ" = "い、いえ……先生はここに来ても大丈夫なので……。"
"10050070-6-ウイ" = "というか先生と私と……あの二人を合わせたら……全部で4人？"
"10050070-7-ウイ" = "う、うう……古書館に4人は、多すぎるような……。"
"10050070-8" = "[s] \"な、なるべく静かにするから！\""
"10050070-9-ウイ" = "はい……それじゃ、こちらへ……。"
"10050070-10-ヤクモ" = "こ、こんにちは先生。本当にトリニティにいらしたのですね……。"
"10050070-11-ヤクモ" = "トリニティで先生を……それもこんな場所でお会いするとは。"
"10050070-12" = "[s1] \"緊急事態みたいだからすぐ本題に入るね。\"\n[s2] \"ヤクモ、どうしてこんな事をしたの？\""
"10050070-13-ヤクモ" = "うっ……雑談とか、アイスブレイクはなしですか……。"
"10050070-14-ヤクモ" = "分かりました、分かりましたよ……はぁ。"
"10050070-15-ヤクモ" = "要は、お金を稼ぐためです。"
"10050070-16-タカネ" = "正直すぎるのでは……。"
"10050070-17-ヤクモ" = "ですが本当のことですから……。"
"10050070-18-ヤクモ" = "……えっ？それだけじゃ納得ができない……？ビジネスマンらしくない？"
"10050070-19-ヤクモ" = "他の自治区で商売するのはリターンに対してリスクが大きすぎる……？"
"10050070-20" = "[s] \"ヤクモならそれくらい計算すると思ってた。\""
"10050070-21-ヤクモ" = "いやいやいや、私の能力はそんなたいしたものじゃありませんよ！？"
"10050070-22-ヤクモ" = "……ぐっ、そんな疑うような目をしなくても。"
"10050070-23-ヤクモ" = "……はぁ。"
"10050070-24-ヤクモ" = "分かりましたよ、はい。先生もすぐに答えが聞きたいようですし……。"
"10050070-25-ヤクモ" = "こんなにすぐに本題に入るのは、いささか慣れませんが……あっ、もしかしてこれが大人の会話術ってやつでしょうか。"
"10050070-26-ヤクモ" = "先生……「文化」は何をエサに大きくなると思いますか？"
"10050070-27" = "[s] \"ん……人々の興味と愛？\""
"10050070-28-ヤクモ" = "そうですか、なるほど……。"
"10050070-29-ヤクモ" = "それは、間違った考えですね。"
"10050070-30-ヤクモ" = "文化というのは……お金を食い物にして成長する生き物です。#n本質的に我々と変わりません。"
"10050070-31-ヤクモ" = "過激な発言、と思いましたか？しかし……これが現実なのです！"
"10050070-32-ヤクモ" = "文化媒体を享受するということは……言い換えれば、そこに自分の時間とは別の交換価値。つまりお金を消費するという話。"
"10050070-33-ヤクモ" = "……そして人々は消費行動に対価を求める。楽しさや笑顔、まあそういった類のものです。"
"10050070-34-ヤクモ" = "もしくは感動や教訓でも構いませんがね。"
"10050070-35-ヤクモ" = "先生。1日でどれだけの文章が書かれているか、考えてみたことありますか？"
"10050070-36-ヤクモ" = "良いものを書けば読んでもらえるはず、と思っている方も多いですが……そんなものは幻想です。"
"10050070-37-ヤクモ" = "なぜなら今この瞬間でさえ……あまりにもたくさんの文章や、情報が溢れています。"
"10050070-38-ヤクモ" = "「1日で」と言いましたが、実際は1時間――いいえ1分1秒単位でです。"
"10050070-39-ヤクモ" = "そのほとんどは忘れ去られ、無に帰る。"
"10050070-40-ヤクモ" = "それってなんだか……悲しくないですか。"
"10050070-41" = "[s] \"……。\""
"10050070-42-ヤクモ" = "せめて市場というリングに上がれたならまだいい方でしょう。"
"10050070-43-ヤクモ" = "ある人は「次はもっと頑張ろう」と思ったり、ある人は何か学びを得るはず。"
"10050070-44-ヤクモ" = "もしくは自分の目指す道はこれではなかった、と諦めたり。"
"10050070-45-ヤクモ" = "しかし大多数はリングにさえ上がれず……。"
"10050070-46-ヤクモ" = "トロフィーを手にしたチャンピオンを見て羨ましがるだけです。"
"10050070-47-ヤクモ" = "子供の頃を覚えてますか？子供たちは、いつだって自分ではない何かになりたがります。"
"10050070-48-ヤクモ" = "ああいうものを作りたい。自分を証明して認められたい……。"
"10050070-49-ヤクモ" = "まあ、子供に限った話ではありません。誰だってそう思うのは自然なこと。"
"10050070-50-ヤクモ" = "ですが夢だって、月日が経てば輝きを失ってしまうもの。"
"10050070-51-ヤクモ" = "夢がないというのも悲しいですが、いつまでも夢に囚われるのは悲劇です……だって。"
"10050070-52-ヤクモ" = "夢を見させるなら――"
"10050070-53-ヤクモ" = "――才能も与えるべきである、と。そう思いませんか？"
"10050070-54" = "[ns3] \"こういうこと言うのもなんだけど……。\"\n[ns4] \"まだ若いでしょ！？\""
"10050070-55-ヤクモ" = "……そうですねぇ。"
"10050070-56-ヤクモ" = "でもこう思わざるをえない子どもだって、どこかにいるはずです。"
"10050070-57-ヤクモ" = "とにかく。私はこれが言いたかったのです。"
"10050070-58-ヤクモ" = "自分の夢と向き合い、ぶつかったり前に進むためにも、一度リングに上がるべき、と。"
"10050070-59-ヤクモ" = "リングに上がるために、宣伝はあるものだ、と。"
"10050070-60-ヤクモ" = "戦うチャンスも得られずに、敗北宣言をされるんじゃあんまりです。"
"10050070-61-ヤクモ" = "だからお金は大事です。リングまでの道に繋がるのですから。"
"10050070-62-ヤクモ" = "文化はお金という土壌で育ち、誰かはその土壌を管理するべきです。"
"10050070-63-ヤクモ" = "まあそれで……今回の件が起きた、ってことですかね。"
"10050070-64" = "[ns5] \"でも、それだけお金が必要なら……。\"\n[ns6] \"出版じゃなく他のことじゃダメなの？\""
"10050070-65-ヤクモ" = "……えっ！？"
"10050070-66" = "[s7] \"お金になる仕事は他にもたくさんあるはず。\"\n[s8] \"流通や金融関連とかさ。\""
"10050070-67-ヤクモ" = "ぐふっ！？"
"10050070-68-ヤクモ" = "するどい……ご指摘……ですね。"
"10050070-69" = "[ns] \"言い過ぎちゃったかな。\""
"10050070-70-タカネ" = "い、いえ！ごもっともな指摘でしたわ先生！あの状態になった部長は、歯止めが利かないんですから！"
"10050070-71-タカネ" = "ただ……部長の言いたいことも分かります。"
"10050070-72-タカネ" = "先生のおっしゃる通りで……本当にただお金が必要なら、出版業をするはずありません。"
"10050070-73" = "[s] \"じゃあヤクモは……？\""
"10050070-74-タカネ" = "ふふっ。どうでしょうね？"
"10050070-75-タカネ" = "そして評論家の私が部長のところに居るのも……。ええ、お察しの通りです。"
"10050070-76-タカネ" = "結局は好きだからこの仕事をしているのです。"
"10050070-77-タカネ" = "稼ぎを得られて、宣伝までできればラッキー、ってわけで。"
"10050070-78-タカネ" = "わがままで欲張りで、こじれた人間と思うかもしれません。でも部長はそんなお方です。"
"10050070-79-タカネ" = "他の人の前じゃ絶対に認めようとしないと思いますが。"
"10050070-80-タカネ" = "だってあんな人です。才能だのリングだの言いながら……。"
"10050070-81-タカネ" = "なぜ自分のことを素直に打ち明けたのだと思いますか？"
"10050070-82-タカネ" = "チャンピオンを羨んだのも……才能がないと嘆きたいのも……。"
"10050070-83-タカネ" = "誰なのでしょうね？"
"10050070-84" = "[s] \"もしかしてその話は……。\""
"10050070-85-タカネ" = "ふふっ。語らないことで、完成に近づく物語もあるのですから。"
"10050070-86-ヤクモ" = "……変なこと言わないでください、タカネ。縁起でもない。売り上げに響いたらどうするつもりですか。"
"10050070-87-タカネ" = "はい、はい。分かりましたよ。"
"10050070-88" = "[ns9] \"二人の言いたいことは分かったよ。\"\n[ns10] \"でもやっぱり嘘をついてまでやるのは危険だと思う。\""
"10050070-89-タカネ" = "ん？嘘ってどういう……？"
"10050070-90" = "[s11] \"タカネが姫君だった、とか……。\"\n[s12] \"他にもいろいろあったでしょう？\""
"10050070-91-ヤクモ" = "ど、どうして先生がそれを……！もしかして、タカネ！？"
"10050070-92-タカネ" = "反省してください部長！あれはどうみてもやり過ぎだったでしょう？"
"10050070-93-タカネ" = "今だって恥ずかしくてしょうがないんですから……！"
"10050070-94" = "[s13] \"とにかく私からも言ってみるから。\"\n[s14] \"今回の件はここまでにしよう。\""
"10050070-95-ヤクモ" = "はぁい……。"
"10050070-96-コハル" = "た、たいへん！先生！正義実現委員会が……そっちに向かってる！"
