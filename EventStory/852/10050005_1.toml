[translation]
"10050005-1" = "プロローグ;No Risk, No Return."
"10050005-2" = "レッドウィンター連邦学園・図書館"
"10050005-3-モミジ" = "メル先輩、大丈夫ですか……？"
"10050005-4-メル" = "大丈夫そうに見える……？"
"10050005-5-モミジ" = "いえ……。"
"10050005-6-メル" = "……一つ分かったことがあるんだ。"
"10050005-7-モミジ" = "あまり聞きたくはないですが……何ですか？"
"10050005-8-メル" = "三日くらい何も食べてないと……逆にお腹って減らなくなるんだね。"
"10050005-9-モミジ" = "力も入りませんけどね……。"
"10050005-10-モミジ" = "それも多分今だけですよ。そのうち、食べ物のことしか考えられなくなるのでは？"
"10050005-11-メル" = "もうなってるしいいんじゃない……？"
"10050005-12-モミジ" = "なってるんじゃないですか……。"
"10050005-13-メル" = "それで……給食所の工事っていつ終わるの？"
"10050005-14-モミジ" = "一応明日、らしいですけど……。"
"10050005-15-メル" = "じゃあ明日にはご飯が食べられる……よかった……。"
"10050005-16-モミジ" = "昨日も同じこと言ってましたけどね……。"
"10050005-17-メル" = "……またストライキ？"
"10050005-18-モミジ" = "おそらく……。"
"10050005-19-メル" = "……あと1週間はかかりそうだね。"
"10050005-20-モミジ" = "私たちも、そろそろ何か行動しないといけないのでは……？"
"10050005-21-モミジ" = "みんな、血走った目で食べ物を探し始めましたし……。"
"10050005-22-メル" = "行動したからこうなったんでしょ？"
"10050005-23-メル" = "これも全部、本が売れないからだよ！"
"10050005-24-メル" = "あぅ……大声出しすぎた……。"
"10050005-25-モミジ" = "うぅ……事務局が部費を支給しないから……！"
"10050005-26-モミジ" = "本を売って捻出しようとしたけど全然……。"
"10050005-27-モミジ" = "このままでは知識解放戦線の未来は……。"
"10050005-28-モミジ" = "こうして文明は闇に埋もれ、人類は衰退の一途を辿るわけです……。"
"10050005-29-ヤクモ" = "知識解放戦線の皆さん、ご機嫌よう。#n出版部の責任者、[ruby=あらまき]荒槇[/ruby]ヤクモが参りましたよぉ。ムフフ。"
"10050005-30-タカネ" = "相変わらず品のないお姿ですこと、メルリーさん。#nいうまでもないかとは思いますが……図書館の床はベッドではありませんよ？起きてくださいな。"
"10050005-31-タカネ" = "はいはい……何とでも言って……。"
"10050005-32-タカネ" = "あら、メルリーさんがこんな素直に聞くなんて。#nどこか具合でも悪いのですか？本当に大丈夫です？"
"10050005-33-モミジ" = "大丈夫じゃないかもしれません……ヤクモ部長、タカネ先輩。"
"10050005-34-ヤクモ" = "ふむ……一体何があったんですか？"
"10050005-35-モミジ" = "えっと……その、すみません。#nなにか、食べ物はありませんか？"
"10050005-36-タカネ" = "……はい？"
"10050005-37-メル" = "うぎゃーーっ！！お腹痛いよぉ！！"
"10050005-38-タカネ" = "三日間何も食べてないのに一気に食べるからですよ。胃に負担がかかったのでしょう。#nはい、お水。"
"10050005-39-モミジ" = "ありがとうございます、ヤクモ部長、タカネ先輩……。#n一時はどうなることかと。"
"10050005-40-ヤクモ" = "どういたしまして。困った時にはお互い様ですから。#nもちろん代金はちゃんと請求しますけどね？ムフフ。"
"10050005-41-メル" = "ちょっと怖いんだけど……いやまぁ、死にかけのところを助けてくれたんだし、仕方ないか……。"
"10050005-42-モミジ" = "あなた方の状況が、部費の支給が遅れているせいだということは理解しました。#nそれにしては事態が少々深刻なようですが。"
"10050005-43-モミジ" = "えっと……色々と日程を前倒しにしてみたりしてもみたんですが……少々無理がたたってしまって……。"
"10050005-44-タカネ" = "ああ、先週急に持ってきた原稿の件ですね？#n印刷費を後払いで、とおっしゃっていたのはまさか……。"
"10050005-45-メル" = "あんなこと、しちゃいけなかった……。"
"10050005-46-ヤクモ" = "なるほど……まあでもそれは理由になりませんから。"
"10050005-47-ヤクモ" = "はい、とっとと印刷費を支払ってください。"
"10050005-48-メル" = "この状況を見てそれ言えるの！？この人でなし！#nそこらにあるもの何でも持ってけば！？"
"10050005-49-ヤクモ" = "おや、いいんですか？"
"10050005-50-メル" = "……本気？"
"10050005-51-ヤクモ" = "ええ。そしてちゃんと代金も頂きます。"
"10050005-52-メル" = "悪魔……！悪魔がいるよ！？"
"10050005-53-タカネ" = "しかしそれにしても妙ですね、メルリーさん。"
"10050005-54-タカネ" = "いくらあなたが好き勝手に描いていて、需要なんて気にも留めないとはいえ……。"
"10050005-55-メル" = "ねえちょっと、バカにしに来たの！？なんなの！？"
"10050005-56-タカネ" = "話は最後まで聞くものですわ。その分、コアなファンがいるということです。#nそれに優秀な編集者であるモミジさんがいるというのに、食費が賄えないほどだなんておかしいですわ。"
"10050005-57-モミジ" = "その、私たちも……ここまで部数が出ないとは思わなくて……。"
"10050005-58-ヤクモ" = "まだ在庫はありますか？少し拝見しても？"
"10050005-59-メル" = "ど、どう……？"
"10050005-60-タカネ" = "……ひとまず、原因は分かりました。"
"10050005-61-モミジ" = "な、なんでしょう……？"
"10050005-62-タカネ" = "メルリーさん。あなたの原稿は、基本的に傍若無人で、読み手よりも自分のことを優先している傾向が強いです。"
"10050005-63-タカネ" = "だからこそコアなファンがいるとも言えるのですが……#n大衆性はほとんどありません。"
"10050005-64-タカネ" = "で……これは何ですか！？メルリーさん特有の味が薄れ、半端に大衆性を取り入れましたね？#n何もかもが中途半端ですわ！"
"10050005-65-タカネ" = "これでは今まで読んでくれていたコアなファンも、大衆にも刺さりません！#n5段階評価として2点……いいえ、1.5点ですわ！"
"10050005-66-タカネ" = "で、一体何があったんですか？モミジさん。"
"10050005-67-モミジ" = "そ、その……今回は違う路線で行こう、って……今度こそ、一般ウケする作品を、と……。"
"10050005-68-モミジ" = "締切もかなり前倒しにしたので、メル先輩が暴走して……編集や添削の時間もあまり取れず……。"
"10050005-69-タカネ" = "ふむ……他にも問題がありそうですね。"
"10050005-70-メル" = "どういうこと……？"
"10050005-71-ヤクモ" = "我々出版部の目から見て――"
"10050005-72-ヤクモ" = "そのやり方には、異を唱えざるを得ない！"
"10050005-73-モミジ" = "ひっ！？"
"10050005-74-モミジ" = "ぐぁっ！？"
"10050005-75-ヤクモ" = "なんですかこれ、なにもかも中途半端な原稿ですし……というか、どこで新刊の告知してるんですか。"
"10050005-76-モミジ" = "そ、その、あんまり宣伝する時間がなくて……。"
"10050005-77-ヤクモ" = "甘えるんじゃないですよ！！いくらファンでも告知不足では足を運ぶわけないじゃないですかぁ！？"
"10050005-78-ヤクモ" = "やろうと思えばいくらでも手段はあったはずでしょう？"
"10050005-79-メル" = "い、いい作品は自然とファンが見つけてくれるものだから！"
"10050005-80-ヤクモ" = "あまったれてんじゃないですよっ！そもそも、マーケティングという概念が存在する理由はお分かりで？"
"10050005-81-ヤクモ" = "物の出来はよくても、宣伝がめちゃくちゃだったせいで倉庫行きになった商品がいくつあると？#nいや正確には私も知りませんけども！"
"10050005-82-ヤクモ" = "少なくとも、知識解放戦線の図書館分程度はあるでしょう！"
"10050005-83-メル" = "盛ってない！？"
"10050005-84-ヤクモ" = "いえ、これでも規模を少なく見積もってる方ですよ……。"
"10050005-85-ヤクモ" = "これだから作家ってやつは……作ってばっか、その後のことなんかまるで興味がないんだから！"
"10050005-86-メル" = "なんか今日やけに興奮してない！？"
"10050005-87-タカネ" = "……それは貴女が部長の逆鱗に触れたから、ですわ。"
"10050005-88-ヤクモ" = "ともかく状況は理解しました。この在庫が捌けなければ……印刷費が払えないということも。"
"10050005-89-ヤクモ" = "ふむふむ……しかし……。"
"10050005-90-タカネ" = "部長？何か嫌な予感がするのですが。"
"10050005-91-ヤクモ" = "気のせいですよぉ……ムフフ。"
"10050005-92-ヤクモ" = "メル、取引しませんか？"
"10050005-93-メル" = "取引……？できるなら、あんたとはそんな話したくないんだけど。#nまぁ、今はそんなことも言ってらんないけどさぁ。"
"10050005-94-ヤクモ" = "そうですよぉ？今、メルに選択権があるとお思いで？"
"10050005-95-メル" = "ぐぅ……。"
"10050005-96-ヤクモ" = "今すぐ、耳を揃えて印刷費を支払ってくださるなら#n聞かなくても構いませんよぉ～？"
"10050005-97-メル" = "くっ……分かったよ、手短にね。"
"10050005-98-ヤクモ" = "話が早くて助かります。#n我々に委託販売を任せてみませんか？"
"10050005-99-モミジ" = "えっ……？"
"10050005-100-モミジ" = "……はい？"
"10050005-101-ヤクモ" = "もちろん無料ではありませんよ。要は役割分担です。#nあなた方の同人誌の宣伝や通販の代行をうちがやって差し上げましょうということです。"
"10050005-102-ヤクモ" = "その代わり収益の一部……手数料を頂戴します。いかがでしょう？"
"10050005-103-メル" = "い、嫌っ！あんたと組んでまともだったことなんて一度たりともないんだけど！？"
"10050005-104-モミジ" = "ま、待ってくださいメル先輩！これはヤクモ部長の話も一理あるかと……！"
"10050005-105-モミジ" = "現状、自家通販だってほとんど動いていないですし……手を借りるのはアリだと思うんです。"
"10050005-106-モミジ" = "在庫を抱えて共倒れになるよりはマシじゃないでしょうか？"
"10050005-107-モミジ" = "それに、置き場所どうするんですか……本って重いですし、かさばるんですよ……？"
"10050005-108-ヤクモ" = "おや、話が通じる人だ。いやぁ、こんな風に提案できる取引相手は貴重なんですよぉ？"
"10050005-109-メル" = "ぐっ……悔しい……。でもたしかにモミジの言う通り、他に手はない……#nはぁ、分かった……やってやろうじゃないの！"
"10050005-110-ヤクモ" = "よしよし、では契約書を作りましょうか。取り分は……9:1でいかがでしょう？"
"10050005-111-メル" = "……念のため聞くけど、こっちが9だよね？"
"10050005-112-ヤクモ" = "まさか？"
"10050005-113-メル" = "だと思ったよ！このドロボー！！"
"10050005-114-タカネ" = "部長！？いくらなんでもそれはやりすぎでは！？"
"10050005-115" = "レッドウィンターの通り"
"10050005-116-タカネ" = "はぁ……なんとか契約できましたわね。"
"10050005-117-タカネ" = "私たちは売上に応じて所定額を送る、と。"
"10050005-118-ヤクモ" = "とはいえなかなかの量ですねぇ。まったく、どうするつもりだったんだか。"
"10050005-119-ヤクモ" = "さて行きましょうかタカネ。我々出版部の底力を、見せつけてやりますよぉ！"
"10050005-120-ヤクモ" = "そんな、まさか……！"
"10050005-121-タカネ" = "1冊も売れませんでしたわね。"
"10050005-122-ヤクモ" = "どうしてっ！？間違いなく、パーフェクトな戦略だったはずなのに！"
"10050005-123-タカネ" = "私の所感ですが……メルリーさんの本は、それなりに面白いものの……。"
"10050005-124-タカネ" = "レッドウィンターにおいては、目新しさに欠けるのでしょう。"
"10050005-125-タカネ" = "特に今回はマニアックでもなければ大衆性にも欠けた、半端なものでしたから。"
"10050005-126-タカネ" = "いくら面白い話でも3回聞けば飽きるものです。#nそれに多くの作家が扱えるテーマは1つと言われています。"
"10050005-127-タカネ" = "優秀な人は二つのテーマを、天才は三つ以上のテーマをと。メルリーさんがこれまでいろんな味変を加えてきたのは間違いないでしょうが……。"
"10050005-128-タカネ" = "少なくともレッドウィンターでは、それさえも慣れてしまった、といいますか……。"
"10050005-129-ヤクモ" = "……ええ、いい指摘ですね。しかし、ここで根本的な問題が一つ。"
"10050005-130-タカネ" = "？なんでしょうか？"
"10050005-131-ヤクモ" = "レッドウィンターの生徒らの懐事情がキビシイということですっ！"
"10050005-132-タカネ" = "そ、それを言っては元も子もないのでは？"
"10050005-133-ヤクモ" = "ですが、人はお金がない時、まず文化生活から切り捨てていくものです。"
"10050005-134-タカネ" = "部長……それでも出版部の人間ですか！？"
"10050005-135-ヤクモ" = "理解しているからこそ！出版業をしているんじゃありませんか！"
"10050005-136-タカネ" = "で、ですがそんな状況でも、なんとか活路を見い出すのが私たちの使命では……。"
"10050005-137-ヤクモ" = "どうせ部費の半分以上は、チェリノ会長の宣伝と「レッドベア」の印刷費に回される運命ですよ！？"
"10050005-138-タカネ" = "自分たちで言うことではありませんわね。#n「レッドベア」の編集長だって、粛清されてからまだ姿を見せておりませんし。"
"10050005-139-ヤクモ" = "そうですね……「レッドベア」編集部の方々を出版部で拾ったりもしました。"
"10050005-140-タカネ" = "はぁ……あの一件があるまでは、出版部もそこそこ回っていたはずなのですが……。"
"10050005-141-ヤクモ" = "いえ、編集部を受け入れたことで、財政はぐんとよくなりましたよ？"
"10050005-142-タカネ" = "その一方で、事務局の干渉を受けるようにはなってしまいましたが……。"
"10050005-143-ヤクモ" = "ムフフ。タカネはそうかもしれませんね、評論家ですから。"
"10050005-144-ヤクモ" = "ですが、出版部の経営を担っている私としては、現状もそんなに悪くありません。"
"10050005-145-ヤクモ" = "まあそれはともあれ、問題の原因が判明したわけですし。"
"10050005-146-タカネ" = "なんでしょうか？"
"10050005-147-ヤクモ" = "それは――"
"10050005-148-ヤクモ" = "余裕のない方々しかいない場所で稼ごうとしたことです！"
"10050005-149-ヤクモ" = "レッドウィンターの財政状態が他学園より悪いのは、火を見るよりも明らか！"
"10050005-150-ヤクモ" = "辛抱する木に金がなるとはいえ、我らに当てはまるとは限りません！"
"10050005-151-タカネ" = "た、たしかにそうですが他にできることもあるのでは……。"
"10050005-152-ヤクモ" = "ええ、ありますとも。"
"10050005-153-タカネ" = "それは……？"
"10050005-154-ヤクモ" = "商売とは第一に立地。第二に立地。第三に立地と言われてます。"
"10050005-155-ヤクモ" = "つまるところ、余裕のある方の場所へ行けば良いのです。#n読書習慣があるなら尚良い。"
"10050005-156-タカネ" = "そんな場所があるのですか？"
"10050005-157-ヤクモ" = "ええ、もちろん。それは――"
"10050005-158-ヤクモ" = "――トリニティ総合学園です。"
"10050005-159-タカネ" = "待ってください部長！？トリニティで商売をするおつもりですか！？#n他自治区ですよ！？"
"10050005-160-ヤクモ" = "リスクなくしてリターンなし！ほら、ついてきてくださいタカネ。#n遅れたら置いていきますよぉ。"
"10050005-161-タカネ" = "部長……？部長！！？"
