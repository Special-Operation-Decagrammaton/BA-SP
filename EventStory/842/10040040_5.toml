[translation]
"10040040-1" = "第4話;本音を言うと……"
"10040040-2" = "（コタマとハレの指示で移動を続けていると……）"
"10040040-3-ハレ" = "先生、ちょっとストップ。"
"10040040-4-ハレ" = "そこを右に曲がると……。"
"10040040-5-コタマ" = "……待ってください。"
"10040040-6-コタマ" = "何か聞こえます。"
"10040040-7" = "[ns1] \"向こうから……！\"\n[ns2] \"人の気配が……！\""
"10040040-8-コタマ" = "距離40ｍ、6秒後に接触します。"
"10040040-9-コタマ" = "どこか隠れる場所は……！"
"10040040-10-ハレ" = "隣の調理室ならいけるかも。"
"10040040-11-ハレ" = "ロック解除するね……！"
"10040040-12" = "[ns3] \"ありがとう、二人とも！\"\n[ns4] 素早くドアを開けて入る。"
"10040040-13-？？？" = "うぎゃああぁっ！"
"10040040-14" = "[ns5] \"いたた……。\"\n[ns6] \"こ、この石頭は……。\""
"10040040-15-コユキ" = "……えっ！？"
"10040040-16-コユキ" = "なんでここに先生が……！？"
"10040040-17-コユキ" = "でも、良かったぁ～……！"
"10040040-18-コユキ" = "先輩かと思ってびっくりしちゃいましたよ！"
"10040040-19" = "[s7] \"私もビックリしたよ！\"\n[s8] \"こんなところに隠れてたんだね。\""
"10040040-20-コユキ" = "とりあえず先輩たちを[ruby=ま]撒[/ruby]かなきゃいけませんからね。"
"10040040-21-コユキ" = "ちょっと逃げたくらいじゃ脱出できないんですよ、ここからは。"
"10040040-22-コユキ" = "……え？"
"10040040-23-コユキ" = "……ああ。これ、気になります？#nユウカ先輩が用意してくれたパジャマです。"
"10040040-24" = "[s9] \"ちゃんと着てるんだね。\"\n[s10] \"さすが、ちゃっかりしてるなぁ。\""
"10040040-25-コユキ" = "……？"
"10040040-26-コユキ" = "だって、せっかくの好意ですから。無下にする必要なんてなくないですか？"
"10040040-27-コユキ" = "何か問題でも……？"
"10040040-28-コユキ" = "にはははは、そうでしょう！"
"10040040-29-コユキ" = "それより、大変なのはこれからですよ。#nいったん[ruby=ま]撒[/ruby]けたとはいえ、まだまだこの先にも……。"
"10040040-30-コユキ" = "まだ何かあるの、ですか？#n……あぁ、先生は初めてですもんね、ここから脱出するの。"
"10040040-31-コユキ" = "ほんと、大変なんですから！#n監視カメラに始まり、電子ロックに警備ドローン、#n果ては自動閉鎖装置まで……次から次へとキリがないんですよ！"
"10040040-32-コユキ" = "……え？"
"10040040-33-コユキ" = "どうしてそんなに詳しいのかって？#n私も一応、セミナーですし……。"
"10040040-34-コユキ" = "それに、この学園の誰よりもセキュリティシステムと向き合ってきた#nという自負がありますから。ふっふっふっ。"
"10040040-35" = "[s11] \"得意気に言うことじゃないような……。\"\n[s12] \"でも今ならその経験が役立つかもね。\""
"10040040-36-コユキ" = "とにかく、先生はツイてますよ！なにせ脱出ルーキーの心強い味方、#nこの[ruby=くろさき]黒崎[/ruby]コユキというベテラン中のベテランが一緒なんですから！"
"10040040-37-コユキ" = "いくらこの建物が迷路のようになっていても、#n私はもう何十回も先輩たちから逃げ切ってるんですから――"
"10040040-38-コユキ" = "足音……？"
"10040040-39-コユキ" = "ひ、ひぃっ……！#n伏せてください！！"
"10040040-40-コユキ" = "ドアの窓からバレちゃいます！"
"10040040-41-コユキ" = "……早く、こっちに！"
"10040040-42-ユウカ" = "……まったく、どこにいるのよ。"
"10040040-43-ノア" = "ふふっ。こういうの、私は好きですけどね。"
"10040040-44-ユウカ" = "そんなこと言ってる場合じゃないでしょ。"
"10040040-45-ユウカ" = "このままじゃ[ruby=らち]埒[/ruby]が明かないし、[ruby=ふたて]二手[/ruby]に分かれましょう。#nノアはあっちをお願い。私は調理室を探してみるわ。"
"10040040-46-コユキ" = "ちょ、まっ……！なんでここに？"
"10040040-47-ユウカ" = "調理室なら施錠してませんでしたっけ……。"
"10040040-48-ユウカ" = "この程度のロック、コユキならあっというまに解除しちゃうもの。"
"10040040-49-ノア" = "ふふっ、それもそうですね。"
"10040040-50" = "[ns13] \"さすがユウカ。鋭いなあ……。\"\n[ns14] \"向こうも慣れてるね。\""
"10040040-51-コユキ" = "感心してる場合じゃないですよ……！"
"10040040-52-コユキ" = "じゃあ、そっちは頼むわね。"
"10040040-53-コユキ" = "ふふっ、お任せあれ。"
"10040040-54-コユキ" = "ふぅ……ぜったい見つけてやるんだから。"
"10040040-55-コユキ" = "ひぃっ……！！"
"10040040-56" = "[ns15] 目につかないであろうところへ避難する。\n[ns16] （とりあえず場所を変えないと……！）"
"10040040-57-ユウカ" = "……。"
"10040040-58-ユウカ" = "誰かいたような……気のせいかしら？"
"10040040-59-ユウカ" = "……！"
"10040040-60" = "[ns17] （しまった、足が……！）\n[ns18] （こんなところに調理器具があるなんて……！）"
"10040040-61-ユウカ" = "……コユキね！？"
"10040040-62-ユウカ" = "やっぱり、ここだと思ったのよ。#n早く出てきなさい！"
"10040040-63-ユウカ" = "出てこないなら、どうなっても知らないわよ……！"
"10040040-64" = "[ns19] ……言い訳を考える。\n[ns20] （ここで終わりなのか……！）"
"10040040-65-ユウカ" = "……？"
"10040040-66-コユキ" = "にはははは！#nユウカ先輩！こっちですよこっち！！"
"10040040-67" = "[ns] （……コユキ！）"
"10040040-68-ユウカ" = "……も、もうあんなところに！？"
"10040040-69-ユウカ" = "逃がさないわよ……！"
"10040040-70-コユキ" = "にはははっ！そう簡単に捕まるもんですか！！"
"10040040-71-コユキ" = "こっちですよ～～！"
"10040040-72-ユウカ" = "こら！待ちなさ～い！！"
"10040040-73" = "[ns21] \"……ありがとう、コユキ。\"\n[ns22] \"……この恩は忘れないよ。\""
"10040040-74-コタマ" = "……尊い犠牲、ですね。"
"10040040-75-コタマ" = "無事脱出できたら、彼女を弔うWebサイトでも作りましょうか。"
"10040040-76-ハレ" = "そんな大げさな。"
"10040040-77-コユキ" = "そ、そうですよ……はぁ、はぁ。"
"10040040-78-コユキ" = "この程度、へっちゃら、ですし……にはは。"
"10040040-79" = "[ns23] \"コユキ！？\"\n[ns24] \"捕まらなかったの……！？\""
"10040040-80-コユキ" = "にはは……なんの、これしき。"
"10040040-81-コユキ" = "言ったじゃ、ないですか。#n脱出に関してなら、私は、ベテランだって……！にはは……！"
"10040040-82-コユキ" = "はぁ、はぁ……ようやく、落ち着いてきました……ふぅ。"
"10040040-83-コユキ" = "それより助っ人に出会えるなんて、やっぱりツイてます！"
"10040040-84-コユキ" = "これも先生の言う「日頃の行い」が良かったからですよね？"
"10040040-85-ハレ" = "ちょっと違うような……。"
"10040040-86-コタマ" = "そうですね。偶然ではなく必然ですから。#n私たちは脱出に適したルートを選んでいたので……。"
"10040040-87-コタマ" = "コユキさんと鉢合わせたのは、自然な成り行きです。"
"10040040-88-コユキ" = "細かいことはいいんです、みんな仲間ってことなんですから！#n私たちはみんな、 脱 出同盟の一員なんですよ！にはははは！"
"10040040-89-コタマ" = "……なんか、マキみたいだね。"
"10040040-90-コタマ" = "同感です。#nマキと言えば、そろそろ着く頃ですね。"
"10040040-91-コタマ" = "……何でマキを呼んだの、ですか？"
"10040040-92-ハレ" = "万が一に備えて、いたほうがいいからね。"
"10040040-93-ハレ" = "ここはセキュリティが固いから、状況によっては#n一階のドアとか窓を壊して脱出してもらおうと思って。"
"10040040-94" = "[s25] \"そ、そこまで考えてたの……？\"\n[s26] \"でも壊すのはダメだよ。\""
"10040040-95-コユキ" = "そんなの気にしなくていいんじゃ？"
"10040040-96-コユキ" = "セミナーはお金持ちですし、ちょっと施設を壊すくらいなら……。"
"10040040-97-ハレ" = "……なるほど、これが。"
"10040040-98-コタマ" = "ユウカさんから聞いていましたが、思った以上ですね。"
"10040040-99-ハレ" = "マキみたいって言ってたの……後で本人に謝らないと。"
"10040040-100-コユキ" = "私、なにか変なこと言いました！？！？"
"10040040-101-ハレ" = "こっちの話だけど、マキはさ……。"
"10040040-102-ハレ" = "……って、先生？#n何か言った？"
"10040040-103-ハレ" = "どんどん[ruby=おおごと]大事[/ruby]になってる気がする？"
"10040040-104-ハレ" = "だから逃げるのはやめて素直に謝りに行こうかな、って……？"
"10040040-105-コユキ" = "え、えええええ！？#nなに言ってるんですか！？ここで裏切るんですか！？"
"10040040-106-コユキ" = "ダメです、絶対！先生は私と一緒に脱出するんです！#nでないと全部私のせいになっちゃうじゃないですか！？"
"10040040-107-ハレ" = "さらりと問題発言を……。"
"10040040-108" = "[ns27] \"コユキのこともうまく言っておくから。\"\n[ns28] \"素直に謝れば、二人もわかってくれるはず。\""
"10040040-109-コユキ" = "そ、そんな……！"
"10040040-110-コタマ" = "……でも、先生。"
"10040040-111-コタマ" = "いったい何を「素直に」話すつもりなんです？"
"10040040-112-コタマ" = "もしかして――"
"10040040-113-コタマ" = "「大人としてやるべきこともせず、#n夜な夜な反省部屋に潜り込んで」"
"10040040-114-コタマ" = "「生徒と徹夜で遊ぼうとしていたのが、見つかりかけて逃げ出し」"
"10040040-115-コタマ" = "「パジャマ姿の生徒を散々覗き見したうえで」"
"10040040-116-コタマ" = "「脱出に失敗して、自首した」"
"10040040-117-コタマ" = "……。"
"10040040-118-コタマ" = "……と、説明するんですか？"
"10040040-119" = "[ns29] \"……出口はどこ？\"\n[ns30] \"何としても脱出しよう！\""
"10040040-120-ハレ" = "にはははは！やっぱりそう来なくっちゃ！"
"10040040-121-コユキ" = "この音は……！？"
"10040040-122-コユキ" = "警備ドローン……！普段使ってないものまで動員してきましたか！"
"10040040-123-コタマ" = "相当怒っているみたいだね……。"
"10040040-124-コタマ" = "コユキさんの挑発が効いてしまったんでしょうね。"
"10040040-125-コユキ" = "こうしてる場合じゃなさそうです！早く一階に向かわないと！"
"10040040-126-コタマ" = "そうだね。#nドローンを全部ハッキングして先生を助けたいとこだけど……。"
"10040040-127-コタマ" = "私たちは安全なルートを迅速に割り出す必要があるので。#n監視カメラの制御に専念します。"
"10040040-128-コタマ" = "ドローンは……。"
"10040040-129-コユキ" = "に・は・は・は・は！#nここは黒崎コユキにお任せください！"
"10040040-130-コユキ" = "先生の指揮さえあれば、全部壊せ――"
"10040040-131-コユキ" = "……え？"
"10040040-132-コユキ" = "壊しちゃダメ……？"
"10040040-133-コユキ" = "脱出するんですし、仕方なくないですか……？"
"10040040-134" = "[s31] \"ドローンも窓も、セミナーの資産だからね。\"\n[s32] \"制圧するだけにしよう。\""
"10040040-135-コユキ" = "そんなこと、できるんです……？"
"10040040-136-ハレ" = "うん。制圧してから手動で電源をオフにすれば、いける。"
"10040040-137-ハレ" = "私たちも、できる範囲でサポートしてみるね。"
"10040040-138-コタマ" = "セミナーのセキュリティを弱体化するチャンスではあるので、少々残念ですが……。"
"10040040-139-コユキ" = "本当ですよ。全部壊したかったのにぃ……。"
"10040040-140-コタマ" = "……コユキさんは、セミナー所属でしたよね？"
"10040040-141-ハレ" = "でも今は同じ目的で動いてるから……。"
"10040040-142-コユキ" = "なんでもいいです！ほら、行きますよ！"
"10040040-143-コユキ" = "コユキパワー、チャーーージ！"
