[translation]
"10040050-1" = "第5話;戦慄のロッカールーム"
"10040050-2-コユキ" = "はぁ、はぁ……なんとか、たどり着けましたね……。"
"10040050-3-コユキ" = "本当にドローンを壊さずに制圧できるなんて、さすが先生です！"
"10040050-4-コタマ" = "お疲れ様でした。予想より順調です。"
"10040050-5-ハレ" = "「裏口」まで来れたね。#n通用口は他にもいくつかあるんだけど……。"
"10040050-6-コタマ" = "あまり使われていない場所を選びました。ここなら見つからないでしょう。"
"10040050-7-ハレ" = "あとは開けるだけで……。"
"10040050-8-コタマ" = "……？"
"10040050-9-コタマ" = "ん……？"
"10040050-10-コタマ" = "あれ……？"
"10040050-11-コタマ" = "このドア……。"
"10040050-12-コタマ" = "開きません……。"
"10040050-13-ハレ" = "どういうこと？"
"10040050-14-ハレ" = "私もやってみる……。"
"10040050-15-ハレ" = "あれ、どうして……。"
"10040050-16-ハレ" = "……！？#nなにこれ、コードが……。"
"10040050-17-コタマ" = "……ハレ！逆ハッキングされています！#n急いで対処しないと、位置が！"
"10040050-18-ハレ" = "そんな、早すぎる……！#nこの人、私たちより一枚[ruby=うわて]上手[/ruby]だ……！"
"10040050-19" = "[s1] \"逆ハッキング……！？\"\n[s2] \"コタマとハレよりも！？\""
"10040050-20-ハレ" = "先生、早くそこから離れて！#nこのままじゃ、監視カメラも復旧しちゃう！"
"10040050-21-コタマ" = "真っ向勝負じゃ勝ち目はなさそうです。別口を探さなくては。#nでも、これはまるで……。"
"10040050-22-ハレ" = "この手口……見覚えが……。"
"10040050-23-ハレ" = "……まさか、副部長！？"
"10040050-24-コタマ" = "二人とも、早く逃げてください！！"
"10040050-25-コユキ" = "そんなぁ！"
"10040050-26-コユキ" = "引き返せってことですか！？#nなんとかなったりしません！？"
"10040050-27-コタマ" = "残念ですが、分が悪すぎます……！"
"10040050-28-コタマ" = "……早く！"
"10040050-29" = "[ns3] コユキの手を掴んで逃げる。\n[ns4] \"コユキ、ここは退こう！！\""
"10040050-30-コユキ" = "うあぁああああ！！なんで――！！！"
"10040050-31-コユキ" = "はぁ、はぁ……今日だけで相当走らされてるんですけど……。"
"10040050-32-ハレ" = "油断してた。#nよく考えれば当然だよね。"
"10040050-33-コタマ" = "ええ。副部長はセミナーのセキュリティ管理も担当していますから。"
"10040050-34-コタマ" = "でも向こうはリモートなのに、一蹴されてしまうなんて……。"
"10040050-35-コタマ" = "……思っていたより、面倒なことになってしまいました。"
"10040050-36-ハレ" = "相手は副部長だもん、仕方ないよ。"
"10040050-37-コユキ" = "じゃあ、どうすれば良いんですか？#n朝までずっと隠れてるしかないんです？"
"10040050-38-コユキ" = "もしかして、朝になっても解決しないんじゃ……！？#nあぁああ～！終わりだああああ！！"
"10040050-39-コタマ" = "……ううん。"
"10040050-40-ハレ" = "まだあるよ。#n副部長とやりあわなくてすむ方法が。"
"10040050-41-コタマ" = "そうですね……ここからは、アナログな手法でいきます。"
"10040050-42" = "[s5] \"アナログ……？\"\n[s6] \"どういうこと？\""
"10040050-43-コタマ" = "副部長は今、リモートでセキュリティシステムを制御してるわけだよね。"
"10040050-44-ハレ" = "裏を返せば、システムを設置してないとこには手が届かないって言えるよね。#nたとえ副部長であっても。"
"10040050-45-ハレ" = "例えば、私たちのいるプライベート空間がそう。"
"10040050-46-コタマ" = "……ハイテク機器を導入していない古い施設や、老朽化して放置されたままの場所もそうです。"
"10040050-47-コタマ" = "古い施設や……老朽化した場所……？"
"10040050-48-コタマ" = "ここはミレニアムの中心にそびえる最大規模の施設です。#nこれも裏を返せば、それだけ年季が入っていることを意味します。"
"10040050-49-ハレ" = "増改築だって何度も繰り返してきたからね。#n管理の行き届いてない箇所も、ある。"
"10040050-50-ハレ" = "もう誰も使ってない場所だけど……逃げ道はちゃんとあるよ。"
"10040050-51-ハレ" = "ナビゲートしながら調べておいたんだ。"
"10040050-52" = "[ns7] \"こんな短い時間で、よく調べられたね。\"\n[ns8] \"すごいよ、二人とも。\""
"10040050-53-コタマ" = "打ち捨てられて久しい荒んだ場所ですが……事態は急を要しますので。"
"10040050-54-コユキ" = "えぇ、汚いところは嫌なんですけど？#nもっとなんとかならないんですか？"
"10040050-55-コユキ" = "私なんてほら、パジャマですし。寒いところはちょっと……。"
"10040050-56-コユキ" = "あ、途中に自販機があるとうれしいです！#n喉が乾いてきちゃったんですよね！"
"10040050-57-ハレ" = "ねえ、先生……。"
"10040050-58-ハレ" = "……その子も一緒じゃなきゃダメなの？"
"10040050-59-コユキ" = "ええええええ！？！？#nいきなり何ですか！？私、何かやらかしました！？！？"
"10040050-60" = "[s9] \"ごめんね、その……。\"\n[s10] \"大目に見てあげてほしい……。\""
"10040050-61-ハレ" = "マキにはこれから優しく接してあげなきゃ……。"
"10040050-62-ハレ" = "話を戻すけど、ほかに道はないよ。"
"10040050-63-ハレ" = "だから……。"
"10040050-64-コタマ" = "……待ってください。"
"10040050-65-コタマ" = "静かに……向こうから何か聞こえます。"
"10040050-66-コタマ" = "これは……。"
"10040050-67-コタマ" = "誰かが近づいてきます……！"
"10040050-68-コタマ" = "すぐ隠れてください……！"
"10040050-69-コユキ" = "ええっ！？誰なんです……！？"
"10040050-70-ハレ" = "いいから早く……！"
"10040050-71-コユキ" = "そうは言っても、隠れる場所なんてないですよ！？"
"10040050-72-コユキ" = "……か、壁に貼りつけばいいんです！？"
"10040050-73-コタマ" = "それでは見つかってしまいます。"
"10040050-74-コユキ" = "うぅ、このままじゃ……！！"
"10040050-75" = "[ns11] \"そこに扉があるよ。\"\n[ns12] \"急いで入ろう。\""
"10040050-76-コユキ" = "え、あっ……はい！"
"10040050-77-コタマ" = "急いでください……！"
"10040050-78-ハレ" = "早く……！"
"10040050-79" = "[ns] \"ここは……。\""
"10040050-80-コユキ" = "更衣室、ですか。"
"10040050-81-コユキ" = "ここなら大丈夫――"
"10040050-82-コタマ" = "……しっ。"
"10040050-83-コタマ" = "目と鼻の先まで来ています。"
"10040050-84-ユウカ" = "ノア？どうかしたの？"
"10040050-85-ノア" = "……。"
"10040050-86-ノア" = "このドア、おかしいですね……。"
"10040050-87-ノア" = "ずっと使われてないはずなのに、ここだけホコリが……。"
"10040050-88-ハレ" = "……！！！！"
"10040050-89-コユキ" = "！！！！！！"
"10040050-90-コユキ" = "……気にしすぎじゃない？"
"10040050-91-コユキ" = "そうかもしれません。#nでも、念のため……。"
"10040050-92-コユキ" = "少し、中を見てみましょう。"
"10040050-93-ハレ" = "まずい。"
"10040050-94-コユキ" = "なっ……！！"
"10040050-95" = "[ns13] 急いでロッカーに入る。\n[ns14] コユキをロッカーの中に引っ張る。"
"10040050-96-コユキ" = "ユウカちゃんは、ほかの場所を探してみてください。"
"10040050-97-コユキ" = "分かったわ。何かあったらすぐ言ってね。"
"10040050-98-コユキ" = "は～い。"
"10040050-99-コユキ" = "せ、先生……！どうすれっ――！？"
"10040050-100" = "[ns15] \"……しっ。\"\n[ns16] 急いでコユキの口を塞ぐ。"
"10040050-101-コユキ" = "…………！！！"
"10040050-102" = "[ns17] （……ノアが！）\n[ns18] （声を出しちゃダメだ……）"
"10040050-103-ノア" = "……………………。"
"10040050-104-コユキ" = "……っ！"
"10040050-105-コユキ" = "せ、先生……あうっ！"
"10040050-106-コユキ" = "ちょ、ちょっと待ってください……！"
"10040050-107-コユキ" = "……うぎゃっ！"
"10040050-108-コユキ" = "せ、狭すぎますよぉ……。"
"10040050-109-コユキ" = "んうっっっ！？"
"10040050-110-コユキ" = "どうして――どうして、こんなことに……。"
"10040050-111" = "[ns19] \"……しっ。\"\n[ns20] \"静かにして。\""
"10040050-112-ノア" = "……………………。"
"10040050-113-ノア" = "……あら、おかしいですね。"
"10040050-114-ノア" = "たしか――"
"10040050-115-ノア" = "11日と2時間31分前に中を覗いた時とは、#n椅子の位置が違います。"
"10040050-116" = "[ns] （なんで覚えてるの……）"
"10040050-117-ノア" = "ここもドアノブが少し……。"
"10040050-118-ノア" = "……なるほど。"
"10040050-119-ノア" = "ここに誰か入ったようですね。"
"10040050-120-ノア" = "ふふっ、楽しくなってきました。#nでは……。"
"10040050-121-ノア" = "少し、調べてみましょうか？"
"10040050-122" = "[ns] （……！！！！）"
"10040050-123-ノア" = "ふふっ……。"
"10040050-124-ノア" = "……うーん、もうどこかに行ってしまったのでしょうか。"
"10040050-125" = "[ns21] （……行ったかな？）\n[ns22] （ノアは……？）"
"10040050-126" = "[ns23] （まずい、近づいてくる……！）\n[ns24] （ロッカーをひとつずつ確認してる……！！）"
"10040050-127-コユキ" = "う、うああああ……！？"
"10040050-128-コユキ" = "今度こそ、本当に終わりです……！！"
"10040050-129" = "[ns25] （……！！！！！！）\n[ns26] （ここまでか……！)"
"10040050-130" = "[ns27] （出て行ってくれたみたいだ……）\n[ns28] （……本当に行ったんだよね？）"
"10040050-131-コユキ" = "……ふああぁぁぁぁ！"
"10040050-132-コユキ" = "心臓が止まるかと思いましたよ……。"
"10040050-133-ハレ" = "うん。ホラーゲームをプレイしてるみたいだった。"
"10040050-134-コタマ" = "ここまで耳に全神経を集中させたのは、私も初めてです。"
"10040050-135-コタマ" = "……でも、なんとかやり過ごせましたね。"
"10040050-136-コタマ" = "今なら安全に移動できるはず。"
"10040050-137-ハレ" = "そうだね。もうこのあたりにはいないはず。"
"10040050-138-ハレ" = "ハッキングであっちの状況を確認したいとこだけど……。"
"10040050-139-コタマ" = "逆効果でしょうね。#n副部長との真っ向勝負は避けましょう。"
"10040050-140-ハレ" = "つまり、私たちでなんとかするしかないってことだよね。"
"10040050-141-ハレ" = "……どうしよう、先生？"
"10040050-142" = "[s29] \"今すぐ移動しよう。\"\n[s30] \"時間を無駄にはできない。\""
"10040050-143-ハレ" = "わかった。できるだけサポートするね。"
"10040050-144-コタマ" = "私も最後まで支援します。"
"10040050-145-コタマ" = "ひとまず、そこから出てもらって……。"
"10040050-146-コユキ" = "…………。"
"10040050-147-コユキ" = "……ん？"
"10040050-148" = "[s31] \"……コユキ？\"\n[s32] \"どうかしたの？\""
"10040050-149-コユキ" = "……え？"
"10040050-150-コユキ" = "あ、いえ……。"
"10040050-151-コユキ" = "勘違いかも、しれませんが……。"
"10040050-152-コユキ" = "なんというか……。"
"10040050-153-コユキ" = "視線を感じるような、気がして……。"
