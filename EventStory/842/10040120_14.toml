[translation]
"10040120-1" = "後日談その4;Truth or Dare"
"10040120-2-ノア" = "なるほど……。"
"10040120-3-ノア" = "ミックスジュース……とは言い難い、この怪しげな液体を、#nコユキちゃんとマキちゃんが作ってたんですね？"
"10040120-4-ユウカ" = "そういうことよ！#n私たちがコンビニに行ってる間に、またトラブルを起こしたの！"
"10040120-5-ユウカ" = "まったく。飲食物を粗末に扱ってダメにしちゃうなんて……。"
"10040120-6-コユキ" = "……いま、粗末にって言いました？"
"10040120-7-コユキ" = "それは聞き捨てなりませんね！"
"10040120-8-コユキ" = "私たちだって真剣にやってたんですよ！いろんな味を混ぜて、#n斬新な飲み物を生み出す研究をしていたわけであって、粗末になんか――"
"10040120-9-ユウカ" = "言い訳しないで反省しなさい！"
"10040120-10-コユキ" = "はいっ！"
"10040120-11-ノア" = "話はわかりましたけど、このジュースはどうするんです？"
"10040120-12-ユウカ" = "もったいないけど……捨てるしかないと思うわ。"
"10040120-13-ノア" = "それなら、私に考えがあります。"
"10040120-14-ノア" = "このジュース、色こそ怪しげに見えますが……#n危険なものは入っていないようです。つまり、飲むことはできるはず。"
"10040120-15-ノア" = "ですので、これを使ってひとつ、ゲームをしませんか？"
"10040120-16-ユウカ" = "ゲーム……？"
"10040120-17-ノア" = "[ruby=Truth or Dare]真実か挑戦か[/ruby]という、順番に相手を選んで質問するゲームです。#n質問には、真実を話すか、話さず罰ゲームに挑戦するか選ぶことができます。"
"10040120-18-ノア" = "この罰ゲームで……例のジュースを飲んでもらうのはどうでしょう？#nこれならムダにしなくて済むと思うんです。"
"10040120-19-コユキ" = "良いですね、それ！#nちょうどユウカ先輩に聞きたいことが――"
"10040120-20-ユウカ" = "何か言った、コユキ？"
"10040120-21-コユキ" = "いえ、何も。"
"10040120-22-コユキ" = "う～ん……ゲームをするのはいいけど、そのジュースは、ちょっと……。"
"10040120-23-ユウカ" = "コユキたちの反省にもならないし、#n私も飲まされるかもしれないなんて……。"
"10040120-24-ノア" = "でも飲食物を無為に捨てるのは、嫌ですよね？"
"10040120-25-ノア" = "コユキちゃんは、後でじっくりと[ruby=・   ・   ・]お説教[/ruby]して反省させますから。#nいったん見逃してあげませんか？"
"10040120-26-コユキ" = "あ、あの……お説教は、ユウカ先輩にお願いできませんか？"
"10040120-27-ノア" = "ダメです。"
"10040120-28-コユキ" = "ううっ……。"
"10040120-29-ユウカ" = "まあ、そうね。ノアがそこまで言うなら。"
"10040120-30-ユウカ" = "そういうゲームは、私だって嫌いじゃないし。#nきわどい質問は先生に聞かれたくないけど……ちょうど席を外してるみたいだし。"
"10040120-31-ノア" = "決まりですね。では皆さん、お集まりいただけますか。"
"10040120-32-ノア" = "詳細なルールを説明しますね。順番に相手を選んで質問をしていくのですが、#n質問された方は本当のことを話すか、話さない代わりにこのジュースを飲む。#n終わったら、質問された方が質問者になる。その繰り返しです。"
"10040120-33-ノア" = "最初の質問者はくじ引きで決めましょうか。では――"
"10040120-34-チヒロ" = "あれ、私が質問者みたい。"
"10040120-35-ノア" = "それじゃあ、誰か一人を選んで、答えにくい質問をしてみてください。"
"10040120-36-チヒロ" = "答えにくい質問……。"
"10040120-37-チヒロ" = "そうね……じゃあコユキで。#nあなたのハッキングに関して気になることがあるんだけど……。"
"10040120-38-コユキ" = "は、はいっ！？"
"10040120-39-チヒロ" = "これまでミレニアムのサーバーをハッキングした回数、答えてもらえる？#n直近で怪しい記録があって、もしかしたらと思ってるんだけど。"
"10040120-40-コユキ" = "えっ、分かりませんけど……。"
"10040120-41-コタマ" = "では、罰ゲームのジュースを飲んでもらいましょう。"
"10040120-42-チヒロ" = "ま、待ってください！嘘はついてないじゃないですか？#n回数なんて数えてないってだけですよ！？"
"10040120-43-コユキ" = "ほしい資料があれば、その都度接続してるんですから、#nそんなの数えてなんか――"
"10040120-44-チヒロ" = "数えきれないくらい、ハッキングしたってこと……！？"
"10040120-45-チヒロ" = "ノア、会議室を抑えてもらえる？明日、午前中のうちにコユキと面談するから。#nセキュリティについて指導しないと。"
"10040120-46-ノア" = "わかりました。完全防音の会議室を予約しておきますね。"
"10040120-47-コユキ" = "ええっ！？正直に話したのに！？#nどうしてひどい目にあうことが決まるんですか！？"
"10040120-48-ノア" = "ゲーム外での行いが悪いから、ですね。"
"10040120-49-ノア" = "さて、コユキちゃんの番ですよ。誰に質問するか、決めてくださいね。"
"10040120-50-コユキ" = "じゃ、じゃあ……ノア先輩！"
"10040120-51-コユキ" = "今はいてるパンツの色を答えてください！#n三秒以内に回答できなかったら――"
"10040120-52-ノア" = "白です。#nレースの付いたお気に入りの一着、ですね。"
"10040120-53-コユキ" = "即答！？#nもうちょっと恥じらったりしてくださいよ？"
"10040120-54-ユウカ" = "その程度でノアが動じるわけないじゃない……。"
"10040120-55-ノア" = "それじゃあ、私の番ですね。"
"10040120-56-ノア" = "ユウカちゃん♪"
"10040120-57-ユウカ" = "な、なに？私に質問するの？"
"10040120-58-ノア" = "ええ。実はずっと気になっていたことがあるんです。"
"10040120-59-ノア" = "ユウカちゃんは……[USERNAME]先生をどう思っているんですか？"
"10040120-60-ユウカ" = "い、いきなりそれ！？"
"10040120-61-ユウカ" = "そんなこと聞かれても……困るんだけど……。"
"10040120-62-ユウカ" = "でも、そうね。嫌いとかじゃ全然なくて……#nって、皆の前でこういうのは、やっぱり……。"
"10040120-63-ノア" = "では、ジュースを飲んでもらわなきゃですね。"
"10040120-64-ユウカ" = "うぅ……仕方ないわね。"
"10040120-65-ユウカ" = "うぇ……なに、この味？#n苦くて、酸っぱくて、ベトベトしてて……舌が麻痺しちゃいそう……。"
"10040120-66-ユウカ" = "もう、ノア！最初から私を指名するつもりだったでしょ！？"
"10040120-67-ノア" = "まあまあ。ゲームなんですから。そんなに怒っちゃダメですよ。ふふっ。"
"10040120-68-ノア" = "ところでユウカちゃんの番ですけど、誰に質問しますか。"
"10040120-69-ユウカ" = "じゃあ、マキ。直近でグラフィティを描いた場所は？"
"10040120-70-マキ" = "う～ん……それなら一週間前に、発電所の北に描いた、大きな雷模様かな。"
"10040120-71-ユウカ" = "えっ、図書館に描いたやつじゃなかったの！？"
"10040120-72-マキ" = "あ、やば……。"
"10040120-73-チヒロ" = "はぁ……。"
"10040120-74" = "（その後も、ゲームは夜遅くまで続いたのだが……）"
"10040120-75" = "（どういうわけだか……）"
"10040120-76-マキ" = "ユウカ先輩！#nこの前のシャーレ当番の時、帰りがすっごく遅かったけど……何してたの？"
"10040120-77-ユウカ" = "そ、それは……シャーレの仕事だから、秘密！"
"10040120-78-コタマ" = "先週末、コーギータウンで[USERNAME]先生と話していましたね。#n内容を教えてください。"
"10040120-79-ユウカ" = "な、なんでそれを！？#nそれは……パスするわ！"
"10040120-80-ハレ" = "ユウカって、シャーレの領収書以外にも、#n先生個人の領収書まで整理してるって聞いたけど、本当？"
"10040120-81-ユウカ" = "待って、また私なの？"
"10040120-82-コユキ" = "ユウカ先輩！"
"10040120-83-チヒロ" = "ユウカ。"
"10040120-84-ノア" = "ユウカちゃん♪"
"10040120-85-ユウカ" = "なんでみんな……！"
"10040120-86-ユウカ" = "私にばっかり質問するのよ～！"
"10040120-87" = "（……結局、例のジュースはほとんどユウカが飲んだのだった）"
