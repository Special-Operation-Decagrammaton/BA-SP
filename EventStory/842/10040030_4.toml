[translation]
"10040030-1" = "第3話;我慢なんてできません！"
"10040030-2-コユキ" = "え……？"
"10040030-3-コユキ" = "こ、これは……！？"
"10040030-4" = "[ns1] \"出たの？\"\n[ns2] \"どんなカード？\""
"10040030-5-コユキ" = "すごい！すごいです！！#n見てください、先生！！"
"10040030-6-コユキ" = "こ、このスキル、強すぎません！？#nめちゃくちゃインフレしちゃってますよ！にははは！！"
"10040030-7-コユキ" = "やっぱ先生を呼んで正解でしたね！#nおかげでこんなにツキが回ってきてくれました！"
"10040030-8-コユキ" = "……え、関係あるのかって？#nもちろんありますよ！！"
"10040030-9-コユキ" = "一人で開封してたら、もっとひどい引きだったはずですからね！"
"10040030-10-コユキ" = "先生を呼んで運気を高め、パックを開封する完璧な作戦……#nふっふっふっ、さすがは私。"
"10040030-11-コユキ" = "使えるものは他人の運でもなんでも使う！そうすれば不可能なんてないんです！"
"10040030-12-コユキ" = "だから私にはどんな解だって、導き出せちゃうんです！にはははは！"
"10040030-13" = "[s3] \"コユキにとって、私は幸運の象徴なんだね。\"\n[s4] \"何だか嬉しいよ。\""
"10040030-14-コユキ" = "もちろんですよ！#nだから恩返し、しなきゃなって！"
"10040030-15-コユキ" = "なので、その……。"
"10040030-16-コユキ" = "……これ、あげます！"
"10040030-17" = "[s5] \"……私にくれるの？\"\n[s6] \"コユキは使わないの？\""
"10040030-18-コユキ" = "まあ、ちょっと惜しい気持ちはありますけど……。"
"10040030-19-コユキ" = "私には他のもありますし。#nなにより、先生が来てくれたおかげで出たカードですから。"
"10040030-20-コユキ" = "だからこれはあげます！#nそのかわり、次の開封式も来てくださいね！！"
"10040030-21-コユキ" = "そのカードは私たち二人の絆……約束の象徴ってわけです！！"
"10040030-22" = "[s7] \"コユキ……！\"\n[s8] \"……ありがとう、大切にするね。\""
"10040030-23-コユキ" = "にはははは……先生にはお世話になってますし、まぁたまには。"
"10040030-24-コユキ" = "……ん？"
"10040030-25-コユキ" = "どうしてこんな時間に……。"
"10040030-26" = "[s9] \"うん？\"\n[s10] \"何か異常が？\""
"10040030-27-コユキ" = "この建物に誰か出入りしましたね。#n人感センサーでブザーが鳴る設定になっているんです。"
"10040030-28-コユキ" = "ふっふっふっ。反省部屋で快適な生活を送るのなら、セキュリティシステムは万全にしないといけないでしょう？"
"10040030-29-コユキ" = "でもおかしいですね。こんな時間に一体誰が……。"
"10040030-30-コユキ" = "カメラで見てみますか！"
"10040030-31-コユキ" = "どれどれ……。"
"10040030-32-コユキ" = "……？"
"10040030-33-コユキ" = "え、ええええええ……！？"
"10040030-34" = "[ns11] \"……コユキ？\"\n[ns12] \"どうしたの？\""
"10040030-35-コユキ" = "ど……。"
"10040030-36-コユキ" = "どうして先輩たちが！？"
"10040030-37" = "[ns13] \"ユウカとノア！？\"\n[ns14] \"帰ったんじゃなかったの！？\""
"10040030-38-コユキ" = "そ、想定外なんですけど！？#nなんで？どうして？なんのために……！？"
"10040030-39-コユキ" = "と、とりあえずカードを隠さなきゃ……！！"
"10040030-40-コユキ" = "せ、先生は……どうしましょう……！？"
"10040030-41" = "[s15] \"早く逃げないと！\"\n[s16] \"ここにいるのがバレたら……！\""
"10040030-42-コユキ" = "やっぱりバレたら……マズいですよね……。"
"10040030-43-コユキ" = "言い訳も思いつきませんし……。"
"10040030-44-コユキ" = "となると……。"
"10040030-45-コユキ" = "……先生！"
"10040030-46-コユキ" = "ここです！ここなら大丈夫です！！"
"10040030-47-コユキ" = "早く隠れてください！"
"10040030-48-コユキ" = "それで先輩たちの隙を見計らって、逃げてください！"
"10040030-49-コユキ" = "それしか手はないです！"
"10040030-50-コユキ" = "……不安ですか？"
"10040030-51-コユキ" = "大丈夫ですって！"
"10040030-52-コユキ" = "私がいるんですから、何とでもなります！"
"10040030-53-コユキ" = "だから隠れて！もう時間ないですよ！"
"10040030-54-コユキ" = "はやく！"
"10040030-55-コユキ" = "あ、あれぇ！？#nこれはこれは……！"
"10040030-56-コユキ" = "先輩がたじゃないですか。どうしてここに……？"
"10040030-57-ユウカ" = "……何よ、そんなに驚くことないじゃない。"
"10040030-58-ノア" = "年末に一人ぼっちのコユキちゃんのために、#nユウカちゃんが一肌脱いでくれたんですよ。"
"10040030-59-ノア" = "ここから出すわけにはいきませんけど……。"
"10040030-60-ノア" = "一緒にパジャマパーティーならできますよね。"
"10040030-61-ユウカ" = "そういうこと。ほんと、世話の焼ける後輩なんだから。"
"10040030-62-ユウカ" = "はい、これに着替えて。"
"10040030-63-コユキ" = "何ですか、これ。"
"10040030-64-コユキ" = "……パジャマ？"
"10040030-65-ノア" = "可愛いですよね。ユウカちゃんが選んだんですよ。"
"10040030-66-ユウカ" = "そ、そうは言ってないじゃない……！"
"10040030-67-ユウカ" = "……？"
"10040030-68-ユウカ" = "あんまり嬉しくなさそうね……。"
"10040030-69-コユキ" = "い、いえ！#nすっごく嬉しいです！！"
"10040030-70-コユキ" = "と、ところで……#nえっと、お二人は今日、ここに泊まってく感じです？"
"10040030-71-ユウカ" = "そうだけど、なんか嫌そうね。せっかく来てあげたのに。"
"10040030-72-ノア" = "喜んでもらえると思っていたのですが……。"
"10040030-73-ノア" = "……あら。"
"10040030-74-ノア" = "ふふっ……"
"10040030-75-ノア" = "……そういうこと、でしたか。"
"10040030-76-ユウカ" = "ノア……？"
"10040030-77-ノア" = "……ここは任せてください、ユウカちゃん。"
"10040030-78-ノア" = "何か隠してますね、コユキちゃん？"
"10040030-79-コユキ" = "……な、なんのことでしょう？"
"10040030-80-ノア" = "……そこの段ボール、さっきと位置が違いますよね？"
"10040030-81-コユキ" = "……へ？"
"10040030-82-コユキ" = "ど、どうしてそんなこと覚えてるんですか！"
"10040030-83-ユウカ" = "また何か隠してるのね！#n退きなさい、コユキ！"
"10040030-84-コユキ" = "ま、まずいっ！お願いします、先輩！これだけは……！#n来年まででいいので……！"
"10040030-85-ユウカ" = "なんで来年の話になるのよ……！"
"10040030-86-ユウカ" = "……これは？"
"10040030-87-ユウカ" = "カード……？"
"10040030-88-コユキ" = "え、えっと……その、ですね……。"
"10040030-89-ノア" = "……これを隠してたんですね？"
"10040030-90-ユウカ" = "…………。"
"10040030-91-ユウカ" = "コ～ユ～キ～！"
"10040030-92-コユキ" = "うあああああぁぁぁっ！"
"10040030-93-コユキ" = "それだけは許してください！そのカード、マジで高いんですよ……！"
"10040030-94-コユキ" = "あ、ああああ！お願いしますお願いしますお願いします！！"
"10040030-95-ユウカ" = "あんたねぇ……反省する気全然ないじゃない！？"
"10040030-96-コユキ" = "あ、ああああああああっ！"
"10040030-97-コユキ" = "き、緊急脱出！"
"10040030-98-ユウカ" = "ちょっと！待ちなさいってば！"
"10040030-99-ユウカ" = "ごめんノア、手伝って！"
"10040030-100-ユウカ" = "あの子、パジャマ持って逃げたわ！！"
"10040030-101-ノア" = "ふふっ。年末だというのに、こうなっちゃいましたか。"
"10040030-102-ノア" = "思いがけないことが起こると、つい胸が弾んじゃいますね。"
"10040030-103" = "[ns] \"コユキ……。\""
"10040030-104" = "[ns17] \"……忘れないよ。\"\n[ns18] コユキの幸運を祈る。"
"10040030-105" = "[ns] \"今のうちに脱出しないと……。\""
"10040030-106" = "[ns19] \"……あれ、ドアに鍵が？\"\n[ns20] \"こっちもだ……。\""
"10040030-107-？？？" = "……事情はだいたい分かってます。"
"10040030-108-？？？" = "パジャマパーティーをすると聞いて動向をうかがっていましたが……#nまさか、先生もご一緒だったなんて。"
"10040030-109-コタマ" = "……これは予想外ですが、テンションが上がってきました。"
"10040030-110" = "[s21] \"コタマ！？\"\n[s22] \"どうして私の居場所を？\""
"10040030-111-コタマ" = "もちろん盗聴――ではなく、ヴェリタスの技術を活用したまでです。"
"10040030-112-コタマ" = "見たところ、反省部屋のドアが開かなくて困っているようですね。"
"10040030-113-コタマ" = "反省部屋は問題児を閉じ込めるために造られた施設――#nですので内側からは開かないようオートロックが掛かっています。"
"10040030-114-コタマ" = "コユキさんなら簡単に解除できるでしょうけど……#n自力での脱出なんて普通は不可能です。"
"10040030-115-コタマ" = "……ですが、ご心配なく。"
"10040030-116-コタマ" = "ミレニアムの外まで安全に脱出できるルートを、#n私たちがご案内します。"
"10040030-117" = "[s] \"……ほかにも誰かいるの？\""
"10040030-118-コタマ" = "はい、隣にハレが。"
"10040030-119-コタマ" = "副部長も認める天才ハッカーが協力するのですから。#nセキュリティシステムをかいくぐって無事脱出できるはずです。"
"10040030-120-ハレ" = "待って、コタマ先輩。#nこれ以上トラブルは起こさないほうが……。"
"10040030-121" = "[ns23] \"……また盗聴してたの。\"\n[ns24] \"コタマ、今回ばかりは私も――\""
"10040030-122-ハレ" = "……そういえば、シャーレの年末調整が未提出のようですね。"
"10040030-123-コタマ" = "出すものも出さず、反省部屋で遊んでいただなんて話がユウカさんの耳に入ったら……。"
"10040030-124-コタマ" = "ずいぶん賑やかな年越しになりそうですね。"
"10040030-125" = "[ns] \"……何が欲しいの？\""
"10040030-126-コタマ" = "先生の声を録音したモーニングコール、十種類。"
"10040030-127-コタマ" = "台本はこちらで用意します。#n先生は収録にご協力いただくだけで構いません。"
"10040030-128-コタマ" = "これならハレも協力してくれますよね。"
"10040030-129-コタマ" = "先生の声で目を覚ませるのは、たしかに魅力的な提案だけど……。"
"10040030-130" = "[ns25] \"他に手はなさそうだし……。\"\n[ns26] \"……ちゃんとお説教もするからね。\""
"10040030-131-コタマ" = "約束は守ってくださいね。"
"10040030-132-コタマ" = "ハレ、反省部屋のロックを解除してください。"
"10040030-133-ハレ" = "本当に良いのかな……。"
"10040030-134-ハレ" = "とりあえず、解除できたよ。"
"10040030-135-ハレ" = "気をつけて移動してね、先生。#nコユキが逃げてるから、追加のセキュリティシステムが稼働してる。"
"10040030-136-ハレ" = "それと、もし誰かに遭遇しちゃったら……#nハッキングじゃ助けられないから。"
"10040030-137-コタマ" = "ひとまず廊下に出て、私たちがいる休憩室まで来てください。#n誰かが近づいたら、すぐに報告します。"
"10040030-138-コタマ" = "先生の周囲で鳴る音は全て把握していますから。ふふっ……。"
"10040030-139" = "[s27] \"盗聴器の数、おかしくない！？\"\n[s28] \"あとで本当にお説教だからね！\""
"10040030-140-コタマ" = "先生の生声を聞けるなら、甘んじて受け入れますよ。"
"10040030-141-コタマ" = "……今のも悪くないですね。モーニングコールの台本に、罵倒セリフも入れましょうか。"
"10040030-142-ハレ" = "悠長に話してる場合じゃないみたい。#n誰かがそっちに向かってるよ、先生。"
"10040030-143-ハレ" = "すぐにそこを離れて。"
