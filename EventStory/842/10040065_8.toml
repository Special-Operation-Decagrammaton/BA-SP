[translation]
"10040065-1-コユキ" = "はぁ、はぁ……。"
"10040065-2-コユキ" = "ほんと、もうダメかと思いましたよ……。"
"10040065-3" = "[s1] \"今日は走ってばっかりだね。\"\n[s2] \"ある意味で反省させられてるのかも……。\""
"10040065-4-コユキ" = "ところでヴェリタスの二人と連絡は取れますか？#n地下の深いところは、通過したはずですし。"
"10040065-5-コユキ" = "そろそろ連絡が来てもいい頃なんじゃ？"
"10040065-6-コユキ" = "あれ、もしかして道を間違えちゃいました……？"
"10040065-7-コユキ" = "はっ……！それとも……！"
"10040065-8-ハレ" = "ちゃんと聞こえてます。#n二人とも、無事たどり着けたようですね。"
"10040065-9-コタマ" = "あとはそこのドアから地上に出れば、脱出完了です。"
"10040065-10-コタマ" = "ほかにもいくつか出口はありますが、#n最も使用頻度が少ないのはそこです。"
"10040065-11-ハレ" = "いろいろ大変だったけど、なんとかたどり着けたね。"
"10040065-12-ハレ" = "じゃあ、マキにドアを開けるように連絡するよ。"
"10040065-13-ハレ" = "って、あれ……。"
"10040065-14-ハレ" = "今、何か音しなかった……？"
"10040065-15" = "[s3] \"……音？\"\n[s4] \"何も聞こえなかったけど。\""
"10040065-16-ハレ" = "あ、そっちじゃなくて……。"
"10040065-17-ハレ" = "……！？"
"10040065-18-ハレ" = "……？"
"10040065-19-ハレ" = "ふ……。"
"10040065-20-ハレ" = "……副部長！？"
"10040065-21-ハレ" = "……ど、どうしてここに！！"
"10040065-22-コタマ" = "いえ違います、これは……！！"
"10040065-23" = "[ns5] \"チヒロ……！？\"\n[ns6] \"ハレ！コタマ！大丈夫！？\""
"10040065-24-ハレ" = "こ、これは……！秘密……！"
"10040065-25-コタマ" = "まさか……！くっ、罠でしたか！#nこんな策をめぐらしていたなんて……！"
"10040065-26-ハレ" = "とりあえず、逃げて……！"
"10040065-27-コタマ" = "うああっ……！"
"10040065-28-コユキ" = "え、え～っと……。"
"10040065-29-コユキ" = "せ、先生、これって……。"
"10040065-30-コユキ" = "あ、ドアが開きますよ……！"
"10040065-31-コユキ" = "あっちでトラブルがあったみたいですけど、仕方ないですって、先生！#nひとまず、逃げないと……！"
"10040065-32-コユキ" = "マキさんと合流して、脱出を……！"
"10040065-33-コユキ" = "……？"
"10040065-34-コユキ" = "あれれ、これって……？"
"10040065-35" = "[s7] \"……コユキ！？\"\n[s8] \"……どうしたの？\""
"10040065-36-コユキ" = "その、何だか……。"
"10040065-37-コユキ" = "すごく、嫌な予感がですね……。"
"10040065-38-コユキ" = "…………。"
"10040065-39-コユキ" = "……ふふ。"
"10040065-40-コユキ" = "ふふふ、ふふふふふっ……。"
"10040065-41-コユキ" = "にはは……結局こうなっちゃうんですね。"
"10040065-42" = "[ns9] \"……コユキ！？\"\n[ns10] （うおっ……）"
"10040065-43-コユキ" = "……しっ。"
"10040065-44-コユキ" = "ここなら見つかりませんから。"
"10040065-45-コユキ" = "時間がないので、ひと言だけ。"
"10040065-46-コユキ" = "先生……。"
"10040065-47-コユキ" = "……どうか、ご無事で。"
"10040065-48-？？？" = "コ～ユ～キ～～～！！"
"10040065-49-ユウカ" = "ただでさえ忙しい年末に！"
"10040065-50-ユウカ" = "またトラブルを起こしてくれちゃって！"
"10040065-51-ユウカ" = "今日という今日は絶対に許さないんだから！！"
"10040065-52-ユウカ" = "覚悟しなさいっ！！"
"10040065-53-コユキ" = "ぎやあああぁぁぁああっ！"
"10040065-54-コユキ" = "私のこと、忘れないでくださぁぁぁいっ！！！"
"10040065-55" = "[ns] \"…………。\""
"10040065-56" = "[ns11] コタマに指示されていた扉へ向かう。\n[ns12] コユキに感謝の祈りを捧げる。"
"10040065-57" = "[ns] \"……？\""
"10040065-58" = "[ns13] \"……あれ？\"\n[ns14] \"また足音が聞こえたような……。\""
"10040065-59" = "[ns] 再び歩きだす。"
"10040065-60" = "[ns] 歩く速度を上げる。"
"10040065-61" = "[ns] 音を出さず静かに歩く。"
"10040065-62" = "[ns] \"…………。\""
"10040065-63" = "[ns] 全力で走る。"
