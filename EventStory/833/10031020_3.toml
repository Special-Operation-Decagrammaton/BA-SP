[translation]
"10031020-1" = "第2話;準備開始"
"10031020-2" = "（ゲヘナのパーティーの準備を手伝うことになった翌日、マコトから連絡が来た）"
"10031020-3-マコト" = "クククッ。昨日も言ったように、今回のパーティー開催を記念し、我々万魔殿は新議事堂を建設した。"
"10031020-4-マコト" = "そこで先生には、新議事堂の竣工式に立ち会ってもらいたいのだ。"
"10031020-5" = "[s] \"分かったよ、これから向かうね。\""
"10031020-6-マコト" = "キキキッ。では、待っているぞ。"
"10031020-7-マコト" = "クククッ……"
"10031020-8-マコト" = "キキキキキキキキキッ！！！"
"10031020-9-マコト" = "これで[USERNAME]先生の協力は得られた。"
"10031020-10-マコト" = "ただ来てもらうだけではない……先生の手を借りねばならない状況を作り出し、我々万魔殿とシャーレの関係を誇示する映像を撮影するのだ。"
"10031020-11-マコト" = "クククッ。その映像をキヴォトス中で配信すれば、万魔殿とシャーレの協力関係を知らしめることができるだろう！"
"10031020-12-マコト" = "そうすれば、万魔殿の影響力はさらに強まるに違いない……！"
"10031020-13" = "[ns] \"えっと、マコト……まだ繋がってるよ。\""
"10031020-14-マコト" = "なっ…………"
"10031020-15-マコト" = "こ、これは……いや、違うのだ先生、その……"
"10031020-16" = "[s] \"撮影は断らせてもらうね。\""
"10031020-17-マコト" = "こ、この私の偉大な計画が…………！"
"10031020-18-マコト" = "ぐっっっ……！し、し、仕方ない……"
"10031020-19-マコト" = "ひとまず、ゲヘナで先生を待っている。"
"10031020-20" = "[ns] \"みんな、すごく忙しそうだね。\""
"10031020-21-マコト" = "キキキッ。それくらい今回のパーティーは重要な意味を持っているのだ。"
"10031020-22" = "[s] \"あ、マコト。\""
"10031020-23-マコト" = "歓迎する、先生。"
"10031020-24-マコト" = "約束したとはいえ、まさかここまで快く万魔殿に協力してくれるとは……#nあらためて感謝しよう、キキッ。"
"10031020-25" = "[s1] \"うん、協力するって約束したからね。\"\n[s2] \"もちろん、撮影は断らせてもらうけど。\""
"10031020-26-マコト" = "ぐっ……！そ、それは……！"
"10031020-27-マコト" = "…………と、とにかく重要なのは過去ではなく未来！"
"10031020-28-マコト" = "過ぎ去った出来事を振り返るよりも、これからの壮大な未来について語り合った方が建設的だろう。そうは思わないか、先生も！"
"10031020-29" = "[s] （思いっきり話を逸らされたような……）"
"10031020-30" = "[ns] \"議事堂の竣工式ってことは……議事堂を新しく建てたの？\""
"10031020-31-マコト" = "ああ、その通りだ。"
"10031020-32-マコト" = "パーティーを開くついでに、どうせなら施設を拡充しようと思ってな。"
"10031020-33-マコト" = "ちなみに今回のパーティー会場も議事堂内にあるぞ……クックック……"
"10031020-34" = "[s] \"だからこんなしっかりとした竣工式を……\""
"10031020-35-マコト" = "たとえばコンビニやゲームセンター、本屋、ネットカフェ、コインランドリーなどなど……"
"10031020-36-マコト" = "せっかくだから、風紀委員会の奴らが聞けば頭を悩ますような施設を作る予定だ！"
"10031020-37-マコト" = "今後、万魔殿の新議事堂は、ゲヘナの新たな文化的アイコンとして名を知られていくだろう！"
"10031020-38" = "[s] \"議事堂というよりも、大型ショッピングモールのような……？\""
"10031020-39-マコト" = "キキキッ！特にこの私が一番オススメする場所は……#n今回、最も多くの予算を投入した特別施設……"
"10031020-40-マコト" = "そう、「特別温泉」だ！#nこれはゲヘナの皆が使えるよう、議事堂の裏側に建設するよう命じておいた！"
"10031020-41" = "[s] \"そんなに大規模な施設を作ったんだね。\""
"10031020-42-マコト" = "キシシシッ！そうだ！！それだけこのマコト様は、今回の新議事堂建設に力を入れ、イロハやサツキ、チアキ、そしてイブキと共に準備をしてきた！"
"10031020-43-マコト" = "これを見た風紀委員会の奴らが、一体どんな顔をするのか楽しみでしかたない……#nキキキキキキッ！！！"
"10031020-44" = "[s] \"ちなみに温泉はどこに発注したの……？\""
"10031020-45-マコト" = "ん？それはもちろん……"
"10031020-46-マコト" = "ゲヘナの温泉開発部だが？"
"10031020-47" = "[ns] \"…………あっ。\""
"10031020-48-マコト" = "い、いきなり何事だ！？"
"10031020-49-マコト" = "た、大変です！議長……！"
"10031020-50-マコト" = "その、計画していた温泉の件なのですが……！"
"10031020-51-マコト" = "また何か問題か……？"
"10031020-52-万魔殿の部員B" = "なっ……！？"
"10031020-53-マコト" = "お、お前たちは……！"
"10031020-54-メグ" = "やっほ～！温泉開発部だよ～！"
"10031020-55-メグ" = "ん？#n見覚えのある顔だと思ったら、先生じゃあないか。"
"10031020-56-メグ" = "万魔殿の議長と一緒だなんて、これまた珍しい組み合わせだな。"
"10031020-57" = "[s] \"こんにちは。メグ、それにカスミも。\""
"10031020-58-メグ" = "やほやほ～先生！"
"10031020-59-メグ" = "うむ。思いがけない出会いだな、先生。"
"10031020-60-メグ" = "それはそうと……今回の依頼主のマコト議長とは、あなたで合っているか？"
"10031020-61-マコト" = "あ、ああ……そうだが？#n温泉の開発を依頼したはずなのに、なぜここで騒ぎを起こしているのだ？"
"10031020-62-マコト" = "こんなところに開発を依頼した覚えは無いぞ？#nどういうつもりだ、温泉開発部よ。"
"10031020-63-カスミ" = "なんだ、そんなことか。"
"10031020-64-カスミ" = "たしかに依頼されたのは、新議事堂の裏に新しい温泉施設を建てることだったが……"
"10031020-65-カスミ" = "なんと……！裏側ではなく駐車場に！"
"10031020-66-カスミ" = "もっっっと素晴らしい泉脈の気配を感じたのだ！"
"10031020-67" = "[s] \"えっと……ちなみに、その根拠は？\""
"10031020-68-カスミ" = "先生よ、今さらそんな質問をするのか？"
"10031020-69-カスミ" = "そりゃあ、私の勘に決まっているじゃあないか！"
"10031020-70-メグ" = "部長やみんなと話して……はいないけど！#nなんとなくビビッときたんだ！"
"10031020-71-メグ" = "ただ依頼に従うだけでは、専門家を名乗っていられんと思ってな！"
"10031020-72-メグ" = "な、何を言っている！ここで間もなく竣工式を始めるところなのだが！？"
"10031020-73-カスミ" = "そうなのか？"
"10031020-74-カスミ" = "私たちには関係ない話だな。#n依頼されたのは、最高の温泉施設開発。"
"10031020-75-メグ" = "となれば、その要望に最大限応えるのが我々温泉開発部の役目。"
"10031020-76-カスミ" = "まあ、場所なんて気にするな。"
"10031020-77-カスミ" = "ハーハッハッハッハ！いざ温泉が出来上がれば、マコト議長も喜ぶに違いない！#nここは温泉の専門家に任せておくといい！"
"10031020-78" = "[s] \"……こうなる気はしてたよ。\""
"10031020-79-カスミ" = "さあ！全員！掘って掘って掘りまくれ！#n温泉開発の時間だ！"
"10031020-80-温泉部の部員" = "みんな、掘るよ～！"
"10031020-81-マコト" = "くううっ！ほ、放っておくものか！#nこのマコト様の竣工式を邪魔しようとは、いい度胸だ！"
"10031020-82-マコト" = "お、お前たち！止めろ！"
"10031020-83" = "[ns] \"ちょ、ちょっと……みんな落ち着いて……\""
"10031020-84-カスミ" = "温泉ができれば、みんな落ち着く！"
"10031020-85-メグ" = "うんうん！温泉は心の糧？暗黒？安息をもたらしてくれるからね～！"
"10031020-86-マコト" = "く、くうううっ！！ど、どうしてこんな事態に……！#n私ともあろう者が、一体どこで間違えてしまったんだ～～！？"
"10031020-87" = "[s] \"……温泉開発部に依頼した時点じゃないかな？\""
"10031020-88-カスミ" = "ハーハッハッハッハ！！！温泉開発だ！爆破だ！全部キレイにして、ゲヘナの生徒全員に1人1温泉を……！"
"10031020-89-カスミ" = "…………………………………………。"
"10031020-90" = "[ns] \"い、今のは……！\""
"10031020-91-ヒナ" = "こちらでトラブルが発生しているとの通報を受けて来たのですが……"
"10031020-92-ヒナ" = "……これは一体どういう状況？"
"10031020-93" = "[s] \"ヒナ、アコ……！\""
"10031020-94-ヒナ" = "……先生？"
"10031020-95-ヒナ" = "えっ！？どうして先生がこんなところに……？"
"10031020-96-マコト" = "ええいっ！ヒナめ……！#n今日は我々万魔殿が建設した新しい議事堂の竣工式だというのに……！"
"10031020-97-マコト" = "まさか、お前……このマコト様の邪魔をしに来たのか……！"
"10031020-98" = "[s] \"むしろ助けに来てくれたような……？\""
"10031020-99-マコト" = "ええい！風紀委員長の助けなど要らない！"
"10031020-100-マコト" = "あいつに助けられるくらいなら、議事堂の駐車場に温泉ができるくらい……！"
"10031020-101-マコト" = "で、できるくらい……受け入、れ……う……"
"10031020-102-マコト" = "いや……やはり妥協などできん……！"
"10031020-103" = "[s] \"そこは譲れないんだね……\""
"10031020-104-ヒナ" = "私たちも別に万魔殿を助けたくて来たわけではありませんよ！？"
"10031020-105-ヒナ" = "あくまで、温泉開発部が暴れているという報告を受けて来ただけ。"
"10031020-106-ヒナ" = "いつものようにトラブルを対処するだけとはいえ……#n助ける相手が万魔殿なのは癪ですね……"
"10031020-107-ヒナ" = "まずは、この騒ぎを収めよう。#n先生、何か言うことはある？"
"10031020-108" = "[s] \"……ありません。\""
"10031020-109-ヒナ" = "分かった。"
"10031020-110-ヒナ" = "全員、準備をしてください！"
"10031020-111-風紀委員たち" = "はいっ……！"
"10031020-112-温泉部の部員A" = "……風紀委員会が戦闘態勢に入った！"
"10031020-113-メグ" = "うわあっ～！ど、どうしよう、カスミ部長！"
"10031020-114-メグ" = "ひ、ひ、ひえええぇっ！！！"
"10031020-115-メグ" = "あっ！カスミ部長がパニックを起こしちゃったよ！"
"10031020-116-温泉部の部員B" = "風紀委員長が出てくると、部長はいつもこうだから……"
"10031020-117-メグ" = "緊急事態だよ！みんな、とりあえず応戦して！！"
"10031020-118-ヒナ" = "！！！！！"
