[translation]
"10031030-1" = "第3話;議長の要求"
"10031030-2-メグ" = "うーーーん！やっぱりダメだったね！#n風紀委員会だけで一苦労なのに、相変わらず強いね、ヒナ委員長！"
"10031030-3-カスミ" = "（ぶるぶるぶるぶる……）"
"10031030-4-温泉部の部員C" = "ど、どうすれば！"
"10031030-5-メグ" = "うーん、部長は大変な状態だし……"
"10031030-6-メグ" = "みんな、撤退～！逃げるよ～！"
"10031030-7-メグ" = "みんな、30分後にアジトで集まろう！"
"10031030-8-ヒナ" = "……！アコ、追いかけるよ。"
"10031030-9-ヒナ" = "はい！委員長……！"
"10031030-10-マコト" = "ちょっと待ちたまえええ！！"
"10031030-11-ヒナ" = "な、何ですか！？マコト議長！"
"10031030-12-マコト" = "周りをよく見ろ！#nお前たちが何をやらかしたのか……！"
"10031030-13" = "[ns] \"議事堂、壊れちゃったね……\""
"10031030-14-アコ" = "だからどうしたんですか？"
"10031030-15-マコト" = "だからどうした、だと……！？"
"10031030-16-マコト" = "お前たち風紀委員会が暴れたせいで、竣工式すらできずに壊れてしまったじゃないか！"
"10031030-17-マコト" = "どう責任を取ってくれるんだ！"
"10031030-18-アコ" = "はい？責任転嫁も程がありませんか！？"
"10031030-19-アコ" = "それは、あなたが温泉開発部になんか仕事を依頼したからでしょう？"
"10031030-20-マコト" = "それで？"
"10031030-21-アコ" = "はい……？"
"10031030-22-マコト" = "それはもう終わったことだろう！"
"10031030-23" = "[s] \"……うわぁ。\""
"10031030-24-マコト" = "とにかく風紀委員会のせいだ！#nまったく、シャーレの先生も立ち会うはずだったのにな！"
"10031030-25-マコト" = "こうなった以上、責任は取ってもらうぞ……風紀委員会！"
"10031030-26-マコト" = "いや！風紀委員長！[ruby=そらさき]空崎[/ruby]ヒナ！"
"10031030-27-マコト" = "お前も組織のリーダーとして、責任を取るべきだろう！"
"10031030-28-マコト" = "いえ、委員長！#nこんな戯言に耳を貸す必要はありません！"
"10031030-29" = "[s] \"マコト、いくら何でもそれは……\""
"10031030-30-ヒナ" = "……分かった。それで、あなたは私にどうしてほしいの？"
"10031030-31-アコ" = "委員長！？"
"10031030-32" = "[ns] \"ヒナ……？\""
"10031030-33-ヒナ" = "……ん？こうもすんなりと行くとは……"
"10031030-34-ヒナ" = "もちろん、意図したものではないけど、私たちのせいで被害が生じたのも事実だから。"
"10031030-35-ヒナ" = "しかも先生の仕事を邪魔することになったのだから……#n私にも責任はある。"
"10031030-36-ヒナ" = "それで、マコト議長……私にどう責任を取ってほしいの？"
"10031030-37-ヒナ" = "う、うーーん。そうだな……"
"10031030-38-マコト" = "（ヒナの奴、いつもと違ってこちらの要求をあっさり受け入れるとは……理由はよく分からないが……）"
"10031030-39-マコト" = "（これも良い機会だ……！今こそ万魔殿と風紀委員会の上下関係をはっきりさせてやろう！）"
"10031030-40-マコト" = "（どうすれば、風紀委員会の鼻をへし折って、このマコト様の威厳を知らしめられるのか……！）"
"10031030-41-マコト" = " （そういえば、今回のパーティーではピアノの演奏を予定していたな……）"
"10031030-42-マコト" = "（キキキッ！それなら……！）"
"10031030-43-マコト" = "ククッ……ククククッ……クククククッ！！！！"
"10031030-44" = "[s] \"すごく嫌な気配がするような……\""
"10031030-45-アコ" = "い、委員長！#nそんな簡単に約束をしては大変なことになるかもしれませんよ！？"
"10031030-46-ヒナ" = "いいの、アコ。もう決めたことだから。"
"10031030-47-アコ" = "し、しかし……！"
"10031030-48-ヒナ" = "……先生に迷惑をかけたくはないから。"
"10031030-49" = "[s] \"ひ、ヒナ……！\""
"10031030-50-アコ" = "そんな……委員長。"
"10031030-51-マコト" = "ククククッ！決めたぞ！"
"10031030-52-アコ" = "きっと、またとんでもない要求を……！"
"10031030-53-マコト" = "ああ、心配するな。私も馬鹿ではない。#nあくまで現実的な要求をするとしよう。"
"10031030-54-ヒナ" = "現実的な要求？"
"10031030-55-マコト" = "そうだ。#nお前には、このマコト様が用意しているパーティーを手伝ってもらおうじゃあないか！"
"10031030-56-アコ" = "パーティー……ああ、そういえば万魔殿が準備していると情報がありましたね。"
"10031030-57-アコ" = "何を企もうと勝手ですが……委員長のことを巻き込まないで頂けますか！？"
"10031030-58-マコト" = "はっ、何を言っている天雨アコ。私たちはただ素晴らしいパーティーを開こうとしているだけだ。"
"10031030-59-マコト" = "そこにいる、先生の協力を得た上でなぁ！キキキッ！"
"10031030-60-ヒナ" = "……先生、そうなの？"
"10031030-61" = "[s] \"う、うん。まあ成り行きで……\""
"10031030-62-マコト" = "ああ、進んで手伝ってくれているとも！しかも先生は、今回のパーティーをとても楽しみにしている！何せ、このマコト様のパーティーなのだからな！"
"10031030-63-ヒナ" = "先生が、パーティーを楽しみに……"
"10031030-64" = "[s] \"期待……してなくはない、かな……うん。\""
"10031030-65-マコト" = "そんなパーティーを台無しにするところだったのだ。#nだからお前には、この埋め合わせをしてもらう！"
"10031030-66-ヒナ" = "埋め合わせ、って……具体的には何をすれば？"
"10031030-67-マコト" = "（今こそ万魔殿のスパイが手に入れた情報を活用する時……！）"
"10031030-68-マコト" = "風紀委員長、空崎ヒナ！"
"10031030-69-マコト" = "お前には、オープニングのピアノ演奏を担当してもらおうじゃないか！"
"10031030-70-アコ" = "……はい？"
"10031030-71-ヒナ" = "ピアノ、演奏……？"
"10031030-72-マコト" = "クククッ！そうだ！演奏だ！"
"10031030-73-マコト" = "（どうやら風紀委員長は、泳げないうえにピアノを弾けないらしいからな！）"
"10031030-74-アコ" = "委員長のピアノ……！"
"10031030-75-アコ" = "たしかに、それなら私も撮影を……い、いえ！#nぜひ聴いてみたいですが！"
"10031030-76-アコ" = "しかし……そんな無茶はさすがに……！"
"10031030-77-マコト" = "一度承諾した以上、まさか断りはしないだろう？"
"10031030-78-ヒナ" = "…………。"
"10031030-79" = "[s] \"ヒナ、無理に受ける必要は無いからね。\""
"10031030-80-ヒナ" = "……先生。"
"10031030-81-ヒナ" = "気を遣ってくれてありがとう。でも、もう約束したから。"
"10031030-82-ヒナ" = "私が被害を与えたのは事実だし……#n先生もパーティーを楽しみにしているのなら……"
"10031030-83-ヒナ" = "私も、ゲヘナの風紀委員長として……えっと、その……"
"10031030-84-ヒナ" = "先生の期待には応えたい、から……"
"10031030-85-ヒナ" = "……分かった。#nマコト議長、あなたの要求を受け入れる。"
"10031030-86-マコト" = "ほ、本当か！？"
"10031030-87-マコト" = "うむ……"
"10031030-88-マコト" = "いや！もちろんそう言うと思っていた！#n風紀委員長に二言は無いからな！"
"10031030-89-マコト" = "では、引き受けたという認識で準備を進めておくとしよう！"
"10031030-90-ヒナ" = "じゃあ、まずは温泉開発部を追わせてもらう。"
"10031030-91-ヒナ" = "放っておくと、またトラブルを起こすだろうから。#n急いで仕事を終えて、早くピアノの練習を……"
"10031030-92-ヒナ" = "……アコ、行こう。"
"10031030-93-アコ" = "あ、えっと……い、委員長！？"
"10031030-94-マコト" = "……本当に引き受けるとはな。"
"10031030-95-マコト" = "……ふっ。"
"10031030-96-マコト" = "ふふふっ……クククッ、キキキキキッ！"
"10031030-97-マコト" = "これは良いものが見られそうだ……！"
"10031030-98-マコト" = "自分で言ったのだから、逃げるわけにはいかないだろう！#n風紀委員長、空崎ヒナ……！"
"10031030-99" = "[ns] \"……本当に大丈夫かな。\""
