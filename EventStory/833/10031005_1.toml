[translation]
"10031005-1" = "プロローグ;顔合わせ"
"10031005-2-？？？" = "……ククッ、クククッ。"
"10031005-3" = "万魔殿・執務室"
"10031005-4-マコト" = "ククッ、キキキッ……"
"10031005-5-マコト" = "キキキキッ！歓迎する！シャーレの先生よ！よくぞ来てくれた！"
"10031005-6" = "[s] \"あ、うん。大事な用があるって言われたから……\""
"10031005-7" = "[ns] \"でも、どうして呼ばれたのか知りたいんだけど……\""
"10031005-8-マコト" = "キシシッ。ああ、そうだろうとも。"
"10031005-9-マコト" = "この私から連絡をもらった先生は、ずっと悩んでいたに違いない。"
"10031005-10-マコト" = "ついに、この日がやって来てしまった……#nもしかして隠された真意があるのではないか？"
"10031005-11-マコト" = "もっと準備をしておくべきだったのではないか、と思っただろう。"
"10031005-12" = "[s] \"いや、別に……\""
"10031005-13-マコト" = "ああ、言わずとも良い！#nこのマコト様は全て分かっている！"
"10031005-14-マコト" = "組織のトップとは、慎重に慎重を期さねばならないもの。"
"10031005-15-マコト" = "キキキッ！恥ずかしがることは無い！"
"10031005-16-マコト" = "それだけ今日の話し合いがもたらす影響は、衝撃的かつ劇的だからな！"
"10031005-17" = "[s3] \"そうだね……？\"\n[s4] \"えっと、何を言ってるのかよく分からないんだけど……\""
"10031005-18-マコト" = "ああ！何を隠そう！"
"10031005-19-マコト" = "今日この場に先生を呼んだのは、この間の提案に対する返事を聞くため！"
"10031005-20-マコト" = "キキキッ！果たして先生は、どう返事をす――"
"10031005-21-マコト" = "マコト先輩～！#nイブキ、おんぶしてほしい～"
"10031005-22-マコト" = "ああ、分かった。イブキ、ちょっと待ってくれ。"
"10031005-23" = "[ns] \"…………。\""
"10031005-24-マコト" = "……ふむ、どこまで話してたか？"
"10031005-25-マコト" = "はいは～い！#n先輩の提案に対する返事を聞こうとしてるとこでしたよ～！"
"10031005-26-マコト" = "あ、ああ……そうだったな。助かったぞ、チアキ。"
"10031005-27-チアキ" = "は～い。"
"10031005-28-チアキ" = "こほん、では本題に戻って……"
"10031005-29-チアキ" = "そこで先生よ！#nぜひ直接、その口から返事を聞かせてもらおうじゃないか！"
"10031005-30-マコト" = "……んしょ、よいしょ。"
"10031005-31" = "[ns5] \"マコトの提案……？\"\n[ns6] （あまりにも大量に届いてたから、何の話か分からない……）"
"10031005-32-マコト" = "ああ、私としたことが気が利かなかったようだな。"
"10031005-33-マコト" = "いくら返事を聞くためとはいえ、顔を合わせた途端いきなり迫っては礼儀に反そう。"
"10031005-34-マコト" = "物事には順序が大切だと言いたいのだな。"
"10031005-35" = "[s] \"ん……？\""
"10031005-36-マコト" = "いえ、マコト先輩。"
"10031005-37-イロハ" = "マコト先輩が好き勝手にしゃべっているせいで、先生が困惑しているように見えますが。"
"10031005-38-マコト" = "やれやれ、イロハ。何も分かってないな。"
"10031005-39-マコト" = "キキキッ、先生の目を見ろ。あれはリーダーの目だ。#n誰かの上に立つ者しか持たない。"
"10031005-40-マコト" = "あの鋭い眼光の持ち主が、ただ困惑しているとでも？"
"10031005-41-マコト" = "この万魔殿のリーダー[ruby=はぬま]羽沼[/ruby]マコト様は見抜いている！#nあの目に隠された意志を！"
"10031005-42-マコト" = "……だそうです、先生。"
"10031005-43" = "[s] \"イロハ、ありがとね……\""
"10031005-44-イロハ" = "はぁ……まったく。"
"10031005-45-マコト" = "キキキッ！"
"10031005-46-マコト" = "先生の気持ちくらい、この私も理解しているとも！"
"10031005-47-マコト" = "だからここは、私も礼儀や慣習を尊重し……"
"10031005-48-マコト" = "改めて、先生に提案させてもらおう！"
"10031005-49-マコト" = "さあ、[USERNAME]先生よ……！"
"10031005-50-マコト" = "我々万魔殿と……いや、このマコト様と手を組まないか！"
"10031005-51-マコト" = "よいしょ……んっしょ……"
"10031005-52" = "[ns] \"……何かと思ったら、その話だったんだね。\""
"10031005-53-イロハ" = "まあ、私は何の話か伝わってないだろうと思っていましたが。"
"10031005-54-チアキ" = "わぁ、シャーレとの連携！先生とタッグを組む！いいですね！それ！最高です！"
"10031005-55-イロハ" = "ククッ！今さら万魔殿の強大な力は説明するまでもないな！"
"10031005-56-イロハ" = "そんな我々と先生が手を組めば、まさに鬼に金棒と言っていいだろう！"
"10031005-57-マコト" = "誰も成し遂げられなかった――キヴォトス全土を手中に収めるという偉業も夢ではない！"
"10031005-58-マコト" = "キキキッ！そこで先生に約束をしよう……"
"10031005-59-マコト" = "我々が共にキヴォトスを手に入れた暁には……！"
"10031005-60-マコト" = "このマコト様は、キヴォトスの半分を……"
"10031005-61-マコト" = "半分、を……"
"10031005-62-マコト" = "…………。"
"10031005-63-マコト" = "……うーん。"
"10031005-64-マコト" = "いや、勢いで半分と言ってしまったが、それはちょっと多すぎるような……#n口約束にしても、じっくり検討する必要が……"
"10031005-65-マコト" = "そ、そうだ……！は、半分とまではいかないが、四捨五入で限りなく半分に近い面積をシャーレに譲ろうじゃないか！"
"10031005-66-マコト" = "どうだ、先生よ！この偉大なマコト様の提案は！"
"10031005-67" = "[ns] \"……えっ？\""
"10031005-68-イロハ" = "…………。"
"10031005-69-イブキ" = "よいしょ～っと！"
"10031005-70-チアキ" = "あはははっ！最初は勢いで半分譲ろうとしたのに、考え直しちゃうあたり……"
"10031005-71-チアキ" = "すっご～く、マコト先輩らしいね！イロハちゃん？"
"10031005-72-チアキ" = "……指摘するのも恥ずかしいので、あえてツッコまなかったんですよ。"
"10031005-73-マコト" = "ええい！そこ、うるさいぞ！#n無駄なおしゃべりはやめるのだ！"
"10031005-74-マコト" = "それでは先生、返事を……"
"10031005-75-イブキ" = "よいっ、しょ！えへへっ、マコト先輩～！#nイブキ、背中登りきったよ～！"
"10031005-76-マコト" = "お～、よしよし！えらいぞ、イブキ！"
"10031005-77-チアキ" = "わあ～！話の最中にマコト先輩の背中を登りきったイブキちゃん！#n今日も可愛さ100万ボルトだね！"
"10031005-78-チアキ" = "[ruby=もとみや]元宮[/ruby]チアキ、万魔殿の書紀として、絶対に記録しておかなきゃ！"
"10031005-79-チアキ" = "はいは～い！イブキ～ついでにマコト先輩も～はいチーズ！"
"10031005-80-イブキ" = "チ～ズ～"
"10031005-81-マコト" = "ククッ、チーズだ……！"
"10031005-82-イロハ" = "チアキ。その写真、後で私にもください。"
"10031005-83-チアキ" = "もちろんだよ～！"
"10031005-84-マコト" = "キキキキッ。#nそれで[USERNAME]先生よ、返事を聞かせてもらいたいのだが。"
"10031005-85" = "[s7] \"せっかく提案してくれたのに申し訳ないんだけど……\"\n[s8] \"ごめんね、断らせてもらうよ。\""
"10031005-86-マコト" = "なん、だと……！？"
"10031005-87-マコト" = "ど、どうしてだ……先生！#nこのマコト様の提案ほど魅力的なものは存在しないはずだが！"
"10031005-88-マコト" = "何かやむを得ない事情でもあるのか？#nそれとも条件が気に入らな――"
"10031005-89-マコト" = "あははっ！#nやっぱり、半分譲ろうって言いかけて変えたからじゃないですか？"
"10031005-90-マコト" = "や、やはりそうか………！"
"10031005-91-イロハ" = "いや、それは違うと思いますが。"
"10031005-92-マコト" = "しかし、イロハ！#nでなければ、一体なぜ……"
"10031005-93" = "[s] \"シャーレの大掃除をするから忙しいんだ、ごめんね。\""
"10031005-94-イブキ" = "わあ～マコト先輩～！たか～い！"
"10031005-95-チアキ" = "……。"
"10031005-96-イロハ" = "…………。"
"10031005-97-マコト" = "………………。"
"10031005-98-マコト" = "では、仕方あるまい。"
"10031005-99-マコト" = "予定があるのなら、無理にこちらの要求を押し付けるわけにはいかないな。#n今日のところは、大人しく引き下がるとしよう。"
"10031005-100-イロハ" = "え！？マコト先輩はあれで納得したんですか！？"
"10031005-101-マコト" = "ん？何を言ってるんだ、イロハ。"
"10031005-102-マコト" = "要求を一方的に押し付けるなど、ただの暴君ではないか。"
"10031005-103-マコト" = "真のリーダーとは、相手の意志を尊重し、柔軟に対応するもの。"
"10031005-104-マコト" = "……ただし、風紀委員会は除くがな！"
"10031005-105-マコト" = "覚えておくといい、イロハ……キキッ。"
"10031005-106-イロハ" = "あ、はい……"
"10031005-107-チアキ" = "あははっ！マコト先輩らしいね～！#nみんなで記念に写真撮ろっか！"
"10031005-108-サツキ" = "はぁ……回りくどい言い方をしても意味が無いんじゃない？"
"10031005-109-サツキ" = "忘れているようだけど、シャーレの先生を味方にしたいのなら確実な方法があると思うのだけど？"
"10031005-110-マコト" = "なっ、サツキ……まさか、お前……！"
"10031005-111-サツキ" = "ええ、そうよマコトちゃん。私のNKウルトラ計画の力を使えば……"
"10031005-112-サツキ" = "説得なんてしなくても、味方に引き入れられるわ！"
"10031005-113-サツキ" = "うふふっ！先生！これを見て頂戴！"
"10031005-114-サツキ" = "さあ……あなたは段々、万魔殿に忠誠を誓いたくなぁ～る。"
"10031005-115-サツキ" = "ついでに、近くに新しくできたスイーツ店でプリンを買ってきたくなぁ～る。"
"10031005-116" = "[ns] \"え、うーん、そんな気持ちになってきたような……？\""
"10031005-117-サツキ" = "うふふ。ほら、効いてきたでしょう？"
"10031005-118-イブキ" = "サツキ先輩～イブキもやってみた～い！"
"10031005-119-イブキ" = "コインを持って～ふりふり～#n先生は毎日、たーくさんイブキと遊びたくな～る！"
"10031005-120-イブキ" = "あら。よくできたわね、イブキちゃん。"
"10031005-121-イブキ" = "将来はNKウルトラ計画を担うこと間違いなしだわ！"
"10031005-122-イブキ" = "ボーッとしてる場合じゃないわよ、チアキ！"
"10031005-123-チアキ" = "は～いっ！#n万魔殿の書記として、シャッターチャンスは逃しませんよ！"
"10031005-124-イロハ" = "……見ての通り、これが万魔殿の日常です。"
"10031005-125-イロハ" = "なんか……先生に見られると、恥ずかしくなってきますね。"
"10031005-126" = "[s] \"そう？私は平和でいいと思ったよ。\""
"10031005-127-イロハ" = "平和、ですか。"
"10031005-128-イロハ" = "まあ、たしかに平和ではありますね……"
"10031005-129" = "#video;10031"
