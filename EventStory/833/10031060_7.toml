[translation]
"10031060-1" = "第6話;議長の決断"
"10031060-2" = "（パーティー準備4日目。万魔殿に向かう前にシャーレの仕事を片付けていると、イロハから連絡が届いた）"
"10031060-3-イロハ" = "先生……"
"10031060-4" = "[s] \"マコトじゃなくてイロハからの連絡だなんて珍しいね。\""
"10031060-5-イロハ" = "それがですね……マコト先輩は連絡が取れない状態というか……"
"10031060-6-イロハ" = "いや、連絡が取れないどころか……どうしようもない状態というか……#nまあ、どうしようもないのは、いつものことなんですが……"
"10031060-7-イロハ" = "とりあえず、約束の時間より早いですが、万魔殿に来ていただけますか？"
"10031060-8" = "[s] \"………？\""
"10031060-9" = "（そうして、少し急いで万魔殿を訪れると……）"
"10031060-10-マコト" = "……。"
"10031060-11" = "[s] \"マコト……！何があったの？\""
"10031060-12-マコト" = "ごきげんよう、先生。"
"10031060-13-マコト" = "今日はお早いですね。ふふっ、お会いできて嬉しいです。"
"10031060-14" = "[ns1] \"イロハ！マコトが壊れちゃったよ！？\"\n[ns2] \"どうして困ってるのか一瞬で理解したよ！\""
"10031060-15-イロハ" = "……分かってくれましたか。"
"10031060-16-イロハ" = "あの状態のマコト先輩、変というか正直ちょっと怖くない……？"
"10031060-17-イブキ" = "マコト先輩、だいじょうぶ～？"
"10031060-18-マコト" = "ふふっ、イブキ。私は大丈夫ですよ。"
"10031060-19-マコト" = "あ、そうでした。今回のパーティーのために用意した特別な茶葉があります。#nいかがですか、先生？"
"10031060-20-イブキ" = "イブキはココアがいい～"
"10031060-21-マコト" = "はい、ココアも良いですね。"
"10031060-22-サツキ" = "………………。"
"10031060-23" = "[ns] \"えっと……何があったのか聞かせてもらえる？\""
"10031060-24-イロハ" = "……それがですね。"
"10031060-25" = "（事件発生3時間前）"
"10031060-26-マコト" = "この私の広報計画を邪魔するとは……！#nくっ、風紀委員会の奴らめ！"
"10031060-27-イロハ" = "いや、いくら何でもアレは無理がありましたよね……"
"10031060-28-チアキ" = "でも、それなりに話題になってたみたいですし、成功したと言ってもいいんじゃないですか？騒がれてたのは本当ですし～"
"10031060-29-マコト" = "ダメだ……！このままでは今回のパーティーで我々と風紀委員会の上下関係を知らしめる私の計画に支障が……"
"10031060-30-マコト" = "チアキ！今、風紀委員会の奴らは何をしている！？"
"10031060-31-マコト" = "え～っと、パーティーの日に備えて、臨時の訓練を行なってるみたいですね。"
"10031060-32-マコト" = "なるほど……ヒナのピアノの練習時間は確実に奪えているのだな。"
"10031060-33-チアキ" = "しかし、それだけでは足りない。念には念を入れなくては。"
"10031060-34-マコト" = "このゲヘナで誰が真の権力を持つリーダーなのか、頂点を立つに値する者なのか……ゲヘナの全生徒はもちろん、シャーレの[USERNAME]先生にも印象付けるためには……"
"10031060-35-マコト" = "ええいっ！イロハ、アレを持ってこい！"
"10031060-36-イロハ" = "アレって……何のことですか。"
"10031060-37-マコト" = "あ、そうだった。アレはイロハじゃなくて、サツキに準備させていたか……"
"10031060-38-イロハ" = "今度はサツキ先輩に何を準備させたんですか……？"
"10031060-39-チアキ" = "あははっ！#nマコト先輩が何かすると、すぐ不安がるのイロハちゃんらしいね！"
"10031060-40-イロハ" = "はぁ、いったい何を……"
"10031060-41-サツキ" = "うふふ。大丈夫よ、マコトちゃん。"
"10031060-42-サツキ" = "NKウルトラ計画の改良版なら完成したわ！"
"10031060-43-イロハ" = "……はい？改良って本当に何の話ですか？"
"10031060-44-サツキ" = "ふふ。今までは万魔殿に忠誠を誓いたくなるようにしていたけれど……"
"10031060-45-サツキ" = "今度はマコトちゃんの要望に合わせてチューニングしておいたのよ。"
"10031060-46-サツキ" = "そう、リーダーに対する愛と尊敬心を増幅させるようにね！"
"10031060-47-マコト" = "クククッ！流石はサツキだ！この私の要望にきちんと応えてくれるとは！#n改良されたサツキの催眠術を使えば……"
"10031060-48-マコト" = "たとえ風紀委員会だろうと、皆この偉大なマコト様に敬意を抱くはず！"
"10031060-49-イロハ" = "……いや、だから説明をしてもらいたいんですが。"
"10031060-50-マコト" = "よし、まずはイロハで試すとしよう！#nチアキ！イブキ！イロハを捕まえろ！"
"10031060-51-イロハ" = "はいっ？！な、何をするんですか！？"
"10031060-52-チアキ" = "は～い！喜んで～っ！#nごめんね、イロハちゃん。#n部下は上司の言葉に従うものだから！"
"10031060-53-チアキ" = "イロハ先輩～！鬼ごっこだよ～！"
"10031060-54-チアキ" = "ちょ、ちょっと！？い、イブキまで……！"
"10031060-55-マコト" = "クククッ。イロハ、お前の中に眠る私に対する愛と尊敬心を増幅してやろう！"
"10031060-56-イロハ" = "私にそんな言葉を言ってる時点で、仮に愛と尊敬心があったとしても無くなるとは思わないんですか……？"
"10031060-57-マコト" = "さあ！サツキ！"
"10031060-58-サツキ" = "大丈夫よ、イロハ。今よりもちょっとだけマコトちゃんを大好きになるだけだから！"
"10031060-59-イロハ" = "ま、待ってくださ……！"
"10031060-60-サツキ" = "うふふ、行くわよ！"
"10031060-61" = "[ns] \"……つまり、イロハにかけようとした催眠がマコトに？\""
"10031060-62-イロハ" = "……はい、日頃のバチが当たったんでしょう。"
"10031060-63-チアキ" = "まぁ、このままでも無害だし、放置しててもいいんじゃない？"
"10031060-64-チアキ" = "……ずっとこのままだと流石に困るけど。"
"10031060-65-イブキ" = "イブキは今のマコト先輩も好き～"
"10031060-66-マコト" = "ふふ、私もイブキはもちろん、万魔殿の皆さん……#nそして先生も大好きですよ。"
"10031060-67-チアキ" = "……ちょっと怖くなってきたね。"
"10031060-68-サツキ" = "……マコトちゃんのこんな姿を風紀委員会に知られたら、大変なことになるんじゃない？"
"10031060-69-サツキ" = "特に、あの行政官が知ったら……果たして何が起こるのやら。"
"10031060-70-チアキ" = "そういえば、マコト先輩が「パーティーの安全がかかっている以上、ピアノの練習は訓練を終えてからにしろ！[ruby=そらさき]空崎[/ruby]ヒナ！」"
"10031060-71-チアキ" = "「この私が万魔殿の議長として、しっかり全ての訓練を見届けてやる！」とか何とか言ったせいで、訓練場に行かなきゃいけないんですよね？"
"10031060-72-サツキ" = "……！#n今のマコトちゃんが出ていったら、全面戦争が起こるかもしれないわよ！？"
"10031060-73" = "[s] \"いくら何でも、全面戦争は言い過ぎじゃ……\""
"10031060-74-イロハ" = "風紀委員長はともかく、行政官は……密かにやり返す機会を狙っているはずですよ？#nそれでも先生は、何も起こらないと思いますか？"
"10031060-75" = "[s] \"……考えるのは止めておこうかな。\""
"10031060-76-チアキ" = "あははっ～！そこで日和っちゃうんだ、先生！"
"10031060-77-マコト" = "風紀委員会……？"
"10031060-78-イブキ" = "ん？マコト先輩、どうしたの～？"
"10031060-79-マコト" = "…………そうでした。#n私たち万魔殿と風紀委員会は、これまでいがみ合ってきましたね。"
"10031060-80-マコト" = "そう、まさに犬猿の仲と呼ばれるような関係。"
"10031060-81-マコト" = "その原因は何だろうと考えたところ……一つの解決策が浮かびました。"
"10031060-82" = "[s] \"何が原因だと思ったの？\""
"10031060-83-マコト" = "ええ。全ては万魔殿と風紀委員会の存在が悪かったのです。"
"10031060-84-イロハ" = "……はい？"
"10031060-85-マコト" = "組織が存在するせいで不毛な争いが発生するくらいなら……#nそれによって、生徒たちが混乱してしまうくらいなら……"
"10031060-86-マコト" = "私は議長の権限を行使し、万魔殿と風紀委員会の解散を宣言します！"
"10031060-87-イブキ" = "ココア、おいしい～"
"10031060-88" = "[ns] \"マコト…………？\""
"10031060-89-マコト" = "そうと決まれば、こうしている場合ではありません。#n早く全生徒に告知し、新しい時代を迎えなくては……！"
"10031060-90-マコト" = "ええ、そうです……#nこれ以上、争いを続けたところで何も得られないのですから！"
"10031060-91-マコト" = "全てはゲヘナの平和のために！"
"10031060-92-イロハ" = "ちょ、ちょ、ちょっと待ってください！？マコト先輩！？"
"10031060-93-チアキ" = "あはははっ！！！"
"10031060-94-サツキ" = "……あのままだと平和を実現する前に、ゲヘナが跡形も無くなるわよ？"
"10031060-95" = "[s] \"ま、マコト！待って！\""
"10031060-96" = "（その後、走っていったマコトを捕まえて、どうにか催眠を解いた）"
