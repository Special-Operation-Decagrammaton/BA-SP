[translation]
"10031040-1" = "第4話;議長の哲学"
"10031040-2" = "（パーティー準備2日目も、マコトから連絡が届いた）"
"10031040-3-マコト" = "ああ、先生。私たちのパーティーも、着々と準備が進んできたな。"
"10031040-4-マコト" = "風紀委員長は……おそらく今頃ピアノの練習にかかりきりだろう、キキッ。"
"10031040-5-マコト" = "パーティー当日が今から楽しみだ。"
"10031040-6" = "[s] \"ヒナはパーティーのために、きっと頑張ってるよ。\""
"10031040-7-マコト" = "ほう……？"
"10031040-8-マコト" = "ふん。まあ、風紀委員長が醜態を晒すのも、それなりの余興になるだろうが……"
"10031040-9-マコト" = "キキキッ。#n私にはパーティーを成功させるという重大な責任があるのだ！"
"10031040-10-マコト" = "先生よ。パーティーといえば、何が重要だろうか？"
"10031040-11" = "[s1] \"パーティーを開く意味、とか……？\"\n[s2] \"うーん……やっぱり料理は大切じゃないかな？"
"10031040-12-マコト" = "……なるほど。先生の言うことにも一理がある。"
"10031040-13-マコト" = "パーティーとは、単に開けば良いわけではない。そこに意味を持たせられるかどうかに、優れたリーダーとしての資質が試されている、と……"
"10031040-14-マコト" = "そう言いたいのだな？"
"10031040-15" = "[s3] \"いや、そこまでは……\""
"10031040-16-マコト" = "まあ、それなら心配ない。このパーティーは、このマコト様がいかに偉大なのか、これまで我々万魔殿が行なってきた偉業の数々が、いかに素晴らしいものなのか。"
"10031040-17-マコト" = "それを皆に証明する重要なパーティーだからな！キシシッ！"
"10031040-18-マコト" = "となれば……この偉大なマコト様に相応しい料理を振る舞わなくては！"
"10031040-19-マコト" = "キキキキキッ！たしかに、その通りだ！"
"10031040-20-マコト" = "パーティーに参加する者を満足させるには、料理も欠かせないな。"
"10031040-21-マコト" = "実は私もそう思って、給食部にケータリングを発注しておいたのだ。"
"10031040-22-マコト" = "今日は試作品を食べて、このマコト様のパーティーで出すに値するか品評を行なう予定になっている。"
"10031040-23-マコト" = "先生にもアドバイスをもらいたいのだが、ゲヘナまで来てくれるか？"
"10031040-24" = "[s] \"うん、大丈夫だよ。すぐに向かうね。\""
"10031040-25-マコト" = "クククッ。それでは待っているぞ。"
"10031040-26" = "（こうして、マコトに呼ばれてゲヘナのパーティー会場にやって来た）"
"10031040-27" = "[ns] \"想像以上に本格的だ……\""
"10031040-28" = "（パーティー会場を見渡し、マコトを探していると……）"
"10031040-29-イロハ" = "……はぁ、これは一体どういうことですか。"
"10031040-30-イロハ" = "もしかして……またサツキ先輩が何かしたとか？"
"10031040-31-サツキ" = "ち、違う！濡れ衣よ！こ、今回に関しては何もしてないわ！"
"10031040-32-イロハ" = "え～まあ、いいんじゃないですか？#nこういう情熱的なマコト先輩も！"
"10031040-33-サツキ" = "むしろ普段の姿とギャップがあって、みんなからウケると思う！#n私の書記魂が燃えてきたよ！"
"10031040-34-チアキ" = "あっ！これで次の万魔殿定期新聞のタイトルは決まったも同然ね！#nもしかしたら、すごい反響を呼ぶかも！"
"10031040-35-チアキ" = "ねえ、イロハちゃん？"
"10031040-36-イロハ" = "……あんな姿が……反響を、ですか？"
"10031040-37-イロハ" = "チアキ、忠告しておきます。#n本気でそう思ったのなら、あなたのセンスを見直した方がいいですよ。"
"10031040-38-チアキ" = "うわっ、ひっど～い！"
"10031040-39" = "[s] \"えっと……みんな集まってどうしたの？\""
"10031040-40-イブキ" = "あっ！先生だ！"
"10031040-41-イブキ" = "先生！それがね～ええっと……！マコト先輩がね～！"
"10031040-42" = "[s] \"マコト……？\""
"10031040-43-マコト" = "…………。"
"10031040-44-マコト" = "私たちは……"
"10031040-45" = "[s] \"私たち……？\""
"10031040-46-マコト" = "私たちは、なぜ苦しみながら生きるのか！"
"10031040-47-マコト" = "理由は簡単だ！そう、幸せになるため！"
"10031040-48-マコト" = "幸せとは、人生の根源的な目標である！"
"10031040-49-マコト" = "まさに人の一生は、幸せを叶えるために存在しているのだ！"
"10031040-50-マコト" = "そして私は考えた！幸せを得るために、人は何をするべきなのか。"
"10031040-51-マコト" = "絶えず考えた……！"
"10031040-52-マコト" = "私は考える……！故に私は存在するのだと！"
"10031040-53-イブキ" = "存在するうぅ～！"
"10031040-54-イブキ" = "存在する～っ！"
"10031040-55" = "[ns] \"え、えっと……イロハ？\""
"10031040-56-イロハ" = "……急にマコト先輩の様子がおかしくなったんです。"
"10031040-57-サツキ" = "おかしくなった、で済ませていいレベルなの？#nマコトちゃん、完全に別人だけど？"
"10031040-58-イロハ" = "別人になったというか、一夜にして覚醒したというか……"
"10031040-59" = "[s] \"……うん？\""
"10031040-60-イロハ" = "いずれにせよ、正常な状態ではありません。"
"10031040-61-イロハ" = "あんなマコト先輩の姿、想像しただけでもゾッとするのに……#nそれが今、私たちの目の前に存在してるだなんて。"
"10031040-62-イロハ" = "……これは悪夢ですか？"
"10031040-63-サツキ" = "ええ、悪夢に違いないわね。"
"10031040-64" = "[s] \"二人とも容赦ないね……\""
"10031040-65-イロハ" = "マコト先輩が悟りを開いて、人生の真理に到達しようと思った可能性は無くも……#nいえ、無いですね。"
"10031040-66-イロハ" = "あの、念のため聞きたいんですが……#nマコト先輩は何か拾い食いでもしたんですか？"
"10031040-67-万魔殿の部員B" = "あ、そういえば実はさっき……"
"10031040-68-万魔殿の部員B" = "拾い食いではありませんが、給食部に依頼した料理の試作品を召し上がっていました。"
"10031040-69-イロハ" = "……給食部から渡された料理？"
"10031040-70-万魔殿の部員C" = "はい、どうやら給食部の部長が不在だったそうで……"
"10031040-71-万魔殿の部員A" = "代わりの方が試作品を作ったとは聞いています。"
"10031040-72" = "[ns] \"……あっ。\""
