[translation]
"10048030-1" = "第3話;誰が紫、青を愛でるのか"
"10048030-2" = "――前日。"
"10048030-3" = "ワイルドハント自治区の外れ、とあるカフェ"
"10048030-4-フユ" = "あの……あなたが「特殊交易部」の営業室長、ですよね？"
"10048030-5-フユ" = "ふふっ、ええ。そうです。"
"10048030-6-フユ" = "どうぞおかけください。"
"10048030-7-依頼人" = "ああ、はい。"
"10048030-8-依頼人" = "あの……本当に、なんでも手に入れてくれるんですか？"
"10048030-9-フユ" = "ええ、「交易」が仕事ですから。"
"10048030-10-フユ" = "実績については……「これまで失敗したことはない」とだけ言っておきます。"
"10048030-11-依頼人" = "おお……！"
"10048030-12-フユ" = "では、さっそく本題に入りましょう。"
"10048030-13-フユ" = "何をお求めですか？#n今まで、学院外の方から依頼を受けたことはなかったもので。"
"10048030-14-依頼人" = "ええと……これを交易と言っていいのか、少々悩ましいのですが。 "
"10048030-15-依頼人" = "……ワイルドハントの、とある絵画を持ち出していただきたいのです。 "
"10048030-16-フユ" = "……。"
"10048030-17-フユ" = "……この話は、なかったことに。"
"10048030-18-依頼人" = "ちょっ、ちょっと！まずは最後まで話を……！"
"10048030-19-フユ" = "――それはただの窃盗です。"
"10048030-20-フユ" = "そういったことは[ruby=うち]特殊交易部[/ruby]ではなく、強盗部や怪盗部にでもお願いしてください！"
"10048030-21-依頼人" = "なっ、そんな部活が！？"
"10048030-22-フユ" = "あるわけないでしょう！"
"10048030-23-フユ" = "は、話だけでも聞いてもらえませんか！#nお返事はそれからでも……！"
"10048030-24-フユ" = "……分かりました。"
"10048030-25-依頼人" = "……私は画家をやっておりまして。"
"10048030-26-依頼人" = "今はそれなりに名前も売れ、生活もできていますが……。"
"10048030-27-依頼人" = "若い頃は違いました。"
"10048030-28-依頼人" = "当時は、生きるために仕事を選ぶ余裕はなく……。"
"10048030-29-依頼人" = "その一つとして――"
"10048030-30-依頼人" = "[ruby=がんさく]贋作[/ruby]を描いていたんです。"
"10048030-31-フユ" = "贋作を……？"
"10048030-32-依頼人" = "ええ。有名な作品を忠実に模倣した絵を、高額で売っていたんです。"
"10048030-33-依頼人" = "他の仕事であれば気にすることはなかったのですが……。"
"10048030-34-依頼人" = "贋作を生み出したことだけは……ずっと心から消えないのです。"
"10048030-35-依頼人" = "自分の過去を……正したい……そう思っているんです。"
"10048030-36-フユ" = "……それと今回の依頼に、何の関係が？"
"10048030-37-依頼人" = "今度開かれる、ワイルドハントの「ベロニカ特別展」……。"
"10048030-38-依頼人" = "そこに、私が描いた贋作も展示される予定なのです。"
"10048030-39-フユ" = "……！"
"10048030-40-フユ" = "つまり……ベロニカ財団が所蔵する絵の中に、あなたの贋作が混ざっていると？"
"10048030-41-依頼人" = "はい。あちらは真作だと思っているのでしょうが。"
"10048030-42-フユ" = "ちなみに、どのような絵ですか？"
"10048030-43-依頼人" = "それは……。"
"10048030-44" = "[log=시민 동물6 의뢰인]『誰が紫、青を愛でるのか』です。[/log]"
"10048030-45-フユ" = "あの絵を！？"
"10048030-46-依頼人" = "おお、ご存じなのですね。"
"10048030-47-依頼人" = "今までは作品の名を言っても、通じない方がほとんどでした。"
"10048030-48-依頼人" = "ワイルドハントの生徒であれば、知らないわけがありません。"
"10048030-49-フユ" = "美術史を学んだ者なら、みな一度は目にしていますよ。"
"10048030-50-依頼人" = "……ふふ。#n久しぶりに教養のある方と出会えて、安心しました。"
"10048030-51-依頼人" = "ほとんどの方は、そのような知識すらありませんから。"
"10048030-52-依頼人" = "……ともかく、私が生み出してしまった『誰が紫、青を愛でるのか』の贋作が、#n「ベロニカ特別展」で展示されるわけです。"
"10048030-53-フユ" = "つまり……その絵を持ち出してほしい、と？"
"10048030-54-依頼人" = "ええ。"
"10048030-55-フユ" = "正直に申し上げて、非常に難しいです。 "
"10048030-56-フユ" = "なんとか持ち出せたとしても、それが発覚すれば……#n学院全体を巻き込んだ騒ぎとなるでしょう。"
"10048030-57-フユ" = "真贋の前に、美術品の盗難事件が起きるのですから。"
"10048030-58-フユ" = "……いっそのこと、財団側に贋作であると伝えてみてはいかがでしょう？"
"10048030-59-依頼人" = "依頼内容は少し違います。#n私は、あの絵の真作を持っているのです。"
"10048030-60-フユ" = "……はい？"
"10048030-61-依頼人" = "少し前、地下オークションで『誰が紫、青を愛でるのか』の真作を買いました。"
"10048030-62-依頼人" = "こちらです。"
"10048030-63-フユ" = "……！"
"10048030-64-依頼人" = "私の願いは一つ。#n贋作を持ち出し、真作をその場所に置いてほしいのです。"
"10048030-65-依頼人" = "それであれば、さほど騒ぎにはならないかと。"
"10048030-66-フユ" = "真作があるのなら、なおさら財団側に伝えた方が良いのではないでしょうか……？"
"10048030-67-依頼人" = "いえ。私は、贋作を描いた画家として名を残したくはありません。"
"10048030-68-依頼人" = "……ただ、自分の過ちを正したいだけ。"
"10048030-69-依頼人" = "もちろん、大衆に真贋を見抜くことは難しいでしょう。"
"10048030-70-依頼人" = "ですが……私はどうしても、過去の汚点を消し去りたい。"
"10048030-71-依頼人" = "どうでしょうか……受けていただけますか？"
"10048030-72-フユ" = "……正直、まだ引っかかることがあります。"
"10048030-73-フユ" = "もし、その展示会に飾られる絵が……本物だとしたら？"
"10048030-74-依頼人" = "私を信じてもらえないのでしょうか。"
"10048030-75-フユ" = "信用するには、まだ根拠が不足しています。"
"10048030-76-フユ" = "あなたの言葉が嘘だった場合、私たちは本物を偽物とすり替えることになります。"
"10048030-77-フユ" = "私の専攻は絵画ではありませんが――"
"10048030-78-フユ" = "芸術に身を置くものですから。簡単に引き受けるわけにはいきません。"
"10048030-79-依頼人" = "では、これならいかがでしょう？"
"10048030-80-依頼人" = "持ち出した贋作の処分は、そちらにお任せします。"
"10048030-81-依頼人" = "保管するも燃やすもご自由に。\n世間に公開しなければ、どう扱っても構いません。"
"10048030-82-フユ" = "は……！？"
"10048030-83-依頼人" = "考えてもみてください。ベロニカが本物を所有しているなら、#n私がこのような提案をすると思いますか？"
"10048030-84-依頼人" = "紛れもない贋作だと知っているからこそ、お願いしているのです。"
"10048030-85-依頼人" = "いかがでしょう、信用していただけますか？"
"10048030-86-フユ" = "……。"
"10048030-87" = "[log]そして現在。[/log]"
"10048030-88" = "[ns] \"そんな依頼を受けていたんだ……。\""
"10048030-89-ミヨ" = "それで結局どうしたんですか？"
"10048030-90-フユ" = "ふふっ……。"
"10048030-91-ミヨ" = "ちょっと、これ……。"
"10048030-92-ミヨ" = "『誰が紫、青を愛でるのか』……！本当に！？"
"10048030-93-リツ" = "おー。"
"10048030-94-リツ" = "綺麗だね。"
"10048030-95-ミヨ" = "こんな間近で見られるなんて……。"
"10048030-96-ミヨ" = "……本当に本物！？"
"10048030-97-フユ" = "もちろん。"
"10048030-98-ミヨ" = "……ちょっと待って。"
"10048030-99-ミヨ" = "これをフユが持ってるってことは……まさかオッケーしたんですか！？"
"10048030-100-フユ" = "……いや。"
"10048030-101-ミヨ" = "えっ？"
"10048030-102-フユ" = "いくら営業室長とはいえ、この規模の仕事を独断で決めるのは……ねえ？ "
"10048030-103-フユ" = "だから、部長と相談してから連絡するって伝えてるよ。"
"10048030-104-ミヨ" = "じゃあどうしてこれを……。"
"10048030-105-フユ" = "これは依頼人から押し付けられたというか……。"
"10048030-106-フユ" = "でも、ミヨが嫌ならすぐに返してくるよ。"
"10048030-107-ミヨ" = "……。"
"10048030-108-フユ" = "気が引けるのもわかるけど……。"
"10048030-109-フユ" = "でも、考えてもみてよ。"
"10048030-110-フユ" = "贋作と真作をすり替えるだけだよ？#nなにも盗むわけじゃない。"
"10048030-111-フユ" = "それに、これを見て。"
"10048030-112-フユ" = "今回の報酬額は――なんと。"
"10048030-113-ミヨ" = "へっ……！？"
"10048030-114-フユ" = "ね？"
"10048030-115-リツ" = "ひゃあ……。"
"10048030-116-リツ" = "……カラカラ採石場の、一番高い大理石が買えちゃう！"
"10048030-117" = "[s] \"すごい金額だ……。\""
"10048030-118-フユ" = "ふっふーん……これが営業室長の腕ってやつです！"
"10048030-119-ミヨ" = "フユ、わかってますよね？"
"10048030-120-フユ" = "ん？なにが？"
"10048030-121-ミヨ" = "先生……まだここにいるんですが。"
"10048030-122-フユ" = "なんでいるんですか！？"
"10048030-123" = "[s] \"な、流れでそのまま……！\""
"10048030-124-フユ" = "え、えーと、これはその……。"
"10048030-125-フユ" = "……いや、慌てることじゃないですし！？"
"10048030-126-フユ" = "先生も、聞いていたなら分かりますよね！"
"10048030-127-ミヨ" = "でも、お金のために盗むことには変わりないでしょ……。"
"10048030-128-ミヨ" = "先生が見過ごすわけないですよ……。"
"10048030-129" = "[s] \"ううん、私は構わないと思っているよ。\""
"10048030-130-ミヨ" = "ええっ！？"
"10048030-131" = "[s1] \"だって、フユは特に問題ないと思ったんだよね？\" \n[s2] \"なら、みんなを信じようと思って。\""
"10048030-132" = "[ns] \"一応、見守らせてはもらうけど。\""
"10048030-133-ミヨ" = "せ、先生……。"
"10048030-134-ミヨ" = "先生まで、そうおっしゃるなんて……。"
"10048030-135-ミヨ" = "うぅぅ……。"
"10048030-136-フユ" = "イメージしてみよう、ミヨ！ "
"10048030-137-フユ" = "キューティーベリー87が、デスクの上にある光景を！"
"10048030-138-ミヨ" = "あんたは黙っててください！"
"10048030-139-ミヨ" = "（これで本当に最後……絶対絶対絶対、足を洗う……！）"
"10048030-140-ミヨ" = "分かりました。"
"10048030-141-ミヨ" = "……やりましょう。"
"10048030-142-ミヨ" = "……今回の「作品」を、書いてみます。"
