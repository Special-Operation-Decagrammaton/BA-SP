[translation]
"10048100-1" = "第10話;テストの結果"
"10048100-2" = "ワイルドハントの校門"
"10048100-3" = "（次の日の朝……）"
"10048100-4-観客A" = "すごい人混みだなー！"
"10048100-5-観客B" = "さすがベロニカの展示会……何時オープンだっけ？"
"10048100-6-観客C" = "みてみて、この絵も展示されるって！"
"10048100-7-観客C" = "うそ！？これ、教科書で見たことあるよ！"
"10048100-8" = "（ざわざわ）"
"10048100-9-依頼人" = "（……芸術を理解できないくせに、好き勝手盛り上がっているな）"
"10048100-10-依頼人" = "（ニセモノをありがたがるバカどもめ）"
"10048100-11-依頼人" = "（……あの頃を思い出すよ）"
"10048100-12-依頼人" = "（心血を注いだ私の作品を、非難していた評論家たち……）"
"10048100-13-依頼人" = "（あいつらは、私の描く贋作を褒め称えた）"
"10048100-14-依頼人" = "（絵そのものを見る者などいない）"
"10048100-15-依頼人" = "（興味があるのは、その向こうにある耳心地のいい情報だけ）"
"10048100-16-依頼人" = "（大衆は、ハナから審美眼など持ち合わせていないのだ……！）"
"10048100-17" = "[log=시민 동물6 의뢰인]そんなヤツらに――[/log]"
"10048100-18" = "[log=시민 동물6 의뢰인]真作を鑑賞する資格など、ない……！[/log]"
"10048100-19-依頼人" = "（だから私は、世界の名作を全てすり替えてやると決めたんだ）"
"10048100-20-依頼人" = "（無知な奴らの前に晒され、好き勝手に批評されるなど真作にとっては屈辱だろう）"
"10048100-21-依頼人" = "（……昨晩、特殊交易部からも連絡があった）"
"10048100-22-依頼人" = "（依頼を完了した、と）"
"10048100-23-依頼人" = "（……ふっ。いよいよ始まりだ）"
"10048100-24-依頼人" = "（せいぜい、贋作をありがたがるといい）"
"10048100-25-依頼人" = "（お前たちにはそれで十分だ……！）"
"10048100-26-依頼人" = "まもなくオープンします！"
"10048100-27-依頼人" = "あらかじめ、チケットをお手元にご用意ください！"
"10048100-28-依頼人" = "ふふっ……時間だな。"
"10048100-29-依頼人" = "さて、行くとするか……！"
"10048100-30" = "ベロニカ特別展・会場"
"10048100-31-観客たち" = "（ざわざわ……）"
"10048100-32-観客A" = "な、なんだ……？"
"10048100-33-観客B" = "えっ、何……？同じ絵が2枚？"
"10048100-34-観客C" = "でもあれって……有名な絵だよね？"
"10048100-35-観客C" = "え？わざとあんな展示の仕方をしてるのかな？"
"10048100-36-依頼人" = "何の騒ぎだ？"
"10048100-37-依頼人" = "みんな一か所に集まって……。"
"10048100-38-依頼人" = "いったいどうしたというんだ。"
"10048100-39-依頼人" = "ちょっと失礼。"
"10048100-40-観客C" = "なっ……なんだこれは！"
"10048100-41-依頼人" = "同じ絵が、同時に2枚……！？"
"10048100-42-依頼人" = "どっ、どういうことだ……！？"
"10048100-43" = "[log]昨晩――[/log]"
"10048100-44" = "ワイルドハント・空き地"
"10048100-45-慈愛の怪盗" = "……あなたは、誰のことも信じていないんですよね？"
"10048100-46-ミヨ" = "みんなには審美眼なんてない、と。"
"10048100-47-ミヨ" = "そうお考えなんですよね？"
"10048100-48-慈愛の怪盗" = "ええ――その通りです。"
"10048100-49-ミヨ" = "では、もう一つお聞きします。"
"10048100-50-ミヨ" = "あなたはその考えを、試してみたことはありますか？"
"10048100-51-慈愛の怪盗" = "試す？"
"10048100-52-ミヨ" = "はい。本当に観客は無知なのか、テストしてみませんか。"
"10048100-53-慈愛の怪盗" = "ふむ――独創的な発想ですね。興味深い。"
"10048100-54-慈愛の怪盗" = "いいでしょう。どのように試すのですか？"
"10048100-55-ミヨ" = "……『誰が紫、青を愛でるのか』の贋作と真作を、同じ場所に展示します。 "
"10048100-56-慈愛の怪盗" = "……！"
"10048100-57-ミヨ" = "最初、観客は混乱するはずです。 "
"10048100-58-ミヨ" = "でもしばらくして、ふたつのグループに分かれるでしょう。"
"10048100-59-ミヨ" = "ある方は本物の前に。また、ある方は偽物の前に……。"
"10048100-60-ミヨ" = "観客が確かな審美眼を持っていれば、本物の前にたくさんの方が集まるはずです。"
"10048100-61-ミヨ" = "……もしくは、半々に分かれるか。"
"10048100-62-慈愛の怪盗" = "……ふむ。"
"10048100-63-ミヨ" = "真作の前にたくさん集まれば、あなたが絵を盗む理由もなくなるはず。"
"10048100-64-ミヨ" = "観客は、自分たちの審美眼を証明したことになるのですから。"
"10048100-65-慈愛の怪盗" = "ふふ……そうですね。 "
"10048100-66-慈愛の怪盗" = "いいでしょう……その時は、私もこの絵を諦めます。"
"10048100-67-慈愛の怪盗" = "……でも、そうでなかったときは？"
"10048100-68-慈愛の怪盗" = "私の美学こそが正しいと証明された時――お嬢さんは何をしてくださるのですか？"
"10048100-69-ミヨ" = "……。"
"10048100-70-ミヨ" = "……今度、力をお貸しします。"
"10048100-71-ミヨ" = "特殊交易部の名をもって。"
"10048100-72-フユ" = "み、ミヨ……ミヨ！？それはあ、あまりにも危険すぎるよ！？"
"10048100-73-フユ" = "もしお客さんたちが、予想通りに動かなかったらどうするの！？"
"10048100-74-ミヨ" = "……でも、本物が盗まれるのをただ見てるよりはマシです。"
"10048100-75-慈愛の怪盗" = "いいでしょう――その賭けに乗りましょう。"
"10048100-76-慈愛の怪盗" = "お嬢さんの美学を尊重いたします。"
"10048100-77-慈愛の怪盗" = "絵の展示は私にお任せください。"
"10048100-78-ミヨ" = "……ありがとうございます。"
"10048100-79-慈愛の怪盗" = "――それでは、これにて失礼。"
"10048100-80-慈愛の怪盗" = "そう遠からず、別の姿でお会いする事になるでしょうけれど――ミヨさん。"
"10048100-81-慈愛の怪盗" = "……そして、先生も。"
"10048100-82" = "[s] \"またね、怪盗さん。\""
"10048100-83-リツ" = "怪盗さん、まったね～！"
"10048100-84-慈愛の怪盗" = "ふふっ……では、その時まで良い夢を。bye！"
"10048100-85-フユ" = "ミヨ！本物の方にみんな集まってる……！"
"10048100-86-フユ" = "勝ったんだよ、私たち！"
"10048100-87-フユ" = "……。"
"10048100-88-フユ" = "よ、よかっ……た……。"
"10048100-89-フユ" = "ミヨっ！？"
"10048100-90-フユ" = "ミヨちゃん！？"
"10048100-91-観客B" = "ふむ……こっちはなんか違うような。"
"10048100-92-観客B" = "同じ絵だけど……そうですね。"
"10048100-93-観客C" = "……私もこっちの方が好きかも。"
"10048100-94-観客C" = "わたしもわたしも。"
"10048100-95-依頼人" = "……。"
"10048100-96-依頼人" = "（なぜ……）"
"10048100-97-依頼人" = "（なぜ皆、本物の方に集まる？）"
"10048100-98-依頼人" = "（無知な奴らが、どうして本物に気がつくんだ！？）"
"10048100-99-依頼人" = "（それに、特殊交易部は確かに依頼を完了したと……！）"
"10048100-100-依頼人" = "失礼します。"
"10048100-101-依頼人" = "な、なんですか？"
"10048100-102-ミリア" = "『誰が紫、青を愛でるのか』の贋作制作の容疑がかかっております。ご同行願えますか。"
"10048100-103-依頼人" = "なっ、何だと！？"
"10048100-104-ミリア" = "詳しい話はあちらで。"
"10048100-105-ミリア" = "ですが、私たちはヴァルキューレではありませんので。あしからず。#n黙秘権は適用されません。"
"10048100-106-依頼人" = "ちっ、ちがう！私じゃない！！"
"10048100-107-依頼人" = "これは、特殊交易部……！そう！全部あいつらがやったんだ！"
"10048100-108-ミリア" = "……特殊交易部？"
"10048100-109-ミリア" = "ふふっ……。"
"10048100-110-依頼人" = "……？"
"10048100-111-ミリア" = "ワイルドハントにそんな組織はありません。"
"10048100-112-寮監隊員A" = "連れていけ。"
"10048100-113-依頼人" = "ちっ、違う！！私には使命が……#nバカな奴らから芸術を守る使命があるんだ――！"
"10048100-114-ミリア" = "今回は私の負けでしたね、後輩のみなさん。"
"10048100-115-ミリア" = "ですが――次の舞台では、加減などいたしませんよ。"
"10048100-116-ミリア" = "ふふっ、ご存じなのでしょう？先生。"
"10048100-117" = "[s] \"……まだ怪盗をやめるつもりはないんだね。\""
"10048100-118-ミリア" = "怪盗……何のことでしょうか？"
"10048100-119-ミリア" = "私は贋作を作った者を逮捕し、特殊交易部の存在を隠しただけの……。"
"10048100-120-ミリア" = "……ただの寮監隊員ですよ。"
"10048100-121" = "[s1] \"つまり……。\"\n[s2] \"ここでは、寮監隊員と先生でいたいってこと？\""
"10048100-122-ミリア" = "ふふ、そう受け取ってもらって構いません。"
"10048100-123-ミリア" = "ふむ……ですが、度を過ぎた時――先生は私を追うのでしょうか？"
"10048100-124-ミリア" = "……。"
"10048100-125-ミリア" = "それもかまいません。むしろ、先生になら……。"
"10048100-126-ミリア" = "先生が私を追いかけてくださることそのものが、美学だといえましょう。"
"10048100-127-ミリア" = "怪盗は……自らを捕らえてくれる探偵を待ち望んでいるものですから。"
"10048100-128" = "[s] \"ん？ちょっとよく聞こえなかったんだけど……。\""
"10048100-129-ミリア" = "……ふふっ、何でもありません。"
"10048100-130-ミリア" = "そういえば、今日は追加の業務がありまして。"
"10048100-131" = "[s] \"追加の……？\""
"10048100-132-ミリア" = "その……せ、先生の、展示会のガイドを……。"
"10048100-133-ミリア" = "本業務に、ご協力……願えませんでしょうか？"
"10048100-134" = "[s] \"うん、そういうことならよろしくね。\""
"10048100-135-ミリア" = "ふ、ふふっ……では。"
"10048100-136-ミリア" = "まず『誰が紫、青を愛でるのか』、こちらからご案内いたしましょう。"
