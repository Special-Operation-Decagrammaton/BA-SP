[translation]
"10048020-1" = "第2話;聞いてあげます"
"10048020-2" = "特殊交易部の寮内"
"10048020-3" = "[ns] \"だっ、誰を……いや、何を埋めたの！？\""
"10048020-4-ミヨ" = "わーっ！#nそ、そういうのじゃないんです！"
"10048020-5-ミヨ" = "種まき！種まきのことだよね、リッちゃん？"
"10048020-6-リツ" = "そそ！種まき終わりっ！"
"10048020-7-リツ" = "ミヨちゃんの言った通り、ちゃんと「植えて」きたよ！"
"10048020-8-フユ" = "う、うん！お疲れさま。"
"10048020-9-フユ" = "リッちゃん、おつかれー。"
"10048020-10-リツ" = "ありがと！"
"10048020-11-リツ" = "あれ？そこにいるのは……。"
"10048020-12" = "[s] \"はじめまして。シャーレの先生です。\""
"10048020-13-リツ" = "はじめまして！ボク、[ruby=うすば]薄葉[/ruby]リツ！"
"10048020-14-リツ" = "趣味も特技も、彫刻と交易！"
"10048020-15-リツ" = "もちろん専攻は、彫刻！"
"10048020-16" = "[s] \"よ、よろしく！\""
"10048020-17-リツ" = "そういえば、先生のことニュースで見たよ。 "
"10048020-18-リツ" = "裸で野原を全力ダッシュしたんでしょ？"
"10048020-19" = "[s] \"ま、間違ってはないけど……っ！\""
"10048020-20-リツ" = "ああいうの、ワイルドハントの外でもやっていいんだ！"
"10048020-21" = "[s] \"ワイルドハントの中ならいいの……？\""
"10048020-22-ミヨ" = "えっと、あくまでパフォーマンスの一つとしてなら許されている、といいますか……。"
"10048020-23-リツ" = "先生、着る服ないの？"
"10048020-24-リツ" = "ボクのあげよっか？"
"10048020-25" = "[s] \"気持ちだけ……受け取っておくよ……。\""
"10048020-26-フユ" = "そうだ、種まきが終わったならちょうどいいね。"
"10048020-27-フユ" = "リッちゃん。#nその場所案内してくれない？"
"10048020-28-リツ" = "ん？いいけど、なんで？"
"10048020-29-フユ" = "先生に、特殊交易部の活動を見せてあげたくてね。"
"10048020-30-リツ" = "見学ってこと？"
"10048020-31-リツ" = "面白そうだね！"
"10048020-32-リツ" = "でもいいの？"
"10048020-33-リツ" = "ミヨちゃん、情報が漏れるの気にしてなかったっけ？"
"10048020-34-リツ" = "ふふっ、リッちゃん……先生は「大人」なんだよ。"
"10048020-35-リツ" = "大人は……味方にすると、たくさんお金を落としてくれるらしいんだよ？"
"10048020-36-リツ" = "だからこうやって信用させてしまえば……。"
"10048020-37" = "[s] \"あのー、全部聞こえてるけど……。\""
"10048020-38-ミヨ" = "はあ……何言ってるんですか……。"
"10048020-39-ミヨ" = "……とにかく。ご案内します、先生。"
"10048020-40-ミヨ" = "行くよ、みんな。"
"10048020-41" = "ワイルドハント・空き地"
"10048020-42-フユ" = "最初の種まきポイント、とーちゃく！"
"10048020-43" = "[s] \"ところで……「種まき」ってなに？\""
"10048020-44-フユ" = "し、品物を依頼人に届けること……です。"
"10048020-45-フユ" = "指定の場所に私たちが品物を「まいて」、#n後で依頼人が「収穫」する――"
"10048020-46-フユ" = "だから、種まきです。"
"10048020-47-フユ" = "ここだと埋めた場所は……あの彫刻像の下ですね。"
"10048020-48-フユ" = "しっ……来た来た。"
"10048020-49-依頼人の生徒A" = "あった……！"
"10048020-50-依頼人の生徒A" = "おお……ついに！#n私の心を満たす、最後のピースが……！！"
"10048020-51-依頼人の生徒A" = "今回の依頼品って何だったっけ？"
"10048020-52-依頼人の生徒A" = "ナパーム弾味のフライドチキンです。"
"10048020-53" = "[s] \"……そんなものが依頼されるんだ？\""
"10048020-54-フユ" = "飲食物の持ち込み基準は、とても厳しいですから。"
"10048020-55-フユ" = "その上、外出許可もなかなか下りないので自由に外食さえできません。"
"10048020-56-フユ" = "そこで、私たちの出番というわけです。"
"10048020-57-フユ" = "では、次の地点へ行きましょうか。"
"10048020-58" = "ワイルドハントのどこかの森"
"10048020-59" = "（ここでは、木の[ruby=うろ]洞[/ruby]が指定の場所だった）"
"10048020-60-依頼人の生徒B" = "みっけ！"
"10048020-61-依頼人の生徒B" = "これで、やっと完成できる……！"
"10048020-62-依頼人の生徒B" = "あの方はとあるメーカーの絵の具を探していました。"
"10048020-63-依頼人の生徒B" = "ワイルドハントでは持ち込み禁止となった絵の具です。"
"10048020-64" = "[s] \"何で禁止になったの？\""
"10048020-65-依頼人の生徒B" = "殺虫剤の成分が入っており、健康に害を及ぼす危険がある……とか。"
"10048020-66" = "（他にも種まきポイントを見て回った）"
"10048020-67" = "（実際に確認していくと……）"
"10048020-68" = "（言葉から想像していたような危険な品物はなかった）"
"10048020-69" = "ワイルドハント・空き地"
"10048020-70" = "（見学が終わり、すこし休むことにした）"
"10048020-71-リツ" = "これでしゅーりょー！今日はもう扉を閉める時間だね！"
"10048020-72-フユ" = "どうでした？先生。 "
"10048020-73-フユ" = "私たちの部活動は。"
"10048020-74" = "[s1] \"実際に自分の目で見てみると……。\"\n[s2] \"思っていたより平和というか……。\""
"10048020-75-フユ" = "ふふ……今日見ていただいたのは、活動のほんの一部ですけどね。"
"10048020-76-フユ" = "実際はこれよりも、はるかに膨大な数のルートや受け渡し方法があります。"
"10048020-77-ミヨ" = "それ、自慢することです？"
"10048020-78-フユ" = "もちろん！"
"10048020-79-フユ" = "あれ……なんだか、浮かない顔をしてるね。"
"10048020-80-フユ" = "今日見せたのは、全部ミヨの「作品」なのに。"
"10048020-81" = "[s] \"作品……？\""
"10048020-82-ミヨ" = "ちょっと……！"
"10048020-83-フユ" = "何十種類もの受け渡し方法と、貿易ルート……#n寮監隊と出くわしたときのシナリオも――"
"10048020-84-フユ" = "全部ミヨが書いてくれたんですよ。"
"10048020-85-ミヨ" = "うぅっ……。"
"10048020-86-ミヨ" = "恥ずかしいからやめて……！"
"10048020-87-フユ" = "ミヨは伊達に部長を務めていないんですよ。"
"10048020-88-フユ" = "私たち特殊交易部の目標を定め、作戦立案を行うブレーン……。"
"10048020-89-フユ" = "それが私たちの部長、ミヨです。"
"10048020-90-ミヨ" = "わーっ！"
"10048020-91-フユ" = "いい加減受け入れようよ。"
"10048020-92-フユ" = "ミヨは……貿易の要なんだから！"
"10048020-93-フユ" = "そーそー！ミヨちゃんの作戦に穴はないからね！ "
"10048020-94-フユ" = "リッちゃんまで……！"
"10048020-95-フユ" = "――ということで、またミヨの力を借りたいんだけど。"
"10048020-96-ミヨ" = "……？"
"10048020-97-ミヨ" = "今度は何？"
"10048020-98-ミヨ" = "ふふっ……。 "
"10048020-99-フユ" = "実は、結構デカい依頼が入ってね。"
"10048020-100-フユ" = "なんと報酬は――"
"10048020-101-ミヨ" = "却下。"
"10048020-102-フユ" = "まだ話してないのに！？"
"10048020-103-ミヨ" = "フユがデカいって言うのなら、とんでもない依頼にきまっています……！"
"10048020-104-フユ" = "まあ……そうかもしれないけど。"
"10048020-105-フユ" = "でも、結局受けることになると思うよ。"
"10048020-106-フユ" = "依頼内容とは別に、もう一つデカい話があるんだ。"
"10048020-107-ミヨ" = "……？"
"10048020-108-フユ" = "実は――"
"10048020-109-フユ" = "「キューティーベリー[ruby=はちなな]87[/ruby]」が売りに出てる。"
"10048020-110-ミヨ" = "……！？"
"10048020-111-ミヨ" = "ま、まだ誰にも買われてないですよね！？"
"10048020-112-フユ" = "うん。ほら、このフリマサイトを見て。"
"10048020-113" = "[ns] \"キューティーベリー87って？\""
"10048020-114-ミヨ" = "いわゆる、「呪われし傑作」です。"
"10048020-115-ミヨ" = "あまりにも時代を先取りしすぎたせいで消費者に匙を投げられた――#n市場から姿を消した悲運の名機……！"
"10048020-116-ミヨ" = "まぁ、ただの古いタイプライターなんですけどね。"
"10048020-117-フユ" = "はぁ！？"
"10048020-118" = "[s] \"これをずっと探してたの？\""
"10048020-119-ミヨ" = "はい、そうなんです。"
"10048020-120-ミヨ" = "趣味はタイプライター収集……。"
"10048020-121" = "[ns] \"なるほど……。\""
"10048020-122-フユ" = "見れば見るほど、あんまり売れなかったのも分かる気がするんですけどね。"
"10048020-123-フユ" = "なんで指向性の対人地雷をタイプライターにつけたんだか。"
"10048020-124-フユ" = "カッコイイからって投石機を使うあんたが言います……？"
"10048020-125-フユ" = "ははっ。\nでも、キューティーベリー87……欲しいんだよね？"
"10048020-126-フユ" = "それで、どこからお金を出すんです？"
"10048020-127-ミヨ" = "何で私の懐事情が分かるんですか。"
"10048020-128-フユ" = "表紙を見ただけで、中身が分かる本ってあるじゃん？"
"10048020-129-フユ" = "は？予想を裏切る展開かもしれないじゃないですか……。"
"10048020-130-フユ" = "この場合は違うと思うけどね。"
"10048020-131-ミヨ" = "……ふん。"
"10048020-132-フユ" = "認めればいいじゃん。#nキューティーベリーが欲しいけどお金がない、って。 "
"10048020-133-フユ" = "でも、今回の依頼が成功すれば……。"
"10048020-134-フユ" = "あれを5台買ってもおつりが来ると思うよ。"
"10048020-135-ミヨ" = "……。"
"10048020-136-ミヨ" = "……分かった。"
"10048020-137-ミヨ" = "……依頼の内容、聞いてあげます。"
