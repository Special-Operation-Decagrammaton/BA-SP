[translation]
"10048005-1" = "プロローグ;見慣れぬ天井"
"10048005-2" = "とある知らない部屋"
"10048005-3" = "（見たことない天井だ）"
"10048005-4" = "（ここはどこだろう……）"
"10048005-5" = "（構造的に、どこかの学園の寮……？）"
"10048005-6" = "（体は……拘束されていない）"
"10048005-7" = "（これはソファだろうか、布団まで掛けられている）"
"10048005-8" = "（連れてきた側も、どうやら敵意はなさそうだ）"
"10048005-9" = "（でも、まだ頭痛がする）"
"10048005-10" = "（どうしてこんなことになっているんだろう？）"
"10048005-11-？？？" = "き、気がつきましたか？"
"10048005-12" = "[ns] \"えっと、どちら様で……。\""
"10048005-13-？？？" = "へっ？私ですか？"
"10048005-14-？？？" = "あ、ええっと……そう、ですね。#n知りませんよね。"
"10048005-15-ミヨ" = "私の名前は[ruby=さくらい]桜井[/ruby]ミヨ。#nワイルドハント芸術学院で、文学を専攻しています。"
"10048005-16-ミヨ" = "16歳……2年生です。"
"10048005-17-ミヨ" = "8月24日生まれで……身長は155cm……。"
"10048005-18-ミヨ" = "趣味はタイプライター収集……。"
"10048005-19-ミヨ" = "スリーサイズは……。"
"10048005-20-ミヨ" = "……。"
"10048005-21-ミヨ" = "ええと……本当に、こんなことまで知りたいんですか？"
"10048005-22" = "[s1] \"そ、そこまでは聞いてないよ！\"\n[s2] \"……ちょっとは気になるけど。\""
"10048005-23-ミヨ" = "そ、そうですか……。"
"10048005-24-ミヨ" = "と、というか、いま重要なのはそこじゃないですよね！#n気になるんですか？どうなんですか！？"
"10048005-25-ミヨ" = "気にはなるんですね……！？"
"10048005-26-ミヨ" = "やっぱり、噂通りの変な方……。"
"10048005-27" = "[ns] \"ところで、ここは……？\""
"10048005-28-ミヨ" = "と、特殊交易部の部室です。"
"10048005-29" = "[s] \"特殊交易部……？\""
"10048005-30-ミヨ" = "はい。ワイルドハントの校則に違反している組織です。 "
"10048005-31" = "[s] \"いったい何をする部活なの……？\""
"10048005-32-ミヨ" = "……「密輸」です。"
"10048005-33" = "[s] \"み、密輸！？\""
"10048005-34-ミヨ" = "はい。そして、あなたは……シャーレの先生、ですよね？"
"10048005-35" = "[s] \"うん、そうだけど……。\""
"10048005-36-ミヨ" = "初対面でこんなことをお願いするのは申し訳ないのですが……。"
"10048005-37-ミヨ" = "どうか……私の悩みを、聞いていただけませんか？"
"10048005-38" = "[s] \"うん、なんでも言って。\""
"10048005-39-ミヨ" = "……や、やっぱり、噂通りの方、ですね。"
"10048005-40-ミヨ" = "……そ、その。"
"10048005-41-ミヨ" = "実は、私……。"
"10048005-42-ミヨ" = "特殊交易部を、廃部にしたいんです。"
"10048005-43" = "[s] \"廃部……？\""
"10048005-44-ミヨ" = "……もう、こんなことはやめたくて。"
"10048005-45-ミヨ" = "……何度も何度も校則を破るのが、本当に苦しいんです。"
"10048005-46-ミヨ" = "こんなことを言うと困らせてしまうのは分かっていますが……#nどうか、お願いします。"
"10048005-47" = "[s3] \"そっか……分かった。\"\n[s4] \"まずは、特殊交易部の部長に会ってもいいかな。\""
"10048005-48-ミヨ" = "あっ……えっと、それでしたら私にお伝えいただければと。"
"10048005-49" = "[s5] \"部長と直接話してみたいんだ。\"\n[s6] \"何をする部活なのか、ちゃんと知りたいし。\""
"10048005-50-ミヨ" = "あ……。"
"10048005-51-ミヨ" = "えっと……その……私、なんです。#n特殊交易部の……部長。"
"10048005-52" = "[ns] \"……ええっ！？\""
