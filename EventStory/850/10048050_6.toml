[translation]
"10048050-1" = "第5話;虹のふもとは"
"10048050-2" = "[log]蝸牛は哭き[/log]"
"10048050-3" = "[log]硬き空がゆがみ[/log]"
"10048050-4" = "[log]王のみぞ微笑む[/log]"
"10048050-5" = "[log]戸が閉まり、虹に染まる――[/log]"
"10048050-6" = "[log]魔法の刹那にお会いしましょう[/log]"
"10048050-7-フユ" = "これがかの有名な慈愛の怪盗の手紙！？"
"10048050-8-ミヨ" = "いや、これは書き写したもの。原本は寮監隊が持っています。"
"10048050-9-フユ" = "それは分かってるけど！でも、内容は本物なんだよね？"
"10048050-10-ミヨ" = "ええ。"
"10048050-11-リツ" = "ねね、慈愛の怪盗ってなあに？"
"10048050-12-ミヨ" = "芸術品を狙う盗人です。狙った物は必ず手に入れるって噂で……。"
"10048050-13-ミヨ" = "七囚人の一人でもあります。"
"10048050-14-リツ" = "じゃあ[ruby=これ]手紙[/ruby]は？#n盗む前にわざわざ教えてくれるんだ？"
"10048050-15-ミヨ" = "それが普通の泥棒と違うところですね。"
"10048050-16-ミヨ" = "慈愛の怪盗は事前に必ず犯行予告をし、決行時間とターゲットを知らせる。"
"10048050-17-リツ" = "へえ～これが予告状なんだ。"
"10048050-18-リツ" = "なんかの詩かと思った！"
"10048050-19-フユ" = "たしかに、そうも見えるかも。"
"10048050-20-フユ" = "慈愛の怪盗は、いつもこういう凝った怪文書を送るんだよね。"
"10048050-21-フユ" = "でも、わかんないな……。"
"10048050-22-フユ" = "うん？"
"10048050-23-フユ" = "どうして寮監隊の副隊長が、これをミヨに見せたの？"
"10048050-24-ミヨ" = "だって……ヒロミちゃんも、文学専攻だし。"
"10048050-25-フユ" = "いや、こういうのって機密情報じゃない？"
"10048050-26-ミヨ" = "あ……えっと、そうなんですけど……。"
"10048050-27-フユ" = "けど？"
"10048050-28-ミヨ" = "誰も解読できないから、機密扱いじゃなくなったみたいで……。"
"10048050-29-フユ" = "あー……。"
"10048050-30-ミヨ" = "だから、解読できたら教えてって言われているんです。"
"10048050-31-フユ" = "じゃあ、ミヨはもう中身がわかってるの？"
"10048050-32-ミヨ" = "ううん、まだ。"
"10048050-33-ミヨ" = "それに今は解読どころじゃないし……。"
"10048050-34-フユ" = "どういうこと？"
"10048050-35-ミヨ" = "怪盗もベロニカ特別展を狙っているんです。#n最悪なことに、予告状まで出して……。"
"10048050-36-ミヨ" = "ということは、寮監隊は展示場と収蔵庫の警備を何倍にも強化するでしょう。"
"10048050-37-リツ" = "……！"
"10048050-38-リツ" = "じゃあ、ミヨちゃんが徹夜で書いた作品は……。"
"10048050-39-ミヨ" = "水の泡。一から書き直しです。"
"10048050-40-ミヨ" = "あと、予告状の解読も……ううっ。"
"10048050-41-ミヨ" = "はぁ……うぅ……。"
"10048050-42-リツ" = "あー……うん……がんばって。"
"10048050-43-リツ" = "ミヨちゃん……。"
"10048050-44-ミヨ" = "私……図書館に行ってきます……。"
"10048050-45-ミヨ" = "少し、落ち着きたくて……。"
"10048050-46-ミヨ" = "予告状の解読もついでにやってみますね。"
"10048050-47-ミヨ" = "いってきます。"
"10048050-48" = "ワイルドハントの芸術情報館"
"10048050-49-ミヨ" = "ふぅ……。"
"10048050-50-ミヨ" = "よし、もう一度読んでみよう。"
"10048050-51-ミヨ" = "『蝸牛は哭き、硬き空がゆがみ、王のみぞ微笑む』……。"
"10048050-52-ミヨ" = "『戸が閉まり虹に染まる魔法の刹那にお会いしましょう』……。"
"10048050-53-ミヨ" = "……どういうこと？"
"10048050-54-ミヨ" = "（ベロニカ展の図録に、蝸牛が描かれてる絵なんてなかった）"
"10048050-55-ミヨ" = "（逆に、空を描いた絵はたくさんある……というか、硬き空ってなに？）"
"10048050-56-ミヨ" = "（王様の絵は何枚かあるけど……険しい顔のばかりで、微笑んでいるものはない）"
"10048050-57-ミヨ" = "（……どの絵を狙ってるんだろう）"
"10048050-58-ミヨ" = "（はぁ……なんでこんなややこしい事態に……）"
"10048050-59-ミヨ" = "あれ……本……？"
"10048050-60-？？？" = "あっ、ごめんなさい！落としてしまって……。"
"10048050-61-ミヨ" = "いえ、大丈夫です。"
"10048050-62-ミヨ" = "はい、どうぞ。"
"10048050-63-？？？" = "わ、ありがとうございます！"
"10048050-64-ミヨ" = "（『召喚魔法入門』『タロットの分かれ道』『アストラル界へのいざない』……）"
"10048050-65-ミヨ" = "あの……もしかして、オカルト研究会のエリさん……？"
"10048050-66-エリ" = "あーっ！ミヨさん！？"
"10048050-67-エリ" = "大丈夫ですか？#nなにやら険しい顔をされてましたが……。"
"10048050-68-ミヨ" = "あ、その……少し悩んでて……。"
"10048050-69-ミヨ" = "難しい謎解きがあるんです……。"
"10048050-70-ミヨ" = "そういえばエリさんの専攻は……。"
"10048050-71-エリ" = "はいっ！絵画です！"
"10048050-72-ミヨ" = "その、カタツムリが描かれた絵について何か知りませんか……？#nベロニカ展関係で……。"
"10048050-73-エリ" = "へっ？カタツムリ……？"
"10048050-74-エリ" = "んん……なかったような……。"
"10048050-75-ミヨ" = "じゃあ空を主役に描かれた絵は？"
"10048050-76-エリ" = "空？"
"10048050-77-エリ" = "空が描かれた絵はたくさんありますが、主役……うーん……。"
"10048050-78-ミヨ" = "じゃあ「硬き空」という言葉に、聞き覚えはありませんか？"
"10048050-79-エリ" = "硬き空……？"
"10048050-80-エリ" = "うーん、ごめんなさい。それもちょっと……。"
"10048050-81-エリ" = "あっ！"
"10048050-82-エリ" = "硬き空……。"
"10048050-83-エリ" = "もしかしたら、あれのことかもしれません！"
"10048050-84-ミヨ" = "知っているんですか！？"
"10048050-85-エリ" = "おそらく、ラピスラズリのことでは！？"
"10048050-86-エリ" = "ラピスラズリは青色をした宝石で、青金石とも呼ばれています。"
"10048050-87-エリ" = "ラピスは「石」、ラズリは「空」……「空の石」という意味で――"
"10048050-88-エリ" = "それを、「硬き空」と解釈できるかもしれません。"
"10048050-89-ミヨ" = "ラピスラズリ……空の石……硬き空。"
"10048050-90-ミヨ" = "なるほど……「ラピスラズリ」を手掛かりに、もう一度調べてみます。"
"10048050-91-ミヨ" = "ありがとうございます、エリさん。 "
"10048050-92-エリ" = "にゅふふっ、いえいえ！ "
"10048050-93-ミヨ" = "エリさんは宝石に詳しいんですね。"
"10048050-94-エリ" = "ん？ああっ、そういうわけではないんです。"
"10048050-95-エリ" = "ラピスラズリは絵の具にも使いますから！#n私は絵画専攻ですし。"
"10048050-96-ミヨ" = "宝石を……絵の具に！？"
"10048050-97-エリ" = "ええ。ウルトラマリンという、ラピスラズリを砕いて作る絵の具があるんです。"
"10048050-98-エリ" = "絵の具の中でも高級なものでして……最近は他の材料でもウルトラマリンを作れるので、天然のラピスラズリはほとんど使われなくなりましたが。"
"10048050-99-エリ" = "昔はウルトラマリンを使いすぎて、破産した画家もいたのだとか！"
"10048050-100-ミヨ" = "「……硬き空がゆがみ」"
"10048050-101-エリ" = "へっ？"
"10048050-102-ミヨ" = "空の石であるラピスラズリを砕いて、絵の具を作った……！"
"10048050-103-エリ" = "……？"
"10048050-104-エリ" = "あっ、ごめんなさい！#nちょっと呼ばれたのでお先に失礼します！"
"10048050-105-ミヨ" = "「硬き空」は絵の具のこと……。"
"10048050-106-ミヨ" = "じゃあ「蝸牛は哭き」も、もしかして……。"
"10048050-107-ミヨ" = "……探してみよう。#n顔料やその近辺を当たれば、何か手掛かりが見つかるはず。"
"10048050-108" = "（数時間後……）"
"10048050-109" = "ワイルドハント・空き地"
"10048050-110-ミヨ" = "はぁ、はぁ……。"
"10048050-111-ミヨ" = "みんな、ここに居たんですね……。"
"10048050-112-ミヨ" = "探しましたよ……もう。"
"10048050-113-リツ" = "ああ、ちょっと用事があって……。"
"10048050-114-リツ" = "で、どうしたの？やけに急いでたみたいだけど。"
"10048050-115-リツ" = "あっ、ミヨちゃん。"
"10048050-116-リツ" = "なにかあった？"
"10048050-117-ミヨ" = "……できました。"
"10048050-118-リツ" = "？"
"10048050-119-ミヨ" = "予告状の解読が――できました。"
