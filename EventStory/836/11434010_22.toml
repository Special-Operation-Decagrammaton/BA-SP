[translation]
"11434010-1" = "エンディング（ノーマル）;\"……振り返ってみると。\""
"11434010-2-ヨシミ" = "……なんてこともあったわね。"
"11434010-3-ヨシミ" = "……そろそろ、結果発表の時間じゃないの？"
"11434010-4-アイリ" = "ちょっと待ってね。すぐ確認……あれ、読み込みが……。"
"11434010-5-カズサ" = "……えっ。"
"11434010-6-ヨシミ" = "な、なに！？早く言いなさいよ！"
"11434010-7-アイリ" = "あはは……。"
"11434010-8-アイリ" = "……！"
"11434010-9-アイリ" = "……っ！"
"11434010-10-アイリ" = "み、みんな見て！！ここ、私たちの名前あるよ！！"
"11434010-11-ヨシミ" = "えっ、ほんと！？じゃあ入選したってこと！？"
"11434010-12-カズサ" = "本当に入選、しちゃうなんて……。"
"11434010-13-ナツ" = "これでダメだったら、それはシナリオが悪いね。"
"11434010-14-カズサ" = "また変なこと言ってる……。"
"11434010-15-ナツ" = "とにかく入選したなら、こうしてる場合じゃないよ。早く行かないと。"
"11434010-16-ナツ" = "……ナツちゃん、急にどうしたの？"
"11434010-17-ナツ" = "私たちの目的、忘れてないよね？"
"11434010-18-ヨシミ" = "……そうだった。今度こそ正々堂々と「侵入」できるわね。"
"11434010-19-カズサ" = "うん、確かに。"
"11434010-20-アイリ" = "え、えっと……侵入って言って良いのかな……？"
"11434010-21-一同" = "さあ……セムラを取りに行こう！！"
