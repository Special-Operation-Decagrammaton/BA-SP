[translation]
"10034020-1" = "第2話;一番大事なこと"
"10034020-2" = "\"第一問：バンドに必要なものと言えば？\""
"10034020-3-ヨシミ" = "……え、いきなり何？"
"10034020-4-ヨシミ" = "バンドだったら……まあ、何はともあれ楽器でしょ。"
"10034020-5-アイリ" = "あとは、場所とか……？#n練習するにも、場所を確保しないと……。"
"10034020-6-ナツ" = "……それは当然、[ruby=Rock]ロック[/ruby]に決まってる。"
"10034020-7-カズサ" = "それと……観客？#n聴いてくれる人がいないと、意味ないと思うし。"
"10034020-8" = "\"第二問：バンドで「一番重要なもの」は？\""
"10034020-9-カズサ" = "うーん……やっぱりボーカル？"
"10034020-10-ヨシミ" = "ビジュアルじゃない？#n観客を集めるにも、演奏以前に見た目が大事だと思うし。"
"10034020-11-ナツ" = "……ロック。やはりロックだよ。"
"10034020-12-アイリ" = "曲……ですかね？"
"10034020-13" = "[ns1] \"たしかに、どれも重要だね。\"\n[ns2] \"じゃあ今、自分で言った内容を……\""
"10034020-14" = "[ns3] \"それぞれが担当することにしよう！\"\n[ns4] \"あ、もちろん私に手伝えることがあったら言ってね。\""
"10034020-15-一同" = "……えっ。"
"10034020-16-一同" = "えええぇぇぇぇ～～！？！？"
"10034020-17-ヨシミ" = "は、はぁ！？ちょっと！#nこんな雑に決めちゃっていいの！？"
"10034020-18-ヨシミ" = "そりゃ最終的に、どれかしら担当することにはなるけど……。"
"10034020-19-ヨシミ" = "即興で定められた役割……これもまたロック。"
"10034020-20-ヨシミ" = "何がロックよ！#nさっきからロックロックうるさいわね！"
"10034020-21-アイリ" = "ナツはいつも通りでしょ。#n「ロマン」が「ロック」に変わっただけで。"
"10034020-22-アイリ" = "あはは……それはそうかも。"
"10034020-23-アイリ" = "……あれ。"
"10034020-24-アイリ" = "ま、待ってください。#n担当と言っても、具体的には何を……？"
"10034020-25-ヨシミ" = "……ビジュアルって言っても、色々あると思うけど。"
"10034020-26-ヨシミ" = "バンドのロゴ、とか……？"
"10034020-27-ヨシミ" = "……え、衣装も！？#n別に、やりたくないわけじゃないけど……"
"10034020-28-ヨシミ" = "まあ、やるからには私の好みで選ぶから！#nみんな、文句は禁止だからね！"
"10034020-29-カズサ" = "はぁ、変な衣装はやめてよ？"
"10034020-30-カズサ" = "……あれ、待って。"
"10034020-31-カズサ" = "さっき私、「ボーカル」って言っちゃったんだけど……。"
"10034020-32-カズサ" = "ボーカル就任、おめでと～！"
"10034020-33-ヨシミ" = "いやいや、待ってよ！#nほんとに良いの？こんな決め方で！"
"10034020-34-アイリ" = "良いと思う！#nカズサちゃんの歌声、聞いてみたいな！"
"10034020-35-アイリ" = "それに私、カズサちゃんの声すっごく好きだし……！"
"10034020-36-ナツ" = "おぉ、攻めるねアイリ……。"
"10034020-37-カズサ" = "い、いやそれは……！"
"10034020-38-カズサ" = "あ、アイリに言われたからって、その……！"
"10034020-39-カズサ" = "っ……！"
"10034020-40-カズサ" = "あぁっ、もう！！"
"10034020-41-ヨシミ" = "あははっ！#n最早やるって言ってるようなもんじゃない。"
"10034020-42-ナツ" = "ふふっ、これぞ青春……ああ、美しい春よ。"
"10034020-43-ナツ" = "……さて、ロックとは何を？"
"10034020-44-ナツ" = "「ロックをする」……これまた興味深い問いかけだねぇ。"
"10034020-45-ナツ" = "……えっ？"
"10034020-46-ナツ" = "バンドの運営とか、スケジュールの管理……？"
"10034020-47-ナツ" = "……掃除とか？"
"10034020-48-ナツ" = "そ、それのどこにロックの要素が……？"
"10034020-49" = "[s5] \"ほら、ロックと苦労ってほぼ一緒だから。\"\n[s6] \"成功に向けた努力と情熱！それも「ロック」だよ！\""
"10034020-50-ナツ" = "えぇ……。"
"10034020-51-ナツ" = "そういう言葉遊びを求めてるわけじゃ……。"
"10034020-52-ナツ" = "うんうん、まさにロックじゃないの！#nロックはハングリー精神が大事って言うでしょ！"
"10034020-53-ナツ" = "青春は美しい、だっけ？#nじゃ、本番までよろしくね～ロック！"
"10034020-54-ナツ" = "くうっ……。"
"10034020-55-ナツ" = "……まさか今さら、「私はロックじゃない」なんて言わないわよね？"
"10034020-56-ナツ" = "……！！"
"10034020-57-ナツ" = "せっ……！"
"10034020-58-ナツ" = "青春は……！"
"10034020-59-ナツ" = "く、苦労がつきもの……。"
"10034020-60-アイリ" = "あはは……。"
"10034020-61-アイリ" = "となると、私は……あれ、曲の担当ってことですよね？"
"10034020-62-アイリ" = "作曲の経験なんて、無いのに……。"
"10034020-63-ヨシミ" = "まぁ学園祭のバンドなんて、どこも大抵コピーバンドでしょ。"
"10034020-64-ヨシミ" = "だから別に、作曲する必要は無いんじゃない？"
"10034020-65-ヨシミ" = "まぁ期待してるわよ。#nでも、あんま難しい曲はやめてよね。"
"10034020-66-アイリ" = "う、うん！#nそれくらいなら……。"
"10034020-67-アイリ" = "……私でも、やれると思う。"
"10034020-68" = "[ns7] （……それくらいなら？）\n[ns8] （……私でも？）"
"10034020-69-ヨシミ" = "んじゃ、私はさっそく衣装を考えてくるわ！"
"10034020-70-ヨシミ" = "決まったら文句言わずに着るのよ、分かった？"
"10034020-71-ヨシミ" = "それとナツ、明日のスケジュールは？"
"10034020-72-ヨシミ" = "いや……ナツじゃなくてロックだったわね！"
"10034020-73-ナツ" = "……よくぞ聞いてくれた、悩める子羊よ。#n私はロック、未来を司る者。"
"10034020-74-ナツ" = "順応するの早くない？"
"10034020-75-ナツ" = "我々の明日の予定は……"
"10034020-76-ナツ" = "……楽器探し！"
"10034020-77-ヨシミ" = "……だそうよ！"
"10034020-78-カズサ" = "いつも遅刻してくるナツがスケジュール管理かぁ……。"
"10034020-79-カズサ" = "さすが先生、面白くなってきたね。"
"10034020-80" = "[s9] \"学園祭だからね！面白くないと！\"\n[s10] 笑って誤魔化す。"
"10034020-81-ヨシミ" = "とりあえず時間も遅いし、今日は解散ね！"
"10034020-82-ヨシミ" = "明日の放課後は楽器屋さんに行くわよ！"
"10034020-83" = "[ns] \"……。\""
"10034020-84" = "（夜遅くまで仕事をしていると……）"
"10034020-85" = "[ns11] \"……アイリ？\"\n[ns12] 玄関のドアを開ける。"
"10034020-86-アイリ" = "し、失礼します……こんな時間にすみません。"
"10034020-87-アイリ" = "……あっ、この衣装ですか？"
"10034020-88-アイリ" = "ヨシミちゃんがさっそく用意してくれたので、着てみました。"
"10034020-89-アイリ" = "……えっ？"
"10034020-90-アイリ" = "私が来ると思って、待ってた……？"
"10034020-91-アイリ" = "ど、どうして……？"
"10034020-92" = "[s13] \"悩んでそうな表情だったから。\"\n[s14] \"何か話したそうにしてたからね。\""
"10034020-93-アイリ" = "やっぱり、先生にはお見通しでしたか……。"
"10034020-94-アイリ" = "実は、相談したいことがありまして。"
"10034020-95-アイリ" = "最初は自分で、曲を決めようと思ったんですけど……。"
"10034020-96-アイリ" = "……その、意外と難しくって。"
"10034020-97-アイリ" = "……。"
"10034020-98-アイリ" = "えっと……。"
"10034020-99-アイリ" = "ただ私の好きな曲を選ぶだけじゃ、ダメだと思うんです。"
"10034020-100-アイリ" = "……先生は、どんな曲が正解だと思いますか？"
"10034020-101-アイリ" = "正解さえ分かれば、きっと……。"
"10034020-102-アイリ" = "……絶対に、入選したいんです。"
"10034020-103-アイリ" = "その為の一番良い曲……それに相応しい曲を選ばないといけないんです！"
"10034020-104-アイリ" = "……すみません、今のは気にしないでください。"
"10034020-105-アイリ" = "とにかく、上手くやりたくって。"
"10034020-106-アイリ" = "何と言えば良いのか、分からないんですけど……。"
"10034020-107-アイリ" = "ベストを……尽くしたいんです……。"
"10034020-108" = "[ns15] \"じゃあ、最近一番良いなって思った曲は？\"\n[ns16] \"好きになった曲とか、すごいと思った曲でも良いけど。\""
"10034020-109-アイリ" = "一番良いと思った曲……？"
"10034020-110-アイリ" = "すごい、ですか……。"
"10034020-111-アイリ" = "うーん……。"
"10034020-112-アイリ" = "……？"
"10034020-113-アイリ" = "……あっ。"
"10034020-114" = "[ns] \"……アイリ？\""
"10034020-115-アイリ" = "一応、あるんですが……。"
"10034020-116-アイリ" = "その……。"
"10034020-117-アイリ" = "路上ライブで聞いた曲が、すごく印象に残ってて。"
"10034020-118-アイリ" = "でも、トリニティの生徒なのかすら分からないんです。"
"10034020-119-アイリ" = "また探したとしても、見つかるかどうか……。"
"10034020-120-アイリ" = "あの日だけ、たまたま演奏していた可能性もありますし……。"
"10034020-121-アイリ" = "……えっ？"
"10034020-122-アイリ" = "先生も一緒に探してくれるんですか……？"
"10034020-123-アイリ" = "で、でも、そんな簡単には見つからないと思いますよ！？"
"10034020-124-アイリ" = "それに私のわがままで、これ以上先生の貴重な時間を奪うわけには……。"
"10034020-125" = "[s17] \"大丈夫だよ。\"\n[s18] \"私は「先生」だからね。\""
"10034020-126-アイリ" = "先生……。"
"10034020-127-アイリ" = "……ありがとう、ございます。"
"10034020-128-アイリ" = "では、今度空いてる時間に……。"
"10034020-129-アイリ" = "……？"
"10034020-130-アイリ" = "…………え？"
"10034020-131-アイリ" = "……今から、ですか？"
