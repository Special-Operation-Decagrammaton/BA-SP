[translation]
"10034180-1" = "2日前：乱入"
"10034180-2-レイサ" = "[ruby=きょうやま]杏山カ[/ruby]ズサこんにちはぁ！！"
"10034180-3-レイサ" = "カズサ、またあんたの友達が来たわよ。"
"10034180-4-レイサ" = "「私たち」の友達、だよ。"
"10034180-5-レイサ" = "あはは……おはよう、レイサちゃん。"
"10034180-6-レイサ" = "……あれ、本人どこ行ったの？"
"10034180-7-レイサ" = "ほ、ほんとだ……。"
"10034180-8-レイサ" = "えっ……杏山カズサ、いないんですか？"
"10034180-9-レイサ" = "あ……えっと、その……。"
"10034180-10-レイサ" = "し、失礼しました……。"
"10034180-11-ヨシミ" = "待ってたら、すぐ来ると思うよ？"
"10034180-12-ヨシミ" = "そうよ。どうせ近くのコンビニとかだろうし。"
"10034180-13-レイサ" = "お、お気持ちは嬉しいのですが……。#n私は放課後スイーツ部でもないですし……。"
"10034180-14-ナツ" = "でも放課後スイーツ「団」ではある、でしょ？#nそう、即ち血盟を誓ったもの同士……。"
"10034180-15-ヨシミ" = "ま、ナツのことは置いといて。"
"10034180-16-ヨシミ" = "アイリも言ってる通り、気にする必要ないわよ。#n好きなだけいれば良いじゃない。"
"10034180-17-レイサ" = "……！！"
"10034180-18-アイリ" = "うん！カズサちゃんがいない時でも遊びにきてね！"
"10034180-19-アイリ" = "自警団の仕事で疲れたら、一緒にスイーツ食べよ？"
"10034180-20-レイサ" = "……。"
"10034180-21-レイサ" = "……はいっ！！"
"10034180-22-カズサ" = "ただいまー、アイス買ってき――"
"10034180-23-カズサ" = "……あ、やっぱりあんたもいたんだ。"
"10034180-24-カズサ" = "何となくそうかと思って、余分に買ってきたんだけど……#n正解だったね。"
