[translation]
"10034120-1" = "6日前：王道の解決策"
"10034120-2-ヨシミ" = "……辛い。"
"10034120-3-ヨシミ" = "練習より、理論を勉強する方が遥かに辛い……。"
"10034120-4-カズサ" = "同感、しんどいねこれ……"
"10034120-5-アイリ" = "まあまあ……。"
"10034120-6-アイリ" = "でもほら、練習してても直らない部分だって、理論が分かればすんなり行くかもよ？"
"10034120-7-アイリ" = "だからまずは、教本に沿って基礎練をしてみよう！"
"10034120-8-ナツ" = "時には先人の道に従うこともまた近道……ってね。"
"10034120-9-カズサ" = "そりゃそうなんだけどさぁ……。"
"10034120-10-カズサ" = "まさか、ここに来て本を読まないといけないなんて……。"
"10034120-11-ヨシミ" = "な～に？その自信無さげな顔は？"
"10034120-12-カズサ" = "……先に不満の声を上げたのはそっちでしょ？"
"10034120-13-ヨシミ" = "うるさいわねっ！！"
"10034120-14-ヨシミ" = "ほら、さっさと始めるわよ！！"
