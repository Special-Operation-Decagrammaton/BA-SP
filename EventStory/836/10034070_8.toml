[translation]
"10034070-1" = "第7話;ひとつの青春物語"
"10034070-2-正義実現委員会部員" = "……お疲れ様です、先生。"
"10034070-3-正義実現委員会部員" = "こちらが、運営委員会を襲った犯人の方々です。"
"10034070-4-正義実現委員会部員" = "理由は未だ不明、と言いますか、先生が来るまで何も話さないとの一点張りで……。"
"10034070-5-正義実現委員会部員" = "まだ目的も分からないため、今後の扱いは保留となっています。"
"10034070-6-正義実現委員会部員" = "私が現場に駆けつけた頃には、すでに警備が突破されておりました。"
"10034070-7-正義実現委員会部員" = "危うく逃すところでしたが、何とか確保できた次第です。"
"10034070-8-正義実現委員会部員" = "あとはイチカ先輩が引き継ぐことになっていますので。"
"10034070-9-正義実現委員会部員" = "では、私はこれで失礼します。"
"10034070-10-ナツ" = "留置所で再会するなんて……。"
"10034070-11-ナツ" = "……まさにロック！"
"10034070-12-ヨシミ" = "もうちょっとやれると思ったんだけど、あのキャスパリーグでも流石に厳しかったかぁ……。"
"10034070-13-カズサ" = "その呼び方やめてって何回も言ってるよね！？#nそれに結構頑張ったと思うんだけど！？"
"10034070-14-カズサ" = "ふぅ……とはいえさすがに、ね？"
"10034070-15" = "[ns1] \"これはどういう状況……？\"\n[ns2] \"みんな、いったい何をしたの……？\""
"10034070-16-ヨシミ" = "……見張りの人は？"
"10034070-17-ヨシミ" = "もうどっか行った？#nいないわよね？"
"10034070-18" = "[s3] \"さっき出ていったけど……。\"\n[s4] \"何か聞かれたらマズイ事情が？\""
"10034070-19-ナツ" = "……先生、アイリは？"
"10034070-20-ヨシミ" = "会いに行ったんでしょ、今どこにいるのよ？"
"10034070-21-カズサ" = "……切り替え早いね、あんたたち。"
"10034070-22" = "[s5] \"……アイリ、おいで。\"\n[s6] \"アイリなら、そこにいるよ。\""
"10034070-23-アイリ" = "……はい。"
"10034070-24-アイリ" = "みんな……。"
"10034070-25-ナツ" = "……アイリ、こっち来て。"
"10034070-26-ナツ" = "……？"
"10034070-27-ナツ" = "……もっと。"
"10034070-28-アイリ" = "……？？"
"10034070-29-ナツ" = "……もっと近くに。"
"10034070-30-アイリ" = "……？？？"
"10034070-31-ナツ" = "……よし。"
"10034070-32-ナツ" = "……はい、これ。"
"10034070-33-アイリ" = "……？"
"10034070-34-アイリ" = "これは……？"
"10034070-35" = "[ns7] \"……セムラ？\"\n[ns8] \"そのために忍び込んだんだ……。\""
"10034070-36-ナツ" = "そう、我々の目的はセムラ。"
"10034070-37-ナツ" = "……なーんて格好つけるには、不甲斐ない結果になったけどね。"
"10034070-38-ナツ" = "それでもこの小さな一切れは、#n本物のセムラだよ。"
"10034070-39-ヨシミ" = "もう、アイリ！#nそんなに食べたかったなら、最初から言ってよ！"
"10034070-40-カズサ" = "……不甲斐ない結果、って。#n二人がもう少し戦力になってたら、こうはならなかったんだけど……。"
"10034070-41-カズサ" = "……アイリ、感想聞かせてね。#n私たちもまだ食べてないんだから。"
"10034070-42-ナツ" = "……あとごめんだけど、明日から部室は使えないと思う。"
"10034070-43-ヨシミ" = "まあ詳しいことは、あとでグループチャットで話し合えば良いでしょ？"
"10034070-44-アイリ" = "ど、どういうこと……？"
"10034070-45-カズサ" = "……本当にごめん、アイリ。#n勝手にこんなことしたせいで……。"
"10034070-46-アイリ" = "みんな……まさか、これのために……。"
"10034070-47-アイリ" = "……これのために、捕まったの？"
"10034070-48-ヨシミ" = "……？"
"10034070-49-アイリ" = "な、なんで……？"
"10034070-50-ヨシミ" = "……あ、あれ？#nなんか思ってた反応と違う！？"
"10034070-51-アイリ" = "どうして、こんなこと……。"
"10034070-52-アイリ" = "まさか、私のために……？"
"10034070-53-ヨシミ" = "だ、だって、どうしてもセムラを食べたかったんじゃないの？"
"10034070-54-ヨシミ" = "だから急に、バンドをやろうなんて言い出して……。"
"10034070-55-カズサ" = "これって……。"
"10034070-56-カズサ" = "……もしかしなくても、やっぱり誤解だったんじゃないの！？"
"10034070-57-ナツ" = "……にひ、これもまたロックだね。"
"10034070-58-カズサ" = "笑ってる場合じゃない！"
"10034070-59-アイリ" = "どうして……。"
"10034070-60-アイリ" = "どうして、私[ruby=・   ・   ・]なんか[/ruby]のために、ここまで……。"
"10034070-61-ヨシミ" = "……？"
"10034070-62-ヨシミ" = "……？？"
"10034070-63-ヨシミ" = "……え？#nあ、アイリ？なんで泣いてるの……？"
"10034070-64-ヨシミ" = "アイリ！#nどうしたの！？"
"10034070-65-ヨシミ" = "先生！！#nちょっとどうにかしてよ！？"
"10034070-66" = "[ns9] \"……アイリ。\"\n[ns10] \"みんなにも話してあげて。\""
"10034070-67-アイリ" = "えっ……？"
"10034070-68-アイリ" = "さっき先生に話したことを……？"
"10034070-69-アイリ" = "そ、それは……。"
"10034070-70-アイリ" = "そんなの、無理です……！"
"10034070-71-ヨシミ" = "……？"
"10034070-72-ヨシミ" = "なに、二人だけの秘密ってわけ？"
"10034070-73-ナツ" = "深夜に密談とは……ロックじゃないね。"
"10034070-74-カズサ" = "……いやいや、さっき先生が「話してあげて」って言ってたし、#n隠すつもりじゃないでしょ。"
"10034070-75-ヨシミ" = "そんなこといいから！アイリ、早く説明して！！"
"10034070-76-ナツ" = "ここで話さない選択肢があるのかね？いや、ない！"
"10034070-77-アイリ" = "せ、先生……！"
"10034070-78" = "[ns11] \"私は正義実現委員会に事情を説明してくるよ。\"\n[ns12] \"今回はなんて言い訳しようかな……。\""
"10034070-79-アイリ" = "先生……！？"
"10034070-80" = "[ns13] \"大丈夫、アイリならできるよ。\"\n[ns14] 聞こえないふりをして出ていく。"
"10034070-81-アイリ" = "先生！？！？"
"10034070-82-イチカ" = "事情は大体理解したっす。#n上にはそれらしいことを伝えておくんで、安心してください。"
"10034070-83-イチカ" = "……まあ、多分何とかなるんじゃないっすかね。"
"10034070-84-イチカ" = "これくらい、よくあるハプニングっすよ。"
"10034070-85" = "[s15] \"本当にありがとね、イチカ。\"\n[s16] \"近いうちにお礼するよ。\""
"10034070-86-イチカ" = "いえいえ、とんでもないっす。"
"10034070-87-イチカ" = "だって何かあったら呼んでくださいって、約束したじゃないっすか！"
"10034070-88-イチカ" = "それに、友達のためなら仕方ないっす。"
"10034070-89-イチカ" = "ティーパーティーの皆さんも大きな揉め事にはしたくないと思いますし、大目に見てくれるっすよ。"
"10034070-90-イチカ" = "なので、そんなに気にしなくても大丈夫っす。"
"10034070-91-イチカ" = "……おっと。"
"10034070-92-イチカ" = "仕事の呼び出しが来たんで、お先に失礼するっすね！"
"10034070-93-イチカ" = "それじゃ、お疲れ様でした先生！"
"10034070-94" = "[s17] \"ありがとう、気をつけてね。\"\n[s18] 手を振って見送る。"
"10034070-95-？？？" = "本当に、素晴らしかったです。"
"10034070-96-？？？" = "私の想像でしかなかった物語が……。"
"10034070-97-ツムギ" = "……まさか、こうして結実するとは。"
"10034070-98" = "[s19] \"やっぱり来てくれたんだね、ツムギ。\"\n[s20] \"急に呼び出してごめんね。\""
"10034070-99-ツムギ" = "いえ、このために連絡先を教えたのですよ。"
"10034070-100-ツムギ" = "むしろ、確認が遅くなり申し訳なく思っています。"
"10034070-101-ツムギ" = "ですが……。"
"10034070-102-ツムギ" = "この場に、私の出番は無かったのかもしれませんね。"
"10034070-103-ツムギ" = "……己の未熟さに、もがき苦しむヒロイン。"
"10034070-104-ツムギ" = "音楽と向き合う道を進むも、不安に心の均衡を崩されてしまった、と。"
"10034070-105-ツムギ" = "不安、劣等、葛藤……。"
"10034070-106-ツムギ" = "そして迎えたのは、仲間との劇的な[ruby=かいこう]邂逅[/ruby]。"
"10034070-107-ツムギ" = "全ての問題を乗り越えた先には、素晴らしいフィナーレが待っているものです。"
"10034070-108-ツムギ" = "ええ。これこそ、私の思い描いた物語。"
"10034070-109-ツムギ" = "ああ、実に美しいじゃありませんか。"
"10034070-110-ツムギ" = "……これぞ「青春」。"
"10034070-111-ツムギ" = "……青春の物語と、言えるでしょう。"
"10034070-112-ツムギ" = "さて、あなたはこんなところにいて良いのですか？"
"10034070-113-ツムギ" = "感動のフィナーレとも言うべきシーンまで来たというのに。"
"10034070-114-ツムギ" = "あちらに顔を見せた方が、喜ばれるでしょう？"
"10034070-115" = "[s21] \"私は先生だからね。\"\n[s22] \"そっと見守るのが大人の役目だからね。\""
"10034070-116-ツムギ" = "……なるほど。"
"10034070-117-ツムギ" = "これが大人、と……私もひとつの学びを得ました。"
"10034070-118-ツムギ" = "けれども先生、大事なテーマを忘れてはいませんか？"
"10034070-119-ツムギ" = "ヒロインの不安や劣等、葛藤については、どう解釈を？"
"10034070-120-ツムギ" = "いつかその時まで不都合から目を背け、#n問題を先送りにしただけとは考えられませんか？"
"10034070-121-ツムギ" = "先生はその辺りについて、どうお考えで？"
"10034070-122-ツムギ" = "……ふむ。"
"10034070-123-ツムギ" = "誰しもが持っている自然な感情、と……。"
"10034070-124-ツムギ" = "……意外な答えでした。#n問題に立ち向かうわけでもなければ、目を背けるわけでもなく、受け入れる、と。"
"10034070-125" = "[s23] \"もし、周りと自分を比較して苦しんだとしても……。\"\n[s24] \"その人たちが、自分にとって大切な存在なら……。\""
"10034070-126" = "[ns25] \"その大切な結びつきには自分自身も含まれるんだよ。\"\n[ns26] \"その関係性を築いたのも、また自分だからね。\""
"10034070-127-ツムギ" = "……ふむ。"
"10034070-128-ツムギ" = "つまるところ、周囲の存在とは……。"
"10034070-129-ツムギ" = "彼女自身の姿を映す鏡でもある、と言いたいのですね。"
"10034070-130-ツムギ" = "……とても、身に沁みます。"
"10034070-131-ツムギ" = "その解釈、気に入りました。"
"10034070-132-ツムギ" = "物語を楽しませてもらったお礼だと思ってください。"
"10034070-133-ツムギ" = "これを……。"
"10034070-134" = "[ns27] \"……これは？\"\n[ns28] \"ツムギが作曲してくれたの？\""
"10034070-135-ツムギ" = "このような結末も想定して用意していたのです。#nまさか、本当に渡すことになるとは思ってもみませんでしたがね。"
"10034070-136-ツムギ" = "前に選定した曲と比べたら、難しいかもしれませんが……。"
"10034070-137-ツムギ" = "……ふっ。#n今の彼女たちなら、何も問題ないでしょう。"
"10034070-138-ツムギ" = "詞は、生まれ変わったヒロインが手ずから編むべきでしょう。"
"10034070-139-ツムギ" = "……もうこんな時間でしたか。"
"10034070-140-ツムギ" = "……では、そろそろ私は失礼しましょう。#nいつか、私たちの公演にもぜひお越しを。"
"10034070-141-ツムギ" = "もしかすると……。"
"10034070-142-ツムギ" = "私の存在など、埋もれているかもしれませんがね。#nなにせ私の周囲は皆、とても個性的なメンバーですから。"
"10034070-143-ツムギ" = "ふっ。私としては、むしろそれで構わないと思っていますが。"
"10034070-144-ツムギ" = "……音楽とは、共に楽しめさえすれば良いのですから。"
"10034070-145-？？？" = "さっきから、なに変なこと言ってんの！"
"10034070-146-？？？" = "だから、それは……。"
"10034070-147-ヨシミ" = "……あ、先生！"
"10034070-148-ヨシミ" = "アイリがね、さっきから自分は役立たずだとか変なこと言ってるのよ！"
"10034070-149-ヨシミ" = "だって、私には何も取り柄が……。"
"10034070-150-アイリ" = "つまり……ロックが足りない、と？"
"10034070-151-アイリ" = "いよいよ、冠を持ち主に返還するときが来たのかもしれない。"
"10034070-152-アイリ" = "ついに空白の座に主が……！"
"10034070-153-カズサ" = "いや、それじゃ来たばっかりの先生に何も伝わらないでしょ……。"
"10034070-154-カズサ" = "部長を、アイリにやってもらおうって話してたの。"
"10034070-155-カズサ" = "もともと放課後スイーツ部を作った本人が、#n「みんなと同じ立場でいたい」って言ったから、こうなってたんだけどね。"
"10034070-156" = "[s29] \"……そっか。\"\n[s30] \"アイリだったんだね。\""
"10034070-157-アイリ" = "そ、そういうことじゃなくって……！"
"10034070-158-アイリ" = "私は、部長とかそんな……！"
"10034070-159-ヨシミ" = "ダメよ！ここは一回ちゃんとして、自分のことを見つめなおしなさい！"
"10034070-160-カズサ" = "それに、私がここにいるのは――"
"10034070-161-ナツ" = "……？"
"10034070-162-ナツ" = "……真実を打ち明ける時が来たか。"
"10034070-163-カズサ" = "……す、スイーツが美味しい、から、だし……？"
"10034070-164-ナツ" = "みんな恥ずかしがってないで、ちゃんと言えばいいのよ！"
"10034070-165-ナツ" = "私たちはみんな、アイリがアイリだから一緒にいるの！"
"10034070-166-ナツ" = "分かった！？"
"10034070-167-ナツ" = "……ま、大体そんなところ。"
"10034070-168-アイリ" = "よ、ヨシミちゃん……。"
"10034070-169-アイリ" = "でも私、みんなのことを……。"
"10034070-170-ヨシミ" = "そんなの別に良いの！#nよくあることでしょ！"
"10034070-171-ヨシミ" = "ほら、見なさいよこいつらのことを！"
"10034070-172-カズサ" = "まぁ、日々イラついてばっかりだしね。"
"10034070-173-ナツ" = "な、なんと……。"
"10034070-174-カズサ" = "いや「なんと」じゃないでしょ、今更……。"
"10034070-175-ナツ" = "カズサ、よく聞いて……。"
"10034070-176-ナツ" = "……怒りを溜め込むと、体に悪い。"
"10034070-177-カズサ" = "あんたが原因の七割なんだけど！？"
"10034070-178-ナツ" = "くっ、私は暴力には屈しなーい！！"
"10034070-179-カズサ" = "だから盾を使うのはズルいって！"
"10034070-180-ナツ" = "人間は常に成長する生き物なのだよ。"
"10034070-181-カズサ" = "くぅっ……！"
"10034070-182-カズサ" = "ふぅ、まぁでも……今回は私もヨシミと同意見だよ。"
"10034070-183-カズサ" = "「今回は」ってなに。"
"10034070-184-ヨシミ" = "……自分のことが好きになれないっていう気持ちは分かる。"
"10034070-185-カズサ" = "私も経験あるからさ……。"
"10034070-186-カズサ" = "なのに私は、思い込んでた。#nアイリは大丈夫って、勝手に……。"
"10034070-187-カズサ" = "……本当にごめん、アイリ。"
"10034070-188-アイリ" = "……カズサちゃん。"
"10034070-189-ナツ" = "私たちはそれぞれ違う存在で、だからこそ見えないものもある。#n逆に、自身の中に、眼をふさいでしまいたいと思うものを見出すこともあるだろう。"
"10034070-190-ナツ" = "その時にはまずは環境を見るのだ。#n自分自身を含めた環境を見るのだ。"
"10034070-191-ナツ" = "……アイリ。"
"10034070-192-ナツ" = "それとも――"
"10034070-193" = "\"……アイリはまだ、今の自分が嫌い？\""
"10034070-194" = "[log=아이리 밴드]\"ううん……好き。\"[/log]"
