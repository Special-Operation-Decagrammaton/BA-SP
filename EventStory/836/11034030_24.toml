[translation]
"11034030-1" = "パフォーマンス;競争意識（１）"
"11034030-2-ヨシミ" = "……痛っ！！"
"11034030-3-ヨシミ" = "あぁ、もう……！"
"11034030-4-ヨシミ" = "……なに？指でも怪我した？"
"11034030-5-ヨシミ" = "ん、ちょっと切っただけよ。"
"11034030-6-カズサ" = "だから気をつけなって言ったのに。"
"11034030-7-カズサ" = "ちょっと待ってて、絆創膏……。"
"11034030-8-カズサ" = "……あれ、無い。"
"11034030-9-ナツ" = "それはまあ、カズサがあれだけ使えばねぇ。"
"11034030-10-カズサ" = "……？"
"11034030-11-カズサ" = "……そんなに使ったっけ。"
"11034030-12-ヨシミ" = "まずは自分の心配したら？#nあんたと違って、私はこれが初めての怪我だし。"
"11034030-13-ヨシミ" = "と、とりあえず休憩しよう？二人とも、あんまり無理しないでね。"
"11034030-14-ヨシミ" = "私はこれくらい全然平気よ。"
"11034030-15-ヨシミ" = "……誰かさんと違って、ね。"
"11034030-16-カズサ" = "……？"
"11034030-17-カズサ" = "何それ、私のこと言ってんの？"
"11034030-18-カズサ" = "そっちこそ、柄にもなく心配してくれちゃって。"
"11034030-19-アイリ" = "……おぉ、勝敗のルールは何にする？"
"11034030-20-アイリ" = "カズサちゃんヨシミちゃん！喧嘩はダメ……！"
"11034030-21-ヨシミ" = "……いや、別に喧嘩ってほどじゃないよ、大丈夫。"
"11034030-22-カズサ" = "けど……。"
"11034030-23-ヨシミ" = "そういうことなら、セッションするわよ。私のリズムに付いてこられるか心配だけど。"
"11034030-24-カズサ" = "上等。ワンフレーズでトチらないでよね。"
"11034030-25-ヨシミ" = "何それ、自己紹介？"
"11034030-26-カズサ" = "よく吠えるね、自信無いの？"
"11034030-27-ナツ" = "これぞまさに――"
"11034030-28-ナツ" = "……ロック！！"
