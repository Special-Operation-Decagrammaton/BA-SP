[translation]
"11234060-1" = "チームワーク;最高のプログラム（２）"
"11234060-2-ナツ" = "もう一回……！"
"11234060-3-ナツ" = "もう、一回……！！"
"11234060-4-ヨシミ" = "……っていうか私たち、何やってるの？"
"11234060-5-カズサ" = "いや、あんたも最初はノリノリだったじゃん。"
"11234060-6-ヨシミ" = "いや、まあ、そうなんだけど……あれはその場の勢いっていうか……。"
"11234060-7-ナツ" = "もう一回……！！"
"11234060-8-カズサ" = "いやいや、もう充分でしょ。"
"11234060-9-アイリ" = "今度こそ、できそうな気がする……！"
"11234060-10-カズサ" = "アイリまで！？"
"11234060-11-ヨシミ" = "ああもう！あんたも集中しなさい！"
"11234060-12-カズサ" = "わ、分かったって……！"
"11234060-13-ナツ" = "ラストぉ……！！"
"11234060-14-ヨシミ" = "……？"
"11234060-15-アイリ" = "……あれ？"
"11234060-16-ナツ" = "…………。"
"11234060-17-ナツ" = "で、できた……。"
"11234060-18-ナツ" = "……できた！！"
"11234060-19-ヨシミ" = "すごい、本当にいけたわ！"
"11234060-20-アイリ" = "やったね！ナツちゃん！ヨシミちゃん！カズサちゃん！"
"11234060-21-カズサ" = "う、うん。そうだね……。"
"11234060-22-カズサ" = "えっとさ……。"
"11234060-23" = "結局、なんでこんなことしてるんだっけ……。"
