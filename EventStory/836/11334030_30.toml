[translation]
"11334030-1" = "コンディション;催眠効果（１）"
"11334030-2-カズサ" = "ただいまー……。"
"11334030-3-カズサ" = "……って何！？どうしてみんな倒れてるの！？"
"11334030-4-ヨシミ" = "む、無理……もう、これ以上は……。"
"11334030-5-ナツ" = "疲労困憊、満身創痍ー……。"
"11334030-6-アイリ" = "う、うぅ……。"
"11334030-7-カズサ" = "二人はともかくアイリまで！？"
"11334030-8-カズサ" = "……何よ「ともかく」って。"
"11334030-9-カズサ" = "あ、あはは……。"
"11334030-10-カズサ" = "おぉ、どうか慈悲を……。"
"11334030-11-カズサ" = "恵みをー……。"
"11334030-12-カズサ" = "……はぁ。"
"11334030-13-カズサ" = "まぁ、最近みんな練習頑張ってたしね……。"
"11334030-14-カズサ" = "……お菓子買ってきたし、とりあえず食べる？"
"11334030-15-ナツ" = "……！"
"11334030-16-アイリ" = "カズサちゃん……！"
"11334030-17-ヨシミ" = "偶には良いことするじゃないの、見直したわ！"
"11334030-18-カズサ" = "こういう時だけ調子良いんだから。"
"11334030-19-カズサ" = "……あれ。"
"11334030-20-カズサ" = "もしかして……。"
"11334030-21-アイリ" = "……カズサちゃん？"
"11334030-22-カズサ" = "いや、その、大したことじゃないんだけど……。"
"11334030-23-カズサ" = "…………。"
"11334030-24-カズサ" = "これならみんな、やる気出るかも。"
