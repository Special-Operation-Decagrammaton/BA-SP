[translation]
"10034030-1" = "第3話;ワイルドハントの貴人"
"10034030-2-アイリ" = "たしか、この辺りで……。"
"10034030-3-アイリ" = "……あっ、あそこです。"
"10034030-4-アイリ" = "……あれ？"
"10034030-5" = "[ns1] \"誰か演奏してるみたいだね。\"\n[ns2] \"こんな遅い時間にも人がいるんだ。\""
"10034030-6-アイリ" = "近くまで行ってみましょうか。#nここからだと、よく見えませんし……。"
"10034030-7-アイリ" = "……違う方、みたいです。"
"10034030-8-アイリ" = "う～ん、どうすれば……。"
"10034030-9-アイリ" = "どうしたんだい、お嬢さん？"
"10034030-10-ミュージシャンA" = "こんな時間に歩いてたら危ないよ。"
"10034030-11-ミュージシャンA" = "……おっと、大人が一緒なら安心だ。"
"10034030-12-ミュージシャンA" = "……何か事情がありそうだね？"
"10034030-13-ミュージシャンA" = "私でよければ話を聞こうか？"
"10034030-14" = "[s3] \"あ、それがですね……。\"\n[s4] 事情を説明する。"
"10034030-15-ミュージシャンA" = "……なるほど。"
"10034030-16-ミュージシャンA" = "たぶん、「あの人」かな。"
"10034030-17-ミュージシャンA" = "お知り合いですか！？"
"10034030-18-ミュージシャンA" = "いや。でも確か、ワイルドハントの生徒さんだね。"
"10034030-19-アイリ" = "ワイルドハント……？"
"10034030-20-アイリ" = "たしかに、あの制服は……。"
"10034030-21-アイリ" = "……そっか、だからあんなに上手だったんだ。"
"10034030-22-ミュージシャンA" = "最後に見かけた場所なら教えられるよ。"
"10034030-23-ミュージシャンA" = "まあ、今はいないと思うけど……。"
"10034030-24-ミュージシャンA" = "向こうでも誰かに声をかけて、手がかりを集めればいつか会えるんじゃないかな。"
"10034030-25-ミュージシャンA" = "……まぁ、いずれにせよ確証は無いけどね。"
"10034030-26-ミュージシャンA" = "悪いね、あまり力になれなくって。"
"10034030-27-アイリ" = "いえ、とっても助かりました。ありがとうございます。"
"10034030-28" = "[ns5] \"良ければ、その場所を教えていただけますか？\"\n[ns6] \"頑張って探してみますので。\""
"10034030-29-ミュージシャンA" = "先生……。"
"10034030-30-アイリ" = "その、やっぱりここからは私だけで……。"
"10034030-31-アイリ" = "見つかる保証も、ありませんし……。"
"10034030-32" = "[s7] \"夜の散歩は楽しいからね。\"\n[s8] \"デスクワークの気分転換にちょうど良いよ。\""
"10034030-33-ミュージシャンA" = "お嬢さん、親切は素直に受け入れるものだよ。"
"10034030-34-ミュージシャンA" = "行っておいで。#n意外と、すぐに会えるかもしれないし。"
"10034030-35-アイリ" = "は、はい……！"
"10034030-36-アイリ" = "……ありがとうございます！"
"10034030-37" = "（その後、噂のワイルドハントの生徒と会うためにあちこちを歩き回った）"
"10034030-38" = "（……気がつけば、空が明るくなり始めていた）"
"10034030-39-アイリ" = "もうこんな時間……。"
"10034030-40-アイリ" = "ごめんなさい、私のせいで……。"
"10034030-41-アイリ" = "先生は、優しい言葉をかけてくださいますが……。"
"10034030-42-アイリ" = "やっぱり、どうしても……。"
"10034030-43-アイリ" = "……って、こういう言い方こそ、先生に気を遣わせてしまいますよね。"
"10034030-44-アイリ" = "頭では、分かっているんですが……。"
"10034030-45-アイリ" = "……本当にこのままで、良いんでしょうか。"
"10034030-46-アイリ" = "私は、いつも迷惑をかけてばかりで……。#nそれに、色んなものが足りなくて……自信も、実力も……。"
"10034030-47-アイリ" = "そのワイルドハントの生徒さんは、私なんかと別世界の人だと思います。"
"10034030-48-アイリ" = "もし会えたとしても、何も取り柄がない私なんかじゃ……。"
"10034030-49" = "[ns9] \"アイリ……\"\n[ns10] \"少し、話が――\""
"10034030-50-？？？" = "……こんな夜遅くに涙を流すなんて、よろしくありませんね。"
"10034030-51-アイリ" = "だ、誰ですか……！？"
"10034030-52-アイリ" = "静かに寝ているつもりが、心配で目が覚めてしまいました。"
"10034030-53-ツムギ" = "ふふっ、私は眠れる森の姫……「[ruby=しいな]椎名[/ruby]ツムギ」です。"
"10034030-54-ツムギ" = "姫でも魔王でもスパイでも、好きなようにお呼びください。"
"10034030-55-ツムギ" = "もっとも、ここは森でもなければ、私は姫でもありませんが――"
"10034030-56-ツムギ" = "――「エモーション」。"
"10034030-57-ツムギ" = "……は大事ですから。"
"10034030-58-ツムギ" = "つまり今この時においては、そこのお嬢さんの涙。"
"10034030-59-ツムギ" = "それこそがエモーション、なのですよ。"
"10034030-60" = "[ns11] \"こんなところで寝てたの！？\"\n[ns12] \"風邪引いちゃうよ……！？\""
"10034030-61-ツムギ" = "……ふむ。"
"10034030-62-ツムギ" = "冷静にツッコミを受けてしまいましたか。"
"10034030-63-ツムギ" = "……理解しましたよ。#nあなたはヒロインを守る存在なのでしょう。"
"10034030-64-ツムギ" = "いや、それにしては……なるほど、マスコットでしたか。"
"10034030-65-アイリ" = "……？"
"10034030-66-アイリ" = "あああああっ！！"
"10034030-67-ツムギ" = "はて、いきなり発声練習とは？"
"10034030-68-アイリ" = "せ、せ、先生！！"
"10034030-69-アイリ" = "この人です！#n私が探していた、ワイルドハントの方！"
"10034030-70-ツムギ" = "……ふむ。"
"10034030-71-ツムギ" = "これはもしや、思ってもみなかった出会いなのでしょうね。"
"10034030-72-ツムギ" = "どうやら、二人とも私を探していたようですし。"
"10034030-73-ツムギ" = "……それも、こんな時間まで。"
"10034030-74-ツムギ" = "なるほど……理解しました。"
"10034030-75-ツムギ" = "そうとは知らず、迷惑をかけてしまいましたね。"
"10034030-76-アイリ" = "い、いえ……むしろこうして会えて良かったです。"
"10034030-77-ツムギ" = "ですが、旅路の果てに巡り会えたと考えれば、#nそれもまた価値ある時間だったとは思いませんか？"
"10034030-78-アイリ" = "……？"
"10034030-79-ツムギ" = "少なくとも、私はこの状況を嬉しく思っていますよ。#nまるで、古代の逸話に登場する重要な役どころのようで……"
"10034030-80-ツムギ" = "もしくは、自分自身が宝物のような存在になった気分とでも言えば良いですかね？#nああ、なんて素晴らしい出会いなんでしょう。"
"10034030-81" = "[ns13] \"本当にこの人で合ってる……？\"\n[ns14] \"ちょっと変わってる人みたいだけど……。\""
"10034030-82-アイリ" = "わ、私も実際に話すのは初めてで……。"
"10034030-83-ツムギ" = "ご安心を。#nこのようにドラマチックな[ruby=かいこう]邂逅[/ruby]を、無下にはしません。"
"10034030-84-ツムギ" = "物語においても、時と場合によって先の展開は異なってきますが――"
"10034030-85-ツムギ" = "――「ムード」。"
"10034030-86-ツムギ" = "……は大事ですから。"
"10034030-87-ツムギ" = "良いでしょう。#nこの椎名ツムギが、君たちのために全身全霊でサポートするとします。"
"10034030-88-ツムギ" = "ほ、本当ですか！？#n曲選び、手伝ってくれるんですか？"
"10034030-89-ツムギ" = "曲を選ぶ程度で助けるなどと言うのも、お恥ずかしい話ですが……"
"10034030-90-ツムギ" = "さて……今宵、可憐なヒロインはどのような曲をお求めで？"
"10034030-91-ツムギ" = "好きなイメージを聞かせてくれれば結構です。#n微力ながら、力になりましょう。"
"10034030-92-アイリ" = "じ、じゃあ……！"
"10034030-93-アイリ" = "テストやオーディションに、合格できそうな曲を……。"
"10034030-94-ツムギ" = "……？"
"10034030-95-ツムギ" = "……ふむ？"
"10034030-96-アイリ" = "あ、えっと……審査員に高評価をもらえそうな曲を教えてください！"
"10034030-97-ツムギ" = "……はて。今、なんと言いましたか？"
"10034030-98-ツムギ" = "テストやオーディションに合格できそうな曲、とは……#nいったいどのような意味でしょう？"
"10034030-99-アイリ" = "二週間後にトリニティ[ruby=カーニバル]謝肉祭[/ruby]で、ライブをするんです！"
"10034030-100-アイリ" = "そこで良い演奏をして、入選しないと……。"
"10034030-101-ツムギ" = "……なるほど。"
"10034030-102-アイリ" = "……私、何か変なこと言いましたか？"
"10034030-103-アイリ" = "それとも、もしかして失礼なことを……。"
"10034030-104-ツムギ" = "いえ、気にする必要はありません。#n他人が音を奏でる理由に口出しするなど、それこそ失礼と言うものですし。"
"10034030-105-ツムギ" = "……ふむ。"
"10034030-106-ツムギ" = "……物語のあらすじは理解しました。"
"10034030-107-アイリ" = "差し当たり、何曲か憶えがあります。"
"10034030-108-アイリ" = "本当ですか！？"
"10034030-109-ツムギ" = "……ただし。"
"10034030-110-アイリ" = "……ただし？"
"10034030-111-ツムギ" = "私の言葉を忘れてはなりません。"
"10034030-112-ツムギ" = "この場でお伝えしたところで、どれほどの意味を成すのか懐疑的ですが……。"
"10034030-113-ツムギ" = "後になって、その意味に気づく場合も往々にしてあるでしょうから。"
"10034030-114-ツムギ" = "今は頭の片隅に残してくれさえすれば、それで構いません。"
"10034030-115-アイリ" = "それは……？"
"10034030-116-ツムギ" = "……ヒロイン、[ruby=くりむら]栗村[/ruby]アイリさん。"
"10034030-117-アイリ" = "……は、はいっ！"
"10034030-118-ツムギ" = "音楽とは、人の心に寄り添うものなのです。"
"10034030-119-ツムギ" = "しかし、焦りや恐れといった感情に支配されてしまえば、#nその先に未来は無いでしょう。"
"10034030-120-ツムギ" = "決して怖がらずに、音楽と向き合われることを願っています。"
"10034030-121-ツムギ" = "……では、健闘を。"
