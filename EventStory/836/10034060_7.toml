[translation]
"10034060-1" = "第6話;資格"
"10034060-2" = "（……深夜）"
"10034060-3" = "[ns1] \"……ここにいたんだね。\"\n[ns2] \"探したよ、アイリ。\""
"10034060-4-アイリ" = "……えっ、先生？"
"10034060-5-アイリ" = "ど、どうして、ここに……？"
"10034060-6-アイリ" = "……ずっと、私を探してたんですか？"
"10034060-7-アイリ" = "あっ……すみません、モモトーク開くの忘れてて……。"
"10034060-8-アイリ" = "みんな、何か言ってましたか？"
"10034060-9-アイリ" = "……大事な話？"
"10034060-10-アイリ" = "……？"
"10034060-11-アイリ" = "……私に、ですか？"
"10034060-12" = "[s3] \"ツムギを探してるんだよね？\"\n[s4] \"アイリのことが心配になって。\""
"10034060-13-アイリ" = "……あ。"
"10034060-14-アイリ" = "……そう、でした。"
"10034060-15-アイリ" = "先生は、全部知ってますもんね……。"
"10034060-16-アイリ" = "……私を説得して、連れ戻すために来たんですか？"
"10034060-17-アイリ" = "そのために、こんな時間まで……。"
"10034060-18-アイリ" = "……また迷惑をかけて、ごめんなさい。"
"10034060-19" = "[s5] \"アイリが謝る必要は無いよ。\"\n[s6] \"無理に連れ戻す気も無いから安心して。\""
"10034060-20-アイリ" = "……本当、ですか？"
"10034060-21-アイリ" = "……先生は、本当に色々とお見通しなんですね。"
"10034060-22-アイリ" = "ですが今は、何を言われても戻れそうにありません。"
"10034060-23-アイリ" = "これは、私の問題なんです。"
"10034060-24-アイリ" = "みんなは……みんなは本当に、悪くなくて。"
"10034060-25-アイリ" = "こんな私に対しても、いつも優しいみんな……#n私にとって、大切な友達。"
"10034060-26-アイリ" = "……だから、だからっ。"
"10034060-27-アイリ" = "これ以上、迷惑はかけられません。#nもう足を引っ張るのは嫌なんです。"
"10034060-28-アイリ" = "まだ間に合います。#n今からでもツムギさんに代わってもらえば……。#n彼女なら、演奏を成功させてくれます。"
"10034060-29-アイリ" = "なので、ごめんな……さい。"
"10034060-30-アイリ" = "せっかく来て……もらい、ましたが……っ。"
"10034060-31-アイリ" = "私は……っ、もう……もう……っ！"
"10034060-32-アイリ" = "自分で……っ、言い出したこと……っなのに！"
"10034060-33-アイリ" = "……全然、ダメで……。"
"10034060-34-アイリ" = "……ダメダメ、でぇっ……！"
"10034060-35-アイリ" = "……ごめんなさい。ごめんなさい、先生。"
"10034060-36" = "[ns7] \"アイリの気持ち、聞かせてもらえる？\"\n[ns8] \"……何があって、どう悩んでるのか。\""
"10034060-37-アイリ" = "…………。"
"10034060-38-アイリ" = "……二章分。"
"10034060-39-アイリ" = "みんなより二章分も、教本が遅れてるんです。"
"10034060-40-アイリ" = "……私がすぐミスしちゃうから、最後まで通しで演奏もできなくて。"
"10034060-41-アイリ" = "私のために、付き合ってくれてるのに……。"
"10034060-42-アイリ" = "遅くまで練習しても、指が言うことを聞いてくれないし……。"
"10034060-43-アイリ" = "私が……。"
"10034060-44-アイリ" = "私が、言い出したのに……。"
"10034060-45" = "[s9] \"……うん。\"\n[s10] \"ずっと一人で悩んでたんだね。\""
"10034060-46-アイリ" = "……はい。"
"10034060-47-アイリ" = "私が落ち込んでいると……。"
"10034060-48-アイリ" = "……みんな、たくさん励ましてくれました。"
"10034060-49-アイリ" = "「大丈夫、すぐできるようになるよ」。"
"10034060-50-アイリ" = "「肩の力を抜けばいいのよ」……。"
"10034060-51-アイリ" = "「私たちがカバーするから」って……。"
"10034060-52-アイリ" = "分かってるんです、本心でそう言ってくれてるって。"
"10034060-53-アイリ" = "でも、どんどん悪い方に考えちゃって……。"
"10034060-54-アイリ" = "頭の中で、もう一人の私が囁いてくるんです。"
"10034060-55-アイリ" = "……「こんなことすらできないなんて」。"
"10034060-56-アイリ" = "「やる気がないんじゃないの？」……。"
"10034060-57-アイリ" = "「みんな、そのうち嫌気が差していなくなるよ」……。"
"10034060-58-アイリ" = "一度でも、悪い方へ悪い方へと意識が向いたら……。"
"10034060-59-アイリ" = "……もう、自分でも何も分からなくなっちゃいました。"
"10034060-60-ヨシミ" = "「どうして、私の気持ちが分からないの？」。"
"10034060-61-ヨシミ" = "「どうして、そんな無責任なこと言うの？」。"
"10034060-62-ヨシミ" = "「本当は……」。"
"10034060-63-ヨシミ" = "「私なんて、いなくてもいいんだ……」。"
"10034060-64-アイリ" = "そんなことない、なんてことはすぐに気づいてました。"
"10034060-65-アイリ" = "むしろそんなことを考えてしまう自分が嫌で。"
"10034060-66-アイリ" = "嫌で嫌で堪らなくて。"
"10034060-67-アイリ" = "なのに頭の中では、みんなのことを悪く思ってる自分がいて……。"
"10034060-68-アイリ" = "ナツちゃんも、ヨシミちゃんも、カズサちゃんも……。"
"10034060-69-アイリ" = "そんな風には思ってないって、分かってます。"
"10034060-70-アイリ" = "みんな、私の大切な友達だから……。"
"10034060-71-アイリ" = "なのに、それなのに……。"
"10034060-72-アイリ" = "なんで、悪い方に考えちゃうんだろう……。"
"10034060-73-アイリ" = "これも多分……私が、自分勝手だからなんです。#n自分のことだけ考えて、自分のことばっかり守ろうとして……。"
"10034060-74-アイリ" = "このまま一緒にいても、みんなを傷つけるだけです。"
"10034060-75-アイリ" = "なら、その前にいなくなれば良いんじゃないかなって。"
"10034060-76-アイリ" = "……何がダメだったんでしょうね。"
"10034060-77-アイリ" = "カズサちゃんはカッコよくて頼りがいがあって、#nヨシミちゃんは可愛くて行動力があります。"
"10034060-78-アイリ" = "ナツちゃんはいろんな知識があって、自分だけの世界を持ってるのに……。"
"10034060-79-アイリ" = "……私だけ、何にも無い。"
"10034060-80-アイリ" = "バンドを始めてからも、自分だけ置いてかれて……。"
"10034060-81-アイリ" = "……どうして、私には何もできないんだろう。"
"10034060-82-アイリ" = "どうして、どうして私は……。"
"10034060-83-アイリ" = "……こんなにダメな子なんでしょうか？"
"10034060-84" = "[ns11] \"…………。\"\n[ns12] \"……アイリ。\""
"10034060-85" = "[ns13] \"……ちょっとだけ、いいかな？\"\n[ns14] \"……今のアイリには何が見えてる？\""
"10034060-86-アイリ" = "……先生？"
"10034060-87-アイリ" = "……あ、ごめんなさい。"
"10034060-88-アイリ" = "あれ、私じゃなくて、先生の電話が……。"
"10034060-89" = "[ns15] \"この番号……。\"\n[ns16] \"……謝肉祭の運営委員会？\""
"10034060-90-アイリ" = "……夜分遅くに失礼いたします。#nシャーレの先生で間違いありませんか？"
"10034060-91-アイリ" = "そのですね、実は……。"
"10034060-92-ティーパーティーの生徒" = "生徒3名の身柄を、拘束していまして……。"
