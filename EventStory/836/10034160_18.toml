[translation]
"10034160-1" = "3日前：必滅者"
"10034160-2-アイリ" = "うっ……！"
"10034160-3-アイリ" = "……アイリ、どうしたの？"
"10034160-4-アイリ" = "だ、大丈夫。ちょっと肩が痛かっただけで……えへへ。"
"10034160-5-アイリ" = "大丈夫なわけないでしょ。疲れてるんじゃない？"
"10034160-6-アイリ" = "……はぁ、私も疲れたわ。ずっと同じ姿勢だとキツイわよね。"
"10034160-7-カズサ" = "ヨシミは普段運動してないからでしょ。"
"10034160-8-カズサ" = "余計なお世話！あんた人のこと言えんの！？"
"10034160-9-カズサ" = "全然平気だけど。"
"10034160-10-ヨシミ" = "ど、どうしてそんな体力あるわけ！？"
"10034160-11-ナツ" = "身のほど[ruby=わきま]を弁え[/ruby]たまえ、か弱き者たちよ！"
"10034160-12-ナツ" = "なにせ我々の体は、恐怖の怪猫キャスパリーグとは違って弱――"
"10034160-13-カズサ" = "それ！やめてって言ったよね！"
"10034160-14-ナツ" = "ひ、人は誰しも表現の自由を持ってて……！"
"10034160-15-ナツ" = "この権利は誰にも……"
"10034160-16-ナツ" = "のわっ！？"
"10034160-17-アイリ" = "……とりあえず始めようか、ヨシミちゃん。"
"10034160-18-ヨシミ" = "……うん。"
