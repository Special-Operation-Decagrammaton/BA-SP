[translation]
"11234030-1" = "チームワーク;最高のプログラム（１）"
"11234030-2-カズサ" = "うーん……。"
"11234030-3-カズサ" = "なんでだろ……。"
"11234030-4-アイリ" = "……カズサちゃん、どうかしたの？"
"11234030-5-カズサ" = "あ、いや……ちょっと気になったんだけど。"
"11234030-6-カズサ" = "微妙に音、ズレてない？"
"11234030-7-ヨシミ" = "そうね、最初よりは良くなってきたけど。"
"11234030-8-アイリ" = "みんなすごく上達したはずなのに……。"
"11234030-9-ナツ" = "個々が上達しようと、協調性が無くして完成することはない。"
"11234030-10-ナツ" = "……ってことで、みんなで練習をしよう。"
"11234030-11-カズサ" = "いや、もうやってるじゃん。"
"11234030-12-カズサ" = "どういうこと？"
"11234030-13-ナツ" = "甘いっっっっ！！！！"
"11234030-14-ナツ" = "そんな心構えでは、入選するものもしない！"
"11234030-15-ヨシミ" = "まあ、それはそうかもだけど……。"
"11234030-16-ナツ" = "全身を音に委ねるのだ！"
"11234030-17-ナツ" = "……皆の心を、一つの音に！"
"11234030-18-アイリ" = "一つの音に……？"
"11234030-19-アイリ" = "全身を、委ねる……？"
"11234030-20-ナツ" = "そのために、これから私たちは……"
"11234030-21-ナツ" = "……「組体操」をする！！"
"11234030-22-ヨシミ" = "……なにそれ。"
"11234030-23-カズサ" = "いつも通りの突拍子の無さだね……。"
"11234030-24-ナツ" = "……ふっふっふ、ここは私に任せてもらおう。"
"11234030-25-ナツ" = "最高のパフォーマンスを見せてやろうじゃあないか！"
