[translation]
"10034100-1" = "後日談その2;裏切れるということは"
"10034100-2" = "[ns1] \"そういえば、この間みんなが侵入した時……。\"\n[ns2] \"最初、正義実現委員会はいなかったんだよね？\""
"10034100-3-カズサ" = "うん、そうだよ。"
"10034100-4-ヨシミ" = "たしか自警団の人と、学園祭の関係者くらいじゃない？"
"10034100-5-ヨシミ" = "正義実現委員会は、別のことで忙しかったみたいだし……。"
"10034100-6-ナツ" = "想像してなかったんでしょ。#nまさか天下のティーパーティーが主催する学園祭で、奇襲が発生するなんて。"
"10034100-7-ヨシミ" = "……あんたもその一人でしょ。"
"10034100-8-ナツ" = "もちろん、忘れたなんて言わないよ。#nあの作戦は痺れたね、我らがキャスパリーグの先導する――"
"10034100-9-カズサ" = "……やめてって言ったよね？"
"10034100-10-ナツ" = "…[ruby=きょうやま]…杏山カ[/ruby]ズサ直伝の、喧嘩が弱くても勝てる方法！"
"10034100-11-ヨシミ" = "真正面から勝てない相手には、想定外の方法で気を引く……だっけ？"
"10034100-12-ナツ" = "その通り、すんごく効果的だったね。"
"10034100-13-ヨシミ" = "……だからって、いきなりスカートを脱いで突っ込むとは思わなかったけど。"
"10034100-14-ナツ" = "スパッツを履いてたから問題無い無い。#n完璧な計算のうえに成り立った戦術だよ。"
"10034100-15-カズサ" = "……念のため言っておくけど、スカートを脱げとは教えてないからね、私。"
"10034100-16-ナツ" = "でも、カズサの助言のおかげで目的地にたどり着けたのは本当でしょ？"
"10034100-17-カズサ" = "戦闘はほぼ私がやってたのに、なんであんたが得意げな顔してるの。"
"10034100-18-ヨシミ" = "正義実現委員会が応援に来てからは、すぐやられちゃったし。"
"10034100-19-カズサ" = "あいつらと真正面から戦っても、勝てるわけないでしょ……。"
"10034100-20-カズサ" = "終わったことなんだし、もう良いじゃん。"
"10034100-21-カズサ" = "私も久しぶりに体を動かせてスッキリしたし。"
"10034100-22-？？？" = "話は全部聞きましたよ、杏山カズサ！"
"10034100-23-？？？" = "また問題を起こしたんですね！！"
"10034100-24-カズサ" = "……げっ。"
"10034100-25-カズサ" = "よりによって、あいつの耳に入るだなんて……。"
"10034100-26" = "[ns] \"…………。\""
"10034100-27" = "[ns3] \"じゃあ、私は先に……。\"\n[ns4] \"ちょっと急用が……。\""
"10034100-28-カズサ" = "……ちょっ、先生！？"
"10034100-29-カズサ" = "ウソでしょ！？ねぇ！？"
"10034100-30-ヨシミ" = "……あ！#nそういえば私も用事を思い出したわ。"
"10034100-31-カズサ" = "じゃあ私もこの辺で。"
"10034100-32-アイリ" = "え、えっと……。"
"10034100-33-カズサ" = "う、嘘でしょ！？"
"10034100-34-カズサ" = "ねえ！#nちょっと、置いてかないでよ！"
"10034100-35-カズサ" = "こ、この……"
"10034100-36-カズサ" = "裏切り者おおおっ！！"
