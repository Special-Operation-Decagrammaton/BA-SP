[translation]
"11434020-1" = "エンディング（隠し）;\"嬉しい！けど……。\""
"11434020-2-カズサ" = "……早く、こっち！"
"11434020-3-アイリ" = "はぁ、はぁっ、はぁっ……！"
"11434020-4-ナツ" = "こ、これって……。"
"11434020-5-ヨシミ" = "喋ってないで足動かすの！はぁ、はぁっ……！"
"11434020-6-カズサ" = "ここまで来れば安全……かな。"
"11434020-7-カズサ" = "……大丈夫？"
"11434020-8-ヨシミ" = "いったい何がどうなってるわけ……？"
"11434020-9-アイリ" = "嬉しいけど、こんなことになるなんて……。"
"11434020-10-ナツ" = "……もう、ロックの域を超えてる。"
"11434020-11-カズサ" = "まったく……。"
"11434020-12-カズサ" = "……っ！！"
"11434020-13" = "\"すみません！\""
"11434020-14" = "\"どうかインタビューを……！！\""
"11434020-15" = "\"バンド名を教えてください！もう事務所には所属してるんですか！？\""
"11434020-16" = "\"素晴らしい演奏でした！！どうか少しだけでも取材を！！\""
"11434020-17-アイリ" = "わわわっ！？"
"11434020-18-アイリ" = "ど、どうしてこうなったのかなぁ……！？"
"11434020-19-カズサ" = "何でだろうね、まったく……！"
"11434020-20-ヨシミ" = "何か誤解されてるんじゃないの！？"
"11434020-21-ヨシミ" = "嬉しいような困るような……！"
"11434020-22-ナツ" = "やむを得ないね、これも宵に降り立った天才のさだめ……。"
"11434020-23-カズサ" = "悠長にしてる場合かっ！"
"11434020-24" = "（……その後、事情を説明して何とか理解してもらえた）"
