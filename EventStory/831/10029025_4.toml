[translation]
"10029025-1-食蜂操祈" = "……そうだったのねぇ。"
"10029025-2-食蜂操祈" = "御坂さんらしいというか、妙なところで素直よね……"
"10029025-3-食蜂操祈" = "でも私、[ruby=・   ・]まだ[/ruby]何もしてないんですけどぉ？"
"10029025-4-御坂美琴" = "……[ruby=みさか]御坂[/ruby]さん、私のこと嫌いみたいでぇ。#nいっつもピリピリしてるんですよぉ。"
"10029025-5" = "[ns1] \"……御坂、この子[ruby=しょくほう]が食蜂？[/ruby]\"\n[ns2] \"聞いてた話とちょっと違うような……。\""
"10029025-6-食蜂操祈" = "……えっ？"
"10029025-7-御坂美琴" = "って、いやいや！ちょっと待って！#nこれじゃ私が嘘ついてるみたいじゃない！"
"10029025-8-御坂美琴" = "なに猫被ってんのよ、食蜂！"
"10029025-9-食蜂操祈" = "あらあら？#nそうやってすぐ声を荒らげるから、トラブルに巻き込まれてるんだゾ☆"
"10029025-10-食蜂操祈" = "本人がいないところで、ありもしないことを言うなんてねぇ。"
"10029025-11-食蜂操祈" = "しかもぉ、敵かどうか見極める前に能力を教えるなんて……"
"10029025-12-食蜂操祈" = "はぁ、あなたを警戒してたのが間違いだったかしら？#nここまで単純だったなんて、思いもしなかったわぁ。"
"10029025-13-御坂美琴" = "全部、聞こえてるわよっ！"
"10029025-14-御坂美琴" = "……あれ？"
"10029025-15-御坂美琴" = "どうして、能力が……"
"10029025-16" = "[s3] \"大丈夫？\"\n[s4] \"具合が悪そうだけど……。\""
"10029025-17-御坂美琴" = "ええ、大丈夫よ……ちょっと、めまいがね。"
"10029025-18-御坂美琴" = "ただ、なんて言うか……こっちに来てから、うまく集中できなくて。#n能力を使おうとしなければ、何ともないんだけど。"
"10029025-19-御坂美琴" = "まあ、やろうと思えばできなくもないし、ちょっと調子が悪い程度よ。"
"10029025-20-御坂美琴" = "……あ。"
"10029025-21-御坂美琴" = "ということは……食蜂、もしかしてアンタも……！"
"10029025-22-食蜂操祈" = "だ～か～らぁ～、どうしてそういう重要な情報を他人の前で話しちゃうのかしらぁ？"
"10029025-23-食蜂操祈" = "私まで巻き込まないでくれる？#nせっかく人が黙ってたっていうのに。"
"10029025-24-食蜂操祈" = "どう見ても、私たちは[ruby=よそ]他所[/ruby]の人でしょう。#n少しは警戒したらどうかしら。ねぇ、御坂さん？"
"10029025-25" = "[s5] \"2人は友達なの？\"\n[s6] \"仲良しなんだね。\""
"10029025-26-御坂美琴&食蜂操祈" = "「違うから！」#n「違うわよぉ！？」"
"10029025-27" = "[s] \"……ご、ごめん。\""
"10029025-28-食蜂操祈" = "……はぁ。"
"10029025-29-食蜂操祈" = "それでぇ？#nみんなして私のところに来た理由は、その「常識」とやらを渡すためなのよねぇ。"
"10029025-30-食蜂操祈" = "あなたのことは……先生、と呼べば良いのかしらぁ？"
"10029025-31" = "[s7] エンジニア部からもらった銃を渡す。\n[s8] \"うん、これを渡しに来たんだ。\""
"10029025-32-食蜂操祈" = "ふぅ～ん……"
"10029025-33-食蜂操祈" = "……軽いわねぇ。#nでも、作りはちゃんとしてる。"
"10029025-34-食蜂操祈" = "御坂さんと違って、私はこういうの持ち歩くタイプじゃないけどぉ……#nここでは持ってない方が不自然なのよねぇ？"
"10029025-35-食蜂操祈" = "一応、お礼は言っておこうかしら。#nごめんなさいねぇ。私、そんなに愛想力が高くないのよ。"
"10029025-36-食蜂操祈" = "けどぉ、必要な時はちゃ～んと協力するから、そこは安心してもらって構わないわぁ。"
"10029025-37-食蜂操祈" = "……アンタにしては、やけに素直じゃないの。"
"10029025-38-食蜂操祈" = "誰のせいで、こうなったのかしらぁ……？"
"10029025-39-食蜂操祈" = "……ここまで来ると、わざとやってるんじゃないかって思えてきたわねぇ。"
"10029025-40-御坂美琴" = "私のせいだって言いたいの！？"
"10029025-41-エイミ" = "どちらにせよ、今は協力した方が効率がいい。#nケンカは後で。"
"10029025-42-エイミ" = "次は、もう1人のところに……"
"10029025-43-エイミ" = "……あれ。"
"10029025-44" = "[ns9] \"……エイミ？\"\n[ns10] \"ヒマリから連絡？\""
"10029025-45-エイミ" = "うん、「施設」の解析が終わったって。"
"10029025-46-エイミ" = "じゃあ、戻ろっか。"
"10029025-47-エイミ" = "……それと最後の1人は、部長と一緒にいるみたい。"
