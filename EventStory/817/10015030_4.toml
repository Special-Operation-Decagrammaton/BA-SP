[translation]
"10015030-1" = "第3話;ミレニアムのトレーナー"
"10015030-2" = "ミレニアム・西側別館"
"10015030-3" = "（ノアと一緒に部活を巡回し、大運動会の業務をお願いしていると……）"
"10015030-4-ノア" = "えっと……故障した機器の修理はエンジニア部に、電算業務もヴェリタスにお任せしましたし……"
"10015030-5-ノア" = "あと残っているのは、出場選手のコンディションチェックと、エントリーの整理ですね。"
"10015030-6" = "[s] \"コンディションチェック？\""
"10015030-7-ノア" = "はい。選手が試合で最善のパフォーマンスが出せるよう、個人のコンディションをチェックし、サポートするのもセミナーの仕事ですから。"
"10015030-8-ノア" = "ただ、私含むセミナーの者はこのような分野に関しては門外漢なので……#n「トレーニング部」の皆さんにご協力頂いています。"
"10015030-9-ノア" = "……この時間ならおそらく、彼女たちも最後の調整をしているところでしょう。"
"10015030-10-ノア" = "選手たちの応援も兼ねて、ちょっとフィットネスセンターに寄ってみましょうか？"
"10015030-11" = "ミレニアム・フィットネスセンター"
"10015030-12-スミレ" = "お尻を後ろに突き出して、膝とつま先の向きは一緒！"
"10015030-13-スミレ" = "さあ、スクワット2セット追加です！"
"10015030-14-ミレニアムの選手A" = "ちょ、ちょっと待ってください、スミレ部長！#nさっき、最後のセットだって言ってましたよね！？"
"10015030-15-ミレニアムの選手B" = "そうですよ！#nしかもその前も最後って言ってませんでした！？"
"10015030-16-スミレ" = "バックスクワットはバーベルを使用して筋肉に負荷を与え、成長を促す運動……"
"10015030-17-スミレ" = "初心者の皆さんのために低重量のバーベルを用意しましたが、しっかりとした刺激を与えるためには反復トレーニングは必須ですからね。"
"10015030-18-スミレ" = "大運動会で良い成績を修めるためにも、諦めず最後まで一緒に頑張りましょう！"
"10015030-19-ミレニアムの選手A" = "こんな厳しいトレーニングをずっと続けてたら……"
"10015030-20-ミレニアムの選手B" = "大会が始まる前に倒れちゃうよ……。"
"10015030-21-スミレ" = "……もうこんな時間なんですね。"
"10015030-22-スミレ" = "それでは……少し休憩した後、引き続きトレーニングを再開しましょう。"
"10015030-23-スミレ" = "ふふ、スミレさんは相変わらず厳しいですね。"
"10015030-24-スミレ" = "あれ？ノアさん……そしてトレーナー？"
"10015030-25-スミレ" = "こんな時間にどうされたのですか？"
"10015030-26-ノア" = "明日行われる大運動会の最終点検がてら、選手の皆さんの様子を見に来ました。"
"10015030-27-ノア" = "深夜までのトレーニング、お疲れ様です。"
"10015030-28" = "[s1] \"スミレ、久しぶり。\"\n[s2] \"いつもより生き生きしてるね。\""
"10015030-29-スミレ" = "もちろんです、トレーナー。"
"10015030-30-ノア" = "明日はミレニアム主催の「[ruby=こうりんたいさい]晄輪大祭[/ruby]」当日なんですから！"
"10015030-31-スミレ" = "普段はスポーツに興味がないミレニアム生も、#nこの日だけは選手が織りなす脚本のないドラマから、目を離せないことでしょう。"
"10015030-32-スミレ" = "コートの上で熱くぶつかり合う選手……"
"10015030-33-スミレ" = "会場に響き渡る歓声……"
"10015030-34-スミレ" = "そう……ミレニアム生にスポーツの魅力を伝える絶好のチャンスなんです！"
"10015030-35" = "[s] \"お、落ち着いて……。\""
"10015030-36-スミレ" = "あ、思わず……失礼しました。"
"10015030-37-スミレ" = "今日は明日の試合に備えて、他の生徒と一緒に汗を流していましたが……"
"10015030-38-スミレ" = "……あれ？#n先ほどまで一緒にスクワットをしていたはずですが、彼女たちはどこに……？"
"10015030-39-スミレ" = "……明日の試合のために、先に帰ったみたいですね。"
"10015030-40-ノア" = "寝るには早いですが、だいぶ遅い時間ですから。"
"10015030-41-スミレ" = "えっ？まだ軽いストレッチとスクワットしかしてませんよ？"
"10015030-42-ノア" = "初心者用のサーキットトレーニングは、様々な部位の筋肉を順番に強化していかないといけないのに……"
"10015030-43-スミレ" = "新しいケーブルマシンも届いたから、#n他のアイソレーション種目も教えようと思っていたのに……"
"10015030-44-スミレ" = "運動が終わった後すぐ飲めるよう、プロテインドリンクも用意したのに……"
"10015030-45" = "[s] \"色々と用意してたんだね……。\""
"10015030-46-スミレ" = "もちろんです。#nセミナーに任されたトレーニングですから、一秒たりとも無駄にはできません。"
"10015030-47-スミレ" = "人体は様々な変数で構成されたオブジェクトです。そのため、画一化されたトレーニングスケジュールでは、様々な誤差が生じる可能性があります。"
"10015030-48-スミレ" = "私たち「トレーニング部」では、選手の皆さんの献立から生活習慣まで細かく分析し、個人の環境と特性に最適化されたトレーニングスケジュールを提示しています。"
"10015030-49-スミレ" = "……先ほど言ったように、今回の大運動会は生徒たちにスポーツの魅力を伝える機会でもありますが……私たちトレーニング部の実験の成果を証明できる機会でもあるのです。"
"10015030-50-スミレ" = "ええ……ですので、明日の大運動会はとても楽しみです。"
"10015030-51" = "[s3] \"こういう姿を見ると……。\"\n[s4] \"スミレも、間違いなくミレニアムの生徒なんだね。\""
"10015030-52-ノア" = "ふふ、ミレニアムの活動はすべて科学的な研究に基づいて行われていますから。"
"10015030-53-ノア" = "トレーニング部の皆さんに頑張っていただいた分、今回の大運動会ではミレニアムの選手たちが良い記録を残せたらいいですね。"
"10015030-54-スミレ" = "……残念ですが、それは難しそうです。"
"10015030-55-スミレ" = "大会に出場するほとんどの選手が、トレーニングを経験したことのないスポーツ初心者で……トレーニング期間も十分ではありません。"
"10015030-56-スミレ" = "ですがご安心を。#n大運動会の価値は競技の勝敗や記録ではなく、参加そのものにありますからね！"
"10015030-57-スミレ" = "……でも、少し残念なのも事実です。"
"10015030-58-スミレ" = "短いトレーニング期間を補うために、筋肉を効率的に成長させることができるトレーニングプランを立てたのですが、みんな途中で諦めてしまって……"
"10015030-59" = "[s] \"そんなにハードスケジュールだったの？\""
"10015030-60-スミレ" = "いえ、そんなことは。#nバランスが取れた筋肉を作るため、1日2時間の無酸素運動をお願いしただけですよ。"
"10015030-61-スミレ" = "もちろん、ウォーミングアップのためのストレッチと、#n有酸素運動にかかる時間は除外していますけど……"
"10015030-62-スミレ" = "で、ですが、長くても1日4時間は超えないので！"
"10015030-63" = "[s] （トレーニング部に来た生徒が逃げる理由が分かる気がする……）"
"10015030-64-スミレ" = "そうだ……せっかくフィットネスクラブに来ていただいたので、#nトレーナーも軽く運動をしていかれては？"
"10015030-65" = "[s7] \"お誘いは嬉しいんだけど、大運動会の準備が忙しくて……。\"\n[s8] \"私たちはちょっと用事が……ね、ノア？\""
"10015030-66-ノア" = "いえ、そんなに急ぐ必要はありませんよ。"
"10015030-67-ノア" = "各部活の巡回も思ったより早く終わりましたし、#n残りはエンジニア部のところに行って、修理されたロボットを受け取るぐらいですし……"
"10015030-68-ノア" = "お願いをしている立場ですから、早く行っても困らせてしまうでしょうし……"
"10015030-69-ノア" = "あと30分くらいは、ここで休んでも大丈夫ですよ。"
"10015030-70-ノア" = "30分ですか……"
"10015030-71-ノア" = "軽くウェイトトレーニングをするのに、ちょうどいい時間ですね！"
"10015030-72" = "[ns] \"そしたら……ノアも一緒に運動する？\""
"10015030-73-ノア" = "ええ、それはもう――"
"10015030-74-ノア" = "あら、急な案件が……"
"10015030-75-ノア" = "残念ですが、私は先にこちらを処理しないと……。"
"10015030-76-ノア" = "その間、先生はスミレさんとゆっくりトレーニングを楽しんでください。"
"10015030-77" = "[ns] \"あっ、ずるい！一人だけ逃げるなんて！\""
"10015030-78-スミレ" = "ふふっ、ちょうど、新導入したウルトラスミスマシンで、トレーナーと一緒にアイソレーションをしたかったところです！"
"10015030-79-スミレ" = "さあ、まずはここに立ってください。"
"10015030-80" = "[ns] \"お……重い……！\""
"10015030-81-スミレ" = "どうしました？ふらついてますよ。"
"10015030-82-スミレ" = "膝とつま先の向きを一致させて、腰はまっすぐに！"
"10015030-83-スミレ" = "あと3セット……始めます！"
"10015030-84-ノア" = "先生、怪我にお気をつけて～"
"10015030-85" = "（その後30分間……疲れ果てるまでスミレとみっちりトレーニングをした……）"
