[translation]
"10015050-1" = "第5話;晄輪大祭に反対する会"
"10015050-2-ミレニアム生徒B" = "これ……大運動会で使うロボットなんだよね？"
"10015050-3-ミレニアム生徒B" = "どうみても「戦車」だけど……"
"10015050-4-ミレニアム生徒A" = "これを何に使おうとして作ったのかしら？"
"10015050-5-ミレニアム生徒B" = "大玉転がしで、代わりに使うとか……？"
"10015050-6-ミレニアム生徒A" = "こんな鉄の塊を素手で転がせるわけないでしょ。#n下に車輪もついてるわよ？"
"10015050-7-ミレニアム生徒B" = "マラソンで、ペース調節のために後ろから追いかけてくるとか……"
"10015050-8-ミレニアム生徒C" = "ロボットから逃げ続けるなんて、考えただけでもぞっとする……"
"10015050-9-ミレニアム生徒A" = "ふん……今さら驚きもしないわ。"
"10015050-10-ミレニアム生徒A" = "あいつらは健全な肉体を育成するとか、親睦を図るとか――#nあらゆる言い訳をしながら、ミレニアム生を苦しめてきたからね。"
"10015050-11-ミレニアム生徒A" = "どうせ、この戦闘ロボットもあいつらが作った恐ろしい拷問機械の一つよ。"
"10015050-12-一同" = "……やっぱり「大運動会」は中止させなきゃ！！"
"10015050-13-ミレニアム生徒A" = "いま、大運動会の話をしましたか。"
"10015050-14-スミレ" = "ひ、ひいぃ！？"
"10015050-15-スミレ" = "ト、トレーニング部の部長……？#nいつの間に……？"
"10015050-16-ミレニアム生徒A" = "あ、驚かせてしまったらすみません。"
"10015050-17-ミレニアム生徒A" = "急に大運動会という単語が聞こえましたので。"
"10015050-18-スミレ" = "こんなに遅くまで、寝ないで話に花を咲かせているということは……"
"10015050-19-スミレ" = "やはり皆さんも、明日の大運動会を楽しみにしているようですね！"
"10015050-20-ミレニアム生徒B" = "それは、その……"
"10015050-21-ミレニアム生徒A" = "私たちは大運動会を楽しみにしていたのではなくて……"
"10015050-22-ミレニアム生徒B" = "ふふ、みなまで言わずとも分かります。#n明日の大会が楽しみで眠れないのは、私も同じですから。"
"10015050-23-ミレニアム生徒A" = "大運動会……それは「健全なる精神は健全なる肉体に宿る」という理念に基づき、運動を通じた生徒たちの成長を目的とした催し……"
"10015050-24-スミレ" = "泰平なるキヴォトスという理念を掲げて学園問わず互いに切磋琢磨し、公明正大に競技を繰り広げる祭典が、他でもない私たちミレニアムで開かれる……"
"10015050-25-スミレ" = "ええ……眠れないほど興奮して当然ですよね！"
"10015050-26-ミレニアム生徒B" = "（この人……どうして答えてもないのに、勝手に話を進めるの？）"
"10015050-27-ミレニアム生徒A" = "（これだから体育会系は……）"
"10015050-28-ミレニアム生徒A" = "ところで、皆さんはどの種目に出場する予定ですか？"
"10015050-29-ミレニアム生徒A" = "盗み聞きするつもりはなかったのですが、さっきちらっと大玉転がしという話を聞いた気がして……"
"10015050-30-スミレ" = "あー、えっと……そう！#n私たちは大玉転がしに出る予定だったのよ。"
"10015050-31-スミレ" = "大会を控えて、最後に作戦会議をしてたところだったの……"
"10015050-32-ミレニアム生徒A" = "大玉転がしで……作戦ですか？"
"10015050-33-スミレ" = "や、やっぱり大玉転がしで作戦を練るのはおかしいかな……？"
"10015050-34-スミレ" = "いえ！とても良い姿勢だと思います！"
"10015050-35-ミレニアム生徒A" = "大玉転がしは世間の認識と違って、甘くないですからね！"
"10015050-36-スミレ" = "ボールを安定して移送するためには、十分な上半身の筋力と、折り返し地点で素早く方向を制御するための瞬発力が必要不可欠です。"
"10015050-37-スミレ" = "それに、トラックで発生しうる不規則バウンドを考慮して方向転換しやすいスタッドを着用して下半身の筋力を鍛えないと――"
"10015050-38-ミレニアム生徒B" = "あ、えっと……"
"10015050-39-ミレニアム生徒A" = "ご、ごめん……そろそろ私たちは帰ろうかな……"
"10015050-40-チヒロ" = "スミレ部長！そこの生徒たち、捕まえて！"
"10015050-41-スミレ" = "あれ？先生とヴェリタスの皆さん？#nそして……"
"10015050-42-スミレ" = "エンジニア部の皆さんまで！？#nその格好は一体……。"
"10015050-43-コトリ" = "その……この服は……"
"10015050-44-コトリ" = "先生を追いかけてたら……着替えるチャンスがなかったと言いますか……"
"10015050-45-コトリ" = "この衣装について説明しますと、ヒビキが一昨年コスプレに趣味を持ち始めた時まで遡りますが――"
"10015050-46-コトリ" = "ごめん、コトリ。時間がないから説明は省略させてもらうよ。"
"10015050-47-ウタハ" = "結論から言うと……"
"10015050-48-ウタハ" = "そこにいるのが、私たちの応援ロボットを盗んだ犯人だ！"
"10015050-49-スミレ" = "応援ロボットを盗んだ犯人……？"
"10015050-50-怪しいミレニアム生徒B" = "応援……ロボット？"
"10015050-51-怪しいミレニアム生徒A" = "応援……？"
"10015050-52" = "[s1] \"なんでみんな驚いてるの……。\"\n[s2] \"犯人じゃない、とか……？\""
"10015050-53-怪しいミレニアム生徒A" = "応援ロボットなんか盗んだことないわよ！#n私たちはただ……"
"10015050-54-怪しいミレニアム生徒B" = "そうよ！私たちはただ、大運動会を邪魔しようと爆発を起こしたり、サーバーをハッキングしたりしたけど、応援ロボットは――"
"10015050-55-怪しいミレニアム生徒B" = "あちゃー……"
"10015050-56-ノア" = "ふふ、どうやら彼女たちが犯人で間違いないみたいですね。"
"10015050-57-ノア" = "皆さんが大運動会を邪魔しようとする理由は分かりませんが、#nこの辺りでやめていただけませんか？"
"10015050-58-ノア" = "「[ruby=こうりんたいさい]晄輪大祭[/ruby]」は多くの生徒の願いが込められた、キヴォトス最大規模のお祭りです。"
"10015050-59-ノア" = "皆さんの妨害で、私たちセミナーはもちろん、多くの生徒が困っています。"
"10015050-60-ノア" = "今からでもロボットを返していただければ、この事は不問にしますが……"
"10015050-61-ノア" = "もし、私たちセミナーの「冷酷な算術使い」が、この事実を知ることになったら……"
"10015050-62-ノア" = "どんな反応をするかは、ご想像にお任せします。"
"10015050-63-怪しいミレニアム生徒A" = "「冷酷な算術使い」って……あのユウカのこと？"
"10015050-64-怪しいミレニアム生徒B" = "……私も、噂は聞いたことある。"
"10015050-65-怪しいミレニアム生徒B" = "とんでもない発明品を作ってユウカ会計の機嫌を損ねた生徒が、研究費を削減されて破産したとか……"
"10015050-66-怪しいミレニアム生徒A" = "ミレニアム生の研究費削減は死刑宣告に他ならないのに……なんて恐ろしい……"
"10015050-67-怪しいミレニアム生徒A" = "でも、そんな脅迫に屈するほど、私たち「晄・反・会」の意思は弱くないわ！"
"10015050-68" = "[s] \"晄・反・会……？\""
"10015050-69-怪しいミレニアム生徒B" = "そう……私たちは「晄輪大祭に反対するミレニアム生の会」――"
"10015050-70-ミレニアムの生徒B" = "略して「晄反会」よ！"
"10015050-71-ミレニアムの生徒B" = "ミレニアムの生徒全員が大運動会の開催を待っていると思ったら大間違いよ！"
"10015050-72-ミレニアムの生徒B" = "大運動会に反対する生徒がいたなんて、そんな……"
"10015050-73-スミレ" = "も、もちろん一生懸命準備してきた生徒には悪いけど……"
"10015050-74-ミレニアムの生徒A" = "私たちにも退けない理由があるんだよ！"
"10015050-75-チヒロ" = "……それで、盗んだ応援ロボットはどこにあるの？"
"10015050-76-チヒロ" = "返さないなら、多少強引な手を使ってでも回収するから。"
"10015050-77-ミレニアムの生徒A" = "だから、私たちは応援ロボットなんて盗んでないって言ってるでしょ？"
"10015050-78-ミレニアムの生徒B" = "どうにも言葉が通じないみたいだから……仕方ない。"
"10015050-79-ミレニアムの生徒A" = "エンジニア部から盗んできたこの「戦車」で相手にしてやろうじゃないの！"
"10015050-80-ミレニアムの生徒A" = "出て来い、「トラック・クラッシャー」！"
"10015050-81" = "[ns] \"あ、あれ何！？\""
"10015050-82-チヒロ" = "ちょっと待って、戦車があるなんて聞いてない！"
"10015050-83-マキ" = "あはは！何あれ、すっごくカッコいい！"
"10015050-84-マキ" = "あのボールみたいな形のロボット、エンジニア部で作ったの？#n塗装はちょっと残念だけど、デザインはめっちゃクールじゃん！"
"10015050-85-マキ" = "……うん。#nまだ無事に作動してるみたいでよかった。"
"10015050-86-ウタハ" = "「トラック・クラッシャー」……残念なネーミングセンスだね。"
"10015050-87-ウタハ" = "時間がもう少し残っていたら、あのロボットに似合うもっと素敵な名前をつけてあげられたのに。"
"10015050-88-ウタハ" = "……こんなこと言うのはアレですが、ウタハ先輩のネーミングセンスもどっこいどっこいですよ。"
"10015050-89-ウタハ" = "……とりあえず「トラック・クラッシャー」でいいんじゃないかな？"
"10015050-90-コトリ" = "うむ……使い手が満足しているみたいだし、異論はないけれど……"
"10015050-91-ノア" = "……エンジニア部の皆さん？"
"10015050-92-コトリ" = "図面を見た時、すでにある程度予想はしていましたが……"
"10015050-93-ノア" = "あの戦車は、一体何ですか？"
"10015050-94-コトリ" = "あ、ええと……それが……"
"10015050-95-ウタハ" = "ご覧の通り、応援ロボットだよ。"
"10015050-96-ノア" = "………"
"10015050-97-ノア" = "丈夫な装甲ですね？"
"10015050-98-ノア" = "不慮の事故でも故障しないよう、頑丈に設計してほしいと頼まれましたから！"
"10015050-99-ノア" = "丁寧に熱処理を施した装甲は、並大抵の弾丸ではびくともしません！"
"10015050-100-ノア" = "外輪カタピラは……"
"10015050-101-ノア" = "観客を案内するには、会場のどの場所でも移動できなければならない……でしょ？"
"10015050-102-ノア" = "傾斜路の多いスタジアム内でも安心して使えるよ。"
"10015050-103-ノア" = "……15mm機関砲は、何故？"
"10015050-104-ノア" = "大運動会がいくらお祭りだとしても、#nその安寧を脅かす無法者はどこにでもいるものだからね。"
"10015050-105-ノア" = "不測の事態に備えて、自主的に武力鎮圧ができるよう戦闘モードを搭載しているよ。"
"10015050-106-ウタハ" = "……なるほど。"
"10015050-107" = "[s] \"……説得されないで！？\""
"10015050-108-ノア" = "あら、失礼しました……あまりにも斬新なアイデアだったので、思わず。"
"10015050-109-チヒロ" = "漫才やってる場合？あの戦車をどうにかしないと！"
"10015050-110-ノア" = "……お聞きしたいことは山ほどありますが、#nどうやら今は、ゆっくりお話ができるタイミングではなさそうですね。"
"10015050-111-ノア" = "先生、現場の指揮をお願いいたします。"
