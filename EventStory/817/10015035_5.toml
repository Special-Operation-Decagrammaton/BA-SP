[translation]
"10015035-1-怪しいミレニアム生徒C" = "……サボタージュは計画通りに進んでる？"
"10015035-2-怪しいミレニアム生徒C" = "問題ない。新素材開発部の複合爆発物質が「[ruby=こうりんたいさい]晄輪大祭[/ruby]」で使う予定のロボットをぶち壊したよ。"
"10015035-3-怪しいミレニアム生徒C" = "新しく作りでもしない限り、開会式までにロボットを修理するのは不可能だろうね。"
"10015035-4-怪しいミレニアム生徒A" = "そう、よくやったわ。#n校内のサーバーをハッキングして通信障害を起こす計画はどう？"
"10015035-5-怪しいミレニアム生徒B" = "それが……準備したハッキングツールがセキュリティシステムに阻まれて、全部無力化されちゃって……。"
"10015035-6-怪しいミレニアム生徒A" = "ちょっと……そのハッキングツールを準備するのに、いくらかかったと思ってんの？"
"10015035-7-怪しいミレニアム生徒B" = "仕方ないでしょ！相手はあのヴェリタスの副部長だよ？"
"10015035-8-怪しいミレニアム生徒B" = "セミナーでさえセキュリティ関連では太刀打ちできないような相手を、#n私たちのような初心者がどう相手するのさ？"
"10015035-9-怪しいミレニアム生徒A" = "チッ……仕方ないわね。通信網を利用したサボタージュは諦めて……"
"10015035-10-怪しいミレニアム生徒A" = "でも、これだけじゃ、セミナーの意志を挫くにはまだ足りない……#n他に方法はないのかしら。"
"10015035-11-怪しいミレニアム生徒C" = "えっと、代わりというにはアレだけど……#n工業実習室の方でこんなものを見つけたんだ……"
"10015035-12-怪しいミレニアム生徒A" = "この「ロボット」なら、まだセキュリティクラウドに登録されてないはずだからハッキングツールが使えるんじゃないかな？"
"10015035-13-怪しいミレニアム生徒B" = "悪くないね。#nところで、エンジニア部はいつの間にこんな「戦闘用ロボット」を開発したの？"
"10015035-14-怪しいミレニアム生徒A" = "出所はどうでもいいでしょ。#nこのロボットのハッキングに成功すれば、直接手を使わず大運動会を中止させることができるわね。"
"10015035-15-怪しいミレニアム生徒B" = "大運動会の準備してきたセミナーには申し訳ないけど、仕方がないの……"
"10015035-16-怪しいミレニアム生徒C" = "これ以上の「被害者」を増やさないためにも……"
"10015035-17-一同" = "「大運動会」を中止させなきゃ！"
