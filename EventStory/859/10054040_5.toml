[translation]
"10054040-1" = "第4話;水遊びと査察、総合的に休暇（２）"
"10054040-2-シュン" = "皆さん、いいですか？"
"10054040-3-シュン" = "準備体操をしていても、十分気をつけること。"
"10054040-4-シュン" = "何かあった場合は、すぐに先生や私を呼ぶこと。"
"10054040-5-シュン" = "この2つは絶対に守ってくださいね？"
"10054040-6-ココナ" = "は～い！"
"10054040-7-ルミ" = "キサキは行かないの？"
"10054040-8-キサキ" = "妾は……ここで十分じゃ。"
"10054040-9-キサキ" = "座って水面を眺めるだけで、頭がすっきりするような心地での。"
"10054040-10-ルミ" = "そっか……来たくなったらいつでもおいでね！"
"10054040-11-キサキ" = "皆、元気がいいのう。良きことじゃ。"
"10054040-12-キサキ" = "……。"
"10054040-13-キサキ" = "水は[ruby=せいら]青羅[/ruby]の帯と[ruby=な]作[/ruby]り――"
"10054040-14-キサキ" = "山は[ruby=へきぎょく]碧玉[/ruby][ruby=かんざし]の簪の[/ruby]如し。"
"10054040-15-キサキ" = "[ruby=そ]其[/ruby]は仙界に登るにもなお勝り――"
"10054040-16-キサキ" = "[ruby=いずく]安ん[/ruby]ぞ鶴に乗りて飛ぶ由あらんや……。"
"10054040-17-キサキ" = "もっと早く、このような時間を過ごしておれば……。"
"10054040-18-キサキ" = "いいや、今でもこうして……。"
"10054040-19-キサキ" = "これも……皆と――"
"10054040-20-キサキ" = "先生のおかげじゃな。"
"10054040-21-ココナ" = "そっ、そろそろ……げん、かい……っ！"
"10054040-22-キサキ" = "ココナ！？"
"10054040-23-ルミ" = "大丈夫！もっと強く蹴ってみて！"
"10054040-24-シュン" = "何かあっても、お姉さんたちがついていますよ！"
"10054040-25-ココナ" = "で、でも別に泳げなくても……。"
"10054040-26-ルミ" = "いいのかな？水泳もレディーの嗜みなんだよ？"
"10054040-27-ココナ" = "……ほ、本当ですか？"
"10054040-28-シュン" = "あらゆる事に備えるのが、真のレディーだと思います。"
"10054040-29-ココナ" = "うぅ……シュン姉さんはそれっぽいことばっかり言って……。"
"10054040-30-キサキ" = "はぁ……あの2人がついておれば安心じゃな。"
"10054040-31-キサキ" = "休暇に、こうも人を変える力があるとはのう……。"
"10054040-32" = "[ns] \"じゃあ、キサキも羽目を外してみない？\""
"10054040-33-キサキ" = "先生！？"
"10054040-34-キサキ" = "いつからそこに……。"
"10054040-35-キサキ" = "ここに座ったままでは普段と変わらぬ。#nそれは分かっておるのじゃが……妾はこのままでも……。"
"10054040-36-キサキ" = "いいや、せっかくの休暇じゃ。これも経験か。#n……して、何をすればいいのかえ？"
"10054040-37-キサキ" = "……なるほど。共に川へ入れと申すか。"
"10054040-38-キサキ" = "……。"
"10054040-39-キサキ" = "よい。"
"10054040-40-キサキ" = "その代わり……手を離したら許さぬぞ？"
"10054040-41" = "[s] \"！？\""
"10054040-42" = "（おずおずと差し出されたキサキの手を握って、水辺に下りた）"
"10054040-43" = "（キサキの体は少し震えていた）"
"10054040-44-キサキ" = "冷たっ……！"
"10054040-45-キサキ" = "なんじゃ、先生。妾は平気じゃぞ。#n存外に水が冷たかっただけじゃ。"
"10054040-46-キサキ" = "……。"
"10054040-47-キサキ" = "す、少し速くないかの？もう少し、ゆっくり……。"
"10054040-48" = "（キサキの歩調に合わせて、ゆっくり進んだ）"
"10054040-49-キサキ" = "っ！？"
"10054040-50-キサキ" = "な、何かぬるりとしたものが脚に触れたのじゃが！？"
"10054040-51-キサキ" = "……魚？#nそうか。ここには魚がおるのじゃな。"
"10054040-52-キサキ" = "……。"
"10054040-53-キサキ" = "綺麗じゃな。足が見えるほど、水が透き通っておる。"
"10054040-54-キサキ" = "ふふ。底が見えれば怖さも和らぐのう。"
"10054040-55-キサキ" = "これなら、もっと……。"
"10054040-56-キサキ" = "うっ！？"
"10054040-57" = "（キサキが体勢を崩してしまった！）"
"10054040-58" = "（倒れないよう、とっさに支えた）"
"10054040-59" = "[ns] \"大丈夫？\""
"10054040-60-キサキ" = "心配は要らぬ。其方が手を握ってくれていたおかげじゃ。"
"10054040-61-キサキ" = "……。"
"10054040-62-キサキ" = "いや……やはり大丈夫ではないようじゃ。"
"10054040-63" = "[s] \"え……！？\""
"10054040-64-キサキ" = "じゃから、先生。"
"10054040-65-キサキ" = "おんぶしてくりゃれ。"
"10054040-66" = "（屈んで、キサキをおんぶしてあげた）"
"10054040-67-キサキ" = "重くないかえ？"
"10054040-68-キサキ" = "……何も感じない？それはそれで心配になる感想じゃな。"
"10054040-69-キサキ" = "なんだか……あの時を思い出すの。"
"10054040-70-キサキ" = "……。"
"10054040-71-キサキ" = "先生には、最大限の感謝を。"
"10054040-72-キサキ" = "……何も飾らぬ本心じゃ。"
"10054040-73-キサキ" = "……。"
"10054040-74-キサキ" = "そろそろ、降ろしてはくれぬか。"
"10054040-75" = "[ns] \"もう大丈夫そう？\""
"10054040-76-キサキ" = "ああ。"
"10054040-77-キサキ" = "其方の背中は楽しんだからの。"
"10054040-78-キサキ" = "どれ、少しは水泳をやってみようか。"
"10054040-79-キサキ" = "一度とて経験はないが……。"
"10054040-80-キサキ" = "それでも理論は熟知しておる。そう難しくはないはずじゃ。"
"10054040-81" = "（キサキは自信満々に水の中へ飛び込んだ）"
"10054040-82" = "（そして、ジタバタしていた）"
"10054040-83" = "[ns] \"キサキ！？\""
"10054040-84-キサキ" = "……問題ない。まだ初回じゃからな。"
"10054040-85-キサキ" = "もう一度……。"
"10054040-86" = "[ns] \"キサキ――！！\""
"10054040-87-キサキ" = "こんなはず……では……。"
"10054040-88-キサキ" = "……。"
"10054040-89-キサキ" = "やはり、知識だけでは足りぬか……。"
"10054040-90-キサキ" = "知行合一とは、即ち同等の実践が求められるもの……。"
"10054040-91-？？？" = "じゃあ、あたしが手伝ってあげよう！"
"10054040-92-キサキ" = "っ！？"
"10054040-93-ルミ" = "あはは！#n水と仲良くなるには、まずは水に浸かるところからだよ！"
"10054040-94-ルミ" = "ルミ……驚かせるでない。"
"10054040-95-キサキ" = "それを言うなら、あたしだってびっくりしたんだよ？"
"10054040-96-キサキ" = "ま、さ、か。キサキが先生と個人レッスンしてるなんてねぇ～？"
"10054040-97-ルミ" = "それは……！"
"10054040-98-ルミ" = "……。"
"10054040-99-ルミ" = "其方は昔から察しが良すぎるのじゃ……。"
"10054040-100-キサキ" = "とにかく、泳げるようになりたいなら、形からでも数をこなさないと！"
"10054040-101-キサキ" = "待つのじゃ。まだ心の準備が――"
"10054040-102-ルミ" = "あははっ！ほらほら！もっと大きく腕を回して！置いてっちゃうよ～？"
"10054040-103-キサキ" = "少しは身長差を考慮せんか！"
"10054040-104-キサキ" = "まったく、少しは手加減せんか。"
"10054040-105-ルミ" = "せめて1回くらいはあたしを捕まえてから言ってほしいかな～"
"10054040-106-キサキ" = "二言はないな？"
"10054040-107" = "[ns1] \"いつの間にか……。\"\n[ns2] \"泳ぎが上手になってる！\""
"10054040-108-キサキ" = "？？？"
"10054040-109-ルミ" = "はい、よくできました。"
"10054040-110-キサキ" = "……。"
"10054040-111-キサキ" = "まさか、これを狙っていたのか……？"
"10054040-112-ルミ" = "さあ～？なんのことかな～？"
"10054040-113-ルミ" = "ちょっとしたイタズラ心があったのは本当だけどね。"
"10054040-114-キサキ" = "あ、あれは、じゃから……。"
"10054040-115-ルミ" = "だから……先生！あたしもおんぶして！"
"10054040-116" = "[s] \"ルミも！？\""
"10054040-117" = "[ns] \"……どんとこい！\""
"10054040-118" = "（ルミの存在を背中で感じた）"
"10054040-119" = "（浮力のおかげか、そこまで重くはなかった）"
"10054040-120-キサキ" = "言いたいことは色々あるが……。"
"10054040-121-キサキ" = "お互い様じゃな。"
"10054040-122-ルミ" = "お～、いつもよりちょっと目線が高い。"
"10054040-123-ルミ" = "それに……ほとんど厨房にいるからさ。#n……こういう時間も、悪くないね。"
"10054040-124" = "[ns] \"ちょっと、そこで喋られると……！\""
"10054040-125-ルミ" = "なんで？#n……あ、耳？"
"10054040-126-ルミ" = "……。"
"10054040-127-ルミ" = "ふぅ～ん？"
"10054040-128" = "[ns] \"！？！？\""
"10054040-129-キサキ" = "そ、それは良くない気がするのじゃ……。"
"10054040-130-キサキ" = "キサキもさっきこうしてなかった？"
"10054040-131-キサキ" = "先生に何かあってからでは遅――"
"10054040-132-ルミ" = "うわっ！？ごめん！先生、大丈夫？"
"10054040-133-キサキ" = "いや、これは……！"
"10054040-134-ココナ" = "えへへ！先生を驚かせちゃおう作戦、大成功です！"
"10054040-135-ココナ" = "あ、あれ……？先生……？#nもしかして、やり過ぎちゃいましたか……！？"
"10054040-136-ココナ" = "ご、ごめんなさい！うわぁーん！"
"10054040-137" = "[s3] \"大丈夫だよ。大丈夫だけど……。\"\n[s4] \"仕返しだー！\""
"10054040-138-ココナ" = "わわっ！？"
"10054040-139" = "（水に潜って、ココナを肩車した）"
"10054040-140-ココナ" = "きゃっ！？せ、先生！ずるいです！"
"10054040-141" = "（ココナが頭にしがみついてきた）"
"10054040-142" = "（そのままココナを掴んで、水の中へ倒れ込んだ！）"
"10054040-143-ココナ" = "ひゃああぁっ！？先生のいじわる！！！"
"10054040-144-ココナ" = "いいですよ！じゃあ、私も……！"
"10054040-145" = "（1度水に潜ったココナは、飛び出してきて前から抱きしめてきた！）"
"10054040-146-ココナ" = "えへへ！これで先生は動けません！"
"10054040-147-？？？" = "あら、私もお手伝いしましょうか？"
"10054040-148" = "[ns5] \"シュン！？\"\n[ns6] （背中に圧力を感じる……！）"
"10054040-149-シュン" = "うふふ……捕まえました。"
"10054040-150-ココナ" = "シュン姉さん！その調子！"
"10054040-151" = "[ns] \"これが……春原姉妹のサンドイッチ・アタックか！\""
"10054040-152-シュン" = "これで先生は私たちのものですね。"
"10054040-153-キサキ" = "黙って見ておれば……どれ、妾も混ぜてもらおうかの。"
"10054040-154" = "[s] \"キサキまで！？\""
"10054040-155-ルミ" = "こ、この陣形はまさか――新・山海経名物「先生六和閣」！#nあたしも加勢しないわけにはいかないね！"
"10054040-156" = "（結局、謎の「先生六和閣」は重さに耐えきれず崩れてしまった……）"
"10054040-157-ルミ" = "あはははっ！先生、何その格好！"
"10054040-158-ルミ" = "うふふっ、楽しいですね。"
"10054040-159-ミナ" = "う～む……楽しそうだな……こんなことなら私も水着を……。"
"10054040-160-ミナ" = "い、いや！何を考えている[ruby=このえ]近衛[/ruby]ミナ！#n私は護衛のためにここにいるのだぞ！"
"10054040-161-ミナ" = "……。"
"10054040-162-ミナ" = "……水着、持って来ればよかった。"
"10054040-163-ココナ" = "あら、ココナちゃんのお腹が鳴いてますね。"
"10054040-164-シュン" = "ち、違うの！これはその、えっと……！"
"10054040-165-ルミ" = "気づけばこんな時間だし、お昼ご飯食べに行かない？"
"10054040-166-キサキ" = "なんじゃ、其方が用意してくれるものと思っておったが。"
"10054040-167-キサキ" = "料理は好きだけど、今日は休暇だからね。"
"10054040-168-キサキ" = "それに、ここの料理も食べてみたいし。"
"10054040-169-キサキ" = "つまりは現地調査……ようやく本題の時間だな。"
"10054040-170-キサキ" = "さあ、査察を始めよう！"
"10054040-171-ルミ" = "うちとしても、投資したお金の使われ方は確かめておかないと。"
"10054040-172-ルミ" = "でも……できれば「査察」って言葉は出さないでほしいかな……。"
"10054040-173" = "[ns] \"美味しいもの食べたいね！\""
"10054040-174-ココナ" = "はい！楽しみです！"
"10054040-175-ココナ" = "ふふっ。ココナちゃん？あまり先生に甘えちゃダメですよ。"
"10054040-176-ココナ" = "ココナちゃんは、我慢強いレディーなんですよね？"
"10054040-177-シュン" = "も、もちろん！"
"10054040-178-渓谷の商人A" = "……。"
"10054040-179-渓谷の商人A" = "…………。"
"10054040-180-渓谷の商人B" = "……………………。"
"10054040-181-ルミ" = "あれ？"
"10054040-182-ルミ" = "……。"
"10054040-183-キサキ" = "ふむ……？"
"10054040-184-ココナ" = "お、お姉さんたち、どうかしましたか？"
"10054040-185-キサキ" = "いや、取りあえずは見て回ろう。"
"10054040-186-渓谷の商人C" = "……いらっしゃ、ませ……あるもんはあって、ないもんはない、です。"
"10054040-187-渓谷の商人C" = "ラフティングに、ボートツアーも、あります……。"
"10054040-188-渓谷の商人B" = "麺に……魚……お茶……色々あります……。"
"10054040-189-ミナ" = "私は詳しいわけではないが、何かおかしくないか？"
"10054040-190-ミナ" = "山海経の商店街のほうが10倍は賑やかだぞ。"
"10054040-191-渓谷の商人A" = "あの、お聞きしたいことがあるんですけど……。"
"10054040-192-ココナ" = "ん……？"
"10054040-193-ココナ" = "ひぃっ！？"
"10054040-194-ココナ" = "も、申し訳ありません！どうか！どうかこのお店だけは……！"
"10054040-195-ココナ" = "ここを失ったら、商売を続けてきた先輩に合わせる顔がありません！！"
"10054040-196-渓谷の商人A" = "はい？私は別に何も……。"
"10054040-197-キサキ" = "ただ食事をしに来ただけなのじゃが……。"
"10054040-198-渓谷の商人C" = "しょくじ……？食事ですか！？#nな、何なりとお申し付けください……！"
"10054040-199-渓谷の商人C" = "で、ですがメニューにない料理はお出しできなくて……ど、どうかご勘弁を……！"
"10054040-200-キサキ" = "なぜそこまで怯えるのじゃ？#n其方らが何を想像しているかは分からぬが、害をなす意思など毛頭ない。"
"10054040-201-キサキ" = "子供が2人……！ああ……！あの方たちだ！"
"10054040-202-キサキ" = "申し訳ありません！どうかお許しください……！"
"10054040-203-渓谷の商人B" = "どうか、重火器だけは……！！"
"10054040-204-シュン" = "え……？"
"10054040-205-ルミ" = "重火器、ですか？"
"10054040-206-渓谷の商人C" = "ほ、本当ですか……？"
"10054040-207-渓谷の商人C" = "ただ遊びに来ている……。"
"10054040-208-渓谷の商人B" = "観光客……？"
"10054040-209-ミナ" = "ああ！このお方は観光客にして、私がお仕えするキサキ様だ！"
"10054040-210-渓谷の商人A" = "そうか……それは悪かった。てっきり、あの子供たちかと思って……。"
"10054040-211-渓谷の商人A" = "その話はもういいじゃないか。せっかくお客さんが来てくれたんだ。"
"10054040-212-渓谷の商人A" = "皆さん、メニューはこちらに。"
"10054040-213-シュン" = "ありがとうございます。#n……ところで、他のお客さんは……？今は繁忙期のはずですが……。"
"10054040-214-渓谷の商人B" = "……。"
"10054040-215-渓谷の商人C" = "それは……。"
"10054040-216-渓谷の商人A" = "おい、よせ。"
"10054040-217-シュン" = "……。"
"10054040-218-シュン" = "（先ほどは、門主様とココナちゃんを見て怯えていましたね）"
"10054040-219-シュン" = "（ということは……？）"
"10054040-220-？？？" = "な～に？どういう騒ぎ？"
"10054040-221-渓谷の商人B" = "はっ！？"
"10054040-222-渓谷の商人C" = "で、出た！"
"10054040-223-渓谷の商人A" = "みっ、みんな気をつけろ！"
"10054040-224-ルミ" = "……え？"
"10054040-225-ココナ" = "ふむ……。"
"10054040-226-？？？" = "あー、あー、うちらがわざわざ来てあげたのに、出迎えも無いの？"
"10054040-227-？？？" = "雑魚大人が調子に乗るんじゃねぇですよ。"
"10054040-228-？？？" = "大人のくせにビクビクして。なっさけねぇですねぇ。"
"10054040-229-？？？" = "ですが、その情けない姿を見るのも気持ちが高ぶると思いませんか？うふふっ。"
"10054040-230" = "[ns] \"……え？\""
