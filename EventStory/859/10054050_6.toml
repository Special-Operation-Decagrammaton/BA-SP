[translation]
"10054050-1" = "第5話;恐ろしき幼稚園児"
"10054050-2-渓谷の商人A" = "ええ！もちろん弁えておりますとも！"
"10054050-3-渓谷の商人A" = "お昼の時間ですよね！#nお、お食事をお持ちしましょうか？"
"10054050-4-渓谷の商人A" = "まずは[ruby=チンジャオロース]青椒肉絲[/ruby]と蒸しパ――"
"10054050-5-？？？" = "……これ、ピーマン？"
"10054050-6-？？？" = "ペッペッ！よくもこんなもの入れやがりましたね。#nうちらはピーマンが大嫌い！雑魚大人はそんなのも分かんねぇんですか？"
"10054050-7-？？？" = "仕方ありません。失敗した大人には、罰を与えないと。うふふっ。"
"10054050-8-渓谷の商人B" = "で、ですが！昨日おっしゃってたじゃないですか！#n青椒肉絲が食べたいって……！"
"10054050-9-渓谷の商人C" = "ピーマン抜きでは、この料理は成立しませんよ……？"
"10054050-10-渓谷の商人C" = "そ、そうです！元々は青唐辛子を入れるのですが、それでは辛くなってしまって……！"
"10054050-11-？？？" = "知らない知らない知らない！ピーマンは嫌！"
"10054050-12-？？？" = "――でさぁ。さっきから気になってたんだけど。#n何これ。ガチョウ？"
"10054050-13-渓谷の商人A" = "食材です！"
"10054050-14-？？？" = "はぁ！？食べようってんですか！？#n可哀想じゃねぇですか。逃がしてやるですよ！早く！"
"10054050-15-渓谷の商人B" = "こ、これだって！#nガチョウの焼き料理が食べたいとおっしゃるから用意したのに！"
"10054050-16-？？？" = "うふふ。それはそれ、これはこれです。"
"10054050-17-투명" = "ガアアアアッ！"
"10054050-18-？？？" = "きゃぁっ！な、なに！？#nガチョウのくせにぃ～……さっさとどうにかして！"
"10054050-19-？？？" = "え、でも放してやれと――"
"10054050-20-？？？" = "その時はその時！今は今！#n雑魚大人すぎて頭がかってぇですね。"
"10054050-21" = "[ns] \"あの子たち、誰なんだろう……？\""
"10054050-22-シュン" = "それが分からずとも、大人に対するあの態度……。"
"10054050-23-シュン" = "しつけが、なっていませんね。"
"10054050-24-キサキ" = "ふむ……。"
"10054050-25-？？？" = "はあ。せっかくの良い気分が台無しです。"
"10054050-26-？？？" = "やはり、罰が必要かと。"
"10054050-27-渓谷の商人A" = "ああ……店が……もう、おしまいだ……。"
"10054050-28-渓谷の商人A" = "……大丈夫だ。またやり直せばいい。"
"10054050-29-渓谷の商人A" = "お互い助け合おう。な？"
"10054050-30-？？？" = "え、キモ。"
"10054050-31-？？？" = "雑魚大人、キ～モ～す～ぎ～"
"10054050-32-？？？" = "はぁ……まだムチが必要なんでしょうか？うふふっ。"
"10054050-33-ココナ" = "あなたたち、何してるの！！"
"10054050-34-？？？" = "……誰？"
"10054050-35-？？？" = "どういうこと？#nうちら以外は誰も来ないはずじゃ……。"
"10054050-36-？？？" = "……どうやらネットで噂になっているようですね。#nこれだから縦型動画は。"
"10054050-37-？？？" = "ま、いっか。特別に教えてあげる。#nあんたも仲間に入りたくなるに決まってるもん。"
"10054050-38-？？？" = "そうそう！"
"10054050-39-？？？" = "教えて差し上げましょう。#nやりたい放題、遊びたい放題、しつけは聞かない。#n私たちの名前は――"
"10054050-40-？？？" = "[ruby=ひなどり]雛鳥[/ruby]組！"
"10054050-41-スイコ" = "[ruby=たかのす]鷹野主[/ruby]スイコ！#nこの組を作ったのは私！きゃははっ！"
"10054050-42-ナゴミ" = "[ruby=いおじゃく]五百雀[/ruby]ナゴミ。#nやられたら10倍でやり返す。やられなくてもやるけどね。"
"10054050-43-ココナ" = "それはただの迷惑では……。"
"10054050-44-ヨウコ" = "[ruby=うとう]烏頭尾[/ruby]ヨウコです。#nうふっ、うふふっ……。子供の恨みは……深いのですよ？"
"10054050-45-スイコ" = "ってか、あんた……。"
"10054050-46-ココナ" = "な、なに……？"
"10054050-47-スイコ" = "大人なんか放っといて、うちらと一緒に遊ばない？"
"10054050-48-スイコ" = "くだらないことばっか言う大人より、雛鳥組のほうが絶対面白いよ？"
"10054050-49-スイコ" = "だって、やりたくないことはやらなくていいの。#n目障りなものは全部吹き飛ばす！"
"10054050-50-スイコ" = "子供は可能性を秘めている存在ですからね。うふふっ……。"
"10054050-51-ココナ" = "何を言っているの……。"
"10054050-52-渓谷の商人C" = "あ、あの！うんめえ棒とイチゴミルクをご用意しました！#n今日のところは、これで……！"
"10054050-53-スイコ" = "ふーん？#nあ。これ、私の好きなやつだ。"
"10054050-54-スイコ" = "雑魚大人にしちゃ、いいセンスじゃねぇですか。"
"10054050-55-スイコ" = "こうなると……始末はどうしましょうね。"
"10054050-56-ナゴミ" = "うーん……。"
"10054050-57-ナゴミ" = "今日は特別！見逃したげる！"
"10054050-58-ヨウコ" = "でも、次はねぇですよ？#nそのときは……ここを火の海にしてやるです！"
"10054050-59-スイコ" = "昼間でも見える花火になりそうですね。うふふっ……。"
"10054050-60-渓谷の商人C" = "た、助かったぁ……。"
"10054050-61-渓谷の商人C" = "……君、大丈夫か？"
"10054050-62-渓谷の商人A" = "大丈夫じゃないけど……仕方ないさ。"
"10054050-63" = "[ns] \"あの。今の子たちは……？\""
"10054050-64-渓谷の商人B" = "雛鳥組……という暴力団だ。"
"10054050-65-ミナ" = "暴力団！？#n幼稚園児にしか見えなかったが……？"
"10054050-66-渓谷の商人B" = "ああ……幼稚園児だ。"
"10054050-67-ルミ" = "「最近の子は怖い」とか……その類の例えですか？"
"10054050-68-渓谷の商人C" = "そんなところだ……。"
"10054050-69-キサキ" = "この辺りでは有名なのかえ？"
"10054050-70-渓谷の商人A" = "いや……いつの間にか現れたんだ。"
"10054050-71-渓谷の商人A" = "急に、ここを新たな拠点にするとかって言いだして……。"
"10054050-72-渓谷の商人A" = "状況は見ての通りだ。#n身勝手がすぎて、ほとほと手を焼いている。"
"10054050-73-シュン" = "それなら、どうして好き放題させているんですか？#n教育のためにも、今の状況はよくないと思いますが。"
"10054050-74-渓谷の商人B" = "最初は色々やったさ。#nでも……あの子ら、後ろ盾が強いんだ。"
"10054050-75-渓谷の商人C" = "叱ったり、抵抗したり……全部、上手くいかなくて。"
"10054050-76-渓谷の商人A" = "しかもここを気に入ったらしい。#n独り占めするんだって息巻いてるよ。"
"10054050-77-渓谷の商人B" = "まあ、ここの渓谷は美しいからな。"
"10054050-78-渓谷の商人C" = "前までは知る人ぞ知る場所だったんだが、#n最近は投資してくれるところも出てきたってのに。#n施設を刷新するはずが、どうしてこんなことに……。"
"10054050-79-渓谷の商人A" = "見ての通り、雛鳥組が暴れ始めて途方に暮れてるってわけさ。"
"10054050-80-ルミ" = "……。"
"10054050-81-渓谷の商人A" = "これじゃ観光客を呼ぶどころか、施設の補修もままならない。"
"10054050-82" = "[s] \"あの子たちの拠点は分かりますか？\""
"10054050-83-渓谷の商人A" = "この渓谷で一番歴史のあるホテルに宿をとっているらしい。"
"10054050-84-渓谷の商人B" = "ロープウェイと直結されてて、あの山の麓にあるんだ。"
"10054050-85-ルミ" = "ロープウェイと直結、ですか。"
"10054050-86-ルミ" = "ああ。だからこの辺じゃ値が張るホテルなんだが……#nそこに連泊できるくらい、ただ者じゃないんだ。"
"10054050-87-シュン" = "でも……そういえば、ココナちゃんには友好的だったような？"
"10054050-88-渓谷の商人A" = "味方を増やしたかったんだろうな。"
"10054050-89-渓谷の商人A" = "嘘かほんとか、キヴォトスの園児を全員、雛鳥組にするつもりらしい。"
"10054050-90-渓谷の商人A" = "あんな失礼な子たちの仲間なんて願い下げです！"
"10054050-91-渓谷の商人A" = "ココナ……と言ったか？"
"10054050-92-渓谷の商人A" = "え？はい、[ruby=すのはら]春原[/ruby]ココナです。"
"10054050-93-渓谷の商人C" = "ココナは大人だね。本当に頼もしい。#nあの子たちには見習ってほしいよ。"
"10054050-94-ココナ" = "えっへん、もちろんです！"
"10054050-95" = "[ns] \"ココナは立派なレディーですから。\""
"10054050-96-ココナ" = "せ、先生！？#nう、嬉しいんですけど、その……冗談はやめてください……。"
"10054050-97-ココナ" = "はい？本心……？"
"10054050-98-ココナ" = "つ、ついに先生も私の魅力に目覚めたんですね！"
"10054050-99-ココナ" = "……あれ？待ってください。#nということは……。"
"10054050-100-ココナ" = "普段は私をからかっていたってことですか……？"
"10054050-101" = "[ns] \"……バレたか。\""
"10054050-102-ココナ" = "先生！！！"
"10054050-103" = "（しばらくの間、ココナとの追いかけっこが続いた）"
"10054050-104-渓谷の商人C" = "改めて、来訪を歓迎するよ。よく来てくれたね。"
"10054050-105-渓谷の商人C" = "この感じ、久しぶりだ……。"
"10054050-106-渓谷の商人A" = "できる限りのおもてなしをするから、どうかゆっくりしていってくれ。"
"10054050-107-ルミ" = "ありがとうございます。"
"10054050-108-ルミ" = "……。"
"10054050-109-ルミ" = "そしたら、さっきの青椒肉絲と蒸しパンをいただけますか？"
"10054050-110-ルミ" = "作り直すから、少し待っててくれ。"
"10054050-111-渓谷の商人A" = "あ、いえ。さっきので大丈夫です！#n美味しい青椒肉絲は、冷めても美味しいんですから！"
"10054050-112-ココナ" = "えっ……ピーマン……でも、ニンジンよりは……。"
"10054050-113-ココナ" = "ううん。雛鳥組みたいに駄々をこねるわけにはいきません！"
"10054050-114" = "（青椒肉絲は冷めていたが、すごく美味しかった）"
"10054050-115-渓谷の商人C" = "……美味しそうに食べてくれるんだね。"
"10054050-116-渓谷の商人C" = "そう、これだよこれ……。"
"10054050-117-渓谷の商人B" = "こういうのが見たくて商売を始めたんだよな。"
"10054050-118" = "[ns] \"さて、そろそろ……。\""
"10054050-119-キサキ" = "この問題をどう解決するか、じゃな？"
"10054050-120-キサキ" = "大前提として、我々は観光に来ている身。"
"10054050-121-キサキ" = "それに、山海経の外じゃ。この地の問題は放置しようと差し支えない。"
"10054050-122-キサキ" = "ですが、そうは考えていらっしゃらないのでしょう？"
"10054050-123-ミナ" = "ほう？#n……では、其方ならどうする？"
"10054050-124-キサキ" = "まずは情報収集かと。"
"10054050-125-ミナ" = "商人たちの心意気を無下にはできません。"
"10054050-126-ミナ" = "雛鳥組の横暴を前にしてなお、ここを守ろうとする意志……#nまさに手本とすべき姿勢でした。"
"10054050-127-ミナ" = "それを見捨てるのは、義と侠に反します！"
"10054050-128-キサキ" = "実に其方らしい言葉じゃ。"
"10054050-129-ミナ" = "あたしも賛成。同じ商人として見過ごせない。#n商売にも最低限の道理があるからね。"
"10054050-130-ミナ" = "私も許せません！"
"10054050-131-ミナ" = "無礼で自分勝手――"
"10054050-132-ココナ" = "梅花園だったらお尻ペンペンですから！"
"10054050-133" = "[ns] \"シュンはどう？\""
"10054050-134-シュン" = "そうですね。"
"10054050-135-シュン" = "……。"
"10054050-136-シュン" = "とても多くのことを考えさせてくれる子たちでした。"
"10054050-137-シュン" = "そのうえで……#nルミさんの言う通り、ここの商人さんたちのためにも。"
"10054050-138-シュン" = "そして……あの子たちのためにも。"
"10054050-139-シュン" = "見て見ぬふりはできません。"
"10054050-140-キサキ" = "そもそもあの子たちの行動は、玄武商会の投資に悪影響を及ぼしておる。"
"10054050-141-キサキ" = "我々は、投資に関する査察のためにこの地を訪れた。"
"10054050-142-キサキ" = "然らば、これも査察活動の延長と言えよう。"
"10054050-143" = "[ns] \"これで方向性は決まったね。何から始めよっか。\""
"10054050-144-ルミ" = "まずは商店街の現状を調べたほうがいいと思う。"
"10054050-145-ルミ" = "雛鳥組のほうは……うーん。#n仲間に入れてもらうのが手っ取り早いけど、あたしたちじゃ年齢が……。"
"10054050-146-ルミ" = "だから、ココナにお願いできないかな。これは、ココナにしかできないことなんだよ。"
"10054050-147-ルミ" = "うぅ……それなら仕方ありませんが……。"
"10054050-148-ルミ" = "でも……やっぱり嫌です！#nあんな組織に入って……味方のフリをするなんて……！"
"10054050-149-ココナ" = "待ってください。#nたしかに[ruby=・]今[/ruby][ruby=・]は[/ruby]ココナちゃんにしか頼めないかもしれません。"
"10054050-150-ココナ" = "ですが、ココナちゃんの家族で……ひいては保護者として、#n危険なことには賛成できません。"
"10054050-151" = "[ns] \"うん。私も同じ考えかな。\""
"10054050-152-シュン" = "シュン姉さん……先生も……。"
"10054050-153-ココナ" = "ココナちゃん、無理はしなくていいんですよ。"
"10054050-154-シュン" = "でも、それなら雛鳥組のほうはどうやって……。"
"10054050-155-ココナ" = "お姉さんに、少し考えがあります。"
"10054050-156-ココナ" = "きっと、キサキ様にも。"
"10054050-157-シュン" = "そうなんですか……？"
"10054050-158" = "（シュンとキサキがアイコンタクトを取った）"
"10054050-159" = "（そして……）"
"10054050-160-キサキ" = "ああ。妙案があるのじゃ。"
"10054050-161-キサキ" = "じゃが、今日はもう遅い。#nゆっくり休んで、調査は明日から始めるとしよう。"
"10054050-162-ココナ" = "うーん……何をするつもりか、分かりそうで分からない……。"
"10054050-163-ココナ" = "でも、キサキが言うってことは大丈夫だろうし。#nあたしたちは商店街のほうを担当しよっか。"
"10054050-164-ココナ" = "はい……！"
"10054050-165-ココナ" = "こちらも異存はない。では、先に部屋へ戻るとしようか。"
"10054050-166" = "[ns1] \"もしかして……。\"\n[ns2] \"あれ……なの？\""
"10054050-167-キサキ" = "ふふっ、どうでしょう？"
"10054050-168-キサキ" = "でも先生が少し口裏を合わせてくれれば、話はもっと早くなるかもしれませんよ？"
"10054050-169-キサキ" = "そうじゃ。こういうときこそ「大人の力」が必要なのじゃよ。"
"10054050-170" = "（2人は意味深な笑みを浮かべた）"
"10054050-171" = "（背筋に冷や汗をかきそうになった……）"
