[translation]
"10054120-1" = "第12話;もうひとつだけ"
"10054120-2" = "[ns] \"みんな、楽しかった？\""
"10054120-3-ココナ" = "はい！とっても！"
"10054120-4-ルミ" = "忘れられない思い出になったね。"
"10054120-5-ミナ" = "一応、投資先の現地査察であったことを忘れないでほしいが……。"
"10054120-6-ミナ" = "それを含めても、楽しい時間ではあったな。"
"10054120-7-シュン" = "ありがとうございます、先生。私たちのために時間を作ってくれて。"
"10054120-8" = "[s] \"ううん。私もすごく楽しかったし。\""
"10054120-9-キサキ" = "ああ、何よりじゃ。"
"10054120-10-キサキ" = "しかし……山海経は何事もなかったかの？"
"10054120-11-ミナ" = "だと思います。カナエも、やる時はちゃんとやりますから。"
"10054120-12-ミナ" = "街の様子も、査察に出る前と同じように――"
"10054120-13-ミナ" = "う、うん……？"
"10054120-14-カナエ" = "なっ！？"
"10054120-15-キサキ" = "カナエ、何かあったのかえ？"
"10054120-16-カナエ" = "門主様……ミナちゃん……。"
"10054120-17-カナエ" = "私は、最善を尽くしました。"
"10054120-18-カナエ" = "本当に……頑張ったんです……。"
"10054120-19-カナエ" = "それだけは、信じてください……。"
"10054120-20-カナエ" = "ぽっくり。"
"10054120-21-ココナ" = "だ、大丈夫ですか！？"
"10054120-22-玄武商会のメンバーA" = "玄龍門め、いつもいつもうちらのことコケにしやがって。"
"10054120-23-玄武商会のメンバーB" = "もう限界！目にもの見せてやる！"
"10054120-24-玄龍門の構成員A" = "法と秩序のもと、今日こそあの高慢ちきを懲らしめてやろう！"
"10054120-25-玄龍門の構成員B" = "行くぞ！玄龍門、出動！！"
"10054120-26-梅花園の園児A" = "わあ！お姉ちゃんたちがいっぱい！"
"10054120-27-梅花園の園児B" = "教官のお姉ちゃんは梅花園から出るなって言ってたけど、やっぱり外って楽しいね！"
"10054120-28-梅花園の園児C" = "でも……玄武商会と玄龍門のお姉ちゃんたち、なんか怖いよ……？"
"10054120-29-梅花園の園児D" = "紛争とは重力のようなものだからね。#n誰かが少し押すだけで、どんどん下へと落ちていくの。"
"10054120-30-梅花園の園児D" = "そして喜ぶのは第三者。マスコミは視聴率を、企業は利益を得るんだよね。"
"10054120-31-梅花園の園児D" = "だからこの世には葛藤が絶えないんだ。"
"10054120-32-梅花園の園児A" = "なに言ってるか全然分かんない！"
"10054120-33" = "[ns1] \"結局……。\"\n[ns2] \"こうなってしまうのか……。\""
"10054120-34-キサキ" = "……ルミ。"
"10054120-35-ルミ" = "うん……分かってるよ。"
"10054120-36-キサキ" = "手間をかけるの。"
"10054120-37-ルミ" = "ううん、こちらこそ。"
"10054120-38-キサキ" = "さっそく一仕事じゃな。"
"10054120-39-ルミ" = "休んだ分、頑張ろっか。"
"10054120-40-ココナ" = "シュン姉さん……？私たちはどうすれば……。"
"10054120-41-ココナ" = "とりあえず……園児たちを連れて帰りましょうか。"
"10054120-42" = "[ns3] \"本当に……。\"\n[ns4] \"訓育って難しいなぁ～\""
"10054120-43" = "嵐過天晴"
