[translation]
"10054010-1" = "第1話;広報部長"
"10054010-2-キサキ" = "久しいのう、先生。#n毎日とは言わぬが、たまには顔を出してほしいのじゃが。"
"10054010-3-キサキ" = "そうさな。具体的には週に3日ほど……どうじゃ？"
"10054010-4" = "[s] \"それは、ちょっと……。\""
"10054010-5-キサキ" = "分かっておる。#nやはりシャーレに山海経の出張所を設置すべきかの。"
"10054010-6-キサキ" = "ふふっ、これも冗談じゃ。"
"10054010-7-キサキ" = "……半分くらいは、な。"
"10054010-8" = "[s] \"そうやってからかうなら……反撃だっ！\""
"10054010-9-キサキ" = "ほう？何をされてしまうのじゃろうなぁ……？"
"10054010-10-キサキ" = "せ、先生！？急に顔を近づけるのは……。"
"10054010-11-キサキ" = "っ――！"
"10054010-12" = "[ns] \"やっぱり、顔色よくないね。\""
"10054010-13-キサキ" = "……なんじゃと？"
"10054010-14-キサキ" = "つまり……妾の容態を確かめに来た、と。"
"10054010-15-キサキ" = "気にかけてくれるのは嬉しいが……はぁ。"
"10054010-16-キサキ" = "いや、なんでもない。妾の勘違いじゃ。忘れてくれ。#nそれより……。"
"10054010-17-キサキ" = "ふむ。"
"10054010-18-キサキ" = "……玄龍門の者がなんぞ騒ぎでも？"
"10054010-19" = "[s1] \"！？！？\"\n[s2] \"ち、違うよ！そうじゃなくて……！\""
"10054010-20-キサキ" = "ほう？"
"10054010-21-キサキ" = "……。"
"10054010-22-キサキ" = "寂しいのう。妾と其方の間に、隠し事はないと思っておったのじゃが……。"
"10054010-23" = "（キサキにすべてを話した……）"
"10054010-24-キサキ" = "はぁ……。"
"10054010-25" = "[s] \"あんまり叱らないであげてね……？\""
"10054010-26-キサキ" = "分かっておる。妾を思っての行動じゃろうて……。"
"10054010-27-キサキ" = "無論、それが良きこととは限らぬがの。"
"10054010-28-キサキ" = "とはいえ、元をただせば心配をかけてしまった妾の落ち度もあろう。"
"10054010-29" = "[s] \"具合……そんなに悪いの？\""
"10054010-30-キサキ" = "まさか。世に言う「夏バテ」のようなものじゃ。"
"10054010-31-キサキ" = "この時期になると、どうにもな。"
"10054010-32-キサキ" = "そう案ずるでない。妾の病とは関係のないことじゃ。"
"10054010-33-キサキ" = "もしもそうなら、サヤが黙っておらんよ。"
"10054010-34" = "[s] \"それなら安心だけど……。\""
"10054010-35-キサキ" = "じゃが、心身を癒す、か……。"
"10054010-36" = "[s] \"たまには必要だと思うよ。\""
"10054010-37-キサキ" = "……ああ。叶うのならばな。"
"10054010-38-キサキ" = "夏休み……。"
"10054010-39-キサキ" = "……じゃがな、先生。"
"10054010-40-キサキ" = "休むにしても適切な「口実」が必要。それが、玄龍門の門主というものじゃ。"
"10054010-41-キサキ" = "おっはようございます！いい朝ですね！#nいかがお過ごしでしょうか？"
"10054010-42-キサキ" = "珍しいのう。其方から直接連絡が来るとは。#nカナエ広報部長、何かあったのかえ？"
"10054010-43-キサキ" = "やだなぁ～門主様ったら。何かなくても連絡くらいしますよ？"
"10054010-44-キサキ" = "朝昼晩、1日3回ちゃんと挨拶をする……！#n「三顧の礼」という言葉もあるくらいですし～？"
"10054010-45-キサキ" = "……あれ？意味あってましたっけ？"
"10054010-46-キサキ" = "正しくは、何度も相手の元を訪れて礼儀を尽くし頼み込む、という意味じゃぞ……。"
"10054010-47-キサキ" = "あっちゃぁー！"
"10054010-48-カナエ" = "どのみち、其方が妾を訪ねてくることはないと思うのじゃが……。"
"10054010-49-キサキ" = "自身は動かずして妾の動向や気配を常に把握し、伝言が必要なら人を遣わせる――"
"10054010-50-キサキ" = "それが、其方の「浪漫」なのじゃろう？"
"10054010-51-カナエ" = "さっすが門主様！よく分かってますねぇ！"
"10054010-52-カナエ" = "……ん？#nそう考えると、今の私の行動は矛盾しているような……。"
"10054010-53-カナエ" = "いやいや、些事でくよくよする私ではありません！#nまさに――力は山を抜き、気は世を[ruby=おお]蓋[/ruby]う！"
"10054010-54-カナエ" = "って、あれ？これも違うんでしたっけ……。"
"10054010-55-カナエ" = "ああ……その京劇の結末は、あまり良くないものだったと記憶しておる。#nカグヤが聞いていたらどうなっていたことか……。"
"10054010-56-キサキ" = "そんなぁ……！"
"10054010-57-キサキ" = "こほん。とにかくですね！#n失礼を承知の上で、ご提案がありまして。"
"10054010-58-キサキ" = "私の応接室にお招きしたいのですが、いかがでしょう！"
"10054010-59-カナエ" = "……。"
"10054010-60-カナエ" = "山海経に、なんぞ妾の知らぬ危機でも迫っているのかえ？"
"10054010-61-キサキ" = "……はい？"
"10054010-62-キサキ" = "あ～そう聞こえちゃいましたか。これはしたり。"
"10054010-63-キサキ" = "ご安心ください。決してそういう話ではありませんので！"
"10054010-64-キサキ" = "ただ、皆さんと食事の場を設けたいと言いますか……。"
"10054010-65-カナエ" = "皆、とは……。"
"10054010-66-キサキ" = "玄武商会……ルミ会長も来るのか？"
"10054010-67-カナエ" = "それは……ある意味、ルミ会長も関係者と言いますか……。"
"10054010-68-キサキ" = "なるほど、あい分かった。であれば……。"
"10054010-69-カナエ" = "むむ？"
"10054010-70-キサキ" = "人を迎える準備は抜かりなく頼むぞ。#n其方の応接室、しばらく使っておらんじゃろ。"
"10054010-71-カナエ" = "え、ええ、そうですね……。#nあはは、掃除しときますぅ……。"
"10054010-72" = "[ns] \"今のは？\""
"10054010-73-キサキ" = "ああ、先生はまだ面識がなかったか。"
"10054010-74-キサキ" = "玄龍門とは仲を深めてきたというに。#n妾の不手際じゃな。謝罪をここに。"
"10054010-75" = "[ns] \"えっと……？\""
"10054010-76-キサキ" = "あれはカナエという。ああ見えて、よく玄龍門を支えてくれておっての。"
"10054010-77-キサキ" = "ミナが「外」の担当とすれば、カナエは「内」の担当じゃ。"
"10054010-78-キサキ" = "どちらも欠くことのできぬ玄龍門の要じゃ。"
"10054010-79-キサキ" = "……なぜ今まで会うことがなかったのか。という疑問かの？"
"10054010-80-キサキ" = "そうさな……理由については――"
"10054010-81-キサキ" = "カナエに会ってからのお楽しみ、としておこうかの。"
"10054010-82-ルミ" = "玄武商会の出張宴会でーす！"
"10054010-83-ルミ" = "夏を楽しめる料理をご用意しました。どうぞ召し上がってください。"
"10054010-84-ミナ" = "あ、どもども～こんにちは！#nこほん、本日はお忙しい中、お集まりいただきありがとうございます！"
"10054010-85-シュン" = "ふふ、お久しぶりですね。ご招待ありがとうございます。"
"10054010-86-ココナ" = "カナエお姉さん、ありがとうございます！#nあれ？先生もいらしてたんですね！"
"10054010-87" = "[s] \"こんにちは、ココナちゃん！\""
"10054010-88-ココナ" = "ですから、私はココナちゃんじゃなくて……！"
"10054010-89" = "[s] \"あ、そうだった！ココナ教官ちゃん！\""
"10054010-90-ココナ" = "うぅ……先生ったら、もう……。"
"10054010-91-カナエ" = "あっ！あなたが先生ですね！お噂はかねがね！#nお初にお目にかかります！[ruby=みやうち]宮内[/ruby]カナエと申します！"
"10054010-92-カナエ" = "私と先生――そして先生と私の邂逅は……まるで水魚の交わり、ですね！"
"10054010-93-カナエ" = "――どうですか、門主様！#n今回は使い方あってましたよね！？"
"10054010-94-キサキ" = "大きく外れてはおらぬが……初対面の相手に言う言葉ではないのう。"
"10054010-95-カナエ" = "そ、そうですかねぇ……？"
"10054010-96" = "[s] \"よろしくね。\""
"10054010-97-カナエ" = "カナエ、挨拶が遅すぎるんじゃないか？"
"10054010-98-ミナ" = "それを言われると返す言葉もありませんが……私にも事情があったんです！#nミナちゃんだって知ってますよね？"
"10054010-99-カナエ" = "自分でそれを言うのか……。"
"10054010-100" = "[ns] \"挨拶に早いも遅いもないよ。こうして会えたんだし。\""
"10054010-101-カナエ" = "先生は生徒に甘すぎるんだ。まあ、それも大きな長所ではあるが……。"
"10054010-102-ミナ" = "カナエには厳しく接したほうがいいだろうな。"
"10054010-103-ミナ" = "事情だ何だと言ってはいるが。#n執務室から出ようとしない理由は、実にくだらない。"
"10054010-104-ミナ" = "「策士たるもの、部屋の中から一歩も動かず事件を解決すべき」という考えに固執しているだけなんだ！"
"10054010-105-カナエ" = "ひっどーい！ほんっと、ミナちゃんは分かってないですね！いつもですけど！"
"10054010-106-カナエ" = "安楽椅子に座ったまま全ての事件を解決する……#nこれこそ、策士なら誰しもが夢見る「浪漫」なのですよ！"
"10054010-107-カナエ" = "文は名を残せれば十分。剣術はせいぜい1人に勝るもの。"
"10054010-108-カナエ" = "しかし、策略と兵法は、万人を相手取ることのできる対策である！"
"10054010-109-カナエ" = "……みたいな？"
"10054010-110-キサキ" = "それは策士ではなく武将の言葉じゃ……。"
"10054010-111-カナエ" = "がぁーん！"
"10054010-112-カナエ" = "また適当な受け売りを……。"
"10054010-113-カナエ" = "まあまあ、お二人ともその辺で。門主様もいらしているのですよ？"
"10054010-114-ミナ" = "あっ！#n……すみません。"
"10054010-115-ミナ" = "門主様、申し訳ございません。"
"10054010-116" = "[ns] \"カナエはいつも部屋の中にいるの？\""
"10054010-117-キサキ" = "いいや、「策士」として振る舞っておる時だけじゃ。"
"10054010-118-キサキ" = "これで趣味が旅行なのじゃから。"
"10054010-119-カナエ" = "どうです、先生。よければ今度一緒に行きません？#n次の三連休にでも是非！"
"10054010-120-カナエ" = "たまに、二重人格なんじゃないかと思う時があるぞ……。"
"10054010-121-ミナ" = "違いますよ。私は仕事とプライベートをはっきりさせているだけです。"
"10054010-122-ミナ" = "公私を分けて、別人物であるべき。#nこれもまた、「策士」としての浪漫ですから！"
"10054010-123-ミナ" = "学びて時に[ruby=これ]之[/ruby]を習う、ま[ruby=よろこ]た説ば[/ruby]しからずや！"
"10054010-124-カナエ" = "それとこれとに何の関係が……？"
"10054010-125-ミナ" = "あれ……ないんですか？"
"10054010-126-カナエ" = "ない！"
"10054010-127-カナエ" = "……いつも言っているが、仕事の時も部屋から出てくれ。#nついでに他部署の仕事も手伝え。"
"10054010-128-カナエ" = "組織とは、[ruby=・]業[/ruby][ruby=・]務[/ruby][ruby=・]分[/ruby][ruby=・]担[/ruby]をはっきりしてこそ回るものなんですよ？"
"10054010-129-カナエ" = "業務、分担……？"
"10054010-130-ミナ" = "他の！仕事も！"
"10054010-131-ミナ" = "やれと！言っている！"
"10054010-132-ミナ" = "それが！私たちの！任務なのだから！！！"
"10054010-133-カナエ" = "分担を言い訳にして、曖昧な仕事は全部私に丸投げじゃないか！"
"10054010-134-ミナ" = "うわぁぁ～ん！痛い！痛いですぅ！"
"10054010-135-ココナ" = "ふふ、元気が良くて何よりですが……今は食事の場ですよ？"
"10054010-136-シュン" = "そうです。これを園児たちが見たらどう思うでしょうね？"
"10054010-137-ミナ" = "……す、すまない。"
"10054010-138-カナエ" = "しくしく……シュン姉さん聞いてくださいよ！#nミナちゃん、私と会うたびにいじめてきてぇ……。"
"10054010-139-キサキ" = "そもそも対面すること自体が稀ではないかのう……。"
"10054010-140-カナエ" = "……いじめて[ruby=・]き[/ruby][ruby=・]そ[/ruby][ruby=・]う[/ruby]でぇ～"
"10054010-141-ミナ" = "事実無根だ。勘弁してくれ。"
"10054010-142" = "[ns] \"まあまあ。\""
"10054010-143-ミナ" = "はぁ……見苦しいところを見せたな。"
"10054010-144-ミナ" = "ともあれ、カナエとて、サボっているわけではないからの。"
"10054010-145-ミナ" = "少なくとも、担当している行政業務や新人教育に関しては申し分ない。"
"10054010-146-ミナ" = "じゃから、仕事には全幅の信頼を置いておる。"
"10054010-147-ミナ" = "それこそ、妾に上がってくる公文書の取りまとめを全てカナエに任せておるくらいじゃ。"
"10054010-148-ミナ" = "故に、玄龍門に危機が迫った場合……#nカナエはすべての文書を持って身を隠さねばならぬ。"
"10054010-149-キサキ" = "その点は私も理解しています。しかし……。"
"10054010-150-カナエ" = "ふふん～"
"10054010-151-カナエ" = "無論、カナエの言う「自分の役割」の範囲が、些か狭いことは認めるがの。"
"10054010-152-カナエ" = "うぅん～"
"10054010-153-キサキ" = "――して、そろそろ本題に入ろうか。"
"10054010-154-キサキ" = "他でもない其方が人を集めるなど、そうあることではない。#n……何用じゃ？"
"10054010-155-キサキ" = "あ、それがですね！えっと……。"
"10054010-156-キサキ" = "そう！私が入手した情報によりますと！"
"10054010-157-キサキ" = "玄武商会が、山海経の外部に投資しているみたいなのです！"
"10054010-158-ミナ" = "玄武商会が……。"
"10054010-159-キサキ" = "外に？"
"10054010-160-シュン" = "あら？"
"10054010-161-ココナ" = "ほぇ？"
"10054010-162-ルミ" = "……。"
"10054010-163-レイジョ" = "……。"
