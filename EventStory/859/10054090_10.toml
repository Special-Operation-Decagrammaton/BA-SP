[translation]
"10054090-1" = "第9話;契約と移行"
"10054090-2-雇われのスケバンB" = "……。"
"10054090-3-雇われのスケバンA" = "……。"
"10054090-4-雇われのスケバンB" = "はあ……マジでやるのか……？"
"10054090-5-雇われのスケバンA" = "仕方ないだろ……金はもらってるし……。"
"10054090-6-雇われのスケバンB" = "でもよ、商店街を燃やすってのは……なぁ？"
"10054090-7-雇われのスケバンA" = "まぁなぁ……。#n依頼人、しっかりしてそうな大人だったのに。分かんねぇもんだな。"
"10054090-8-雇われのスケバンA" = "とりあえず行くかぁ。"
"10054090-9-スイコ" = "やっと来た！"
"10054090-10-スイコ" = "どれだけ待たせやがりますか！#n約束も守れないなんて、年上のくせにみっともねぇですわね。"
"10054090-11-スイコ" = "……で。これしか集まらなかったのですか？ガッカリです。"
"10054090-12-雇われのスケバンB" = "な、なんだ、このガキどもは。"
"10054090-13-雇われのスケバンA" = "依頼人が平謝りしてた理由はこれか……。"
"10054090-14-スイコ" = "まぁいいよ。今回は大目に見てあげる。#nうちらは心が広いからね。"
"10054090-15-スイコ" = "あんたたちの仕事は簡単！"
"10054090-16-スイコ" = "ここをめちゃくちゃにすればいいの！"
"10054090-17-スイコ" = "えっと……理由だけ聞かせてもらってもいいか？"
"10054090-18-スイコ" = "お金もらってんですよね？#nなら言われた通り働きやがれってんですよ。"
"10054090-19-スイコ" = "もしかして……契約の意味すら分からない雑魚ってことです？"
"10054090-20-スイコ" = "はぁ……これ以上ガッカリさせねぇでほしいです。"
"10054090-21-雇われのスケバンB" = "ガキぃ……！"
"10054090-22-ヨウコ" = "あなた方に理由が必要なんですか？"
"10054090-23-ヨウコ" = "必要だとして、それはお金でしょう？#n本当に、お金さえあればなんでも解決できますね。"
"10054090-24-雇われのスケバンB" = "……。"
"10054090-25-雇われのスケバンA" = "……。"
"10054090-26-雇われのスケバンB" = "なんか嫌だな……。"
"10054090-27-雇われのスケバンA" = "まあ……間違いではないけど。"
"10054090-28-雇われのスケバンA" = "でも……はあ……。"
"10054090-29-キキ" = "おはようございます！#nごめんなさい……少し遅れました！"
"10054090-30-シュエリン" = "ふわぁ～……キキが寝坊しちゃって……ごめんなさい……。"
"10054090-31-スイコ" = "あっ、おはよう！#n子供は寝るのが大事なんだから。気にしないで！"
"10054090-32-スイコ" = "いま来たばっかであれだけど、危ないかもしれないから下がってて。#nあんまり前に出ないでね。"
"10054090-33-シュエリン" = "いいんですか？"
"10054090-34-ヨウコ" = "お二人は初めてですから。今回は試用期間ということで。"
"10054090-35-キキ" = "（好都合じゃな。これなら加勢せずとも怪しまれない）"
"10054090-36-キキ" = "ありがとうございます！"
"10054090-37-ヨウコ" = "じゃあそろそろ……花火を始めるよ！"
"10054090-38-ヨウコ" = "おー！！"
"10054090-39-渓谷の商人C" = "本当に来やがった……！"
"10054090-40-渓谷の商人C" = "これまではやられっぱなしだったけど……！"
"10054090-41-渓谷の商人A" = "助けてくれた生徒たちのためにも、これ以上は我慢しない！"
"10054090-42-雇われのスケバンB" = "痛っ！？無抵抗なんじゃなかったのか？"
"10054090-43-雇われのスケバンA" = "こんなことされて黙ってるわけないだろ……。"
"10054090-44-雇われのスケバンB" = "う～ん……なあ、うちらって報酬分だけ働けばいいんだよな？"
"10054090-45-雇われのスケバンA" = "そりゃな。サービスしてやる義理もないし。#nん？ってことは――"
"10054090-46-雇われのスケバンB" = "なんだ。これでいいじゃん。"
"10054090-47-雇われのスケバンA" = "やっぱ、そうだよな？"
"10054090-48-雇われのスケバンA" = "あんまやる気も起きないし。そもそも具体的な指示もない。"
"10054090-49-雇われのスケバンB" = "となれば……戦ってるフリで！"
"10054090-50-雇われのスケバンA" = "日焼けすんのも嫌だしな。"
"10054090-51-スイコ" = "いけ！やっちゃえ！全部ぶっ壊せ！"
"10054090-52-スイコ" = "……あれ？"
"10054090-53-渓谷の商人C" = "いつまでもやられっぱなしじゃないからな！"
"10054090-54-ナゴミ" = "ど、どういうこと？#nくっ！雑魚大人のくせに……生意気！！"
"10054090-55-渓谷の商人B" = "ここは私たちの居場所だ！守るべきものがある！#n子供だからって、もう容赦しない……！！"
"10054090-56-ヨウコ" = "スケバンは何をしてるんですか！？#n契約通り働いてください！"
"10054090-57-ヨウコ" = "あ、それだけどさ。#nこんなことになるって、契約書には書いてないじゃん？"
"10054090-58-ヨウコ" = "そうそう。抵抗はない、って。#nでも、どうよこれ。うちら戦ってるんだけど。追加の手当が必要じゃない？"
"10054090-59-スイコ" = "こ、この――！"
"10054090-60-スイコ" = "きゃん！？"
"10054090-61-雇われのスケバンA" = "おっと、流れ弾か。#nお前ら、怪我したくなきゃ、適当に引っ込んでろよ。"
"10054090-62-ナゴミ" = "……雑魚のくせにバカにしやがって！"
"10054090-63-ナゴミ" = "結局、誰も信用できないってことですか。#nこうなったら、私たちが出るしかありません。"
"10054090-64-スイコ" = "覚悟しろ！！"
"10054090-65-ルミ" = "あの子たち、すっごい怒ってるね。"
"10054090-66-ルミ" = "こんな事態、予想もしなかっただろうからな。"
"10054090-67-ミナ" = "ちょっと子供相手にやり過ぎてる気もするけどね。"
"10054090-68-ミナ" = "何を言ってるんですか！#nこういう時こそ、ちゃんと叱らないとダメなんですよ！"
"10054090-69-ミナ" = "今度こそ厳しく言ってあげないと！"
"10054090-70-ミナ" = "あははっ、ココナ教官にそう言われちゃあ仕方ない。"
"10054090-71-ココナ" = "これが「槌と鉄床」か。さすが、先生の計画通りだ。"
"10054090-72-ミナ" = "鉄床戦術？"
"10054090-73-ルミ" = "聞いたことはある……戦術の始まりと終わりと呼ばれる概念だろ。"
"10054090-74-ルミ" = "「鉄床」を担当する部隊が敵の攻撃を防いでいる間、機動性に長けた「槌」の部隊が側面と背後を奇襲する戦術。"
"10054090-75-ルミ" = "あらゆる戦術の標準とも言える……。"
"10054090-76-ルミ" = "陣形や武器体形も結局、「槌と鉄床戦術を展開できるかどうか」が最大の要点だからな。"
"10054090-77" = "[ns] \"そう。今回は君たちが「槌」の役割を担うことになる。\""
"10054090-78-ミナ" = "あたしたちが……槌？それにここの地形に詳しい商人の方々が鉄床？でもそれは……。"
"10054090-79-渓谷の商人A" = "分かりました、先生。お任せください。"
"10054090-80-ミナ" = "い、いいのか？つまり、この街を戦場にするってことだが……。"
"10054090-81-渓谷の商人C" = "……だからこそだ。"
"10054090-82-渓谷の商人A" = "思えば、私たちは無力だった。こうやって生徒と先生の力を借りることになったのも、恥じ入ることだ。"
"10054090-83-渓谷の商人B" = "ああ……。ここはずっと私たちの居場所だったからな。#nようやく、目を覚ます時が来たってことだ。"
"10054090-84-渓谷の商人C" = "要は、この道を通さないようにすればいいのだろう？それぐらい、やってみるさ。"
"10054090-85-ルミ" = "じゃあ始めよっか。#n早く片づければ、それだけ被害を抑えられるよね？"
"10054090-86-ルミ" = "速戦即決か。悪くない。"
"10054090-87-ココナ" = "いたずらはここまでだからね！！"
