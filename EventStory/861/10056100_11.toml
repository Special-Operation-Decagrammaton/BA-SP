[translation]
"10056100-1" = "第10話;ブリーチング"
"10056100-2" = "翌朝――"
"10056100-3-ナナミ" = "アホイ！"
"10056100-4-ナナミ" = "ふふ、聞いて喜べ。良い知らせを持ってきた。"
"10056100-5-ナナミ" = "お主らの言っていた何とかっていうシリンダーを手に入れたぞ！"
"10056100-6-ナナミ" = "これさえあれば「クジラの墓場」に潜れるのだろう？"
"10056100-7-ナナミ" = "さあ！すぐにでもダイビングの準備を――"
"10056100-8-ナナミ" = "ん？もう整えていたか。完璧なタイミングだな。"
"10056100-9-コトネ" = "[ruby=ちょうすい]潮水の[/ruby][ruby=こうりゅう]蛟龍…[/ruby]…いえ、[ruby=ごのかみ]護守[/ruby]ナナミ。"
"10056100-10-コトネ" = "私たちはクジラの安息を邪魔することはできません。"
"10056100-11-コトネ" = "海洋生物と適切な距離を保ち、その生態に関与しない。#nそれがダイバーの原則です。"
"10056100-12-コトネ" = "たとえ潜れなくなったとしても……あなたの指示には従えません。"
"10056100-13-ナナミ" = "はぁ……何か勘違いしておるようだな。"
"10056100-14-ナナミ" = "これは命令だ。"
"10056100-15-ナナミ" = "歯向かえば先生の身は保証しないと言ったはずだが。"
"10056100-16-ナナミ" = "よしんば逃げ出せたとして、どうするつもりだ？"
"10056100-17-ナナミ" = "まさか、泳いで帰るなどとは言いだすまいな？"
"10056100-18-ココロ" = "道がないな[ruby=ブリーチング]ら開拓す[/ruby]るまでです。"
"10056100-19-ココロ" = "ドアブリーチングは陸上だけのスキルではありませんから。"
"10056100-20-ナナミ" = "この広大な海で？#nどこのドアを開けるというのだ。"
"10056100-21-ナナミ" = "――何か企てがあるのだな。"
"10056100-22-ナナミ" = "無駄なあがきを。"
"10056100-23-ナナミ" = "救助を求めようと、トライデントが到着するまで何時間かかることやら。"
"10056100-24-ナナミ" = "ふざけた真似はやめておくのが――"
"10056100-25-ナナミ" = "これは……。"
"10056100-26-ナナミ" = "何事だ！？"
"10056100-27-ナナミ" = "クジラが――！？"
"10056100-28-コトネ" = "昨日、ホイッスルで挨拶しておいて良かった。"
"10056100-29-コトネ" = "吹いただけで集まってくれるとは思わなかったな。"
"10056100-30-サユリ" = "フライング・ホエール。"
"10056100-31-マキナ" = "かーっこいいー！"
"10056100-32-マキナ" = "みんな、しっかりつかまって！揺れるよ！"
"10056100-33-ココロ" = "……よしっ！"
"10056100-34-ココロ" = "先生、今です！"
"10056100-35-ナナミ" = "愚か者どもが……少し揺れた程度で持ち場を離れたら――"
"10056100-36-ナナミ" = "先生を逃してはならぬ！"
"10056100-37" = "（クジラの着水で起きた波に煽られて、大きく揺れた船から海に落ちた）"
"10056100-38" = "（海の中でもがいていると、誰かが寄ってきて水面に引き上げてくれた）"
"10056100-39" = "（……聞き覚えのある音が聞こえた）"
"10056100-40-ココロ" = "先生、大丈夫ですか？"
"10056100-41" = "[s1] \"何とかね。\"\n[s2] \"少し海水を飲んだけど……。\""
"10056100-42-ココロ" = "やつらが逃げる前に先生を捕まえるのだ！"
"10056100-43-ココロ" = "今を逃せば次はないと思え！"
"10056100-44" = "[ns] \"いや、無事だと言うには早いかな？\""
"10056100-45-ココロ" = "先生。目を閉じていただけますか？"
"10056100-46" = "[ns] \"あむっ、んぐっ……んんっ……？\""
"10056100-47-ココロ" = "私のオクトパスです。そのままくわえていてください。#nこれでは10分ほどしかもちませんが……。"
"10056100-48-ココロ" = "それだけあれば十分ですから。"
"10056100-49-ココロ" = "護守ナナミ。"
"10056100-50-ココロ" = "私たちは、目標のために道[ruby=ブリーチング]を開拓し[/ruby]ます。"
"10056100-51-ココロ" = "せいぜい、ジタバタしていてください。"
"10056100-52-ナナミ" = "何だ、その言い草は。余を嘲笑っているのか！"
"10056100-53-ココロ" = "降参したくなったら「やめろ」と言ってください。"
"10056100-54-ココロ" = "それまでは、やめませんから。"
"10056100-55-ナナミ" = "ははっ、実に滑稽だ！その程度の脅迫で余が諦めると思ったのか？"
"10056100-56-ナナミ" = "対潜戦闘用意――爆雷、投下はじめ！"
"10056100-57-ナナミ" = "やつらを海の藻屑にしてやれ！"
"10056100-58-ココロ" = "レギュレーターチェック。ファイナルチェック。オールグリーン。"
"10056100-59-ココロ" = "総員、ダイブ。"
