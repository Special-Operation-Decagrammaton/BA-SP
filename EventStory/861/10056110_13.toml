[translation]
"10056110-1" = "エピローグ;たかがフジツボ、されどフジツボ"
"10056110-2" = "オデュッセイアの停泊地"
"10056110-3" = "（ブルーホールから戻ってきて1週間ほど過ぎたある日）"
"10056110-4-サユリ" = "うぅ……くさっ……。"
"10056110-5-サユリ" = "最悪なんだけど……。"
"10056110-6-サユリ" = "くさ～い。"
"10056110-7-ココロ" = "ご、ごめん。またフジツボ落とし頼まれちゃって……。"
"10056110-8-コトネ" = "まあ、仕方ない。"
"10056110-9-コトネ" = "今のところ、こんなことぐらいしかダイビング部ができる作業ってないから。"
"10056110-10-ココロ" = "……ええ。"
"10056110-11-ココロ" = "それに、これで負債を一部減免されるのですから。#nそれほど悪い話でもないと思いますよ。"
"10056110-12-ココロ" = "あ、アミ副長……！"
"10056110-13-ココロ" = "こ、これはサボってたわけではなくて……！"
"10056110-14-ココロ" = "ダイビングの後は、体内に残った窒素を抜くために十分な休息を取らないと――"
"10056110-15-アミ" = "ああ、ご心配なく。皆さんの監視に来たわけではないので。"
"10056110-16-アミ" = "私は……。"
"10056110-17-アミ" = "アイランドを代表して、感謝を伝えに来たのです。"
"10056110-18-ココロ" = "……感謝、ですか？"
"10056110-19-アミ" = "ええ。 "
"10056110-20-アミ" = "先日[ruby=ちょうすい]は潮水[/ruby]の[ruby=こうりゅう]蛟龍か[/ruby]ら先生を守り、彼女たちの撃退に大きく貢献されたそうですね。"
"10056110-21-アミ" = "シャーレの先生はオデュッセイアでお迎えしているVIPです。"
"10056110-22-アミ" = "もしも先生の身に何かあれば、アイランドはもちろん、#n学園全体の不名誉になるところでした。"
"10056110-23-アミ" = "アイランド、そして学園を代表して感謝申し上げます。"
"10056110-24-ココロ" = "い、いえ……感謝していただくようなことでは……。"
"10056110-25-ココロ" = "そもそもこっそり船を出していなければ、先生が巻き込まれることもなかったでしょうし……。 "
"10056110-26-ココロ" = "自業自得と言うべきでしょうか……。"
"10056110-27-アミ" = "それはそうですね。"
"10056110-28-ココロ" = "うぅっ……。"
"10056110-29-アミ" = "ですが、感謝したいことはもう1つあります。"
"10056110-30-アミ" = "潮水の蛟龍――いえ、あのバカをぎゃふんと言わせたそうですね？"
"10056110-31-アミ" = "彼女が逮捕された時、アイランドの立場としては身柄を矯正局に引き渡すことが最善の策だったのですが……。"
"10056110-32-アミ" = "個人的には、痛い目に遭わせてやりたかったんです。"
"10056110-33-アミ" = "部長には大きな借りができましたね。"
"10056110-34-ココロ" = "あ、ありがとうございます……。"
"10056110-35-ココロ" = "も、もしよろしければ……器材購入分の借金もチャラにしていただけると……。"
"10056110-36-ココロ" = "お望みとあれば、きっちり計算してみましょうか？"
"10056110-37-ココロ" = "い、いえ、結構です！"
"10056110-38-アミ" = "それと……前に言った一枚板の話は私が間違っていました。"
"10056110-39-アミ" = "あるべき場所を離れて漂流した一枚の板が……#n時には遭難者の命を救うこともあるんですね。"
"10056110-40-アミ" = "もちろん、だからといって今後も例外を認めるつもりはないですが。"
"10056110-41-ココロ" = "と、当然ですよね！こ、こちらもオデュッセイアの規則を破ることはしません！"
"10056110-42-ココロ" = "ぜ、全力で頑張ります！"
"10056110-43-サユリ" = "部長って、見てるこっちが恥ずかしくなるくらいペコペコするよね？"
"10056110-44-コトネ" = "権力に弱い立場だから……理解してあげて。"
"10056110-45-サユリ" = "オットセイだ、オットセイ～"
"10056110-46-アミ" = "それはそれとして、報告書を拝見したのですが――"
"10056110-47-アミ" = "攻撃に使用した吸着機雷の入手経路を伺っても？"
"10056110-48-アミ" = "事前に報告されていた購入明細には含まれていませんでしたが。"
"10056110-49-ココロ" = "あぇっ！？そ、それはその……。"
"10056110-50-ココロ" = "う、奪い取ったんです！海賊船の倉庫から！"
"10056110-51-アミ" = "ふーん……？"
"10056110-52" = "[ns1] \"やあ。こんにちは。\"\n[ns2] \"なにしてるの？\""
"10056110-53-アミ" = "先生、お疲れさまです。"
"10056110-54-アミ" = "私はダイビング部への伝言を。もう用件は終わったところです。"
"10056110-55" = "[s3] \"アクアシールでアイス買ってきたんだけど……。\"\n[s4] \"アミも食べる？\""
"10056110-56-アミ" = "いえ、私は書類がたまってますので。 "
"10056110-57-アミ" = "お先に失礼します。"
"10056110-58" = "[ns] \"……アミちゃんは固いなぁ。\""
"10056110-59-ココロ" = "あ、あはは……仕事が多いようなので仕方ないですね……。"
"10056110-60" = "[s5] \"みんな、ちょうど休憩中だったのかな？\"\n[s6] \"一緒にアイス食べようよ。\""
"10056110-61-ココロ" = "いえ、そこまでしていただかなくても……。"
"10056110-62-ココロ" = "……先生。#n私たちを気にかけてくださる理由を教えてください。"
"10056110-63-ココロ" = "私たちは先生に何もしてあげられないのに……。"
"10056110-64" = "[s] \"特別な理由が必要かな？\""
"10056110-65-ココロ" = "えっ？"
"10056110-66" = "[s7] \"私はダイビング部のスポンサーだよ？\"\n[s8] \"スポンサーが支援するのは当然でしょ！\""
"10056110-67-ココロ" = "そうですね。それなら……素直にいただくことにします。"
"10056110-68-コトネ" = "おっ、先生。またアイスを買ってきてくれたの？"
"10056110-69-サユリ" = "サユリはイワシアイス～"
"10056110-70-コトネ" = "私はバニラ。"
"10056110-71-ココロ" = "あー、私も……。"
"10056110-72-一同" = "いただきます！"
"10056110-73" = "DIVE into OCEAN！"
