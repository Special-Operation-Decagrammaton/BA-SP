[translation]
"10056105-1-ナナミ" = "竜王様、1番エリアで爆発を確認……何かがこびりついています！"
"10056105-2-ナナミ" = "機関室、圧力低下！バラストライン、損傷！"
"10056105-3-ナナミ" = "2番、3番エリアも同時に被弾……被害は甚大です！"
"10056105-4-ナナミ" = "……相手はたった4人ではないか。"
"10056105-5-ナナミ" = "それで10ヶ所以上も攻撃されているだと……？"
"10056105-6-ナナミ" = "やつらはどんな手を使っておるのだ！？"
"10056105-7-ナナミ" = "排水ポンプも限界です！このままでは竜宮が……艦隊が丸ごと沈没します！"
"10056105-8-ナナミ" = "りゅ、竜王様……！"
"10056105-9-ナナミ" = "たかが数人の……ダイビング部なんぞに……！"
"10056105-10-ナナミ" = "[ruby=ルスカ]怪物[/ruby]だあ……[ruby=ルスカ]怪物[/ruby]がいる！"
"10056105-11-ナナミ" = "……やめろ、やめろっ！"
"10056105-12-ココロ" = "……今、「やめろ」とおっしゃいましたか？"
"10056105-13-ナナミ" = "そうだ、「やめろ」と言っているのだ！"
"10056105-14-ナナミ" = "[ruby=りゅうぜんこう]龍涎香[/ruby]になど頼らずとも……余への貢物は溢れるほどにある。"
"10056105-15-ナナミ" = "お主らのお遊びに付き合うのもうんざりだ！余は帰らせてもらう！"
"10056105-16" = "[ns1] \"はあ、良かった……。\"\n[ns2] \"やっと終わった……。\""
"10056105-17-ナナミ" = "シャーレの先生と言ったな。"
"10056105-18-ナナミ" = "余が本来の力を取り戻せておらぬゆえ、今回は特別に引き下がるが……。"
"10056105-19-ナナミ" = "次は屈服させてみせる！"
"10056105-20" = "[s3] \"うん。また会おう。\"\n[s4] \"……それまで騒ぎは起こさないでね。\""
"10056105-21-ナナミ" = "な、なんだ、その言い草は！"
"10056105-22-ココロ" = "あの……ナナミさん。"
"10056105-23-ナナミ" = "竜王様と呼べ！"
"10056105-24-ココロ" = "はっ、はい！竜王様！"
"10056105-25-ココロ" = "わ、[ruby=・]私[/ruby][ruby=・]た[/ruby][ruby=・]ち[/ruby][ruby=・]は[/ruby]水の上で起きたことについて、そこまで気にしていません。"
"10056105-26-ココロ" = "ですが万が一……本当に、万に一つでも。"
"10056105-27-ココロ" = "うち[ruby=スポンサー]の先生に[/ruby]銃口を向けるようなことがあったら――"
"10056105-28-ココロ" = "あなたの身に不幸が降りかからないよう、願うばかりです。"
"10056105-29-ナナミ" = "……ぐっ。"
"10056105-30-ナナミ" = "艦隊、両舷全速！撤退だ！"
"10056105-31-サユリ" = "ひゅー、やるねー？"
"10056105-32-ココロ" = "あ、あれ……？#nおかしなことでも言ったかな……？"
"10056105-33-サユリ" = "ココロは怒ったら、本当に怖いよね。"
"10056105-34-サユリ" = "びっくりして潜りそうになった。"
"10056105-35-ココロ" = "わ、私は警告しただけなのに……。"
"10056105-36" = "[s] \"ココロ、お疲れ様。\""
"10056105-37-ココロ" = "せ、先生もお疲れ様でした！"
"10056105-38-ココロ" = "海賊はいなくなりましたし、あとはオデュッセイアに帰るだけですね。"
"10056105-39" = "[s5] \"それなんだけど……。\"\n[s6] \"私たちの船……どこ？\""
"10056105-40-サユリ" = "あっ、それは……。"
"10056105-41-サユリ" = "ひっくり返っちゃった。さっきクジラがジャンプした時。"
"10056105-42-コトネ" = "クジラがブリーチングした時の衝撃は、40個の手榴弾を同時に爆発させたのと同じぐらいだから……。"
"10056105-43-ココロ" = "ど、どうしよう……？"
"10056105-44-ココロ" = "えっ、あれ？うああ……これ、遭難ってこと？#nま、まず遭難信号を――"
"10056105-45-コトネ" = "ココロ、落ち着いて。"
"10056105-46-コトネ" = "もう無線でアイランドに信号を送っておいた。"
"10056105-47-コトネ" = "この辺りで待ってれば救助船が来るよ。"
"10056105-48-ココロ" = "よ、よかったぁ……。"
"10056105-49-サユリ" = "海上漂流か……こうして救助船を待つのも久しぶりだね。"
"10056105-50-サユリ" = "船が来るまで、[ruby=・]ア[/ruby][ruby=・]レ[/ruby]しながら待つ。"
"10056105-51" = "[s] \"……アレ？\""
"10056105-52-コトネ" = "うん。先生、こっち来て。"
"10056105-53-コトネ" = "海上漂流した時は、体温維持と、お互いが離れないようにぴったりくっつくんだ。"
"10056105-54" = "[ns] \"手を握るとかじゃダメなの？\""
"10056105-55-ココロ" = "だ、ダメです！"
"10056105-56-ココロ" = "漂流した時に一番怖いのは体温が下がることですから。"
"10056105-57-ココロ" = "あ、安全のための措置なので……。"
"10056105-58-ココロ" = "今は部長の指示に従ってください！"
"10056105-59" = "（その後、救助船が来るまで抱き合ったまま海に浮かんでいた）"
"10056105-60" = "（おかげで寒さを感じることはなかったが……）"
"10056105-61" = "（救助船に乗っていたトライデントの生徒に誤解されそうになった）"
