[translation]
"10056050-1" = "第5話;損害賠償"
"10056050-2" = "アイランド・士官室"
"10056050-3-ミナト" = "……船底を掃除していたらフジツボが爆発した、と？"
"10056050-4-ココロ" = "……はい。"
"10056050-5-ミナト" = "俄かには信じがたいけど……。"
"10056050-6-ミナト" = "とはいえ、作業中の爆発で船に穴が開くこと自体は日常茶飯事。"
"10056050-7-ミナト" = "例えば――掃除が面倒だからといって、付着物を爆弾で吹き飛ばそうとしたり。"
"10056050-8-ココロ" = "…………。"
"10056050-9-ミナト" = "心当たりはないの？"
"10056050-10-ココロ" = "まったくない、わけでは……ない、です……。"
"10056050-11-ミナト" = "……残念でならないわ、ココロ部長。"
"10056050-12-ミナト" = "不慮の事故なら酌量の余地もあったけど……。"
"10056050-13-ミナト" = "個人の不注意が原因なら、ダイビング部にも修理費を負担してもらうことになる。"
"10056050-14-ココロ" = "あ、あの……。"
"10056050-15-ココロ" = "こんなことを聞くのは恥ずかしいのですが……。"
"10056050-16-ココロ" = "その……金額はどのくらいに……？"
"10056050-17-アミ" = "補修に係る費用と、海水に浸った物の損害賠償まで考慮すると……。"
"10056050-18-アミ" = "概算でこの程度になるかと。"
"10056050-19-ココロ" = "ひぇっ……！"
"10056050-20-ココロ" = "あ、あの……何かの間違いじゃないですか？"
"10056050-21-ココロ" = "うちの年間活動費以上の金額に見えるのですが……。"
"10056050-22-アミ" = "計算に間違いはありません。"
"10056050-23-アミ" = "むしろこれでも少なく見積もっています。#n事故で船を使用できない間の損失は、アイランドが負担しますので。"
"10056050-24-ココロ" = "ううぅ……。"
"10056050-25" = "[s1] \"どうにかならないかな？\"\n[s2] \"なんかこう、例外として……。\""
"10056050-26-ミナト" = "[ruby=・]例[/ruby][ruby=・]外[/ruby]、ですか……。"
"10056050-27-ミナト" = "先生。不確定要素の多い航海で、最もやってはいけない判断は何だと思いますか？"
"10056050-28-ミナト" = "答えは、例外を認めること。"
"10056050-29-ミナト" = "意図したものではないから。しょうがないから。今回だけだから。"
"10056050-30-ミナト" = "理由はどうあれ、例外を認め始めた瞬間――"
"10056050-31-ミナト" = "船の結束は一息に緩み、荒波を乗り越える力を失います。"
"10056050-32-アミ" = "今は停泊中であることだけは幸いでしたが、これが海のど真ん中だったら……#n小さなミスが、命を脅かす大事故につながっていたかもしれません。"
"10056050-33-アミ" = "たった1枚、あるべき場所から板がなくなるだけで、船が沈むこともあるのです。"
"10056050-34" = "[s] \"でも……。\""
"10056050-35-ミナト" = "先生の口添えがあろうと、本件に例外を適用することはできません。#nですが……チャラにする方法が、あるにはあります。"
"10056050-36-ミナト" = "賠償は、部員ではなく、部に請求されるもの。部そのものが無くなれば免除されます。"
"10056050-37-ミナト" = "廃部という手もあるけど……どうする？"
"10056050-38-ココロ" = "えっ……。"
"10056050-39-ミナト" = "それほど難しい選択でもないと思うけど。"
"10056050-40-ミナト" = "ダイビング部は身体能力が高いから、トライデントや他の部でも活躍できるはず。"
"10056050-41-ココロ" = "でも……水中での活動をするならダイビング部でないと……。"
"10056050-42-ミナト" = "うん、それも理解してる。"
"10056050-43-ココロ" = "……すみません。みんなと考えてきます。"
"10056050-44-ミナト" = "ふぅ……。"
"10056050-45-ミナト" = "悪役は趣味じゃないんですけどね。"
"10056050-46-アミ" = "仕方ないですよ。艦長とはそういうものです。"
"10056050-47-ミナト" = "ぴえーん。"
"10056050-48-アミ" = "幼稚な言葉遣いは慎んでください。"
"10056050-49-コトネ" = "……部長！"
"10056050-50-사유라" = "ごめん、部長……しこたま詰められたよね？"
"10056050-51-サユリ" = "……ごめんね。"
"10056050-52-ココロ" = "ううん、大丈夫。仕方なかったんだから。"
"10056050-53-ココロ" = "フジツボが急に爆発するなんて思わなかったし……。"
"10056050-54-コトネ" = "賠償請求とか……平気？"
"10056050-55-コトネ" = "借金がこれ以上増えたら手に負えないよ。"
"10056050-56-コトネ" = "やっぱり諦めたほうが……。"
"10056050-57-ココロ" = "そ、そんなことない！"
"10056050-58-ココロ" = "今から弱音を吐いてちゃダメ。きっと打開策があるはずだから。"
"10056050-59-サユリ" = "……例えば？"
"10056050-60-ココロ" = "一獲千金を狙えるような宝の地図とか……。"
"10056050-61" = "もしかして、ダイビング部の皆さんですか？"
"10056050-62-ココロ" = "はっ、えっ、はいっ！？"
"10056050-63-ココロ" = "ご、ごめんなさい！#n私たちが破った網の話なら――"
"10056050-64-ココロ" = "網……？#nいえ。お尋ねしたいことがありまして。"
"10056050-65-怪しげなオデュッセイアの生徒" = "オデュッセイアで最も優秀なダイバーが集まってると聞いたんですけど……。"
"10056050-66-怪しげなオデュッセイアの生徒" = "その腕を見込んで……依頼をしても？"
