[translation]
"10056060-1" = "第6話;密航者"
"10056060-2" = "狭い操舵室内"
"10056060-3-サユリ" = "……宝の地図？"
"10056060-4-ココロ" = "そう。昨日の依頼主から受け取ったんだ。"
"10056060-5-ココロ" = "ポイントはD.U.から12海里のブルーホール。古い沈没船があるんだって。"
"10056060-6-ココロ" = "その積み荷をサルベージしてくれば買い取ってくれるって話だけど……。"
"10056060-7-ココロ" = "みんなはどう思う……？"
"10056060-8-コトネ" = "……何か裏はありそうかな。"
"10056060-9-コトネ" = "でもまあ、私たちに頼むのも理解はできる。#nブルーホールに沈んでる物を引き上げるのは難しいから。"
"10056060-10-サユリ" = "あやしい。"
"10056060-11-コトネ" = "前から沈没船の位置を知ってたなら、もっと早く動けたはずなんだよね。"
"10056060-12-コトネ" = "いまさら私たちに依頼する理由は？"
"10056060-13-ココロ" = "狙ってる貨物の中に、キャラクターのフィギュアがあるって言ってたよ。"
"10056060-14-ココロ" = "前は人気なかったけど、最近になって流行り始めて、フィギュアは言い値だって。"
"10056060-15-ココロ" = "昨日提示された報酬は、手数料を引いてもこのくらい……。"
"10056060-16-マキナ" = "うわぁお。借金を全部返済してもお釣りがくるじゃん。"
"10056060-17-サユリ" = "ワッフルコーンのイワシアイス……一生かけても食べきれないくらい買える。"
"10056060-18-ココロ" = "他の物もあるだけ買い取るから、高そうな物は全部持ってきてほしいって……。"
"10056060-19-ココロ" = "やっぱり怪しいかな……？"
"10056060-20-コトネ" = "……骨董品の価値はその時によって上がったり下がったりするよね。"
"10056060-21-コトネ" = "だから、費用をかけてでも引き上げるメリットが出てきたと考えれば、#n依頼人の話にも納得はできる。"
"10056060-22-コトネ" = "こういうのは大きな組織に頼もうとすると小回りが利かないだろうし……。"
"10056060-23-コトネ" = "疑い過ぎる必要はないのかもしれない。"
"10056060-24-マキナ" = "じゃあ悩む必要なくない？すぐ準備しよっ！"
"10056060-25-コトネ" = "待って。それはそれとして。#nブルーホールの探索が他の場所より危険なのはココロもよく知ってるよね？"
"10056060-26-ココロ" = "うっ……。"
"10056060-27-コトネ" = "深度の確認も、視野の確保も難しい。"
"10056060-28-サユリ" = "ルスカに会えるかも？"
"10056060-29-マキナ" = "それ[ruby=UMA]未確認生物[/ruby]じゃん。"
"10056060-30-ココロ" = "いつものココロらしくない。なにか焦ってる？"
"10056060-31-コトネ" = "もしかして……昨日、アイランドに何か言われた？"
"10056060-32-ココロ" = "それが……。"
"10056060-33-ココロ" = "今回の賠償金を払えなかったら、廃部にされるかもしれないんだ。"
"10056060-34-マキナ" = "廃部って……もうダイビングできないってこと？"
"10056060-35-ココロ" = "うん。たぶん他の部みたいに水上での活動が中心になる。"
"10056060-36-サユリ" = "それはイヤ……。"
"10056060-37-コトネ" = "……そういうことね。"
"10056060-38-ココロ" = "うん。水の外に……出たくないから。"
"10056060-39-ココロ" = "航海が終わっても、何の成果も得られずに戻ったら……。"
"10056060-40-ココロ" = "――に合わせる顔もないし。"
"10056060-41" = "[s] \"誰に？\""
"10056060-42-ココロ" = "それは――"
"10056060-43-ココロ" = "わあっ！？"
"10056060-44-ココロ" = "せ、せ、先生！？いつからここに！？"
"10056060-45" = "[s] \"最初から……。\""
"10056060-46-マキナ" = "どうしてここにいるの？"
"10056060-47" = "[s1] \"ここでお昼寝してたんだ。\"\n[s2] \"目が覚めた時には船が出た後で……。\""
"10056060-48-マキナ" = "あー……下の部屋の確認、忘れてた……。"
"10056060-49-ココロ" = "どうしよう……今からでも戻るべきかな……？"
"10056060-50" = "[s3] \"話は聞かせてもらったよ。\"\n[s4] \"宝探しに行くんだよね？\""
"10056060-51-ココロ" = "でも、沖に出るのは危ないので……。"
"10056060-52-ココロ" = "先生の時間を奪ってしまうことになりますし……。"
"10056060-53" = "[s] \"大丈夫。今日は予定ないんだ。\""
"10056060-54" = "[ns5] \"みんなの本気のダイビングも見てみたいし。\"\n[ns6] \"今回だけは許してくれないかな……？\""
"10056060-55-ココロ" = "あうう……分かりました……。"
"10056060-56-ココロ" = "その代わり！先生は絶対に船の中にいてください！"
"10056060-57-ココロ" = "日付が変わるまでには戻れそうだし……。"
"10056060-58-ココロ" = "トライデントの巡回エリアをバレずに抜けられるかも……。"
"10056060-59" = "[s] \"どうしてこっそり抜けるの？\""
"10056060-60-ココロ" = "それは……アイランドはこの計画を許可してくれないと思うんです。"
"10056060-61-ココロ" = "ただでさえ借金漬けなのに、見込みの薄い宝の地図を頼るなんて……。"
"10056060-62-ココロ" = "燃料の無駄だとグチグチ言われるに決まっています。"
"10056060-63-ココロ" = "……これ以上、冷ややかな視線は浴びたくないですから。"
"10056060-64" = "[s] \"アイランドに助けを求めたことはないの？\""
"10056060-65-ココロ" = "いえ、特には……。"
"10056060-66-ココロ" = "弱みを晒して、役立たず扱いされるのは嫌なんです。"
"10056060-67-マキナ" = "ただでさえ、生産性のない趣味に無駄遣いしてるってイチャモンつけられてるし。"
"10056060-68-コトネ" = "断られるようなことを、わざわざ聞く必要はない。"
"10056060-69" = "[s7] \"たしかに、さらけ出すのは怖いよね。\"\n[s8] \"弱さを隠すのも理解できる。\""
"10056060-70" = "[ns] \"でも時には――\""
"10056060-71-サユリ" = "……先生？大丈夫？"
"10056060-72-サユリ" = "顔、ブドウアイスみたいな色になっちゃった。"
"10056060-73" = "[s9] \"ごめん……小さな船に乗るのは久しぶりで……。\"\n[s10] \"意外と揺れるね……。\""
"10056060-74-マキナ" = "えっ？これでも揺れてないほうだよ。"
"10056060-75-マキナ" = "先生、思ったより船に弱いんだね。"
"10056060-76" = "[s] \"……酔い止めとかある？\""
"10056060-77-コトネ" = "薬はないけど……。"
"10056060-78-コトネ" = "これを噛んでたら気がまぎれるかも。"
"10056060-79" = "[ns] \"……このガム、珍しい味だね！？\""
"10056060-80-サユリ" = "ガムじゃない。乾燥昆布。"
"10056060-81-サユリ" = "磯の香りがするから、サユリは好き。"
"10056060-82" = "[ns] \"うっぷ……。\""
"10056060-83-マキナ" = "わっ、ヤバヤバ。"
"10056060-84-マキナ" = "サユリ、バケツ持ってきて！早く！"
"10056060-85" = "（その後しばらく船酔いは収まらないまま、ブルーホールに向かった）"
"10056060-86-怪しげなオデュッセイアの生徒" = "竜王様。ただいま戻りました。"
"10056060-87-？？？" = "うむ、ご苦労。"
"10056060-88-？？？" = "かつての臣下を捜すのに手一杯だった故、気にかけてやれなかったが――"
"10056060-89-？？？" = "その表情……愉快な知らせがあるようだな。"
"10056060-90-怪しげなオデュッセイアの生徒" = "はい。"
"10056060-91-怪しげなオデュッセイアの生徒" = "竜宮に相応しき宝の運び手を担う、深海の才媛を見つけました。"
"10056060-92-潮水の蛟龍" = "ほぉ？#n……新顔か。楽しみだな。"
"10056060-93-？？？" = "深海を自由に行き来できる[ruby=・]ク[/ruby][ruby=・]ジ[/ruby][ruby=・]ラ[/ruby][ruby=・]の[/ruby][ruby=・]末[/ruby][ruby=・]裔[/ruby]だと？"
"10056060-94-怪しげなオデュッセイアの生徒" = "彼女らは苦境に陥っているようです。#n竜王様が慈悲をおかけになれば、必ずや臣従するでしょう。"
"10056060-95-？？？" = "それは重畳。新しい臣下はいつでも歓迎だ。"
"10056060-96-？？？" = "では客人を迎える準備をせねば。"
"10056060-97-潮水の蛟龍" = "さあ、来たまえ。新たな臣下ども。"
"10056060-98-？？？" = "余の竜宮へ！"
