[translation]
"10056010-1" = "第1話;イワシアイス"
"10056010-2" = "浮体式港湾・第3ターミナル東側の埠頭"
"10056010-3" = "（第3ターミナルは活気に満ちていた）"
"10056010-4" = "（釣りをする生徒、魚を運ぶ生徒、船を整備する生徒――）"
"10056010-5" = "（みんな忙しそうだったが、ダイビング部らしき生徒は見当たらなかった）"
"10056010-6" = "（その時、埠頭の端でしゃがみ込んでいる少女が目に入った）"
"10056010-7" = "（白い水着の少女は海面を見ながら数を数えていた）"
"10056010-8-サユリ" = "101、102、103……。"
"10056010-9" = "[s1] \"あの……。\"\n[s2] \"ちょっといいかな？\""
"10056010-10-？？？" = "111、112、113……。"
"10056010-11" = "[s3] \"白い水着の生徒さん……？\"\n[s4] \"何を数えてるの？\""
"10056010-12-サユリ" = "……「白い水着の生徒」じゃない。"
"10056010-13-サユリ" = "ちゃんと名前がある。"
"10056010-14-サユリ" = "コール・ミー、サユリ――"
"10056010-15" = "[ns5] \"サユリ、だね。\"\n[ns6] \"よろしく。私はシャーレの先生だよ。\""
"10056010-16" = "[ns] \"何を見てるの？\""
"10056010-17-サユリ" = "……海。"
"10056010-18-サユリ" = "気泡を見てる――ブクブク。"
"10056010-19" = "[s] \"ブクブク。\""
"10056010-20-サユリ" = "海を見るの、楽しい。"
"10056010-21-サユリ" = "イワシもアカザエビもクジラも……みんな、水の中。"
"10056010-22-サユリ" = "水の上は鳥しかいない。"
"10056010-23-サユリ" = "水の中はもっと楽しいのに……。"
"10056010-24" = "[s] \"サユリはクジラを見たことがあるの？\""
"10056010-25-サユリ" = "ある。少し沖に出るとたくさん会えるよ。港の近くは無理。"
"10056010-26-サユリ" = "クジラは好奇心旺盛だから、船と一緒に泳ぐのが好き。#n興奮すると大きくジャンプすることもあるの。"
"10056010-27-サユリ" = "船が近すぎるとひっくり返っちゃうかもしれないから、要注意。"
"10056010-28" = "[s7] \"クジラのジャンプか……。\"\n[s8] \"いつか見てみたいな。\""
"10056010-29-サユリ" = "先生もクジラ、好き？"
"10056010-30-サユリ" = "そっか、嬉しい。#nでも、オデュッセイアの生徒はあんまり好きじゃないみたい……。"
"10056010-31" = "[s] \"かっこいいし、可愛いところもあるし――\""
"10056010-32" = "[ns9] \"――って、忘れてた。\"\n[ns10] \"1つ聞いてもいい？\""
"10056010-33-サユリ" = "何くれる？"
"10056010-34-サユリ" = "前にネネちゃんが言ってた。"
"10056010-35-サユリ" = "大人に何か頼まれる時は、対価をもらわないと痛い目に遭うって。"
"10056010-36" = "[s11] \"……それもそうだね。\"\n[s12] \"それなら、おやつでどう？\""
"10056010-37-サユリ" = "……おやつ！"
"10056010-38-サユリ" = "じゃあ、「アクアシール」のアイスクリーム。"
"10056010-39-サユリ" = "サユリはイワシアイスが一番好き～"
"10056010-40" = "[s13] （生臭そうだ……）\n[s14] \"いいよ。どこで買える？\""
"10056010-41-サユリ" = "一番近いお店は2番デッキにあるけど――"
"10056010-42-？？？" = "プハーッ！"
"10056010-43-マキナ" = "見てた？見てたよね？私も素潜りできたよ！"
"10056010-44-マキナ" = "ね、ね、何秒だった？#n私の勝ちなら、約束どおり「アクアシール」でアイスを奢って――"
"10056010-45-マキナ" = "……誰？"
"10056010-46-サユリ" = "マキナ、早くおいで。"
"10056010-47-サユリ" = "シャーレの先生がアイス買ってくれるって。"
"10056010-48-マキナ" = "え、なんで？すっごく怪しいんだけど……。"
"10056010-49" = "[s15] \"こんにちは。怪しくないよ。\"\n[s16] \"実は聞きたいことがあって――\""
"10056010-50-マキナ" = "それより！私、何秒潜ってた？#n180秒は越えてると思うんだけど。"
"10056010-51-サユリ" = "……あ。"
"10056010-52-マキナ" = "……え？"
"10056010-53-サユリ" = "先生と話してて忘れちゃった。"
"10056010-54-マキナ" = "こっちは必死で潜ってたんだよ！？"
"10056010-55-マキナ" = "今回はあんたのミスだから、私の勝ちね！"
"10056010-56-サユリ" = "あり得ない。マキナはウエイトがないと10メートルも潜れないへなちょこ。"
"10056010-57-サユリ" = "悔しいなら、やり直せば？"
"10056010-58-マキナ" = "なにぃ……！？"
"10056010-59" = "[s17] \"二人とも、それくらいで。\"\n[s18] \"私のせいだから、アイスをご馳走するよ。\""
"10056010-60-マキナ" = "んー……なんか怪しそうだけど……。"
"10056010-61-マキナ" = "ま、いっか。この辺は知り尽くしてるし、先生弱そうだし。"
"10056010-62-マキナ" = "いいよ。「アクアシール」だよね？私も行く。"
"10056010-63" = "[s] \"……マキナもイワシアイス？\""
"10056010-64-マキナ" = "そんなわけないじゃん！"
"10056010-65" = "第3ターミナル、2番デッキ前の商店街"
"10056010-66" = "（ベンチに座ってアイスを食べることにした）"
"10056010-67" = "（サユリはイワシアイスで、マキナはダブルチョコアイスを選んでいた）"
"10056010-68" = "（気になって、自分のもイワシアイスにしてみたが……#nイワシそのものが入っていて塩辛く生臭かった）"
"10056010-69-サユリ" = "やっぱりイワシアイスは至高。甘じょっぱくて、やみつき～"
"10056010-70-マキナ" = "それ以前に香りがアイスじゃないでしょ。"
"10056010-71-マキナ" = "やっぱ王道のチョコが一番。"
"10056010-72-マキナ" = "泳ぎ終わってから食べるおやつには、甘～いチョコアイスしかないよ。"
"10056010-73" = "[s19] \"二人とも泳ぐのが上手なんだね。\"\n[s20] \"オデュッセイアの生徒はみんなそうなの？\""
"10056010-74-マキナ" = "いや？ここの生徒だからって、みんながみんなうまいわけじゃないさ。"
"10056010-75-マキナ" = "クルーズ運営部とか、水に入るのすら嫌がる生徒が結構いるらしいし。"
"10056010-76-マキナ" = "まあ、私とサユリは上手いほうじゃないかな。"
"10056010-77-サユリ" = "サユリのほうが、レベチでうまい。"
"10056010-78-マキナ" = "なぁっ！？勝負で白黒ハッキリさせてあげるよ！"
"10056010-79-サユリ" = "でもね、先生……他の人が相手なら、そもそも話にならない。"
"10056010-80-サユリ" = "だってサユリたちは普通の生徒じゃなくて、特殊――"
"10056010-81-マキナ" = "わーっ！わーっ！"
"10056010-82" = "[s] \"特殊……？\""
"10056010-83-マキナ" = "な、何でもないよ！"
"10056010-84-マキナ" = "それより、話の続きだけど……何が聞きたいの？#n知ってることなら答えてあげる。アイスのお礼。"
"10056010-85" = "[s] \"それじゃあ、改めて。\""
"10056010-86" = "[ns] \"ダイビング部の生徒がどこにいるか知らない？\""
"10056010-87-マキナ" = "だ、ダイビング部？"
"10056010-88-マキナ" = "どうしてそんなこと聞くの……？"
"10056010-89" = "[s21] \"さっき艦長に言われたんだ。\"\n[s22] \"ダイビング部の財源が気になるって。\""
"10056010-90" = "[ns23] \"だから1度会って話をしたいんだよね。\"\n[ns24] \"周りとの交流は避けてるらしいけど……。\""
"10056010-91-マキナ" = "そ、そりゃそうさ。ダイビング部は秘密主義の生徒が多いから……。"
"10056010-92-サユリ" = "ステルスモード～"
"10056010-93-マキナ" = "私たちも……最後に見たのは先月だと思う。"
"10056010-94-マキナ" = "この近くにはいないんじゃない？#n他のターミナルに行ってみたら？"
"10056010-95" = "[s] \"そっか……。\""
"10056010-96-トライデントの部員" = "ダイビング部！"
"10056010-97-トライデントの部員" = "やっと見つけた……！"
"10056010-98-トライデントの部員" = "先週、第3エリアで網を破ったのはお前たちだよな？#n鋭い刃物で切った痕跡があったぞ。"
"10056010-99-トライデントの部員" = "他人の作業場で勝手に潜っちゃダメだろ？"
"10056010-100-トライデントの部員" = "あいつら、共用エリアに網を仕掛けてたのにブイを設置してなかったんだよ？"
"10056010-101-トライデントの部員" = "気づけなくてフィンが絡まって大変だったんだから！"
"10056010-102-トライデントの部員" = "他にも聞きたいことは山ほどある！"
"10056010-103-トライデントの部員" = "お前たちの水中スクーターのせいで魚の群れが逃げるって苦情が来てんだ。"
"10056010-104-トライデントの部員" = "きちんと説明しなきゃ、今度という今度はただじゃおかないから――"
"10056010-105" = "[ns] \"……ダイビング部？\""
"10056010-106-マキナ" = "……あ。"
"10056010-107-サユリ" = "バレちゃった。"
"10056010-108-マキナ" = "くっそー、うまくいってたのに……。"
"10056010-109-マキナ" = "こういう時は[ruby=・]あ[/ruby][ruby=・]の[/ruby][ruby=・]作[/ruby][ruby=・]戦[/ruby]しかないか。"
"10056010-110-マキナ" = "サユリ、プランDだよ。覚えてる？"
"10056010-111-サユリ" = "がってん。"
"10056010-112-マキナ" = "ダッシュだ！"
"10056010-113" = "[ns] \"ちょ、ちょっと待って！\""
