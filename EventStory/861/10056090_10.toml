[translation]
"10056090-1" = "第9話;そこでしか見えない価値"
"10056090-2" = "（ブルーホールに夜が訪れた）"
"10056090-3" = "（夜の海は先が分からないくらいに真っ暗だった）"
"10056090-4" = "（縛られたままデッキに座っていたせいで腰が痛い……）"
"10056090-5-ココロ" = "ううっ……すみません、先生。"
"10056090-6-ココロ" = "こんなことに巻き込んでしまって……。"
"10056090-7" = "[s1] \"気にしなくていいよ。\"\n[s2] \"こうやって縛られるのも慣れてるし……。\""
"10056090-8-ココロ" = " 慣れてる……慣れてるっ！？"
"10056090-9-ココロ" = "シャーレの業務って、思った以上に大変なんですね……。"
"10056090-10-マキナ" = "んで、対策を立てなくていいの？"
"10056090-11-マキナ" = "先生のおかげで時間は稼げたけど、のんきにしてられないよ。"
"10056090-12-マキナ" = "夜が明けたらあのバカの気が変わってるかもしれないし。"
"10056090-13-コトネ" = "部長、本当にクジラの骨や[ruby=りゅうぜんこう]龍涎香[/ruby]を取りに行くの？"
"10056090-14-ココロ" = "そういうものに手を付けるのは、ダイバー免許剥奪レベルの重罪だけど……。"
"10056090-15-ココロ" = "先生の安全がかかっているなら、仕方ないよ……。"
"10056090-16" = "[s3] \"いったん、私のことは置いとこうか。\"\n[s4] \"みんなはどうしたいの？\""
"10056090-17-ココロ" = "もちろん、海賊なんかに協力したくはありません。"
"10056090-18-ココロ" = "で、でも先生の安全がかかっているんです。#n嫌だからといって断れるものでも……。"
"10056090-19-ココロ" = "やっぱり今回は、ナナミの言いなりになるしか……。"
"10056090-20" = "[s5] \"私は大丈夫だから。\"\n[s6] \"嫌なことはしなくていいんだよ。\""
"10056090-21-ココロ" = "分かっています。#n……好きなことだけして生きていくなんてできない、って。"
"10056090-22-ココロ" = "借金を返すために船底掃除をしたように。"
"10056090-23-ココロ" = "何かを得るには、嫌なことも飲み込まなければならないんです。"
"10056090-24" = "[s] \"好き勝手にしていいって意味じゃないよ。\""
"10056090-25" = "[ns7] \"君たちの追及する、不変の価値があるなら――\"\n[ns8] \"他人を気にして妥協する必要はないってこと。\""
"10056090-26-ココロ" = "変わらない、価値……。"
"10056090-27-ココロ" = "先生。龍涎香をご覧になったことはありますか？"
"10056090-28-ココロ" = "龍涎香は水中にあると、幻想的で柔らかい香りを放ちながら、徐々に溶けていきます。"
"10056090-29-ココロ" = "ですが水の外に出して光を当てると……醜い石にしか見えません。"
"10056090-30-ココロ" = "海中に眠るものの多くが、同じなんです。"
"10056090-31-ココロ" = "キラキラした泡も水面では消え、美しく泳いでいたクラゲも水の外では形を保てない。"
"10056090-32-ココロ" = "姿を現した時より、隠れている時のほうが輝く価値もあるんです。#nだから――"
"10056090-33-ココロ" = "大事なものは、水の外に出したくありません。"
"10056090-34-サユリ" = "部長……。"
"10056090-35-サユリ" = "……クジラだ。"
"10056090-36-サユリ" = "船が集まってるから見に来たのかな？"
"10056090-37" = "[s] \"……クジラも水面に上がる時があるんだね。\""
"10056090-38-コトネ" = "航海中はよく出くわすよ。"
"10056090-39-コトネ" = "機嫌がいい時は水面から飛び上がったりもするし。"
"10056090-40-サユリ" = "でも、クジラってすっごく重いから、跳ねる時にケガすることもあるんだけどね。"
"10056090-41" = "[s9] \"クジラにとって水上は危険だろうに……。\"\n[s10] \"どうしてそこまでしてジャンプするのかな？\""
"10056090-42-ココロ" = "いろいろな説がありますが……私は、好奇心だと思っています。"
"10056090-43-ココロ" = "水の上から楽しそうな音が聞こえるけど、見上げても船底しか見えない。"
"10056090-44-ココロ" = "だから、音の正体は何なのか確認しようと顔を出すんです。"
"10056090-45" = "[s11] \"水の下でしか見えない価値のように……。\"\n[s12] \"水の上でしか見えない価値もあるんだね。\""
"10056090-46-ココロ" = "……！"
"10056090-47" = "[s] \"勇気がいることだろうけど、自分に嘘はつかないで。\""
"10056090-48" = "[ns] \"君たちの可能性は無限にあるから。\""
"10056090-49-コトネ" = "はぁっ……。"
"10056090-50-コトネ" = "……こんな所で使いたくはないけど。"
"10056090-51-ココロ" = "ナナミが航海術に優れているといっても、対抗策がないわけではありません。"
"10056090-52-ココロ" = "……水中の私たちを捕まえることはできませんから。"
"10056090-53-サユリ" = "ウィー・アー・ファスト～"
"10056090-54-ココロ" = "ただ、問題は先生で……。"
"10056090-55-ココロ" = "私たちが水中に逃げている間、海賊たちもただ見ているだけではないでしょう。"
"10056090-56-ココロ" = "閃光弾や煙幕弾でもあれば……。"
"10056090-57-コトネ" = "友達に借りればいい。"
"10056090-58-ココロ" = "……友達？"
"10056090-59-コトネ" = "うん。新しくできた友達にお願いしてみよう。"
