[translation]
"10056005-1" = "プロローグ;少女の磯笛"
"10056005-2" = "（オデュッセイア海洋高等学校の艦隊がD.U.に帰港して間もない頃――）"
"10056005-3" = "（仕事で訪れた時のことだった）"
"10056005-4" = "[ns] \"何の音だろう……？\""
"10056005-5" = "（海の方から、鳥のさえずりのような音が聞こえてきた）"
"10056005-6" = "（いつだったかテレビで見た、イルカの鳴き声にも似ていて――）"
"10056005-7" = "（つい手すりから身を乗り出して、辺りを見回すと）"
"10056005-8-ココロ" = "……。"
"10056005-9" = "（そこにいたのは、海鳥でもイルカでもなく――1人の少女だった）"
"10056005-10" = "（潜っては、また水面に顔を出して息継ぎをする）"
"10056005-11" = "（そのたびに、澄んだ口笛が船上まで運ばれていた）"
"10056005-12" = "[ns] \"あのー！\""
"10056005-13-ココロ" = "ん……？"
"10056005-14-ココロ" = "……ひいっ。"
"10056005-15" = "（こちらの存在に気づくと、少女は瞬く間に水の中へ潜ってしまった）"
"10056005-16" = "（海面に残された波紋だけが、少女がいたことを証明してくれていた）"
"10056005-17" = "[ns] \"今のは……。\""
"10056005-18" = "オデュッセイア海洋高等学校「アイランド」・士官室"
"10056005-19-ミナト" = "さて……オデュッセイアに滞在されてしばらく経ちますが――"
"10056005-20-ミナト" = "ご不便はありませんか？"
"10056005-21" = "[s1] \"みんなのおかげで楽しく過ごせてるよ。\"\n[s2] \"まだ分からないことばっかだけど……。\""
"10056005-22-ミナト" = "そうでしょうとも。オデュッセイアの規模はキヴォトスでも指折りですから。"
"10056005-23-ミナト" = "ここより大きな学園もいくつかはありますので、1番とまでは言いませんけどね。"
"10056005-24-ミナト" = "それでも、全体を見て回る難しさは群を抜いているかと。#n各々の船を部室として使っている部活が大多数ですし、#n航海の日程がかみ合わなければ、顔を合わせられないこともしばしば。"
"10056005-25-ミナト" = "真にオデュッセイアを理解されたいのなら、遠洋航海をご一緒する他ないでしょう。"
"10056005-26-ミナト" = "……いえ、もしかしたら、この広大な海を隅々まで巡らなければ、#n理解にはたどり着けないかもしれませんよ。ふふっ。"
"10056005-27-アミ" = "あの、艦長。"
"10056005-28-ミナト" = "ところで先生、ランチはお済みですか？#nもしよろしければ本艦自慢の料理をご馳走しますよ。#nなんてったって今日は金曜日！カレーの日なのです！"
"10056005-29-ミナト" = "もう昨日から楽しみで楽しみで……。"
"10056005-30-ミナト" = "なにも大げさではありません。航海中は新鮮な食材は手に入らないですから。#nすると、どうしたって冷凍野菜が中心になります。で、す、が――"
"10056005-31-ミナト" = "シェフによると、今日は新鮮なトマトがたっぷり入っているそうです。"
"10056005-32-アミ" = "艦長……。"
"10056005-33-アミ" = "航海中は調理にも多くの制限があります。"
"10056005-34-ミナト" = "荒波の時は火を使うのさえ難しく、レトルトで済ませたりもしますから。"
"10056005-35-ミナト" = "まあ、あれはあれでイイ線いってるとは思っています。#nじっくり煮込んでとろみのある野菜パウダーは、独特な風味があるんですよ。"
"10056005-36-ミナト" = "多くの生徒からは人気ないんですけどね。"
"10056005-37-アミ" = "――ミナト先輩！"
"10056005-38-ミナト" = "わわっ！？ビックリした……。"
"10056005-39-ミナト" = "そんな大声を出してどうしたの。"
"10056005-40-ミナト" = "面会中なのは知っているでしょう？常に他者の手本たるアイランドの幹部らしからぬ行動ね。"
"10056005-41-アミ" = "そっくりそのままお返しいたします。"
"10056005-42-アミ" = "無駄話をする暇など一切ないとお伝えしていたはずです。#n鐘崎港に関する業務が山ほどあることをお忘れですか？"
"10056005-43-アミ" = "[USERNAME]先生がいらしたからといって突然面会の予定を入れるなんて……。"
"10056005-44-アミ" = "こうしておしゃべりばかりしていたら、徹夜をしても終わりませんよ？"
"10056005-45-ミナト" = "ぴえーん。"
"10056005-46-アミ" = "「ぴえーん」じゃありません。"
"10056005-47-アミ" = "オデュッセイアの生徒会――アイランドの部長なんですから、幼稚な言葉遣いは慎んでください。"
"10056005-48-ミナト" = "ぴえーん、です。"
"10056005-49-アミ" = "「です」を付けても変わりませんよ。"
"10056005-50-アミ" = "お見苦しいところをお見せしました。"
"10056005-51-アミ" = "先生もお忙しいでしょうに、#n艦長の無駄話にお付き合いくださりありがとうございます。"
"10056005-52" = "[s3] \"なんのなんの。\"\n[s4] \"サボる口実になってたし……。\""
"10056005-53-アミ" = "これが……大人？"
"10056005-54-アミ" = "……こほん。"
"10056005-55-アミ" = "なんにせよ、ご不便がないのは何よりです。"
"10056005-56-アミ" = "オデュッセイアで何かあれば、我々アイランドやトライデントにご連絡ください。#nあちらは風紀を担ってくれていますので。"
"10056005-57" = "[s] \"気にかけてくれてありがとね。\""
"10056005-58" = "[ns] \"……早速だけど、気になる生徒がいるんだ。\""
"10056005-59-ミナト" = "気になる、ですか？"
"10056005-60" = "（ミナトとアミに昨日のことについて話した）"
"10056005-61-ミナト" = "ああ、その口笛なら……。"
"10056005-62-アミ" = "おそらくはダイビング部の生徒ですね。"
"10056005-63" = "[s] \"ダイビング部？\""
"10056005-64-アミ" = "水中活動を担当している部活です。"
"10056005-65-アミ" = "先生がお聞きになったのは「磯笛」かと。#n独特の呼吸法なので、熟練ダイバーでないと難しいと聞きます。"
"10056005-66-アミ" = "それほどのフリーダイビングができる生徒となれば、#nこのオデュッセイアでも数えるほどしかいません。"
"10056005-67-ミナト" = "浅く短時間の潜水なら私たちにもできますが、ダイビング部はレベルが違うんですよ。"
"10056005-68" = "[s] \"すごいスキルだね……。\""
"10056005-69" = "[ns5] \"ダイビング部は普段なにをしてるの？\"\n[ns6] \"重要な仕事を任されてるのかな。\""
"10056005-70-ミナト" = "それが……その……。"
"10056005-71-ミナト" = "たしかに優秀ではあるのですが――"
"10056005-72-ミナト" = "隠し事が多いというか、協調性に欠けるというか……。"
"10056005-73-アミ" = "単刀直入に言えば、要注意部活なのですよ。"
"10056005-74-アミ" = "人見知りが激しいというのは置いておくとして……。"
"10056005-75-アミ" = "お金の流れに怪しい点がいくつもあるんです。"
"10056005-76" = "[s7] \"怪しい点って……。\"\n[s8] \"こっそり他の活動に使ってるとか？\""
"10056005-77-アミ" = "いえ、怪しいのは支出ではなく収入です。"
"10056005-78-アミ" = "ダイビング部が用いる器材は入手困難で高価なものばかり。#nですが、それを賄えるだけの収入源がありません。"
"10056005-79-アミ" = "漁業もしておらず、特別なスポンサーがいるわけでもない。#n……それでも、存続できている。"
"10056005-80-アミ" = "何か後ろ暗い収入を得ているのでは、という疑惑があるんです。"
"10056005-81" = "[s] \"具体的には……？\""
"10056005-82-アミ" = "水中で手に入る物には、ブラックマーケットで高額な取引をされている物も多くあります。"
"10056005-83-アミ" = "もしも彼女たちが[ruby=ちょうすい]「潮水[/ruby]の[ruby=こうりゅう]蛟龍」[/ruby]のような問題ある生徒と結託していたら――"
"10056005-84-ミナト" = "はいはい、暗い話はここまで。"
"10056005-85-ミナト" = "そんな話を突然されて、先生も困っているでしょう？"
"10056005-86-アミ" = "あ……失礼しました。"
"10056005-87" = "[s9] \"えっと、つまり……。\"\n[s10] \"ダイビング部の生徒が心配なんだよね？\""
"10056005-88" = "[ns] \"よければ私も話をしてみるよ。\""
"10056005-89-ミナト" = "……よろしいのですか？"
"10056005-90-ミナト" = "問題が表面化しているわけではないので本格的な調査も難しく……#nこれまで手を付けられずにいたんです。"
"10056005-91-ミナト" = "先生がお力を貸してくださるなら、とても助かりますが……。"
"10056005-92-アミ" = "いけません！先生はお忙しいんですから……！"
"10056005-93-アミ" = "どうか艦長の話はお気になさらないでください。#nこれはオデュッセイアの問題なので――"
"10056005-94" = "[s11] \"それでも、生徒の問題だよね？\"\n[s12] \"生徒の悩みを聞いてあげるのが先生の役目だから。\""
"10056005-95-アミ" = "そこまで仰るなら……お言葉に甘えて……。"
"10056005-96-ミナト" = "ふふっ。シャーレの先生……やはり噂どおりですね。"
"10056005-97-ミナト" = "では話を戻しますと――"
"10056005-98-アミ" = "ダイビング部は第3ターミナル東側の埠頭で器材の整備をしているはずです。"
"10056005-99-アミ" = "今すぐ出発されれば間に合うかと。"
"10056005-100-アミ" = "ちょ、ちょっと待って。今すぐ？"
"10056005-101-アミ" = "まだいいじゃないですか。#nほ、ほら。ちょうどここにある「お茶漬け」を召し上がってからでも――"
"10056005-102-アミ" = "それは「早く帰れ」というサインです。"
"10056005-103-アミ" = "おしゃべりはもう十分に楽しんだでしょう？#nそろそろ業務に戻らないと泣きを見ますよ。"
"10056005-104-アミ" = "うぅ……。"
"10056005-105-アミ" = "では先生、よろしくお願いいたします。"
"10056005-106-アミ" = "……ああ、それと1つアドバイスを。"
"10056005-107-アミ" = "イルカ科の海洋生物は好奇心旺盛ですが、同じくらいに警戒心も強いです。#n近づく際にはご注意ください。"
