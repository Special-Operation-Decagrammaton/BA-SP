[translation]
"10056040-1" = "第4話;危険なフジツボ"
"10056040-2-ココロ" = "まさか――"
"10056040-3-ココロ" = "船底掃除ですか！？"
"10056040-4" = "オデュッセイアの停泊地"
"10056040-5" = "[ns1] \"当たり。アイランドが頼みたがってたよ。\"\n[ns2] \"ダイビング部にしかできない、って。\""
"10056040-6-ココロ" = "たしかに私たちが適任ですが……。"
"10056040-7-ココロ" = "うぅ……船底掃除は嫌なんですぅ……。"
"10056040-8" = "[s] \"……困らせるようなお願いをしちゃったかな。\""
"10056040-9-ココロ" = "いえ……気持ちの問題なので……。#n難易度だけで言えば大したことではありません。"
"10056040-10-ココロ" = "その……臭いが、ちょっと……。"
"10056040-11-ココロ" = "でも、仕事を選り好みできる状況でもないですし……。"
"10056040-12-ココロ" = "みんな、覚悟はいい？"
"10056040-13-ココロ" = "作業はとにかく安全第一。必ず2人1組で潜って、お互いの状況を確認すること！"
"10056040-14-ココロ" = "陸との連絡手段は絶対に2つ以上を準備。#nブイの膨らみは事前に確認しておいて、念のためにナイフも用意してね。#n潜ってる間も、シリンダーの残圧は5分間隔で確認して――"
"10056040-15-コトネ" = "もー、心配しすぎ。こういうの、今まで何回やったと思ってるのさ。"
"10056040-16-コトネ" = "バディはいつも通りかな。私と部長、マキナとサユリで組めばいいね。"
"10056040-17-サユリ" = "グローブはめると手を動かしにくい……。"
"10056040-18-サユリ" = "部長、素手でいい？"
"10056040-19-ココロ" = "ダメ！船底は鋭いものがたくさんあるんだから！"
"10056040-20-ココロ" = "作業中に手を切って細菌に感染したら、ひどい場合は敗血症で高熱に苦しんだ挙句、#n臓器に障害が及ぶことも――"
"10056040-21-アミ" = "……なるほど。#nだから先生は、海中の作業について問い合わせをされたのですね。"
"10056040-22-アミ" = "ダイビング部の財務状況は案の定だったということですか。"
"10056040-23-アミ" = "まさか借金をしているとは……。"
"10056040-24-アミ" = "放置し続けていたら、ダイビング部はもちろん、#n学園としても苦境に立たされていたでしょう。"
"10056040-25-アミ" = "速やかに対応してくださり、ありがとうございます。"
"10056040-26" = "[s3] \"大したことはしてないよ。\"\n[s4] \"アミこそ、仕事を紹介してくれてありがとね。\""
"10056040-27-アミ" = "渡りに船だったので。"
"10056040-28-アミ" = "なにかと見過ごされがちですが、海と接する船底こそ最も大事な部分ですから。"
"10056040-29-アミ" = "手入れを怠れば事故の可能性も高まるので、定期的に乾ドックに入れて整備をするのですが……。"
"10056040-30-アミ" = "その方法は如何せん時間がかかるのです。"
"10056040-31-アミ" = "ですが、ダイビング部に手伝ってもらえるのなら手間が省けて大変助かります。"
"10056040-32-コトネ" = "……30分経過。"
"10056040-33-ココロ" = "このくらいなら良いかな。"
"10056040-34-ココロ" = "よし。今から1時間、休憩にしよう。"
"10056040-35-サユリ" = "くさ～い。"
"10056040-36-マキナ" = "サユリは臭いの好きでしょ？いつもイワシアイス食べてるじゃん。"
"10056040-37-サユリ" = "イワシとフジツボは臭さが違うの。"
"10056040-38-サユリ" = "お疲れ様。次は私とコトネが潜るね。"
"10056040-39-サユリ" = "ふぃー、疲れた……。"
"10056040-40" = "[ns] \"船底の掃除ってどんなことするの？\""
"10056040-41-アミ" = "付着したフジツボを剥がすんですよ。"
"10056040-42" = "[s] \"フジツボ？\""
"10056040-43-アミ" = "ええ。#nフジツボの幼生は海中を浮遊しているのですが、船の底に付着して成長していきます。"
"10056040-44-アミ" = "放っておくと金属の腐食や航行時の推進効率の低下につながるため、#n定期的な掃除が必要なんです。"
"10056040-45-アミ" = "特に今のように停泊している時は、フジツボがびっしり付着してしまいます。"
"10056040-46" = "[s] \"それは困ったね。\""
"10056040-47-アミ" = "ええ、本当にうんざりです。"
"10056040-48-サユリ" = "ねえ、マキナ。"
"10056040-49-サユリ" = "……グラインダーで、ガーって取っちゃダメ？"
"10056040-50-マキナ" = "スクレーパー以外は使うなって部長が言ってたよね？"
"10056040-51-サユリ" = "でもスクレーパーもグラインダーも原理は同じ。"
"10056040-52-サユリ" = "コードレスだから感電の心配もない。"
"10056040-53-マキナ" = "うーん……。"
"10056040-54-マキナ" = "まあ、いっか。効率を追求するのも作業の一環だし。"
"10056040-55-マキナ" = "じゃあ、グラインダー持ってきといて。"
"10056040-56-サユリ" = "オッケ～"
"10056040-57" = "[ns] \"フジツボは食べられないのかな？\""
"10056040-58-アミ" = "おすすめはしません。#n付着していた場所によっては、有害な化学物質や重金属を多く含んでいるんだとか。"
"10056040-59-アミ" = "それ以前に異臭が酷いので……。"
"10056040-60-アミ" = "船に付着したフジツボを見て喜ぶのは、海賊だけでしょうね。"
"10056040-61" = "[s] \"海賊？\""
"10056040-62-アミ" = "はい。"
"10056040-63-アミ" = "聞くところによれば、あの[ruby=ちょうすい]「潮水[/ruby]の[ruby=こうりゅう]蛟龍」[/ruby]もフジツボを脅迫に使っているらしく――"
"10056040-64-アミ" = "あ、失礼しました。"
"10056040-65" = "[s5] \"前から気になってたんだけど……。\"\n[s6] \"潮水の蛟龍って誰なの？\""
"10056040-66-アミ" = "……お恥ずかしい話ですが、我が校にも問題のある生徒がおりまして。"
"10056040-67-アミ" = "学校での更生は不可能だと判断し、ヴァルキューレの矯正局に引き渡したのです。"
"10056040-68-アミ" = "穏やかな波でも思いのままに操れることから、付いた呼び名が「潮水の蛟龍」。#n彼女には致命的な問題がありました。"
"10056040-69" = "[s] \"というと？\""
"10056040-70-アミ" = "他の生徒をそそのかし、自らを竜宮の――"
"10056040-71" = "ドカーン！"
"10056040-72" = "[ns7] \"い、今のは？\"\n[ns8] \"何かが爆発した……？\""
"10056040-73-マキナ" = "部長、大変！"
"10056040-74-ココロ" = "ふ、二人とも大丈夫？何があったの！？"
"10056040-75-サユリ" = "フジツボがエクスプロージョン……。"
"10056040-76-コトネ" = "爆発……フジツボが？"
"10056040-77-コトネ" = "まさか、スクレーパー以外の装備を使った？"
"10056040-78-マキナ" = "んと、それが……。"
"10056040-79-マキナ" = "スクレーパーじゃ限界があって、グラインダーを……。"
"10056040-80-コトネ" = "……マキナ。"
"10056040-81-マキナ" = "け、けどフジツボが爆発したのはホントなんだよ！"
"10056040-82-アミ" = "トライデント、今すぐ第7埠頭に応急工作チームを送ってください。"
"10056040-83-アミ" = "ええ、艦船下部エリアに穿孔発生です。損傷は軽微ですが……。"
"10056040-84-アミ" = "Z態勢に転換。全てのハッチとドアを遮断します。"
"10056040-85-ココロ" = "やっちゃったぁ……。"
