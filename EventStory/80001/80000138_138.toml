[translation]
"80000138-1" = "チョコメレンゲクッキー"
"80000138-2" = "（待ち合わせの時間よりも、早めに到着した）"
"80000138-3" = "（何となく周囲を見回していると――）"
"80000138-4-スバル" = "こんにちは、先生。"
"80000138-5-スバル" = "……もしかして、待たせてしまいましたか？"
"80000138-6" = "[s] \"ううん、今来たばっかりだから。\""
"80000138-7-スバル" = "「今」も何も……待ち合わせよりずいぶん早いですよ。"
"80000138-8" = "[s] \"その分スバルに、早く会えるかもなって思って！\""
"80000138-9-スバル" = "またそういうことを……。"
"80000138-10-スバル" = "噂の正体が、少しずつ分かってきました……。"
"80000138-11-スバル" = "ふふっ、そんな顔しても無駄です。#n私は騙されませんから。"
"80000138-12-スバル" = "それで、今日お呼び立てしたのは……。"
"80000138-13-スバル" = "その……。"
"80000138-14-スバル" = "……。"
"80000138-15-スバル" = "お世話に、なっていますから。"
"80000138-16-スバル" = "つまり……！"
"80000138-17" = "[ns] \"ここ、良いカフェだね。\""
"80000138-18-スバル" = "えっ？"
"80000138-19-スバル" = "ああ、はい。そう、ですね。#n最近はこういうところにも慣れてきました。"
"80000138-20-スバル" = "アルバイトを頑張っているからなのか……。"
"80000138-21-スバル" = "……言わなくても、分かってますよ。"
"80000138-22-スバル" = "勉強も大事、でしょう？#nそういうところは先生なんですから。"
"80000138-23-スバル" = "……とにかく！"
"80000138-24-スバル" = "……。"
"80000138-25-スバル" = "アルバイト中に聞いたんです。#n「外の世界」には、メレンゲクッキーというものがあると……。"
"80000138-26-スバル" = "……ああ。また、つい。"
"80000138-27-スバル" = "とにかく、卵白に砂糖を混ぜて、クリームのような泡を作り……。"
"80000138-28-スバル" = "それを100℃くらいで熱したお菓子のようなのですが。"
"80000138-29-スバル" = "……許せません！！！"
"80000138-30" = "[s] \"な、なんで！？メレンゲに罪は……！\""
"80000138-31-スバル" = "だって、残った卵黄は捨てると言うんですよ！#n罰当たりだと思いませんか！？"
"80000138-32" = "[s] \"あー……。\""
"80000138-33-スバル" = "ブランシールと呼ばれる卵黄を使う手法もあるそうですが、メレンゲに比べると使いどころが限られます。"
"80000138-34-スバル" = "それに、卵白よりも早く傷んでしまうので……#n結局は使い切れず、捨てることになりやすいとか。"
"80000138-35-スバル" = "卵黄にどんな罪があるというんですか……！#nそんな身勝手さ、許されてはいけません！"
"80000138-36-スバル" = "たとえ食べ物の神様が許そうとも、私は許しませんから！！"
"80000138-37-スバル" = "というわけで……廃棄されるはずの卵黄を貰っているんです。"
"80000138-38-スバル" = "砂糖と醤油に漬けて、アリウスの子たちに食べてもらったり……色々と試していまして。"
"80000138-39-スバル" = "にしても、酷いとは思いませんか？#n食べ物を粗末にするなんて、全く世も末です……！"
"80000138-40" = "[s] \"ま、まぁまぁ……！確かに食べ物は大事だよね！\""
"80000138-41-スバル" = "ご理解いただき、ありがとうございます……#nあれ、何の話でしたっけ？"
"80000138-42-スバル" = "……あぁ、メレンゲクッキーでしたね。"
"80000138-43-スバル" = "……先生。"
"80000138-44-スバル" = "「外の世界」……いえ。世間には、バレンタインデーというものがあると聞きました。"
"80000138-45-スバル" = "その日は……。"
"80000138-46-スバル" = "えっと……。"
"80000138-47-スバル" = "普段、お世話になっている人や……。"
"80000138-48-スバル" = "自分の気持ちを伝えたい人に……。"
"80000138-49-スバル" = "チョコレートを、プレゼントするんだとか。"
"80000138-50-スバル" = "それで、その……私も、用意してみたんです……！"
"80000138-51" = "[ns] \"すごい、こんなメレンゲクッキーが……！？\""
"80000138-52-スバル" = "メレンゲを作る時に、パウダーなどを混ぜるんです。"
"80000138-53-スバル" = "結局のところ私は、身体を使うほうが得意と言いますか……#nメレンゲを作るだけなら、ちょっとしたコツと、腕力さえあればいいので。"
"80000138-54-スバル" = "私にもできるかな、と思い……。"
"80000138-55-スバル" = "……もちろん、オーブンはアルバイト先から借りました。"
"80000138-56-スバル" = "口に出してみると、なんとも情けない話ですが。"
"80000138-57-スバル" = "……。"
"80000138-58-スバル" = "やはりよくよく考えてみると……こんなものを、先生にお出しするわけには……！"
"80000138-59-スバル" = "き、聞かなかったことにしてください！#nこれは、やはり……！"
"80000138-60" = "（クッキーを手に取ろうとしたスバルを、急いで止めた）"
"80000138-61" = "[ns1] \"「こんなもの」じゃないよ！\"\n[ns2] \"私はすごく嬉しい！\""
"80000138-62-スバル" = "……本当、ですか？"
"80000138-63" = "[s] \"本心だよ。\""
"80000138-64-スバル" = "食べた後で、文句なんて言わないでくださいよ？"
"80000138-65" = "[s] \"言わないよ、絶対。\""
"80000138-66-スバル" = "……分かりました。"
"80000138-67-スバル" = "信じます。"
"80000138-68-スバル" = "……ふふっ。"
"80000138-69" = "（そうしてスバルとメレンゲクッキーを一緒に食べながら、#n優しい時間を過ごした）"
