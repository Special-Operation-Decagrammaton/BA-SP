[translation]
"80000133-1" = "思い出す時まで"
"80000133-2" = "（シャーレで仕事をしていると……）"
"80000133-3-カノエ" = "ねぇ、先生……。"
"80000133-4" = "[s] \"カノエ、どうしたの？\""
"80000133-5-カノエ" = "イヒヒ……。"
"80000133-6-カノエ" = "私が連絡した理由……先生なら分かるよねぇ？"
"80000133-7-カノエ" = "先生と私は……運命の赤い糸で結ばれてるんだから……。"
"80000133-8" = "[s] \"もしかして……チョコレート？\""
"80000133-9-カノエ" = "……正解。"
"80000133-10-カノエ" = "それも普通のチョコレートじゃない、すごく可愛いチョコマフィンだよぉ……。"
"80000133-11-カノエ" = "特別な材料と、私の愛をたっぷり込めながら……釜で煮込んだの。"
"80000133-12-カノエ" = "どう、食べてみる……？"
"80000133-13" = "[s] \"もちろん！カノエの手料理は美味しいからね。\""
"80000133-14-カノエ" = "……やっぱりその返事。"
"80000133-15-カノエ" = "イヒッ、イヒヒヒッ……！"
"80000133-16" = "[s1] \"あっ……でもこの後、外回りの仕事があって。\"\n[s2] \"戻る頃に合流して、ゆっくり食べても良いかな？\""
"80000133-17-カノエ" = "……今がいい。"
"80000133-18" = "[s] \"30分くらいならあるけど、今から会いに行くと――\""
"80000133-19-カノエ" = "心配しないでぇ。"
"80000133-20-カノエ" = "そうだと思って……。"
"80000133-21-カラス" = "ガァッ！ガァァッ……！"
"80000133-22" = "[ns] \"こ、この音は……！？\""
"80000133-23-カノエ" = "……こうなるかと思って。"
"80000133-24-カノエ" = "イヒッ……これでも私、できる女だから。"
"80000133-25" = "[s] \"い、いつの間に！？\""
"80000133-26-カノエ" = "そんなことより、今重要なのは……。"
"80000133-27-カノエ" = "……私と先生が、ここにいるってこと。"
"80000133-28-カノエ" = "さぁ、目を閉じて……？"
"80000133-29" = "（その表情を前にして、カノエの言うことには抗えず……）"
"80000133-30" = "（静かに目を閉じる）"
"80000133-31-カノエ" = "イヒッ、少し待っててぇ……。"
"80000133-32-カラス" = "ガァッ！ガァァッ！"
"80000133-33-黒猫" = "ニャーオ！ンニャーオ！"
"80000133-34" = "[ns] \"……鳴き声が増えたような。\""
"80000133-35-カノエ" = "匂いで集まっちゃったの……？"
"80000133-36-カノエ" = "これは特別な、先生にあげるマフィンだから……。"
"80000133-37-カノエ" = "今は出ていってねぇ……君たちの分は、また今度。"
"80000133-38-カノエ" = "どうぞぉ、先生。目、開けてみて？"
"80000133-39-カノエ" = "先生……。"
"80000133-40" = "[ns3] \"な、何だか雰囲気が……。\"\n[ns4] \"可愛いカノエちゃんモード！？\""
"80000133-41-カノエ" = "はい……これ、私の気持ち。"
"80000133-42-カノエ" = "カノエ……どうしても先生に、チョコをあげたかったの。"
"80000133-43-カノエ" = "こうしていれば、きっと前世の記憶を思い出すはず。"
"80000133-44-カノエ" = "チョコを分け合った、あの思い出も……。"
"80000133-45-カノエ" = "だから、早く食べて。"
"80000133-46-カノエ" = "私の、特別なマフィン……！"
"80000133-47" = "[s] \"……！！\""
"80000133-48" = "（何かに取り憑かれたかのように、カノエのチョコマフィンを頬張った）"
"80000133-49-カノエ" = "どう、美味しい……？"
"80000133-50" = "[s] \"お、美味しすぎる……！\""
"80000133-51-カノエ" = "イヒッ……！"
"80000133-52-カノエ" = "流石は先生……喜んでくれると思った。"
"80000133-53-カノエ" = "……。"
"80000133-54-カノエ" = "……イヒ、イヒヒヒッ。"
"80000133-55-カノエ" = "私のを、取り込んでくれた……これで儀式は完了。"
"80000133-56-カノエ" = "これで先生は、ずっと私のもの……イヒヒヒッ！"
"80000133-57-カノエ" = "さぁ、言ってみて……私はだぁれ？"
"80000133-58-カノエ" = "先生にとって……前世の私は、どんな存在？"
"80000133-59" = "[ns5] \"か、可愛い子猫……！\"\n[ns6] \"お、お利口なカラス……！\""
"80000133-60-カノエ" = "……足りなかったかなぁ？"
"80000133-61-カノエ" = "それなら、思い出すまで食べてもらえば良いか……。"
"80000133-62-カノエ" = "こういうこともあると思って、たくさん作っておいたからぁ。"
"80000133-63" = "（そうしてカノエとチョコマフィンを食べながら、楽しい時間を過ごしたが……）"
"80000133-64" = "（……前世の記憶は思い出せなかった）"
"80000133-65-カノエ" = "大丈夫……。"
"80000133-66-カノエ" = "もう少し、もう少しで……。"
"80000133-67-カノエ" = "イヒッ……イヒヒヒッ！"
