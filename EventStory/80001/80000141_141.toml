[translation]
"80000141-1" = "完璧な計画（仮）"
"80000141-2" = "[ns] \"おはよう、ケイちゃん！\""
"80000141-3-ケイ" = "はぁ……。"
"80000141-4" = "[s1] \"ため息！？\"\n[s2] \"そんなケイちゃんも良いね！\""
"80000141-5-ケイ" = "全く……。"
"80000141-6-ケイ" = "……。"
"80000141-7-ケイ" = "どうして私は……。"
"80000141-8-ケイ" = "……。"
"80000141-9-ケイ" = "……とにかく用事を済ませて、すぐ帰りますから。"
"80000141-10-ケイ" = "はい、どうぞ。"
"80000141-11" = "[ns] \"こ、これは……！？\""
"80000141-12-ケイ" = "……さっき、その辺で拾いました。"
"80000141-13-ケイ" = "そして偶然シャーレが近かったので。"
"80000141-14-ケイ" = "バレンタインだからってまさか、手作りや高級チョコなんてものを期待してはいませんよね？"
"80000141-15-ケイ" = "あり得ません。#n先生には、拾った市販のチョコで十分です。"
"80000141-16-？？？" = "（それでも嬉しいよ！と言おうとしたものの）"
"80000141-17" = "（それでも嬉しいよ！と言おうとしたものの）"
"80000141-18" = "（よく見てみると……）"
"80000141-19" = "[ns] \"……ん？\""
"80000141-20-ケイ" = "ど、どうかしましたか？#nただの安いチョコなんですから、早く食べてしまってください。"
"80000141-21" = "[ns] \"これ……。\""
"80000141-22" = "[ns3] （お店の包装には見えないような？）\n[ns4] （チョコレートの形が、量産品とは思えないような……）\n[ns5] （市販品とはどこか違った香りが感じられる）"
"80000141-23" = "（とにかく、チョコを口に入れてみた）"
"80000141-24-ケイ" = "……な、なんですか？"
"80000141-25" = "[s] \"ありがとね、ケイちゃん。\""
"80000141-26-ケイ" = "い、いったい何の話でしょう。"
"80000141-27" = "[ns] \"わざわざ作ってくれたんだ。\"\n[ns] \"すごく塩の主張が強くて……これはこれで美味しいね！\""
"80000141-28-ケイ" = "……？"
"80000141-29-ケイ" = "……！？！？"
"80000141-30-ケイ" = "はっ！？！？！？！？"
"80000141-31" = "（ケイはダッシュして飛び込み、ソファのクッションに顔をうずめた）"
"80000141-32" = "（何だかダチョウの動きみたいで可愛い）"
"80000141-33-ケイ" = "わ～っ！！！#nうわああああ～～～～っ！！！"
"80000141-34-ケイ" = "あ、あり得ませんあり得ません、あり得てはいけません！#nせめて味見さえしていれば……っ！！！"
"80000141-35-ケイ" = "と、途中まで完璧なっ！#n完璧な計画だったのにっ！！！"
"80000141-36" = "[ns] \"えーっと……今からでも味見、してみる？\""
"80000141-37-ケイ" = "ちょっと黙っててください！！！"
"80000141-38" = "（ケイは　ぜんりょくで　クッションを　なげた！）"
"80000141-39" = "（せんせいは　ひっしに　よけた！）"
"80000141-40-ケイ" = "……返してください。"
"80000141-41" = "[s] \"せっかくの手作りチョコなのに……。\""
"80000141-42-ケイ" = "良いから返しなさい！#n今度ちゃんとしたのをあげますから！！"
"80000141-43-ケイ" = "な、何でそれに固執するんですか、絶対美味しくないのに……。"
"80000141-44-ケイ" = "世界に一つだけ、だから……？"
"80000141-45-ケイ" = "！！！"
"80000141-46-ケイ" = "～～～～～っっ！！！"
"80000141-47" = "（必死にケイから逃げつつ、もう一口食べた）"
"80000141-48" = "[ns] \"勘違いしないで、ケイちゃん。本当に美味しいんだよ。\""
"80000141-49-ケイ" = "えっ……？"
"80000141-50" = "[s] \"……塩は効いてるけど、それがまた良い。\""
"80000141-51-ケイ" = "今度こそ、先生を殺して――"
"80000141-52" = "[s] \"まさか――\""
"80000141-53-ケイ" = "私も死にます！！！！！！"
"80000141-54-ケイ" = "もう話しかけないでください、嫌いです。"
"80000141-55-ケイ" = "……？"
"80000141-56-ケイ" = "違う、使い道……？"
"80000141-57-ケイ" = "それはどういう……。"
"80000141-58-ケイ" = "甘いものと食べると無限ループする……？"
"80000141-59-ケイ" = "外が暑いと塩分補給もできて一石二鳥……？"
"80000141-60-ケイ" = "……。"
"80000141-61-ケイ" = "それで慰めてるつもりですか！？！？"
"80000141-62-ケイ" = "……はぁ。"
"80000141-63-ケイ" = "……いえ、これは私のミスです。"
"80000141-64-ケイ" = "とにもかくにも、味見さえしていれば……！！"
"80000141-65" = "[s] \"ありがとね、ケイ。\""
"80000141-66-ケイ" = "……何がですか。しょっぱいことがですか。"
"80000141-67" = "[s] \"嬉しかったのは本当だから。\""
"80000141-68-ケイ" = "なら、許します……。"
"80000141-69-ケイ" = "……ふふっ。"
"80000141-70" = "（隠していた甘いお菓子を取り出し、ケイと一緒に味わった）"
"80000141-71" = "（予想以上の相性で、あっという間に平らげてしまった）"
"80000141-72" = "（チョコはもちろんのこと……）"
"80000141-73" = "（ケイの色んな表情を見られたことも、嬉しかった）"
