[translation]
"80000137-1" = "ラブ博物館に行かなくちゃ！"
"80000137-2" = "（シャーレで仕事をしていると、ラブの気配を感じた）"
"80000137-3" = "（あそこへ行ってみよう）"
"80000137-4" = "シャーレ付近の路地裏"
"80000137-5-ラブ" = "……ん、良し。"
"80000137-6-ラブ" = "あ、でもその前に髪の毛を……。"
"80000137-7" = "[ns1] \"ラブ！\"\n[ns2] \"ラブだーーーーっ！\""
"80000137-8-ラブ" = "うわあっ！？#nビックリしたぁ！！"
"80000137-9-ラブ" = "やめてよね！#n奇襲かと思ったじゃない！？"
"80000137-10-ラブ" = "って、何してんのよこんなとこで。仕事は？"
"80000137-11" = "[s] \"ラブの気配を感じたから！\""
"80000137-12-ラブ" = "何それどうい……やっぱり良いわ、聞かない方が良さそう。#nというか、喜びすぎじゃない？"
"80000137-13-ラブ" = "まぁ、ちょうど良かったわ。"
"80000137-14-ラブ" = "こっちも渡したいものがあったから。"
"80000137-15" = "[s3] \"手編みの帽子とか？\"\n[s4] \"交換日記とか？\"\n[s5] \"中学の卒業アルバムとか？\""
"80000137-16-ラブ" = "なんでそんな物を欲しがるのよ！？"
"80000137-17-ラブ" = "今日が何の日か知らないわけ……？#nったく、どれだけ忙しいのよ。"
"80000137-18-ラブ" = "心配させな……じゃなくてはい、これ！"
"80000137-19-ラブ" = "コンビニで買ったやつだけど我慢して。"
"80000137-20-ラブ" = "手作りを渡すほどの余裕も、自信もなかったし……。"
"80000137-21-ラブ" = "さっき買った先生の分は、っと……これは私のだから……あむ……。"
"80000137-22-ラブ" = "んむっ、んん……ぇー、ろこにいっはおはひら……。"
"80000137-23-ラブ" = "……ん、はふぇっ？"
"80000137-24" = "[s6] \"どこか痛めた！？\"\n[s7] \"熱！？\"\n[s8] \"お腹空いた！？\" "
"80000137-25-ラブ" = "あふぁっ、あふぉっ！！#nっ、チョコ咥えてんだから、返事できるわけないでしょ！"
"80000137-26-ラブ" = "二つ買ったはずなんだけど、見つからないのよ。"
"80000137-27-ラブ" = "さっき絡まれた時に、落としちゃったとか……？"
"80000137-28" = "[s] \"大丈夫、気持ちだけでも嬉しいよ！\""
"80000137-29-ラブ" = "ダメよ、せっかくのバレンタインデーだもの。"
"80000137-30-ラブ" = "んー……。"
"80000137-31-ラブ" = "噛んじゃったけど、これ分けっこする感じでも良い？"
"80000137-32-ラブ" = "あっ、ちょっとうち手が汚れてるから、お願いできる？"
"80000137-33-ラブ" = "簡単にパキッと割れるはずだから。"
"80000137-34" = "[ns] \"任せて！\""
"80000137-35-ラブ" = "あーあ……ちゃんと渡したかったのに。"
"80000137-36-ラブ" = "はい、てきとうに半分に割っ――"
"80000137-37-ラブ" = "……。"
"80000137-38-ラブ" = "仕事の連絡じゃないの？"
"80000137-39" = "[s] \"あっ……本当だ。\""
"80000137-40-ラブ" = "ほら、早く行きなさいよ。"
"80000137-41-ラブ" = "誰かが困ってるんでしょう？"
"80000137-42" = "[s] \"ごめんね、ラブ……また絶対、遊びに来て！\""
"80000137-43-ラブ" = "ああもう分かったから！#nちゃんと前向いて走りなさい！危ないでしょ！？"
"80000137-44-ラブ" = "……まったくもう。"
"80000137-45-ラブ" = "……次、か。"
"80000137-46-ラブ" = "まぁ、また時間ができた時にでも……。"
"80000137-47-ラブ" = "さてと……自販機でも探しに行こうかしら。"
"80000137-48-ラブ" = "あれ？#nチョコは……。"
"80000137-49-ラブ" = "さっきまで、たしか先生が……。"
"80000137-50-ラブ" = "……ぜ、全部持ってっちゃった！？"
