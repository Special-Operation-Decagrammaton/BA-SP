[translation]
"10001105-1" = "第10話;返り咲く革命のイワン・クパーラ"
"10001105-2" = "レッドウィンター連邦学園・事務局"
"10001105-3-チェリノ" = "来た、見た、勝ったぁ！"
"10001105-4-チェリノ" = "トモエ、カムラッド！見たか？おいらの完璧な作戦で敵を粉砕するところを！"
"10001105-5-トモエ" = "はい。本当に完璧な指揮でした、チェリノ会長！"
"10001105-6-トモエ" = "それぞれ異なる所属の生徒たちを統一し、敵陣に向かって突き進むチェリノ会長……あのお姿はきっと生徒たちの心に深く刻み込まれ、レッドウィンター連邦学園の歴史の1ページとして永遠に語り継がれることでしょう。"
"10001105-7-トモエ" = "せっかくですし、後世の生徒たちもそのお姿が見られるように、画家を呼んで戦争画を描かせましょうか？"
"10001105-8-チェリノ" = "ふむ。良い考えだな、トモエ秘書室長！すぐに進めるように！"
"10001105-9" = "[s] \"あれって、適当に叫んでるわけじゃなかったんだ……？\""
"10001105-10-チェリノ" = "何を言ってるんだ、カムラッド！#nあれは士気を高めるための、勇敢なる戦場の叫び！「ウォークライ」というやつだ！"
"10001105-11-チェリノ" = "もしあの声が愚図る子供の泣き声のようにでも聞こえたというのなら、お前の耳に問題があるに違いない！手配してやるから、すぐに病院に行って耳の治療を受けてこい！"
"10001105-12-チェリノ" = "ふう……とにかく、また事務局に戻れて良かった。"
"10001105-13-チェリノ" = "棚はおやつでいっぱいだし、玉座はフカフカだし、家に帰ってきたみたいにホッとする……。やはり我が執務室は、こうでないと！"
"10001105-14-チェリノ" = "こうなったら今日は、この玉座に座ってポテトチップスを食べて、もう一歩も動かないぞ！"
"10001105-15-チェリノ" = "だがその前に……クーデターについて、言い訳でも聞こうか？マリナ委員長？"
"10001105-16-マリナ" = "ううっ……。"
"10001105-17-チェリノ" = "マリナ、おいらが今までお前をどれだけ大切にし、信頼していたか……それなのに、よくもおいらの昼寝の時間を狙ってクーデターを起こしたな！"
"10001105-18-チェリノ" = "許さないぞ！"
"10001105-19-マリナ" = "面目次第もございません、チェリノ会長……。"
"10001105-20-チェリノ" = "うむ、うむ！"
"10001105-21-チェリノ" = "それで、おいらに反旗を翻した本当の理由はなんだ？"
"10001105-22-チェリノ" = "……やっぱりおいらがあの時、マリナのプリンをこっそり盗み食いしたことで、腹を立てたのか？"
"10001105-23-チェリノ" = "それとも、マリナが大事にしている熊のぬいぐるみを、こっそり枕に使ったからか……？"
"10001105-24-マリナ" = "……プリン？熊のぬいぐるみ？何のことでしょうか……？"
"10001105-25-チェリノ" = "お、思い出せないならそれでいいのだ！"
"10001105-26-チェリノ" = "（あ、危ないところだった。危うくマリナが覚えてもいないことを、自分の口から白状するところだった！）"
"10001105-27-チェリノ" = "……おっほん！"
"10001105-28-チェリノ" = "それではプリンでも熊のぬいぐるみでもないなら、どんな理由でクーデターを起こしたのだ？"
"10001105-29-マリナ" = "あの、それは……実はチェリノ会長の石像を不注意で割ってしまって……。"
"10001105-30-チェリノ" = "石像？何の石像だ？"
"10001105-31-マリナ" = "新館の廊下にある、会長の石像です。先月、新館の増築を記念して、チェリノ会長の謹厳なお姿を石像にしてあそこに設置しました。"
"10001105-32-チェリノ" = "（そ、そんな石像あったか……？確かにあったような気も、する……？）"
"10001105-33-マリナ" = "しかし、不注意でその石像にぶつかって、お顔の髭の部分が割れてしまい……会長の権威をこの手で失墜させてしまいました。"
"10001105-34-マリナ" = "故意ではなかったとはいえ、きっと会長にはお許しいただけないだろうと思い、それで……。"
"10001105-35-チェリノ" = "なんだ、そんな理由でクーデターを起こしたのか。"
"10001105-36-マリナ" = "え？そんな理由、とは……。"
"10001105-37-チェリノ" = "マリナ、お前はレッドウィンター連邦学園における事務局の保安委員長であり、我が忠実な右腕として、今までたくさんの仕事をこなしてきた。"
"10001105-38-チェリノ" = "いくらおいらが有能だとしても、お前がいなかったら今のこの座までは登れなかっただろう。お前を失うことに比べたら、石像の髭が割れるぐらい些細な問題だ。"
"10001105-39-チェリノ" = "おいらは寛容だからな――そんな些細なことで粛清は下さないのだ。はははははっ！"
"10001105-40-マリナ" = "会長……！"
"10001105-41-チェリノ" = "……とでも言うと思ったか！！"
"10001105-42-チェリノ" = "えっ、うわっ！？"
"10001105-43-チェリノ" = "お前のせいでおいらがここしばらく、どれだけ苦労をしたと思う？昼寝もできないし、おやつも食べられない！生徒たちにはチビと言われるわ無視されるわ！"
"10001105-44-チェリノ" = "石像のことはどうでもいいが、クーデターを起こしたことについては許さない！"
"10001105-45-マリナ" = "チェ、チェリノ会長！どうかお許しを！"
"10001105-46-チェリノ" = "ダメだ！絶対に許してたまるものか！"
"10001105-47-チェリノ" = "トモエ、今すぐマリナと親衛隊の連中を連れていき、一か月間トイレ掃除の刑に処するように！"
"10001105-48-チェリノ" = "さあ、それでは粛清のパレードを始めるとしよう！"
"10001105-49" = "事件から一週間後、「イワン・クパーラ」当日"
"10001105-50" = "レッドウィンター連邦学園・正門"
"10001105-51-トモエ" = "おかえりなさいませ、先生。"
"10001105-52-トモエ" = "チェリノ会長が中でお待ちです。"
"10001105-53-トモエ" = "こちらへ……。"
"10001105-54" = "レッドウィンター連邦学園・会長執務室"
"10001105-55-チェリノ" = "ふっふっふ。ようこそ、カムラッド。#n絶好のお祭り日和だな。"
"10001105-56" = "[s] \"うん、良かったね。\""
"10001105-57-チェリノ" = "レッドウィンター連邦学園のめでたいお祭りを、こうやってカムラッドと過ごせることは、私としても大変喜ばしい。"
"10001105-58-チェリノ" = "本来レッドウィンター連邦学園の「イワン・クパーラ」には、外部の者は入れない原則だったのだが……。"
"10001105-59-チェリノ" = "カムラッドには、この前の事件で多大な迷惑をかけたこともあるからな。生徒会長の権限で特別に招待したのだ。誇りに思うといい！ははは！"
"10001105-60-チェリノ" = "ところで別件なのだが、カムラッド。#n一週間前と比べて、何か変わったようには見えないか？"
"10001105-61" = "[s] \"何だか学園全体が綺麗になった気がするね。\""
"10001105-62-チェリノ" = "ふむ、それはマリナと保安委員たちが毎日頑張って学校を掃除してるからだろう。"
"10001105-63-チェリノ" = "最初はトイレ掃除だけを任せようと思っていたのだが、想像以上に素晴らしい掃除の才能を見せてな。"
"10001105-64-チェリノ" = "このままだと清掃部部長の職位を奪われてしまわないか、怖いぐらいだ。"
"10001105-65-チェリノ" = "……って、学校の見た目の話ではない！#nおいらに何か変わったことはないかと聞いてるのだ！"
"10001105-66" = "[s] \"身長がちょっと伸びた気がする。\""
"10001105-67-チェリノ" = "そ、そ、それは本当か！？カムラッド！"
"10001105-68-チェリノ" = "メジャーを持ってこい！今すぐに身長を測ろう！"
"10001105-69-チェリノ" = "……なんだ、ちっとも伸びていないじゃないか。#nおいらをからかってるのか、カムラッド！"
"10001105-70-チェリノ" = "いくらシャーレの先生とはいえ、この偉大なチェリノ様をからかうなんて本来は許されないことなんだぞ！"
"10001105-71-チェリノ" = "もちろん身長も重要だが……。"
"10001105-72-チェリノ" = "おいらが最初に言おうとしたのは、主に内面の変化のことだ。"
"10001105-73-チェリノ" = "この前の騒動の後、おいらは今まであまり気にかけてこなかった、レッドウィンター連邦学園の生徒たちの苦情に、耳を傾けるようになった。"
"10001105-74-チェリノ" = "トモエ秘書室長の話によれば、生徒たちの苦情に耳を傾け、共感し、解決策を約束するおいらの姿は「まるで先生がお仕事されている時の姿のようだった」、とのことで……。"
"10001105-75-チェリノ" = "先生の仕事とは、すなわち大人の仕事！凡百の生徒にはなかなかできない難しいことだ！"
"10001105-76-チェリノ" = "つまり、おいらはあの騒動を通じて、今までにないくらい大人の階段を上ったということだな！"
"10001105-77-チェリノ" = "どうだ、カムラッド。以前と違って、おいらの内面から湧き出るような、大人の魅力が感じられないか？ふふふ……！"
"10001105-78" = "[s] \"ちなみに、他の生徒たちに言った約束は、全部守ったの？\""
"10001105-79-チェリノ" = "ん、ん……？や、約束？"
"10001105-80-チェリノ" = "それは、えっと……今すぐゲヘナ学園やトリニティ総合学園を攻撃するのは、やっぱり難しいし……。"
"10001105-81-チェリノ" = "それに227号特別クラスのやつは、あの後またおいらのことをチビと呼んだのだ！#n不敬罪に当たるから、やっぱり今すぐに復帰は認められない！"
"10001105-82-チェリノ" = "約束は保留！しばらくはこのまま現状維持だ！"
"10001105-83-チェリノ" = "とにかく、カムラッド。今日は時間も十分にあるし、その、おいらと一緒に――"
"10001105-84-トモエ" = "チェリノ会長、大変です！"
"10001105-85-チェリノ" = "……なんだ、トモエ秘書室長。#nカムラッドと二人っきりで話している時は邪魔をするなと言っただろう！"
"10001105-86-トモエ" = "それが、緊急事態でして……旧校舎の「227号特別クラス」の生徒たちが、前回の約束を守れと事務局に押し寄せてきています！"
"10001105-87-トモエ" = "その上、「知識解放戦線」と「工務部」の生徒たちも一緒になって……。"
"10001105-88-チェリノ" = "なに？忍耐力の無いやつらめ！#n騒ぎが収まったばかりというのに、お祭りが終わる前からまた次のクーデターか！"
"10001105-89-チェリノ" = "マリナ保安委員長と親衛隊を送れ、クーデターを鎮圧させろ！"
"10001105-90" = "その、マリナ委員長は一晩中トイレ掃除をしていたせいでお疲れでして……戦える状態ではありません。"
"10001105-91-トモエ" = "親衛隊のメンバーもほとんど、前回の粛清で追い出されているか、謹慎中の身でして……。"
"10001105-92-チェリノ" = "なんだ、となると……また逃げないといけないのか！？せっかくゆっくりできると思ったのに、今度はどこに逃げろと言うんだ！？"
"10001105-93-チェリノ" = "もう失脚はこりごりだあぁぁぁーーーーー！"
"10001105-94" = "革命のイワン・クパーラ"
