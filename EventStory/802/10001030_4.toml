[translation]
"10001030-1" = "第3話;旧校舎の裏の姿、227号特別クラス"
"10001030-2" = "レッドウィンター連邦学園・雪山"
"10001030-3-チェリノ" = "うう、もう1時間は歩いたはずなのに……"
"10001030-4-チェリノ" = "旧校舎はおろか、建物ひとつ見えてこないじゃないか！"
"10001030-5-チェリノ" = "あとどれぐらい歩けば、旧校舎に着くんだ？"
"10001030-6-トモエ" = "レッドウィンター連邦学園の敷地は、キヴォトスの学園の中でもかなり広いですし……敷地の外郭近くまで歩いていくには、もう少しかかります。"
"10001030-7-チェリノ" = "うう……もう無理なものは無理！"
"10001030-8-チェリノ" = "足が痛くて一歩も歩けないっ！"
"10001030-9-トモエ" = "それでは、少し休むとしましょうか？"
"10001030-10-チェリノ" = "……いや、その必要はない。おいらに良い手がある！"
"10001030-11-チェリノ" = "カムラッド、おんぶだ！"
"10001030-12" = "[s1] チェリノをおんぶする。\n[s2] 聞こえないふりをする。"
"10001030-13-チェリノ" = "知らんぷりするな！粛清するぞ！？"
"10001030-14-チェリノ" = "例えおんぶしてくれなくても、無理やりしがみついておんぶさせてやるからな！"
"10001030-15-チェリノ" = "う、ううっ……お、思ってたより目線が高くて怖い……。"
"10001030-16-チェリノ" = "だが、さっきよりもずっと遠くまで見えるし、空気もきれいな気がする！"
"10001030-17-チェリノ" = "これが、マリナやトモエが見ている世界なのか……。"
"10001030-18-トモエ" = "あら、素敵な姿ですね！"
"10001030-19-トモエ" = "まるで木にぶら下がる猿のようで可愛……いえ、威厳で溢れています！"
"10001030-20-チェリノ" = "そ、そうか？えへへ……。"
"10001030-21-トモエ" = "記念に、写真を撮ってもよろしいですか？"
"10001030-22-チェリノ" = "いくらでも撮るが良い！この状態なら、同じ画面に収まらないなんて心配もないからな！"
"10001030-23-トモエ" = "見てください、チェリノちゃん。先生におんぶしてもらったおかげで、まるで背が高い感じに写ってますよ！"
"10001030-24-チェリノ" = "どれどれ……"
"10001030-25-チェリノ" = "おお、本当だ！"
"10001030-26-チェリノ" = "ふふ、これは良いな。#n事務局に戻ってからも、ずっとこうやっておんぶしてもらったまま仕事をすることにしよう。"
"10001030-27-チェリノ" = "そうすれば、おいらが小さいからって無視するような生徒たちもいなくなるに違いない……ははは！"
"10001030-28-トモエ" = "素敵なアイディアかと思います、チェリノ会長。"
"10001030-29-トモエ" = "会長が、誰かにおんぶしてもらったまま厳かに指示を出す……なんてことになったら、生徒たちもきっと驚きを隠せないでしょう。"
"10001030-30-トモエ" = "だろう？事務局に帰ったらすぐマリナにおんぶしてもらうように言おう！"
"10001030-31-チェリノ" = "もちろんその前に、マリナはクーデターを起こした罪で厳しく粛清しなければならないがな！"
"10001030-32-チェリノ" = "一か月間、ウサギの飼育場でエサやりでもやらせようか。#n……いや、ウサギは可愛いから罰にならない！もっと、もっと恐ろしい罰を与えねば……。"
"10001030-33" = "[ns] \"ちょっと疲れてきたかも……。\""
"10001030-34-トモエ" = "あら、先生？どこか具合でも悪いのですか？"
"10001030-35-トモエ" = "まさか……羽よりも軽い会長を背にして、「重い」だなんてことは言いませんよね？"
"10001030-36-トモエ" = "それに、シャーレの先生ともあろう御方が、足を痛めた会長を放り出してしまうなんてこともしませんよね？"
"10001030-37" = "[s] \"が、頑張るね……。\""
"10001030-38-チェリノ" = "何をダラダラしているのだ、カムラッド。こうしてる間にも、マリナが追いついてくるかもしれないんだぞ！"
"10001030-39-チェリノ" = "早く足を動かせ、旧校舎に向かうのだ！"
"10001030-40-チェリノ" = "さあ、行くぞ！"
"10001030-41" = "その後、1時間近くチェリノを背負ったまま山道を歩いた……。"
"10001030-42" = "レッドウィンター連邦学園・旧校舎"
"10001030-43-トモエ" = "やっと到着しましたね、会長。"
"10001030-44-トモエ" = "旧校舎……今はもうほとんど使われていませんが、かつてはレッドウィンター連邦学園の生徒たちが勉学に励みながら青春を過ごした、名高い場所です。"
"10001030-45-チェリノ" = "その割には、ボロくて汚いただの廃墟にしか見えないが……。"
"10001030-46-チェリノ" = "なんだか雰囲気も暗いし、熊でも出てきそうだ。"
"10001030-47-チェリノ" = "トモエ、本当にしばらくの間ここで過ごすつもりなのか？"
"10001030-48-トモエ" = "もちろん、いつかはまた事務局に戻らないといけません。"
"10001030-49-トモエ" = "しかし、こうしてマリナ委員長から追われている間は、おいそれと戻るわけにはいかないですし……。"
"10001030-50-トモエ" = "ですが、チェリノ会長が一生懸命協力してくだされば、きっとすぐに帰れると思います！"
"10001030-51-チェリノ" = "そ、そうか？"
"10001030-52-チェリノ" = "やっぱりおいらの力がなければ、何も解決できないということだな！"
"10001030-53-チェリノ" = "よし、それではここをおいらたちの新たな拠点として、事務局を取り戻すとしよう！"
"10001030-54-？？？" = "誰ですか！勝手にそんなことを決めているのは！"
"10001030-55-チェリノ" = "っ！？そ、そっちこそ誰だ！こんな辺鄙な所に、ま、まさか熊か！？"
"10001030-56-ノドカ" = "く、熊！？どこかに熊がいるんですか！？"
"10001030-57-シグレ" = "落ち着いて、ノドカ。ただ怯えたチェリノ会長が勘違いしただけ。"
"10001030-58-チェリノ" = "だっ、誰が怯えているだと！？"
"10001030-59-チェリノ" = "それよりお前たちは……。"
"10001030-60-ノドカ" = "ふう、ようやく私たちのことを思い出しましたか？"
"10001030-61-チェリノ" = "……誰だ？"
"10001030-62-ノドカ" = "ほっ、本当に私たちのことを忘れたんですか！？信じられません！"
"10001030-63-ノドカ" = "この過酷な環境の旧校舎で、大変な毎日に耐えながら、いつかまたチェリノ会長が新校舎に呼び戻してくれるはずと信じて待ってたのに！"
"10001030-64-チェリノ" = "そうは言っても、本当に思い出せなくてな……。"
"10001030-65-チェリノ" = "トモエ秘書室長、旧校舎で活動してる部活なんてあったのか？"
"10001030-66-トモエ" = "公的には存在しませんが旧校舎には、「227号特別クラス」という、レッドウィンター連邦学園内で停学処分を受けた生徒たちが、一時的に生活を送るための施設としての側面があります。"
"10001030-67-チェリノ" = "一時的な施設？#nならどうして、こいつらは新校舎に戻らずに、ずっとここにいるんだ？"
"10001030-68-トモエ" = "会長の許可無しには戻れませんので、その命令が下るのをずっと待っていたのかと。"
"10001030-69-チェリノ" = "……あ、思い出した！いつだったか、校内でこっそりカムラッドのあれやこれやを望遠鏡で覗き見しているのがバレて、停学になったあの変態ストーカーだな？"
"10001030-70-チェリノ" = "事務局のことが色々と忙しすぎて忘れていたが、そんなこともあったな……。"
"10001030-71-ノドカ" = "人を凍える北の地に追い出しておいて、「忘れていた」だなんて！#n無責任すぎます！"
"10001030-72-ノドカ" = "私たちがここで生き残るために、どれだけ大変な思いをしていたのかご存知ですか？"
"10001030-73-ノドカ" = "おやつはもちろん、お腹を満たせるほどの食事すらまともに配給されず！"
"10001030-74-シグレ" = "この極寒をしのげるまともな暖房器具も無いし。"
"10001030-75-ノドカ" = "夜は布団から虫が出てきて！"
"10001030-76-シグレ" = "ある時は、飢えた熊が校舎の中を徘徊したりもするし？"
"10001030-77-チェリノ" = "な、なに？本当に熊が出るのか？"
"10001030-78-チェリノ" = "と、トモエ、やっぱりこの旧校舎はダメだ。ほ、他の場所を探さないか？"
"10001030-79-トモエ" = "ダメですよチェリノちゃん。こういう時こそレッドウィンター連邦学園の指導者らしく、威厳のある態度を見せないとです。"
"10001030-80-チェリノ" = "でも……熊、怖い……。"
"10001030-81-ノドカ" = "それはともかく、こうやってチェリノ会長が直接来てくださったということは、もう私たちは旧校舎から出られるってことですか？"
"10001030-82-チェリノ" = "いや、それは……。"
"10001030-83-トモエ" = "残念ですが今の私たちには、みなさんの措置を取り消してあげられる権限がありません。"
"10001030-84-ノドカ" = "ど、どうしてですか！？"
"10001030-85-トモエ" = "チェリノ会長は今、クーデターで生徒会長の座から失脚してしまい、逃げている途中なんです。"
"10001030-86-チェリノ" = "これも全てマリナのせいだ！あいつがクーデターさえ起こさなければ、おいらが事務局から脱出してこんな汚い場所に来ることもなかったのに！"
"10001030-87-チェリノ" = "なんだ……ということは、今のチェリノ会長は何の権力もないただのちびっ子ってことですよね？"
"10001030-88-ノドカ" = "……ぬか喜びして損しました。"
"10001030-89-チェリノ" = "ううっ！誰がちびっ子だ！"
"10001030-90-チェリノ" = "いくら一時的に生徒会長としての権力を失ったとはいえ、おいらはレッドウィンター連邦学園の書記長であり、環境美化部部長であり、清掃部部長で……様々な職責を任されている偉大なチェリノ様なのだ！"
"10001030-91-チェリノ" = "この権威の象徴である髭が見えないのか！"
"10001030-92-ノドカ" = "そんな偽物の髭、誰も権威だと思ってませんよ！"
"10001030-93-チェリノ" = "な、なに……っ！？"
"10001030-94-チェリノ" = "（ひそひそ）ト、トモエ。この髭が偽物だということを、なぜこいつらが知っているのだ？"
"10001030-95-トモエ" = "ノドカちゃんはきっと、当てずっぽうで言っているだけでしょう。気にしなくて大丈夫ですよ。"
"10001030-96-ノドカ" = "そ、そうか！何も知らないくせに勝手なことを口にするな、このエロガキめ！"
"10001030-97-ノドカ" = "休日のたびに高い所に登って、望遠鏡で先生のことを覗きながらハアハア興奮する変態のくせに！"
"10001030-98-ノドカ" = "だ、誰がエロガキですか！？"
"10001030-99-ノドカ" = "そう言ってるチェリノ会長こそ、この旧校舎に来るまでの間、ずっと先生におんぶされてたじゃないですか！？"
"10001030-100-ノドカ" = "羨ましい……！"
"10001030-101-ノドカ" = "チェリノ会長の方が、もっとエロガキですよ！"
"10001030-102-チェリノ" = "あ、あれはおいらとカムラッドの絆ゆえの行為に過ぎない！そう思うお前の方こそエロガキだ！"
"10001030-103-チェリノ" = "少なくともおいらはストーキングなどしていない！"
"10001030-104-ノドカ" = "ストーキングだなんて！あれは先生を尊敬するゆえの、生徒として至って自然な行いです！"
"10001030-105-ノドカ" = "私より背も小さいチビのくせに！"
"10001030-106-チェリノ" = "おいらより歳下のチビのくせに！"
"10001030-107" = "[s] \"小学生の喧嘩だ……。\""
"10001030-108-トモエ" = "あらあら、お二人とも仲良しですね。ふふふ。"
"10001030-109-トモエ" = "しかしマリナ委員長が事務局を占拠した今、私たちまで喧嘩していては何も解決できません。"
"10001030-110-トモエ" = "特別クラスのみなさんも旧校舎から出たいのでしたら、私たちに力を貸してくれませんか？"
"10001030-111-ノドカ" = "でも、こんな生意気なチビと手を組むなんて……"
"10001030-112-ノドカ" = "お断りです！"
"10001030-113-チェリノ" = "おいらもだ！こんなエロガキとは仲間になれない！"
"10001030-114-トモエ" = "お二人とも、意見を曲げる気は無さそうですね……困りました。"
"10001030-115-シグレ" = "どっちがチビなのか決着をつけたいのであれば、ちょうど良い方法があるよ。"
"10001030-116-ノドカ" = "シグレちゃん？"
"10001030-117-シグレ" = "昔から、真の大人はお酒をどれだけ飲んでも酔わない……って言われてるでしょう？"
"10001030-118-シグレ" = "だから「飲み比べ勝負」でどっちが本当の大人なのか、そしてどっちがチビなのかを決めよう！"
"10001030-119-トモエ" = "シグレちゃん、いくらここが旧校舎だといっても、生徒がお酒を飲むのはレッドウィンター連邦学園の校則に反することですよ！"
"10001030-120-シグレ" = "もちろん、本当のお酒を飲むつもりはないよ。"
"10001030-121-シグレ" = "代わりに使うのは今回の「イワン・クパーラ」に向けて私が作った、特製カンポット。"
"10001030-122-シグレ" = "ただ旧校舎に冷蔵施設なんてものはほぼ無いから、ちょっと発酵してるかもしれないけど……。"
"10001030-123-チェリノ" = "なんだか今、かなり嫌なことを聞いた気が……。"
"10001030-124-シグレ" = "怖いなら参加しなくてもいいよ、チェリノ会長。"
"10001030-125-シグレ" = "その場合はもちろん、弱虫って汚名は避けられないけど。"
"10001030-126-チェリノ" = "だ、誰が弱虫だ！そんなジュースぐらい、いくらでも飲んでやる！"
"10001030-127-ノドカ" = "わ、私も同じです！チェリノ会長に負けたりはしません！"
"10001030-128-シグレ" = "じゃあ決まり。ついに、去年の秋に作っておいたカンポットの出番が……！"
"10001030-129" = "シグレがすぐに、酸っぱい匂いがする果実でできた飲み物らしきものを持ってきた。"
"10001030-130-ノドカ" = "えっと……シグレちゃん。これ本当にお酒じゃないんだよね？"
"10001030-131-チェリノ" = "おっ、思い出した……！こいつは以前、配給用カンポットにウォッカを混ぜて停学処分になった、あの……。"
"10001030-132-シグレ" = "さあさあ、おしゃべりしてる時間はないよ。"
"10001030-133-シグレ" = "それじゃあ準備もできたし、"
"10001030-134-シグレ" = "よーい……スタート！"
