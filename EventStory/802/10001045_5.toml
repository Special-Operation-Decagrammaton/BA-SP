[translation]
"10001045-1" = "第4話;初めての勝利"
"10001045-2" = "レッドウィンター連邦学園・旧校舎"
"10001045-3" = "「飲み比べ勝負」を始めて、約1時間が過ぎた頃……。"
"10001045-4-ノドカ" = "ううっ……ううう……。"
"10001045-5-チェリノ" = "く、苦しい……こんなカンポットがあるなんて、聞いたことがない……。"
"10001045-6" = "[s] \"え。やっぱりお酒が混ざってたの？\""
"10001045-7-チェリノ" = "いや、そういう問題ではない……。"
"10001045-8-ノドカ" = "甘っ！甘過ぎます！"
"10001045-9-ノドカ" = "いったい何ですか、シグレちゃん！この歯が溶けそうなほど甘いカンポットは！？"
"10001045-10-シグレ" = "カンポットは元々、果物を砂糖に漬けて作る飲み物。#nそれに、この旧校舎の極寒に耐えるためには、大量の糖分は必須！"
"10001045-11-ノドカ" = "でもこれはやりすぎですよ！飲むたびに口の中で砂糖がじゃりじゃりして、脳まで溶けそうです！"
"10001045-12-ノドカ" = "ううっ、あと一口でも飲んだら、もう……。"
"10001045-13-チェリノ" = "ふ、ふふ……お前はもう限界のようだな。"
"10001045-14-チェリノ" = "だが、事務局であらゆるスイーツを食べてきたこのチェリノ様にとって、これぐらいの糖分は何てことない！"
"10001045-15-チェリノ" = "諦めるなら今がチャンスだぞ！"
"10001045-16-ノドカ" = "ううっ……敗北を認めたくはないですが……。"
"10001045-17-ノドカ" = "も、もうこれ以上は無理です、私の負け……。"
"10001045-18-チェリノ" = "ばんざーい！勝った！"
"10001045-19-トモエ" = "素晴らしい勝利です、チェリノ会長！さすが会長です！"
"10001045-20-トモエ" = "今日のこの勝負はきちんと記録して、レッドウィンター連邦学園の歴史に永遠に残しましょう！"
"10001045-21-チェリノ" = "良い案だな、トモエ秘書室長！#nそうすれば遥か後世の生徒たちも、おいらの偉大さを讃えることができる！"
"10001045-22-チェリノ" = "しかしなんと書けばいいのだ？#n「レッドウィンター連邦学園の偉大なるチェリノ会長、自ら特別クラスの生徒たちと対決をして勝利を……」"
"10001045-23-チェリノ" = "あれ？そういえば何のためにこんな試合をしていたんだっけ？"
"10001045-24-チェリノ" = "まあ、何でもいいか。重要なのは、おいらが勝利したという事実だからな、ははは！"
"10001045-25-ノドカ" = "ううっ、悔しい……こんなチビに負けるなんて……。"
"10001045-26-チェリノ" = "お前、勝負に負けてもまだおいらをチビ呼ばわりするのか！"
"10001045-27-チェリノ" = "まあそれはそれとして……おいらほどではないが、お前もよく頑張った。"
"10001045-28-チェリノ" = "普段からまめにプリンを食べていなかったら、いくらおいらでもあのカンポットをあれほど飲むのは難しかっただろう。"
"10001045-29-チェリノ" = "それに、この極限の環境の中でここまで耐えてきたお前には、敬意を表したいぐらいだ。"
"10001045-30-ノドカ" = "チェリノ会長……。"
"10001045-31-チェリノ" = "ということで、おいらが事務局に無事に戻れた暁には、すぐにでもお前たちの停学は取り消してやるぞ！"
"10001045-32-ノドカ" = "……いや、そもそもこんな勝負が無かったとしても、早く取り消してくださいよ！"
"10001045-33-チェリノ" = "あ、あれ？今のはおいらを讃える流れじゃなかったのか？"
"10001045-34-ノドカ" = "はあ……仕方ないですね。"
"10001045-35-ノドカ" = "この旧校舎から出るにはチェリノ会長の承認が必要だし……それに、先生もいるし……。"
"10001045-36-ノドカ" = "しばらくは、チェリノ会長に協力することにします。"
"10001045-37-チェリノ" = "ふふ、やっぱりおいらの偉大なる指導力が光を放ったということか。"
"10001045-38-チェリノ" = "いくら特別クラスの停学生だとしても、我がカリスマ性を前にして、従わずにはいられないものなのだな。はははっ！"
"10001045-39-ノドカ" = "……やっぱりムカつく！このチビ、ムカつくんですけど！"
"10001045-40-ノドカ" = "だからおいらはチビじゃない！"
