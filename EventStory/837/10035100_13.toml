[translation]
"10035100-1" = "第10話;ライフセーバー、任務完了！"
"10035100-2-チヒロ" = "あれ？先生？どうしてここに？"
"10035100-3" = "[s1] \"チヒロこそ、どうしたの？\"\n[s2] \"遊びに来た感じじゃなさそうだけど？\""
"10035100-4-チヒロ" = "またエンジニア部が騒ぎを起こしてさ。"
"10035100-5-ウタハ" = "やあ、先生。こんなところで会うなんて、奇遇だね。"
"10035100-6-ウタハ" = "もっと穏やかな状況だったら、良かったんだが……。"
"10035100-7-フブキ" = "その制服……ミレニアムの方々ですか？"
"10035100-8-キリノ" = "それに、さっき言っていた「騒ぎ」とは……？"
"10035100-9-フブキ" = "まぁ、大体想像つくけどね。"
"10035100-10-カンナ" = "ヴァルキューレ警察学校の公安局長、[ruby=おがた]尾刃[/ruby]カンナだ。"
"10035100-11-カンナ" = "このメカワニは、ミレニアムサイエンススクールのもので間違いないか？"
"10035100-12-チヒロ" = "はぁ……うん、そうだよ。"
"10035100-13-チヒロ" = "ウタハ、あんたが説明して。"
"10035100-14-ウタハ" = "ああ。残念だが、事実を否定することはできない。"
"10035100-15-ウタハ" = "このワニは確かに、私たちエンジニア部から生まれたものだ。"
"10035100-16-キリノ" = "ど、どうしてこんな物を作ったんです！？"
"10035100-17-キリノ" = "これのせいで、たくさんの市民が危険にさらされたんですよ！"
"10035100-18-ウタハ" = "本当に返す言葉もない。"
"10035100-19-ウタハ" = "だが、さっきも言った通り、これはエンジニア部が「作った」わけじゃない。#n「生まれた」ものなんだ。"
"10035100-20-フブキ" = "どっちも同じじゃん？"
"10035100-21-ウタハ" = "違う！"
"10035100-22-ウタハ" = "このメカワニは元々、海洋レジャー用に制作していたものだった。#nそれなのに、うっかり解体工事に使うアルゴリズムが入ってしまってね。"
"10035100-23-キリノ" = "だから、人ではなく施設を狙って破壊していたんですね……。"
"10035100-24-キリノ" = "いえ、待ってください！#nどうしてレジャー用途のロボットに攻撃性能が備わっているんですか！？"
"10035100-25-キリノ" = "本官の目は誤魔化せませんよ！"
"10035100-26-キリノ" = "火炎放射に、ミサイル発射。#nレジャーロボットにそんな機能は不要でしょう！？"
"10035100-27-ウタハ" = "仕方ないさ……ロマンだからね。"
"10035100-28-キリノ" = "はい？"
"10035100-29-ウタハ" = "とにかく、私たちが異常を検知した時には、すでに手遅れだったわけだ……。"
"10035100-30-ウタハ" = "急いで行方を探したけれど、見つからなくてね。"
"10035100-31-ウタハ" = "幸いなことに、この子の行動ログはすべてサーバに送信されている。#nそこでチヒロの助力を得て、ここまでたどり着くことができたというわけさ。"
"10035100-32-ウタハ" = "しかし……、まさかウォーターパークで暴れていたとはね。"
"10035100-33-チヒロ" = "今回の損害については、すべてエンジニア部が責任を負うから安心して。"
"10035100-34-ウタハ" = "本当にすまなかった……。"
"10035100-35-ラブ" = "ほら、見なさいよ！"
"10035100-36-ラブ" = "犯人はうちらじゃないでしょ！？"
"10035100-37-ラブ" = "人を疑う時は、ちゃんと調べてからにしなさい！"
"10035100-38-フブキ" = "だから、日頃の行いが……"
"10035100-39-ラブ" = "もう！とにかく！#nこれを作った張本人も来てることだし、さっきの謎も解けるんじゃない？"
"10035100-40" = "謎……？あ、確かにそうですね！"
"10035100-41-ウタハ" = "うん？なんのことだい？"
"10035100-42-フブキ" = "カンナ局長と目が合った時、ワニの動きが一瞬止まったんだよね。"
"10035100-43-フブキ" = "大したことじゃないかもしれないけど、ちょっと気になってさー。"
"10035100-44-ウタハ" = "異常停止か……。"
"10035100-45-ウタハ" = "興味深い話だ。解析してみよう。"
"10035100-46-チヒロ" = "セキュリティを解除して……"
"10035100-47-チヒロ" = "はい、できたよ。"
"10035100-48-ウタハ" = "うん、さすがチーちゃん。"
"10035100-49-ウタハ" = "よし、これがワニの最新の行動ログだ。#n壊れる直前までの、すべてのデータが記録されている。"
"10035100-50-ウタハ" = "君たちの言っていたワニの異常停止は……ここか。"
"10035100-51-チヒロ" = "エラーコード：4885――#n生物本能模倣アルゴリズムによる捕食者への回避行動。"
"10035100-52-ラブ" = "え……なんて言ったの？"
"10035100-53-ラブ" = "もっと分かりやすく説明してよ！"
"10035100-54-チヒロ" = "……つまり。"
"10035100-55-チヒロ" = "ワニが対峙した相手を、自分より上位の捕食者だと認識したってことだね。"
"10035100-56-チヒロ" = "だから、行動ロジックに異常が発生したみたい。でも……。"
"10035100-57-チヒロ" = "……これって、本当に「人」を見た反応？"
"10035100-58" = "[ns] \"……。\""
"10035100-59-キリノ" = "そ、そんなことがあり得るんですか！？"
"10035100-60-ウタハ" = "メカワニの行動アルゴリズムは、動物のワニを参考にしたからね。"
"10035100-61-ウタハ" = "自然界のワニからも上位捕食者と認識されるような対象なら、#nこのようなことが起きてもおかしくはない……。"
"10035100-62-フブキ" = "いやいや、局長は人じゃん。"
"10035100-63-フブキ" = "つまりさ、顔が怖いだけで、ワニをビビらせたってこと？"
"10035100-64-カンナ" = "……ふふ。"
"10035100-65-フブキ" = "カンナ局長？"
"10035100-66-カンナ" = "ふふふふっ……。"
"10035100-67-カンナ" = "ああ、よくわかった。"
"10035100-68-キリノ" = "局長……大丈夫ですか？"
"10035100-69-カンナ" = "気遣いは不要だ、キリノ。#n私の外見が威圧感を与えてしまうことは、私が一番よくわかっている。"
"10035100-70-カンナ" = "今回は特殊な状況下で役に立ったが、次は控えよう。"
"10035100-71-カンナ" = "市民を怖がらせてはいけないからな。はあ……。"
"10035100-72-カンナ" = "そんな顔をするな。人にはそれぞれ役割がある。"
"10035100-73-カンナ" = "私にはウォーターパークより、取調室の方が合っている。"
"10035100-74-カンナ" = "それが科学的にも証明されたんだ。すっきりしたよ。"
"10035100-75-ラブ" = "……。"
"10035100-76-ラブ" = "狂犬、表情が暗いのはあんたの方でしょ。"
"10035100-77-カンナ" = "静かにしていろ。"
"10035100-78-カンナ" = "さて、撤収の準備をしよう。"
"10035100-79-カンナ" = "私は壊れたメカワニの残骸を片付ける。#nキリノとフブキは利用客のサポートを――"
"10035100-80-子供の利用客" = "あ、あの……！"
"10035100-81-フブキ" = "あれ？"
"10035100-82-フブキ" = "ん？さっき局長に助けられた子供じゃん？どしたの？"
"10035100-83-子供の利用客" = "ライフセーバーのお姉ちゃん……。"
"10035100-84-カンナ" = "うん……？"
"10035100-85-カンナ" = "それは、私のことか？"
"10035100-86-カンナ" = "（こくこく）"
"10035100-87-カンナ" = "どうした？まさか、私のせいで転んで怪我でもしたか？"
"10035100-88-カンナ" = "（ふるふる）"
"10035100-89-カンナ" = "それならなんだ？"
"10035100-90-子供の利用客" = "その……。"
"10035100-91-子供の利用客" = "た、助けてくれて、ありがとう！"
"10035100-92-カンナ" = "さ、さっきはワニさんが、怖くて……。"
"10035100-93-カンナ" = "あ、足も動かなくなっちゃって……。"
"10035100-94-カンナ" = "でも、お姉ちゃんが助けてくれたから！#nだから……その、ありがとう！お姉ちゃん！"
"10035100-95-カンナ" = "ああ。"
"10035100-96-カンナ" = "キミが無事で良かった。"
"10035100-97-カンナ" = "私の仕事は、市民を守ることだからな。"
"10035100-98-カンナ" = "先生？今、何を……？"
"10035100-99" = "[s3] \"カンナに証明しようと思って。\"\n[s4] \"カンナの笑顔を記録したよ。\""
"10035100-100-カンナ" = "どういう意味です……？"
"10035100-101" = "[s] \"ほら、よく見て。\""
"10035100-102-カンナ" = "えっと……。"
"10035100-103" = "[ns] \"どう？よく撮れてるでしょ？\""
"10035100-104" = "[ns5] \"カンナにはライフセーバーの素質があるよ。\"\n[ns6] \"カンナにも生活安全局の素質があるよ。\""
"10035100-105-カンナ" = "……ふふ。"
"10035100-106-カンナ" = "先生、またそんなことを仰るのですね。"
"10035100-107-カンナ" = "さっきも言いましたが、私に市民対応は向いていません。"
"10035100-108-カンナ" = "今日も至らないことばかりでした。"
"10035100-109-カンナ" = "ですが……。"
"10035100-110-カンナ" = "もし、できるのであれば……。"
"10035100-111-カンナ" = "ライフセーバーの任務、もう少し……続けてみたいです。"
"10035100-112-カンナ" = "そう、思えるようになりました。"
