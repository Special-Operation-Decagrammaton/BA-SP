[translation]
"10035070-1" = "第7話;メカワニの侵入経路！"
"10035070-2-フブキ" = "うわっ！あいつ、炎まで吹いているよ？"
"10035070-3-フブキ" = "明らかにただのワニじゃないね！"
"10035070-4-フブキ" = "外殻は金属、各種武器を装備。その上、動きもはやい。"
"10035070-5-カンナ" = "ヤツのことは「メタル・ウェポン・スピード・クロコダイル」と呼ぶとしよう。"
"10035070-6-フブキ" = "長いって！メカワニにしようよ！"
"10035070-7-フブキ" = "私たちの行動目標は、明確だ。#n市民の避難が完了するまでメタル・ウェ……"
"10035070-8-カンナ" = "メカワニの目を逸らすこと。"
"10035070-9-カンナ" = "無理に接近したり、攻撃範囲に入ったりする必要はない！"
"10035070-10-キリノ" = "でも、局長！ワニの装甲が硬すぎて、銃弾が通じません！"
"10035070-11-フブキ" = "キリノは、単純に射撃が外れてるだけじゃん？"
"10035070-12-キリノ" = "ええ！？そ、そんなことは……！"
"10035070-13-カンナ" = "お前たち、伏せろ！"
"10035070-14-キリノ" = "あっ！倒しました！手榴弾、効果抜群です！"
"10035070-15-フブキ" = "安心するのははやいよー。気を失っているだけかも。"
"10035070-16-アナウンス" = "ご案内いたします！ただいまより屋外施設を閉鎖いたします！#n屋外のお客様は速やかに屋内に避難してください！"
"10035070-17-アナウンス" = "繰り返します！ただいまより――"
"10035070-18-利用客A" = "お、屋内は安全なの？追ってきたりしないよね？"
"10035070-19-利用客B" = "おい！押すなって！"
"10035070-20-利用客C" = "大丈夫よ！ワニにあの出入口は通れないはず！"
"10035070-21-ウォーターパークのオーナー" = "な、なんてことだ！本物のワニじゃないか！"
"10035070-22-ウォーターパークの警備兵A" = "あれは本物のワニではありません！ワニ型のロボットです！"
"10035070-23-ウォーターパークのオーナー" = "本物だろうと偽物だろうと、どうだっていい！"
"10035070-24-ウォーターパークのオーナー" = "どうしてあんなものがウォーターパークに！？"
"10035070-25-ウォーターパークのオーナー" = "さっき検査した時はいなかったはずだ！"
"10035070-26-ウォーターパークのオーナー" = "くっ！このワニめ！"
"10035070-27-キリノ" = "さっき、局長が言った危険生物は、あれのことですよ！"
"10035070-28-キリノ" = "さっきの暴言、ちゃんと謝ってもらうからねー。"
"10035070-29-ウォーターパークのオーナー" = "ううう……ご、ご、ご……"
"10035070-30-キリノ&フブキ" = "ご？"
"10035070-31-ウォーターパークのオーナー" = "ご、ごめんなさいぃぃ！申し訳ありません。"
"10035070-32-ウォーターパークのオーナー" = "あの時は、とても信じられなかったんです！"
"10035070-33-ウォーターパークのオーナー" = "ウォーターパークにワニが現れるなんて、常識的にあり得ないことでしょう！？"
"10035070-34-ウォーターパークのオーナー" = "しかも、あんなワニが！"
"10035070-35-ウォーターパークのオーナー" = "今はそんな話をしている場合じゃない。#nあの危険生物を制圧しなければ。"
"10035070-36-カンナ" = "私たちが前線に立ちます。援護をお願いしても？"
"10035070-37-ウォーターパークのオーナー" = "わ、分かりました！"
"10035070-38-ウォーターパークのオーナー" = "さ、さすがヴァルキューレ警察学校！頼もしいっ！"
"10035070-39-フブキ" = "（今まで散々バカにしてたくせに……）"
