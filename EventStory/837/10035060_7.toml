[translation]
"10035060-1" = "第6話;ワニ、大暴走！"
"10035060-2" = "[ns1] \"暑いね……。\"\n[ns2] \"暑くて溶けちゃいそう……。\""
"10035060-3-カンナ" = "……申し訳ありません、先生。"
"10035060-4-キリノ" = "タコ焼き、いかがですか……。"
"10035060-5-キリノ" = "お客様も、誰もいませんね……。"
"10035060-6-フブキ" = "当たり前でしょ……誰がこんな天気にタコ焼きなんか……。"
"10035060-7-カンナ" = "お前たち……本当にすまない。私のせいだ……。"
"10035060-8-キリノ" = "だ、大丈夫です！#n局長が焼いたタコ焼きを食べたって、あとで自慢できますから！"
"10035060-9-フブキ" = "そうそう。あの「狂犬」がタコ焼きを焼いてたんだよ～ってさ、#n公安局で言っても、きっと誰も信じないだろうね。"
"10035060-10-カンナ" = "お前たちには、世話になりっぱなしだな。"
"10035060-11-カンナ" = "それに、先生にも……。"
"10035060-12-カンナ" = "先生、先ほど作ったタコ焼き……一個いかがですか？"
"10035060-13-カンナ" = "私にお返しできることは、これしか……。"
"10035060-14" = "[s3] \"私が買うから、みんなで食べない？\"\n[s4] \"商品をタダでもらうのは、あれだし。\""
"10035060-15-カンナ" = "し、しかし、我々はまだ接客の仕事が……。"
"10035060-16-フブキ" = "どうせ誰も来ないし、別にいいんじゃない？"
"10035060-17-フブキ" = "それに、ずっと火の近くに居たら、倒れちゃうって。"
"10035060-18-キリノ" = "体中の水分が……蒸発してしまいます……。"
"10035060-19-カンナ" = "……そうだな。少し休むか。"
"10035060-20-キリノ" = "ふぅ、すこしはマシになりましたね。"
"10035060-21-フブキ" = "ずっと働きっぱなしだったからねー、やれやれ。"
"10035060-22-キリノ" = "……。"
"10035060-23" = "[s] \"みんな、今日は大変だったね。\""
"10035060-24-フブキ" = "プールに来れば涼しいと思ってたけど、そんなことなかったね～。"
"10035060-25-フブキ" = "こうなるとわかってたら、冷房の効いた事務所でのんびりしてたのに。"
"10035060-26-キリノ" = "でも、本官は来て良かったです！"
"10035060-27-キリノ" = "市民の皆さんが楽しむ姿を、すぐそばで見れましたから！"
"10035060-28-カンナ" = "……。"
"10035060-29" = "[s] \"カンナはどうだった？\""
"10035060-30-キリノ" = "正直に言って……。"
"10035060-31-カンナ" = "これほど自分の無力を痛感したのは、初めてです。"
"10035060-32-カンナ" = "市民対応もミスばかりでしたし。"
"10035060-33-カンナ" = "私の勘違いから、皆に迷惑をかけてしまいました。"
"10035060-34-カンナ" = "やはり、私は公安局のほうが向いているようです。"
"10035060-35" = "[s] \"カンナは上手くやっていると思うけど。\""
"10035060-36-カンナ" = "嘘が下手ですね、先生。"
"10035060-37-カンナ" = "私にライフセーバーの素質が無いことは、自分が一番わかっています。"
"10035060-38-カンナ" = "副局長の言葉に惑わされなければ、こんな事には……。"
"10035060-39-キリノ" = "公安局の副局長ですか？#nその方と何かあったんですか……？"
"10035060-40-フブキ" = "そういえば、出向者のリストにカンナ局長の名前が載っていた理由、#nまだ教えてもらえてなかったな。"
"10035060-41-フブキ" = "副局長にはめられたりしたの？"
"10035060-42-カンナ" = "……。"
"10035060-43-カンナ" = "もう隠す必要もないか。"
"10035060-44-カンナ" = "……あの時はまだ手を打つことは可能だった。"
"10035060-45-カンナ" = "断ることもできただろう。だが――私はそうしなかった。"
"10035060-46-カンナ" = "生活安全局に志願した時の気持ちがまだあるならチャンスだと……#nそう言う副局長の話に乗ってしまったんだ。"
"10035060-47-カンナ" = "本当に、バカみたいな話だ。"
"10035060-48-カンナ" = "ふふ、結局、ただの格好の悪い未練だったんだろうな。#n私のなかに残っていた気持ちは……。"
"10035060-49-キリノ&フブキ" = "……。"
"10035060-50-カンナ" = "まあいい。"
"10035060-51-カンナ" = "むしろ、これで良かったのかもしれない。"
"10035060-52-カンナ" = "私なんかに市民対応はできないと、再認識することができた。"
"10035060-53" = "[s] \"そんなことないよ。\""
"10035060-54-カンナ" = "先生？"
"10035060-55" = "[s] \"市民を助けたい気持ちは変わっていないんだよね？\""
"10035060-56-カンナ" = "……しかし、私は笑顔すらまともに作れません。"
"10035060-57-カンナ" = "志願した時も、印象が怖いという理由で落とされていますし……。"
"10035060-58" = "[s] \"できるかできないかは重要じゃないよ。\""
"10035060-59" = "[ns] \"大事なのは、「何をしたいか」だからね。\""
"10035060-60-カンナ" = "そう、ですか。"
"10035060-61-カンナ" = "先生はいつも、予想外のことを言ってくださるのですね。"
"10035060-62" = "[s] \"みんな、そう思っているはずだよ。\""
"10035060-63" = "[ns] \"キリノも。\""
"10035060-64" = "[ns] \"フブキも。\""
"10035060-65" = "[ns] \"ラブも。\""
"10035060-66" = "[ns] \"……うん？\""
"10035060-67-ラブ" = "はっ！？"
"10035060-68-ラブ" = "つ、つい……！"
"10035060-69-キリノ" = "見覚えのある顔だな。不良集団、通称「ヘルメット団」の幹部、[ruby=こまかぜ]河駒風[/ruby]ラブ。"
"10035060-70-キリノ" = "あっ！あのヘルメット！見たことあります！"
"10035060-71-キリノ" = "さっき、ウォータースライダーに乗ってましたね！？"
"10035060-72-ラブ" = "そういうあんたは、3つ数えるって言っておいて2で押したやつ！？"
"10035060-73-ラブ" = "ちっ！ヴァルキューレめ、ここまで追ってくるなんて……！"
"10035060-74" = "[ns5] \"え、ま、待って！\"\n[ns6] \"に、逃げた！？\""
"10035060-75-フブキ" = "私が追いかけます！ほら、フブキも立ってください！"
"10035060-76-フブキ" = "なんで～タコ焼き、ちょうど冷めたところなのに……。"
"10035060-77-キリノ" = "待て！警報が鳴っている！"
"10035060-78-フブキ" = "ヘルメット団のやつ、もう何かやらかしたの？"
"10035060-79-キリノ" = "はっ！違います！あ、あちらを見てください！"
"10035060-80-キリノ" = "プールのほうに……！"
"10035060-81-利用客A" = "きゃぁぁぁ！"
"10035060-82-利用客B" = "ワニだ！プールにワニがいるぞ！"
"10035060-83-利用客C" = "み、みんな逃げて！"
"10035060-84-カンナ" = "あいつだ！"
"10035060-85-カンナ" = "さっき見た危険生物！"
"10035060-86-カンナ" = "見た目はロボットに近いようですが！？"
"10035060-87-キリノ" = "はっ！もうプールサイドに！？このままでは市民に危険が！"
"10035060-88-フブキ" = "な、なんなの、あれは！？"
"10035060-89-フブキ" = "ヘルメット団のやつら、どこであんなもんを……。"
"10035060-90" = "[s] \"みんなが危険だ。\""
"10035060-91-キリノ" = "はい！生活安全局として市民の安全を守らなければ！"
"10035060-92-キリノ" = "行きましょう！"
