[translation]
"10035090-1" = "第9話;ワニ、制圧開始！"
"10035090-2-キリノ" = "うわっ！"
"10035090-3-キリノ" = "やっぱり、外殻が硬すぎますね！"
"10035090-4-ラブ" = "ねえ！さっきから外れっぱなしじゃないの！"
"10035090-5-ラブ" = "ちゃんと撃ってよ！"
"10035090-6-フブキ" = "言うなって。あれはもう自然の摂理みたいなもんだから。"
"10035090-7-フブキ" = "ま、ワニの防御力が高いのは認めるけどさー。"
"10035090-8-フブキ" = "これだけ撃ったのに、ほとんど傷もついてないしね。"
"10035090-9-フブキ" = "これさ、ほんとに誰が作ったんだろうね？"
"10035090-10-カンナ" = "動作は俊敏で、攻撃のバリエーションも多彩だ。"
"10035090-11-カンナ" = "見たところ、攻撃対象が利用客ではなく、施設なのは救いだが……。"
"10035090-12-カンナ" = "やつの行動ロジックは、一体どうなっているんだ。"
"10035090-13-カンナ" = "そもそも、やつが作られた目的は……。"
"10035090-14-キリノ" = "メカワニ、方向を変えました！"
"10035090-15-ラブ" = "ちっ！逃げるんじゃないの！"
"10035090-16" = "[ns1] \"あっちにあるのは……！\"\n[ns2] \"子供用プールが……！\""
"10035090-17-ジャブジャブヘルメット団A" = "ははっ！あいつ尻尾を巻いて逃げやがった！"
"10035090-18-ジャブジャブヘルメット団B" = "もう二度と現れるなよ！"
"10035090-19-カンナ" = "まずい！あの先は……！"
"10035090-20-子供の利用客A" = "きゃぁぁぁ！"
"10035090-21" = "[ns] \"子供たちが……！\""
"10035090-22-カンナ" = "くっ！"
"10035090-23-キリノ" = "カンナ局長！？"
"10035090-24-ラブ" = "ちょっとっ！"
"10035090-25-ラブ" = "狂犬！？"
"10035090-26" = "[s] \"カンナ！\""
"10035090-27-フブキ" = "こ、子どもは無事だね！"
"10035090-28-キリノ" = "し、しかし、まだワニが……！"
"10035090-29-フブキ" = "あのままじゃ、ワニとぶつかる！"
"10035090-30-カンナ" = "……。"
"10035090-31-カンナ" = "下がれ。"
"10035090-32" = "[ns3] \"あ、あれ！？\"\n[ns4] \"ワニが……止まった！？\""
"10035090-33-ラブ" = "な、なんだ……？"
"10035090-34-キリノ" = "メカワニの動きが……止まりました。な、何があったんでしょうか！？"
"10035090-35-ジャブジャブヘルメット団A" = "それより、はやく仕留めよう！"
"10035090-36-ジャブジャブヘルメット団A" = "手榴弾だ！はやく投げて！"
"10035090-37-ラブ" = "ワニめ！全部お前のせいだ！"
"10035090-38-ラブ" = "命で償えっ！"
