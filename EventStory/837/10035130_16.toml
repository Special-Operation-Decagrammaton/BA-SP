[translation]
"10035130-1" = "後日談その2;エンジニア部の過ち（２）"
"10035130-2" = "(……メカワニの試運転、当日)"
"10035130-3-ヒビキ" = "うん、本体の最終調整は完了。#n後は行動制御プログラムをインストールするだけ。"
"10035130-4-コトリ" = "燃料タンクよーし！"
"10035130-5-コトリ" = "試験水槽に水も溜めました！#nテストは、いつでも開始できます！"
"10035130-6-ウタハ" = "よし。それでは、行動制御プログラムのインストールを開始しよう。"
"10035130-7-ヒビキ" = "あれ？プログラム間に合ったんだ。"
"10035130-8-ウタハ" = "納期に間に合わせるためには、妥協も必要だからね。"
"10035130-9-ウタハ" = "昨日、インターネットでそれらしいプログラムのサンプルを見つけた。#n試運転なら、これで十分さ。"
"10035130-10-ウタハ" = "さあ、テストを開始しよう。"
"10035130-11" = "あ、動いた。"
"10035130-12-ヒビキ" = "あたりを警戒してるね……。#nワニを模倣するアルゴリズムが動いている証拠だよ。"
"10035130-13-ウタハ" = "本物のワニに見せかけるために、本能アルゴリズムを上位に設定したからね。"
"10035130-14-コトリ" = "尻尾まで振ってますね！"
"10035130-15-コトリ" = "そうだ、説明しますと――ワニが尻尾を振る動きには攻撃、もしくは威嚇の意味があるそうです！"
"10035130-16-ウタハ" = "……攻撃？"
"10035130-17-ヒビキ" = "……威嚇？"
"10035130-18-コトリ" = "わ、わわっ！？"
"10035130-19-コトリ" = "うわあぁ！一ヶ月かけて開発した、ジェットブースター・コーヒーマシンが！"
"10035130-20-ヒビキ" = "わ、私の超音速水ロケット発射台が……！"
"10035130-21-ウタハ" = "こ、これは！？一体、どうして暴れているんだ！？"
"10035130-22-ウタハ" = "設計通りなら、水槽のなかに入るはず……。"
"10035130-23-ウタハ" = "はっ！？"
"10035130-24-ヒビキ" = "す、水槽が破壊された！"
"10035130-25-コトリ" = "水がここまで来ます！逃げてください！"
"10035130-26-ウタハ" = "ううっ！"
"10035130-27-ウタハ" = "わ、ワニの電源を切らなくては……！"
"10035130-28-コトリ" = "うわああっ！ダメです！近づくことすらできません！"
"10035130-29-ウタハ" = "くっ！こうなった以上、雷ちゃんを呼ぶしか……！"
"10035130-30-ヒビキ" = "先輩、もう手遅れみたい。"
"10035130-31-ウタハ" = "へ、部屋の壁を破壊して逃げてしまった……。"
"10035130-32-ヒビキ" = "あのパワーとスピード……設計以上のパフォーマンスだね。"
"10035130-33-ウタハ" = "行動も設計以上でしたけどね……。"
"10035130-34-ウタハ" = "これ、どうすればいいんでしょうか……？"
"10035130-35-？？？" = "ちょっと！今の音は何！？また何か爆発させたの！？"
"10035130-36-ウタハ" = "この声は……。"
"10035130-37-チヒロ" = "爆発音で来てみれば……。やっぱりあんた達か。"
"10035130-38-チヒロ" = "この部屋、水浸しじゃない。何があったの？壁に穴も空いてるし……。"
"10035130-39-ウタハ" = "ち、チーちゃん……。"
"10035130-40-チヒロ" = "発明品のテストは慎重にって、何度も言ったよね？#nサーバー室はすぐ隣なの。"
"10035130-41-チヒロ" = "セミナーに報告してもらうよ。#nさあ、今度は何をやったの？"
"10035130-42-ウタハ" = "こ、これは……。"
"10035130-43-ウタハ" = "わ、私たちがやったことじゃないんだ。"
"10035130-44-一同" = "（し、知らんぷり！？）"
"10035130-45-ウタハ" = "そ、そうだ！私たちはこの件に関与していない！"
"10035130-46-ウタハ" = "そうだろう？ヒビキ。私たちもここに来たばかりだろう？"
"10035130-47-ヒビキ" = "あ、うん。も、もちろん……。"
"10035130-48-ウタハ" = "と、言うわけさ。は、ははっ、ここを片付けるのは大変だが……。#n力を合わせて頑張ろう！"
"10035130-49-チヒロ" = "下手な演技はやめて。"
"10035130-50-チヒロ" = "もういい、あんた達に聞いたのがバカだった。#n勝手に調べさせてもらう。"
"10035130-51-コトリ" = "あっ！私たちの作業データを……！"
"10035130-52-チヒロ" = "……このワニ、何？"
"10035130-53-ウタハ" = "……くっ！"
"10035130-54-ウタハ" = "仕方ない……。こうなったら、白状するしか……。"
"10035130-55-チヒロ" = "試運転中のメカワニが急に暴れ出した……？"
"10035130-56-チヒロ" = "設計の段階で、何か問題があったんじゃないの？"
"10035130-57-ウタハ" = "それはない！"
"10035130-58-ウタハ" = "この華道兼レジャー用メカワニに欠陥など無い！#nマイスターの肩書にかけて！"
"10035130-59-チヒロ" = "じゃあ、インストールしたプログラムの問題だね。"
"10035130-60-ウタハ" = "た、確かにソフトウェアは完璧ではなかったかも、しれないが……。"
"10035130-61-チヒロ" = "……やっぱり、内部の問題だったんだね。"
"10035130-62-コトリ" = "えっと？アルゴリズムに何かエラーでもありましたか？"
"10035130-63-チヒロ" = "レジャー用プログラムをインストールしようとしてたみたいだけど……。#nログを見た感じ、解体工事用のプログラムがインストールされてる。"
"10035130-64-コトリ" = "どうしてそんなものが？"
"10035130-65-ウタハ" = "どうやら……ダウンロードしたプログラムに問題があったようだ……。"
"10035130-66-チヒロ" = "これ、ちゃんとテストされていないプログラムじゃない。#n開発元も、目的も分からない。"
"10035130-67-チヒロ" = "セキュリティには気をつけろって、いつも言ってるでしょ……"
"10035130-68-チヒロ" = "どうせ寝不足で頭が働いてなかったんじゃない？#nはぁ……いつも最後の詰めが甘いんだから。"
"10035130-69-ウタハ" = "そうか！信頼性の低いプログラムは使ってはいけないんだ！"
"10035130-70-ウタハ" = "みんな！これからはちゃんと正規のソフトウェアを購入して使用しよう！"
"10035130-71-ウタハ" = "はい！エンジニア部は健全なソフトウェアの使用を推奨しています！"
"10035130-72-ヒビキ" = "パンパカパーン。"
"10035130-73-チヒロ" = "だから、下手な演技はやめて。"
"10035130-74-チヒロ" = "ほら、はやくワニを回収しに行くよ。"
