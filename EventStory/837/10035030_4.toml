[translation]
"10035030-1" = "第3話;みんなで遊びましょう！"
"10035030-2-キリノ" = "新しい配置先はあそこですね！"
"10035030-3-キリノ" = "子供たちが遊んでいるプールです！"
"10035030-4-キリノ" = "屋内に来たのはいいけど、子供の世話は面倒だなぁ……。"
"10035030-5-フブキ" = "あっちこっち走り回って疲れるじゃん。"
"10035030-6-カンナ" = "……。"
"10035030-7" = "[s1] \"ミスは誰だってするものだから。\"\n[s2] \"あまり気にしすぎないようにね。\""
"10035030-8-カンナ" = "……はい、先生。"
"10035030-9-カンナ" = "先ほどはつい、いつもの癖が出てしまいました。"
"10035030-10-カンナ" = "長年、公安局にいたせいで、体に染み付いてしまったのでしょう。"
"10035030-11-キリノ" = "気にしないでください！ミスぐらい、誰だってするものですから！"
"10035030-12-フブキ" = "最初から完璧な人なんて、いないからね～"
"10035030-13-フブキ" = "まっ、元気出してよ、局長。"
"10035030-14-カンナ" = "……ありがとう。"
"10035030-15-カンナ" = "たしかに、市民対応に関しては、お前たちの方が私より上だ。"
"10035030-16-カンナ" = "アドバイスをもらえるか？さっきのような事を起こさないためにも。"
"10035030-17-フブキ" = "簡単かんたん！力を抜いて、適当に働いて適当に休めばそれで――"
"10035030-18-キリノ" = "フブキ！休む以上に大切なことがあるでしょう！"
"10035030-19-キリノ" = "こほん。それでは局長のために……。#n生活安全局の市民対応三大原則をお教えしましょう！"
"10035030-20-フブキ" = "三大原則か。"
"10035030-21-フブキ" = "なーんか、楽しそうだねー。"
"10035030-22-キリノ" = "はい！生活安全局の市民対応三大原則。#nそれは――"
"10035030-23-キリノ" = "「奉仕、傾聴、誠実」です！"
"10035030-24-キリノ" = "奉仕！常に市民に奉仕する気持ちで！"
"10035030-25-キリノ" = "傾聴！常に市民の声に耳を傾けて！"
"10035030-26-キリノ" = "誠実！常に市民に誠実な対応を！"
"10035030-27-キリノ" = "前期の市民対応で、本官は高い点数を獲得しましたが……。#nすべてこの三大原則を忠実に守っていたおかげだと思います！"
"10035030-28-フブキ" = "一番重視される射撃の評価は0点だったけどね。"
"10035030-29-フブキ" = "そ、それは、今は関係ないでしょう！"
"10035030-30-キリノ" = "それと、もう一つ大事なことがあるのですが。"
"10035030-31-カンナ" = "他にもあるのか？"
"10035030-32-キリノ" = "これは三大原則ではありません……。#n本官が生活安全局で、勤務するなかで気づいたことです。"
"10035030-33-キリノ" = "市民対応で大事なこと。#nそれは――「笑顔」です！"
"10035030-34-カンナ" = "笑顔……？"
"10035030-35-カンナ" = "はい。本官は、いつどんな時も！#n市民には笑顔で接することを心がけています。"
"10035030-36-キリノ" = "そうすれば、市民の皆さんも笑顔になってくれて。#n本官も前向きな気持ちになれますから！"
"10035030-37-カンナ" = "分かった。参考にさせてもらう。"
"10035030-38-キリノ" = "はい！では、さっそく行きましょう！"
"10035030-39-キリノ" = "このプール、本当に子供用なんですね。"
"10035030-40-キリノ" = "深さも腰までしかありませんし……。"
"10035030-41-キリノ" = "本官はまだ水泳に慣れていないのですが。#nこれなら救助活動に支障はなさそうです！"
"10035030-42-キリノ" = "それに、子供たちもみんな、可愛らしいですね！"
"10035030-43-キリノ" = "んん、なんだ？新米が入ってきたぞ？"
"10035030-44-キリノ" = "へへっ。お前らも一緒に遊ぶか？"
"10035030-45-キリノ" = "あ、あれ？"
"10035030-46-キリノ" = "うーん、不穏な感じ……。"
"10035030-47-キリノ" = "あっ！そこの黄色い水着の子！走らないで！危ないですよ！"
"10035030-48-フブキ" = "けけけっ！捕まえてみろー！"
"10035030-49-キリノ" = "こらぁ、待ちなさい！"
"10035030-50-フブキ" = "キリノ！危ない！"
"10035030-51-子供の利用客" = "今だっ！撃て！"
"10035030-52-キリノ" = "うわっ！？"
"10035030-53-フブキ" = "おぉ～、綺麗に落とされたね。"
"10035030-54-フブキ" = "あの子、射撃の素質がありそうだよ。"
"10035030-55-フブキ" = "あっぷあっぷ！"
"10035030-56-フブキ" = "ふ、フブキ！助けてください！"
"10035030-57-フブキ" = "普通に足つくでしょ。水深も浅いんだしさ。"
"10035030-58-フブキ" = "あ、そうでした……。"
"10035030-59-フブキ" = "わぁ！魔女がよみがえったぞ！"
"10035030-60-フブキ" = "撃て！撃て――！"
"10035030-61-フブキ" = "うわっ！顔に水をかけるのはやめてください！"
"10035030-62-キリノ" = "ううっ！本官も負けませんよ！"
"10035030-63-キリノ" = "くらえっ！やっ！"
"10035030-64-フブキ" = "……。"
"10035030-65" = "[s] \"なんだか、仲良く遊んじゃってるね。\""
"10035030-66-フブキ" = "だね～"
"10035030-67-フブキ" = "しょうがない。私が落ち着かせてくるよ。"
"10035030-68-カンナ" = "どうするつもりだ？"
"10035030-69-フブキ" = "は～い。みんな注目！"
"10035030-70-フブキ" = "なんだ？あのチビ？"
"10035030-71-フブキ" = "弱そうなやつ！"
"10035030-72-フブキ" = "今から……「だるまさんがころんだ」を始めるよ！"
"10035030-73-フブキ" = "だるまさんがころんだ！？"
"10035030-74-フブキ" = "誰が一番長く立っていられるかなぁ。勝負だよ！"
"10035030-75-カンナ" = "（そんなこと、いきなり言って子供が応じるのか……？）"
"10035030-76-フブキ" = "最後まで立っていた人には、プラス10点！"
"10035030-77-カンナ" = "（なんの点数かわからないのに、受け入れるわけが……）"
"10035030-78-フブキ" = "それじゃあ、ゲームスタート！"
"10035030-79-フブキ" = "だるまさんが～～ころんだ！"
"10035030-80-フブキ" = "……（なんとなく始めたけど！）"
"10035030-81-フブキ" = "……（なんかよく分かんないけど……！）"
"10035030-82-フブキ" = "……（負けたくない……！）"
"10035030-83-フブキ" = "あ！そこ、動いたね。アウト！"
"10035030-84-カンナ" = "さっきまで走り回っていたのに……。"
"10035030-85-キリノ" = "大人しくなりましたね……！"
"10035030-86-フブキ" = "さあ、もっかい行くよ。#nだるまさんが～ころんだ！"
"10035030-87" = "（フブキは子供たちが飽きるまで遊んだ……。）"
"10035030-88" = "[ns3] \"すごかったよ、フブキ。\"\n[ns4] \"フブキは子供の相手、慣れてるね。\""
"10035030-89-フブキ" = "まぁ、それなりにねー。"
"10035030-90-フブキ" = "無理やり押さえつけるより、競わせる方が楽なんだよ。"
"10035030-91-フブキ" = "パトロール中は、子供の相手をすることも多いからさ。"
"10035030-92-カンナ" = "そ、そうなのか……。"
"10035030-93-カンナ" = "なるほどな。勉強になった。"
"10035030-94-フブキ" = "これで、子供たちのことはゆっくり見守るだけでいいよ。"
"10035030-95-フブキ" = "んじゃ、後は任せた～。"
"10035030-96-カンナ" = "はい！お任せください！"
"10035030-97-キリノ" = "さっきは油断しましたが、二度目はありません！"
"10035030-98-カンナ" = "では、私は反対側を見張っておこう。"
"10035030-99" = "[s] \"私もカンナの近くにいるね。\""
"10035030-100-キリノ" = "はい！では二手に分かれて両サイドを担当しましょう！"
"10035030-101-キリノ" = "先生もお手伝い、ありがとうございます。"
"10035030-102-カンナ" = "ライフセーバーの仕事は、思った以上に難しいですね。"
"10035030-103" = "[s] \"カンナなら、すぐに慣れるよ。\""
"10035030-104-カンナ" = "そうだといいんですが……正直、自信はありません。"
"10035030-105-カンナ" = "さっきのミスもありますし、私にはフブキのような手際の良さもありませんので。"
"10035030-106" = "[s] \"落ち込むのはまだはやいよ。\""
"10035030-107" = "[ns] \"奉仕、傾聴、誠実、それと笑顔でしょ？\""
"10035030-108-カンナ" = "ふふ、そうでしたね。"
"10035030-109-カンナ" = "仰るとおりです。もう少し頑張ってみましょう。"
"10035030-110-カンナ" = "！？"
"10035030-111-カンナ" = "ううっ！ごふっ！"
"10035030-112-カンナ" = "た、助けてー！"
"10035030-113-カンナ" = "あっぷ！あっぷ！"
"10035030-114-カンナ" = "子供が溺れている……！"
"10035030-115-カンナ" = "先生、助けに行ってきます！"
"10035030-116-カンナ" = "はぁ、はぁ。"
"10035030-117-カンナ" = "大丈夫だったか？"
"10035030-118-カンナ" = "げほげほ……！"
"10035030-119-カンナ" = "み、水の中にワニが！大きなワニが……！"
"10035030-120-カンナ" = "驚いて幻を見たんだな。もう大丈夫だ、安心してくれ。"
"10035030-121-カンナ" = "プール怖いよぅ！"
"10035030-122-カンナ" = "もう入りたくない……！"
"10035030-123-カンナ" = "心配するな。溺れないように私が見ている。"
"10035030-124" = "[s] \"カンナ！笑顔！笑顔！\""
"10035030-125-カンナ" = "……あ！"
"10035030-126-カンナ" = "も、もう安心して、いいんだよ。"
"10035030-127-カンナ" = "ふぇ……。"
"10035030-128-カンナ" = "うわああああぁぁん！！"
"10035030-129-カンナ" = "……？"
"10035030-130" = "[ns] （カンナの顔を見て、プールに逃げた……？）"
"10035030-131-カンナ" = "あのお姉ちゃんも怖いよぉぉ！うわあぁぁん！"
"10035030-132-カンナ" = "……先生。"
"10035030-133-カンナ" = "私は……、本当に市民を守れるのか……。"
"10035030-134-カンナ" = "自信が無くなりました……。"
