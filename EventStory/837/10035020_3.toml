[translation]
"10035020-1" = "第2話;ウォータースライダー、案内します！"
"10035020-2-ウォーターパークのオーナー" = "本日はご足労いただきありがとうございます！#n私は、「エーギル」の代表を務めております。"
"10035020-3-ウォーターパークのオーナー" = "まさかヴァルキューレの方々にご支援いただけるとは……。"
"10035020-4-ウォーターパークのオーナー" = "本当に助かります！ありがとうございます。"
"10035020-5-キリノ" = "はい！市民の安全を守るのが、私たち生活安全局の責務ですから！"
"10035020-6-キリノ" = "どこであってもやることは変わりません。#nお任せください！"
"10035020-7-ウォーターパークのオーナー" = "はははっ！なんと心強い！"
"10035020-8-ウォーターパークのオーナー" = "オープン初日、張り切って行きましょう！"
"10035020-9-ウォーターパークのオーナー" = "それでは、配置を決めさせていただきますね。"
"10035020-10-フブキ" = "ラクなところにしてほしいな～"
"10035020-11-ウォーターパークのオーナー" = "ヘルプに来て下さった方々には、比較的負担の少ない場所にする予定です。"
"10035020-12-ウォーターパークのオーナー" = "うむ……ここが良いでしょう。"
"10035020-13" = "当施設が誇るウォータースライダー、「アクアボブスレー」です！"
"10035020-14-キリノ" = "わぁっ！"
"10035020-15-キリノ" = "お、思った以上に高いですね……！"
"10035020-16-キリノ" = "あそこから滑り下りるのだと思うと……！"
"10035020-17-キリノ" = "ま、大丈夫じゃない？"
"10035020-18-フブキ" = "滑るのはお客さんだし、私たちは誘導係～"
"10035020-19-キリノ" = "そ、そうでしたね。"
"10035020-20-キリノ" = "す、すこし気持ちが楽になりました！"
"10035020-21-フブキ" = "（階段で下りるほうが地獄だと思うけど……言わないでおこっと）"
"10035020-22-キリノ" = "まあ、とにかく。やることは単純だね。"
"10035020-23-フブキ" = "ここにお客さんを誘導してボタンを押すだけ。"
"10035020-24-フブキ" = "単純作業で楽だし簡単！"
"10035020-25-フブキ" = "どう？局長もこれなら文句ないんじゃない？"
"10035020-26-カンナ" = "もとより内容に文句などない。与えられた任務をこなすまでだ。"
"10035020-27-カンナ" = "だが、より負担の少ない業務ではありそうだな。"
"10035020-28-カンナ" = "よし、対応しよう。"
"10035020-29-キリノ" = "局長！マニュアルはこちらにありますので！"
"10035020-30-キリノ" = "ここに載っていない対応については、いつでも本官にお聞きくださいね！"
"10035020-31-キリノ" = "市民への応対は慣れていますから。#nきっとお力になれると思います！"
"10035020-32-カンナ" = "……そうだな、感謝する。"
"10035020-33" = "[s1] \"みんな、頑張ってね！\"\n[s2] \"応援してるよ！カンナ！\""
"10035020-34-カンナ" = "先生……ありがとうございます。"
"10035020-35-カンナ" = "お客様がいらっしゃいました！#n皆さま、どうぞこちらにお並びください！"
"10035020-36-キリノ" = "う、うわぁ……高い……！"
"10035020-37-ウォーターパークの利用客A" = "ほ、ほんとに大丈夫かな……。"
"10035020-38-キリノ" = "大丈夫です！どうか緊張なさらずに！安全にご利用いただくために、#nまずは身長を確認させていただきます！"
"10035020-39-キリノ" = "こちらの台の上に立っていただけますか？"
"10035020-40-キリノ" = "オッケー、身長制限は問題なし～。"
"10035020-41-フブキ" = "じゃあ、スライダーの内側に立ってね。"
"10035020-42-ウォーターパークの利用客A" = "うぅ、緊張するぅ……！"
"10035020-43-キリノ" = "3つ数えたらボタンを押しますので！#n水流に乗って滑走をお楽しみください！"
"10035020-44-キリノ" = "いち、に、さん！"
"10035020-45-ウォーターパークの利用客A" = "うわああああぁぁぁぁぁ！"
"10035020-46" = "[ns] \"う、うわぁ……。\""
"10035020-47-フブキ" = "思ったよりスピードが速いね。"
"10035020-48-フブキ" = "どうー？先生も乗ってみたい？"
"10035020-49" = "[s3] \"え、遠慮しておこうかな。\"\n[s4] \"み、見るだけにするね。\""
"10035020-50-フブキ" = "だよね、私もこれは流石に……"
"10035020-51-フブキ" = "なんでこんなのに乗るんだろうね。"
"10035020-52-フブキ" = "こういうのが好きなのかな……？"
"10035020-53-フブキ" = "フブキ、次のお客様がいらっしゃいますよ！"
"10035020-54-フブキ" = "おっけ～"
"10035020-55-謎の利用客" = "……。"
"10035020-56-キリノ" = "頭部の保護がばっちりですね！"
"10035020-57" = "[ns5] \"あれ？あの子は……。\"\n[ns6] \"どこかで見たような……？\""
"10035020-58-キリノ" = "はい、身長も問題ありません！3つ数えたら押しますね！"
"10035020-59-キリノ" = "いち、に！"
"10035020-60-謎の利用客" = "2で押すなあぁぁぁぁぁ！"
"10035020-61" = "[ns] （やっぱり……）"
"10035020-62-キリノ" = "はっ！つい手が滑ってしまいました！"
"10035020-63-フブキ" = "気をつけてよね、怪我人が出ちゃうかも。"
"10035020-64-フブキ" = "局長、キリノと交代してくれる？"
"10035020-65-カンナ" = "問題ない。"
"10035020-66-カンナ" = "キリノ、交代しよう。"
"10035020-67-キリノ" = "はい……。"
"10035020-68-ウォーターパークの利用客B" = "ふぅ、やっとか。"
"10035020-69-ウォーターパークの利用客B" = "すごい並んでたからなあ。"
"10035020-70-カンナ" = "静粛に！"
"10035020-71-カンナ" = "隊列を崩すな！"
"10035020-72-カンナ" = "お前を連行……いや、搭乗前に保安検査をさせてもらう。"
"10035020-73-カンナ" = "ほ、保安検査？"
"10035020-74-ウォーターパークの利用客B" = "それより、あんた！なんだ。その口調は！"
"10035020-75-カンナ" = "拒否権はない。"
"10035020-76-カンナ" = "「背筋を正せっ」！"
"10035020-77-ウォーターパークの利用客B" = "は、はぁ！？"
"10035020-78-カンナ" = "搭乗不可だ。"
"10035020-79-カンナ" = "仕方ない。階段で退場するように。"
"10035020-80-ウォーターパークの利用客B" = "な、なんだと？ここまできて乗れないっていうのか？"
"10035020-81-カンナ" = "一時間も並んだんだぞ！？"
"10035020-82-カンナ" = "マニュアルによると――"
"10035020-83-カンナ" = "「アクアボブスレー」には、安全規定が厳格に定められており――#n事故防止のために、身長制限が存在している。"
"10035020-84-ウォーターパークの利用客B" = "こっちはお客様なんだぞ！？"
"10035020-85-ウォーターパークの利用客B" = "おい！責任者を呼べっ！"
"10035020-86-キリノ" = "お客様！ここで暴れてはいけません！危険です！"
"10035020-87-キリノ" = "お、落ち着いてください！"
"10035020-88-フブキ" = "ちょっ！危ないってば！"
"10035020-89-フブキ" = "暴れたら、落ちるかもしれないよ！"
"10035020-90-ウォーターパークの利用客B" = "だから、乗せてくれたらそれで――"
"10035020-91-カンナ" = "痛たたたっ！な、なにするんだ！？"
"10035020-92-カンナ" = "大人しくしろ。"
"10035020-93-フブキ" = "せ、制圧した……。"
"10035020-94-カンナ" = "お前には黙秘権があり、弁護士の立会いを求める権利がある。"
"10035020-95-キリノ" = "きょ、局長！お客様を犯罪者みたいに扱っちゃダメですよ！"
"10035020-96-カンナ" = "法とは、市民の安全を守るために存在する。"
"10035020-97-カンナ" = "そして、ウォーターパークの安全規定は利用客を守るためにある。"
"10035020-98-カンナ" = "つまり、このパーク内の「法」そのものだ。"
"10035020-99-カンナ" = "ライフセーバーとして、法を破る者を制圧するのは当然のこと……。"
"10035020-100-カンナ" = "な、なんだ。あの人！"
"10035020-101-カンナ" = "身長制限に引っかかったら、ああなるのか！？"
"10035020-102-カンナ" = "抗議しただけなのに……押さえつけるのはやりすぎだろ！"
"10035020-103-カンナ" = "何故だ……？"
"10035020-104-カンナ" = "これは一体……どういうことだ？"
"10035020-105-キリノ" = "局長！はやくお客様を解放してください！"
"10035020-106-ウォーターパークの利用客B" = "う、うぅっ！"
"10035020-107-ウォーターパークの利用客B" = "く、首が絞まるかと思った！"
"10035020-108-ウォーターパークの利用客B" = "ライフセーバーが客に暴力を振るうなんて！#nクレームを入れてやるっ！"
"10035020-109-カンナ" = "何か間違えたのか……？"
"10035020-110-キリノ" = "あの、局長？大丈夫ですか？"
"10035020-111-フブキ" = "うーん。市民対応の業務って、公安局のやり方とは違うっていうか……。"
"10035020-112-フブキ" = "周りの目も気にしないといけなくて、面倒なんだよね～"
"10035020-113-フブキ" = "まぁ、さっきのはちょっとやりすぎかな。"
"10035020-114-カンナ" = "そう、なのか……。"
"10035020-115-カンナ" = "すまない……。"
"10035020-116-ウォーターパークのオーナー" = "ちょっとちょっと！何をやってるんですか！"
"10035020-117-ウォーターパークのオーナー" = "お客様を押さえつけるなんて！"
"10035020-118-フブキ" = "でもさぁ、さっきの人は安全規定を無視して駄々をこねてたし……。"
"10035020-119-ウォーターパークのオーナー" = "だからといって、お客様に危害を加えていい理由にはなりません！"
"10035020-120-ウォーターパークのオーナー" = "生活安全局は市民対応に慣れていると安心していたのに……。#nどういうことですか、これは！"
"10035020-121-キリノ" = "も、申し訳ありません！"
"10035020-122-ウォーターパークのオーナー" = "すまない……いや、申し訳ありません。"
"10035020-123-キリノ" = "もう、結構です！"
"10035020-124-ウォーターパークのオーナー" = "今回は、起きてしまったことですし……。"
"10035020-125-ウォーターパークのオーナー" = "配置を変更しますから、次はどうか気を付けてください。"
"10035020-126-キリノ" = "ここから移動になるってこと？"
"10035020-127-キリノ" = "どちらに……でしょう？"
"10035020-128-ウォーターパークのオーナー" = "屋内の子供用プールです！"
