[translation]
"10019085-1-リン" = "……。"
"10019085-2-モモカ" = "……。"
"10019085-3-アユム" = "……さ、最後のサンクトゥム、消滅を確認しました……！"
"10019085-4-モモカ" = "せ、成功した、の……？"
"10019085-5-アユム" = "6つのサンクトゥムは全て消滅……#n「虚妄のサンクトゥム」の攻略がついに――"
"10019085-6-アユム" = "――完了しました……！！"
"10019085-7-モモカ" = "はぁ……"
"10019085-8-リン" = "……。"
"10019085-9-アユム" = "やりました、リン先輩……！！#nキヴォトスを守る事ができましたよ！！"
"10019085-10" = "[s] \"リン、モモカ、アユム、本当にお疲れ様。\""
"10019085-11-アユム" = "はい……！#n先生、本当にお疲れ様でした！！"
"10019085-12-モモカ" = "ほんと、先生もお疲れ様～"
"10019085-13-リン" = "……ですが、まだ終わってはおりません。"
"10019085-14-リン" = "この現象の原因解明と再発生の可能性を分析……破壊されたシラトリ区の再建も――"
"10019085-15-リン" = "私たちがやらなくてはならない仕事が山積みです。"
"10019085-16-リン" = "ですが、ひとまずは――"
"10019085-17-リン" = "……本当に、お疲れ様でした先生。"
