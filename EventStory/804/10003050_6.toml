[translation]
"10003050-1" = "第5話;招かれざる美食研究会"
"10003050-2-イオリ" = "び、美食研究会！？なんでお前たちがここに……！今度は何をやらかすつもりだ！？"
"10003050-3-チナツ" = "（そういえば、あの時見たSNSのアカウントの中に、確か……）"
"10003050-4-ハルナ" = "あら、失礼ですわね。私たちは何も、事件を起こしに来たわけではありませんわ？"
"10003050-5-ジュンコ" = "そうよ！私たちはただ焼きトウモロコシを売りに来ただけ！"
"10003050-6-イオリ" = "……？"
"10003050-7-チナツ" = "……とうもろこし？"
"10003050-8" = "海辺やお祭りなどで食べる焼きトウモロコシは、なぜあんなに美味しいのでしょうか……？"
"10003050-9" = "その理由、気になりませんか？同じトウモロコシのはずなのに、海辺だというだけで、お祭りだというだけで、あんなにも味が違うだなんて……。"
"10003050-10" = "ただ考えるだけでは仕方ありません、これを解明する方法はただ一つ。"
"10003050-11-ハルナ" = "そう、試してみれば良いのです。"
"10003050-12-ハルナ" = "つまり、実際に作ってみましょうと。ちょうどここで、私たち以外のサンプルもかなり確保できそうでしたし。"
"10003050-13-アカリ" = "そういうことです★今日ここで全面戦争があるとインターネットで話題でしたし、海でお祭り騒ぎだなんてちょうど良いなと思いまして～。"
"10003050-14-ジュンコ" = "スケバン集団にヘルメット団！それに結構規模の大きい抗争らしいし、見物人もたくさん来るって言ってたし、ここで焼きトウモロコシなんて売ったら大繁盛間違いなし！"
"10003050-15-イズミ" = "うんうん！まあもし売れ残っても私が食べるよ！"
"10003050-16-ジュンコ" = "何言ってんの、売り切るわよ！！運ぶの大変だったんだから！"
"10003050-17-ハルナ" = "……と思っていたのですが、どうしてここまで閑散としているのでしょうか？"
"10003050-18-イオリ" = "いや、お前たちの事情とか知ったこっちゃないし……とりあえずお祭り騒ぎは中止になったから、ほら帰った帰った！"
"10003050-19-イオリ" = "……ふふっ。"
"10003050-20-アカリ" = "あらあら、つれないですね★"
"10003050-21-ハルナ" = "私たちは美食研究会……美食の追及において如何なる障害があろうとも、背を向けるなんてことは致しません。"
"10003050-22-アカリ" = "ハルナも言っている通り、まあそういうことです。それに見たところ……"
"10003050-23-アカリ" = "どうやら今は、風紀委員長がいらっしゃらないようですし……？"
"10003050-24-イオリ" = "（ビクッ！）"
"10003050-25-チナツ" = "（まずいですね……！）"
"10003050-26-ハルナ" = "ふふっ……せっかくですし、私たちの美食への執念、あらためてお見せいたしましょうか？"
"10003050-27-イズミ" = "そうだそうだ！トウモロコシを食べさせろー！！"
"10003050-28-イオリ" = "ああもう、ようやく問題が片付いたと思ったらまた面倒な問題児が……！風紀委員会、行くぞ！"
"10003050-29-風紀委員たち" = "はいっ！！"
"10003050-30-チナツ" = "はあ……戦闘、開始します。"
