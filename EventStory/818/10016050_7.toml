[translation]
"10016050-1" = "第5話;周辺パトロール"
"10016050-2-ツクヨ" = "ツクヨ殿、ツクヨ殿～！見てください！"
"10016050-3-ツクヨ" = "着たら透明になれるミレニアム特製ホログラムTシャツだそうです！"
"10016050-4-ツクヨ" = "これがあれば、忍術いらずで敵陣に潜入できそうですね……！"
"10016050-5-ツクヨ" = "試着もできるそうなので、ツクヨ殿も一緒に着てみませんか？"
"10016050-6-ツクヨ" = "で、でも、私のような大きい子用のサイズがあるかどうか……"
"10016050-7-ツクヨ" = "無理に着て服が破れちゃったりなんかしたら……"
"10016050-8-ツクヨ" = "心配ご無用！看板には、色々なサイズがあると書いてあります！"
"10016050-9-ツクヨ" = "さあ、さあ……！#nせっかく新しい忍術を研究するチャンスなのですから、共に参りましょう！"
"10016050-10-カエデ" = "わあ！ミレニアムは不思議な機械で作った食べ物がい～っぱいあるね！"
"10016050-11-カエデ" = "チセ先輩ー！カエデはあっちにある自動たこ焼き機械のたこ焼きが食べたい！"
"10016050-12-チセ" = "なにか……良い句がひらめきそう。"
"10016050-13-カエデ" = "ねえ、チセ先輩～？聞いてる？"
"10016050-14-チセ" = "……うーん、思い出した。"
"10016050-15" = "ぐ#nる#nぐ#nる#nと"
"10016050-16" = "音#nと#n転#nが#nる"
"10016050-17" = "ラ#nム#nネ#n玉"
"10016050-18-チセ" = "あっちで売ってるのはラムネじゃなくてたこ焼きだよ？"
"10016050-19-カエデ" = "先輩～早くたこ焼き食べに行こうよ～"
"10016050-20-ハナエ" = "わあ、ミレニアムにも応援団があるんですね！"
"10016050-21-ハナエ" = "特殊素材の学ランやチア服にホログラムドローンまで……気合バッチリですね！"
"10016050-22-ヒビキ" = "あ……いや、これは正式な応援団ってわけじゃ――"
"10016050-23-ヒビキ" = "ふふ、その通りだよ。私たちはミレニアムの応援を一手に担う応援の専門家――#nマイスターさ！"
"10016050-24-ハナエ" = "君はその服装を見るに、トリニティの生徒かな？"
"10016050-25-ウタハ" = "はい、そうです！救護騎士団の先輩と一緒に、怪我をした選手の治療に来ました！"
"10016050-26-ウタハ" = "患者さんのお世話をする時は、身体はもとより、心の健康も大切ですから……"
"10016050-27-ウタハ" = "先輩たちが薬と包帯で身体を治療するなら、#n私は応援で心を治療しようと思っているんです！"
"10016050-28-ハナエ" = "ふむ……声から応援への熱意と真心を感じる……"
"10016050-29-ハナエ" = "私たちミレニアム応援団のいいライバルになりそうだね！"
"10016050-30-コトリ" = "おおっ！応援合戦ですか？"
"10016050-31-コトリ" = "応援団の技量と勢いを競う応援合戦は、大運動会の見どころの一つですからね！"
"10016050-32-コトリ" = "ですが、私はもうすぐ障害物競走に参加しないといけませんので……この応援合戦に参加できないのが残念です。"
"10016050-33-ヒビキ" = "じゃ、じゃあ、コトリの代わりに私が障害物競走に出ようか？"
"10016050-34-ヒビキ" = "応援も運動も両方とも苦手だけど、走る方がまだ自信があるから……"
"10016050-35-ウタハ" = "そういう態度はよくないよ、ヒビキ。"
"10016050-36-ウタハ" = "「[ruby=こうりんたいさい]晄輪大祭[/ruby]」は肉体の限界と可能性に挑むスポーツの祭典……"
"10016050-37-ウタハ" = "むしろ、普段苦手なことに挑戦してこそ、その価値を認識することができるんだ！"
"10016050-38-ウタハ" = "素敵なお言葉です……！"
"10016050-39-ウタハ" = "ミレニアムの応援団長さんの勢いに負けないよう、私も一生懸命応援します！"
"10016050-40-ウタハ" = "その挑戦、受けて立とう！"
"10016050-41-ヒビキ" = "早く終わってほしい……"
"10016050-42" = "[ns] \"みんなそれぞれ大運動会を楽しんでいるみたいだね……。\""
"10016050-43-正義実現委員会部員" = "えっと……な、ナツさん……#nそのパフェは一体……"
"10016050-44-ナツ" = "ん？このパフェに興味があるのかな？"
"10016050-45-ナツ" = "このパフェの価値が一目でわかるなんて……#nさすが正義実現委員会の部員だね。お目が高い。"
"10016050-46-ナツ" = "このパフェは屋台エリアの「ルワゾー・ブッレ」で購入したもの。"
"10016050-47-ナツ" = "ルワゾー・ブッレのパフェは普段から入手困難だけど、屋台のパフェはもっとレアなものだよ。"
"10016050-48-ナツ" = "そ、そうなんですか……いえ、それが問題なのではなく――"
"10016050-49-ナツ" = "注文後すぐホイップをトッピングし、果物を盛りつける本店のパフェと違って、#nこれはあらかじめ作り置いて、冷蔵状態で持ってきたものなんだ。"
"10016050-50-ナツ" = "作り立てではない分、アイスを3段盛りにしているから……#n圧倒的なヴィジュアルを兼ね備えているのも魅力だよね。"
"10016050-51-ナツ" = "このアンバランスさこそ「晄輪大祭」でしか味わえない青春のスイーツ――"
"10016050-52-正義実現委員会部員" = "ちょっと待ってください！そのパフェに興味があるのではなく……"
"10016050-53-正義実現委員会部員" = "歩きながらパフェを食べるのはやめてくださいと伝えたかっただけで……"
"10016050-54-ナツ" = "……ん？どうして歩きながら食べてはいけないんだ？"
"10016050-55-正義実現委員会部員" = "校則で禁止していますから……#nそれに、行儀悪いですし……"
"10016050-56-ナツ" = "たしかに歩行中の飲食はトリニティの校則で禁じている……"
"10016050-57-ナツ" = "しかし、晄輪大祭でもその定義が通用すると言えるのだろうか！"
"10016050-58-正義実現委員会部員" = "て、定義ですか？"
"10016050-59-正義実現委員会部員" = "通常、食事は食器を用いるが、本場のカレーは手で食事をするのが正しいだろう？"
"10016050-60-ナツ" = "ならば持ち運べるよう、使い捨て容器で提供されたパフェを正しく楽しむ方法は何だろうか？"
"10016050-61-ナツ" = "そう、ここでは歩きながらパフェを食べるのが正しいのではないだろうか……！"
"10016050-62-正義実現委員会部員" = "い、言われてみればそんな気も……！？"
"10016050-63-ハスミ" = "……変な言葉で部員を惑わせないでください、ナツさん。"
"10016050-64-ハスミ" = "歩行中の飲食禁止は晄輪大祭も例外ではありません。"
"10016050-65-ハスミ" = "げっ、例外ではなかったのか……"
"10016050-66-ハスミ" = "しかもそんなにおいしそうな……"
"10016050-67-ハスミ" = "こほん、#n大きなパフェを食べながら歩いたら、他の方の服を汚すこともあるでしょう。"
"10016050-68-ハスミ" = "トラブル防止のため、パフェは指定された休憩場所で座って食べてください。"
"10016050-69-ナツ" = "それは困るな……これはこっそり買ったものなんだ……#n席に座って食べていたら、他の部員に見つかってしまうかもしれない。"
"10016050-70-ナツ" = "見つかってしまったが最後……自分の分も買ってくれと頼まれる事になるだろう。"
"10016050-71-ナツ" = "……仕方ない。#nこのパフェは副委員長……君が代わりに食べてくれ。"
"10016050-72-ハスミ" = "はい？#n私……ですか？"
"10016050-73-ナツ" = "せっかく手に入れたパフェが食べられないのは残念だが、#nこのスイーツの価値を知っている人間が代わりに食べてくれるなら納得もできよう。"
"10016050-74-ナツ" = "それでは、私は他の部員を探しに行くので……お先に失礼！"
"10016050-75-ハスミ" = "突然こんな大きなパフェをもらいましても……#n困りますね……"
"10016050-76-ハスミ" = "そうでなくとも、誘惑を我慢していたのに……#nこんなカロリーが高そうな食べ物を食べてしまっては、せっかくした決心が……"
"10016050-77-ハスミ" = "……。"
"10016050-78-ハスミ" = "でも、食べ物を捨てるのも――"
"10016050-79" = "[s] \"一つくらいは食べてもいいんじゃないかな？\""
"10016050-80-ハスミ" = "……せ、せ、先生！？いつからここに！？"
"10016050-81" = "[s] \"さっきからいたよ。\""
"10016050-82-ハスミ" = "そ、そうでしたか。"
"10016050-83-正義実現委員会部員" = "ちょうどこのパフェを部員に譲ろうとしていたところでした。"
"10016050-84-ハスミ" = "えっ！？ナツさんがハスミさんに譲ったものですから、直接召し上がった方が……"
"10016050-85-ハスミ" = "いえ、私はさきほど十分な量の昼食を食べましたので。#nこれ以上のカロリー摂取は不要です。"
"10016050-86-ハスミ" = "そうでなくとも、皆さん蒸し暑い天気の中、風紀の取り締まりをしていたのですから……#n冷たいものでも食べて少し休んできてください。"
"10016050-87-正義実現委員会部員" = "あ、ありがとうございます……。"
"10016050-88-ハスミ" = "はぁ……。"
"10016050-89" = "[s1] \"大丈夫？ちょっと疲れてるみたいだけど。\"\n[s2] \"ハスミも少し休んだら？\""
"10016050-90-ハスミ" = "いえ、私は大丈夫です。#n試合に出てるわけでもないですし、まだまだ体力も残っていますから……。"
"10016050-91-ハスミ" = "いえ、私は大丈夫です。#n試合に出てるわけでもないですし、まだまだ体力も残っていますから……。"
"10016050-92-ハスミ" = "それに……いつ、また先程のように校則を違反する生徒が現れるかも分かりませんからね。"
"10016050-93-ハスミ" = "それに比べて、ミレニアムとゲヘナの実行委員ときたら……"
"10016050-94-ハスミ" = "お祭りを楽しむのは結構ですが、ご自身の責務を放棄するのはいただけません。"
"10016050-95" = "[s3] \"せっかくのお祭りなんだから……\"\n[s4] \"少しくらいは楽しんでもいいんじゃないかな？\""
"10016050-96-ハスミ" = "いえ。人にはそれぞれの役割があります。#nお祭りを楽しむ事も、誰かの役割に過ぎません。"
"10016050-97-ハスミ" = "いえ。人にはそれぞれの役割があります。#nお祭りを楽しむ事も、誰かの役割に過ぎません。"
"10016050-98-ハスミ" = "先ほどもお話しましたが、大運動会の運営も学園業務の延長に過ぎません。"
"10016050-99-ハスミ" = "私はいつものように正義実現委員会の副委員長として、私の責務を果たすだけですから。"
"10016050-100-キリノ" = "あれ、[USERNAME]先生じゃん？"
"10016050-101-キリノ" = "こんにちは、先生。奇遇ですね！"
"10016050-102" = "[s5] \"やあ。キリノ、フブキ。\n[s6] \"パトロール中？\""
"10016050-103-キリノ" = "はい！私たちヴァルキューレ警察学校は、生徒が安全にお祭りを楽しめるよう会場の内外で警備業務を遂行しています！"
"10016050-104-キリノ" = "はい！私たちヴァルキューレ警察学校は、生徒が安全にお祭りを楽しめるよう会場の内外で警備業務を遂行しています！"
"10016050-105-キリノ" = "いやぁ……アスレチックスタジアムは広いですねぇ……#n一周するのにも時間がかかってしまって……。"
"10016050-106-キリノ" = "面倒な試合に参加しなくてもいいって言われて喜んでたのに……#nまさか日陰一つない競技場周辺をパトロールし続ける事になるとは……"
"10016050-107-キリノ" = "仮病使って寮で休んでれば良かった……。"
"10016050-108-キリノ" = "ダメですよ、フブキ。仮病だとバレたら、あとで懲戒を受けるかもしれませんよ？"
"10016050-109-キリノ" = "今回のパトロールが終わったら、#nミレニアム特製ロボットドーナッツをおごりますので、#n最後まで一緒に頑張りましょう！"
"10016050-110-キリノ" = "ロボットが作るドーナッツって味も違ったりするのかなぁ……"
"10016050-111-フブキ" = "そういえば、隣の方は……トリニティ正義実現委員会の副委員長ですね！"
"10016050-112" = "[s] \"二人は顔見知りなの？\""
"10016050-113-キリノ" = "はい。午前中に試合を妨害しようとする不良の鎮圧に苦労していたのですが……"
"10016050-114-キリノ" = "その時、狙撃で本官を助けてくださったのです！#nお陰様で無事不良生徒を逮捕できました。改めて感謝申し上げます！"
"10016050-115-ハスミ" = "いえ。私の方こそ、ヴァルキューレ警察学校の皆さんにはいつも助けていただいてますから。"
"10016050-116-ハスミ" = "なにか起こるたびに、迅速に報告していただいて……#nお陰で事件が大きくなる前に解決することができています。"
"10016050-117-ハスミ" = "……誰よりも早く事件現場に現れるという生活安全局の話は本当だったのですね。"
"10016050-118-キリノ" = "は、はは……そんなに褒められると、何だかむずがゆいですね……。"
"10016050-119-ハスミ" = "ところで、パトロール中になにか問題はありましたか？"
"10016050-120-キリノ" = "いえ。特段、怪しそうな生徒や物はなかったと思いますが……"
"10016050-121-キリノ" = "あ、そういえば先ほど進行スタッフではないのに率先して競技に必要な備品を運んでくれた生徒と出会いました。"
"10016050-122-キリノ" = "鉄骨やら、砲丸がたくさん入った箱やらの重い備品を運んでいるのに、#n「助けは要らない」と断っていましたね。"
"10016050-123-キリノ" = "試合が終わるやいなや、実行委員より先に備品を運ぶくらい意欲的な生徒だったねぇ。"
"10016050-124-ハスミ" = "……何か、怪しいですね。"
"10016050-125-ハスミ" = "[ruby=はやせ]早瀬[/ruby]さんの資料によると、今回の大運動会に使われる備品はロボットで運ばれるため、人の手で運ぶ必要はないはずですが……"
"10016050-126-キリノ" = "そ、そうなのですか？#nでは、あの生徒は備品を一体どこに運んでいたのでしょうか？"
"10016050-127-ハスミ" = "まずはその生徒の正体を確認しなければならないですね……。"
"10016050-128-ハスミ" = "キリノさん、その生徒たちに会った場所まで案内をお願いします。"
"10016050-129-キリノ" = "はい！すぐご案内します！"
"10016050-130-フブキ" = "げっ……面倒くさそうな事件の気配……。"
