[translation]
"10016085-1-ミレニアムの選手A" = "騎馬戦が終わったら、残りの大きな競技は学園対抗リレーくらいだよね？"
"10016085-2-ミレニアムの選手B" = "うん、そうだよ。#n総合優勝に大きな影響があるような競技はほぼ終わったし。"
"10016085-3-ミレニアムの選手A" = "まさか万年最下位争いをしていたミレニアムが、総合優勝を狙える位置にいるなんて……。#n今回の[ruby=こうりんたいさい]晄輪大祭[/ruby]は例年と違って、ちょっと変なところが多いよね。"
"10016085-4-ミレニアムの選手B" = "聞いた話だけど、シャーレの先生が運動を苦手とする生徒たちも楽しめるように、競技の内容を調整してくれたんだって……そのおかげかな？"
"10016085-5-ミレニアムの選手A" = "騎馬戦の優勝候補筆頭だったゲヘナとトリニティが、予選で早々にぶつかり合っていなくなったのも大きいね。"
"10016085-6-ミレニアムの選手A" = "今なら百鬼夜行程度、私たちでも勝てるはず……！"
"10016085-7-ミレニアムの選手B" = "よし！次の騎馬戦もこの勢いで、ミレニアムの総合優勝を――"
"10016085-8-ミレニアムの選手B" = "ん？あれは一体……。"
"10016085-9-イズナ" = "さささっ！これで準備は完璧ですね！"
"10016085-10-イズナ" = "ハスミ殿のお力を借りて完成した忍法……築城の術！"
"10016085-11-ツクヨ" = "ほ、本当に大丈夫でしょうか……？"
"10016085-12-ツクヨ" = "だいぶ不安定ですし、ちょっと押されたら、すぐ倒れちゃいそうですけど……。"
"10016085-13-チセ" = "ゆ～らゆら～"
"10016085-14-ハスミ" = "大丈夫です。左右のお二人には、大切な役割がありますから。"
"10016085-15-ハスミ" = "カエデさんとイズナさんは横と後ろから接近する敵に気を配って、チセさんに場所を報告してください。"
"10016085-16-カエデ" = "索敵の任ですね……分かりました！"
"10016085-17-カエデ" = "それなら任せて！#n飛んでくカブトムシを追いかけるのに比べたら簡単なんだから！"
"10016085-18-ミレニアムの選手A" = "なんか百鬼夜行にすごい変な騎馬がいるんだけど……。"
"10016085-19-ミレニアムの選手B" = "ちょっと押したらすぐに崩れちゃいそうだね……"
"10016085-20-ミレニアムの選手B" = "よし！まず最初にあいつから倒しちゃおっか！"
"10016085-21-ミレニアムの選手A" = "合点承知！行くよ！"
"10016085-22-イズナ" = "チセ殿！北北東から敵が接近中です！"
"10016085-23-ツクヨ" = "う、うあぁ……も、もう始まったんですか……？"
"10016085-24" = "お、大きい……！？"
"10016085-25" = "遠くで見た時は分からなかったけど……これじゃあどうやっても手が届かないよ！"
"10016085-26" = "だ、大丈夫！体当たりで騎馬の重心を崩せば……！"
"10016085-27" = "ぼうし～"
"10016085-28" = "げっと～。"
"10016085-29" = "えっ、いつの間に！？"
"10016085-30" = "くぅ！勝てると思ったのに！"
"10016085-31-イズナ" = "流石はチセ殿ですね！電光石火の如くでした！"
"10016085-32-イズナ" = "ふっふーん！チセ先輩は百鬼夜行・カルタ最強決定戦のチャンピオンだからね！"
"10016085-33-カエデ" = "腕の動きなら誰にも負けないよ！"
"10016085-34-ハスミ" = "騎手は敵に狙われる危険な役割ですが、それはつまり敵の帽子を奪う重要な存在でもあるということ……。"
"10016085-35-ハスミ" = "両翼のバランスこそ少し不安定ですが、騎手にチセさんをお任せして正解でしたね。"
"10016085-36-カエデ" = "チセ先輩、右から来るよ！"
"10016085-37-ミレニアムの選手" = "隙を突いて、奇襲をかければ――"
"10016085-38-チセ" = "ふたつめ～"
"10016085-39-ミレニアムの選手" = "ダメかっ……！"
"10016085-40-シノン" = "ミレニアム対百鬼夜行の騎馬戦決勝ですが、何とも不思議な光景です！"
"10016085-41-シノン" = "百鬼夜行のチセ選手が、開始早々ミレニアムから帽子を2つ奪い取りました！"
"10016085-42-シノン" = "体勢こそアンバランスですが、まるで砦のような防御力を前にミレニアムの騎馬は太刀打ちできず各個撃破されています！"
"10016085-43-シノン" = "まだまだ熾烈な総合優勝争いをしているミレニアムとしては、負けられない1戦となりそうですね！#nさあ、この決勝戦を制するのは果たしてどちらの学園でしょうか！"
"10016085-44-ミレニアムの選手" = "このままじゃ百鬼夜行にまるで歯が立たないよ……。"
"10016085-45-ミレニアムの選手" = "マキ！助けて！！"
"10016085-46-マキ" = "ん、私？"
"10016085-47-マキ" = "いや～私はハレ先輩の代わりに出場してるだけだよ？"
"10016085-48-マキ" = "それに私も特別運動が得意ってわけじゃないし……"
"10016085-49-ミレニアムの選手" = "でも、マキはあの「ヴェリタス」のハッカーなんでしょ？"
"10016085-50-ミレニアムの選手" = "何かヴェリタスの技術で対抗できたりしない？"
"10016085-51-マキ" = "え～……チヒロ先輩にバレたらまた怒られるんだけど……。"
"10016085-52-マキ" = "そこまでいうなら……まぁ、仕方ないよね。"
"10016085-53-マキ" = "ハレ先輩から借りた、この「アテナ3号」を使うよ！"
"10016085-54-カエデ" = "うぅ……いつの間にか百鬼夜行の騎馬は私たちだけ……。"
"10016085-55-カエデ" = "それなのに、まだ相手の騎馬が3つも残ってるよ！"
"10016085-56-ツクヨ" = "私たちが取った帽子を数えると……1つ、2つ……えっと……。"
"10016085-57-ツクヨ" = "の、残りの騎馬は1つのはずです！"
"10016085-58-イズナ" = "……あれ？数が合いませんよ？#nややっ、これは一体どういうことでしょう？"
"10016085-59-マキ" = "あはは、やっと気付いたの？"
"10016085-60-マキ" = "これは私たちの騎馬を投影したホログラム映像だよ！"
"10016085-61-マキ" = "「アテナ3号」に新しく搭載されたホログラム投射機能を使って、ダミーを生成したんだ！"
"10016085-62-マキ" = "いひひ～、どれが本物か見分けられるかな？"
"10016085-63-カエデ" = "なにそれ！競技中に道具を使うなんて反則じゃないの！？"
"10016085-64-ハスミ" = "……残念ながら、そもそも道具を使う生徒の想定をしていないので、反則とは言えません。"
"10016085-65-ハスミ" = "規定上、騎馬戦の競技中に銃や爆弾の使用は禁止されています。#nですが、ホログラムの使用を禁止するとは書かれていませんので……。"
"10016085-66-ハスミ" = "しかし、まさかそんな方法があるなんて……。#n次回の晄輪大祭ではホログラム関連の規定を追加する必要がありそうですね。"
"10016085-67-イズナ" = "同時に二つの分身を生み出すとは……流石ミレニアムですね！#n最後まで油断できません！"
"10016085-68-ハスミ" = "向こうは本物を見分ける時間を与えないためにも、すぐに仕掛けてくるはずです。"
"10016085-69-ハスミ" = "イズナさん、ツクヨさん。お二人の特技をお見せする時です！"
"10016085-70-ツクヨ" = "わ、私たちの特技、ですか……？"
"10016085-71-ハスミ" = "はい……それは――忍術です。"
"10016085-72-イズナ" = "……！#nはい！忍術です！"
"10016085-73-マキ" = "……忍術？それってマジックみたいなものだよね？#nなんか面白そうじゃん！"
"10016085-74-マキ" = "それじゃあ、ミレニアムのホログラムと百鬼夜行の忍術――どちらが相手の目を欺けるか勝負だね！"
"10016085-75-マキ" = "さぁさぁ、三方向から同時に攻めるよー！"
"10016085-76-ツクヨ" = "うぅ……。"
"10016085-77-ツクヨ" = "つ、ツクヨ流忍術！"
"10016085-78-マキ" = "……捕まえたっ！#nこれでミレニアムの勝――"
"10016085-79-マキ" = "あれ？なんでこんなところにキツネのぬいぐるみが……？"
"10016085-80-マキ" = "帽子はどこに……？"
"10016085-81" = "――こっち。"
"10016085-82-マキ" = "う、うわっ！そっちにいたの！？"
"10016085-83-マキ" = "うぅ、やられちゃった……。"
"10016085-84-チセ" = "……これで最後。"
"10016085-85-カエデ" = "やったぁ！チセ先輩ならできるって信じてたよ！"
"10016085-86-ツクヨ" = "あぅ……もう少しで落としちゃうところでした……。"
"10016085-87" = "さすがツクヨ殿！空蝉の術をあの一瞬で完璧に再現するとは……イズナ感激です！"
"10016085-88" = "チセ殿とキツネのぬいぐるみをすり替えるタイミングが少しでも遅れていたら、#nきっと帽子を取られていました！"
"10016085-89" = "たかいたか～い、面白かった。"
"10016085-90" = "は、はは……ま、またできる自信はないです……。"
"10016085-91" = "そ、それよりチセ先輩……髪が抜けそうなんですが……そろそろ離していただけると……。"
"10016085-92-シノン" = "チセ選手、曲芸のような動きを見せて、見事マキ選手の帽子を奪いました！"
"10016085-93-シノン" = "先ほどの攻防でミレニアム最後の騎馬が落ちたので……"
"10016085-94-シノン" = "百鬼夜行チームの勝利です！"
"10016085-95-ハスミ" = "……よし！"
"10016085-96-ハスミ" = "こほん……私らしくありませんね。#n少し冷静さを欠いておりました。"
"10016085-97-ハスミ" = "ハスミ殿、ハスミ殿～！イズナ、頑張りました～！"
"10016085-98-ハスミ" = "この勝利は全て、ハスミ殿が考えてくださった奇策のおかげです！"
"10016085-99-ハスミ" = "はい。ずっと見ていましたよ。#n皆さん、本当に素晴らしい活躍でした。"
"10016085-100-ハスミ" = "部長が倒れちゃった時は、もうダメだと思ってたのに……"
"10016085-101-ハスミ" = "わ、私みたいな存在にも役割をくださって……。"
"10016085-102-ハスミ" = "本当に、本当にありがとうございます……うぅ、うわ～ん……。"
"10016085-103-ハスミ" = "もちろんお役に立てたのは光栄ですが、皆さんの頑張りがあってこそですから。"
"10016085-104-ハスミ" = "ハスミ殿に感謝です！#nそれにイズナ、とっても楽しかったです！"
"10016085-105-ハスミ" = "学園こそ違いますが、力を合わせて長所を活かし、見事勝利を手にした瞬間は……"
"10016085-106-ハスミ" = "まるで柴犬ワン蔵監督の作品に登場する主人公のような気分でした！"
"10016085-107-ハスミ" = "またハスミ殿と一緒に競技がしたいです！"
"10016085-108-ハスミ" = "ですが……私はトリニティの生徒ですよ……？"
"10016085-109-ハスミ" = "次は敵として戦うことになるかもしれません。"
"10016085-110-ハスミ" = "それでも大丈夫ですっ！"
"10016085-111-イズナ" = "ハスミ殿と一緒にできるなら、敵でも味方でも関係ありません！#nきっと楽しいです！えへへっ。"
"10016085-112-カエデ" = "そうそう！私もすっごく楽しかったよ！"
"10016085-113-ツクヨ" = "わ、私も楽しかったです……！"
"10016085-114-ハスミ" = "ふふ、そうですか。それは良かったです。"
"10016085-115-ハスミ" = "……だからといって、手加減はしませんよ？"
"10016085-116-ハスミ" = "トリニティの生徒として、競技では常にベストを尽くしますからね。"
"10016085-117-ツクヨ" = "はいっ、イズナも全力で戦います！"
"10016085-118-ツクヨ" = "ぜ、ぜひ、お願いします！"
"10016085-119-カエデ" = "にひひっ、またね～！"
