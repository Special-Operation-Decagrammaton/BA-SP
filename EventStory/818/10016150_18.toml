[translation]
"10016150-1" = "後日談その5;救護騎士団＆救急医学部"
"10016150-2-セリナ" = "……最後に、バイタルをチェックします。"
"10016150-3-セリナ" = "……はい。体温正常、脈拍と血圧も正常値に戻ってますね。"
"10016150-4-セリナ" = "熱中症で運ばれてきたときは、体温が高く心配しましたが……"
"10016150-5-セリナ" = "水分補給と休息でなんとかなって良かったです。"
"10016150-6-正義実現委員会部員" = "あ、ありがとうございます……おかげでもう元気になりました！"
"10016150-7-正義実現委員会部員" = "いえ、油断は禁物です！"
"10016150-8-正義実現委員会部員" = "合同医療本部はまもなく撤収する予定でして、ここでの対応は難しいですが……"
"10016150-9-セリナ" = "トリニティに戻られても体調が優れないようでしたら、ぜひ救護騎士団にお越しください！"
"10016150-10-セリナ" = "正義を守るのも、健康あってこそですので。"
"10016150-11-正義実現委員会部員" = "は、はいっ……お気遣いありがとうございます！"
"10016150-12-正義実現委員会部員" = "ところで、あの……そちらの方は……"
"10016150-13-セナ" = "お呼びでしょうか？"
"10016150-14-正義実現委員会部員" = "あっ、いえ。そういうわけではなくて……"
"10016150-15-セリナ" = "ゲヘナ生に見えますが、トリニティの私がお世話になっても大丈夫でしょうか……？"
"10016150-16-正義実現委員会部員" = "ああ、それでしたら――"
"10016150-17-セナ" = "お気になさらず。"
"10016150-18-セナ" = "救急医学部は、患者の状態や身元を問いません。#n引き受けたその瞬間から、例外なく私たちの管轄です。"
"10016150-19-セナ" = "もちろん、様々な障害が伴う場合もありますが、死体……#nいえ、患者がいるならどこへでも駆けつける、それが私たち救急医学部ですので。"
"10016150-20-正義実現委員会部員" = "学園同士の関係性は、治療の二の次です。"
"10016150-21-正義実現委員会部員" = "……なるほど、そうなんですね。"
"10016150-22-セリナ" = "晄輪大祭は学園の垣根を超え、みんなで切磋琢磨し公平に競い合う祭典ですから。"
"10016150-23-セリナ" = "私も皆さんに元気な姿で帰っていただけるよう、最善を尽くします。"
"10016150-24-セリナ" = "それに、あなたを見つけてここまで搬送してきたのは、こちらのセナさんなんですよ！"
"10016150-25-正義実現委員会部員" = "そ、そうだったのですね……！"
"10016150-26-正義実現委員会部員" = "なのに私は、何も知らずに失礼なことを……すみませんでした。"
"10016150-27-セナ" = "いえ、気に病む必要はありません。"
"10016150-28-セナ" = "患者を選んでいたら、上質な死体……#nいえ、負傷者に思う存分触れる機会が減ってしまいますし。"
"10016150-29-セナ" = "（死体……？）"
"10016150-30-正義実現委員会部員" = "と、とにかく、助けていただきありがとうございました！"
"10016150-31-セリナ" = "本日はお疲れ様でした！"
"10016150-32-セリナ" = "救急医学部の皆さんのおかげです。#n普段より多くの患者さんを診ることができました。"
"10016150-33-セナ" = "いえ、救護騎士団の皆さんが尽力してくれたおかげです。"
"10016150-34-セナ" = "どれだけ忙しかろうと、常に笑顔を絶やさず患者に接する皆さんの姿には、私も深い感銘を受けました。"
"10016150-35-セナ" = "医学や治療に関しては、一定の見識があると自負していたのですが……#nまだまだ学ぶことは多いですね。"
"10016150-36-セリナ" = "どうかされましたか？"
"10016150-37-セナ" = "……やはり、救護騎士団の皆さんにはお詫びをさせてください。"
"10016150-38-セナ" = "実は、以前「救護騎士団」の噂を耳にして、少し構えていました。"
"10016150-39-セリナ" = "噂……？"
"10016150-40-セリナ" = "ああ、もしかして……救護騎士団はゲヘナの患者を受け入れない、とか――"
"10016150-41-セナ" = "いえ、そうではなく……"
"10016150-42-セナ" = "救護騎士団の団長が現れると、むしろ負傷者が増える、という噂です。"
"10016150-43-セナ" = "「団長が壊して騎士団が治す」のだと……"
"10016150-44" = "これほど優しい部員を率いている団長が、そんなはずありませんね。"
"10016150-45-セリナ" = "……。"
"10016150-46-セナ" = "救護騎士団には、睡眠障害の患者にバットを振り回したり、お茶にトリカブトを混ぜて症状を悪化させた方がいるとも聞きましたが……"
"10016150-47-セリナ" = "あ、あはは……噂というものは、よく誇張されて伝わるものですから。"
"10016150-48-セナ" = "そうですね。今日一日、皆さんと時間を共にして実感しました。#nやはり、噂は噂に過ぎません。"
"10016150-49-セナ" = "……そういえば、こんな噂もありました。"
"10016150-50-セリナ" = "何でしょう……？"
"10016150-51-セナ" = "救護騎士団には、いつでもどこにでも現れる幽霊のような看護師の方がいらっしゃる、と。"
"10016150-52-セナ" = "噂によれば、その看護師は患者がナースコールを押す前に現れては、一瞬で措置を終え次の患者の下に駆けつけているそうです。"
"10016150-53-セナ" = "セリナさんは、その有能な看護師の正体をご存じでしょうか。"
"10016150-54-セリナ" = "セ、セナさん……！#nたしか後夜祭で、大きなキャンプファイヤーが行われるそうなんですよ！"
"10016150-55-セリナ" = "よ、よろしければ、一緒に見に行きませんか？"
"10016150-56-セナ" = "キャンプファイヤーですか。私はあまり……"
"10016150-57-セナ" = "……そうですね。火を扱うわけですし、死体……いえ、負傷者が出るかもしれませんね。"
"10016150-58" = "で、でしたら、さっそく準備をしましょう！#nこうしている間にも、患者さんが待っているはずです！"
"10016150-59-セナ" = "……噂については、また今度お話できればと。"
