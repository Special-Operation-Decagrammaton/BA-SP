[translation]
"10016100-1" = "エピローグ;みんなのための――"
"10016100-2" = "（リレー終了後、「晄輪大祭」は大きな騒動もなく順調に進行し……）"
"10016100-3" = "（ミレニアム代表の閉会の辞を最後に、つつが無く幕を閉じた）"
"10016100-4-ノア" = "選手ならびにご観覧中の皆さん、こんにちは。#nミレニアムのセミナー書記兼「晄輪大祭」実行委員の[ruby=うしお]生塩[/ruby]ノアと申します。"
"10016100-5-ノア" = "本来であれば、リオ生徒会長に閉会の辞をお願いする予定でしたが、諸事情で私が代わりに述べさせていただく事となりました。どうかご了承ください。"
"10016100-6-ノア" = "こほん……先ほども申し上げましたが、私は本来、記録を主とする書記ですので、自身の主観を交えた閉会の辞というのはあまり慣れておりません。"
"10016100-7-ノア" = "ですので、今回の閉会の辞は書記の本分に合わせ、本日の日程を振り返ること締めさせていただければと思います。"
"10016100-8-ノア" = "今回の晄輪大祭では数多くの試合が行われ、#nまた、多くの方が参加してくださりました。"
"10016100-9-ノア" = "私個人としては、すべての試合が手に汗握る名勝負であり、ハイライトだったと思います。#nですが、ここにいる全員が同じ目線で試合を見守っていたわけではありません。"
"10016100-10-ノア" = "そのため、今回の「晄輪大祭」で最も活躍した生徒を選ぶのは難しいでしょう。"
"10016100-11-ノア" = "むしろ、生徒ひとりひとりが「晄輪大祭の主人公」であり、素敵な活躍を見せてくださったと思っております。参加してくださった全ての皆様に、深くお礼申し上げます。"
"10016100-12-ノア" = "開会の時に申し上げたように……「晄輪大祭」はキヴォトス中の生徒が楽しみながら作り上げていく、「みんなのお祭り」ですから。"
"10016100-13-ノア" = "それではどうか、皆様にとって楽しいお祭りであったことを祈って――#n――閉会の辞とさせていただきます。"
"10016100-14-生徒A" = "ねえ、この後どうしよっか。もう少し競技場に残る？"
"10016100-15-生徒B" = "うーん、私はお腹が空いてきたかも。"
"10016100-16-生徒B" = "閉会後も屋台は遅くまであるみたいだし……。"
"10016100-17-生徒B" = "競技中は食べる時間なかったし、あの美味しそうな中華丼を食べに行こうよ！"
"10016100-18-生徒C" = "ねぇ、さっき見たら、競技場の前に薪がいっぱい積まれてたんだけど……何するつもりなんだろ？"
"10016100-19-生徒D" = "ちょっと、後夜祭のこと忘れたの？"
"10016100-20-生徒D" = "後夜祭でキャンプファイヤーするって、プログラムに書いてあったじゃない。#nいろんな学園の生徒とフォークダンスが踊れるのも、晄輪大祭ならではだよ！"
"10016100-21-生徒D" = "後夜祭で好きな人とフォークダンスを踊ると、恋が叶うって聞いたことない？"
"10016100-22-生徒D" = "ねえねえ、誰と踊るの？"
"10016100-23-生徒C" = "うーん、私は……。"
"10016100-24-ハスミ" = "ハスミさん、後夜祭に必要な機材や消火道具の準備が終わりました。"
"10016100-25-正義実現委員会部員" = "そしてこちらが晄輪大祭中に消耗された弾丸の数量リストです……"
"10016100-26-ハスミ" = "ありがとうございます。皆さんのおかげで一息つけました。"
"10016100-27-ハスミ" = "後夜祭が始まったら、キャンプファイヤーの前で危険行為を始める生徒が出るかもしれません。安全管理にも気を配ってくださいね。"
"10016100-28-ハスミ" = "それでは、最後までよろしくお願いします。"
"10016100-29-正義実現委員会部員" = "は、はいっ！"
"10016100-30" = "[ns] \"最後まで本当お疲れ様、ハスミ。\""
"10016100-31-ハスミ" = "あ、先生。"
"10016100-32-ハスミ" = "今日は一日お疲れ様でした。おかげさまで無事、晄輪大祭を終えることができました。"
"10016100-33" = "[s] \"実行委員のみんなと比べたら大したことないよ。\""
"10016100-34" = "[ns] \"……ハスミは「晄輪大祭」、楽しかった？\""
"10016100-35-ハスミ" = "……私の感想が聞きたいのですか？"
"10016100-36-ハスミ" = "そうですね、結論から申し上げると……"
"10016100-37-ハスミ" = "……最悪でした。"
"10016100-38-ハスミ" = "試合で大きな活躍もできず、最後はゲヘナが総合優勝する姿を見守らなければなりませんでしたから。"
"10016100-39-ハスミ" = "不良生徒の事件や事故は絶えませんでしたし、ミレニアムの最新型ロボットは誤作動を起こすし……"
"10016100-40-ハスミ" = "しかも、ダイエットの天敵である高カロリーの屋台料理がたくさん……"
"10016100-41-ハスミ" = "……本当に最悪の「晄輪大祭」でした。"
"10016100-42-ハスミ" = "ですが、生徒同士が力を合わせて勝利を手にする姿や……"
"10016100-43-ハスミ" = "みんなの応援を受けながら晴ればれとした気持ちでトラックを走る経験もできましたので……"
"10016100-44-ハスミ" = "……楽しかったことは、否定できませんね。"
"10016100-45" = "[s] \"楽しかったならよかった。\""
"10016100-46-ハスミ" = "ただ、先ほど申し上げた通り、トリニティが総合優勝していたら晴れやかな気持ちだったのですが……"
"10016100-47-ハスミ" = "学園対抗リレーのアンカーは私だったので、誰にも文句は言えませんね。"
"10016100-48-ハスミ" = "ところで先生、後ろにいるその生徒たちは……"
"10016100-49" = "[s] \"後ろ……？\""
"10016100-50" = "[ns1] \"ユウカ、アコ……それにマリーまで？\"\n[ns2] \"3人とも、何してるの……？\""
"10016100-51-アコ" = "そ、その……先生が後夜祭をどうお過ごしになるのか伺えればと思い……。"
"10016100-52-マリー" = "の、覗き見をしてしまい、申し訳ありません……！"
"10016100-53-ユウカ" = "別にジンクスとか気にしてるわけじゃないけど……。"
"10016100-54-ユウカ" = "も、もしフォークダンスのパートナーが決まってないなら、私が付き合ってあげてもいいですよ……。"
"10016100-55-アコ" = "私はユウカさんと違って先生のパートナーに興味はありませんが、ハスミさんと先生がなにやら親しげに話している姿が見えたので……。"
"10016100-56-アコ" = "もしかしたら、後で先生をからかえるような面白い話でもないかなと思ったのですが……どうやら無駄足だったみたいですね。"
"10016100-57-ハスミ" = "皆さん、開会式の時と変わりませんね。"
"10016100-58-ハスミ" = "競技が終わったとはいえ、まだ実行委員会には後夜祭運営が残っているでしょう？"
"10016100-59-ハスミ" = "皆さん、実行委員会としての責任感はないのでしょうか……。"
"10016100-60-ユウカ" = "わ、私は急ぎの仕事を処理してから来たけど？"
"10016100-61-アコ" = "トリニティの生徒にそんなことを言われたくはありませんね。"
"10016100-62-ハスミ" = "ふふ……まぁ、でも。"
"10016100-63-ハスミ" = "たまには仕事を後回しにして、お祭りを楽しむのも良いでしょう。"
"10016100-64-ハスミ" = "キャンプファイヤーの準備が整うまで時間もかかりそうですし――"
"10016100-65-ハスミ" = "ティーパーティーから頂いた紅茶でも、ご一緒しませんか？"
"10016100-66" = "Get Set, Go！～キヴォトス晄輪大祭～"
