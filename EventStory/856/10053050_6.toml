[translation]
"10053050-1" = "第5話;山小屋に近づく影"
"10053050-2-レナ" = "ただいま……。\r\n"
"10053050-3-レナ" = "もう……無理……動けない……。"
"10053050-4-ツバサ" = "吾輩もだ……。"
"10053050-5" = "[ns1] \"みんな疲れただろうし、少し休んでて。\"\r\n[ns2] \"晩ご飯は私が……あれ？\""
"10053050-6" = "[ns3] \"か、身体が動かない……？\"\r\n[ns4] \"まさか、金縛り……！？\""
"10053050-7-コノカ" = "ただの筋肉痛っすよ、それ。\r\n"
"10053050-8-コノカ" = "みんな疲れてそうだし、晩ご飯はあたしがちゃっちゃと用意するっすね。"
"10053050-9-レナ" = "あ、ありがとう……。\r\n\r\n\r\n"
"10053050-10-レナ" = "その代わり、何が出てきても文句は言いっこなしですよ？\r\n"
"10053050-11-レナ" = "料理、できるんだよね……？\r\n\r\n\r\n\r\n"
"10053050-12-レナ" = "焼いて、煮て、ぶっ込めば大体は美味くなるんだから。楽勝楽勝～\r\n\r\n"
"10053050-13-レナ" = "全然安心できないんだけど！？聞いてる！？\r\n"
"10053050-14-レナ" = "今からでも追いかけたほうがいいかな……本当に不安なんだけど……。\r\n"
"10053050-15-レナ" = "ねぇ、ツバサ？"
"10053050-16-レナ" = "……。\r\n"
"10053050-17-レナ" = "……寝てる。"
"10053050-18-レナ" = "今日はずっと動きっぱなしだったし……。"
"10053050-19-レナ" = "眠くもなる……ふわぁ……。\r\n"
"10053050-20-レナ" = "私も……眠くなってき……た……。"
"10053050-21-レナ" = "……。"
"10053050-22" = "（ゴトッ）"
"10053050-23-レナ" = "ビックリした……。\r\n"
"10053050-24-レナ" = "いつの間にか寝落ちしてたのね……。"
"10053050-25-レナ" = "……。\r\n"
"10053050-26-レナ" = "コノカ……？コノカだよね？"
"10053050-27-レナ" = "……。\r\n"
"10053050-28" = "[ns5] \"コノカ？\"\r\n[ns6] \"何か手伝おうか？\""
"10053050-29-レナ" = "ちょ、ちょっと！コノカなんでしょ？\r\n\r\n"
"10053050-30-？？？" = "……。"
"10053050-31-レナ" = "もう分かってるんだから！#nこんな子どもみたいな悪ふざけ、うちの先輩たちじゃあるまいし――！\r\n"
"10053050-32-？？？" = "……。"
"10053050-33-レナ" = "せ、先生……？\r\n"
"10053050-34" = "[s7] \"ここは私に任せて。\"\r\n[s8] \"ちょっと見てくるよ。\""
"10053050-35-レナ" = "い、いや……私も行く。"
"10053050-36-レナ" = "なんか嫌な感じがするの……。先生は私の後ろにいて。\r\n"
"10053050-37-レナ" = "この扉の向こうに……誰かいる……。"
"10053050-38-レナ" = "…………。\r\n"
"10053050-39-コノカ" = "お待ちどお！！！！\r\n\r\n\r\n"
"10053050-40-レナ" = "！？！？\r\n"
"10053050-41-コノカ" = "なに！？なんで殴られたの！？\r\n\r\n\r\n"
"10053050-42-レナ" = "バカ！！どうしてそんな紛らわしい登場すんのよ！！心臓止まるかと思ったじゃない！"
"10053050-43-レナ" = "先生、レナは何を怒ってるんすか？\r\n"
"10053050-44" = "[s9] \"コノカじゃなかったの……？\"\r\n[s10] \"さっきまでドアの前にいたよね……？\""
"10053050-45-レナ" = "いいえ？あたしは来たばっか――\r\n\r\n"
"10053050-46-レナ" = "あ、ってことは……やっぱり見間違いじゃなかったんすね。\r\n"
"10053050-47-レナ" = "えっ！？どういう意味！？\r\n\r\n\r\n\r\n"
"10053050-48-レナ" = "いや～しじみの味噌汁を持ってくる途中で、山小屋から誰か出ていった気がして。\r\n"
"10053050-49-レナ" = "でもみんな中にいたから、見間違いかと思ってたんだよ。\r\n"
"10053050-50-レナ" = "じゃあ……ほんとに誰かいるの！？私たち以外に！？\r\n\r\n\r\n\r\n\r\n"
"10053050-51-レナ" = "感じたのがあたしだけじゃないなら、そりゃ本物っしょ？\r\n"
"10053050-52-レナ" = "それより、早くご飯にしよう！所長も起こしてさ。\r\n\r\n"
"10053050-53-レナ" = "今はもっと大事なことがあるでしょ！？\r\n\r\n\r\n"
"10053050-54-レナ" = "いやいや、ご飯より大事なことなんてこの世にないって。飯は生きる基本なんだから。#n所長～起きて～\r\n\r\n"
"10053050-55" = "（妙な空気を残したまま、夕食が始まった）"
"10053050-56" = "（コノカの料理はかなり美味しかった。ただ、油っぽくて味の濃いメニューが多かった）"
"10053050-57-レナ" = "なるほど……吾輩が寝ている間にそんなことが。\r\n\r\n"
"10053050-58-レナ" = "一応、聞いておくが……。\r\n"
"10053050-59-レナ" = "誰かの恨みを買っている者はいるかね？\r\n"
"10053050-60-レナ" = "いるわけないでしょ！！\r\n\r\n\r\n"
"10053050-61-コノカ" = "思い当たる節がたくさん。\r\n"
"10053050-62-レナ" = "えっ！？\r\n\r\n\r\n"
"10053050-63-コノカ" = "え～っと、最後に復讐しに来たヤツが2週間前だから……。\r\n\r\n"
"10053050-64-コノカ" = "そろそろ、また来てもおかしくない頃かな～\r\n"
"10053050-65-レナ" = "冗談でしょ？\r\n"
"10053050-66-コノカ" = "まさか。\r\n"
"10053050-67-コノカ" = "あたしだって公安局でタダ飯食ってるわけじゃないんで～\r\n"
"10053050-68-コノカ" = "……あ、でも今回は違うな。あたしの居場所を知ってるの姉御だけだし。\r\n"
"10053050-69-コノカ" = "……いや、そうとは限らない。\r\n"
"10053050-70-コノカ" = "うん？\r\n\r\n\r\n\r\n"
"10053050-71-コノカ" = "もしも誰かがコノカ君に強い恨みを抱いていて、こっそり尾行していたとしたら……#nむしろこうして山奥に来ている今こそが、襲うには絶好のタイミングのはずだ。\r\n"
"10053050-72-コノカ" = "もちろん、この仮説が成立するには相当な忍耐力と執念……#nそして何より復讐心が必要になるけれどね。\r\n\r\n"
"10053050-73-コノカ" = "さすがのあたしもそこまで恨まれるようなことは――\r\n\r\n\r\n"
"10053050-74-ツバサ" = "……ちょっとだけ？"
"10053050-75-コノカ" = "あるの！？\r\n\r\n\r\n"
"10053050-76-コノカ" = "こんな仕事してれば、ケガ人の1人や2人出るわけで――\r\n\r\n\r\n\r\n"
"10053050-77-コノカ" = "いやいやいや！ヴァルキュ ーレってそういうの許されるの！？"
"10053050-78-コノカ" = "正当防衛だから、正当防衛。\r\n\r\n\r\n\r\n"
"10053050-79-ツバサ" = "───七囚人。"
"10053050-80-ツバサ" = "噂なら聞いたことがある。#n母校での更生を諦められ、連邦生徒会の特殊部隊によって逮捕された7名の凶悪犯。矯正局に送られたものの……後に脱獄した、あの。\r\n"
"10053050-81-ツバサ" = "彼女らの狙いがコノカ君個人ではなく……公安局、つまりヴァルキューレ警察学校全体だったとしたら？\r\n"
"10053050-82-ツバサ" = "我々は今、未曾有の危機に直面しているのかもしれない……！"
"10053050-83-レナ" = "それは……さすがに飛躍しすぎじゃない？"
"10053050-84-コノカ" = "うーん、でも、なくはないかも。"
"10053050-85-コノカ" = "あるの！？！？"
"10053050-86-コノカ" = "用意周到、粘着質、そして異常にヴァルキューレを憎んでる脱獄犯。"
"10053050-87-コノカ" = "ちゃんと思い出せるもんすね。"
"10053050-88-コノカ" = "…………。"
"10053050-89-コノカ" = "…………。"
"10053050-90-コノカ" = "あ～よかった～"
"10053050-91-レナ" = "えっ？"
"10053050-92-コノカ" = "いや、てっきり幽霊でも出たのかと思って。"
"10053050-93-コノカ" = "脱獄犯なら話は早いっしょ？#nもう1回捕まえて、ムショにぶち込むだけなんだから。"
"10053050-94-コノカ" = "……あ、ムショって言い方は取り消し。矯正局に、っすね。"
"10053050-95-コノカ" = "さすがに軽すぎない……？"
"10053050-96-コノカ" = "七囚人って、私でも聞いたことあるんだけど。\r\n"
"10053050-97-コノカ" = "え、七囚人は知ってるのに、あたしが公安局なのは知らなかったってこと？\r\n\r\n\r\n\r\n"
"10053050-98-コノカ" = "あ、いや、ごめん。そういう意味じゃ――\r\n\r\n"
"10053050-99-コノカ" = "冗談冗談、謝らなくていいって！あははっ！\r\n\r\n\r\n"
"10053050-100-コノカ" = "とにかく、誰が来ようとあたしが守ってあげるから。\r\n"
"10053050-101-コノカ" = "これで一件落着！あ～ビビって損した～\r\n"
"10053050-102-コノカ" = "……。\r\n"
"10053050-103-ミライ" = "……。\r\n\r\n\r\n"
