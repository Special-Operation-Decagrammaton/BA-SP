[translation]
"10053030-1" = "第3話;幽霊バス"
"10053030-2-コノカ" = "うわぁ……。\r\n"
"10053030-3-コノカ" = "これ、大丈夫？\r\n"
"10053030-4-レナ" = "本当にこの道で合ってるの？\r\n\r\n\r\n"
"10053030-5-レナ" = "少なくとも地図上では正しいな。\r\n\r\n"
"10053030-6-レナ" = "……騙されてるとかじゃないよね？\r\n\r\n\r\n"
"10053030-7-レナ" = "信頼できるサイトで予約したし、今年のレビューも確認済みだ。\r\n"
"10053030-8-レナ" = "この吊り橋が、山小屋に着く唯一のルートさ。\r\n"
"10053030-9-レナ" = "渡ってる途中で切れたりしないよね……？\r\n\r\n\r\n\r\n"
"10053030-10-レナ" = "まぁ、最悪落ちても下は川だし。泳げば渡れるっしょ。\r\n\r\n\r\n"
"10053030-11-レナ" = "そんなわけないでしょ……。\r\n\r\n\r\n\r\n\r\n"
"10053030-12-レナ" = "そこのお嬢さん方。\r\n\r\n\r\n"
"10053030-13-謎の老人" = "もしや、向こうの山小屋に用があるのかね？"
"10053030-14-レナ" = "こんなコテコテの展開あるんだ……。"
"10053030-15-謎の老人" = "「あの山小屋」を目指しているのなら――"
"10053030-16-謎の老人" = "やめておきなさい。"
"10053030-17-レナ" = "えっ！？やっぱり詐欺なの！？騙された！？\r\n\r\n"
"10053030-18-謎の老人" = "いいや、山小屋は確かに存在する。じゃが……泊まらない方がいい。"
"10053030-19-謎の老人" = "理由は……言わなくても行けば分かるじゃろう。"
"10053030-20-コノカ" = "……！\r\n\r\n"
"10053030-21-謎の老人" = "忠告はしたぞ。今からでも他所を探すことじゃな。"
"10053030-22-ツバサ" = "ずいぶんと風変わりなご老人だな。"
"10053030-23-ツバサ" = "まあいいか。#nさあ、急ごう。山は日が落ちるのが早い。"
"10053030-24-ツバサ" = "いやいやいや！ちょっと待ってよ！#nまさか本当に行くつもり！？"
"10053030-25-ツバサ" = "行かないのかね？\r\n"
"10053030-26-コノカ" = "「忠告」とか言ってたし……どう考えてもあたし達を「待ってた」感じじゃん！？\r\n"
"10053030-27-ツバサ" = "コノカ君……。己を大切に思う気持ちは立派だ。だが――"
"10053030-28-ツバサ" = "世界が自分を中心に回っていると思い込むのは、誇大妄想の始まりだよ。"
"10053030-29-ツバサ" = "大丈夫、乗り越えられるさ。"
"10053030-30-レナ" = "そういえば、コノカって結構怖がりだったわよね。\r\n"
"10053030-31-レナ" = "この前なんて、ネットの怪談読んで眠れなくなった～って夜通し通話に付き合わされたし……。\r\n\r\n"
"10053030-32-コノカ" = "は！？絶対違うっすけど！？\r\n"
"10053030-33-コノカ" = "ほ、ほら！わざわざ忠告するってことは、相当危険なんじゃないかなーって……。\r\n"
"10053030-34-コノカ" = "ね、先生！先生も怪しいと思うっすよね！？"
"10053030-35" = "[s1] \"たしかに……偶然にしては出来すぎてるかな……。\"\r\n[s2] \"ちょっと気にはなるかも。\""
"10053030-36-コノカ" = "やっぱそうっすよね！？\r\n"
"10053030-37-ツバサ" = "……先に言っとくけど、この辺に他の宿はないよ。"
"10053030-38-ツバサ" = "一番近いところでも歩いて1時間。"
"10053030-39-ツバサ" = "げっ、それは嫌だな。"
"10053030-40-ツバサ" = "もう腹をくくろう。#n当日キャンセルは返金されないんだし。"
"10053030-41-コノカ" = "先生は味方っすよね！？"
"10053030-42" = "[ns3] \"歩いて1時間……。\"\r\n[ns4] \"タクシーなんて走ってないし……。\""
"10053030-43" = "[ns] \"コノカ。\""
"10053030-44" = "[ns] \"勇気を出さなきゃいけない時もあるんじゃないかな。\""
"10053030-45-コノカ" = "先生！？！？"
"10053030-46-コノカ" = "よし、行こう。幽霊が出ても、コノカ君は吾輩が守ってあげよう。\r\n"
"10053030-47-コノカ" = "ひぃ！やめて！そういうこと言うと「出る」んだから！\r\n\r\n\r\n\r\n"
"10053030-48-コノカ" = "言うだけで出るなら、とっくに観測されている。#nほら、手をつなごうじゃないか。\r\n"
"10053030-49-コノカ" = "わ、分かったから！引っ張らないで！自分のペースで歩くから！\r\n\r\n\r\n\r\n\r\n"
"10053030-50-レナ" = "……中は思ったよりキレイなんだ。"
"10053030-51-レナ" = "とんだあばら家を引かされたと思ったけど、意外と快適なんじゃない？\r\n"
"10053030-52-コノカ" = "れ、レナ……ここ……なんかゾクッとしない？\r\n"
"10053030-53-レナ" = "……まださっきの引きずってるの？"
"10053030-54-コノカ" = "違うって！本当に感じるんだってば！#n空気が冷たいっていうか……！\r\n"
"10053030-55-ツバサ" = "ふむ。局所的な低温――いわゆる「コールドスポット現象」か。#nたしかに幽霊が出現する時の典型的な兆候だ。"
"10053030-56-ツバサ" = "だが、室内に不自然な温度変化は観測されていない。心配無用だよ。\r\n"
"10053030-57-レナ" = "何それ、カメラ？\r\n"
"10053030-58-ツバサ" = "正確には撮影機能付きの赤外線カメラだ。#nたとえ暗闇だろうと熱源を観測できる優れものさ。\r\n"
"10053030-59-レナ" = "ガチすぎでしょ……。"
"10053030-60-ツバサ" = "当然だろう？我々が追うのは、誰も捕らえたことのない伝説の生物なのだからね。"
"10053030-61-ツバサ" = "さて、コノカ君。ここに異常は無い。安心してくれたまえ。"
"10053030-62-コノカ" = "さっすが所長！頼もしい～！\r\n"
"10053030-63-ツバサ" = "ふふっ、プロだからな。\r\n"
"10053030-64-ツバサ" = "……おや？先生、何か気になることでも？"
"10053030-65" = "[ns5] \"いや、プロって言うから……。\"\r\n[ns6] \"部活動でやってるの？\""
"10053030-66-ツバサ" = "……！\r\n"
"10053030-67-ツバサ" = "そ、それは……良い質問だが……後にしよう！\r\n\r\n"
"10053030-68-ツバサ" = "なにせ今は時間が惜しい！日が沈むと、今日1日を棒に振ってしまうからね！\r\n"
"10053030-69-コノカ" = "急にどうしたんすかね？"
"10053030-70-レナ" = "部活の話はしたくない気持ち……私はめっちゃ分かる。\r\n"
"10053030-71" = "[s7] \"あれ、2人も知らないの？\"\r\n[s8] \"ツバサがどんな部活に入ってるのか。\""
"10053030-72-コノカ" = "えっと……それは――\r\n"
"10053030-73-コノカ" = "あれ？思い返してみれば、ツバサのこと全然知らないっすね？"
"10053030-74-レナ" = "当たり前じゃない？SNSの相互ってだけなんだから。"
"10053030-75-コノカ" = "[ruby=きぬい]衣斐[/ruby]レナ。ワイルドハント芸術学院の1年生、専攻はファッションデザイン。"
"10053030-76-レナ" = "えっ、ちょっ、なに？\r\n"
"10053030-77-コノカ" = "学院内の寮の4棟、部屋番号は――"
"10053030-78-コノカ" = "不吉な……404号室に住んでる。#nルームメイトは先輩が3人。\r\n"
"10053030-79-コノカ" = "ん？ってことは、部屋番号だけじゃなくて人数も……うわ、縁起悪っ。\r\n"
"10053030-80-コノカ" = "ちょっと！なんで知ってるの！？#nまさか……ストーカー！？\r\n\r\n"
"10053030-81-コノカ" = "ちっちっち。SNSってのは情報の宝庫なんすよ。\r\n"
"10053030-82-コノカ" = "特にSNSなんてリアルタイムで色々呟くっしょ？#nぽろぽろと色々個人情報が漏れてくわけ。"
"10053030-83-コノカ" = "たとえばたまにアップする写真で自宅からコンビニまでの距離、通学路、坂道の有無――全部つなぎ合わせれば、#n寮の棟くらいは特定できるっすよ。"
"10053030-84-レナ" = "へ、部屋番号までは分からないんじゃない！？"
"10053030-85-コノカ" = "前に「部屋番号がツイてない」って愚痴ってたじゃん？#n不吉な数字っていえば4か6。4棟住みなのは確実だし、そうなると404号室かな～って。#n606号室だとしても第4棟とは揃ってないし？"
"10053030-86-レナ" = "……探偵？\r\n"
"10053030-87-コノカ" = "ん～惜しい！"
"10053030-88-コノカ" = "あたしは泣くスケバンも黙る公安局所属！#nだからこのくらいお茶の子さいさい～ってわけ。\r\n"
"10053030-89-レナ" = "あ、本当にヴァルキューレだったんだ。#nただのファッションだと思ってたのに。"
"10053030-90-コノカ" = "え～「チンピラみたいでヴァルキューレっぽくない」って？"
"10053030-91-レナ" = "そこまでは言ってないけど！？"
"10053030-92-コノカ" = "でも、少しは思ったんじゃない？"
"10053030-93-レナ" = "違うってば！\r\n"
"10053030-94-コノカ" = "いや～でも全く考えてない訳じゃないでしょ～？#nほんの少しは思ったよねぇ？"
"10053030-95-レナ" = "まぁ……ちょっとだけ……。\r\n"
"10053030-96-コノカ" = "せんせ～！レナがあたしのことチンピラって言いましたぁ！\r\n"
"10053030-97-レナ" = "自分で誘導したんでしょ！！\r\n\r\n"
"10053030-98" = "[s9] \"コノカ、レナをあんまりからかわないであげて。\"\r\n[s10] \"レナ、コノカは先輩なんだから……。\""
"10053030-99-コノカ" = "うっす！"
"10053030-100-レナ" = "コノカの肩を持つの！？\r\n\r\n\r\n"
"10053030-101-レナ" = "あぁもう！からかうのやめなさいってば！\r\n"
"10053030-102-ツバサ" = "……報告によれば、ツチノコの目撃情報は白川山の渓流沿いに集中している。"
"10053030-103-ツバサ" = "もしもツチノコが生物なら水辺の近くに生息していると考えるのが妥当だろう。#n加えて人の立ち入らない山や谷ならさらに可能性が高い。"
"10053030-104-コノカ" = "了解っす～！\r\n\r\n"
"10053030-105-コノカ" = "白川山ぁぁ～～白川山行きのバスはぁぁぁぁ～～"
"10053030-106-コノカ" = "……あれ？"
"10053030-107-コノカ" = "ここの路線、1日2本だけ？"
"10053030-108-コノカ" = "そんなもんでしょ。田舎だし。"
"10053030-109-コノカ" = "不便だ……。\r\n"
"10053030-110-コノカ" = "でもまぁ次が30分後だからまだマシかな。適当にだべってたらそのうち来るかぁ。"
"10053030-111-ツバサ" = "おや？バスが来たみたいだ。\r\n"
"10053030-112-コノカ" = "おかしい。時刻表よりだいぶ早い……。"
"10053030-113-コノカ" = "……。\r\n"
"10053030-114-コノカ" = "…………。"
"10053030-115-コノカ" = "……はっ！"
"10053030-116-コノカ" = "まさか……！"
"10053030-117-コノカ" = "ツチノコに近づいたことで、失われたあたしの運勢が戻ってきたんだ！\r\n"
"10053030-118-コノカ" = "ヘビを追えっていうのは正しかったんだよ！"
"10053030-119-レナ" = "こんなに早く来るの、運の良し悪しなのかな……。いや、偶然だよね。\r\n"
"10053030-120-ツバサ" = "ちょっと待ってくれ。\r\n"
"10053030-121-ツバサ" = "あのバスのナンバー……おかしいように思うのは吾輩だけかね？"
"10053030-122" = "[s11] \"「し44‐66」……？\"\r\n[s12] \"なんか……不吉だね……。\""
"10053030-123-ツバサ" = "知っているとは思うが、車のナンバーに「し」は使わない。#n[ruby=し]死[/ruby]を連想して縁起が悪いからね。\r\n"
"10053030-124-ツバサ" = "しかも「44-66」だなんて……。"
"10053030-125-レナ" = "あれ？もしかして……。\r\n"
"10053030-126-ツバサ" = "何か知っているのかね？"
"10053030-127-レナ" = "知ってるってほどじゃないけど……前にSNSで似た話が流行ってたの。\r\n"
"10053030-128-レナ" = "幽霊が乗るバスだって……。\r\n"
"10053030-129-ツバサ" = "幽霊……？"
"10053030-130-レナ" = "よくある話。知らずに乗ったら幽霊だらけで、慌てて降りたとか……。"
"10053030-131-レナ" = "寝過ごしたらキヴォトスそっくりの異世界に着いたとか……そういうよくある怪談話。"
"10053030-132-レナ" = "しばらくそういう話がSNSで流行ってたのよ。"
"10053030-133-ツバサ" = "で、その怪談に出てくるバスのナンバーが、どれも「し44-66」だったというわけか。"
"10053030-134-レナ" = "た、たまたまでしょ！私は信じてないよ？\r\n"
"10053030-135-レナ" = "昼間っから、初めて来た田舎で、怪談そっくりなバスが偶然来るとか……#n出来すぎてるから！"
"10053030-136-ツバサ" = "だがもしも……目の前のあれが「本物」だとしたら……？"
"10053030-137-レナ" = "……。"
"10053030-138-コノカ" = "乗らないんすかー？バス来てますけど～\r\n"
"10053030-139" = "[ns13] \"そのバスじゃない気がする。\"\r\n[ns14] \"次のバスを待とう。\""
"10053030-140-コノカ" = "え？でもここには他の路線なんて……。"
"10053030-141-コノカ" = "……？\r\n"
"10053030-142-コノカ" = "なんだこれ。おかしいっすね。系統番号も行先表示もない……。"
"10053030-143-コノカ" = "すみませ～ん、運転手さん！このバス、白川山行きっすか？"
"10053030-144-コノカ" = "…………。\r\n"
"10053030-145-コノカ" = "もしも～し、聞こえてます？"
"10053030-146-コノカ" = "…………。\r\n"
"10053030-147-コノカ" = "怪しい……。"
"10053030-148-コノカ" = "……これは、出すしかないみたいっすね。\r\n"
"10053030-149-ツバサ" = "出すって……銃？"
"10053030-150-レナ" = "幽霊相手に喧嘩を売るのは得策ではない気がするが……。"
"10053030-151-カンナ" = "先生、コノカをしっかり見ていてください。"
"10053030-152-カンナ" = "「迷信」が絡むと、必ず「事件」を起こします。\r\n"
"10053030-153" = "[ns15] （カンナの言ってた「事件」って……）\r\n[ns16] \"コノカ、一旦このバスは見送って――\""
"10053030-154-コノカ" = "いえ、先生。こういうときは、これが一番効くんすよ。"
"10053030-155-コノカ" = "やっぱこういう時に使わないと。"
"10053030-156" = "[ns17] \"……それは？\"\r\n[ns18] \"生徒手帳？\""
"10053030-157-コノカ" = "いや～全然分かってないっすね。"
"10053030-158-コノカ" = "まぁ見ててください。キヴォトスで運転してる連中は、銃よりこれにビビるんすから。\r\n"
"10053030-159-コノカ" = "運転手さん、ヴァルキューレっす！免許証見せてもらってもいいっすか？\r\n"
"10053030-160-怪しい運転手" = "…………。"
"10053030-161-コノカ" = "聞こえませんでしたか～？免許証の確認っすよ。#n拒否したら道路交通なんとか法の違反になるんで。切符切りますよ？"
"10053030-162-怪しい運転手" = "…………。"
"10053030-163-コノカ" = "あっ！？おい！！こら、逃げんな！止まれって！\r\n\r\n"
"10053030-164-レナ" = "……行っちゃった。"
"10053030-165-ツバサ" = "幽霊でも、違反切符は怖いらしい……。\r\n"
"10053030-166-コノカ" = "ちぇっ……次に見つけたら覚えとけよ……。"
"10053030-167-コノカ" = "でも、よく怪しいって分かったっすね。見た目は普通のバスだったのに。"
"10053030-168" = "[s19] \"レナが教えてくれたんだ。\"\r\n[s20] \"ツバサのおかげかな。\""
"10053030-169-レナ" = "えっ！？そ、そうそう！なんか怪しかったっていうか……！\r\n"
"10053030-170-レナ" = "（急に呼ばれたらびっくりするでしょ！？）\r\n"
"10053030-171-コノカ" = "ふーん？"
"10053030-172-ツバサ" = "え？まぁ、これでも専門家だからな！そういう嗅覚があるというか……。\r\n"
"10053030-173-コノカ" = "へぇ？どうやって見分けるんだ？"
"10053030-174-ツバサ" = "そ、それは……コノカ君にはまだ早いかな……！\r\n"
"10053030-175-コノカ" = "ふーん？"
"10053030-176-コノカ" = "あ、今度こそ本物っぽくないっすか？"
"10053030-177-レナ" = "今度こそ……いや、別にさっきのが幽霊バスだったとか思ってないけど！？"
"10053030-178-親切な運転手" = "お待たせしました～足元お気をつけて～"
"10053030-179-レナ" = "こんにちは。\r\n\r\n"
"10053030-180-レナ" = "あの、ちょっと変な質問かもしれないんですけど……#nこの前にもバスって走ってますか？\r\n\r\n"
"10053030-181-親切な運転手" = "え？前に？それはおかしいですね。"
"10053030-182-親切な運転手" = "この路線、うちの1台しか走ってませんよ。"
"10053030-183-レナ" = "……！？\r\n\r\n\r\n"
"10053030-184" = "（――結局、あの怪しいバスはどこから来て、どこへ消えたのか。#n私たちは最後まで知ることはなかった。）"
