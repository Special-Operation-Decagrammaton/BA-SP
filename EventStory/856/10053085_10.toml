[translation]
"10053085-1-ツバサ" = "……はっ！？"
"10053085-2-ツバサ" = "ど、どうなったんだ？戦闘が始まったところまでは覚えているんだが……。\r\n"
"10053085-3-レナ" = "戦闘が始まった瞬間にツルっと転んで、そのまま気絶してたよ。"
"10053085-4-ツバサ" = "肝心な時に……まったく、面目ない。\r\n"
"10053085-5-ツバサ" = "ということは……すべてレナ君が1人で倒してくれたということかな？"
"10053085-6-レナ" = "いや、なんでそうなるの……。どう考えてもコノカでしょ。\r\n"
"10053085-7-ツバサ" = "うん？冗談にしてはずいぶん辛辣だね。"
"10053085-8-コノカ" = "さてと～\r\n"
"10053085-9-コノカ" = "どうやってお仕置きしてやろっかな～？\r\n"
"10053085-10-チンピラA" = "ま、待ってくれ！もう降参したじゃんか！#nまさか丸腰のヤツを殴るとか、そういうのじゃないよな！？\r\n\r\n\r\n\r\n\r\n\r\n"
"10053085-11-チンピラA" = "何を寝ぼけたこと言ってんだ。殴るに決まってるだろうが。\r\n\r\n\r\n"
"10053085-12-チンピラA" = "ヴァルキューレがそんなことしていいのかよ！？\r\n\r\n\r\n\r\n\r\n"
"10053085-13-チンピラA" = "あんたらが相手なら問題無い。これだからヴァルキューレはやめられないんだ。\r\n\r\n\r\n"
"10053085-14-チンピラA" = "今まで散々ちょっかいをかけられた分はこれでチャラにしといてやるよ。\r\n\r\n"
"10053085-15-チンピラA" = "ま、待って！なに言ってんだよ？うちらは何もやってない！冤罪だ！！\r\n\r\n\r\n\r\n\r\n\r\n"
"10053085-16-チンピラA" = "電話線切って、橋壊したの、あんたらだろ？\r\n\r\n"
"10053085-17-チンピラA" = "あ……それはまぁ、そうなんだけど……。\r\n\r\n\r\n\r\n\r\n"
"10053085-18-チンピラA" = "正直、戦車まで引っ張り出しておいて冤罪はないと思うけどな？\r\n\r\n\r\n\r\n\r\n"
"10053085-19-チンピラA" = "お前はどっちの味方なんだよ！？\r\n\r\n\r\n\r\n\r\n"
"10053085-20-チンピラA" = "コントか何かか？\r\n\r\n"
"10053085-21-チンピラA" = "……レナ、魔法は存在しないんだっけ？今から、1つ見せてあげるよ。\r\n\r\n"
"10053085-22-コノカ" = "「本音しか言えなくなる魔法」ってやつだ。すっごい不思議なんだな、これが。"
"10053085-23-チンピラA" = "ち、ちがっ……います！本当に！誓って嘘じゃないです！"
"10053085-24-チンピラA" = "た、ただ、副局長をおびき出そうと思ってツチノコの噂を流したことは事実なんだけど――"
"10053085-25-チンピラA" = "でも本当に……本当にそれ以外のことは何もしてない……です……。"
"10053085-26-ツバサ" = "……ちょっと待て、今なんと言った？\r\n"
"10053085-27-ツバサ" = "ツチノコの噂を流したのは君たちだと？"
"10053085-28-チンピラA" = "は？なんだよ急に。お前誰だよ？\r\n\r\n\r\n"
"10053085-29-ツバサ" = "ツチノコは……存在しないということなのか？\r\n"
"10053085-30-チンピラA" = "そりゃそうだろ。ツチノコなんているわけねぇって。\r\n\r\n"
"10053085-31-チンピラA" = "オカルト好きの副局長なら釣れると思って、噂を適当にでっち上げてネットにばらまいただけだよ。\r\n\r\n\r\n"
"10053085-32-チンピラA" = "は！？やっていいことと悪いことがあるよねぇ！？\r\n\r\n\r\n"
"10053085-33-チンピラA" = "だ、だけどよ！常識的に考えて、今どきツチノコなんか信じるやつ――\r\n\r\n\r\n\r\n"
"10053085-34-チンピラA" = "でも「騙された方が悪い」は、典型的な加害者のセリフだよな。\r\n\r\n\r\n\r\n\r\n"
"10053085-35-チンピラA" = "だから！お前さっきからどっちの味方なんだよ！？\r\n\r\n\r\n\r\n\r\n\r\n"
"10053085-36-ツバサ" = "……。"
"10053085-37-ツバサ" = "……そうか、ツチノコは最初から存在しなかったのか。\r\n"
"10053085-38-ツバサ" = "ツバサ……？"
"10053085-39-ツバサ" = "ツチノコ……宇宙人を見つけられたら、あのうるさい「セミナー」も……#nもう一度我が部を見直してくれるかもと思っていたんだ。\r\n"
"10053085-40-ツバサ" = "そうすれば、またみんなで部活動ができるかもしれないって……。"
"10053085-41-レナ" = "……。"
"10053085-42-ツバサ" = "……いいや、大丈夫。こうなることも、ある程度は想定していた。\r\n"
"10053085-43-ツバサ" = "ツチノコは発見できずとも、部を再建する手段は他にもある……うん！"
"10053085-44" = "[s1] \"よし、今日もツチノコを探しに行こうか。\"\r\n[s2] \"もうすぐ夜が明けるし。\""
"10053085-45-ツバサ" = "聞いていなかったのか？ツチノコは存在しないって……。\r\n"
"10053085-46-レナ" = "うん、自分たちで流した噂だってはっきり言ってたね。"
"10053085-47-レナ" = "あ、勘違いしないでよ？私は最初っからツチノコなんて信じてなかったから。\r\n"
"10053085-48-レナ" = "……だから、私は何も変わってないんだよね。"
"10053085-49-ツバサ" = "レナ君……。\r\n"
"10053085-50-コノカ" = "はぁ～……なんであたしの好きな展開をピンポイントで踏んでくるかなぁ。\r\n\r\n"
"10053085-51-コノカ" = "おい、あんたら。"
"10053085-52-チンピラA" = "はいぃっ！？"
"10053085-53-チンピラA" = "今日の件はなかったことにしてやる代わりに、少し手伝ってもらおうか。"
"10053085-54-チンピラA" = "でも、ツチノコなんていないって――"
"10053085-55-チンピラB" = "「人の言葉を理解できるようになる魔法」って右ストレートだっけ？左フックだったっけ？"
"10053085-56-チンピラA" = "ひっ、ひいいぃぃっ！！わ、分かりました！！みんなツチノコ探すぞ！！#n山小屋の周りを片っ端から探すんだ！"
"10053085-57-チンピラA" = "鱗一枚たりとも見逃すなよ！"
"10053085-58-レナ" = "うーん……。"
"10053085-59-レナ" = "でもやっぱり引っかかるんだよね……。\r\n"
"10053085-60" = "[s3] \"どうかした？\"\r\n[s4] \"何か気になることでもあるの？\""
"10053085-61-レナ" = "結局さ、写真に写ってた「白い影」って誰？"
"10053085-62-コノカ" = "え？電話線を切って逃げてるところが映り込んだんじゃないの？"
"10053085-63-レナ" = "最初は私もそう思ってたけど……。"
"10053085-64-レナ" = "白い服着てた子、いなかったよね。"
"10053085-65-コノカ" = "……え？\r\n"
"10053085-66-コノカ" = "な、なんなんですか！？あなた達！"
"10053085-67-チンピラA" = "なんだコイツ。うちらが戦ってる間ずっと隠れてたのか？"
"10053085-68-チンピラB" = "怪しすぎるだろ。"
"10053085-69" = "[ns5] \"あれ、この声は……？\"\r\n[ns6] \"まさか……？\""
"10053085-70-ツバサ" = "部長！？"
"10053085-71-チンピラB" = "あ、あはは……。ど、どうも。お久しぶりです。"
"10053085-72" = "[s7] \"ミライが……部長……？\"\r\n[s8] \"まさか、ツバサの所属してた部って……。\""
"10053085-73-ツバサ" = "ああ、まだ言っていなかったな。"
"10053085-74-ツバサ" = "吾輩は「疑似科学部」の部員だよ。正確に言うならば「元」部員なのだけどね……。"
"10053085-75-ツバサ" = "先生もミライ部長と顔見知りだったとは。"
"10053085-76-ミライ" = "いやぁ～……知らないままの方が幸せだった気もしますけど……。\r\n\r\n"
"10053085-77-コノカ" = "疑似科学部？ミライ部長？どっかで聞いたことあるような……？"
"10053085-78-ミライ" = "あっ、えっと、一応、誤解がないよう先に言っておきますけど……。"
"10053085-79-ミライ" = "今回に限っては、本当に悪意とかないですから！"
"10053085-80-ミライ" = "いや、別に普段から悪意があったわけでもないんですけど……。"
"10053085-81-コノカ" = "あー、思い出した。手配書で見たことあるんだ。詐欺師だよな？"
"10053085-82-ミライ" = "なっ、なんて人聞きの悪い！#nまだ検証されてない分野の応用科学を商品化して販売しているだけの発明家です！"
"10053085-83-コノカ" = "ゲルマニウムブレスレットとか、磁気布団とかだっけ？"
"10053085-84-ミライ" = "うちの部の稼ぎ頭の商品ではありますけど……。"
"10053085-85-コノカ" = "うん、詐欺師だな。"
"10053085-86-コノカ" = "というか、あたし「疑似科学部」にまで恨み買ってたっけ？\r\n\r\n\r\n\r\n"
"10053085-87-コノカ" = "はい？何の話ですか？\r\n\r\n"
"10053085-88-コノカ" = "あんた、あたしに復讐しにここまで来たんじゃないのか？\r\n\r\n\r\n"
"10053085-89-コノカ" = "復讐？そんな一銭にもならない非効率的なこと、わざわざするわけないじゃないですか。\r\n"
"10053085-90-コノカ" = "もしかしてあなた、世界が自分を中心に回ってると思い込むタイプですか？#nそれ、誇大妄想の初期症状ですよ？\r\n\r\n"
"10053085-91-コノカ" = "……じゃあ何しに来たのさ？\r\n\r\n\r\n"
"10053085-92-コノカ" = "それは、その……トップシークレットと言いますか……。\r\n\r\n"
"10053085-93-コノカ" = "レナ、これからマジックが始まるよ～\r\n\r\n\r\n\r\n"
"10053085-94-コノカ" = "待ってください！何するつもりですか！ちょっ、近寄らないでください！#nしゃべります！話せばいいんでしょう！？話しますから！"
"10053085-95-コノカ" = "これだから体育会系は野蛮で苦手なんだよなぁ……。\r\n\r\n\r\n\r\n"
"10053085-96-コノカ" = "とにかくですね、厳密に言うと私も被害者なんですよ！\r\n\r\n"
"10053085-97-コノカ" = "ほぉ？\r\n\r\n\r\n\r\n"
"10053085-98-コノカ" = "その……これ、あの子には内緒にしておいてほしいんですけど……。\r\n\r\n"
"10053085-99-ミライ" = "よく知らない人たちとツバサが旅行に行く、とたまたま知り合いづてに聞いてしまいまして……。"
"10053085-100-ミライ" = "別に悪い意味じゃないんですけど、ツバサってちょっと極端じゃないですか。#n[ruby=・]ち[/ruby][ruby=・]ゃ[/ruby][ruby=・]ん[/ruby][ruby=・]と[/ruby][ruby=・]信[/ruby][ruby=・]じ[/ruby][ruby=・]て[/ruby][ruby=・]い[/ruby][ruby=・]る[/ruby]から、ちょっと社会性がないといいますか……。"
"10053085-101-コノカ" = "で、心配になって後をつけて来た、と。"
"10053085-102-ミライ" = "いや、私だってこんなド田舎に長居するつもりなんてなかったんですよ！？#n元気にやってるのを確認したらさっさと帰る予定で！\r\n"
"10053085-103-ミライ" = "なのにこの辺り一帯、電波がまともに入らないじゃないですか！"
"10053085-104-ミライ" = "帰ろうとしたら橋は壊れてるし！\r\n"
"10053085-105-ミライ" = "おまけに一緒に居る人がまさかヴァルキューレの人だったなんて！！"
"10053085-106-ミライ" = "私がどれだけ苦労したか分かりますか！？\r\n\r\n\r\n"
"10053085-107-レナ" = "見事なまでの逆ギレ……。\r\n"
"10053085-108-コノカ" = "素直に顔出して助けてって言えばよかったんじゃ……？\r\n\r\n"
"10053085-109-コノカ" = "出来るわけないじゃないですか！これでも一応、部長なんですよ？#n尊敬される立場なんです！"
"10053085-110-レナ" = "その台詞言ってる時点で、あんまり尊敬されてなさそうなんだけど……。\r\n"
"10053085-111-レナ" = "で、結局あの写真に写ってた白い人影って……。"
"10053085-112-ミライ" = "写真？あぁ、おそらく私ですね。どれだけ驚いたと思ってるんですか。#nいきなり窓を開けて叫ぶだなんて、心臓に悪いですよ。"
"10053085-113-レナ" = "なんていうか……拍子抜けもいいとこなんだけど。"
"10053085-114-チンピラA" = "姐さん、この女どうします？縛っときます？"
"10053085-115-チンピラA" = "え、ちょ、ちょっと待ってください！？"
"10053085-116-チンピラA" = "お前、詐欺師なんだろ？しかも指名手配されてるって話だし。\r\n\r\n\r\n\r\n"
"10053085-117-チンピラA" = "あなた達には人の心とかないんですか！？#nさっきのハートフルな話を聞いておいて、それでもそんなこと言うなんて！\r\n\r\n\r\n\r\n"
"10053085-118-コノカ" = "うーん……まぁ、放っときゃいいでしょ。\r\n"
"10053085-119-コノカ" = "あたし、そんなに真面目じゃないからね。#nそれに手配書の隅っこに載ってる雑魚の名前まで覚えてないし。#nそもそも、今は休暇中だし。"
"10053085-120-コノカ" = "部員が心配で後を追って来た部長？そんなの、名前までは覚えてないねぇ。\r\n"
"10053085-121" = "[s] \"本当にいいの？\""
"10053085-122-コノカ" = "なに言ってんすか、いいわけないっすよ。規則通りなら即逮捕っすよ。\r\n"
"10053085-123-ミライ" = "うっ……！"
"10053085-124-コノカ" = "でもね。"
"10053085-125-コノカ" = "あたし、元から規則とか守らない質なんで。"
"10053085-126-コノカ" = "あ、これ姉御には内緒でお願いしますよ？"
"10053085-127-コノカ" = "見逃してくれるんですか？\r\n\r\n\r\n"
"10053085-128-コノカ" = "見逃す？まさか。あたしは何も見てなかったの。\r\n\r\n"
"10053085-129-コノカ" = "でも後で裏切ったりとか……。\r\n"
"10053085-130-コノカ" = "あのさぁ、まだこの話続けるの？もう少し察しろって。\r\n\r\n\r\n\r\n"
"10053085-131-コノカ" = "はい……すみませんでした……。\r\n\r\n\r\n"
"10053085-132-ツバサ" = "あの、さっきからずいぶん長く話し込んでいたみたいだけど……。\r\n\r\n\r\n"
"10053085-133-ツバサ" = "い、いえいえいえ！その、なんて言うかですね！\r\n\r\n"
"10053085-134-ツバサ" = "あ、ツチノコ！実は私もツチノコを探しに来てまして！#nそれでしばらくこの山小屋に滞在しようかなって……。\r\n\r\n"
"10053085-135-ツバサ" = "本当か！？じゃあまた前みたいに一緒に活動できるってこと！？\r\n\r\n\r\n"
"10053085-136-ツバサ" = "そ、それはちょっと難しいといいますか……。#n何しろ私は逃亡生活ですし、疑似科学部も盛大に目をつけられてますし……。\r\n\r\n"
"10053085-137-ツバサ" = "でも――\r\n"
"10053085-138-ツバサ" = "たまにはこうやって顔くらいは出すかも知れないですね。\r\n"
"10053085-139-ツバサ" = "……！\r\n"
"10053085-140-ツバサ" = "……もしかしたら。\r\n"
"10053085-141-ツバサ" = "ここまでツチノコを探してきた、この冒険そのものが――#n本当のツチノコだったのかもしれないね。"
"10053085-142-レナ" = "え、まとめ方それでいいの……？\r\n\r\n"
