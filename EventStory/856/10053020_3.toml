[translation]
"10053020-1" = "第2話;そういう設定の少女"
"10053020-2-レナ" = "なんで先生がここにいるの！？\r\n\r\n"
"10053020-3" = "[s1] \"えっ！？レナ！？\"\r\n[s2] \"どうしてここに！？\""
"10053020-4-レナ" = "どうしてって……普通に外出申請したのよ。"
"10053020-5-レナ" = "いや、まぁ……うちの学園が他校からどう見られてるかは知ってるけど……。\r\n"
"10053020-6-レナ" = "別に「ワイルドハント」って、生徒を閉じ込めてるわけじゃないんだからね？"
"10053020-7-レナ" = "外出手続きがちょっと面倒なだけで……。\r\n"
"10053020-8-コノカ" = "あれ？先生と「ぐるみん」、知り合いだったんすか？\r\n\r\n\r\n\r\n"
"10053020-9" = "[s3] \"うん、よく知ってる。\"\r\n[s4] \"前世からの縁の後輩だよ。\""
"10053020-10-コノカ" = "あははっ、どんな関係っすか、それ。\r\n\r\n\r\n\r\n"
"10053020-11-コノカ" = "シャーッ！！先輩たちじゃないんだから変なこと言わないで！#n話がややこしくなるでしょ！！\r\n\r\n\r\n"
"10053020-12-コノカ" = "というか、なんで先生がここにいるの！？\r\n"
"10053020-13-コノカ" = "私たち3人でツチノコ探しに行くって話だったでしょ？\r\n"
"10053020-14-コノカ" = "ごめんごめん、伝えるの忘れてて。\r\n\r\n\r\n\r\n"
"10053020-15-コノカ" = "でもほら、人数多いほうが楽しいっしょ？\r\n\r\n\r\n"
"10053020-16-コノカ" = "陽キャ理論を押しつけないでよ……。\r\n\r\n"
"10053020-17-コノカ" = "先生は「ぐるみん」……レナとは知り合いみたいなんで、紹介は省略しますね。\r\n\r\n\r\n"
"10053020-18-コノカ" = "それじゃあ――\r\n\r\n\r\n"
"10053020-19-ツバサ" = "……。\r\n\r\n"
"10053020-20" = "[ns5] \"なんでこっちを指さしてるの……？\"\r\n[ns6] 差し出された指に、自分の指を合わせる。"
"10053020-21-ツバサ" = "……テレパシーは失敗か。\r\n\r\n\r\n"
"10053020-22-ツバサ" = "どうやら先生とは周波数が合わないようだ。\r\n\r\n\r\n\r\n"
"10053020-23-ツバサ" = "……！\r\n\r\n\r\n"
"10053020-24-ツバサ" = "やはり！先生も私と同じオーラを持っているのだな！\r\n\r\n\r\n\r\n"
"10053020-25-ツバサ" = "……初めまして。そして、歓迎しよう。\r\n"
"10053020-26-ツバサ" = "吾輩の名前は[ruby=はねもと]羽咋[/ruby]ツバサ。#nこの調査隊のリーダーであり、「モー超常現象研究所」の所長を務めている。"
"10053020-27-ツバサ" = "どうか「ツバサ所長」と呼んでくれたまえ。\r\n"
"10053020-28" = "[ns7] \"所長……？\"\r\n[ns8] \"えっと、レナ……？\""
"10053020-29-レナ" = "言いたいことは分かるけど……#n一応常識人だから安心して。\r\n"
"10053020-30-レナ" = "「モー超常現象研究所」っていうのは、ツバサがやってるチャンネルの名前。#n配信者なの。"
"10053020-31-レナ" = "だからまぁ……「そういう設定」ってやつ。"
"10053020-32-レナ" = "設定？レナ君、それは聞き捨てならないな。\r\n"
"10053020-33-ツバサ" = "我が研究所は科学的手法に基づいて超常現象を調査する、#nキヴォトスでも唯一無二の団体だ。"
"10053020-34-レナ" = "団体じゃなくて1人じゃないの？"
"10053020-35-ツバサ" = "そ、それは……まぁちょっと複雑な大人の事情があってだね……。\r\n"
"10053020-36-ツバサ" = "とにかく先生、誤解しないでいただきたい！\r\n\r\n"
"10053020-37-ツバサ" = "超常現象は非科 学 などではない！"
"10053020-38-レナ" = "あー、また始まった……。\r\n"
"10053020-39-ツバサ" = "超常現象はこのキヴォトスに実在する！#nしかも、日常のすぐそばで頻繁に起こっているのだ！"
"10053020-40-ツバサ" = "この間だって、ミレニアムで恐ろしい事件があっただろう？#n先生ならご存知だとは思うが……。"
"10053020-41" = "[s] \"……！\""
"10053020-42-ツバサ" = "ふむ……その顔、思い当たる節があるようだね。\r\n"
"10053020-43-ツバサ" = "あれだけ騒ぎになっていたんだ、知らない方が不自然だろう。\r\n"
"10053020-44-ツバサ" = "そう――「ミレニアム東アルプスUFO目撃事件」をね！\r\n"
"10053020-45" = "[ns9] \"……ん？\"\r\n[ns10] \"東アルプス……？\""
"10053020-46-ツバサ" = "目撃者の証言によると、明け方、白く発光する円盤状の物体が重力を無視するように飛行していたのだとか。"
"10053020-47-ツバサ" = "ここからは私の見解なんだが、これは典型的な「アダムスキー型UFO」の特徴だ。"
"10053020-48-ツバサ" = "確証バイアスだなんだと片づける学者もいるが、私は断固として異を唱える！"
"10053020-49-ツバサ" = "UFOは実在する！！\r\n\r\n\r\n"
"10053020-50-ツバサ" = "キヴォトス各地で同じような目撃談が報告されていることこそ、その証左だろう！\r\n"
"10053020-51-ツバサ" = "本当は現地での交信を試みたかったんだが……#n残念ながら事情があって、ミレニアムには自由に出入りできなくてね……。\r\n"
"10053020-52" = "[s11] \"UFO……交信……？\"\r\n[s12] \"えっと、レナ……？\""
"10053020-53-レナ" = "変な子なのは……認めるけど！微妙に違うの！\r\n"
"10053020-54-レナ" = "なんというか……先輩たちと違ってもうちょっと現実的というか、#n微妙にズレてるだけで、話は通じる方というか……。\r\n"
"10053020-55-レナ" = "って、なんで私がフォローしてるの！？\r\n"
"10053020-56-コノカ" = "ああ見えて、所長はこの界隈じゃ結構有名で……。\r\n\r\n\r\n"
"10053020-57-コノカ" = "廃墟探索の配信を毎日やってるんすよ～\r\n\r\n"
"10053020-58-コノカ" = "それどこの界隈よ……#n別に全然有名でもないし。\r\n"
"10053020-59-コノカ" = "だいたい、廃ビルをウロウロするだけの配信じゃない。#n再生数も登録者も全然伸びてないし。\r\n\r\n"
"10053020-60" = "[ns13] \"毎日、廃墟探検を……？\"\r\n[ns14] \"勉強との両立、大丈夫なのかな……？\""
"10053020-61-ツバサ" = "も、もちろん！ミレニアムの生徒が学業を疎かにするなど有り得ないことだとも！\r\n"
"10053020-62-ツバサ" = "ツバサってミレニアムなの？\r\n"
"10053020-63-ツバサ" = "おや、言ってなかったかな？"
"10053020-64-レナ" = "うん。というか、ちょっと意外……ミレニアムの子って、こういうの信じないと思ってた。"
"10053020-65-ツバサ" = "「こういうの」とは？\r\n"
"10053020-66-レナ" = "えっとほら、ツチノコとか……イエティとか……。"
"10053020-67-レナ" = "あと……魔法とか？"
"10053020-68-ツバサ" = "ふむ、それこそミレニアムの生徒として看過できない発言だね。"
"10053020-69-ツバサ" = "どんな理論だって最初から証明されていたわけじゃない。#nすべての命題は、検証を経て普遍的な真理となり得るのだ。"
"10053020-70-レナ" = "うん……？\r\n"
"10053020-71-ツバサ" = "つまり、まだ証明されていないという理由で否定するのは、これまでに築き上げられた自然哲学の根幹を否定することと同義なのだよ。"
"10053020-72-ツバサ" = "まして現代科学の最先端を誇るミレニアムでさえ、「廃墟」のように未知の領域が残っている。"
"10053020-73-ツバサ" = "超常現象は我々科学の徒が解き明かすべき課題であって、#n忌避すべきものではないというわけさ。"
"10053020-74-ツバサ" = "まぁ、保守派の間ではオカルト扱いされがちなんだがね……。\r\n"
"10053020-75-レナ" = "おお……。さすがミレニアムの生徒は違うわね……。"
"10053020-76-レナ" = "同じこと言っても、うちの先輩とは説得力が違う……。\r\n"
"10053020-77-レナ" = "何を言うか。そのような探求心の点で、我々は仲間だろう？\r\n"
"10053020-78-ツバサ" = "レナ君も、証明されていないツチノコを探しに来たわけなのだから。"
"10053020-79-レナ" = "いや、別にそういうわけじゃないんだけど。"
"10053020-80-ツバサ" = "うん？\r\n"
"10053020-81-レナ" = "誤解されると困るから先に言っておくけど――"
"10053020-82-レナ" = "私はツチノコなんて信じてないから！！\r\n\r\n"
"10053020-83" = "[ns15] \"あー、そういう設定？\"\r\n[ns16] \"なるほど、分かる分かる。\""
"10053020-84-レナ" = "ちょっと！何その反応！？\r\n\r\n"
"10053020-85-レナ" = "それはむしろ、こちらのセリフなんだが？"
"10053020-86-ツバサ" = "ツチノコを信じていないのならば、どうしてこの調査に参加したのだね？"
"10053020-87-レナ" = "それは当然――\r\n"
"10053020-88-レナ" = "はぁ……先生は知ってると思うけど、私のルームメイト、変わった人ばっかりで。#nみんなオカルト狂いなの。\r\n"
"10053020-89-レナ" = "SNSでツチノコ目撃情報！なんて見つけたら、お祭り騒ぎになるくらいのね。"
"10053020-90-レナ" = "だから私が先に行って現場を押さえるの！\r\n"
"10053020-91-レナ" = "どうせ今回の目撃談だって、ヘビかトカゲの見間違いだろうし。"
"10053020-92-レナ" = "噂の発信源を突き止めて、ただの噂だったって証明してやるの。"
"10053020-93-レナ" = "……まあ、先輩たちがそれで正気に戻るかは怪しいけど。\r\n"
"10053020-94" = "[s17] \"あー、そういう設定？\"\r\n[s18] \"なるほど、分かる分かる。\""
"10053020-95-レナ" = "違うってば！\r\n"
"10053020-96-ツバサ" = "待て。そのような不純な動機で参加するのは認められないな。"
"10053020-97-ツバサ" = "我々の目的はあくまで、伝説の[ruby=UMA]未確認動物[/ruby]であるツチノコの実在を検証すること。"
"10053020-98-コノカ" = "そうだそうだ！\r\n"
"10053020-99-ツバサ" = "そして――その正体が、宇宙人の偵察ドローンだと証明することだ！\r\n"
"10053020-100-コノカ" = "……え、うちってそんな怪しい集まりだったんすか？\r\n"
"10053020-101-レナ" = "違うから！変な設定増やさないで！"
"10053020-102-レナ" = "ツチノコを探すだけでしょ！\r\n\r\n"
"10053020-103-ツバサ" = "……なるほど。初心者にはちょっと難しい話だったかな。"
"10053020-104-ツバサ" = "だがこれは吾輩の妄想じゃない。学界でも大注目のテーマなんだ。"
"10053020-105-ツバサ" = "レッドウィンターの著名な学術誌「ネオピラミッドフューチャー」の最新号にも記事が掲載されていたのだよ。"
"10053020-106-レナ" = "それオカルト誌！"
"10053020-107-レナ" = "ミレニアム中の印刷所が出版拒否したから、お金さえ出せば印刷してくれるレッドウィンターで出してるってだけだからね！？\r\n"
"10053020-108-ツバサ" = "違う。あの事件の裏には、主流科学の名を借りてミレニアムの学界を牛耳る#n「セミナー」という連中が――\r\n"
"10053020-109-ツバサ" = "……ん？君、ずいぶん詳しいのだね？\r\n"
"10053020-110-ツバサ" = "定期購読者でも、その辺の裏事情まで知っている者は少ないと思うのだが……。"
"10053020-111-レナ" = "……！\r\n"
"10053020-112-ツバサ" = "……なるほど。君も相応に理論武装した専門家というわけか。"
"10053020-113-ツバサ" = "いいだろう、その勝負……受けて立つ！\r\n"
"10053020-114-ツバサ" = "吾輩の主張は変わらない。ツチノコは宇宙人の偵察ドローンだ！"
"10053020-115-ツバサ" = "あの不自然なフォルムは、土着生物を中途半端に模倣した結果だ。#nしかし機動性と神出鬼没な点は、偵察用ドローンそのもの！\r\n"
"10053020-116-コノカ" = "いや、ヘビじゃないと困るんだけど……。\r\n\r\n"
"10053020-117-ツバサ" = "古典派にもまだ希望はあるさ。生命の可能性は無限だからね。"
"10053020-118-ツバサ" = "果たしてどちらの理論が真実に近いか――今回の調査、実に面白くなりそうだ！\r\n"
"10053020-119-レナ" = "いや、だから私は――"
"10053020-120-レナ" = "もういいや。どうせツチノコの噂の真相を突き止めるのが目的だし。\r\n"
"10053020-121-レナ" = "……もしかして、キヴォトスでまともなのって私だけなの？"
"10053020-122" = "[ns19] \"あー、そういう設定？\"\r\n[ns20] \"なるほど、分かる分かる。\""
"10053020-123-レナ" = "シャーッ！だからそれやめてってば！！\r\n\r\n\r\n"
