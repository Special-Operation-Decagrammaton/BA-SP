[translation]
"10053060-1" = "第6話;怨嗟の声が響く電話ボックス"
"10053060-2" = "（翌日）"
"10053060-3-レナ" = "こんな方法じゃ一生見つかるわけないってば！\r\n\r\n\r\n\r\n"
"10053060-4-コノカ" = "急になんだよ？\r\n"
"10053060-5-レナ" = "全然「急に」じゃないからね！？もう2時間も石ひっくり返してるけど！？"
"10053060-6-ツバサ" = "だが……ヘビは習性として日の当たらない湿った場所を好むもので……。"
"10053060-7-レナ" = "ていうか、そもそもツチノコって何なの？#n太ってるヘビ以外に特徴ないわけ？\r\n"
"10053060-8-ツバサ" = "ふむ……鋭い質問だね。まず、「太ったヘビ」という表現は正確じゃないんだ。\r\n"
"10053060-9-ツバサ" = "分かりやすいからそう呼ばれているだけで、#n実際は菱形に近いシルエットなのだそうだよ。"
"10053060-10-レナ" = "そうなんだ？他には？"
"10053060-11-ツバサ" = "目撃談によって差はあるが、威嚇する時に「シャーッ！」と声を上げるとも言われている。"
"10053060-12-レナ" = "それって猫じゃないの？"
"10053060-13-ツバサ" = "そして何よりすごいのが跳躍力！その場で1メートル近く飛べるそうだ！\r\n"
"10053060-14-レナ" = "だから猫じゃん！！"
"10053060-15-ツバサ" = "言われてみれば……つまり、ツチノコは猫だったのか！？"
"10053060-16-レナ" = "それで納得してどうするのよ。\r\n"
"10053060-17-レナ" = "もっと何か、見つけるのに役立つ情報はないの？"
"10053060-18-ツバサ" = "うーん……情報ではないが、方法なら1つある。"
"10053060-19-ツバサ" = "それは――我々のチーム名を決めることだ。"
"10053060-20-レナ" = "……？\r\n"
"10053060-21-レナ" = "どういうこと？"
"10053060-22-ツバサ" = "知っての通り、名前は本質を規定する。#n例えば我々が「調査隊」を名乗った瞬間から、我々の目的は調査となり、#n無意識的にもその目的に忠実になっていくんだ。\r\n\r\n"
"10053060-23-ツバサ" = "そして、その明確な意志が宇宙の流れを再調整して、我々の望む――正確には、望んでいた結果へと収束していく、という研究結果もある。\r\n\r\n"
"10053060-24-レナ" = "それっぽい根性論から、急にオカルトじみたトンデモ科学に舵切るのやめて！\r\n\r\n"
"10053060-25-コノカ" = "あー、あたしは賛成。ちょっとイケてる名前があったほうがテンション上がるし。\r\n"
"10053060-26-コノカ" = "先生はどう思います？"
"10053060-27" = "[s1] \"私もいいと思う。\"\r\n[s2] \"そうだね、たとえば……。\""
"10053060-28" = "[ns] \"オカルトを研究するんだから、略してオカけ――！！\""
"10053060-29-レナ" = "やめてよ！なんでそうなるの！？\r\n\r\n\r\n"
"10053060-30-コノカ" = "吾輩的には結構良い案だと思ったのだが。\r\n"
"10053060-31-コノカ" = "お気に召さないのであれば、本来の目的に忠実に……「ツチノコ調査隊」はどうかな？\r\n"
"10053060-32-コノカ" = "う～ん……もっとこう、バチッとキマるやつないっすかね。\r\n\r\n\r\n\r\n"
"10053060-33-コノカ" = "な、なに？なんでこっち見るの……？\r\n\r\n\r\n\r\n"
"10053060-34-コノカ" = "いや、レナが「オカ研」に反対するんだったら、代案を出してもらわないと。\r\n\r\n\r\n\r\n"
"10053060-35-コノカ" = "普通に「ツチノコ調査隊」でいいんじゃない？\r\n\r\n\r\n\r\n\r\n"
"10053060-36" = "[s3] \"キヴォトス随一のファッションデザイナーにしては……。\"\r\n[s4] \"レナの芸術的なセンスの見せどころだよ！\""
"10053060-37-コノカ" = "い、いや、これって……ファッションとは関係ない――\r\n\r\n\r\n\r\n\r\n"
"10053060-38-コノカ" = "ぐぅ……。\r\n\r\n\r\n\r\n\r\n"
"10053060-39-コノカ" = "まったく無関係でもないと、自覚はあるようだね……。\r\n\r\n"
"10053060-40-コノカ" = "ひゅ～っ、さすがワイルドハントの生徒さん！\r\n\r\n\r\n\r\n\r\n"
"10053060-41-コノカ" = "……X。\r\n\r\n\r\n\r\n\r\n\r\n"
"10053060-42-コノカ" = "ん？\r\n\r\n\r\n\r\n\r\n"
"10053060-43-コノカ" = "「調査班X」……どう？\r\n\r\n\r\n\r\n\r\n\r\n"
"10053060-44-コノカ" = "……。\r\n\r\n"
"10053060-45-コノカ" = "……。\r\n\r\n\r\n\r\n"
"10053060-46-コノカ" = "あっ、やっぱナシ！今の忘れて！\r\n\r\n\r\n\r\n\r\n"
"10053060-47-コノカ" = "いや、めちゃめちゃカッコいいじゃん、調査班X！！\r\n\r\n\r\n\r\n\r\n\r\n"
"10053060-48-コノカ" = "何だか……秘密組織のエージェントのようだ。\r\n\r\n\r\n"
"10053060-49-コノカ" = "うちの連中にネーミングを募集しても「希望」とか「光」とかそんなベタなのしか出てこないのに。#nさすが芸術学院は違うな～\r\n\r\n\r\n\r\n"
"10053060-50-コノカ" = "そ、そう？悪くない……？\r\n\r\n\r\n\r\n\r\n"
"10053060-51-コノカ" = "ふ、ふん！当然でしょ。誰が考えたと思ってるの？\r\n\r\n\r\n\r\n\r\n"
"10053060-52-コノカ" = "名前が決まると、ツチノコ探しも一気に捗りそうな気がしてきたよ！\r\n\r\n\r\n"
"10053060-53-ツバサ" = "よし「調査班X」！ツチノコを求めて、もう一度気合い入れて調査開始だ！\r\n"
"10053060-54-レナ" = "だからこんなやり方じゃ一生見つからないってば！！\r\n\r\n"
"10053060-55-ツバサ" = "うん？何か問題でも？\r\n"
"10053060-56-レナ" = "問題しかないでしょ！結局、何も変わってないじゃない！！\r\n"
"10053060-57-レナ" = "石をひっくり返しすぎて、石の裏にいる虫の種類に詳しくなってきたんだけど！？\r\n"
"10053060-58-ツバサ" = "ああ、その辺は心配いらない。#nすでに「引き寄せの法則」で、宇宙の気の流れはこちら側に向いているからな。\r\n"
"10053060-59-ツバサ" = "ただし要注意だ。否定的な言葉は使わないこと。できれば願望ではなく完了形で。#n「ツチノコを見つけたい」ではなく、「ツチノコを見つけた」とね。"
"10053060-60-レナ" = "それオカルト！！トンデモ科学！！\r\n\r\n\r\n"
"10053060-61-コノカ" = "ん？そういえば今、何時だろ？\r\n"
"10053060-62-コノカ" = "……あ。\r\n"
"10053060-63-コノカ" = "どうしたの？もうバスの時間？\r\n"
"10053060-64-コノカ" = "いや、その……。\r\n\r\n"
"10053060-65-コノカ" = "……もう行っちゃったんだよね、バス。\r\n"
"10053060-66-コノカ" = "ま、タクシー呼べば大丈夫でしょ。\r\n"
"10053060-67-コノカ" = "うわ、マジか。圏外っすねここ。"
"10053060-68-コノカ" = "キヴォトスにも、文明から切り離された場所が残ってたんすね。\r\n"
"10053060-69-コノカ" = "私のもダメ。完全に電波届いてないね。\r\n"
"10053060-70-レナ" = "今からでも歩いて戻った方がよくない？"
"10053060-71-コノカ" = "……あ、そうだ。"
"10053060-72-コノカ" = "さっき公衆電話があった気がする。\r\n"
"10053060-73-コノカ" = "ああ、そういえば吾輩も見かけたよ。"
"10053060-74-コノカ" = "じゃあそれでタクシーを呼ぼう！ひとっ走り行ってきまーす！\r\n\r\n"
"10053060-75-ツバサ" = "待て！もう日が暮れかけているんだ。山の中を一人で歩くのは――\r\n"
"10053060-76-ツバサ" = "……行ってしまったか。\r\n"
"10053060-77" = "[ns5] \"私が追いかけるよ。\"\r\n[ns6] \"2人はここで待ってて。\""
"10053060-78-コノカ" = "そこ、動くな。何者だ……？\r\n"
"10053060-79-コノカ" = "……あれ？先生っすか？\r\n\r\n"
"10053060-80-コノカ" = "すみません、誰かがついて来てるのは分かってたんで、#nてっきり「あの脱獄犯」かと思って。\r\n\r\n"
"10053060-81-コノカ" = "にしてもどうしたんすか？待っててくれてよかったんすけど。\r\n"
"10053060-82-コノカ" = "……え？心配？#nあたしを心配してくれたんすか？\r\n\r\n"
"10053060-83-コノカ" = "いや～公安局でもここまで大事にされたことないっすよ?\r\n\r\n"
"10053060-84-コノカ" = "むしろ危ない仕事があったら真っ先にあたしの背中押してくる連中っすからね、#nあははっ！"
"10053060-85-コノカ" = "だから、嬉しいっす。でも、あたし1人で平気っすよ？#nこの通り、何の変哲もない公衆電話で電話をかけるだけですし。\r\n"
"10053060-86-コノカ" = "ちゃちゃっとタクシー呼んじゃうんで、ちょっとだけ待っててほしいっす！"
"10053060-87-コノカ" = "……あ"
"10053060-88-コノカ" = "先生、その……悪いんすけど、小銭あったりします？\r\n"
"10053060-89" = "[s7] \"言ったそばから……。\"\r\n[s8] \"ついてきて正解だったね。\""
"10053060-90-コノカ" = "あ、先生も入ってくるんすか？\r\n"
"10053060-91-コノカ" = "狭くないっすか？あたし外に出ます？#n……あ、大丈夫っすか。\r\n"
"10053060-92-コノカ" = "じゃ、さっさと掛けちゃいましょう。\r\n"
"10053060-93-コノカ" = "……あ、もしもし？タクシー会社っすか？\r\n\r\n"
"10053060-94-コノカ" = "配車をお願いしたくて電話したんすけど。場所は――\r\n"
"10053060-95-コノカ" = "あれ、ちょっと待ってください。\r\n"
"10053060-96-コノカ" = "ここ……なんて説明すりゃいいんすかね？白川山なんすけど……。\r\n\r\n"
"10053060-97-コノカ" = "あっ、切れちゃう！先生！小銭！早く！\r\n\r\n"
"10053060-98-コノカ" = "で、えーっと、ここどこだっけ。\r\n\r\n"
"10053060-99-コノカ" = "……そうそう、白川山のバス停まで来てもらえれば。はい、停留所の前っす。\r\n\r\n"
"10053060-100-コノカ" = "4人です。あ、小型だと先生が窮屈っすかね？\r\n"
"10053060-101-コノカ" = "いや、助手席に先生で、後ろに3人で詰めれば――\r\n"
"10053060-102-コノカ" = "あ、また切れそう！これだから公衆電話は！\r\n\r\n"
"10053060-103-コノカ" = "あ、はい、小型でも大丈夫っす。\r\n"
"10053060-104-コノカ" = "待ってるんで、すぐ来て欲しいっす。\r\n"
"10053060-105-コノカ" = "はい～お疲れ様っす～\r\n"
"10053060-106-コノカ" = "よしっ！これで解決！あとはバス停で待ってれば――\r\n\r\n\r\n"
"10053060-107-コノカ" = "あれ？開かないっすか？\r\n"
"10053060-108-コノカ" = "しゃあない。先生、ちょっと下がっててください！\r\n\r\n"
"10053060-109-コノカ" = "先生？あの……。\r\n"
"10053060-110-コノカ" = "小銭、まだ余ってたりしないっすか……？助けを呼んだほうがいい気が……。\r\n\r\n"
"10053060-111" = "[ns9] \"もうなくて……。\"\n[ns10] \"さっきのが最後だよ。\""
"10053060-112-コノカ" = "ほんと、ツイてないときって重なるんすよね。\r\n\r\n"
"10053060-113-コノカ" = "すみません、先生まで巻き込んじゃって……。\r\n\r\n"
"10053060-114" = "[s11] \"コノカのせいってわけじゃないでしょ？\"\n[s12] \"ドアが古くなって建付けが悪いだけだよ。\""
"10053060-115-コノカ" = "いえ、あたしの運気が悪いから災いを呼び寄せてるんすよ。\r\n"
"10053060-116-コノカ" = "だからツキが落ちてるときは、1人でいたいんすよね。#n周りにまで飛び火するじゃないっすか。\r\n"
"10053060-117" = "[s13] \"そういうの、本気で信じてるんだね。\"\n[s14] \"運勢とか、迷信とか。\""
"10053060-118-コノカ" = "信じてるっていうか、実際そうじゃないっすか？\r\n"
"10053060-119-コノカ" = "ほら、電話ボックスに閉じ込められるなんて、そうそうあることじゃないっすよ？\r\n"
"10053060-120-コノカ" = "それがこのタイミングで起きるってことは、完全にあたしの運気が悪くなってる証拠っす。"
"10053060-121-コノカ" = "……まぁでも、そのうち2人も気づいて助けに来てくれるでしょうし。#nタクシーだっていずれ。"
"10053060-122-コノカ" = "……しっかし狭いっすね、ここ。\r\n"
"10053060-123" = "[s15] \"だね……。\"\n[s16] \"なんか暑くなってきた気も……。\""
"10053060-124-コノカ" = "あ、やっぱり先生も感じます？\r\n"
"10053060-125-コノカ" = "2人で入ってるせいっすかね……？\r\n\r\n"
"10053060-126-コノカ" = "あっ……いえ、すみません、ちょっと当たっちゃいましたよね。\r\n\r\n"
"10053060-127-コノカ" = "なんなんだよ、この状況……。\r\n\r\n\r\n"
"10053060-128-コノカ" = "公衆電話が鳴ってる……？\r\n"
"10053060-129-コノカ" = "え？公衆電話って、かかってくることもあるんすか？\r\n"
"10053060-130" = "[s17] \"技術的には可能だと思うけど……。\"\r\n[s18] \"普通は鳴らないんじゃないかな……？\"\r\n"
"10053060-131-コノカ" = "これ、どうします？\r\n\r\n"
"10053060-132-コノカ" = "やっぱ出たほうがいいっすかね？\r\n"
"10053060-133-コノカ" = "……もしもし？\r\n"
"10053060-134" = "（受話器の向こうから、燃え盛る炎の音と悲痛な悲鳴が聞こえてくる）"
"10053060-135-コノカ" = "お前たちも……そこで焼け死ぬんだ……。\r\n\r\n"
"10053060-136-コノカ" = "せ、せ、せ……先生！？\r\n\r\n"
"10053060-137-コノカ" = "今の……聞こえました！？これ、ヤバいやつっすよね！？\r\n\r\n"
"10053060-138" = "[s19] \"い、いったん落ち着こう。\"\n[s20] \"ノイズとか、イタズラ電話かも！\""
"10053060-139-コノカ" = "そんなわけなくないっすか！？\r\n\r\n"
"10053060-140-コノカ" = "誰がこんな場所の公衆電話にピンポイントでイタズラ電話かけてくるんすか！\r\n"
"10053060-141-コノカ" = "それに「焼け死ぬ」って言ってましたよね？#nなんかどんどん暑くなってきてる気がするんすけど……。\r\n"
"10053060-142-コノカ" = "いや、気のせいじゃないっす！！床、マジで熱いですって！！\r\n\r\n"
"10053060-143" = "[s21] \"たしかに……！\"\n[s22] \"でも今は落ち着いて、救助を待とう……！\""
"10053060-144" = "（10分ほど経ったが、助けは来なかった……）"
"10053060-145-コノカ" = "はぁ……はぁ……。"
"10053060-146-コノカ" = "先生、大丈夫っすか？さっきから尋常じゃない汗ですけど……。\r\n"
"10053060-147" = "[s23] \"コノカだって……。\"\n[s24] \"そろそろ……限界かも……。\""
"10053060-148-コノカ" = "……。"
"10053060-149-コノカ" = "仕方ないっすね。\r\n\r\n"
"10053060-150-コノカ" = "先生、もう少しこっちに寄ってください。"
"10053060-151-コノカ" = "いや、体が触れるとか気にしてる場合じゃないんで……#nはい、そのくらいで大丈夫っす。"
"10053060-152-コノカ" = "じゃ、いきますよ――"
"10053060-153-コノカ" = "ぶち破る！！！！\r\n"
"10053060-154-コノカ" = "あぁ～スッキリ！！最初からこうしてりゃよかったっすね！\r\n\r\n"
"10053060-155-コノカ" = "先生、怪我とかしてないっすか？"
"10053060-156" = "[ns25] \"うん、おかげ様で。ありがとう。\"\r\n[ns26] \"まさか電話ボックスを投げ飛ばすとは……。\""
"10053060-157-コノカ" = "これくらい朝飯前っすよ！\r\n"
"10053060-158-コノカ" = "（ザザー……）\r\n"
"10053060-159-コノカ" = "いや……それは……反則……。\r\n"
"10053060-160-コノカ" = "うわっ、またしゃべった！！なにか憑いてるんじゃないっすか！？\r\n"
"10053060-161-コノカ" = "もう行きましょ！早く！！\r\n\r\n"
"10053060-162" = "（結局、電話の向こうの正体は最後まで分からずじまいだった……）"
