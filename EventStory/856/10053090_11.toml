[translation]
"10053090-1" = "エピローグ;青いツチノコ"
"10053090-2" = "（3日目）"
"10053090-3-コノカ" = "うわあああぁ！！！離せ！！！離せよ！！！\r\n"
"10053090-4-コノカ" = "まだ間に合う！！！今ならギリギリセーフ！！！\r\n\r\n"
"10053090-5-コノカ" = "バカ言わないで！夜の山は本当に危ないんだから！\r\n\r\n\r\n"
"10053090-6-コノカ" = "でも今日を逃したら人生最悪の不幸が……！！！！\r\n\r\n\r\n\r\n"
"10053090-7-コノカ" = "いっそツチノコじゃなくてもいい！この際ヘビでも捕まえれば……！！\r\n\r\n\r\n\r\n"
"10053090-8-コノカ" = "みんなも見てないで止めるの手伝ってよ！！\r\n\r\n"
"10053090-9-コノカ" = "いや、うちらも全力で止めてるんですけど……！！"
"10053090-10-コノカ" = "こいつ本当に人間か！？この力……戦車じゃないのか……！？"
"10053090-11-ミライ" = "あっ、足が滑っ――うぎゃああああ！！膝すりむいたぁぁ！！"
"10053090-12-ツバサ" = "みんな、少し落ち着いてくれ！\r\n"
"10053090-13-ツバサ" = "コノカ君、重要な話があるんだ。\r\n"
"10053090-14-コノカ" = "止めてもムダっすよ！いくら所長に言われたって聞かないっすから！\r\n\r\n\r\n"
"10053090-15-コノカ" = "いや、そのつもりはない。ただ聞いてほしい。さっき気づいたんだ。\r\n\r\n"
"10053090-16-コノカ" = "吾輩の計算によれば、コノカ君の「最悪の3日目」は――！\r\n"
"10053090-17-ツバサ" = "とっくに過ぎていたんだ……！！\r\n"
"10053090-18-コノカ" = "…………。"
"10053090-19-コノカ" = "…………へ？"
"10053090-20-ツバサ" = "最初に聞いた時から違和感があったんだ。#n占いというのは、普通「その日」の運勢を指すものだからね。\r\n"
"10053090-21-ツバサ" = "にもかかわらず3日目の運勢を語るのなら……#nそれは当日が1日目なのではないか？と。"
"10053090-22-ツバサ" = "つまりコノカ君の「最悪の3日目」は昨日だったということだ！\r\n"
"10053090-23-コノカ" = "あたしの最悪の日は、もう終わってた……ってこと……？\r\n"
"10053090-24-コノカ" = "…………。"
"10053090-25-コノカ" = "でも、別に何もなかったけど……？"
"10053090-26-レナ" = "占いなんてそんなもんでしょ。\r\n"
"10053090-27-レナ" = "印象的なのを覚えてるだけなんだって。いわゆる「マーフィーの法則」ってやつで――\r\n"
"10053090-28-レナ" = "……いや。\r\n"
"10053090-29-レナ" = "あったじゃん！！山ほどあったでしょ！？最悪の出来事！！\r\n\r\n\r\n"
"10053090-30-レナ" = "ロボットみたいなのに襲われて！！\r\n\r\n"
"10053090-31-レナ" = "夜は変なスケバンに襲撃されて！！\r\n\r\n"
"10053090-32-レナ" = "最悪なことばっかりじゃん！\r\n\r\n\r\n"
"10053090-33-チンピラA" = "もしかして、うちらのことですか？"
"10053090-34-チンピラB" = "最悪って、そこまで言わなくてもいいじゃんか……。#n夜襲ったのは悪かったけど。\r\n"
"10053090-35-レナ" = "あ、ごめん……。\r\n"
"10053090-36-レナ" = "……ん？\r\n"
"10053090-37-レナ" = "シャーッ！最悪な行動でしょそれ！！\r\n"
"10053090-38-レナ" = "なんか誤魔化されそうになったじゃん！！\r\n"
"10053090-39-コノカ" = "まぁ、戦車程度で最悪は大げさだけど……。\r\n"
"10053090-40-コノカ" = "つまり3日経っても最悪の日は来なかったってこと……？"
"10053090-41-コノカ" = "いや、もしかして……！？\r\n"
"10053090-42-コノカ" = "もうツチノコに会ってたってこと！？"
"10053090-43-コノカ" = "いやいや、ここに来てからヘビっぽいのなんて見てな――\r\n"
"10053090-44-レナ" = "ていうか、そもそもツチノコって何なの？#n太ってるヘビ以外に特徴ないわけ？"
"10053090-45-ツバサ" = "ふむ……鋭い質問だね。まず、「太ったヘビ」という表現は正確じゃないんだ。\r\n"
"10053090-46-ツバサ" = "分かりやすいからそう呼ばれているだけで、#n実際は菱形に近いシルエットなのだそうだよ。"
"10053090-47-ツバサ" = "そして何よりすごいのが跳躍力！その場で1メートル近く飛べるそうだ！\r\n"
"10053090-48-レナ" = "シャーッ！！シャーーーッ！！！\r\n"
"10053090-49-コノカ" = "ツチノコだーーーっ！！！！\r\n\r\n"
"10053090-50-レナ" = "えっ、ちょ、いきなり何！？"
"10053090-51-レナ" = "なんで急に抱きつくのよ！？"
"10053090-52-コノカ" = "いや、その……。"
"10053090-53-コノカ" = "もしかしたらこの冒険こそが、本当のツチノコだったのかも……。"
"10053090-54-レナ" = "コノカまでそれ言うの！？"
"10053090-55" = "（……こうして、ツチノコを追い求めた冒険は幕を閉じた）"
"10053090-56-コノカ" = "いや～、やっぱ部屋がキレイだと気分いいねぇ！\r\n"
"10053090-57-レナ" = "なんで片づけしたの？もう帰るんでしょ？\r\n"
"10053090-58-コノカ" = "1週間レンタルしたんだからもったいないじゃん？まだ遊んで行かないと。"
"10053090-59-ツバサ" = "なにっ！？そういう話だったのか！？#nてっきり、異星人の秘密基地への入口を探しているのだとばっかり……。\r\n\r\n"
"10053090-60-チンピラA" = "あの～、掃除も終わりましたし、私はそろそろ……。\r\n\r\n\r\n"
"10053090-61-チンピラA" = "諦めな。絶対帰してくれないぞ。\r\n\r\n\r\n\r\n\r\n"
"10053090-62-チンピラA" = "こうなったら、もう腹くくって遊び倒そうぜ。\r\n\r\n\r\n\r\n"
"10053090-63" = "キヴォトス・未確認ミステリー～邪を払うツチノコ大調査～"
