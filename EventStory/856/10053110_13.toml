[translation]
"10053110-1" = "後日談その2;オカルトなんてない！"
"10053110-2-レナ" = "……。"
"10053110-3-ツバサ" = "レナ君、熱心にスマホをいじっているようだが、急用かね？"
"10053110-4-レナ" = "あ、寮の先輩たちにモモトーク送ってて……。"
"10053110-5-レナ" = "そういえば結局、私の言った通りだったでしょ？#nツチノコなんて、やっぱり存在しなかった。\r\n"
"10053110-6-ツバサ" = "いいや、ちゃんと存在していたよ。ツチノコは、我々の心の中に――\r\n"
"10053110-7-レナ" = "そういうの求めてない！！本物のツチノコの話だから！！\r\n"
"10053110-8-ツバサ" = "あぁ、そういう意味ならばたしかに。\r\n"
"10053110-9-ツバサ" = "結局ツチノコの目撃談は、外で橋を直しているあの子たちのデマだったわけだ。"
"10053110-10-レナ" = "そうそう！だから調査の結論を先輩たちに教えてあげたの。"
"10053110-11-ツバサ" = "……うん？\r\n"
"10053110-12-レナ" = "オカルトがインチキだって、これで少しは分かってもらえるはず。\r\n"
"10053110-13-ツバサ" = "……いや、それは完全に逆効果では？\r\n"
"10053110-14-レナ" = "あ、返信きた。ほら見て。"
"10053110-15-エリ" = "あら。\r\n\r\n\r\n\r\n\r\n"
"10053110-16-エリ" = "にゅふふ。\r\n\r\n\r\n\r\n\r\n"
"10053110-17-エリ" = "イヒヒッ……。\r\n\r\n\r\n"
"10053110-18-レナ" = "な、なんでそんな反応なの？"
"10053110-19-エリ" = "レナちゃんが友達と旅行に行くって聞いて、何かと思えば。\r\n\r\n\r\n\r\n\r\n"
"10053110-20-エリ" = "まさかそんなに遠くまで行って、ツチノコというオカルトを証明しようとしていただなんて。\r\n\r\n\r\n\r\n\r\n"
"10053110-21-エリ" = "やっぱり……レナちゃんは立派なオカ研の一員だねぇ……。\r\n\r\n\r\n"
"10053110-22-レナ" = "いやいや！！なんで全部そういう方向に解釈するわけ！？\r\n"
"10053110-23-レナ" = "違うから！！別にツチノコなんか全然興味――\r\n"
"10053110-24-レナ" = "シャーッ！違うって言ってるでしょ！！\r\n\r\n"
"10053110-25-レナ" = "だから言っただろう、逆効果だと……。\r\n\r\n"
"10053110-26-レナ" = "……おっと、忘れていた。我々も外へ行こうか。もう全員そろっている。\r\n"
"10053110-27-レナ" = "え、外？\r\n\r\n\r\n\r\n"
"10053110-28-レナ" = "……もう夕方だけど？\r\n\r\n\r\n"
"10053110-29-レナ" = "せっかくこんな山奥まで来たんだ。"
"10053110-30-ツバサ" = "夜にやることなんて1つしかないじゃないか。"
"10053110-31-ツバサ" = "コスモスコスモ――アリヤアリアリ――"
"10053110-32-ツバサ" = "どうか我らの呼びかけに応えたまえ。\r\n"
"10053110-33-コノカ" = "コスモスコスモ――\r\n"
"10053110-34-ミライ" = "アリヤアリアリ――\r\n"
"10053110-35-レナ" = "……？？？\r\n"
"10053110-36-レナ" = "……何してるの？"
"10053110-37-ツバサ" = "私語は慎みたまえ。#n雑念が混ざると、宇宙の暗黒エネルギーに遮断されてしまうのだよ！\r\n\r\n"
"10053110-38-ツバサ" = "銀河の彼方の存在たちよ！我らの声に応えたまえーッ！\r\n\r\n"
"10053110-39-コノカ" = "……なんとかしてよ。後輩でしょ？\r\n\r\n\r\n"
"10053110-40-コノカ" = "そうなんですけど……ああなったツバサを止めるのは難しくて……。\r\n\r\n\r\n\r\n\r\n"
"10053110-41-コノカ" = "あれですよ。#n子どもに「サンタはいない」って教える役回り、やったことあります？\r\n\r\n\r\n\r\n"
"10053110-42-コノカ" = "あー……ね。\r\n\r\n\r\n\r\n\r\n"
"10053110-43-コノカ" = "言いたいことは何となく分かるけどさ……。\r\n\r\n\r\n"
"10053110-44-ツバサ" = "そこ！呪文が止まっている！交信が弱まっているぞ！\r\n"
"10053110-45-レナ" = "アリヤアリアリ――\r\n"
"10053110-46-ツバサ" = "もっと心を込めて！！\r\n"
"10053110-47-レナ" = "コスモスコスモ――"
"10053110-48-ツバサ" = "もっとぉぉぉぉぉぉぉぉぉ！！！！\r\n\r\n"
"10053110-49-レナ" = "アリヤアリアリ――！！\r\n\r\n\r\n"
