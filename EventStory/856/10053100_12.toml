[translation]
"10053100-1" = "後日談その1;バーベキュー＆チリ"
"10053100-2-コノカ" = "ん～っ、肉のいい匂い～！\r\n"
"10053100-3-コノカ" = "ほら、皿持ってきな！取り分けてやるから！"
"10053100-4-チンピラA" = "……。"
"10053100-5-コノカ" = "何だよ、皿出しなって。\r\n\r\n\r\n\r\n\r\n"
"10053100-6-コノカ" = "いや、その……ありがたいんですけど……。\r\n\r\n\r\n\r\n"
"10053100-7-コノカ" = "うちら、ここに混ざってご馳走になっていいのかなーって。\r\n\r\n\r\n"
"10053100-8-コノカ" = "何だよ、その変な遠慮。\r\n\r\n\r\n\r\n"
"10053100-9-コノカ" = "一緒に食わなきゃ意味ないじゃん。生きるって、食べることでしょ？\r\n\r\n\r\n\r\n\r\n"
"10053100-10-コノカ" = "いや、そういう話じゃなくて……。\r\n\r\n\r\n\r\n"
"10053100-11-コノカ" = "ほら、口閉じる。無駄口叩いてないで食え食え。\r\n\r\n\r\n\r\n"
"10053100-12-コノカ" = "口を閉じて、どうやって食べろと……？\r\n\r\n\r\n\r\n"
"10053100-13-コノカ" = "……たしかに？\r\n\r\n\r\n\r\n"
"10053100-14-レナ" = "……。\r\n\r\n"
"10053100-15-コノカ" = "うん？あたしの顔になにか付いてる？\r\n\r\n\r\n\r\n"
"10053100-16-コノカ" = "……そんなに優しくしてると、そのうち盛大に裏切られるよ？\r\n\r\n"
"10053100-17-コノカ" = "ふーん？\r\n\r\n\r\n"
"10053100-18-コノカ" = "な、なによ急に！近い！近いって！！\r\n\r\n"
"10053100-19-コノカ" = "つまり～そんなにお姉さんが心配だってわけ～？\r\n\r\n\r\n\r\n"
"10053100-20-コノカ" = "シャーッ！そんなこと言ってないでしょ！？\r\n\r\n"
"10053100-21-コノカ" = "心配なんかして……ないとは言わないけど！\r\n\r\n\r\n"
"10053100-22-コノカ" = "あたしの心配までしてくれるなんてありがたい話だね～\r\n\r\n\r\n"
"10053100-23-コノカ" = "じゃあ特別に、人生の知恵を2つ教えてあげよう。"
"10053100-24-コノカ" = "1つ、どんな状況でも、やってみりゃ案外なんとかなる。"
"10053100-25-コノカ" = "もう1つ、力で解決できないことは無い！あははっ！\r\n\r\n\r\n\r\n"
"10053100-26-レナ" = "素手でバスを壊すような人……心配しても仕方ないか……。\r\n"
"10053100-27-ミライ" = "あぁ～幸せってこういう味してるんですね～\r\n"
"10053100-28-ミライ" = "お肉なんていつ以来でしょうか……。"
"10053100-29-ミライ" = "……。\r\n"
"10053100-30-ミライ" = "はっ！\r\n\r\n\r\n\r\n"
"10053100-31-ミライ" = "いけないいけない。部員の前で威厳を失うところでした。\r\n\r\n\r\n"
"10053100-32-ミライ" = "部長、どうしたんだ？食べかけで箸が止まっているようだが。\r\n\r\n"
"10053100-33-ミライ" = "えっ？あ、いや～っ……その、お肉は食べすぎて……飽きてしまったといいますか……#nあはは。\r\n\r\n\r\n"
"10053100-34-ミライ" = "さすが部長！逃亡中でも羽振りがいいんだな！\r\n\r\n"
"10053100-35-ミライ" = "と、当然です！\r\n\r\n\r\n\r\n\r\n"
"10053100-36-ミライ" = "それより……ツバサ、ずっと私の隣にいますが……いいんですか？\r\n\r\n\r\n"
"10053100-37-ミライ" = "あっ、すまない……。久しぶりだから、嬉しくて……。\r\n"
"10053100-38-ミライ" = "邪魔……だったかな……。\r\n\r\n"
"10053100-39-ミライ" = "い、いえいえ！そんなわけないじゃないですか……！#nちょっと聞いてみただけですから！\r\n\r\n\r\n\r\n"
"10053100-40-ミライ" = "じゃあ……もうちょっとだけ……。\r\n"
"10053100-41-ミライ" = "ふふふっ。\r\n\r\n"
"10053100-42-ミライ" = "食べづらい……。\r\n\r\n\r\n\r\n"
"10053100-43-コノカ" = "なぁ、詐欺師。\r\n\r\n\r\n"
"10053100-44-コノカ" = "その呼び方やめてくださいってば！\r\n\r\n\r\n\r\n\r\n"
"10053100-45-コノカ" = "詐欺師のくせに、部下には慕われてるのか。#n所長が誰かに懐いてるところ、初めて見たよ。\r\n\r\n\r\n\r\n"
"10053100-46-コノカ" = "だから詐欺師じゃなくて……！\r\n\r\n\r\n\r\n"
"10053100-47-ツバサ" = "あのね、コノカ君。\r\n"
"10053100-48-ツバサ" = "これは真面目な忠告なんだけどね。メディアを過信しないほうがいい。"
"10053100-49-コノカ" = "……え？\r\n\r\n\r\n\r\n"
"10053100-50-ツバサ" = "キヴォトスの主要メディアは、全て連邦生徒会の管理下なんだ。#nしかも、連邦生徒会とセミナーの癒着関係は、この世界じゃ有名な話。"
"10053100-51-ツバサ" = "部長は濡れ衣を着せられただけなんだ。"
"10053100-52-ツバサ" = "部長の才能はあまりにも卓越しているからな。#nセミナーの「ビッグシスター」が直接手を回して排除したんだ。"
"10053100-53-コノカ" = "あー……そういう設定？"
"10053100-54-コノカ" = "設定ではなく事実です！ビッグシスター直々に追い出されてるんですからね！"
"10053100-55-コノカ" = "分かった分かった～"
"10053100-56-コノカ" = "絶対信じてないですよね！？"
"10053100-57-コノカ" = "んで、話は変わるんだけど。"
"10053100-58-コノカ" = "いくらなんでも、真夜中に2階まで上がって寝顔を覗くってのは、#nさすがに過保護じゃない？"
"10053100-59-コノカ" = "まあ、所長のことが心配なのは分かるけど。"
"10053100-60-ミライ" = "……何の話です？"
"10053100-61-コノカ" = "何って、窓の外にいたの、あんただろ？写真に写ってるし。"
"10053100-62-ミライ" = "心当たりがないのですが……。"
"10053100-63-コノカ" = "……？"
"10053100-64-ミライ" = "あの日は橋が壊れてて……どうしようか山小屋の前で悩んでたんですよ。#nそしたら急に窓開けて叫ぶもんだから、ビックリして逃げました。"
"10053100-65-ミライ" = "あぁ、それならこっちこそ聞きたいんですけど――"
"10053100-66-ミライ" = "あの時、窓に張りついてたの……誰なんです？#nここにはいないみたいですけど。"
"10053100-67-コノカ" = "……？"
"10053100-68-コノカ" = "え。"
"10053100-69-コノカ" = "えぇぇぇぇぇぇぇぇっ！？！？"
