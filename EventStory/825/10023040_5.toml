[translation]
"10023040-1" = "第4話;ご挨拶を申し上げます、ぴょん"
"10023040-2" = "[ns] \"お疲れ様、アリス。お掃除頑張ってるね。\""
"10023040-3-アリス" = "もちろんです、先生！#n今のアリスはメイド勇者ですから！"
"10023040-4" = "[s] \"メイド勇者？\""
"10023040-5-アリス" = "メイドと勇者を極めた先にある最強の存在です！#n最強と最強が合わさった上級職です！"
"10023040-6" = "[s] （アリスにとって、メイドって……？）"
"10023040-7-アリス" = "ところで、先生はこんなに遅くまで起きてて大丈夫なんですか？"
"10023040-8-アリス" = "いのちを大事にしてくださいね。#n宿屋で寝ないと体力は回復しません。"
"10023040-9-アリス" = "アリスはへっちゃらです！#nモモイたちと、よく徹夜でゲームをしていますから！"
"10023040-10" = "[s1] \"頑張ってるアリスに元気をもらってるから大丈夫だよ。\"\n[s2] \"モモイに徹夜でゲームはやめるよう言わないと……。\""
"10023040-11-アリス" = "あ、今あくびをしました！#n掃除はアリスに任せて、先生は寝てください！"
"10023040-12-アリス" = "もう、朝の5時20分を過ぎてるんですよ！"
"10023040-13-アリス" = "アリスちゃん……そっちの棚を拭き終わったら、次はこっちをお願い出来る？"
"10023040-14-アリス" = "分かりました、ユズ！#nアリス、床拭きモードに切り替えます！"
"10023040-15-モモイ" = "ふぁああああ……"
"10023040-16-ミドリ" = "眠い……"
"10023040-17" = "[s] \"みんな、こんな時間までお疲れ様……\""
"10023040-18-モモイ" = "あはは……5時20分から7時40分の間は、特に警戒してくれって言われてるからね……"
"10023040-19-ミドリ" = "ついでに掃除も頼まれたので、身体を動かしている分眠気はマシな方ではありますが……"
"10023040-20-モモイ" = "掃除分報酬に上乗せされるらしいから、不満はないけど……"
"10023040-21-モモイ" = "ね～む～い～……"
"10023040-22" = "（……そうして何事も無いまま午後を迎えた）"
"10023040-23" = "（予定通り開催されたパーティーは、想像以上の混雑ぶりだった）"
"10023040-24-気難しいゲスト" = "おい、グラスが空いたままじゃないか。#nいつになったら注いでくれるんだ？"
"10023040-25-気難しいゲスト" = "え？あ、ごめ……"
"10023040-26-モモイ" = "も、申し訳ありません。すぐにお持ちします。"
"10023040-27-気難しいゲスト" = "メイドの失態は主人の評判に直結するというのに、まったく何をしているんだ！"
"10023040-28-モモイ" = "（うぐぐぐ……！言わせておけば言いたい放題！#n　そもそも本当はメイドじゃないのに！）"
"10023040-29-モモイ" = "そもそも、雇われメイドとはいえ、基本の所作くらい学んだらどうなんだい？#nその辺のロボットの方がまだ優雅だよ。"
"10023040-30-気難しいゲスト" = "あの……申し訳ございません。#nお客様のグラスは、既に注がれております。"
"10023040-31-ミドリ" = "なにっ？そんなバカな。さっきまで確かに……！"
"10023040-32-気難しいゲスト" = "ほ、本当だ！いったい誰が淹れたというのだ……？#n音も気配も無かったのに……？"
"10023040-33-ミドリ" = "（うそ！？一体何が起きたの？）"
"10023040-34-ミドリ" = "（私も分からないよ……）"
"10023040-35-アリス" = "うわーん！お客様が多すぎます！#nこのままではアリス、スネイルみたいになってしまいます！"
"10023040-36-成金ゲスト" = "おい！こんな所に皿が落ちてるじゃないか！"
"10023040-37-成金ゲスト" = "危ないだろ！早く何とかしてくれ！"
"10023040-38-ゲストA" = "も、申し訳ありません！#nですが、アリス今は他のお客様の対応が……"
"10023040-39-成金ゲスト" = "言い訳はそれだけか？私を誰だと思っているんだ！"
"10023040-40-ゲストA" = "う、うぅ……"
"10023040-41-ゲストA" = "ううぅ……申し訳ありません。お客様、少しお待ちください……"
"10023040-42-アリス" = "あれ……？#nお皿が……どこにもありません。"
"10023040-43-アリス" = "何を言ってるんだ？ここに……"
"10023040-44-アリス" = "ど、どこにいったんだ！？"
"10023040-45-成金ゲスト" = "ぐぬぬ……#nパーティーに文句をつけて、オークションで優遇を受ける計画が……！"
"10023040-46-怒ったシェフ" = "おい、一体何を作ってるんだ！#nこんな料理をお客様にお出しするつもりなのか？"
"10023040-47-怒ったシェフ" = "よく見ろ！これのどこが焼けてるっていうんだ？#n生焼けですらないぞ！？"
"10023040-48-怒ったシェフ" = "そこのメイド、お前もだ！#n給料を貰ってるんだから、もっとキビキビ動け！"
"10023040-49-ミドリ" = "わあぁっ……すみません、すみません！"
"10023040-50-ミドリ" = "謝ってる暇があるならさっさと料理を持っていけ！せっかくの料理が冷めるじゃねえかって……"
"10023040-51-怒ったシェフ" = "あ？"
"10023040-52-怒ったシェフ" = "ここにあった料理……どこ行った？"
"10023040-53-？？？" = "全て私が運びました。他にご指示は？"
"10023040-54-怒ったシェフ" = "何だって？あの量を全部一人でか？"
"10023040-55-トキ" = "もちろんです。私は優秀なメイドですから。"
"10023040-56-怒りが解けたシェフ" = "メ、メイド……？#nバニーガール、じゃないのか？"
"10023040-57-トキ" = "……よし、ホール班は交代で休憩に入って良いぞ！"
"10023040-58-怒ったシェフ" = "キッチン班は残れ！"
"10023040-59-ミドリ" = "あれ……"
"10023040-60-トキ" = "お久しぶりです。ピースピース。"
"10023040-61-ミドリ" = "えええええっ！？"
"10023040-62" = "[ns] \"なるほど、ネルが……\""
"10023040-63-トキ" = "はい。「慈愛の怪盗」の情報を掴んだから、後は任せた、と。"
"10023040-64-トキ" = "他にも任務があるのですが……"
"10023040-65-トキ" = "それはさておき、まさか先生もいらっしゃるとは。"
"10023040-66" = "[s] \"トキに会えて嬉しいよ。よろしくね。\""
"10023040-67-トキ" = "ありがとうございます、先生。私も嬉しいです。"
"10023040-68-トキ" = "また、先輩方からこのような言葉を言われました。"
"10023040-69-トキ" = "「私たちの不在、トキちゃんに任せたよ！」#n「良い報せを期待してる」――"
"10023040-70-トキ" = "――「道具と予算は存分に使って構いません。請求書は全て、セミナーの会計に回しておいてください」と。"
"10023040-71-トキ" = "そして――「普段は口にしねぇけど、お前のことは信頼してる」とも。"
"10023040-72-トキ" = "……ふっ。"
"10023040-73" = "[s] \"う、うん……よかったね。\""
"10023040-74-トキ" = "――「慈愛の怪盗」は、既に予告状を送ってきたそうで。"
"10023040-75-トキ" = "私にも見せていただけますでしょうか。"
"10023040-76" = "[s5] \"それは構わないけど、トキ……\"\n[s6] \"さっきから気になってるんだけど……\""
"10023040-77-トキ" = "はい、何でしょうか？"
"10023040-78-トキ" = "はい、何でしょうか？"
"10023040-79" = "[s] \"……どうしてバニーガールなの？\""
"10023040-80-トキ" = "……"
"10023040-81-トキ" = "本気で仰っているのですか、先生。"
"10023040-82" = "[s] \"えっ！？\""
"10023040-83-トキ" = "C&Cの潜入作戦といえば、バニーでしょう？"
"10023040-84-トキ" = "かつて、オデュッセイア海洋高等学校のクルーズ船に潜入した先輩方の記録からそうであると判断しておりますが……"
"10023040-85" = "[s] \"あっ、それには色々な事情が……\""
"10023040-86-トキ" = "……？"
"10023040-87" = "[s] \"な、何でもないよ。トキはそのままで……\""
"10023040-88-トキ" = "何故そのような苦い顔をされているのかは分かりませんが……"
"10023040-89-トキ" = "先生がそう仰るなら、気にしない事としましょう。"
"10023040-90-トキ" = "ともかく、今は怪盗の件を解決しなければなりませんから。#nそれと――"
"10023040-91-アリス" = "あう……あ、あうううぅ……"
"10023040-92-ユズ" = "……い、居ません……こ、ここには誰も居ません……"
"10023040-93-トキ" = "……"
"10023040-94-トキ" = "こういう時、一体どうすれば良いのでしょうか？"
"10023040-95" = "[s7] \"分からない事を聞いてくれるのは嬉しいけど……\"\n[s8] \"ごめんね、必ずしも大人が答えを知っているわけでは……\""
"10023040-96-トキ" = "そうですか……ところで、皆さんは一体何故ここに？"
"10023040-97-トキ" = "そうですか……ところで、皆さんは一体何故ここに？"
"10023040-98-トキ" = "ぜ、全然怖くないし！#nいざとなったら格闘ゲームでボコボコにしてやるんだから！"
"10023040-99-モモイ" = "お姉ちゃん、気をつけて。#nこの人……不利になったらチート装備に変えてくるよ！"
"10023040-100-ユズ" = "アリスちゃんをまた奪われるわけには、いかない……けど……#nううぅ、でも……"
"10023040-101" = "[ns] \"……私が代わりに説明するね。\""
"10023040-102-トキ" = "C&Cに間違われ、依頼を引き受けてしまった、と……なるほど。#n先生がメイド服を借りていったのは、このためだったのですね。"
"10023040-103-ミドリ" = "ど、どうしよう、お姉ちゃん？"
"10023040-104-モモイ" = "もう終わりだよぉぉぉ！#nどうしよう！？ネル先輩に怒られる！！"
"10023040-105-アリス" = "うわーん！"
"10023040-106-トキ" = "いえ、先輩方に報告はしません。#n私は任務を遂行しに来ただけですから。"
"10023040-107-トキ" = "ゲーム開発部の存在は想定外でしたが……"
"10023040-108" = "[s] \"本当に大丈夫なの？後で何か言われたり……\""
"10023040-109-トキ" = "はい、大丈夫です。"
"10023040-110-トキ" = "私を置いて行ったのは先輩方ですし……多少のイレギュラーがあろうとも、任務が達成できるなら問題ありません。"
"10023040-111" = "[ns9] \"あれ、電気が……\"\n[ns10] \"ちょっと待って、もしかして……！\""
"10023040-112-一同" = "！？！？"
"10023040-113-一同" = "！？！？"
"10023040-114-ゲストA" = "な、何が起きてるんだ？電気が全て消えた！"
"10023040-115-ゲストB" = "一体何が起きているのですか？[ruby=めいたろう]明太郎[/ruby]さん？#n説明をお願いします！"
"10023040-116-明太郎" = "お、落ち着いてください！皆様、ご安心を。#n停電は一時的なものですから、すぐに復旧します。"
"10023040-117-？？？" = "いえ、そうはさせませんよ――"
"10023040-118-明太郎" = "誰だ……？"
"10023040-119-？？？" = "ある者は、こう言いました。#n――「価値ある物は、その手に収めてこそだ」と。"
"10023040-120-？？？" = "たとえ人目に触れぬまま……何年、何十年と経過し――#nいつしか人々から忘れ去られようとも。"
"10023040-121-？？？" = "しかし、それは本当に正しいのでしょうか？#n美術品とは、広く知られてこそ、その価値を証明できるのでは？"
"10023040-122-明太郎" = "まさか……！"
"10023040-123-？？？" = "ある者は、[ruby=わたくし] 私 [/ruby]を[ruby=ぬすびと]盗人[/ruby]と蔑み――"
"10023040-124-？？？" = "そしてまた、ある者は私を[ruby=とがびと]咎人[/ruby]と罵る。"
"10023040-125-？？？" = "人は生まれながらにして名を持つわけではありません。#n呼び名とは、他者から与えられるもの。"
"10023040-126-？？？" = "故に、私は――その名を受け入れました。"
"10023040-127-？？？" = "そう、我が名は――"
"10023040-128" = "――「慈愛の怪盗」。"
