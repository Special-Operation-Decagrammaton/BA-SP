[translation]
"10023070-1" = "第7話;これは危険なゲームです"
"10023070-2-ユズ" = "うぅぅ……"
"10023070-3-ユズ" = "前が全然見えない……"
"10023070-4-モモイ" = "いたっ！誰か足踏んだでしょ！？"
"10023070-5-ミドリ" = "お姉ちゃん、しーっ！静かに！"
"10023070-6-トキ" = "っ！？皆さん、気をつけてください。足元が滑りやすくなっています。"
"10023070-7-アリス" = "うわーん！それはアリスの髪の毛です！"
"10023070-8" = "[s] \"この階段、どこまでも続いてるような……\""
"10023070-9-ユズ" = "もうかなり歩いたはずなのに……慎重に進んでいるからそう感じるのかもしれませんが……"
"10023070-10-モモイ" = "あぅ！なんかぶつかった……！"
"10023070-11-ミドリ" = "えっ、それって……"
"10023070-12-トキ" = "これは……"
"10023070-13-トキ" = "ドアでしょうか……"
"10023070-14" = "次のブツはどうした、早くせんか！"
"10023070-15" = "今日の目玉はいつ出るんだ！？#n金なら持ってきたぞ！"
"10023070-16" = "……落札できる自信はないが、一度くらい本物を拝んでおきたいものだ。"
"10023070-17" = "そうです！我々は、アレのために来てるんですよ！"
"10023070-18" = "早く見せてください……"
"10023070-19-ゲストたち" = "――「時計王の冠」を！"
"10023070-20-ミドリ" = "え、えっ……？"
"10023070-21-ミドリ" = "オークションは明日のはずじゃ……どうして、地下で……？"
"10023070-22-明太郎" = "まあまあ、皆様どうか落ち着いてください。#n他にも素敵な品を多数ご用意しておりますから。"
"10023070-23-明太郎" = "夜は長いですから、どうぞごゆるりとお楽しみください。#n「王冠」は一番最後のお楽しみということで――"
"10023070-24-興奮したゲスト" = "はんっ、見せるだけなら今でも構わないだろう！"
"10023070-25-感情が高ぶったゲスト" = "なにを勿体ぶる必要があるんですか、[ruby=めいたろう]明太郎[/ruby]さん！"
"10023070-26-冷静なゲスト" = "それに、昨日は「慈愛の怪盗」が現れたんだろう？#nオークションを開催して大丈夫なのか？"
"10023070-27-浮かれたゲスト" = "そうですよ！一番不安なのは明太郎さんでしょうけど、私たちも同じ気持ちです！"
"10023070-28-明太郎" = "ハッハッハッ！予告状が届いたのですから、当然対策しておりますとも。#n――あのC&Cとシャーレを屋敷の警備に雇ったのですから！"
"10023070-29-明太郎" = "彼女たちが時間稼ぎをしてくれている間に、我々はオークションを終わらせる。"
"10023070-30-明太郎" = "もちろん怪盗を捕らえられるのなら、それに越したことはないですが……#n私としては共倒れになろうと一向に構いません！"
"10023070-31-明太郎" = "それに――もし「慈愛の怪盗」が彼女らを破ってここにたどり着いたとしても、それまでの戦闘で消耗している事でしょう。であれば、後は私の付き人で十分。"
"10023070-32-冷静なゲスト" = "たしかに……それであれば万全の対策と言えるでしょう。#n流石は明太郎さん。"
"10023070-33-浮かれたゲスト" = "早く次のオークションに移りましょうよ。"
"10023070-34-浮かれたゲスト" = "でないと、いつになっても「時計王の冠」を拝めないじゃないですか！"
"10023070-35-明太郎" = "ありがとうございます。"
"10023070-36-明太郎" = "次は……こちらの「ゴールデンカナリア」です！"
"10023070-37-明太郎" = "隕石から産出したイエローダイヤモンドを磨き上げた、こちらの逸品……なんと！"
"10023070-38-明太郎" = "ブラックマーケットで抗争の火種となってから、#n紆余曲折あり私のもとへ渡ってきた訳アリの品でして――"
"10023070-39-ユズ" = "明太郎さん……？"
"10023070-40-トキ" = "なるほど。どこに行ったかと思えば、こんなところに居たのですね。"
"10023070-41-トキ" = "そして、取引されている品は、どれも所在が不明になっている盗品ばかり……。"
"10023070-42-アリス" = "RPGのオークション会場では、貴重なアーティファクトが取引されたり、敵の陰謀に繋がる手がかりが見つかる場所ですが……"
"10023070-43-アリス" = "アリス、思い出しました！オークションに参加するには、フラグを立てないといけません！#n特殊なクエストをクリアするか、レアモンスターを倒して大量のクレジットを用意する必要があります！"
"10023070-44-アリス" = "あそこに居るのが、このエリアのレアモンスターですか？"
"10023070-45" = "[s] \"モンスターでは無いからね！？\""
"10023070-46-明太郎" = "むむ、何か騒がしいような……"
"10023070-47-明太郎" = "……はっ、何故ここにC&Cが！？"
"10023070-48-明太郎" = "あなた達は「慈愛の怪盗」を相手にしているはずでは……？"
"10023070-49-興奮したゲスト" = "し、C&Cだと？#n話が違うじゃないか、明太郎さん！"
"10023070-50-感情が高ぶったゲスト" = "私たちを騙していたのか？"
"10023070-51-トキ" = "「時計王の冠」――C&Cが探していた盗品は、ここにあったのですね。"
"10023070-52-ゲストたち" = "！！！"
"10023070-53-トキ" = "ふむ、どうやらそれだけではないようですね。#n「我が子を持ち上げるフラヌス」に「落葉拾いのイナンナ」。#n――「ウェヌスの石像」まであるだなんて。"
"10023070-54" = "[s] \"トキ、何か心当たりがあるの？\""
"10023070-55-トキ" = "ええ――全て、犯罪組織の間で違法に取引されていた美術品です。"
"10023070-56" = "[s1] \"トキのもう一つの任務って……\"\n[s2] \"盗品の行方を追う事……？\""
"10023070-57-トキ" = "はい、先生の仰る通りです。"
"10023070-58-トキ" = "私の任務は「時計王の冠」をはじめ、盗品の行方を明らかにする事です。"
"10023070-59-トキ" = "「慈愛の怪盗」を追えば盗品にたどり着くと考え、屋敷に来ましたが……#n――まさか地下で違法取引が行われていたとは。"
"10023070-60-明太郎" = "は、話と違うじゃないか！#nそんなの私は聞いとらんぞ！"
"10023070-61-トキ" = "ええ、聞かれておりませんので。"
"10023070-62-明太郎" = "むむむ……！"
"10023070-63-明太郎" = "お前たち、C&Cの身柄を拘束しろ……くれぐれも「丁重」にな！"
