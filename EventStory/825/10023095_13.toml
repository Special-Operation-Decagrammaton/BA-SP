[translation]
"10023095-1-警備ロボットA" = "こちらです！"
"10023095-2-明太郎" = "はあ、はあ……！どうして……こんな事にっ……！"
"10023095-3-慈愛の怪盗" = "ごきげんよう――素敵な夜ですね。"
"10023095-4-明太郎" = "また現れおって……「慈愛の怪盗」め！"
"10023095-5-慈愛の怪盗" = "おや、熱烈な歓迎ですね……そんなに興奮されても困ってしまいます。"
"10023095-6-明太郎" = "まだ諦めておらんとは……！"
"10023095-7-慈愛の怪盗" = "ふふ……本当にそう思っていたのですか？"
"10023095-8-明太郎" = "ええい、うるさい！#nこれは私のものだ……金を払わん限り、誰にも渡すつもりは無い！"
"10023095-9-慈愛の怪盗" = "嗚呼、それはいけない――その王冠は貴方の物ではないでしょう？#nそれは、お嬢さん方のものだ。"
"10023095-10-慈愛の怪盗" = "貴方のような価値の分からぬ成金には――相応しくない。"
"10023095-11-明太郎" = "お前の意見など聞いとらん！#nケッ……C&Cも所詮は噂だけだったか。"
"10023095-12-慈愛の怪盗" = "事情も伝えずに王冠を守れだなんて……#nよくもまあ、そのような無茶を蕾たちに言ったものですよ。"
"10023095-13-慈愛の怪盗" = "そもそも貴方が依頼したのは、本当にC&Cだったのですか？"
"10023095-14-明太郎" = "なに……どういう事だ？"
"10023095-15-慈愛の怪盗" = "嗚呼、お気になさらず。#n金稼ぎしか考えていない貴方にとっては、どうでも良い話でしょうから。"
"10023095-16-明太郎" = "おわっ！？"
"10023095-17-モモイ" = "みんな、今だよ！"
"10023095-18-ミドリ" = "お姉ちゃん、王冠を確保しないと！"
"10023095-19-明太郎" = "と、止めろ！"
"10023095-20-明太郎" = "警備たち！"
"10023095-21-トキ" = "全力で敵を排除します。"
"10023095-22-アリス" = "光よ！"
"10023095-23-明太郎" = "王冠は……この王冠は、私の物だ……！"
"10023095-24-ユズ" = "……ん？何故こんな所に箱が……"
"10023095-25-ユズ" = "ま、まさか！？"
"10023095-26-ユズ" = "もう……逃げ場はありません。[ruby=めいたろう]明太郎[/ruby]さん……"
"10023095-27-ユズ" = "王冠を……渡してください。#nそうすれば、誰も傷付かずに済みます……"
"10023095-28-明太郎" = "ふざけるな！私は絶対に屈しない！"
"10023095-29-ユズ" = "……仕方ない……ですね……"
"10023095-30-ユズ" = "お願い、します。"
"10023095-31-明太郎" = "な、はっ！？"
"10023095-32-慈愛の怪盗" = "最初からこうした方が早かったと思いますよ？"
"10023095-33-ユズ" = "でも……せめて、お話を聞いてから……"
"10023095-34-ユズ" = "「時計王の冠」……回収しました……！"
"10023095-35-ユズ" = "よ、良かったぁ……"
"10023095-36-トキ" = "パンパカパーン！仲間と力を合わせて、宝物を取り戻しました！"
"10023095-37-トキ" = "盗品の回収を完了しました。#nこれで私の任務も無事終わりです。"
"10023095-38-明太郎" = "C、C&C……！お前たち、私を裏切ったのか！この恥知らずめ！"
"10023095-39-トキ" = "恥知らずなのは、本当に私たちでしょうか？"
"10023095-40-トキ" = "C&Cが動いている裏で地下オークションを開き、#n盗品の売買を行っていたあなたに言われたくはありません。"
"10023095-41-トキ" = "――私、[ruby=あすま]飛鳥馬[/ruby]トキが、あなたを拘束します。"
"10023095-42-明太郎" = "ふ、ふざけるな！"
"10023095-43-明太郎" = "こんなところで捕まってたまるか！！"
"10023095-44-モモイ" = "あっ、逃げた！"
"10023095-45-トキ" = "お任せください。"
"10023095-46-？？？" = "ふふ……では、お嬢さんの代わりに、王冠は私がありがたく頂くとしましょうか。"
"10023095-47-モモイ" = "ゲホ、ゲホッ！煙で……前が見えない……！"
"10023095-48-ミドリ" = "この煙幕……まさか……！？"
"10023095-49-ミドリ" = "ゆ、ユズちゃん！#n王冠！気をつけて！"
"10023095-50-ユズ" = "う、うん……！しっかり握ってる、から……！"
"10023095-51-？？？" = "ふふ……果たして、それは本物の王冠かな？"
"10023095-52-ユズ" = "え、えっ……？"
"10023095-53-モモイ" = "これ……"
"10023095-54-モモイ" = "銅の塊じゃん！"
"10023095-55-ミドリ" = "……いつの間に！？"
"10023095-56-慈愛の怪盗" = "お疲れ様でした、皆々様。#n――嗚呼、お嬢さん方には感謝していますよ。"
"10023095-57-慈愛の怪盗" = "「時計王の冠」――しかとこの手に。"
