[translation]
"10023055-1-慈愛の怪盗" = "嗚呼、奇怪な格好なのになかなかどうして――やりますね。"
"10023055-2-トキ" = "ありがとうございます、[ruby=・   ・   ・]泥棒様[/ruby]。#nこれでよろしいのでしょう？"
"10023055-3-慈愛の怪盗" = "――「[ruby=・   ・]怪盗[/ruby]」ですよ、お嬢さん。"
"10023055-4-トキ" = "！？こんなところに罠が……？"
"10023055-5-慈愛の怪盗" = "次からは、足元にも気を配ったほうが良いですよ。#nせっかくのダンスが台無しになってしまいますから。"
"10023055-6-慈愛の怪盗" = "！？"
"10023055-7-モモイ" = "――させないよ！"
"10023055-8-ミドリ" = "……私たちも加勢します！"
"10023055-9-慈愛の怪盗" = "おや、可愛いメイドさんですね。"
"10023055-10-ミドリ" = "か、可愛いだって！えへへ……"
"10023055-11-ミドリ" = "お姉ちゃん！喜んでる場合じゃないでしょ！？"
"10023055-12-モモイ" = "ここで私たちが……あなたを止めます！"
"10023055-13-慈愛の怪盗" = "ふふ……その心意気も美しい。#n……でも、残念です。"
"10023055-14-慈愛の怪盗" = "……最初の一撃で仕留めるべきでしたね。"
"10023055-15-慈愛の怪盗" = "向こう見ずの勇気は美学から最も遠い存在ですよ、お嬢さん。#n――君は、弱いのだから。"
"10023055-16-モモイ" = "そうかも、しれないけど……！"
"10023055-17-ミドリ" = "あなたの相手は、私たちだけではありません！"
"10023055-18-慈愛の怪盗" = "……？"
"10023055-19-アリス" = "光よ！"
"10023055-20-慈愛の怪盗" = "くっ……！？"
"10023055-21-モモイ" = "ありがとう、アリス！"
"10023055-22-モモイ" = "えっと……周りに被害は出てないよね？"
"10023055-23-モモイ" = "はい！今日のアリスは光属性単体アタッカーです！#nですので、一つの目標に全ての火力を集中させています！"
"10023055-24-慈愛の怪盗" = "……！"
"10023055-25-ミドリ" = "……まだ動けるんですね。"
"10023055-26-ユズ" = "――う、撃ちます……！"
"10023055-27-慈愛の怪盗" = "うっ！？"
"10023055-28-モモイ" = "今だ！捕まえて！"
"10023055-29-ミドリ" = "うん、お姉ちゃん！"
"10023055-30-モモイ" = "うわっ！？"
"10023055-31-ミドリ" = "きゃぁっ！"
"10023055-32-モモイ" = "ど、どうなってるの！？"
"10023055-33-ミドリ" = "見て、天井に！"
"10023055-34-慈愛の怪盗" = "――ふむ。先程までの言葉を撤回するとしましょう。"
"10023055-35-慈愛の怪盗" = "お嬢さん方は――もう相当な実力をお持ちのようだ。#nお名前は？"
"10023055-36-トキ" = "私はC&C所属、コールサインゼロフォー。[ruby=あすま]飛鳥馬[/ruby]トキと申します。"
"10023055-37-慈愛の怪盗" = "ふむ――あのC&Cが[ruby=どうだ]銅田[/ruby]に協力とは……。"
"10023055-38-トキ" = "一体、何故ですか？"
"10023055-39-モモイ" = "依頼の報酬で……新しいプライステーションPro7を買おうかなって……"
"10023055-40-モモイ" = "……うん？"
"10023055-41-モモイ" = "お姉ちゃん！本当に買うつもりだったの！？"
"10023055-42-モモイ" = "いや！そうじゃなくて……！#n私たちは美術品を――"
"10023055-43-ミドリ" = "――怪盗から守りたくて！"
"10023055-44-慈愛の怪盗" = "……"
"10023055-45" = "[ns] \"どうして美術品を盗もうと思ったの……？\""
"10023055-46-慈愛の怪盗" = "貴方は……"
"10023055-47-慈愛の怪盗" = "嗚呼――記憶の澱に沈んでしまっていたけれど、その顔には見覚えがあります。"
"10023055-48-慈愛の怪盗" = "――シャーレの「先生」、ですね？"
"10023055-49-慈愛の怪盗" = "あの日――[ruby=わたくし] 私 [/ruby]たち七囚人が矯正局から解き放たれた記念すべき日に、キヴォトスに足を踏み入れたという――"
"10023055-50-慈愛の怪盗" = "なるほど……そういう事でしたか。"
"10023055-51-明太郎" = "「慈愛の怪盗」め！#nこの屋敷に忍び込んだが最後、そう簡単には抜け出せんぞ！"
"10023055-52-ミドリ" = "ちょ、ちょっと！そんな無差別に撃ったら、私たちまで……！"
"10023055-53-ミドリ" = "あっ……！？"
"10023055-54-ユズ" = "ミドリ！？"
"10023055-55-ミドリ" = "（えっ……？）"
"10023055-56-ミドリ" = "（私、落ちてる……？）"
"10023055-57-慈愛の怪盗" = "ふふっ、お怪我はありませんか？お嬢さん。"
"10023055-58-アリス" = "……！「慈愛の怪盗」がミドリを助けてくれました！"
"10023055-59-モモイ" = "ミドリ、怪我は！？"
"10023055-60-ミドリ" = "う、うん……大丈夫。#nでも、どうして「慈愛の怪盗」が私を……？"
"10023055-61-ミドリ" = "（何でだろう……？）"
"10023055-62-慈愛の怪盗" = "なるほど、今宵の舞台は面白くなりそうですね――"
"10023055-63-慈愛の怪盗" = "一つ、お嬢さん方に伝えておきましょう。#n表面の事象に囚われていては、本質を見極める事など夢のまた夢ですよ。"
"10023055-64-慈愛の怪盗" = "――それでは、これにて失礼。……そう遠からず、またお会いする事になるでしょうけれど。その時まで、良い夢を。bye！"
"10023055-65-モモイ" = "逃げた！"
"10023055-66-ミドリ" = "お姉ちゃん、見てこれ！"
"10023055-67-ミドリ" = "「予告は実行されておりません」だって。"
"10023055-68-モモイ" = "ふん、あと一歩で捕まるところだったくせに！"
"10023055-69-ミドリ" = "今回は謎解き要素が無いね……#nというか、毎回いろんなパターンのヤツを持ち歩いてるのかな……。"
"10023055-70-ミドリ" = "皆様……こちら、ご説明いただいても？"
"10023055-71-モモイ" = "わっ！？そ、それが……！"
"10023055-72" = "[s] \"全て我々が計画した陽動作戦です。\""
"10023055-73-ミドリ" = "先生！"
"10023055-74-モモイ" = "ほう……詳しくお伺いしても？"
"10023055-75-明太郎" = "なるほど……５人目のメンバーは遅れて合流する計画だった、と。"
"10023055-76-明太郎" = "作戦は成功しかけていたという事だったのですね。"
"10023055-77" = "[s] \"申し訳ありません、あと一歩のところで……\""
"10023055-78-明太郎" = "謝らないでください。何も盗まれてなどいないのですから……それに、あの「慈愛の怪盗」をあそこまで追い詰めたその手腕、流石と言わざるを得ません。"
"10023055-79-明太郎" = "取り逃がしこそしましたが……皆様の実力は怪盗に伝わったはず。#nもう二度と現れないかもしれません。"
"10023055-80-ミドリ" = "そ、それは流石に無いと思いますが……。"
"10023055-81-ゲストB" = "あの、[ruby=めいたろう]明太郎[/ruby]さん。これは一体どういうことなんですか？"
"10023055-82-ゲストB" = "まさか、「慈愛の怪盗」が現れるだなんて。#n事前に知っていたら、断っていたのに……"
"10023055-83-ゲストB" = "さあさ皆様、落ち着いてください。#n「慈愛の怪盗」が来て、何か問題は発生しましたか？"
"10023055-84-ゲストA" = "ご覧の通り、私たちは怪盗を退けました。#nそうですよね？"
"10023055-85-明太郎" = "それもそのはず。#nこの屋敷を警備しているのは、かの有名なC&Cなのですから！"
"10023055-86-ゲストB" = "C&C……噂に聞いた事がある。#n……ミレニアム最強のエージェントだとか。"
"10023055-87-ゲストB" = "それが本当なら、怪盗を追い払えたのも納得がいく。"
"10023055-88-明太郎" = "皆様、ご納得くださり、お礼を申し上げます。"
"10023055-89-明太郎" = "ひとまず今日のパーティーは、一度お開きにした方が良さそうですね。#nゲストの方々はお部屋までご案内いたしますので、こちらへ……"
"10023055-90-明太郎" = "では、C&Cの皆様もお疲れでしょうし、今日のところはごゆるりと。#n今後の計画は、それからでも構いません。"
"10023055-91-モモイ" = "……（な、なに、めっちゃ睨まれてるけど！？）"
"10023055-92-トキ" = "……"
"10023055-93-ミドリ" = "（先生……さっきからトキさんがこっちをずっと見ているんですが……）"
"10023055-94" = "[ns] \"えっと……トキ、まずは落ち着いて……\""
"10023055-95-トキ" = "そ、そんな風に睨まれたって、全然怖くないんだからね！"
"10023055-96-トキ" = "というか、協力したんだし……感謝の言葉くらいあってもいいんじゃないかな！"
"10023055-97-トキ" = "……そうですね。"
"10023055-98-トキ" = "ありがとうございます、ゲーム開発部の皆さん。"
"10023055-99-モモイ" = "え、え？ええっ？"
"10023055-100-ミドリ" = "えっ……！"
"10023055-101-トキ" = "いえ、助けていただいたのは事実ですので……#n伝えるのが遅くなり申し訳ありません。"
"10023055-102-トキ" = "じゃ、じゃあ……なんで睨んでたの！？"
"10023055-103-トキ" = "あまりこういった事態に慣れておりませんので……#nどのように話を切り出せばいいのか、分からず……"
"10023055-104-モモイ" = "つまり、トキさんは何を言えば良いのか分からなくて、こっちを見ていただけって事ですか……？"
"10023055-105-モモイ" = "はい。先に話を切り出してくださり、ありがとうございます、モモイ。"
"10023055-106-トキ" = "そして、今後のことなのですが――"
"10023055-107-ミドリ" = "なるほど。トキさんの任務は、「慈愛の怪盗」を阻止することだったんですね……"
"10023055-108-トキ" = "はい、同時に別の任務も遂行中ではありますが。"
"10023055-109-トキ" = "その……私たちが任務の足を引っ張った、とか……#nネル先輩に言ったりしないよね？"
"10023055-110-トキ" = "いえ、そのような事はいたしません。#nむしろ、ゲーム開発部の皆さんは最善を尽くしているかと。"
"10023055-111-トキ" = "……そうですね。#nここは一つ、C&Cとゲーム開発部の合同作戦……というのはどうでしょう。"
"10023055-112-トキ" = "その……本当に良いんですか？"
"10023055-113-モモイ" = "大丈夫です。先輩方は居ませんし。"
"10023055-114-ミドリ" = "そういう問題なのかな？"
"10023055-115-トキ" = "ええ、そういう問題です。"
"10023055-116-トキ" = "それでは、トキも仲間になるんですね？"
"10023055-117-トキ" = "……？"
"10023055-118-トキ" = "アリスはトキとパーティーを組みたいです。#n一緒にこのクエストを解決したいです！"
"10023055-119-トキ" = "な、仲間……ですか？"
"10023055-120-アリス" = "やっぱり、ダメですか……？"
"10023055-121-トキ" = "そういうわけではありませんが……#nそれに……先日、断ったりもしましたし……"
"10023055-122-アリス" = "大丈夫です。仲間は怖くありません！#nそれでは、今からトキとゲーム開発部は、仲間です！"
"10023055-123-トキ" = "あ、ありがとうございます。そう言って、くださって……"
"10023055-124-アリス" = "パンパカパーン！トキがパーティーに加わりました！"
"10023055-125-トキ" = "ひゃっ！？"
"10023055-126-トキ" = "い、いったい何を……？"
"10023055-127-トキ" = "……（なでなで）"
"10023055-128-トキ" = "（ちょうど良い位置に頭があって撫でやすいですね……なんだか、心が穏やかに……）"
"10023055-129-モモイ" = "……大丈夫かな。"
"10023055-130-モモイ" = "アリスもああ言ってるし、心配いらないよ。"
"10023055-131-ユズ" = "良かったね、アリスちゃん。トキさんも……"
"10023055-132" = "（そうして、トキはゲーム開発部の仲間になった）"
"10023055-133" = "（めでたし、めでた……）"
"10023055-134" = "（続く！）"
