[translation]
"10023050-1" = "第5話;晴れのち曇り、怪盗注意報"
"10023050-2-モモイ" = "慈愛の……？"
"10023050-3-ミドリ" = "……怪盗？"
"10023050-4-ユズ" = "あの人が……"
"10023050-5-アリス" = "緊急クエスト発生です！"
"10023050-6-トキ" = "……！"
"10023050-7-ユズ" = "え……？#nトキさん、一体何を！？"
"10023050-8-慈愛の怪盗" = "……"
"10023050-9-トキ" = "……"
"10023050-10-慈愛の怪盗" = "その並外れた身のこなし――美しい。"
"10023050-11-トキ" = "私の身体能力を見定めて、どうするつもりですか？"
"10023050-12-慈愛の怪盗" = "ふふっ……純粋な褒め言葉ですよ。"
"10023050-13-トキ" = "お礼でも述べるべきでしたか？"
"10023050-14-トキ" = "嗚呼、この美学が通じないだなんて――私はとても悲しいです。"
"10023050-15-トキ" = "……？#n意図を図りかねますが……"
"10023050-16-トキ" = "――私は「王冠」と呼ばれる盗品を探しています。#nあなた、何かご存知なのでは？"
"10023050-17-慈愛の怪盗" = "何故、それを[ruby=わたくし] 私 [/ruby]に？"
"10023050-18-トキ" = "あなた、泥棒なのでしょう？"
"10023050-19-慈愛の怪盗" = "……"
"10023050-20-トキ" = "失礼、それとも「泥棒様」とお呼びしたほうが良かったですか？"
"10023050-21-慈愛の怪盗" = "ふふっ……嗚呼、そうですね。"
"10023050-22-慈愛の怪盗" = "一つ、訂正をさせてくださいませ。"
