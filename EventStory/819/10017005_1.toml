[translation]
"10017005-1" = "プロローグ;キヴォトスのクリスマス！"
"10017005-2" = "トリニティ校内"
"10017005-3-セリナ" = "春の芽吹き、夏の海、秋の紅葉……そして……"
"10017005-4-ハナエ" = "冬といえば、雪ですね！"
"10017005-5-セリナ" = "もちろんそれもありますが……#n他には何が浮かびますか？"
"10017005-6-ハナエ" = "あとは……クリスマスですね！"
"10017005-7-セリナ" = "そう、クリスマス！"
"10017005-8-ハナエ" = "クリスマス！！！"
"10017005-9-セリナ" = "ツリーを飾って！"
"10017005-10-ハナエ" = "キャロルを歌って！"
"10017005-11-セリナ" = "プレゼントを準備して！"
"10017005-12-ハナエ" = "サンタクロースを待ちます！"
"10017005-13-一同" = "わーい！！！"
"10017005-14" = "[ns] \"二人とも楽しそうだね。\""
"10017005-15-ハナエ" = "だってクリスマスですもん！"
"10017005-16-セリナ" = "あはは……まあ、あまり浮かれてばかりもいられないのですが。"
"10017005-17-ハナエ" = "もちろん、やるべきことも忘れてませんよ！#nだからこそこうやって、サンタ服になったのです！"
"10017005-18-セリナ" = "やる気満々ですね、ハナエちゃん……"
"10017005-19-セリナ" = "と、ところで先生、いかがでしょう……？#n変……だったりしますか？？"
"10017005-20" = "[s1] \"よく似合ってるよ。\"\n[s2] \"正統派ヒロイン、最高。\""
"10017005-21-ハナエ" = "私は？私はどうですか、先生！"
"10017005-22" = "[s3] \"ハナエも可愛い！\"\n[s4] \"元気さとこの季節の落ち着きがマッチしてる。\""
"10017005-23-ハナエ" = "だそうですよ、先輩！#n朝早くから準備した甲斐がありましたね！"
"10017005-24-セリナ" = "は、ハナエちゃん……！"
"10017005-25" = "[s] \"そういえば、救護騎士団もクリスマスを祝うんだね。\""
"10017005-26-ハナエ" = "当然です！#nむしろクリスマスこそ、救護騎士団が本領を発揮する時期です！"
"10017005-27-セリナ" = "いつでも救護騎士団の活動は変わりませんが……#nクリスマスも例外ではない、ということです。"
"10017005-28-？？？" = "お二人とも、お待たせしました。"
"10017005-29-ミネ" = "今年もこのクリスマスの日がやってきました……。"
"10017005-30-ミネ" = "聖なる日ではありますが、私たちは変わらず「救護」を届けます。"
"10017005-31-ミネ" = "必要な場所に、必要な救護を。この一年のことを振り返りつつも、あらためて使命を見つめ直すのです。"
"10017005-32" = "[s] \"なるほど……具体的には、何をするの？\""
"10017005-33-セリナ" = "簡単に言うと、「ボランティア」ですね。"
"10017005-34-ハナエ" = "鍋をおいて、道いく人に募金をお願いしたり！"
"10017005-35-ハナエ" = "あとはキャロルを歌ったり、手編みの手袋や帽子を配ったりもするんです！"
"10017005-36-ハナエ" = "セリナ先輩のキャロル、すっごい綺麗なんですよ？楽しみにしててくださいね、先生！"
"10017005-37-セリナ" = "は、ハナエちゃん、そこまで言われるとハードルが……"
"10017005-38" = "[ns5] \"なるほど、それで手伝ってほしいってことだね。\"\n[ns6] \"じゃあ、救護騎士団と一緒にクリスマスを過ごさせてもらおうかな。\""
"10017005-39-ミネ" = "セリナもハナエも、元気いっぱいなのは良いことですね。"
"10017005-40-ミネ" = "先生、突然のことでご迷惑をおかけしてしまいすみません。"
"10017005-41" = "[s7] \"ううん、全然迷惑なんてことは。\"\n[s8] \"みんなのキャロルも楽しみだし！\""
"10017005-42-ミネ" = "ありがとうございます。では、皆さんはお先に現場へ向かってください。"
"10017005-43-ミネ" = "私はトリニティをぐるっと巡ってから、合流しますので。"
"10017005-44-セリナ" = "分かりました、団長もお気をつけて。"
"10017005-45-ハナエ" = "了解です！！"
"10017005-46" = "#video;10017"
