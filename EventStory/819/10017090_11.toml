[translation]
"10017090-1" = "エピローグ;クリスマスキャロルは"
"10017090-2" = "おぉ……本当にこうなるとは……。"
"10017090-3" = "ふふっ、確かに。#n何がどうなるか、分からないものですね。"
"10017090-4" = "覚えてますか？#n良ければ後で寄ってください、とお伝えしたこと。"
"10017090-5" = "はい、もちろんです。あの時は、「もし行ければ」くらいに思っていたのですが……。"
"10017090-6" = "一時はどうなることかと思いましたが、良かったです。#nやはり正義は勝つものですね。"
"10017090-7" = "私は最初からこうなる気がしていました！"
"10017090-8" = "あら、そうだったんですか？"
"10017090-9" = "あっ、生意気なこと言ってすみません！？"
"10017090-10" = "いえ、そんなことは。むしろその姿勢は、見習いたいくらいです。"
"10017090-11" = "そ、そう言ってもらえると嬉しいですが、恥ずかしいですね……！"
"10017090-12" = "[ns] \"代表として、ミネから一言どう？\""
"10017090-13" = "私、ですか……今でもここに居ること自体、厚かましいのではと思うものの……。"
"10017090-14" = "責任は取る、ですか……？うぅーん……"
"10017090-15" = "その、今日は色んな事を起こしてしまいましたが……#n救護騎士団各位は、今年もそれぞれ責務を果たしてくれました。"
"10017090-16" = "その点については、それぞれが誇りを持っても良いと思います。"
"10017090-17" = "私の方も、今後さらに自分自身を磨いていきます。"
"10017090-18" = "それで大丈夫か……。"
"10017090-19" = "まあ、改善されることを願いましょう。"
"10017090-20" = "紅茶の世界は深いですね、これは一体どうしたら……。"
"10017090-21" = "もしお節介でなければ、少しお話をよろしいでしょうか？#n多少は分かる方でして。"
"10017090-22" = "ミ、ミネ団長！？#n光栄です……！"
"10017090-23" = "確かに、団長はそういうのもお詳しいですもんね。"
"10017090-24" = "より良い治療のためには、様々な知識が必要ですからね！"
"10017090-25" = "その努力が、もう少し別方面にも発揮されてくれると良いのですが……。"
"10017090-26" = "……そうだな。"
"10017090-27-ハナエ" = "あ、そうだ！#nこれ私たちが作った手袋と帽子なんですが……よろしければいかがですか？"
"10017090-28-正義実現委員会部員" = "い、良いんですか……？"
"10017090-29-セリナ" = "はい、多めに作りましたので。#nぜひ受け取ってください、せっかくのクリスマスですし。"
"10017090-30-正義実現委員会部員" = "ありがとうございます……#nおかげで、素敵なクリスマスになりそうです。"
"10017090-31-ハナエ" = "えへへっ。#nみなさんメリークリスマス、です！"
"10017090-32-セリナ" = "皆さんにとって、良いクリスマスになりますように。"
"10017090-33-ミネ" = "あらためて一年間、お疲れ様でした。#nメリークリスマス。"
"10017090-34-一同" = "メリークリスマス！"
"10017090-35" = "聖堂のメリークリスマス 〜救護騎士団の贈り物〜"
