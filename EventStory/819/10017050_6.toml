[translation]
"10017050-1" = "第５話;シビレル・ウォー"
"10017050-2" = "カフェ「White&Mason」"
"10017050-3-正義実現委員会部員A" = "あの……えっと、こういうのは久しぶりと言うか、ほとんど初めてでして……"
"10017050-4-正義実現委員会部員B" = "ど、どう振舞えば良いものか……。"
"10017050-5-ハスミ" = "固くなることはありません。"
"10017050-6-ハスミ" = "美味しいスコーンとケーキ、そして香りの良い紅茶……。"
"10017050-7-ハスミ" = "せめてそれらを、好きに味わっていただければ。"
"10017050-8-正義実現委員会部員A" = "で、ですがその……私たち、ハスミ副委員長みたいに品のある飲み方も知らなくて……。"
"10017050-9-正義実現委員会部員B" = "多分私の舌だと、紅茶の良さも分からず……。"
"10017050-10-ハスミ" = "気にする必要は無いですよ。"
"10017050-11-ハスミ" = "それらが楽しみ方を添えてくれることがあるとはいえ、知識が無いと味わえないということではありません。"
"10017050-12-ハスミ" = "何よりこの場は、皆さんの一年間の頑張りを労う場所。"
"10017050-13-ハスミ" = "あなたたちが楽しめるように、好きに楽しめば良いのです。#nさあ、どうぞ召し上がってください。"
"10017050-14-正義実現委員会部員A" = "あ、ありがとうございます……。"
"10017050-15-正義実現委員会部員B" = "ところで……ミルクティーを淹れる時は、牛乳に紅茶を注ぐのが正しいでしょうか、それとも紅茶に牛乳を注ぐのが良いのでしょうか？"
"10017050-16-正義実現委員会部員A" = "紅茶の中に、冷たい牛乳を注ぐのが正しいのでは？#nそうすると熱い紅茶を牛乳が冷ましてくれて、飲みやすいですし。"
"10017050-17-正義実現委員会部員B" = "……でもよく考えると、温めた牛乳に紅茶を注ぐ方が正しくないでしょうか？#nその方が牛乳の香ばしい味と紅茶が調和し、より深い味を出してくれるのでは？"
"10017050-18-正義実現委員会部員A" = "ですが、牛乳を温める過程で表面に薄い膜ができちゃいますよ？"
"10017050-19-正義実現委員会部員A" = "結果的に紅茶に変なものが混ざり、せっかくの味が勿体ないです！"
"10017050-20-正義実現委員会部員B" = "それは何も知らないからそう思うんです！#n紅茶に牛乳を注ぐとタンパク質が変異して変わった香りが生まれてしまい、"
"10017050-21-正義実現委員会部員B" = "紅茶の成分と混ざって、紅茶の渋みに影響する乳脂肪まで変異します。結果として、味の調節ができません！"
"10017050-22-正義実現委員会部員B" = "逆に牛乳の中へと紅茶を注ぐと、一定温度以上にお茶が熱くならないので変異が起きません。ミルクティーの味を完全に楽しめます！"
"10017050-23-正義実現委員会部員A" = "それでも紅茶に牛乳！"
"10017050-24-正義実現委員会部員B" = "牛乳に紅茶！"
"10017050-25-ハスミ" = "お、落ち着いてください。"
"10017050-26-正義実現委員会部員A" = "はっ！ご、ごめんなさいハスミ副委員長……！"
"10017050-27-正義実現委員会部員B" = "つい夢中になってしまい、醜態を……!"
"10017050-28-ハスミ" = "いえ、構いません。ですがそれは、危険な質問ですよ。"
"10017050-29-正義実現委員会部員A" = "危険な質問……？"
"10017050-30-ハスミ" = "はい。なにせあの質問は、100年以上も論争が終わらないものなのですから。"
"10017050-31-ハスミ" = "未だに、明確な結論は出ていません。"
"10017050-32-ハスミ" = "牛乳に紅茶を注いだ方が、少し渋みを減らせるとも言われていますが……"
"10017050-33-ハスミ" = "先ほど仰っていたように、その渋みを調節して楽しむ方もいます。それに、牛乳を加熱する時に出る風味が良いという方も……"
"10017050-34-ハスミ" = "「牛乳に紅茶を注ぐ派」と「紅茶に牛乳を注ぐ派」に分かれてしまい、争いが絶えないのです。"
"10017050-35-正義実現委員会部員B" = "そ、そうだったんですね……！"
"10017050-36-正義実現委員会部員A" = "では……気楽に嗜む方針で、頂くことにします！"
"10017050-37-ハスミ" = "思っていたよりはみなさん楽しめているようで、何よりです。"
"10017050-38-ハスミ" = "……ツルギ、大丈夫ですか？"
"10017050-39-ツルギ" = "きえぇ……"
"10017050-40-ハスミ" = "ツルギ、もう少し肩の力を……"
"10017050-41-ハスミ" = "さあ。この紅茶とお茶菓子、好きでしょう？"
"10017050-42-ツルギ" = "……嫌いじゃない。"
"10017050-43-ツルギ" = "だけど……"
"10017050-44-ツルギ" = "……私が席にいるだけで、誰かしらが緊張する。"
"10017050-45-ハスミ" = "そうは言っても、同じ正義実現委員会ですよ。#nそれに委員長なんですから、そこまで気にしなくても……"
"10017050-46-ツルギ" = "努力、する……。"
"10017050-47-ハスミ" = "それなら良いのですが……。"
"10017050-48" = "カフェ「White&Mason」入口"
"10017050-49-正義実現委員会部員" = "あの、マシロ？一体何を……？"
"10017050-50-マシロ" = "ご覧の通り、警備中です。"
"10017050-51-正義実現委員会部員" = "で、でも、せっかくのクリスマスパーティーなのに"
"10017050-52-マシロ" = "確かにそうです。#nですが、いえだからこそ、みなさんがそれを楽しめるように……！"
"10017050-53-マシロ" = "それもまた、一つの正義なので！"
"10017050-54-正義実現委員会部員" = "分かるけど……マシロも、少しくらいは楽しんだら……？"
"10017050-55-マシロ" = "大丈夫です。正義を守ることは、#n私にとって「パーティー」と同様なので！"
"10017050-56-正義実現委員会部員" = "えぇ……？#nでも、その……。"
"10017050-57-ツルギ" = "……交代だ。"
"10017050-58-正義実現委員会部員" = "い、委員長！？"
"10017050-59-マシロ" = "ツルギ先輩？どうかしましたか？"
"10017050-60-ツルギ" = "……交代に来た。"
"10017050-61-マシロ" = "ですが先輩は……"
"10017050-62-正義実現委員会部員" = "わ、私はこれで失礼します……！"
"10017050-63-マシロ" = "……大丈夫ですか？"
"10017050-64-ツルギ" = "……こっちの方が楽だ。"
"10017050-65-マシロ" = "……分かりました。#nそれではまた後で来ますので、一旦お言葉に甘えて……"
"10017050-66-ミネ" = "――救護騎士団が正義実現委員会に、聞きたいことがあります！"
"10017050-67-マシロ" = "な、何ですか、急に変な形で繋げて……。"
"10017050-68-マシロ" = "って、救護騎士団のミネ団長じゃないですか。"
"10017050-69-マシロ" = "どうかしましたか？何かご用事が？"
"10017050-70-ミネ" = "確認させてください。あなた方正義実現委員会は今日、#n不良たちからクリスマスチキンを回収したのですか？"
"10017050-71-ツルギ" = "……？ "
"10017050-72-ツルギ" = "（回収……したな)"
"10017050-73-マシロ" = "（事実は明確に伝えるのが、正義に繋がりますよね)"
"10017050-74-マシロ" = "はい、そうですね。"
"10017050-75-ミネ" = "左様でしたか……"
"10017050-76-ミネ" = "私は悲しいです！！"
"10017050-77-ミネ" = "せっかくのクリスマスに、正義実現委員会が正義を見失うだなんて！"
"10017050-78-マシロ" = "ど、どういうことですか……？"
"10017050-79-ミネ" = "先ほど認めた以上、知らないとは言わせません……#nそれとも、本当に見失ってしまったと？"
"10017050-80-ミネ" = "戻ってきてください、正義実現委員会！#nこれまでずっと、一緒に救護を実現してきたではありませんか！"
"10017050-81-ツルギ" = "（……いつものことながら、わけが分からない)"
"10017050-82-マシロ" = "えっと、団長。#n今日はクリスマスということで、ささやかなパーティーを開催しているのですが……。"
"10017050-83-マシロ" = "救護騎士団にとっても大事な日だったかと思います。そんな日に、何を……？"
"10017050-84-ミネ" = "だからこそです！"
"10017050-85-ツルギ" = "……！？"
"10017050-86-ミネ" = "休息を取ることに、文句を言っているのではありません。"
"10017050-87-ミネ" = "ですが他でもないこのクリスマスの日に、正義実現委員会が正義を失念するなんて！"
"10017050-88-ミネ" = "それならば私は、盾を持って立ちはだかるしかありません！"
"10017050-89-ミネ" = "それがあなた達、正義実現委員会への最大限の敬意です！"
"10017050-90-マシロ" = "あ、あの……できれば最初の方からお話を……。"
"10017050-91-ミネ" = "しらを切るつもりですか！？#n不良たちのチキンを回収したのでしょう！？"
"10017050-92-ミネ" = "相手が不良であれ何であれ、#n正義実現委員会が物を奪ったという事実が変わらないのであれば……！"
"10017050-93-ミネ" = "私は公平に、「救護」を届けます！それが救護騎士団ですから！"
"10017050-94-マシロ" = "た、確かに回収しましたが、あのチキンは……!"
"10017050-95-ミネ" = "ここまで申し上げても分からないとは……#nそれとも、分からなくて良いと決意してしまったのですか？"
"10017050-96-ミネ" = "どちらだとしても、私は悲しい限りです！"
"10017050-97-ツルギ" = "……どけ、マシロ。"
"10017050-98-マシロ" = "つ、ツルギ先輩？"
"10017050-99-ツルギ" = "（事情もわけも分からないが……)"
"10017050-100-ツルギ" = "（久しぶりに、あいつらが休息を取れてるこの状況……邪魔させるわけにはいかない)"
"10017050-101-ツルギ" = "こうなったら話は通じない、中に入れ。"
"10017050-102-マシロ" = "いえ、それはできません。"
"10017050-103-マシロ" = "先輩が立っているのに私だけが引くなんて、正義ではありませんから！"
"10017050-104-ツルギ" = "……じゃあ手伝え。"
"10017050-105-マシロ" = "はい！"
"10017050-106-ミネ" = "参ります！『救護が必要な場に救護を』！"
