[translation]
"10017085-1" = "第８話;真冬の夜の夢"
"10017085-2" = "カフェ「White&Mason」入口"
"10017085-3-チンピラA" = "ぐあぁぁっ！？"
"10017085-4-チンピラB" = "ま、負けた……！"
"10017085-5-チンピラA" = "ど、どうして……。"
"10017085-6-チンピラB" = "委員長はさておき、こいつらはさっきあんだけ戦ってたのに……。"
"10017085-7-チンピラA" = "どういうことだよ！？"
"10017085-8-ツルギ" = "きゃははははははははっ！"
"10017085-9-ハスミ" = "……甘いですね。"
"10017085-10-ミネ" = "いくら私たちが弱っていても、あなたたちが強くなったわけではないでしょう。"
"10017085-11-チンピラA" = "そりゃそうだけどさあ！"
"10017085-12-チンピラB" = "何が救護騎士団長だ！#n何もかも壊してばっかりで！"
"10017085-13-ミネ" = "……クリスマスは、楽しい日です。今はそういった日として迎えられています。"
"10017085-14-ミネ" = "ですがその本質は、感謝をし、振り返り……何かを施す日です。"
"10017085-15-ミネ" = "わが身を振り返り、寛大な気持ちを持ち直す日でもあります。"
"10017085-16-ミネ" = "そんな日に、他人の気持ちを利用したあなたたちが……。"
"10017085-17-ミネ" = "望んだ時間を迎えられると、思わないでください！"
"10017085-18-チンピラA" = "う、うるせぇ！何言ってんのか分かんねぇんだよ！"
"10017085-19-チンピラB" = "そもそも騙された方が悪いんだろうが！くそっ、あと少しだったのに……！"
"10017085-20-ハスミ" = "……逃げられてしまいましたね。"
"10017085-21-ミネ" = "悔しいですね、体調が万全だったらと思わずにはいられません。"
"10017085-22-ハスミ" = "誰のせいでこうなったと……。"
"10017085-23-セリナ" = "みなさん、大丈夫ですか！？"
"10017085-24-ハナエ" = "治療を始めます！"
"10017085-25-ハスミ" = "あ、ありがとうございます。その、治療でしたら他の方を優先して頂ければと……"
"10017085-26-セリナ" = "他の皆さんの治療は、終わってますのでご安心を。"
"10017085-27-ハナエ" = "こういう時のために、準備していますから！"
"10017085-28-ハスミ" = "そ、そうでしたか。"
"10017085-29-ハスミ" = "本当に、いつもありがとうございます。"
"10017085-30-セリナ" = "それは、こちらの台詞です。#nそれに今日は、私たちのせいで……"
"10017085-31-ハナエ" = "ハスミさん、ごめんなさい！#n謝ってどうにかなることではありませんが……！"
"10017085-32-ハスミ" = "（ミネが壊して騎士団が治す……）"
"10017085-33-ハスミ" = "（そういえば忘れていましたが……こういう方々でしたね）"
"10017085-34-ハスミ" = "……それで、ミネ団長。今回のことについて、何か言うことは？"
"10017085-35-ミネ" = "何の弁明もございません。"
"10017085-36-ハスミ" = "な、なぜ銃を、私に……？"
"10017085-37-ミネ" = "この罪、命を以て謝罪するしかありません！"
"10017085-38-ミネ" = "すべての処分を、ハスミ副委員長に託します！"
"10017085-39-ハスミ" = "はい……？"
"10017085-40-セリナ" = "だ、団長……。"
"10017085-41-ハナエ" = "うわぁん！団長～！"
"10017085-42-ミネ" = "セリナ、ハナエ、泣かないでください。#n責任を負うこともまた、私たちの「救護」。"
"10017085-43-ミネ" = "誰も責任を負おうとしなければ、もっと悲しみが生まれてしまいます。"
"10017085-44-ミネ" = "さあ、全ての武装を解除しました……どうとでも処分を！"
"10017085-45-ハスミ" = "はぁ……。"
"10017085-46-ハスミ" = "誤解が解けただけで、私は構いません。"
"10017085-47-ハスミ" = "それに私も、他の者たちも……救護騎士団の治療を受けて、回復しました。"
"10017085-48-ハスミ" = "ツルギも、これで良いですよね？"
"10017085-49-ツルギ" = "きええぇぇ……。"
"10017085-50-ハスミ" = "……だそうです。ということで、この件は一段落ですね。"
"10017085-51-ハスミ" = "ありがとうございました、セリナさん、ハナエさん。"
"10017085-52-セリナ" = "そ、そんな、私たちはただ救護騎士団としてなすべきことを……"
"10017085-53-ハナエ" = "むしろ感謝するべきなのは、私たちの方です！#n救護騎士団の過ちを、許してくれたんですから！"
"10017085-54-ハスミ" = "それは……"
"10017085-55-ハスミ" = "……いえ。#nそれでは、そういうことにさせていただきましょう。"
"10017085-56-ハスミ" = "起きてください、ミネ団長。#nずっとそのままでいられては、私の方が困ってしまいます。"
"10017085-57" = "[s] \"……だってさ？\""
"10017085-58-ミネ" = "しかし、先生……"
"10017085-59" = "[s1] \"あの子たちは、結果的に騙そうとしてたとはいえ……\"\n[s2] \"相手の話をちゃんと聞いてあげる姿勢は、何も間違ってないと思うから。\""
"10017085-60-ミネ" = "……。"
"10017085-61-ミネ" = "そう、ですね……。"
"10017085-62-セリナ" = "あの、それでは私たちはこれで……"
"10017085-63-ハナエ" = "パーティーの最中だったのにすみません！"
"10017085-64-ハスミ" = "そういえばそうでしたね……。"
"10017085-65-ハスミ" = "ではせっかくですし、皆さんも一緒にいかがですか？"
"10017085-66-セリナ" = "そ、それは……？"
"10017085-67-ハナエ" = "パーティーに参加して良いってことですか！？"
"10017085-68-ハスミ" = "はい、騒ぎも終わりましたし。#nパーティーなんですから、参加者は多い方が楽しいでしょう。"
"10017085-69-ハスミ" = "いかがですか、ツルギ？"
"10017085-70-ツルギ" = "うっ、あ、うぇぇ……。"
"10017085-71-ハスミ" = "ちょっと恥ずかしいけど、大歓迎だそうです。"
"10017085-72-ハスミ" = "先生はいかがでしょうか？"
"10017085-73" = "[s3] \"喜んで！\"\n[s4] \"せっかくだし、ありがたく！\""
