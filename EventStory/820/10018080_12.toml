[translation]
"10018080-1" = "第8話;背水の陣"
"10018080-2-フウカ" = "負けちゃったらどうするの！"
"10018080-3-ハルナ" = "落ち着いてください、フウカさん。"
"10018080-4-フウカ" = "落ち着けるわけないでしょう！！"
"10018080-5-女将" = "料理対決……ですか？"
"10018080-6-女将" = "あのニャオフードと？そして最終的には商人会が試食をしてジャッジを……？"
"10018080-7-女将" = "つまり……何人分用意しなければいけないのでしょう？"
"10018080-8-ハルナ" = "100個の重箱を提供することになっていますわ。"
"10018080-9-ハルナ" = "おせちは何段か重ねた重箱で出すものですから。"
"10018080-10-アカリ" = "普通は一つの重箱を3人とか4人で食べるはずだから……。"
"10018080-11-アカリ" = "400人前ですね★"
"10018080-12-フウカ" = "その数を聞いただけで気を失いそう。"
"10018080-13-ハルナ" = "ダメですわ。すでに対決は始まっています。"
"10018080-14-ハルナ" = "足を踏み入れる前なら構いませんが、ここで退くなんて許されません。"
"10018080-15-フウカ" = "そもそも私は巻き込まれたんだけど……。"
"10018080-16-フウカ" = "というか、勝負を勝手に受けたのはハルナだよね！？"
"10018080-17-フウカ" = "それなのにその態度ってあんまりじゃないの？"
"10018080-18-ハルナ" = "……"
"10018080-19-ハルナ" = "申し訳ありませんでした、フウカさん。"
"10018080-20-フウカ" = "え、えぇっ……！？"
"10018080-21" = "[ns] \"ハルナが……謝った！？\""
"10018080-22-ハルナ" = "――私は、自分だけでなく皆さんに美味しいものを食べてほしいのです。#n美食は幸福を生んでくれますから。"
"10018080-23-ハルナ" = "ニャオフードによるフランチャイズ化で、人々は安価に外食を楽しめるようになるでしょう。"
"10018080-24-ハルナ" = "ですが、同じ味付けばかりのフランチャイズで、果たして食による幸福を得られるのでしょうか？"
"10018080-25-ハルナ" = "同じような味付け……貧しい味に慣れてしまうのは、幸福ではありません。私はそれが嫌なのです。"
"10018080-26-ハルナ" = "スズメ亭の廃業阻止は、その延長線の1つに過ぎません。#n私は、この商店街に住む人々から、美食が奪われる事を止めたいのです。"
"10018080-27-ハルナ" = "……つまりハルナは、商店街のために勝負を受けたって事？"
"10018080-28-ハルナ" = "ええ、その通りですわ。"
"10018080-29-フウカ" = "それで、私に手伝ってほしい、と。"
"10018080-30-ハルナ" = "……そういう事になりますわね。"
"10018080-31-フウカ" = "……万が一、私がハルナのお願いを断ったらどうするつもりだったの？"
"10018080-32-ハルナ" = "その時は、私たち美食研究員でどうにかするつもりでしたわ。"
"10018080-33" = "[s] \"どうにかできるのかな……。\""
"10018080-34-ハルナ" = "できるできないではありません。#nしなければならない[/ruby]のです。"
"10018080-35-ハルナ" = "その程度の覚悟もなくニャオフードとの勝負を受けたわけではありません。"
"10018080-36-ハルナ" = "もちろん、料理の専門家ではありませんから、笑いものになるかもしれませんが……"
"10018080-37-ハルナ" = "それでも、未来の事は誰にも分かりません。#nそして、その程度で私の美食に対する志が挫けることもありませんわ。"
"10018080-38-フウカ" = "……そんな事いっちゃって。#nどうせ、そうなったら落ち込むくせに。"
"10018080-39-フウカ" = "そうかもしれませんわね。"
"10018080-40-フウカ" = "はぁ……。#n……分かった。手伝えばいいんでしょう？"
"10018080-41-フウカ" = "フウカさん？"
"10018080-42-フウカ" = "……私も、スズメ亭がこのままなくなっちゃうのは嫌だし。"
"10018080-43" = "[s] \"……今さらだけど、他に方法はなかったの？\""
"10018080-44-ハルナ" = "残念ですが、先生。"
"10018080-45-ハルナ" = "飲食店の経営には、ある程度の資本力が必要です。"
"10018080-46-ハルナ" = "家庭料理を作って楽しむだけならともかく、外食産業として経営する以上、避けては通れない道ですから。"
"10018080-47-ハルナ" = "まぁ、世の中にはお値段相当の価値すら見出せないお店もありますけれど……"
"10018080-48-ハルナ" = "私はそのようなお店を見るたびに、#n蛇口を締めて差し上げたいという衝動に駆られますが……"
"10018080-49-フウカ" = "蛇口？"
"10018080-50-ハルナ" = "フウカさん、例えばですよ？#nもし誰も使ってない流し台で水が流しっぱなしになっていたら、#nどんなお気持ちになりますか？"
"10018080-51-フウカ" = "えっと……蛇口を締めなきゃって思うかな？"
"10018080-52-ハルナ" = "ええ、その通りです。それと同じように、私はお値段相当の価値が見出だせない食堂を目にすると、そんな衝動に駆られるのですわ。"
"10018080-53-フウカ" = "締め方は考えなさいよね……。"
"10018080-54-ハルナ" = "とにかく――"
"10018080-55-ハルナ" = "資本力に差がある今の状態で、#nスズメ亭とニャオフードが条件なしに戦うのは不可能に近いでしょう。"
"10018080-56-ハルナ" = "むしろあちらからこのような条件を出してきたことで、ようやく同じ土俵で競えるようになったのです。"
"10018080-57-ジュンコ" = "……そういうことは最初から説明してくれたら良かったのに。"
"10018080-58-ハルナ" = "ともかく、ピンチはチャンスに変えられますわ。"
"10018080-59-ハルナ" = "ここで勝利すれば、全てを取り戻せますから。"
"10018080-60-ハルナ" = "それに私は負けるつもりなど一切ありませんわ。"
"10018080-61-フウカ" = "ハルナは絶対にギャンブルとかしちゃダメだから。"
"10018080-62-ハルナ" = "どういう意味でしょうか？"
"10018080-63-ハルナ" = "私は美食の道以外を追求するつもりなどありませんわ。"
"10018080-64-フウカ" = "……それならいいんだけど。"
"10018080-65-女将" = "400人前なんて……"
"10018080-66-女将" = "今まで一度にそのような量を調理したことはないのですが……。"
"10018080-67-アカリ" = "そこはフウカさんがどうにかしてくれますよ★"
"10018080-68" = "私も料理だったら何でもできるわけじゃないんだよ！？"
"10018080-69-フウカ" = "それにいつも給食部で料理をしてるときも、必ず何かしら事故が起きるし……。"
"10018080-70-ハルナ" = "そこは私たちが最大限バックアップするので、心配いりませんわ。"
"10018080-71-フウカ" = "……具体的には、どうやって？"
"10018080-72-ハルナ" = "味見はお任せください。砂糖ひとさじ、醤油一滴の細かな違いまでこだわって見極めましょう！"
"10018080-73-フウカ" = "結局それって食べるだけじゃん！"
"10018080-74-ジュリ" = "結局、あのとき野菜を買い占めていたのはニャオフードだったんですね……。"
"10018080-75-八百屋" = "悪かったね。私たちにも事情があってさ……。"
"10018080-76-ジュリ" = "仕方ありませんよ。あまり気にしないでください。"
"10018080-77-ジュリ" = "それにニャオフードが買い占めていた食材を今回は供給していただいたおかげで、また料理ができますから。"
"10018080-78-八百屋" = "それにしても、同じ食材を使ったスズメ亭とニャオフードの対決か……胸が高鳴るね。"
"10018080-79-八百屋" = "期待しているよ。頑張って。"
"10018080-80-ジュリ" = "あれ、ところで食材の状態が……？"
"10018080-81-八百屋" = "何か問題でも……"
"10018080-82-八百屋" = "って、これは？"
"10018080-83-八百屋" = "これはひどい……。あちこち潰れているし、半分とまではいかないが、これじゃ結構な数の野菜が使えないだろう。"
"10018080-84-八百屋" = "ひどすぎる。いつもだったら、絶対こんなに雑な梱包はしないんだが……。"
"10018080-85-ジュリ" = "ううぅ……。対決のルール上、他のところで買った食材は使えないのに……。"
"10018080-86-グルメヘルメット団A" = "「配送トラブルで食材を使えなくする作戦」成功。"
"10018080-87-グルメヘルメット団B" = "よし、報告しよう。"
"10018080-88-肉屋" = "ちょっと待ってくれ。この食材、どうなってるんだ？"
"10018080-89-肉屋" = "ニャオフードの本社に送ってから数日しか経ってないぞ。"
"10018080-90-肉屋" = "少し鮮度が落ちているだけの肉は使えるとして……腐っているものまであるじゃないか。"
"10018080-91-肉屋" = "あんなに新鮮だったのに、こんなのってないだろう。"
"10018080-92-ジュリ" = "どうしたらいいのでしょう！？"
"10018080-93-肉屋" = "ニャオフードも同じ食材を使うのであれば、公正な戦いになるだろうけど……。"
"10018080-94-肉屋" = "いや、それはどうだろうな……。"
"10018080-95-グルメヘルメット団D" = "「冷凍トラブルで食材を早く傷める作戦」成功。"
"10018080-96-グルメヘルメット団D" = "よし、上層部に伝えよう。"
"10018080-97-ジュリ" = "調味料は大丈夫だと思ったのに……。"
"10018080-98-スパイス商人" = "……申し訳ありません。代わりに謝罪します。"
"10018080-99-スパイス商人" = "梱包はニャオフードが引き受けるという話だったので、私にはどうすることもできなかったですが……。"
"10018080-100-スパイス商人" = "だからといって瓶にヒビが入っていたり、割れているものまであるだなんて。"
"10018080-101-スパイス商人" = "商品を大切に扱わない食品会社なんて、本当に許せませんね。"
"10018080-102-ジュリ" = "そう言っていただけるだけでも……ありがとうございます。"
"10018080-103-ジュリ" = "うう……なんとか食材を集めることはできましたね。"
"10018080-104-イズミ" = "うん。"
"10018080-105-イズミ" = "向こうの条件が「この商店街で手に入れた食材を使うこと」だからね……。"
"10018080-106-アカリ" = "とはいえ、一度このように信用を失ってしまうと、"
"10018080-107-アカリ" = "後で大きな代価を支払うことになると思いますね。"
"10018080-108-アカリ" = "ニャオフードの会長は、いったいどういうつもりなんでしょう★"
