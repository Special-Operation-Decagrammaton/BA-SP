[translation]
"10018040-1" = "第4話;愚民どもには分からないだろう！"
"10018040-2" = "工場内部"
"10018040-3-ニャオモト・カン" = "味なんかどうでもいい！マージンで儲けるのだ！"
"10018040-4-ニャオモト・カン" = "衛生管理だって訴えられない程度でいい！味なんて調味料で誤魔化せ！"
"10018040-5-ニャオモト・カン" = "美食だのなんだの言ったって、結局は個人の好みに過ぎない！"
"10018040-6-ニャオモト・カン" = "そう、味覚という主観的で曖昧な基準のもので我々はお金を稼いでいるのだ！"
"10018040-7-ニャオモト・カン" = "最初は良質な食材で客の気を引き、徐々に安い食材の量を増やし――"
"10018040-8-ニャオモト・カン" = "ニャオフード特製の化学調味料を混ぜて味を誤魔化せば、薄利多売の流れが出来上がるのだ！"
"10018040-9-ニャオモト・カン" = "クレームなんて見えない聞こえない！どうせ愚民どもには分からないだろう！"
"10018040-10-ニャオモト・カン" = "ムッフフフ。そうして得た利益を、今度は――"
"10018040-11-ニャオモト・カン" = "フランチャイズ型のチェーン店「ニャオ食堂」の店舗拡大に投資すれば……"
"10018040-12-ニャオモト・カン" = "更に利益の循環ができていく……いよいよ事業も軌道に乗って、さあ商売商売！"
"10018040-13-グルメヘルメット団E" = "ボス、報告があります。"
"10018040-14-ニャオモト・カン" = "ムッフフフ。急に何だね？それに、ここでは会長と呼べと言ったはずだが？"
"10018040-15-グルメヘルメット団E" = "失礼しました、会長。至急報告したいことがありまして……。"
"10018040-16-ニャオモト・カン" = "急ぎの用だなんて珍しいじゃないか。"
"10018040-17-ニャオモト・カン" = "まさか事業の収益が落ちているとでも？"
"10018040-18-ニャオモト・カン" = "この私を納得させるだけの理由がなければ、それ相応の代価を払ってもらうことになるぞ。#nムッフフフフ。"
"10018040-19-グルメヘルメット団E" = "それが、現場からこのような連絡がありまして……。"
"10018040-20-ニャオモト・カン" = "ムフフウウ……。"
"10018040-21-グルメヘルメット団E" = "どういたしましょう？"
"10018040-22-ニャオモト・カン" = "あの食堂の女将にはほとほと手を焼かされていたが……フゥム。"
"10018040-23-ニャオモト・カン" = "それに、美食研究会？そんな部活など、どうでもいい。"
"10018040-24-ニャオモト・カン" = "注意を払わねばならんのは、ゲヘナ学園のほうだ。"
"10018040-25-ニャオモト・カン" = "そのことですが、美食研究会はゲヘナ内部でも相当目をつけられている部活だそうです。"
"10018040-26-ニャオモト・カン" = "その情報は確かな筋からか？"
"10018040-27-グルメヘルメット団E" = "ええ、団のメンバーも口を揃えて言っていました。"
"10018040-28-ニャオモト・カン" = "うむ、よかろう。その言葉を信じるとする。なんだ、簡単な話ではないか。"
"10018040-29-ニャオモト・カン" = "つまり、美食研究会をどうにかすれば良いのだろう？"
"10018040-30" = "スズメ亭・内部"
"10018040-31-ハルナ" = "もう一度考え直してください。スズメ亭にはそれだけの価値がありますわ。"
"10018040-32-フウカ" = "そうです。まだ始めたばかりですよ。ここで折れてしまっては……。"
"10018040-33-ハルナ" = "ありがとうございます。ですが、その気持ちだけで十分なんです。"
"10018040-34-女将" = "何より皆さんにご迷惑をかけてしまっているのが、申し訳ない気持ちでいっぱいなんです。"
"10018040-35" = "[s] \"ハルナとフウカの意見が一致するなんて珍しいね……。\""
"10018040-36-ハルナ" = "先生？何か仰いましたか？"
"10018040-37-フウカ" = "……まあ、たまには。ここで諦めるよりはいいですから。"
"10018040-38-ハルナ" = "ですが、これ以上抵抗を続けるのは厳しいと思います。"
"10018040-39-女将" = "ニャオフードのような大企業と戦うだなんて、個人には太刀打ちできません。"
"10018040-40-女将" = "最初は私の足りていない部分を皆さんに補っていただければと安易に考えていましたが……。"
"10018040-41-女将" = "段々と手に負えないことになってきましたし……。"
"10018040-42-ハルナ" = "代々続いてきたお店はどうするつもりでしょうか？"
"10018040-43-フウカ" = "そうですよ。どうしても守りたいと仰っていたじゃないですか。"
"10018040-44-女将" = "致し方ありませんが、ニャオフードのフランチャイズ化を受け入れようと思います。"
"10018040-45-女将" = "そうすれば少なくとも建物自体は守れますから。"
"10018040-46-ハルナ" = "いいえ、それは違いますわ。"
"10018040-47-ハルナ" = "そもそも美食とは料理そのものだけでなく、お店の場所や雰囲気、受け継がれてきた歴史など……。"
"10018040-48-ハルナ" = "様々な要素が合わさって、ようやく美食と呼べる存在になるものです。"
"10018040-49-ハルナ" = "私はスズメ亭からいかなる要素も失わせるつもりはありません。"
"10018040-50-ジュリ" = "……諦めてはいけません。"
"10018040-51-女将" = "はい……？"
"10018040-52" = "私は料理が下手で、いつも失敗ばかりしています。"
"10018040-53-ジュリ" = "手伝おうとしても余計な被害を生んでしまうし、結果は散々です。"
"10018040-54-ジュリ" = "ちょっと間違えたと思ったら食材が生き返って、暴れて人を襲うこともあります。"
"10018040-55-ジュンコ" = "……それ、間違ったって言えるレベルなの？怪現象でも起きてるんじゃない？"
"10018040-56-ジュリ" = "でも、私は諦めていません！"
"10018040-57-ジュリ" = "フウカ先輩が付き添ってくれて、先生が励ましてくれて、何より私は料理が好きなんです。"
"10018040-58-ジュリ" = "まだまだ上手にできませんが、それでも料理をするのって楽しいんです！"
"10018040-59" = "自分が作った料理を食べてくれる瞬間を想像するだけで、とってもうれしい気持ちになるじゃないですか。"
"10018040-60" = "ここで諦めたら……何も残りません。"
"10018040-61" = "いつか私も本当においしい料理を作ってみせます！"
"10018040-62-ジュリ" = "だから女将さんも諦めないでほしいです！"
"10018040-63-ジュリ" = "私がこんな話をするなんて、出過ぎた真似かもしれませんが……。"
"10018040-64-女将" = "皆さん……。"
"10018040-65-女将" = "ですが、私にはどうすれば良いのか思いつかなくて……。"
"10018040-66" = "[s] \"せっかく作った料理ですし、食べてもらうのはどうですか？\""
"10018040-67" = "[ns] \"そこでお客さんの反応を見て、次の方針を考えましょう。\""
"10018040-68-ハルナ" = "なるほど。試食による販売促進を狙うのですか。"
"10018040-69-フウカ" = "女将さん、練習した新しい味を披露するチャンスですよ！"
"10018040-70-ハルナ" = "生まれ変わったスズメ亭……それを証明する新たな料理……うふふ。"
"10018040-71-フウカ" = "食堂再開のためにも、まずはお客さんに料理を味わってもらうんです。#n女将さん、一緒にやってみましょう！"
"10018040-72-女将" = "皆さん……！"
"10018040-73-女将" = "一度は諦めかけていましたが、もう一度頑張ります！"
"10018040-74" = "その言葉を待っていましたわ。"
"10018040-75-フウカ" = "はい！なんでも手伝いますよ！"
"10018040-76-ジュンコ" = "まだこれからなんだから。"
"10018040-77-ジュリ" = "頑張りましょう！"
"10018040-78" = "[ns] \"試食会の準備をしないといけないね。\""
