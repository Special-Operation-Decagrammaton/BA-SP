[translation]
"10018010-1" = "第1話;助けが必要です！"
"10018010-2-フウカ" = "いつぶりなんだろうってくらい、全てがうまくいっていた……。"
"10018010-3-フウカ" = "お休みの日でぐっすり眠れたし、朝ごはんの準備もして……#n今日は料理に問題もなかったし。"
"10018010-4-フウカ" = "だから、着替えてお参りに行こうと思ってたのに……。"
"10018010-5-フウカ" = "なのに、それなのに……。"
"10018010-6-フウカ" = "どうしてまたこんな事に……！！"
"10018010-7-フウカ" = "先輩……。"
"10018010-8-ハルナ" = "思い通りにいかないのが人生というものですわ。"
"10018010-9-ハルナ" = "襲い来る試練を乗り越えたと思えば、また次の波が……。"
"10018010-10-ハルナ" = "人間とは、そのように克服されなければならない何かなのですよ。"
"10018010-11-フウカ" = "誘拐した張本人にそんな事言われても……。"
"10018010-12-ハルナ" = "うふふ……"
"10018010-13-ハルナ" = "それよりも。#nその着物、似合っておりますよフウカさん。"
"10018010-14-フウカ" = "……ありがとう。ハルナもその着物きれいだね。"
"10018010-15-ハルナ" = "ふふ、ありがとうございます。年末ですからね。#nいつもよりおめかししてみました。"
"10018010-16-ハルナ" = "さて――そろそろ本題に移りましょうか。"
"10018010-17-ハルナ" = "こうして美食研究会があなたたちを「お迎え」したのは……。"
"10018010-18-ハルナ" = "お願いしたいことがあるからなのです。"
"10018010-19-フウカ" = "なにがお迎えよ……こんなの誘拐でしょ……。"
"10018010-20-フウカ" = "もう、いつものことだから感覚が麻痺してしまってる自分がいる……。"
"10018010-21-フウカ" = "「人は環境に適応する生き物」というけど……こんな適応したくない！"
"10018010-22-ハルナ" = "先日、私たちは素敵な食堂を見つけたんですの。"
"10018010-23-ハルナ" = "ですが、せっかく出会ったスズメ亭という食堂が……今年いっぱいで閉店してしまうそうなんです。"
"10018010-24-ハルナ" = "フウカさんは、トリュフが常温で放置されていたとしたら……"
"10018010-25-ハルナ" = "一人の料理人として、どうなさいますか？"
"10018010-26-フウカ" = "オイルで香りとりをするかな……"
"10018010-27-フウカ" = "もちろん、早く調理した方がいいけど。"
"10018010-28-ハルナ" = "ええ、味が失われてしまわないようにするでしょう？#nそれと同じです。"
"10018010-29-ハルナ" = "詳しい事情は分かりませんが、あんなに素敵な食堂が閉まってしまうなんて……"
"10018010-30-ハルナ" = "美食研究会にとって……いえ、私たち以外の多くの人にとっての損失と言えますわ。"
"10018010-31-フウカ" = "ところで……話の前に、この縄を解いてくれない？"
"10018010-32-ジュリ" = "あの……お店を閉めると決めたのは、女将さんですよね？#nそれなら、私たちが口出しをすることじゃないんじゃ……"
"10018010-33-ハルナ" = "食堂の行く末は女将次第……"
"10018010-34-ハルナ" = "たしかにその通りではあります。"
"10018010-35-ハルナ" = "ですが！誰が納得しようとも、この[ruby=くろだて]黒舘[/ruby]ハルナが許しません！"
"10018010-36-ハルナ" = "ええ、たとえ神様が許そうとも！"
"10018010-37-フウカ" = "いや、許そうよ。#nそれと、早く縄を解いてほしいんだけど。"
"10018010-38-ジュンコ" = "そういえば、そろそろ着く頃かしら……"
"10018010-39-ジュンコ" = "あ、来た来た、先生。"
"10018010-40-イズミ" = "やっほー！"
"10018010-41-アカリ" = "お元気でしたか？"
"10018010-42" = "[s] \"こんにちは。\""
"10018010-43" = "[ns] \"みんな、きれいな格好だね。\""
"10018010-44-フウカ" = "先生！私たちを助けに来てくださったんですか！？"
"10018010-45" = "[s] \"そうしたい気持ちは山々なんだけど……。\""
"10018010-46" = "[ns] \"私も捕まってしまったんだ。\""
"10018010-47-フウカ" = "せ、先生まで……。#n大丈夫です。私、泣きませんから……。"
"10018010-48-ジュリ" = "私は泣いてもいいですよね、先輩？"
"10018010-49-ハルナ" = "お待ちしておりました、先生。#nさて、これで全員揃いましたので、会議を始めましょうか。"
"10018010-50-ハルナ" = "……どうすればスズメ亭を廃業の道から救うことができるのか。"
"10018010-51-ハルナ" = "それが今回の議題となります！"
"10018010-52" = "[ns] \"普通に連絡してくれたら、引き受けたのに……。\""
"10018010-53-ハルナ" = "決意と覚悟を分かっていただくためですわ。"
"10018010-54-ハルナ" = "少々手荒な真似をしてしまいましたが、これこそ、私たちの本気度の表れ。"
"10018010-55-ハルナ" = "私の気持ち……先生に伝わったでしょうか？"
"10018010-56-ジュリ" = "……そういう事ばっかしてたら、いつか先生が倒れちゃうよ。"
"10018010-57-ジュリ" = "（こくこく）"
"10018010-58" = "[ns1] \"その前に、私たちだけで話すより……。\"\n[ns2] \"まずは女将さんの話を聞いてみるのはどうかな？\""
"10018010-59-ハルナ" = "なるほど。問題解決には当事者の意見を聞くことが大切だと……。"
"10018010-60-ハルナ" = "気持ちがはやるあまり、大切なことを見落としておりました。"
"10018010-61-ハルナ" = "流石は先生です。"
"10018010-62-ハルナ" = "やはり誘……"
"10018010-63-ハルナ" = "いえ、「お迎え」した甲斐がありましたわ。"
"10018010-64-フウカ" = "（いや、ちょっと考えたらそれくらい分かるんじゃない……？）"
"10018010-65-ハルナ" = "あら……なんでしょうか？"
"10018010-66-フウカ" = "何か雰囲気が変じゃない……？"
"10018010-67-グルメヘルメット団B" = "なぁ女将さんよぉ……まだ分かんねぇのか？"
"10018010-68-グルメヘルメット団B" = "早く店を立ち退いてくれよなぁ！#n一体いつまで居座るつもりだよ？"
"10018010-69-女将" = "すみません、すみません……整理に時間がかかってしまっていて……。"
"10018010-70-女将" = "先日、最後のお客様がお越しくださっていたので……早く片付けますから。"
"10018010-71-グルメヘルメット団B" = "ったくよぉ……あたしらも好きでこういう事してるんじゃねぇんだからさぁ。"
"10018010-72-グルメヘルメット団B" = "そうそう。女将さんのためを思って言ってるんだよ？"
"10018010-73-グルメヘルメット団A" = "簡単な話だろ？#nあんたは、あたしらの言うことに従ってくれたらいいんだからさ。"
"10018010-74-グルメヘルメット団B" = "今度こそ理解できたよなぁ？#n穏便に済ませようぜ……お互いに、なぁ？"
"10018010-75-ハルナ" = "うふふ……。"
"10018010-76-ジュンコ" = "は、ハルナ……？"
"10018010-77-ハルナ" = "先客がいらっしゃるようですね……#nそれも、あまり良くない先客が。"
"10018010-78-アカリ" = "どうしましょうか、ハルナ★"
"10018010-79-ハルナ" = "美食研究会は、究極の美食を追求するためにあります。"
"10018010-80-ハルナ" = "素敵なもてなしをしてくださった方が窮地に陥っているとあらば――"
"10018010-81-ハルナ" = "見て見ぬふりをするなど、道理に反しますわ。"
"10018010-82-イズミ" = "私も大賛成！やっちゃおうー！"
"10018010-83-ジュンコ" = "まあ、こうなると思ってたわよ……。"
"10018010-84-フウカ" = "は、ハルナ？何を……！？"
"10018010-85-ジュリ" = "先輩、私たちは下がったほうが……。"
"10018010-86" = "[s] \"そうだね、危ないから私たちは少し下がろう。ジュリは賢いね。\""
"10018010-87-ジュリ" = "あ、ありがとうございます先生！"
"10018010-88-ジュリ" = "これは悲しいことに長年染み付いた反射のようなもので……。"
"10018010-89-フウカ" = "あの状態のハルナには、どんな言葉も通じませんからね……。"
"10018010-90-グルメヘルメット団A" = "何なんだよ！お前らはよぉ！"
"10018010-91-グルメヘルメット団B" = "今は営業中なんだけど！？見て分かんねぇのか？"
"10018010-92-ハルナ" = "はい、分かりませんわ。"
"10018010-93-ハルナ" = "美食の邪魔をするとは、不届き千万。"
"10018010-94-ハルナ" = "そのような道理の分からぬ者たちの話など、興味もありませんし――#n聞く必要もありませんから。"
"10018010-95-イズミ" = "さあ、それでは。"
"10018010-96-ハルナ" = "美食研究会、始めましょうか？"
