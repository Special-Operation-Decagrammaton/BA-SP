[translation]
"10018015-1-グルメヘルメット団A" = "お、覚えとけよ！"
"10018015-2-グルメヘルメット団B" = "あたしら「グルメヘルメット団」に逆らった落とし前は、あとでつけてもらうからな！"
"10018015-3-ハルナ" = "上品さのかけらもないような方々でしたわね。"
"10018015-4-ハルナ" = "それでは、邪魔者もいなくなりましたし……女将さんの話を伺いましょうか。"
"10018015-5-女将" = "お気持ちはありがたいのですが、やはりこの店を続けるのは……"
"10018015-6-女将" = "難しいと言いますか……断念せざるを得ないのです。"
"10018015-7" = "[s] \"失礼ですが……よろしければ、詳しい事情をお伺いしても？\""
"10018015-8-女将" = "事情、ですか……。"
"10018015-9-女将" = "そうですね……どうせ閉店することは決まっていますから……。"
"10018015-10-女将" = "すでに商店街をご覧になったのであれば、お分かりかもしれませんが……"
"10018015-11-女将" = "この地域はフランチャイズ化していったお店が多いんです。"
"10018015-12-フウカ" = "（大手から一定の味が安価に提供されるようになり、個人経営のお店が立ち行かなくなったのですね……）"
"10018015-13-ハルナ" = "（美食の道を歩む身として、非常に胸が痛むお話ですわ……）"
"10018015-14-女将" = "そうやってフランチャイズ化していったお店と価格競争を続けていく事も考えはしたのですが……"
"10018015-15-女将" = "やはり、うちのような個人経営のお店にはそんな体力は残っていなくて……。"
"10018015-16-女将" = "それにどうも最近、弱り目にたたり目というか……#n新たに別の問題も浮上しまして……。"
"10018015-17-フウカ" = "別の問題、ですか？"
"10018015-18-女将" = "ええ。うちは「ニャオフード」という大手食品会社から食材を仕入れているのですが……"
"10018015-19-女将" = "先日、ニャオフードから価格の改定を告げられたんです。"
"10018015-20-女将" = "ニャオフードから食材を仕入れているのは、フランチャイズ店も一緒ではありますが……。"
"10018015-21-ジュンコ" = "ちょっと待って！"
"10018015-22-ジュンコ" = "それならフランチャイズ店も値上げしたのよね？"
"10018015-23-アカリ" = "たしかに仕入れ先が同じなら、あちらも値上げせざるを得ませんよね。"
"10018015-24-イズミ" = "う～ん、あんまり分からないけど物価が上がったってことだよね？"
"10018015-25-女将" = "いえ、フランチャイズ店はニャオフードの傘下にあるので……"
"10018015-26-女将" = "物価が上昇した分、テナント料を引き下げるなどで、"
"10018015-27-女将" = "あちらは従来の価格帯を維持できているようなのです。"
"10018015-28-ジュンコ" = "何それひどい！"
"10018015-29-ジュンコ" = "小さなお店はどうしろっていうのよ！"
"10018015-30-ハルナ" = "それなら……女将さんのお店にも、フランチャイズ化のお話が来たのではないでしょうか？"
"10018015-31-女将" = "鋭いですね。おっしゃる通り、何度も営業の方がいらっしゃいました。"
"10018015-32-女将" = "でも私は……やっぱり、代々受け継がれてきたこのお店を守りたくて……。"
"10018015-33-女将" = "自分が愚かでした。そうやってお店に固執した結果、失うことになるなんて――"
"10018015-34-女将" = "最初は、一品一品丁寧に作ることこそ、お客様にできる恩返しだと思っていました。"
"10018015-35-女将" = "ですが、世の中そんなに甘くはありませんね。"
"10018015-36-女将" = "長話になってごめんなさい。まだなんだか実感が湧かなくて……。#nでもおかげで、自分の気持ちが少し整理できました。"
"10018015-37-女将" = "ありがとうございます。#n先日おいしそうに食べてくださったことも、最後の良い思い出になりました。"
"10018015-38-フウカ" = "その気持ち……。"
"10018015-39-女将" = "はい？"
"10018015-40-フウカ" = "その気持ち、私も分かる気がします。"
"10018015-41-女将" = "お客様……？"
"10018015-42-フウカ" = "どんなに頑張って料理の研究をしても、"
"10018015-43-フウカ" = "自分ではどうしようもない理由で料理自体ができなくなってしまうとか！"
"10018015-44-フウカ" = "諦めずにもう一度料理を作っても、"
"10018015-45-フウカ" = "自分以外のせいで、作った料理がロクに味わわれず消費されるとか！"
"10018015-46-アカリ" = "そんなことがあったんですか？ひどい話ですね★"
"10018015-47-フウカ" = "今度こそおいしい料理にしようって意気込んだのに！"
"10018015-48-フウカ" = "料理にとりかかる前の段階で天変地異みたいな被害に遭って、何もうまくいかないとか！"
"10018015-49-ジュリ" = "せ、先輩！？"
"10018015-50-フウカ" = "やっとの思いで完成したと思ったら！"
"10018015-51-フウカ" = "配膳前に料理がなくなってたり！"
"10018015-52-フウカ" = "なになに、なんの話をしてるの？"
"10018015-53-フウカ" = "私も入れて！"
"10018015-54-女将" = "お、お客様？"
"10018015-55-女将" = "落ち着いてください。#nそのお気持ちは私もよく分かりますが……。"
"10018015-56-フウカ" = "私が……手伝います。"
"10018015-57-フウカ" = "え……？"
"10018015-58-フウカ" = "きっと何か方法があるはずです。みんなで考えましょう。#n何もせずに諦めるわけにはいきません。"
"10018015-59-女将" = "その……私の話を聞いた上で手を貸してくださるなんて……感謝しかありません。"
"10018015-60-女将" = "本当に皆さん、ありがとう、ございます……。"
"10018015-61-ハルナ" = "うふふ。"
"10018015-62-ハルナ" = "お話がうまくまとまりましたね。これで全て良しですわ。"
"10018015-63" = "[s] \"本当に大丈夫なのかな……？\""
"10018015-64-ハルナ" = "あら……何かありました？"
"10018015-65-ハルナ" = "問題なさそう……ですか。"
"10018015-66-ハルナ" = "それなら大丈夫だというのに。"
"10018015-67-ハルナ" = "……どうしてため息をついていらっしゃるのでしょうか？"
