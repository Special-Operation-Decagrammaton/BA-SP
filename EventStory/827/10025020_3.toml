[translation]
"10025020-1" = "第2話;[ruby=やとうら]夜戸浦[/ruby]村の影"
"10025020-2" = "夜戸浦村・船着場"
"10025020-3-ミヤコ" = "あの……こんにちは。"
"10025020-4-年老いた漁師" = "……。"
"10025020-5-ミヤコ" = "住民の方、でしょうか？"
"10025020-6-年老いた漁師" = "……。"
"10025020-7-ミヤコ" = "その……友達と海水浴に来たのですが、天気があまり良くなくて……"
"10025020-8-ミヤコ" = "どこか、近くに波が落ち着いている浜辺はないでしょうか？"
"10025020-9-年老いた漁師" = "……海水浴なら、他をあたれ。"
"10025020-10-年老いた漁師" = "[ruby=やとうら]夜戸浦[/ruby]は、エビだけが取り柄のつまらない村だからな。"
"10025020-11-ミヤコ" = "そ、そうでしょうか？#n私は素敵な村だと思いますが……。"
"10025020-12-年老いた漁師" = "フン……物好きだな。"
"10025020-13-年老いた漁師" = "好きにするがいい。#nだが、漁の邪魔だけはしないでくれ。"
"10025020-14-ミヤコ" = "……ありがとうございます。"
"10025020-15-ミヤコ" = "あっ……あちらがエビの水揚げで使われている船でしょうか？"
"10025020-16-年老いた漁師" = "……そうだ。"
"10025020-17-ミヤコ" = "思ったよりも大きいんですね。#nこれから漁に出るのですか？"
"10025020-18-年老いた漁師" = "……こんな時間から漁に出るヤツがいると思うのか？"
"10025020-19-ミヤコ" = "いっ、いえ……。"
"10025020-20-ミヤコ" = "漁なら明け方に終わっとる。#n今は船が動かんように留めているところじゃ。"
"10025020-21-ミヤコ" = "そ、そうなのですね……。"
"10025020-22-ミヤコ" = "……エビは捕れましたか？"
"10025020-23-年老いた漁師" = "……それを聞いてどうする。"
"10025020-24-ミヤコ" = "特に深い意味があったわけでは……気を悪くされたなら申し訳ありません。"
"10025020-25-年老いた漁師" = "最近D.U.で夜戸浦産のエビを見なくなったので、気になりまして……"
"10025020-26-ミヤコ" = "SNSでも何かあったのでは、と話題になっていましたし……"
"10025020-27-ミヤコ" = "……ワシは知らん。"
"10025020-28-ミヤコ" = "あの――"
"10025020-29-年老いた漁師" = "ワシらは生き物を相手にしておる。#n思い通りに水揚げできるなら、みんなエビ漁をしてるはずだろう？"
"10025020-30-年老いた漁師" = "すべては海の機嫌次第。それに、ワシの仕事はエビを捕ってくるところまでじゃ。#n後のことは知らん。"
"10025020-31-年老いた漁師" = "それに、よそ者がワシらの仕事を気にして何になるというのだ。#n好きに観光するのは構わんが、口には気をつけることだな。#n無用な詮索は気分が良いものではない。"
"10025020-32-ミヤコ" = "はい……すみません。"
"10025020-33-年老いた漁師" = "いいか、くれぐれも漁の邪魔はするな。"
"10025020-34-年老いた漁師" = "好奇心は猫をも殺すと言うじゃろう。#n……「深きもの」には気をつけることだ。"
"10025020-35-ミヤコ" = "……「深きもの」？"
"10025020-36" = "ヴァルキューレ海洋警備局・夜戸浦支部前"
"10025020-37-サキ" = "おーい、誰か居ないのか？"
"10025020-38-ヴァルキューレの海警" = "う……誰だ、こんな時間に……"
"10025020-39-ヴァルキューレの海警" = "……んん、初めてみる顔だな……えっと、どちら様ですか？"
"10025020-40-サキ" = "ああ、私はここに海水浴に来たんだが――"
"10025020-41-ヴァルキューレの海警" = "……海水浴ですか？[ruby=ここ]夜戸浦村[/ruby]に？"
"10025020-42-ヴァルキューレの海警" = "本当に合ってます？別の村ではなく？"
"10025020-43-サキ" = "ひどい言い様だな。#nこの村を訪れる観光客だっているだろうに。"
"10025020-44-ヴァルキューレの海警" = "いえ……こんな村に観光客が訪れるのは、本当に珍しいので……"
"10025020-45-ヴァルキューレの海警" = "私たちは配属されたから仕方なく留まっているだけで、できることなら一日でも早く別の支所に移りたいと思ってるんですよ。"
"10025020-46-ヴァルキューレの海警" = "こんな僻地じゃ、基本的に仕事もないので実績を上げられるはずもなく……。"
"10025020-47-サキ" = "（自分の担当エリアをここまで悪し様に言うヴァルキューレ生は初めて見たな……）"
"10025020-48-ヴァルキューレの海警" = "そうなんだな。ともあれ、ここで泳ぐ際に気をつけなければならないポイントを事前に聞いておきたいんだが……"
"10025020-49-サキ" = "ここ最近、事故や事件はなかったか？"
"10025020-50-ヴァルキューレの海警" = "……さあ。ないんじゃないですか？"
"10025020-51-サキ" = "……？"
"10025020-52-ヴァルキューレの海警" = "海難事故が起きたのであれば、新聞に載ってると思いますけど。"
"10025020-53-ヴァルキューレの海警" = "私たちも忙しいんですよ。それじゃあ、ごゆっくり。"
"10025020-54-サキ" = "さっきは仕事がないって言ってなかったか！？"
"10025020-55-サキ" = "これだから、ヴァルキューレのヤツらは……。"
"10025020-56-ヴァルキューレの海警" = "私たちだって、初めは――"
"10025020-57-サキ" = "いえ……何でもありません、気にしないでください。"
"10025020-58-ヴァルキューレの海警" = "とにかく、私たちは仕事で忙しいので、問題だけは起こさないようにお願いしますよ。"
"10025020-59-ヴァルキューレの海警" = "「深きもの」に裁きを下されて海難事故でも起きようものなら、#n村の皆さんに迷惑がかかりますので。"
"10025020-60-サキ" = "……縁起でもない。"
"10025020-61-サキ" = "……「深きもの」ってなんだ？"
"10025020-62-釣り人" = "……誰も見てないよな？"
"10025020-63-釣り人" = "あーあ、まったく余所者にどんだけ冷たいんだ。#nちょっと教えてほしいだけなのに、あんな風にしなくてもよぉ。"
"10025020-64-釣り人" = "まあでも、情報は手に入れたし……#nこれで大物も夢じゃ――"
"10025020-65-釣り人" = "あ、あの……"
"10025020-66-ミユ" = "邪魔しちゃってごめんなさい……#nその、先ほどから私の釣り糸が、あなたの足に……"
"10025020-67-釣り人" = "おわっ！？いつの間に人がっ！？"
"10025020-68-ミユ" = "えっと……結構前から、ここで釣りをしてたんですが……"
"10025020-69-ミユ" = "やっぱり……私は水着姿でも存在感がないんですね……"
"10025020-70-ミユ" = "いつしかみんなに忘れられて……最後は干からびたヒトデのように……"
"10025020-71-ミユ" = "違う違う！そういう意味じゃないから！"
"10025020-72-釣り人" = "ちょっと考え事をしてたから、気づかなかっただけなんだ。#nこっちこそ邪魔しちゃって悪かったな。"
"10025020-73-釣り人" = "お詫びと言ってはなんだが……オレのルアーを少し分けてやるよ。#nこの辺りだと、これを使うみたいでさ。"
"10025020-74-ミユ" = "あ、ありがとうございます……"
"10025020-75-ミユ" = "……もしかして、[ruby=ここ]夜戸浦村[/ruby]には釣りをするために……？ "
"10025020-76-釣り人" = "ああ！#nここでなら大物が釣れるって噂を聞いてな！"
"10025020-77-ミユ" = "そ、そうなんですね……私は友達と観光に来ただけなので……#nここが釣りスポットだったなんて、知りませんでした……"
"10025020-78-ミユ" = "えっと、この村ではどんなお魚が釣れるんですか……？"
"10025020-79-釣り人" = "さ、魚か……"
"10025020-80-釣り人" = "……アジ、とか？"
"10025020-81-ミユ" = "アジ……こんな大物用のルアーじゃ、難しいと思います……"
"10025020-82-ミユ" = "小さいお魚ですし……#nこのルアーでは……"
"10025020-83-釣り人" = "そ、そうか……？"
"10025020-84-釣り人" = "で、でも……大きいルアーじゃないと引っかからないような大物がいるかもしれないじゃないか！"
"10025020-85-釣り人" = "それに「深きもの」が力を貸してくれれば、1m級のアジが釣れるはずだ！"
"10025020-86-ミユ" = "「深きもの」……？"
"10025020-87-ミユ" = "……っと。"
"10025020-88-釣り人" = "いや、気にすんな。ただの独り言だ。"
"10025020-89-釣り人" = "ともかく、オレは釣りポイントを探しに行くから、ついてくるんじゃねーぞ！#nいいか？魚は音に敏感だからな！"
"10025020-90-釣り人" = "……あ、そうだ。今の話、オレから聞いたって村の人たちには内緒にしてくれ！"
"10025020-91-ミユ" = "……何か、変。"
