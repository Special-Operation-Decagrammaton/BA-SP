[translation]
"10025090-1" = "第9話;水中のウサギ"
"10025090-2-海運会社の者" = "おい、急げ！"
"10025090-3-海運会社の者" = "霧が晴れる前に、中身を入れ替えるんだ！"
"10025090-4-船員A" = "はい、船長！"
"10025090-5-海運会社の者" = "……思ったより霧が濃くて助かったぜ。これなら何をしてようと気づかれないだろ。"
"10025090-6-海運会社の者" = "ただ、こっちからも村の様子が見えないのは気がかりだが……"
"10025090-7-海運会社の者" = "まあ、見つかりそうになったら沖に逃げれば済む話だ。"
"10025090-8-船員B" = "船長、箱に入ってた冷凍エビはどうしましょう？"
"10025090-9-海運会社の者" = "何を今さら。"
"10025090-10-海運会社の者" = "――海にでも捨てておけ。"
"10025090-11-船員B" = "で、でも……まだ食べれますよ、このエビ……"
"10025090-12-船員B" = "食べ物を粗末にしたら、罰が当たるんじゃ……"
"10025090-13-海運会社の者" = "そんなんだから、いつまで経ってもお前は成長しねえんだよ。#n金にならんモノをいちいち気にするな。"
"10025090-14-船員B" = "これがうまくいけば、エビの何倍も高価な刺し身を何食でも食べさせてやるさ。"
"10025090-15-海運会社の者" = "だから分ぁったか？んなモンさっさと捨てろ。"
"10025090-16-海運会社の者" = "……ったく、あんな甲殻類のどこが良いんだか。"
"10025090-17-船員B" = "……了解。"
"10025090-18-船員C" = "船長、小型ボート接近中です。"
"10025090-19-船員C" = "……無視しますか？"
"10025090-20-海運会社の者" = "この村の住民が「再来の船」に……？"
"10025090-21-船員C" = "いえ、それが村人ではなさそうでした。おそらく、あの観光客かと。"
"10025090-22-海運会社の者" = "チッ、最後まで面倒かけやがって。"
"10025090-23-海運会社の者" = "おい、機関室に連絡だ。全速力で沖に出ろ。"
"10025090-24-船員D" = "機関室、聞こえてるか？今すぐ全速力で――"
"10025090-25-海運会社の者" = "なっ……なんだ、今の音は！？"
"10025090-26-船員D" = "と、突然船底で異常が発生したようです……！#nプロペラが動きません！！"
"10025090-27-海運会社の者" = "……何だって？"
"10025090-28-海運会社の者" = "緊急停止して、手動操舵モードを試せ！"
"10025090-29-船員D" = "だっ、ダメです……！プロペラが完全にイっちまってます！"
"10025090-30-海運会社の者" = "暗礁に乗り上げたわけでもないのに、どうしてプロペラにトラブルがっ！？"
"10025090-31-船員C" = "船長、ボートが接近中です！もうすぐ目の前まで！！"
"10025090-32-海運会社の者" = "クッ……！"
"10025090-33-海運会社の者" = "おい、戦闘準備をしろ！アイツらめ、後悔させてやる……！"
