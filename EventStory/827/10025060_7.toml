[translation]
"10025060-1" = "第6話;霧の晴れた空"
"10025060-2" = "（翌朝……）"
"10025060-3-年老いた漁師" = "今日も収穫なし、か。"
"10025060-4-年老いた漁師" = "ほれ、係留したら網を戻しておいてくれ。"
"10025060-5-年老いた漁師" = "日が昇る前に、あの荒れちまった調理場を片付けんといけないからな。"
"10025060-6-漁師" = "あの、それが……調理場はすでに綺麗になってましたよ。"
"10025060-7-年老いた漁師" = "[ruby=くまがい]熊谷た[/ruby]ちか？"
"10025060-8-漁師" = "それが、無線で聞いたところ熊谷さんも知らないようで……"
"10025060-9-漁師" = "しかも、壊れていた機器も直っていたらしいです。"
"10025060-10-年老いた漁師" = "……いったい誰なんじゃ。"
"10025060-11-サキ" = "これで……よしっ、と。"
"10025060-12-サキ" = "モエ、もっかい分電盤をチェックしてくれ。#nちゃんとつながってたら、これで電気がつくはずだ。"
"10025060-13-モエ" = "おっけ～"
"10025060-14-ヴァルキューレの海警" = "ちょっ……そこで何をしてるんですか！？"
"10025060-15-ヴァルキューレの海警" = "その電線には、数万ボルトもの電流が流れてるんですよ！？"
"10025060-16-ヴァルキューレの海警" = "危ないので早く下りてください！"
"10025060-17-サキ" = "大丈夫だって。電気が流れてないのを確認して作業を進めてるから。"
"10025060-18-ヴァルキューレの海警" = "へっ……？"
"10025060-19-サキ" = "もうちょっとで終わるから、待っててくれ。"
"10025060-20-サキ" = "モエ、もっかいブレーカーを上げてみて。"
"10025060-21-モエ" = "……おっけ～。お、やっぱショートしてたみたいだね。"
"10025060-22-サキ" = "海風にさらされた電線は劣化しやすいからな。#n少しでも電圧が上がると、過負荷でブレーカーが落ちてしまう。"
"10025060-23-サキ" = "古い電線は交換して、配線盤のサビは取っておいた。"
"10025060-24-サキ" = "これで応急処置としては十分なはず。#nあ、でも後で専門の業者に見てもらうのは忘れないようにな。"
"10025060-25-ヴァルキューレの海警" = "……ど、どうやって修理を……？"
"10025060-26-モエ" = "ん？分電盤の修理なんて、仮設拠点で通信機の設営をするのと大して変わらないだろ。"
"10025060-27-サキ" = "キヴォトスの生徒なら、分電盤くらい触れると思うんだが……"
"10025060-28-モエ" = "そんな知識まで身につけてるのは、SRTでもあんたくらいだからね？"
"10025060-29-ヴァルキューレの海警" = "ん……？えすあーる……？"
"10025060-30-モエ" = "な、何でもない！"
"10025060-31-サキ" = "というか、この船着場ってガードレールも手すりもないが、このままで大丈夫なのか？"
"10025060-32-ヴァルキューレの海警" = "過去に事故が発生したので、フェンスなどの設置を試みたのですが……"
"10025060-33-ヴァルキューレの海警" = "そうすると、停泊時の邪魔になってしまうようで……"
"10025060-34-ヴァルキューレの海警" = "手は尽くしたのですが……ダメでした。"
"10025060-35-モエ" = "んー……夜でも分かりやすい目印があれば多少は防げそうだな。"
"10025060-36-サキ" = "そうだ、モエ。夜光塗料を持ってきてないか？"
"10025060-37-モエ" = "夜戦用に用意したものならあるけど……どうして？"
"10025060-38-サキ" = "ボラードに塗っておけば目立つだろ。#nそうすれば海に落ちるやつも減るはずだ。"
"10025060-39-サキ" = "ここからここまで……ついでにあっちもやっておくか！"
"10025060-40-モエ" = "えー、軍用品だから安くはないんだけど……"
"10025060-41-サキ" = "ケチケチするな。#nもっと高い装備をよく買ってるだろ。"
"10025060-42-サキ" = "じゃ、私は塗料を取ってくる。"
"10025060-43-サキ" = "……そうだ、街灯のアース工事は終わってないから、#n住民が近づかないように見といてくれ！"
"10025060-44-ヴァルキューレの海警" = "……は、はい。"
"10025060-45-ミヤコ" = "……あ。"
"10025060-46-ミヤコ" = "こんにちは。今日は天気がいいですね。"
"10025060-47-年老いた漁師" = "……ワシたちの村を、よく好き勝手してくれたもんだ。"
"10025060-48-年老いた漁師" = "調理場の設備も、壊れていた街灯も。"
"10025060-49-年老いた漁師" = "まだ目が慣れんで、違和感があるの。"
"10025060-50-ミヤコ" = "も、申し訳ありません……その、劣化した設備は危険ですし、不便かと思い……"
"10025060-51-ミヤコ" = "余計なことをしてしまったでしょうか……？"
"10025060-52-年老いた漁師" = "いや……そうは言っておらんじゃろう。#n村のモンは喜んでおったしな。"
"10025060-53-年老いた漁師" = "変化を拒み、過去に執着するのは年寄りくらいのものじゃ。"
"10025060-54-ミヤコ" = "あの……あらためて申し訳ありませんでした。"
"10025060-55-ミヤコ" = "恐怖心から、たしかな証拠もなく皆さんに無礼を働いてしまい……"
"10025060-56-ミヤコ" = "もっと冷静になって、ご意見に耳を傾けるべきでした。"
"10025060-57-年老いた漁師" = "……抑えられるような恐怖は、恐怖と言えんじゃろう。気にするな。"
"10025060-58-年老いた漁師" = "それに……この村を怪しむなと言う方がおかしいもんだ。"
"10025060-59-年老いた漁師" = "我々も、それを望んでおったからな。"
"10025060-60-ミヤコ" = "……もしかして。"
"10025060-61-年老いた漁師" = "「深きもの」のことを言ってるわけではないぞ。"
"10025060-62-年老いた漁師" = "これまでここを訪ねてきた者たちは、村の言い伝えを耳に挟んでは逃げるように去っていった。"
"10025060-63-年老いた漁師" = "人が来なくなった町は停滞した。#n変化がないから当然、これまでのやり方を否定する者もいない。"
"10025060-64-年老いた漁師" = "その[ruby=・   ・]恐怖[/ruby]が……村の空気を蝕んでいくとは知らずに。"
"10025060-65-ミヤコ" = "……でも、私は素敵な村だと思います。"
"10025060-66-年老いた漁師" = "はんっ、口が上手いな。"
"10025060-67-年老いた漁師" = "ん……それは、何をしてるんだ？"
"10025060-68-ミヤコ" = "あ、ヒービングラインの先端が緩んでいたので……"
"10025060-69-ミヤコ" = "モンキーフィストを作り直しておこうかと。"
"10025060-70-年老いた漁師" = "器用なもんだ。誰かに教わったのか？"
"10025060-71-ミヤコ" = "あ、この結び方は特殊――"
"10025060-72-年老いた漁師" = "……特殊？"
"10025060-73-ミヤコ" = "あっ、ええっと、その……しゅ、手芸部で教わったんです。"
"10025060-74-ミヤコ" = "手芸部で、モンキーフィストの作り方を……？"
"10025060-75-年老いた漁師" = "信じがたいが……そうじゃな。#n真相はそう簡単に理解できんしの。"
"10025060-76-ミヤコ" = "……ふふ。この村のように、ですね。"
"10025060-77-ミヤコ" = "……早く以前のように、またエビが捕れることを願っています。"
"10025060-78-年老いた漁師" = "……ああ。"
"10025060-79-ミユ" = "7フィートのルアーロッドに、小型スピニングリール……"
"10025060-80-ミユ" = "0.8号のナイロンライン……よし。"
"10025060-81-ミユ" = "後はこの薬莢を加工して作ったメタルジグで――"
"10025060-82-釣り人" = "あのー……"
"10025060-83-釣り人" = "ひぃっっ！？い、いつからそちらに……？"
"10025060-84-釣り人" = "さっきから声をかけてたんだけど……"
"10025060-85-ミユ" = "ご、ごめんなさい……！#n気づかれないことは多いのですが……気づけなかったなんて……"
"10025060-86-釣り人" = "いやいや、集中してたのに邪魔しちゃってごめんよ。"
"10025060-87-ミユ" = "い、いえ……大丈夫です……"
"10025060-88-ミユ" = "（この人はたしか昨日……怪しい呪文を唱えてた人……）"
"10025060-89-ミユ" = "（相手から話しかけてくるなんて……SRTの隊員として、#nこのチャンスを逃すわけには……！なにか聞き出さないと！）"
"10025060-90-ミユ" = "（で、でも……昨日の怖かったのが忘れられない。どうしよう……）"
"10025060-91-ミユ" = "ここで釣りをしていたのかい？"
"10025060-92-ミユ" = "は、はい。アジを……釣っていたところです。"
"10025060-93-ミユ" = "他の隊員が、村の様子を見ている間……食糧の調達を任されて……"
"10025060-94-ミユ" = "いつも通り廃棄弁当でも良かったのですが……この村にはコンビニがないので……"
"10025060-95-釣り人" = "隊員……？廃棄弁当……？"
"10025060-96-ミユ" = "あっ、ええっと……"
"10025060-97-ミユ" = "あ……待ってください、今ウキが。"
"10025060-98-ミユ" = "アジは音に敏感なので、少し静かに……"
"10025060-99-釣り人" = "お、おう……！"
"10025060-100-ミユ" = "しっかり針が掛かったところで……ゆっくり引き上げれば……"
"10025060-101-ミユ" = "……釣れた！"
"10025060-102-釣り人" = "うわっ！すげえ大きさだな、30cmはあるんじゃねえか！"
"10025060-103-釣り人" = "あ、あはは……たぶん20cmくらいだと思いますが……"
"10025060-104-ミユ" = "あと3匹くらい釣れば、今日の分は大丈夫そうです。"
"10025060-105-釣り人" = "3匹も……？こんなデカい獲物を……？"
"10025060-106-ミユ" = "はい。アジなら、いつも5、6匹は釣ってますし……"
"10025060-107-ミユ" = "……な、何かありましたか？"
"10025060-108-釣り人" = "昨日も迷惑かけたのに申し訳ないんだけどよ……"
"10025060-109-釣り人" = "オレに釣りを教えてくれませんか！！"
"10025060-110-ミユ" = "へっ……？あっ、ええっ！？"
