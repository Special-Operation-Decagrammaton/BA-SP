[translation]
"10025040-1" = "第4話;闇を[ruby=さまよ]彷徨[/ruby]う者"
"10025040-2-ミヤコ" = "こちらRABBIT1。現在時刻2030、ランデブーポイントに到着しました。"
"10025040-3-ミヤコ" = "日没まで約30分……今夜は新月です。#n総員、視覚外にも意識を向けてください。"
"10025040-4-サキ" = "こちらRABBIT2。今回の作戦には、もってこいの夜だな。  "
"10025040-5-サキ" = "相手からは見えないだろうが、こっちには暗闇でも見分けられる目がある。"
"10025040-6-サキ" = "RABBIT4、スコープの交換は終わったか？  "
"10025040-7-ミユ" = "う、うん……思った以上に視界不良だったから、暗視スコープに替えたよ。"
"10025040-8-ミユ" = "一応、赤外線ストロボも用意してきたけど……"
"10025040-9-サキ" = "ん？どうかしたのか？  "
"10025040-10-ミユ" = "なんか……昼よりも異臭が強くなってる気がする。"
"10025040-11-ミユ" = "なんて言えば良いのか分からないけど……#n村のあちこちから、生モノみたいな独特の臭いが……"
"10025040-12-ミヤコ" = "……実は、私も感じていました。"
"10025040-13-ミヤコ" = "鼻をつく悪臭だけではなく、#n微量のガスに触れているときのように肌がヒリヒリします……"
"10025040-14-ミヤコ" = "[USERNAME]先生、大丈夫ですか？"
"10025040-15" = "[ns1] \"たしかに変な臭いはするけど……\"\n[ns2] \"今のところ大丈夫かな。\""
"10025040-16-サキ" = "この臭いも、何かの前兆だったらどうしよう……？"
"10025040-17-ミユ" = "ちょっと緊張する……"
"10025040-18-サキ" = "悪臭程度でビビるな。漁村なんだから、生モノの臭いくらいするだろ。"
"10025040-19-サキ" = "臭いが強くなったのは、海風のせいじゃないか？"
"10025040-20-モエ" = "まだまだだね、サキ。"
"10025040-21-モエ" = "海岸地域の夜は、陸から海に向かって風が吹くんだよ。"
"10025040-22-モエ" = "陸は海に比べて比熱が低いから、気圧の差が生まれる。#n科学の時間に習ったでしょ？"
"10025040-23" = "[s] \"ここ、テストに出ます。\""
"10025040-24-サキ" = "う、うるさいな！それくらい、知ってる……！"
"10025040-25-サキ" = "ともかく……RABBIT1、今回の目標地点はどこだ。"
"10025040-26-ミヤコ" = "まずは、運送会社の方が言っていた「鬼の[ruby=がんしょう]岩礁[/ruby]」に向かいます。"
"10025040-27-ミヤコ" = "日中は住民の視線があるので、動くなら今しかありません。#n無断で神聖な場所を調べたと知られたら、余計な争いを招くでしょうから。"
"10025040-28-ミヤコ" = "それに、今日は海運会社の方が「近寄ってはいけない」と言っていた大潮の日です。#nもしかしたら、重要な情報を得られるかもしれません。"
"10025040-29-ミヤコ" = "RABBIT2は私と共に目標地点の探索を。#nRABBIT4は、西の崖上で全方位を見渡して警戒お願いします。"
"10025040-30-ミユ" = "了解。"
"10025040-31-ミユ" = "み、ミヤコちゃ……RABBIT1……絶対に、無線を切らないでね……！"
"10025040-32-ミヤコ" = "はい、分かりました。#nRABBIT4も、異常が発生したらすぐに報告してください。"
"10025040-33-ミヤコ" = "RABBIT3はランデブーポイントで待機し、後方支援をお願いします。"
"10025040-34-ミヤコ" = "私たちの動きに気づいて、後を追ってくる住民がいるかもしれません。"
"10025040-35-モエ" = "おっけ～、任せてよ。"
"10025040-36-ミヤコ" = "では、日の出までにランデブーポイントに戻れるよう、急ぎましょう。"
"10025040-37-サキ" = "……ストップ。"
"10025040-38-ミヤコ" = "RABBIT2。村を正面にして1時の方向、不審者を2人発見。#n目視で得られる情報を。"
"10025040-39-サキ" = "ん～、1人は釣り用の長靴を履いて、手には釣り具を持ってる……#n見るからに漁師だな……"
"10025040-40-サキ" = "その人の前で、立ちはだかるようにしてるのは……#nこの村に駐在してるヴァルキューレの生徒か。"
"10025040-41-ミヤコ" = "……なんか言い争ってるように見えるぞ？"
"10025040-42-ミヤコ" = "RABBIT3、会話内容を掴んでください。"
"10025040-43-モエ" = "指向性マイクを準備するから、ちょっと待ってねぇ。"
"10025040-44-ヴァルキューレの海警" = "……は、そろそろ作るのをやめてもらえませんか？"
"10025040-45-ヴァルキューレの海警" = "村を覆う……の臭いで、頭痛が止まらないんですよ！"
"10025040-46-漁師" = "……俺たちだって、好きで作ってるわけじゃない。"
"10025040-47-漁師" = "だが、エビが…………これを売るしか……"
"10025040-48-漁師" = "それに……は、この村で伝統的な……年配の方も気に入って……"
"10025040-49-ヴァルキューレの海警" = "……は、地元の人だからであって、私たちは……"
"10025040-50-漁師" = "……もうここに来て、1年は経つんだろう？#nいつまでピーピー言うつもりなんだ。"
"10025040-51-漁師" = "いい加減、村の一員として……"
"10025040-52-ヴァルキューレの海警" = "うぅぅ……"
"10025040-53-漁師" = "それで、前に言った……はどうなった？"
"10025040-54-漁師" = "頼んでから1か月は経つが、まだなのか？"
"10025040-55-漁師" = "昨日も……のせいで、漁に出たヤツが怪我をするとこだった。"
"10025040-56-ヴァルキューレの海警" = "すみません。しかし私たちだけでは……の解決は難しく……"
"10025040-57-漁師" = "これ以上、見て見ぬふりはできん。"
"10025040-58-漁師" = "放置すれば、いずれ村は闇に飲みこまれるだろう――"
"10025040-59-サキ" = "……村の異臭は、意図したものってことか？"
"10025040-60-サキ" = "それに闇に飲み込まれるって、どういうことだ。"
"10025040-61-ミユ" = "ほ、本当に大丈夫なんだよね？"
"10025040-62" = "突然、陸が沈んだり……真っ暗な海底から謎の生き物が襲ってきたり……#nし、しないよね……！？"
"10025040-63-ミヤコ" = "落ち着いてください、ミユ。そんな出来事は現実で起こりません。"
"10025040-64-ミユ" = "で、でも……ずっと暗いところにいるからか、ネガティブなことばかり考えちゃって……"
"10025040-65-ミユ" = "今度は……なんか、変な声まで聞こえて……"
"10025040-66-ミヤコ" = "どんな声ですか？"
"10025040-67-ミユ" = "お経を唱えてるような声が……"
"10025040-68-ミユ" = "ミヤコちゃ……RABBIT1、本当に、大丈夫なんだよね？"
"10025040-69-ミヤコ" = "……その場で待っていてください、すぐにそちらへ向かいます。"
"10025040-70-ミヤコ" = "RABBIT2、RABBIT4のコンディションが安定しないようなので、#nこれより一度撤収します。"
"10025040-71-サキ" = "了解した。"
"10025040-72-サキ" = "……まあ、この異様な空気の前じゃ落ち着かない気持ちも分かるな。"
"10025040-73-サキ" = "住民の部外者を受け入れない言動……#n問題のタネはエビ漁にだけあるとは思えん。"
"10025040-74-サキ" = "先生はどう思う？"
"10025040-75" = "[s3] \"確かに住民たちは怪しいけど……\"\n[s4] \"まずは、ミユの状態を見に行こう。\""
"10025040-76-ミヤコ" = "そうですね。ひとまず、情報の整理は集合してからにしましょう。"
"10025040-77-ミヤコ" = "……夏の夜は、意外と短いので。"
"10025040-78-ミユ" = "……RABBIT4、大丈夫ですか？"
"10025040-79-ミユ" = "おいRABBIT4、迎えに来たぞ。"
"10025040-80-ミユ" = "あ……ああぁ……"
"10025040-81-サキ" = "どうした、襲撃に遭ったのか！？"
"10025040-82-ミユ" = "あ、あっち……海辺に、昼に見た釣り人が……"
"10025040-83-釣り人" = "頼む……これでダメなら、もうどうしようもないぜ……"
"10025040-84-釣り人" = "「深きもの」でも何でもいいから、頼む……お願いだ。"
"10025040-85-釣り人" = "さんどいっち～さんどいっち～……べ～ぐるふぁ～たん！"
"10025040-86-釣り人" = "……本当に、この呪文で合ってるのか？"
"10025040-87-ミユ" = "あ、ああ、悪魔を、召喚しようとしてるんだ……！"
"10025040-88-釣り人" = "だっ、誰だ、こんな夜遅くに……！"
"10025040-89-サキ" = "それはこっちのセリフだぞ。ここで何をしてるんだ？"
"10025040-90-釣り人" = "あ、えーっと……それは、その……"
"10025040-91-釣り人" = "チッ……捕まるのは勘弁だ！"
"10025040-92-ミヤコ" = "RABBIT2、逃してはいけません！"
"10025040-93-サキ" = "逃すか！！"
"10025040-94-ミユ" = "お、置いていかないで……！"
"10025040-95" = "[ns] \"みんな、ちょっと待っ――\""
"10025040-96-サキ" = "ゼエ、ゼエ……あいつ、どこに行った？"
"10025040-97-サキ" = "クマみたいな見た目のわりに、ウサギ並みの速さじゃないか……"
"10025040-98-サキ" = "……そういや、夢中で追いかけてたら道に迷ったみたいだな。#nここ、どこなんだ？"
"10025040-99-サキ" = "うっ、なんだこの悪臭は――ウワァッ！？"
"10025040-100-ミユ" = "だっ、大丈夫……？"
"10025040-101-ミヤコ" = "RABBIT2、大丈夫ですか？"
"10025040-102-サキ" = "だ、大丈夫だ。何かヌルっとしたものを踏んだだけ……"
"10025040-103-サキ" = "って、なんだコレは……魚の、内臓か……？"
"10025040-104-ミヤコ" = "ひ、ひぃいっ……"
"10025040-105-ミヤコ" = "……あちこちに、魚の頭の骨が捨てられてますね。"
"10025040-106-ミヤコ" = "今は使われなくなった調理場なのかもしれません。"
"10025040-107-サキ" = "いや……最近使われた痕跡がある。"
"10025040-108-サキ" = "この干物、まだ水気が残ってるぞ。"
"10025040-109-ミユ" = "み……ミヤコちゃん、サキちゃん……ここに……"
"10025040-110-サキ" = "RABBIT4、作戦中はコールサインで呼ぶようにって言っただろ……#nそれで、何か見つけたのか？"
"10025040-111-ミユ" = "ここに……なみなみの、黒くて生臭い液体が……"
"10025040-112-ミユ" = "どれどれ……"
"10025040-113-サキ" = "ゔあっ……なんだ、この臭いは！"
"10025040-114-サキ" = "村に広がる異臭は、これが原因だったのか！？"
"10025040-115-ミヤコ" = "……この干物からも、同じ臭いがしますね。"
"10025040-116-ミヤコ" = "もしかして、わざと腐敗させるために放置している可能性も……"
"10025040-117-サキ" = "どういうことだ？#nただでさえ漁獲量が減ってるみたいなのに、わざと魚を腐らせるなんて……"
"10025040-118-ミヤコ" = "疑いの目を向けたくはありませんでしたが……これでハッキリしました。"
"10025040-119-ミヤコ" = "この村では、何らかの儀式のようなものを行っている可能性が――"
"10025040-120-？？？" = "早朝から何事かと思えば……泥棒猫が入り込んだか。"
"10025040-121-年老いた漁師" = "こんな村に観光だなんて最初からおかしいと思ってたが……やはり村の魚を狙ってたんだな。もう言い逃れはできんぞ。"
"10025040-122-サキ" = "なっ、誰が泥棒猫だ！"
"10025040-123-サキ" = "腐った魚なんて、こっちから願い下げだ！"
"10025040-124-年老いた漁師" = "腐った魚だと……？"
"10025040-125-年老いた漁師" = "ハッ……！まったく、相手にならんな！"
"10025040-126-年老いた漁師" = "知りもせず好き勝手言いおって……#nこれまでに来たヤツらと、何ひとつ変わりゃあせんな。"
"10025040-127-ミヤコ" = "……この村では、いったい何が起きてるんですか？"
"10025040-128-年老いた漁師" = "今さら、そんなことを聞いてどうすると？"
"10025040-129-年老いた漁師" = "……悪いが、その質問には答えられんがな。"
"10025040-130-年老いた漁師" = "ワシは人様の家に土足で上がり込むような奴と仲良くできるほど、#n器が大きくないもんでな。"
"10025040-131-年老いた漁師" = "……若いモンたちに、[ruby=やとうら]夜戸浦[/ruby]村の怖さを教えてやろう。"
"10025040-132-サキ" = "いつの間にか囲まれたぞ……！"
"10025040-133-ミヤコ" = "恐怖と戦うのには慣れています。"
"10025040-134-ミヤコ" = "……総員、戦闘開始。まずは包囲を崩しましょう。"
