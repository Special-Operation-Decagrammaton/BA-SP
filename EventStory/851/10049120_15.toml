[translation]
"10049120-1" = "後日談その2;未来は明るい"
"10049120-2-ミライ" = "ああああぁぁぁ――"
"10049120-3-ミライ" = "ああああああぁぁぁぁぁ――"
"10049120-4-ミライ" = "ああああああああ――っ！！"
"10049120-5-ミライ" = "うぼあっ！"
"10049120-6-ミライ" = "あっぷあっぷ！私！金づち……なのに！"
"10049120-7-ミライ" = "このままじゃ……あっぷ！魚の餌に……ぶくぶく……。"
"10049120-8-ミライ" = "ごぼぼぼぼ……。"
"10049120-9-ミライ" = "なんだ、浅いじゃん。"
"10049120-10-ミライ" = "まったく、溺れるところでしたよ……。"
"10049120-11-ミライ" = "私のゲルマニウム爆弾が……！？#nそんな……預金残高がどんどん爆発していって……。"
"10049120-12-ミライ" = "もうおしまいだ……明日からどうやって生きていけば――"
"10049120-13-ミライ" = "そんなぁっ……！ブレスレットまで切れちゃうなんて……！いよいよ、私……。"
"10049120-14-ミライ" = "……あれ？でも、前からずっとつけてたのに、よりによって今……？"
"10049120-15-ミライ" = "運気を上げるゲルマニウムブレスレット……。"
"10049120-16-ミライ" = "まるで……今まで私を守ってくれてたみたいに……。"
"10049120-17-ミライ" = "今月のイチオシはこれでいきましょう！！"
