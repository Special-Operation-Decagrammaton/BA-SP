[translation]
"10049020-1" = "第2話;週末の予定"
"10049020-2-ハスミ" = "――なるほど。それでは、話を整理します。"
"10049020-3-ハスミ" = "まず、図書委員会の[ruby=えんどう]円堂[/ruby]シミコさんが、夜勤中に偶然ヘルメット団の密会現場を目撃した。"
"10049020-4-シミコ" = "はい、その通りです。"
"10049020-5-ハスミ" = "そして……[ruby=こまかぜ]河駒風[/ruby]ラブ率いるジャブジャブヘルメット団が、遊園地で何かを企んでいるかのような話を聞いた。"
"10049020-6-ハスミ" = "シミコさんが現場を離れようとしたタイミングで自警団の[ruby=もりづき]守月[/ruby]スズミさんに遭遇。#nこれらの内容を報告した……と。"
"10049020-7-ハスミ" = "スズミさん。その二人は救護騎士団に搬送されていますか？"
"10049020-8-ハスミ" = "意識が戻り次第、委員会で取り調べをしようかと。"
"10049020-9-スズミ" = "いいえ、搬送されてはいません。"
"10049020-10-ハスミ" = "それは、どういう……？#n現場に放置というのは――"
"10049020-11-スズミ" = "違います。対象と交戦していません。"
"10049020-12-スズミ" = "介入しませんでしたので……こちらには気づいていないはずです。"
"10049020-13-ハスミ" = "……？"
"10049020-14-ハスミ" = "体調が優れないのでしたら、救護騎士団をお呼びしましょうか？"
"10049020-15-スズミ" = "体調、ですか？特に問題はありません。"
"10049020-16-スズミ" = "……これは正義実現委員会の役割であると判断し、通報に来ました。"
"10049020-17-ハスミ" = "はい？"
"10049020-18-スズミ" = "どうしてカレンダーを？"
"10049020-19-ハスミ" = "あ、いえ。お気になさらず。"
"10049020-20-ハスミ" = "（エイプリルフールでは……ありませんよね……）"
"10049020-21-ハスミ" = "状況は理解しました。ただ……。"
"10049020-22-ハスミ" = "大変申し上げにくいのですが、今回の件を正義実現委員会が対応することはできません。"
"10049020-23-シミコ" = "それは……どうしてですか……？"
"10049020-24-スズミ" = "……。"
"10049020-25-ハスミ" = "ご報告いただいたことは感謝しております。#nただ……場所が問題なのです。"
"10049020-26-ハスミ" = "「ボーダーランド遊園地」は、少々厄介な立地をしておりまして……。"
"10049020-27-シミコ" = "あそこは、トリニティ自治区の遊園地ですよね？"
"10049020-28-ハスミ" = "ええ。遊園地の正門と敷地の半分はトリニティに属します。#nですが、裏門と敷地のもう半分はゲヘナ自治区でして……。"
"10049020-29-ハスミ" = "あの遊園地は、トリニティとゲヘナの境界線上に存在しているのです。"
"10049020-30-ハスミ" = "私たちは、トリニティの正義実現委員会。#nゲヘナ側に逃げられたが最後、打つ手がありません。"
"10049020-31-ハスミ" = "中には、それを悪用して、良からぬことを行う輩もいるのだとか。"
"10049020-32-スズミ" = "……私たちの情報そのものを疑っているのですか？"
"10049020-33-ハスミ" = "まさか。類似の通報は他にも届いています。"
"10049020-34-ハスミ" = "それに「河駒風ラブ」が関与しているという点も気になります。#n私たちにとって、彼女の存在は大きいので。"
"10049020-35-スズミ" = "驚きました。正義実現委員会がヘルメット団のリーダーを気にしているとは。"
"10049020-36-ハスミ" = "どう転ぶか心配でならない、放っておけない存在とでも言いましょうか。"
"10049020-37-スズミ" = "……。"
"10049020-38-シミコ" = "……？"
"10049020-39-ハスミ" = "それはそれとして……通報いただいた内容は、本当に懸念しています。"
"10049020-40-ハスミ" = "トリニティ側であれば、まだ対処は可能ですが……。"
"10049020-41-ハスミ" = "正義実現委員会は人手不足なのが実情でして……大人数を動員することが難しいのです。"
"10049020-42-ハスミ" = "そこで一つ、ご提案があります。"
"10049020-43-ハスミ" = "シミコさんは、例のヘルメット団の声や外見を覚えていますか？"
"10049020-44-ハスミ" = "あ、はい！"
"10049020-45-ハスミ" = "良かったです。#nスズミさんの実力は私も信頼しております。"
"10049020-46-スズミ" = "……。"
"10049020-47-ハスミ" = "ですので、お二人で遊園地の状況を見てきてはいただけないでしょうか？"
"10049020-48-スズミ" = "え？"
"10049020-49-ハスミ" = "交戦や制圧は極力控え……現場の状況だけ確認をお願いできればと思います。"
"10049020-50-ハスミ" = "とはいえ、目標が実際に現場にいることを確認し、#n対応が必要な場合には、委員会が介入させていただきます。"
"10049020-51-スズミ" = "……つまり、正義実現委員会は表に出ない、という意味でしょうか？"
"10049020-52-ハスミ" = "はい。委員会が巡回をしては、ターゲットが逃げる恐れがあります。"
"10049020-53-ハスミ" = "さらにその過程で、ゲヘナとの不必要な衝突が生じる可能性も拭いきれません。"
"10049020-54-ハスミ" = "そこで、お二人の力をお借りしたいのです。"
"10049020-55-ハスミ" = "機密保持に留意してくだされば、どなたかに協力を仰いでいただいても構いません。"
"10049020-56-シミコ" = "いきなりそう言われましても……。"
"10049020-57-スズミ" = "……なるほど。"
"10049020-58-ハスミ" = "もちろん、委員会からも可能な限りの支援をさせていただきます。"
"10049020-59-ハスミ" = "今回のお願いは、あくまで状況の確認だけ。#nお二人はご自身の安全を最優先に考え、直接的な介入はお控えください。"
"10049020-60-レイサ" = "あっ！スズミさん！"
"10049020-61-レイサ" = "シミコさんも！"
"10049020-62-レイサ" = "えっ……正義実現委員会の教室から出てくるなんて……！#nなにか……カッコいい会議でしょうか！？"
"10049020-63-シミコ" = "……。"
"10049020-64-シミコ" = "……。"
"10049020-65-レイサ" = "あ、あれ……？"
"10049020-66" = "図書委員会・休憩室"
"10049020-67-レイサ" = "えっ！？そんなのおかしいですよ！"
"10049020-68-スズミ" = "いえ、向こうの言い分も理解できます。"
"10049020-69-スズミ" = "正義実現委員会は、立場上あまり表立って動けない組織ですから。"
"10049020-70-スズミ" = "このような形は珍しいですが、今までも細かな協力要請はありましたし。"
"10049020-71-スズミ" = "それだけ、重要な事案なのでしょう。"
"10049020-72-シミコ" = "でも、いきなり戦闘になったら……。"
"10049020-73-シミコ" = "向こうが何人いるかも分からないのに、2人で相手するなんて無謀です。"
"10049020-74-レイサ" = "[ruby=・]3[/ruby]人です！"
"10049020-75-シミコ" = "はい？"
"10049020-76-レイサ" = "自警団のスーパースター、[ruby=うざわ]宇沢[/ruby]レイサがここにいますから！"
"10049020-77-シミコ" = "自警団のスーパースター……？#nあれ？そういえば、自警団ってどういう組織なんですか？"
"10049020-78-スズミ" = "いえ、そもそも組織ではありません。#nそれに正義実現委員会と違って、あくまで自称です。"
"10049020-79-スズミ" = "ですが、レイサさんがいてくだされば大きな助力になると思います。"
"10049020-80-スズミ" = "ぜひ、力を貸してください。"
"10049020-81-レイサ" = "もちろんです！！"
"10049020-82-スズミ" = "シミコさんも、図書委員会の仕事で忙しい中、ありがとうございます。"
"10049020-83-シミコ" = "いえ、そんな！"
"10049020-84-シミコ" = "最初に言い出したのは私ですから！"
"10049020-85-シミコ" = "精一杯、頑張りますね！"
"10049020-86-レイサ" = "では、作戦会議を始めましょう！"
"10049020-87-スズミ" = "まずは現時点で分かっている情報ですが……。"
"10049020-88-スズミ" = "正義実現委員会いわく、ジャブジャブヘルメット団は、河駒風ラブを筆頭に集まった小規模組織です。"
"10049020-89-スズミ" = "そしてシミコさんの情報によれば、「ボーダーランド遊園地」には、他にもいくつかのヘルメット団が招集される予定とのこと。"
"10049020-90-シミコ" = "これがどれほどの規模になるか……事前に把握するのは難しいでしょうね。"
"10049020-91-レイサ" = "つまり、どれぐらい隠れているか分からないんですね！"
"10049020-92-スズミ" = "はい。この点も含め、正義実現委員会からは、状況の確認だけを要請されています。#n重ねて、直接的な戦闘は回避するように、と。"
"10049020-93-スズミ" = "このことから、潜伏が一番望ましいのですが……。"
"10049020-94-スズミ" = "週末の遊園地は多くの来場者が予想されます。#n来場客に変装したら、私たち同士の識別が難しくなってしまうでしょう。"
"10049020-95-シミコ" = "では、スタッフに変装するのはどうですか？"
"10049020-96-スズミ" = "それも難しいです。#n正規のスタッフに見咎められてしまう可能性がありますから。"
"10049020-97-スズミ" = "もっと策を練るべきですが……使える時間は多くありません。#n早く方針を決めないと……。"
"10049020-98-スズミ" = "とりあえず、遊園地のパンフレットをお渡ししておきます。#n裏面に地図が載っていますので、覚えておいてください。"
"10049020-99-シミコ" = "ありがとうございます。近くに動物園と……湖もあるんですね。#n敷地は城壁に囲まれていて、出入り口が決まっているみたいです。"
"10049020-100-シミコ" = "ふふっ、まるで童話の世界みたいですね。"
"10049020-101-レイサ" = "おぉ……おぉぉ……！"
"10049020-102-スズミ" = "レイサさん？地図はパンフレットの裏面ですよ？"
"10049020-103-レイサ" = "これです！！"
"10049020-104-スズミ" = "これ……？"
"10049020-105-シミコ" = "はい？"
"10049020-106" = "ボーダーランド遊園地・トリニティエリア"
"10049020-107-子供B" = "風船、つぶれちゃった……#n買ってもらったばっかなのに……。"
"10049020-108-子供B" = "うわぁーん！ポップコーンバケットの蓋……壊れちゃったぁー！"
"10049020-109-子供A" = "うわぁーん！"
"10049020-110-子供B" = "店員さん！これ！新しいのに交換してよぉー！"
"10049020-111-レイサ" = "わーっ！！"
"10049020-112-レイサ" = "お客さんがいっぱいです！"
"10049020-113-レイサ" = "早く行きましょう！"
"10049020-114-スズミ" = "ま、まだ……心の準備が……。"
"10049020-115-レイサ" = "ほらほら、早くしないと逃げられちゃうかもしれませんよ！"
"10049020-116-レイサ" = "さあ！出動です！"
"10049020-117-レイサ" = "スズミさん！似合ってますから、恥ずかしがる必要なんてありません！"
"10049020-118-スズミ" = "（うぅ……）"
"10049020-119-スズミ" = "（どうしてこんなことに……）"
