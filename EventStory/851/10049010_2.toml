[translation]
"10049010-1" = "第1話;自警団の資格"
"10049010-2" = "トリニティ付設幼稚園・旧校舎"
"10049010-3-スケバンA" = "お前だって、うちらと一緒じゃんか！"
"10049010-4-スズミ" = "え？"
"10049010-5-スケバンB" = "おいバカやめろ！また閃光弾投げられるぞ！"
"10049010-6-スズミ" = "いえ……既に無力化した相手にまで、わざわざ攻撃はしません。"
"10049010-7-スズミ" = "それより、今なんと？"
"10049010-8-スズミ" = "「うちらと一緒」……？"
"10049010-9-スケバンA" = "お前、あれだろ？"
"10049010-10-スケバンA" = "[ruby=・   ・   ・]自警団[/ruby]とかってやつの、「トリニティの走る閃光弾」。"
"10049010-11-スズミ" = "……そうとも呼ばれていますね。"
"10049010-12-スケバンA" = "お前にこんなことする資格あんのか？"
"10049010-13-スケバンA" = "黒くねぇってことは、正義実現委員会ってわけでもないみてぇだし。"
"10049010-14-スケバンA" = "自警団ってのも、勝手に名乗ってるだけなんだろ？"
"10049010-15-スズミ" = "たしかに、私は正義実現委員会ではありません。"
"10049010-16-スズミ" = "ですが、治安を守る行為に資格が必要なのですか？"
"10049010-17-スケバンA" = "だから、うちらと一緒だって言ってんだよ。"
"10049010-18-スケバンA" = "関係ねぇ事に首突っ込んで、暴力で邪魔をする。#nしかも、うちらと違って正義面してるだけ質が悪ぃ。"
"10049010-19-スケバンA" = "なんで自警団なんかやってんだ？誰も分かっちゃくれねぇだろ？"
"10049010-20-スケバンA" = "もしかして……#n入りたくても、正義実現委員会には入れなかったのか？"
"10049010-21-スズミ" = "！！"
"10049010-22-スケバンA" = "資格もねぇのに暴力を振るう……これって犯罪だと思うんだけどな。"
"10049010-23-スケバンA" = "まぁ、もういいよ。こんなとこ、二度と来ねぇから。"
"10049010-24-スケバンB" = "え？えぇ……？"
"10049010-25-スズミ" = "……。"
"10049010-26-スケバンB" = "お、おい。いいのか？あんなこと言っちゃって……。"
"10049010-27-スケバンA" = "気にするこたぁねぇ。"
"10049010-28-スケバンA" = "ほら、あれ見ろよ。"
"10049010-29-スズミ" = "……。"
"10049010-30-スケバンB" = "あいつにはもう、何もできやしねぇ。"
"10049010-31-スケバンA" = "図星ってことさ。うちの言葉、相当効いたみたいだぜ？"
"10049010-32-スケバンB" = "い、今のうちに逃げるぞ！"
"10049010-33-スズミ" = "誰も分かってくれない……。"
"10049010-34-スズミ" = "正義実現委員会に入れなかった……。"
"10049010-35-スズミ" = "今までやってきたことは、犯罪……。"
"10049010-36-スズミ" = "……そう、なんですか？#n私の行いは――"
"10049010-37" = "トリニティ旧図書館"
"10049010-38-シミコ" = "新刊はこっちで……。"
"10049010-39-シミコ" = "他の図書館に寄贈する本はこっち……。"
"10049010-40-シミコ" = "よし！これで整理は終わりですね！"
"10049010-41-シミコ" = "あっ、もうこんな時間……早く帰らないと。"
"10049010-42-シミコ" = "……あれ？話し声が……倉庫の裏手から……？"
"10049010-43-ジャブジャブヘルメット団A" = "じゃあ、今週末でいいんだな？"
"10049010-44-ジャブジャブヘルメット団B" = "ああ。その日にしようって、ラブ隊長が。"
"10049010-45-ジャブジャブヘルメット団A" = "集合場所は……「ボーダーランド遊園地」だっけ。"
"10049010-46-シミコ" = "（ヘルメット団？どうしてこんな場所に？）"
"10049010-47-シミコ" = "（そういえば……人通りが少ないから、密会に使われているって噂がありましたね）"
"10049010-48-シミコ" = "（バレないうちに退散しないと……）"
"10049010-49-ジャブジャブヘルメット団B" = "こりゃあ、遊園地がめちゃくちゃになりそうだな。"
"10049010-50-シミコ" = "！"
"10049010-51-ジャブジャブヘルメット団B" = "逃すわけにはいかないんだ。仕方ないさ。"
"10049010-52-ジャブジャブヘルメット団B" = "怪我人もそうとう出るだろうな。"
"10049010-53-ジャブジャブヘルメット団A" = "まあ、向こうの出方次第だろ。"
"10049010-54-シミコ" = "（怪我人？いったい何を企んでいるのでしょう……？）"
"10049010-55-ジャブジャブヘルメット団B" = "でも、うちらだけで足りるのか？"
"10049010-56-ジャブジャブヘルメット団B" = "他からも支援がくるって話だ。それもあわせれば十分じゃねぇかな。"
"10049010-57-ジャブジャブヘルメット団A" = "ならいい。#n……そろそろ行こう。誰かに聞かれちゃマズいしな。"
"10049010-58-シミコ" = "（こ、こっちに来る……！？）"
"10049010-59-シミコ" = "（早く逃げないと……！）"
"10049010-60-シミコ" = "はぁ……はぁ……。"
"10049010-61-シミコ" = "あの二人の話……本当なんでしょうか。"
"10049010-62-シミコ" = "今週末、「ボーダーランド遊園地」で……怪我人が出る……。"
"10049010-63-シミコ" = "ラブ隊長の指示……とも言っていましたし……。"
"10049010-64-シミコ" = "放っておくわけにはいきませんよね。まずは通報を……。"
"10049010-65-シミコ" = "ひゃうっ！"
"10049010-66-スズミ" = "……。"
"10049010-67-シミコ" = "すっ、すみません……って、スズミさん？"
"10049010-68-シミコ" = "ちょうどよかったです！"
"10049010-69-シミコ" = "旧図書館の倉庫裏で、ヘルメット団が悪巧みをしているんです！"
"10049010-70-シミコ" = "自警団にお願いできませんか？"
"10049010-71-スズミ" = "えっ？#n……あっ、はい。"
"10049010-72-スズミ" = "であれば――"
"10049010-73-スケバンA" = "だから、うちらと一緒だって言ってんだよ。"
"10049010-74" = "[log=불량배 스케반 A]もしかして……入りたくても、#n正義実現委員会には入れなかったのか？[/log]"
"10049010-75-スズミ" = "……。"
"10049010-76-シミコ" = "スズミさん？"
"10049010-77-スズミ" = "一緒に、通報しに行きましょうか。"
"10049010-78-スズミ" = "おそらくこれは……正義実現委員会の仕事ですから。"
"10049010-79-シミコ" = "え……？そう、なんですね……？"
"10049010-80-シミコ" = "わ、分かりました！行きましょうか。"
"10049010-81-スズミ" = "……。"
