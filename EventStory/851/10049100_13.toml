[translation]
"10049100-1" = "第10話;フィナーレ"
"10049100-2-ミライ" = "み、道を空けて下さーいっ！！"
"10049100-3-観光客A" = "ちょっと、押さないでよ！"
"10049100-4-観光客B" = "な、なに？魔法少女に追われてる？"
"10049100-5" = "[ns] \"マシロ！支援はできそう？\""
"10049100-6-マシロ" = "状況報告はしていますが、まだ許可が下りていません。"
"10049100-7-マシロ" = "介入については、委員会で協議中とのことです。"
"10049100-8-マシロ" = "引き続き、ターゲットの追跡を続けます！"
"10049100-9-ミライ" = "しつこいですねっ！！"
"10049100-10-ミライ" = "こうなったら……[ruby=いんようすい]陰陽水[/ruby]入りの閃光弾をお見舞いしちゃいますっ！！"
"10049100-11-スズミ" = "閃光弾！？"
"10049100-12-スズミ" = "（っ！先生のほうへ！？）"
"10049100-13" = "[ns] \"え、ええ！？\""
"10049100-14" = "[ns] \"スズミ！？大丈夫！？\""
"10049100-15-スズミ" = "先生こそ、大丈夫ですか？"
"10049100-16-スズミ" = "お怪我は……ないみたいですね。良かったです。"
"10049100-17" = "[s] \"スズミが守ってくれたおかげだよ！\""
"10049100-18-スズミ" = "私が……先生を守ったおかげ。"
"10049100-19-スズミ" = "誰かを守れる力が……まだ私にもあったんですね。"
"10049100-20-ラブ" = "てー、て……なんとかホワイト！先生も！このままじゃ逃げられるわよ！"
"10049100-21-ラブ" = "あと……いい加減、先生から離れたら？"
"10049100-22-スズミ" = "！！"
"10049100-23-スズミ" = "た、ターゲットを追いかけます！"
"10049100-24-疑似科学部の部員A" = "部長！こっちです！早くゲヘナ側に――"
"10049100-25-疑似科学部の部員A" = "ぐあっ！！"
"10049100-26-スズミ" = "思ったよりも数が多いです。#n戦闘が長引くと、周りにも被害が……！"
"10049100-27-レイサ" = "ホワイト！もう弾切れです！"
"10049100-28-スズミ" = "私も、これが最後の弾倉です……！"
"10049100-29-ラブ" = "ちっ、うちも弾切れ。もっと持ってくるんだったわね……。"
"10049100-30-ミライ" = "ふふ……ふふふ……これは大ピンチ！#n――ですが！"
"10049100-31-ミライ" = "この程度で……[ruby=あづま]吾妻[/ruby]ミライを仕留められると思わないでください！#n私の華麗な動きで――！"
"10049100-32-レイサ" = "ああっ！！それは自警団専用のセリフですよ！勝手に使わないでください！！"
"10049100-33-ミライ" = "おっ！良いところに人混みが！ちょーっと失礼しますよ！"
"10049100-34-観光客C" = "いたっ！足踏んだの誰！？"
"10049100-35-ミライ" = "しーっ！居場所がバレちゃうじゃないですか！騒がないでください！"
"10049100-36-観光客D" = "この人もショーのキャストなの？"
"10049100-37-レイサ" = "人混みに紛れて……どこにいるか分かりません！"
"10049100-38-スズミ" = "身をかがめて移動しているようですね……。"
"10049100-39-スズミ" = "この先はゲヘナのエリア……困りました。"
"10049100-40-スズミ" = "……あれ？シミコさんは今どちらに……。"
"10049100-41-スズミ" = "ついに来たか、我が眷属よ！"
"10049100-42-エラ" = "我が眷属にして忠実[ruby=しもべ]な僕、[/ruby]悪の商人「シルバープレート」！"
"10049100-43-エラ" = "人混みに紛れて暗躍するとは、驚きの計画だわ！"
"10049100-44-エラ" = "ヘヴィキャリバーズ！これで勝負は決まったも同然ね！"
"10049100-45-エラ" = "この私――悪の幹部エラと、悪の商人シルバープレートが「悪の騎士団」を結成した以上、お前たちに勝ち目はない！"
"10049100-46-エラ" = "我々を倒すには、多くの者の助力が必要でしょうね……。"
"10049100-47-エラ" = "オーッホッホッホ！！我ら悪の騎士団の勝利よ！"
"10049100-48-ミライ" = "え……？"
"10049100-49-ミライ" = "シルバープレートって、今の……私に言ってました……か？"
"10049100-50-シミコ" = "えー、こほん。"
"10049100-51-シミコ" = "ショーの途中ですが、ここでちょっとだけご案内いたします！"
"10049100-52-レイサ" = "シミコさん？なにを……。"
"10049100-53-レイサ" = "いつものシミコさんに戻りました！"
"10049100-54-シミコ" = "いま、悪の商人シルバープレートが皆さんの周りに隠れています！"
"10049100-55-シミコ" = "ヘヴィキャリバーズは、シルバープレートを見失っているみたいです！"
"10049100-56-シミコ" = "そこで――"
"10049100-57-シミコ" = "皆さんの力を貸していただきたいんです！"
"10049100-58-シミコ" = "シルバープレートは、銀髪で白い服を着ています！"
"10049100-59-シミコ" = "見つけたら、お手持ちのサイリウムか#nスマホのフラッシュライトで教えてください！"
"10049100-60-シミコ" = "皆さんの応援で、ヘヴィキャリバーズを、シルバープレートのところまで導きましょう！"
"10049100-61-ミライ" = "え、ええ……！？"
"10049100-62-子供A" = "あっ、ここにいるよ！"
"10049100-63-ミライ" = "しーっ！"
"10049100-64-子供B" = "あははっ！ポップコーンのフクシューだ！"
"10049100-65-シミコ" = "さあ、力を合わせてください！！"
"10049100-66-ラブ" = "あっ、こっち来た！"
"10049100-67-観光客B" = "面白いね！通ったところが全部光ってる！"
"10049100-68-ラブ" = "これなら、位置が分かります……！"
"10049100-69-ラブ" = "良いアイデアじゃない。"
"10049100-70-ラブ" = "まるで魔法みたいです！みんなの力が起こした奇跡ですね！"
"10049100-71-スズミ" = "……あっ、つい見入ってしまいました。#n人混みを抜ける前に捕まえましょう！"
"10049100-72-ラブ" = "じゃあ、うちはこっちから行くわ！"
"10049100-73-レイサ" = "では私はこちらを担当します！"
"10049100-74-ミライ" = "ぜぇ、ぜぇ！何なんですか、もう！"
"10049100-75-ミライ" = "完璧な計画だったのに！#n言葉一つで数百人を動かすなんて想定外です！"
"10049100-76-ミライ" = "広場！"
"10049100-77-ミライ" = "あの境目を越えれば――"
"10049100-78-ミライ" = "あぅっ！？"
"10049100-79-スズミ" = "ここまでです！"
"10049100-80-スズミ" = "大人しく投降してください！"
"10049100-81-ミライ" = "まだ――！"
"10049100-82-スズミ" = "うっ！"
"10049100-83-ミライ" = "なぜ私の邪魔をするんですか！？"
"10049100-84-スズミ" = "粗悪品を売って、子供を騙して。"
"10049100-85-スズミ" = "さらに、嘘の商品をつかまされて被害が出ています。"
"10049100-86-スズミ" = "そもそも、遊園地でそういった爆発物は売ってはいけません。"
"10049100-87-ミライ" = "ぎゃぁあっ！"
"10049100-88-スズミ" = "！！"
"10049100-89-ミライ" = "これはただの爆発物じゃありません！ゲルマニウム手榴弾です！血行促進にもってこいなんですから！"
"10049100-90-ミライ" = "あっ、なるほど！もしかして……商品が気に入らなかったとか？"
"10049100-91-ミライ" = "困るんですよねぇ……納得して購入いただいてるのに……。#nですが、分かりました。分かりましたよ！今回だけ特別に返金してあげますから！"
"10049100-92-スズミ" = "あなたからは何も買っていません。"
"10049100-93-ミライ" = "だったらどうして！？なんでこんなことするんですか！#nまさか、誰かの指金ですか！？"
"10049100-94-スズミ" = "いいえ。自分の正義に従っているだけです。"
"10049100-95-ミライ" = "あなたは、なにを言ってるんですか……！？#nそんなの、何の利益にもならないじゃないですか！"
"10049100-96-ミライ" = "んん？よーく見れば、トリニティの生徒さんっぽいですけど……気づいてます？"
"10049100-97-ミライ" = "ここはゲヘナのエリアです！他の自治区で騒ぎを起こすつもりですか？"
"10049100-98-ミライ" = "それに、もう弾切れなんでしょう？全部お見通しですから！"
"10049100-99-スズミ" = "……。"
"10049100-100-シミコ" = "スズミさん！"
"10049100-101-シミコ" = "マシロさん、支援をお願いできませんか……？"
"10049100-102-マシロ" = "ごめんなさい。#n現状、ターゲットはゲヘナのエリアにいるため、交戦規定に反しています。"
"10049100-103-マシロ" = "現在発砲許可の確認を行っています。少々お待ち下さい。"
"10049100-104-シミコ" = "そんな……！"
"10049100-105-ミライ" = "正義実現委員会なら引っ込んでてもらえますか？#nこっちは真っ当なビジネスをやっているんですから！"
"10049100-106-スズミ" = "……。"
"10049100-107-スズミ" = "私は、正義実現委員会ではありません。"
"10049100-108-ミライ" = "え、そうなんですか？"
"10049100-109-ミライ" = "なーんだ、それならそうと早く言ってくださいよ。#nそういうことなら、私も暇ではありませんので。これで失礼し――"
"10049100-110-スズミ" = "3つ、最後にお伝えします。"
"10049100-111-スズミ" = "1つ、先生のほうへ閃光弾を投げないでください。危険でしょう。#nもしも当たったら、どうするつもりなのですか。"
"10049100-112-スズミ" = "2つ、私は正義実現委員会ではありません。正義実現委員会になれなかったのも事実です。"
"10049100-113-スズミ" = "そして、3つ。"
"10049100-114-スケバンA" = "もしかして……#n入りたくても、正義実現委員会には入れなかったのか？"
"10049100-115-スズミ" = "私は、集団に馴染めず逃げてしまった……正義実現委員会、失格です。"
"10049100-116-ミライ" = "いきなり何の話ですか！？"
"10049100-117-シミコ" = "では、より分かりやすく言ってあげましょう。"
"10049100-118-シミコ" = "今、あなたの目の前にいるのは――"
"10049100-119-スケバンA" = "お前だって、うちらと一緒じゃんか！"
"10049100-120-スズミ" = "……。"
"10049100-121-スズミ" = "……不良も同然の存在ですよ。"
"10049100-122-ミライ" = "はい！？"
"10049100-123-ミライ" = "いたっ！"
"10049100-124-ミライ" = "これは、どういう……？"
"10049100-125-スズミ" = "ですが、今回の件で分かったことがあります。"
"10049100-126-スズミ" = "誰かを守る力がこの手にあって、たとえそれが正義ではなくとも。#nその力を私が私の手で正しく使うことができるのであれば――"
"10049100-127-スズミ" = "それだけで十分なんです。"
"10049100-128-スズミ" = "結果として――正義は後からついてくるもの、ですから。"
"10049100-129-ミライ" = "あ、これ閃光――"
"10049100-130-ミライ" = "ひっぎゃぁぁああぁぁぁあああっー！"
"10049100-131-ミライ" = "め、目がぁぁあああぁぁ！"
"10049100-132-ミライ" = "うああぁぁあああぁぁ！！"
"10049100-133-ラブ" = "えっ、何！？どういう状況！？"
"10049100-134-ミライ" = "あっ、そこは境界線ですよ！"
"10049100-135-レイサ" = "ようこそ！トリニティ自治区へ！"
"10049100-136-ミライ" = "え、ええぇっ！？"
"10049100-137" = "ターゲットの、トリニティ自治区への進入を確認。#n――発砲許可、下りました。いつでも撃てます。"
"10049100-138-スズミ" = "スズミさん、必殺技のセリフ！まだ覚えてますか！？"
"10049100-139-スズミ" = "もちろんです。"
"10049100-140-ミライ" = "ちょっ、ちょっと待ってくださいっ！！"
"10049100-141-レイサ" = "みんなの平和のために！#n誰ひとり分かってくれなくても！どんなときだって！"
"10049100-142-レイサ" = "私たちは……今日も守ってみせる！"
"10049100-143-スズミ＆レイサ" = "マジカル――テラマキナ！！"
"10049100-144-？？？" = "狙撃は反則ですよぉぉぉぉぉぉぉ！！"
"10049100-145-観光客A" = "あっ！花火！"
"10049100-146-観光客B" = "綺麗だね……。"
"10049100-147-観光客A" = "良いショーだったね。こんなの初めてだよ。"
"10049100-148-子供A" = "今日、すっごく楽しかった！！"
"10049100-149-子供B" = "ね、ね、ヘヴィキャリバーズごっこしよ？"
"10049100-150-子供A" = "いいよ！やろやろ！"
"10049100-151-シミコ" = "正義は、勝ちます！"
"10049100-152-シミコ" = "皆さん、お疲れ様でした！"
"10049100-153-スズミ" = "レイサさん、シミコさん、マシロさん、ヘルメット団の皆さん……。"
"10049100-154-スズミ" = "……先生。"
"10049100-155" = "[ns] \"スズミ！\""
"10049100-156-スズミ" = "自警団――本日のパトロールを完了しました！"
"10049100-157-ラブ" = "ちょっと！うちの褒賞金ふっ飛んだじゃない！！！！！！"
"10049100-158" = "魔法少女ヘヴィキャリバー～エラの野望と正義の資格～"
