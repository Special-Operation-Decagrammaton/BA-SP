[translation]
"10049075-1-ラブ" = "マスコットを攻撃するなんて、あんたら正気か！？"
"10049075-2-ジャブジャブヘルメット団B" = "それが……むしろ攻撃されるのが正しいと言いますか……。"
"10049075-3-ジャブジャブヘルメット団B" = "あの怖そうなやつは敵役なので……うわああっ！"
"10049075-4-ラブ" = "違うわよ！うちが言ってるのは魔法少女のほう！！"
"10049075-5-ラブ" = "仲間なのに攻撃してきてるじゃない！"
"10049075-6-ラブ" = "ぎゃあっ！"
"10049075-7-スズミ" = "テルミットホワイト！スタナグちゃんに回復魔法をかけてあげてください！"
"10049075-8-スズミ" = "わ、分かりました！"
"10049075-9-ラブ" = "回復魔法！？[ruby=えいこうだん]曳光弾[/ruby]とナパーム弾でしょうが！！"
"10049075-10-レイサ" = "安心してください！#n[ruby=回復魔法]スラッグ弾[/ruby]をありったけ撃ち込んであげますから！"
"10049075-11-ラブ" = "がんばれ、スタナグちゃん！"
"10049075-12-ラブ" = "味方役なんじゃないの！？"
"10049075-13-エラ" = "これでとどめよ！！"
"10049075-14-レイサ" = "ヒーリングドラゴンブレス！"
"10049075-15-ラブ" = "ぐあっ……！"
"10049075-16-子供B" = "スタナグちゃん！！"
"10049075-17-子供B" = "大丈夫だよ！倒れたって……スタナグちゃんはすぐ立ち上がるもん！"
"10049075-18-子供A" = "そうそう！毎回ボコボコにされて、いっつも回復してもらってるよね！"
"10049075-19-ラブ" = "そんな……マスコット……いない、わよ……。"
"10049075-20-ラブ" = "マジカル・キュア・ロープで縛って――"
"10049075-21-ラブ" = "マジカル・キュア・テープで口を塞いでおきました！"
"10049075-22-ラブ" = "エラ！スタナグちゃんの仇は、必ず取ってみせます！"
"10049075-23-ラブ" = "――スタナグちゃんを治療したら、また戻ってきますからね！"
"10049075-24" = "[ns5] \"みんなー！休憩時間だよ！\"\n[ns6] （シミコもついて来てね！）"
"10049075-25-ジャブジャブヘルメット団A" = "結局あんたら、何のつもりなのよ。"
"10049075-26-ラブ" = "変な格好だし、うちらにこんなことして……。"
"10049075-27-ラブ" = "それ……車のバッテリーじゃないわよね！？"
"10049075-28-ジャブジャブヘルメット団A" = "隊長！うちら、もしかして……白状するまで電流を……！"
"10049075-29-ジャブジャブヘルメット団B" = "白状することもないのに！？"
"10049075-30-ラブ" = "待て待て待て待て！！"
"10049075-31-スズミ" = "ぎゃあああぁぁぁっ！！"
