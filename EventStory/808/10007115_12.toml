[translation]
"10007115-1" = "エピローグ;レッドウィンター連邦学園のとある一日"
"10007115-2" = "旧227号温泉郷"
"10007115-3" = "[ns] \"……。\""
"10007115-4-トモエ" = "えっと、かなりの爆発でしたが……先生、ご無事ですか？"
"10007115-5" = "[s1] \"みんなと咄嗟に逃げられたから大丈夫。\"\n[s2] \"うん、何とか……。\""
"10007115-6-トモエ" = "それは良かったです。"
"10007115-7-トモエ" = "それは良かったです。"
"10007115-8-トモエ" = "建物は……"
"10007115-9-マリナ" = "柱一本残っていない、か。いきなり、残酷なほどの殺風景に……。"
"10007115-10-ノドカ" = "……。"
"10007115-11-ノドカ" = "温泉は枯れて、チェリノ会長も最後には善処してくれたのに、まとめて爆破されて……。"
"10007115-12-ノドカ" = "また、あの頃の生活に……。"
"10007115-13-ノドカ" = "その上、爆発でこうして灰まみれで、もう最悪です……。"
"10007115-14-ノドカ" = "……ですが、仕方ありませんね。"
"10007115-15-ノドカ" = "人生まだまだ長いですし、いつかまたこうして千載一遇のチャンスがやってくることもあるはずですし……これからもたくさんの綺麗なものが見られるよう、何とかやっていくしかありません。"
"10007115-16-ノドカ" = "先生も、お友達も無事だったのですから……今回はそれで良しとします。"
"10007115-17-ノドカ" = "うん、みんな無事で何より。"
"10007115-18" = "[s] \"……これからも一緒に頑張ろう、ノドカ。\""
"10007115-19-ノドカ" = "……はい！ありがとうございます、先生。"
"10007115-20-ノドカ" = "うぅ、それにしても……爆発の埃やら何やらで、服も髪もぐちゃぐちゃです……。"
"10007115-21-ノドカ" = "洗い流そうにも、ちょうど温泉も無くなってしまって……。"
"10007115-22-チェリノ" = "おいらもベトベトだ！もうっ！"
"10007115-23-チェリノ" = "何か髭に色々変なのがくっついてて、気持ち悪い……。"
"10007115-24-トモエ" = "旧校舎に、身体を洗える設備などは……？"
"10007115-25-ノドカ" = "お手洗いの洗面台があるんですけど、それもずいぶん前に水道が止まって……普段はドラム缶に水を入れて沸かしたりですね。"
"10007115-26-チェリノ" = "で、では、レッドウィンター連邦学園の最高の権威を持つこのおいらに、こんなみっともない格好で事務局まで戻れと言うのか？そんなの、おいらの面子が立たない！"
"10007115-27-シグレ" = "ねえノドカ、あっちに運良く露天風呂が一つ残ってるみたい。"
"10007115-28-シグレ" = "お湯もキレイだし、まだ使えるかも。"
"10007115-29-ノドカ" = "本当！？"
"10007115-30-ノドカ" = "やった、"
"10007115-31-ノドカ" = "じゃあ身体を洗いに……"
"10007115-32-チェリノ" = "ちょっと待ったぁ！おいらを差し置いて、旧校舎の停生徒たちが先にだなんてありえない！"
"10007115-33-チェリノ" = "せめて、おいらも一緒に入る！"
"10007115-34-マリナ" = "チェリノちゃんが入るなら、私も……。"
"10007115-35-マリナ" = "ふう、色々と騒がしかったな……温かい湯船に入って休みたい……。"
"10007115-36-ミノリ" = "ま、まさか、身体を洗う権利まで独占するつもりじゃ……！？"
"10007115-37-ミノリ" = "事務局の生徒たちが入るなら、あたしたちも一緒に入るから！"
"10007115-38-ノドカ" = "ま、待ってください！こんなに大勢で一気にはちょっと……！"
"10007115-39-シグレ" = "まあ、良いんじゃない？たまにはぎゅうぎゅうに、賑やかに入るのも楽しいよ。"
"10007115-40-シグレ" = "それに……まだ温泉が残ってるってことは、ここはまだ「227号温泉郷」でしょ？"
"10007115-41-シグレ" = "営業終了までよろしくね、「支配人」。"
"10007115-42-ノドカ" = "……はぁ。"
"10007115-43-ノドカ" = "そう言われちゃったら仕方ない……"
"10007115-44-ノドカ" = "「227号温泉郷」、臨時営業開始です！"
"10007115-45" = "ふぅ……本当に良いお湯ですね。一日の疲れが全て流されるような……。"
"10007115-46" = "うむ。やはりこういった温泉が楽しめなくなるのは残念だな。"
"10007115-47" = "事務局に被害が及ばないようにしながら、新しい温泉郷を作る方法はないのか？"
"10007115-48" = "それよりもチェリノちゃん、そんな洗い方じゃ汚れは取れませんよ？"
"10007115-49" = "さあ、私が直接洗ってあげますからこちらへ。"
"10007115-50" = "ううっ！おいらは子供じゃないんだからひとりで洗える！あ、おい、誰だ今髭に触ったのは！？"
"10007115-51" = "ふふっ、こうして温泉に入りながらのモルスは最高だね。"
"10007115-52" = "ん？何だその飲み物は？"
"10007115-53" = "まさかとは思うが、事務局の保安委員の前で堂々とアルコールを……？"
"10007115-54" = "これは去年の春に私が漬けた、特製モルスだよ。"
"10007115-55" = "まあ、ちょっと発酵してるかもだけど。"
"10007115-56" = "そうか……いや、今何と？"
"10007115-57" = "ふふっ、気にしない気にしない。"
"10007115-58" = "そんなに気になるなら、一緒に一杯どう？"
"10007115-59" = "まあ、一口ぐらいなら……。"
"10007115-60" = "皆の者！今日は邪悪なる圧制者、その新兵器の前に膝をついてしまったが……これはあたしたちの敗北じゃない！これはあくまで、次の勝利のための布石だ！"
"10007115-61" = "次こそはあの鬱陶しい戦車を事前に破壊し、革命的な勝利をもぎ取ろう！"
"10007115-62" = "おーーー！！"
"10007115-63" = "騒がしいですね……ですからこんな一斉に入りたくなかったのですが……。"
"10007115-64" = "[s] \"でも、みんな楽しそうだね。\""
"10007115-65" = "あはは……まあレッドウィンターの生徒たちは、いつもこんな感じと言いますか……。"
"10007115-66-ノドカ" = "……先生。"
"10007115-67-ノドカ" = "何だか色々とバタバタしてしまいましたが、その……。"
"10007115-68" = "[s3] \"すごく楽しかったよ。\"\n[s4] \"ありがとう、ノドカ。\""
"10007115-69-ノドカ" = "……そう思っていただけたなら、良かったです。えへへ。"
"10007115-70-ノドカ" = "……そう思っていただけたなら、良かったです。えへへ。"
"10007115-71-ノドカ" = "もう温泉はありませんが、また旧校舎に……"
"10007115-72-ノドカ" = "いえ、私たち227号特別クラスのところに来てくださいね。"
"10007115-73-ノドカ" = "温泉郷でなくても……私たちはいつも、先生のことを歓迎しますから！"
"10007115-74" = "227号温泉郷の運営記録！"
