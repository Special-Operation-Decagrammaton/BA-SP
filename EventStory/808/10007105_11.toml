[translation]
"10007105-1" = "第10話;変わらないもの"
"10007105-2-ミノリ" = "うっ……くそっ、あの戦車さえなかったら……。"
"10007105-3-チェリノ" = "ふふん、見たか。「粛清君1号」の威力を。"
"10007105-4-チェリノ" = "粛清1号にはどんな障害物でも取り除く巨大なシャベルが、そしてそれ以外にもおいらに刃向かう生徒たちを追い払う、ありとあらゆる装備が備えられているのだ！"
"10007105-5-チェリノ" = "工務部のやつらがどんな重機で襲ってこようとも、もう怖くない！"
"10007105-6-ミノリ" = "くっ、なんて余計なものを……次は、あの戦車を真っ先に破壊しないと……。"
"10007105-7-チェリノ" = "これで邪魔者はすべて消えたな。"
"10007105-8-チェリノ" = "さあ、今度こそ温泉郷を撤去……。"
"10007105-9-ノドカ" = "最後の、希望が……。"
"10007105-10-ノドカ" = "うっ……うう……"
"10007105-11-ノドカ" = "うあああぁぁぁぁん！"
"10007105-12-ノドカ" = "ど、どうして急に泣くんだ？温泉郷の閉鎖はもう決定事項なんだから、いい加減諦めて……。"
"10007105-13-チェリノ" = "……い、いくら泣いたって引き下がらないからな。これはレッドウィンター連邦学園全体のための決定で……"
"10007105-14-チェリノ" = "そ、そうだろう、みんな？"
"10007105-15-マリナ" = "それはその、何というか……。"
"10007105-16-トモエ" = "え、っと……。"
"10007105-17-チェリノ" = "ど、どうしてみんな視線を逸らすんだ！？"
"10007105-18-チェリノ" = "まるでおいらが悪者みたいじゃないか！"
"10007105-19-チェリノ" = "カムラッド！カムラッドから見ても、おいらが間違ってるのか！？"
"10007105-20" = "[s1] \"今回は、チェリノがやり過ぎだよ。\"\n[s2] \"温泉郷の建物ぐらいは、残しても良いんじゃない？\""
"10007105-21-チェリノ" = "か、カムラッドまで……！？"
"10007105-22-チェリノ" = "か、カムラッドまで……！？"
"10007105-23-チェリノ" = "……と、とにかく227号温泉郷は閉鎖！"
"10007105-24-チェリノ" = "枯れる直前まで運営していたら、温泉開発部のやつらがいつまた訪れて、レッドウィンター連邦学園を危険に晒すのか分かったものではない！"
"10007105-25-チェリノ" = "まあ、だからその……逆に言うと、建物ぐらいはそのまま残してやっても……。"
"10007105-26-ノドカ" = "もう全部終わりです、元々終わりなんですっ！どちらにせよ温泉が枯れたら、私たちはもうお終いです……！"
"10007105-27-ノドカ" = "稼いだお金はすぐに消えるでしょうし、結局私たちは旧校舎の時の貧困生活に後戻りです……。"
"10007105-28-ノドカ" = "だからこのチャンスを逃したくなかったのに……あの頃には、戻りたくなかったのに……！"
"10007105-29-ノドカ" = "結局、私たちにはもう何も残らない！！"
"10007105-30-シグレ" = "そんなことないよ、ノドカ。"
"10007105-31-ノドカ" = "何を言ってるの、シグレちゃん……"
"10007105-32-ノドカ" = "だってもう、全部無くなっちゃうのに……！"
"10007105-33-シグレ" = "私たち227号特別クラスが、こうして一緒にいるでしょ。"
"10007105-34-ノドカ" = "……？"
"10007105-35-シグレ" = "……私はね。旧校舎の生活も、そんなに嫌じゃなかったよ。"
"10007105-36-シグレ" = "もちろん食事はいつも足りないし、ちゃんとした暖房器具もないし、たまに熊も出てくるけど……。"
"10007105-37-シグレ" = "ノドカと一緒にいられて、227号特別クラスで一緒にいられて、私はそれだけで色んな事が楽しかった。"
"10007105-38-シグレ" = "その場所がたとえ立派な温泉郷でも、寒々しい廃墟でも……一緒にいられるなら、私はどこでも構わない。"
"10007105-39-シグレ" = "それに温泉郷としての建物もできたし、あれ一つでも残してもらえるなら……状況は、少し良くなったんじゃないかな。"
"10007105-40-シグレ" = "私たちが一緒なら、きっと大丈夫。私はそう思うけど……ノドカはどう？"
"10007105-41-ノドカ" = "シグレちゃん……。"
"10007105-42-チェリノ" = "……待った。撤去を取り消すとはまだ言ってはないぞ。"
"10007105-43-トモエ" = "チェリノちゃん、空気を読んでください……！"
"10007105-44-チェリノ" = "え、あ、うむ……。"
"10007105-45-チェリノ" = "……仕方ないな。みんながそこまで言うなら、今回だけは特別に見逃してやろう。"
"10007105-46-チェリノ" = "建物の撤去については保留！"
"10007105-47-チェリノ" = "この温泉郷については基本的に「227号特別クラス」の生徒たちに一任し、他の建物として改修する方針とする！"
"10007105-48-マリナ" = "さすがはチェリノ会長、素晴らしいご判断です。"
"10007105-49-マリナ" = "ここまで寛大な処置を与えてくれるなんて……"
"10007105-50-マリナ" = "このマリナ、感激致しました！"
"10007105-51-メグ" = "……改修？"
"10007105-52-ノドカ" = "あれ……メグさん？"
"10007105-53-メグ" = "まあ、温泉の問題を放って帰るわけにはいかないからね！でも温泉郷を自由に使っても良いとは言ったけど……"
"10007105-54-メグ" = "違う用途への改修は、ちょっと許せないかな！それは温泉への冒涜だから！"
"10007105-55-ノドカ" = "で、でも放っておいても、ここの温泉は枯れるんですよね……？"
"10007105-56-ノドカ" = "温泉を蘇らせることができないのなら、他の用途の建物として改修した方が……。"
"10007105-57-メグ" = "それを防ぐために、地下のマグマ地帯を爆発させようとしてたんだけどー……"
"10007105-58-メグ" = "それもダメならもう、カスミ部長のプランBを実行するしかないね！"
"10007105-59" = "[s] \"プランB……？\""
"10007105-60-メグ" = "うん、「温泉が温泉でなくなるくらいなら、全部爆発させちゃえ」プラン！"
"10007105-61-メグ" = "こんなこともあろうかと、実は基礎工事をする時に幾つか爆薬を埋めておいたんだ♪"
"10007105-62-ノドカ" = "ば、爆薬！？"
"10007105-63-ノドカ" = "つまり私たちは今、爆薬の上に……？"
"10007105-64-メグ" = "うん、さすがはカスミ部長！多分こんな展開になると分かってて、埋めておくように言ってくれたんだねー。"
"10007105-65-メグ" = "あは、やっぱり私と違って頭良い！"
"10007105-66-メグ" = "世の中に、意味の無い温泉なんてない！意味の無い建物はあるけど！"
"10007105-67-メグ" = "ということでプランB……"
"10007105-68" = "[s] \"ま、待っ――\""
"10007105-69-メグ" = "行っけぇー！！！"
"10007105-70" = "ドカアアァァァァン！"
