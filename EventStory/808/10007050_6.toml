[translation]
"10007050-1" = "第5話;工務部に仕事を！"
"10007050-2-ノドカ" = "私たちの「227号温泉郷」では立派な温泉だけではなく、お客様にお散歩を楽しんでいただけるように、素敵なお庭も整えているんです！"
"10007050-3-ノドカ" = "もちろん年中雪が降るこのレッドウィンターの特性上、お花や木が生い茂ったお庭を整えるのは難しいのですが……。"
"10007050-4-ノドカ" = "その代わりに石や砂を用いて、枯山水の庭園を造ったんです。"
"10007050-5" = "[s] \"枯山水？\""
"10007050-6-ノドカ" = "はい。聞いたことはあるかもしれませんが、石や砂などで自然などを表現した庭ですね。"
"10007050-7-ノドカ" = "水を使わずに自然を表現するこの庭園様式は、どことなく節制の大切さをも説いているようにも思えて、素敵だなって思うんです。"
"10007050-8-ノドカ" = "それにこの庭を見ていると、些細なことはどうでも良いと思えるくらい、静かで落ち着いた気――"
"10007050-9-？？？" = "こんなことは許されない！糾弾しよう！"
"10007050-10-ノドカ" = "落ち着いた気持ち、に……"
"10007050-11-？？？" = "そうだ、許されてたまるものか！糾弾だ！"
"10007050-12-ノドカ" = "ああもう何ですか！せっかく先生とふたりっきりで良い話をしていたのに！"
"10007050-13-ノドカ" = "こういった場所で騒ぎを起こすなんて、お客様だとしても許されません！"
"10007050-14" = "227号温泉郷・入口"
"10007050-15-ミノリ" = "「227号温泉郷」に、断固として抗議する！"
"10007050-16-ミノリ" = "そうだそうだ！"
"10007050-17-ミノリ" = "「227号温泉郷」は、工務部に及ぼした被害を補償しろ！"
"10007050-18-傭兵バイト" = "補償しろーー！"
"10007050-19-シグレ" = "だから、それは誤解っていうか……"
"10007050-20" = "な、何ですかこの状況は！工務部がどうしてここに！？"
"10007050-21-シグレ" = "ああ、ノドカ。それが、えっと……。"
"10007050-22-ミノリ" = "ふん、ようやく現れたか。"
"10007050-23-ミノリ" = "豪遊三昧のブルジョワ悪徳支配人、ノドカめ！"
"10007050-24-ノドカ" = "だ、誰が「豪遊三昧のブルジョワ悪徳支配人」ですか！？"
"10007050-25-ノドカ" = "贅沢な生活は最初だけで、このところは運営が忙しすぎて休む暇も無いんですよ！"
"10007050-26-ノドカ" = "……こ、こほん。"
"10007050-27-ノドカ" = "えっと、この「227号温泉郷」にどういった御用でしょうか、工務部の皆様？"
"10007050-28-ミノリ" = "あ、あの表情を見ろ！"
"10007050-29-ミノリ" = "あの資本主義に染まった、邪悪なブルジョワジーの笑みを！"
"10007050-30-ミノリ" = "かつて苦楽を共にした時は知らなかったが……"
"10007050-31-ミノリ" = "富を手に入れて、いよいよ本性を現したということか。この裏切り者め！"
"10007050-32-ノドカ" = "さっきから散々な物言いですね！？"
"10007050-33-ノドカ" = "こほんっ……ミノリさん、まずは落ち着いて、それからどうしてこんなところでデモをしていたのか教えてください。他のお客様も困っていますので……。"
"10007050-34-ミノリ" = "ふん、この温泉郷の問題にまだ気づいてないのか。"
"10007050-35-ノドカ" = "えっと……はい、教えていただければと。"
"10007050-36-ミノリ" = "あたしたちの不満は……"
"10007050-37-ミノリ" = "この温泉郷そのものだ！"
"10007050-38-ミノリ" = "そ、それはどういう意味で……？"
"10007050-39-ノドカ" = "私たちが温泉郷を運営することで、工務部に何か不利益でもあったのですか？"
"10007050-40-ミノリ" = "この期に及んで白を切る気か！あたしたちは全部見てたんだぞ！"
"10007050-41-ミノリ" = "邪悪なゲヘナの温泉開発部員たちが、ここに温泉郷を建てて颯爽と帰る姿を……！"
"10007050-42-ノドカ" = "……それが、何か問題でも？"
"10007050-43-ミノリ" = "当然だ！"
"10007050-44-ミノリ" = "温泉開発部のやつらは、あたしたちレッドウィンター連邦学園の生徒ではない……"
"10007050-45-ミノリ" = "つまり、外部委託じゃないか！"
"10007050-46" = "[s] \"……外部委託？\""
"10007050-47-ミノリ" = "今まであたしたち工務部は、レッドウィンター連邦学園で何か大規模な土木工事が必要なたびに、どんなにきつい仕事でも率先して誠実に働いてきた。"
"10007050-48-ミノリ" = "厳しい労働環境だったが、「学園のすべての建物はあたしたちの手で建てる」というプライドを持って、ここまでずっとやってきたんだ！"
"10007050-49-ミノリ" = "ところが新しくできたこの温泉郷が、今やレッドウィンター連邦学園で一番の観光名所が……あたしたち工務部ではなく、外部委託によって建設されたなんて……！"
"10007050-50-ミノリ" = "これは、あたしたち工務部のプライドに大きく関わる問題だ！"
"10007050-51-傭兵バイト" = "そうだ！傷ついたんだ！"
"10007050-52-ミノリ" = "あたしたち工務部は、「227号温泉郷」のこの横暴さに対して断固抗議する！"
"10007050-53-傭兵バイト" = "抗議する！！"
"10007050-54-ノドカ" = "ま、待ってください。ですから、この温泉郷は私たちが望んで建てたというより、その温泉開発部が勝手に作ったもので……。"
"10007050-55-ノドカ" = "せ、先生からも何かフォローをお願いします……！"
"10007050-56" = "[s1] \"ノドカもある意味、温泉開発部の被害者だと思うよ？\"\n[s2] \"この状況は、全部ノドカが望んだことってわけじゃないよ。\""
"10007050-57-ミノリ" = "……何、被害者？"
"10007050-58-ミノリ" = "なるほど。それは確かに考えてなかった……。"
"10007050-59-ノドカ" = "そ、そうです！言ってみれば私たちも、温泉開発部の手によって「旧校舎を失った」という被害者でもあります！"
"10007050-60-ミノリ" = "なるほど、望んでいない形で無理やりにされてしまったと……。"
"10007050-61-ミノリ" = "ならば同士ノドカ……今からあたしたちと一緒に、この温泉郷を撤去するとしよう！"
"10007050-62-ノドカ" = "そ、そうです。私たちも最初からこんな温泉郷を建てようと思って建てたんじゃないんです！"
"10007050-63-ミノリ" = "なるほど……？なら工務部との事前相談も無しで建設されたこの「違法建築物」は、撤去しても問題無いということか？"
"10007050-64-ノドカ" = "はいっ！？"
"10007050-65-ノドカ" = "そ、それはそれで話が別と言いますか……せ、せっかく手に入れた一攫千金のチャンスを、自ら逃すわけがないじゃないですか！"
"10007050-66-ミノリ" = "なっ……！やはり本性は邪悪だったな、このちびブルジョアジーめ！"
"10007050-67-ノドカ" = "ち、ちび……！？もう何なんですか一体！"
"10007050-68-ノドカ" = "これ以上聞いていられません！強制的にお帰りいただくことにします！"
"10007050-69-ミノリ" = "ふんっ、それならそれで構わない。いくら急にお金持ちになったところで、特別クラスの生徒なんかちっとも怖くないからな！"
"10007050-70-ミノリ" = "さあ！あたしたち工務部のプライドと労働の権利、そして……！"
"10007050-71-ミノリ" = "えっと、うーん……その他色々な、大事なことのために！"
"10007050-72-ミノリ" = "立ち上がろう！"
