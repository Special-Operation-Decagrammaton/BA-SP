[translation]
"10024100-1" = "エピローグ;[ruby=まんかんぜんせき]満漢全席[/ruby]"
"10024100-2" = "（こうして、「萬年参」密輸騒動は幕を閉じた）"
"10024100-3-玄龍門の構成員A" = "こっ、この料理は一体……！？"
"10024100-4-玄武商会のメンバーB" = "まずは食べてみて！レッドウィンター風のスープに、#nワイルドハント風の蒸し肉とぶどうを加えた特製料理だよ！"
"10024100-5-玄龍門の構成員A" = "スープがピンク色なんだが、本当に食べられるのか……？"
"10024100-6-玄武商会のメンバーB" = "色は強烈だけど、香ばしくて甘酸っぱい味わいが絶品なんだ！#n蒸し肉は口の中でホロホロ崩れるくらい柔らかくてさ！"
"10024100-7-玄龍門の幹部B" = "本当に、いいのか……#n山海経の伝統が……我々の文化が……"
"10024100-8-玄武商会の幹部A" = "細かいこと気にしても仕方ないって！#n食べ終わったらトリニティ風のお茶菓子も出すよ！"
"10024100-9-玄武商会の幹部A" = "バターと砂糖にこだわった焼き菓子に、牛乳茶の組み合わせが意外といけるんだ！"
"10024100-10-玄龍門の幹部B" = "お、お茶に牛乳を混ぜるなんて、そんなもの飲めるわけないだろう！"
"10024100-11-玄武商会の幹部A" = "いいから、まずは一口飲んでみて！#nこれまたクセになる味なんだよ。"
"10024100-12-シュン" = "はい、みなさん。#nこれは玄龍門と玄武商会の方々が開いてくれた宴会ですよ～"
"10024100-13-シュン" = "いっぱい楽しんでください。#nですが周りに迷惑をかけないよう、気をつけてくださいね？"
"10024100-14-梅花園の園児たち" = "は～い！"
"10024100-15-ココナ" = "食べ終わったら、ちゃんとごちそうさまを言うんですよ！"
"10024100-16-ココナ" = "それと、家に帰ったら歯磨きも忘れないことっ！"
"10024100-17-梅花園の園児たち" = "ココナちゃんも歯磨きしなきゃダメだよ！"
"10024100-18-ココナ" = "ココナちゃんじゃなくて、ココナ教官ですっ！"
"10024100-19-シュン" = "では、ココナちゃん。しばらく子ども達をお願いできますか？"
"10024100-20-ココナ" = "え？シュン姉さん、どこに行くの！？"
"10024100-21-シュン" = "うふふ。#nお姉さんは……これから先生と「用事」があるんです。"
"10024100-22-ココナ" = "え？姉さんだけずるい！#n私も……！うぅ、でも子ども達が……"
"10024100-23-ココナ" = "もう、シュン姉さん！#nまた冷凍庫の「バーゲンダッツ」食べちゃうんだからね！"
"10024100-24-サヤ" = "……こんなに人が多いと落ち着かないのだ～#n早く研究室に帰りたいのに……"
"10024100-25-サヤ" = "でも、どの料理も美味しそう……どうすれば。"
"10024100-26-サヤ" = "そうだ、思いついた！流石はぼく様！"
"10024100-27-サヤ" = "自分の分身を作る薬があればいいのだ！"
"10024100-28-サヤ" = "そうすれば1人は料理を味わって、もう1人は研究に集中できるのだ！"
"10024100-29-サヤ" = "でも、そのためには一度戻って研究しなくちゃいけないから……"
"10024100-30-サヤ" = "この料理を食べられなくなっちゃうのだ！"
"10024100-31-サヤ" = "……んむ、もぐもぐ……#nどの料理も本当に美味しいのだ。"
"10024100-32-キサキ" = "みんな楽しそうだね、キサキ。"
"10024100-33-ルミ" = "この光景が見たかったの？"
"10024100-34-ルミ" = "さて、どうじゃろうな。#n妾は山海経が平穏であってくれたら、それで構わぬよ。"
"10024100-35-ルミ" = "ふふっ。こんなに嬉しそうなキサキの顔、久しぶりに見たよ。"
"10024100-36" = "[s] \"本当だね。\""
"10024100-37-キサキ" = "[ruby=そなた]其方[/ruby]からも、そう見えるのかえ？"
"10024100-38-キサキ" = "……こんな時くらい、妾とて気を抜いても良いじゃろう。"
"10024100-39-キサキ" = "それにしては、不思議な組み合わせの料理じゃ。#n牛乳氷に練乳をかけて、葡萄と飴を添えるとは……"
"10024100-40-レイジョ" = "もっとお持ちしましょうか、門主様？"
"10024100-41-キサキ" = "ふふ、せっかくじゃ、他の料理も味わってみるとするかの。"
"10024100-42-ルミ" = "ふふ。少食のキサキが、あたしの料理をこんなに食べてくれて嬉しいよ。#nあたしにとって――妹みたいなものだからね。"
"10024100-43-ルミ" = "……其方の妹になったつもりはないと、何度言えば分かるのじゃ。"
"10024100-44-ルミ" = "別にいいじゃない！何年一緒にいると思ってるの！#nほら、これも食べて。イチゴに生クリームを乗せて、お餅で包んだんだ！"
"10024100-45-ルミ" = "それともチーズボール揚げの方が良かった？#n甘いのばっかりだったから、しょっぱいので口直ししたいよね。"
"10024100-46-キサキ" = "ふむ、どちらも頂くとしようか。"
"10024100-47" = "（組織同士の問題は、すぐに解決とはいかないかもしれない）"
"10024100-48" = "（それでも、この2人がいれば、きっと……）"
"10024100-49" = "龍武同舟 ～思い描くは、ひとつの未来～"
