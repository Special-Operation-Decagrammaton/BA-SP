[translation]
"10024040-1" = "第4話;[ruby=しゃこほうろう]舎虎逢狼[/ruby]"
"10024040-2" = "崑崙山・入口"
"10024040-3-レイジョ" = "先生、大丈夫？"
"10024040-4" = "[s1] \"こんな急勾配だなんて……\"\n[s2] \"聞いてないんだけど……！\""
"10024040-5-レイジョ" = "先生、容疑が晴れたら、私と一緒にカンフーの修行をしませんか？"
"10024040-6-ルミ" = "たしかに、それは名案だね。"
"10024040-7" = "[ns] \"どこが名案なの！？\""
"10024040-8-レイジョ" = "何事にも体力は欠かせませんからね。料理をするのにも、長時間立ちながら鍋を振るい、厨房の暑さに耐える必要があります。"
"10024040-9-レイジョ" = "それは、先生の仕事にも通じる事ですから。"
"10024040-10" = "[s] \"……カンフーの修行を通じて、体力作りを？\""
"10024040-11-レイジョ" = "ええ、その通りです。"
"10024040-12" = "[s] \"運動不足なのは認めるけど……\""
"10024040-13-レイジョ" = "「考えるより行動せよ。行動しない者は敗北する……」"
"10024040-14-レイジョ" = "まさに、今の先生のためにあるような言葉ではありませんか？"
"10024040-15" = "あはは、良かったね、先生。#nレイジョに鍛えてもらいなよ！"
"10024040-16" = "[ns] \"面白がってるよね！？\""
"10024040-17-ミナ" = "遅かったな、玄武商会。"
"10024040-18-レイジョ" = "あなたは……！"
"10024040-19-ミナ" = "改めて言葉を交わすのは初めてだな？"
"10024040-20-ミナ" = "玄龍門の執行部長――[ruby=このえ]近衛[/ruby]ミナだ。"
"10024040-21-ルミ" = "執行部長が顔を出したってことは、キサキの命令だと思っていいのかな？"
"10024040-22-ミナ" = "さてな……ご想像にお任せしよう。"
"10024040-23-ミナ" = "犯人は再び犯行現場に現れるものと相場がきまっている。#n私はそれをこの目で確かめるべく、待っていたまでだ。"
"10024040-24-レイジョ" = "現場を検分するだけで犯人扱いをされてはたまりませんよ、ミナ執行部長。"
"10024040-25-ミナ" = "いや――すべての物事は繋がっているというものだ。#n私は確信しているぞ。"
"10024040-26-レイジョ" = "うかつな確信を、世間では「不注意」と呼ぶのです。"
"10024040-27-ミナ" = "私は不注意を常に警戒し、改善の努力を重ねてきたんだ――#n玄龍門では絶対にそのようなミスは犯さない。"
"10024040-28-レイジョ" = "素晴らしい自信ですね。#n過剰な自信は時にその目を曇らせますよ。"
"10024040-29-ミナ" = "そこは責任感といってくれ。"
"10024040-30-ミナ" = "今度こそ、決定的な証拠が見つかるかもしれないからな。"
"10024040-31-ミナ" = "初の実を結ぶまでの過程――それは途方もない苦労を伴う。#nしかし、だからこそやり甲斐があるというもの。"
"10024040-32" = "[ns3] \"食券を取り出して、どうしたの？\"\n[ns4] \"ダメだよ、ミナちゃん！燃やしたら！\""
"10024040-33-レイジョ" = "……安心してください、先生。#nあれは偽の食券です。"
"10024040-34-ミナ" = "ふぅ、タバコを吸えないのが残念だな。"
"10024040-35" = "[ns] \"いや、生徒がそれはダメだからね！？\""
