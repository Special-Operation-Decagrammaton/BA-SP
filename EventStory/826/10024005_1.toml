[translation]
"10024005-1" = "プロローグ;[ruby=きゃくじんかんたい]客人歓待[/ruby]"
"10024005-2" = "（いつものようにシャーレで仕事をしていると……）"
"10024005-3" = "プルルルルル！"
"10024005-4" = "[ns] \"誰からだろう……？\""
"10024005-5" = "[ns] \"はい、シャーレです。\""
"10024005-6-ルミ" = "シャーレの[USERNAME]先生で合ってるかな？"
"10024005-7" = "[s1] \"はい、そうですが……どちら様でしょうか？\"\n[s2] \"留守番電話に接続します。ピーという発信音の後に……\""
"10024005-8-ルミ" = "突然連絡してごめんね。"
"10024005-9-ルミ" = "あたしは[ruby=あけしろ]朱城[/ruby]ルミ。#n玄武商会で会長をやってるんだ。"
"10024005-10-ルミ" = "なんだ、先生って冗談とか言う人なんだね。#nちょっと気が楽になったよ。"
"10024005-11-ルミ" = "まぁ、その冗談はあんまり面白くなかったけど……あはは。"
"10024005-12" = "[s3] \"うん……ごめん。\""
"10024005-13-ルミ" = "ははは。それじゃあ、次はとっておきの冗談、期待してるよ。"
"10024005-14-ルミ" = "さて、仕切り直して――あたしは[ruby=あけしろ]朱城[/ruby]ルミ。#n玄武商会で会長をやってるんだ。"
"10024005-15" = "[s] \"よろしくね、ルミ。今日は何か相談事？\""
"10024005-16-ルミ" = "相談というか、お願いというか……"
"10024005-17-ルミ" = "あたしたち玄武商会から、シャーレに依頼があってね。"
"10024005-18" = "[s] \"……なんだか重たい相談の予感。\""
"10024005-19-ルミ" = "あはは……そうだね。#nこれはあたし個人じゃなくて、[ruby=・   ・   ・   ・]玄武商会[/ruby]としての依頼。"
"10024005-20-ルミ" = "だから先生の勘は正しいよ。"
"10024005-21-ルミ" = "もしかしたら、先生を困らせてしまう内容かもね。"
"10024005-22-ルミ" = "これだけのやり取りで重たい相談って分かるの、すごいね！#nもしかして第六感とかがあったり……？"
"10024005-23" = "[s4] \"あはは、ただの偶然だよ。\"\n[s5] \"そういうのがあれば良かったんだけどね……。\""
"10024005-24-ルミ" = "そっか、それは残念。"
"10024005-25-ルミ" = "まぁでも、偶然にせよ話が早いに越したことはないからね。#n依頼内容はそんなに大変じゃないかもだし！"
"10024005-26" = "[s] \"そこは言い切ってほしかったな！\""
"10024005-27-ルミ" = "あはは……それで、先生を玄武商会に招待したいんだけど、都合は大丈夫？"
"10024005-28-ルミ" = "噂の先生がどんな人なのか気になるし――改めて挨拶したいからさ。"
"10024005-29" = "[s6] \"もちろん、いつでも大丈夫だよ。\"\n[s7] \"私も、ルミがどんな子なのか知りたいな。\""
"10024005-30-ルミ" = "おっ！あたし達、意外と気が合うかもね。"
"10024005-31-ルミ" = "先生に会えるのが楽しみになってきたよ。"
"10024005-32" = "[s] \"な、何か悪いことを企んでるわけじゃないよね？\""
"10024005-33-ルミ" = "あははっ。もし、そうだよって言ったら……どうする？"
"10024005-34-ルミ" = "それでも――最後まで信じてくれる？"
"10024005-35-ルミ" = "うん……そっか。#n本当に悪いことをしたら、その時は先生が叱ってくれるんだね？"
"10024005-36-ルミ" = "……。"
"10024005-37-ルミ" = "いいなぁ、先生の生徒は。#nそういうの……ちょっと羨ましいかも。"
"10024005-38-ルミ" = "……ふふっ。あたしも、もう先生の生徒なんだ？"
"10024005-39-ルミ" = "照れくさいけど、そう言われると嬉しいね。"
"10024005-40-ルミ" = "それじゃ――依頼が終わるまで、先生のことはあたしが守ってあげる。"
"10024005-41" = "[s] \"そのセリフ、ちょっと照れるかな……！\""
"10024005-42-ルミ" = "あははっ、ごめんごめん。#n自分じゃあんまり分からなくて。"
"10024005-43" = "[s] \"そこは自覚してほしいところだけど……。\""
"10024005-44-ルミ" = "あはは。それじゃあ私は準備してるから、[ruby=せんがいきょう]山海経の[/ruby]玄武商会まで来てもらえるかな。"
"10024005-45-ルミ" = "迎えに行けない分、最高の「おもてなし」を約束するよ。#n楽しみにしててね。"
"10024005-46" = "（山海経の玄武商会に向かった）"
"10024005-47" = "山海経・玄武商会"
"10024005-48" = "[ns8] \"ここが玄武商会……\"\n[ns9] \"聞いていた通りというか……\""
"10024005-49-玄武商会のメンバーA" = "美味しそうなスパイスの香りがするでしょ？"
"10024005-50-玄武商会のメンバーB" = "ここからでも香ばしい油の匂いが伝わってきますね……！"
"10024005-51" = "[s] \"う、うん……？\""
"10024005-52-玄武商会のメンバーA" = "学園外の方ですよね？#nようこそ、玄武商会へ！"
"10024005-53-玄武商会のメンバーB" = "ここは、他の学園にはない珍味がたくさん味わえる場所！"
"10024005-54-玄武商会のメンバーA" = "ささ、まずはタケノコパンダ店はいかがでしょう！#n様々な豆腐料理を取り揃えていますよ！"
"10024005-55-玄武商会のメンバーA" = "なかでも金色のカボチャスープに、豆腐やキノコを入れて煮込んだ湯豆腐が看板メニューで――"
"10024005-56-玄武商会のメンバーA" = "いやいや！#nここまで来たんですから、うちの[ruby=たいざんむしどりてん]泰山蒸鶏店[/ruby]にお越しください！"
"10024005-57-玄武商会のメンバーB" = "ウチの[ruby=チーコージー]汽鍋鶏[/ruby]は、それはそれは美味しいと評判で！#n専用の鍋で鶏肉を蒸し、その蒸気を旨味たっぷりのスープにするんです！"
"10024005-58-玄武商会のメンバーB" = "食材の風味や香りを存分に活かした栄養たっぷりのスープは、疲れた身体を癒してくれますよ！"
"10024005-59-玄武商会のメンバーB" = "もちろん、鶏肉も余すことなく堪能できます！"
"10024005-60-玄武商会のメンバーB" = "ふんっ、たかが鶏肉を蒸しただけで大げさな！"
"10024005-61-玄武商会のメンバーB" = "なにを！？そういうアンタの店だって、豆腐ばっかりじゃない！#nせっかく玄武商会まで来てくれたお客さんに、病院食でも出すつもりかい？"
"10024005-62-玄武商会のメンバーA" = "キノコや山菜をふんだんに使って、身体を気遣ってるのが分からないかなあ！#n採れたての山の幸に[ruby=こだわ]も拘っ[/ruby]てるんだぞ！"
"10024005-63-玄武商会のメンバーB" = "ウチのスープなら、鶏肉でたんぱく質もたっぷり摂れて、#n身体も芯まで温めてくれるっ！"
"10024005-64" = "[ns] \"えっと、これは一体……？\""
"10024005-65-玄武商会のメンバーA" = "2人とも自分の料理に自信があるのはいい事だけど――#nごめんね、この人はあたしのお客さんなんだ。"
"10024005-66-玄武商会のメンバーA" = "る、ルミ会長！？"
"10024005-67-玄武商会のメンバーB" = "なんでここに会長が！？"
"10024005-68" = "[s] \"ルミ！\""
"10024005-69-ルミ" = "お待たせ、先生。#n最初から迎えに行けば良かったね。"
"10024005-70-玄武商会のメンバーA" = "か、会長のお客様だったんですね！"
"10024005-71-玄武商会のメンバーB" = "失礼しました！私たちはこれで！"
"10024005-72-ルミ" = "まったく……客引きは程々にねって、いつも言ってるんだけどさ。"
"10024005-73-ルミ" = "ん……そっか、先生が楽しんでくれたなら良かった。"
"10024005-74-ルミ" = "でもね、先生……"
"10024005-75-ルミ" = "玄武商会の「おもてなし」は、ここからが本番だよ！"
"10024005-76-ルミ" = "ということで、改めて……"
"10024005-77-ルミ" = "ようこそ、玄武商会へ！"
"10024005-78" = "#video;10024"
