[translation]
"10036030-1" = "第3話;近寄る影"
"10036030-2-スケバンA" = "ああもう、うぜぇな。"
"10036030-3-スケバンB" = "たしかにカモメはうるさいが……そこまで気になるか？"
"10036030-4-スケバンA" = "ちげーよ！ヘルメット団のことだよ！"
"10036030-5-スケバンA" = "総連合会だって？#nふざけんなや！"
"10036030-6-スケバンA" = "[ruby=ねえさま]姐様[/ruby]をあんな目に遭わせておいて……#n良いご身分だぜ、まったくよ！"
"10036030-7-スケバンB" = "しかも、「アウトロービーチ」を私物化しようとしてるしな。"
"10036030-8-スケバンA" = "そうだそうだ！"
"10036030-9-スケバンA" = "お前らもそう思わねーか！？"
"10036030-10-スケバン一同" = "ああ！"
"10036030-11-スケバンA" = "いよいよ、ヘルメット団に恨みを晴らす時が来た！"
"10036030-12-スケバンA" = "姐様を侮辱した代償は、きっちり支払わせてやる！"
"10036030-13-スケバンA" = "あいつらが一番盛り上がったタイミングで騒ぎを起こすぞ。"
"10036030-14-スケバンB" = "つーか、あの「教授」って何者なんだ？#n金さえ払えば、絶対に成功する計画を立ててくれるらしいが……。"
"10036030-15-スケバンA" = "ま、ブラックマーケットの情報屋みたいなもんだろ。"
"10036030-16-スケバンA" = "決して表に顔は出さず、音声だけでやりとりをするなんて、#n所詮は臆病者だ。"
"10036030-17-スケバンB" = "うーん、なんか引っかかるような……。"
"10036030-18-スケバンA" = "んなもん、今はどうだって良いだろ！#nそれよか集中しろ！集中！"
"10036030-19-スケバンA" = "いいか、お前ら！#n祭りをぶち壊すぞ！"
"10036030-20-スケバンA" = "おう！"
"10036030-21-スケバンA" = "よし、そんじゃ……！"
"10036030-22-スケバンA" = "……おっと。ちょっと待ってくれ、教授から電話だ。#n計画が完成したのかもしれねぇ。"
"10036030-23-アツコ" = "お財布、見つかった……？"
"10036030-24-アツコ" = "あっ。こっち来て、先生。"
"10036030-25" = "[ns] 岩の影に身を隠す。"
"10036030-26-ミサキ" = "ヒヨリ、押さないで。"
"10036030-27-ヒヨリ" = "い、いろんなところが当たって……。"
"10036030-28" = "[s] \"ご、ごめん……。\""
"10036030-29-ミサキ" = "しっ、サッちゃんに聞こえちゃう。"
"10036030-30-ミサキ" = "サオリ姉さん、どこですか？"
"10036030-31-ミサキ" = "あそこ、見て。"
"10036030-32-ヘルメット団幹部A" = "お越しいただきありがとうございます、DJ B.o.B様！"
"10036030-33-ヘルメット団幹部B" = "これで総連合会の盛り上がりは決まったも同然です！"
"10036030-34-DJ B.o.B" = "はっ、あんだけ頼まれたんじゃ仕方ねぇ。"
"10036030-35-DJ B.o.B" = "それより、金は用意してあんだろうな？"
"10036030-36-ヘルメット団幹部A" = "もちろんです！#nステージが終わり次第、すぐ入金しますので！"
"10036030-37-DJ B.o.B" = "よしよし。#nま、これもブラックマーケットのよしみだ。"
"10036030-38-DJ B.o.B" = "おい、そこのバイト！#n気をつけて運べ！"
"10036030-39-サオリ" = "分かった。"
"10036030-40-DJ B.o.B" = "次はスピーカーだ！"
"10036030-41-DJ B.o.B" = "もし故障でもしたら、弁償してもらうからな？#n命より大事な物だと思え！"
"10036030-42-サオリ" = "……ああ。"
"10036030-43-DJ B.o.B" = "それと、ステージの装飾を左に変えておけ。"
"10036030-44-サオリ" = "さっきは右と言われたが……？"
"10036030-45-DJ B.o.B" = "あぁん！？#nなんか文句でもあんのか？"
"10036030-46-DJ B.o.B" = "ステージがどうなっても知らねぇぞ？"
"10036030-47-ヘルメット団幹部A" = "ど、どうか落ち着いてください！"
"10036030-48-ヘルメット団幹部B" = "さっさと言われた通りにしろ！"
"10036030-49-サオリ" = "……分かった。"
"10036030-50-アツコ" = "……ひどい。"
"10036030-51-アツコ" = "雇い主だからって、ひどすぎる……。"
"10036030-52-ミサキ" = "まさに悪役みたいだね。#n私なら、とっくに撃ってた。"
"10036030-53-ヒヨリ" = "ブラックですね……完全にパワハラです……。"
"10036030-54-ヒヨリ" = "あのままじゃ、ストレスで胃に穴が開いてしまうかもしれません……#nつらいです……苦しいです……。"
"10036030-55" = "[s1] \"うっ、頭が……。\"\n[s2] \"妙に聞き馴染みのある言葉が……。\""
"10036030-56-アツコ" = "何とかしないと。"
"10036030-57-ヒヨリ" = "で、でもサオリ姉さんのことを見守るんじゃなかったんですか？"
"10036030-58-ヒヨリ" = "ここで動いたら、見つかってしまいますよ？"
"10036030-59-ミサキ" = "あんな風につらい思いをしてほしいわけじゃない。"
"10036030-60-ミサキ" = "裏でこっそり手を打とう。"
"10036030-61-ミサキ" = "……優しく、ね。"
"10036030-62-サオリ" = "ふぅ……。"
"10036030-63-サオリ" = "あー、なんか違うな。"
"10036030-64-DJ B.o.B" = "元に戻せ！"
"10036030-65-サオリ" = "ああ……。"
"10036030-66-DJ B.o.B" = "分かったならさっさと動け！"
"10036030-67-DJ B.o.B" = "チッ……護衛だって聞いてたのに、まさかバイトを寄越すとはな。"
"10036030-68-サオリ" = "……。"
"10036030-69-DJ B.o.B" = "少し外す。#n戻ってくるまでに終わらせておけよ。"
"10036030-70-サオリ" = "分かった。"
"10036030-71-DJ B.o.B" = "ふんふふ～ん。"
"10036030-72-DJ B.o.B" = "腹減ったなぁ。"
"10036030-73-DJ B.o.B" = "あとでバイトにラーメンでも買いに行かせるか。"
"10036030-74-DJ B.o.B" = "……あん？"
"10036030-75-DJ B.o.B" = "なんだ、お前ら。"
"10036030-76-DJ B.o.B" = "邪魔なんだよ、さっさと[ruby=ど]退[/ruby]け。"
"10036030-77-アツコ" = "少しお話できますか、DJさん。"
"10036030-78-DJ B.o.B" = "悪いな、サインなら断ってんだよ。"
"10036030-79-DJ B.o.B" = "お、おい。#n誰に銃を向けてると思ってんだ？"
"10036030-80" = "[s] \"ミサキ！優しくって言ってなかった！？\""
"10036030-81-ミサキ" = "これが私にとっての「優しさ」。"
"10036030-82-ミサキ" = "な、何のつもりだ！"
"10036030-83-DJ B.o.B" = "私はDJ B.o.Bだぞ！#nこ、こんなマネをして許されるとでも！？"
"10036030-84-DJ B.o.B" = "――うっ！"
"10036030-85-ミサキ" = "あ、手が滑った。"
"10036030-86-アツコ" = "ミサキ、ダメだよ。#nサッちゃんが頑張ってるステージに必要な人なんだから。"
"10036030-87-ミサキ" = "分かってるけど……こいつ、口の利き方が……。"
"10036030-88-アツコ" = "話せば分かってくれると思う。#nそうですよね、DJさん？"
"10036030-89-DJ B.o.B" = "ナメやがって、こん畜生！"
"10036030-90-DJ B.o.B" = "ぐっ！"
"10036030-91" = "[s] \"アツコ！？\""
"10036030-92-アツコ" = "言い方がムカついちゃって。"
"10036030-93-DJ B.o.B" = "クソッ……。"
"10036030-94-ヒヨリ" = "集団リンチ中に失礼します……。"
"10036030-95-ミサキ" = "……話し合いだよ、ヒヨリ。"
"10036030-96-ヒヨリ" = "その……木の上で見張りをしていたら、こっちに向かっている人の群れが……。"
"10036030-97-ヒヨリ" = "10秒以内には到着するかと……#nとりあえず、設置しておいたブービートラップでも発動しましょうか？"
"10036030-98-ミサキ" = "とりあえず待機しよう。#nヒヨリは元の位置に、姫はこいつの身柄を確保しておいて。"
"10036030-99-ミサキ" = "先生は……。"
"10036030-100" = "[s] \"アツコと一緒にDJを見ておくよ。\""
"10036030-101-ミサキ" = "……うん。"
"10036030-102-DJ B.o.B" = "て、テメェら、容赦し――んぐっ！？"
"10036030-103-アツコ" = "DJさん、少し静かにしていて。"
"10036030-104-ミサキ" = "……来る。"
"10036030-105-スケバンA" = "ははっ！#nホントにDJ B.o.Bがいるとはな！"
"10036030-106-スケバンB" = "高い金を出して計画を練ってもらったんだから、いなきゃ困るぜ。"
"10036030-107-スケバンC" = "ひひっ、これでヘルメット団のお祭りはパーだ！"
"10036030-108-ミサキ" = "お祭りを、どうするつもり？"
"10036030-109-スケバンA" = "あぁん？#n……なんだ？ヘルメットを被ってないみたいだが……"
"10036030-110-スケバンA" = "早くDJを置いてどっか行け！"
"10036030-111-スケバンA" = "ウチらは今から、そこのDJを拉致らなくちゃいけないんだよ！"
"10036030-112-DJ B.o.B" = "んうっっ！？"
"10036030-113-ミサキ" = "……拉致？"
"10036030-114" = "[s] \"拉致！？\""
"10036030-115-ミサキ" = "お祭りを台無しにする気？"
"10036030-116-スケバンA" = "ヘルメット団に復讐すんだよ！"
"10036030-117-スケバンA" = "何とか教授の計画によれば、DJを拉致したらヘルメット団の祭りを妨害できるらしいからな！"
"10036030-118-スケバンA" = "DJには雑用でもやらせるか？"
"10036030-119-スケバンA" = "いや、ウチらのためだけに徹夜でパフォーマンスさせよう！"
"10036030-120-DJ B.o.B" = "んうっっっ……！"
"10036030-121-アツコ" = "……よく分からないけど、させない。"
"10036030-122-アツコ" = "このお祭りのために、サッちゃんが頑張ってるから。"
"10036030-123-アツコ" = "邪魔をするなら、見逃せないよ。"
"10036030-124-スケバンA" = "話が通じねぇな。"
"10036030-125-スケバンA" = "その人数で敵うと思ってるのか？"
"10036030-126-スケバンA" = "お前ら、出てこい！"
"10036030-127-スケバンB" = "痛い目に遭いたくなかったら、さっさと失せろ！"
"10036030-128-ミサキ" = "……分かった。"
"10036030-129-ミサキ" = "その代わり、左に3歩移動してもらえる？"
"10036030-130-スケバンB" = "あぁん？#nまあ、それくらいなら構わねぇけどよ。"
"10036030-131-スケバンB" = "こうか……？"
"10036030-132-ミサキ" = "うん。"
"10036030-133-ミサキ" = "――ヒヨリ、撃って。"
"10036030-134-スケバンB" = "っ！#nそ、狙撃だ！"
"10036030-135-ミサキ" = "アツコ、今！"
"10036030-136-アツコ" = "うん！"
