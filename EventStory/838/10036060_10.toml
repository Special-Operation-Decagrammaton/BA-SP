[translation]
"10036060-1" = "第6話;暗闇からの襲撃者"
"10036060-2" = "（三人には内緒で、再びサオリのもとを訪れた）"
"10036060-3-サオリ" = "先生、何か用か？"
"10036060-4" = "[s] \"ううん、DJステージは順調？\""
"10036060-5-サオリ" = "ああ、もちろんだ。#nちょうどステージ周辺の片付けも終えた。"
"10036060-6-サオリ" = "しかし、少々騒がしくてな……。"
"10036060-7-DJ B.o.B" = "わ、私から一歩も離れるなよ！#nいつ襲われるか気が気じゃないんだ……。"
"10036060-8-護衛のヘルメット団A" = "ここは安全ですから、落ち着いてください。"
"10036060-9-護衛のヘルメット団A" = "護衛の数も増やしましたから。"
"10036060-10-DJ B.o.B" = "ああ、心配だ……。"
"10036060-11-サオリ" = "DJ B.o.Bの護衛を増員したところだ。"
"10036060-12-サオリ" = "そのせいで、会場の外をパトロールする人員が減っている。"
"10036060-13-サオリ" = "これでは……。"
"10036060-14" = "[s] \"何か気になってるの？\""
"10036060-15-サオリ" = "……一部の警備が手薄になってしまう。"
"10036060-16" = "[s] \"私たちで見回りをしようか。\""
"10036060-17-サオリ" = "ああ、助かる。"
"10036060-18-サオリ" = "さっそく向かおう。"
"10036060-19-スケバンA" = "あとは合図を待つだけだな。"
"10036060-20-スケバンA" = "おい！現場はどうなってる？"
"10036060-21-スケバンB" = "……教授の予想通りだ。"
"10036060-22-スケバンB" = "DJが護衛を増やしたことで、会場の外は警備が手薄になってる。"
"10036060-23-スケバンB" = "ははっ。"
"10036060-24-スケバンB" = "まさか、本当にこうなるとはな。"
"10036060-25-スケバンA" = "教授だ。"
"10036060-26-スケバンB" = "最終確認かもしれないな。"
"10036060-27-ニヤニヤ教授" = "皆さん、私です。"
"10036060-28-ニヤニヤ教授" = "準備はよろしいですか？"
"10036060-29-スケバンB" = "ああ、バッチリだ！"
"10036060-30-スケバンB" = "ところで、あの髭ヅラが護衛を増やすって情報は、#nどうやって手に入れたんだ？"
"10036060-31-ニヤニヤ教授" = "DJ B.o.Bは、裏世界で名が知れています。"
"10036060-32-ニヤニヤ教授" = "そこで少し調べたところ、人物像が浮かんできたのです。"
"10036060-33-ニヤニヤ教授" = "臆病な心配性。#n自分の身に何か起きそうになると、ヒステリックになる可能性が高い、と。"
"10036060-34-ニヤニヤ教授" = "そこから、一度目の襲撃を受けてから護衛を増やすであろうことは、#n容易に想像できました。"
"10036060-35-ニヤニヤ教授" = "こうして、警備が手薄になる場所を作ったのです。"
"10036060-36-ニヤニヤ教授" = "何の造作もありませんよ。これはゲームのオープニングのようなもの。"
"10036060-37-ニヤニヤ教授" = "あとは、皆さん次第です。"
"10036060-38-ニヤニヤ教授" = "手薄になった警備を突破し、会場を襲撃。"
"10036060-39-ニヤニヤ教授" = "そうしていけば、ヘルメット団への復讐も叶うでしょう。"
"10036060-40-ニヤニヤ教授" = "少々話が長くなりましたね。#nでは皆さん、健闘を祈っていますよ。"
"10036060-41-スケバンA" = "最初の襲撃は、このためだったのか……。"
"10036060-42-スケバンB" = "まさか、どうせ偶然だろ。"
"10036060-43-スケバンB" = "それより、これでようやく姐様の仇が打てる！"
"10036060-44-スケバンA" = "早くシャバの空気を吸わせてやりてぇな……！"
"10036060-45-スケバンB" = "バカ、なに泣いてんだよ。"
"10036060-46-スケバンB" = "もうすぐ作戦開始だぞ！"
"10036060-47-サオリ" = "どうなっている……？"
"10036060-48-サオリ" = "今の話が本当なら、会場が危ない……！"
"10036060-49-サオリ" = "ヘルメット団のお祭りを守る義理はないが、#nあそこでは今……。"
"10036060-50-サオリ" = "……。"
"10036060-51-サオリ" = "先生、これは私のワガママなんだが……。"
"10036060-52" = "[s] \"みんなの楽しい時間を守ってあげたいんだよね？\""
"10036060-53-サオリ" = "ああ、力を貸してくれ！"
"10036060-54-スケバンチームA" = "こちらチームA、いつでも行ける。"
"10036060-55-スケバンチームB" = "チームB、異常なし。"
"10036060-56-スケバンチームC" = "チームC、準備完了だ。"
"10036060-57-スケバンA" = "よし、完璧だ。"
"10036060-58-スケバンB" = "ついに復讐の時が来た！"
"10036060-59-スケバンB" = "ヘルメット団め、目に物を見せてやる……！"
"10036060-60-スケバンA" = "行くぞ、会場をメチャクチャにしてやれ！"
"10036060-61-スケバンA" = "……聞こえてるか？"
"10036060-62-スケバンA" = "こち……ムC……様……が変……だ。"
"10036060-63-スケバンB" = "音が途切れてるぞ？#nおい、何かあったのか！？"
"10036060-64-スケバンA" = "……。"
"10036060-65-スケバンA" = "（ブツッ）"
"10036060-66-スケバンA" = "どうなってんだ……？"
"10036060-67-スケバンA" = "……！？"
"10036060-68-スケバンA" = "今、変な影が――"
"10036060-69-スケバンA" = "（ブツッ）"
"10036060-70-スケバンA" = "クソッ、回線が……！"
"10036060-71-スケバンB" = "チームB！応答しろ！"
"10036060-72-スケバンA" = "あっちだ！撃て！"
"10036060-73-スケバンA" = "来るぞっ！"
"10036060-74-スケバンA" = "……。"
"10036060-75-スケバンA" = "（ブツッ）"
"10036060-76-スケバンB" = "みんな……？"
"10036060-77-スケバンA" = "どういうことだ……？"
"10036060-78-スケバンB" = "何が起きて――"
"10036060-79-スケバンA" = "ひいっ！#nい、いるなら出てこい！"
"10036060-80-スケバンB" = "落ち着けって、ただの風に決まってる！"
"10036060-81-スケバンA" = "お、おい！一人で行くな！"
"10036060-82-スケバンA" = "！？"
"10036060-83-スケバンA" = "は、反応しろ！"
"10036060-84-スケバンA" = "だ、黙ってないで何か言ってくれ、頼む！"
"10036060-85-スケバンA" = "え……？"
"10036060-86-サオリ" = "……よし。"
"10036060-87-サオリ" = "仲間がやられた時の対策を立てていなかったのか……甘いな。"
"10036060-88-サオリ" = "これも全部、先生の指揮のおかげだ。"
"10036060-89-サオリ" = "礼を言おう。"
"10036060-90" = "[s1] \"ううん、サオリこそお疲れ様。\"\n[s2] \"これで会場は守られたね。\""
"10036060-91-サオリ" = "しかし、なぜスケバンはお祭り会場を狙っているのか……。"
"10036060-92-サオリ" = "理由はどうあれ、好き勝手させるつもりはない。"
"10036060-93-サオリ" = "……もうこんな時間か。"
"10036060-94-サオリ" = "早くステージに戻らなくては！"
"10036060-95-サオリ" = "先生、悪いが……。"
"10036060-96" = "[s] \"うん、いってらっしゃい。\""
"10036060-97-サオリ" = "……また会おう。"
"10036060-98" = "[ns3] \"DJの拉致を阻止したかと思えば……。\"\n[ns4] \"今度は会場の襲撃……。\""
"10036060-99" = "[ns] \"いったい、何が……。\""
"10036060-100" = "[ns] \"お祭り、楽しんでる？\""
"10036060-101-アツコ" = "先生、おかえり。"
"10036060-102-アツコ" = "今、ゲームコーナーを回ってきたところ。"
"10036060-103-ミサキ" = "結果は微妙だったけど。"
"10036060-104-ヒヨリ" = "先生……もう終わりです……。"
"10036060-105-ヒヨリ" = "クジは全部ハズレでしたし……射的も全然ダメでした……。"
"10036060-106-ミサキ" = "やっぱり希望なんてありません……#n幸せなんて、砂のお城みたいに一瞬で崩れるものなんですよね……。"
"10036060-107" = "[s] \"大丈夫だよ、元気出して！\""
"10036060-108-ヒヨリ" = "ですが……。"
"10036060-109" = "[s] \"まだDJステージが残ってるよ！\""
"10036060-110-アツコ" = "……そうだ。"
"10036060-111-アツコ" = "サッちゃんが頑張ってるステージは、これからだった。"
"10036060-112-アツコ" = "始まる前に行こう。"
