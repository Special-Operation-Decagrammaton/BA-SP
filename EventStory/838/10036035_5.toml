[translation]
"10036035-1-ミサキ" = "次。"
"10036035-2-アツコ" = "お祭りの邪魔は、許さない。"
"10036035-3-スケバンA" = "こいつら、タダ者じゃねぇ……！"
"10036035-4-スケバンA" = "ど、どうするよ。逃げるか？"
"10036035-5-スケバンA" = "いや、DJを連れて行かないと……。"
"10036035-6-アツコ" = "そうはさせない。"
"10036035-7-スケバンA" = "くそっ、とりあえず撤退だ！"
"10036035-8-スケバンA" = "お、置いていくな！"
"10036035-9-ミサキ" = "……これで終わり？"
"10036035-10-ヒヨリ" = "はい、敵の撤退を確認しました……。"
"10036035-11" = "[s] \"どうしてスケバンが……。\""
"10036035-12-ミサキ" = "さぁ？いつもみたいに騒いでるだけだと思うけど。"
"10036035-13-ミサキ" = "とりあえず、こいつを連れて行かれなくて良かった。"
"10036035-14-DJ B.o.B" = "んぐっ！"
"10036035-15-DJ B.o.B" = "待たせてごめんね、DJさん。"
"10036035-16-DJ B.o.B" = "ぷはあっ！"
"10036035-17-DJ B.o.B" = "それで、話の続きだけど。"
"10036035-18-DJ B.o.B" = "……なぜ私を助けた？"
"10036035-19-DJ B.o.B" = "てっきり敵なんだとばっかり……。"
"10036035-20-DJ B.o.B" = "違う……ちょっとしたすれ違い。"
"10036035-21-DJ B.o.B" = "あなたがステージの準備中、#n嫌な態度を取ってたから怒っただけ。"
"10036035-22-DJ B.o.B" = "自己中心的だし、高圧的だし、人に当たりすぎ。"
"10036035-23-ヒヨリ" = "そ、そうです……ひどいことは、もうしないでください……。"
"10036035-24-アツコ" = "理不尽な要求や暴言はダメ。"
"10036035-25-DJ B.o.B" = "そう、だな……。"
"10036035-26-DJ B.o.B" = "私が悪かった。"
"10036035-27-DJ B.o.B" = "人気が出て、調子に乗っていたのは事実だ。"
"10036035-28" = "[s] \"すんなり謝るんだ！？\""
"10036035-29-DJ B.o.B" = "危ない目に遭って、DJを志した理由を思い出したんだ……。"
"10036035-30-DJ B.o.B" = "もう、あんな苦労は……。"
"10036035-31-アツコ" = "うん、じゃあ行って良いよ。"
"10036035-32-ミサキ" = "もう良いの？"
"10036035-33-アツコ" = "うん、信じてあげたい。"
"10036035-34-アツコ" = "喧嘩をするために来たわけじゃないから。"
"10036035-35-ミサキ" = "……アツコがそう言うなら。"
"10036035-36-DJ B.o.B" = "あいつらから守ってくれて助かった、感謝する。"
"10036035-37-アツコ" = "……とりあえず、解決かな。"
"10036035-38-アツコ" = "あの人は、約束を守ってくれるはず。"
"10036035-39-サオリ" = "ふぅ……。"
"10036035-40-サオリ" = "次は、ターンテーブルか。"
"10036035-41-DJ B.o.B" = "じょ[ruby=じょうまえ]、錠前さ[/ruby]ん！"
"10036035-42-サオリ" = "戻ってきたか。#n指示通り、セッティングは――"
"10036035-43-DJ B.o.B" = "あ、ありがとう……。"
"10036035-44-DJ B.o.B" = "そ、そうだ。少し休んだらどうだ？#nずっと働いてくれてるだろ？"
"10036035-45-サオリ" = "良いのか……？"
"10036035-46-サオリ" = "細かい部分にまで、こだわりがあるんじゃ……。"
"10036035-47-サオリ" = "何か、あったのか？"
"10036035-48-DJ B.o.B" = "それはそうなんだが……。"
"10036035-49-DJ B.o.B" = "実は、さっき――"
"10036035-50" = "[ns] \"DJさん！\""
"10036035-51-DJ B.o.B" = "ひっ、あなたは……！"
"10036035-52" = "[s] \"DJさんも少し休憩したらどうですか？\""
"10036035-53-DJ B.o.B" = "そそそ、そうですね！#n失礼します！"
"10036035-54-サオリ" = "先生、どうしたんだ？"
"10036035-55-サオリ" = "そんな息を切らして……。"
"10036035-56" = "[s3] \"遠くからサオリを見かけて、つい。\"\n[s4] （ギリギリ間に合って良かった……！）"
"10036035-57-サオリ" = "もしかして……。"
"10036035-58-サオリ" = "みんなに何かあったのか！？"
"10036035-59" = "[s] \"大丈夫、アツコたちはお祭りを楽しんでるよ。\""
"10036035-60-サオリ" = "そうか、なら安心だ。"
"10036035-61-サオリ" = "メインイベントのDJステージにも期待していてくれ。"
"10036035-62-サオリ" = "私も準備を頑張ってきたからな。"
"10036035-63" = "[s] \"何かできることはないかな？\""
"10036035-64-サオリ" = "今のところは……。"
"10036035-65-サオリ" = "……あっ、すまない。#n気を悪くしないでくれ！"
