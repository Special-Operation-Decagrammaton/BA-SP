[translation]
"10036120-1" = "スクワッドがお祭りを楽しむ方法"
"10036120-2" = "（サオリのDJステージが終わったあと……）"
"10036120-3-ヒヨリ" = "ライブ、とても素晴らしかったです！"
"10036120-4-ヒヨリ" = "雑誌の表紙を飾ってもおかしくないくらいでした！"
"10036120-5-サオリ" = "ほ、褒めすぎだ。"
"10036120-6-サオリ" = "……気づいたら終わっていた。#nもう一度やるのは無理だろう。"
"10036120-7-サオリ" = "だが、みんなが楽しんでくれたのなら何よりだ。"
"10036120-8-アツコ" = "うん、楽しかったよ。"
"10036120-9-アツコ" = "私も、ヒヨリも、ミサキも……すごく盛り上がったの。"
"10036120-10-サオリ" = "ミサキも？"
"10036120-11-ミサキ" = "か、勝手に巻き込まないでよ。"
"10036120-12-ミサキ" = "わ、私はただ……場に合わせただけ。"
"10036120-13-ミサキ" = "ふふ、素直じゃないね。"
"10036120-14-アツコ" = "サッちゃんも休憩時間だよね？#nみんなで会場を見て回ろう。"
"10036120-15-アツコ" = "今しか休む時間、なさそうだったから。"
"10036120-16-ミサキ" = "夜のお祭りは、昼と雰囲気が違うよ。"
"10036120-17-アツコ" = "せっかく海に来たんだから、バイトばかりじゃもったいない。"
"10036120-18-サオリ" = "そ、そこまで気にする必要は……。"
"10036120-19-アツコ" = "ダメ。"
"10036120-20-アツコ" = "サッちゃんも一緒に楽しむの。"
"10036120-21-サオリ" = "わ、分かった。"
"10036120-22-サオリ" = "では、あそこのクラゲ水槽エリアはどうだ？"
"10036120-23-ミサキ" = "クラゲ水槽って何……？"
"10036120-24-ヒヨリ" = "で、では、アレなんかどうでしょう……？"
"10036120-25-アツコ" = "「全弾発射！」"
"10036120-26-ミサキ" = "「標的を阻止し……」"
"10036120-27-サオリ" = "「景品をゲットしよう！」"
"10036120-28-アツコ" = "……人、いっぱいだね。"
"10036120-29-ミサキ" = "……あんまり気は乗らないけど。"
"10036120-30-ミサキ" = "人がいっぱいいるし、照明で目がチカチカするし。"
"10036120-31-ヒヨリ" = "……。"
"10036120-32-ヒヨリ" = "そ、そうですよね……#nやっぱり、私たちにゲームをする機会なんて……。"
"10036120-33-ヒヨリ" = "一晩中クラゲの水槽でも眺めてるのがお似合いです……。"
"10036120-34-ヒヨリ" = "お、落ち着け、ヒヨリ。#nミサキは嫌とは言ってない。"
"10036120-35-ミサキ" = "なっ……。"
"10036120-36-サオリ" = "一度やってみるのも悪くないだろう。"
"10036120-37-アツコ" = "うん。みんなと一緒なら、楽しそう。"
"10036120-38-ミサキ" = "……はぁ。"
"10036120-39-ミサキ" = "仕方ないね。"
"10036120-40-ヒヨリ" = "え、えへへ……！"
