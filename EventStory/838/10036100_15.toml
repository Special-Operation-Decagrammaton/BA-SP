[translation]
"10036100-1" = "第10話;Yo DJ Pump This Party"
"10036100-2-ミサキ" = "ステージの修理はこれで終わり。"
"10036100-3-アツコ" = "DJの機材は無事みたい。"
"10036100-4-ヒヨリ" = "か、観客席も準備完了です……！"
"10036100-5-サオリ" = "わざわざ手伝う必要は……。"
"10036100-6-アツコ" = "ううん、お祭りはみんなで楽しむものだからね。"
"10036100-7-ヘルメット団員A" = "準備完了だ！"
"10036100-8-ヘルメット団員A" = "チッ、逃げやがって……。"
"10036100-9-ヘルメット団員A" = "ま、邪魔者は消えたことだし、#nこれで思いっきりDJステージを楽しめるぜ！"
"10036100-10-ヘルメット団員B" = "えっと……そのことなんだけど。"
"10036100-11-ヘルメット団員B" = "DJステージは……中止になった。"
"10036100-12-ミサキ" = "え……？"
"10036100-13-ヘルメット団員B" = "銃撃戦の途中で、DJ B.o.Bがどこかに行ったんだ。"
"10036100-14-ヘルメット団員B" = "「許してくれえええ」って叫びながら……。"
"10036100-15-ヘルメット団員B" = "今頃、どこにいるのかさっぱり分からなくてな。"
"10036100-16-アツコ" = "みんな、DJステージを楽しみにしてたのに……。"
"10036100-17-ヒヨリ" = "……や、やっぱり終わりです！"
"10036100-18-ヒヨリ" = "DJステージなんて贅沢、私たちに許されるわけないんですね！"
"10036100-19-ヒヨリ" = "もう波の音でも聞きながら、砂浜を眺めるしか……。"
"10036100-20-ヒヨリ" = "そのうちに気づいたら波に流されて、どこかの無人島へ……。"
"10036100-21-ヒヨリ" = "「無人島で生き延びる術」の最新号を読んでいれば……！#nうわぁぁぁあああん！"
"10036100-22" = "[s] \"落ち着いて、ヒヨリ。\""
"10036100-23-ヘルメット団員A" = "……シャーレの先生？"
"10036100-24-ヘルメット団員A" = "何か方法でもあるのか？"
"10036100-25" = "[s] \"DJステージを中止する必要はないと思う。\""
"10036100-26-ヘルメット団員B" = "まぁ、機材は揃ってるが……。"
"10036100-27-ヘルメット団員B" = "肝心なDJの人が不在だろ？"
"10036100-28" = "[s] \"それなら心配ないよ。\""
"10036100-29-サオリ" = "先生、どうしたんだ？"
"10036100-30" = "[s] \"ここに、DJ B.o.Bの一番弟子がいるからね！\""
"10036100-31-サオリ" = "！？"
"10036100-32-サオリ" = "ま、まさか私にDJを……！？"
"10036100-33" = "[ns1] 三人にサインを送る。\n[ns2] みんなの顔を見て頷く。"
"10036100-34-ミサキ" = "……！"
"10036100-35-アツコ" = "サッちゃんのDJ、見てみたい。"
"10036100-36-ヒヨリ" = "そ、そうです！#nせっかくのイベントなのに、中止だなんて悲しいじゃないですか……。"
"10036100-37-ミサキ" = "……私も何か言ったほうが良いのかな。"
"10036100-38" = "[s] \"ミサキもDJステージ、楽しみにしてたよね？\""
"10036100-39-ミサキ" = "ちょっ……！"
"10036100-40-ミサキ" = "はぁ……#nまぁ、お祭りのメインイベントだし、中止になったらもったいないでしょ。"
"10036100-41-サオリ" = "しかし……私にDJのステージ経験はない。"
"10036100-42-サオリ" = "みんなに楽しんでもらえるとは……。"
"10036100-43" = "[s] \"大事なのは、楽しませたいっていう気持ちだよ。\""
"10036100-44-サオリ" = "……。"
"10036100-45-サオリ" = "なるほど……。"
"10036100-46-サオリ" = "楽しませたい気持ち、か。"
"10036100-47-サオリ" = "……まだ、よく分からない。"
"10036100-48" = "[s] \"そっか……。\""
"10036100-49-サオリ" = "……ただ。"
"10036100-50-サオリ" = "私は……。"
"10036100-51-サオリ" = "あのステージの感覚を、もう一度感じたいんだ。"
"10036100-52-サオリ" = "やってみようと思う。"
"10036100-53-サオリ" = "いや、必ずやり遂げてみせる。"
"10036100-54-ミサキ" = "リーダーがDJって、想像できないね。"
"10036100-55-ヒヨリ" = "サオリ姉さんが音楽を……。"
"10036100-56-ヒヨリ" = "途中で失敗したら、機材に銃を打ったりしないでしょうか……？"
"10036100-57-アツコ" = "ううん、きっと上手くいく。"
"10036100-58-アツコ" = "サッちゃんは、答えを見つけたみたいだから。"
"10036100-59-司会者" = "さあさあ、大変お待たせいたしました！"
"10036100-60-司会者" = "ここ「アウトロービーチ」は、再び盛り上がってきました！"
"10036100-61-司会者" = "皆さん、準備は良いですか？"
"10036100-62-司会者" = "それでは――ミュージック・スタート！"
"10036100-63" = "#video;11009"
