[translation]
"10036040-1" = "第4話;一人前の焼きそば"
"10036040-2-スケバンA" = "くそっ！#n何なんだあいつら、邪魔しやがって！"
"10036040-3-スケバンA" = "DJを拉致するチャンスだったのによ！"
"10036040-4-スケバンB" = "気にすんな。#nそもそもあんな作戦で、うまくいくワケがなかったんだ。"
"10036040-5-スケバンA" = "そうなのか？"
"10036040-6-スケバンB" = "当たり前だろ。#nあいつがいなくなったくらいで、祭りがめちゃくちゃにはならねぇだろ。"
"10036040-7-スケバンB" = "……教授め、いい加減な計画を寄越しやがって！"
"10036040-8-スケバンA" = "完璧な計画とか言ってなかったか？"
"10036040-9-スケバンB" = "う、うるせぇ！#nいいから教授に連絡しろ！"
"10036040-10-スケバンA" = "分かったよ。"
"10036040-11-スケバンA" = "スケバンの皆さん、計画は順調ですか？"
"10036040-12-スケバンA" = "んなわけあるか！#n邪魔されちまったぞ！"
"10036040-13-スケバンA" = "もっと良い計画はないのか！？"
"10036040-14-スケバンA" = "そう言われましても、困りましたね。"
"10036040-15-スケバンA" = "あなた方の戦力を充分に考慮して、練ったのですが……。"
"10036040-16-スケバンA" = "失敗したのなら、その理由は一つ。"
"10036040-17-ニヤニヤ教授" = "新たなコマがゲームに参戦したのでしょう。"
"10036040-18-ニヤニヤ教授" = "……この情報を活かして、次の作戦を立てれば良いのです。"
"10036040-19-ニヤニヤ教授" = "今のDJには、「規格外の護衛」が付いている可能性が高い。"
"10036040-20-ニヤニヤ教授" = "さらに奇襲を警戒して、ガードが厚くなるはず。"
"10036040-21-ニヤニヤ教授" = "ふふっ。#nこういった状況こそ、私の得意分野です。"
"10036040-22-スケバンA" = "げ、ゲーム……？"
"10036040-23-ニヤニヤ教授" = "例えですよ、例え。"
"10036040-24-スケバンA" = "よく分かんねぇけど、分かった！"
"10036040-25-スケバンA" = "今度こそ大丈夫なんだろうな？"
"10036040-26-ニヤニヤ教授" = "ご安心ください。"
"10036040-27-ニヤニヤ教授" = "犯罪のコンサルタントなら、この「ニヤニヤ教授」にお任せを。"
"10036040-28" = "あなた方の望みが叶うよう、手伝って差し上げましょう。"
"10036040-29-ニヤニヤ教授" = "あなた方の望みが叶うよう、手伝って差し上げましょう。"
"10036040-30-サオリ" = "ふぅ、これでステージのセッティングは完了した。"
"10036040-31-サオリ" = "手伝ってくれて助かった、先生。"
"10036040-32" = "[s1] \"初めて見る機材が多くて新鮮だったよ。\"\n[s2] \"不思議なものが多くて楽しかったよ。\""
"10036040-33-サオリ" = "たしかに、DJの機材に触れる機会はそうないからな。"
"10036040-34-サオリ" = "このターンテーブルだけでも、結構な金額するらしい。"
"10036040-35-サオリ" = "使いこなすには、技術もいるそうだ。"
"10036040-36" = "[s] \"サオリはDJに詳しいんだね。\""
"10036040-37-サオリ" = "仕事を受ける前に、色々と調べたまでだ。"
"10036040-38-サオリ" = "詳しいというほどではない。"
"10036040-39" = "[s3] \"面白そうだね。\"\n[s4] \"私も興味が出てきたよ。\""
"10036040-40-サオリ" = "私が知ってる範囲であれば教えられるが……今は仕事中だ。#nまたDJに呼び出しを受けるかもしれない。"
"10036040-41" = "[s] \"しばらくは大丈夫じゃないかな？\""
"10036040-42-サオリ" = "先生がそう言うのなら……。"
"10036040-43-サオリ" = "軽く説明をしよう。"
"10036040-44-サオリ" = "DJは[ruby=Disc Jockey]ディスクジョッキー[/ruby]の略語で、#n場に合わせた音楽をかけて盛り上げる役割を担う。"
"10036040-45-サオリ" = "2つ以上の音をミックスしたり、加工することによって、#n新しい音を作り出していくんだ。"
"10036040-46-サオリ" = "そしてDJをする上で最も重要なのが、このターンテーブルだ。"
"10036040-47-サオリ" = "レコード盤やCDなどを再生しながら、BPMを調整する。#nほかにもスクラッチという技術があって……。"
"10036040-48-サオリ" = "こう、手で擦ると……"
"10036040-49-サオリ" = "……こんな感じだ。"
"10036040-50" = "[s5] \"すごい！かっこいいね！\"\n[s6] \"プロみたいだよ！\""
"10036040-51-サオリ" = "……あ、ありがとう。"
"10036040-52-サオリ" = "実は仕事が決まってから、#n廃棄されていたターンテーブルを使って少し練習したんだ。"
"10036040-53-サオリ" = "しかし、機材が良いとここまで違うとは……すごく手に馴染む。"
"10036040-54-サオリ" = "BPMを下げて、ピッチを上げれば……。"
"10036040-55-サオリ" = "おぉ、こうなるんだな。"
"10036040-56-サオリ" = "さらにここで、スクラッチを……。"
"10036040-57-サオリ" = "……はっ！？"
"10036040-58-サオリ" = "す、すまない。#nつい夢中になってしまった。"
"10036040-59-サオリ" = "雑談はここまでにして、仕事に戻ろう。"
"10036040-60-サオリ" = "次は立ち見エリアを……。"
"10036040-61-サオリ" = "……。"
"10036040-62" = "[s] \"サオリ、お昼ご飯にしようか？\""
"10036040-63-サオリ" = "そうしたいところだが、まだ仕事が……。"
"10036040-64" = "[s] \"アツコたちも屋台エリアにいるんじゃないかな？\""
"10036040-65-サオリ" = "みんな、美味しい物を食べられているのだろうか……。"
"10036040-66" = "[s] \"心配なら、見に行ってみる？\""
"10036040-67-サオリ" = "……そうだな。#n少し休憩をもらえないか、聞いてこよう。"
"10036040-68" = "[ns] \"……。\""
"10036040-69-サオリ" = "ただいま戻った。"
"10036040-70-サオリ" = "DJ B.o.Bから「好きに食べてくると良い！」と言われたんだが……。"
"10036040-71-サオリ" = "先ほどまでと同じ人物だとは思えないな。"
"10036040-72-サオリ" = "まぁ、許可も降りたことだし大丈夫だろう。"
"10036040-73-サオリ" = "行こう、先生。"
"10036040-74-サオリ" = "屋台エリアも盛り上がっているな。"
"10036040-75-サオリ" = "……美味しそうな匂いがする。"
"10036040-76-サオリ" = "そういえば以前、ヒヨリに焼きそばの味を聞かれたことがあったんだ。"
"10036040-77-サオリ" = "あの時は想像で答えるしかなかったが……。"
"10036040-78-サオリ" = "……先生、こっちだ！"
"10036040-79-ヒヨリ" = "えへへ……屋台がいっぱい……でもどうしましょう。#nもしかしたら、門前払いされる可能性も……！"
"10036040-80-アツコ" = "大丈夫、今日のためにお金を貯めてきたから。"
"10036040-81-アツコ" = "二人は何が食べたい？"
"10036040-82-ミサキ" = "私は特に、この人混みだと食欲もないかな。"
"10036040-83-ヒヨリ" = "や、焼きそばが食べたいです！"
"10036040-84-ヒヨリ" = "昔、サオリ姉さんに焼きそばの味を聞いたことがあるんです！#nなんと、極上の味らしくて……えへへ。"
"10036040-85-ヒヨリ" = "たしか……配給された砂糖の3倍は美味しいって言ってました！"
"10036040-86-ヒヨリ" = "サオリ姉さんがあそこまで言うなら、味は間違いないと思います！"
"10036040-87-ミサキ" = "……。"
"10036040-88-ミサキ" = "せっかくだから、2つで。"
"10036040-89-ヒヨリ" = "あのお店はどうでしょう。#nほかのところよりも空いています。"
"10036040-90-アツコ" = "じゃあ、そこで買おう。"
"10036040-91-屋台の従業員" = "いらっしゃい！"
"10036040-92-屋台の従業員" = "え、えへへ。ついに、私たちも極上の味を……！"
"10036040-93-屋台の従業員" = "こちらがメニューです！"
"10036040-94-アツコ" = "これは……。"
"10036040-95-ミサキ" = "待って。アイスバー1個3000円、焼きそば7000円……？"
"10036040-96-アツコ" = "もしかして……。"
"10036040-97-ヒヨリ" = "高級レストランだったんですね！"
"10036040-98-ミサキ" = "いやいや、屋台でこの値段はおかしいよ。"
"10036040-99-ミサキ" = "普通にボッタクリ。"
"10036040-100-屋台の従業員" = "それは聞き捨てならないな。"
"10036040-101-屋台の従業員" = "「需要と供給」を知らないのか？"
"10036040-102-屋台の従業員" = "考えてみな。#nお祭りの雰囲気でご飯を楽しみたい人は多いだろう？"
"10036040-103-屋台の従業員" = "でもよ、こんな場所まで食材を運んで、#nスタッフを集めるためには、時間もお金も余計にかかってくるわけだ。"
"10036040-104-屋台の従業員" = "だったら、値段がちょ～っとばかし高くなってもおかしくないよな？"
"10036040-105-屋台の従業員" = "……でも、これは高すぎる。"
"10036040-106-屋台の従業員" = "はぁ、嫌なら帰ってくれても構わないぞ。"
"10036040-107-屋台の従業員" = "ちなみに、ウチはこれでも安いほうだ。#nほかの屋台に行けば分かるはずさ。"
"10036040-108-ミサキ" = "そんな……。"
"10036040-109-ヒヨリ" = "か、完全に終わりです……このままじゃ、代金を支払うために怪しい仕事をするしかないんですよね……！"
"10036040-110-ヒヨリ" = "ぬ、布の面積が少ない水着で客引きをしたり……#nい、いかがわしい写真を撮ったり……！"
"10036040-111-アツコ" = "落ち着いて、ヒヨリ。#nお金ならあるから。"
"10036040-112-アツコ" = "痛い出費だけど……せっかくの海だし食べていこう。"
"10036040-113-ミサキ" = "でも予算が……。"
"10036040-114-アツコ" = "お金なら、また稼げば良いよ。#nそれよりも、みんなとの思い出のほうが大事。"
"10036040-115-アツコ" = "……これで焼きそばを1つお願い。"
"10036040-116-屋台の従業員" = "ひひっ、7000円ちょうどだな！"
"10036040-117-サオリ" = "バカな……！"
"10036040-118-サオリ" = "ブラックマーケットでもありえない金額だ！"
"10036040-119-サオリ" = "あんまりだ……。"
"10036040-120" = "[s] \"落ち着いて、サオリ。\""
"10036040-121-サオリ" = "落ち着いてなどいられない。"
"10036040-122-サオリ" = "あの屋台は違法行為をしている。"
"10036040-123-サオリ" = "……ついてきてくれ、先生。"
"10036040-124" = "屋台の厨房・裏側"
"10036040-125-屋台の従業員" = "まさか成功するとはな！"
"10036040-126-屋台の調理師" = "ホントだよ！"
"10036040-127-屋台の調理師" = "ま、どうせ金に余裕あんじゃねーの？"
"10036040-128-屋台の従業員" = "それにしてはボロい財布だったし、あんま持ってなさそうだったぞ？"
"10036040-129-屋台の従業員" = "ま、騙されるほうが悪い。"
"10036040-130-屋台の調理師" = "ほかの屋台では、#n四人組が一杯のラーメンを分け合ってたってよ。"
"10036040-131-屋台の調理師" = "どんだけ金がないんだろうな！"
"10036040-132-屋台の従業員" = "まったく、かわいそうな奴らだ！"
"10036040-133-サオリ" = "話は聞かせてもらった。"
"10036040-134-屋台の調理師" = "誰だ、お前！？"
"10036040-135-サオリ" = "その焼きそば、いくらだ？"
"10036040-136-屋台の従業員" = "7000円だが、文句でもあるのか？"
"10036040-137-サオリ" = "おかしいな。"
"10036040-138-サオリ" = "はぁ？"
"10036040-139-サオリ" = "お前たちは、700円で出店すると事前に申請していたはずだ。"
"10036040-140-サオリ" = "なのに、実際の料金は10倍で設定している。"
"10036040-141-サオリ" = "これは違法だ。"
"10036040-142-屋台の従業員" = "けっ！騙されたほうが悪いんだよ！"
"10036040-143-サオリ" = "いいや、悪いのはお前たちだ。"
"10036040-144-サオリ" = "きちんと謝罪してもらおう。"
"10036040-145-屋台の従業員" = "ゴチャゴチャうるせーな！#nおい、お前たち！"
"10036040-146-屋台の従業員" = "痛い目に遭いたくなかったら、大人しく帰るんだな！"
"10036040-147-サオリ" = "……。"
"10036040-148-サオリ" = "穏便に済ませたかったが、仕方ない。"
"10036040-149-サオリ" = "みんなにはバレないよう、速やかに始末しよう。"
