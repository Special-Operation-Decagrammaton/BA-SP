[translation]
"10036070-1" = "第7話;「彼女」の登場"
"10036070-2-スケバンA" = "いたっ！#n優しくしろよ……。"
"10036070-3-スケバンB" = "薬を塗ってやってるだけ感謝するんだな。"
"10036070-4-スケバンA" = "悪かったって。"
"10036070-5-スケバンA" = "さっき、謎のヘルメットを被った奴に襲われたんだ。"
"10036070-6-スケバンA" = "まだ距離があると思いきや、一瞬で目の前にいて……。"
"10036070-7-スケバンA" = "あんな奴がヘルメット団にいたなんてな……。"
"10036070-8-スケバンB" = "ちくしょう！"
"10036070-9-スケバンA" = "ヘルメット団の総会を潰す計画が台無しだ。"
"10036070-10-スケバンA" = "やれること全部やったってのによぉ！"
"10036070-11-スケバンA" = "……！"
"10036070-12-スケバンA" = "計画通り動いてダメだったなら……。"
"10036070-13-スケバンA" = "私たちのせいじゃないだろ？"
"10036070-14-スケバンA" = "つまり、最初から計画が間違ってたってことか！"
"10036070-15-スケバンA" = "そういうことだ！#nあのニコニコだかニヤニヤとかいう名前の教授が悪い！"
"10036070-16-スケバンA" = "もう一回電話しよう！"
"10036070-17-ニヤニヤ教授" = "おやおや皆さん、どうされたのですか？"
"10036070-18-スケバンA" = "ふざけんなよ！"
"10036070-19-スケバンA" = "最初から協力する気なんてなかったんだろ！"
"10036070-20-スケバンA" = "お前のせいで怪我しただろうが！"
"10036070-21-ニヤニヤ教授" = "はい？"
"10036070-22-ニヤニヤ教授" = "戦力を計算したうえで、勝てると踏んでおりましたが……。"
"10036070-23-スケバンA" = "いい加減な計画を立てやがって！"
"10036070-24-ニヤニヤ教授" = "ほむ、何があったのか聞かせていただいても？"
"10036070-25-ニヤニヤ教授" = "なるほどなるほど、左様でしたか。"
"10036070-26-スケバンA" = "ああ？ナメてんのか？#nお前にいくら払ったと思ってんだ！"
"10036070-27-スケバンB" = "そうだ！#n人が苦労して貯めた金を何だと思ってる！"
"10036070-28-スケバンB" = "たかるのも大変なんだぞ！"
"10036070-29-ニヤニヤ教授" = "最初の拉致作戦も、今回の奇襲も、#n横から邪魔が入るとは……。"
"10036070-30-ニヤニヤ教授" = "計画は完璧だったはず……。"
"10036070-31-ニヤニヤ教授" = "これはこれは、面白くなってきましたねぇ。"
"10036070-32-スケバンA" = "面白がってる場合か？"
"10036070-33-ニヤニヤ教授" = "静かにしていなさい。"
"10036070-34-スケバンA" = "はぁ！？"
"10036070-35-スケバンA" = "先にお前を倒してやっても良いんだぞ！"
"10036070-36-ニヤニヤ教授" = "私に矛先を向けたところで、何も解決しないでしょう。"
"10036070-37-ニヤニヤ教授" = "……ふぅ。#nですが、こうなった以上は認めざるを得ません。"
"10036070-38-ニヤニヤ教授" = "相手は只者ではないでしょう。"
"10036070-39-ニヤニヤ教授" = "おそらく、私の頭脳に匹敵するほどの存在。"
"10036070-40-ニヤニヤ教授" = "とはいえ、まだまだ勝負はこれから。"
"10036070-41-ニヤニヤ教授" = "もうひとつ、ご提案があります。"
"10036070-42-スケバンA" = "……？"
"10036070-43-お祭り案内放送" = "あー、あー、ヘルメット団からお知らせだ！"
"10036070-44-お祭り案内放送" = "DJステージの開催時間が6時に変更された！"
"10036070-45-お祭り案内放送" = "みんな、間違えないようにな！"
"10036070-46-スケバン襲撃組" = "今のアナウンス、もしかしてウチらの影響か？"
"10036070-47-ニヤニヤ教授" = "その通りです。#n皆さんのおかげで、時間をズラすことに成功しました。"
"10036070-48-スケバンA" = "もしかして、最初からこのために！？"
"10036070-49-スケバンA" = "ここまで見越していたのか……！"
"10036070-50-ニヤニヤ教授" = "さぁ、どうでしょう。#n状況は、刻一刻と変わっていくもの。"
"10036070-51-ニヤニヤ教授" = "いずれにせよ、朗報です。#nこれで皆さんの復讐は叶うでしょう。"
"10036070-52-ニヤニヤ教授" = "もっとも、皆さんの手によってではなく、「彼女」によって……ですが。"
"10036070-53-ニヤニヤ教授" = "彼女……？"
"10036070-54-ニヤニヤ教授" = "あれこれ策を弄するよりも、最初から彼女に声をかけるべきでした。"
"10036070-55-ニヤニヤ教授" = "もう、あなた方は結構です。"
"10036070-56-ニヤニヤ教授" = "ご自由になさい。"
"10036070-57-ニヤニヤ教授" = "では、失礼するとしましょう。"
"10036070-58-スケバン襲撃組" = "……どういう意味だ？"
"10036070-59-スケバン襲撃組" = "まったく分からん……。"
"10036070-60-スケバン襲撃組" = "そんで、どうするよ。#nもう諦めて帰るか？"
"10036070-61-スケバン襲撃組" = "教授もああ言ってたし……。"
"10036070-62-スケバン襲撃組" = "ぶっちゃけ、ウチらじゃ勝ち目ないよな……。"
"10036070-63-スケバンA" = "諦めるには早すぎるっ！"
"10036070-64-スケバンA" = "こんくらいで音を上げるな！"
"10036070-65-スケバンA" = "姐様に合わせる顔がなくなるだろっ！？"
"10036070-66-スケバンA" = "忘れたのか？#nあの強靭でたくましい背中を！"
"10036070-67-スケバンA" = "……！"
"10036070-68-スケバンA" = "我ら、泣く子も黙るスケバン！"
"10036070-69-スケバンA" = "姐様の仇は、ウチらが打つ！"
"10036070-70-スケバンA" = "あんな教授のことなんざ知るか！"
"10036070-71-スケバンA" = "スケバンの本気を見せてやるぞ！"
"10036070-72-スケバンA" = "おーっ！"
"10036070-73-スケバンA" = "覚悟がある奴はついてこい！"
"10036070-74-スケバンA" = "めちゃくちゃにしてやる！"
"10036070-75-DJ B.o.B" = "開始まで残り20分だ。#nもう観客が集まってるじゃないか。"
"10036070-76-DJ B.o.B" = "延長した分の時間を巻きで進めるぞ！"
"10036070-77-DJ B.o.B" = "はい！"
"10036070-78-DJ B.o.B" = "音響チェックは済んでるな？"
"10036070-79-DJ B.o.B" = "1分後には本番前の最終確認だ！"
"10036070-80-サオリ" = "忙しそうだな。"
"10036070-81-サオリ" = "うおっ[ruby=じょうまえ]！錠前さ[/ruby]ん！"
"10036070-82-サオリ" = "私も手伝おう。"
"10036070-83-DJ B.o.B" = "だ、大丈夫だ！#nむしろ休んでいてくれ！"
"10036070-84-サオリ" = "そうはいかない。#n引き受けた仕事は最後まで全うする。"
"10036070-85-DJ B.o.B" = "じゃ、じゃあ、ターンテーブルの点検とスピーカーのテストを……。"
"10036070-86-サオリ" = "分かった。"
"10036070-87-DJ B.o.B" = "た、頼んだぞ……！"
"10036070-88" = "[ns] \"サオリ。\""
"10036070-89-サオリ" = "ちょうど良いタイミングだ。#nもう少しでステージが始まる。"
"10036070-90-サオリ" = "みんなはどうしていた？"
"10036070-91-サオリ" = "……そうか、見に来てくれているのだな。#nちょっと待ってくれ。最後の機材チェックを――"
"10036070-92" = "[s] \"私も何か手伝うよ。\""
"10036070-93-サオリ" = "……先生ならそう言うと思っていた。"
"10036070-94-サオリ" = "じゃあ、ステージに上がってきてくれ。"
"10036070-95-ステージの観客A" = "DJステージ、初めて見るんだよね！#nどんな感じなんだろ？"
"10036070-96-ステージの観客B" = "むっちゃ楽しいと思うよ！#n爆音だしテンションも超上がるし！"
"10036070-97-ステージの観客C" = "みんなで盛り上がっていこ！"
"10036070-98-サオリ" = "……多いな。"
"10036070-99" = "[s3] \"こんなに観客がいるんだね。\"\n[s4] \"もう満席なのかな？\""
"10036070-100-サオリ" = "今日は一日中、ステージのために走り回っていたが……。"
"10036070-101-サオリ" = "本番前は、こうも雰囲気が違うとは。"
"10036070-102-サオリ" = "みんな、生き生きしている。"
"10036070-103-サオリ" = "……驚いた。"
"10036070-104-サオリ" = "こんな気持ちは初めてだ。"
"10036070-105-アツコ" = "ふふ、早めに来て良かった。"
"10036070-106-アツコ" = "一番見やすそうな場所だね。"
"10036070-107-ミサキ" = "人混みは苦手なんだけど……。"
"10036070-108-ヒヨリ" = "私、雑誌で見たことがあります！#nDJステージは、お祭りのメインイベントらしいです！"
"10036070-109-ヒヨリ" = "DJステージで盛り上がれる人は、海でモテると……！"
"10036070-110-ミサキ" = "ヘルメット団にモテてどうするの……。"
"10036070-111-アツコ" = "あ、リハーサルが始まるみたい。"
"10036070-112-アツコ" = "見て、サッちゃんもいる。"
"10036070-113-ヒヨリ" = "ど、どこですか？"
"10036070-114-ミサキ" = "ちょっとヒヨリ、そんなにはしゃいだら――"
"10036070-115-ミサキ" = "待って、今なにか音がしなかった？"
"10036070-116-ヒヨリ" = "音、ですか？"
"10036070-117-スケバンA" = "突撃ぃぃぃぃ！"
"10036070-118-スケバンB" = "撃てぇぇぇぇ！"
"10036070-119-ヘルメット団員A" = "す、スケバン！？"
"10036070-120-ヘルメット団員B" = "奇襲だ！"
"10036070-121-スケバンA" = "姐様の仇、打たせてもらうぜ！"
"10036070-122-ヘルメット団員A" = "くっ……。"
"10036070-123-ヘルメット団員A" = "勝てると思ってたのか？"
"10036070-124-ヘルメット団員B" = "こんな人数で来たところで、負けるに決まってるだろ。"
"10036070-125-ヘルメット団員B" = "何を考えてるのやら……。"
"10036070-126-スケバンB" = "くそっ！"
"10036070-127-スケバンB" = "ここまでなのか……。"
"10036070-128-スケバンA" = "姐様、すまねぇ……。"
"10036070-129-ヒヨリ" = "いったい何だったのでしょうか……あの方たちは……？"
"10036070-130-アツコ" = "さっきはDJさんを連れ去ろうとしてたし、何がしたいんだろう。"
"10036070-131-ミサキ" = "……？"
"10036070-132-ミサキ" = "アツコ、ヒヨリ、危ないっ！"
"10036070-133-アツコ" = "きゃっ！？"
"10036070-134-ヒヨリ" = "うわぁああん！？"
"10036070-135-ヘルメット団員" = "ぐはっ！"
"10036070-136-スケバン" = "何が起こってるんだ！？"
"10036070-137-ヘルメット団員B" = "げほ、げほっ！#nスケバンめ、ロケットランチャーまで持ってきやがって……！"
"10036070-138-スケバンB" = "そ、そんなもん持ってきてねぇ！"
"10036070-139-ヘルメット団員B" = "じゃあ、いったい誰が……。"
"10036070-140" = "[ns] \"アレは……！？\""
"10036070-141-アケミ" = "うふふふふっ、お久しぶりですわね。#nヘルメット団の皆さん。"
"10036070-142-アケミ" = "毎日毎日、心配でしたわ。"
"10036070-143-アケミ" = "皆さん、元気に過ごされていたかしら？"
"10036070-144-アケミ" = "そうでなければ――困ってしまいますわ。"
"10036070-145-アケミ" = "だって――ずうっと、楽しみにしていたんですもの。"
"10036070-146-？？？" = "――アンタたちに復讐する日をねぇ！"
