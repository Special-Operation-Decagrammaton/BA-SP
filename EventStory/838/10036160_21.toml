"10036160-42-アツコ" = "まだまだこれからだよ、サッちゃん。"
"10036160-43-ミサキ" = "そ、そうですね！#nやりたいことは、いっぱいありますから！"
"10036160-44-ヒヨリ" = "ミサキさんも、そうですよね？"
