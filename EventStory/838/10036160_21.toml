"10036160-17-ヒヨリ" = "ほ、本当にこれが良いんです……。"
"10036160-18-ヒヨリ" = "雑誌は、またすぐ最新号が出ますけど……。"
"10036160-19-ヒヨリ" = "みんなでプリントシールを撮る機会は、#nもうないかもしれませんし……。"
"10036160-20-ヒヨリ" = "それに、雑誌なら先生がたまにくれますから……えへへ。"
"10036160-21-ミサキ" = "買ってもらってるだけでしょ……。"
"10036160-22-アツコ" = "ヒヨリ……。"
