[translation]
"10036110-1" = "エピローグ"
"10036110-2-サオリ" = "ふぅ。"
"10036110-3-サオリ" = "ステージが撤去されると、ずいぶん寂しくなったな。"
"10036110-4" = "[ns] \"おはよう、サオリ。\""
"10036110-5-サオリ" = "みんな……。"
"10036110-6-アツコ" = "サッちゃんは散歩中？"
"10036110-7-サオリ" = "あ、ああ……昨日のことを振り返っていたところだ。"
"10036110-8-サオリ" = "ステージに立っていたことが、いまだに信じられなくてな。"
"10036110-9-サオリ" = "……おかしくなかったのなら良いんだが。"
"10036110-10" = "[s1] \"すごく楽しかったよ！\"\n[s2] \"はしゃぎすぎて筋肉痛になったくらい！\""
"10036110-11-ヒヨリ" = "そ、そうですよ……雑誌で見た通りのイベントでした！"
"10036110-12-ミサキ" = "まぁ、悪くなかったよ。"
"10036110-13-アツコ" = "私も楽しかった。#nサッちゃんには、あんな才能があったんだね。"
"10036110-14-サオリ" = "さ、才能というわけでは……せっかくだ、少し歩こうか。"
"10036110-15-アツコ" = "静かだね……昨日の盛り上がりが嘘みたい。"
"10036110-16-アツコ" = "お祭りの施設も撤去されて、少し寂しいね。"
"10036110-17-ヒヨリ" = "そう、ですね……。"
"10036110-18-サオリ&アツコ&ミサキ&ヒヨリ" = "……。"
"10036110-19-アツコ" = "波の音に、眩しい陽射し……。"
"10036110-20-アツコ" = "誰もいない海って、こんな感じだったんだ。"
"10036110-21-ミサキ" = "早起きした甲斐があったね。"
"10036110-22-ミサキ" = "それでリーダー、悩みは解決した？"
"10036110-23-サオリ" = "な、何のことだ？"
"10036110-24-ミサキ" = "……はぁ。"
"10036110-25-ミサキ" = "何かに悩んでる時は、よくこうやって散歩してたでしょ。"
"10036110-26-ミサキ" = "それくらい、知ってるから。"
"10036110-27-サオリ" = "そ、そうか……。"
"10036110-28-アツコ" = "ふふっ。慌ててるサッちゃんも、可愛いね。"
"10036110-29-ミサキ" = "……まだ旅を続けるつもり？"
"10036110-30-ヒヨリ" = "自分探し、ですか？"
"10036110-31-サオリ" = "……そうだ。"
"10036110-32-サオリ" = "でも……今までとは少し、違うかもしれない。"
"10036110-33-サオリ" = "前は暗闇の中を走っているような気分だったが……。"
"10036110-34-サオリ" = "ほんの僅かに光が見えた気がする。"
"10036110-35-サオリ" = "だから、もうしばらく旅を続けてみようと思う。"
"10036110-36-サオリ" = "みんなには、申し訳ないと思っている……。"
"10036110-37-ミサキ" = "今さら謝る必要なんてないでしょ。"
"10036110-38-アツコ" = "サッちゃんのこと、応援してるから。#n私たちのことは心配しないで。"
"10036110-39-ヒヨリ" = "た、たまには連絡してくださいね……。"
"10036110-40-サオリ" = "……ありがとう、みんな。"
"10036110-41-サオリ" = "それと、先生も。"
"10036110-42" = "[s3] \"私も応援してるよ。\"\n[s4] \"何かあったら、いつでも呼んで。\""
"10036110-43-サオリ" = "ありがとう……。"
"10036110-44-ミサキ" = "……ここでお別れ、かな。"
"10036110-45-サオリ" = "……あぁ、先に行ってくれ。#n今度は私が見送ろう。"
"10036110-46-ミサキ" = "気をつけてくださいね、サオリ姉さん……。"
"10036110-47-ミサキ" = "……怪我だけはしないで。"
"10036110-48-アツコ" = "またね、サッちゃん。"
"10036110-49-サオリ" = "……。"
"10036110-50" = "[s] \"サオリ、元気出して。\""
"10036110-51-サオリ" = "あの子たちは、もう行ったか？"
"10036110-52" = "[s] \"……ん？\""
"10036110-53-サオリ" = "みんなの前では伏せていたが……。"
"10036110-54-サオリ" = "……実は、バイト代をもらっていないんだ。"
"10036110-55" = "[s] \"え……？\""
"10036110-56-サオリ" = "ヘルメット団……やはり侮れないな。#nここまでキヴォトスで勢力を伸ばしただけはある。"
"10036110-57-サオリ" = "以前、先生は言っていた。#n仕事を続けていれば、色々なトラブルに巻き込まれる、と。"
"10036110-58-サオリ" = "些細な問題であれば目をつぶってやっていたが……。"
"10036110-59-サオリ" = "給料の未払いだけは、許してはならない！"
"10036110-60-サオリ" = "そこで頼みがあるんだが……。"
"10036110-61" = "[s] \"任せて、サオリ！\""
"10036110-62-サオリ" = "感謝する、先生。"
"10036110-63-サオリ" = "では、ヘルメット団の追撃を開始する！"
"10036110-64" = "（サオリの夏は、まだまだ続く！）"
"10036110-65" = "Sheside outside"
