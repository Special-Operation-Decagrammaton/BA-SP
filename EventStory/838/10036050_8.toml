[translation]
"10036050-1" = "第5話;ヘルメット団水鉄砲大会"
"10036050-2-サオリ" = "ただいま戻った。"
"10036050-3-サオリ" = "あっ[ruby=じょうまえ]、錠前さ[/ruby]ん！"
"10036050-4-サオリ" = "おかげでゆっくりできた、礼を言おう。"
"10036050-5-サオリ" = "次の仕事は……。"
"10036050-6-DJ B.o.B" = "だ、大丈夫だ！#nゆっくりしていてくれ！"
"10036050-7" = "[ns] （さっきの印象が強かったのかな……）"
"10036050-8-サオリ" = "いや、給料をもらっている以上、#n何もしないわけにはいかない。"
"10036050-9-サオリ" = "ステージ近くの掃除でも……"
"10036050-10-？？？" = "そこの君、手が空いてるのか？"
"10036050-11-ヘルメット団員" = "ちょっと助けてほしいんだ！"
"10036050-12-ヘルメット団員" = "実は人手が足りなくてな。"
"10036050-13-DJ B.o.B" = "すまない。"
"10036050-14-DJ B.o.B" = "ここを離れるわけには……。"
"10036050-15-DJ B.o.B" = "いやいや、私のことは気にしなくて良いぞ！#n行ってきなさい！"
"10036050-16-DJ B.o.B" = "ほ、本当に良いのか……？"
"10036050-17-DJ B.o.B" = "もちろんだ！"
"10036050-18-サオリ" = "私にできることがあれば手伝いたいのだが……。"
"10036050-19-ヘルメット団員" = "そういえば、何をするのか説明してなかったな。#n実は水鉄砲大会に出てもらいたいんだ！"
"10036050-20" = "[ns] \"面白そうだね。\""
"10036050-21-サオリ" = "先生もそう言うのなら……。"
"10036050-22-サオリ" = "分かった、すぐ行こう。"
"10036050-23" = "[ns] （三人のところへ行ってみよう……）"
"10036050-24-アツコ" = "あっ、先生。"
"10036050-25-アツコ" = "どこ行ってたの？#nお昼、一緒に食べたかったのに。"
"10036050-26" = "[s1] \"ちょっと事情があって。\"\n[s2] \"ちょっと用事ができて。\""
"10036050-27-アツコ" = "ざ、残念です……実は、さっき何かに当選して……#n食べ物をたくさん頂いたんです。"
"10036050-28-ヒヨリ" = "先生も、あの場にいらしたら……。"
"10036050-29" = "[s] \"大丈夫だよ、私も食べてきたから。\""
"10036050-30-アツコ" = "じゃあ、またサッちゃんの様子を見に行こう。"
"10036050-31-アツコ" = "どうせまだステージの準備中でしょ。"
"10036050-32-アツコ" = "あーあー、こほん！#nヘルメット団からのお知らせだ！"
"10036050-33-アツコ" = "このあと、ビーチの競技場で各支部のチャンピオンを競う「水鉄砲大会」が開催される！"
"10036050-34-アツコ" = "盛り上がること間違いなし！#n揃って見に来てくれ！"
"10036050-35-アツコ" = "以上で放送を終了する！"
"10036050-36" = "[ns] （なら、サオリはビーチに……）"
"10036050-37-ミサキ" = "水鉄砲大会……？"
"10036050-38-アツコ" = "実弾は使わないのかな。"
"10036050-39" = "[s] \"私たちも見に行こう！\""
"10036050-40-ヒヨリ" = "あれ、サオリ姉さんのところに行くんじゃないんですか？"
"10036050-41-ヒヨリ" = "呑気に大会なんて見ていても、良いんですかね……。"
"10036050-42" = "[s] \"もしかしたら、サオリもいるんじゃないかな。\""
"10036050-43-アツコ" = "たしかに……。"
"10036050-44-アツコ" = "みんな、会場に向かってるね。"
"10036050-45-司会者" = "現在、アウトロービーチにはヘルメット団が勢揃いです！"
"10036050-46-司会者" = "観客も続々と集まってきましたね。"
"10036050-47-司会者" = "皆さん、盛り上がっていますか！？"
"10036050-48-司会者" = "今日、最強のヘルメット団が決定します！"
"10036050-49-司会者" = "さあ、最後に立っているのは誰なのか！？"
"10036050-50-司会者" = "これより、水鉄砲大会の開幕です――！"
"10036050-51-パタパタヘルメット団幹部" = "お前ら、よく聞けよ。"
"10036050-52-パタパタヘルメット団幹部" = "ウチらパタパタヘルメット団は、何もしなくて良い。"
"10036050-53-パタパタヘルメット団幹部" = "分かったな？"
"10036050-54-パタパタヘルメット団A" = "分かってるって。"
"10036050-55-パタパタヘルメット団A" = "（どうしてこんな状況に……）"
"10036050-56-パタパタヘルメット団幹部" = "まあ、どうせ結果は決まってるからな。"
"10036050-57-サオリ" = "それはどういう意味だ？"
"10036050-58-パタパタヘルメット団幹部" = "……ん？"
"10036050-59-パタパタヘルメット団幹部" = "えーと、呼ばれた時に聞いてなかったのか？"
"10036050-60-サオリ" = "……。"
"10036050-61-サオリ" = "ああ。"
"10036050-62-サオリ" = "もちろん任せてくれ。"
"10036050-63-サオリ" = "全力で行こう。"
"10036050-64-パタパタヘルメット団幹部" = "……は？"
"10036050-65-司会者" = "ルールは簡単！"
"10036050-66-司会者" = "この水鉄砲を使って……え？本物に見えるって？#nどう見ても水鉄砲じゃないか！"
"10036050-67-司会者" = "ともかく、これを使って最後まで立っていたチームが優勝です！"
"10036050-68-司会者" = "それでは各自、スタート位置へ移動してください！"
"10036050-69-ヒヨリ" = "うわっ……人が多すぎます……！"
"10036050-70-アツコ" = "こんなにたくさんの人が……。"
"10036050-71-ミサキ" = "ヘルメット団のほとんどが来てるんじゃない？"
"10036050-72-ヒヨリ" = "ど、どこか高いところに……#nあっ、先生、ちょっと良いですか……？"
"10036050-73" = "[s3] \"おんぶで大丈夫？\"\n[s4] \"落ちないように気をつけてね。\""
"10036050-74-ヒヨリ" = "え、えへへ……#nせっかくなので、肩車をしていただけませんか……？"
"10036050-75" = "[s5] \"うん、分かった。\"\n[s6] ヒヨリを肩に乗せる。"
"10036050-76-ヒヨリ" = "えへへ……高いですね、特等席です……！"
"10036050-77-ヒヨリ" = "なんだかズルしてるような気も……。"
"10036050-78-ヒヨリ" = "……あれ？"
"10036050-79-アツコ" = "どうかした？"
"10036050-80-ヒヨリ" = "「パタパタヘルメット団」の旗を見てください！"
"10036050-81-ヒヨリ" = "すぐ下に、サオリ姉さんが……！"
"10036050-82-アツコ" = "……本当だ。"
"10036050-83-ミサキ" = "今度はどうしてこんなところに……。"
"10036050-84-ミサキ" = "サオリ姉さん、目が怖いです……#n完全にリーダーの目をしています……！"
"10036050-85-アツコ" = "サッちゃん、大会に参加したんだね。"
"10036050-86-アツコ" = "……楽しんでるみたいで、良かった。"
"10036050-87-ミサキ" = "楽しんでる……のかな？"
"10036050-88-ヒヨリ" = "サオリ姉さん、勝てるんでしょうかね……？"
"10036050-89-ミサキ" = "まぁ、ヘルメット団が相手なら心配ないと思うけど……。"
"10036050-90-ミサキ" = "相手の数によるかな。"
"10036050-91-アツコ" = "もし負けちゃっても……。"
"10036050-92-アツコ" = "サッちゃんが楽しめたなら、それで良いと思う。"
"10036050-93-野次馬のヘルメット団A" = "なんか盛り上がってるなぁ。#n結果なんて決まりきってるのによ。"
"10036050-94-野次馬のヘルメット団B" = "本当だぜ、まったくよ。"
"10036050-95-野次馬のヘルメット団A" = "「トゲトゲヘルメット団」が勝つことになってんだよな？"
"10036050-96-野次馬のヘルメット団A" = "みんな知ってると思ってたぜ。"
"10036050-97-野次馬のヘルメット団B" = "ま、こういう雰囲気は嫌いじゃないし放っておくか。"
"10036050-98" = "[ns] \"ヤラセ……？\""
"10036050-99-アツコ" = "……見過ごせない。"
"10036050-100-ヒヨリ" = "サオリ姉さん、あんなに頑張ってるのに、ひどいです……！"
"10036050-101-ミサキ" = "……リーダーに知らせないと。"
"10036050-102-ヒヨリ" = "え、えへへ……#n先生、私はもう少し肩車をしてもらっても良いですか？"
"10036050-103-サオリ" = "よーい……。"
"10036050-104-司会者" = "スタート！"
"10036050-105-サオリ" = "ふっ！"
"10036050-106-デコボコヘルメット団A" = "は、早い！"
"10036050-107-デコボコヘルメット団A" = "なんだアイツ！？"
"10036050-108-サオリ" = "次！"
"10036050-109-サオリ" = "こっちだぜ！"
"10036050-110-びりびりヘルメット団" = "なっ！？"
"10036050-111-びりびりヘルメット団" = "うわっ！"
"10036050-112-サオリ" = "ど、どうなってるんだ？"
"10036050-113-サオリ" = "台本と違うぞ……。"
"10036050-114-サオリ" = "スタッフ！スタッフはいないのか！？"
"10036050-115-びしょびしょヘルメット団" = "話が違うだろ！"
"10036050-116-びしょびしょヘルメット団" = "チッ！#nしゃあない、アイツを倒すしかねぇ！"
"10036050-117-デコボコヘルメット団" = "もしかして、ヤラセがバレないよう演技してるのか？"
"10036050-118-びりびりヘルメット団" = "知るか！#nとりあえず倒すぞ！"
"10036050-119-サオリ" = "数で押し込むのは良い作戦だが……。"
"10036050-120-サオリ" = "支部同士の争いなんじゃなかったか？"
"10036050-121-ヘルメット団一同" = "やれ――！"
"10036050-122-びしょびしょヘルメット団" = "うわっ！？"
