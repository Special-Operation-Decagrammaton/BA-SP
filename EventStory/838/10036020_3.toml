[translation]
"10036020-1" = "第2話;スクワッドの事情"
"10036020-2-アツコ" = "わがままを聞いてくれてありがとう。#n先生のおかげで、遠くまで来れた。"
"10036020-3-アツコ" = "こんな場所があったんだね。"
"10036020-4-アツコ" = "こうして人目につく場所を歩くのは、まだ慣れないかも。"
"10036020-5-アツコ" = "まるで、別世界に来たみたい。"
"10036020-6-ヒヨリ" = "わ、私たち、こんな幸せで良いんでしょうか……？"
"10036020-7-ヒヨリ" = "じ、実はこのビーチがヴァルキューレの罠だったりして……！"
"10036020-8-ヒヨリ" = "お祭りは嘘で、本当は犯罪者を一掃するための計画だったり……！？"
"10036020-9-ヒヨリ" = "終わりです！このままじゃ矯正局送りです！#n牢屋入りになってしまいます……！"
"10036020-10-ヒヨリ" = "先生が買ってくれたアイスが、最後の晩餐に……！"
"10036020-11" = "[s] \"お、落ち着いて、ヒヨリ。\""
"10036020-12-ミサキ" = "ここでヘルメット団主催のお祭りが開かれるのは間違いないよ。"
"10036020-13-ミサキ" = "正確には「ヘルメット団総連合会」って言うらしいけど……規模も大きいし、色々と手が込んでる。"
"10036020-14-ミサキ" = "ヴァルキューレに、これほど大掛かりな罠を用意できるとは思えないかな。"
"10036020-15-ヒヨリ" = "そ、そうなんですか？#nじゃあ、安心して良いんですね？"
"10036020-16-ミサキ" = "……まぁ、とりあえずはね。"
"10036020-17-アツコ" = "先生が一緒にいてくれるなら、大丈夫。"
"10036020-18-アツコ" = "そうでしょ、先生？"
"10036020-19" = "[s] \"もちろん。\""
"10036020-20-アツコ" = "ふふっ、頼もしいね。"
"10036020-21" = "[s1] \"みんなでお祭り楽しもうね。\"\n[s2] \"アツコも、ヒヨリも、ミサキも。\""
"10036020-22-アツコ" = "いろんな写真を、いっぱい撮りたいな。"
"10036020-23-ヒヨリ" = "え、えへへ、私は海の家で焼きそばと焼きトウモロコシを……#nあ、デザートにかき氷も食べたいです……。"
"10036020-24-ミサキ" = "騒がしい場所はあんまり好きじゃないし、#nお祭りには興味ないけど……"
"10036020-25-ミサキ" = "アツコとヒヨリがそうしたいなら、付き合うよ。"
"10036020-26-ミサキ" = "海の家のほかにも、砂のお城大会、水鉄砲大会……#nあと、DJステージも準備されてるんだって。"
"10036020-27" = "[s] \"興味ないと言いつつ、結構詳しいね……？\""
"10036020-28-ミサキ" = "今は臨時のリーダーだから。ちょっと調べただけ。"
"10036020-29-ミサキ" = "……なに笑ってるの、アツコまで。"
"10036020-30-アツコ" = "ふふっ、ミサキも楽しもうね。"
"10036020-31-ミサキ" = "くっ……！"
"10036020-32" = "[s3] \"じゃあ、軽く見て回ろうか？\"\n[s4] \"まずは会場を一周してみよう。\""
"10036020-33-アツコ" = "うん、行こう。"
"10036020-34-ヒヨリ" = "えへへ、楽しみですね……。"
"10036020-35-ミサキ" = "……はぁ。"
"10036020-36-アツコ" = "美味しそうな匂いがするね。"
"10036020-37-アツコ" = "先生、何か食べる？"
"10036020-38" = "[s] \"うん、ミサキとヒヨリはどうする？\""
"10036020-39-ヒヨリ" = "わ、私も食べます！#nえへへ、やっと美味しいご飯を……。"
"10036020-40-ミサキ" = "……待って。"
"10036020-41-アツコ" = "どうしたの、ミサキ。"
"10036020-42-ミサキ" = "……間違いない。"
"10036020-43-ミサキ" = "あそこ、見て……！"
"10036020-44-サオリ" = "注文したトーストと目玉焼きだ。#nさっさと……いや、ごゆっくりどうぞ。"
"10036020-45-客A" = "おい、注文と違うじゃねーか。#n半熟っつったろーがよ！"
"10036020-46-客A" = "こんなん食べてられっかよ！"
"10036020-47-サオリ" = "す、すまない。すぐに新しい物を持ってくる！"
"10036020-48-客A" = "すいませーん。#n注文してから30分も経ってるんですけど、まだですか……？"
"10036020-49-客A" = "もう少し待ってくれ！"
"10036020-50-サオリ" = "これ、頼んだ覚えないんすけど……。"
"10036020-51-サオリ" = "す、すまない……！"
"10036020-52-アツコ" = "サッちゃんだ……。"
"10036020-53-ヒヨリ" = "サオリ姉さんが、どうしてここに……？"
"10036020-54" = "[s] \"サオリ……？\""
"10036020-55-ミサキ" = "……。"
"10036020-56-ミサキ" = "あんなところで何してんの……。"
"10036020-57-ミサキ" = "サオ――"
"10036020-58-ミサキ" = "――っ！？"
"10036020-59-ミサキ" = "しっ、二人とも静かに。#nこっち来て。"
"10036020-60-ミサキ" = "先生も。"
"10036020-61" = "[ns5] \"どうしたの？\"\n[ns6] \"サオリに声かけないの？\""
"10036020-62-アツコ" = "……邪魔しちゃ、ダメだと思う。"
"10036020-63-アツコ" = "サッちゃんは今、自分探し中だから。"
"10036020-64-ミサキ" = "振り回されてるようにしか見えないですけど……。"
"10036020-65-ミサキ" = "……。"
"10036020-66-アツコ" = "サッちゃんなりに頑張ってるんだと思う。"
"10036020-67-アツコ" = "ああやって働くのも、きっと大事だから。"
"10036020-68-アツコ" = "今はサッちゃんの邪魔しないようにしよう。"
"10036020-69-ミサキ" = "でも、挨拶くらいはしても良いんじゃないですか……？"
"10036020-70-アツコ" = "ううん。#nサッちゃんは優しいから、私たちがいるって知ったら色々と気を遣うと思う。"
"10036020-71-アツコ" = "だから、今は遠くから見守りたい。"
"10036020-72-ミサキ" = "そ、そうですね……サオリ姉さん、すごく忙しそうですし……。"
"10036020-73-ミサキ" = "……まぁ、気を遣わせたら悪いし。"
"10036020-74-アツコ" = "先生はどう思う？"
"10036020-75" = "[s] \"たしかに、サオリは気を遣うかもしれないね。\""
"10036020-76-アツコ" = "ふふっ、秘密作戦みたい。"
"10036020-77-アツコ" = "せっかくだから、サッちゃんの働く姿、撮っておこうかな。"
"10036020-78-ミサキ" = "リーダーにバレないようにするんじゃなかったの？"
"10036020-79-アツコ" = "大丈夫。#nこうやって、ズームすれば……。"
"10036020-80" = "[s] \"見つからないかな……？\""
"10036020-81-アツコ" = "ふふ、良い写真が撮れそう。"
"10036020-82-アツコ" = "はい、チーズ。"
"10036020-83-アツコ" = "サッちゃんの仕事姿……ふふっ。"
"10036020-84-ヒヨリ" = "み、見つかったら、サオリ姉さんに怒られるんじゃ……。"
"10036020-85-ミサキ" = "その時はその時、だよ。"
"10036020-86-アツコ" = "ちゃんと撮れてるかな……？"
"10036020-87-アツコ" = "良かった、ちゃんと撮れてる。"
"10036020-88-ヒヨリ" = "よく撮れてます……。"
"10036020-89-ミサキ" = "古いけど、それなりに使えるんだね。"
"10036020-90-アツコ" = "うん。このカメラ、海に行くことが決まってから、#n頑張ってお金を貯めてブラックマーケットで買ったの。"
"10036020-91-アツコ" = "ちゃんと動いてくれて、良かった。"
"10036020-92-ヒヨリ" = "ビーチの写真を残すなんて、私たちにはもったいない贅沢ですね……。"
"10036020-93-アツコ" = "じゃあ、そろそろ行こっか。"
"10036020-94-アツコ" = "あんまり長居したら、サッちゃんに見つかっちゃう。"
"10036020-95-ミサキ" = "そうだね。"
"10036020-96-ヒヨリ" = "は、はい……！"
"10036020-97-アツコ" = "……先生。"
"10036020-98" = "[s] \"うん？\""
"10036020-99-アツコ" = "……サッちゃんの力になってあげたいんだ。"
"10036020-100-アツコ" = "せっかくなら、お祭りを楽しんでほしいから。"
"10036020-101-アツコ" = "いつも頑張って、苦労してるところを見てきたから……#n今日は私が、サッちゃんの夏を守りたいの。"
"10036020-102-アツコ" = "うん……サッちゃんはズッ友だから。"
"10036020-103" = "[s] \"ず、ズッ友……？\""
"10036020-104-アツコ" = "うん、「ずっと友だち」って意味らしいよ。"
"10036020-105-アツコ" = "だから先生、助けてくれる？"
"10036020-106" = "[s] \"もちろんだよ。\""
"10036020-107-アツコ" = "ありがとう……先生ならそう言ってくれると思ってた。"
"10036020-108-アツコ" = "行こう、ミサキたちが待ってる。"
"10036020-109" = "（その後、アツコたちと一緒にお祭り会場を回っていると……）"
"10036020-110" = "（途中で財布を落としてしまった）"
"10036020-111" = "[ns] \"たしか、この辺で落としたような……。\""
"10036020-112" = "[ns] \"どこだろう……。\""
"10036020-113-？？？" = "探し物はコレか？"
"10036020-114" = "[s] \"あっ。\""
"10036020-115-サオリ" = "これから届けにいこうと思っていたところだが――"
"10036020-116-サオリ" = "持ち主なら、ちょうど良か……なっ！"
"10036020-117" = "[ns] \"さ、サオリ！？\""
"10036020-118-サオリ" = "[USERNAME]先生がどうしてここに！？"
"10036020-119" = "[s] \"す、少し事情があってね。\""
"10036020-120-サオリ" = "もしかして、今日もパトロールか？"
"10036020-121-サオリ" = "相変わらず、先生は忙しそうだな。"
"10036020-122-サオリ" = "しかし……まさか会えるとは思わなかった。"
"10036020-123" = "[s] \"そうだね、サオリも元気にしてた？\""
"10036020-124-サオリ" = "ああ、おかげさまでな。"
"10036020-125-サオリ" = "先生に教わった通り、最近は色々な仕事に挑戦している。"
"10036020-126-サオリ" = "「アウトロービーチ」に来たのも、その一環だ。"
"10036020-127-サオリ" = "ところで――"
"10036020-128-サオリ" = "……！"
"10036020-129-サオリ" = "先生、隠れるぞ！"
"10036020-130-サオリ" = "……こちらには気づかなかったようだな。"
"10036020-131-サオリ" = "急に引っ張って、すまなかった。"
"10036020-132" = "[s7] （アツコたちも来ていると知ってしまった……）\n[s8] \"挨拶しなくて良いの……？\""
"10036020-133-サオリ" = "アツコ、ミサキ、ヒヨリ……久しぶりだな。"
"10036020-134-サオリ" = "本当は、会って話をしたかったが……"
"10036020-135-サオリ" = "……今の私に、そんな資格はない。"
"10036020-136" = "[s] \"……。\""
"10036020-137-サオリ" = "先生は、「資格なんて必要ない」とでも言うだろう。"
"10036020-138-サオリ" = "だが……まだ心の準備ができていない。"
"10036020-139-サオリ" = "どんな顔で会えば良いのか……。"
"10036020-140-サオリ" = "きっと、アツコたちは迎え入れてくれるだろう。"
"10036020-141-サオリ" = "でも、それに甘えてはいけないと思っている。"
"10036020-142-サオリ" = "だから……今はまだ会えない。"
"10036020-143-サオリ" = "……もちろん、これは私の[ruby=わがまま]我儘[/ruby]だ。"
"10036020-144-サオリ" = "すまない、先生。"
"10036020-145" = "[s] \"サオリ……。\""
"10036020-146-サオリ" = "……先生。#n厚かましいのは承知のうえで、ひとつ頼みがある。"
"10036020-147" = "[s] \"頼み？\""
"10036020-148-サオリ" = "みんなは海を初めて見るはずだ。"
"10036020-149-サオリ" = "少なくとも、アリウスにいた頃に見る機会はなかったからな。"
"10036020-150-サオリ" = "だから、この時間を楽しんでもらいたい。"
"10036020-151-サオリ" = "海に砂浜、屋台、DJステージ……。"
"10036020-152-サオリ" = "きっと、どれも未知の体験だろう。"
"10036020-153-サオリ" = "先生、みんなが楽しい時間を過ごせるよう、手を貸してほしい。"
"10036020-154-サオリ" = "……頼れるのは、先生しかいないんだ。"
"10036020-155-サオリ" = "もちろん、できる限りのことは自分でもやる。"
"10036020-156-サオリ" = "みんなにお祭りを楽しんでもらえるのなら、何だって……。"
"10036020-157" = "[s9] \"うん、分かった。\"\n[s10] \"任せて、サオリ。\""
"10036020-158-サオリ" = "ありがとう、先生。#nこの恩は絶対に忘れない。"
"10036020-159-サオリ" = "おーい、そろそろ作業を再開するぞ！"
"10036020-160-サオリ" = "すまない、行かなくては……。"
"10036020-161" = "[s] \"うん、何かあったらいつでも連絡してね。\""
"10036020-162-サオリ" = "助かる。"
"10036020-163-サオリ" = "それと……先生も、ぜひお祭りを楽しんでいってくれ。"
