[translation]
"10036090-1" = "第9話;アリウススクワッド、集結"
"10036090-2-アケミ" = "っ……！"
"10036090-3-ヘルメット団員A" = "あれ、さっきのバイトじゃないか？#n伝説のスケバンを一人で相手するなんて……！"
"10036090-4-ヘルメット団員A" = "ロケットランチャーをリロードさせないように立ち回っているような……。"
"10036090-5-ヘルメット団員A" = "ああ、たぶんそのために攻撃を仕掛け続けてるんだろうな！"
"10036090-6-アケミ" = "その機敏で優雅な動きは、まるで……。"
"10036090-7-アケミ" = "私が飼っている、ムササビの「カルレス君」のようですわね。"
"10036090-8-アケミ" = "きちんとご挨拶したい気持ちもありましたが……。"
"10036090-9-アケミ" = "今ばかりは、目障りで仕方ありません！"
"10036090-10-サオリ" = "お前がここを立ち去ればよいだけの話だ。"
"10036090-11-ヘルメット団員A" = "が、頑張れ！バイト！"
"10036090-12-ヘルメット団員A" = "頼んだぜ！"
"10036090-13-アケミ" = "……はぁ。"
"10036090-14-アケミ" = "本当に困りましたわね。"
"10036090-15-アケミ" = "矯正局に密告したヘルメット団に復讐するために、#nわざわざ来たというのに……。"
"10036090-16-アケミ" = "まさか、こんなところで邪魔をされるとは……。"
"10036090-17-アケミ" = "……そうですわね。#n人生は、山あり谷ありと申しますし。"
"10036090-18-アケミ" = "この程度で音を上げては、伝説のスケバンの名が廃りますわ。"
"10036090-19-アケミ" = "うふふっ！#nこれからは、気合を入れて活動するといたしましょう。"
"10036090-20-アケミ" = "ふんっ！"
"10036090-21-サオリ" = "……？"
"10036090-22" = "[s] \"……戦闘中に瞑想？\""
"10036090-23-アケミ" = "[ruby=くりはま]栗浜[/ruby]アケミ！#n加減せずにお相手いたしましょう！"
"10036090-24-アケミ" = "……はああっ！"
"10036090-25-サオリ" = "……！"
"10036090-26" = "[ns] \"サオリ、大丈夫！？\""
"10036090-27-サオリ" = "くっ！#n今の攻撃は……？"
"10036090-28-サオリ" = "装備が変わったわけでもないのに……。"
"10036090-29-サオリ" = "さっきよりも勢いが……！"
"10036090-30-アケミ" = "ええ。"
"10036090-31-アケミ" = "私が編み出した呼吸法には、#nスケバンの真髄が込められていますから！"
"10036090-32" = "[s] \"……す、スケバンの真髄？\""
"10036090-33-アケミ" = "ふ、ふぅ……やはり、このスキルは負担が大きすぎますわね。"
"10036090-34-アケミ" = "ですが、こうでもしなければ、あなたを倒すことはできませんでした。"
"10036090-35-サオリ" = "……そうか。"
"10036090-36-アケミ" = "うふふ……。"
"10036090-37-アケミ" = "姐様！#nウチらも加勢します！"
"10036090-38-アケミ" = "姐様を一人で戦わせたりしません！"
"10036090-39-アケミ" = "みんな……でも、これは私が始めた戦いですわ。#n皆さんを巻き込むわけには……。"
"10036090-40-スケバンA" = "いえ！#n姐様の戦いは、ウチらの復讐も同然です！"
"10036090-41-アケミ" = "一生ついていきます、姐様！"
"10036090-42-サオリ" = "……驚いたな。"
"10036090-43-サオリ" = "一度の攻防で、ここまで士気を取り戻すとは。"
"10036090-44-サオリ" = "これが、信頼……か。"
"10036090-45-スケバンA" = "行くぞ、お前たち！"
"10036090-46" = "[ns] \"サオリ……！\""
"10036090-47-サオリ" = "くっ……！"
"10036090-48-アツコ" = "……？"
"10036090-49-アツコ" = "久しぶり、サッちゃん。大変そうだね。"
"10036090-50-サオリ" = "……アツコ！"
"10036090-51-スケバンA" = "気をつけろ、ほかにも仲間が――"
"10036090-52-スケバンA" = "うぐっ……。"
"10036090-53-ヒヨリ" = "え、えへへ。#nとりあえず撃っちゃいましたけど……これで完全に敵扱いですよね？"
"10036090-54-ミサキ" = "……世話が焼けるんだから。"
"10036090-55-サオリ" = "ミサキ、ヒヨリ……。"
"10036090-56-ミサキ" = "ゆっくり話す余裕はなさそうだね。"
"10036090-57-サオリ" = "……。"
"10036090-58-サオリ" = "あぁ。"
"10036090-59-サオリ" = "つもる話は、あとにしよう。"
"10036090-60-ミサキ" = "先生、指揮を！"
"10036090-61" = "[s3] \"任せて！\"\n[s4] \"アリウススクワッド、出撃だ！\""
"10036090-62-ヘルメット団員A" = "私たちも置いてかれるわけにはいかねぇ！"
"10036090-63-ヘルメット団員A" = "全員ついてこい！"
