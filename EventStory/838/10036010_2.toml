[translation]
"10036010-1" = "第1話;海とサオリと"
"10036010-2-ヘルメット団員A" = "オーライ！オーライ！"
"10036010-3-ヘルメット団員A" = "大きい荷物から運んでいけ！"
"10036010-4-ヘルメット団員B" = "はいっ！"
"10036010-5-ヘルメット団員A" = "おーい、ちょっと良いか？"
"10036010-6-サオリ" = "……私か？"
"10036010-7-サオリ" = "顔色が悪そうだが、大丈夫か？"
"10036010-8-サオリ" = "ああ、いや……。"
"10036010-9-サオリ" = "こんな明るい時間に堂々と動いて、良いのかと思ってな。"
"10036010-10-サオリ" = "……他の学園の治安維持部隊に見つかっても大丈夫なのか？"
"10036010-11-ヘルメット団員A" = "もしかして、新入りか？"
"10036010-12-ヘルメット団員A" = "「アウトロービーチ」は自由の地なんだ！"
"10036010-13-サオリ" = "自由の地……？"
"10036010-14-ヘルメット団員A" = "ああ！その通り！"
"10036010-15-ヘルメット団員A" = "ここは3つの自治区の境になっているから、管轄が曖昧になっているんだ。"
"10036010-16-ヘルメット団員A" = "ヴァルキューレの連中が出しゃばってくるかもしれないが……#nあのノロマたちが来たところで、何になるって話だ。"
"10036010-17-ヘルメット団員A" = "奴らが嗅ぎつけた頃には、もう総連合会は終わってるはずさ。"
"10036010-18-サオリ" = "そうか。#nだからヘルメット団のような不良集団が、こうも大胆に活動しているのか……。"
"10036010-19-ヘルメット団員A" = "ふ、不良集団！？"
"10036010-20-サオリ" = "……違ったか？#nすまない、謝罪する。"
"10036010-21-ヘルメット団員B" = "いや、謝ってほしいわけじゃ……。"
"10036010-22-ヘルメット団員A" = "たしかに不良の集まりではあるが……。"
"10036010-23-サオリ" = "ひとまず、この荷物を運べば良いんだな？"
"10036010-24-ヘルメット団員B" = "あの重たい鉄棒を3本同時に……。"
"10036010-25-ヘルメット団員B" = "こりゃ、大助かりだな。"
"10036010-26-サオリ" = "どこに置くんだ？"
"10036010-27-ヘルメット団員B" = "あ、ああ！#n砂浜に2メートル間隔で並べてくれ！"
"10036010-28-サオリ" = "よし、これで最後だな。"
"10036010-29-サオリ" = "次は……。"
"10036010-30-サオリ" = "そこの人！"
"10036010-31-ヘルメット団C" = "ちょっと手伝ってもらえないかな？"
"10036010-32-サオリ" = "ああ、任せてくれ。"
"10036010-33-ヘルメット団C" = "よいしょ、っと。"
"10036010-34-サオリ" = "ふっ！"
"10036010-35-サオリ" = "ありがとう、おかげで助かったよ！"
"10036010-36-サオリ" = "礼は不要だ。"
"10036010-37-サオリ" = "契約書には、護衛以外の仕事にも協力するよう書かれていたからな。"
"10036010-38-ヘルメット団C" = "真面目というか、ちょっと変わってるのかな？"
"10036010-39-サオリ" = "変わっている、だと……？"
"10036010-40-サオリ" = "おーい、こっちにも来てくれ！"
"10036010-41-サオリ" = "ビーチバレーのコートを作りたいんだけど、#n人手が足りないんだ。"
"10036010-42-サオリ" = "ああ、分かった。"
"10036010-43-サオリ" = "……ふぅ。#nこれで作業は一区切りか。"
"10036010-44-サオリ" = "そろそろ護衛の準備を……。"
"10036010-45-サオリ" = "あっ……。"
"10036010-46" = "（そういえば、聞いたことがあったな）"
"10036010-47" = "（地の果てには、広大な海があるという話を）"
"10036010-48" = "（しかし、実際に目にするのは初めてだ……）"
"10036010-49" = "……。"
"10036010-50-サオリ" = "……。"
"10036010-51-サオリ" = "……平和だ。"
"10036010-52-サオリ" = "アツコ、ミサキ、ヒヨリ……アズサ。"
"10036010-53-サオリ" = "みんなにも、この景色を……。"
"10036010-54" = "（一方、アウトロービーチの別の場所では……）"
"10036010-55-アツコ" = "先生、見て。#n本物のカニさん、可愛い。"
"10036010-56" = "[s] \"可愛いね。\""
"10036010-57-ミサキ" = "アイス、こぼれそうだよ。#n気をつけて。"
"10036010-58-ヒヨリ" = "せ、先生……私のアイス、溶けちゃいました！#nもう終わりです！うわぁぁああん！"
