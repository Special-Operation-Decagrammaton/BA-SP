[translation]
"10020040-1-リン" = "……今回は、「あの」シロコさんは見えませんね。"
"10020040-2-モモカ" = "んだね。もしかして、諦めたとか？"
"10020040-3" = "そこまでは分かりません……で、ですが油断は禁物です！"
"10020040-4-ウタハ" = "そういえば、皆に良い知らせがあるよ。#n船の修理作業が……まもなく完了しそうでね。"
"10020040-5-アユム" = "そ、そうですか……！ありがとうございます！みなさん、本当にお疲れ様でした！！"
"10020040-6-モモカ" = "いやぁ～、正直かなり心配してたけど……よかったよかった。 "
"10020040-7-ヒビキ" = "うん。ハッキングした箱舟の演算装置のおかげで、思ったよりすぐ終わった。"
"10020040-8-コトリ" = "はい！この演算装置、素晴らしい性能でした！"
"10020040-9-ウタハ" = "あとは……第4エリアの「次元エンジン」を破壊できれば、箱舟の「自爆シーケンス」を作動できるはず。"
"10020040-10-ヒビキ" = "自爆まで余裕があると思うから、その間にウトナピシュティムを再起動させて脱出すれば大丈夫。"
"10020040-11-ヒビキ" = "ここからはタイミングが肝心だよ。気を引き締めていこう。"
"10020040-12-ウタハ" = "では、そちらの健闘を祈る。"
"10020040-13-ヒマリ" = "不幸中の幸いと言いますか……リオ、あなたの提案してくれた「脱出装置」の出番はなさそうですね。"
"10020040-14-リオ" = "……そうね。"
"10020040-15-ノノミ" = "私たちは「特別エリア」の制御室前で交戦中です！"
"10020040-16-セリカ" = "ほんっとにもう、しつこいわね！"
"10020040-17" = "まだ抵抗されていますが、破壊完了まで時間の問題です！"
"10020040-18-ホシノ" = "ほらほら、その程度じゃ足止めにもなんないよ～？"
"10020040-19-アヤネ" = "制御室の破壊が完了次第、またご連絡します！"
