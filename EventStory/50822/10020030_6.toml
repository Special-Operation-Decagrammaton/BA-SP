[translation]
"10020030-1-アヤネ" = "シロコ先輩、来ましたね……。"
"10020030-2-ホシノ" = "今度こそ逃さないよ～"
"10020030-3-セリカ" = "覚悟してよね！"
"10020030-4-ノノミ" = "シロコちゃん！おとなしく捕まってください！ "
"10020030-5" = "[ns1] \"シロコ、1つだけ教えてほしい。\"\n[ns2] \"どうして、プレナパテスの命令を聞いてるの？\""
"10020030-6-シロコ" = "……違う、先生。"
"10020030-7-シロコ" = "私がプレナパテスの命令を聞いてるんじゃなくて――逆。"
"10020030-8" = "[s] \"「逆」……？\""
"10020030-9-シロコ" = "……「色彩の[ruby=きょうどうしゃ]嚮導者[/ruby]」が、私の命令を聞いてるの。"
"10020030-10" = "[ns] \"どういうこと……？\""
"10020030-11-ヒマリ" = "シロコさんの現在位置を特定しました！"
"10020030-12-ヒマリ" = "シロコさんは――箱舟の第4エリア、閉鎖されたセクションにいます。そこから信号をキャッチしました！"
"10020030-13-ノノミ" = "第4エリア、というと……"
"10020030-14-ヒマリ" = "ええ。今みなさんが居る第3エリアの「次元エンジン」とは距離があります。"
"10020030-15-シロコ" = "……。"
"10020030-16-ホシノ" = "ん……？シロコちゃんは、目の前にいるけど……？"
"10020030-17-ヒマリ" = "……そちらにも……ですか？"
"10020030-18-ヒマリ" = "こ、これは……一体……そちらにもシロコさんが存在すると表示されて――？"
"10020030-19-ヒマリ" = "第4エリアと、今いる第3エリアの「次元エンジン」に……？ "
"10020030-20-ヒマリ" = "なっ……シロコさんは、今この箱舟に二人同時に存在していると……？ま、待ってください。ま、さか……この天才美少女である私が、ミスを……！？ "
"10020030-21-ホシノ" = "……いや、それは多分ミスじゃないよ。#n良いことを聞いたよ、ありがとね。"
"10020030-22-ヒマリ" = "え……？"
"10020030-23-ホシノ" = "そっかぁ、そういう事だったんだねぇ――やっと分かったよ。"
"10020030-24-ホシノ" = "「色彩」とかいうヤツのせいで、シロコちゃんが変わってしまった――#nそう思ってたんだけどさ。 "
"10020030-25-ホシノ" = "……そうじゃなかったんだね。"
"10020030-26-ホシノ" = "[ruby=アレ]「シロコ」[/ruby]は、私たちの知ってる「シロコちゃん」じゃない。"
"10020030-27" = "[s3] \"………………\"\n[s4] \"………………え？\""
"10020030-28-ノノミ" = "えっ……！？"
"10020030-29-セリカ" = "な、何言ってるのよホシノ先輩。"
"10020030-30-アヤネ" = "私たちの知っている……シロコ先輩じゃ、ない……？"
"10020030-31-アヤネ" = "し、シロコ先輩、再び戦闘態勢に突入……！ "
"10020030-32-アヤネ" = "応戦をお願いします！"
"10020030-33-ホシノ" = "真実が何かは、ちゃんとぶつかってみないとね。#n今はこの戦闘に集中するよ！"
"10020030-34" = "[ns] \"……分かった！今はとりあえず、進もう！！\" "
"10020030-35-アヤネ" = "はい！！これより、シロコ先輩を制圧し「次元エンジン」を破壊します！！ "
"10020030-36-アヤネ" = "先生、指揮をお願いします！"
