[translation]
"10011020-1" = "第2話;大きな乙女"
"10011020-2" = "百鬼夜行 公演 準備 ステージ"
"10011020-3-公演スタッフ" = "公演スタッフの方々は、こちらにお集まりください！"
"10011020-4" = "[s] \"よし、行こっか。\""
"10011020-5-イズナ" = "いざ！"
"10011020-6-ツクヨ" = "はいっ……！"
"10011020-7-イズナ" = "いやー、何させられるんだろうねー。"
"10011020-8-公演スタッフ" = "では本格的な作業の前に、役割分担を決めようと思います。"
"10011020-9-イズナ" = "……役割分担？"
"10011020-10-公演スタッフ" = "そこのあなた、こちらにお願いします。"
"10011020-11-イズナ" = "あ、うん。"
"10011020-12-公演スタッフ" = "そこのあなたはあちらへ。"
"10011020-13-イズナ" = "ニンニン！"
"10011020-14-公演スタッフ" = "そこの背の高い方は、そちらの方へ。"
"10011020-15-ツクヨ" = "はいっ……！"
"10011020-16-公演スタッフ" = "それでは、各スタッフに従って動いてください。"
"10011020-17-ミチル" = "うーん、ばらけちゃったけど仕方ないか。"
"10011020-18-ツクヨ" = "イズナ、頑張ってきます！"
"10011020-19-ツクヨ" = "私も、頑張る……。"
"10011020-20" = "[s] \"じゃあ、みんなまた後でね。\""
"10011020-21" = "（そうして、一時間後……）"
"10011020-22" = "[ns] \"……まだ来なさそうかな？\""
"10011020-23" = "（また少し時間が経ち……）"
"10011020-24" = "[ns] \"……？何かの騒ぎ……？\""
"10011020-25" = "[ns] \"あれって……。\""
"10011020-26-ツクヨ" = "あの、どいていただけ、ないでしょうか……。"
"10011020-27-ツクヨ" = "んー？まあまあ、もうちょっとそこにいてよ。"
"10011020-28-チンピラA" = "そうだよ、あんたがそこにいてくれないと目印が無いじゃん。"
"10011020-29-チンピラB" = "でっかいやつがいるからって伝えて約束してるんだからさ。"
"10011020-30-チンピラA" = "私、目印じゃないですよぉ……。"
"10011020-31-チンピラA" = "それに私、公演の準備が……。"
"10011020-32" = "[s] \"ツクヨ？\""
"10011020-33-チンピラA" = "……！！"
"10011020-34-チンピラA" = "誰だお前？"
"10011020-35-チンピラB" = "何だ、私たちの邪魔をする気か？"
"10011020-36-チンピラA" = "こうして楽しく遊べそうな日に、邪魔させるわけにはいかねぇなぁ！"
"10011020-37-チンピラB" = "痛い目見ないと分からねぇか？じゃあいくぞおらっ！"
"10011020-38" = "[s] \"うーん……ごめん、ツクヨ。一緒に対応してくれる？\""
"10011020-39-ツクヨ" = "え、えぇっ……！？"
"10011020-40" = "[戦闘突入 - スケバン]"
