[translation]
"10011075-1-カエデ" = "はいクリアー！おめでとう！"
"10011075-2-ミチル" = "はぁ、はぁ……連戦は疲れる……。"
"10011075-3-カエデ" = "じゃあ私は、ちょっと結果報告に行ってくるね！バイバイ！"
"10011075-4" = "[ns] \"何とかなって良かった、お疲れ様。\""
"10011075-5-イズナ" = "あっ……！ご無事、でしたか……！"
"10011075-6-イズナ" = "主殿！それに部長！"
"10011075-7-ツクヨ" = "ツクヨ、イズナ……！"
"10011075-8-ミチル" = "イズナちゃんと、どうにかここまで来たのですが……。"
"10011075-9-ミチル" = "すっかり迷ってしまいました！永遠に出られないかと思いましたが、何とツクヨ殿が解決法を見つけてくださったんです！"
"10011075-10-ミチル" = "昔、部長から借りた漫画で、見たことあるな、と……。"
"10011075-11-ミチル" = "あの時、部長がおススメしてくれて、良かったです……！えへへっ……！"
"10011075-12-イズナ" = "そ、それは良かった……。"
"10011075-13" = "[s] \"あれ、ところでイロハは？\""
"10011075-14-イズナ" = "イロハ殿も、途中までは一緒だったのですが……"
"10011075-15-ツクヨ" = "途中で、はぐれてしまい……どこかで会えるかと、思いましたが、いつの間にゴールまで……。"
"10011075-16-ツクヨ" = "戻って、探してみましょう、か……？"
"10011075-17-ミチル" = "……ツクヨ、イズナ。"
"10011075-18-ミチル" = "私、二人に言っておきたいことがあって……。"
"10011075-19-イズナ" = "えっと、はい……？"
"10011075-20" = "[ns] \"……？\""
"10011075-21-傭兵バイトA" = "ふぅ……事が大きくなる前に追いつくことができて、何よりです。"
"10011075-22" = "[s] \"カホ？\""
"10011075-23-傭兵バイトA" = "この事態については、色々と皆さんにもお伺いしたくはありますが……。"
"10011075-24-傭兵バイトA" = "とにかく、公演は中止です。"
