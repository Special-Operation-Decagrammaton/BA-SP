[translation]
"10011085-1-カホ" = "なるほど、これが「先生」の……そして……。"
"10011085-2-カホ" = "……今さらですが、どうしてそこまでするのですか？"
"10011085-3-カホ" = "正式な部活になる方法は、幾らでもあるでしょう？"
"10011085-4-ツクヨ" = "それは、簡単です。"
"10011085-5-ツクヨ" = "私は、部長が決めた事に、ついていきたいだけ……ですから。"
"10011085-6-ツクヨ" = "たとえ部長が、何を、考えていたとしても。"
"10011085-7-ツクヨ" = "はい！イズナも同じです！"
"10011085-8-イズナ" = "私たちは、それを信頼しますし、蔑ろにはしたくありません。なぜならーー"
"10011085-9-ツクヨ" = "私たちは、「忍術研究部」なので……！"
"10011085-10-ミチル" = "……！"
"10011085-11-ツクヨ" = "何となくは、分かってるんです……"
"10011085-12-ツクヨ" = "でも、それは良いんです……。"
"10011085-13-ツクヨ" = "軽薄で、欲張りで、見栄っ張りで……"
"10011085-14-ツクヨ" = "どうしようもないほど、"
"10011085-15-ツクヨ" = "いつも行き当たりばったりで……！"
"10011085-16-ツクヨ" = "でも、忍者が大好きで、"
"10011085-17-ツクヨ" = "私たちのためにって、いつも頑張ってくれる部長だから……"
"10011085-18-ツクヨ" = "だから……！"
"10011085-19-ツクヨ" = "あなたがツクヨ？"
"10011085-20-ツクヨ" = "おお、背が高くてカッコ良いね！"
"10011085-21-ミチル" = "！！"
"10011085-22-ミチル" = "え、あ、その、私は……。"
"10011085-23-ツクヨ" = "ちょー強い忍者になれそう！"
"10011085-24-ツクヨ" = "もし良かったら……"
"10011085-25-ツクヨ" = "私が作った最強の部活、「忍術研究部」に入らない？"
"10011085-26-ツクヨ" = "大好きで、尊敬しているんです！"
"10011085-27-ツクヨ" = "だから、部長が信じる道を、行きます！公演を成功させて、正式な部活に、なりたいんです……！"
"10011085-28-ツクヨ" = "イブキ殿との約束も！イズナたちの願いも！必ずや叶えてみせます！"
"10011085-29-イズナ" = "はい！それが、忍者ですから！"
"10011085-30-イズナ" = "……ですよね、部長？"
"10011085-31-カホ" = "ツクヨ、私は……っ。"
"10011085-32-ミチル" = "そうですか……。"
"10011085-33" = "[ns] \"あれ、この音は……？\""
"10011085-34-イロハ" = "無事でしたか。"
"10011085-35" = "[s] \"イロハ！？\""
"10011085-36-イロハ" = "トリックハウスで迷子になってたから連れて来た！"
"10011085-37-カエデ" = "何か知らない間に戦車が準備されててさ、ビックリしたよー。"
"10011085-38-イロハ" = "……あのトリックハウスとやらを彷徨う中で、気づきました。"
"10011085-39-イロハ" = "どうして馬鹿正直に、自分の足で走っていたのか……と。"
"10011085-40-イロハ" = "初めからこうするべきでしたね……あらためて、イブキを助けに行きます。"
"10011085-41-カエデ" = "みなさんまさか、諦めてないですよね？"
"10011085-42-カホ" = "ま、待ってください……！"
"10011085-43-ツクヨ" = "部長！"
"10011085-44-イズナ" = "部長！！"
"10011085-45" = "[s] \"ミチル。\""
"10011085-46-ミチル" = "あああぁぁぁもうっ！！よし吹っ切れた！行こう、忍術研究部！"
