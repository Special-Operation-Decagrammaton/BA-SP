[translation]
"10011035-1-ミチル" = "な、何なのさあいつら～！？"
"10011035-2" = "[s] \"魑魅一座……。\""
"10011035-3-ミチル" = "す、魑魅一座って……あの噂の問題児集団！？"
"10011035-4-ミチル" = "「魑魅一座・気まぐれ流」、と名乗っていました！"
"10011035-5-ミチル" = "私も、聞いたこと、あります……「魑魅一座・気まぐれ流」は、魑魅一座の中でも、特に好戦的、と言われていて……。"
"10011035-6-ツクヨ" = "百鬼夜行の、伝統的なお祭り以外は、認めず……それ以外は全部、禁止しようと、するですとか……"
"10011035-7-ツクヨ" = "毎月のように、お祭り商品券を、要求してきたり……。"
"10011035-8-ツクヨ" = "陰陽部も、お祭り運営委員会も、自分たちの要求を受け入れてくれないから……って、どうにかお祭りを、自分たちが好きなように楽しもうと……そのために戦う、お祭り強硬派だ、と聞きました。"
"10011035-9-ミチル" = "何その漫画に出てきそうな悪役！"
"10011035-10" = "[s] \"お祭り強硬派……？\""
"10011035-11-ミチル" = "第一、どうしてそんなやつらが私たちを襲うわけ！？"
"10011035-12-公演スタッフ" = "大変です！お姫様役の方が、誘拐されてしまいました！"
"10011035-13-イズナ" = "お姫様役って……。"
"10011035-14-イズナ" = "つまり……"
"10011035-15-ミチル" = "イブキ殿！？"
"10011035-16" = "[s] \"魑魅一座、もしかして交流会の邪魔をしようと……？\""
"10011035-17-ミチル" = "通報、しないと……！陰陽部か、百花繚乱に、早く……！"
"10011035-18-イズナ" = "ま、待った！それはダメ！"
"10011035-19" = "[ns] \"？\""
"10011035-20-イズナ" = "あ、その、"
"10011035-21-ミチル" = "通報したらその、公演が……！"
"10011035-22-？？？" = "……万魔殿のメンバーの誘拐です。"
"10011035-23-？？？" = "外部に知られたら外交問題、学園間の抗争に発展しても不思議ではありません。"
"10011035-24-イロハ" = "そ、そうそう！だから知らせない方が良いんじゃないかなって……！"
"10011035-25-ミチル" = "特にゲヘナの議長はヤバい人だって聞くし、万が一これが万魔殿に知られたりなんかしたら……！"
"10011035-26" = "[s] \"それについてはもう遅いかも……。\""
"10011035-27-イロハ" = "イブキが誘拐、ですか……万魔殿として、見過ごせない一大事ですね。"
"10011035-28-イズナ" = "え、万魔殿！？あなたが！？"
"10011035-29-ミチル" = "エエエェェェ！？もう完全にアウトじゃん！？"
"10011035-30-イズナ" = "外交問題待ったなしですか！？"
"10011035-31-ツクヨ" = "うぅ、何てことに……。"
"10011035-32-イロハ" = "はぁ……。"
"10011035-33" = "[s] \"イロハ、その、落ち着いて状況を整理しよっか……。\""
"10011035-34-イロハ" = "何を仰るんですか、先生。私は今も、すごく冷静ですが。"
"10011035-35" = "[ns] \"ちょっとそうは見えないかなー……？\""
"10011035-36-イロハ" = "はぁ、全くもう……。"
"10011035-37-イロハ" = "これだから私は反対だったんです。イブキにとって思い出になるのは良いことですが、やはり危険すぎました。"
"10011035-38-イロハ" = "全く、マコト先輩が強行するから……どう責任取ってくれるんですか……。"
"10011035-39" = "[s] \"それについては一旦、マコトに言ってもらって……。\""
"10011035-40-イロハ" = "はぁ、気持ち的には憤懣遣る方無いところですが……。"
"10011035-41-ミチル" = "う、あ……。"
"10011035-42-ツクヨ" = "えっと、その……。"
"10011035-43-イズナ" = "ご、ごくり……。"
"10011035-44-イロハ" = "……まあ、結論としては一緒ですね。公に知らせるわけにはいきません。"
"10011035-45-イロハ" = "百鬼夜行とゲヘナの間で、政治的軋轢やら紛争やらを起こすわけにはいきませんから。"
"10011035-46-ミチル" = "……！"
"10011035-47" = "[ns] \"イロハ……！\""
"10011035-48-イロハ" = "そっちの方が面倒になりそうなので。私は楽な方が好きです。"
"10011035-49" = "[s] \"そういう理由だとは思ったけど……！\""
"10011035-50-イロハ" = "もしこれを知ったらマコト先輩は大暴れでしょうし、サツキ先輩は――"
"10011035-51-イロハ" = "まあ最終的にはいつも通り、私とイブキが振り回されることになるんでしょう。そういうのはもう疲れてるので。"
"10011035-52-イロハ" = "ですので、公に知らせるというのは無しですね。"
"10011035-53-ツクヨ" = "では、私たちは、どうすれば……。"
"10011035-54-ミチル" = "……やるしかない。"
"10011035-55-イズナ" = "部長？"
"10011035-56-ミチル" = "こうなったら方法は一つ！"
"10011035-57" = "[s] \"方法って、つまり……。\""
"10011035-58-ミチル" = "外部に知られる前に、この事件を片付ける！"
"10011035-59-ミチル" = "つまりこの場にいる私たちで、イブキちゃんを助けるってこと！"
"10011035-60-イズナ" = "なるほど……！"
"10011035-61-イズナ" = "たしかに、その手がありましたね！"
"10011035-62-イズナ" = "私たちだけじゃなくて、ここには万魔殿の偉い人も、シャーレの先生もいる！"
"10011035-63-ミチル" = "だから、うん！きっと大丈夫なはず！"
"10011035-64" = "[s] \"確かに、それがベストかもしれないけど……。\""
"10011035-65-イロハ" = "事態を隠し通すにしても、救出のためには動かなくてはいけません。誤魔化しながら動くには、制約が強いですが……"
"10011035-66-ニヤ" = "あ～あ～、テステス……みなさん、聞こえてます～？"
"10011035-67" = "[ns] \"飛行船からの、放送……？\""
"10011035-68-ニヤ" = "にゃははは～♪みなさん、公演は楽しんでくれてますか～？"
"10011035-69-ニヤ" = "万魔殿のみなさんのご協力もあり、スペシャルバージョンでお送りする今回の公演！"
"10011035-70-ニヤ" = "少々予定外のこともありましたが、ご覧の通り「体験型イベント：和楽姫」がスタートしました！"
"10011035-71-ニヤ" = "さあ、こちらをご覧ください！"
"10011035-72-ニヤ" = "現在、お姫様を誘拐した悪党が逃走中！"
"10011035-73-ニヤ" = "さあ果たして、誘拐されたお姫様を最初に救い出すのはいったい誰なのか？"
"10011035-74-ニヤ" = "無事救出できた方には、私たち陰陽部から特別な賞品もプレゼント予定ですので……"
"10011035-75-ニヤ" = "百鬼夜行にお越しのゲヘナ生のみなさん、そしていつも映画村を楽しんでくださる百鬼夜行生のみなさん。"
"10011035-76-ニヤ" = "どうぞ、奮ってご参加ください♪"
"10011035-77-ニヤ" = "私たちはそれとなく応援してますので～、にゃははっ！"
"10011035-78" = "[ns] \"……なるほど。\""
"10011035-79-イロハ" = "……まだ事情を知らない人たちには「公演が続いてる」とアピールする。"
"10011035-80-イロハ" = "これで周囲の目を誤魔化す、と。悪くない選択です。"
"10011035-81-イロハ" = "あんの陰険部長め……じゃなくて、さ、さすがは陰陽部の部長！これならある程度の時間は稼げるかも！"
"10011035-82-ミチル" = "よし、もっと状況は分かりやすくなったかも！"
"10011035-83-ミチル" = "事態が深刻になる前に、私たちの手でイブキさんを救出する！"
"10011035-84-イズナ" = "はい、危機とあればそこから救い出すのが忍びの役目ですので！"
"10011035-85-ツクヨ" = "イブキさん、今頃心細くて、泣いてるかもしれません……行きましょう！"
"10011035-86-イロハ" = "……イブキ、すぐ迎えに行きます。"
"10011035-87" = "[s] \"よし、じゃあ行こうか。\""
"10011035-88-ミチル" = "（まだ、まだ大丈夫……！公演を成功させて、忍術研究部の正式認可を貰う……）"
"10011035-89-ミチル" = "（大口を叩いちゃったし、イズナとツクヨよりも頑張らないと……。）"
"10011035-90-ミチル" = "（まだ、何とかなるはず……！）"
