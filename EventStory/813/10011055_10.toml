[translation]
"10011055-1-ツバキ" = "うん、お疲れ様～。正式に通過、ってわけじゃないけど……。"
"10011055-2-ツバキ" = "まあ、一応アリかな。"
"10011055-3-ミチル" = "ってことは、通っても良いってこと……？"
"10011055-4-ツバキ" = "うん。次のアトラクションは、まっすぐ進んで右の方だよ。"
"10011055-5-ツバキ" = "ところで、みんなが放送で言ってた「忍術研究部」？"
"10011055-6-ミチル" = "あ、そ、そうだけど……"
"10011055-7-ツバキ" = "そっか。忍者って、すごいね。"
"10011055-8-イズナ" = "あ……。"
"10011055-9-イズナ" = "……！"
"10011055-10-ツクヨ" = "はい！忍者はすごいんです！"
"10011055-11-ツバキ" = "頑張ってね、私はここから応援してるから。"
"10011055-12-ツクヨ" = "部長、その……"
"10011055-13-ミチル" = "うん。さっきのお祭り運営委員会もそうだけど、こうして他の生徒からちゃんと褒めてもらったのは、初めて……かも。"
"10011055-14-イズナ" = "当然です！忍者はすごいものなので！ですよね、主殿！"
"10011055-15" = "[s] \"うん、そうだね。忍者はカッコ良いよ。\""
"10011055-16-ミチル" = "……。"
"10011055-17-イロハ" = "とりあえず、突破できたならさっさと進みましょう。こうしている間にも距離が離されてしまいます。"
"10011055-18-ミチル" = "そ、そうだった！よし行こう、みんな！"
