[translation]
"10011060-1" = "第6話;第三関門：読心術師"
"10011060-2-ニヤ" = "さあ、白熱の追撃戦ですが～……？"
"10011060-3-ニヤ" = "現在最も頭角を現しているのは、私の予想通り「忍術研究部」！どのチームよりも早く、眠り姫の試練を通過しました！"
"10011060-4-ニヤ" = "これが噂の「忍者」の力なのでしょうか～？"
"10011060-5-ニヤ" = "もちろんあの「シャーレ」の先生が手助けしているので、その辺は込々で考えた方が良いかもしれませんが♪"
"10011060-6-ニヤ" = "まあ、みんなが楽しんでこそのお祭りですからねぇ。これくらいのルール違反は目を瞑るとしましょうか♪"
"10011060-7-ニヤ" = "ではでは、引き続き張り切っていきましょ～♪"
"10011060-8" = "[ns] \"何から何まで全部見られてるなぁ……。\""
"10011060-9-イロハ" = "まあ、バレてなさそうなのは幸いですが……。"
"10011060-10-百鬼夜行の生徒A" = "「眠り姫」のところを最速通過したのって、あの人たち？"
"10011060-11-百鬼夜行の生徒B" = "眠り姫って、あの修行部の部長でしょ？すごいけど、そもそも「忍術研究部」ってあんまり聞いたこと無いような……。"
"10011060-12-百鬼夜行の生徒A" = "そんな部活あったっけ？"
"10011060-13-百鬼夜行の生徒B" = "あったのかなぁ……にしても変わった名前だね。"
"10011060-14-ミチル" = "「変わった名前」……！？"
"10011060-15" = "[s] \"まあ、聞き慣れないからってだけだと思うけど。\""
"10011060-16-ミチル" = "うーん、そうかもだけど……。"
"10011060-17-ツクヨ" = "こんなに噂を、されると……プレッシャー、感じますね……。"
"10011060-18-イズナ" = "ですが！ここまで注目されているということは、かえって忍者の魅力を伝えるチャンスです！"
"10011060-19-イズナ" = "ね、部長！"
"10011060-20-ミチル" = "（注目は良いことだけど……結局最終的に結果を出せなくて、また変な見られ方をされちゃったら……）"
"10011060-21-ミチル" = "って、悩んでる場合じゃない！とにかく、一刻も早く魑魅一座を……！"
"10011060-22-ミモリ" = "なるほど、皆さんでしたか。"
"10011060-23-ミモリ" = "ここは「第三関門」です。「読心術師」ことこの私、「[ruby=みずは]水羽[/ruby]ミモリ」がみなさんのお相手をします！"
"10011060-24" = "[s1] \"ツバキの次は、ミモリ……！\"\n[s2] \"ど、読心術師……？\""
"10011060-25-イズナ" = "そういえば、聞いたことがあります！"
"10011060-26-イズナ" = "ただでさえ不思議な人が多い修行部ですが、その中には「相手の心を読むことができる」方がいると！"
"10011060-27" = "[s] \"ミモリにそんな能力が……！？\""
"10011060-28-ミモリ" = "あ、えっとそれはその……。"
"10011060-29-ミモリ" = "そういう役柄として採用されたと言いますか、"
"10011060-30-ミモリ" = "何と言いますか……！"
"10011060-31-ミモリ" = "と、とにかく！第三関門は、これまでの中でも最難関！"
"10011060-32-ミモリ" = "この私、読心術師のミモリがお相手を……！"
"10011060-33-ミモリ" = "すみません、この場は乗っていただけると嬉しいです……。"
"10011060-34" = "[s] \"ご、ごめん……了解。\""
"10011060-35-ミモリ" = "なるほど、流石は観光業の百鬼夜行。そういう演技も観光の一環、と。"
"10011060-36-イロハ" = "あ、えっと、とりあえず覚悟してください！みなさんの考え、読み取って見せます！"
"10011060-37-ミモリ" = "まずはイズナちゃん……！"
"10011060-38-ミモリ" = "な、何でしょう！？"
"10011060-39-イズナ" = "イズナちゃんはこの先に進むために、私のことを倒したいんですよね？"
"10011060-40-ミモリ" = "ど、どうしてそれを……！"
"10011060-41-ツクヨ" = "ふふっ……そしてツクヨちゃんは、頑張ってお友達の役に立ちたい、と。"
"10011060-42-ミモリ" = "すごい、当たりです……！"
"10011060-43-ツクヨ" = "そしてミチルちゃんは……"
"10011060-44-ミモリ" = "たくさん悩んでいるようですね。複雑な心境の中で、進むべきかどうかについても悩んでいる……。"
"10011060-45-ミチル" = "うっ……。"
"10011060-46-ミモリ" = "ふふふ、いかがでしょう？みなさんの心が読める私を……果たしてみなさんは倒せるでしょうか！"
"10011060-47" = "[s] \"よし、じゃあ次は私！\""
"10011060-48-ツクヨ" = "せ、先生殿……！？"
"10011060-49-ミモリ" = "え、あ……。"
"10011060-50-ミモリ" = "か、構いません！それでは先生の心も、読んでみせます！"
"10011060-51-ミモリ" = "むむむむっ……！"
"10011060-52-ミモリ" = "……！！"
"10011060-53-ミモリ" = "せ、先生、"
"10011060-54-ミモリ" = "そんなことをお考えに……。"
"10011060-55" = "[s] \"……え？\""
"10011060-56-ミモリ" = "それはその、えっと……。"
"10011060-57-ミモリ" = "……い、今はいけません！"
"10011060-58-イロハ" = "先生、いったい何を考えているんですか。"
"10011060-59" = "[s] \"何か色々誤解されてる気配！！\""
"10011060-60-ツクヨ" = "なるほど、こうして内部分裂を引き起こすというのが狙い……！？"
"10011060-61-ミチル" = "読心術師、強敵ですね……！"
"10011060-62-ミチル" = "イズナちゃん、部長……！私、良い方法を、思いついたかも、です……！"
"10011060-63-イズナ" = "良い方法？"
"10011060-64-イズナ" = "部長から借りた漫画で、読んだことが、あります……！主人公たちが、読心術を使う忍法術師と、戦った時の作戦……！"
"10011060-65-イズナ" = "その名も「ぼーっとする作戦」、です！"
"10011060-66-ミモリ" = "ふふっ……なるほど。"
"10011060-67-ツクヨ" = "何も考えなければ、心を読まれることも、ありません……！"
"10011060-68-ツクヨ" = "みんなで、ぼーっと、しましょう……！"
"10011060-69-ツクヨ" = "了解です！"
"10011060-70-ツクヨ" = "……！"
"10011060-71-ツクヨ" = "ぼーっ……。"
"10011060-72-イズナ" = "え、あ、うーん……やってみよっか！"
"10011060-73-イズナ" = "ぼーっ……。"
"10011060-74-イロハ" = "……何ですか、これ。"
"10011060-75-ミモリ" = "そう来ましたか……！"
"10011060-76-ミモリ" = "それでは私も全力で、ぼーっとしているみなさんの心を読んでみます！"
"10011060-77-ミチル" = "ぼーっ……。"
"10011060-78-ミチル" = "ぼーっ……！"
"10011060-79-ツクヨ" = "ぼーっ……？"
"10011060-80-ミモリ" = "むむむむ……っ！？"
"10011060-81" = "[ns] \"すごい勝負だ……！\""
"10011060-82-イロハ" = "……それ本気で言ってます？"
"10011060-83-イロハ" = "いや、別に対決とかは良いんですけど……。"
"10011060-84-イロハ" = "これ、いつまで待ってれば良いんでしょうか……ツッコミ不在ですし……。"
"10011060-85-イロハ" = "っていうか、何ですかこの茶番……。"
"10011060-86" = "[s] \"まあ元々アトラクションの一環だし。\""
"10011060-87-ミモリ" = "あ、ちなみにここで、今回のアトラクションのコツをお伝えしますね。"
"10011060-88-ミモリ" = "ここでは、門番を倒せばクリアになります。"
"10011060-89-イズナ" = "……！！"
"10011060-90-ツクヨ" = "な、なるほど……！"
"10011060-91-ミチル" = "なんだってぇ！？"
"10011060-92-イロハ" = "これ、もしかして私が空気読めてないんですかね……？"
"10011060-93" = "[s] \"なるほど、やるしかないってことかな。\""
"10011060-94-ミモリ" = "ふふっ、やる気は十分のようですね……！"
"10011060-95-ミモリ" = "では私、不肖ミモリがお相手いたします！"
