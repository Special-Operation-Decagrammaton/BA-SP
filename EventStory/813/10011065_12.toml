[translation]
"10011065-1-ミモリ" = "ふふっ……みなさん、お疲れ様でした！合格ですので、通っても良いですよ。"
"10011065-2-イズナ" = "成功、でしょうか……？"
"10011065-3-ミチル" = "はい、ツクヨ殿のおかげです！"
"10011065-4-イズナ" = "良かったぁ……。"
"10011065-5-イロハ" = "まあ、読心術と言いますか何と言いますか……。"
"10011065-6-イロハ" = "つまるところ、顔色を読むのがものすごく上手……みたいな話ですよね。"
"10011065-7" = "[s] \"ミモリは良い子だし、みんなのことをよく見てるからね。\""
"10011065-8-ミモリ" = "もう……先生までそんなことを……。"
"10011065-9-ミモリ" = "そちらの方が仰った通りです、"
"10011065-10-ミモリ" = "イベントの一環で名乗っているだけと言いますか……。"
"10011065-11-ミモリ" = "とにかく忍術研究部のみなさん、あらためておめでとうございます。"
"10011065-12-ミチル" = "よ、よしっ！じゃあ早速次に――"
"10011065-13-ミチル" = "あっ、ミチルちゃん。"
"10011065-14-ミモリ" = "……え、私？な、何かな？"
"10011065-15-ミモリ" = "出会ったばかりの私が言うのも、どうかなとは思うのですが……。"
"10011065-16-ミモリ" = "一応お伝えしておきます、一つの意見だと思ってください。"
"10011065-17-ミモリ" = "ミチルちゃんの優しさは素敵ですが……ミチルちゃんが思ってるより、みんな強いと思いますよ。"
"10011065-18-ミチル" = "……え？"
"10011065-19-ミモリ" = "ふふっ。"
"10011065-20-ミモリ" = "それは、どういう……？"
"10011065-21-イロハ" = "ほら、早く行きますよ。"
"10011065-22-イロハ" = "立ち止まっている場合ではありません、イブキの元へ急がないと。"
"10011065-23-ミチル" = "あ、うん……。"
"10011065-24-ミモリ" = "ではみなさん、頑張ってください。"
"10011065-25-ミモリ" = "あと先生、お昼からそういうのは、その……。"
"10011065-26" = "[s3] \"誤解だと思います！\"\n[s4] \"その件については後でしっかり話そうね！？\""
