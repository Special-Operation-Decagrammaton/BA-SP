[translation]
"10011090-1" = "第9話;[ruby=少女]忍者[/ruby]の鉄則"
"10011090-2-魑魅一座B" = "何すかこれ、全部めちゃくちゃじゃないっすか！"
"10011090-3-魑魅一座A" = "ニヤニヤ教授の作戦が、なぜ……！"
"10011090-4-ニヤ" = "にゃははっ！みんな頑張ってますか～？"
"10011090-5-ニヤ" = "ますます激しくなる追撃戦……"
"10011090-6-ニヤ" = "それもそろそろ終盤です！さあ、どうなるんでしょう～！"
"10011090-7-魑魅一座A" = "くそっ、陰陽部め……！"
"10011090-8-魑魅一座のリーダー" = "ちっ、最初から「交流会を混乱させて要望を飲ませる」なんてのが甘かったか！"
"10011090-9-魑魅一座のリーダー" = "こうなったら、直接行って銃弾をぶち込んでやる！"
"10011090-10-魑魅一座のリーダー" = "行くぞ、陰陽部のところに突撃だ！"
"10011090-11-魑魅一座のリーダー" = "ま、マジか！？"
"10011090-12-魑魅一座A" = "なるほど、それでこそリーダーっす！"
"10011090-13-イズナ" = "魑魅一座、発見です！"
"10011090-14-魑魅一座B" = "なっ、戦車だと！？"
"10011090-15-魑魅一座A" = "ど、どうするんすか！？"
"10011090-16-魑魅一座A" = "……城門の前にある橋を、爆弾で吹き飛ばす。"
"10011090-17-魑魅一座B" = "お、ナイスアイディア！そうすれば追って来られないはず！"
"10011090-18-魑魅一座A" = "派手に吹っ飛ばすっすよー！"
"10011090-19" = "い、今の爆発は……！？"
"10011090-20" = "やばっ！橋が吹き飛ばされてない！？"
"10011090-21" = "おおおっ！イズナ、こういうのドラマで見たことあります！追撃戦の王道ですね！"
"10011090-22" = "[ns] \"イロハ、どうしよっか？\""
"10011090-23" = "橋を破壊して、追撃を振り切ろうと……。"
"10011090-24" = "……甘いですね。"
"10011090-25" = "え、何！？なんで余裕なの！？"
"10011090-26" = "先生も、それ以外の皆さんも。しっかり捕まっててください。"
"10011090-27" = "[s] \"まさか……。\""
"10011090-28" = "足場が無いから何なんですか。"
"10011090-29" = "これくらいで、諦めるわけないでしょう。"
"10011090-30" = "何言ってんの！？ねぇ！？"
"10011090-31" = "必要なのは、速度――"
"10011090-32" = "砲身を後ろ側に回してください、発射準備を。"
"10011090-33" = "発砲の衝撃で飛び越えます。"
"10011090-34" = "それ本当に行けるかなぁ！？"
"10011090-35" = "大丈夫です、映画で見ましたから。"
"10011090-36" = "気合入れてください……！"
"10011090-37" = "のああああああぁぁぁぁぁっ！！？！？"
