[translation]
"10011050-1" = "第5話;第二関門：眠り姫"
"10011050-2-魑魅一座B" = "はぁ、はぁ……何とか追っ手は振り切ったが……。"
"10011050-3-ニヤ" = "相変わらずお姫様を誘拐した悪党は全力で逃走中！果たして誰が最初に、彼女たちを捕まえられるのか～！？"
"10011050-4-魑魅一座のリーダー" = "ぜ、全部放送されてるっすよ！？"
"10011050-5-魑魅一座A" = "これは一体、どういう状況なんだ……？"
"10011050-6-イブキ" = "ねぇねぇ、イブキは何もしなくて良いの？"
"10011050-7-魑魅一座B" = "と、とにかく静かに！今は逃げるので精一杯だから！"
"10011050-8-魑魅一座A" = "くそっ、次はどうすれば……！"
"10011050-9-？？？" = "こっちこっち～。"
"10011050-10-魑魅一座A" = "……！？"
"10011050-11-ミチル" = "聞いた話だと、こっちに逃げたはず……！"
"10011050-12-ニヤ" = "さぁさぁ、誘拐されたお姫様を探して駆け回る各位……"
"10011050-13-ニヤ" = "ゲヘナも百鬼夜行も混ざり合って、個性的な面々がたくさんですねぇ♪"
"10011050-14-ニヤ" = "その中でも、特に目立っているのはこちら～。"
"10011050-15-ニヤ" = "「忍術研究部」の、百鬼夜行の生徒ですねぇ～。"
"10011050-16-ニヤ" = "まあ正式な部活ではないので、同好会みたいなものですが♪"
"10011050-17-ニヤ" = "今回もしかしたら、同好会らしからぬ活躍を見せてくれるかもしれませんねぇ？"
"10011050-18-ニヤ" = "にゃははっ♪では各位頑張ってくださいな、アデュ～♪"
"10011050-19-ミチル" = "あれ、大丈夫なのかな……？万魔殿の人が見たら怒るんじゃ……。"
"10011050-20" = "[s] \"開き直り過ぎて、実際の状況はバレてない……みたいな感じかな？\""
"10011050-21-ミチル" = "元々、全体の構成としては、そういうイベントでしたし……中継をしない方が、もっと怪しいかも、です。"
"10011050-22-ミチル" = "うーん、まあそれはそうなんだけど……！"
"10011050-23" = "[s] （……）"
"10011050-24-イズナ" = "部長！あそこです！"
"10011050-25-ミチル" = "あ、うん！"
"10011050-26-ミチル" = "（とにかく今は、あれこれ考えてる場合じゃない……みんなのためにも、立ち止まってなんていられない！）"
"10011050-27-ゲヘナの生徒A" = "つ、強い……！"
"10011050-28-ゲヘナの生徒B" = "何だあれ、全く隙が見えない……！"
"10011050-29-ミチル" = "……！？"
"10011050-30-ツバキ" = "簡単には通さないよ～。"
"10011050-31" = "[s] \"あ、ツバキ。\""
"10011050-32-ツバキ" = "やあ、先生～。"
"10011050-33-ツバキ" = "ここは第二関門「眠り姫」だよ……ふぁぁ……。"
"10011050-34-ツバキ" = "ちょっと油断すると……すぐに……。"
"10011050-35-ツバキ" = "やられる、危険な……"
"10011050-36-ツバキ" = "……"
"10011050-37-ツバキ" = "くぅ……。"
"10011050-38-ミチル" = "寝ちゃった！？"
"10011050-39-ツバキ" = "んん……？あ、そういえばお姫様を誘拐した悪党は、この先へ逃げたよ……。"
"10011050-40-ツバキ" = "ここを通過するための方法――ルールは簡単。"
"10011050-41-ツクヨ" = "アトラクションの説明を、してくれるのですね……！"
"10011050-42-ツバキ" = "私が寝てる間に、このラインを通れればOK……"
"10011050-43-ツバキ" = "つまり……Zzz……"
"10011050-44-イズナ" = "つまりどういうことでしょうか！？"
"10011050-45-イロハ" = "何ですかあれ、起きてるのか寝てるのか……百鬼夜行の生徒って、ああいうのばっかりなんですか？"
"10011050-46" = "[s] \"「そんなことないよ！」とは言い切れない……\""
"10011050-47-百鬼夜行の生徒A" = "くっ！まさか、眠り姫のアトラクションだなんて……！"
"10011050-48-百鬼夜行の生徒B" = "寝てるのか起きてるのか分からない！どうしたら……！"
"10011050-49-ツバキ" = "くぅー……。"
"10011050-50-百鬼夜行の生徒B" = "今だ！今は流石に寝落ちてるはず！"
"10011050-51-ツバキ" = "ふぁ……。"
"10011050-52-百鬼夜行の生徒たち" = "えぇぇ！？"
"10011050-53-ツバキ" = "えっと……"
"10011050-54-ツバキ" = "「寝てる隙にこのラインを通過したら合格、ラインを超える瞬間を気づかれたら失格」"
"10011050-55-ツバキ" = "だから、そこのみんなは失格かな～……？"
"10011050-56-百鬼夜行の生徒たち" = "う、うわあああっ！？"
"10011050-57-ツクヨ" = "みなさん、連れ去られてしまい、ましたね……強制退場、でしょうか……。"
"10011050-58" = "[s] \"凝ってるなぁ……。\""
"10011050-59-ツバキ" = "次の挑戦者は、誰……？"
"10011050-60-ミチル" = "これ、さっきの関門とは全然レベルが違うじゃん……！"
"10011050-61-ミチル" = "急いでるのに、こんなのどうすれば……！"
"10011050-62-イズナ" = "部長、そして主殿！ここはイズナにお任せを！"
"10011050-63-ツクヨ" = "イズナ、ちゃん？"
"10011050-64-ミチル" = "イズナ、何か方法でもあるの？"
"10011050-65-イズナ" = "はい！こんなこともあろうかと、備えておいたのです！"
"10011050-66" = "[s] \"こんなこと、普通あるのかな……。\""
"10011050-67-イズナ" = "この忍具、「聞き筒」を使って……！"
"10011050-68-イズナ" = "ツバキ殿が寝ているのかどうか……あの「タヌキ寝入りの術」を、看破してみせます！"
"10011050-69-ツクヨ" = "イズナちゃん、頑張って……！"
"10011050-70-ツクヨ" = "よ、良し！やっちゃえイズナ！"
"10011050-71-ツクヨ" = "では……！"
"10011050-72-イズナ" = "……。"
"10011050-73-ツバキ" = "くぅ……"
"10011050-74-イズナ" = "……。"
"10011050-75-ツバキ" = "すやぁ……。"
"10011050-76-イズナ" = "……。"
"10011050-77-イズナ" = "…………。"
"10011050-78-イズナ" = "今です！！！"
"10011050-79-ツバキ" = "シュバババババッ！！！"
"10011050-80-イズナ" = "イズナ、やりました！"
"10011050-81-ツバキ" = "んん……？"
"10011050-82-ツバキ" = "あ、おめでとう～。"
"10011050-83-百鬼夜行の生徒A" = "す、すごい！何だあの技は……！"
"10011050-84-ゲヘナの生徒A" = "あの眠り姫の試練を突破した！？"
"10011050-85-百鬼夜行の生徒B" = "誰だあいつ！？"
"10011050-86-ツクヨ" = "イズナ、すごい！"
"10011050-87-ツクヨ" = "さすが、イズナちゃんです……！"
"10011050-88" = "[ns1] \"いつの間にかイズナが、忍者として成長している……！\"\n[ns2] \"先生は胸がいっぱいだよ……。\""
"10011050-89-イロハ" = "……よく分かりませんが、手放しで褒めた方が良い流れですか？"
"10011050-90-ミチル" = "よし、じゃあ私たちも……"
"10011050-91-ミチル" = "のわぁっ！？び、びっくりした！？"
"10011050-92-ミチル" = "ど、どうして急に撃ってくるのさ！？"
"10011050-93-ツバキ" = "んー……。"
"10011050-94-ツバキ" = "全員が突破できたわけじゃ、ないよね……？"
"10011050-95-ミチル" = "……え？"
"10011050-96" = "[ns] \"なるほど。っていうことは、この場合……？\""
"10011050-97-ツバキ" = "とはいえ、ひとりは突破できたわけだし……"
"10011050-98-ツバキ" = "じゃあ、特別ルール。"
"10011050-99-ツバキ" = "他のみんなは、私に勝てたらOKってことにしよっか。"
"10011050-100-ツバキ" = "さて、第二関門眠り姫……「ツバキ」、いくよ～。"
