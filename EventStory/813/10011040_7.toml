[translation]
"10011040-1" = "第4話;最初の関門：看板娘とSP"
"10011040-2-魑魅一座のリーダー" = "はぁ、はぁ……ほ、本当にやっちまった……！"
"10011040-3-魑魅一座のリーダー" = "ゆ、誘拐しちゃったっすね！"
"10011040-4-魑魅一座のリーダー" = "こ、これ良いんだよな？"
"10011040-5-魑魅一座A" = "浮足立つな、まだ目標が達成できたわけじゃない。"
"10011040-6-魑魅一座B" = "ちゃ、ちゃんと覚えてるよ！リーダー！"
"10011040-7-魑魅一座B" = "「和楽姫」の主役を誘拐して、今回の交流会をめちゃくちゃにする！"
"10011040-8-魑魅一座A" = "そして陰陽部の地位を失墜させる、っすよね！"
"10011040-9-魑魅一座B" = "そうだ、ここまでは計画通り。"
"10011040-10-魑魅一座B" = "そもそも今回の作戦は、キヴォトスでも犯罪界のマスターと呼ばれている「ニヤニヤ教授」に協力してもらった……失敗するはずがない。"
"10011040-11-魑魅一座のリーダー" = "ニヤニヤ教授って……。"
"10011040-12-魑魅一座のリーダー" = "あのクロノスでも正体が掴めないっていう、あの！？有名人じゃないっすか！"
"10011040-13-魑魅一座B" = "そうだ。その助力もあって、今回の計画は完璧。"
"10011040-14-魑魅一座のリーダー" = "後は淡々と実行するだけ……さあ、我々「魑魅一座・気まぐれ流」の力、百鬼夜行とゲヘナに見せつけてやろう。"
"10011040-15-魑魅一座B" = "有名度で行けば、本当にあの「チセ様」を誘拐しちゃうなんて……。"
"10011040-16-魑魅一座A" = "成功したのに、まだ胸がバクバクしてるっす……。"
"10011040-17-魑魅一座B" = "せっかくだし、チセ様のお顔を一目見て落ち着くとするか……"
"10011040-18-イブキ" = "あれ、そろそろ出番？"
"10011040-19-イブキ" = "……イブキ、これから何をすれば"
"10011040-20-イブキ" = "良いんだっけ？"
"10011040-21-魑魅一座" = "「「「誰だ！？」」」"
"10011040-22-魑魅一座A" = "（チセ様ではない……！？この服装、まさかゲヘナの万魔殿……！？）"
"10011040-23-魑魅一座のリーダー" = "ち、チセ様のサインもらいたかったのに！"
"10011040-24-魑魅一座のリーダー" = "残念っす！"
"10011040-25-魑魅一座A" = "そんなことを言ってる場合か！？"
"10011040-26-イブキ" = "あれ？"
"10011040-27-？？？" = "そこのあんたたち！そんなところで何してるの？"
"10011040-28-イブキ" = "なっ、もう尻尾を掴まれたのか！？"
"10011040-29-シズコ" = "あんたたち誘拐役でしょ？イベントは始まったのに、何をボーっとしてるのよ。"
"10011040-30-魑魅一座B" = "お、お祭り運営委員会の、委員長……？"
"10011040-31-シズコ" = "ほら、逃走ルートはこっちだ！"
"10011040-32-魑魅一座B" = "わ、私たちが逃げられるように助けてくれるんすか……！？"
"10011040-33-魑魅一座B" = "そういえば聞いたことがある……"
"10011040-34-魑魅一座B" = "お祭り運営委員会の委員長は、お金の為ならどんな手段とも厭わない非情な奴だと！"
"10011040-35-魑魅一座A" = "まさか……これも「ニヤニヤ教授」の計画っすか！？"
"10011040-36-魑魅一座のリーダー" = "そ、そういうことだったのか……！"
"10011040-37-シズコ" = "……何言ってんの？何か変な言葉が聞こえた気がするし……。"
"10011040-38-シズコ" = "まあとにかく、こんなことしてる場合じゃないわ。ほら、急ぎなさい！"
"10011040-39-魑魅一座のリーダー" = "え、ええっ……？"
"10011040-40-シズコ" = "何か、見た目が魑魅一座っぽくて気分が悪いけど……"
"10011040-41-シズコ" = "まあ公演の途中だし、魑魅一座がここにいるわけないし……うん。"
"10011040-42-シズコ" = "えっと、とにかく次はたしか……。"
"10011040-43-フィーナ" = "委員長！フィーナ、到着しマシタ！"
"10011040-44-シズコ" = "あっ、お疲れ様！よし、じゃあ私たちも準備するわよ！フィーナ！"
"10011040-45-ミチル" = "魑魅一座、たしかこっちの方に……！"
"10011040-46-ミチル" = "イズナからは逃げられませんよー！"
"10011040-47-ミチル" = "はぁ、はぁ……！"
"10011040-48-？？？" = "ちょっと"
"10011040-49-シズコ" = "待ったぁ！"
"10011040-50-フィーナ" = "ここは通しマセン！"
"10011040-51-ミチル" = "なっ……！？"
"10011040-52" = "[s] \"シズコに、フィーナ？\""
"10011040-53-フィーナ" = "色んな挑戦者が来るとは聞いてましたが、まさか先生もいるとは……"
"10011040-54-シズコ" = "シズコ、びっくりです☆"
"10011040-55-フィーナ" = "フィーナも、心が痛いデス！かつては一緒に、大魔王ニャン天丸を倒した仲ですが……今は一時的にでも、袂を分かった状態！"
"10011040-56-フィーナ" = "任侠の道は、非情なデスから！"
"10011040-57" = "[s] \"どういうこと……！？\""
"10011040-58-ミチル" = "え、百夜堂のオーナーじゃん！どうして私たちの行く手を……まさかあなた達も、魑魅一座の仲間だったの！？"
"10011040-59-シズコ" = "あ、えっと確か……自称忍者を率いる謎の変人集団って噂の……。"
"10011040-60-ミチル" = "だ、誰が変人だって！？"
"10011040-61" = "[s] \"百鬼夜行、不思議な集団が多いのは確かかもね……。\""
"10011040-62-シズコ" = "何か言いましたか、先生？"
"10011040-63-ツクヨ" = "百夜堂、聞いたことがあります……マニアックなサービスを、提供し、その対価を請求される、という……。"
"10011040-64-イズナ" = "業界の闇、というやつですか？イズナは騙されませんよ！"
"10011040-65-ツクヨ" = "ちょっとぉ！誤解されるようなこと言わないで！"
"10011040-66" = "[s] \"まあ、一部「マニアック」なのはそうかも。\""
"10011040-67-ツクヨ" = "先生まで！？"
"10011040-68-ツクヨ" = "と、とにかく今日の私たちは、公演のアトラクション担当なんです！"
"10011040-69-シズコ" = "……？"
"10011040-70-ミチル" = "あ、公演の試練の……？"
"10011040-71-シズコ" = "そうです！"
"10011040-72-シズコ" = "このアトラクションにおける「最初の関門」、それこそがこの私！"
"10011040-73-シズコ" = "百夜堂のアイドルでありオーナー！そして看板娘の、[ruby=かわわ]河和[/ruby]シズコ！"
"10011040-74-フィーナ" = "そしてフィーナ、デス！お頭ぁ！"
"10011040-75-シズコ" = "ふふふっ、何を隠そう私がここにいるのは……"
"10011040-76-シズコ" = "これが最初の関門、つまり看板みたいなものだからです！看板娘だけに！"
"10011040-77" = "[ns] \"……笑った方が良い？\""
"10011040-78-シズコ" = "要りませんっ！！！"
"10011040-79-シズコ" = "上手い洒落じゃないことくらい分かってるので！"
"10011040-80-シズコ" = "とにかく台本はさておき、仕切り直しです！"
"10011040-81-シズコ" = "誘拐されたお姫様を助けにきた皆さん、この私シズコと……！"
"10011040-82-シズコ" = "フィーナがお相手、いたしマ～～ッス！"
