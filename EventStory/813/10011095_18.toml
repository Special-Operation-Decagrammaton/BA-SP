[translation]
"10011095-1-カエデ" = "い、イズナ、もうヘロヘロです……。"
"10011095-2-カエデ" = "戦車って、あんなに怖いもの、だったんですね……。"
"10011095-3-イズナ" = "うぇ、もう疲れたぁ……。"
"10011095-4-イロハ" = "先生……イブキのこと、どうか……。"
"10011095-5" = "[ns] \"……ミチル、立てる？\""
"10011095-6-ミチル" = "う、うん。何とか……。"
"10011095-7" = "[s] \"残ったのは、私たちだけかな。\""
"10011095-8-ミチル" = "……"
"10011095-9-ミチル" = "行こう、先生殿。約束を、果たすために……！"
"10011095-10-魑魅一座A" = "到着だ！陰陽部の部長はどこだ……！？"
"10011095-11-魑魅一座B" = "どこっすか！？"
"10011095-12-魑魅一座A" = "にゃはは、お疲れ様～。"
"10011095-13-魑魅一座のリーダー" = "なっ、映像投影！？"
"10011095-14-ニヤ" = "さあ、公演も遂に大詰め。最後の最後に笑うのは、一体誰なのでしょう～？"
"10011095-15-ミチル" = "はぁ、はぁ……。"
"10011095-16-ミチル" = "ふう……。"
"10011095-17-ミチル" = "お姫様、返してもらうよ……！"
"10011095-18-ミチル" = "（とは言ってみた、ものの……）"
"10011095-19" = "[s] \"頑張ろう、ミチル。\""
"10011095-20-ミチル" = "（……ってあれ、先生殿が妙案をくれるとかじゃない感じ！？）"
"10011095-21-ミチル" = "（うっ……つまり基本的に私ひとりで、）"
"10011095-22-ミチル" = "（魑魅一座を相手する……？）"
"10011095-23-魑魅一座のリーダー" = "ええいっ、それ以上近づくな！"
"10011095-24-イブキ" = "この姫を、投げ落とされたくなかったらな……！"
"10011095-25-ニヤ" = "おおっと、白熱してまいりました～！"
"10011095-26-ニヤ" = "筋書き通りなんでしょうが、あの発言はＯＫなのでしょうか～？"
"10011095-27-イブキ" = "ああもう、筋書きだとか何だとか、うるさいぞ陰陽部……！"
"10011095-28-ミチル" = "（いやいやいや何もできないじゃん！？イブキちゃんを落とされるわけにはいかないし、私なんかじゃもう無理……！）"
"10011095-29-ミチル" = "（よく考えてみたらここまで来れたのだって、みんなのおかげで……私はただ勢いに任せて、ここまで来ただけ……）"
"10011095-30-ミチル" = "（こんな時に限って、何の役にも立たない……！）"
"10011095-31-ミチル" = "（あんなに大口叩いたのに！正式な部活にって言ったのに！ツクヨに、イズナに、あれだけ励ましてもらったのに……！）"
"10011095-32-ニヤ" = "おおっと、どうやらあの挑戦者……何かを悩んでいるようですねぇ？"
"10011095-33-ミチル" = "（ああもう五月蠅いなぁ！？悩むに決まってるじゃん！こんな、一歩間違えたら全部終わりの状況で）"
"10011095-34-ミチル" = "（……足だって震えるし、心臓も破裂しそうだってば！）"
"10011095-35-ミチル" = "（こんなことになって……あんな、電気が消えるだけで怖がってたイブキちゃんも、きっと怖くて震えてるはず……）"
"10011095-36-イブキ" = "忍者の、おねえちゃん？"
"10011095-37-ミチル" = "あ、イブキ……！"
"10011095-38-イブキ" = "やっぱり忍者のおねえちゃんだ！イブキ、ちゃんとおとなしくしてたよ！"
"10011095-39-ミチル" = "って、全然泣いてない……？"
"10011095-40-イブキ" = "？？？"
"10011095-41-ミチル" = "え、いや、誘拐されたんだし、すごく怖かったんじゃないかなーって……"
"10011095-42-イブキ" = "全然そんなこと無いよ！だって――"
"10011095-43-イブキ" = "「何があっても絶対助けに行くって」、約束してくれたから！"
"10011095-44-ミチル" = "……！"
"10011095-45-ツクヨ" = "私たち、約束したじゃないですか……！「何があっても絶対助けに行く」って！"
"10011095-46-ミチル" = "……っ！"
"10011095-47" = "と、止まれ！下手に動いたら、この子の安全は保障しないぞ！？"
"10011095-48" = "う、嘘じゃないからな！？それ以上来たら、本当に……！"
"10011095-49" = "あっ"
"10011095-50" = "[ns] \"イブキ！危ない！\""
"10011095-51-ミチル" = "（間に合ええぇぇぇぇっ！！）"
"10011095-52-ミチル" = "（せぇ、のっ……！）"
"10011095-53-ミチル" = "ミチル流忍法っ！！"
"10011095-54" = "捕まえたっ！！"
"10011095-55" = "[s] \"ミチル、ナイス！待ってて、すぐに引き上げる！\""
"10011095-56" = "あははっ！イブキ捕まっちゃったー！"
"10011095-57" = "うん！もう大丈夫、あとは先生殿に引き上げてもらえれば……"
"10011095-58" = "……え゛"
"10011095-59-ミチル" = "うぎゃあああっ！？お、落ちる落ちる落ちる！？"
"10011095-60-ツクヨ" = "イズナちゃん……！！"
"10011095-61-イズナ" = "はい、ツクヨ殿！"
"10011095-62" = "ま、間に合いました……！"
"10011095-63" = "主殿！お助けいたします！"
"10011095-64" = "[s] \"みんな、ありがとう……。\""
"10011095-65-ミチル" = "し、死ぬかと思ったあぁぁぁぁ……！！"
"10011095-66-ミチル" = "あ、イブキ大丈夫！？"
"10011095-67-ミチル" = "うん！忍者のおねえちゃんたち、助けてくれてありがとう！"
"10011095-68-イブキ" = "……良かった。"
"10011095-69-イズナ" = "はい、約束、しましたから……忍者の鉄則、です！"
"10011095-70-ツクヨ" = "忍術研究部、大勝利ですね！ニンニン！"
"10011095-71-魑魅一座B" = "これは、えっと……。"
"10011095-72-魑魅一座A" = "全部終わりぽいっすね。"
"10011095-73-魑魅一座A" = "くっ、まだだ！このまま失敗に終わるわけには……！"
"10011095-74-イロハ" = "……そこの方々。"
"10011095-75-イロハ" = "イブキを巻き込んだ罪は、重いですよ。"
"10011095-76-魑魅一座" = "ひいいっ！？"
