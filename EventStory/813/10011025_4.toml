[translation]
"10011025-1-チンピラA" = "ぐあぁっ！？"
"10011025-2-チンピラB" = "な、なんだこいつら……。"
"10011025-3-チンピラB" = "って、よく見たらシャーレの先生じゃねぇか！"
"10011025-4-チンピラB" = "それってあの、「酷い目に遭いたくなかったら近寄るな」って言われてるあの！？"
"10011025-5" = "[s] \"どこからそんなお話が……。\""
"10011025-6-チンピラA" = "くそっ、本気でヤバい奴だ！逃げろ！"
"10011025-7" = "[ns] \"出所が気になる……ところでツクヨ、お疲れ様。大丈夫？\""
"10011025-8-ツクヨ" = "せ、先生ーーーーー！"
"10011025-9" = "[ns] \"そろそろ落ち着いた？\""
"10011025-10-ツクヨ" = "ありがとうございます、先生……。"
"10011025-11-ツクヨ" = "その、お手数をかけて、すみません……。"
"10011025-12" = "[s1] \"ううん、こっちこそかわせなくてごめんね。\"\n[s2] \"むしろありがとう。\""
"10011025-13-ツクヨ" = "……。"
"10011025-14-ツクヨ" = "私、こうして身体ばっかり大きいせいで……。"
"10011025-15-ツクヨ" = "よく、目を付けられる、と言いますか……。"
"10011025-16-ツクヨ" = "その、助けていただき、ありがとう、ございます……。"
"10011025-17" = "[s] \"気に病むことじゃないと思うよ。じゃあ行こうか。\""
"10011025-18-ツクヨ" = "はいっ……！"
"10011025-19-ツクヨ" = "……。"
"10011025-20-ツクヨ" = "……。"
"10011025-21" = "[s] \"……私の顔に、何か付いてる？\""
"10011025-22-ツクヨ" = "あ、いえ、そうではなく……！"
"10011025-23-ツクヨ" = "すみません、その、変に見つめてしまって……。"
"10011025-24" = "[s] \"ううん、気にしないで。単にどうしたのかなって。\""
"10011025-25-ツクヨ" = "えっと、それはですね……"
"10011025-26-ツクヨ" = "あの……"
"10011025-27-ツクヨ" = "何と言いますか……"
"10011025-28-ツクヨ" = "イズナちゃんの「主殿」がどんな方なのか、"
"10011025-29-ツクヨ" = "ずっと気になってて……。"
"10011025-30" = "[s] \"ああ、なるほど。\""
"10011025-31-ツクヨ" = "イズナちゃん、忍術研究部に入って以来、"
"10011025-32-ツクヨ" = "ずっと言ってるんです……"
"10011025-33-ツクヨ" = "「主殿のために、キヴォトスいちの忍者になります！」って。"
"10011025-34-ツクヨ" = "あ、そのたびに部長が、「一応聞くけど、変な人に騙されたりしてない？」とも……。"
"10011025-35" = "[s] \"あー……。\""
"10011025-36-ツクヨ" = "あ、いえ！先生が怪しいですとか、そういったわけではなく……！"
"10011025-37-ツクヨ" = "えっと、会う前は少しだけ、頭をよぎらなかったわけではないのですが……。"
"10011025-38-ツクヨ" = "イズナちゃんがそれを言う時、いつも笑顔で……。"
"10011025-39-ツクヨ" = "私も会ってみたいなって、思って、たので……。"
"10011025-40" = "[s3] \"なるほど。直接会ってみてどう？\"\n[s4] \"どんな感じの印象だった？\""
"10011025-41-ツクヨ" = "えっと、その、決して悪い感じでは無くて……！"
"10011025-42-ツクヨ" = "突然の訪問、だったのに……拒絶されたり、しませんでしたし……。"
"10011025-43" = "[s] \"なるほど？\""
"10011025-44-ツクヨ" = "怒られたりもしませんでしたし……"
"10011025-45-ツクヨ" = "「忍者」って言っても、笑ったり、しなくて……。"
"10011025-46-ツクヨ" = "陰陽部のところに行ったときは、私たちのために、あんなことを言ってくれて……。"
"10011025-47-ツクヨ" = "びっくり、しました。"
"10011025-48-ツクヨ" = "こういう人もいるんだな、って。"
"10011025-49-ツクヨ" = "だから、嬉しかったんです。"
"10011025-50-ツクヨ" = "イズナちゃんも、部長も、喜んでると思います。"
"10011025-51" = "[s] \"三人とも、仲良しだね。\""
"10011025-52-ツクヨ" = "あ……"
"10011025-53-ツクヨ" = "は、はいっ！"
"10011025-54-ツクヨ" = "最初は私も、ここにいて良いのかなって、すごく、心配でしたが……。"
"10011025-55-ツクヨ" = "イズナちゃんのことも、好きですし、部長も、尊敬してます。"
"10011025-56-ツクヨ" = "こんな、ただ身体が大きいだけの私に……"
"10011025-57-ミチル" = "あなたがツクヨ？"
"10011025-58-ツクヨ" = "こんな、私でも……"
"10011025-59-ツクヨ" = "とにかく、その、頑張りたいんです！"
"10011025-60-ツクヨ" = "忍者の鉄則に則って、私も、負けないように……！"
"10011025-61-ツクヨ" = "上手く行ってるかは、怪しいですが……。"
"10011025-62-ツクヨ" = "とにかく、まずは。今日の公演を……！"
"10011025-63" = "[s5] \"……そっか。\"\n[s6] \"ツクヨならきっとできるよ。\""
"10011025-64-ツクヨ" = "は、はい、ありがとうございます……！"
"10011025-65-イズナ" = "あ、ツクヨ殿ー！"
"10011025-66-ミチル" = "二人とも遅い～、もう待ちくたびれたよー。"
"10011025-67-ツクヨ" = "あ、お待たせ、しました……！"
