[translation]
"10011005-1" = "プロローグ;忍者襲来！"
"10011005-2" = "シャーレ・休憩室"
"10011005-3" = "（シャーレの業務が終わり、休憩していたところ……）"
"10011005-4" = "[ns] \"あれ、電気が……？\""
"10011005-5-？？？" = "ふっふっふ！無事に潜入に成功！"
"10011005-6-？？？" = "わぁ……本当に、潜入できちゃうなんて……あの、噂のシャーレに……！"
"10011005-7-？？？" = "忍者の鉄則その壱！「忍者とはいついかなる状況でも、躊躇わずに挑戦するもの」！だからね！"
"10011005-8-？？？" = "これで、シャーレを我が手中に……！"
"10011005-9-？？？" = "すごいことに、なってきましたね……！"
"10011005-10-？？？" = "忍者であるならば、後先まで考えず、とにかくやってみることも、大切……"
"10011005-11-？？？" = "部長のその精神、忘れないように、メモしておきます……！"
"10011005-12-？？？" = "……それ、褒めてるんだよね？何か曲解されてない？"
"10011005-13-？？？" = "えっと、とにかく早く行こう！忍者走りでね、シュタタタタタタッって！"
"10011005-14-？？？" = "はいっ、シュタタタタタタッ……！"
"10011005-15" = "[ns] \"えっと……。\""
"10011005-16-？？？" = "………へ？"
"10011005-17-？？？" = "あ、え………？"
"10011005-18" = "[s] \"君たちは……？\""
"10011005-19-ツクヨ" = "あ、あああ慌てないでツクヨ！こういう時こそ思い出すの！"
"10011005-20-ツクヨ" = "忍者の鉄則！その弐ッ！"
"10011005-21-ミチル" = "あっ、はいっ！"
"10011005-22-ツクヨ" = "「忍者とはどんな窮地でも、決して諦めないもの」……！"
"10011005-23-ミチル" = "そう！というわけでこうなったら、二人で同時に「アンブッシュ・術」だよっ！"
"10011005-24-ツクヨ" = "え、それって、良いんでしょうか……？"
"10011005-25-ミチル" = "大丈夫大丈夫、GO！"
"10011005-26" = "[s] \"いや、ちょっ、待っ――\""
"10011005-27-ツクヨ" = "あ、部長。電気が……"
"10011005-28-ミチル" = "何でぇっ！？"
"10011005-29-イズナ" = "イズナ、参上です！"
"10011005-30-ツクヨ" = "あっ、イズナちゃん……！"
"10011005-31-イズナ" = "主殿の声が聞こえたので、シュババっと参りました！"
"10011005-32-イズナ" = "あの声、もしや主殿の危機……！？"
"10011005-33-イズナ" = "そうとあっては、黙っていられません！"
"10011005-34-イズナ" = "イズナ、加勢いたします！"
"10011005-35-ミチル" = "イズナ待ったぁ！それは計画と違――"
"10011005-36-イズナ" = "ニンニンっ！"
"10011005-37" = "[s] \"うわああっ！？\""
"10011005-38" = "（その後なんとか説得に成功し、急に襲ってきた三人を落ち着かせることができた）"
"10011005-39" = "シャーレ・オフィス"
"10011005-40-ミチル" = "もーっ、イズナ！あれじゃ作戦と違うじゃん！"
"10011005-41-イズナ" = "うう……でも部長！"
"10011005-42-イズナ" = "主殿の声を聴いてしまった瞬間、いてもたってもいられず……。"
"10011005-43-イズナ" = "やはり忍者として、ジッとしていることはできませんでした！"
"10011005-44-ミチル" = "いやいやいや、それは良いことだけど！"
"10011005-45-イズナ" = "でも、その……素早く駆けつけてきたイズナちゃん……。"
"10011005-46-イズナ" = "その、すっごくカッコ良かったと、思うよ。"
"10011005-47-ミチル" = "えへへっ！ありがとうございます、ツクヨ殿！"
"10011005-48-ミチル" = "えへへ……。"
"10011005-49" = "[s] \"えっと、イズナの知り合い……なのかな？どうしてここに……？\""
"10011005-50-イズナ" = "ん？"
"10011005-51-イズナ" = "あー、えっと、その……私たちは……。"
"10011005-52-ツクヨ" = "あ、主殿……！？まさか……！"
"10011005-53" = "[s] \"……まさか？\""
"10011005-54-ミチル" = "イズナと共に過ごした日々を、忘れてしまったのですか！？"
"10011005-55-イズナ" = "もしかして、先ほどの衝撃ですべての記憶を失ったという展開ですか！？"
"10011005-56" = "[s] \"いや、そうじゃなくてイズナのことは勿論知っ――\""
"10011005-57-イズナ" = "そういえばイズナ、忍者ドラマで見たことがあります！主を守るために我が身を賭した忍者が、不意に襲われ……！"
"10011005-58-イズナ" = "ついに記憶喪失になってしまう、涙なしでは見られないあの展開を！それが、主殿に降りかかってしまったという……！？"
"10011005-59" = "[s] \"イズナ、待っ――\""
"10011005-60-イズナ" = "イズナと主殿が初めて会ったあの瞬間を……！イズナの夢を応援してくれると言ったあの時を……！忘れてしまったのですか！？"
"10011005-61-イズナ" = "幾つもの修羅場を潜り抜け、あの天下の大悪党……"
"10011005-62-イズナ" = "世界を支配しようとしていたあの大魔王「ニャン天丸」を、イズナたちと一緒に倒したではありませんか！あの思い出まで、失われてしまったのですか……！？"
"10011005-63" = "[s] \"そ、そこまでの一大イベントは記憶に無いけど……。\""
"10011005-64-イズナ" = "イズナ、悲しいです……ですが、ご安心ください！"
"10011005-65-イズナ" = "たとえ主殿が全て忘れてしまったとしても……思い出はまた、重ねていけば良いのですから！"
"10011005-66-イズナ" = "イズナは何があっても、主殿の忠実な忍者です！そして主殿は、いつまでもイズナの主殿ですから！ニンニン！"
"10011005-67" = "[s1] \"それは嬉しいけど、そうじゃなくて……。\"\n[s2] \"イズナ以外の子は初対面だよね、初めまして。\""
"10011005-68-ミチル" = "なるほど、私たちの正体について知りたいと……。"
"10011005-69-ミチル" = "それではあらためて……"
"10011005-70-ミチル" = "ドーモ、お初にお目にかかります、先生殿……小生、ミチルと申す。"
"10011005-71-ミチル" = "初め、まして……！ツクヨと、言います……。"
"10011005-72-ミチル" = "そして、イズナはイズナです！主殿！"
"10011005-73" = "[s] \"こんにちは……って、先生「殿」？\""
"10011005-74-イズナ" = "ふっふっふ……何を隠そう私たち3人は、そう！"
"10011005-75-イズナ" = "さあイズナ、ツクヨ！"
"10011005-76-ミチル" = "はい、部長！"
"10011005-77-ミチル" = "はいっ……！"
"10011005-78-イズナ" = "いざ、忍者流ハイパー決めポーズだよっ！"
"10011005-79" = "[s] \"忍者流、ハイパー……？\""
"10011005-80-ミチル" = "忍者とは何なのか！そして、忍法とは何なのか！"
"10011005-81-ミチル" = "忍者の、真髄……！"
"10011005-82-ミチル" = "その本質を研究し、探究し、そして究明する……"
"10011005-83-ミチル" = "忍者の魅力を広めるために暗躍する、キュートな忍者三人組！"
"10011005-84-ミチル" = "なのです！"
"10011005-85-ミチル" = "泣く子も笑う、"
"10011005-86-ミチル" = "百鬼夜行連合学院最強の忍者集団！"
"10011005-87" = "[s] \"……？\""
"10011005-88-ミチル" = "その名も、「忍術研究部」！"
"10011005-89-イズナ" = "です！"
"10011005-90-ツクヨ" = "です……。"
"10011005-91-ミチル" = "そして、私が忍術研究部の部長！[ruby=ちどり]千鳥[/ruby]ミチル！"
"10011005-92" = "[s] \"なるほど……？それで、忍術研究部がどうしてここに？\""
"10011005-93-ミチル" = "ふっふっふ……ふーっふっふっふ！"
"10011005-94-ミチル" = "先生殿は今、こう考えてるんでしょ。"
"10011005-95-ミチル" = "「なんてカッコよくて可憐な、美少女忍者たちなんだろう！」……と。"
"10011005-96" = "[s] \"う、うん……。\""
"10011005-97-ミチル" = "そして、こうも思ったはず。"
"10011005-98-ミチル" = "「この子たちを応援したい！その成長中の翼を広げ、広い世界へと羽ばたけるように、大人の力で支えてあげたい！」……と。"
"10011005-99-ミチル" = "みなまで言わずとも分かるよ。そうなると思って、これを準備しておいたの！"
"10011005-100" = "[ns] \"「部活の認可に関する推薦状」……？\""
"10011005-101-ミチル" = "さあ、ここにサインを！"
"10011005-102" = "[s3] \"これを貰うために、ここへ？\"\n[s4] \"っていうことは忍術研究部は、まだ正式な部活じゃないってこと？\""
"10011005-103-ミチル" = "部長、そうだったのですか？イズナ、今初めて知りました！"
"10011005-104-ミチル" = "私も、てっきり……先生に挨拶するため、なのかな、って……。"
"10011005-105-イズナ" = "そ、それもあるけど！"
"10011005-106-イズナ" = "……こほん。先生殿の噂は聞いてるよ。何でもすんごいパワーがあるんだって！"
"10011005-107-イズナ" = "その力があれば、部活の認可も叶えられる……でしょ！？だからお願い！"
"10011005-108" = "[s] \"それはちょっと難しいかな……。\""
"10011005-109-イズナ" = "なっ……！？"
"10011005-110-ミチル" = "えっ……。"
"10011005-111-ミチル" = "？？？"
"10011005-112-イズナ" = "ど、どうして……！？まさか先生殿も……"
"10011005-113-イズナ" = "「忍者を研究する部活なんて、そんなよく分からない活動は認められない」ってこと……！？"
"10011005-114" = "[s] \"そうじゃなくて、普通にちゃんとした手続きが必要なんじゃない？\""
"10011005-115-ミチル" = "そ、それはそうだけど……でも……。"
"10011005-116-ミチル" = "で、でも！カホはこんな活動、絶対に認めてくれない！"
"10011005-117-ミチル" = "その、えっと……そう！承認がおりるまですごく時間がかかるし、かなり厳しいし……。"
"10011005-118-イズナ" = "……？"
"10011005-119-ツクヨ" = "か、カホさんってそんなに厳しい方……でしたっけ……？"
"10011005-120-ミチル" = "そ、そうじゃない時もあるけど……と、とにかくお願い、先生殿！"
"10011005-121" = "[s] \"うーん、何とかしてあげたいのは山々だけど……。\""
"10011005-122" = "[ns] \"またお客さん……？\""
"10011005-123-カホ" = "……初めまして、先生。私は陰陽部の副部長、[ruby=くわかみ]桑上[/ruby]カホと申します。"
"10011005-124-カホ" = "陰陽部よりシャーレへと依頼したいことがありまして、こちらへ参りました。"
"10011005-125-カホ" = "少々お時間をいただけますでしょうか？"
"10011005-126-カホ" = "うにゃっ！噂をすればなんとやら……！？"
"10011005-127-カホ" = "……あら。"
"10011005-128" = "[s] \"陰陽部ってことは、百鬼夜行の……？\""
"10011005-129" = "#video;10011"
