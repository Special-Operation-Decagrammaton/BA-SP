[translation]
"10011030-1" = "第3話;忍者と言えばお姫様？"
"10011030-2" = "（公演が始まる約30分前……）"
"10011030-3" = "[ns] \"舞台の裏側って、こうなってるんだね。\""
"10011030-4-イズナ" = "緊張、してきました……。"
"10011030-5-イズナ" = "イズナもドキドキしています！胸がそれはもうバクバクと！"
"10011030-6-ミチル" = "みんな固いよ～？そんな大変そうなことじゃないし、気楽に気楽に♪"
"10011030-7-ツクヨ" = "その、先生……あらためてですが、えっと……こういう機会をいただき、ありがとう、ございます……！"
"10011030-8-イズナ" = "そうですね、これも主殿のおかげです！"
"10011030-9" = "[s1] \"私の独断で認可を出すわけにもいかないからね。\"\n[s2] \"ミチルは何かの理由で、申請書が出せないみたいだし……。\""
"10011030-10-ミチル" = "うっ……！そ、それは……"
"10011030-11-ミチル" = "た、ただ、その……"
"10011030-12-ミチル" = "と、とにかく！ここで忍者として、かっこいい活躍を見せれば良いだけの話！"
"10011030-13-ミチル" = "とりあえずそれだけ！"
"10011030-14-ミチル" = "私も、頑張ります……！カッコ良い、忍者に、なるために……！"
"10011030-15-ミチル" = "イズナも負けません！はい！"
"10011030-16" = "[s] \"みんな、本当に忍者が好きなんだね。\""
"10011030-17-ツクヨ" = "ふふっ、そりゃあ当然！なんたって忍術研究部だからね！"
"10011030-18-ミチル" = "イズナも大好きです！キヴォトスいちの忍者になりたいですし！"
"10011030-19-ミチル" = "私は、まだ、忍者についてはよく分かってるわけでは、ないのですが……。"
"10011030-20-イズナ" = "それは大丈夫！忍者は最高にクールでイケてる存在だから、時間ときっかけがあればどんどん好きになるって！"
"10011030-21-イズナ" = "私は忍者のことを、キヴォトス中のみんなに知ってもらいたい。動画チャンネルの運営も、そのためのもの！"
"10011030-22" = "[s] \"なるほど、そういうチャンネルだったんだ。\""
"10011030-23-イズナ" = "今はまあ、登録者数も少ない小さなチャンネルだけど……忍者の魅力をいっぱい知ってもらえたら、いつかは……！"
"10011030-24-ミチル" = "……うん、私は絶対に諦めない！なぜなら！？"
"10011030-25-ツクヨ" = "えっと、その、「諦めないことが」……！"
"10011030-26-イズナ" = "「忍者の鉄則だから」、です！ニンニン！"
"10011030-27" = "[s] \"ニンニン！……ところでこの「和楽姫」って、どんな公演なの？\""
"10011030-28-ミチル" = "和楽姫は映画村が誇るアトラクション……というか、「体験型イベント」でね。"
"10011030-29-ミチル" = "チセ様がとある名家のお姫様役で、"
"10011030-30-ミチル" = "ある日そのお家の名声を欲しがった悪党たちに誘拐されちゃうの。"
"10011030-31-ミチル" = "それを、公演を見てる観客――"
"10011030-32-ミチル" = "その全員が主人公になってお姫様を助けるために、映画村のあちこちにある試練を乗り越え、お姫様を救出する……。"
"10011030-33-ミチル" = "あらすじ自体は珍しいものじゃないけど、自分たちが参加するという臨場感ある体験が売りでね。"
"10011030-34-ミチル" = "お姫様を救い出すために、観客同士で競争していくのも熱くて楽しいし。"
"10011030-35-ミチル" = "そういう色んな要素がある、映画村で一番人気のイベントってわけ。"
"10011030-36-ミチル" = "私はその、動画などで、見たことあるだけ、でしたので……。"
"10011030-37-ミチル" = "お手伝いできる、というのも、その……光栄、です！"
"10011030-38-イズナ" = "たしかに。お手伝いって立場だけど、やっぱワクワクしちゃう……"
"10011030-39-ツクヨ" = "って、あれ！？よく考えたら「和楽姫」のお姫様役ってチセ様じゃん！？"
"10011030-40-ミチル" = "これはもしかして、上手く行ったらサインとか貰えちゃったりするんじゃ……！？"
"10011030-41-ツクヨ" = "なるほど……！陰陽部の関係者としての、立場を利用し、お宝を手に入れると……！"
"10011030-42-ツクヨ" = "これが忍者、なのですね……！さすが部長、です！"
"10011030-43-イズナ" = "……？"
"10011030-44-ミチル" = "ツクヨ、それ褒めてる……？"
"10011030-45-ミチル" = "ま、まあそうとは限らないけどね！任務第一だし、でも貰えるチャンスがあるなら……"
"10011030-46-ミチル" = "スタッフのみなさん、準備をお願いします。"
"10011030-47-公演スタッフ" = "もうすぐ「和楽姫」様が到着しますので。"
"10011030-48" = "[ns] \"ってことは、チセがそろそろ来るってことだよね。\""
"10011030-49-ミチル" = "えっと、予行演習予行演習……！ち、チセ様、その、私ずっと前からファンで……！"
"10011030-50-ミチル" = "イブキ登場！！おっ待たせーー！"
"10011030-51-ミチル" = "……え？"
"10011030-52-ツクヨ" = "ゲヘナの、生徒さん……？"
"10011030-53-ニヤ" = "んふふっ……この度は交流会にご協力いただき、誠に感謝しますよ。マコト議長。"
"10011030-54-ニヤ" = "キキキッ、苦しゅう無い！！"
"10011030-55-ニヤ" = "むしろこちらが感謝したいくらいだな、陰陽部よ！"
"10011030-56-ニヤ" = "この交流会で、証明されるであろう……"
"10011030-57-マコト" = "元々存在する公演をより良いものとし、一生の思い出になるようなイベントを開催することができる……"
"10011030-58-マコト" = "その力を……この私、マコト様が持っているということがな！キキキキッ！！！"
"10011030-59-마토코" = "なるほど～。まあせっかくですしスパイスと言いますか、その証明がも～っと派手になるようなアイディアがあるんですが。"
"10011030-60-마토코" = "聞いてみません？マコト議長？"
"10011030-61-ニヤ" = "ふふっ、そこまで言うなら聞かせてもらおうか？"
"10011030-62-ミチル" = "えーっと……つまり元々チセ様がやる予定の「和楽姫」役が、交代ってこと？"
"10011030-63-ミチル" = "ものすごく大事な公演って言ってたのに、変えちゃって大丈夫なのかな～……？"
"10011030-64-ミチル" = "え？イブキ、お姫様やっちゃダメってこと……？"
"10011030-65-ミチル" = "イブキのせいで、色々台無し……？"
"10011030-66" = "[s] \"イブキは何も悪いことしてないよ、大丈夫。\""
"10011030-67-イズナ" = "わ、わっ……？"
"10011030-68-イズナ" = "急に電気が……まさか、敵襲……！？"
"10011030-69" = "[s] \"みんな、大丈夫。落ち着いて。\""
"10011030-70-イブキ" = "う……。"
"10011030-71-ミチル" = "う……？"
"10011030-72-イブキ" = "うぃ……どうして急に、電気消すの……？"
"10011030-73-イブキ" = "イブキが悪いことしたから……？怖いよう、何も見えないよぅ……"
"10011030-74-イブキ" = "イロハ先輩……マコト先輩……うぅっ……。"
"10011030-75-ミチル" = "（わわっ……！この場で騒ぎになっちゃったら、）"
"10011030-76-ミチル" = "（せっかくのチャンスが……！）"
"10011030-77-ミチル" = "（と、とりあえず、何とかして慰めないと……）"
"10011030-78-ミチル" = "だ、大丈夫、安心して！これはただのトラブルだから！ね、先生殿！？"
"10011030-79" = "[s] \"うん、すぐ戻るんじゃないかな。\""
"10011030-80-ミチル" = "くすん……トラブル？"
"10011030-81-ミチル" = "そうそう！心配しないで、私たちも先生殿もそばにいるから！"
"10011030-82-ミチル" = "先生、は知ってるけど……おねえちゃんたちは、誰？"
"10011030-83-ミチル" = "イズナはイズナで、あちらはツクヨ殿です！そしてこちらが部長！私たちは三人一組！"
"10011030-84-イズナ" = "その名も忍術研究部！です！"
"10011030-85-イブキ" = "ニンジャ……？"
"10011030-86-ミチル" = "あ、えっと、忍者というのはその、例えっていうか……！"
"10011030-87-イブキ" = "……嘘、ってこと？"
"10011030-88-ミチル" = "え、えっと、そうじゃなくて……！"
"10011030-89-ツクヨ" = "嘘じゃない、です……！"
"10011030-90-イブキ" = "私たちは最強の忍者を目指す、忍術研究部……そもそも忍者は、ものすごく強いんですよ……！"
"10011030-91-イブキ" = "ですので、怖がらなくて大丈夫、です。えっと……イブキちゃん、ですよね？"
"10011030-92-イブキ" = "何があっても、私たち忍術研究部が……"
"10011030-93-イブキ" = "忍者が、お姫様であるイブキちゃんを、守りますから！ですよね、部長？"
"10011030-94" = "[s] \"忍者って、お姫様を守る存在だったっけ……？\""
"10011030-95-ミチル" = "先生殿、話をややこしくしないで！それは作品にもよるから！"
"10011030-96-イブキ" = "ぐすっ……。"
"10011030-97-ミチル" = "と、とにかく、そう！私たちが、君のことを守るから！"
"10011030-98-イブキ" = "そう、なの……？"
"10011030-99-ミチル" = "う。まあ、急に言われても安心はできないよね……うーん……"
"10011030-100-ミチル" = "そうだ！"
"10011030-101-ミチル" = "ほら、これを見てみて！"
"10011030-102" = "[s] \"見たことない忍者グッズが……。\""
"10011030-103-ミチル" = "……わぁ！"
"10011030-104-ミチル" = "（よし、喜んでくれてる……！）"
"10011030-105-イブキ" = "ねぇねぇ、何これ？イブキ、初めて見た！"
"10011030-106-イブキ" = "どう？かっこいいでしょ？"
"10011030-107-ミチル" = "ふふっ、これはね……「忍者ニンペロさん」の主人公、ニンペロさん！"
"10011030-108-ミチル" = "裏世界の偽忍者や悪党たちを追い払う、忍者の中の忍者なのさ！"
"10011030-109-イブキ" = "あはは、変なの！あ、翼が生えてる。引っ張っても良い？"
"10011030-110-ミチル" = "うわあっ！！そ、それは限定版だから、取り扱いは慎重にね……！"
"10011030-111-ミチル" = "こほん！……とにかく、今日はそのニンペロさんを貸してあげる。"
"10011030-112-ミチル" = "ニンペロさんと私たちが揃えば、たとえどんな危機がそなたに迫ったとしても大丈夫！"
"10011030-113-ミチル" = "何があってもお姫様の危機には駆けつけてみせよう！"
"10011030-114-イブキ" = "……約束、してくれる？"
"10011030-115-ミチル" = "もちろん、何があっても絶対助けに行く！忍者の鉄則、その参！"
"10011030-116-ミチル" = "「忍者とは、一度交わした約束は必ず守るもの」！"
"10011030-117" = "[s] \"良かったね、イブキ。\""
"10011030-118-イブキ" = "……うん、ありがとう！"
"10011030-119-イズナ" = "どういたしまして！"
"10011030-120-ツクヨ" = "えへへ……。"
"10011030-121-イズナ" = "あっ、電気が……。"
"10011030-122-イズナ" = "すぐ戻って、良かったです。"
"10011030-123-イズナ" = "ほらね、大したことじゃなかったでしょ？"
"10011030-124-公演スタッフ" = "お待たせしました、トラブルの対処をしており……それではお姫様役の方、ご準備を！そろそろ開演となります！"
"10011030-125-ミチル" = "イブキ殿、頑張ってください！"
"10011030-126-ミチル" = "いってらっしゃい、ませ……！"
"10011030-127-ツクヨ" = "ファイト！"
"10011030-128-イブキ" = "うん！忍者のおねえちゃんたち、先生。イブキ、行ってくるね！"
"10011030-129-ミチル" = "えっと、良かったですね。"
"10011030-130-イズナ" = "な、何とかなって良かったぁ……。"
"10011030-131-ミチル" = "遂に公演が始まりそうですね！"
"10011030-132-イズナ" = "うん。このまま何事もなく無事に終われば良いけど……。"
"10011030-133-ミチル" = "ん？あそこにいっぱいいるのって……あれもスタッフかな？"
"10011030-134" = "[ns] \"いや、あれは……！\""
"10011030-135-魑魅一座A" = "計画は頭に入れたな？では行動を開始する。迅速に進め、邪魔者は処理せよ……行くぞ、「魑魅一座・気まぐれ流」！"
"10011030-136-魑魅一座" = "「「ラジャー！！」」"
"10011030-137-ツクヨ" = "え、っと……！？部長、マズいの、では……！？"
"10011030-138-イズナ" = "部長、主殿、どうしましょう！？"
"10011030-139-ミチル" = "な、何なに！？急にどういうこと！？"
