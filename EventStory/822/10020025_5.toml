[translation]
"10020025-1-アユム" = "第2エリアの「次元エンジン」、破壊しました！！"
"10020025-2-アユム" = "し、シロコさんがまた逃げようとしています！"
"10020025-3-ホシノ" = "待って！！"
"10020025-4-ノノミ" = "シロコちゃん！！"
"10020025-5-シロコ" = "っ……。"
"10020025-6-アヤネ" = "ああっ……！？ま、また、逃げられました……。"
"10020025-7-ノノミ" = "ずっと、これを繰り返すのでしょうか……。"
"10020025-8-セリカ" = "アレを引き留めることなんてできるの……？"
"10020025-9-ホシノ" = "……。"
"10020025-10-ホシノ" = "いや……何か、違う。 "
"10020025-11-ノノミ" = "……え？ "
"10020025-12-ホシノ" = "あの子……あのシロコちゃんは、私たちを避けているように見える。"
"10020025-13-アヤネ" = "わ、私たちを……ですか？ "
"10020025-14-ホシノ" = "そんな感じがしたの。#n私たちと向き合うのを、どこか恐れているような……"
"10020025-15-ノノミ" = "……。"
"10020025-16-セリカ" = "な、なんで……！？#n怖がる必要なんてないじゃない！"
"10020025-17-アヤネ" = "……。"
"10020025-18-チヒロ" = "第2エリアの「次元エンジン」破壊を確認したよ。"
"10020025-19-チヒロ" = "これで4つのうちの2つのエリアを確保できた。#n半分はこっちのものになったね。"
"10020025-20-チヒロ" = "……あと1つ占領できれば、勝機はある。"
"10020025-21-ヒマリ" = "そうですね……箱舟の演算機能を半分確保できた事ですし――#n少し、積極的にいってみましょうか。"
"10020025-22-ヒマリ" = "これより――シロコさんの位置を追跡します。"
"10020025-23-ヒマリ" = "自由に走り回る彼女を捕らえるのでしたら……#nいつでも追跡できるよう、リードをつけておかなくては♪"
"10020025-24-ヒマリ" = "箱舟の中枢システムをハッキング――内部に存在する防御システム及び警報装置、通信網を漁ってみる事としましょう。"
"10020025-25-ヒマリ" = "何か進捗がありましたら、声を掛けますね。 "
"10020025-26-リン" = "……はい、よろしくお願いします。"
"10020025-27-リン" = "では先生、私たちは次の段階に移りましょう。 "
"10020025-28-リン" = "「アトラ・ハシースの箱舟」第3エリアへ突入――#n引き続き、指揮をお願いします！"
"10020025-29-ホシノ" = "ま、そういうことだから。#nこれからは私たちも手伝うよ、先生。"
"10020025-30-ノノミ" = "はい！エリアを2つ占領できたので、防衛側も余裕ができたんです。"
"10020025-31-アヤネ" = "船の防衛は、ゲーム開発部と美食研究会のみなさんにお任せして、私たちは先生と共に行くことになりました。"
"10020025-32-セリカ" = "そうよ！シロコ先輩を探して、捕まえてやるんだから！"
"10020025-33-ノノミ" = "うんうん！捕獲作戦スタートです～♧"
