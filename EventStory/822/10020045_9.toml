[translation]
"10020045-1-マキ" = "やったぁ！！"
"10020045-2-チヒロ" = "4つの次元エンジンを、全て破壊できた……！"
"10020045-3-コタマ" = "「アトラ・ハシースの箱舟」、全エリアのハッキング完了。#n占有率100%を達成。"
"10020045-4-ハレ" = "これで、箱舟の「自爆シーケンス」を起動できるよ。"
"10020045-5-チヒロ" = "皆、準備が完了したら報告して！"
"10020045-6-チヒロ" = "「自爆シーケンス」は一度起動したら取り消すことはできないからね。すぐ船に戻って！"
"10020045-7-アヤネ" = "制御室、破壊完了です！"
"10020045-8-ホシノ" = "シロコちゃんは？"
"10020045-9-アヤネ" = "シロコ先輩がいるセクションには、先生が向かわれました！"
"10020045-10" = "[ns] シロコのいる部屋の扉を開ける。"
"10020045-11-シロコ" = "……先生。"
"10020045-12" = "[s] \"シロコ……大丈夫？\""
"10020045-13-シロコ" = "ん。話したいことがたくさんあるけど、今はとりあえず行かないとだよね。"
"10020045-14" = "[s] \"そうだね。詳しい話はまた後で聞くね。\""
"10020045-15-アヤネ" = "シロコ先輩、大丈夫ですか！？"
"10020045-16-シロコ" = "ん、このまま先生と一緒に行く……道を教えて。"
"10020045-17-アヤネ" = "は、はい……！えっと……それでは、船がある、第1エリアに来てください！#n案内します！"
"10020045-18-シロコ" = "ん。お願い。"
"10020045-19-アヤネ" = "行こう、先生。"
"10020045-20" = "[ns] \"うん、行こうか。\""
