[translation]
"10037115-1" = "予"
"10037115-2" = "告"
"10037115-3" = "編"
"10037115-4-レイジョ" = "京劇の舞台で一体何が起きたのでしょう？#n会長は何か知っていますか？"
"10037115-5-ルミ" = "うーん……やっぱこの話題はここまで！今はお祭りの準備が最優先だからね。"
"10037115-6-サヤ" = "ま、待ってほしいのだ！絶対おかしいのだ！#n錬丹術研究会は今回の事件とは関係ないのだ！"
"10037115-7-玄龍門の構成員" = "あなたは重要参考人となっています。ご同行、願えますか――[ruby=やくし]薬子[/ruby]サヤ会長。"
"10037115-8-キサキ" = "「猿の手」にまつわる話を――知っておるか？"
"10037115-9" = "[ns1] \"単純に割り切れるような話ではないけれどね。\"\n[ns2] \"山海経の過去がそうであるように。\""
"10037115-10-カグヤ" = "京劇部は、京劇の為に存在する部活です。"
"10037115-11-ミナ" = "心配しないでください、とは言いません。#n門主様は、心優しいお方ですから。"
"10037115-12-ミナ" = "門主様が私を見捨てることはあっても、私が門主様を見限ることは絶対にありません。"
"10037115-13-カイ" = "私なら、君を治すことができるとも――なあ、キサキ？"
"10037115-14-カイ" = "だって……君がそうなったのは――"
"10037115-15-カイ" = "私のせいだからなあ？"
"10037115-16-キサキ" = "多くの生徒が苦しみ、山海経は混沌に陥った。"
"10037115-17-キサキ" = "惨劇を生み出した其方を――妾一人の安息のために、再び受け入れろと？"
"10037115-18-シュエリン" = "こんにちは、先生！"
