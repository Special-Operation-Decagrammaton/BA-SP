[translation]
"10037080-1" = "第8話;人形の言葉に耳を澄ませる"
"10037080-2-チェリノ" = "新しい京劇を披露するだなんて……斬新だな。"
"10037080-3-チェリノ" = "まあ、この前の劇も良かったし……楽しみにするとしよう！"
"10037080-4-キサキ" = "ああ[ruby=わらわ]、妾も[/ruby]期待しておる。#nカグヤがああも意欲的なのは久方ぶりじゃからのう。"
"10037080-5-チェリノ" = "うむ！この旋律にも少しは慣れてきたぞ！"
"10037080-6-チェリノ" = "鎧をまとった演者が次々と……！"
"10037080-7-チェリノ" = "おお、今回の主役は黒い鎧を着ているんだな！#nちょっとずつ細部も分かるようになってきたぞ！"
"10037080-8-キサキ" = "ふふ、良いことじゃ。"
"10037080-9-カグヤ" = "生とは、夢の如し。"
"10037080-10-京劇部員A" = "如何にして、その生を謳歌するのか。"
"10037080-11-京劇部員B" = "柱のそばで横になり――"
"10037080-12-京劇部員C" = "[ruby=こつぜん]忽然[/ruby]と目を覚まし、[ruby=ていぜん]庭前[/ruby]を歩く。"
"10037080-13-カグヤ" = "花の間に、一羽の鳥が囀っている。"
"10037080-14-京劇部員A" = "問おう、今は[ruby=なんどき]何時[/ruby]だ。"
"10037080-15-京劇部員B" = "春風のような[ruby=ウグイス]、鶯の[/ruby]声。"
"10037080-16-京劇部員C" = "流れるように歌いながら、月を待つ！"
"10037080-17-玄龍門の構成員A" = "序章はいつものように、世の風景を唄うシーンからだ……。"
"10037080-18-玄龍門の構成員B" = "京劇のお決まりだからね。"
"10037080-19-玄龍門の構成員A" = "たしか、今回はカグヤ部長が新しく劇を執筆したんだっけ？"
"10037080-20-玄龍門の構成員B" = "たった数日で書き上げるなんて、すごいよね。"
"10037080-21-京劇部員A" = "軽やかな霧が、湖面に立ち上り――"
"10037080-22-京劇部員A" = "陽射しが燦々と輝いている。嗚呼、今年も豊作だ。"
"10037080-23-京劇部員A" = "これ以上望むことなどなく――世は泰平なり。"
"10037080-24-京劇部員A" = "龍と鳳凰が吉兆を運んでくる。"
"10037080-25-京劇部員C" = "見よ！黒い君主だ！"
"10037080-26-京劇部員C" = "聡明で鋭敏だが、偏狭で愚劣なる者。"
"10037080-27-京劇部員C" = "統治し君臨すれども、傲慢で稚拙な者。"
"10037080-28-京劇部員C" = "己の未熟さには気づくが、"
"10037080-29-京劇部員C" = "それを克服するほどの勇気は無い者だ！"
"10037080-30-玄龍門の構成員A" = "…………は？今なんて？"
"10037080-31-玄龍門の構成員B" = "しっ！声が大きい！……聞き間違いじゃないよね？"
"10037080-32-玄龍門の構成員A" = "古典の引用なの、かな……？うーん、もうちょっと聞いてみるか……。"
"10037080-33-玄龍門の構成員B" = "でも、いくらなんでも露骨すぎない……？#n黒い君主って言ってたよね……。"
"10037080-34-カグヤ" = "[ruby=わらわ]妾、[/ruby]黒い君主が告げる。"
"10037080-35-カグヤ" = "隠されし争いは庭を覆い、隠されし恨みは屋根をも貫く。"
"10037080-36-カグヤ" = "閉ざされた門戸を開き、新しい風を巻き起こす。"
"10037080-37-カグヤ" = "それが妾の道――皆はこれに従うのじゃ。"
"10037080-38-サヤ" = "（……！？閉ざされた門戸を開き、新しい風を巻き起こす……？）"
"10037080-39-サヤ" = "（マズいのだ……他の生徒はどう思うのだ？）"
"10037080-40-サヤ" = "（玄龍門の生徒は他の生徒たち以上に、京劇に詳しいのに……）"
"10037080-41-サヤ" = "（カグヤ……一体何を考えているのだ！？）"
"10037080-42-京劇部員A" = "お許しください！お許しください！"
"10037080-43-京劇部員A" = "道義に反する者には処罰が下る。"
"10037080-44-京劇部員A" = "天の力の前では、人はか弱い存在に過ぎぬ。"
"10037080-45-京劇部員A" = "人の力では成す術などありませぬ。"
"10037080-46-カグヤ" = "泰平の中で、危機を憂い、"
"10037080-47-カグヤ" = "危機の中で、再び泰平を思ふ。"
"10037080-48-カグヤ" = "天地の調和は、予測できぬものなり。"
"10037080-49-カグヤ" = "巻き起こした風で不和を間引き、力で押しつぶす。"
"10037080-50-京劇部員C" = "見よ、人の知恵とはかくも短慮で――"
"10037080-51-京劇部員C" = "知謀を誇示する者ほど、愚かであろう。"
"10037080-52-京劇部員C" = "身に余る至福、理由なき幸運に警戒せよ。"
"10037080-53-京劇部員C" = "欲に目が眩めば、たちまちに呑まれるであろう。"
"10037080-54-玄龍門の構成員A" = "え、ちょっと……京劇部、どうしたんだ！？"
"10037080-55-玄龍門の構成員B" = "門主様に不満でもあるの？そうだとしても、訪問客が居ない時にやればいいのに……。"
"10037080-56-玄龍門の構成員A" = "もしかして……訪問客を連れてきたからじゃない！？"
"10037080-57-玄龍門の構成員B" = "そう、かもしれないね……#nそもそも他学園の生徒を招待したのが悪いんじゃ……？"
"10037080-58-京劇部員C" = "見よ、黒い君主は新しき風を起こした。"
"10037080-59-京劇部員C" = "閉ざされた門戸は開き、塵が世を覆う。"
"10037080-60-京劇部員C" = "水流は風に打ち勝てず、稲穂は[ruby=こうがい]蝗害[/ruby]に遭う。"
"10037080-61-京劇部員C" = "傲慢なる者は顧みず、大地は涙に濡れるだろう！"
"10037080-62-キサキ" = "（……！）"
"10037080-63-キサキ" = "（カグヤが、妾を……？皆の前で……！？）"
"10037080-64-キサキ" = "（うっ……まだ痛みが。じゃが……）"
"10037080-65-カグヤ" = "妾、黒い君主がもう一度告げよう。"
"10037080-66-カグヤ" = "山は高さを厭わず、海は深さを厭わぬもの。"
"10037080-67-カグヤ" = "地は風を歓迎し、天は雲を包む。"
"10037080-68-カグヤ" = "妾が天下を背くとも、天下は妾に背かせぬ！"
"10037080-69-京劇部員B" = "お許しください！どうか民をお思いください。"
"10037080-70-京劇部員B" = "[ruby=せいき]生起[/ruby]を知り、始まれば終わりを思うに――"
"10037080-71-京劇部員B" = "諫言を受けるのも、存続の為でしょう。"
"10037080-72-京劇部員B" = "目先の利益に囚われ民を失って、何の意味があるのでしょう！"
"10037080-73-チェリノ" = "黒い君主とかいう役、なかなか気概があるな！#nうむ、指導者とはああでなければな！"
"10037080-74-チェリノ" = "それに比べて、あの臣下は一体何を言っているんだ？"
"10037080-75-チェリノ" = "うむ！やはり偉大な指導者の志は、愚鈍な臣下には理解されないのだな！#nそうは思わないか、キサキ門主！"
"10037080-76-チェリノ" = "ん？顔色が悪いようだが……大丈夫か？"
"10037080-77-キサキ" = "ああ……案ずるでない、チェリノ書記長。"
"10037080-78-キサキ" = "（カグヤ、[ruby=そなた]其方[/ruby]はそこまで此度の交流会が気に食わなかったのか）"
"10037080-79-キサキ" = "（いいや……これは、京劇の形をした諫言……？）"
"10037080-80-京劇部員C" = "黒い君主が風を起こすと。"
"10037080-81-京劇部員C" = "天から暴雨が降り、川は氾濫する。"
"10037080-82-京劇部員C" = "海は荒波が立ち、竜巻が起きる。"
"10037080-83-京劇部員C" = "雷が鳴れば、大地は民の嘆きで覆い尽くされた！"
"10037080-84-玄龍門の構成員A" = "なぁ……私たち、何を聞かされてるんだ……？"
"10037080-85-玄龍門の構成員B" = "でも、門主様がレッドウィンターを招待したのは事実だし……。"
"10037080-86-玄龍門の構成員A" = "別に彼女らは騒ぎを起こしたりしてなくないか？"
"10037080-87-玄龍門の構成員B" = "いや……あの劇の内容も、何となく分かる気がするよ。#n「蟻の穴から堤も崩れる」って言うだろ？"
"10037080-88-玄龍門の構成員A" = "じゃあ……レッドウィンターの訪問客を始めとして、#n門主様はどんどん外部の人間を迎え入れるつもりって話？"
"10037080-89-玄龍門の構成員B" = "そう、ならないことを、願ってるけど……。"
"10037080-90-玄龍門の構成員B" = "前[ruby=まんねんじん]の萬年参事[/ruby]件の時も思ったけど、#n門主様って本当に山海経の伝統を重んじているのかな……。"
"10037080-91-玄龍門の構成員A" = "し、しぃーっ！声が大きい！"
"10037080-92-玄龍門の構成員A" = "ち、小さい声で話してるじゃん……。"
"10037080-93-京劇部員A" = "涙は川を成し、怨は天を衝く。"
"10037080-94-京劇部員A" = "良薬は口に苦し。"
"10037080-95-京劇部員A" = "諫言耳に逆らう。"
"10037080-96-京劇部員A" = "今からでも過ちを認め、正しい道を辿れば――"
"10037080-97-京劇部員A" = "まだ元通りにできるはずでありましょう。"
"10037080-98-カグヤ" = "妾は間違っておらぬ！其方らを罰してやろう！"
"10037080-99-京劇部員B" = "どうかお許しください！"
"10037080-100-カグヤ" = "[ruby=えんじゃく]燕雀[/ruby][ruby=いず]安[/ruby]くんぞ[ruby=こうこく]鴻鵠[/ruby]の志を知らんや！"
"10037080-101-京劇部員A" = "雀も鳳も、同じ命であります！"
"10037080-102-サヤ" = "（うわ……！）"
"10037080-103-サヤ" = "（カグヤ、一体何を考えているのだ……！いや、それより……）"
"10037080-104-サヤ" = "（玄龍門の構成員の空気が……これはマズいのだ！）"
"10037080-105-サヤ" = "（直接メッセージとして伝えれば良かったものを……！）"
"10037080-106-サヤ" = "（劇という形で批判するだなんて……しかもこんな公の場で……！）"
"10037080-107-サヤ" = "（早く、門主をこの場から避難させるのだ！）"
"10037080-108-トモエ" = "……炎が描かれた旗を持って、役者が舞台を走り回っていますね。"
"10037080-109-マリナ" = "あれは……世が火の海になっているのを意味するのでしょうか。"
"10037080-110-トモエ" = "今度は流れる水が描かれた旗を……。"
"10037080-111-マリナ" = "……これは、洪水でしょうか。"
"10037080-112-トモエ" = "雷に蝗害……今度はあらゆる災難が起きている様子を現していますね。"
"10037080-113-トモエ" = "（もしかして、と思ってずっと注視していましたが）"
"10037080-114-トモエ" = "（……これは、レッドウィンターで言うところのクーデターですね）"
"10037080-115-京劇部員C" = "――策士策に溺れる。"
"10037080-116-京劇部員C" = "君主とは本来、天下を正しく治めるものなり。"
"10037080-117-京劇部員C" = "貪欲と愚鈍のあまり、ついに天にも逆らってしまった。"
"10037080-118-京劇部員C" = "民が嘆いたところで、一体何が変わると言うのか。"
"10037080-119-玄龍門の構成員A" = "天にも逆らった、だと……？#nこれは、さすがに……。"
"10037080-120-玄龍門の構成員B" = "……でも、カグヤの言いたいことは分かるよ。"
"10037080-121-玄龍門の構成員A" = "おい……私たちの門主様なんだぞ？"
"10037080-122-玄龍門の構成員B" = "そうなんだけどさ……"
"10037080-123-玄龍門の構成員B" = "仮に、門主様が本当に……山海経の伝統を守るつもりが、無かったとしたら……？"
"10037080-124-玄龍門の構成員A" = "たらればを言ってもしょうがないでしょ……！"
"10037080-125-京劇部員B" = "見よ。あれが、我らの住処だ。"
"10037080-126-京劇部員B" = "草木が生い茂り、"
"10037080-127-京劇部員B" = "山の動物が庭に足を運ぶ。"
"10037080-128-京劇部員B" = "雉ですら、ここを立ち去っていく。"
"10037080-129-京劇部員B" = "雑穀を掻き集め、食い扶持をつなぎ。"
"10037080-130-京劇部員B" = "庭の雑草で汁を作り、ひたすらに水を足す。"
"10037080-131-京劇部員B" = "茶に染まった食卓、"
"10037080-132-京劇部員B" = "共に語らう者など居らず。"
"10037080-133-玄龍門の構成員B" = "ああ……なんて悲惨な状況だ。"
"10037080-134-玄龍門の構成員B" = "一緒に食事をする人も居なくなってしまうなんて……。"
"10037080-135-玄龍門の構成員B" = "もし、あれが山海経の未来だとしたら……？"
"10037080-136-玄龍門の構成員A" = "そ、そんな、わけ……ないだろう……！？"
"10037080-137-玄龍門の構成員B" = "ほら、言い切れる自信があるの？"
"10037080-138-京劇部員C" = "皆、聞くが良い。常に謙遜し、精進せよ。"
"10037080-139-京劇部員C" = "受け継がれてきたものには、それ相応の理由がある。"
"10037080-140-京劇部員C" = "昨日を振り返ることは明日に繋がるのだ。"
"10037080-141-京劇部員C" = "それらを蔑ろにしてしまえば、いずれは天罰が下るであろう。"
"10037080-142-京劇部員C" = "そして、このような事が起きぬよう――"
"10037080-143-カグヤ" = "――山海経の伝統の名のもと、玄龍門の門主、[ruby=りゅうげ]竜華[/ruby]キサキを糾弾するっ！"
"10037080-144-キサキ" = "……っ！"
