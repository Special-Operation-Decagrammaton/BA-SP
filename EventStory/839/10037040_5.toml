[translation]
"10037040-1" = "第4話;世を遊覧し、川を眺むる"
"10037040-2-チェリノ" = "うむ。流石は玄武商会の料理だな！"
"10037040-3-チェリノ" = "……と、言いたいところだが。"
"10037040-4-玄武商会のメンバーA" = "はい、[ruby=ぜんかふく]全家福[/ruby]ですね！#n干したナマコに、アワビ、サザエを野菜と一緒に煮込んだ料理です！"
"10037040-5-チェリノ" = "さすがにこれは量が多くないか！？"
"10037040-6" = "[s1] \"あはは……多分だけど……\"\n[s2] \"まだ半分も、出てきてないと思うよ……？\""
"10037040-7-チェリノ" = "おいら、そんなに食べれないぞ！？"
"10037040-8-チェリノ" = "……もちろん、味もおいしいし、もっと食べたいくらいだが！"
"10037040-9-ルミ" = "さぁさぁ、遠慮せずもっと食べてくださいね、チェリノ書記長！"
"10037040-10-ルミ" = "あたしは[ruby=あけしろ]朱城[/ruby]ルミ。#n玄武商会の会長で――ここの料理長です。"
"10037040-11-玄武商会のメンバーA" = "あれ？会長が接客するんですか！？"
"10037040-12-ルミ" = "もちろん。遠くから大切なお客さんが来ているのに、あたしだけ厨房にいるわけにはいかないでしょ？"
"10037040-13-マリナ" = "ん？山海経の会長は……キサキ門主ではないのか？"
"10037040-14-ルミ" = "ああ……呼び方の問題かな。"
"10037040-15-ルミ" = "一応あたしの正式的な肩書きは「商会長」なんだけど、みんな会長って呼んでてね。"
"10037040-16-ルミ" = "山海経の生徒会である、玄龍門の会長、キサキ――じゃなくて、キサキ門主のことは、みんな「門主様」って呼んでるから、基本的に間違えることはないよ。"
"10037040-17-ルミ" = "――少なくとも、山海経の中ではね。"
"10037040-18-マリナ" = "そうか……理解した。ん？待てよ。"
"10037040-19-マリナ" = "（そういえば、書記長のことも、チェリノ会長と呼んでいたような。それって……）"
"10037040-20-マリナ" = "（はっ、まさか……チェリノ会長が、環境美化部部長、書記長、運動部代表、掃除部部長、風紀委員長、給食部長……などを全て兼任しているから……！？）"
"10037040-21-ルミ" = "さて、次の料理はアヒルの料理なんですけど……#nちょっと、メニュー選びに悩んだんですよね。"
"10037040-22-ルミ" = "アヒルの調理法だけでも数十種類はありますし……#nその中で有名な方法を二つ挙げるなら……"
"10037040-23-ルミ" = "カラメル色に焼き上げるものと、塩漬けにして香辛料と一緒に蒸すもの、ですね。"
"10037040-24-ルミ" = "どっちのほうが、より喜ばれるか考えたのですが――"
"10037040-25-ルミ" = "まあ、両方食べられたほうがいいかなって！はい、おまちどおさま！"
"10037040-26-ルミ" = "フッ、食べ切れないほどの量を用意する。#nこれぞまさに、山海経流の「おもてなし」だな！"
"10037040-27" = "[s] \"何となく予想していたけど……。\""
"10037040-28-ルミ" = "あははっ、先生もいっぱい食べてよね。#n玄武商会に来たお客さんがお腹いっぱいになれないなんて、逆に商会の恥だからさ！"
"10037040-29-チェリノ" = "カムラッド……助けて……"
"10037040-30" = "[s] \"チェリノ。\""
"10037040-31-チェリノ" = "う、うん？"
"10037040-32" = "[s] \"書記長の威厳を見せる時だよ！\""
"10037040-33-チェリノ" = "……！"
"10037040-34-チェリノ" = "そ、そうか……ならば仕方ないな。"
"10037040-35-チェリノ" = "いいぞ！かかってこい、玄武商会！#nおいらはこの程度で屈しないんだから！"
"10037040-36-ルミ" = "お、いいですね！じゃあ、思いっきりいきますよ、書記長！"
"10037040-37" = "（……その後、チェリノは泣きながら胃薬をのんでいた）"
"10037040-38-山海経の生徒B" = "……。"
"10037040-39-山海経の生徒B" = "あの者が、レッドウィンターの……？"
"10037040-40-山海経の生徒A" = "ああ、そうらしい。"
"10037040-41-山海経の生徒B" = "ふぅん……。"
"10037040-42-シュン" = "山海経訓育支援部、「梅花園」へようこそ。#nチェリノ書記長、トモエ秘書室長、マリナ委員長。"
"10037040-43-シュン" = "梅花園は、幼い生徒の訓育をすべく建てられた施設です。"
"10037040-44-シュン" = "園児たちの指導は、山海経で優秀な成績を修めた生徒が教官として選抜され、役割を担っているんです。"
"10037040-45-チェリノ" = "じゃあ、この子たちは梅花園から高校生になるまで、ずっと山海経で学ぶのか？"
"10037040-46-シュン" = "はい。もちろん途中で転校する場合もありますよ。"
"10037040-47-チェリノ" = "そうか……ちょっ……こら！引っ張るな！"
"10037040-48-梅花園の園児A" = "わ～い！なんでおひげつけてるの？ふしぎ！"
"10037040-49-梅花園の園児B" = "これなーに？おひげぇ？あれ……とれちゃった……。"
"10037040-50-チェリノ" = "ひ、髭が……！トモエ！"
"10037040-51-トモエ" = "落ち着いてください、チェリノちゃ……いえ書記長。#nこの予備の髭を……。"
"10037040-52-チェリノ" = "こ、このままでは……また子供たちに髭を取られてしまうだけだ……！#nなにか根本的な解決法を……！"
"10037040-53-ココナ" = "みんな！この方は遠方からいらした大事なお客様なんだよ！大人しくして！"
"10037040-54-ココナ" = "ココナちゃん、まーたむずかしいこと言ってる……。"
"10037040-55-ココナ" = "あ！おヒゲ返してよ、ココナちゃん！"
"10037040-56-ココナ" = "ココナちゃんじゃなくて、ココナ教官っ！"
"10037040-57-シュン" = "みなさん？"
"10037040-58-シュン" = "めっ、ですよ？"
"10037040-59-梅花園の園児A" = "ひ、ひぃ！？ご、ごめんなさい、シュン教官！"
"10037040-60-梅花園の園児B" = "うぅぅ……言うこときくからぁ……。"
"10037040-61-ココナ" = "まったくもう……はい、こちらはお返ししますね。"
"10037040-62-ミナ" = "やはり、シュン教官の指導はいつ見ても素晴らしいな。"
"10037040-63-チェリノ" = "ふむ、ココナ教官といったか？"
"10037040-64-ココナ" = "はい！私がココナ教官です。"
"10037040-65-チェリノ" = "梅花園では……子供が子供の面倒をみるのか……？"
"10037040-66-ココナ" = "こ、子供じゃありません！私はもう立派なレディーで、一人の教官なんですよ……！"
"10037040-67-シュン" = "ふふっ、ココナちゃんは本来なら小学校に通う年齢なのですが……"
"10037040-68-シュン" = "能力を認められ、飛び級で高級中学校に入学し、教官にまでなったのですよ。#n文字通り、自慢の妹です。"
"10037040-69-ココナ" = "しゅ、シュン姉さん……？#nも、もう恥ずかしいから、やめてよ……。"
"10037040-70" = "[s] \"そうだよ！ココナ教官ちゃんは、梅花園の自慢の生徒なんだから！\""
"10037040-71-ココナ" = "うぅぅ、先生まで！それにココナ教官ちゃんって何ですか！"
"10037040-72-山海経の生徒C" = "あれ……？今レッドウィンターの生徒が梅花園から出てきたよ。"
"10037040-73-山海経の生徒D" = "え？大丈夫なの、あれ。#n梅花園は山海経でも重要な場所なのに……。"
"10037040-74-山海経の生徒C" = "だよね。玄龍門ですら、梅花園には手出しできないくらいなのに。"
"10037040-75-山海経の生徒D" = "門主様は一体……何をお考えなんだろう……。"
"10037040-76-チェリノ" = "おお！ここは先日、京劇をやってた場所だな！"
"10037040-77-ミナ" = "[ruby=びゃっこ]白虎[/ruby]公園は、山海経でも特に名物とされる公園だ。"
"10037040-78-ミナ" = "ほとんどの行事がここで行われていると言っても過言ではない。"
"10037040-79-マリナ" = "たしかに、結構な広さがあるな……"
"10037040-80-マリナ" = "……だが、我らレッドウィンターの「赤ひげ革命広場」の方が広いな！"
"10037040-81-ミナ" = "……なに？"
"10037040-82-ミナ" = "山海経の由緒正しい白虎公園を、広さだけで蔑むつもりか！？"
"10037040-83-マリナ" = "いや、そのつもりはない。#n山海経が伝統を大事にしているのは、今回の交流会でよく分かったからな。"
"10037040-84-マリナ" = "ただ、厳しい寒さと果てしない雪原の上にある、我らレッドウィンターの闘志と不屈の精神を再認識したまでだ！"
"10037040-85-ミナ" = "……レッドウィンターは、そんなに広いのか？"
"10037040-86-マリナ" = "ああ……少しでも油断すれば迷子になってしまうし、#n運が悪ければ熊と遭遇することもある……。"
"10037040-87-ミナ" = "熊？山海経にもパンダはいるが……。"
"10037040-88-マリナ" = "パンダは可愛いからいいんだ！"
"10037040-89-マリナ" = "あれ？待てよ、パンダも熊の一種ではあるし……熊も案外、可愛いのか……？"
"10037040-90-マリナ" = "うぅっ！私を混乱させるつもりだな、ミナ執行部長！"
"10037040-91-ミナ" = "え？いや、私は何も言っていないが……。"
"10037040-92" = "[s3] \"あはは……マリナも自分なりに、\"\n[s4] \"山海経を褒めているんだと思うよ。\""
"10037040-93-マリナ" = "せ、先生！？"
"10037040-94-ミナ" = "そうだったのか……感謝する、マリナ委員長。"
"10037040-95-マリナ" = "あ、ああ……！そういうことだ。#n山海経も中々だな！ははっ！"
"10037040-96-ミナ" = "フッ、分かってくれたなら良い。#nふふふ……。"
"10037040-97-チェリノ" = "……あの二人、案外仲が良いんじゃないか？"
"10037040-98-トモエ" = "そうですね、チェリノちゃ……いえ、書記長。"
"10037040-99" = "[s] \"うーん……あれは仲が良いっていうより、\""
"10037040-100-チェリノ" = "むむ？"
"10037040-101" = "[s] \"気が合っているんだと思うよ……いろんな意味で。\""
"10037040-102-チェリノ" = "お互い通じ合ってるってことだろ？いい意味じゃないのか？"
"10037040-103-チェリノ" = "いい意味で合っている、だと？#nカムラッド……なんだか複雑な表情をしているな……？"
"10037040-104-トモエ" = "私には何となく分かります……先生のお気持ちが……。"
"10037040-105-トモエ" = "ええ。仰るとおり、仲が良くなるのは良いことです。"
"10037040-106-山海経の生徒A" = "こんなところにもレッドウィンターが来てるよ。"
"10037040-107-山海経の生徒B" = "ミナ執行部長まで……待てよ、そしたら門主様は？"
"10037040-108-山海経の生徒A" = "門主様は玄龍門に残っているんだし、問題ないんじゃない？"
"10037040-109-山海経の生徒B" = "いや……ミナ執行部長がどうして余所者のそばに……？"
"10037040-110-山海経の生徒A" = "まぁ……一応、客人だし？"
"10037040-111-山海経の生徒B" = "……その上、白虎公園で盛大な京劇まで披露したじゃないか。"
"10037040-112-山海経の生徒A" = "――何が言いたいんだ？"
"10037040-113-山海経の生徒B" = "レッドウィンターの客人は、どれだけ手厚く歓待されているのか、ちゃんと分かっているんだろうか？"
"10037040-114-山海経の生徒A" = "以前はシャーレの先生を、次は外部の学園を、か……。"
"10037040-115-山海経の生徒B" = "このまま放っておいていいのか？"
"10037040-116-山海経の生徒A" = "門主様がお決めになったことだし……。"
"10037040-117-山海経の生徒B" = "お前だって思う所があるんじゃないのか？"
"10037040-118-山海経の生徒A" = "……まぁ、みんな不安がってはいるけど。"
"10037040-119-山海経の生徒B" = "ああ……。"
