[translation]
"10037070-1" = "第7話;渝州の森林にて　"
"10037070-2-キサキ" = "うっ……！"
"10037070-3-キサキ" = "……。"
"10037070-4-キサキ" = "（記憶が、混濁しておる。一体何があったのじゃ……）"
"10037070-5-キサキ" = "（ああ……レッドウィンターの者と竹林で……パンダを見ることになって……それで……）"
"10037070-6-キサキ" = "（それで……？）"
"10037070-7" = "[ns] \"キサキ、目が覚めた？\""
"10037070-8-キサキ" = "先生？どうして、ここに……。"
"10037070-9-キサキ" = "いや、少し……頭の整理を……。"
"10037070-10-キサキ" = "……。"
"10037070-11-キサキ" = "灯りを、つけてくれるかの？部屋が、暗くて……。"
"10037070-12-キサキ" = "うっ……！"
"10037070-13" = "[s] \"ごめん、明るすぎるようなら消そうか……？\""
"10037070-14-キサキ" = "……すまない、頼む。"
"10037070-15-キサキ" = "竹林で、どうなったのじゃ？"
"10037070-16-キサキ" = "皆パンダを見て無事に帰った……？"
"10037070-17-キサキ" = "マリナ委員長がパンダを抱っこしようとして、ミナが大変じゃった？ふふ……。"
"10037070-18-キサキ" = "彼女は、まこと熊が好きなようじゃ。#nあの外見とは裏腹に、パンダも熊の一種。"
"10037070-19-キサキ" = "大事になるところじゃったのう。#nミナもさぞかし手を焼いたことじゃろうて。"
"10037070-20-キサキ" = "……客人のもてなしすらままならぬとは、[ruby=じくじ]忸怩[/ruby]たる思いじゃ。"
"10037070-21" = "[s] \"……。\""
"10037070-22-キサキ" = "レッドウィンターの者は、皆面白いの。"
"10037070-23-キサキ" = "チェリノ書記長は、まだ本音は分からぬが、随分と気骨があるようじゃの。"
"10037070-24-キサキ" = "トモエ秘書室長は、隠しきれぬ知謀が垣間見える。"
"10037070-25-キサキ" = "マリナ委員長は……ふふ、あの座に居る割には、楽しませてくれる人物じゃ。"
"10037070-26-キサキ" = "皆、それぞれに個性的で良いのう……。"
"10037070-27" = "[s] \"……。\""
"10037070-28-キサキ" = "……。"
"10037070-29-キサキ" = "驚いたか？先生。"
"10037070-30" = "[s1] \"……こういう時まで、他人に気を配る必要はないよ。\"\n[s2] \"今は、自分自身を大切にして。\""
"10037070-31-キサキ" = "ふふ[ruby=わらわ]、妾に[/ruby]そう言ってくれるのかえ。"
"10037070-32-キサキ" = "妾の容態は……レッドウィンターの者にも？"
"10037070-33" = "[s] \"サヤが上手くやってくれたから、誰も気づいてないよ。\""
"10037070-34-キサキ" = "そうか。なら安心じゃの。"
"10037070-35" = "[s] \"……話してくれる？\""
"10037070-36-キサキ" = "なに、大したことではない。"
"10037070-37-キサキ" = "ただ……妾は一日のうち、数時間しか活動できないだけじゃ。"
"10037070-38" = "[s] \"それって、大きな病気とかじゃないの？\""
"10037070-39-キサキ" = "案ずるな。妾はまだ動ける。#n……まだ、務めを果たせるじゃろうて。"
"10037070-40-キサキ" = "この事を知っている生徒？"
"10037070-41-キサキ" = "妾の知る限り、サヤだけじゃ。"
"10037070-42-キサキ" = "ああ。ルミでさえ知らぬよ。#n口外しておらぬからの。"
"10037070-43-キサキ" = "――無論、ルミは妾の友じゃ。付き合いも長い。"
"10037070-44-キサキ" = "じゃが、ルミと共に育っていた頃の妾は、ここまで衰弱しておらなんだ。"
"10037070-45" = "[s] \"急に身体が弱くなったの？\""
"10037070-46-キサキ" = "……。"
"10037070-47-キサキ" = "すべては、妾が2年生の時――そう、門主の座に就いた頃の事。"
"10037070-48-キサキ" = "門主は3年生が務めるのが慣例じゃ。#nしかし、当代の門主は不祥事で失脚を余儀なくされたのじゃ。"
"10037070-49-キサキ" = "後任は――妾で満場一致じゃった。"
"10037070-50-キサキ" = "不思議な話じゃ。伝統を重視する者が慣例を破ってまで、2年生だった妾を門主にしようとするなど……。"
"10037070-51" = "[s3] \"それって、もしかして……。\"\n[s4] \"門主は、苦労が多いから……？\""
"10037070-52-キサキ" = "……ふふ。"
"10037070-53-キサキ" = "言わぬが花、という言葉は知っておろう？"
"10037070-54-キサキ" = "――して、2年生の時。#n門主に就いて初めて妾が下した決定は、とある3年生を退学させることじゃった。"
"10037070-55-キサキ" = "無論、反発も多かった。#nそのような処罰を下す際は、伝統に則って執り行うべきである、と。"
"10037070-56-キサキ" = "……皮肉な話じゃ。#n2年生を門主の座に就かせた[ruby=あやつ]彼奴[/ruby]らが、伝統を口に批判するなんてな。"
"10037070-57-キサキ" = "……話が逸れてしまったの。"
"10037070-58-キサキ" = "妾の身体に異常が現れたのは……その頃からじゃ。"
"10037070-59-キサキ" = "ふふ。これが門主に就いた者に課せられた「重み」なのかもしれぬの。"
"10037070-60" = "[s] \"……。\""
"10037070-61-キサキ" = "そう暗い顔をするでない。妾は、今までよく演じられておったろう？"
"10037070-62-キサキ" = "ルミはもちろん、先生にすら気づかれておらんかったのじゃ。#n妾の演技も、捨てたものではないのう。"
"10037070-63-キサキ" = "もし妾が他学園の人間だったら、女優になれたかもしれぬ。"
"10037070-64-キサキ" = "ふふ。キヴォトスは、一人の優秀な演者を失ったようじゃ。#nそうは思わぬか？先生。"
"10037070-65" = "[s5] \"そんなに大変なら、お忍びで抜け出すのも……\"\n[s6] \"やめた方がいいんじゃない……？\""
"10037070-66-キサキ" = "……ああ。間違いなく、[ruby=そなた]其方[/ruby]の言う通りじゃ。"
"10037070-67-キサキ" = "己の身体すらままならぬのなら、大人しく静養していれば良い。"
"10037070-68-キサキ" = "わざわざ抜け出す必要など……どこにもありはせぬ。"
"10037070-69" = "[s] \"……。\""
"10037070-70-キサキ" = "じゃがのう……これが、妾のワガママにすぎなくても。"
"10037070-71-キサキ" = "より……手遅れになる前に……。"
"10037070-72-キサキ" = "一つでも多くのものを、この目に刻みたい。ただそれだけなのじゃ……。"
"10037070-73" = "[s7] \"どうして……内緒にしているの？\"\n[s8] \"助けを求めたら、方法が見つかるかもしれないのに。\""
"10037070-74-キサキ" = "……。"
"10037070-75-キサキ" = "「玄龍門の門主」、じゃからの。"
"10037070-76-キサキ" = "いつでも完璧な姿を見せねばならぬ。#nさもなければ……喰われてしまうからの。"
"10037070-77-キサキ" = "先代の門主が、そうであったように。"
"10037070-78-キサキ" = "門主という座にこだわる必要？#nふふ、そう思えるのなら、少しは重荷を下ろせたのじゃが……。"
"10037070-79-キサキ" = "覚えておるか、先生。レッドウィンターの客人が訪問した時のことを。"
"10037070-80-キサキ" = "来客を「玄龍門式」に案内するよう申しつけたのに、彼奴らは客人を取調室へ送り込んだ。"
"10037070-81-キサキ" = "陰謀を暴くだのなんだの……あのように、今の玄龍門は、妾がいなければ無秩序な状態になってしまいかねん……。"
"10037070-82" = "[s9] \"ほ、他の学園だって、みんな多種多様だからね……？\"\n[s10] \"美食研究会とか、温泉開発部とか……？\"\n[s11] \"ミレニアムのエンジニア部も……あ、でも皆いい子たちなんだよ……！\""
"10037070-83-キサキ" = "そうさな……。"
"10037070-84-キサキ" = "……。"
"10037070-85-キサキ" = "じゃが、先生。"
"10037070-86-キサキ" = "妾は……[ruby=みな]山海経[/ruby]を放っておけぬのじゃよ。"
"10037070-87" = "（横になっていたキサキが、ゆっくりと身体を起こす）"
"10037070-88" = "（キサキはそっと、胸元に寄りかかってきた）"
"10037070-89" = "（窓から差し込んだ月の光が、静寂を切り裂いていく）"
"10037070-90-キサキ" = "先生、どうかお願いじゃ。"
"10037070-91-キサキ" = "妾の事、妾にまつわる事……誰にも口外しないでほしい。"
"10037070-92-キサキ" = "サヤは約束を守るやつじゃ。#nこの話が漏れることは……ありえぬ……。"
"10037070-93" = "[s] \"……うん。\""
"10037070-94-キサキ" = "苦しませてしまったな、先生。"
"10037070-95-キサキ" = "案ずるでない。妾はまだ、生きておる。"
"10037070-96" = "（キサキの頭を優しく撫でる）"
"10037070-97-キサキ" = "ああ……良いな。心身の疲れが、取れていく……。"
"10037070-98-キサキ" = "そう悲しむでない。#nこれは、先生だからこそ頼める事なのじゃ。"
"10037070-99" = "（キサキが顔をあげ、視線が合う）"
"10037070-100" = "（澄んだ瞳に穏やかな笑み――そんな彼女の姿に、つい、視線を逸らしてしまった）"
"10037070-101-サヤ" = "……門主、具合はどうなのだ？"
"10037070-102-キサキ" = "だいぶ楽になった。心配せずともよい。"
"10037070-103-キサキ" = "だが、おかしいのう。今日もちゃんと薬を飲んだというのに……。"
"10037070-104-サヤ" = "うん……そのことで来たのだ。"
"10037070-105-サヤ" = "……よく聞いてほしいのだ。#n実は――門主の薬がすり替えられているのだ。"
"10037070-106-キサキ" = "……！？"
"10037070-107-サヤ" = "……これが何を意味するのか、門主なら分かると思うのだ。"
"10037070-108-キサキ" = "薬を管理する錬丹術研究会に処罰をしろと？"
"10037070-109-サヤ" = "その覚悟ならできているのだ……。#nでも、それ以上に大きな問題があって――"
"10037070-110-キサキ" = "錬丹術研究会に、[ruby=・   ・   ・]内通者[/ruby]がいる。"
"10037070-111-サヤ" = "そうとしか思えないのだ……。"
"10037070-112-キサキ" = "……よもや、こんな事になってしまうとは……。"
"10037070-113-サヤ" = "明日からは、ぼく様が手ずから薬を調剤するのだ。#n錬丹術研究会のことも、組織全体を見直す必要がありそうだし……。"
"10037070-114-サヤ" = "悲しいのだ……錬丹術研究会の会長が、会員を疑うことになるだなんて……。"
"10037070-115-キサキ" = "仕方のないことじゃ。できれば、起きないでほしくはあるがの。"
"10037070-116-サヤ" = "門主も気をつけるのだ。この件の処罰なら、ぼく様はいくらでも受けるから……。"
"10037070-117-キサキ" = "ああ。其方もどうか気をつけるのじゃよ。"
"10037070-118-サヤ" = "ぼく様がもう少し、完璧な薬を作れていれば……。"
"10037070-119-サヤ" = "門主の容態を、少しでも改善できる薬材が見つけられたら良かったのに……。"
"10037070-120-サヤ" = "今は副作用つきの、効果も一時的なものしか作れないのだ……。"
"10037070-121-キサキ" = "何を言っておる。其方が調剤してくれた薬のおかげで、今の妾があるのじゃぞ。"
"10037070-122-サヤ" = "門主……お願いなのだ。一週間……せめて明日一日だけでも、スケジュールを全部取り消して安静にしてほしいのだ。"
"10037070-123-キサキ" = "……ふふ、それは無理な話じゃのう。客人が来ておるのじゃ。"
"10037070-124-キサキ" = "無論、事が終われば静養に移るとしよう。#nだから……この我儘な患者を許してほしいのじゃ。"
"10037070-125-サヤ" = "……分かったのだ。"
"10037070-126-サヤ" = "電話……？"
"10037070-127-キサキ" = "妾にかのう。#nこれは……カグヤ？"
"10037070-128-キサキ" = "カグヤ、何ぞ用でもあるかの？"
"10037070-129-カグヤ" = "夜分遅くに失礼いたします。どうしても門主様にお伝えしたいことがあります故。#n――その、ちょうど、新しい京劇が仕上がったのです！"
"10037070-130-カグヤ" = "もし宜しければ、#n明日、門主様とレッドウィンターの皆様の前で披露したいのですが……#nお許し願えますでしょうか。"
"10037070-131-キサキ" = "新しい京劇か……ふむ、ご苦労じゃった。"
"10037070-132-キサキ" = "開演も許可しよう。チェリノ書記長は、其方の劇を随分と気に入っておるからのう。"
"10037070-133-カグヤ" = "ご快諾いただき、誠にありがとうございます！"
"10037070-134-カグヤ" = "その、再度のお願いで恐縮なのですが、せっかくお見せするのなら、#n玄龍門の皆様を全員ご招待したいのですが……。"
"10037070-135-キサキ" = "ふむ……良いじゃろう。[ruby=びゃっこ]白虎[/ruby]公園は広い。#n玄龍門の中でも京劇を嗜む者は多いからのう。"
"10037070-136-カグヤ" = "ありがとうございます、門主様[ruby=わたくし]！私、[/ruby]最善を尽くして準備いたします！"
"10037070-137-サヤ" = "新しい京劇……？"
"10037070-138-キサキ" = "よほどレッドウィンターに刺激を受けたのじゃろう。#n芸術家とは本来、ああいうものなのかもしれぬ。"
"10037070-139-キサキ" = "少し、気分転換するとしようか。"
"10037070-140-キサキ" = "どうじゃ、其方らも見にくるか？#n席なら用意しよう。"
"10037070-141-サヤ" = "うーん……今の錬丹術研究会は自粛した方が良いとは思うけど……。"
"10037070-142-キサキ" = "息抜きも大事じゃろうて。#n抑圧するばかりでは、いずれ不満が溢れてしまうものじゃ。"
"10037070-143-キサキ" = "それに、錬丹術研究会のことなら、其方がすでに相応の制裁を加えておるのじゃろう？"
"10037070-144-サヤ" = "……いつ気づいたのだ？"
"10037070-145-キサキ" = "其方なら、そうすると思っておったからの。#nふふ、明日が楽しみじゃ……。"
