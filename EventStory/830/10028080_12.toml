[translation]
"10028080-1" = "エピローグ;護送車両"
"10028080-2" = "風紀委員会・特殊護送車両の内部"
"10028080-3-？？？" = "指名手配犯が到着した！鎖をつけろ！"
"10028080-4-風紀委員A" = "さっさと入れ！悪足掻きはするなよ。"
"10028080-5-風紀委員B" = "……よし、止まれ！#nゲヘナに着くまでおとなしくしてろ。いいな！"
"10028080-6-カスミ" = "鎖、足枷の固定完了！"
"10028080-7-風紀委員B" = "他の奴らは全員もう一つのトラックか？#nギャング団の奴ら、結構いたよな？"
"10028080-8-風紀委員B" = "この車両には1名しか乗ってないが……本当に合ってるのか？"
"10028080-9-カスミ" = "まあ、トラックなら何台もあるからな。#nそれにこいつは……ちょっと特別だ。"
"10028080-10-カスミ" = "イオリ先輩が「要注意人物だから特に注意しろ」と言ってたんだ。"
"10028080-11-風紀委員B" = "要注意人物ね……噂には聞いてたけど、そんな風には見えないな。"
"10028080-12-カスミ" = "そう言ってると痛い目に合うぞ。護送チームのほとんどが保健室行きになった挙句、列車をひっくり返した怪物だ。どう見てもヤバい奴だろ。"
"10028080-13-風紀委員B" = "たしかに……他の先輩とか追跡チームからも散々話は聞いたし。"
"10028080-14-カスミ" = "けど、それも今日で終わり。#n風紀委員会の本部……絶対に脱出不可能な部屋に入るんだし。"
"10028080-15-カスミ" = "…………。"
"10028080-16-風紀委員B" = "……にしてもコイツ、本当に一言も喋らないな。ちょっと気味が悪くないか？"
"10028080-17-カスミ" = "放っとけ、私たちは自分の仕事をやればいい。#nもう夜だ、日が昇るまでには終わらすぞ。"
"10028080-18-風紀委員B" = "ドアを閉めろ！出発用意！#n――全員、中に移動して座れ！！"
"10028080-19-風紀委員C" = "あとは持ち場で待機！到着するまで、現状を維持しろ！！"
"10028080-20-カスミ" = "……出発する！"
"10028080-21-カスミ" = "…………。"
"10028080-22-カスミ" = "…………♪"
"10028080-23-？？？" = "……なあ、知ってるか？"
