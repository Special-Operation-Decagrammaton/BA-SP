[translation]
"10028010-1" = "第1話;3時10分、ゲヘナ行き"
"10028010-2-ハスミ" = "――どうぞ。"
"10028010-3-ハスミ" = "失礼します、ハスミ先輩。お呼びっすか？"
"10028010-4-ハスミ" = "はい、イチカ。お待ちしておりました。"
"10028010-5-ハスミ" = "朝早くに呼び出してしまって申し訳ありません。#nよく眠れましたか？"
"10028010-6-イチカ" = "はい、睡眠はたっぷり取ってるんで大丈夫っすよ！へへっ。"
"10028010-7-イチカ" = "……こんな時間に呼び出すってことは、何かあったんすよね？"
"10028010-8-ハスミ" = "事件とまではいきませんが……そうですね。"
"10028010-9-ハスミ" = "ツルギとも話してみましたが、やはりこの件はイチカが適任だと思いまして。"
"10028010-10-イチカ" = "へっ？ツルギ先輩との話し合い……？#n私が「適任」……？"
"10028010-11-イチカ" = "いったい何があったんすか……"
"10028010-12-ハスミ" = "ああ、プレッシャーをかけるつもりはありません。#n危険でも難しい内容でもありません。"
"10028010-13-ハスミ" = "……カバンを今日中にティーパーティーに持って行ってほしいのです。"
"10028010-14-ハスミ" = "また、カバンはトリニティ自治区から離れた場所にあるため……"
"10028010-15-ハスミ" = "他の自治区の生徒とも仲の良い、イチカに任せようかと。"
"10028010-16-ハスミ" = "私やツルギが行くよりは、そちらの方がつつがなく事が運ぶでしょう。"
"10028010-17-イチカ" = "あーなるほど、そういうことなんすね。#n要は、[ruby=・   ・   ・]お使い[/ruby]みたいな感じっすよね？"
"10028010-18-ハスミ" = "そうですね……お使いではありますが、カバンには重要な遺物が入っています。"
"10028010-19-ハスミ" = "ティーパーティーだけでなく、トリニティ全体にとって大切なものなのです。"
"10028010-20-ナギサ" = "そう――これはティーパーティーのナギサ様からの依頼。"
"10028010-21-ナギサ" = "つまり――"
"10028010-22-ハスミ" = "「ティーパーティーの政治的立場に影響を与える」レベルの重要な遺物と言えるでしょう。"
"10028010-23-イチカ" = "なるほど……おつかいって言ってすみませんでした。"
"10028010-24-ハスミ" = "……それと。"
"10028010-25-ハスミ" = "もう一点……"
"10028010-26-ハスミ" = "例のカバンと同じくらい重要な事が――"
"10028010-27-ハスミ" = "カバンの回収を終えたら、先生が同じ列車に乗る手はずとなっています。"
"10028010-28-ハスミ" = "そこで……先生のサポートをお願いできますでしょうか？"
"10028010-29-ハスミ" = "先生は遺物の発掘作業に、同行してくださったのです。"
"10028010-30-ハスミ" = "私個人の希望ではありますが……#nせめて、列車移動の間だけでも、ゆっくりしていただきたいと思いまして。"
"10028010-31-イチカ" = "……ん？"
"10028010-32-イチカ" = "先生がカバン持ってるんすか？"
"10028010-33-ハスミ" = "そうです。もちろん、これは指示ではありません。#n正義実現委員会からの指示は、カバンを届けることだけ。"
"10028010-34-ハスミ" = "カバンの回収に影響が出るようであれば、気にしないでいただいて結構です。"
"10028010-35-ハスミ" = "どうでしょう。受けていただけますでしょうか……？"
"10028010-36-イチカ" = "……んー。"
"10028010-37-イチカ" = "とりあえず、任務について了解っす。"
"10028010-38-イチカ" = "……先生……先生、か……"
"10028010-39-イチカ" = "カバン、列車……先生……"
"10028010-40-イチカ" = "……へへっ。"
"10028010-41-イチカ" = "いいっすよ。帰り道に話し相手ができるってことですし、前から先生とはちゃんと話してみたかったんで。"
"10028010-42-イチカ" = "まっ、なんてことないっす。"
"10028010-43-イチカ" = "カバンを取りに行くだけですし。"
"10028010-44-イチカ" = "任せてください！"
"10028010-45-イチカ" = "――というのが、今朝のやり取りっす。"
"10028010-46-イチカ" = "よいっ……しょっと。"
"10028010-47-イチカ" = "ふぅ……"
"10028010-48-イチカ" = "これで最後の荷物っすね！久々にいい汗かいたっす。"
"10028010-49-イチカ" = "先生もお疲れ様でした。#n正義実現委員を……いや、トリニティを代表してお礼を申し上げるっす。"
"10028010-50-イチカ" = "いつもなら代表なんて縁遠い言葉っすけど、今日は状況が違うので！"
"10028010-51-イチカ" = "いいとこ見せないとっすよね！へへっ。"
"10028010-52" = "[s1] \"イチカもお疲れ様。\"\n[s2] \"ここまで遠かったし、移動も大変だったでしょ。\""
"10028010-53-イチカ" = "一番大変だったのは、先生と発掘チームの皆さんっすよ！"
"10028010-54-イチカ" = "私は後片付けをちょっと手伝っただけっすから！"
"10028010-55-イチカ" = "にしても不思議っすね……#nティーパーティーの一番最初の会合で使われたティーセット……"
"10028010-56-イチカ" = "これって超重要な[ruby=こうほう]校宝[/ruby]じゃないすか。#nよく今になって見つかったっすね。"
"10028010-57-イチカ" = "それも、トリニティ自治区からこんなに離れた場所で。"
"10028010-58-イチカ" = "……え？"
"10028010-59-イチカ" = "大事なティーカップというのは知ってたけど、その理由までは知らなかったんすか……？"
"10028010-60-イチカ" = "まったく……こんな大事な依頼をお願いしておきながら、説明もしてなかったんすか……"
"10028010-61-イチカ" = "ま、別に機密情報でもないし……アレっすよ、アレ。"
"10028010-62-イチカ" = "……「正統性」ですね。"
"10028010-63-イチカ" = "ご存じの通り、最近いろんなことがあった関係で……#nティーパーティーの方々が、救護騎士団とかシスターフッドと対等に話せず頭を悩ませているんだとか。"
"10028010-64-イチカ" = "そんな状況でこの遺物を発見したのは大きいと思います。#n「我々は由緒正しい存在」「トリニティの祖」だとアピールできるので。"
"10028010-65-イチカ" = "だからティーパーティーも、先生に発掘作業を手伝ってもらおうと思ったんじゃないんすかね。"
"10028010-66-イチカ" = "私がここに送られたのも、先生をサポートするためっすから。"
"10028010-67-イチカ" = "……つまり！"
"10028010-68-イチカ" = "今日は1日……私が先生のお願いを何でも聞くっすよ！"
"10028010-69-イチカ" = "いいっすか、超レアっすからね？#n頼み事があるなら何でも言ってください。"
"10028010-70-イチカ" = "私は、先生のためにここにいるっすから！！"
"10028010-71" = "[s3] \"イチカは頼もしいね、ありがとう。\"\n[s4] \"お世話になるよ、よろしくね。\""
"10028010-72-イチカ" = "先生からそう言われると嬉しいっすね。#n来て良かったです、へへっ。"
"10028010-73-イチカ" = "一度、ご一緒してみたくて……"
"10028010-74-イチカ" = "ツルギ先輩とかハスミ先輩……それにマシロも、よく先生の話をしてるから。"
"10028010-75-イチカ" = "……あっ。いい話しか聞いてないんで、心配はいらないっすよ。"
"10028010-76-イチカ" = "「良い人だ」とか「一緒にいると落ち着く人だ」とか、まぁそんなとこっすね。"
"10028010-77-イチカ" = "だから、先生に興味が湧くのは、自然な流れというか……"
"10028010-78-イチカ" = "実際、私は担当業務的にお会いする機会はほとんどなかったすけど……"
"10028010-79-イチカ" = "……ん？"
"10028010-80-イチカ" = "いつでも連絡して大丈夫……？"
"10028010-81-イチカ" = "……ふふ、それは嬉しいっすね。"
"10028010-82-イチカ" = "でも、あんまりお手間をかけたくはないというか。"
"10028010-83-イチカ" = "先生は気にされないとしても、やはり周囲の目は違いますから。"
"10028010-84-イチカ" = "……「手のかかる子」にはなりたくない、という話っす。"
"10028010-85-イチカ" = "ただ、今回みたいな機会があるのなら……"
"10028010-86-イチカ" = "ちょっとだけ、プライベートな話もできたらなと。"
"10028010-87-イチカ" = "……はは、変なこと言っちゃったっすね。"
"10028010-88-イチカ" = "それじゃ、残りの荷物も片付けますか。"
"10028010-89-イチカ" = "えーと、装備はだいたい終わりで……"
"10028010-90-イチカ" = "……ん？"
"10028010-91-イチカ" = "ああ、ティーセットっすか。あの白いカバンに入ってたアレっすね。"
"10028010-92-イチカ" = "それなら大丈夫っす！片付け始める前に、念のため確認しておいたんで。"
"10028010-93-イチカ" = "貨物車両にちゃんとあったっすよ。#n後は片付けが終わったら、列車に乗るだけっすね。"
"10028010-94-イチカ" = "……ん？"
"10028010-95-イチカ" = "何で車両にって……"
"10028010-96-イチカ" = "列車に乗って帰るんじゃなかったんすか？"
"10028010-97-イチカ" = "……ん？"
"10028010-98-イチカ" = "3時間後の列車……？"
"10028010-99-イチカ" = "6時10分の列車すか……？"
"10028010-100-イチカ" = "今、3時っすね……？"
"10028010-101-イチカ" = "あれ、もしかして……"
"10028010-102-イチカ" = "時刻表が合ってるなら、もう出発時間……"
"10028010-103-イチカ" = "じゃあ、あのカバンは……？"
"10028010-104-イチカ" = "……っと、今はこんなことを考えてる場合じゃないっすね。#n急いで取りに行かないと。"
"10028010-105-アナウンス" = "ご案内いたします。"
"10028010-106-アナウンス" = "まもなく「特急・ゲヘナ行き」の列車が発車いたします。"
"10028010-107-アナウンス" = "ご利用のお客様は、ご着席いただきますようお願い申し上げます。"
"10028010-108-アナウンス" = "繰り返します。まもなく「特急・ゲヘナ行き」の列車が――"
"10028010-109-イチカ" = "えっ……と。"
"10028010-110-イチカ" = "「ゲヘナ行き」……？"
