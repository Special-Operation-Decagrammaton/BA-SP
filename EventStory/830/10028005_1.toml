"10028005-1" = "プロローグ;護送列車"
"10028005-2-？？？" = "対象が到着した！鎖をつけろ！"
"10028005-3-組織員A" = "さっさと入れ！悪足掻きはするなよ。"
"10028005-4-組織員B" = "……よし、止まれ！#n大人しくしてるんだぞ。"
"10028005-5-カスミ" = "鎖、足枷の固定完了！！"
"10028005-6-組織員B" = "お前の処分は本部で決まる。陽の光が見られるのも今日で最後だろうな。#nせいぜい、最後の1日を楽しむといい。"
"10028005-7-カスミ" = "…………。"
"10028005-8-組織員B" = "……チッ、黙りやがって。"
