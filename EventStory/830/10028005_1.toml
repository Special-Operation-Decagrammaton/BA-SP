"10028005-12-組織員C" = "あのゲヘナの風紀委員が、要注意人物として目を光らせてるくらいだ。"
"10028005-13-カスミ" = "だが、それも今日で最後。#nなんせ私たちのファミリーでも悪名高い――"
"10028005-14-カスミ" = "――「アランチーノ・ファミリー」が、始末を請け負ったんだ。"
"10028005-15-カスミ" = "…………。"
"10028005-16-組織員B" = "ドアを閉めろ！全員、中に移動して座るんだ！！"
