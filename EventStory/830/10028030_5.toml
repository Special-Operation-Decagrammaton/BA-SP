[translation]
"10028030-1" = "第3話;先頭車両へ"
"10028030-2-カスミ" = "先生は何用で、わざわざこんな僻地に来たんだ？"
"10028030-3-カスミ" = "それもこんな可愛らしい、トリニティのお嬢ちゃんと？"
"10028030-4-イチカ" = "……。"
"10028030-5-イチカ" = "可愛らしいお嬢ちゃん、っすか……"
"10028030-6" = "[s] \"カスミ。初対面の人にそれは……\""
"10028030-7-イチカ" = "あ、先生。私なら大丈夫っす。"
"10028030-8-イチカ" = "こう見えても正義実現委員のメンバーなんで、これくらい何ともないっすよ。"
"10028030-9-カスミ" = "……ほぉ？"
"10028030-10-イチカ" = "なんだなんだ！話の通じる奴じゃないか！！"
"10028030-11-イチカ" = "いいぞ……！気に入った！！ハーハッハッハ！！"
"10028030-12-カスミ" = "そうだ、細かいことは気にするな。#n我々にはもっと大事なことがあるだろう！？"
"10028030-13-カスミ" = "こうなったからには穏便に、平和にいかないとな！"
"10028030-14-カスミ" = "状況的に、我々は仲間も同然！"
"10028030-15-カスミ" = "少なくとも、列車を降りるまでは……間違いなくな。"
"10028030-16" = "[ns1] \"……私たちが、仲間？\"\n[ns2] \"列車を降りるまで……？\""
"10028030-17-カスミ" = "……んん？"
"10028030-18-カスミ" = "どうした？その反応は。爆発のショックが大きすぎたか？#nそれとも、何か違ったかね……？"
"10028030-19-カスミ" = "仕方ない、要点をまとめようじゃないか。そっちの二人は、この列車のどこかにあるカバンを探すと言っていたな？そして、私はここから逃げなければならない。"
"10028030-20-カスミ" = "つまりお互いの目的は、列車を止めて降りる――#nほら、我々の利害は一致しているだろう？"
"10028030-21-カスミ" = "えっと……それはそうっすけど……"
"10028030-22-イチカ" = "申し訳ないっすが、カスミさんと私たちの状況はちょっと違うんすよね。"
"10028030-23-イチカ" = "私たちは追われてるわけではないので……列車からカバンを見つければそれで終わりっす。"
"10028030-24-イチカ" = "なので、ご一緒するつもりは――"
"10028030-25-カスミ" = "こらこら、人の話は最後まで聞くものだろう？"
"10028030-26-カスミ" = "そりゃあ、トリニティの麗しいお嬢様が、ツノなんか付いたゲヘナの人間とは関わりたくないってのも分かるぞ？だが……"
"10028030-27-イチカ" = "人生とは、思い通りにいかないものさ。"
"10028030-28-イチカ" = "お嬢ちゃんにはまだ難しいかもしれないけど、生きるというのはとかく大変なものなのだよ。"
"10028030-29-イチカ" = "はは……"
"10028030-30-イチカ" = "そ、そっすか……えっとじゃあ、カスミさん。"
"10028030-31-イチカ" = "どうして私たちが同行しなくてはならないのか……聞いてもいいですか？"
"10028030-32-カスミ" = "……フッフッフ、それはだな。"
"10028030-33-イチカ" = "ん……車内放送？"
"10028030-34-カスミ" = "……おお！"
"10028030-35-カスミ" = "完璧なタイミングじゃないか。そろそろだと思っていたぞ！"
"10028030-36-カスミ" = "……あ、あー。"
"10028030-37-カスミ" = "ご乗車中の皆様、及び乗務員にお知らせいたします。"
"10028030-38-カスミ" = "先ほど、輸送中の貨物の一部が爆発しました。"
"10028030-39-カスミ" = "現在、乗務員が該当車両を確認するために動いております。"
"10028030-40-カスミ" = "ご乗車中の皆様は、安全のため乗務員の指示に従っていただきますようお願い申し上げます。"
"10028030-41-カスミ" = "また、お客様の安全を第一に考え、この列車は危険物の処理が可能な場所に行き先を変更いたします。"
"10028030-42-カスミ" = "大変ご迷惑をおかけしますが、終点「ゲヘナ自治区32-1番街」以外には停車いたしません。"
"10028030-43-カスミ" = "皆様のご理解とご協力のほど、よろしくお願い申し上げます。"
"10028030-44-イチカ" = "えっ……？"
"10028030-45-イチカ" = "行き先が変更されたんすか……？"
"10028030-46" = "[s3] \"なんか内容が変じゃなかった？\"\n[s4] \"ちょっと違和感があるね。\""
"10028030-47-イチカ" = "……また、これよりお座席や車両間の移動、及びお手洗いの使用を禁止とさせていただきます。"
"10028030-48-イチカ" = "緊急事態のため、従っていただきますようお願い申し上げます。座席を離れた場合は暴動と見なし、警備員が駆けつけます。以上、本日の車掌がお送りいたしました。"
"10028030-49" = "[s5] \"お手洗い使用禁止！？\"\n[s6] \"いったい何が起こってるんだろう……？\""
"10028030-50-カスミ" = "ハーハッハッハッハ！！"
"10028030-51-イチカ" = "やっぱりこうなると思っていたぞ！慌ただしくなってきたじゃないか。"
"10028030-52-イチカ" = "あと少しすれば、奴らが押し寄せてくるだろうな！こりゃあ大変だ！"
"10028030-53-カスミ" = "……ん？このアナウンスは何なのかって？"
"10028030-54-カスミ" = "貨物の一部が爆発？そりゃあウソだ！先生も見ただろう？"
"10028030-55-カスミ" = "だって「ギャング団から賄賂をもらって指名手配犯を護送してましたが、脱出されたので取り押さえに行きます」だなんて、アナウンスできないよな？"
"10028030-56-カスミ" = "いいか、先生……まず、私がいた最後尾の車両は、私を捕らえたギャング団たちが作った「特殊護送車両」だったんだ。"
"10028030-57-カスミ" = "で、この列車の最後尾にその車両を繋げることを許可した……#nあんないかにもな護送車両、どこからどう見てもおかしいだろう？"
"10028030-58-カスミ" = "ということは、だ……理解できたか？"
"10028030-59" = "[s7] \"この列車とギャング団が……\"\n[s8] \"手を組んでるってこと……！？\""
"10028030-60-カスミ" = "その通り！さすがは先生、理解が早い！ハーハッハッハッハ！！"
"10028030-61-カスミ" = "結局この列車の乗務員は、みーんなグルってことだ。#nだから護送車両が存在する。"
"10028030-62-カスミ" = "でも……そんなものをタダで付けられるわけがないよなぁ？"
"10028030-63-カスミ" = "いやぁ、相当な額が動いただろうな！"
"10028030-64-カスミ" = "だけども「護送車両」は爆発して、捕らわれていた者は脱出したわけだ。"
"10028030-65-カスミ" = "これはもう！焦らざるを得ないだろう？"
"10028030-66-カスミ" = "列車側は、是が非でも停車したくないはずだ。#nそれ相応のモノを受け取ってるわけだから……"
"10028030-67-カスミ" = "奴らの目標は「護送中の温泉開発部長をギャング団のゲヘナ支部に送り届けること」"
"10028030-68-カスミ" = "そのためには手段を選ばないだろうな……#n行き先の変更なんて、まだほんの序の口でしかない。"
"10028030-69-カスミ" = "この列車がスピードを落とすことは決してない。#nさすがの私も、この速度の列車から飛び降りる事は不可能だ。"
"10028030-70-カスミ" = "おそらく、飛び降りた衝撃で半日は気を失うだろうな……#nその間に拘束されて終わりだ。"
"10028030-71-カスミ" = "……この状況で、そっちの2人の扱いはどうなると思う？"
"10028030-72-カスミ" = "トリニティの生徒が果たして協力してもらえるかな？"
"10028030-73-カスミ" = "その[ruby=・   ・   ・]カバン[/ruby]とやらは、ちゃんと見つけられるのか？#n今日中に帰るとか言ってなかったか？"
"10028030-74-カスミ" = "……だから、言っただろう？#n目の前のことばかりじゃなく、先のことも見据えるべきだ、と。"
"10028030-75-カスミ" = "お嬢ちゃんも少しは周囲を見た方がいいぞ！#nハーハッハッハッハ！"
"10028030-76-イチカ" = "……ははは、は。"
"10028030-77-イチカ" = "思った以上に、厄介なことになりましたが……#nこれくらい、まだなんとかなるっすよ。"
"10028030-78-イチカ" = "人生、山あり谷ありっすから……はは。"
"10028030-79-イチカ" = "……は、はははは。"
"10028030-80-列車乗務員の生徒たち" = "あっちだ！見つけたぞ！！"
"10028030-81-組織員" = "やっぱり仲間がいたか……車内の奴らを全員集めろ！！"
"10028030-82-イチカ" = "……「仲間」？"
"10028030-83" = "[ns] \"私たちのこと……？\""
"10028030-84-イチカ" = "おお！愉快な乗務員が来たぞ！"
"10028030-85-カスミ" = "ちょっ、待ってください。私たちはこの人の仲間じゃ――"
"10028030-86-カスミ" = "ここにいる奴らを全員捕らえろ！問答無用だ、例外はない！！"
"10028030-87-カスミ" = "全員、突入――！！"
"10028030-88-イチカ" = "や～これはこれは大変だ！結構な数だぞ？"
"10028030-89-カスミ" = "先生、こうなったからにはよろしく頼むぞ！"
"10028030-90-カスミ" = "あと、そこの……"
"10028030-91-カスミ" = "お・じ・ょ・う・ち・ゃ・ん・も♪"
"10028030-92-カスミ" = "……先生。"
"10028030-93" = "[s9] \"私が指揮をするから、よろしくねイチカ。\"\n[s10] \"まず目の前の状況をなんとかしようか。\""
"10028030-94-イチカ" = "ひゅーっ！記念すべき取引成立の瞬間だな！#nいいぞ、素晴らしい！！"
"10028030-95-イチカ" = "それじゃ、さっそく世話になろう！#n私だって――"
"10028030-96-カスミ" = "[ruby=ぼうかん]傍観[/ruby]してるつもりはないさっ！ハーハッハッハッハ！！"
"10028030-97-カスミ" = "さあ、どーんと来るがいい！！"
