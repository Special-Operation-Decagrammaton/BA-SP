[translation]
"10028070-1" = "第7話;宣戦布告"
"10028070-2-イチカ" = "――すみませんでした！！"
"10028070-3" = "[ns1] \"私も一緒だったのにごめん、ナギサ。\"\n[ns2] 頭を下げて謝る。"
"10028070-4" = "ティーパーティー会場"
"10028070-5-ナギサ" = "なっ、何でしょうか……？"
"10028070-6-ナギサ" = "どうして謝罪を……？"
"10028070-7-イチカ" = "……。"
"10028070-8-イチカ" = "……へ？"
"10028070-9" = "[s3] \"ティーセット、割れてたよね……？\"\n[s4] \"まだ中身を確認してないとか？\""
"10028070-10-ナギサ" = "ああ……なるほど。"
"10028070-11-ナギサ" = "そういうことでしたか……お二人の言葉を理解しました、はい。"
"10028070-12-ナギサ" = "……ええと。"
"10028070-13-ナギサ" = "こちらこそ、悩ませてしまったようで申し訳ありません。"
"10028070-14-ナギサ" = "結論から申し上げますと……あれは割れていても構わないのです。"
"10028070-15" = "[ns5] \"……え？\"\n[ns6] \"どういうこと……？\""
"10028070-16-ナギサ" = "私が懸念していたのは、遺物の「紛失」であって、「破損」ではありません。"
"10028070-17-ナギサ" = "簡単な話、物さえ持ってきていただければ大丈夫です。#n壊れたのであれば、復元すればいいので。"
"10028070-18-ナギサ" = "……トリニティには、粉々になった古書でさえ復元できる専門家がいますから。"
"10028070-19-ナギサ" = "発掘作業には先生もご一緒してくださったので、遺物の真贋を疑う人もいないでしょう。"
"10028070-20-ナギサ" = "……あらためて、お礼を言わせてください。#n先生と……ええっと、正義実現委員会の……"
"10028070-21-イチカ" = "い、イチカです。"
"10028070-22-ナギサ" = "……イチカさん、ですね。はい、イチカさん。"
"10028070-23-ナギサ" = "ふふっ。"
"10028070-24-ナギサ" = "……では、良い一日を。"
"10028070-25-イチカ" = "……拍子抜けっすね。"
"10028070-26-イチカ" = "場合によっては、正義実現委員会を辞めようと考えてたんすが。"
"10028070-27-イチカ" = "いったい、今までの心配は何だったのか……"
"10028070-28" = "[s7] \"でも、意味のある時間だったと思う。\"\n[s8] \"イチカのことを知れたからね。\""
"10028070-29-イチカ" = "またまた……ほどほどにした方がいいっすよ、そういう発言は。"
"10028070-30-イチカ" = "先生のことだから、無自覚なんでしょうけど。"
"10028070-31-イチカ" = "一緒にいると、自分が子供に感じるっす。#n……いや、先生に比べればそりゃあ子供っすけど……"
"10028070-32-イチカ" = "まあ……もういいんす。こうなったからには、私も知らないっす。"
"10028070-33-イチカ" = "これ以上隠すこともないし、先生には甘えさせてもらうんで。"
"10028070-34-イチカ" = "朝は、先生の手を煩わせたくない、とか言ったんすけど……"
"10028070-35-イチカ" = "今はもう、あのときと状況が変わったんで、時々連絡させてもらいます。"
"10028070-36-イチカ" = "これは[ruby=・   ・   ・   ・]宣戦布告[/ruby]っすから！"
"10028070-37-イチカ" = "でも、先生がいいって言ったことなんで！"
"10028070-38-イチカ" = "……自業自得っすよ。"
"10028070-39-イチカ" = "……そう、っすよね？"
"10028070-40" = "[s9] \"もちろん、いつでも連絡してね。\"\n[s10] \"どんなことでも大丈夫だから。\""
"10028070-41-イチカ" = "……ふふ、了解っす。"
"10028070-42-イチカ" = "途中で面倒になったとしても、知らないっすよ！"
"10028070-43-イチカ" = "……へへっ。"
"10028070-44-イチカ" = "なんだか明日が待ち遠しいっす。#n私も先生を振り回していいんだって思うと……なんだか先生の生徒にちゃんとなれた気がするっす。"
"10028070-45-イチカ" = "……じゃ、今日はそろそろ。"
"10028070-46-イチカ" = "これからは、仕事以外の時にも……"
"10028070-47-イチカ" = "……よろしくお願いします。"
