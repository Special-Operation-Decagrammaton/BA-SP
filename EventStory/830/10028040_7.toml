[translation]
"10028040-1" = "第4話;The good, The bad, The trinity"
"10028040-2-風紀委員A" = "――おい、列車は今どのあたりにいる？"
"10028040-3-風紀委員A" = "私たちの約3km後ろです。現在の速度は300km……"
"10028040-4-風紀委員A" = "……いえ、310km……！315km！#nどんどん速度が上がってます！"
"10028040-5-風紀委員B" = "くっ……こちらも速度を上げます！"
"10028040-6-風紀委員A" = "上げたところで意味はあるのか！？#nあっちは300kmを超えてるんだぞ！"
"10028040-7-風紀委員A" = "お、おかしいんじゃないか……！？#n2分後に衝突します！！"
"10028040-8-イオリ" = "怯むな、しっかりしろ！！"
"10028040-9-イオリ" = "すぐに追い付かれるぞ……いいか、それでも今の速度を維持するんだ！"
"10028040-10-イオリ" = "……まったく、停車駅を無視して暴走中とは聞いたけど、本当だったとは。"
"10028040-11-イオリ" = "いったい中で何が……？#nこのままじゃゲヘナ自治区に列車が……"
"10028040-12-イオリ" = "……まぁいい、この目で確認する。"
"10028040-13-イオリ" = "列車を止めて関係者を洗い出す！#n全員、乗車準備をしろ！"
"10028040-14-風紀委員A" = "はい！！"
"10028040-15-風紀委員A" = "また速度が上がった……！？"
"10028040-16-風紀委員A" = "接触まで残り15秒！！"
"10028040-17-イオリ" = "準備はいいか！"
"10028040-18-風紀委員A" = "――はい！"
"10028040-19-風紀委員A" = "……行くぞ！！"
"10028040-20-イチカ" = "残り何両でしょうかね……"
"10028040-21-カスミ" = "えーと、4か？いや、3だな。"
"10028040-22-カスミ" = "良かった良かった、あと少しじゃあないか！ハーハッハッハッハ！"
"10028040-23-イチカ" = "はは……どうしてこうなったんだか……"
"10028040-24-イチカ" = "でも、他の乗客も助けてくれたおかげで、なんとかなってるっす。#nやっぱ停車駅がスキップされたのが大きかったんすかね。"
"10028040-25-イチカ" = "それにしても、あのカスミとかいう人……#nこの短時間で大勢を動かす巧みな話術……"
"10028040-26-イチカ" = "やっぱり、並の指名手配犯じゃないっすね。"
"10028040-27-イチカ" = "これ以上関わると、危ないのでは……"
"10028040-28-イチカ" = "……カバンのことさえなければ……#nいや、せめてこんな関わり方さえしなければ……"
"10028040-29-イチカ" = "ぐうう……"
"10028040-30" = "[ns1] \"お疲れ様、イチカ……\"\n[ns2] \"早く一緒にカバンを取り戻そうね。\""
"10028040-31-カスミ" = "やれやれ、独り言の多いお嬢ちゃんだ。"
"10028040-32-カスミ" = "ちなみに、気づいてるか？#n……実は我々が結構似ていることに。"
"10028040-33-イチカ" = "……はい？"
"10028040-34-イチカ" = "な、何を……いったいどこが似てるって言うんすか。"
"10028040-35-イチカ" = "私は「トリニティの正義実現委員会」で、そちらは「ゲヘナのテロリスト」っすよ？"
"10028040-36-イチカ" = "なんなら正反対の立場で、何ひとつ似たところはないと思いますが。"
"10028040-37-カスミ" = "ふーん、そうか？私は違うと思うぞ～"
"10028040-38-カスミ" = "お嬢ちゃん、一見普通そうに見えるけど……"
"10028040-39-カスミ" = "お上品なトリニティのお嬢様というよりは……[ruby=・   ・   ・   ・]こっち側[/ruby]の人間じゃないのか？#nフフフッ。"
"10028040-40-イチカ" = "はぁ……何を言うかと思えば……"
"10028040-41-イチカ" = "適当なこと言わないでほしいっす。#n私はすぐにでもこの列車から降りたいんで。"
"10028040-42-カスミ" = "ハーハッハッハッ！分かったよ！#nとりあえず、そういうことにしとこうじゃないか！"
"10028040-43-カスミ" = "でも、あまり急がないようにな。急がば回れと言うだろう。"
"10028040-44-カスミ" = "残りの前方車両は3つ……先頭まで距離的には短いが、これは――"
"10028040-45-カスミ" = "――どんどん本隊に近づいている、という意味だからな。"
"10028040-46-イチカ" = "ヤツらがここまで来たぞ！！"
"10028040-47-イチカ" = "おい！「アレ」の出番だ！早く出せ！！"
"10028040-48-カスミ" = "……ん？"
"10028040-49-イチカ" = "「アレ」……？"
"10028040-50-カスミ" = "ほぉ……どうやら何かサプライズを用意しているみたいだな？"
"10028040-51-イチカ" = "この身勝手な奴らめ……いつまでもやられっぱなしだと思うなよ！"
"10028040-52-イチカ" = "こんなときのために用意しておいたんだ、覚悟しろ！！"
"10028040-53-カスミ" = "……おおっと！"
"10028040-54-カスミ" = "これはこれは……敵さんは準備がいいじゃないか。"
"10028040-55-カスミ" = "まさか、大砲まで出てくるとはねぇ。"
"10028040-56-列車整備工の生徒B" = "ただの大砲なんかじゃない！#nこれは暴動鎮圧用キャノン砲だ！！"
"10028040-57-カスミ" = "ハハッ、正確にはそうなんだろうが……"
"10028040-58-カスミ" = "……まあ、カッコいいから良しとするか。"
"10028040-59" = "[s3] \"……たしかにカッコいいね。\"\n[s4] \"さぞ暴動が多かったんだろうね……\""
"10028040-60-イチカ" = "れ、列車の中であんなものを……"
"10028040-61-イチカ" = "困ったっすね。一旦ここは流れを変えて――"
"10028040-62-イチカ" = "やってみなきゃ分からないだろう！！"
"10028040-63-イチカ" = "さあ、全員突撃だ！あのよく分からん大砲をぶち壊せ――！！！"
"10028040-64-イチカ" = "……はぁ。"
"10028040-65-カスミ" = "……狙われてるぞ！"
"10028040-66-イチカ" = "ま、そうっすよね。"
"10028040-67-カスミ" = "……来たな！！！"
"10028040-68-？？？" = "――止まれ！！"
"10028040-69" = "[ns] \"……この声は！！\""
"10028040-70-？？？" = "全員、そこまでだ！！"
"10028040-71-？？？" = "武器を捨てて、両手を上げろ！！"
"10028040-72-カスミ" = "……んん！？"
"10028040-73-カスミ" = "こんなタイミングで乱入だと？"
"10028040-74-イチカ" = "列車の外からっすか？"
"10028040-75-イチカ" = "この列車、まだ元気に走ってるっすけど？"
"10028040-76-イチカ" = "……あっ。もしかして、あの格好は。"
"10028040-77-イチカ" = "……？"
"10028040-78-イチカ" = "……おっ！？"
"10028040-79-イチカ" = "これはこれは～！風紀委員会の皆さんじゃないか！！"
"10028040-80-？？？" = "聞こえなかったのか？#n止まれと言ったはずだ！"
"10028040-81-イオリ" = "これよりこの列車は……ゲヘナの風紀委員会が統制する！！"
"10028040-82-イオリ" = "今後はすべて、こちらの指示にしたがっ……"
"10028040-83-イオリ" = "てもら……"
"10028040-84-イオリ" = "……せ、先生？"
"10028040-85-イオリ" = "どういうことだ……？#nなぜ先生がこんなところに？"
"10028040-86" = "[s5] \"やっほ、イオリ！\"\n[s6] \"会えて嬉しいよ！\""
"10028040-87-イオリ" = "はぁ……今度は何をやらかしたんだ？#n……まぁ、どうせしょうもないことだろうけど。"
"10028040-88-イオリ" = "……で、その隣の人は。"
"10028040-89-イチカ" = "……ど、どうも。イチカと言います。"
"10028040-90-イチカ" = "ええっと、私たちは――"
"10028040-91-カスミ" = "ひゅ～！我らが風紀委員、イオリ様じゃないか！！"
"10028040-92-カスミ" = "久しぶりだな、元気にしてたか？"
"10028040-93-イチカ" = "そうそう、もし可能なら……#nちょっと助けてもらえるとありがたいんだが。"
"10028040-94-イチカ" = "我々はもう旧知の仲だろう？#nこれからの関係性も考えると……な？"
"10028040-95-イチカ" = "あの、私が言うのもアレっすが……"
"10028040-96-イチカ" = "お二人は、敵対関係ですよね。"
"10028040-97-風紀委員A" = "なっ……"
"10028040-98-風紀委員A" = "何なんだよ、この組み合わせは――！？"
"10028040-99-イオリ" = "この列車、ゲヘナ行きだろ……？#n何でトリニティの正義実現委員がここにいるんだよ！？"
"10028040-100-イオリ" = "それにカスミって……あのカスミか……！？"
"10028040-101-イオリ" = "まさか先生、ずっとアイツと一緒にいたんじゃないよな……？#nなあ……違うと言ってくれ！！"
"10028040-102-カスミ" = "一発で思い出すとは、さすがはイオリじゃないか！ハーハッハッハ！"
"10028040-103-イオリ" = "お前は黙っておけ！"
"10028040-104-イオリ" = "先生！！本当なのか？本当にコイツと……？#nコイツの仲間になったとか……そんなんじゃ、ないよな！？"
"10028040-105-イオリ" = "私たちがコイツを捕まえるために、どれだけ苦労してるのか知ってる先生が……！"
"10028040-106-イオリ" = "……へ？"
"10028040-107-イオリ" = "私を信じてくれないの……って？"
"10028040-108-イオリ" = "冗談言ってる場合か！そう言うなら信じさせてくれ！！#nこっちは今の状況を理解するので精一杯なんだよ！！"
"10028040-109-イオリ" = "……ん？"
"10028040-110-イオリ" = "今はそれどころじゃない……？"
"10028040-111-イオリ" = "……後ろ？"
"10028040-112-イオリ" = "後ろにいったい何が……？"
"10028040-113" = "[ns7] \"キャノン砲が……\"\n[ns8] \"いつの間にか真正面に……\""
"10028040-114-イオリ" = "……これは何だ？"
"10028040-115-イオリ" = "何でこんなものがここに――"
"10028040-116" = "[ns9] \"イオリ……！\"\n[ns10] \"だ、大丈夫、イオリ！？\""
"10028040-117-イオリ" = "くっ……よくも！！#n総員、攻撃――！！！！！！"
"10028040-118-カスミ" = "ハーハッハッハッハ！そうこなくってはな！！！"
