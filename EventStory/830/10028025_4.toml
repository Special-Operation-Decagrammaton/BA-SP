[translation]
"10028025-1-イチカ" = "はぁ、はぁ……はぁ……"
"10028025-2-イチカ" = "えっと、先生……"
"10028025-3-イチカ" = "これって……アレっすよね……"
"10028025-4-イチカ" = "そんなつもりじゃ、なかったっすけど……これって……"
"10028025-5" = "[s1] \"仕方なかったとはいえ……\"\n[s2] \"乗務員と戦っちゃったね……\""
"10028025-6-イチカ" = "……はは。"
"10028025-7-イチカ" = "乗る列車を間違えた挙げ句、トラブルまで……"
"10028025-8-イチカ" = "どんどんダメな方向に進んでるっすね、コレ。#n……申し訳ないです、先生。"
"10028025-9-イチカ" = "……気にしなくて大丈夫、っすか？"
"10028025-10-イチカ" = "気持ちは嬉しいっすけど、私的にはちょっとあんまり……"
"10028025-11-イチカ" = "今回はなんとかなったけど、これで分かってもらえるとは思えないし……#nむしろ乗務員を敵に回しちゃったような……"
"10028025-12-列車乗務員の生徒たち" = "おい、こっちだ！！"
"10028025-13-列車乗務員の生徒たち" = "奴らに逃げ場はない！囲め！！"
"10028025-14-イチカ" = "やっぱこうなるっすよね……ははっ。"
"10028025-15-イチカ" = "んー……"
"10028025-16-イチカ" = "さすがにこれ以上やり合うのは無理があるっすね……先生の身も危ないんで。"
"10028025-17-イチカ" = "とりあえず、ここは大人しく拘束されるしかないっす。"
"10028025-18-イチカ" = "後はゲヘナに着いてから話し合いましょう。#n上手くいくかは分からないっすけど。"
"10028025-19" = "[s3] \"それじゃあカバンは……。\"\n[s4] \"見た感じ、協力してくれなさそうだけど……\""
"10028025-20-イチカ" = "まあ、私もそれは不安っすけど……他に方法がないっすから。"
"10028025-21-イチカ" = "こんな時こそ、なるべく穏便に済ませないと……"
"10028025-22-イチカ" = "……ん？"
"10028025-23-イチカ" = "これ、何の音っすか……？"
"10028025-24-列車乗務員の生徒A" = "……ん？何だ？おい、調べるぞ。"
"10028025-25-列車乗務員の生徒B" = "ここじゃないな……後ろの車両か？"
"10028025-26-列車乗務員の生徒A" = "後ろ？後ろってたしか……"
"10028025-27-列車乗務員の生徒B" = "……「護送車両」じゃ？"
"10028025-28-列車乗務員の生徒A" = "……！！！！！"
"10028025-29-列車乗務員の生徒A" = "ちょっ、待っ――"
"10028025-30-イチカ" = "ゴホッ……！げほっげほっ、げほっ…！"
"10028025-31-イチカ" = "……こ、今度は爆発！？一体どうなってるんすか、この列車！？"
"10028025-32-イチカ" = "せ、先生……！大丈夫っすか、先生！？"
"10028025-33-イチカ" = "……怪我はないっすか？"
"10028025-34" = "[s5] \"うん、大丈夫。\"\n[s6] \"イチカが守ってくれたから助かったよ、ありがとう。\""
"10028025-35-イチカ" = "ふぅ……良かった。"
"10028025-36-イチカ" = "というか……「護送車両」って言ってたのに、何で爆発が……？"
"10028025-37-イチカ" = "後ろの車両は、連結が外れて横転したっぽいし……"
"10028025-38-イチカ" = "私たちを捕えようとした車掌も一緒に……#nまぁ、助かったと言えば助かったっすけど。"
"10028025-39-？？？" = "ふむ……おかしいぞ。いや、こんなものか？"
"10028025-40-？？？" = "護送車両の連結がきれいに外れる目算だったが……なぜだ？"
"10028025-41-イチカ" = "……？人の声がするっすね。"
"10028025-42-？？？" = "爆薬が足りなかったのか……？いや、そんなはずはない。#n……さてはこいつら、装甲を強化したな！"
"10028025-43-？？？" = "ハハッ！何だ、思ったより頭を使うじゃないか。#n気に入ったぞ！ハーハッハッハッハ！"
"10028025-44" = "[s7] \"この笑い方……\"\n[s8] \"聞き覚えが……\""
"10028025-45-？？？" = "ん……おやおや？"
"10028025-46-？？？" = "もしやと思ったが……本当に先生じゃあないか！"
"10028025-47-カスミ" = "これはこれは……まさかこんな場所で会うとは！"
"10028025-48-カスミ" = "今日は素晴らしい一日だな……ああ、とても気に入った！#nハーハッハッハッハ！"
"10028025-49-カスミ" = "フッ。となれば、自己紹介は不要だな。"
"10028025-50-イチカ" = "あなたは……？"
"10028025-51" = "[s9] \"カスミ！？\"\n[s10] \"何でこんなところに……！？\""
"10028025-52-イチカ" = "先生の、知り合いっすか……？"
"10028025-53-イチカ" = "あれ……"
"10028025-54-イチカ" = "かすみ……かすみ……どっかで聞いたことあるような。"
"10028025-55-カスミ" = "ん～、もうギブアップか？もうちょっと頑張ってもらいたかったぞ。"
"10028025-56-カスミ" = "もうちょっと元気よくいこうじゃないか！#nせっかく劇的な出会いを果たしたんだ……フッフッフ。"
"10028025-57-イチカ" = "かすみ……カスミ……あ。"
"10028025-58-イチカ" = "[ruby=きぬがわ]鬼怒川[/ruby]、カスミ……？"
"10028025-59-イチカ" = "……ゲヘナの指名手配犯じゃないっすか。"
"10028025-60-カスミ" = "ハーハッハッハッハ！気付いてもらえるとはな！#n有名人にでもなったみたいで、気分がいいぞ！感謝する！！"
"10028025-61-イチカ" = "そ、それは何よりっす……はは。"
"10028025-62-イチカ" = "ならば、やはり自己紹介は不要だな。#n……で、それよりもだ。"
"10028025-63-イチカ" = "先生は何用で、わざわざこんな僻地に？"
"10028025-64-カスミ" = "それもこんな可愛らしい、トリニティのお嬢ちゃんと？"
