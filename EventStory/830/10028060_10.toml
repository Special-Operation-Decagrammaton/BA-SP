[translation]
"10028060-1" = "第6話;努力の存在"
"10028060-2-イチカ" = "……ははっ。"
"10028060-3-イチカ" = "ははは……"
"10028060-4-イチカ" = "いやぁ……疲れたっす。#nあれだけ暴れたんで、当然といえば当然っすけど。"
"10028060-5-イチカ" = "でも、なんとか先頭まで着いたっす！#nあとは列車を止めるだけっすね。"
"10028060-6-イチカ" = "……ははっ！"
"10028060-7" = "[s1] \"い、イチカ……大丈夫？\"\n[s2] \"遺物は壊れちゃったみたいだけど……。\""
"10028060-8-イチカ" = "はは……そう、っすね……遺物……"
"10028060-9-イチカ" = "……ティーカップだかマグカップでしたっけ……#nもう、クビになろうがなんだって……いいっす……"
"10028060-10-イチカ" = "ただ持ってこいとは言われたけど、中身の状態までは言われてないんで！#nこのままでも大丈夫じゃないっすかね！ははっ！"
"10028060-11-イチカ" = "……はは、は。"
"10028060-12-イチカ" = "…………。"
"10028060-13-イチカ" = "……はぁ。"
"10028060-14-イチカ" = "なに言ってるんすかね、私。"
"10028060-15-イチカ" = "すみません、先生。こんな姿を見せるつもりじゃ……"
"10028060-16-イチカ" = "……久々にやらかしたっす……本当に酷かったっすよね。"
"10028060-17-イチカ" = "今日はいいとこを見せるだなんて言っといて……"
"10028060-18-イチカ" = "一番見せたくなかった姿が、ここぞってときに出ちゃいました。"
"10028060-19-イチカ" = "はあ……"
"10028060-20-イチカ" = "もうちょっと、我慢するべきだったのに……"
"10028060-21-イチカ" = "どうしてっすかね……"
"10028060-22-イチカ" = "……へ？"
"10028060-23-イチカ" = "ガッカリなんかしてないって……？"
"10028060-24-イチカ" = "んー……でも私、失敗したんすよ……？"
"10028060-25-イチカ" = "そうっすよね？"
"10028060-26-イチカ" = "それはそう、って……？"
"10028060-27-イチカ" = "や、やっぱ先生も失敗だって思ってるんじゃないっすか……"
"10028060-28-イチカ" = "……？"
"10028060-29-イチカ" = "な、何っすか……？"
"10028060-30" = "[s] \"でも……\""
"10028060-31" = "[ns3] \"十分我慢してたと思うよ。\"\n[ns4] \"私もイチカのおかげでスッキリしたから……共犯だね！\""
"10028060-32-イチカ" = "……ふっ。"
"10028060-33-イチカ" = "あははっ！"
"10028060-34-イチカ" = "何すかそれ！#n結局先生も、私と同じように感じてたってことすか？"
"10028060-35-イチカ" = "やっぱ、そうっすよね？#nさすがに、あれは限界だったというか……"
"10028060-36-イチカ" = "……そうっすよ！#nほんと、自分でもよく耐えた方だと思うっす！あはははっ！"
"10028060-37" = "[s5] \"あはははっ！！\"\n[s6] \"ハーハッハッハッハ！！\""
"10028060-38-イチカ" = "はははっ！！"
"10028060-39-イチカ" = "……その笑い方は嫌っす。"
"10028060-40-イチカ" = "……あーあ。"
"10028060-41-イチカ" = "まあ、仕方ないっすね。後のことは、帰ってから考えますよ。"
"10028060-42-イチカ" = "先生は関係ないってちゃんと伝えるんで、そこは心配しなくても大丈夫っす。"
"10028060-43-イチカ" = "……はい？"
"10028060-44-イチカ" = "一緒に行く、ってどこにっすか？"
"10028060-45-イチカ" = "……ティーパーティーに？"
"10028060-46-イチカ" = "……何でですか？"
"10028060-47" = "[s7] \"一緒に行って謝るよ。\"\n[s8] \"イチカ1人に行かせるわけにはいかないからね。\""
"10028060-48-イチカ" = "……？？"
"10028060-49-イチカ" = "いや……先生が一緒に謝る必要はどこにもないっすよ。"
"10028060-50-イチカ" = "カバンの輸送と先生のサポートを任されたのは私っすから……自業自得というか。"
"10028060-51-イチカ" = "私の性格に問題があるからなのに……#nなのに、どうして先生が――"
"10028060-52" = "[s9] \"えっ？イチカは良い生徒だよ。\"\n[s10] \"イチカの性格に問題なんてないよ？\""
"10028060-53-イチカ" = "なに言ってるんすか……別に慰めてくれなくても大丈夫っすよ。"
"10028060-54-イチカ" = "自分の性格に問題があるのは、自分が一番知ってるっす。#nだから、なるべく普段は押さえてるわけで……"
"10028060-55-イチカ" = "けど、さっきも見たっすよね。#n結局、ああやって爆発するんすよ。"
"10028060-56-イチカ" = "生まれつきの性格はアレなんで……#nもしそう見えたとしたら、うまく取り繕えてるってことっすかね。"
"10028060-57-イチカ" = "「先生」のことだから、もう分かってると思ってたんすけど……"
"10028060-58-イチカ" = "もしかして、慰めてくれたんすか？"
"10028060-59-イチカ" = "……？#nそうじゃないなら、どういう意味で……"
"10028060-60" = "[s11] \"イチカは我慢しようと頑張ってたよね。\"\n[s12] \"それは変わろう……変わりたいと思ってるってことだから。\""
"10028060-61-イチカ" = "……！"
"10028060-62-イチカ" = "……。"
"10028060-63-イチカ" = "……ええっと。"
"10028060-64-イチカ" = "本当に……"
"10028060-65-イチカ" = "……ははっ。"
"10028060-66-イチカ" = "まさか、そんな言葉が返ってくるだなんて……正直、思いもしなかったっす。"
"10028060-67-イチカ" = "先生は、なんというか……言葉の魔術師みたいっすね。"
"10028060-68-イチカ" = "いやぁ、これは……"
"10028060-69-イチカ" = "先輩方の言う意味が分かったっす……ははは……"
"10028060-70-イチカ" = "そこまで言われたら、もう。"
"10028060-71-イチカ" = "私には何も言えないっすね……なんか気持ちがスッキリしました。"
"10028060-72-イチカ" = "先生には全部バレてるとは……でも、案外これも悪くないというか。"
"10028060-73-イチカ" = "んー……"
"10028060-74-イチカ" = "……。"
"10028060-75-イチカ" = "……ひひっ。"
"10028060-76-イチカ" = "今日は先生と話せて、本当に良かったです。"
"10028060-77-イチカ" = "まあ、仕事は失敗したっすけどね……"
"10028060-78-イチカ" = "それに関しては、先生も一緒に謝ってくれるみたいですし……"
"10028060-79-イチカ" = "ここは素直に甘えさせてもらうっす！#n……なんて、へへっ。"
"10028060-80-イチカ" = "その……先生。"
"10028060-81-イチカ" = "せっかくというか、その……"
"10028060-82-イチカ" = "できればでいいんすが、一つお願いがありまして。"
"10028060-83-イチカ" = "もし……もし、よければなんですけど。"
"10028060-84-イチカ" = "さっきの私の姿……"
"10028060-85-イチカ" = "……トリニティの方たちには、その……"
"10028060-86" = "[s13] \"大丈夫だよ、誰にも言わないから。\"\n[s14] \"2人だけの秘密にしておこう。\""
"10028060-87-イチカ" = "あー、もう……"
"10028060-88-イチカ" = "わざわざ言うまでもなかったっすね……全部お見通しかぁ。"
"10028060-89-イチカ" = "何もかも見透かされて、なんだか困るような、恥ずかしいような。#nでも、ちょっと嬉しいような……"
"10028060-90-イチカ" = "……不思議な感じっす。"
"10028060-91-イチカ" = "……マズい気がしますね。このままだと、もっと先生に甘えちゃいそうで。"
"10028060-92-イチカ" = "建前とかではなく、本当に危険なんっすよ。"
"10028060-93-イチカ" = "先生さえいれば、どうにでもなる――そんな風に思っちゃいそうっすから。"
"10028060-94-イチカ" = "大人に甘えるなんて、私らしくないっすよね。"
"10028060-95-イチカ" = "まあ別に、嫌ってわけじゃないんすけど……"
"10028060-96-イチカ" = "……ん？"
"10028060-97-イチカ" = "アレ、何すかね……？"
"10028060-98-イチカ" = "先生……あの、ほら、川の上に架かってる橋に……何かあるの見えます？"
"10028060-99-イチカ" = "……あれって。"
"10028060-100" = "[ns15] \"温泉開発部、だよね……？\"\n[ns16] \"どう見ても爆発物だよね……\""
"10028060-101-イチカ" = "……へ？"
"10028060-102-イチカ" = "……何で？？"
"10028060-103-イチカ" = "何であそこに……爆発物があるんすか？"
"10028060-104-イチカ" = "こっちには、温泉開発部の部長が乗ってるんすよ……？"
"10028060-105-イチカ" = "……待った、部長が乗ってる……？"
"10028060-106-イチカ" = "……あ。"
"10028060-107-カスミ" = "元々の予定では、とある地点で爆弾を起爆し列車を横転させた後――"
"10028060-108-カスミ" = "そして騒ぎに乗じて部員たちと合流……っと。#nそれで逃げる計画だったんだが。"
"10028060-109-カスミ" = "そんな顔で見ないでもらいたいな！"
"10028060-110-カスミ" = "心配するな、私がいる限りそんなことは起きない！"
"10028060-111-カスミ" = "……私がいる限りはな！"
"10028060-112-イチカ" = "爆弾を起爆し列車を横転……"
"10028060-113-カスミ" = "そんなことは起きない！……私がいる限りはな！"
"10028060-114-カスミ" = "[ruby=・   ・   ・   ・   ・   ・]私がいる限り[/ruby]！"
"10028060-115-イチカ" = "……なる、ほど。"
"10028060-116-イチカ" = "こういうこと……だったんすね。"
"10028060-117" = "[s17] \"最初からこの方法でカスミは逃亡するつもりだったもんね……\"\n[s18] \"指令を出すはずだったカスミは、気絶してるわけで……\""
"10028060-118-イチカ" = "はは……はははっ……"
"10028060-119-イチカ" = "あの人……最後の最後まで、やってくれますね……"
"10028060-120-イチカ" = "はぁ……本当にイヤになるっす……"
