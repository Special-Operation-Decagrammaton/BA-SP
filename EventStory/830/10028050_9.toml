[translation]
"10028050-1" = "第5話;地獄行き特急列車"
"10028050-2-イオリ" = "えっと……その、さ。"
"10028050-3-イオリ" = "まさかとは、思うけど……"
"10028050-4-イオリ" = "その、まさか……"
"10028050-5-イオリ" = "まさか先生とトリニティの正義実現委員が……"
"10028050-6-イオリ" = "「テロリストの交渉に応じる」なんてこと……ないよな？そうだよな？"
"10028050-7-カスミ" = "ハーハッハッハ！！イ～オ～リ～ちゃん！"
"10028050-8-カスミ" = "君はこのカバンの中身が何か知ってるかい？"
"10028050-9-カスミ" = "これは……「トリニティ学園の[ruby=こうほう]校宝[/ruby]」だぞ？"
"10028050-10-カスミ" = "それも……"
"10028050-11-カスミ" = "あの学園の政治に、影響を与えるほどの。"
"10028050-12-イオリ" = "ん……？トリニティの、校宝……？"
"10028050-13-イオリ" = "何でそんな代物がここに……"
"10028050-14-カスミ" = "さあさっ！だから、これ以上複雑に考えることないって。"
"10028050-15-カスミ" = "こうなったからには、みんな正直になろうじゃあないか！#n希望に満ちた結末は意外と近くにあるかもしれないぞ？"
"10028050-16-カスミ" = "まずイオリは、列車を止めて車内の乗務員やギャング団を捕まえたいはずだ。それが最初の目標だっただろう。"
"10028050-17-カスミ" = "私なんて、今日じゃなくてもいいだろう？#nいや、むしろ普段は私を追うのが楽しみなはずだ！"
"10028050-18-カスミ" = "で、トリニティのお嬢ちゃんはこのカバンだよな！#nこれを持って次の停車駅で降りればいいだけ。"
"10028050-19-カスミ" = "私は～……"
"10028050-20-カスミ" = "まあ、みんなが無視してくれれば勝手に消えるさ。"
"10028050-21-カスミ" = "だから要は！我々がここでゴタゴタする必要はないってことだ！#nそうだろう？"
"10028050-22-カスミ" = "偶然同じ列車に乗り合わせた私の存在に目をつむる……それだけのこと！"
"10028050-23-カスミ" = "完璧じゃないか？別に初めてでもないだろ？"
"10028050-24-カスミ" = "みんなも、ある程度世の仕組みも分かってるはずだろうに。"
"10028050-25-カスミ" = "どうだい、イオリ！今日はこの辺で解散といこうじゃないか。"
"10028050-26-カスミ" = "考えてみれば……"
"10028050-27-カスミ" = "そう悪い話じゃないと思うぞ？"
"10028050-28-イオリ" = "ふざけるな！！指名手配犯を目の前にして引き下がれると思うか！？"
"10028050-29-イオリ" = "それに、トリニティの件は私の仕事とは関係ない！！#n私は今、私のやるべきことをやる！！"
"10028050-30-イチカ" = "…………。"
"10028050-31-イチカ" = "……ふっ。"
"10028050-32" = "[s1] \"……？\"\n[s2] \"イチカ……？\""
"10028050-33-カスミ" = "へぇ……？"
"10028050-34-カスミ" = "それこそ、イオリちゃんの独断じゃないのかい？#n勝ち目は薄いだろう？"
"10028050-35-カスミ" = "なんたって、カバンは私の手にある。"
"10028050-36-カスミ" = "つまりトリニティの子と先生は、私の言いなりになるしかない。#nなあ、そこのお嬢ちゃん？"
"10028050-37-イチカ" = "…………。"
"10028050-38-イオリ" = "だから、同じことを何回も言わせるな！#nそれはそれ、これはこれと言ってるだろ！！"
"10028050-39-イオリ" = "なにも監禁するわけじゃない。#n事情を調べたいだけだというのに、何がそんなに不満なんだよ！"
"10028050-40-イチカ" = "…………。"
"10028050-41-カスミ" = "まあ、見てみなって。あのお嬢ちゃんがどんな選択をするか……#nこのカバンを取り戻すためにイオリちゃんを撃つはずさ。"
"10028050-42-カスミ" = "なあ？正義実現委員の……ええと。"
"10028050-43-イオリ" = "……ニカちゃん？"
"10028050-44-イチカ" = "そうだろ？この中身、割れたらまずいんだろう？"
"10028050-45-イチカ" = "…………。"
"10028050-46-イオリ" = "あーーっもう！！さっきからカバン、カバン、カバンってもう……！！！"
"10028050-47-イチカ" = "…………。"
"10028050-48-イオリ" = "たかがカバン1つでぐだぐだと――"
"10028050-49-カスミ" = "……おっ？"
"10028050-50-カスミ" = "ハハッ……！"
"10028050-51-カスミ" = "あは！あはははっ！！"
"10028050-52-カスミ" = "ハーハッハッハッハ！！！"
"10028050-53-カスミ" = "ほら、だから言っただろう！？"
"10028050-54-カスミ" = "イオリちゃんよぉ～……"
"10028050-55-カスミ" = "何でわざわざ勝ち目のない勝負に出るのさ？"
"10028050-56-カスミ" = "こちらの勝ちは目に見えていたじゃないか～まったく。"
"10028050-57-カスミ" = "お嬢ちゃんは、こちらにカバンがある以上絶対――"
"10028050-58-カスミ" = "……ごふっ！？"
"10028050-59" = "[ns] \"……えっ。\""
"10028050-60" = "[ns] \"……！？！？！？\""
"10028050-61-イチカ" = "…………あ。"
"10028050-62-イチカ" = "……撃っちゃったっす。"
"10028050-63-イチカ" = "……ははっ。"
"10028050-64-イチカ" = "……カッとなって、つい。ごめんっす！"
"10028050-65-イチカ" = "ん～"
"10028050-66-イチカ" = "……あははっ！"
"10028050-67" = "[ns3] \"イ、イチカ！？！？！？\"\n[ns4] \"カ、カバンが……！！\""
"10028050-68-イチカ" = "ははっ、そうっすね……落ちちゃったっす！"
"10028050-69-イチカ" = "でもまあ……"
"10028050-70-イチカ" = "やっちゃったもんは仕方ないっす。中身は後で確認しましょうか。"
"10028050-71-イチカ" = "けど……終わりっすね、たぶん。"
"10028050-72-イチカ" = "ま、こうなったからには……"
"10028050-73-イチカ" = "私だけってのもアレなんで。"
"10028050-74-イチカ" = "……全員で地獄に行くっすよ。"
"10028050-75-イチカ" = "あはっ……あはは……！アハハハハハハハッ！！！！"
"10028050-76-ヘルメット団" = "な、何だアイツ……！#n……う、うわぁあああ！！"
"10028050-77-風紀委員" = "だ、誰か止めろ！！"
"10028050-78-スケバン" = "ぎゃぁぁあっ！！！イカレてる！！！！！"
