[translation]
"260120010" = "こんにちは、先生"
"260120020" = "どうか、本官を助けていただけませんか……？"
"260120030" = "もちろんだよ"
"260120040" = "実は本官、この度ライフセーバーの任務を命じられました"
"260120050" = "市民の安全を守る警官として、光栄なのですが……"
"260120060" = "その……"
"260120070" = "水上で人命救助を行なった経験がなくてですね"
"260120080" = "特別な訓練を積む必要があると、昨日になって知りました……"
"260120090" = "それは大変だね……"
"260120100" = "練習、間に合いそう？"
"260120110" = "そこでご相談がありまして……"
"260120120" = "訓練に付き合っていただきたいのです！"
"260120130" = "先生、こんにちは"
"260120140" = "あれから考えてみましたが……"
"260120150" = "やはり、今から訓練をしても間に合いそうもありません"
"260120160" = "1日2日じゃ難しいよね……"
"260120170" = "なので本官は、応急処置に専念することにしました！"
"260120180" = "落水者の生存率を少しでも上げるために！"
"260120190" = "方針を変えたんだね"
"260120200" = "たしかに、それも大事だよね"
"260120210" = "はい！先生がよろしければ、今回も訓練に付き合っていただいても良いでしょうか？"
"260120220" = "前回のような失敗はしないので、ご安心ください！"
"260120230" = "……先生、もしかしてマニュアルを読みましたか？"
"260120240" = "うん、読んだよ"
"260120250" = "もし私が溺れたら、キリノは助けてくれるんだよね？"
"260120260" = "も"
"260120270" = "もちろんです！"
"260120280" = "本官は、公私の区別をつけられる警官なので！"
"260120290" = "AEDのことを言ってるんだけど……"
"260120300" = "ほ、本官をからかわないでください！"
"260120310" = "先生！こんにちは、キリノです！"
"260120320" = "先生のおかげで、ライフセーバーの訓練が終了しました！"
"260120330" = "おめでとう、キリノ"
"260120340" = "これも先生が協力してくださったおかげです！"
"260120350" = "最後に訓練の復習をしようと思っているのですが、また付き合っていただけないでしょうか？"
"260120360" = "もちろん行くよ"
"260120370" = "ありがとうございます！"
"260120380" = "今度こそ、成長した姿をお見せしましょう！"
