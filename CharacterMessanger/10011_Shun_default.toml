[translation]
"808" = "本日の梅花園のおやつは、商会から頂いてきた甘ーいフルーツですよ"
"809" = "みなさん、時間に遅れないように参加してくださいね！"
"810" = "……これ、本当に私宛のメッセージかな？"
"811" = "お味はいかがでしたか、先生？"
"812" = "美味しかったよ、ありがとう"
"813" = "ふふ、お口に合ったのならよかったです"
"814" = "またおやつをご用意してますので、いつでも梅花園にいらしてくださいね！"
"815" = "実は今日のお昼ごろに、"
"816" = "梅花園の子たちが進んで歯磨きしてくれるよう、人形劇をやる予定なんです"
"817" = "人形劇か、楽しそうだね"
"818" = "はい"
"819" = "悪い虫歯菌を倒す戦隊モノの人形劇で、反応も毎回すごく良いんです"
"820" = "ただ、「虫歯」役をやってくれるアシスタントの方が今いなくて……"
"821" = "よろしければ先生、手伝ってくださいませんか？"
"822" = "私、演技に自信は無いんだけど……"
"823" = "ふふ、大丈夫ですよ。私がすぐ隣でお手伝いしますので"
"824" = "先生のおかげで、人形劇を無事に終えることができました！"
"825" = "先生もお食事の後の歯磨き、これからも忘れないでくださいね！"
"826" = "はい、シュン教官！"
"827" = "大丈夫だよ、私は子供じゃないし……"
"828" = "ふふ、良い子ですね。なんて"
"829" = "大人にとっても、歯を磨くのは大事なことですから！"
"830" = "また抜き打ち検査しますので、これからも忘れないようにしてくださいね！"
"831" = "すみません、体調が悪くて……梅花園には寄らず、このまま失礼します"
"832" = "大丈夫？風邪でも引いちゃったのかな？"
"833" = "ちょっと具合が悪いだけですので……ご心配をおかけしてしまいすみません"
"834" = "先生も、健康には気を付けてくださいね"
"835" = "ふふ、先生とお話ししていたら、気分が明るくなりました"
"836" = "なんだか先生の前だと私も、普通の子供に戻ってしまうみたいです"
"837" = "先ほど梅花園の子たちと、面白そうなことをしていたのを見たのですが……"
"838" = "面白そうなこと？"
"839" = "脇に手を入れて高く持ち上げるあの、「たかいたかい」です！"
"840" = "よろしければ、私にもしていただけませんか？"
"841" = "シュンとするのはちょっと危ないんじゃないかな……？"
"842" = "大丈夫です。私、先生が思ってる以上に体が柔らかいので"
"843" = "ふふ、今度またお会いした時に、ぜひお願いしますね。"
"844" = "いつも梅花園の子たちと遊んでいただいてありがとうございます、先生"
"845" = "ただ「たかいたかい」は、いつかまた必ずやっていただきますので"
"846" = "忘れないでくださいね！"
"847" = "だから、シュンとやるのは色々な意味で危ないって……"
"848" = "先生、今日の午後はお時間ありますでしょうか？"
"849" = "うん、大丈夫だよ。どうしたの？"
"850" = "梅花園では毎月誕生日の子たちにプレゼントを渡すのですが、"
"851" = "毎回プレゼント選びに悩んでしまっていまして……"
"852" = "よろしければ今日、一緒にプレゼント選びを手伝っていただけませんか？"
"853" = "もちろん"
"854" = "ふふ、ありがとうございます"
"855" = "それでは放課後、キヴォトス市内のショッピングモールでお願いしますね"
"856" = "先生が紹介してくださったあのケーキ、みんな喜んでいました"
"857" = "良いお店を紹介してくださって、ありがとうございます"
"858" = "それは良かった"
"859" = "また次回も、ぜひお願いしますね！"
"860" = "先生、もしかして最近、ご無理なさっていませんか？"
"861" = "お疲れのご様子でしたが……"
"862" = "二日連続で徹夜だけど、まだ大丈夫"
"863" = "（返事がない。もう眠っているようだ）"
"864" = "大丈夫、ではありません……！"
"865" = "そのままですと、いつかは大変な病気になってしまうかもしれませんよ！"
"866" = "もうっ！本当に眠られたのなら良いのですが、起きてますよね……！？"
"867" = "疲れは万病のもとなんですから、ぐっすり寝ることは大事なんですよ？"
"868" = "ふふ、少しは楽になりましたか、先生？"
"869" = "うん、おかげ様でだいぶスッキリしたよ"
"870" = "また辛くなった時は、いつでも梅花園に立ち寄ってくださいね"
"871" = "みんなにはバレないよう、こっそり布団を敷いておきますので。ふふっ……"
