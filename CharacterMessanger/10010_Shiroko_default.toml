[translation]
"720" = "スクランブルエッグ、牛乳500ml、トマト3切れ→朝ごはん"
"721" = "明日の朝、ランニングの後スーパーに寄る"
"722" = "……？"
"723" = "シロコ？"
"724" = "あ"
"725" = "自分宛てのメモだったのに間違えた、ごめん先生"
"726" = "メモ帳代わりに？"
"727" = "そういうモモトークの使い方もあるんだね"
"728" = "ん……いつも使うものだし、楽"
"729" = "でも、あんまりこうやって使ってる人は見たことないかも"
"730" = "あ、そういえば、今送っちゃった件なんだけど"
"731" = "書いた通り、明日の朝スーパーに寄って買い物しようと思ってて"
"732" = "よかったら一緒にどう？"
"733" = "うん、喜んで"
"734" = "私もちょうど買いたい物あったし"
"735" = "じゃあ、あの場所でね"
"736" = "15kmって、人によっては辛い距離なんだね"
"737" = "ごめん……今度からはちょっと気を付ける"
"738" = "先生"
"739" = "今日、通学路でフェネックを見かけた"
"740" = "フェネック、珍しいね"
"741" = "野生のフェネックなのかな"
"742" = "うん。最近あの辺に時々いるみたい"
"743" = "それから、昨日の夜は流星群も見たの"
"744" = "ランニングをしてると色んなものを見かける"
"745" = "走ることだけじゃなくて、そういうのも楽しい"
"746" = "良いね。一緒には走ってあげられないけど、応援してる"
"747" = "……ん"
"748" = "ごめん。そうやって優しいことを言ってもらえるの、あんまり慣れてなくて"
"749" = "えっと"
"750" = "ありがとう、先生"
"751" = "先生、今日のことは、その……"
"752" = "本当にごめん、私のデリカシーがなかった……"
"753" = "もっと早く気づくべきだった、ごめんね"
"754" = "あ……"
"755" = "ん、その……"
"756" = "そんなことはない、私の方こそごめん……"
"757" = "えっと、じゃあこれで終わりってことで……"
"758" = "今日はありがとう、じゃあまた"
"759" = "先生"
"760" = "自転車は好き？"
"761" = "普通に好きだけど、急だね！？"
"762" = "自転車かあ……まあそれなりに……"
"763" = "ん、そっか"
"764" = "私は結構好き"
"765" = "最近新しい自転車のショップができたみたいで、一緒に行かない？"
"766" = "えっと、今日は楽しかった"
"767" = "無線変速機も、新しいフレームも見れたし"
"768" = "ライディング用水筒も買えた、けど……"
"769" = "その、先生。また今度、一緒に行ってくれる？"
"770" = "うん。私もちょっと興味が湧いてきたかも"
"771" = "こちらこそ楽しかったから、ぜひ"
"772" = "シャーレがあるD.U.って、たくさん地下鉄が通ってるよね"
"773" = "先生もよく使うの？"
"774" = "うん、シャーレから移動する時はよく乗ってるよ"
"775" = "うん、社会人の移動に地下鉄は付き物だよね、"
"776" = "そうだよね、ありがとう。……参考にする"
"777" = "……参考に？"
"778" = "準備する物：双眼鏡、監視カメラの位置データ、GPS追跡電波妨害機"
"779" = "動線をチェックすること。360度の視野の確保が必要"
"780" = "！？"
"781" = "あの、シロコさん？"
"782" = "あ"
"783" = "ごめん先生、また間違えて送っちゃった"
"784" = "お気に入り登録で、先生のチャットが一番上にあるせいかも"
"785" = "さっきのメッセージは気にしないで"
"786" = "先生、家であらためて考えてみたんだけど、他の学園を襲うのはどう？"
"787" = "……えっと"
"788" = "……ごめん、やっぱり今の無しで"
"789" = "先生"
"790" = "今日ね、その……"
"791" = "あ、ちょうど良かった"
"792" = "シロコに話したいことがあって"
"793" = "……ん？"
"794" = "私に？"
"795" = "先生が？"
"796" = "うん、大事なこと"
"797" = "二人で話したいな"
"798" = "……ん"
"799" = "分かった"
"800" = "それじゃあ放課後、教室で待ってる"
"801" = "先生"
"802" = "私、変なこと言ってるかもしれないけど"
"803" = "これからも、何か私が良くないことをしてると思ったら、"
"804" = "その時は、怒ってほしい、かも"
"805" = "気にかけてくれる大人がいるってことは、"
"806" = "その、何ていうか……"
"807" = "嬉しいなって、思って"
"100100010" = "先生"
"100100020" = "最近もまだ、いつもの地下鉄使ってる？"
"100100030" = "地下鉄以外、あんまり選択肢も無いからね……"
"100100040" = "ロードバイクで行くほどの体力はなくてね……"
"100100050" = "ん"
"100100060" = "分かった"
"100100070" = "じゃあ、またね"
"100100080" = "シロコ……？"
