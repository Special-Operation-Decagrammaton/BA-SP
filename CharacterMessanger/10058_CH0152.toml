[translation]
"100580010" = "先生"
"100580020" = "お忙しいとは思いますが……よろしければ今日、少しお時間を頂けませんか？"
"100580030" = "ミネの頼みならもちろん"
"100580040" = "ありがとうございます"
"100580050" = "それで、どうしたの？"
"100580060" = "よく考えてみますと"
"100580070" = "要件を聞かずとも、快く二つ返事でお願いを聞いてくださるなんて……"
"100580080" = "もしかすると先生は、信頼できる大切な方なのではないかと"
"100580090" = "そんなことを思ってしまいますね"
"100580100" = "ミネ……？"
"100580110" = "先生、なんと珍しいことに……"
"100580120" = "今日は時間が空いているのです"
"100580130" = "や、休むことも大切だよ！"
"100580140" = "ミネは時間がある時、何をしてるの？"
"100580150" = "そうですね……"
"100580160" = "趣味と言っていいものか分かりませんが"
"100580170" = "集めた医療用品を眺めて、過ごしたりします"
"100580180" = "医療用品を眺めて……？"
"100580190" = "はい"
"100580200" = "それぞれの効果を比較したり、使うところを想像していると……"
"100580210" = "面白くて、あっという間に時間が過ぎてしまいます"
"100580220" = "その趣味は初めて聞いたな……"
"100580230" = "そうでしたか"
"100580240" = "でしたら、せっかくの機会ですので"
"100580250" = "私の医療用品をお見せしたいのですが……"
"100580260" = "お越しいただけますか？"
"100580270" = "先生"
"100580280" = "今日の午後、少々お時間を頂けないでしょうか？"
"100580290" = "全然大丈夫だよ"
"100580300" = "前の巡回救護？"
"100580310" = "今日の分の巡回救護は午前中に終わらせましたので"
"100580320" = "午後は先生とティータイムを楽しめないものかと思ったのです"
"100580330" = "すぐ仕事を片付けて向かうね！"
"100580340" = "ありがとうございます"
"100580350" = "それでは、お待ちしておりますね"
"100580360" = "シャーレのお仕事を手伝うのは初めてなのですが"
"100580370" = "何か用意しておいた方が良いものはありますでしょうか？"
"100580380" = "ううん、特に何も無くても大丈夫だよ"
"100580390" = "そうでしたか"
"100580400" = "でしたら、事前に注意すべき点やルールなどは……？"
"100580410" = "細かいことは、こっちに来てから説明するね"
"100580420" = "分かりました"
"100580430" = "それでは後ほど伺いますね"
"100580440" = "このようなことを口にするのは恥ずかしいのですが"
"100580450" = "実は……とても緊張しております"
