[translation]
"200380010" = "山海経での生活は、たしかに新鮮ですね"
"200380020" = "ちょっとは慣れてきた？"
"200380030" = "まだ少しですが……"
"200380040" = "あまり慣れてしまいたくない気持ちもあります"
"200380050" = "どうして？"
"200380060" = "うーん……"
"200380070" = "やはり、慣れてしまったら"
"200380080" = "この楽しい気持ちが減ってしまうから、でしょうか"
"200380090" = "あらためて感じたのですが"
"200380100" = "山海経とレッドウィンターは、本当に色々なところが違いますね"
"200380110" = "具体的にはどこが違った？"
"200380120" = "一番は暑さです"
"200380130" = "ジッとしていても汗をかくだなんて"
"200380140" = "初めての経験で"
"200380150" = "たしかに、そうだよね"
"200380160" = "もちろん"
"200380170" = "レッドウィンターより涼しいところのほうが少ないと思いますが"
"200380180" = "これは予想以上でした"
"200380190" = "先生"
"200380200" = "今、お忙しいでしょうか？"
"200380210" = "手なら空いてるよ、どうしたの？"
"200380220" = "よろしければ、お昼をご一緒したいと思いまして"
"200380230" = "もちろん、先生がよろしければですが"
"200380240" = "じゃあ、有名な中華料理屋さんを紹介するね！"
"200380250" = "と思ったけど、トモエならもう知ってるような気も"
"200380260" = "たしかに、色々と事前に調べてから来ましたが……"
"200380270" = "先生に紹介していただけるのでしたら"
"200380280" = "嬉しい限りです"
"200380290" = "期待に応えられるか心配だけど……"
"200380300" = "断言できます"
"200380310" = "心配はいりません"
"200380320" = "先生が一緒に来てくださるんですから"
