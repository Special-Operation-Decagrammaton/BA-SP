[translation]
"200180010" = "先生久しぶり"
"200180020" = "私を探してたって聞いたんだけど……"
"200180030" = "どうしたの？"
"200180040" = "こんにちは、モエ"
"200180050" = "ごめん、ちょっと手伝ってほしいことがあるんだけど今大丈夫かな？"
"200180060" = "先生の手伝い？別にいいけど……"
"200180070" = "にしても珍しいね。先生が手伝ってほしいだなんて"
"200180080" = "あ、別に深い意味はないよ。なんか面白い事件の予感するだけ……くひひ"
"200180090" = "じゃあ、準備してるね"
"200180100" = "先生、ちょっと小耳に挟んだんだけど……"
"200180110" = "シャーレの作業用パソコンのデータが全部消えたって本当？"
"200180120" = "くひひ……そうだよ……"
"200180130" = "そう、これで全部おしまい……くひひ……"
"200180140" = "うわ……先生が私みたいに笑ってる"
"200180150" = "これはかなりヤバそうだね"
"200180160" = "まぁ、来たら分かるよ……"
"200180170" = "わかった、それじゃあ昼過ぎくらいにシャーレ行くね"
"200180180" = "先生、知ってる？"
"200180190" = "スイッチやボタンの上に設置する安全カバーあるじゃん。\nあれ、「モリーガード」って言うんだよ"
"200180200" = "なんでそんな名前がついたかっていうと"
"200180210" = "モリーという子が、何度も非常ボタンを押そうとしたから発明されたカバーだからなんだって"
"200180220" = "そうなんだ"
"200180230" = "興味深い内容だね"
"200180240" = "その話を聞くたびに、ちょっと残念になるんだよね"
"200180250" = "私がモリーより先に生まれていたら"
"200180260" = "今頃、安全カバーの名前は「モエガード」になっていたのかなって……"
"200180270" = "別に名誉な名前ではないと思うんだけど……"
"200180280" = "んー、ごめん、先生……"
"200180290" = "ちょっと子ウサギ公園に来てくれない？"
"200180300" = "いいけど……"
"200180310" = "急にどうしたの？"
"200180320" = "この間、追加で注文した物資が公園に届いたの"
"200180330" = "でも、みんなちょうど作戦でいないから、一人で整理しなきゃいけなくて……"
"200180340" = "重い荷物をたくさん動かすのはちょっと……というのはさておき"
"200180350" = "引火しやすい危険な爆弾がいっぱいあるから……"
"200180360" = "すぐ行くね"
"200180370" = "先生、昨日シラトリの公園にいた？"
"200180380" = "なんか先生が走ってたような気がして……"
"200180390" = "モエもいたんだ"
"200180400" = "声かけてくれたらよかったのに"
"200180410" = "てっきり、仕事中かと思って声かけなかったんだけど……"
"200180420" = "話しかけてよかったんだ？"
"200180430" = "大歓迎だよ。最近ジョギングしててね"
"200180440" = "座りっぱなしだと身体に悪いからね"
"200180450" = "あー、ちょっと分かる"
"200180460" = "ずっと座りっぱだと猫背になるし、肩凝るよね"
"200180470" = "正しい姿勢が大事って分かってるんだけどね……"
"200180480" = "よかったらモエも一緒に運動しない？"
"200180490" = "先生、私が特殊隊員だってこと忘れてない？"
"200180500" = "これでもSRTの一員なんだけど。トレーニングは毎日やってるよ？"
"200180510" = "まあ、サキやミヤコに比べたら全然だけどさ"
"200180520" = "でも、先生と一緒にジョギング……ちょっと破滅的かも？"
