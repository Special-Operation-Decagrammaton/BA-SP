[translation]
"200140010" = "先生、シャーレに裁縫箱はあるか？"
"200140020" = "うん、デスクの中にあるよ"
"200140030" = "全然使って大丈夫だけど、何かあったの？"
"200140040" = "鉄帽のバンドが切れそうになってて"
"200140050" = "こんな状況だし、自分で直すしか……"
"200140060" = "直すってことはもしかして、その時は鉄帽脱ぐの？"
"200140070" = "まあ、それは当然"
"200140080" = "……何で「絶対に脱がない」みたいに思われてるんだ"
"200140090" = "先生、念のため"
"200140100" = "シャーレの前にかごを置いたんだけど、触らないでそのままにしてほしい。ちゃんと持って帰るから"
"200140110" = "あ、何か草みたいなのがたくさん入ってたアレ？"
"200140120" = "ああ。っていうか草って……先生は「タラボ」を知らないのか？"
"200140130" = "生え立てのタラの芽だ、その辺でも簡単に手に入る珍味のひとつ"
"200140140" = "軽くゆがいただけでも美味しいし、天ぷらにも良い。ご飯にピッタリのおかずだ！"
"200140150" = "……まぁもちろん、小麦粉も油もロクに手に入らない今の状況で、天ぷらなんて夢のまた夢なんだが"
"200140160" = "多分だけど……"
"200140170" = "同じようなやつが、西の山道にたくさん生えてた気がする"
"200140180" = "本当か！？"
"200140190" = "先生、今すぐ案内してくれ！"
"200140200" = "先生。シャーレにあるTVって、録画機能は付いてるのか？"
"200140210" = "今夜「クロノスチャンネル」で、気になるドキュメンタリーがあって……"
"200140220" = "うん、録画しておくね"
"200140230" = "あ"
"200140240" = "助かる、ありがとう"
"200140250" = "最近はやたらと機能が多い機器ばっかりで、マニュアルもどんどんデジタル化されて読みづらいし……"
"200140260" = "シンプルな機能で使いやすかった、昔の製品が恋しい……"
"200140270" = "いや、「昔」も何も……"
"200140280" = "ん？"
"200140290" = "それはつまり、私が「おばあちゃん」だと言いたいのか？"
"200140300" = "いや、そうじゃなくって……"
"200140310" = "さっきヴァルキューレの知り合いから聞いたんだけど"
"200140320" = "公園の裏手にある山に、キャンプ用品が色々捨てられてたらしい"
"200140330" = "昔ちょっとした基地みたいなのがあったらしくて、そこが無くなる時に放置されたんだとか"
"200140340" = "たとえ古いものだとしても、今の私たちにとっては無いよりマシだろうし"
"200140350" = "ちょっと今週末に行こうかと思ってるんだけど……"
"200140360" = "その、聞いた感じ多分量が多くて"
"200140370" = "手伝ってくれたら助かる"
"200140380" = "うん、了解。喜んで"
"200140390" = "ありがと"
"200140400" = "何かみんな忙しいらしくて、でもひとりで往復するのもアレだし……"
"200140410" = "そういえばその山、結構登山道が険しいみたいだから"
"200140420" = "多分ちゃんとした格好で来た方が良い"
"200140430" = "先生、悪いんだが……"
"200140440" = "ちょっとシャーレの休憩室を見てくれないか？"
"200140450" = "テーブルの上に本があると思うんだが"
"200140460" = "「空井」と書いてあるから、すぐにわかるはずだ"
"200140470" = "あったら保管しておいてくれ。取りに行く！"
"200140480" = "今日のことは忘れろ"
"200140490" = "もし情報が漏れたら、武力行使も辞さない"
"200140500" = "油性ペン、落ちないね……"
"200140510" = "いい気味だ！"
"200140520" = "サキが書き込んだなら、私も大事な教範かな？"
"200140530" = "なっに　を"
"200140540" = "い言っ"
"200140550" = "……迫撃砲の味を体験したいのか！？"
