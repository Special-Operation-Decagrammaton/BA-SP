[translation]
"130110010" = "勇者よ……"
"130110020" = "このモモトークを見たら、すぐにゲーム開発部の部室へと来たれ……"
"130110030" = "うん、じゃあ今から行くね"
"130110040" = "えー……"
"130110050" = "ノータイムでクエスト受注！"
"130110060" = "さっすが先生！"
"130110070" = "ぐっ、ここでその選択肢！？これは予想してなかった……！"
"130110080" = "いや、でもシナリオによってはこういう分岐もアリ……"
"130110090" = "……じゃなくて！"
"130110100" = "約束したじゃん！今日部室でって！"
"130110110" = "……そうだっけ？"
"130110120" = "とにかく、ゲーム開発部の部室で待ってるから！"
"130110130" = "早く来てね！"
"130110140" = "先生ー"
"130110150" = "最高のゲームシナリオの条件って何だと思う？"
"130110160" = "最高のゲームシナリオ……？"
"130110170" = "急にどうしたの？"
"130110180" = "それは……"
"130110190" = "ああっ、思い出したらイライラしてきた！"
"130110200" = "あいつら、好き放題言ってくれちゃって！"
"130110210" = "発想が古いとか、展開が中だるみしてるだとか"
"130110220" = "もうダメ！先生、今からゲーム開発部の部室に来て！"
"130110230" = "……？"
"130110231" = "どうしよう先生！？"
"130110232" = "せっかく浮かんだアイデアが思いっきり矛盾してて、"
"130110233" = "それを打破する次のアイデアが全然浮かばない！助けてーー！"
"130110234" = "うわあぁぁぁん！！！"
"130110240" = "先生、レトロゲームの世界はすごく広いんだよ！"
"130110250" = "でもそんなレトロゲームの中でも、シナリオの比重が大きいゲームとして、"
"130110260" = "やっぱり恋愛シミュレーションゲームは外せない！"
"130110270" = "恋愛シミュレーション……？"
"130110280" = "だから今日は、"
"130110290" = "恋愛シミュレーションをシミュレーションしてみようと思うの！"
"130110300" = "じゃあ後で場所は送るから、そこで待ち合わせね！先生！"
"130110310" = "シミュレーションをシミュレーション……？"
"130110320" = "先生、その……今日、楽しかった。ありがと"
"130110330" = "うん、私も楽しかったよ"
"130110340" = "そ、それは良かった"
"130110350" = "でも、今日のことはその、他の人には秘密だよ！"
"130110360" = "特にミドリとかには絶対言わないで！"
"130110370" = "どうしてそこまで？だって確か最初はゲーム開発部で……"
"130110380" = "ダメ！絶対に秘密！！"
"130110390" = "先生先生！"
"130110400" = "モモイが現れた！"
"130110410" = "どうしたの？"
"130110420" = "今度、春葉原ですっごく大きなイベントがあるんだって！"
"130110430" = "なんと、ウルトラマリンシスターズ40周年スタンプラリー！"
"130110440" = "スタンプラリー？"
"130110450" = "スタンプを全部集めたら、プレゼントとして限定グッズを貰えるみたいなの"
"130110460" = "これは見逃せない……！"
"130110470" = "一緒に行こ、先生！！"
"130110480" = "覚えているか"
"130110490" = "狩人よ！"
"130110500" = "もちろんだよ、相棒……"
"130110510" = "今こそ狩りのとき……！"
"130110520" = "いざ行かん！"
"130110530" = "私の背中は預けたよ！"
