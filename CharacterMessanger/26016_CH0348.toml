[translation]
"260160010" = "★週刊万魔殿★愛読者様特別イベント！"
"260160020" = "あなたも記事を書いてみませんか？お申し込みはお早めに！"
"260160030" = "えっ……？"
"260160040" = "読者が記事を書くの……？"
"260160050" = "あ、怪しんでますね……"
"260160060" = "あー、もう！認めます！"
"260160070" = "先生と遊ぶための口実ですよ！"
"260160080" = "一人で取材するのは寂しいですし……"
"260160090" = "正直だね……"
"260160100" = "当然です！週刊万魔殿から真実を抜くのは、ラーメンの麺抜きみたいなものですから！"
"260160110" = "それってただのスープじゃない？とか言われますが……それはさておき！"
"260160120" = "では、現場でお待ちしています！"
"260160130" = "ヤバいです！記事、ポシャっちゃいました！"
"260160140" = "先日のあの店、「私たちの身近にある名店」という特集記事を書いたんですが"
"260160150" = "編集中に、お店が潰れたそうです！"
"260160160" = "あんなにお客さんがたくさんいたのに、どうしてでしょう？"
"260160170" = "黒字倒産……？"
"260160180" = "そういうこともあるんですね！"
"260160190" = "勉強になりました！"
"260160200" = "突然ですが、先生は海をご存じですか？"
"260160210" = "聞くところによると、水が多い場所だそうですよ！"
"260160220" = "そりゃ海だからね！？"
"260160230" = "はい！"
"260160240" = "このようにして、明白な事実をあえて出すことで"
"260160250" = "人の興味を引くことができます！記事の手法の一種ですね！"
"260160260" = "では実際、水がどれだけ多いか確かめに行きましょう！"
"260160270" = "どう確かめるか分からないけど、了解！"
"260160280" = "先日は貴重なお話、ありがとうございました！"
"260160290" = "あれがなければ、そのまま立ち直れないところでしたよ……"
"260160300" = "おかげさまで助かりました！"
"260160310" = "やっぱり、記憶に頼りきりになるのは……"
"260160320" = "危険ですね！"
"260160330" = "今週も無事脱稿です！"
"260160340" = "でも、記事の内容が……"
"260160350" = "私が話したのと、大分違う気がするんだけど……"
"260160360" = "あくまで事実に基づいた上で……多少、脚色しました"
"260160370" = "おかげで話題沸騰です！"
"260160380" = "先生、さまさまです！"
"260160390" = "「週刊万魔殿」の定期購読"
"260160400" = "今すぐお申し込みください……"
"260160410" = "もう定期購読しているけど……"
"260160420" = "なんだか元気がないね？"
"260160430" = "うぅ……"
"260160440" = "記事のネタがどうしても思い浮かばないんです"
"260160450" = "面白いこともないし……"
"260160460" = "もうこうなったら、私がドカンと事件を起こすしか……"
"260160470" = "よく分からないけど、とりあえずストップ！"
"260160480" = "スクープが見つかりそうな場所を散歩してみるのはどう？"
"260160490" = "お？"
"260160500" = "おお！"
"260160510" = "その手がありました！"
"260160520" = "現場百遍の精神ですね！"
"260160530" = "では、後ほどお会いしましょうー！"
"260160540" = "私も行くの！？"
"260160550" = "先生、見てください！"
"260160560" = "じゃじゃーん！"
"260160570" = ""
"260160580" = "今週の週刊万魔殿が、過去最多部数を記録しました！"
"260160590" = "マコト先輩も、私を今年のリポーター賞の候補に挙げるって言ってました！"
"260160600" = "記者は私しかいないんですが……それはさておき！"
"260160610" = "先生のおかげでスクープをゲットすることができました！"
"260160620" = "力になれたなら良かった！"
"260160630" = "はい！また次もよろしくお願いします！"
"260160640" = "それで、あの昆布はどうなったの？"
"260160650" = "厨房に持っていって、酢昆布にしました！"
"260160660" = "保管するのも一苦労ですから！"
"260160670" = "大切に保管するんじゃないんだ！？"
"260160680" = "夏の特集記事もいよいよ大詰めです！"
"260160690" = "今回は海で最終調整しようと思います！"
"260160700" = "現場の雰囲気をそのまま載せたいので！"
"260160710" = "ということで、海の家に来てくれますか？"
"260160720" = "お待ちしています！"
"260160730" = "あの……先生……"
"260160740" = "えっと……"
"260160750" = "いえ！大丈夫です！"
"260160760" = "話す内容、忘れました！"
"260160770" = "では！そういうことで！"
