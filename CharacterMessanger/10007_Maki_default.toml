[translation]
"577" = "先生、ごめん……今ちょっと時間大丈夫？"
"578" = "大丈夫だよ"
"579" = "どうしたの？"
"580" = "その……あたしのこと、迎えに来てくれない？"
"581" = "身元保証人が必要みたいなんだけど、生徒会には連絡しづらくって……"
"582" = "場所はその、えっと……交番"
"583" = "交番！？"
"584" = "今日は来てくれてありがと、先生"
"585" = "生徒会に連絡してたら、危うく二重で小言の嵐になるところだったよ"
"586" = "これからは気を付けてね"
"587" = "うん。公共の場では、グラフィティはやらないようにする……"
"588" = "今日約束した通り、今度は大きなキャンバスで一緒に絵を描こうね！"
"589" = "約束だよ！"
"590" = "うん、約束"
"591" = "今日もお疲れ様、先生。気を付けて帰ってね～！"
"592" = "マキもお疲れ様"
"593" = "先生は今日の放課後、何か用事とかある？"
"594" = "あたしはブラックマー"
"595" = "や、南区の方に用事があるから、先に帰るね～"
"596" = "……ブラックマーケット？"
"597" = "もったいない……大勢の人にBOOMの魅力を伝えるチャンスだったのに"
"598" = "人に迷惑がかかるやり方はダメだって……"
"599" = "うぅ、先生がダメって言うなら仕方ない……"
"600" = "そういえば先生って、BOOMやったことある？"
"601" = "ううん、ないよ"
"602" = "今度ダウンロードしてあげるから、一緒に「スピードラン」やろう！"
"603" = "3分以内にクリアできるようになるまで、私が横で手伝ってあげるから！"
"604" = "その言い方、もしかして3分の壁を切るの相当難しいのでは……？"
"605" = "先生は今回の小テストの話、他の誰かから聞いた？"
"606" = "信じられないぐらい難しかったんだけど！"
"607" = "普段からちゃんと予習・復習をしないとダメだよ"
"608" = "もしかしてテスト範囲外の問題が出たとか？"
"609" = "うっ、正論……"
"610" = "ううん、そういうわけじゃないんだけど……"
"611" = "とにかく！このままだと補習授業を受けることになっちゃうよ～！"
"612" = "先生、助けて～！"
"613" = "勉強教えてくれてありがと、先生"
"614" = "先生の期待に応えられるように、次のテストでは満点取ってくるね！"
"615" = "うん、楽しみにしてる"
"616" = "あ、もう一つ質問なんだけど、"
"617" = "ノートの最後にあるクーリングオフの説明って、全科目のテストに出るの？"
"618" = "マキちゃん、ちょっと落ち着こうか"
"619" = "先生！この前のテスト、満点だったよ！"
"620" = "ふふっ、先生がこの前勉強見てくれたおかげ！"
"621" = "おめでとう、マキも勉強頑張ったね"
"622" = "偉いでしょ？もっと褒めて～！"
"623" = "じゃあ頑張ったマキのために、市内でアイスクリームを買ってあげようかな"
"624" = "本当！？約束だよ、先生！"
"625" = "もうスクショ撮ったから、後で知らんぷりとかダメだからね！"
"626" = "ゴミの片づけ手伝ってくれてありがと、先生"
"627" = "それから、見逃してくれたのも。ありがとね"
"628" = "今回のことは、善意だったんでしょ？"
"629" = "うん！あっ……でも、お巡りさんに見つかって怒られたらどうしよう……"
"630" = "その時は先生が「違うんです」って言ってね！絶対だよ！"
"631" = "先生、グッドニュース！"
"632" = "このメッセージを見たら、この前グラフィティを描いた壁まで来てくれる？"
"633" = "どうしたの？"
"634" = "来れば分かるから！"
"635" = "あ、ちゃんと汚れてもいい服でね！"
"636" = "……？"
"637" = "ふふっ、先生と一緒にグラフィティができて楽しかった！"
"638" = "私も楽しかったよ"
"639" = "私の絵が下手すぎて、壁の持ち主が気に入らなかったらどうしよう……"
"640" = "あははっ、まだ気にしてたの？"
"641" = "心配しないでも大丈夫、グラフィティはその人の個性を表現する芸術だから"
"642" = "先生が描いた絵にも、先生の個性が十分に表れてたよ"
"643" = "いつかまた、こういう機会があったらいいな"
