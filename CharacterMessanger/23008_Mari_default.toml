[translation]
"230080010" = "今日も平和と安寧が、みなさんと共にありますように"
"230080020" = "何か悩みごとなどがありましたら、いつでも私たちの元をお訪ねください"
"230080030" = "お越しになれない方の元へは、私たちの方からお伺いしますので。ぜひお気軽にお申し付けください"
"230080040" = "あ"
"230080050" = "ご、ごめんなさい……"
"230080060" = "間違って、先生に送ってしまいました"
"230080070" = "これ、私が行っても大丈夫？"
"230080080" = "これ、生徒じゃなくても行って大丈夫？"
"230080090" = "あ、はい"
"230080100" = "もちろんです"
"230080110" = "そういうことでしたら、楽しみにお待ちしておりますね"
"230080120" = "先生、あれからお変わりはありませんか？"
"230080130" = "急に装飾物が落ちるだなんて……びっくりしましたね"
"230080140" = "もしどこかが痛んだりするようでしたら、いつでも仰ってくださいね。それか、やはり今からでも一緒に病院に……"
"230080150" = "大丈夫、心配させてごめんね。やっぱりよく見てるのかも"
"230080160" = "それでも、諦めるわけには……"
"230080170" = "……"
"230080180" = "？"
"230080190" = "えっと……？"
"230080200" = "先生、いかがお過ごしですか？"
"230080210" = "先日の怪我は、もう治られましたか……？"
"230080220" = "ありがとう。そこまで気負わなくても大丈夫だよ"
"230080230" = "うん、全然大丈夫だよ。気にしないで"
"230080240" = "いえ、そうはいきません"
"230080250" = "これからシスターになろうというのに、こういったことをただただ見過ごすなんてわけには"
"230080260" = "今後はこのようなことが起きないよう、祈らないとです……"
"230080270" = "そういえば"
"230080280" = "今日はちょうど、大聖堂では何の用事もない日でして"
"230080290" = "もし先生がよろしければ……"
"230080300" = "無事に帰られましたか、先生？"
"230080310" = "今日は先生に来ていただいたおかげで、私も心が安らぎました"
"230080320" = "やはり先生のためと言いつつ、自分のためにもなっていたようです"
"230080330" = "……何だか心配ですね。そう思うと先生のことを考えるのが、何だか不純な動機になってしまいそうで"
"230080340" = "多分大丈夫じゃないかな……？"
"230080350" = "でもおかげで私も、今日は何だか落ち着いたよ。ありがとう"
"230080360" = "ふふっ、それでしたら何よりです"
"230080370" = "そう言っていただけると嬉しいですね"
"230080380" = "それでは、先生"
"230080390" = "また今度お会いしましょう"
"230080400" = "今日も平和と安寧が、みなさんと共にありますように"
"230080410" = "何か悩みごとなどがありましたら、いつでも私たちの元をお訪ねください"
"230080420" = "ただ、本日私は聖堂にいないのですが……"
"230080430" = "マリー、今日どこかに出かけるの？"
"230080440" = "色々と忙しそうだね、お疲れ様"
"230080450" = "あ、いえ、特に何か用事というわけではないのですが……"
"230080460" = "ちょっと体調を崩してしまいまして……"
"230080470" = "大丈夫！？"
"230080480" = "風邪！？"
"230080490" = "ご、ごめんなさい"
"230080500" = "かえってご心配させてしまいましたね……"
"230080510" = "大した症状ではありませんので、休んだらすぐ良くなるかと"
"230080520" = "すみません、いつの間に寝てしまって……"
"230080530" = "伝えそびれてしまったのですが、本当にありがとうございました"
"230080540" = "恩返しになるのか分かりませんが……"
"230080550" = "それに、いつものことではありますが"
"230080560" = "また、先生のためにお祈りいたしますね"
"230080570" = "おはようございます、先生"
"230080580" = "その、今お時間よろしいでしょうか……？"
"230080590" = "うん、どうしたの？"
"230080600" = "全然大丈夫だよ"
"230080610" = "ありがとうございます"
"230080620" = "その、えっと……"
"230080630" = "すみません、何と言えば良いものか……こういうのには、慣れていなくって……"
"230080640" = "もしよろしければ、どこかでお会いしてお話してもよろしいですか？"
"230080650" = "あ、その、何か事件があったですとか、暗い悩みとかではありません。念のため……"
"230080660" = "それでは、お時間などは後ほどお送りしますので"
"230080670" = "よろしくお願いいたします"
"230080680" = "先生、今日はありがとうございました"
"230080690" = "本当に、嬉しかったです"
"230080700" = "これからも時々ご連絡させていただくかもしれませんが……"
"230080710" = "どうぞ、よろしくお願いいたします。それでは、また"
"230080720" = "先生"
"230080730" = "……呼んでみただけ、です"
"230080740" = "おはようございます、先生"
"230080750" = "その……もし、お時間よろしければ……"
"230080760" = "大丈夫だよ。どうしたの？"
"230080770" = "私にできることがあれば何でも言って"
"230080780" = "ありがとうございます……！"
"230080790" = "シスターフッドの備品を買いに行くのですが"
"230080800" = "私一人ではちょっと手が足りなくて……"
"230080810" = "もし大丈夫でしたら、お付き合いいただけないでしょうか……？"
"230080820" = "うん、任せて"
"230080830" = "どこに向かえばいいかな？"
"230080840" = "ありがとうございます！場所、今送りますね"
"230080850" = "今日は本当にありがとうございました"
"230080860" = "お食事の後、学園まで送って下さって……"
"230080870" = "本当にアクセサリー、買わなくて良かったの？"
"230080880" = "ふふ、もう大丈夫ですよ"
"230080890" = "先生と今日お話できたことで"
"230080900" = "コサージュを、もっと大切にすると決めましたので"
"230080910" = "……今はそれで、充分なんです"
