[translation]
"101490010" = "トライデントの生徒に聞いたんですが……"
"101490020" = "先生、バナナを持ってきちゃったんですね"
"101490030" = "かなり話題になってましたよ"
"101490040" = "うん……すごく怒られちゃった……"
"101490050" = "みんなの目、怖かったな……"
"101490060" = "船の上では、バナナはタブーとされているんです"
"101490070" = "周囲の食材を腐りやすくするので"
"101490080" = "大げさだと思われるかもしれませんが、安全対策としてご理解ください"
"101490090" = "規則なら仕方ないね"
"101490100" = "そういえば、ダイビングにも規則ってあるの？"
"101490110" = "ええ、いくつかありますよ"
"101490120" = "たとえば――"
"101490130" = "水の中に入った後は"
"101490140" = "必ず水の外に出なければならない、とか"
"101490150" = "なんか、意味深だね……"
"101490160" = "先日、当番でシャーレに伺った時"
"101490170" = "素敵な曲が流れていましたよね"
"101490180" = "よかったら、曲名を教えていただけますか？"
"101490190" = "あー……ごめん、あれはね"
"101490200" = "ラジオを流していただけだから、曲名までは私も……"
"101490210" = "そうだったんですか"
"101490220" = "残念ですが、仕方ないですね"
"101490230" = "プレイリストに入れようと思っていたのですが"
"101490240" = "歌を聴くのが好きなんだね"
"101490250" = "はい"
"101490260" = "聴くのも好きですが……"
"101490270" = "そうですね"
"101490280" = "歌が、好きなんです"
"101490290" = "困りました……"
"101490300" = "どうしたの？"
"101490310" = "実は、明日が味噌汁だと分かって……"
"101490320" = "ダイビングが大変になるので"
"101490330" = "今から憂鬱です……"
"101490340" = "……味噌汁？"
"101490350" = "はい"
"101490360" = "先生は"
"101490370" = "どう思いますか？"
"101490380" = "よく分からないけど……"
"101490390" = "私は味噌汁好きだよ"
"101490400" = "本当ですか？"
"101490410" = "人によって好みはあると思いますが"
"101490420" = "私はとても苦手で……"
"101490430" = "好き嫌いは、人それぞれだもんね"
"101490440" = "できれば、先生と同じ好みがよかったのですが……"
"101490450" = "少し残念です"
"101490460" = "明日のダイビング見学ですが……"
"101490470" = "何か暇つぶしになるようなものを持ってきてください"
"101490480" = "本とか、ゲーム機とか"
"101490490" = "あるいは、先延ばしにしていたお仕事とか"
"101490500" = "水に入ってから2時間は出ない予定なので"
"101490510" = "2時間もダイビング？"
"101490520" = "そんなに深く潜るの……？"
"101490530" = "はい、いつもより少し深くまで潜る予定でもあるんですが……"
"101490540" = "ここ数日、連続で潜っているので"
"101490550" = "浮上に時間をかけて、減圧症を予防するんです"
"101490560" = "長時間潜ると、逆に減圧症になるんじゃないの？"
"101490570" = "いいえ。減圧症は急激な気圧変化で起こるものなので"
"101490580" = "ゆっくり浮上したほうが安全なんですよ"
"101490590" = "減圧チャンバーを使用するという手もありますが……"
"101490600" = "何はともあれ、明日もよろしくお願いします！"
"101490610" = "この間は失礼しました……"
"101490620" = "減圧症でボーッとして"
"101490630" = "なんか……"
"101490640" = "その、変なこと言っちゃって……"
"101490650" = "気にしないで！"
"101490660" = "元はと言えば私のせいだから……"
"101490670" = "体調はもう大丈夫？"
"101490680" = "すぐに減圧したので問題ありませんでした"
"101490690" = "次はこんなことがないように……"
"101490700" = "いえ"
"101490710" = "また、何かあったら"
"101490720" = "先生が助けてくれると嬉しいです"
"101490730" = "もちろん！"
"101490740" = "ふふ"
"101490750" = "ありがとうございます！"
