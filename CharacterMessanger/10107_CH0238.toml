[translation]
"101070010" = "★週刊万魔殿★☞定期購読したら記念プレゼントがもれなくもらえる！"
"101070020" = "今すぐご連絡ください！"
"101070030" = "チアキ？"
"101070040" = "チアキ……だよね？"
"101070050" = "お？"
"101070060" = "ご返信ありがとうございます、先生！！"
"101070070" = "「週刊万魔殿」の定期購読をご希望ですか？"
"101070080" = "あ、そうじゃなくて"
"101070090" = "ふふ！無理強いはしませんよ！"
"101070100" = "まずは、現物を見てからご判断ください！"
"101070110" = "あ、そういえば"
"101070120" = "忘れてました！"
"101070130" = "「週刊万魔殿」の定期購読記念プレゼント、あとで贈っちゃいますね！"
"101070140" = "何がもらえるの？"
"101070150" = "ふふふ"
"101070160" = "それは届いてからのお楽しみ～！"
"101070170" = "こんにちは～先生！"
"101070180" = "今日ってシャーレにいますか？"
"101070190" = "はい……勤務中です……"
"101070200" = "あら？なんだか元気ないみたいですね？"
"101070210" = "それなら"
"101070220" = "午後の憂鬱を一気に吹き飛ばすためにも！"
"101070230" = "「週刊万魔殿」の定期購読記念プレゼントをお届けしましょう！"
"101070240" = "今すぐ向かいますので、少々お待ちくださいね！"
"101070250" = "うぅ"
"101070260" = "もう無理……胃がムカムカします……"
"101070270" = "どれくらい食べたの……？"
"101070280" = "さっき食べてたスイーツを、全部……"
"101070290" = "でもみんな助けてくれました！"
"101070300" = "写真もいっぱい撮れましたし！"
"101070310" = "それなら良かった"
"101070320" = "でも、しばらく甘いものは……"
"101070330" = "うぅ……"
"101070340" = "-お知らせ-"
"101070350" = "今週の「週刊万魔殿」は休刊です！"
"101070360" = "ご迷惑をおかけしますが、来週をお楽しみに！"
"101070370" = "先生"
"101070380" = "今日のとこで気に入った部活がありましたら"
"101070390" = "一緒に客員メンバーになってみるのはどうでしょう！"
"101070400" = "いいね。考えとく"
"101070410" = "はい！"
"101070420" = "いつでもご連絡くださいね～！"
"101070430" = "次号の「週刊万魔殿」は特集号です！"
"101070440" = "ワクワクしませんか、先生？"
"101070450" = "特集号？"
"101070460" = "はい！"
"101070470" = "読者の皆さんが知りたがっている情報を"
"101070480" = "余すことなくお見せする内容になります！"
"101070490" = "気になるね……"
"101070500" = "どんな内容なの？"
"101070510" = "ふふ"
"101070520" = "それは～まだ秘密です！"
"101070530" = "今日は本当にありがとうございました！"
"101070540" = "おかげで素敵な記事が書けそうです！"
"101070550" = "お役に立てたのなら嬉しいよ"
"101070560" = "今回の特集号が刷り上がったら、真っ先に先生にお届けしますね！"
"101070570" = "お楽しみに～！"
