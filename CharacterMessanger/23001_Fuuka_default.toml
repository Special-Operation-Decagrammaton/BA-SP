[translation]
"1449" = "先生、お願いがあるのですが……"
"1450" = "今日、時間大丈夫でしょうか？"
"1451" = "うん、全然大丈夫だよ"
"1452" = "よ、良かったです！"
"1453" = "それでは、食堂で待ってますね。よろしくお願いします"
"1454" = "今日は手伝ってくれて、ありがとうございました"
"1455" = "ううん、大したことはしてないよ"
"1456" = "いえいえ。このお返しは、後日必ずしますので"
"1457" = "楽しみにしていてくださいね"
"1458" = "先生、準備ができました"
"1459" = "準備って、何の……？"
"1460" = "今日、ゲヘナの学生食堂に来てもらえませんか？"
"1461" = "フウカの全力、お見せします"
"1462" = "す、すみません、先生"
"1463" = "美味しい料理でおもてなしをしなきゃと思って、つい……"
"1464" = "今日は本当に、すみませんでしたっ！"
"1465" = "先生、お目覚めになりましたか？体調は如何でしょう……？"
"1466" = "うん、今起きたところ"
"1467" = "大丈夫、何ともないよ"
"1468" = "ふう、良かったです……"
"1469" = "どうやったら埋め合わせができるだろうと、先ほどまで色々考えていまして"
"1470" = "ちょうど、良いアイデアが浮かんだのですが……"
"1471" = "今日の午後、お会いできませんか？"
"1472" = "うん、喜んで"
"1473" = "ありがとうございます！では、待ってますね！"
"1474" = "今日のウナギ料理はいかがでしたか？"
"1475" = "先生のお口に合ったのならよかったのですが"
"1476" = "次はもっと美味しい料理を振舞いますね！"
"1477" = "先生。実は、先日新しく考えついた料理があるのですが"
"1478" = "どうしても、先生に最初に食べていただきたくて"
"1479" = "もしよろしければ……"
"1480" = "フウカの新メニュー！絶対に行く！"
"1481" = "ふふっ。はい、待ってますね"
"1482" = "先生"
"1483" = "今日お手伝いしてくださるお話、ちゃんと覚えていらっしゃいますか？"
"1484" = "覚えてるよ"
"1485" = "……今日だっけ？"
"1486" = "良かったです♪"
"1487" = "あっ、もしかして、きちんと伝えられてなかったでしょうか……？"
"1488" = "ごめん、冗談"
"1489" = "あ、冗談、でしたか……"
"1490" = "そんな意地悪な冗談を言われてしまうと、"
"1491" = "私、傷つきます……"
"1492" = "ご、ごめんなさい……！"
"1493" = "……なんて、これも冗談ですけどね"
"1494" = "やられた！"
"1495" = "ふふ、それではおふざけはこれぐらいにして"
"1496" = "食堂で待ってますね！"
"1497" = "せ、先生……"
"1498" = "その、今日のことは……"
"1499" = "何かあったっけ？"
"1500" = "フウカたん、可愛かったな……"
"1501" = "う、うぅっ……！ほ、他の人たちには、内緒ですからね……？"
