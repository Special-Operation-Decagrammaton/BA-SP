[translation]
"130140010" = "師匠、こんな話聞いたことある？"
"130140020" = "「露出が多いほど防御力が高くなる」ってやつ"
"130140030" = "び、ビキニアーマーとかのこと？"
"130140040" = "どこで聞いたの！？"
"130140050" = "とんでもない話だよな"
"130140060" = "水着姿で修練なんて、ちょっと恥ずかしいし"
"130140070" = "……でも、挑戦してこそ青春だろ？"
"130140080" = "せっかくだから、今日は水着姿で修練してみる"
"130140090" = "プールにでも行くの？"
"130140100" = "いや、山だよ"
"130140110" = "水着で！？"
"130140120" = "よーし"
"130140130" = "決めた！"
"130140140" = "師匠も水着持ってきて！"
"130140150" = "師匠！無事に帰れた？"
"130140160" = "今日は本当に楽しかったよ"
"130140170" = "ちょっと恥ずかしかったけど……勇気を出して正解だった"
"130140180" = "次は水着修練、第2弾だから……"
"130140190" = "また付き合ってくれると嬉しいな！"
"130140200" = "水着が脱げない種目でお願い……！"
"130140210" = "わかった、考えてみる！"
"130140220" = "師匠"
"130140230" = "水着修練の第2弾！"
"130140240" = "付き合ってくれ！"
"130140250" = "どんな修練？"
"130140260" = "今回の舞台は……"
"130140270" = "海だ！"
"130140280" = "お！いいね！"
"130140290" = "ふふっ、喜んでくれると思った"
"130140300" = "じゃ、当日に！"
"130140310" = "師匠！無事に帰れた？"
"130140320" = "いくらアタシでも「いかだで脱出」はやりすぎだったみたい"
"130140330" = "筋肉痛でズキズキするよ"
"130140340" = "あれ？師匠？これ見てる……よな？"
"130140350" = "既読なのに返事がない"
"130140360" = "まさか、指に力が入らないのか……？"
"130140370" = "う　ああ"
"130140380" = "……"
"130140390" = "やっぱり、そうか"
"130140400" = "次はもっと簡単な修練にしよう"
"130140410" = "それまでゆっくり休んでくれ！"
"130140420" = "今回の修練は――"
"130140430" = "浜辺のキャンプファイヤー！"
"130140440" = "おお！"
"130140450" = "すぐ行くよ！"
"130140460" = "ふふ、盛り上がるだろ？"
"130140470" = "じゃ、待ってるよ！"
"130140480" = "し、師匠"
"130140490" = "ちゃんと帰れたよな？"
"130140500" = "アタシのわがままのせいで"
"130140510" = "大変な目に遭わせちゃって、ごめん"
"130140520" = "私は平気だよ！"
"130140530" = "私も楽しかったよ！"
"130140540" = "そう言ってくれると嬉しいよ、ありがとう"
"130140550" = "次はこの失敗を挽回してみせる！"
"130140560" = "じゃ、また！"
"130140570" = "師匠"
"130140580" = "やってみたいことがあるんだけど……"
"130140590" = "付き合ってくれないか？"
"130140600" = "今回は修練じゃないよ"
"130140610" = "キャンプファイヤーのことを挽回したくて"
"130140620" = "いいよ！レンゲのためならどこへでも！"
"130140630" = "ありがとう、師匠！"
"130140640" = "じゃ、夜の海岸で！"
"130140650" = "今日はどうだった……？"
"130140660" = "本当に楽しかったよ！"
"130140670" = "青春を満喫できた！"
"130140680" = "それならよかった"
"130140690" = "アタシも……楽しかったよ"
"130140700" = "次も一緒に花火をしよう"
"130140710" = "その時は、もうちょっと大きな花火かな"
"130140720" = "もちろん、大きすぎない程度で！"
"130140730" = "うん、楽しみにしてるよ！"
"130140740" = "へへっ、また青春しに行こう！"
