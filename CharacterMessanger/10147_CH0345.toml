[translation]
"101470010" = "先生、ちょっといいかしら"
"101470020" = "大丈夫だよ。どうしたの？"
"101470030" = "先生は……"
"101470040" = "海がどれだけ危険な場所か"
"101470050" = "ちゃんと理解してるかしら？"
"101470060" = "いや、あんまり……"
"101470070" = "……これは直接説明した方がよさそうね"
"101470080" = "今から行くから、待っていて頂戴"
"101470090" = "う、うん。待ってるね……"
"101470100" = "私が教えた海の安全対策……"
"101470110" = "ちゃんと覚えているかしら？"
"101470120" = "忘れたらダメよ？"
"101470130" = "大丈夫、覚えてるよ！"
"101470140" = "それを聞いて安心したわ"
"101470150" = "でもまだ少し心配だから……"
"101470160" = "これからもずっと、私がそばでケアしてあげる"
"101470170" = "それはうれしいな"
"101470180" = "ふふ、でしょう？"
"101470190" = "それじゃあ、またね"
"101470200" = "海は、とても恐ろしい場所よ。"
"101470210" = "い、いきなりだね。"
"101470220" = "何かあったの？"
"101470230" = "水の中だと息もできないし"
"101470240" = "自由に動けないわ"
"101470250" = "もし波にさらわれたりでもしたらと考えると――"
"101470260" = "たしかに、そう思うと怖いね……"
"101470270" = "危険なものからは距離を取る"
"101470280" = "それが一番よね"
"101470290" = "海って……"
"101470300" = "案外楽しい場所なのかもしれないわね"
"101470310" = "教えてくれて感謝するわ"
"101470320" = "そうでしょう？"
"101470330" = "でも油断は禁物よ"
"101470340" = "先生は慣れているみたいだけど"
"101470350" = "常に警戒を怠らないこと"
"101470360" = "うん、気をつけるよ"
"101470370" = "ふふ、いい返事ね"
"101470380" = "海ってとっても怖い場所よね"
"101470390" = "先生もそう思うでしょう？"
"101470400" = "デジャブだね"
"101470410" = "サツキはもう大丈夫じゃないの？"
"101470420" = "海のずぅっと深いところには――"
"101470430" = "恐ろしい何かが潜んでいる気がするの"
"101470440" = "そういうのもいるかもしれないね"
"101470450" = "浅いところなら平気かもしれないわ"
"101470460" = "だって、先生が守ってくれるもの"
"101470470" = "ねえ先生"
"101470480" = "知ってる？"
"101470490" = "多分しらないかも？"
"101470500" = "クラゲ同士って"
"101470510" = "お互いの毒が効かないらしいのよ"
"101470520" = "そうなんだ！すごいね！"
"101470530" = "つまり……"
"101470540" = "先生と私みたいな関係ってこと"
"101470550" = "よく分からないけど……"
"101470560" = "サツキが言うのなら、そうなのかもね"
"101470570" = "ふふっ、そうよ"
"101470580" = "ねぇ、先生に聞きたいことがあるの"
"101470590" = "いいよ。どうしたの？"
"101470600" = "紫外線対策はしてる？"
"101470610" = "もちろん！"
"101470620" = "クラゲ対策は？"
"101470630" = "大丈夫！"
"101470640" = "ふむ……いいでしょう"
"101470650" = "じゃあ、出発するわよ！"
"101470660" = "どこに？"
"101470670" = "ああ、そういえば"
"101470680" = "先生は知っているかしら？"
"101470690" = "たぶん……？"
"101470700" = "あら？私の気持ちが分かったの？"
"101470710" = "さすが先生ね"
"101470720" = "そ、そういう話だったの？"
"101470730" = "分かるような、分からないような……"
"101470740" = "実は、私もよく分かっていないの"
"101470750" = "この気持ちは……なんと言うのかしら"
"101470760" = "なんだか落ち着かないわ"
"101470770" = "私に手伝えることはあるかな？"
"101470780" = "う～ん"
"101470790" = "そうね……"
"101470800" = "……先生の顔を見せて頂戴"
"101470810" = "分かった、今どこにいるの？"
"101470820" = "先生、聞いて"
"101470830" = "人はね、見慣れたものを"
"101470840" = "いつの間にか「当たり前」だと思い込むらしいわ"
"101470850" = "なるほど、そうかもしれないね"
"101470860" = "だから先に言っておくわ"
"101470870" = "何を？"
"101470880" = "これからも"
"101470890" = "ずっと隣にいるって"
"101470900" = "慣れさせるってこと？"
"101470910" = "ええ"
"101470920" = "そうしていれば"
"101470930" = "いつか、それが当たり前になるでしょう？"
"101470940" = "うん、そうだね"
"101470950" = "そうよ。ふふっ"
