[translation]
"101140010" = "こんにちは、先生"
"101140020" = "私、アルバイトを始めたんです！"
"101140030" = "何のバイト？"
"101140040" = "近くのカフェのホール担当になりました"
"101140050" = "その……先生"
"101140060" = "もし、よろしければ……"
"101140070" = "ちょうど気分転換がしたかったんだ"
"101140080" = "後でお邪魔しようかな"
"101140090" = "……！？"
"101140100" = "ありがとうございます、先生！"
"101140110" = "お待ちしておりますね"
"101140120" = "先生"
"101140130" = "せんせえ……"
"101140140" = "ジュリ、大丈夫？"
"101140150" = "昨日もよく眠れませんでした……"
"101140160" = "いよいよウェイトレス選抜大会が来たと思うと……"
"101140170" = "緊張してしまい……"
"101140180" = "もしミスでもしたら……どうしましょう？"
