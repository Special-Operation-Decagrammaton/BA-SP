"101140230" = "私の手を、握ってくれませんか……？"
"101140240" = "先生！今お忙しいですか？"
"101140250" = "通販サイトから買ったおもちゃを開封してるところだよ"
"101140260" = "そ、そうでしたか"
"101140270" = "忙しそうですね……"
"101140280" = "ううん、むしろ暇だよ"
"101140290" = "そうでしたか！"
"101140300" = "その"
"101140310" = "先生"
"101140320" = "もし、よろしければ……"
"101140330" = "私を匿っていただきたいんです！"
"101140340" = "……え？"
