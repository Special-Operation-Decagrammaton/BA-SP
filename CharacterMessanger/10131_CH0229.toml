[translation]
"101310010" = "ごきげんよう、先生"
"101310020" = "今日はシャーレ当番の日ですので"
"101310030" = "失礼のないよう、まずはこうしてご挨拶のメッセージをいたしました"
"101310040" = "そんなにかしこまらなくていいのに……"
"101310050" = "ご負担でしたでしょうか……？"
"101310060" = "いや、そこまでじゃないけど、もっと気軽に話して欲しいかな"
"101310070" = "承知いたしました"
"101310080" = "それでは今日一日、どうぞよろしくお願いいたしますわね"
"101310090" = "先生のご予定を伺っても良いでしょうか？"
"101310100" = "もうすぐアイスホッケーカップの準決勝があるのです！"
"101310110" = "よろしければその日にご一緒できればと思うのですが……"
"101310120" = "あっ"
"101310130" = "申し訳ございません"
"101310140" = "先生のご都合も伺わずに勝手に……"
"101310150" = "気にしないで！タカネが嬉しそうで安心したよ"
"101310160" = "そ"
"101310170" = "そ、そうでしたか"
"101310180" = "よかったですわ……"
"101310190" = "日程をもらったら調整するね。あとで送ってほしいな"
"101310200" = "それって……"
"101310210" = "はい、ありがとうございます！"
"101310220" = "先生！"
"101310230" = "本日、ですわ"
"101310240" = "お忘れではありませんわよね？"
"101310250" = "私もすごく楽しみにしていたよ"
"101310260" = "はい！"
"101310270" = "それでは、出版部の部室でお待ちしておりますわね"
"101310280" = "先日はアイスホッケーを一緒に鑑賞してくださり、ありがとうございました"
"101310290" = "ですが"
"101310300" = "あの日いろいろとあったことについては"
"101310310" = "私……本当に申し訳なく思っております……"
"101310320" = "気にしなくていいよ。私も楽しかったし"
"101310330" = "そ、そうですか？"
"101310340" = "それで、なのですが！お詫びも兼ねて"
"101310350" = "今日は私からお昼をご馳走したいと思いまして"
"101310360" = "タカネの手料理！？"
"101310370" = "ええ"
"101310380" = "ちょうど今日は「もやし祭」の日でもありますし"
"101310390" = "もやし……まつり？"
"101310400" = "ごきげんよう、先生！"
"101310410" = "なんだかご機嫌だね、タカネ"
"101310420" = "ええ！とても良いことがありまして……"
"101310430" = "先生、ご存じですか？"
"101310440" = "今夜、オーロラが見られるらしいのです！"
"101310450" = "なので、風景写真を撮りに行こうかと"
"101310460" = "その……もしよろしければ……"
"101310470" = "ご一緒に、いかがでしょう？"
"101310480" = "オーロラの風景写真？"
"101310490" = "ええ"
"101310500" = "もちろん、お忙しいのは重々承知ですので……"
"101310510" = "ご無理はなさらず……"
"101310520" = "断っていただいても構いませんわ"
"101310530" = "タカネのお願いだもん、行かないとね！"
"101310540" = "合法的に残業抜け出せるし、行こうかな！"
"101310550" = "そ"
"101310560" = "そんな風に仰っていただけるなんて……"
"101310570" = "少し……恥ずかしいですけれど"
"101310580" = "本当に、感謝いたしますわ"
"101310590" = "ふふっ"
"101310600" = "その気持ち、少しわかりますわ"
"101310610" = "締切前になると散歩にでかけたくなりますものね"
"101310620" = "それでは、お待ちしておりますわ"
