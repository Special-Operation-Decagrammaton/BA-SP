[translation]
"200130010" = "先生、忙しいところにごめん"
"200130020" = "ちょっとセキュリティ関連の問題で、シャーレのサーバーを調べたくって"
"200130030" = "その場にあるPCを開かないといけないから、後でシャーレのオフィスで会える？"
"200130040" = "あ、そしたらちょっと待ってて"
"200130050" = "パスワードを書くから"
"200130060" = "待った"
"200130070" = "普通の回線でパスワードを書くなんて絶対にダメ"
"200130080" = "モニターの下にパスワードを書いたメモがあるから、それを見ても大丈夫だよ"
"200130090" = "え"
"200130100" = "……冗談、だよね？"
"200130110" = "先生、ちょっとお願いしたいことがあって"
"200130120" = "うん、どうしたの？"
"200130130" = "今日の午後、とある企業のところに行くんだけど"
"200130140" = "社長が結構頑固でね、あらためて準備しておこうと思って"
"200130150" = "ヴェリタス流の準備を"
"200130160" = "ヴェリタス流の……？"
"200130170" = "ハッキング、とか？"
"200130180" = "うん。ちょっとバックドアを設置しておこうと思うんだけど、手伝ってほしくて"
"200130190" = "バックドア……？"
"200130200" = "私ハッキングについては素人だけど、大丈夫？"
"200130210" = "まあ手伝ってと言っても、先生はただそこにいてくれるだけで良いから"
"200130220" = "じゃあまた後で"
"200130230" = "先生、もしかしてさっき電話くれた？"
"200130240" = "ごめん、ちょっと寝てた"
"200130250" = "あ、うん。起こしちゃったらごめん"
"200130260" = "もうお昼だけど、昨日は夜更かしとか？"
"200130270" = "ううん。今日の深夜に、コンサルティングを担当してる会社のサーバーメンテナンスがあって"
"200130280" = "徹夜になるだろうから、先に少し寝ておこうかなって"
"200130290" = "そうなんだ、大変だね"
"200130300" = "良かったらそれ、見学に行ってもいい？"
"200130310" = "見学？"
"200130320" = "別に良いけど……結構地味だし、面白くないと思うよ？"
"200130330" = "うん、それでも"
"200130340" = "分かった。じゃあ今日の0時に集合で。場所は後で送る"
"200130350" = "ただ、今回は内容的にいつ終わるか分からないから"
"200130360" = "徹夜覚悟だし、今のうちに少しでも寝ておいた方が良いよ"
"200130370" = "知ってるかもしれないけどうちのヴェリタスの子たち、すぐ興味本位でハッキングとかしがちで……"
"200130380" = "幸いまだそれほど大きな問題にはなってないけど、しょっちゅう揉め事ばっかり起きてるんだよね"
"200130390" = "このままだと、ハッカーとしてのイメージが……"
"200130400" = "結構ハッカーってそういうイメージがあったけど、やっぱりそれって偏見？"
"200130410" = "もちろん特に最近は、「ハッカー」っていうとみんな「ブラックハッカー」を思い浮かべるみたいだけど……"
"200130420" = "本来の「ハッカー」はほとんど今の「ホワイトハッカー」に近い、「セキュリティの専門家」を意味する言葉だったの"
"200130430" = "はぁ、また時間を見つけてうちの子たちにハッカー倫理について教育しておかないと……そういう手段に頼りっぱなしじゃダメなのに……"
"200130440" = "最近は忙しくて、あまり部活に顔も出せてないし……"
