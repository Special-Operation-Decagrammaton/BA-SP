[translation]
"1115" = "先生、どう……？"
"1116" = "いつも通り、修行頑張ってる？"
"1117" = "修行って？"
"1118" = "もちろん"
"1119" = "先生も私たち修行部の顧問なんだから、当然欠かせない修行。そう……"
"1120" = "寝ること、だよ"
"1121" = "特に先生は、普段から忙しすぎてあまり寝られてないでしょ？"
"1122" = "本当に～？"
"1123" = "うーん、怪しい……"
"1124" = "うーん……こうなったらせっかくだし、よし"
"1125" = "この機会に私が直接、修行のお手本を見せてあげる"
"1126" = "じゃあ、約束の場所でね～、先生"
"1127" = "先生……"
"1128" = "ツバキ？どうしたの？"
"1129" = "ボロボロになっちゃった……"
"1130" = "どうしよう……"
"1131" = "え、え？ボロボロ？何が……？"
"1132" = "どういうこと……？"
"1133" = "ずっと大事にしてた、修行道具が……"
"1134" = "しゅ、修行道具？"
"1135" = "助けて、先生……"
"1136" = "待っててツバキ、すぐ行くから！"
"1137" = "今日、一緒に枕を探してくれてありがとう。先生"
"1138" = "また今度、一緒に修行しようね"
"1139" = "先生、覚えてるよね？"
"1140" = "今日、一緒に修行する日だよ"
"1141" = "初耳な気が……？"
"1142" = "あ、そうだっけ？"
"1143" = "あれ、違ったっけ。約束したと思ってたんだけど……"
"1144" = "うーん、夢の中での約束だったのかな？"
"1145" = "まあ、どっちでもいいよね？"
"1146" = "うん、そうだよ。シャーレで待っててね。先生"
"1147" = "私の方からシャーレに行くから、待っててね。先生"
"1148" = "修行にぴったりの場所を見つけたよ、先生"
"1149" = "修行って、つまり寝ることだよね？"
"1150" = "うん、そうだよ～"
"1151" = "その場所、先生に一番最初に教えてあげるね"
"1152" = "ありがとう。でも、寝るのにちょうどいい場所って……"
"1153" = "実はね、"
"1154" = "ここ、すごく……"
"1155" = "すごく……？"
"1156" = "すっごく……あっ、ウサギ"
"1157" = "あの、ツバキ？"
"1158" = "え、ウサギがどうしたの？ツバキ？ツバキ！？"
