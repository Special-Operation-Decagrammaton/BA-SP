[translation]
"101510010" = "こんにちは、先生"
"101510020" = "183号特別クラス学級委員長の仁木アンナです"
"101510030" = "覚えていますか？"
"101510040" = "アカデミー主席活動会員で、連邦名誉発明家の……"
"101510050" = "こんにちは、アンナ！"
"101510060" = "もちろん覚えてるよ！"
"101510070" = "ありがとうございます！"
"101510080" = "実は興味深い論文がありまして"
"101510090" = "子犬たちはお互いに甘噛みをして遊びながら"
"101510100" = "痛みを学習するのだそうです"
"101510110" = "そうしないと攻撃的になってしまうのだとか！"
"101510120" = "社会化の重要なプロセスというわけですね"
"101510130" = "確かに興味深いね！"
"101510140" = "子犬の写真もたくさんあって可愛いですよ"
"101510150" = "一緒に読みませんか？"
"101510160" = "先生、ご協力ありがとうございます！"
"101510170" = "おかげさまで、十分な研究データが揃いました"
"101510180" = "適切な力加減が分かってきた気がします"
"101510190" = "お忙しいところ時間を割いていただき、感謝します"
"101510200" = "友達のために、アンナはえらいね！"
"101510210" = "先生として当然だよ！"
"101510220" = "と、友達のためではありません！"
"101510230" = "ケガをさせたら、ルール違反になってしまうので……"
"101510240" = "でも……"
"101510250" = "温かいお言葉、ありがとうございます"
"101510260" = "では、また！"
"101510270" = "こんにちは、仁木アンナです"
"101510280" = "先生は今、お一人ですか？"
"101510290" = "こんにちは！うん、一人だよ"
"101510300" = "では、そのまま一人で読み続けていてください"
"101510310" = "実は、とんでもない大発明をしてしまいまして……"
"101510320" = "ピアレビューをお願いしてもいいですか？"
"101510330" = "役に立てることがあるなら、もちろん！"
"101510340" = "助かります！では183号で"
"101510350" = "絶対に！他言無用、ですよ！"
"101510360" = "先生……"
"101510370" = "少しは落ち着いた？"
"101510380" = "ええ……ありがとうございます"
"101510390" = "閉所恐怖症ではないんですが"
"101510400" = "先生に会えなくなると思うと、怖かったです……"
"101510410" = "でも大発明だったね！"
"101510420" = "いえ、実はテストを続けていたら……"
"101510430" = "とけはしないんですが、湿度が低いと壊れてしまうことが分かりました"
"101510440" = "なので、病棟の増築には使えません……"
"101510450" = "残念ですが、別のものを考えようかと"
"101510460" = "元気出して！私も手伝うから！"
"101510470" = "諦めずに人助けをしようとして偉いね！"
"101510480" = "ありがとうございます、先生！"
"101510490" = "仮設建築物を作る分には問題ないので"
"101510500" = "アンナクリートもどこかで役に立てると思います"
"101510510" = "えへへ！"
"101510520" = "先生、仁木アンナです"
"101510530" = "業務と関係ないお話なのですが――"
"101510540" = "バーベキューパーティーをしたことはありますか？"
"101510550" = "うん！"
"101510560" = "いや、したことないよ！"
"101510570" = "実はバーベキューパーティーをしたくなったのですが"
"101510580" = "一緒にいかがですか？"
"101510590" = "是非よろしく！"
"101510600" = "よかったです！では183号で"
"101510610" = "先生、あの時のことですが……"
"101510620" = "変な風には、受け取らないでくださいね！"
"101510630" = "褒められると、いい気になって……"
"101510640" = "甘ったれるかもしれないってだけです！"
"101510650" = "先生に頼りきりになるかもしれません！"
"101510660" = "それじゃダメですよね"
"101510670" = "変な風には思っていなかったけど"
"101510680" = "生徒なら甘えてもいいんだよ"
"101510690" = "アンナ？"
"101510700" = "先生、お聞きしたいことがあります"
"101510710" = "シャーレに業務の協力を依頼したいのですが"
"101510720" = "どこに問い合わせればいいのか……"
"101510730" = "そもそも、問い合わせていいのでしょうか？"
"101510740" = "それに、問い合わせるにしたってどこに……"
"101510750" = "あ……"
"101510760" = "アンナ？"
"101510770" = "すみません、先生。業務連絡にはまだ慣れてなくて……"
"101510780" = "緊張しちゃってるみたいです"
"101510790" = "先生に協力を依頼したいのですが"
"101510800" = "どこで先生にお願いしたらいいのか"
"101510810" = "先生にお聞きしてもよろしいでしょうか？"
"101510820" = "うあああ……ダメだぁ……"
"101510830" = "業務連絡って難しいよね"
"101510840" = "心配しないで。何でも手伝うから！"
"101510850" = "ありがとうございます……"
"101510860" = "資料の片付け、手伝っていただきありがとうございます！"
"101510870" = "おかげですっきり整理できました"
"101510880" = "……ほんとに、いろんな意味で"
"101510890" = "見違えるほど綺麗になったので、資料を追加するのは気が引けますね"
"101510900" = "新しいものもどんどん増やしていこう！"
"101510910" = "きっとどれも楽しいはずだよ！"
"101510920" = "あっ"
"101510930" = "はい！"
"101510940" = "たしかに、そうですね！"
"101510950" = "これからもよろしくお願いします、先生！"
