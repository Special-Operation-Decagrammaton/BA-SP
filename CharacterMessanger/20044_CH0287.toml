[translation]
"200440010" = "こんにちは、トレーナー"
"200440020" = "いま何をされていますか？"
"200440030" = "ベッドで横になってるよ"
"200440040" = "そうでしたか"
"200440050" = "よろしければ"
"200440060" = "その姿勢で行えるトレーニングを"
"200440070" = "ご紹介しましょうか？"
"200440080" = "ここから出来るトレーニングが！？"
"200440090" = "ありますよ。ですが……"
"200440100" = "今回はトレーニングの話ではなく"
"200440110" = "報告のためにご連絡しました"
"200440120" = "実は、アルバイトを始めることになったんです"
"200440130" = "どうしてアルバイトを？"
"200440140" = "欲しかった新型のトレーニングマシンがセール中なんです"
"200440150" = "ですが、購入資金が足りず……"
"200440160" = "そんなに高いの？"
"200440170" = "はい……本来、60万円のところ……"
"200440180" = "セール価格で45万円です"
"200440190" = "高っ！"
"200440200" = "備品として予算を申請してみたら？"
"200440210" = "それでは時間がかかりすぎますし"
"200440220" = "セール期間が終わってしまいます"
"200440230" = "それに、このアルバイト"
"200440240" = "トレーニングも兼ねられて一石二鳥なんですよ"
"200440250" = "そんなアルバイトがあったとは……！"
"200440260" = "もし、興味がおありでしたら"
"200440270" = "今度、アスレチックスタジアムに来てください"
"200440280" = "良い報告があります、トレーナー"
"200440290" = "これは最高の成果と言えるでしょう"
"200440300" = "最高の成果って？"
"200440310" = "以前お話ししていたトレーニングマシン"
"200440320" = "無事、現金で購入しました！"
"200440330" = "あんな高いものを！？"
"200440340" = "ええ"
"200440350" = "やはり、汗を流し、その対価を得るのは素晴らしいことですね！"
"200440360" = "だからこそ、不思議なのですが……"
"200440370" = "トレーニングも「体を動かして頑張る」という点では同じなのに"
"200440380" = "どうして皆さん、あんなにも避けるのでしょう？"
"200440390" = "さ、さあ……何でだろうね"
"200440400" = "トレーナー"
"200440410" = "生きていく上で大切なものとは何でしょうか？"
"200440420" = "お休み!"
"200440430" = "あとは、ゲームとか！"
"200440440" = "休息はたしかに大事です"
"200440450" = "無理にトレーニングを続けると、怪我のリスクが高まりますし"
"200440460" = "筋肉の成長を妨げてしまいますから"
"200440470" = "ゲーム、ですか……？"
"200440480" = "ストレス発散の手段ということでしょうか"
"200440490" = "たしかに、ストレスは体調に影響を及ぼします"
"200440500" = "ですが、私が思うに……"
"200440510" = "やはり「健康」こそが、生きる上で最も大事なことかと"
"200440520" = "トレーナー、こんにちは"
"200440530" = "今お時間よろしいですか？"
"200440540" = "もちろん。何かあったの？"
"200440550" = "実は相談したいことがありまして……"
"200440560" = "以前働いていた、スタジアムのマネージャーさんから連絡があったんです。"
"200440570" = "そこで、トレーナーにも見てもらいたいものが"
"200440580" = "スタジアムのマネージャーから……？"
"200440590" = "分かった。すぐに行くよ！"
"200440600" = "おはようございます、トレーナー"
"200440610" = "もしスケジュールに余裕があるようでしたら"
"200440620" = "そんなときこそ、体を動かす絶好のチャンスです"
"200440630" = "お時間があれば、ぜひジムまでお越しください！"
"200440640" = "スミレ、大変なことになってるよ！"
"200440650" = "大変なこと？"
"200440660" = "トレーナーがそこまで慌てるとは珍しいですね"
"200440670" = "何があったのですか？"
"200440680" = "今、ネット中がスミレの話題で大騒ぎだよ！"
"200440690" = "……私が？"
"200440700" = "いったい何があったのでしょう？"
"200440710" = "ちょっと話そう"
"200440720" = "私の記憶が正しければ、"
"200440730" = "トレーナーからお誘いいただくのは"
"200440740" = "非常に珍しいことですね"
"200440750" = "これは嬉しい体験です"
"200440760" = "胸が高鳴るのを感じることですし……"
"200440770" = "すぐに向かいます！"
