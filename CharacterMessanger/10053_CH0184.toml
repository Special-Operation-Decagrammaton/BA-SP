[translation]
"100530010" = "先生、今月分の請求書はどうされましたか？"
"100530020" = "そろそろ提出期限ですが、まだ受け取っていないので"
"100530030" = "この前ユウカに渡した報告書のファイルにない？"
"100530040" = "あっ、見つかりました"
"100530050" = "最近バタバタしていて……失礼しました"
"100530060" = "最近、特に忙しそうだよね"
"100530070" = "たしかに忙しくはありますが……今は仕方ありません"
"100530080" = "もうすぐミレニアム主催の[ruby=こうりんたいさい]晄輪大祭[/ruby]がありますからね"
"100530090" = "通常のセミナーの仕事以外にも、ミレニアムとして晄輪大祭の準備も進めるとなると、休む暇もなくて……"
"100530100" = "お疲れさま、ユウカ"
"100530110" = "晄輪大祭、楽しみにしてるね"
"100530120" = "先生とお話してたら、少し元気が出ました"
"100530130" = "このまま無理をして倒れたら、元も子もありませんね……"
"100530140" = "きちんと健康管理にも気を配ろうと思います"
"100530150" = "そういえば、今回の[ruby=こうりんたいさい]晄輪大祭[/ruby]中は校内のカフェテリアを利用できないみたいです"
"100530160" = "近くに屋台が出店されるはずですが、当日は実行委員の仕事に追われて立ち寄る時間もなさそうですし……"
"100530170" = "今回はお弁当を作っていこうと思います"
"100530180" = "いいアイデアだね"
"100530190" = "ユウカは普段から料理するの？"
"100530200" = "いえ……"
"100530210" = "料理らしい料理をしたことはないんですが……"
"100530220" = "これもいい機会ですし、練習してみようかなと"
"100530230" = "先生、もうすぐキヴォトスインターハイの地区予選ですね"
"100530240" = "ミレニアムからも野球部が出場するみたいですが……"
"100530250" = "どうでしょう、なにせウチの野球部は弱小チームですし"
"100530260" = "ユウカは野球、よく見るの？"
"100530270" = "まあ、人並みには\nそこまで熱心に応援しているわけではありませんが……"
"100530280" = "ミレニアムのチームが出場する時は、応援くらいしています"
"100530290" = "慌ただしかった[ruby=こうりんたいさい]晄輪大祭[/ruby]も、やっと終わりましたね……"
"100530300" = "お疲れさまでした、先生"
"100530310" = "ユウカもお疲れさま"
"100530320" = "ありがとうございます。ですが、セミナーの役員として当然のことですから"
"100530330" = "先生、そうでした\n晄輪大祭で立て込んでいたので、シャーレに協力を要請した件の事務処理ができていませんでしたね"
"100530340" = "手持ちの業務を片付けたら、シャーレに伺いますね"
"100530350" = "それでは、また後ほどお願いします"
"100530360" = ""
"100530370" = "一言、添えてみたんですが……"
"100530380" = "ど、どうでしょう？"
"100530390" = "もう少し可愛らしくても……"
"100530400" = "ちょっと堅苦しくない？"
"100530410" = "うーん……"
"100530420" = ""
"100530430" = "……先生だけですからね"
