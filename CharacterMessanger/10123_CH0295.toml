[translation]
"101230010" = "今、お手すきかい？"
"101230020" = "少々急を要する事態になってしまった"
"101230030" = "都合がつくと助かるのだが"
"101230040" = "大丈夫だけど、どうしたの？"
"101230050" = "シャーレで待ってればいい？"
"101230060" = "察しが良くて助かるよ"
"101230070" = "すぐに向かうとしよう"
"101230080" = "なに、長くは待たせないさ"
"101230090" = "服装が違えば、心持ちも変わるらしい"
"101230100" = "ある意味、私らしくはない"
"101230110" = "けれど角度を変えれば、これこそ私らしいのかもしれない"
"101230120" = "哲学的な話だね"
"101230130" = "どっちもあってる気がするね"
"101230140" = "そうとも"
"101230150" = "そんな曖昧さも、時に都合のいい言い訳になったりするものさ"
"101230160" = "理屈の後付けがいくらでもできるからな"
"101230170" = "さて、それでは"
"101230180" = "先生はこの問いに、どのような理を付けるのか"
"101230190" = "楽しみにしているよ"
"101230200" = "そろそろ"
"101230210" = "最後の時が近いようだ"
"101230220" = "せめて、その瞬間だけは"
"101230230" = "君と共に迎えたい……"
"101230240" = "げほっ、げほっ"
"101230250" = "願いを……叶えてはくれまいか"
"101230260" = "文字で咳き込んでる……"
"101230270" = "今度は、どんな悪戯かな？"
"101230280" = "そうか"
"101230290" = "やはり同じ手は通用しないか"
"101230300" = "まあ、いいさ"
"101230310" = "君は……一緒に過ごしてくれるだろう？"
"101230320" = "最初からああしていればよかったね"
"101230330" = "とかく今日は五分といったところか"
"101230340" = "これならば次も期待できそうだ"
"101230350" = "なんだか勝負みたいな言い方だね"
"101230360" = "まさか勝ち負けを決めるつもりかい？"
"101230370" = "当然だろう？"
"101230380" = "何せ、先生と私の仲なのだから"
"101230390" = "さて、それでは……"
"101230400" = "次の機会が巡ってきたら、また声をかけさせてもらうとしよう"
"101230410" = "驚くべきことだ"
"101230420" = "思いもしないことを言われたよ"
"101230430" = "驚くべきこと？"
"101230440" = "思いもしないこと？"
"101230450" = "ああ"
"101230460" = "実に気分が良い"
"101230470" = "これから報告に上がるよ"
"101230480" = "実に楽しいドライブだったよ"
"101230490" = "気が向いたときには、また"
"101230500" = "拒否権なかったんだけど……"
"101230510" = "私の意思はどこへ……"
"101230520" = "わかっているのだろう？まったく、先生も意地が悪いね"
"101230530" = "ありがとう、先生"
"101230540" = "君が、私のすべてを変えたんだ"
"101230550" = "大げさではないさ"
"101230560" = "だから"
"101230570" = "これからも"
"101230580" = "幾重にも姿を変えていく私を"
"101230590" = "傍で見届けてくれるかい？"
