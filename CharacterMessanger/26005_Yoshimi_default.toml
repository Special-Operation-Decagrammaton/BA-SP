[translation]
"1699" = "先生、暇？暇だよね？"
"1700" = "そんなに大したことじゃないんだけど、頼みたいことがあって"
"1701" = "忙しいなら大丈夫、大したことじゃないから"
"1702" = "今、ちょっと忙しくって……"
"1703" = "もちろん平気だよ、暇人だから"
"1704" = "……そうだよね"
"1705" = "うん、分かった。邪魔してごめん"
"1706" = "いや、そこまでは言ってないから！"
"1707" = "本当に！そういう意味で言いたかったんじゃなくて！"
"1708" = "嘘、冗談だよ"
"1709" = "またそうやって私のことからかって！！！！"
"1710" = "もうほんと許さないんだから……"
"1711" = "……とにかく、時間あるのよね？からかった罰でちゃんと付き合いなさい"
"1712" = "「カフェ・ミルフィーユ」に来て"
"1713" = "他の子たちには内緒だからね"
"1714" = "次は絶対私が奢るから！また連絡する！"
"1715" = "先生、今時間ある？"
"1716" = "この前の約束、忘れたとは言わせないわよ。まだ借りが残ってるんだから"
"1717" = "先に言っとくけど、拒否権はないから。付き合ってくれるわよね？"
"1718" = "……なんだか文字にすると変な感じになっちゃったけど"
"1719" = "借りを返すって意味だから！それだけ！"
"1720" = "私としては他の意味でも大歓迎"
"1721" = "ちゃんと覚えてるよ。大丈夫、了解"
"1722" = "そういう心臓に悪い冗談止めてくれる……？"
"1723" = "じゃあ待ってるから、遅れるんじゃないわよ！"
"1724" = "もう何も言わないで"
"1725" = "忘れて"
"1726" = "全部記憶から消して"
"1727" = "お尻の話とかしたら本気で殺すから"
"1728" = "先生、今時間ある？"
"1729" = "大したことじゃないんだけど、ちょっと手伝ってほしくて"
"1730" = "今度は何を食べに行くの？"
"1731" = "なんで食べる前提なの？"
"1732" = "私のこと豚か何かだと思ってる？口を開いたらどうせ餌だろうって？"
"1733" = "違うから！別の頼み事！"
"1734" = "……ちゃんとした、先生だからこそお願いしたいことだから"
"1735" = "冗談だよ、どこに行けばいい？"
"1736" = "……"
"1737" = "またそうやって……"
"1738" = "……ありがと。場所は……"
"1739" = "今日はありがとう"
"1740" = "……その、これからもよろしく、先生"
"260050010" = "授業出たくない……"
"260050020" = "ねえ先生、何か上手い感じにサボる方法とか無いの？"
"260050030" = "えっと……"
"260050040" = "それ、一応先生である私に聞く！？"
"260050050" = "分かってる、私も分かってるから。先生にこういうこと聞くのはおかしいって"
"260050060" = "ただ、今日は「カフェ・ミルフィーユ」の新作が出る日で……"
"260050070" = "授業中にオープンしちゃうから……理由はただそれだけ。大したことじゃないから、気にしないで"
"260050080" = "気持ちは分かるけど、とりあえず授業優先かな"
"260050090" = "OK、任せて"
"260050100" = "うっ、まあそりゃそうよね……"
"260050110" = "……？"
"260050120" = "文脈理解してる……？まあいいや、仕方ない。ちゃんと授業には出るわよ"
"260050130" = "じゃあ、気が向いたらまた連絡するから(￣︶￣*)"
"260050140" = "あー美味しかった！"
"260050150" = "やっぱりあそこのスイーツは外れが無い！あのとろける食感と、甘酸っぱい味……！"
"260050160" = "先生もああいうの、好き？"
"260050170" = "あ"
"260050180" = "いや"
"260050190" = "違う、今のは無し、何も言わないで"
"260050200" = "こういうのはダメ、そうじゃなくて"
"260050210" = "……"
"260050220" = "ふふっ、分かんないなら良いよ"
"260050230" = "それじゃあまたね、先生"
"260050240" = "そういえば"
"260050250" = "先生"
"260050260" = "どこのカフェに行く？"
"260050270" = "良いところでも見つかった？"
