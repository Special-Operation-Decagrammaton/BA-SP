"260050290" = "まだ何も言ってないんだけど……"
"260050300" = "いや、まぁカフェにはいるけど"
"260050310" = "いつも連絡くれる時はカフェにいるし"
"260050320" = "今回もそうかなって"
"260050330" = "まぁそうだけど"
"260050340" = "なんか、でも……"
"260050350" = "決めつけられるのはイヤかも"
"260050360" = "まぁいいや、あとで送るから来てね"
"260050370" = "ふふっ"
"260050380" = "あーもう"
"260050390" = "おっかしい"
"260050400" = "せっかくヨシミが買ってくれたのに……"
"260050410" = "一度くれたものを奪うなんて、鬼！悪魔！！"
"260050420" = "うるさい"
"260050430" = "自業自得でしょ"
"260050440" = "はぁ……"
"260050450" = "仕方ないわね"
"260050460" = "また買ってくるわよ"
"260050470" = "次はちゃんと大事にしなさいよ？"
"260050480" = "先生♪"
