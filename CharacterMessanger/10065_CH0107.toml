[translation]
"100650010" = "こんにちは、先生"
"100650020" = "こ、こんにちは……どちら様ですか？"
"100650030" = "プライベートでご連絡したことはありませんでしたね"
"100650040" = "百鬼夜行連合学院の陰陽部副部長であり、百鬼夜行観光文化産業広報支援部の――"
"100650050" = "戦略リーダーを務めています、桑上カホと申します"
"100650060" = "遅ればせながら、ご挨拶を申し上げたく思いまして"
"100650070" = "戦略、広報……？"
"100650080" = "よ、よろしく……って突然どうしたの？"
"100650090" = "先日ご連絡いたしました、「例の件」ですが"
"100650100" = "先日？例の件……？"
"100650110" = "そのご相談にお伺いしたく、本日のご都合はよろしいでしょうか？"
"100650120" = "あ、うん。今日は大丈夫だよ"
"100650130" = "ありがとうございます。では、すぐにそちらへ"
"100650140" = "そんな急に！？"
"100650150" = "先生、先日は大変ご迷惑をおかけしてしまい……"
"100650160" = "申し訳ございませんでした"
"100650170" = "迷惑だなんて、そんなことないよ"
"100650180" = "お心遣い痛み入りますが……"
"100650190" = "ご迷惑をおかけしたお詫びに、百鬼夜行までお越しいただけないでしょうか？"
"100650200" = "うん、これから向かえば良いかな？"
"100650210" = "はい、それではお待ちしております"
"100650220" = "すぐに行くね"
"100650230" = "私、桑上カホ、本日は完璧に先生をエスコートしますので"
"100650240" = "エスコートって……？"
"100650250" = "先生、本日はお時間よろしいでしょうか？"
"100650260" = "時間ならあるけど、どうしたの？"
"100650270" = "先日の約束を果たしたく思い……"
"100650280" = "えぇと、その……"
"100650290" = "エスコートの準備が整ったので、ご連絡いたしました"
"100650300" = "というわけでして、先生。もしよろしければ……"
"100650310" = "うん、分かった。これから向かえば良いかな？"
"100650320" = "はい、ありがとうございます"
"100650330" = "それでは、お待ちしております"
"100650340" = "ふふふっ"
"100650350" = "何か良いことでもあった？"
"100650360" = "先生、聞いてください"
"100650370" = "ついに……ついに！"
"100650380" = "ついに……！？"
"100650390" = "陰陽部で特注した百鬼夜行の宣伝グッズが届いたんです！"
"100650400" = "おめでとう！"
"100650410" = "ふふ、先生もお一ついかがですか？"
"100650420" = "もちろん、よろしければですが……"
"100650430" = "ありがとう、すぐ行くよ！"
"100650440" = "ふふっ、お待ちしております"
"100650450" = "先生、こんにちは。カホです"
"100650460" = "明日、仕事で陰陽部にいらっしゃると伺い、メッセージいたしました"
"100650470" = "うん、明日はよろしくね"
"100650480" = "はい、お会いできるのを楽しみにしておりますね"
"100650490" = "それとよろしければ、業務の後にお茶でもいかがでしょうか？"
"100650500" = "休憩は大事ですから"
"100650510" = "ありがとう。それじゃあ、頂こうかな"
"100650520" = "はい、心を込めて用意いたしますね"
"100650530" = "それではお待ちしております"
