[translation]
"200150010" = "せんせー！まただよー！！"
"200150020" = "また？"
"200150030" = "また「修行部ってちょっとおかしいよね」って言われちゃったの！"
"200150040" = "何と、それは失礼な"
"200150050" = "でしょ、先生もそう思うよね？"
"200150060" = "公園で決め台詞を練習してただけなのに！"
"200150070" = "……ん？"
"200150080" = "決め台詞……？"
"200150090" = "決め台詞がどうかしたの？"
"200150100" = "あ、もちろん私たち修行部が、問題児たちを倒す時に言う台詞だよ！"
"200150110" = "いざという時にカッコよく言えるよう、一生懸命練習してるの"
"200150120" = "ちなみに私の台詞は「紅葉に代わって突撃だ」！"
"200150130" = "先生なら、特別に使っていいよ？"
"200150140" = "ちなみにポーズはね～、あ、動画で撮らないとダメか、ちょっと待ってて"
"200150150" = "だ、大丈夫。とにかく応援してるね"
"200150160" = "うん、ありがとー先生！"
"200150170" = "そんな先生には、この可愛いスタンプをプレゼント！"
"200150180" = "あ、ありがとう"
"200150190" = "とにかくこれ以上「変」って言われないようにするために、どうにか対策をしなくっちゃ"
"200150200" = "だから先生、お願いがあるの！"
"200150210" = "先生、今日も引き続き「素敵なレディー」になるため頑張るよ！"
"200150220" = "うん、いつも通り頑張って"
"200150230" = "でも素敵なレディーへの道は、かなり厳しい……"
"200150240" = "どれくらい難しいかというと…………"
"200150250" = "夏休みに「ラジオ体操カード」で、欠かさず毎日スタンプを貰うこと並みに難しい！"
"200150260" = "それは難しい！"
"200150270" = "そうなの、それでどうすれば良いかなって悩んでたんだけど……"
"200150280" = "すっごいことを思いついちゃった！"
"200150290" = "これはもう「世紀の大発見」と呼べるくらいだよ！"
"200150300" = "話してあげるから、早く修行部の部室に来て！"
"200150310" = "やっほー先生！"
"200150320" = "今日も遊びに"
"200150330" = "じゃなくて、素敵なレディーになるための修行をしに、シャーレに行っても良い？"
"200150340" = "ごめんカエデ、今日はちょっと仕事で忙しくて……"
"200150350" = "えー、先生いっつも仕事ばっかり"
"200150360" = "先生はそんなに仕事が好きなの？"
"200150370" = "ど、どうかな……"
"200150380" = "書類作業そのものは好きではないです……"
"200150390" = "ふーん……？あ、でも前に言ってた気がするね"
"200150400" = "大人は時々、やりたくないこともやらないといけない……って"
"200150410" = "うーん、大人って大変だね？"
"200150420" = "先生を見てると、「時々」じゃない気がするけど"
"200150430" = "ぐっ、何も言えない……！"
"200150440" = "まあとにかくー"
"200150450" = "あ、良いこと思いついた！"
"200150460" = "良いこと？"
"200150470" = "待ってて、先生！"
"200150480" = "今日の私は、「真面目にお手伝いをするモード」だから！"
"200150490" = "じゃあ、また後でね！"
"200150500" = "？？？"
"200150510" = "先生！非常事態！！"
"200150520" = "非常事態といえば仮面ドライバーの必殺技「エマージェンシードライブキック」だよ！"
"200150530" = "……何それ？"
"200150540" = "何か大変なことが起きた感じ？"
"200150550" = "えっと、どこから説明すれば……"
"200150560" = "とりあえず、めちゃくちゃ大変なことが起きたの！"
"200150570" = "大丈夫？怪我とかしてない？"
"200150580" = "私は全然元気！さっき朝ごはんもお代わりした！"
"200150590" = "それより、そんなことじゃなくて！"
"200150600" = "……？"
"200150610" = "とにかく、非常事態なの！"
"200150620" = "ここまでの非常事態だと、モモトークじゃ教えられない！"
"200150630" = "どこかの誰かが、このモモトークを盗み見してるかもしれないし！"
"200150640" = "それは大丈夫だと思うけど……多分"
"200150650" = "とにかく用件は、直接会って話すね！"
"200150660" = "公園で待ってるから！"
"200150670" = "先生先生！"
"200150680" = "ついに例のアレが発売だって！"
"200150690" = "一緒に行こ！！"
"200150700" = "例のアレ！？"
"200150710" = "そうそう"
"200150720" = "前に話してた通り"
"200150730" = "今度ムシクイーンの、ポップアップストアがオープンするの！"
"200150740" = "あ、そういえば前に言ってたね"
"200150750" = "そうそう、それ！"
"200150760" = "でもでも、先生が思ってるようなムシクイーンじゃなくて"
"200150770" = "聞いたら絶対、一緒に行きたくなるはず！"
"200150780" = "実はそのポップアップストアではね……"
"200150790" = "限定版のムシクイーンスリーブが販売されるの！"
"200150800" = "おお！"
"200150810" = "ふふん、すごいでしょ！"
"200150820" = "限定版のスリーブ、何としても欲しいよね……！"
"200150830" = "ということで、ポップアップストア前に集合ね！"
"200150840" = "時間は後で送るから！"
"200150850" = "先生！"
"200150860" = "無事に帰れた？"
"200150870" = "ちゃんと帰れたよ、カエデの方は？"
"200150880" = "よかった！私も大丈夫！"
"200150890" = "無事にスリーブが買えて良かった、ありがとね！"
"200150900" = "これからはそのスリーブを使って"
"200150910" = "大会に出られるね"
"200150920" = "ん？使わないよ？"
"200150930" = "スリーブは消耗品だから"
"200150940" = "使ったら傷んじゃうし……"
"200150950" = "もし使うならさらに上から透明スリーブを被せて"
"200150960" = "2重か3重スリーブにしないと！"
"200150970" = "3重、スリーブ……！？"
"200150980" = "うん！バトラーの間では常識だよ？"
"200150990" = "バトラーの世界は、奥が深いね……"
"200151000" = "そうかな？"
