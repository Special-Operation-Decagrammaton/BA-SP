"2228" = "お疲れ様でした、先生"
"2229" = "大丈夫……？"
"2230" = "はい、大丈夫です"
"2231" = "メガネもぐらついてますし、その、制服も少し破れてしまいましたが……"
"2232" = "2倍になりましたし！私たちの勝利です！"
"2233" = "お疲れ様……"
