"2196" = "大丈夫だよ、どうしたの？"
"2197" = "それなりに忙しいけど、アヤネのためなら全然大丈夫！"
"2198" = "ありがとうございます、実は……"
"2199" = "え、えっと、あはは……。あ、ありがとうございます"
"2200" = "実は……"
"2201" = "ご相談と言いますか、聞いていただきたいことがあると言いますか……"
"2202" = "少し、お話したいことがありまして"
"2203" = "突然のことですみません！"
"2204" = "うん、分かった"
"2205" = "ううん、全然大丈夫"
"2206" = "あ、ありがとうございます！では次の休日、学校でお会いしましょう！"
