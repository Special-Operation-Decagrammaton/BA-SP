"2219" = "とある物を学校で見つけたのですが"
"2220" = "結構良いお金になりそうでして"
"2221" = "ふふっ、もしかしたら棚ぼたかもしれません"
"2222" = "どういうもの？"
"2223" = "普通の鉄みたいなのですが、"
"2224" = "量があるのでそれなりのお金になるのではないかと"
"2225" = "私も見に行っていい？"
"2226" = "え？"
