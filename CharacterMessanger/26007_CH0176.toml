[translation]
"260070010" = "先生！聞いてください！！"
"260070020" = "倉庫を整理してたら、色々とでてきて……それが、すごいんです！"
"260070030" = "掘り出し物がたくさんあって……どれも新品同然なんです！"
"260070040" = "全部リサイクルショップに持っていったらどれだけ……"
"260070050" = "ああでも、そのまま売るのはちょっと勿体ないですね"
"260070060" = "ちゃんと修理して売ればかなりの……"
"260070070" = "な、何の話？"
"260070080" = "アヤネ、まずは落ち着いて"
"260070090" = "あっ……！"
"260070100" = "すみません、つい。共有したいという気持ちが先走ってしまって……"
"260070110" = "直接いらっしゃるのはお手間だと思うので、写真を送りますね"
"260070120" = "大丈夫、私が向かうよ"
"260070130" = "今どこにいるの？"
"260070140" = "あっ……"
"260070150" = "えっと……"
"260070160" = "今日はお疲れさまでした"
"260070170" = "たくさんお宝が見つかりましたが、実際に持って帰れる物は多くなかったですね"
"260070180" = "ほとんどが大きすぎて……結局元の木阿弥だったというか……"
"260070190" = "ううん、「遊ぶ」ってこういうものだと思うよ"
"260070200" = "でも楽しかったから、いいんじゃないかな？"
"260070210" = "……！"
"260070220" = "はい"
"260070230" = "おっしゃる通りです。ありがとうございます。"
"260070240" = "ｊｊｊｊｊｊｊｍんｍｊｊｊｊｊｊｊｊｊｊ"
"260070250" = "……アヤネ？"
"260070260" = "どうしたの？"
"260070270" = "ｊｊｊｊｊｊｊ、、いういｊｊｊｊｊｊｊｊｊｊ"
"260070280" = "どうしたんだろう……"
"260070290" = "寝ぼけてる……？"
"260070300" = "んんんんｌｌｌｌｌｌｌｌｌｌ"
"260070310" = "先生……"
"260070320" = "その、えっと……"
"260070330" = "実はですね"
"260070340" = "今朝のこと……"
"260070350" = "誰にも言ってないよ"
"260070360" = "秘密基地、だからね"
"260070370" = "……"
"260070380" = "はい"
"260070390" = "ありがとうございます……"
"260070400" = "先生、もしよろしければ……"
"260070410" = "一つお願いをしても良いでしょうか……？"
"260070420" = "もちろん、大丈夫だよ"
"260070430" = "どうしたの？"
"260070440" = "ちょうど今、ヘリの補修作業中なのですが"
"260070450" = "思っていたよりも、部品が多く必要になりそうで……"
"260070460" = "そんなに重い物ではなく……前もって用意しておいたネジがホールに置いてあるのですが……"
"260070470" = "分かった、今行くね。ダッシュで"
"260070480" = "配達員、出発しまーす"
"260070490" = "あはは……"
"260070500" = "ありがとうございます。お待ちしております！"
"260070510" = "いつでも呼んでくださいとお伝えしましたが"
"260070520" = "考えてみたらヘリを飛ばすのって、そんなに簡単ではないですね……"
"260070530" = "結局、以前とあまり変わらないかも……"
"260070540" = "でも、ヘリがあるということが大事だからね"
"260070550" = "必殺技はあまり頻繫に使うものじゃないからね"
"260070560" = "そ、そうですか？"
"260070570" = "あはは……"
"260070580" = "ありがとうございます、先生"
