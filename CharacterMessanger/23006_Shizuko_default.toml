[translation]
"2449" = "「～百夜堂×キヴォトス苺天国～コラボキャンペーン開催！」"
"2450" = "「苺大福や苺どら焼き、苺饅頭に苺八つ橋！それに苺あんみつまで！」"
"2451" = "「キヴォトス各地の苺を揃える『キヴォトス苺天国』と、伝統的な甘味喫茶『百夜堂』のコラボレーションをご賞味あれ！」"
"2452" = "「今日から一週間開催しておりますので、ぜひお越しください！」"
"2453" = "「来店時にこのメッセージを見せていただくと、お会計時に10％割引！」"
"2454" = "「それでは、百夜堂でお待ちしておりますね！にゃんにゃん！」"
"2455" = "えっと……？"
"2456" = "にゃんにゃん……？"
"2457" = "えへへっ、先生！"
"2458" = "実はお送りした通り、百夜堂でイベントを開催中なんです！"
"2459" = "せっかくですのでこのタイミングで、あらためて先生をしっかりおもてなししたいなと思いまして"
"2460" = "来てくれますよね？"
"2461" = "ちょっと日程を確認してから……"
"2462" = "来 て く れ ま す よ ね？"
"2463" = "シズコの頼みなら！"
"2464" = "えへへっ！ありがとうございます！"
"2465" = "お待ちしてますね！"
"2466" = "今回は色々と失敗してしまいましたが、"
"2467" = "次こそは必ず先生を攻略してみせます！"
"2468" = "私のおっちょこちょいパワーで！"
"2469" = "それ先に言ったら\n「おっちょこちょい」じゃないんじゃ……？"
"2470" = "覚悟しておいてくださいね！"
"2471" = "えっと、はい……"
"2472" = "先生……"
"2473" = "私、私……"
"2474" = "シズコ、もうこれ以上我慢できません……"
"2475" = "なら早めに行った方が良いよ"
"2476" = "終わったら手洗いも忘れずにね"
"2477" = "今をときめく看板娘相手に何を言ってるんですか！？"
"2478" = "というかそもそも、私がそんな話をモモトークでするとでも！？"
"2479" = "ああもう、全く……"
"2480" = "えっと、それで先生。シズコはですね～"
"2481" = "この流れ、まだ続きそう？"
"2482" = "……ううっ、もういいです……"
"2483" = "お祭り運営委員会の委員長として、先生に一つお願いがあります"
"2484" = "明日のお祭りの準備、付き合ってください！"
"2485" = "それは全然いいけど……さっきの話は？"
"2486" = "それで結局、何が我慢できなかったの？"
"2487" = "それはもういいんですっ！"
"2488" = "はいもうこの話終わり！蒸し返すの禁止です！！"
"2489" = "先生。今日、その……"
"2490" = "どうしたの？"
"2491" = "い、いえ、やっぱり何でもありません"
"2492" = "今日も一日、お仕事でお忙しいですよね"
"2493" = "お互い、頑張っていきましょう"
"2494" = "ふふふっ……"
"2495" = "ぐへへ？"
"2496" = "ふふふ……？"
"2497" = "「ぐへへ」なんて下品な笑い方したことありませんけど！？"
"2498" = "ちゃんと上に「ふふふっ」って書いてあるじゃないですか！"
"2499" = "急にどうしたの？"
"2500" = "先生、おっしゃいましたよね"
"2501" = "疲れた時は休んで、眠い時は寝るのが良いって"
"2502" = "今日は、先生にその言動の責任を取ってもらおうかと思いまして"
"2503" = "百夜堂で待ってますので"
"2504" = "P.S. 正面玄関ではなく、裏手から入ってきてください"
"2505" = "……？"
"23006010" = "先生！先生！"
"23006020" = "今日から百夜堂の期間限定イベントが始まりますよ！"
"23006030" = "今回は「林檎フェス」！！"
"23006040" = "爽やかなアップルティーに、林檎を使った各種デザートをたくさんご用意しております！"
"23006050" = "これは行かなくちゃだね！"
"23006060" = "ふふふ"
"23006070" = "お待ちしております！"
"23006080" = "最高のおもてなしをお約束します！！"
