[translation]
"101250010" = "にゅふふふ"
"101250020" = "ごきげんよう、マスター"
"101250030" = "今日も世界はマナに満ちていますね！"
"101250040" = "マスターの調子はいかがですか？"
"101250050" = "マナが満ちてるかは分からないけど、元気いっぱいだよ！"
"101250060" = "誤魔化したって無駄ですよ？"
"101250070" = "占いで見ているんですから"
"101250080" = "昨日も遅くまで残業されていましたよね？"
"101250090" = "ぐっ……！"
"101250100" = "今日はお仕事をいったん忘れて"
"101250110" = "私とのんびり過ごしてみませんか？"
"101250120" = "お仕事と同じくらい、休息も大切ですから"
"101250130" = "そうしようかな"
"101250140" = "それじゃあお菓子でも買っていこうかな"
"101250150" = "にゅふふ、やはりマスターとは心が通じ合っているのですね"
"101250160" = "それではお待ちしております！"
"101250170" = "今日は本当に楽しかったです、マスター"
"101250180" = "おかげで、しばらくはマナが切れる心配もなさそうです"
"101250190" = "マスターも、少しはマナを補給できましたか？"
"101250200" = "うん！力がみなぎってるよ！"
"101250210" = "にゅふふ"
"101250220" = "また気分転換がしたくなったら、いつでも声をかけてくださいね"
"101250230" = "私たちは魔法で繋がっていますから"
"101250240" = "マスター！"
"101250250" = "大変です！"
"101250260" = "本当に、大変なことになってしまいました！"
"101250270" = "寮監隊に追われてるとか？"
"101250280" = "違います！"
"101250290" = "もっと深刻です！"
"101250300" = "まさか、占いでも予見できないなんて……！"
"101250310" = "いったい何があったの？"
"101250320" = "それがですね"
"101250330" = "今日、絵画の実技試験があるのですが……"
"101250340" = "試験会場で"
"101250350" = "帽子の着用が禁止されてるんです……！"
"101250360" = "…………"
"101250370" = "マスター"
"101250380" = "実技試験が……終わりました……"
"101250390" = "どうだった？うまくいった？"
"101250400" = "にゅ……"
"101250410" = "にゅふふふ……"
"101250420" = "マスター"
"101250430" = "私、新たな魔法を研究しようと思っているんです"
"101250440" = "「忘却魔法」です……"
"101250450" = "それさえあれば……"
"101250460" = "この恥ずかしい記憶を、全て消し去れるんですから！"
"101250470" = "ど、どうやって消すの！？"
"101250480" = "頭に強い物理的衝撃を与えるんです！"
"101250490" = "早まらないで！次はきっと大丈夫だよ！"
"101250500" = "……そ、そうでしょうか"
"101250510" = "はぁぁぁ……"
"101250520" = "とにかく……今日は本当にありがとうございました"
"101250530" = "また、近いうちにお会いしましょう……"
"101250540" = "マスター……"
"101250550" = "この前の実技試験以来、魔力が全然戻ってこないんです"
"101250560" = "魔導書を開いても、行くべき道がわからず……"
"101250570" = "どうしたらいいんでしょう……？"
"101250580" = "シャーレの近くで気分転換でもする？"
"101250590" = "おおっ、文面を見ただけで力が湧いてきた気がします！"
"101250600" = "ま、まさかこれは……"
"101250610" = "言葉に魔力を宿す「言霊魔法」！？"
"101250620" = "で、ですがこの魔法はとうの昔に失われたはず……！"
"101250630" = "マスター、どうやってそんな古代魔法を……！"
"101250640" = "……"
"101250650" = "はぁぁ……"
"101250660" = "ごめんなさい"
"101250670" = "いつもならこうして魔法談義をしていれば元気になるのに"
"101250680" = "今日はどうしても力が入りません……"
"101250690" = "でも、わかりましたマスター"
"101250700" = "すぐにそちらへ向かいます"
"101250710" = "無事にお帰りになりましたか？"
"101250720" = "今日は本当に、たくさんのことを考えさせられて……"
"101250730" = "まさに、魔法のような一日でした"
"101250740" = "一気に魔法の熟練度が二段階ほど上がった気分です"
"101250750" = "階十位の「世界創造魔法」は使えそう？"
"101250760" = "さすがにそこまでは……"
"101250770" = "ですが、近しい魔法なら、もう使えそうです"
"101250780" = "キャンバスに、自分だけの世界を描き出す魔法……"
"101250790" = "にゅふふふ"
"101250800" = "次にお会いする日を、お楽しみに！"
"101250810" = "マスター。ついに、その時がやってきました"
"101250820" = "私の「世界創造魔法」をお見せする時が！"
"101250830" = "おおっ、ついに来たね！"
"101250840" = "まだ完成度100％とは言えませんが"
"101250850" = "持てるすべての魔力を注ぎ込んで、準備しておきます"
"101250860" = "それでは学院でお会いしましょう！"
"101250870" = "マスター。今日は本当に、ありがとうございました"
"101250880" = "おかげで、たっぷり自信が湧いてきました"
"101250890" = "これで、少しは私も前に進めたってことですよね"
"101250900" = "うん！次の試験は絶対うまくいくよ！"
"101250910" = "もしまた、帽子を脱がなきゃならないなら……"
"101250920" = "ふぅぅ……できる限り、頑張ってみます"
"101250930" = "ところで、肖像画……ちゃんと持ち帰ってくれました？"
"101250940" = "うん。よく見える場所に飾っておくよ"
"101250950" = "にゅふふふ"
"101250960" = "ありがとうございます"
"101250970" = "その絵を見るたびに、私のことを思い出してくださいね？"
"101250980" = "では、またお会いするその日まで！"
"101250990" = "マスターにも、幸福の魔法が降り注ぎますように！"
