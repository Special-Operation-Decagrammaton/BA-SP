[translation]
"260100010" = "森の野生動物たちが保護色で身を隠すように"
"260100020" = "狙撃手は、ギリースーツで存在感を消すのです"
"260100030" = "屋外では、よく葉っぱや木の枝を身にまといますが……"
"260100040" = "人の多い街中では、普通の服を着た方が目立ちません"
"260100050" = "なので……ほとんどの狙撃手は、街中で偽装するための服を持っていたりします"
"260100060" = "なるほど、そうなんだね。"
"260100070" = "ミユも持ってるの？"
"260100080" = "その……"
"260100090" = "実は"
"260100100" = "私の場合、偽装しなくても人に気づかれないので……"
"260100110" = "制服以外、特に……"
"260100120" = "でも……今回の作戦は、生徒がほとんどいない漁村で行われるので"
"260100130" = "この機会に、私も偽装に挑戦してみたいです"
"260100140" = "先生、助けていただいて、ありがとうございます……"
"260100150" = "結局、釣り人さんたちから注目を浴びてしまいましたし……"
"260100160" = "これでは、潜伏失敗かもしれません……"
"260100170" = "ミユが釣った魚、本当に大きかったからね"
"260100180" = "はい、大物が釣れたのは嬉しかったですが……"
"260100190" = "影が薄いせいで、逆に人を集めてしまうとは……"
"260100200" = "何事も思ったようにはいきませんね……"
"260100210" = "やっぱり、海に来てみたら"
"260100220" = "いつもとは違う、特別な経験ができました"
"260100230" = "思いがけない出会いもあったり"
"260100240" = "意外な場所で、見慣れた姿もあったりして……"
"260100250" = "……ミユ？"
"260100260" = "何かあったの……？"
"260100270" = "あ"
"260100280" = "すみません、分かりにくかったですよね"
"260100290" = "小石探しの話です"
"260100300" = "先生"
"260100310" = "すみません……"
"260100320" = "一緒に集めた小石は、みんな元の場所に戻しました"
"260100330" = "頑張ってくださったのに……本当に、すみません……"
"260100340" = "大丈夫だよ、気にしないで"
"260100350" = "でも、どうして全部……？"
"260100360" = "先生と解散した後、よく考えてみたら……"
"260100370" = "あの小石たちは、ここで静かに自分の役割を果たしていたのだな、と……"
"260100380" = "なので、素敵だと思ったからといって、連れ帰ってしまうのは……"
"260100390" = "小石たちが……寂しい思いをしてしまいそうで……"
"260100400" = "ですが、その代わりに……"
"260100410" = ""
"260100420" = "写真に収めたんだ"
"260100430" = "そっか、良かったね"
"260100440" = "はい"
"260100450" = "今日の思い出を、こうして宝物に……"
"260100460" = "先生と一緒に過ごせて……本当に、楽しかったです"
"260100470" = "ありがとうございます"
"260100480" = "任務は、天候にも左右されるので"
"260100490" = "狙撃任務の時、空を見上げることが多いんです"
"260100500" = "地面を見ていても、あまり変化はありませんが……"
"260100510" = "空の景色は、移り変わりが早いです"
"260100520" = "だから……いつまでも、見ていられるのかもしれません"
"260100530" = "ただ、海辺から眺める空は……"
"260100540" = "……少し違うような"
"260100550" = "どう違うの？"
"260100560" = "えっと……"
"260100570" = "うぅ……"
"260100580" = "すみません"
"260100590" = "うまく……言葉にできないです"
"260100600" = "先日、捨てられていたファッション雑誌を読んだところ……"
"260100610" = "服装を変えることで、注目を集められる……とありました"
"260100620" = "あえて、その場にそぐわない格好をすることで、人の目を惹き付けられると……"
"260100630" = "今日は、最近買った服を着て"
"260100640" = "街を歩いてみようと思います"
"260100650" = "いいアイデアだとは思うけど……"
"260100660" = "それって、水着じゃないよね……？"
"260100670" = "じ、じゃあ……行ってきます"
"260100680" = "……ミユ？"
"260100690" = "…………ミユさん？"
