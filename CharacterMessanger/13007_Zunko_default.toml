[translation]
"1159" = "うう……美味しい物って、なんでこんなに高いんだろう……"
"1160" = "働かずにお金が欲しい……"
"1161" = "一攫千金とか期待し過ぎないで、きちんとコツコツ仕事をしないとね"
"1162" = "私も働かずにお金を貰って暮らしたい……"
"1163" = "うぅ、それはその通りだけど……"
"1164" = "……私から言い出しておいてなんだけど、先生がそんなこと言っていいの？"
"1165" = "まあこれも本音だけど、アルバイトの時は私も真剣にやってるよ"
"1166" = "ジュンコが、アルバイト……！？"
"1167" = "ねえ、なにその反応！"
"1168" = "私がアルバイトしてたら変！？"
"1169" = "先生、先生！"
"1170" = "私、すごいこと知っちゃった！"
"1171" = "どうしたの？"
"1172" = "お手頃価格で、高級な海鮮食材をたくさん食べられる方法を見つけたの！"
"1173" = "本当に？"
"1174" = "ジュンコ、いくらそういうのが食べたいからって犯罪はダメだよ"
"1175" = "もちろん。詳しい方法は秘密だけど……ふふっ"
"1176" = "私のことを何だと思ってるの！？犯罪とかじゃないから！"
"1177" = "詳しいことが知りたかったら、今夜ゲヘナの学食に来て！"
"1178" = "遅くならないようにね！"
"1179" = "うう……"
"1180" = "あんな実験のために材料を買わなければ、贅沢な食事ができたのに……"
"1181" = "ねえねえジュンコ"
"1182" = "ん、なに？"
"1183" = "ネットで見たんだけど、キュウリに蜂蜜を塗るとメロンの味がするらしいよ"
"1184" = "またネットの情報じゃん！それに蜂蜜って十分高いよ！"
"1185" = "もう騙されないんだからぁっ！"
"1186" = "ふふ、ねえ先生。良いこと教えてあげよっか？"
"1187" = "今日の美食研究会の夕飯はなんと……お肉！"
"1188" = "お肉！"
"1189" = "それも、高級な和牛！"
"1190" = "和牛！？"
"1191" = "ふふ。羨ましいでしょ、先生？"
"1192" = "今日は、存分に私のことを羨ましがっていいよ！"
"1193" = "私も食べたい……"
"1194" = "私も美食研究会に入る！"
"1195" = "ダーメ、今日行くお店は人数制限があるから"
"1196" = "その代わりに帰ってきたら、どれくらい美味しかったか教えてあげる！"
"1197" = "今日のお昼は、美食研究会でケーキバイキングに行くの！"
"1198" = "ケーキバイキング？"
"1199" = "あれ、先生ケーキバイキング知らないの？"
"1200" = "ケーキバイキングっていうのはね、"
"1201" = "色んなケーキがたくさん並んでて、時間内なら好きなだけ食べられる……"
"1202" = "そんな夢のようなスタイルの食事なの！"
"1203" = "途中で飽きちゃいそう……"
"1204" = "そういうこと言わないで！"
"1205" = "ケーキを思う存分食べられるチャンスなんて、そうそう無いんだから！"
"1206" = "うぅ……"
"1207" = "具合はどう？"
"1208" = "うん、ちょっとマシになってきた……"
"1209" = "昆布って、あんなにお腹の中で膨れるんだ……"
"1210" = "この前アカリがおやつで、味付き乾燥昆布を一袋丸ごと食べてたけど……"
"1211" = "アカリのお腹、いったいどうなってるの……"
"1212" = "先生、山海経の近くにある中華街の噂って聞いたことある？"
"1213" = "中華料理のお店でいっぱいで、どのお店もすごく美味しいんだって！"
"1214" = "私も、噂だけは聞いたことあるよ"
"1215" = "すごい美味しかったよ"
"1216" = "そっか。先生の耳にも入るぐらいだし、やっぱり間違いなさそう……！"
"1217" = "ええっ！私に声もかけないで、自分だけ行ってきたの！？ずるい！"
"1218" = "とにかく、美食研究会の一員として、これは行くしかないでしょ"
"1219" = "だから、えっと……今度の週末、もしよかったら一緒に行かない？"
"1220" = "うん、行こっか"
"1221" = "ふふっ、約束だよ？"
"1222" = "じゃあ週末、山海経高級中学校の正門前でね！"
"130070010" = "先生、先生！"
"130070020" = "楽しそうだね、ジュンコ"
"130070030" = "珍しいし、このモモトーク画面キャプチャしておこうかな？"
"130070040" = "ちょっと、どういうことよ！"
"130070050" = "……念のため聞くけど"
"130070060" = "本当に保存したわけじゃないよね？"
"130070070" = "してないです……"
"130070080" = "ならいいんだけど"
"130070090" = "それでね……なんと、ついに完成したの！"
"130070100" = "完成したって、何が……？"
"130070110" = "ふふっ……今、シャーレよね？"
"130070120" = "直接見せてあげる！"
"130070130" = "待ってて、すぐ行くから！"
