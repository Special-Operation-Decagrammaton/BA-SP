[translation]
"100180010" = "先生は休憩する時、どこで過ごされますか？"
"100180020" = "だいたいシャーレかな"
"100180030" = "だいたいトイレかな"
"100180040" = "確かに、シャーレは休むのにちょうど良い空間が多いですよね"
"100180050" = "そ、それは……でも、ちょっと分かるかもです。悪くないですよね"
"100180060" = "わたしは……人が通らなくて、日陰になっている、暗いところが好きです"
"100180070" = "誰にも邪魔されない、わたしだけの癒しの空間……"
"100180080" = "そういうところなら、いつまででもいられそうで"
"100180090" = "先生、今度は他のロッカーを探しておいていただけると……"
"100180100" = "ゲーム開発部のは、わたし専用のロッカーなので……"
"100180110" = "一緒に使うのはダメ？"
"100180120" = "そ、そう仰られましても二人では入れませんし……"
"100180130" = "ダメなものはダメ、です"
"100180140" = "先生は、どんな種類のゲームがお好きですか？"
"100180150" = "コンシューマーゲームが好きかな"
"100180160" = "アーケードゲームが好きかな"
"100180170" = "あ、そうなんですね。わたしは……ゲームでしたら大抵のものは好きです"
"100180180" = "ただ、他の人たちとプレイをしなくちゃいけない、オンラインゲームなどはちょっと……"
"100180190" = "なんだかプレッシャーを感じてしまって……あまりやりません"
"100180200" = "あ、でも、対戦型格闘ゲームはよくやります"
"100180210" = "そうなんだ？"
"100180220" = "はい、ああいうタイプのゲームは、それほど苦手ではなくて"
"100180230" = "今度、わたしが好きなゲーム会社から新しい対戦格闘ゲームが出るそうで、楽しみです"
"100180240" = "ユズと格ゲーって、なんだか意外な組み合わせだね"
"100180250" = "そ、そうでしょうか……？"
"100180260" = "ゲームを開発するのって、すごくお金が必要なんですよね……"
"100180270" = "前回の開発ではサーバーを維持するお金が足りなくて、"
"100180280" = "途中でデータを飛ばしてしまったこともあったぐらいなので……"
"100180290" = "(ﾟﾛﾟ;) それは大変だ……最終的にどうなったの？"
"100180300" = "幸いにもバックアップのデータがあったのでなんとか復旧できましたが……"
"100180310" = "4日間分の作業が、水の泡になってしまいました……"
"100180320" = "ゲームの開発は、大変な世界なんだね……"
"100180330" = "はい……"
"100180340" = "次回作の開発の時は、同じミスを繰り返さないように、"
"100180350" = "前もって開発費を集めておかないとです"
"100180360" = "この前のアルバイトは、色々とやってしまいました……"
"100180370" = "お客様の前で何度も体が固まってしまって、ミスの連発でしたし……"
"100180380" = "店長さんからは大丈夫だと言っていただけましたが……"
"100180390" = "じゃあ、今度は別のアルバイトをしてみない？"
"100180400" = "え？別のアルバイトですか……？"
"100180410" = "む、無理です！この前のコンビニのアルバイトだって、何とかギリギリだったのに……"
"100180420" = "大丈夫。今度のアルバイトは、直接人の顔を見なくてもできるやつだから"
"100180430" = "え、そんなアルバイトが……"
"100180440" = "それなら、大丈夫かもしれません……"
"100180450" = "先生、今月分のアルバイトのお給料をいただきました！"
"100180460" = "思ったより金額があったので、余ったお金で部員のみんなへのプレゼントもできました"
"100180470" = "('‿') それは良かった、お疲れ様！"
"100180480" = "それで、えっと……もしよかったら今週末、あの遊園地に来てくれませんか？"
"100180490" = "遊園地に？"
"100180500" = "その……先生に、お渡ししたいプレゼントが、ありまして"
"100180510" = "気持ちだけで十分だよ"
"100180520" = "いえ、その、先生と一緒に……"
"100180530" = "じゃなくて、それもですが、えっと……"
"100180540" = "先生に、どうしてもプレゼントをお渡ししたいんです！"
"100180550" = "なので今週末、遊園地に来てください！お願いします！"
"100180560" = ""
"100180570" = "フリーパス、こんなに早く手元に戻ってくるとは思いませんでした"
"100180580" = "お願いしたいこと……決まりましたか？"
"100180590" = "シャーレに来る時に、パンと牛乳を買ってきてくれない？"
"100180600" = "確かに何でもと言いましたが、そんなことにせっかくのフリーパスを使わないでください……！"
"100180610" = "これぐらいでしたら、普通に言っていただければ買ってきますから！"
"100180620" = "失くしたものって"
"100180630" = "探し回った結果"
"100180640" = "予想外の場所にあるんですよね……"
"100180650" = "分かるー！"
"100180660" = "リモコンとかね……"
"100180670" = "実際には"
"100180680" = "どこに置いたか忘れただけ"
"100180690" = "なんでしょうけど……"
"100180700" = "みんな同じ経験をしがちだからか"
"100180710" = "昔の方はこういう時"
"100180720" = "「いたずら好きな妖精さん」"
"100180730" = "……に盗まれてしまった、と"
"100180740" = "考えたそうです"
"100180750" = "面白い話だね"
"100180760" = "もしかして……"
"100180770" = "何か物でも失くしちゃった？"
"100180780" = "い、いえ"
"100180790" = "何も忘れてません"
"100180800" = "……多分"
