[translation]
"101210010" = "先生！ごきげんようですの！"
"101210020" = "今度、海へ遊びに行くことになりまして！"
"101210030" = "それも……百花繚乱の先輩方と一緒に！"
"101210040" = "おぉ、いいね！"
"101210050" = "ええ！まるで夢のようですわ！"
"101210060" = "素敵な時間を満喫するために……"
"101210070" = "琵琶の特訓をいたします！"
"101210080" = "……琵琶？"
"101210090" = "海に行くんだよね……？"
"101210100" = "もしや、舞のほうがふさわしいでしょうか？"
"101210110" = "先生！"
"101210120" = "ご相談に伺いますわね！"
"101210130" = "えっ？"
"101210140" = "今から？"
"101210150" = "今すぐ参りますわ！"
"101210160" = "先生！"
"101210170" = "本日の水着、大切にしまっておきますの！"
"101210180" = "着るときはちゃんと着なきゃね！"
"101210190" = "もちろんですわ！"
"101210200" = "物の価値は、使われてこそ輝きを増すものですから！"
"101210210" = "身共はお布団に入りながら考えました"
"101210220" = "ここ数日、考えに考え抜きました！"
"101210230" = "海にあって、百花繚乱の名に恥じない"
"101210240" = "華麗な姿を披露するにはどうすればよいか！"
"101210250" = "その心は？"
"101210260" = "海での「華麗な姿」とは？"
"101210270" = "それはすなわち！"
"101210280" = "水中を自由に舞い踊る魚たちのような"
"101210290" = "見事な泳ぎですの！"
"101210300" = "たしかにそれは華麗だね"
"101210310" = "たしかにそれは名案だね"
"101210320" = "これから水泳の猛練習に励む予定ですの"
"101210330" = "そこで、先生にお願いがありまして"
"101210340" = "よろしければ身共に水泳の極意を教えていただけませんか？"
"101210350" = "そんな大それた技術はないけど……"
"101210360" = "いいよ、一緒に練習しよっか"
"101210370" = "はい！"
"101210380" = "今日は家の者が失礼いたしました……"
"101210390" = "身共のこととなると、つい過保護になってしまうようでして"
"101210400" = "ユカリのことを大事に思ってるんだよ"
"101210410" = "私のことは気にしなくて大丈夫だよ"
"101210420" = "せっかく、先生のお時間をいただいて"
"101210430" = "水泳の練習ができると思いましたのに……！"
"101210440" = "次回に持ち越しだね"
"101210450" = "次は海で練習するんだよね？"
"101210460" = "ふふっ！約束ですの！"
"101210470" = "今からとっても楽しみにしておりますわ！"
"101210480" = "先生！"
"101210490" = "今日は待ちに待った……"
"101210500" = "海に行く日ですの！"
"101210510" = "お、元気だね！"
"101210520" = "張り切ってるね！"
"101210530" = "ええ！今度こそたくさん泳ぎますの！しょんぼりしてたらもったいないですから！"
"101210540" = "時は金なり！ですから！"
"101210550" = "ユカリらしい考え方だね！"
"101210560" = "ポジティブだね！"
"101210570" = "では先生！"
"101210580" = "海でお会いいたしましょう！"
"101210590" = "今日はたくさん泳げました！"
"101210600" = "今すぐにでも寝られそうですの！"
"101210610" = "泳ぐの上手だったよ！"
"101210620" = "優雅で気品あふれる泳ぎだった！"
"101210630" = "身共の泳ぎなんて、まだまだですの"
"101210640" = "このていどではえりーととはなのれ"
"101210650" = "ユカリ？"
"101210660" = "寝ちゃったかな？"
"101210670" = "おやすみ、ユカリ"
"101210680" = "先ほどは、ついうとうとしてしまいましたの"
"101210690" = "会話の途中で、失礼いたしました"
"101210700" = "よく眠れた？"
"101210710" = "気にしなくていいよ！"
"101210720" = "ええ！おかげさまで！"
"101210730" = "もうひと泳ぎできそうなくらいですわ！"
"101210740" = "夜の海は危ないから"
"101210750" = "また明日遊ぼうね"
"101210760" = "今晩はまだ眠れそうにありませんの"
"101210770" = "海がこんなにも楽しい場所だなんて、身共、初めて知りました！"
"101210780" = "先生を一日中ひとり占めしてしまいましたわ！"
"101210790" = "本日はとっても楽しかったですの！"
"101210800" = "それはよかった！"
"101210810" = "私も楽しかったよ"
"101210820" = "先生"
"101210830" = "身共は、この夏を絶対に"
"101210840" = "絶っっっっ対に！忘れませんわ！！"
