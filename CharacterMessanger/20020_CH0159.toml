[translation]
"200200010" = "ふふっ。こんにちは、先生"
"200200020" = "ん？"
"200200030" = "あら。私から連絡が来て、感激のあまり言葉に詰まっているのですね"
"200200040" = "ええ、当然のことです"
"200200050" = "私のような天才美少女から、いきなりメッセージが送られてきたんですもの"
"200200060" = "すみません、どちらさまですか？"
"200200070" = "なっ、まさかとは思いますが、私の連絡先を登録していないのですか……？"
"200200080" = "ごめんね。冗談だよ、ヒマリ"
"200200090" = "「ぴえん」……先生ったら、そんな意地悪なご冗談を"
"200200100" = "さしもの天才美少女も驚きました"
"200200110" = "「ぴえん」みたいな流行語をヒマリが使うとは……"
"200200120" = "これでもヴェリタスの部長を兼任している身ですから、ネット文化も少々嗜んでおります"
"200200130" = "こういう時は……「どや顔」をしながら言うべきでしたね"
"200200140" = "そ、そうだね……"
"200200150" = "それよりお話があるのです"
"200200160" = "先ほどシャーレをハッキング……いえ、調査したところ"
"200200170" = "本日はお休みとのことですが、間違いありませんか？"
"200200180" = "ハッキングって言っちゃったよ……"
"200200190" = "たしかに休みだけど……"
"200200200" = "ふふっ、ちょうど良かったです"
"200200210" = "後ほど座標を送りますので"
"200200220" = "ミレニアムでお待ちしていますね、先生"
"200200230" = "行くのはもう決定なんだ……すぐ向かうね"
"200200240" = "先生、今日はシャーレの仕事でミレニアムを訪れるのですね"
"200200250" = "うん、そうだよ"
"200200260" = "では、用事が終わりましたら……そうですね、15時頃でどうでしょう？"
"200200270" = "……お願いしたいことがありまして"
"200200280" = "分かった。仕事が終わったらすぐに向かうね"
"200200290" = "ふふふっ、では後ほどお会いしましょう"
"200200300" = "先生、少々大変なことになりまして"
"200200310" = "どうしたの？大丈夫！？"
"200200320" = "これは私一人では手の施しようがないと申しますか……"
"200200330" = "大至急、隠れ家に来ていただけませんか？お待ちしています"
"200200340" = "先生。私、とびっきりのお宝を手に入れました"
"200200350" = "ヒマリがお宝って言うことは……"
"200200360" = "気になるような、心配になるような……"
"200200370" = "あら、寂しい言い方ですね"
"200200380" = "こうしてる場合ではありません。すぐにでもお見せしたいのですが"
"200200390" = "分かった。これから向かうね"
"200200400" = "ふふっ、ではまた後ほど"
