[translation]
"200080010" = "いつもお世話になっております。"
"200080020" = "ゲヘナ風紀委員会の行政官、天雨アコです。"
"200080030" = "この度、シャーレとの業務提携の件でご連絡いたしました。"
"200080040" = "アコ……？"
"200080050" = "後ほど日時と場所の詳細をお送りいたしますので、お忙しいところ恐縮ですが、少々お時間頂戴できますと幸いです。"
"200080060" = "何卒よろしくお願いいたします。"
"200080070" = "う、うん"
"200080080" = "お疲れ様です、先生"
"200080090" = "今日のお話とはあまり関係無いのですが、どうやら確認したところ、昨晩配電関係の工事で一時的な停電があったらしいですね"
"200080100" = "……ところでよろしければ、監視カメラ100台ほどご入用だったりしませんか？"
"200080110" = "いらない"
"200080120" = "……はぁ"
"200080130" = "全くもう"
"200080140" = "本当にやってられませんね……"
"200080150" = "アコ？"
"200080160" = "どうしてこう次から次へと……！"
"200080170" = "えっと、大丈夫……？"
"200080180" = "先生、大切な用事が一つ"
"200080190" = "それも急ぎの用なので、すぐに来ていただけませんか？"
"200080200" = "まさかすっぽかしたりしませんよね？"
"200080210" = "は、はい……"
"200080220" = "先生"
"200080230" = "本日もお疲れ様でした"
"200080240" = "それではまた、よろしくお願いいたしますね"
"200080250" = "またあるのがもう確定してるんだね……"
"200080260" = "先生"
"200080270" = "実はですね"
"200080280" = "……"
"200080290" = "ちょっ"
"200080300" = "何ですかその反応は！"
"200080310" = "買わないよ？"
"200080320" = "押し売りの人扱いされている……！"
"200080330" = "な、何なんですかもう！"
"200080340" = "あれですか、新手のいじめですか！？"
"200080350" = "全くもう、先生までそういう……"
"200080360" = "……？"
"200080370" = "大丈夫？何かあった？"
"200080380" = "まあ"
"200080390" = "そう、ですね"
"200080400" = "特に大きなことではないのですが"
"200080410" = "ただ"
"200080420" = "？"
"200080430" = "……アコ？"
"200080440" = "先生、無事に帰られましたか？"
"200080450" = "ごめん、首輪そのまま持ってきちゃった"
"200080460" = "ああ、なるほど"
"200080470" = "そうでしたか"
"200080480" = "明日返しに行くね"
"200080490" = "はい"
"200080500" = "あ"
"200080510" = "いえ、持ってきていただかなくて大丈夫です"
"200080520" = "先生が持っていてください"
"200080530" = "……？"
"200080540" = "本日もお疲れ様でした"
"200080550" = "では、またお会いしましょう"
