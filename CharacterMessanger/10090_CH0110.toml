[translation]
"100900010" = "先生！お祭りですよ～！"
"100900020" = "ん……？どこかでお祭りがあるの？"
"100900030" = "あ、そうでした。先生はご存知ないか……"
"100900040" = "あの……先生、今日は百鬼夜行に用事があると仰ってましたよね？"
"100900050" = "ちょうど百鬼夜行で、夕方からお祭りが開催される予定なんです"
"100900060" = "ご都合が合えば、ぜひいらしてください！"
"100900070" = "いいね。お祭りにはあまり縁がなかったけど……"
"100900080" = "心配はいりません！"
"100900090" = "私がお祭りを100％楽しめるようにご案内しますから！"
"100900100" = "それでは、夕方にお会いしましょう！"
"100900110" = "会場でお待ちしてますね！"
"100900120" = "こんにちは、先生"
"100900130" = "えっと、今日のご予定を伺ってもよいでしょうか……？"
"100900140" = "特に急ぎの予定はないかな"
"100900150" = "なんだか、百夜堂に行きたい気分かも……"
"100900160" = "本当ですか！"
"100900170" = "私、今日は百夜堂でお仕事なので……、先生が来てくれたらとても嬉しいです！"
"100900180" = "いつごろお越しになれそうですか……？"
"100900190" = "午後になりそうかな？"
"100900200" = "わかりました！"
"100900210" = "それなら、百夜堂でお会いできそうですね"
"100900220" = "お待ちしてます！"
"100900230" = "先生……"
"100900240" = "その、今日はお忙しいでしょうか……？もしよろしければ、あの……"
"100900250" = "百夜堂に行こうか？"
"100900260" = "えへへっ。……はい！"
"100900270" = "ありがとうございます、先生～"
"100900280" = "それでは、百夜堂でお待ちしてますね！"
"100900290" = "先生、この前は失礼いたしました……"
"100900300" = "ウミカのほうは、もう落ち着いたかな？"
"100900310" = "はい。おかげさまで……"
"100900320" = "あの、先生にご相談したいことがあるんです"
"100900330" = "この前の件と、すこし関係するのですが……"
"100900340" = "もしご都合がよろしければ……"
"100900350" = "百夜堂まで来ていただけないでしょうか……？"
"100900360" = "今日は行ってもいいんだね！"
"100900370" = "え、は……はい！"
"100900380" = "む、むしろですね……"
"100900390" = "今日は是非来ていただきたいんです……"
"100900400" = "だから、お待ちしてますね"
"100900410" = "うん。百夜堂で会おうね"
"100900420" = "先生？"
"100900430" = "もういらっしゃってますか？"
"100900440" = "さっき着いたところだよ"
"100900450" = "今どのあたり？"
"100900460" = "ごめんなさい！"
"100900470" = "ちょっと遅れてしまいそうで……"
"100900480" = "焦らずゆっくりでいいからね"
"100900490" = "すぐ行きますので！"
"100900500" = "お疲れ様でした、先生"
"100900510" = "ウミカもお疲れ様"
"100900520" = "そうだ、人形忘れてない？"
"100900530" = "あ……！"
"100900540" = "その……よければ"
"100900550" = "その子を、預かっていてもらえると嬉しいです"
