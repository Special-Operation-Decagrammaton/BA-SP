[translation]
"260090010" = "えっと、先生……"
"260090020" = "メイドは、好きですか？"
"260090030" = "……まあ、好きだけど……"
"260090040" = "急にどうしたの？"
"260090050" = "なるほど……"
"260090060" = "実は、その……"
"260090070" = "今開発しているゲームに"
"260090080" = "メイドのキャラクターを出そうと思っているんです"
"260090090" = "メイドは一定の人気がありますから"
"260090100" = "その……メイド服の構造を詳しく知りたいのですが、持ってそうな人が知り合いにいなくて……先生なら詳しいかな、と"
"260090110" = "C&Cに手伝ってもらうのは？"
"260090120" = "その……あ、あんまり他の人に頼むのは"
"260090130" = "ちょっと……まだ、怖くて"
"260090140" = "他になにか方法がないか探してみます……"
"260090150" = "先生"
"260090160" = "わたしにもできそうなバイトを知らないでしょうか？"
"260090170" = "新しいゲームを開発するのに必要なリソースを確保したくて……"
"260090180" = "このままだと、費用が少し足りない気がしていて……"
"260090190" = "分かった。どんなアルバイトがいい？"
"260090200" = "選べる立場ではないですが……"
"260090210" = "できるだけ、人と接する機会が少ないものだと……"
"260090220" = "なら行きつけのカフェを紹介してあげる"
"260090230" = "お客さんも多くないし、店員さんもみんな優しいから"
"260090240" = "カフェの接客、ですか"
"260090250" = "少し不安はありますが……"
"260090260" = "先生を信じて、行ってみます"
"260090270" = "先生、もしかして、わたしに電話しましたか？"
"260090280" = "すみません、アルバイト中で確認できませんでした……"
"260090290" = "大丈夫だよ。そうだと思ってたから"
"260090300" = "ありがとうございます。どんなご用事だったのですか？"
"260090310" = "明日の午前中、ユズが働いてるお店の近くを通るんだけど"
"260090320" = "もしよかったら行ってもいい？"
"260090330" = "はい！？明日ですか！？"
"260090340" = "あ、いえ、ダメというわけではないのですが……"
"260090350" = "やっぱり"
"260090360" = "ちょっと"
"260090370" = "緊張しますね……"
"260090380" = "最近朝から晩までゲーム開発していたからか"
"260090390" = "作業環境が少し散らかってきた気がして……"
"260090400" = "今日は他のみんなもいないし、ゆっくり掃除しようと思います"
"260090410" = "お疲れ様"
"260090420" = "時間があれば手伝いに行くよ"
"260090430" = "……え？"
"260090440" = "どうしてですか？"
"260090450" = "普通、掃除は一人でするものだと思うのですが……"
"260090460" = "そうだっけ……？"
"260090470" = "人が多い方が早く終わると思って"
"260090480" = "お気持ちは嬉しいですが大丈夫です"
"260090490" = "お気遣いありがとうございます"
