[translation]
"100300010" = "こんにちは、先生"
"100300020" = "昨日、当番を終えて帰る時にもまだシャーレの電気が点いていましたが……"
"100300030" = "先週末も夜遅くまで残業していたとお聞きしましたし……"
"100300040" = "お休みは、きちんと取られていますか？"
"100300050" = "最近はなかなか……"
"100300060" = "良くありませんよ、休息もれっきとした任務の一部です"
"100300070" = "ゲヘナ風紀委員会の救護担当として、これは見過ごせません"
"100300080" = "最近、お体で気になるところはございませんか？"
"100300090" = "最近は目が疲れてるような……"
"100300100" = "最近は肩が凝ってるような……"
"100300110" = "なるほど……典型的な慢性疲労の症状ですね"
"100300120" = "そういえば、ゲヘナ学園には疲労回復の効果がある温泉がたくさんあるんです"
"100300130" = "お時間がある時にでも、ゲヘナの温泉をご利用されてはいかがでしょうか？"
"100300140" = "そうなんだ、それは良さそう"
"100300150" = "時間ある時に一度寄ってみるね"
"100300160" = "はい、是非"
"100300170" = "少しでも先生の疲れが取れますように"
"100300180" = "～チナツ～"
"100300190" = "先生、お疲れ様です"
"100300200" = "温泉に入られて、何かご不便などはありませんでしたか？"
"100300210" = "うん、大丈夫"
"100300220" = "チナツが色々配慮してくれたおかげでバッチリ"
"100300230" = "それは良かったです"
"100300240" = "それで、本題なのですが……今から先生のところに、お伺いしてもよろしいでしょうか？"
"100300250" = "その、もちろん変な意味ではなく……！"
"100300260" = "疲労に効くお茶を手に入れたので、よろしければ一緒にお茶でもと思いまして"
"100300270" = "その……いかがでしょうか？"
"100300280" = "もちろん。ありがとう、待ってるね"
"100300290" = "いえそんな、こちらこそありがとうございます"
"100300300" = "では、すぐにお伺いしますね"
"100300310" = "～チナツ～"
"100300320" = "こんにちは、先生"
"100300330" = "その、もしよろしければ今日の午後、少しお時間をいただけないでしょうか？"
"100300340" = "実は先生に手伝っていただきたいことがありまして……"
"100300350" = "うん、任せて"
"100300360" = "チナツの頼みならいくらでも！"
"100300370" = "あ、ありがとうございます"
"100300380" = "それでは、お土産屋さんの前でお待ちしておりますね"
"100300390" = "よろしくお願いいたします"
"100300400" = "～チナツ～"
"100300410" = "先生、こんにちは"
"100300420" = "この前のお土産選びの件はありがとうございました"
"100300430" = "それに、プレゼントまで頂いてしまって……"
"100300440" = "その、お返しのお返しというのも変なお話かもしれませんが……"
"100300450" = "何か私も恩返しがしたいと思い、ある旅館の予約をしておきました"
"100300460" = "結構良いところでして、食事や施設も素晴らしいと評判のところですので、きっとご満足いただけるかと"
"100300470" = "それでは、お待ちしておりますね"
"100300480" = "～チナツ～"
