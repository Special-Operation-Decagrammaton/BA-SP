[translation]
"100450010" = "先生、ちょっとお願いがあるんだけど"
"100450020" = "もしみんなが私を探してても「知らない」って答えてもらえるかな？"
"100450030" = "いま大事なことをしてて"
"100450040" = "先生も何も聞かなかったフリしてね。頼んだよ"
"100450050" = "いいけど……客室にいるの？"
"100450060" = "客室で寝る、とか？"
"100450070" = "うへ～まぁ、そんな感じ"
"100450080" = "寝てるわけじゃないけど……客室にはいるよ～"
"100450090" = "とりあえず……聞かれたらそう答えておいてね、先生"
"100450100" = "先生、今日はありがとね"
"100450110" = "一緒にお昼寝するの楽しかったよ"
"100450120" = "これでもう私たちは共犯者だね"
"100450130" = "サボりの共犯……ってことで"
"100450140" = "……！？"
"100450150" = "やられた……最初からその目的で！？"
"100450160" = "えへへ"
"100450170" = "うう……"
"100450180" = "助けて、先生……"
"100450190" = "大変なことが……"
"100450200" = "ホシノ？"
"100450210" = "どうしたの？"
"100450220" = "今、海水浴場の方にいるんだけど"
"100450230" = "ちょっと助けてほしくて……"
"100450240" = "先生じゃないとできないことだから"
"100450250" = "みんなを呼ばないで、必ず一人で来てね……"
"100450260" = "お願い、頼んだよ～"
"100450270" = "先生へ"
"100450280" = "残念なお知らせ"
"100450290" = "結局バレちゃった？"
"100450300" = "私も呼び出される……？"
"100450310" = "あ、そういうんじゃなくて"
"100450320" = "海の幸が思ったよりたくさん採れちゃったじゃん"
"100450330" = "だから、これからも毎日採ってきてってさ～"
"100450340" = "というわけで"
"100450350" = "これからもよろしくね、先生"
"100450360" = "海はいいよね"
"100450370" = "白い砂浜、どこまでも続く水平線……"
"100450380" = "詩的だね"
"100450390" = "確かに良いよね"
"100450400" = "うへ……"
"100450410" = "えっと"
"100450420" = "ちょっと言ってみたかっただけ"
"100450430" = "特に深い意味はないよ"
"100450440" = "そういえば先生"
"100450450" = "どこかで聞いたことがあるんだけど"
"100450460" = "さっきのボラみたいに"
"100450470" = "鯨もジャンプするって聞いたんだけど"
"100450480" = "それって"
"100450490" = "どれくらい待てば見れるんだろう？"
"100450500" = "砂浜からは見れないかも"
"100450510" = "遠い海の方に出たら見れるかな"
"100450520" = "……"
"100450530" = "うへ……ちょっと難しいなそれは"
"100450540" = "残念……"
"100450550" = "まあ、でも"
"100450560" = "機会があったら一緒に見に行こうよ"
"100450570" = "一緒に、ね"
