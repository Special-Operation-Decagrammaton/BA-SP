[translation]
"200230010" = "ヴァルキューレ警察学校、公安局局長の尾刃カンナです"
"200230020" = "明日の10時30分頃、シャーレの執務室を訪問させていただきます"
"200230030" = "ついにこの時が……"
"200230040" = "濡れ衣です！"
"200230050" = "……どういうことでしょうか？"
"200230060" = "以前お約束した、シャーレの当番の話ですが……"
"200230070" = "何か困るようなことでも？"
"200230080" = "ああ、当番のことね……"
"200230090" = "何も問題ないよ、大丈夫"
"200230100" = "でしたら良かったのですが……"
"200230110" = "それでは明日、先ほどお伝えした時刻に伺います"
"200230120" = "先生、夜分遅くに失礼いたします"
"200230130" = "ヴァルキューレ警察学校の尾刃カンナです"
"200230140" = "どうしたの？"
"200230150" = "こちらの勝手で申し訳ありませんが……"
"200230160" = "来週の当番、日程を変更しても良いですか？"
"200230170" = "それくらい問題ないよ"
"200230180" = "何かトラブル？"
"200230190" = "また警備局のバカ共が……"
"200230200" = "いえ"
"200230210" = "忘れてください"
"200230220" = "緊急の要請が来たため、私も作戦に加わることになりまして"
"200230230" = "大変だね……"
"200230240" = "これも公安局局長としての務めですので"
"200230250" = "それでは、当番の日程は、別途メールで連絡いたします"
"200230260" = "事件のことは気にせず、先生はお休みになってください"
"200230270" = "ヴァルキューレ警察学校の食堂は安価でメニューも豊富ですが"
"200230280" = "開いている時間が限られています"
"200230290" = "仕事に集中していると、すでに閉まっていることも多いので"
"200230300" = "しばしば食事を抜くことも……"
"200230310" = "外で食べるのはダメなの？"
"200230320" = "いえ、そんな規則はありませんが……"
"200230330" = "仕事があるのに外で食事をするのは、少し気が引けるので"
"200230340" = "そういえば、生活安全局には"
"200230350" = "警備局や捜査局に転科を希望する生徒が、それなりにいるようです"
"200230360" = "聞いたことあるかも"
"200230370" = "多いかな……？"
"200230380" = "そういうカンナは、最初から公安局志望だったの？"
"200230390" = "私ですか？"
"200230400" = "私の場合"
"200230410" = "1年生の時に生活安全局を志望しましたが……"
"200230420" = "その顔で市民の窓口に立つような仕事は難しいと言われ……"
"200230430" = "結構な……"
"200230440" = "何か言いたいことでも？"
"200230450" = "いやっ、何でもないよ！"
