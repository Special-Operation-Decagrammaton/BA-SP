[translation]
"200390010" = "先生、おるか？"
"200390020" = "うん、いるよ"
"200390030" = "うむ、それは重畳"
"200390040" = "よく聞いてほしいのじゃが……"
"200390050" = "いや、読んでほしいのじゃが"
"200390060" = "今、玄龍門で"
"200390070" = "いや、玄龍門の門主に"
"200390080" = "前代未聞の事件が起きておる"
"200390090" = "どういう事！？"
"200390100" = "一刻を争う事態じゃ"
"200390110" = "無論、機密に関わることでもある"
"200390120" = "其方が生徒の期待に応える教育者であるのなら"
"200390130" = "誰にも口外せず……"
"200390140" = "今すぐ、山海経まで来てほしい"
"200390150" = "玄龍門での業務体験はどうじゃった？先生"
"200390160" = "キサキは……凄いと思ったよ"
