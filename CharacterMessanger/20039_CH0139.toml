"200390880" = "どうかしたの？"
"200390890" = "……"
"200390900" = "その"
"200390910" = "つまり"
"200390920" = "……"
"200390930" = "こういうことじゃ"
"200390940" = ""
"200390950" = "！？！？"
"200390960" = "これは……！まさか！？"
"200390970" = "ついさっき、撮ったものなんじゃが"
