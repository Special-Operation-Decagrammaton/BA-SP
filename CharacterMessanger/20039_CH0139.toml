"200390190" = "無論、起こさせぬことも肝要じゃが"
"200390200" = "なるほど、そうなんだね。"
"200390210" = "うむ"
"200390220" = "そうさな"
"200390230" = "次は妾がシャーレを訪ねるとしよう"
"200390240" = "ふふ、期待しておると良い"
"200390250" = "さて。以前、話した通り"
"200390260" = "本日は「当番」として、シャーレを訪ねるつもりじゃが"
"200390270" = "うん、いつでもおいで"
"200390280" = "ふむ"
"200390290" = "心強い返事じゃ"
"200390300" = "それでは、また後程"
"200390310" = "体調はどうじゃ、先生"
"200390320" = "だいぶ良くなったけど……"
"200390330" = "今日、キサキはちゃんとシャーレに来てたよね？"
