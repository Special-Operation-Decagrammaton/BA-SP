"200390350" = "なるほど……"
"200390360" = "……"
"200390370" = "ふふ"
"200390380" = "妾もよく分からぬ、と答えたらどうするつもりなのじゃ？"
"200390390" = "えっ、どういうこと……！？"
"200390400" = "胡蝶の夢……と申してのう"
"200390410" = "まこと興味深い話じゃとは思わぬか？"
"200390420" = "まあ、それはさておき"
"200390430" = "先生の寝顔、しっかりと写真に収めたぞ"
"200390440" = "い、いつの間に！？"
"200390450" = "シャーレ当番にも"
"200390460" = "少しずつ慣れてきたと思うのじゃが……どうじゃ？"
"200390470" = "完璧にこなしてくれてるよ"
"200390480" = "どうじゃろうか……"
"200390490" = "玄龍門の者からは"
"200390500" = "日を追うごとに心配されておるがの"
"200390510" = "ふむ……そうさな"
"200390520" = "今日もシャーレを訪れるとしよう"
"200390530" = "あれ？今日当番だっけ？"
