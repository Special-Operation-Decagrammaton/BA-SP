[translation]
"2328" = "C&Cはミレニアムに奉仕する。それが、メイドとしての仕事だから"
"2329" = "どんな任務か知らないけど、明日の任務はミレニアムの市街地で行うらしい"
"2330" = "メイドの任務っていうと……掃除？"
"2331" = "気を付けてね"
"2332" = "……それほど間違ってはいない"
"2333" = "ミレニアムに害を与える者たちを消し去ることも、"
"2334" = "多分、掃除と呼ぶだろうし"
"2335" = "もちろん、掃除でも、そうでなくても……"
"2336" = "心配してくれてありがとう"
"2337" = "どんな任務でも……C&Cは、全力で奉仕する"
"2338" = "さっきは助かった、ありがとう。感謝してもしきれないな"
"2339" = "今度いつか、奉仕でお返ししたい"
"2340" = "私にもっと力があれば、"
"2341" = "この世から「数学」という科目を消し去るのに……"
"2342" = "急にどうしたの？"
"2343" = "急な愚痴で申し訳ない……"
"2344" = "図書館へ行く途中にふと、先生に聞いてほしくなって"
"2345" = "その、二つ目の夢は……叶った時にちゃんと教える"
"2346" = "誰にも言ったことない、けど"
"2347" = "どっちにせよ、一番最初に知るのは先生だろうし……"
"2348" = "先生、衝撃のニュースだ"
"2349" = "衝撃のニュース？"
"2350" = "前向きなニュースだと良いな"
"2351" = "テスト、完全に惨敗 (*‿*)ノ"
"2352" = "……あれ、この絵文字、合ってる？"
"2353" = "先生、ありがとう。今日は楽しかった"
"2354" = "……本当に、心から"
"2355" = "先生は、先生だけど……"
"2356" = "友人として頼みたい。私の悩みを、聞いてくれない？"
"2357" = "もちろん、どうしたの？"
"2358" = "分かった、どこに行けばいいかな？"
"2359" = "ありがとう"
"2360" = "ミレニアムの屋上に来てほしい"
"2361" = "先生、すごいことがあったんだ"
"2362" = "ピザを買って教室に入ったら、さっき先生に話した友人がそこで待ってて"
"2363" = "……彼女は、サラダを買ってきてくれてた"
"2364" = "嬉しかった、すごく"
"2365" = "友人に急用ができたらしくて、代わりにバイトに行くことになった"
"2366" = "可愛い制服で有名なお店みたいだから、楽しみだ"
"2367" = "可愛いユニフォームを着たカリン、見たいな"
"2368" = "……そのお店、大丈夫？"
"2369" = "そ、そう言ってくれるのは、嬉しい、けど"
"2370" = "……ちょっと、恥ずかしい"
"2371" = "ん？どういうこと？"
"2372" = "たとえどこであっても、"
"2373" = "C&Cのメイドとして必要とされてるのであれば、"
"2374" = "私は、助けになりたい"
"2375" = "じゃあ、そろそろ行ってくる"
"2376" = "慣れてきたら、先生のことも招待するから"
"2377" = "そういえば、先生……"
"2378" = "私がその……あのポーズをした時、タブレットを構えてた気がするけど……"
"2379" = "まさか、撮ってないよね？"
"2380" = "カリンは撮ってないよ。笑顔が眩しいキャサリンは撮ったけど"
"2381" = "黙秘権を行使します"
"2382" = "今すぐ消して！"
"2383" = "ちょっと、先生！？既読無視しないで！"
"2384" = "先生"
"2385" = "友人の用事は無事終わったらしい"
"2386" = "これでもう、メイドカフェに代わりに行く必要もない"
"2387" = "お疲れ様！"
"2388" = "最後にもう一度見たかった！"
"2389" = "うん。まあ色々あったけど、友達にも助かったと言ってもらえた"
"2390" = "残念だけど、もう私がメイドカフェで仕事をすることはないから"
"2391" = "もう先生にあの、萌え萌えキュンもやってあげられないね"
"2392" = "残念……だったり、する？"
"2393" = "……なんてね。何にせよこれからもよろしく"
"2394" = "私の、ご主人様"
