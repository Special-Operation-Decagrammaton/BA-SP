[translation]
"101450010" = "せっかく渓谷にまで来たのならば"
"101450020" = "相応の過ごし方をすべきだとは思わぬかえ？"
"101450030" = "たしかにそうだね"
"101450040" = "うむ"
"101450050" = "見解は一致しておるようじゃな"
"101450060" = "では、今から言う場所で落ち合うとしよう"
"101450070" = "あ、今すぐ！？"
"101450080" = "安心せい。気は長いほうじゃ"
"101450090" = "……限度はあるがの"
"101450100" = "ふと"
"101450110" = "昨日を思い出したのじゃ"
"101450120" = "楽しかったよね"
"101450130" = "そうじゃな"
"101450140" = "とはいえ"
"101450150" = "過去にするのはまだ早かろう"
"101450160" = "では、今日も待っておるぞ"
"101450170" = "だって、先生はいつだって最高ですから！"
"101450180" = "キサキ……？"
"101450190" = "先生、起きておるか？"
"101450200" = "ん……？"
"101450210" = "朝早くにどうしたの？"
"101450220" = "早起きとは感心じゃな"
"101450230" = "時は絶えず流れ続ける"
"101450240" = "少しでも有効に使うことが"
"101450250" = "悔いのない休暇に繋がるのじゃ"
"101450260" = "暑い日が続くが、息災かえ？"
"101450270" = "こうも日差しが強くては"
"101450280" = "あの渓谷が恋しくなってしまうのう"
"101450290" = "先生もどうじゃ？"
"101450300" = "水着にふさわしき場所へ"
"101450310" = "ん……？"
"101450320" = "この夏を共にしてくれたこと、礼を言う"
"101450330" = "どれも忘れられない思い出ばかりじゃ"
"101450340" = "まだだよ"
"101450350" = "ほう？"
"101450360" = "外はまだ暑いでしょ？"
"101450370" = "夏はまだ続くでしょ？"
"101450380" = "それはそうじゃが……"
"101450390" = "そうか"
"101450400" = "ならば、妾とまだ一緒にいてくれるのかえ？"
"101450410" = "望むなら、いくらでも"
"101450420" = "そうか"
"101450430" = "ふふ"
"101450440" = "あまり他所でそういうことは言わぬようにな"
"101450450" = "先生ならば心配は不要やもしれぬが……"
"101450460" = "とある蝶は、永久に約束を記憶するそうじゃからの"
