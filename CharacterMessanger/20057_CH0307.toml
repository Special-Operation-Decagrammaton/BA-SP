[translation]
"200570010" = "ミレニアムはいかがですか？ご主人様"
"200570020" = "何度も足を運ばれているので、慣れ親しんだ場かもしれませんが……"
"200570030" = "たしかに、慣れつつはあるけど……"
"200570040" = "足を運ぶたびに新鮮な気持ちになるよ"
"200570050" = "おや、そうなのですね"
"200570060" = "ミレニアムは技術の学園。たしかに日進月歩移り変わる場所です"
"200570070" = "そうですね……たまには業務以外で"
"200570080" = "私たちの日常をご覧になってみては？"
"200570090" = "先生"
"200570100" = "私、一歩踏み出してみたいです"
"200570110" = "よし、頑張ろうか"
"200570120" = "よろしくお願いします"
"200570130" = "今から徹夜で……！"
"200570140" = "「親しくなろう」作戦の台本作り、始めようか！"
"200570150" = "はい、先生。"
"200570160" = "先生とほぼ徹夜で"
"200570170" = "シミュレーションをしながら"
"200570180" = "「台本」を作成しましたが……"
"200570190" = "本当に、大丈夫でしょうか？"
"200570200" = "私にも正解は分からないけど……"
"200570210" = "やってみてから考えよう！"
"200570220" = "そうですね……何事もトライアンドエラー、ですものね"
"200570230" = "こんにちは。先生"
"200570240" = "おかげさまでクラスの子たちと"
"200570250" = "少しうまくやれるようになった気がします"
"200570260" = "それはよかった！"
"200570270" = "アカネなら大丈夫だと思ってた"
"200570280" = "ありがとうございます"
"200570290" = "その……もし、先生さえよろしければ……"
"200570300" = "今の私をお見せしたい、と思って……"
"200570310" = "いかがでしょうか？"
"200570320" = "――二人きりで"
"200570330" = "アカネ……？"
"200570340" = "あの、先生"
"200570350" = "今日はありがとうございました"
"200570360" = "先に帰っちゃうなんて……"
"200570370" = "寂しいな"
"200570380" = "申し訳ありませんでした……"
"200570390" = "ですが……その……"
"200570400" = "思っていたより……"
"200570410" = "恥ずかしかったんです"
"200570420" = "最近思ったのですが"
"200570430" = "お掃除をする時のパターンが"
"200570440" = "単調になってしまっているのではないかと"
"200570450" = "工夫を凝らした方が良いのでしょうか？"
"200570460" = "掃除の仕方ってそんなにないと思うけど……"
"200570470" = "ああ、ええと……"
"200570480" = "そちらのお掃除ではなく"
"200570490" = "もう一つの「お掃除」の話でして……"
"200570500" = "もしかして……"
"200570510" = "……爆弾のこと？"
"200570520" = "ええ"
"200570530" = "とても悩ましい問題で……"
"200570540" = "遅い時間まで、本当にお疲れさまでした……"
"200570550" = "アカネは大丈夫？"
"200570560" = "ええ"
"200570570" = "予習復習も終わりましたし"
"200570580" = "明日の準備も完璧です"
"200570590" = "全て、先生の指導の賜物です"
"200570600" = "あはは…自分の教育方針を見つめ直したくなってきたよ"
"200570610" = "ふふ"
"200570620" = "自らを見つめ直している方のお言葉ほど"
"200570630" = "心強いものはありません"
"200570640" = "これからも、どうぞよろしくお願いしますね"
"200570650" = "……ご主人様"
