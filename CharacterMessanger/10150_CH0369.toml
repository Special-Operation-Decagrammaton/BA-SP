[translation]
"101500010" = "一つ聞きたいことがあるんだけど"
"101500020" = "先生って普段メガネかけてる？"
"101500030" = "かけてるよ"
"101500040" = "かけてないよ"
"101500060" = "あ、私と一緒だ"
"101500070" = "私も目が悪いから、潜る時以外はずっとメガネをかけてるんだ"
"101500080" = "そっか"
"101500090" = "裸眼で生活できるなんて、ちょっと羨ましいな"
"101500100" = "私は目が悪くて、かなり前からメガネをかけてるから"
"101500140" = "どのくらい目が悪いの？"
"101500150" = "うーん……最近測ってないから分からないけど……"
"101500160" = "メガネを外したら、一歩も歩けないくらい……かな"
"101500170" = "それは大変そうだね……"
"101500180" = "でも、そこまで不便でもないよ"
"101500190" = "目に頼らなくても、危険を察知する方法はあるからね"
"101500200" = "先生、今って忙しい？"
"101500210" = "頼みたいことがあるんだけど"
"101500220" = "大丈夫、ちょうど休んでたところだよ"
"101500230" = "どうしたの、急に？"
"101500240" = "ごめん"
"101500250" = "何て書いてあるのか分からないや"
"101500260" = "？？？"
"101500270" = "変な文章になっちゃっても許してね"
"101500280" = "今、音声入力してるから"
"101500290" = "実は、先生に助けてほしくて"
"101500300" = "いつもの本屋さんの前にいるんだけど"
"101500310" = "迷子になっちゃったみたい"
"101500320" = "……迷子？"
"101500330" = "先生、さっきロードス号の前を通ってなかった？"
"101500340" = "オデュッセイアに用があったの？"
"101500350" = "うん。海上取締りのことでお願いがあって……"
"101500360" = "トライデントに行ってたんだ"
"101500370" = "シャーレの先生って、そんなことまでやるの？"
"101500380" = "いろいろと大変だね"
"101500390" = "コトネは、今日もダイビングの仕事？"
"101500400" = "ううん。今日は非番だよ"
"101500410" = "一日中、本でも読もうかなと思ってるんだ"
"101500420" = "ここは涼しくて気持ちいいから、本を読むにはちょうどいいんだよ"
"101500430" = "おすすめの休憩スペースってこと？"
"101500440" = "一度見てみたいな。仕事が終わったら寄ってもいい？"
"101500450" = "もちろん"
"101500460" = "私は本を読みながらのんびり待ってるから"
"101500470" = "近くに来たら教えて"
"101500480" = "先生、この豆知識知ってる？"
"101500490" = "シャチって社会性があるから、平均10頭くらい友達がいて"
"101500500" = "イルカや人と友達になることもあるんだって"
"101500510" = "へぇ、面白い話だね"
"101500520" = "でしょ？"
"101500530" = "でも私はそうじゃなくて……"
"101500540" = "部員以外だと、友達って呼べる人がほとんどいないんだよね"
"101500550" = "だから、時々思うんだ"
"101500560" = "私の交友関係って、シャチより狭いのかもって"
"101500570" = "うーん、あまり気にしなくていいと思うけど……"
"101500580" = "どうして？"
"101500590" = "友達は……数以上に、関係の深さが大事だから"
"101500600" = "ダイビング部のみんなは、お互いにとってかけがえのない親友でしょう？"
"101500610" = "そうだけど……"
"101500620" = "それでいいのかな"
"101500630" = "コトネがいいと思うなら、それでいいんだよ"
"101500640" = "それなら"
"101500650" = "私は、それでいいって思う"
"101500660" = "先生、いい知らせだよ"
"101500670" = "あの子から返事が来たんだ"
"101500680" = "それはよかった！"
"101500690" = "やっぱり何か事情があったの？"
"101500700" = "うん"
"101500710" = "普段はネットに張りついてる子なんだけど"
"101500720" = "オデュッセイアの船団がD.U.に戻ってきた時、たまたま通信機器が使えなくなってたんだって"
"101500730" = "たしか、副部長に没収されたとか言ってたな"
"101500740" = "機器を没収された？"
"101500750" = "なんだか厳しい雰囲気の部活だね……"
"101500760" = "どうだろう？そこまでは知らないけど"
"101500770" = "書いてあった話だと"
"101500780" = "シャーレに仕掛けた盗聴器が見つかって怒られたらしいよ"
"101500790" = "……ん？"
"101500800" = "盗聴器……？"
"101500810" = "うん。何か心当たりがあるの？"
"101500820" = "うーん……"
"101500830" = "ありすぎて、分からないかも……"
"101500840" = "ふーん？とにかく、先生がいなかったらずっと誤解したままだったと思う"
"101500850" = "本当にありがとう"
