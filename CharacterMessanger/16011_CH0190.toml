[translation]
"160110010" = "先生、今お時間よろしいでしょうか"
"160110020" = "今度開かれる大運動会に関してご相談がありまして……"
"160110030" = "他の学園にも関わることなので、もしよろしければ、一緒に見ていただけないかと思い、ご連絡致しました"
"160110040" = "もちろん、すぐ行くね"
"160110050" = "ありがとうございます"
"160110060" = "場所をお送りしますね"
"160110070" = "先生、今日は本当にありがとうございました"
"160110080" = "ご相談に乗ってくださっただけでなく、送ってくださるなんて……"
"160110090" = "そういえば、今回の大運動会、先生もいらっしゃると存じておりますが"
"160110100" = "ぜひ会場でも、お会いできたらと思います"
"160110110" = "それでは、もう夜も遅いですし帰りはお気をつけてくださいね"
"160110120" = "先生、今お時間大丈夫でしょうか"
"160110130" = "もう明日から大運動会が始まるのですが、その前に……"
"160110140" = "あ、その……"
"160110150" = "今回は相談等ではなく"
"160110160" = "今まで手伝っていただいたお礼をしたく思いまして……"
"160110170" = "そんなに気にしなくていいのに、ありがとう"
"160110180" = "大丈夫だよ。どこに向かえばいいかな？"
"160110190" = "お返事ありがとうございます"
"160110200" = "それではお待ちしておりますね"
"160110210" = "思いがけず、長い時間になってしまってすみませんでした"
"160110220" = "ご配慮くださりありがとうございます"
"160110230" = "その……レモンのはちみつ漬けなんですが"
"160110240" = "もし、足りなかったら仰ってくださいね。まだまだありますから"
"160110250" = "その……"
"160110260" = "それ以外のご用事でも、呼んでいただけたら嬉しいです"
"160110270" = "余談なのですが……"
"160110280" = "普段はちゃんと自制できているものも、状況が変わると難しくなるものですね……"
"160110290" = "急にどうしたの？"
"160110300" = "……もしかして、ダイエットの話？"
"160110310" = "周囲の空気も浮き足立ってますし、格好も……"
"160110320" = "いえ、何でもないです……気にしないでください"
"160110330" = "変な話をしてすみませんでした"
"160110340" = "ごめんなさい、先生。プレゼントしたのに全部私が食べてしまうなんて……"
"160110350" = "後でまたお作りしますね"
"160110360" = "大丈夫。今度また一緒に食べようね"
"160110370" = "えっと……その"
"160110380" = "一緒に食べるのは……"
"160110390" = "カロリーが……ちょっと……"
"160110400" = "いえ、はい……"
"160110410" = "ありがとうございます……"
"160110420" = "先生、こんにちは"
"160110430" = "最近、気になることがありまして"
"160110440" = "先生は、書類仕事など……いわゆるデスクワークを主にされていますよね？"
"160110450" = "ずっと座り続けているのは体によくないと聞きますので、軽く運動でもしてみてはいかがでしょうか？"
"160110460" = "たしかに、運動不足になりがちだもんね。急にどうしたの？"
"160110470" = "ハスミが大運動会で運動に目覚めた……！？"
"160110480" = "あ、えっと……"
"160110490" = "急にすみません……その、もしよろしければ、と……"
"160110500" = "今すぐ運動をしようという意味ではないのですが"
"160110510" = "その、私はしばらく、いつでも大丈夫ですので"
"160110520" = "ご都合の良いときに、ご連絡をいただけたら嬉しいです"
"160110530" = "一緒に運動するところまでは良かったのですが"
"160110540" = "帰りに先生と立ち寄ったカフェで、結構な量のスイーツを食べてしまいましたね"
"160110550" = "これでは運動をした意味が……"
"160110560" = "逆だよ。おいしく食べるために、運動をしてるんだからね！"
"160110570" = "幸せのために努力を頑張ったんだから、いいことだよ！"
"160110580" = "……"
"160110590" = "そ、"
"160110600" = "そうなんでしょうか"
"160110610" = "……そうですね、ふふ。それでいいのでしょう"
"160110620" = "ありがとうございます。また、お願い致しますね"
