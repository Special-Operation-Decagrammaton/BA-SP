[translation]
"100500010" = "こんにちは、先生"
"100500020" = "いかがお過ごしでしょうか？"
"100500030" = "私は元気です。なんたって、梅花園の教官ですから！"
"100500040" = "教官か……ココナも大変だね"
"100500050" = "大変じゃない？"
"100500060" = "大変な時もありますが、大丈夫です"
"100500070" = "何より、すでに私は立派なレディーですから！"
"100500080" = "先生。もしお時間があったら、梅花園を訪問してみませんか？"
"100500090" = "私の教官としての姿を先生にお見せします！"
"100500100" = "先日は無事に帰れましたか？"
"100500110" = "まともな姿をお見せできなくて残念です"
"100500120" = "十分にかっこよかったよ、ココナちゃん"
"100500130" = "立派に教官してたよ、ココナちゃん"
"100500140" = "だから、ココナちゃんじゃないです！"
"100500150" = "私をココナちゃんと呼ぶなら、"
"100500160" = "シュン姉さんもシュンちゃんって呼ぶべきじゃないでしょうか？"
"100500170" = "シュンはそう呼ばれたら喜びそう"
"100500180" = "えっと……それは、どういうことですか？"
"100500190" = "まだ口の中が苦いです……"
"100500200" = "コーヒー、嫌いです……"
"100500210" = "考えてみたんですが"
"100500220" = "必ずしもコーヒーを飲めることが大人というのは違う気がしてきました"
"100500230" = "コーヒーを飲まない大人もいるのではないでしょうか"
"100500240" = "うん。無理に飲む必要はないからね"
"100500250" = "やはりそうですよね！"
"100500260" = "世の中にはどうしても合わない食べ物だってありますし"
"100500270" = "例えば、私とニンジンのように"
"100500280" = "今度はコーヒーに牛乳と砂糖を入れてあげるね"
"100500290" = "牛乳と砂糖ですか……！？"
"100500300" = "そ、それなら考え直してもいいかも……？"
"100500310" = "いいえ、やっぱりいいです"
"100500320" = "私は立派なレディーですから、そんなものは必要ありません"
"100500330" = "ただ私とコーヒーが合わないだけですから"
"100500340" = "じゃあ、私は牛乳と砂糖を入れておいしいコーヒーを飲もうかな"
"100500350" = "ずるいです！"
"100500360" = "大人はみんなずるいです！"
"100500370" = "どう考えても騙されてるに違いないです……"
"100500380" = "ニンジンが美味しくなるわけないです……"
"100500390" = "おいしいニンジンを食べに行こう！"
"100500400" = "ニンジンレストランに行く準備はできた？"
"100500410" = "行かないと……ダメ……ですか……？"
"100500420" = "ううえ……うええ……うえん"
"100500430" = "私が今日死んでしまったら、先生のせいですからね……"
"100500440" = "私を信じて"
"100500450" = "素敵なレディー扱いをするから"
"100500460" = "わかりました"
"100500470" = "先生を……信じます"
