[translation]
"644" = "よお先生、最近は忙しいのか？"
"645" = "ミレニアムでも見かけねえし、タイミングが合ったら久々に来たらどうだ？"
"646" = "あたしも忙しいけど、ちょっと会うくらいの時間は作れるからさ"
"647" = "うん、じゃあ遊びに行くね"
"648" = "そうだね、じゃあ今度行こうかな"
"649" = "はっ、期待しねえで待ってるよ"
"650" = "ったく、来るんだったら先に言ってくれよ。油断してたじゃねえか……"
"651" = "ネルが呼んでくれたんじゃなかったっけ？"
"652" = "遊びに行くって言ったはず……？"
"653" = "あ？そうだったか？"
"654" = "そう言われるとそんな気もしてきたな……"
"655" = "と、とにかくだな！！"
"656" = "っと……なんてーかその……"
"657" = "朝から会えてびっくりしたっていうか……あ、約束は守れよ！？"
"658" = "アカネ……みんなに……連絡頼む……"
"659" = "信じられねえけど……どうやら風邪引いたみたいだ"
"660" = "遅刻するわ……たぶん……"
"661" = "ネル？もしかしてメッセージ送る相手間違えてない？"
"662" = "ネル！？大丈夫！？"
"663" = "よお、先生。あのおかゆ、微妙な味だったぞ"
"664" = "……でも、お見舞いに来てくれてありがとな"
"665" = "この借りは絶対いつか返すから、覚悟しとけよ"
"666" = "早く良くなってね"
"667" = "うん、待ってるね"
"668" = "よお先生"
"669" = "風邪引いたって聞いたけど？"
"670" = "本当なのか？"
"671" = "咳が……熱が……"
"672" = "寒気がする……"
"673" = "はっ、だっせえな。覚悟しとけよ"
"674" = "今からシャーレに行ってやっからな"
"675" = "最近遅刻と欠席のしすぎで、出席日数がギリギリでよぉ……"
"676" = "何か良い方法でもねぇかな……"
"677" = "真面目に出席すればいいと思う"
"678" = "真面目な学生になればいいと思う"
"679" = "そういう正論は今求めてねえ！"
"680" = "なんかこう、都合のいい方法とかねぇのか！？"
"681" = "そんなものはありません"
"682" = "ズルはダメ"
"683" = "……"
"684" = "……まあ、そうだよな"
"685" = "ちっ、わーったわーった！"
"686" = "真面目にやればいいんだろ！"
"687" = "遅刻も欠席もしなきゃいいだけの話だ！"
"688" = "頑張って！"
"689" = "なあ先生"
"690" = "ちょっと良いものでも見たくねえか？"
"691" = "なかなかに悪くねぇもんだぜ？"
"692" = "怪しい……"
"693" = "何それ……？"
"694" = "ははっ！"
"695" = "気になるなら、今晩ミレニアムに来な"
"696" = "損はさせねえからさ"
"697" = "あの場所に行きたいときはあたしに言えよ！一緒に行くから！"
"698" = "一人で行ったらぶっ殺すからな！？"
"699" = "うん、分かった。約束。今日はありがとね"
"100080010" = "よっ、先生"
"100080020" = "暇なんだけどよ"
"100080030" = "今なにしてんだ？"
"100080040" = "何もしてないよ"
"100080050" = "私も暇してる"
"100080060" = "ははっ"
"100080070" = "そうか"
"100080080" = "……おし、暇なんだな？"
"100080090" = "せっかく休みなんだからよ"
"100080100" = "やることもないんだったら、ミレニアムまで来てくれ"
"100080110" = "そういえば"
"100080120" = "さっきの続きだけどよ"
"100080130" = "あ、スカジャンのことな"
"100080140" = "もし欲しくなったらいつでも言ってくれ"
"100080150" = "あたしが探してやるからよ"
"100080160" = "お揃いとかどう？"
"100080170" = "……"
"100080180" = "ばっ"
"100080190" = "変なこと言うんじゃねぇ！！"
