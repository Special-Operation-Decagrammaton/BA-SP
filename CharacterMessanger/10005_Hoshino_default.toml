"223" = "……えっと、あのアクアリウム、一緒に行かない？チケットも2枚だし……"
"224" = "うん、私でよければ"
"225" = "もちろん、ありがとね"
"226" = "……うへへ"
"227" = "……言ったね、先生？"
"228" = "約束したからね？"
"229" = "じゃあ今度、お互いに都合の良い時にでも行こっか。また連絡する～"
"230" = "先生、この間のアクアリウムの話なんだけど"
"231" = "有効期限がもうそろそろだから、今度の週末にでもどう？"
"232" = "問題なければアクアリウムの前で待ち合わせってことで、よろしく～"
"233" = "うん、大丈夫。楽しみにしてるね"
"100050010" = "困ったものだねぇ"
