[translation]
"162" = "先生、もし時間あったら次の休日、対策委員会の教室まで来てくれない？"
"163" = "ちょっと先生に手伝ってほしくって"
"164" = "あと全然関係ないけど、鯨は水中で呼吸を我慢してるんだって、知ってた？"
"165" = "対策委員会の教室だね、了解"
"166" = "知らなかった。確かに哺乳類だもんね"
"167" = "先生、起きたら腰が折れそうなぐらい痛いんだけど……悲鳴を上げてる……"
"168" = "羽毛ってこういうものなの？"
"169" = "やっぱりこの歳だと、柔らかすぎるのはダメか……"
"170" = "ちゃんとしたベッドで寝たほうが良いよ"
"171" = "うーん……あのマットはまた倉庫に逆戻りかなあ……"
"172" = "どうして人間は、朝起きなきゃいけないんだろう……"
"173" = "まぶたが重すぎて地面に落ちそう……先生、助けて……"
"174" = "学生としての定めだから……"
"175" = "頑張って！ホシノならできるよ！"
"176" = "いっそ魚みたいにまぶたが無い方が楽かもしれないね…………むにゃ"
"177" = "先生、知ってた？"
"178" = "深海に住んでる魚には、身体から光を放って身を守るのもいるんだって"
"179" = "それはそれとして、今日も宝探しやるけど来る？"
"180" = "ラジャーです隊長"
"181" = "知らなかった、海の世界は奥が深いね"
"182" = "先生、見てこれ！"
"183" = ""
"184" = "天井に貼ったんだ"
"185" = "すごい、綺麗だね"
"186" = "へっへっへ～、良いでしょ？これは想像以上だったな～"
"187" = "今日は楽しかったよ、プレゼントありがと"
"188" = "じゃ、また次も一緒にどっか行こうね。約束"
"189" = "うん、おやすみ"
"190" = "光に包まれたベッド、ロマンチックだね"
"191" = "うへ～、やっぱり夜中まで起きてると次の日まで引きずるねえ……"
"192" = "歳のせいもあるのかな～"
"193" = "先生もあんまり夜中に出かけたりしちゃダメだよ"
"194" = "お互い気を付けていこうね～"
"195" = "ホシノはどうして夜中まで起きてるの？"
"196" = "そうだね、夜は早く寝るに限るよ"
"197" = "おじさんの方はまあ色々事情があるというか……"
"198" = "というか先生、心配してくれてるの？"
"199" = "おじさん感激しちゃうな～"
"200" = "素行の良くない生徒への注意だよ"
"201" = "素直じゃないなあ先生は、うへへ～"
"202" = "先生、今日のことはみんなには秘密だよ？先生の口が堅いのは知ってるけど"
"203" = "その……色々恥ずかしいし"
"204" = "うへ、じゃあまたね"
"205" = "うん、おやすみ"
"206" = "またね"
"207" = "ちょっと本を買いたいんだけど。先生、一緒について来てくれない？"
"208" = "この辺では買えない本で、遠出しないといけないんだけど……"
"209" = "うん、いいよ。ショッピングモールの方まで行ってみる？"
"210" = "そうしよっか～、アビドスからはちょっと遠いけど"
"211" = "あそこならありそうだしね～"
"212" = "というか、一も二も無くOKなんだね、さっすが先生～"
"213" = "それはもちろん、ホシノの頼みだからね"
"214" = "とりあえず近くで待ち合わせよっか"
"215" = "いや～、びっくりしたよ～"
"216" = "幸運を根性で掴み取ろうとするなんて、さすが先生。おじさん驚きだよ"
"217" = "これぞ大人の力！"
"218" = "……でもよく考えると、そのお金で普通にチケット買えたかもね"
