[translation]
"2101" = "ご機嫌いかがですか、お頭！"
"2102" = "私は百鬼夜行連合学院、「お祭り運営委員会」組のフィーナと申しやす！"
"2103" = "よろしくお願いしやす！"
"2104" = "お頭……？"
"2105" = "お祭り委員会「組」……？"
"2106" = "あっ"
"2107" = "失礼しました"
"2108" = "唐突な自己紹介でした"
"2109" = "まだ色々と慣れていなくて"
"2110" = "ちょっと練習してから、また今度もう一度やらせてください"
"2111" = "とにかく、今度遊びに来てくださいね！！"
"2112" = "今日はすごく楽しかったです、先生！"
"2113" = "先生の言った「フィーナの任侠」が何なのか、まだ分かりませんが"
"2114" = "先生が言ってくれたんだから、間違いありません！"
"2115" = "いつかは私も分かるはずです！"
"2116" = "それではまた会いましょう！！絶対に！！"
"2117" = "先生～～！！助けてくださ～い！HELP！！"
"2118" = "これは先生にしか頼めません！助けて！"
"2119" = "どうしたの？"
"2120" = "何かやっちゃったの？"
"2121" = "それは、メッセージでは説明できません！"
"2122" = "時間があったら来てくれませんか？お願いです！！"
"2123" = "待ってます！！"
"2124" = "本当にありがとうございました、先生！"
"2125" = "今日は先生が選んだ映画を一緒に見たので、"
"2126" = "次はフィーナが選んだ映画もふたりで見ましょう！"
"2127" = "絶対です！絶対ですよ！"
"2128" = "先生、フィーナです！"
"2129" = "この前お伝えしたように、今度は私が選んだ映画を見ましょう！"
"2130" = "チケットもすでに用意しました！"
"2131" = "それでは待ってます！"
"2132" = "よろしくお願いします！"
"2133" = "今日は本当にお疲れ様でした！"
"2134" = "私のせいですみません！そしてありがとうございました！！"
"2135" = "次もまた映画見ましょう！普通の映画館のやつです！"
"160040010" = "先生！いよいよ時が来ました！この時が！"
"160040020" = "「この時」……？"
"160040030" = "はい！"
"160040040" = "私たちはこれまで、多くの時間を共にしました！"
"160040050" = "信頼も積み上がってきています！"
"160040060" = "となれば……アレしかありません！"
"160040070" = "……「アレ」？"
"160040080" = "そうです！"
"160040090" = "では、不肖フィーナ！"
"160040100" = "先生がお越しになるのを、お待ちしております！"
