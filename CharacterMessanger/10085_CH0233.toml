[translation]
"100850010" = "先生"
"100850020" = "ノマドワーカーって言葉、聞いたことある？"
"100850030" = "前にネットで見たような……"
"100850040" = "ノマドワーカーっていうのは、働く場所に囚われず、パソコンを使って仕事する人を指すんだけど"
"100850050" = "最近のデジタル機器は小型化も進んでいるし……"
"100850060" = "ノートパソコンを持ち歩いて、外でコーディングを進めるプログラマーも多いんだって"
"100850070" = "なんかカッコいいね"
"100850080" = "うん。フォーラムでもノマド先で撮った写真が紹介されてたんだけど、景色を楽しみながら作業ができるの、いいなって"
"100850090" = "今度、私も外で作業してみようかな……？"
"100850100" = "あれ、外苦手じゃないっけ？"
"100850110" = "……"
"100850120" = "ちょっと違うよ、先生"
"100850130" = "私は寒暖差が激しくて、ネットが繋がらない環境が嫌いなだけ"
"100850140" = "むしろ、きれいな景色は好きな方"
"100850150" = "せっかくだし……先生も一緒にノマドワーク、やってみない？"
"100850160" = "最近ね"
"100850170" = "生徒の間で「グランピング」が流行っているらしいの"
"100850180" = "グランピング？"
"100850190" = "うん。豪華なキャンプって意味の造語で、キャンプ場に準備されてる道具を使って気軽に楽しめるんだって"
"100850200" = "しかも、テレビやエアコンまで完備されてるところもあるって聞いたよ"
"100850210" = "それは楽しそうだね……"
"100850220" = "一度くらい行ってみたいな……"
"100850230" = "サーバーも欲しいね"
"100850240" = "せっかくなら、自由にインターネットを使いたいし"
"100850250" = "それと24時間営業のコンビニも近くにあってほしい……"
"100850260" = "いっそ、学校の敷地にテントを張ればいいような気がしてきた"
"100850270" = "それはもう、グランピングじゃないよね……？"
"100850280" = "先生、今からミレニアムに来られる？"
"100850290" = "私ひとりじゃ、どうしようもなくて……"
"100850300" = "良ければ手伝ってほしいの"
"100850310" = "もちろん、すぐ行くよ"
"100850320" = "ハレでも解決できない問題って……"
"100850330" = "一体……？"
"100850340" = "そんなに難しい問題じゃないんだけど……"
"100850350" = "あ、来る時は歩きやすい靴でね"
"100850360" = "遠出になるかもしれないから"
"100850370" = "……どういうこと？"
"100850380" = "帰ってから知ったんだけど"
"100850390" = "あの匿名のメール、副部長からだったみたい"
"100850400" = "どうしても私を運動させたかったのかな……"
"100850410" = "チヒロが？"
"100850420" = "珍しいね"
"100850430" = "まったくもう……"
"100850440" = "お詫びの印に、高そうなコーヒーを奢ってくれた"
"100850450" = "まあ今回は、お詫びなんて無くても良かったけど"
"100850460" = "や"
"100850470" = "今のは、無しで"
"100850480" = "先生"
"100850490" = "実は、健康診断の結果が出たの"
"100850500" = "胃があんまり良くない状態なんだって"
"100850510" = "だから、カフェインを減らす必要があるらしくて……"
"100850520" = "……良い機会かも？"
"100850530" = "まあ、悪化してからじゃ遅いから……"
"100850540" = "頭では理解してるんだけど"
"100850550" = "いざ仕事に集中すると、自然に手が伸びて……"
"100850560" = "習慣はそうそう変わらないもんね"
"100850570" = "そこで、カフェインを減らす良い方法を思いついたの"
"100850580" = "でも下準備が必要だから"
"100850590" = "先生、手伝ってくれる？"
"100850600" = "それはもちろん"
"100850610" = "何か必要な物とかある？"
"100850620" = "ありがとう"
"100850630" = "じゃあ今週末、ミレニアムのキャンプ場まで来てくれる？"
"100850640" = "詳しいことは、その時に"
