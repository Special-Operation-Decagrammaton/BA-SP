[translation]
"160120010" = "先生、今日って忙しい？"
"160120020" = "もし時間があったら、私のバイト先に来てくれない？"
"160120030" = "確か……「ルワゾー・ブッレ」、だったっけ？"
"160120040" = "そうそう。っていうか、よく覚えてたわね"
"160120050" = "ちょっと先生に見せたいものがあるの"
"160120060" = "待ってるから、ちゃんと来てね！"
"160120070" = "先生、先生！"
"160120080" = "バイト代が入ったの！"
"160120090" = "ジュンコが頑張ったからだね"
"160120100" = "まぁね！というわけで……"
"160120110" = "お返しの時間よ！"
"160120120" = "……どういうこと？"
"160120130" = "ど、どうか命だけは……"
"160120140" = "ふふっ、見てなさい"
"160120150" = "物騒なこと言わないで！"
"160120160" = "とにかく"
"160120170" = "夕方になったら、お祭り通りに来て"
"160120180" = "絶対よ！"
"160120190" = "連休が"
"160120200" = "終わった"
"160120210" = "終わっちゃった……"
"160120220" = "お、落ち着いて、ジュンコ。連休は一応明日までだよ"
"160120230" = "知ってるわよ！"
"160120240" = "でも私の心の中での連休は死んだ！もういない！"
"160120250" = "私の背中にもこの胸にも、一つになって生き続けてくれない！"
"160120260" = "でもだからって、このまま終わらせるわけにはいかないの！"
