[translation]
"101520010" = "バーン"
"101520020" = "こんにちは、先生"
"101520030" = "バンド界の白雪姫"
"101520040" = "椎名ツムギです"
"101520050" = "し、白雪姫？"
"101520060" = "もちろん、鏡に世界一美しいと言われたわけではありませんが――"
"101520070" = "――「アピール」"
"101520080" = "……は大事ですから"
"101520090" = "ここで、先生に一つ質問です"
"101520100" = "今日は何の日か分かりますか？"
"101520110" = "ツムギの路上ライブの日！"
"101520120" = "ふふ"
"101520130" = "素晴らしい記憶力です"
"101520140" = "やはり先生は、私の期待を裏切りませんね"
"101520150" = "では、お時間がある時にお越しください"
"101520160" = "私はずっと、あの場所でお待ちしておりますので"
"101520170" = "楽しいステージでしたね"
"101520180" = "先生はどうでした？"
"101520190" = "楽しんでいただけましたか？"
"101520200" = "ストレスが吹き飛んだよ！"
"101520210" = "ふふっ、良かったです"
"101520220" = "今なら、毒リンゴを食べて深い眠りについても悔いはありません"
"101520230" = "もちろん、本当に毒リンゴを食べるわけでも"
"101520240" = "深い眠りにつくわけでもありませんが"
"101520250" = "ここではそのような――"
"101520260" = "「表現力」が、大事だから？"
"101520270" = "あら"
"101520280" = "以心伝心ですね"
"101520290" = "それでは、またお会いしましょう"
"101520300" = "その時も、願わくば――"
"101520310" = "平和なひとときとなりますように"
"101520320" = "先日小耳にはさんだのですが……"
"101520330" = "先生はよく夜勤をされているのだとか"
"101520340" = "作業中、睡魔に襲われた時は"
"101520350" = "どうなさっているのですか？"
"101520360" = "公園を散歩したりしてるかな"
"101520370" = "そうなのですね"
"101520380" = "「眠れる森の美女」である私としては"
"101520390" = "運命的なものを感じずにはいられません"
"101520400" = "そ、それはどういう……？"
"101520410" = "ふふっ、何でもありません"
"101520420" = "今日も良い一日をお過ごしください"
"101520430" = "先日はありがとうございました、先生"
"101520440" = "おかげで、誰にも気づかれることなく寮に戻れました"
"101520450" = "こっちもツムギのおかげで、仕事が片付いたよ"
"101520460" = "お互いにウィンウィンというわけですね"
"101520470" = "また夜に抜け出すようなことがあれば"
"101520480" = "先生のところへ伺いますね"
"101520490" = "デスメタルも良いですが"
"101520500" = "その時はもう少し……"
"101520510" = "甘美な曲も、聴いていただきたいです"
"101520520" = "先生、いかがお過ごしですか？"
"101520530" = "毎日、楽しんでいらっしゃいますか？"
"101520540" = "うん、毎日楽しいよ！"
"101520550" = "それはよかったです"
"101520560" = "私も、心躍る毎日を送っています"
"101520570" = "人生は楽しんでこそ、ですからね"
"101520580" = "もちろん、時には気が滅入る日もありますが"
"101520590" = "憂鬱な気分は、早々に手放してしまうのが一番です"
"101520600" = "私もそう思う！"
"101520610" = "ああ、皆が同じように考えることが出来たなら"
"101520620" = "世界はもっと平和になるでしょうに……"
"101520630" = "では今日も、人々の喜びと平和のため"
"101520640" = "ギターを奏でてきます"
"101520650" = "お時間がありましたら、あの公園でお会いしましょう"
"101520660" = "今日は"
"101520670" = "創作意欲の高まりを感じます"
"101520680" = "実は、先生と一緒に行きたい場所があるのですが"
"101520690" = "よろしいでしょうか？"
"101520700" = "もちろん付き合うよ！"
"101520710" = "ではこれから"
"101520720" = "ワイルドハントの美術館に行きませんか？"
"101520730" = "新しい展示会が始まったんです"
