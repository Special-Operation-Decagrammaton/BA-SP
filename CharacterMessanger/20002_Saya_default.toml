[translation]
"1383" = "先生、ちょっとぼく様の研究室に来てくれないか？"
"1384" = "急にどうしたの？"
"1385" = "ぼく様の研究に関係がある、とても大事なことなのだ！"
"1386" = "しかも先生にしか解決できない、特別な問題……！"
"1387" = "そういうわけで、研究室で待ってるのだ！"
"1388" = "……？"
"1389" = "キラキラするの、もう治まった？"
"1390" = "顔がまだキラキラしてて、鏡を見るたびに目が……"
"1391" = "鏡に向き合えないほどの輝きだなんて、素敵なことなのだ"
"1392" = "素敵とかそういうのじゃないんだけど！？"
"1393" = "ところでもしよかったら、肌から剥がれた金箔をひとかけらだけくれない？"
"1394" = "その成分を調査して、次の研究に使ってみようと思ってるのだ"
"1395" = "断る"
"1396" = "ううっ！どうしてなのだ！"
"1397" = "これも錬丹術の発展のために必要なことなのに！"
"1398" = "先生、もう一度研究室に来てくれないか？"
"1399" = "怪しい……"
"1400" = "心配無用、今度こそ本当の不老不死の霊薬が完成したのだ！"
"1401" = "信じられないならぼく様の研究室に来て、直接確かめてみて！"
"1402" = "ぼく様があんなミスをするなんて……ごめん、先生"
"1403" = "こんなことになるなんて、ぼく様もビックリなのだ"
"1404" = "代わりにってわけじゃないけど、"
"1405" = "次に会った時は、玄武商会で美味しいラーメンを奢ってあげるのだ"
"1406" = "……それと、もしよかったら……あのツヤツヤの灰色の毛、少し貰えない？"
"1407" = "断る"
"1408" = "うう……不老不死の、錬丹術の未来が……"
"1409" = "この前はごめんなのだ、先生"
"1410" = "お詫びに美味しいラーメンを奢るから、玄武商会の前で待ってて！"
"1411" = "美味しいラーメン……？"
"1412" = "うん、ぼく様がよく行くお店があるのだ"
"1413" = "すっごく美味しいお店だから、先生も味わったらきっと気に入るはず！"
"1414" = "この間一緒に食べたラーメン、本当に美味しかったのだ"
"1415" = "また今度一緒に、玄武商会に遊びに行こう！"
"1416" = "うん、ぜひ。そういえば、あの薬を渡したヘルメット団は、どうなったの？"
"1417" = "うん……？そういえばそんな奴らもいたっけ……"
"1418" = "まあ、どこかで砂糖でも舐めてるんじゃないか？"
"1419" = "先生、最近暇なんじゃない？"
"1420" = "ずっと仕事で忙しい……"
"1421" = "え～、そんな堅いこと言わないで。面白いボードゲームを手に入れたのだ"
"1422" = "遊んでみたいんだけど、2人用だから相手を探さないといけなくって"
"1423" = "先生も興味があったら、研究室に遊びに来て！"
"1424" = "仕事が終わったら遊びに行くね"
"1425" = "うう、あんな単純なゲームでぼく様が負けるなんて……悔しい！"
"1426" = "次は絶対負けないから！覚悟しておくのだ、先生！"
"1427" = "ゲーム云々じゃなくてチーズへの執着を断ち切らないと無理なんじゃ……？"
"1428" = "先生……今日は先生に、大事な話があるのだ"
"1429" = "大事な話？どんなこと？"
"1430" = "それは……いや、こんな形じゃ言えない……！"
"1431" = "その、すごく大事な話だから……"
"1432" = "今日、シャーレの仕事が終わったら、すぐに研究室に来てくれる？"
"1433" = "先生のこと、待ってるのだ"
"1434" = "先生、さっき昼寝をしてたら、素晴らしい夢を見たのだ"
"1435" = "気が付いたらぼく様の目の前に、巨大なチーズの塊があって……"
"1436" = "チーズをあんなに好きなだけ食べたのは、夢の中でも初めてだったのだ！"
"1437" = "……"
"1438" = "ところで、先生の腕はなんであんなに傷だらけだったのだ？"
"1439" = "野生動物と喧嘩でもした？"
"1440" = "……"
"1441" = "先生先生！大変！大事件なのだ！"
"1442" = "このメッセージを見たらすぐに研究室に来て！"
"1443" = "一緒にネズ助探してくれてありがとう、先生。これからもよろしくなのだ！"
"1444" = "ネズ助が見つかってよかったね"
"1445" = "大したことはしてないよ"
"1446" = "考えてみれば今まで、ネズ助にも先生にも、ひどいことをし過ぎたのだ……"
"1447" = "もうこれからひどい悪戯はしないから……これからもよろしくなのだ！"
"1448" = "うん。これからもよろしくね、サヤ"
