[translation]
"100310010" = "今年一年、私たち便利屋68への温かいご支援とご愛顧を賜り、誠にありがとうございました"
"100310020" = "……？"
"100310030" = "な、なによ！その反応！？"
"100310040" = "ごめん、ちょっとビックリしてた"
"100310050" = "一応送り主の確認を…"
"100310060" = "まっ、まあ良いわ！私は寛大だもの！"
"100310070" = "とにかく堅苦しい挨拶はこれで終わり！"
"100310080" = "さあ先生、今年も残りわずかね"
"100310090" = "年末年始に向けてやることがあるの、だから今日は私に付き合いなさい？"
"100310100" = "ちなみに同業者である先生に、拒否する権利はないわ！"
"100310110" = "……"
"100310120" = "えっと、先生、予定空いてるわよね……？ね……？"
"100310130" = "あらためて言っておこうかしら、あけましておめでとうございます"
"100310140" = "あけましておめでとう"
"100310150" = "今日連絡をしたのは他でもないわ……"
"100310160" = "この間、着物をレンタルしたでしょう？"
"100310170" = "ああ、アルが押されっぱなしだった時の"
"100310180" = "もしあれだったら、一緒にお店に行って返品できないか聞いてみる？"
"100310190" = "違うわよ、そうじゃなくて！というかあの時のあれは、あくまで戦略的な投資よ！"
"100310200" = "ただ今日は、その着物の使い道ができたってことを教えようと思って……！"
"100310210" = "使い道……事務所に飾る、とか？"
"100310220" = "そのためだけに先生を呼ぶわけがないでしょう！？っていうか普通に、分かってて言ってるわよね！？"
"100310230" = "着もしないで飾るなんて悲しすぎるでしょう！"
"100310240" = "……と、とにかく！この着物を着ていく場所ができたのよ！"
"100310250" = "それも着物が相応しい、かなり上品な席……"
"100310260" = "だからその、先生にエスコートをお願いしようと思ったのだけど……どうかしら？"
"100310270" = "も、もちろん私ひとりでも問題無いのだけれど！？"
"100310280" = "……忙しい、かしら？"
"100310290" = "もちろん行くよ"
"100310300" = "そ、そうよね！？やっぱり来てくれるわよね！"
"100310310" = "ふふっ、じゃあ待ってるわよ♪"
"100310320" = "先生、この間話したこと覚えてるわよね？"
"100310330" = "ちょっと遅くなってしまったけれど……"
"100310340" = "せっかくのお正月なのに、先生とお正月らしいイベントにも行けてないでしょう？"
"100310350" = "お互いに忙しかったもんね"
"100310360" = "イベント、周回、アイテム……"
"100310370" = "そうよね？"
"100310380" = "……先生、大丈夫？何の話？"
"100310390" = "まあだからとにかく、その……"
"100310400" = "今日、ちょっと時間をくれないかしら？"
"100310410" = "先生、新年が始まったわね"
"100310420" = "となると、この時期にしか無いイベントをやっておくのも、事業家として為すべきことの一つだと思わない？"
"100310430" = "そう、別に信じているわけではないのだけど"
"100310440" = "ええ決して、断じてそういうわけではないけど"
"100310450" = "私と一緒に、おみくじを引きに行きましょう？"
"100310460" = "……アル、すごくおみくじ信じてる方？"
"100310470" = "その話は良いから！早く来なさい！"
