[translation]
"100320010" = "先生！"
"100320020" = "あらためて、明けましておめでとー！"
"100320030" = "いつの間にお正月だ……"
"100320040" = "うん、明けましておめでとう"
"100320050" = "えー、何その先生のリアクション。つまんな～い"
"100320060" = "しょうがないなぁ……そんなふにゃふにゃな先生でも一気に燃え上がるような"
"100320070" = "「ものすごく楽しいこと」を用意してあげる！"
"100320080" = "ふにゃふにゃ……？"
"100320090" = "「ものすごく楽しいこと」……？"
"100320100" = "じゃあ楽しみにしててね、先生！"
"100320110" = "え、えっ……？"
"100320120" = "ムツキ……？"
"100320130" = "先生って、新年のお願いごともう決めた？"
"100320140" = "もちろん！"
"100320150" = "そういえばまだ……"
"100320160" = "ふーん、そうなんだ"
"100320170" = "先生のお願いごと、気になるな―"
"100320180" = "あ、そうなんだ"
"100320190" = "まあ、今からゆっくり決めれば良いんじゃない？"
"100320200" = "とりあえず先生、行こう！"
"100320210" = "えっと、どこに？"
"100320220" = "せっかくお正月なんだから決まってるでしょ？"
"100320230" = "正月なんだから、正月らしいところに行かないと！"
"100320240" = "ほらほら、早く準備して！先生！"
"100320250" = "先生！羽根つきしよっ！"
"100320260" = "いきなりだね……？"
"100320270" = "この前の敗北の屈辱、思いっきり晴らしちゃうから！"
"100320280" = "さー、尋常に勝負！"
"100320290" = "待ってるからね！早く早く！"
"100320300" = "先生のおかげでお正月、すっごい楽しかった！ありがとね！"
"100320310" = "これから先もずっと"
"100320320" = "私とたーっくさん遊んでね、先生♡"
