[translation]
"101430010" = "先生、渓谷での余暇はいかがですか？"
"101430020" = "大自然、サイコー……"
"101430030" = "ふふ。お楽しみいただいているようで何よりです"
"101430040" = "ところで先生"
"101430050" = "今日は私もそちらでご一緒したいのですが"
"101430060" = "よろしいでしょうか？"
"101430070" = "私、夏って好きなんです"
"101430080" = "どこが好きなの？"
"101430090" = "理由はいくつかありますが……"
"101430100" = "自分の、いつもとは違った一面を"
"101430110" = "表現できる……からでしょうか？"
"101430120" = "ふふ、ですので"
"101430130" = "私のいつもとは違った一面をお見せしたいのですが"
"101430140" = "お時間をいただいてもよろしいでしょうか？"
"101430150" = "昨日はご迷惑をおかけしました……"
"101430160" = "本当に、色々と……"
"101430170" = "やっとシュンが声をかけてくれた……"
"101430180" = "え？"
"101430190" = "言われてみれば、そうですね……"
"101430200" = "あのとき……"
"101430210" = "何も見てない！何も覚えていないよ！"
"101430220" = "……"
"101430230" = "それはちょっと"
"101430240" = "寂しいかもしれません……"
"101430250" = "私は……どうしたらいいのかな……"
"101430260" = "そう、ですね"
"101430270" = "……"
"101430280" = "もしよろしければ"
"101430290" = "先生と一緒にリベンジをしたいのですが……"
"101430300" = "お時間があれば今からでも……よろしいでしょうか？"
"101430310" = "先生にお願いしたいことがあるのですが……"
"101430320" = "よろしければ……"
"101430330" = "聞いていただけますでしょうか？"
"101430340" = "何でもどうぞ！"
"101430350" = "今日、梅花園の子供たちと"
"101430360" = "ウォーターパークに行くことになりまして……"
"101430370" = "一緒に引率していただけませんでしょうか？"
"101430380" = "任せて！"
"101430390" = "ふふ"
"101430400" = "ありがとうございます。先生"
"101430410" = "無事にお帰りになられましたか、先生？"
"101430420" = "う、うん……ただ筋肉痛が……。"
"101430430" = "ふふ"
"101430440" = "水遊びは、思いのほか体力を使いますからね"
"101430450" = "今日は、本当にありがとうございました"
"101430460" = "先生さえよろしければ、ですが……"
"101430470" = "また、このような時間が欲しいです"
"101430480" = "いつでも呼んでね"
"101430490" = "ふふ。ありがとうございます"
"101430500" = "そう言ってくださると思っていました"
"101430510" = "でしたら、次は……"
"101430520" = "二人きりで過ごす機会を設けますね"
