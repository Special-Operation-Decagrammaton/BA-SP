[translation]
"2506" = "主殿。イズナ、最近悩みごとがあって夜眠れないんです……"
"2507" = "悩みごと？"
"2508" = "私で良ければ相談に乗るよ"
"2509" = "さ、さすが主殿……！"
"2510" = "イズナが苦しんでる時は、すぐに答えてくれるんですね！"
"2511" = "……ありがとうございます！"
"2512" = "悩み、解決しました！"
"2513" = "もう解決したの！？"
"2514" = "はい！"
"2515" = "イズナは忍者を目指していますので。"
"2516" = "であれば先生のように素早く対応、まずは悩むより実行！"
"2517" = "ということで、今日からさらに忍者らしく！"
"2518" = "まずは実践することにします、ニンニン！"
"2519" = "危ないことをして怪我しないようにね。"
"2520" = "えへへっ、はい！"
"2521" = "イズナ、先日の主殿からの忠告、心に深く刻みました"
"2522" = "忠告？何の話だっけ……？"
"2523" = "この前、主殿が仰っていた……"
"2524" = "無断での尾行は良くないというお話です！"
"2525" = "ごめん、覚えてないかも……？"
"2526" = "そういえばそんなこともあったね……"
"2527" = "あの時主殿よりしかと頂いたお言葉を、あらためて勘考しました"
"2528" = "イズナ、今後は主殿をこっそり護衛することはやめます！"
"2529" = "あっ、うん……"
"2530" = "代わりに今日からは、主殿の前で護衛しますね！"
"2531" = "ではまた！"
"2532" = "うん……？"
"2533" = "主殿！主殿！"
"2534" = "速報です！特報です！一大事です！"
"2535" = "そんなに興奮して、どうしたの？"
"2536" = "イズナの大好きな名作、忍者の時代劇シリーズをついに手に入れました！"
"2537" = "時代劇って、昔のドラマ？"
"2538" = "はい！"
"2539" = "これ、なかなか手に入らない名作なんです！"
"2540" = "一緒に見てくれますよね！主殿！"
"2541" = "イズナの家で鑑賞会をしましょう！"
"2542" = "うん、じゃあお邪魔しようかな"
"2543" = "あ、ありがとうございます！"
"2544" = "えへへっ！ではお待ちしてますね！"
"2545" = "主殿と、忍者についてさらに知ることができて嬉しかったです！"
"2546" = "次はイズナも、さらに完璧な忍者になった状態でお会いできますね、主殿！"
"2547" = "そ、そうだね……？"
"2548" = "忍者にとって一番大事なこと……"
"2549" = "それは普段から休むことなく、常在戦場の心持ちで修行を続けることだと思います！"
"2550" = "確かに、鍛錬は大事だからね"
"2551" = "健康な体には、健全な精神が宿るっていうからね"
"2552" = "はい、その通りかと！"
"2553" = "真の忍者になるために……"
"2554" = "普段から歩いている時も、ご飯を食べている時も"
"2555" = "ぐっすり眠っている時でも、絶えず鍛錬の姿勢と心意気を崩さないこと！"
"2556" = "寝てる時も！？"
"2557" = "はい！そうです！一日中ですので！"
"2558" = "ですので、主殿……！"
"2559" = "さらに忍者の道を追求するため、イズナの修行に付き合ってくれませんか！"
"2560" = "うん。まだよく分かってないけど、良いよ"
"2561" = "やった！ありがとうございます！"
"2562" = "今日は修行に付き合ってくださって、ありがとうございました！主殿！"
"2563" = "どういたしまして。ところで、今日のって結局修行というか……"
"2564" = "あっ、時代劇が始まってしまいます！"
"2565" = "それではまた後程！"
"2566" = "ニンニン！"
"2567" = "う、うん。また後で……"
