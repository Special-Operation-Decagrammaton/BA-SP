[translation]
"200210010" = "先生、実は悩みがあるんです"
"200210020" = "なるほど……それは、私が聞いても良いやつ？"
"200210030" = "はい、先生になら！"
"200210040" = "ですが、迷惑になってしまわないかと……"
"200210050" = "生徒の悩みを聞くことも、先生の役目だから"
"200210060" = "では、お願いしてもいいですか？"
"200210070" = "今からすぐ会いに行きますね！"
"200210080" = "悩むのは辛いですが、良いものでもあると思うんです！"
"200210090" = "乗り越えると、自信に繋がりますし！"
"200210100" = "確かにそうかも。"
"200210110" = "ところで、どうして突然「悩み」の話を……？"
"200210120" = "ずっと悩んでいたことについて、自分なりに結論が出せたんです"
"200210130" = "先生にもお見せしますので、楽しみにしていてください！"
"200210140" = "先生！"
"200210150" = "編み物って、楽しいと思いません？"
"200210160" = "編み物……靴下とか？"
"200210170" = "はい、準備をしてまして"
"200210180" = "毎年この時期になると作るんです"
"200210190" = "なるほど……？"
"200210200" = "あ、そうだ！"
"200210210" = "先生、私の部屋に来てくれませんか？"
"200210220" = "ぜひ共犯になりましょう！"
"200210230" = "共犯！？"
"200210240" = "先生、先生！"
"200210250" = "見てください！サンタさんからのプレゼントです！"
"200210260" = "それに、牛乳とクッキーも全部食べてくれました！"
"200210270" = "サンタさんに会えなかったのは残念ですけど……"
"200210280" = "それでも、プレゼントのお礼ができたみたいで嬉しいです。えへへっ！"
"200210290" = "うん、良かったね"
"200210300" = "ところで、プレゼントで消毒薬をくれたということは……"
"200210310" = "今後も患者さんたちの治療のために、より一層消毒に励んでほしいという意味ですよね？"
"200210320" = "患部の切断は大変ですし、こうなったらやはり火を使って"
"200210330" = "そういう意味じゃないと思うよ！？"
"200210340" = "あの、先生……"
"200210350" = "ちょっと大事な用があって"
"200210360" = "先生に助けていただきたいんですが"
"200210370" = "今って大丈夫ですか……？"
"200210380" = "もちろんだよ、どうしたの？"
"200210390" = "それが……"
"200210400" = "うーん、メッセージだとうまく伝えられるか自信が無くって"
"200210410" = "でも……"
"200210420" = "大事な用なんだよね？"
"200210430" = "はい……"
"200210440" = "とっても大事な用です"
"200210450" = "ただ、大事ではあるんですが……"
"200210460" = "それじゃあ、会って話そうか"
