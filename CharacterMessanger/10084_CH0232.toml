[translation]
"100840010" = "この間、雑誌で……"
"100840020" = "「運動不足気味なカップルにオススメ！ライトな運動10選」という特集で"
"100840030" = "登山が1位になっていました"
"100840040" = "……登山？"
"100840050" = "登山は他のスポーツと比べて"
"100840060" = "練習や特別な準備の必要がないため始めやすく"
"100840070" = "2人きりで会話する時間が多く取れるからだそうです"
"100840080" = "なるほど……"
"100840090" = "言われてみればそうかも"
"100840100" = "はい、ですので……"
"100840110" = "次の週末が楽しみです"
"100840120" = "次の週末……？"
"100840130" = "……えっと、コタマさん？"
"100840140" = "たしかに副部長の言う通り……"
"100840150" = "もう少し体力があった方が良いかもしれません"
"100840160" = "それは良い考えだけど……"
"100840170" = "……急にどうしたの？"
"100840180" = "ハッカーとして活動するためには、ある程度の体力も必要ですからね"
"100840190" = "前回の登山で思い知らされたんです……"
"100840200" = "チヒロ副部長のように、急な崖も軽々と登れるような体力を身に付けられたら……"
"100840210" = "盗聴の待機場所にも幅が出るはずです"
"100840220" = "……なんて返したらいいんだろうね"
"100840230" = "先生、今週末は空いてますか？"
"100840240" = "特に予定は無いけど……"
"100840250" = "それなら、二人で山に行きませんか？"
"100840260" = "……前回のリベンジをしたいのです"
"100840270" = "私は構わないけど……"
"100840280" = "一応マッチ持っていこうか？"
"100840290" = "いえ、大丈夫です"
"100840300" = "今度こそ人為的な要素を全て排除した……"
"100840310" = "自然そのものを録音する予定ですから"
"100840320" = "前回の山で録音した音源を確認していたのですが……"
"100840330" = "どうやら一部ノイズが入っていたようで……"
"100840340" = "もう一度、行く必要があります"
"100840350" = "私の声が入っちゃってたとか……？"
"100840360" = "いえ、そうではなく……"
"100840370" = "むしろ先生の声が入っていたら、色々と使い道が……"
"100840380" = "あ"
"100840390" = "コタマは相変わらずだね……"
"100840400" = "また用があるなら一緒に行こうか"
"100840410" = "はい？"
"100840420" = "先生も何か山に用事があるのですか？"
"100840430" = "いつも中腹で戻ってたから……"
"100840440" = "今度は一緒に山頂まで登ってみようかなって"
"100840450" = "はい"
"100840460" = "……はい？"
