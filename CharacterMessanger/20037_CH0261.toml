[translation]
"200370010" = "監察官！"
"200370020" = "今どこ？忙しい？"
"200370030" = "監察官……？"
"200370040" = "のんびりしてるよ"
"200370050" = "細かいことは良いの！"
"200370060" = "至急、パーク内のフードコートに来て"
"200370070" = "市民の安全に関わることだから！急いでね！"
"200370080" = "……？"
"200370090" = "今日の任務は、パークのパトロールだって"
"200370100" = "結構楽しそうじゃない？"
"200370110" = "フブキって仕事が嫌いだったよね……？"
"200370120" = "何を言ってるのさ、先生"
"200370130" = "人々の安全を守るためなんだから、喜んでやるに決まってるでしょ"
"200370140" = "何か怪しいような……"
"200370150" = "大丈夫大丈夫、真面目にやるってば"
"200370160" = "パークをぐるぐる回りながらね"
"200370170" = "ぐるぐる……？"
"200370180" = "ひどいよ、先生……"
"200370190" = "本当に歩いてパトロールさせるだなんて"
"200370200" = "大げさだなあ"
"200370210" = "元々そういう仕事でしょ？"
"200370220" = "夏の日差しは大敵なのに！"
"200370230" = "ま、先生が奢ってくれたアイス、美味しかったし"
"200370240" = "先生と一緒だったら"
"200370250" = "たまには真面目にパトロールするのも悪くないかもね"
"200370260" = "私だけのパラダイスを見つけたよ"
"200370270" = "誰にも邪魔されない、安息の地……"
"200370280" = "これで、ようやく気ままに過ごせるね"
"200370290" = "隠れ家でも作ったの？"
"200370300" = "サボり場所を見つけたんだね"
"200370310" = "先生も見にくる？"
"200370320" = "あっ、でもプールには入らないでね"
"200370330" = "監視対象が増えるとめんどくさいからさ"
"200370340" = "ウォーターパークなのに……？"
