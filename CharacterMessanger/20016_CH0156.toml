[translation]
"200160010" = "先生、今はシャーレにいるんですか？"
"200160020" = "うん、そうだよ。どうしたの？"
"200160030" = "そうですか"
"200160040" = "……イロハ？"
"200160050" = "それでは今日もサボりに"
"200160060" = "ではなく、お仕事のことでお伺いしますね"
"200160070" = "……イロハさん、隠す気ないですよね？"
"200160080" = "先生、今日もお仕事でしょうか？"
"200160090" = "膨大な量の作業が……"
"200160100" = "まあ、お気持ちは理解できます"
"200160110" = "片付けたと思ったらまた出てくるわ、誰かがやるかと思いきや誰も手を付けないわ"
"200160120" = "大変ですよね、中間管理職"
"200160130" = "ところで"
"200160140" = "今日は苦いのが飲みたい気分ですね"
"200160150" = "濃い目のアメリカーノでお願いします"
"200160160" = "イロハ、上にあるメッセージ見てくれた？"
"200160170" = "はい、もちろん"
"200160180" = "それではまた後で"
"200160190" = "文脈が読めてないのは私なのかな……"
"200160200" = "やってられません"
"200160210" = "イロハ、どうしたの？"
"200160220" = "いえ、大したことではありませんが……"
"200160230" = "なぜ人はこんなに忙しく動かねばならないのだろう、と……"
"200160240" = "先生、我々はここまでして生きる意味があるのでしょうか？"
"200160250" = "話が急にすごい重くなったけど、あると思うよ！？"
"200160260" = "めんどくさいですが、やるしかありませんね……"
"200160270" = "もう文字を打つのもめんどくさいです"
"200160280" = "が、頑張って……"
"200160290" = "先生、今お忙しいですか？"
"200160300" = "暇だよ"
"200160310" = "今日も来るの？"
"200160320" = "いえ、今日は少し立て込んでいて"
"200160330" = "シャーレに寄るのは難しいので……"
"200160340" = "来るときは、アメリカーノを一杯お願いします"
"200160350" = "え……？"
"200160360" = "コーヒー、ごちそうさまでした"
"200160370" = "お粗末様でした！？"
"200160380" = "久しぶりにその本を開いたら……"
"200160390" = "ふと思い出してしまって"
"200160400" = "今日のコーヒーの味を"
