[translation]
"100860010" = "先生、少し相談があるのだけど"
"100860020" = "よし、今すぐ出動だ！"
"100860030" = "う、うん？出動……？"
"100860040" = "どこに行けばいい？"
"100860050" = "出動って、会いに来てくれるって意味だったの？"
"100860060" = "ふふっ、先生らしいね"
"100860070" = "今日は私がシャーレに行くわ"
"100860080" = "じゃあ後でね、先生"
"100860090" = "先生、この間の約束だけど……"
"100860100" = "うん、ドレスを買いに行くんだよね！"
"100860110" = "ショッピング、楽しみだね！"
"100860120" = "ふふ……そんなに張り切ってもらえるなんて、嬉しい"
"100860130" = "それで、ドレスを買う場所なのだけど"
"100860140" = "ゲヘナには、風紀委員をあまり良く思っていない人たちも多いでしょう"
"100860150" = "こっちのショッピングモールだと、落ち着いて買い物できないかもしれなくて……"
"100860160" = "だから……"
"100860170" = "なら、ゲヘナの外で見よっか？"
"100860180" = "うん、待ち合わせ場所は送っておくわ"
"100860190" = "待ってるね、先生"
"100860200" = "先生、明日は空いてる？"
"100860210" = "ゲヘナのパーティーが終わったから、少し余裕ができて"
"100860220" = "良かったら、先生に会いたいのだけど……"
"100860230" = "ヒナの予定が空くなんて珍しいね！"
"100860240" = "絶対、会いに行くよ！"
"100860250" = "ふふ、大げさね"
"100860260" = "じゃあ、パーティー会場で待ってるわ"
