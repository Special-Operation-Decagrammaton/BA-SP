[translation]
"1882" = "お久しぶりです、チナツです。私のこと覚えていますか"
"1883" = "この前はバタバタしていて、きちんとご挨拶ができませんでしたので"
"1884" = "そのうち、あらためてご挨拶をする機会がありましたら嬉しいです"
"1885" = "～チナツ～"
"1886" = "今日は本当にありがとうございました、先生"
"1887" = "このご恩はどうお返しすればいいのか……"
"1888" = "いつか絶対に、お返しさせてください"
"1889" = "……で、では"
"1890" = "これからもよろしくお願いします　～チナツ～"
"1891" = "こんにちは、先生"
"1892" = "前回のお返しのこともありますし、"
"1893" = "できればもう一度お会いしたいのですが……"
"1894" = "お時間は大丈夫でしょうか？"
"1895" = "チナツのお呼びとあらば24時間いつでも！"
"1896" = "この日を！この日を待っていた……っ！"
"1897" = "え、っと……"
"1898" = "すみません、ちょっと引きました"
"1899" = "いえその、嫌ということではないのですが……"
"1900" = "……"
"1901" = "えっと、後ほど場所をお伝えしますので。そこでお待ちしております"
"1902" = "～チナツ～"
"1903" = "今日は本当にありがとうございました、先生"
"1904" = "この気持ち、どうやってお伝えすれば良いのか分からないくらいです"
"1905" = "その……"
"1906" = "……いえ"
"1907" = "すみません、何でもありません"
"1908" = "ありがとうございました、ではまた　～チナツ～"
"1909" = "こんにちは、先生"
"1910" = "もしよかったら、先生のご都合が良いお時間帯を教えていただけませんか？"
"1911" = "個人的に相談したいことがありまして"
"1912" = "今日の仕事が終わった頃とかどう？"
"1913" = "今すぐでも大丈夫！"
"1914" = "承知しました、ではそれでお願いします"
"1915" = "お時間いただきありがとうございます"
"1916" = "お伺いしますね　～チナツ～"
"1917" = "疲れたと感じた時には、いつでも連絡してください"
"1918" = "いえ、"
"1919" = "これは疲れそうだなと思うようなことがありましたら、私を呼んでください"
"1920" = "また疲労が溜まってしまわないよう、私もお手伝いしますので"
"1921" = "それではまた　～チナツ～"
"260000010" = "先生、おはようございます。チナツです"
"260000020" = "近頃は、お忙しいでしょうか？"
"260000030" = "実は、お願いしたいことがありまして……"
"260000040" = "どうしたの？"
"260000050" = "これは、まさか……！？"
"260000060" = "大したことではないのですが"
"260000070" = "いえ"
"260000080" = "その"
"260000090" = "そういう類では無いと言いますか"
"260000100" = "えっと……"
"260000110" = "お仕事のご相談、です。書類作業のお手伝いをお願いできればと思いまして"
"260000120" = "ちょっとひとりで行うには量が多くて……"
"260000130" = "もちろん、お忙しいようでしたら無理にとは言えないのですが"
"260000140" = "大丈夫、すぐに行くね"
"260000150" = "あ"
"260000160" = "えっと、それほど急がなくても大丈夫ですので"
"260000170" = "ありがとうございます　～チナツ～"
"260000180" = "今日は本当にありがとうございました"
"260000190" = "先生に来ていただけてなかったら、終わってなかったと思います"
"260000200" = "その"
"260000210" = "もし"
"260000220" = "もしよろしければ、なのですが……"
"260000230" = "また何かあれば、お願いをしてもよろしいでしょうか？"
"260000240" = "うん、もちろん"
"260000250" = "ありがとうございます"
"260000260" = "その時は、きちんと別の場所を"
"260000270" = "あ"
"260000280" = "えっと"
"260000290" = "……"
"260000300" = "すみません"
"260000310" = "その"
"260000320" = "……"
"260000330" = "同じ場所で、大丈夫です"
"260000340" = "先生、いかがお過ごしですか？"
"260000350" = "私は今日、久しぶりのお休みでして……"
"260000360" = "私も休み！"
"260000370" = "今日は羽目を外すんだ……！"
"260000380" = "ふふ"
"260000390" = "それはよかったです"
"260000400" = "……"
"260000410" = "……ほどほどにしてくださいね"
"260000420" = "突然のメッセージ、失礼しました"
"260000430" = "良い一日を　～チナツ～"
"260000440" = "お疲れ様でした、先生"
"260000450" = "お休みの日なのに、お仕事をさせてしまいましたね……"
"260000460" = "おかげで、充実した休日になったよ"
"260000470" = "体力は使ったけど、気力が回復した！"
"260000480" = "そうでしたか"
"260000490" = "では、次の休日は体力の回復に当てましょう"
"260000500" = "ふふっ"
"260000510" = "近いうちに、お伺いします　～チナツ～"
