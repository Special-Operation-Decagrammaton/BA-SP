[translation]
"100230010" = "先生、ひとつお願いしても良い？"
"100230020" = "もちろん、何でも言って"
"100230030" = "うん、何をすれば良い？"
"100230040" = "今度ゲヘナに来るときに、日焼け止めを買ってきて欲しくて"
"100230050" = "ずっと使ってたのが無くなっちゃったから、合宿前に買おうと思ってたんだけど"
"100230060" = "思ったよりも委員会の仕事が忙しくって……"
"100230070" = "大丈夫、任せて"
"100230080" = "「シーサイド」の日焼け止めだよね？"
"100230090" = "うん、それで合ってる"
"100230100" = "じゃあ、よろしく"
"100230110" = "……準備はできたか？"
"100230120" = "念押しになるけど、絶対に他の生徒には言うなよ！"
"100230130" = "……イオリ？"
"100230140" = "これ私に送るメッセージで合ってる？"
"100230150" = "……は？"
"100230160" = "ｊぐぁｋｌｆ"
"100230170" = "やっ、何でもない！"
"100230180" = "今送ったメッセージのことは忘れて！"
"100230190" = "そう言われると、尚更気になる……"
"100230200" = "その……泳ぎの練習、付き合ってくれてありがと。先生"
"100230210" = "おかげで、お世辞にも習得したとは言えないけど、何とか泳げるくらいにはなったし……"
"100230220" = "これで合宿に浮き輪を持っていかずに済むかも"
"100230230" = "それは良かった。ところでイオリ"
"100230240" = "……何？"
"100230250" = "浮き輪に描かれてたけど、イオリはアヒルさんが好きなの？"
"100230260" = "うるさい！死ねっ！"
"100230270" = "先生、今どこ？"
"100230280" = "連絡が入ったんだけど、どうやら海の家の近くでチンピラたちが暴れてるらしい"
"100230290" = "ゲヘナの風紀委員会として、放っておくわけにはいかない"
"100230300" = "ただ相手の数も分からないし、他の風紀委員も動けないから、先生も来てほしい"
"100230310" = "あ、海に落ちるかもだし、水着の方が良いと思う！"
"100230320" = "え、待って待って！？"
"100230330" = "先生。さっきフロントで、半日以上戻ってきてないって聞いたんだけど……"
"100230340" = "今はどこにいるんだ？"
"100230350" = "砂浜に"
"100230360" = "砂浜？砂浜で一体何を……？"
"100230370" = "ただ横になってる"
"100230380" = "は……？どうして？"
"100230390" = "いや、言わなくて良い。分かった"
"100230400" = "手錠を探してすぐ行くから、そこから動かないで"
"100230410" = "待って、何を想像してるの？"
"100230420" = "先生、緊急事態だ"
"100230430" = "どうしたの？"
"100230440" = "浜辺の食堂で不良生徒が暴れてて……"
"100230450" = "一度取り締まったのに……はぁ……"
"100230460" = "ちょっと手が足りないから、先生に指揮をお願いしたいんだ"
"100230470" = "分かった、どこに向かえばいいかな？"
