[translation]
"160180010" = "突然のご連絡失礼いたします"
"160180020" = "シャーレの先生のご連絡先で、お間違いないでしょうか？"
"160180030" = "そうですが……"
"160180040" = "ラブ？"
"160180050" = "なんだ、合ってるじゃない。よかった"
"160180060" = "丁寧なラブってなんだか新鮮だね"
"160180070" = "スクショ撮っとかなきゃ！"
"160180080" = "はぁ？"
"160180090" = "うちってそんな失礼な奴だと思われてたの？"
"160180100" = "最低限のマナーくらいあるわよ"
"160180110" = "まあいいわ"
"160180120" = "さっきシャーレの前を通った時に"
"160180130" = "そういえばモモトーク交換してたことを思い出したの"
"160180140" = "まあ忙しいだろうし、シャーレにいないかもしれないけど"
"160180150" = "それじゃまた"
"160180160" = "ってまさか……あれって先生じゃないわよね？"
"160180170" = "ちょ"
"160180180" = "シャーレに初めて行ったけど、不思議な感じ"
"160180190" = "いいものを見せてもらったわね"
"160180200" = "楽しんでくれたならなにより"
"160180210" = "……まさか、仲良くなるなんてね"
"160180220" = "……"
"160180230" = "仲良くなった、は言い過ぎか"
"160180240" = "とにかく、楽しかったわ"
"160180250" = "毎日遊びに来てほしいくらいだよ"
"160180260" = "いつでも歓迎！"
"160180270" = "調子いいんだから"
"160180280" = "……"
"160180290" = "言ったわね？"
"160180300" = "先生、今大丈夫かしら"
"160180310" = "ああ、忙しいなら気にしないで"
"160180320" = "こんにちは、ラブ"
"160180330" = "どうしたの？"
"160180340" = "今日はやけに落ち着いてるじゃない"
"160180350" = "さっき、先生を見かけたんだけど"
"160180360" = "疲れてるように見えたわよ。ちゃんと寝"
"160180370" = "この足音……また走ってきてる！？"
"160180380" = "先生って"
"160180390" = "いつもあんなこと言ってるの？"
"160180400" = "冗談抜きに？"
"160180410" = "もちろん！"
"160180420" = "いつもそう思ってるからね！"
"160180430" = "はぁ、いいわもう"
"160180440" = "でも、うちの子たちの前では言わないでよ？"
"160180450" = "もちろん"
"160180460" = "他の子の前でもね。もし言ったら"
"160180470" = "あ、これは"
"160180480" = "他の子にあんなこと言わないように、って意味じゃなくて！"
"160180490" = "あーもう！なんでもない！！"
"160180500" = "先生、私だけど"
"160180510" = "今どこにいるかはともかく、走ってないわよね？"
"160180520" = "とりあえずロビーまで走ったけど……"
"160180530" = "もしかして、先生って結構バカ？"
"160180540" = "まあいいわ。この前、ブラックマーケットでいいものを見つけたんだけど"
"160180550" = "あ、危険なやつじゃなくて、役に立つものよ"
"160180560" = "もしかしたら先生の役に立つかもって"
"160180570" = "？"
"160180580" = "また走ってる？"
"160180590" = "ねえ"
"160180600" = "先生？"
"160180610" = "先生"
"160180620" = "あの自販機おかしいわ"
"160180630" = "うち、リンゴジュースにしたんだけど"
"160180640" = "パインみたいな味がする"
"160180650" = "傷んでるのかしら？先生は大丈夫？"
"160180660" = "お腹とか壊してない？"
"160180670" = "私のパインジュースはリンゴの味がするよ"
"160180680" = "そう？変ね……"
"160180690" = "ってちょっと！？"
"160180700" = "先生、いま暇？"
"160180710" = "暇じゃなくてもちょっと来て！"
"160180720" = "えっ、何かあったの！？"
"160180730" = "いえ、ただの散歩のお誘いよ"
"160180740" = "近くを通りがかったから、何してるかなって"
"160180750" = "あ、今忙しいのかしら"
"160180760" = "それなら大丈夫……さっきのは冗談よ"
"160180770" = "いま仕事なくなったとこ"
"160180780" = "今日の分の書類、全部食べちゃった"
"160180790" = "あんた、ほんとに大人！？"
"160180800" = "じゃあ来れるってことでいいのかしら"
"160180810" = "下で待ってるわよ？"
"160180820" = "走らずに歩いてきて！？"
"160180830" = "あー……遅かったわね"
"160180840" = "調べたわよ！？"
"160180850" = "あそこは下水じゃなくて、雨水が流れ込む排水溝！"
"160180860" = "ただの雨水だから！！"
"160180870" = "汚い水じゃないから！！"
"160180880" = "いや、私は何も……"
"160180890" = "せっかくいい事したのに、もう！"
"160180900" = "優しいラブ、本当にかっこよかった！"
"160180910" = "もし気になるなら、私も排水溝でジャブジャブしてくるよ！"
"160180920" = "神聖なジャブジャブの名をそんなことで使うな！！"
"160180930" = "あと、排水溝じゃないってば！"
"160180940" = "褒めてくれるのは嬉しいけど！"
"160180950" = "……"
"160180960" = "それと、今日見たもの、うちの子たちに言わないでよ？"
"160180970" = "分かったわね！？"
