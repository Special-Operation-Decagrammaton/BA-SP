[translation]
"100490010" = "こんにちは、先生。杏山カズサです"
"100490020" = "あー……"
"100490030" = "もしかして、今忙しいかな？暇な時にお返事もらえたら"
"100490040" = "それでは、お待ちしています"
"100490050" = "親しみのある話し方をするね"
"100490060" = "敬語とタメ口が混ざってる……？"
"100490070" = "……なに"
"100490080" = "先生に送るトークだし、たまに敬語のほうがいいかなって思う時があるだけ"
"100490090" = "とにかく……返事してくれてるなら、時間は大丈夫みたいだね。よかった"
"100490100" = "先生は忙しいだろうし、私がシャーレの近くに向かうね"
"100490110" = "それじゃあ、後でまた連絡します"
"100490120" = "先生、無事帰れた？"
"100490130" = "私はちゃんと部屋に戻れたよ。ちょうど今からシャワー浴びようかなと"
"100490140" = "あ……"
"100490150" = "なんでこんな事わざわざ言っちゃったんだろ、私"
"100490160" = "うーーー……"
"100490170" = "……まあ、気にしないで。何だか言ったほうがいいかなって思っただけだから"
"100490180" = "とにかく今日は、本当にありがとうございました！"
"100490190" = "じゃあ"
"100490200" = "またね、先生"
"100490210" = "疲れた"
"100490220" = "先生、今仕事？"
"100490230" = "仕事中だけど……"
"100490240" = "カズサはまだ外？"
"100490250" = "あ、まぁそうだね……"
"100490260" = "今日は溜めてた分を一気に復習しようと思って、遅くまで学校にいたから"
"100490270" = "そろそろ帰ろうと思って"
"100490280" = "帰り道、暇だから送ってみた。別に深い意味はないよ"
"100490290" = "それじゃあ良い一日を"
"100490300" = "あ、"
"100490310" = "先生"
"100490320" = "……"
"100490330" = ""
"100490340" = "写真？"
"100490350" = "無事に帰れたの？"
"100490360" = "うん、まあ"
"100490370" = "とりあえず、もう遅いし"
"100490380" = "そういう事"
"100490390" = "あの時間まで先生と一緒にいたから"
"100490400" = "無事着きましたぐらい、しっかり報告しておこうかなって"
"100490410" = "けど写真撮るのはあんま慣れてないから、ちょっと表情が……汗"
"100490420" = "だから"
"100490430" = "見たら消してね"
"100490440" = "じゃあまた"
"100490450" = "先生、今もしかして忙しい？"
"100490460" = "だったら大丈夫なんだけど"
"100490470" = "この前の続きだけど……すごく好きなスイーツとかある？"
"100490480" = "好きなスイーツ？"
"100490490" = "もしかして買ってきてくれるの？"
"100490500" = "あー、やっぱちょっと急だったかな"
"100490510" = "？？？何のこと？"
"100490520" = "あー、まぁ。気が向いたら買うかもね？"
"100490530" = "ほら……せっかく買っても、好みから外れたら困るじゃん"
"100490540" = "んー……"
"100490550" = "やっぱこの話終わり"
"100490560" = "今のは聞かなかったことにして"
"100490570" = "先生、もしかして"
"100490580" = "今、席にいる？"
"100490590" = "うん。いるよ"
"100490600" = "どうしたの？"
"100490610" = "いや、大したことじゃなくて"
"100490620" = "席にいるならいいよ"
"100490630" = "ちょっと入るよ"
"100490640" = "あの、先生"
"100490650" = "念のためもう一度言うけど"
"100490660" = "本当に「処理」なんかじゃないからね"
"100490670" = "でも、今度はちゃんと先生の分を選んで持って行くから"
"100490680" = "早速その二つの言葉が矛盾していますが"
"100490690" = "大丈夫、おいしかったよ"
"100490700" = "……そう"
"100490710" = "うーん……"
"100490720" = "あと、最後に"
"100490730" = "その、やっぱ"
"100490740" = "からかってたんだよね？猫のくだり"
"100490750" = "さあ、どうだろうね"
"100490760" = "結局ばれちゃったね"
"100490770" = "……"
"100490780" = "サイテー……"
