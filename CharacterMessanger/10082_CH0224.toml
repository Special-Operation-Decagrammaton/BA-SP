[translation]
"100820010" = "先生、聞いてくれ"
"100820020" = "不破レンゲ、なんと人生最大の危機に陥っているんだ！"
"100820030" = "急に何のことやら……"
"100820040" = "レンゲ、どうかしたの？"
"100820050" = "ここ数日、ずっと考えていたんだけど"
"100820060" = "アタシ、気づいてしまったんだ"
"100820070" = "このままじゃ、何もかも終わりかもしれなくて！"
"100820080" = "ごめん、どういう事！？"
"100820090" = "ええっと……やっぱりモモトークじゃ説明が難しいな……"
"100820100" = "こういうのは直接話さないとだよね！"
"100820110" = "それは構わないけど……"
"100820120" = "先生、それでなんだけど……"
"100820130" = "頼む、相談に乗って！"
"100820140" = "もちろんだよ"
"100820150" = "本当！？"
"100820160" = "じゃあ待ってるから！"
"100820170" = "先生……"
"100820180" = "いや、師匠！"
"100820190" = "師匠って呼ばれると、ちょっとむず痒いね……"
"100820200" = "まだ慣れてないのか？"
"100820210" = "もうアタシたちは師弟だろ！"
"100820220" = "胸を張っていこう！"
"100820230" = "はい……"
"100820240" = "よし、こうしちゃいられない。さっそく青春活動を始めよう"
"100820250" = "今日から直接、師匠の教えを受けるわけだ"
"100820260" = "立派な青春を送ってみせる！"
"100820270" = "一点の曇りもない、力強い宣言……！"
"100820280" = "その調子だよ、レンゲ！"
"100820290" = "よっし！調停室に集合だ、師匠！"
"100820300" = "先生、家でじっくり考えたんだけど"
"100820310" = "やっぱり先生は先生だから"
"100820320" = "転校生役は無理があったような……"
"100820330" = "今さら……？"
"100820340" = "ま、まぁ、関係性は転校生だけじゃないし！"
"100820350" = "次は新しい関係性を試してみよう！"
"100820360" = "うん、いつでも呼んでね"
"100820370" = "また次も楽しみにしてるよ"
"100820380" = "ありがとう、先生！"
"100820390" = "うーん、青春の定番といえば"
"100820400" = "やっぱり「アレ」は欠かせないなぁ"
"100820410" = "どうして今まで忘れてたんだ……"
"100820420" = "「アレ」……？"
"100820430" = "それは一体どういう……？"
"100820440" = "それはだな"
"100820450" = "……"
"100820460" = "うーん……"
"100820470" = "いや、先に言っちゃうと面白くない！"
"100820480" = "よし、次の「青春活動」はこれに決めた！"
"100820490" = "明日シャーレに行ってからのお楽しみだ！"
"100820500" = "分かった。それじゃあ、また明日ね"
"100820510" = "うん！"
"100820520" = "き、今日のイベントは取り消しだ！"
"100820530" = "そう、取り消し！"
"100820540" = "アタシたちに幼馴染は、ハードルが高すぎた！"
"100820550" = "そ、そうかな？"
"100820560" = "そう、絶対に！"
"100820570" = "だから次は、違う関係性を考えてくる！"
"100820580" = "覚悟しててくれ！師匠！"
"100820590" = "は、はい……"
"100820600" = "先生、気づけば「青春活動」を始めてから……"
"100820610" = "随分と経ったもんだな"
"100820620" = "そうだね"
"100820630" = "もうそんなに経ったっけ？"
"100820640" = "失敗もあったけど……"
"100820650" = "それでも、一歩ずつ着実に進んでるはずだ"
"100820660" = "というわけで、今日も青春活動の時間がやってきた！"
"100820670" = "シャーレにお邪魔するね！"
"100820680" = "うん、待ってるよ"
"100820690" = "じゃあ、また後で！"
"100820700" = "先生、色々迷惑をかけたけど……"
"100820710" = "その……"
"100820720" = "これからも「青春活動」、頑張ろうね"
"100820730" = "心配してくれてありがとう"
"100820740" = "う……うん"
"100820750" = "分かってるじゃないか！せんせ……いや、師匠！"
"100820760" = "また一緒に「青春活動」、しようね！"
"100820770" = "師匠、ちょっといいか？"
"100820780" = "気になる青春活動があって……"
"100820790" = "今回はどんなの？"
"100820800" = "師弟で行く――"
"100820810" = "休日のショッピング！"
"100820820" = "生徒だからこその青春活動かなって"
"100820830" = "楽しそう！"
"100820840" = "何か買いたいものがあるの？"
"100820850" = "特にはないんだけど"
"100820860" = "「商店街で一緒に過ごす」のが青春かなって……"
"100820870" = "お店を見て回るのも楽しいだろ？"
"100820880" = "つまり……デートみたいな？"
"100820890" = "ははっ！そんなわけな――"
"100820900" = "……"
"100820910" = "待って……"
"100820920" = "これってデートなのか……？"
"100820930" = "……"
"100820940" = "と、とにかく！"
"100820950" = "商店街で待ってるから！"
"100820960" = "し、師匠"
"100820970" = "リボン、ありがとう"
"100820980" = "本当に……アタシにとって、特別なものになったよ"
"100820990" = "大切にするね"
"100821000" = "お面、大事に飾っておくよ"
"100821010" = "うん……すごく楽しかったから"
"100821020" = "またショッピングしよう"
"100821030" = "一緒に……"
"100821040" = "うん！楽しみにしてるよ！"
"100821050" = "アタシも！"
