[translation]
"327" = "先生。前に手伝ってくれた依頼、あらためて決着がついたわよ"
"328" = "クライアントも、かなり満足してくれたみたい"
"329" = "ふふっ、お疲れ様"
"330" = "何の話だっけ？"
"331" = "これも全部アル社長のおかげだね！"
"332" = "え？もしかして、覚えてないの？"
"333" = "まあ、あの時は確かに、だいぶバタバタしていたけれど……"
"334" = "と、とにかく……！"
"335" = "な、なんて自然な処世術、これが大人……！"
"336" = "……じゃなくって"
"337" = "職員が立派な成果を出した時、それにふさわしいご褒美をあげること"
"338" = "そういうのも、社長のやるべきことだと思うのよ"
"339" = "さあ、先生にとって最高のご褒美は何かしら？"
"340" = "家に帰って、よく考えてみたのだけど"
"341" = "「ご褒美としてチャレンジメニューのパフェを食べるわよ」って言ったら、"
"342" = "みんな怒るかもしれないわね"
"343" = "……効率性の裏に、こんな盲点があっただなんて"
"344" = "だから、その……"
"345" = "先生、次もまた、付き合ってくれるかしら？"
"346" = "先生、社長になるために必要な能力はリーダーシップだけではないのよ"
"347" = "もちろん私のリーダーシップは素晴らしいものだけど、"
"348" = "業務においては他にも色んな能力が必要ってこと"
"349" = "色んな能力？"
"350" = "例えば？"
"351" = "ふふふ、知りたい？知りたいわよね？"
"352" = "だったら今日、図書館に来るといいわ。待ってるわよ、先生"
"353" = "先生、見直したわ"
"354" = "でも覚えておいて"
"355" = "次は、こんなにまんまとはやられないから！"
"356" = "……それはそれとして。また今度、一緒に勉強するわよ♪"
"357" = "先生、あの話聞いた？"
"358" = "伝説的なあの名作映画が、今度再上映するらしいわね"
"359" = "都合がつくようだったら、一緒に見に行かない？"
"360" = "やった！アルからのデートのお誘いだ！"
"361" = "な、なっ、何を言ってるの先生！？"
"362" = "く、くだらないことを言ってないで、いいから映画館の前で待ち合わせよ！"
"363" = "先生、今日暇かしら？"
"364" = "うん、暇だよ"
"365" = "アルちゃんが私のことを呼んでいるのなら、行かざるを得ない"
"366" = "ふ、ふーん……！？ま、まあ、ならいいわ"
"367" = "今日は、先生に大事な話があるの"
"368" = "後で、便利屋の事務所に来てくれる？"
"369" = "待ってるわよ"
"370" = "今日みたいに私のカッコいい姿を見られるなんて、貴重なことなのよ？"
"371" = "これからもよろしくお願いするわね、先生！"
"372" = "……ちなみにあれは、本当に仕事の電話だったから！本当よ！"
"100000010" = "先生"
"100000020" = "あらためてだけど……私たち便利屋一同、先生に心から感謝しているわ"
"100000030" = "そこまで言われると照れちゃうな"
"100000040" = "ふふふっ、先生らしくないわね"
"100000050" = "この程度で恥ずかしがっていたら、この先やっていけないわよ"
"100000060" = "じゃあ攻守交替、アルにも恥ずかしがってもらおう"
"100000070" = "どういうこと！？！？"
"100000080" = "ごめん、言ってみたかっただけ"
"100000090" = "そ、そう……"
"100000100" = "とにかく本題なのだけど、普段お世話になってるお礼として"
"100000110" = "食事でも一緒に、どうかしら？"
"100000120" = "ぜひ！"
"100000130" = "それは良かったわ"
"100000140" = "じゃあ待ってるわよ、先生"
