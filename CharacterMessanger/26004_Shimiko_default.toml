[translation]
"1786" = "こんにちは、先生！シミコです！"
"1787" = "一度きちんとご挨拶がしたくて、よろしければ今度お会いできませんか？"
"1788" = "今度、派遣業務で公共図書館に行くのですが、"
"1789" = "それが、ちょうど先生がいらっしゃるところの近くみたいなので！"
"1790" = "先生のご都合の良いタイミングで、いつでもお越しいただければと！"
"1791" = "うん、じゃあお邪魔しようかな"
"1792" = "(・∀・*)はい！ではお待ちしてます！"
"1793" = "今日はありがとうございました、先生"
"1794" = "しばらくはこの図書館にいることになりましたので、"
"1795" = "いつでもまた来てくださいね！"
"1796" = "次回はもっと大人しくと言いますか、おしとやかな感じで……"
"1797" = "い、いえ、今のは無しです！"
"1798" = "とにかく、いつでもお待ちしておりますね！ (・∀・*)"
"1799" = "そういえば先生も、夜遅くまで起きて本を読んだりしますか？"
"1800" = "あっ、先生の場合は本ではなく……"
"1801" = "お仕事の書類、でしょうか？"
"1802" = "社会人だからね……"
"1803" = "シミコ、結構夜型なんだね"
"1804" = "笑"
"1805" = "そうですね"
"1806" = "結構遅くまで起きてて、本を読んでいることが多いです"
"1807" = "私たち、活動する時間帯が近いかもしれません(・∀・*)"
"1808" = "深夜でも全然大丈夫ですので、いつでも暇な時には遊びに来てくださいね！"
"1809" = "先生が来てくださるのであれば、24時間いつでも開けておきますので！"
"1810" = "無事にシャーレに着きましたか？"
"1811" = "今日のことは秘密ですよ"
"1812" = "その、噂になってしまうかもしれませんし……"
"1813" = "私も秘密にしておきますね！(・∀・*)"
"1814" = "先生、今お忙しいでしょうか？"
"1815" = "ちょっとお願いしたいことがありまして"
"1816" = "よろしければ、付き合っていただけませんか？"
"1817" = "どうしたの？"
"1818" = "デートのお誘いかな？"
"1819" = "ふふっ、それは秘密です"
"1820" = "来ていただけたらすぐに分かりますよ"
"1821" = "ヒントを出しますと、「宝探し」みたいなものです！(・∀・*)"
"1822" = "今日は本当にありがとうございました、先生！"
"1823" = "先生にご連絡して正解でした、楽しかったです！"
"1824" = "何て言えばいいんでしょう、その、"
"1825" = "先生と一緒だといつも楽しくて、毎回良いことが起きるような気がします"
"1826" = "これからもよろしくお願いしますね！先生！(・∀・*)"
"1827" = "……"
"1828" = "……返却不可、ですからね？"
"260040010" = "先生は最近、本読まれてますか？何かあればいつでも相談してください！"
"260040020" = "あ、ナイスタイミング"
"260040030" = "ありがとう、ちょうど探してるものがあって"
"260040040" = "？"
"260040050" = "え"
"260040060" = "本当ですか？"
"260040070" = "うん、本当"
