"260040090" = "あ"
"260040100" = "はい"
"260040110" = "はいっ！お待ちしてます！！:D"
"260040120" = "本も先生も、無事に帰られましたか？"
"260040130" = "先生が来てくれたおかげで、とっても楽しかったです"
