[translation]
"101380010" = "先生、今日学院に来るって言ってたよね？"
"101380020" = "うん、ちょっとした調査を依頼されてて"
"101380030" = "ちょうどよかった"
"101380040" = "ちょっと、アクセサリーの材料買ってきてくれない？"
"101380050" = "ちょうどいいやつがこっちの店になくて"
"101380060" = "……密輸の依頼？"
"101380070" = "んなわけないでしょ！"
"101380080" = "別に規制品じゃないし！"
"101380090" = "検問にも引っかからないわよ！"
"101380100" = "リスト送っとくから"
"101380110" = "こっち来るついでによろしく！"
"101380120" = "先生、ちゃんと帰れた？"
"101380130" = "また破けてないわよね？"
"101380140" = "大丈夫！問題ないよ！"
"101380150" = "ふふ。これは一つ貸しだからね"
"101380160" = "今度ちゃんと返してよ？"
"101380170" = "見つけてくれたのがレナでよかった！"
"101380180" = "私はよくなかったけどね！？"
"101380190" = "まぁいいわ。無事に帰れたならよかった"
"101380200" = "また連絡するわね"
"101380210" = "この間のこと、忘れてないよね？"
"101380220" = "返すチャンスが来たわよ？"
"101380230" = "何をすればいいの？"
"101380240" = "文章で伝えるのもアレだし"
"101380250" = "とりあえず来てくれない？"
"101380260" = "あの時間に、あの場所ね"
"101380270" = "先生……どうしよう"
"101380280" = "どうしたの？"
"101380290" = "先輩たちに"
"101380300" = "例の写真を見せたんだけど"
"101380310" = "先生の腕が……"
"101380320" = "うっすら写ってる写真が"
"101380330" = "あったんだよね"
"101380340" = "それってダメだったの……？"
"101380350" = "先生と一緒に行ったとは言えないじゃない"
"101380360" = "だから、これが幽霊の正体、って言った"
"101380370" = "私の口で……"
"101380380" = "シャーッ！！！"
"101380390" = "幽霊が居た……って"
"101380400" = "私が！！！自分の口で言ったの！"
"101380410" = "そして先輩たちは"
"101380420" = "これが七つ目の不思議だって、大騒ぎ！！！！"
"101380430" = "ああああああ！！もう！！！！！！"
"101380440" = "見てなさいよ！！！！"
"101380450" = "次こそは絶対……！！！！！"
"101380460" = "一緒に頑張ろうね……"
"101380470" = "この間のこと覚えてる？"
"101380480" = "先生の腕が写真に写ってて"
"101380490" = "それが幽霊だ、って私が"
"101380500" = "先輩たちに言っちゃったやつ"
"101380510" = "覚えてるよ。ごめんね……"
"101380520" = "なんで先生が謝るのよ"
"101380530" = "写り込んだことに気づかなかった私のせいでしょ"
"101380540" = "それで……"
"101380550" = "先輩たちが私に"
"101380560" = "お守りを作るといいと言ってきてね"
"101380570" = "だから私の分を作るついでに"
"101380580" = "先生のも作ってあげようと思って"
"101380590" = "レナが……お守りを？"
"101380600" = "うわ"
"101380610" = "わざわざ復唱しないで！"
"101380620" = "私だって意味不明だと思ってるんだから！"
"101380630" = "それじゃ暇な時来てね"
"101380640" = "じゃあ今から行くね！"
"101380650" = "先生あれからどう？"
"101380660" = "変なこと、起きてないよね？"
"101380670" = "ガム踏んじゃったりとか"
"101380680" = "レナのお守りのおかげで何ともないよ！"
"101380690" = "別にお守りを信じてるわけじゃないけど……"
"101380700" = "ずっと身につけててよ"
"101380710" = "私があげたやつなんだから"
"101380720" = "いい？"
"101380730" = "うん！レナの思いがこもった物だからね"
"101380740" = "またそういうこと言って"
"101380750" = "それじゃ、またね"
"101380760" = "先生、今日ワイルドハントに来るんだよね？"
"101380770" = "そうだよ。チョコバナナクレープでも買ってく？"
"101380780" = "別にいらないわよ！"
"101380790" = "というか、お願いがあって"
"101380800" = "アクセサリーの材料を買ってきてほしいの"
"101380810" = "お店がテロにあっちゃってさ"
"101380820" = "テロ！？"
"101380830" = "誰かが店の壁に"
"101380840" = "変な絵を描いちゃって……"
"101380850" = "それを全部落とすまで休業だって"
"101380860" = "はぁ……"
"101380870" = "そんなわけだから、頼んだわよ"
"101380880" = "チョコバナナクレープも買っていくね！"
"101380890" = "好きにすれば！？"
