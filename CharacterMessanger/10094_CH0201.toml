"100940200" = "まあ……食事は生活に欠かせないからね"
"100940210" = "そう……かくして私の深遠な計画は再び始動した……"
"100940220" = "料理でご主人様を満足させられなければ、メイドとしては半人前っ……！"
"100940230" = "だから！先生に素敵なお料理を作ってあげないと、ってね！"
