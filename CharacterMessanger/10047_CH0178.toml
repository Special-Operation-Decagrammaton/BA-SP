"100470380" = "うん、でも……"
"100470390" = "やっぱり、一人で楽しむのはもったいない～"
"100470400" = "分かるかも、その気持ち"
"100470410" = "誰かと一緒なら、もっと楽しいよね"
"100470420" = "あ、いいこと考えた"
"100470430" = "みんなで海に来られないなら……"
"100470440" = "来られないなら……？"
"100470450" = "逆に、私が海を持っていけば良いんだ～"
"100470460" = "よ～し、そうと決まればさっそく～"
"100470470" = "……ん？チセ？海を持っていくって……？"
"100470480" = "すた～と～"
"100470490" = "ちょ、ちょっと待って！すぐそっちに行くから！"
