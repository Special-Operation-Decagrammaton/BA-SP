[translation]
"100470010" = "先生、レッツバケーション"
"100470020" = "バケーション……？"
"100470030" = "うん、貰ったの。夏休み"
"100470040" = "いつも陰陽部の活動、頑張ってるから"
"100470050" = "ゆっくり休んできて、って"
"100470060" = "なるほど。それは良かったね"
"100470070" = "何か夏休みの予定とかあるの？"
"100470080" = "うん、それはもう"
"100470090" = "どんな予定なのか、聞いても良い？"
"100470100" = "探しに行こう、先生"
"100470110" = "探すって、何を？"
"100470120" = "じゃあ、集合"
"100470130" = "海で待ってるね"
"100470140" = "え、えっと、チセ……？"
"100470150" = "とりあえず、海に行けば良いのかな…?"
"100470160" = "先生。この間きらきらを探した時にね"
"100470170" = "海辺で、すごいものを見つけたの"
"100470180" = "気になる……！"
"100470190" = "うん、私も先生に見せたいな"
"100470200" = "せっかくだし"
"100470210" = "一緒に見に行こう、先生"
"100470220" = "じゃあ、待ってるね～"
"100470230" = "先生"
"100470240" = "あ、チセ。どうしたの？"
"100470250" = "ちゃんと歯磨きしてる？"
"100470260" = "は、はい"
"100470270" = "それはまた、どうして急に……？"
"100470280" = "それは良かった"
"100470290" = "じゃあ先生"
"100470300" = "これからも、1日3回"
"100470310" = "歯磨き、忘れないようにね？"
"100470320" = "そ、そうだね。了解"
"100470330" = "それじゃあ……"
"100470340" = "元気でね、先生"
