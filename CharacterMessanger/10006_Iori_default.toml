[translation]
"520" = "先生、あの噂聞いた？"
"521" = "何の噂？"
"522" = "女子生徒のスカートを覗こうとするヘンタイが出没してる、って噂があって"
"523" = "まったく、嘆かわしい世の中だ"
"524" = "それは大変だね"
"525" = "先生も、もし怪しいヘンタイを見かけたら、すぐ風紀委員会に連絡して"
"526" = "分かった、任せて"
"527" = "先生最近、ゲヘナによく出張に来てるみたいだけど……"
"528" = "このところ、ゲヘナ学園に関する仕事が多くって"
"529" = "イオリちゃんに会いたくって、つい……"
"530" = "……そうなんだ。お疲れ様"
"531" = "……は？何を言ってるんだ？"
"532" = "でも実際、学園ではあまり会わないな"
"533" = "出張に来る時は、どこにいるんだ？"
"534" = "校庭とか"
"535" = "……校庭？何のために？"
"536" = "今度会った時に教えてあげるね"
"537" = "なんか、怪しいな……"
"538" = "報告だと最近、ブラックマーケットで密輸品の取引量が増えてるらしい"
"539" = "生活に必要なものなら、普通のマーケットで何でも手に入るのに……"
"540" = "いったいブラックマーケットで、どんな取引が行われてるんだ？"
"541" = "私は知らないなあ、興味も無いし……"
"542" = "それはそうだろうな"
"543" = "普通の人がブラックマーケットに足を踏み入れることなんてそうそう無い"
"544" = "先生も、ブラックマーケットの悪党たちとは関わらないよう気を付けて"
"545" = "うん、肝に銘じるね"
"546" = "……先生、本当に私の卒業アルバムを変なことに使ったりしないだろうな？"
"547" = "先生を信じて渡したんだから……他の人に見せたりするなよ！"
"548" = "……ねえ、イオリ"
"549" = "ん？なに？"
"550" = "小学生の時のイオリも可愛い"
"551" = "うるさい！死ね！"
"552" = "今日の風紀委員会の活動では世話になった、ありがとう"
"553" = "私の方こそありがとう"
"554" = "イオリはもちろん、ゲヘナの風紀委員にも色々助けてもらったから"
"555" = "先生は私たちと違って、銃で撃たれたら本当に危ないんだから"
"556" = "ああいう危険な任務なら、私たちが一緒に行くのは当たり前"
"557" = "うん、ありがとね。そういえばイオリ、"
"558" = "さっき作戦中に背中を怪我してなかった？"
"559" = "ああ……そういえばそうだった"
"560" = "気にしないで、大した怪我じゃない"
"561" = "先生、このメッセージを見たら、ゲヘナ正門前の住宅街3丁目に……"
"562" = "ちょっと……アクシデントがあって"
"563" = "アクシデントって、どんな？"
"564" = "いいから、早く来て！"
"565" = "あと！他の生徒たちには、絶対に私がここにいるって言うなよ！"
"566" = "先生！！"
"567" = "さっき送られてきてたこの写真、何でまだ持ってるんだ！！"
"568" = ""
"569" = "よく撮れてるから、もしかしたら欲しいかなって"
"570" = "可愛くない？"
"571" = "いるか！！！！！"
"572" = "そういう問題じゃない！"
"573" = "消してって言ったじゃん！"
"574" = "何でまだ持ってるんだ！"
"575" = "消して！今すぐ！"
"576" = "聞いてる！？ちょっと！！"
