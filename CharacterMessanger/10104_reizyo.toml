[translation]
"101040010" = "こんにちは、先生"
"101040020" = "どうやら明日は、山海経まで来るそうですね？"
"101040030" = "どこで知ったの！？"
"101040040" = "やはりそうでしたか"
"101040050" = "当然ですが私たち玄武商会は"
"101040060" = "独自の情報網を持っていますから"
"101040070" = "情報網……"
"101040080" = "実のところ"
"101040090" = "そこまで大したものではありませんが……"
"101040100" = "先生、明日の朝お時間があれば"
"101040110" = "少しお話でもしませんか？"
"101040120" = "どちらにせよ私は日課をこなしておくので"
"101040130" = "忙しいようでしたら、また別の日でも"
"101040140" = "今日は商会に来てくださるんですよね"
"101040150" = "うん、楽しみにしてるよ"
"101040160" = "そう言っていただけると嬉しいのですが"
"101040170" = "少し緊張しますね"
"101040180" = "ご、ごめん……"
"101040190" = "いえ、謝ってほしいわけでは"
"101040200" = "期待されないより良いですから"
"101040210" = "料理を出す立場からすれば、なおのこと"
"101040220" = "それでは先生"
"101040230" = "後ほどお会いしましょう"
"101040240" = "以前も申し上げたかと思いますが……"
"101040250" = "今日は玄龍門の監査が入る予定でして"
"101040260" = "無事終わると良いね"
"101040270" = "はい"
"101040280" = "ひとつ気になったのですが"
"101040290" = "先生まで来る必要は……"
"101040300" = "一応、顧問としてね"
"101040310" = "それはそうですが……"
"101040320" = "はぁ"
"101040330" = "前回の監査では"
"101040340" = "私たちの部員が監査員を入院させてしまったもので……"
"101040350" = "入院！？"
"101040360" = "い、いえっ"
"101040370" = "アレは、あくまで事故で……"
"101040380" = "と今さら何を言ったところで"
"101040390" = "言い訳にしかなりませんね"
"101040400" = "申し訳ありませんが、本日はお願いいたします"
"101040410" = "う、うん……"
"101040420" = "シャーレの当番を行うにあたって"
"101040430" = "何か準備は必要でしょうか？"
"101040440" = "大丈夫だよ、気楽に来てね"
"101040450" = "分かりました"
"101040460" = "では、後ほどシャーレでお会いしましょう"
