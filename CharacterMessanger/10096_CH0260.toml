[translation]
"100960010" = "こんにちは、先生"
"100960020" = "久しぶりだね、カンナ"
"100960030" = "元気だった？"
"100960040" = "お久しぶりです。実は、相談したいことがありまして"
"100960050" = "カンナから相談だなんて、珍しいね"
"100960060" = "その、プールのライフセーバーに任命されたのですが……"
"100960070" = "水着が決められずに困っています"
"100960080" = "……水着？"
"100960090" = "はい、よろしければ直接アドバイスを頂いてもよろしいでしょうか？"
"100960100" = "私には、どうも難しく……"
"100960110" = "分かった、すぐ行くね"
"100960120" = "先生、本日はありがとうございました"
"100960130" = "おかげで水着が決まり、一安心です"
"100960140" = "似合ってたね"
"100960150" = "……"
"100960160" = "今さらですが、気付いたのです"
"100960170" = "もしかしたら私には、「似合っている」の一言が必要だっただけかもしれません"
"100960180" = "初めてのライフセーバー任務で、気負いすぎていたのでしょう"
"100960190" = "もう気は楽になった？"
"100960200" = "はい"
"100960210" = "やはり、先生に助けを要請して正解でした"
"100960220" = "こんにちは、先生"
"100960230" = "パークは楽しめていますか？"
"100960240" = "うん、楽しんでるよ"
"100960250" = "ライフセーバーとして、嬉しい限りです"
"100960260" = "あの、もしお時間があれば、ひとつお願いをしても良いでしょうか？"
"100960270" = "どんなお願い？"
"100960280" = "屋外施設の「メガスライド」まで来てもらえませんか？"
"100960290" = "試運転に付き合っていただきたいのです"
"100960300" = "今日はウォーターパークの定休日です"
"100960310" = "間違えないよう、お気をつけてください"
"100960320" = "じゃあカンナも休みなの？"
"100960330" = "いえ、私は仕事です"
"100960340" = "施設の清掃や補修がありますから"
"100960350" = "利用客の皆さんが、安全に楽しく遊べるようにしなくてはいけませんので"
"100960360" = "定休日なのに大変だね……"
"100960370" = "少し頑張りすぎじゃない？"
"100960380" = "利用客の安全がかかっておりますし、これくらい当然です"
"100960390" = "もちろん、そこには先生も含まれていますから"
