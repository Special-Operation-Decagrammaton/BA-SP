"160030240" = "私はいつでも大丈夫ですので"
"160030250" = "ご連絡いただけると、とても嬉しいです"
"160030260" = "いつもありがとう、スズミ。お願いしてもいい？"
"160030270" = "じゃあ、久しぶりに二人で歩こうか"
"160030280" = "は、はい"
"160030290" = "ありがとうございます。それでは、また"
"160030300" = "いらっしゃる際に伺いますね"
"160030310" = "今日は本当にありがとうございました"
"160030320" = "先生のおかげで、とても楽しかったです"
"160030330" = "ありがとう。私も楽しかったよ"
"160030340" = "こちらこそ、これからもよろしくね"
"160030350" = "いや"
"160030360" = "それは、その……"
"160030370" = "はい"
"160030380" = "これからもよろしくお願いします、先生"
"160030390" = "何かありましたら、お気軽にご連絡ください"
"160030400" = "いえ"
"160030410" = "理由なんてなくても大丈夫です"
"160030420" = "……先生なら、いつでも"
