[translation]
"100240010" = "しばらく遠出する予定なの"
"100240020" = "みんなにもメッセージは送っておいたんだけど"
"100240030" = "先生にも伝えておこうかなって"
"100240040" = "……遠出？"
"100240050" = "急にどうしたの……？"
"100240060" = "大丈夫、大したことじゃない"
"100240070" = "じゃあ、またね。先生"
"100240080" = "先生"
"100240090" = "ちょうど休むタイミングだったから、連絡してみた"
"100240100" = "まだ数分くらいしか経ってない気が……？"
"100240110" = "もしかして、もう結構遠くまで行った感じ……？"
"100240120" = "ん？"
"100240130" = "ううん、まださっき先生といた場所の近く"
"100240140" = "ちょうど信号で、足を止めたから連絡してみた"
"100240150" = "……あれ？"
"100240160" = "もしかして止まるたびにって、こういう意味じゃない？"
"100240170" = "……ごめん、勘違いしてた"
"100240180" = "じゃあ、えっと……休憩とかで自転車を降りたら、その度に連絡するね"
"100240190" = "先生"
"100240200" = "今アビドスを完全に抜けたところ、もうすぐ海岸道路に着きそう"
"100240210" = "速いね……！？"
"100240220" = "プロ選手みたいな速度だね……今のところ順調？"
"100240230" = "ん"
"100240240" = "あ、そういえば……"
"100240250" = "どうしたの？"
"100240260" = "あ、いや"
"100240270" = "ごめん、やっぱり大丈夫"
"100240280" = "ありがとう"
"100240290" = "この後は、海岸道路沿いにずっと走るつもり"
"100240300" = "じゃあまた連絡するね、先生"
"100240310" = "ありがとう、先生。色々と助かった"
"100240320" = "カバンの中に入れてると、どうしても飲み物はぬるくなっちゃうし"
"100240330" = "持ってきてくれたドリンク、すっごく冷たくて嬉しかった"
"100240340" = "タオルも"
"100240350" = "あ"
"100240360" = "そういえばさっき先生に渡したタオル、良ければ……"
"100240370" = "洗濯してちゃんと保管しておいたよ。今度返すね"
"100240380" = "えっと"
"100240390" = "うん、やっぱりそうだよね……"
"100240400" = "ううん、ありがとう"
"100240410" = "んと"
"100240420" = "じゃあ"
"100240430" = "また連絡するね、先生"
"100240440" = "そういえば"
"100240450" = "先生この前、行き先の予定を教えてほしいって言ってたけど"
"100240460" = "この情報は、何か先生の役に立つの？"
"100240470" = "また補給品とか持っていこうかなって"
"100240480" = "サポーターとして色々手伝えるかなと思って"
"100240490" = "あ……"
"100240500" = "ん、そっか"
"100240510" = "でも、大丈夫？仕事も忙しいのに……"
"100240520" = "いや、その"
"100240530" = "もちろん、嫌なわけじゃない"
"100240540" = "その、私はすごく嬉しいけど……"
"100240550" = "じゃあ、無理しない程度にお願い"
"100240560" = "次のポイントに着くの、楽しみにしてるね"
"100240570" = "先生、そろそろ着きそう"
"100240580" = "もう出てきても大丈夫"
"100240590" = "出てきても大丈夫……？"
"100240600" = "えっと、どこに着いたの？"
"100240610" = "んと……"
"100240620" = "とにかく、出てきたら分かるから"
"100240630" = "待ってるね"
"100240640" = "そういえば"
"100240650" = "今回、キヴォトス縦断ができたから"
"100240660" = "次はキヴォトス横断をしてみようかなって"
"100240670" = "これも本当の横断じゃなくて、だいたいそんな感じってだけなんだけど"
"100240680" = "先生さえよかったら、その、一緒に走ったり……"
"100240690" = "実際の参加は、ちょっと……応援してるね"
"100240700" = "サポーターとして、全力で支えさせてもらうね……"
"100240710" = "うーん……"
"100240720" = "そっか、残念"
"100240730" = "じゃあ……これからも、サポーターとして"
"100240740" = "よろしくね、先生"
