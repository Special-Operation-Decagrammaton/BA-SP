[translation]
"100360010" = "今日もみなさんに、平和と安寧がありますように！"
"100360020" = "トリニティの聖堂に立ち寄ることがありましたら、何でも手伝いますのでお申し付けください"
"100360030" = "ありがとう、その時はよろしくね"
"100360040" = "何でも良いの？"
"100360050" = "あっ"
"100360060" = "ただ、その"
"100360070" = "私にできる範囲で、になりますが……"
"100360080" = "あまり遠出したりは、ちょっと難しくって……"
"100360090" = "それ以外でしたら、ぜひいつでも！"
"100360100" = "その、先生……"
"100360110" = "実はちょっと、困ってしまいまして……"
"100360120" = "何かあったの？"
"100360130" = "どうしたの？"
"100360140" = "えっと"
"100360150" = "実は最近、みなさんから頻りに「休んでください」と言われていまして……"
"100360160" = "もしかして私、頼りないのでしょうか？"
"100360170" = "ずっと無理してるから、とか？"
"100360180" = "うーん……"
"100360190" = "無理とかは、してないはずなのですが……"
"100360200" = "……"
"100360210" = "どういうことなのでしょうか"
"100360220" = "困りました……"
"100360230" = "先生"
"100360240" = "おかげさまで、楽になりました"
"100360250" = "今日、先生からあのように言っていただけて"
"100360260" = "何だかその"
"100360270" = "すごく、救われた気分です"
"100360280" = "ありがとうございます、本当に"
"100360290" = "先生、こんにちは"
"100360300" = "今日は、聖堂の裏手にある公園に行く予定なんです。管理のお仕事の一環でして"
"100360310" = "あ、その"
"100360320" = "特に何かお願い事があったわけではないのですが"
"100360330" = "むしろ元気ですということを、ただお伝えしたくって"
"100360340" = "これも、先生のおかげです"
"100360350" = "大したことはしてないよ。また今度会いに行くね"
"100360360" = "せっかくだし、私も遊びに行こうかな？"
"100360370" = "もちろんです、それはもうぜひ！"
"100360380" = "ご連絡いただければ、すぐ迎えに行きますので！"
"100360390" = "あの、先生"
"100360400" = "今日はバタバタしてしまってすみません。それとは別の件なのですが、その……"
"100360410" = "ううん、お疲れ様。どうしたの？"
"100360420" = "何かあった？"
"100360430" = "えっと"
"100360440" = "実は、何と言いますか"
"100360450" = "遠回しに聞かれたのですが、何だか変な噂が回っているかもしれなくって"
"100360460" = "誰もいない倉庫や、聖堂の裏"
"100360470" = "茂みの中で何をしていたのか、というようなことを聞かれまして……"
"100360480" = "「何を」と言われましても、何のことだか分からず……"
"100360490" = "……何だろうね？"
"100360500" = "……その噂自体は、私のせいかも。ごめん。"
"100360510" = "……？"
"100360520" = "えっと"
"100360530" = "……先生？"
"100360540" = "先生"
"100360550" = "実は今日、お休みでして"
"100360560" = "それで"
"100360570" = "その"
"100360580" = "？"
"100360590" = "うん"
"100360600" = "よろしければ少し、お時間を頂けませんでしょうか……？"
"100360610" = "もちろん。"
"100360620" = "大歓迎だよ。"
"100360630" = "！"
"100360640" = "あ、ありがとうございます！では先に行って、場所を取っておきますので……！"
"100360650" = "あの……"
"100360660" = "先生、今よろしいでしょうか？"
"100360670" = "どうしたの、ヒナタ？"
"100360680" = "うん、大丈夫だよ"
"100360690" = "そのですね"
"100360700" = "一応、あらためてお聞きしておきたくて……"
"100360710" = "先日のピクニックに持っていったお弁当、いかがでしたか……？"
"100360720" = "お気に召していただけてたら良かったのですが……"
"100360730" = "もちろん、すごくおいしかったよ"
"100360740" = "また作ってくれるとうれしいな"
"100360750" = "ほ"
"100360760" = "本当ですか？"
"100360770" = "ありがとうございます！"
"100360780" = "あっ"
"100360790" = "あの"
"100360800" = "先生！"
"100360810" = "何度も本当にすみません……"
"100360820" = "先ほど気づいたのですが……"
"100360830" = "先生のお弁当箱を台帳と間違えて持って帰ってしまったみたいで……"
"100360840" = "あ、本当だ"
"100360850" = "確かに重かったかも……それじゃあ、また近いうちにあの公園で"
"100360860" = "あ"
"100360870" = "はいっ！"
"100360880" = "ありがとうございます……"
