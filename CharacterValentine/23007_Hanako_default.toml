[translation]
"80000032-1" = "多情多感な女の子"
"80000032-2-ハナコ" = "あらあら、いらっしゃいましたか……♡"
"80000032-3-ハナコ" = "わざわざお忙しい中、お時間を作っていただいてありがとうございます。"
"80000032-4" = "[s] \"それはもちろん、ハナコからのお願いだから。\""
"80000032-5-ハナコ" = "あら、それはつまり……私のお願いでしたら、何でも聞いてくださるということですか？"
"80000032-6" = "[s1] \"「何でも」はちょっと難しいかもだけど……。\"\n[s2] \"私にできる範囲で……。\""
"80000032-7-ハナコ" = "なるほどなるほど……ではつまり、「お願いしたら、できる限り聞いてくださる」ということですね？"
"80000032-8-ハナコ" = "なるほどなるほど……ではつまり、「お願いしたら、できる限り聞いてくださる」ということですね？"
"80000032-9-ハナコ" = "嬉しいです、ではあらためてお願いを……♡"
"80000032-10-ハナコ" = "あら、どうして後ずさりするのですか？"
"80000032-11-ハナコ" = "私からのお願いです……"
"80000032-12-ハナコ" = "……私のプレゼント、受け取っていただけますか？"
"80000032-13" = "[s] \"この箱……もしかして手作り？\""
"80000032-14-ハナコ" = "先生のことを思いながら、初めて作ってみました……。"
"80000032-15" = "[s] \"そっか。ありがとね、ハナコ。\""
"80000032-16-ハナコ" = "……。"
"80000032-17-ハナコ" = "何だか、少し照れてしまいますね……。"
"80000032-18" = "[s] \"ハナコが、恥じらってる……。\""
"80000032-19-ハナコ" = "あら、心外ですね？私だって恥じらう心くらい持ってるんですよ？こう見えて、繊細な女の子ですから。"
"80000032-20" = "[s] \"何だかすごくごめん……それはそうだね……。\""
"80000032-21-ハナコ" = "ふふっ……では、私はこれで。あ、中身は今ではなく、後で私がいない時に開けてくださいね。恥ずかしいので。"
"80000032-22-ハナコ" = "えっと……。"
"80000032-23-ハナコ" = "では、また……。"
"80000032-24" = "（顔を赤らめたハナコは、逃げるように去っていった。）"
"80000032-25" = "[ns] \"そろそろ開けても良いかな……。\""
"80000032-26" = "[ns] 箱を開けてみる。"
"80000032-27" = "[ns] \"……。\""
"80000032-28" = "[ns] \"私にはまだ、分からないことだらけだ……。\""
