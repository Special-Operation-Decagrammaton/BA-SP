[translation]
"80000129-1" = "I hate cheap chocolate"
"80000129-2-アオバ" = "……。"
"80000129-3-アオバ" = "先生～……いません、よね……？"
"80000129-4-アオバ" = "それならそれで、良かった、かも……。"
"80000129-5-アオバ" = "うぅ……こんなので、本当に大丈夫かな……。"
"80000129-6-アオバ" = "でも、きっと先生なら……。"
"80000129-7" = "[ns] \"こんにちは、アオバ。\""
"80000129-8-アオバ" = "うわあっ！？#nせ、先生！？"
"80000129-9-アオバ" = "い、いつからそこに……！？"
"80000129-10-アオバ" = "え、最初から……？"
"80000129-11-アオバ" = "あ、ソファで横に……。#n全然気づきませんでした……。"
"80000129-12-アオバ" = "う、うぅ。#nそ、それではこれで……。"
"80000129-13" = "[s1] \"もう行っちゃうの？\"\n[s2] \"もしかして、これって……。\""
"80000129-14-アオバ" = "あ、あぁっ……！"
"80000129-15-アオバ" = "えっと、その……。"
"80000129-16-アオバ" = "せ、先生には普段から、お世話になってるので……！"
"80000129-17-アオバ" = "今日はその、お礼をしなくてはと……！"
"80000129-18-アオバ" = "ただ、そんなもので良いのか不安になってしまい……。"
"80000129-19-アオバ" = "ほんとなら、自分で作ったり……#nもう少し手が込んだものを、差し上げたかったんですけど……。"
"80000129-20-アオバ" = "毎日残業で……帰る頃には、お店が閉まってまして……。"
"80000129-21-アオバ" = "すみません、結局こんな、安いお菓子に……。"
"80000129-22" = "[ns] \"嬉しいよ、アオバ。\""
"80000129-23-アオバ" = "へっ！？"
"80000129-24-アオバ" = "こ、こんな、どこでも買えるようなやつですけど……！？"
"80000129-25" = "[s3] \"それでも、アオバが用意してくれたものだから。\"\n[s4] \"その気持ちが嬉しいよ。\""
"80000129-26-アオバ" = "……。"
"80000129-27-アオバ" = "そ、そうですか……。"
"80000129-28-アオバ" = "……。"
"80000129-29-アオバ" = "……あ、ありがとうございます。"
"80000129-30" = "[ns] \"ん……これ、手紙？\""
"80000129-31-アオバ" = "ひゃぁぁっ！！！"
"80000129-32-アオバ" = "そ、それは！#nダメです！今は！絶対！！"
"80000129-33-アオバ" = "後にしてください！！！"
"80000129-34" = "[s] \"ご、ごめん……。\""
"80000129-35-アオバ" = "はぁ、はぁ……。"
"80000129-36-アオバ" = "で、では私は、これで……。"
"80000129-37-アオバ" = "ま、また……！"
"80000129-38" = "[ns] \"アオバ。\""
"80000129-39-アオバ" = "ど、どうかしましたか！？"
"80000129-40" = "[s] \"せっかくだし、ちょっと休んでいかない？\""
"80000129-41-アオバ" = "えっ……えっ！？"
"80000129-42-アオバ" = "……あ、いえ。#n別に、忙しいわけじゃない、ですけど……。"
"80000129-43-アオバ" = "ほ、本当に良いんですか……？"
"80000129-44-アオバ" = "「休める時に休むのも、仕事のうち」……？"
"80000129-45" = "[s5] \"何だか疲れてるように見えたから。\"\n[s6] \"見てこのソファ、フカフカだよ！\""
"80000129-46-アオバ" = "う、うぅ……。"
"80000129-47-アオバ" = "確かに、ここ最近激務でしたが……。"
"80000129-48-アオバ" = "うーん…………。"
"80000129-49-アオバ" = "……ちょっとだけ、し、失礼します。"
"80000129-50" = "（そうしてアオバは、遅くまでゆっくりしていった）"
"80000129-51-アオバ" = "い、いつも気にかけてくださって、ありがとうございます。"
"80000129-52-アオバ" = "おかげさまで……。"
"80000129-53-アオバ" = "明日も、明後日も頑張れるかもしれません。"
"80000129-54-アオバ" = "……その先も、きっと、ずっと。"
