[translation]
"80000114-1" = "二人だけの秘密"
"80000114-2" = "（昼下がり、シャーレで事務作業をしていると誰かが訪ねてきた）"
"80000114-3-イブキ" = "やっほー！イブキだよーっ！"
"80000114-4-イブキ" = "先生も元気にしてた？"
"80000114-5" = "[s] \"もちろんだよ、イブキ！\""
"80000114-6-イブキ" = "えへへ、ここで問題です！"
"80000114-7-イブキ" = "今日、イブキがシャーレに来た理由は分かる～？"
"80000114-8" = "[s1] \"もしかして、私に会いに来てくれたの？\"\n[s2] \"一緒に遊びたかったからとか？\""
"80000114-9-イブキ" = "惜しいけど残念っ！"
"80000114-10-イブキ" = "今日は、先生にあげたい物があって来たの！"
"80000114-11-イブキ" = "……じゃーん！"
"80000114-12-イブキ" = "今日はバレ……バレタイン……？#nそう、バレンタインの日って聞いたの！"
"80000114-13-イブキ" = "イブキ、よく分かんないけど、一緒に甘いもの食べるんでしょ？"
"80000114-14-イブキ" = "だから、先生にこれあげようと思って！#nイブキ、作ってきたの！"
"80000114-15-イブキ" = "イブキ特製、チョコプリンだよ！"
"80000114-16" = "[s] \"すごく美味しそう！\""
"80000114-17-イブキ" = "でしょでしょ？"
"80000114-18-イブキ" = "チョコレートもプリンも！全部イブキの大好きなものなの！"
"80000114-19-イブキ" = "絶対美味しいよ！早く食べてみて、先生！"
"80000114-20" = "[s3] \"ありがとう。じゃあ、さっそく頂くね。\"\n[s4] （チョコプリンを食べる）"
"80000114-21-イブキ" = "どう？先生？美味しい？"
"80000114-22" = "[s5] \"本当に甘くて美味しいよ！\"\n[s6] \"すっごく甘くて美味しいね！\""
"80000114-23-イブキ" = "（……じーっ）"
"80000114-24" = "[ns] （もう一口食べる）"
"80000114-25-イブキ" = "……ごくり。"
"80000114-26" = "[ns] \"……あ、ごめん。イブキのスプーンも持ってくるね。\""
"80000114-27-イブキ" = "だ、ダメ！"
"80000114-28-イブキ" = "そのプリンは、先生のために持ってきたものだし……それに……"
"80000114-29-イブキ" = "……夜ごはんの前だもん。"
"80000114-30-イブキ" = "先輩がね、ごはんの前におやつ食べちゃダメって言ってたから……"
"80000114-31-イブキ" = "イブキは帰ったら夜ごはんだから、プリンは先生が……うぅ。"
"80000114-32" = "[s] \"イブキは偉いね、先輩との約束をちゃんと守って。\""
"80000114-33-イブキ" = "……うん。"
"80000114-34" = "[s] \"でも、バレンタインデーは一緒に甘いものを食べる日なんでしょ？\""
"80000114-35-イブキ" = "……！"
"80000114-36-イブキ" = "けど……それじゃ夜ご飯入らなくなっちゃう……先輩に言われたのに……"
"80000114-37-イブキ" = "（……ごくり）"
"80000114-38" = "[s] \"なら、こっそりちょっとだけ食べよっか。\""
"80000114-39-イブキ" = "ちょっとだけ……？"
"80000114-40" = "[s] \"うん、2人だけの秘密だよ。\""
"80000114-41-イブキ" = "先生と……2人だけの秘密……"
"80000114-42-イブキ" = "うん！食べたい！"
"80000114-43-イブキ" = "本当は先生と一緒に食べたかったの！"
"80000114-44" = "[s] \"うん、みんなには内緒だよ。\""
"80000114-45-イブキ" = "えへへ、いただきます！"
"80000114-46" = "（その後、イブキと一緒にこっそりチョコプリンを食べた）"
