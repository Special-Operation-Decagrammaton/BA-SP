[translation]
"80000130-1" = "冷たい指先は"
"80000130-2-ナグサ" = "あ、先生。 "
"80000130-3-ナグサ" = "シャーレにいたんだ、良かった。"
"80000130-4" = "[s1] \"こんにちは、ナグサ。\"\n[s2] \"今日は当番じゃなかった気がするけど、どうかした？\""
"80000130-5-ナグサ" = "今日はバレンタインデー。"
"80000130-6-ナグサ" = "見回りをしていたら、自然と情報が入ってきた。"
"80000130-7-ナグサ" = "はい、チョコレート。#nこれを渡したくて。"
"80000130-8" = "[s3] \"ナグサのチョコレート……！\"\n[s4] \"わざわざ来てくれてありがとう、嬉しいよ。\""
"80000130-9-ナグサ" = "そんな……大したものじゃないし。"
"80000130-10-ナグサ" = "先生には助けてもらってばかりだから、#nずっとお礼がしたかった。"
"80000130-11-ナグサ" = "けど、何でもない日に気持ちを伝えるのは、どこか面映ゆいから……。"
"80000130-12-ナグサ" = "だからこそ、こういう日はありがたい。"
"80000130-13" = "[s] \"確かに、そうだね。\""
"80000130-14" = "[ns] \"あれ、何だか見覚えがあるような……。\""
"80000130-15-ナグサ" = "百鬼夜行自治区限定の、特製チョコクッキー。#nどこかのお店で、見たことあるかも。"
"80000130-16-ナグサ" = "エビス産の乳製品を使った、甘くて優しいホワイトチョコでコーティングされてるの。"
"80000130-17-ナグサ" = "一番好きなお菓子なんだけど、何故か[ruby=みんな]百花繚乱[/ruby]はあまり食べなくて。"
"80000130-18-ナグサ" = "買っておいても、いつも私が一人で食べてる。"
"80000130-19" = "[s] \"そうなの？じゃあ、一口……。\""
"80000130-20" = "[ns5] \"美味しい！\"\n[ns6] \"口に入れた瞬間チョコが溶けて、濃厚な味がする。\""
"80000130-21-ナグサ" = "そう、私もそういうところが好き。"
"80000130-22-ナグサ" = "良かったら、もっと食べて。"
"80000130-23" = "[s] \"えっと、その前にちょっと……。\""
"80000130-24-ナグサ" = "あっ……。"
"80000130-25-ナグサ" = "あんまり、好きじゃなかった？"
"80000130-26-ナグサ" = "ごめんなさい……#nみんなが食べない時点で、気づくべきだった。"
"80000130-27-ナグサ" = "私はやっぱり、みんなと違うから……。"
"80000130-28" = "[ns] \"ち、違うよ！そういう意味じゃなくて……！\""
"80000130-29" = "[ns] \"その、書類を汚しちゃう前に、と思って……。\""
"80000130-30-ナグサ" = "あっ……確かにこの「白い乙女」は、一瞬で溶けるようなチョコだから……。"
"80000130-31-ナグサ" = "あれ……でも私は、今まで……。"
"80000130-32-ナグサ" = "……あぁ、体温のせいかな。"
"80000130-33" = "[s] \"体温？\""
"80000130-34-ナグサ" = "うん……私、平熱が低いの。#nそのせいか手足が冷たいって、よく言われて。"
"80000130-35-ナグサ" = "……だからみんなと違って、手が汚れなかったんだと思う。"
"80000130-36" = "[s7] \"なるほど……。\"\n[s8] \"それはちょっと羨ましいかも。\""
"80000130-37-ナグサ" = "ふふっ……。"
"80000130-38-ナグサ" = "こういう時くらいしか、役に立たないけどね……。"
"80000130-39-ナグサ" = "暑さにも弱いし……隣にいる誰かに、上手く熱も伝わらない。"
"80000130-40-ナグサ" = "……けど、知らなかった。良いところもあったんだね。"
"80000130-41" = "[s9] \"もしナグサが良ければ……。\"\n[s10] \"それ、食べさせてくれない？\""
"80000130-42-ナグサ" = "わ、私の手で、ってこと……？"
"80000130-43-ナグサ" = "せ、先生が、気にしないなら……。"
"80000130-44-ナグサ" = "はい、先生……あーん。"
"80000130-45" = "[ns11] \"美味しい……。\"\n[ns12] \"脳が癒されていく……。\""
"80000130-46-ナグサ" = "ふふっ、そう？"
"80000130-47-ナグサ" = "……新しい長所、見つかった。"
"80000130-48" = "（その後もナグサに手ずから食べさせてもらいながら、楽しい時間を過ごした）"
