[translation]
"80000011-1" = "ロッカーのラブソング"
"80000011-2" = "商店街・レコード屋"
"80000011-3-カヨコ" = "あれ。「ブラック・デス・ポイズン」の限定シングル出てたんだ。"
"80000011-4-カヨコ" = "今シーズンはほとんど新曲を出してなかったのに、急に限定シングルだなんてどうしたんだろ。見てみよう……。"
"80000011-5-カヨコ" = "バレンタインデーを狙ったラブソング？"
"80000011-6-カヨコ" = "今までガチガチのヘビメタ路線だった「ブラック・デス・ポイズン」が、どうしてこんなジャンルの音楽にチャレンジを……？"
"80000011-7-カヨコ" = "うーん、まあでも好きだし……試しに買ってみるか。"
"80000011-8-カヨコ" = "あの、このアルバムを……"
"80000011-9-従業員" = "（あ、「ブラック・デス・ポイズン」の限定版アルバム『恋は心臓を撃ち抜いて手に入れるもんなんだよ』ですね。）"
"80000011-10-従業員" = "（こちらのはバレンタインデーを記念した限定シングルですので、ご購入された皆様に特別なプレゼントをお渡ししています。）"
"80000011-11-カヨコ" = "特別なプレゼント？"
"80000011-12-従業員" = "（はい、購入された方には……）"
"80000011-13-従業員" = "（この牛の骸骨型のチョコレートを、おまけで差し上げます！）"
"80000011-14-カヨコ" = "……。"
"80000011-15-従業員" = "（あ、あれ？どうかされましたか？）"
"80000011-16-カヨコ" = "……いや、大きすぎて戸惑っただけ。"
"80000011-17-従業員" = "（そうでしたか。では、「ブラック・デス・ポイズン」の新曲と共に、良いバレンタインデーを。）"
"80000011-18-カヨコ" = "つい貰っちゃったけど……このチョコレート、どう処理しようか……？"
"80000011-19-カヨコ" = "食べるには量が多いし、ここから便利屋のオフィスまで持っていくのもちょっと……。"
"80000011-20" = "[s] \"やあ、カヨコ。\""
"80000011-21-カヨコ" = "あっ、先生。"
"80000011-22-カヨコ" = "偶然だね、先生もレコードを買いに？"
"80000011-23" = "[s] \"まあそんなところ。\""
"80000011-24" = "[s] \"ところで、すごい大きさのチョコレートだね。\""
"80000011-25-カヨコ" = "ああ……好きなグループのアルバムを買ったんだけど、おまけでもらっちゃって。"
"80000011-26-カヨコ" = "持ち運ぶにはかさばるけど、好きなバンドのおまけを捨てるのも気が進まないし、持て余してたとこで……。"
"80000011-27-カヨコ" = "良かったら先生、これ貰ってくれない？"
"80000011-28" = "[s] \"カヨコが良ければ、ありがたく。\""
"80000011-29-カヨコ" = "良かった。むしろ先生がこのチョコレートをもらってくれなかったら、どうしようかと思った。"
"80000011-30-カヨコ" = "あーその……今日がバレンタインデーなのは知ってるけど、特別な意味とかは無いから……。"
"80000011-31-カヨコ" = "これは、そういうのじゃないから。分かった？"
"80000011-32" = "（その後カヨコがくれた巨大な骸骨のようなチョコレートを持って、シャーレに戻った。）"
"80000011-33" = "（精巧に彫刻されたチョコレートは、なんだか食べるのがもったいなくて壁に飾っておいた。）"
