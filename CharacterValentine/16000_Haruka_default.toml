[translation]
"80000063-1" = "その前に、その後に"
"80000063-2" = "（公園のベンチで待っていたら、約束していたハルカが走ってくるのが見えた）"
"80000063-3-ハルカ" = "も、申し訳ございません……！ご連絡があってすぐ走ってきたのですが、こんなことになってしまい、どのようにお詫びすれば良いのか……！"
"80000063-4-ハルカ" = "ま、まさかずっとここでお待ちになっていたのですが……！？そんな、私なんかのせいで先生の大事なお時間を……！！"
"80000063-5-ハルカ" = "もうこれは何で償えば……内臓とかでぜひ謝罪を……！"
"80000063-6-ハルカ" = "……え、だ、大丈夫ですか？あ……は、はい……。"
"80000063-7-ハルカ" = "と、ところで今日は、どういったご用件で……あ、いえその、問いただすだなんてそんな、分不相応なことがしたいわけでは……。"
"80000063-8-ハルカ" = "え、バレンタインデー、ですか？は、はい、そうですね……！？"
"80000063-9-ハルカ" = "準備……？あ、や、実はその、確かにあるのですが……！いえ、思い上がりだなんて滅相もございません……！"
"80000063-10-ハルカ" = "ど、どうして……？"
"80000063-11-ハルカ" = "先生は、どうしてそこまでご存じなのですか……？未来予知……！？"
"80000063-12" = "[s1] （もしくれるんだったら、大ごとになる前に収めないと……）\n[s2] （考え込み過ぎて加速しちゃう前に……）"
"80000063-13-ハルカ" = "……？"
"80000063-14-ハルカ" = "……？"
"80000063-15-ハルカ" = "……えっと、先生？"
"80000063-16-ハルカ" = "あ、ちょ、チョコレートですね！はい、ずっと大切に持ち歩いてまして……！"
"80000063-17-ハルカ" = "よ、よろしければこちらを……！！"
"80000063-18-ハルカ" = "じ、実はその、私あまり普段チョコレートを食べなくって……それで、何をお渡しすれば良いのかよく分からなかったのですが……。"
"80000063-19-ハルカ" = "えっと、所持金で払えそうな中で一番高くて、一番数字が凄そうなものを選んできました！"
"80000063-20-ハルカ" = "も、もちろん私なんかが買った物が、先生にとって価値があるのかは分かりませんが……。"
"80000063-21-ハルカ" = "いえ、本来はあったとしても、私の手に触れた瞬間にゴミになったかもしれませんし……そもそも受け取ってくれる前提だなんて失礼なことを……。"
"80000063-22" = "[s3] \"ううん、すっごく嬉しい。早く貰いたくて連絡したから。\"\n[s4] \"ハルカから貰えるってことが嬉しいよ。ありがとう。\""
"80000063-23-ハルカ" = "えっ……？"
"80000063-24-ハルカ" = "えっ……？"
"80000063-25-ハルカ" = "わ、私のを、ですか……？先生が……？"
"80000063-26-ハルカ" = "ほ、本当ですか！？あ、いえ！決して先生のことを疑うですとか、そういったことではないのですが……！"
"80000063-27-ハルカ" = "ただ、信じられなくて……その、私なんかのチョコを先生が喜んでくださるなんて、えっと……！？"
"80000063-28-ハルカ" = "わ、私はどうすれば良いのでしょうか……こんな身に余る光栄を、どうしたら……？"
"80000063-29-ハルカ" = "え、素直に受け止めてほしい……？え、で、できれば笑顔で……！？"
"80000063-30-ハルカ" = "えっ、と……こ、こうでしょうか……えへへ……。"
"80000063-31" = "[s5] \"うん、それだと私はますます嬉しい。\"\n[s6] \"うん、ハルカ可愛い！\""
"80000063-32-ハルカ" = "……！？"
"80000063-33-ハルカ" = "……！？"
"80000063-34-ハルカ" = "へ……。"
"80000063-35-ハルカ" = "えへへへ……その、こちらこそありがとうございます、先生……！"
"80000063-36" = "（その後ハルカを見送ってから、99％チョコの中にある甘味を味わった）"
