[translation]
"80000136-1" = "ボクの！"
"80000136-2" = "シャーレ・オフィス"
"80000136-3" = "（シャーレに戻ると、見慣れないオブジェが目に飛び込んで来た）"
"80000136-4" = "（……巨大なチョコレート、と思わしきものが）"
"80000136-5" = "（あれは、もしかして……）"
"80000136-6" = "[ns] \"……リツ？\""
"80000136-7-リツ" = "だいせいかーい！"
"80000136-8-リツ" = "先生のために、サプライズチョコレート！"
"80000136-9-リツ" = "ハッピーバレンタインだよっ、先生！"
"80000136-10" = "[s] \"ありがとう、リツ。\""
"80000136-11-リツ" = "へへっ。"
"80000136-12-リツ" = "っていうか、よく分かったね？"
"80000136-13-リツ" = "どうしてボクのだと思ったの？"
"80000136-14" = "[ns] \"なんたって私は、先生だからね。\""
"80000136-15" = "[ns] \"……あのチョコレート、どうやって保管しよう。\""
"80000136-16-リツ" = "それについては大丈夫！"
"80000136-17-リツ" = "心配ご無用だよ、先生！"
"80000136-18" = "[s] \"どういうこと？\""
"80000136-19-リツ" = "冷蔵庫に入れなくても良いの。"
"80000136-20-リツ" = "たとえどれだけ暑い夏が来てもOK！"
"80000136-21-リツ" = "なにせあのチョコ――"
"80000136-22-リツ" = "絶対に溶けないから！"
"80000136-23" = "[s1] \"どういうこと！？\"\n[s2] \"謎技術……！？\""
"80000136-24-リツ" = "触ってみればわかるよ！ほら、先生！"
"80000136-25" = "（促されるまま、慎重に触れてみると……）"
"80000136-26" = "[ns] \"こ、これは……！\""
"80000136-27-リツ" = "ふふっ……そういうこと！"
"80000136-28" = "[s] \"なるほど、そりゃ溶けないわけだ。\""
"80000136-29" = "[ns] \"石で作ったチョコレー……ト？\""
"80000136-30-リツ" = "そう！#n茶色の大理石で作ったの！"
"80000136-31-リツ" = "どうどう？びっくりした？"
"80000136-32" = "[s3] \"二重にびっくりしたよ……。\"\n[s4] \"見た目じゃ石だって分からなかったし……。\""
"80000136-33-リツ" = "へへ、褒められちゃった！"
"80000136-34-リツ" = "……？あ、作り方？"
"80000136-35-リツ" = "仕方ないなー、先生にだけ特別だよ？"
"80000136-36-リツ" = "一から十まで説明してあげる！"
"80000136-37" = "（こうして、チョコ（？）を観察しながら彫刻について教えてもらうことに）"
"80000136-38" = "（それにしても……）"
"80000136-39" = "[ns5] \"ここまでどうやって入ってきたの、リツ？\"\n[ns6] \"普通はセキュリティが作動するはずだけど……。\""
"80000136-40-リツ" = "え？#n通気口から！"
"80000136-41" = "（……リツが帰ってから、セキュリティを見直した）"
