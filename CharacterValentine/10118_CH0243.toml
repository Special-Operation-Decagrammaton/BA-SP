[translation]
"80000128-1" = "意外なプレゼント"
"80000128-2" = "（いつも通り、作業をしていた時……）"
"80000128-3" = "[ns] \"疲れたな……。\""
"80000128-4-？？？" = "先生、いるー？"
"80000128-5-ノゾミ" = "お、いるじゃーん。"
"80000128-6" = "[s] \"あっ、ノゾミ……。\""
"80000128-7-ノゾミ" = "パヒャヒャッ、なんか死にかけ？"
"80000128-8-ノゾミ" = "ま、どうせそんなことだろうと思ったけど。"
"80000128-9-ノゾミ" = "というわけで……。"
"80000128-10-ノゾミ" = "はい、これ。"
"80000128-11-ノゾミ" = "大したものじゃないけど、疲労回復に効くらしいよ。"
"80000128-12-ノゾミ" = "チョコはもうもらってるだろうし、どうせ仕事で忙しくしてるんじゃないかなって……。"
"80000128-13-ノゾミ" = "それならグミの方が食べやすいよね、パヒャ！"
"80000128-14" = "[ns] \"ノゾミ……っ！\""
"80000128-15-ノゾミ" = "うわっ、何その顔。"
"80000128-16-ノゾミ" = "感動したーって、顔に書いてあるよ？"
"80000128-17-ノゾミ" = "別にそれ、私の手作りとかじゃないんだけど？"
"80000128-18-ノゾミ" = "パヒャッ！#n先生って、意外とこういうのに弱いよね。"
"80000128-19-ノゾミ" = "じゃ、ちゃんと食べてよ？"
"80000128-20-ノゾミ" = "ついでにちょっと寄っただけだし、もう行くね。"
"80000128-21-ノゾミ" = "もう少しサボってもいいかなーって思ったけど、今日も忙しそうだし。"
"80000128-22-ノゾミ" = "え？まだいていいの？"
"80000128-23-ノゾミ" = "なに？#n一緒に遊んでくれる感じ？"
"80000128-24" = "[s] \"仕事なら、いつでもできるからね！\""
"80000128-25-ノゾミ" = "パヒャヒャッ！そうこなくっちゃ！"
"80000128-26-ノゾミ" = "よーし、それじゃ……。"
"80000128-27-ノゾミ" = "……何して遊ぼっか？"
"80000128-28" = "（仕事のことは忘れて、ノゾミと全力で遊んだ）"
"80000128-29" = "（ノゾミはその後ストレス解消のお礼に、遅くまで仕事を手伝ってくれた）"
