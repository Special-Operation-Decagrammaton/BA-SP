[translation]
"80000064-1" = "バレンタインも楽しく"
"80000064-2" = "（アスナから連絡を貰って、時折C&Cの部室としても使っているという講義室を訪れた）"
"80000064-3" = "（電気は点いていたが、誰の姿も見当たらない）"
"80000064-4" = "[s1] \"……アスナ？\"\n[s2] \"……あれ？\""
"80000064-5-？？？" = "やっほーーーーーっ！！"
"80000064-6-？？？" = "やっほーーーーーっ！！"
"80000064-7-アスナ" = "じゃじゃーん、アスナ登場！！お待たせご主人様！"
"80000064-8" = "[s3] \"びっくりした……！？\"\n[s4] “アスナ！？”"
"80000064-9-アスナ" = "あははっ。ご主人様、びっくりした？サプライズ大成功ー！"
"80000064-10-アスナ" = "あははっ。ご主人様、びっくりした？サプライズ大成功ー！"
"80000064-11-アスナ" = "ん、私？うん、ずっとここの下に。ご主人様をびっくりさせて楽しませたいなって思って！"
"80000064-12-アスナ" = "あ、ところでご主人様は今日が何の日か知ってるよね？"
"80000064-13" = "[s5] \"バレンタインデーだよね？\"\n[s6] \"チョコを送り合う日？\""
"80000064-14-アスナ" = "うん、そうそう！ってことは、この後の展開は分かってるよね？"
"80000064-15-アスナ" = "うん、そうそう！ってことは、この後の展開は分かってるよね？"
"80000064-16-アスナ" = "っていうわけで～……"
"80000064-17" = "[ns7] \"あ、アスナ……！？\"\n[ns8] \"……待って。今どこから取り出した……？\""
"80000064-18-アスナ" = "……ご主人様？どうしたの？"
"80000064-19-アスナ" = "……ご主人様？どうしたの？"
"80000064-20-アスナ" = "チョコレートだよ！アスナからの、バレンタインチョコ！"
"80000064-21-アスナ" = "あっ、せっかくだし、アスナが直接ご主人様に食べさせてあげよっか？"
"80000064-22-アスナ" = "はいご主人様、あ～ん！"
"80000064-23-アスナ" = "……んー？"
"80000064-24-アスナ" = "どうしたの、ご主人様？何でそんな顔してるの？"
"80000064-25-アスナ" = "なーに、照れてるの？大丈夫だって、可愛いなあ。"
"80000064-26-アスナ" = "ほらほら、今日はバレンタインデーだから。ご主人様はアスナからのバレンタインチョコを味わってもらわないと。"
"80000064-27-アスナ" = "……ご主人様？"
"80000064-28" = "[s] 何歩か後ろに下がる。"
"80000064-29-アスナ" = "……あれ、もしかして急に鬼ごっこ始まる感じ？"
"80000064-30-アスナ" = "あはっ、じゃあアスナが鬼ね！捕まったらちゃーんと食べてよ？"
"80000064-31-アスナ" = "よーい、スタート！！"
"80000064-32" = "（……結局捕まってしまい、恥ずかしいやら何やらの感情を抱えながらも、アスナが胸から取り出したチョコを頂くことになった）"
