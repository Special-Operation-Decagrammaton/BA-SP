[translation]
"80000004-1" = "アロナからのバレンタインチョコです！"
"80000004-2" = "アロナの教室"
"80000004-3-アロナ" = "先生、お疲れ様です！"
"80000004-4-アロナ" = "新しい年になってから、もうひと月以上も経ったんですね……。"
"80000004-5-アロナ" = "ところで先生は、今日が何の日かご存知ですか？"
"80000004-6" = "[s] \"バレンタインデー！\""
"80000004-7-アロナ" = "はい、大正解です！"
"80000004-8-アロナ" = "今日はバレンタインデー……大切な誰か、そして大好きな相手にチョコをプレゼントするロマンチックな日です。"
"80000004-9-アロナ" = "というわけで……ふふっ。今日はアロナも、大好きな先生のために手作りチョコを作りました！"
"80000004-10-アロナ" = "えっとー……。"
"80000004-11-アロナ" = "じゃーん！"
"80000004-12-アロナ" = "いかがですか、先生？"
"80000004-13-アロナ" = "これ、何の形か分かります？"
"80000004-14" = "[s1] \"これ、もしかして……\"\n[s2] \"私？\""
"80000004-15-アロナ" = "はい、そうです！"
"80000004-16-アロナ" = "はい、そうです！"
"80000004-17-アロナ" = "アロナと先生の形で焼いて作った、特製のチョコジンジャークッキーです！"
"80000004-18-アロナ" = "これ、可愛いと思いません？"
"80000004-19-アロナ" = "まずジンジャークッキーを作ってから、その上にホワイトチョコレートをかけたんです。"
"80000004-20-アロナ" = "そのせいか、ちょっと手にジンジャーの香りが残ってしまった感じもありますが……。"
"80000004-21-アロナ" = "先生のために、早起きして頑張って作ったんですよ！"
"80000004-22-アロナ" = "アロナが一生懸命作ったプレゼント、大切に食べてくださいね！"
