[translation]
"80000061-1" = "大切な時、大切な場所"
"80000061-2" = "（ゲヘナ学園の風紀委員会の教室に入ると、すぐにチナツの姿を見つけた）"
"80000061-3-チナツ" = "……あ、先生。ご足労いただきありがとうございます。"
"80000061-4-チナツ" = "ちなみに、他の方は今日誰もいません。今日は私ひとりでお留守番なので。"
"80000061-5-チナツ" = "あ、その……。"
"80000061-6-チナツ" = "狙ったと言いますか、それで気を遣わせたり、気を遣ってもらったりというわけでは、その……。"
"80000061-7-チナツ" = "ないわけでは、ないのですが……。"
"80000061-8-チナツ" = "とにかく先生、これを。"
"80000061-9" = "[ns1] \"……チョコレート？\"\n[ns2] \"フォーチュンクッキー？\""
"80000061-10-チナツ" = "はい。チョコレート味のフォーチュンクッキーです。"
"80000061-11-チナツ" = "はい。チョコレート味の、です。"
"80000061-12-チナツ" = "……え？"
"80000061-13-チナツ" = "これを選んだ理由、ですか？"
"80000061-14-チナツ" = "その、もちろんバレンタインだからというのもありますし……。"
"80000061-15-チナツ" = "それに、感謝の気持ちを、好意を……。"
"80000061-16-チナツ" = "今日それを正確に伝えるのは難しいと言いますか……その、良くも悪くも伝わってしまいすぎる懸念があると言いますか……。"
"80000061-17-チナツ" = "いえその、決して嫌ですとか、それを望ましく思わないわけではないのですが……"
"80000061-18-チナツ" = "……。"
"80000061-19-チナツ" = "ごめんなさい、気にしないでください……とりあえず、こちらをどうぞ……。"
"80000061-20" = "[s3] \"ありがとね、いただきます。\"\n[s4] フォーチュンクッキーを一つ開ける。"
"80000061-21-チナツ" = "えっと、何が出ましたか？念のため、私も見ても良いです……？"
"80000061-22-チナツ" = "……なるほど。"
"80000061-23-チナツ" = "「The time to be happy is now. The place to be happy is here」……"
"80000061-24-チナツ" = "今が幸せな時間で、ここが幸せな場所……"
"80000061-25-チナツ" = "良い言葉だと思いませんか？これはまさに、今の私たちを……"
"80000061-26" = "[s5] \"うん、すごく良いね。ちなみにだけど……\"\n[s6] \"他のも開けてみて良い？\""
"80000061-27-チナツ" = "……えっ！？そっ、それはあの……！"
"80000061-28-チナツ" = "……えっ！？そっ、それはあの……！"
"80000061-29-チナツ" = "せ、先生！少々お待ちを、その……っ！！"
"80000061-30" = "[ns7] \"The time to be happy is now. The place to be happy is here……。\"\n[ns8] \"……同じ紙？\""
"80000061-31-チナツ" = "そ、それは……えっと……。"
"80000061-32-チナツ" = "そ、それは……えっと……。"
"80000061-33-チナツ" = "や、やめてください！？それ以上開けられてしまうと……！"
"80000061-34-チナツ" = "え、同じ内容？それは、その……"
"80000061-35" = "[s9] \"もしかして、全部？\"\n[s10] \"チナツ、これって……\""
"80000061-36-チナツ" = "……。"
"80000061-37-チナツ" = "……。"
"80000061-38-チナツ" = "……お疲れ様ですっ！！"
"80000061-39" = "[ns] \"チナツ！？\""
"80000061-40" = "（その後何とかチナツに追いついて、ちゃんと落ち着いてお話をした）"
