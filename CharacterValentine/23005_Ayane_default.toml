[translation]
"80000014-1" = "意図してないプレゼント"
"80000014-2" = "シャーレ・オフィス"
"80000014-3-アヤネ" = "おはようございます、先生。"
"80000014-4-アヤネ" = "シャーレに来るまでの電車が遅延してて……少し遅れてしまいました、すみません……。"
"80000014-5" = "[s] \"ううん、5分くらい全然気にしないで。\""
"80000014-6-アヤネ" = "そうだ、来るときに急いで買ったのですが……。"
"80000014-7-アヤネ" = "チョコレートです、どうぞ召し上がってください。"
"80000014-8" = "[s] \"これって……。\""
"80000014-9-アヤネ" = "先生にはいつもお世話になっておりますので。"
"80000014-10-アヤネ" = "それにこの前、最近はいくら寝ても疲れがとれないとおっしゃってましたよね？"
"80000014-11-アヤネ" = "チョコレートに含まれるカフェインなどの成分は、疲労回復に効果があるそうなので。忙しい時などにどうぞ。"
"80000014-12-アヤネ" = "今日は何故か駅前にチョコレートがたくさん売られてて、先生のことを思い出して買ったのですが……今思うとどうして……"
"80000014-13-アヤネ" = "……え？バレンタイン……？"
"80000014-14-アヤネ" = "あ、そういえば今日はバレンタインデー……では、今私がお渡ししたチョコレートはバレンタインチョコ……"
"80000014-15-アヤネ" = "え、えっと、これは、だから、そういう気持ちでお渡ししたのではなくて……！"
"80000014-16-アヤネ" = "いえ、先生にそんな気持ちがないと言うのは嘘になりますが……じゃなくて！"
"80000014-17-アヤネ" = "これはその、無意識と言いますか……！"
"80000014-18-アヤネ" = "も、もちろんそういう意味で受け取っていただいても問題は無いと言いますか、それはそれで嬉しいのですが……"
"80000014-19-アヤネ" = "も、もし対策委員会のみんなにこの事実が知られたら……。"
"80000014-20-アヤネ" = "きっと「へぇ～、アヤネちゃんはそうやっておとなしい感じでいて、朝から当番のタイミングを狙ったりする子だったんだ～。やるねぇ～？」みたいな視線で……"
"80000014-21-アヤネ" = "も、もちろん先生が秘密にしてくださるのであれば……いや、話されてもそれはそれで……？"
"80000014-22" = "（その後も慌てるアヤネを何とか落ち着かせながら、のんびりとチョコレートを食べた。）"
