[translation]
"80000036-1" = "最高のチョコレートを作る方法"
"80000036-2-？？？" = "…………。"
"80000036-3-？？？" = "あ、先生。そこ、足元気を付けて……！"
"80000036-4" = "[s] \"了解。\""
"80000036-5-？？？" = "ふふっ。たとえ闇の中でも、食べ物に関することだったら何でもお見通し……。"
"80000036-6-？？？" = "たぶんこの辺に……"
"80000036-7-？？？" = "あっ、発見！"
"80000036-8-イズミ" = "おー、誰もいない！変な感じ！"
"80000036-9-イズミ" = "よし、これなら貸し切りで使えそうだね！"
"80000036-10" = "[s1] \"とりあえずついて来たものの……。\"\n[s2] \"イズミ、今日はこれ何のために……？\""
"80000036-11-イズミ" = "そりゃあだって、"
"80000036-12-イズミ" = "そりゃあだって、"
"80000036-13-イズミ" = "今日はバレンタインデーでしょ？"
"80000036-14" = "[s] \"うん、そうだね。\""
"80000036-15-イズミ" = "だからだよ！"
"80000036-16-イズミ" = "先生と一緒に、最高のバレンタインチョコを作る！"
"80000036-17-イズミ" = "さあ始めよう、先生！あんまり時間も無いよ！"
"80000036-18" = "[ns] \"……え？\""
"80000036-19-イズミ" = "せっかくのバレンタインデーなんだから、最高のチョコレートが食べたいって思うのは当然でしょ？"
"80000036-20-イズミ" = "でもただ口を開けて待ってるだけで、それが来てくれるわけじゃない。"
"80000036-21-イズミ" = "なんたって私は美食研究会、自分の手でその先にある理想をつかみ取らないと！"
"80000036-22-イズミ" = "それに最高のチョコレートはやっぱり一人で食べるんじゃなくて、誰かと一緒に食べるのが良いでしょ？"
"80000036-23" = "[s] \"イズミ……！\""
"80000036-24-イズミ" = "というわけで、もう材料は準備しておいたの！"
"80000036-25-イズミ" = "まずは、職人さん御用達の特製醤油！"
"80000036-26" = "[s] \"……醬油？\""
"80000036-27-イズミ" = "うん！チョコレートのあの美しい光沢を出すためにはやっぱりこれでしょ？"
"80000036-28-イズミ" = "あと最近はチョコレート界の流行として、フルーツ系のチョコレートが流行ってるらしいの！"
"80000036-29-イズミ" = "それでフルーツのことを色々調べてみたんだけど……"
"80000036-30" = "[ns] \"この匂いは……！\""
"80000036-31-イズミ" = "じゃーん、フルーツの王様「ドリアン」！"
"80000036-32-イズミ" = "でもこれだけじゃちょっと寂しいし……"
"80000036-33-イズミ" = "何か似たようなのが無いかなって思って探してたら、"
"80000036-34-イズミ" = "「魚の王様」って言うのもあったの！"
"80000036-35-イズミ" = "じゃじゃーん、「鯛」！たしかビタミンが豊富で、健康にも良いんだって！"
"80000036-36-イズミ" = "美味しいチョコレートで、かつ健康にも良かったら、それはまさに最強のチョコレート！"
"80000036-37-イズミ" = "ってわけで材料も揃ったことだし、作ろっか！"
"80000036-38" = "[s] \"不安しかない！！\""
"80000036-39" = "（そうしてイズミと一緒に、最強のチョコレート（？）作りが始まった）"
"80000036-40-イズミ" = "完成ー！見て見て、先生！"
"80000036-41-イズミ" = "じゃあ最初の一口は、先生にあげる！"
"80000036-42-イズミ" = "最高の材料で作ったんだし、きっと味も最高だよ！"
"80000036-43" = "[s3] （イズミが頑張って作ってくれたチョコレート……）\n[s4] \"い、いただきます……！\""
"80000036-44" = "[ns] \"こ、これは……！\""
"80000036-45" = "（脂身が豊富でまろやかな舌触りの鯛、その風味を邪魔しすぎない絶妙な味わいの醤油……）"
"80000036-46" = "（そしてドリアンの独特な風味がなぜかその味を引き立て、まさかのハーモニーが……！）"
"80000036-47" = "[s] \"……美味しい！チョコじゃない気がするけど！\""
"80000036-48-イズミ" = "やったー！"
"80000036-49-イズミ" = "やっぱり何でも挑戦あるのみだね、これぞ美食への道！"
"80000036-50" = "[s] \"確かにそうかも。ありがとう、イズミ。\""
"80000036-51-イズミ" = "ううん、どういたしまして！ほらほら、まだたくさんあるから。一緒に食べよう！"
"80000036-52-イズミ" = "はい、あーん……先生、ハッピーバレンタイン！"
"80000036-53" = "（そうやってイズミと、ちょっと変わったバレンタインデーを一緒に過ごした）"
