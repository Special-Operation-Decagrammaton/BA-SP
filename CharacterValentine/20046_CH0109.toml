[translation]
"80000131-1" = "少女は箱を開けぬまま"
"80000131-2" = "[log=니야]親愛なる先生へ[/log]"
"80000131-3" = "[log=니야]ご無沙汰しております[/log]"
"80000131-4" = "[log=니야]この度はお伝えしたいことがあり、ご連絡いたしました[/log]"
"80000131-5" = "[log=니야]いつも通り、陰陽部の部室でお待ちしております[/log]"
"80000131-6" = "[log=니야]陰陽部部長、天地ニヤより[/log]"
"80000131-7-ニヤ" = "――という連絡から、1日と経っていないのに。"
"80000131-8-ニヤ" = "こんなに早くお越しいただけるなんて。"
"80000131-9-ニヤ" = "やっぱり、先生は頼りになりますねぇ。"
"80000131-10-ニヤ" = "……実は私に会いたくて仕方なかったから、とか？"
"80000131-11-ニヤ" = "…………。"
"80000131-12-ニヤ" = "にゃはっ、閑話休題。"
"80000131-13-ニヤ" = "私たちの間柄で、今さら探り合いをしてもねぇ。"
"80000131-14-ニヤ" = "言わずとも分かってるでしょう？#n安心してください、それで正解ですから。"
"80000131-15-ニヤ" = "では、どうぞ……気持ちばかりですが。"
"80000131-16" = "[s1] \"す、すごく高そうな……！？\"\n[s2] \"これが粗品……！？\""
"80000131-17-ニヤ" = "まぁまぁ、それはお約束というやつで。"
"80000131-18-ニヤ" = "日頃のお礼だと思ってもらえればと。"
"80000131-19-ニヤ" = "バレンタインを口実にしたかっただけですよ。"
"80000131-20-ニヤ" = "あぁ、中身はしっかりチョコレートですよ？"
"80000131-21-ニヤ" = "そうですねぇ……せっかくですし、ここで開けてみては？"
"80000131-22-ニヤ" = "よし、そうしましょ。さあさあさあ♪"
"80000131-23-ニヤ" = "……どうです？"
"80000131-24-ニヤ" = "本当に、ただのチョコレートだったでしょう？"
"80000131-25-ニヤ" = "……もしかして、ガッカリしました？"
"80000131-26" = "[ns3] \"大事な生徒からの贈り物で、ガッカリなんてしないよ。\"\n[ns4] \"こういうの、ニヤらしいなと思って。\""
"80000131-27-ニヤ" = "にゃはっ！#nそれはそれは、素敵な心意気ですねぇ。"
"80000131-28-ニヤ" = "せっかくですし、お味の評価も頂いても？"
"80000131-29-ニヤ" = "……今、ここで。"
"80000131-30-ニヤ" = "先生なら、可愛い生徒のお願いをまさか……ねぇ？"
"80000131-31" = "[s5] \"それはもちろん。\"\n[s6] チョコレートを口に運ぶ。"
"80000131-32-ニヤ" = "あら……一切の躊躇なしと。"
"80000131-33-ニヤ" = "ちなみにそれ、実は手作りなんですよぉ？"
"80000131-34-ニヤ" = "可愛い生徒の、手作りチョコレート。"
"80000131-35-ニヤ" = "お気に召しましたか？"
"80000131-36-ニヤ" = "……にゃは。到底嬉しそうには見えませんねぇ。"
"80000131-37-ニヤ" = "まぁ、さもありなん。#nダークチョコレートにヨモギをた～っぷり入れましたから、#n相当苦いでしょうねぇ。"
"80000131-38" = "[s7] \"ちゃんと説明してほしいんだけど……。\"\n[s8] \"な、何でこんなことを……！？\""
"80000131-39-ニヤ" = "きっちりしっかりご説明しましょう。"
"80000131-40-ニヤ" = "それは先生が……とても良い方だからですよ。 "
"80000131-41-ニヤ" = "おや……納得いかないご様子。"
"80000131-42-ニヤ" = "では、直截に聞くとしましょう。"
"80000131-43-ニヤ" = "生徒からどう思われているのか、先生は考えたことがおありですか？"
"80000131-44-ニヤ" = "私以外からもきっと、たくさんチョコレートをもらいましたよねぇ？"
"80000131-45-ニヤ" = "……先生ほどの方なら、それはもう。"
"80000131-46-ニヤ" = "誰にでも優しく、気さくで、どんな問題も解決してくれる。"
"80000131-47-ニヤ" = "――まるで、このチョコレートボックスのように。"
"80000131-48-ニヤ" = "しかし、本当にそうでしょうか？#n生徒からの期待に対し、先生は永久に完璧に、応え続けられるのでしょうか？"
"80000131-49-ニヤ" = "にゃはっ……いくら何でも、難しいのでは？#n先生とはいえ、所詮はひとりの人間に過ぎません。"
"80000131-50-ニヤ" = "ですがうら若き少女たちは、ついつい忘れてしまうもの。#n表面だけを見て勘違いを重ね、期待をしてしまうもの……。"
"80000131-51-ニヤ" = "チョコレートを手に取り、甘い夢を見ることでしょう。"
"80000131-52-ニヤ" = "……その果てに、どれだけ苦い経験があるとも知らずに。"
"80000131-53-ニヤ" = "……いえ、責めるつもりなど毛頭ありませんよ？"
"80000131-54-ニヤ" = "先生は、とっても良い方ですから。#n私と違って、裏など無いでしょうし？"
"80000131-55-ニヤ" = "ですが、私はこういう生徒なので。"
"80000131-56-ニヤ" = "苦いチョコは好みません、っと……にゃはは。"
"80000131-57-ニヤ" = "……一つだけ、お願いしても？"
"80000131-58-ニヤ" = "そのチョコの味、忘れないでいてもらえます？"
"80000131-59" = "[ns] \"……うん、分かったよ。\""
"80000131-60" = "[ns9] \"確か、陰陽部にはキッチンがあるよね？\"\n[ns10] \"少し借りてもいい？\""
"80000131-61-ニヤ" = "それは構いませんが……いったい何を？"
"80000131-62" = "[s11] \"ニヤの考えは分かったけど……。\"\n[s12] \"それはそうとして、このチョコレート……。\""
"80000131-63" = "[ns] \"ニヤにも食べてもらおうかな！！\""
"80000131-64-ニヤ" = "そんなぁっ！？"
"80000131-65" = "（残っていたヨモギを見つけて、ニヤのためにチョコレートを作った）"
"80000131-66" = "（しかし分量を間違えて作り過ぎてしまい、結局は二人で食べることに）"
"80000131-67" = "（そのチョコはやはり、とても苦かった……）"
