[translation]
"80000084-1" = "それはまるでラブコメのように"
"80000084-2" = "（バレンタインデー当日、早い時間帯からミチルがシャーレに訪れた）"
"80000084-3-ミチル" = "先生殿、今日はバレンタインデーでしょ？"
"80000084-4" = "[s] \"うん、そうだね。\""
"80000084-5-ミチル" = "これを上手く利用すれば、「少女忍法帖ミチルっち」のチャンネル登録者数を伸ばせると思うの。"
"80000084-6-ミチル" = "だから、もう当日になっちゃったし、急だけど……"
"80000084-7-ミチル" = "今からでもバレンタインデー用の動画を撮って、チャンネルにアップした方が良いかなって！"
"80000084-8-ミチル" = "イベント事に乗っからない手はないでしょ！？"
"80000084-9-ミチル" = "……というわけで、どうかな！先生殿！？"
"80000084-10" = "[s] \"それは良いけど、あれって忍者系のチャンネルなんじゃ……？\""
"80000084-11-ミチル" = "だって、忍者もチョコレート好きだよ？"
"80000084-12" = "[s] \"好き嫌いの問題なの！？\""
"80000084-13-ミチル" = "うにゃっ、とにかくそれでチャンネル登録者が増えるなら良いの！"
"80000084-14-ミチル" = "だから手伝ってー、先生殿～。"
"80000084-15-ミチル" = "バレンタインデーの動画をアップして、今度こそ「少女忍法帖ミチルっち」チャンネルの登録者数も増加！"
"80000084-16-ミチル" = "そのために、ね？お願い！"
"80000084-17" = "[s] \"それじゃあ、一緒に頑張ろっか。\""
"80000084-18-ミチル" = "ほ、本当に！？"
"80000084-19-ミチル" = "さっすがは先生殿～！"
"80000084-20-ミチル" = "困っている生徒を見たら、助けずにはいられないその姿勢！"
"80000084-21-ミチル" = "やっぱり、私が見込んだ次期頭領は違うね！"
"80000084-22" = "[s1] \"頭領は初耳だけど……ところで、何を手伝えば良い？\"\n[s2] \"動画の内容は決まってるの？\""
"80000084-23-ミチル" = "あ、そこは大丈夫！"
"80000084-24-ミチル" = "あ、そこは大丈夫！"
"80000084-25-ミチル" = "このミチル部長による、完璧な企画と台本があるから！"
"80000084-26" = "[s] \"あれ、困ってた割に準備が良いね……？\""
"80000084-27-ミチル" = "……ん？"
"80000084-28-ミチル" = "うにゃっっ！"
"80000084-29-ミチル" = "そそっ、それは……！"
"80000084-30-ミチル" = "私くらいの忍者ともなれば、これくらい朝飯前だから！あと部長だから！"
"80000084-31-ミチル" = "と、とにかく今日の撮影は、私に任せて……！"
"80000084-32" = "[s] \"うん、了解。\""
"80000084-33-ミチル" = "（よ、よし……これでまずは、先生殿を連れ出すのに成功したから……）"
"80000084-34-ミチル" = "（あとは隙を見て「コレ」を……！）"
"80000084-35-ミチル" = "それじゃ、レッツスタートー！"
"80000084-36" = "（そうしてミチルの指示で、バレンタイン用の動画撮影が始まった）"
"80000084-37-ミチル" = "じゃあ最初は……とある路地の曲がり角で、2人がドーンってぶつかるシーンから！"
"80000084-38" = "[s] \"いきなり何故……。\""
"80000084-39-ミチル" = "まあまあ、やってみれば分かるよ！"
"80000084-40-ミチル" = "とにかく今から私たちが撮るのは、バレンタインデーに因んだ動画！"
"80000084-41-ミチル" = "ふふっ……タイトルは「バレンタインデーにラブコメシチュを再現してみた！」かな！"
"80000084-42" = "[s] \"……忍者要素は？\""
"80000084-43-ミチル" = "あっ、そ、それは……！"
"80000084-44-ミチル" = "うーん、それなら普通のラブコメじゃなくて……"
"80000084-45-ミチル" = "「忍者ラブコメ」ってことにすれば、まったく問題ないよね！"
"80000084-46" = "[s] \"そ、それで良いなら……。\""
"80000084-47-ミチル" = "まずはやってみよう！私があっちの曲がり角から走ってくるから……"
"80000084-48-ミチル" = "私が大きな声で合図したら、先生殿はここから走り始めて？"
"80000084-49-ミチル" = "先生殿、良いよー！"
"80000084-50" = "（ミチルの声を聞いて、気を付けながら走り出すと……）"
"80000084-51" = "おりゃああっ！！"
"80000084-52-ミチル" = "（ぶつかる瞬間、気付かれないように「コレ」を先生殿のポケットに忍ばせて……！）"
"80000084-53" = "……ん！？ちょ、ちょっと！？何でバナナの皮がっ……！？"
"80000084-54" = "う、うわあぁぁぁっ！？"
"80000084-55" = "[ns] \"ミ、ミチル！大丈夫！？\""
"80000084-56-ミチル" = "もー、誰ぇ！？こんなところにバナナの皮を捨てたのは！"
"80000084-57-ミチル" = "危ないじゃん！？これのせいで失敗しちゃったし！"
"80000084-58" = "[s] \"まあ、そもそも見通しの悪い道で走るのは危ないから……。\""
"80000084-59-ミチル" = "正論！？"
"80000084-60-ミチル" = "うーん……でも確かに先生の言う通り危険だし、ネタが古すぎるかも……。"
"80000084-61-ミチル" = "じゃ、じゃあ次……まだまだあるから！"
"80000084-62-ミチル" = "次の「忍者ラブコメ」をやるよ！"
"80000084-63" = "（その後もミチルと共に、色々な「ラブコメシチュエーション」……もとい「忍者ラブコメシチュエーション」に挑戦した）"
"80000084-64-ミチル" = "今度は幼馴染の「先生殿くん」が風邪でお休みしたシチュエーションね！"
"80000084-65-ミチル" = "……良し。"
"80000084-66-ミチル" = "先生殿くん！お粥、作ってきたよ～。#nあっ、そのまま横になってて！"
"80000084-67-ミチル" = "君には早く元気になってほしいから、私が食べさせてあげる……！"
"80000084-68" = "[s] \"えっと……そのお粥、真っ黒だけど……。\""
"80000084-69" = "[ns] \"あと、すごく焦げ臭いような……？\""
"80000084-70-ミチル" = "ぐっ、シチュエーションに固執するあまり、凄い状態に……！"
"80000084-71-ミチル" = "つ、次こそ大丈夫だから！"
"80000084-72-ミチル" = "あの、私……。#n先生殿先輩に、渡したい物があるんです！"
"80000084-73-ミチル" = "先生殿先輩が次の大会で優勝したら、その時は……。#nそこの桜の木の下に埋めておいた、あの日のタイムカプセルを一緒に……！"
"80000084-74" = "[s] \"設定が複雑！！\""
"80000084-75-ミチル" = "た、確かにそうかも……！？"
"80000084-76-ミチル" = "と、とにかく次！"
"80000084-77-ミチル" = "次こそ……！"
"80000084-78" = "（その後もミチルが考えたシチュエーションを、次々に再現していったものの……）"
"80000084-79" = "（どれも邪魔が入ったり、事故が起きてしまい……）"
"80000084-80" = "（満足いく映像が撮れないまま、いつの間にか日が暮れていた）"
"80000084-81-ミチル" = "むー……。"
"80000084-82" = "[s] \"ミチル、大丈夫？\""
"80000084-83-ミチル" = "だ、大丈……"
"80000084-84-ミチル" = "……ばないかも……身体が限界に近い……。"
"80000084-85" = "[s] \"それなら少し休憩しようか。喉は乾いてる？\""
"80000084-86-ミチル" = "う、うん……ありがとう、先生殿ぉ……。"
"80000084-87-ミチル" = "うっ……"
"80000084-88-ミチル" = "うわ～～～ん！上手く行かないよー！"
"80000084-89-ミチル" = "バレンタインデーのために用意した、とっておきの作戦――"
"80000084-90-ミチル" = "私の「自然にシュバッと作戦」が……！"
"80000084-91" = "[s3] \"やっぱり、そのために来てくれたんだね。\"\n[s4] \"そんな気はしてたけど……。\""
"80000084-92-ミチル" = "……へ？"
"80000084-93-ミチル" = "……へ？"
"80000084-94-ミチル" = "せ、せ、先生殿ぉぉおおお！？ななな、なんで！？"
"80000084-95-ミチル" = "の、飲み物を買いに行ってくれたんじゃ！？"
"80000084-96" = "[s] \"何を飲みたいか、聞き忘れてたなって思って……。\""
"80000084-97-ミチル" = "それで……どっ、どこから聞いて……！"
"80000084-98" = "[s] \"うわ～～～ん！から……。\""
"80000084-99-ミチル" = "う、うぅっ……ほぼ最初からなんて……！"
"80000084-100-ミチル" = "もう、こうなったら……！"
"80000084-101-ミチル" = "そうだよ！今日、先生殿を呼んで動画を撮ろうって言ったのは……"
"80000084-102-ミチル" = "最初から、チョコレートを渡すため！"
"80000084-103-ミチル" = "いつも忍術研究部を助けてくれる先生に……"
"80000084-104-ミチル" = "か、か……感謝の気持ちを伝えたいにゃっ――"
"80000084-105" = "[s] \"だ、大丈夫……？\""
"80000084-106-ミチル" = "ううぅ、大事なところで噛んだ……！"
"80000084-107" = "[s] \"でもチョコレートなら、普通に渡してくれても……。\""
"80000084-108-ミチル" = "なっ！？なんて恐ろしい発言を！？"
"80000084-109-ミチル" = "バレンタインデーのチョコレートを、「普通」に渡すなんて……！"
"80000084-110-ミチル" = "そんな甘々なラブコメみたいなこと……わわ、私に出来るわけないでしょぉ！？"
"80000084-111-ミチル" = "そういうのは「陽の者」がやることだから！#n私みたいなのには無理だよ！"
"80000084-112" = "[s] \"すごく偏った先入観が……。\""
"80000084-113-ミチル" = "うぅぅ……"
"80000084-114-ミチル" = "変な形で、全部バレちゃった……"
"80000084-115-ミチル" = "それに、先生殿に色々と迷惑を……"
"80000084-116" = "[s] \"大丈夫だよ。むしろ楽しかったし。\""
"80000084-117-ミチル" = "そ、そう？なら良かったけど……"
"80000084-118-ミチル" = "……って！安心しかけたけど、それどういう意味の「楽しかった」かなぁ！？"
"80000084-119-ミチル" = "私の独り相撲が面白かったってことだったりしない！？"
"80000084-120-ミチル" = "うぅ……もう良い！吹っ切れた！"
"80000084-121-ミチル" = "はい、これ！あげる！"
"80000084-122-ミチル" = "日頃の感謝を込めて、特別にオーダーメイドしたから！#n受け取って！"
"80000084-123" = "[s] \"ありがとね、ミチル。\""
"80000084-124-ミチル" = "うにゃあああ～っ！#n今日は本当に、私らしくない一日だった……"
"80000084-125-ミチル" = "こんなに遠回りして……結局、普通に渡すことになるなんて……"
"80000084-126-ミチル" = "……いや、むしろこれが私らしい、のかな……？"
"80000084-127" = "[s] \"でも、よく考えてみると……\""
"80000084-128-ミチル" = "……？"
"80000084-129" = "[s] \"2人で夕焼けを見ながらチョコを、って……\""
"80000084-130" = "[ns] \"いかにも定番で「普通」の、バレンタインっぽくない？\""
"80000084-131-ミチル" = "……え？"
"80000084-132-ミチル" = "あ。あは、はは、ははっ……"
"80000084-133-ミチル" = "……うにゃあぁっ！@##$！@#$！！！"
"80000084-134" = "[ns] \"あっ……行っちゃった。\""
"80000084-135" = "（小さくなっていく背中を見つめながら、冷たい風に肩を縮めたが……）"
"80000084-136" = "（ミチルがくれたチョコレートからは、ほのかな温もりを感じた）"
