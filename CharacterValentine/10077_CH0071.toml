[translation]
"80000094-1" = "年頃の女の子"
"80000094-2-イチカ" = "あ、先生～！"
"80000094-3-イチカ" = "こっちこっち～！"
"80000094-4-イチカ" = "あはは！こんにちは！#n今日はせっかく時間を取ってもらったので、シートを持ってきておいたんすよ。"
"80000094-5-イチカ" = "……え？#n何かあるのか……？"
"80000094-6-イチカ" = "いやぁ、今日が何の日か忘れたなんて言わせないっすよ。"
"80000094-7-イチカ" = "バレンタインっすよ！#nバレンタインデー！"
"80000094-8-イチカ" = "先生も本当は分かってたんじゃないすか？#n恥ずかしがらなくてもいいっすよ、ひひっ。"
"80000094-9-イチカ" = "というわけで……"
"80000094-10-イチカ" = "……じゃじゃーん！！"
"80000094-11" = "[s1] \"ありがとう、イチカ。\"\n[s2] \"嬉しいよ、頂くね。\""
"80000094-12-イチカ" = "…………。"
"80000094-13-イチカ" = "……あれ？"
"80000094-14-イチカ" = "……えっと……そんなあっさり受け取っちゃうんすか？"
"80000094-15-イチカ" = "もう少しこう……何か……"
"80000094-16-イチカ" = "……え？"
"80000094-17-イチカ" = "いや……別にリアクションを期待していたとかではないんすけど……"
"80000094-18-イチカ" = "……はは。#nそういう風に言われるとちょっと恥ずかしいっすね。"
"80000094-19-イチカ" = "でも、遠回しな言い方をされるより好きっす。"
"80000094-20-イチカ" = "……本当は、手作りかくらいは聞かれると思ったんすけど。"
"80000094-21-イチカ" = "……え？"
"80000094-22-イチカ" = "……最初から手作りだと思ってた？"
"80000094-23-イチカ" = "えっと……それは、そう……なんす、けど……"
"80000094-24-イチカ" = "はぁ～"
"80000094-25-イチカ" = "先生……"
"80000094-26-イチカ" = "今のはちょっとアレっすよ。"
"80000094-27-イチカ" = "そんな言い方されちゃったら、そこで話が終わっちゃうじゃないっすか。"
"80000094-28-イチカ" = "もっと、こう……どう作ったとか、いろいろ話したかったのに。"
"80000094-29-イチカ" = "……これでも年頃の女の子なんすよ、私も。"
"80000094-30-イチカ" = "うーん……"
"80000094-31-イチカ" = "今日ばかりは、謝ってもらってはい終わりとはいかないっすよ。"
"80000094-32-イチカ" = "え？じゃあどうすればいいのかって？"
"80000094-33-イチカ" = "え～、それを私に聞いちゃっていいんすか～？"
"80000094-34-イチカ" = "あとで大変なことになっても知らないっすよ？"
"80000094-35-イチカ" = "……何でもしてくれるんすね？大丈夫っすか？"
"80000094-36-イチカ" = "……大丈夫って言ったのは先生っすよ。"
"80000094-37-イチカ" = "本当に、いいんすよね？"
"80000094-38-イチカ" = "……はは。"
"80000094-39-イチカ" = "まぁ……そうっすね。"
"80000094-40-イチカ" = "そこまで言うなら……"
"80000094-41-イチカ" = "全て先生の責任というか……"
"80000094-42-イチカ" = "……自業自得、ということで？"
"80000094-43-イチカ" = "じゃあ……"
"80000094-44-イチカ" = "……先生？"
"80000094-45-イチカ" = "……口、開けてください。"
