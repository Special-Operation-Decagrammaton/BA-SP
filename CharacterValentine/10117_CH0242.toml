[translation]
"80000127-1" = "ガール・アンド・スナック"
"80000127-2-ヒカリ" = "シャーレにとーちゃーく。"
"80000127-3" = "[s] \"あれ。ヒカリ、今日の当番だっけ？\""
"80000127-4-ヒカリ" = "のんのん。"
"80000127-5-ヒカリ" = "今日は、大好きな人にお菓子をあげる日ー。"
"80000127-6-ヒカリ" = "だから会いに来たー。"
"80000127-7" = "[s] \"涙で前が見えない……。\""
"80000127-8-ヒカリ" = "はい、これー。"
"80000127-9-ヒカリ" = "ちょー最新、フレーミングコンポジションC型chocoボール。"
"80000127-10-ヒカリ" = "すごいでしょー？#n気になってたやつ見つけたの、ラッキー。"
"80000127-11-ヒカリ" = "これで今日のヒカリは、無敵モード。"
"80000127-12-ヒカリ" = "とにかく食べてみてー、はい。"
"80000127-13" = "[ns1] \"カッコイイ……ヒカリ、ありがとう！\"\n[ns2] （chocoボールを受け取った）"
"80000127-14" = "[ns] \"……。\""
"80000127-15" = "[ns3] \"ひとりで食べるのは勿体ないし……。\"\n[ns4] \"誰か一緒に食べてほしいなぁ。\""
"80000127-16" = "[ns] \"ヒカリ、手伝ってくれる？\""
"80000127-17-ヒカリ" = "えっ……！？"
"80000127-18-ヒカリ" = "うん！"
"80000127-19" = "（ヒカリと一緒に、新商品のチョコレートを食べた）"
"80000127-20" = "（あまりの酸味に顔をしかめていると、それを見たヒカリはとても楽しそうに笑ってくれたのだった）"
