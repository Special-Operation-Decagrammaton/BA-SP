[translation]
"80000112-1" = "作戦参謀は負けたくない"
"80000112-2" = "（いつものようにシャーレで仕事をしていると……）"
"80000112-3" = "[ns] \"もしもし。\""
"80000112-4-キキョウ" = "こんにちは、先生。"
"80000112-5-キキョウ" = "今日は百花繚乱として正式な依頼があって連絡したんだけど……"
"80000112-6-キキョウ" = "予定は空いてる？#nまあ、あまり期待はしてないけど。"
"80000112-7" = "[s] \"時間なら大丈夫だよ。\""
"80000112-8" = "[ns] \"それにキキョウより大切な用事なんて無いから！\""
"80000112-9-キキョウ" = "……はぁ。シャーレの業務量くらい、把握してるよ。"
"80000112-10-キキョウ" = "どれだけ忙しくても、生徒の頼みを聞く姿勢は高く買ってるけど……"
"80000112-11-キキョウ" = "私は、あんたに迷惑をかけたり無理をさせたくはない。"
"80000112-12-キキョウ" = "だから、私に気を遣ってるんだとしたら怒るから。#nもう一度、よく考えて答えて。"
"80000112-13" = "[ns1] \"キキョウにそう言ってもらえて嬉しいよ。\"\n[ns2] \"でも、今日は本当に空いてるから心配しないで。\""
"80000112-14-キキョウ" = "……ふん。"
"80000112-15-キキョウ" = "とにかく、問題は無いのね？"
"80000112-16-キキョウ" = "じゃ、待ってるから。"
"80000112-17-キキョウ" = "…………これで先生を呼ぶのには成功した。"
"80000112-18" = "[ns] （………切り忘れてるのかな？）"
"80000112-19-キキョウ" = "先生が来る前に、早く準備をしないと……"
"80000112-20-キキョウ" = "今日は絶対に完璧な作戦を………"
"80000112-21" = "[ns] \"何の話だろう……？\""
"80000112-22" = "（そうして、キキョウに指定された場所へ向かった）"
"80000112-23" = "[ns] \"依頼の内容を聞かせてもらってもいい？\""
"80000112-24-キキョウ" = "ああ、単純な話だよ。"
"80000112-25-キキョウ" = "先生も知っての通り、今日はバレンタインデーでしょう？"
"80000112-26" = "[s] \"そうだね。\""
"80000112-27-キキョウ" = "こういう特別な日は、百鬼夜行で色々なイベントが開かれるの。"
"80000112-28-キキョウ" = "だから今日は、そのイベントを手伝ってもらいたくて。#nこれも百花繚乱として大切な役目だから。"
"80000112-29" = "[s] \"そうだったんだ……頑張るね。\""
"80000112-30-キキョウ" = "やる気になってくれたみたいで良かった。"
"80000112-31-キキョウ" = "じゃ、さっそく向かうよ。"
"80000112-32" = "（こうしてキキョウと一緒に商店街の行事を手伝い始めた）"
"80000112-33" = "（チョコレート作りの体験イベントから……）"
"80000112-34" = "（キヴォトス全自治区チョコレートコンテストを補助したり）"
"80000112-35" = "（バレンタインデーをテーマにした路上俳句バトルの審判を任されたり……）"
"80000112-36" = "（その後も様々なイベントの手伝いで引っ張りだこだった）"
"80000112-37-商店街の住民" = "今日は本当にありがとうございました！"
"80000112-38-商店街の住民" = "キキョウさんと先生が手伝ってくださったおかげで、今回のイベントも大成功です！"
"80000112-39-商店街の住民" = "特に子供たちが、いつも以上に楽しそうな笑顔を見せてくれて！#nよろしければ、またお願いしてもいいでしょうか？"
"80000112-40" = "[s] \"もちろん、喜んでお手伝いします。\""
"80000112-41-キキョウ" = "……良かったね、人気みたいで。"
"80000112-42-キキョウ" = "子供の面倒を見るの、性に合ってるんじゃない？"
"80000112-43-商店街の住民" = "はは！キキョウさんもですよ！"
"80000112-44-商店街の住民" = "それに、お二人がペアで参加していたクイズ大会で連続正解されたときは、「お姉さんカッコいい！」と子供たちみんな大喜びでしたし！"
"80000112-45-商店街の住民" = "そ、それは……たまたま、知ってる問題が多かっただけで。"
"80000112-46" = "[s] \"キキョウ……もしかして照れてるの？\""
"80000112-47-キキョウ" = "……ふん。"
"80000112-48" = "[ns] \"ふぅ、気づいたらこんな時間だね。\""
"80000112-49-キキョウ" = "……そうね、もう日が暮れる時間だもの。"
"80000112-50-キキョウ" = "今日は一日、付き合ってくれてありがとう……先生。"
"80000112-51-キキョウ" = "おかげで、百花繚乱としての役目を果たせた。"
"80000112-52-キキョウ" = "………。"
"80000112-53-キキョウ" = "それで……"
"80000112-54-キキョウ" = "……今日一日、私と一緒に過ごした感想を聞きたいんだけど。"
"80000112-55" = "[s] \"私も、楽しかったよ。\""
"80000112-56-キキョウ" = "……そう。"
"80000112-57-キキョウ" = "………。"
"80000112-58-キキョウ" = "……感想は、それだけ？"
"80000112-59-キキョウ" = "もう少し……他に何か無いの？"
"80000112-60" = "[s] \"え？いや、特には……\""
"80000112-61-キキョウ" = "よく考えてみて、先生。私たちは今日、二人で色々なイベントに参加した。"
"80000112-62-キキョウ" = "そのどれもが……バレンタインに関するもの。"
"80000112-63-キキョウ" = "だから、なんというか自然と……"
"80000112-64-キキョウ" = "何かが頭の中に浮かんだりしたんじゃない？"
"80000112-65-キキョウ" = "遠慮する必要は無い。#nあんたが思ったままの気持ちを言葉にして。"
"80000112-66" = "[s] \"……あ、それなら一つあるよ。\""
"80000112-67-キキョウ" = "やっぱり……そうだと思った。"
"80000112-68-キキョウ" = "さあ、早く言って。"
"80000112-69-キキョウ" = "あんたが何を思って、何を求めてるのか。"
"80000112-70" = "[ns] \"キキョウの役に立てて嬉しかったよ。\""
"80000112-71" = "[ns] \"だから、またいつでも頼ってね。\""
"80000112-72-キキョウ" = "……それが、シャーレの役目だから？"
"80000112-73-キキョウ" = "そう……それで？"
"80000112-74-キキョウ" = "……続きを待ってるんだけど？"
"80000112-75" = "[s] \"えっと……今のが私の気持ちだよ？\""
"80000112-76-キキョウ" = "……そう。"
"80000112-77-キキョウ" = "そうなんだ……ふふ。"
"80000112-78-キキョウ" = "本当に、あんたは私に何も求めてないと……"
"80000112-79-キキョウ" = "そんなの……"
"80000112-80-キキョウ" = "――――信じらんない。"
"80000112-81" = "[ns] \"キキョウ……？\""
"80000112-82-キキョウ" = "私はあれほど念入りに作戦を立てたのに、どうしてあんたは……どうして……"
"80000112-83-キキョウ" = "本当、たったの一度も――"
"80000112-84-キキョウ" = "チョコレートを欲しがるそぶりすら見せないなんて……"
"80000112-85-キキョウ" = "本当に、信じらんない……！"
"80000112-86" = "[s] \"……………………はい？\""
"80000112-87" = "（意図が掴めず、キキョウの真意を聞いてみると……）"
"80000112-88" = "[ns] \"要するに、私たちが手伝ったイベントは全て……\""
"80000112-89-キキョウ" = "……はあ。ここまで話して、もう隠す意味は無いか。"
"80000112-90-キキョウ" = "そうだよ。全部あんたから、ある言葉を引き出すために計画したこと。"
"80000112-91-キキョウ" = "――「チョコレートが欲しい」という一言のために。"
"80000112-92-キキョウ" = "……なのに、あんたは私の気を知らずに……"
"80000112-93" = "[s] \"どうしてこんな遠回りを……？\""
"80000112-94-キキョウ" = "それは……"
"80000112-95-キキョウ" = "あんたから欲しいって言われる前に……"
"80000112-96-キキョウ" = "私からチョコレートを渡したら……"
"80000112-97" = "[s] \"渡したら……？\""
"80000112-98-キキョウ" = "そ、それじゃまるで……"
"80000112-99-キキョウ" = "私が負けたみたいじゃない！"
"80000112-100" = "[s] \"………………。\""
"80000112-101-キキョウ" = "あんたに欲しいって言われたところで、駆け引きをして余裕な表情で渡そうと思ってたのに。"
"80000112-102-キキョウ" = "最後までチョコのチの字すら出てこないなんて……！"
"80000112-103-キキョウ" = "んんん！本当に信じられない！#n分かってる？あんたがどんな過ちを犯したのか！"
"80000112-104" = "[s] \"すごく理不尽じゃありません……？\""
"80000112-105-キキョウ" = "まさか、あんたがここまでの朴念仁だったなんて……"
"80000112-106-キキョウ" = "……はぁ、私はどこで計算を間違えたのか。"
"80000112-107" = "[s] \"あのね、あえて私がチョコを欲しいって言わなかったのは……\""
"80000112-108-キキョウ" = "……ん？何か理由があったとでも？"
"80000112-109-キキョウ" = "電話が繋がったままになってて、たぶんチョコを用意してくれてるのが分かったから……？"
"80000112-110-キキョウ" = "それで、渡されるのを待ってたって……？"
"80000112-111-キキョウ" = "つまり、私の作戦は意味が無かったと……"
"80000112-112-キキョウ" = "…………。"
"80000112-113-キキョウ" = "……っ！"
"80000112-114" = "[s] \"キキョウの気持ちを分かってあげられなくて、ごめん。\""
"80000112-115-キキョウ" = "いや、そもそも私が電話を切っていれば……！"
"80000112-116-キキョウ" = "……あ、待って。#nということは、私からチョコレートがもらえると分かったうえで会いに来たわけで……"
"80000112-117-キキョウ" = "それって要は、楽しみにしてたんじゃ……"
"80000112-118-キキョウ" = "……こほん！"
"80000112-119-キキョウ" = "…………はい。#nあんたの言う通り、これが準備してたチョコレート。"
"80000112-120-キキョウ" = "あんたのためだけに、百花繚乱の作戦参謀が作った特製チョコレートだからね。"
"80000112-121-キキョウ" = "さあ、受け取って。"
"80000112-122" = "[ns] \"うん。キキョウ、ありが……\""
"80000112-123-キキョウ" = "お礼は！"
"80000112-124-キキョウ" = "…………お礼は……ちゃんと、味わってから……"
"80000112-125-キキョウ" = "……味わってから、聞かせて。"
"80000112-126-キキョウ" = "その……今は、こうしてるのも恥ずか……っ。"
"80000112-127-キキョウ" = "感想は、A4用紙10ページ分で送ること！"
"80000112-128" = "[s] \"は、はい……分かりました。\""
"80000112-129-キキョウ" = "……ふん！"
"80000112-130" = "（こうして、紆余曲折を経てキキョウから受け取ったチョコレートは……）"
"80000112-131" = "（……とても、甘かった）"
