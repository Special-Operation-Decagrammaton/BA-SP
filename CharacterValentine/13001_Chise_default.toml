[translation]
"80000046-1" = "あなたのために言葉を一つ"
"80000046-2" = "陰陽部・部室"
"80000046-3" = "（シャーレの仕事の関係もあり、陰陽部の部室を訪れていた）"
"80000046-4-チセ" = "あ、先生～。"
"80000046-5-チセ" = "……どうしてここに？"
"80000046-6" = "[s] \"ちょっと用事があって。ところで今日はチセひとり？\""
"80000046-7-チセ" = "うん、お留守番担当。大事な任務だから。"
"80000046-8-チセ" = "……先生も任務ってことは、私たちお揃い？"
"80000046-9" = "[s] \"確かにそうかも。\""
"80000046-10-チセ" = "うん。じゃあ私も先生の隣で、お留守番頑張る。"
"80000046-11-チセ" = "先生も頑張って、応援してるから。"
"80000046-12" = "[s] \"あ、ありがとう。\""
"80000046-13" = "（そうやってチセと一緒に、仕事を始めた）"
"80000046-14" = "[ns] \"こっちはこれだから……。\""
"80000046-15" = "う～ん、これでもない……。"
"80000046-16" = "これもちょっと違う……。"
"80000046-17" = "[s] \"……チセ？\""
"80000046-18" = "あ、先生？お仕事終わった～？"
"80000046-19" = "……まだ終わってない？大人って大変だね……。"
"80000046-20" = "じゃあはい、これ。"
"80000046-21" = "[s] \"これは……チョコレートのせんべい？\""
"80000046-22" = "うん、先生にあげる。頑張って探すね。"
"80000046-23" = "一緒に頑張ろ～。"
"80000046-24" = "[s] \"あ、うん。そうだね？\""
"80000046-25" = "（そうして仕事を再開したものの、チセの方は……）"
"80000046-26" = "はい、先生。"
"80000046-27" = "先生、どうぞ～。"
"80000046-28" = "はーい。"
"80000046-29" = "あーん。"
"80000046-30" = "（そうしてチセから、かなりの量のチョコを貰いながら仕事をし……）"
"80000046-31-チセ" = "うーん、中々見つからない……。"
"80000046-32" = "[s1] \"チセは、ずっと何を探してるの？\"\n[s2] \"すごい量のチョコレートせんべいが積まれてる……。\""
"80000046-33-チセ" = "あ、これ？"
"80000046-34-チセ" = "あ、これ？"
"80000046-35-チセ" = "これは「四字熟語チョコ煎餅」。"
"80000046-36-チセ" = "中に、四字熟語が書かれた紙が入ってるの。"
"80000046-37" = "[s] \"四字熟語、チョコ、煎餅……？\""
"80000046-38-チセ" = "うん、バレンタインデー記念に。"
"80000046-39-チセ" = "一つ、欲しいのがあって。"
"80000046-40-チセ" = "見つからないな～。"
"80000046-41-チセ" = "あ、出た。"
"80000046-42-チセ" = "これを探してたの、「胡蝶之夢」。"
"80000046-43" = "[s] \"「胡蝶之夢」って確か……。\""
"80000046-44-チセ" = "うん。ある日眠ってると、ちょうちょになる夢を見るの。"
"80000046-45-チセ" = "ちょうちょになる夢……きっとふわふわして、楽しいだろうな。ね、先生？"
"80000046-46" = "[s] \"それはそうかも……？\""
"80000046-47-チセ" = "好きな言葉も見つかったし、チョコも美味しいし。"
"80000046-48-チセ" = "バレンタインデーは良いね～。"
"80000046-49-チセ" = "あ、先生にもこれあげる。"
"80000046-50" = "[ns3] \"あ、ありがとう。\"\n[ns4] \"えっと……「貯蓄万歳」？\""
"80000046-51-チセ" = "うん、貯蓄は大事だから。これも良い言葉だね～♪"
"80000046-52-チセ" = "うん、貯蓄は大事だから。これも良い言葉だね～♪"
"80000046-53" = "[s5] \"そ、そうだね。じっくり蓄えるのは大事……。\"\n[s6] \"これ、四字熟語ではないような……？\""
"80000046-54" = "（それから残りのチョコレートは、チセとおしゃべりをしながら食べた）"
