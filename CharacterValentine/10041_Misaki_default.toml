[translation]
"80000076-1" = "責務とイベントの相関性"
"80000076-2" = "再開発地区・撤去予定のビル"
"80000076-3-ミサキ" = "一応言っておくけど、私はアリウスのみんなを守る立場にある。"
"80000076-4" = "[s] \"うん、知ってるよ。\""
"80000076-5-ミサキ" = "だから今日先生を呼び出したのも、あくまでその延長線上の話。"
"80000076-6-ミサキ" = "まずはそれを覚えておいて。"
"80000076-7" = "[s1] \"肝に銘じるよ。\"\n[s2] \"それで……何をすればいい？\""
"80000076-8-ミサキ" = "まずは……"
"80000076-9-ミサキ" = "まずは……"
"80000076-10-ミサキ" = "……ライフラインの確認から、かな。"
"80000076-11-ミサキ" = "電気、ガス、水道……そういうのきちんと確保されてるか、点検しないと。"
"80000076-12-ミサキ" = "整備の人が来るような場所じゃないから、自分たちでやっておかないといけない。"
"80000076-13-ミサキ" = "それは……大変そう、って顔？"
"80000076-14-ミサキ" = "でもこれが、私たちにとっての日常だから。"
"80000076-15" = "[s3] \"そっか……あ、そういえばさっき電気と水は確認できたよ。\"\n[s4] \"確認としては、それで大丈夫そう？\""
"80000076-16-ミサキ" = "……。"
"80000076-17-ミサキ" = "……。"
"80000076-18-ミサキ" = "意外と鋭いんだね、先生。"
"80000076-19-ミサキ" = "じゃあ、次に移ろう。"
"80000076-20" = "[s5] \"意外かなぁ！？\"\n[s6] \"何もしてないのに最初の仕事が終わった！！\""
"80000076-21-ミサキ" = "騒がないで。大人なのに。"
"80000076-22-ミサキ" = "騒がないで。大人なのに。"
"80000076-23-ミサキ" = "次は……そうだね。"
"80000076-24-ミサキ" = "経路の確認、かな。"
"80000076-25-ミサキ" = "なにしろ、ここは完全な無秩序状態……"
"80000076-26-ミサキ" = "治安で言えば、ある意味アリウス自治区よりも危うい。"
"80000076-27-ミサキ" = "だから万が一に備えて、進入路や退路が確保されてるかどうかを調べる責務がある。"
"80000076-28" = "[s7] \"でも私は、ここまで問題なく来られたよ？\"\n[s8] \"となると、経路は確保できてるんじゃないかな？\""
"80000076-29-ミサキ" = "……。"
"80000076-30-ミサキ" = "……。"
"80000076-31-ミサキ" = "まあ……先生がそう言うなら、そうかもね。"
"80000076-32-ミサキ" = "……何？別に怒ってないけど。"
"80000076-33-ミサキ" = "問題が解決して良かった、って思ってるだけで。"
"80000076-34" = "（その後もミサキと一緒に、様々な「責務」を果たしていった）"
"80000076-35" = "（しかしその大半は、すぐに解決できるものだった……）"
"80000076-36-ミサキ" = "……。"
"80000076-37" = "[s] \"ミサキ、他には何がありそう？\""
"80000076-38-ミサキ" = "予想外……。"
"80000076-39" = "[s] \"……？\""
"80000076-40-ミサキ" = "……何でもない。"
"80000076-41" = "[s] \"でも今――\""
"80000076-42-ミサキ" = "別に、何も言ってないから。"
"80000076-43" = "[s] \"そっか。ところで、ずっと言おうと思ってたんだけど……\""
"80000076-44" = "[ns] \"……ポケットから、何か出てるよ？\""
"80000076-45-ミサキ" = "……！？"
"80000076-46-ミサキ" = "い、いつから！？"
"80000076-47" = "[s9] \"えっと、ミサキが安全点検のために……。\"\n[s10] \"廃ビルに行こう、って言ったあたりから……？\""
"80000076-48-ミサキ" = "……！"
"80000076-49-ミサキ" = "……！"
"80000076-50-ミサキ" = "最悪……。"
"80000076-51" = "[s] \"もしかして、それって……。\""
"80000076-52-ミサキ" = "黙って。"
"80000076-53-ミサキ" = "……。"
"80000076-54" = "（ミサキはしばらく考え込んでいたが、やがてポケットの中のものを差し出してくれた）"
"80000076-55" = "[ns11] \"ミサキからのチョコレートだ！\"\n[ns12] \"ありがとう！大切に食べるよ！\""
"80000076-56-ミサキ" = "はぁ……こんなはずじゃなかったのに……。"
"80000076-57-ミサキ" = "はぁ……こんなはずじゃなかったのに……。"
"80000076-58-ミサキ" = "もういい。せっかくだし……ちゃんと食べてよね。"
"80000076-59-ミサキ" = "とりあえず、今日はそういう日みたいだし。"
"80000076-60-ミサキ" = "先生には、その……少しだけ、お世話になったこともあるから。"
"80000076-61-ミサキ" = "他の意味は絶対、絶対、絶っ対に無いから。#nわかった？"
"80000076-62-ミサキ" = "……本当にわかってる？#nああもう！にやけてないで、返事！"
"80000076-63" = "（顔を真っ赤にして怒るミサキをなだめながら、美味しくチョコレートを食べた）"
