[translation]
"80000092-1" = "ちょっぴり特別な救護用品"
"80000092-2" = "（バレンタイン当日、突然ミネの部屋に呼び出された）"
"80000092-3-ミネ" = "先生、お待ちしておりました。"
"80000092-4-ミネ" = "狭いところですが、どうぞ。"
"80000092-5" = "[ns] （何だか、すごい数のチョコレートがある……）"
"80000092-6-ミネ" = "あっ……その、気になりますか？"
"80000092-7-ミネ" = "実は以前から、医療用品として集めていまして。"
"80000092-8" = "[s] \"チョコレートが、医療用品……？\""
"80000092-9-ミネ" = "はい。存外、きちんとした救護品になり得るのですよ。"
"80000092-10-ミネ" = "実際、チョコレートはキヴォトス各地で救援物資として活用されています。"
"80000092-11-ミネ" = "まず何より、血糖値が下がった時に摂取すれば、それなりに糖分を補えます。"
"80000092-12-ミネ" = "甘い飲料などの方が、効くのは早いのですが……やはり持ち歩きに難がありますので。"
"80000092-13-ミネ" = "それに、高濃度のカフェインによる一時的な覚醒効果がある、靴墨のような形をした製品も存在します。"
"80000092-14-ミネ" = "他にも、茹でたジャガイモよりはマシと言われるオートミール入りの製品なども。"
"80000092-15-ミネ" = "あれは嗜好品とは言い難いですが、カロリー摂取による身体の回復には向いているかと。"
"80000092-16-ミネ" = "そしてこれほど優れたものであれば、救護や医療にも使えるのではないかと思い……"
"80000092-17-ミネ" = "一週間ほど前から、チョコレートを集めるようになったのです。"
"80000092-18" = "[s1] \"なるほど、そう言われるとそうかも……。\"\n[s2] \"救護用品だけど、可愛い包装だね。\""
"80000092-19-ミネ" = "っ！"
"80000092-20-ミネ" = "そ、それは……！"
"80000092-21-ミネ" = "その、市販のお菓子はやはりそういう形式になっているため、と言いますか……！"
"80000092-22" = "[s3] \"あ、卵型のチョコだ。\"\n[s4] \"これ、中に可愛いおもちゃが入ってるやつだよね？\""
"80000092-23-ミネ" = "！！！"
"80000092-24-ミネ" = "そ、そうかもしれませんが、えっと……！"
"80000092-25-ミネ" = "そう、あくまで市場調査です！子どもたちがこんなに大きいチョコレートを与えられたら、ひと飲みして喉が詰まってしまうのではないかなと……！"
"80000092-26" = "[ns5] \"これも可愛い。ホワイトチョコに、レモンのコーティング？\"\n[ns6] \"ミネ、もしかして可愛いの好きだったり？\""
"80000092-27-ミネ" = "……。"
"80000092-28-ミネ" = "そ、それで何か、困ることでも！？"
"80000092-29-ミネ" = "私だって綺麗で可愛いものが好きです！"
"80000092-30-ミネ" = "いっぱい集めたいと思ってしまいます……！そう思っては駄目でしょうか！？"
"80000092-31-ミネ" = "先生もやはり、私には似合わないと思いませんか？普段は面倒なくらい真面目に振舞っておきながら、こんな……"
"80000092-32-ミネ" = "わ、分かっています！ですが、私は……！"
"80000092-33" = "[s7] \"落ち着いて、ミネ。似合わないなんて、そんなことは無いよ。\"\n[s8] \"可愛いは正義だから！\""
"80000092-34-ミネ" = "……本当、ですか？"
"80000092-35" = "[s] \"うん、もちろん。\""
"80000092-36-ミネ" = "……。"
"80000092-37-ミネ" = "申し訳ありません、何だかお恥ずかしい姿を……。"
"80000092-38-ミネ" = "……こんなところをお見せしてしまったのは、先生が初めてです。"
"80000092-39-ミネ" = "こうなったら……！"
"80000092-40" = "（突然、口の中に何かを押し込まれた）"
"80000092-41" = "（甘さと苦さ、そして香ばしさが広がる）"
"80000092-42-ミネ" = "ハッピーバレンタイン、です！"
"80000092-43" = "（ミネはその言葉だけを残し、逃げるようにどこかへ行ってしまった）"
"80000092-44" = "（このまま出ていくわけにも行かず、貰ったチョコレートを味わいながらミネが戻ってくるのを待ち続けた……)"
