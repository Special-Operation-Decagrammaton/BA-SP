[translation]
"80000078-1" = "ギディバのチョコレート"
"80000078-2" = "ブラックマーケットのどこか"
"80000078-3" = "（サオリから連絡を貰い、急いで指定された場所に向かった）"
"80000078-4-サオリ" = "先生、来てくれたんだな。"
"80000078-5-サオリ" = "よかった、「今日」が終わる前に会えて。"
"80000078-6" = "[s] \"サオリ、大丈夫！？\""
"80000078-7-サオリ" = "ああ……大したことではない。"
"80000078-8-サオリ" = "……といっても、この見た目では説得力が無いな。"
"80000078-9-サオリ" = "だが目標を達成するにあたっては、仕方のないことだった。"
"80000078-10" = "[s] \"目標……！？\""
"80000078-11-サオリ" = "言葉の通りだ。"
"80000078-12-サオリ" = "……さあ、受け取ってくれ。"
"80000078-13" = "[ns] \"……チョコレート？それに、すごく高級な……。\""
"80000078-14-サオリ" = "ああ、今日はバレンタインデーだろう？"
"80000078-15-サオリ" = "いつも世話になっている者に、"
"80000078-16-サオリ" = "チョコレートで気持ちを伝える日だと聞いた。"
"80000078-17" = "[s1] \"確かにそうだけど……。\"\n[s2] \"でも、それでどうしてそんなに怪我を……。\""
"80000078-18-サオリ" = "……いつもより難しい依頼で、少しな。"
"80000078-19-サオリ" = "……いつもより難しい依頼で、少しな。"
"80000078-20-サオリ" = "しかし、世の中にはこんなに高いチョコレートがあるのか。"
"80000078-21-サオリ" = "感謝を伝えるには、最高級のチョコレートが良い……"
"80000078-22-サオリ" = "そうでないと、お返しにならないと聞いた。"
"80000078-23-サオリ" = "それどころか、中途半端なものでは相手への「縁を切る」と言う宣言になる、とも。"
"80000078-24-サオリ" = "逆にあえて安いチョコレートをプレゼントすることで、相手への宣戦布告の手段として使うこともあるとか。"
"80000078-25-サオリ" = "「表の世界」の常識は、難しいな……。"
"80000078-26-サオリ" = "だが私もここで生きていくと決めた以上、#nそのしきたりに従わなければならない。"
"80000078-27-サオリ" = "というわけなんだが、先生。"
"80000078-28-サオリ" = "どうだろう、私の気持ちは伝わっ……"
"80000078-29-サオリ" = "……ど、どうしてそんな顔を？"
"80000078-30" = "[s] \"誰が――\""
"80000078-31-サオリ" = "？"
"80000078-32" = "[s] \"誰がサオリにそんな、はた迷惑な冗談を！？\""
"80000078-33-サオリ" = "せ、先生……！？"
"80000078-34-サオリ" = "そ、そうか……私はまた、勘違いをしてしまったのだな。"
"80000078-35-サオリ" = "迷惑をかけてしまった、謝罪しよう。"
"80000078-36" = "[s3] \"いや、サオリが謝ることじゃないよ……。\"\n[s4] \"悪いのは、サオリを騙した人だから……。\""
"80000078-37-サオリ" = "そう言ってもらえるのはありがたい。#nそれはそうと、チョコを手作りして渡すこともできるとはな。"
"80000078-38-サオリ" = "そう言ってもらえるのはありがたい。#nそれはそうと、チョコを手作りして渡すこともできるとはな。"
"80000078-39-サオリ" = "しかも、人によってはその方が喜ばれることもある……と。"
"80000078-40-サオリ" = "では、今度は自分で作ってみるとしよう。"
"80000078-41" = "[s5] \"えっと、絶対そうしなきゃいけないわけじゃないからね……？\"\n[s6] \"気持ちだけでも十分嬉しいよ！\""
"80000078-42-サオリ" = "……そうなのか？"
"80000078-43-サオリ" = "……そうなのか？"
"80000078-44-サオリ" = "難しいな……このバレンタインデーという風習は。"
"80000078-45-サオリ" = "ん？せっかくだし、一緒に食べよう……？"
"80000078-46-サオリ" = "し、しかしそれは、先生に渡したもので――"
"80000078-47" = "[s] \"だからこそ、一緒に食べたいなって。\""
"80000078-48-サオリ" = "……。"
"80000078-49-サオリ" = "……分かった、そこまで言うなら。"
"80000078-50-サオリ" = "先生。これからも私は、色々と迷惑をかけてしまうかもしれないが……今後も、よろしく頼む。"
"80000078-51" = "（サオリとチョコレートを分け合いながら、#nゆったりとした時間を過ごした）"
