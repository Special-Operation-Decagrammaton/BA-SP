[translation]
"80000024-1" = "偽モノのネジ"
"80000024-2" = "シャーレ・居住区"
"80000024-3" = "（急にシャーレの電気が切れてしまい、ウタハに助けを求めた）"
"80000024-4-ウタハ" = "ふう、大したことでなくて何より。"
"80000024-5-ウタハ" = "どうやら分電盤のカバーが緩んでて、スイッチに触れてしまっていたらしいね。"
"80000024-6-ウタハ" = "他のところも念のため見たけれど問題無し、まあカバーだけは付け替えておこうかな。"
"80000024-7-ウタハ" = "先生、ちょっとそこを持って固定しておいてくれるかい？"
"80000024-8-ウタハ" = "順番にこちら側からねじを締めるから。"
"80000024-9" = "[s] \"うん、了解。\""
"80000024-10-ウタハ" = "この中に入れて、よっと……"
"80000024-11-ウタハ" = "ん？壊れた？"
"80000024-12-ウタハ" = "そんなに力は入れてないのだけど……不良品かな？"
"80000024-13-ウタハ" = "仕方ない、別のネジを……。"
"80000024-14-ウタハ" = "……また？"
"80000024-15-ウタハ" = "二回も連続だなんて、流石に何かがおかしいな……。"
"80000024-16-ウタハ" = "耐久性はユーザーの安定性に直結する。"
"80000024-17-ウタハ" = "全く、どこの企業の……"
"80000024-18-ウタハ" = "これは……"
"80000024-19-ウタハ" = "ああ、悪いのは私だったな。"
"80000024-20" = "[s] \"どうかしたの？\""
"80000024-21-ウタハ" = "先生、これを。"
"80000024-22" = "[ns] \"これ……固いけど、中身はチョコレート？\""
"80000024-23-ウタハ" = "ああ、つまり本物のネジではないのさ。"
"80000024-24-ウタハ" = "以前コトリとヒビキが面白がっていたから、糖分補給に使えるかと思って買っていたんだ。"
"80000024-25-ウタハ" = "いくら固いとしても、チョコレートなら壊れるのも仕方がない。むしろ中に入ってしまわなくて助かった。"
"80000024-26-ウタハ" = "部室に戻って、ちゃんとしたネジを取ってこないとね。"
"80000024-27-ウタハ" = "……。"
"80000024-28-ウタハ" = "すまない、先生。私が行ってくる間に、食べていてくれ。"
"80000024-29-ウタハ" = "見た目はともかく、味はそんなに悪くないはずさ。"
