[translation]
"80000012-1" = "街での遭難"
"80000012-2" = "（シャーレの仕事でアビドス高等学校に向かう途中、勘違いして違う駅で下りてしまった）"
"80000012-3" = "（とりあえず真っすぐ進み続けていたが結局、街の真ん中で遭難してしまった……）"
"80000012-4" = "アビドス・住宅街"
"80000012-5-シロコ" = "……。"
"80000012-6-シロコ" = "……先生？"
"80000012-7-シロコ" = "ここ、学校に行く道じゃないけど……どうしてこんなところに……。"
"80000012-8" = "[s] シロコに事情を説明する。"
"80000012-9-シロコ" = "間違えて違う路線の地下鉄に乗ったけど、とりあえず降りて歩き続けたら迷子になった……？"
"80000012-10-シロコ" = "確かにアビドス自治区には、ほとんど周囲に何もない駅がたくさんあるから……"
"80000012-11-シロコ" = "変なところで降りると、慣れてない人にとっては迷うのも分かる。"
"80000012-12-シロコ" = "今後そういう時は慌てないで、ずっと同じ方向に歩いて行った方が良いよ。こうして来て良かった。"
"80000012-13-シロコ" = "とりあえずどこかの方向に50kmぐらい歩けば、街にたどり着けるはずだから。"
"80000012-14" = "[s] \"50kmを「とりあえず」はちょっと……。\""
"80000012-15-シロコ" = "ん、そっか……。"
"80000012-16-シロコ" = "とにかく、もう心配しなくていいよ。"
"80000012-17-シロコ" = "この辺の道は分かるから、学校まで案内するね。"
"80000012-18-シロコ" = "……ん？足に力が入らないって？"
"80000012-19-シロコ" = "低血糖症かな。"
"80000012-20-シロコ" = "何か食べられるもの……。"
"80000012-21-シロコ" = "……ライディング用のやつだけど。"
"80000012-22-シロコ" = "このチョコバーで良ければ、どう？"
"80000012-23" = "[s] ありがたく頂く。"
"80000012-24-シロコ" = "……。"
"80000012-25-シロコ" = "なんだか、先生に初めて会った時を思い出すね。"
"80000012-26-シロコ" = "あの時もこうして、遭難した先生にエナジードリンクを渡したっけ。"
"80000012-27" = "[s] \"その時からずっと……今でも、シロコには助けてもらってばかりだね。\""
"80000012-28-シロコ" = "ううん、そんなことは無い。むしろ助けてもらってるのは、私の方。"
"80000012-29-シロコ" = "私が先生にしてあげられるのは、これくらいしか無いけど……。"
"80000012-30-シロコ" = "でも、少しでも支え合えるのは、すごく嬉しい。"
"80000012-31" = "[s] \"うん。これからもよろしくね、シロコ。\""
"80000012-32-シロコ" = "ん、こちらこそ。"
"80000012-33-シロコ" = "……末永くよろしくね、先生。"
"80000012-34" = "（その後、シロコの案内で無事にアビドス高等学校に着いた。）"
