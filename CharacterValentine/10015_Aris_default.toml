[translation]
"80000020-1" = "アリスのチョコレート"
"80000020-2" = "シャーレ・オフィス"
"80000020-3-アリス" = "先生。今日が何の日かご存知ですか？"
"80000020-4" = "[s] \"……バレンタインデー？\""
"80000020-5-アリス" = "はい、つまり今日はなんと……"
"80000020-6-アリス" = "「チョコレート」のアイテムを消費することで、狩りの時にバフがかかる「レベル上げ」に最適な日です！"
"80000020-7" = "[s] \"……そっか。\""
"80000020-8-アリス" = "そうして高速成長するため、アリスもチョコレートを作りました。"
"80000020-9-アリス" = "パンパカパーン！"
"80000020-10-アリス" = "アリスは「手作りチョコレート」を手に入れた！知能が10上がった！"
"80000020-11" = "[s] \"「手作りチョコレート」……？\""
"80000020-12-アリス" = "はい、アリスが作ったチョコレートです。"
"80000020-13-アリス" = "最初は経験値が足りず、何度も試行錯誤をしましたが……"
"80000020-14-アリス" = "頼れるパーティーメンバーであるモモイの手助けもあり、何とか完成させることができました。"
"80000020-15-アリス" = "先生はこのチョコレートのモデルが誰なのか、お気づきですか？"
"80000020-16" = "[s1] \"……アリス？\"\n[s2] \"……私？\""
"80000020-17-アリス" = "アリスはそんな感じではありません！"
"80000020-18-アリス" = "確かに似ている部分もありますが……"
"80000020-19-アリス" = "ブブー！違います！"
"80000020-20-アリス" = "これはチョコレートで作った「スネイル」です。"
"80000020-21" = "[s] \"……「スネイル」？\""
"80000020-22-アリス" = "あれ？先生はスネイルをご存じないのですか？"
"80000020-23-アリス" = "「スネイル」は「始まりの町」の近くに登場するゼリー状のモンスターで、ステータスが低いため初心者にも相手がしやすい最弱の敵です。"
"80000020-24-アリス" = "ただし属性を持った一部のスネイルは、正しい属性の武器で攻略しなければ攻撃を全反射するという鬼仕様だったりします。"
"80000020-25" = "[s] \"そ、そうなんだ……。\""
"80000020-26-アリス" = "こんなにもスネイルそっくりなのに、もしかして先生は弱体化の呪いデバフがかかっているのでしょうか？"
"80000020-27-アリス" = "このスネイルのチョコは先生に差し上げます。アリスは危機に陥った初心者に配慮できる、親切なプレイヤーですから。"
"80000020-28-アリス" = "戦闘を始める前に、忘れずに摂取してくださいね？"
