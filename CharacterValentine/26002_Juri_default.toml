[translation]
"80000040-1" = "少女の気持ちは色褪せない"
"80000040-2" = "（バレンタインデーの日の夜、ジュリから一通の連絡が届いた）"
"80000040-3-ジュリ" = "先生、今から少しお会いできますでしょうか……？"
"80000040-4-ジュリ" = "あの、もしかしたらご迷惑かもしれないのですが、その……先生にチョコをお渡ししたくって……。"
"80000040-5-ジュリ" = "い、いえすみませんやはり忘れてください！私からのチョコレートなんて……"
"80000040-6" = "[s] \"ジュリのチョコレート！？すぐ行く！\""
"80000040-7-ジュリ" = "え、えっ！？"
"80000040-8-ジュリ" = "で、ではすみません、お待ちしております……！？"
"80000040-9" = "ゲヘナ学園・第3校舎教室"
"80000040-10" = "（ジュリのいる教室まで急いで向かう）"
"80000040-11-ジュリ" = "あ、先生……！"
"80000040-12-ジュリ" = "えっと、その……は、早かったですね……。"
"80000040-13" = "[s] \"ジュリから連絡もらって、走ってきたから。\""
"80000040-14-ジュリ" = "そ、そうでしたか……"
"80000040-15-ジュリ" = "ですが、その、大したものではないと言いますか……。"
"80000040-16-ジュリ" = "そこまで期待されてしまいますと、その……。"
"80000040-17-ジュリ" = "私が作ったのは、普通のチョコレートですよ……？"
"80000040-18" = "[s] \"ジュリがくれるんだから、嬉しいよ。\""
"80000040-19-ジュリ" = "あっ……はい。そこまで言ってくださるのでしたら……"
"80000040-20-ジュリ" = "どうぞ！"
"80000040-21" = "[ns] \"いただきます！\""
"80000040-22-ジュリ" = "い、いかがですか……？"
"80000040-23" = "[s] \"うん、美味しい。\""
"80000040-24-ジュリ" = "そ、そうですか。良かった……。"
"80000040-25-ジュリ" = "ではチョコレートもお渡しできましたし、本日はこれで……"
"80000040-26" = "[s] \"……実はまだ、渡したいものとかあったりしない？\""
"80000040-27-ジュリ" = "えっ！？そ、それはその……。"
"80000040-28-ジュリ" = "も、もしかしてバレてしまいましたが……？確かにそれは、先ほどスーパーで買ってきたものですが……。"
"80000040-29-ジュリ" = "それでも、私の手作りをお渡しするわけには……！"
"80000040-30" = "[s] \"どうして？\""
"80000040-31-ジュリ" = "……渡したいなとは思っていたんです。ですが、作ったチョコレートを他の方々に味見してもらったところ……。"
"80000040-32-ジュリ" = "みなさん、その場で倒れてしまって……。"
"80000040-33" = "[s] \"流石のジュリインパクト……。\""
"80000040-34-ジュリ" = "ジュリインパクト……！？"
"80000040-35-ジュリ" = "と、とにかくそれを、先生にお渡しするわけには……。"
"80000040-36-ジュリ" = "私のせいで、体調を崩させてしまうわけにもいきませんし……。"
"80000040-37" = "[s] \"それは気にしないで。\""
"80000040-38-ジュリ" = "え……？"
"80000040-39" = "[s1] \"ジュリが今日呼んでくれて嬉しかった。\"\n[s2] \"ジュリの手作りのチョコレートを貰えるっていうのもすごく嬉しい。\""
"80000040-40-ジュリ" = "先生……私の手作り、お渡ししても大丈夫ですか……？"
"80000040-41-ジュリ" = "先生……私の手作り、お渡ししても大丈夫ですか……？"
"80000040-42" = "[s] \"それはもう喜んで。\""
"80000040-43-ジュリ" = "そう、ですか……ふふっ。"
"80000040-44-ジュリ" = "私がひとりで躊躇ってしまう時に、先生はいつもそうやって……。"
"80000040-45-ジュリ" = "はい、分かりました。"
"80000040-46-ジュリ" = "どうぞ、先生。"
"80000040-47-ジュリ" = "私が作った、先生のためのチョコレートです。"
"80000040-48-ジュリ" = "受け取って、いただけますか……？"
"80000040-49" = "[s] \"もちろん。\""
"80000040-50-ジュリ" = "ありがとうございます……！"
"80000040-51-ジュリ" = "せ、先生！？大丈夫ですか！？"
"80000040-52" = "（ジュリのチョコレートを味わえて良かったという気持ちを抱きつつ、意識はいっそ気持ちよく遠のいていった）"
