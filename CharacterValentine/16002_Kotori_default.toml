[translation]
"80000068-1" = "バレンタインチョコの起源"
"80000068-2-コトリ" = "……あ、先生！何という偶然！"
"80000068-3-コトリ" = "今日はバレンタインデーですよ！ということでちょうど、私もチョコレートを準備してたんです！"
"80000068-4-コトリ" = "せっかくですし、このまま先生と一緒に講義室へ行って、バレンタインデーの起源について説明したいところなのですが……"
"80000068-5" = "[s1] \"ど、どうしよっかな……。\"\n[s2] \"とりあえずチョコをありがたく頂こうかな……？\""
"80000068-6-コトリ" = "そ、そうですよね……今日はやはり、長い前置きや説明など不要！"
"80000068-7-コトリ" = "そ、そうですよね……今日はやはり、長い前置きや説明など不要！"
"80000068-8-コトリ" = "というわけで、こちらをご用意しました！じゃじゃーん！！"
"80000068-9-コトリ" = "いかがでしょう？？"
"80000068-10" = "[s3] \"昔ながらのスタイル……これって……。\"\n[s4] \"もしかしてこれが起源の説明に……？\""
"80000068-11-コトリ" = "ふふふっ……！"
"80000068-12-コトリ" = "ふふふっ……！"
"80000068-13-コトリ" = "流石は先生、大正解です！！"
"80000068-14-コトリ" = "先生が今日お忙しいのは何となく分かっていますし、あまり説明に長く時間を取るのもどうかと思いまして……。"
"80000068-15-コトリ" = "それに加えて、先生はバレンタインデーやチョコレートの由来について既にご存じなのではという懸念もあり……。"
"80000068-16-コトリ" = "色々と悩んだ結果、こういった形にしてみました。"
"80000068-17-コトリ" = "つまり答えであり説明、バレンタインが始まった頃に作られたと言われている有名なチョコ、すなわち「原初のバレンタインチョコ」と呼ばれているそれを再現してみました！"
"80000068-18-コトリ" = "これは端的でかつ説明も兼ねられていて、良いのではないかと！というわけでお渡しもできたことですし、本日はこの辺りで退場――"
"80000068-19-コトリ" = "……っと？"
"80000068-20" = "[s5] コトリを捕まえる。\n[s6] \"もう少し話していかない？\""
"80000068-21-コトリ" = "……えっ、と？"
"80000068-22-コトリ" = "……えっ、と？"
"80000068-23-コトリ" = "これは予想外な……。"
"80000068-24-コトリ" = "無理に時間を節約する必要はない……？"
"80000068-25-コトリ" = "……あっ。"
"80000068-26-コトリ" = "これを私と、一緒に……？"
"80000068-27-コトリ" = "ふふっ……やはり先生といると、驚きや発見の連続です。"
"80000068-28-コトリ" = "先生について語るには、まだまだ時間が足りません。"
"80000068-29-コトリ" = "それではちょうどそこの講義室も開いてますし、一緒にチョコを頂くとしましょうか！"
"80000068-30-コトリ" = "あと、その……"
"80000068-31-コトリ" = "……ありがとうございます、先生。"
"80000068-32" = "（そしてコトリと一緒に、講義室でチョコレートを美味しく分け合って食べた）"
"80000068-33" = "（そして最終的には、バレンタインデーの起源などについて溢れるほどの説明を受けた）"
