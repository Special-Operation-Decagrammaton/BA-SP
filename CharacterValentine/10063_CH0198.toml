[translation]
"80000096-1" = "全力で道を探す少女"
"80000096-2" = "（日中、仕事に集中していると……）"
"80000096-3" = "[ns1] \"……宅配便？\"\n[ns2] \"ミレニアムから？\""
"80000096-4" = "[log=코유키]「……先生へ」[/log]"
"80000096-5" = "[log=코유키]「今までセミナーの仕事や、その他いつもご協力くださりありがとうございます」[/log]"
"80000096-6" = "[log=코유키]「どうかお早めに召し上がって、素敵なバレンタインデーをお過ごしください」[/log]"
"80000096-7" = "[log=코유키]「日頃の感謝を込めて、セミナーのコユキより」[/log]"
"80000096-8" = "[ns3] \"なんだか怪しいような……\"\n[ns4] チョコレートを半分に割ってみる。"
"80000096-9" = "[ns5] \"……チョコレートの中に紙が！？\"\n[ns6] \"あっ、なるほど……\""
"80000096-10" = "「……嬉しいです」"
"80000096-11" = "「この紙を見つけたということは、無事に私のメッセージが先輩の目をくぐり抜けたのでしょう」"
"80000096-12" = "「先生。私は今、反省部屋で捕まっています。どうしても助けが必要なんです」"
"80000096-13" = "「先輩の監視から逃れられる時間とルートを書いておきました」"
"80000096-14" = "「……先生」"
"80000096-15" = "「……どうかお助けください！！」"
"80000096-16" = "「もう！これが！最後の！希望なんです！！」"
"80000096-17" = "「……こんな可哀想な生徒を見捨てたりなんかしませんよね？切実なる願いを込めて、コユキ」"
"80000096-18-コユキ" = "ぷはぁ～！にははははは！！これが外の空気、自由な世界……！！"
"80000096-19-コユキ" = "はああぁ～～～もうほんと……"
"80000096-20-コユキ" = "今回ばっかりは全部おしまいだと思いましたよ……！"
"80000096-21-コユキ" = "でも[ruby=くろさき]黒崎[/ruby]コユキは、そう簡単には諦めません！いつだって全力で道を探していますから！"
"80000096-22-コユキ" = "何度も救ってくださりありがとうございます、先生。"
"80000096-23" = "[s7] \"コユキ、反省は……？\"\n[s8] \"ならトラブルを起こさなければいいのに……\""
"80000096-24-コユキ" = "……？？？#n反省したから出してほしい、なんて言いましたっけ？"
"80000096-25-コユキ" = "にはは！変なこといいますねぇ～！"
"80000096-26-コユキ" = "……あ！"
"80000096-27-コユキ" = "そういえば、チョコレートはどうしました？#nちゃんと食べてくれましたか？"
"80000096-28-コユキ" = "……美味しかったですか！？良かったです！#n一生懸命作った甲斐がありましたよ、気持ち的にも、機能的にも！"
"80000096-29" = "[s9] \"……ん？一生懸命？\"\n[s10] \"あれはコユキの手作りなの？\""
"80000096-30-コユキ" = "……え？"
"80000096-31-コユキ" = "はい、そうですよ？"
"80000096-32-コユキ" = "……んん？"
"80000096-33-コユキ" = "なんで、わざわざ手作りにしたのかって？"
"80000096-34-コユキ" = "ど、どうしてそんなことを聞くんですか！#nき、機能的だからですよ！？"
"80000096-35-コユキ" = "そ、そう！中に手紙を隠さないといけないじゃないですか！#nだからです、はい！"
"80000096-36" = "[s11] \"あ、ああ～！だよね、そうだよね！\"\n[s12] \"さすがコユキ、すごいね！\""
"80000096-37-コユキ" = "ふ、ふふ……！先生は理解が早くて助かりますよ！！"
"80000096-38-コユキ" = "……に・は・は・は・は～！#nそれにしても、この方法は完璧ですね？"
"80000096-39-コユキ" = "誰かに知られでもしない限り、バレないと思いますし……"
"80000096-40-コユキ" = "これからも、ねえ……先生？"
"80000096-41-コユキ" = "……これからも、ずっと[ruby=・   ・   ・]仲良く[/ruby]してくださいよ～？にはっ！"
"80000096-42" = "（その後、コユキと一緒にミレニアムの建物を出た）"
"80000096-43" = "（もちろん、全てセミナーの耳に筒抜けだったため、二度と同じ方法は使えなくなったのだが……）"
