[translation]
"80000102-1" = "お揃いのキーホルダー"
"80000102-2" = "（突然モミジから連絡が来て、シャーレで待っていると……）"
"80000102-3-モミジ" = "先生！お待たせしてすみません……"
"80000102-4-モミジ" = "大丈夫、と先生は仰いますが……"
"80000102-5-モミジ" = "はい？むしろ20分早い……？"
"80000102-6-モミジ" = "ほ、本当ですね。逆に申し訳が……どうしましょう？"
"80000102-7" = "[s1] \"落ち着いて、モミジ。\"\n[s2] \"それで、何かあったの？\""
"80000102-8-モミジ" = "あ、はい！それがですね、ずっと絶版だった漫画の復刻版をやっと手に入れたんです！"
"80000102-9-モミジ" = "ショコラティエを題材にした恋愛漫画なんですが……最近すごくハマってて……"
"80000102-10-モミジ" = "えへへ……手に入れるのは大変でしたが、無事に三冊手に入れられて良かったです。"
"80000102-11-モミジ" = "え？全部同じ本に見える？"
"80000102-12-モミジ" = "それはそうですよ！保存用と観賞用、布教用で三冊ですから！"
"80000102-13-モミジ" = "あ、もちろん保存用はシュリンクもそのままですよ？"
"80000102-14-モミジ" = "先生には、こちらの布教用を差し上げます！"
"80000102-15" = "[s] \"う、うん。ありがとう……？\""
"80000102-16" = "（笑顔のモミジから漫画を受け取り、さっそく開けてみると……）"
"80000102-17" = "（……！）"
"80000102-18" = "[ns] \"これは？\""
"80000102-19-モミジ" = "あ、それは……！おめでとうございます、先生！"
"80000102-20-モミジ" = "主人公のキーホルダーと作中に登場したチョコレートですよ！#n今回の再販を記念して、ランダムで封入されているんです！"
"80000102-21-モミジ" = "へへ、先生は本当に運がいいですね。#n……あれ、もしかして漫画を買ってきた私も運がいいのかも？"
"80000102-22-モミジ" = "え？これは買ってきた私に返す……？"
"80000102-23-モミジ" = "だ、ダメです！それは先生のものですから！#n返さなくて大丈夫です！むしろ受け取ってください！"
"80000102-24-モミジ" = "ど、どうしてそんなに慌ててるのかって？#nそれは、その……"
"80000102-25-モミジ" = "と、とにかく！先生が受け取ってください！絶対ですよ？"
"80000102-26" = "[s] \"う、うん……分かったよ。\""
"80000102-27-モミジ" = "……。"
"80000102-28-モミジ" = "ふぅ、良かった……"
"80000102-29-モミジ" = "それじゃあ、私も観賞用を読むとしましょう。"
"80000102-30" = "（モミジが嬉しそうな表情で、漫画を開いたところ……）"
"80000102-31-モミジ" = "……。"
"80000102-32" = "[s] \"……？\""
"80000102-33-モミジ" = "え、ええええっ！こ、これは、その……！"
"80000102-34-モミジ" = "せ、先生とお揃いにしたかったわけじゃなくて！#nいえ、その、嫌とかでは……むしろ……"
"80000102-35-モミジ" = "ふええぇえん……なんて言えばいいんでしょう……？"
"80000102-36" = "[s] \"良かったね、モミジ。\""
"80000102-37-モミジ" = "は、はい……？"
"80000102-38" = "[s] \"これでお揃いだよ。\""
"80000102-39-モミジ" = "……。"
"80000102-40-モミジ" = "はい、そうですね。"
"80000102-41-モミジ" = "へへ……えへへ……"
"80000102-42-モミジ" = "……。"
"80000102-43-モミジ" = "えっと、先生。"
"80000102-44-モミジ" = "このキーホルダーは両方とも、先生の机の上に飾っておいてもいいですか……？"
"80000102-45-モミジ" = "その、できれば近くに……並べて。"
"80000102-46" = "[s] \"……ん？大丈夫だけど、どうして？\""
"80000102-47-モミジ" = "ほ、本当ですか！？"
"80000102-48-モミジ" = "あ……"
"80000102-49-モミジ" = "その、机の上は賑やかな方がいいと思って！"
"80000102-50-モミジ" = "精神的にも……仕事の効率的にも……きっとそうに違いありません！"
"80000102-51-モミジ" = "……。"
"80000102-52-モミジ" = "でしたら、キーホルダーは先生の机に飾るとして……"
"80000102-53-モミジ" = "チョコレートは……もったいないので、一緒に食べませんか？"
"80000102-54" = "[s] \"うん、そうしようか。\""
"80000102-55-モミジ" = "……！"
"80000102-56-モミジ" = "はい、そうしましょう！一緒に食べましょう！"
"80000102-57-モミジ" = "漫画も一緒に読んでくださるんですか！？#nほ、本当ですね？いいんですね！？"
"80000102-58-モミジ" = "えへへ……今日シャーレに来たのは大正解でした。"
"80000102-59" = "（ずっと笑顔のモミジと一緒に、漫画を読みながらチョコレートを食べた）"
