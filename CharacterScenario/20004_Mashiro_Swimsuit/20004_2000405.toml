[translation]
"2000405-1" = "熱中症対策"
"2000405-2" = "無為ヶ浜・海水浴場"
"2000405-3-マシロ" = "ふう、良い汗をかくことができました。"
"2000405-4-マシロ" = "このまま冷たい海に飛び込んだら、気持ちよさそうです！"
"2000405-5-マシロ" = "ただ、まだ足の筋肉の追い込みが足りないですね……取り合えずもう1セット走りましょうか？"
"2000405-6" = "[s1] \"泳ぐ前に、すでに疲労困憊……。\"\n[s2] \"今「取り合えず」って言った……？\""
"2000405-7-マシロ" = "まだまだ準備運動は終わっていませんよ。"
"2000405-8-マシロ" = "まだまだ準備運動は終わっていませんよ。"
"2000405-9-マシロ" = "しっかり身体を動かしておかないと、水中で足をつったりしたら大変なことになってしまいます。"
"2000405-10" = "[s] \"私の身体は既に大変なことに……熱中症になりそう……。\""
"2000405-11-マシロ" = "なるほど、大丈夫です。こんなこともあろうかと……。"
"2000405-12" = "[ns] \"これは……？\""
"2000405-13-マシロ" = "熱中症対策です。"
"2000405-14-マシロ" = "アイスキャンディーや清涼飲料水……身体を冷やしてくれるものを、このアイスボックスにたくさん詰め込んできました。"
"2000405-15-マシロ" = "訓練の途中でも、欲しくなったらいつでも言ってくださいね。"
"2000405-16" = "[s] \"今すぐでも良い……？\""
"2000405-17-マシロ" = "そ、そこまで追いつめられていたのですか……？"
"2000405-18-マシロ" = "でも確かに、今日はいつもより暑いですしね。"
"2000405-19-マシロ" = "では少し早いですが、アイスでも食べながら休憩にしましょうか？"
"2000405-20" = "[wa:450]― 先生は[wa:500]アイスキャンディー、[wa:900]噛んで食べる派ですか？"
"2000405-21" = "[wa:150]― それとも[wa:500]舐める派ですか？"
"2000405-22" = "[wa:900]― 私は、[wa:850]ゆっくり[wa:480]舐めて食べる派です。"
"2000405-23" = "― その方が、[wa:1100]アイスキャンディーの味を[wa:1320]長く楽しめますから。"
"2000405-24" = "[wa:1250]― はむっ……[wa:1750]ぺろっ、[wa:800]れろっ……。"
"2000405-25" = "[wa:800]― ……はい？[wa:1050] 食べ方が[wa:1200]ちょっと……？"
"2000405-26" = "[wa:50]― 私としては、[wa:1400]いつも通りなのですけど……"
"2000405-27" = "― 何か[wa:500]変でしょうか？"
"2000405-28" = "[wa:900]― ……先生？[wa:1350]なんだか[wa:500]また、"
"2000405-29" = "― 変な[wa:300]表情を[wa:450]されてる気がするのですが……。"
"2000405-30" = "[ns] \"あれ？このアイス、棒のところに何か書いてある……？\""
"2000405-31-マシロ" = "あっ、それは「当たり」ですね。"
"2000405-32-マシロ" = "棒型のアイスでそういうの、時々見かけませんか？"
"2000405-33-マシロ" = "それを真似して、そのアイスキャンディーを作った時に、棒のところに幾つか「当たり」のメッセージを書いておいたんです。"
"2000405-34-マシロ" = "「当たり」の種類によって、特別な景品をお渡ししますよ。"
"2000405-35" = "[s3] \"やった！\"\n[s4] \"種類があるんだね、何が当たったんだろ……？\""
"2000405-36-マシロ" = "えっと、これは……。"
"2000405-37-マシロ" = "おめでとうございます！「特別賞」の「スペシャルトレーニング」です！"
"2000405-38" = "[s] \"トレーニング！？それ本当に「当たり」！？\""
"2000405-39-マシロ" = "これは私が用意した、文字通り「スペシャル」なトレーニングが受けられるものです。当たりですよ！"
"2000405-40-マシロ" = "これは、他の「当たり」と違って一つしか入れていないのに……"
"2000405-41-マシロ" = "先生は運が良いですね。"
"2000405-42" = "[s] 全力で逃げる。"
"2000405-43-マシロ" = "あっ、待ってください先生！その当たり棒の有効期間は、当日までですよ！"
"2000405-44-マシロ" = "休憩もできたことですし、まずは一緒にその「スペシャルトレーニング」を始めましょう！"
"2000405-45" = "その後、マシロと一緒に激しい運動をして、水泳どころではなくなった……。"
