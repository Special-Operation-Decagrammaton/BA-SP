[translation]
"2006403-1" = "秘密の多い少女"
"2006403-2" = "（今日は資料集めのためにワイルドハントを訪れていた）"
"2006403-3" = "（学院のあちこちにある造形物を記録していた時――）"
"2006403-6" = "[ns] （ふわりと、バラの香りが漂った）"
"2006403-9-ウララ" = "ごきげんよう。"
"2006403-10-ウララ" = "まさかこんな所でお会いするとは。#n……一幕、エチュードにお付き合いいただいても？"
"2006403-11" = "[ns1] \"こんにちは。やっぱり思った通りだ。\"\n[ns2] \"バラの香りがしたから、ウララかなって。\""
"2006403-16-ウララ" = "あら、香水はつけていないのですが……。"
"2006403-17-ウララ" = "もしかすると、わたくしのバラ園の香りかもしれません。"
"2006403-18-ウララ" = "時間の許す限り、そちらで過ごしていますから。"
"2006403-19" = "[s3] \"ウララのバラ園があるんだ？見てみたいな。\"\n[s4] \"ワイルドハントの芸術について調べてるんだ。\""
"2006403-22-ウララ" = "先生を……わたくしのバラ園に……？"
"2006403-23-ウララ" = "それは命令……でしょうか？"
"2006403-24-ウララ" = "し、しかし……たとえ命令だとしても……。"
"2006403-25-ウララ" = "先生、であっても――"
"2006403-26" = "[s5] \"あっ、ごめん。\"\n[s6] \"無理を言うつもりはないんだ。\""
"2006403-31-ウララ" = "……申し訳ありません。"
"2006403-32-ウララ" = "プライベートな場所ですので、外部の方には立ち入りをご遠慮いただいているのです。"
"2006403-33-ウララ" = "マナミ様の個人博物館を想像いただくのが近しいでしょうか。"
"2006403-34" = "[s7] （本人以外は誰も入ったことがないと噂される禁断の場所……）\n[s8] \"これ以上は言わないから安心して。\""
"2006403-37-ウララ" = "お気遣い、ありがとうございます。"
"2006403-38-ウララ" = "ふふ……わたくしは少しばかり先生を誤解していたようですね。"
"2006403-39-ウララ" = "伝え聞く「先生」は、役柄に対して設定が過剰すぎる印象の方でしたから……。"
"2006403-40" = "[s9] （ウララは私を警戒してたのか……）\n[s10] （どんな噂かは怖いから聞かないでおこう……）"
"2006403-43-ウララ" = "何はともあれ、先生のご発言に裏が無いことは理解しました。"
"2006403-44-ウララ" = "……。"
"2006403-45-ウララ" = "お恥ずかしい限りです。"
"2006403-46-ウララ" = "噂話に踊らされ、勝手な想像をしてしまうなんて。"
"2006403-47-ウララ" = "あの……よろしければ……。"
"2006403-48-ウララ" = "お詫びのしるしとして、学院の庭園をご案内させていただきます。"
"2006403-49-ウララ" = "バラ園ではありませんが、ワイルドハントの芸術を調べていらっしゃるのでしたら、#nわたくしの庭園よりも役に立つかと。"
"2006403-50-ウララ" = "どうされますか？"
"2006403-51" = "[s] \"うん！行こう！\""
"2006403-52-ウララ" = "では早速。こちらです。"
"2006403-58-ウララ" = "いかがでしょう。"
"2006403-59-ウララ" = "素朴ではありますが、草や花、鳥に虫、風と雲までもが友となり――#n四季の移ろいを感じながら休息できる場所です。"
"2006403-60-ウララ" = "わたくしも、たまに利用しておりまして。"
"2006403-63-ウララ" = "目を閉じ、聞こえてくる音に耳を傾けるのです。#nすると風に吹かれたタンポポの綿毛のように、ストレスが飛んでいく心地がしますよ。"
"2006403-64" = "[s] \"ウララもストレスが溜まってるんだね……。\""
"2006403-67-ウララ" = "あら。"
"2006403-70-ウララ" = "わたくしも一人の生徒です。"
"2006403-73-ウララ" = "ストレスを感じもすれば、溜まりもします。#n立場上、板挟みになることも多いですから……。"
"2006403-74-ウララ" = "……あっ。#nわたくしがこのような話をしたということは、どうか内密に……。"
"2006403-75-ウララ" = "はぁ……秘密にしていただきたいことが、どんどん増えていきますね。"
"2006403-76" = "[s] \"ウララは秘密が多い女の子だね。\""
"2006403-77-ウララ" = "そうは仰いますが、先生こそわたくしの比ではないのでは？"
"2006403-78-ウララ" = "他人には明かせない、隠しておきたい秘密。"
"2006403-79-ウララ" = "風の便りに聞く限りでも――"
"2006403-82-ウララ" = "……。"
"2006403-85-ウララ" = "申し訳ございません。わたくしの口からは、とても……。"
"2006403-88" = "[ns] \"どんな噂かは分からないけどすみません……。\""
"2006403-91-ウララ" = "いえ……勝手に想像を膨らませてしまったわたくしがいけないのです。"
"2006403-92" = "[s11] \"なんにせよ、気にしないでいいよ。\"\n[s12] \"秘密の1つや2つ、誰だって抱えてるものだから。\""
"2006403-97-ウララ" = "……。"
"2006403-98-ウララ" = "よろしいのですか？"
"2006403-99-ウララ" = "だって、バラ園をお見せできないのは――"
"2006403-100-ウララ" = "先日の映画に出てきたような、突然変異の植物を育てているから。"
"2006403-101-ウララ" = "秘密結社のアジトが隠されているから。"
"2006403-102-ウララ" = "異世界とつながる入口があるから。"
"2006403-103-ウララ" = "……かもしれませんよ？"
"2006403-104" = "[s] \"あははっ、ウララも冗談を言うんだね。\""
"2006403-105-ウララ" = "ふふ……冗談、ですか。#nただの一瞬さえも引き込めないなんて、役者としての力不足を痛感します。"
"2006403-106-ウララ" = "もっと話術を磨かないといけませんね……。"
"2006403-107-ウララ" = "まあ、この話には栞を挟んで脇に置いておくとして。"
"2006403-108-ウララ" = "これからも、信頼できる芸術評議会副会長になれるよう努めてまいります。"
"2006403-109-ウララ" = "多様性が認められる世の中で、誰しもが隔てなく芸術を享受できるよう――"
"2006403-111" = "（その後、ウララのおかげで業務は順調に進んだ）"
"2006403-114" = "（しかし不思議なことに、その晩は妙な夢を見た）"
"2006403-115" = "（庭園で突然変異した植物を守る秘密結社に追われて、#n気づいたら異世界にたどり着くという夢だった）"
