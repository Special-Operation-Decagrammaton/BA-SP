[translation]
"2006402-1" = "人生はアドリブ"
"2006402-2" = "（今日はウララと親睦を深める日だ）"
"2006402-3" = "（遅れないよう、早めに待ち合わせ場所に向かった）"
"2006402-6" = "（待っていると、華やかな香りが漂ってきた）"
"2006402-7" = "[ns] （これは……バラの香り？）"
"2006402-11-ウララ" = "あら……？"
"2006402-12-ウララ" = "先を越されてしまいましたね。"
"2006402-13" = "[s] \"大事な約束だからね。\""
"2006402-16-ウララ" = "……なるほど。"
"2006402-17" = "[s] \"そういうウララだって。ずいぶん早いね。\""
"2006402-18-ウララ" = "その、お恥ずかしながら……口から心臓が飛び出てしまいそうで。"
"2006402-19-ウララ" = "先に来て、心の準備をしようと思っていたのです。"
"2006402-20-ウララ" = "だって、あまりにも大胆ではございませんか。"
"2006402-21-ウララ" = "繁華街で大人の方と待ち合わせをして、映画をご一緒する――#n普段のわたくしなら考えられません。"
"2006402-22-ウララ" = "どうか、本日はよろしくお願いいたします。"
"2006402-23" = "[s] \"うん。任せて。\""
"2006402-24-ウララ" = "……ええ。"
"2006402-27-ウララ" = "……。"
"2006402-28-ウララ" = "えっと……何をしましょうか？"
"2006402-29-ウララ" = "予定より早く合流したので、映画の上映時間まではまだ……。"
"2006402-30-ウララ" = "カフェでお茶をするにも中途半端ですし……うーん……。"
"2006402-31" = "[s] \"近くのお店を見て回ろうか。\""
"2006402-32-ウララ" = "ええ。そうしましょう。"
"2006402-36" = "（映画館が入っているショッピングモールに向かった）"
"2006402-40-ウララ" = "……。"
"2006402-41" = "[ns1] （傍から見ても分かるくらいにウララは緊張しているようだ）\n[ns2] （どうにかできないものか……）"
"2006402-44" = "[ns] \"ウララは普段から映画を見るの？\""
"2006402-47-ウララ" = "え？……あ、ええ。"
"2006402-48-ウララ" = "趣味と実益を兼ねて、と申しましょうか。"
"2006402-49-ウララ" = "わたくし、こう見えて演劇を専攻しておりますので。"
"2006402-50" = "[s] \"えっ、そうだったの？\""
"2006402-51-ウララ" = "ふふっ……よく驚かれます。気弱なわたくしが演劇だなんて。"
"2006402-52-ウララ" = "か弱いお嬢様の役が多いのですが……それなりに良い評価をいただいているのですよ。"
"2006402-53-ウララ" = "欲を言えば……悪役を演じてみたいとも思っています。"
"2006402-54-ウララ" = "……あら。「意外だ」というお顔ですね？"
"2006402-55" = "[s] \"ギャップがあっていいかも？\""
"2006402-56-ウララ" = "ギャップ、ですか……。"
"2006402-57-ウララ" = "ふふ……そうかもしれません。"
"2006402-60-ウララ" = "……。"
"2006402-61-ウララ" = "せ、先生は……映画はお好きですか？"
"2006402-66" = "（その後もウララと映画の話に花を咲かせた）"
"2006402-67" = "（しばらくして……）"
"2006402-70-ウララ" = "あ……もうすぐ上映時間ですね。"
"2006402-73-ウララ" = "そろそろ行きましょうか。"
"2006402-74-ウララ" = "この逢瀬が、互いの記憶に美しく残るよう願いながら。#nそれはさながら……言葉ではなく、咲き香ることで希望を語る花のように。"
"2006402-76" = "（と、語っていたウララのセレクトは――）"
"2006402-82" = "（突然変異した植物が人間に寄生して支配するというホラー映画だった）"
"2006402-83" = "[ns] （ウララはこういう映画が好きだったのか……）"
"2006402-84" = "（映画を観終わって――）"
"2006402-86" = "空いているカフェ"
"2006402-87-ウララ" = "いかがでしたか？"
"2006402-88" = "[s] \"お……面白かったよ！\""
"2006402-89-ウララ" = "ふふ……それは何よりです。"
"2006402-90-ウララ" = "クラシックにも片足を突っ込むような――それでいてマニアックな題材の作品。"
"2006402-91-ウララ" = "リバイバル上映されると聞いた時、ご一緒する方に先生が浮かんだのです。#nきっと、先生なら理解してくださるだろう、と。"
"2006402-94-ウララ" = "あ、そうです。#n実はこんなものを持ってきていまして。"
"2006402-99-ウララ" = "台本です。ご覧になりませんか？"
"2006402-100" = "[s] \"台本なんて持ってるの？\""
"2006402-101-ウララ" = "その……わたくし、映画や演劇の台本を読むのが好きなので。#n上映された映画と台本の内容を見比べると、意外な発見があるのですよ。"
"2006402-104-ウララ" = "とはいえ……ついつい、はしゃぎすぎてしまいました。無理は申しませんので。"
"2006402-105" = "[s] \"一緒に見たいな。興味が湧いてきた。\""
"2006402-106-ウララ" = "あら。それでは、お言葉に甘えて。"
"2006402-107-ウララ" = "先ほども申しましたが、台本と映像を比べると意外な発見があります。"
"2006402-108-ウララ" = "例えば、俳優がどこでアドリブを入れたのか。"
"2006402-109-ウララ" = "先ほどご覧になった映画にも、実はアドリブが散りばめられていたのです。"
"2006402-110-ウララ" = "そうですね……突然変異した植物の群れを、主人公が爆破したシーン。#n覚えていらっしゃいますか？"
"2006402-111" = "[s3] \"ボタンが作動しなくて、手で直接爆破してたね。\"\n[s4] \"主人公がみんなを助けた名シーンだった。\""
"2006402-114-ウララ" = "ええ、仰るとおりです。#n手に汗握る……胸が熱くなる場面でした。"
"2006402-115-ウララ" = "――ところが、台本の内容は全く異なるのです。"
"2006402-118-ウララ" = "本来は、遠隔での爆破が成功して、そのまま終わるという結末でした。"
"2006402-119" = "[s] \"結末が変わっちゃったの？なんで？\""
"2006402-120-ウララ" = "撮影の折、爆破装置が故障したらしいのです。"
"2006402-121-ウララ" = "けれどスケジュールの都合でセットを調整する時間は取れなかった。#nそこで、俳優のアドリブで乗り切ったのだそうです。"
"2006402-122-ウララ" = "爆破も実際に手動で行なったのだとか。"
"2006402-123-ウララ" = "つまるところイレギュラーの産物ではありますが、#n一瞬のきらめきとは往々にして想像の外からやってくるもの。"
"2006402-124-ウララ" = "こうして、感動的な名シーンが誕生したというわけです。"
"2006402-125" = "[s] \"そんな裏話があったんだね……。\""
"2006402-126-ウララ" = "これを知った時、わたくしは大きな衝撃を受けました。"
"2006402-127-ウララ" = "どれほど緻密に組み上げようと、全てが台本どおりにいくとは限らないのだ、と。"
"2006402-128-ウララ" = "そしてそれは創作の世界に限った話ではありません。"
"2006402-129-ウララ" = "日常という劇場は、常にアドリブが求められる。"
"2006402-130-ウララ" = "ワイルドハント芸術評議会の副会長として生きていくなら……なおのこと。#n必要なんです。適度なアドリブが。"
"2006402-133-ウララ" = "……あっ。"
"2006402-134-ウララ" = "いけませんね。含みのある言い回しをしてしまいました。"
"2006402-135-ウララ" = "映画の話をすると、気持ちが高ぶって余計なことまで……。"
"2006402-139-ウララ" = "今のお話は、どうか、胸の内に留めておいてくださいね。"
"2006402-140" = "[s5] \"そうするよ。\"\n[s6] \"ウララも苦労が多いんだね。\""
"2006402-145-ウララ" = "ふふ……。"
"2006402-146-ウララ" = "先生には及びませんよ。"
"2006402-148" = "（映画の話をしながら、楽しい時間を過ごした）"
"2006402-149" = "（ウララとの親睦を深めることができた）"
