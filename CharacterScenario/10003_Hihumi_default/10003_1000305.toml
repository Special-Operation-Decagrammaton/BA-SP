[translation]
"1000305-1" = "ペロロ様救出作戦"
"1000305-2" = "ゲームセンター"
"1000305-3-ヒフミ" = "先生、こちらです！こっち！"
"1000305-4-ヒフミ" = "見てください、巨大なペロロ様のぬいぐるみが！"
"1000305-5-ヒフミ" = "あの柔らかそうな足……。#nふああ……見てるだけで心がとろけそうです。"
"1000305-6-ヒフミ" = "あのぬいぐるみは確か、去年のペロロフェスティバルで限定販売されたもののはずですが……。"
"1000305-7-ヒフミ" = "ブラックマーケットでも中々手に入らないあのぬいぐるみが、どうしてここにあるんでしょうか？"
"1000305-8-ヒフミ" = "ふふっ。とにかく、ペロロ様を救出できる絶好のチャンスです！"
"1000305-9" = "それでは……いきます！"
"1000305-10-ヒフミ" = "ああっ、もう少し……もう少し！"
"1000305-11-ヒフミ" = "……うう、良い感じだったのに失敗してしまいました。"
"1000305-12-ヒフミ" = "でも諦めません！次こそは……！"
"1000305-13-ヒフミ" = "はああっ！"
"1000305-14-ヒフミ" = "……うう、また失敗してしまいました。"
"1000305-15-ヒフミ" = "まだまだ挑戦したいのですが、もうお金が……。"
"1000305-16-ヒフミ" = "どうやら私とペロロ様の縁は、ここまでのようです……。"
"1000305-17" = "[s] \"そろそろ私の出番かな。\""
"1000305-18-ヒフミ" = "え……？先生も、私のペロロ様のぬいぐるみを狙ってたんですか？"
"1000305-19" = "[s] \"大人の力、見せてあげる。\""
"1000305-20-ヒフミ" = "大人の力……！ちょっと興奮してきました！"
"1000305-21-ヒフミ" = "果たして……。"
"1000305-22" = "[USERNAME]、148回目の挑戦……。"
"1000305-23" = "[s] \"今度こそ……！\""
"1000305-24-ヒフミ" = "あの、先生。大人の力ってもしかして……。"
"1000305-25" = "[s] \"できない時は、できるまで挑戦するのが大人！\""
"1000305-26-ヒフミ" = "あはは……無謀なように見えますが、確かにある意味では一番確実な方法かもですね……。"
"1000305-27-ヒフミ" = "（使ったお金、もう五桁を超えているような気がしますが……）"
"1000305-28-ヒフミ" = "先生、ファイトです！頑張ってください！"
"1000305-29" = "[s] \"はあぁぁぁぁっ！\""
"1000305-30-ヒフミ" = "ぬいぐるみが倒れました！やりました、先生！"
"1000305-31-ヒフミ" = "100回以上苦戦しましたが……見事に救出作戦成功ですね！"
"1000305-32" = "[s] \"はい、プレゼント。\""
"1000305-33-ヒフミ" = "えぇ！？このペロロ様のぬいぐるみ、私にくれるんですか？"
"1000305-34-ヒフミ" = "でも、先生がせっかく大人の力を発揮して取ったぬいぐるみなのに……いいんですか？"
"1000305-35" = "[s] \"こういうのは、本当に欲しい人の手に渡るのが一番だよ。\""
"1000305-36-ヒフミ" = "……そうかもしれません。先生のそういう、大切なことのためには何かを手放すことも辞さないところ、流石、本当の大人って感じがします。"
"1000305-37-ヒフミ" = "ありがとうございます、先生。"
"1000305-38-ヒフミ" = "そのお気持ちと一緒に、このぬいぐるみのこと、大事にしますね！"
