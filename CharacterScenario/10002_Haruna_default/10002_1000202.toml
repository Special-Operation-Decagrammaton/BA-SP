[translation]
"1000202-1" = "禁じられた研究"
"1000202-2" = "ゲヘナ学園・第17学生食堂"
"1000202-3-ハルナ" = "ふふふ。ここは現在閉鎖された食堂で、基本的に生徒は出入り禁止なのですが、"
"1000202-4" = "（ガチャン）"
"1000202-5-ハルナ" = "電気と水は問題なく供給されております。"
"1000202-6-ハルナ" = "つまり、誰にも邪魔されず美食の研究をするのに、ちょうどいい場所ということですわね！"
"1000202-7" = "[s] \"私はなんでここに呼ばれたの？\""
"1000202-8-ハルナ" = "何も、難しいことをしていただこうというわけではありませんわ。"
"1000202-9-ハルナ" = "何故先生をここにお呼びしたのか、それは……風紀委員会に見つかった時に責任を持つ大人が、一人は必要でしょう？"
"1000202-10" = "[s] \"ひどい……。\""
"1000202-11-ハルナ" = "ふふ。人生とはそういうものですわ。さあ、では、早速始めましょうか。"
"1000202-12-ハルナ" = "今日の美食研究の対象は、コッコーヴァンです！"
"1000202-13" = "[s1] \"コッコーヴァンっていうと……。\"\n[s2] \"何それ？\""
"1000202-14-ハルナ" = "はい。ご存知の通り、コッコーヴァンというのは……。"
"1000202-15-ハルナ" = "コッコーヴァンとは何かと言いますと……。"
"1000202-16-ハルナ" = "鶏肉と野菜を入れて煮た料理ですわ。調理方法も難しくありません、ただ材料を鍋に入れて煮るだけで終わります。"
"1000202-17-ハルナ" = "ですが……本当に単純な料理でしたら、わざわざ研究の対象には致しません。"
"1000202-18-ハルナ" = "コッコーヴァンの一番の特徴はずばり、鶏肉を煮る材料がお水ではなくワイン、ということです。"
"1000202-19" = "[s] \"ワインというと……。\""
"1000202-20-ハルナ" = "はい。ぶどう酒、つまり、お酒ですわ。"
"1000202-21-ハルナ" = "キヴォトスの生徒には基本的に絶対手に入れられない、禁じられた品。"
"1000202-22-ハルナ" = "これを扱う高級レストランも、普通の生徒は出入り禁止になっており……。手に入れようとしてもその方法がない、禁断の材料ですわ。"
"1000202-23-ハルナ" = "そこで私が講じた策はこちら……。"
"1000202-24-ハルナ" = "エタノールと、ぶどうジュースですわ。"
"1000202-25" = "[s] \"はい！？\""
"1000202-26-ハルナ" = "うふふ、ぶどう酒の味になる組み合わせを考えてみたのです。"
"1000202-27-ハルナ" = "ぶどうとアルコール、理論上間違いはありません。これでコッコーヴァンが作れるはずですわ。"
"1000202-28-ハルナ" = "見ててくださいね、先生。"
"1000202-29-ハルナ" = "さあ、まずフライパンでベーコンを焼き……。"
"1000202-30" = "（ジュー……）"
"1000202-31-ハルナ" = "……小麦粉をまぶした鶏肉を、このベーコンの油で炒めます。"
"1000202-32" = "（ジュー……）"
"1000202-33-ハルナ" = "次は用意した鍋に……火を通した鶏肉とキノコ、ニンジン、玉ねぎを入れて……。"
"1000202-34" = "（ゴロゴロ）"
"1000202-35-ハルナ" = "その次にぶどうジュースを……。"
"1000202-36" = "（トクトクトク）"
"1000202-37" = "[s] \"不安……。\""
"1000202-38-ハルナ" = "ふふ。あまり心配なさらないでください、理論上は全く問題ありませんわ。"
"1000202-39-ハルナ" = "そして次は待望のアルコールを……。"
"1000202-40-ハルナ" = "……。"
"1000202-41-ハルナ" = "うーん……どれぐらい入れたら良いのでしょうか……。"
"1000202-42-ハルナ" = "比率を考えなければいけないのでした……。"
"1000202-43-ハルナ" = "まあ、大丈夫でしょう。本で読んだ限り、結局アルコールは沸騰する際に蒸発して残らないそうですし……。"
"1000202-44-ハルナ" = "とりあえず入れることにいたしましょう！"
"1000202-45" = "（トクトクトクトクトクトクトクトクトクトクトクトクトクトクトク……）"
"1000202-46-ハルナ" = "ふふふ。美食の道を追求する者として、材料をケチるだなんていうことはしてはならないことですわ。たっぷりと入れて……。"
"1000202-47" = "（トクトクトクトクトクトクトクトクトクトクトクトクトクトクトク……）"
"1000202-48-ハルナ" = "……ふう。少々入れすぎてしまったような気もしますが……大丈夫でしょう。"
"1000202-49-ハルナ" = "それでは火をもっと強くして……。"
"1000202-50-ハルナ" = "……？"
"1000202-51" = "（ドカアアァァァァン！）"
"1000202-52" = "（鍋が爆発した）"
"1000202-53-ハルナ" = "………！？"
"1000202-54" = "[s] \"ハルナ、大丈夫！？\""
"1000202-55-ハルナ" = "は、はい。私は大丈夫ですが、コッコーヴァンが……料理が……。"
"1000202-56" = "（ウー！ウー！）"
"1000202-57-ハルナ" = "火災警報器……！？"
"1000202-58-ゲヘナの生徒の声１" = "閉鎖された食堂で爆発が！！"
"1000202-59-ゲヘナの生徒の声２" = "襲撃です！！早く風紀委員会に知らせて！！食堂に集まるようにと！！"
"1000202-60-ハルナ" = "あ、あら……バレてしまいましたか……。"
"1000202-61" = "[s] \"逃げよう！\""
"1000202-62-ハルナ" = "で、ですが……料理が……。"
"1000202-63" = "（ハルナの手を取って食堂から抜け出した）"
"1000202-64-ハルナ" = "ああ……これでは……。"
"1000202-65-ハルナ" = "幸いに大きな爆発ではありませんでしたが……せっかく見つけた秘密の研究室が……。"
"1000202-66-ハルナ" = "はあ……。"
"1000202-67-ハルナ" = "……大丈夫です、場所はまた探せばいいですから。"
"1000202-68-ハルナ" = "ですが……アルコールの比率を間違えてしまったみたいですわね。次はもっと、徹底的に準備するといたしましょう。"
"1000202-69" = "（そういう問題ではなかったと思うけど、目をキラキラさせたハルナにツッコむことができなかった……）"
"1000202-70" = "（後であらためてゲヘナに謝りに行こう）"
