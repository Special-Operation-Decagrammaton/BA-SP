[translation]
"1000205-1" = "怒りの美食家"
"1000205-2" = "ダウンタウン・高級通り"
"1000205-3" = "（ざわざわ）"
"1000205-4-市民１" = "えっ？建物が爆発した！？"
"1000205-5-市民２" = "あっちは、あの有名なレストランがあったところじゃ……。"
"1000205-6-市民３" = "何かあったのかな？"
"1000205-7" = "（ざわざわ）"
"1000205-8-ハルナ" = "……うふふっ。あら、先生ではありませんか？こんなところでお会いできるなんて。"
"1000205-9" = "[s1] \"ハルナ？体から煙が出てるよ？\"\n[s2] \"体が煤だらけだよ？\""
"1000205-10-ハルナ" = "ええ、少々面倒なことがございまして。"
"1000205-11-ハルナ" = "ええ、少々面倒なことがございまして。"
"1000205-12" = "（ぎゅっ）"
"1000205-13-ハルナ" = "まずは、ここから離れましょう。"
"1000205-14-ハルナ" = "ふう、ここまで来れば大丈夫でしょう。"
"1000205-15" = "[s] \"何があったの？\""
"1000205-16-ハルナ" = "お話すると少々複雑なのですが……。"
"1000205-17" = "レストラン・ピエールガニッシュ"
"1000205-18-支配人" = "いらっしゃいませ、ピエールガニッシュへようこそ。予約はされていますでしょうか？"
"1000205-19-ハルナ" = "はい、[ruby=くろだて]黒館[/ruby]ハルナで予約しておりますわ。"
"1000205-20-支配人" = "かしこまりました、こちらへどうぞ。"
"1000205-21-支配人" = "重そうですね、バックは私たちの方でお預かりいたします。"
"1000205-22-ハルナ" = "あら、ありがとうございます。"
"1000205-23" = "（スッ）"
"1000205-24-ハルナ" = "ああ、一つお伝えすることがございまして……私たちの店はお二人以上のお客様向けのコース料理専門のお店となっており、お一人のみのお客様はご案内できないのです。"
"1000205-25-ハルナ" = "……あら、そのような制約があるとは存じ上げませんでしたわ。確か予約は一人で申し込みができましたが……。"
"1000205-26-ハルナ" = "はい、ちょうど昨日変わったばかりの規約でございます。"
"1000205-27-ハルナ" = "……。"
"1000205-28-ハルナ" = "しかしながら仰る通り、予約時にはなかった決まりですので、今回は特別に例外といたします。"
"1000205-29-ハルナ" = "そうですか、ありがとうございます。それでは注文を……。"
"1000205-30-ハルナ" = "私たちのお店の最高のメニューである、ピエールコースをおすすめいたします。"
"1000205-31-ハルナ" = "あ……はい。でしたら、それでお願いいたしますわ。"
"1000205-32-ハルナ" = "少々お待ちください。"
"1000205-33-ハルナ" = "……。"
"1000205-34-ウェイター" = "こちら、前菜のフォアグラを添えたパンでございます。"
"1000205-35-ハルナ" = "……ふうん。"
"1000205-36-ウェイター" = "こちら、牡蛎のサラダでございます。"
"1000205-37-ハルナ" = "うーん……。"
"1000205-38-ウェイター" = "こちらメインの、シャトーブリアンのステーキです。"
"1000205-39-ハルナ" = "……。"
"1000205-40-ウェイター" = "こちらデザートの、フルーツシャーベットです。"
"1000205-41-ハルナ" = "……。"
"1000205-42-支配人" = "……はい、お支払い頂戴いたしました。ありがとうございました。"
"1000205-43-ハルナ" = "……。"
"1000205-44-支配人" = "お料理はいかがでしたか？お口に合いましたでしょうか？"
"1000205-45-ハルナ" = "料理……。"
"1000205-46-ハルナ" = "……ふふふふふふ。"
"1000205-47-支配人" = "……？"
"1000205-48-支配人" = "お荷物をお持ちいたしますので、少々お待ちください。"
"1000205-49-ハルナ" = "ふふっ、その必要はありません。"
"1000205-50-支配人" = "……はい？"
"1000205-51-ハルナ" = "（カチッ）"
"1000205-52-支配人" = "き、起爆スイッチ！？"
"1000205-53" = "（ドカアアァァァァンーーーーーー！！）"
"1000205-54" = "……。"
"1000205-55" = "[s] \"つまり、料理が気に入らないから爆破させたってこと！？\""
"1000205-56-ハルナ" = "それだけが理由ではありませんわ、先生。"
"1000205-57-ハルナ" = "料理というもの、食べ物のおもてなしというものには、単なる味以上の意味が込められています。"
"1000205-58-ハルナ" = "予約済みなのに今は一人での来店は、と不要な後出しをする傲慢な態度。"
"1000205-59-ハルナ" = "相手のメニューの選択を遮るその押し付けがましさ。"
"1000205-60-ハルナ" = "[ruby=アペリティフ]食前酒[/ruby]もなく、[ruby=アミューズブーシュ]一口料理[/ruby]もスキップするというコースの構成。"
"1000205-61-ハルナ" = "ステーキの焼き具合も聞かない不遜さ。"
"1000205-62-ハルナ" = "分かりますか？そもそもシャトーブリアンはミディアムレアでなくてはダメなのです。"
"1000205-63-ハルナ" = "高級な料理には、その高級さに見合ったサービスと料理とが合わせて提供されねばなりません。"
"1000205-64" = "[s3] \"幾つかはよく分からなかったけど……。\"\n[s4] \"すごく怒ってるのは分かった。\""
"1000205-65-ハルナ" = "……。"
"1000205-66-ハルナ" = "……。"
"1000205-67-ハルナ" = "何より、一人で食べる料理は思っていた以上に美味しくないということに、今更気が付きましたわ。"
"1000205-68-ハルナ" = "うふふ。"
"1000205-69-ハルナ" = "帰ってシャワーを浴びなくてはですね、少々焦げ臭くなってしまいましたし……。"
"1000205-70-ハルナ" = "まるで焼き過ぎた焼き鳥のようですわ。"
"1000205-71-ハルナ" = "それでは……先生、次はもう少し綺麗な姿でお会いしましょう。"
"1000205-72" = "（ハルナはなんだか寂しそうな姿で、ふらつきながら消えていった）"
