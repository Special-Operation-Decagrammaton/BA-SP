[translation]
"1009105-1" = "私の担当です"
"1009105-2" = "（午後、近くの踏切でカズサと待ち合わせをした）"
"1009105-3-カズサ" = "……やっほ、先生。"
"1009105-4" = "[ns1] \"こんにちは、カズサ。\"\n[ns2] \"時間ピッタリだね。\""
"1009105-5-カズサ" = "ごめんね、待った？"
"1009105-6-カズサ" = "早めに練習切り上げたつもりなんだけど……先生は大体来るの早いよね。"
"1009105-7-カズサ" = "別に時間ぴったりか、少しくらい遅れても大丈夫だよ？"
"1009105-8" = "[s] \"カズサを待つのは全然――\""
"1009105-9-カズサ" = "はいはい、ストップ。"
"1009105-10-カズサ" = "何を言おうとしてるのかは分かったけど、聞かないからね。#nカットカット。"
"1009105-11-カズサ" = "会ってすぐそんなんじゃ、今日一日持たないよ。"
"1009105-12-カズサ" = "で、今日食べたいものは決まった？"
"1009105-13-カズサ" = "……へぇ、結構あるね。"
"1009105-14-カズサ" = "んー、ちょっとそのリスト貸してもらえる？"
"1009105-15-カズサ" = "この辺のお店、閉店時間がバラバラでさ。#nちゃんと作戦組まないと上手く回れないんだよね。"
"1009105-16-カズサ" = "だから、ベテランのアドバイスに従うのがオススメだよ？"
"1009105-17-カズサ" = "どれどれ……。"
"1009105-18-カズサ" = "ああ、このお店……。"
"1009105-19-カズサ" = "ふふっ、なかなか良いチョイスじゃん。#n先生もそろそろ、一人前の放課後スイーツ部員だね。"
"1009105-20" = "[s] \"うん、お陰様で。\""
"1009105-21-カズサ" = "おだてても何も出ないよ？"
"1009105-22-カズサ" = "……さて、と。"
"1009105-23-カズサ" = "じゃあ、時間がもったいないから……"
"1009105-24-カズサ" = "ほら、行こ！"
"1009105-25" = "（その後、カズサと一緒にスイーツ巡りを始めた）"
"1009105-26" = "（多少変わった動線だったが、カズサの言うとおり閉店時間ギリギリで間に合う「最適のルート」だった）"
"1009105-27" = "（いつの間にか夕方になり、リスト最後のお店の前に到着した）"
"1009105-28-カズサ" = "……よし、間に合った。"
"1009105-29-カズサ" = "これで全部かな？"
"1009105-30-カズサ" = "……ん？"
"1009105-31-カズサ" = "ふふっ、これくらい朝飯前だよ。"
"1009105-32-カズサ" = "まぁ、他のみんなに比べたらまだまだだけど。"
"1009105-33-カズサ" = "先生に比べたら、これくらいはね。"
"1009105-34-カズサ" = "こういう時は――"
"1009105-35-カズサ" = "お姉さんに任せなさい、なんてね♪"
"1009105-36" = "[s3] \"今日のカズサは頼もしいね。\"\n[s4] \"これは次回も期待かな。\""
"1009105-37-カズサ" = "でしょ？"
"1009105-38-カズサ" = "じゃあ、早く中に……"
"1009105-39-？？？" = "いらっしゃいませ。"
"1009105-40-店主" = "……おや、これはこれは。"
"1009105-41-店主" = "歌手……？バンド……？を、されてる方でしょうか？"
"1009105-42-カズサ" = "……？"
"1009105-43-カズサ" = "……え、私のこと？"
"1009105-44" = "[s5] \"服装からして、多分。\"\n[s6] \"まあ、私たちしかいないし。\""
"1009105-45-店主" = "最近は、学生でデビューされる方も多いですからね。"
"1009105-46-店主" = "若いのに夢を持ち、しっかりと頑張られて……素敵です！"
"1009105-47-店主" = "となると、隣の方は……"
"1009105-48-カズサ" = "あ、この人は、その……"
"1009105-49-カズサ" = "せん――"
"1009105-50-店主" = "……専属マネージャーの方ですね！？"
"1009105-51-カズサ" = "……！？"
"1009105-52" = "[ns7] \"……え？\"\n[ns8] \"なるほど。\""
"1009105-53-カズサ" = "あ、えっと……その……。"
"1009105-54-カズサ" = "それは、[ruby=あた]中[/ruby]らずとも遠からずというか……。"
"1009105-55-店主" = "……？"
"1009105-56-店主" = "……？？？"
"1009105-57-店主" = "お、おっとすみません、どうやら出しゃばってしまったようで……。"
"1009105-58-店主" = "失礼いたしました……。"
"1009105-59-カズサ" = "……。"
"1009105-60-カズサ" = "…………。"
"1009105-61-店主" = "で、では、こちらの方は……。"
"1009105-62" = "[s9] \"えっと、私は……。\"\n[s10] \"こちらの生徒の……。\""
"1009105-63-カズサ" = "……専属の人です。"
"1009105-64" = "[ns11] \"……？\"\n[ns12] \"カズサ？\""
"1009105-65-カズサ" = "専属です！#n私の専属マネージャーです！"
"1009105-66-カズサ" = "間違ってないので、大丈夫です！！"
"1009105-67-カズサ" = "……だよね？"
"1009105-68-カズサ" = "私専属……でしょ？"
"1009105-69" = " （……一応イエスと答えた後、お店で最後のスイーツを購入した）"
"1009105-70" = "（お店を出てよそ見をしているうちに、カズサはどこかに行ってしまった）"
