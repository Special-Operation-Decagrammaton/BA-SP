[translation]
"1009115-1" = "あたたかな音色"
"1009115-2" = "（カズサとの待ち合わせ場所に向かうと……）"
"1009115-3" = "オーディオルーム・ロビー"
"1009115-4-カズサ" = "こ……ここは？ "
"1009115-5-カズサ" = "デミントン・オーディオルームへようこそ。"
"1009115-6-カズサ" = "本日はどのようなご用件でしょうか？ "
"1009115-7-リスニングルームの職員" = "オーディオルーム……？"
"1009115-8-リスニングルームの職員" = "色んな機器で音を楽しめる……？#n……ふうん。"
"1009115-9-リスニングルームの職員" = "こんな場所があったんだね。"
"1009115-10-リスニングルームの職員" = "なんか……大人の空間って感じがするかも。"
"1009115-11-カズサ" = "お飲み物は、何になさいますか？"
"1009115-12-リスニングルームの職員" = "えっ……の、飲み物？何か頼むの？"
"1009115-13" = "[ns] \"アイスティーを2つ、お願いします。\""
"1009115-14-カズサ" = "茶葉はトリニティキャンディブレンドでよろしいでしょうか？"
"1009115-15-カズサ" = "それでは、オンザロックスでご用意いたしますね。"
"1009115-16-カズサ" = "お部屋はこちらです。"
"1009115-17" = "オーディオルーム・内部"
"1009115-18-カズサ" = "ここで音楽を聴くの？"
"1009115-19-カズサ" = "……なんか、さっきの先生。#nすごく、大人……みたいな感じした。"
"1009115-20" = "[s] \"大人だからね。\""
"1009115-21-カズサ" = "ふぅん？"
"1009115-22-カズサ" = "ここにはよく来るの？#n慣れてるっぽかったけど。"
"1009115-23-カズサ" = "……ははっ。冗談だよ、冗談。"
"1009115-24-カズサ" = "え？#nあー……そう。"
"1009115-25-カズサ" = "ネットで調べて……そっか……。"
"1009115-26-カズサ" = "なんか、すみません……。"
"1009115-27" = "[s] \"謝らなくていいよ！\""
"1009115-28-カズサ" = "き、気を取り直して……。"
"1009115-29-カズサ" = "言ってたヤツ、持ってきたよ。"
"1009115-30-カズサ" = "あ、これは別にアルバムを出したわけじゃなくて……。"
"1009115-31-カズサ" = "お願いして作ってもらったの。1枚から作ってくれるところがあってさ。"
"1009115-32-カズサ" = "最近はデータ送ったら焼いてくれるとこ、増えてるんだ。"
"1009115-33-カズサ" = "……。"
"1009115-34-カズサ" = "いや、まぁ……プレーヤーもないのにどうしてって思うかもしれないけど。"
"1009115-35" = "[s] \"そんなことないよ！？\""
"1009115-36-カズサ" = "まあ、普通そう思うよね……。"
"1009115-37" = "[s] \"本当にそんなこと思ってないよ……！\""
"1009115-38-カズサ" = "でもそういう時もあるっていうか……。"
"1009115-39-カズサ" = "ショーウィンドウで、かわいいケーキを見たら気分じゃなくても突然食べたくなる感じっていうか。"
"1009115-40-カズサ" = "お願いしたら作れるって聞いて、やってみたくなったんだよね。"
"1009115-41-カズサ" = "自分の歌がこうして記録されるっていうのもそうだし……LP盤ってちょっとレトロな魅力もあるなーって思って。"
"1009115-42-カズサ" = "だから、お願いしてみたの。"
"1009115-43-カズサ" = "プレーヤーがないから聞けないんだけど、せっかく作ったのに飾るだけなのももったいないじゃん？"
"1009115-44-カズサ" = "それに、レコードの音は温かいって聞いて……ちょっと気になったんだ。"
"1009115-45-カズサ" = "だから、プレーヤーを探してて……もしかしたら先生なら持ってるかな～って。"
"1009115-46-カズサ" = "シャーレにはなかったみたいだけど。"
"1009115-47-カズサ" = "でも、先生に聞いてみて正解だったかも……ふふ。"
"1009115-48-カズサ" = "……それじゃあ、一緒に聞いてくれる？"
"1009115-49-カズサ" = "レコードに指紋がつかないように気をつけて……っと。"
"1009115-50-カズサ" = "ターンテーブルに乗せて……。"
"1009115-51-カズサ" = "この後は……あれ……。"
"1009115-52-カズサ" = "針ってレコードの内側に乗せるの？それとも外側？"
"1009115-53" = "[s] \"え、それは……。\""
"1009115-54" = "（ちょうどアイスティーを持ってきた店員が手伝ってくれた）"
"1009115-55" = "（こうしてカズサの持ってきたLP盤の鑑賞会が始まった）"
"1009115-56-カズサ" = "……やっぱ、ちょっと恥ずかしいね。"
"1009115-57-カズサ" = "自分一人で聞けばよかったかも……まあもう遅いけど。"
"1009115-58-カズサ" = "それで……どう、かな？"
"1009115-59" = "[s1] \"なんだか初々しくていいね……。\"\n[s2] \"カズサらしいよ。\""
"1009115-60-カズサ" = "初々しい、か……。 "
"1009115-61-カズサ" = "んー……。"
"1009115-62" = "[s] \"ご、ごめん。気に障った？\""
"1009115-63-カズサ" = "ううん。ただ、その通りだなって。"
"1009115-64-カズサ" = "これ、初めてつっかえずに最後まで演奏できた時の録音なんだ。"
"1009115-65-カズサ" = "完奏したのが初めてだったっていうだけで、やっぱり色々と技量は足りてないし。"
"1009115-66-カズサ" = "急に走ったりする子もいれば、ちょっとだけ飛んじゃう子もいるし……。"
"1009115-67-カズサ" = "私も……声が裏返ったりしたし。"
"1009115-68-カズサ" = "まぁでも、だからこそこうやって残したかったんだよね。"
"1009115-69-カズサ" = "普通に売ってるアルバムってほら、最高の演奏を残すものじゃん？#nでも、私たちはプロじゃないし。これは記録として残したいものだからさ。"
"1009115-70-カズサ" = "ちょっとくらい粗があったほうが、思い出としていいっていうか。"
"1009115-71-カズサ" = "そんな風に思うんだ……。"
"1009115-72" = "[s] \"これも「感性」だね。\""
"1009115-73-カズサ" = "そういうこと！"
"1009115-74-カズサ" = "……。"
"1009115-75-カズサ" = "あ、曲が終わった。 "
"1009115-76" = "[s] \"あれ？まだ続きがあるみたいだけど……。\""
"1009115-77" = "（聞き慣れた声の、馴染みある歌が聞こえてきた）"
"1009115-78" = "（だがカズサの声ではない）"
"1009115-79" = "（これは……） "
"1009115-80" = "[ns] \"あれ？この声って……！\""
"1009115-81-カズサ" = "ふふ。気づいちゃった？"
"1009115-82" = "[s3] \"これって私……！？\"\n[s4] \"いつの間に！？\""
"1009115-83-カズサ" = "この前、一緒にカラオケに行ったじゃん。その時に録音してたんだ。"
"1009115-84-カズサ" = "最新のカラオケってすごいよね。録音から転送までボタン一つなんだもん。"
"1009115-85-カズサ" = "ほら、後ろの方からタンバリンの音しない？#n私が叩いてたやつ。"
"1009115-86" = "[s5] \"本当だ……。\"\n[s6] \"待って、どうして私の歌がアルバムに……？\""
"1009115-87-カズサ" = "ほ、ほら……先生もバンドのために色々頑張ってくれたでしょ？"
"1009115-88-カズサ" = "だから、アルバムに残しておきたかったの。"
"1009115-89-カズサ" = "……なんか、いいねこういうの。"
"1009115-90-カズサ" = "声が……温かい。"
"1009115-91-カズサ" = "……。"
"1009115-92-カズサ" = "あ、いや……音質のこと！#nデジタルにはない特有のノイズの話……！"
"1009115-93-カズサ" = "その……それが……#nあったかくて、いいなって……思っただけ。"
