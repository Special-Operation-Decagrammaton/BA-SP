[translation]
"1009102-1" = "ボーカル練習"
"1009102-2" = " （……カズサに捕まって、近くのカラオケに連れて行かれた）"
"1009102-3" = "[ns1] \"責任って何かと思ったら。\"\n[ns2] \"歌の練習に付き合う、と……。\""
"1009102-4-カズサ" = "……じゃあ逆に、何だと思ってたの？"
"1009102-5-カズサ" = "経緯はともかく、放り投げたりしないよ。"
"1009102-6-カズサ" = "ま、どうせ誰かがやらなきゃなんだし。"
"1009102-7-カズサ" = "……ふふっ、別に偉いとかじゃないって。"
"1009102-8-カズサ" = "……え？いや、経験が無いって言うか……。"
"1009102-9-カズサ" = "バンドの「ボーカル」として歌うのは、流石にやったことないからさ。"
"1009102-10-カズサ" = "ステージに立つなんて、柄じゃないんだけどね。"
"1009102-11-カズサ" = "……。"
"1009102-12-カズサ" = "ま、とにかく付き合ってよ。"
"1009102-13-カズサ" = "私が歌うの、聞いてるだけで良いからさ。"
"1009102-14-カズサ" = "何か気になるようだったら、後で教えて。"
"1009102-15-カズサ" = "ん？あー……本番の曲はまだ決まってない、です。#nとりあえず、練習だけはしておこうかなって。"
"1009102-16-カズサ" = "……いやいやいや。"
"1009102-17-カズサ" = "ナツとかヨシミとかの前で歌ったら、どうなるかくらい分かるでしょ？"
"1009102-18-カズサ" = "それじゃ練習にならないじゃん？"
"1009102-19-カズサ" = "だからこうして、信頼できる先生に……"
"1009102-20-カズサ" = "……。"
"1009102-21-カズサ" = "信頼できるって、言って良いのかな……？"
"1009102-22" = "[s3] \"……えぇっ！？\"\n[s4] \"そ、その表情は一体……？\""
"1009102-23-カズサ" = "でも先生って時々、すごい意地悪だし……。"
"1009102-24-カズサ" = "変なところで真面目かと思えば、急にふざけたりするから……。"
"1009102-25-カズサ" = "……もしかして、一人でやるべきだったのかな。"
"1009102-26-カズサ" = "……え？"
"1009102-27-カズサ" = "約束してくれる？絶対意地悪しない？"
"1009102-28-カズサ" = "んー……ほんとに？"
"1009102-29" = "[s5] \"その辺りはちゃんと見極めるよ。\"\n[s6] \"空気はちゃんと読むよ……読める範囲で。\""
"1009102-30-カズサ" = "そ、そっか……。"
"1009102-31-カズサ" = "な、なんかごめんね。"
"1009102-32-カズサ" = "そこまで重い意味はなかったんだけど……。"
"1009102-33-カズサ" = "……先生、やっぱり変な人だね。"
"1009102-34-カズサ" = "まあ良いか、約束してくれたし。"
"1009102-35-カズサ" = "じゃあ私も、そろそろ本格的に……。"
"1009102-36-カズサ" = "……。"
"1009102-37-カズサ" = "……よろしくお願い、します。"
"1009102-38" = "（その後、カズサの歌を沢山聞いた）"
"1009102-39" = "（幾つかアドバイスはしたものの、カズサの歌はかなり上手だった）"
"1009102-40" = "[ns7] \"すごいすごい！\"\n[ns8] \"こんなに上手なのに、心配ごとがあるの？\""
"1009102-41-カズサ" = "そ、そうかな……？大丈夫そう？"
"1009102-42-カズサ" = "先生、結構なんでも褒めるからなー……。#nそれは、お世辞じゃないやつ？"
"1009102-43-カズサ" = "……そっか、ありがと。"
"1009102-44-カズサ" = "ま、その表情を見ちゃったら仕方ないなぁ。"
"1009102-45-カズサ" = "信じても、良いんだよね？"
"1009102-46" = "[s9] \"それはもちろん。\"\n[s10] \"あとは本番もリラックスして臨めれば完璧。\""
"1009102-47-カズサ" = "うん、ありがと。"
"1009102-48-カズサ" = "にしても、リラックスか……。"
"1009102-49-カズサ" = "ま、それは今後の課題ってことで。"
"1009102-50-カズサ" = "……じゃ、練習はここまでにしようかな。"
"1009102-51-カズサ" = "……ん、どしたの？"
"1009102-52-カズサ" = "何するのって……ここ、カラオケだよ？"
"1009102-53-カズサ" = "……そんなの決まってるでしょ。"
"1009102-54-カズサ" = "せっかくなんだし、楽しまないとね。"
"1009102-55" = "[s11] \"……歌い足りない感じ？\"\n[s12] \"喉枯れない？大丈夫？\" "
"1009102-56-カズサ" = "……何、その反応？"
"1009102-57-カズサ" = "さっきまでのは練習、ここからは一緒にカラオケで遊ぶの。"
"1009102-58-カズサ" = "全然違うでしょ？"
"1009102-59-カズサ" = "それに、喉なら平気だって。"
"1009102-60-カズサ" = "ここまで来たんだから、最後まで付き合ってよ？"
"1009102-61-カズサ" = "まだまだ時間はあることだし……。"
"1009102-62-カズサ" = "それじゃあ一曲目、行こう！！"
"1009102-63-カズサ" = "ほらほら、先生も！"
"1009102-64" = "（その後カズサは、長時間にわたって楽しそうに歌い続けた）"
"1009102-65" = "（……何なら練習の時よりも、ずっと生き生きとしていた）"
