[translation]
"1001705-1" = "チェリノは九歳？"
"1001705-2" = "キヴォトス・3丁目商店街"
"1001705-3-チェリノ" = "遅いぞ、カムラッド！"
"1001705-4-チェリノ" = "おいらを待たせるなど、旧校舎に百年閉じ込める刑に値する！粛清だ！"
"1001705-5-チェリノ" = "……しかし！"
"1001705-6-チェリノ" = "今日はおいらにプリンを買ってくれるということだから、特別に許してやろう。光栄に思え、カムラッド！"
"1001705-7-チェリノ" = "ところで、今日は好きなだけ頼んで良いのか？店で一番大きいプリンを頼んでも？"
"1001705-8" = "[s] \"あ、うん、良いよ。ちゃんとピーマン食べられたもんね。\""
"1001705-9-チェリノ" = "ふふふ……それでは、カムラッドのカードが限度額に達するまでプリンを食べるとしよう！"
"1001705-10-チェリノ" = "おいらは頑張ったのだから、その資格があるのだ！"
"1001705-11-チェリノ" = "はむっ、もぐもぐ……。"
"1001705-12-チェリノ" = "はぁーっ……ここのプリンは本当に美味しいな！いくらでも飽きずに食べられそうだ！"
"1001705-13-チェリノ" = "もちろんレッドウィンター連邦学園の食堂で作られるプリンも美味しいが、これはこれで……"
"1001705-14-チェリノ" = "さあ、ではもう一つ……"
"1001705-15-チェリノ" = "ぱくっ、もぐもぐ……。"
"1001705-16-店員" = "あら、可愛いお嬢さんですね。親御さんと一緒に来たの？"
"1001705-17-チェリノ" = "ど、どういうことだ！？"
"1001705-18-チェリノ" = "ち、違う、カムラッドはおいらの親ではなく、先生なのだ！勘違いするな！"
"1001705-19-店員" = "あらら、ごめんなさい。生徒さんだったのね……。#nどう、小学校は楽しい？"
"1001705-20-チェリノ" = "しょ、小学校だと！？"
"1001705-21-チェリノ" = "おいらをいったい何歳だと思っているのだ！おいらはレッドウィンター連邦学園の書記長であり、生徒会長であり、あれこれとすごいことを全て任されている、チェリノ様だぞ！"
"1001705-22-チェリノ" = "た、確かに背は少し低いかもしれないが……この全身から漂う大人の雰囲気が感じられないのか！"
"1001705-23-店員" = "あらそうだったの、それはごめんなさいね！今日はイベントをやっているものだから、つい勘違いしてしまったわ。"
"1001705-24-チェリノ" = "イベント……だと？それは何の話だ？"
"1001705-25-店員" = "今日はうちのお店が開店して10周年なの。それで、10歳未満の子供たちにクッキーを配るイベントをやっているのよ。"
"1001705-26-チェリノ" = "ク、クッキー？"
"1001705-27-チェリノ" = "（ルワゾー・ブッレのクッキーといえば手作りの高級品……しかも普段は売られていない、お金を払っても手に入れることが難しい貴重な品……それを、無料でくれるだと？）"
"1001705-28-チェリノ" = "（しかも、以前に食べたことがあるトモエの話によると、プリンに次ぐ美味しさだとか……）"
"1001705-29-チェリノ" = "（この機会を逃すわけにはいかない！）"
"1001705-30-チェリノ" = "（し、しかし、クッキーのために子供のふりをするのは、レッドウィンターの生徒会長としてのプライドが……これは、どうすれば……？）"
"1001705-31-チェリノ" = "（……ええいっ、知ったことか！）"
"1001705-32-店員" = "は、ははっ！それなら私にも、そのクッキーをもらう資格があるな。さあ、クッキーをこちらに。"
"1001705-33-店員" = "え？でもさっき確か、レッドウィンター連邦学園の生徒会長だって……。"
"1001705-34-チェリノ" = "そ、それはだから……飛び級をしたんだ！"
"1001705-35-チェリノ" = "ハイハイが出来るようになる頃には、すでに微分方程式を解いていたほどの天才だからな――高校への飛び級ぐらい、なんということはない！"
"1001705-36-チェリノ" = "というわけで、クッキーをもらうとしよう！"
"1001705-37-店員" = "でも……。"
"1001705-38-チェリノ" = "ど、どうして渋るんだ、おいらは九歳だと言っているではないか！"
"1001705-39-店員" = "クッキー欲しい、クッキー！！クッキー！！！"
"1001705-40-レッドウィンターの生徒A" = "……あそこにいらっしゃるの、チェリノ会長ですよね？#nどうしてこんなところで愚図ってらっしゃるんでしょうか？"
"1001705-41-レッドウィンターの生徒B" = "元々子供っぽい人だとは思っていましたが、あんな恥ずかしいお姿を……見ているこちらの方が恥ずかしくなってしまいますね。"
"1001705-42-レッドウィンターの生徒A" = "ええ、あんな方が生徒会長をしている学園の生徒だなんて、周りにバレたくないですね……。"
"1001705-43-チェリノ" = "…………。"
"1001705-44-チェリノ" = "粛清……粛清だ……っ！"
"1001705-45-チェリノ" = "このお店にいるやつら、全員粛清だぁ！！！"
"1001705-46" = "その後、銃弾をまき散らして暴れるチェリノをどうにか宥めて、レッドウィンター連邦学園に戻った。"
