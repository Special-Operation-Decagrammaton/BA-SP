[translation]
"1001708-1" = "悪夢"
"1001708-2-チェリノ" = "うひ……プリンが一つ、プリンが二つ……"
"1001708-3-チェリノ" = "はうっ！？"
"1001708-4" = "レッドウィンター連邦学園・会長執務室"
"1001708-5-チェリノ" = "あ、あぅ……勤務時間中なのに寝ちゃってた……。"
"1001708-6-チェリノ" = "このところ激務が続いて、疲労がたまっていたのか……お昼寝の時間をもっと増やした方が良さそうだな。"
"1001708-7-チェリノ" = "んっ……えっと、どれくらい寝てたのか……"
"1001708-8-チェリノ" = "……午後の、5時？お、おやつの時間がとっくに過ぎてるじゃないか！"
"1001708-9-チェリノ" = "いくら寝てたからと言って、おいらを差し置いておやつタイムだなんて許されない！"
"1001708-10-チェリノ" = "親衛隊！親衛隊はどこだ！"
"1001708-11-親衛隊" = "なんだなんだ、誰だこの事務局でうるさくしてるのは？"
"1001708-12-チェリノ" = "なにっ！？このチェリノ様に対して「うるさい」だと！？無礼者め、口を慎め！"
"1001708-13-チェリノ" = "お前を一か月間、トイレ掃除の刑にしてもいいんだぞ！？"
"1001708-14-親衛隊" = "……誰だお前、なんでこんなチビがここに？"
"1001708-15-チェリノ" = "ち、チビ！？！？"
"1001708-16-チェリノ" = "お前まさか、おいらが誰だか知らないのか！？新入りか！？"
"1001708-17-チェリノ" = "おいらはレッドウィンター連邦学園の生徒会長であり、書記長兼、環境美化部部長兼、清掃部部長のチェリノ様だぞ！？"
"1001708-18-親衛隊" = "はあ？あんたみたいなチビっ子が、レッドウィンター連邦学園の生徒会長なわけないだろ？"
"1001708-19-チェリノ" = "何を言っているんだ！見ろ、あの壁にかかったおいらの立派な肖像画……"
"1001708-20" = "な、無い！？"
"1001708-21" = "おいらの肖像画はどこに！？"
"1001708-22-チェリノ" = "廊下にあった銅像も……"
"1001708-23-チェリノ" = "おいらを称えるありとあらゆるものが……全部無くなってる！？"
"1001708-24-チェリノ" = "どういうことだ、寝てる間にまた革命でも起きたのか！？"
"1001708-25" = "…………。"
"1001708-26-チェリノ" = "あっ、カムラッド！ちょうど良いところに！"
"1001708-27-チェリノ" = "お、お前は忘れてないよな？レッドウィンター連邦学園の生徒会長であり書記長の、おいらのことを忘れてないよな？"
"1001708-28" = "…………。"
"1001708-29-チェリノ" = "ど、どうしてそんな目をするんだ！お前がおいらのことを忘れるはずないだろう！？"
"1001708-30-チェリノ" = "思い出せ！……頼む、お願い、思い出して……！"
"1001708-31" = "…………。"
"1001708-32-チェリノ" = "お願いだから……思い出してよ……。"
"1001708-33" = "[s] \"……チェリノ？大丈夫？\""
"1001708-34-チェリノ" = "……はっ！"
"1001708-35-チェリノ" = "あ、あれ……？"
"1001708-36" = "[s] \"寝言がすごかったけど、大丈夫？\""
"1001708-37-チェリノ" = "ゆ、夢だったのか……良かった……。"
"1001708-38-チェリノ" = "全く、ひどい夢だった……親衛隊はもちろん、カムラッドまでおいらのことを忘れてしまうなんて……。"
"1001708-39-チェリノ" = "本当に、怖かった……。"
"1001708-40" = "[s] \"夢で良かったね。\""
"1001708-41-チェリノ" = "うん……いや、全然良くない！"
"1001708-42-チェリノ" = "他のやつらはまだしも、カムラッド！お前がおいらのことを忘れるなんて！"
"1001708-43" = "[s] \"それは夢の中での話でしょ？\""
"1001708-44-チェリノ" = "たとえ夢の中だとしても、カムラッドはカムラッドだ！"
"1001708-45-チェリノ" = "お詫びとして、最高級のプリンを要求する！"
"1001708-46" = "[s] \"何という理不尽……。\""
"1001708-47" = "……そうやって拗ねてしまって、同時に少しだけ本気で悲しそうな顔をしたチェリノを慰めるのに、それなりの時間がかかった。"
