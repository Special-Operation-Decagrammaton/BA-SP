[translation]
"1300802-1" = "アルバイトのお手伝い"
"1300802-2" = "アビドス・外郭市場"
"1300802-3-セリカ" = "遅いじゃないの！結構待ったんだから。"
"1300802-4" = "[s] \"時間通りに来たよ？\""
"1300802-5-セリカ" = "アルバイトっていうのは普通、約束の時間より少し早く来るものなの。"
"1300802-6" = "[s] \"セリカはそういうところ、厳格なんだね。\""
"1300802-7-セリカ" = "でもこうしてちゃんと来てくれるし、そういう点は信用できるかな。"
"1300802-8-セリカ" = "ん？まだやるとは言ってない？そんなこと言わないでよ。"
"1300802-9-セリカ" = "ただ暇な時間を過ごすのはもったいないでしょ。#n健康のこととか、資金の余裕のこととか色んなことを考慮しても、体を動かした方がいいしね。"
"1300802-10-セリカ" = "え？何を手伝えばいいかって？"
"1300802-11-セリカ" = "さ、これを受け取って。"
"1300802-12" = "[s] \"チラシ？\""
"1300802-13-セリカ" = "今日の仕事はチラシを配るバイトなの。#nこれを周辺のポストとか通りすがりの人たちに配ればいいんだけど、1枚で1円だからね！"
"1300802-14-セリカ" = "だからスピードが命の仕事なの！今日は特に量が多いから一緒にやってくれる人が欲しくて。"
"1300802-15" = "[s] \"これを配ればいいの？\""
"1300802-16-セリカ" = "何言ってんの。先生を呼んだのは私なんだから、大変な仕事をさせるわけにはいかないし……。"
"1300802-17-セリカ" = "先生はここで私の補助をしてくれればいいの。"
"1300802-18-セリカ" = "ここで待っててもらって、私がチラシを配り終えて戻ってきたらもう一つチラシの束を渡して。私がそれをもらって配りにいって、その繰り返し。"
"1300802-19-セリカ" = "どう、簡単でしょ？これで私がもらった日当の半分をあげるから！頑張るわよ！"
"1300802-20" = "[s1] \"一緒に配った方が早く終わりそうじゃない？\"\n[s2] \"バイト代を分けるなんて、そんなことしなくていいよ。\""
"1300802-21-セリカ" = "いいから、ほらほら、こんなことしてる時間はないの。さっさと始めるわよ！まず500枚ちょうだい！"
"1300802-22-セリカ" = "いいから、ほらほら、こんなことしてる時間はないの。さっさと始めるわよ！まず500枚ちょうだい！"
"1300802-23" = "[s] チラシの束を渡す。"
"1300802-24-セリカ" = "行ってくるわ！！"
"1300802-25-セリカ" = "さあ、戻ったわよ！次！"
"1300802-26" = "[s] チラシの束を渡す。"
"1300802-27-セリカ" = "行ってくるわ！！"
"1300802-28-セリカ" = "はあ……はあ……次！"
"1300802-29" = "[s] チラシの束を渡す。"
"1300802-30-セリカ" = "ふう……行くわよ！"
"1300802-31-セリカ" = "はあ……はあ……はあ……。"
"1300802-32-セリカ" = "はあ……。"
"1300802-33" = "[s3] \"ペース、速すぎない？\" \n[s4] \"辛そうに見えるけど……。\""
"1300802-34-セリカ" = "だ、大丈夫よ、このくらいのスピードじゃないと今日中に終わらないんだから。"
"1300802-35-セリカ" = "だ、大丈夫よ、このくらいのスピードじゃないと今日中に終わらないんだから。"
"1300802-36-セリカ" = "ふう……じゃあ、行ってくるわ！"
"1300802-37" = "[s5] ………………。\n[s6] ……やっぱり手伝った方がいいかも。"
"1300802-38" = "（チラシを配りに行くことにした）"
"1300802-39" = "（チラシを配りに行くことにした）"
"1300802-40-セリカ" = "（ふらっ）……ただいま……はあ……。"
"1300802-41" = "[s] \"お疲れ様。\""
"1300802-42-セリカ" = "あと……どれぐらい残ってる？"
"1300802-43" = "[s7] \"もう無いよ、終わり。\"\n[s8] 空っぽのバックを見せる。"
"1300802-44-セリカ" = "あれ……。"
"1300802-45-セリカ" = "あれ……。"
"1300802-46-セリカ" = "たしかあと数回はやらなきゃいけない量が残ってたと思うんだけど……気のせいかな……。"
"1300802-47" = "[s9] \"気のせいだよ。\"\n[s10] \"疲れてて見間違えたのかも。\""
"1300802-48-セリカ" = "ま、そっか！あははっ、やっと終わった！やったー！"
"1300802-49-セリカ" = "ま、そっか！あははっ、やっと終わった！やったー！"
"1300802-50" = "[s] \"お疲れ様。\""
"1300802-51-セリカ" = "うん！先生もお疲れ様！"
"1300802-52-セリカ" = "はあ……正直限界だった……足がふらふらする……。"
"1300802-53-セリカ" = "ま、そしたらバイト代を受け取りに行こっか？"
"1300802-54" = "（バイト代をもらって、全部セリカに渡そうとしたのだけど）"
"1300802-55-セリカ" = "なに？"
"1300802-56-セリカ" = "先生が正当に働いて貰ったお金じゃん。働いた分はきちんと貰わないと！"
"1300802-57" = "（と、断られた）"
"1300802-58-セリカ" = "ふあぁー、んー。"
"1300802-59-セリカ" = "終わったと思ったらもう夜だし、疲れたわね。先生は大丈夫？"
"1300802-60" = "[s] \"うん。ところでバイト代は何に使うの？\""
"1300802-61-セリカ" = "ん？私は使わないよ。このお金はもちろん対策委員会のところに行くの。"
"1300802-62" = "[s] \"……そっか。\""
"1300802-63-セリカ" = "うん、一円でも多く集めないと。学校の借金を返すために。"
"1300802-64-セリカ" = "……対策委員会のみんなは、これが個人のバイト代だって知ったら受け取ろうとしないから。"
"1300802-65-セリカ" = "だから先生にも手伝ってもらったの！"
"1300802-66-セリカ" = "……。"
"1300802-67-セリカ" = "だから、これからもたまには手伝ってくれる？今日はすごく助かったから。"
"1300802-68" = "[s] 頷く。"
"1300802-69-セリカ" = "ふふっ、ありがと。"
"1300802-70-セリカ" = "じゃあまたね！私は家に帰ってシャワーでも浴びようかな、お腹もすいたし。"
"1300802-71-セリカ" = "バイバイ、先生！"
"1300802-72" = "（もらったバイト代をどうするか考えてみないと）"
"1300802-73" = "（………）"
"1300802-74" = "（匿名で対策委員会に寄付しておこう）"
