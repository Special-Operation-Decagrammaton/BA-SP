[translation]
"1300809-1" = "つかの間の休息"
"1300809-2-セリカ" = "……。"
"1300809-3-セリカ" = "あ、先生。早いわね。"
"1300809-4" = "[s1] \"セリカ、大丈夫？\"\n[s2] \"足がふらふらしてるみたいだけど？\""
"1300809-5-セリカ" = "大丈夫……これぐらいは何とも……。"
"1300809-6-セリカ" = "大丈夫……これぐらいは何とも……。"
"1300809-7-セリカ" = "あっ、うわっ！？"
"1300809-8-セリカ" = "あ、ありがとう、先生。倒れこんじゃうところだった……。"
"1300809-9-セリカ" = "だ、大丈夫だから。もう離していいから。"
"1300809-10-セリカ" = "う、うん？顔色が悪い？"
"1300809-11-セリカ" = "ちょ、ちょっと疲れただけだから！"
"1300809-12-セリカ" = "昨日から一睡もしてないだけだから……これぐらい何ともない！大丈夫だから……！！"
"1300809-13" = "[s] \"昨日から？\""
"1300809-14-セリカ" = "あ……。"
"1300809-15-セリカ" = "て、徹夜でパトロールのバイトを……。"
"1300809-16" = "[s] \"徹夜？\""
"1300809-17-セリカ" = "そ、その後、朝方には牛乳の配達をして……。"
"1300809-18" = "[s] \"朝方まで？\""
"1300809-19-セリカ" = "そ、それより早くこの辺を片付けないと……ま、間に合わな……"
"1300809-20-セリカ" = "（ふらっ）"
"1300809-21" = "（ばたっ）"
"1300809-22" = "[s] \"セリカ！？\""
"1300809-23-セリカ" = "……。"
"1300809-24-セリカ" = "う、うわああっ！？"
"1300809-25" = "（ガバッ）"
"1300809-26-セリカ" = "わ、私……寝ちゃってた！？"
"1300809-27-セリカ" = "公園のベンチ……？"
"1300809-28-セリカ" = "せ、先生！？何で起こしてくれなかったの！？バイトは？今何時！？"
"1300809-29-セリカ" = "ど、どれぐらい寝ちゃってた！？ってもう午後じゃん！"
"1300809-30" = "[s3] \"落ち着いて。\"\n[s4] \"バイト先には私の方から謝っておいたから。\""
"1300809-31-セリカ" = "え、ええ？"
"1300809-32-セリカ" = "え、ええ？"
"1300809-33-セリカ" = "で、でも……でも……。"
"1300809-34" = "[s] \"無理し過ぎはダメだよ、本当に大変なことになるから。\""
"1300809-35-セリカ" = "……。"
"1300809-36-セリカ" = "……というか、ね、寝てる姿を先生に見られるなんて……。"
"1300809-37-セリカ" = "へ、ヘンタイ！！バカ！！どれだけ女子高生を恥ずかしい気持ちにさせるつもりよ、あんたは！"
"1300809-38-セリカ" = "……。"
"1300809-39-セリカ" = "（はあ……でも、先生の言うことも一理ある）"
"1300809-40-セリカ" = "（健康を損ねたら、元も子もないじゃない……）"
"1300809-41-セリカ" = "（みんなに迷惑をかけることになるし）"
"1300809-42-セリカ" = "……。"
"1300809-43-セリカ" = "……ブランコ、昔はよく乗ってたのに。"
"1300809-44-セリカ" = "最後にここに座ったの、いつだったっけ……。"
"1300809-45-セリカ" = "よしっ。"
"1300809-46" = "（セリカはブランコに座った）"
"1300809-47" = "……。"
"1300809-48" = "― （もっと頑張るしかない。）"
"1300809-49" = "― （この町が無くなりそうなのを[wa:1800]放っておくわけにはいかないから……）"
"1300809-50" = "― 今は……[wa:1400]頼れる大人もいるから……。[wa:400] "
"1300809-51" = "― 先生、[wa:1500]こっちに来て。[wa:1800]私と一緒に乗る？"
"1300809-52" = "― …あはは、[wa:1300]冗談だよ。[wa:1500]いくらなんでもそれは無理だよね。"
"1300809-53" = "― あの～、[wa:1300]聞いてる？[wa:1200]今めっちゃ真面目な雰囲気なんだから。"
"1300809-54" = "― ……まったく。"
"1300809-55" = "― ……うん？[wa:1300]ご苦労様って？"
"1300809-56" = "― 私の努力をよく知ってるって、[wa:3500]何それ…… 。"
"1300809-57" = "― な、[wa:500]何の話？！[wa:1500]いきなり慰めてくるのはやめて！！"
"1300809-58" = "― こ、[wa:500]これは違うの、[wa:2000]目にゴミが入っただけよ……！"
"1300809-59" = "― (でも[wa:1000]先生じゃなかったら……[wa:2500]私は[wa:1000]もっと前に諦めてたかもしれない)"
"1300809-60" = "― な、[wa:500]なに？！[wa:1400]何でそんなにじっとしているの……。[wa:300] "
"1300809-61" = "― 押してくれる？"
"1300809-62" = "― だ、[wa:400]大丈夫じゃないわ！[wa:1600]誰かが見てたらどうするつもり！"
"1300809-63" = "― ……な、[wa:500]なんでもないわよ！！"
"1300809-64" = "― こ、[wa:500]こうやって[wa:1500]先生と二人っきりでデートしてることがバレてしまったら……"
"1300809-65-セリカ" = "……。"
"1300809-66-セリカ" = "きょ、今日はありがとね。"
"1300809-67-セリカ" = "無理はしないでって言ってくれて、嬉しかったよ。先生。"
"1300809-68-セリカ" = "そ、その代わりに……だから……す、少しは頼るからね……。"
"1300809-69-セリカ" = "……。"
"1300809-70-セリカ" = "笑わないでっ！！今真面目な雰囲気だったじゃん！"
"1300809-71-セリカ" = "……はあ。やっぱりダメかも、この大人。"
"1300809-72-セリカ" = "……まあでも、これが先生らしさか。"
"1300809-73-セリカ" = "はあー……んっ。少し休んだからか、結構マシになったかも。"
"1300809-74-セリカ" = "うん。元気出してまた明日から頑張らないと。"
"1300809-75-セリカ" = "じゃあ、帰ろっか、先生？"
