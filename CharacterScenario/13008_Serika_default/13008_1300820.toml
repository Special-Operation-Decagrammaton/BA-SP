[translation]
"1300820-1" = "お気に入りのバッグ"
"1300820-2-セリカ" = "はあ、はあ、はあ……！"
"1300820-3-セリカ" = "いい？先生、ここから動かないでね。"
"1300820-4-セリカ" = "私が良いって言うまで、絶対に出てきちゃダメよ。#n約束、絶対ね。"
"1300820-5" = "[s1] \"わ、分かったけど……\"\n[s2] \"セリカは心配性だね。\""
"1300820-6-セリカ" = "だ、誰が心配性よ！先生のバカっ！"
"1300820-7-セリカ" = "とにかく、流れ弾には気をつけるのよ！"
"1300820-8" = "（セリカは返事も聞かずに走り出してしまった……）"
"1300820-9-チンピラA" = "なんだ、何か作戦があって逃げてるのかと思えば、行き止まりじゃねぇか。"
"1300820-10-チンピラB" = "くくっ、最初から素直に言うこと聞いてたら、手加減してやったのになぁ？#n……覚悟はできてんのか？"
"1300820-11-セリカ" = "……よく言うわね。"
"1300820-12-セリカ" = "覚悟が必要なのはどっちなのか、分からせてあげる！"
"1300820-13-セリカ" = "ああ、もう！ムカついてきたっ！"
"1300820-14-チンピラA" = "ぐっ……い、[ruby=いて]痛[/ruby]ぇな！クソッ……！"
"1300820-15-チンピラB" = "どうなってんだ？#n最初はあんな逃げ腰だったっていうのに……！"
"1300820-16-セリカ" = "これで終わりだと思ってるんじゃないわよね？"
"1300820-17-チンピラA" = "チッ！一時撤退だ！"
"1300820-18-チンピラB" = "お、おいっ！1人で逃げんなよ！！"
"1300820-19-セリカ" = "待ちなさい！ここでケリをつけてやるんだから！"
"1300820-20" = "[s] \"まぁまぁ、セリカ。そこまでにしておこう？\""
"1300820-21-セリカ" = "先生！？隠れててって言ったじゃん！#nどうして出てきちゃったの！？"
"1300820-22-セリカ" = "……このままじゃ収拾がつかなくなりそうって？"
"1300820-23-セリカ" = "な、なによ！#n私が目の前のことしか見えなくなってるみたいじゃない！"
"1300820-24" = "[s] \"セリカが無事なら、それで大丈夫だからさ。\""
"1300820-25-セリカ" = "……そんな心配されたくらいで、[ruby=うなず]頷く[/ruby]と思ってるの？"
"1300820-26-セリカ" = "……あれ？"
"1300820-27-セリカ" = "バッグの紐、切れちゃった……#nヤバ、角も破れてるし……"
"1300820-28-セリカ" = "……。"
"1300820-29" = "[ns] \"セリカ？\""
"1300820-30-セリカ" = "お気に入りのバッグだったのに……"
"1300820-31-セリカ" = "仕方ないわね……だいぶ前に買ったものだし……"
"1300820-32-セリカ" = "……。"
"1300820-33-セリカ" = "はぁ……気に入ってたんだけど、なぁ……"
"1300820-34" = "[s] \"……セリカ、こっちおいで！\""
"1300820-35-セリカ" = "え、先生？急にどうしたの？#nって、ちょっと……どこ行くのよ！"
"1300820-36-セリカ" = "そ、そんなに引っ張らなくても大丈夫だから！"
"1300820-37-セリカ" = "先生、ここは……？"
"1300820-38-セリカ" = "そろそろ教えてくれても……"
"1300820-39" = "[s3] \"いいからいいから、ここは先生に任せて。\"\n[s4] \"店長、いませんか？\""
"1300820-40-バッグ修理店の店長" = "お、先生じゃないか。今日はどうしたんだい？"
"1300820-41" = "[s] \"それがですね……\""
"1300820-42-バッグ修理店の店長" = "なるほど、君のカバンが……"
"1300820-43-セリカ" = "これ……なんだけど……"
"1300820-44-バッグ修理店の店長" = "うむ……バッグのストラップが切れてしまったのか。#n角も少し破れちゃっている……"
"1300820-45-バッグ修理店の店長" = "他にも、あちこちに傷があるね……"
"1300820-46-セリカ" = "うぅ……"
"1300820-47-バッグ修理店の店長" = "でも、君がこのバッグを大切にしている気持ちは伝わってくるよ。"
"1300820-48-セリカ" = "ほ、本当……！？"
"1300820-49-バッグ修理店の店長" = "ああ、しっかり手入れされているのが見て取れる。#n良い持ち主に恵まれて、きっとバッグも喜んでるはずさ。"
"1300820-50-セリカ" = "そ、そう……かしら？なんか、恥ずかしいわね……"
"1300820-51-バッグ修理店の店長" = "よし、一仕事といこう。……これはやり甲斐があるな。"
"1300820-52" = "[ns] \"良かったね、セリカ。\""
"1300820-53-セリカ" = "う、うん……"
"1300820-54-セリカ" = "けど、たかがスポーツバッグに[ruby=おおげさ]大袈裟[/ruby]よ。#n先生も、店長も……"
"1300820-55" = "[s] \"でもセリカにとっては大切なバッグなんだよね？\""
"1300820-56-セリカ" = "な、なに言ってんの！アレはただ！"
"1300820-57-セリカ" = "ただ……"
"1300820-58-セリカ" = "……。"
"1300820-59" = "[s] \"何か思い出があるんじゃない？\""
"1300820-60-セリカ" = "ううん、思い出って言うほどじゃないわ。"
"1300820-61-セリカ" = "ただ……初めてのバイト代で買ったってだけ。"
"1300820-62-セリカ" = "学校、バイト、スポーツ、銃の手入れ……#nどこにでも持っていける丈夫なバッグって広告を見かけて……"
"1300820-63" = "[s] \"その通りだったね。\""
"1300820-64-セリカ" = "先生も、そう思ってくれる……？"
"1300820-65-セリカ" = "……へへ。うん、今日まで私を支えてくれてたくらいだし。"
"1300820-66-セリカ" = "自分でも不思議なくらい、愛着が湧いちゃって……"
"1300820-67-セリカ" = "まあきっと、それだけ丈夫でずっと使ってたからというのもあるんでしょうけど。"
"1300820-68-セリカ" = "こう見えても私、物を見る目にはちょっと自信があるから！"
"1300820-69" = "[s] \"……。\""
"1300820-70-セリカ" = "な、なによ先生……急に黙って。"
"1300820-71-セリカ" = "もう！その顔はなに！"
"1300820-72-セリカ" = "……。"
"1300820-73-セリカ" = "汚れちゃったし、ちょっと手洗ってくる……！"
"1300820-74-バッグ修理店の店長" = "よし、できた。一度持ってみてくれるかい？"
"1300820-75-セリカ" = "わぁ……新品同然じゃない！#nストラップも丈夫なものに変わってるし……"
"1300820-76-バッグ修理店の店長" = "どうだ、気に入ってくれたかい？"
"1300820-77-セリカ" = "すっごく！……それ以上に、ビックリしたけど……"
"1300820-78-バッグ修理店の店長" = "なら良かった。はは、まだまだ私も隠居するには早いな。"
"1300820-79-セリカ" = "あ、ありがとう、店長。#nじゃあ、お会計を……"
"1300820-80-バッグ修理店の店長" = "ああ、そうだな……今日は特別に、基本料だけで構わない。"
"1300820-81-セリカ" = "えっ、いいの？"
"1300820-82-バッグ修理店の店長" = "先生には、ウチをご贔屓にしてもらってるからね。#nそれに物を大切にしてる子を見ると私も嬉しいし、初めて来てくれたからサービスだ。"
"1300820-83-セリカ" = "……。"
"1300820-84-セリカ" = "ありがとう、店長！私、これからも大切にする！"
"1300820-85-セリカ" = "あっ、バイトの時間だ……遅れちゃう！#nごめん、先生！また今度ちゃんとお礼させて！"
"1300820-86-セリカ" = "……で。"
"1300820-87-バッグ修理店の店長" = "これで良かったのかい、先生？"
"1300820-88" = "[ns] （[ruby=うなず]頷く[/ruby]）"
"1300820-89-バッグ修理店の店長" = "結構な金額だが……まあ、私は代金を支払ってもらえるなら構わない。"
"1300820-90-バッグ修理店の店長" = "ここまでする理由を教えてくれないか、先生？"
"1300820-91" = "[s5] \"あれは、セリカにとって大切な思い出の品ですから。\"\n[s6] \"お金には代えられない価値があるんです。\""
"1300820-92-バッグ修理店の店長" = "……そうか。"
"1300820-93-バッグ修理店の店長" = "心配しないでくれ。どんな風に使っても数年は壊れないさ。"
"1300820-94" = "（その後、用事を済ませてからシャーレに戻った）"
