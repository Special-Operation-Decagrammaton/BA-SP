[translation]
"1006506-1" = "カホさんの計画的な営業戦略"
"1006506-2" = "（カホに言われた陰陽部の部室に到着した）"
"1006506-3" = "[ns] \"待ち合わせ場所は合ってるはず……。\""
"1006506-4-？？？" = "これは……こっちに……"
"1006506-5-？？？" = "あとは、これを飾って……"
"1006506-6" = "[s] （カホの声だ……奥に居るのかな？）"
"1006506-7-カホ" = "あ、先生。いらしたんですね。"
"1006506-8" = "[s] \"お待たせ、カホ。何してるの？\""
"1006506-9-カホ" = "よく聞いてくださいました……！"
"1006506-10-カホ" = "ふふっ、先ほどお話したグッズを飾っているところです！"
"1006506-11-カホ" = "陰陽部の部室は、訪問客をお招きする場所でもありますので……"
"1006506-12-カホ" = "ここに宣伝グッズを飾れば……"
"1006506-13-カホ" = "間違いなく、宣伝効果は抜群でしょう！"
"1006506-14" = "[s] \"確かに、カホらしいね。\""
"1006506-15-カホ" = "ですから、少々お待ちください、先生。"
"1006506-16-カホ" = "もう少々、光の当たる位置に……真っ直ぐ並べて……"
"1006506-17" = "[s] \"私も手伝って良いかな？\""
"1006506-18-カホ" = "あ……ありがとうございます。"
"1006506-19-カホ" = "では、よろしくお願いしますね。"
"1006506-20" = "（カホと一緒にグッズを並べ終え……）"
"1006506-21-カホ" = "これにて完了ですね、先生！"
"1006506-22" = "[wa:550]― 先生、[wa:1100]いかがでしょう？"
"1006506-23" = "― この無邪気なまん丸の瞳に……"
"1006506-24" = "― 深く考え込むような表情……"
"1006506-25" = "[wa:300]― もう、[wa:1100]本当に[wa:1100]めちゃくちゃ可愛くないですか！？"
"1006506-26" = "[wa:150]― はぁ[wa:1530]天が与えた造形……[wa:2320]最高……"
"1006506-27" = "― 生きててよかった……！"
"1006506-28" = "[ns] \"本当にみんな可愛いね。\""
"1006506-29" = "[wa:100]― はい。[wa:850]本当に、"
"1006506-30" = "― みんな可愛くて[wa:1150]大切な子なんです。"
"1006506-31" = "[wa:100]― 愛くるしい子、[wa:1600]格好良い子、"
"1006506-32" = "― クールな子、[wa:1350]美しい子……"
"1006506-33" = "[wa:200]― ふふっ……"
"1006506-34" = "― まるで[wa:1050]百鬼夜行の生徒みたいですね。"
"1006506-35" = "[ns] \"どういうこと……？\""
"1006506-36" = "[wa:150]― みんな違うからこそ、"
"1006506-37" = "― 時に[wa:700]ぶつかる事もありますが……"
"1006506-38" = "― それぞれが[wa:1250]輝く個性を持った"
"1006506-39" = "― 大切な生徒だな、[wa:1050]と思いまして。"
"1006506-40" = "[ns1] \"そうだね……もちろん、そこにはカホも居るよ。\"\n[ns2] \"いつも頑張ってるカホも、私にとって大切な生徒だよ\" "
"1006506-41" = "[wa:50]― せ…[wa:650]先生……！？"
"1006506-42" = "[wa:50]― せ…[wa:650]先生……！？"
"1006506-43" = "― うぅ……[wa:1550]急にそんな……"
"1006506-44" = "― あ……[wa:1050]ありが……とう……"
"1006506-45" = "― ございます……[wa:1450]先生……"
"1006506-46" = "（そうしてカホと一緒に楽しい時間を過ごした）"
