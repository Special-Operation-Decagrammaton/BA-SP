[translation]
"1014903-1" = "ダイバーと船歌"
"1014903-2" = "（日差しの強い、ある日の午後）"
"1014903-3" = "（ココロとのダイビング後、片付けの最中……）"
"1014903-4-ココロ" = "ふん、ふーん……♪"
"1014903-5" = "（少し離れたところから戻ってくると、ココロが鼻歌を歌いながら片づけをしていた)"
"1014903-6-ココロ" = "♪おひさま　さんさん、こいしは　きらきら……♪"
"1014903-7-ココロ" = "……ふふふ～ん♪"
"1014903-8" = "[s1] \"それ、なんて歌？\"\n[s2] \"素敵なメロディーだね。\""
"1014903-9-ココロ" = "あ、先生。"
"1014903-10-ココロ" = "歌って、なんのことですか？"
"1014903-11" = "[s] \"今、口ずさんでなかった？\""
"1014903-12-ココロ" = "……あ。"
"1014903-13-ココロ" = "あああ……！"
"1014903-14-ココロ" = "気にしないでください！忘れてください！"
"1014903-15-ココロ" = "うぅ、作業してるうちに楽しくなっちゃって……つい歌ってしまいました……！"
"1014903-16-ココロ" = "先生にこんな姿を見られるなんて……。"
"1014903-17" = "[s3] \"別に恥ずかしがらなくても。\"\n[s4] \"素敵な歌だったよ。\""
"1014903-18-ココロ" = "でも……やっぱり人に聞かせるのは恥ずかしいです。"
"1014903-19-ココロ" = "今のは即興の鼻歌でしたけど……。"
"1014903-20-ココロ" = "中学以来、人前で歌うことはありませんでしたし……。"
"1014903-21" = "[s] \"そうなの？ココロの声、綺麗なのに。\""
"1014903-22-ココロ" = "自分では思ったことないのですが……ありがとうございます。"
"1014903-23-ココロ" = "でも、私が歌うと……悪いことが起きるから……。"
"1014903-24" = "[s] \"悪いこと？\""
"1014903-25-ココロ" = "……はい。"
"1014903-26-ココロ" = "先生はセイレーンの伝説をご存知ですか？"
"1014903-27-ココロ" = "セイレーンは……下半身が海鳥の姿をした、伝説の怪物なのですが――"
"1014903-28-ココロ" = "その歌声を聞いた船員は、みんな海へ飛び込んでしまうのだそうです。"
"1014903-29-ココロ" = "不思議なことに……私が歌うときも、聴いた人は海に飛び込んでしまうんです。"
"1014903-30" = "[s] \"セイレーンの歌みたいに？\""
"1014903-31-ココロ" = "はい。#n飛び込んだ理由を聞きましたが……みんな、目をそらして言葉をにごすばかりで。"
"1014903-32-ココロ" = "もしかしたら、私の祖先に本物のセイレーンがいるのかもしれません。"
"1014903-33-ココロ" = "セイレーンは空想上の存在なんですけどね。"
"1014903-34-ココロ" = "まぁ、なんとなくそう思っているだけなんですけど。#nみんなが水に飛び込まないように、人前で歌うのは控えていたんです。"
"1014903-35" = "[s5] \"そうだったんだ。でも、なんだかもったいないね。\"\n[s6] \"どんな歌声か、私も聴いてみたいな。\""
"1014903-36" = "[ns7] \"じゃあさ、ココロ。今から――\"\n[ns8] \"私の前で歌ってよ！\""
"1014903-37-ココロ" = "はい！？先生、話聞いてました！？"
"1014903-38-ココロ" = "危険です！海に飛び込みたくなっちゃうかも……！"
"1014903-39" = "[s9] \"大丈夫だよ、この辺はそんなに深くないし。\"\n[s10] \"心配なら、私を縛ってから歌ってみたら？\""
"1014903-40-ココロ" = "たしかに、それなら安全ですが……。"
"1014903-41-ココロ" = "本当に、いいんですか……？"
"1014903-42" = "[s] \"うん！ココロの歌声、聴きたい！\""
"1014903-43-ココロ" = "……分かりました。少し、失礼します。"
"1014903-44-ココロ" = "試しに、手足を動かしてみてください。"
"1014903-45-ココロ" = "……大丈夫そうですね。"
"1014903-46-ココロ" = "では……。"
"1014903-47-ココロ" = "[ruby=とうみ]渡海[/ruby]ココロ、歌います！"
"1014903-48" = "（少し緊張した面持ちで、ココロが歌いはじめた）"
"1014903-49" = "（ココロの歌声は……聞き心地は悪くなかったのだが……）"
"1014903-50-ココロ" = "♭わたしの　なまえは　♯ココロ～♪"
"1014903-51" = "（歌い出しの時点で、みんなが水に飛び込んだ理由が分かった）"
"1014903-52-ココロ" = "うみを♭　およぐ　ダイビングぶの　#ぶちょう～"
"1014903-53" = "（ココロの歌は、リズムも音程もバラバラで……聴いていると不安になってくる）"
"1014903-54" = "（本人は気づいてない様子だったが……。#n見ている方がいたたまれなくなるほどの……音痴だった）"
"1014903-55-ココロ" = "ああ～♯うみは　♭たのしい～"
"1014903-56" = "（しかし、気持ちよく歌っているココロを邪魔する気にもなれず……。#n私は全力でその場を耐え抜いた)"
"1014903-57-ココロ" = "ふぅ……。"
"1014903-58-ココロ" = "えっと……いかがでしょうか……？"
"1014903-59-ココロ" = "歌を聴いている間……海に飛び込みたくなったり、しませんでしたか？"
"1014903-60" = "[s11] \"ううん、超悪くなかった！\"\n[s12] \"良かったよ！気を失うくらい！\""
"1014903-61-ココロ" = "本当ですか！？よかった……やっとセイレーンの呪いから抜け出せたんですね。"
"1014903-62-ココロ" = "先生が背中を押してくれなかったら……ずっと知らないままでした。"
"1014903-63" = "[s] \"じゃあ、そろそろほどいてくれる？\""
"1014903-64-ココロ" = "はい！もちろんです！"
"1014903-65-ココロ" = "あの……先生？もしよろしければ……もう一曲だけ、歌ってもいいですか？"
"1014903-66-ココロ" = "久しぶりに歌ったら、なんだかもっと歌いたくなって。"
"1014903-67-ココロ" = "あ、その前にこれ、外しますね。"
"1014903-68" = "[s] \"やっぱり、縛ったままにしておいて。\""
"1014903-69-ココロ" = "えっ、でも……縛られたままだとお辛いんじゃ？"
"1014903-70" = "[s13] \"実は、縛られるのが好きなんだ！\"\n[s14] \"だから私のことは気にしなくて良いよ！\""
"1014903-71-ココロ" = "分かりました……。"
"1014903-72-ココロ" = "では！もう一曲、歌いますね！"
"1014903-73" = "（その後……縛られたまま、ココロが楽しく歌う姿を観賞した）"
