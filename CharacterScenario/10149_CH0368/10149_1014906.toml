[translation]
"1014906-1" = "ダイバーと減圧症"
"1014906-2" = "（翌日……ダイビング部の見学のために、借りた船で近海へ出た)"
"1014906-3" = "（準備を終えたココロが、水に入る前――）"
"1014906-4-ココロ" = "そういえば先生、あの噂を聞きましたか？"
"1014906-5-ココロ" = "最近、辺りで小さな船を襲う不良生徒たちがいるって……。"
"1014906-6-ココロ" = "私が潜ってる間に、先生が襲われたらどうしましょう……？"
"1014906-7-ココロ" = "先生は自衛する手段を持っていないので、きっとされるがままに……。"
"1014906-8" = "[s1] \"大丈夫。生徒の相手には慣れてるから。\"\n[s2] \"その時は会話でどうにかしてみるよ。\""
"1014906-9-ココロ" = "そんな、ダメです！"
"1014906-10-ココロ" = "先生は海の生徒の恐ろしさを、ご存じないんです……！"
"1014906-11-ココロ" = "荒っぽくて無慈悲で、陸のスケバンとは訳が違います！"
"1014906-12-ココロ" = "癇癪持ちの子どものような彼女たちに、運悪く絡まれた日には……。"
"1014906-13-ココロ" = "うぅ、考えたくもありません。"
"1014906-14-ココロ" = "ダイビングの準備は完璧なのに……。#n先生のこととなると、いつもポカをやらかしてしまいます……。"
"1014906-15" = "[s3] \"そこまで心配しなくていいと思うけど……。\"\n[s4] \"もし何かあったとき、連絡手段はある？\""
"1014906-16-ココロ" = "いえ……海の中では電波が届かないので、携帯も使えませんし……。"
"1014906-17-ココロ" = "あ……！"
"1014906-18-ココロ" = "先生、これを受け取ってください。"
"1014906-19" = "[s] \"これは……？\""
"1014906-20-ココロ" = "ダイバー用のシグナルブイです。"
"1014906-21-ココロ" = "海に投げると開いて音が鳴るので、水の中からでも分かるんです。"
"1014906-22-ココロ" = "もし何かあったら、これを投げてください。"
"1014906-23-ココロ" = "時々水面を確認して、ブイが開いていたらすぐに上がってくるので……！"
"1014906-24" = "[s5] \"分かった、ありがとう。\"\n[s6] \"ココロも気をつけてね。\""
"1014906-25-ココロ" = "はい……！"
"1014906-26" = "（ココロが潜ってから約30分後……）"
"1014906-27" = "[ns] \"う、うわっ！？\""
"1014906-28" = "（突然飛んできた海鳥に驚いて、持っていたシグナルブイを落としてしまった）"
"1014906-29" = "（海に落ちたブイはすぐに開き、けたたましい音を鳴らしはじめた）"
"1014906-30" = "[ns7] （どうしよう……？）\n[ns8] （ココロを誤解させちゃうかも……）"
"1014906-31-ココロ" = "せ、先生……！"
"1014906-32-ココロ" = "大丈夫ですか！？ ブイが開いているのが見えて……！"
"1014906-33" = "[s9] \"ごめん、うっかりブイを落としちゃったんだ！\"\n[s10] \"何も起きてないよ、本当にごめん……！\""
"1014906-34-ココロ" = "そうですか……何もなかったんですね……。"
"1014906-35-ココロ" = "よかったです……てっきり、先生に何かあったのかと……。"
"1014906-36" = "[s11] \"ココロこそ大丈夫？\"\n[s12] \"急に浮上すると、減圧症になるんじゃ……？\""
"1014906-37-ココロ" = "……私ですか？"
"1014906-38-ココロ" = "私は……全然……何ともないですよ。"
"1014906-39-ココロ" = "……ヒック。"
"1014906-40" = "[s] \"何ともない感じではないよ！？\""
"1014906-41-ココロ" = "少しクラクラしますけどぉ……ぜんっぜん、問題ないですぅ……！"
"1014906-42-ココロ" = "視界がぼやけてぇ、身体がムズムズします……けどぉ、ヒック、大丈夫れす！"
"1014906-43" = "[s] \"今すぐ減圧チャンバーに行こう。\""
"1014906-44-ココロ" = "い～え……私の心配はぁ、いりません！"
"1014906-45-ココロ" = "むしろ心配なのは……先生の方れす……！"
"1014906-46" = "[s] \"私？\""
"1014906-47-ココロ" = "はいぃ。"
"1014906-48-ココロ" = "先生は銃弾も防げないし……。#n水深100mの水圧にだって、生身じゃ耐えられないのに……。"
"1014906-49-ココロ" = "生徒が危ないと真っ先に駆けつけるし……すぐ責任取るって言うしぃ……。"
"1014906-50-ココロ" = "凶悪な不良生徒にまで、優しくするんれすからぁ……。"
"1014906-51-ココロ" = "ちゃんと気をつけないと……絶対に、いつか……。"
"1014906-52-ココロ" = "ひどい目に遭っちゃいましゅ……！"
"1014906-53" = "[s13] \"分かった、分かったから。今は私に頼って。\"\n[s14] \"ほら、肩に捕まって。\""
"1014906-54-ココロ" = "先生に頼る……？"
"1014906-55-ココロ" = "それに、肩を……本当に良いんですかぁ……？"
"1014906-56-ココロ" = "ふふ……ふふふ……。"
"1014906-57-ココロ" = "……たまには、こういうのもありかも。"
"1014906-58" = "[s] \"今、とんでもないこと言わなかった？\""
"1014906-59-ココロ" = "言ってませんよぉ！？"
"1014906-60" = "（その後、ぐでんぐでんのココロをオデュッセイアの医務室まで連れていった）"
"1014906-61" = "（ココロは減圧チャンバーですっかり回復したが……。#nしばらくの間、私を避けていた……）"
