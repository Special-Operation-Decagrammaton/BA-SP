[translation]
"1005003-1" = "子どもではありません。レディーなんです！"
"1005003-2" = "山海経訓育支援部・梅花園"
"1005003-3" = "（山海経での仕事を終えて帰る途中、ココナに会った）"
"1005003-4-ココナ" = "あっ、こんにちは。先生！"
"1005003-5-ココナ" = "シャーレに帰るところですか？ちょうど私もそちらに行くところでした。"
"1005003-6-ココナ" = "シュン姉さんがシャーレの近くで用事があると聞きまして。"
"1005003-7-ココナ" = "お姉さんを迎えに行こうとしていたんです。"
"1005003-8-ココナ" = "……せっかくですし、先生にチャンスをあげましょう。"
"1005003-9-ココナ" = "それは……レディーである私をエスコートするチャンスです。えへん！"
"1005003-10" = "[s1] \"ココナちゃんのエスコートか……確かに貴重なチャンスだね。\"\n[s2] \"私がココナちゃんのエスコートを？光栄だね。\""
"1005003-11-ココナ" = "だーかーらー！ココナちゃんじゃないんですってば！"
"1005003-12-ココナ" = "だーかーらー！ココナちゃんじゃないんですってば！"
"1005003-13-ココナ" = "うぅ……今は私たち二人しかいないから、我慢してあげてるんですからね？"
"1005003-14" = "（その後もココナと楽しく話しながら、市内まで歩いていった）"
"1005003-15" = "夜の街"
"1005003-16-ココナ" = "そういえば、先ほどコーヒーを買ってましたよね？"
"1005003-17-ココナ" = "大人はみんなコーヒーを飲んでいますが……美味しいんですか？"
"1005003-18" = "[s3] \"……おいしくて飲むというより、生きるために飲むというか……\"\n[s4] \"大人の味ってやつだね、うん。\""
"1005003-19-ココナ" = "よく分からないけど……毎日のように何杯も飲んでいるのを見ると。"
"1005003-20-ココナ" = "よく分からないけど……毎日のように何杯も飲んでいるのを見ると。"
"1005003-21-ココナ" = "きっと……そこには抗えない魅力があるのでしょう。"
"1005003-22" = "[s] \"ちょっとだけ飲んでみる？大人の味。\""
"1005003-23-ココナ" = "……もちろんです。私は立派なレディーですよ！"
"1005003-24-ココナ" = "先生が笑っていらっしゃるのが少し気にかかりますが……"
"1005003-25-ココナ" = "いいでしょう。コーヒーぐらい、私には何でもないですから！"
"1005003-26" = "（ココナにコーヒーを渡した）"
"1005003-27-ココナ" = "これが……コーヒー……"
"1005003-28-ココナ" = "黒いですね……夜空よりもっと黒いような。"
"1005003-29-ココナ" = "それに熱いです。"
"1005003-30-ココナ" = "あちち、手がやけどしちゃいそうです……"
"1005003-31-ココナ" = "この匂いは何でしょう？何か、焦げたような香りが混ざっているような……"
"1005003-32-ココナ" = "本当にこれ、飲んで大丈夫なんですよね？"
"1005003-33" = "[s5] \"無理に飲まなくてもいいんだよ。\"\n[s6] \"ココナちゃんにはまだ早かったかもしれないね。\""
"1005003-34-ココナ" = "な、何を！"
"1005003-35-ココナ" = "な、何を！"
"1005003-36-ココナ" = "私はだから、その、ただ……"
"1005003-37-ココナ" = "そう！香りを吟味していただけですよ！"
"1005003-38" = "[s] \"焦げた匂いがするって言ってなかった？\""
"1005003-39-ココナ" = "焦げた匂いが混ざっていると言っても、この香りが嫌だとは言ってません。"
"1005003-40-ココナ" = "そもそもこれくらい飲めないのに……一人前の教官とは言えないじゃないですか。"
"1005003-41" = "[s] \"教官とは関係ないと思うけど……\""
"1005003-42-ココナ" = "と、とにかく、私がそうだと言ったらそうなのです！"
"1005003-43-ココナ" = "少なくとも自分にとっては、ですね……"
"1005003-44-ココナ" = "そ、それでは飲みますね。"
"1005003-45-ココナ" = "3、2、1……！"
"1005003-46" = "（ココナは一気にコーヒーを飲んだ）"
"1005003-47" = "（そういう風に飲むものではないと止める間もなかった）"
"1005003-48-ココナ" = "はぁ……うう……"
"1005003-49" = "[s] \"ココナちゃん大丈夫？\""
"1005003-50-ココナ" = "苦い……です……"
"1005003-51-ココナ" = "ふええん……何ですかこれは。#nきつくて、苦くて、まずくて……"
"1005003-52-ココナ" = "大人はなんでこんなものを飲むんですか？"
"1005003-53-ココナ" = "みんな辛いことを楽しんでるんですか？#n変態なんですか？"
"1005003-54-ココナ" = "大人の味って、変態の味だったんですか？！"
"1005003-55" = "[s7] \"いや、そこまでは……\"\n[s8] \"ある意味合ってる気もするけど！？\""
"1005003-56-ココナ" = "ふぇん……わかりません。#n私はやっぱりアイスが好きです。"
"1005003-57-ココナ" = "ふぇん……わかりません。#n私はやっぱりアイスが好きです。"
"1005003-58-ココナ" = "でもアイスは大人も好きじゃないですか？"
"1005003-59-ココナ" = "それならアイスも大人の味と言えるのではないでしょうか？"
"1005003-60-ココナ" = "早くそうだと言ってください、先生。"
"1005003-61-ココナ" = "え？コーヒーもアイスクリームも楽しめるのが大人……？"
"1005003-62-ココナ" = "ふえん……そんなの知りません。#nわからないんですよ……"
"1005003-63" = "（その後、泣きべそになったココナを宥めながらシャーレに戻った）"
