[translation]
"1010603-1" = "もう一人の私"
"1010603-2" = "（サクラコに連絡をもらい、待ち合わせ場所に向かった）"
"1010603-3-？？？" = "……いらっしゃいましたか、先生。"
"1010603-4" = "[ns1] \"……あれ。\"\n[ns2] \"今日はいつもの格好なんだね。\""
"1010603-5-サクラコ" = "……はい。"
"1010603-6-サクラコ" = "実は理由がありまして。"
"1010603-7-サクラコ" = "相談の内容にも関わっているのです。"
"1010603-8-サクラコ" = "……先生。"
"1010603-9-サクラコ" = "私は常に、周囲の目を気にしながら行動しております。"
"1010603-10-サクラコ" = "これはシスターとして過ごすうえで、自然と身についてきました。"
"1010603-11-サクラコ" = "すべては、皆様にご迷惑をかけないため。"
"1010603-12-サクラコ" = "ちょっとした用事であっても、#nシスターとして振る舞うよう気をつけておりました。"
"1010603-13-サクラコ" = "人は制服通りの人間になると申しますから……。#nですが……。"
"1010603-14-サクラコ" = "私としたことが、レッスンを終えてからアイドル衣装のまま帰路についてしまったのです。"
"1010603-15-サクラコ" = "そこで、帰り道に新しく入ったシスターの方とお会いしまして。"
"1010603-16-サクラコ" = "いつものように、お声がけしたのですが……。"
"1010603-17" = "[ns3] \"……それがどうかしたの？\"\n[ns4] \"何か問題でも……？\""
"1010603-18-サクラコ" = "ええとですね。"
"1010603-19-サクラコ" = "その方は、アイドル活動について聞いていないのか……。"
"1010603-20-サクラコ" = "私がシスターフッドの者だと気づかなかったのです。"
"1010603-21-サクラコ" = "そして……。"
"1010603-22-サクラコ" = "別人の同い年の生徒だと勘違いされたまま、話が進んでしまいました。"
"1010603-23-サクラコ" = "誤解を解こうと思い名前をお伝えしたのですが、#n「サクラコ」ではなく「サクラ」だと思われたようで……。"
"1010603-24-サクラコ" = "そのまま、一緒にカラオケを三時間も……。"
"1010603-25" = "[s5] \"……あっ。\"\n[s6] \"えっと……。\""
"1010603-26-サクラコ" = "説明する機会を何度も伺ったのですが、タイミングが掴めず……！"
"1010603-27-サクラコ" = "何よりも、アイドル衣装を着ていたせいか……。"
"1010603-28-サクラコ" = "いつもの自分ではないような振る舞いをしてしまいました。"
"1010603-29-サクラコ" = "別れ際も、「サクラちゃん」と呼ばれ……。"
"1010603-30-サクラコ" = "連絡先を交換したのですが、どうすれば良いものでしょう。"
"1010603-31-サクラコ" = "シスターフッドの方とあまり連絡先を交換していないので、#n今も気づいていないと思います。"
"1010603-32-サクラコ" = "しかも、また会う約束までしてしまい……。"
"1010603-33" = "\"サクラちゃん、日曜また会おうね！\""
"1010603-34" = "\"ほかの友達も呼んでおくよ！サクラちゃんの歌楽しみにしてるって！\""
"1010603-35" = "\"また連絡するね～\""
"1010603-36" = "[ns7] \"「歌住サクラちゃん」……。\"\n[ns8] \"大人気だね。\""
"1010603-37-サクラコ" = "うぅっ……。"
"1010603-38-サクラコ" = "不本意ながら騙す形になってしまい、謝罪をしたいのですが……。"
"1010603-39-サクラコ" = "本当のことを打ち明けて、傷ついてしまわないか心配でして。"
"1010603-40-サクラコ" = "……私が着替えてから帰っていれば。"
"1010603-41-サクラコ" = "……へっ？"
"1010603-42-サクラコ" = "そ、そんな……。"
"1010603-43-サクラコ" = "本当に、問題ないのでしょうか？"
"1010603-44-サクラコ" = "ですが、普通に話すと言っても……。"
"1010603-45" = "[s9] \"いつも通りのサクラコで良いんだよ！\"\n[s10] \"きっと大丈夫だから！\""
"1010603-46-サクラコ" = "そんな簡単にうまくいくとは……。"
"1010603-47-サクラコ" = "私がどう思われているのかくらい、知っております。"
"1010603-48-サクラコ" = "……先生。"
"1010603-49-サクラコ" = "ほ、本当に……。"
"1010603-50-サクラコ" = "……大丈夫なのでしょうか？"
"1010603-51-サクラコ" = "そうですね……。"
"1010603-52-サクラコ" = "打ち明けるのなら、早いほうが良いに決まっています。"
"1010603-53-サクラコ" = "いつもとは、状況も違うわけですし。"
"1010603-54-サクラコ" = "シスターフッドの歌住サクラコではなく、私個人の問題。"
"1010603-55-サクラコ" = "本当のことをお伝えしたとしても……。"
"1010603-56-サクラコ" = "シスターフッドの皆様にご迷惑はかからないでしょう。#nこれは私が責任を負うべき問題ですから。"
"1010603-57" = "[s11] \"私も大丈夫だと思うよ。\"\n[s12] \"正直に話せば分かってくれるはずだよ。\""
"1010603-58-サクラコ" = "では、先生の仰る通り……。"
"1010603-59-サクラコ" = "すぅ、はぁー……。"
"1010603-60-サクラコ" = "連絡しました。#n直接お会いして、謝ろうと思います。"
"1010603-61-サクラコ" = "……ふぅ。"
"1010603-62-サクラコ" = "こんなに緊張するのは、久しぶりかもしれません。"
"1010603-63-サクラコ" = "ありがとうございます、先生。"
"1010603-64-サクラコ" = "背中を押していただいたおかげで、勇気が出ました。"
"1010603-65-サクラコ" = "また助けられてしまいましたね。"
"1010603-66-サクラコ" = "では……。"
"1010603-67-サクラコ" = "後ほど、ご報告いたします。"
"1010603-68" = "（緊張していたサクラコを励ましてから、シャーレに戻った）"
