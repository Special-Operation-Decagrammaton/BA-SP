"1001320-37-ツルギ" = "……いえ。こういう言い方の方が、失礼ですね。"
"1001320-38-ツルギ" = "それではその、よろしければ……"
"1001320-39" = "（ツルギの部屋は、かなり綺麗に整理されていた）"
