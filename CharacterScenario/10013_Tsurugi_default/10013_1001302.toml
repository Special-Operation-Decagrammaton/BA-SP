[translation]
"1001302-1" = "大事なのは距離感！"
"1001302-2" = "トリニティ総合学園・外郭地区"
"1001302-3-ツルギ" = "……。"
"1001302-4" = "（まるでモンスターのような動きで徘徊しているツルギを発見した）"
"1001302-5" = "（ちょうど以前の間違いのチャットの件もあったし、声をかけてみることにする）"
"1001302-6" = "[s1] 挨拶をする。\n[s2] 手を振る。"
"1001302-7-ツルギ" = "……？"
"1001302-8-ツルギ" = "……？"
"1001302-9-ツルギ" = "！！？"
"1001302-10-ツルギ" = "……。"
"1001302-11-ツルギ" = "ぎ、ぎゃあああああああああーーーーーーー！？"
"1001302-12" = "（ひゅーーーーーん！）"
"1001302-13" = "（ツルギがものすごいスピードで逃げてしまった）"
"1001302-14" = "[s3] ……面白いから追いかける。\n[s4] ……心配だから追いかける。"
"1001302-15-ツルギ" = "はあ……はあ……。"
"1001302-16" = "[s5] やっと追いついた。\n[s6] \"なんで逃げるの！？\""
"1001302-17-ツルギ" = "！！？"
"1001302-18-ツルギ" = "！！？"
"1001302-19-ツルギ" = "ぎゃっ、きゃああははぁぁーーー！？！"
"1001302-20" = "（ひゅーーーーん！）"
"1001302-21" = "（ツルギがまたものすごいスピードで逃げてしまった）"
"1001302-22" = "[ns] \"待ってー！\""
"1001302-23" = "[ns] \"待ってってばー！\""
"1001302-24" = "（プオオオオオオン！！）"
"1001302-25-ツルギ" = "ごめんなさいいいいいいいいーー！！"
"1001302-26" = "[s7] \"ちょ、ちょっと待って！電車が……！\"\n[s8] \"ツルギ、前見て！！\""
"1001302-27-ツルギ" = "！？！？"
"1001302-28-ツルギ" = "！？！？"
"1001302-29" = "（ドゴッッッッ！！）"
"1001302-30-ツルギ" = "きえええええぇぇぇーーっ！？！？"
"1001302-31" = "（ツルギが電車に引かれて、10メートルぐらい吹っ飛んでいった）"
"1001302-32" = "[s9] \"…………！？！！？\"\n[s10] \"ツルギ！？\""
"1001302-33" = "（すくっ）"
"1001302-34-ツルギ" = "……。"
"1001302-35-ツルギ" = "す、すみません、先生……。"
"1001302-36" = "[s11] 何ともなさそう……。\n[s12] \"ツルギは丈夫なんだね……。\""
"1001302-37-ツルギ" = "あ、あのメッセージは……何をどう送ればいいか、分からなくて……。"
"1001302-38-ツルギ" = "あ、あのメッセージは……何をどう送ればいいか、分からなくて……。"
"1001302-39-ツルギ" = "5時間ぐらい……悩んで……。"
"1001302-40" = "（バタッ）"
"1001302-41" = "[s13] \"5時間も！？\"\n[s14] \"ツルギ！？\""
"1001302-42" = "（ツルギが先生にメッセージを送る、5時間前）"
"1001302-43-ツルギ" = "…………。"
"1001302-44" = "（ぺらっ）"
"1001302-45" = "（特集記事！大人との恋愛で成功する7つの方法！）"
"1001302-46" = "（相手は大人！挑発的なメッセージで興味を持たせて！）"
"1001302-47" = "（子供扱いされないようにすることが重要！）"
"1001302-48" = "（相手との距離を保つこと！近寄ってきたら逃げて、離れたら近寄る。一定の距離感を維持するのがポイント！）"
"1001302-49-ツルギ" = "……。"
"1001302-50-ツルギ" = "（分からない……挑発的なメッセージ、って……！？）"
"1001302-51-ツルギ" = "（敵に向かってやるようにすればいいのかな……）"
"1001302-52-ツルギ" = "けけけけ、きひゃひゃひゃひゃひゃ！"
"1001302-53-ツルギ" = "……。"
"1001302-54-ツルギ" = "（……そんなわけない）"
"1001302-55-ツルギ" = "（なに、どうすればいいの……？）"
"1001302-56-ツルギ" = "（先生と仲良くなるためには……）"
"1001302-57-ツルギ" = "（ポチポチ）ご、無、沙、汰、し、て、お、り、ま、す。不、肖、剣、先、ツ、ル、ギ……。"
"1001302-58-ツルギ" = "違う！！全然挑発的じゃない！！"
"1001302-59-ツルギ" = "もう一回……。"
"1001302-60" = "（5時間後）"
"1001302-61-ツルギ" = "きええええぇぇぇええっ！なんて書けばいいか分からないいいいいぃぃぃ！！"
"1001302-62-ツルギ" = "きえええええええぇぇぇっ！きひゃあああぁぁっ！"
"1001302-63-ツルギ" = "あああああぁーーっ！きゃあああおおぁ……。"
"1001302-64" = "（ピピッ）"
"1001302-65" = "（音声認識完了、送信されました）"
"1001302-66-ツルギ" = "ぎぇあぁ……。"
"1001302-67-ツルギ" = "……。"
"1001302-68-ツルギ" = "きゃああああああぁぁぁっ！？！？"
"1001302-69-ツルギ" = "……。"
"1001302-70" = "[s] \"そういうことだったんだね。\""
"1001302-71-ツルギ" = "す、すみませんんんんんんん！ご迷惑を、ご迷惑をおかけしました！！"
"1001302-72" = "[s] \"大丈夫だよ。\""
"1001302-73-ツルギ" = "……だ、大丈夫、ですか？"
"1001302-74-ツルギ" = "でも意味不明のメッセージを送っちゃって……。"
"1001302-75" = "（ツルギがソワソワしている）"
"1001302-76" = "[s15] 落ち着いて、と頭を撫でてあげる。\n[s16] 頭を撫でて落ち着かせる。"
"1001302-77" = "（スッ）"
"1001302-78-ツルギ" = "……うぇ？"
"1001302-79" = "（なでなでなで）"
"1001302-80" = "[s] 大丈夫だから、いつでも気楽に連絡してと伝える。"
"1001302-81-ツルギ" = "……。"
"1001302-82-ツルギ" = "（カァーッ……！）"
"1001302-83-ツルギ" = "は……はい……。"
"1001302-84-ツルギ" = "わ、分かり、ました……。"
"1001302-85" = "[s] \"でも、踏切は周りをよく見てから渡ってね。\""
"1001302-86-ツルギ" = "き、肝に、銘じます……。"
"1001302-87" = "[s] \"ツルギちゃんが怪我したらいけないから、分かった？\""
"1001302-88-ツルギ" = "……あ、う……はい。"
"1001302-89" = "（顔を真っ赤にして、大人しく挨拶をするツルギだった）"
"1001302-90" = "（もちろん、迷惑をかけた駅員さんには私の方から土下座して謝罪した）"
