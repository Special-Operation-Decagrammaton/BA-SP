[translation]
"1011102-1" = "驚くほど普通に"
"1011102-2" = "ミレニアム自治区・公園"
"1011102-3" = "[ns] \"おはよう、ネル。\""
"1011102-4-ネル" = "あ、先生。"
"1011102-5-ネル" = "わりぃ、ちっと眠くて。"
"1011102-6" = "[s] \"今日は制服なんだね。\""
"1011102-7-ネル" = "あぁ、この格好で会うのは初めてだっけ？"
"1011102-8-ネル" = "色々と事情があってな。"
"1011102-9-ネル" = "セミナーの会計から、しばらく制服を着るよう頼まれちまって。"
"1011102-10-ネル" = "普段だったら無視するところだが……。"
"1011102-11-ネル" = "断るにも断りきれなくてな。"
"1011102-12-ネル" = "実は先生を呼んだ理由も、この服のせいなんだ。"
"1011102-13-ネル" = "スカジャンを着てないと、どうも落ち着かなくて……。"
"1011102-14-ネル" = "だから、先生にアドバイスを……。"
"1011102-15-ネル" = "……。"
"1011102-16-ネル" = "ぐあああああっ！"
"1011102-17" = "[s] \"だ、大丈夫！？\""
"1011102-18-ネル" = "大丈夫なわけあるか！#nちっとも落ち着かねぇ！"
"1011102-19-ネル" = "裸で出歩いてる気分だ！"
"1011102-20-ネル" = "やっぱ、先生から見ても変だろ？"
"1011102-21" = "[s] \"制服姿も可愛いよ。\""
"1011102-22-ネル" = "何っ！？"
"1011102-23-ネル" = "か、からかうなよっ！#nあたしは真剣に悩んでるんだぞ！"
"1011102-24" = "[s] \"よく似合ってるよ。\""
"1011102-25-ネル" = "そ、そうか……？"
"1011102-26-ネル" = "と、とにかく！"
"1011102-27-ネル" = "連絡したのは、こういう理由だ。"
"1011102-28-ネル" = "まぁ、先生から見ても変じゃねぇなら安心した。"
"1011102-29-ネル" = "……もちろん、可愛いだとか似合ってるだとか思わねぇけどよ。"
"1011102-30" = "[s] \"大丈夫だよ。\""
"1011102-31" = "[ns] \"どんな格好でも、ネルはネルだからね。\""
"1011102-32-ネル" = "あぁ？#nんなの当ったりめぇだろ！"
"1011102-33-ネル" = "スカジャンを着てなくても、そこら辺のスケバンくらい余裕で倒せるからな！"
"1011102-34-ネル" = "いつものネルに戻って安心した、って？"
"1011102-35-ネル" = "……ははっ！"
"1011102-36-ネル" = "やっぱ先生に聞いてもらって正解だったぜ。"
"1011102-37-ネル" = "せっかくだし、もう少し話していかねぇか？"
"1011102-38-ネル" = "隣、空いてるぜ。"
"1011102-39-ネル" = "つーか、今日はやけに静かだな？"
"1011102-40-ネル" = "行事のせいか、それとも気のせいか……。"
"1011102-41" = "[s] \"いつもと同じような……。\""
"1011102-42-ネル" = "いやいや、絶対違うって。"
"1011102-43-ネル" = "……あたしの知らないところで、何かが起きてるかもしれねぇ。"
"1011102-44-ネル" = "ほら、あいつらをよく見てくれ。"
"1011102-45" = "[ns] \"……？\""
"1011102-46-ネル" = "あたしがここに座ってるのに、スルーしたぞ。"
"1011102-47-ネル" = "いつもなら「C&Cのリーダー！？」とか「ひっ……！」とか言いながら、#nどっかに消えてくのによ。"
"1011102-48-ネル" = "ったく、大げさだぜ。"
"1011102-49" = "[ns] （たしかC&Cのメイド服には、偽装の役割が……）"
"1011102-50-ネル" = "けどよ、今日はそんな風な反応が一切なかった。"
"1011102-51-ネル" = "ありがたくはあるんだが、逆に気になるっつーか……。"
"1011102-52-ネル" = "いったい何が起きてんだ？"
"1011102-53-ネル" = "くそっ！#nこれも全部スカジャンを着てないせいか？"
"1011102-54" = "[s3] \"お、落ち着いて。\"\n[s4] \"まずは深呼吸しようか。\""
"1011102-55-ネル" = "ふぅ……。"
"1011102-56-ネル" = "先生は何か心当たりねぇのか？#nどう考えてもおかしいだろ。"
"1011102-57" = "[s] \"さ、さあ……。\""
"1011102-58-チンピラA" = "おい、お前。"
"1011102-59-チンピラA" = "キキッ、ここの公園はウチらの縄張りだぞ。#nベンチに座りたかったら許可を取るんだな！"
"1011102-60-チンピラA" = "とりあえず、勝手に利用したんだから金を払ってもらおうか。#nクレープ代くらいで勘弁してやるぞ！"
"1011102-61-チンピラA" = "……？"
"1011102-62-チンピラA" = "それ、あたしに言ってんのか？"
"1011102-63-チンピラA" = "ほかに誰がい――"
"1011102-64-チンピラA" = "って、お前は……。"
"1011102-65-チンピラA" = "……[ruby=みかも]美甘[/ruby]ネル！？"
"1011102-66-チンピラA" = "見覚えのある顔だな。#n前にボコられてから反省してねーのか？"
"1011102-67-チンピラA" = "ど、どうして制服を！？"
"1011102-68-チンピラA" = "騙したのか！？"
"1011102-69-チンピラA" = "スカジャン着とけよ！"
"1011102-70-チンピラA" = "今日は事情があってな。"
"1011102-71-チンピラA" = "それは置いといて……あたし、言ったよな？"
"1011102-72-チンピラA" = "ひ、ひぃっ！？"
"1011102-73-チンピラA" = "……今度こそ潰すってよ？"
"1011102-74-ネル" = "くっ……。"
"1011102-75-ネル" = "お、覚えてろよー！"
"1011102-76" = "[ns] \"逃げちゃった……。\""
"1011102-77-ネル" = "はっ、さっきのでけぇ態度に免じて許してやる！"
"1011102-78-ネル" = "スケバンにたかられるなんて、新鮮じゃねぇか。"
"1011102-79" = "[s] \"相手はネルだって気づいてなかったんだね。\""
"1011102-80-ネル" = "言われてみればそうだな？"
"1011102-81-ネル" = "つーか、あたしだって気づかなかったのは……。"
"1011102-82" = "[s] \"制服だったから？\""
"1011102-83-ネル" = "まあ、スカジャンは派手だし、遠くからでもすぐ分かるしな。"
"1011102-84-ネル" = "待てよ。#nじゃあ、今日はいつもと違う風に感じたのは……。"
"1011102-85-ネル" = "……みんな、あたしに気づいてなかったせいか！？"
"1011102-86" = "[s] \"そうだと思うよ……。\""
"1011102-87-ネル" = "誰も気づかない、なんて……。"
"1011102-88-ネル" = "……悪くねぇな？"
"1011102-89-ネル" = "不思議な感じっつーか、なんつーか。"
"1011102-90-ネル" = "さっきみたいな珍しい体験もできたわけだしよ。"
"1011102-91" = "[s] \"なら、良いのかな……？\""
"1011102-92-ネル" = "ま、スカジャンを着てたほうが落ち着くけどよ。"
"1011102-93-ネル" = "なんか楽しくなってきたぜ。"
"1011102-94-ネル" = "そうだ、先生！"
"1011102-95-ネル" = "せっかくだし、この格好で教室に入ってみるのはどうだ？"
"1011102-96-ネル" = "試してみるしかねぇ！"
"1011102-97" = "（その後、いつもよりテンションの高いネルと一緒に、ミレニアムのあちこちを歩き回った）"
