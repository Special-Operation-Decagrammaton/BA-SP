[translation]
"1011105-1" = "ネルと遊園地"
"1011105-2-ネル" = "よお、先生。来たぞ。"
"1011105-3-ネル" = "シャーレは相変わらずだな。"
"1011105-4" = "[s] \"でも今日のネルは制服だからね。\""
"1011105-5-ネル" = "ははっ、そうだな！"
"1011105-6-ネル" = "制服でシャーレに来たのは初めてかもしれねぇ！"
"1011105-7-ネル" = "いや、そもそもほとんどの場所がそうだな……。"
"1011105-8-ネル" = "どこに行っても、あたしだって気づかれないなんて面白いぜ！"
"1011105-9" = "[s] \"けど、それも今日で最後なんだよね？\""
"1011105-10-ネル" = "ああ、ずっとC&Cを空けるわけにもいかねぇからな。"
"1011105-11-ネル" = "そんで、最後に何か記憶に残ることをしたいんだが……。"
"1011105-12-ネル" = "何か良いアイデアはねぇか？"
"1011105-13" = "[s] \"うーん……。\""
"1011105-14" = "[ns] \"……これとかどうかな？\""
"1011105-15-ネル" = "何のチラシだ？"
"1011105-16-ネル" = "「ミレニアムテーマパークで過ごす最高の思い出！」……？"
"1011105-17-ネル" = "遊園地か、前にも行ったことあるな。"
"1011105-18-ネル" = "でも、わざわざ制服で遊園地なんて……。"
"1011105-19-ネル" = "……楽しそうじゃねぇか！"
"1011105-20" = "[s] \"じゃあ、さっそく行こう。\""
"1011105-21-ネル" = "おう！思い立ったが吉日だな！"
"1011105-22-ネル" = "先生のそういうとこ、あたしは好きだぜ！"
"1011105-23-ネル" = "人も少ないし、ちょうど良いタイミングじゃねぇか！"
"1011105-24-ネル" = "メリーゴーランドもジェットコースターも、リニューアルされたんだな！"
"1011105-25" = "[s] \"ネルは前にも来たんだよね？\""
"1011105-26-ネル" = "あぁ、任務でな。"
"1011105-27-ネル" = "ちょっと派手にやらかしちまったけど、無事にターゲットは捕まえたぜ。"
"1011105-28" = "[ns] （リニューアルの理由って、もしかすると……）"
"1011105-29-ネル" = "それより、先生は何から乗りたい？"
"1011105-30-ネル" = "やっぱ、ジェットコースターだよな！？"
"1011105-31-ネル" = "よっし、んじゃ行くぞ！"
"1011105-32" = "（ネルと一緒にジェットコースターを三回も乗った）"
"1011105-33-ネル" = "くぅー！#n最高だな、先生！"
"1011105-34" = "[ns] \"ちょっと頭がクラクラするよ……。\""
"1011105-35-ネル" = "ははっ、さすがに四回目は無理か！"
"1011105-36-ネル" = "んじゃ、あっちはどうだ？"
"1011105-37" = "[s] \"メリーゴーランド……？\""
"1011105-38-ネル" = "一度くらい馬に乗ってみたくてな！#nまぁ、本物じゃねぇけど。"
"1011105-39-ネル" = "体調が悪かったら休んでても良いぞ！"
"1011105-40" = "[s] \"じゃあ、私はそこで待ってるね。\""
"1011105-41-ネル" = "おう、行ってくる！"
"1011105-42-ネル" = "楽しかったぜ、先生！"
"1011105-43-ネル" = "あたしのでっかい馬、すごかったろ？"
"1011105-44-ネル" = "ん、見てなかったのか？"
"1011105-45-ネル" = "もし体調が悪いなら……。"
"1011105-46" = "[s] \"ううん、プレゼントを買ってきたんだ。\""
"1011105-47-ネル" = "プレゼント？"
"1011105-48-ネル" = "……カチューシャとお菓子？"
"1011105-49-ネル" = "いやいや、さすがにこれは……！"
"1011105-50-ネル" = "うーん……。"
"1011105-51-ネル" = "まあ、普段だったらつけねぇけど……。"
"1011105-52-ネル" = "今はC&Cのリーダーでも、「ダブルオー」でもないからな……。"
"1011105-53-ネル" = "ははっ、ありがたくもらうとするか！"
"1011105-54" = "[wa:950]― [log=네루 교복]お！[wa:600]見ろよ先生！[wa:1180]色んなもんがあるぞ！[/log]"
"1011105-55" = "― [log=네루 교복]ん？[wa:900]どうかしたのか？[/log]"
"1011105-56" = "[ns1] \"すごく楽しそうだね。\"\n[ns2] \"今日のネルは、いつもと違うね。\""
"1011105-57" = "[wa:1330]― [log=네루 교복]あ～、[wa:920]まぁ……[wa:940]そりゃあな。[/log]"
"1011105-58" = "― [log=네루 교복]今は[wa:350]C&Cでもないし、[wa:1610]先生とは[wa:630]先輩後輩の関係でもないだろ。[/log]"
"1011105-59" = "[wa:950]― [log=네루 교복]ここに知り合いなんていねぇしさ。[/log]"
"1011105-60" = "― [log=네루 교복]今くらい、[wa:800]許してくれよ。[/log]"
"1011105-61" = "[wa:950]― [log=네루 교복]というか、[wa:1350]やっぱ……[/log]"
"1011105-62" = "― [log=네루 교복]普段みたいな方がいいか？[/log]"
"1011105-63" = "[ns3] \"そういうわけじゃないよ。\"\n[ns4] \"思いっきり楽しもう。\""
"1011105-64" = "[wa:980]― [log=네루 교복]ははっ！[wa:1060]そう言うと思った！[/log]"
"1011105-65" = "― [log=네루 교복]まあ、[wa:780]そんなに時間に[wa:600]余裕があるわけじゃねえし……[/log]"
"1011105-66" = "― [log=네루 교복]そろそろ行こうぜ！[wa:1390]次はあっちだ！[/log]"
"1011105-67" = "（その後もネルと一緒に遊園地を楽しんだ）"
"1011105-68-ネル" = "もう閉園か、早かったな。"
"1011105-69-ネル" = "すっごく楽しかったぞ、先生。"
"1011105-70" = "[s] \"私も楽しかったよ。\""
"1011105-71" = "[ns] \"休日最後の良い思い出になった？\""
"1011105-72-ネル" = "ああ！"
"1011105-73-ネル" = "もちろん大満足だ！"
"1011105-74-ネル" = "いつものあたしに戻る前に聞いておきたいんだが……。"
"1011105-75-ネル" = "[USERNAME]先生は、どうだった？"
"1011105-76" = "[s] \"ん？\""
"1011105-77-ネル" = "ここ何日か、ずっと制服だったろ……。"
"1011105-78-ネル" = "この姿で会ったのは、先生だけだから……。"
"1011105-79-ネル" = "あたしは悪くなかったけど……せ、先生は、そ、その……。"
"1011105-80-ネル" = "ぐああああっ！もうっっっ！！"
"1011105-81" = "[ns] \"ネル！？\""
"1011105-82-ネル" = "良いか？#n一回しか言わないからな！！"
"1011105-83-ネル" = "制服で過ごすのが意外と楽しかったんだよ！"
"1011105-84-ネル" = "だから、また着た時は！"
"1011105-85-ネル" = "ちゃんと付き合ってくれよな！"
"1011105-86-ネル" = "分かったか！？"
"1011105-87" = "[s] \"う、うん。\""
"1011105-88-ネル" = "は、話は終わりだ。"
"1011105-89-ネル" = "明日から、またいつもの毎日に戻っちまうな。"
"1011105-90-ネル" = "……ほら、帰るぞ。"
