[translation]
"1011103-1" = "穏やかな休日"
"1011103-2-ネル" = "思ったより早かったな、先生。"
"1011103-3-ネル" = "そういうネルこそ早かった、って？"
"1011103-4-ネル" = "ははっ！"
"1011103-5-ネル" = "制服が楽しみでよ。"
"1011103-6-ネル" = "しばらくスカジャンなし生活も悪くねぇな！"
"1011103-7" = "[s] \"いつもと違う一日にしたいって言ってたけど……。\""
"1011103-8" = "[ns] \"急にどうしたの？\""
"1011103-9-ネル" = "聞かれると思ってたぜ。"
"1011103-10-ネル" = "今のあたしは制服を着てるだろ？"
"1011103-11-ネル" = "だから、C&Cのリーダーでもなければ、あいつらを気にする必要もない。"
"1011103-12-ネル" = "完全に一般生徒Aってわけだ。"
"1011103-13-ネル" = "こういう日じゃねぇと、生徒としての生活を思いっきり楽しめねぇからな。"
"1011103-14-ネル" = "普段は立場上、できないことも多いからよ。"
"1011103-15-ネル" = "……どうした、その顔。"
"1011103-16" = "[s1] \"ネルも色々考えてたんだね。\"\n[s2] \"可愛いなって思って。\""
"1011103-17-ネル" = "あぁ？当たり前だろ。"
"1011103-18-ネル" = "な、何も出ねぇぞ！"
"1011103-19-ネル" = "とにかく！"
"1011103-20-ネル" = "今しかできないことを精一杯やろうって話だ！"
"1011103-21-ネル" = "そんで、せっかくなら先生と一緒のほうが楽しいと思ってな！"
"1011103-22-ネル" = "よし、さっさと行くぞ！"
"1011103-23-ネル" = "いらっしゃいませ！#nクイーンバーガーミレニアム店へようこそ！"
"1011103-24" = "[ns] \"普通のファーストフード店だよね？\""
"1011103-25-ネル" = "まぁな。"
"1011103-26-ネル" = "よく部員と来るんだ。#n意外と美味いんだぞ。"
"1011103-27" = "[s] \"こんないつも通りで良いの？\""
"1011103-28-ネル" = "いつもとは違うから、安心してくれ。"
"1011103-29-ネル" = "とりあえず注文しようぜ。#n先生が先に頼んで良いぞ。"
"1011103-30" = "[s] \"すみません、チーズバーガーお願いします。\""
"1011103-31-ネル" = "んじゃ、あたしは……。"
"1011103-32-ネル" = "キッズセットBで！"
"1011103-33" = "[s] \"キッズセット……？\""
"1011103-34-ネル" = "言っただろ？#n今日はいつもと違うってよ！"
"1011103-35-ネル" = "ははっ、楽しくなってきたぜ！"
"1011103-36-ネル" = "ほら、こっちが先生のチーズバーガーな。"
"1011103-37-ネル" = "これが、あたしのキッズセットか。"
"1011103-38" = "[s] \"キッズセット、頼んでみたかったの？\""
"1011103-39-ネル" = "部員の前でこんなの注文したら、ガキみたいとか可愛いとか言われるだろ。"
"1011103-40-ネル" = "それに、C&Cのリーダーがキッズセットを食ってたなんて話が広まったら、#nどうなると思う？"
"1011103-41-ネル" = "外野が何を言おうと構わねぇけど、カッコがつかないだろ。"
"1011103-42" = "[s] \"……それで、この機会に？\""
"1011103-43-ネル" = "ま、そういうわけだ。"
"1011103-44-ネル" = "それに、このセットはな……。"
"1011103-45-ネル" = "……こんなのまでついてるんだぞ！"
"1011103-46" = "[ns] \"……ロボットのおもちゃ？\""
"1011103-47-ネル" = "ただのおもちゃじゃないんだな、それが。"
"1011103-48-ネル" = "ここを回して、こうすると……。"
"1011103-49-ネル" = "変形するんだ！"
"1011103-50" = "[ns] \"……！\""
"1011103-51-ネル" = "どうだ、カッコ良いだろ？"
"1011103-52-ネル" = "ははっ！#nでもこれは、あたしのもんだぜ！"
"1011103-53-ネル" = "先生も欲しけりゃ、自分で頼むんだな！"
"1011103-54-ネル" = "さて、次はどうすっかな！"
"1011103-55-ネル" = "あっちは公園か、ちょっと散歩しようぜ。"
"1011103-56-ネル" = "今日は天気も良いしな。"
"1011103-57-ネル" = "あぁ？#n別に散歩なんていつでもできるって？"
"1011103-58-ネル" = "ははっ！#nまぁ、着いたら説明してやる。"
"1011103-59-ネル" = "よっし、今日も空いてるな。"
"1011103-60-ネル" = "この散策コースは、反対側に出ると小さな池があるんだ。"
"1011103-61-ネル" = "ま、行ったことはねぇけど。"
"1011103-62" = "[s] \"なのにどうして知ってるの？\""
"1011103-63-ネル" = "C&Cの部室と近いからな。"
"1011103-64-ネル" = "出動する時は、よく通り抜けるんだ。"
"1011103-65-ネル" = "でもそのせいで、ゆっくりした記憶はなくてよ。"
"1011103-66-ネル" = "いつか散歩でもしてみてぇと思ってたけど、なかなかチャンスがなかったんだ。"
"1011103-67-ネル" = "今日なら、ちょうど良いと思ってな。"
"1011103-68-ネル" = "どうだ先生、付き合ってくれるか？"
"1011103-69" = "[s] \"もちろん。\""
"1011103-70-ネル" = "よっし！#nじゃあ、さっそく行くぜ！"
"1011103-71-ネル" = "おお、広いな！"
"1011103-72-ネル" = "先生、池に魚がいるぞ！"
"1011103-73-ネル" = "でけぇな！#n何を食ったらあんなにデカくなるんだ？"
"1011103-74" = "[s] \"わっ、柵に乗ったら危ないよ。\""
"1011103-75-ネル" = "大丈夫、大丈夫！"
"1011103-76-ネル" = "ちょっとくらい別に良いだろ？"
"1011103-77-ネル" = "この程度で揺れるわけ――"
"1011103-78-ネル" = "うおっ！？"
"1011103-79" = "[ns] \"ネル！？\""
"1011103-80-ネル" = "び、びっくりした……。"
"1011103-81" = "[s] \"無事で良かったよ。\""
"1011103-82-ネル" = "まさか、こんなボロくなってるとは思わなかったな。"
"1011103-83-ネル" = "……。"
"1011103-84-ネル" = "おい、いつまで抱えてるんだ？"
"1011103-85-ネル" = "そろそろ離してほしいんだが……。"
"1011103-86" = "[s] \"ご、ごめん！\""
"1011103-87-ネル" = "……べ、別に嫌ってわけじゃねぇからよ。"
"1011103-88-ネル" = "ったく、心配性だな先生は！"
"1011103-89-ネル" = "あたしが池に落ちるわけねぇだろ！"
"1011103-90-ネル" = "けどまぁ、助けてくれてありがとよ。"
"1011103-91-ネル" = "ああもう！#nほら、あっちのベンチ行くぞ！"
"1011103-92-ネル" = "こうやって、ただ風景を眺めるのも悪くねぇな。"
"1011103-93-ネル" = "穏やかな休日ってやつだ。"
"1011103-94-ネル" = "先生も楽しめてるか？"
"1011103-95" = "[s3] \"ネルと一緒なら何でも楽しいよ。\"\n[s4] \"たまにはこういう時間も必要だよね。\""
"1011103-96-ネル" = "そ、そうなのか？"
"1011103-97-ネル" = "……ははっ！先生はお世辞が上手だな！"
"1011103-98-ネル" = "あぁ、本心で言ってるって？"
"1011103-99-ネル" = "まぁ、あたしも先生と一緒なら、何だって楽しいけどよ……。"
"1011103-100-ネル" = "ははっ、そうだろ？"
"1011103-101-ネル" = "やっぱ、先生も喜んでくれると思ったぜ。"
"1011103-102-ネル" = "ふわぁ。"
"1011103-103-ネル" = "こんだけ気持ち良いと、眠くなってくるな……。"
"1011103-104-ネル" = "……。"
"1011103-105" = "[ns] ネルに肩を貸す。"
"1011103-106-ネル" = "……んっ。"
"1011103-107" = "（そうして数時間が経過し……）"
"1011103-108" = "[ns] \"……ネル。\""
"1011103-109-ネル" = "……。"
"1011103-110" = "[ns] \"そろそろ起きないと、夜眠れなくなるよ。\""
"1011103-111-ネル" = "……ん？"
"1011103-112-ネル" = "うおっ！？"
"1011103-113-ネル" = "寝ちゃったのか！？"
"1011103-114-ネル" = "いつの間に！？"
"1011103-115" = "[s] \"疲れは取れた？\""
"1011103-116-ネル" = "……まぁな。"
"1011103-117-ネル" = "待てよ、先生。#nもしかして……ずっと肩を貸してくれてたのか？"
"1011103-118-ネル" = "起こしてくれて良かったのによ。"
"1011103-119-ネル" = "思った以上に、寝ちまったな……。"
"1011103-120" = "[s] \"ネルがぐっすり休めて良かったよ。\""
"1011103-121-ネル" = "うーん……なんか悪ぃな。"
"1011103-122-ネル" = "よっし、今度はあたしの肩を好きなだけ使っていいぞ！"
"1011103-123-ネル" = "……って、もう遅いか。"
"1011103-124" = "[s] \"気にしないで。\""
"1011103-125" = "[ns] \"それより、次は何する？\""
"1011103-126-ネル" = "今日はもう満足だ！"
"1011103-127-ネル" = "おかげでゆっくりできたしな！"
"1011103-128-ネル" = "これも先生のおかげだ。"
"1011103-129-ネル" = "今日も付き合ってくれてありがとよ。"
