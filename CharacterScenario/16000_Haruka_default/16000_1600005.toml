[translation]
"1600005-1" = "間違っていないもの"
"1600005-2-ハルカ" = "……！せ、先生……来てくださったんですね……今回も……！"
"1600005-3-ハルカ" = "来てくださって、本当にありがとうございます……。"
"1600005-4-ハルカ" = "も、もう二度と私には会ってくださらないのではと思って、私……。"
"1600005-5-ハルカ" = "……大丈夫だから気にしなくていい、ですか……？い、いえ！そういうわけには……！"
"1600005-6-ハルカ" = "い、いえその！決して先生のお言葉に従いたくないですとかそういったことではなく……！"
"1600005-7-ハルカ" = "わ、分かりました……ありがとうございます……。"
"1600005-8-ハルカ" = "そ、その……今回こそ……ちゃんとした上納品を……。"
"1600005-9-ハルカ" = "こ、こちらです、自信はないのですが……。"
"1600005-10" = "[s1] \"限定版のプラモデル！？\"\n[s2] \"数量限定の美少女フィギュア！？\""
"1600005-11-ハルカ" = "ま、まだあります……これと、これと……これも、もしかしたらお気に召していただけるかなと……。"
"1600005-12-ハルカ" = "ま、まだあります……これと、これと……これも、もしかしたらお気に召していただけるかなと……。"
"1600005-13-ハルカ" = "この前みたいに、私が作ったものじゃないので……大丈夫だと思います、多分……この前は本当にすみません……。"
"1600005-14" = "（ハルカが背負っている袋から、溢れるように貴重なグッズが出てきた）"
"1600005-15" = "（どれもすごく高価な、もしくは知る人ぞ知るかなり貴重なものだった）"
"1600005-16" = "（なんでハルカが私の好みを把握しているのかはさておき、どうやって手に入れたんだろう……）"
"1600005-17-ハルカ" = "い、いかがでしょう、先生……？"
"1600005-18-ハルカ" = "や、やっぱりイマイチでしたか……！？"
"1600005-19" = "[s3] \"すごい、どれも良い物ばっかり！\"\n[s4] \"こんなにたくさん、どこで手に入れたの？\""
"1600005-20-ハルカ" = "……。"
"1600005-21-ハルカ" = "……。"
"1600005-22-ハルカ" = "……ふふ……ふふふ……。"
"1600005-23-ハルカ" = "喜んでいただけて、私、嬉しいです……先生……。"
"1600005-24-ハルカ" = "これからもまたこうやって……先生のために……。"
"1600005-25" = "ジジッ！"
"1600005-26-ハルカ" = "……？"
"1600005-27-店員" = "……ん？急にチャンネルが変わった？"
"1600005-28-店員" = "ニュース速報……？"
"1600005-29-ハルカ" = "あ……うぁ……。"
"1600005-30" = "[s] \"……ハルカ？\""
"1600005-31-ハルカ" = "……。"
"1600005-32" = "（どの放送も次々とニュース速報に変わっていく）"
"1600005-33-アナウンサー" = "速報です。本日の早朝、商店街で窃盗事件が発生しました。"
"1600005-34-アナウンサー" = "現金を置いていった上で高価なグッズを奪っていくという、一見変わった犯行であり……"
"1600005-35-アナウンサー" = "犯人は単純な金銭目的ではなく、他に何か別の目的があるのではという線で捜査が進められています。"
"1600005-36-アナウンサー" = "関係者によりますと、時間帯からしてまだ犯人はトリニティ自治区にいると思われており……"
"1600005-37-ハルカ" = "……"
"1600005-38" = "[s] \"……ハルカ？\""
"1600005-39-ハルカ" = "……っ！！！"
"1600005-40-ハルカ" = "そ……その、これは……！"
"1600005-41-ハルカ" = "こ、こんなに早くバレるとは思わなくて……！きっと夜になるまで捜査は始まらないと思っていたのですが……！"
"1600005-42-ハルカ" = "え、え……？そういう話じゃない……？そ、そうですか、すみません、そもそもちゃんとバレないようなやり方をするべきでした……。"
"1600005-43-ハルカ" = "え？それでもない？う、うう……すみません……。"
"1600005-44-ハルカ" = "すみません……すみませんすみませんすみませんすみませんすみません……。"
"1600005-45" = "[s] \"返しに行こう。\""
"1600005-46-ハルカ" = "え、はい！？ど、どうして……！まだ私だとバレたわけでも追跡されているわけでもないですし……！"
"1600005-47-ハルカ" = "い、いえ！これは決して口答えというわけではなく……！"
"1600005-48-ハルカ" = "……わ、分かりました。先生がそう仰るなら……。"
"1600005-49" = "（その後、商店街の全てのお店を回りながら、ハルカが奪ってきたグッズを返した）"
"1600005-50" = "（ハルカと一緒に頭を下げて謝罪し、まだどれも封を開けていなかったため全部返品という形で済んだ）"
"1600005-51-ハルカ" = "……。"
"1600005-52-ハルカ" = "すみません……本当にすみません……。"
"1600005-53-ハルカ" = "私のせいでこんな、先生まで謝ることになってしまって……。"
"1600005-54-ハルカ" = "先生に喜んでほしかったのに、私、迷惑ばかりかけて……本当に……私はいつも……。"
"1600005-55-ハルカ" = "……もう。"
"1600005-56-ハルカ" = "もうこれ以上……先生には迷惑をかけないように……。"
"1600005-57" = "[s5] \"迷惑なんかじゃないよ。\"\n[s6] \"何も無くても、連絡してくれるだけで嬉しい。\""
"1600005-58-ハルカ" = "え……？"
"1600005-59-ハルカ" = "え……？"
"1600005-60-ハルカ" = "で、でも……こんなに迷惑をおかけしてしまったのに……。"
"1600005-61-ハルカ" = "何も無くてもって、そんな……私が……先生に……？"
"1600005-62-ハルカ" = "い、いえ！決して嫌だとかそういうことを言いたいわけではないのですが……！でも……！"
"1600005-63-ハルカ" = "あ、う……うぅ……。"
"1600005-64-ハルカ" = "わ、分かりました……先生がそう仰るのであれば、ど、努力……します……。"
"1600005-65-ハルカ" = "……あ、あの……先生……。"
"1600005-66-ハルカ" = "本当に……怒って、ませんか……？私のことが嫌いになったとか……。"
"1600005-67-ハルカ" = "……全然？ど、どうして……こんな私のことを……。"
"1600005-68" = "[s7] \"当たり前だよ。\"\n[s8] \"ハルカはまだ、たくさん失敗して良いんだよ。\""
"1600005-69-ハルカ" = "……え？そ、それは、どういう……。"
"1600005-70-ハルカ" = "……え？そ、それは、どういう……。"
"1600005-71-ハルカ" = "……わ、分かりません……私には、そんな……どうしてそれが、理由になるのか……。"
"1600005-72-ハルカ" = "ゆっくり理解していけば大丈夫……？"
"1600005-73-ハルカ" = "……。"
"1600005-74-ハルカ" = "す、すみません、まだ私はこんななので、まだちゃんと理解できていないのですが……"
"1600005-75-ハルカ" = "そうします、ゆっくり、これから……。"
"1600005-76-ハルカ" = "……えへ……えへへ……。"
"1600005-77-ハルカ" = "……ありがとうございます、先生……。"
"1600005-78" = "（その後、ハルカはしばらくモジモジした後、早歩きで消えていった）"
"1600005-79" = "（帰り道、ハルカのおかげで（？）まだ売れていなかった限定版のグッズを買うことができた）"
