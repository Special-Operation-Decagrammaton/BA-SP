[translation]
"2001903-1" = "Case2. ゆっくり休んでください"
"2001903-2" = "（書類の山との戦いを終えた）"
"2001903-3" = "（今日は戦略的撤退だ！続きは明日の私が……）"
"2001903-4" = "シャーレ・休憩室"
"2001903-5-アカネ" = "おかえりなさいませ、ご主人様！ぴょんぴょん！"
"2001903-6" = "（今日も幻覚が……）"
"2001903-7" = "（……いや、現実を受け入れよう）"
"2001903-8" = "[s1] \"こんにちは、アカネ。ところで、なぜここに……？\"\n[s2] \"どうやって入ってきたの……？\""
"2001903-9-アカネ" = "ロックを解除させていただきました。"
"2001903-10-アカネ" = "ロックを解除させていただきました。"
"2001903-11-アカネ" = "どうやって、"
"2001903-12-アカネ" = "ですか？"
"2001903-13-アカネ" = "少しお力を借りたんです。"
"2001903-14-アカネ" = "なにせ非常事態ですので……ふふっ。"
"2001903-15-アカネ" = "爆弾でロックを吹き飛ばしても良かったのですが……"
"2001903-16-アカネ" = "それではご主人様がお困りになるだろうと思いまして。"
"2001903-17-アカネ" = "以前、爆弾はご主人様が控えるように申し付けられましたし……"
"2001903-18-アカネ" = "え？ここまでする必要はあったのか、と？"
"2001903-19-アカネ" = "それはもちろんです！"
"2001903-20-アカネ" = "私にとって、ご主人様の健康状態は常に最優先事項ですので。"
"2001903-21-アカネ" = "こんなにもお疲れのご様子で……。"
"2001903-22-アカネ" = "私、胸が痛くて堪りません。本当に心苦しいです……。"
"2001903-23" = "[s] 気持ちだけでもうれしいよ。"
"2001903-24-アカネ" = "……私にできることはないでしょうか？"
"2001903-25-アカネ" = "装いこそ変わりましたが、私は永遠にご主人様のメイドですから。"
"2001903-26" = "[s]それじゃあ、一緒に掃除しようか？"
"2001903-27-アカネ" = "掃除……本当にそれだけで……？"
"2001903-28-アカネ" = "ご主人様には欲というものがないのですか？"
"2001903-29-アカネ" = "ふふっ……お優しいのですね。"
"2001903-30-アカネ" = "分かりました。誠心誠意、ご主人様にご奉仕いたします。"
"2001903-31" = "（その後、二人で掃除に没頭した）"
"2001903-32" = "（手伝う隙もなく、ほとんどアカネが終わらせてしまった……）"
"2001903-33-アカネ" = "ふふっ……初めてお会いした日のことを思い出しますね。"
"2001903-34-アカネ" = "ご主人様は、あの時も掃除をお願いしましたから。"
"2001903-35-アカネ" = "どうでしょう。ホコリ一つないお部屋になりましたね。"
"2001903-36" = "[s3] \"あの時のアカネも可愛かったね。\"\n[s4] \"今のアカネも可愛いよ。\""
"2001903-37-アカネ" = "ご、ご主人様？急にそんなことをおっしゃるだなんて……私……"
"2001903-38-アカネ" = "お、お待ちください！特別な茶葉が入ったんです。すぐにお持ちします！"
"2001903-39-アカネ" = "本日の一杯です。どうぞお召し上がりください。"
"2001903-40-アカネ" = "ふふっ、私もお気に入りの香りなんです。喜んでいただけて幸いです。"
"2001903-41-アカネ" = "実はずっと探していて……ようやく手に入ったのです。"
"2001903-42-アカネ" = "その一杯を、ご主人様と飲むことができて……"
"2001903-43-アカネ" = "アカネはとても幸せです。"
"2001903-44" = "[s] \"そういえば、その格好もアカネのお気に入りなの？\""
"2001903-45-アカネ" = "バニーガールですか？"
"2001903-46-アカネ" = "そうですね……新鮮な気分になれます。服装が違うだけで、気分も変わりますから。"
"2001903-47-アカネ" = "動きやすい、というのもありますし……"
"2001903-48-アカネ" = "ですが、改めてメイドとして、メイド服も大切だと感じています。"
"2001903-49-アカネ" = "ご主人様はどう思われますか？"
"2001903-50" = "[s] \"うーん、私は……。\""
"2001903-51-アカネ" = "ぜひ！ご主人様の意見を伺いたいです。"
"2001903-52-アカネ" = "実は……"
"2001903-53-アカネ" = "私の部屋を訪ねてくださった時から、ずっと思っていました。"
"2001903-54-アカネ" = "どうでしょう、ご主人様？"
"2001903-55-アカネ" = "メイドとしての私、バニーガールとしての私、どちらがお好きですか？"
"2001903-56-アカネ" = "――どちらにも良さがある？"
"2001903-57-アカネ" = "そ、それは嬉しいですが……"
"2001903-58-アカネ" = "ですが、ご主人様……アカネは白黒ハッキリつけたいのです。"
"2001903-59-アカネ" = "どちらの私がご主人様をご奉仕するのに、より相応しいのでしょうか？"
"2001903-60-アカネ" = "ご主人様の口から直接聞きたいのです！ぴょんぴょん！"
"2001903-61" = "[s] \"ぴょんぴょん……？\""
"2001903-62-アカネ" = "はい。今の私はウサギのアカネですから。"
"2001903-63-アカネ" = "さあ、メイドですか？#nそれともウサギですか？"
"2001903-64" = "（アカネの姿が鼻の先まできた）"
"2001903-65" = "（あれ、急にまぶたが重く……）"
"2001903-66-アカネ" = "あら、ご主人様？"
"2001903-67-アカネ" = "ふふっ……本当にお疲れのようですね。"
"2001903-68-アカネ" = "私もこれにて失礼いたします。"
"2001903-69-アカネ" = "おやすみなさい、ご主人様。"
