[translation]
"2001902-1" = "Case1. ウサギですよ？"
"2001902-2" = "（慎重にドアをノックする）"
"2001902-3-アカネ" = "あ、ご主人様ですね！"
"2001902-4-アカネ" = "ぴょんぴょん！"
"2001902-5" = "（疲れているのかな……幻覚が見えるような……）"
"2001902-6" = "（目をこすって深呼吸をしてから、再びドアをノックした）"
"2001902-7-アカネ" = "どうされましたか、ご主人様？"
"2001902-8-アカネ" = "ぴょんぴょん！"
"2001902-9" = "（あれ、また幻覚だ……今日はしっかり寝ないと）"
"2001902-10" = "（そう思った瞬間）"
"2001902-11-アカネ" = "おかえりなさいませ、ご主人様。ずっとお待ちしておりました。"
"2001902-12" = "[ns] \"……えっと、アカネ？\""
"2001902-13-アカネ" = "ご主人様のメイド、アカネです。お忘れですか？"
"2001902-14-アカネ" = "ぴょんぴょん！"
"2001902-15" = "[s] \"ぴょんぴょん……？\""
"2001902-16-アカネ" = "はい、ウサギですからね。"
"2001902-17-アカネ" = "先生こそ、どうかされましたか？"
"2001902-18-アカネ" = "狐につままれたような……何か思わぬ出来事でもあったのでしょうか……。"
"2001902-19-アカネ" = "もしかして、何か良くないことでもございましたか？"
"2001902-20-アカネ" = "いえ、シャーレの仕事量が多すぎるからですね。"
"2001902-21-アカネ" = "ご主人様、ご安心ください。本日は私がより一層ご奉仕いたします。"
"2001902-22" = "[s1] \"その、えっと……アカネの格好が気になって。\"\n[s2] \"バニーガール……？\""
"2001902-23-アカネ" = "前にも申し上げましたが、メイドはご奉仕する者です。#nそしてメイド服とはご主人様に仕える者が着る衣服でもあり、戦いの装束でもあります。"
"2001902-24-アカネ" = "前にも申し上げましたが、メイドはご奉仕する者です。#nそしてメイド服とはご主人様に仕える者が着る衣服でもあり、戦いの装束でもあります。"
"2001902-25-アカネ" = "バニーガールもまた、ご奉仕のために作られた存在です。"
"2001902-26-アカネ" = "ご奉仕こそがメイドの使命。"
"2001902-27-アカネ" = "でしたらバニーガールもメイドと同じではありませんか？"
"2001902-28-アカネ" = "たしかに少し変わった装いかもしれませんが……"
"2001902-29-アカネ" = "本日はこの姿で先生にご奉仕いたします。"
"2001902-30" = "[s3] \"訳が分からない……。\"\n[s4] \"私が死にます……社会的に。\""
"2001902-31-アカネ" = "大丈夫ですよ、心配ご無用です。"
"2001902-32-アカネ" = "大丈夫ですよ、心配ご無用です。"
"2001902-33-アカネ" = "さあ、どんなご奉仕をお望みですか？"
"2001902-34-アカネ" = "掃除？洗濯？料理？護衛？"
"2001902-35-アカネ" = "それとも『お掃除』でしょうか？"
"2001902-36-アカネ" = "メイドたる者、いつ何時でも準備は万全です。"
"2001902-37" = "[s] \"ごめん、アカネ！急用を思い出して！\""
"2001902-38-アカネ" = "あら、ご主人様？"
"2001902-39-アカネ" = "どうなさったんでしょうか。急用だなんて……。"
"2001902-40-アカネ" = "シャーレのお仕事は本当に大変なのですね……。"
"2001902-41-アカネ" = "でしたらなおの事、私がご奉仕して差し上げなくては。"
"2001902-42-アカネ" = "お待ちください、ご主人様！"
