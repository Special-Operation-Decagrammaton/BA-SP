[translation]
"1014503-1" = "タガを外して"
"1014503-2-キキ" = "こんにちは、先生！！"
"1014503-3" = "[s1] \"キサキ！？\"\n[s2] \"キキ！？\""
"1014503-4-キキ" = "キサキ……？キキよく分かんないです！"
"1014503-5-キキ" = "はい！キキです！"
"1014503-6-キキ" = "今日はキキの気分なんです！"
"1014503-7" = "[s] \"そっか……よろしくね。\""
"1014503-8-キキ" = "キキ、先生に会えてすごく嬉しいです！"
"1014503-9-キキ" = "今日は何して遊びましょうか！"
"1014503-10-キキ" = "滅多にない機会！楽しまないと損ですよね！"
"1014503-11" = "[s] \"キキは何がしたい？\""
"1014503-12-キキ" = "じゃあ――"
"1014503-13-キキ" = "水遊びがしたいです！！"
"1014503-14-キキ" = "わあ～～！川だ～！！"
"1014503-15-キキ" = "えっ？水泳、ですか……？"
"1014503-16-キキ" = "えぇっと……キキ、泳ぐのは苦手です！#nだから――"
"1014503-17-キキ" = "傍に居てくれますよね？"
"1014503-18" = "[s] \"う、うん……！\""
"1014503-19-キキ" = "わーい！"
"1014503-20" = "（そうしてキキの楽しそうな姿を見守った）"
"1014503-21" = "（と、その時……！）"
"1014503-22" = "[ns] \"……キキ？\""
"1014503-23" = "[ns] （キキがいない！！）"
"1014503-24-キキ" = "えいっ！隙ありっ！！"
"1014503-25" = "[ns] \"ぶはっ！！？\""
"1014503-26-キキ" = "あはははっ！やりました！"
"1014503-27-キキ" = "キキ、泳ぐのは苦手でも潜るのは得意なんです！#nうりゃっ、うりゃっ！"
"1014503-28" = "[s] \"こいつぅ～～！\""
"1014503-29-キキ" = "きゃ～！先生に食べられちゃいます～！"
"1014503-30" = "（キキを捕まえて肩車をしてあげた）"
"1014503-31-キキ" = "わー！たかーい！"
"1014503-32-キキ" = "先生！「たかいたかい」してください！"
"1014503-33-キキ" = "え、知らないんですか？"
"1014503-34-キキ" = "キキを持ち上げて……空に向かって思いっきり投げたら、キャッチです！"
"1014503-35-キキ" = "危ないからダメ……？#nう……でも……。"
"1014503-36-キキ" = "はい……分かりました……。"
"1014503-37-キキ" = "よし……そーっと……。"
"1014503-38-キキ" = "先生！メダカを捕まえました！"
"1014503-39" = "（キキが手で作ったお皿の中を、メダカが泳ぎ回っていた）"
"1014503-40-キキ" = "あははっ！くすぐったい！"
"1014503-41-キキ" = "メダカを飼う人の気持ち、キキも分かる気がします！"
"1014503-42-キキ" = "ですが、連れて帰るわけにはいかないので……。"
"1014503-43-キキ" = "バイバイ、またね。"
"1014503-44-キキ" = "わあ、もう見えなくなっちゃいました！"
"1014503-45-キキ" = "あっ、くふっ、ふふっ……脚がくすぐったいと思ったら、他にもいっぱい居ました！"
"1014503-46-キキ" = "みんな気をつけるんだよ～？#nさっきの子みたいに、キキが捕まえちゃうかも！"
"1014503-47-キキ" = "それでもまた逃がしてあげるんでしょ？ですか？#nはいっ、もちろんです！"
"1014503-48-キキ" = "先生先生、ここで自転車を借りられるみたいです！"
"1014503-49-キキ" = "キキ……先生と一緒に乗りたいです。#n……ダメですか？"
"1014503-50" = "[s] \"いいね、健康にもよさそうだ。\""
"1014503-51-キキ" = "わーい！いろんなところ見に行きましょう！"
"1014503-52-キキ" = "あっ、先生！あっちで子どもが水遊びをしてます！"
"1014503-53-キキ" = "あの子、こっち見てない？"
"1014503-54-水遊び中の子B" = "混ざりたいのかな？そんなら、こっちから――！"
"1014503-55-キキ" = "きゃあっ！？"
"1014503-56-キキ" = "こ、これは……。"
"1014503-57-キキ" = "宣戦布告ですね！？"
"1014503-58-キキ" = "ビビった？ビビった？"
"1014503-59-水遊び中の子B" = "悔しかったらかかっておいでー！"
"1014503-60-キキ" = "先生……。"
"1014503-61" = "[s] \"キキ。\""
"1014503-62" = "[ns] \"頑張れ！！\""
"1014503-63-キキ" = "……！"
"1014503-64-キキ" = "はいっ！"
"1014503-65-水遊び中の子A" = "はっ、速い！？接近戦に持ち込もうってのか！"
"1014503-66-キキ" = "覚悟してくださいね～！"
"1014503-67-水遊び中の子B" = "気に入ったぁ！かかってきな！"
"1014503-68" = "（……キキは楽しそうに遊んでいた）"
"1014503-69" = "（そしていつの間にか、グループをまとめ上げていた）"
"1014503-70-キキ" = "どうしましょう……キキ、あれもこれも食べたいです。"
"1014503-71-キキ" = "でも、全部買うわけには……キキ、そんなに食べれません。#n食べ物を残したら罰が当たるって……。"
"1014503-72" = "[s] \"残ったら私が食べてあげるよ。\""
"1014503-73-キキ" = "本当ですか？それなら本当に全部買っちゃいますよ！？"
"1014503-74-キキ" = "先生、行きましょう！！"
"1014503-75" = "（商店を回って、キキはおやつを山盛り買った）"
"1014503-76" = "（後で胃薬が必要になったのは別の話である）"
"1014503-77-キキ" = "ふぅ～……大満足！"
"1014503-78-キキ" = "キキ、今日のことは絶対に忘れません！"
"1014503-79" = "[s] \"それはよかった。\""
"1014503-80-キキ" = "今日はキキと遊んでくれてありがとうございます！"
"1014503-81-キキ" = "それと……。"
"1014503-82-キキ" = "……。"
"1014503-83-キサキ" = "妾の知らぬ、其方の様子も見れたからの。"
"1014503-84-キサキ" = "なかなかに可愛らしかったぞ？"
"1014503-85" = "[ns] \"……！？！？\""
"1014503-86" = "[ns] \"キサキ！？\""
"1014503-87-キキ" = "キサキ？誰のことですか？キキよく分かりません！"
"1014503-88-キキ" = "だからキキ――"
"1014503-89-キキ" = "あれ……？"
"1014503-90" = "[ns] \"！？！？\""
"1014503-91" = "（急いでキサキを抱えて部屋に移動した）"
"1014503-92-キサキ" = "……すまないの、先生。"
"1014503-93-キサキ" = "つい羽目を外しすぎたようじゃ。"
"1014503-94" = "[s] \"大丈夫なんだよね……？\""
"1014503-95-キサキ" = "そう心配するな。自分のことはある程度分かっておる。"
"1014503-96-キサキ" = "ただ……今日はここらで仕舞いじゃな。"
"1014503-97" = "[s] \"本当……なんだよね？\""
"1014503-98-キサキ" = "妾の言葉はそれほどに信用ならないかえ？"
"1014503-99-キサキ" = "うむ？先生にできることか？"
"1014503-100-キサキ" = "そうじゃの……。"
"1014503-101-キキ" = "キキ、先生が傍にいてくれたら、よく眠れそうです……。"
"1014503-102" = "[s] \"分かった。\""
"1014503-103-キキ" = "ありがとうございます……先生。"
"1014503-104" = "（そうしてキサキ――）"
"1014503-105" = "（いや、キキが眠りにつくまで手を握って見守った）"
