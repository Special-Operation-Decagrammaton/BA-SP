[translation]
"1014506-1" = "青い蝶"
"1014506-2" = "[ns] \"呼ばれて来たけど……どこに行くの……？\""
"1014506-3-キサキ" = "うむ。"
"1014506-4-キサキ" = "せっかく水着を用意したのじゃ。"
"1014506-5-キサキ" = "この装いでこそ楽しめる場に行ってみたいのじゃが……。"
"1014506-6-キサキ" = "妾と一緒は嫌か？"
"1014506-7" = "[s] \"そんなわけない！\""
"1014506-8" = "[ns] \"どこ行こっか！！\""
"1014506-9-キサキ" = "ふむ……。"
"1014506-10-キサキ" = "とはいえ、こういったことには疎くてのう。"
"1014506-11-キサキ" = "其方なら、妾よりは詳しいじゃろうて。"
"1014506-12-キサキ" = "ここからは委ねてもよいか？"
"1014506-13" = "（必死に候補をひねり出した）"
"1014506-14-キサキ" = "海……。"
"1014506-15-キサキ" = "噂に聞いた通りじゃ。"
"1014506-16-キサキ" = "たしかに――"
"1014506-17" = "[s] \"たしかに？\""
"1014506-18-キサキ" = "暑い。"
"1014506-19-キサキ" = "刺すような強い日差し。"
"1014506-20-キサキ" = "白浜は熱され、裸足では危険じゃろうな。"
"1014506-21-キサキ" = "塩気を含んだ風は、水辺とはまた異なった香り……。"
"1014506-22-キサキ" = "肌にまとわりつく感覚は……汗と塩が混ざり合った結果かの。"
"1014506-23-キサキ" = "これが海、か……記憶に深く刻まれそうじゃ。"
"1014506-24" = "[s] \"お気に……召しませんでしたか？\""
"1014506-25-キサキ" = "うむ。"
"1014506-26-キサキ" = "「日焼け止め」なるものを其方が塗ってくれれば、あるいは？"
"1014506-27" = "（キサキに日焼け止めをくまなく塗ってあげた）"
"1014506-28-キサキ" = "海水……。"
"1014506-29-キサキ" = "……しょっぱいのう。"
"1014506-30-キサキ" = "どことなく、浮力も強いように思う。"
"1014506-31-キサキ" = "……。"
"1014506-32-キサキ" = "2人乗りの浮き輪を用意した。一緒にどうかえ？"
"1014506-33-キサキ" = "ん？流されないように外で掴んでおく……？"
"1014506-34-キサキ" = "……。"
"1014506-35-キサキ" = "それもそうじゃな。では頼む。"
"1014506-36-キサキ" = "ただ……。"
"1014506-37-キサキ" = "2人乗りなんじゃがのう……。"
"1014506-38-キサキ" = "おお……揺れる……。これが波じゃな。"
"1014506-39-キサキ" = "川とはまた異なる趣があるのう。"
"1014506-40-キサキ" = "あれはカモメと言ったか……ずっと頭上を飛んでおるな。"
"1014506-41-キサキ" = "ふむ……？#n食べ物を狙っているから与えてはならぬ……とはどういうことじゃ？"
"1014506-42-キサキ" = "ほう……1つを与えられれば2つを求めかねん、と。"
"1014506-43-キサキ" = "まったく……人も動物も、足るを知らん生き物じゃの。"
"1014506-44-キサキ" = "これが「海の家」か……ふむ、ふむ。"
"1014506-45-キサキ" = "かき氷に焼きそば、焼きトウモロコシとな……。"
"1014506-46-キサキ" = "……。"
"1014506-47-キサキ" = "観光地が故に、それなりに値が張るのも理解できよう。"
"1014506-48-キサキ" = "とはいえ、玄武商会の子らがこれを見てどのような反応をするかは――"
"1014506-49-キサキ" = "まあ良い。これも全て、風情の1つなのじゃろう。"
"1014506-50-キサキ" = "では先生。美味しくいただこうぞ。"
"1014506-51-キサキ" = "ウォーターパーク……話には聞いておったが……。"
"1014506-52-キサキ" = "これほどの施設が、娯楽の目的だけで建てられておるとは圧巻じゃな。"
"1014506-53-キサキ" = "そうさな。まずは「ウォータースライダー」なるものを体験するとしよう。"
"1014506-54-キサキ" = "ひあああああああっ！？！？"
"1014506-55-キサキ" = "受け止めてくれたこと、礼を言わせてくれ。"
"1014506-56-キサキ" = "ほう？温水のプールもあるとは……。"
"1014506-57-キサキ" = "冷えた体にはちょうど良いかの。"
"1014506-58" = "[s] \"ゆっくり温まってきてね。\""
"1014506-59-キサキ" = "何を言っておる。"
"1014506-60-キサキ" = "其方も一緒じゃ。"
"1014506-61" = "[ns] \"私も！？\""
"1014506-62" = "（その足で温水プールへ入り……）"
"1014506-63" = "（いつもより少し距離の近いキサキと一緒に温まった）"
"1014506-64-キサキ" = "波のプール……。"
"1014506-65-キサキ" = "海でおおかた体験はしたが、人工的な波とはな……。"
"1014506-66-キサキ" = "意図的な危険はスリルという娯楽になると聞く。"
"1014506-67-キサキ" = "あっ！気をつけて！火山が噴火しました！"
"1014506-68-自動音声" = "大きな波が押し寄せてきますよー！！"
"1014506-69-自動音声" = "波の高さはなんと最大2.4メートル！飲み込まれないように注意してね！"
"1014506-70-キサキ" = "受けて立つとしよう。"
"1014506-71-キサキ" = "わっぷ……。"
"1014506-72" = "（あっという間に波にのまれたキサキをなんとか掴んだ）"
"1014506-73-キサキ" = "先生、礼を言う。"
"1014506-74-キサキ" = "ああ、大丈夫じゃ。其方が掴んでいてくれたからの。"
"1014506-75-キサキ" = "……。"
"1014506-76-キサキ" = "その……。"
"1014506-77-キサキ" = "もう一度……ダメかえ？"
"1014506-78" = "[s1] \"いいけど……。\"\n[s2] \"一応気をつけようね。\""
"1014506-79-キサキ" = "もちろんだとも。"
"1014506-80-キサキ" = "と言っても……妾をひしと掴んだ手。#n怪我など其方が許さぬであろう？"
"1014506-81-キサキ" = "――また波がくるよ！！"
"1014506-82" = "（キサキは心から波のプールを楽しんでいるようだった）"
"1014506-83-キサキ" = "ふう……。"
"1014506-84" = "[ns] \"どうだった？\""
"1014506-85-キサキ" = "そうじゃの……。"
"1014506-86-キサキ" = "……記憶に深く刻まれるような、そんな1日じゃった。"
"1014506-87-キサキ" = "其方には感謝してもしきれぬな。"
"1014506-88-キサキ" = "もう、いつ終わりが来たとしても悔いはないのう。"
"1014506-89" = "[s] \"え……？\""
"1014506-90-キサキ" = "ふふ、なんという顔をしておる。"
"1014506-91-キサキ" = "ただの冗談じゃよ。"
"1014506-92-キサキ" = "しかし……今日を振り返って、ある話を思い出した。"
"1014506-93-キサキ" = "――山海経に伝わる昔話じゃ。"
"1014506-94" = "[s] \"どんなお話なの？\""
"1014506-95-キサキ" = "そうさな……。"
"1014506-96-キサキ" = "あるところに、学問を志す少女がいた。#nしかし家からは反対されていての。"
"1014506-97-キサキ" = "故に変装して家を後にし、少女は学び舎への入学を成し遂げる。#n念願が成就したのじゃ。そこからは学問に明け暮れた。"
"1014506-98-キサキ" = "その過程で、少女は1人の学友を得ることとなる。"
"1014506-99-キサキ" = "学問と絆を、決して諦めない。2人は固く誓い合った。"
"1014506-100-キサキ" = "しかし少女は家の者に見つかり、成す術もなく引き裂かれてしまう。"
"1014506-101-キサキ" = "孤独に耐えられなかった学友はというと……体を壊し、帰らぬ人となった。"
"1014506-102-キサキ" = "そして日が経った頃……少女は学友の墓を見つける。"
"1014506-103-キサキ" = "悲痛に耐え切れず、声を上げて泣いた。#nその瞬間、墓が動き出し……2人は蝶となり、どこかへ消えていったという。"
"1014506-104" = "[s3] \"考えさせられる話だね……。\"\n[s4] \"でも……どうしてその話を？\""
"1014506-105-キサキ" = "なに、些か強引な世迷言じゃよ。"
"1014506-106-キサキ" = "妾は「水着」に身を包み、先生の案内を通じて「水着に相応しき場所」を訪れた。"
"1014506-107-キサキ" = "つまり……これは変装していると言えるのではないか？"
"1014506-108-キサキ" = "そして生徒の務めは勉強であり、すなわち学問を志す者じゃ。"
"1014506-109" = "[s] \"なる、ほど……？\""
"1014506-110-キサキ" = "そういう反応かの。"
"1014506-111-キサキ" = "いいや、これくらいで丁度いいのやもしれぬな。"
"1014506-112-キサキ" = "ただ、覚えておくとよい。山海経において「蝶のペア」は特別な意味を有する。"
"1014506-113-キサキ" = "加えて「青い蝶」は、不滅の象徴じゃ。"
"1014506-114-キサキ" = "言い換えるのならば、「諦めを知らぬ」ということ。"
"1014506-115" = "（キサキが伝えようとしてくれたことは、きっと半分も理解できなかった）"
"1014506-116" = "（それでもキサキはいつもより楽しそうで、飾らない姿に見えた）"
