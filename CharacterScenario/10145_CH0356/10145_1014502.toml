[translation]
"1014502-1" = "普通"
"1014502-2" = "（キサキより早く待ち合わせ場所に着いた）"
"1014502-3" = "（いい天気だ……）"
"1014502-4-キサキ" = "もう来ておったか。"
"1014502-5-キサキ" = "誘ったのは妾だというに、こちらが遅くなってしまったな。"
"1014502-6" = "（せっかくだし、冗談を言ってみよう）"
"1014502-7" = "[ns1] \"とんでもございません。門主様にお会いできて光栄です。\"\n[ns2] \"どちらにご案内しましょう？\""
"1014502-8-キサキ" = "門主、か。斯様なところでまでそう呼ぶのは無粋ではないかのう？"
"1014502-9-キサキ" = "……。"
"1014502-10-キサキ" = "先生。"
"1014502-11-キサキ" = "今は休息のためにここに来ておる。そうじゃな？"
"1014502-12-キサキ" = "なればこそ。"
"1014502-13-キサキ" = "日頃の肩書には縛られず。其方が相対する妾は――"
"1014502-14-キサキ" = "ただの[ruby=りゅうげ]竜華[/ruby]キサキであるつもりじゃ。"
"1014502-15" = "[s3] \"そうだよね……。\"\n[s4] \"ごめん、怒らせちゃったかな。\""
"1014502-16-キサキ" = "まさか。そういうことではない。"
"1014502-17-キサキ" = "先ほどの発言とて、冗談だろうことは分かっておる。"
"1014502-18-キサキ" = "だが、しかしじゃ。"
"1014502-19-キサキ" = "せめて今日くらいは……。"
"1014502-20-キサキ" = "其方からも「キサキ」として接してはくれぬか。"
"1014502-21-キサキ" = "もちろん、妾も相応に振る舞おう。"
"1014502-22-キサキ" = "妾も、その……。"
"1014502-23-キサキ" = "[ruby=・   ・   ・   ・   ・]普通の生徒[/ruby]として扱われてみたい……などと思うのじゃが。"
"1014502-24" = "[s] \"分かった！\""
"1014502-25" = "（キサキのお願いに応えることにした）"
"1014502-26" = "（……のだけれど）"
"1014502-27-観光客A" = "美味しかったね～！#nあ、でも、お皿どうする？油とソースでべとべと……。"
"1014502-28-観光客B" = "川で洗っちゃえば良くない？"
"1014502-29-キサキ" = "あまり褒められたことではないのう。"
"1014502-30-キサキ" = "あれは処罰の対象となりうる行為じゃ。"
"1014502-31-キサキ" = "じゃが、ここ[ruby=せんがいきょう]は山海経の[/ruby]外……妾が指摘することでもない。#nとはいえ、見過ごすわけにも……。"
"1014502-32" = "[s] \"私たちが口を出すのはちょっと……。\""
"1014502-33-キサキ" = "そうさな……じゃが……。"
"1014502-34-キサキ" = "ん？先生に何か策があるのかえ？"
"1014502-35" = "（管理事務所に連絡した）"
"1014502-36-渓谷管理事務所スタッフ" = "他のお客様のご迷惑となりますので、川で食器を洗う行為はご遠慮いただけますようお願い申し上げます。"
"1014502-37-観光客A" = "チェッ……こっそりいけると思ったのに。"
"1014502-38-観光客B" = "ダル……誰かチクったのかな？"
"1014502-39-観光客A" = "もういいじゃん。早く行こ～"
"1014502-40-キサキ" = "水辺にテントを立てるなど……増水したらどうするのじゃ。"
"1014502-41-キサキ" = "ここに立ててはならぬと、張り紙があったはずじゃが……。"
"1014502-42-キサキ" = "目に入っておらぬのか……それとも、見て見ぬふりをしているのか。"
"1014502-43-キサキ" = "掟は過去の事例から生まれるもの。みすみす危険に身をさらすこともないじゃろうに。"
"1014502-44" = "（再び管理事務所に連絡をした）"
"1014502-45-渓谷管理事務所スタッフ" = "危険ですので、テントを移動させてください！"
"1014502-46-観光客C" = "えー……ここいい場所なのに。"
"1014502-47-観光客D" = "ウザっ。勝手にやるからほっといてよ。"
"1014502-48" = "（その時、川が勢いを増してテントに襲いかかる！）"
"1014502-49-悲鳴" = "うわああっ！？"
"1014502-50-キサキ" = "先生、救助隊の手配を！"
"1014502-51" = "（観光客は無事に救助された）"
"1014502-52" = "（キサキの気遣いは非常に細やかで、普通の高校生とは思えないほどだった……）"
"1014502-53-キサキ" = "あんなところから飛び込みを……！？"
"1014502-54-キサキ" = "川というものは、見た目以上に深いこともある。#nその逆も然り、じゃ。"
"1014502-55-キサキ" = "何が起こるか分からぬ地では、慎重に動くことが肝要じゃというのに……！"
"1014502-56" = "（管理事務所に連絡した）"
"1014502-57" = "（キサキは行く先々で観光客の身勝手な行動に気を揉み、その度に管理事務室へ連絡をしたが……）"
"1014502-58" = "（その様子は、休日を楽しんでいるようには見えなかった）"
"1014502-59-キサキ" = "ふぅ……なんだか疲れたのう……。"
"1014502-60" = "[s] \"ねえ、キサキ。\""
"1014502-61-キサキ" = "なんじゃ？"
"1014502-62-キサキ" = "もっと気楽に……か。"
"1014502-63-キサキ" = "ふむ……そうしようとは思っておったのじゃが……。"
"1014502-64" = "[s5] \"分かってるよ。\"\n[s6] \"でも、気にせず肩の力を抜いてほしいかな。\"\n[s7] \"トラブルが発生したら私がなんとかするからさ。\""
"1014502-65-キサキ" = "甘えて良いと、そう言うのかえ……？"
"1014502-66-キサキ" = "ふむ……。"
"1014502-67-キサキ" = "……。"
"1014502-68-キサキ" = "つまりそれは……。"
"1014502-69" = "（キサキが腕を絡めて、手を握ってきた）"
"1014502-70-キサキ" = "こうしてもよい、と？"
"1014502-71-キサキ" = "ふふ、何を驚いておる。"
"1014502-72-キサキ" = "其方の言う通りにしているだけじゃぞ？"
"1014502-73-キサキ" = "……。"
"1014502-74-キサキ" = "そうさな……。"
"1014502-75-キサキ" = "ようやく、休息の意味が分かってきたところじゃ。"
"1014502-76-キサキ" = "……。"
"1014502-77-キサキ" = "今日は己を振り返れたように思う。"
"1014502-78-キサキ" = "……面目ない。"
"1014502-79-キサキ" = "普通の生徒として過ごしたい。そう言ったのは妾だというに。"
"1014502-80-キサキ" = "いつもと同じことをしていては意味を成さぬな。"
"1014502-81" = "[s8] \"無意識だろうし、気にしなくていいよ。\"\n[s9] \"習慣を変えるのって難しいよね。\""
"1014502-82-キサキ" = "慣れと言えば聞こえは良いが……染みついたものは、自分だけでは取り除けぬ。"
"1014502-83-キサキ" = "……妾とて、最初からこうではなかった。"
"1014502-84-キサキ" = "合わない服を着続ければ、いつしか身体が服に合わせてしまう――"
"1014502-85-キサキ" = "悲しくも、真実のようじゃな。"
"1014502-86-キサキ" = "して。"
"1014502-87-キサキ" = "今日の猶予はまだ残されている。"
"1014502-88-キサキ" = "改めて、「普通に過ごせる」よう助けてくれぬか？"
"1014502-89" = "[ns] \"楽しめた？\""
"1014502-90-キサキ" = "うむ。"
"1014502-91-キサキ" = "晴れやかな気分じゃ。"
"1014502-92-キサキ" = "……妾が求めていたのは、このような時間だったのやもしれぬ。"
"1014502-93-キサキ" = "まったく、言い得て妙じゃな。"
"1014502-94-キサキ" = "――人は、自身の本当の望みを知らない、という話じゃ。"
"1014502-95-キサキ" = "先生。"
"1014502-96-キサキ" = "我が儘に付き合わせてしまったな。礼を言う。"
"1014502-97" = "[s] \"どういたしまして。\""
"1014502-98-キサキ" = "ふふ。"
"1014502-99-キサキ" = "そうじゃの……。"
"1014502-100-キサキ" = "ひとまず今日のところは、な。"
"1014502-101" = "[s] \"え……？\""
"1014502-102" = "（微笑んだキサキは、宿へ向かって歩き出した）"
