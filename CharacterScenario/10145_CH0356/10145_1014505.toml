[translation]
"1014505-1" = "天界への旅"
"1014505-2-キサキ" = "昨晩、調べ物をしたところ――"
"1014505-3-キサキ" = "[ruby=ここ]渓谷[/ruby]ではボートに乗るのが「マスト」らしくてのう。"
"1014505-4" = "[s] \"なるほど？\""
"1014505-5-キサキ" = "うむ。"
"1014505-6-キサキ" = "手漕ぎのボートに乗り、流れる景色を堪能する……それが好評のようじゃな。"
"1014505-7-キサキ" = "昼も過ぎれば客が押し寄せることじゃろう。"
"1014505-8-キサキ" = "然らば、ゆっくりした時間を過ごすためには早い時間にせざるを得なかったのじゃ。"
"1014505-9" = "[s1] \"ここからでも良い景色なのに。\"\n[s2] \"水上から見たらもっと凄いんだろうね。\""
"1014505-10-キサキ" = "うむ。参ろうか。"
"1014505-11-ガイド" = "――これで説明は以上となります。"
"1014505-12-ガイド" = "夏でも川の水は冷たいので、落ちないように気をつけてくださいね。"
"1014505-13-ガイド" = "では、こちらへどうぞ。"
"1014505-14-キサキ" = "ふふ、楽しみじゃのう。"
"1014505-15-キサキ" = "あれが例のボートじゃな。たしか、4人まで乗れると言っておったか。#n2人ならゆとりがありそうじゃ。"
"1014505-16-キサキ" = "立ち込める霧と山々が壮観だと聞くが……はたして如何ほどかのう。"
"1014505-17-キサキ" = "見れない日もあるので、そればっかりはどうしようもないのですが……。"
"1014505-18-ガイド" = "川面に広がる霧の向こうに、雄大な山がそびえ立っていて。"
"1014505-19-ガイド" = "伝説の神仙になったような気分を味わえますよ！"
"1014505-20-キサキ" = "ふふっ。それは楽しみじゃ。"
"1014505-21-キサキ" = "さあ、参ろうか。"
"1014505-22" = "（キサキに続いてボートに乗ろうとすると）"
"1014505-23-ガイド" = "あっ、すみません。保護者のかた向けの説明を。"
"1014505-24" = "[s] \"え？ああ、はい。\""
"1014505-25-ガイド" = "少し補足がありまして。"
"1014505-26-ガイド" = "こちらのボートは、最新の自動運転システムを搭載しています。"
"1014505-27-ガイド" = "伝統的な作りに見えるのは装飾でして。"
"1014505-28-ガイド" = "なので頑張ってオールを漕ぐ必要はありません。#n少し触れる程度で大丈夫です！"
"1014505-29" = "[s] \"ハイテクですね。\""
"1014505-30-ガイド" = "それと、濃霧などで帰り道が分からなくなった時もご安心ください。"
"1014505-31-ガイド" = "自動運転モードに切り替えれば、自動でここに戻るようになっていますので。"
"1014505-32-ガイド" = "では、良い船旅を！"
"1014505-33-キサキ" = "先生？何か問題かえ？"
"1014505-34" = "[ns] \"すぐ行く！\""
"1014505-35" = "（キサキと2人でボートに乗った）"
"1014505-36" = "（オールに力をいれなくとも、ボートはスムーズに進んだ）"
"1014505-37-キサキ" = "……静かじゃ。"
"1014505-38-キサキ" = "任せきりじゃが……疲れぬか？"
"1014505-39" = "[s] \"まだなんともないよ。\""
"1014505-40-キサキ" = "そうか。其方の腕は、予想より丈夫なようじゃのう。"
"1014505-41-キサキ" = "千の峰がそびえ立ち、山々に抱かれた一筋の川が軌跡を描く。"
"1014505-42-キサキ" = "見えるかえ、先生。#n2羽のシラサギが仲睦まじく互いを見つめあっておるぞ。"
"1014505-43-キサキ" = "……。"
"1014505-44-キサキ" = "少し、船を止めてくれぬか。"
"1014505-45-キサキ" = "水は絶えず海に集まり、時は人を省みぬとも……。"
"1014505-46-キサキ" = "其方と共にある今だけは、何もかもが止まってしまったようじゃ。"
"1014505-47-キサキ" = "……。"
"1014505-48-キサキ" = "水清き場に鳥は戻り。"
"1014505-49-キサキ" = "川は止めどなく流るるのみ。"
"1014505-50-キサキ" = "世に問うは富貴の意義。"
"1014505-51-キサキ" = "此処に其方と我ありて、いざ空に捧ぐるは盃なり。"
"1014505-52-キサキ" = "……ふむ。"
"1014505-53" = "[s] \"どうかした？\""
"1014505-54-キサキ" = "見よ。"
"1014505-55-キサキ" = "霧が濃くなってきた。"
"1014505-56-キサキ" = "なるほど、これが……。"
"1014505-57-キサキ" = "神仙となれば、斯様な景色の中を過ごすのやも知れぬな。"
"1014505-58" = "[wa:740]― [log=키사키 수영복]どうじゃ、[wa:1260]先生。[/log] "
"1014505-59" = "― [log=키사키 수영복]あれほど色彩に溢れていた[wa:1600]景観が――[wa:1470]この通り。[/log] "
"1014505-60" = "― [log=키사키 수영복]うむ、[wa:1290]洗練されたのう。[/log] "
"1014505-61" = "[wa:1180]― [log=키사키 수영복]川、[wa:1090]水、[wa:1100]霧、[wa:1380]山……。[/log] "
"1014505-62" = "― [log=키사키 수영복]そして先生……[wa:2530]其方だけが[wa:1850]妾の目に映っておる。[/log] "
"1014505-63" = "[wa:2860]― [log=키사키 수영복]其方の目には[wa:2070]何が映っておる？[/log] "
"1014505-64" = "― [log=키사키 수영복]妾とこの景色のなか……。[/log] "
"1014505-65" = "― [log=키사키 수영복]妾を、[wa:1450]その両の瞳に[wa:2240]閉じ込めておるかえ？[/log] "
"1014505-66" = "[wa:200]― [log=키사키 수영복]ふふっ……[wa:2280]このような逸話を[wa:1090]聞いたことはあるかのう？ [/log]"
"1014505-67" = "― [log=키사키 수영복]仙女は風に乗り――[/log]"
"1014505-68" = "― [log=키사키 수영복]羽のように[wa:1760]空を舞うのだと。[/log] "
"1014505-69" = "[wa:870]― [log=키사키 수영복]目を閉じて[wa:2170]息を吸い込んでみるのじゃ、[wa:2280]先生。[/log] "
"1014505-70" = "― [log=키사키 수영복]そうすれば、[wa:1570]そこにも――[/log] "
"1014505-71" = "― [log=키사키 수영복]妾を[wa:1140]感じられるやもしれぬぞ？[/log] "
"1014505-72-キサキ" = "……霧が？"
"1014505-73" = "[ns] \"陽が出て、晴れてきたね。\""
"1014505-74-キサキ" = "ふふ、そうか。"
"1014505-75-キサキ" = "其方と共に、神仙を準えるのも悪くはなかったのじゃが……。"
"1014505-76-キサキ" = "……。"
"1014505-77-キサキ" = "仕方あるまい。下界の者は下界の生を過ごすべきだ。"
"1014505-78-キサキ" = "では、お暇しようかの。"
"1014505-79" = "[s] \"はい、門主様。\""
"1014505-80" = "（自分の手でゆっくりと舵を取り、帰路についた） "
