[translation]
"2002203-1" = "少し遅れて"
"2002203-2" = "ゲヘナ学園・学生食堂"
"2002203-3" = "（フウカに言われた通り、ゲヘナの食堂を訪れた）"
"2002203-4-フウカ" = "こんにちは、先生。"
"2002203-5" = "[ns] \"あれ、フウカ。その服……？\""
"2002203-6-フウカ" = "ど、どうでしょうか……？"
"2002203-7" = "[ns1] \"世界で一番可愛い！最高に似合ってる！\"\n[ns2] \"着物のフウカたん！\""
"2002203-8-フウカ" = "えへへっ……そう言っていただいてうれしいです。"
"2002203-9-フウカ" = "と、とはいえやはり恥ずかしいですね。慣れない格好なので落ち着かないというか。"
"2002203-10-フウカ" = "え、休日なのに申し訳ない……？"
"2002203-11-フウカ" = "いいえ！ここは私にとって戦場であり、聖地ですから！"
"2002203-12-フウカ" = "それに今日は、先生おひとりのために使えるので！"
"2002203-13-フウカ" = "むしろ張り切っちゃいます！"
"2002203-14" = "[s] \"でも何というか、休日出勤させちゃってる感が……。\""
"2002203-15-フウカ" = "大丈夫です、お気になさらず！"
"2002203-16-フウカ" = "では、少しだけ待っていてください。下準備は済ませておきましたので。"
"2002203-17-フウカ" = "先生に最高のそばをお出ししますから！"
"2002203-18-フウカ" = "かつおだしはOK……。"
"2002203-19-フウカ" = "鶏もも肉と長ネギもカットしてあるから……。"
"2002203-20-フウカ" = "長ネギを先に焼いてから、ネギの油でもも肉を焼いて……。"
"2002203-21-フウカ" = "もう一つの鍋でかつおだしに砂糖、醤油、みりんを入れて……。"
"2002203-22-フウカ" = "あとは茹で上がったそばを水で締めて……っと。"
"2002203-23-フウカ" = "あとはつゆを注いだら、薬味を乗せて……。"
"2002203-24-フウカ" = "先生、できました！年越しそばです！"
"2002203-25-フウカ" = "鶏肉の旨味とネギの風味が合わさって、良い香りですね。"
"2002203-26-フウカ" = "本当は海老の天ぷらも用意しようと思ったのですが……。"
"2002203-27" = "[s3] \"そんな、気にしないで。ありがとう。\"\n[s4] \"ううん、これだけでもすごく美味しそう。\""
"2002203-28-フウカ" = "そ、そうですか？なら良かったです。えへへっ……。"
"2002203-29-フウカ" = "それでは、「いただきます」をしましょうか！"
"2002203-30" = "[s] \"いただきます！\""
"2002203-31-フウカ" = "はい、いただきます！"
"2002203-32" = "（蕎麦湯も貰って、つゆまできれいに完食した）"
"2002203-33-フウカ" = "お味はいかがでしたか？先生のお口に合いましたでしょうか……？"
"2002203-34" = "[s5] \"最高だったよ、流石はフウカ。\"\n[s6] \"今まで食べた中で一番美味しかったかも。\""
"2002203-35-フウカ" = "本当ですか？ありがとうございます！"
"2002203-36-フウカ" = "私……やっぱり、自分の作った料理をおいしく食べてもらうのが好きです。"
"2002203-37-フウカ" = "それが先生なら、尚のこと……"
"2002203-38-フウカ" = "え……？"
"2002203-39-フウカ" = "あ、いえいえ！お礼をするのはこちらの方です！"
"2002203-40-フウカ" = "あ、そういえば今さらですが、ご挨拶をしそびれていましたね。"
"2002203-41-フウカ" = "あけましておめでとうございます、先生！"
"2002203-42" = "[ns] \"あけましておめでとう、フウカ。\""
"2002203-43" = "（その後しばらく他愛のない話をしてから、フウカを送り届けた）"
