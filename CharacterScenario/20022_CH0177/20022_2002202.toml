[translation]
"2002202-1" = "フウカの願い事"
"2002202-2" = "ゲヘナ学園・学生食堂"
"2002202-3-フウカ" = "ふぅ……今日も疲れた……。"
"2002202-4-フウカ" = "……って、先生！？"
"2002202-5-フウカ" = "ど、どうかされましたか？どうしてここに……。"
"2002202-6" = "[s1] \"フウカを待ってたんだ。お疲れ様。\"\n[s2] \"フウカたんに会いたくて。\""
"2002202-7-フウカ" = "わ、私……ですか？"
"2002202-8-フウカ" = "え、ええと、何か用事でもありましたか？"
"2002202-9-フウカ" = "私さっき給食部の仕事が終わったばかりで、汗かいてますし……。"
"2002202-10-フウカ" = "髪も直せてないですし、せめて着替えてから……それに……。"
"2002202-11" = "[s] \"いつも頑張っているフウカを労いたいなと思って。\""
"2002202-12-フウカ" = "えっ……！？"
"2002202-13-フウカ" = "そ、そんな、お気持ちはありがたいですが、えっと……！"
"2002202-14-フウカ" = "あ、あわわ、どうしよう、いったい何をすれば……！？"
"2002202-15" = "[s] \"だ、大丈夫だよ。落ち着いて、フウカ。\""
"2002202-16-フウカ" = "先生、次からは事前にご連絡いただけると……私の心臓の問題で……。"
"2002202-17-フウカ" = "え、びっくりさせたかった……？"
"2002202-18-フウカ" = "もう……先生はそうやって、時々意地悪になるんですから。"
"2002202-19-フウカ" = "この後、ですか？いえ、特に予定はありませんが……。"
"2002202-20" = "[s] \"じゃあ、少し街に出てみない？\""
"2002202-21-フウカ" = "は、はい！？"
"2002202-22-フウカ" = "こ、これってもしかしてデート……？普通の格好なのに……！"
"2002202-23-フウカ" = "うぅ、いつもこの格好ばっかりのせいで、こういう時に……！"
"2002202-24" = "[s] \"あ、疲れてたら無理にとは――\""
"2002202-25-フウカ" = "い、いえ！ただその、格好がと言いますか……。"
"2002202-26-フウカ" = "そんなこと気にしなくていい、ですか？うぅ……。"
"2002202-27-フウカ" = "で、でしたら……えっと、是非……！"
"2002202-28" = "市内"
"2002202-29" = "（フウカと一緒に市内へとやって来た）"
"2002202-30-フウカ" = "すごい、人がたくさんですね……。"
"2002202-31-フウカ" = "こういう時期だから、当然と言えば当然かもしれませんが……。"
"2002202-32-フウカ" = "そういえば私、いつもは給食部の仕事で大型マートに立ち寄るくらいで……。"
"2002202-33-フウカ" = "最近はあまり、お出かけしてなかったかもしれません。"
"2002202-34-フウカ" = "だからでしょうか……。"
"2002202-35-フウカ" = "普段目にしている景色なのに、どこか新鮮です。"
"2002202-36" = "[s] \"それは良かった。ところで、お腹は空いてる？\""
"2002202-37-フウカ" = "え？あ、はい！"
"2002202-38-フウカ" = "そういえば、今日は連休前の時間割だったので……"
"2002202-39-フウカ" = "お昼以降、何も食べて――"
"2002202-40-フウカ" = "い、いえ、これはその……！"
"2002202-41" = "[s] \"お腹空いたし、何か食べに行こっか。\""
"2002202-42-フウカ" = "そ、そうですね……！"
"2002202-43" = "（フウカと一緒に食べ歩きすることに決めた）"
"2002202-44" = "商店街"
"2002202-45-フウカ" = "わあっ。先生、見てください。このアスパラの肉巻き！"
"2002202-46-フウカ" = "色々なトッピングがありますね。海苔にチーズ、マヨネーズ……。"
"2002202-47-フウカ" = "先生はどれにしますか？"
"2002202-48-フウカ" = "先生、ローマッセですよ！"
"2002202-49-フウカ" = "この形、豚……でしょうか？"
"2002202-50-フウカ" = "程よい甘さとアーモンドの香りが良いですよね。"
"2002202-51-フウカ" = "あ、オリーボーレン！"
"2002202-52-フウカ" = "先生はご存知ですか？生地にフルーツを混ぜるお菓子で……"
"2002202-53-フウカ" = "揚げたては、特に美味しいんですよ！"
"2002202-54-フウカ" = "あ、甘いものが続いてしまいましたね……。"
"2002202-55-フウカ" = "あ、おでん……ちょうど良いタイミングですね。"
"2002202-56-フウカ" = "じゃんけんで勝ったら、もうひとつ具がもらえるそうです。行きましょう！"
"2002202-57-フウカ" = "お腹いっぱいです……。"
"2002202-58" = "[s] \"ちょっと食べすぎちゃったね……。\""
"2002202-59-フウカ" = "ですが色々と食べたおかげで、インスピレーションも湧きました。"
"2002202-60-フウカ" = "特に肉巻きが美味しかったですね。"
"2002202-61-フウカ" = "あのピリ辛のタレ、どうやったら再現できるんだろう……？"
"2002202-62-フウカ" = "野菜炒めと一緒に出すと、相性良さそうですよね。"
"2002202-63-フウカ" = "……？ここでも給食部のことを考えるとは思わなかった、ですか？"
"2002202-64-フウカ" = "あはは……クセ、と言うんでしょうか？職業病みたいなものかもしれません。"
"2002202-65" = "[s] \"フウカはがんばり屋さんだね。\""
"2002202-66-フウカ" = "そう、でしょうか……？自分ではよく分かりませんが……。"
"2002202-67-フウカ" = "それぞれ方向性は違っても、みんな好きなことがあると思うので……。"
"2002202-68-フウカ" = "私だけが特別ではないと思います、きっと。"
"2002202-69-フウカ" = "ただやるからには、全力でやっておきたいなと。"
"2002202-70" = "[ns] \"少しでも休んでもらえればと思ったけど……。\""
"2002202-71" = "[ns] \"もしかしておせっかいだったかな？\""
"2002202-72-フウカ" = "い、いえそんな！#nどこに行っても考えてしまうのは私のせいで……！"
"2002202-73-フウカ" = "おせっかいだなんて、そんなことは……。"
"2002202-74-フウカ" = "年末年始でお休みですので、気分転換も必要だと自分でも思いますし……！"
"2002202-75" = "[s] \"そっか。年末年始と言えば、新年のお願い事は決めた？\""
"2002202-76-フウカ" = "そういえば、まだ考えていませんでした。"
"2002202-77-フウカ" = "ううん、どうしましょう……あらためてお願いするとなると……。"
"2002202-78-フウカ" = "もし本当に叶うのなら……。"
"2002202-79-フウカ" = "一つだけ、無いことも無いのですが……。"
"2002202-80-フウカ" = "その、一日だけでもいいので……平穏な日常を過ごしたいです。"
"2002202-81-フウカ" = "本当に、心から……。"
