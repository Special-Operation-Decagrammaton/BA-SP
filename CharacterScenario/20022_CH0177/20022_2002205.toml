[translation]
"2002205-1" = "連休最後のお出かけ"
"2002205-2" = "ゲヘナ学園・校庭"
"2002205-3-フウカ" = "すみません、お待たせしました……！"
"2002205-4" = "[s] \"ううん、今着いたところだよ。\""
"2002205-5-フウカ" = "約束通り着物で来ましたが……。"
"2002205-6-フウカ" = "えっと……何をするんでしょうか？"
"2002205-7" = "[s1] \"とりあえず、場所を移そうか？\"\n[s2] \"ゲヘナだと、フウカにとってはいつもの場所だろうし。\""
"2002205-8-フウカ" = "……？"
"2002205-9-フウカ" = "と、とりあえず、先生のこと信じてますよ……？"
"2002205-10" = "市内"
"2002205-11-フウカ" = "すごい高さで噂の、展望タワー……。"
"2002205-12-フウカ" = "な、何だか高速エレベーターで上がってきたせいか……"
"2002205-13-フウカ" = "ちょっとだけ、酔ってしまったかもです……。"
"2002205-14-フウカ" = "あっ、すごい……！ここから市内が一望できるんですね！"
"2002205-15-フウカ" = "と、ところで、どうして足元がガラスなんでしょう……？"
"2002205-16-フウカ" = "あ。足がガクガクして、動けません……。"
"2002205-17-フウカ" = "せ、先生、その……よろしければ、手を……。"
"2002205-18-フウカ" = "初めて地面のありがたみを実感しました……！"
"2002205-19-フウカ" = "展望台から見た景色は素敵でしたが、高いところはちょっと怖いですね……。"
"2002205-20-フウカ" = "……え、先生も怖かったんですか？"
"2002205-21-フウカ" = "この、わざわざ怖い思いをしようとする習性、一体何なんでしょうね……。"
"2002205-22-フウカ" = "次に行く場所、ですか？"
"2002205-23-フウカ" = "えっと、お任せしますが、その……いえ、展望タワーも良かったのですが……！"
"2002205-24" = "遊園地"
"2002205-25-フウカ" = "遊園地……話にはよく聞いていましたが……。"
"2002205-26-フウカ" = "……？停止状態から、1.56秒で180km/hまで加速……？"
"2002205-27-フウカ" = "それに加えて、コースの真ん中に直径39.7mの宙返りループ……？"
"2002205-28-フウカ" = "それ、本当に乗って大丈夫ですか！？みんな無事に帰ってこられますか！？"
"2002205-29" = "[s] \"も、もちろん無理強いはしないけど……。\""
"2002205-30-フウカ" = "うぅ……でも先生のオススメですし、せっかく二人で来たわけですし……。"
"2002205-31-フウカ" = "の、乗ります……こうなったら乗りましょう！"
"2002205-32-フウカ" = "きゃああああああああっ！"
"2002205-33-フウカ" = "ううぅ……本当に死ぬかと思いました……。"
"2002205-34-フウカ" = "えっ、もうすぐパレードが始まるんですか？"
"2002205-35-フウカ" = "あ、百鬼夜行連合学院の名前が書いてありますね。"
"2002205-36-フウカ" = "これが噂に聞く、百鬼夜行連合学院のお祭りの力……。"
"2002205-37-フウカ" = "あれ……？後ろに山海経の列も続いてますね？#nその後ろにはレッドウインターも？"
"2002205-38-フウカ" = "あ、なるほど……各学校の特徴をコンセプトにしたパレードなんですね？"
"2002205-39-フウカ" = "ということは、ゲヘナもあるんでしょうか？あ、トリニティが……！"
"2002205-40" = "商店街"
"2002205-41-フウカ" = "楽しかったですね、先生。"
"2002205-42-フウカ" = "少し歩き疲れましたし……お腹も空いたので、どこかお店に入りたいですね。"
"2002205-43-フウカ" = "え、直感で……え、えっと……では、あちらのお店なんてどうでしょう。"
"2002205-44-フウカ" = "な、何でも好きに注文……！？"
"2002205-45-フウカ" = "そ、それはちょっと恐れ多いと言いますか……。"
"2002205-46-フウカ" = "ですが、せっかくですし……て、適度に節度を持ったうえで……！"
"2002205-47" = "（フウカと一緒に、おいしい料理を楽しんだ）"
"2002205-48-フウカ" = "美味しかったです！"
"2002205-49-フウカ" = "そのお会計は大丈夫でしたか？いつの間にか払っていただいてましたが……"
"2002205-50-フウカ" = "い、いえ、気にしないのは流石に無理ですよ……！？"
"2002205-51" = "[s] \"フウカのためだったら、これくらいなんてこと無いから！\""
"2002205-52-フウカ" = "な、何だかすみません……。"
"2002205-53-フウカ" = "え、謝らないでほしい……？"
"2002205-54-フウカ" = "……ふふっ。確かに、言うべき言葉が違うかもしれません。"
"2002205-55-フウカ" = "ありがとうございます、先生！"
"2002205-56" = "[s] \"向こうの方に行こうと思うんだけど、疲れは大丈夫？\""
"2002205-57-フウカ" = "はい、もちろんです！"
"2002205-58" = "夜桜の道"
"2002205-59-フウカ" = "この辺りは静かですね。"
"2002205-60-フウカ" = "こんな夜遅くに外を出歩くのは、何だか久しぶりです。"
"2002205-61" = "[s] \"何だか、慌ただしい一日にしちゃったね……。\""
"2002205-62-フウカ" = "いえいえ、その分充実した一日でした。"
"2002205-63" = "[s] \"フウカに楽しんでもらえたなら良かった。\""
"2002205-64-フウカ" = "そ、それは……？"
"2002205-65-フウカ" = "どうして、急に……？"
"2002205-66" = "[ns] \"いつもゲヘナで頑張ってるから。\""
"2002205-67" = "[ns] \"たまには違うところで、色んな事を楽しんでもらえたらなって。\""
"2002205-68-フウカ" = "せ、先生……。"
"2002205-69-フウカ" = "そんな、閉じ込められてるみたいな……いえ、まあ全然違うというわけではないですが……。"
"2002205-70-フウカ" = "ですが……やっぱり私はただ、自分のやるべきことをやってるだけなので。"
"2002205-71" = "[ns] \"それがフウカだもんね。\""
"2002205-72" = "[ns] \"それでもたまには、良い連休で終わってほしいなって。\""
"2002205-73-フウカ" = "良い連休……。"
"2002205-74-フウカ" = "そう、ですね。先生と過ごせて、良い連休になりました。"
"2002205-75" = "[wa:1500]― 本当に……[wa:1700]嬉しいです。"
"2002205-76" = "[wa:1500]― いつも[wa:700]ありがとうございます、[wa:1200]先生。"
"2002205-77" = "[wa:2000]― 先生からは、[wa:1400]色々と[wa:400]いただいてばかりですね。"
"2002205-78" = "― 私の料理を、[wa:1200]誰よりも[wa:500]おいしく食べて[wa:500]くださるのは……"
"2002205-79" = "[wa:1300]― いつも[wa:300]先生で……。"
"2002205-80" = "[wa:1500]― それが……"
"2002205-81" = "[wa:1600]― 私にとって、[wa:1100]一番の[wa:400]プレゼントなんです。"
"2002205-82" = "[wa:1500]― なので、[wa:500]その……[wa:2000]先生。"
"2002205-83" = "[wa:2100]― これからも、[wa:1300]お願いしますね？"
"2002205-84" = "（夜も深まった頃、フウカを送り届ける帰り道の途中……）"
"2002205-85" = "ゲヘナ学園・校庭"
"2002205-86-フウカ" = "きゃっ！"
"2002205-87" = "[ns] \"フウカ！？\""
"2002205-88-フウカ" = "だ、大丈夫です。ちょっと足を……"
"2002205-89-フウカ" = "っ……！"
"2002205-90-フウカ" = "す、すみません、少し捻ってしまったみたいで……あっ……！"
"2002205-91" = "（ふらつくフウカを、しっかりと抱きとめる）"
"2002205-92-フウカ" = "せ、先生……！？"
"2002205-93-フウカ" = "……。"
"2002205-94-フウカ" = "そ、その……もう少しこのままでも、いいでしょうか……？"
"2002205-95-フウカ" = "（立てないほどじゃないけど……）"
"2002205-96-フウカ" = "（ごめんなさい……今だけはひとりで頑張りきれない、悪い子に……）"
"2002205-97" = "（その後フウカを支えたまま、帰路につくのだった）"
