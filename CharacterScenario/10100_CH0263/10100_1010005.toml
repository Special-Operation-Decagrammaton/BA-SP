[translation]
"1010005-1" = "覆面ライダー"
"1010005-2" = "（約束の場所でシロコを待っていると……）"
"1010005-3-強盗" = "[ruby=ど]退[/ruby]け、[ruby=ど]退[/ruby]けぇ！"
"1010005-4" = "[ns1] \"うわっ！？\"\n[ns2] 安全な場所に避難する。"
"1010005-5-市民１" = "ご、強盗です！#n誰か、あのトラックを止めてください！"
"1010005-6-市民２" = "あの中には、キャベツがたくさんあるんだ！"
"1010005-7" = "[s3] （最近、アビドスの治安がさらに悪くなっているような……）\n[s4] （いや、今はそれより……）"
"1010005-8-？？？" = "先生、ちょっとごめん。"
"1010005-9-市民２" = "じ、自転車！？"
"1010005-10-市民２" = "覆面ライダーだ！"
"1010005-11-強盗" = "う、嘘だろ！？"
"1010005-12-強盗" = "自転車でトラックに追いつくなんて、ありえねぇ！"
"1010005-13" = "[ns] \"…………。\""
"1010005-14" = "[ns] \"…………。\""
"1010005-15-市民１" = "ありがとうございます、覆面ライダーさん！"
"1010005-16-市民２" = "都市伝説かと思ってました！"
"1010005-17-シロコ" = "……先生、どこか場所を移そう。"
"1010005-18" = "[s] \"そうだね……。\""
"1010005-19-シロコ" = "ん、ここなら大丈夫。"
"1010005-20" = "[s5] \"どうしてこうなったの！？\"\n[s6] \"すごく目立ってなかった！？\""
"1010005-21-シロコ" = "うーん。"
"1010005-22" = "[ns] \"覆面ライダー、だっけ……？\""
"1010005-23-シロコ" = "変な噂が立たないように、顔を隠そうと思って。"
"1010005-24" = "[s] \"むしろ、逆効果のような……。\""
"1010005-25-シロコ" = "……ん。"
"1010005-26" = "[s] \"それ、新しい自転車の？\""
"1010005-27-シロコ" = "まだ未完成だけど。#nサイクルジャージもないし……。"
"1010005-28-シロコ" = "ちゃんと組めたら、紹介する。"
"1010005-29" = "[s] \"楽しみにしてるね。ところで、悩み事って？\""
"1010005-30-シロコ" = "ん。"
"1010005-31-シロコ" = "対策委員会から、#n「アビドス生徒会」の名前を受け継いでほしい、って言われたんだけど……。"
"1010005-32-シロコ" = "あの生徒会の意味を考えたら、#nどう答えれば良いのか分からなくて……。"
"1010005-33" = "[s] \"うーん……。\""
"1010005-34-シロコ" = "先生、どうすれば良いと思う……？"
"1010005-35" = "[s7] \"覆面水着団と……。\"\n[s8] \"覆面ライダー、か……。\""
"1010005-36" = "[ns9] \"どっちも覆面……。\"\n[ns10] \"アビドスって、大丈夫なのかな……。\""
"1010005-37" = "[ns] \"この問題は、自分で悩んで決めるべきだと思う。\""
"1010005-38-シロコ" = "ん……。"
"1010005-39" = "[ns] \"ただ、みんなシロコが心配なんじゃないかな。\""
"1010005-40-シロコ" = "……。"
"1010005-41-シロコ" = "ん。"
"1010005-42-シロコ" = "分かった。"
"1010005-43-シロコ" = "さっそくメッセージを送ってみる。"
"1010005-44-シロコ" = "ん、これで良し。"
"1010005-45" = "[ns] \"なんて送ったの？\""
"1010005-46-シロコ" = "……それは秘密。"
"1010005-47" = "[s] \"秘密かぁ。\""
"1010005-48-シロコ" = "あ、もう返事が。"
"1010005-49" = "[ns] \"見ても良いの？\""
"1010005-50-シロコ" = "「ん、覆面ライダーからの挑戦状、受けて立つ。覆面水着団より」……だって。"
"1010005-51" = "[ns] \"……誰からのメッセージか分かりやすいね。\""
"1010005-52-シロコ" = "……ん。"
"1010005-53-シロコ" = "そうだね。"
