[translation]
"2006302-1" = "少女のピックアップ"
"2006302-2" = "第2駐車場"
"2006302-3" = "（第2駐車場に向かうと――）"
"2006302-8" = "（すでにアズサが待っていた）"
"2006302-9-アズサ" = "来たか、先生。"
"2006302-10-アズサ" = "今度、副戦車長を任されることになった。#n操縦手を兼ねるから、戦車を運転する役割だ。"
"2006302-11-アズサ" = "一応、操縦にはそれなりの自信がある。"
"2006302-12-アズサ" = "でも街乗りするのは慣れてないから……。"
"2006302-13-アズサ" = "知らない場所、知らない人、知らない生活――#n少しずつ慣れてきたが、まだ緊張する。"
"2006302-14-アズサ" = "だから、練習に付き合ってほしい。"
"2006302-15" = "[s] \"喜んで！\""
"2006302-16-アズサ" = "先生は、いつもそうやって受け止めてくれるね。"
"2006302-17-アズサ" = "では、早速戦車に乗って――"
"2006302-21-アズサ" = "――ん？"
"2006302-25-アズサ" = "んん……？"
"2006302-29" = "[ns] \"どうしたの？\""
"2006302-30-アズサ" = "戦車が……ない。"
"2006302-31-アズサ" = "この辺りに停めたはずなんだけど……。"
"2006302-32" = "[s] \"忘れちゃうことってあるよね……！\""
"2006302-33-アズサ" = "ピックアップ地点は、常に覚えておかなければいけないのに。"
"2006302-34-アズサ" = "どうも車は停めた場所を忘れやすい。"
"2006302-35-アズサ" = "リモコンキーは……電池切れか。目視で探すしかなさそうだ。"
"2006302-42-アズサ" = "……これだ。#n記憶とは少し場所が違う気もするけど。"
"2006302-43-アズサ" = "あとで反省点を洗い出そう。次は注意しないと。"
"2006302-47-アズサ" = "なんだ？もうエンジンがかかっている。#n近づくと自動で始動する仕様らしい。"
"2006302-48" = "[s] \"……ん？\""
"2006302-49-アズサ" = "さあ、乗ろう。"
"2006302-61-正義実現委員会部員" = "えっ！？あっ、お、お疲れ様です、先輩――えっ！？"
"2006302-62-アズサ" = "先輩……？"
"2006302-63-アズサ" = "[ruby=しらす]白洲[/ruby]アズサだ。"
"2006302-64-アズサ" = "ところで、私の車両で何をしている？"
"2006302-65-正義実現委員会部員" = "これは[ruby=私たち]正義実現委員会[/ruby]の戦車ですけど！？"
"2006302-66-アズサ" = "それはおかしい。"
"2006302-67-アズサ" = "勘違いしてしまうのも理解はできる。同じ戦車だからな。#n念のため、もう一度確認した方がいい。"
"2006302-68" = "[s] \"たぶん正義実現委員会ので合ってると思う！\""
"2006302-69-アズサ" = "えっ！？"
"2006302-72-アズサ" = "こんな間違いをするなんて……恥ずかしい。"
"2006302-73-アズサ" = "一緒に謝ってくれてありがとう、先生。"
"2006302-74-アズサ" = "車種も同じで駐車位置も似ていた。#nだから……クルセイダーちゃんと誤認した。"
"2006302-75-アズサ" = "……それで、私の戦車はどこに？"
"2006302-76-アズサ" = "こんなことを忘れるなんて、気が緩んでいる証拠だ。#n反省しないと……。"
"2006302-80-アズサ" = "ん？連絡だ。"
"2006302-85-アズサ" = "車両点検のために移動させた――"
"2006302-86-アズサ" = "――らしい。"
"2006302-87-アズサ" = "私が場所を忘れていたわけじゃなかったのか。"
"2006302-88" = "[s] \"そりゃ見つからないよね！\""
"2006302-89-アズサ" = "はあ……よかった。"
"2006302-90-アズサ" = "ここまで腑抜けていたのかと思って、少し焦った。"
"2006302-91" = "[s1] \"これくらい普通だよ！\"\n[s2] \"誰でもやる凡ミスだよ！\""
"2006302-94-アズサ" = "そうなのか？"
"2006302-95-アズサ" = "普通の凡ミス……。"
"2006302-96-アズサ" = "そうか。これは怠慢ではなく……普通のことなんだな。"
"2006302-97-アズサ" = "……そっか。ふふ。そういうことか。"
"2006302-98-アズサ" = "それなら、少し安心した。ありがとう、先生。"
"2006302-102-アズサ" = "では、戦車もないことだし……どこかで休憩しよう。"
"2006302-103" = "[s] \"運転の練習は大丈夫？\""
"2006302-104-アズサ" = "うん。"
"2006302-105-アズサ" = "今日は代わりに「普通の日常」を覚えたから。"
