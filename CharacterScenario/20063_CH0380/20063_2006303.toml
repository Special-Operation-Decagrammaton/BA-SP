[translation]
"2006303-1" = "少女の欲張り"
"2006303-2-アズサ" = "ふぅ、ありがとう、先生。"
"2006303-3-アズサ" = "大きなショッピングモールはまだ分からないことが多い。#n買う物も多いし――"
"2006303-4-アズサ" = "エスカレーターが、まだ少し怖い……。"
"2006303-5-アズサ" = "でも、先生のおかげで突破できた。助かった。"
"2006303-6" = "[s1] \"力になれたならよかった。\"\n[s2] \"そういえば、いっぱいワイパー買ってたよね？\""
"2006303-9-アズサ" = "うん。戦車に使うワイパーは種類が多いから。"
"2006303-10-アズサ" = "それに、数も必要。観測用の窓それぞれにワイパーがいる。"
"2006303-11-アズサ" = "……あ。1つ買い忘れてた。#nさっき品切れで、別の店にあると言われたものだ。今から見に行こう。"
"2006303-16-アズサ" = "はぐれる危険があるから、距離をあけないように。分かった？"
"2006303-17" = "[s] \"迷子にならないように頑張るね！\""
"2006303-18-アズサ" = "よし。"
"2006303-20" = "車両用品店"
"2006303-23-アズサ" = "目標――車長キューポラ用ワイパーを発見した。"
"2006303-27-アズサ" = "これで達成。[ruby=RTB]Return To Base[/ruby]しよう。"
"2006303-28-アズサ" = "ん……？"
"2006303-32-アズサ" = "こ、これは……！#nどうしてここにモモフレンズが……！？"
"2006303-33" = "[s] \"コラボした車両用品みたいだね。\""
"2006303-34-アズサ" = "こんな商品を置いているとは――"
"2006303-35-アズサ" = "だ、ダメ！これは良くない！こんなところにいたら、だ、堕落して……！"
"2006303-36" = "[s] \"可愛いと思うけどな。\""
"2006303-37-アズサ" = "それは当然だ。可愛すぎるから危険だと言っている！"
"2006303-38-アズサ" = "見ていると判断力が鈍り……#n抱きしめたい、もふもふしたいという衝動に駆られてしまう。"
"2006303-39-アズサ" = "……でも、車両用品とモモフレンズになんの関係が？"
"2006303-43-アズサ" = "まっ、まさか――！"
"2006303-44-アズサ" = "ふわふわで可愛いぬいぐるみを、戦車の砲身に入れて掃除するのか……？"
"2006303-45" = "[s] \"そう見えるかもだけど違うかな！\""
"2006303-50-アズサ" = "そうか、車両用品にも可愛さが求められるのか。"
"2006303-54-アズサ" = "これは、手が冷えないようにするハンドルカバー。"
"2006303-58-アズサ" = "それから、この細長いピンキーパカは、シートベルトに装着するクッション。"
"2006303-62-アズサ" = "ふわふわで、丸くて、可愛い。"
"2006303-66-アズサ" = "うーん……。"
"2006303-67" = "[s3] \"欲しいの？\"\n[s4] \"買ってあげようか？\""
"2006303-70-アズサ" = "欲しいものはたくさんある。#n……正直全部欲しい。"
"2006303-71-アズサ" = "でも、これは戦車の中に置く物だから。"
"2006303-72-アズサ" = "もしも戦車に何かあったら、一緒に壊れてしまうのは嫌だ。"
"2006303-73-アズサ" = "何かを失った時の感覚……空っぽで、虚しいのは、苦手だ。"
"2006303-74-アズサ" = "……ごめん、先生。#nそんな大げさな話じゃないはずなのに、つい考えてしまって。"
"2006303-75" = "[s5] \"その気持ち、私も分かるよ。\"\n[s6] \"だから、これとかどうかな？\""
"2006303-81-アズサ" = "……！"
"2006303-82-アズサ" = "これ……なら……。"
"2006303-83-アズサ" = "うん、これなら大丈夫だ。"
"2006303-84-アズサ" = "ふふっ……。"
"2006303-87-店員" = "「戦車用芳香剤～ラベンダーの香り～スカルマンver」が1点ですね。#nお買い上げありがとうございます。"
"2006303-88-店員" = "こちらは香りが強いタイプなので、装着する位置にご注意ください。"
"2006303-92-アズサ" = "ありがとう、先生。"
"2006303-93-アズサ" = "芳香剤は消耗品だから、香りがなくなったら外して部屋に飾っておける。"
"2006303-94-アズサ" = "これなら安心だ。"
"2006303-95" = "[s] \"喜んでもらえて嬉しいよ。\""
"2006303-96-アズサ" = "これで、運転中もスカルマンと一緒にいられる。"
"2006303-97-アズサ" = "しかも先生が選んでくれた。"
"2006303-98-アズサ" = "大切にする。ありがとう。"
"2006303-102-アズサ" = "そろそろ戻ろう。みんなが待っている。"
"2006303-104" = "（翌日、アズサが戦車を見せてくれることになった）"
"2006303-109" = "[ns7] \"戦車はあるけど……。\"\n[ns8] \"アズサ？どこー？\""
"2006303-112-アズサ" = "中だ、先生。入ってきて。"
"2006303-118" = "[ns9] （戦車の中に入ると……）\n[ns10] （目と鼻に刺すような刺激が走った）"
"2006303-121-アズサ" = "先生、大丈夫か？"
"2006303-122-アズサ" = "ごめん、防毒マスクがなかった。"
"2006303-123-アズサ" = "先生にも塗ってあげる。これで目がチカチカしなくなるはず。"
"2006303-124" = "[ns] \"このツンとする匂いは……？\""
"2006303-125-アズサ" = "昨日、解散してすぐにスカルマンの芳香剤を取りつけたんだ。"
"2006303-126-アズサ" = "でも、1人だけだと寂しそうに見えて――"
"2006303-127-アズサ" = "店に戻って、他の仲間も全部買ってつけたんだ。"
"2006303-128-アズサ" = "結果、CS弾に近い刺激臭になった。"
"2006303-129-アズサ" = "欲張ってはいけないようだ。"
"2006303-130" = "[s] \"仲間も集めてあげるなんて、アズサは優しいね！\""
"2006303-134-アズサ" = "優し……い？"
"2006303-136" = "（その後、過剰な分は芳香剤の香りの素を取り外した）"
"2006303-137" = "（仲良く並んだ人形と、ほど良い香りに、アズサは満足そうだった）"
