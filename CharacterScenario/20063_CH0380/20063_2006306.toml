[translation]
"2006306-1" = "少女をなでた風"
"2006306-3-アズサ" = "先生。準備はできている。"
"2006306-4-アズサ" = "PSR用のIMINTを確保しよう。"
"2006306-5" = "[s1] \"さっき聞きそびれたんだけど――\"\n[s2] \"PSRとIMINTって何？\""
"2006306-8-アズサ" = "いつもの癖で略していた。説明が抜けててごめん。"
"2006306-9-アズサ" = "[ruby=攻撃後の確認偵察] 「PSR」 [/ruby]と、[ruby=画像資料]「IMINT」[/ruby]のことだ。"
"2006306-10-アズサ" = "先生の支援がどうしても必要だった。"
"2006306-11" = "[s] \"私は何をすればいい？\""
"2006306-12-アズサ" = "分かりやすく言えば撮影かな。"
"2006306-13-アズサ" = "大会に参加した証拠の提出を求められている。#n落第科目の単位を認定してもらうための課題なんだ。"
"2006306-14-アズサ" = "感想文は何とかなりそうだけど、写真が難しくて……。"
"2006306-15" = "[s] \"活動記録の写真なら、私の専門だよ。\""
"2006306-16-アズサ" = "流石は先生。心強いな。"
"2006306-17-アズサ" = "最低限は調べたんだけど、詳しくは分からないから指示をお願い。"
"2006306-21-アズサ" = "とりあえず移動しよう。#nたしか、光の入りやすい場所の方がよかったはず。"
"2006306-22-アズサ" = "今日は予報通りいい天気だね。"
"2006306-23-アズサ" = "そのせいで暑いけど、この程度なら慣れてるし、撮影に支障はないと思う。"
"2006306-36-アズサ" = "ふう……先生。全力で撮影してくれてありがとう。"
"2006306-37-アズサ" = "少し疲れたから、いったん休憩――"
"2006306-42-ゲヘナの生徒A" = "あっ、例の可愛い選手ちゃん！"
"2006306-46-ゲヘナの生徒B" = "大人と一緒ですね……！あの人、どなたでしょうか？"
"2006306-52-ゲヘナの生徒C" = "もしかして、あの噂の……？ "
"2006306-57-アズサ" = "……。"
"2006306-58-アズサ" = "……。"
"2006306-59" = "[s] \"アズサは可愛いもんね！\""
"2006306-64-ゲヘナの生徒A" = "ね！ね！一緒に写真撮ってくれない？"
"2006306-67-ゲヘナの生徒B" = "私も私も！"
"2006306-68-アズサ" = "この学園も他人との距離が近いんだな……。"
"2006306-69-アズサ" = "……あ。#nそういえば、交流している写真も必要なんだった。"
"2006306-70-アズサ" = "先生、お願いしてもいい？"
"2006306-71" = "[s] \"まっかせて！ほら、みんな寄って寄って！\""
"2006306-79-アズサ" = "う……ん……。"
"2006306-80-アズサ" = "日差しが、思ったより……強い……。"
"2006306-84-ゲヘナの生徒H" = "次は私とも一緒に撮っ――"
"2006306-85-アズサ" = "はあ、はあ……。"
"2006306-86-アズサ" = "目が、回る……。"
"2006306-90" = "[ns] \"アズサ！？\""
"2006306-91-ゲヘナの生徒H" = "大丈夫！？"
"2006306-92" = "[s] \"日陰のほうに行こう！\""
"2006306-93-アズサ" = "せん、せい……。"
"2006306-100" = "[wa:2510]― [log=아즈사 레이싱]あぁ……[wa:218]先生。[wa:1932]ごめん。[/log]"
"2006306-103" = "― [log=아즈사 레이싱]想定以上に日差しが強くて……[wa:2370]油断していた。[/log]"
"2006306-105" = "― [log=아즈사 레이싱]ちょっと……[wa:730]休憩……。[/log]"
"2006306-108" = "[ns]  \"熱中症かな。大丈夫？\""
"2006306-109" = "[wa:640]―  [log=아즈사 레이싱]……うん、[wa:436]大丈夫。[wa:1264]すぐに回復する。[/log]"
"2006306-111" = "― [log=아즈사 레이싱]最近はずいぶんと[wa:1644]弛んでいたみたいだ。[wa:1947]訓練不足を痛感する。[/log]"
"2006306-114" = "― [log=아즈사 레이싱]今後は先生を[wa:1677]失望させないようにするから。[/log]"
"2006306-116" = "― [log=아즈사 레이싱]……本当に、[wa:1345]ごめん。[/log]"
"2006306-119" = "[ns3] \"「先生」はこんなことで失望しないよ。\"\n[ns4] \"こういうので「先生」に謝らないでいいよ。\""
"2006306-122" = "[wa:730]― [log=아즈사 레이싱]……あっ。[/log]"
"2006306-124" = "― [log=아즈사 레이싱]謝ることじゃない、のか……[wa:3260]そうか。[/log]"
"2006306-127" = "― [log=아즈사 레이싱]昔だったら……[wa:1090]ひどく怒られていただろうから。[/log]"
"2006306-129" = "― [log=아즈사 레이싱]癖で、[wa:520]つい。[/log]"
"2006306-132" = "[wa:3680]― [log=아즈사 레이싱]……風が吹いている。[/log]"
"2006306-135" = "― [log=아즈사 레이싱]昔は、風向きを見て、[wa:1450]弾道への影響や……[/log]"
"2006306-137" = "― [log=아즈사 레이싱]色んなことを気にしてた。[/log]"
"2006306-140" = "― [log=아즈사 레이싱]でも、今は違う。[/log]"
"2006306-143" = "[wa:2850]― [log=아즈사 레이싱]ただ涼しくて……[wa:1250]心地よくて――[/log]"
"2006306-145" = "― [log=아즈사 레이싱]それを先生と一緒に感じることができて……[wa:2880]幸せだ。[/log]"
"2006306-149-アズサ" = "ふう……少し休んだら落ち着いた。"
"2006306-150-アズサ" = "写真も十分撮れたし、もう戻ろう。"
"2006306-151" = "[s] \"水分補給して、涼しい場所で休もっか。\""
"2006306-152-アズサ" = "うん。それがいい。"
"2006306-153-アズサ" = "……先生が一緒なら、安心できる。"
"2006306-154-アズサ" = "だから、先生……もう少しだけ、隣にいてほしい。"
"2006306-156" = "（その後、アズサをクーラーの利いた場所に連れていった）"
"2006306-157" = "（疲れていたのか、アズサはしばらくすると眠ってしまった）"
"2006306-158" = "（目が覚めるまで、アズサのそばで見守っていた）"
