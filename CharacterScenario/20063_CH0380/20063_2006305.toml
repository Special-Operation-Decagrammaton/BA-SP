[translation]
"2006305-1" = "少女のおつかい"
"2006305-3-アズサ" = "……ここだ。"
"2006305-4-アズサ" = "先生、覚えておいて。"
"2006305-5-アズサ" = "不用意な発言は、作戦の失敗につながる。"
"2006305-6" = "[s] \"わ、分かった……。\""
"2006305-8-アズサ" = "もらったメモに書いてあったんだ。"
"2006305-9-アズサ" = "「この前と同じようにやってみてください」って。"
"2006305-10-アズサ" = "だから、まずは私ひとりで挑戦する。"
"2006305-11-アズサ" = "……よし。目標地点、デルタタンゴへの到着を確認。#nハッチを開けるから、先生は周囲の警戒を頼む。"
"2006305-15-アズサ" = "目標地点、「モチバーガー・ゲヘ[ruby=デルタタンゴ]ナDT店[/ruby]」。周囲に脅威は見当たらない。"
"2006305-16-アズサ" = "これより、[ruby=ドライブスルー]Drive-Through[/ruby]でのハンバーガー回収作戦を開始する。"
"2006305-17" = "[s] \"デルタタンゴってドライブスルーだったの！？\""
"2006305-18-アズサ" = "うん。みんな大会登録で忙しいから、昼食[ruby=デルタタンゴ]をDTで[/ruby]買ってきてほしいと頼まれた。"
"2006305-19-アズサ" = "前にヒフミと行ったことがあるけど、具体的な手順はよく思い出せない。"
"2006305-20-アズサ" = "まずは、戦車を検問所に近づける必要があって……。"
"2006305-21-アズサ" = "……ふぅ。#n緊張するけど……行こう。"
"2006305-22" = "[s] \"検問所ではないけど、とりあえずOK！\""
"2006305-32-アズサ" = "……妙だな。普通は歩哨が出てくるものじゃないのか？"
"2006305-33-アズサ" = "警備が甘い。インターホンだけ残して全員どこへ――"
"2006305-37-モチバーガーの店員" = "こんにちは！モチバーガー・ゲヘ[ruby=ドライブスルー]ナDT店[/ruby]です！ご注文をどうぞ！"
"2006305-38-アズサ" = "なっ！？"
"2006305-39-アズサ" = "奇襲か！？主砲、発射用意！"
"2006305-40" = "[s] \"待って待って！これで注文するんだよ！\""
"2006305-43-モチバーガーの店員" = "お客様？ご注文はお決まりですか？"
"2006305-47-アズサ" = "注文……そっか、注文か。分かりやすく伝えないと。"
"2006305-48-アズサ" = "はきはきと、聞き取りやすく……相手を混乱させず、こちらの意思を確実に伝える――#nそうだ。"
"2006305-52-アズサ" = "……こちら準備完了。応答願う。"
"2006305-53-モチバーガーの店員" = "応答……？ご注文をお伺いします！"
"2006305-54-アズサ" = "こちら、受信やや不良。感度3。重大な支障なしと判断。"
"2006305-58-アズサ" = "よって、9ラインブリーフィングを続行する。"
"2006305-59-アズサ" = "先生、通信状態が悪いけど、途切れる部分は私が判断して補う。"
"2006305-60-アズサ" = "ライン1、受け取り地点。現在位置、モチバーガー・ゲヘ[ruby=デルタタンゴ]ナDT。[/ruby]"
"2006305-61-アズサ" = "ライン2、無線周波数およびコールサイン。現在チャンネルを維持。#n呼出符号、クルセイダーちゃん。"
"2006305-62-アズサ" = "ライン3、緊急度は低い。ただし後続車両が多いため、早めの対応を希望する。#nライン4、特記事項なし。"
"2006305-63-アズサ" = "ライン5。モチビーフバーガーセット5つ。サラダボウル2つ。#nドリンクはすべてコーラ。"
"2006305-64-モチバーガーの店員" = "え、えぇっと……。"
"2006305-65-アズサ" = "割り込みは控えてほしい。時間の都合上、ブリーフィングを再開する。#n続いて、ライン6――"
"2006305-71-アズサ" = "――以上。復唱は不要。直ちに準備を求める。クルセイダーちゃんからは以上。"
"2006305-72-モチバーガーの店員" = "マニュアルですので、念のため復唱します……。#nモチビーフバーガーセット5つに、サラダボウル2つ、ドリンクはすべてコーラですね。#n前へお進みください……。"
"2006305-73-モチバーガーの店員" = "はぁ……どうしてゲヘナって変なお客さんばっかりなんだろう……。"
"2006305-78-モチバーガーの店員" = "いらっしゃいませ……。"
"2006305-79-アズサ" = "よし。"
"2006305-80-アズサ" = "窓があり、歩哨もいる。やはりここが検問所だな。"
"2006305-81-モチバーガーの店員" = "検問……？"
"2006305-82-アズサ" = "エンジン停止。デイライト消灯完了。"
"2006305-83-アズサ" = "身分証を提示する。車内には火器もある。必要なら確認を。"
"2006305-84-モチバーガーの店員" = "いえ、その……検問所じゃないので……商品を受け取ってもらえれば、それで……。"
"2006305-85-アズサ" = "ん？"
"2006305-91-アズサ" = "よし。これで、予定通り補給完了だ。"
"2006305-92-アズサ" = "先生、どうかな。初めてにしては悪くなかっただろう？"
"2006305-96" = "[ns] \"立派だったよ！\""
"2006305-97-アズサ" = "先生。#n「普通」を覚えるのを手伝ってくれてありがとう。"
"2006305-98-アズサ" = "次は1人でも上手くできそうだ。"
"2006305-99-アズサ" = "だけど……次も一緒に来よう。そのほうが、きっと楽しい。"
"2006305-101" = "（帰り道、アズサは小さく鼻歌を歌いながら戦車を運転していた）"
"2006305-102" = "（おつかいをやり遂げて、誇らしげなアズサだった）"
