[translation]
"1009503-1" = "お出かけの時間ですよ、先生！"
"1009503-2" = "（約束の時間より15分ほど早く着いた……）"
"1009503-3" = "（ミドリを待っていると、人混みの向こうから……）"
"1009503-4-ミドリ" = "こんにちは、先生！"
"1009503-5" = "[ns] \"どうしてメイド服！？\""
"1009503-6-ミドリ" = "ふふっ、今回は驚いてくれましたね！"
"1009503-7" = "[s] \"重要なのはそこじゃないよ！\""
"1009503-8-ミドリ" = "別に驚くようなことじゃありませんよ。"
"1009503-9-ミドリ" = "だって今の私は、先生だけのメイドですから。"
"1009503-10" = "[s] \"その設定、続いてたんだね……。\""
"1009503-11-ミドリ" = "当たり前じゃないですか。"
"1009503-12" = "[s] \"当たり前ではないよ！？\""
"1009503-13-ミドリ" = "と、とにかく！私は先生のメイドです！"
"1009503-14-ミドリ" = "ご主人様の外出には、お供するもの……。"
"1009503-15-ミドリ" = "その際にふさわしい服装を身に纏うのは、自然なことですよね？"
"1009503-16-ミドリ" = "先生もそう思われませんか？"
"1009503-17" = "[s] \"私にはもう何も分からないよ……。\""
"1009503-18-ミドリ" = "ふふっ、ではこのままで。"
"1009503-19-ミドリ" = "あ、それなら……。"
"1009503-20-ミドリ" = "せっかくですし先生も、ドレスコードを合わせてみるのはいかがでしょう！"
"1009503-21-ミドリ" = "ご主人様の身だしなみを整える……。#nこれもメイドとしてすべきこと、ですよね？"
"1009503-22" = "[s] \"私も着替えるってこと……？\""
"1009503-23-ミドリ" = "大丈夫です、私を信じてください！"
"1009503-24-ミドリ" = "こんなこともあろうかと、色々お持ちしましたから！"
"1009503-25-ミドリ" = "フロックコートにシルクハット、それに杖と……"
"1009503-26-ミドリ" = "バッスルドレスに羽根つき帽子、日傘もあります！"
"1009503-27-ミドリ" = "特にアクセサリーは好みが分かれますし、モノクルや羽根扇子、#n他にもいろいろと用意してきました。"
"1009503-28-ミドリ" = "安心して、全てこのメイドにお任せください。"
"1009503-29" = "[s1] \"大きなスーツケースを持ってると思ったら……！\"\n[s2] \"それ全部、スーツケースに入ってるの？\""
"1009503-30-ミドリ" = "はい！私は先生のメイドですから！"
"1009503-31-ミドリ" = "さあ、着替えましょう。#nきちんとお手伝いしますので。"
"1009503-32-ミドリ" = "立派なご主人様にお仕えすることが、メイドの喜びなんです。"
"1009503-33-ミドリ" = "先生が素敵な服を着ている姿、私に見せてください！"
"1009503-34-ミドリ" = "メイドとしても、イラストレーターとしても……。#nこの機会、絶対に逃すことはできません！"
"1009503-35" = "[s3] \"そ、その前に確認なんだけど。\"\n[s4] \"この服、サイズは合ってる？\""
"1009503-36-ミドリ" = "ご安心ください！"
"1009503-37-ミドリ" = "ミレニアムの各部活から、技術的な協力とアドバイスを#nもらってますから。"
"1009503-38-ミドリ" = "みんな、写真を楽しみにしているとのことでした。"
"1009503-39-ミドリ" = "ですから、先生？"
"1009503-40-ミドリ" = "早く……？"
"1009503-41" = "（ミドリの説得に何とか成功したが、かなり残念そうだった……）"
"1009503-42" = "（スーツケースをロッカーに預け、ミドリをなだめながら美術館に向かう……）"
"1009503-43-ミドリ" = "展示室だけじゃなく、廊下までコンセプトに則って……。"
"1009503-44-ミドリ" = "本当にすごいです……。"
"1009503-45-ミドリ" = "先生、このドレスを見てください。#nゆとりある身幅と、くびれたウエストが対照的で……。"
"1009503-46-ミドリ" = "当時の貴婦人はこのドレスを着るために、コルセットで#nお腹を締め上げたそうです。"
"1009503-47-ミドリ" = "想像するだけで、大変そう……。"
"1009503-48-ミドリ" = "それに、お腹を締め上げるということは……。#nああいった服は、一人で着ることはできなかったはずなんです。"
"1009503-49-ミドリ" = "ちょっと調べてみたんですが……。"
"1009503-50-ミドリ" = "着替えには、お手伝いさんが3人ほど必要だったそうで……。"
"1009503-51" = "[s] \"ファッションって、何なんだろうね……。\""
"1009503-52-ミドリ" = "全てです！"
"1009503-53" = "[s] \"そこまで！？\""
"1009503-54-ミドリ" = "さ、流石にそれは大げさだったかもしれませんが……。"
"1009503-55-ミドリ" = "ですが、よく「衣食住」って言いますよね？ですからファッションは、#n世の中で思われているよりも、ずっとずっと……大切なものだと思うんです。"
"1009503-56-ミドリ" = "イラストを描いていると、そういう事をよく考えるんです。"
"1009503-57-ミドリ" = "身につける服を選ぶのは、自分を表現する手段のひとつですから。"
"1009503-58-ミドリ" = "ですから先生も、もっとファッションに気を配るべきかと！"
"1009503-59" = "[s] \"善処するね……。\""
"1009503-60-ミドリ" = "善処ではダメです！#n本当に大事なことなんですから！"
"1009503-61-ミドリ" = "こうしてはいられません。#nやはりスーツケースを取りに行って――"
"1009503-62" = "[s] \"ミドリ、落ちついて！\""
"1009503-63-ミドリ" = "と、止めないでください！"
"1009503-64-ミドリ" = "……着替えて再入場すると、またチケットを買うことになる？"
"1009503-65-ミドリ" = "そ、それは確かに……。"
"1009503-66-ミドリ" = "古典の服飾のデザインって……。"
"1009503-67-ミドリ" = "メイドの服装に似ているようで、違う部分もありますね。"
"1009503-68-ミドリ" = "この帽子とか。ドレスのスカートやリボンの形も。"
"1009503-69" = "[s] \"言われてみると確かに。\""
"1009503-70-ミドリ" = "もう少し回りましょう、先生。"
"1009503-71-ミドリ" = "何だかここにいると、インスピレーションがたくさん湧いてきそうです！"
"1009503-72" = "（ミドリの後ろについて、展示室全体を見て回った）"
"1009503-73" = "（全てを見終える頃には、日が暮れていた……）"
"1009503-74-ミドリ" = "先生、今日はありがとうございます。#nとっても参考になりました！"
"1009503-75-ミドリ" = "それに、その……。"
"1009503-76-ミドリ" = "デート、とっても楽しかったです……。"
"1009503-77" = "[ns] \"ん、なんて？\""
"1009503-78-ミドリ" = "い、いえ！なんでもありません！"
"1009503-79-ミドリ" = "そ、そんなことより早く帰りましょう！#n最後まで、私がメイドとしてお供しますから！"
"1009503-80" = "[s] \"うん、ありがとね。\""
"1009503-81-ミドリ" = "ところで、先生。"
"1009503-82-ミドリ" = "やっぱり、その……一回だけでも着てみませんか……？"
"1009503-83" = "[s] \"それは無しで。\""
"1009503-84-ミドリ" = "せんせぇ……。"
"1009503-85" = "（メイド然としたミドリと腕を組み、夕暮れの道を歩いて帰った……）"
