[translation]
"2300803-1" = "あなたのために祈りを"
"2300803-2" = "（大聖堂の中はがらんとしていた）"
"2300803-3" = "（雄大で、荘厳でありながら、清らかな雰囲気で満ちている）"
"2300803-4-？？？" = "……先生、こちらです。"
"2300803-5" = "[s1] \"……？\"\n[s2] 声が聞こえた方を向く"
"2300803-6" = "[wa:950]― ……来ていただいて[wa:1250]ありがとうございます、[wa:1150]先生。"
"2300803-7" = "― はい、[wa:1200]先生のことを[wa:700]祈っておりました。"
"2300803-8" = "[wa:1800]― このように[wa:400]静かな場所は、[wa:1350]お祈りに[wa:550]ピッタリです。"
"2300803-9" = "― 祈っているはずの[wa:700]私の心も、[wa:1750]まるで[wa:400]洗われていくようで……。"
"2300803-10" = "[wa:1950]― 先生が[wa:400]これまで[wa:400]積み上げてきた道、"
"2300803-11" = "― そして[wa:1200]これから選ばれる道……。"
"2300803-12" = "[wa:100]― そこにどうか、[wa:1600]できるだけ多くの平和と、"
"2300803-13" = "― 幸せがありますように……。"
"2300803-14" = "[wa:600]― え、[wa:1000]自分のことも[wa:750]祈らないの……[wa:1300]ですか？"
"2300803-15" = "[wa:100]― それは……[wa:1900]いえ、[wa:1600]大丈夫なんです。"
"2300803-16" = "[wa:1600]― 先生が[wa:450]幸せでしたら、[wa:1900]私も幸せですので。"
"2300803-17" = "― つまりこれは、[wa:1350]私たちのための祈り……[wa:2150]なのかもしれません。"
"2300803-18-マリー" = "もう少し早くお祈りしておくべきでしたね……このところ、どうしてもお仕事が忙しく……。"
"2300803-19-マリー" = "……いえ、言い訳は良くありませんね。"
"2300803-20-マリー" = "シスターとして、このようなことを言ってはいけません。"
"2300803-21-マリー" = "ごめんなさい、先生……。"
"2300803-22" = "[s3] \"ううん、その気持ちだけで嬉しいよ。正にシスターって感じ。\"\n[s4] \"やっぱりもう立派なシスターって感じが。\""
"2300803-23-マリー" = "も、もう……。"
"2300803-24-マリー" = "も、もう……。"
"2300803-25-マリー" = "先生はすぐそうやって……。"
"2300803-26-マリー" = "嘘は良くないんですよ、先生。"
"2300803-27-マリー" = "ふぅ、とにかくもうこれ以上悪いことが先生の元に起きないよう、お祈りを……。"
"2300803-28-マリー" = "……？"
"2300803-29-マリー" = "それならきっと大丈夫？"
"2300803-30-マリー" = "それに、嘘じゃない……？も、もう、先生は本当に……。"
"2300803-31-マリー" = "と、とにかく……ああ、良いことを思い出しました。"
"2300803-32-マリー" = "先生、もう少しこちらへ来ていただけませんか？"
"2300803-33-マリー" = "祈りの形は、一つではありません。"
"2300803-34-マリー" = "中には、こうやって……"
"2300803-35-マリー" = "一緒に、手を握る祈り方もあるのです。"
"2300803-36-マリー" = "私は個人的に、このやり方が好きでして。"
"2300803-37-マリー" = "特に先生のような……ご自分のこと以上に見守る相手が多い方には、特に良さそうだなと思うんです。"
"2300803-38-マリー" = "先生のような方はもしお祈りをされるとしても、ご自分ではなくきっと、生徒たちのために祈られるでしょう？"
"2300803-39-マリー" = "ですからこうやって、時には誰かが先生のことを捕まえて、しっかりと一緒にお祈りをしてあげないといけません。誰かのためではなく、ご自身のために。"
"2300803-40-マリー" = "よろしければ私に、させてください……いつか、シスターになる者として。"
"2300803-41-マリー" = "さあ、先生も目を閉じて……呼吸を落ち着けて……。"
"2300803-42-マリー" = "祈りましょう。もう一度、先生のために……。"
"2300803-43-マリー" = "……そして、私たちのために。"
