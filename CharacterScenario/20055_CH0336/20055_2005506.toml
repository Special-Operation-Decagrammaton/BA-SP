[translation]
"2005506-1" = "世界の救済とゲーマー"
"2005506-2" = "ゲーム開発部・部室"
"2005506-3-ユズ" = "い、いえいえ、とんでもないです。"
"2005506-4-ユズ" = "……。"
"2005506-5-ユズ" = "あ、ありがとうございます、みなさん。"
"2005506-6" = "[ns] \"ユズ？\""
"2005506-7-ユズ" = "あ……この声は……。"
"2005506-8-ユズ" = "せ、先生？いつからいらっしゃってたんですか！？"
"2005506-9-ユズ" = "うぅ……！"
"2005506-10" = "[s1] \"VRゲームをしてたんだね。\"\n[s2] \"さっきは、どんな話をしてたの？\""
"2005506-11-ユズ" = "え？あ、その……。"
"2005506-12-ユズ" = "……[ruby=NPC]ゲームの中の人たち[/ruby]に、ありがとうって言われてたんです。"
"2005506-13-ユズ" = "自分たちの世界を救ってくれて、ありがとうって。"
"2005506-14" = "[s] \"この世界を救ったんだね！\""
"2005506-15-ユズ" = "す、救っただなんて……！"
"2005506-16-ユズ" = "で、でも、久しぶりに達成感というか……誇らしい気持ちでした。"
"2005506-17-ユズ" = "わたし、ゲーム以外に得意なこともなくて、現実だと誰かを助けるなんてできないけど……。"
"2005506-18-ユズ" = "ゲームの中なら、こうして世界を救うこともできるので……。"
"2005506-19-ユズ" = "もちろん、ゲームの話ですし……。"
"2005506-20-ユズ" = "大した意味は、ないのかもしれませんけど……。"
"2005506-21" = "[s] \"でも、ゲームが現実でない理由って、ないんじゃない？\""
"2005506-22-ユズ" = "え？一体……どういう……？"
"2005506-23-ユズ" = "……わたしたちが何かを体験してる時間そのものが現実である、か。"
"2005506-24-ユズ" = "……。"
"2005506-25-ユズ" = "そうですね。たとえ、ゲームの世界が仮想だとしても――"
"2005506-26-ユズ" = "そこで感じた感情や経験、達成感は――"
"2005506-27-ユズ" = "たしかに、本物かもしれません。"
"2005506-28" = "[s3] \"これからユズたちが作っていくゲームも……。\"\n[s4] \"誰かにとって、そういう意味を持つんだよ。\""
"2005506-29-ユズ" = "誰かにとっての……そういう意味……。"
"2005506-30-ユズ" = "……。"
"2005506-31-ユズ" = "あ、あの、先生。"
"2005506-32-ユズ" = "わたしが守った世界……一緒に見てくださいますか？"
"2005506-33" = "（断る理由はひとつもない）"
"2005506-34" = "（ユズが手渡してくれたVR機器を装着し、一緒にゲームの世界へ入った）"
"2005506-35" = "[wa:3200]― [log=유즈 결전]見てください、[wa:1430]先生。[/log]"
"2005506-36" = "― [log=유즈 결전]わたしが守り抜いた[wa:1150]世界です。[/log]"
"2005506-37" = "[wa:1700]― [log=유즈 결전]……もちろん、[wa:950]分かっています。[/log]"
"2005506-38" = "― [log=유즈 결전]この光景を、[wa:820]見たのは[wa:1650]わたしだけじゃない[wa:1200]って。[/log]"
"2005506-39" = "[wa:810]― [log=유즈 결전]大会の時、[wa:2090]こんなことを[wa:1060]仰いましたよね。[/log]"
"2005506-40" = "― [log=유즈 결전]今この瞬間が、[wa:2560]ゲームが。[wa:1840]わたしたちの現実だ[wa:1910]って。[/log]"
"2005506-41" = "[wa:780]― [log=유즈 결전]だから、[wa:2330]たとえ[wa:1030]エンディングの決まった[wa:830]世界だとしても……。[/log]"
"2005506-42" = "― [log=유즈 결전]この世界の[wa:650]みんなが、[wa:1570]同じシナリオを歩むとしても……。[/log]"
"2005506-43" = "[wa:890]― [log=유즈 결전]わたしがした選択、[wa:2840]この[wa:370]感情は……。[/log]"
"2005506-44" = "― [log=유즈 결전]間違いなく、[wa:2670]本物なんです。[/log]"
"2005506-45" = "[ns] \"そういえばユズ、その服、気に入ったんだね。\""
"2005506-46-ユズ" = "え？服……？"
"2005506-47-ユズ" = "あ、ああっ……！？"
"2005506-48-ユズ" = "そ、そ、そういうわけでは……！#nこれは……！"
"2005506-49-ユズ" = "このゲームに、向いているだけで……！"
"2005506-50-ユズ" = "ほ、本当に、それだけなんです！"
"2005506-51-ユズ" = "世界を救うのに、手段は選べませんから……！"
"2005506-52" = "[ns] （満足げに微笑む）"
"2005506-53-ユズ" = "わ、笑わないでください……！"
"2005506-54" = "（その後、ユズと一緒に平和になった世界をしばらく見て回った）"
