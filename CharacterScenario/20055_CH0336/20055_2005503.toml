[translation]
"2005503-1" = "UZQueenのスランプ"
"2005503-2" = "ゲーム開発部に向かう途中"
"2005503-3" = "（ユズからそんな言葉が出るなんて）"
"2005503-4" = "（信じられない状況に、急いでミレニアムへ向かった）"
"2005503-5-ミレニアムの生徒B" = "先月リリースされたゲーム、やった？"
"2005503-6" = "[ns]（あれ、ゲームの話……）"
"2005503-7-ミレニアムの生徒A" = "新作格闘ゲーの――『シミュリオン・クエスト』のこと？"
"2005503-8-ミレニアムの生徒B" = "サイバーパンク風の近未来が舞台で、世界観の完成度がすごいよね。#nかなり細かく作り込まれてて、モーションもめちゃくちゃ滑らかだし。"
"2005503-9-ミレニアムの生徒B" = "でもさ、なんか変じゃない？"
"2005503-10-ミレニアムの生徒A" = "変？バグのこと？#nそれならこの前メーカーが告知してたけど……。"
"2005503-11-ミレニアムの生徒B" = "いや、そうじゃなくて……ランキングにUZQueenがいないじゃん。"
"2005503-12-ミレニアムの生徒B" = "――ランキング始まって、もう1週間も経つのに。"
"2005503-13" = "（UZQueen……？）"
"2005503-14-ミレニアムの生徒A" = "あ、ほんとだ！格ゲーのランキングにUZQueenがいないことなんて、今までなかったのに……！"
"2005503-15-ミレニアムの生徒B" = "UZQueenに何かあったのかな？"
"2005503-16" = "（その会話を聞いた瞬間、気がついたら歩く速度が上がっていた）"
"2005503-17" = "ゲーム開発部・部室"
"2005503-18" = "[ns] \"ユズ！大丈夫！？\""
"2005503-19-ユズ" = "ひいっ！？先生！？"
"2005503-20-ユズ" = "い、一体どうしたんですか！？"
"2005503-21-ユズ" = "なにをそんなに慌てて……。"
"2005503-22" = "[s] \"ユズ、一体何があったの？\""
"2005503-23-ユズ" = "えっ！？特になにもないですよ！？"
"2005503-24-ユズ" = "ほ、ほら、ちゃんとロッカーにも入れるようになりましたし。"
"2005503-25-ユズ" = "ま、まさか……#nさっきのモモトークを見てここまで……？"
"2005503-26-ユズ" = "ゲームが難しい、とぼやきはしましたけど……。"
"2005503-27-ユズ" = "わたし、そんなに変でしたか……？"
"2005503-28-ユズ" = "たしかに……そうですね。"
"2005503-29-ユズ" = "今までゲームを難しいと思うことなんてなかったのに……。"
"2005503-30" = "[s1] \"そのゲームなんだけど、もしかして……。\"\n[s2] \"『シミュリオン・クエスト』？\""
"2005503-31-ユズ" = "ど、どうして分かったんですか！？"
"2005503-32" = "（道中で聞いた話を伝えた）"
"2005503-33-ユズ" = "あ……な、なるほど……。"
"2005503-34-ユズ" = "その……わたし、まだ#n『シミュリオン・クエスト』はまともに触れていなくて……。"
"2005503-35-ユズ" = "その……。"
"2005503-36-ユズ" = "……ちょっと、見てみませんか？"
"2005503-37" = "（ユズが『シミュリオン・クエスト』を起動した）"
"2005503-38" = "（ゲームを始めてすぐ、ユズがこのゲームを苦手な理由が分かった気がした）"
"2005503-39" = "[ns3] \"このゲーム、実際に手足を動かして戦うタイプの……。\"\n[ns4] \"……VRゲームだったんだ！\""
"2005503-40-ユズ" = "はい。全身を使って、攻撃したり避けたりしなきゃいけなくて……。"
"2005503-41-ユズ" = "でもわたし……手を動かすとかならいいんですけど、#n走ったり全身を使うのはちょっと苦手で……。"
"2005503-42-ユズ" = "ちゃんとプレイしたかったんですけど、チュートリアルすらできなくて……。"
"2005503-43-ユズ" = "えっ？先生もやってみたいんですか？"
"2005503-44-ユズ" = "い、一応2Pでの協力モードはありますが……。"
"2005503-45-ユズ" = "何か、アイデアがあるんですか……？"
"2005503-46-ユズ" = "ど、どうしてまたこの格好に……！？"
"2005503-47-ユズ" = "ゲーム内の主人公と似てるから、プレイしやすい？#nわ、分からなくはないですけど……！"
"2005503-48" = "[s5] \"じゃあ、さっそく――\"\n[s6] \"肩に乗ろうか、ユズ。\""
"2005503-49-ユズ" = "えっ！？"
"2005503-50-ユズ" = "ひ、ひいっ！？"
"2005503-51" = "（ユズを持ち上げて、肩車をする）"
"2005503-52-ユズ" = "わっ……た、高いです……！"
"2005503-53-ユズ" = "で、でも、2P協力モードってそういうものではないような……。"
"2005503-54" = "[s7] \"ちゃんとゲームに反映されてるよ？\"\n[s8] \"見て、ユズのキャラもゲーム内で肩車されてる。\""
"2005503-55-ユズ" = "そ、それはそうですけど……！"
"2005503-56" = "[s9] \"身体を動かすのは私がやるよ、パイロットさん。\"\n[s10] \"ユズはユズの得意なことに集中して！\""
"2005503-57-ユズ" = "……！"
"2005503-58-ユズ" = "それじゃあ、わたしが索敵とブリーフィングをやるので、先生は移動と攻撃をお願いします。"
"2005503-59" = "[s] \"よし、行こうか！\""
"2005503-60" = "（そうしてユズと2人で協力プレイを始めてから――）"
"2005503-61" = "（トップランカー入りするまで、一日もかからなかった）"
"2005503-62" = "（その後……）"
"2005503-63" = "（『シミュリオン・クエスト』のネット掲示板には、肩車したままボスに挑む2人組の目撃談が、無数に寄せられるようになった）"
"2005503-64" = "（……ただ、その芸当ができたのは、UZQueenだけだったとか）"
