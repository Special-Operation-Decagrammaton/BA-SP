[translation]
"2005505-1" = "ゲーム大会"
"2005505-2" = "ゲーム開発部・部室"
"2005505-3-ユズ" = "まさか「バーチャルボス」がゲーム大会の賞品になっているなんて……。"
"2005505-4-ユズ" = "……たしかに、あの人気を考えたら賞品というのも納得です。"
"2005505-5-ユズ" = "ま、まさか先生が言ってた方法って……。"
"2005505-6-ユズ" = "大会で「バーチャルボス」を手に入れる……！？"
"2005505-7-ユズ" = "険しい道のり、ですね……。"
"2005505-8" = "[s] \"やめとく？\""
"2005505-9-ユズ" = "いえ。やらせてください、先生！#nゲームなら、わたし……！"
"2005505-10-ユズ" = "……ってそうだ。#nどのゲームの大会なんですか？"
"2005505-11-ユズ" = "『シミュリオン・クエスト』……！？#n以前、先生と一緒にやったVRゲーム……！"
"2005505-12-ユズ" = "……たしかに、それなら勝てるかもしれません。"
"2005505-13-ユズ" = "でも、まだ一人で上位に入れる自信はなくて……。"
"2005505-14" = "[s] \"だから協力プレイ部門でエントリーしておいたよ。\""
"2005505-15-ユズ" = "ええっ！？先生も一緒に出てくれるんですか？"
"2005505-16-ユズ" = "仲間をひとりで戦場に送り出すわけにはいかない……？"
"2005505-17-ユズ" = "そうですね……『シミュリオン・クエスト』は、わたしひとりじゃ予選突破も難しいですし……。"
"2005505-18-ユズ" = "……ありがとうございます、先生。いっしょに優勝、目指しましょう……！"
"2005505-19" = "[s1] \"ところでさ、ユズ。\"\n[s2] \"シミュリオン・クエストの大会には参加条件がもう一つあるみたいなんだ。\""
"2005505-20-ユズ" = "参加条件……ですか……？"
"2005505-21" = "（それからしばらくして、ゲーム大会当日）"
"2005505-22" = "ゲーム大会会場入口"
"2005505-23-ユズ" = "無理です！"
"2005505-24-ユズ" = "先生を、信じたのに……！"
"2005505-25" = "[s] \"落ち着いて、ユズ。\""
"2005505-26" = "[ns3] \"みんなゲーム内の衣装を着ているだけだよ？\"\n[ns4] \"普通のコスプレ会場だと思えば平気だって。\""
"2005505-27-ユズ" = "そ、そう言われても……普通の格好の人もいるのに……。"
"2005505-28-ユズ" = "せ、先生だっていつもの服で来てるじゃないですか！"
"2005505-29" = "[s5] \"ゲーム内に登場する市民NPCの服装だよ。\"\n[s6] \"スーツは大人の鎧だからね。\""
"2005505-30-ユズ" = "そ、それならわたしも制服がよかったです……。"
"2005505-31-ユズ" = "たしかに、この格好が一番VRゲームをやりやすいのはそうですけど……。"
"2005505-32" = "[s] \"あ、始まるみたいだよ。行こう、ユズ！\""
"2005505-33-ユズ" = "ふぇぇぇん……！！"
"2005505-34" = "（その後、試合中ずっとユズは私の背中にぴったりくっついていた）"
"2005505-35" = "ゲーム大会会場内部"
"2005505-36-大会の司会者" = "さあ！最高に盛り上がってまいりました！"
"2005505-37-大会の司会者" = "ついに決勝戦、対戦チームをステージにお呼びしましょう！"
"2005505-38-大会の司会者" = "最短でトップ入りした伝説のデュオ――"
"2005505-39-大会の司会者" = "「UZQueen＆Thrones」！盛大な拍手でお迎えください！"
"2005505-40-観客B" = "UZQueen……？いま、UZQueenって言ったよね！？"
"2005505-41-観客A" = "やっぱり来てるんだ！わぁ……すごい！オーラがある！"
"2005505-42-観客B" = "でも、あのポーズは一体……？"
"2005505-43-ユズ" = "肩車ポジションで敵を倒す2人組って……UZQueenだったの！？"
"2005505-44-ユズ" = "UZQueenのプレイを生で見られるチャンス……目に焼きつけないと！"
"2005505-45-ユズ" = "う、うぅ……先生、やっぱり人前で肩車は恥ずかしすぎます……！"
"2005505-46-ユズ" = "は、恥ずかしくてあんまり……。"
"2005505-47-ユズ" = "ゲ、ゲームに集中、できません……。"
"2005505-48" = "[s] \"ユズ。\""
"2005505-49-ユズ" = "は、はいっ！？"
"2005505-50" = "[s] \"今だけは、『シミュリオン・クエスト』の世界が現実だと思って。\""
"2005505-51-ユズ" = "で、でも……。"
"2005505-52-ユズ" = "これが現実だとしたら……#nわたしたちって、今命がけで剣を振り回してるわけで……逆に、怖いです……。"
"2005505-53-ユズ" = "没入感が大事、というのは知っていますが……。"
"2005505-54-対戦相手B" = "はぁ、優勝するにはUZQueenを倒すしかないのか……。"
"2005505-55-対戦相手A" = "まさかあの変な肩車の達人がUZQueenだったなんて……どうしような。"
"2005505-56-対戦相手A" = "肩車をしている相手の攻略法なんて、どこのサイトにも載ってなかったぞ！"
"2005505-57-対戦相手B" = "大丈夫、こういう時のために必勝法を調べてきたんだ。"
"2005505-58-対戦相手B" = "UZQueenじゃなくてThrones側――パートナーは普通のプレイヤーだから、あっちを先に倒せば勝機がある！"
"2005505-59-対戦相手A" = "よし……！"
"2005505-60-ユズ" = "せ、先生！気をつけてください！"
"2005505-61" = "[ns] \"あれ、狙われてるのは私……？\""
"2005505-62-ユズ" = "（このゲームが現実だったら……）"
"2005505-63-ユズ" = "（この衣装も、みんなの視線も全然恥ずかしくなんてない……）"
"2005505-64-ユズ" = "（今、本当に気にしなきゃいけないのは……）"
"2005505-65-ユズ" = "……危ない！"
"2005505-66-対戦相手B" = "な、何が起きた……？"
"2005505-67-対戦相手A" = "私たち二人の弱点が、突かれた……？"
"2005505-68-観客A" = "なんと！一瞬で勝負がつきました！#n「UZQueen&Thrones」の勝利です！"
"2005505-69-観客B" = "い、今の見た？Thronesが狙われた瞬間、UZQueenがものすごい速さでふたりの弱点を……！"
"2005505-70-観客A" = "速すぎて全然見えなかった……あれって現実でできる動きなの……？"
"2005505-71-ユズ" = "せ、先生。大丈夫ですか……？"
"2005505-72" = "[s] \"私は大丈夫だよ。\""
"2005505-73" = "[ns] \"今の攻撃、どうやったの？\""
"2005505-74-ユズ" = "わ、わたしにも分かりません……。"
"2005505-75-ユズ" = "先生が危ないって思ったら、手が勝手に動いちゃって……。"
"2005505-76-ユズ" = "気付いたら、相手の急所を狙っていました……。"
"2005505-77" = "[s] \"すごい集中力だったよ……。\""
"2005505-78-ユズ" = "で、でも良かったです。#nこれでやっと「バーチャルボス」が手に入りますし――"
"2005505-79-観客A" = "UZQueen、さっきの技をもう一度見せてくれませんか？"
"2005505-80-対戦相手A" = "……わ、私からもお願い！こんな技、実際にくらうの初めてで！"
"2005505-81-対戦相手A" = "私の身体で実践してもいいから――"
"2005505-82-対戦相手B" = "こっちもお願いします！その技を受けてみたい！"
"2005505-83-観客B" = "わ、私もお願いします！"
"2005505-84-観客C" = "UZQueen、私もぜひ！"
"2005505-85-ユズ" = "（な、なんだか変なお願いが殺到してる気が……）"
"2005505-86-観客A" = "お願いです、UZQueen！"
"2005505-87-観客B" = "UZQueenに殴ってもらえるなら、お金だって払いますから……！"
"2005505-88-ユズ" = "そ、それは困ります……！"
"2005505-89-ユズ" = "先生……助けてください……！"
"2005505-90-対戦相手A" = "UZQueen！UZQueen！"
"2005505-91-ユズ" = "せ、先生～！"
"2005505-92" = "（その後、囲まれて困っているユズを抱えて、なんとか会場を抜け出した……）"
