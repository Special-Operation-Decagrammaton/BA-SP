[translation]
"1010502-1" = "一口どうぞ"
"1010502-2" = "（マリーを応援するために、レッスン室へ向かった）"
"1010502-3-？？？" = "……？"
"1010502-4-？？？" = "どちら様ですか……？"
"1010502-5-マリー" = "せ、先生！？"
"1010502-6-マリー" = "こちらには何のご用で……。"
"1010502-7-マリー" = "……私の応援に？"
"1010502-8-マリー" = "もしかして、モモトークを送ったせいでしょうか。"
"1010502-9-マリー" = "……申し訳ありません。"
"1010502-10-マリー" = "先生の貴重なお時間を、わざわざ……。"
"1010502-11-マリー" = "それも、私しかいないというのに。"
"1010502-12-マリー" = "実は、先ほどまでお二人もいたのですが、#n練習が終わったら次の用事に向かわれました。"
"1010502-13-マリー" = "ですが、私はもう少し練習しておこうと思ったのです。"
"1010502-14-マリー" = "ご安心ください！#n歌も振り付けも、すでに覚えてはいます。"
"1010502-15-マリー" = "ただ、少しでも良いパフォーマンスを皆さんに……。"
"1010502-16-マリー" = "……そ、それより！"
"1010502-17-マリー" = "気づけば、お昼の時間になっていましたね。"
"1010502-18-マリー" = "先生も、まだ食べていないようでしたら……。"
"1010502-19-マリー" = "私のお弁当を一緒に食べませんか？"
"1010502-20-マリー" = "二人で食べるには、少ないかもしれませんが……。"
"1010502-21" = "[s1] \"私は大丈夫だよ。\"\n[s2] \"練習を続けるなら、ちゃんと食べないとね。\""
"1010502-22-マリー" = "……うーん。"
"1010502-23-マリー" = "先生の前で、私だけ食べるわけには……。"
"1010502-24-マリー" = "お昼は練習が終わってからにしようと思います。"
"1010502-25-マリー" = "えっ……。"
"1010502-26-マリー" = "もう帰ってしまうんですか！？"
"1010502-27" = "[s3] \"私がいると、食べづらいよね。\"\n[s4] \"マリーの邪魔になってるよね。\""
"1010502-28-マリー" = "そ、そんなことはありません。"
"1010502-29-マリー" = "私が色々と気にしすぎているだけで……。"
"1010502-30-マリー" = "……分かりました、先生。#n帰ったら、きちんとお食事を取ってくださいね。"
"1010502-31-マリー" = "い、いただきます。"
"1010502-32" = "[ns5] レッスン室の床を拭く。\n[ns6] レッスン室の荷物を片付ける。"
"1010502-33-マリー" = "……急に何を？"
"1010502-34-マリー" = "掃除や片付けなら、最後に自分で行いますよ！？"
"1010502-35-マリー" = "わざわざ先生にやってもらうのは……。"
"1010502-36-マリー" = "……えっ？"
"1010502-37-マリー" = "少しでも力になりたい、と……？"
"1010502-38-マリー" = "たしかに、食事中の顔をずっと見られているのは恥ずかしいですし……。"
"1010502-39-マリー" = "そのお気持ちは、もちろん嬉しいです。"
"1010502-40-マリー" = "ただ、これでは先生に気を遣っていただいてばかりのような……。"
"1010502-41" = "[s7] \"マリーのために何かしたいんだ。\"\n[s8] \"今は練習に集中してほしいから。\""
"1010502-42-マリー" = "そう言われましても……。"
"1010502-43-マリー" = "……。"
"1010502-44" = "[ns9] \"……マリー？\"\n[ns10] \"余計なお世話だったかな……。\""
"1010502-45-マリー" = "……先生。"
"1010502-46-マリー" = "ひとつ、私のわがままを聞いていただけますか？"
"1010502-47-マリー" = "練習に集中するためのお願いだと思ってください。"
"1010502-48-マリー" = "……こほん。"
"1010502-49-マリー" = "それでは、先生。"
"1010502-50-マリー" = "こちらを……。"
"1010502-51" = "[ns11] \"これはマリーのじゃ……。\"\n[ns12] \"本当に良いの？ \""
"1010502-52-マリー" = "……この卵焼きは、先生の分です。"
"1010502-53-マリー" = "おかずを一つ分けたくらいでは、変わりませんから。"
"1010502-54-マリー" = "それに、私だけ食事をしているのが気になってしまいまして。"
"1010502-55-マリー" = "なので、練習に集中するためにも……。"
"1010502-56-マリー" = "おひとつ、召し上がってください。"
"1010502-57-マリー" = "……先生。"
"1010502-58-マリー" = "ダメ、でしょうか……？"
"1010502-59-マリー" = "……。"
"1010502-60-マリー" = "……お口を開けてください、先生。"
"1010502-61-マリー" = "あ、あーん……。"
