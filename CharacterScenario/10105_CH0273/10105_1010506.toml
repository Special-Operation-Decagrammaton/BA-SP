[translation]
"1010506-1" = "踏み出す勇気"
"1010506-2" = "（仕事を終えてから、トリニティの聖堂を訪れた）"
"1010506-3" = "[ns1] \"マリー、お待たせ。\"\n[ns2] \"入っても良いのかな……？\""
"1010506-4-？？？" = "……先生。"
"1010506-5-？？？" = "お忙しいところ、ありがとうございます。"
"1010506-6-マリー" = "急にアイドルの衣装でお迎えして……。"
"1010506-7-マリー" = "……驚かせてしまったでしょうか？"
"1010506-8-マリー" = "ですが……。"
"1010506-9-マリー" = "ステージに立つ以上、この格好でいなくてはいけませんから。"
"1010506-10-マリー" = "……あっ、心配なさらないでください。"
"1010506-11-マリー" = "ほかの方は、いらっしゃいませんよ。"
"1010506-12-マリー" = "ここにいるのは、私たちだけです。"
"1010506-13-マリー" = "……先生。"
"1010506-14-マリー" = "いつも気にかけてくださる優しさに、私は……。"
"1010506-15-マリー" = "……よろしければ、受け取っていただけませんか？"
"1010506-16-マリー" = "こうして、今の私があるのは……。"
"1010506-17-マリー" = "先生のおかげですから。"
"1010506-18-マリー" = "……私はただのシスターに過ぎません。"
"1010506-19-マリー" = "なので、お返しといっても祈りを捧げるくらいしかできませんでした。"
"1010506-20-マリー" = "……今までは。"
"1010506-21-マリー" = "アイドルでいられる期間は、一時的なものだと分かっています。"
"1010506-22-マリー" = "ですから、皆さんに協力していただいて、この場を設けたのです。"
"1010506-23-マリー" = "私がアイドルとして歌を歌うことが、人のための行為になり得るのでしたら……"
"1010506-24-マリー" = "それならば……。"
"1010506-25-マリー" = "……お祈り以外のお返しが、先生にできると思いまして。"
"1010506-26" = "[s3] \"それで、今日はステージを……。\"\n[s4] \"シークレットライブだね。\""
"1010506-27-マリー" = "……ふふっ。"
"1010506-28-マリー" = "はい、その通りです。"
"1010506-29-マリー" = "この気持ちをどうやって伝えようか悩みましたが……。"
"1010506-30-マリー" = "私なりに、精一杯の感謝を込めて歌を届けようと思います。"
"1010506-31-マリー" = "お話はここまでにして……。"
"1010506-32-マリー" = "先生のためだけに、歌わせてください。"
"1010506-33-マリー" = "シスターのマリーではなく……。"
"1010506-34-マリー" = "……アイドルのマリーとして。"
"1010506-35" = "（その後、二人きりの聖堂でマリーのライブを楽しんだ）"
"1010506-36" = "（独り占めするのがもったいないくらい、最高のステージだった）"
"1010506-37" = "（ライブが終わってから、マリーを部屋まで送ることにした）"
"1010506-38-マリー" = "わ、わざわざ送っていただく必要は……。"
"1010506-39-マリー" = "先生も早く帰って、お休みになってください。"
"1010506-40-マリー" = "私は大丈夫ですから。"
"1010506-41-マリー" = "いつもの道ですし、心配いりませんよ。"
"1010506-42-マリー" = "それに、そこまで気を遣っていただいては……。"
"1010506-43-マリー" = "先生にとって、生徒を見送るのは当たり前かもしれませんが……。"
"1010506-44-マリー" = "……あっ。"
"1010506-45-マリー" = "そう、ですね……。"
"1010506-46-マリー" = "……ふふっ。"
"1010506-47" = "[s5] \"マリー？\"\n[s6] \"どうしたの？\""
"1010506-48-マリー" = "ごめんなさい、つい···…。"
"1010506-49-マリー" = "先生のお気持ちが、少し分かった気がします。"
"1010506-50-マリー" = "私が先生のことを考えているように、#n先生は私のことを考えてくださっているんですよね。"
"1010506-51-マリー" = "……うっかりしていました。"
"1010506-52-マリー" = "……。"
"1010506-53-マリー" = "……ですが、気づけて良かったです。"
"1010506-54-マリー" = "今日は勇気を出して正解でした。"
"1010506-55-マリー" = "先生には、いつも教わってばかりですね。"
"1010506-56-マリー" = "アイドルとして過ごした時間は、とても貴重な思い出になりました。"
"1010506-57-マリー" = "私なりに、最後までやりきれたと思います。"
"1010506-58-マリー" = "明日からは、またシスターとして皆さんのお役に立てるよう頑張りますね。"
"1010506-59" = "[s7] \"マリーはえらいね。\"\n[s8] \"お疲れ様、マリー。\""
"1010506-60-マリー" = "ふふっ。"
"1010506-61-マリー" = "あらためて……本当にありがとうございました、先生。"
"1010506-62-マリー" = "それから……。"
"1010506-63-マリー" = "……いつもの私も、お願いします。"
