[translation]
"1010503-1" = "マリー親衛隊"
"1010503-2" = "（マリーの話が気になり、トリニティへ向かった）"
"1010503-3-？？？" = "先生……？"
"1010503-4" = "[s1] \"……マリー？\"\n[s2] 声がしたほうに振り向く。"
"1010503-5" = "[ns3] \"···…マリー！？\"\n[ns4] \"後ろの人は……？\""
"1010503-6-ペロロの着ぐるみ" = "えっと、私もお名前は知らないのですが……。"
"1010503-7-ペロロの着ぐるみ" = "よく応援に来てくださる方なんです。"
"1010503-8-ペロロの着ぐるみ" = "ただ、なぜかプラカードを使った筆談しかされず……。"
"1010503-9-ペロロの着ぐるみ" = "「どちら様でしょう？」"
"1010503-10" = "[s5] \"私はシャーレの先生です。\"\n[s6] \"マリーの応援に来ました。\""
"1010503-11-ペロロの着ぐるみ" = "「理解しました」"
"1010503-12-ペロロの着ぐるみ" = "「応援お願いいたします」"
"1010503-13-ペロロの着ぐるみ" = "「ここはお任せしました」"
"1010503-14-ペロロの着ぐるみ" = "「応援しております！」"
"1010503-15-マリー" = "あっ、行ってしまいましたね。"
"1010503-16-マリー" = "……悪い人ではないようなので、心配はいりませんよ。"
"1010503-17-マリー" = "サクラコ様とミネ団長も、ご存知ですから。"
"1010503-18-マリー" = "と言いますか、#nどうやらサクラコ様の指示で私の護衛をしているのだとか……。"
"1010503-19-マリー" = "もしかしたら、シスターフッドの方なのかもしれませんね。"
"1010503-20" = "[s7] \"……お疲れ様、マリー。\"\n[s8] \"何となく分かったよ……。\""
"1010503-21-マリー" = "大丈夫だと申し上げたのですが、皆さん心配性で。"
"1010503-22-マリー" = "何も、ここまで過保護に扱われずとも……。"
"1010503-23-マリー" = "それより先生、今日はどうされました？"
"1010503-24-マリー" = "……えっ？"
"1010503-25-マリー" = "私のことが心配で……？"
"1010503-26-マリー" = "……。"
"1010503-27" = "[s9] \"ご、ごめん……。\"\n[s10] \"つい気になっちゃって。\""
"1010503-28-マリー" = "……ふぅ。"
"1010503-29-マリー" = "たしかに、私は至らない点も多いかもしれませんが……。"
"1010503-30-マリー" = "そんなに頼りないのでしょうか……？"
"1010503-31-マリー" = "……そうではない、と？"
"1010503-32-マリー" = "ですが……。"
"1010503-33" = "[s11] \"マリーの人望じゃないかな。\"\n[s12] \"マリーのことが大事だからだよ。\""
"1010503-34-マリー" = "先生……。"
"1010503-35-マリー" = "……そのお気持ちは嬉しいのですが、#nやはり私には頼りがいがないのでしょうね。"
"1010503-36-マリー" = "あっ、そろそろ時間が……。"
"1010503-37-マリー" = "……いえ、リハーサルは先ほど無事に終了しました。"
"1010503-38-マリー" = "お二人は、先にお帰りになられましたが……。"
"1010503-39-マリー" = "その、顔合わせと言えば良いのでしょうか？"
"1010503-40-マリー" = "聖堂をよく訪れてくださる方々に、お話の機会が欲しいと言われまして。"
"1010503-41-マリー" = "少し恥ずかしいのですが……アイドル衣装を見てみたい、と。"
"1010503-42" = "[s13] \"ファンミーティングかな？\"\n[s14] \"マリーはみんなのアイドルだもんね。\""
"1010503-43-マリー" = "か、からかわないでください、先生！"
"1010503-44-マリー" = "……日頃お世話になっている方々に、ご挨拶をするだけです。"
"1010503-45-マリー" = "それに、そういうのはお二人のほうが……。"
"1010503-46-マリー" = "……あれ。"
"1010503-47-マリー" = "たしか、着ぐるみの方が同行してくださると仰っていたような……。"
"1010503-48" = "[s15] \"それじゃあ、私が一緒に行くよ。\"\n[s16] \"私に任せてくれたんじゃないかな？\""
"1010503-49-マリー" = "せ、先生が！？"
"1010503-50-マリー" = "えっと……。"
"1010503-51-マリー" = "それは、つまり……。"
"1010503-52-マリー" = "……先生が私をエスコートしてくださる、と。"
"1010503-53-マリー" = "ほ、本当に良いのでしょうか……。"
"1010503-54-マリー" = "……ふぅ。"
"1010503-55-マリー" = "お、お願いいたします……先生。"
"1010503-56" = "(その後、マリーを「エスコート」しながら移動した)"
"1010503-57" = "（あまりの人の多さに、マリーは驚いた）"
