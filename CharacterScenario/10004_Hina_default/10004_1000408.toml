[translation]
"1000408-1" = "どこか神秘的な夜"
"1000408-2" = "ゲヘナ学園・風紀委員会専用校舎"
"1000408-3" = "（休日の深夜なこともあって、校舎周辺には誰もいない）"
"1000408-4" = "（風紀委員会の部屋だけ、電気がついていた）"
"1000408-5" = "風紀委員会・執務室前"
"1000408-6" = "（コンコン）"
"1000408-7" = "（……）"
"1000408-8" = "（反応がない）"
"1000408-9" = "（コンコンコン）"
"1000408-10-ヒナ" = "――――――――――。"
"1000408-11" = "[s] 中に入る。"
"1000408-12-ヒナ" = "え……？せ、先生？"
"1000408-13" = "[s] \"手伝いに来たよ。\""
"1000408-14-ヒナ" = "て、手伝い？私の仕事の……？"
"1000408-15-ヒナ" = "この時間に？"
"1000408-16-ヒナ" = "……来てくれたのはありがたいけど、この仕事は私にしかできないことだから……。先生が手伝える仕事はないと思う……。"
"1000408-17" = "[s] \"じゃあ、ただここにいる。\""
"1000408-18-ヒナ" = "……。"
"1000408-19-ヒナ" = "……それぐらいなら、いいけど。"
"1000408-20" = "（横に座って、ヒナが作業してるところを見守ることにした）"
"1000408-21" = "（カリカリ――）"
"1000408-22-ヒナ" = "……。"
"1000408-23" = "（カリカリカリカリ――）"
"1000408-24-ヒナ" = "…………。"
"1000408-25" = "（カリカリカリカリ――）"
"1000408-26-ヒナ" = "……やっぱりちょっと気になる。"
"1000408-27-ヒナ" = "先生が横でじっと見てると、あまり集中できない……。"
"1000408-28-ヒナ" = "……。"
"1000408-29-ヒナ" = "というか、なんでこんなに暑いんだろう……。"
"1000408-30" = "[s1] \"顔が赤いよ。\"\n[s2] \"熱でもあるの？\""
"1000408-31-ヒナ" = "ま、待って！？何をっ……！？"
"1000408-32-ヒナ" = "ま、待って！？何をっ……！？"
"1000408-33" = "[s] おでこに手を当てる。"
"1000408-34-ヒナ" = "あ、あぅっ……！"
"1000408-35-ヒナ" = "……。"
"1000408-36-ヒナ" = "………。"
"1000408-37" = "[s3] \"おでこが熱々だよ。\"\n[s4] \"ほっぺが熱々だよ。\""
"1000408-38-ヒナ" = "し、仕方ないでしょう。ここ何日か寝てないんだし。"
"1000408-39-ヒナ" = "し、仕方ないでしょう。ここ何日か寝てないんだし。"
"1000408-40" = "[s] \"眠いと体が熱くなるの？\""
"1000408-41-ヒナ" = "……生理現象なの！眠いと体温が高くなるの！"
"1000408-42" = "[s5] \"なでなで。\"\n[s6] \"子供みたいで可愛い。\" "
"1000408-43-ヒナ" = "……。"
"1000408-44-ヒナ" = "……その……や、やめて……。"
"1000408-45-ヒナ" = "……。"
"1000408-46-ヒナ" = "やめて！！"
"1000408-47-ヒナ" = "……。"
"1000408-48-ヒナ" = "……今は、仕事中、だから。"
"1000408-49-ヒナ" = "そういう風に撫でられると、なんだかホッとして……そのまま眠っちゃいそうで……。"
"1000408-50" = "[s] \"ごめん。\""
"1000408-51-ヒナ" = "……いや。謝るようなことじゃ……。"
"1000408-52-ヒナ" = "……。"
"1000408-53-ヒナ" = "……ふふっ。"
"1000408-54-ヒナ" = "考えてみれば……どこか神秘的な夜ね。"
"1000408-55-ヒナ" = "こんな時間に、執務室で先生と二人っきりなんて。"
"1000408-56-ヒナ" = "このまま倒れて寝てしまっても……それもいいかもしれない。"
"1000408-57-ヒナ" = "ふふ……うん、それで……悪くはなさそう。"
"1000408-58-ヒナ" = "眠くて……ホッとする……。"
"1000408-59-ヒナ" = "先生……。"
"1000408-60" = "（パタン――）"
"1000408-61" = "（ヒナがそのまま後ろに崩れてしまったので、窓辺に横たえさせた）"
"1000408-62" = "― ……。"
"1000408-63" = "[wa:1000]― そんなにじっと見られたら……[wa:2500]いくら私でも恥ずかしい。"
"1000408-64" = "[wa:500]― 不思議だね。[wa:2800]先生と一緒にいると[wa:2700]なんだか安心する。"
"1000408-65" = "[wa:1000]― 実は……。[wa:2000]先生のそういう顔が好き。"
"1000408-66" = "― ……。"
"1000408-67" = "― はあ……。[wa:3000]何も考えたくない。"
"1000408-68" = "― ……。"
"1000408-69" = "（ヒナはそのまま、すっと眠ってしまった）"
"1000408-70" = "（ヒナの身体にコートをかけて、そっと部屋を出た）"
