[translation]
"1000403-1" = "堂々たる理由"
"1000403-2" = "ゲヘナ外郭・スラム街"
"1000403-3-ヒナ" = "や、先生。"
"1000403-4" = "[s] \"ここは……。\""
"1000403-5-ヒナ" = "ああ、この辺りは、この前の風紀活動の影響で、生徒たちの出入りが封鎖された区域。"
"1000403-6-ヒナ" = "元々危ない所だったけど、一度全部ひっくり返したからしばらくは安全のはず。"
"1000403-7-ヒナ" = "私に気づく奴らもいないだろうし。"
"1000403-8-ヒナ" = "だから、安心して先生に会える。"
"1000403-9" = "[s] \"そこまで周りを気にしなくてもいいんじゃないか？\""
"1000403-10-ヒナ" = "……。"
"1000403-11-ヒナ" = "仕方ない、これは先生のためだから。"
"1000403-12-ヒナ" = "知ってると思うけど私は敵が多い。学園の中でも、外でも。"
"1000403-13-ヒナ" = "いつどこでも狙われてると言っても過言じゃない。"
"1000403-14-ヒナ" = "だからそんな私が、特別に会ってる人がいるって知られたら……その人が危ない目に合うかもしれない。"
"1000403-15" = "[s1] \"じゃあ直接会わずに、オンラインで会うのはどう？\"\n[s2] \"メールやメッセージでも仕事はできるよ。\""
"1000403-16-ヒナ" = "……。"
"1000403-17-ヒナ" = "……それは、そうだけど……。"
"1000403-18-ヒナ" = "えっと……"
"1000403-19-ヒナ" = "……。"
"1000403-20" = "[s] \"……でも、顔を合わせてしないといけない仕事もあるよね。\""
"1000403-21-ヒナ" = "……。"
"1000403-22-ヒナ" = "……なんだか、からかわれてる気がするけど。"
"1000403-23-ヒナ" = "それはそう、仕事には人と直接会わないとできないものもある。"
"1000403-24-ヒナ" = "つまりこれもその一種、ということ……！"
"1000403-25-ヒナ" = "あくまでも仕事のために会ってるだけ！何の罪も犯してない！"
"1000403-26" = "[s3] \"でも、深夜に二人っきりでいるのを見られたら……。\"\n[s4] \"……もしかして、色々と想像されて困るかも？\""
"1000403-27-ヒナ" = "……？そう？よく分からないけど……。"
"1000403-28-ヒナ" = "……？そう？よく分からないけど……。"
"1000403-29-ヒナ" = "……ただ、深夜にこうして二人で会ってるだけで。"
"1000403-30-ヒナ" = "それで、色々と想像……い……色々……。"
"1000403-31-ヒナ" = "えっと……それって、その……。"
"1000403-32-ヒナ" = "……っ！？"
"1000403-33" = "（とある結論に至ったようだ）"
"1000403-34-ヒナ" = "な、な、何を言ってるの！？わ、私が先生と……！？"
"1000403-35-ヒナ" = "わ、私がそんなハレンチなことをするわけない！"
"1000403-36-ヒナ" = "そんな誤解をするやつらは今すぐに……。"
"1000403-37-ヒナ" = "……。"
"1000403-38-ヒナ" = "そういうゴシップが好きなやつらはどこにでもいる、仕方ない。"
"1000403-39-ヒナ" = "……でも考えてみたら、深夜に先生に会うのはすごく危ないことかもしれない。"
"1000403-40-ヒナ" = "逆に白昼堂々会った方が、安全かも。"
"1000403-41-ヒナ" = "でも日中は……仕事が立て込んでて……。"
"1000403-42-ヒナ" = "……。"
"1000403-43-ヒナ" = "私は、いつ先生に会えばいい？"
"1000403-44" = "（ヒナはじっと考え込んでしまった）"
