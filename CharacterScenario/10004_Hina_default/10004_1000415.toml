[translation]
"1000415-1" = "左腕にのしかかる[ruby=責任]腕章[/ruby]"
"1000415-2" = "（こうして、急いでヒナの部屋にやって来た）"
"1000415-3" = "[ns] \"ヒナ、お待たせ。\""
"1000415-4-ヒナ" = "あ、うん。入って、先生。"
"1000415-5" = "[s] \"おじゃまします。\""
"1000415-6-ヒナ" = "ふふっ……思ったより早かったね、先生。"
"1000415-7-ヒナ" = "……すごい汗だけど、大丈夫？"
"1000415-8-ヒナ" = "もしかして、私の部屋に来る途中で何かあった……？"
"1000415-9" = "[ns1] \"ヒナに会えるのが楽しみすぎて、\"\n[ns2] \"走って来ただけだよ。\""
"1000415-10" = "[ns3] \"ヒナこそ大丈夫？\"\n[ns4] \"クマがすごいよ！？\""
"1000415-11-ヒナ" = "あ、これは……。"
"1000415-12-ヒナ" = "昨日、徹夜で風紀委員会の仕事をしてて。"
"1000415-13-ヒナ" = "でも、そのおかげでこうして休みが取れたの。"
"1000415-14" = "[s] \"疲れてるのに遊びに来て大丈夫だった……？\""
"1000415-15-ヒナ" = "その……。"
"1000415-16-ヒナ" = "む、むしろ、疲れてるからこそ……。"
"1000415-17-ヒナ" = "先生に、会いたかったの。"
"1000415-18-ヒナ" = "まさか、会えるとは思ってなかったけど……。"
"1000415-19-ヒナ" = "私のわがままに付き合ってくれて……。"
"1000415-20-ヒナ" = "……ありがとう、先生。"
"1000415-21" = "[s] \"ううん、私もヒナに会いたかったから。\""
"1000415-22-ヒナ" = "ほ、本当？"
"1000415-23-ヒナ" = "……そう、なんだ。ふふっ。"
"1000415-24-ヒナ" = "……うーん、今さらだけど。"
"1000415-25-ヒナ" = "今日の私、すごくやつれてるわね。"
"1000415-26-ヒナ" = "こんな顔を先生に見られるのは……。"
"1000415-27-ヒナ" = "なんと言うか……。"
"1000415-28-ヒナ" = "ちょっと……恥ずかしい、かも。"
"1000415-29" = "[s5] \"ヒナはいつでも可愛いよ！\"\n[s6] \"大事なのは、休日をどう過ごすかだよ。\""
"1000415-30-ヒナ" = "……えっ！？"
"1000415-31" = "[ns] \"最高の休日にしよう、ヒナ！\""
"1000415-32-ヒナ" = "……うん。"
"1000415-33-ヒナ" = "あ……ご、ごめん先生。"
"1000415-34-ヒナ" = "朝ご飯、食べ忘れちゃってたわ。"
"1000415-35" = "[s] \"まずは何か食べようか。\""
"1000415-36-ヒナ" = "そうね……。"
"1000415-37-ヒナ" = "じゃあ、出かける準備を……。"
"1000415-38" = "[s] \"却下します！\""
"1000415-39-ヒナ" = "……食べに行かないの？"
"1000415-40" = "[s] \"今日はお家でゆっくり過ごします！\""
"1000415-41-ヒナ" = "たしかに、外に出てトラブルに巻き込まれたら、#nせっかくのお休みが台無しだけど……。"
"1000415-42-ヒナ" = "でも、どうすれば……。"
"1000415-43-ヒナ" = "家にちゃんとした食べ物なんて、ないのだけど。"
"1000415-44" = "[s] \"ヒナは……。\""
"1000415-45" = "[ns] \"カップ麺、好き？\""
"1000415-46-ヒナ" = "カップ麺……？"
"1000415-47" = "[ns] \"よし、3分待とっか。\""
"1000415-48-ヒナ" = "本当にカップ麺で済ませちゃって良いの？"
"1000415-49-ヒナ" = "先生と一緒に食べるなら、#nもっとちゃんとした食事を……。"
"1000415-50" = "[s7] \"私はヒナと一緒に食べられたら、\"\n[s8] \"それで良いんだよ。\""
"1000415-51" = "[ns9] \"あっ。むしろごめん、\"\n[ns10] \"カップ麺で……。\""
"1000415-52-ヒナ" = "あ、いや！#nそれは大丈夫。"
"1000415-53-ヒナ" = "……カップ麺も、嫌いじゃないから。"
"1000415-54-ヒナ" = "ただ……そうね。#n忙しい時は、たまに食べるけど……。"
"1000415-55-ヒナ" = "ただの栄養補給としか思ったことないわ。"
"1000415-56" = "[s11] \"手軽に食べられるものだからね。\"\n[s12] \"むしろ、よく食べてるって言われたら困ったよ。\""
"1000415-57" = "[ns] \"どんなに仕事が忙しくても、ちゃんと栄養は摂ってね。\""
"1000415-58-ヒナ" = "……ふふっ。"
"1000415-59-ヒナ" = "あなたがそれを言うの？"
"1000415-60-ヒナ" = "先生こそ、ちゃんと栄養摂れてる？"
"1000415-61" = "[s] \"……が、頑張ります。\""
"1000415-62-ヒナ" = "あらためて考えてみれば……。"
"1000415-63-ヒナ" = "こうやって、私の部屋で……。"
"1000415-64-ヒナ" = "カップ麺が出来上がるのを待つなんて……。"
"1000415-65-ヒナ" = "……何だか不思議な気分。"
"1000415-66" = "[ns] \"できたよ、食べよっか！\""
"1000415-67-ヒナ" = "えっ！？#nう、うん。いただきます。"
"1000415-68" = "[ns] \"どうかな？\""
"1000415-69-ヒナ" = "……美味しい。"
"1000415-70" = "（その後もヒナと一緒に、色々な休日のイベントに挑戦した）"
"1000415-71-ヒナ" = "……一緒に座ってテレビを見るの？"
"1000415-72-ヒナ" = "あえて何でもない番組を見ることで、"
"1000415-73-ヒナ" = "リフレッシュになるのね。"
"1000415-74-ヒナ" = "うーん、よく分からないけど。"
"1000415-75-ヒナ" = "先生がそう言うなら、やってみる。"
"1000415-76" = "（二人で顔も名前も知らない芸人のコントを見たり……）"
"1000415-77" = "[ns] \"ヒナ、次はトランプタワーに挑戦してみよう！\""
"1000415-78-ヒナ" = "い、いきなり？"
"1000415-79-ヒナ" = "こういう単純作業こそ、逆に精神的な疲労を軽減できる、って……？"
"1000415-80-ヒナ" = "わ、分かったわ。#n自信はないけど……。"
"1000415-81" = "（何度も失敗したが、お互いに笑顔でトランプで遊んだ）"
"1000415-82" = "[ns] \"ゲヘナからは簡単に抜け出せないよ！\""
"1000415-83" = "[ns] \"覚悟して！\""
"1000415-84-ヒナ" = "先生に自治区を占領された以上、#nこのままじゃ通行料を払い続けることに……。"
"1000415-85-ヒナ" = "どうすれば、この局面を……。"
"1000415-86-ヒナ" = "……！"
"1000415-87-ヒナ" = "「無人島」を狙えば……！"
"1000415-88" = "（キヴォトス各地をサイコロで回りながら、不動産を買い集めるボードゲームで遊んだり……）"
"1000415-89-ヒナ" = "あっ。"
"1000415-90-ヒナ" = "さ、さっきの攻撃でHPが半分も……！"
"1000415-91" = "[s13] \"ヒナ、諦めないで！\"\n[s14] \"まだエリクサーがあるよ！\""
"1000415-92-ヒナ" = "ここでエリクサーを飲めば……。"
"1000415-93-ヒナ" = "ボスに魔法で大ダメージを与えられる、けど。"
"1000415-94-ヒナ" = "このあと、もっと強力なボスが現れたら……。"
"1000415-95-ヒナ" = "使うべきか、温存するべきか……。"
"1000415-96-ヒナ" = "決めた、ここでは温存する！"
"1000415-97" = "[s] \"その気持ちは分かるけど！\""
"1000415-98" = "（その後も、積んでいたゲームで遊んだり）"
"1000415-99" = "（ヒナとお休みを満喫した）"
"1000415-100" = "（窓の外を見ると、気付けば日が暮れていた）"
"1000415-101-ヒナ" = "……ふう。"
"1000415-102-ヒナ" = "とっても楽しかったわ。"
"1000415-103-ヒナ" = "ありがとう、先生。"
"1000415-104" = "[s] \"私も楽しかったよ、ヒナ。\""
"1000415-105" = "[ns15] \"ヒナの意外な一面を\"\n[ns16] \"見られて良かったよ。\""
"1000415-106-ヒナ" = "意外な一面……？"
"1000415-107" = "[s17] \"普段のヒナと違って……。\"\n[s18] \"ゲーム中は、ちょっとムキになってたから意外で。\""
"1000415-108-ヒナ" = "え……？"
"1000415-109-ヒナ" = "もしかして、変な顔してた……？"
"1000415-110-ヒナ" = "せ、先生……？"
"1000415-111" = "[s] \"あはは、冗談だよ。\""
"1000415-112-ヒナ" = "……はぁ、あなたって人は本当に。"
"1000415-113" = "[s] \"風紀委員会の仕事、大変だよね？\""
"1000415-114-ヒナ" = "……大変じゃないと言ったら、嘘になるわね。"
"1000415-115-ヒナ" = "今となっては当たり前の存在だけど……。"
"1000415-116-ヒナ" = "この腕章が持つ責任の重さを考えなかった日はない。"
"1000415-117-ヒナ" = "逃げたくなる日もあるし、辞めたくなる日もある。"
"1000415-118-ヒナ" = "もう無理だって、先生に甘えたくなる日もあったけど。"
"1000415-119-ヒナ" = "……今日みたいに、ね。"
"1000415-120-ヒナ" = "よくここまでやって来られたなって、自分でも不思議。"
"1000415-121-ヒナ" = "だけど、私に期待してくれている人がいる限り、頑張りたいの。"
"1000415-122-ヒナ" = "……諦めずに、最後まで。"
"1000415-123-ヒナ" = "たとえ、どんなにつらくても、苦しくても。"
"1000415-124" = "[ns] \"すごいね、ヒナは。\""
"1000415-125-ヒナ" = "そう、かな……。"
"1000415-126-ヒナ" = "同じ状況になったら、誰だって頑張ると思うし……。"
"1000415-127-ヒナ" = "そんなに褒められることでは……。"
"1000415-128" = "[s19] \"だとしても、\"\n[s20] \"ヒナの頑張りは本物だよ。\""
"1000415-129" = "[ns21] \"いつまでもちゃんと見守ってるから安心して。\"\n[ns22] \"私はヒナの先生だからね。\""
"1000415-130-ヒナ" = "……うん。"
"1000415-131-ヒナ" = "もしもし。"
"1000415-132-風紀委員A" = "い、委員長！申し訳ありません！"
"1000415-133-風紀委員A" = "お休みだとは承知しておりますが……。"
"1000415-134-風紀委員A" = "現在、ゲヘナ北地区でトラブルが……！"
"1000415-135-風紀委員B" = "温泉開発部とヘルメット団が全面戦争を！？"
"1000415-136" = "入浴券の転売が原因……！？"
"1000415-137-ヒナ" = "……分かったわ。"
"1000415-138" = "はあ……。"
"1000415-139-ヒナ" = "先生、残念だけど仕事みたい。"
"1000415-140" = "[s] \"うん……大変だね。\""
"1000415-141-ヒナ" = "先生のおかげでリフレッシュできたから、大丈夫。"
"1000415-142-ヒナ" = "じゃあ……。"
"1000415-143-ヒナ" = "――行ってきます、先生。"
"1000415-144" = "[s] \"行ってらっしゃい。ヒナ。\""
