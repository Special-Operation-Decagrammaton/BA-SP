[translation]
"1000406-1" = "暖かい陽射し"
"1000406-2" = "ゲヘナ近郊・川沿いの道"
"1000406-3-ヒナ" = "……あ、先生。"
"1000406-4" = "[s1] \"……大丈夫？体調悪い？\"\n[s2] \"なんか、雰囲気が……？\""
"1000406-5-ヒナ" = "……ん？"
"1000406-6-ヒナ" = "……ん？"
"1000406-7-ヒナ" = "……ああ、えっと。"
"1000406-8-ヒナ" = "……ごめん。昨日から夜通しで作業してたから、寝られてなくて……。"
"1000406-9-ヒナ" = "多分、目にクマが……シャワーも浴びてないし、髪もボサボサだし……。"
"1000406-10-ヒナ" = "先生が、急に呼び出すから……。"
"1000406-11" = "[s3] 枯れてしまったようなヒナに休憩を勧める。\n[s4] 一緒に光合成しようと勧める。"
"1000406-12-ヒナ" = "ベンチ……？ああ、うん。"
"1000406-13-ヒナ" = "光合成……？先生、私たちは植物と違って……"
"1000406-14-ヒナ" = "まあ、せっかくの天気だし……。"
"1000406-15-ヒナ" = "（スッ）"
"1000406-16" = "（ヒナとベンチに並んで座った）"
"1000406-17-ヒナ" = "……。"
"1000406-18-ヒナ" = "……えっと。"
"1000406-19-ヒナ" = "……………。"
"1000406-20-ヒナ" = "………………………。"
"1000406-21-ヒナ" = "……これ、何か違う気がする。"
"1000406-22" = "[s5] \"ん？そう？\"\n[s6] \"じゃあ……。\""
"1000406-23-ヒナ" = "……。"
"1000406-24-ヒナ" = "……。"
"1000406-25-ヒナ" = "……………。"
"1000406-26-ヒナ" = "……………………。"
"1000406-27" = "（スッ）"
"1000406-28" = "（ヒナが膝の間に座った）"
"1000406-29-ヒナ" = "……。"
"1000406-30" = "[s] 身体の前面でヒナを感じる。"
"1000406-31-ヒナ" = "……えっと、重くはないと思うけど……たとえ重くても、大人なんだから我慢して。"
"1000406-32-ヒナ" = "……ちょっと座り心地が悪い……けど、嫌いじゃない。"
"1000406-33" = "[s7] ヒナの頭から良い香りがする。\n[s8] ヒナの髪の毛から良い香りがする。"
"1000406-34-ヒナ" = "……先生？"
"1000406-35-ヒナ" = "……先生？"
"1000406-36-ヒナ" = "……っ！？"
"1000406-37" = "（バッ！）"
"1000406-38-ヒナ" = "え、あ、今……っ！？"
"1000406-39-ヒナ" = "バっ……！さっきシャワー浴びてないって私、え、あ、ぅあ……！？"
"1000406-40" = "[s9] \"お日様の香りだった。\"\n[s10] \"ヒナの匂い……。\""
"1000406-41-ヒナ" = "………先生。"
"1000406-42" = "[s] \"あっ、ついにヒナの額の方にまで隈が……。\""
"1000406-43-ヒナ" = "……これは隈じゃない。"
"1000406-44" = "ゴスッ！！！！！！"
"1000406-45" = "（その後めちゃくちゃ怒られた）"
