[translation]
"1012503-1" = "\t魔法の帽子"
"1012503-2-エリ" = "うぅ……来てくださったんですね、マスター！"
"1012503-3-エリ" = "どうしたらいいのでしょう……。"
"1012503-4-エリ" = "今日の午後に実技試験があるのですが……#n担当の監督官は、超冷酷かつ超厳しいことで有名でして――"
"1012503-5-エリ" = "帽子はもちろん、試験に関係ない品は一切持ち込み禁止なんです……！"
"1012503-6-エリ" = "私にとって、帽子を脱いで試験を受けるのは……#n裸で街を歩けと言われているのも同じです！"
"1012503-7-エリ" = "ほ、本当にどうしたら……。"
"1012503-8-エリ" = "マスター……私、裸で出歩きたくないです……。"
"1012503-9" = "[ns1] \"と、とりあえず場所を変えようか！\"\n[ns2] \"変な誤解されるとまずいから……！\""
"1012503-10" = "（静かな場所で、落ち着いてエリの話を聞いた）"
"1012503-11" = "[ns3] \"つまり、持ち込めるのは画材だけってことだよね？\"\n[ns4] \"たしかに、それだけあれば絵は描けるけど……。\""
"1012503-12-エリ" = "……マスターも、帽子を脱ぐべきだとおっしゃるんですか？"
"1012503-13-エリ" = "つまり……あられもない姿になってほしいと……？"
"1012503-14" = "[s] \"そんなこと言ってません！\""
"1012503-15-エリ" = "こうなったら方法はただ一つ、試験監督に交代してもらうしか……！"
"1012503-16-エリ" = "やはり呪いの魔法でしょうか……#n試験の時間は、腹痛でお休みしてもらって……。"
"1012503-17" = "[s] \"そ、そんな魔法も使えるの！？\""
"1012503-18-エリ" = "魔法に不可能はありません。食事にこっそり一服盛れば……。"
"1012503-19" = "[s] \"魔法じゃなくて犯罪だからダメ！\""
"1012503-20-エリ" = "うっ……うぅぅぅぅ……！"
"1012503-21-エリ" = "わ、わかっているんです……そんなことをしてはいけないと……。"
"1012503-22-エリ" = "……今から試験監督を交代させることは不可能でしょう。"
"1012503-23-エリ" = "このままでは、私はすべての装備を失った状態で試験会場へ――"
"1012503-24-エリ" = "そして、丸腰の状態で魔力も底を尽き、あんな目やこんな目に……！"
"1012503-25" = "[s5] \"落ち着いて！まだ間に合うから！\"\n[s6] \"帽子を脱いで絵を描く練習をしてみよう？\""
"1012503-26-エリ" = "今から、ですか？"
"1012503-27-エリ" = "そう……ですね……。#n午後の試験は待ってくれませんし……。"
"1012503-28-エリ" = "覚悟を……決めますか。ふぅぅぅぅ……。"
"1012503-29-エリ" = "わかりました、帽子を脱ぎます……！#n恥ずかしいですが……！"
"1012503-30-エリ" = "……マスター、目を閉じてあちらを向いていてください。#n絶対に見たらダメですよ！"
"1012503-31" = "（言われた通り、目を閉じて顔をそらした）"
"1012503-32-エリ" = "ふぅぅぅぅ……。"
"1012503-33-エリ" = "いっそ、帽子を被ったまま服を脱ぐほうがマシです……。"
"1012503-34" = "[s] \"お願いします、それだけはやめてください！\""
"1012503-35-エリ" = "わかってます！冗談、冗談ですって！"
"1012503-36-エリ" = "……ふぅ。#nもう目を開けても大丈夫ですよ、マスター。"
"1012503-37-エリ" = "ど、どうですか？ 変じゃないです……？"
"1012503-38" = "[s7] \"全然変じゃない。\"\n[s8] \"すごく自然だし、心配いらないよ。\""
"1012503-39-エリ" = "そ、そうですか？にゅふふふ……。"
"1012503-40-エリ" = "ありがとうございます、マスター。なんだか元気が出てきました。"
"1012503-41-絵画学科の生徒A" = "あっ、エリちゃんだ。"
"1012503-42-絵画学科の生徒B" = "やっほー、エリちゃん！帽子被ってないの、珍しいね。"
"1012503-43-エリ" = "あっ！えっ！み、みなさん……！？"
"1012503-44-エリ" = "あ、あああ、あの、こんにちはっ！どどどうしてこちらに……！？"
"1012503-45-絵画学科の生徒A" = "午後の実技試験の練習に来たんだよ。"
"1012503-46-絵画学科の生徒B" = "エリちゃんも練習？"
"1012503-47-絵画学科の生徒B" = "試験、お互いがんばろうね！応援してるから！"
"1012503-48-エリ" = "あ、ああ……ありがとうございます！が、がんばります……！！"
"1012503-49-エリ" = "あぁぁぁぁ……！も、もう終わりです……！#n同じ学科の方々に、裸を見られるなんて……！"
"1012503-50" = "[s] \"裸じゃないから！落ち着いて！\""
"1012503-51-エリ" = "……そ、そうですね！#n帽子を脱ぐなんて、た、大したことじゃ……！#n……一般的には。"
"1012503-52-エリ" = "……うぅ、やっぱり無理かもしれません。"
"1012503-53-エリ" = "何としてでも、帽子だけは試験会場に……。"
"1012503-54-エリ" = "……そうだ。魔法で透明の帽子を作ればいいんです！"
"1012503-55-エリ" = "それを被れば、没収される心配はありません……！"
"1012503-56-エリ" = "……って、結局被ってないのと一緒じゃないですか！"
"1012503-57-エリ" = "それじゃまるで「裸の王様」です！"
"1012503-58-エリ" = "ああああ、もうダメです！やはり呪いの魔法で試験官を……！"
"1012503-59" = "[s9] \"お、落ち着いて！とにかく練習しよう！\"\n[s10] \"やってみれば、きっといい絵が描けると思うよ！\""
"1012503-60-エリ" = "うぅぅ……本当に、私に描けるんでしょうか……。"
"1012503-61" = "[s] \"うん！横でずっとマナの補給もしてあげるから！\""
"1012503-62-エリ" = "……マスターがそう言ってくださるなら。"
"1012503-63-エリ" = "……わかりました。少し、気持ちを切り替えてやってみます。"
"1012503-64-エリ" = "そうですね。#n自分がヌードデッサンのモデルになったつもりで、恥ずかしさを忘れてしまえば――"
"1012503-65-エリ" = "ヌードも、立派な芸術ですから……！"
"1012503-66" = "[s] \"な、なんか違う気もするけど……がんばって！\""
"1012503-67" = "（こうしてエリのモデルとなり、実技試験の練習につきあうことになった）"
