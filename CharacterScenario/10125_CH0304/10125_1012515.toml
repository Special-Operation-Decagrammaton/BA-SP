[translation]
"1012515-1" = "魔法の起点"
"1012515-2" = "（仕事を終えて、エリが待つアトリエに向かった）"
"1012515-9-絵画学科の生徒A" = "エリちゃん、いつもより大胆な色使いだね。"
"1012515-10-絵画学科の生徒A" = "温かみの奥にある情熱的な気配……ただの抽象画じゃない気がする。"
"1012515-11-絵画学科の生徒B" = "だよね。これはまるで――"
"1012515-12-絵画学科の生徒B" = "あっ、なるほどね。エリちゃんが想像するとこうなるのか……。"
"1012515-14-エリ" = "な、なな、何のお話でしょうか……！？#n私は決して変な想像なんてしてませんが……！"
"1012515-16-絵画学科の生徒A" = "ふぅ～ん？ほんとにぃ？"
"1012515-17-絵画学科の生徒B" = "怪しぃ～"
"1012515-19-エリ" = "ほ、本当ですってば……！"
"1012515-21-絵画学科の生徒A" = "でも、素敵な作品なのは間違いないね。"
"1012515-22-絵画学科の生徒B" = "うん。エリちゃん、どんどん上手になってるよ。"
"1012515-27-エリ" = "そ、そうでしょうか……？#nあ、ありがとうございます……えへへ……。"
"1012515-32" = "[ns] \"こんにちは。\""
"1012515-34-絵画学科の生徒A" = "あ、先生。こんにちは。"
"1012515-35-絵画学科の生徒B" = "ここで先生が出てくるってことは……ふふ、やっぱり？"
"1012515-36-絵画学科の生徒A" = "じゃあ、おじゃま虫は退散しよっか。またね！"
"1012515-37-絵画学科の生徒B" = "またねー。"
"1012515-44" = "[ns] \"何の話……？\""
"1012515-46-エリ" = "き、気にしないでください！#nあの方たちが誤解しているだけなので！"
"1012515-47" = "[s] \"学科のみんなと上手くやれてるみたいだね。\""
"1012515-48-エリ" = "どうでしょう……相変わらず振り回されっぱなしで……。"
"1012515-49-エリ" = "ですがそれでも、前よりは耐性がついたと言いますか……。"
"1012515-50" = "[s1] \"無理には言わなくていいんだけどさ。\"\n[s2] \"前はどんな感じだったの？\""
"1012515-53-エリ" = "……会話どころか、目もろくに合わせられませんでした。"
"1012515-54-エリ" = "同じ学科の方の前に立つと、私だけがみすぼらしく……小さく思えて……。"
"1012515-55-エリ" = "この魔法の帽子がなかったら……たぶん、今も逃げ回っていたと思います。"
"1012515-56-エリ" = "マスターと言葉を交わすことすらできなかったかも……。"
"1012515-57" = "[s3] \"自信をくれる魔法の帽子なんだね！\"\n[s4] \"自分で作ったの？\""
"1012515-60-エリ" = "とんでもない。こんな素敵な帽子、私には作れません。"
"1012515-61-エリ" = "この帽子は――"
"1012515-65-エリ" = "アトリエの倉庫に放置されていました。"
"1012515-67-エリ" = "1年くらい前の話です。"
"1012515-70" = "アトリエの倉庫"
"1012515-73-エリ" = "あぁぁ……。"
"1012515-74-エリ" = "また逃げてきちゃった……。"
"1012515-75-エリ" = "こんなんじゃダメなのに……なんで私はこんなに情けないのでしょう……。"
"1012515-76-エリ" = "このままだと、友だちもできないまま落第を重ねて……#n学院から追い出されてしまいます……。"
"1012515-77-エリ" = "こんなことをするためにワイルドハントに来たわけじゃないのに……。"
"1012515-78-エリ" = "……。"
"1012515-82-エリ" = "……あれ？"
"1012515-83-エリ" = "あの帽子は……？"
"1012515-92-エリ" = "けほっ、けほっ……！"
"1012515-93-エリ" = "うぅ、ホコリまみれ……いつからここにあったんでしょう……。"
"1012515-94-エリ" = "ずっと置いておかれて……。"
"1012515-95-エリ" = "なんだか……。"
"1012515-96-エリ" = "……かわいそう。"
"1012515-106-エリ" = "はぁ、はぁ……っ！"
"1012515-107-エリ" = "あっ、あっ、あの……っ！"
"1012515-113-絵画学科の生徒A" = "……え？あ、私たちに話しかけてた！？"
"1012515-114-絵画学科の生徒B" = "お、おお……！#nどうしたの？"
"1012515-116-エリ" = "そ、その……ええと……。"
"1012515-120-エリ" = "そ、倉庫にある、魔法の帽子……誰の物か分かりますか……？"
"1012515-122-絵画学科の生徒A" = "帽子……？#nさあ？私は知らないな。知ってる？"
"1012515-123-絵画学科の生徒B" = "そんな帽子があるのも今知ったよ。"
"1012515-124-絵画学科の生徒A" = "倉庫にあるなら、管理人に聞けばいいと思うよ。"
"1012515-126-エリ" = "そ、そうなんですね！"
"1012515-127-エリ" = "あ、あ、ありがとうございます……！"
"1012515-132-絵画学科の生徒A" = "……なんだったんだろ？#nというかあの子の声、初めて聞いたかも。"
"1012515-133-絵画学科の生徒B" = "ま、良い変化なんじゃん？たぶん。"
"1012515-136-エリ" = "その後、倉庫の管理人さんに聞きに行ったんです。"
"1012515-137-エリ" = "そしたら、あまりに古くていつからあったのかも分からない、って……。"
"1012515-138-エリ" = "処分しようにも、見るからに不吉な感じで誰も触れられなかったそうです。"
"1012515-139-エリ" = "呪いにかかるかも……悪い気が移るかも……といった理由で。"
"1012515-140-エリ" = "古い物には魂が宿る、なんて話もありますし。"
"1012515-141" = "[s] \"それで放置されてたんだね。\""
"1012515-142-エリ" = "……はい。"
"1012515-146-エリ" = "ですが不思議なことに……私はこの帽子を見た瞬間、運命を感じたんです。"
"1012515-147-エリ" = "ホコリを被った姿が……周りに馴染めない私のように見えて……。"
"1012515-148-エリ" = "だから、管理人さんに許可をいただいて持ち帰りました。"
"1012515-149-エリ" = "綺麗に洗って、ほつれたところを縫って、#n雑に直されていた部分は上から赤い布で補修して。"
"1012515-150-エリ" = "それでいざ被ってみたら……不思議なくらい自信が湧いてきたんです。"
"1012515-151-エリ" = "つばが広くて視線を遮ってくれてるからかも、と最初は思いました。"
"1012515-152-エリ" = "ですが！この帽子には間違いなく魔法が宿っています！#nそれも――とびきりの魔法が！"
"1012515-153-エリ" = "そうでなければ、あの運命の出会いが説明できません！"
"1012515-154" = "[s] \"そうかもしれない！\""
"1012515-155-エリ" = "……この帽子がなければ、今の私はいません。"
"1012515-156-エリ" = "きっと、マスターと出会うこともなかったはずです。"
"1012515-157-エリ" = "前の持ち主も、あんな場所に置き去りにした理由も分かりませんが……。"
"1012515-158-エリ" = "今やこの帽子は私の分身も同然！"
"1012515-159-エリ" = "だから一生、大切にします！"
"1012515-160" = "[s] \"エリならできるよ。\""
"1012515-161-エリ" = "にゅふふ、ありがとうございます。"
"1012515-162-エリ" = "あ、そうだ。#nよければ、マスターも被ってみませんか？"
"1012515-163-エリ" = "不思議な力を感じられるはずです！"
"1012515-164" = "[s5] \"私が、この帽子を……？\"\n[s6] \"……いいの？\""
"1012515-167-エリ" = "もちろんですとも！"
"1012515-171-エリ" = "さあ、どうぞ！"
"1012515-178-エリ" = "おお！マスターにもお似合いです！"
"1012515-179-エリ" = "ふむふむ、やはり私の目に狂いはありませんでした。"
"1012515-180-エリ" = "いかがです？#n自信がむくむく湧いてきませんか？"
"1012515-181" = "[s] \"特別な力を感じる気がする……！\""
"1012515-182-エリ" = "にゅふふ、そうでしょうそうでしょう。"
"1012515-183-エリ" = "特別に、もう少し貸して差し上げます。#nここには私たちだけですし、マナの共鳴ももっとはっきり……。"
"1012515-184-エリ" = "2人きり……共鳴が……。"
"1012515-188-エリ" = "帽子が……あれ？"
"1012515-189" = "[s7] \"そういえば……。\"\n[s8] \"帽子を取って恥ずかしくないの？\""
"1012515-192-エリ" = "……。"
"1012515-196-エリ" = "……はっ！！"
"1012515-198-エリ" = "わっ、私……マスターの前でまた破廉恥な姿を……！！"
"1012515-199-エリ" = "ど、どうしましょう……！#nこうなったら、記憶を消す魔法を――！！"
"1012515-200-エリ" = "マスター、大丈夫です！#nす、すぐ終わりますので……！！"
"1012515-201" = "[s] \"ストップストップ！帽子返すから……！\""
"1012515-204" = "（慌ててエリに帽子を返して、記憶を消す魔法の発動を阻止した）"
"1012515-208-エリ" = "はぁっ、はぁっ……。すみません、マスター……。"
"1012515-209-エリ" = "つい取り乱してしまいました……。"
"1012515-210-エリ" = "それで、えっと……今日の本題は絵をお渡しすることで――"
"1012515-211-エリ" = "――ち、ちょうど絵の具が乾いたみたいです！"
"1012515-217" = "（エリがとても恥ずかしそうにしていたので、絵を受け取って早めにアトリエを後にすることにした）"
"1012515-223-エリ" = "で、では、またお会いしましょう！"
"1012515-224" = "[s] \"またね！\""
"1012515-226" = "（シャーレに戻る道すがら、エリのことが頭から離れなかった）"
"1012515-230" = "（大切な帽子を私に被せてくれた――無邪気で明るいエリの姿が）"
