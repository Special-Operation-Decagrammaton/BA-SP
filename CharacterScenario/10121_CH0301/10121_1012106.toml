[translation]
"1012106-1" = "夏の海、静かな海"
"1012106-2" = "（コンビニに寄って帰る途中で、見覚えのある後ろ姿を見つけた）"
"1012106-3-ユカリ" = "あら？先生！#nこんばんは、ですの！"
"1012106-4-ユカリ" = "こんなところでお会いするなんて。"
"1012106-5-ユカリ" = "先生は……お買い物の帰り道でしたのね。"
"1012106-6-ユカリ" = "身共は、ただ……海を眺めておりましたの。"
"1012106-7-ユカリ" = "昼間の賑やかさが嘘のように静まり返っていて……。"
"1012106-8-ユカリ" = "この静寂に寂しさを覚えるのは、きっと――"
"1012106-9-ユカリ" = "身共が変わった……証なのでしょうね。"
"1012106-10-ユカリ" = "これまでは、この「静かな海」こそが、#n身共にとって当たり前の光景だったのですから……。"
"1012106-11-ユカリ" = "ふふん～ふふっん～♪"
"1012106-12-ユカリ" = "静かな海も～いいけれど～♪#n賑やかな海の中を～知りましたの～♪"
"1012106-13" = "[ns1] （歌を邪魔しないように黙っていよう）\n[ns2] （楽しかったみたいでよかった）"
"1012106-14-ユカリ" = "水上に浮かぶ蓮の花のごとく、気品の上に佇むべし。#n衣や髪を濡らすことなど、勘解由小路の名折れ……。"
"1012106-15-ユカリ" = "幼い頃からずっと、言い聞かされてきた教えですの。"
"1012106-16-ユカリ" = "ですが……ふふっ！#n衣服を濡らすどころか、海に飛び込んでしまいましたわ！"
"1012106-17-ユカリ" = "もし家の者が見ていたら、驚きのあまり卒倒しそうですわね！"
"1012106-18" = "[ns3] \"飛び込んでみてよかった？\"\n[ns4] \"後悔してない？\""
"1012106-19-ユカリ" = "はい！とっても！"
"1012106-20-ユカリ" = "先生はいつも、身共の世界を美しく塗り替えてくださいますわ。"
"1012106-21-ユカリ" = "いかなる選択も後悔いたしませぬ！#nと、申し上げたいところですが……。"
"1012106-22-ユカリ" = "身共は、心の底から楽しんでおりました。先生も、それが一番大切だとおっしゃっていましたよね？"
"1012106-23-ユカリ" = "そして……これは家の者も知らぬ、身共だけの秘密ですが――"
"1012106-24-ユカリ" = "海で衣服さえ濡らしたことがないというのは……実は嘘ですの。"
"1012106-25-ユカリ" = "海へ来るたび、澄んだ海水を眺めながら、#nそっと足を浸してみたりして……。"
"1012106-26-ユカリ" = "それが身共なりの、ひそやかな夏の楽しみ方でしたの。#n先生？とっぷし～くれっと、ですのよ？"
"1012106-27" = "（しばらくの間、ユカリと一緒に夜の海を眺めた）"
"1012106-28-ユカリ" = "あっ！"
"1012106-29" = "[ns] \"なにごと！？\""
"1012106-30-ユカリ" = "つい先生を引き止めてしまいましたわ！"
"1012106-31-ユカリ" = "先生はお買い物の帰りで――"
"1012106-32" = "（溶けたアイスが、コンビニ袋からぽたぽたと垂れている）"
"1012106-33-ユカリ" = "せ、先生！早くお帰りくださいまし！身共のことはお気になさらず！"
"1012106-34" = "[s5] \"いや、もう手遅れかな……。\"\n[s6] \"ゴリゴリ君は……もう……。\""
"1012106-35-ユカリ" = "もっ、申し訳ございません。#n身共のせいで……。"
"1012106-36" = "[s7] \"こうなったら仕方ない……。\"\n[s8] \"もうちょっと秘密を増やしちゃおうか。\""
"1012106-37-ユカリ" = "……！"
"1012106-38-ユカリ" = "ええ！身共はどこまでもお供いたしますわ！"
"1012106-39" = "（その後、ユカリと共に夜市を巡り、食べ歩きを楽しんだ）"
