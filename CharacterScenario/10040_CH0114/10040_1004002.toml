[translation]
"1004002-1" = "一人前の、忍者に……！"
"1004002-2" = "（約束の時間より少し前に、ツクヨとの待ち合わせ場所に着いたものの……）"
"1004002-3" = "（約束の時間が過ぎても、一向にツクヨが現れない……）"
"1004002-4" = "[ns] \"ツクヨ、どうしたんだろう……。\""
"1004002-5-？？？" = "先生……。"
"1004002-6" = "あの、ここです……。"
"1004002-7" = "[ns] \"つ、ツクヨ……！？\""
"1004002-8-ツクヨ" = "お待たせして、すみません……。"
"1004002-9-ツクヨ" = "その、先生をお呼びしておいて、何ですが……いざ先生にお会いすると思うと、何だかその、緊張してしまって……。"
"1004002-10-ツクヨ" = "私みたいな、ただ大きいだけの子が、お会いしても良いものかと……。"
"1004002-11-ツクヨ" = "先生は、快諾してくれましたが……やっぱりご気分を、害してしまうのでは、と……。"
"1004002-12-ツクヨ" = "そう考えていたら、つい……。"
"1004002-13-ツクヨ" = "ついその、木に変装してしまい……。"
"1004002-14" = "[s] \"隠れなくても大丈夫だよ。\""
"1004002-15-ツクヨ" = "そう、ですか……？"
"1004002-16" = "[s] \"ところで、ツクヨが相談したかったことって？\""
"1004002-17-ツクヨ" = "あ、えっと、ですね……。"
"1004002-18-ツクヨ" = "私、立派な忍者に、なりたくて……！"
"1004002-19-ツクヨ" = "シャーレの先生は、その、凄い方だと……聞きましたので……。"
"1004002-20-ツクヨ" = "先生に、手伝っていただければ……私なんかでも、一人前の忍者に、なれるのではと……！"
"1004002-21" = "[s1] \"一人前の忍者かぁ……。\"\n[s2] \"ところで、ツクヨはどうして忍者になりたいの？\""
"1004002-22-ツクヨ" = "あ、すみません……！そうですね、そこから、言うべきでした……。"
"1004002-23-ツクヨ" = "あ、すみません……！そうですね、そこから、言うべきでした……。"
"1004002-24-ツクヨ" = "えっと、理由、は……。"
"1004002-25-ツクヨ" = "理由、えっと……理由……。"
"1004002-26-ツクヨ" = "あの、立派な忍者になれたら、忍術研究部の活動で、役に立てるのでは、と……。"
"1004002-27-ツクヨ" = "立派な忍者になって、みんなの役に、立ちたいんです……！"
"1004002-28-ツクヨ" = "それが、一人前の忍者になりたい理由、です……！"
"1004002-29-ツクヨ" = "あ、えっと、すみません……急にこんなことを言われても、困りますよね……？"
"1004002-30" = "[s] \"大丈夫。力になれるかは分からないけど、できるかぎり協力するよ。\""
"1004002-31-ツクヨ" = "はい、ありがとう、ございますっ……！"
"1004002-32-ツクヨ" = "何でも、やります！まずは、何をすれば……？"
"1004002-33" = "[s3] \"やっぱりまずは、ツクヨが一番得意なことから。\"\n[s4] \"一番自信があることから、コツコツ練習するのが良いんじゃないかな。\""
"1004002-34-ツクヨ" = "なるほど……！"
"1004002-35-ツクヨ" = "私が一番、上手にできること……一番、自信のあること……。"
"1004002-36-ツクヨ" = "コツコツ、と……。"
"1004002-37-ツクヨ" = "流石は、シャーレの先生……！一言一言の、重みが違います……！"
"1004002-38-ツクヨ" = "一言も漏らさず、記録しないと……！"
"1004002-39" = "[s] \"そこまでかな……？と、とりあえず、得意なことは？\""
"1004002-40-ツクヨ" = "えっと、得意なこと……。"
"1004002-41-ツクヨ" = "あ、それなら……！"
"1004002-42-ツクヨ" = "木に変装すること、だけは、自信があります……！"
"1004002-43" = "[s5] \"たしかにさっき……。\"\n[s6] \"声をかけられるまで、全然気づかなかった。\""
"1004002-44-ツクヨ" = "あっ、そう、ですか……？"
"1004002-45-ツクヨ" = "あっ、そう、ですか……？"
"1004002-46-ツクヨ" = "えへへっ……先生にそう、言ってもらえると……何だか、すごく嬉しい、です！"
"1004002-47-ツクヨ" = "これは、昔からずっと鍛え続けてきた、私の特技で……。"
"1004002-48-ツクヨ" = "私、昔から背が高かったので……学芸会などでは、よく、木の役をしていて……！"
"1004002-49-ツクヨ" = "なので、慣れてるんです。"
"1004002-50-ツクヨ" = "昔のあだ名は、「百鬼夜行の神木」でした！"
"1004002-51-ツクヨ" = "では、早速……？"
"1004002-52" = "[s] \"あ、やってくれるの？\""
"1004002-53-ツクヨ" = "はい、少々お待ちを……！"
"1004002-54-ツクヨ" = "まず、これをこうして……。"
"1004002-55-ツクヨ" = "この枝をこう……ここに付けて……。"
"1004002-56-ツクヨ" = "ふう、準備完了です……。"
"1004002-57-ツクヨ" = "それでは、この[ruby=おおの]大野[/ruby]ツクヨ……"
"1004002-58-ツクヨ" = "とっておきの特技、お見せします……！"
"1004002-59-ツクヨ" = "はああっ……！"
"1004002-60-ツクヨ" = "いかが、でしょうか、先生……？"
"1004002-61" = "[ns7] \"すごい……！？\"\n[ns8] \"もはや自然と一体に……！？\""
"1004002-62-ツクヨ" = "こんな、感じです……！"
"1004002-63-ツクヨ" = "いかが、でしたか？何か、変なところなどは……？"
"1004002-64" = "[s] \"すごいね、どこに隠れてるのか全然分からなかった……。\""
"1004002-65-ツクヨ" = "えっと、そこまで褒めて、いただけるなんて……。"
"1004002-66-ツクヨ" = "少し、自信が湧いてきたかもしれません……！"
"1004002-67-ツクヨ" = "この技を、磨き続ければ……！"
"1004002-68-ツクヨ" = "私も、一人前の忍者に、なれるでしょうか……！？なれるんですね！"
"1004002-69" = "[s] \"きっとなれるよ、頑張ろう！\""
"1004002-70-ツクヨ" = "ありがとうございます……！"
"1004002-71-ツクヨ" = "これからも、一生懸命、頑張ります！"
"1004002-72-ツクヨ" = "……。"
"1004002-73-ツクヨ" = "えっと、その……。"
"1004002-74-ツクヨ" = "もしかして今のは、忍者として、カッコよく退場するべきだった、でしょうか……？"
"1004002-75-ツクヨ" = "すみません、空気が読めなくて……。"
"1004002-76-ツクヨ" = "どっちでも、ですか……？あ、ありがとうございます。"
"1004002-77-ツクヨ" = "それでは、あらためて……失礼、します……！"
"1004002-78-ツクヨ" = "やっ……！"
"1004002-79" = "[ns] \"……良い子だなあ。\""
"1004002-80" = "[ns] \"さて、じゃあシャーレに――\""
"1004002-81" = "[ns9] \"……ツクヨ、実はそこにいたりする？\"\n[ns10] \"もしかして、また木に変装してたり……？\""
"1004002-82" = "[ns] \"……。\""
"1004002-83" = "（その後も念のため、ツクヨがいないか周囲を10分ぐらい確認してからシャーレへと帰った）"
