[translation]
"1001003-1" = "僅かな距離"
"1001003-2" = "アビドス高等学校・近郊"
"1001003-3" = "（シロコのことを待っていた先生）"
"1001003-4" = "[s] \"そろそろシロコが来るはず……。\""
"1001003-5-シロコ" = "……あれ、先生？ここで何してるの？"
"1001003-6-シロコ" = "私がここでランニングをするって聞いて、エナジードリンクを渡しに……?"
"1001003-7-シロコ" = "う、うーん……あ、ありがたいんだけど、その……。"
"1001003-8" = "[s] \"はい、どうぞ。\""
"1001003-9-シロコ" = "……。"
"1001003-10" = "[s] \"……？\""
"1001003-11" = "[s] \"……シロコ？\""
"1001003-12-シロコ" = "……うーん。"
"1001003-13-シロコ" = "……ごめん、えっと……。"
"1001003-14-シロコ" = "今、ランニングを終えた直後だから……べ、別に、そんな気にしてるわけではないけど……！"
"1001003-15-シロコ" = "ご、ごめん、先生……やっぱり、今は遠慮しておく。"
"1001003-16-シロコ" = "また、学校で。"
"1001003-17" = "対策委員会・教室"
"1001003-18" = "（シロコがさっきより気持ちよさそうな表情で現れた）"
"1001003-19-シロコ" = "やあ、先生。"
"1001003-20-シロコ" = "さっきのエナジードリンク？うん、ありがたくもらうね。"
"1001003-21-シロコ" = "……うん？"
"1001003-22-シロコ" = "さっきとは態度が違うって？えっと、それは……。"
"1001003-23-シロコ" = "う、うーーん……。"
"1001003-24-シロコ" = "それは……。"
"1001003-25-シロコ" = "な、なんでもない。"
"1001003-26" = "[s] \"……！？\""
"1001003-27" = "（そういえばシロコからふんわり石鹸の香りがしていた）"
"1001003-28" = "（ミスをしたみたいだから、今度謝ることにしよう）"
