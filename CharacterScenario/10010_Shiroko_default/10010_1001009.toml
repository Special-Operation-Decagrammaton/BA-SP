[translation]
"1001009-1" = "個人面談"
"1001009-2" = "アビドス・教室"
"1001009-3" = "（シロコが少し緊張した面持ちで待っていた）"
"1001009-4-シロコ" = "ん……。"
"1001009-5-シロコ" = "約束通り来たよ、先生。どうしたの？"
"1001009-6-シロコ" = "シャーレのお仕事の話？それともアビドスに関係すること？"
"1001009-7-シロコ" = "とにかく座ってって？分かった……。"
"1001009-8" = "……。"
"1001009-9" = "[wa:700]― 何かやってほしい事[wa:2000]ある？"
"1001009-10" = "[wa:500]― （何を考えてるのか[wa:2000]気になる）"
"1001009-11" = "― （これから[wa:1500]何をするつもりだろう……？）"
"1001009-12" = "― 先生を手伝うために[wa:2500]ここにいるから。"
"1001009-13" = "[wa:500]― こ、[wa:700]こんなに撫でられても……。"
"1001009-14" = "― 別に[wa:1000]困ることなんて……。"
"1001009-15" = "[ns] 昨日の夜、何をしていたか聞く。"
"1001009-16-シロコ" = "昨日の夜？ライディングをして、家に帰ってシャワーを浴びて、夕飯には焼き魚を……。"
"1001009-17-シロコ" = "その前？ライディングの前はKVハイウェイの電光掲示板に登って、現金輸送車両を奪取するシミュレーションを……。"
"1001009-18-シロコ" = "え、知ってた？"
"1001009-19" = "[s] 危険な行動について心配してると伝える。"
"1001009-20-シロコ" = "……う、うーん。"
"1001009-21-シロコ" = "言いたいことは分かった……けど、これは癖みたいなもので……。"
"1001009-22-シロコ" = "うーん……でも、何を話しても言い訳になるから……。"
"1001009-23-シロコ" = "……。"
"1001009-24-シロコ" = "分かった。先生は私のことを心配して言ってるんだから、肝に銘じる。"
"1001009-25-シロコ" = "ん……ごめん、こんな不良な生徒で。"
"1001009-26-シロコ" = "先生に心配をかけちゃった。"
"1001009-27-シロコ" = "……。"
"1001009-28-シロコ" = "……ありがとう。"
"1001009-29" = "（どこか嬉しそうな表情で、シロコは教室を出た）"
