[translation]
"1001006-1" = "地下鉄"
"1001006-2" = "D.U.・地下鉄駅"
"1001006-3-シロコ" = "あ、先生。"
"1001006-4" = "[s] \"シロコ？ここで何してるの？\""
"1001006-5-シロコ" = "ああ、うん。個人的な用事で……。"
"1001006-6-シロコ" = "どんな用事かって？"
"1001006-7-シロコ" = "いつもより長距離のライディングを計画してるの。まずは軽く400kmぐらい。"
"1001006-8-シロコ" = "だからちょっと遠くまで出てきて、コースをチェックしてるの。"
"1001006-9-シロコ" = "うん？遠すぎじゃないかって？"
"1001006-10-シロコ" = "うーん……徹夜を覚悟して走れば、24時間内に走り切ることはできる。"
"1001006-11-シロコ" = "先生は今から帰るとこだったの？"
"1001006-12-シロコ" = "うん？アビドスに用事があって？"
"1001006-13-シロコ" = "ああ、うん、そうなんだ……。"
"1001006-14-シロコ" = "そういえば先生が出勤に使う地下鉄だったね。D.U.に来ることになって、もしかしたら会えるかなと思ったけど。"
"1001006-15-シロコ" = "……ん、別に狙ってたわけじゃないんだけど、会えたね。"
"1001006-16-シロコ" = "……。"
"1001006-17-シロコ" = "その、偶然だから。"
"1001006-18-シロコ" = "……。"
"1001006-19" = "[s] \"……じゃあ、偶然会ったんだし、一緒に帰ろうか？\""
"1001006-20-シロコ" = "ん……。"
"1001006-21" = "（シロコと一緒に地下鉄でアビドス中央駅まで帰った）"
