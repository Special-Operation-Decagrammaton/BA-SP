[translation]
"1001002-1" = "ランニングマシン"
"1001002-2" = "キヴォトス・街路"
"1001002-3" = "（シロコの朝のランニングコースで、シロコを待っていた）"
"1001002-4-シロコ" = "ん。"
"1001002-5-シロコ" = "先生、待った？"
"1001002-6" = "[s] \"ううん、ちょうど今到着したところ。\""
"1001002-7-シロコ" = "……そっか。"
"1001002-8-シロコ" = "こうやって道で先生に会うと、なんだか変な感じだね。"
"1001002-9-シロコ" = "なんとなく先生に初めて会った時のことも思い出すし……。"
"1001002-10-シロコ" = "運動をしてると、よく良いことが起こる気がする。"
"1001002-11" = "[s] \"シロコは運動が好きなんだね？\""
"1001002-12-シロコ" = "んー……。"
"1001002-13-シロコ" = "朝から汗を流して一日を始めると気分がいいからね。"
"1001002-14-シロコ" = "……。"
"1001002-15-シロコ" = "あ、もちろん運動した後は、学校でシャワーを浴びるけど……。"
"1001002-16-シロコ" = "うーんと……。"
"1001002-17-シロコ" = "良かったら、先生も明日から、私と一緒に朝のランニングしない？"
"1001002-18" = "[s1] \"朝からランニングはちょっと……\"\n[s2] \"一日中ヘトヘトになりそうだから遠慮するね……。\""
"1001002-19-シロコ" = "んー、まあそうかも。運動のことはまた今度考えよっか。……さて、今日はスーパーへショッピングに行くんだったね。"
"1001002-20-シロコ" = "んー、まあそうかも。運動のことはまた今度考えよっか。……さて、今日はスーパーへショッピングに行くんだったね。"
"1001002-21-シロコ" = "あ、スーパーはあっちにあるよ。"
"1001002-22-シロコ" = "すぐそこだから、ランニングってほどでもないけど、軽く走って行こうか。"
"1001002-23" = "[s] シロコの後を追う。"
"1001002-24" = "（1時間後）"
"1001002-25" = "……。"
"1001002-26" = "[s] \"ハア……ハア……ハア……\""
"1001002-27-シロコ" = "ふむ……。"
"1001002-28-シロコ" = "振り返っても見えないなって思って待ってたんだけど……。"
"1001002-29-シロコ" = "私がちょっと速すぎたね……ごめん。"
"1001002-30-シロコ" = "周りを見ないで前だけ見すぎって、よく言われる……。"
"1001002-31" = "[s3] \"……スーパーはどこ？\"\n[s4] \"1時間も走ったのに……。\""
"1001002-32-シロコ" = "うーん……。"
"1001002-33-シロコ" = "うーん……。"
"1001002-34-シロコ" = "これで半分ぐらい？"
"1001002-35" = "[s] \"半分！？\""
"1001002-36-シロコ" = "あと1時間くらい走れば着くよ。今度は少しゆっくり走るから、一緒に行こう、先生。"
"1001002-37" = "[s] \"ま、待って！\""
"1001002-38" = "（走っていくシロコを止めて、一緒に歩くことにした）"
"1001002-39" = "（そこから、約2時間歩いた）"
"1001002-40-シロコ" = "やっと到着。ここが例のスーパーだよ。"
"1001002-41-シロコ" = "……うん？"
"1001002-42-シロコ" = "先生……大丈夫？顔色が悪いけど……。"
"1001002-43" = "[s] \"ここって、あの約束の場所からどれぐらい離れてたの？\""
"1001002-44-シロコ" = "うーん、15kmぐらい……？"
"1001002-45-シロコ" = "朝ランニングしてから帰り道に寄るのに、ちょうどいい距離なんだよね。"
"1001002-46-シロコ" = "本当はもっと遠く離れたコンビニに行こうとも思ったけど、今日は先生もいるから近場を選んだの。"
"1001002-47-シロコ" = "これぐらいだったら案外乗り物無しで行けるでしょ？"
"1001002-48-シロコ" = "あ……まだ横になっちゃダメ、先生。帰りもまた15km歩かなきゃいけないから……。 "
"1001002-49" = "[s] \"もういっそ殺して……。\""
"1001002-50-シロコ" = "う、うーん……。"
