[translation]
"1004805-1" = "自責の念"
"1004805-2" = "（まさかとも思いつつ心配になり、ブラックマーケットにいるサオリを探しに来た）"
"1004805-3" = "[ns] \"銃声！？\""
"1004805-4-通行人A" = "そこの！何の用かは分からないけど気を付けな！"
"1004805-5" = "[s] \"これは何の騒ぎですか！？\""
"1004805-6-通行人B" = "ここブラックマーケットでも有名なワンワン派とニャンニャン派が正面衝突をしてるらしい！"
"1004805-7-通行人A" = "だがどうやら、ワンワン派の方にはすごい実力者が雇われたんだってよ！"
"1004805-8-通行人A" = "それでニャンニャン派には甚大な被害が出たとか……。"
"1004805-9-通行人B" = "いや、だがニャンニャン派の罠に引っ掛かってそいつはやられたという噂も……！"
"1004805-10" = "[s] \"実力者……まさかサオリ……！？\""
"1004805-11-通行人A" = "あっ、ちょっと待った！"
"1004805-12-通行人A" = "今そっちの西区は、完全にニャンニャン派のエリアだぞ！抗争も相当過激になってる、巻き込まれるぞ！！"
"1004805-13" = "（明らかに危険な空気の中で、ブラックマーケットのあちこちを走り回りながらサオリの姿を探し始めた）"
"1004805-14" = "[ns] \"サオリ……！\""
"1004805-15" = "[ns] \"サオリ、一体どこに……！\""
"1004805-16" = "（銃声や爆音を耳にしながら、サオリのことを探し続けてしばらく……）"
"1004805-17-？？？" = "はぁ……はぁ……。"
"1004805-18" = "[ns] \"この声……サオリ！？\""
"1004805-19" = "[wa:950]― 先生、[wa:1800]どうしてここに……？"
"1004805-20" = "[ns] \"サオリ、傷が……！\""
"1004805-21" = "[wa:150]― ぐっ……[wa:750]はぁ……"
"1004805-22" = "[wa:50]― ……気にするな、[wa:1600]よくあることだ。"
"1004805-23" = "[wa:650]― ただ私の詰めが、[wa:1950]甘かっただけで……"
"1004805-24" = "[wa:50]― 何も[wa:350]変わってないというのに……"
"1004805-25" = "― 勘違いを[wa:300]してしまった。"
"1004805-26" = "[wa:50]― げほっ、[wa:700]げほっ……！"
"1004805-27" = "― そんな顔をするな、[wa:2250]痛みには慣れている。"
"1004805-28" = "[wa:50]― 今までと何も変わらない。"
"1004805-29" = "[wa:250]― 今さらの話だ。"
"1004805-30" = "[wa:500]― 今は[wa:400]これで良い……"
"1004805-31" = "[wa:100]― もう少し、[wa:3250]このままで……"
"1004805-32" = "[ns] \"……とりあえず場所を変えよう。\""
"1004805-33-サオリ" = "いや、私は……くっ……。"
"1004805-34" = "[ns] \"ここまで来れば大丈夫かな……。\""
"1004805-35-サオリ" = "……また、迷惑をかけてしまった。"
"1004805-36" = "[s] \"一体何があったの？依頼とは聞いたけど……。\""
"1004805-37-サオリ" = "依頼を受けて、抗争を終わらせに現場へと向かった。"
"1004805-38-サオリ" = "しかしそれが、罠だったようだ……。"
"1004805-39" = "[s] \"……サオリ、今回の契約書は？\""
"1004805-40-サオリ" = "ここにあるが……。"
"1004805-41" = "[ns] \"この内容……。\""
"1004805-42" = "[ns] \"サオリひとりで、ニャンニャン派を相手にするってことじゃ……！？\""
"1004805-43-サオリ" = "……。"
"1004805-44" = "[s] \"もしかしてだけどその顔、中身を読んでない……？\""
"1004805-45-サオリ" = "……契約書自体は、きちんと交わしたが？"
"1004805-46" = "[s] \"いやいやいや、中身も読まずにサインしちゃダメ！\""
"1004805-47-サオリ" = "そうなのか……？"
"1004805-48" = "[ns] \"まあでもこの契約書、書き方が巧妙っていうか……。\""
"1004805-49" = "（そこには遠回しな言い方で、最終的にはサオリがひとりで西地区を片付けなければならない……というように書かれていた）"
"1004805-50" = "[s] \"そういえば……。\""
"1004805-51-通行人A" = "あっ、ちょっと待った！"
"1004805-52-通行人A" = "今そっちの西区は、完全にニャンニャン派のエリアだぞ！抗争も相当過激になってる、巻き込まれるぞ！！"
"1004805-53" = "（ここにくる途中、確かに西区はニャンニャン派のエリアだから危険だと聞いたような……）"
"1004805-54" = "（ここは西区でも少し外れの方だけど……もし、サオリが契約書通り西区の中心に行っていたら……）"
"1004805-55" = "[s3] \"契約書を読んでその通りにしてたら、もっと大変なことになってた……？\"\n[s4] \"読んでないことが偶然、功を奏した……？\""
"1004805-56" = "（サオリの状況とこの現状から判断するに、）"
"1004805-57" = "（サオリの状況とこの現状から判断するに、）"
"1004805-58" = "（そもそもサオリは、最初からワンワン派の捨て駒として雇われていたようだ）"
"1004805-59" = "（それは、つまり……）"
"1004805-60" = "[s] \"間一髪だったけど、ちゃんと契約書は読まないとダメだよ。\""
"1004805-61-サオリ" = "……そうか。また、騙されたか。"
"1004805-62-サオリ" = "……まあ、今さらだな。よくあることだ。"
"1004805-63" = "[s] \"……。\""
"1004805-64-サオリ" = "特別なことでも、騒ぐことでもない。だから……。"
"1004805-65" = "[ns] \"……とりあえず、何か美味しいものでも食べにでも行こうか。\""
"1004805-66-サオリ" = "いきなり、何を……？"
"1004805-67" = "[s5] \"疲れたでしょ？\"\n[s6] \"終わったことはしょうがないし、とりあえず栄養補給をね。\""
"1004805-68-サオリ" = "……どうしてそうなる？ "
"1004805-69-サオリ" = "……どうしてそうなる？ "
"1004805-70-サオリ" = "ちょ、ちょっと待て……！"
"1004805-71" = "[ns] \"ここのラーメン、美味しいんだよね。\""
"1004805-72-サオリ" = "……。"
"1004805-73" = "[s] \"食べ終わったら、契約書のことでも勉強しようか。\""
"1004805-74-サオリ" = "私は、そんな……。"
"1004805-75" = "[s] \"ダメ、約束。\""
"1004805-76-サオリ" = "……。"
"1004805-77-サオリ" = "……分かった。"
"1004805-78-サオリ" = "そうだな……。 "
"1004805-79-サオリ" = "私は、まだ……。"
"1004805-80-サオリ" = "……まだ。学ばないといけないことが、たくさんある。"
"1004805-81" = "（そうしてサオリとラーメンを食べて）"
"1004805-82" = "（ゆっくりと、その場を後にした）"
