[translation]
"1004802-1" = "独り立ち"
"1004802-2" = "ブラックマーケット・路地"
"1004802-3" = "（サオリからの気になる連絡を受けて、ブラックマーケットを訪れた）"
"1004802-4-サオリ" = "あぁ、先生。来たか。"
"1004802-5" = "[s1] \"サオリ、大丈夫！？\"\n[s2] \"びっくりしたよ、サオリから急に「助けてほしい」なんて…….。\""
"1004802-6-サオリ" = "その、助けてほしいというか。 "
"1004802-7-サオリ" = "その、助けてほしいというか。 "
"1004802-8-サオリ" = "自分で解決しようと思ったのだが、難しかったというべきか……。"
"1004802-9" = "[s] \"なるほど……それくらいすごい問題なんだね！\""
"1004802-10-サオリ" = "いや、というより……。"
"1004802-11" = "[s3] \"どれだけ重大で深刻な問題でも構わない！\"\n[s4] \"サオリのためなら、この身が尽きるまで助けるよ！\""
"1004802-12-サオリ" = "そ、そうか……。"
"1004802-13-サオリ" = "そ、そうか……。"
"1004802-14-サオリ" = "とにかく、こっちへ。"
"1004802-15" = "（サオリの案内に従って進んだ、その先には――）"
"1004802-16" = "[s] \"ここは……ブラックマーケットの銀行？\""
"1004802-17-ブラックマーケット銀行員" = "いらっしゃいませ、お客さ―― "
"1004802-18-ブラックマーケット銀行員" = "……ふぅ。先ほども訪ねてきた、言葉が通じない正体不明のお客さんではないですか。"
"1004802-19" = "[s] \"正体不明……？\""
"1004802-20-ブラックマーケット銀行員" = "何度も申し上げたでしょう、ダメなものはダメです！"
"1004802-21-ブラックマーケット銀行員" = "身元の保証が確認できない限りは、何ともできません！"
"1004802-22-サオリ" = "だから連れてきたんだ、私の身元を保証する者を。"
"1004802-23-ブラックマーケット銀行員" = "ど、どういうことですか……？"
"1004802-24-ブラックマーケット銀行員" = "もしかして……。"
"1004802-25-サオリ" = "そう。あんたが言っていた「保証人」だ。"
"1004802-26-ブラックマーケット銀行員" = "……なるほど。"
"1004802-27" = "[ns] \"ブラックマーケットで、身元の保証……！？\""
"1004802-28" = "[ns5] \"もしかしてこれは……巨大な金融犯罪に巻き込まれる展開！？\"\n[ns6] \"サオリ！信じてたのに！\""
"1004802-29-サオリ" = "先生……何を言っている？"
"1004802-30" = "（今さらながら、事情を一部始終聞かせてもらった）"
"1004802-31" = "[ns] \"口座開設……？\""
"1004802-32-ブラックマーケット銀行員" = "はい。そちらのお客様が口座の開設をしたいと当店を訪ねたのですが、学校のことすら教えてもらえず……。"
"1004802-33-ブラックマーケット銀行員" = "それでは何もできないではありませんか……？"
"1004802-34" = "[s] \"それはその、複雑な事情があるというか……。\""
"1004802-35-ブラックマーケット銀行員" = "他の銀行でしたら、おそらく門前払いでしょう！"
"1004802-36-ブラックマーケット銀行員" = "私たちを誰だとお思いですか？"
"1004802-37-ブラックマーケット銀行員" = "正当な対価さえ頂ければ、#nどこよりも公正なサービスを提供するブラックマーケットです！"
"1004802-38-ブラックマーケット銀行員" = "あなたに信用がなくたって心配ご無用。"
"1004802-39-ブラックマーケット銀行員" = "丈夫な身体と一丁の銃をお持ちなのであれば……"
"1004802-40-ブラックマーケット銀行員" = "このブラックマーケットで、高収入とまではいかずとも#nそこそこの仕事ならいくらでも見つかりますから！"
"1004802-41" = "[s] （リアクションに困る……）"
"1004802-42-ブラックマーケット銀行員" = "なので最低限、身元の保証をしてくれる方さえいえればそれで構いません。何があっても責任を負う犠牲……"
"1004802-43-ブラックマーケット銀行員" = "いえ、どなたかを連れて来ていただきさえすれば、口座は開設できると伝えたのです。"
"1004802-44" = "[s] \"なるほど。嬉しいけど、かすかに気になる言葉が聞こえたかも。\""
"1004802-45-サオリ" = "……悪いな、先生。"
"1004802-46-サオリ" = "仲間たちとバラバラになった今、こんなことを頼めるのはお前しか……。"
"1004802-47" = "[s] \"ところでサオリ、どうして口座が必要なの？\""
"1004802-48-サオリ" = "……最近、このブラックマーケットに流れ着いたんだ。"
"1004802-49-サオリ" = "この先もきっと、私の居場所はこういった裏通りくらいだろうから……。"
"1004802-50-サオリ" = "ここで生活していくためには、お金が必要だ。そして――"
"1004802-51-ブラックマーケット銀行員" = "私たちから何か依頼を仲介したとして、その報酬を受け取るには口座が必要と申し上げたのです。"
"1004802-52" = "[s] \"なるほど、それで……。\""
"1004802-53-サオリ" = "……だがよく考えると、これは私の我儘だ。"
"1004802-54-サオリ" = "こんな勝手な理由で、お前を巻き込むわけにはいかない。"
"1004802-55-サオリ" = "やはりこの話はなかったことに……。"
"1004802-56" = "[s] \"全然構わないよ？\""
"1004802-57-サオリ" = "……先生？"
"1004802-58" = "[s] \"それに、サオリに頼ってもらえたのが嬉しい。\""
"1004802-59-サオリ" = "……そうか。"
"1004802-60" = "[ns] \"さて、じゃあ手続きしようか。\""
"1004802-61-ブラックマーケット銀行員" = "それでは、簡単な審査を始めましょうか。"
"1004802-62" = "[s] \"保証人さえいれば良いって話だったのでは……？\""
"1004802-63-ブラックマーケット銀行員" = "まあそういうこともあります。"
"1004802-64-ブラックマーケット銀行員" = "ただご心配なさらず。審査と言っても、手続きとほぼ同義です。これをやらないというわけにはいかないのですが……。"
"1004802-65-サオリ" = "私は構わない。"
"1004802-66" = "[s] \"サオリがそう言うなら……。\""
"1004802-67-ブラックマーケット銀行員" = "はい、それでは……。"
"1004802-68-ブラックマーケット銀行員" = "これまでどういった作業の経験がありますでしょうか？"
"1004802-69-サオリ" = "これまでの……？"
"1004802-70" = "[s] \"それ、どうしても必要な情報？\""
"1004802-71-ブラックマーケット銀行員" = "はい、それはもちろん。お客様のこれまでの経験や経歴をお聞かせいただかないと、口座を作った後に依頼の仲介もできませんから。"
"1004802-72-ブラックマーケット銀行員" = "何か問題でも？"
"1004802-73-サオリ" = "いや、問題無い。答えよう。"
"1004802-74-サオリ" = "詳しくは説明できないが……破壊や爆破、学園を倒壊させる計画をし、実行までした。"
"1004802-75-サオリ" = "……？"
"1004802-76-サオリ" = "それなりに規模が大きい組織を壊滅させるのは、かなり得意分野だ。"
"1004802-77-ブラックマーケット銀行員" = "……はい？"
"1004802-78" = "[s] \"サオリ、言葉のチョイスが！！\""
"1004802-79-サオリ" = "……嘘ではないが？"
"1004802-80" = "[s] \"それはそうだけど！\""
"1004802-81-ブラックマーケット銀行員" = "そ、"
"1004802-82-ブラックマーケット銀行員" = "それはユニークなご経験ですね……。"
"1004802-83-ブラックマーケット銀行員" = "ちなみに、今のご住所は……？"
"1004802-84-サオリ" = "住所……"
"1004802-85-サオリ" = "と呼べるものは無い。現在はブラックマーケットに滞在している。"
"1004802-86-ブラックマーケット銀行員" = "はい？"
"1004802-87-サオリ" = "正確に言うならば、廃ビルだったり地下道だったり、場所は逐次変えている。"
"1004802-88-ブラックマーケット銀行員" = "……あの。これは何か、最近流行っているユーモアなのでしょうか？"
"1004802-89" = "[s] \"そういうことで何卒！\""
"1004802-90-ブラックマーケット銀行員" = "では、次に……"
"1004802-91" = "（それからしばらくして……）"
"1004802-92-ブラックマーケット銀行員" = "……はい、質問は以上です。 "
"1004802-93" = "[s] \"よ、ようやく……\""
"1004802-94-サオリ" = "そうか、"
"1004802-95-サオリ" = "ではこれで口座が――"
"1004802-96-ブラックマーケット銀行員" = "あ、"
"1004802-97-ブラックマーケット銀行員" = "実は最後に、"
"1004802-98-ブラックマーケット銀行員" = "最も重要な「実技テスト」があります。"
"1004802-99" = "[ns] \"「簡単な手続き」だったはずでは！？\""
"1004802-100-ブラックマーケット銀行員" = "ははっ、そもそもここはブラックマーケットですよ？"
"1004802-101-ブラックマーケット銀行員" = "いくら何でも、無条件に口座を作れるはずないではありませんか。"
"1004802-102-ブラックマーケット銀行員" = "それに、このテストもお客様の今後のためなのです。"
"1004802-103-ブラックマーケット銀行員" = "実力が分かれば、それだけ信頼もできます。支払い能力に直結しますし、特典もありますから。"
"1004802-104" = "[s] \"これがブラックマーケット……でも……\""
"1004802-105-サオリ" = "……ここまで助けてもらっておいて、引き下がれるわけがない。"
"1004802-106-サオリ" = "そのテスト、受けて立とう。"
"1004802-107-ブラックマーケット銀行員" = "良いでしょう！"
"1004802-108-ロボットA" = "テストの内容は簡単です。"
"1004802-109-ロボットA" = "私たちブラックマーケットガードを相手にどれだけ持ちこたえられるのか、見せてもらいましょうか！"
"1004802-110-ロボットA" = "長く耐えられるほどランクが高くなりますので、頑張ってください！"
"1004802-111-ロボットA" = "それでは、準備はよろしいですか？"
"1004802-112-サオリ" = "……。"
"1004802-113-ブラックマーケット銀行員" = "テスト、開始！"
"1004802-114-サオリ" = "……！"
"1004802-115" = "[ns] \"流石……。\""
"1004802-116-ブラックマーケット銀行員" = "……え？"
"1004802-117-サオリ" = "これで良いのか？ "
"1004802-118-ブラックマーケット銀行員" = "な、何という力……！？"
"1004802-119-ブラックマーケット銀行員" = "っ……！や、やはり口座は開設できません！"
"1004802-120-サオリ" = "……何だと？"
"1004802-121-ブラックマーケット銀行員" = "どうしても口座を開設したいのなら……"
"1004802-122-ブラックマーケット銀行員" = "そう！"
"1004802-123-ブラックマーケット銀行員" = "この銀行の、専属警備員になっていただきましょうか！"
"1004802-124" = "[s] \"どういうこと！？\""
"1004802-125-ブラックマーケット銀行員" = "ひ、ひぃっ！？"
"1004802-126-ブラックマーケット銀行員" = "……理解した。ここまで発言がコロコロ変わる様子からして……私たちを騙したな？"
"1004802-127-サオリ" = "時間の無駄だったが……"
"1004802-128-サオリ" = "まあ、教訓にするとしよう。ここで終わらせようか。"
"1004802-129-ブラックマーケット銀行員" = "す、すぐにお作りします！！それで許してください！！！！"
"1004802-130" = "（口座開設を終え、銀行を後にした）"
"1004802-131" = "[s] \"サオリ、お疲れ様。\""
"1004802-132-サオリ" = "いや、私は別に……"
"1004802-133-サオリ" = "むしろ、お前を余計なことに巻き込んでしまった。"
"1004802-134" = "[s7] \"ううん、気にしないで。\"\n[s8] \"いやぁ、コロコロ発言が変わって参ったね……。\""
"1004802-135-サオリ" = "ブラックマーケットの悪名はどこでも耳にする。こういう場所だと話には聞いていたが……。"
"1004802-136-サオリ" = "ブラックマーケットの悪名はどこでも耳にする。こういう場所だと話には聞いていたが……。"
"1004802-137-サオリ" = "どうやら、本当のようだな。"
"1004802-138" = "[s] \"世界には危ない場所が多いからね、だから……\""
"1004802-139-サオリ" = "……だから、何だ？"
"1004802-140" = "[s] \"だから、これからも気をつけてね。\""
"1004802-141-サオリ" = "……。 "
"1004802-142-サオリ" = "……この借りは、必ず返す。"
"1004802-143-サオリ" = "覚えておくと良い。"
"1004802-144" = "[ns] \"……できるだけ、良い方向に行くと良いけど。\""
