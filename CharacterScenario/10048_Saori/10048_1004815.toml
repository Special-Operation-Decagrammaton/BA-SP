[translation]
"1004815-1" = "虚しいものなどない"
"1004815-2" = "（しばらくして、サオリがやってきた）"
"1004815-3-サオリ" = "急ですまない。"
"1004815-4-サオリ" = "どうしても修理したい装備があるんだ。"
"1004815-5-サオリ" = "これなんだが……。"
"1004815-6" = "[ns] \"それ、サオリの着けてるマスクだよね？\""
"1004815-7-サオリ" = "ああ。フィルター機能が壊れてしまってな。"
"1004815-8-サオリ" = "既に生産中止になっていて……#nパーツも特殊だからどこも修理を引き受けてくれないんだ。"
"1004815-9" = "[s] \"そんなに古いマスクなんだ。\""
"1004815-10-サオリ" = "初めて実戦に出たとき、アリウス分校から支給されたものだ。"
"1004815-11-サオリ" = "もしも修理ができるなら……先生の頼みはなんでも聞く。"
"1004815-12-サオリ" = "頼む……何かツテがあれば教えてくれ。"
"1004815-13" = "[s] \"本当に？\""
"1004815-14-サオリ" = "あ、ああ……本当だ。"
"1004815-15" = "[s1] \"そこまで言うなんて……。\"\n[s2] \"サオリは、このマスクにすごく思い入れがあるんだね。\""
"1004815-16-サオリ" = "……これは、あくまで支給品の一つだ。"
"1004815-17-サオリ" = "特別でもなんでもない。"
"1004815-18-サオリ" = "頑丈なところは気に入っていたが……。"
"1004815-19-サオリ" = "もう壊れてしまったからな。"
"1004815-20-サオリ" = "昔なら、機能しなくなった道具など――"
"1004815-21-サオリ" = "躊躇なく捨てていた。"
"1004815-22-サオリ" = "だが今の私には、このマスクも大切な仲間のように感じられる。"
"1004815-23-サオリ" = "いわば……相棒のようなものだ。"
"1004815-24-サオリ" = "壊れたとしても――"
"1004815-25-サオリ" = "――私はそれを、虚しいものとして切り捨てられない。"
"1004815-26-サオリ" = "だから、なんとか直してやりたいんだ。"
"1004815-27-サオリ" = "もう……あの頃とは違うからな。"
"1004815-28" = "[s] \"そうだったんだね……。\""
"1004815-29" = "[ns3] \"サオリがそこまで思っているなら……\"\n[ns4] \"一緒に、この子を元気にしよう！\""
"1004815-30-サオリ" = "……ありがとう、先生。"
"1004815-31" = "[s] \"でも……約束は忘れないでね！\""
"1004815-32-サオリ" = "や、約束は守る。私が言い出したことだ。"
"1004815-33" = "（と、意気込んで出かけたものの……）"
"1004815-34-エキスパート修理工" = "うわあ、懐かしいですね、このモデル！"
"1004815-35-エキスパート修理工" = "でも……この状態……買い換えた方が早いかもなあ。"
"1004815-36-エキスパート修理工" = "直すとしても、いつ納品できるやら……。"
"1004815-37-サオリ" = "どのくらいになる？"
"1004815-38-エキスパート修理工" = "最短で1年は見てもらわないと……。"
"1004815-39-サオリ" = "……そうか。"
"1004815-40-万屋の商人" = "いらっしゃいませ！何をお求めでしょうか！"
"1004815-41-万屋の商人" = "すみません、そちらの部品は在庫を切らしてまして……。"
"1004815-42-万屋の商人" = "最後に入荷したのも、ずいぶん前になります。"
"1004815-43-万屋の商人" = "ですが、最新モデルならば、防塵性能もそちらの物より――"
"1004815-44-サオリ" = "……これじゃないとダメなんだ。"
"1004815-45-卑しい商人" = "ふっふっふ、よくいらっしゃいました……！"
"1004815-46-卑しい商人" = "その部品でしたら、用意できますよ！お客さんもツイてるなあ！"
"1004815-47-サオリ" = "……本当に用意できるのか？"
"1004815-48-卑しい商人" = "ご安心ください！ いつか調達しますよ！いつか……ね。"
"1004815-49-サオリ" = "……行こう、先生。"
"1004815-50" = "（何軒もお店を回ったが、収穫はなかった……）"
"1004815-51-サオリ" = "すっかり暗くなってしまったな。"
"1004815-52-サオリ" = "やはり、こんな古いものの修理は難しいか……。"
"1004815-53-サオリ" = "……諦めるとしよう。"
"1004815-54-サオリ" = "顔を隠せれば、それでいい。"
"1004815-55-サオリ" = "すまない。先生にも時間を使わせてしま――"
"1004815-56" = "[s5] \"サオリ！\"\n[s6] \"諦めるには早いよ！\""
"1004815-57-サオリ" = "……修理できる者はいなかったんだぞ？"
"1004815-58" = "[s7] \"いるよ。\"\n[s8] \"サオリの目の前にね！\""
"1004815-59-サオリ" = "……先生が直すのか？"
"1004815-60" = "[s9] \"機械の簡単な修理はしたことあるし、\"\n[s10] \"わからないことは、調べればいいんだよ。\""
"1004815-61-サオリ" = "それは私も試してみたが……。"
"1004815-62-サオリ" = "あまり上手くいかなかった。"
"1004815-63" = "[s11] \"難しいのはわかってる。\"\n[s12] \"でも、本当はあきらめたくないよね？\""
"1004815-64-サオリ" = "……そうだな。"
"1004815-65-サオリ" = "手伝えることがあれば、言ってくれ。"
"1004815-66" = "[s13] \"修理は私がするから、シャーレの当番を頼むよ。\"\n[s14] \"一緒に頑張ろう！\""
"1004815-67-サオリ" = "私がシャーレの当番を……？"
"1004815-68-サオリ" = "……了解だ。"
"1004815-69" = "（翌日……）"
"1004815-70" = "（サオリのマスクの修理を始めた）"
"1004815-71" = "（修理は想像以上に大変で……）"
"1004815-72" = "（夜遅くまで続いた）"
"1004815-73" = "（わからないことは、必死に調べ――）"
"1004815-74" = "（壊れた部品は、別の製品から取り出したものと交換した）"
"1004815-75" = "（大変な作業ばかりだったけど――）"
"1004815-76" = "（サオリの「仲間」には、元気でいてほしい）"
"1004815-77" = "（数日後……）"
"1004815-78-サオリ" = "……朝か。"
"1004815-79-サオリ" = "眠ってしまっていたようだな。"
"1004815-80-サオリ" = "先生……？その顔は……"
"1004815-81" = "[s15] \"ジャーン！\"\n[s16] \"作戦成功だ！\""
"1004815-82-サオリ" = "……直せたのか！？"
"1004815-83" = "[s] \"うん！着けてみて！\""
"1004815-84-サオリ" = "これは……！"
"1004815-85-サオリ" = "フィルターが動作している。"
"1004815-86-サオリ" = "……本当に直せるとは。"
"1004815-87-サオリ" = "また、世話になってしまったな。"
"1004815-88" = "[s] \"サオリの支援があってこそだよ。\""
"1004815-89" = "[ns] \"チームの勝利、だね。\""
"1004815-90-サオリ" = "先生と私の努力の成果……"
"1004815-91-サオリ" = "このマスクが……"
"1004815-92-サオリ" = "ありがとう。大切に使わせてもらう。"
"1004815-93" = "[s] \"というわけで、今度はサオリが約束を守る番だよ。\""
"1004815-94-サオリ" = "そうだったな……"
"1004815-95" = "[s] \"どんな頼みも聞いてくれるんだよね！？\""
"1004815-96-サオリ" = "……もちろんだ。"
"1004815-97" = "[s17] \"ふふふ……どれだけ待ち望んだことか。\"\n[s18] \"ずっとこうしたかったんだ……！\""
"1004815-98-サオリ" = "一体何を――"
"1004815-99-サオリ" = "……変なことを考えていないだろうな！？"
"1004815-100" = "[s] \"サオリが恥ずかしがることだよ……！\""
"1004815-101-サオリ" = "くっ……！す、好きにしろ！"
"1004815-102" = "[ns] \"そうさせてもらうよ！\""
"1004815-103" = "[ns] \"……だから、いつでもシャーレに遊びに来てほしいな。\""
"1004815-104-サオリ" = "そのような破廉恥なことを……！"
"1004815-105-サオリ" = "……何？"
"1004815-106" = "[s] \"これからは、遠慮せずにシャーレへおいで。\""
"1004815-107" = "[ns19] \"気をつかってるんだろうけれど……\"\n[ns20] \"迷惑なんて、思ったことはないよ。\""
"1004815-108" = "[ns] \"サオリをいつでも歓迎する。\""
"1004815-109-サオリ" = "……遊びに来るなど、考えたこともなかった。"
"1004815-110-サオリ" = "先生に会うときも、常に緊張して……"
"1004815-111-サオリ" = "そこまで見抜いていたとはな。"
"1004815-112-サオリ" = "いいだろう。"
"1004815-113-サオリ" = "次回からは、もう少し肩の力を抜くとしよう。"
"1004815-114-サオリ" = "このマスクに整備が必要になったら、また来る。"
"1004815-115-サオリ" = "……共に修理をした、相棒だからな。"
"1004815-116" = "[s] \"もちろん！いつでも来てね！\""
"1004815-117-サオリ" = "……先生といると、学ぶことが多いな。"
"1004815-118-サオリ" = "これからも、よろしく頼む。"
"1004815-119" = "（その後、穏やかな表情のサオリと楽しい時間を過ごした）"
