[translation]
"2003302-1" = "万魔殿の偉大な議長！"
"2003302-2" = "（約束の時間に合わせ[ruby=パンデモニウム・ソサエティー]、万魔殿の[/ruby]前にやって来たところ……）"
"2003302-3" = "[ns] \"……何かあったのかな？\""
"2003302-4-万魔殿の先任部員" = "さあ！もっと急げ！議長の像はまだか！？"
"2003302-5-万魔殿の部員B" = "運搬中の車両から、もうすぐ到着するとの連絡がありました！"
"2003302-6-万魔殿の先任部員" = "よし、貴賓を迎え入れる儀礼の準備はどうなっている？"
"2003302-7-万魔殿の部員B" = "最後のリハーサルを終え次第、議事堂の裏側で控える流れになっています！"
"2003302-8-万魔殿の先任部員" = "ふむ……順調だが、こういうときこそ最善の注意を払うべきだ。"
"2003302-9-万魔殿の部員A" = "忘れてはならない！マコト議長は、この会合を最重要視していた。"
"2003302-10-万魔殿の先任部員" = "これからお迎えするお客様は、とても立場のあるお方だ。#nひとつのミスも許されはしない。"
"2003302-11-万魔殿の先任部員" = "万全を期してマコト議長の権威を証明するのが、我々に与えられた任務である！"
"2003302-12-万魔殿の先任部員" = "今日が万魔殿の底力を発揮する時だ！"
"2003302-13-万魔殿の部員たち" = "はいっ！！！"
"2003302-14" = "[ns] \"こんにちは、取り込み中だったかな？\""
"2003302-15-万魔殿の先任部員" = "あ、[USERNAME]先生でしたか。ご無沙汰しております。"
"2003302-16-万魔殿の先任部員" = "せっかくお越しいただいたのに、お見苦しいところをお見せしました。"
"2003302-17" = "[s] \"何かあったの？\""
"2003302-18-万魔殿の先任部員" = "あ、それが……マコト議長から13時にVVIP客が訪問されると言われまして。"
"2003302-19-万魔殿の先任部員" = "その方が誰なのか、ですか？"
"2003302-20-万魔殿の先任部員" = "ええっと、極秘事項だそうで私も知らされておらず――"
"2003302-21-万魔殿の先任部員" = "ただ、飛ぶ鳥を落とす勢いでキヴォトス全土を掌握せんとする方とは聞いております。"
"2003302-22" = "[s] \"そ、そうなんだ……えっと、頑張ってね？\""
"2003302-23" = "万魔殿・執務室前"
"2003302-24" = "（その後も手際よく動く万魔殿の部員と挨拶を交わしながら数分、目的地に到着した）"
"2003302-25" = "[ns] \"失礼しま――\""
"2003302-26-？？？" = "いや！これも違うっ！"
"2003302-27" = "[ns] \"……うん？\""
"2003302-28-マコト" = "むむむ……これでもなければ……あれでもない……"
"2003302-29-マコト" = "もう時間がないというのに……！"
"2003302-30-マコト" = "まったくアイデアが浮かばないとは……！"
"2003302-31-マコト" = "うおっ！？気づけばこんな時間に……！？"
"2003302-32-マコト" = "ぐぐぐ……！一体どうすれば……何かいい方法は……"
"2003302-33" = "[s] （マコト……あそこまで真剣に何を悩んでいるんだろう）"
"2003302-34-マコト" = "シャーレの先生が部屋に入ってきたとき……どんな顔とポーズで迎えればいいのだ！？#nこの[ruby=はぬま]羽沼[/ruby]マコト様の威厳を知らしめるには……！"
"2003302-35" = "[s] \"そんなことで悩んでたの！？\""
"2003302-36-マコト" = "ぬおわあぁぁぁぁぁっ！？"
"2003302-37-マコト" = "ゲホゲホゲホゲホッ……！！！"
"2003302-38" = "[s] \"マコト！大丈夫！？\""
"2003302-39-マコト" = "ゲホッゲホッ、はぁ……はぁ……"
"2003302-40-マコト" = "……はぁぁ。"
"2003302-41-マコト" = "……ふぅ。"
"2003302-42-マコト" = "あぁ、先生か。"
"2003302-43-マコト" = "うむ、待ちくたびれていたぞ。"
"2003302-44" = "[s] （さっきまで、ものすごく慌てていたような……）"
"2003302-45-マコト" = "ん？ところで、なぜ先生がもうここに……"
"2003302-46-マコト" = "今は儀礼の時間のはずだが……"
"2003302-47" = "[s1] （まさかとは思っていたけど、さっきの準備は……）\n[s2] （勘違いだったら恥ずかしいし、知らないふりしてたけど……）"
"2003302-48-マコト" = "キキキッ。そうか……そういうことか。"
"2003302-49-マコト" = "形式的な儀礼なんぞ、何も意味を持たぬ……"
"2003302-50-マコト" = "そんなもので時間を無駄にするくらいなら、さっさと本題に入るべきだと！"
"2003302-51" = "[s] \"いや、無駄とは思ってな……\""
"2003302-52-マコト" = "キキキキッ！ さすが、このマコト様の心を鷲掴みにしただけはある！"
"2003302-53-マコト" = "ああ！それでこそ、この羽沼マコト様に[ruby=ふさわ]相応[/ruby]しい！"
"2003302-54-マコト" = "やはり、私の目に狂いは無いっ！"
"2003302-55" = "[s] \"そこまで褒められると逆に恥ずかしいんだけど！？\""
"2003302-56-マコト" = "よし、決めた！"
"2003302-57-マコト" = "部員たちには、全ての行事を中止するよう伝えておく。"
"2003302-58-マコト" = "今日は私と先生の二人で、内密な会話をしようじゃないか。"
"2003302-59-マコト" = "では、しばらく外で待っていてくれ。"
"2003302-60-マコト" = "準備を終えたら、すぐに声をかけよう。"
"2003302-61" = "[s] \"う、うん。\""
"2003302-62" = "（そうして、外で待っていると……）"
"2003302-63-マコト" = "これはここに置いて……あぁ、これはあそこに……"
"2003302-64-マコト" = "むむ！どこに隠れている！「エンペラー・ライオンマル・ジュニア3世」！お前の出番だ！"
"2003302-65-マコト" = "くっ！すばしっこい奴め！！"
"2003302-66-マコト" = "大人しく、するのだっ……！"
"2003302-67-マコト" = "よし！"
"2003302-68" = "[ns] \"………………。\""
"2003302-69" = "（……ようやく物音が鳴り止んだ）"
"2003302-70-マコト" = "はぁ……はぁ…………うむ、入りたまえ。"
"2003302-71" = "[s] \"えっと、失礼します……\""
"2003302-72" = "[wa:500]― [log=마코토]キシシッ、[wa:1100]先生よ、[wa:1300]活躍はみていたぞ。[/log]"
"2003302-73" = "[wa:200]― [log=마코토]お前は他人を助け、[wa:1350]事件を解決し……[/log]"
"2003302-74" = "[wa:1350]― [log=마코토]シャーレの名声を上げてきた！[/log]"
"2003302-75" = "[wa:500]― [log=마코토]キキキッ、[wa:1400]ここまできたら、[/log]"
"2003302-76" = "[wa:1400]― [log=마코토]もはや[wa:550]認めざるをえないだろう――[/log]"
"2003302-77" = "― [log=마코토]そう、[wa:1300]お前がこのマコト様と[wa:1300]肩を並べるほどの、[/log]"
"2003302-78" = "[wa:900]― [log=마코토]実力者であるということを！[/log]"
"2003302-79" = "[ns] \"じ、実力者……？\""
"2003302-80" = "[wa:1000]― [log=마코토]その能力を高く評価し……[/log]"
"2003302-81" = "[wa:2100]― [log=마코토]断れない重大な提案を[wa:1300]しようじゃあないか。[/log]"
"2003302-82" = "― [log=마코토]シャーレの先生よ、[wa:2700]我が万魔殿と……[/log]"
"2003302-83" = "[wa:2900]― [log=마코토]いや、[wa:1400]この羽沼マコト様と[wa:1100]手を組め！[/log]"
"2003302-84" = "[ns] \"え、えっと……\""
"2003302-85" = "[wa:1600]― [log=마코토]我々が力を合わせれば、[/log]"
"2003302-86" = "[wa:1800]― [log=마코토]キヴォトスの征服など[wa:700]容易い！[/log]"
"2003302-87" = "[wa:200]― [log=마코토]もしもそうなったら、[/log]"
"2003302-88" = "[wa:1400]― [log=마코토]キヴォトスの半分をシャーレに渡すとしよう。[/log]"
"2003302-89" = "― [log=마코토]どうだ、[wa:900]悪くない取引だろう？[/log]"
"2003302-90" = "[wa:500]― [log=마코토]さあ！[wa:300]先生！[wa:1000]この私と！[wa:1200]遠大な夢を[wa:1100]叶えようじゃないか！[/log]"
"2003302-91" = "[wa:2100]― [log=마코토]キキキッ、[wa:1200]キシシシシシシッ！[/log]"
"2003302-92-マコト" = "キキキッ。どうだ、私の提案は？"
"2003302-93-マコト" = "[USERNAME]先生、お前も断ろうとは思わない魅力的な――"
"2003302-94-マコト" = "うおっ！？ライオンマル！こ、こいつ！？噛むのはやめるのだ！！"
"2003302-95-マコト" = "……は、は、はくしょんっ！！！"
"2003302-96" = "[ns3] \"あ、うん……提案はありがたいけど、ごめんね。\"\n[ns4] \"シャーレの仕事だけでも忙しいから。\""
"2003302-97-マコト" = "なん、だと……！？"
"2003302-98-マコト" = "こ、この羽沼マコト様の魅力的な提案を……こうもあっさりと断るだと……！？"
"2003302-99-マコト" = "たしか先生は、富や名声には興味が無いのだとか……"
"2003302-100-マコト" = "だから、このマコト様の提案にも乗ってこないはずだとチアキから聞いてはいたが……#nまさか、本当に断られるとは！"
"2003302-101" = "[s5] （……富？）\n[s6] （……名声？）"
"2003302-102-マコト" = "キキッ……キキキッ……"
"2003302-103-マコト" = "キャハハハハッ！"
"2003302-104" = "[s] \"だ、大丈夫……？\""
"2003302-105-マコト" = "だが！私は失望などしてないぞ！先生よ！"
"2003302-106-マコト" = "この羽沼マコトは、真のリーダーとして引き際[ruby=わきま]を弁え[/ruby]ている！"
"2003302-107-マコト" = "シャーレの仕事で忙しいのなら仕方ない。#nマコト様は相手に合わせて柔軟な対応ができるのだ！"
"2003302-108-マコト" = "うむ。ひとまず今日のところは、顔合わせで満足するとしよう。"
"2003302-109-マコト" = "先生が万魔殿に協力するのも時間の問題だしな！"
"2003302-110-マコト" = "キキキキキッ！！"
"2003302-111-マコト" = "では、今後もよろしく頼んだぞ！シャーレの[USERNAME]先生！"
"2003302-112" = "[s] \"う、うん……こちらこそよろしくね、マコト。\""
"2003302-113" = "（……こうしてマコトとの記念すべき顔合わせは、平穏？に終わった）"
