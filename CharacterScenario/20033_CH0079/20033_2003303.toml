[translation]
"2003303-1" = "偉大な議長の事業"
"2003303-2" = "[ns] \"…………ん？\""
"2003303-3-万魔殿の部員B" = "[ruby=はぬま]羽沼[/ruby]マコト議長の！ご入場です！"
"2003303-4-マコト" = "うむ。私は先生と用事があるから、お前たちは外で待機するように。"
"2003303-5-万魔殿の部員たち" = "はいっ！"
"2003303-6-マコト" = "……というわけで、このマコト様が直々に足を運んでやったぞ。"
"2003303-7" = "[s1] \"あ、うん、いらっしゃい。\"\n[s2] \"えっと、コーヒーでも飲む？\""
"2003303-8-マコト" = "キキッ、遠慮なくもらうとしよう。"
"2003303-9-マコト" = "それより……"
"2003303-10-マコト" = "キキキッ、ここが噂に聞くシャーレの執務室か。"
"2003303-11-マコト" = "これは……"
"2003303-12" = "[s] \"……これは？\""
"2003303-13-マコト" = "あまりにも手狭で居心地が悪いな！"
"2003303-14" = "[s] \"急に来たかと思えばひどい言い草だね！？\""
"2003303-15-マコト" = "ひどいとは何がだ？私はただ事実を述べたに過ぎない！"
"2003303-16-マコト" = "優秀なリーダーたるもの、それ相応の仕事場を用意するべきだ！"
"2003303-17-マコト" = "こんな狭苦しい場所で、効率よく仕事ができるわけないだろう？"
"2003303-18-マコト" = "それに……これでは威厳を知らしめるための像が置けないではないか！"
"2003303-19-マコト" = "やれやれ……私からの提案を呑んでいれば、比べ物にならないくらい広々とした執務室を提供してやったというのに。"
"2003303-20" = "[s3] \"今の執務室に不満は無いからね……\"\n[s4] \"普通は自分の像を部屋に置かないからね！？\""
"2003303-21-マコト" = "ともかく、先生に提案を断られてから、じっくり考えたのだ。"
"2003303-22-マコト" = "考えに考えた末！ついに今日、理解した！"
"2003303-23" = "[s] \"聞かせてもらっても……？\""
"2003303-24-マコト" = "キキキッ……まさか、こんなにも簡単な理由を見過ごしていたとは。"
"2003303-25-マコト" = "その理由とは……先生は我[ruby=パンデモニウム・ソサエティー]々万魔殿の[/ruby]真価を知らないからである！#n不覚にも、このマコト様[ruby=あやま]の過ち[/ruby]だ……"
"2003303-26" = "[s] \"過ちって……？\""
"2003303-27-マコト" = "安心してくれ、先生に非は無い。"
"2003303-28-マコト" = "全ては万魔殿の偉業を事細かに説明していなかった、このマコト様が悪いのだ。"
"2003303-29-マコト" = "私にとって万魔殿の成長や成功は、もはや約束されたも同然。#nだからこそ、お互いの認識を共有できていなかった。"
"2003303-30-マコト" = "優秀なリーダーとは、時に自身の過ちを素直に認めるもの！"
"2003303-31-マコト" = "そこで今日、私が先生のもとを訪ねた理由はただひとつ。"
"2003303-32-マコト" = "万魔殿が何をしているのか。#nそして、この羽沼マコト様がどのようにして偉業を成し遂げているのか――"
"2003303-33-マコト" = "余すことなく、先生に見せるとしよう！"
"2003303-34-マコト" = "そうすれば、私の提案を断ったのが間違いであると泣きながら後悔し、考えを改めるはずだ！キャハハハハッ！！"
"2003303-35" = "[s] \"いや、さすがに泣きはしないんじゃないかな……\""
"2003303-36-マコト" = "そうと決まれば、こうしてる場合ではない。"
"2003303-37-マコト" = "さあ、先生をリムジンに案内せよ。"
"2003303-38-マコト" = "今すぐ、万魔殿の傘下にある事業所へ移動する！"
"2003303-39" = "[s] \"待って、マコト！まだシャーレの仕事が……！\""
"2003303-40-マコト" = "キキキキッ！そう些細なことを気にするな！"
"2003303-41-マコト" = "その顔も、すぐに畏敬と尊敬の念で染まるだろう！"
"2003303-42-マコト" = "うむ！では行くぞ！"
"2003303-43" = "[s] \"私の話は聞いてた！？\""
"2003303-44" = "（こうして急遽、マコトと一緒に万魔殿の事業を見て回ることに）"
"2003303-45-マコト" = "キシシッ。将来のパートナーとなる存在に、まず紹介するべきは……"
"2003303-46-マコト" = "……ここであるっ！"
"2003303-47" = "[s] \"……ここって、印刷所？\""
"2003303-48-マコト" = "ああ。"
"2003303-49-マコト" = "だが、単なる印刷所ではない。"
"2003303-50-マコト" = "ここは我々万魔殿が単独で運営している印刷所だ。#n……そして、なんとゲヘナでも最大の規模を誇っている。"
"2003303-51-マコト" = "ここで作られているチラシや新聞、雑誌、漫画など、あらゆる印刷物は全て……"
"2003303-52-マコト" = "万魔殿を！延いては、このマコト様を宣伝するためのもの！"
"2003303-53" = "[s] \"それはつまり……\""
"2003303-54-マコト" = "キキキッ、そうだ！このマコト様は、すでに出版業を掌握している……#nつまり、メディア産業そのものを掌握したようなものだ！"
"2003303-55-マコト" = "この事業は、これから先も右肩上がりの業績が期待されている。"
"2003303-56-マコト" = "つまり、ゲヘナのマスコミを思いのまま操れるようになるのも、時間の問題なのだ！"
"2003303-57-マコト" = "どうだ、先生よ。キヴォトス中を探しても、ここまでの事業を手掛ける者は、この羽沼マコト様以外に存在しないはず！"
"2003303-58-マコト" = "これで私の偉大な業績が分かっただろう？"
"2003303-59" = "[s] \"あ……うん、すごいね。\""
"2003303-60-マコト" = "むむむ！？これを見ても、まったく動じないだと……？"
"2003303-61" = "[s5] \"似たようなものを見てきたというか……\"\n[s6] \"規模が大きければ良いわけじゃないというか……\""
"2003303-62-マコト" = "な、なんだと！？一体どれほどの修羅場をくぐり抜けてきたのだ……？"
"2003303-63-マコト" = "……うむ、これくらい当然というわけだな。"
"2003303-64-マコト" = "まだまだ他の事業も見てもらわねば！むしろ、これからが本番だ！"
"2003303-65-マコト" = "さあ！次の現場に移動するぞ！"
"2003303-66-マコト" = "ここだ！"
"2003303-67" = "[s] \"工事の真っ最中だね、何を建設してるの？？\""
"2003303-68-マコト" = "キシシッ、それはな……"
"2003303-69-建設現場の担当者" = "これはこれは、マコト様ではありませんか。#n今日は視察ですかね？"
"2003303-70-マコト" = "ああ、工事は順調に進んでいるか？"
"2003303-71-建設現場の担当者" = "ははっ！それはもちろん、この通り。"
"2003303-72-建設現場の担当者" = "ご期待ください！もうじき、羽沼マコト様の威厳を知らしめる――"
"2003303-73-建設現場の担当者" = "「マコトタワー」が完成しますので！#nこれで、キヴォトスの全生徒はマコト様を仰ぎ見ることになるでしょう！"
"2003303-74" = "[s] \"……マコトタワー？\""
"2003303-75-マコト" = "キキキッ。ああ、この偉大な私に見合うビルを建設しているのだ。"
"2003303-76-マコト" = "その高さは……なんと、シャーレのサンクトゥムタワーを[ruby=りょうが]凌駕[/ruby]する！"
"2003303-77-建設現場の担当者" = "ええ。私どもはマコト様から頂いた指示書に従い、建設を進めております。"
"2003303-78-マコト" = "私の目標は……ゲヘナはもちろん、トリニティ、ミレニアム、百鬼夜行、それにレッドウィンターまでをも一望できる超高層ビルの建設だ！"
"2003303-79" = "[s] \"さすがに不可能じゃない！？\""
"2003303-80-マコト" = "ふん、何を弱気な！#nこのマコト様が手掛けている以上、成功するに決まっている！"
"2003303-81-建設現場の担当者" = "……ははっ。実際にビルを建設しているのは、私どもですがね。"
"2003303-82-マコト" = "キャハハッ！私が建設しているようなものだ！"
"2003303-83-建設現場の担当者" = "ええ、ええ、そうでした。私どもは、マコト様の依頼を請け負っているだけですので！"
"2003303-84-マコト" = "キャハハハハハッ！"
"2003303-85-建設現場の担当者" = "はははっ！"
"2003303-86-マコト" = "完成した日には、ゲヘナのシンボルとして素晴らしい観光名所となるだろう。"
"2003303-87-マコト" = "そうして巨額の観光収入を得て、キヴォトス全土に我々万魔殿の名を轟かせる！"
"2003303-88-マコト" = "風紀委員会には想像すらできないだろう……#nそう！この計画は、マコト様でなければ成し得ない！"
"2003303-89-マコト" = "どうだ、シャーレの先生よ！このビルを見たお前の感想を聞かせてくれ。"
"2003303-90-マコト" = "……あまりの規模に驚いてしまったか？"
"2003303-91-マコト" = "……ん？現実的な予算や観光消費額の調査はしたのか、だと……？"
"2003303-92-マコト" = "キシシッ、つまらない考えは捨て置こう。"
"2003303-93" = "[s] \"つまらないの一言で片付けちゃっていいの……？\""
"2003303-94-マコト" = "ああ！現実を見ていても仕方あるまい。"
"2003303-95-マコト" = "重要なことは、自分の心に聞けば自然と分かるものだ……"
"2003303-96-マコト" = "己の欲望に従おうじゃないか！"
"2003303-97" = "[s] \"……本当にそれでいいの！？\""
"2003303-98-マコト" = "ふむ……未完成の建物を見せたところで、先生が納得するはずもなかったな。"
"2003303-99-マコト" = "では、次だ！"
"2003303-100" = "（その後も不安と心配を抱えながら、様々な事業を見て回った）"
"2003303-101-マコト" = "ここのショッピングモールでは、万魔殿のポップアップストアが開催されている。"
"2003303-102-マコト" = "マコト様の威厳が溢れているフィギュアやポスターをはじめ、様々なグッズが並んでいるだろう。"
"2003303-103-マコト" = "うむ、好調だな！今後はオンラインショップを通して大量販売も計画している！#nそうすれば、このマコト様の名声は――！"
"2003303-104-マコト" = "キキキッ！ここが我々万魔殿で運営しているリゾートだ。"
"2003303-105-マコト" = "現在は全ての利用客に特別割引サービス券と万魔殿ファンクラブのバッジを配布している。これで、さらに影響力を――！"
"2003303-106" = "（そうして万魔殿の様々な事業を回り終え、今度はゲヘナの商店街に訪れた）"
"2003303-107-マコト" = "さて、いろんな事業を見せてきたが……どうだ？"
"2003303-108-マコト" = "先生の感想を聞かせてくれ。"
"2003303-109" = "[s] \"マコトは色々な事業を手掛けてるんだね。\""
"2003303-110-マコト" = "キシシッ。ああ、その通りだ。"
"2003303-111-マコト" = "今この瞬間も、どうすれば万魔殿を大きくできるのか、事業を成功できるのか考えている。"
"2003303-112-マコト" = "そして――"
"2003303-113-マコト" = "どうすれば、このマコト様の名を広げられるのか。"
"2003303-114-マコト" = "もちろん、こうして事業を拡大するたびに、イロハは愚痴をこぼしているがな。"
"2003303-115" = "[s] \"現場を見てきたから、なんとなく想像できるよ……\""
"2003303-116-マコト" = "な、なにぃ！？"
"2003303-117-マコト" = "ま、まぁ……着実に力を伸ばし続けて風紀委員会を完全に黙らせれば、ゲヘナを……#nいや、キヴォトス全土を掌握できるはず！"
"2003303-118-マコト" = "これで我々万魔殿の素晴らしさを改めて実感しただろう。"
"2003303-119-マコト" = "どうだ、先生。このマコト様と手を組む気になったか？"
"2003303-120" = "[s] \"うーん……ごめん、マコト。やっぱりそれは難し――\""
"2003303-121-マコト" = "ん？なんの騒ぎだ？"
"2003303-122-仲介業者" = "ですから、この商品を仕入れてくだされば、新しい顧客を望めるはずです！"
"2003303-123-商会長" = "どうだってええ。ウチらの商店街で、そんなもんを扱うわけにはいかん！"
"2003303-124-仲介業者" = "……おじいさん！取引先は、なんとあの万魔殿ですよ！？#nきっと今よりも集客が見込めますし、お金の方も……"
"2003303-125-商会長" = "ったく、これだから最近の若モンは！口を開けばカネカネカネ！#n店を潰されたら、常連さんが困るだろう！"
"2003303-126-仲介業者" = "ですから、あくまで仕入れ数は……"
"2003303-127-マコト" = "……何事だ？"
"2003303-128-仲介業者" = "あっ……ま、マコト様！"
"2003303-129-マコト" = "ふむ、そっちは見覚えのある仲介業者だな。何かトラブルか？"
"2003303-130-仲介業者" = "そ、それは……"
"2003303-131-商会長" = "なるほど。お主がこいつを仕向けて、ウチの商店街に「万魔殿特製おみやげ羽沼マコトセット」なんちゅうモンを仕入れるように指示したお偉いさんだな？"
"2003303-132" = "[s] \"……羽沼マコトセット？\""
"2003303-133-マコト" = "あぁ、たしかそんな製品も企画したな……それで、何が問題なのだ？"
"2003303-134-商会長" = "はっきり言わせてもらおう。#nこんな胡散臭い商品を仕入れるために、今の店を潰して建て替えるなんて言語道断。"
"2003303-135-商会長" = "いくらお主が店を買い取ったとはいえ、あまりにもひどい話だ！ご[ruby=ひいき]贔屓[/ruby]にしてくれている常連さんはどうしろと？商店街を守る立場として、このような仕打ちは決して許せん！"
"2003303-136-商店街の住人A" = "そうだ！そうだ！"
"2003303-137-商店街の住人B" = "会長の言う通りだ！"
"2003303-138-商店街の住人" = "好き勝手させるものか！"
"2003303-139-仲介業者" = "い、いくら何でもそこまで言われる筋合いは……！"
"2003303-140-マコト" = "なるほど……キシシッ。#nそれで、このマコト様の事業を邪魔しようと……そうかそうか。"
"2003303-141-マコト" = "まったく、仕方ない――"
"2003303-142" = "[s] \"ま、待って、マコト。あまり感情的には……\""
"2003303-143-マコト" = "皆、よく聞け！"
"2003303-144-マコト" = "我々の事業の目的は、あくまで万魔殿の名を広げることにある！#nそのためには、ゲヘナに住む皆と良い関係を築いていきたい。"
"2003303-145-マコト" = "……もちろん風紀委員会は例外だが。"
"2003303-146-マコト" = "今回は不本意ながら、こういったトラブルを発生させてしまい申し訳なかった。"
"2003303-147-マコト" = "商店街との争いは私も避けたい。不満があるようなら、聞き入れて対応する。"
"2003303-148-マコト" = "そして、お互いの妥協点を探るのはどうだ？"
"2003303-149-マコト" = "これなら問題ないだろう？"
"2003303-150-商店街の住人A" = "本当か！？"
"2003303-151-商会長" = "……お主は、それでいいのかい？"
"2003303-152-マコト" = "キシシッ、もちろんだ。マコト様は寛大かつ慈悲深いからな。"
"2003303-153-マコト" = "……あ、風紀委員会が相手の場合は例外だ。"
"2003303-154-商会長" = "……ウチらも熱くなって悪かった、感謝する！"
"2003303-155-マコト" = "ふん、これで一件落着か。"
"2003303-156" = "[s] \"さっきはビックリしたよ、本当にすごかった。\""
"2003303-157-マコト" = "……あぁ。"
"2003303-158-マコト" = "万魔殿のトップともなれば、あれくらい日常茶飯事だ。"
"2003303-159-マコト" = "リーダーたるもの、些細な出来事に振り回されてはならないからな。"
"2003303-160-マコト" = "それよりも……キキッ。#nこのマコト様の活躍を目にして、いよいよ万魔殿に協力する気になったか？"
"2003303-161" = "[s] \"それとこれは別かな。\""
"2003303-162-マコト" = "ぐっ！まだダメだったか！"
"2003303-163-マコト" = "……ふん、まあ良い。"
"2003303-164-マコト" = "先生の器には、この羽沼マコト様もまだ届かないというわけだな。"
"2003303-165" = "[s] \"それは過大評価のような……\""
"2003303-166-マコト" = "だが！マコト様は決して諦めない！"
"2003303-167-マコト" = "いつか……先生を私のモノにしてやる！"
"2003303-168-マコト" = "キキキッ……キャハハハハハッ！！そのときを待っているがいい！"
"2003303-169" = "[s] \"あ、うん……お手柔らかにね？\""
