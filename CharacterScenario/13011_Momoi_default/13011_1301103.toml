[translation]
"1301103-1" = "良いシナリオの条件"
"1301103-2" = "ミレニアム・ゲーム開発部"
"1301103-3" = "＜Gamemaniac：レトロなゲームでシナリオってそんなに重要？＞"
"1301103-4" = "＜Waga-mama：いやシナリオ古っ、このご時世にこれは無いわ＞"
"1301103-5" = "＜ikusa007：ヒロインはどうしたの？＞"
"1301103-6" = "＜tensaiko：最後にどんでん返しも無し？私でもこれより良いの書けそう＞"
"1301103-7" = "[s] \"……これ、何？\""
"1301103-8-モモイ" = "何も分かってないやつらが騒いでるの！"
"1301103-9" = "[s] \"どういうこと……？\""
"1301103-10-モモイ" = "順を追って説明すると、"
"1301103-11-モモイ" = "最近クラウドファンディングの流行で、レトロなゲームがいくつか作られるようになってきてるの。"
"1301103-12-モモイ" = "個人的にこの流れは応援したいっていうか。"
"1301103-13-モモイ" = "その挑戦をする人たちには、ぜひとも頑張ってほしいなって思ってるんだけど。"
"1301103-14-モモイ" = "見てこれ！"
"1301103-15-モモイ" = "新しく出るレトロ風ゲームに対して、みんなこうやって悪口ばかり言ってるの！"
"1301103-16" = "[s] \"わざわざ検索しなければいいんじゃ……？\""
"1301103-17-モモイ" = "そ、それは、ふと目に止まっちゃったっていうか……。"
"1301103-18-モモイ" = "ほら、何か月も放置して腐った食べ物とか、捨てる前に一応見てみたいじゃん……？"
"1301103-19-モモイ" = "そ、それに、好き好んで検索したわけじゃないし！"
"1301103-20-モモイ" = "あくまでも市場調査の一環っていうか……。"
"1301103-21-モモイ" = "それよりも！こいつら、めちゃくちゃなことばっかり！"
"1301103-22-モモイ" = "レトロなゲームなんだからシナリオなんて重要じゃないー、とか。"
"1301103-23-モモイ" = "どうして途中でヒロインが出てこなくなるのかー、とか！"
"1301103-24-モモイ" = "どんでん返しがなくてがっかりしたー、とか！"
"1301103-25" = "[s] \"うーん……。\""
"1301103-26-モモイ" = "そもそも評価の基準が薄っぺらいの！"
"1301103-27-モモイ" = "もしその通りだとすると、勇者が魔王を倒しに旅立つシナリオは王道的だからダサいってことにならない？"
"1301103-28-モモイ" = "お決まり通りは良くなくて、そこまでの流れを全部壊すような意外性とかどんでん返しとかがないと絶対にダメだなんて、そんなことある！？"
"1301103-29-モモイ" = "「良いゲームシナリオは、ユーザーにインパクトを残せるシナリオだ」とか、ふわふわしたそれっぽいこと言ってるけど、"
"1301103-30-モモイ" = "口だけならどうとでも言えるに決まってるでしょ！？"
"1301103-31-モモイ" = "そこまで分かってるなら文句ばっかり言ってないで、そっちだって書けばいいじゃん！？"
"1301103-32" = "[s] \"えっと、モモイ、落ち着いて……。\""
"1301103-33-モモイ" = "ふぅ、ふぅ……。"
"1301103-34-モモイ" = "うっ……"
"1301103-35" = "[s] \"うっ……？\""
"1301103-36-モモイ" = "うあああんっ！悔しい！悔しいよぉ！"
"1301103-37-モモイ" = "こんなこと言ってるようなやつらに、ガツンと衝撃を与えるようなシナリオを書いてやりたいのに！"
"1301103-38-モモイ" = "全然思ったように書けないし！自分で自分に腹が立つ！！"
"1301103-39" = "[s] \"締め切り前だったんだね……。\""
"1301103-40-モモイ" = "……ごめん、先生。"
"1301103-41-モモイ" = "勝手に一人で怒って、先生に八つ当たりして……。"
"1301103-42" = "[s1] \"ううん、\"\n[s2] \"むしろ嬉しいよ。\""
"1301103-43-モモイ" = "……嬉しい？どうして？"
"1301103-44-モモイ" = "……嬉しい？どうして？"
"1301103-45" = "[s] \"モモイが大変な時に、頼りにしてくれたってことだから。\""
"1301103-46-モモイ" = "……え、と、それは、その……。"
"1301103-47-モモイ" = "……うん、ありがとう。先生。"
"1301103-48-モモイ" = "実は、よく分かんなくなっちゃって。"
"1301103-49-モモイ" = "何を書けばいいのか、どう書けばいいのか。"
"1301103-50-モモイ" = "このままじゃ、ゲーム開発部のシナリオライターとして失格だよ……。"
"1301103-51" = "[s3] \"私には、シナリオのことはあんまり分からないけど……。\"\n[s4] \"一つだけ、思うところがあるとすれば……。\""
"1301103-52-モモイ" = "……？"
"1301103-53-モモイ" = "……？"
"1301103-54" = "[s5] \"モモイが書きたいと思ってるシナリオ、\"\n[s6] \"それがきっと、一番良いシナリオになるんじゃないかな。\""
"1301103-55-モモイ" = "……。"
"1301103-56-モモイ" = "……。"
"1301103-57-モモイ" = "そ、そっかー……ふーん……。"
"1301103-58-モモイ" = "私が書きたいと思ってるシナリオ……。"
"1301103-59-モモイ" = "うん、うん……！"
"1301103-60-モモイ" = "ちょっと分かってきたかも！"
"1301103-61-モモイ" = "よーーーし！やる気充電MAX！"
"1301103-62-モモイ" = "先生と話してたらちょっと頭がスッキリしたし、今なら書けそう！"
"1301103-63-モモイ" = "王道で、それでいて今までの王道を超えるような、私が書きたいシナリオ！"
"1301103-64-モモイ" = "今度また私のシナリオを読んで、感想を聞かせてね！先生！"
"1301103-65" = "[s] \"うん、楽しみにしてる。\""
"1301103-66" = "（それから数日後、モモイからメッセージが届いた）"
"1301103-67-モモイ" = "どうしよう先生！？"
"1301103-68-モモイ" = "せっかく浮かんだアイデアが思いっきり矛盾してて、それを打破する次のアイデアが全然浮かばない！助けてーー！"
"1301103-69-モモイ" = "うわあぁぁぁん！！！"
"1301103-70" = "（いつものモモイだった）"
