[translation]
"1301105-1" = "ももいろメモリアル"
"1301105-2" = "（モモイとの約束の場所に着いた）"
"1301105-3-モモイ" = "ピピーッ！先生、5分遅刻！「好感度が下がりました」！"
"1301105-4" = "[s1] \"ごめんね、ちょっと道が混んでて……。\"\n[s2] \"好感度……？\""
"1301105-5-モモイ" = "ゲームにおいて言い訳は効かないんだからね！それと、さっきモモトークで話した通り、"
"1301105-6-モモイ" = "ゲームにおいて言い訳は効かないんだからね！それと、さっきモモトークで話した通り、"
"1301105-7-モモイ" = "今日は一緒に、レトロな「恋愛シミュレーション」を体験するよ！あ、もう始まってるから！"
"1301105-8" = "[s] \"レトロな恋愛シミュレーション？\""
"1301105-9-モモイ" = "実はゲーム開発部で、もっと色んなジャンルのレトロゲームを研究して、"
"1301105-10-モモイ" = "今度、幾つかのゲームを試しに作ってみようって話が出てね。"
"1301105-11-モモイ" = "その中に、恋愛シミュレーションゲームの話もあったの。"
"1301105-12" = "[s] \"なるほど。\""
"1301105-13-モモイ" = "そう、それでね、"
"1301105-14-モモイ" = "恋愛シミュレーション、それに恋愛アドベンチャーゲームって、ゲームの中でもシナリオの比重が大きいゲームでしょ？"
"1301105-15-モモイ" = "ほら、特定のイベントで選択肢を選んだり、行く場所やタイミングによって、"
"1301105-16-モモイ" = "好感度が変化して、エンディングに影響を与えたりするし。"
"1301105-17" = "[s] \"なるほど、じゃあさっきの「好感度」っていうのは……。\""
"1301105-18-モモイ" = "そういうこと！で、先生への今の好感度は－5！"
"1301105-19-モモイ" = "このままだとマズいよ？"
"1301105-20-モモイ" = "正しい選択肢を選んでいかないとスチルも開けられないし、ハッピーエンドにもたどり着けないんだから！"
"1301105-21-モモイ" = "さあ、先生！"
"1301105-22-モモイ" = "良いゲームを作るために、恋愛シミュレーションを始めよう！"
"1301105-23" = "[s] \"うん、じゃあ喜んで。\""
"1301105-24-モモイ" = "えへへっ、それじゃあレッツゴー！"
"1301105-25" = "[ns] \"ゲームセンター？\""
"1301105-26-モモイ" = "うん、そう！"
"1301105-27-モモイ" = "それじゃあ、最初の選択肢だよ！"
"1301105-28-モモイ" = "あなたはヒロインと一緒にゲームセンターに来ました。"
"1301105-29-モモイ" = "まずは何をしますか？"
"1301105-30" = "[ns3] \"クレーンゲームでもする？\"\n[ns4] \"ここは『ワンダーガール モンスターワールド』でしょ！\""
"1301105-31-モモイ" = "ブブーッ！好感度－5！"
"1301105-32-モモイ" = "ヒロインはクレーンゲームにあまり興味がありませんでした！"
"1301105-33" = "[s5] \"でも、モモイにプレゼントをあげたくて……。\""
"1301105-34-モモイ" = "えっ……あ、そうなの？"
"1301105-35-モモイ" = "せ、先生がそこまで言うなら……。"
"1301105-36-モモイ" = "まあ、良いかな……？"
"1301105-37-モモイ" = "じゃあその気持ちを汲んで、好感度＋10にしてあげるね！"
"1301105-38" = "[s6] \"結構ざっくりなんだね……。\""
"1301105-39-モモイ" = "細かいことはいいの、ほらゴーゴー！"
"1301105-40-モモイ" = "わっ！心が通じた！！"
"1301105-41-モモイ" = "先生への好感度＋500だよ！"
"1301105-42" = "[s7] \"そんなに一気に上げて良いの！？\""
"1301105-43-モモイ" = "うん、ちょうどワンダーガールのワンコインクリアにチャレンジしてみたかったし！"
"1301105-44" = "[s8] \"じゃあどっちが先にクリアできるか勝負だね！\""
"1301105-45-モモイ" = "あははっ！その挑戦、受けて立つよ！"
"1301105-46-モモイ" = "いざ尋常に勝負！"
"1301105-47-モモイ" = "ふー、ゲームセンターでたくさん遊んだらお腹空いたなぁ……。"
"1301105-48-モモイ" = "（チラッ、チラッ）"
"1301105-49" = "[s] \"じゃあ、次はお昼食べに行こうか？\""
"1301105-50-モモイ" = "うん、正解！"
"1301105-51-モモイ" = "さて、今ヒロインはお腹ペコペコです！"
"1301105-52-モモイ" = "どんな料理を食べますか？"
"1301105-53" = "[s9] \"デートの定番と言えばパスタかな？\"\n[s10] \"あっ、モモイ見て。『ゼルナの伝説』のコラボだって。\""
"1301105-54-モモイ" = "で、デートの定番……！"
"1301105-55" = "[s11] \"どうしたの？もしかして、パスタ苦手？\""
"1301105-56-モモイ" = "な、なんでもない！大丈夫っ！"
"1301105-57-モモイ" = "良いね、定番は良いことだよ、うん！良い選択だね！"
"1301105-58-モモイ" = "好感度＋150にしてあげる！行こ！"
"1301105-59" = "[s12] \"えっと、このカップルメニューを30分で食べきれば……\""
"1301105-60-モモイ" = "……全部、タダ？"
"1301105-61-モモイ" = "これは、ゲーマーとして挑戦するしかないよ先生！"
"1301105-62" = "[s13] \"え、ゲーマーとして？\""
"1301105-63-モモイ" = "チャレンジだもん！挑戦だよ、クエストだよ！"
"1301105-64-モモイ" = "え、嘘！？本当だ！"
"1301105-65-モモイ" = "特製激辛カレーを食べきれたら、『ゼルナの伝説』に出てくる「マスターブレイド」の風船を景品としてプレゼント……。"
"1301105-66-モモイ" = "行こう、先生！"
"1301105-67" = "[s14] \"えっと、選択肢は正解だったの？\""
"1301105-68-モモイ" = "うん！好感度＋1億！だから早く！"
"1301105-69-モモイ" = "あ、「在庫に限りがあります」って書いてある……！"
"1301105-70-モモイ" = "無くなる前に早く行かないと！"
"1301105-71" = "[s15] \"その好感度システム、バグってない？\""
"1301105-72-モモイ" = "いいから早く！これは挑戦だよ！私たちに対しての挑戦！"
"1301105-73-モモイ" = "これもゲームの一環、絶対にクリアしなきゃ！"
"1301105-74" = "（モモイと一緒にそのメニューに挑戦することになった）"
"1301105-75-モモイ" = "はふっ、はむっ！もぐもぐ……ごくん！美味しい！"
"1301105-76" = "[s] \"確かに美味しいけど、モモイ、これ以上は……。\""
"1301105-77-モモイ" = "ダメ！頑張って先生！ゴールは目の前だよ！"
"1301105-78" = "[s] \"モモイ、私ね、この食事が終わったら故郷に帰って……\""
"1301105-79-モモイ" = "先生ストップ！"
"1301105-80-モモイ" = "そのフラグだけは絶対ダメ！！"
"1301105-81" = "（何とかモモイと二人で食べきることができた）"
"1301105-82-モモイ" = "んんーっ、今日はたくさん歩き回ったね～。"
"1301105-83-モモイ" = "先生と一緒で、一日中楽しかった！"
"1301105-84" = "[s] \"それは良かった。ところで、エンディングは？\""
"1301105-85-モモイ" = "……エンディング？何の話？"
"1301105-86" = "[s] \"確か好感度によってエンディングが変わるんだよね？\""
"1301105-87-モモイ" = "……あっ、そうだ！そうだった！"
"1301105-88-モモイ" = "夢中になって、すっかり忘れてた……。"
"1301105-89-モモイ" = "今日の最終的な先生への好感度は、えーっと……。"
"1301105-90-モモイ" = "は、ハッピーエンドってことで！パチパチパチ、おめでとう！"
"1301105-91-モモイ" = "良かったね先生！ヒロインの攻略に成功したよ！"
"1301105-92" = "[s] \"……モモイ？\""
"1301105-93-モモイ" = "あ、あはっ、あははっ……。"
"1301105-94" = "[s] \"まあでも、モモイが楽しかったのなら良かった。\""
"1301105-95-モモイ" = "えっ、急に何その大人の対応！？"
"1301105-96-モモイ" = "ごくり、こ、これが上級者……？"
"1301105-97" = "[s16] \"そういえば好感度って言ってたけど、\"\n[s17] \"あれってモモイの気持ちで動くんだよね？\""
"1301105-98-モモイ" = "え、うん。"
"1301105-99-モモイ" = "え、うん。"
"1301105-100" = "[s] \"じゃあ、「ヒロインの攻略に成功した」ってことは……。\""
"1301105-101-モモイ" = "（あっ、えっ！？た、確かによく考えてみたら、そういうことかも……！？）"
"1301105-102-モモイ" = "ご、ごめん先生、急用を思い出しちゃった！じゃあまたっ！"
"1301105-103" = "（引き留める間もなく、モモイは風のように去ってしまった）"
