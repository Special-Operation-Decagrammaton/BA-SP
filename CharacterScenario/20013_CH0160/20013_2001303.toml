[translation]
"2001303-1" = "ハッキングの方法"
"2001303-2" = "中央区・第1業務地区付近"
"2001303-3-チヒロ" = "あっ、先生。"
"2001303-4-チヒロ" = "色々忙しい中でありがと。"
"2001303-5-チヒロ" = "先生がいれば、きっと上手くいくはず。"
"2001303-6" = "[s1] \"ヴェリタスの手伝いなんて、ちょっと緊張するな。\"\n[s2] \"私にできるかな……。\""
"2001303-7-チヒロ" = "そんな心配しなくても大丈夫だって。"
"2001303-8-チヒロ" = "そんな心配しなくても大丈夫だって。"
"2001303-9-チヒロ" = "モモトークでも言ったでしょ、ただ隣にいてくれれば良いから。"
"2001303-10-チヒロ" = "で、取引相手はこの高層ビルに入ってるIT企業。"
"2001303-11-チヒロ" = "最近サーバーを一気に増設したり色々と変えてるせいで、セキュリティ面が心配なんだけど……社長が頑固なせいか、信頼して生徒相手にデータを任せてくれないみたいで。"
"2001303-12" = "[s3] \"なるほど。ところでどこから侵入するの？\"\n[s4] \"ダクトとかから？\""
"2001303-13-チヒロ" = "え、何言ってるの？普通にエントランスから入るけど。"
"2001303-14-チヒロ" = "え、何言ってるの？普通にエントランスから入るけど。"
"2001303-15-チヒロ" = "スパイごっこは今日は無し。普通に大切な取引だからね。"
"2001303-16-チヒロ" = "あらためまして、ミレニアムサイエンススクールの[ruby=かがみ]各務[/ruby]チヒロです。"
"2001303-17-チヒロ" = "御社のセキュリティに関して、少々お話をさせていただきたく。"
"2001303-18-気難しい社長" = "……入りたまえ。"
"2001303-19-チヒロ" = "……じゃ、始めようか。"
"2001303-20-チヒロ" = "ああ、念のためだけど、先生の方から無理に何か言い出したりしなくて大丈夫。"
"2001303-21-チヒロ" = "私の話に対して、適当に返事とかしてくれればそれでOKだから。じゃあ、行こっか。"
"2001303-22-チヒロ" = "……それで、我々の会社のデータが危ないと？"
"2001303-23-チヒロ" = "はい。今回御社が新たに設置したサーバーは、旧型のウイルス対策ソフトを使用しています。すでにハッカーたちの中では、完全に破壊しつくしているものです。"
"2001303-24-チヒロ" = "この状態でスプーフィングなどの何かしらの攻撃を受けた暁には、会社内の情報はもちろんのこと、協力会社さんの情報まで漏洩してしまうでしょう。"
"2001303-25-チヒロ" = "……もちろん、現在ご用意されている「新規プロジェクト」の極秘文書も。"
"2001303-26-気難しい社長" = "……ふむ、それは困ったな。確かに、何かしらの対処は必要かもしれない。"
"2001303-27-気難しい社長" = "しかしだからと言って、それを君たちヴェリタスに任せるという論理にはならないだろう？"
"2001303-28-気難しい社長" = "色々と優秀だとは聞くが、君たちは所詮学校の部活。つまりはアマチュアだ。"
"2001303-29-チヒロ" = "論理のお話で言えば、学生だからといってそれがアマチュアを意味するわけではありません。ヴェリタスはすでにキヴォトスの多くのIT企業との仕事において、セキュリティ面で確かな結果を残しています。"
"2001303-30-チヒロ" = "そしてここにいるシャーレの先生もまた、その顧客のひとりです。"
"2001303-31" = "[s5] \"そ、そうです！\"\n[s6] \"ヴェリタスのソリューションはパーフェクトですよ。\""
"2001303-32-気難しい社長" = "シャーレ……あの連邦生徒会長が超法規的権限を与えたという、例の連邦捜査部か？"
"2001303-33-気難しい社長" = "シャーレ……あの連邦生徒会長が超法規的権限を与えたという、例の連邦捜査部か？"
"2001303-34-気難しい社長" = "……確かに、シャーレは複数の学校との深い交流があると聞く。だとすれば、実力は疑うべくもない。"
"2001303-35-気難しい社長" = "しかし、君はまだ若い。おいそれと機密情報の管理を任せるのは……"
"2001303-36" = "[s7] \"チヒロの腕は確かです。\"\n[s8] \"何も無いと保証できますが、万が一があればその時は私が。\""
"2001303-37-気難しい社長" = "……そうか。"
"2001303-38-気難しい社長" = "よろしい、ではまず一年間の契約から始めよう。"
"2001303-39-気難しい社長" = "君のような生徒だけだったら、首を縦に振ることは無かったかもしれないが……。"
"2001303-40-気難しい社長" = "シャーレの先生とやら、そちらへの信頼も合わせて託させてもらおう。"
"2001303-41-チヒロ" = "ありがとうございます。責任をもって誠実に対応します。"
"2001303-42-チヒロ" = "ふう、一件落着。"
"2001303-43-チヒロ" = "おかげで、しばらく資金的には何も心配しなくて良さそうかな。"
"2001303-44" = "[s] \"結局、チヒロは何を仕込んでたの……？\""
"2001303-45-チヒロ" = "ん？最初に言ったとおりだよ、「バックドア」。"
"2001303-46-チヒロ" = "つまり、正規の入り口とは別の「裏口」のこと。ファイアウォールなんかを迂回する時に使う、基本的なハッキング技術の一つ。"
"2001303-47-チヒロ" = "今回は先生がその「バックドア」になってくれたってこと。あの社長の「偏見」っていうファイアウォールを迂回するためのね。"
"2001303-48" = "[s] \"なるほど。でもこれはハッキングじゃないような……？\""
"2001303-49-チヒロ" = "ううん、これも立派なハッキングの一つだよ。"
"2001303-50-チヒロ" = "ハッキングっていうのは、「求める情報を得るために、様々な方法で相手の[ruby=警戒心]セキュリティ[/ruby]を無効化し、解放する」こと。"
"2001303-51-チヒロ" = "会話を通じて信頼を構築する手間を惜しまなければ、それが単純かつ明快で、最高のハッキング。不正な方法や電子的な手段に頼る必要なんてないんだよ。"
"2001303-52-チヒロ" = "実際ヴェリタスのメンバーのほとんどは、こういうのが出来ないまま変な方向にばっかり成長して困ってるわけだけど……。"
"2001303-53-チヒロ" = "だからこそ私がお手本にならないとね。とにかく今日はありがとう。次会った時、コーヒーでも奢るよ。"
