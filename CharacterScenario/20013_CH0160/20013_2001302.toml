[translation]
"2001302-1" = "セキュリティチェック"
"2001302-2" = "シャーレ・オフィス"
"2001302-3" = "幾つかの仕事を終えてオフィスへ戻ると、チヒロがPCの前に座っていた。"
"2001302-4" = "[ns1] \"チヒロ、お疲れ様。\"\n[ns2] \"例のメンテナンスの件はどう？\""
"2001302-5-チヒロ" = "うん、それ自体は問題無し。"
"2001302-6-チヒロ" = "うん、それ自体は問題無し。"
"2001302-7-チヒロ" = "ログを洗って、キャッシュを確認しておきたいだけだったから。"
"2001302-8-チヒロ" = "幸いにも今のところは、誰かがサーバーに侵入した記録も無いし。変なウイルスとかも無かった。"
"2001302-9-チヒロ" = "……でも、問題が無いってわけじゃない。"
"2001302-10" = "[s] \"問題……？\""
"2001302-11-チヒロ" = "……"
"2001302-12-チヒロ" = "先生のセキュリティ意識の問題！"
"2001302-13-チヒロ" = "どうしてPCのパスワードが、モニターのところに書かれてるの！？"
"2001302-14" = "[s] \"複雑なパスワードは覚えられなくって……。\""
"2001302-15-チヒロ" = "だからってこんな、誰でも見られるところに書いておくなんてダメ！"
"2001302-16-チヒロ" = "もし悪意のある誰かにこれが見られたら、先生やシャーレのことはもちろん、関係のある生徒たちの記録まで流出するかもしれないのに……。"
"2001302-17-チヒロ" = "シャーレは超法規的権限を持ってるんだから、その辺もちゃんとしないと。"
"2001302-18-チヒロ" = "先生は自分がどれだけ重要な情報を扱ってるのか、もっと自覚した方が良い。"
"2001302-19" = "[s] \"ごめんなさい……。\""
"2001302-20-チヒロ" = "まあさっきも言った通り、今のところは大丈夫そうだったから良いけど……。"
"2001302-21-チヒロ" = "これからは気を付けないと。"
"2001302-22-チヒロ" = "ほら、先生。パスワードを新しくして。多少覚えやすいものでも良いから。"
"2001302-23" = "[s3] \"1、2、3、4……\"\n[s4] \"q、w、e、r……\""
"2001302-24-チヒロ" = "……ちょっと。"
"2001302-25-チヒロ" = "……ちょっと。"
"2001302-26-チヒロ" = "そんな誰でも使うような、強度の低いパスワードじゃ意味無い！"
"2001302-27" = "[s] \"覚えやすいかなって……。\""
"2001302-28-チヒロ" = "覚えやすさもある程度大事だけど、「多少」って言ったでしょ！"
"2001302-29-チヒロ" = "きちんと先生にしか分からないような、特別な文字列とか数字じゃないと。"
"2001302-30" = "[s] \"……自分の誕生日とか？\""
"2001302-31-チヒロ" = "それもダメ！明確に先生を狙ってるハッカーだったら、それも漏れてるはず。"
"2001302-32-チヒロ" = "セキュリティにおける初歩の初歩だよ、先生……。"
"2001302-33-チヒロ" = "そういうのじゃない文字列で。それとできれば特殊文字を入れつつ、大文字と小文字も混ぜて。"
"2001302-34-チヒロ" = "そうしないと、簡単なマクロとかで開けられかねないから。"
"2001302-35" = "[s5] \"そうなんだ……。\"\n[s6] \"大変だね、セキュリティ……。\""
"2001302-36-チヒロ" = "大変でもやるの。PCのパスワードは玄関のカギと同じ。"
"2001302-37-チヒロ" = "大変でもやるの。PCのパスワードは玄関のカギと同じ。"
"2001302-38-チヒロ" = "それを雑に扱うのは、玄関の鍵を郵便ポストに入れておくような行為だよ。"
"2001302-39" = "[s] \"……。\""
"2001302-40-チヒロ" = "その顔……ねえ、まさかとは思うけど先生。エントランスの鍵を郵便ポストに入れてたりしないよね？"
"2001302-41-チヒロ" = "はぁ……ネットワーク系の問題だけじゃないなんて……。"
"2001302-42-チヒロ" = "……もう、一からセキュリティの概念について説明するから。ちゃんと聞いて。"
"2001302-43" = "その後チヒロから数十分にわたって、セキュリティ意識に関するお説教をもらった。"
