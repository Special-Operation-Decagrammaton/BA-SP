[translation]
"2601603-1" = "ある書記によると"
"2601603-2-チアキ" = "ふむ。やっぱり海は水が多いですね！"
"2601603-3-チアキ" = "まず一つ、事実を確認しました！"
"2601603-4" = "[s] \"千里の道も一歩から、だね！\""
"2601603-5-チアキ" = "はい！では行きましょう！"
"2601603-6-観光客A" = "ひそひそ、うんたらかんたら……。"
"2601603-7-観光客B" = "ひそひそ、うんたらかんたら……。"
"2601603-8-観光客A" = "こんにちは！「週刊万魔殿」です！"
"2601603-9-チアキ" = "突然ですが、お時間大丈夫ですか？いくつかお伺いしたいことがありまして！"
"2601603-10-観光客A" = "取材ってこと？別にいいけど……。"
"2601603-11-チアキ" = "ありがとうございます！では――"
"2601603-12-チアキ" = "さっき、お二人は「ひそひそ、うんたらかんたら」とおっしゃっていましたが！"
"2601603-13-チアキ" = "どういう意味なんですか？"
"2601603-14-観光客A" = "え？知らないの？"
"2601603-15-観光客B" = "ここで「ひそひそ、うんたらかんたら」って言えば願いが叶うんだって！"
"2601603-16-観光客A" = "私たちもその伝説を聞いて来たクチなんだ。"
"2601603-17-観光客A" = "ここは、知る人ぞ知る名所なんだよ！"
"2601603-18-チアキ" = "隠れた名所に眠る……海にまつわる伝説！"
"2601603-19-チアキ" = "なんと！これはスクープですね！えっと、メモ帳は――"
"2601603-20-チアキ" = "あ、あれ？"
"2601603-21" = "[s] \"なにか問題でもあった？\""
"2601603-22-チアキ" = "は、はい……大問題です……！"
"2601603-23-チアキ" = "メモ帳を……忘れてしまいました……！"
"2601603-24-チアキ" = "手元にあるのは石のコースターだけ……。"
"2601603-25" = "[s] \"あ、本当だ……ちょっと似てる……。\""
"2601603-26-チアキ" = "こんな時に限ってスマホも電池切れですし……。"
"2601603-27-チアキ" = "あ、あるのはペンだけ……。"
"2601603-28-チアキ" = "もう手のひらに書くしか……！"
"2601603-29-観光客B" = "そういえば、夜になるとあっちの森から変な音が聞こえるらしいけど……。#nそれは取材した？"
"2601603-30-観光客B" = "ああ、あれか。みんな怖がってるよね。"
"2601603-31-チアキ" = "他にも面白そうな話が！？"
"2601603-32-チアキ" = "せ、先生の手のひらも貸してくれませんか？"
"2601603-33-チアキ" = "他の場所でもいいので！忘れる前にメモしないと……！"
"2601603-34" = "[s1] \"ストップ、ストップ！\"\n[s2] \"落ち着いて、チアキ。\""
"2601603-35-チアキ" = "でも、こんな特ダネを記憶に頼って書くわけにはいかないです！"
"2601603-36-チアキ" = "色んな話がごちゃまぜになって、思い出せなくなっちゃうかも！"
"2601603-37-チアキ" = "背に腹は代えられません！私の背中にも書いてください！"
"2601603-38" = "[s] \"いったん身体に書くことから離れようか！？\""
"2601603-39-チアキ" = "で、ですが……足元には砂しかないのに、他のどこに書けば――"
"2601603-40-チアキ" = "うん？砂？"
"2601603-41-チアキ" = "そっか、その手がありました！"
"2601603-42-観光客B" = "――だから、コンビーフの缶はあんな形なんだよ！"
"2601603-43-観光客A" = "なるほど、そうだったんだ！"
"2601603-44-チアキ" = "途中から海とは全然関係なくなりましたが、興味深いお話ですね！"
"2601603-45-観光客B" = "あっ、そろそろ集合時間だ！"
"2601603-46-観光客B" = "私たちはもう行くね！記事書くの頑張って！"
"2601603-47-観光客B" = "はい！お話いただいた内容は全て砂浜に書かせていただきました！"
"2601603-48-チアキ" = "取材協力感謝します！またお会いしましょう～！"
"2601603-49-チアキ" = "いやぁ～！あっという間でしたね！"
"2601603-50-チアキ" = "砂浜に文字を残すとは、我ながら良い作戦でした！"
"2601603-51-チアキ" = "あとはカメラでパシャリ！と撮れば完璧です！"
"2601603-52-チアキ" = "それでは、砂の皆さんー！はい、チーズ！"
"2601603-53-チアキ" = "え……？"
"2601603-54-チアキ" = "あ、あああっー！！"
"2601603-55-チアキ" = "あ……あ……。"
"2601603-56" = "[s3] \"チアキ、大丈夫！？\"\n[s4] \"急に波が来たけど……。\""
"2601603-57-チアキ" = "アンドゥ……できない……？"
"2601603-58-チアキ" = "全部……パァに……。"
"2601603-59-チアキ" = "う、嘘ですよね……？"
"2601603-60" = "[s] \"チアキ、しっかりして！！\""
"2601603-61-チアキ" = "……へ？"
"2601603-62" = "（その後、落ち込むチアキを精一杯慰めた）"
"2601603-63" = "（代わりに最近の出来事を話したら、すぐに元気を取り戻してくれた）"
