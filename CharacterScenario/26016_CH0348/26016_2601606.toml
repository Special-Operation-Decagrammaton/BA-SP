[translation]
"2601606-1" = "NC、ND。"
"2601606-2-チアキ" = "特集記事の最後は――"
"2601606-3-チアキ" = "先生の刺激的なネタが……ちょっぴり欲しいな～なんちゃって。"
"2601606-4" = "[ns] \"やっぱり、それが目的だったんだね！\""
"2601606-5-チアキ" = "いえいえいえー！目的というか、取材はあくまで過程ですので！"
"2601606-6-チアキ" = "そういうわけで、最近何かないですか？気になる人とか？"
"2601606-7-チアキ" = "それか、変なポーズで被写体になってくれるのでもいいですよ？"
"2601606-8" = "[s] \"無難な記事で十分だから！\""
"2601606-9-チアキ" = "特集はインパクトが大事なのにぃー！"
"2601606-10-チアキ" = "ちぇー"
"2601606-11" = "[s1] \"私は持ってきた仕事をするから、チアキも最終調整がんばってね。\"\n[s2] \"言っておくけど、スクープは渡さないから！\""
"2601606-12-チアキ" = "減るもんじゃないでしょーに！"
"2601606-13" = "[s] \"減るよ！名誉とか、尊厳とか！もう減ってるし！\""
"2601606-14-チアキ" = "あははっ！"
"2601606-15" = "（ノートパソコンで仕事をしていると……）"
"2601606-16" = "（隣でチアキがむくっとした顔をして、こちらをにらんでいた）"
"2601606-17-チアキ" = "あの……こんなことを言うのは失礼ですが……。"
"2601606-18-チアキ" = "集中して面白い表情になるかと思ったのに、隙がないですね……。"
"2601606-19" = "[s] \"私はスクープにはならない！\""
"2601606-20-チアキ" = "ちぇー"
"2601606-21-チアキ" = "うーん。"
"2601606-22-チアキ" = "！"
"2601606-23-チアキ" = "ああー！先生！テーブルの下にコインを落としちゃいました！"
"2601606-24-チアキ" = "ちょっと拾ってくれませんか？先生の方に転がっちゃって！"
"2601606-25" = "[s3] \"そうなの？分かった！\"\n[s4] テーブルの下に入る。"
"2601606-26-チアキ" = "かかりましたねっ！"
"2601606-27-チアキ" = "えいっ！"
"2601606-28" = "[wa:450]― [log=치아키 수영복]ふふっ！[wa:960]スキあり！[wa:1020]シャッターチャンス！[/log]"
"2601606-29" = "― [log=치아키 수영복]あはっ！[wa:830]先生、[wa:960]小さく丸まっちゃって……[/log]"
"2601606-30" = "― [log=치아키 수영복]これは表紙に[wa:860]ピッタリの構図ですね！[/log]"
"2601606-31" = "― [log=치아키 수영복]ふっ[wa:510]ふ～ん！[/log]"
"2601606-32" = "― [log=치아키 수영복]スクープがなければ[wa:1460]作ればいいんです！[/log]"
"2601606-33" = "[ns] \"ち、チアキ！？コインはどこにいったの？\""
"2601606-34" = "#wait;1000"
"2601606-35" = "[wa:1060]― [log=치아키 수영복]チッ[wa:420]チッ[wa:360]チッ[wa:320]チッ[wa:340]チッ～！[wa:1260]甘いですね！[/log]"
"2601606-36" = "― [log=치아키 수영복]落としたのは[wa:1840]これのキャップです！[/log]"
"2601606-37" = "― [log=치아키 수영복]文字通り[wa:1110]一銭もかけずに[wa:950]おいしい場面になりましたね！[/log]"
"2601606-38" = "[wa:770]― [log=치아키 수영복]面白くない先生は[wa:3450]「テーブルの下閉じ込めの刑」に処します！[/log]"
"2601606-39" = "― [log=치아키 수영복]もっと面白いネタを[wa:1440]教えてくれたら[/log]"
"2601606-40" = "― [log=치아키 수영복]解放してあげないことも、[wa:2840]ないですよ？[/log]"
"2601606-41" = "― [log=치아키 수영복]あれ、[wa:920]どうしました？[/log]"
"2601606-42" = "― [log=치아키 수영복]目をそらして……。[/log]"
"2601606-43" = "[ns] \"それが……目のやり場に困るというか……。\""
"2601606-44" = "[wa:610]― [log=치아키 수영복]まだインタビュー中ですよ！[/log]"
"2601606-45" = "― [log=치아키 수영복]ちゃんとこっちを見てください！[/log]"
"2601606-46" = "― [log=치아키 수영복]なんでこっちみてくれないんですかぁ？[/log]"
"2601606-47" = "― [log=치아키 수영복]って、[wa:1340]これ……！[/log]"
"2601606-48" = "[wa:4470]― [log=치아키 수영복]ひゃあああっ！[/log]"
"2601606-49" = "― [log=치아키 수영복]ちょっ！[wa:610]見ちゃダメですっ！[/log]"
"2601606-50" = "[wa:1000]― [log=치아키 수영복]出るのもダメ！[/log]"
"2601606-51" = "― [log=치아키 수영복]じっとしててください！[/log]"
"2601606-52" = "（周りの人たちが少なくなるまで、そのままテーブルの下に閉じ込められた）"
"2601606-53" = "（その後……チアキは急用を思い出したと言って、逃げるように帰っていった）"
