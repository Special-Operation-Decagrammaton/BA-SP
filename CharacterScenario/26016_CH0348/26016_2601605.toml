[translation]
"2601605-1" = "最近の調査によると"
"2601605-2-チアキ" = "案の定、答えは浜辺にありましたか。"
"2601605-3-チアキ" = "弾む気持ち！眩しい太陽！そして、デンジャラスな海！"
"2601605-4-チアキ" = "まさに、ブルーオーシャンってやつですね！"
"2601605-5" = "[s1] \"うん。本物のブルーオーシャンだね。\"\n[s2] \"ネタがなくても、気分転換として楽しもう！\""
"2601605-6-チアキ" = "よーし！今日はいっぱいスクープ見つけますよ！"
"2601605-7-チアキ" = "いざ、参りましょう！"
"2601605-8-チアキ" = "どれどれ！何かあるかなー？"
"2601605-9-観光客A" = "すげぇ、こんなデカいの初めて見たぞ。"
"2601605-10-観光客B" = "へー。実物ってこんな感じなんだー"
"2601605-11-チアキ" = "はっ！スクープのニオイが！"
"2601605-12-観光客A" = "すみませ～ん！「週刊万魔殿」です！ちょっと取材よろしいですか？"
"2601605-13-観光客A" = "取材？別にいいけど……。"
"2601605-14-観光客B" = "「週刊万魔殿」……？ああ、友達が鍋敷きに使ってたあれか。"
"2601605-15-チアキ" = "おお！読者の要望通り、耐熱紙に換えた甲斐がありますね！"
"2601605-16-チアキ" = "皆さん集まって何を見てるんですか？"
"2601605-17-観光客A" = "これだよ。"
"2601605-18-観光客B" = "機雷が浜辺まで流れてきたんだ。"
"2601605-19" = "[ns] \"機雷！？爆発するあれ！？\""
"2601605-20-観光客B" = "い、いきなり大きい声出すなよ。当たり前だろ？"
"2601605-21-観光客A" = "でも、これは不良品みたいだな。"
"2601605-22" = "[ns] \"これなら十分スクープになるんじゃない？\""
"2601605-23-チアキ" = "うーん、微妙ですね……。"
"2601605-24-チアキ" = "ネタとしてはあと一歩……いや二歩……。"
"2601605-25-観光客B" = "いや、不良品じゃないかもよ？"
"2601605-26-観光客B" = "でもほら、全然起爆しないじゃん。"
"2601605-27-観光客A" = "銃床で叩いたくらいじゃ、こんなデカいの爆発しないって。"
"2601605-28-チアキ" = "機雷くらい浜辺でよく見かけますし、特集記事にするにはちょっと……。"
"2601605-29-チアキ" = "いいねを10個くらいもらえたら御の字ってところでしょうか。"
"2601605-30-チアキ" = "他を探してみましょう……。"
"2601605-31" = "[s] \"う、うん……！\""
"2601605-32-チアキ" = "ここには面白そうなものあるかなー？"
"2601605-33-チアキ" = "あ、さっきの機雷は不良品じゃなかったみたいですね。"
"2601605-34" = "[s] \"結局爆発するの！？\""
"2601605-35-チアキ" = "まあ、元々爆発させるためのものですから。"
"2601605-36-チアキ" = "こっちにも人が集まっていますが……。"
"2601605-37-チンピラA" = "どけ、てめえら！ここはうちらの縄張りだ！"
"2601605-38-ヘルメット団A" = "ふざけんな！先に来たのはこっちだぞ！"
"2601605-39-ヘルメット団A" = "お前ら！こいつら全員海に沈めてやれ！"
"2601605-40" = "[ns3] \"け、喧嘩だ！\"\n[ns4] \"これならスクープ……っていうか止めないと！\""
"2601605-41-チアキ" = "うーむ……これも微妙ですねー"
"2601605-42-チアキ" = "喧嘩なんて、ゲヘナでは爪を切ることより日常茶飯事ですよ。"
"2601605-43-チアキ" = "ああ……スクープ……いずこに……。"
"2601605-44" = "[s] \"ちょーローテンション！？\""
"2601605-45-チアキ" = "はあ……。"
"2601605-46" = "（その後も辺りを見て回ったものの……）"
"2601605-47" = "（スクープになりそうなものはなく、チアキのテンションは下がったままだった）"
"2601605-48-チアキ" = "虚しい……。"
"2601605-49-チアキ" = "スクープのない週刊万魔殿は、この波の音のように虚しい……。"
"2601605-50-チアキ" = "ハハ、アハハハ……。"
"2601605-51" = "[s] \"ま、まだ散歩は終わってないから……！\""
"2601605-52-チアキ" = "あはは！本当はそこまで落ち込んでないので大丈夫ですよ。"
"2601605-53-チアキ" = "最終手段として、マコト先輩と30分くらい歩くと色んなネタが出てき……。"
"2601605-54-チアキ" = "ますし……？"
"2601605-55-チアキ" = "お、おお！？"
"2601605-56-チアキ" = "スクープ発見！！！"
"2601605-57-チアキ" = "見てください、先生！この昆布の長さ！！"
"2601605-58-チアキ" = "これは……ゲヘナ史上最長かも！！"
"2601605-59" = "[s] \"すごいけど……スクープなの……？\""
"2601605-60-チアキ" = "読者の皆さん、大興奮間違いなしです！さっすが、先生は最高のパートナーです！"
"2601605-61-チアキ" = "昆布の隣に寝るので、写真撮ってください！#nこの圧倒的長さを読者に伝えたいんです！"
"2601605-62-チアキ" = "はい、こーんぶ！"
"2601605-63" = "（チアキが喜んでいて何よりだった）"
"2601605-64" = "（ハイテンションなチアキと一緒にシャーレに帰った）"
