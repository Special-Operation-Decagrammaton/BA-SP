[translation]
"1013103-1" = "アイスホッケー"
"1013103-2-タカネ" = "ようこそいらっしゃいました、先生！"
"1013103-3" = "[s] \"お邪魔しま～す！\""
"1013103-4-タカネ" = "それでは早速、上映室へ行きましょうか。"
"1013103-5-タカネ" = "え？ここで観るんじゃないのかって？#nいえ、ここはあくまで作業場ですわ。"
"1013103-6-タカネ" = "何より、こちらには映像を流す設備がありませんし。"
"1013103-7-タカネ" = "さあ！こちらへどうぞ！"
"1013103-8" = "[ns] \"えっ……？なんか、すごい設備だね？\""
"1013103-9-タカネ" = "先生がお越しになるのですから。このくらいは当然用意いたしますわ。"
"1013103-10" = "[s1] \"気持ちはありがたいけど……。\"\n[s2] \"出版部って、こんな施設まであるの？\""
"1013103-11-タカネ" = "あっ、それはですね……。"
"1013103-12-タカネ" = "その……出版部は名目上こそ出版部ですが……。"
"1013103-13-タカネ" = "これもひとえに部長が少々……お金を好きすぎた結果、といいますか。"
"1013103-14-タカネ" = "レッドウィンターのあらゆる文化事業に、かなり積極的に……#nいえ、ほとんどをまとめておりまして。"
"1013103-15-タカネ" = "ですから……はい……。"
"1013103-16" = "[s] \"……事務局から何か言われないの？\""
"1013103-17-タカネ" = "レ、レッドウィンターにはレッドウィンターの流儀があるのですわ。#n出版部にも出版部の手順がございますから！"
"1013103-18-タカネ" = "それに、私たちは決して個人的に不当な利益を得たりはしておりません！"
"1013103-19-タカネ" = "そ、それよりも先生！#nホッケーです、アイスホッケーですわ！"
"1013103-20-タカネ" = "先日お伝えした通り、もうすぐ準決勝戦が始まりますの！"
"1013103-21-タカネ" = "レッドウィンターは学園の特性上、ウィンタースポーツが盛んでして……。"
"1013103-22-タカネ" = "アイスホッケーもまた、熱心なファンを抱えているのですわ！"
"1013103-23-タカネ" = "大変長らくお待たせいたしました！#nこれよりアイスホッケーリーグ準決勝戦を開始いたします！"
"1013103-24-タカネ" = "始まりましたわね、先生！"
"1013103-25-タカネ" = "既にご存知かもしれませんが、アイスホッケーは１チーム6人構成なのですわ。意外と少ないでしょう？"
"1013103-26-タカネ" = "試合は20分を3回行って、合計60分。#nその20分ずつを「ピリオド」と呼びます。"
"1013103-27-タカネ" = "ルールは至ってシンプルです。スティックでパックを打って、ゴールに入れるだけです。"
"1013103-28-タカネ" = "あ、ちなみにアイスホッケーではゴールキーパーではなく、「ゴールテンダー」と呼ぶのが通例ですわ。"
"1013103-29-タカネ" = "強烈なボディチェック！これは見事！積極的なディフェンスです！"
"1013103-30" = "[s] \"今、体当たりで相手を……倒したけど！？\""
"1013103-31-タカネ" = "ええ、あの程度はレッドウィンターのアイスホッケーでは許容範囲ですわ。"
"1013103-32-タカネ" = "それより、そこの吹っ飛ばされたあなた！早く立ち上がりなさいな！試合の遅延行為はペナルティ対象ですわよ！"
"1013103-33" = "[s3] \"乱暴な体当たりはセーフで……。\"\n[s4] \"倒れてる方がファウルって……。\""
"1013103-34-タカネ" = "そう！それがレッドウィンターのアイスホッケーなのです！"
"1013103-35" = "[s] \"あ、今スティックで人を殴ったよね。\""
"1013103-36-タカネ" = "いけませんわ！あれは5分退場ものですわよ！"
"1013103-37-タカネ" = "な、何ですって？！審判、一体なにを！？2分で済ませるだなんて！#n審判が袖の下でも受け取っているのではなくて！？"
"1013103-38" = "[s5] \"さっきの体当たりの報復かな？\"\n[s6] \"今、体当たり3連続コンボで選手が完全に吹っ飛んだけど……。\"\n[s7] \"観客席のガラスにヒビ入ったけど……これもレッドウィンターのホッケーなの！？\""
"1013103-39-タカネ" = "あぁ……少しやり過ぎましたわね。ガラスにヒビが入ってしまえば、それを交換するまで試合は中断されますわ。"
"1013103-40-タカネ" = "それにあんな連続で、しかも故意の激しいボディチェックをすれば、間違いなく非紳士的行為として最低でも10分の退場ペナルティは――"
"1013103-41-タカネ" = "試合再開の合図です！今日の審判は、驚くほど寛大ですね！"
"1013103-42-タカネ" = "審判！？明日の朝日を、もう見たくはないのですか！？！？"
"1013103-43" = "[s] \"あ。ケンカ始まった。\""
"1013103-44-タカネ" = "当然ですわ！こういうのは一度、仕切り直すべきですもの！"
"1013103-45-タカネ" = "そもそもアイスホッケーで乱闘が起きない方が不思議なくらいですわ。"
"1013103-46-タカネ" = "ホームチームが大きく負けている時、ファンサービスの一環でわざと乱闘を誘発することすらあるくらいですから。"
"1013103-47-タカネ" = "どうしようもない試合展開になったとき、せめてチケット代を惜しむ観客に見せ場を作るためですわ。"
"1013103-48-タカネ" = "そもそもアイスホッケーの防具は重装甲ですし――"
"1013103-49-タカネ" = "スティックを置いて素手でやり合うのが暗黙のルールですから、#n意外と大ごとには――"
"1013103-50" = "[ns8] \"今、観客がリンクに乱入してるような……。\"\n[ns9] \"場外でチームの旗を燃やしてる……。\""
"1013103-51-タカネ" = "……あら。"
"1013103-52-タカネ" = "……ちょっと騒ぎが大きくなりましたわね。"
"1013103-53-タカネ" = "これもよくあることかって？"
"1013103-54-タカネ" = "……。"
"1013103-55-タカネ" = "そうですわね……頻度は高くありませんが。"
"1013103-56-タカネ" = "なかなか見られない光景というわけでも……ないですわね……？"
"1013103-57" = "……よって我々は、事務局を糾弾する！"
"1013103-58-怒りに満ちた観客" = "糾弾だ！糾弾だ！"
"1013103-59-怒りに満ちた観客" = "今日も変わらず寒いのも！週3日労働が定着しないのも！プリンの配給がいつも一つだけで、水で薄めたプリンなことも！"
"1013103-60-怒りに満ちた観客" = "アイスホッケーでこんな負け方をしたのも！全部、事務局のせいだ！"
"1013103-61-怒りに満ちた観客" = "そうだ！そうだ！"
"1013103-62-怒りに満ちた観客" = "同志たちよ！事務局へ向かおう！"
"1013103-63-怒りに満ちた観客" = "行こう！行こう！"
"1013103-64" = "[ns10] \"これって……まさか……。\"\n[ns11] \"レッドウィンターの……朝の挨拶！？\""
"1013103-65-タカネ" = "そ、そんな表現、一体どこでお聞きになったのです！？"
"1013103-66-タカネ" = "……こう申し上げるのもなんですが、レッドウィンターの生徒として……少し耳が痛いですわね。"
"1013103-67" = "あ、あー、マイクテスト、マイクテスト"
"1013103-68-事務局放送" = "皆さん、こんにちは。レッドウィンターの生徒諸君、ただいまアイスホッケーメイン競技場より、クーデターが発生したことをお知らせします"
"1013103-69-事務局放送" = "我々事務局は、この事態に全力で対処することを約束し、この時間をもって局所的な戒厳令を発令し、秩序維持に万全を期す所存です"
"1013103-70-事務局放送" = "生徒の皆さんは動揺せず、各自学業と労働に専念してくださいますようお願い申し上げます"
"1013103-71-事務局放送" = "重ねて申し上げます。レッドウィンターは安全です。レッドウィンターは安全です"
"1013103-72-事務局放送" = "なあ、今回どれだけ逃げ隠れてりゃ済むと思う？"
"1013103-73-事務局放送" = "私は2日と見る"
"1013103-74-事務局放送" = "私は3日"
"1013103-75-事務局放送" = "賭けるか？"
"1013103-76-事務局放送" = "いいね"
"1013103-77-事務局放送" = "お前ら、まだマイク切れてないぞ！！！"
"1013103-78-事務局放送" = "ピーーーーー"
"1013103-79-タカネ" = "……。"
"1013103-80" = "[s] \"……。\""
"1013103-81-タカネ" = "あの、先生？"
"1013103-82-タカネ" = "今日はさすがに……いろいろと危なそうですから……。"
"1013103-83-タカネ" = "少し落ち着くまで、私と一緒にアイスホッケーの名試合集でも、ご覧になりませんか……？"
"1013103-84" = "（こうしてタカネと共に、アイスホッケーの名試合集を視聴した……）"
