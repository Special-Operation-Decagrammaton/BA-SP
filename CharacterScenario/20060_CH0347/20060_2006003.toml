[translation]
"2006003-1" = "イブキと授業！"
"2006003-2" = "海岸の岩場"
"2006003-3" = "（イブキに言われた場所へ向かった）"
"2006003-4-イブキ" = "あ、先生！"
"2006003-5" = "[s] \"こんにちは！イブキ先生！\""
"2006003-6-イブキ" = "えへへっ！今日は先生が二人だね！"
"2006003-7" = "[s] \"いや、今日の私は生徒だよ。\""
"2006003-8-イブキ" = "そうだった！じゃあイブキ、頑張って先生するね！"
"2006003-9-イブキ" = "今日は、イブキ先生と一緒に～"
"2006003-10-イブキ" = "海のいきものを覚えていきましょう～！"
"2006003-11" = "[s] \"海の生き物？\""
"2006003-12-イブキ" = "うん！海に来る前にね、本を読んだの！"
"2006003-13-イブキ" = "お魚さん、クジラさん、クラゲさん、ヒトデさん、カニさん、貝さん……。"
"2006003-14-イブキ" = "というわけで！今からこの辺りの岩に住んでいるお友達に会いに行きます！"
"2006003-15-イブキ" = "先生！岩に登って～！"
"2006003-16" = "（イブキのうしろについて、海岸の岩の上に登った）"
"2006003-17-イブキ" = "まずは、紫フジツボから！"
"2006003-18-イブキ" = "この子たちはね、生まれたばっかの時は海を漂いながら暮らして……#n大きくなったら岩にくっついて過ごすんだって！"
"2006003-19-イブキ" = "それで、ご飯は……あれ？"
"2006003-20-イブキ" = "先生！あっちにトゲカニさんが歩いてる！"
"2006003-21-イブキ" = "びっくりした時に、トゲを膨らませるんだよ！"
"2006003-22-イブキ" = "ほら！びっくりしたみたい！トゲが出てきた～"
"2006003-23" = "[s] \"本当だ！\""
"2006003-24-イブキ" = "ここで問題！岩の下にいるこの子たちは、なんていうでしょ～？"
"2006003-25" = "[s] \"さっきの紫フジツボじゃないの？\""
"2006003-26-イブキ" = "ぶっぶー！すごく似ているけど、全然違う種類なんだ！"
"2006003-27-イブキ" = "ピラミッド貝さんっていうの！紫フジツボに似てるけど、ぜんぜん別の生き物！"
"2006003-28-イブキ" = "違いはね～カラの形！#n紫フジツボのカラは丸いけど、ピラミッド貝のカラは角が尖ってるんだ、見えるかな？"
"2006003-29" = "（そうして、岩の表面に暮らす生き物たちの話を聞いた後――）"
"2006003-30" = "（二人で岩の下に降りた）"
"2006003-31-イブキ" = "先生！こっちには違う子たちがいるよ！"
"2006003-32-イブキ" = "イソギンチャクさんにヒトデさん、エビさん……。"
"2006003-33-イブキ" = "わ～！ハッキリ見えるよ！"
"2006003-34" = "[s] \"海底がきれいに見えるね！\""
"2006003-35-イブキ" = "イブキ、こんなにきれいな海はじめて見た！"
"2006003-36-イブキ" = "あと……あははっ！"
"2006003-37-イブキ" = "くすぐったいよ～！お魚さん、ダメ～！"
"2006003-38-イブキ" = "この子たちはヨウジウオ、って言うんだけど――あれ？"
"2006003-39-イブキ" = "先生！見て！"
"2006003-40" = "[s] \"……風船が浮かんでる？\""
"2006003-41" = "（少し離れた水面に、青い風船のようなものが浮いていた）"
"2006003-42" = "[s] \"あれは……なんですか？イブキ先生。\""
"2006003-43-イブキ" = "えっへん！良い質問ですね！"
"2006003-44-イブキ" = "あの子たちはアオクラゲっていって――"
"2006003-45-イブキ" = "水面をふよふよ漂うクラゲだよ！"
"2006003-46-イブキ" = "触手にはすご～く痛い毒がついてて、刺されちゃったら病院に……"
"2006003-47" = "[ns1] \"なんか……。\"\n[ns2] \"こっちに近づいてない……？\""
"2006003-48-イブキ" = "ふえええ、せ、先生……！"
"2006003-49" = "[ns] \"イブキ！？\""
"2006003-50" = "（後ずさりして転んでしまったイブキをおぶって、岩場を離れた）"
"2006003-51" = "（……怖かったのか、砂浜に戻ってもイブキはしばらくしがみついていた）"
