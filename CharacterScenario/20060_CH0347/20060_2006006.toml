[translation]
"2006006-1" = "イブキと、一緒に。"
"2006006-2" = "浜辺"
"2006006-3" = "（浜辺へ向かうと……）"
"2006006-4" = "（イブキが何かをしている……）"
"2006006-5-イブキ" = "よいしょ……。"
"2006006-6-イブキ" = "あっ！あそこにもある！"
"2006006-7-イブキ" = "えへへ、これで5個！"
"2006006-8" = "（イブキは、何かを熱心に拾っていた）"
"2006006-9" = "[ns] \"イブキ？\""
"2006006-10-イブキ" = "あ、先生！"
"2006006-11" = "[s] \"何をしてるの？\""
"2006006-12-イブキ" = "絵に使うものを探してたの！"
"2006006-13-イブキ" = "これ！"
"2006006-14" = "（イブキが差し出した手のひらには……）"
"2006006-15" = "（長い年月をかけて波に削られ、丸くきれいになった――）"
"2006006-16" = "（色とりどりの貝殻とガラス片があった）"
"2006006-17-イブキ" = "どう？きれいでしょー？"
"2006006-18" = "[s1] \"宝石みたいだね！\"\n[s2] \"でも、どうやって絵を描くの？\""
"2006006-19-イブキ" = "えっとね～"
"2006006-20-イブキ" = "これをいっぱい紙に貼るの！"
"2006006-21-イブキ" = "絵はクレヨンや絵の具で描くだけじゃないんだよ！"
"2006006-22-イブキ" = "でも……なかなか探してる色が見つからなくて……。"
"2006006-23-イブキ" = "だから、早起きして探してたの！"
"2006006-24" = "[ns3] \"なるほどね……それじゃあ私もお手伝いしますよ！\"\n[ns4] \"「巨匠」イブキ先生！\""
"2006006-25-イブキ" = "きょしょー……！"
"2006006-26-イブキ" = "えへへ、よろしくお願いします、先生！"
"2006006-27" = "[s] \"じゃあ、ちょっとここで待ってて。\""
"2006006-28-イブキ" = "え？待つの？なんで？"
"2006006-29-イブキ" = "先生、いい方法を知ってるの……？"
"2006006-30-イブキ" = "分かった！待ってるね！"
"2006006-31" = "（私は近くの店で「あるもの」を買ってきた）"
"2006006-32-イブキ" = "おかえりなさい！"
"2006006-33-イブキ" = "あれ、先生なに持ってるの？"
"2006006-34-イブキ" = "それは……フォーク？"
"2006006-35" = "[s] \"熊手だよ。\""
"2006006-36-イブキ" = "くまで……？"
"2006006-37-イブキ" = "あっ！"
"2006006-38-イブキ" = "イブキ、分かった気がする！"
"2006006-39-イブキ" = "砂を熊手でかいたら――"
"2006006-40-イブキ" = "貝殻とカケラだけが取れるってことだね！"
"2006006-41" = "[s] \"その通り！イブキは賢いね！\""
"2006006-42-イブキ" = "えへへ、褒められちゃった。#nありがとう先生！"
"2006006-43" = "（イブキに熊手を渡した）"
"2006006-44-イブキ" = "これなら、いっぱい見つかりそう！"
"2006006-45-イブキ" = "じゃあ、こっちから……。"
"2006006-46-イブキ" = "……あれ？"
"2006006-47" = "[s] \"ああっ……！\""
"2006006-48" = "（熊手には、貝殻とガラス片ではなく……）"
"2006006-49" = "（大量のゴミが引っかかっていた）"
"2006006-50" = "[ns] \"えっと……イブキ……。\""
"2006006-51-イブキ" = "すごい！これなら、海のお掃除も一緒にできちゃうね！"
"2006006-52" = "[s] \"うん……？\""
"2006006-53-イブキ" = "貝殻やガラスの欠片もとれるし、海もきれいにできる！#nこういうのを、いっせきにちょーって言うんだよね？"
"2006006-54-イブキ" = "よーし！イブキ、頑張る！"
"2006006-55" = "[s5] \"ぐぅっ……！\"\n[s6] \"まぶしい……！\""
"2006006-56-イブキ" = "先生？泣いてるの？"
"2006006-57-イブキ" = "い、イブキ、何か変なこと言った……？"
"2006006-58-イブキ" = "違う……？"
"2006006-59-イブキ" = "ただ感動しただけ……？どうして？"
"2006006-60" = "（その後、ポリ袋を持ってきて、イブキと一緒にゴミを集めた）"
"2006006-61" = "（帰る時には5袋分のゴミがまとまっていて……）"
"2006006-62" = "（宝石のように輝く、一粒の欠片を見つけることができた）"
