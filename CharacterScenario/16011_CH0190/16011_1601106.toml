[translation]
"1601106-1" = "姿勢矯正"
"1601106-2" = "（連絡をもらった次の休みの日、ハスミに連絡して一緒に運動することにした）"
"1601106-3" = "（下町の小さな体育館を訪ねると、先に着いていたハスミの姿が見える）"
"1601106-4-ハスミ" = "あ、先生。お待ちしておりました。"
"1601106-5-ハスミ" = "……え？"
"1601106-6-ハスミ" = "早く来たはずなのにもうハスミがいる……？"
"1601106-7-ハスミ" = "……ふふ、今日という日を楽しみにしていたので。#n準備も万全ですよ。"
"1601106-8" = "[s1] \"それは良かったけど……準備？\"\n[s2] \"運動以外に、何かやることがあるの？\""
"1601106-9-ハスミ" = "申し上げた通り、今日は先生の日頃の運動不足を解消するために集まったので……"
"1601106-10-ハスミ" = "デスクワークで凝りがちな身体を十全にほぐせるストレッチなどができたらな、と#n……大運動会の進行をしながら、色々とやり方を学びましたので。"
"1601106-11-ハスミ" = "本格的なものとまではいきませんが、簡単なものでしたら、私も正しい姿勢やストレッチの仕方がわかりますから。"
"1601106-12-ハスミ" = "お手本をお見せしたり、姿勢を正したり……そういった事をお教えできたらと思います。"
"1601106-13-ハスミ" = "ああ、でも。コーチという感じではなく、一緒に運動する延長のようなものだと思っていただけますと幸いです。"
"1601106-14-ハスミ" = "その……もしかして、余計なお世話だったでしょうか……？"
"1601106-15" = "[s3] \"そんな事はないよ！よろしくね。\"\n[s4] \"最近ちょっと身体が凝ってたから、ちょうどよかった。\""
"1601106-16-ハスミ" = "ふふ……それなら良かったです。"
"1601106-17-ハスミ" = "その、先日先生が「面倒を見て欲しい」と言ってくださったので、僭越ながらお役に立てたらと思いまして。"
"1601106-18-ハスミ" = "……それでは、軽いストレッチから始めてみましょうか。"
"1601106-19" = "（その後、ハスミのお手本通りに軽いストレッチを1セットこなした）"
"1601106-20-ハスミ" = "あ、先生……少しよろしいでしょうか。"
"1601106-21-ハスミ" = "その状態で……はい、そのままの姿勢をキープしていただいて……"
"1601106-22-ハスミ" = "これは、身体をもうちょっと下げなければいけないようで……"
"1601106-23-ハスミ" = "私が掴んでいますから、"
"1601106-24-ハスミ" = "こうやって……"
"1601106-25-ハスミ" = "ここをもう少し、こう……"
"1601106-26" = "[ns5] \"……ハ、ハスミ……！？\"\n[ns6] （！？……何かやわらかいものが当たったような……！？）"
"1601106-27-ハスミ" = "……先生、どうしました？#n何かありましたか……？"
"1601106-28-ハスミ" = "……え？一人でも大丈夫、ですか？"
"1601106-29-ハスミ" = "も、もしかして私が力を入れすぎてしまいましたか……？#nそれとも……。"
"1601106-30-ハスミ" = "……あっ。"
"1601106-31-ハスミ" = "（まさか、私が先生を押したから……）"
"1601106-32-ハスミ" = "（重たかったとか……？でも、先生はお優しいから口に出せず……？）"
"1601106-33" = "[ns7] \"……ハスミ？\"\n[ns8] \"どうしたの？\""
"1601106-34-ハスミ" = "ご、ごめんなさい、先生！#n決してそういうつもりでは……！！"
"1601106-35-ハスミ" = "え、大丈夫、ですか？#nで、でも……！"
"1601106-36-ハスミ" = "……今度は逆？"
"1601106-37-ハスミ" = "先生が私の姿勢を見てくださるんですか？#nわ、私はそれでも構いませんが……"
"1601106-38" = "[s9] \"見てもらってばかりだと申し訳ないからね。\"\n[s10] \"一緒にやるって話だったから、順番にね。\""
"1601106-39-ハスミ" = "は、はい……。"
"1601106-40-ハスミ" = "わかりました。で、では今度は先生が私を支えてくださるという事で……。"
"1601106-41-ハスミ" = "せ、背筋をのばして……。"
"1601106-42-ハスミ" = "そ、それでは……。"
"1601106-43-ハスミ" = "よろしく……お願いします……。"
"1601106-44-ハスミ" = "はあ、はあ……。"
"1601106-45-ハスミ" = "一応3セットくらいやったので……"
"1601106-46-ハスミ" = "今日はここまでにしましょうか？"
"1601106-47-ハスミ" = "……あっ。"
"1601106-48-ハスミ" = "申し訳ありません。"
"1601106-49-ハスミ" = "先の約束をしているわけじゃないのに、つい……。"
"1601106-50-ハスミ" = "……え、元々そういう予定だと思っていた？"
"1601106-51-ハスミ" = "そ、それは……その……#nもちろん私は、先生さえよろしければ……。"
"1601106-52-ハスミ" = "……ふふ、そうですね。"
"1601106-53-ハスミ" = "はい。それでは、そういうことで。"
"1601106-54-ハスミ" = "ありがとうございます……先生。"
"1601106-55-ハスミ" = "……これからも、どうぞよろしくお願い致しますね。"
