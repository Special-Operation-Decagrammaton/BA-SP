[translation]
"1013905-1" = "ニコの相談"
"1013905-2" = "（その日は、朝からついていないことだらけだった……）"
"1013905-3" = "シャーレ・宿直室"
"1013905-4" = "[ns] \"うぅん……うう……。\""
"1013905-5-暴走族A" = "ヒャッハー、走れ走れー！"
"1013905-6-暴走族B" = "ブロロロロ、飛ばせー！"
"1013905-7-暴走族C" = "ふふ……今日の飯も美味しかったな。"
"1013905-8" = "[ns] \"なんでこんなにうるさいんだ……。\""
"1013905-9-暴走族A" = "あの公道をノーブレーキで走り切るなんて……やるじゃないか、お前ら。"
"1013905-10-暴走族B" = "そっちの「ブロロロ疾走連合」も中々だったぜ。#n今夜の勝負は、中々見応えがありそうだぜ。"
"1013905-11-暴走族C" = "隊長、今夜は朝まで走り抜けましょうよ！\r\n"
"1013905-12-暴走族ボスA" = "総長って呼べって言ってんだろ！"
"1013905-13" = "[ns] \"これじゃあ眠れない……。\""
"1013905-14" = "（一晩中、シャーレの周辺を走り回る暴走族のせいで、まともに眠ることもできず……）"
"1013905-15" = "[ns] \"あ、すみません。ハンカチ、落とされましたよ。\""
"1013905-16" = "[ns1] \"……聞こえなかったんだろうか？\"\n[ns2] ハンカチを渡そうと、後を追いかける。"
"1013905-17-市民" = "おまわりさん、この人です！"
"1013905-18-市民" = "最近、誰かにつけられてると思ったら――"
"1013905-19-市民" = "この人ストーカーです！"
"1013905-20" = "[ns] \"違うんです、私はただ、落とし物を――！\""
"1013905-21-警察" = "……落とし物？「物を受け取る側」の気持ちを考えたことはないのか？"
"1013905-22-警察" = "というか、お前どこかで見た顔だな……指名手配ポスターとかだったような……。"
"1013905-23-警察" = "とりあえず署まで来い。いい訳なら、そこでいくらでも聞いてやる。"
"1013905-24" = "[s] \"ちょ、ちょっと待ってください！誤解です！\""
"1013905-25" = "（しばらく足止めされる羽目になり……）\r\n"
"1013905-26-ダウナーな生徒" = "……あの子は噂を信じて、私が悪口を言ったって決めつけてるんです。"
"1013905-27-ダウナーな生徒" = "友達だと思ってたのに……噂を鵜呑みにするなんて。"
"1013905-28-ダウナーな生徒" = "私たちの関係は、もう終わりなんです。全部、終わっちゃいました！"
"1013905-29" = "[s] \"落ち着いて、状況を整理してみよう。\""
"1013905-30" = "[ns3] \"きっと、あの子にも事情があったんじゃないかな？\"\n[ns4] \"一度、落ち着いて話し合ったら――\""
"1013905-31-ダウナーな生徒" = "先生もあの子の味方なんですか！？"
"1013905-32-ダウナーな生徒" = "何回も説明しましたよね？勘違いの余地なんて、全然ないって！"
"1013905-33" = "[s] \"いや、そういう意味じゃなくて……。\""
"1013905-34-ダウナーな生徒" = "……やっぱり先生も、私が被害者面しているって思っているんですね。"
"1013905-35-ダウナーな生徒" = "今日は相談してる間、ずっと目を合わせてくれないとは思ってましたけど。"
"1013905-36-ダウナーな生徒" = "……失礼します。"
"1013905-37" = "[ns] \"ま、待って……！\""
"1013905-38" = "（……疲れのせいか、生徒の相談でも余計なことを言ってしまって）"
"1013905-39" = "（一日中トラブル続きで、疲労は溜まっていったが……）"
"1013905-40" = "（そのほとんどが自分のミスか、自分ではどうしようもない理由で起きたことだったので、誰かに愚痴ることもできないまま、一日が過ぎていった）"
"1013905-41" = "（……その日の夕方）"
"1013905-42-ニコ" = "こんばんは、先生。お手伝いに来ました。"
"1013905-43-ニコ" = "この前の作戦中に、いい茶葉を手に入れたので、一緒に飲もうと思って持ってき――"
"1013905-44-ニコ" = "あら、先生。どこか具合でも悪いんですか？"
"1013905-45-ニコ" = "お顔に「疲れてる」って書いてありますよ？"
"1013905-46" = "[s5] \"大したことじゃないよ。\"\r\n[s6] \"私は大丈夫だから、午後の作業を始めようか。\""
"1013905-47-ニコ" = "そんな顔で言われても説得力がありませんよ？"
"1013905-48-ニコ" = "……今日、何かありましたね？"
"1013905-49" = "[ns] \"平気だよ。大丈夫……。\""
"1013905-50" = "[ns] \"ニコには関係のない事だから。\""
"1013905-51" = "[ns] \"ごめん、そういうつもりで言ったわけじゃ――\""
"1013905-52-ニコ" = "いえ。関係ないことならなおさら、聞かせてください。"
"1013905-53-ニコ" = "今はお仕事よりも先生です。ついてきてください！"
"1013905-54" = "（ニコの手に引かれ、そのまま宿直室へと半ば強引に連れて来られてしまった）"
"1013905-55-ニコ" = "はい、先生。横になってください。"
"1013905-56" = "[s7] \"ニコ、心配してくれるのは嬉しいけど……。\"\r\n[s8] \"まだそんな時間じゃないし、眠れそうにないよ\""
"1013905-57-ニコ" = "お昼寝をしてほしいわけじゃありません。"
"1013905-58-ニコ" = "横になって、目を閉じて。#nゆっくり今日のことを話してください。"
"1013905-59-ニコ" = "どんなに些細なことでも構いませんので。#n先生の頭に残っていること、全部。"
"1013905-60-ニコ" = "言いたくなければ濁しても構いませんから……。"
"1013905-61-ニコ" = "力を抜いて……思っていることを、全部私に明け渡してください。"
"1013905-62" = "[s] \"でも、生徒にそんなことを……。\""
"1013905-63-ニコ" = "話してくださるまで、ずっとこのままですよ。"
"1013905-64-ニコ" = "……SRTの拘束技、体験してみます？"
"1013905-65" = "[s9] \"わ、わかった……！\"\r\n[s10] \"それじゃあ、少しだけ……。\""
"1013905-66" = "（その後、ニコの言うとおり、今日一日の出来事をゆっくりと思い返していった）"
"1013905-67" = "（ニコは、こちらの話に余計な口を挟まず、時々相づちを打ちながら静かに耳を傾けてくれた）"
"1013905-68-ニコ" = "……そんなことがあったんですね。"
"1013905-69-ニコ" = "そういう日もありますよ。"
"1013905-70-ニコ" = "一つ一つは小さな出来事なのに、何故か重なってしまう日。"
"1013905-71-ニコ" = "些細な事だからこそ、人に話せずに溜め込んでしまうといいますか。"
"1013905-72" = "[s11] \"そうだね……どれも大したことじゃない。\"\r\n[s12] \"心配させて、ごめん。\""
"1013905-73-ニコ" = "そんなこと、言わないでください。"
"1013905-74-ニコ" = "さっきも言いましたけれど、些細なことほど、心の中で膿んでしまいやすいんです。"
"1013905-75-ニコ" = "だからこうして、話すのが一番です。"
"1013905-76-ニコ" = "どうですか？少しは、胸のつかえは取れましたか？"
"1013905-77" = "[s13] \"うん、さっきよりスッキリした気がする。\"\r\n[s14] \"ありがとう、ニコ。\""
"1013905-78-ニコ" = "どういたしまして。"
"1013905-79-ニコ" = "それに、先生は大人ですから。なおさら他人に対して素直になれないものですし。"
"1013905-80-ニコ" = "たまには、生徒相手でもいいので。#n少しは誰かを頼ってくださいね。"
"1013905-81" = "[s] \"生徒にはいつも誠実に向き合っているつもりなんだけど。\""
"1013905-82-ニコ" = "嘘をついてるって話じゃありませんよ？"
"1013905-83-ニコ" = "言葉を選んで話すことも、隠しているに該当したりしますから……。"
"1013905-84-ニコ" = "次からは……包み隠さず、全部お話ししてくださいね？"
"1013905-85" = "[s] \"……努力してみるよ。\""
"1013905-86-ニコ" = "……本当、手のかかる大人ですね。"
"1013905-87-ニコ" = "まあ、そういうちょっと厄介な人のために、私のような生徒がいるんですから。"
"1013905-88" = "（そのあと、ベッドの上でニコと他愛もない話を交わし、心なしか軽くなった気持ちで執務室へと戻った）"
