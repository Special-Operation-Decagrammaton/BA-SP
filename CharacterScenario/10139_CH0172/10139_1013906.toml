[translation]
"1013906-1" = "ニコの名札"
"1013906-2" = "シャーレ・執務室"
"1013906-3" = "（ニコが当番をしに、シャーレの執務室を訪れた日のこと……）"
"1013906-4" = "[ns] \"……あれ？\""
"1013906-5-ニコ" = "どうかしましたか、先生？\r\n"
"1013906-6" = "[s1] \"引き出しの中が、ホッチキスの針の箱でいっぱいだったんだ。\"\r\n[s2] \"切らしたと思って昨日新しく注文しちゃって……。\""
"1013906-7-ニコ" = "あら……在庫過多になってしまいますね。"
"1013906-8-ニコ" = "どれくらい注文されたんですか？"
"1013906-9" = "[s3] \"一年分くらい……。\"\r\n[s4] \"会計担当の生徒に怒られそうだな……。\""
"1013906-10-ニコ" = "先生が怖がる生徒もいらっしゃるんですね。"
"1013906-11-ニコ" = "ですが、ホッチキスの針は傷むものでもありませんし、多少多くても大丈夫だと思います。"
"1013906-12-ニコ" = "SRT学園でも、うっかり在庫過多になってしまうことが、たまにありました。"
"1013906-13-ニコ" = "対人地雷が切れたと思って追加注文したら……後から地下倉庫に、封も切っていない地雷の箱が山積みだったり――\r\n"
"1013906-14" = "[s] \"大丈夫なのそれ！？\""
"1013906-15-ニコ" = "大丈夫ですよ。持ち主不明の爆弾の箱が見つかるのは、よくあることですから。"
"1013906-16-ニコ" = "ただ、その出どころがSRT学園のものだと困るんですけどね。\r\n"
"1013906-17-ニコ" = "それ以来、SRTでは私物やロッカーには必ず名札をつけるという決まりにしているんです。"
"1013906-18" = "[s] \"……決まり？\""
"1013906-19-ニコ" = "はい。共用の支給品なんかは形が似ているものが多いので、他の人が間違えて持って行ってしまうこともよくあって。"
"1013906-20-ニコ" = "ランドリーで靴下が入れ替わっているなんてことも、日常茶飯事で……。"
"1013906-21-ニコ" = "不思議と他の小隊ではあまりないらしいんですけど、FOX小隊はやけに下着が入れ替わることが多くて……どうしてなんでしょうね。\r\n"
"1013906-22" = "[s5] （大体の理由は想像がつくけど……）\r\n[s6] \"たしかに、それは困るね。\""
"1013906-23-ニコ" = "そういうわけで、シャーレの備品にも名札をつけてみませんか？\r\n"
"1013906-24-ニコ" = "ちょうど支給品用の新しい名札を買ってきたので。"
"1013906-25-ニコ" = "どこに何があって誰の持ち物なのか分かるよう書いておいたら、今日みたいに過剰在庫にしてしまうことも減ると思います。"
"1013906-26-ニコ" = "はい、たくさん買ってきたので先生の分。\r\n"
"1013906-27" = "[s7] \"いいアイデアだね。\"\r\n[s8] \"それじゃ事務用品の整理も兼ねて、名札を貼っていこうか？\""
"1013906-28-ニコ" = "はい！"
"1013906-29" = "（そのあと、ニコと一緒にシャーレの備品に名札を貼っていった）"
"1013906-30" = "（……名札を貼っていくうちに、失くしたと思っていた物を見つけることもできた）"
"1013906-31" = "[ns] \"……思ったより時間がかかったね。\""
"1013906-32-ニコ" = "そうですね。本当にお疲れ様でした。\r\n"
"1013906-33-ニコ" = "でも、これでどこに何があって、誰の持ち物なのか、一目で分かるようになりました。\r\n"
"1013906-34-ニコ" = "筆記用具を探すときはこの引き出しで、プリンター用トナーやコピー用紙はプリンターの横の箱に全部まとまっていて……。"
"1013906-35-ニコ" = "あれ？名札が1枚、余ってますね。\r\n"
"1013906-36-ニコ" = "貼り忘れたものがあったんでしょうか……。"
"1013906-37" = "[s9] \"ニコの好きな場所に使っていいよ。\"\r\n[s10] \"ニコの持ち物に貼るとか？\""
"1013906-38-ニコ" = "……そうですね。"
"1013906-39-ニコ" = "では、この名札は「私の物」に貼っておきます。"
"1013906-40-ニコ" = "……えいっ。\r\n"
"1013906-41" = "[ns] \"な、なんで急に背中を叩いたの！？\""
"1013906-42-ニコ" = "ふふ、なんでもありません。\r\n"
"1013906-43-ニコ" = "持ち主を間違えないように名前を書いておくのは、大事ですから。\r\n"
