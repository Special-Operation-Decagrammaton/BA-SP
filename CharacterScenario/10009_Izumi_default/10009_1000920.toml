[translation]
"1000920-1" = "ホットドッグデー"
"1000920-2-イズミ" = "あ、先生いらっしゃい！待ってたよ！"
"1000920-3" = "[s] \"こんにちは。見せたいものって？\""
"1000920-4-イズミ" = "それはね～"
"1000920-5-イズミ" = "じゃーん！これ！"
"1000920-6" = "[ns1] \"イズミ！？食品サンプルは食べちゃダメだよ！？\"\n[ns2] \"あああ、もう食べちゃってる……。\""
"1000920-7-イズミ" = "んもう、違うよ！先生は私の事なんだと思ってるの！"
"1000920-8-イズミ" = "いくら私でもそれくらい分かるよ！"
"1000920-9" = "[s3] \"よ……よかった……？\"\n[s4] \"これ……本当にサンプル？すごいクオリティだね……\""
"1000920-10-イズミ" = "すごいよね！触った感じも匂いも、本物のホットドッグみたい！"
"1000920-11-イズミ" = "すりーでぃーぷりんたー？で作れるんだって！"
"1000920-12" = "[s5] \"最近の3Dプリンターはすごいんだね。\"\n[s6] \"ところで、イズミはどうしてこれを？\""
"1000920-13-イズミ" = "これを持っているとね、美味しいものによく出会えるんだ～"
"1000920-14-イズミ" = "私のラッキーアイテム！みたいな！"
"1000920-15" = "（その時！突如として大きなカラスが！）"
"1000920-16" = "（ああっと！イズミのホットドッグが攫われたーー！）"
"1000920-17-イズミ" = "ふえええー－ん！！返してよー－！#n私のホットドッグー－！！"
"1000920-18-イズミ" = "はぁ、はぁ……。"
"1000920-19" = "[s] \"カラスを追いかけていたら、こんな所に……。\""
"1000920-20-イズミ" = "あっ、見て先生！#nカラスさんが私のホットドックを雛にあげてる！"
"1000920-21-イズミ" = "でも……プラスチックだから食べられないみたい……"
"1000920-22-イズミ" = "ど、どうしよう！？#nこのままじゃ誰も幸せにならないよ……。"
"1000920-23" = "[s] \"ちょっと待っててね、イズミ。すぐ戻るから。\""
"1000920-24-イズミ" = "せ、先生？どこ行くの？#n置いてかないでーー！"
"1000920-25" = "（少し心苦しいけど、涙ぐむイズミを置いてコンビニに行ってきた）"
"1000920-26-イズミ" = "先生？そのホットドック、私に……？"
"1000920-27-イズミ" = "違う？じゃあどうするの……？"
"1000920-28-イズミ" = "あ……それをカラスさんたちに？"
"1000920-29" = "（イズミに手伝ってもらいながら、木に登った）"
"1000920-30" = "（ホットドックを巣の近くに置いておくと……）"
"1000920-31-イズミ" = "先生、カラスさんが少し味見して……"
"1000920-32-イズミ" = "雛たちに分け与えてる！"
"1000920-33-イズミ" = "私のホットドッグ！"
"1000920-34-イズミ" = "わあ！返してくれたの？#nありがとう！本当に賢いね君たち！"
"1000920-35" = "[ns7] \"カラスは知能が高いらしいからね。\"\n[ns8] \"よかったね、イズミ。\""
"1000920-36-イズミ" = "うん！"
"1000920-37-イズミ" = "でも、結構走ったらお腹空いてきちゃった……。"
"1000920-38" = "[s] \"ふっふっふ……そう言うと思って。\""
"1000920-39-イズミ" = "え？えっ？先生、どうしたの？"
"1000920-40-イズミ" = "それは……ホットドック！？"
"1000920-41" = "[s9] \"なんだか私もホットドックが食べたい気分でね。\"\n[s10] \"イズミの分もあるよ。\""
"1000920-42-イズミ" = "ほんと？私こんなに幸せでもいいの？"
"1000920-43-イズミ" = "ありがとう先生！#nいっただっきま～す！"
"1000920-44" = "[s] \"今日はイズミの「ホットドッグデー」だね。\""
"1000920-45-イズミ" = "なにそれ？一日中ホットドッグを食べる日？"
"1000920-46-イズミ" = "あははっ！面白いね～！"
"1000920-47-イズミ" = "じゃあ……ホットドッグにウナギゼリー味のソースと、高級マグロ味の「にゅ～る」、あとチョコマスタード味のフレークをかけて食べよっかな！"
"1000920-48-イズミ" = "あ、先生もかける？#n美食の新境地を見ることができるよ～！"
"1000920-49" = "[ns] \"わ、私は遠慮しておこうかな……。\""
"1000920-50-イズミ" = "そう……？"
"1000920-51" = "（どうやらイズミは本気だったようで、その好意をやんわりと断るのは中々骨が折れた……）"
