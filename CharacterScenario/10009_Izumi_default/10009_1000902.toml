[translation]
"1000902-1" = "すっごく美味しくなる方法"
"1000902-2" = "ゲヘナ学園・生徒用第19グラウンド"
"1000902-3" = "（イズミとの約束の場所に着いた）"
"1000902-4-イズミ" = "先生！こっちこっちー！"
"1000902-5" = "[s1] \"とりあえず来てみたけど……。\"\n[s2] \"結局、何をするんだっけ？\""
"1000902-6-イズミ" = "これこれ。この本にね、昨日言った通りのことが書いてあったの。"
"1000902-7" = "[s3] \"『運動に効く食事』……？\"\n[s4] \"ずいぶんストレートなタイトルだね。\""
"1000902-8-イズミ" = "うん。タイトルを見てこれは読むしかないなって思って、買ってみたら想像以上に面白かったから、取り憑かれたみたいに一気に読んじゃった。"
"1000902-9-イズミ" = "うん。タイトルを見てこれは読むしかないなって思って、買ってみたら想像以上に面白かったから、取り憑かれたみたいに一気に読んじゃった。"
"1000902-10" = "[s] \"取り憑かれたみたいに……。\""
"1000902-11-イズミ" = "大事なのはここ！"
"1000902-12-イズミ" = "えーっとね……。"
"1000902-13-イズミ" = "「トライアスロンの選手として毎日激しい運動をする私は、食べることが大好きだった」"
"1000902-14-イズミ" = "「世の中には美味しい物がたくさんあるが、私が最も美味しいと思っているものがある」"
"1000902-15-イズミ" = "「ミッシンのカップラーメン、豚骨味だ」"
"1000902-16-イズミ" = "「毎日のようにランニング20km、スクワット200回、反復横跳び100回。このような過酷なメニューをこなした後、家に帰ってきてから食べるカップラーメンの味と言ったら……」"
"1000902-17-イズミ" = "「どんな山海珍味にも代えがたい、至福の味である……」"
"1000902-18-イズミ" = "……じゅるり。"
"1000902-19" = "[s] \"えっと、イズミ。もしかして……？\""
"1000902-20-イズミ" = "これ……"
"1000902-21-イズミ" = "これだよ先生！"
"1000902-22-イズミ" = "つまりここに書かれている通り、激しい運動を終えてからカップラーメンを食べれば……！"
"1000902-23-イズミ" = "それはもう、最っっっ高に美味しい味になるってことだよね！"
"1000902-24" = "[s] \"でもそれって多分……。\""
"1000902-25-イズミ" = "そういうわけで持ってきたよ！はい、豚骨味のカップラーメン。先生の分と合わせて2個！"
"1000902-26" = "[s] \"人の話を聞いてない！けど用意が良い！\""
"1000902-27-イズミ" = "もちろんトッピングも忘れてないよ。ほら、イチゴジャム！"
"1000902-28" = "[s] \"イ、イズミらしいチョイス……！\""
"1000902-29-イズミ" = "高い食材を使うこともなく、難しい調理法を必要とすることも無く、最上の味が味わえるかもしれないなんて……。"
"1000902-30-イズミ" = "もうじっとなんてしていられない！"
"1000902-31-イズミ" = "さあ、一緒に運動しよう、先生！"
"1000902-32" = "[s] \"やっぱり私もか……。\""
"1000902-33" = "（そしてイズミと二人で、地獄の特訓が始まった）"
"1000902-34-イズミ" = "いっち！にっ！さんっ！しっ！"
"1000902-35-イズミ" = "ほら、先生も頑張って！"
"1000902-36" = "[s] \"キ、キツイ！！\""
"1000902-37-イズミ" = "次は、走り幅跳びだよ、先生！"
"1000902-38-イズミ" = "おいっち、にっ……！"
"1000902-39-イズミ" = "ふぅっ……！"
"1000902-40-イズミ" = "ファイトだよ、先生！"
"1000902-41" = "[s] \"うおおおおっ……！！！\""
"1000902-42" = "（その後も全力ダッシュ、スクワット、マラソン、腹筋、柔軟運動等々……）"
"1000902-43" = "（2時間以上かけて、イズミと一緒に本に書かれている通りの運動をした）"
"1000902-44" = "[ns] \"はぁ……はぁ……。\""
"1000902-45-イズミ" = "ふぅ……終わったー！達成感あるね！"
"1000902-46-イズミ" = "先生、大丈夫？"
"1000902-47" = "[s] \"ひぃ、ひぃ……ふぅ……。\""
"1000902-48-イズミ" = "ツンツン、ツンツン。先生、生きてる～？"
"1000902-49" = "[s] \"やっと……終わ……り……？\""
"1000902-50" = "（グツグツグツ……）"
"1000902-51" = "[s] \"バーナーまで用意してたなんて、徹底してるね。\""
"1000902-52-イズミ" = "美味しいモノのためにはこれくらい当たり前だよ～。"
"1000902-53" = "（ガチャッ）"
"1000902-54-イズミ" = "さて、お湯を入れて……イチゴジャムも入れて……かき混ぜて～……あとは3分待つだけ！"
"1000902-55" = "（じゅるっ……）"
"1000902-56-イズミ" = "うん、いいかな。"
"1000902-57-イズミ" = "じゃあ先生、食べよっか！"
"1000902-58" = "[s] \"さて、味や如何に……。\""
"1000902-59-イズミ" = "あむっ、ずるずるずるっ！もぐもぐ……。"
"1000902-60-イズミ" = "……！"
"1000902-61-イズミ" = "こ、これはっ……！？"
"1000902-62" = "[s5] \"イ、イズミ！？\"\n[s6] \"そ、そんなに美味しかった！？\""
"1000902-63-イズミ" = "……普通。"
"1000902-64-イズミ" = "……普通。"
"1000902-65" = "[s] \"……え？\""
"1000902-66-イズミ" = "いつも通りの味がする……これ、いつものカップラーメンだよ……！"
"1000902-67-イズミ" = "ううん！いつも通り美味しいんだけど！でも、何て言うか……。"
"1000902-68-イズミ" = "そんなに劇的に味が変わってるわけじゃない……！？"
"1000902-69" = "[s] \"それは、運動しただけだからというか何というか……。\""
"1000902-70-イズミ" = "でも、本に書いてあったのに……本が間違ってる？ううん、そんなことは無いだろうし、そうすると……。"
"1000902-71-イズミ" = "……食べ物が美味しく感じられる運動は人によって違う、とか？"
"1000902-72" = "[s] \"……。\""
"1000902-73-イズミ" = "これは、まだまだきちんと調査してみる必要があるわね……。"
"1000902-74-イズミ" = "美食の研究を途中でなんてやめられないわ、美食研究会の一員として！……ちょっと足りないかも。もう一つ取ってこようかな。"
"1000902-75" = "[s7] \"そ、そっか……。\"\n[s8] \"お、応援するね……！\""
"1000902-76-イズミ" = "うん！ありがとう！"
"1000902-77-イズミ" = "うん！ありがとう！"
"1000902-78" = "（お腹が空くと普段より美味しく感じられるという当たり前のことであって、味が変わるわけじゃないんだよ、と、最後まで伝えることができなかった）"
