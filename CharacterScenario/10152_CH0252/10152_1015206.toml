[translation]
"1015206-1" = "光と闇"
"1015206-2" = "（ツムギと待ち合わせをして、ワイルドハント美術館へ向かった）"
"1015206-5-ツムギ" = "今日はここで色々な作品に触れて、感性を磨くつもりです。"
"1015206-6-ツムギ" = "音楽とは、心の内なるリズムを表現するもの。"
"1015206-7-ツムギ" = "様々な芸術に触れることで、そのリズムを育みます。"
"1015206-8-ツムギ" = "新しい展示も始まって、絶好のタイミングと言えるでしょう。"
"1015206-9-ツムギ" = "私の創作活動に、大いに役立つはずです。"
"1015206-10" = "[s1] \"私もそう思うけど……。\"\n[s2] \"今回の展示テーマ、なんか変わってるね。\""
"1015206-13-ツムギ" = "？"
"1015206-14-ツムギ" = "「芸術に潜む闇」が、ですか？#n具体的にはどの辺りが？"
"1015206-15" = "[s] \"「闇」のところが……！\""
"1015206-16-ツムギ" = "ふふっ。人の内面を表現するのに避けて通れないテーマではないでしょうか。"
"1015206-17-ツムギ" = "では、本日は私が先生の[ruby=ドーセント]案内役[/ruby]を務めさせていただきます。"
"1015206-18-ツムギ" = "闇の探求にかけては、誰にも負けない自信がありますので。"
"1015206-19" = "[s3] \"人間の死が社会の福祉……？\"\n[s4] \"ワタシは芸術の革命家……？\"\n[s5] \"ひれ伏せ暴徒ども……？\""
"1015206-23-ツムギ" = "あら？それは全て、平和を歌った詞ですよ？"
"1015206-24-ツムギ" = "さあ、行きましょう。先生。"
"1015206-26" = "[ns] \"ん？この絵は……？\""
"1015206-28-ツムギ" = "おや。最初から見覚えのある絵が……。"
"1015206-29-ツムギ" = "これはワイルドハントの名を騙り、高値をつけられていた絵画です。"
"1015206-30-ツムギ" = "評議会の努力の賜物によって犯人を捕らえ、不正資金を回収できたのですが……。"
"1015206-31-ツムギ" = "「ワイルドハントの名を使えば儲かる」という、悪しき前例を残してしまいました。"
"1015206-32-ツムギ" = "戒めとして、入り口に飾ったのでしょう。"
"1015206-36" = "[ns] \"あの事件を忘れないように、ってことだね……。\""
"1015206-37-ツムギ" = "回収しきれなかった絵も多いので……今もどこかに飾られているのだと思います。"
"1015206-38-ツムギ" = "ワイルドハントの名が不正に利用されていた、紛れもない「闇」です。"
"1015206-39-ツムギ" = "……苦労の絶えない評議会に、労いの拍手を。"
"1015206-40-ツムギ" = "さあ、次の展示へ参りましょうか。"
"1015206-42" = "（……その後も、闇にまつわる作品を見て回った）"
"1015206-43" = "（さっき見た贋作のような「芸術界の闇」を表すものもあれば……）"
"1015206-44" = "（地獄の底、果てなき深淵、絶叫する人々など……#n作品そのものが「闇」を表現したものも多かった）"
"1015206-46" = "（そうしてすべての作品を見終えて……）"
"1015206-50-ツムギ" = "なかなか見応えのある展示でしたね。"
"1015206-51-ツムギ" = "先生はいかがでしたか？"
"1015206-52" = "[s6] \"インパクトはあったけど……。\"\n[s7] \"ツムギの創作には役立ちそう？\""
"1015206-55-ツムギ" = "もちろんです。一つのテーマを深く掘り下げるのも、良い刺激になりますから。"
"1015206-59-ツムギ" = "誰と一緒に見るかで、感じ方も変わってきますし。"
"1015206-60-ツムギ" = "そういえば、以前お話しした「先生のための曲」……覚えていますか？"
"1015206-61-ツムギ" = "今日一緒に展示会を回ったおかげで、曲の輪郭がより鮮明になりました。"
"1015206-62" = "[s] \"ジャンルはやっぱり、デスメタル？\""
"1015206-63-ツムギ" = "ふふっ、どうでしょう。"
"1015206-64-ツムギ" = "詳しいことは、また後ほど。"
"1015206-65-ツムギ" = "甘いリンゴも、慌ててかじると喉に詰まってしまいますから。"
"1015206-66-ツムギ" = "それではまたお会いしましょう。"
"1015206-71-ツムギ" = "曲、楽しみにしていてくださいね。"
"1015206-76" = "（私はツムギの曲を待つことにした）"
"1015206-77" = "（そうして、数日後……）"
"1015206-79" = "(ツムギから連絡があった)"
"1015206-85-ツムギ" = "こんにちは、先生。"
"1015206-86-ツムギ" = "ついに曲が完成しました。"
"1015206-87-ツムギ" = "今から、そちらへ伺ってもよろしいですか？"
"1015206-88" = "[s] \"待ってました！もちろんいいよ！\""
"1015206-89-ツムギ" = "ふふっ、それではさっそく。"
"1015206-97" = "[ns] \"ドアの前にいたの！？\""
"1015206-98-ツムギ" = "ええ。サプライズですから。"
"1015206-99-ツムギ" = "先生をびっくりさせたかったんです。"
"1015206-100-ツムギ" = "期待通りのリアクションをいただけて、早くも気分が高揚してきました。"
"1015206-101-ツムギ" = "それでは、そちらに掛けていただけますか？"
"1015206-102-ツムギ" = "始めますね。"
"1015206-106-ツムギ" = "先生のために用意した――特別な曲です。"
"1015206-111" = "[wa:1380]― [log=츠무기]誰の心にだって、[wa:2070]闇は存在するもの。[/log]"
"1015206-113" = "― [log=츠무기]それぞれ悩みを抱え、[wa:2245]迷い――[wa:1210]道を歩んでいる。[/log]"
"1015206-116" = "[wa:470]― [log=츠무기]――私も、[wa:1000]そうです。[/log]"
"1015206-118" = "― [log=츠무기]この道で良いのか、[wa:1260]と。[wa:1760]悩む時もあります。[/log]"
"1015206-121" = "[wa:1120]― [log=츠무기]そんな私に、[wa:1470]先生は言ってくれましたよね。[/log]"
"1015206-123" = "― [log=츠무기]私が自由に――[wa:1680]後悔のない日々を過ごせるよう、[wa:2498]支える、[wa:952]と。[/log]"
"1015206-126" = "[wa:540]― [log=츠무기]ですから、[wa:1270]先生は……。[/log]"
"1015206-128" = "― [log=츠무기]――「私の闇を照らす光」[wa:2060]だったのです。[/log]"
"1015206-131" = "[wa:560]― [log=츠무기]私の光であるあなたへ、[wa:1990]この曲を捧げましょう。[/log]"
"1015206-133" = "― [log=츠무기]感謝を込めた、[wa:1380]旋律を……[wa:1775]聞いてください。[/log]"
"1015206-138" = "[ns] \"「闇」がテーマの作品を見に行ったのは、もしかして……。\""
"1015206-139-ツムギ" = "ええ。光は、闇の中でこそ美しく輝くものですから。"
"1015206-140-ツムギ" = "先生のおかげで、思い描いたイメージを形にすることができました。"
"1015206-141-ツムギ" = "……今回の曲、気に入っていただけましたか？"
"1015206-142" = "[s8] \"感動した……。\"\n[s9] \"毎日でも聴きたいな……。\""
"1015206-145-ツムギ" = "ふふっ。そんなこともあろうかと、あらかじめデータを用意しておきました。"
"1015206-146-ツムギ" = "今、お送りしますね。"
"1015206-151" = "[ns] \"ありがとう！一生の宝物にするよ！\""
"1015206-152-ツムギ" = "はい。私も……。"
"1015206-157-ツムギ" = "先生のそのお言葉を、一生の宝物にしますね。"
"1015206-159-ツムギ" = "白雪姫のように。"
"1015206-160-ツムギ" = "または、眠れる森の美女のように。"
"1015206-161-ツムギ" = "永久に続く、幸福な日々を……夢見ながら。"
"1015206-164" = "（その後、ツムギの曲を聴きながら二人で穏やかな時間を過ごした）"
"1015206-165" = "（お互いにとって、大切な思い出の一日になった）"
