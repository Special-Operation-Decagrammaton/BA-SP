[translation]
"1015202-1" = "特別な演奏"
"1015202-2" = "(ツムギがいる公園へ向かった)"
"1015202-11-ツムギ" = "あら。こんなに早くいらっしゃるだなんて。"
"1015202-12-ツムギ" = "白雪姫を哀れむ「狩人」のお心でしょうか？"
"1015202-13-ツムギ" = "それとも、眠れる姫を迎えに来た者のお心でしょうか？"
"1015202-14-ツムギ" = "……どちらでも構いません。大切なのは、先生の――"
"1015202-19-ツムギ" = "――「ハート」。"
"1015202-24-ツムギ" = "……ですから。"
"1015202-25-ツムギ" = "ふふっ、来てくださりありがとうございます。#n先生のお気持ちに応えられるよう、今日のチューニングは丁寧にするとしましょう。"
"1015202-26" = "[s1] \"準備中にごめんね。\"\n[s2] \"何か手伝えることはあるかな？\""
"1015202-29-ツムギ" = "なんとお優しい……。"
"1015202-30-ツムギ" = "ですが、お気遣いなく。自分で準備を進めるのも、路上ライブの醍醐味ですので。"
"1015202-31-ツムギ" = "とはいえ、そのお気持ちにはお返ししたいところではありますね。"
"1015202-32-ツムギ" = "何がよろしいでしょうか？今すぐ用意できるものはありませんが……。"
"1015202-33-ツムギ" = "そうですね、先生さえよろしければ――"
"1015202-34-スケバンA" = "あ？あいつ、ここで何してんだ？"
"1015202-36-スケバンB" = "これから人が昼寝しようってのに、うっせぇな……。"
"1015202-37-スケバンC" = "ひひっ！安眠を邪魔した落とし前、つけてもらおうぜ！"
"1015202-38-スケバンC" = "オイ！そこのギター！"
"1015202-39-ツムギ" = "あら、何かご用でしょうか？"
"1015202-40-スケバンA" = "はぁ？こいつ、なに余裕ぶっこいてんだ？"
"1015202-41-スケバンB" = "てめぇのせいでせっかくの昼寝が台無しだ！どうしてくれるんだよ！"
"1015202-42-スケバンC" = "迷惑料を払うってんなら、見逃してやってもいいぜ。"
"1015202-43-ツムギ" = "あいにくですが、持ち合わせがありませんので。"
"1015202-44-スケバンC" = "だったら、そのギター寄こせ！"
"1015202-45-スケバンC" = "痛い目見たくなきゃさっさとしな！ひひっ！"
"1015202-46-ツムギ" = "……ふふっ、ふふふ。"
"1015202-47-スケバンA" = "ああ？何だヘラヘラしやがって。"
"1015202-48-ツムギ" = "このギターの価値が分かるなんて――"
"1015202-49-ツムギ" = "もしや、芸術にご興味が？"
"1015202-50-スケバンA" = "ゲイジュツ？んなモン知るかよ！"
"1015202-51-ツムギ" = "では……教えて差し上げましょう。"
"1015202-56-ツムギ" = "これはただのギターではなく、「[ruby=Escopetarra]エスコペターラ[/ruby]」という芸術作品なのです。"
"1015202-57-ツムギ" = "平和主義を象徴するこの作品は――"
"1015202-58-ツムギ" = "銃とギターを融合させているのが特徴です。"
"1015202-59-スケバンA" = "……は？"
"1015202-60-ツムギ" = "通常ならば、銃の形をベースに実弾が出ないギターを作るものなのですが……。"
"1015202-61-ツムギ" = "私はギターの形をベースに、実弾が出るエスコペターラを作ってみたんです。"
"1015202-62-ツムギ" = "……この方が、色々な音を奏でられますから。"
"1015202-66-ツムギ" = "一度、お聴きになりますか？"
"1015202-67-ツムギ" = "私の「特別な演奏」を。"
"1015202-73-スケバンA" = "ぐはっ……！？"
"1015202-83-ツムギ" = "あら、この程度で倒れてしまうなんて……。"
"1015202-84-ツムギ" = "私の演奏が、そんなに衝撃的だったのでしょうか？"
"1015202-85" = "[ns3] \"ほ、本当に特別な演奏なんだね……。\"\n[ns4] \"こ、これがツムギの平和主義なの……？\""
"1015202-88-ツムギ" = "争いは、暴力の意志から生まれるもの。"
"1015202-89-ツムギ" = "ならば、根源を絶つ行為もまた――#n平和主義と言えるのではないでしょうか？"
"1015202-90-ツムギ" = "平和とは、単なる暴力の不在ではありません。"
"1015202-91-ツムギ" = "平和とは、慈悲の心の顕現なのです。"
"1015202-92-ツムギ" = "ええ。私は慈悲の心でエスコペターラを奏でています。"
"1015202-93-ツムギ" = "先ほども、あの方々を眠らせていなければ……。#n先生を含めここにいる全員が危険に晒されていたことでしょう。"
"1015202-94" = "[s] \"に、人間の死が社会の福祉……！\""
"1015202-95-ツムギ" = "ふふっ、そのフレーズはあくまでメッセージとして受け取ってください。"
"1015202-96-ツムギ" = "「ラブ・アンド・ピース」――は大事ですから。"
"1015202-97-ツムギ" = "さて、準備が整いました……路上ライブの開幕です。"
"1015202-98" = "[s] \"今日はどんな曲を演奏するの？\""
"1015202-99-ツムギ" = "いつもの曲から始めようと思っていたのですが……。"
"1015202-100-ツムギ" = "そうですね……面白いアレンジが降りてきたので――"
"1015202-101-ツムギ" = "このギターでしか演奏できない曲を披露しようかと。#nさて、どんな曲でしょう？"
"1015202-102" = "[s] \"え……まさか……？\""
"1015202-103-ツムギ" = "はい。その「まさか」です。"
"1015202-104-ツムギ" = "……始めましょう。"
"1015202-114-ツムギ" = "ひれ伏せェェェ！！暴徒どもォォォォォ！！"
"1015202-115-ツムギ" = "ラブ・アンド・ピース！ラブ・アンド・ピーーース！！"
"1015202-120" = "[ns] \"おぉ……。\""
"1015202-121" = "（いつもよりも激しいステージだ……）"
"1015202-126-スケバンA" = "う、うぅ……私、気絶していたのか……？"
"1015202-132-スケバンA" = "起きろ！お前ら！寝てる場合じゃねぇぞ！"
"1015202-133-スケバンB" = "うーん……なんだよ、このデケェ音は……！"
"1015202-134-スケバンC" = "あっ、あれは……！"
"1015202-135-ツムギ" = "ラブ・アンド・ピース！ラブ・アンド・ピーーース！！"
"1015202-141-ツムギ" = "ウォェェェェェェェェェェェェッ！！！！"
"1015202-142-スケバンA" = "ヒィィィッ！こ、こいつら！正気じゃねぇ！"
"1015202-143-スケバンB" = "うちらが手ェ出していい相手じゃなかった……！逃げろォ！"
"1015202-144-スケバンC" = "す、すんませんっしたァァァーーッ！！"
"1015202-151" = "（その後、スケバンの間で「広場でギターを持ってる女に気をつけろ」#nという噂が広まったとか広まらなかったとか……）"
