[translation]
"1005905-1" = "屋根裏部屋のお姫様"
"1005905-2" = "（思った以上に仕事が片付かず、約束していた時間より遅くなってしまった）"
"1005905-3-ミカ" = "あ、先生だ☆"
"1005905-4" = "[s] \"遅くなってごめん。待ったよね？\""
"1005905-5-ミカ" = "ううん、先生が忙しいのは知ってるから。#n私は今すっごいヒマしてるし、大丈夫大丈夫。"
"1005905-6" = "[s] \"ところで、一体どうしたの？\""
"1005905-7-ミカ" = "んーえっとねー……"
"1005905-8-ミカ" = "……ほんと、大したことじゃないんだけど。"
"1005905-9-ミカ" = "よかったらお茶とかどうかなーって！"
"1005905-10-ミカ" = "でも今日は休日だから……お店が早く閉まっちゃうんだよね。"
"1005905-11-ミカ" = "もうだいぶ遅い時間だし、開いてる店もないと思うし……"
"1005905-12-ミカ" = "せっかく来てくれたのに、どうしようね……。"
"1005905-13-ミカ" = "先生の時間を奪うのも申し訳ないし、やっぱりシャーレに帰る？#n先生、忙しいもんね。"
"1005905-14-ミカ" = "それに、私みたいなのと一緒にいたら、#n色々と噂されちゃいそうだし……"
"1005905-15" = "[s] \"ううん、そんな事は気にしないで。\""
"1005905-16-ミカ" = "うぅっ……うん。"
"1005905-17" = "[s1] \"遅れたのは私のせいだから。\"\n[s2] \"ちょっと休憩できるところ探す？\""
"1005905-18-ミカ" = "休憩できるところ……"
"1005905-19-ミカ" = "あっ、私の部屋とかどうかな？"
"1005905-20" = "[s] \"ミカの部屋？\""
"1005905-21-ミカ" = "ん？"
"1005905-22-ミカ" = "あっ！変な意味じゃないよ！#n部屋って言っても、寮の一部の空間というか……"
"1005905-23-ミカ" = "今日はお休みの日だから、門限も遅いんだ。"
"1005905-24-ミカ" = "貰い物のロールケーキと紅茶があるんだけど……#nロールケーキはちょっと飽きちゃって……#nこのままだとダメになっちゃうかもしれなくて……！"
"1005905-25-ミカ" = "あ！先生が持って帰って食べてもいいよ！#n捨てるよりはマシだからさ！"
"1005905-26" = "[s3]（あまり断り続けるのも申し訳ないし……送るついでなら……）\n[s4] \"じゃあ、ちょっと部屋に寄ってケーキだけ頂くね。\""
"1005905-27-ミカ" = "うん！あんまり長居はできないけど……。"
"1005905-28-ミカ" = "じゃ、行こっか！こっちこっち！"
"1005905-29" = "[ns]（かなり古び……歴史がありそうな建物だ……）"
"1005905-30-ミカ" = "ごめんね、ちょっと寂れた場所だよね。#n古い建物だからあんまり人気なくて、住んでる子も少ないの。"
"1005905-31-ミカ" = "この間なんかネズミが出たんだよ……。#nうぅ……前いた檻が恋しくなるレベル……。"
"1005905-32" = "[s] \"それは……大変だね……。\""
"1005905-33-ミカ" = "あはは！#nでも、こう見えてもセキュリティはちゃんとしてるから大丈夫☆"
"1005905-34-ミカ" = "私の部屋は一番上にあってね。#n非常階段登らないといけないんだけど……"
"1005905-35" = "[s5] \"非常階段……？\"\n[s6] \"ミカの部屋ってそんなところにあるの？\""
"1005905-36-ミカ" = "私は特例みたいだからね☆#n特別扱いってやつ？"
"1005905-37-ミカ" = "あっ！階段、結構急だから気をつけてね。"
"1005905-38" = "着いたー！"
"1005905-39" = "[s] \"ここってもしかして、屋根裏部屋……！？\""
"1005905-40" = "そうだね、"
"1005905-41" = "屋根裏……"
"1005905-42" = "……うーん、"
"1005905-43" = "そろそろ……"
"1005905-44" = "[ns] \"そろそろ？\""
"1005905-45" = "それでは点呼を行います！"
"1005905-46" = "[ns] \"！？！？\""
"1005905-47" = "現時刻をもって正門を閉鎖！#nおよび、各生徒は自室の前で待機するように！"
"1005905-48" = "点呼は上の階から行います！"
"1005905-49" = "先生、たいへーん！寮長がこっちに向かってきてる！"
"1005905-50" = "[s] \"ミ、ミカ！？\""
"1005905-51" = "とりあえず、部屋に入って毛布被ってて！#n女子寮に入ったのがバレたらマズいでしょ？"
"1005905-52" = "[s7] \"っ……えっ、うん！？\"\n[s8] とりあえず言われた通りにする。"
"1005905-53" = "（言われるがままにミカの部屋に入り、毛布を被った）"
"1005905-54" = "ミカ様、なんだか騒がしいようですが……いかがされましたか？"
"1005905-55" = "え？どうかしたの？"
"1005905-56" = "その……声が聞こえたような……。"
"1005905-57" = "あははっ☆何言ってるの？#n気のせいじゃない？"
"1005905-58" = "少しよろしいでしょうか。#n部屋の中を確認しても？"
"1005905-59" = "ホント信用されてないなぁ私……"
"1005905-60" = "別にいいよ、好きにすれば。"
"1005905-61" = "では失礼。"
"1005905-62" = "[ns] （……！！）"
"1005905-63-寮監の生徒" = "……。"
"1005905-64-寮監の生徒" = "ふむ……気のせいか……？"
"1005905-65" = "あまり騒がしくしないようお願いします、ミカ様。#nこの建物は古いため、声がよく通りますので。"
"1005905-66" = "では、ごゆっくり。"
"1005905-67" = "はーい、お疲れ様☆"
"1005905-68" = "……うわぁ、うまくいっちゃったね？"
"1005905-69-ミカ" = "先生、もう大丈夫。出てきていいよ。"
"1005905-70" = "[ns] \"ミカ……これは一体……！？\""
"1005905-71" = "― しーっ。"
"1005905-72" = "[wa:700]― ……先生は、[wa:1600]騙されたんだよ。"
"1005905-73" = "― どうしようね？"
"1005905-74" = "― もう、[wa:930]朝までここにいるしかないよ？"
"1005905-75" = "[wa:400]― こーんな簡単に[wa:1100]私を信じちゃうなんて、"
"1005905-76" = "[wa:430]― 先生って[wa:600]ホント……"
"1005905-77" = "[wa:100]― あれほど[wa:300]「私を信じないで」って[wa:2830]言ったのに……"
"1005905-78" = "[ns] \"ミカ……！！\""
"1005905-79" = "[wa:400]― ん？[wa:1650]ここで騒いだら……"
"1005905-80" = "[wa:200]― みんなに[wa:450]バレちゃうよ？[wa:2050]いいの？"
"1005905-81" = "― ……私は、[wa:1850]別に[wa:850]いいけど。 "
"1005905-82" = "[ns] \"…………。\""
"1005905-83" = "[wa:2000]― ……あれ。 "
"1005905-84" = "― もしかして……[wa:2000]怒った？"
"1005905-85" = "― 私が問題児だってことくらい、 "
"1005905-86" = "― 先生だって[wa:380]知ってたでしょ……？"
"1005905-87" = "[ns9] 無言を貫く。\n[ns10] \"流石にこれはやりすぎだよ……どうしてこんな事を？\""
"1005905-88" = "[wa:600]― その……"
"1005905-89" = "[wa:600]― その……"
"1005905-90" = "― 困らせたかったんじゃないの。"
"1005905-91" = "― 先生に、[wa:1650]嫌われるのは……[wa:3100]やだ……"
"1005905-92" = "― でも……[wa:2050]ちょっとだけ……"
"1005905-93" = "― ほんの[wa:550]ちょっとでいいから……"
"1005905-94" = "― 先生と、[wa:2650]一緒にいたかったの……。"
"1005905-95" = "（困惑するミカを宥め、朝まで静かに部屋で時を過ごした）"
"1005905-96" = "（正門が開いた頃、誰にも気づかれないよう寮を出てシャーレに戻った）"
