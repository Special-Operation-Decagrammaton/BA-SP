[translation]
"1005906-1" = "きずあと"
"1005906-2" = "（職員から事情の一部始終を聞いた）"
"1005906-3-トリニティの教員" = "……現在ミカさんは、校内で暴力沙汰を起こしたため、#n反省部屋で謹慎中です。"
"1005906-4" = "[s] \"暴力沙汰、ですか……？\""
"1005906-5-トリニティの教員" = "はい。別の生徒さんに手を上げたそうで……。"
"1005906-6" = "[ns1] \"…………！？\"\n[ns2] \"一体何があったんですか？\""
"1005906-7-トリニティの教員" = "詳しくは私も分かりませんが……"
"1005906-8-トリニティの教員" = "今日のプールの授業で、#nミカさんが見学していたんです。"
"1005906-9" = "[s] \"……見学？\""
"1005906-10-トリニティの教員" = "そうです。それも、授業が終わる頃にやってきて、#nプールサイドで見学をするわけでもなく、あちこち歩き回っていたようで……"
"1005906-11-トリニティの教員" = "ミカさんの授業態度にも問題はありました。"
"1005906-12-トリニティの教員" = "そのことに不満を抱いた何人かの生徒が抗議をしたようです。#nそうしたらミカさんが彼女たちに手を上げて……"
"1005906-13" = "[ns] \"…………。\""
"1005906-14-トリニティの教員" = "幸い、その生徒さんは大事には至りませんでしたし、#nミカさんも自ら謹慎を望んだので、そこで話は終わりましたが……"
"1005906-15-トリニティの教員" = "今のミカさんの立場のこともありますし、#nちょっと状況が複雑でして……あまり大事にならないといいのですが……"
"1005906-16-トリニティの教員" = "それで……その、ミカさんをシャーレの先生にお願いできればと……"
"1005906-17" = "[s] \"……分かりました。\""
"1005906-18-トリニティの教員" = "ありがとうございます！"
"1005906-19-トリニティの教員" = "では私は用事があるので、失礼いたします。"
"1005906-20" = "[ns] \"……。\""
"1005906-21" = "（謹慎中のミカの身柄を引き継ぐことになった）"
"1005906-22" = "[ns] \"ミカ……。\""
"1005906-23-ミカ" = "あはは……また、こんな風になっちゃった。"
"1005906-24-ミカ" = "ガッカリした……？でも、知ってるもんね、#n私が不良生徒な事。"
"1005906-25-ミカ" = "放っておいたら揉め事ばっか起こす……そんな問題児なんだから。"
"1005906-26-ミカ" = "迷惑ばっか、かけちゃってるし……そろそろ――"
"1005906-27" = "[ns] \"ミカ……もしかして、嫌がらせとかされてない？大丈夫？\""
"1005906-28-ミカ" = "っ……う、うん！？"
"1005906-29" = "[s] \"水着、なくしたの？\""
"1005906-30-ミカ" = "わ……わたし……"
"1005906-31-ミカ" = "せ、先生に、買って、もらった……水着、だったのに……。"
"1005906-32-ミカ" = "な、なんで！？"
"1005906-33-ミカ" = "水着が……！#nあれ？どこ……！？"
"1005906-34-陰険そうな生徒A" = "ぷっ……ティーパーティーの「お姫様」は、#nロッカーの管理もできないんですね。"
"1005906-35-陰険そうな生徒B" = "まあ、今までは全部お付きの人にやってもらってたみたいだし、#nそういうもんなのかな。"
"1005906-36-陰険そうな生徒C" = "でも、よかったんじゃないですかぁ？身分の高いお方ですもの……#n私たちみたいな庶民と同じプールに入るなんて、嫌ですよねぇ？"
"1005906-37-陰険そうな生徒A" = "あら……ゴミ箱がいっぱい。#nゴミが多かったのかしらねぇ……ぷっ。"
"1005906-38-ミカ" = "…………。"
"1005906-39-ミカ" = "ない……ゴミ箱も、焼却炉も探したけど……"
"1005906-40-ミカ" = "どこにも無い……！#nどうして……？#n大事なものなのに……一体どこに……。"
"1005906-41-陰険そうな生徒A" = "あら、こんなところにもゴミがありますねぇ？"
"1005906-42-ミカ" = "……！！"
"1005906-43-陰険そうな生徒B" = "ゴミっていうか、水着？"
"1005906-44-陰険そうな生徒B" = "まあ、もうズタズタで着れたもんじゃないですけど。"
"1005906-45-ミカ" = "あんた達、よくも……"
"1005906-46-陰険そうな生徒A" = "ひ、ひぃっ！？"
"1005906-47-陰険そうな生徒B" = "な、何よ！？ミカはもう反抗すらできない腑抜けって聞いたんだけど！？"
"1005906-48-陰険そうな生徒C" = "こ、殺される……！？"
"1005906-49-ミカ" = "（……ダメ）"
"1005906-50-ミカ" = "（……このままじゃ、また私は……）"
"1005906-51-陰険そうな生徒C" = "ま、魔女だ……！#nた、たすけて！！"
"1005906-52-陰険そうな生徒A" = "待って、置いてかないでよ！"
"1005906-53-陰険そうな生徒B" = "ちょっと引っ張らないで……！う、うわぁっ！？"
"1005906-54-陰険そうな生徒B" = "い、いたた……。"
"1005906-55-ミカ" = "水着が……"
"1005906-56-ミカ" = "……。"
"1005906-57-ミカ" = "先生……ごめんね。#n先生が買ってくれた水着、ダメになっちゃった……。"
"1005906-58-ミカ" = "まあ、当然だよね……#n今まで私、散々酷い事ばっかしてきたから……#n私が「いい子」だったら、こんなことなってないもんね。"
"1005906-59-ミカ" = "でも今回は……本当に、頑張ったのに……#nなのに……うまくいかなかったなぁ……。"
"1005906-60-ミカ" = "ごめんなさい……私、いつも先生の好意を台無しにしちゃうね……。#nこの水着で泳ぐの、楽しみだったのに……。"
"1005906-61-ミカ" = "……やっぱ、私には無理なんだねー……。"
"1005906-62-ミカ" = "何をしたって、もう取り戻せないんだ……。"
"1005906-63" = "[s] \"……ミカ、今日は時間ある？\""
"1005906-64-ミカ" = "……えっ？"
"1005906-65-ミカ" = "時間……？#nう、うん。まだ門限までは全然あるけど……"
"1005906-66" = "[ns] \"じゃあ、水泳の授業しに行こっか。\""
"1005906-67-ミカ" = "……えっ？"
"1005906-68" = "トリニティの指定洋服販売店"
"1005906-69-店員" = "……そうですね。#nかなりボロボロですが、修繕できないわけではありません。"
"1005906-70-ミカ" = "……。"
"1005906-71-店員" = "縫った跡が残るとは思いますが、普通に着る分には問題ないかと。#n買って間もないので、無料でお引き受けしましょう。"
"1005906-72" = "[s] \"ありがとうございます。\""
"1005906-73-店員" = "すぐ終わりますので、少々お待ちください。"
"1005906-74-店員" = "お待たせしました、どうぞ。"
"1005906-75-ミカ" = "……。"
"1005906-76-ミカ" = "水着も、直せるんだ……。"
"1005906-77-ミカ" = "知らなかった……#nダメになったら新しいのを買うしかないと思ってた……。"
"1005906-78-ミカ" = "せ、先生……？どこに向かってるの？……#nこっちは教室じゃないけど……。"
"1005906-79-ミカ" = "水泳の授業、だよね……？#n何をするのかは分かんないけどさ……。"
"1005906-80-ミカ" = "あと今の時間は、どこも開いてないはず――"
"1005906-81" = "[s] \"いい場所があるんだ。\""
"1005906-82" = "合宿所・プール"
"1005906-83-ミカ" = "ここは……"
"1005906-84-ミカ" = "そっか……そういえば、ここがあったね。"
"1005906-85" = "[s] \"思い出の場所、だよね？\""
"1005906-86-ミカ" = "……うん。"
"1005906-87-ミカ" = "長い間放ったらかされて、手入れもされず汚れたままだった……、#nほんと、手の施しようがないくらいにめちゃくちゃだったのに……"
"1005906-88-ミカ" = "今はこんなにも綺麗に生まれ変わってる。"
"1005906-89" = "[s3] \"うん、水着もそうだよね。\"\n[s4] \"他も、同じだと思うよ。\""
"1005906-90-ミカ" = "……。"
"1005906-91-ミカ" = "で、今から先生と水泳の授業？"
"1005906-92-ミカ" = "こんな深夜の……しかも人気のない場所で、二人きり……？#n大丈夫？バレたらかなりヤバいんじゃない？"
"1005906-93" = "[s] \"あっ！そ、そっか……。\""
"1005906-94-ミカ" = "ま、私はいいんだけど☆#n着替えてくるから待ってて！"
"1005906-95" = "[ns] \"ま、待ってミカ！？\""
"1005906-96-ミカ" = "じゃじゃ～ん☆"
"1005906-97-ミカ" = "見て、先生！ちょっとキツいけど、すっかり元通り！"
"1005906-98-ミカ" = "どうどう？似合う？#n学校指定の水着でもいいカンジ？"
"1005906-99-ミカ" = "ねぇねぇ？？"
"1005906-100" = "[s] \"えっと……ミカさん、ちょっと……近すぎます。\""
"1005906-101-ミカ" = "あははっ！なになに、女子生徒の水着姿だよ？#n逃げるなんて、傷ついちゃうなぁ。"
"1005906-102" = "[s] \"……。\""
"1005906-103-ミカ" = "うわぁ……冷静に考えたら、めちゃくちゃ恥ずかしくなっちゃった……。"
"1005906-104" = "[s] \"ミカは考えるより先に身体が動くタイプだったよね。\""
"1005906-105-ミカ" = "あははっ☆うん。#n根っこはそう簡単には変わらないみたい。"
"1005906-106-ミカ" = "先生も入る？#nすっごい気持ち良いよ☆"
"1005906-107" = "[s] \"いえ、お断りします……。\""
"1005906-108-警備員" = "ピーッ！そこ！#nこの場所は今、立ち入り禁止ですよ！"
"1005906-109-ミカ" = "わわっ、先生！警備員さん来ちゃったよ！？"
"1005906-110" = "[s5] \"ちょっと急な用事を思い出しちゃった、ごめん！それじゃ！\"\n[s6] ミカを連れて全速力で逃げる。"
"1005906-111-ミカ" = "せ、先生！？"
"1005906-112-ミカ" = "せ、先生！？"
