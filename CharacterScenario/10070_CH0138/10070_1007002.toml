[translation]
"1007002-1" = "第一印象"
"1007002-2" = "シャーレ・執務室"
"1007002-3" = "（時間通りに来ると言っていたはずだけど）"
"1007002-4" = "（10分以上経過しても、音沙汰がない……）"
"1007002-5" = "[ns1] \"何かあったのかな……？\"\n[ns2] \"電話してみよう。\""
"1007002-6" = "[ns] \"……ん？\""
"1007002-7" = "（着信音がドアの向こうから聞こえてきた）"
"1007002-8-？？？" = "おわあっ！"
"1007002-9" = "（大きな声まで聞こえたので、慌てて廊下に出てみると……）"
"1007002-10" = "[ns] \"ミナ……？\""
"1007002-11-ミナ" = "しまった……私としたことが。"
"1007002-12-ミナ" = "こんなはずではなかったのだが……#nすまない、先生。"
"1007002-13-ミナ" = "約束の時間に遅れてしまったことも含めて、謝罪させてくれ。"
"1007002-14" = "[s3] \"遅れたのは別にいいんだけど……\"\n[s4] \"そこで何してたの？\""
"1007002-15-ミナ" = "ふっ、そのことか。"
"1007002-16-ミナ" = "言葉にすれば単純な話ではあるが――だからこそ重要でもある。"
"1007002-17-ミナ" = "先生なら分かっていると思うが――#n最初というのは何よりも肝要だろう？"
"1007002-18-ミナ" = "最初に抱いた印象で、今後の関係性が決まってしまう。"
"1007002-19-ミナ" = "それは、まるでドミノの最初のブロックのように……#n1つ目が2つ目に、2つ目が3つ目に、と連鎖していくのと同じだ。"
"1007002-20" = "[s] （時間を守る方が大切な気もするけど……）"
"1007002-21-ミナ" = "そこで、どうすればハードボイルドでクールに登場できるのか……"
"1007002-22-ミナ" = "何より、初のシャーレ当番に[ruby=ふさわ]相応[/ruby]しい登場を考えていた結果――"
"1007002-23-ミナ" = "……いつの間にか、約束の時間を過ぎてしまったようだ。"
"1007002-24-ミナ" = "やれやれ、何事も程々が一番という事だな……"
"1007002-25-ミナ" = "だが、先生。#n誰であろうと、こういった事には頭を悩ませたはずだ。"
"1007002-26-ミナ" = "意気揚々とキャンディーを咥えたまま、拳銃片手にドアを開けるのと……"
"1007002-27-ミナ" = "気配を消して[ruby=ひそ]密[/ruby]やかに、プロフェッショナルに潜入するのとでは、印象が大きく異なるだろう？"
"1007002-28-ミナ" = "先生なら、どちらを選んだろうか？#nいや……それを想像するのも、また一興だな。"
"1007002-29" = "[s] \"あはは……今ので十分印象に残る登場だったよ……。\""
"1007002-30-ミナ" = "ふっ、先生に称賛されてしまうとはな。#n結果的に、これで正解だったか。"
"1007002-31" = "[ns5] \"初めての当番だし……\"\n[ns6] \"何か質問とかある？\""
"1007002-32-ミナ" = "ああ、そのことなんだが……"
"1007002-33-ミナ" = "まずは、お互いの呼び方を決めなくてはな。"
"1007002-34" = "[s] \"呼び方……？\""
"1007002-35-ミナ" = "相手をどのように呼ぶのか。#nそれは世間で思われているよりも、遥かに重要だと考えている。"
"1007002-36-ミナ" = "なぜなら、それは互いの関係性に直結するからだ。"
"1007002-37-ミナ" = "普通であれば、「先生」と呼ぶところだろうが――"
"1007002-38-ミナ" = "私は生憎、その程度の間柄に収まるつもりはない。"
"1007002-39-ミナ" = "私たちの関係は、他の生徒よりも特別なものであるべきだろう？"
"1007002-40-ミナ" = "フッ……そうは思わないか、先生。"
"1007002-41" = "[s] \"……そ、そんな気がしてきたような？\""
"1007002-42-ミナ" = "おおっ、先生も同じ気持ちなんだな！嬉しいぞ！"
"1007002-43-ミナ" = "玄龍門の執行部長という肩書きではなく、私たちの絆を示せる呼び方……"
"1007002-44-ミナ" = "悩ましいな。すぐには浮かびそうもない。"
"1007002-45-ミナ" = "しかし、簡単にはたどり着けないからこそ、意味があるものだ。"
"1007002-46" = "[s] （ここはミナに任せておこう……）"
"1007002-47-ミナ" = "……司令官？"
"1007002-48" = "[s] \"シャーレは軍隊ではありません！\""
"1007002-49-ミナ" = "じゃあ……指揮官？"
"1007002-50" = "[s] \"誤解を招きかねないから！\""
"1007002-51-ミナ" = "マスター？"
"1007002-52" = "[s] \"あんまり変わってなくない！？\""
"1007002-53-ミナ" = "ドクター？"
"1007002-54" = "[s] \"お医者さんでもないよ！\""
"1007002-55-ミナ" = "……カムラッド？"
"1007002-56" = "[ns] \"たしかに、そう呼ばれることもあるけどね！？\""
"1007002-57" = "（その後も一日中、お互いの呼び方を考え続けた）"
"1007002-58" = "（当然ながら、当番の作業が進むことはなかった）"
"1007002-59" = "（初日は軽い仕事だけだから、問題はなかったものの……）"
"1007002-60-ミナ" = "疲れたな……。"
"1007002-61" = "[s] \"そうだね……。\""
"1007002-62-ミナ" = "一周回って「先生」に落ち着くだなんて……。"
"1007002-63-ミナ" = "先生も満足していないだろうが、今日のところは仕方ない。"
"1007002-64" = "[s] \"「先生」で大丈夫だよ……。\""
"1007002-65-ミナ" = "そ、そうなのか？なら良いのだが……。"
"1007002-66" = "（残った時間で、ミナと一緒に仕事を進めた）"
