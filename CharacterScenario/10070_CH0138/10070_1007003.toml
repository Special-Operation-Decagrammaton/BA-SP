[translation]
"1007003-1" = "リコーダーの練習"
"1007003-2" = "（シュッ！）"
"1007003-3-玄龍門の構成員B" = "これ以上、逃げ場はないぞ。#n大人しく投降するなら、悪いようにはしない。"
"1007003-4-不良生徒A" = "チッ……！"
"1007003-5" = "[ns1] \"今だよ、ミナ！\"\n[ns2] \"行き止まりに追い込んだよ！\""
"1007003-6" = "（次の瞬間、どこかからリコーダーの音が聞こえてきたが……）"
"1007003-7" = "（それは形容しがたい奇怪な音色だった）"
"1007003-8-不良生徒A" = "な、何の音だ……？"
"1007003-9" = "[ns] \"み、ミナさん、そのリコーダーは……？\""
"1007003-10-ミナ" = "……（演奏中）"
"1007003-11-不良生徒A" = "何だよ、いったい……クソッ、最後に苦しませようってか？"
"1007003-12-ミナ" = "……（演奏中）"
"1007003-13-不良生徒A" = "やっ……やめてくれ！これ以上は耳がっ！！#n降参だ！投降するから許してくれ！！"
"1007003-14-ミナ" = "……。"
"1007003-15-ミナ" = "悪党には、この風情ある音色が分からないのか……！"
"1007003-16-ミナ" = "これ以上、お前らに[ruby=レクイエム]鎮魂曲[/ruby]を捧げる価値はない！"
"1007003-17" = "（その後、なぜか怒っているミナによって、不良生徒は取り押さえられた……）"
"1007003-18-ミナ" = "ふぅ……今日の祝杯は苦いな。"
"1007003-19" = "[ns] \"それ、ジュースだよね……。\""
"1007003-20-ミナ" = "フッ。"
"1007003-21" = "[s3] \"ところで、ミナさん……\"\n[s4] \"あのリコーダーは何だったんでしょうか？\""
"1007003-22-ミナ" = "ああ、リコーダーか。"
"1007003-23-ミナ" = "先生なら、気に入ってくれると信じていたぞ。"
"1007003-24-ミナ" = "以前、映画で見たことがあってな。"
"1007003-25-ミナ" = "オープニングと共にグラスの音が聞こえ――カクテルを一気に飲み干し……#nそのままクラリネットを演奏する主人公。"
"1007003-26-ミナ" = "彼は……その後も同僚が死ぬ時、決まってクラリネットを演奏していた。"
"1007003-27-ミナ" = "それで、私も心に決めたのだ。"
"1007003-28-ミナ" = "相手を取り押さえる前に、[ruby=レクイエム]鎮魂曲[/ruby]を捧げようとな。"
"1007003-29" = "[s] \"でもミナが吹いてたのは、リコーダーだよね……？\""
"1007003-30-ミナ" = "……。"
"1007003-31-ミナ" = "いいか、先生。"
"1007003-32-ミナ" = "クラリネットは……難しいんだ。"
"1007003-33" = "[s] \"だから、学校で習ったリコーダーを？\""
"1007003-34-ミナ" = "フッ。"
"1007003-35" = "[s] \"……。\""
"1007003-36-ミナ" = "それで、先生……演奏はどうだった？"
"1007003-37" = "[s] \"……正直に言っても良いかな？\""
"1007003-38-ミナ" = "ああ、もちろんだとも。"
"1007003-39" = "[s] \"[ruby=レクイエム]鎮魂曲[/ruby]には聞こえなかったかも……。\""
"1007003-40-ミナ" = "そっ、そうか……。"
"1007003-41-ミナ" = "だが、「これまで」よりも「これから」を語ろうじゃないか。"
"1007003-42-ミナ" = "繰り返される「今」が、やがて「未来」へ繋がる道となるのだから。"
"1007003-43" = "[s] \"……リコーダーの練習をする、ってことだよね？\""
"1007003-44-ミナ" = "フッ。"
"1007003-45-ミナ" = "やはり、先生は話が通じるな。"
"1007003-46" = "（その後も、ミナの演奏は続いた）"
"1007003-47-チンピラA" = "な、なんだ？このリコーダーの音は……？"
"1007003-48-チンピラB" = "形容しがたい……なんだこの音は！？"
"1007003-49-ミナ" = "フッ。"
"1007003-50-不良生徒A" = "ひぃっ！#nリコーダーの音が聞こえてきたぞ……！"
"1007003-51-不良生徒B" = "この耳[ruby=ざわ]障[/ruby]りな音は、いったい何なんだ……！"
"1007003-52-ミナ" = "……フッ。"
"1007003-53" = "#st;[0,0];instant;1;"
"1007003-54" = "#clearST"
"1007003-55-ミナ" = "ここ最近、玄龍門の治安が安定してきた。"
"1007003-56-ミナ" = "不良生徒が起こす騒ぎも減って、玄龍門としては喜ばしい限りだ。"
"1007003-57-ミナ" = "ふぅ……自分の仕事が実を結ぶと、気持ちがいいものだな。"
"1007003-58" = "[s5] \"リコーダーを吹きながら、不良生徒の取り締まりを行う……\"\n[s6] \"玄龍門の幹部がいるって噂が広まってるみたいだけど……\""
"1007003-59-ミナ" = "ああ、その噂か。私の耳にも入ってきた。"
"1007003-60-ミナ" = "ついに、私の[ruby=レクイエム]鎮魂曲[/ruby]の素晴らしさが知れ渡ってきたのだな？#nこれも演奏力が上がった証拠だろう。"
"1007003-61-ミナ" = "フフッ、これがやり甲斐か。実に素晴らしい。"
"1007003-62" = "[s] \"そうだね……。\""
"1007003-63" = "（恐ろしいリコーダーの音と共に現れる玄龍門幹部の噂は、あっという間に山海経全域へ広まった。）"
"1007003-64" = "（結果的として、山海経の治安維持に役立っているようなので、#nめでたし、めでたし……？）"
