[translation]
"1008905-1" = "二度あることは三度ある"
"1008905-2" = "（約束の時間を過ぎても、アルは現れなかった）"
"1008905-3" = "[ns1] \"トラブルにでも巻き込まれたのかな……\"\n[ns2] \"そろそろ連絡してみようかな……\""
"1008905-4-アル" = "い、いえ！あの、ちょっと……"
"1008905-5-アル" = "す、少しでいいの！少しだけ待ってちょうだい！#nど、どうして……？まさか、また……？"
"1008905-6" = "[ns3] \"今の声は……\"\n[ns4] 声が聞こえてきた方に向かう。"
"1008905-7-洋服直し屋" = "ううむ、参ったな。学生さんも大変なんだろうけど……"
"1008905-8-アル" = "ち、違うの！お金はちゃんとあるのよ！"
"1008905-9-洋服直し屋" = "いやいや、そんな責めるつもりは無いから落ち着いておくれ。"
"1008905-10-洋服直し屋" = "あんたにも事情があるんだろうけど……"
"1008905-11-洋服直し屋" = "ただ、そのな……こんな高価な服だと直すのに手間もかかったわけでな。#nさすがにツケで、ってのはちょっと……"
"1008905-12-洋服直し屋" = "何もあんたが逃げようとか疑ってるわけじゃないんだが、店の方針だからすまない。"
"1008905-13" = "[s5] \"アル、どうかしたの？\"\n[s6] 事情を聞く。"
"1008905-14-アル" = "……え、先生？"
"1008905-15-洋服直し屋" = "ん……？"
"1008905-16-洋服直し屋" = "……先生！？ど、どど、どうしてここに……！"
"1008905-17-洋服直し屋" = "ま、まだ約束の時間じゃ……！！"
"1008905-18-アル" = "……はっ。"
"1008905-19-アル" = "もうこんな時間……！？！？ "
"1008905-20" = "[ns7] \"なるほど、カードが使えなくなってたんだ。\"\n[ns8] \"それで代金が支払えなかったんだね。\""
"1008905-21-アル" = "どうやら、また風紀委員会が私の口座を見つけて止めたみたい。#n今度こそ絶対にバレないルートで作ったはずなのに……"
"1008905-22-アル" = "はぁ……困ったわね。#n凍結を解除するのにも時間がかかりそうだわ。"
"1008905-23-アル" = "うう……"
"1008905-24-アル" = "まったくもう！#n今日はこんな姿を見せるつもりじゃなかったのに……！！"
"1008905-25-アル" = "……ん？ええ、現金も一応あるにはあるんだけど……"
"1008905-26-アル" = "ただ、その……今回のお直しは少し高額で……"
"1008905-27-洋服直し屋" = "結構高価な服だったもんで、お直しの費用も当然それなりにかかってな……"
"1008905-28-洋服直し屋" = "学生さんの手持ちじゃ足りないらしいんだ。"
"1008905-29-洋服直し屋" = "……ん？"
"1008905-30-洋服直し屋" = "どの服を直したのかって？#nああ、これだよ。"
"1008905-31" = "[ns9] \"あれ、このドレス……\"\n[ns10] \"たしかに、これなら料金にも納得だね。\""
"1008905-32-洋服直し屋" = "だが、そこが問題でな。#n少額ならツケでも構わないんだが、これは流石に……"
"1008905-33-洋服直し屋" = "……え、なんだって？"
"1008905-34-洋服直し屋" = "あんたが代わりに払うのか……？"
"1008905-35-アル" = "……先生！？"
"1008905-36-洋服直し屋" = "もちろん構わないんだが……本当に大丈夫なのか？#nまあ、学生さんはすぐにこの服を受け取りたいみたいだったし……"
"1008905-37-洋服直し屋" = "良かったじゃねえか！ハッハッハ！！"
"1008905-38" = "（料金を代わりに支払ってドレスを受け取り、アルと一緒に商店街を後にした）"
"1008905-39-アル" = "……ありがとう、先生。また借りを作ってしまったわね。"
"1008905-40-アル" = "こ、これはその……なんというか……"
"1008905-41-アル" = "そ、そう！"
"1008905-42-アル" = "……投資！"
"1008905-43-アル" = "投資よ！便利屋に対する投資だと受け取っておくわ！"
"1008905-44-アル" = "……。"
"1008905-45-アル" = "あ、ありがとう……それと、ごめんなさい。#n迷惑をかけてばっかりで……"
"1008905-46-アル" = "……うん？"
"1008905-47-アル" = "気にしないで、と言ってもらえるのは嬉しいけど……"
"1008905-48-アル" = "こうもお世話になりっぱなしじゃ、そうもいられないわ。"
"1008905-49" = "[s11] \"事業を続けるには、信用が大切だからね。\"\n[s12] \"それに私も、未来の自分によく任せてるから！\""
"1008905-50-アル" = "………！！"
"1008905-51-アル" = "ふ、ふふっ……なるほど、流石は先生ね。#n素晴らしいアドバイスだわ。"
"1008905-52-アル" = "それなら、さっきの言葉を改めてハッキリさせておきましょう。"
"1008905-53-アル" = "……先生からの信用、この[ruby=りくはちま]陸八魔[/ruby]アルは絶対に忘れないわ。"
"1008905-54-アル" = "私に手伝ってほしいことがあれば、いつでも連絡してちょうだい！"
"1008905-55-アル" = "ふふ、ふふふ……！"
"1008905-56-アル" = "……あ、そうだ。"
"1008905-57-アル" = "今日の代金なのだけど……"
"1008905-58-アル" = "いつ返せばいいかしら？"
"1008905-59" = "（その後、何度も断ったのだが、アルは口座の凍結が解除されるとすぐにお金を振り込んできた）"
