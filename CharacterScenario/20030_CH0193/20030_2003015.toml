[translation]
"2003015-1" = "比翼の蝶"
"2003015-2-ハルナ" = "あ、先生。こちらです。"
"2003015-3" = "[s] \"お疲れ様。活躍してるみたいだね。\""
"2003015-4-ハルナ" = "……。"
"2003015-5-ハルナ" = "不思議ですね。#n先ほどまでは、いささかの疲労感があったのですが……。"
"2003015-6-ハルナ" = "先生にお会いしたら、嘘のように消えてしまいました。"
"2003015-7" = "[s] \"私、そんな効果あるかな……？\""
"2003015-8-ハルナ" = "ふふっ。どうでしょう。"
"2003015-9-ハルナ" = "……ところで、先生？"
"2003015-10-ハルナ" = "[ruby=わたくし]私[/ruby]を見て、何かお気づきになりませんか？"
"2003015-11" = "（その言葉を聞いた瞬間……）"
"2003015-12" = "（背中を冷汗が伝った）"
"2003015-13" = "（答えを間違えるわけにはいかない……！）"
"2003015-14" = "[ns] \"えっと、服……かな？\""
"2003015-15-ハルナ" = "ふふっ……。"
"2003015-16-ハルナ" = "あまりに分かりやすいもの、ではありませんよ？"
"2003015-17" = "（ハルナは笑っているが、何かの「カウント」が一つ進んだ気がする……）"
"2003015-18" = "[ns] \"か、髪型も違うよね！\""
"2003015-19-ハルナ" = "たしかに、行きつけの美容室に今日のためのセットをお願いしましたが――"
"2003015-20-ハルナ" = "それも、分かりやすいところでは？"
"2003015-21-ハルナ" = "同様に、サングラスも正解ではありません。"
"2003015-22" = "（ハルナは笑顔を崩さないが、また一つ「カウント」が進んだ気がする）"
"2003015-23-ハルナ" = "ふふふ……。"
"2003015-24-ハルナ" = "意地悪なことをしている自覚はあるのです。"
"2003015-25-ハルナ" = "ですが先生ならば……と思いまして。"
"2003015-26-ハルナ" = "もしかしたら、ということもあるでしょう？"
"2003015-27-ハルナ" = "さぁ、先生。"
"2003015-28-ハルナ" = "今日の私は、ひと味違うと思いませんか……？"
"2003015-29" = "（これが……ラストチャンス……！）"
"2003015-30" = "[ns] \"……あっ！羽飾り！！\""
"2003015-31-ハルナ" = "！？！？"
"2003015-32" = "[ns] （え……？）"
"2003015-33-ハルナ" = "さ、流石です……。"
"2003015-34-ハルナ" = "私の目に……狂いはありませんでしたわ……。"
"2003015-35-ハルナ" = "まるで、極上の美食のような……。"
"2003015-36" = "（どこか妙な雰囲気のハルナに、声をかけたが――）"
"2003015-37" = "（ハルナは動揺し、ぎこちない笑顔を浮かべていた……）"
"2003015-38-ハルナ" = "え、えっと……。"
"2003015-39-ハルナ" = "実は私、日によって身に着ける羽飾りを変えているのです。"
"2003015-40-ハルナ" = "普段は、リボン付きのペンデュラム――"
"2003015-41-ハルナ" = "フォーマルな場では、丸形のハート。"
"2003015-42-ハルナ" = "もちろん、その日の気分で選ぶこともあります。"
"2003015-43" = "[s] \"そうだったんだね。\""
"2003015-44-ハルナ" = "そして今日は特別な時につける……蝶の羽飾り。"
"2003015-45-ハルナ" = "私のお気に入りです。"
"2003015-46-ハルナ" = "なので……嬉しかったです。気づいてくださって。"
"2003015-47" = "[ns] \"あ、うん……。\""
"2003015-48-ハルナ" = "この飾りをよくご覧ください。"
"2003015-49-ハルナ" = "片方が黄色い羽、もう片方はガラスの羽になっているでしょう？"
"2003015-50-ハルナ" = "先生は、それぞれの意味をご存じですか？"
"2003015-51" = "[s] \"初めて聞いた……どういう意味なの？\""
"2003015-52-ハルナ" = "ふふ。事前に味が分かっていては、せっかくの美食も魅力が薄れてしまうというもの。#n答えは、後の楽しみにしておきましょう。"
"2003015-53-ハルナ" = "それはそれとして……半分ずつというのは、それ自体にも意味があるのです。"
"2003015-54-ハルナ" = "これは、一対の蝶――"
"2003015-55-ハルナ" = "つまり……。"
"2003015-56-ハルナ" = "……。"
"2003015-57-ハルナ" = "も、申し訳ないのですが、この話はここまでとさせてください。"
"2003015-58" = "[s] \"えっ、どうして……？\""
"2003015-59-ハルナ" = "どうか、お構いなく……。"
"2003015-60" = "[s] \"まぁ、ハルナがそう言うなら……。\""
"2003015-61" = "[ns1] \"ところで、お気に入りって言ったよね？\"\n[ns2] \"今日は汚れやすいんじゃない……？\""
"2003015-62-ハルナ" = "……！"
"2003015-63-ハルナ" = "そ、それは……。"
"2003015-64-ハルナ" = "もちろん、リスクは承知の上です。"
"2003015-65-ハルナ" = "ですが、それでも……これを選ぶ理由があったのです。"
"2003015-66" = "[s] \"そう……なんだ？\""
"2003015-67-ハルナ" = "ええ。理由の主は、どうにも鈍感な方ですので……#nきっと、ご本人はお気づきにならないかもしれませんが。"
"2003015-68-ハルナ" = "……。"
"2003015-69-ハルナ" = "不思議だと思いませんか？"
"2003015-70-ハルナ" = "アクセサリーの些細な違いには、気づいてくださるのに――"
"2003015-71-ハルナ" = "その向こう側にあるものには、まったく気づいてくださらない。"
"2003015-72-ハルナ" = "ええ、まったく……わざとかと思うほどに。"
"2003015-73" = "[s] \"なんか……怒ってる？\""
"2003015-74-ハルナ" = "いえ、まさか。"
"2003015-75-ハルナ" = "ただ……。"
"2003015-76-ハルナ" = "私は……。"
"2003015-77-ハルナ" = "……。"
"2003015-78-ハルナ" = "ふふっ。何でもありません。"
"2003015-79-ハルナ" = "きっと私は、先生のそういうところも……。"
"2003015-80-ハルナ" = "さて、先生？今日の美食――"
"2003015-81-ハルナ" = "ではなく。"
"2003015-82-ハルナ" = "少しお時間を、いただけないでしょうか。"
"2003015-83-ハルナ" = "私の「違い」に気づいてくださった「お礼」に――"
"2003015-84-ハルナ" = "今日は私に「ご馳走」させてください。"
"2003015-85-ハルナ" = "いつもお世話になっておりますし、日頃の恩返しも兼ねて。"
"2003015-86" = "[s3] \"ハルナ……ありがとう……！\"\n[s4] \"嬉しくて泣いちゃいそうだよ……。\""
"2003015-87-ハルナ" = "では、決まりですわね。"
"2003015-88-ハルナ" = "さあ、先生。私がご案内いたしますわ。"
"2003015-89" = "（近寄ってきたハルナがそっと私と腕を組み――）"
"2003015-90" = "（会場の隅々まで、一緒に回った）"
