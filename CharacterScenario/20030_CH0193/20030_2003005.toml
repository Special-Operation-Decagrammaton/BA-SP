[translation]
"2003005-1" = "美食の道は、どこにでもありますわ"
"2003005-2" = "（どういう風の吹き回しかわからなかったけれど……）"
"2003005-3" = "（期待半分、興味半分でハルナの競技を見守ることにした）"
"2003005-4-ハルナ" = "あら、先生。来てくださったのですね。"
"2003005-5" = "[s1] \"生徒の応援は先生の役目だからね。\"\n[s2] \"ところで、どの種目に出るの？\""
"2003005-6-ハルナ" = "どの種目？それは答えられませんわね。#n何故なら――"
"2003005-7-ハルナ" = "「色んな種目」に出るのですから！"
"2003005-8" = "[s] \"い、色んな！？ひとつじゃなくて！？\""
"2003005-9-ハルナ" = "ふふっ、わかっていただけたでしょうか？"
"2003005-10-ハルナ" = "それだけ私が本気だということを。"
"2003005-11" = "[s3] \"一体何がどうなって……。\"\n[s4] \"ハルナがここまで本気になったの……？\""
"2003005-12-ハルナ" = "それはですね……。"
"2003005-13-アナウンサー" = "[ruby=くろだて]黒舘[/ruby]ハルナ選手。間もなく「パン食い競争」が始まります。#nスタートラインまでお越しください。"
"2003005-14" = "[s] \"…………なるほど。\""
"2003005-15-ハルナ" = "……そうです。#nたとえ大運動会中で周りが浮かれていようとも、#n私たちは変わりません。"
"2003005-16-ハルナ" = "競技のために用意された食べ物がちゃんとしたものなのか……#nそれを確かめることこそ、美食研究会の使命と言えるでしょう！"
"2003005-17" = "[s] \"う、うん……そうだね。頑張って……。\""
"2003005-18-ハルナ" = "ふふっ。応援ありがとうございます、先生。"
"2003005-19-ハルナ" = "それでは……パン食い競争、全力で味わってまいりますわ。"
"2003005-20" = "（ハルナは軽快な足取りで歩いていった）"
"2003005-21" = "（すべての選手がスタートラインに並び、そして――）"
"2003005-22" = "（ハルナはトップ集団に食らいつきながら、ついにパンがぶら下がっている折り返し地点に到達した！）"
"2003005-23-ハルナ" = "ふふっ……ようやくこの時が来ましたわね。"
"2003005-24" = "[s] \"ハルナー！頑張れー！\""
"2003005-25-ハルナ" = "では、パン食い競争の醍醐味……いただきましょうか？"
"2003005-26-ハルナ" = "（もぐもぐ）"
"2003005-27-ハルナ" = "（もぐもぐもぐもぐ）"
"2003005-28-ハルナ" = "……。"
"2003005-29" = "[s] \"あれ、ハルナの表情が……？\""
"2003005-30-ハルナ" = "完っ全にダメですわ！！"
"2003005-31-ハルナ" = "競技用のパンだからといって、甘く考え過ぎではありませんか！？"
"2003005-32-ハルナ" = "表面は乾ききっているし、中もパサパサで粉っぽい……。"
"2003005-33-ハルナ" = "発酵時間はきちんと守られているのですか？#nオーブンの予熱は？決められた温度に設定されていたのですか？"
"2003005-34-ハルナ" = "……本当に信じられませんわ。#n最高の味を保証できなくとも、最低水準を引き上げられるのが、#n工場における大量生産の強みなのに――"
"2003005-35-アナウンサー" = "おおっと！？ハルナ選手、突然競技を放棄しパンのダメ出しを始めましたーっ！？"
"2003005-36" = "（……その後も、パンの味に対するハルナの抗議はしばらく続いた……）"
"2003005-37" = "（そして、次の競技の時間になった）"
"2003005-38" = "[s] \"よ、よし。次の試合は！？\""
"2003005-39-ハルナ" = "はい、障害物競走です。"
"2003005-40" = "[s] \"（今度は食と関係なさそうな種目だ！）\""
"2003005-41-ハルナ" = "イオン飲料が飲めるということで参加しましたが……。"
"2003005-42-ハルナ" = "何ですかこの甘さは！こんなに糖分が多いと、#nむしろ水分の吸収を妨げてしまうのでは！？"
"2003005-43-ハルナ" = "もちろん運動後の身体に糖分でエネルギー補給を図るのは大切ですが……。"
"2003005-44-ハルナ" = "口の中がベタつくほど糖分を入れるのは、#nさすがに問題があると思いますわよ？"
"2003005-45-ハルナ" = "イオン飲料はイオン飲料……適切な甘さにするべきです！"
"2003005-46-ハルナ" = "甘いものを作りたいなら、#n別の種類の飲み物を考えてはいかがでしょうか！？"
"2003005-47" = "[s] \"障害物競走でも容赦ない評価が！？\""
"2003005-48-ハルナ" = "まだ終わりませんわよ？"
"2003005-49-ハルナ" = "アーチェリー種目の参加賞で、#n生クリームドーナッツが頂けると聞きましたが……。"
"2003005-50-ハルナ" = "このドーナツに入っているクリーム、#n生クリームではありません！植物性クリームです！ "
"2003005-51-ハルナ" = "純粋な生クリームは生乳から乳脂肪を抽出して作られます。#n対して植物性クリームは植物性油脂から作られたクリーム……。"
"2003005-52-ハルナ" = "どれだけ生クリームに似せたとしても、コクや旨味の違いは見逃せませんわ！"
"2003005-53-ハルナ" = "賞品にするのでしたら、その食べ物をよく理解してからになさってください！"
"2003005-54" = "（……どの競技でも、ハルナは食べ物に対して熱弁を振るい……）"
"2003005-55-ハルナ" = "……いよいよ最後の試合ですわね。"
"2003005-56-ハルナ" = "飴食い競争……小麦粉の中に隠された飴を口だけで見つける、高難度の競技です。"
"2003005-57-ハルナ" = "先生。最後まで応援、よろしくお願いしますね？"
"2003005-58" = "[s] \"う、うん。任せて……。\""
"2003005-59" = "（ハルナは幾度目かのスタートラインに立ち……）"
"2003005-60" = "（疲労感など全く感じさせない走りで飴が隠された箱まで辿り着き、顔を埋めた……！）"
"2003005-61-アナウンサー" = "先頭は――ゲヘナ学園の黒舘ハルナ選手だーっ！"
"2003005-62-アナウンサー" = "すごいスピードです！これまでの競技の様子は嘘だったのでしょうか！？"
"2003005-63-アナウンサー" = "走って走って走って――"
"2003005-64-アナウンサー" = "そのままゴールインっ！！"
"2003005-65-アナウンサー" = "……おや？ハルナ選手、ゴールラインを超えても止まりません！#n一体彼女はどこに向かっているのでしょうか！？"
"2003005-66-ハルナ" = "はぁ、はぁ……先生！ご覧になりましたか？"
"2003005-67" = "[s] \"もちろん！1位おめでとう！\""
"2003005-68-ハルナ" = "ふふふ……。"
"2003005-69" = "[wa:500]― [log=하루나 체육복ND]心躍る、[wa:1300]美味しい[wa:300]競技でしたわね。[/log]"
"2003005-70" = "― [log=하루나 체육복ND]顔は[wa:300]少し[wa:250]汚れてしまいましたけれども……。[/log]"
"2003005-71" = "[wa:500]― [log=하루나 체육복ND]ですが、[wa:1050]未知の[wa:320]領域とも言える[wa:780]小麦粉の中から[/log]"
"2003005-72" = "[wa:100]― [log=하루나 체육복ND]自分の感覚だけで[wa:1650]飴を見つける行為は……。[/log]"
"2003005-73" = "[wa:500]― [log=하루나 체육복ND]美食を[wa:400]探求する過程と、[/log]"
"2003005-74" = "― [log=하루나 체육복ND]どこか[wa:400]似ているような気がして……[/log]"
"2003005-75" = "― [log=하루나 체육복ND]とても[wa:400]新鮮でした。[/log]"
"2003005-76" = "[wa:200]― [log=하루나 체육복ND]あ、[wa:800]そうです！[/log]"
"2003005-77" = "[wa:700]― [log=하루나 체육복ND]先生、[wa:850]いかがでしょう？[/log]"
"2003005-78" = "― [log=하루나 체육복ND]先程とった[wa:1050]この飴……[/log]"
"2003005-79" = "― [log=하루나 체육복ND]分けて[wa:1000]差し上げましょうか？[/log]"
"2003005-80" = "（ハルナの飴をなんとか断りながら、一緒に戻った）"
"2003005-81" = "（食べ物に抗議ばかりしていたはずなのに、ハルナは妙に機嫌がよかった）"
