[translation]
"1003203-1" = "正月には正月らしく！"
"1003203-2" = "（ムツキと約束した場所に到着すると、既に人だかりができていた）"
"1003203-3-ムツキ" = "あっ、先生～！"
"1003203-4-ムツキ" = "くふふっ、遅れずにちゃーんと来たね？"
"1003203-5-ムツキ" = "先生もしかしたら仕事で忙しくて、ぐすっ、来てくれないんじゃないかなって……思ったり思わなかったり？"
"1003203-6" = "[s] \"せっかくムツキと、お出かけの約束をしたからにはね。\""
"1003203-7-ムツキ" = "あはっ。"
"1003203-8-ムツキ" = "ふーん、そうなんだ～？"
"1003203-9-ムツキ" = "ところでやっぱりお正月だね、人の数がすごーい。"
"1003203-10-ムツキ" = "んー……何だかもう疲れたし、ちょっと飽きてきたかも？"
"1003203-11" = "[s] \"今来たばっかりじゃ……？\""
"1003203-12-ムツキ" = "くふふっ、冗談冗談～。じゃあ、中の方に行こっか？"
"1003203-13-ムツキ" = "先生、どうしたの？え、ここに来た理由？"
"1003203-14-ムツキ" = "それはもちろんモモトークで言った通り、お願いごと！ここは特に、絵馬が可愛いって有名なこともあって！"
"1003203-15-ムツキ" = "せっかくのお正月だし、お正月らしいことを楽しまないとなって思って♪"
"1003203-16-ムツキ" = "ほらほら、こうしてる場合じゃないよ。早く行こっ、先生！"
"1003203-17" = "（ムツキに引っ張られるようにして、中の方へと入っていく）"
"1003203-18-ムツキ" = "……。"
"1003203-19-ムツキ" = "ん～～～……"
"1003203-20-ムツキ" = "あーもー、息苦しい～～！"
"1003203-21-ムツキ" = "いっそのこと今ここで爆弾を使えば、スッキリするんじゃ……？"
"1003203-22" = "[s] \"それはやめておこう！？\""
"1003203-23-ムツキ" = "あはっ、冗談だよーもう先生ったら。"
"1003203-24-ムツキ" = "いくら私でも、時と場所は選ぶって！"
"1003203-25-ムツキ" = "……時と場所、今な気がしてきちゃった。"
"1003203-26" = "[s] \"もう少し、もう少しだから！\""
"1003203-27" = "（そうして何とかムツキを宥めつつ……）"
"1003203-28-会場のお客さんA" = "あら、失礼。"
"1003203-29-ムツキ" = "あっ――"
"1003203-30" = "[s] \"ムツキっ！\""
"1003203-31-ムツキ" = "せ、先生……。"
"1003203-32" = "[s] \"大丈夫？怪我は？\""
"1003203-33-ムツキ" = "わ、私は大丈夫だけど、その……。"
"1003203-34-ムツキ" = "そんなに情熱的に、手を握られると……。"
"1003203-35-ムツキ" = "……くふふっ♪もしかして先生、こうやって私と大接近して、手を握るチャンスをずっと狙ってたり～？"
"1003203-36-ムツキ" = "あははっ、そんなに慌てて離れなくても良いのに～。"
"1003203-37-ムツキ" = "うん。でもまあ先生のおかげで、イライラは無くなったかな？"
"1003203-38-ムツキ" = "まあさっきぶつかってきた人に爆弾をプレゼントすれば、もっとスッキリしそうだけど。"
"1003203-39" = "[s] \"やめておこうね……。\""
"1003203-40-ムツキ" = "くふふっ♪"
"1003203-41-ムツキ" = "あっ、次私たちの番だよ、先生！"
"1003203-42-ムツキ" = "この絵馬に願い事を書いて、あそこにかければいいんだって。"
"1003203-43-ムツキ" = "それじゃ、書こっか？"
"1003203-44" = "[s1] （今年一年、平和でありますように……）\n[s2] （今年も楽しいことがたくさんありますように……）"
"1003203-45-ムツキ" = "先生、もう書いた？"
"1003203-46-ムツキ" = "くふふっ……！"
"1003203-47-ムツキ" = "何書いたか見ーせてっ！"
"1003203-48" = "[s3] \"ちょっ、ムツキ！？\""
"1003203-49-ムツキ" = "あはっ、これこそが今日最大の目的！先生が何を願うのか、見てみたいなーって！"
"1003203-50-ムツキ" = "くふふっ、私の手のひらからは逃れられないんだから～♪"
"1003203-51-ムツキ" = "やっ、はっ、それっ！あははっ！"
"1003203-52-ムツキ" = "先生の絵馬ゲット～♪願い事は一体何なのかな～？"
"1003203-53-ムツキ" = "んー……？「今年一年、平和でありますように」？"
"1003203-54-ムツキ" = "えー、つまんな～い……。"
"1003203-55-ムツキ" = "あーあ、先生ならもっと世俗的で～、腹黒くって～"
"1003203-56-ムツキ" = "欲望に塗れた願いごとを書いてくれるのかな～って期待してたのに。残念。"
"1003203-57" = "[s4] \"そんなの書いてる方がガッカリしない……？\""
"1003203-58-ムツキ" = "んー、どうかな～？"
"1003203-59-ムツキ" = "先生、もう書いた？"
"1003203-60-ムツキ" = "くふふっ……！"
"1003203-61-ムツキ" = "何書いたか見ーせてっ！"
"1003203-62" = "[s5] \"ちょっ、ムツキ！？\""
"1003203-63-ムツキ" = "あはっ、これこそが今日最大の目的！先生が何を願うのか、見てみたいなーって！"
"1003203-64-ムツキ" = "くふふっ、私の手のひらからは逃れられないんだから～♪"
"1003203-65-ムツキ" = "やっ、はっ、それっ！あははっ！"
"1003203-66-ムツキ" = "先生の絵馬ゲット～♪願い事は一体何なのかな～？"
"1003203-67-ムツキ" = "んー……？「今年も楽しいことがたくさんありますように」……？"
"1003203-68-ムツキ" = "ふ～ん？これが先生の願い事なんだー。"
"1003203-69-ムツキ" = "「楽しいこと」かー……これって先生は具体的に、何を想像してるのかな～？"
"1003203-70-ムツキ" = "例えばぁ……私みたいな可愛い子と、あんなことやこんなことをして～……"
"1003203-71-ムツキ" = "きゃーってなって、うわーってなるような？そういうやつ？"
"1003203-72" = "[s6] \"……はい？\""
"1003203-73-ムツキ" = "もしそういうことがしたいんだったら～、今すぐ私が叶えてあげよっか？"
"1003203-74-ムツキ" = "……なーんちゃって☆"
"1003203-75-ムツキ" = "あははははっ！先生、今もしかして結構ドキッとした？くふふっ♪"
"1003203-76" = "[s] \"えっと、ところでムツキのお願いごとは？\""
"1003203-77-ムツキ" = "んー、私？"
"1003203-78-ムツキ" = "私は別に、そういうのあんまり無いもーん。だからほら、絵馬にも何も書いてないよ？"
"1003203-79-ムツキ" = "くふふっ♪今日ここに来たのは、ただ先生がどんな願い事を書くのかな～って気になって遊びに来ただけだし。"
"1003203-80" = "[s] \"じゃあ代わりに、ムツキのお願いごと書いてあげるね。\""
"1003203-81-ムツキ" = "……え？"
"1003203-82-ムツキ" = "えー……？別に私の願いごとなんか、どうでも良くない？"
"1003203-83-ムツキ" = "そもそも私は、別に願いごととか――"
"1003203-84" = "[ns] \"じゃあお任せで良い？\""
"1003203-85-ムツキ" = "え、ちょっと、先生……？何書いてるの……？"
"1003203-86" = "[ns7] \"こういうのでどう？\"\n[ns8] \"大切な人たちと、ずっとずっと一緒にいられますように。\""
"1003203-87-ムツキ" = "あっ……"
"1003203-88-ムツキ" = "あっ……"
"1003203-89-ムツキ" = "先生そんなに真剣に、私の……"
"1003203-90-ムツキ" = "……"
"1003203-91" = "[s] \"……ムツキ？\""
"1003203-92-ムツキ" = "くっ、くふふっ、あははははっ！"
"1003203-93-ムツキ" = "な、何それ！そんな照れくさいこと、よくそんな真面目に……！あはははっ！"
"1003203-94-ムツキ" = "うわー、ムツキちゃんもびっくりだよ……くふふふっ、さすが先生！面白過ぎっ！"
"1003203-95" = "[s] \"そ、そんなに照れくさい内容かな……？\""
"1003203-96-ムツキ" = "あはははっ！ほんっとお腹痛い！ひーっ！"
"1003203-97-ムツキ" = "やっぱり先生、時々本当にレベル高いねー！"
"1003203-98-ムツキ" = "あー、何だか今回はやられちゃった気分……"
"1003203-99-ムツキ" = "あー、面白い。"
"1003203-100-ムツキ" = "今回は負けちゃったけど、次はこんな風にやられたりしないから！"
"1003203-101-ムツキ" = "次こそは先生を思いっきり慌てさせて、私が勝つんだからね！"
"1003203-102-ムツキ" = "じゃあ先生、ばいばーい！"
"1003203-103" = "[ns9] \"勝ち負けの基準が分からない……。\"\n[ns10] \"えぇ……？\""
"1003203-104" = "（そうして、楽しそうに走っていくムツキが見えなくなるまで見送った）"
