[translation]
"1012606-1" = "それは……私じゃないよ"
"1012606-2" = "（ひとまず、今日の仕事のためにオフィスを出発した）"
"1012606-3-黒猫" = "ニャーオ……ンニャーオォ……。"
"1012606-4-カラス" = "ガァー！ガァー！"
"1012606-5" = "[ns] \"……黒猫とカラス？\""
"1012606-6" = "[ns] \"……！？\""
"1012606-7-カノエ" = "イ……ヒ……ヒッ……。"
"1012606-8" = "[ns1] （……いつにも増してオーラが！）\n[ns2] （言われた通り無視しないと……！）"
"1012606-9-黒猫" = "ニャーオ！ンニャーオォ！"
"1012606-10-カノエ" = "……。"
"1012606-11" = "[ns] \"なっ……！？\""
"1012606-12-カラス" = "ガァー！ガァー！"
"1012606-13-カノエ" = "……。"
"1012606-14" = "[ns] \"ここにも！？\""
"1012606-15-カノエ" = "……。"
"1012606-16" = "[ns] \"どうして！？\""
"1012606-17" = "（……どこに行っても、視界にカノエがいる）"
"1012606-18" = "（仕事は予定通り片づいたものの……）"
"1012606-19" = "（ずっと、行く先々にカノエがいた……）"
"1012606-20" = "[ns] \"はぁ、はぁ……。\""
"1012606-21-寮監隊の生徒" = "あ、いらしたのですね、先生。#n今日のご予定は伺っております。"
"1012606-22-寮監隊の生徒" = "随分と息を切らしていますが、そんなに急がれなくとも……。"
"1012606-23" = "[s] \"そ、それが……。\""
"1012606-24" = "（これまでの出来事を説明する）"
"1012606-25-寮監隊の生徒" = "カノエ……？[ruby=いたがき]板垣[/ruby]カノエのことですか？#n存在そのものがオカルトだという、あの？"
"1012606-26" = "[s] \"それは、どういう……？\""
"1012606-27-寮監隊の生徒" = "あの子、いつも黒猫やカラスと一緒なんでしょう？"
"1012606-28-寮監隊の生徒" = "全然知らない子だと本人は言ってるみたいですが……#nどう考えてもおかしいじゃないですか。"
"1012606-29" = "（……たしかに、猫やカラスたちはカノエの言うことをよく聞いていた）"
"1012606-30-寮監隊の生徒" = "手は冷たいし、肌も青白くて……。"
"1012606-31-寮監隊の生徒" = "しかも異常なほどたくさんの声色を持っていて、#n「どれが本当の声か分からない」と噂されているんですよ。"
"1012606-32" = "（カノエに何度かイタズラをされているので、否定しづらい……）"
"1012606-33-寮監隊の生徒" = "もしかするとあの子……幽霊なのかもしれません。"
"1012606-34-寮監隊の生徒" = "今もどこかで私たちを見ていたりして……！"
"1012606-35" = "[ns] \"……！\""
"1012606-36" = "（びっくりして周りを見渡すが、カノエの姿は見当たらなかった）"
"1012606-37-寮監隊の生徒" = "……なんて。#nこうは言ったものの、うちの学院は変わり者が多いですから。"
"1012606-38-寮監隊の生徒" = "ただのイタズラかもしれませんし、あまりお気になさらないでください。"
"1012606-39-寮監隊の生徒" = "私たちも適当に対応していますから。"
"1012606-40" = "[s] \"そ、そうだよね？はは……。\""
"1012606-41" = "（急いで仕事を終わらせて、オフィスに帰ってきた）"
"1012606-42" = "（翌日……）"
"1012606-43" = "（カノエからだ）"
"1012606-44" = "（たしか、安全になったら連絡するって……）"
"1012606-45-カノエ" = "先生……昨日は無事だった……？"
"1012606-46-カノエ" = "もう大丈夫だから、いつも通りにしていいよ……。"
"1012606-47" = "[s3] \"昨日のあれは何だったの？\"\n[s4] \"どこに行ってもカノエがいたんだけど……。\""
"1012606-48-カノエ" = "まずは謝らせて……。"
"1012606-49-カノエ" = "昨日のことは、全部私がミスしたせい。ごめんね。"
"1012606-50-カノエ" = "完璧な儀式のはずだったのに、失敗するなんて……。"
"1012606-51" = "[s] \"ぎ、儀式……？\""
"1012606-52-カノエ" = "悪霊召喚の儀だよ。"
"1012606-53-カノエ" = "でも、失敗して……#nその代償に私と瓜二つの存在を[ruby=よ]喚[/ruby]び出してしまった。"
"1012606-54-カノエ" = "性格も同じだったから……すぐに先生を求めて動きだしたんだ。"
"1012606-55" = "[s] \"じゃあ、昨日私が見てたカノエは……？\""
"1012606-56-カノエ" = "そう。全部、私そっくりの悪霊だよ。"
"1012606-57-カノエ" = "でも心配しないでねぇ。今は「元いたところ」へ帰してやったから……。"
"1012606-58" = "[s5] \"本当に悪霊だったの？\"\n[s6] \"カノエ本人じゃなくて……？\""
"1012606-59-カノエ" = "うん……。仕事で忙しい先生を遠くから眺めていたかったとか――"
"1012606-60-カノエ" = "苦労して手に入れた外出許可を有意義に使おうとか……#n悩んでたわけでもないからねぇ……。"
"1012606-61" = "[s] \"絶対カノエ本人でしょ！？\""
"1012606-62-カノエ" = "解釈は任せるよ。#n私はちゃんと、儀式に失敗した代償って説明したからねぇ……？"
"1012606-63-カノエ" = "イヒヒ……。"
"1012606-64" = "（……昨日見たカノエの正体は何だったのか）"
"1012606-65" = "（結局、この日の真相は、闇の中へ溶けていった……）"
"1012606-66-カノエ" = "イヒッ……。"
"1012606-67-カノエ" = "イヒヒヒッ……！"
