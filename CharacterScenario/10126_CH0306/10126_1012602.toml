[translation]
"1012602-1" = "特別な妙薬"
"1012602-2" = "（カノエから返事がないため、ひとまずオカルト研究会の寮に向かった）"
"1012602-3" = "オカルト研究会の寮"
"1012602-4-カノエ" = "いらっしゃい……先生。"
"1012602-5-カノエ" = "やっぱり、前世からの絆は本物だね。#n私が恋しくて、駆けつけてくれたのかなぁ……？"
"1012602-6" = "[s1] \"ぜ、前世？\"\n[s2] \"……絆？\""
"1012602-7-カノエ" = "そう。#n私たちは、前世から強い絆で結ばれてる。"
"1012602-8-カノエ" = "……あれぇ？#n覚えてないの……？"
"1012602-9-カノエ" = "いつもあんなに……情熱的な言葉を囁いてくれてたのに……。"
"1012602-10-カノエ" = "もしかして、私の体温も……忘れちゃった……？"
"1012602-11" = "[s] \"カノエの手、ひんやりしてるんだね……！？\""
"1012602-12-カノエ" = "ほんとに、忘れちゃったんだぁ……。"
"1012602-13-カノエ" = "手は冷たくても、心は熱い女……それが私。"
"1012602-14-カノエ" = "あなたと前世で過ごした時間もぜんぶ覚えてる……情の深い女。"
"1012602-15-カノエ" = "そして、あらゆるオカルトに精通した女でもある……イヒ。"
"1012602-16-カノエ" = "さあ……すぐにでも思い出させてあげるよ。"
"1012602-17-カノエ" = "そのために……先生を呼んだんだからねぇ。"
"1012602-18-カノエ" = "待っててね。#n錬金術で――前世の記憶を蘇らせる薬を作ってあげるから。"
"1012602-19-カノエ" = "……でも。#nどんな薬も、材料がなければ作れない……。"
"1012602-20-カノエ" = "だから……必要なんだ。#n先生の思い出が詰まった、特別な材料が。"
"1012602-21" = "[s] \"何が必要なの……？\""
"1012602-22-カノエ" = "それは……先生の持ち物だよぉ……。"
"1012602-23-カノエ" = "さぁ、持っているものを出して。#nもちろん、着てる服も……一つ残らず。"
"1012602-24-カノエ" = "もう、ぜーんぶ私の物なんだから。イヒヒッ……。"
"1012602-25" = "[s] \"……！？\""
"1012602-26-カノエ" = "ごめん……怖がらせちゃったかなぁ？"
"1012602-27-カノエ" = "冗談だよぉ……ほんとは、全部じゃなくてもいいんだ。"
"1012602-28-カノエ" = "一つだけ……#n例えば、小銭とかメモ紙みたいな小さい物でもいいよぉ。"
"1012602-29" = "[s] \"それが本当に必要なの……？\""
"1012602-30-カノエ" = "もちろん……。"
"1012602-31-カノエ" = "もう、錬金術用の大釜も用意してあるんだ。"
"1012602-32-カノエ" = "材料を入れて、上手にかき混ぜると……#nほしいものが出来上がる不思議な釜。"
"1012602-33-カノエ" = "イヒッ……どう？#n先生も……妙薬作り、見てみたいんじゃなぁい？"
"1012602-34" = "[ns3] 気になって首を縦に振る。\n[ns4] いたずらかもしれないけど、話に乗ってみる。"
"1012602-35-カノエ" = "……ようやくその気になってくれたねぇ。"
"1012602-36-カノエ" = "じゃあ、先生の持ち物を一つ、ちょうだい。#n……極上の薬を作ってあげるから。"
"1012602-37" = "[ns5] ポケットからハンカチを取り出す。\n[ns6] カバンからペンを取り出す。"
"1012602-38-カノエ" = "これが、先生の……うん、いい触媒になりそうだねぇ。"
"1012602-39-カノエ" = "大切に保管しておかないと……。"
"1012602-40" = "[s] \"あれ、釜に入れるんじゃないの？\""
"1012602-41-カノエ" = "薬は飲むものでしょう？"
"1012602-42-カノエ" = "だから、食べられないものは……入れちゃダメぇ。"
"1012602-43-カノエ" = "私は食べ物で遊んだりしないからねぇ……イヒ……。"
"1012602-44" = "[s] （そこはちゃんとしてるんだ……）"
"1012602-45-カノエ" = "それじゃあ、本格的に妙薬作りをしようか……。"
"1012602-46-カノエ" = "まず……湯むきしたトマトと、他の野菜を切って……。"
"1012602-47" = "[ns] \"い、いつの間に下ごしらえを……？\""
"1012602-48-カノエ" = "イヒッ、私はちゃんと準備をするタイプなんだ……。"
"1012602-49-カノエ" = "次は……下味をつけた牛肉を炒めて、#nソースを加え……。"
"1012602-50" = "[ns] \"えっと……妙薬を作ってるんだよね？\""
"1012602-51-カノエ" = "うん……これは間違いなく妙薬だよ。"
"1012602-52-カノエ" = "前世の絆を思い出させるくらい、強力な……ねぇ。"
"1012602-53-カノエ" = "あとは……材料を煮込むだけ……。"
"1012602-54" = "（その後も、カノエは大釜に色々な食材を入れ、何かを作っていく……）"
"1012602-55" = "[ns] \"いい匂い……。\""
"1012602-56" = "（しばらくして……）"
"1012602-57-カノエ" = "はい……完成。"
"1012602-58-カノエ" = "これが、前世の絆を思い出させる妙薬――"
"1012602-59-カノエ" = "私の愛がたっぷり入った、トマトビーフシチューだよぉ。"
"1012602-60" = "[s] \"妙薬じゃない！？\""
"1012602-61-カノエ" = "妙薬だよ。"
"1012602-62-カノエ" = "これを食べれば私の気持ちが伝わるはず。#nさあ……遠慮なく召し上がれぇ。"
"1012602-63" = "[ns7] 妙薬かは分からないが、とりあえず食べてみる。\n[ns8] いい匂いにつられて、シチューを食べてみる。"
"1012602-64" = "[ns] \"こ、この味は……！！！\""
"1012602-65-カノエ" = "イヒッ、どう？前世の記憶が蘇ったかなぁ？"
"1012602-66-カノエ" = "現世でも、私みたいな良い女が傍にいて……嬉しいでしょ？"
"1012602-67" = "[s] \"すごく美味しい！！\""
"1012602-68" = "[ns] \"子どもの頃、よく作ってもらった味だなぁ……。\""
"1012602-69-カノエ" = "こ、子どもの頃？#nもうちょっと前まで遡ってほしいんだけどなぁ……。"
"1012602-70-カノエ" = "そうか……私にも失敗はあるんだねぇ……。"
"1012602-71-カノエ" = "イヒ、でも諦めない……。"
"1012602-72-カノエ" = "妙薬が効かないなら、言葉で心を呼び戻してあげるよぉ……。"
"1012602-73-カノエ" = "いつどこに居ても……私のことしか思い出せないくらい、#n強烈なお話をしようねぇ。"
"1012602-74-カノエ" = "イヒッ……イヒヒッ……。"
"1012602-75-カノエ" = "イヒヒヒッ……！"
"1012602-76" = "（……その後、カノエと美味しいシチューを食べながら話に花を咲かせた）"
