[translation]
"1012603-1" = "少女の声"
"1012603-2" = "（いつも通り仕事をしていると……）"
"1012603-3" = "[ns] \"知らない番号だ……。\""
"1012603-4" = "（とりあえず出てみることにした）"
"1012603-5-可愛い声の生徒" = "つ、つながった……！"
"1012603-6-可愛い声の生徒" = "も、もしもしっ……？#n[USERNAME]先生ですか？"
"1012603-7" = "[s] \"うん、そうだよ。こんにちは。\""
"1012603-8-可愛い声の生徒" = "わあ！本当に[USERNAME]先生だ！えへへっ♡"
"1012603-9-可愛い声の生徒" = "もしよろしければ、このまま少しお話しても……いいですか？"
"1012603-10" = "[s] \"それはいいけど……君は？\""
"1012603-11-可愛い声の生徒" = "ご、ごめんなさい！#nな、名前を言うのは……その、まだ恥ずかしくて……！"
"1012603-12-可愛い声の生徒" = "で、でも！#n私……ずっと先生のことを見てたんです。"
"1012603-13-可愛い声の生徒" = "先生は私のこと……ご存知ないかもしれませんけど、#n私は先生のことをよく知ってます。"
"1012603-14-可愛い声の生徒" = "いつも優しく生徒に接している姿……#nそれがとってもカッコよくて……。"
"1012603-15-可愛い声の生徒" = "その……ず、ずっと好きでした！#nわ、私と……おつきあいして……くれませんかっ？"
"1012603-16-可愛い声の生徒" = "優しい先生と、毎日過ごせたらなって……ずっと憧れてて……！"
"1012603-17" = "[s] （困ったな……）"
"1012603-18-可愛い声の生徒" = "ううぅ……や、やっぱりダメですか……？"
"1012603-19" = "[s1]（しっかり断らないと）\n[s2] \"とりあえず、シャーレの近くの公園で会おうか。\""
"1012603-20-可愛い声の生徒" = "わあ！ありがとうございます！お待ちしていますねっ♪"
"1012603-21" = "（仕事に区切りをつけて、約束の場所へ向かった）"
"1012603-22" = "[ns] \"この辺にいると思うけど……。\""
"1012603-23-黒猫" = "ニャーオ……ンニャーオォ。"
"1012603-24-カラス" = "ガァー！ガァー！"
"1012603-25" = "[ns] \"猫とカラス、こんなに多かったっけ……？\""
"1012603-26-？？？" = "不思議だよね……。#n外を歩いてると、いつも黒猫とカラスが寄ってくるんだ……。"
"1012603-27-カノエ" = "つまり、この子たちの鳴き声が聞こえたら、私が近くにいるってことだよぉ。"
"1012603-28" = "[s] \"どうしてカノエがここに……？\""
"1012603-29-カノエ" = "待ってたよ……先生。"
"1012603-30" = "[ns3] （何か、嫌な予感がする……）\n[ns4] （何かあったときのための退路を確認しよう……）"
"1012603-31-カノエ" = "イヒヒ、逃がさないよぉ。"
"1012603-32-カノエ" = "みんな……先生を捕まえて。"
"1012603-33-カノエ" = "ニャーオ！ンニャーオォ！"
"1012603-34-カノエ" = "ガァーッ！ガァァーッ！！"
"1012603-35" = "（……あっという間に猫とカラスに取り囲まれてしまった）"
"1012603-36" = "[ns] \"今日は先約があって……。\""
"1012603-37-カノエ" = "その約束の相手……私だよぉ。"
"1012603-38-カノエ" = "こんにちは、先生っ！来てくれてありがとうございます♪"
"1012603-39-カノエ" = "えへへっ、私とおつきあい……してくれるんですよねっ？"
"1012603-40" = "[s5] \"あ、あの子が、カノエ……？\"\n[s6] \"声が全然違った……。\""
"1012603-41-カノエ" = "気づいたかなぁ……？#n私、声優専攻なんだぁ。"
"1012603-42-カノエ" = "今回は、恥ずかしがり屋さんな可愛い女の子を演じてみたけど――"
"1012603-43-カノエ" = "あの声を聞いてすぐに来るなんて……#n先生、ああいう子が好みだったんだねぇ……。"
"1012603-44" = "[s] \"わ、私はやんわりと断るつもりだったんだよ！\""
"1012603-45-カノエ" = "そっかぁ。#nそれって、前世から結ばれてる私のために……？"
"1012603-46-カノエ" = "イヒッ、先生の思いはちゃあんと受け取ったよ。"
"1012603-47" = "[s] \"結ばれてません！\""
"1012603-48-カノエ" = "でも、このまま先生を帰すわけにはいかないんだぁ……。"
"1012603-49-カノエ" = "実は、先生を呼びだしたのは……からかうためじゃなくて――"
"1012603-50-カノエ" = "今日は私が担当したASMRの発売日なんだぁ。"
"1012603-51-カノエ" = "だから、先生に感想聞きたくて。"
"1012603-52" = "[s] \"CV板垣カノエのASMRってこと？\""
"1012603-53-カノエ" = "そう。#n自分で言うのもあれだけど、私、それなりの売れっ子なんだよぉ。"
"1012603-54-カノエ" = "イヒヒッ！どう？気になる？"
"1012603-55-カノエ" = "気になるよねぇ？#n……はい、イヤホン貸してあげる。"
"1012603-56" = "（イヤホンをつけて、目を閉じ、音声に耳を澄ませると……）"
"1012603-57" = "（……クール系の女の子が、照れながら子守唄を歌う内容だった）"
"1012603-58" = "[ns] \"……こ、これもカノエの声なの！？\""
"1012603-59-カノエ" = "そ、そうだよ。"
"1012603-60-カノエ" = "やっぱり……私みたいな暗い女が歌う子守唄は……#n好みじゃなかった……？"
"1012603-61" = "[s] \"そんなことないよ。すごくよかった。\""
"1012603-62-カノエ" = "イヒ、そっか……ありがと……。"
"1012603-63-カノエ" = "お礼に、音源をプレゼントするねぇ……。#nこれは、二人だけの秘密だよ……イヒヒッ。"
"1012603-64" = "[s] \"言われなかったら、カノエだって気づけなかったよ。\""
"1012603-65-カノエ" = "他にも色んなものを演じられるよ。"
"1012603-66-カノエ" = "お化けや怪獣……環境音とかも。"
"1012603-67-カノエ" = "先生は……どんな声が好きぃ？"
"1012603-68-カノエ" = "なんでも言って？どんなものでも演じてみせるから。"
"1012603-69-カノエ" = "な・ん・で・も、ね。"
"1012603-70-カノエ" = "イヒッ……イヒヒヒッ……。"
"1012603-71" = "（……その後、カノエの色んな声を聞きながら、#n束の間の休憩時間を過ごした）"
"1012603-72" = "（周りの猫やカラスも、どこかくつろいでいるようだった……）"
