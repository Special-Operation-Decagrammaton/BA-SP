[translation]
"1012605-1" = "唐突なお誘い"
"1012605-2" = "（カノエがいる収録スタジオに到着した）"
"1012605-3-カノエ" = "ようこそ、先生。"
"1012605-4-カノエ" = "……早速だけど、機材の使い方についてレクチャーするよ。"
"1012605-5-カノエ" = "一緒に幸せな時間を過ごそうねぇ……イヒッ、イヒヒッ……。"
"1012605-6" = "[s] \"しゅ、収録するだけだよね？\""
"1012605-7-カノエ" = "え……？#nもしかして、他のコトも期待してたぁ？"
"1012605-8-カノエ" = "……そっか。"
"1012605-9-カノエ" = "いい……よ？#n先生を呼んだときから、覚悟はしてるし……。"
"1012605-10-カノエ" = "きっと先生なら、この冷えた身体を温めてくれるんだよね？#n「あのとき」みたいに。"
"1012605-11" = "[ns1] （ま、まずい……！）\n[ns2] （どうにかして逃げたほうが……）"
"1012605-12-カノエ" = "イヒヒ……逃がさないよ。"
"1012605-13" = "[s] \"い、いつの間に……！？\""
"1012605-14-カノエ" = "先生……一体何を考えてたの？"
"1012605-15-カノエ" = "私にも教えて？一緒に楽しもう？"
"1012605-16-カノエ" = "イヒッ……イヒヒッ……！"
"1012605-17" = "[s3] \"な、なんでもないよ！\"\n[s4] \"さ、さあ、機材の使い方を教えてほしいな……！\""
"1012605-18" = "（その後、カノエから機材の使い方を教わった）"
"1012605-19" = "（おかげで、簡単な操作くらいはできるようになった）"
"1012605-20-カノエ" = "さて、そろそろ始めようかぁ。"
"1012605-21-カノエ" = "手伝ってくれてるお礼に……#n私の本当の姿を見せてあげる。"
"1012605-22" = "[wa:540]― [log=카노에]せ、[wa:930]先生……[wa:1470]その、[wa:1500]収録の前に……[/log]"
"1012605-23" = "― [log=카노에]聞いてほしいことがあるの。[/log]"
"1012605-24" = "― [log=카노에]じ、[wa:750]実は……[/log]"
"1012605-25" = "― [log=카노에]私、[wa:1260]ずっと隠してたことがあって……。[/log]"
"1012605-26" = "― [log=카노에]わ、[wa:590]私……[wa:1620]恥ずかしがり屋で、[/log]"
"1012605-27" = "― [log=카노에]うまく話せなくて。[/log]"
"1012605-28" = "[wa:510]― [log=카노에]それを隠すために、[/log]"
"1012605-29" = "― [log=카노에]陰気なキャラを演じてた……。[/log]"
"1012605-30" = "― [log=카노에]オカルトに手を出したのも、[/log]"
"1012605-31" = "― [log=카노에]自分を変えたかったから。[/log]"
"1012605-32" = "[wa:1200]― [log=카노에]これを知っているのは……[wa:2000]先生だけ。[/log]"
"1012605-33" = "― [log=카노에]だから……[wa:1500]内緒にしてね？[/log]"
"1012605-34" = "[wa:370]― [log=카노에]せ、[wa:770]先生のこと、[wa:1900]信じてる、[wa:1290]よ……。[/log]"
"1012605-35" = "[ns] \"こ、これがカノエの本当の姿……？\""
"1012605-36" = "[wa:150]― [log=카노에]……イヒッ、[wa:1020]イヒヒ。[/log]"
"1012605-37" = "― [log=카노에]ねえ、[wa:1390]信じたぁ？[/log]"
"1012605-38" = "― [log=카노에]先生は、[wa:1680]可愛いものが好きなんでしょ？[/log]"
"1012605-39" = "[wa:550]― [log=카노에]じゃあ、[wa:1340]私のことも……[wa:2400]好き、[wa:1240]だよねぇ？[/log]"
"1012605-40" = "― [log=카노에]イヒッ……！[/log]"
"1012605-41" = "[ns] \"ま、また騙された……！\""
"1012605-42" = "（その後も、カノエの収録を手伝った）"
"1012605-43" = "（今回収録したのは、熱血スポコンもののドラマCDだった）"
"1012605-44-カノエ" = "うん……これで今日の収録は全部終わりかな。"
"1012605-45-カノエ" = "先生もお疲れ様。さすが、頼りになるね。"
"1012605-46" = "[s] \"やっぱり、演技のレパートリーがすごいね。\""
"1012605-47-カノエ" = "でも、もっと頑張らないと……。"
"1012605-48-カノエ" = "最近の声優は、これくらいできて当たり前だよ。"
"1012605-49-カノエ" = "売れっ子だからって……気を緩めるわけにはいかないの。"
"1012605-50" = "[s] \"夢を追いかけてる真っ最中なんだね。\""
"1012605-51-カノエ" = "うん……私にも夢があるよ……。"
"1012605-52-カノエ" = "どんな夢か当ててみてぇ？"
"1012605-53" = "[s] \"有名な声優になること？\""
"1012605-54-カノエ" = "それもだけど……もっと大きな夢があるんだ。"
"1012605-55-カノエ" = "私の夢は――"
"1012605-56-カノエ" = "――前世の絆を取り戻すこと。"
"1012605-57-カノエ" = "先生、まだ思い出せないの？"
"1012605-58-カノエ" = "私だよ……手は冷たくても……心は熱い女。"
"1012605-59-カノエ" = "オカルトが好きで、黒猫とカラスに慕われる女――"
"1012605-60-カノエ" = "そう、[ruby=いたがき]板垣[/ruby]カノエ……！"
"1012605-61" = "[s] \"そ、それはよく知ってるけど……！\""
"1012605-62" = "（帰り道、カノエにご褒美をあげるべく近くのスイーツカフェに寄った）"
"1012605-63" = "（収録を頑張った後だからか、カノエは甘いものを食べて満足そうにしていた）"
