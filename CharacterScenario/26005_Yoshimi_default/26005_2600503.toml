[translation]
"2600503-1" = "マカロンチャレンジ"
"2600503-2-ヨシミ" = "あ、来たね、先生。まずはここに呼んだ理由を話そうかと思ったけど、来る途中に看板を見たんじゃない？"
"2600503-3-ヨシミ" = "そう、このカフェで毎年開催される有名なイベント……。"
"2600503-4-ヨシミ" = "「マカロン大食いチャレンジ」！！！"
"2600503-5-ヨシミ" = "わざわざ説明は要らないわよね。文字通り、一番多くマカロンを食べたチームが勝ちっていうイベントよ。"
"2600503-6-ヨシミ" = "参加したチームは、みんなマカロンがタダで食べられるわ。リタイアとか、負けたりしない限りはね。"
"2600503-7-ヨシミ" = "え、リタイアしたら？それはもちろん、食べた分のマカロンの代金をきっちり払うのよ。つまり、最終的にタダで食べられるチームは一つだけ！"
"2600503-8-ヨシミ" = "毎年倒れて病院に運ばれる人が出るくらい、危険なイベントよ。"
"2600503-9-ヨシミ" = "だからこそ私たちはここに遊びに来たんじゃない、本気で戦うために来たの。分かった？"
"2600503-10-ヨシミ" = "え、ああ、もちろん私たちが負けたら、私が先生の分も含めてマカロン代を払うわ。"
"2600503-11-ヨシミ" = "でも大丈夫。私が支払うのは今日じゃない、何故なら私たちは負けないもの！"
"2600503-12-ヨシミ" = "先生は大人でしょう？大人なんだから、私たち学生よりずっと食べられるはず。私より身体大きいし！"
"2600503-13-ヨシミ" = "そういう問題じゃない？うるさいわね、何で始める前から弱音を吐いてるのよ。"
"2600503-14-ヨシミ" = "ほらっ、始まるわよ！とりあえずマカロンを掻き集めるわ！"
"2600503-15" = "（そうして始まった、マカロン大食いチャレンジ）"
"2600503-16" = "（しかしヨシミの期待とは裏腹に、7個目を食べているところでもう気持ち悪くなってきた）"
"2600503-17-ヨシミ" = "う、ううっ……そろそろ辛いかも……。ううん、まだ食べられるんだから……。"
"2600503-18-ヨシミ" = "先生？さっきから動きが止まってるわよ？"
"2600503-19" = "[s1] \"もう無理……いっそ殺して、楽にして……。\"\n[s2] \"こんな戦い、最初から間違ってたんだ……。\""
"2600503-20-ヨシミ" = "な、なに言ってるの！？大人のくせにたったこれだけで！？"
"2600503-21-ヨシミ" = "（予想外……！でも、私ももうキツイかも……このままじゃ……！）"
"2600503-22-ヨシミ" = "頑張りなさいよ先生！まだやれるでしょ！せめて20個は食べてもらわないと！"
"2600503-23-ヨシミ" = "ここで諦められるわけないでしょ！？今までいくら分食べてると思ってるの！？"
"2600503-24-ヨシミ" = "ほら、横になって！！口だけ開けておきなさい！私が食べさせてあげるから！"
"2600503-25-ヨシミ" = "逃げるな！口開けてってば！ほら！"
"2600503-26" = "[s]（必死に抵抗する）"
"2600503-27-ヨシミ" = "む、無駄なことを……！……ぬぬぬぬ……あっ――"
"2600503-28-ヨシミ" = "待っ、バランスっ……！あっ、うわあぁっ！？"
"2600503-29" = "ドサッ、バタン！"
"2600503-30" = "……うっ、いたたた……お尻から落ちた……。"
"2600503-31" = "下に何か敷いてあって良かったわ……先生、大丈夫？"
"2600503-32" = "……あれ？先生？どこに行ったのよ？"
"2600503-33" = "[s] \"……。\""
"2600503-34" = "……。"
"2600503-35" = "……っ！！！"
"2600503-36" = "な、な、ななな、なんでそこにいるの！変態！"
"2600503-37" = "ど、どきなさいよ早く！ってどくのは私！？じゃなくてどっちでもいいからっ！！いつまでそこに、んぁっ……！"
"2600503-38" = "……う、うあああっ！！もう知らない！バカ！！死ね、死んじゃえ！！！！！ああああああああっ！！！"
"2600503-39" = "（その直後、錯乱したヨシミは信じられないスピードで、テーブルの上のマカロンを全部飲み込んで逃げていった）"
"2600503-40" = "（そしてヨシミの記録を超えた人がいなかったため、私たちが食べたマカロンは全部タダになった）"
