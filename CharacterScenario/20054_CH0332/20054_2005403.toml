[translation]
"2005403-1" = "規則と概念"
"2005403-2-ヒマリ" = "お昼寝……少しでも疲れは取れましたか？"
"2005403-3" = "[s] \"多少はね。起こしてくれてありがとう……。\""
"2005403-4-ヒマリ" = "礼には及びません。#nなにせ今の私は―― "
"2005403-5-ヒマリ" = "先生専属超天才病弱美少女ハッカー兼ライフスタッフなのですから。"
"2005403-6-ヒマリ" = "それでは、午後の業務も頑張りましょう。"
"2005403-7" = "（ヒマリと一緒に業務をこなしていった）"
"2005403-8" = "[ns] \"ふああぁぁ……。\""
"2005403-9-ヒマリ" = "大きなあくびですね。"
"2005403-10-ヒマリ" = "眠いというよりも、少し気怠い感じでしょうか？#n……ふふ、なるほど。"
"2005403-11-ヒマリ" = "それでは、ご一緒に息抜きはいかがですか？#n今から車椅子の整備をしに行こうと思っておりまして。"
"2005403-12" = "[s] \"車椅子？いま乗ってるよね？\""
"2005403-13-ヒマリ" = "いえ、これではありません。"
"2005403-14-ヒマリ" = "屋外用の方です。先生もご存じのはずですよ。"
"2005403-15-ヒマリ" = "戦闘を含むあらゆる状況に対応できる、あれです。"
"2005403-16" = "[s] \"あれはバイク――\""
"2005403-17-ヒマリ" = "く・る・ま・い・す、ですよ？"
"2005403-18" = "[ns] \"そっか……。\""
"2005403-19" = "（ヒマリは手際よく楽しそうにバイク……ではなく、車椅子の整備をしている）"
"2005403-20" = "（……やっぱり車椅子ではないと思う。という言葉は飲み込んだ）"
"2005403-21-ヒマリ" = "浮遊装置の出力良好。アクセルとブレーキ……問題なし。#n補助エネルギーシールド残量確認――"
"2005403-22-ヒマリ" = "ふふ。私の車椅子は今日も完璧ですね。"
"2005403-23" = "[s] \"車椅子ってなんだっけ……。\""
"2005403-24-ヒマリ" = "あら、先生ともあろうお方がご存じないだなんて。"
"2005403-25-ヒマリ" = "仕方ありませんね。私がご説明して差し上げましょう。"
"2005403-26-ヒマリ" = "車椅子とは、人が椅子に座ったまま移動するための「移動補助用具」です。"
"2005403-27-ヒマリ" = "その形態は様々ですが、私のものは室内用も屋外用も電動型にあたります。"
"2005403-28" = "[s] \"そう……かな……？\""
"2005403-29-ヒマリ" = "まだご納得いただけていないご様子ですね。"
"2005403-30-ヒマリ" = "では先生、こう考えてみてください。#n動力で動いて、移動を補助して、生活の利便性を高めてくれる――"
"2005403-31-ヒマリ" = "それらが「車椅子」を構成する要素だとすれば、#nこれもまた間違いなく「屋外用車椅子」と言えるのではないでしょうか。"
"2005403-32-ヒマリ" = "ある種、この屋外用車椅子は到達点の1つと言っても過言ではありません。"
"2005403-33-ヒマリ" = "ずっとこのような「屋外用車椅子」を作りたいとは思っていたのです。#nそれこそ、今よりもこの両脚に力があった頃から。"
"2005403-34-ヒマリ" = "あの頃はあの頃で、時間や予算の問題が常につきまとっていたわけなのですが。"
"2005403-35-ヒマリ" = "それも、今ならば違います。"
"2005403-36-ヒマリ" = "あら？褒めてくださるのですか？#n前向きな姿勢として、好ましく思っていただけるのはとても嬉しいのですが……。"
"2005403-37-ヒマリ" = "ふふっ……それは今さらですよ、先生。私を誰だと思っているのですか。"
"2005403-38-ヒマリ" = "私が蘭のように優雅であることは周知の事実です。#nとはいえ……その内には雑草にも勝るとも劣らない意志を秘めています。"
"2005403-39-ヒマリ" = "簡単には挫けず、諦めない。#nそれが[ruby=あけぼし]明星[/ruby]ヒマリですもの。"
"2005403-40-ヒマリ" = "それに考えてみてください、先生。#n「移動補助用具」と一口に言っても、#n目的に応じていろいろ用意されている方が便利じゃありませんか？"
"2005403-41" = "[ns] \"まあ……種類がいっぱいある道具は結構あるよね。\""
"2005403-42-ヒマリ" = "ふふ、いかにも。"
"2005403-43-ヒマリ" = "はい？「屋外用車椅子」とバイクの違いですか？"
"2005403-44-ヒマリ" = "ふむ……このような提案をするつもりはなかったのですが……。"
"2005403-45-ヒマリ" = "この際ですから、先生にはしっかりとご理解いただくのも良いでしょう。"
"2005403-46-ヒマリ" = "基本スペックからして、私の「車椅子」はバイクとは全くの別物です。"
"2005403-47-ヒマリ" = "その真髄を――ご覧にいれます。"
"2005403-48" = "[s] （何だか嫌な予感がする）"
"2005403-49-ヒマリ" = "というわけで、先生？"
"2005403-50-ヒマリ" = "今晩、少しお時間をいただけますか？"
