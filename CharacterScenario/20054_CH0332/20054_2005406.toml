[translation]
"2005406-1" = "ライフスタッフ（２）"
"2005406-2-ヒマリ" = "面目ございません……。"
"2005406-3" = "[s1] \"気にしないで。すごく疲れてたんだね。\"\n[s2] \"誰だって寝坊することくらいあるよ。\""
"2005406-4-ヒマリ" = "ですが、とりわけ気を張っていなければならないこの状況で……。"
"2005406-5-ヒマリ" = "これでは先生のライフスタッフ失格です……。"
"2005406-6-ヒマリ" = "はい？あまり自分を責めないで、ですか？"
"2005406-7-ヒマリ" = "先生が私を頼りすぎていたから？いえ、そんなことは……。"
"2005406-8-ヒマリ" = "でも、それでも……。"
"2005406-9" = "[s3] \"よし、分かった。\"\n[s4] \"今日は私がヒマリのライフスタッフになるよ！\""
"2005406-10-ヒマリ" = "……はい？"
"2005406-11-ヒマリ" = "先生が、私の……？"
"2005406-12-ヒマリ" = "ですがそれは……！"
"2005406-13-ヒマリ" = "え？ええ、まあ、普段から皆さんに助けてもらってはいますが……。"
"2005406-14-ヒマリ" = "エイミは言わずもがな、最近はトキにも……。"
"2005406-15-ヒマリ" = "とはいえ先生に手伝ってもらうというのは……ちょっと違うといいますか……。"
"2005406-16" = "[s] \"そっか、無理強いは良くないもんね。\""
"2005406-17-ヒマリ" = "い、いえ！そんなことはありません！むしろ……！"
"2005406-18-ヒマリ" = "むしろ……。"
"2005406-19-ヒマリ" = "う、うぅぅ……。"
"2005406-20-ヒマリ" = "（言葉にできないほど嬉しいのですが……）"
"2005406-21-ヒマリ" = "（同じくらい恥ずかしくもあって……！）"
"2005406-22" = "[ns5] \"ヒマリはいつも頑張ってるから、たまには甘えてもいいんだよ。\"\n[ns6] \"私でよければなんでも言って！\""
"2005406-23-ヒマリ" = "そういうことは、あまり軽々しく言わないほうがいいですよ？"
"2005406-24-ヒマリ" = "……私だから良かったですが。"
"2005406-25-ヒマリ" = "それこそリオにでも気を許したら……。"
"2005406-26-ヒマリ" = "ものすごく面倒なことになりますからね？"
"2005406-27" = "[s] \"それはそれで、まぁ……。\""
"2005406-28-ヒマリ" = "はいっ！？"
"2005406-29-ヒマリ" = "先生は生徒にどれだけ迷惑をかけられても良い……ということですか？"
"2005406-30-ヒマリ" = "あなたという人は……。"
"2005406-31-ヒマリ" = "そういうことを何度も言わないでください！"
"2005406-32-ヒマリ" = "しかもそれを無自覚に……私の忍耐力を試さないでいただきたいです。"
"2005406-33-ヒマリ" = "私だって、やろうと思えば……。"
"2005406-34" = "[ns] \"ヒマリ？\""
"2005406-35-ヒマリ" = "な、何でもありません！何でもないですとも！"
"2005406-36-ヒマリ" = "こほん。"
"2005406-37-ヒマリ" = "では、先生がそこまでおっしゃるなら……。"
"2005406-38-ヒマリ" = "今日は目いっぱい甘えさせていただこうかと。よろしいのですね？"
"2005406-39" = "[s7] \"いいよ。いくらでもどうぞ。\"\n[s8] \"その[ruby=チャレンジ]挑戦[/ruby]、受けて立とう！\""
"2005406-40-ヒマリ" = "ふふふ……。"
"2005406-41-ヒマリ" = "覚悟してくださいね？"
"2005406-42-ヒマリ" = "（こうしてヒマリを甘やかす時間が始まった）"
"2005406-43-ヒマリ" = "手を洗いたいですね。#n洗面所はすぐそこですが――"
"2005406-44-ヒマリ" = "誰かが私を「お姫様だっこ」して連れて行ってくれたら、どれほど良いか……。"
"2005406-45" = "[ns] \"へ、へいっ！\""
"2005406-46" = "（その瞬間……ヒマリの温かい息が耳元をかすめた）"
"2005406-47" = "[ns] \"！？！？\""
"2005406-48-ヒマリ" = "あら。そんなにびっくりすることですか？"
"2005406-49-ヒマリ" = "生きていく上で、呼吸は自然なことですよ？"
"2005406-50" = "（間違ってはいないけど、と反論したい気持ちを抑えた）"
"2005406-51" = "（平常心を保つ努力をしながら、ヒマリの我がままに応え続けた）"
"2005406-52-ヒマリ" = "……。"
"2005406-53-ヒマリ" = "（心臓が破裂するかと思いました……）"
"2005406-54-ヒマリ" = "（まさかこんなにも緊張するとは……）"
"2005406-55-ヒマリ" = "（これほど恥ずかしいことだったなんて……！）"
"2005406-56-ヒマリ" = "どうしましょう……腕に力が入らなくなってしまいました。"
"2005406-57-ヒマリ" = "だというのに、小腹が空いてきましたね……。"
"2005406-58-ヒマリ" = "冷蔵庫に入れてあるチョコブラウニー……誰か食べさせてくれませんかね～？"
"2005406-59-ヒマリ" = "先生、ありがとうございます。"
"2005406-60-ヒマリ" = "では……。"
"2005406-61" = "[ns] \"！？！？！？\""
"2005406-62-ヒマリ" = "ふふっ。どうかしましたか、先生？"
"2005406-63-ヒマリ" = "思いのほか美味しそうだったので――"
"2005406-64-ヒマリ" = "ちょっと前のめりに「ぱくっ」と味見しただけですよ。"
"2005406-65" = "[s] \"そ、そんなに食べたかったんだね……。\""
"2005406-66-ヒマリ" = "（顔から火が出そうです……！）"
"2005406-67-ヒマリ" = "（先生の顔がこんなに近くに！）"
"2005406-68-ヒマリ" = "（いえ、近づいたのは私なのですが、それでも……！）"
"2005406-69-ヒマリ" = "……。"
"2005406-70-ヒマリ" = "（それにしても……これほどの美少女が迫ったのですよ？#n先生はなんとも思わなかったのでしょうか？）"
"2005406-71-ヒマリ" = "（……もしかして、だからこそ？）"
"2005406-72-ヒマリ" = "……。"
"2005406-73-ヒマリ" = "（急に距離を詰めすぎると逆効果なのでは……？）"
"2005406-74-ヒマリ" = "（言うなれば、触媒を入れ過ぎたときのような……）"
"2005406-75-ヒマリ" = "（結果が早く出る代わりに、不要な副産物が生成されたり、全体の安定性が下がったりしますからね）"
"2005406-76-ヒマリ" = "（急いては事を仕損じる、とはよく言ったものです）"
"2005406-77-ヒマリ" = "（このようなミスをするとは……反省ですね）"
"2005406-78-ヒマリ" = "あら。いつの間にかもう夜ですね。"
"2005406-79" = "[s] \"えっ？もうそんな時間！？\""
"2005406-80-ヒマリ" = "ええ。ここは昼と夜の区別がはっきりしませんから。#nどうしても時間感覚がぼやけてしまいますね。"
"2005406-81-ヒマリ" = "なにより、「特異現象」がリアルタイムで発生している場所ですし。"
"2005406-82-ヒマリ" = "そのせいで生活習慣が乱れていて……なかなか寝つけないので、隣で寝かしつけてくれる人がいると嬉しいんですけどね。"
"2005406-83" = "[s] \"それって本当に効果あるの！？\""
"2005406-84-ヒマリ" = "あら？"
"2005406-85-ヒマリ" = "先生は私のことを信じてくださらないのですか？#n私は世界の誰よりも先生を信じているというのに。"
"2005406-86" = "[s] \"……！！\""
"2005406-87" = "[ns9] \"そっか、そうだよね。\"\n[ns10] \"ヒマリのライフスタッフとして信じるよ。\""
"2005406-88" = "（ヒマリを寝かしつけるため、ベッドに連れて行った）"
"2005406-89" = "（そのとき……！）"
"2005406-90-ヒマリ" = "えいっ♪"
"2005406-91" = "[ns] \"ヒマリ！？\""
"2005406-92-ヒマリ" = "先生？寝かしつけてくださるんですよね？"
"2005406-93-ヒマリ" = "私はですね～寝つけない時は、誰かがそばにいてくれないとダメなんです〜"
"2005406-94-ヒマリ" = "はい？エイミやトキにもやってもらっているのか、ですか？"
"2005406-95-ヒマリ" = "（……いいえ。そこまでのことは）"
"2005406-96-ヒマリ" = "（エイミがそばにいたら熱中症になりそうですし。ですが……）"
"2005406-97-ヒマリ" = "ええ、今日みたいに全然眠くない時は、特にそうかもしれません。"
"2005406-98-ヒマリ" = "（ごめんなさい、先生）"
"2005406-99-ヒマリ" = "（もう少しだけ……甘えさせてください）"
"2005406-100" = "[ns11] \"分かったよ。\"\n[ns12] \"でも、横にいるのは寝るまでだからね？\""
"2005406-101-ヒマリ" = "はい！もちろんです！"
"2005406-102" = "（部屋の明かりを消して、ヒマリのベッドのそばに座った）"
"2005406-103" = "（静かな部屋の中、2人分の呼吸が優しく包み込んでいる）"
"2005406-104" = "（ヒマリが眠るまでって約束だったのに……）"
"2005406-105" = "（先に眠くなってしまい……）"
"2005406-106-ヒマリ" = "先生……？"
"2005406-107-ヒマリ" = "寝てしまわれたのですか？"
"2005406-108-ヒマリ" = "規則正しい寝息、ほんのり下がった体温……。"
"2005406-109-ヒマリ" = "ふふっ……。"
"2005406-110-ヒマリ" = "私たちの中で一番お疲れなのは、先生なんでしょうね。"
"2005406-111" = "（誰かが、頭を撫でてくれているような気がする……）"
"2005406-112-ヒマリ" = "先生。"
"2005406-113-ヒマリ" = "……先生。"
"2005406-114-ヒマリ" = "私たちの――"
"2005406-115-ヒマリ" = "今は、私だけの先生……。"
"2005406-116-ヒマリ" = "ご存知ですか？"
"2005406-117-ヒマリ" = "今の私は、本当に悪い子なんです。"
"2005406-118-ヒマリ" = "もしもまだ起きていらっしゃるのなら、そのまま全部……眠気のせいにしてくれたらいいなって。"
"2005406-119-ヒマリ" = "本当に眠っていらっしゃるのなら、できるだけ長くこのままで……。"
"2005406-120-ヒマリ" = "そんなことばかり考えているなんて……。"
"2005406-121-ヒマリ" = "ふふっ、我ながら呆れてしまいますね。"
"2005406-122-ヒマリ" = "責任を押しつけるとしたら、私をこうさせた先生にも少しは文句を言いたいところですけど……。"
"2005406-123-ヒマリ" = "でも、それはさすがに卑怯ですね。"
"2005406-124-ヒマリ" = "ごめんなさい、先生。"
"2005406-125-ヒマリ" = "でも……先生？"
"2005406-126-ヒマリ" = "先生は、この瞬間も――"
"2005406-127-ヒマリ" = "そしてきっと、これからも――"
"2005406-128-ヒマリ" = "私にとって、誰よりも、何よりも大切で……。"
"2005406-129-ヒマリ" = "かけがえのない方なのです。"
"2005406-130" = "（なぜだかとても安心できて……完全に意識を手放した）"
"2005406-131-ヒマリ" = "先生、ゆっくりお休みください。"
"2005406-132-ヒマリ" = "どうかご自愛を。"
