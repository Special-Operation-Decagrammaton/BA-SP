[translation]
"2601708-1" = "プロトコルの明細"
"2601708-2" = "（ラナの連絡を受け、慌てて1階へ駆け下りた）"
"2601708-6-配達員" = "ああっ、もう……！早く来いっての……！"
"2601708-7-ラナ" = "あまり叱らないであげてください。先生も深く反省しているはずです。"
"2601708-8-配達員" = "あんたを叱るために呼んでるんだよ！"
"2601708-10" = "[ns] \"あ、あの……何かご用でしょうか……。\""
"2601708-12-配達員" = "やっと来たな！あんたがこいつの保護者か？"
"2601708-13" = "[s] \"大人ですから、すべての子供の保護者です。\""
"2601708-14-配達員" = "ふんっ、口だけは達者だな！"
"2601708-15-配達員" = "保護者だっていうなら、ちゃんと監督責任を果たしてからいうんだな……こいつは――"
"2601708-17-配達員" = "まったく……こんな場所でデリバリーの受け取りってどういうことだよ。#nつかこの距離なら宅配便で送ればいいのに。"
"2601708-18-配達員" = "まあ、ここからD.U.までだと長距離料金になるからいいけどよ。"
"2601708-19-配達員" = "無料配達クーポン使ってるみたいだが……#nどのみち後から精算されるから、こっちには関係ないな。"
"2601708-23-配達員" = "お、出迎えか？ありがたいな。"
"2601708-27-配達員" = "お待たせしました！デリバリーの受け取りにあがりました！"
"2601708-28-ラナ" = "あ。"
"2601708-32-ラナ" = "こんにちは、たこ焼きです。"
"2601708-33-ラナ" = "私を、受け取ってたこー。"
"2601708-37-配達員" = "へ？"
"2601708-40" = "[ns] \"へ？\""
"2601708-41-配達員" = "な？そんな反応になるだろ？"
"2601708-42-配達員" = "人はデリバリーできないって何度も言ってんのに、暖簾に腕押しで――"
"2601708-44-配達員" = "あん――いや、お客さん！これはデリバリーサービスですよ！？"
"2601708-45-配達員" = "頭にかつお節を乗せて、自分のことたこ焼きだって言い張ってもダメです！"
"2601708-46-ラナ" = "見ての通り、たこ焼きですが。"
"2601708-47-ラナ" = "あ、青のりを忘れていました。青のりは欠かせませんよね、分かります。"
"2601708-48-配達員" = "だ・か・ら！！うちは食べ物のデリバリーだって！！！"
"2601708-49-ラナ" = "失礼ですが、出前デリバリーのプロトコルにおいて「食べ物」の定義は何ですか？"
"2601708-50-配達員" = "ぷろ……何だって？"
"2601708-51-配達員" = "食べ物の定義を聞いてんのか？そりゃあ、食べられるのが食べ物だろ！"
"2601708-52-ラナ" = "はい、私のことも食べられます。"
"2601708-53-ラナ" = "ほら、頭の上にかつお節が乗っているでしょう？"
"2601708-54-配達員" = "食べられるって言っても、ほんのちょっとじゃねぇか！？"
"2601708-55-ラナ" = "そのロジックでいうと、#nココナッツやカニも可食部位が少ないため……食べ物とは言えなくなります。"
"2601708-56-配達員" = "はあ……！？い、いや……それはさすがに食べ物だろ！？"
"2601708-57-配達員" = "そ、そうだ！お前は生きてるだろ？だから食べ物とは言えない！"
"2601708-58-ラナ" = "そのロジックでいうと、シロウオの踊り食いも食べ物と言えなくなります。"
"2601708-59-配達員" = "ああ、もう！！食べ物っていうのはな――"
"2601708-60-ラナ" = "そのロジックでいうと――"
"2601708-61-配達員" = "いや！それは食べ物だろ！だから――"
"2601708-62-ラナ" = "定義に例外が生じる度に条件を加えるのですね。"
"2601708-63-ラナ" = "現在の条件文は17個になりました。#n一度、再帰的に定義することをおすすめします。"
"2601708-64-配達員" = "は、はあ！？"
"2601708-65-ラナ" = "それでは、これは食べ物と言えるでしょうか――"
"2601708-68-配達員" = "はあ……。"
"2601708-69" = "[s1] \"ここまで連れてきたということは……。\"\n[s2] \"結局、食べ物だと認めたんですか……？\""
"2601708-72-配達員" = "んなわけあるか！！#nあれ以上言い合ってもらちが明かないから、連れてきただけだ！"
"2601708-73-ラナ" = "出前デリバリーのプロトコルに例外処理が加わったこと、とても嬉しく思います。"
"2601708-74-配達員" = "加わってねぇ！！"
"2601708-75-配達員" = "代金もちゃんともらってるし、別にいいけどよ……はぁ。"
"2601708-76-配達員" = "もう二度とこんなおままごとには付き合わねぇから、ちゃんと叱っておいてくれよ！"
"2601708-77" = "[s3] \"すみません……。\"\n[s4] \"よく言っておきます……。\""
"2601708-80-配達員" = "これが他のやつだったら危なかったかもしれないんだぞ？"
"2601708-81-ラナ" = "はい。配達員さんが優しくて善良な人で良かったです。"
"2601708-82-ラナ" = "食べ物である私のことも、人として扱ってくれました。"
"2601708-83-配達員" = "だから……！はぁ……もういいや。んじゃ、後は頼んだからな！"
"2601708-88-ラナ" = "丁寧に説明したら、納得してくれたようで何よりです。"
"2601708-89" = "[s5] \"全然そうは見えなかったけどね……。\"\n[s6] \"次からは安全な方法にしようね。\""
"2601708-92-ラナ" = "ヘルメットをつけてくれたので、安全に来ることができました。"
"2601708-93-ラナ" = "それで、今から何をしましょうか？"
"2601708-94" = "[s] \"何か用があったんじゃないの？\""
"2601708-95-ラナ" = "いえ、特に。ただ先生に会いたかっただけなので。"
"2601708-96-ラナ" = "お仕事をされるのでしたら、隣で待機します。"
"2601708-97" = "[s] \"なら、散歩にでもいこうか。\""
"2601708-98-ラナ" = "いいですね。先生が散歩する時に来られるなんて、運がいいです。"
"2601708-99-ラナ" = "ついていきます。"
"2601708-108-ラナ" = "もう夜ですね。"
"2601708-109-ラナ" = "先生のおかげで楽しい時間になりました。"
"2601708-110-ラナ" = "世の中には、面白いことがたくさんありますね。"
"2601708-111-ラナ" = "……子供が夜遅くに出歩くのはよくないので、もう帰ります。"
"2601708-112-ラナ" = "次はもっと長い時間お付き合いしますので、寂しがらないでくださいね。"
"2601708-113" = "[s7] \"言いたいことを全部言われてしまった……。\"\n[s8] \"次はデリバリーサービスで来ちゃダメだからね？約束！\""
"2601708-116-ラナ" = "もちろんです。#n今回は先生と配達員さんに迷惑をかけました。もう二度としません。"
"2601708-117-ラナ" = "宅配も、移動には使いません。注意されたことはちゃんと覚えています。"
"2601708-118-ラナ" = "帰りは問題ないので、ご心配なく。"
"2601708-119" = "[s] \"よかった！なら、駅まで送るよ！\""
"2601708-120-ラナ" = "いいえ。それには及びません。"
"2601708-121-ラナ" = "レッドウィンターのサーバーをハッキングすれば、すぐに事務局から車で迎えがきます。"
"2601708-122-ラナ" = "なので、先に帰っていただいて構いません。"
"2601708-123" = "[s] \"やっぱり私が送るよ！！\""
"2601708-124-ラナ" = "そうですか？分かりました……？"
"2601708-126" = "（その後、ラナを送ってあげた）"
"2601708-127" = "（ラナは私の姿が見えなくなるまで手を振ってくれた）"
