[translation]
"2601705-1" = "デバッグパッチ"
"2601705-2" = "（仕事でレッドウィンターを訪問したあと、#n使っていない外付けHDDを持ってラナのところへ行った）"
"2601705-5-ラナ" = "先生、おはようございます。ラナです。"
"2601705-6" = "[s1] \"おはよう、ラナ！\"\n[s2] \"このニンジンとサツマイモはどうしたの？何かの宿題？\""
"2601705-9-ラナ" = "いいえ、今はセキュリティーキーのコピーをしています。"
"2601705-10-ラナ" = "何かご用でしょうか。"
"2601705-11" = "[s3] \"ラナにプレゼントをあげようと思って！\"\n[s4] （外付けHDDを渡す）"
"2601705-17-ラナ" = "ありがとうございます、とても嬉しいです。"
"2601705-18-ラナ" = "……。"
"2601705-19-ラナ" = "……えっと、この物体は何でしょうか。"
"2601705-20" = "[ns] \"え……？\""
"2601705-23-ラナ" = "なるほど。私がデータ保存用として使うカセットテープと似たようなものなのですね。#nとても大容量で驚きました。"
"2601705-24-ラナ" = "ですが、どうしてこれを……。"
"2601705-25" = "[s5] \"バグとパッチでスペースが足りていないって言ってたから。\"\n[s6] \"少しでも役に立つかなと思って！\""
"2601705-28-ラナ" = "なる……ほど……？"
"2601705-32-ラナ" = "……すみません。実は、理解できていません。"
"2601705-33-ラナ" = "理解していないのに嘘を言うのは失礼だと思い、正直に打ち明けました。"
"2601705-38-ラナ" = "あ、バグです。"
"2601705-39-ラナ" = "ちょうどいいです。#nバグとパッチに関するものでしたら……#nこれをどのように使えばいいか、教えていただけますと助かります。"
"2601705-40" = "[s7] \"もちろん！素直に話してくれて嬉しいよ！\"\n[s8] \"隣で見ておくね！\""
"2601705-43-ラナ" = "ではさっそく、バグを退治します。"
"2601705-44-ラナ" = "まず、コンピュータの電源を切ってサーバーを停止させます。"
"2601705-49-ラナ" = "問題を発見しました。先生、そこにある長いピンセットを渡してくれますか？"
"2601705-50" = "[s9] \"ピンセット……？\"\n[s10] 言われた通りピンセットを渡す。"
"2601705-61-ラナ" = "捕獲しました。"
"2601705-65-ラナ" = "蛾がリレーに挟まっていました。よく見るバグですね。"
"2601705-66" = "[s] \"バグって、昆虫のことだったんだね……。\""
"2601705-67-ラナ" = "はい。コンピュータが暖かいので、よく虫が群がるんです。"
"2601705-68-ラナ" = "収集した虫をノートに貼り付け、バグレポートを作成します。"
"2601705-69-ラナ" = "「パネルF、リレー70、蛾1匹、デバッグ完了」"
"2601705-70-ラナ" = "続いて、プログラムパッチも行います。"
"2601705-74-ラナ" = "パンチカードに誤って穴を空けた箇所を、パッチで塞ぎます。"
"2601705-75-ラナ" = "こうして、バグを捕まえたノートとパッチされたパンチカードを集めていたら……#n183号室のスペースが足りなくなったのです。"
"2601705-76" = "[s11] \"言葉通り、バグを捕まえたりパッチを当ててたんだね！\"\n[s12] \"思ったより大変な作業だね……。\""
"2601705-79-ラナ" = "はい、とても大変で手間がかかります。"
"2601705-80-ラナ" = "古い技術なので、最適化も困難です。"
"2601705-81-ラナ" = "良いところは、慣れると楽しいことでしょうか。"
"2601705-82-ラナ" = "あと、目に見えるので不安になることもありません。"
"2601705-83-ラナ" = "バグとパッチの過程はご覧の通りです。#nせっかくなので、先生からいただいたプレゼントを活用してみたいのですが。"
"2601705-84-ラナ" = "使い方を教えていただけますか？"
"2601705-85" = "[s] \"もちろん！うーん、どこから説明しようかな……。\""
"2601705-87" = "（ラナに外付けHDDの使用方法を教えた）"
"2601705-88" = "（すぐに覚えたラナは、必ず活用してみせると意気込んでいた）"
