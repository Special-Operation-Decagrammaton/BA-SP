[translation]
"2601702-1" = "パケットスリーピング"
"2601702-5" = "（そろそろ荷物が届く時間だ……）"
"2601702-6" = "（気になって、なかなか仕事が手につかない）"
"2601702-10-配達員" = "お荷物お届けに上がりました。"
"2601702-11" = "[ns] \"来たあああぁぁぁ！！！\""
"2601702-14-配達員" = "こんにちは。今日は量が多いですね。"
"2601702-15-配達員" = "ドアの前に他の荷物もあったので、一緒に入れておきましたよ。"
"2601702-16-配達員" = "この大きな段ボールはどこに置きましょうか？"
"2601702-17" = "[s] \"これは……何の荷物でしょうか……？\""
"2601702-18-配達員" = "さあ？私も分からないです。#nドアの前に置いてあったので、こちら宛の荷物だと思うのですが……。"
"2601702-19-配達員" = "では、すみませんが……私はこれで。"
"2601702-25" = "[ns1] \"……。\"\n[ns2] （恐る恐る段ボールを開けてみる）"
"2601702-30" = "[wa:800]― [log=라나]……[wa:2350]お世話になっております、[wa:1690]先生。[/log] "
"2601702-32" = "― [log=라나]見慣れた天井……[wa:2250]ですね。[/log] "
"2601702-35" = "― [log=라나]なんとかお会いできて[wa:1200]よかったです。[/log] "
"2601702-38" = "[ns] \"ラナ！？どうして段ボールの中に！？\""
"2601702-39" = "[wa:630]― [log=라나]うん？[wa:1690]宅配の荷物に[wa:1310]入っている理由……？[/log]"
"2601702-41" = "― [log=라나]「入ったから」です。[/log]"
"2601702-44" = "― [log=라나]列車の乗車券を買ったら、[/log]"
"2601702-46" = "― [log=라나]お土産を買えなくなってしまって……。[/log]"
"2601702-49" = "― [log=라나]そうしたら、[wa:1280]シャーレにちょうど[/log]"
"2601702-51" = "― [log=라나]先生宛の段ボールが[wa:1430]あるではないですか。 [/log]"
"2601702-54" = "― [log=라나]なので、[wa:1280]お土産になってみました。[/log]"
"2601702-57" = "[ns] \"捨てた段ボールの中にずっと入ってたの！？大丈夫だった？\""
"2601702-58" = "[wa:680]― [log=라나]問題ありません。[/log] "
"2601702-60" = "― [log=라나]暇つぶしは得意です――[/log] "
"2601702-63" = "― [log=라나]緩衝材はふかふかでしたし、[/log] "
"2601702-65" = "― [log=라나]先生が開封の際に[wa:1550]気をつけてくださったので、[wa:1970]無事です。[/log] "
"2601702-68" = "― [log=라나]ふふっ……。[/log] "
"2601702-71" = "[wa:1920]― [log=라나]こうして顔が見れて、[wa:1970]嬉しいです。[/log] "
"2601702-73" = "― [log=라나]すごく、[wa:1660]会いたかったです。[wa:1360]先生。[/log] "
"2601702-77" = "― [log=라나]うぅん……。[/log] "
"2601702-80" = "[wa:600]― [log=라나]ふぁ……。[/log] "
"2601702-82" = "― [log=라나]それでは、[wa:1860]おやすみなさい。[/log] "
"2601702-85" = "― [log=라나]すやぁ……。[/log] "
"2601702-89-ラナ" = "すぅ……すぅ……。"
"2601702-90-ラナ" = "せん……せい……。"
"2601702-92" = "（寝てしまったラナをそっと抱き上げて、ベッドに移動させた）"
"2601702-93" = "（とても疲れていたのか、ぐっすりと眠っていた）"
"2601702-94" = "（しばらくするとラナが目を覚ましたので、玄関まで見送った）"
