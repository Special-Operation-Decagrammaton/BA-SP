[translation]
"2601706-1" = "デッドロック"
"2601706-2" = "（ラナに会うため183号特別クラスを訪れた）"
"2601706-3" = "[ns] \"ラナ、いる？\""
"2601706-5-ラナ" = "あ、おはようございます。先生。"
"2601706-6-ラナ" = "難問に集中するあまり、いらっしゃったことに気づきませんでした。"
"2601706-7-ラナ" = "こんな難しい問題は初めてです。もう5回も再試を受けています。"
"2601706-8" = "[s1] \"そんなに難しいんだ？\"\n[s2] \"どういう問題なの？\""
"2601706-11-ラナ" = "10-27功勲保健部が提供する心理テストです。#n希望者が受けられるので受けてみました。"
"2601706-12-ラナ" = "ですが毎回、「ちゃんと真面目に答えなさい」と怒られてしまいます。"
"2601706-13-ラナ" = "最後に受けた時には……#nどの答えがダメだったのか教えてもらいましたが……。"
"2601706-14-ラナ" = "何故ダメなのかは、分かりませんでした。#n私が子どもだからかもしれません。"
"2601706-15-ラナ" = "なので、先生にも見ていただきたいのです。"
"2601706-19" = "[ns3] \"ラナの力になれるなら何でもするよ！\"\n[ns4] \"どれどれ……。\""
"2601706-22" = "[ns5] \"「私は休みの日に編み物と岩登りを楽しむ」……？\"\n[ns6] \"「私は100種類以上のバッタを知っている」……？\""
"2601706-25-ラナ" = "はい。どちらも「はい」と答えたのがダメだったそうです。"
"2601706-26-ラナ" = "コアメモリという部品を作っていたら編み物が好きになりましたし……#n岩登りは普段から近道に使っているため、自然と趣味になっています。"
"2601706-27-ラナ" = "バッタも、デバッグの過程で103種類知りました。"
"2601706-28-ラナ" = "ショウリョウバッタ、オンブバッタ、トノサマバッタ、コバネイナゴ……。"
"2601706-29" = "[s] \"もしかしたら、そういう問題じゃないのかも……！\""
"2601706-30-ラナ" = "ツチイナゴ、イボバッタ……はい？"
"2601706-32-ラナ" = "なるほど。調べてくださりありがとうございます。"
"2601706-33-ラナ" = "問題をきちんと解いているか確認するための、#n「回答の不誠実度」を測る設問だったのですね。"
"2601706-34-ラナ" = "私は自分が好きなもの、知っていることを答えただけなのですが……。"
"2601706-35-ラナ" = "それが普通ではないのかもしれない、と不安になっていました。"
"2601706-36" = "[s] \"ラナの大切な個性を、テストが見落としただけだよ！\""
"2601706-37-ラナ" = "「大切な個性」……そのように言っていただけて嬉しいです。"
"2601706-41-ラナ" = "……実は、「異常」と言われるのが少し怖いのです。"
"2601706-42-ラナ" = "私は今まで、何度も飛び級をしてきました。"
"2601706-43-ラナ" = "学年が同じだから、#n年上のクラスメイトの真似をするのが自然だと思っていたのですが……。"
"2601706-44-ラナ" = "それが、周囲からすると「子供らしくない」ようでした。"
"2601706-45-ラナ" = "まだ寝るときは「寝かしつけ」が必要なので、その点では子供だと言えますが――"
"2601706-46-ラナ" = "実際どうであるかは別として、#n周りに不快感を与えているのではないかと懸念していました。"
"2601706-47" = "[s] \"私は、ラナがラナらしくいるだけで十分だと思うよ。\""
"2601706-51" = "[ns] \"そんなの全然気にしなくていいんだよ！\""
"2601706-54-ラナ" = "……なるほど。うまく言えないのですが。"
"2601706-55-ラナ" = "少し気分が楽になりました。"
"2601706-56-ラナ" = "ちょうど、この話題に関してプレゼントしたいものがあります。#nどうか、受け取ってください。"
"2601706-60-ラナ" = "私が編んだ手袋です。"
"2601706-61" = "[s] \"すごい！とても上手だね！\""
"2601706-62-ラナ" = "先生の手が、暖かくなるといいなと思って作りました。"
"2601706-63-ラナ" = "これがあれば、ここを訪れる時に手が冷えないかと。"
"2601706-64-ラナ" = "使っていただけると嬉しいです。"
"2601706-66" = "（ラナの頭を撫でながら、たくさん褒めた）"
"2601706-67" = "（手袋のサイズはぴったりだった）"
