[translation]
"2601703-1" = "ラナとコロッサス"
"2601703-2" = "（ラナが心配になり、急いで183号特別クラスへ足を運んだ）"
"2601703-3" = "（無事だといいんだけど……）"
"2601703-5" = "183号特別クラス"
"2601703-8-ラナ" = "……。"
"2601703-9-ラナ" = "うーん……。"
"2601703-10" = "[ns1] \"よかった……無事だ。\"\n[ns2] \"ラナ！来たよ！\""
"2601703-14-ラナ" = "あ、先生。"
"2601703-15-ラナ" = "よろしければ、そこの荷車にあるディーゼルエンジンを持ってきていただけますか？"
"2601703-16-ラナ" = "重いので、足を怪我しないよう気をつけてください。"
"2601703-17" = "[s] \"あ、うん……！\""
"2601703-19" = "（ラナは巨大な機械を作っているようだった）"
"2601703-20" = "（隣でサポートをしつつ、邪魔にならないよう静かにしていた）"
"2601703-22-ラナ" = "先生、あの部品がほしいんですが――"
"2601703-23-ラナ" = "届かないので、肩車してもらってもいいでしょうか？"
"2601703-24" = "[s] \"もちろん！\""
"2601703-25-ラナ" = "ありがとうございます。"
"2601703-31-ラナ" = "ふむ……！"
"2601703-32-ラナ" = "これならいいでしょう。先生のおかげで今日中に完成させることができました。"
"2601703-33-ラナ" = "やはり先生が一緒だと順調に進みますね。ありがとうございます。"
"2601703-34-ラナ" = "今からエンジンをかけますが、銃声に驚かないでください。"
"2601703-35" = "[s3] \"エンジン……？\"\n[s4] \"銃声……？\""
"2601703-45-ラナ" = "おお……。"
"2601703-46-ラナ" = "ちゃんと動いていますね。よかったです。"
"2601703-47" = "[s] \"銃でエンジンをかけたの？\""
"2601703-48-ラナ" = "はい。コフマン・スターターを使いました。#nセルモーターがないので、火薬の圧力でエンジンをかけたのです。うまく動きましたね。"
"2601703-49-ラナ" = "これは私にとっては大きな[ruby=・   ・]機械[/ruby]ですが、#nレッドウィンターにとっても大きな[ruby=・   ・]一歩[/ruby]となったはずです。"
"2601703-50" = "[s] \"すごい！かっこいい！偉いね、ラナ！\""
"2601703-54" = "[ns] \"……それで、これはどういう機械なの……？\""
"2601703-55-ラナ" = "大したものではありません。これは――"
"2601703-60-ラナ" = "スマホの充電器です。"
"2601703-61-ラナ" = "もともと使っていたものが、壊れてしまったので……#nこれを機に高速充電器を作ってみることにしたのです。"
"2601703-62" = "[s] \"こ、こんなに大きいものなんだね……。\""
"2601703-63-ラナ" = "真空管を使ったらこうなりました。#n暖かくて、普通の充電器よりずっといいです。"
"2601703-64-ラナ" = "必要でしたら、先生もお使いになりますか？ポートは4個ありますから。"
"2601703-68-ラナ" = "そういえば……忘れていました。"
"2601703-69-ラナ" = "おはようございます、先生。[ruby=ふるはた]古畑[/ruby]ラナです。"
"2601703-70-ラナ" = "まさかお会いできるとは、奇遇ですね。"
"2601703-71" = "[s5] \"あはは……ラナが心配で来たんだけどね……。\"\n[s6] \"無事でよかった！\""
"2601703-74-ラナ" = "無事……ですか。"
"2601703-75-ラナ" = "何のことか分かりませんが、先生が嬉しそうで何よりです。"
"2601703-77" = "（その後もラナと一緒の時間を過ごした）"
"2601703-78" = "（充電器は、酷寒の雪が溶けるくらいの熱を帯びていた）"
