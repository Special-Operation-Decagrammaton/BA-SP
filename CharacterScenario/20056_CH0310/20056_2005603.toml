[translation]
"2005603-1" = "まるで我が家"
"2005603-2" = "（昼過ぎくらいにインターホンが鳴った）"
"2005603-3" = "[ns1] \"開いてるから入っていいよ～\"\n[ns2] 開けるボタンを押す。"
"2005603-4-コユキ" = "呼ばれて飛び出てじゃじゃじゃーん！[ruby=くろさき]黒崎[/ruby]コユキ、参上しました！！"
"2005603-5-コユキ" = "今日は先生の優秀な右腕兼左腕として働きますから、なんでも任せてください！"
"2005603-6-コユキ" = "あ、でも……パスワード関係の仕事とかは勘弁してくださいね！#nにはははは！"
"2005603-7" = "[s3] \"それはいいけど……どうしてその格好なの？\"\n[s4] \"なんでパジャマ？\""
"2005603-8-コユキ" = "えっ？#nあー……。"
"2005603-9-コユキ" = "……シャーレに服務規程ってありましたっけ？"
"2005603-10-コユキ" = "あ、特にない？そうですよね！#nにははは！びっくりしましたよ～！"
"2005603-11-コユキ" = "制服より楽なんで、これ。"
"2005603-12-コユキ" = "ほら、動きやすいほうが仕事もはかどるじゃないですか！"
"2005603-13-コユキ" = "セミナーでは先輩たちがうるさいから制服着てますけど――"
"2005603-14-コユキ" = "こっちの当番って、サポートとかヘルプ中心ですし？#n楽な服着ててもいいですよね？"
"2005603-15-コユキ" = "噂によると水着とかバニーガールの服で来てる生徒だっているって聞きましたよ？何か問題あるんです？"
"2005603-16" = "[s5] \"ま、まあそれはそうだけど……。\"\n[s6] \"そう言われると、たしかに返す言葉がない……。\""
"2005603-17-コユキ" = "にはははは！！でしょでしょ？#nそういうことです！"
"2005603-18-コユキ" = "では、さっそく先生のお仕事手伝う前に――"
"2005603-19-コユキ" = "んっ、しょっ……！"
"2005603-20" = "[ns7] \"……コユキさん？\"\n[ns8] \"まさか、レジャーシート敷いて寝る気？\""
"2005603-21-コユキ" = "……何か問題でも？"
"2005603-22-コユキ" = "え？お仕事の準備をしているんですよ？"
"2005603-23-コユキ" = "ここでゴロゴロしてるので、何かあったらすぐ言ってください！#n全部ちゃんとやりますので！"
"2005603-24-コユキ" = "……先生？"
"2005603-25-コユキ" = "なんでもない？#nにははは！つれないな～！"
"2005603-26-コユキ" = "んじゃ、ポジションも決まったし――"
"2005603-27-コユキ" = "……今日のお仕事、始めていきますよ～！！"
"2005603-28" = "（そのあと、床でゴロゴロしてるコユキと一緒に、今日の業務に取りかかった）"
"2005603-29" = "（コユキはパジャマ姿でゴロゴロしながら仕事をしていたけど……）"
"2005603-30" = "（……本人の宣言通り、あっという間に全部終わらせてしまった）"
"2005603-31" = "[ns9] \"これで最後だよ。\"\n[ns10] \"すごいね。想定よりずっとたくさんやってくれてる。\""
"2005603-32-コユキ" = "にははは！！だから言ったじゃないですか、なんでも任せてくださいって！#n言ったことはちゃんと守りますよ～！"
"2005603-33-コユキ" = "……ん？どうしたんですか？"
"2005603-34-コユキ" = "セミナーの業務状況？#nあー……。"
"2005603-35-コユキ" = "いや、そんな無茶言わないでくださいよ……。"
"2005603-36" = "[s11] \"まあ、そんな気はしてたけど……。\"\n[s12] \"何が違うんだろう？\""
"2005603-37-コユキ" = "あー……セミナーのオフィスは窮屈なんですよ。"
"2005603-38-コユキ" = "床でゴロゴロできませんし、制服もかっちりしてるし……。"
"2005603-39-コユキ" = "仮眠も取れないし、ちょっと騒いだら怒られるし、お菓子もろくに食べられないし……。"
"2005603-40-コユキ" = "正直、そんな環境で作業効率なんか上がるわけないじゃないですか？#nえ、違う？"
"2005603-41-コユキ" = "まあ……先輩たちからは来客もあるし、ちゃんとした格好でって言われてるんですけどね。"
"2005603-42-コユキ" = "でも、「ちゃんとした格好」なんて、みんながしなければそれで解決だと思うんですけど……。"
"2005603-43-コユキ" = "……まあ、それを提案しても採用されたことないんですけど！にははははー！！！"
"2005603-44" = "[s13] \"……なるほどね。\"\n[s14] \"コユキのこと、少し分かった気がする。\""
"2005603-45-コユキ" = "ええぇぇ！？何ですかそれ。#nいきなり変なこと言わないでくださいよ！"
"2005603-46-コユキ" = "……にはっ。"
"2005603-47-コユキ" = "まあでも、先生のお役に立てたのなら、嬉しいです！"
"2005603-48-コユキ" = "これで今日の業務は全部終わりです？#nんじゃ閉店しますか。ガラガラ～"
"2005603-49-コユキ" = "このまま特に頼みたいことがないなら私はこれでお暇しますね！"
"2005603-50-コユキ" = "先生の中でも有能な私のイメージ、ちょっとはついたでしょうし！"
"2005603-51" = "[ns15] \"……あ、コユキ。ちょっと待って。\"\n[ns16] 帰ろうとするコユキを呼び止める。"
"2005603-52-コユキ" = "……どうしました？"
"2005603-53-コユキ" = "……はい？"
"2005603-54-コユキ" = "え、泊まっていいんです……？"
"2005603-55-コユキ" = "うーん、でもそれだと話が変わっちゃうし……迷惑かかっちゃいません？"
"2005603-56-コユキ" = "時間が遅いのはそうですけど……まあ、迷惑じゃないなら。"
"2005603-57" = "[s17] \"頑張ったご褒美。セミナーには私から伝えておくし。\"\n[s18] \"ここ、ゲーム機とかあるから好きに使っていいよ。\""
"2005603-58-コユキ" = "え……。"
"2005603-59-コユキ" = "……！！！！！"
"2005603-60-コユキ" = "ゲーム……！！！"
"2005603-61-コユキ" = "にはははははは！！！もう～、仕方ないな～！#n本当は先生も一緒に遊びたかったんですよね？"
"2005603-62-コユキ" = "そこまで言われたら断れませんよ！#nちょうど今日はパジャマ着てるし、準備万端！"
"2005603-63-コユキ" = "さあ、行きましょう先生！#n休憩室のゲーム機もお菓子も、私たちを待っています！！"
"2005603-64" = "[s19] \"急にテンション上がったね！\"\n[s20] \"全部用意してるの私なんだけどね。\""
"2005603-65-コユキ" = "にははははー！！細かいことは気にしない気にしない！"
"2005603-66-コユキ" = "いきますよ、先生！夜はまだまだ長いんですから！！"
"2005603-67-コユキ" = "It’s show time～!!!"
"2005603-68" = "（その後、コユキと一緒に休憩室でゲームを遊んだりしながら夜を過ごした）"
"2005603-69" = "（コユキは夜通し遊ぶ気満々だったみたいだけど……）"
"2005603-70" = "（疲れていたのか、少し遊んだら眠ってしまった）"
