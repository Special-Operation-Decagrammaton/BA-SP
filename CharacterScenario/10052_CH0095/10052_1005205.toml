[translation]
"1005205-1" = "セミナー書記ノアの平凡な日課"
"1005205-2" = "ミレニアム近くのカフェ"
"1005205-3" = "（ミレニアムでの仕事を終えた帰り道の途中、見つけたカフェに寄った）"
"1005205-4" = "（……山のように積まれた書類束の中で、ノアが何か作業をしている）"
"1005205-5" = "[ns] \"……ノア？\""
"1005205-6-ノア" = "あら、先生。"
"1005205-7-ノア" = "業務に夢中で気がつきませんでした。#n失礼致しました。"
"1005205-8" = "[s] \"何の仕事？\""
"1005205-9-ノア" = "セミナーの書記として、審査要請の入った特許を検討しているところです。"
"1005205-10-ノア" = "ミレニアムプライスを控えているこの時期は、全校生徒が研究に邁進しているので、新しい発明特許の出願が大勢に寄せられるんです。"
"1005205-11-ノア" = "出願する特許を仕分け、まとめるのも書記の重要な業務の一つなので……"
"1005205-12-ノア" = "本来なら部室でする仕事なのですが……#n今日はとてもいい天気なので、ここまで足を伸ばしてみました。"
"1005205-13-ノア" = "ふふ……暖かい陽光の下で仕事を片付けるのも、たまには良いですね。"
"1005205-14" = "[s] \"私に手伝えることはある？\""
"1005205-15-ノア" = "いいえ、大丈夫です。"
"1005205-16-ノア" = "出願された特許の仕分けが仕事ではありますが、#n同時に私が最も好きな時間でもあります。"
"1005205-17-ノア" = "まさか……シャーレの先生ともあろうお方が、#n仕事の手伝いを口実に生徒の小さな楽しみを奪うなんてことは……しませんよね？"
"1005205-18" = "[s1] \"それなら、いいけど……。\"\n[s2] \"コーヒーを飲む間、隣で眺めていても？\""
"1005205-19-ノア" = "もちろんです。#n先生は私のことはお気になさらず、ご自由にお過ごしください。"
"1005205-20-ノア" = "もちろんです。#n先生は私のことはお気になさらず、ご自由にお過ごしください。"
"1005205-21-ノア" = "それとも、書記活動の一環として私を観察されますか……？"
"1005205-22" = "[s] \"観察の仕事は、もういいかな……。\""
"1005205-23-ノア" = "ふふっ、冗談ですよ。#n今はシャーレ当番の時間でもないですし。"
"1005205-24-ノア" = "では、私は少し仕事に集中しますね……失礼します。"
"1005205-25" = "（……ノアの左側に、検討済みの書類がどんどん積まれていく）"
"1005205-26-ノア" = "これは左……これも左……。"
"1005205-27" = "[ns] \"仕分けの基準ってあるの？\""
"1005205-28-ノア" = "ええ。特許認定の可否によって整理しています。"
"1005205-29-ノア" = "あとで分かるように、特許の認定条件を満たした文書は右、#n満たしていないものは左に置いています。"
"1005205-30" = "[s] \"じゃあ、左側のものは全部……。\""
"1005205-31-ノア" = "はい。基本条件を満たしていないため、破棄される予定の提案書です。"
"1005205-32-ノア" = "残念ですが、全てのアイディアを特許登録することはできませんので。"
"1005205-33-ノア" = "ただ、成功は失敗を踏み台にして生まれるものです。挑戦が重なれば、いつかは時代のパラダイムを変える新たなゲームチェンジャーが完成するかもしれません。"
"1005205-34" = "[ns] 左側の文書を調べる。"
"1005205-35-ノア" = "「99.99%の熱伝達効率を持つ、究極のボイラー機関」にご興味が？"
"1005205-36-ノア" = "それは面白い提案ではありましたが、#n「未完成発明」であったため特許を発行することはできません。"
"1005205-37-ノア" = "煙道の内側を熱遮断剤でコーティングするといった発想そのものはよくても、#n熱遮断剤の成分を正確に提示することができていませんでしたから。"
"1005205-38" = "[ns] \"……これは？\""
"1005205-39-ノア" = "接着剤改良の最中、これまで報告されたことのない新しい爆発性物質を合成した、新素材開発部の研究報告書ですね。"
"1005205-40-ノア" = "新しい性質を持つ化学物質を発見したという、研究そのものは非常に興味深いですが……「発見」の事実だけでは発明特許を獲得できません。"
"1005205-41-ノア" = "発明特許は、実現可能な目的と明確な動機が揃って、初めて獲得できるものです。"
"1005205-42" = "[ns] \"じゃあ、こっちは……。\""
"1005205-43-ノア" = "「肌の美白と歯の美白を同時に叶える、マスクタイプの美白装置」の場合……"
"1005205-44-ノア" = "原理も目的も具体的に記されていますが、#n残念ながら先月、エンジニア部が先に同じアイディアで特許登録をしています。"
"1005205-45-ノア" = "素晴らしいアイディアだとしても、#n公表が遅れたら所有権を主張することは難しくなります。"
"1005205-46" = "[s] \"特許の世界って深いんだね……。\""
"1005205-47-ノア" = "特許は、日夜努力を重ねて製品を開発した発明家たちの、ある種の報酬ですから。"
"1005205-48-ノア" = "公正に審査を行わないと、悪用する人が現れることもありますし……#n一歩間違えれば発明家のモチベーションを阻害してしまう恐れもあります。"
"1005205-49-ノア" = "あら、これは……。"
"1005205-50-ノア" = "この発明品は問題になりそうな部分もありませんし、#n特許を認めてもよいかと思います。"
"1005205-51" = "[s] \"その提案書は大丈夫なの？\""
"1005205-52-ノア" = "はい。特許の条件を全て満たしています。"
"1005205-53-ノア" = "これでしたら、ミレニアムの新しい発明品として遜色ありません。"
"1005205-54-ノア" = "先生もご覧になりますか？"
"1005205-55" = "[ns3] \"シャーレの先生の行動パターンを収集、分析して……\"\n[ns4] \"それをもとに先生の現在位置を予測する機器……？\""
"1005205-56-ノア" = "ふふ、面白い発想ですよね？"
"1005205-57-ノア" = "ふふ、面白い発想ですよね？"
"1005205-58-ノア" = "人の行動パターンをデータ化し、予測する研究は既に数回行われてきましたが……。"
"1005205-59-ノア" = "特定個人の――それも「先生」を対象とした研究はこれが初めてで。#n既存特許に抵触することもなく、差別化が図れていますね。"
"1005205-60-ノア" = "それに、特許の商業性を判断するのは私の管轄ではありませんけれど……。"
"1005205-61-ノア" = "先生のいる場所を予測する装置なら、キヴォトス内で需要がありそうです。"
"1005205-62" = "[ns5] \"プライバシーの侵害だ！\"\n[ns6] \"この特許は無効だよ！\""
"1005205-63-ノア" = "あら、異議の申立ですか？"
"1005205-64-ノア" = "あら、異議の申立ですか？"
"1005205-65-ノア" = "特許の無効申請なら、常時受け付けてはいますが……。"
"1005205-66-ノア" = "口頭では対応いたしかねますので、きちんと書類を揃えて申請してくださいね。"
"1005205-67" = "……その後、しばらくの間ノアが許可した特許の可否について熱い議論が交わされた。"
