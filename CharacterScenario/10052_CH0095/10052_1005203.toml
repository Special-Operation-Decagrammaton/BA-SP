[translation]
"1005203-1" = "セミナー書記ノアの意地悪な観察"
"1005203-2" = "シャーレ・オフィス"
"1005203-3-ノア" = "こんにちは、先生。"
"1005203-4-ノア" = "今日もシャーレ当番を担当することになりました。"
"1005203-5-ノア" = "本日もよろしくお願いしますね。"
"1005203-6" = "[s] \"うん、よろしくね。\""
"1005203-7-ノア" = "今日はご機嫌ですね。"
"1005203-8-ノア" = "何か嬉しいことでもありましたか？"
"1005203-9" = "[s1] \"昨夜、いいことを思いついたんだ。\"\n[s2] \"ノアの余裕を突き崩す方法を！\""
"1005203-10-ノア" = "……私の余裕を、崩す方法……？"
"1005203-11-ノア" = "……私の余裕を、崩す方法……？"
"1005203-12-ノア" = "特に意図して余裕があるように振る舞った記憶は、ないのですが……。"
"1005203-13-ノア" = "先生に試されるというのは、面白そうですね。"
"1005203-14-ノア" = "それは一体どのような方法ですか？"
"1005203-15" = "[s] \"今度は、私がノアの行動を記録しようかな。\""
"1005203-16-ノア" = "……この間、私が記録したように、#n逆に先生が私の行動を観察し、記録する、ということですか？"
"1005203-17-ノア" = "なるほど……それは私にとっても馴染みの薄い経験ですね。"
"1005203-18-ノア" = "私は普段、他人の視線外で書記の業務を行っているので……。"
"1005203-19-ノア" = "誰かに見られる状況下で仕事をする事はありませんから。"
"1005203-20-ノア" = "……それでは、今日は先生のご提案通り、#nお互い観察しながら過ごすとましょう。"
"1005203-21-ノア" = "あ、先にお伝えしておきますと、"
"1005203-22-ノア" = "……簡単にはいきませんよ？#nふふ。"
"1005203-23" = "（30分後……）"
"1005203-24-ノア" = "……。"
"1005203-25" = "[s] \"……。\""
"1005203-26-ノア" = "……♪"
"1005203-27-ノア" = "あら、先生？#nお疲れみたいですね。"
"1005203-28" = "[s] \"人を観察するって、意外と疲れるね……。\""
"1005203-29-ノア" = "……そうですよね。"
"1005203-30-ノア" = "人の意志は言葉だけでなく、行動や表情など様々な記号で表現することができますから。"
"1005203-31-ノア" = "現場に流れる無限の情報を紙の上に記していくのは、#n決して簡単なことではありません。"
"1005203-32" = "[s] \"でも、今のところノアの行動は一つも逃さないでいるから……！\""
"1005203-33-ノア" = "先生ってば……一生懸命ですね、ふふ。"
"1005203-34-ノア" = "では私は、筆記用具の補充をしてきますね。"
"1005203-35-ノア" = "ただいま戻りました。"
"1005203-36-ノア" = "では、ここで……"
"1005203-37-ノア" = "問題です！"
"1005203-38" = "[s] \"いきなりクイズ！？\""
"1005203-39-ノア" = "先生が行動を一つも逃していないと仰っていたので、#nそんな先生の記録の精度を確認したいと思います。"
"1005203-40-ノア" = "今から出す問題に正解できたら、#n先生のお願いをなんでも一つ、聞いてあげます。"
"1005203-41-ノア" = "その代わり不正解の場合は……#nきちんと集中しなかった罰として、先生のコーヒーを一杯いただきますね♪"
"1005203-42" = "[s] \"別にいいけど……。\""
"1005203-43-ノア" = "それでは問題です。"
"1005203-44-ノア" = "先ほど、私は執務室の外で服装のとある部分を直してきました。"
"1005203-45-ノア" = "前と比べて、変わった部分はどこでしょうか？"
"1005203-46" = "[s3] \"難しいな……。\"\n[s4] \"パッと見、同じに見えるけど……。\""
"1005203-47-ノア" = "私のことを注意深く観察していたら、そう難しくはないはずです。"
"1005203-48-ノア" = "私のことを注意深く観察していたら、そう難しくはないはずです。"
"1005203-49-ノア" = "ただしチャンスは一度だけです。#n慎重に答えてくださいね。"
"1005203-50" = "[s] \"……ヘアピンが変わった？\""
"1005203-51-ノア" = "ぶぶー！不正解です。"
"1005203-52-ノア" = "ふふ、では約束通り、#n先生のコーヒーを一杯いただきますね。"
"1005203-53" = "[ns] \"それで、正解はなんだったの？\""
"1005203-54-ノア" = "まだ気づいてませんか？"
"1005203-55-ノア" = "正解は……『何も変わってません』でした～"
"1005203-56" = "[s5] \"なにそれ！？\"\n[s6] \"……だ、騙したの！？\""
"1005203-57-ノア" = "ふふ、厳密に言うと、騙しではありませんよ。"
"1005203-58-ノア" = "ふふ、厳密に言うと、騙しではありませんよ。"
"1005203-59-ノア" = "時には模範解答の外に存在する命題さえも、#n解答になることがあります。"
"1005203-60-ノア" = "そのため、優秀な書記は常日頃から偏見に囚われぬよう、#n全ての可能性を考慮しなければなりません。"
"1005203-61-ノア" = "そうすることで現実を客観的に観察でき……#n私のような悪い生徒にも騙されずに済みます。"
"1005203-62-ノア" = "ですから今は、私だけに集中してくださいね。"
"1005203-63" = "（その後も、ノアの変化を記録すべく、彼女を見つめ続けたものの……）"
"1005203-64-ノア" = "ふふ、このコーヒーはいつもより甘い気がします。"
"1005203-65" = "（何も得られなかった……） "
