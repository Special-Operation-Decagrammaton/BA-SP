[translation]
"1012803-1" = "甘い対価"
"1012803-2" = "（翌日、商店街に足を運んだ）"
"1012803-3" = "（どうしても買いたいものがあったのだが――）"
"1012803-4" = "（しばらく見て回ったものの……）"
"1012803-5" = "（……目当てのものは見つからなかった）"
"1012803-6" = "（そのとき……）"
"1012803-7-？？？" = "おや、先生？"
"1012803-8-フユ" = "奇遇ですね！"
"1012803-9-フユ" = "お変わりありませんか？"
"1012803-10" = "[s] \"もちろん！フユもお買い物？\""
"1012803-11-フユ" = "ええ、実は……。"
"1012803-12-フユ" = "交易用の投石機が壊れたので、部品を買いに来ていたんです。"
"1012803-13-フユ" = "もうすぐ開かれる展覧会用の資材も必要ですし。"
"1012803-14" = "[s] \"交易品以外も色々買うんだね。\""
"1012803-15-フユ" = "……ええ。"
"1012803-16-フユ" = "ところで、先生はどのようなご用件で？"
"1012803-17-フユ" = "日用品を買いに来ているようには見えませんが。"
"1012803-18-フユ" = "おっと、日用品で正解でしたか。"
"1012803-19-フユ" = "7段合体のスーパー合金変形ロボット……？"
"1012803-20-フユ" = "いいですね。"
"1012803-21-フユ" = "日常的に愛でるものという意味では……たしかに日用品かもしれません。"
"1012803-22" = "[s] \"ただ、どこにもなくてね。\""
"1012803-23-フユ" = "なるほど……では、そんな時こそ！"
"1012803-24-フユ" = "私どもの出番ですよ、お客様！"
"1012803-25" = "[s] \"お客様……？\""
"1012803-26-フユ" = "生産終了のものや、売り切れの商品……。"
"1012803-27-フユ" = "なんでも手に入れてきますよ♪"
"1012803-28" = "[s] \"さすがは特殊交易部の営業室長……！\""
"1012803-29-フユ" = "もちろん、多少の「対価」はいただきますが……ふふ。"
"1012803-30" = "[s] \"対価……？\""
"1012803-31-フユ" = "えっと……。"
"1012803-32-フユ" = "その……。"
"1012803-33-フユ" = "うーん……。"
"1012803-34" = "[s] \"……？\""
"1012803-35-フユ" = "ほら、あれですよ、あれ。"
"1012803-36-フユ" = "ご飯を奢ってもらうとか、一緒に映画を観にいくとか……。"
"1012803-37-フユ" = "ご飯じゃなくて、スイーツカフェでも、いい、ですけど……。"
"1012803-38" = "[s1] \"じゃあ、ご飯のあとに映画を観て……。\"\n[s2] \"最後はスイーツカフェでゆっくりしようか。\""
"1012803-39-フユ" = "え、えぇっ！？"
"1012803-40-フユ" = "ほ、本当ですか！？"
"1012803-41-フユ" = "じゃなくて！ぜ、ぜひっ――"
"1012803-42-フユ" = "よ、よろしく、お願いします……。"
"1012803-43" = "（フユにご飯をご馳走し、映画を観て、スイーツカフェでゆっくり過ごした）"
"1012803-44" = "（……その後、例の変形ロボットが本当にシャーレに届いた）"
