[translation]
"1601305-1" = "コハルの夜空"
"1601305-2" = "（浜辺で待っていると、コハルが恐る恐るやってきた）"
"1601305-3-コハル" = "うう……こ、ここにいたのね、先生。"
"1601305-4-コハル" = "というか、こんな夜遅くに外に出て何してるのよ……！？"
"1601305-5-コハル" = "……え？"
"1601305-6-コハル" = "星を見に来たの……？#nここは星がよく見えるから……？"
"1601305-7-コハル" = "別に星なんてどこでも見れるのに……"
"1601305-8-コハル" = "そうやって言い訳してるだけでしょ！私は騙されないんだからね！"
"1601305-9-コハル" = "……えっ、違うの？本当に？"
"1601305-10-コハル" = "一体何が……"
"1601305-11" = "[s1] \"空を見上げてごらん、コハル。\"\n[s2] \"星は、街から離れないとよく見えないんだよ。\""
"1601305-12-コハル" = "それは……"
"1601305-13-コハル" = "一体どういう……"
"1601305-14-コハル" = "……！！"
"1601305-15-コハル" = "な、何これ！？星が……こんなにいっぱい！"
"1601305-16-コハル" = "トリニティでいつも見てた空のはずなのに……"
"1601305-17-コハル" = "場所が変わっただけでしょ……どうしてこんな……"
"1601305-18" = "[s3] \"他に光が残っていると、星は消えちゃうから。\"\n[s4] \"夜闇が深ければ深いほど、星は輝くものだからね。\""
"1601305-19-コハル" = "そうなんだ……知らなかった。"
"1601305-20-コハル" = "じゃあ、先生はこれを見るために一人で……？"
"1601305-21-コハル" = "ふぅん……"
"1601305-22-コハル" = "もっともらしい言い訳ね。"
"1601305-23" = "[s5] \"コハルはどうしてここに？\"\n[s6] \"何か私に用事があったの？\""
"1601305-24-コハル" = "わ、私！？#nと、特に理由はないけど！？"
"1601305-25-コハル" = "というか、先生を監視するのに理由って必要！？#nなんで今さら聞くのよ！"
"1601305-26-コハル" = "他の人と一緒に寝てたのにいいのかって？"
"1601305-27-コハル" = "それは……そうだけど……"
"1601305-28-コハル" = "その……でも……"
"1601305-29-コハル" = "目が覚めた時に、先生がいなかったから……"
"1601305-30-コハル" = "も、もしかしたら何かあったのかもって思ったの……"
"1601305-31-コハル" = "な、何よ！その顔！！"
"1601305-32-コハル" = "やっぱさっきのはナシ！！#n先生のことなんて全然心配してなかったんだから！"
"1601305-33-コハル" = "もう！いいわよ！私は帰るからね！！#n先生は好きなだけ星でも見てたら！！"
"1601305-34-コハル" = "…………。"
"1601305-35" = "[s7] \"コハル？\"\n[s8] \"帰らないの？\""
"1601305-36-コハル" = "そ、それは……"
"1601305-37-コハル" = "その……"
"1601305-38-コハル" = "えっと……"
"1601305-39" = "[ns9] \"私もそろそろ帰ろっかな。誰かが一緒についてくれたらな～\"\n[ns10] 無言でコハルと一緒に帰る。"
"1601305-40-コハル" = "うう……思ってた以上に遠い……真っ暗だし……"
"1601305-41-コハル" = "こんなに暗いって知ってたら、先生を呼び出せばよかった……。"
"1601305-42-コハル" = "……先生？ちゃんと隣にいるよね？"
"1601305-43" = "[s11] \"ちゃんと手を繋いでるよ。大丈夫。\"\n[s12] \"怖いなら、ゆっくり歩こうか？\""
"1601305-44-コハル" = "こ、怖くないわよ！！"
"1601305-45-コハル" = "ただ、その……"
"1601305-46-コハル" = "あ、危ないから！！暗いし、怪我しちゃうかもしれないし！"
"1601305-47-コハル" = "だから……その……"
"1601305-48-コハル" = "えっと……"
"1601305-49-コハル" = "まあでも……先生と一緒なら、何かあっても大丈夫か。"
"1601305-50-コハル" = "何かあっても、どうにかしてくれるし……"
"1601305-51-コハル" = "……ふふ。"
"1601305-52-コハル" = "えへへ……"
"1601305-53-コハル" = "ヒャッ！？"
"1601305-54-コハル" = "な、何！？今、横から音が……"
"1601305-55" = "[ns13] \"落ち着いて、コハル。ただの……\"\n[ns14] \"大丈夫だよ、ただの小動物だから。\""
"1601305-56-コハル" = "ひゃぁああああああああ！？！？"
"1601305-57-コハル" = "先生！！！助けて！！！！"
"1601305-58" = "[ns15] \"コ、コハル！前が！！\"\n[ns16] \"大丈夫だから落ち着いて！！\""
"1601305-59" = "[ns] \"このままでは……！\""
"1601305-60" = "（コハルを落ち着かせようとするも、暴れるコハルと頭をぶつけてしまい、意識が薄れていった……）"
"1601305-61" = "（目を覚ますと、既に朝日が昇りはじめていて……）"
"1601305-62" = "[ns17] 慌てて周囲を見る。\n[ns18] \"コハル……？どこ……？\""
"1601305-63-コハル" = "……ふふ……うふふ。"
"1601305-64-コハル" = "あれも……これも……美味しい……もう食べられないよぉ……。"
"1601305-65-コハル" = "ふふ……うふふ……"
"1601305-66-コハル" = "………先生。"
"1601305-67" = "（気持ちよさそうに眠っているコハルを背負って、キャンプに戻った）"
