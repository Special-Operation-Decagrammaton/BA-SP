[translation]
"1006003-1" = "「待て」ができない女の子"
"1006003-2" = "（薄暗い路地の片隅で、メグの姿を見つけた）"
"1006003-3" = "（メグは焦っているのか、どこかソワソワしていた）"
"1006003-4" = "[ns1] \"……メグ、大丈夫？\"\n[ns2] \"メグ！何があったの！？\""
"1006003-5-メグ" = "先生、来てくれたんだ！待ってたよ！"
"1006003-6-メグ" = "うん？深刻そうだねって？"
"1006003-7-メグ" = "そうなの！#nすっごく大変なことになっちゃって！"
"1006003-8-メグ" = "どうしたのかって？"
"1006003-9-メグ" = "うーんとね……。"
"1006003-10-メグ" = "……。"
"1006003-11-メグ" = "……何も起きないの！ずっと！！"
"1006003-12" = "[ns3] \"……？\"\n[ns4] \"何もないことが、そんなに深刻なのかな……。\""
"1006003-13-メグ" = "先生なら分かってくれると思ってたよ～！"
"1006003-14-メグ" = "大変なの！"
"1006003-15" = "[ns] \"…………。\""
"1006003-16" = "[ns5] \"も、もちろん！大変だったね、メグ……。\"\n[ns6]（まったく分からなかった）"
"1006003-17-メグ" = "それがね、実はさっき温泉開発部のみんなと一緒に、#n部長の指示で温泉を掘ろうとしてたの。"
"1006003-18-メグ" = "ところが工事を始めた途端、なんかいろんな人たちが襲ってきたんだ。#nもうほんと、すごい人数だったの！"
"1006003-19-メグ" = "今回も戦うのか～って思ってたんだけどね、部長が散らばって隠れてろって言うから……。"
"1006003-20-メグ" = "こうやって隠れてるんだけど……。"
"1006003-21-メグ" = "問題はそのあと……。"
"1006003-22" = "[s] \"問題って……？\""
"1006003-23-メグ" = "ずーっとこうやって、バレないようにしとけって言われてさ……。"
"1006003-24-メグ" = "頑張って、じーーーっと我慢してるんだけど、もう私、我慢できそうにないよ！"
"1006003-25" = "[ns] \"…………。\""
"1006003-26-メグ" = "先生……大人しく過ごすには、どうすればいいの？#n私にはさっぱり分かんないよ！"
"1006003-27" = "[s7] \"……何もしてない時間がもどかしいってことかな。\"\n[s8] \"メグは活発だから、逆につらいんだね。\""
"1006003-28-メグ" = "うーん、そうなのかな……？"
"1006003-29-メグ" = "よく分かんないけど、たぶんそう！"
"1006003-30-メグ" = "時間がちっとも進まないんだよね。#nどこかに閉じ込められた時みたいな感じに！"
"1006003-31-メグ" = "でもね、たまに風紀委員の収監室に入れられることもあるけど、その時だってこんなにつらくはなかったの！#nあそこはそれなりに遊ぶものがあったし……。"
"1006003-32-メグ" = "それに、他の部員も一緒だったからかな？"
"1006003-33-メグ" = "でも今は……！"
"1006003-34-メグ" = "ううううう～～～！！！"
"1006003-35-メグ" = "……ん～、先生？"
"1006003-36-メグ" = "何か言った？"
"1006003-37-メグ" = "……あー、これ？"
"1006003-38-メグ" = "これは新しく温泉を作ったら、どこかに飾っといてって言われて渡されたんだ。"
"1006003-39-メグ" = "何だっけ。ケン……ダマ？"
"1006003-40-メグ" = "確かそんな名前だったような。"
"1006003-41-メグ" = "詳しいことはよく分からないんだけど、温泉が完成したらいい感じに飾る予定のやつ！"
"1006003-42-メグ" = "どうしてそんなことを……？"
"1006003-43-メグ" = "あっ、もしかして先生、これが何か知ってるの？"
"1006003-44-メグ" = "えっ？"
"1006003-45-メグ" = "……おもちゃなの？これが？どうやって遊ぶの？"
"1006003-46" = "[ns9] メグにけん玉を借りる。\n[ns10] \"お手本を見せてあげるよ。\""
"1006003-47-メグ" = "おぉ～！見せて見せて！"
"1006003-48-メグ" = "…………！！！！！！！！！！"
"1006003-49-メグ" = "えーーーっ！何それ！？"
"1006003-50-メグ" = "そんなことできるの！？ねえ、どうやったの！？"
"1006003-51-メグ" = "私もやってみたい！#nいいでしょ、先生？"
"1006003-52" = "[s11] \"もちろんだよ。\"\n[s12] メグにけん玉を返す。"
"1006003-53-メグ" = "よしっ、私も……！"
"1006003-54-メグ" = "……うー、あれっ？"
"1006003-55-メグ" = "思ったようにできない……。先生、何かコツとかないの？#nもしかして、頭が良くないとダメなのかな……。"
"1006003-56-メグ" = "練習すればできるようになるの？"
"1006003-57-メグ" = "ほんとっ？なら先生のこと信じて頑張るよ！"
"1006003-58-メグ" = "よ～し……！"
"1006003-59-メグ" = "ちゃんと見ててね、先生！#n絶対できるようになるから！"
"1006003-60-メグ" = "じゃあ、もっかい！"
"1006003-61" = "（その後、メグが上手にけん玉で遊べるようになるまで、何時間も練習に付き合った）"
"1006003-62" = "（途中でメグの携帯に何度も連絡が来てたけど、最後まで気付く様子はなかった……)"
