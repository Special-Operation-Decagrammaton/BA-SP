[translation]
"1012302-1" = "移ろいゆくもの"
"1012302-2" = "夕方、シャーレ・建物前"
"1012302-3" = "（少しの不安を覚えつつ、セイアを待っていた）"
"1012302-4-？？？" = "出迎えとは、手厚い歓迎だね。"
"1012302-5-？？？" = "ここまでしてもらうのは本意ではなかったが……#nちょうど、手間が省けたよ。"
"1012302-6" = "[s1] \"セイア……！？\"\n[s2] \"スポーツカー……！？\""
"1012302-7" = "[ns3] \"……水着！？\"\n[ns4] \"えっ！？これは……どういう？\""
"1012302-8-セイア" = "詳しい話は後にしよう。"
"1012302-9-セイア" = "君さえ良ければ、隣に座ってもらえるかい？"
"1012302-10-セイア" = "……本当に、君は表情によく出るな。"
"1012302-11-セイア" = "案ずることはないさ。ただのドライブだからね。"
"1012302-12-セイア" = "まずは人目のつかないところへ移動するとしよう。#nここでは、余計な衆目を集めかねない。"
"1012302-13-セイア" = "……ん？"
"1012302-14-セイア" = "あぁ、この車か。"
"1012302-15-セイア" = "成程、先生には話してなかったな。"
"1012302-16-セイア" = "これでも、運転する機会はそれなりに多くてね。"
"1012302-17-セイア" = "車以外にも……バイク、ヨット、色々あるが――"
"1012302-18-セイア" = "まぁ、それらは別の機会に。#n今日のところは……ほら、座りたまえよ。特等席だ。"
"1012302-19" = "[s5] \"う、うん……。\"\n[s6] 助手席に座る。"
"1012302-20-セイア" = "ふふ……。"
"1012302-21-セイア" = "では、行こうか。"
"1012302-22" = "（走り出した車は郊外へと向かった）"
"1012302-23" = "（セイアは微笑んだまま、しばらく一言も発さなかった）"
"1012302-24-セイア" = "もうすぐで目的地だ。存外、スムーズに来られたな。"
"1012302-25-セイア" = "ふむ……。"
"1012302-26-セイア" = "どうやら、海は私たちを歓迎してくれているらしい。"
"1012302-27" = "[wa:1530]― [log=세이아 수영복]良い風だ。[/log]"
"1012302-28" = "[wa:1150]― [log=세이아 수영복]やはり、[wa:1220]心なしか[wa:820]涼やかに感じられる。[/log]"
"1012302-29" = "― [log=세이아 수영복]邪魔するものはなく……[/log]"
"1012302-30" = "[wa:330]― [log=세이아 수영복]この世界は[wa:670]私たちだけのものだ。[/log]"
"1012302-31" = "[wa:1160]― [log=세이아 수영복]助手席からの眺めは[wa:1290]美しいかな？[/log]"
"1012302-32" = "― [log=세이아 수영복]その表情は……[/log]"
"1012302-33" = "[wa:1030]― [log=세이아 수영복]景色に驚いているのかい？[/log]"
"1012302-34" = "[wa:1470]― [log=세이아 수영복]それとも……[/log]"
"1012302-35" = "― [log=세이아 수영복]私の誘いが[wa:880]意外だったのかな？[/log]"
"1012302-36" = "[wa:1380]― [log=세이아 수영복]どちらにせよ、[wa:1750]その顔を拝めただけで[wa:1400]満足だ。[/log]"
"1012302-37" = "[wa:160]― [log=세이아 수영복]こうして誘った甲斐が[wa:1130]あったというものだね。[/log]"
"1012302-38" = "― [log=세이아 수영복]大それた理由を求められても[wa:1560]困ってしまうな。[/log]"
"1012302-39" = "― [log=세이아 수영복]気の向くままに……[wa:2170]それだけのことさ。[/log]"
"1012302-40" = "[wa:670]― [log=세이아 수영복]こういうのを、[wa:1470]何と言ったかね……[/log]"
"1012302-41" = "― [log=세이아 수영복]ふむ……[wa:2090]逃避行？[/log]"
"1012302-42" = "[wa:250]― [log=세이아 수영복]ふふ……[wa:1500]冗談さ。[/log]"
"1012302-43" = "― [log=세이아 수영복]けれど、[wa:1530]まだしばらくは……[/log]"
"1012302-44" = "[wa:600]― [log=세이아 수영복]そうだな。[/log]"
"1012302-45" = "[wa:220]― [log=세이아 수영복]君を送り返すまでは、[/log]"
"1012302-46" = "― [log=세이아 수영복]この「戯れ」に[wa:970]付き合ってもらうとしようか。[/log]"
"1012302-47-セイア" = "さあ、到着だ。"
"1012302-48-セイア" = "急を要すること。そう言って君に時間を作ってもらったわけだが――"
"1012302-49-セイア" = "特別、問題が起きているわけではないんだ。#nそうだな……。"
"1012302-50-セイア" = "季節は移ろうもの。#n[ruby=いま]現在[/ruby]このひとときを、この景色を……共に感じたくてね。"
"1012302-51-セイア" = "……肩透かしを食らった気分かい？"
"1012302-52-セイア" = "無暗やたらに気を揉ませていたのなら、申し訳ない。"
"1012302-53" = "[s7] \"まあ、ちょっとは驚いたけど……。\"\n[s8] \"最初からそう言ってくれればよかったのに。\""
"1012302-54-セイア" = "ふふ……。"
"1012302-55-セイア" = "ふふふ……。"
"1012302-56-セイア" = "……ああ、済まない。ただ、つい楽しくなってしまって。"
"1012302-57-セイア" = "以前の先生なら「何事もなくてよかったよ」などと、月並みな言葉を口にしていたはずだからね。"
"1012302-58-セイア" = "今は……そうでもないらしい。"
"1012302-59-セイア" = "まあ、然もありなん。#nこれまで、あれやこれやと君にちょっかいを出してきたからな。"
"1012302-60-セイア" = "これを、どう形容したものか……。"
"1012302-61-セイア" = "他人同士の距離感は可変するものだ。#n親しくなり、近づくこともあれば、無論、その逆も然り。"
"1012302-62-セイア" = "君は……私の戯れに流されるままではなく、ちゃんと「抗議」をしてくれるようになった。"
"1012302-63-セイア" = "或いは……私が、そんな小言を待ち望んでいたのかもしれない。"
"1012302-64-セイア" = "純真無垢に羽目を外して、悪戯を咎められ、ときには叱られる――#nまるで、手のかかる生徒のようにね。"
"1012302-65-セイア" = "……こういうのはなんと言うのだったか。"
"1012302-66" = "[s9] \"……はぁ。\"\n[s10] わざと深いため息をつく。"
"1012302-67-セイア" = "……！！！"
"1012302-68-セイア" = "ふふ、ふふふ……。"
"1012302-69-セイア" = "成程……斯様な感覚だったとは。"
"1012302-70-セイア" = "今まで見過ごしていたことが惜しまれるよ。#nだが、遅きに失するという程でもあるまい……これは、いよいよ癖になりそうだね。"
"1012302-71-セイア" = "……冗談だ。"
"1012302-72-セイア" = "いや、厳密に言えば気持ちは本物だ。#nとはいえ、私にだって節度というものはある。"
"1012302-73" = "[s11] \"度が過ぎると先生も怒りますよ？\"\n[s12] \"……なんてね。これくらいなら全然構わないよ。\""
"1012302-74-セイア" = "……君は底が知れないな。"
"1012302-75-セイア" = "先生がその気なら、私も考え直すとしよう。"
"1012302-76-セイア" = "生徒の主体性に委ねてはぐらかす。#nまさに、先生の常套手段じゃないか。"
"1012302-77" = "[s13] \"セイアが望む答えをしたまでだよ。\"\n[s14] \"こういうのが好きなんじゃなかった？\""
"1012302-78-セイア" = "……ふふっ。"
"1012302-79-セイア" = "風が冷たくなってきた。そろそろ戻ろうか。#n現実からの逃避行もこれで閉幕だ。"
"1012302-80-セイア" = "次回は……まだ保証できないけれど。"
"1012302-81" = "（その後、セイアはシャーレまで送り届けてくれた）"
"1012302-82" = "（ドライブの間、彼女は終始無言だったものの……別れ際に一度だけ、微笑んだのだった）"
