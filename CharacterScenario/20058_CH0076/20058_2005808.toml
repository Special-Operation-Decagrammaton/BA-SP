[translation]
"2005808-1" = "エリカ、秘密基地"
"2005808-2" = "（仕事終わりにエリカと会うことになった）"
"2005808-3-エリカ" = "あっ、先生やっほ。"
"2005808-4-エリカ" = "いつも大変だね。ゲヘナにまで来る用事？"
"2005808-5" = "[s1] \"ちょっとね。\"\n[s2] \"先生、別に遊んでるわけじゃないからね！？\""
"2005808-6-エリカ" = "はいはい、分かってますよー。"
"2005808-7-エリカ" = "こうやって会えて嬉しい。"
"2005808-8" = "[s] \"教えてもらった通り、空すごく綺麗だった。\""
"2005808-9-エリカ" = "でしょ？今日本当に綺麗だよね。"
"2005808-10-エリカ" = "あ、そうだ今ちょっと時間大丈夫？"
"2005808-11-エリカ" = "ちょっと、教えたい場所があって。"
"2005808-12-エリカ" = "時間大丈夫そう？ふふ、よかった。"
"2005808-13-エリカ" = "じゃあ、ついてきて。"
"2005808-14" = "（エリカの後に続いてとある建物へ向かった）"
"2005808-15-エリカ" = "静かでしょ。#nこの時間はもうみんな帰っちゃってるからさ。"
"2005808-16-エリカ" = "割とすぐに帰っちゃうんだよね。まぁ、長居してても何も無いし。"
"2005808-17-エリカ" = "私はこうやって、静かな校内を楽しんだりするんだけどね。"
"2005808-18" = "[ns] \"エリカ、香水変えた？\""
"2005808-19-エリカ" = "へ、うん！？"
"2005808-20" = "[s3] \"いつもと違う気がして。\"\n[s4] \"こっちもいいね。\""
"2005808-21-エリカ" = "あっ……う、うん……。"
"2005808-22-エリカ" = "オススメされたやつ、に変えてみた。"
"2005808-23-エリカ" = "まあ、いい匂いなら、よかった……うん。"
"2005808-24-エリカ" = "というか、こういうのって普通気付かないよね？#n先生ってなんか不思議っていうか、妙に鋭いっていうか……。"
"2005808-25-エリカ" = "まぁいいや。こっち来て。"
"2005808-26-エリカ" = "ほら、手。出して。"
"2005808-27" = "（エリカに手を引かれてたどり着いたのは……）"
"2005808-28" = "[wa:602]― [log=에리카]ようこそ、[wa:994]先生。[/log]"
"2005808-29" = "― [log=에리카]ここが、[wa:946]私だけの[wa:603]秘密基地――[/log]"
"2005808-30" = "[wa:2193]― [log=에리카]一人の時間が欲しい時に、[wa:1949]来る場所。[/log]"
"2005808-31" = "― [log=에리카]ふふっ、[wa:1592]でも[wa:577]秘密基地っていうには、 [wa:1630]ちょっと[wa:487]広いかも。[/log]"
"2005808-32" = "[wa:813]― [log=에리카]……なんか、[wa:1285]先生に[wa:938]共有したかったんだよね。[/log]"
"2005808-33" = "― [log=에리카]私がいつも見ている[wa:1483]景色とか……[wa:1712]感じてる空気、[wa:1775]とか。[/log]"
"2005808-34" = "[wa:810]― [log=에리카]理由を聞かれても[wa:1250]なんとなく、[wa:910]しか[wa:310]言えないんだけど……。[/log]"
"2005808-35" = "― [log=에리카]そうだね……[wa:2110]秘密の場所を教えるのって、[wa:2336]特別の証だからさ。[/log]"
"2005808-36" = "― [log=에리카]先生は、[wa:1406]私の[wa:721]特別な[wa:693]人[wa:521]ってこと。[/log]"
"2005808-37" = "[wa:171]― [log=에리카]……ふふっ。[/log]"
"2005808-38" = "― [log=에리카]ここは[wa:290]静かでしょ？[/log]"
"2005808-39" = "― [log=에리카]まあでも……[wa:1848]私の心は、[wa:2337]ちょっと[wa:329]騒がしいんだけどね。[/log]"
"2005808-40-エリカ" = "ここに来る人って本当にいないんだ。"
"2005808-41-エリカ" = "初めて来た時からずーっと、私だけの場所。"
"2005808-42-エリカ" = "まあ、独り占めできるから嬉しいんだけど。"
"2005808-43-エリカ" = "どう？気に入った？"
"2005808-44-エリカ" = "じゃあ先生の場所も、取っておいてあげる。"
"2005808-45-エリカ" = "ふぅ……。"
"2005808-46-エリカ" = "見慣れた景色のはずなのに……今日はなんか違う気がする。"
"2005808-47-エリカ" = "まあ理由は分かってるんだけどさ……。#nなんか、実際に体験すると不思議だね。"
"2005808-48" = "（エリカとしばらく夕焼けを眺めた）"
"2005808-49" = "（屋上を出たのは、水平線に日が沈んでからだった）"
"2005808-50-エリカ" = "わ、日が落ちるの早いね。"
"2005808-51" = "[s] \"いつもこんな時間までいるの？\""
"2005808-52-エリカ" = "ううん。"
"2005808-53-エリカ" = "夜の廊下ってちょっと怖いからあんまり。"
"2005808-54-エリカ" = "いつもはまだ日があるうちに屋上を出るんだけど……。"
"2005808-55-エリカ" = "今日は先生と一緒だったし。"
"2005808-56-エリカ" = "何も話さなくても、隣にいるだけでなんか落ち着くから……#nうっかり長居しちゃった。"
"2005808-57-エリカ" = "あ、そういえば先生は大丈夫？遅くなっちゃったんじゃない？"
"2005808-58" = "[s5] \"私も楽しかったから。\"\n[s6] \"久しぶりにゆっくりした時間を過ごせたよ。\""
"2005808-59-エリカ" = "またそういうコト言って……。"
"2005808-60-エリカ" = "まあ、そういうところが……。"
"2005808-61-エリカ" = "廊下、暗いと危ないし怖いからさ――"
"2005808-62-エリカ" = "手、貸してね。"
"2005808-63" = "（暗い廊下を一緒に歩き……）"
"2005808-64" = "（明かりの灯る場所に到着しても、エリカは手を離さずにいた）"
