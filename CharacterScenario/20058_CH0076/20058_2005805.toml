[translation]
"2005805-1" = "エリカと自販機"
"2005805-2" = "（ゲヘナでの用事を終えた帰りに自販機に寄ったところ……）"
"2005805-3" = "[ns] \"何にしようかな……。\""
"2005805-4" = "（ボタンを押そうとしたその時……）"
"2005805-5-？？？" = "それ微妙なヤツだよ。"
"2005805-6" = "[ns] \"あ、エリカ。\""
"2005805-7-エリカ" = "隣の方がオススメ。"
"2005805-8-エリカ" = "2つ右の……ああ、そうそう、それ。"
"2005805-9" = "[s] \"信じるからね？\""
"2005805-10-エリカ" = "まあイケるんじゃない？"
"2005805-11" = "[ns] \"本当に信じたからね？\""
"2005805-12-エリカ" = "あははっ！飲んでからいいなよ。"
"2005805-13" = "[ns] \"あ……美味しい！\""
"2005805-14-エリカ" = "ほらね。美味しいでしょ？#n先生好きだと思った。"
"2005805-15-エリカ" = "え？なんで好みを知ってるのか？#n前教えてくれたじゃん。"
"2005805-16" = "[s1] \"覚えててくれたんだ？\"\n[s2] \"先生、感動！\""
"2005805-17-エリカ" = "なんか記憶に残ってたんだよね。"
"2005805-18-エリカ" = "ふふっ、先生は私の好み覚えてる？どう？"
"2005805-19-エリカ" = "ほら、選んで！"
"2005805-20" = "[s] \"え……ちょっと緊張するかも。\""
"2005805-21-エリカ" = "はいはい、肩の力抜いて～"
"2005805-22-エリカ" = "……。"
"2005805-23-エリカ" = "ふーん……それなんだ……？"
"2005805-24-エリカ" = "……。"
"2005805-25-エリカ" = "あ、やっぱ違うのにする？#n悩んでおりますなぁ～くっくっく。"
"2005805-26" = "[ns] \"こ……これだっ！！\""
"2005805-27-エリカ" = "おお……。"
"2005805-28-エリカ" = "おおーーっ！"
"2005805-29-エリカ" = "せいかい♪#nこれ好きなんだ。"
"2005805-30-エリカ" = "でも、本当は先生テキトーに選んだんじゃない？"
"2005805-31-エリカ" = "ふーん、そんな気がした……ねぇ？"
"2005805-32-エリカ" = "あったかいものよりは冷たいもの、炭酸よりは炭酸なし……？"
"2005805-33-エリカ" = "……。"
"2005805-34-エリカ" = "めっちゃ考えてくれてるじゃん。"
"2005805-35-エリカ" = "センスいいね。ありがと。"
"2005805-36-エリカ" = "あ、ごめん……開けてもらっていい？#n爪長いからあんまりうまく開けられなくて……。"
"2005805-37" = "[s] \"フッ、任せなさい！\""
"2005805-38-エリカ" = "あははっ、せんせーなんか嬉しそう。"
"2005805-39" = "[ns] \"痛っ！\""
"2005805-40-エリカ" = "あっ、大丈夫！？"
"2005805-41-エリカ" = "あー……フチで怪我しちゃったか……痛そ。"
"2005805-42-エリカ" = "ちょっと待ってて。絆創膏あるから。"
"2005805-43-エリカ" = "はい、手出して。"
"2005805-44-エリカ" = "ごめんね……私のせいで。"
"2005805-45-エリカ" = "いや、全然大丈夫じゃないでしょ。ごめんね。"
"2005805-46" = "[s] \"絆創膏持ち歩いてるんだね。\""
"2005805-47-エリカ" = "まあね。結構使う機会多いからさ。たしなみってやつ？#n友達もよく怪我するし。"
"2005805-48-エリカ" = "優しい？のかな？そんなこともないと思うよ。"
"2005805-49-エリカ" = "あー……先生がつけるにはちょっと可愛すぎたかも？"
"2005805-50-エリカ" = "まあ……いっか。#n可愛い柄だと早く治るって言うし？"
"2005805-51" = "[s] \"関係あるかなそれ？\""
"2005805-52-エリカ" = "ふふっ。どうだろね。#nはい、できましたっと……。"
"2005805-53-エリカ" = "……。"
"2005805-54-エリカ" = "……なんか。"
"2005805-55-エリカ" = "先生、ちょっと手当ててみて。"
"2005805-56-エリカ" = "そうそう。そうやって……。"
"2005805-57-エリカ" = "うん……。"
"2005805-58-エリカ" = "……前から思ってたけど、先生の手ってあったかいよね。"
"2005805-59" = "[s] \"エリカの手はなんだか柔らかいね。\""
"2005805-60-エリカ" = "……。"
"2005805-61-エリカ" = "そ、そう？柔らかいのはたぶん、いいことだよね？#nあははっ。"
"2005805-62-エリカ" = "……。"
"2005805-63-エリカ" = "そ、そういえば！飲み物また奢ってもらっちゃったね……ありがと。"
"2005805-64-エリカ" = "なんか先生、私に会う度に色々奢ってくれたり……怪我しちゃったり。あんま楽しくないかも？大丈夫？"
"2005805-65" = "[s] \"また美味しいもの食べようね。\""
"2005805-66-エリカ" = "……。"
"2005805-67-エリカ" = "うん。#nまたね、先生。"
