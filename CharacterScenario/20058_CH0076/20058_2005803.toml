[translation]
"2005803-1" = "エリカと夜のお散歩"
"2005803-2-エリカ" = "せんせー、やっほ♪"
"2005803-3-エリカ" = "なんかこんな時間に先生と会うの、ちょっと不思議な感じ。"
"2005803-4" = "[s1] \"たしかに。ちょっと遅い時間だもんね。\"\n[s2] \"エリカはお腹空いてる？\""
"2005803-5-エリカ" = "ん～、ちょっと？"
"2005803-6-エリカ" = "……結構すいたかも？"
"2005803-7-エリカ" = "動いてる時は全然感じなかったのに……なんでだろ。#n意識すると急にお腹空いてきちゃった。"
"2005803-8" = "[s3] \"私もペコペコだよ～\"\n[s4] \"何か食べたいものとかある？\""
"2005803-9-エリカ" = "うーん……。"
"2005803-10-エリカ" = "あれとか……どうかな？"
"2005803-11-エリカ" = "なんか見てたらハンバーガーの気分になってきちゃって。"
"2005803-12-エリカ" = "先生はハンバーガー好き？よく食べる方？"
"2005803-13" = "[s5] \"めっちゃ好き！\"\n[s6] \"今日はなんかいつもより美味しく食べられそう！\""
"2005803-14-エリカ" = "本当？私に合わせてたりしない？"
"2005803-15-エリカ" = "まぁ、それならいいんだけどさ。"
"2005803-16-エリカ" = "こんな時間なのに結構混んでるね。みんなテンション高いし。"
"2005803-17-エリカ" = "なんとなくだけど、夜のファストフード店ってテンション上がるのも分かるかも。"
"2005803-18-エリカ" = "明日の準備をしてる時間だけど、外で高カロリーなものを食べるのって……なんかほら、背徳感？開放感？みたいなのがあるっていうか。"
"2005803-19" = "[s7] \"今を楽しんでるって感じがするよね。\"\n[s8] \"なんか分かるかも。\""
"2005803-20-エリカ" = "そうそう。#nちょっと良くないことをしてる、みたいな。あははっ。"
"2005803-21-エリカ" = "お、結構早いね。"
"2005803-22" = "[ns] \"お待たせしました～\""
"2005803-23-エリカ" = "取りに行ってもらっちゃってごめん。#n奢ってもらっちゃったし……ありがと、先生。"
"2005803-24-エリカ" = "先生は何頼んだの？"
"2005803-25" = "[s9] \"トリプルチーズバーガーセット！\"\n[s10] \"シュリンプバーガーセット！\""
"2005803-26-エリカ" = "じゃあこっちだね。私のはこっち。"
"2005803-27-エリカ" = "ベーコントマトチーズバーガーセット♪"
"2005803-28" = "[s11] \"あれ？トマトがないけど。\"\n[s12] \"店員さん間違えちゃった？\""
"2005803-29-エリカ" = "あ、いや……トマト抜きにしてもらってるんだ。"
"2005803-30-エリカ" = "ほら……バーガーのトマトってちょっと食べづらくない？"
"2005803-31-エリカ" = "うまく噛み切れないと全部ついてきちゃうし。"
"2005803-32-エリカ" = "なんか食べ方汚くなるの、あんま見られたくないっていうか……。"
"2005803-33-エリカ" = "先生と一緒だし……特にみたいな。"
"2005803-34-エリカ" = "「それなら私にくれればいい」……？"
"2005803-35-エリカ" = "……。"
"2005803-36-エリカ" = "えっ、ちょっとそれは……流石に。"
"2005803-37-エリカ" = "また今度ね！"
"2005803-38-エリカ" = "よし、改めて……。"
"2005803-39-エリカ" = "いただきます！ありがとね先生！"
"2005803-40" = "（そうしてエリカと遅めの夕飯を楽しんだ）"
