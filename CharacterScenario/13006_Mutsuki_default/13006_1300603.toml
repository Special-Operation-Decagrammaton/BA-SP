[translation]
"1300603-1" = "人には言えない小悪魔の秘密"
"1300603-2" = "（ムツキに招待されて、便利屋の事務所に来た）"
"1300603-3-ムツキ" = "先生ようこそ～！"
"1300603-4-ムツキ" = "今日は先生と遊ぶために、い・ろ・い・ろ♡たくさん用意したよー！"
"1300603-5" = "[s] \"そのかばんの中にあるの？いつも持ち歩いてるやつだね。\""
"1300603-6-ムツキ" = "うん！まずはトランプでしょ～、"
"1300603-7-ムツキ" = "チェスでしょ～オセロでしょ～バックギャモンでしょ～、あっ！かるたもあるよ！"
"1300603-8" = "[s] \"すごい数のボードゲームだね？\""
"1300603-9-ムツキ" = "うん、今日のために準備したの。"
"1300603-10-ムツキ" = "外で遊ぶのもいいけど、こうやって室内でのんびりゲームするのも楽しいよ、きっと！"
"1300603-11-ムツキ" = "くふふっ、さあ先生、最初はどのゲームにする～？"
"1300603-12" = "（そうやって、ムツキと二人で色んなボードゲームを遊んだ）"
"1300603-13" = "（いつの間にか5時間近くが過ぎた頃……）"
"1300603-14-ムツキ" = "ふふっ、おもしろーい！"
"1300603-15-ムツキ" = "あ、もうこんな時間？楽しい時間は過ぎるのが早いな～。"
"1300603-16" = "[s] \"確かに、これはボードゲームマジック……。\""
"1300603-17-ムツキ" = "先生はどう？疲れた？ちょっと休む？"
"1300603-18-ムツキ" = "あっ、私、喉乾いちゃった。ちょっと待っててね、飲み物どこだっけな～。"
"1300603-19" = "……そうだ！"
"1300603-20-ムツキ" = "先生、私がいない間にカバンの中とか見ちゃダメだよ？"
"1300603-21-ムツキ" = "乙女の、ひ・み・つ、だからね～。"
"1300603-22-ムツキ" = "……絶対に、見ちゃダメだよ？"
"1300603-23" = "[s] \"カバン？\""
"1300603-24" = "（そういえばこれまで遊んだボードゲーム、全部あのカバンから出てきたけど）"
"1300603-25" = "（今まで遊んだのだけでも20個はあったはず……）"
"1300603-26" = "[s1] \"ん……？\"\n[s2] \"それって……物理的に、ありえる？\""
"1300603-27" = "（ピクッ）"
"1300603-28" = "（ピクッ）"
"1300603-29" = "[ns] \"……今、カバンがちょっと動いた？\""
"1300603-30" = "[ns] \"気のせいだよね……。\""
"1300603-31" = "[ns] \"ムツキが帰ってくる前にテーブルを片付けておこう……。\""
"1300603-32" = "（ピクッ）"
"1300603-33" = "[ns] \"気のせいじゃない……！\""
"1300603-34" = "（ピクッ、ピクッ）"
"1300603-35" = "[ns] \"ごくり……。\""
"1300603-36" = "[ns3] \"……か、確認してみようかな。\"\n[ns4] \"ムツキもああ言ってたし、勝手に中を見るわけには……。\""
"1300603-37" = "（ごくっ）"
"1300603-38" = "[ns5] \"どれどれ……？\""
"1300603-39" = "（……！！！）"
"1300603-40" = "（その中には……）"
"1300603-41" = "（持ち主が席を外してる間に物を確認するのは、やっぱりイケないことな気がした）"
"1300603-42" = "先生？"
"1300603-43" = "[ns] \"はっ！！\""
"1300603-44-ムツキ" = "先生、どうしたの？お化けでも見たような顔してるけど。"
"1300603-45" = "[s] \"その、さっき、カバンが……。\""
"1300603-46-ムツキ" = "カバンが？どうかしたの？"
"1300603-47" = "[s] \"う、ううん。なんでもない……。\""
"1300603-48-ムツキ" = "な～んだ、つまんないの。はい、飲み物持ってきたよ。"
"1300603-49-ムツキ" = "ほらほら、ゆっくりしてる時間は無いよ～。まだまだゲームはたくさん残ってるんだしっ。"
"1300603-50-ムツキ" = "だ・か・らぁ……ほらっ、2回戦、始めよっか♥"
"1300603-51" = "（その後は特に変わったこともなく、夜になるまでムツキとたくさんボードゲームをして遊んだ）"
"1300603-52-ムツキ" = "くふふ………。"
"1300603-53-ムツキ" = "先生が中身に気づかなくて良かった。"
"1300603-54-ムツキ" = "これは、乙女のひ・み・つ♡だからねっ。"
