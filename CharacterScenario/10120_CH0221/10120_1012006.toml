[translation]
"1012006-1" = "放課後「鼓動」"
"1012006-2" = "（深夜になっても仕事が終わらず――）"
"1012006-3" = "（眠気を覚ますため、散歩に出た）"
"1012006-4" = "（あてどなく歩いていると……）"
"1012006-5-？？？" = "あれ？先生？"
"1012006-6-ナツ" = "こんな時間にどうしたの？"
"1012006-7-ナツ" = "残業……眠気覚まし……？"
"1012006-8-ナツ" = "……大人は大変だねぇ。"
"1012006-9" = "[s] \"ナツはなにをしてたの？\""
"1012006-10-ナツ" = "ジョギングだよ。"
"1012006-11-ナツ" = "バンドを始めてから、毎日走ってるんだ。"
"1012006-12-ナツ" = "ドラマーは体力勝負だからね。"
"1012006-13-ナツ" = "少しでも鍛えておかないと。"
"1012006-14-ナツ" = "本番は練習のように、練習は本番のように……ってね。"
"1012006-15" = "[s] \"ナツは努力家なんだね。\""
"1012006-16-ナツ" = "……ふふ。"
"1012006-17-ナツ" = "できることをしているだけだよ。"
"1012006-18" = "[s1] \"頑張っている生徒には……。\"\n[s2] \"ご褒美をあげないとだね。\""
"1012006-19" = "（近くの自販機で缶コーヒーを二つ買って、一つはナツにあげた）"
"1012006-20-ナツ" = "おお、感謝ー。"
"1012006-21-ナツ" = "夜のコーヒー……大人の雰囲気……。"
"1012006-22" = "（ナツと近くのベンチに座った）"
"1012006-23-ナツ" = "ドラムはさ、アンチノミーって言葉がぴったりな楽器なんだ。"
"1012006-24-ナツ" = "ステージの一番奥で、視覚的に目立つことはない。"
"1012006-25-ナツ" = "でも、演奏を作るのはドラムの音。"
"1012006-26-ナツ" = "バンドでは、ドラムのリズムが曲をリードしていく。"
"1012006-27-ナツ" = "だから、ドラムはバンドの要なんだよね。"
"1012006-28-ナツ" = "常に平常心で、自分のリズムを維持するのが大事。"
"1012006-29-ナツ" = "一番大きな音を出す楽器なのに、一番落ち着いて演奏しなきゃいけないんだ。"
"1012006-30-ナツ" = "あ、もちろん楽器に優劣をつけるつもりじゃないよ。"
"1012006-31-ナツ" = "それぞれに役割があるよねって話。"
"1012006-32-ナツ" = "……案外、やりがいのある楽器だなって、思ってるんだ。"
"1012006-33-ナツ" = "だから――"
"1012006-34" = "（紛らわせていた眠気が、再び襲い掛かってきた）"
"1012006-35" = "（ナツの話を聞かないと――）"
"1012006-36" = "（その思いに反して瞼は重くなり……意識が遠のいていく……）"
"1012006-37-ナツ" = "せ、先生……？"
"1012006-38-ナツ" = "肩、に……。"
"1012006-39-ナツ" = "…………。"
"1012006-40-ナツ" = "……………………！"
"1012006-41" = "（ドクン、ドクン、ドクン、ドクン）"
"1012006-42-ナツ" = "え……。"
"1012006-43-ナツ" = "せ、せんせ……？"
"1012006-44-ナツ" = "うぅ……。"
"1012006-45-ナツ" = "……。"
"1012006-46-ナツ" = "ど、どうしよう……。"
"1012006-47-ナツ" = "リズム、こんなに早まっちゃ……ダメ、なのに……。"
"1012006-48" = "（目を覚ますまで、ナツは待ってくれていた）"
"1012006-49" = "（その後、ナツは帰り道にまで付き添ってくれたものの……#nシャーレに着くなり、すごいスピードで帰っていった）"
