[translation]
"1601603-1" = "理由がなくたって"
"1601603-2" = "（仕事終わりに、買い物をしていると……）"
"1601603-3-？？？" = "まさか、こんなところでお会いできるとは。"
"1601603-4" = "[ns1] \"この声は……。\"\n[ns2] \"……ミネ？\""
"1601603-5-ミネ" = "先生もお仕事中ですか？"
"1601603-6-ミネ" = "私は救護騎士団の用事がありまして。#n同じ方向でしたら、途中まで一緒に行きましょう。"
"1601603-7-ミネ" = "どうしました、先生？"
"1601603-8-ミネ" = "……ああ、衣装のことですか。"
"1601603-9-ミネ" = "説明しておりませんでしたね。"
"1601603-10-ミネ" = "今日は「救護」の一環でライブをする予定なのです。"
"1601603-11-ミネ" = "それゆえ、このようにアイドルの衣装を着ております。"
"1601603-12" = "[s3] \"大変だね。\"\n[s4] \"頑張ってるんだね。\""
"1601603-13-ミネ" = "ふふっ。#nこれくらい、何ともありません。"
"1601603-14-ミネ" = "では、行きましょうか。"
"1601603-15" = "（……数日後）"
"1601603-16" = "（仕事のつながりで、レストランにやってきた）"
"1601603-17-？？？" = "……ん？"
"1601603-18-ミネ" = "またお会いするとは、驚きました。"
"1601603-19-ミネ" = "もちろん、私としては嬉しい限りですが……ふふっ。"
"1601603-20" = "[s5] \"ここでもライブをするの？\"\n[s6] \"今日もアイドル衣装なんだね。\""
"1601603-21-ミネ" = "……あっ、今回はライブのためではありません。"
"1601603-22-ミネ" = "ここの料理が美味しいと聞きまして、食事に来た次第です。"
"1601603-23-ミネ" = "衣装を着ている理由は……。"
"1601603-24-ミネ" = "…………。"
"1601603-25-ミネ" = "……ど、ドレスコードです。"
"1601603-26-ミネ" = "場の雰囲気に合うよう選びました。"
"1601603-27" = "[s7] （場の雰囲気に……？）\n[s8] （今の間はなんだろう……）"
"1601603-28-ミネ" = "せ、先生もお約束があるでしょうし、そろそろ失礼いたします。"
"1601603-29-ミネ" = "では……！"
"1601603-30" = "（その後も、町でアイドル姿のミネと会う度に……）"
"1601603-31" = "（……なぜか毎回、変な言い訳を聞かされた）"
"1601603-32" = "（とある夜勤の日）"
"1601603-33" = "（眠気を覚ますためにコンビニへ向かったところ……）"
"1601603-34-ミネ" = "……あら、先生。"
"1601603-35-ミネ" = "こんな時間まで、お疲れ様です。"
"1601603-36-ミネ" = "いつも私たち生徒のために、ありがとうございます。"
"1601603-37-ミネ" = "ですが、たまにはゆっくり……。"
"1601603-38-ミネ" = "……あっ。"
"1601603-39-ミネ" = "こ、これは……。"
"1601603-40-ミネ" = "えっとですね……。"
"1601603-41" = "[s9] \"ミネ、待って。\"\n[s10] \"理由がなくたって……。\""
"1601603-42-ミネ" = "いえ、先生……！"
"1601603-43-ミネ" = "その、なんと言えば……。"
"1601603-44-ミネ" = "ふ、普段着なのです！#n今の私は、救護騎士団の団長ではなく……。"
"1601603-45-ミネ" = "……っ！"
"1601603-46-ミネ" = "これでは、私がいつもアイドル衣装を着ていると思われて……。"
"1601603-47-ミネ" = "誤解です、先生！"
"1601603-48-ミネ" = "……今、何か言いましたか？"
"1601603-49-ミネ" = "大丈夫、とは……？"
"1601603-50" = "[s11] \"ミネが可愛いものを好きなのは知ってるよ。\"\n[s12] \"自分の好きな格好をするのに、理由はいらないよ。\""
"1601603-51-ミネ" = "そ、そうでした……。"
"1601603-52-ミネ" = "先生には、お伝えしておりましたね。"
"1601603-53-ミネ" = "……先生？"
"1601603-54-ミネ" = "お、お待ちください。"
"1601603-55-ミネ" = "もしかして……。"
"1601603-56-ミネ" = "レストランで会った時から、気づいていたのですか？"
"1601603-57-ミネ" = "……なるほど。"
"1601603-58-ミネ" = "先生……。"
"1601603-59" = "[ns13] \"……ミネさん！？\"\n[ns14] \"ち、近くない……？\""
"1601603-60-ミネ" = "私の気持ちが分かっていたのなら……。"
"1601603-61-ミネ" = "……もっと、早く言ってください。"
