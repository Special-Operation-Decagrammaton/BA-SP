[translation]
"1008215-1" = "青春の白いリボン"
"1008215-2" = "（待ち合わせの時間ピッタリに到着した）"
"1008215-3-レンゲ" = "お、アタシも今ついたとこだよ！"
"1008215-4-レンゲ" = "さすが師匠だ！"
"1008215-5-レンゲ" = "それじゃあ今日は、ここをゆっくり見て回ろっか。"
"1008215-6-レンゲ" = "おっ、あれいいなあ。"
"1008215-7-レンゲ" = "ほら、あのひょっとこのお面……。"
"1008215-8-レンゲ" = "……師匠がつけたら面白そう。"
"1008215-9-レンゲ" = "あははっ！変な顔！"
"1008215-10-レンゲ" = "ついでにこの風呂敷を頭に巻いたら――"
"1008215-11-レンゲ" = "あはははっ！最高……！"
"1008215-12-レンゲ" = "すみません、これくださいー！"
"1008215-13-商店の主人" = "まいど！カップル割はないんだけど、巾着袋おまけしとくよ！"
"1008215-14-レンゲ" = "か、カップル！？いやアタシたちは……。"
"1008215-15" = "[s1] \"師匠と弟子の――\"\n[s2] \"禁断のカップル……か。なるほどね。\""
"1008215-16-レンゲ" = "いや先生もつっこんでよ！？"
"1008215-17-レンゲ" = "というか、そのお面被っていうセリフじゃなくない！？"
"1008215-18" = "[s3] \"ふふふ。レンゲは欲しいものある？\"\n[s4] \"せっかくだし、私もプレゼントしたいんだ……。\""
"1008215-19-レンゲ" = "わ、わかったから、その変な笑い方はやめてくれ！"
"1008215-20-商店の主人" = "なんだか微笑ましいですね……。"
"1008215-21-商店の主人" = "ああ、これが青春……！"
"1008215-22" = "[ns] \"そういえば……。\""
"1008215-23" = "[ns5] \"レンゲって白いリボンがお気に入りみたいだけど。\"\n[ns6] \"他の色も着けたりするの？\""
"1008215-24-レンゲ" = "リボン……？"
"1008215-25-レンゲ" = "あぁ、これか。"
"1008215-26" = "[s] \"なにか青春のこだわりがあるのかなって。\""
"1008215-27-レンゲ" = "うーん、こだわりというほどじゃないんだけど……。"
"1008215-28-レンゲ" = "……師弟関係だからな。この際秘密はなしだ！"
"1008215-29-レンゲ" = "アタシが好きな青春小説の主人公が――"
"1008215-30-レンゲ" = "こういう白いリボンをしてたんだ。"
"1008215-31-レンゲ" = "一見ただのリボンなんだけど、主人公にとっては特別で……。"
"1008215-32-レンゲ" = "彼女の青春に深く結びついているんだ。"
"1008215-33-レンゲ" = "それが、読んでていいな……って思ったから、アタシも真似をしてみたんだ。"
"1008215-34" = "[s] \"じゃあ、同じデザインのリボンをプレゼントするよ！\""
"1008215-35-商店の主人" = "そういうことでしたら……。"
"1008215-36-商店の主人" = "こちらなどいかがでしょうか！"
"1008215-37-レンゲ" = "聞いてたのかよ！"
"1008215-38" = "[ns] \"よし、決めた！\""
"1008215-39-レンゲ" = "でも、本当にいいのかな……。"
"1008215-40-レンゲ" = "これを師匠から受け取ったらその……。"
"1008215-41" = "[s] \"別のデザインがよかった？\""
"1008215-42-レンゲ" = "ち、違う！もらうのはめちゃくちゃ嬉しいんだけど……！"
"1008215-43-レンゲ" = "そ、その……。"
"1008215-44-商店の主人" = "でしたら、ぜひ受け取ってあげてください……！"
"1008215-45-レンゲ" = "あーーーもうっ！"
"1008215-46-レンゲ" = "わかった。あ、ありがとう先生……大事にする……。"
"1008215-47" = "[s] \"小説の主人公くらい？\""
"1008215-48-レンゲ" = "……！この話はもう終わり！"
"1008215-49-レンゲ" = "さ、さあて……買い物も楽しんだし、きょ、今日の青春活動はここまでにしよっか！"
"1008215-50-レンゲ" = "り、リボンありがとう！じゃ、また！"
"1008215-51" = "[ns] \"……行ってしまった。\""
"1008215-52-商店の主人" = "あの子が話していた青春小説の内容……。"
"1008215-53-商店の主人" = "ご存じなさそうですね。"
"1008215-54-商店の主人" = "店頭に立ってると、よくこんな場面に出くわしますよ。ははは。"
"1008215-55-商店の主人" = "実はですね、あの白いリボン……。"
"1008215-56" = "（商店の主人から、リボンの意味について教えてもらった）"
"1008215-57-レンゲ" = "どうしよう……。"
"1008215-58-レンゲ" = "もらっちゃった……。"
"1008215-59-レンゲ" = "主人公が――"
"1008215-60-レンゲ" = "恋人から初めてもらったリボン……！"
"1008215-61-レンゲ" = "まさか、こんなことになるなんて……。"
"1008215-62-レンゲ" = "師匠、あの小説読んでたりするのかな……？"
"1008215-63-レンゲ" = "それともただのいたずら？"
"1008215-64-レンゲ" = "でも、もし……。"
"1008215-65-レンゲ" = "あーもうっ！何でこんなことに……！"
"1008215-66" = "[ns] \"レンゲ、入ってもいいかな？\""
"1008215-67-レンゲ" = "！？い、いいけど……。"
"1008215-68" = "[ns] \"ここにいると思った。\""
"1008215-69-レンゲ" = "な、何か気になることでもあったか……？"
"1008215-70" = "[s] \"あのリボン、小説の展開だとあの後……。\""
"1008215-71-レンゲ" = "師匠！？"
"1008215-72-レンゲ" = "やっぱり、知ってたのか？"
"1008215-73" = "[s7] \"おっと……何のことかな？\"\n[s8] \"私は何も聞いてないよ。ふふふ。\""
"1008215-74-レンゲ" = "絶対嘘だ！"
"1008215-75" = "[s] \"……でも、小説のシーンを再現するのも、青春活動かなって。\""
"1008215-76-レンゲ" = "……！！"
"1008215-77-レンゲ" = "た、確かに……！"
"1008215-78-レンゲ" = "う、ううっ！い、嫌じゃないけど……！"
"1008215-79-レンゲ" = "じゃ、じゃあ……リボン、つけてもらおうかな。"
"1008215-80-レンゲ" = "でも、これ以上からかうのは禁止だからね……！"
"1008215-81" = "（その後、レンゲにリボンをつけ、二人だけの青春を楽しんだ）"
