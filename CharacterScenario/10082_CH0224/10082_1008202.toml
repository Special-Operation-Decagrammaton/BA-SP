[translation]
"1008202-1" = "青春の師匠"
"1008202-2" = "（レンゲの話を聞くために調停室を訪れた）"
"1008202-3-レンゲ" = "はっ！"
"1008202-4-レンゲ" = "はあっ！"
"1008202-5-レンゲ" = "もう一回！"
"1008202-6-レンゲ" = "はっ！"
"1008202-7-レンゲ" = "トドメだっ！"
"1008202-8-レンゲ" = "はあぁぁっ！！！"
"1008202-9" = "[ns] \"何か別の混じってなかった！？\""
"1008202-10-レンゲ" = "おっ、先生。"
"1008202-11-レンゲ" = "え？今の？"
"1008202-12-レンゲ" = "これは百花繚乱に代々受け継がれてきた射撃術で……うーん、こうして、こう……みたいな？"
"1008202-13" = "[s1] \"な、なるほど……今のが朝練？\"\n[s2] \"これが百花繚乱の朝練なんだ。\""
"1008202-14-レンゲ" = "ああ、そうだよ。"
"1008202-15-レンゲ" = "アタシたち百花繚乱紛争調停委員会は、百鬼夜行で色々担ってるからね。"
"1008202-16-レンゲ" = "有事に備えてのトレーニングはもちろん……"
"1008202-17-レンゲ" = "さっきみたいな射撃訓練も欠かせないんだ。"
"1008202-18-レンゲ" = "ふっ、今日のアタシは百発百中！#nいつも以上に絶好調だ！"
"1008202-19" = "[s3] \"なるほど……！\"\n[s4] \"さすが……！\"\n[s5] \"百花繚乱の切り込み隊長！！\""
"1008202-20-レンゲ" = "！？"
"1008202-21-レンゲ" = "そ、そんな褒めても何も出ないけどな！"
"1008202-22-レンゲ" = "これくらい、百花繚乱じゃ普通だし？"
"1008202-23-レンゲ" = "ま、まぁ先生が褒めてくれるのは嬉しいけど……へへっ。"
"1008202-24-レンゲ" = "………………じゃなくて。"
"1008202-25-レンゲ" = "ご、ごほん……それより、ええっと……"
"1008202-26-レンゲ" = "結構来るの早かったね？"
"1008202-27" = "[s] \"うん、連絡をもらってすぐに来たから。\""
"1008202-28-レンゲ" = "そっか、気を遣わせて悪かったね。"
"1008202-29-レンゲ" = "すぐ来てくれたのは、めちゃくちゃ嬉しいけど……"
"1008202-30-レンゲ" = "その……こんなに早く来るとは思ってなくて、アタシとしては想定外というか……"
"1008202-31-レンゲ" = "準備が、まだ……その……"
"1008202-32" = "[ns] \"ところで、相談って？\""
"1008202-33-レンゲ" = "わ、わわわっ！"
"1008202-34" = "[s] \"レンゲ、どうしたの？\""
"1008202-35-レンゲ" = "ままま待って！たんま！たんまっ！"
"1008202-36-レンゲ" = "それ以上はちょっと近づかないでほしいというか！"
"1008202-37" = "[s] \"私、何かしたかな……？\""
"1008202-38-レンゲ" = "いやいやいや、そうじゃなくて！"
"1008202-39-レンゲ" = "さっきまで朝練をしてたから、その……"
"1008202-40-レンゲ" = "そんなに近くまで来られると……その……"
"1008202-41-レンゲ" = "色々と……！！アタシが気にするの！！"
"1008202-42" = "[s] \"ご、ごめん。デリカシーが無かったね。\""
"1008202-43-レンゲ" = "そういう事だから！ちょっと待っててくれ、先生。"
"1008202-44-レンゲ" = "大丈夫、まだ大丈夫……！"
"1008202-45" = "[ns] \"どうして急に反復横跳びを……？\""
"1008202-46-レンゲ" = "こうすれば、多少は……気にならないと言うか……！"
"1008202-47" = "いっち！にっ！いち、にっ！"
"1008202-48-レンゲ" = "いっち！にっ！いち、にっ！"
"1008202-49-レンゲ" = "あと100回……！いける……！"
"1008202-50" = "[s] \"むしろ逆効果じゃないかな！？\""
"1008202-51" = "（レンゲの気が済むまで待っていると……）"
"1008202-52-レンゲ" = "ふぅ……よし、これで大丈夫だと思う。"
"1008202-53" = "[s] \"すごい気合いだったね……\""
"1008202-54-レンゲ" = "そこは気にしないでもらえると！"
"1008202-55-レンゲ" = "それで、話なんだけど……"
"1008202-56-レンゲ" = "うーん………"
"1008202-57-レンゲ" = "いざ面と向かって話そうと思ったら、その……"
"1008202-58" = "[s] \"話そうと思ったら……？\""
"1008202-59-レンゲ" = "いや、その……なんて言うか……"
"1008202-60-レンゲ" = "ああもう！ダメだ！#nモモトークなら言えるのに！"
"1008202-61-レンゲ" = "でも……！"
"1008202-62-レンゲ" = "このまま考え込んでいても仕方ない！決めた！"
"1008202-63-レンゲ" = "先生！こっち来てくれ！"
"1008202-64-レンゲ" = "その、先生を呼んだ理由は……"
"1008202-65" = "[s] \"うん、相談に乗ってほしいって言ってたね。\""
"1008202-66-レンゲ" = "……！そ、そう！相談があって……"
"1008202-67-レンゲ" = "アタシ、気づいたんだ。#n何もしてなくても、時計の針は刻一刻と進み続ける……"
"1008202-68-レンゲ" = "要するに……"
"1008202-69-レンゲ" = "このままじゃアタシの青春、なにもないまま終わっちゃうんじゃないかって！"
"1008202-70-レンゲ" = "だから先生！手伝って！"
"1008202-71" = "[ns] \"……………………はい？\""
"1008202-72-レンゲ" = "あー、やっぱり伝わりにくいかな？"
"1008202-73-レンゲ" = "……そうだな。"
"1008202-74-レンゲ" = "将来、アタシが過去を振り返るようになったときにさ……"
"1008202-75-レンゲ" = "百鬼夜行時代を振り返っては「百花繚乱にいたから一瞬じゃった……ああ、アタシの青春は[ruby=いずこ]何処[/ruby]……」"
"1008202-76-レンゲ" = "……って、きっと何度も後悔するんだよ。#nそんな人生、嫌なんだ！"
"1008202-77-レンゲ" = "だから、いつ振り返ってもいいように――"
"1008202-78-レンゲ" = "――アタシは最高の青春を過ごしたいんだ！"
"1008202-79-レンゲ" = "それこそ、アタシが生きる意味なんだよ！"
"1008202-80" = "[ns6] \"ご、ごめん、レンゲ……\"\n[ns7] \"話が飛躍しすぎて……\"\n[ns8] \"ちょっと……\""
"1008202-81" = "（その後も、レンゲの話は続き……）"
"1008202-82-レンゲ" = "つまり、手遅れになる前に「青春活動」がしたいんだ！"
"1008202-83-レンゲ" = "だから先生！手伝ってほしい！"
"1008202-84" = "[s9] \"レンゲは今……\"\n[s10] \"百花繚乱として活動してるよね？\""
"1008202-85" = "[ns] \"それも十分、青春だと思うんだけど……\""
"1008202-86-レンゲ" = "先生、それは違うと思うんだ……"
"1008202-87-レンゲ" = "百花繚乱では、毎日グラウンドを走ったり、兵法の勉強をしたり、射撃の練習をしたり……"
"1008202-88-レンゲ" = "問題児が暴れていないか見回って、事件が起きたならみんなで戦う……"
"1008202-89-レンゲ" = "どこに青春の要素があるっていうんだ？"
"1008202-90-レンゲ" = "こんなの、ただの「日常」だよ。"
"1008202-91" = "[s] \"そ、そうかな……？\""
"1008202-92-レンゲ" = "そもそも青春ってのは、もっとこう……キラキラして甘酸っぱくて……"
"1008202-93-レンゲ" = "そう、まさに「恋よ鯉」の作品に出てくるような！"
"1008202-94" = "[s] \"えっと、例えば……？\""
"1008202-95-レンゲ" = "例えば……"
"1008202-96-レンゲ" = "胸がときめく出会いと……切ない別れ。"
"1008202-97-レンゲ" = "ある日、親しい友人が隠していた過去を打ち明けるような、胸が高鳴る展開。"
"1008202-98-レンゲ" = "まさか、彼女が前世でも仲間だったなんて……！"
"1008202-99-レンゲ" = "こんな感じで、もっとこう破天荒な……ドキドキする体験をした方がお得だと思うんだ！"
"1008202-100-レンゲ" = "後で思い返して笑えるような……そんな日々を過ごしたいんだ！"
"1008202-101" = "[s] \"たしかに、その気持ちは分かるけど！\""
"1008202-102-レンゲ" = "ま、アタシもそこまでドラマチックな青春を求めてるわけじゃない。"
"1008202-103-レンゲ" = "ただ、その……このままじゃ鍛錬ばかりで青春が終わっちゃう気がして……それがすごく残念で……"
"1008202-104-レンゲ" = "だから先生……手伝ってくれないか？"
"1008202-105" = "[s] \"レンゲの話を完全には理解できてないけど……\""
"1008202-106" = "[ns] \"それでも良ければ、手伝わせてほしい。\""
"1008202-107-レンゲ" = "ほ、本当に……？"
"1008202-108-レンゲ" = "へへっ！ありがとう！先生！"
"1008202-109-レンゲ" = "じゃあ、これでアタシたちは「青春師弟」だ！"
"1008202-110" = "[s] \"青春、師弟……？\""
"1008202-111-レンゲ" = "そうと決まれば、先生と呼ぶのは違うか……？"
"1008202-112-レンゲ" = "青春師弟に[ruby=ふさわ]相応[/ruby]しい、もっと威厳のある呼び方……"
"1008202-113-レンゲ" = "――師匠。"
"1008202-114" = "[s] \"……師匠？\""
"1008202-115-レンゲ" = "ああ、ピッタリだな！"
"1008202-116-レンゲ" = "これから青春活動中は、師匠と呼ぼう！"
"1008202-117-レンゲ" = "不甲斐ない弟子かもしれないが、よろしく頼む！師匠！"
"1008202-118-レンゲ" = "よし、握手だ！"
"1008202-119" = "[s] \"あ、うん。よろしくね。\""
"1008202-120-レンゲ" = "へへっ！"
"1008202-121" = "（こうして、レンゲとの青春活動が始まった）"
