[translation]
"1008203-1" = "青春の定番：転校生"
"1008203-2" = "[ns] \"青春活動って……具体的に何をすればいいの？\""
"1008203-3-レンゲ" = "うむ、いい質問だ。"
"1008203-4-レンゲ" = "突然「青春活動」と言われても、何をすればいいのか分からないと思う。"
"1008203-5-レンゲ" = "特にアタシたちのような「青春初心者」には、全てが手探り……簡単には答えが出せない。"
"1008203-6-レンゲ" = "ま、そもそも「青春活動」が曖昧だから仕方ないんだけど……"
"1008203-7" = "[s1] \"青春活動に初心者とかあるんだ……\"\n[s2] \"うーん、そんなに難しく考えるものかな？\""
"1008203-8-レンゲ" = "いやいや……青春活動を甘く見ないでよね？"
"1008203-9-レンゲ" = "まともな青春活動をしてこなかったアタシたちのような初心者が、何も準備しないで飛び込んだら……"
"1008203-10" = "[s] \"……飛び込んだら？\""
"1008203-11-レンゲ" = "急激なショックを受けて……"
"1008203-12-レンゲ" = "「急性セイシュニウムアレルギーショック」で大変なことになるかもしれない！"
"1008203-13" = "[ns] \"青春活動の話だよね！？\""
"1008203-14-レンゲ" = "もちろん……？#nそれだけ危険だという話だよ。"
"1008203-15-レンゲ" = "こういうところは、運動と似ているかも。#n準備運動をしっかりしないと怪我しやすくなるのと同じ。"
"1008203-16-レンゲ" = "……まあ、安心して。"
"1008203-17-レンゲ" = "この日のために、日頃から「青春活動」の計画を立ててきたから。"
"1008203-18" = "[s] \"そ、そこまでしてたんだ……\""
"1008203-19-レンゲ" = "そ、それは！"
"1008203-20-レンゲ" = "ずっと夢だったから仕方ないだろ！"
"1008203-21-レンゲ" = "とにかく！青春について調べていたら、ひとつ気づいたことがあるんだ。"
"1008203-22-レンゲ" = "青春とは、まず関係性が重要なんだと。"
"1008203-23" = "[s] \"うーん、例えば……？\""
"1008203-24-レンゲ" = "例えば……世間でいうライバル関係。"
"1008203-25-レンゲ" = "お互い切磋琢磨し、喧嘩をしては仲直りをし、再び肩を並べて前に進む関係。"
"1008203-26-レンゲ" = "その過程で友情が深まる様子は……"
"1008203-27-レンゲ" = "まさに青春！！！"
"1008203-28" = "[s] \"分かるような、分からないような……\""
"1008203-29-レンゲ" = "もちろん、ライバル関係だけじゃないよ！"
"1008203-30-レンゲ" = "世の中には色んな関係性があって、その数だけ「青春活動」がある。"
"1008203-31-レンゲ" = "というわけで、記念すべき「第一回青春活動」でアタシが用意してきた関係性は……"
"1008203-32-レンゲ" = "「転校生」だ！"
"1008203-33" = "[ns] \"転校……生？\""
"1008203-34-レンゲ" = "さあ、せんせ……"
"1008203-35-レンゲ" = "いや、師匠！師匠には今から転校生になってほしい！"
"1008203-36" = "（転校生といえば、まずはこれ！と言うレンゲに連れられて……）"
"1008203-37" = "（調停室近くの路地まで来た）"
"1008203-38" = "[ns] \"レンゲ、ここに転校生と何の関係が……\""
"1008203-39-レンゲ" = "アタシ、この前も言ったな？"
"1008203-40-レンゲ" = "青春活動とは……要するに「恋よ鯉」の作品みたいなものだって。"
"1008203-41-レンゲ" = "師匠も知っての通り、「恋よ鯉」のデビュー作は主人公の転校生とヒロインがドタバタ劇を繰り広げる青春小説なんだけど……"
"1008203-42" = "[s3] \"あ、うん。そうだったね。\"\n[s4] \"……そうだったかな？\""
"1008203-43-レンゲ" = "突然やって来た謎の転校生と出会い、何が起こるか分からない毎日にときめくヒロイン！"
"1008203-44-レンゲ" = "そこで今日の青春活動は、それをなぞってみようと思う！"
"1008203-45-レンゲ" = "題して「転校生青春活動」だ！"
"1008203-46" = "[s] \"作品と同じ体験をしてみようってこと？\""
"1008203-47-レンゲ" = "その通り！"
"1008203-48-レンゲ" = "アタシの考えを一瞬で見抜くとは！さすが師匠！"
"1008203-49-レンゲ" = "ほら、これも忘れずに持ってきた。"
"1008203-50" = "[ns] \"これは、食パン……？まさか……\""
"1008203-51-レンゲ" = "よし、それじゃあ師匠はここにいてくれ！#n合図をしたら行くよ！"
"1008203-52" = "[ns] \"ちょ、待っ……レンゲ！？\""
"1008203-53-レンゲ" = "ふぅ、この辺りで良いかな。"
"1008203-54-レンゲ" = "食パンをこうして……軽くストレッチもして……"
"1008203-55-レンゲ" = "心地よい日差しに過ごしやすい風…… "
"1008203-56-レンゲ" = "風のささやきが聞こえる……今こそ「青春活動」の時間だと！"
"1008203-57-レンゲ" = "転校生といえば欠かせない、最初のエピソード……！"
"1008203-58-レンゲ" = "「転校初日から遅刻しそうになり、食パンを咥えたまま走って曲がり角であの子と衝突！」イベント開始！"
"1008203-59" = "（レンゲが合図と共に走り出した）"
"1008203-60-レンゲ" = "さあ！食パンを咥えて！全力で！走る！"
"1008203-61-レンゲ" = "ここであのセリフを……！"
"1008203-62-レンゲ" = "「いけない！ちこくちこく～！」"
"1008203-63-レンゲ" = "ふふっ！覚悟はできてるか……！師匠！"
"1008203-64" = "[ns] \"レンゲが凄まじい勢いでこっちに……このままだと！\""
"1008203-65-レンゲ" = "はああっ！"
"1008203-66" = "（そうして、衝突する寸前で……）"
"1008203-67" = "[ns] \"き、緊急回避っっ！\""
"1008203-68-レンゲ" = "師匠！どうして避けるんだ！？"
"1008203-69-レンゲ" = "ここで転校生とぶつかって、教室で「あっ！」ってならないといけないのに！"
"1008203-70" = "[s5] \"あの勢いで衝突したら……\"\n[s6] \"残るのは印象じゃなくて怪我じゃないかな！？\""
"1008203-71-レンゲ" = "う～ん……そ、そうかな？"
"1008203-72" = "[s] \"危ないから中止！\""
"1008203-73-レンゲ" = "まあ、師匠がそう言うなら……"
"1008203-74-レンゲ" = "師匠の教えに従うよ！"
"1008203-75-レンゲ" = "よし、次に行こう！"
"1008203-76" = "（その後もレンゲの「転校生」エピソードは続いた）"
"1008203-77-レンゲ" = "食パンイベントの次は、いよいよアレだ。"
"1008203-78-レンゲ" = "朝のホームルームで……"
"1008203-79" = "[ns] \"初めまして、転校してきた……\""
"1008203-80-レンゲ" = "……あんたは！さっき曲がり角でぶつか……りはしなかったけど、あの時の！"
"1008203-81-レンゲ" = "朝は見逃してやったけど、今度はタダじゃおかないからな！"
"1008203-82" = "[s] \"それ、何かと混ざってない！？\""
"1008203-83-レンゲ" = "そして隣の席になった二人には……"
"1008203-84-レンゲ" = "また次のイベントが待っている。"
"1008203-85-レンゲ" = "なんだ、"
"1008203-86-レンゲ" = "転校初日で教科書が無いの？"
"1008203-87-レンゲ" = "ふ……ふん！それなら仕方ないな！"
"1008203-88-レンゲ" = "ほら、机をくっつけて。"
"1008203-89-レンゲ" = "き、今日だけアタシの教科書を見せてやる。#n今日だけだからな！"
"1008203-90-レンゲ" = "ちなみに、この線よりこっちに来たら……"
"1008203-91-レンゲ" = "全力で机を叩き割ってやる。その覚悟でいるんだな。"
"1008203-92" = "[s] \"普通はもっとこう、優しく接するんじゃない！？\""
"1008203-93-レンゲ" = "え？そ、そうなの？#n経験が無いから、分からなくて……"
"1008203-94-レンゲ" = "でも……実際、会ったばかりの転校生とそこまで距離が近いのはどうなんだ？"
"1008203-95-レンゲ" = "あんまり距離が近いとちょっとこう……イライラするというか……"
"1008203-96" = "[s] \"レンゲらしいとは思うけどね！？\""
"1008203-97" = "（そうして様々な転校生エピソードを一つひとつ試していると……）"
"1008203-98" = "（いつの間にか、夕方になっていた）"
"1008203-99" = "[ns7] \"もうこんな時間だけど……\"\n[ns8] \"今日の青春活動はどうだった？\""
"1008203-100-レンゲ" = "うーん、正直に言うと……"
"1008203-101-レンゲ" = "微妙、だったような。"
"1008203-102-レンゲ" = "ち、違う！師匠に文句があるわけじゃない！"
"1008203-103-レンゲ" = "ただ……今日の活動は……アタシが夢に見ていたのとは微妙に違って……"
"1008203-104-レンゲ" = "実際にやってみると、どこか物足りなくてな。"
"1008203-105-レンゲ" = "なんて言えばいいんだ……"
"1008203-106-レンゲ" = "自分でも何をしたかったのか……よく、分からなくなってきた。"
"1008203-107" = "[s] \"そっか……\""
"1008203-108-レンゲ" = "色々と協力してもらったのに、中途半端な結果になっちまったな。"
"1008203-109-レンゲ" = "もっと、アタシがしっかりしてれば……"
"1008203-110-レンゲ" = "ごめん、師匠。全部アタシのせいだ。"
"1008203-111-レンゲ" = "……よし、切り替えよう！もうこんな時間だしな。"
"1008203-112-レンゲ" = "残念だけど、今日はこれで解散して……"
"1008203-113" = "[s] \"転校生なら、帰り道が分からないんじゃない？\""
"1008203-114-レンゲ" = "……？"
"1008203-115" = "[s] \"だから、一緒に帰るのはどうかな？\""
"1008203-116-レンゲ" = "あ……"
"1008203-117-レンゲ" = "引っ越してきたばかりの、知らない土地で……"
"1008203-118-レンゲ" = "遊ぶ場所はどこにあるのか。#n本屋、映画館、バス停……"
"1008203-119-レンゲ" = "転校生は知らないよな……"
"1008203-120" = "[s] \"それを教えてあげたら喜んでくれるんじゃない？\""
"1008203-121-レンゲ" = "……そう、だ。"
"1008203-122-レンゲ" = "先生の言う通りだな！"
"1008203-123-レンゲ" = "さすが師匠……いや、青春師匠！"
"1008203-124-レンゲ" = "そうと決まったら！行こう！まだ時間は大丈夫？"
"1008203-125-レンゲ" = "アタシの行きつけのバッティングセンターとか……ゲームセンターとか！"
"1008203-126-レンゲ" = "あ！この近くに季節限定メニューがめちゃくちゃ美味しい定食屋さんがあって……！"
"1008203-127" = "（そうして元気を取り戻したレンゲと一緒に、しばらく街を歩いて回った）"
