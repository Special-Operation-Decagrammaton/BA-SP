[translation]
"2004106-1" = "秘密の場所"
"2004106-2" = "（向かう途中、リオとの通話を思い返してみた）"
"2004106-3-リオ" = "繰り返しになるのだけれど、私のアジトは複数の場所にあって――"
"2004106-4-リオ" = "今回は、その中のひとつに貴方を招待したいの。"
"2004106-5-リオ" = "……二人だけの秘密の場所、とも言えるかしら。"
"2004106-6-リオ" = "セキュリティ上の問題はないから、心配は不要よ。"
"2004106-7-リオ" = "もし、この場所が特定されたら……。"
"2004106-8-リオ" = "それは貴方が誰かに口外したことを意味するわ。"
"2004106-9-リオ" = "……その時は、相応の賠償を請求することになるわね。"
"2004106-10-リオ" = "でも、貴方を信じているわ。"
"2004106-11" = "[s] \"その信頼に応えてみせるよ！\""
"2004106-12-リオ" = "では、また後ほど会いましょう。"
"2004106-13-リオ" = "楽しみにしているわ。"
"2004106-14" = "（リオが教えてくれた番号に電話をかけた）"
"2004106-15-リオ" = "……えっ。せ、先生！？#n"
"2004106-16-リオ" = "もう時間なの！？#nずっとカーテンを閉めていたから……！"
"2004106-17-リオ" = "ど、どうすれば……。"
"2004106-18" = "[s] \"リオ、何かあったの！？\""
"2004106-19-リオ" = "な、何でもないわ！"
"2004106-20" = "（リオの身が心配で、アジトまで走って向かった！）"
"2004106-21" = "[ns] \"リオ！\""
"2004106-22-リオ" = "せ、先生！？#nこんなに早く……。"
"2004106-23-リオ" = "いえ、約束の時間で間違いないのだけれど……。"
"2004106-24" = "[ns1] \"ごめん……。\"\n[ns2] \"……まだ掃除中だったんだね。\""
"2004106-25-リオ" = "うぅ……。"
"2004106-26" = "[ns] \"これ、コンビニ弁当の容器？\""
"2004106-27-リオ" = "……ええ。"
"2004106-28-リオ" = "そうね……隣はお茶とジュースのペットボトルよ。"
"2004106-29-リオ" = "ち、違うの！それはゴミじゃないわ！#n実験装置と試薬で、それは工具……！"
"2004106-30-リオ" = "……。"
"2004106-31-リオ" = "……恥ずかしい姿を見せたわね。"
"2004106-32-リオ" = "自分一人で、ちゃんと片付けられると思っていたのだけれど……。"
"2004106-33" = "[s] \"前はどうしてたの？\""
"2004106-34-リオ" = "……トキが。"
"2004106-35" = "[s] \"そうだったんだ……でも、大丈夫だよ。\""
"2004106-36-リオ" = "片付けも、学習すればできるようになる……？"
"2004106-37-リオ" = "貴方も苦手だったの？"
"2004106-38-リオ" = "そ、そう……。"
"2004106-39-リオ" = "……先生、どこに行くのかしら。"
"2004106-40" = "[s] \"ゴミ袋を買ってくるね。\""
"2004106-41-リオ" = "わ、分かったわ……。"
"2004106-42-リオ" = "本当に、片付いたわね……。"
"2004106-43-リオ" = "……これでまだ半分！？"
"2004106-44-リオ" = "掃除の概念が違う気がするのだけれど……。"
"2004106-45-リオ" = "何を手伝えば良いのかしら？"
"2004106-46-リオ" = "休んでいれば大丈夫、と言われても……。"
"2004106-47-リオ" = "私だけ休むわけにはいかないわ。"
"2004106-48" = "[wa:1780]― [log=리오]こういう事をさせるために、[wa:1540]貴方を呼んだわけじゃ、[/log]"
"2004106-49" = "[wa:1630]― [log=리오]ないのだけれど……[/log]"
"2004106-50" = "― [log=리오]自分でやるわ。[wa:1420]先生は座っていてちょうだい。[/log]"
"2004106-51" = "[wa:950]― [log=리오]あ、[wa:830]貴方はもう少し、[wa:1390]先生としての自覚を持ちなさい。[/log]"
"2004106-52" = "― [log=리오]こんなことで[wa:360]時間を浪費するなんて[wa:1440]非合理的よ。[/log]"
"2004106-53" = "― [log=리오]他にもっと[wa:440]重要な仕事があるでしょう？[/log]"
"2004106-54" = "[ns3] \"生徒の生活を守ることも、大事な仕事だよ。\"\n[ns4] \"今の私の仕事は、リオの「お世話」だからね。\""
"2004106-55" = "[wa:570]― [log=리오]ッ……！[wa:770]な、[wa:960]なにを……[/log]"
"2004106-56" = "― [log=리오]私の[wa:1300]「お世話」……！？[/log]"
"2004106-57" = "[wa:1120]― [log=리오]り……[wa:590]理解に苦しむわ……[wa:1900]でも……[/log]"
"2004106-58" = "― [log=리오]……貴方は、[wa:2330]そういう人だったわね。[/log]"
"2004106-59" = "[wa:2120]― [log=리오]……分かったわ。[/log]"
"2004106-60" = "― [log=리오]最後まで受け止めましょう。[/log]"
"2004106-61" = "― [log=리오]貴方がする……[wa:1930]「お世話」とやらを。[/log]"
"2004106-62-リオ" = "……これが「掃除」。"
"2004106-63-リオ" = "本物の綺麗好きからしたら、まだ完璧とは言えない、と？"
"2004106-64-リオ" = "たしかに、そもそも山積みのゴミ袋が残っているわね。"
"2004106-65-リオ" = "……トキはたしかに、ちゃんと捨ててくれていたわね。"
"2004106-66-リオ" = "貴方も、こんな片付いた部屋で過ごしてるのね。"
"2004106-67-リオ" = "一般的な感覚で言うと……。"
"2004106-68-リオ" = "これが普通なのかしら？"
"2004106-69" = "[s5] \"……あれ？\"\n[s6] （かなり頑張ったんだけど……）"
"2004106-70-リオ" = "もしかして、また何か言ってしまったかしら……。"
"2004106-71-リオ" = "気にする必要はないって、それはどういう……？"
"2004106-72-リオ" = "ど、どうして急に頭を？"
"2004106-73-リオ" = "……。"
"2004106-74-リオ" = "もう少し、このまま……。"
"2004106-75" = "[ns] \"よし、何か食べにいこう。\""
"2004106-76-リオ" = "たしかに食事の時間ではあるのだけれど、まだお腹は……。"
"2004106-77-リオ" = "……ああ、そうね。#nアジトの片付けをしてくれたのだから、貴方は空腹になって当然だわ。"
"2004106-78-リオ" = "気づけなくてごめんなさい。"
"2004106-79-リオ" = "けれど、外に出かけるのは……。"
"2004106-80" = "[s7] \"ここは旧都心だし……。\"\n[s8] \"ミレニアムから離れてるから大丈夫だよ、きっと。\""
"2004106-81-リオ" = "……ええ、先生が言うのなら信じましょう。"
"2004106-82-リオ" = "それと、あらためてお礼を……ありがとう、先生。"
"2004106-83-リオ" = "じゃあ――"
"2004106-84-リオ" = "きゃっ！？"
"2004106-85" = "（リオがゴミ袋の山につまづいて転んでしまった）"
"2004106-86" = "[ns] \"リオ！？\""
"2004106-87-リオ" = "……だ、大丈夫よ。#n貴方が咄嗟にかばってくれたおかげね。"
"2004106-88" = "[s] \"立てる？\""
"2004106-89-リオ" = "ええ、もちろん立てるわ……。"
"2004106-90-リオ" = "……。"
"2004106-91-リオ" = "その、先生……。"
"2004106-92-リオ" = "少し、もう少しだけ……。"
"2004106-93-リオ" = "このままでも、良いかしら？"
"2004106-94" = "[s] \"……良いよ？\""
"2004106-95-リオ" = "……ありがとう、先生。"
"2004106-96-リオ" = "……本当に、感謝するわ。"
"2004106-97" = "（なぜか、いつもよりぎこちないリオと夕飯を食べてから）"
"2004106-98" = "（シャーレに戻った）"
