[translation]
"1011206-1" = "探し物は"
"1011206-2" = "（急に連絡が途絶え心配になり、心当たりがある公園に向かった）"
"1011206-3" = "[ns] （もう大分暗いけど、まだいるかな……）"
"1011206-4" = "（あれは……）"
"1011206-5" = "[ns] \"アスナ、何してるの？\""
"1011206-6-アスナ" = "あ、せんせ～！"
"1011206-7-アスナ" = "どうしてここにいるって分かったの？"
"1011206-8" = "[s] \"返事がなかったから、探しに来たんだ。\""
"1011206-9" = "[ns] \"前みたいなことになってたら大変だから。\""
"1011206-10-アスナ" = "それなら大丈夫だよ！"
"1011206-11-アスナ" = "ほら、ちゃんと無事だし！"
"1011206-12" = "[s] \"安心したよ。\""
"1011206-13-アスナ" = "退屈だと、力が抜けちゃうんだと思う。"
"1011206-14-アスナ" = "あと、大好きな人に会えなかったりした時とか？"
"1011206-15-アスナ" = "充電式みたいだね、あははっ！"
"1011206-16" = "[s] \"最近は大丈夫なの？\""
"1011206-17-アスナ" = "うん、毎日楽しいからね！"
"1011206-18-アスナ" = "先生にもよく会うから、だからすごく元気だよ！"
"1011206-19" = "[s1] \"アスナが元気で良かったよ。\"\n[s2] \"それで、今は何をしてるの？\""
"1011206-20-アスナ" = "あ、そうだ！"
"1011206-21-アスナ" = "実はスマホを落としちゃって！"
"1011206-22" = "[s] \"全然大丈夫じゃなかったね！？\""
"1011206-23-アスナ" = "ほかのことに気を取られてたら、落としちゃってたみたい。"
"1011206-24-アスナ" = "だから返事ができなかったの。#nごめんね、先生。"
"1011206-25" = "[s] \"一緒に探そうか。\""
"1011206-26-アスナ" = "えへへっ、ありがとう！"
"1011206-27-アスナ" = "この辺りで落としたはずなんだけど、#n全然見つからなくってさ～。"
"1011206-28" = "[s3] \"来た道を戻りながら探してみよう。\"\n[s4] \"アスナのスマホに電話をかけてみるよ。\""
"1011206-29-アスナ" = "マナーモードにしてるけど、振動で分かるはず！"
"1011206-30" = "（アスナのスマホに電話をかけ続けながら、辺りを一緒に探した）"
"1011206-31" = "（しばらくして……）"
"1011206-32" = "[ns] \"今のは……？\""
"1011206-33-アスナ" = "先生も聞こえた？#n近くにあるみたい！"
"1011206-34-アスナ" = "あっちだよ！"
"1011206-35-アスナ" = "先生、見つけたよ！"
"1011206-36-アスナ" = "あははっ、さっき座ってたベンチに置き忘れてたみたい。"
"1011206-37-アスナ" = "最初に探しておけば良かったね！"
"1011206-38" = "[s5] \"こういう時もあるよ。\"\n[s6] \"見つかって良かったね、アスナ。\""
"1011206-39-アスナ" = "うん！#n先生のおかげだよ！"
"1011206-40-アスナ" = "ありがとう、先生。#nいつもアスナのこと助けてくれて！"
"1011206-41-アスナ" = "あっ、見て！"
"1011206-42" = "[s7] \"着信履歴がすごい……。\"\n[s8] \"ずっとかけてたからね……\""
"1011206-43-アスナ" = "あははっ、14件も！#nC&Cのみんなからも、こんなに来たことないのに～！"
"1011206-44-アスナ" = "ちょっと、嬉しいかも。"
"1011206-45-アスナ" = "先生に求められてるみたい、えへへ。"
"1011206-46-アスナ" = "私のこと、大切な存在だと思ってくれてるのかな？"
"1011206-47" = "[s] \"ま、間違ってはないけど……。\""
"1011206-48-アスナ" = "キュンキュンしちゃった！"
"1011206-49-アスナ" = "これ、スクショしとこ～！#nアスナの宝物！"
"1011206-50" = "（ご機嫌なアスナと一緒に、家へ帰った……）"
