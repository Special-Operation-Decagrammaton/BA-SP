[translation]
"1011202-1" = "バスの中で"
"1011202-2" = "（今日はミレニアムに直行しないといけない）"
"1011202-3" = "（この時間帯のバスは、かなり混雑してそうだ……）"
"1011202-4" = "[ns] \"うっ、人が多い……。\""
"1011202-5" = "（奥に移動していると……）"
"1011202-6-？？？" = "あれ～ご主人様？"
"1011202-7" = "[s] \"この声は……。\""
"1011202-8-アスナ" = "わぁ、本当にご主人様だ！"
"1011202-9" = "[s1] \"おはよう、アスナ。\"\n[s2] \"今日は制服なんだね！\""
"1011202-10-アスナ" = "うん、部活が休みだから！"
"1011202-11-アスナ" = "私の制服姿、新鮮でしょ？"
"1011202-12" = "[s] \"珍しいね。\""
"1011202-13-アスナ" = "えへへ、どうどう？#n似合ってる？"
"1011202-14-バス乗客" = "……ご主人様？"
"1011202-15-バス乗客" = "え、何あの人……こわ……"
"1011202-16" = "[ns3] \"う、うん。似合ってるけど、アスナ……！\"\n[ns4] \"ここで「ご主人様」は、ちょっと……。\""
"1011202-17-アスナ" = "あ、そっか。"
"1011202-18-アスナ" = "今はメイドじゃないもんね。"
"1011202-19-アスナ" = "じゃあ、先生って呼べば良い？"
"1011202-20-ミレニアムの生徒" = "せ、先生……？"
"1011202-21-バス乗客" = "まさか生徒に「ご主人様」と呼ばせているだなんて……。"
"1011202-22" = "[ns5] \"……。\"\n[ns6] （誤解が広がっていく……）"
"1011202-23-バス運転手" = "えー、お客様にお知らせです。"
"1011202-24-バス運転手" = "まもなく見えます連続ヘアピンは、ダイヤが押しているため限界速度で慣性ドリフトを行ないます。"
"1011202-25" = "[ns] \"はい？\""
"1011202-26-バス運転手" = "しっかりと手すりに掴まり、安全にご注意ください。"
"1011202-27-アスナ" = "あははっ。#n先生、掴まらないと危ないよ！"
"1011202-28" = "[ns] \"う、うわあぁぁっ！？\""
"1011202-29-バス乗客" = "ひぃぃっ！"
"1011202-30-アスナ" = "先生、大丈夫？"
"1011202-31" = "[s] \"何とか……。\""
"1011202-32-アスナ" = "あははっ、楽しかったね～！#nみんな右に左に行ったり来たり！"
"1011202-33-アスナ" = "ジェットコースターに乗った気分！"
"1011202-34" = "[s] \"バスでそんな気分になったらアウトだよね！？\""
"1011202-35" = "[ns] \"……。\""
"1011202-36" = "（車内で揉みくちゃになり、アスナとかなり密着してしまった）"
"1011202-37" = "[ns] \"アスナ……その、狭くない？大丈夫？\""
"1011202-38-アスナ" = "んー？"
"1011202-39-アスナ" = "狭くないよ～？"
"1011202-40-アスナ" = "えへへっ、こんなピッタリくっついて顔を見るのも久しぶりだね！"
"1011202-41" = "[s] \"さすがにこれは、いけないような……。\""
"1011202-42" = "[ns7] （体をもぞもぞ動かす）\n[ns8] \"ふんっ！\""
"1011202-43-アスナ" = "あははっ！"
"1011202-44-アスナ" = "何その顔、面白～い！"
"1011202-45" = "[s] \"色々と先生として頑張ってるんだよ……。\""
"1011202-46-アスナ" = "狭いから気を使ってくれたの？"
"1011202-47-アスナ" = "むしろ、先生に体重を預けられて楽ちんだよ？"
"1011202-48" = "[s] \"それが問題なんだ……。\""
"1011202-49-アスナ" = "ふふっ、心臓の音が聞こえるね！#nドクドクって、すごいよ～！"
"1011202-50" = "（そうこうして、10年にも感じた10分が過ぎ……）"
"1011202-51" = "（目的地のバス停で降りた）"
