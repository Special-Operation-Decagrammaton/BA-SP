[translation]
"1011203-1" = "売店デート"
"1011203-2" = "（ミレニアムの仕事を終えると、ちょうどお昼の時間だった）"
"1011203-3" = "[ns] \"腹が……。\""
"1011203-4" = "[ns] \"……減った。\""
"1011203-5" = "（何を食べようかな……）"
"1011203-6" = "[ns] \"とりあえず売店に行こう。\""
"1011203-7" = "（近くまで来ると……）"
"1011203-8" = "[ns] \"あれは……。\""
"1011203-9" = "[ns1] \"こんにちは、アスナ。\"\n[ns2] \"何を食べるか決めた？\""
"1011203-10-アスナ" = "あ、先生！"
"1011203-11-アスナ" = "やっほー！"
"1011203-12-アスナ" = "先生と売店で会うなんて、何だか不思議な感じ！"
"1011203-13" = "[s] \"本当だね。\""
"1011203-14-アスナ" = "それで、お昼まだ悩んでるんだ。"
"1011203-15-アスナ" = "こっちのメロンパンか……。"
"1011203-16-アスナ" = "それとも、こっちの焼きそばパンにしよっかな～って。"
"1011203-17-アスナ" = "両方美味しそうだから選べないよー！"
"1011203-18" = "[s] \"二つとも食べるのはどう？\""
"1011203-19-アスナ" = "あ、そっか！"
"1011203-20-アスナ" = "さすがだね、先生！"
"1011203-21-アスナ" = "二つも食べ切れるか心配だけど……たぶん大丈夫大丈夫。"
"1011203-22-アスナ" = "先生も一緒に食べよ！"
"1011203-23" = "[s] \"うん、もちろんだよ。\""
"1011203-24" = "（アスナと一緒にパンを買い、外に出た）"
"1011203-25-アスナ" = "私の分まで払ってもらっちゃって、ありがとう先生。"
"1011203-26" = "[s3] \"たまにはね。\"\n[s4] \"いつも頑張ってるからね。\""
"1011203-27-アスナ" = "うーん、分かった！#nじゃあ、次は私が奢るね！"
"1011203-28-アスナ" = "あ、そこのベンチで食べよ！#nよく使ってるんだ～。"
"1011203-29-アスナ" = "ここのベンチ、どうかな？"
"1011203-30" = "[s5] \"日差しが気持ち良いね。\"\n[s6] \"みんなには内緒にしたいくらいだよ。\""
"1011203-31-アスナ" = "でしょ～？#nたまにここでぼーっとしてるんだ。"
"1011203-32-アスナ" = "あ、そうだ。"
"1011203-33-アスナ" = "先生が買ってくれたメロンパンと焼きそばパン！"
"1011203-34-アスナ" = "うーん、どっちから食べるか悩んじゃう。"
"1011203-35" = "[s7] \"メロンパン！\"\n[s8] \"焼きそばパン！\""
"1011203-36-アスナ" = "えへへ、そうする！"
"1011203-37-アスナ" = "先生がいると、悩みなんてすぐ解決しちゃうね！"
"1011203-38-アスナ" = "これからも、ずっと先生といられたら良いな～。"
"1011203-39" = "[s] \"自分で決めるのも楽しいと思うよ。\""
"1011203-40-アスナ" = "うーん……。"
"1011203-41-アスナ" = "そうかも？"
"1011203-42-アスナ" = "じゃあ、一口ずつ交互に食べよっ！#nそれで決まりね！"
"1011203-43-アスナ" = "いただきまーす！"
"1011203-44-アスナ" = "あははっ、美味しいね！"
"1011203-45-アスナ" = "先生と一緒だからかな？"
"1011203-46" = "（結局、アスナはすぐお腹いっぱいになってしまったが……）"
"1011203-47" = "（もったいないため、残りは全部自分で食べた）"
