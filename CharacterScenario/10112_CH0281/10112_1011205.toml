[translation]
"1011205-1" = "思いがけない出会い"
"1011205-2" = "（外仕事を終えた帰り道……）"
"1011205-3" = "[ns] \"……。\""
"1011205-4" = "（アスナのモモトークを思い出して、辺りを見回してしまう）"
"1011205-5" = "[ns] \"いないか……。\""
"1011205-6" = "[ns] \"……。\""
"1011205-7" = "[ns] \"さすがに偶然も続かないか。\""
"1011205-8-アスナ" = "あっ、先生だ！"
"1011205-9" = "[s] \"って、アスナ！？\""
"1011205-10-アスナ" = "わぁ、先生だ！#nまた会えたね！"
"1011205-11-アスナ" = "あははっ！#nもしかして運命じゃない？"
"1011205-12-アスナ" = "アスナ、何となくこっちに行けば先生に会える気がしたんだ！"
"1011205-13-アスナ" = "来てみたら、本当にいてビックリしたよ！"
"1011205-14" = "[s] \"私も驚いたよ……。\""
"1011205-15-アスナ" = "えへへ、一緒だね。"
"1011205-16-アスナ" = "なになに、アスナの居場所を知るために紐でも結んでおきたい、って？"
"1011205-17-アスナ" = "あははっ、ワンちゃんみたい！"
"1011205-18" = "[ns1] \"例え話だよ。\"\n[ns2] \"冗談だからね？\""
"1011205-19-アスナ" = "紐ならここにあるよ！"
"1011205-20" = "[ns] \"そ、それは制服のリボンじゃないの……？\""
"1011205-21" = "[wa:540]― [log=아스나 교복]じゃーん！[wa:1000]先生とアスナが、[wa:1170]繋がっちゃいました！[/log]"
"1011205-22" = "[wa:40]― [log=아스나 교복]どう？[/log]"
"1011205-23" = "― [log=아스나 교복]これなら[wa:230]どこにいるのか、[wa:750]分かるんじゃない？[/log]"
"1011205-24" = "[wa:1900]― [log=아스나 교복]……どうしたの？[wa:1000]そんな顔して。[/log]"
"1011205-25" = "― [log=아스나 교복]ん？[wa:1000]逆、[wa:790]だっけ？[wa:1210]私に巻いたほうが[wa:770]よかった？[/log]"
"1011205-26" = "[ns3] \"そういう問題じゃ……。\"\n[ns4] \"犬の散歩みたいだね……。\""
"1011205-27" = "[wa:830]― [log=아스나 교복]……あれ？[wa:1390]……あ、[wa:970]ああ！[wa:830]たしかに！[/log]"
"1011205-28" = "[wa:830]― [log=아스나 교복]……あれ？[wa:1390]……あ、[wa:970]ああ！[wa:830]たしかに！[/log]"
"1011205-29" = "― [log=아스나 교복]……あはっ、[wa:780]あははは！[wa:1190]ヘンなの！[/log]"
"1011205-30" = "[wa:430]― [log=아스나 교복]これ、[wa:370]ほんとに…[/log]"
"1011205-31" = "― [log=아스나 교복]ワンちゃんと[wa:500]散歩してるみたい！[/log]"
"1011205-32" = "[wa:650]― [log=아스나 교복]じゃあ……[wa:1130]今の先生は、[wa:1610]アスナのワンちゃんだね？[/log]"
"1011205-33" = "― [log=아스나 교복]アスナのワンちゃんは、[/log]"
"1011205-34" = "― [log=아스나 교복]ワンワンって[wa:880]言えるかな？[/log]"
"1011205-35" = "― [log=아스나 교복]ふふっ！[/log]"
"1011205-36" = "― [log=아스나 교복]ちゃんと言えたら[wa:620]ご褒美あげるから、[wa:1380]ね？[/log]"
"1011205-37-アスナ" = "ふんふん～お散歩お散歩。"
"1011205-38" = "[ns5] \"その、アスナ……。\"\n[ns6] \"悪いことをしてるわけじゃないんだけどさ……。\""
"1011205-39" = "[ns] \"もし誰かに見られたら……。\""
"1011205-40-アスナ" = "あ、たしかに。"
"1011205-41-アスナ" = "誤解されちゃうか。"
"1011205-42" = "[s] \"分かってくれて良かったよ。\""
"1011205-43-アスナ" = "うん、先生はワンちゃんじゃないもんね。"
"1011205-44-アスナ" = "じゃあ、散歩はおしまい～。"
"1011205-45-アスナ" = "あはは、楽しかったね！"
"1011205-46-アスナ" = "ならこのリボンも……。"
"1011205-47" = "[ns] \"アスナ……？\""
"1011205-48-アスナ" = "えーっと、どうやって結ぶんだっけ？"
"1011205-49-アスナ" = "あはは、忘れちゃった！"
"1011205-50-アスナ" = "先生、結び方分かる？"
"1011205-51" = "[s] \"もちろん知ってるよ。\""
"1011205-52-アスナ" = "なら、これ代わりに結んで！"
"1011205-53" = "[s] \"えっ？\""
"1011205-54-アスナ" = "お願い！"
"1011205-55-アスナ" = "ほら、早く早く！"
"1011205-56" = "[ns] \"う、動かないでね……？\""
"1011205-57" = "（次から自分で結べるように、やり方も教えてあげた……）"
