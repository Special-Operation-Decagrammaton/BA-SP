[translation]
"1600106-1" = "壊れたアスナ"
"1600106-2" = "（なんだか尋常ではない様子が心配で、アスナの元へと向かった）"
"1600106-3" = "（間もなく遠くのベンチに座っているアスナの姿が見えた）"
"1600106-4-アスナ" = "（ぼーっ……）"
"1600106-5" = "[s] \"……あ、アスナ？\""
"1600106-6-アスナ" = "うん……。"
"1600106-7-アスナ" = "はっ！"
"1600106-8-アスナ" = "あれ、何なに？ってご主人様！？いつからいたの！？"
"1600106-9" = "[s1] \"大丈夫？何かあった？\"\n[s2] \"なんだか様子が変だけど……？\""
"1600106-10-アスナ" = "だ、大丈夫大丈夫。時々あることだから。"
"1600106-11-アスナ" = "だ、大丈夫大丈夫。時々あることだから。"
"1600106-12-アスナ" = "いや、むしろ何も無いのかな？"
"1600106-13-アスナ" = "何かこう、暇な時間が続くとボーっとしちゃうっていうか……"
"1600106-14" = "[s3] \"動物的な直感が鈍る、みたいな……？\"\n[s4] \"長時間そういう感覚を使うタイミングが無いことによって……\"\n[s5] \"感覚全体が鈍ってる、とか？\""
"1600106-15-アスナ" = "うーん、そうかな？"
"1600106-16-アスナ" = "うーん、そうかな？"
"1600106-17-アスナ" = "うーん、そうかな？"
"1600106-18-アスナ" = "多分そうかも……？"
"1600106-19-アスナ" = "とにかく時々、こうやって集中できない時が……"
"1600106-20-アスナ" = "……"
"1600106-21-アスナ" = "（ぼーっ……）"
"1600106-22-アスナ" = "……何の話だっけ？"
"1600106-23" = "[s] \"重症だ……。\""
"1600106-24-アスナ" = "ま、まあまあ心配しないで！時間が経てば勝手に治るから！"
"1600106-25-アスナ" = "まあでも今みたいなときは、やっぱり色々助けてくれると嬉しいかな。"
"1600106-26-アスナ" = "ご主人様がいてくれて助かっ……"
"1600106-27-アスナ" = "……あれ、ご主人様？いつからそこにいたの？"
"1600106-28" = "（……とりあえず場所を変えよう）"
"1600106-29" = "（ひとりで歩くのも大変そうだったので、どうにかアスナを支えながら歩いた）"
"1600106-30" = "（それでも唐突に足が動かなくなるアスナのペースにどうにか合わせつつ）"
"1600106-31" = "（数百メートルの移動に、一時間以上かけてようやく辿り着いた）"
"1600106-32-アスナ" = "うぅん……"
"1600106-33-アスナ" = "あれ、ここは……？"
"1600106-34" = "[s6] \"あと少しで着くよ。\"\n[s7] \"そろそろアスナの寮だよ。\""
"1600106-35-アスナ" = "あれ、どうして私……それに、何でご主人様が………？"
"1600106-36-アスナ" = "あれ、どうして私……それに、何でご主人様が………？"
"1600106-37-アスナ" = "ちゃんと休んだ方が良い……？"
"1600106-38-アスナ" = "うーん、じゃあそうしようかな……？"
"1600106-39-アスナ" = "なんだか、眠くないはずなのに眠い……"
"1600106-40-アスナ" = "あれ……"
"1600106-41-アスナ" = "階段、どうやって上がるんだっけ……？"
"1600106-42-アスナ" = "……？"
"1600106-43" = "[s8] \"アスナ！\"\n[s9] （とっさに腕を伸ばして受け止める）"
"1600106-44" = "（ガタンッ！）"
"1600106-45-アスナ" = "……ん？"
"1600106-46-アスナ" = "あれ……？"
"1600106-47-アスナ" = "どうして私、ご主人様の上に……？"
"1600106-48-アスナ" = "それに、胸が温かい……？"
"1600106-49-アスナ" = "……。"
"1600106-50" = "[s] \"……アスナ？\""
"1600106-51-アスナ" = "はっ！？"
"1600106-52-アスナ" = "わ、何なに！？"
"1600106-53-アスナ" = "どうして私がご主人様の上にいるの？"
"1600106-54-アスナ" = "あ、そういえば私さっき、階段から転んで……それをご主人様が、受け止めてくれた？"
"1600106-55-アスナ" = "あはは、ナイスキャッチだね！すごいすごい、こんなの初めて！"
"1600106-56-アスナ" = "えへへ、メイドのはずなのに、逆に助けてもらっちゃったね。いやービックリだぁ……。"
"1600106-57-アスナ" = "……ところで私、重くない？"
"1600106-58" = "[s10] \"全然軽いよ。\"\n[s11] \"調子が戻ったみたいで良かった。\""
"1600106-59-アスナ" = "そっか、ありがとうご主人様！"
"1600106-60-アスナ" = "そっか、ありがとうご主人様！"
"1600106-61-アスナ" = "なんだかさっきから胸のところがワクワクしてさ！"
"1600106-62-アスナ" = "……あ。"
"1600106-63-アスナ" = "そういえば、感覚が戻ってる！"
"1600106-64" = "[s] \"それは何より。\""
"1600106-65-アスナ" = "わー！"
"1600106-66-アスナ" = "動く動く！手も足も思い通りだよ！"
"1600106-67-アスナ" = "見て、ご主人様！！ジャンプもできるようになったよ！"
"1600106-68-アスナ" = "ジャーンプ！！"
"1600106-69" = "（……？）"
"1600106-70" = "（……！！）"
"1600106-71" = "― ……ふふっ、[wa:1400]ご主人様に乗っかっちゃった！"
"1600106-72" = "― うん、[wa:850]身体も軽いし、[wa:850]今なら何でもできそう！"
"1600106-73" = "[ns12] \"きゅ、急にどうしたの！？\"\n[ns13] \"食べないで……。\""
"1600106-74" = "[wa:350]― うーん、[wa:1300]何なんだろうなー、[wa:1250]この感じ……"
"1600106-75" = "[wa:350]― うーん、[wa:1300]何なんだろうなー、[wa:1250]この感じ……"
"1600106-76" = "― ……まあ良いか！"
"1600106-77" = "― じゃーん！[wa:600]いつものアスナちゃん、[wa:950]復活！"
"1600106-78" = "[wa:250]― これも[wa:250]ご主人様のおかげだよ、[wa:1450]ありがとね！"
"1600106-79" = "[wa:100]― ふふっ。 [wa:1000]やっぱりこうして[wa:550]ご主人様のそばにいると、"
"1600106-80" = "― 心が躍るなー。"
"1600106-81" = "― ……なんだかちょっと、[wa:900]癖になっちゃいそう！"
"1600106-82" = "[wa:250]― だからこれから時々[wa:1150]こういう風に……[wa:1750]ね？"
"1600106-83" = "― よろしく、[wa:900]私のご主人様！"
"1600106-84" = "（その後、元気になったアスナを見送ってからシャーレへと戻った）"
