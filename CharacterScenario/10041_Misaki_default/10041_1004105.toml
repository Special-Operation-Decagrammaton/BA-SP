[translation]
"1004105-1" = "綺麗にならなくても"
"1004105-2-ミサキ" = "……。"
"1004105-3" = "[s] \"ミサキ、大丈夫？\""
"1004105-4-ミサキ" = "ごめん、話すと長くなる。"
"1004105-5-ミサキ" = "しばらく……何も食べてなくて……。"
"1004105-6-ミサキ" = "う……。"
"1004105-7" = "[ns] \"ミサキ！？\""
"1004105-8-ミサキ" = "ちょっと、身体が重くて……くらくらする……。"
"1004105-9" = "[s] \"……体がすごく熱い。\""
"1004105-10-ミサキ" = "……ここは？"
"1004105-11" = "[s] \"近くにホテルがあったから……ごめん、他に良いところが無さそうで。\""
"1004105-12-ミサキ" = "……。"
"1004105-13" = "[s1] \"無理しないで、すごい熱なのに……。\"\n[s2] \"風邪だと思う、今はゆっくり休んで。\""
"1004105-14-ミサキ" = "……。"
"1004105-15-ミサキ" = "……。"
"1004105-16" = "[s] \"食べ物と着替えはここにあるから。\""
"1004105-17" = "[ns] \"ゆっくり休んで、食べれるようになったらご飯食べて。\""
"1004105-18-ミサキ" = "……行っちゃうの？"
"1004105-19" = "[s] \"ごめん、ちょっと出てくるね。安静にしてて。\""
"1004105-20-ミサキ" = "……そう。"
"1004105-21-ミサキ" = "バカバカしい……肉体なんて、取るに足らないものなのに……。"
"1004105-22-ミサキ" = "こんなことで足を引っ張られて……。"
"1004105-23-ミサキ" = "私は……こんな肉体から、解放されたかったのに……。"
"1004105-24-ミサキ" = "この世界はいつも、こんな風に私を……。"
"1004105-25-ミサキ" = "……"
"1004105-26-ミサキ" = "寂しい。"
"1004105-27" = "[ns] \"ただいま。\""
"1004105-28" = "[ns] \"あれ、ミサキ……どこにいるの……？\""
"1004105-29" = "[ns3] \"水の音……？\"\n[ns4] 扉を開ける。"
"1004105-30" = "[wa:1300]― ……先生？[wa:2300]帰ってきたんだ。"
"1004105-31" = "― 何か、[wa:1300]大事な忘れ物でも？"
"1004105-32" = "[wa:1500]― ……私？"
"1004105-33" = "― 私を、[wa:1200]心配して……？"
"1004105-34" = "[wa:1800]― そんな、"
"1004105-35" = "― くだらないことまで気にするなんて……。"
"1004105-36" = "― 暇なんだね、[wa:1850]大人なのに。"
"1004105-37" = "[wa:1700]― この冷たくて騒がしい世の中も、"
"1004105-38" = "― 私も。"
"1004105-39" = "― ……どれだけ雨が降ったところで、"
"1004105-40" = "― 洗い流されて綺麗にはならない。"
"1004105-41" = "[wa:2000]― ……そんなことないんだって。"
"1004105-42" = "― 馬鹿みたいに、[wa:1700]信じられたら……"
"1004105-43-ミサキ" = "……。"
"1004105-44-ミサキ" = "私は……何に対しても、特に興味も持たずに生きてきた。"
"1004105-45-ミサキ" = "死のうが生きようが、どっちでもよかった……何も思わないから。"
"1004105-46-ミサキ" = "でも……先生、あなたを見てると……"
"1004105-47-ミサキ" = "……腹が立つ。"
"1004105-48-ミサキ" = "ものすごく、イライラして……。"
"1004105-49-ミサキ" = "よく分からなくなる。"
"1004105-50-ミサキ" = "……変な感じ。"
"1004105-51" = "[s] \"……そっか。\""
"1004105-52-ミサキ" = "……悪いのは、きっと私。今日だって、先生は私を助けてくれた。"
"1004105-53-ミサキ" = "先生が行っちゃった時……急に、耐えられなくて……"
"1004105-54-ミサキ" = "……。"
"1004105-55-ミサキ" = "……それで、どこに行ってきたの？"
"1004105-56" = "[s] \"解熱剤を買いに。\""
"1004105-57-ミサキ" = "……そっか。"
"1004105-58" = "[s] \"飲みやすいように、甘いやつにしたよ。\""
"1004105-59-ミサキ" = "……。"
"1004105-60-ミサキ" = "……えっ？"
"1004105-61-ミサキ" = "甘いやつって……子ども用のシロップってこと？"
"1004105-62-ミサキ" = "……どうして？"
"1004105-63" = "[s] \"えっと、もしかしたら苦い薬は得意じゃないかもと思って……\""
"1004105-64-ミサキ" = "薬なんて飲み込んでしまえば全部同じだよ。"
"1004105-65-ミサキ" = "どうしてそんな所に気を使うの。"
"1004105-66" = "[s] \"薬局で勧めてもらったっていうのもあって……。\""
"1004105-67-ミサキ" = "だからって普通、子ども向けを買う……？"
"1004105-68" = "[s] \"ごめんなさい……。\""
"1004105-69" = "（その後もしばらくミサキに問い詰められたものの、どうにか薬を飲んでもらうことに成功した。）"
