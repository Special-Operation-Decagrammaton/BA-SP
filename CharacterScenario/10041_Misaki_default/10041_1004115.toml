[translation]
"1004115-1" = "刻まれた思い出"
"1004115-2" = "（さっきのメッセージが気になって、ミサキを探しに出た）"
"1004115-3-ミサキ" = "だ、だから、学生証は家に忘れただけで……"
"1004115-4-公園の警備員" = "この公園で野宿す[ruby=やから]る輩が[/ruby]多くて困っていると、苦情が入っているんだ。"
"1004115-5-公園の警備員" = "身元が不明な以上、ヴァルキューレに通報させてもらう。"
"1004115-6-ミサキ" = "くっ……！"
"1004115-7" = "[s] \"何か問題でもありましたか？\""
"1004115-8-公園の警備員" = "あっ、シャーレの先生じゃありませんか。"
"1004115-9-ミサキ" = "せ、先生？"
"1004115-10-公園の警備員" = "……なるほど、こちらの生徒さんを迎えに来たのですか？"
"1004115-11-公園の警備員" = "これは失礼しました。まさか先生の生徒さんだとは知らず。"
"1004115-12" = "[s] \"じゃあ、この子は私が送ってもいいかな？\""
"1004115-13-公園の警備員" = "ええ。"
"1004115-14-公園の警備員" = "遅くまでお疲れ様です。"
"1004115-15-ミサキ" = "……また先生に助けられたね。"
"1004115-16" = "[s1] \"無事で良かった。ここで何してたの？\"\n[s2] \"何か探しもの？\""
"1004115-17-ミサキ" = "……カバンを失くして。"
"1004115-18-ミサキ" = "昨日、この近くで野宿をしてたから……たぶん、あるとしたらここだと思うんだけど。"
"1004115-19" = "[s3] \"分かった、一緒に探そう。\"\n[s4] \"ここ周辺は、私もよく通るから。\""
"1004115-20-ミサキ" = "いい、忘れた私が悪いし。"
"1004115-21-ミサキ" = "一人で探せるから、先生は帰って。"
"1004115-22" = "[s5] \"警備員さんに、また声をかけられるかもしれないよ。\"\n[s6] \"一緒に探せば、早く見つけられるかもしれないよ。\""
"1004115-23-ミサキ" = "た、たしかにそうだけど……"
"1004115-24-ミサキ" = "……はぁ、分かった。昨日、通った道を順番に探すから。"
"1004115-25-ミサキ" = "付いてきて。"
"1004115-26-ミサキ" = "ここには……無いみたい。"
"1004115-27-ミサキ" = "ここにも、無い……"
"1004115-28-ミサキ" = "ここも……"
"1004115-29-ミサキ" = "無い……"
"1004115-30" = "[ns] \"待って！ミサキ、あれ！\""
"1004115-31-ミサキ" = "あった……！"
"1004115-32-ミサキ" = "そうだった。ここで警備員と鉢合わせて、荷物をまとめる時間が無かったんだ……"
"1004115-33-ミサキ" = "盗まれてなくて良かった。"
"1004115-34-ミサキ" = "……ありがとう。助かったよ、先生。"
"1004115-35" = "[s] \"カバンの中身、無事だった？\""
"1004115-36-ミサキ" = "服に財布、歯ブラシ、歯磨き粉……"
"1004115-37-ミサキ" = "……あ。"
"1004115-38" = "[s] \"どうしたの？何か失くなってた？\""
"1004115-39-ミサキ" = "……いや、気にしないで。"
"1004115-40-ミサキ" = "そのうち失くすんだろうなとは思ってたから。"
"1004115-41-ミサキ" = "えっ。先生、その手に持ってるのって……"
"1004115-42" = "[s7] \"もしかして、これを探してたんじゃない？\"\n[s8] \"忘れ物って、これだよね？\""
"1004115-43-ミサキ" = "う、うん。貸して。"
"1004115-44" = "[ns] \"ちょっと、意外だったかも。\""
"1004115-45-ミサキ" = "……はぁ。"
"1004115-46-ミサキ" = "これは昔、サオリが作ってくれた人形。#nその辺に転がっていた木とナイフで。"
"1004115-47-ミサキ" = "子どもはみんな、愛着のあるオモチャをひとつくらい持ってるものなんでしょ。"
"1004115-48-ミサキ" = "小さい頃は遊んでたけど、今はもうなんとも思ってないから。"
"1004115-49-ミサキ" = "ずっとカバンに入れっぱなしになってただけ。"
"1004115-50-ミサキ" = "……黙ってないで、早く返して。"
"1004115-51" = "[s] \"ミサキの大切な物なんだね。\""
"1004115-52-ミサキ" = "……ちょっと。話、聞いてた？"
"1004115-53-ミサキ" = "まあ、大切な物[ruby=・   ・   ・]だった[/ruby]のは否定しない。"
"1004115-54-ミサキ" = "とにかく、今日はありがとう。"
"1004115-55-ミサキ" = "また連絡する。"
