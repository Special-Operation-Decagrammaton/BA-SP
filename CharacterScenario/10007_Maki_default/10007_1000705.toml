[translation]
"1000705-1" = "バカと天才は紙一重"
"1000705-2" = "ミレニアム・教室"
"1000705-3-マキ" = "だ、だから今回のテストで赤点になったのは、勉強をしてなかったからじゃなくて……。"
"1000705-4-マキ" = "そもそもミレニアムのテストは難しすぎるんだよ～、#n普通の高校生のレベルを考えてない問題ばっかり！"
"1000705-5" = "[s] \"予習と復習をちゃんとすれば、マキも解けるよ。\""
"1000705-6-マキ" = "うっ、先生みたいな小言を……#nいや、先生だった。当たり前か。"
"1000705-7-マキ" = "でもどれだけ教科書を覚えても、問題自体が理解できないんだもん。"
"1000705-8-マキ" = "特に、国語！#n文章を読んで登場人物の気持ちを推測しろって、そんなの読心術の域じゃない？"
"1000705-9-マキ" = "ん？ハッキングはできるのに、どうしてこういう簡単な問題が解けないのかって？"
"1000705-10-マキ" = "何言ってんの！ハッキングの方がずっと簡単だよ！"
"1000705-11-マキ" = "バケツに水を入れすぎると中身がこぼれる。#n鍵穴に合う鍵がない時は、それに合う鍵を持ってる人に開けてって頼む。#nハッキングはこういう、全部常識的に理解しやすい方法しかないじゃん！"
"1000705-12-マキ" = "国語の問題を解くのはハッキングよりもっと簡単なはずだって？えーっ、そんなことある？#nうーん、どれどれ……。"
"1000705-13-マキ" = "え？ふんふん、なるほど、こういう表現が多い時は登場人物は嬉しいって意味？#nそっか、理解した！"
"1000705-14-マキ" = "先生、そしたらこっちはどんな意味……？"
"1000705-15-マキ" = "ありがとう、先生！#n先生が教えてくれた通りに出れば、次のテストは問題なさそう！"
"1000705-16-マキ" = "こんなに難しい問題も分かりやすく説明してくれるなんて、さすが先生！"
"1000705-17-マキ" = "なに？あたしの理解が速いから？"
"1000705-18-マキ" = "ふふっ、そんなに褒められるとちょっと恥ずかしいな。"
"1000705-19-マキ" = "あたしはヴェリタスの先輩たちみたいに頭は良くないけど、授業についていけなくて部に迷惑をかけるのは避けたいの。"
"1000705-20-マキ" = "だってヴェリタスはあたしを問題児呼ばわりしないし、あたしの才能を認めてもらえる数少ない大切な場所だから。"
"1000705-21-マキ" = "もちろん先生も、あたしにとっては特別な存在だよ。#nだからもっともっと……頑張るね。"
"1000705-22-マキ" = "あ、あはは！な、なんか恥ずかしいこと言っちゃった……。#n最後のは忘れて！"
"1000705-23-マキ" = "さてさて。それじゃ、先生が整理してくれた内容を覚えるために、#nもう一度ノートを見返して覚えてみようかな？"
"1000705-24-マキ" = "「このノートは中紙に80gの白象画学紙を使用しています。#n規格は297mm×210mm、A型用紙の大きさに裁断され、シリアルナンバー入りの100枚の中紙が……」"
"1000705-25-マキ" = "ん？何のことかって？#nノートの一番最初のところに書いてある文章だけど？"
"1000705-26-マキ" = "えっ、これは覚えなくていい文章だったの？#n先生がノートを丸ごと暗記しろっていうから……。"
"1000705-27-マキ" = "ま、待って！バカなのか天才なのか分かりにくいって、#nなにそれ！先生っ！"
