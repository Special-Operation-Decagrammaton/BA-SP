[translation]
"1601702-1" = "I hate people "
"1601702-2" = "（備品を買いに文房具店に立ち寄ったところ――）"
"1601702-3" = "ちょっと失礼。"
"1601702-4-アオバ" = "ひゃっ……！"
"1601702-5-アオバ" = "うぅ……"
"1601702-6-アオバ" = "こ、これだから人混みは……うぅぅ、みんな消えてしまえばいいのに……。"
"1601702-7" = "[s] \"こんにちは、アオバ。\""
"1601702-8-アオバ" = "……あっ！"
"1601702-9-アオバ" = "はひいっ！せ、先生……！"
"1601702-10-アオバ" = "こ、こんにちは……。"
"1601702-11-アオバ" = "ほ、本当に先生だ……。"
"1601702-12" = "[s] \"アオバは何か買いに来たの？\""
"1601702-13-アオバ" = "あっ……えっと……。"
"1601702-14-アオバ" = "コピー用紙ですね……備品リストを作るので……。"
"1601702-15" = "[s] \"一緒に買っちゃおうか？\""
"1601702-16-アオバ" = "あっ！いえっ、こ、これは……自腹で……。"
"1601702-17" = "[s] \"えっ、業務に必要なものなのに……？\""
"1601702-18-アオバ" = "そうなんですけど……。"
"1601702-19-アオバ" = "なかなか経費の申請が通らなくて……へへっ……。"
"1601702-20-アオバ" = "い、いいんです……別に今日が初めてじゃない……ですから……。"
"1601702-21" = "[s] \"だ、大丈夫なの……？\""
"1601702-22-アオバ" = "ハ、ハイランダーではそれが普通なんです……。"
"1601702-23-アオバ" = "はぁ……考えるだけで腹が立ってきますけど……。"
"1601702-24-アオバ" = "変な規則ばっか生えてきて……。"
"1601702-25-アオバ" = "た、例えば、節約のために報告書は裏紙で書くんですが――"
"1601702-26-アオバ" = "裏紙がないときは、わざわざ何かを印刷して裏紙を作らなきゃいけなかったり……。"
"1601702-27-アオバ" = "ほ、本末転倒、じゃないですか？へへっ……。"
"1601702-28-アオバ" = "決裁には幹部の捺印が必要なのに……幹部がハンコを失くして、何週間も放置されたこともありますけど……。"
"1601702-29-アオバ" = "お、お昼のお弁当も、幹部が選んだメニューを全員食べるんですよ……？"
"1601702-30-アオバ" = "「これやっといて！」と納期前日に言われるのも、日常茶飯事ですし……。"
"1601702-31" = "[s] \"そ、そんなことが……。\""
"1601702-32-アオバ" = "は、はい。#nまぁ……いつものことですけど……。"
"1601702-33-アオバ" = "い、今もどこかで、私みたいな人が苦しんでいるはずです……へへっ……。"
"1601702-34-アオバ" = "だ、だから、もう何にも期待しなくなりました……。"
"1601702-35-アオバ" = "裏切られるだけですし……へへ……。"
"1601702-36-アオバ" = "きっと、ずっとこうなんでしょうね……人生って本当に最悪。"
"1601702-37" = "[s] \"今日は私が出すよ。\""
"1601702-38-アオバ" = "え、えええっ！？"
"1601702-39-アオバ" = "な、なんでも買ってくれるだなんて……。"
"1601702-40-アオバ" = "い、いえ！そ、それは流石に……。"
"1601702-41" = "[s1] \"こういうときのために私がいるんだよ。\"\n[s2] \"遠慮せず、必要なものを選んで。\""
"1601702-42-アオバ" = "う、うう……そんな……。"
"1601702-43-アオバ" = "……えっと、コピー用紙と…… あ、あとはみんな持って行っちゃうボールペン……あっ、テープもないんだった……。"
"1601702-44-アオバ" = "そ、それじゃ……お言葉に甘えさせてもらいますけど……。"
"1601702-45-アオバ" = "ほ、本当にいいんです……よね？ "
"1601702-46-アオバ" = "お、おかげさまで、必要なものが揃いました……！"
"1601702-47-アオバ" = "ありがとうございます……ほ、本当に嬉しいです……。"
"1601702-48" = "[s3] \"少しでも、アオバが明日に期待できるようになればいいなって。\"\n[s4] \"困ったときは、いつでも私を頼ってね。\""
"1601702-49-アオバ" = "期待……ですか。"
"1601702-50-アオバ" = "そ、そうですね……。"
"1601702-51-アオバ" = "し、失望するのは嫌ですけど……でも……。"
"1601702-52-アオバ" = "きょ、今日は本当にありがとうございました、先生。"
"1601702-53-アオバ" = "このご恩は、忘れません……。"
"1601702-54" = "（アオバは何度も何度もお辞儀をしながら帰っていった）"
