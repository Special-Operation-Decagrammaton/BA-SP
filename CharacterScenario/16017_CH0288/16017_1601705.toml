[translation]
"1601705-1" = "I hate being alone "
"1601705-2" = "（アオバとモモトークを終えた直後……）"
"1601705-3-アオバ" = "は、はぁっ……はぁっ！せ、先生……っ……！"
"1601705-4" = "[s1] \"アオバ、めちゃくちゃ早かったね！？\"\n[s2] \"大丈夫！？ こ、これでも飲んで！\""
"1601705-5-アオバ" = "は、はひゅぅっ……！あ、ありがとうございます……！"
"1601705-6-アオバ" = "……ふうっ。"
"1601705-7-アオバ" = "で、ではコーヒーポットはどちらに……？"
"1601705-8" = "[s3] \"これなんだけど……\"\n[s4] \"少し前から動かなくなっちゃって。\""
"1601705-9-アオバ" = "で、では……診ていきますけど！"
"1601705-10-アオバ" = "外から見えるところは……大丈夫そうですね……。"
"1601705-11-アオバ" = "な、なら……。"
"1601705-12" = "[ns5] \"ア、アオバ！？\"\n[ns6] \"た、叩いて大丈夫……？\""
"1601705-13-アオバ" = "ご、ご安心ください……！"
"1601705-14-アオバ" = "叩けば大丈夫ですけど……！"
"1601705-15" = "[s] \"う、うん！\""
"1601705-16" = "（やや不安を抱きつつ、アオバの修理を見守ることにした）"
"1601705-17-アオバ" = "……まだ動きませんね。"
"1601705-18" = "（か、角が少し凹んでいる……）"
"1601705-19-アオバ" = "こ、こうなったら……いよいよプランBの分解を……！"
"1601705-20" = "（アオバ、コーヒーマシンの修理は初めてって言っていたけど……）"
"1601705-21" = "（ここは信じよう……！）"
"1601705-22-アオバ" = "……へへ。これで完璧に組み直せたはずですけど……！"
"1601705-23-アオバ" = "では、電源を……。"
"1601705-24" = "[ns] \"す、すごい振動……！！\""
"1601705-25-アオバ" = "こ、こんな派手にコーヒーを淹れるんですね……！"
"1601705-26" = "[s] \"違うはず……！\""
"1601705-27-アオバ" = "す、すみません……直せたと思ったのに……。"
"1601705-28-アオバ" = "……あ、諦めるわけにはいきません！"
"1601705-29-アオバ" = "よ、よし……今度こそ……！"
"1601705-30" = "[ns7] \"す、すごい水圧だ……！！\"\n[ns8] \"テーブルが……斬れた！？\""
"1601705-31-アオバ" = "あそこの部品じゃなかった……なら……ここを……っ！"
"1601705-32" = "（それから試行錯誤を重ねて……）"
"1601705-33-アオバ" = "お、お待たせしました。"
"1601705-34-アオバ" = "今度こそ動くはず……です。"
"1601705-35" = "[s] \"電源を入れてみよう！\""
"1601705-36" = "[ns9] \"う、動いた……！\"\n[ns10] \"すごいよ、アオバ！\""
"1601705-37-アオバ" = "や、やったぁ……！"
"1601705-38-アオバ" = "で、できました！#nちょっと……時間はかかっちゃいましたが……。"
"1601705-39-アオバ" = "へへっ……や、やっと……少しだけ恩返しできました……。"
"1601705-40-アオバ" = "それでは……私はこれで……。"
"1601705-41-アオバ" = "な、何度も失敗してしまってすみません……。"
"1601705-42" = "[ns] \"アオバ、ちょっと待って。\""
"1601705-43-アオバ" = "な、なんでしょう？"
"1601705-44-アオバ" = "まだ修理するものが……？"
"1601705-45" = "[ns11] \"直してくれたお礼に、夕飯でもご馳走しようと思って。\"\n[ns12] \"一緒に食べよう？\""
"1601705-46-アオバ" = "あ……う、うぅ……。"
"1601705-47-アオバ" = "ひっく……。"
"1601705-48-アオバ" = "うわあぁぁぁぁぁん！！"
"1601705-49" = "[s] \"ご、ごめん！何か余計な事言ったかな……？\""
"1601705-50-アオバ" = "ひっく……い、いえ、そんなことは……。"
"1601705-51-アオバ" = "……ゆ、夕食に誘われるなんて……久しぶりで……。"
"1601705-52-アオバ" = "いつもは仕事が終わると……一人でコンビニのご飯を食べていたんですけど……。"
"1601705-53-アオバ" = "だから……び、びっくりしちゃって……。"
"1601705-54" = "[ns] \"今日は特別なディナーにしよう！\""
"1601705-55-アオバ" = "う、うわぁぁぁ……！"
"1601705-56" = "（アオバと一緒に、素敵なレストランで美味しい夕飯を食べた）"
"1601705-57" = "（なんだか、いつもより美味しく感じた気がする）"
