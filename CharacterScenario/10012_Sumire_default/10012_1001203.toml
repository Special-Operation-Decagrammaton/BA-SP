[translation]
"1001203-1" = "トレーナーと共に"
"1001203-2" = "ミレニアム周辺のショッピングモール"
"1001203-3" = "（寝坊してしまい、スミレとの約束の時間に30分ほど遅れてしまった）"
"1001203-4" = "[s] スミレを探す。"
"1001203-5" = "（この辺で会う予定だったのに、スミレが見当たらない）"
"1001203-6" = "[s] \"……ん？\""
"1001203-7-スミレ" = "ふっ、ふっ……。"
"1001203-8-スミレ" = "あっ、トレーナー！"
"1001203-9-スミレ" = "お待ちしておりました。"
"1001203-10" = "[s] \"遅れてごめんね。\""
"1001203-11-スミレ" = "大丈夫です、トレーナー。"
"1001203-12-スミレ" = "ちょうどこのお出かけのこともあって、今日は運動量が足りなくなりそうだなという懸念がありましたので。"
"1001203-13-スミレ" = "空いた時間で、少しスクワットをしていました。"
"1001203-14-スミレ" = "やっぱりスクワットって、いい運動になりますね。"
"1001203-15-スミレ" = "少しやっただけなのですが、もう下半身の筋肉がパンパンで、"
"1001203-16" = "[s] \"えっと、周りの人のこととかは気にならないの？\""
"1001203-17-スミレ" = "だいぶ張っている感じが……はい？"
"1001203-18-スミレ" = "あ…………。"
"1001203-19-スミレ" = "……ああああっっっ！！！"
"1001203-20" = "[s] \"ス、スミレ！\""
"1001203-21" = "（スミレが消えていった方向に向かう）"
"1001203-22-スミレ" = "う、うううう……。"
"1001203-23-スミレ" = "す、すみません。トレーナー。"
"1001203-24-スミレ" = "待っている間に何をしようかと考えていたのですが、"
"1001203-25-スミレ" = "そうだ、スクワットをやろうと思い当たりまして。"
"1001203-26-スミレ" = "少しだけのつもりが、夢中になってしまっていました……。"
"1001203-27-スミレ" = "も、もし、その……。"
"1001203-28-スミレ" = "トレーナーが、私と一緒にいるのは恥ずかしいと感じるようでしたら……。"
"1001203-29" = "[s1] \"ううん、そんなことないよ。\"\n[s2] \"頑張って運動してる姿は、素敵だと思うよ。\""
"1001203-30-スミレ" = "……優しいお言葉、ありがとうございます。"
"1001203-31-スミレ" = "……優しいお言葉、ありがとうございます。"
"1001203-32-スミレ" = "ですが、今後もし私のことで気になるようなことがあったら、"
"1001203-33-スミレ" = "ぜひ言っていただきたいです。"
"1001203-34-スミレ" = "私の筋肉も、もちろん大事ですが。"
"1001203-35-スミレ" = "それよりもトレーナーのことの方が、もっと……。"
"1001203-36-スミレ" = "……。"
"1001203-37" = "[s] \"？\""
"1001203-38-スミレ" = "ち、違います！何でもありません！"
"1001203-39-スミレ" = "そ、それでは！プロテインを買いに行きましょうか！？"
"1001203-40-スミレ" = "さあ行きましょう！"
"1001203-41" = "（なんだか気恥ずかしそうなスミレと一緒にショッピングをして、プロテインを買った）"
"1001203-42" = "ミレニアム・近郊街"
"1001203-43-スミレ" = "今日はありがとうございました、トレーナー。"
"1001203-44-スミレ" = "おかげさまで、良い商品が買えました。"
"1001203-45-スミレ" = "特に、大特価セールで残り少なかったプロテインを遠くから見つけた瞬間、"
"1001203-46-スミレ" = "一瞬でショッピングモールの人波をかき分けて、残っていたプロテインを素早く手に取ったトレーナーの姿。"
"1001203-47-スミレ" = "あれは、判断力と行動力溢れる、真にカッコいい大人という感じでした。"
"1001203-48-スミレ" = "あのトレーナーの姿に、いったい何を買ったのかとざわつく周りの反応も面白かったですね。"
"1001203-49-スミレ" = "私にはあんな動きはできませんでした。"
"1001203-50" = "[s3] \"あはは、恥ずかしいな。\"\n[s4] 思いっきり威張る。"
"1001203-51-スミレ" = "ふふっ、トレーナーは本当に面白い方ですね。"
"1001203-52-スミレ" = "ふふっ、トレーナーは本当に面白い方ですね。"
"1001203-53-スミレ" = "とりあえず、これぐらい買えれば十分だと思います。"
"1001203-54-スミレ" = "はい？プロテイン、買いすぎじゃないか、ですか？"
"1001203-55-スミレ" = "プロテインは思ったよりも、早くなくなるものですので。"
"1001203-56-スミレ" = "それに……。"
"1001203-57-スミレ" = "近いうちに、必要になる方がいると思いますし。"
"1001203-58-スミレ" = "うん？誰のこと、ですか？"
"1001203-59-スミレ" = "それは秘密です。"
"1001203-60-スミレ" = "多分、すぐに分かると思います。ふふっ。"
"1001203-61-スミレ" = "それでは私はそろそろ帰ります。"
"1001203-62-スミレ" = "気をつけて帰ってくださいね、トレーナー。"
"1001203-63" = "（スミレが言った「誰か」は誰のことだろうと思いながら家に帰った）"
