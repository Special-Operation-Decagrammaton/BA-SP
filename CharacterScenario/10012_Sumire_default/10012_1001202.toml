[translation]
"1001202-1" = "トレーナー参上！"
"1001202-2" = "ミレニアム・ジム"
"1001202-3-スミレ" = "あ、先生……いえ、トレーナー！来てくださったんですね！"
"1001202-4-スミレ" = "お待ちしておりました。"
"1001202-5-スミレ" = "あはは、まだトレーナーって呼ぶのは慣れませんね。"
"1001202-6-スミレ" = "約束通り、自分でトレーニングのメニューを作ってきました。"
"1001202-7-スミレ" = "これでいいかどうか、確認していただけませんか？"
"1001202-8" = "（スミレが渡してきたスマホには、なんだか難しそうな言葉がたくさん書いてあった）"
"1001202-9-スミレ" = "いかがでしょうか、トレーナー？"
"1001202-10-スミレ" = "ダンベルオーバーヘッドエクステンションは上腕の発達、特に上腕三頭筋に良い運動だそうです。"
"1001202-11-スミレ" = "この運動ではしなやかな腕を作ることができ、こちらのレッグエクステンションの方では……。"
"1001202-12" = "[s] \"えっと、スミレ？\""
"1001202-13-スミレ" = "足の筋力を……あっ、はい、何でしょうかトレーナー！"
"1001202-14" = "[s] \"これは、無理しすぎじゃない？\""
"1001202-15-スミレ" = "うーん……確かに以前に比べると、少し無理して負荷を高めています。"
"1001202-16-スミレ" = "きっと以前の私なら、消化しきれないメニューだと思います。"
"1001202-17-スミレ" = "ですが、今は違います。"
"1001202-18-スミレ" = "その理由は、ト、トレーナーがいるからです！"
"1001202-19" = "[s] \"そ、そっか。でも、私は専門的な知識を持ってないけど。\""
"1001202-20-スミレ" = "大丈夫です！"
"1001202-21-スミレ" = "トレーナーはそばにいるだけで力になってくれる存在！"
"1001202-22-スミレ" = "私がオーバートレーニングしないように、止めてくださる役割を担ってくれていますから。"
"1001202-23-スミレ" = "こんな体系的なトレーニングができるようになったのは、すべてトレーナーのおかげです。"
"1001202-24" = "[s] \"それならよかった。\""
"1001202-25-スミレ" = "よ、良かったのは私の方です。"
"1001202-26-スミレ" = "トレーナーに出会う前の私は、何も知らないひよっこに過ぎませんでしたから。"
"1001202-27" = "ミレニアム・保健室"
"1001202-28" = "先日"
"1001202-29" = "（ガラガラ）"
"1001202-30-スミレ" = "あっ、先生。"
"1001202-31" = "[s] \"体調はどう？\""
"1001202-32-スミレ" = "大丈夫です！軽い脱水症状でしたので。"
"1001202-33-スミレ" = "3回ぐらい倒れましたけど、今はもう大丈夫です。"
"1001202-34-スミレ" = "はい？どうしてこうなったのか、ですか？"
"1001202-35-スミレ" = "それは……最近学校のテストの準備をしていて、じっと座ってる時間が長かったもので。"
"1001202-36-スミレ" = "それで少し運動量を増やそうと思いまして、急に強度の高いトレーニングをしたのが原因だったようです。"
"1001202-37" = "[s] \"そんなに無理しなくても、今のままで十分じゃない？\""
"1001202-38-スミレ" = "いいえ。"
"1001202-39-スミレ" = "トレーニングは毎日、きちんと、確実にやらなくてはいけません。"
"1001202-40-スミレ" = "そうしないと……。"
"1001202-41" = "[s] \"そうしないと？\""
"1001202-42-スミレ" = "起こってしまうのです……筋肉の損失が！"
"1001202-43-スミレ" = "いいですか？今まで培ってきた筋肉たちが無くなることを想像してみてください。"
"1001202-44-スミレ" = "地獄です、苦痛です、絶対にあってはならないことです！"
"1001202-45" = "[s1] \"そ、そうなんだ。\"\n[s2] \"お、落ち着いて。\""
"1001202-46-スミレ" = "あっ！す、すみません。ちょっと興奮してしまいました。"
"1001202-47-スミレ" = "あっ！す、すみません。ちょっと興奮してしまいました。"
"1001202-48-スミレ" = "ふぅー……。"
"1001202-49-スミレ" = "とにかく、筋肉の損失を防ぐためには不可欠なことだったのです。"
"1001202-50" = "[s] \"運動は、健康を守るためにするものだと思うよ。\""
"1001202-51-スミレ" = "もちろんです、私もそう思います。"
"1001202-52-スミレ" = "そのためにこうして、一生懸命……。"
"1001202-53" = "[s] \"脱水症状を起こすのは、健康的じゃないと思うよ？\""
"1001202-54-スミレ" = "……！"
"1001202-55-スミレ" = "あ、はい、それは……そう、ですね。"
"1001202-56-スミレ" = "すみません、先生。"
"1001202-57-スミレ" = "はあ……。"
"1001202-58-スミレ" = "普段は規則正しくトレーニングができていたのに。"
"1001202-59-スミレ" = "少しでも気持ちが焦ると、こうしてミスをしてしまいます。"
"1001202-60-スミレ" = "誰かが見てくれるといいなと思うのですが……周りにお願いできそうな人もいないですし。"
"1001202-61-スミレ" = "どうすればいいのでしょうか。"
"1001202-62" = "……。"
"1001202-63" = "[s3] トレーニングを手伝うと申し出る。\n[s4] \"準備万端のトレーナー、今ここに参上！\""
"1001202-64-スミレ" = "はい！？"
"1001202-65-スミレ" = "はい！？"
"1001202-66-スミレ" = "先生が手伝ってくれるんですか？"
"1001202-67-スミレ" = "そ、そんな、良いのでしょうか？"
"1001202-68-スミレ" = "ありがとうございます！先生！"
"1001202-69-スミレ" = "いえ、これからはトレーナーと呼んだ方がいいでしょうか？"
"1001202-70" = "[s5] \"うん、それでもいいよ。\"\n[s6] \"トレーナーと呼ぶことを許可しよう。\""
"1001202-71-スミレ" = "はい！"
"1001202-72-スミレ" = "はい！"
"1001202-73-スミレ" = "さて、では！"
"1001202-74-スミレ" = "今日のトレーニングを、始めましょうか？"
"1001202-75-スミレ" = "よろしくお願いします、トレーナー。"
