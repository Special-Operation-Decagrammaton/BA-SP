[translation]
"1006905-1" = "接客業の悩み"
"1006905-2" = "玄武商会"
"1006905-3" = "（山海経の仕事を終えてから、玄武商会に向かった)"
"1006905-4-ルミ" = "いらっしゃい、先生。"
"1006905-5-ルミ" = "ご注文は？"
"1006905-6" = "[s] \"日替わりランチか料理長のオススメで！\""
"1006905-7-ルミ" = "へぇ、オススメ、ねぇ。"
"1006905-8-ルミ" = "日替わりランチすぐに出せるけど……"
"1006905-9-ルミ" = "う～ん……よし！#nいいアイデアが思いついたから、オススメ料理にしちゃおっかな。"
"1006905-10" = "[s] \"き、今日は「試食」じゃないよね？\""
"1006905-11-ルミ" = "あははっ。大丈夫だよ、今日は期待してていいよ。"
"1006905-12-？？？" = "ちょっとあんた！料理長を呼んでくれ！"
"1006905-13" = "[ns] \"……？\""
"1006905-14-ルミ" = "……何かトラブルかな。行ってくるね。"
"1006905-15-玄武商会のメンバーA" = "料理に髪の毛が入ってるんだけど……ここの衛生管理はどうなってるんだ？"
"1006905-16-お客さん" = "まったく……人気店と聞いていたのに……これだなんて。"
"1006905-17-玄武商会のメンバーA" = "そ、そんなはずは……！#n従業員一同、徹底しておりますが……"
"1006905-18-お客さん" = "じゃあ、この髪の毛はどう説明するつもりなんだ？#nコレも料理の一部だっていうのか？"
"1006905-19-お客さん" = "それとも、アンタの両目は節穴なのかい？"
"1006905-20-玄武商会のメンバーA" = "……他のお客様の迷惑になりますので、お静かにお願いします。"
"1006905-21-玄武商会のメンバーA" = "おっと？そうだよなぁ。他の客に聞かれたら、困るよな？"
"1006905-22-ルミ" = "――お客様。"
"1006905-23-玄武商会のメンバーA" = "私が料理長です。この度は、大変申し訳ございませんでした。#n心よりお詫び申し上げます。"
"1006905-24-ルミ" = "本日のお代は結構ですので、どうかお許しを。"
"1006905-25-ルミ" = "このようなことが二度とないように、より一層気をつけてまいります。"
"1006905-26-ルミ" = "そっ、そうか！#n仕方ないな、それなら今回は許してやろうじゃあないか。"
"1006905-27-玄武商会のメンバーA" = "会長！あれは私たちの髪の毛ではありません！"
"1006905-28-ルミ" = "うん……そうだね。#nみんなが衛生管理を徹底してるのは、あたしが一番よく知ってる。"
"1006905-29-ルミ" = "悔しい気持ちは分かるよ。#nでも、騒ぎになってしまっては、他のお客様に迷惑がかかってしまうからね。"
"1006905-30-ルミ" = "よく覚えておいて。"
"1006905-31-玄武商会のメンバーA" = "……はい。ありがとうございます、会長。"
"1006905-32" = "[ns] （さっきの客、どこかで見覚えが……)"
"1006905-33" = "（静かに客を尾行することにした)"
"1006905-34-お客さん" = "ふっふっふ……"
"1006905-35-お客さん" = "これで今日もタダ飯だな。"
"1006905-36-お客さん" = "やっぱ、人気店ほどああいうのが効くもんだな。"
"1006905-37" = "[ns] \"ちょっといいかな？\""
"1006905-38-お客さん" = "あん？誰だよ、アンタ。"
"1006905-39" = "[s1] \"ヴァルキューレ生活安全局の事件記録で見たよ。\"\n[s2] \"食事に異物を入れて、無銭飲食する常習犯の記録を。\""
"1006905-40-お客さん" = "な、何のことだ？#nそもそも、アンタは一体何者なんだ？"
"1006905-41-お客さん" = "一般人が、どうしてそんな記録を……！"
"1006905-42-お客さん" = "もしかして……アンタが噂の「シャーレの先生」なのか……？"
"1006905-43" = "[s] \"はじめまして、シャーレの先生です。\""
"1006905-44-お客さん" = "くっ……！"
"1006905-45-お客さん" = "は、はっ！だからどうした！？#nアンタ1人で一体何ができるってんだ！"
"1006905-46-？？？" = "たしかに先生だけじゃ、キミを捕まえられないかもしれないけど……#nあたしが来たら、話は別だよね。"
"1006905-47-お客さん" = "だ、誰だっ！？"
"1006905-48-ルミ" = "またお会いしましたね……お客様？"
"1006905-49-お客さん" = "お、お前は……！"
"1006905-50-お客さん" = "い、今さら金を払えなんて言われても無理だからな！#nお代は要らないんだろう！？"
"1006905-51-ルミ" = "そうだね。別にお金を返してもらいに来たわけじゃないよ。#nま、最初から怪しいなとは思ってたけど……"
"1006905-52-ルミ" = "あそこでは、お店の責任者としての対応をするしかなかった。"
"1006905-53-ルミ" = "でも今は、あたしが個人的な「挨拶」に来ただけ。"
"1006905-54-お客さん" = "な、何をする気だっ！？それ以上近づくな！"
"1006905-55-ルミ" = "それは無理なお話だよ。"
"1006905-56-ルミ" = "その嘘を、あたしは絶対に許さない。"
"1006905-57-ルミ" = "まずは生徒として、先生を軽んじた言動は許せないし――"
"1006905-58-ルミ" = "先輩として――あたしの大事な後輩に嫌な思いをさせたことも許せない。"
"1006905-59-ルミ" = "――最後に、料理長として、お店の衛生管理にケチをつけたことも許せない。"
"1006905-60-ルミ" = "うわああああああ！"
"1006905-61" = "（ルミのパンチが、無銭飲食客の真横の壁にめりこんだ)"
"1006905-62-ルミ" = "ふぅ……ありがと、先生。"
"1006905-63-ルミ" = "先生が諦めずに追いかけてくれたおかげだよ。"
"1006905-64" = "[s3] \"大したことじゃないよ。\"\n[s4] \"ヴァルキューレ警察学校が、すぐ来てくれるって。\""
"1006905-65-ルミ" = "はははっ。本当に抜かりないね、先生は。"
"1006905-66-ルミ" = "それじゃ、お礼に……"
"1006905-67" = "[s5] \"いや、今日は気持ちだけ受け取るよ。\"\n[s6] \"そろそろシャーレに戻らないといけないんだ。\""
"1006905-68-ルミ" = "うん、だから、シャーレまで届けに行くよ。"
"1006905-69-ルミ" = "お昼ご飯も途中で邪魔が入っちゃったしさ。#nデザートもサービスしとくよ。"
"1006905-70" = "[s] \"ルミはみんなに料理を振る舞うのが好きだよね。\""
"1006905-71-ルミ" = "好き……というか、もうクセみたいなものかな。"
"1006905-72-ルミ" = "なんたって、あたしは料理長だからね！"
