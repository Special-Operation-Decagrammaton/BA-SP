[translation]
"2600415-1" = "習慣と時間"
"2600415-3-シミコ" = "先生……。"
"2600415-4-シミコ" = "見るからにお疲れですね。"
"2600415-5" = "[s1] \"情けない姿なんて見せちゃダメなのに……！\"\n[s2] \"つい本音を漏らしてしまった……。\""
"2600415-8-シミコ" = "いえいえ、素直に話してくださって嬉しいです。"
"2600415-9-シミコ" = "ここでゆっくり休んでいってください。"
"2600415-13-シミコ" = "特等席をご用意しましたので！"
"2600415-14" = "[s] \"お言葉に甘えさせてもらうね。\""
"2600415-18-シミコ" = "……あっ。来客用のクッション、破れていますね。"
"2600415-19-シミコ" = "これは縫い直さないと……。"
"2600415-20" = "[s] \"私は気にしないよ？\""
"2600415-21-シミコ" = "ダメです！読書も休息も、環境が大事なんですから。"
"2600415-22-シミコ" = "とはいえすぐには直せませんし、代わりに――"
"2600415-27-シミコ" = "私のですが、これを使ってください！"
"2600415-28-シミコ" = "こうして……こうやって置けば……よし！#n先生、こちらにどうぞ。ずっと座っていても痛くならないはずです。"
"2600415-29" = "[s3] \"おぉ……ふかふかだぁ……！\"\n[s4] \"雲みたいだぁ……。\""
"2600415-32-シミコ" = "ふふっ、準備した甲斐がありましたね。"
"2600415-33-シミコ" = "実は、休むのに最適な置き方を試してみたんです。#n最近読んだ解剖学の本に曰く、効果的な座り方なのだそうですよ。"
"2600415-34-シミコ" = "それにしても……。"
"2600415-35-シミコ" = "よかったです。私のクッションをご満足いただけているようで。"
"2600415-36-シミコ" = "ちょっと古いですし、ところどころ修理の跡が残ってて、みすぼらしいので……。"
"2600415-37" = "[s] \"愛着が感じられて素敵だよ！\""
"2600415-41-シミコ" = "ふふっ、ありがとうございます。"
"2600415-42-シミコ" = "私、物をできるだけ長く使ってあげたくて……そのせいで、直せないくらいボロボロになるまで使っちゃうんですけどね。"
"2600415-43-シミコ" = "このクッションはフカフカさが良い感じで、布が柔らかいのもお気に入りで。"
"2600415-44-シミコ" = "破れても、その都度縫い直して使ってきました。"
"2600415-45-シミコ" = "それに長く使っていると、綿が凹んで体にフィットする形になるんです。"
"2600415-46-シミコ" = "つまり、日ごろの習慣と使ってきた時間が染み込んでいると言えますね。"
"2600415-47-シミコ" = "なので背もたれにしても、抱き枕にしても収まりがいいんですよ。"
"2600415-48-シミコ" = "さあ、説明はこのくらいで。存分に休んでくださいね！"
"2600415-49" = "[s5] \"でも、借りちゃっていいの？\"\n[s6] \"シミコを床に座らせるのは悪いよ。\""
"2600415-52-シミコ" = "ご心配には及びません。"
"2600415-53-シミコ" = "先生のための秘策が、もう1個あるので。"
"2600415-58-シミコ" = "さあ、目を閉じて、体の力を抜いてください。"
"2600415-59-シミコ" = "先生が眠るまで、隣で読み聞かせしますね。"
"2600415-60-シミコ" = "遠慮なんて……しませんよね？"
"2600415-67-シミコ" = "あーあー、こほん。"
"2600415-68-シミコ" = "むかーし、むかし、あるところに。"
"2600415-73-シミコ" = "連体修飾語になれなかった、寂しい助動詞が住んでいました――"
"2600415-74" = "[s] \"童話じゃない！？\""
"2600415-76" = "（フカフカのクッションとシミコの優しい声に包まれて、意識を手放した）"
"2600415-80" = "（ぐっすり眠れて、元気を取り戻した）"
