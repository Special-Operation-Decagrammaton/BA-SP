[translation]
"1013302-1" = "メイドロボットとは"
"1013302-2" = "（リオがちゃんと部屋を片づけているか心配になり……）"
"1013302-3" = "（少し様子を見に行くことにした）"
"1013302-4-リオ" = "先生？何か用かしら？"
"1013302-5" = "[ns1] \"……お？\"\n[ns2] \"おおお……！！\""
"1013302-6-リオ" = "……？"
"1013302-7" = "[ns3] \"部屋が綺麗だ……！\"\n[ns4] \"やればできるじゃん！\""
"1013302-8-リオ" = "ああ、それを心配して来てくれたのね。"
"1013302-9-リオ" = "今はもう平気よ。片づけを手伝ってくれる子がいるの。#n良い機会だから紹介するわ――"
"1013302-10-リオ" = "家事担当のアバンギャルド君よ。"
"1013302-11-リオ" = "ベースはそのままに、家事全般をできるよう改造を施したの。"
"1013302-12-リオ" = "どうかしら？悪くない出来だと思うのだけれど。"
"1013302-13" = "[ns] \"自分で片づけてるわけじゃなかったんだ……。\""
"1013302-14-リオ" = "このアバンギャルド君を作ったのは私よ？#nそれは、私が片づけたのと同義ではないかしら。"
"1013302-15-リオ" = "今回の試みは大成功と評して申し分ないわ。"
"1013302-16-リオ" = "学園に戻っても、このままアバンギャルド君に家事をやらせようと思うの。"
"1013302-17-リオ" = "あわよくば量産して普及させるのも悪くないわね。"
"1013302-18" = "[s] \"それなら普通のメイドロボットがいいな！\""
"1013302-19-リオ" = "メイドロボット……？"
"1013302-20-リオ" = "家事を手伝ってくれるロボットのことを指すのだったかしら。"
"1013302-21-リオ" = "であれば、条件はクリアしているわ。"
"1013302-22-リオ" = "アバンギャルド君もメイドロボットと言えるはずよ。"
"1013302-23-リオ" = "はい？足りない要素がある？"
"1013302-24-リオ" = "……ああ、そうね。大事なことを忘れていたわ。"
"1013302-25-リオ" = "メイド服を着せていなかったわね。"
"1013302-26-リオ" = "では正式版ではメイド服を着せて普及させましょう。"
"1013302-27" = "[s] \"それは考え直してほしいかな！？\""
"1013302-28-リオ" = "理由が分からないわ。"
"1013302-29-リオ" = "メイド服を着せれば要素が揃うのではなくて？"
"1013302-30" = "[s] \"もっと見た目にこだわって欲しいな！\""
"1013302-31-リオ" = "もう少し詳しく説明してもらえるかしら。"
"1013302-32-リオ" = "先生の理想の「メイドロボット」とはどのようなものなの？"
"1013302-33" = "[s] \"可愛くて、愛嬌があって！\""
"1013302-34-リオ" = "アバンギャルド君も……可愛くて愛嬌があると思うのだけれど……。"
"1013302-35" = "[s] \"清楚で上品な佇まい！\""
"1013302-36-リオ" = "アバンギャルド君も……見方によれば、あるいは。"
"1013302-37" = "[s] \"何でもできる頼もしい存在！\""
"1013302-38-リオ" = "アバンギャルド君も……同じね？"
"1013302-39" = "[s] \"……あと、可愛いメイド服！\""
"1013302-40-リオ" = "メイド服の話は既にしたと思うのだけれど……。"
"1013302-41-リオ" = "とはいえその点においても、やはりアバンギャルド君は優位性を持っているわ。"
"1013302-42-リオ" = "例えば、C&Cの子たちもメイド服を着ているわ。#nけれど彼女たちはロボットではないから、「メイドロボット」ではない。"
"1013302-43-リオ" = "たとえアリスに着せたとしても、「メイドロボット」にはならない。#nあの子は、ロボットではなく人間だもの。"
"1013302-44-リオ" = "けれどアバンギャルド君は正真正銘のロボット。"
"1013302-45-リオ" = "家事手伝いのアバンギャルド君にメイド服を着せたなら――"
"1013302-46-リオ" = "立派なメイドロボットよ。"
"1013302-47" = "[s] （な、なんだかそんな気がしてきた……けど……！）"
"1013302-48-リオ" = "……まだ認識に齟齬があるようね。"
"1013302-49-リオ" = "ここまで意見が割れるとは思わなかったわ。"
"1013302-50-リオ" = "2人の議論で決着を見ないのであれば、より多くの意見を集めましょう。"
"1013302-51-リオ" = "差し当たって、メイド服を着せたアバンギャルド君をみんなに見せてくるわ。"
"1013302-52-リオ" = "メイド服とロボット――"
"1013302-53-リオ" = "それが合わさってメイドロボット。"
"1013302-54-リオ" = "この事実の前には、みんな認めざるを得ないはずよ。"
"1013302-55" = "[s] \"メイド服はどこで手に入れるつもり……？\""
"1013302-56-リオ" = "トキなら予備を持っているのではないかしら。"
"1013302-57" = "[s] \"絶対サイズ合わないって……！！\""
"1013302-58-リオ" = "その時はアバンギャルド君を服のサイズに合わせて改造するわ。"
"1013302-59-リオ" = "ともかく、今からメイド服を借りてくるわね。"
"1013302-60-リオ" = "では……後ほど。"
"1013302-61" = "[ns] \"リオ、本気なんだね……。\""
"1013302-62" = "（果たして、結果はいかに……）"
