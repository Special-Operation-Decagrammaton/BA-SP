[translation]
"1012903-1" = "目が眩むほどに堂々と"
"1012903-2" = "（今日も平和だなぁ……）"
"1012903-3" = "（そんなことを思いながら、公園のベンチに座っていると……）"
"1012903-4-スズミ" = "先生！"
"1012903-5-スズミ" = "少し、後ろをお借りします！"
"1012903-6" = "[s] \"スズミ！？どうしたの！？\""
"1012903-7-スズミ" = "前を向いて、素知らぬ顔をしていてください。"
"1012903-8-スズミ" = "追っ手がいます。"
"1012903-9" = "[s] 言う通りにする。"
"1012903-10-スケバンA" = "こっちにきたはずだ！"
"1012903-11-スケバンB" = "あいつ、捕まえたら倍返しにしてやる！！"
"1012903-12-スケバンC" = "絶対逃がすなよ！"
"1012903-13-スケバンC" = "全員、公園を包囲しろ！"
"1012903-14-スケバンC" = "白い髪で、グレーのトリニティの制服だ。#n見つけたらその場でやっちまえ！"
"1012903-15" = "[ns1] \"スズミのファン？\"\n[ns2] \"スズミのお友達？\""
"1012903-16-スズミ" = "……ではありません。"
"1012903-17-スズミ" = "公園の外側の方へ行ったようですね……。"
"1012903-18-スズミ" = "服のお直しに向かう途中で、奇襲を受けたんです。"
"1012903-19-スズミ" = "弾薬が底をついてしまい、正面突破も難しく……。"
"1012903-20-スズミ" = "先生のおかげで危機は脱したものの、これからどうすれば良いか……。"
"1012903-21" = "[s] \"相手は何人いるの？\""
"1012903-22-スズミ" = "正確な数はわかりません……。"
"1012903-23-スズミ" = "道中で90人ほど制圧しましたが、まだ2倍以上の人数が残っているようで。"
"1012903-24" = "[s3] \"90人！？\"\n[s4] \"あと200人はいるってこと！？\""
"1012903-25-スズミ" = "はい、おそらく。"
"1012903-26-スズミ" = "あの数を正面から相手にするのは難しいでしょう。"
"1012903-27-スズミ" = "……ふぅ。"
"1012903-28-スズミ" = "ですが、先生のおかげで少し休めました。#n包囲が手薄なところをなんとか突破できないか、試してみます。"
"1012903-29-スズミ" = "急いで公園を離れてください。巻き込むわけにはいきません。"
"1012903-30-スズミ" = "うっ……。"
"1012903-31" = "[s] \"スズミ！怪我してる？\""
"1012903-32-スズミ" = "少し、足を捻ったみたいです。"
"1012903-33-スズミ" = "走れはしませんが……大丈夫です。"
"1012903-34" = "[s5] \"無理しちゃダメ！\"\n[s6] \"何か方法を探そう！\""
"1012903-35-スズミ" = "彼女たちは私の姿を知っています。#n脱出時の衝突は……避けられません。"
"1012903-36-スズミ" = "ここは私に任せて、先生はどうか……。"
"1012903-37" = "[s7] \"……良い案を思いついたよ。\"\n[s8] \"私の言う通りにして。\""
"1012903-38-スズミ" = "いえ、先生を危険にさらすなんて……！"
"1012903-39" = "[s] \"私はスズミの先生だよ？\""
"1012903-40-スズミ" = "……分かりました。一体、どのような策なのでしょうか？"
"1012903-41-スズミ" = "せ、先生――"
"1012903-42-スズミ" = "この服を着るのが「良い案」なんですか！？"
"1012903-43" = "[s] \"直しに行く前でよかった！\""
"1012903-44-スズミ" = "数で勝る相手に、これでは動きづらくて不利です。"
"1012903-45-スズミ" = "もしかして……この状況でご冗談を……！？"
"1012903-46" = "[s9] \"さっきの会話、聞こえてたでしょ？\"\n[s10] \"「グレーのトリニティの制服」って。\""
"1012903-47-スズミ" = "！！"
"1012903-48-スズミ" = "そう、でしたね……。"
"1012903-49-スズミ" = "彼女たちの知る私の特徴は、すべて伝聞によるもの。"
"1012903-50-スズミ" = "写真は撮られていないようですので、具体的な見た目までは知らないはず。"
"1012903-51-スズミ" = "変装すれば……衝突なく抜け出せるかもしれません。"
"1012903-52-スズミ" = "でもこの格好は……やはり恥ずかしいです……!"
"1012903-53" = "[s11] \"魔法少女は、正義の味方だから……。\"\n[s12] \"まさに、この状況にピッタリだよ。\""
"1012903-54-スズミ" = "そんなことを言われましても……#nはぁ、承知しました。"
"1012903-55-スズミ" = "ひとまず、危険ですので先生は離れていてください。"
"1012903-56" = "[s] \"えっと、実は作戦には続きがあって――\""
"1012903-57-スケバンX" = "今のところ見てないよな？例のトリニティの制服。"
"1012903-58-スケバンY" = "ああ、でも関係ないやつは外に出してるからな。#n時間の問題だ。"
"1012903-59-スケバンX" = "あいつ、絶対捕まえてボコボコに……！"
"1012903-60-スケバンY" = "……うん？"
"1012903-61-スズミ" = "て、テルミットホワイト、登場～！"
"1012903-62-スケバンX" = "？？？？？"
"1012903-63-スケバンY" = "あれ、隣にいるのってシャーレの先生じゃね？"
"1012903-64-スケバンX" = "スマホで動画撮ってる……？"
"1012903-65-スズミ" = "準備オッケーのシューターから、撃ち方～始め～！☆"
"1012903-66" = "[s] \"いいよいいよ！その照れがいい！サイコー！\""
"1012903-67-スズミ" = "あ、あなたの瞳に……フラッシュバ～ン☆"
"1012903-68-スケバンY" = "先生って、ああいう趣味なんだ……。"
"1012903-69-スケバンX" = "お、おい……こっちに来るぞ。退いてやれ。"
"1012903-70-スケバンX" = "……あれが噂の……シャーレの当番の仕事、なんだな。"
"1012903-71-スケバンY" = "大変そうだ……。"
"1012903-72-スズミ" = "み、道をあけてくれてありがとうね！妖精さんたち！"
"1012903-73-スケバンX" = "あ、はい……。"
"1012903-74-スケバンY" = "い、行こうぜ、先生と目合わせんなよ……。"
"1012903-75-スズミ" = "……本当に、うまくいきましたね。"
"1012903-76-スズミ" = "まさか先生もカメラマンに「変身」する作戦とは……。"
"1012903-77" = "[s13] \"あ、今のところカットで。\"\n[s14] \"セリフを続けて！テルミットホワイト！\""
"1012903-78-スズミ" = "ほ、本当にカメラを回していたんですか！？"
"1012903-79" = "（その後も、スケバンたちは私を避けていき……）"
"1012903-80" = "（スズミと無事、公園を抜け出すことができた）"
