[translation]
"1012902-1" = "トリニティのマジカル自警団"
"1012902-2" = "（夜勤中、軽い運動も兼ねてシャーレを見回っていたところ……）"
"1012902-3" = "（灯りのついてる更衣室を見かけた)"
"1012902-4" = "[ns1] （消し忘れ？）\n[ns2] （まだ誰かいるのかな？）"
"1012902-5" = "[ns3]（誰もいないみたい）\n[ns4] ゆっくりドアを開く。"
"1012902-6" = "[wa:270]― [log=스즈미 매지컬]せ、[wa:430]先生！？[/log]"
"1012902-7" = "― [log=스즈미 매지컬]な、[wa:370]なにか[wa:500]ご用件でも！？[/log]"
"1012902-8" = "― [log=스즈미 매지컬]というか、[wa:780]いつからいらしてたんですか！[/log]"
"1012902-9" = "[ns5] \"ご、ごめん！誰もいないものだとばかり……！\"\n[ns6] \"ノックしたけど、返事がなかったから……！\""
"1012902-10" = "[wa:770]― [log=스즈미 매지컬]音楽に集中していたので[/log]"
"1012902-11" = "[wa:770]― [log=스즈미 매지컬]音楽に集中していたので[/log]"
"1012902-12" = "― [log=스즈미 매지컬]全然気づいておらず……。[/log]"
"1012902-13" = "― [log=스즈미 매지컬]でも、[wa:710]相手が先生で[wa:650]良かったです。[/log]"
"1012902-14" = "[wa:2300]― [log=스즈미 매지컬]あっ、[wa:630]こ、[wa:450]この衣装は、[wa:1020]その……！[/log]"
"1012902-15" = "― [log=스즈미 매지컬]自警団の[wa:800]潜入捜査の[wa:670]ため、[wa:690]でして……。[/log]"
"1012902-16" = "― [log=스즈미 매지컬]わ、[wa:250]私の趣味というわけでは……！[/log]"
"1012902-17" = "― [log=스즈미 매지컬]違います！[wa:700]本当に！[/log]"
"1012902-18" = "[ns] \"似合ってるよ、可愛い。\""
"1012902-19" = "[wa:550]― [log=스즈미 매지컬]サイズが合うか[/log]"
"1012902-20" = "― [log=스즈미 매지컬]事前に[wa:270]確認しようと思って[wa:1150]着ただけで……！[/log]"
"1012902-21" = "― [log=스즈미 매지컬]（か、[wa:850]可愛いと言ってくださりました……）[/log]"
"1012902-22" = "― [log=스즈미 매지컬]（いきなり褒められると……[wa:1910]うぅ……！）[/log]"
"1012902-23" = "― [log=스즈미 매지컬]（褒められるのは、[wa:1050]まだ慣れません。）[/log]"
"1012902-24" = "― [log=스즈미 매지컬]（嬉しくはありますが……！[wa:2500]でも……！）[/log]"
"1012902-25" = "[wa:1170]― [log=스즈미 매지컬]今日見たことは、[/log]"
"1012902-26" = "― [log=스즈미 매지컬]他の方には[wa:650]内緒にしてくださいね！[/log]"
"1012902-27" = "― [log=스즈미 매지컬]これは、[wa:1320]機密事項……[wa:1570]なので！[/log]"
"1012902-28-スズミ" = "ところで、更衣室に何かご用でしたか？"
"1012902-29" = "[s7] \"灯りがついてたから。\"\n[s8] \"誰か倒れてるのかなって。\""
"1012902-30-スズミ" = "なるほど。シャーレのパトロールを。"
"1012902-31-スズミ" = "生徒の安全のため……まるで自警団のようですね。"
"1012902-32" = "[s] \"うん、スズミを見習ってね。\""
"1012902-33-スズミ" = "！！！"
"1012902-34-スズミ" = "……先生は、いつも勇気をくださりますね。"
"1012902-35-スズミ" = "そんなところが……。"
"1012902-36-スズミ" = "そ、そろそろ、着替えたいのですが……。"
"1012902-37" = "[s] \"あ、そうだね！失礼しました！\""
"1012902-38-スズミ" = "またお会いしましょう。"
"1012902-39-スズミ" = "今日のことは、どうか他言無用でお願いします。"
"1012902-40" = "（その後、オフィスに戻って仕事を片づけた）"
"1012902-41" = "（帰り際に寄ってみると、更衣室の電気はちゃんと消えていた）"
