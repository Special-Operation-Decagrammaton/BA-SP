[translation]
"2004903-1" = "砂遊びもつまらない"
"2004903-2-ミサキ" = "……あ、先生。"
"2004903-3-ミサキ" = "来る気はしてたけど……。"
"2004903-4-ミサキ" = "モモトークがあんな感じだったから……。#n先生だったらそうするかなって。"
"2004903-5-ミサキ" = "前回はまんまと乗せられたけど……今回も同じだとは思わないで。"
"2004903-6" = "[s1] \"砂のお城作り……面白いのに。\"\n[s2] \"ミサキと……お城……。\""
"2004903-7-ミサキ" = "またそうやって……！"
"2004903-8-ミサキ" = "言ったでしょ？もうつきあわないって。"
"2004903-9-ミサキ" = "そもそも、砂で城を作ろうとするのが理解できない。"
"2004903-10-ミサキ" = "どうせ最後は崩れるのに。なんでわざわざ……。"
"2004903-11-ミサキ" = "あぁ、別に先生が一人でやるのは勝手だよ。"
"2004903-12-ミサキ" = "好きなだけどうぞ。"
"2004903-13" = "[ns] ミサキの隣で砂の城を作り始める。"
"2004903-14-ミサキ" = "……。"
"2004903-15-ミサキ" = "…………。"
"2004903-16" = "[s] \"うーん、何度やっても崩れちゃうな……。\""
"2004903-17-ミサキ" = "……砂を積むだけじゃすぐ崩れるよ。#n水を加えて固めないと。"
"2004903-18-ミサキ" = "ちょっと貸して。"
"2004903-19-ミサキ" = "まず水で湿らせて……#nバケツに入れて固めたあと、ひっくり返せば――"
"2004903-20-ミサキ" = "ほら、崩れない。"
"2004903-21-ミサキ" = "あとはこうやって木の枝を挿して……周りの形も……。"
"2004903-22" = "[wa:550]― [log=미사키 수영복]ん……。[/log]"
"2004903-23" = "― [log=미사키 수영복]もうちょっと……[wa:1680]こっちも削って……。[/log]"
"2004903-24" = "[wa:1840]― [log=미사키 수영복]ここに枝を……[wa:2080]この角度で……。[/log]"
"2004903-25" = "― [log=미사키 수영복]……[wa:1510]うん、[wa:1430]これでいいかな。[/log]"
"2004903-26" = "[wa:1880]― [log=미사키 수영복]……あれ？[/log]"
"2004903-27" = "― [log=미사키 수영복]なんで私、[wa:1720]砂の城なんて[wa:1130]作ってるの……？[/log]"
"2004903-28" = "[wa:530]― [log=미사키 수영복]……っ！[wa:1640]先生……！[/log]"
"2004903-29" = "[ns] \"えっ、いや、私は……。\""
"2004903-30" = "[wa:830]― [log=미사키 수영복]最初から[wa:610]こうさせるつもりだったんじゃ……！[/log]"
"2004903-31" = "― [log=미사키 수영복]……[wa:450]全然、[wa:1820]これっぽっちも、[wa:1670]楽しんでないからね！[/log]"
"2004903-32" = "[ns3] \"でも、素敵なお城じゃない？\"\n[ns4] \"時間をかけた分、きれいにできたんじゃないかな。\""
"2004903-33-ミサキ" = "何だっていいよ。#nどうせ崩れちゃうし、意味のないことだから……。"
"2004903-34-ミサキ" = "そんなに頑張ってもないし。"
"2004903-35-ミサキ" = "まあでも……悪くは――"
"2004903-36" = "[ns] \"あっ、お城が……。\""
"2004903-37-ミサキ" = "……。"
"2004903-38" = "[s] \"崩れちゃった……。\""
"2004903-39-ミサキ" = "ほらね……結局、全部無駄なんだよ。"
"2004903-40-ミサキ" = "いくら頑張ったって、振り出しに戻るだけ。"
"2004903-41-ミサキ" = "砂の城は、砂に戻った。"
"2004903-42-ミサキ" = "何も残らない、ただの徒労。"
"2004903-43" = "[s5] \"でも、全部が無意味だったわけじゃないよ。\"\n[s6] \"いい写真が撮れたからね。\""
"2004903-44-ミサキ" = "……どういうこと？"
"2004903-45-ミサキ" = "見て……って。"
"2004903-46-ミサキ" = "……っ！？！？"
"2004903-47-ミサキ" = "これ、いつの間に……！！"
"2004903-48" = "[s] \"頑張ってる姿ってカッコイイよね！\""
"2004903-49-ミサキ" = "消して。"
"2004903-50-ミサキ" = "今すぐ。"
