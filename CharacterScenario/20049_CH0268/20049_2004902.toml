[translation]
"2004902-1" = "海はつまらない"
"2004902-2" = "（浜辺に行くと、ミサキはパラソルの下にいた）"
"2004902-3-ミサキ" = "……わざわざ来るなんて、先生って暇なんだね。"
"2004902-4" = "[s1] \"ミサキが暇そうだったから、来ちゃった。\"\n[s2] \"ほら、一緒に遊ぼうよ！\""
"2004902-5-ミサキ" = "遠慮しとく。"
"2004902-6-ミサキ" = "そもそも、なんでみんな海が好きなの？"
"2004902-7-ミサキ" = "日差しは強いし、カモメはうるさい。#n肌は潮風でベタベタするし……。"
"2004902-8-ミサキ" = "ついてきてみたけど、全然良さが分かんない……。"
"2004902-9" = "[s] \"海は初めてなんだよね？\""
"2004902-10-ミサキ" = "そうだね。"
"2004902-11-ミサキ" = "遊び方を知らないだけ……？#nそれって、どういうこと？"
"2004902-12" = "[s3] \"ミサキ、暑そうにしてるから……。\"\n[s4] \"今、海に入ったら……すっごく気持ちいいと思うなぁ。\""
"2004902-13-ミサキ" = "別に、暑いのは慣れてる。"
"2004902-14-ミサキ" = "いつも冷房のないところで生活してるし。#nわざわざ体を冷やす必要も感じないかな。"
"2004902-15" = "[s] \"でも、私はミサキと泳ぎたいなぁ……。\""
"2004902-16-ミサキ" = "それに何の意味があるの……？"
"2004902-17" = "[s] \"一緒に泳いだら、とーっても楽しいのになぁ……。\""
"2004902-18-ミサキ" = "そんなこと言われても、入らないよ。"
"2004902-19-ミサキ" = "……。"
"2004902-20-ミサキ" = "入らないってば……。"
"2004902-21" = "[s] \"ミサキと……海……。\""
"2004902-22-ミサキ" = "あー……もう……。"
"2004902-23-ミサキ" = "私……なの。"
"2004902-24" = "[s] \"え……？\""
"2004902-25-ミサキ" = "私、カナヅチなの！"
"2004902-26-ミサキ" = "はぁ……。"
"2004902-27" = "[s] \"大丈夫だよ、私が教えるから。\""
"2004902-28-ミサキ" = "先生が？"
"2004902-29-ミサキ" = "わざわざそこまでする意味……ある？#nどうせ、この先泳ぐことなんてないと思うけど。"
"2004902-30-ミサキ" = "……って、なんでそんな楽しそうなの？"
"2004902-31-ミサキ" = "意味が分からない。"
"2004902-32-ミサキ" = "はぁ……。"
"2004902-33-ミサキ" = "……分かった。いいよ、そこまで言うならつきあってあげる。"
"2004902-34-ミサキ" = "……どうせ無意味だろうけど。"
"2004902-35" = "[s] \"よし！それじゃあ浮き輪を借りに行こうか！\""
"2004902-36-ミサキ" = "浮き輪って……子供じゃないんだから。"
"2004902-37" = "（ミサキに泳ぎ方を教えながら海を楽しんだ）"
