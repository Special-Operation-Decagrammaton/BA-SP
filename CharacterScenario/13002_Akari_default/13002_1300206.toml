[translation]
"1300206-1" = "美食家の矜持"
"1300206-2" = "ゲヘナ学園・近郊の中華料理屋"
"1300206-3" = "ゲヘナ学園での仕事を終えて、帰り道に寄った中華料理屋で、偶然アカリに会った。"
"1300206-4-アカリ" = "あらっ、先生。偶然ですね、お昼ごはんですか？"
"1300206-5-アカリ" = "はい、私もそうです。このお店には麻婆豆腐がたくさん食べられる、大食いチャレンジメニューがあるんですよ。"
"1300206-6-アカリ" = "もしよかったら先生も、私と一緒に挑戦しませんか？"
"1300206-7-アカリ" = "え、普通の麻婆豆腐で十分……ですか？#n盛りに盛られた麻婆豆腐、圧巻ですのに……。"
"1300206-8-アカリ" = "でも仕方ありませんね、では注文しましょうか。"
"1300206-9-アカリ" = "普通の麻婆豆腐一つと、チャレンジメニューの麻婆豆腐を一つお願いします。"
"1300206-10-中華レストランの店員" = "かしこまりました。チャレンジメニューは、こちらの方にお渡しで良いでしょうか？"
"1300206-11-アカリ" = "いえ、私です。#nこう見えて大食いには自信がありますので！"
"1300206-12-中華レストランの店員" = "ふふ、なるほど、良い意気込みですね。ですが、うちの麻婆豆腐は一筋縄ではいきませんよ……？"
"1300206-13-中華レストランの店員" = "少々お待ちください、すぐにお持ちいたしますね。"
"1300206-14-アカリ" = "（なんだかあの店員さん、不敵な笑みを浮かべられていたような……気のせいでしょうか？）"
"1300206-15-中華レストランの店員" = "お待たせいたしました。ご注文の麻婆豆腐と、こちらがチャレンジメニューの麻婆豆腐です。"
"1300206-16-中華レストランの店員" = "この10人前の麻婆豆腐を30分以内に完食できればお代はタダです。時間内であれば、それ以上に何度お代わりしていただいても構いません。"
"1300206-17-中華レストランの店員" = "……では、ごゆっくりどうぞ。"
"1300206-18-アカリ" = "ああ、もうこんなに辛くて良い匂いが……。#nすっごく美味しそうです！"
"1300206-19-アカリ" = "では、いただきます！"
"1300206-20" = "[s] \"いただきます。\""
"1300206-21-アカリ" = "……ん？変ですね……ここの麻婆豆腐、こんな味ではなかったような……？"
"1300206-22-アカリ" = "先生。そちらの麻婆豆腐、一口貰っても良いですか？"
"1300206-23" = "[s] こっちの麻婆豆腐を分けてあげた。"
"1300206-24-アカリ" = "モグモグ……なるほど……そういうことですか。#nこんな卑怯な方法を使うお店がまだあっただなんて、ちょっとがっかりですね。"
"1300206-25" = "[s] \"どうしたの？\""
"1300206-26-アカリ" = "先生のと私の、それぞれの味を比べてみたら、こちらのチャレンジメニューの方が明らかに辛いです。異常な量の調味料が入ってますね。……恐らくは、チャレンジを成功させないために。"
"1300206-27-アカリ" = "何でも食べるからと忘れられがちですが、私も美食研究会の一員。甘い料理は好きでも、料理に対しては甘くありません。"
"1300206-28-アカリ" = "いくら量ありきの大食いチャレンジだと言っても、料理に携わる者として守らなくてはならない一線があるはずです。そしてこの行いは……その一線を超えました。"
"1300206-29-アカリ" = "食べ物でいたずらをする人は、きちんとその報いを受けるべき……そうは思いませんか？"
"1300206-30-アカリ" = "……ごちそうさまでした！#nこちらの麻婆豆腐、もう一杯お願いできますか？"
"1300206-31-中華レストランの店員" = "（し、信じられない！食べ始めてまだ10分も経ってないのに、もう食べ終わったっていうのか？）"
"1300206-32-中華レストランの店員" = "（それ一つに、麻婆豆腐が10人前乗ってるんだぞ！？）"
"1300206-33-アカリ" = "すみませーん、いいですか？#nこちらにチャレンジメニューの麻婆豆腐をもう一つお願いします！"
"1300206-34-中華レストランの店員" = "あ、あの、お客様……もうチャレンジは達成されてますので、この辺でお止めになっては……？"
"1300206-35-アカリ" = "何を言っているんですか？「時間内であれば何度お代わりしても」と、最初にあなたが言いましたよね？"
"1300206-36-アカリ" = "チャレンジなのですから、最初に決めたルールをお互いにきちんと守るのがフェアというものではありませんか？"
"1300206-37-アカリ" = "チャレンジメニューに普通は食べられないような辛さの調味料が大量に入っていたにも関わらず、抗議せずにきちんと食べた私のように……そうは思いません？"
"1300206-38-中華レストランの店員" = "す、すみません！お二人の分の代金はいただかなくて結構ですので……どうか、どうかお許しを……！"
"1300206-39-アカリ" = "ダメです。私は麻婆豆腐がたくさん食べたくてこのお店に来たのであって、謝罪が聞きたくて来たわけではありませんので。"
"1300206-40-アカリ" = "さあ、早くもう一皿お願いします！"
"1300206-41" = "その後、アカリはお店の記録を大幅に更新して、30分で60人前の麻婆豆腐を平らげたのであった……。"
