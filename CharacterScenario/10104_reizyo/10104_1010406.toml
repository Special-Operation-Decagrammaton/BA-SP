[translation]
"1010406-1" = "主体と客体"
"1010406-2" = "シャーレ・オフィス"
"1010406-3" = "[ns] \"レイジョ、ごめん！\""
"1010406-4-レイジョ" = "どうされましたか、先生？"
"1010406-5" = "[s] \"それが、その……。\""
"1010406-6-レイジョ" = "……なるほど、急に外回りの仕事が入ったのですね。"
"1010406-7-レイジョ" = "せっかく来てくれたのに、置き去りにするのが申し訳ない、と。"
"1010406-8-レイジョ" = "分かりました。"
"1010406-9-レイジョ" = "でしたら、私も一緒に行きましょう。"
"1010406-10" = "[s] \"良いの……？\""
"1010406-11-レイジョ" = "もちろんです。"
"1010406-12-レイジョ" = "今日の私は、シャーレ当番ですから。"
"1010406-13-レイジョ" = "先生の仕事を手伝うのは、当たり前でしょう。"
"1010406-14-レイジョ" = "それでは……。"
"1010406-15-レイジョ" = "今日一日、先生の護衛はお任せください。"
"1010406-16" = "[ns] \"やっと終わった……。\""
"1010406-17-レイジョ" = "お疲れ様でした、先生。"
"1010406-18-レイジョ" = "シャーレの仕事は、本当に様々なのですね。"
"1010406-19-レイジョ" = "……なるほど。"
"1010406-20-レイジョ" = "どれだけ忙しくても、生徒のために頑張る、と……。"
"1010406-21-レイジョ" = "……先生は、武道についてどう思っていますか？"
"1010406-22-レイジョ" = "急な話で困惑させてしまい、申し訳ありません。"
"1010406-23-レイジョ" = "ですが、私はこう思うのです。#n武道とは、自分を見つめ直すためのものだと。"
"1010406-24-レイジョ" = "体を鍛えることで、精神的にも成長できるはずですから。"
"1010406-25" = "[s] \"そうだね。\""
"1010406-26-レイジョ" = "そして、武道に身を置く一人として……。"
"1010406-27-レイジョ" = "強き者は弱き者を守り、使命を果たす必要があると思います。"
"1010406-28-レイジョ" = "これは，玄龍門が掲げている義と侠に通じているかもしれませんね。"
"1010406-29" = "[s] \"たしかに……。\""
"1010406-30-レイジョ" = "ですから……。"
"1010406-31-レイジョ" = "先生には、私を守る義務があります。"
"1010406-32" = "[s] \"たしかに……って、なんで！？\""
"1010406-33-レイジョ" = "先生は、大人でもあり教育者でもありますから。"
"1010406-34-レイジョ" = "どれだけ忙しくても、生徒のために頑張ると言っていましたし。"
"1010406-35" = "[s1] \"それは、その……！\"\n[s2] \"もちろん、放ってはおけないけど……！"
"1010406-36-レイジョ" = "そう言ってくださると思っていました。"
"1010406-37-レイジョ" = "では、今日一日、先生に守っていただきましょう。"
"1010406-38-？？？" = "……あん？#nお前、プルプル派の連中だろ？"
"1010406-39-チンピラ１" = "誰かと思ったら、プニプニ派じゃねぇか！#nなんか文句あんのか？"
"1010406-40-チンピラ１" = "なんも言ってねーだろ、あぁ！？"
"1010406-41-チンピラ２" = "そっちが最初に突っかかってきたんだろうが！#nぐだぐだプニプニうるせえなぁ！！"
"1010406-42-レイジョ" = "先生……！"
"1010406-43" = "[s3] \"こういう時は……！\"\n[s4] \"とりあえず、逃げよう！\""
"1010406-44-レイジョ" = "先生の判断のおかげで、何とか巻き込まれずに済みましたね。"
"1010406-45-レイジョ" = "どんどん激しくなっているようですが……。"
"1010406-46-レイジョ" = "……先生。"
"1010406-47-レイジョ" = "私を守ってくれるのではなかったのですか？"
"1010406-48" = "[s] \"よく聞いて、レイジョ――\""
"1010406-49-レイジョ" = "……なるほど。"
"1010406-50-レイジョ" = "必ずしも守る方法はひとつではない、と。"
"1010406-51-レイジョ" = "水の流れに逆らわず、待つことも大事なのですね。"
"1010406-52-レイジョ" = "これが、先生の強さ……。"
"1010406-53-レイジョ" = "……よく分かりました。"
"1010406-54-レイジョ" = "私も、ここは流れに身を任せてみようと思います。"
"1010406-55" = "[ns] \"れ、レイジョ！？\""
"1010406-56-レイジョ" = "どうしましたか、先生？"
"1010406-57-レイジョ" = "こうして体をくっつけていたほうが、#n見つかる可能性を下げられるかと。"
"1010406-58" = "[s] \"それは、そうなんだけど……。\""
"1010406-59-レイジョ" = "でしょう？"
"1010406-60-レイジョ" = "……落ち着いてきましたね。"
"1010406-61-レイジョ" = "何だか、先生に守られている実感が湧いてきました。"
"1010406-62-レイジョ" = "……まだ辺りは騒がしいですが。"
"1010406-63-レイジョ" = "先生と一緒だからでしょうか。"
"1010406-64-レイジョ" = "こういう時間も、悪くありません。"
"1010406-65" = "（銃撃戦は、その後も続いたが……）"
"1010406-66" = "（しばらくしてヴァルキューレ警察学校がやって来ると、事態は収束した）"
"1010406-67-レイジョ" = "もう、こんな時間になってしまいましたね……。"
"1010406-68" = "[s] \"仕事は終わってるから安心して。\""
"1010406-69-レイジョ" = "ですが……。"
"1010406-70-レイジョ" = "申し訳ありません、先生。"
"1010406-71-レイジョ" = "私がワガママを言ったせいで……。"
"1010406-72-レイジョ" = "……先生の時間を奪ってしまいました。"
"1010406-73-レイジョ" = "ただ、一度くらい守られる側になってみたかったのです。"
"1010406-74" = "[s] \"大丈夫だよ、レイジョ。\""
"1010406-75-レイジョ" = "しかし……。"
"1010406-76" = "[s5] \"今日は、まだ終わってないから！\"\n[s6] \"山海経に着くまで守ってあげる！\""
"1010406-77-レイジョ" = "……。"
"1010406-78-レイジョ" = "そうですね……。"
"1010406-79-レイジョ" = "では、お言葉に甘えて……。"
"1010406-80" = "（突然、体を寄せてきたレイジョに戸惑っていると……）"
"1010406-81" = "（遠慮がちに体重を預けながら、腕を絡めてきた）"
"1010406-82" = "[ns] \"れ、レイジョ？\""
"1010406-83-レイジョ" = "先生……？"
"1010406-84-レイジョ" = "私を守ってくれるのではありませんでしたか？"
"1010406-85-レイジョ" = "……今日が終わるまでは。"
"1010406-86" = "（この日の帰り道は……）"
"1010406-87" = "（なぜか、いつもより長く感じた）"
