[translation]
"1010403-1" = "面倒見"
"1010403-2" = "玄武商会本店"
"1010403-3-レイジョ" = "お口に合いましたか、先生。"
"1010403-4" = "[s1] \"最高だったよ！\"\n[s2] \"今度はレイジョの料理も食べてみたいな。\""
"1010403-5-レイジョ" = "でしたら良かったです。"
"1010403-6-レイジョ" = "ぜひ、またいつでもお越しください"
"1010403-7-レイジョ" = "……私の料理、ですか？"
"1010403-8-レイジョ" = "たしかに、普段は会長の補佐をしていますが……。"
"1010403-9-レイジョ" = "いつか、先生に料理を振る舞うのも悪くありませんね。"
"1010403-10-玄武商会のメンバー" = "レイジョさん、食材が届いていない店舗があるようです！"
"1010403-11-レイジョ" = "む、どこのお店ですか？"
"1010403-12-玄武商会のメンバー" = "京華坊です！"
"1010403-13-レイジョ" = "……なるほど。"
"1010403-14-玄武商会のメンバー" = "ど、どうすれば？#nこのままではお昼の営業が……！"
"1010403-15-レイジョ" = "ひとまず、本店の倉庫から一部の食材を搬入しましょう。"
"1010403-16-レイジョ" = "それで数時間は持ち堪えられるはずです。"
"1010403-17-レイジョ" = "あとは虹正路3番街の天興楼からも、回してもらいましょうか。#nトラックを二台、飛ばしてください。"
"1010403-18-レイジョ" = "連絡は私が入れておきます。"
"1010403-19-レイジョ" = "食材の費用は、営業終了後に計算して報告してください。"
"1010403-20-玄武商会のメンバー" = "はい、分かりました！"
"1010403-21-レイジョ" = "ふぅ、何とかなりそうですね。"
"1010403-22-食堂の客" = "ここが噂の玄武商会……。"
"1010403-23-食堂の客" = "お～い、一番美味い料理を持ってきてくれ！"
"1010403-24-玄武商会のメンバー" = "えっと、それは……。"
"1010403-25-レイジョ" = "まずは席にご案内します、こちらへどうぞ。"
"1010403-26-レイジョ" = "ご来店ありがとうございます。"
"1010403-27-レイジョ" = "料理長のオススメ料理があるのですが、いかがでしょうか？"
"1010403-28-食堂の客" = "おお、そんなメニューが？"
"1010403-29-レイジョ" = "通常はお出ししていませんが、お客様には特別です。"
"1010403-30-レイジョ" = "わ、私も初めて聞きましたが……。"
"1010403-31-レイジョ" = "……大丈夫です、合わせてください。"
"1010403-32-食堂の客" = "何か問題でも？"
"1010403-33-レイジョ" = "いえ、食材の在庫を確認したところ、問題なさそうです。#nでは、アワビ料理をコースでお出しします。"
"1010403-34-食堂の客" = "そいつは楽しみだ！"
"1010403-35-レイジョ" = "ほ、本当に大丈夫ですか！？"
"1010403-36-レイジョ" = "一番美味しい料理、と言っていましたから。"
"1010403-37-レイジョ" = "それに、安い料理を出すと逆に腹を立てる方もいますし。"
"1010403-38-玄武商会のメンバー" = "それでは、お客様……失礼いたします。"
"1010403-39-レイジョ" = "至急、厨房に伝えてください。"
"1010403-40-玄武商会のメンバー" = "はい、分かりました！"
"1010403-41-レイジョ" = "まったく……今日に限って、どうしてこう忙しいのか。"
"1010403-42-？？？" = "私は確かに支払いましたよ！"
"1010403-43-玄武商会のメンバー" = "ですが……。"
"1010403-44-食堂の客B" = "二重にお金を取るつもりだろう！？"
"1010403-45-レイジョ" = "どうされましたか、お客様？"
"1010403-46-食堂の客B" = "アプリで支払ったのに、決済できてないと言いがかりをつけてきたんだ！"
"1010403-47-食堂の客B" = "これが玄武商会のやり口か！"
"1010403-48-食堂の客B" = "いえ、お客様……。"
"1010403-49-レイジョ" = "私たちにミスがあったのなら、きちんとお詫びします。"
"1010403-50-レイジョ" = "ですが、その前にアプリの支払履歴と防犯カメラを確認してもよろしいでしょうか？"
"1010403-51-レイジョ" = "[ruby=・   ・   ・]手違い[/ruby]があってはいけませんから。"
"1010403-52-食堂の客B" = "なっ……。"
"1010403-53-レイジョ" = "明細なら、すぐお出ししていただけるかと。"
"1010403-54-レイジョ" = "監視カメラの映像も5分ほど時間を頂ければ、確認が終わるはずです。"
"1010403-55-食堂の客B" = "え～っと、たしかアレだ……ちゃんと支払えてなかったような気もするな。"
"1010403-56-食堂の客B" = "だ、だから監視カメラまで確認する必要は……。"
"1010403-57-食堂の客B" = "いえ、誤りがあってはいけませんから。"
"1010403-58-レイジョ" = "それと……当然ですが、この会話もカメラで記録されています。"
"1010403-59-食堂の客B" = "ろ、録音だと！？"
"1010403-60-レイジョ" = "お客様、顔色が……どこか具合でも悪いのでしょうか？"
"1010403-61-食堂の客B" = "大丈夫だ、何でもないっ！"
"1010403-62-レイジョ" = "お騒がせして申し訳ありません、先生。"
"1010403-63" = "[s] \"手際が良くて驚いたよ。\""
"1010403-64-レイジョ" = "きゅ、急に褒めてどうされました？"
"1010403-65-レイジョ" = "もちろん、そう言っていただけるのは嬉しいのですが……。"
"1010403-66-レイジョ" = "この程度の問題は、よくありますから。"
"1010403-67-レイジョ" = "……ただ今日は、なぜかトラブルが多かったような気もしますね。"
"1010403-68-レイジョ" = "まだ大事なイベントは始まっていないというのに……。"
"1010403-69" = "[s] \"まだ何かあるの？\""
"1010403-70-レイジョ" = "その、実は……。"
"1010403-71-レイジョ" = "……このあと、梅花園の園児が団体で来る予定なんです。"
"1010403-72-レイジョ" = "自分で言うのも恥ずかしい限りですが……。"
"1010403-73-レイジョ" = "どのように子どもと接して良いのか分からず……。"
"1010403-74" = "[s] \"なかなか正解は見つからないよね。\""
"1010403-75-レイジョ" = "先生でもそうでしたか。"
"1010403-76-レイジョ" = "小さい子は可愛くて純粋ですが、#nその分、何が起こるか分からないですし……。"
"1010403-77-レイジョ" = "……えっ。#n先生も手伝ってくださるんですか？"
"1010403-78-レイジョ" = "なるほど……ここは素直に甘えさせていただきます。"
"1010403-79-レイジョ" = "ありがとうございます、先生。"
"1010403-80-梅花園の園児A" = "せんせー、このイカ、お花みたい！"
"1010403-81" = "[s] \"すごい不思議だね。\""
"1010403-82-梅花園の園児B" = "タコさんウィンナーってなにー？"
"1010403-83-梅花園の園児B" = "タコさんなの？ウィンナーなの？"
"1010403-84" = "[s] \"タコの形をしてるウィンナーだよ。\""
"1010403-85-梅花園の園児B" = "なら食べてみたい！"
"1010403-86-梅花園の園児B" = "この前ね、梅花園でね、ブロッコリーピーマンチャーハンが出てきて――"
"1010403-87-レイジョ" = "先生は子どもたちの対応に慣れているんですね……。"
"1010403-88-レイジョ" = "よろしければ、コツを聞いてもよろしいでしょうか？"
"1010403-89" = "[s3] \"コツってほどじゃないけど……。\"\n[s4] \"なにも問題を解決する必要はないんじゃないかな。\""
"1010403-90-レイジョ" = "あえて問題を解決しない、と……？"
"1010403-91-レイジョ" = "……たしかに、相談事でも聞くだけで良い場合はありますね。"
"1010403-92-レイジョ" = "参考になりました、先生。"
"1010403-93" = "[s] \"レイジョもやってみる？\""
"1010403-94-レイジョ" = "……はい、もとより、自分の仕事ですから。"
"1010403-95-レイジョ" = "エビ餃子好きー！"
"1010403-96-梅花園の園児C" = "けど豚まんも好き！"
"1010403-97-梅花園の園児C" = "あとはー、焼き餃子も揚餃子も好きー！#nなんかいっぱい具が入ってる餃子も！"
"1010403-98-レイジョ" = "いろんな餃子が好きなんですね。"
"1010403-99-レイジョ" = "あっ。でも、ワカメ餃子は嫌い……。"
"1010403-100-レイジョ" = "そ、それは餃子なんでしょうか……？"
"1010403-101-レイジョ" = "……外食文化が広がるのは胸が痛みます。#nそれほどまでに、料理をする時間がなくなってしまったという証左なのです。"
"1010403-102-梅花園の園児D" = "時間の節約のために外食をしますが、そうして浮かせた時間を仕事のために使ってしまうのですから……。"
"1010403-103-梅花園の園児D" = "経営者だとしてもこの問題からは逃れられません……システム上どうしてもそうなってしまっているから……。"
"1010403-104-レイジョ" = "その、どうかしましたか……？"
"1010403-105-レイジョ" = "いえ……何も問題がないことが、とても悲しいのです。"
"1010403-106-レイジョ" = "……無事、終わりましたね。"
"1010403-107-レイジョ" = "子どもたちにしがみつかれたり、#nお店でかくれんぼが始まろうとした時は戸惑いましたが……。"
"1010403-108" = "[s] \"それだけ仲良くなれたってことじゃないかな。\""
"1010403-109-レイジョ" = "……はい、また遊びにきたい、と言っていました。"
"1010403-110-レイジョ" = "何度聞いても、「また」と言ってもらえるのは嬉しいですね。"
"1010403-111-レイジョ" = "とても不思議な経験でした。"
"1010403-112-レイジョ" = "ありがとうございます。先生。"
"1010403-113" = "[s] \"私は特に何もしてないよ。\""
"1010403-114-レイジョ" = "先生にとっては、そうかもしれませんが……とても、助かりました。"
"1010403-115-レイジョ" = "これからも、ご指導をよろしくお願いいたします。"
