[translation]
"1015106-1" = "天才とこれからも"
"1015106-2-アンナ" = "よいしょー！"
"1015106-6-アンナ" = "うっ、重っ……早くシステム化しないと……。"
"1015106-7" = "[s] \"こんにちは、アンナ！\""
"1015106-11-アンナ" = "あっ、先生！お待ちしてました！"
"1015106-12-アンナ" = "もう一人ではお手上げでして……。"
"1015106-13" = "[s1] \"アンナのためなら、いつでも駆けつけるよ！\"\n[s2] \"何を手伝えばいい？\""
"1015106-16-アンナ" = "今、183号の資料を整理をしていまして。"
"1015106-17-アンナ" = "私は学級委員長なので、183号の全ての記録を管理しています。"
"1015106-18-アンナ" = "けどいざやろうと思ったら、私には整理の才能がありませんでした。"
"1015106-19-アンナ" = "書類を五十音順に並べようと思ったら、#n用紙のサイズがバラバラで見栄えが悪く――"
"1015106-20-アンナ" = "用紙のサイズごとにまとめたら、#n今度は厚さが気になってマイクロメータで測り始めてしまい……。"
"1015106-21-アンナ" = "ほんと、バカみたいですよね。#n自分でも笑っちゃうくらい整理が苦手なんです。"
"1015106-22" = "[s3] \"もう一度一緒にやってみよう！\"\n[s4] \"私も手伝うから！\""
"1015106-27-アンナ" = "お願いします！"
"1015106-35-アンナ" = "何度見ても、とんでもない量ですね……！"
"1015106-36-アンナ" = "183号の先代の記録をはじめ……#n研究や特許の書類、更には生徒個人の資料までありますから。"
"1015106-40-アンナ" = "よしっ！覚悟を決めて、始めましょう！"
"1015106-41" = "[s] \"うん！頑張ろう！\""
"1015106-57-アンナ" = "やっぱり先生と一緒だとスムーズに進みますね。"
"1015106-58-アンナ" = "次は……。"
"1015106-62-アンナ" = "……これは後回しにしましょう。……あはは。"
"1015106-63" = "[s] \"何の資料なの？\""
"1015106-64-アンナ" = "えっと……大したものではありません。私がここに来る前の記録です。"
"1015106-65-アンナ" = "見ると辛くなるので、ここに放置して忘れていました。"
"1015106-66-アンナ" = "えへへ……。"
"1015106-67" = "[s] \"……少し気分転換でもしようか？\""
"1015106-71-アンナ" = "お気遣い、ありがとうございます。"
"1015106-72-アンナ" = "……よろしければ、一緒に見ていただけますか？"
"1015106-73-アンナ" = "先生と一緒なら……ちゃんと向き合えそうです。"
"1015106-74" = "[s] \"アンナの力になれるなら、もちろん。\""
"1015106-75-アンナ" = "……ありがとうございます！"
"1015106-79-アンナ" = "まず、箱を開けることは成功ですね。"
"1015106-80-アンナ" = "意外とラクにできました。えへへ。"
"1015106-81-アンナ" = "わあ、幼稚園の頃に描いたものもありますね。なつかし～"
"1015106-82" = "[s5] \"これ、アンナが描いたの？すごい！！\"\n[s6] \"アンナ博士の説明が聞きたいです！\""
"1015106-85-アンナ" = "わ、分かりました！任せてください！"
"1015106-86-アンナ" = "これは粒子加速器の一種……サイクロトロンの設計図で、#n電磁石で荷電粒子を加速する装置です。#n園児が入手できるもので設計したので、機能自体はシンプルですね。"
"1015106-87-アンナ" = "この頃は物理学に興味があったようです。#nそういえば、幼い時は毎日のように将来の夢が変わっていました。"
"1015106-88" = "[s7] \"サイクロ……すごいね！\"\n[s8] \"園児で物理学を……さすが！\""
"1015106-91-アンナ" = "えへへ……そんな、すごいってほどでも～"
"1015106-95-アンナ" = "ここには設計図がまとめられていますね！#n9歳の時にはレーザージャイロスコープを作ろうとしていたし、#n本当にいろんなものに興味を持っていました。"
"1015106-100-アンナ" = "それとこれは……。"
"1015106-104-アンナ" = "……自分で作った賞状ですね。"
"1015106-105-アンナ" = "11歳の時、アカデミーの大会で大賞を取ったんです。"
"1015106-106-アンナ" = "しかし諸事情で授賞式の開催は中止になり……#n受賞記録は残りましたが、賞状はもらえませんでした。"
"1015106-107-アンナ" = "授賞式で威張りたかったし、#n花束をもらって褒められるのを楽しみにしていたので、#nしばらく泣いてから自分で作ったんです。"
"1015106-108-アンナ" = "でもいざ作ってみると、情けなくなってきて……#n承認欲求の塊は、傍から見たらどれほど見苦しいか#n自分でも分かっていましたから。"
"1015106-109-アンナ" = "意地っ張りで、認められたいという欲求ばかり。#n誰だってめんどくさい人だと思います。"
"1015106-110-アンナ" = "だから壁にかけることもできず、#n恥ずかしくてここに入れっぱなしだったんです。今までずーっと。"
"1015106-114-アンナ" = "……あっ！これは恥ずかしいので、二人の秘密ですよ！"
"1015106-115" = "[s9] \"ちょっと遅くなったけど、今から授賞式をしようか？\"\n[s10] \"ここには……賞を受け取る人も、渡す人もいるから！\""
"1015106-120-アンナ" = "ほ、本当ですか？"
"1015106-121-アンナ" = "すごく嬉しいです！それならちょっと準備しますね！！"
"1015106-122-アンナ" = "外に行ってくるので、少し待っててください！！"
"1015106-132" = "[wa:1250]― [log=안나]本当に、[wa:1950]飾って、[wa:730]しまいました……。[/log]"
"1015106-135" = "― [log=안나]……そんな勇気、[/log]"
"1015106-137" = "―  [log=안나]私には[wa:950]ないと思っていたのに。[/log]"
"1015106-140" = "[ns11] \"大賞、[ruby=にき]仁木[/ruby]アンナ！\"\n[ns12] \"誠実で素晴らしいアンナに、この賞を授与します。\""
"1015106-143" = "[wa:1000]― [log=안나]先生が、[wa:2600]私に……。[/log]"
"1015106-146" = "― [log=안나]……ふふっ、[/log]"
"1015106-148" = "― [log=안나]そんな表彰コメント、[wa:2220]初めて[wa:620]聞きました。[/log]"
"1015106-151" = "― [log=안나]ありがとうございます、 [/log]"
"1015106-154" = "― [log=안나]このような賞を[wa:810]いただくことができて、[/log]"
"1015106-156" = "― [log=안나]本当に[wa:610]光栄です。[/log]"
"1015106-159" = "[wa:2370]― [log=안나]……もっと、[/log]"
"1015106-162" = "― [log=안나]自慢話や[wa:840]苦労話が出てくるかと思ったのですが。[/log]"
"1015106-165" = "― [log=안나]今はもう、[wa:2600]感極まって[wa:1060]しまって……[/log]"
"1015106-167" = "― [log=안나]何がなんだか。[/log]"
"1015106-170" = "[wa:560]― [log=안나]ありがとうございます、[wa:1720]先生。[/log]"
"1015106-173" = "― [log=안나]こんな日が[wa:544]来るだなんて、[/log]"
"1015106-175" = "― [log=안나]本当に思っていなくて……。[/log]"
"1015106-178" = "― [log=안나]夢が一気に、[/log]"
"1015106-180" = "― [log=안나]全て叶ってしまったような……[/log]"
"1015106-183" = "― [log=안나]そんな[wa:580]気持ちです。[/log]"
"1015106-186" = "[ns13] \"私は、これからもずっとアンナの夢を応援しているよ。\"\n[ns14] \"これからも夢に向かって、精一杯挑戦してくれるかな？\""
"1015106-189" = "[wa:680]― [log=안나]これからも、[wa:1700]ずっと……[/log]"
"1015106-192" = "― [log=안나]ええ！[wa:1490]ずっと……。[/log]"
"1015106-194" = "― [log=안나]ふふっ……！[/log]"
"1015106-197" = "（元気を取り戻したアンナと一緒に、最後まで記録を整理した）"
"1015106-198" = "（楽しんでもらえたのか、アンナはずっと笑顔だった）"
