[translation]
"1015103-1" = "天才と検証を"
"1015103-3" = "（アンナを手伝うため、183号特別クラスを訪れた）"
"1015103-5" = "183号特別クラス"
"1015103-7-アンナ" = "先生、本当に誰にも言ってないですよね？"
"1015103-8-アンナ" = "これはものすごい大発明なので、#n秘密が漏れたらとんでもないことになります！"
"1015103-9" = "[s1] \"大丈夫、誰にも話してないよ！\"\n[s2] \"特許を取れるくらいの発明なの？\""
"1015103-12-アンナ" = "特許は関係ありません。183号の発明は学園に帰属するので……。"
"1015103-13-アンナ" = "仮に取るとなっても、書類処理だけで大変ですし……あはは……。"
"1015103-14-アンナ" = "しかし、素晴らしい大発明なのは間違いありません！#nレッドウィンターではもちろん、キヴォトス全域で役に立つはずです！"
"1015103-15-アンナ" = "では……ジャーン！こちらです！"
"1015103-19" = "[ns3] （……容器の中に、泥のようなものが入っている）\n[ns4] \"へ、へえ！凄いね！\""
"1015103-22-アンナ" = "これが凄い……ですか？まだ原材料の状態ですよ？"
"1015103-23-アンナ" = "一目で分かるなんて……やはり先生は優れた鑑識眼をお持ちですね！"
"1015103-24-アンナ" = "これは私が開発した新素材「アンナクリート」です！"
"1015103-25-アンナ" = "非常に頑丈で、好きな形にできて……なんと言っても安い！"
"1015103-26-アンナ" = "言うなれば、安価なコンクリートといったところですね。"
"1015103-27" = "[s] \"すごい！もっと教えて！\""
"1015103-28-アンナ" = "えっへん！それではご要望にお応えして説明します！"
"1015103-29-アンナ" = "これは木くずと古紙から出たパルプを細かく砕いて水と混ぜたもので、#n凍らせると非常に硬くなります。"
"1015103-30-アンナ" = "熱伝導率が低いのでなかなかとけない上……とける速度が蒸発より遅いため、#n水浸しになることがほとんどないんです。"
"1015103-31-アンナ" = "水をかけて再び凍らせれば強度も戻るので、維持補修もラクですし――"
"1015103-32-アンナ" = "中のパルプがしっかり固定してくれるので、#n普通の氷と比べて粘り強さも段違い！砲弾にも耐えますから、高層ビルにも使えます！"
"1015103-33-アンナ" = "不要な木くずや古紙と水しか使わないから、タダ同然！#n常に寒いレッドウィンターにおいては、#n半永久的な素材と言ってもいいでしょう。"
"1015103-34-アンナ" = "いろいろと考え事をする最中、ふと思いついたので実験したところ……#nなんと上手くいったんです！ "
"1015103-35" = "[s] \"考え事？\""
"1015103-36-アンナ" = "ええと……レッドウィンターの公勲保健病院のことなんですが……予算が足りなくて進捗が悪く……。"
"1015103-37-アンナ" = "事務局も予算繰りを頑張ってくれたんですが、極寒ではコンクリート養生の管理が難しく、必要な増築が進んでいなくて……#n科学者として何か手伝えることはないかと考えていたんです。"
"1015103-38-アンナ" = "安くて頑丈な材料があれば……費用も工期も減って、新病棟ができます！#nそしたら、みんなが幸せになると思って！えへへ。"
"1015103-39-アンナ" = "どうです？天才でしょう？"
"1015103-40" = "[s] \"最高だね！これなら恩赦がもらえるかも！\""
"1015103-41-アンナ" = "え？"
"1015103-42-アンナ" = "たしかに、そうかもしれません！#nみんなの喜ぶ姿を想像していたら、つい忘れてました……！"
"1015103-43-アンナ" = "みんなが幸せになるのだから、きっと認めてもらえますよね！"
"1015103-44-アンナ" = "でもそれなら、なおさら報告する前にテストしなければいけません。"
"1015103-45-アンナ" = "ものすごい発明なので、先生と一緒にテストしたかったんです。"
"1015103-46-アンナ" = "では始めましょうか！"
"1015103-47-アンナ" = "子犬号を準備しますね！"
"1015103-54-アンナ" = "先生！準備はいいですか！"
"1015103-55-アンナ" = "子犬号の表面に撒いた「アンナクリート」は完全に凍りました？"
"1015103-56" = "[s] \"うん、しっかり凍ったよ！\""
"1015103-57-アンナ" = "では、準備完了です！"
"1015103-58-アンナ" = "横にあるボタンを押して、大砲を発射してください。#n大きな音が出るので注意してくださいね。"
"1015103-59" = "[s] \"これ……本当に安全なの？\""
"1015103-60-アンナ" = "生身にFlak 41の砲弾を受けたら病院送りかもしれませんが……#n戦車の中ですし、76ミリ程度なら問題ありません！"
"1015103-61-アンナ" = "では、いきましょう！"
"1015103-62-アンナ" = "狙いを定めて――撃て！"
"1015103-64" = "[ns5] \"う、うおおおおお！！\"\n[ns6] （慎重にボタンを押す）"
"1015103-70" = "[ns] \"あ、アンナ……！？無事？\""
"1015103-73-アンナ" = "ええ！大丈夫です！"
"1015103-74-アンナ" = "音、途切れてました？#n嬉しくて大声で叫んじゃったので、マイクが切れちゃったのかもしれません。"
"1015103-75-アンナ" = "子犬号は異常なしです！内側損傷ゼロ。#n「アンナクリート」も剥がれていません。"
"1015103-76-アンナ" = "想定していた5倍以上の強度です！大成功！！ "
"1015103-77-アンナ" = "このくらいの厚さなら、常温ではとけるのに2年。#nレッドウィンターの外気温では、半永久的にとけません！"
"1015103-78-アンナ" = "そうだ！成功を祝してハイタッチしましょう！#n一度してみたかったんです！"
"1015103-79-アンナ" = "すぐに出ますね！よいしょっと！"
"1015103-85-アンナ" = "あれぇー？扉ってこんなに重たかったっけ？"
"1015103-90-アンナ" = "ロックも解除されてるし、外から塞がれてるわけでもないのに……。"
"1015103-94-アンナ" = "あっ。"
"1015103-95" = "[s] \"「アンナクリート」で塞いじゃったの！？\""
"1015103-96-アンナ" = "ということは……常温でもとけるのに2年はかかるから……。"
"1015103-97-アンナ" = "ここに2年も閉じ込められるって……こと……？"
"1015103-98-アンナ" = "ど、どうしよう？う、うわあーん……。"
"1015103-99-アンナ" = "助けてー、せんせー！！"
"1015103-100" = "[s] \"落ち着いて！必ず助けるから！\""
"1015103-101-アンナ" = "うわあーん！！"
"1015103-103" = "（アンナクリートは大砲を何発当ててもビクともしなかった）"
"1015103-104" = "（幸い、落ち着きを取り戻したアンナは#n小型溶接機で床に穴をあけて脱出することができた）"
"1015103-108" = "（しばらくの間、放心しているアンナをなだめた）"
