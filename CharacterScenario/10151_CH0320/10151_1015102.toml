[translation]
"1015102-1" = "天才と実験を"
"1015102-3-アンナ" = "というわけで、先生。"
"1015102-4-アンナ" = "私にレスリングの技をかけてくれますか？"
"1015102-5" = "[s1] \"どうしてそうなるの！？\"\n[s2] \"どういうわけで！？\""
"1015102-8-アンナ" = "あれ？今、子犬の社会化について話してましたよね？"
"1015102-9-アンナ" = "ほら、「攻撃される痛みを知らなければ危ない」って#n書いてあるじゃないですか。"
"1015102-10" = "[s] \"うん。でも、プロレスと何の関係が……？\""
"1015102-11-アンナ" = "大いに関係ありますよ！"
"1015102-12-アンナ" = "たとえば……レスリングの技を学べば、実践すること自体は容易ですが――"
"1015102-13-アンナ" = "どのくらいの力なら、#n安全かつ効果的に技をかけられるかまでは分かりません。"
"1015102-14-アンナ" = "指南書には「適度な力で」と書いてありますが、その「適度」が問題です！ "
"1015102-15-アンナ" = "キログラムエフやニュートンといった具体的な単位や数値がないので、#n全く分かりません。"
"1015102-16-アンナ" = "自分が「適度」と思う力でやって、相手にケガをさせたら大変です！"
"1015102-17-アンナ" = "なので……自分に技をかけてもらって、感覚を掴もうかと。"
"1015102-18-アンナ" = "改めて、私に関節技をかけてくれますか？"
"1015102-19" = "[s3] \"言いたいことは分かったけど！\"\n[s4] \"色んな理由でそれは難しいかな……。\""
"1015102-22-アンナ" = "難しくなんてないです！考えてみてください。"
"1015102-23-アンナ" = "私は先生が信頼できる大人だと判断しました。"
"1015102-24-アンナ" = "なので……私が誰かに技をかけた時、痛がられたとしても――"
"1015102-25-アンナ" = "「シャーレの先生にもしてたから、大丈夫だよ」って反論できます！"
"1015102-26" = "[s5] \"そ、想像するだけで悪寒が……。\"\n[s6] \"そんなこと無理だよ！それに……。\""
"1015102-29" = "[ns] \"アンナを傷つけたくないから……。\""
"1015102-33-アンナ" = "……そうですよね、すみません。一人で盛り上がっちゃって。"
"1015102-34-アンナ" = "あはは……。"
"1015102-35-アンナ" = "こ、コホン。どこまで読みましたっけ……。"
"1015102-36-アンナ" = "……。"
"1015102-37" = "[s7] \"アンナが私に技をかけるのは、どうかな？\"\n[s8] \"私よりも上手だろうし。\""
"1015102-42-アンナ" = "えっ！いいんですか！？"
"1015102-43-アンナ" = "ならお言葉に甘えて！痛かったら、すぐに言ってくださいね？"
"1015102-44" = "[s9] \"いつでもいいよ！\"\n[s10] \"ところで、どんな技なの？\""
"1015102-47-アンナ" = "先生の頭を私の脇に抱え込んで締め上げる、「ヘッドロック」です！"
"1015102-48" = "[s] \"え！？\""
"1015102-52-アンナ" = "やあーっ！"
"1015102-57-アンナ" = "どうでしょう？先生！"
"1015102-58-アンナ" = "どうして無言なんですか？口は塞いでないはずですが……。"
"1015102-59" = "[ns11] \"大丈夫だけど、大丈夫じゃないかも！\"\n[ns12] \"もう十分だよね！？\""
"1015102-62-アンナ" = "よかった、痛くなかったんですね！"
"1015102-63-アンナ" = "これなら、どうですか？"
"1015102-67-アンナ" = "痛かったらすぐに止めますから！"
"1015102-68" = "[ns] \"い、痛い！ってことにしておこう！\""
"1015102-73-アンナ" = "なるほど、このくらいの力で絞めればいいんですね。"
"1015102-74-アンナ" = "ありがとうございます！大変勉強になりました！"
"1015102-75-アンナ" = "忘れないようにメモしておきます！"
"1015102-79-アンナ" = "あれ、先生……なんだか顔色が……。"
"1015102-80-アンナ" = "もしかして、どこか痛むんですか！？"
"1015102-81" = "[s] \"大丈夫！心配ないよ！\""
"1015102-82-アンナ" = "だ、大丈夫じゃなさそう！うわあーん！"
"1015102-84" = "（その後……痛みなどないことを説明し、アンナを安心させた）"
"1015102-85" = "（他の技も試していいかと聞かれたが、丁重にお断りして抜けてきた）"
