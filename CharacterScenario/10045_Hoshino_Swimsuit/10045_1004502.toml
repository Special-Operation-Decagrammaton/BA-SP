[translation]
"1004502-1" = "隠されていた島の宝物"
"1004502-2" = "（ホシノの話を聞いて客室に向かった）"
"1004502-3" = "（…………）"
"1004502-4-？？？" = "うへへ、これだよ、これ～"
"1004502-5" = "（……？）"
"1004502-6-？？？" = "うんうん、いいね……。"
"1004502-7" = "[s1] \"……ホシノ？\"\n[s2] 音がした方に行ってみる。"
"1004502-8-ホシノ" = "……ん？"
"1004502-9-ホシノ" = "あれ？先生、どしたの？"
"1004502-10-ホシノ" = "モモトークで説明はしたような気がするけど……何かあった？"
"1004502-11" = "[s3] \"ここで何してたの？\"\n[s4] \"独り言が聞こえたような気がして……。\""
"1004502-12-ホシノ" = "……独り言？"
"1004502-13-ホシノ" = "……独り言？"
"1004502-14-ホシノ" = "ああ、えっとね……"
"1004502-15-ホシノ" = "……これを見てたの。"
"1004502-16" = "[ns5] \"リゾートガイドマップ？\"\n[ns6] \"ガイドマップがどうしたの？\""
"1004502-17-ホシノ" = "うへー、分かってないなぁ先生。"
"1004502-18-ホシノ" = "うへー、分かってないなぁ先生。"
"1004502-19-ホシノ" = "こことか見てよ、ほら。"
"1004502-20-ホシノ" = "ちょっと使用感があるでしょ？他の誰かが使ってた冊子らしくて。"
"1004502-21-ホシノ" = "こういう誰かが書き込んだマップって、他の人の軌跡が残ってて面白いじゃん？"
"1004502-22-ホシノ" = "だから客室をちょっと調べてたんだ。"
"1004502-23-ホシノ" = "他にも似たようなものないかな～って……"
"1004502-24-ホシノ" = "……ちょっとした宝探しっぽくて楽しいでしょ？"
"1004502-25-ホシノ" = "それで見つかったのがこの部屋に残ってた「宝の地図」なんだ。"
"1004502-26-ホシノ" = "いま、書き込まれた場所とかをチェックしてたとこ。"
"1004502-27-ホシノ" = "あ、そうだ。"
"1004502-28-ホシノ" = "せっかくだし……。"
"1004502-29-ホシノ" = "先生も一緒にお宝を探さない？"
"1004502-30-ホシノ" = "う～ん、この辺のどこかだと思うんだけど……。"
"1004502-31-ホシノ" = "うへ……すごいきれいな景色。"
"1004502-32-ホシノ" = "これはまさに「お宝」だねぇ～"
"1004502-33-ホシノ" = "……お？"
"1004502-34" = "[s] \"……どうしたの？\""
"1004502-35-ホシノ" = "……！！！"
"1004502-36" = "[ns] \"ホシノ！？\""
"1004502-37" = "[wa:200]― いやぁ、[wa:1700]たまんないねぇ……"
"1004502-38" = "[wa:50]― これぞ[wa:400]まさに[wa:450]楽園……"
"1004502-39" = "[wa:1500]― 涼しい日陰……[wa:1850]心地良い海風……"
"1004502-40" = "[wa:350]― 穏やか[wa:900]な波の音……"
"1004502-41" = "[wa:50]― いやぁ、[wa:1150]ここに来られて良かった～"
"1004502-42" = "― 最高だねぇ、[wa:2100]まるで[wa:350]夢みたいな場所だー……"
"1004502-43" = "[wa:1700]― ……先生もそんなとこに[wa:1100]ずっと立ってないで、"
"1004502-44" = "― 横になってみたら？"
"1004502-45" = "― あんまり広くはないけど、[wa:1450]どう？"
"1004502-46" = "[wa:50]― 良い感じだよ～？"
"1004502-47" = "[ns7] \"楽しそうなホシノを見てるだけで満足だよ。\"\n[ns8] \"ゆっくり休んでて。ホシノも色々と疲れたでしょ。\""
"1004502-48" = "― うへー、[wa:650]なるほどそう来たか……。"
"1004502-49" = "― うへー、[wa:650]なるほどそう来たか……。"
"1004502-50" = "[wa:200]― まあ、[wa:950]何となく[wa:500]予想はしてたけどね。"
"1004502-51" = "[wa:650]― 別にいいのに……"
"1004502-52" = "― まあ、[wa:800]そういうところ[wa:1250]嫌いじゃないけど。"
"1004502-53" = "[wa:150]― ……えへへ。"
"1004502-54" = "[ns9] \"いいお昼寝スポットが見つかったね。\"\n[ns10] \"寝過ごさないようにね。\""
"1004502-55-ホシノ" = "うへ、先生も私がいない時はここを使ってもいいよ～"
"1004502-56-ホシノ" = "うへ、先生も私がいない時はここを使ってもいいよ～"
"1004502-57-ホシノ" = "まぁ、でも……。"
"1004502-58-ホシノ" = "……せっかくなら、その時はおじさんも呼んでほしいかな。"
"1004502-59" = "（一緒に横になってゆっくりお昼寝をしてから戻った）"
