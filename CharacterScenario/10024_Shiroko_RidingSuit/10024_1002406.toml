[translation]
"1002406-1" = "帰ってくる場所"
"1002406-2" = "（もしかしてと思いながらシャーレの下に出ると、シロコの姿が見えた）"
"1002406-3-シロコ" = "や、先生。"
"1002406-4-シロコ" = "ちょうど今着いたところ、タイミングばっちり。"
"1002406-5" = "[s1] \"おかえり！\"\n[s2] \"お疲れ様、これで完走？\""
"1002406-6-シロコ" = "ん、あの辺りから一本で戻ってこられる道があったから。"
"1002406-7-シロコ" = "ん、あの辺りから一本で戻ってこられる道があったから。"
"1002406-8-シロコ" = "傾斜もない道だったから、スピードを出して走ってきたの。風も涼しくて気持ちよかった。"
"1002406-9-シロコ" = "……あ、でもまだ正確には完走じゃない。"
"1002406-10-シロコ" = "ここは、内緒にしてた最後のポイント。ゴールはスタート地点と同じ、アビドスだから。"
"1002406-11" = "[s3] \"なるほどね。\"\n[s4] \"じゃあこれからアビドスに？\""
"1002406-12-シロコ" = "うん。ゴールする前にこうやって、先生に会いたくって。"
"1002406-13-シロコ" = "うん。ゴールする前にこうやって、先生に会いたくって。"
"1002406-14-シロコ" = "……ん？普通にアビドスまで呼んでくれても良かったのに……？"
"1002406-15-シロコ" = "ん……何て言うかその、最後は私の方から迎えに行きたくって……。"
"1002406-16-シロコ" = "もしかして、迷惑だった……？"
"1002406-17-シロコ" = "ん、大丈夫……？じゃあその、えっと、先生が良ければ………。"
"1002406-18" = "[s5] \"一緒にアビドスに行こっか。\"\n[s6] \"アビドスまでの道中で、これまでの話を聞かせてほしいな。\""
"1002406-19-シロコ" = "……ん。"
"1002406-20-シロコ" = "……ん。"
"1002406-21-シロコ" = "あ、でも……先生も知ってる通り、ここからアビドスまでは結構距離があるよ。私はともかく、先生は大変だと思うけど……。"
"1002406-22-シロコ" = "後部座席があれば良かったんだけど、そういうわけにもいかないし……。"
"1002406-23-シロコ" = "えっと……。"
"1002406-24-シロコ" = "……ん、焦る必要も無いね。スピードは先生に合わせるから、ゆっくり行こう。"
"1002406-25-シロコ" = "じゃあ行こっか、先生。"
"1002406-26-シロコ" = "無理しないで良いよ。ゆっくり、二人で。ね？"
"1002406-27" = "[s] シロコの横に並んで、ふたりでゆっくりと歩き始めた。"
"1002406-28" = "（そして、こちらの歩くスピードに合わせてゆっくり自転車を引いてくれたシロコと、ふたりでアビドスへと向かった）"
"1002406-29" = "（道中シロコは、これまでのライディング中に見た色々なものについて話を聞かせてくれた）"
"1002406-30" = "（出会った頃には想像もつかないほど、たくさんのことを話してくれた）"
"1002406-31" = "（……何となく分かってはいたけれど、シロコの言う通り、シャーレからアビドスまで歩いて行くにはかなりの時間がかかった）"
"1002406-32" = "（その後アビドスに到着して、荷解きや何やらを済ませた頃にはもう夜になっていた）"
"1002406-33-シロコ" = "……ん、到着。"
"1002406-34-シロコ" = "キヴォトス縦断のロングライド、成功だよ。先生。"
"1002406-35-シロコ" = "お祝いのクラッカーとか、何か用意しておけばよかったかな……。"
"1002406-36" = "[s] \"完走おめでとう、シロコ。\""
"1002406-37-シロコ" = "……ん。"
"1002406-38-シロコ" = "ありがとう、先生。その言葉だけで、今すっごく嬉しい。"
"1002406-39-シロコ" = "先生が助けてくれたから、ここまで来られた。"
"1002406-40-シロコ" = "海を越えて、山を越えて、橋を渡って……。"
"1002406-41-シロコ" = "川を超えて、都会を通り過ぎて……どんな時でもそうだった……。"
"1002406-42-シロコ" = "……いつも、私のそばには先生がいてくれる。"
"1002406-43-シロコ" = "えっと、いつもっていうのはその、気持ちとしてって言うか、それ以外の意味じゃなくて……。"
"1002406-44" = "[s] \"……？\""
"1002406-45-シロコ" = "……ん、いや、ごめん。大丈夫、気にしないで。"
"1002406-46-シロコ" = "ただ、えっと、何て言えば良いのかな……。"
"1002406-47-シロコ" = "いつもそばにいてくれる……もう私にとっての先生は今、そういう存在で。"
"1002406-48-シロコ" = "……ありがとう、先生。"
"1002406-49-シロコ" = "今回、こういうことができて良かった。"
"1002406-50-シロコ" = "……うん、本当に。心の底から。"
