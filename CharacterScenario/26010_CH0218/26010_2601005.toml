[translation]
"2601005-1" = "空の形"
"2601005-2" = "（一緒に空を見たくて、ミユを探すことにした）"
"2601005-3-ミユ" = "あれ……先生……？"
"2601005-4-ミユ" = "ここで、何をしてたのか、と……？#nそれは、その……"
"2601005-5-ミユ" = "なにか特別なことをしていたわけではなく……こうして、空を眺めて……"
"2601005-6-ミユ" = "ううぅ……。"
"2601005-7-ミユ" = "やっぱり、さっきのモモトークのせいですよね……。#n特に……深い意味はなかったんです。"
"2601005-8-ミユ" = "ただ……その、空の感想を先生に伝えようと……"
"2601005-9-ミユ" = "すみません……迷惑でしたよね……。"
"2601005-10" = "[s] \"ミユの気持ちを知りたかったんだ。\""
"2601005-11-ミユ" = "でしたら……こちらに来てください。"
"2601005-12-ミユ" = "そこのビットに座って、一緒に……"
"2601005-13-ミユ" = "……空と、海の水平線。"
"2601005-14-ミユ" = "ふふっ……何でもないような景色ですよね？"
"2601005-15-ミユ" = "ですが……私にとっては、少し……珍しかったんです。"
"2601005-16-ミユ" = "いつもは、狭い狙撃ポイントで待機したり、暗い場所に隠れてばかりいますが……"
"2601005-17-ミユ" = "ここは……視界が開けていて、風が心地よいですし……#nなんだか落ち着けて、それに……"
"2601005-18-ミユ" = "……余白があって、いいですね。"
"2601005-19" = "[s] \"余白……？\""
"2601005-20-ミユ" = "いつも見上げる空は、視界を遮るものが多くて……"
"2601005-21-ミユ" = "街はビルが立ち並んでいますし、山は木々が広がっているので……"
"2601005-22-ミユ" = "私が見てきた空は、いつもぼやけていました……"
"2601005-23-ミユ" = "でも……この空は、定規で真っ直ぐ線を引いたような水平線が描かれています。"
"2601005-24-ミユ" = "こんな空の下でなら、どんなターゲットも撃ち抜けそうだな、と……"
"2601005-25-ミユ" = "……自分でも不思議ですが、ふと自信が湧いてきたんです。"
"2601005-26-ミユ" = "なので、またいつか、たまにでも来られたら……と名残惜しくて……"
"2601005-27-ミユ" = "つい、先生にメッセージを……。"
"2601005-28-ミユ" = "……よく分かりませんでしたよね。#nす、すみません。やっぱり何でも……"
"2601005-29" = "[s1] \"……いい景色だね、ミユ。\"\n[s2] \"また今度、2人で見に来ようか。\""
"2601005-30-ミユ" = "そっ、そんな……別に、そういうつもりで言ったわけじゃ……！"
"2601005-31-ミユ" = "ううぅ……やっぱり、話さなければ……"
"2601005-32-ミユ" = "先生に……わがままを言ってるみたいじゃないですか……"
"2601005-33" = "[s3] \"そんなことないよ。\"\n[s4] \"私も、この空が好きだから。\""
"2601005-34-ミユ" = "ほ、本当ですか……？"
"2601005-35-ミユ" = "先生も……本当に、好きなんです……か？"
"2601005-36-ミユ" = "も、もし……もしですが……"
"2601005-37-ミユ" = "先生も……この景色が、好き……なら……"
"2601005-38-ミユ" = "えっと……その……"
"2601005-39-ミユ" = "……い、いっ……"
"2601005-40" = "[s] \"一緒に、また来ようね。\""
"2601005-41-ミユ" = "…………！！"
"2601005-42-ミユ" = "……ぁ。"
"2601005-43-ミユ" = "ぁぅぅ……。"
"2601005-44-ミユ" = "…………はい。"
"2601005-45-ミユ" = "……約束……ですよ……？"
