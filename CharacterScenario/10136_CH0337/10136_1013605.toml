[translation]
"1013605-1" = "妨害"
"1013605-2" = "（エイミから届いたメッセージを頼りに、座標の位置へと向かう）"
"1013605-3" = "（最悪の事態になっていないことを祈っていたその時……）"
"1013605-4-エイミ" = "やっほ～#n待ってたよ。"
"1013605-5" = "[ns] \"……！\""
"1013605-6" = "[ns] \"エイミ！！\""
"1013605-7-エイミ" = "！？"
"1013605-8-エイミ" = "ど、どうしたの、先生？"
"1013605-9-エイミ" = "おこって……る？"
"1013605-10" = "[s] \"心配したんだよ。\""
"1013605-11-エイミ" = "……。"
"1013605-12-エイミ" = "そう、だったんだ……。"
"1013605-13-エイミ" = "ごめんなさい、先生……。"
"1013605-14-エイミ" = "私……。"
"1013605-15" = "[s] \"……帰ろうか。\""
"1013605-16-エイミ" = "……。"
"1013605-17-エイミ" = "うん……。"
"1013605-18" = "[s] \"……無事で、よかった。\""
"1013605-19-エイミ" = "うん……。"
"1013605-20-エイミ" = "偵察の帰り道にちょっと交戦することになって……。"
"1013605-21-エイミ" = "その時に使いすぎちゃったみたい。#nバックパックのバッテリーがなくなっちゃったの。"
"1013605-22-エイミ" = "私の装備ってバックパックにあるバッテリーと連動してて。"
"1013605-23-エイミ" = "敵は倒せたんだけど……その結果、ああなっちゃったんだ。"
"1013605-24" = "[s1] \"……そうだったんだ。\"\n[s2] \"何かあったんじゃないかって、心配したよ……。\""
"1013605-25-エイミ" = "それは……ごめん。"
"1013605-26-エイミ" = "でも、色々考えたんだけど――"
"1013605-27-エイミ" = "あの時、敵を倒したのは効率的な判断だったと思う。"
"1013605-28-エイミ" = "……効率的だとしても、私が安全じゃないと意味がない、か。"
"1013605-29-エイミ" = "……。"
"1013605-30-エイミ" = "……そっか。"
"1013605-31-エイミ" = "そういう考えも……あるんだね。"
"1013605-32-エイミ" = "ごめんなさい、先生。#n私が悪かった。"
"1013605-33-エイミ" = "だから、あんまり怒らないで。#n今の先生の顔、本当に怖い。"
"1013605-34-エイミ" = "絶対に、もうしない。"
"1013605-35-エイミ" = "約束する。"
"1013605-36-エイミ" = "……でもね先生。"
"1013605-37-エイミ" = "私、大丈夫だって思ってたんだ。"
"1013605-38-エイミ" = "一応ベースの近くだったし。#n救援信号も送れたし。"
"1013605-39-エイミ" = "先生が、ちゃんと受け取ってくれるって信じて待ってたし――"
"1013605-40-エイミ" = "……。"
"1013605-41-エイミ" = "……ごめん、全部言い訳になっちゃうね。"
"1013605-42-エイミ" = "……。"
"1013605-43-エイミ" = "変なの。"
"1013605-44-エイミ" = "今まで、言い訳なんて非効率的だと思っていたのに。"
"1013605-45-エイミ" = "そんな事いうくらいなら、さっさと事態を片付けたほうが早いって……そう思ってたのに。"
"1013605-46-エイミ" = "……。"
"1013605-47-エイミ" = "今の私は、もしかしたら……。"
"1013605-48-エイミ" = "先生に、嫌われたくないのかも。"
"1013605-49" = "[s3] \"エイミを嫌ったりなんてしないよ。\"\n[s4] \"ただ……心配したんだ。すごく。\""
"1013605-50-エイミ" = "……。"
"1013605-51-エイミ" = "ありがとう、先生。"
"1013605-52-エイミ" = "……もう、先生にとっては今更だろうけど。"
"1013605-53-エイミ" = "私、ちょっとズレているところがあると思うから。"
"1013605-54-エイミ" = "だから、先生にお願いがあるの。"
"1013605-55" = "[s] \"お願い？\""
"1013605-56" = "（エイミはその場に立ち止まると、そっと目を閉じる）"
"1013605-57" = "（そうして、ゆっくりと深く息を吸った）"
"1013605-58-エイミ" = "私を、守って。"
"1013605-59-エイミ" = "私のことを、見つめていて。"
"1013605-60-エイミ" = "そうして――私が踏み外さないように、ずっと、そばで見守っていてほしいの。"
"1013605-61-エイミ" = "自分勝手なところがある自覚はあるよ。"
"1013605-62-エイミ" = "危なっかしいところがあるって思われてるのも、知ってる。"
"1013605-63-エイミ" = "それでも……。"
"1013605-64-エイミ" = "先生がそばにいるなら、私――"
"1013605-65-エイミ" = "きっと、大丈夫だから。"
"1013605-66-エイミ" = "……分かってるよ。雛はいつか巣立たないといけないってことくらい。"
"1013605-67-エイミ" = "でも、まだ私高校1年生だよ？"
"1013605-68-エイミ" = "だから、まだこのままでもいいんじゃないかな。"
"1013605-69" = "[s] \"……そうだね。\""
"1013605-70-エイミ" = "ふふっ。"
"1013605-71-エイミ" = "それに、もしもここから羽ばたいたとしても――"
"1013605-72-エイミ" = "……これは、そういう可能性の話、だけど。"
"1013605-73-エイミ" = "残りの時間を過ごすパートナーを探したって、いいじゃない？"
"1013605-74" = "[s] \"それはどういう意味？\""
"1013605-75-エイミ" = "ふふっ、何でもない。ただ言ってみただけ。"
"1013605-76-エイミ" = "本当に深い意味はないよ。"
"1013605-77-エイミ" = "……ところで先生、知ってる？"
"1013605-78-エイミ" = "今の先生、もういつもの先生になったんだよ。"
