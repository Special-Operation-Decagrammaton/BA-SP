[translation]
"1013606-1" = "あなたとココアを"
"1013606-2-エイミ" = "一日お疲れ様、先生。"
"1013606-3" = "[s1] \"エイミもお疲れ様！\"\n[s2] \"あれ、今どこにいるの？\""
"1013606-4-エイミ" = "私？"
"1013606-5-エイミ" = "上にいるよ。"
"1013606-6-エイミ" = "あ、偵察とかじゃなくて……。"
"1013606-7-エイミ" = "なんて言えばいいんだろ。"
"1013606-8-エイミ" = "うーん……。"
"1013606-9-エイミ" = "先生も来てみる？"
"1013606-10-エイミ" = "ここ、ちょっと不思議なんだ。"
"1013606-11" = "（エイミに言われた通り、上に登ると――）"
"1013606-12" = "[wa:710]― [log=에이미 결전]ようこそ、[wa:957]先生。[/log]"
"1013606-13" = "― [log=에이미 결전]なんだか[wa:1540]不思議な空だよね。[/log]"
"1013606-14" = "[ns] \"本当に……すごいね。\""
"1013606-15" = "[wa:730]― [log=에이미 결전]私たちの知っている夜空と[wa:2890]似ているようで……。[/log]"
"1013606-16" = "― [log=에이미 결전]よく見ると、[wa:2100]ぜんぜん違う。[/log]"
"1013606-17" = "― [log=에이미 결전]今の私みたい。[/log]"
"1013606-18" = "[wa:1070]― [log=에이미 결전]今まで[wa:1370]あんまりこうやって[/log]"
"1013606-19" = "― [log=에이미 결전]見上げることなかったんだけど……。[/log]"
"1013606-20" = "― [log=에이미 결전]最近、[wa:1760]好きなんだ。[/log]"
"1013606-21" = "[wa:860]― [log=에이미 결전]でも[wa:740]どうしてかな。[/log]"
"1013606-22" = "― [log=에이미 결전]見上げる度に、[wa:1940]先生の顔が浮かぶの。[/log]"
"1013606-23" = "[ns] \"それは……どうして？\""
"1013606-24" = "[wa:1720]― [log=에이미 결전]ふふっ、[wa:1610]なんでだろうね。[/log]"
"1013606-25" = "― [log=에이미 결전]先生。[/log]"
"1013606-26" = "[wa:1000]― [log=에이미 결전]私、[wa:1590]先生に会えて、[wa:1820]本当によかった。[/log]"
"1013606-27" = "― [log=에이미 결전]うん、[wa:1130]本当に。[wa:2225]そう、[wa:1288]思ってるよ。[/log]"
"1013606-28-エイミ" = "あれ……ココア？持ってきてくれたの？"
"1013606-29-エイミ" = "気持ちは嬉しいけど、私……熱いのは。"
"1013606-30" = "[s] \"エイミの分はアイスココアだよ。\""
"1013606-31-エイミ" = "わぁ、ありがとう先生！"
"1013606-32-エイミ" = "そういうところ……好き。"
"1013606-33" = "（エイミの隣に腰を下ろす）"
"1013606-34-エイミ" = "多分ね……。"
"1013606-35-エイミ" = "先生に会う前の私は――"
"1013606-36-エイミ" = "一人でも生きていけるんじゃないかって、本気でそう思っていたんだ。"
"1013606-37-エイミ" = "それを口に出したりすることはなかったんだけど……。"
"1013606-38-エイミ" = "たぶん、無意識のうちに、それが外にも出ていたんだろうね。"
"1013606-39-エイミ" = "私の場合、一人で対応したほうが効率が良かったことが多かったし。"
"1013606-40-エイミ" = "知識だって、自主学習で事足りてたから。"
"1013606-41" = "[s] \"今は？\""
"1013606-42-エイミ" = "どうかな。"
"1013606-43-エイミ" = "少なくとも、一人だったら――"
"1013606-44-エイミ" = "こうやってアイスココアを渡してもらうなんてこと、起きなかった。"
"1013606-45-エイミ" = "こうして、体温を分け合うこともなかっただろうね。"
"1013606-46" = "（触れ合ったところからエイミの体温を感じる）"
"1013606-47-エイミ" = "あったかい？"
"1013606-48" = "[s] \"うん、ココアが。\""
"1013606-49-エイミ" = "むぅ……。"
"1013606-50" = "[s3] \"ごめんごめん。\"\n[s4] \"エイミのおかげで、寒くないよ。\""
"1013606-51-エイミ" = "よかった。"
"1013606-52-エイミ" = "……。"
"1013606-53-エイミ" = "なんだかいいね、こういうの。"
"1013606-54-エイミ" = "本当に。"
"1013606-55-エイミ" = "これから、もっと色んな人たちと関わって――"
"1013606-56-エイミ" = "たくさん変わっていく……そうなのかな？"
"1013606-57-エイミ" = "……。"
"1013606-58-エイミ" = "………。"
"1013606-59-エイミ" = "…………。"
"1013606-60-エイミ" = "どうだろうね。"
"1013606-61" = "[s] \"そこは頷こうよ。\""
"1013606-62-エイミ" = "関わる人が多くなると……面倒くさい。"
"1013606-63" = "[s] \"そんな理由なの……。\""
"1013606-64-エイミ" = "大事なことだよ先生。"
"1013606-65-エイミ" = "人が効率を求める理由の一つは、面倒なことから抜け出すため。"
"1013606-66" = "[s] \"否定はしないけど……。\""
"1013606-67-エイミ" = "今は先生がいれば十分だし？"
"1013606-68" = "[s] \"ええっ！？\""
"1013606-69-エイミ" = "聞こえてないふりをしてもダメだよ、先生。"
"1013606-70-エイミ" = "聞こえるように言ってるんだから。"
"1013606-71" = "（そうして、ココアを飲み終わるまでエイミと言葉をかわし、穏やかな時間を過ごした）"
