[translation]
"1013602-1" = "効率・非効率"
"1013602-2-エイミ" = "おはよう。お寝坊さんだね、先生。"
"1013602-3" = "[s] \"おはよう。朝から元気だね……。\""
"1013602-4-エイミ" = "まあ、今は普段と状況が違うからね。できることはしないと。"
"1013602-5-エイミ" = "といっても、威力偵察くらいしかないんだけど……。#nあ、そういえば――"
"1013602-6-エイミ" = "さっき、ちょっと気になる信号を拾ったんだ。#n今から向かうところ。"
"1013602-7" = "[s] \"私もついて行っていい？\""
"1013602-8-エイミ" = "うーん、いいけど……。#n万が一、何かあったら……。"
"1013602-9-エイミ" = "……まあ、いっか。私が守ってあげる。#nどんなことがあっても。"
"1013602-10" = "（エイミと一緒に外に出た）"
"1013602-11-エイミ" = "こっちから偵察していくよ。#nだいたい2時間くらいかかるかな。"
"1013602-12-エイミ" = "時速4キロくらいでゆっくり進んでいく予定。"
"1013602-13-エイミ" = "あ、でもそれより遅くても大丈夫だよ。#nゆっくりすぎるとちょっと困っちゃうけど。"
"1013602-14-エイミ" = "ほら、距離が空いちゃったら先生を守れないでしょ？#nあんまり離れすぎないようにね。"
"1013602-15" = "（そうして、エイミと一緒に偵察を始めた）"
"1013602-16" = "（エイミのペースは速く、ついていくのは大変だった……）"
"1013602-17-エイミ" = "すごいね。先生、ちゃんとついてきてる。"
"1013602-18" = "[s] \"お世辞でも、嬉しいよ……というか、これ……ついて、いけてると言えるの、かな……。\""
"1013602-19-エイミ" = "お世辞じゃないよ。#n誰かさんだったらすぐバテてただろうし。"
"1013602-20-エイミ" = "え？うん、ペース配分って大事だよね。先生の言う通り。"
"1013602-21-エイミ" = "私もそうは思うけど……。"
"1013602-22-エイミ" = "……まぁ、慣れもあるからね。難しい。"
"1013602-23-エイミ" = "っ！？"
"1013602-24-エイミ" = "先生、隠れて！"
"1013602-25" = "（突然、エイミの手によって割れた大地の隙間に押し込まれる）"
"1013602-26-エイミ" = "急にごめんね。"
"1013602-27-エイミ" = "私がもう大丈夫って言うまで、そこにいてほしい。"
"1013602-28-エイミ" = "数は――分隊1つくらいか。#nそれなら……！"
"1013602-29-エイミ" = "もう大丈夫だよ先生。"
"1013602-30-エイミ" = "……これで全部じゃないとは思うけどね。"
"1013602-31" = "（その後もエイミは――）"
"1013602-32-エイミ" = "座標確認。距離……427m。#n先手を打つよ……！"
"1013602-33" = "（目にも止まらぬ速度で動く敵の軍勢を前に……）"
"1013602-34-エイミ" = "もうちょっと待った方が――"
"1013602-35-エイミ" = "いや、先に処理して移動した方がいいかな。"
"1013602-36-エイミ" = "事態が大きくなってからだと非効率的だし……！"
"1013602-37-エイミ" = "こっちの居場所はバレてないみたい……#n敵の装備的に、あれはたぶん輸送隊……。"
"1013602-38-エイミ" = "それなら――[ruby=サーチアンドデストロイ]Search and Destroy[/ruby]！"
"1013602-39" = "（エイミは驚くほど上手に威力偵察を進めていった……）"
"1013602-40-エイミ" = "よし。危険信号はもうないよ。"
"1013602-41-エイミ" = "お疲れ様、先生。そろそろ帰ろう。"
"1013602-42" = "[s] \"いつもこんな風にしてるの……？すごい……。\""
"1013602-43-エイミ" = "大したことじゃないよ。いつもこうだし。"
"1013602-44-エイミ" = "人使いが荒いどこかの誰かさんがいるからさ……。"
"1013602-45-エイミ" = "まあ別に本人にも言ってることだけどね。"
"1013602-46" = "[s] \"な、仲良くしようね……。\""
"1013602-47-エイミ" = "別に仲は良い方だよ？"
"1013602-48-エイミ" = "……。"
"1013602-49-エイミ" = "……思えば、いつも一人だったから団体行動って初めてかも。"
"1013602-50-エイミ" = "人数が増えたら効率が落ちるって思ってたし。"
"1013602-51-エイミ" = "……私と一緒に行動するの、怖がる人もいたから。"
"1013602-52-エイミ" = "……私の考えって、あんまり理解してもらえなかったんだよね。"
"1013602-53" = "[s] \"今はどう？\""
"1013602-54-エイミ" = "今は……。"
"1013602-55-エイミ" = "なんでだろ。意外と平気。"
"1013602-56-エイミ" = "みんな変わってるからかな？気が合うというか……。"
"1013602-57-エイミ" = "すごく居心地が良いんだ。"
"1013602-58" = "[s] \"生徒同士、できるなら仲良くした方が良いからね。他の子とも。\""
"1013602-59-エイミ" = "他の子とも、か……。"
"1013602-60-エイミ" = "……。"
"1013602-61-エイミ" = "前の私だったら、非効率的だと思ったんじゃないかな。"
"1013602-62-エイミ" = "でも、なんだか不思議。"
"1013602-63-エイミ" = "今は、協力したいって思えるんだ。"
"1013602-64" = "[s] \"そう思えるなら良かった。\""
"1013602-65-エイミ" = "うん。"
"1013602-66-エイミ" = "先生の言葉も、ちょっとあるかな。#nふふ。"
"1013602-67" = "（その後、エイミと言葉を交わしながらみんなの元へ戻った）"
