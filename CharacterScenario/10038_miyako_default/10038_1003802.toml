[translation]
"1003802-1" = "SRT、突入します！"
"1003802-2" = "シャーレオフィス"
"1003802-3" = "（平和なシャーレの、とある午後のひと時）"
"1003802-4-？？？" = "爆薬の設置完了、起爆準備。"
"1003802-5-？？？" = "３……"
"1003802-6-？？？" = "２……"
"1003802-7-？？？" = "１……"
"1003802-8" = "(ドカーーーンッ！)"
"1003802-9-ミヤコ" = "SRTです！下がってください！"
"1003802-10-ミヤコ" = "……クリア、制圧完了ですね。"
"1003802-11" = "[s] \"……ミヤコ？\""
"1003802-12-ミヤコ" = "……先生？どうしてここに……？"
"1003802-13" = "[s1]  \"それを聞きたいのは私の方かな……。\"\n[s2] \"ここはシャーレのオフィスだからです……。\""
"1003802-14-ミヤコ" = "悪の犯罪者が巣食う場所ではなく、シャーレのオフィス……？"
"1003802-15-ミヤコ" = "悪の犯罪者が巣食う場所ではなく、シャーレのオフィス……？"
"1003802-16-ミヤコ" = "ああ、なるほど……"
"1003802-17-ミヤコ" = "だからあんな噂が……。"
"1003802-18" = "[s] \"「あんな噂」……？\""
"1003802-19-ミヤコ" = "怪しげな大人が女子生徒たちを連れて、とある建物に出入りしているという噂です。気にかかって、RABBIT小隊で調査をしていたのですが……。"
"1003802-20-ミヤコ" = "なるほど。怪しげな大人とは、先生のことでしたか。"
"1003802-21-ミヤコ" = "マルチ商法や誘拐犯罪などではなかったようで、安心しました。"
"1003802-22" = "[s] \"誤解が解けたら、もう片付けをしても良いかな……？\""
"1003802-23-ミヤコ" = "いいえ、まだ任務は終わってません。"
"1003802-24-ミヤコ" = "なにせ私たちはSRT。始めたからには徹底的に、何か怪しい物品などが無いかについても確認しておかなければなりません。"
"1003802-25-ミヤコ" = "誰かの言葉を信じて撤退し、それによって作戦が破綻したという過去のケースは数えきれませんから。"
"1003802-26-ミヤコ" = "ではまず、ベッドの下と本棚の中を重点的に捜索するとしましょう。"
"1003802-27" = "[s] \"そ、それはダメ……！\""
"1003802-28-ミヤコ" = "……何か問題でもあるのですか？"
"1003802-29-ミヤコ" = "先生は他の生徒の模範であると以前お聞きしました。であれば、怪しい物なんてお持ちではないですよね？"
"1003802-30-ミヤコ" = "もちろん、お部屋を捜索しても問題ありませんよね？"
"1003802-31" = "[s] \"それは、えっと……\""
"1003802-32-ミヤコ" = "あ、ベッドの下に何か怪しげな本が……"
"1003802-33-ミヤコ" = "『みんなと簡単に仲良くなれる101のモモトーク必勝法』……？"
"1003802-34-ミヤコ" = "……先生、これは教育指導に必要なものですか？"
"1003802-35" = "[s3] \"も、もちろん……！\"\n[s4] \"生徒と仲良くなることは大事だから……！\""
"1003802-36-ミヤコ" = "……。"
"1003802-37-ミヤコ" = "……。"
"1003802-38-ミヤコ" = "先生がそう仰るなら、とりあえず目をつぶりますが……"
"1003802-39-ミヤコ" = "あれ？本棚の奥の変な空間に、また本が……？"
"1003802-40-ミヤコ" = "『モテるためのファッションコーディネートブック』……"
"1003802-41" = "[s] \"……。\""
"1003802-42-ミヤコ" = "……一旦、捜索完了です。"
"1003802-43-ミヤコ" = "幸いにも、違法な物や犯罪の証拠は無いようですが……"
"1003802-44-ミヤコ" = "「怪しい大人がいる」という話が本当だったことは分かりました。"
"1003802-45" = "（その後、しばらくミヤコから冷たい目線を浴びるようになってしまった……)"
