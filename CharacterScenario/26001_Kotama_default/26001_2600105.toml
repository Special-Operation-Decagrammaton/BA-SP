[translation]
"2600105-1" = "言えないこと"
"2600105-2" = "コタマの部屋"
"2600105-3-コタマ" = "この時間帯に基地局のサーバーをハッキングすると、面白い盗み聞きがたくさんできますね。"
"2600105-4-コタマ" = "どれどれ、今日はどんな通話を傍受できるでしょうか……。"
"2600105-5-コタマ" = "発信者不明……怪しいですね。#n受信者側は……"
"2600105-6-コタマ" = "シャーレ？"
"2600105-7-コタマ" = "こんな夜中に先生と電話をする人がいるなんて……これは聞かずにはいられませんね。"
"2600105-8-コタマ" = "傍受開始……キャッチ。"
"2600105-9-うさんくさい声" = "シャーレの先生が直接の依頼だなんて、よっぽど急ぎだったのかな？"
"2600105-10-コタマ" = "（回線の状態が悪いせいか、はっきりとは聞こえませんね……）"
"2600105-11-うさんくさい声" = "……確かにアレの処理についてはオレたちの専門だ。アマチュアが自分たちでやろうとすると、服が赤く染まっちまうかもしれないからな。"
"2600105-12-コタマ" = "（処理……それに、服が赤くって……）"
"2600105-13-うさんくさい声" = "後始末も一筋縄じゃ行かねえ。ちゃんと結んで重い石を乗せとかねえと、後でモノが浮かんで来ちまったら面倒だしな。"
"2600105-14-コタマ" = "（後始末？重い石？これは、まさか……）"
"2600105-15-うさんくさい声" = "腐らないよう、ちゃんと処理しておいてやるからな。楽しみにしてろよ、はははっ！"
"2600105-16-コタマ" = "……。"
"2600105-17-コタマ" = "どうやら……良くない事件に巻き込まれている様ですね。"
"2600105-18" = "シャーレ・執務室"
"2600105-19-コタマ" = "……。"
"2600105-20-コタマ" = "（傍受した内容によれば、相手が「例のモノ」を送ってくる時間は、今日の午後2時）"
"2600105-21-コタマ" = "（せめて、先生がこれ以上大きな犯罪に巻き込まれる前に、先生を説得しなければなりません）"
"2600105-22-コタマ" = "（先生に何かあれば、キヴォトス全域に影響が……）"
"2600105-23" = "[ns] \"コタマ？顔色が悪いけど、大丈夫？\""
"2600105-24-コタマ" = "だ、大丈夫です。昨晩、少し眠れなかっただけで。"
"2600105-25-コタマ" = "先生の方は、なんだか嬉しそうですが。何かいいことでもありましたか？"
"2600105-26" = "[s] \"ちょっと頼んでたモノがもうすぐ届きそうでね。\""
"2600105-27-コタマ" = "頼んでたモノ、って……。"
"2600105-28-コタマ" = "あの、先生。ちょっとお話したいことが。"
"2600105-29-配達員" = "ご注文の品の配達に参りましたー。"
"2600105-30" = "先生、待ってください、その中には……！"
"2600105-31" = "[ns] \"今回もさすがの仕上がりだね、「梅干し」。\""
"2600105-32" = "……え？梅干し？"
"2600105-33" = "その箱の中に入っているのは、血塗られた犯罪の証拠ではなかったんですか？"
"2600105-34" = "[s] \"……コタマ、何を言ってるの？\""
"2600105-35-コタマ" = "……なるほど。赤く染まるというのはシソの葉のことで、重い石は漬ける時の重石のことだったんですね。"
"2600105-36-コタマ" = "電話の内容から勝手に、先生が血で染まった犯罪の痕跡を消そうとしているのかと勘違いしていました。"
"2600105-37" = "[s1] \"そんなわけないでしょ……。\"\n[s2] \"コタマは私のことを何だと思ってるの……？\""
"2600105-38-コタマ" = "ふふ、私が知ってるいつもの先生でよかったです。"
"2600105-39-コタマ" = "ふふ、私が知ってるいつもの先生でよかったです。"
"2600105-40-コタマ" = "……あっ。この梅干し、美味しそうですね。"
"2600105-41-コタマ" = "色も綺麗で、職人の腕の良さが感じられます。"
"2600105-42" = "[s] \"それよりコタマは、何で私の通話の内容を知ってるの？\""
"2600105-43-コタマ" = "あ。それは、その……。"
"2600105-44-コタマ" = "……偶然？"
"2600105-45" = "その後しばらく、電話を盗聴した件について、コタマにお説教をした。"
