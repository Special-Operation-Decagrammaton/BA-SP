[translation]
"1301402-1" = "水着と防御力"
"1301402-2" = "（レンゲが水着姿で山に行くと聞き、慌てて駆けつけた）"
"1301402-3-レンゲ" = "お、早いね師匠。"
"1301402-4" = "[s] \"滝壺に行くってことだったんだね。\""
"1301402-5-レンゲ" = "水着を活かせる場所だからね。"
"1301402-6-レンゲ" = "あと、アタシにも常識くらいはあるからな！"
"1301402-7" = "[s] \"……てっきり、水着姿で登山するのかなって。"
"1301402-8-レンゲ" = "ええっと……。"
"1301402-9-レンゲ" = "まぁ……それもやったけど。"
"1301402-10" = "[s] \"嘘でしょ！？\""
"1301402-11-レンゲ" = "いや、制服の下に……着てただけだから……！"
"1301402-12" = "[s] \"な、なるほど！\""
"1301402-13-レンゲ" = "ど、どうかな？ちょっと恥ずかしいけど……これも青春かなって……。"
"1301402-14-レンゲ" = "師匠も……服の下は水着か？"
"1301402-15" = "[s1] \"……うん。\"\n[s2] \"着てないけど、一応持ってきたよ！\""
"1301402-16-レンゲ" = "さすが、師匠！気が合うね！"
"1301402-17-レンゲ" = "ふふ、まあ急だったからね。"
"1301402-18-レンゲ" = "じゃあ、早速水着修練を始めよう。"
"1301402-19-レンゲ" = "師弟での…[ruby=たきぎょう]…滝行だ[/ruby]！"
"1301402-20" = "（レンゲと一緒に水着姿で滝の下に立った）"
"1301402-21" = "くぅーっ！目が覚めるな！師匠はどうだ！？"
"1301402-22" = "[s] \"う、うわあぁぁぁ……！冷たくて頭がキンキンする！！\""
"1301402-23" = "ふふ、大げさだなあ。"
"1301402-24" = "そういえば、水着で防御力が上がった感じする？"
"1301402-25" = "アタシは……効果があるような気がしてる。"
"1301402-26" = "水着に合った振る舞いをしなきゃって、気が引き締まるし……。"
"1301402-27" = "体じゃなくて、心の防御力が上がる感じっていうか……。"
"1301402-28" = "師匠は？"
"1301402-29" = "[s3] \"滝の勢いが凄くて……！\"\n[s4] \"ぬ、脱げそう……！\""
"1301402-30" = "そこに精神の防御力が求められるんだ。"
"1301402-31" = "気合を入れ続けないと、ほんとに脱げちゃうからな。"
"1301402-32" = "[s] \"それって気合の問題！？\""
"1301402-33" = "ほら、アタシの水着は大丈夫だろ？師匠は……。"
"1301402-34" = "……！？"
"1301402-35" = "[s5] \"なんだかスースーするような……。\"\n[s6] \"水着が……ない！\""
"1301402-36-レンゲ" = "な、なんだって！？すぐ見つけるよ！"
"1301402-37" = "（しばらくして……）"
"1301402-38-レンゲ" = "あっ！見つけたぞ師匠ー！"
"1301402-39" = "[s7] \"ありがとう。でも……。\"\n[s8] \"そ、そんな笑顔で人の水着を振らないで……！\""
"1301402-40-レンゲ" = "目つぶってるから、早く来てくれ！"
"1301402-41-レンゲ" = "アタシは何も見てないから。"
"1301402-42-レンゲ" = "……ふふ、これも青春っぽいな。"
"1301402-43" = "[ns] \"あちらを向いていただけると……！\""
"1301402-44-レンゲ" = "あ、ごめん！へへ！"
"1301402-45" = "（……その後もずっとレンゲと一緒に滝の下で修練をした）"
