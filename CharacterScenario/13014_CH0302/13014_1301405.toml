[translation]
"1301405-1" = "水着とキャンプファイヤー"
"1301405-2" = "（待ち合わせ時間に合わせて、レンゲが待っている海岸に向かった）"
"1301405-3-レンゲ" = "お、来たね。"
"1301405-4-レンゲ" = "さあ、キャンプファイヤーを始めよう。"
"1301405-5-レンゲ" = "ん？薪が組まれてないって？"
"1301405-6-レンゲ" = "そこから始めてこそ、修練だからね！"
"1301405-7-レンゲ" = "一緒に、あのあたりに薪を組もう！"
"1301405-8" = "[s] \"う、うん！汗を流してこそ青春だね！\""
"1301405-9-レンゲ" = "さすがは師匠！わかってるね！"
"1301405-10-レンゲ" = "今回は、ちょっと特別な形に薪を組もうと思うんだ。"
"1301405-11-レンゲ" = "そっちの方が思い出になるだろう？"
"1301405-12" = "[s] \"形はもう決まってるの？\""
"1301405-13-レンゲ" = "もちろん。設計図もあるよ！"
"1301405-14-レンゲ" = "頑張ろう！アタシらの青春のために！"
"1301405-15" = "[s] \"うん！青春のために……！\""
"1301405-16" = "（やる気満々のレンゲと熱心にキャンプファイヤーの薪を組み始めた）"
"1301405-17" = "（しばらくして……）"
"1301405-18-レンゲ" = "よし、と……竜の完成だ！"
"1301405-19-レンゲ" = "思ったよりデカくなっちゃったな。"
"1301405-20-レンゲ" = "師匠がいるから、張り切りすぎたかも……。"
"1301405-21" = "[s] \"火をつけるの、ちょっと勿体ないね……。\""
"1301405-22-レンゲ" = "でも、燃やしてこそキャンプファイヤーだからね。"
"1301405-23-レンゲ" = "炎を眺めるのも、醍醐味だし。"
"1301405-24" = "[s] \"着火剤がちょっと多い気がするけど……。\""
"1301405-25" = "[ns] \"まあ、大丈夫かな……？\""
"1301405-26-レンゲ" = "よし、二人で火をつけよう！"
"1301405-27-レンゲ" = "せーの！"
"1301405-28" = "[log]（……そのとき、私たちはまだ知らなかった）[/log]"
"1301405-29" = "[log]（怒り狂った竜の吐く炎は、）[/log]"
"1301405-30" = "[log]（どこまでも燃え上がるのだ……）[/log]"
"1301405-31" = "[ns] \"こ、これはまずいかも……。\""
"1301405-32-レンゲ" = "お、思ったよりでかいな！？"
"1301405-33-通行人A" = "な、なんだあれ！？"
"1301405-34-通行人B" = "あっつ～！やばいよ！"
"1301405-35-レンゲ" = "これは……まずいかも。"
"1301405-36" = "[s] \"ちょ、ちょっと燃えすぎ……！\""
"1301405-37-レンゲ" = "急いで火を消そう！"
"1301405-38" = "[ns] \"火が消えるどころか、燃え上がってる！？\""
"1301405-39-レンゲ" = "さ、さすが竜の炎……でも負けられない！"
"1301405-40-レンゲ" = "いざ……勝負！"
"1301405-41-レンゲ" = "必ず消してみせる！"
"1301405-42" = "（……その後、レンゲと何とか薪の炎を消した）"
"1301405-43" = "（思ったより強烈なキャンプファイヤーだった……）"
"1301405-44-レンゲ" = "ふぅ、やっとおさまってきた。"
"1301405-45-レンゲ" = "……ヒヤッとしたな。次からは気を付けるよ。"
"1301405-46" = "[s] \"ちゃんと消火できたし、青春の教訓……ってことで！\""
"1301405-47-レンゲ" = "そうだね……あれ？師匠、顔が……。"
"1301405-48-レンゲ" = "……ぷっ。"
"1301405-49-レンゲ" = "ふふふっ……！煤でパンダになってる！"
"1301405-50-レンゲ" = "こっち来てよ。拭くからさ。"
"1301405-51" = "[s] \"お、お願い。\""
"1301405-52-レンゲ" = "顔が真っ黒だ……。"
"1301405-53-レンゲ" = "ちょっと目つぶってて。"
"1301405-54-レンゲ" = "……。"
"1301405-55-レンゲ" = "（……こんな近くで、師匠の顔見たことあったかな？）"
"1301405-56-レンゲ" = "（師匠が目の前に……）"
"1301405-57-レンゲ" = "（……こ、これも青春？）"
"1301405-58" = "[s] \"レンゲ、どうしたの？\""
"1301405-59-レンゲ" = "な、何でもないよ！つい変な想像が……。"
"1301405-60-レンゲ" = "あ、目つぶっててくれ！まだ煤が残ってるから！"
"1301405-61" = "（レンゲは慌てた様子で、私の顔の煤を拭ってくれた）"
"1301405-62" = "（この瞬間こそ青春……なのかもしれない）"
