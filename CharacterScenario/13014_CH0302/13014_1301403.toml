[translation]
"1301403-1" = "水着と無人島"
"1301403-2" = "（修練の当日、レンゲと海へ向かった）"
"1301403-3-レンゲ" = "ここが[ruby=・]例[/ruby][ruby=・]の[/ruby][ruby=・]島[/ruby]か？"
"1301403-4-漁師" = "ああ、邪魔は入らないだろう。"
"1301403-5-漁師" = "それじゃ、迎えがほしくなったら連絡してくれ。"
"1301403-6" = "[ns1] \"例の島って？\"\n[ns2] \"普通の島じゃなさそうだけど……。\""
"1301403-7-レンゲ" = "あれ？言わなかったっけ？"
"1301403-8-レンゲ" = "ここは無人島だよ！"
"1301403-9" = "[s] \"な、なんだって！？\""
"1301403-10-レンゲ" = "「無人島1日体験」ってやつでさ。この島の海岸を使っていいんだって。"
"1301403-11-レンゲ" = "遠浅の海だし、危険な動物もいない。連絡さえすれば、いつでも出られるし――"
"1301403-12-レンゲ" = "修練にはうってつけの環境だろ？"
"1301403-13" = "[s3] \"……二人だけの海岸！\"\n[s4] \"まさに青春だね！\""
"1301403-14-レンゲ" = "ふふっ、そうなんだよ。"
"1301403-15-レンゲ" = "さ、修練を始めるか！"
"1301403-16" = "[ns] \"また服の下に水着なんだね。\""
"1301403-17-レンゲ" = "師匠は？"
"1301403-18" = "[s] \"もちろん、着てるよ……！\""
"1301403-19-レンゲ" = "よ～し！まずは――"
"1301403-20-レンゲ" = "海で食料の確保だ！"
"1301403-21" = "[s] \"……水遊びとかじゃなくて？\""
"1301403-22-レンゲ" = "……いいか？ここは無人島なんだ。"
"1301403-23-レンゲ" = "今回の修練は、この島でサバイバルすること！"
"1301403-24-レンゲ" = "みんな、こういう青春を過ごしてるんだろ？"
"1301403-25" = "[s] \"そ、そんな青春知らないかも……！\""
"1301403-26-レンゲ" = "ふふっ。じゃ、師匠も今から青春だな！"
"1301403-27-レンゲ" = "タモ網で魚を捕ろう！"
"1301403-28-レンゲ" = "おっ！魚がそっち行ったよ！"
"1301403-29" = "[s] \"私に任せて！うおぉ……！\""
"1301403-30-レンゲ" = "ははっ、惜しい！"
"1301403-31-レンゲ" = "手本見せるよ。アタシみたいにやってみて！"
"1301403-32" = "[ns5] \"無理だよ！？\"\n[ns6] \"魚の雨を降らすなんて！\""
"1301403-33-レンゲ" = "師匠だってできるさ。"
"1301403-34-レンゲ" = "しっかり構えて……正確に振る！"
"1301403-35-レンゲ" = "ほら、後ろで支えてるからさ、もう一回。"
"1301403-36-レンゲ" = "落ち着いて……大丈夫だから。"
"1301403-37-レンゲ" = "魚が目の前を通る、ちょうどいいとこで……。"
"1301403-38" = "[ns] \"やった！\""
"1301403-39-レンゲ" = "さすが、師匠！"
"1301403-40-レンゲ" = "よし、もう一回！支えてるから……。"
"1301403-41-レンゲ" = "支……え……？"
"1301403-42-レンゲ" = "（待て待て。水着なのに……近すぎだろ！？）"
"1301403-43-レンゲ" = "あ、あはは……。ここから先は師匠一人でやってみて！それが上達の近道だ！"
"1301403-44" = "[s] \"だ、だよね！\""
"1301403-45-レンゲ" = "う、うん！じゃ、今の感じで続けて！"
"1301403-46" = "（……その後、互いの距離を意識しながら魚捕りの青春活動を続けた）"
"1301403-47-レンゲ" = "あっという間だったな……。"
"1301403-48-レンゲ" = "今日は本当に楽しかったよ。"
"1301403-49-レンゲ" = "日差しの下で体を乾かした後は、二人で捕った魚をわけあって……。"
"1301403-50-レンゲ" = "ほんとに無人島に流れ着いても、こんな感じなのかな？"
"1301403-51-レンゲ" = "……。"
"1301403-52-レンゲ" = "前、無人島に漂着した二人が結ばれるって小説を読んだんだけど……。"
"1301403-53-レンゲ" = "アタシならどうするんだろうって、ずっと考えてたんだ。"
"1301403-54-レンゲ" = "師匠もこんな想像したことあるか？"
"1301403-55" = "[s7] \"うん、あるよ。\"\n[s8] \"そういう想像、楽しいよね。\""
"1301403-56-レンゲ" = "……そうなんだ。"
"1301403-57-レンゲ" = "も、もし無人島で過ごすとしたら、師匠はどんなパートナーと一緒にいたい？#n例えばその……サバイバル力が高いとか、いろいろあると思うんだけど。"
"1301403-58-レンゲ" = "……。"
"1301403-59-レンゲ" = "ふふ、無理に答えなくていいよ。"
"1301403-60-レンゲ" = "こうやって、師匠と青春を楽しむだけで十分だし。"
"1301403-61-レンゲ" = "……いつか教えてほしいけど。"
"1301403-62-レンゲ" = "いや……なんでもない！"
"1301403-63-レンゲ" = "あっ！もうすっかり暗くなっちゃったな。さっさと準備しよう！"
"1301403-64" = "[s] \"キャンプのことだよね？\""
"1301403-65-レンゲ" = "師匠とのキャンプ……確かに魅力的な青春活動だな。"
"1301403-66-レンゲ" = "でも、今回の目標は「無人島でサバイバル」だ。"
"1301403-67-レンゲ" = "脱出方法を考えるのも大切だろ？"
"1301403-68-レンゲ" = "漁師さんを呼ぶのもいいけど……。"
"1301403-69-レンゲ" = "……自力で脱出するまでが、無人島生活かなって。"
"1301403-70-レンゲ" = "だから、いかだを作って脱出しようと思うんだ！"
"1301403-71-レンゲ" = "木もたくさん生えてるし……作れそうだね！"
"1301403-72" = "[s] \"な、何を作るって！？\""
"1301403-73-レンゲ" = "もちろん、いかだだよ！今から取り掛かれば、明日中にはできるんじゃないかな？"
"1301403-74-レンゲ" = "さあ！アタシらの青春と生存のために、頑張ろう！"
"1301403-75" = "[s] \"お、おー……！\""
"1301403-76" = "（……その後、レンゲと徹夜でいかだを作り、島から脱出した）"
