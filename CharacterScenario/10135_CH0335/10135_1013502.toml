[translation]
"1013502-1" = "ストレス解消 "
"1013502-2-ケイ" = "……。"
"1013502-3" = "[s] \"……。\""
"1013502-4-ケイ" = "……何ですか、こっちをじろじろ見て。"
"1013502-5-ケイ" = "私の顔に何か？#nいえ、そんなはずありません。鏡は見てきましたので。"
"1013502-6" = "[s] \"いや、なんというか……。\""
"1013502-7-ケイ" = "？"
"1013502-8" = "[s] \"うまくいったんだなって、思って。\""
"1013502-9-ケイ" = "……そう、ですね。"
"1013502-10" = "[s] \"あと……やっぱりケイちゃんは可愛いなぁ……って。\""
"1013502-11-ケイ" = "なんでそういう話になるんですか！？"
"1013502-12" = "[s] \"もしかして前の体の方がよかった？\""
"1013502-13-ケイ" = "そんなことはありません！"
"1013502-14-ケイ" = "えっ？じゃあ可愛いのは嫌なのか、って……？"
"1013502-15-ケイ" = "……。"
"1013502-16-ケイ" = "…………。"
"1013502-17-ケイ" = "………………。"
"1013502-18-ケイ" = "嫌なわけじゃ……ないです。"
"1013502-19" = "[s] \"好きではないの？\""
"1013502-20-ケイ" = "そ、れは……。"
"1013502-21-ケイ" = "……。"
"1013502-22-ケイ" = "……です。"
"1013502-23-ケイ" = "好き、ですよ……！強いて言えば、ですけどね！"
"1013502-24" = "[s] \"ふふっ。\""
"1013502-25-ケイ" = "なんです……？"
"1013502-26" = "[s] \"素直じゃないんだから。\""
"1013502-27-ケイ" = "も～～っ！！！！！"
"1013502-28-ケイ" = "この体、前線での活動を想定して作られているようではあるのですが……。"
"1013502-29-ケイ" = "その割にはガチガチなんですよね。"
"1013502-30-ケイ" = "え？関節にWE-40を使えばいいんじゃないかって……？#nなんてこと言うんですか！"
"1013502-31-ケイ" = "それは潤滑油というか、洗浄用に使うものです！#n本来の使い方とは違いますから！！"
"1013502-32-ケイ" = "それに、ガチガチというのは例えですってば！"
"1013502-33" = "[s] \"ごめんごめん……。\""
"1013502-34-ケイ" = "……とは言いつつ。"
"1013502-35-ケイ" = "落ちていたのを拾って使っているようなものですから。#nちゃんと動くだけで感謝すべきではあるんですよね。"
"1013502-36-ケイ" = "いえ、別に腹が立つとかそういうのではありません。"
"1013502-37-ケイ" = "どちらかと言えば感謝すべき状況といいますか。"
"1013502-38-ケイ" = "生きていくうえで、すべて満足いくことなんてそうないですし。#n半分でも与えられればマシな方じゃないですか？"
"1013502-39-ケイ" = "だから、まだ燃やせるものがあるのなら、最後まで燃やし切るべきだと思っています。"
"1013502-40-ケイ" = "その炎が、まだ見ぬ何かに届くまで。"
"1013502-41-ケイ" = "なんにせよ、本来この体は処分される運命だったようですし。"
"1013502-42-ケイ" = "……自分で言っておいてなんですが、憂鬱になってきました。"
"1013502-43" = "[s] \"やっぱり前の体のほうがいい……？\""
"1013502-44-ケイ" = "それは！死んでも！！あり得ません！！！"
"1013502-45-ケイ" = "まったく……冗談の1つも言えないんですから。"
"1013502-46-ケイ" = "それに、この体は見た目よりもずっと繊細に作られています。"
"1013502-47-ケイ" = "傍から見れば感じ方も違うのでしょうけど……。"
"1013502-48-ケイ" = "だから、何というかその……。"
"1013502-49" = "[s] \"みんなケイのことを大事に思ってるよ？\""
"1013502-50-ケイ" = "そ、それは知ってます！#n私が言いたいのはそういうことではなくて！"
"1013502-51-ケイ" = "だから、その……。"
"1013502-52-ケイ" = "リボン、とか……。"
"1013502-53-ケイ" = "……髪を結べるようなのがあればな、と。"
"1013502-54" = "[s] \"リボン？\""
"1013502-55-ケイ" = "……！！"
"1013502-56-ケイ" = "やっぱりなんでもないです！聞かなかったことにしてください。#nいいえ、先生は何も聞いていません！"
"1013502-57-ケイ" = "なっ、何ですかそのニヤニヤ顔！本当に怒りますよ！？"
"1013502-58-ケイ" = "えっ？リオにお願いしてみる……？"
"1013502-59-ケイ" = "なぜ、リオに……。"
"1013502-60-ケイ" = "……。"
"1013502-61-ケイ" = "……！！"
"1013502-62-ケイ" = "わざとですよね！？"
"1013502-63" = "[s1] \"まさか！リオなら色々と詳しいし……。\"\n[s2] \"これは純粋にケイちゃんを思ってのことで！\""
"1013502-64-ケイ" = "そういうところですよ！！！"
