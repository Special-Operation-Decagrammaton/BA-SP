[translation]
"2002606-1" = "キヴォトスの生徒が不幸なのはなぜ？"
"2002606-2" = "シャーレ・執務室"
"2002606-3" = "（今日のシャーレ当番は、ミノリだった)"
"2002606-4-ミノリ" = "む……。"
"2002606-5-ミノリ" = "むう…………。"
"2002606-6" = "[s] \"何か悩みでもあるの？\""
"2002606-7-ミノリ" = "……ああっ、申し訳ない。#nシャーレの仕事をサボタージュするつもりはないぞ。"
"2002606-8-ミノリ" = "ただ、少し気になることがあってな……。"
"2002606-9" = "[s] \"聞かせてもらえる？\""
"2002606-10-ミノリ" = "他でもない、[USERNAME]先生のことだ……。"
"2002606-11" = "[s] \"……私？\""
"2002606-12-ミノリ" = "前にモモトークで、キヴォトスの全生徒が幸せになれる方法について話しただろう。"
"2002606-13-ミノリ" = "不幸な生徒が生まれる理由は、#n一部のブルジョワがプリンのように希少な資源を独占するからだ。"
"2002606-14-ミノリ" = "しかし、プリンとは異なり、その資源が無形の場合……"
"2002606-15-ミノリ" = "どのように分配したら良いのか、悩んでいたんだ。"
"2002606-16" = "[s] \"話が見えないんだけど……。\""
"2002606-17-ミノリ" = "シャーレ当番を希望する生徒が後を絶たないことを、先生は知っていたか？"
"2002606-18-ミノリ" = "考えてみれば、当然だろう。先生と2人で過ごせる貴重な時間を得られるからな。当番と言っても業務量は少ないうえ、むしろ相談事を解決してもらえるときた。"
"2002606-19-ミノリ" = "つまり……シャーレ当番の時間は、生徒を幸せにする無形の資源と言える！"
"2002606-20-ミノリ" = "しかし、先生の時間は限られている。シャーレの当番になれるチャンスは、誰にでも訪れるわけではない。一部の生徒が、何度も当番に選ばれることもあるじゃないか。"
"2002606-21-ミノリ" = "これはブルジョワどもがプリンを何個も食べるのと同じだ。#n社会を不平等たらしめる原因に違いない！"
"2002606-22" = "[s] \"そ、そうなのかな……？\""
"2002606-23-ミノリ" = "プリンは公平に分けられるが、先生の時間はそうもいかないだろう。"
"2002606-24-ミノリ" = "全生徒に1日ずつ当番を割り振っても、先生と会えないまま卒業する生徒は存在する。"
"2002606-25-ミノリ" = "たとえば、1日に数百人ずつ、時間単位で当番を割り振れば……"
"2002606-26" = "[s1] \"それは難しいね……。\"\n[s2] \"説明に時間を取られて、仕事が回らなくなるかな……。\""
"2002606-27-ミノリ" = "その通り。生徒の幸せを実現するために仕事が回らなくなっては、元も子もない。"
"2002606-28-ミノリ" = "これは全て、先生が1人しかいないのに対して、キヴォトスの生徒数が膨大だから発生した問題だ。"
"2002606-29-ミノリ" = "先生の身体が分裂できるなら良いんだが……"
"2002606-30" = "[s3] \"それは無理だよ！？\"\n[s4] \"恐ろしいことを！\""
"2002606-31-ミノリ" = "ふふっ……冗談だ、冗談。"
"2002606-32-ミノリ" = "そんなことは実現できないと分かっている。"
"2002606-33-ミノリ" = "そもそも、そう簡単に幸せになる方法が見つかるものなら、我々の同志たちは必死に戦ってないだろう。"
"2002606-34" = "[ns] \"ミノリの悩みは、十分わかったよ。\""
"2002606-35" = "[ns5] \"でも、当番をすれば幸せになれるわけじゃないから。\"\n[ns6] \"私のことが苦手な生徒もいるだろうし……。\""
"2002606-36-ミノリ" = "いや、そんなこと、絶対にあり得ない！"
"2002606-37-ミノリ" = "現にあたしは、一緒にいるだけで幸せを感じるほど居心地がいい。"
"2002606-38-ミノリ" = "それこそ可能なら、毎日現場に先生を連れていきた――"
"2002606-39-ミノリ" = "あ、あたしは今、なんて……？"
"2002606-40-ミノリ" = "独り言とはいえ、工務部の部長として労働者たちの模範となるべき者が……"
"2002606-41-ミノリ" = "……まるでブルジョワの[ruby=ごと]如[/ruby]く、先生を独占しようと考えるとは！"
"2002606-42" = "[s] \"……そっち？\""
"2002606-43-ミノリ" = "この頃、学園外の資本家から依頼を何度か受けたせいで、自分でも気づかぬうちに染まってしまったのか……！"
"2002606-44-ミノリ" = "先生、あたしは反省をしなくてはならない！"
"2002606-45-ミノリ" = "そこに座って、よく聞いていてくれ！#nなにか誤りがあれば、厳しく指摘を頼むぞ！！"
"2002606-46" = "[ns] \"そこまでしなくても……。\""
"2002606-47" = "（その後、ミノリの反省という名の自己批判を聞き留めた）"
