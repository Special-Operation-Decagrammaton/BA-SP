[translation]
"1007706-1" = "しばらくは"
"1007706-2" = "（約束の時間に合わせて、公園に向かった）"
"1007706-3-？？？" = "あっ……先生だ。"
"1007706-4-？？？" = "まさか、このタイミングで来ちゃうなんて……"
"1007706-5" = "[s1] \"この声は……イチカ？\"\n[s2] \"上から声がするような……？\""
"1007706-6-イチカ" = "はは！先生、上っすよ！上！"
"1007706-7-イチカ" = "待ってくださいね、今ちょっと取り込み中で……"
"1007706-8-イチカ" = "これ取ったら、すぐ降りるんで！"
"1007706-9-イチカ" = "よいっ……しょ。"
"1007706-10" = "[wa:200]― [log=이치카]はは！[wa:1000]先生、[wa:700]こっちっす！[wa:900]こっち！[/log]"
"1007706-11" = "― [log=이치카]見えるっすか？[/log]"
"1007706-12" = "― [log=이치카]あ―[wa:1000]これはただの[wa:800]風船っすけど……。[/log]"
"1007706-13" = "[wa:800]― [log=이치카]なんだか、[wa:900]コレ持ってると[/log]"
"1007706-14" = "[wa:100]― [log=이치카]遊園地ではしゃぐ[wa:800]子供みたいに見えちゃうっすね……[wa:1800]はは。[/log]"
"1007706-15" = "― [log=이치카]あ！[wa:600]私のじゃないっすよ！[/log]"
"1007706-16" = "― [log=이치카]……その、[wa:900]成り行きで、[wa:1200]ちょっと。[/log]"
"1007706-17" = "[ns3] \"誰かが困ってるんだよね？\"\n[ns4] \"人助け中？\""
"1007706-18" = "[wa:100]― [log=이치카]あ、[wa:500]あれっ……[wa:900]そうなんすけど……[/log]"
"1007706-19" = "[wa:100]― [log=이치카]あ、[wa:500]あれっ……[wa:900]そうなんすけど……[/log]"
"1007706-20" = "[wa:100]― [log=이치카]どうして分かるんすか？[/log]"
"1007706-21" = "― [log=이치카]なんでだろ……？[/log]"
"1007706-22" = "― [log=이치카]顔に出ちゃってたとか……？[/log]"
"1007706-23" = "[wa:800]― [log=이치카]まぁいいや……[/log]"
"1007706-24" = "― [log=이치카]この角度から先生を見るのは、[wa:1800]初めてっすね。[/log]"
"1007706-25" = "― [log=이치카]視点が違うと、[/log]"
"1007706-26" = "― [log=이치카]見え方も違ってくる[wa:1100]気がするというか……[/log]"
"1007706-27" = "[wa:1300]― [log=이치카]……なんだか、[wa:400]面白いっす。[/log]"
"1007706-28" = "― [log=이치카]この感じ、[wa:1000]気に入ったっす！[wa:1000]……はは！[/log]"
"1007706-29" = "（イチカは木から飛び降りると、軽く会釈をしてどこかに走っていった）"
"1007706-30" = "（少しして戻ってきたイチカの手からは、風船が消えていた）"
"1007706-31-イチカ" = "はぁ、はぁ……ただいまっす！"
"1007706-32-イチカ" = "にしても、来るの早かったすね。#n待たせちゃって申し訳ないっす。"
"1007706-33-イチカ" = "さっきの風船、子供が手を離して木に引っかかっちゃって。"
"1007706-34-イチカ" = "それでその子が木に登ろうとしてたんすけど、危ないんでベンチで待っててもらって代わりに取ってきたんすよ。"
"1007706-35-イチカ" = "……ん？"
"1007706-36-イチカ" = "すごいって……？"
"1007706-37-イチカ" = "ああ、たしかにあの木、すごい高いっすね。"
"1007706-38-イチカ" = "先生は木まで褒めるなんて、さすがは褒め上手っす！"
"1007706-39-イチカ" = "これくらいサラッと褒められるように私もなりたいっすよ。"
"1007706-40-イチカ" = "でも、そう簡単に言葉が出てこないんすよねぇ。"
"1007706-41" = "[s5] \"今の言葉は、木の高さじゃなくて……\"\n[s6] \"イチカを褒めたんだけど……\""
"1007706-42-イチカ" = "私を、ですか……？"
"1007706-43-イチカ" = "……ん？"
"1007706-44-イチカ" = "当然のように人助けをするのがすごいって……？"
"1007706-45-イチカ" = "ま、まあ……褒められて悪い気はしないっすけど！"
"1007706-46-イチカ" = "……いや、やっぱここは素直に受け取っておくっす。#nありがとうございます、先生。"
"1007706-47-イチカ" = "……へへっ。"
"1007706-48-イチカ" = "それで……えっと。"
"1007706-49-イチカ" = "連絡した理由なんですが……"
"1007706-50-イチカ" = "まあその、何度か会ってるので……#nもしかしたら気づいてるのかもしれないんすけど。"
"1007706-51-イチカ" = "その、要は……"
"1007706-52-イチカ" = "んー……これをどう説明したもんっすかね。"
"1007706-53" = "[s7] \"何かに本気になりたいんだよね？\"\n[s8] \"夢中になれる何かを見つけたいんだよね？\""
"1007706-54-イチカ" = "……はは。"
"1007706-55-イチカ" = "やっぱ、気付いてたっすよね～……"
"1007706-56-イチカ" = "まあ……私もなんとなくそういう雰囲気を出してたし、当然か。"
"1007706-57-イチカ" = "……そうっすね、おっしゃる通りっす。#nそれで、先生に相談したら何か変わるんじゃないかなって。"
"1007706-58-イチカ" = "先生や正義実現委員会の皆さんは、いつも私のことを褒めてくれるっすけど……"
"1007706-59-イチカ" = "他の人たちが何かに熱中したり、没頭してるところを見ると、羨ましく感じるんすよ。"
"1007706-60-イチカ" = "……できることがたくさんあったところで、やりたいことがなければ意味がないじゃないっすか。"
"1007706-61-イチカ" = "自分の好きなことに夢中になってる人の方が、圧倒的に輝いてるっす。"
"1007706-62-イチカ" = "……でも、こんな話を他の人にしたら嫌味としか思われないんで、先生にしか話せなくて……"
"1007706-63-イチカ" = "……って感じっす。"
"1007706-64-イチカ" = "お気づきだとは思いますが……こんな話をするのも、先生が初めてで。"
"1007706-65-イチカ" = "やっぱ私って、手のかかる生徒っすよね～"
"1007706-66-イチカ" = "先生だから頼ったのは本当っすけど……#n他の人を頼りにしてないとか、そういう訳ではないっすよ。"
"1007706-67-イチカ" = "けどこういう内容は、先生に相談するのがピッタリなのかなーとか思って。"
"1007706-68-イチカ" = "もちろん、って……はは。そう言ってくれると思ったっす。"
"1007706-69-イチカ" = "よし、それじゃ……"
"1007706-70-イチカ" = "アドバイスをお願いします！"
"1007706-71-イチカ" = "今まで私と話してきて、なんとな～くでいいんですが……"
"1007706-72-イチカ" = "……私に合いそうなものって何がありますか？"
"1007706-73-イチカ" = "先生なら、分かると思ったんですけど……"
"1007706-74-イチカ" = "……やっぱ、さすがにいきなりだったっすかね。"
"1007706-75-イチカ" = "……ん？"
"1007706-76-イチカ" = "知ってるけど、まだ今は言えない……？"
"1007706-77-イチカ" = "えっと……"
"1007706-78-イチカ" = "それはどういう意味っすか？"
"1007706-79-イチカ" = "……ん？"
"1007706-80-イチカ" = "先にやるべきことがある……？"
"1007706-81" = "[s9] \"まずは[ruby= ・   ・]探す[/ruby]のをやめてみよう。\"\n[s10] \"もっと自分の気持ちに正直になって、好きなようにしよう。\""
"1007706-82-イチカ" = "……へ？"
"1007706-83-イチカ" = "聞き間違い、っすかね……？#n今、なんて……"
"1007706-84-イチカ" = "探すのをやめるって、どういう……？"
"1007706-85-イチカ" = "もしかして、私には難しいから諦めた方が……？"
"1007706-86-イチカ" = "あ、そうではないんすね……良かった。"
"1007706-87" = "[s11] \"イチカに問題があるわけじゃないよ。\"\n[s12] \"ただ、急いで探す必要はないと思うんだ。\""
"1007706-88-イチカ" = "ん～……？"
"1007706-89-イチカ" = "なんか、分かりそうな……分からないような。"
"1007706-90-イチカ" = "ふむ……"
"1007706-91-イチカ" = "……へへっ。"
"1007706-92-イチカ" = "……ごめんなさい。#n嘘はつきたくないんで隠さず言うと……まだよく分かってないっす。"
"1007706-93-イチカ" = "自分的には、もう自分の気持ちに正直だと思ってたんで……"
"1007706-94-イチカ" = "ま、でも……"
"1007706-95-イチカ" = "先生がそう言うってことは、きっと理由があるんすよね……"
"1007706-96-イチカ" = "だから、もう少し自分の気持ちに正直になってみるということで……"
"1007706-97-イチカ" = "……先生の言葉を信じてみようと思います。"
"1007706-98" = "[s13] \"ん……？\"\n[s14] \"今の感じは……\""
"1007706-99-イチカ" = "よし！思い立ったが吉日って言うっすもんね。"
"1007706-100-イチカ" = "始めてみますか、気持ちに正直な私を！"
"1007706-101-イチカ" = "……というわけで。"
"1007706-102-イチカ" = "今日は一日中、私と遊んでください！"
"1007706-103" = "（その後、イチカと遊園地を遊び尽くした）"
"1007706-104" = "（帰り道にイチカが見せた表情は、どこか晴れ晴れとしていた）"
