[translation]
"1007702-1" = "何事もほどほどが一番"
"1007702-2" = "（シャーレの仕事でトリニティに向かうと……）"
"1007702-3" = "（既に校門前でイチカが待っていた）"
"1007702-4-イチカ" = "…………。"
"1007702-5-イチカ" = "……あ。"
"1007702-6-イチカ" = "先生～！こっちっす、こっち。"
"1007702-7-イチカ" = "時間ピッタリっすね。#n忙しいって聞いてたので、もうちょっと遅いかと思ってたっす。"
"1007702-8" = "[s1] \"ちゃんと約束した時間には行くよ。\"\n[s2] \"イチカを待たせるわけにはいかないからね。\""
"1007702-9-イチカ" = "はは、そんなに気を遣わなくても良かったんすけどね。"
"1007702-10-イチカ" = "でも、やっぱ嬉しいっす。#n先生が来てくれるって聞いて楽しみにしてたっすから。"
"1007702-11-イチカ" = "今日はツイてる日かも。"
"1007702-12-イチカ" = "……ん？"
"1007702-13-イチカ" = "普段はどんな仕事をしてるのか、って……？#nえーっと……"
"1007702-14-イチカ" = "学園外の人に会ったり、トラブルの仲裁をしたり……"
"1007702-15-イチカ" = "そんな感じで、主に警備と仲裁っすね。"
"1007702-16-イチカ" = "まあ、今回は人手が足りてたから、私が先生と一緒に仕事をすることになった感じっす。"
"1007702-17-イチカ" = "あ、念のため言っておきますが、嫌ってわけじゃないっすから！"
"1007702-18-イチカ" = "むしろ、個人的には助かったというか……"
"1007702-19-イチカ" = "殺伐とした雰囲気の中、仲裁のために立ち会ったり、トラブルに対処するのと比べたら、それはもう……"
"1007702-20-イチカ" = "結構あれってキツいんすよ……はは。"
"1007702-21" = "[s3] \"そうだよね……\"\n[s4] \"すごく分かるよ。\""
"1007702-22-イチカ" = "あはは！結構マジトーンっすね。#n案外、似た者同士だったりして。"
"1007702-23-イチカ" = "でも、分かってくれて嬉しいっす。"
"1007702-24-イチカ" = "そういう事だから、ちょっと今日の段取りが悪くてもあまり気にしないでほしいっす。"
"1007702-25-イチカ" = "んじゃ、時間も時間なんでそろそろ行きましょっか。"
"1007702-26-イチカ" = "まずはこっちっす。"
"1007702-27-イチカ" = "もうすぐっす。この先の……"
"1007702-28-イチカ" = "……ん？"
"1007702-29-チンピラA" = "ああん？ふざけてんのか？"
"1007702-30-チンピラA" = "どら焼きは粒あんだろ！！"
"1007702-31-ヘルメット団A" = "はぁ！？#n粒あんとか歯に挟まるじゃねぇか！こしあんはなめらかで口溶けがいいんだよ！"
"1007702-32-チンピラA" = "なっ、コイツ……！！"
"1007702-33-ヘルメット団A" = "やんのか！？#n粒あんになんか負けねぇぞ？"
"1007702-34-チンピラA" = "はぁぁあああっ！？！？"
"1007702-35-イチカ" = "はぁ……小学生じゃないんすから……"
"1007702-36-イチカ" = "……ん？"
"1007702-37-イチカ" = "放置してて大丈夫なのかって……？"
"1007702-38-イチカ" = "……ああ、私が正義実現委員だからっすか？"
"1007702-39-イチカ" = "それは……そうっすが。"
"1007702-40-イチカ" = "んー、どうしましょっか……"
"1007702-41-イチカ" = "……ま、今はいいんじゃないすか？#n今日は先生を案内するのが仕事っすからね。"
"1007702-42-イチカ" = "銃撃戦を始めてるわけでもないんで、今すぐ仲裁に入る必要もないかなーって。#n余計なお節介かもしれませんし。"
"1007702-43-イチカ" = "何かあったら、他の正義実現委員が来るんで大丈夫っす。#n私は先生の仕事を手伝わないと。"
"1007702-44-イチカ" = "ああいうのにいちいち首を突っ込んでたら、先生の用事がいつまで経っても終わらないっすよ。本末転倒じゃないすか。"
"1007702-45" = "[s5] \"こっちの予定まで考えてくれてありがとう。\"\n[s6] \"臨機応変だね。\""
"1007702-46-イチカ" = "まあ、うまく線引きができてるだけじゃないっすかね。#n何事もほどほどにって言うじゃないすか。"
"1007702-47-イチカ" = "……ん？"
"1007702-48-イチカ" = "あまり聞かない言葉……？#nああ、他の正義実現委員会のからってことっすか？"
"1007702-49-イチカ" = "たしかに他の皆は、真面目すぎるところもあるんで……"
"1007702-50-イチカ" = "なんとなく想像つくっす、ははは！"
"1007702-51-イチカ" = "……まあ私は、そういうところがカッコいいと思うっすけどね。"
"1007702-52-イチカ" = "いつもヘラヘラしているような私より、ずっと……"
"1007702-53-イチカ" = "……それじゃ、次の場所に出発っと！#nここでお喋りしてても、仕事は進まないっすから。"
"1007702-54-イチカ" = "ほら、行くっすよ、先生。"
"1007702-55" = "（騒ぎが起きている場面に何度も遭遇したが、イチカは基本的にスルーしつつ、急ぎの対応が必要そうなところでは応援の連絡を入れていた）"
"1007702-56" = "（おかげで、予定通り午後には仕事を終えられた）"
"1007702-57-イチカ" = "ふぅ……こんなところっすかね。"
"1007702-58-イチカ" = "お疲れ様でした、先生！#nなんだかんだ予定通りに終わって良かったっす。"
"1007702-59" = "[s7] \"全部イチカのおかげだよ。\"\n[s8] \"今日は本当に助かったよ。\""
"1007702-60-イチカ" = "……私っすか？"
"1007702-61-イチカ" = "またまた～、そんなことを言って。"
"1007702-62-イチカ" = "私も、いつもと違って新鮮だったし楽しかったっす！#nこういう仕事なら、また喜んで受けたいっすね。"
"1007702-63-イチカ" = "……なんで、もし先生が良ければっすけど。"
"1007702-64-イチカ" = "またご一緒できたら嬉しいなー、なんて。はは。"
"1007702-65-イチカ" = "……って言っても、気を遣う必要はないっすからね。"
"1007702-66-イチカ" = "じゃ、送ってくっすよ。"
"1007702-67-イチカ" = "自分の仕事は……うーん、ま、その後でも大丈夫そうっすね。"
"1007702-68-イチカ" = "……ん？ "
"1007702-69-イチカ" = "仕事があったのか、って……？#nあ、別に大したことじゃないんすけど。"
"1007702-70-イチカ" = "いろんなところで騒ぎが起きてたアレっす。"
"1007702-71-イチカ" = "まあ一応、正義実現委員会のメンバーっすから、何か起きてないかくらいは確認しておこうかなと。"
"1007702-72-イチカ" = "先生の仕事を優先しただけで、最初から放置する気はなかったっすよ。"
"1007702-73-イチカ" = "……へ？"
"1007702-74-イチカ" = "一緒に行くんすか……？"
"1007702-75-イチカ" = "ん～、先生は忙しいんじゃ……？"
"1007702-76-イチカ" = "しかも、これは私の仕事っすよ……？"
"1007702-77" = "[s9] \"生徒の仕事を手伝うのも、先生の役目だから。\"\n[s10] \"イチカの仕事が遅れた原因は、私に責任があるから。\""
"1007702-78-イチカ" = "そ、そうっすか……？#nんー、いや、なんか違う気がするような……"
"1007702-79-イチカ" = "「そっちの方が気が楽」……？#n先生がっすか？"
"1007702-80-イチカ" = "んー……ん～～～……"
"1007702-81-イチカ" = "…………。"
"1007702-82-イチカ" = "……はは。"
"1007702-83-イチカ" = "ま、そうっすね。#n先生がそこまで言ってくれるなら。"
"1007702-84-イチカ" = "個人的にも、なんかちょっと得した気分っす。"
"1007702-85-イチカ" = "……じゃ、行っちゃいますか！へへっ。"
"1007702-86-イチカ" = "その代わりに……と言っちゃアレなんすが……"
"1007702-87-イチカ" = "私の仕事が終わる頃には日が暮れてるでしょうから、先生を送らせてほしいっす。"
"1007702-88-イチカ" = "その方が……"
"1007702-89-イチカ" = "私の気も楽なんで。"
"1007702-90" = "（イチカの仕事を終えてから、シャーレまで送ってもらった）"
