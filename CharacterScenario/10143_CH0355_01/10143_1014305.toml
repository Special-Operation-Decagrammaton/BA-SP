[translation]
"1014305-1" = "思い出の上書き"
"1014305-2" = "[ns] \"……。\""
"1014305-3-シュン" = "先生？ど、どうかしましたか……？"
"1014305-4" = "[s] \"本当に……昨日と同じことを？\""
"1014305-5-シュン" = "や、やはり……迷惑、でしょうか……？"
"1014305-6-シュン" = "昨日の記憶を上書きするために、もう一度同じ場所に行こう……だなんて……。"
"1014305-7" = "[s1] \"そんなことはないよ！\"\n[s2] \"二回目だから、退屈しないかと思って……。\""
"1014305-8-シュン" = "いいえ。そんなことはありません。"
"1014305-9-シュン" = "「幼い頃」と「大きくなってから」では感じるものが違いますから。"
"1014305-10-シュン" = "あ……。私はそうでも、先生はつまらないですよね……？"
"1014305-11" = "[s3] \"わ、私は楽しみだよ！\"\n[s4] \"今日は「シュン」と一緒だから！\""
"1014305-12-シュン" = "……。"
"1014305-13-シュン" = "そう言ってくださり、ありがとうございます。"
"1014305-14-シュン" = "では、今日一日よろしくお願いしますね。"
"1014305-15-ラフティングガイド" = "楽しいラフティングを始めます！今から注意事項をお話ししますね。"
"1014305-16-ラフティングガイド" = "では出発しましょう！"
"1014305-17-シュン" = "よろしくお願いします。"
"1014305-18-ラフティングガイド" = "右側に、大きな穴の開いた岩がありますよね？"
"1014305-19-シュン" = "えっと……水牛みたいな形なので、「水牛岩」ですか？"
"1014305-20-ラフティングガイド" = "おお～鋭い！それともご存知でしたか？ありがとうございます。"
"1014305-21-ラフティングガイド" = "お連れの方、こんな博識な女性とご一緒とは羨ましいですね！"
"1014305-22-シュン" = "え、え！？あの、その……！"
"1014305-23-ラフティングガイド" = "今日は波が荒いですから、しっかりつかまってください！"
"1014305-24" = "[ns] \"あ、ああ！？\""
"1014305-25-シュン" = "先生！？"
"1014305-26-ラフティングガイド" = "この急流を越えるまで、お互いにしっかりつかまっていてください！"
"1014305-27-シュン" = " つ、つかまって、だそうです。"
"1014305-28-シュン" = "……。"
"1014305-29-シュン" = "ほら……遠慮なさらず、ぎゅっとお願いします。"
"1014305-30" = "[s] \"う、うん……！\""
"1014305-31-ラフティングガイド" = "これで本日のラフティングは終了です！"
"1014305-32-シュン" = "ありがとうございました！"
"1014305-33-シュン" = "……。"
"1014305-34-シュン" = "い、いかがでしたか？"
"1014305-35-シュン" = "昨日とは違う……新しい経験になりましたか？"
"1014305-36-シュン" = "私は……そんな気がします。"
"1014305-37" = "[s] \"わ、私も……新しい経験だったよ！\""
"1014305-38-シュン" = "良かったです……。"
"1014305-39-シュン" = "では！これから商店街に行ってみましょうか？"
"1014305-40-シュン" = "昨日最初に食べたものが串焼きでしたから、今日は……。"
"1014305-41-シュン" = "……。"
"1014305-42-슌 수영복02" = "あの……先生。"
"1014305-43-シュン" = "今日は……保護者としてではなく、#n私の、旅のパートナーとして一緒に歩いてくれますか？"
"1014305-44" = "[s] \"ん？分かった、そうしようか。\""
"1014305-45-シュン" = "ありがとうございます、先生。それでは……。"
"1014305-46" = "（シュンが突然、さりげなく腕を組んできた……！）"
"1014305-47-シュン" = "……いい、ですよね？今日は[ruby=・]パ[/ruby][ruby=・]ー[/ruby][ruby=・]ト[/ruby][ruby=・]ナ[/ruby][ruby=・]ー[/ruby]……ですから。"
"1014305-48-シュン" = "ふふ……。"
"1014305-49-シュン" = "改めて、ありがとうございます。先生。"
"1014305-50" = "（シュンと一緒に、のんびりと街を回った）"
"1014305-51" = "（途中でお腹が空いたので、道中の飲食店で食事をした……）"
"1014305-52-シュン" = "昨日も今日も甘えさせていただき、ありがとうございます。"
"1014305-53" = "[s] \"こちらこそ、ありがとうね。\""
"1014305-54-シュン" = "ふふ、そう思っていただけるなんて光栄です。"
"1014305-55-シュン" = "……。"
"1014305-56-シュン" = "今日は不思議な経験ができました。"
"1014305-57" = "[s] \"不思議な経験？\""
"1014305-58-シュン" = "昨日と今日……状況はほとんど同じでしたが……。"
"1014305-59-シュン" = "行動は少し違いました。"
"1014305-60-シュン" = "自分で言うのもなんですが……。#n昨日よりも「大人」の振る舞いをしていたと思うんです。"
"1014305-61-シュン" = "同時に、幼い頃の自分も思い出したので……。"
"1014305-62-シュン" = "なんだか……。"
"1014305-63-シュン" = "山や川はそのままなのに、私だけが変わったように感じました。"
"1014305-64" = "[s] \"山と川もゆっくりと変わるものだよ。\""
"1014305-65-シュン" = "そうですね。でもそれは、本当に途方もない時間をかけてです。"
"1014305-66-シュン" = "私もこれからいろんな経験をして、いつか大人になるのでしょうが……。"
"1014305-67-シュン" = "先生のような「ちゃんとした大人」になれるのかな、と思ってしまいました。"
"1014305-68-シュン" = "え？そんな、過大評価なんてしていません。"
"1014305-69" = "[s] \"大人は……心の中に子供の自分が三人はいるらしいよ。\""
"1014305-70-シュン" = "す、数字が具体的なのが、逆に心に響きますね……。"
"1014305-71-シュン" = "人は結局、いつまでも幼い心を持っているのでしょうか？"
"1014305-72-シュン" = "ふふ……。"
"1014305-73-シュン" = "でしたら、先生の中にも……いたずらっ子が隠れているってことですね？"
"1014305-74" = "[s5] \"シュンお姉ちゃん！一緒に遊ぼうよ！\"\n[s6] \"ねぇねぇ、遊んで！\""
"1014305-75-シュン" = "せ、先生！？"
"1014305-76-シュン" = "……。"
"1014305-77-シュン" = "さあ、こっちにいらっしゃい。[USERNAME]ちゃん。一緒に遊びましょう？"
"1014305-78" = "[s7] \"シュンお姉ちゃん、ありがとう！”\n[s8] \"わ～い！シュンおねえちゃん、やさしい！\""
"1014305-79-シュン" = "はい。一緒にいっぱい遊びましょうね。"
"1014305-80" = "（次の瞬間、目の前がシュンの柔らかさでいっぱいになった……！）"
"1014305-81" = "[ns] \"！？！？\""
"1014305-82-シュン" = "しーっ。いい子ですね、[USERNAME]ちゃん。"
"1014305-83-シュン" = "なにも、考えなくていいんですよ。"
"1014305-84-シュン" = "今だけは……。"
"1014305-85" = "[ns] \"……。\""
"1014305-86-シュン" = "……。"
"1014305-87" = "[s] \"……。\""
"1014305-88-シュン" = "……。"
"1014305-89-シュン" = "……せ、先生……？何かおっしゃってください……！"
"1014305-90-シュン" = "……。"
"1014305-91" = "[s] \"……ご、ごめん。雰囲気に呑まれて……\""
"1014305-92-シュン" = "い、いえ！私のほうが……。"
"1014305-93-シュン" = "悪い気はしませんでしたし……。むしろ良かったというか……。#n欲を言えば、もっとしていたかったというか……。"
"1014305-94-シュン" = "こ、コホンッ！"
"1014305-95-シュン" = "夏の渓谷というのは！恐ろしいですね！"
"1014305-96" = "[s] \"そ、そうだね！本当に！\""
"1014305-97-シュン" = "ですから先ほどのことは、全て夏の渓谷のせいにしましょう！"
"1014305-98" = "（激しく賛成してうなずいた！）"
"1014305-99-シュン" = "……。"
"1014305-100-シュン" = "ふふふっ……！"
"1014305-101-シュン" = "どうしたんですか、先生？そんな顔をされて。"
"1014305-102-シュン" = "え？私も普段と違うように見えますか？"
"1014305-103-シュン" = "……。"
"1014305-104-シュン" = "ふふっ、これも……夏の渓谷のせいですね。"
"1014305-105" = "（シュンと一緒に、気まずさがなくなるまで笑った）"
"1014305-106-シュン" = "ところで、先生？"
"1014305-107-シュン" = "昨日と今日のことですが……。"
"1014305-108-シュン" = "幼い私と今の私、どちらがお好きですか？"
"1014305-109" = "[ns] \"……！\""
"1014305-110" = "[ns] \"ど、どっちも先生にとっては同じシュンだから……！\""
"1014305-111-シュン" = "……ダメです。"
"1014305-112-シュン" = "そのような「先生らしい」お答え、今回は受け付けられません！"
"1014305-113" = "（尚も食い下がるシュンをどうにかごまかして、宿泊先に帰った……）"
