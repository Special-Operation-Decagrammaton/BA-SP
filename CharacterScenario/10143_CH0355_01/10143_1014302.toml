[translation]
"1014302-1" = "ウォーターベッド"
"1014302-2" = "（シュンと渓谷の水辺に来た……）"
"1014302-3-シュン" = "わぁっ……水が冷たくて気持ち良いですね。"
"1014302-4" = "[s] \"泳ぐの上手だね。\""
"1014302-5-シュン" = "ふふ、ありがとうございます。"
"1014302-6-シュン" = "子供たちに教える身として、ある程度泳げないといけませんから。"
"1014302-7-シュン" = "それに、元々泳ぐのは好きなんです。"
"1014302-8" = "[s] \"そうなんだ？\""
"1014302-9-シュン" = "ええ、このなんとも言えない浮遊感がたまらなくて。"
"1014302-10-シュン" = "重力から解放されて、リラックスできるんです。"
"1014302-11-シュン" = "それに水泳は、美容にも色々と効果的ですし……。"
"1014302-12-シュン" = "有酸素運動の中でも、消費カロリーが高いので。"
"1014302-13-シュン" = "プールは、塩素系の消毒剤が使われている関係で――"
"1014302-14-シュン" = "お肌にはあまり良くないと言われていますが……。"
"1014302-15-シュン" = "それを差し引いても、良い運動だと思いますよ。"
"1014302-16-シュン" = "……先生は泳ぐのは得意ですか？"
"1014302-17" = "[s1] \"まあまあかな。\"\n[s2] \"大したことないよ。\""
"1014302-18-シュン" = "でしたら……ここまでいらっしゃってください。"
"1014302-19-シュン" = "この辺りは浅いのでご心配なく。"
"1014302-20-シュン" = "それに、もしもの時は私がお助けしますから。"
"1014302-21" = "（ゆっくり、シュンの方へ歩いて行った）"
"1014302-22-シュン" = "なんだか、ウォーターベッドで寝ているみたいです。"
"1014302-23" = "[ns] \"本当の「ウォーターベッド」だね。\""
"1014302-24-シュン" = "ふふっ、先生の声が……いつもと違う形で聞こえて面白いです。"
"1014302-25-シュン" = "よろしければ、先生も一緒にいかがですか？"
"1014302-26-シュン" = "……たしかに、二人とも流されたら危険かもしれませんね。"
"1014302-27-シュン" = "ふふ、それでしたら……。"
"1014302-28-シュン" = "このまま少しの間……見守っていただけますか？"
"1014302-29" = "（しばらくの間、静かに浮かぶシュンを見守った）"
"1014302-30-シュン" = "そうだ。フルーツを水に冷やしておいたのですが、召し上がりませんか？"
"1014302-31-シュン" = "スイカにメロン、モモ、ブドウ、スモモ……好みが分からなかったので色々用意してきました。"
"1014302-32" = "[s] \"お、多いね……。\""
"1014302-33-シュン" = "ふふ。残ったら持ち帰るので、お好きなものを召し上がってください。"
"1014302-34" = "（シュンは慣れた手つきでフルーツの皮を剥いていく）"
"1014302-35" = "（その様子を眺めていたら……突然口の中にモモが入ってきた）"
"1014302-36-シュン" = "お味はいかがですか？"
"1014302-37" = "[ns] \"と、とても甘くておいしいよ。\""
"1014302-38-シュン" = "それと？"
"1014302-39" = "[ns] \"みずみずしくて……。\""
"1014302-40-シュン" = "ふふっ、私が食べる先生のことを考えながら剥いたからだと思います。"
"1014302-41" = "[ns] \"う、うん。そうかもね……！\""
"1014302-42-シュン" = "ふふっ、まだまだあるので、たくさん食べてください。"
"1014302-43" = "（シュンと一緒に夏のフルーツを満喫した）"
"1014302-44-シュン" = "それでは先生も――"
"1014302-45-シュン" = "「ウォーターベッド」……やってみませんか？"
"1014302-46" = "[s] \"えっ、私も？\""
"1014302-47-シュン" = "大丈夫です。私にお任せください。"
"1014302-48-シュン" = "リラックスして、仰向けになって――"
"1014302-49-シュン" = "息を大きく吸い込んで、手足を左右に広げると……。#nほら、ゆっくりと体が浮いてきますよ。"
"1014302-50-シュン" = "万が一のために……先生の頭は私が支えておきますね。"
"1014302-51" = "（シュンの言う通りにしてみると――）"
"1014302-52" = "（ゆっくりと体が浮いてきた）"
"1014302-53-シュン" = "いかがですか？"
"1014302-54" = "[ns] \"本当だ。いつもと声が違って聞こえる……。\""
"1014302-55-シュン" = "ふふっ、でしょう？"
"1014302-56-シュン" = "それに、とてもリラックスできますよね？"
"1014302-57-シュン" = "……ゆっくり頭を動かすと、周りの景色が見えますよ。"
"1014302-58-シュン" = "あまり大きく動かすとバランスを崩すかもしれませんので、気をつけてください。"
"1014302-59-シュン" = "今日は本当に良いお天気ですね。"
"1014302-60-シュン" = "輝く太陽の下で――"
"1014302-61-シュン" = "川のせせらぎが涼しく感じます。"
"1014302-62-シュン" = "こうしていると……まるで――"
"1014302-63-シュン" = "この世には私と先生だけしかいないような気分になります。"
"1014302-64" = "（体から力が抜けていき……頭もぼーっとしてきた）"
"1014302-65-シュン" = "本当にそうなってしまったら、大変ですが……。"
"1014302-66-シュン" = "ほんの少しの間だけ、なら……。"
"1014302-67" = "（夏の日差しは焼けるような熱さだったが、水は反比例するように冷たい）"
"1014302-68" = "（周りの音が、少しずつ小さくなり始めた……）"
"1014302-69-シュン" = "誰も見ていないところで、私と二人きりになれたら……。"
"1014302-70-シュン" = "そう、今のように……。"
"1014302-71" = "（頭が、ふわふわする……）"
"1014302-72-シュン" = "……。"
"1014302-73-シュン" = "先生は、何をしたいですか？"
"1014302-74" = "[ns] \"……。\""
"1014302-75-シュン" = "せ、先生？先生！？！？"
"1014302-76-シュン" = "こんなところで寝てはダメです！！！"
"1014302-77" = "[ns] \"危なかった……。\""
"1014302-78-シュン" = "私もビックリしました……。"
"1014302-79-シュン" = "水中で眠ってしまったら、体温が下がって危険なんですよ。"
"1014302-80" = "（そのとき、ちょうどくしゃみが出た）"
"1014302-81-シュン" = "だ、大丈夫ですか、先生！？"
"1014302-82-シュン" = "あ……寒気がします？"
"1014302-83-シュン" = "気をつけないと。夏の水辺では、風邪を引きやすいので。"
"1014302-84-シュン" = "さあ、こっちに座ってください。タオルで体を温めましょう。"
"1014302-85" = "（シュンが大きなタオルで体を包んでくれた）"
"1014302-86" = "（そして……）"
"1014302-87" = "[ns] \"しゅ、シュン……？\""
"1014302-88-シュン" = "……ふふっ。"
"1014302-89-シュン" = "体を温めるには、こうやってくっつくのが一番効果的なんです。"
"1014302-90-シュン" = "他意はありません。"
"1014302-91-シュン" = "ええ、本当ですよ。"
"1014302-92" = "[ns] \"そ、そう……？\""
"1014302-93" = "（次の瞬間、シュンがタオルと一緒に腕を腰に回してきた……！）"
"1014302-94-シュン" = "どうでしょう、先生。"
"1014302-95-シュン" = "もっと……あったまりませんか？"
"1014302-96" = "[s] \"そ、そうだね……！\""
"1014302-97-シュン" = "ふふっ、良かったです。"
"1014302-98-シュン" = "もしも先生の身に何かあってはいけませんので。"
"1014302-99" = "（そうやって、私たちは温まるまで体を寄せ合った）"
