[translation]
"1014303-1" = "夏。いつもとは違う一面。"
"1014303-2-シュエリン" = "こんにちは！先生！！！"
"1014303-3" = "[ns] \"……。\""
"1014303-4-シュエリン" = "どうかしましたか？"
"1014303-5" = "[s] \"いつもとは違った一面って……。\""
"1014303-6-シュエリン" = "えへへ。そうです。間違っていませんよね？"
"1014303-7" = "[s] \"たしかにそうだけど……。\""
"1014303-8-シュエリン" = "ほら、遊びに行きましょう！"
"1014303-9-シュエリン" = "時間は有限ですよ！"
"1014303-10" = "（シュエリンの手に引かれ、ロープウェイ乗り場に向かった……）"
"1014303-11-シュエリン" = "見てください！建物がおもちゃみたいですよ！"
"1014303-12-シュエリン" = "あの山、本当に不思議な形です……！"
"1014303-13-シュエリン" = "この辺りはコウノキがたくさん生えているんですね！"
"1014303-14" = "[s] \"ところで……体は大丈夫なの？\""
"1014303-15-シュエリン" = "あ……「若返りの秘薬」のこと、ですよね？"
"1014303-16-シュエリン" = "錬丹術研究会によると、以前よりも安全になったらしいです。"
"1014303-17-シュエリン" = "不安定なときがあるとのことですが、体には問題ないそうです。"
"1014303-18" = "[ns] （不安定なときがある……？）"
"1014303-19-シュエリン" = "あの、どうかしましたか？#nもしかして……「シュエリン」とは……遊びたくないのですか？"
"1014303-20" = "[ns] \"まさか！そんなことないよ！\""
"1014303-21-シュエリン" = "良かったです。……私を嫌いになっちゃったのかなって心配しました。"
"1014303-22-シュエリン" = "え？そんなことは絶対にありえないって……。"
"1014303-23-シュエリン" = "……。"
"1014303-24-シュエリン" = "えへへ、ありがとうございます！"
"1014303-25-シュエリン" = "あ、到着したみたいですね！"
"1014303-26-シュエリン" = "今日、先生と一緒にしたかったことは……。"
"1014303-27-シュエリン" = "ラフティングです！"
"1014303-28-ラフティングガイド" = "本日はようこそお越しくださいました！"
"1014303-29-ラフティングガイド" = "楽しいラフティングですが、危険も伴います。"
"1014303-30-ラフティングガイド" = "ご安心ください。ボートには私も乗りますので。"
"1014303-31-ラフティングガイド" = "一に安全、二に安全、三四がなくて、五に安全です。"
"1014303-32-ラフティングガイド" = "もしもボートから落ちてしまった場合は――"
"1014303-33-ラフティングガイド" = "みなさん、パドルを持ちましたか？では出発しましょう！"
"1014303-34-シュエリン" = "わあー！！！"
"1014303-35" = "[s] \"水が冷たいですね！\""
"1014303-36-ラフティングガイド" = "はい！漕いでいると体が熱くなってくるので、とても気持ち良いですよ！"
"1014303-37-ラフティングガイド" = "はいっ、いっち、にっ、いっち、にっ！"
"1014303-38-シュエリン" = "――いっち、にっ！"
"1014303-39" = "[s] \"いっち、にっ！！\""
"1014303-40" = "（ガイドに従って漕ぎ始めた！）"
"1014303-41-シュエリン" = "あ、先生！見てください！"
"1014303-42-シュエリン" = "私たち、あの急流を下るんですね！"
"1014303-43-ラフティングガイド" = "最初の大きなポイントですよ！岩に気をつけてください！"
"1014303-44-シュエリン" = "きゃー！！！"
"1014303-45" = "（ボートが適度な高さまで上がった！）"
"1014303-46" = "（川の水が波立ち、すっかり濡れてしまった！）"
"1014303-47-ラフティングガイド" = "右側に、大きな穴の開いた岩がありますよね？"
"1014303-48-ラフティングガイド" = "あれは水牛のような形に見えるので「水牛岩」と呼ばれています。"
"1014303-49-シュエリン" = "あ、確かに水牛に見えますね！"
"1014303-50-ラフティングガイド" = "大きな穴は、昔ある将軍が大砲を撃ってできたと言われているんです。"
"1014303-51-シュエリン" = "ずいぶん大きな砲弾ですね……。"
"1014303-52-ラフティングガイド" = "30分経過しました！この辺りで少し休憩しましょう！"
"1014303-53-シュエリン" = "あの、休憩中は何をしたらいいですか？"
"1014303-54-ラフティングガイド" = "泳いでも、水に浮いていても、このままボートで休んでも……。#n何をしても構いませんよ。"
"1014303-55-シュエリン" = "だそうです、先生！一緒に泳ぎましょう！"
"1014303-56" = "[s1] \"ごめん……私はちょっと休憩……。\"\n[s2] \"その代わり、シュエリンが泳いでいるところを撮ってあげるね。\""
"1014303-57-シュエリン" = "写真を撮ってくれるんですか……？"
"1014303-58-シュエリン" = "分かりました！よろしくお願いします！"
"1014303-59-シュエリン" = "写真、ずっとずっと大事にしてくださいね？"
"1014303-60" = "[s3] \"……？\"\n[s4] \"う、うん……？\""
"1014303-61-シュエリン" = "えへへ！"
"1014303-62" = "（シュエリンは水の中に入り、楽しそうに泳ぎ始めた）"
"1014303-63-シュエリン" = "先生！今です！"
"1014303-64-シュエリン" = "はい！チーズ！"
"1014303-65-シュエリン" = "これとか、どうでしょう……？"
"1014303-66" = "[ns] \"！？！？\""
"1014303-67-ラフティングガイド" = "ここから激しい急流ポイントです！気を引き締めて行きますよ！"
"1014303-68-ラフティングガイド" = "高く上がってから……ドーンッと落ちますからね！"
"1014303-69-シュエリン" = "わ、わぁ……ドキドキします……！"
"1014303-70" = "[s] \"気を抜かないようにしよう……！\""
"1014303-71-シュエリン" = "はい！"
"1014303-72-シュエリン" = "……いよいよですね！"
"1014303-73-シュエリン" = "あははっ！"
"1014303-74-シュエリン" = "すごいですね！"
"1014303-75-シュエリン" = "わあっ！？"
"1014303-76" = "[ns] \"危ない！\""
"1014303-77-ラフティングガイド" = "そのまましっかり、つかまっていてください！"
"1014303-78-シュエリン" = " つ、つかまって、だそうです。"
"1014303-79-シュエリン" = "えへへ……手を離したらダメですからね？"
"1014303-80-シュエリン" = "……。"
"1014303-81-シュエリン" = "先生の胸、温かくて……大きくて……。"
"1014303-82-シュエリン" = "すごく安心します。"
"1014303-83" = "[s] \"う、うん……。\""
"1014303-84-ラフティングガイド" = "これで本日のラフティングは終了です！"
"1014303-85-シュエリン" = "ありがとうございます！"
"1014303-86" = "[s] \"ありがとうございました！\""
"1014303-87-ラフティングガイド" = "では引き続き、観光を楽しんでくださいね！"
"1014303-88-シュエリン" = "先生、先生！次は何をしましょう？"
"1014303-89-シュエリン" = "えっとでも、そうですね……なんだか寒くなってきたので……。"
"1014303-90-シュエリン" = "温かいものが食べたいです！"
"1014303-91-シュエリン" = "あ、先生！あれ、おいしそうです！"
"1014303-92-シュエリン" = "肉と野菜の串焼き……スパイスの香りがここまで漂ってきてます……！"
"1014303-93-シュエリン" = "あれは……米麺ですね！#nこの地域の米麺はピーナッツがたっぷり入っていることで有名なんですよ。"
"1014303-94-シュエリン" = "1つ注文して、分けて食べましょうか？"
"1014303-95-シュエリン" = "先生！次は冷たくて甘いものが食べたいです！"
"1014303-96-シュエリン" = "ここのフルーツかき氷がおいしいらしいですよ！#n小豆や緑豆、ゼリーまでトッピングできるんですって！"
"1014303-97" = "（こうしてシュエリンと一緒に商店街を、「完全攻略」していった）"
"1014303-98" = "（お互いに膨らんだお腹を見て思わず笑い合った）"
"1014303-99-シュエリン" = "ふう……。ちょっと食べ過ぎたみたいです。体が熱くなってきました。"
"1014303-100-シュエリン" = "だけどもう、泳ぐほどの元気はないですし……。"
"1014303-101-シュエリン" = "……。"
"1014303-102-シュエリン" = "あの、先生。"
"1014303-103" = "[s] \"どうしたの？\""
"1014303-104-シュエリン" = "今日は甘えさせてくれて、ありがとうございます。"
"1014303-105" = "[s5] \"これくらい、構わないよ。\"\n[s6] \"いつでも甘えてね。\""
"1014303-106-シュエリン" = "……。"
"1014303-107-シュエリン" = "やっぱり私、先生が大好きです！"
"1014303-108" = "（シュエリンは水辺のきれいな水たまりに座り込み、楽しそうに遊び始めた）"
"1014303-109" = "（少しぼーっとしながら、その様子を見つめていると……）"
"1014303-110-シュエリン" = "わ、わあ！？"
"1014303-111" = "[ns] \"ん……？ど、どうしたの！？！？\""
"1014303-112" = "[wa:2020]― [log=슌 수영복]えっ、[wa:600]ひゃああ！？[/log]"
"1014303-113" = "― [log=슌 수영복]せ、[wa:278]先生！？[/log]"
"1014303-114" = "― [log=슌 수영복]これは、[wa:630]その……！[/log]"
"1014303-115" = "[wa:1210]― [log=슌 수영복]そ、[wa:350]そういえば……。[/log]"
"1014303-116" = "― [log=슌 수영복]サヤさんが、[wa:1070]少し不安定になるかもと仰っていましたが……っ[wa:3000]まさか……？[/log]"
"1014303-117" = "[ns] \"ご、ごめん！\""
"1014303-118" = "[wa:880]― [log=슌 수영복]せ、[wa:440]先生が謝る必要はありません……！[/log]"
"1014303-119" = "― [log=슌 수영복]と、[wa:380]というか……[wa:970]あの……[wa:1280]えっと。[/log]"
"1014303-120" = "― [log=슌 수영복]わ、[wa:570]私はどうしたら……！[/log]"
"1014303-121" = "[ns] \"と、とりあえず……私はあっちに行くね！\""
"1014303-122" = "[wa:660]― [log=슌 수영복]ダメです！[/log]"
"1014303-123" = "― [log=슌 수영복]そ、[wa:260]その……！[/log]"
"1014303-124" = "― [log=슌 수영복]そこに立っていただいてもいいですか？[/log]"
"1014303-125" = "― [log=슌 수영복]隠れるので……。[/log]"
"1014303-126" = "[wa:2260]― [log=슌 수영복]私……[wa:1550]大丈夫、[wa:880]ですから。[/log]"
"1014303-127" = "― [log=슌 수영복]先生、[wa:750]でしたら……[/log]"
"1014303-128" = "― [log=슌 수영복]もう少し[wa:1120]このまま、[wa:1000]でも……。[/log]"
"1014303-129" = "（周囲の様子を伺いながら、どうにかシュンの水着を持ってきた……）"
"1014303-130-シュン" = "……。"
"1014303-131" = "[s] \"……。\""
"1014303-132-シュン" = "な、何か……おっしゃってください……。"
"1014303-133" = "[s] \"な、なんて言えばいいんだろう……？\""
"1014303-134-シュン" = "……。"
"1014303-135-シュン" = "わ、私だって分からないですよ……。"
"1014303-136" = "（恥ずかしかったせいだろうか）"
"1014303-137" = "（その後、シュンはいつもより口数が少なくなっていた……）"
