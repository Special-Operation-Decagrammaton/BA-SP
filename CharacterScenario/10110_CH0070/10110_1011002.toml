[translation]
"1011002-1" = "眠り姫からの誘い"
"1011002-2" = "（セイアのお願いを汲んで、人目を忍びながらトリニティを訪れた）  "
"1011002-3" = "[ns1] （……あれ？誰もいない？）  \n[ns2] （場所を間違えたかな？）  "
"1011002-4" = "（倉庫の扉が、少しだけ開いてる……？）"
"1011002-5" = "[ns3] \"お邪魔します……\"\n[ns4] \"誰かいませんか……？\""
"1011002-6-？？？" = "……ん？"
"1011002-7-？？？" = "ううん……。"
"1011002-8-？？？" = "……あ。"
"1011002-9-？？？" = "ふむ……。"
"1011002-10" = "[wa:430]― [log=세이아]……[wa:200]ああ、[wa:930]君か。[/log]"
"1011002-11" = "[wa:3340]― [log=세이아]これでも一応、[wa:1380]驚嘆を感じているよ。[/log]"
"1011002-12" = "[ns5] \"ごめん、勝手に入っちゃった。\"\n[ns6] \"ごめん、驚かせるつもりはなかったんだ。\""
"1011002-13" = "[wa:570]― [log=세이아]謝ることではないさ、[wa:2390]驚きとは[wa:1300]好意的な世界の拡大だ。[/log]"
"1011002-14" = "[wa:4170]― [log=세이아]私もまた、[wa:1980]それに焦がれていたとも[wa:1350]言える。[/log]"
"1011002-15" = "[wa:1230]― [log=세이아]しかし、[wa:500]ゆくりなきは……[/log]"
"1011002-16" = "[wa:3000]― [log=세이아]この様に君と、[wa:2380]目を交わしていることだとも。[/log]"
"1011002-17" = "[wa:1620]― [log=세이아]しかし[wa:670]何故……[/log]"
"1011002-18" = "[wa:3980]― [log=세이아]いや、[wa:1180]成程。[wa:960] [/log]"
"1011002-19" = "― [log=세이아]私から[wa:740]便りを出したのだったか、[wa:2600]失礼。[/log]"
"1011002-20" = "[wa:720]― [log=세이아]いや何、[wa:1700]用事があって[wa:640]呼んだわけではないのだ。[/log]"
"1011002-21" = "[wa:800]― [log=세이아]唯……[/log]"
"1011002-22" = "[wa:3560]― [log=세이아]君と交わす言葉に、[wa:2890]私はどこか[wa:1000]惹かれているようで。[/log]"
"1011002-23-セイア" = "突然呼び出して、迷惑ではなかったかい？"
"1011002-24-セイア" = "今更言うのも変な話ではあるがね。"
"1011002-25-セイア" = "……問題ない、と？"
"1011002-26-セイア" = "そうか。実に先生らしい。"
"1011002-27" = "[s7] \"ティーパーティーのことで呼ばれたのかと思ったよ。\"  \n[s8] \"何か公的な用事かなって。\"  "
"1011002-28-セイア" = "そう思うのも無理はない。あえて、そういう言い回しをしたのだから。"
"1011002-29-セイア" = "とはいえ、先に述べたとおりだ。"
"1011002-30-セイア" = "特段の理由があって、君を呼んだわけでは無いのだよ。"
"1011002-31-セイア" = "……今の私は、いささか「手のかかる子」なのかもしれない。"
"1011002-32-セイア" = "先生の気を引きたい……そう思ってしまったんだ。"
"1011002-33-セイア" = "きっと、君を呼ぶだけならば「会いたい」それで充分だったのだろうね。"
"1011002-34-セイア" = "だというのに、わざわざ、深読みができるような連絡をして。#nあまつさえ、呼び付けた当の本人は眠りこけているときた。[ruby=わらいぐさ]笑い種[/ruby]だね。"
"1011002-35-セイア" = "君がどこまで気づいているかは分からないけれど……"
"1011002-36-セイア" = "これで私は、存外に遠慮が無いんだ。"
"1011002-37-セイア" = "もちろん、トリニティやティーパーティーの名を汚さない範疇で……#nという但し書きは付くがね。"
"1011002-38-セイア" = "皆が皆、自由にやっている。#n私だって、一度くらいは勝手をしたくなる時もある。"
"1011002-39-セイア" = "それがたまたま、今回、このような形を成した……#nこのお話の顛末はこんなところだよ。"
"1011002-40-セイア" = "しかし、だ。その「一度」を、こうして使ってしまったのだから……"
"1011002-41-セイア" = "今後、むやみな呼び出しは止めるとしよう。"
"1011002-42-セイア" = "このままでは「面倒くさい生徒」に括られてしまうだろう？#n先生を困らせてみたいと思いこそすれ、嫌われてしまっては本末転倒だ。"
"1011002-43" = "[s9] \"どんな連絡をくれても構わないよ。\"\n[s10] \"むしろ、こんな話ができて嬉しい。\"  "
"1011002-44-セイア" = "まったく……君は本当に、良い先生なのだね。"
"1011002-45-セイア" = "然ればこそ、私のような生徒に絡まれて……先生も難儀するだろうとも。"
"1011002-46-セイア" = "少し話を変えようか。 "
"1011002-47-セイア" = "先生は私の体調について問わないのだね？#n多くは、身体を気遣う言葉から会話を始めるのだが。  "
"1011002-48-セイア" = "体調はどうなのか、もう平気なのか、辛くはないのか……と。  "
"1011002-49-セイア" = "いや……愚問だったな。"
"1011002-50-セイア" = "既に解は与えられていたね。"
"1011002-51" = "[s11] \"今の元気な姿が、答えだもんね。\"\n[s12] \"聞かなくても分かることだから。\"  "
"1011002-52-セイア" = "……少し無茶をしたが、期待以上の対価を得られた。"
"1011002-53-セイア" = "こんな形ではあるが、先生の言葉に甘えさせてもらおう。"
"1011002-54-セイア" = "ティーパーティーの「元ホスト」として、シャーレに協力依頼を。"
"1011002-55-セイア" = "……私の午睡に際して、警護を頼みたい。"
"1011002-56" = "（その後、セイアと一緒に部屋で少し昼寝をして、シャーレに戻った）  "
