[translation]
"1011005-1" = "語らいの第一歩"
"1011005-2-セイア" = "……先生？どうしてここに……？"
"1011005-3-セイア" = "流石にあれを「口実」と捉えて欲しいと言うほど、#n雑なお誘いをしているつもりはないのだが……。"
"1011005-4-セイア" = "いや、先生ならいつでも大歓迎だがね。"
"1011005-5-セイア" = "そんなことよりも、だ。ここはティーパーティーの専用図書館。"
"1011005-6-セイア" = "ティーパーティーに所属する生徒しか入れない場所なのだが……"
"1011005-7" = "[s1] \"歩いてたら偶然迷い込んでたんだ。\"\n[s2] \"道に迷ってたら辿り着いてたんだ。\""
"1011005-8-セイア" = "……まぁ、先生がそう言うのなら、そういうことにしておこう。"
"1011005-9-セイア" = "貴重な利用者が増えるのは、この図書館にとって喜ばしいことだからね。"
"1011005-10-セイア" = "これまで詳しく話す機会は無かったが……ティーパーティーは組織相応に、数多の生徒を抱えている。"
"1011005-11-セイア" = "「ティーパーティー専用の施設」もまた、必要に応じていくつか存在しているのだが……"
"1011005-12-セイア" = "こと、この図書館に関しては、御覧の通りの貸切状態なのだよ。"
"1011005-13-セイア" = "多くの生徒は、どうしてもここにしか無い資料を探す時くらいでしか、ここを利用しないんだ。"
"1011005-14-セイア" = "読書を目的として訪れるなら、より利便性の高い図書館が他にいくらでもあるのだよ。"
"1011005-15-セイア" = "なら、なぜ私はここで本を読むのか……ああ、もっともな疑問だ。"
"1011005-16-セイア" = "なるべく本は自室以外で読むよう心掛けている。"
"1011005-17-セイア" = "部屋だと居心地が良すぎていけない。"
"1011005-18-セイア" = "もし自室で本を開こうものなら、昼も夜もなく読み続けてしまうのだよ。"
"1011005-19-セイア" = "とはいえ外ならどこでもいいかと問われれば、#nそう容易い話でも無いのが難点でね。"
"1011005-20-セイア" = "本音を言えば、皆と一緒に本を読んで、語り合いたいところだが……"
"1011005-21-セイア" = "立場の違いは、少なからずの弊害をもたらすものだ。"
"1011005-22-セイア" = "「ティーパーティー」という立場は、望むと望まざるとに関わらず、#n私の内面を崇高なものとして、他者に推察させる。"
"1011005-23-セイア" = "つまるところ、議論にはならず――往々にして私の言葉は、その内容の如何を問わず「正しい意見」として解決される。"
"1011005-24-セイア" = "私は長らくそれが億劫でね。"
"1011005-25-セイア" = "気心の知れた間柄か、はたまた対等な立場か……"
"1011005-26-セイア" = "「ただ会話を楽しみたい」という願いの実現には、困難が伴うのだよ。"
"1011005-27" = "[s3] \"それだと寂しくない？\"\n[s4] \"この先もずっと一人で本を読むつもりなの？\""
"1011005-28-セイア" = "……君の言いたいことは分かっている。"
"1011005-29-セイア" = "心配は無用だ。"
"1011005-30-セイア" = "交友関係が破綻している訳では無いからね。日々を歩むに当たって、孤独を感じてはいないさ。"
"1011005-31-セイア" = "だが……そうだな……"
"1011005-32-セイア" = "我が儘を許してもらえるならば……"
"1011005-33-セイア" = "偶にで構わない。「読書」について、話し相手になってはくれないだろうか。"
"1011005-34-セイア" = "先生なら、私の「立場」など構いもせず……"
"1011005-35-セイア" = "「私」と気兼ねなく意見を交わしてくれるだろう？"
"1011005-36-セイア" = "さしもの私も、まずは先生となら、気兼ねなく意見を交わせると思うんだ。"
"1011005-37" = "[s5] \"もちろんいいよ。\"\n[s6] \"喜んで。\""
"1011005-38-セイア" = "二つ返事をしたこと、後悔しないでくれよ？"
"1011005-39-セイア" = "早速なのだが……前からやりたいと思っていたことがあるんだ。"
"1011005-40-セイア" = "私のお薦めを紹介させてもらってもいいだろうか。"
"1011005-41-セイア" = "いや、それとも先生好みの一冊を協力して見つけるのも良いな。#n何せここには、トリニティで著名な本のほぼすべてが所蔵されている。"
"1011005-42-セイア" = "よほど珍しい古書でもない限り、望みのものがきっと見つかるだろう。"
"1011005-43-セイア" = "万に一つ、ここに無かったとしても、#nティーパーティーの権限で一冊ぐらい取り寄せることもできるんだが……"
"1011005-44-セイア" = "そんなことをすれば、図書委員会の委員長が黙ってないだろう。"
"1011005-45-セイア" = "だが、本を薦めたいのは事実……こんな日のために[ruby=かね]予[/ruby]てより温めてきた、私の「おすすめリスト」を見てくれるかい？"
"1011005-46-セイア" = "これでも厳選をしていてね……"
"1011005-47-セイア" = "ふむ……なるほど……その本を選ぶとは……"
"1011005-48-セイア" = "......あ。"
"1011005-49" = "[s7] \"……セイア？\"\n[s8] \"どうしたの？\""
"1011005-50-セイア" = "あ、いや……先生が選んだその本だけ、ここにはないのだよ。"
"1011005-51-セイア" = "実は、ちょうど私が借りているところでね。"
"1011005-52-セイア" = "その本は、私の部屋に置いてあるんだ。"
"1011005-53-セイア" = "ピンポイントでそれを選ぶとは思うまいよ……。"
"1011005-54-セイア" = "ともあれ、部屋にある本を先生が選んでくれるとは……"
"1011005-55-セイア" = "今日は運が良いらしい。"
"1011005-56-セイア" = "本を渡すためにも、この後、私の部屋まで付き合ってくれるかい？"
"1011005-57-セイア" = "偶には、意図しない純粋な幸運を享受するのも悪くない。"
"1011005-58-セイア" = "今日も本を借りて行こうと思っていたのだが……なにぶん私は非力なものでね。"
"1011005-59" = "[ns9] \"セイア？\"\n[ns10] \"たくさん借りるんだね？\""
"1011005-60-セイア" = "こんな幸運に、そう何度も恵まれるとも限らない。"
"1011005-61-セイア" = "今日は少し欲張るとしよう。"
"1011005-62-セイア" = "一人で持ち帰るには、いささか重すぎるのだが……。"
"1011005-63-セイア" = "……先生。"
"1011005-64-セイア" = "手伝ってくれるかい？"
"1011005-65" = "（その後、セイアの本を一緒に部屋まで運んだ） "
"1011005-66" = "（セイアの「おすすめの本」は、#nまるで待っていたのかのようにテーブルの上に置かれていた）"
