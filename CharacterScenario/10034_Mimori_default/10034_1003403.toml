[translation]
"1003403-1" = "花嫁修行その１：家庭料理編"
"1003403-2" = "百鬼夜行・第7学生食堂"
"1003403-3-ミモリ" = "ちょうどここの学生食堂が空いてましたので、特別にお借りすることができました。"
"1003403-4-ミモリ" = "今日の大和撫子としての修行は事前にお伝えした通り、料理です。"
"1003403-5-ミモリ" = "なので、まずは鉄板の家庭料理に挑戦してみようかと。"
"1003403-6" = "[s] \"何の料理を作るの？\""
"1003403-7-ミモリ" = "家庭料理の代表格……"
"1003403-8-ミモリ" = "肉じゃがです！"
"1003403-9" = "[s1] \"にっ、肉じゃが！\"\n[s2] \"家庭料理の中の家庭料理！\""
"1003403-10-ミモリ" = "ふふ、大和撫子の目指すべき料理とは……。"
"1003403-11-ミモリ" = "ふふ、大和撫子の目指すべき料理とは……。"
"1003403-12-ミモリ" = "何よりもまず上品に、ですが過度に飾らず……それでいて、決して物足りなくもないものを作ることです。"
"1003403-13-ミモリ" = "肉じゃがは、作るだけならそれほど難しくはありません。材料もシンプルです。"
"1003403-14-ミモリ" = "大和撫子を目指してこれまで培ってきた私の実力をお見せするのに、ちょうどいい料理かなと思いまして。"
"1003403-15-ミモリ" = "先生は肉じゃが、お好きですか……？"
"1003403-16" = "[s3] \"愛してます。\"\n[s4] \"ミモリが作る物なら何でも！\""
"1003403-17-ミモリ" = "そ、それは良かったです。"
"1003403-18-ミモリ" = "ありがとうございます、ふふっ。"
"1003403-19" = "[s] \"この前のサンドイッチも、すごく美味しかったから。\""
"1003403-20-ミモリ" = "あ、あの時の……。"
"1003403-21-ミモリ" = "あ、ありがとうございます……！"
"1003403-22" = "[s] \"今回も楽しみにしてるね。\""
"1003403-23-ミモリ" = "そこまで言ってくださるなんて……。"
"1003403-24-ミモリ" = "……っ！"
"1003403-25-ミモリ" = "私、決めました！今回は今までにないほど、全力でお作りします！"
"1003403-26-ミモリ" = "一生懸命！全力で！"
"1003403-27" = "[s5] \"えっと、そこまで気合が入ると……。\"\n[s6] \"さっき言ってた「上品に」からは少し離れるのでは……？\""
"1003403-28-ミモリ" = "大丈夫です、お任せください！"
"1003403-29-ミモリ" = "大丈夫です、お任せください！"
"1003403-30" = "[s] \"わ、分かった。頑張って……？\""
"1003403-31" = "[ns] \"えっと、ミモリ……大丈夫？\""
"1003403-32-ミモリ" = "少々お待ちください、先生……今慎重に、針にぴったりになるように精緻な作業をしておりますので……。"
"1003403-33-ミモリ" = "1gも誤差が無いよう、レシピに書いてある通りに……。"
"1003403-34" = "[s] \"そこまで気にしなくてもいいんじゃないかな……？\""
"1003403-35-ミモリ" = "いいえ、そんなことはありません。"
"1003403-36-ミモリ" = "せっかく先生が楽しみにしてくださっているのですから、大和撫子を目指す者として、全力で先生の期待にお応えしてみせます。"
"1003403-37-ミモリ" = "きっと今日の日のために、私はこれまで力を蓄えてきたのです……。"
"1003403-38-ミモリ" = "そうに違いありません！"
"1003403-39" = "[s] \"心遣いは嬉しいけど……空回りしないといいな……。\""
"1003403-40" = "（トッ）"
"1003403-41-ミモリ" = "醬油、料理酒、砂糖、そしてお水の量に至るまで、寸分の狂いもなくレシピ通りです。"
"1003403-42-ミモリ" = "では、あらためて始めます！"
"1003403-43-ミモリ" = "これらの調味料を全て加えて……。"
"1003403-44-ミモリ" = "お肉と玉ねぎ、人参をお鍋に入れて、ゆっくり沸騰させます！"
"1003403-45" = "（グツグツグツ……）"
"1003403-46-ミモリ" = "こうやって沸騰してくると、玉ねぎが徐々に透き通ってきます。"
"1003403-47-ミモリ" = "このタイミングで火を弱めて……蓋をして、20分程煮詰めます……。"
"1003403-48-ミモリ" = "玉ねぎが透き通ったら、ジャガイモを入れて、さらに煮ます……。"
"1003403-49" = "（グツグツグツ……）"
"1003403-50-ミモリ" = "完成しました。私の全力を注いで作った、肉じゃがです……！"
"1003403-51-ミモリ" = "……食べていただけますか？"
"1003403-52" = "[s] \"うん、じゃあいただきます。\""
"1003403-53-ミモリ" = "……（ゴクリ）。"
"1003403-54" = "[s] \"あむっ、モグモグ……。\""
"1003403-55" = "[ns] \"……んんっ！？\""
"1003403-56-ミモリ" = "い、いかがですか？"
"1003403-57" = "[s] \"……しょっぱい、すっごく。\""
"1003403-58-ミモリ" = "え……？そ、そんな、きっちり測ったはずですのに……！ま、待ってください……！"
"1003403-59-ミモリ" = "ふーっ、ふーっ、はむっ……モグモグ。"
"1003403-60-ミモリ" = "うっ……しょっぱいですね……これは、いったい……。"
"1003403-61" = "[s] \"ミモリ、これ砂糖じゃなくて塩じゃない？\""
"1003403-62-ミモリ" = "あ、ああっ……！"
"1003403-63-ミモリ" = "ど、どうしてこんなミスを……す、すみません、先生……。"
"1003403-64-ミモリ" = "ちゃんと確認していれば……私、なんてことを……。"
"1003403-65-ミモリ" = "せっかく、先生に家庭料理を召し上がっていただく良い機会でしたのに……。"
"1003403-66-ミモリ" = "がっかりさせてしまいました……。"
"1003403-67-ミモリ" = "こんなことでは、大和撫子なんてまだまだです……。"
"1003403-68" = "[s] \"大丈夫だよ、ミモリ。\""
"1003403-69-ミモリ" = "ですが、先生……。"
"1003403-70" = "[s7] \"一度の失敗で、全部がダメになるわけじゃないから。\"\n[s8] \"ここからどう挽回するかを考えるのはどう？\""
"1003403-71-ミモリ" = "……お優しい言葉、ありがとうございます。先生。"
"1003403-72-ミモリ" = "……お優しい言葉、ありがとうございます。先生。"
"1003403-73-ミモリ" = "そうですね。大和撫子になろうというのに、すぐに意気消沈してしまうのも良くありません。"
"1003403-74-ミモリ" = "先生の仰る通り、お見苦しい姿を見せるよりも、"
"1003403-75-ミモリ" = "挽回する方法を探す方が建設的……ですね。"
"1003403-76-ミモリ" = "ですが、どうしましょう。こうなってしまっては……。"
"1003403-77-ミモリ" = "あっ、そういえばここの食堂の棚に……。"
"1003403-78-ミモリ" = "少々お待ちください、先生！"
"1003403-79" = "[ns] \"これって……。\""
"1003403-80-ミモリ" = "その……戸棚にカレーのルーが残っていたのを思い出しまして。"
"1003403-81-ミモリ" = "肉じゃがとカレーは、材料も似ていますし。"
"1003403-82-ミモリ" = "それをさらに大きな鍋で作れば、しょっぱい味もある程度調整できるのではないかな、と……。"
"1003403-83-ミモリ" = "も、もちろん無理して食べていただく必要は……！"
"1003403-84" = "[ns] \"はむっ……うん、すごく美味しいよ。ミモリ。\""
"1003403-85-ミモリ" = "よ、よかったです……。"
"1003403-86-ミモリ" = "……ふふっ。"
"1003403-87" = "[s] \"どうしたの？\""
"1003403-88-ミモリ" = "あ、いえ、考えてみたらカレーも、家庭料理の一つと言われるものだなと思いまして。"
"1003403-89-ミモリ" = "最終的には、どうにか先生に家庭料理を振舞うことができたので、"
"1003403-90-ミモリ" = "何だかほっとして、気が抜けてしまって。"
"1003403-91-ミモリ" = "これも、先生が諦めないでと言ってくださったおかげです。"
"1003403-92-ミモリ" = "そのことがすごく嬉しくて、つい。"
"1003403-93" = "[s] \"それは良かった。\""
"1003403-94-ミモリ" = "はい、ありがとうございます。"
"1003403-95-ミモリ" = "先生と一緒に修行ができて良かったです。"
"1003403-96-ミモリ" = "さあ、まだたくさん残っていますので……"
"1003403-97-ミモリ" = "もう一皿、如何ですか？"
"1003403-98" = "（そうして、ミモリと楽しい食卓を囲んだ）"
