[translation]
"1003420-1" = "大和撫子の本気"
"1003420-2-ミモリ" = "ようこそいらっしゃいました、先生！"
"1003420-3-ミモリ" = "今日は料理修行の成果をお見せしたくて……お時間をいただいた次第です。"
"1003420-4-ミモリ" = "それでは、さっそく家庭科室に行きましょう！"
"1003420-5-ミモリ" = "修行部室"
"1003420-6-ミモリ" = "着きまし――"
"1003420-7-ミモリ" = "って、なぜ家庭科室がこんなに散らかっているのですか！？"
"1003420-8-ミモリ" = "料理の修行以外にも、食事の準備に使ってはいますが……一体どうして……"
"1003420-9-家庭科室の管理者" = "ミモリちゃん……あ、シャーレの先生もいらしてるんですね、こんにちは。#nそれが……昨日の夜、魑魅一座がここでお祭りを開いたみたいで……"
"1003420-10-家庭科室の管理者" = "今から片付けても時間がかかっちゃうだろうから、今日は使えないかも……"
"1003420-11-ミモリ" = "……"
"1003420-12-ミモリ" = "いえ、大丈夫です。"
"1003420-13-修行部員" = "ミモリちゃん！？"
"1003420-14-ミモリ" = "今から片付けます。#nこの程度であれば、すぐに終わりますから。"
"1003420-15" = "[s] \"そうだね。一緒にやれば、すぐに終わるよ。\""
"1003420-16-ミモリ" = "えっ！？そんな……先生のお手を煩わせるわけには……"
"1003420-17-ミモリ" = "私がやりますので……お任せください！ここは私たち修行部の家庭科室ですから。片付ける場所や手順も慣れておりますので。"
"1003420-18-ミモリ" = "それに……大和撫子たるもの、魑魅一座がここでお祭りを開くことくらい事前に察知しておくべきで……"
"1003420-19-ミモリ" = "事前に現場を押さえ、ちゃんと片付けておかなければならなかったところです！"
"1003420-20" = "[s] \"それは大和撫子かな！？\""
"1003420-21-ミモリ" = "で、ですが……"
"1003420-22-ミモリ" = "私が事前に準備をしておかなかったから、こうなってしまったんです……"
"1003420-23-ミモリ" = "それなのに、先生にご迷惑をおかけしてしまうのは……"
"1003420-24" = "[s1] \"気にしないで、ミモリ。\"\n[s2] \"私がミモリを助けたいんだ。\""
"1003420-25-ミモリ" = "……。"
"1003420-26-ミモリ" = "先生がそこまで仰るのなら……"
"1003420-27-ミモリ" = "……よろしくお願いします、先生。"
"1003420-28-ミモリ" = "それでは、大分お時間をいただいてしまったので……"
"1003420-29-ミモリ" = "私、[ruby=みずは]水羽[/ruby]ミモリは修行部の副部長として……"
"1003420-30-ミモリ" = "今日は一段と気合を入れて！本気でとりかからせていただきます！"
"1003420-31" = "[s] \"いつも頑張ってくれているのに更に！？\""
"1003420-32-ミモリ" = "はい！#n素敵な大和撫子になるには、常に向上心を持って臨まなければなりませんから！"
"1003420-33-ミモリ" = "ですので、今日は……「アレ」を使います！"
"1003420-34" = "[ns] \"え、エプロン！？\""
"1003420-35-ミモリ" = "それでは、参ります！"
"1003420-36" = "（本気モード(？）のミモリに圧倒されてしまい、私の出番はなかった……)"
"1003420-37-ミモリ" = "ふぅ……お疲れ様でした、先生。"
"1003420-38-ミモリ" = "え？ほとんど私が片付けてしまった？"
"1003420-39-ミモリ" = "ふふっ、先生がいてくださったおかげです。"
"1003420-40-ミモリ" = "ですが……そうですね。#nもしかしたら、これのおかげもあるかもしれません。"
"1003420-41-ミモリ" = "……似合っていた、なんてそんな。"
"1003420-42-ミモリ" = "も、もう……先生ったら、からかわないでください。"
"1003420-43-ミモリ" = "からかっているわけではないのですか……？"
"1003420-44-ミモリ" = " ……。"
"1003420-45-ミモリ" = "つ、疲れていらっしゃるのかもしれませんね。#nまずは場所を変えましょうか！はい、こちらへどうぞ！"
"1003420-46-ミモリ" = "しばらくお待ちくださいね。お茶をご用意しますので。"
"1003420-47-ミモリ" = "……どうぞ。#nせっかくなので、和菓子もお持ちしました。"
"1003420-48-ミモリ" = "実は……この和菓子を作っている姿をお見せしたかったのですが……"
"1003420-49-ミモリ" = "……どう、でしょうか？お口に合いましたか？"
"1003420-50" = "[s] \"とても美味しいよ。お茶も良い香りだね。\""
"1003420-51-ミモリ" = "ふふっ、良かったです。"
"1003420-52-ミモリ" = "え？このエプロン、ですか？"
"1003420-53-ミモリ" = "……。"
"1003420-54-ミモリ" = "これは……私が初めて、漫画を読んで理想の自分を夢見たときに買ったエプロンです。"
"1003420-55-ミモリ" = "ずっと、ずっと大切にしてきた……私の宝物。"
"1003420-56" = "[s] \"新品なのかと思ったけど……\""
"1003420-57-ミモリ" = "ふふ、そうですか？#nよく見ると毛玉ができてますし、細かい部分を繕った跡もあるんですよ。"
"1003420-58-ミモリ" = "ですが、私にとって……これは何物にも代えがたいエプロンなんです。"
"1003420-59-ミモリ" = "着心地も良いですし、何よりこれを着ていると安心感が……"
"1003420-60-ミモリ" = "掃除に洗濯、料理、裁縫、読心……何でもできる気がしてくるんです。"
"1003420-61" = "[s] \"……読心？\""
"1003420-62-ミモリ" = "あっ、そ、その！"
"1003420-63-ミモリ" = "いえ！読……読書です！"
"1003420-64" = "（何度か読心について訊ねてみたが、すぐに話を逸らされてしまった……）"
"1003420-65-ミモリ" = "ずっと昔に買ったものなので、当時は裾を折らないと引きずってしまうほどでした。"
"1003420-66-ミモリ" = "ですが……このエプロンが似合う頃には、きっと夢に近づいているはずだ、と。#nそう自分に言い聞かせて修行を続けていたんです。"
"1003420-67-ミモリ" = "ふふっ……懐かしいですね。今思い返すと、少し恥ずかしくもありますが。"
"1003420-68" = "[s] \"恥ずかしがらなくていいと思うよ。\""
"1003420-69-ミモリ" = "そう……でしょうか？"
"1003420-70-ミモリ" = "あの頃の私は、どんなことでも成し遂げられると思っていました。"
"1003420-71-ミモリ" = "こうして、エプロンはちょうど良いサイズになりましたが……"
"1003420-72-ミモリ" = "幼い私が夢見た姿になれているのかは……よく分かりません。"
"1003420-73" = "（ミモリは十分頑張っているよ、と言おうとした瞬間――）"
"1003420-74-ミモリ" = "あ、先生。今、「十分頑張っているよ」って言おうとしませんでしたか？"
"1003420-75" = "[s] \"なんで分かったの！？\""
"1003420-76-ミモリ" = "ふふっ。先生ならそう言ってくださるだろうな、という信頼……でしょうか？"
"1003420-77" = "[s3] \"やっぱり、そのエプロンに何か秘密が！？\"\n[s4] \"エプロンと一緒だから、いつも以上の読心力が！？\""
"1003420-78-ミモリ" = "は、はい！？私はそんなこと言っていませんが……！"
"1003420-79-ミモリ" = "「全てを理解した」みたいな表情で見つめられても……！"
"1003420-80-ミモリ" = "先生？先生？？"
"1003420-81" = "（その後、ミモリと一緒にお茶を楽しんで過ごした）"
