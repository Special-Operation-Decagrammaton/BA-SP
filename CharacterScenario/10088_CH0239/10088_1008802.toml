[translation]
"1008802-1" = "静かなひととき"
"1008802-2" = "（カヨコが教えてくれた場所は、オペラハウス付近の狭い路地だった）"
"1008802-3" = "（人目の入らない、路地の奥まった場所にカヨコがいる）"
"1008802-4-？？？" = "……あ、先生。"
"1008802-5-？？？" = "早かったね。こっち。"
"1008802-6" = "[ns1] \"カヨコ？\"\n[ns2] \"こんな所で休んでるの？\""
"1008802-7-カヨコ" = "まあ……うん。"
"1008802-8-カヨコ" = "オペラハウスの近くは人が多いし、ゆっくりできないから。"
"1008802-9-カヨコ" = "かといって、仕事中にあんまり遠く離れるのもね……"
"1008802-10-カヨコ" = "だからここにいるの。"
"1008802-11-カヨコ" = "先生もそういう経験ない？"
"1008802-12-カヨコ" = "なんて言えばいいのかな……"
"1008802-13-カヨコ" = "うーん……ちょっと抜け出したくなる、みたいな？"
"1008802-14" = "[s3] \"それは……内緒かな。\"\n[s4] \"先生の立場としては、言えないかな。\""
"1008802-15-カヨコ" = "……ふふ、そっか。"
"1008802-16-カヨコ" = "大丈夫。伝わったよ。"
"1008802-17-カヨコ" = "まあ、そんなに心配しなくていいよ。"
"1008802-18-カヨコ" = "ちょっと休んだら、すぐ戻るから。"
"1008802-19-カヨコ" = "……うん？"
"1008802-20-カヨコ" = "ああ、大丈夫。"
"1008802-21-カヨコ" = "先生は邪魔になんてなってないよ。"
"1008802-22-カヨコ" = "一人でいたいなら、そもそも教えてないし。"
"1008802-23-カヨコ" = "それに……先生じゃなきゃ、呼んでなかったし。"
"1008802-24-カヨコ" = "先生が居て邪魔とかじゃないから、心配しないで。"
"1008802-25-カヨコ" = "むしろ、こういうの気に入ってるんだ。#n誰かと一緒に雑談するの。"
"1008802-26-カヨコ" = "あ……"
"1008802-27-カヨコ" = "言っとくけど、別に誰とでもってわけじゃないからね。"
"1008802-28-カヨコ" = "ふふ……。"
"1008802-29-カヨコ" = "ごめん、つい喋りすぎちゃった。"
"1008802-30-カヨコ" = "先生も休憩しに来てるのに、これじゃ休めないよね。"
"1008802-31-カヨコ" = "じゃあ……"
"1008802-32-カヨコ" = "ちょっと休もうか。"
"1008802-33" = "（その後、カヨコと特に喋ることなく、夕焼けを眺めながら時間を過ごした）"
"1008802-34" = "（10分ほど、柔らかく穏やかな空気が流れていた）"
"1008802-35-カヨコ" = "……もうこんな時間。"
"1008802-36" = "[s5] \"そろそろ帰ろうか。\"\n[s6] \"……穏やかな時間だったね。\""
"1008802-37-カヨコ" = "……ふふ。"
"1008802-38-カヨコ" = "……そうだね、帰ろっか。"
"1008802-39-カヨコ" = "……ほんと。"
"1008802-40-カヨコ" = "……そうだね。"
"1008802-41" = "[wa:1150]― [log=카요코 드레스]……いいね。[/log]"
"1008802-42" = "― [log=카요코 드레스]こうやって……[/log]"
"1008802-43" = "― [log=카요코 드레스]誰かと一緒に[wa:1700]ボーッと時間を[wa:800]過ごすなんて……[/log]"
"1008802-44" = "[wa:700]― [log=카요코 드레스]……ほとんど[wa:400]したことないかも。[/log]"
"1008802-45" = "― [log=카요코 드레스]……そう、[wa:900]いつも一人。[/log]"
"1008802-46" = "― [log=카요코 드레스]別に[wa:950]それで良いと思ってたし。[/log]"
"1008802-47" = "[ns7] \"こういうのも、悪くないね。\"\n[ns8] \"こういう時間、もっと増えてほしいね。\""
"1008802-48" = "[wa:1050]― [log=카요코 드레스]……本当に？[/log]"
"1008802-49" = "[wa:1050]― [log=카요코 드레스]……本当に？[/log]"
"1008802-50" = "― [log=카요코 드레스]ふふ、[wa:850]良かった、[wa:1430]先生も気に入ってくれて。[/log]"
"1008802-51" = "[wa:800]― [log=카요코 드레스]いいよね、[wa:1750]こうやって[wa:1200]静かに過ごすのってさ。[/log]"
"1008802-52" = "― [log=카요코 드레스]……あ、[wa:1050]別に[wa:570]普段がイヤってわけでは[wa:1080]ないんだけど。[/log]"
"1008802-53" = "― [log=카요코 드레스]……先生なら[wa:830]分かってるか。[/log]"
"1008802-54" = "[wa:630]― [log=카요코 드레스]ふう……[wa:2270]あのさ……。[/log]"
"1008802-55" = "― [log=카요코 드레스]……少しだけ……。[/log]"
"1008802-56" = "― [log=카요코 드레스]もう少しだけ……[wa:2700]ここにいて。[/log]"
"1008802-57-カヨコ" = "付き合ってくれてありがとう、先生。#n今日は本当に、ゆったりできた。"
"1008802-58-カヨコ" = "ひとりで居るときより……リラックスできたかも。"
"1008802-59-カヨコ" = "……うん？"
"1008802-60-カヨコ" = "そういうのは別に言わなくてもいい？なんで？"
"1008802-61" = "[ns9] \"言わぬが花ってやつだよ。\"\n[ns10] \"口にしなくても、十分伝わってるからさ。\""
"1008802-62-カヨコ" = "……あ。"
"1008802-63-カヨコ" = "……ふふ。"
"1008802-64-カヨコ" = "いつも思ってたけど、先生って。"
"1008802-65-カヨコ" = "……やっぱり、面白いね。"
