[translation]
"1008805-1" = "子供の意地"
"1008805-2" = "（便利屋から借りた資料を返しに、事務所を訪れた）"
"1008805-3-カヨコ" = "……あれ、先生？"
"1008805-4" = "[s1] \"カヨコ……その格好は……。\"\n[s2] \"ドレス気に入ったの？\""
"1008805-5-カヨコ" = "……まあ、ちょっとね。"
"1008805-6-カヨコ" = "そういう先生こそ、何か用なの？"
"1008805-7-カヨコ" = "うん？資料を返しに？"
"1008805-8-カヨコ" = "ああ、この前の件ね。"
"1008805-9-カヨコ" = "あっちの机の上に置いて。あとは私が整理するから。"
"1008805-10-カヨコ" = "……？"
"1008805-11-カヨコ" = "なんでこれを着てるのか……？"
"1008805-12-カヨコ" = "わざと聞かないであげたのに……どうして聞いちゃうかな。"
"1008805-13-カヨコ" = "まあ……それも先生らしいというか……。"
"1008805-14-カヨコ" = "……仕事で、ちょっとね。"
"1008805-15-カヨコ" = "最近、なんだかこういうのが増えたような……。"
"1008805-16-カヨコ" = "まあ、せっかくのドレスに使い道があるのは良いんだけど。"
"1008805-17-カヨコ" = "とはいえ、大体の仕事は……"
"1008805-18-カヨコ" = "や、全部って言っていいほど、目ぼしい収穫なんてなかったけど。"
"1008805-19" = "[s3] \"カヨコも大変だね。\"\n[s4] \"……頑張ってね。\""
"1008805-20-カヨコ" = "うーん。別にやりたくないとか、苦に感じることはないからね。"
"1008805-21-カヨコ" = "……え？"
"1008805-22-カヨコ" = "意外……？"
"1008805-23-カヨコ" = "まあ……"
"1008805-24-カヨコ" = "どんな格好でも、特に不満はないからね。"
"1008805-25-カヨコ" = "自分には似合わないって思ったけど、服そのものが嫌いってわけでもないし。"
"1008805-26-カヨコ" = "それに……"
"1008805-27-カヨコ" = "先生が「似合う」って言ってくれたし……。"
"1008805-28-カヨコ" = "お世辞じゃないってこと、私、信じるって決めたから……だから、こうしているわけ。"
"1008805-29" = "[ns5] \"うん。本当に素敵だと思うから。\"\n[ns6] \"お世辞じゃないよ。本心だから。\""
"1008805-30-カヨコ" = "……ほんと、思った通り。"
"1008805-31-カヨコ" = "…………。"
"1008805-32-カヨコ" = "……ふふ。"
"1008805-33-カヨコ" = "そういえば、先生。今朝送ったメッセージ、まだ覚えてる？"
"1008805-34-カヨコ" = "あとで時間ちょうだいって話。"
"1008805-35-カヨコ" = "もし良かったら、今日はどう？前みたいに夕食とかしたいけど。"
"1008805-36-カヨコ" = "ちょうど服も、あのときみたいになってるし……。"
"1008805-37-カヨコ" = "……今回は、私が奢るから。"
"1008805-38" = "[s7] \"食事なら、先生の私が買わないと。\"\n[s8] \"生徒に奢られるわけにはいかないからね。\""
"1008805-39-カヨコ" = "ダメ。"
"1008805-40-カヨコ" = "今回は私が買う。そうしなきゃ意味ないんだから。"
"1008805-41-カヨコ" = "気にすることないって？"
"1008805-42-カヨコ" = "そう言うと思ったよ。"
"1008805-43-カヨコ" = "じゃあ私も、あのとき先生が言ったの、そのまま返そうかな。"
"1008805-44-カヨコ" = "私の顔に免じて、ここは負けてあげて。生徒って、そういうものだからさ。"
"1008805-45" = "[ns9] \"なるほど、そう来るのか……。\"\n[ns10] \"そこまで言われちゃぁ……。\""
"1008805-46-カヨコ" = "……ふふ。"
"1008805-47-カヨコ" = "……ふふ。"
"1008805-48-カヨコ" = "どうやら効いたみたいね。"
"1008805-49-カヨコ" = "本当に大したことじゃないから。ただ、一緒に食事をするだけ。"
"1008805-50-カヨコ" = "そんなに気にすることないよ。こういう意地くらい、偶にはいいじゃん。"
"1008805-51-カヨコ" = "……うん。今はこれで十分だから。"
"1008805-52-カヨコ" = "その様子からして、オッケーってことでいいよね？"
"1008805-53-カヨコ" = "良かった。そういう素直なところ、先生の長所でもあるからね。"
"1008805-54-カヨコ" = "……ありがとう、先生。"
"1008805-55-カヨコ" = "じゃあ……。"
"1008805-56-カヨコ" = "……待っているからね。"
