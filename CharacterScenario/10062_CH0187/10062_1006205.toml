[translation]
"1006205-1" = "趣味の悩み"
"1006205-2" = "シャーレオフィス"
"1006205-3" = "（トキと一緒にシャーレの仕事を始めた）"
"1006205-4" = "[ns] \"トキってさ。\""
"1006205-5-トキ" = "はい、先生。"
"1006205-6" = "[s] \"こういう仕事、慣れてるよね。\""
"1006205-7-トキ" = "こういうお仕事、とは……？"
"1006205-8" = "[s] \"資料の整理とか書類仕事全般。\""
"1006205-9-トキ" = "僭越ですが、以前お仕えしていた方のもとでも、よくやっておりましたから。"
"1006205-10-トキ" = "ご指示くだされば、掃除や洗濯、料理まで、何でもいたしますよ。"
"1006205-11" = "[s1] \"これだけでも十分ありがたいよ。\"\n[s2] \"大変だと感じたりしない？\""
"1006205-12-トキ" = "シャーレのお仕事が、ですか？"
"1006205-13-トキ" = "特に大変だとは思いません。#nむしろ仕事が少なくて、どこか落ち着かないくらいです。"
"1006205-14-トキ" = "せっかく優秀なメイドがいるのですから、遠慮せずに有効活用すべきです。"
"1006205-15-トキ" = "例えば普段の護衛はもちろん、爆弾解除や対象の追跡、撃退、破壊、殲滅、滅亡……どんなことでも構いません。"
"1006205-16" = "[s] \"メイドだよね……？\""
"1006205-17-トキ" = "はい。これこそ、優秀なメイドに求められる能力です。"
"1006205-18" = "[s] \"そ、そうなのか……も？\""
"1006205-19-トキ" = "もちろん、私は完璧なメイドですので、全て可能です。"
"1006205-20" = "[s3] \"は、話は変わるけどさ！\"\n[s4] \"休日は何をしてるの？趣味とかないのかなって！\""
"1006205-21-トキ" = "シュミ……？"
"1006205-22-トキ" = "何を言っているのか、よく分かりません。#nシュミとはどのようなものなのですか？"
"1006205-23-トキ" = "余った時間に行うこと、ですか。"
"1006205-24-トキ" = "……難しい問題ですね。#n今まで特に時間が余るようなことはなく……。"
"1006205-25" = "[s5] \"それで本当にいいの！？\"\n[s6] \"トキにも楽しいことを見つけてもらわないと！\""
"1006205-26-トキ" = "せ、先生……？"
"1006205-27-トキ" = "はい？今すぐ行こう、って……？#nせ、先生、もう少し優しく……！"
"1006205-28" = "キヴォトス・市内"
"1006205-29" = "[ns] \"映画、どうだった？\""
"1006205-30-トキ" = "理解できませんでした。"
"1006205-31-トキ" = "どうしてわざわざ乱戦に持ち込んだのでしょうか？#n遠くから狙撃すれば、無駄な犠牲者を出すこともなかったでしょう。"
"1006205-32-トキ" = "それに最初から余計な話をせずに始末していれば、逃げられることもなかったと思いますが。"
"1006205-33" = "[s] \"ドラマ性の全否定！？\""
"1006205-34-トキ" = "他にも納得いかない点が多かったです。#nまずは冒頭のシーンなのですが……。"
"1006205-35" = "（トキは映画のいい加減な演出について、30分以上語り続けた）"
"1006205-36-トキ" = "……以上です。"
"1006205-37" = "[s] \"……の、喉乾かない？\""
"1006205-38-トキ" = "いえ、お気遣いありがとうございます。"
"1006205-39-トキ" = "はい？普通はもっと構えずに楽しむものなのですか？"
"1006205-40-トキ" = "なるほど……。#nどうやら映画を趣味にするには、鍛錬が必要なようです。"
"1006205-41" = "商店街"
"1006205-42" = "[ns] \"漫画も合わなかったか……。\""
"1006205-43-トキ" = "絵を通じて情報を伝えるという趣旨は理解しました。"
"1006205-44-トキ" = "ですが、情報の密度や正確性を考慮すると、漫画にする必要性はあるのでしょうか？"
"1006205-45-トキ" = "情報の密度では文字に劣り、正確性では映像に劣ります。"
"1006205-46-トキ" = "それでも時間や労力のかかる絵に拘るのは……なぜなのでしょう。"
"1006205-47-トキ" = "まだ私には理解の及ばない理由があるとは思うのですが、よく分かりません。"
"1006205-48-トキ" = "ウィンドウショッピングとは、不思議なものですね……。"
"1006205-49-トキ" = "見るだけのはずが、必要のないものまで購入してしまうなんて。"
"1006205-50-トキ" = "なぜ不必要な衝動買いに走ってしまうのでしょうか？"
"1006205-51-トキ" = "私には、分かりません……。"
"1006205-52" = "[ns] \"楽しくなかった……？\""
"1006205-53" = "（その後も、様々な「趣味」を試してみた）"
"1006205-54" = "（トキが興味を示してくれたものは……ひとつもなかった）"
"1006205-55" = "キヴォトス・市内"
"1006205-56" = "[ns] \"お疲れさま、トキ……。\""
"1006205-57-トキ" = "大丈夫、ですか……？"
"1006205-58-トキ" = "すごくお疲れのような……。"
"1006205-59-トキ" = "……。"
"1006205-60-トキ" = "あの、先生。"
"1006205-61" = "[s] \"うん？\""
"1006205-62-トキ" = "趣味とは何なのでしょうか……。"
"1006205-63-トキ" = "趣味を通じて、何かを得る必要はない、のでしょうか……？"
"1006205-64-トキ" = "そこに意味はなくとも、良いのでしょうか……？"
"1006205-65" = "（不安に揺れる瞳と視線がぶつかった）"
"1006205-66" = "（初めて見るトキの姿に、私は……）"
"1006205-67" = "[s] \"トキ、趣味っていうのはね……。\""
"1006205-68-トキ" = "はい。"
"1006205-69" = "[s7] \"意味なんて、理由なんてなくていいんだよ。\"\n[s8] \"そこに自分の「好き」って気持ちがあれば。\""
"1006205-70-トキ" = "「好き」の気持ち……ですか？"
"1006205-71" = "[s9] \"焦らせちゃってごめんね。\"\n[s10] \"きっと、巡り合せみたいなものだから。\"\n[s11] \"その時になったら気付くと思うよ。\""
"1006205-72-トキ" = "……。"
"1006205-73-トキ" = "でしたら、私の趣味は……。"
"1006205-74-トキ" = "……ふふっ。"
"1006205-75" = "[s] \"ん？もう見つけたの？\""
"1006205-76-トキ" = "何でも……ありませんよ。"
"1006205-77-トキ" = "さあ、先生。"
"1006205-78-トキ" = "そろそろ帰りましょうか。"
"1006205-79-トキ" = "シャーレまで、私が護衛しますね。"
"1006205-80" = "[s] \"そう言われると気になるな～って……。\""
"1006205-81-トキ" = "さて、何のことでしょうか？"
"1006205-82" = "[ns] \"教えてくれないの？\""
"1006205-83-トキ" = "今日のところは……内緒です。"
"1006205-84" = "[ns] \"そっか……でもいつか、聞かせてくれるとうれしいな。\""
"1006205-85" = "（帰り道、トキの微笑みを見て、自分のことのようにうれしくなった）"
