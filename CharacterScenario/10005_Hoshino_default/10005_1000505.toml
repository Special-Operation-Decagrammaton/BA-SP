[translation]
"1000505-1" = "うっすらだけど輝いてる"
"1000505-2-ホシノ" = "光を生み出すだけでもすごいのに、それで自分の身体を保護するなんて、不思議だよね。"
"1000505-3-ホシノ" = "暗い深海で光を作ると捕食者にバレると思うけど、一人ならともかく大勢で集めて群れを作れば逆に威嚇になるみたい。"
"1000505-4-ホシノ" = "うへ～どんな光景なのかな？きっとものすごいんだろうな。"
"1000505-5" = "[s1] \"今日の予定って、魚の話？\"\n[s2] \"今日は何を探すの？\""
"1000505-6-ホシノ" = "うへ～せっかちだなあ、先生は。"
"1000505-7-ホシノ" = "うへ～せっかちだなあ、先生は。"
"1000505-8-ホシノ" = "ようやくトレジャーハンターの魂が目覚めたのかな、いい兆候じゃん。"
"1000505-9-ホシノ" = "アビドスはかなり歴史が古いからあちこちに隠れた空間があって、それを探し出すのは結構楽しいんだよ！"
"1000505-10-ホシノ" = "前回は倉庫だったから、今度は閉鎖された旧校舎に行ってみようか？"
"1000505-11" = "アビドス・第三旧校舎"
"1000505-12-ホシノ" = "ケホケホ、ケホケホ……ここもホコリがすごいな。"
"1000505-13-ホシノ" = "あちこちガラクタだらけ、ほとんど使えそうな物はないと思うけど。"
"1000505-14-ホシノ" = "先生、足を引っかけて転ばないように気を付けて。"
"1000505-15" = "[s3] \"昼に来た方がよくない？\"\n[s4] \"ぞくぞくするね……。\""
"1000505-16-ホシノ" = "うへ、真夜中の宝探しってロマンがあるじゃん。しかも他の人にバレる心配もないし。"
"1000505-17-ホシノ" = "うへ～、先生、まさか怖いの？"
"1000505-18-ホシノ" = "大丈夫、大丈夫。このおじさんの後ろにピタッとくっ付いてきて。"
"1000505-19-ホシノ" = "じゃあもっと進んでみようか。"
"1000505-20-ホシノ" = "良いものを見つけたらすぐに拾わないとダメだよ。宝探しは見つけた人のものってルールなんだから。"
"1000505-21-ホシノ" = "うーん。結構歩き回ったけど特に使えそうなものは見つからないね……。"
"1000505-22-ホシノ" = "やっぱり良さそうなものはとっくに持っていかれちゃったか……。"
"1000505-23" = "（ガラガラ）"
"1000505-24-ホシノ" = "ここは……ずいぶん昔先輩たちが使ってた場所みたいだね。おじさんも来たことないからよく分からないけど。"
"1000505-25" = "（がさっ）"
"1000505-26-ホシノ" = "……うん？"
"1000505-27-ホシノ" = "何か、音が聞こえなかった？"
"1000505-28-ホシノ" = "あっちの方だったけど……。"
"1000505-29-ホシノ" = "う、うああああっ？！"
"1000505-30" = "（がたがたん）"
"1000505-31" = "（チュウ、チュウ）"
"1000505-32-ホシノ" = "……。"
"1000505-33-ホシノ" = "う、うあ……。びっくりしたあ……。"
"1000505-34-ホシノ" = "ネズミかぁ……まったく、人をびっくりさせてー。"
"1000505-35-ホシノ" = "おかげで積んでたガラクタが全部落ちてきちゃったじゃん。"
"1000505-36" = "[s] \"……………。\""
"1000505-37-ホシノ" = "……。"
"1000505-38-ホシノ" = "うへ、せんせ～？何さそのドヤ顔？"
"1000505-39-ホシノ" = "まさか、ホシノでも驚くんだね、なんて言うつもりかー？"
"1000505-40-ホシノ" = "いくら私でもこんな状況ならびっくりするに決まってるでしょ～？"
"1000505-41-ホシノ" = "……まあ先生の珍しい表情も見れたから……あれ？"
"1000505-42-ホシノ" = "これ見て、先生。さっき落ちてきたガラクタの中……何か光ってる。"
"1000505-43" = "[s] うっすら光ってる紙を拾う。"
"1000505-44-ホシノ" = "これ……夜光ステッカー？"
"1000505-45-ホシノ" = "しかも魚の！"
"1000505-46-ホシノ" = "これは熱帯魚で……こっちはサザエ、イカ、マンボウ……うへ、クラゲもある！"
"1000505-47-ホシノ" = "すごいお宝じゃん、先生！"
"1000505-48" = "[s] \"古くてちょっと光が弱いかも……。\""
"1000505-49-ホシノ" = "うへ、それがカッコいいんじゃん、ちょっとうまく説明できないけど……。"
"1000505-50-ホシノ" = "誰も気づいてくれないところで、一人でこうやって輝いてたんだから。"
"1000505-51" = "[s5] \"あげる。\"\n[s6] \"プレゼント。\""
"1000505-52-ホシノ" = "うん？お、わ、私にくれるの？"
"1000505-53-ホシノ" = "うん？お、わ、私にくれるの？"
"1000505-54-ホシノ" = "でも拾ったのは先生なんだから、これは先生のものってルールだし……。"
"1000505-55" = "[s] 渡す。"
"1000505-56-ホシノ" = "あ……う……あ、ありがとう、先生。"
"1000505-57-ホシノ" = "へえ……。"
"1000505-58-ホシノ" = "……可愛い魚たちが大漁だ！"
"1000505-59-ホシノ" = "家の天井に貼っておこ！電気を消して眺めたらすごいかも！"
"1000505-60-ホシノ" = "うへ～、早く帰ろう、先生！"
"1000505-61" = "（楽しそうなホシノと一緒に帰った）"
