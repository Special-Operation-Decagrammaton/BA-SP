[translation]
"1000508-1" = "幸運を掴む方法"
"1000508-2" = "D.U.外郭・ショッピングモール"
"1000508-3" = "（ホシノと一緒にしばらく歩き回った末に、欲しかった本を購入した）"
"1000508-4-ホシノ" = "うへ、おかげさまで助かったよ先生。"
"1000508-5-ホシノ" = "アビドスは田舎だから、こういう新しいのは手に入れるのが難しいんだよね。"
"1000508-6-ホシノ" = "じゃーん、「月刊アクアホビー特別版」！付録に熱帯魚2000種図鑑まで！"
"1000508-7-ホシノ" = "これで千円だなんて、すごくない？付録まで半端ないのにね？"
"1000508-8-ホシノ" = "はあ……早く開けてみたい。どこでもいいからお店に入ろう！"
"1000508-9" = "[s] ついて行く。"
"1000508-10-ホシノ" = "へえ～見てこれ、家でウニを飼育する方法だって。"
"1000508-11-ホシノ" = "海水の水槽って結構難易度が高いって聞いたけどね、ふーん。"
"1000508-12" = "[s] \"ホシノは魚が好きなんだね？\""
"1000508-13-ホシノ" = "うへ～まあ、飼いたいくらい好きだけど……こうやって見るだけでも楽しいから大丈夫。"
"1000508-14-ホシノ" = "……。"
"1000508-15-ホシノ" = "……もしかして、ちょっと子供っぽいかな……？この年でこんな趣味の人、あんまりいないのは知ってるけど……。"
"1000508-16" = "[s1] \"良いと思うよ。\"\n[s2] \"趣味は年齢と関係ないよ。\""
"1000508-17-ホシノ" = "……うへへ。"
"1000508-18-ホシノ" = "……うへへ。"
"1000508-19-ホシノ" = "……あれ？これ見て、先生。後ろにスクラッチの宝くじチケットがついてる。"
"1000508-20-ホシノ" = "「アクアリウム開場記念無料入場券30名抽選チケット」……え、ええっ！？なに、これ？"
"1000508-21-ホシノ" = "アクアリウムって、つまり……。"
"1000508-22" = "[s] \"ものすごく大きい水族館みたいなものかな。\""
"1000508-23-ホシノ" = "ものすごく大きい水族館……？！"
"1000508-24-ホシノ" = "……！！"
"1000508-25-ホシノ" = "そ、それって普通に買ったら1万5千円分のチケットを二枚もくれるってこと？"
"1000508-26-ホシノ" = "このスクラッチ宝くじで当たればいいんだよね？ま、待ってて！"
"1000508-27-ホシノ" = "こ、コインは……。"
"1000508-28-ホシノ" = "せ、先生！祈ってて！"
"1000508-29" = "[s3] \"ファイト！\"\n[s4] \"頑張って！\""
"1000508-30-ホシノ" = "（カサカサ）"
"1000508-31-ホシノ" = "（カサカサ）"
"1000508-32-ホシノ" = "（カサカサカサカサ）"
"1000508-33-ホシノ" = "（カサカサ）……ああ。"
"1000508-34" = "[s5] \"当たった？\"\n[s6] \"どうだった？\""
"1000508-35-ホシノ" = "……外れ。"
"1000508-36-ホシノ" = "……外れ。"
"1000508-37-ホシノ" = "……うへ、やっぱり幸運がそうそう自分からやってくるわけないか。"
"1000508-38-ホシノ" = "……。"
"1000508-39-ホシノ" = "ほら、それじゃあ行こう、先生。"
"1000508-40-ホシノ" = "今日は先生と一緒にいっぱい歩き回って、欲しかった本も買ったから、なかなかいい一日だったよ。"
"1000508-41" = "[s] ホシノを連れて本屋に行く。"
"1000508-42-ホシノ" = "うん？な、なにをしてるの、先生？どこに行くの？"
"1000508-43-ホシノ" = "……。"
"1000508-44" = "（同じ本を50冊も買ってしまった）"
"1000508-45-ホシノ" = "……ねえ、先生……これって、もしかして……。"
"1000508-46" = "[s] \"諦めるには早い！当たるまで削るよ！\""
"1000508-47-ホシノ" = "……。"
"1000508-48-ホシノ" = "うへ～、まあいいや、ツッコむのは私の役割じゃないし、大人の遊びに付き合ってみようかな～。"
"1000508-49-ホシノ" = "よし！30回以内に当てようか！！"
"1000508-50-ホシノ" = "てやあああっー！！"
"1000508-51" = "（幸いにも38回目で当たって、ホシノにチケットをプレゼントすることができた）"
"1000508-52" = "（残った50冊の本をどうやって処理するか悩んだ結果、シャーレの図書館に保管することにした）"
