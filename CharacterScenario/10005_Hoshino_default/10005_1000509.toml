[translation]
"1000509-1" = "アクアリウム！"
"1000509-2" = "アクアリウム・入口"
"1000509-3-ホシノ" = "うへー、ここがアクアリウムかあ。"
"1000509-4-ホシノ" = "おじさんは田舎者だから、こういうところは見慣れないなあ。"
"1000509-5-ホシノ" = "これ見て、パンフレットももらったよ。"
"1000509-6-ホシノ" = "熱帯魚館に深海魚館、エサやりの体験館もあるみたい！"
"1000509-7-ホシノ" = "へえ、イルカショーもあるし……ペンギン館もある。ここはきっと寒いんだよね？"
"1000509-8-ホシノ" = "これ見て、先生！海のトンネルだって！"
"1000509-9-ホシノ" = "ジンベイザメもいるんだって！鯨みたいなものかな……?"
"1000509-10-ホシノ" = "今日一日で全部見れるのかな……うーん、頑張らないと。"
"1000509-11-ホシノ" = "さて、どこから行ってみる？"
"1000509-12" = "（熱帯魚館、深海魚館を通って海のトンネルに到着した）"
"1000509-13" = "― あれが鯨ってやつなの？"
"1000509-14" = "― へえ～[wa:2300]すごい。[wa:1500]こんなところ初めて。"
"1000509-15" = "― あれ見て！[wa:1000]お魚だ！[wa:1200]あははは、[wa:500]カワイイ！"
"1000509-16" = "― ……。"
"1000509-17" = "― 私一人[wa:2000]こんなに楽しんでていいのかな……。"
"1000509-18" = "― 余計な心配だって？[wa:5000]……そうかな？"
"1000509-19" = "（その後エサやり体験館、クラゲ館、ウミガメ館、グッズショップまで、アクアリウムのあっちこっちを歩き回りたくさん遊んだ）"
"1000509-20-ホシノ" = "……楽しかった。"
"1000509-21-ホシノ" = "アンコウのエサやり体験、めちゃくちゃ面白かったね。すっごい大きい口だった。"
"1000509-22-ホシノ" = "夜光クラゲも、光でちょっとめまいがしたけどカッコよかったし。"
"1000509-23-ホシノ" = "海のトンネルも大きくてすごかった……ふう。"
"1000509-24-ホシノ" = "記念品もこんなにたくさん買っちゃったし、うへへへ。"
"1000509-25-ホシノ" = "ヘトヘトになるまで遊んだから、もう家に帰ったらそのまま倒れて24時間は寝れちゃいそう。"
"1000509-26" = "[s1] \"寝坊はダメだよ。\"\n[s2] \"学校は行かないとね。\""
"1000509-27-ホシノ" = "うへへ。それはなんとか頑張ってみるよ、先生！"
"1000509-28-ホシノ" = "うへへ。それはなんとか頑張ってみるよ、先生！"
"1000509-29-ホシノ" = "さて、じゃあそろそろ帰る？一日歩き回ったのにまだ見てないところがあるなんて、なんだか残念だけど。"
"1000509-30-ホシノ" = "まあ、頑張ってまた次も来たらいいし。ね？"
"1000509-31" = "[s3] \"そうだね。\"\n[s4] \"また来よう。\""
"1000509-32-ホシノ" = "うへ。次はおじさんが招待するから、期待しててもいいよ、先生！"
"1000509-33" = "（少し疲れたけど、楽しそうなホシノと一緒に帰った）"
