[translation]
"1000506-1" = "真夜中のパトロール"
"1000506-2" = "アビドス・市内外郭"
"1000506-3" = "（夜の道で偶然ホシノに会った）"
"1000506-4-ホシノ" = "うへ？先生？"
"1000506-5-ホシノ" = "どうしたの？こんな時間に？"
"1000506-6" = "[s1] \"散歩中。\"\n[s2] \"パトロール中。\""
"1000506-7-ホシノ" = "うへ、アビドスの夜は怖いよ、先生。一人でこんなところを歩き回ってて大丈夫？"
"1000506-8-ホシノ" = "うへ、アビドスの夜は怖いよ、先生。一人でこんなところを歩き回ってて大丈夫？"
"1000506-9-ホシノ" = "他の学校に比べてかなり無法地帯なんだよ？もし不良とかに会ったら……。"
"1000506-10-ホシノ" = "私？私は……その……パトロールっていうか、散歩というか……。"
"1000506-11-市民" = "あ、ここにいましたか！"
"1000506-12-ホシノ" = "え、えっと、ええ？"
"1000506-13-市民" = "先ほど不良から助けてくれた方……！お礼を申し上げようと思ったのに急にいなくなったもので……。"
"1000506-14-市民" = "ありがとうございます、もしあなたじゃなかったら今月の家賃を全部盗られるところでした……。"
"1000506-15-ホシノ" = "い、いや……わ、私はただ……。"
"1000506-16-市民" = "あ、アビドスの生徒さんなんですね。毎晩パトロールをされてると噂は聞いてましたが、こうやって実際に会うことになるとは。"
"1000506-17-市民" = "ありがとうございました！"
"1000506-18-ホシノ" = "……。"
"1000506-19-ホシノ" = "はあ……。"
"1000506-20" = "[s] \"真夜中にパトロールしてたの？\""
"1000506-21-ホシノ" = "いや、これはただの偶然の出来事っていうか……うーん……。"
"1000506-22-ホシノ" = "……何か、言い訳をすればするほど泥沼にはまっていく感じだね。"
"1000506-23-ホシノ" = "結構恥ずかしいから知らないふりをしてくれると助かるな～。"
"1000506-24" = "[s] \"ホシノは素直じゃないんだね？\""
"1000506-25-ホシノ" = "うあー！おじさんをからかうのは楽しいか！？"
"1000506-26-ホシノ" = "……すごく楽しそうな表情じゃん！？"
"1000506-27" = "[s] \"寝る時間まで削って、あんまり無理しないでね。\""
"1000506-28-ホシノ" = "……えへへ。"
"1000506-29-ホシノ" = "寝るのはもともと好きだし、盛大に寝てるよ。別に無理をしてるわけでもないし。"
"1000506-30-ホシノ" = "……心配してくれてるの？このおじさんを心配してくれるのはやっぱり先生ぐらいだなー？"
"1000506-31-ホシノ" = "うへへ。"
"1000506-32" = "（ホシノが腕を組んでしがみついてきた）"
"1000506-33-ホシノ" = "あっ、急に持病の貧血が……！"
"1000506-34-ホシノ" = "めまいがするから家まで送ってほしいな、先生。"
"1000506-35-ホシノ" = "ほら、早く行こう。さあ。か弱い生徒からのお願いだから。"
"1000506-36" = "（通りがかった人がいてすぐに腕が外れたけれど、ホシノと仲良く家に帰った）"
