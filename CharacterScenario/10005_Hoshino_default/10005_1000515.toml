[translation]
"1000515-1" = "どこでも入場券"
"1000515-2" = "（ホシノに連絡をもらい、対策委員会の部室に向かった）"
"1000515-3-？？？" = "ん？#nこの音は……。"
"1000515-4-？？？" = "やっぱり、先生だよね。"
"1000515-5-ホシノ" = "うへへ、やっぱり当たってた。"
"1000515-6-ホシノ" = "ありがとね、先生。#n急だったのに来てもらってさ。"
"1000515-7-ホシノ" = "……ほかのみんな？"
"1000515-8-ホシノ" = "うちの可愛い後輩たちは、みんな予定があるんだって。#nだから、こうして先生を呼んだわけで……。"
"1000515-9-ホシノ" = "単純に先生と遊ぶために呼ぶんだったら、#n私も気にしないんだけど……"
"1000515-10-ホシノ" = "みんな、頼み事がある時に限って呼ぶことが多くない？"
"1000515-11-ホシノ" = "……いつまでも先生に頼りっぱなしってのも、困るでしょ？"
"1000515-12-ホシノ" = "仕事がある時だけ呼び出すのも、それこそ申し訳ないしさ。#nいくら大人とはいえ、ね。"
"1000515-13" = "[s1] \"私は全然大丈夫だよ？\"\n[s2] \"むしろ、大歓迎だよ。\""
"1000515-14-ホシノ" = "うへへ。#n先生なら、そう言ってくれると思ってたけどさ。"
"1000515-15-ホシノ" = "でも、自立は大事だし。"
"1000515-16-ホシノ" = "……いや。"
"1000515-17-ホシノ" = "むしろ、おじさんこそ先生に頼りっぱなしだよね。"
"1000515-18-ホシノ" = "分かってるってば、先生。"
"1000515-19-ホシノ" = "そういう目で見られると、#nアヤネちゃんに怒られてる時と同じくらい困っちゃうなぁ。"
"1000515-20-ホシノ" = "ま、そろそろ本題に入ろっか。"
"1000515-21-ホシノ" = "一人で過ごしてたら、先生のことを思い出してさ。"
"1000515-22" = "[s3] \"……私のことを？\"\n[s4] \"何かあったの……？\""
"1000515-23-ホシノ" = "特に何かがあったわけじゃないけど……。"
"1000515-24-ホシノ" = "先生。"
"1000515-25-ホシノ" = "これ、見てくれる？"
"1000515-26" = "[ns5] \"ホシノの枕？\"\n[ns6] \"いきなり、どうしてこれを……？\""
"1000515-27-ホシノ" = "先生は知らないかもしれないけど、#n実はただの枕じゃないんだよねぇ。"
"1000515-28-ホシノ" = "これは神秘的な力を持った「どこでも入場券」だよ～。"
"1000515-29-ホシノ" = "ふふっ、何を言ってるのかよく分かってないでしょ？"
"1000515-30-ホシノ" = "ま、説明するより、やってみたほうが早いかな。"
"1000515-31-ホシノ" = "そうそう、楽な姿勢で……。"
"1000515-32-ホシノ" = "抱きかかえるようにして……。"
"1000515-33-ホシノ" = "うん、良い感じ。"
"1000515-34-ホシノ" = "それじゃ、そのまま目を閉じて……。"
"1000515-35-ホシノ" = "これは、どんな場所でも安らかに眠れる夢のチケットなんだ。"
"1000515-36" = "（ホシノの言う通り、すぐ眠気に襲われた）"
"1000515-37" = "（寝ている間、ホシノの声が聞こえたような気がする）"
"1000515-38-ホシノ" = "……先生。"
"1000515-39-ホシノ" = "たまには先生も全部忘れて、#nお昼寝でもしてみたらどうかなって思ったんだよね。"
"1000515-40-ホシノ" = "先生は、いつも頑張ってばかりだから……。"
"1000515-41-ホシノ" = "これを貸してあげようと思ってさ。#n本当は、おじさんだけの宝物なんだけどね。"
"1000515-42-ホシノ" = "……先生。"
"1000515-43-ホシノ" = "もう、寝てるよね……？"
"1000515-44-ホシノ" = "いつの間にかさ……。"
"1000515-45-ホシノ" = "私にとって、先生は……。"
"1000515-46" = "（目を覚ました頃には、）"
"1000515-47" = "（すっかり日が暮れていた）"
"1000515-48" = "[ns7] \"気づいたら、夜に……。\"\n[ns8] \"こんなに眠ってたんだ……。\""
"1000515-49-ホシノ" = "……あれ、起きたの？"
"1000515-50-ホシノ" = "あまりにも気持ち良さそうだったから、#nおじさんも隣で寝ちゃってたよ。"
"1000515-51-ホシノ" = "……ん～？"
"1000515-52-ホシノ" = "もちろん、その枕はおじさんにとって特別なアイテムだけど、#nなくっても寝られるよ。"
"1000515-53-ホシノ" = "今日は「お昼寝初心者」の先生に、貸してあげたけどね。"
"1000515-54-ホシノ" = "もう良い時間だし……。"
"1000515-55-ホシノ" = "そろそろ帰ったほうが良いんじゃない？#n明日も仕事でしょ、先生。"
"1000515-56-ホシノ" = "近くまで送るよ。#nおじさんがここまで呼び出したんだし、せめてそれくらいはね。"
"1000515-57-ホシノ" = "ま、パトロールのついでにさ。"
"1000515-58-ホシノ" = "本当に、ついでだから気にしなくて大丈夫だよ。"
"1000515-59-ホシノ" = "……ん？"
"1000515-60-ホシノ" = "……この枕、気に入ってくれたの？"
"1000515-61-ホシノ" = "どこで手に入れられるのか、って……？"
"1000515-62-ホシノ" = "……うへ～。"
"1000515-63-ホシノ" = "それは内緒だよ。#n教えちゃったら、来てくれなくなるでしょ？"
"1000515-64-ホシノ" = "と言っても、これはずっと前にアビドスで買った物だから、#nもう手に入らないんだ。"
"1000515-65-ホシノ" = "つまり、おじさんだけの宝物ってこと。"
"1000515-66-ホシノ" = "……だから先生。"
"1000515-67-ホシノ" = "もし、またお昼寝がしたくなったら、おじさんを呼んでね。"
"1000515-68-ホシノ" = "……分かった？"
"1000515-69" = "（その後、ホシノにシャーレまで送ってもらった）"
"1000515-70" = "（後日、休憩室でお昼寝をしてみたが、あの日ほど気持ちよく眠れなかった）"
