[translation]
"2300105-1" = "もう一度買い出しに行きましょう！"
"2300105-2-フウカ" = "あの時はご迷惑をおかけしてしまって、すみませんでした……。"
"2300105-3" = "[s] \"大丈夫、私のためだったんでしょ？\""
"2300105-4-フウカ" = "ふふふ……先生はいつもそうやって、仰ってくださるんですね。"
"2300105-5-フウカ" = "あ、えっと、今はそうじゃなくて……前回の失敗を元に、今日は特別なおもてなしをしたいと思います。"
"2300105-6-フウカ" = "先生、今日も一緒に買い出しに行っていただけますか？"
"2300105-7" = "市場3番街"
"2300105-8" = "[ns] \"今日は何を買うの？\""
"2300105-9-フウカ" = "あの時以来、私、ずっと考えていたのですが、やっと気が付きました。"
"2300105-10-フウカ" = "単に料理をたくさん作ることだけが、正解ではないということに。"
"2300105-11-フウカ" = "先生のためには、もっと特別な料理を作った方がいいんじゃないかな、って。"
"2300105-12-フウカ" = "今日はそのための特別な食材を買うつもりなんです。"
"2300105-13" = "[s] \"特別な食材？\""
"2300105-14-フウカ" = "ふふふ、どんなものかはお楽しみです。"
"2300105-15" = "[ns] \"ここは、魚屋？\""
"2300105-16-魚屋のおやじ" = "いらっしゃい！今日も新鮮な商品がたくさん入荷してるよ！ぜひ見てって！"
"2300105-17-フウカ" = "わあ、サバも新鮮ですし、アジも今が旬ですもんね！"
"2300105-18-フウカ" = "先生！先生！このウニ、見てください！"
"2300105-19-フウカ" = "こんなに新鮮でしたら、このまますぐご飯に乗せて食べても良さそうです！"
"2300105-20" = "[s] \"フウカ、落ち着いて。\""
"2300105-21-フウカ" = "あっ、す、すみません。"
"2300105-22-フウカ" = "こういう新鮮な食材を見てしまうとつい……。"
"2300105-23-フウカ" = "こんな食材たちが、後々どんな料理になるのか、想像するだけで胸がときめいて……。"
"2300105-24-フウカ" = "あはは……やっぱり、ちょっと変ですかね？"
"2300105-25" = "[s] \"ううん、フウカらしいよ。\""
"2300105-26-フウカ" = "えへへ……。"
"2300105-27-フウカ" = "あっ、このホッケも、焼いたら美味しそうですね。"
"2300105-28-魚屋のおやじ" = "おっ、そこのお嬢ちゃんお目が高い！"
"2300105-29-魚屋のおやじ" = "がっはっはっ！新妻で、そんなに見る目もあって、となると料理の実力も相当ありそうだな！そうだろう？"
"2300105-30-フウカ" = "はぃっ！？に、新妻ですか！？"
"2300105-31" = "[s1] \"新妻じゃなくて、私の生徒です。\"\n[s2] \"はい、フウカは世界最強の新妻です。\""
"2300105-32-魚屋のおやじ" = "わっはっはっ！細かいことは気にするなよ！"
"2300105-33-魚屋のおやじ" = "とにかく、気にかけてくれる人がいるのは良いことに違いねぇだろ？"
"2300105-34-フウカ" = "じょ、冗談はよしてください！先生！"
"2300105-35-魚屋のおやじ" = "それで、お嬢ちゃんは今日何を買いに来たんだい？"
"2300105-36-フウカ" = "あ、ウナギってありますか？"
"2300105-37-魚屋のおやじ" = "ウナギかい？もちろん！"
"2300105-38-魚屋のおやじ" = "キヴォトス最高のウナギを扱ってる店といやぁ、うちの店よ！"
"2300105-39" = "[s] \"急にウナギ……？\""
"2300105-40-フウカ" = "ウナギ料理って、よくスタミナ料理っていうじゃないですか。"
"2300105-41-フウカ" = "先生は夜のお仕事で、毎晩徹夜でお疲れのようですので。"
"2300105-42-フウカ" = "そんな先生のために、ウナギ料理を振舞おうかと！"
"2300105-43-フウカ" = "それが今の私にできる、最善のことかなと思いまして。"
"2300105-44-魚屋のおやじ" = "そんなに尽くしてくれる人がいるたぁ、羨ましいねぇ！"
"2300105-45-魚屋のおやじ" = "やれやれ、しょうがねえ！今日はうちの店で一番最高のウナギを出してやるよ！"
"2300105-46-フウカ" = "ありがとうございます！"
"2300105-47-フウカ" = "あ、もちろんいくら最高級のウナギだと言っても、あくまで適正価格で購入させていただきますよ？"
"2300105-48-魚屋のおやじ" = "こいつぁ敵わねぇな！"
"2300105-49" = "[s] \"待って、フウカ。その、スタミナ料理っていうのは……。\""
"2300105-50-フウカ" = "わあっ、このウナギならきっと素晴らしい料理になりそうです！"
"2300105-51-フウカ" = "ふふ、どうやって料理するのがいいですかね？"
"2300105-52-フウカ" = "やっぱり正統派のひつまぶし？ただ塩で焼くだけでも美味しそうです！"
"2300105-53-魚屋のおやじ" = "お嬢ちゃんがこんなに積極的だとはな、そんなんじゃ夜は休めないんじゃないのかい！がっはっはっ！"
"2300105-54-フウカ" = "それはダメです、休む時はちゃんと休まないと！"
"2300105-55-フウカ" = "一に健康、二にも健康。先生、分かりましたか？"
"2300105-56-魚屋のおやじ" = "ほお！そんなところまで気にしてくれるなんて、熱々の愛だなぁ！"
"2300105-57-フウカ" = "あ、愛だなんて。そ、そんな……。"
"2300105-58" = "（どうしても二人の会話に突っ込めないまま、たくさんのウナギを買って帰った）"
