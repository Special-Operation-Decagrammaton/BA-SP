[translation]
"2300103-1" = "フウカさんの今日の食卓"
"2300103-2-フウカ" = "来てくださったんですね、先生。"
"2300103-3" = "[s] \"メールをもらったから来たんだけど、えっと……。\""
"2300103-4-フウカ" = "その……最近、噂を耳にしました。"
"2300103-5-フウカ" = "先生がシャーレのお仕事で昼夜を問わず、すごくお忙しいというお話を。"
"2300103-6-フウカ" = "そのせいで、食事もちゃんと取れてないとか。"
"2300103-7-フウカ" = "それはいけません！"
"2300103-8-フウカ" = "先生は大人ですよね？"
"2300103-9-フウカ" = "大人でしたらもっと、きちんと健康に気を付けないと！"
"2300103-10" = "[s] \"それは、大人の事情があって……。\""
"2300103-11-フウカ" = "もうっ、言い訳はダメです！"
"2300103-12-フウカ" = "これは緊急事態ですよ。給食部の部長が出ないといけない緊急事態……！"
"2300103-13-フウカ" = "実は、昨日買い出しに行ったのは今日のためでした。"
"2300103-14" = "[s] \"学食の仕入れのためじゃなかったの？\""
"2300103-15-フウカ" = "それはついでに、ということです。もちろん、学食も大事ですが。"
"2300103-16-フウカ" = "先生の食事改善は、給食部にとっては最優先事項ですので！"
"2300103-17-フウカ" = "人のエネルギーというのは基本的に食事から生み出されるものです。まずはきちんと食べてこそ、健康に支障をきたさないようになるものなんです！"
"2300103-18-フウカ" = "ですので、本日お出しする料理は、"
"2300103-19-フウカ" = "ゲヘナ給食部式、会席料理18選！"
"2300103-20-フウカ" = "それでは、覚悟してくださいね。先生！"
"2300103-21-フウカ" = "まずは前菜です。"
"2300103-22-フウカ" = "白みそに、小豆と豆腐を和えて作りました。"
"2300103-23" = "[s1] \"うん、このお豆腐、美味しい……！\"\n[s2] \"白みその風味と、小豆のアンサンブルが素晴らしい！\""
"2300103-24-フウカ" = "ふふっ、うふふ！……それでは次の料理は、"
"2300103-25-フウカ" = "ふふっ、うふふ！……それでは次の料理は、"
"2300103-26-フウカ" = "こちらはハマグリで出汁を取ったワンタンスープです。"
"2300103-27-フウカ" = "温かいうちに、ぐいっと飲んでしまってください！"
"2300103-28" = "[s3] \"うん、スープも美味しい……！\"\n[s4] \"ハマグリとエビが香って、海鮮の風味がすごい！\""
"2300103-29-フウカ" = "驚くのはまだ早いですよ。次の料理は……。"
"2300103-30-フウカ" = "驚くのはまだ早いですよ。次の料理は……。"
"2300103-31-フウカ" = "こちらを！"
"2300103-32-フウカ" = "次はこの料理を！"
"2300103-33-フウカ" = "さあ、その次はこれを召し上がってみてください、先生！"
"2300103-34" = "（そうやってフウカが出してくれた18種の料理を全部食べた）"
"2300103-35-フウカ" = "先生？なんだか顔色が良くないような……。"
"2300103-36" = "[s] \"うっ、お、お腹が……。\""
"2300103-37-フウカ" = "え？お腹？"
"2300103-38-フウカ" = "お腹がどうされましたか？"
"2300103-39-フウカ" = "せ、先生！？"
"2300103-40" = "（その後、ゲヘナの保健室で大量の胃薬を処方してもらった）"
