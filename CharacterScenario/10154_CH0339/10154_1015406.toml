[translation]
"1015406-1" = "受け継がれる意志"
"1015406-2" = "（マナミから送られてきた場所に向かった）"
"1015406-4" = "D.U.のとあるマンションの廊下"
"1015406-5-マナミ" = "先生、お待ちしておりました。"
"1015406-6" = "[s] \"ここに犯人が……？\""
"1015406-7-マナミ" = "その可能性が高いです。"
"1015406-8-マナミ" = "現在、ほかの評議会メンバーも、犯人の隠れ家と思しき場所で待機しています。"
"1015406-9-マナミ" = "あとは先生の許可をいただくのみです。"
"1015406-10" = "[s1] \"そっか。だから私を呼んだんだね。\"\n[s2] \"自治区の外で正式に武力行使するには――\""
"1015406-15" = "[ns] \"シャーレ監督のもと、作戦を許可する！\""
"1015406-16-マナミ" = "その言葉をお待ちしておりました。"
"1015406-17-マナミ" = "今こそ、過去10年間の雪辱を果たす時。"
"1015406-18-マナミ" = "さあ、作戦開始です！"
"1015406-21-寮監隊員A" = "出入口の強制開放実施！"
"1015406-22-寮監隊員B" = "実施！！"
"1015406-27-容疑者" = "けほっ、げほっ！ごほっ、ごほっ……！"
"1015406-28-マナミ" = "やはりここに隠れていましたか。"
"1015406-29-マナミ" = "あの者を、私の前まで引きずり出してください。"
"1015406-30-容疑者" = "な、なんだよ！？説明しろよ……！！"
"1015406-34-寮監隊員A" = "あなたには黙秘権があり、あなたの供述は、#n法廷であなたに不利な証拠として用いられる場合があります！"
"1015406-35-寮監隊員A" = "以下略！"
"1015406-39-容疑者" = "お、おい！離せよ！"
"1015406-44" = "[ns] \"10年前の犯人なんですか……？\""
"1015406-45-容疑者" = "な……何を言う！"
"1015406-46-容疑者" = "俺はD.U.で個人事業をしている善良な市民だ！"
"1015406-47-マナミ" = "そうでしたか。では説明をお願いできますか？"
"1015406-48-マナミ" = "10年前。現場に残されていた毛……それがどうして、善良な市民であるはずの――あなたの毛と一致するのでしょうね？"
"1015406-49-容疑者" = "な、何だと……？"
"1015406-51-マナミ" = "あなたは現場の証拠隠滅は完ぺきだった、とお考えでしょう。"
"1015406-52-マナミ" = "実際、当時の捜査ではこれといった証拠が見つかりませんでした。"
"1015406-54-マナミ" = "ですが、技術の進歩には目を見張るものがありまして。"
"1015406-55-マナミ" = "その結果、10年が経った今になり、ようやく見つけたのです。"
"1015406-56-マナミ" = "犯人の手掛かりを……たった1本の毛から。"
"1015406-57-容疑者" = "……！！"
"1015406-58-マナミ" = "他はきれいさっぱり拭い取られていましたが、壊れた額縁の隙間に挟まっていた毛……#n現場に残されていた唯一にして最大の手掛かり。"
"1015406-59-マナミ" = "あなたは逃げるのに必死で、そこまで気を遣えなかったのかもしれませんね。"
"1015406-60-容疑者" = "そ、それは……！"
"1015406-61-マナミ" = "見苦しい言い逃れもここまでです。"
"1015406-62-マナミ" = "連れて行きなさい。"
"1015406-67-容疑者" = "くそっ！こんな目に遭うなんて……！！"
"1015406-68" = "[ns] \"これで一件落着かな？\""
"1015406-69-マナミ" = "いいえ、まだ終わっていません。"
"1015406-70-マナミ" = "他のメンバーは捜査を進めてください。"
"1015406-71-マナミ" = "学院の名画を取り戻すのです。"
"1015406-76" = "（その後、捜査は遅くまで行われた）"
"1015406-84" = "（みんなの努力の末、ついに消えた作品を見つけ出した）"
"1015406-85" = "（しかし保存状態が悪く……損傷が激しかった）"
"1015406-86" = "（ひとまずみんなとワイルドハントに戻った）"
"1015406-88-マナミ" = "ずいぶん遅くなってしまいましたね。#n事後処理は私だけでもできますので、先生はお帰りください。"
"1015406-89" = "[s] \"乗りかかった舟だし、最後まで力になりたいな。\""
"1015406-90-マナミ" = "……。"
"1015406-91-マナミ" = "これは……独り言なのですが……。"
"1015406-94-マナミ" = "犯人は10年もの間、盗んだ作品を手元に置いていました。"
"1015406-95-マナミ" = "処分しようと思っていたそうですが、学院の監視が厳しく、それは叶いませんでした。"
"1015406-96-マナミ" = "そのため、せめてもの意趣返しとして、作品をぞんざいに管理していたのだとか。"
"1015406-97-マナミ" = "[ruby=・]お[/ruby][ruby=・]か[/ruby][ruby=・]げ[/ruby][ruby=・]で[/ruby]――学院の名画が激しく損傷してしまいました。"
"1015406-98-マナミ" = "これを「見つけた」と言うのは恥じるほどに。"
"1015406-99-マナミ" = "ですが諦めはしません。"
"1015406-100-マナミ" = "明日になったら、学院の実力者を集めて復元作業にとりかかります。"
"1015406-101-マナミ" = "先代の努力によって証拠が保存され、代々受け継がれてきた意志が、#n作品の密売を防いだのです。"
"1015406-102-マナミ" = "そして、作品を取り戻すという執念が、犯人の検挙につながりました。"
"1015406-103-マナミ" = "受け継がれてきたその心を……私は決して無意味なものにはしません。"
"1015406-104" = "[s3] \"世代を超えた思い……。\"\n[s4] \"これもマナミが大切にしたい感覚の芸術なんだね。\""
"1015406-111-マナミ" = "その通りです。"
"1015406-112-マナミ" = "私について、すっかり理解が深まったご様子で。"
"1015406-115" = "[wa:1120]― [log=마나미]我がワイルドハント芸術学院は、[/log]"
"1015406-117" = "― [log=마나미]歴史のある学園です。[/log]"
"1015406-120" = "― [log=마나미]歴代の優秀な評議会長の偉業は、[/log]"
"1015406-122" = "― [log=마나미]今もなお[wa:1520]語り継がれています。[/log]"
"1015406-125" = "[wa:2250]― [log=마나미]ですが、[wa:1880]私はそこに[wa:2060]名を連ねることはないでしょう。[/log]"
"1015406-127" = "― [log=마나미]事情があるとはいえ、[wa:2340]専攻の活動もできておらず――[/log]"
"1015406-130" = "― [log=마나미]学院の運営も、[wa:1920]独裁的だと評されています。[/log]"
"1015406-133" = "[wa:930]― [log=마나미]それを不当だとは[wa:960]思っていません。[/log]"
"1015406-135" = "― [log=마나미]芸術とは、[wa:2060]時を超えるもの。[/log]"
"1015406-138" = "― [log=마나미]私が守り抜いた芸術は、[/log]"
"1015406-140" = "― [log=마나미]後世へと[wa:1920]受け継がれていくことでしょう。[/log]"
"1015406-143" = "[wa:1260]― [log=마나미]この学院と、[wa:2210]学院の芸術を守ること――[/log]"
"1015406-145" = "― [log=마나미]それこそが、[wa:1870]私が評議会長を[wa:1250]続けている理由です。[/log]"
"1015406-148" = "― [log=마나미]ですから、[wa:1320]先生――[wa:2470]これからも……。[/log]"
"1015406-150" = "― [log=마나미]こんな私を、[wa:2280]見守っていてくれますよね？[/log]"
"1015406-153-マナミ" = "ふふっ、独り言が長くなりましたね。仕事に戻るとしましょう。"
"1015406-154-マナミ" = "今回の事件は解決しましたが、行方の知れない作品はまだ多くあります。"
"1015406-155-マナミ" = "これを皮切りに、他の作品も見つかればと願うばかりです。"
"1015406-156" = "[s] \"他にはどんな作品が盗まれたの？\""
"1015406-157-マナミ" = "今回のような学院の名画とまではいかないものの、価値ある品がなくなっています。"
"1015406-158-マナミ" = "犯人を捕まえて事件解決といきたいところですが――#n用意周到な[ruby=・]泥[/ruby][ruby=・]棒[/ruby][ruby=・]猫[/ruby]は、それをあざ笑うように逃げてしまいました。"
"1015406-159-マナミ" = "ふふっ、ですが必ずや。"
"1015406-160-マナミ" = "必ずや捕まえて、一生おやつを[ruby=・]フ[/ruby][ruby=・]リ[/ruby][ruby=・]ー[/ruby][ruby=・]ズ[/ruby][ruby=・]ド[/ruby][ruby=・]ラ[/ruby][ruby=・]イ[/ruby][ruby=・]の[/ruby][ruby=・]さ[/ruby][ruby=・]さ[/ruby][ruby=・]み[/ruby]の刑に処します。"
"1015406-161" = "[s] \"応援してるね……！\""
"1015406-163" = "（その後マナミを手伝いながら事件の片づけを続けた）"
"1015406-164" = "（いつか、みんながマナミの気持ちを理解できる日を願いながら）"
