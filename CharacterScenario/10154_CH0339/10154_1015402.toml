[translation]
"1015402-1" = "感覚の芸術"
"1015402-2" = "（遅れないように、30分ほど早く到着した）"
"1015402-5-マナミ" = "こんにちは、先生。#nまだ約束の時間ではありませんが？"
"1015402-6" = "[s] \"それを言うなら、マナミだって。\""
"1015402-7-マナミ" = "先生をお待ちしながら、ここで思索の時間を持とうかと思っておりました。"
"1015402-8-マナミ" = "ワイルドハントとシャーレの公式な交流会ともなれば、留意すべきことも数多く。"
"1015402-9-マナミ" = "どのようなテーマで優位に立とうか？#nどのような話術で先生を圧倒しようか？"
"1015402-10-マナミ" = "……などとは、[ruby=・]微[/ruby][ruby=・]塵[/ruby][ruby=・]も[/ruby]考えていませんよ。"
"1015402-11" = "[s] \"そっか……お手柔らかにね。\""
"1015402-12-マナミ" = "約束よりも早くいらしたということは、先生も重要視されていることの証左。"
"1015402-13-マナミ" = "ふふっ、いいスタートが切れそうです。"
"1015402-14-マナミ" = "それでは早速向かいましょう。"
"1015402-15-マナミ" = "本日の戦場へ。"
"1015402-17" = "（その後、マナミと一緒に「戦場」へ向かった）"
"1015402-19" = "ワイルドハント美術館"
"1015402-20" = "[ns] \"ここは……。\""
"1015402-21-マナミ" = "ワイルドハント美術館――学院の様々な作品が展示されています。"
"1015402-22-マナミ" = "最もワイルドハントを象徴している場所と言っても過言ではありません。"
"1015402-23-マナミ" = "交流会の場として、学院を代表する場所こそが望ましいと思いまして。"
"1015402-24-マナミ" = "作品を鑑賞しながら、あふれる感想を共有できれば、と。"
"1015402-25" = "[s] \"いいね。そうしよっか。\""
"1015402-26-マナミ" = "ふふっ、ありがとうございます。"
"1015402-27-マナミ" = "それでは鑑賞にあたって、簡単な質問を1つ。"
"1015402-28-マナミ" = "先生はどういった基準で、芸術の価値を判断しますか？"
"1015402-29" = "[s] \"簡単な質問かなぁ？\""
"1015402-30-マナミ" = "難しく考える必要はありません。#nもとより答えの無い問いですから。"
"1015402-31-マナミ" = "例を挙げるならば――"
"1015402-32-マナミ" = "作品の持つ本質的な美しさや、そこに込められた芸術家の意図と美徳。#nあるいは、作品の希少性や歴史的位置づけ。"
"1015402-33-マナミ" = "いずれももっともらしく、実に多様です。#n先生はどれがお好みで？"
"1015402-34" = "[s1] \"全部立派な基準だと思うけど……。\"\n[s2] \"総合的に見ないといけないんじゃないかな？\""
"1015402-37-マナミ" = "……そうですか。"
"1015402-38-マナミ" = "予想通りの答えでしたので、高得点はあげられませんね。"
"1015402-39-マナミ" = "友好的な協力関係のために、点数は秘密にしておきましょう。"
"1015402-40" = "[s] \"くっ！\""
"1015402-41-マナミ" = "愉快な反応をされますね。#n冗談ですから、あまりお気になさらず。"
"1015402-42-マナミ" = "実際のところ、先生の回答はそれなりの支持を得ている基準ですので。"
"1015402-43" = "[s] \"マナミの基準は？\""
"1015402-44-マナミ" = "おや、今度は私が先生に試される番ですか。"
"1015402-45-マナミ" = "先生のお眼鏡にかなうと良いのですが……。"
"1015402-46-マナミ" = "私は明確な基準を持っています。"
"1015402-49-マナミ" = "己の[ruby=・]審[/ruby][ruby=・]美[/ruby][ruby=・]眼[/ruby]です。"
"1015402-50" = "[s] \"……えっと？\""
"1015402-51-マナミ" = "私は、あらゆる芸術の価値を見抜く審美眼を持っています。"
"1015402-52-マナミ" = "先にお伝えしておきますが、これは事実です。"
"1015402-53-マナミ" = "私を評議会長たらしめている能力ですから。"
"1015402-54" = "[s] \"芸術の価値を見抜けるなんて……すごいね。\""
"1015402-55-マナミ" = "ですが、全員が私の判断に賛同するわけではありません。#n先ほど言った通り、芸術には様々な基準がありますから。"
"1015402-56-マナミ" = "とはいえ、すべてを野放図に「芸術」としていては収拾がつきません。#nゆえにワイルドハントとしての規則と統制が必要になります。"
"1015402-57-マナミ" = "……先生。いま、校則のことを思い浮かべましたか？"
"1015402-58" = "[s] \"んっ！？いや～……どうかな？\""
"1015402-59-マナミ" = "ふふっ、ご安心を。私は、[ruby=・]基[/ruby][ruby=・]本[/ruby][ruby=・]的[/ruby][ruby=・]に[/ruby][ruby=・]は[/ruby]寛大ですから。"
"1015402-60-マナミ" = "芸術を[ruby=カネ]資産[/ruby]としか見ない拝金主義だけは許すことはできませんが。"
"1015402-61-マナミ" = "資産性も、芸術を評する基準の1つだろうことは理解しています。#nですがこの世には、値がつけられない作品も多いのです。"
"1015402-62" = "[s] \"「創世の影像」とか？\""
"1015402-63-マナミ" = "その通りです、よくご存知で。"
"1015402-64-マナミ" = "「創世の影像」は何にも代えられない、我が学院の代表作です。"
"1015402-65-マナミ" = "それ以外にも、お金では買えない作品は多いんですよ。"
"1015402-66-マナミ" = "せっかくですし、特別な作品をご紹介しましょう。"
"1015402-67-マナミ" = "どうです？興味がわきませんか？"
"1015402-68" = "[s] \"気になる！\""
"1015402-69-マナミ" = "では、こちらに……。"
"1015402-71" = "（マナミの案内で美術館の中に入った）"
"1015402-76" = "[ns3] \"カーテンが閉まってる……？\"\n[ns4] \"この後ろに作品があるの？\""
"1015402-79-マナミ" = "ええ。"
"1015402-80-マナミ" = "では、カーテンを開けましょう。"
"1015402-83-マナミ" = "これこそが――"
"1015402-85-マナミ" = "我が学院の特別な作品です。"
"1015402-88" = "（しかしマナミの説明と違って、そこには何も入っていない白紙の額縁があるだけだった）"
"1015402-89-マナミ" = "感想を伺っても？"
"1015402-90" = "[ns5] （これは試されているのだろうか……）\n[ns6] （慎重に答えないと……！！）"
"1015402-95" = "[ns7] \"ただの白紙と額縁……かな？\"\n[ns8] \"空虚さを表現した作品だね？\""
"1015402-96-マナミ" = "その通りです。#nですが、私が求めていた答えではありません。"
"1015402-97-マナミ" = "ふふっ……興味深い答えですね。"
"1015402-98-マナミ" = "答え合わせ……というほどではありませんが、#nなぜこの作品に価値があるのかお話しましょう。"
"1015402-99-マナミ" = "それは、この作品が持つ特異な事情によるのです。"
"1015402-101-マナミ" = "さかのぼること、10年前――"
"1015402-103-マナミ" = "草木も眠るような夜、泥棒が入りました。"
"1015402-104-マナミ" = "おかしいと思った警備員はすぐに通報しましたが、泥棒はそれよりも早く――"
"1015402-105-マナミ" = "10分もしないうちに、カーテンの中にあった作品を盗み去りました。"
"1015402-106-マナミ" = "持ち去られたのは――オデュッセイアの嵐。#n荒波の上で死闘を繰り広げる船員を描いた名画でした。"
"1015402-107-マナミ" = "額縁を床に叩きつけて割り、刃物で作品を切り付けて盗むという実に野蛮な犯行。"
"1015402-108-マナミ" = "当時の評議会長はあらゆる力を使ったそうですが、取り戻すことは叶いませんでした。"
"1015402-109-マナミ" = "犯人は、ほとんど証拠を残していかなかったのです。"
"1015402-110-マナミ" = "犯人の顔を見た警備員の話をもとに、モンタージュを作りましたが……。"
"1015402-111-マナミ" = "似たような顔つきの者が多く、特定には至らず。"
"1015402-112-マナミ" = "以降、盗まれた作品の行方は知れぬままです。"
"1015402-114-マナミ" = "この迷宮入りの事件――"
"1015402-115-マナミ" = "10年が過ぎた今も、解決のための努力は続けています。"
"1015402-116-マナミ" = "しかし時の流れは残酷で……捜査に進展はないのが実情です。"
"1015402-117-マナミ" = "今はただ、作品が戻ることを願い、当時の額縁を掲げることしか……。"
"1015402-118" = "[s9] \"それでここに額縁が……。\"\n[s10] \"心が痛む事件だね……。\""
"1015402-121-マナミ" = "作品は消えてしまいましたが、人々の心は、ずっとここに残り続けています。"
"1015402-122-マナミ" = "消えた作品を心の目で白紙に描き、花咲かせた感情をそれぞれの旋律で心に刻む。"
"1015402-123-マナミ" = "物質的な芸術と、物質を超える切望の価値。"
"1015402-124-マナミ" = "……それこそが、感覚の芸術ではないかと思うのです。"
"1015402-125" = "[s11] \"作品……見つかるといいね。\"\n[s12] \"私が手伝えることはない？\""
"1015402-128-マナミ" = "ふふっ、頼もしいお言葉ですね。"
"1015402-129-マナミ" = "必要な時が来たら、遠慮なく先生に依頼いたします。"
"1015402-130-マナミ" = "作品を取り戻すことは芸術評議会の悲願。"
"1015402-131-マナミ" = "それは、現評議会長であり、コレクターでもある私個人にとっても同様です。"
"1015402-132-マナミ" = "ふふっ、先生の協力を取り付けられただけでも、この場を設けた意味がありました。#n価値あるつながりを形成する。とても喜ばしいですね。"
"1015402-134" = "（その後、マナミと美術館の作品を鑑賞しながら、いろんな話をした）"
"1015402-135" = "（芸術に対するマナミの考えを確認でき、非常に意味のある時間だった）"
