[translation]
"1015405-1" = "特別な芸術品"
"1015405-2" = "[ns] \"ふわあぁぁっ……。\""
"1015405-3" = "（書類作業に疲れたので、気分転換を兼ねて川沿いを散歩することにした）"
"1015405-6" = "[ns] \"気持ちいいなぁ……。\""
"1015405-7" = "（清々しい川沿いを歩いていると……）"
"1015405-12-マナミ" = "あら？"
"1015405-13-マナミ" = "ふふっ、先生。散歩中ですか？"
"1015405-14" = "[s] \"気分転換にね。マナミは？\""
"1015405-15-マナミ" = "なにやらこの近くに特別な芸術品があるとの噂を耳にしまして。"
"1015405-16-マナミ" = "天気もいいですし、私も気分転換を兼ねて学院の外に出てみたところ――"
"1015405-17-マナミ" = "先生とばったりお会いした……という流れです。"
"1015405-18-マナミ" = "ええ。[ruby=・]偶[/ruby][ruby=・]然[/ruby]にも。"
"1015405-19" = "[s1] （たぶん偶然じゃないんだろうなぁ……）\n[s2] \"へぇ……その特別な芸術品って？\""
"1015405-22-マナミ" = "気になりますか？"
"1015405-23-マナミ" = "では、よければご一緒しませんか？"
"1015405-24-マナミ" = "偶然お会いしたのですし、交流を持つには良い機会かと。"
"1015405-25-マナミ" = "私たちはまだ、互いに知らない部分も多いですので。"
"1015405-26" = "[s3] （断るという選択肢はないような圧を感じた）\n[s4] \"いいね。一緒に行こっか。\""
"1015405-29-マナミ" = "ええ、喜んで。"
"1015405-31" = "シャーレ近くの地下街"
"1015405-32-マナミ" = "目的地はここです。"
"1015405-33-マナミ" = "このどこかに、私の収集欲を刺激する芸術品があるそうで。"
"1015405-34" = "[s5] \"ここに……？\"\n[s6] （ここはよくある地下街だ）\n[s7] （マナミが欲しがりそうな芸術品を取り扱うお店はないと思うけど……）"
"1015405-38-マナミ" = "「ただの地下街だ」と思われましたか？"
"1015405-39-マナミ" = "無理もありません。"
"1015405-40-マナミ" = "私の審美眼は、先生の基準とは差があるでしょうから。"
"1015405-41-マナミ" = "ですので私自ら、芸術品をご紹介しましょう。"
"1015405-42-マナミ" = "さあ、こちらです。"
"1015405-44" = "（そう言ってマナミはファンシーショップに入っていく）"
"1015405-45" = "（そして――）"
"1015405-48-マナミ" = "この子たちの中にいます。"
"1015405-49-マナミ" = "私が認める、特別な芸術品が。"
"1015405-50-マナミ" = "おや？理解できないといった表情ですね？"
"1015405-51-マナミ" = "まさか……本当に？"
"1015405-52" = "[s] （不正解だと点数を引かれるやつだ……！）"
"1015405-53-マナミ" = "ふふっ、そんなに緊張することはありません。"
"1015405-54-マナミ" = "一般人であれば戸惑うのも当然。"
"1015405-55-マナミ" = "私の審美眼が確かだとはいえ、価値の判断に絶対はありませんから。"
"1015405-56" = "[s] （自分が特殊だという自覚はあるのか……）"
"1015405-59-マナミ" = "コレクションとは「感覚の芸術」だと私は考えています。"
"1015405-60-マナミ" = "時を超えて何かを連想させることができる――それがコレクションです。"
"1015405-61-マナミ" = "その過程において、平凡な物でも誰かにとっては大切な芸術品になったりもします。"
"1015405-62-マナミ" = "そこで、私が芸術品として紹介したいグッズはこちらです。"
"1015405-66-マナミ" = "私は特に「ビッグブラザー」が好きです。"
"1015405-67-マナミ" = "[ruby=・]見[/ruby][ruby=・]る[/ruby]だけで、すべての真実を見抜くフクロウ。"
"1015405-68-マナミ" = "とはいえ、それはただのキャラクター設定。#n誰かにとっては幼稚にうつることでしょう。"
"1015405-69-マナミ" = "それでも、誰かにとっては大きな力になります。"
"1015405-70-マナミ" = "……ゴールを見失っていた、過去の私がそうだったように。"
"1015405-71" = "[s] \"ゴールを見失った時期って……。\""
"1015405-76-マナミ" = "ビッグブラザーのかわいくて大きな目を見ていると、声が聞こえてきます。"
"1015405-77-マナミ" = "「私はすべての真実を見抜く力を持っている。君の悲しみもちゃんと見ているよ」"
"1015405-78-マナミ" = "「君のことを分かってくれる存在がそばにいる。だから、立ち上がって」"
"1015405-79-マナミ" = "いつも、そうやって私を応援してくれている気がして。"
"1015405-80-マナミ" = "私は心の中で、ビッグブラザーのぬいぐるみを抱えているのです。"
"1015405-81-マナミ" = "……この話は、他の誰にも言ったことのない、私だけの秘密。"
"1015405-82-マナミ" = "どうです？#n私の考える「芸術」について理解していただけたでしょうか？"
"1015405-83" = "[s8] \"そうだね……確かに感じたよ。\"\n[s9] \"言葉では言い表せない、いろんな感情を。\""
"1015405-86-マナミ" = "そう。その通りです。"
"1015405-87-マナミ" = "そして、感覚の芸術とは流動的なもの。"
"1015405-88-マナミ" = "今日、コレクションにまた1つ花が咲きました。#n私はきっと、ビッグブラザーを見るたびに思い出すでしょう。"
"1015405-89-マナミ" = "――互いの秘密を打ち明けた、今日という時間を。"
"1015405-90" = "[s] \"うん、そうだね……。\""
"1015405-93" = "[ns] \"ん？お互いの……？私はまだ何も――\""
"1015405-94-マナミ" = "ええ。[ruby=・]ま[/ruby][ruby=・]だ[/ruby]聞いていません。"
"1015405-95-マナミ" = "ですから、これからじっくり聞かせてもらいましょう。"
"1015405-96-マナミ" = "教えてください。"
"1015405-97-マナミ" = "他の誰にも話していない、先生だけの大切な秘密を。"
"1015405-98" = "[s] \"っ……！？\""
"1015405-99-マナミ" = "まさか、嫌だと言うおつもりで？"
"1015405-100-マナミ" = "乙女の秘密を聞いておいて、このまま知らんぷり――はしないですよね？"
"1015405-101-マナミ" = "で・す・よ・ね？"
"1015405-102" = "[s] \"マナミさん！？\""
"1015405-104" = "（その後、ビッグブラザーのグッズを見ながら、様々な会話をした）"
"1015405-105" = "（マナミの伝えたいものがひしひしと伝わってくる時間だった……）"
