[translation]
"1015403-1" = "コレクターの悩み"
"1015403-2" = "（マナミに会うためにワイルドハントの芸術評議会室に向かった）"
"1015403-7-マナミ" = "ようこそお越しくださいました。"
"1015403-8-マナミ" = "ご足労いただきありがとうございます。"
"1015403-9" = "[s1] \"マナミだけ？\"\n[s2] \"他のメンバーは？\""
"1015403-12-マナミ" = "おりません。今回は個人的な案件ですので。#n先にお伝えした「芸術品の展示」ですが――"
"1015403-13-マナミ" = "私の「個人博物館」に関することなのです。"
"1015403-14-マナミ" = "ご存じの通り、私は様々な芸術品を個人博物館に収蔵しています。"
"1015403-15-マナミ" = "ただ、最近になって大きな問題にぶつかりました。"
"1015403-16-マナミ" = "増える一方の収蔵品。"
"1015403-17-マナミ" = "いよいよ展示スペースがなくなってしまったのです！"
"1015403-21-マナミ" = "最初は学院の収蔵庫に保管することを考えました。"
"1015403-22-マナミ" = "しかし、個人の物は置けないと、評議会の会議で却下されました。"
"1015403-24-マナミ" = "次に、屋根裏部屋を改造しようとしました。"
"1015403-25-マナミ" = "しかし、想定以上に予算がかかるとのことで、こちらも会議で却下されました。"
"1015403-27-マナミ" = "権限を使えば、反対を押し切ることはできます。"
"1015403-28-マナミ" = "ですがそれで反対勢力に言いがかりをつけられるのは御免です。"
"1015403-29" = "[s] \"反対勢力……？\""
"1015403-30-マナミ" = "はい。この学院で私をけん制する「影の組織」です。"
"1015403-31-マナミ" = "いまだ勢力の規模もリーダーも把握できていません。"
"1015403-32-マナミ" = "ただ、私が追っている[ruby=・]泥[/ruby][ruby=・]棒[/ruby][ruby=・]猫[/ruby]と関連する組織だと思います。"
"1015403-33-マナミ" = "私の妄想だと言うメンバーもいますが……。"
"1015403-34-マナミ" = "私には分かるのです。"
"1015403-35-マナミ" = "闇の中を不愉快に動き回り、学院を汚す[ruby=・]虫[/ruby][ruby=・]け[/ruby][ruby=・]ら[/ruby]――"
"1015403-36-マナミ" = "捕まえた暁には、[ruby=・]一[/ruby][ruby=・]生[/ruby][ruby=・]昆[/ruby][ruby=・]虫[/ruby][ruby=・]ゼ[/ruby][ruby=・]リ[/ruby][ruby=・]ー[/ruby][ruby=・]の[/ruby][ruby=・]刑[/ruby]に処しましょう。"
"1015403-39-マナミ" = "……おっと、失礼。少々乱暴でしたね。"
"1015403-40-マナミ" = "ともあれ、私の勝手で学院の収蔵庫を使用したり、建物を改造したりはできません。"
"1015403-41-マナミ" = "コレクションを保管する場所が無限にあれば良いのですが……。"
"1015403-42-マナミ" = "先生はなにか良いアイディアをお持ちではないですか？"
"1015403-43" = "[s3] \"場所が足りないなら……。\"\n[s4] \"コレクションの一部を売ったり譲ったりするのは？\""
"1015403-46-マナミ" = "はい？"
"1015403-47-マナミ" = "本気ですか？"
"1015403-48" = "[s] \"……や、やっぱりダメだよね！\""
"1015403-49-マナミ" = "当然です。#n全てに私の気持ちが込められているというのに、他人に譲るなどありえません。"
"1015403-50-マナミ" = "信頼のおける方が管理する空間を一時的にお借りするのが最大限の譲歩です。"
"1015403-51" = "[s5] \"じゃあ、シャーレは？\"\n[s6] \"こっちで預かろうか？\""
"1015403-54-マナミ" = "シャーレ……。"
"1015403-57-マナミ" = "ふむ。"
"1015403-58-マナミ" = "ご提案ありがとうございます。#nですが即答は難しいですね。"
"1015403-59-マナミ" = "ご迷惑でなければ、今すぐシャーレに伺ってもよろしいでしょうか？"
"1015403-60-マナミ" = "私のコレクションを置くにふさわしい場所か確認したいのですが。"
"1015403-61" = "[s] \"い、今すぐ……？\""
"1015403-62-マナミ" = "はい、今すぐ。"
"1015403-64" = "（結局マナミに押し切られて、一緒にシャーレに帰ってきた）"
"1015403-73" = "[ns] \"ようこそ！ここが執務室だよ！\""
"1015403-74-マナミ" = "ほぉ……。"
"1015403-75-マナミ" = "……ん？#nまさか、ここに私のコレクションを保管しろということではありませんよね？"
"1015403-76" = "[s] \"空きスペースもあるし、いいと思うんだけど……。\""
"1015403-77-マナミ" = "はぁぁ……。"
"1015403-78-マナミ" = "芸術品には、保管する時に気をつけるべき4大要素があります。"
"1015403-79-マナミ" = "それをご存じの上での提案だとおっしゃるなら、#n先生との協力関係について真剣に考え直さなければいけません。"
"1015403-80" = "[s7] \"4大要素！？\"\n[s8] \"ほ、ほこり……とか？\""
"1015403-83-マナミ" = "……そうだろうと思いました。"
"1015403-84-マナミ" = "温度、湿度、光、そして汚染防止。#nこれが芸術品の保管において意識すべき4大要素です。"
"1015403-85-マナミ" = "ここは光が入りすぎていて、照度の管理が難しそうです。"
"1015403-86-マナミ" = "フィギュアを置こうものなら、紫外線による変色が生じて価値が損なわれるでしょう。"
"1015403-87" = "[s] \"そっか……。\""
"1015403-90" = "[ns9] \"って、え？フィギュア？\"\n[ns10] \"コレクションってフィギュアなの？\""
"1015403-93-マナミ" = "全てではありませんが、含まれていることは事実です。#nフィギュアも立派な芸術品ですよ。"
"1015403-94-マナミ" = "フィギュアを見れば、好きな作品に対する思いが湧き上がる――"
"1015403-95-マナミ" = "これこそ感覚の芸術そのものです。"
"1015403-96-マナミ" = "まさか……理解できないとおっしゃいますか？"
"1015403-97" = "[s] \"そんなことないです！分かります！\""
"1015403-98-マナミ" = "それは何より。"
"1015403-99-マナミ" = "では、保管のための大事な要素も理解したところで、他も見てみましょう。"
"1015403-100-マナミ" = "どうか、ここよりは議論に足る場所がありますように。"
"1015403-102" = "（こうしてマナミと一緒にシャーレを見て回った）"
"1015403-111" = "（……が、マナミが気に入る場所は見つからず）"
"1015403-112" = "（最後になったのは――）"
"1015403-114" = "[ns] \"こ、ここはどう？\""
"1015403-115-マナミ" = "ほお、ここは……？"
"1015403-120-マナミ" = "少し雑然としていますが……立派な部屋ですね。"
"1015403-121-マナミ" = "元から何かを保管すべく設計されているようです。"
"1015403-122-マナミ" = "密閉がかなう構造に、照度が調整可能な照明――"
"1015403-123-マナミ" = "それに、温度と湿度の調節もできる。"
"1015403-124-マナミ" = "ここなら、及第点です。"
"1015403-125" = "[s] \"よ、よかった……。\""
"1015403-126-マナミ" = "では、こちらの一部をお借りするとしましょう。"
"1015403-127-マナミ" = "ご協力いただき、ありがとうございます。"
"1015403-129" = "（そして次の日……）"
"1015403-140" = "（マナミの指揮のもと、臨時収蔵庫ができた）"
"1015403-143-寮監隊員" = "評議会長様！作業完了です！"
"1015403-144-マナミ" = "えぇ、皆さんご苦労様でした。"
"1015403-145-マナミ" = "約束通り、特別外出券を発行いたしましょう。"
"1015403-146-寮監隊員" = "ありがとうございます！"
"1015403-148-マナミ" = "保管する品は、私が自分で運搬します。"
"1015403-149-マナミ" = "それぞれが大切な作品ですので、細心の注意が求められます。"
"1015403-150-マナミ" = "一度に運べる量は多くないので、何度もシャーレを訪れることになりますが……。"
"1015403-151-マナミ" = "先生なら理解してくださいますよね？"
"1015403-152" = "[s] \"う、うん……問題ないよ。\""
"1015403-153-マナミ" = "私の大切な芸術品を預かれること、光栄に思ってください。"
"1015403-154-マナミ" = "これでも人は選んでおりますので。"
"1015403-155" = "[s] \"でも、本当にここでいいの？\""
"1015403-156-マナミ" = "言ったではありませんか。及第点だ、と。"
"1015403-157-マナミ" = "それにこれで、いつシャーレに来てもおかしくない理由ができましたから。"
"1015403-158-マナミ" = "愛する芸術品の保管場所を確保し、#nシャーレとの距離を縮められれば学院内での権力強化にも繋がる。#nこれぞまさに一石二鳥。"
"1015403-159-マナミ" = "ふふっ、先生。見ていてください。"
"1015403-160-マナミ" = "いつか、私に抵抗する勢力をすべて捕まえて、[ruby=・]一[/ruby][ruby=・]生[/ruby][ruby=・]マ[/ruby][ruby=・]タ[/ruby][ruby=・]タ[/ruby][ruby=・]ビ[/ruby][ruby=・]の[/ruby][ruby=・]刑[/ruby]を――"
"1015403-161" = "[s] （まさか、最初からそれが目的だったり……？）"
"1015403-164-マナミ" = "そういえば、謝礼の話をしていませんでしたね。"
"1015403-165-マナミ" = "ワイルドハントの評議会長ともあろう者が、#nシャーレを無償でお借りするわけにはいきません。"
"1015403-166-マナミ" = "さあ、望みをおっしゃってください。#n[ruby=・]な[/ruby][ruby=・]ん[/ruby][ruby=・]で[/ruby][ruby=・]も[/ruby]先生の願いを叶えて差し上げましょう。"
"1015403-167-マナミ" = "内々で処理できることだと望ましいですが……。"
"1015403-172-マナミ" = "この機会に解き放つのです。先生の心に秘めたる願いを。"
"1015403-173-マナミ" = "私には、その願いを聞き入れるだけの権力がありますので。"
"1015403-174" = "[s] \"そんな願いないよ！\""
"1015403-175-マナミ" = "ふふっ、まだ心の準備ができていないようですね。"
"1015403-180-マナミ" = "私は急ぎませんので、いつでもお申し付けください。"
"1015403-181-マナミ" = "それでは、またお目にかかります。"
"1015403-183" = "（その後しばらくは、マナミのシャーレ訪問が続いた）"
"1015403-184" = "（利用された気がしなくもないが……気を強く持てば大丈夫だろう）"
