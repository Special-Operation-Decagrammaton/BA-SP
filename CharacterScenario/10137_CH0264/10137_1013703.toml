[translation]
"1013703-1" = "時間感覚"
"1013703-2" = "（用事があってブラックマーケットに足を運んだものの探していたものが見つからず、帰ろうとした瞬間――）"
"1013703-3" = "（路地から騒がしい声が聞こえてきた）"
"1013703-4-コノカ" = "逃げるな！こっちへこーい！！"
"1013703-5-コノカ" = "誰が行くかバカ！"
"1013703-6-ヘルメット団" = "捕まえがいがある相手を逃がすと思う？地の果てでも追いかけてやるぞ～！"
"1013703-7-コノカ" = "ひぃぃっ！！"
"1013703-8-コノカ" = "ってか今日、時間厳守しないといけない日なんだけど！"
"1013703-9-コノカ" = "だから！大人しく！捕まって！ほしいんだけど！？"
"1013703-10-コノカ" = "はい！手錠！穴二つ！手二つ！#n使い方、分かるよね？"
"1013703-11-ヘルメット団" = "はぁ！？誰が自分に手錠かけるヤツがいるんだよ！？"
"1013703-12-ヘルメット団" = "頭おかしいんじゃないのか！？#nえいっ！"
"1013703-13-ヘルメット団" = "がはっ……！うっ……！"
"1013703-14-コノカ" = "ははっ！テフロン加工弾だ！痛いだろ？"
"1013703-15-コノカ" = "バッグで防げるわけないもんなぁ！"
"1013703-16-コノカ" = "ヴァルキューレの防弾服程度――"
"1013703-17-ヘルメット団" = "はぁ？？？？？？"
"1013703-18-ヘルメット団" = "弾倉一つ空にしたのにノーダメージってなんだよ！？"
"1013703-19-ヘルメット団" = "あーあ、スクールバッグ穴だらけになっちゃったじゃん！"
"1013703-20-ヘルメット団" = "もうこれじゃあ教科書、読めないんだけど？"
"1013703-21-ヘルメット団" = "どう責任とってくれんのよ！！コラァーッ！"
"1013703-22-ヘルメット団" = "いや、それはお前がバッグを盾にしたからだろ！！"
"1013703-23-コノカ" = "当たったら痛いじゃん！使えるもんがあるなら使うでしょうが！"
"1013703-24-ヘルメット団" = "なんで教科書、テープでぐるぐる巻きになってんだよ！？"
"1013703-25-コノカ" = "大切だから！だってば！"
"1013703-26-ヘルメット団" = "んじゃ本で殴るんじゃねぇよ！いたっ！"
"1013703-27-コノカ" = "お前、本当に警察か？やってることスケバンと一緒じゃねえか！"
"1013703-28-ヘルメット団" = "文句があるなら、ヴァルキューレに入ることだね～#n手続きくらいならしたげるよ。"
"1013703-29-ヘルメット団" = "んで、今シメられるのと、逮捕されてからシメられるの……どっちがいい？"
"1013703-30-コノカ" = "どっちも同じだろ！！"
"1013703-31-ヘルメット団" = "選ばせてあげてんだから、とっとと選びな！"
"1013703-32" = "[ns] \"あ、あの……とりあえず話し合いとか……。\""
"1013703-33-コノカ" = "しゃ、シャーレの先生！？"
"1013703-34-コノカ" = "助けてくださいぃ！！！"
"1013703-35-ヘルメット団" = "ちょっ！先生に言うのは反則でしょ！？"
"1013703-36-ヘルメット団" = "ち、ちわーっす、先生！あたしら、ちょーっと遊んでただけっていうか？"
"1013703-37" = "[ns] \"友達同士、仲良く、しないとね……？\""
"1013703-38-ヘルメット団" = "これ、あたしが怒られる展開なんすか！？"
"1013703-39-ヘルメット団" = "あっ！先生、今何時っすか？"
"1013703-40-ヘルメット団" = "あたしのスマホ壊れちゃって……ってかあとで弁償してよね！"
"1013703-41-コノカ" = "はぁ？自分でスマホ使って人を殴っといて……#nそれはちょっと酷くねぇか！？"
"1013703-42" = "[ns] \"5時59分だけど……。\""
"1013703-43-ヘルメット団" = "……！"
"1013703-44-ヘルメット団" = "は？17時59分？"
"1013703-45-ヘルメット団" = "やば……もう退勤時間じゃん……。"
"1013703-46-ヘルメット団" = "ほら、手錠渡しとくからちゃんとかけといてね。朝9時にヴァルキューレに来るんだよ！#n逃げたら容赦しない。"
"1013703-47-ヘルメット団" = "あたしとの約束だからね？"
"1013703-48-ヘルメット団" = "んじゃ先生、お先に失礼します！今日は時間厳守の日なんで！"
"1013703-49-コノカ" = "お疲れ様ーっした！"
"1013703-50" = "[ns] \"え、ええ……？\""
"1013703-51-ヘルメット団" = "……は？"
"1013703-52-ヘルメット団" = "帰ってった……？"
"1013703-53-ヘルメット団" = "ヴァルキューレ、一体どうなってんだ……？"
"1013703-54" = "[s] \"ど、どうしたんだろう……。\""
"1013703-55" = "翌日・午前8時59分"
"1013703-56" = "（昨日に引き続き、騒がしい声が聞こえてきた）"
"1013703-57-コノカ" = "ひぃぃっ！！ここは昨日と全然違う街なのに！どうやって場所分かったんだよ！！"
"1013703-58-ヘルメット団" = "逃げたら容赦しないって言ったよねぇ？"
"1013703-59-ヘルメット団" = "あの後、一応張り込んでたんだけど……いやぁ～ビンゴだったかぁ。"
"1013703-60-コノカ" = "お前帰るって言ってたじゃねぇか！！"
"1013703-61-ヘルメット団" = "ざーんねん、張り込みは趣味なんだよね。#n仕事じゃないってわけ。"
"1013703-62-ヘルメット団" = "9時まであと8秒！首を洗って待ってるんだねぇ！"
"1013703-63-コノカ" = "うわーん！助けてぇ！！もう逃げませんから！！！"
"1013703-64" = "（コノカは9時になったタイミングで容疑者を逮捕した）"
"1013703-65" = "（時間を確認したコノカは、こちらに気がつくと満面の笑みを返してくれた）"
