[translation]
"1013706-1" = "バディ"
"1013706-2" = "（バスに乗って、コノカと会うべく田舎の方へやってきた）"
"1013706-3-コノカ" = "先生、こっちっす～！"
"1013706-4-コノカ" = "ご足労いただき感謝っす。#nどうしてもバディが必要で……。"
"1013706-5-コノカ" = "なのにヴァルキューレで定期訓練があって、一緒に来てくれる子がいなかったんすよ。"
"1013706-6" = "[s] \"何をすればいいの？\""
"1013706-7-コノカ" = "聞き込み捜査っす！"
"1013706-8-コノカ" = "逃走中の容疑者がいるんすけど、ここへ向かうバスに乗ったらしくて。"
"1013706-9-コノカ" = "余所者だから目立つでしょうし、聞き込みすれば一発だと思うっす！"
"1013706-10-コノカ" = "午後には雨降るらしいんで、さっさと終わらせて帰るっすよ！"
"1013706-11-コノカ" = "しゅつど～！"
"1013706-12-コノカ" = "はぁ……。"
"1013706-13-コノカ" = "誰も見てないって……どういうことっすか？"
"1013706-14-コノカ" = "これ以上は聞き込みしても微妙っすよね……。"
"1013706-15-コノカ" = "もしかして、山に逃げてたり……？#n木の根をかき分けてでも探して見せるっす！"
"1013706-16" = "[s] \"山の動物が可哀想だからやめて！\""
"1013706-17-コノカ" = "もちろんちゃーんと元通りにはするっすよ。#nというかただの例えっすし……。"
"1013706-18-コノカ" = "時間も遅いし、急いで決着つけないと――"
"1013706-19-コノカ" = "はぇ？"
"1013706-20-コノカ" = "うぎゃーっ！冷たっ！！"
"1013706-21-コノカ" = "あっちで雨宿りできそうっす！#nああ、もーっ！！"
"1013706-22" = "（コノカと一緒に急いで雨をしのげる場所へ向かった）"
"1013706-23" = "（再三の失敗に肩を落としてたコノカは、唐突に上着を脱ぎ始めた）"
"1013706-24" = "[wa:2172]― [log=코노카]あーあ、[wa:1075]びしょ濡れ……。[/log]"
"1013706-25" = "― [log=코노카]うぅ……[wa:570]さっむ。[/log]"
"1013706-26" = "[wa:1586]― [log=코노카]降り[wa:162]始めちゃいましたね。[/log]"
"1013706-27" = "― [log=코노카]夜までは止まないらしいのに……[wa:2261]はぁ……。[/log]"
"1013706-28" = "― [log=코노카]まぁ、[wa:994]頭を冷やすには[wa:1173]ちょうどよかったっすかね。[/log]"
"1013706-29" = "[ns] \"大丈夫？落ち着いた？\""
"1013706-30" = "[wa:517]― [log=코노카]はぇ？[wa:973]ああ、[wa:860]うーん。[/log]"
"1013706-31" = "― [log=코노카]悔しくないって[wa:487]言ったら[wa:995]嘘になるっすよ。[/log]"
"1013706-32" = "― [log=코노카]いろいろ[wa:273]無駄骨になるわ、[wa:1480]濡れ鼠になるわ……。[/log]"
"1013706-33" = "[wa:556]― [log=코노카]でも、[wa:816]占いの[wa:481]通りっす。[/log]"
"1013706-34" = "― [log=코노카]バディが[wa:217]隣にいたから、[wa:1039]良い1日に[wa:425]なりました。[/log]"
"1013706-35" = "― [log=코노카]……先生の[wa:1002]おかげっすよ。[/log]"
"1013706-36" = "[wa:870]― [log=코노카]だから、[wa:934]どちらかというと――[/log]"
"1013706-37" = "― [log=코노카]幸せです。[/log]"
"1013706-38" = "― [log=코노카]……あっ、[wa:376]いや、[wa:607]その！[/log]"
"1013706-39" = "― [log=코노카]こうやって[wa:337]雨宿りもできて、[wa:1249]ラッキーで[wa:490]幸せだ[wa:430]なっ[wa:315]て意味で！[/log]"
"1013706-40" = "― [log=코노카]そ、[wa:456]それだけ……[wa:806]っすから……。[/log]"
"1013706-41-コノカ" = "……。"
"1013706-42-コノカ" = "あー……ええと、幸せっていうのは。#nその、最悪は免れたから、で……。"
"1013706-43-コノカ" = "特に深い意味は――"
"1013706-44-怪しげな通行人" = "おっと、先客がいたな。"
"1013706-45-怪しげな通行人" = "アツアツの中わりぃな。急に降ってきたもんだからさぁ。"
"1013706-46-コノカ" = "……？"
"1013706-47-怪しげな通行人" = "なんだ、お前も追われてんのか？#nうちらとご同類っぽい感じするけど。"
"1013706-48-怪しげな通行人" = "あ、そうだ。この近くでサツ見なかったか？"
"1013706-49-コノカ" = "マジか……。"
"1013706-50" = "[ns] \"ヴァルキューレなら、ここに……。\""
"1013706-51-怪しげな通行人" = "えっ……。"
"1013706-52-怪しげな通行人" = "あ～！急に滝行がしたくなってきたなぁ！#nそれじゃお先に！！"
"1013706-53-コノカ" = "待てぇー！！！"
"1013706-54-怪しげな通行人" = "おとり捜査とか卑怯だろ！！"
"1013706-55-コノカ" = "はい、罪状二倍ィ！"
"1013706-56-怪しげな通行人" = "なんでー！？"
"1013706-57-コノカ" = "アツアツ妨害罪ってことで！"
"1013706-58" = "（雨の中、不良に向かって駆け出したコノカはあっという間に容疑者を逮捕した）"
"1013706-59" = "（帰り道、コノカはバスに揺られながら窓の外を眺めていた）"
