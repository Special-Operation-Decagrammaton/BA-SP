[translation]
"1600405-1" = "終わらない夜"
"1600405-2-フィーナ" = "センセイ！こっちデス、こっち！"
"1600405-3-フィーナ" = "エヘへ、来てくれてありがとうございマス！おかげでフィーナはとても気分がいいデス！"
"1600405-4-フィーナ" = "……センセイはテンションがそんなに高くないデスね？"
"1600405-5-フィーナ" = "もしかして、忙しいのに無理してマセンか？チケットも勝手に買ったので、今になって心配になりマシタ……。"
"1600405-6" = "[s1] \"ううん、お休みだったから。すごく楽しみだった。\"\n[s2] \"サボりって楽しいよね。\""
"1600405-7-フィーナ" = "そうデスか、良かったデス！心配してしまいマシタ！"
"1600405-8-フィーナ" = "エッ……だ、大丈夫デスか！？"
"1600405-9-フィーナ" = "大丈夫なら良いのデスが……とにかく！"
"1600405-10-フィーナ" = "せっかくセンセイに来てもらったからには、楽しんでもらわないとデス！"
"1600405-11-フィーナ" = "映画は人を選ぶと言いマス、ですがご心配なく！今日用意した映画は一つだけじゃありマセン！"
"1600405-12-フィーナ" = "今日の映画は21本ありマス！一つぐらいは気に入るものがあるはずデス！"
"1600405-13-フィーナ" = "ふふっ、センセイの言いたいことは分かりマス。チケットは2枚なのに、なぜ映画が21本なのか……？"
"1600405-14-フィーナ" = "それはこのチケットが、ただのチケットではなく……。"
"1600405-15-フィーナ" = "「リレー上映会」のチケットだからデス！！Hoooo！！"
"1600405-16" = "[s] \"リレー上映会？\""
"1600405-17-フィーナ" = "これは文字通り、リレーのように映画を連続で上映するものデス。"
"1600405-18-フィーナ" = "映画好きなマニアのために、似たようなジャンルの映画をまとめて上映してくれるデス！"
"1600405-19-フィーナ" = "モチロン、ワタシたちが見るのは任侠映画リレー！！"
"1600405-20-フィーナ" = "さあ、時間がありマセン！まずは一つ目から、here we go！！"
"1600405-21" = "（フィーナに手を掴まれて、劇場の中に連れていかれた）"
"1600405-22" = "（映画の内容は悪くなかった。任侠映画だったが、派手な暴力シーンは編集でカットされているようだ）"
"1600405-23" = "（ちょっと残念ではあったけれど、学生も楽しんで見られるように配慮しているのだろう）"
"1600405-24-フィーナ" = "スバラシイ……。"
"1600405-25-フィーナ" = "本当にスバラシイ映画デシタね……お頭……いえセンセイ……いえ、お頭……。"
"1600405-26-フィーナ" = "スミマセン混乱しました、センセイ……。"
"1600405-27-フィーナ" = "いかがデシタか？面白かったデスか？"
"1600405-28" = "[s] \"……お頭と呼びな。\""
"1600405-29-フィーナ" = "……！！"
"1600405-30-フィーナ" = "よ、良いのデスか……！お頭……！"
"1600405-31-フィーナ" = "仰せの通りに！お頭！すぐに次の映画に行きマショウ！"
"1600405-32-フィーナ" = "次の映画は「仁義なきニャンニャンパンチ」デス！！"
"1600405-33" = "（その後の映画も、どれも素晴らしい映画だった）"
"1600405-34" = "（任侠映画らしい渋いかっこよさやハードボイルドな雰囲気が、時には叙情的に、時にはドラマチックに描かれていた）"
"1600405-35" = "（……）"
"1600405-36" = "（けれども……）"
"1600405-37-フィーナ" = "ヒュー……ッ！今回も本当に素晴らしかったデスね、センセ……お頭！！"
"1600405-38-フィーナ" = "それでは次の映画デス……！"
"1600405-39" = "（いくら素晴らしい映画とはいえ、同じジャンルの映画を21作も見るということ）"
"1600405-40" = "（そして隣からずっと話しかけられて眠ることもできないまま、途中からは同じような展開を見続けることは……）"
"1600405-41-フィーナ" = "フゥー……！これデス、これ……！では次……！"
"1600405-42" = "（……それは、普通の人間にとっては……）"
"1600405-43-フィーナ" = "Amazing、他に言葉もありマセン……。"
"1600405-44" = "（拷問に近い……）"
"1600405-45-フィーナ" = "最ッッッッッッ"
"1600405-46-フィーナ" = "高………！"
"1600405-47-フィーナ" = "デス！！！！"
"1600405-48" = "（最後の21作目の映画を見ていた頃には、完全に意識が飛んでいたらしい）"
"1600405-49" = "（……気が付いた時は、映画館の外の川沿いだった）"
"1600405-50-フィーナ" = "……ンセイ？"
"1600405-51-フィーナ" = "センセイ……？気が付きマシタか……？"
"1600405-52" = "[s3] \"ここはどこ……私は誰……？\"\n[s4] \"無事、戻ってこれたか。私たちの居場所に……。\""
"1600405-53-フィーナ" = "ア、アア……！"
"1600405-54-フィーナ" = "ア、アア……！"
"1600405-55-フィーナ" = "し、しっかりしてクダサイ、センセイ！自分を見失っては駄目デス！ワタシが悪かったデス！"
"1600405-56-フィーナ" = "スミマセン……まさかこうなるとは……。"
"1600405-57-フィーナ" = "ワタシ、何日も何日も昼夜を問わず、任侠映画を見るのが習慣だったんデス……センセイも大丈夫だと、勝手に考えてマシタ。"
"1600405-58-フィーナ" = "フィーナのせいデス……本当にゴメンナサイ……。"
"1600405-59-フィーナ" = "これからは、映画に誘ったりしマセンから……。"
"1600405-60-フィーナ" = "グスッ……グスン……。"
"1600405-61" = "[s5] \"大丈夫、気にしないで。\"\n[s6] \"……ご苦労だった。\""
"1600405-62-フィーナ" = "……？"
"1600405-63-フィーナ" = "……？"
"1600405-64-フィーナ" = "そ、それはどういうことデス……？"
"1600405-65-フィーナ" = "そう言われマシても、ワタシ……。"
"1600405-66-フィーナ" = "意識を失ったのではなく……ちょっと寝ていただけ？"
"1600405-67-フィーナ" = "……イエ、そんなはずは……どう見ても気を失って……。"
"1600405-68-フィーナ" = "……「私はお頭だぞ」？"
"1600405-69-フィーナ" = "ハ、ハイ！それは承知シテ、あ、イエ！口答えをするつもりは……！そんなわけないデス！まさかお頭にそんなことは！"
"1600405-70-フィーナ" = "失礼しマシタ！お頭はお眠りになっただけデスね！ワタシの勘違いデシタ！"
"1600405-71-フィーナ" = "ただワタシは……！"
"1600405-72-フィーナ" = "……。"
"1600405-73-フィーナ" = "……フフッ。"
"1600405-74-フィーナ" = "アハハハハハハッ！！"
"1600405-75-フィーナ" = "アー、笑いすぎて涙が出そうデス！アハハハハッ！"
"1600405-76-フィーナ" = "アー、ハー……ふう、センセイは本当に……。"
"1600405-77-フィーナ" = "……。"
"1600405-78-フィーナ" = "……ありがとうございマス、センセイ。センセイは、いつもフィーナを守ってくれて、フィーナのために色んなことをしてくれマス。"
"1600405-79-フィーナ" = "今日のことも、それ以外も……どうやってお返しすれば良いのか……。"
"1600405-80-フィーナ" = "センセイにも、任侠を感じマス。ワタシとはまた別の、暖かくて柔らかいような……。"
"1600405-81-フィーナ" = "まるで、フィーナを包み込んでくれるような……。"
"1600405-82-フィーナ" = "そういう仁義デス……ハイ、心からそう思いマス。"
"1600405-83-フィーナ" = "……エヘへ。"
"1600405-84" = "（その後フィーナと一緒に、その日見た映画についてしばらくお喋りをした）"
"1600405-85" = "（そして次はリレー上映ではなく、普通の映画館の映画を見に行く約束をした）"
