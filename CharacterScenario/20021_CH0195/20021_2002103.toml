[translation]
"2002103-1" = "特訓！サンタへの道！"
"2002103-2-ハナエ" = "というわけで！"
"2002103-3-ハナエ" = "真のサンタになるために何が必要か、#n考えに考えてみた結果……！"
"2002103-4" = "[s1] \"ちょっと不安になってきた……。\"\n[s2] （私に対処できる範囲だと良いな……）"
"2002103-5-ハナエ" = "もう、そんなに怯えないでくださいよー。"
"2002103-6-ハナエ" = "もう、そんなに怯えないでくださいよー。"
"2002103-7-ハナエ" = "大丈夫です。今すぐ、ここでできることなので！"
"2002103-8" = "[s] \"それなら良いんだけど……ところで、考えてみた結果……？\""
"2002103-9-ハナエ" = "パルクールです！！！"
"2002103-10-ハナエ" = "身体一つで障害物も壁も乗り越える、あれです！"
"2002103-11-ハナエ" = "プレゼントを届けるため……壁を自由自在によじ登り、煙突を上り下りするには……"
"2002103-12-ハナエ" = "やはりパルクールだなと！"
"2002103-13-ハナエ" = "ということで先生、#n一緒にパルクールの練習をしませんか？"
"2002103-14" = "[s] 逃げる。"
"2002103-15-ハナエ" = "ちょっ、先生！#n逃げないでください、大人なんですから！"
"2002103-16" = "[s] \"大人だからといってパルクールはできない！それに場所も……\""
"2002103-17-ハナエ" = "場所についてはご心配なく！"
"2002103-18-ハナエ" = "このシャーレの居住区でも、全然大丈夫です。"
"2002103-19-ハナエ" = "壁もそう高くないですし、#n丈夫そうですし！"
"2002103-20-ハナエ" = "サンタさんはどんな状況でも諦めません……#nであれば、私も諦めるわけにはいかないんです！"
"2002103-21-ハナエ" = "さぁ、先生。私が先に登りますから、ついてきてください！"
"2002103-22" = "（そう言ってすぐに、ハナエは壁をよじ登りはじめた）"
"2002103-23" = "（しかしやはり慣れないからか、微妙に危なっかしい気がして……)"
"2002103-24-ハナエ" = "むむ、これはこうやって……"
"2002103-25-ハナエ" = "きゃあ！？"
"2002103-26" = "（落下してきたハナエを、ギリギリのところで両腕で受け止めた）"
"2002103-27" = "[ns] \"危なかった……。\""
"2002103-28-ハナエ" = "さすが先生です、受け止めてくれると思っていました！"
"2002103-29-ハナエ" = "先生がいるなら、何も怖いことはありません！"
"2002103-30-ハナエ" = "さあ先生、次の場所へ行ってみましょう！"
"2002103-31" = "（ハナエに引きずられるようにして、別の場所へ向かうことになった）"
"2002103-32-ハナエ" = "うーん、ここは難しそうですね……#n手をひっかけるところがほとんど無さそうですし……。"
"2002103-33-ハナエ" = "ですがこの程度で屈しては、サンタさんは名乗れません！"
"2002103-34" = "[s] \"名乗らなくても、良いんじゃないかな……？\""
"2002103-35-ハナエ" = "滑らないようにこの手袋を付けて……#n足をここに……"
"2002103-36-ハナエ" = "一つずつ、慎重に……！"
"2002103-37-ハナエ" = "トリニティの建物は飾りが多いですし、#n何だか登りやすそうです！"
"2002103-38-ハナエ" = "ですが、こういった装飾品を壊すと怒られますので……"
"2002103-39-ハナエ" = "慎重にやりましょう！"
"2002103-40" = "[s] \"やらないという選択肢は！？\""
"2002103-41-ハナエ" = "では早速、バランスを崩さないように……"
"2002103-42-ハナエ" = "手足に頼らず、全身で……！"
"2002103-43-ハナエ" = "見てください、先生！#nどうですか！？"
"2002103-44" = "[s] \"すごいけど、ちゃんと足元見て！？\""
"2002103-45" = "古びた居住区"
"2002103-46-ハナエ" = "この辺りが、一番実戦に近そうですね。"
"2002103-47-ハナエ" = "下手したら、足元が崩れて危なそうな場所もありますが……。"
"2002103-48-ハナエ" = "しかしそれを乗り越えてこそ、真のサンタさんです！"
"2002103-49" = "[s] \"本当にそうかな！？\""
"2002103-50" = "（その後も、ハナエは次々と色々な場所へ向かい……）"
"2002103-51" = "（どうにか怪我をすることなく、一日を終えた）"
"2002103-52-ハナエ" = "お手伝いいただきありがとうございました、先生！"
"2002103-53" = "[s] \"無事で良かった……。\""
"2002103-54-ハナエ" = "これでようやく、このサンタ服に恥じない自分になれた気がします！"
"2002103-55-ハナエ" = "では次に……。"
"2002103-56-ハナエ" = "……？どうかしましたか？"
"2002103-57-ハナエ" = "はい、まだまだ続きますよ！#n真のサンタさんになるためには、まだ足りない部分も多いので！"
"2002103-58-ハナエ" = "やはり次は、マッハ2で飛ばないと！"
"2002103-59-ハナエ" = "どうすれば良いんでしょう？#nとりあえず、ミレニアムの方々に聞いてみますか？"
"2002103-60-ハナエ" = "以前聞いたお話ですと、あそこのエンジニア部のみなさんは――"
"2002103-61" = "[s] \"それは危ないからやめておこう！\""
