[translation]
"2002105-1" = "あなたを待ちわびて"
"2002105-2-ハナエ" = "ようこそ、先生！"
"2002105-3-ハナエ" = "えへへ。#nそういえば、先生をここにご招待するのは初めてですね。"
"2002105-4-ハナエ" = "大したものでは無いですが、ゆっくりしていってください！"
"2002105-5" = "[wa:800]― これは……"
"2002105-6" = "― 私なりの[wa:600]サンタさんをお迎えする[wa:1200]準備です。"
"2002105-7" = "[wa:700]― サンタさんが寒くないよう、"
"2002105-8" = "― 暖炉に[wa:500]火を入れて……"
"2002105-9" = "― クリスマスツリーを[wa:800]可愛く飾り付けるんです。"
"2002105-10" = "[wa:900]― サンタさん、"
"2002105-11" = "― 待ってますよ～[wa:900]って。"
"2002105-12" = "― そうすると、"
"2002105-13" = "― 必ず靴下に[wa:1100]プレゼントを[wa:600]入れてくれるんです！"
"2002105-14" = "[wa:700]― そして今年はですね……"
"2002105-15" = "[wa:800]― サンタさんに[wa:600]お礼をしようと思っています！"
"2002105-16" = "― えへへ、[wa:900]どうでしょう？"
"2002105-17" = "― 手作りクッキーと[wa:1000]新鮮なミルクです！"
"2002105-18-ハナエ" = "サンタさんは毎年この時期、#nすっごく大変じゃないですか。"
"2002105-19-ハナエ" = "なのに私はもらってばかりで、#n何もしてあげられなかったので……。"
"2002105-20-ハナエ" = "だから今年は、どうしてもお礼がしたくて。"
"2002105-21-ハナエ" = "これでサンタさんが#n少しでも元気になってくれると良いなあって。"
"2002105-22" = "（その後、ハナエが靴下を作り終わるまで一緒にいた）"
"2002105-23" = "（靴下を作り終えたハナエは疲れたのか、ソファーに座ってうとうとしていて……）"
"2002105-24-ハナエ" = "んん……今年のプレゼントは……誰も大きな怪我をしませんように……。"
"2002105-25-ハナエ" = "それか……すんごい消毒薬をください……。"
"2002105-26" = "[ns] ハナエがサンタさんのために用意していた牛乳とクッキーを、そっと食べる。"
"2002105-27" = "[ns] ハナエへのプレゼントを買いに出かける。"
"2002105-28" = "（「すんごい消毒薬」を見つけるのは、なかなか大変だった……)"
