[translation]
"1007205-1" = "干潟に潜むもの"
"1007205-2" = "（サキから連絡をもらい、村の西側にある干潟へ向かった）"
"1007205-3-サキ" = "お、先生。早かったな……"
"1007205-4-サキ" = "……って、どうして普段着で来たんだ？"
"1007205-5" = "[s] \"何か問題でもあるの……？\""
"1007205-6-サキ" = "干潟に入るって言っただろう。なのに、そんな格好で来るなんて……"
"1007205-7-サキ" = "……後で泥が落ちなくても知らないぞ？"
"1007205-8" = "[s1] \"とりあえず、長靴は履いてきたから。\"\n[s2] \"サキが獲るところを見守ってるよ。\""
"1007205-9-サキ" = "もしかして、干潟を甘く見てないか？"
"1007205-10-サキ" = "ぬかるみに足を取られて、毎年事故が発生するほど危険なんだぞ。"
"1007205-11-サキ" = "両足がハマってしまうと、自力で脱出するのは不可能に近い。"
"1007205-12-サキ" = "徐々に潮高が上がって、満潮になったら危険だからな。"
"1007205-13-サキ" = "だから服が汚れるとしても、重心を落として移動するのが安全だ。"
"1007205-14-サキ" = "今日は周りに村の住民もいるし、いざという時は助けてもらえると思うけど……"
"1007205-15" = "[s] \"分かった、気をつけるね。\""
"1007205-16-サキ" = "ああ。私は汚れても構わないから、取るのは任せてくれ。"
"1007205-17-サキ" = "……それじゃ、始めるぞ。"
"1007205-18-サキ" = "先生、見てくれ！マテガイだ！"
"1007205-19-サキ" = "穴に手を入れてみたら、簡単に獲れたぞ！"
"1007205-20-サキ" = "こんなにあっさりと……この前の苦労は何だったんだ。"
"1007205-21-サキ" = "あれ？ここにも穴が……"
"1007205-22-サキ" = "どれどれ……"
"1007205-23-サキ" = "今度はハゼじゃないか！"
"1007205-24-サキ" = "面白い見た目をしてるが、鍋にして食べると美味しいんだよなぁ。"
"1007205-25-サキ" = "ふふっ。穴に手を入れるたび、貝や魚が獲れるなんてな。#n宝箱でも開けてる気分だ。"
"1007205-26" = "[s] \"サキは器用だね。\""
"1007205-27-サキ" = "無論だ。SRTの隊員は、いかなる環境にも適応しないといけないからな。"
"1007205-28-サキ" = "RABBIT小隊のポイントマンたるもの、泥の中に潜[ruby=ターゲット]む標的の[/ruby]索敵くらい、なんてことはない！"
"1007205-29-サキ" = "あ、ここにも穴が。"
"1007205-30-サキ" = "今度は何が出るかな……"
"1007205-31-サキ" = "獲れたぞ！"
"1007205-32-サキ" = "ん……？"
"1007205-33-サキ" = "……なんだ、これは？"
"1007205-34-サキ" = "ツルツルして気持ち悪い形をした、赤いナマコみたいなものが獲れたんだが……"
"1007205-35-サキ" = "せ、先生……これが何か知ってるか？"
"1007205-36" = "[s] \"ごめん、私も知らないかな……。\""
"1007205-37-村の住民" = "おお、ユムシじゃないか。"
"1007205-38-サキ" = "ゆ、ユムシ……？"
"1007205-39-村の住民" = "都会の人は、見たことないかもしれんな。"
"1007205-40-村の住民" = "ユムシは干潟だとよく獲れるんだ。大物狙いの釣り餌として使われる事が多いが、刺し身や酢漬けにして食べる事もできる。"
"1007205-41-村の住民" = "奇妙な形だろう？でも、ほのかな甘味とコクがクセになる。#n美食家からも人気の食材だよ。"
"1007205-42-村の住民" = "ははっ、君たちは運がいいね！"
"1007205-43-サキ" = "……先生。"
"1007205-44-サキ" = "ちょっと……手を出してくれないか。"
"1007205-45" = "[s] \"ど、どうして……？\""
"1007205-46-サキ" = "このユムシとかいう奴……手の中でクネクネ動くし、生臭い水を吐き出すから……"
"1007205-47-サキ" = "一刻も早く離したい……。"
"1007205-48" = "[s] \"離したら……？\""
"1007205-49-サキ" = "さっきの話、先生も聞いてただろう？#n美食家に人気の食材らしいぞ！"
"1007205-50-サキ" = "気持ち悪いけど、せっかく手に入れた食材を手放すなんてこと……"
"1007205-51-サキ" = "できるものか！"
"1007205-52-サキ" = "だから、その……先生にコイツを預かってもらいたいんだが……"
"1007205-53" = "[s] 逃げる。"
"1007205-54-サキ" = "おいっ、待て！"
"1007205-55" = "（……その後、泥を飛ばしながら走ってきたサキに捕まって、無理やりユムシを持たされた）"
"1007205-56" = "（刺身にして食べたユムシは、意外と美味しかった）"
