[translation]
"1007206-1" = "深い海、浅い呼吸"
"1007206-2" = "（漁村の波止場近くを散歩していたら、ダイビング中のサキと遭遇した)"
"1007206-3" = "[ns] \"やあ、サキ。\""
"1007206-4-サキ" = "あれ、先生じゃないか。"
"1007206-5-サキ" = "何してるんだ？"
"1007206-6" = "[s] \"散歩中だよ。\""
"1007206-7" = "[ns] \"サキは何してるの？\""
"1007206-8-サキ" = "海底に沈んでいるゴミを回収していたところだ。"
"1007206-9-サキ" = "捨てられた漁具やビニール袋みたいな海洋ゴミが、岩なんかに引っかかっていてな。"
"1007206-10-サキ" = "村の住民たちには色々と助けられたし、ダイビングの練習も兼ねてゴミを拾ってたんだよ。"
"1007206-11" = "[s1] \"えらい……！\"\n[s2] \"サキは立派だね。\""
"1007206-12-サキ" = "まぁ、大したことじゃない。"
"1007206-13-サキ" = "ゴミがなくなった海中は、気持ちがいいからな。"
"1007206-14-サキ" = "綺麗になった海を泳いでいると、自分も魚になったような気分になれるから。"
"1007206-15" = "[s3] \"ダイビングかぁ……いいね。\"\n[s4] \"機会があれば、いつかやってみたいな。\""
"1007206-16-サキ" = "先生はダイビングの経験がないのか？"
"1007206-17-サキ" = "まぁたしかに……海中深くに潜るわけだし、呼吸もシュノーケル頼りではあるから、#n不安を抱くのも分からなくはないが……"
"1007206-18-サキ" = "でも、インストラクターが一緒なら、むしろ水泳より手軽に楽しむことができる。"
"1007206-19-サキ" = "そうだ、先生。せっかくだし、挑戦してみないか？#n装備なら予備があるし……"
"1007206-20-サキ" = "万が一トラブルが発生しても、マスターダイバーの私がいれば、何も問題ない。"
"1007206-21" = "[s] \"本当にいいの？\""
"1007206-22-サキ" = "もちろん。任せてくれ。"
"1007206-23-サキ" = "当初の予定とは違うけど……これが、日頃のお礼になるなら……"
"1007206-24-サキ" = "とりあえず、水着に着替えてきてくれ。"
"1007206-25-サキ" = "私は装備の点検をしておくから。"
"1007206-26" = "（サキに手を引かれながら、まずは水に身体を慣らした……）"
"1007206-27" = "[wa:200]― [log=사키 수영복]（さあ、先生。[wa:1650]落ち着いて、[wa:770]こっちを見るんだ）[/log]"
"1007206-28" = "― [log=사키 수영복]（そうそう、[wa:900]ゆっくり。[wa:1400]息をゆっくり吐いて）[/log]"
"1007206-29" = "[wa:200]― [log=사키 수영복]（ふふっ、[wa:600]さすが先生。[wa:1350]習得が早いな）[/log]"
"1007206-30" = "[wa:370]― [log=사키 수영복]（……なんか[wa:1030]変な感じだ）[/log]"
"1007206-31" = "[wa:200]― [log=사키 수영복]（海の中で[wa:550]先生と二人きり、[wa:1800]言葉もなく）[/log]"
"1007206-32" = "― [log=사키 수영복]（視線と[wa:400]ジェスチャーだけで[wa:850]会話していると……）[/log]"
"1007206-33" = "― [log=사키 수영복]（まるで……）[/log]"
"1007206-34" = "[wa:50]― [log=사키 수영복]（……えっ？[wa:650]呼吸が[wa:600]苦しそうに見える？）[/log]"
"1007206-35" = "― [log=사키 수영복]（いや、[wa:470]何も問題ない。[wa:1130]大丈夫だ！）[/log]"
"1007206-36" = "[wa:120]― [log=사키 수영복]（なんだか、[wa:850]いつもと違って……）[/log]"
"1007206-37" = "― [log=사키 수영복]（呼吸が[wa:670]不安定だ）[/log]"
"1007206-38" = "[wa:200]― [log=사키 수영복]（……先生とのダイブ、）[/log]"
"1007206-39" = "[wa:200]― [log=사키 수영복]（私には[wa:1000]まだ早かったのかも[wa:1150]しれないな）[/log]"
"1007206-40" = "（その後、サキと一緒にダイビングを楽しんだ）"
"1007206-41-サキ" = "先生、どうだった？初めてのダイビング体験は。"
"1007206-42" = "[s] \"最高だったよ！\""
"1007206-43-サキ" = "ふふ、楽しんでもらえたなら、何よりだ。"
"1007206-44-サキ" = "……実は、ちょっと不安だった。"
"1007206-45-サキ" = "大人は経験してきたことが多いから、私にとっては新鮮でも、先生にとってはそうじゃないことも多いだろう……"
"1007206-46-サキ" = "だから、私はポイントマンなのに、先生を先導することは出来ないんじゃないかって……"
"1007206-47" = "[s] \"無理に先導しようとしなくて大丈夫だよ。\""
"1007206-48-サキ" = "でも……助けられてばかりで、何も返せないなんて――"
"1007206-49-サキ" = "そんなの、不公平じゃないか。"
"1007206-50" = "[s] \"世の中は、不公平なものだからね。\""
"1007206-51-サキ" = "……ふん。"
"1007206-52-サキ" = "まぁ、ダイビングは気に入ってもらえたみたいだし……"
"1007206-53-サキ" = "また海を泳ぎたくなったら、呼んでくれ！"
"1007206-54-サキ" = "いつだって、私が先生の[ruby=パートナー]バディ[/ruby]になってやるから。"
