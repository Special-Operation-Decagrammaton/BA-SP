[translation]
"1005806-1" = "「救護」の在り方"
"1005806-2" = "（ミネの力を借りて、素早く仕事を片付けられた）"
"1005806-3-ミネ" = "これで今日の作業は、一通り終わったようですね。"
"1005806-4" = "[s] \"ミネは書類仕事も得意なんだね。\""
"1005806-5-ミネ" = "いえ、それほどでも。"
"1005806-6-ミネ" = "私も救護騎士団では責任者の立場にありますので、書類と付き合う機会もそれなりにあるからかもしれません。"
"1005806-7-ミネ" = "思いがけずに得られたスキルのひとつですね。"
"1005806-8" = "[s] \"今日はミネの「救護」のおかげで助かったよ。\""
"1005806-9-ミネ" = "……！"
"1005806-10-ミネ" = "なるほど、これもまたひとつの「救護」の在り方……！"
"1005806-11-ミネ" = "ありがとうございます、先生。大変勉強になりました。"
"1005806-12" = "[s] （ちょっとくらい笑ってもらえるかなと思って言ったんだけど……）"
"1005806-13-ミネ" = "……失礼しました、私のですね。"
"1005806-14" = "[s] \"出てもらって大丈夫だよ。\""
"1005806-15-ミネ" = "はい、ありがとうございます。"
"1005806-16-ミネ" = "こちら救護騎士団です。救護のご用命でしょうか？"
"1005806-17-緊迫した声" = "た、助けてください！道に迷って……！"
"1005806-18-緊迫した声" = "あの森です……「キヴォトスの樹海」です！"
"1005806-19-ミネ" = "「キヴォトスの樹海」ですね？"
"1005806-20-ミネ" = "もう少し詳しい状況をご説明いただけませんか？"
"1005806-21-緊迫した声" = "分からないんです……"
"1005806-22-緊迫した声" = "視界が暗くて遠くも見えず、どれも似たような木ばかりで……。"
"1005806-23-緊迫した声" = "……で……し……。"
"1005806-24-ミネ" = "もしもし……聞こえていますか！？"
"1005806-25-ミネ" = "電話が切れてしまいました……。"
"1005806-26-ミネ" = "先生、これは一刻の猶予もありません。"
"1005806-27" = "[s] \"何が起きてるの……！？\""
"1005806-28-ミネ" = "「キヴォトスの樹海」で、誰かが救護の手を求めています！"
"1005806-29-ミネ" = "大至急向かわねば！"
"1005806-30" = "[s] \"「キヴォトスの樹海」……？\""
"1005806-31-ミネ" = "はい、聞いたことはありませんか？"
"1005806-32-ミネ" = "「キヴォトスの樹海」は、一度入ったら抜け出せないと有名な場所……。"
"1005806-33-ミネ" = "その森に入るとGPSが機能しなくなったり、方位磁石が異常な動きをしたり……。"
"1005806-34-ミネ" = "一度でも道に迷ってしまうと出られなくなってしまう場所として、恐れられているのです。"
"1005806-35" = "[s] \"それはもう立入禁止にした方が良いんじゃ……！？\""
"1005806-36-ミネ" = "すでに案内板などで、むやみに立ち入らないよう警告は出されておりますが……。"
"1005806-37-ミネ" = "禁止されているからこそ、興味を持つ者が後を絶たず……。"
"1005806-38-ミネ" = "目的は人それぞれです。それこそSNSに投稿するためだったり、肝試しだったり、あるいは単純な好奇心から「キヴォトスの樹海」に足を踏み入れる人たちも見受けられます。"
"1005806-39-ミネ" = "先ほど私のところに届いた電話の主も、きっとそのうちの一人でしょう。"
"1005806-40-ミネ" = "先生、本日はありがとうございました。"
"1005806-41-ミネ" = "私は急ぎますので、お先に失礼いたします。"
"1005806-42" = "[ns] \"ちょっと待って……！\""
"1005806-43-ミネ" = "しかし、先生まで「キヴォトスの樹海」に来ていただかなくても……。"
"1005806-44" = "[s1] \"今日はミネに助けてもらったから、お互いさまってことで。\"\n[s2] \"ミネも大切な生徒だし、一人で危険な場所には行かせられないよ。\""
"1005806-45-ミネ" = "大切な、生徒……。"
"1005806-46-ミネ" = "ふふっ、そうでしたね。私自身の立場をすっかり忘れていました。"
"1005806-47-ミネ" = "つまり私と一緒に「救護」活動を担っていただける、ということですね。"
"1005806-48-ミネ" = "やはり今からでも、救護騎士団の臨時顧問になっていただくのはいかがでしょうか？"
"1005806-49" = "[s] \"そういえば前、そんな話もあったね……。\""
"1005806-50-ミネ" = "ええ。"
"1005806-51-ミネ" = "何度でも申し上げますが、先生は素晴らしい「救護」の才能と精神をお持ちですので。"
"1005806-52-ミネ" = "とにかく、今は先を急ぐとしましょうか。"
"1005806-53-ミネ" = "……実は「キヴォトスの樹海」に訪れるのは、私も初めてのことなのです。"
"1005806-54-ミネ" = "思っていたよりも、緊張しております……。"
"1005806-55" = "[s] \"ミネでも緊張するんだね。\""
"1005806-56-ミネ" = "……私も「大切な」生徒だと言っていただいたから、かもしれません。"
"1005806-57-ミネ" = "すみません、こんな時に。そんなに慌てなくても大丈夫ですよ。"
"1005806-58-ミネ" = "では、参りましょう！"
"1005806-59-ミネ" = "先生、足元の木にお気をつけください！"
"1005806-60-ミネ" = "これで大丈夫ですね。"
"1005806-61-ミネ" = "もう少し資源を大切に……？"
"1005806-62-ミネ" = "確かに、それもそうですね。"
"1005806-63-ミネ" = "引き続き足元に注意しながら進みましょう。"
"1005806-64-ミネ" = "遊歩道を外れてから結構な時間歩いてきましたが……人の痕跡が見当たりませんね。"
"1005806-65-ミネ" = "……色々と不安になってきましたが、私たちに救護を要請した生徒もきっと同じ気持ちでしょう。"
"1005806-66-ミネ" = "先生は大丈夫ですか？"
"1005806-67-ミネ" = "日陰で助かりましたが、足元も悪いのでご無理なさらず。"
"1005806-68-ミネ" = "かなり奥深くまで来ましたね……。"
"1005806-69-ミネ" = "しかしGPSが機能しないというのは、やはり単なる噂だったようです。"
"1005806-70-ミネ" = "とはいえ、バッテリーも減ってきてしまいました……。"
"1005806-71-ミネ" = "予備の分を持ってくるべきでしたね。"
"1005806-72-ミネ" = "……ありがとうございます。そうですね、急な出動であれば準備が心許ないのはよくあることです。今は最善を尽くしましょう。"
"1005806-73" = "（結局夜になっても、手がかりは見つからず……）"
"1005806-74-ミネ" = "……。"
"1005806-75-ミネ" = "こんな時間になってしまいましたね。"
"1005806-76-ミネ" = "申し訳ありません、先生。救護となると、周りが見えなくなってしまうようで……。"
"1005806-77-ミネ" = "やはり、先生を勢いで巻き込んでしまわない方が良かったかもしれません。"
"1005806-78" = "[s3] \"ううん、私がついてきたんだから気にしないで。\"\n[s4] \"その気持ちの真っすぐさは、ミネの良い所だよ。\""
"1005806-79-ミネ" = "……ありがとうございます、先生。"
"1005806-80-ミネ" = "あちらに休めそうな場所がありますね。"
"1005806-81-ミネ" = "少し休憩を取りませんか？シャーレを出てから、ずっと歩き詰めでしたから。"
"1005806-82-ミネ" = "先生はこちらの切り株に……"
"1005806-83-ミネ" = "落ち葉はどかしましたので、どうぞ。"
"1005806-84" = "[wa:400]― 先生、[wa:1200]大丈夫ですか？"
"1005806-85" = "― お怪我などは[wa:700]ありませんか？"
"1005806-86" = "[wa:500]― 夜の空気は[wa:1450]気持ちが良いですね……。"
"1005806-87" = "― 草の香りに、[wa:1400]川のせせらぎ……"
"1005806-88" = "― 心が落ち着きます。"
"1005806-89" = "[wa:350]― ……どうされましたか？"
"1005806-90" = "― 眩しい…[wa:1400]ですか…？"
"1005806-91" = "[wa:50]― ふふ、[wa:1800]確かに[wa:1200]そうかもしれませんね。"
"1005806-92" = "[wa:400]― 落ち着かないようでしたら、[wa:1600]私にもたれたり"
"1005806-93" = "― 膝でお休みいただいても[wa:1500]構いませんよ。"
"1005806-94" = "― ご心配[wa:400]なさらないでください。"
"1005806-95" = "― たとえ何があっても、"
"1005806-96" = "[wa:100]― 私が必ず[wa:1300]先生をお守りしますので。"
"1005806-97" = "（ミネの膝を借りて、少しのあいだ休ませてもらった）"
"1005806-98-ミネ" = "なんとか入り口まで戻ってこられました……。"
"1005806-99-ミネ" = "バッテリーも、まだ何とか……。"
"1005806-100" = "[s] \"ミネの方は、疲れてない？\""
"1005806-101-ミネ" = "私は大丈夫です。むしろ先生にはなれないことをさせてしまい……。"
"1005806-102-ミネ" = "いつかきちんと「顧問」になっていただいたら、こういうことも増えるかもしれませんが……ふふっ。"
"1005806-103-ミネ" = "もしかして、あの生徒から……？"
"1005806-104-緊迫した声" = "た、助けてください！森で迷ってるんです……！"
"1005806-105-緊迫した声" = "あの「キヴォトスの樹海」です！"
"1005806-106-ミネ" = "あらためてですが、もう少し詳しい状況をご説明いただけませんか？"
"1005806-107-緊迫した声" = "ですが、何も分からなくて……"
"1005806-108-緊迫した声" = "とにかく、木がたくさんあることしか……。"
"1005806-109-ミネ" = "今「キヴォトスの樹海」にいます、少しでもヒントをいただければ。"
"1005806-110-緊迫した声" = "えっ、嘘だろ！？"
"1005806-111-緊迫した声" = "まじで行ったのかよ、やべぇな！"
"1005806-112-チンピラ１" = "イタ電すればあの救護騎士団を動かせるとか、もっと早く思いつけば良かったな！"
"1005806-113-チンピラ２" = "ははっ、相当迷ったんじゃないの？"
"1005806-114-チンピラ１" = "そもそも本当だったところで、あそこで人探しは無理だろ！"
"1005806-115-ミネ" = "……。"
"1005806-116" = "[ns] \"えっと……ミネ？\""
"1005806-117-ミネ" = "三つ、過ちがあります。"
"1005806-118-ミネ" = "一つ目、いくら私でも二度目は様々な可能性を考えるということ。"
"1005806-119-ミネ" = "二つ目、いたずら電話であることを失念してしまったこと。"
"1005806-120-ミネ" = "三つ目、あまりこういった方法を乱用すべきではないのですが……"
"1005806-121-ミネ" = "いくつかの条件があるとはいえ、「救護騎士団は逆探知の権限がある」と知らなかったこと。"
"1005806-122-ミネ" = "先生。"
"1005806-123-ミネ" = "これより私は、「救護」を必要としている方の元へ参ろうと思います。"
"1005806-124-ミネ" = "誰かが道を誤ってしまったとき……。"
"1005806-125-ミネ" = "正しい道を示すことも、私たちが行うべき「救護」です。"
"1005806-126-ミネ" = "先生も、そう思いませんか？"
"1005806-127" = "[ns5] \"えっと……ほどほどにね？\"\n[ns6] \"手加減してあげてね……。\""
"1005806-128-ミネ" = "ご理解いただき、ありがとうございます。"
"1005806-129-ミネ" = "それでは申し訳ありませんが、お先に失礼します。また後日。"
"1005806-130-ミネ" = "救護騎士団、参ります！#n『救護が必要な場に救護を』！"
"1005806-131" = "（その後、ミネは猛烈なスピードでどこかへ消えていった）"
"1005806-132" = "（いたずら電話の犯人たちの顛末については、ミネのみぞ知る……）"
