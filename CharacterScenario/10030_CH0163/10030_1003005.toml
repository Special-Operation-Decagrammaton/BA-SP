[translation]
"1003005-1" = "お返し"
"1003005-2" = "温泉郷・お土産屋さん"
"1003005-3-チナツ" = "あ、先生。来ていただいてありがとうございます。"
"1003005-4-チナツ" = "すみません、お忙しい中で。"
"1003005-5-チナツ" = "もしかしてお休みのところを、お邪魔してしまいましたか……？"
"1003005-6" = "[s1] \"そんなこと無いよ、大丈夫。\"\n[s2] \"ちょうど時間があったから。\""
"1003005-7-チナツ" = "そうですか……なら、よかったです。"
"1003005-8-チナツ" = "そうですか……なら、よかったです。"
"1003005-9-チナツ" = "あ、実はこうして来ていただいたのはその……お返しを、選びたくって。"
"1003005-10" = "[s] “お返し？\""
"1003005-11-チナツ" = "はい。半ば強引にいただいた休日とはいえ、休暇は休暇。"
"1003005-12-チナツ" = "他の部員たちが頑張っているときに私だけが休んでいたわけですから、風紀委員のみなさんにはお返しとして、お土産くらいは買って帰りたいなと。"
"1003005-13-チナツ" = "ただ、私はこういったことも今まであまり無かったので、いったい何を買っていけば良いのかと悩んでしまいまして……。"
"1003005-14-チナツ" = "経験豊富な大人である先生に、助言を頂きたく。"
"1003005-15" = "[s3] \"なるほど。\"\n[s4] \"うーん、パッと良い物が思いつかない……。\""
"1003005-16-チナツ" = "なるほど……いつも生徒たちに囲まれている先生でも、やはり悩まれるんですね。"
"1003005-17-チナツ" = "なるほど……いつも生徒たちに囲まれている先生でも、やはり悩まれるんですね。"
"1003005-18" = "[s] \"風紀委員のみんなが、共通して好きなものとかは？\""
"1003005-19-チナツ" = "それは、その……。"
"1003005-20-チナツ" = "ゲヘナは特にと言いますか、それぞれかなり個性が強いので、全員共通で喜んでくれそうなものというのは中々……。"
"1003005-21-チナツ" = "では……そうですね。"
"1003005-22" = "まずはここにあるものを、一緒にひとつひとつ見ていきましょうか？"
"1003005-23-チナツ" = "まずはここにあるものを、一緒にひとつひとつ見ていきましょうか？"
"1003005-24-チナツ" = "温泉のお土産って色々あるものなんですね、驚きました。"
"1003005-25-チナツ" = "お菓子ひとつ取っても、味や形で何十種類も……。"
"1003005-26-チナツ" = "これは悩んでしまいそうです。"
"1003005-27" = "[s] \"このペロロ饅頭とかどう？\""
"1003005-28-チナツ" = "この不思議な鳥、本当にどこにでもいるんですよね……どこが魅力的なのかいまいち理解しかねるのですが……。"
"1003005-29-チナツ" = "私は嫌いというほどでもないのですが、風紀委員の中にはかなり嫌がられる方もいますので、ちょっと難しいかもしれません。"
"1003005-30-チナツ" = "えっと、他には……。"
"1003005-31" = "[s] \"この入浴剤とかどう？\""
"1003005-32-チナツ" = "「ゲヘナ特製地獄入浴剤。湿気に触れた瞬間に爆発し、周りの環境を一瞬で地獄へと変えることができます。冷水に入れてもOK」"
"1003005-33-チナツ" = "その、興味深くはあるのですが……風紀委員たちの手に渡ったら、何だか困った事態になりそうな気がしますね。ましてやそれ以外の、ゲヘナの特定の生徒たちが手に入れてしまったら……。"
"1003005-34-チナツ" = "な、何かもう少し、穏便なお土産を……。"
"1003005-35" = "[ns] \"この温泉マークが描かれたリボンとかは？\""
"1003005-36-チナツ" = "これは……可愛らしい、ですね。"
"1003005-37-チナツ" = "温泉らしさもありますし、派手過ぎませんし、お土産としても悪くなさそうです。"
"1003005-38-チナツ" = "あ、ただ値段が……これですと、全員分は厳しいかもしれません。"
"1003005-39-チナツ" = "残念ですが、他のお土産を探さないといけないですね……。"
"1003005-40-チナツ" = "先生、あちらの方も見てみましょう。"
"1003005-41" = "（その後、チナツとお土産屋さんの棚を一つ一つ物色した）"
"1003005-42-チナツ" = "抹茶羊羹……。"
"1003005-43-チナツ" = "確かに甘すぎなくて万人受けもしそうですが、こんな普通のお土産で大丈夫でしょうか……？"
"1003005-44" = "[s5] \"お土産は中身より気持ちが大事、ってこともあるから。\"\n[s6] \"普通なのは良いことだと思うよ。\""
"1003005-45-チナツ" = "……ふふ、そうですね。"
"1003005-46-チナツ" = "……ふふ、そうですね。"
"1003005-47-チナツ" = "先生がそうおっしゃってくださって、安心しました。"
"1003005-48-チナツ" = "ありがとうございます、先生。おかげで何とか良い物を選べました。"
"1003005-49-チナツ" = "ところで、先生も先ほど何かを購入されたようでしたが……"
"1003005-50-チナツ" = "先生も、お土産を？"
"1003005-51" = "[ns] \"これはチナツへのお返しだよ、はい。\""
"1003005-52-チナツ" = "……え、わ、私ですか！？"
"1003005-53-チナツ" = "これって……あ、先ほど見ていたリボン……。"
"1003005-54-チナツ" = "で、ですが私は、先生のお役に立つようなことはしていないのに、どうしてお返しを……。"
"1003005-55" = "[s7] “普段から、私の健康を気遣ってくれてありがとう。\"\n[s8] \"それに、チナツのおかげで楽しい時間を過ごせたから。\""
"1003005-56-チナツ" = "……本当に、先生は不思議な方ですね。"
"1003005-57-チナツ" = "まるで私の心を読んでいるかのように……。"
"1003005-58-チナツ" = "あらためて、ありがとうございます。先生。"
"1003005-59-チナツ" = "このリボン……ずっと、大切にします。"
