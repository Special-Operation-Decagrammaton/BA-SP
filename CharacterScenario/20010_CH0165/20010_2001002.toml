[translation]
"2001002-1" = "修行・会席料理編"
"2001002-2" = "シャーレ・居住区"
"2001002-3" = "（仕事を終えてシャーレに戻ると、ノドカが温泉郷の女将の姿で待っていた）"
"2001002-4-ノドカ" = "お帰りなさいませ。お待ちしておりました、先生。"
"2001002-5-ノドカ" = "本日も、お疲れ様でございました。"
"2001002-6-ノドカ" = "さあ上着はこちらへ、シワにならないようハンガーにかけておきますので。"
"2001002-7" = "[s] \"……ノドカ？\""
"2001002-8-ノドカ" = "モモトークでお話した通りですよ、修行の一環です。"
"2001002-9-ノドカ" = "いつか再び227号温泉郷を復活させた時のため、今のうちに温泉郷の女将としてのスキルをしっかり身につけておこうと思ったんです！"
"2001002-10-ノドカ" = "ですが修行をしようにも、レッドウィンターには他に温泉がありませんし、かといってゲヘナに行くのも……。"
"2001002-11-ノドカ" = "というわけで、シャーレで修行をさせていただこうかと！"
"2001002-12" = "[s1] \"最後だけ一気に飛躍した気が……？\"\n[s2] \"どうしてシャーレで……？\""
"2001002-13-ノドカ" = "ここシャーレの居住区には寝具類はもちろん、調理施設やお風呂もありますし。"
"2001002-14-ノドカ" = "ここシャーレの居住区には寝具類はもちろん、調理施設やお風呂もありますし。"
"2001002-15-ノドカ" = "温泉郷の女将としての修行には、ぴったりなんです！"
"2001002-16-ノドカ" = "それに修行の合間合間に、先生の無防備な表情や真剣な横顔をすぐ近くで盗み見ることができますし……えへ、ぅえへへへ……"
"2001002-17-ノドカ" = "……はっ！い、今のはお気になさらず……。"
"2001002-18-ノドカ" = "と、ところで先生？お夕食はまだですよね？"
"2001002-19-ノドカ" = "よろしければ修行の一環として、今日の夕食は私にご用意させてください！"
"2001002-20-ノドカ" = "本日私がご用意するのは……"
"2001002-21-ノドカ" = "なんと、会席料理です！"
"2001002-22" = "[s3] \"……会席料理！？\"\n[s4] \"それ、すっごい高いやつでは……！？\""
"2001002-23-ノドカ" = "ご心配なく。今日のために食費を削って、頑張って貯金しておきました。"
"2001002-24-ノドカ" = "ご心配なく。今日のために食費を削って、頑張って貯金しておきました。"
"2001002-25-ノドカ" = "ここでお金をケチった物をお出ししては、理想的な温泉郷運営はできませんので！"
"2001002-26-ノドカ" = "すぐにご用意しますから、少々お待ちください！"
"2001002-27-ノドカ" = "お待たせしました、先生。"
"2001002-28-ノドカ" = "まずは食欲を増進させる、先付からお出しします。"
"2001002-29-ノドカ" = "最初の料理は、明太子をふんだんに使った……"
"2001002-30-ノドカ" = "……「うんめえ棒」です！"
"2001002-31" = "[s] \"……「うんめえ棒」？\""
"2001002-32-ノドカ" = "はい！旧校舎ではなかなか手に入らない、高級なお菓子なんですよ！"
"2001002-33-ノドカ" = "この「うんめえ棒」はとっても美味しいのですが、そのしょっぱさのせいか、食べてみるとお腹がいっぱいになるどころかさらにお腹が空くんですよね……そこで、実は前菜料理的なものとしてバッチリなのではと！"
"2001002-34-ノドカ" = "さあ先生、ぜひお早めに召し上がってください！"
"2001002-35-ノドカ" = "いかがですか？美味しいですよね？"
"2001002-36" = "[s5] \"「うんめえ棒」だからね……。\"\n[s6] \"いつも通り美味しいね……。\""
"2001002-37-ノドカ" = "ふふっ、お口に合ったのでしたら何よりです。"
"2001002-38-ノドカ" = "ふふっ、お口に合ったのでしたら何よりです。"
"2001002-39-ノドカ" = "それでは引き続き、次のメニューをお持ちいたします。"
"2001002-40-ノドカ" = "次は椀物です！"
"2001002-41-ノドカ" = "今日は寒かったことですし、コンソメスープのように濃い出汁で作ったお吸い物をご用意いたしました。"
"2001002-42" = "[s] \"お吸い物の割には、ちょっと濁ってる……？\""
"2001002-43-ノドカ" = "それは秘伝の食材を使って出汁を取っているからですね。"
"2001002-44-ノドカ" = "さあ、冷めてしまう前にぜひ。"
"2001002-45" = "[ns7] \"この味って……？\"\n[ns8] \"まさか……。\""
"2001002-46-ノドカ" = "あら、お口に合いませんでしたか？"
"2001002-47-ノドカ" = "おかしいですね、コーンポタージュ味の「うんめえ棒」を使って豪勢に旨味を出したのですが……"
"2001002-48-ノドカ" = "やっぱりカレー味の「うんめえ棒」の方が……？"
"2001002-49" = "[s] \"えっと、味の問題以前にまた「うんめえ棒」……？\""
"2001002-50-ノドカ" = "では最後に、お口直しの水菓子です。"
"2001002-51-ノドカ" = "デザートにご用意したのは……"
"2001002-52-ノドカ" = "レモン味の「うんめえ棒」です！"
"2001002-53" = "[s] ”また出てきた！？あと水菓子じゃない！？”"
"2001002-54-ノドカ" = "実は以前、思い切って大量のうんめえ棒セットを購入したんです。"
"2001002-55-ノドカ" = "それ一つで10種類のうんめえ棒が楽しめるという、非常に豪勢なセットを……！"
"2001002-56-ノドカ" = "ちょっと贅沢になってしまいましたが、温泉郷に来てくださったお客様のためであれば、これくらいの投資は惜しくありません！"
"2001002-57" = "[s] （うんめえ棒は何も悪くない、悪くないけど……）"
"2001002-58-ノドカ" = "そういうわけで、いかがでしたか先生？私の会席料理は、ご満足いただけましたでしょうか？"
"2001002-59-ノドカ" = "ふふっ。どうやらあまりの美味しさに衝撃を受けて、何も言えないご様子ですね。"
"2001002-60-ノドカ" = "この様子なら将来復活した227号温泉郷は、美食家たちの新たな聖地として注目を浴びれるかも……？"
"2001002-61" = "その後ノドカと一緒に市内に向かい、夕食に会席料理をご馳走した。"
"2001002-62" = "その時のノドカはまさに百面相という感じだったものの、衝撃でその後の数日間、食欲を失ってしまったらしい……。"
