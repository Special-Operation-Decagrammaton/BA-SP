[translation]
"2001005-1" = "修行・礼節編"
"2001005-2" = "旧校舎付近の山道"
"2001005-3-ノドカ" = "温泉郷を運営すると、毎日たくさんの洗濯物と戦わなくてはいけません。"
"2001005-4-ノドカ" = "お客様にレンタルした浴衣や、タオルなど……"
"2001005-5-ノドカ" = "温泉郷全体で一日に発生する洗濯物の量は、想像を絶するほどなんですよ。"
"2001005-6-ノドカ" = "ですがそうやって忙しい中でも、立派な温泉郷の女将としては常に気品のある佇まいを忘れてはいけません。"
"2001005-7-ノドカ" = "そこで今日は負荷をかけながら……試しに重い座布団を何枚も持ちつつ、この凍った道を歩いてみようかと！"
"2001005-8" = "[s] \"それは修行になるのかな……？\""
"2001005-9-ノドカ" = "もちろんです。品格は身だしなみ、特に歩き方から始まるという話を聞いたことがあります。"
"2001005-10-ノドカ" = "そして重い洗濯物を持ったまま綺麗に歩くということは、なかなか簡単ではありません。"
"2001005-11-ノドカ" = "それに温泉郷の床は時々濡れていることも多くて滑りやすく、油断したら派手に転んでしまいかねないんです。"
"2001005-12-ノドカ" = "……それで選んだ場所が、この雪山！"
"2001005-13-ノドカ" = "障害物も多く、一部の地面は凍っていたりと、雪で滑りやすいこの場所。ここで重い荷物を抱えながら優雅に歩くことができれば、いつどこでも気品のある歩き方ができるはず！"
"2001005-14-ノドカ" = "さあ先生、私の手の上に座布団を積んでください！"
"2001005-15" = "[ns] \"これぐらいで良い？\""
"2001005-16-ノドカ" = "いえいえ、まだあと10枚は持てますよ。もっともっとお願いします。"
"2001005-17" = "[ns] \"これくらい？\""
"2001005-18-ノドカ" = "いえ……まだ、まだやれます……！"
"2001005-19-ノドカ" = "こ、これくらいで良いかと……。"
"2001005-20" = "[s] \"なんかお笑いとかで、こういうの見たような……？\""
"2001005-21-ノドカ" = "ふふっ……見た目は面白くなっているかもしれませんが、良い感じです！"
"2001005-22-ノドカ" = "もしかして温泉郷でもこうして、完璧にバランスを取りながら洗濯物を運ぶ姿を見られたら……感激したお客様が、チップをくれたりするのではないでしょうか！？"
"2001005-23" = "[s] \"そうなると、温泉郷っていうよりサーカスだね。\""
"2001005-24-ノドカ" = "そ、それはどういう意味ですか……！？"
"2001005-25-ノドカ" = "おっと、油断するとやはりこの高さではバランスが……。"
"2001005-26-ノドカ" = "っとと、あ、あれ……？"
"2001005-27" = "[s] \"ノドカ、危ない！\""
"2001005-28-ノドカ" = "いたたた……"
"2001005-29" = "[ns1] \"大丈夫！？\"\n[ns2] \"怪我は……！？\""
"2001005-30-ノドカ" = "だ、大丈夫です。ただちょっと転んでしまっただけで……。"
"2001005-31-ノドカ" = "やっぱり、座布団50枚は難しかったですね……。"
"2001005-32-ノドカ" = "あぅっ……！"
"2001005-33-ノドカ" = "えっと、これはもしかして、足首を捻ってしまったような……？"
"2001005-34-ノドカ" = "うぅ、残念ですが今日の修業はここまでですね……。"
"2001005-35-ノドカ" = "……？先生、その体勢は……？"
"2001005-36" = "[s3] \"その状態で歩かせるわけにはいかないよ。\"\n[s4] \"はい、乗って。\""
"2001005-37-ノドカ" = "そ、それはつまり、おんぶしてくれるということですか……！？"
"2001005-38-ノドカ" = "そ、それはつまり、おんぶしてくれるということですか……！？"
"2001005-39-ノドカ" = "い、いくら足を捻ったと言っても、こんな贅沢が許されても良いのでしょうか！？"
"2001005-40-ノドカ" = "先生の体温が感じられる距離、先生の背中とゼロ距離……"
"2001005-41" = "[s] \"……ノドカ？\""
"2001005-42-ノドカ" = "な、何でもありません！"
"2001005-43-ノドカ" = "ふふっ……怪我をしてしまったとはいえ、これは役得ですね……。"
"2001005-44" = "（そのままノドカをおんぶして、シャーレへと戻った）"
