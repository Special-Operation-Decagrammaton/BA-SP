[translation]
"1002715-1" = "思わぬプレゼント"
"1002715-2-カリン" = "……状況は理解した。"
"1002715-3-カリン" = "つまり……動物保護団体を装った悪徳事業者が、生徒から集めた金銭を――"
"1002715-4-カリン" = "良からぬことに使ってるから、早く捕まえたいということだな？"
"1002715-5" = "[s] \"その通り！\""
"1002715-6-カリン" = "……。"
"1002715-7-カリン" = "重要な任務だと思う。"
"1002715-8-カリン" = "だが、一つ疑問がある……。"
"1002715-9-カリン" = "バニーガールの衣装を着る必要があったのか？"
"1002715-10" = "[ns1] \"あっちもバニーガールだから？\"\n[ns2] \"潜入しやすいし？\""
"1002715-11-カリン" = "た、たしかに。"
"1002715-12-カリン" = "守衛の服装がバニーガールというのは、気になるけど……。"
"1002715-13-カリン" = "まぁ、理由などないんだろうな。"
"1002715-14-カリン" = "……任務に取りかかろう。"
"1002715-15-カリン" = "先生が心配するような「状況」が起きる前に。"
"1002715-16" = "（しばらくして……）"
"1002715-17" = "（……たった数発の弾丸で、カリンは全てを片づけた）"
"1002715-18-ヴァルキューレの生徒" = "くうっ！こ、このまま終わるわけにいかない！"
"1002715-19-ヴァルキューレの生徒" = "私だけのバニーガール帝国を作るという、偉大なる野望が……！"
"1002715-20-ヴァルキューレの生徒" = "黙ってさっさと乗りなさい！"
"1002715-21-カリン" = "バニーガール……帝国？"
"1002715-22" = "[s3] \"きょ、今日はお疲れさま！\"\n[s4] \"おいしいものでも食べに行こう！\""
"1002715-23-カリン" = "ああ。だが……この格好のままでは難しいな。"
"1002715-24-カリン" = "タイツが少し破れてしまって……。"
"1002715-25" = "[s] \"えっ！大丈夫？\""
"1002715-26-カリン" = "問題ない。"
"1002715-27-カリン" = "網タイツは繊細だから、少し擦れただけでも破れるんだ。"
"1002715-28-カリン" = "これだと歩き回れないから、着替えないと……。"
"1002715-29-カリン" = "……何故そんな残念そうな目を？"
"1002715-30-カリン" = "まさか、先生は破れているほうが好きなのか？"
"1002715-31" = "[s5] \"そ、そういうわけじゃないよ！\"\n[s6] \"……黙秘させて。\""
"1002715-32-カリン" = "そ、そうか。"
"1002715-33-カリン" = "着替えてくるから、ちょっと待っててくれ。"
"1002715-34" = "（しばらくして……）"
"1002715-35-カリン" = "お待たせしたな。"
"1002715-36-カリン" = "それで……どこへ行くんだ？"
"1002715-37-カリン" = "私が行きたい所……？"
"1002715-38-カリン" = "じゃあ……家庭料理専門店にしよう。"
"1002715-39-カリン" = "家庭料理は、立派なメイドの必須条件だから……。"
"1002715-40-カリン" = "専門店で味わうだけでも、勉強になるはずだ。"
"1002715-41" = "[s7] \"家庭料理の勉強か……。\"\n[s8] \"カリンは家庭的な人になりそうだね。\""
"1002715-42-カリン" = "う、うん……！"
"1002715-43-カリン" = "目的地も決まったし、早く出発しよう。"
"1002715-44" = "（そうして到着した場所は……）"
"1002715-45" = "ショッピングモールのファッションコーナー"
"1002715-46-カリン" = "……？"
"1002715-47-カリン" = "どうしてここに？家庭料理の店に行くんじゃないのか？"
"1002715-48" = "[s9] \"ちょうどお店があったからね。\"\n[s10] \"まずはタイツを探そう！\""
"1002715-49" = "[ns] \"私の手伝いで破れちゃったんだから、贈らせてよ！\""
"1002715-50-カリン" = "先生からのプレゼント……？"
"1002715-51-カリン" = "まあ……悪くは、ないけど……。"
"1002715-52-店員" = "いらっしゃいませ。お探しの物はありますか？"
"1002715-53-カリン" = "あ……その……。"
"1002715-54-カリン" = "バニーガールの時は、いつも網タイツだから……同じもので。"
"1002715-55" = "[s] \"カリンは、網タイツが好きなの？\""
"1002715-56-カリン" = "別に好きというわけじゃ……。"
"1002715-57-カリン" = "最初に支給されたから、履き続けてるだけだ……。"
"1002715-58" = "[s11] \"これまでずっと同じデザインのものを履いていたなら……。\"\n[s12] \"気に入っているってことじゃないかな？\""
"1002715-59-カリン" = "うーん……？"
"1002715-60-カリン" = "無意識に……バニーガールにはこれ、だと思っていたのかもしれない。"
"1002715-61-カリン" = "先生はどう思う？"
"1002715-62-カリン" = "網タイツ……私に似合うと思うか？"
"1002715-63" = "[s] \"うん！カリンにピッタリだよ！！\""
"1002715-64-カリン" = "……！"
"1002715-65-カリン" = "そ、そうか。"
"1002715-66-カリン" = "先生が良いと思うなら……私も。"
"1002715-67-店員" = "（イチャイチャするなら別のところでしてほしい……）"
"1002715-68" = "[ns] \"じゃあ、早速買って履いてみよう！\""
"1002715-69-カリン" = "今すぐ？"
"1002715-70-カリン" = "まあ……ここなら大丈夫か。"
"1002715-71-店員" = "お決まりですか？お会計はこちらで承ります。"
"1002715-72-カリン" = "……。"
"1002715-73-カリン" = "じゃあ……試着室に行ってくる。"
"1002715-74" = "（しばらくして……）"
"1002715-75-カリン" = "ど、どうだろう？"
"1002715-76-カリン" = "やっぱりバニーガールには、これだろうか？"
"1002715-77" = "[s] \"完璧！”"
"1002715-78-カリン" = "う、うん。"
"1002715-79-カリン" = "じゃあ……これからもバニーガールの時は網タイツを履くことにする。"
"1002715-80-カリン" = "先生が良いって言ってくれたし。"
"1002715-81" = "[s] \"それなら……もう10足ぐらい買おうか？\""
"1002715-82-カリン" = "そんなに？"
"1002715-83-カリン" = "まさか……先生もバニーガール帝国を作るのが目的なのか？"
"1002715-84" = "[s] \"タイツは消耗品だから、替えがたくさんあるほうが良いんじゃない？\""
"1002715-85-カリン" = "まあ……それもそうだが……。"
"1002715-86-カリン" = "先生がそんなに気遣ってくれているなら……。"
"1002715-87-カリン" = "1足ぐらいは、大事に保管したいと思っている。"
"1002715-88" = "[s] \"え？網タイツを記念に残すってこと？\""
"1002715-89-カリン" = "うん。先生が似合うって言ってくれたから。"
"1002715-90-カリン" = "だが、これは消耗品だし……。いつかは全部破れて捨てることになる。"
"1002715-91-カリン" = "それは、すごくもったいない。"
"1002715-92-カリン" = "だから……1足ぐらいは大事に持っていても良いと思う。"
"1002715-93" = "[s] \"ありがとう、カリン……！\""
"1002715-94-カリン" = "お礼を言うのは、私のほうだ。ずっとお世話になってるし。"
"1002715-95-カリン" = "……いつもありがとう、先生。"
"1002715-96-店員" = "（だから、人がいない所で……）"
"1002715-97" = "（それから、カリンが行きたがっていた家庭料理の店で食事をした）"
"1002715-98" = "（思い出に残る楽しい日になった）"
