[translation]
"1002705-1" = "思わぬ結論"
"1002705-2" = "（カリンに案内された場所は、カリンの自室だった）"
"1002705-3" = "（部屋は綺麗に整理されていて、カリンは覚悟を決めたような顔をしていた）"
"1002705-4" = "[ns] \"すごく良い部屋だね。\""
"1002705-5-カリン" = "あ、ありがとう……"
"1002705-6-カリン" = "えっと、いらっしゃいませ、で合ってるのか……？"
"1002705-7-カリン" = "えっと、結構大事なことというか、覚悟が必要なことだったと思うけど……私を信じて、来てくれてありがとう。"
"1002705-8" = "[s1] \"……。\"\n[s2] \"大事なこと……。\""
"1002705-9-カリン" = "えっと、じゃあ、先生……。"
"1002705-10-カリン" = "えっと、じゃあ、先生……。"
"1002705-11-カリン" = "……？"
"1002705-12-カリン" = "今日はいつものメイド服なんだね、って……？"
"1002705-13-カリン" = "それはだって、そうじゃないとダメだろう？"
"1002705-14-カリン" = "私が最初から着てると意味が無いというか……。"
"1002705-15-カリン" = "あ、あれだったら私は部屋から一旦出るから……先生の良いタイミングで呼んでくれても良い。"
"1002705-16-カリン" = "私はその、"
"1002705-17-カリン" = "先生が嫌だったらこのことは誰にも言わないし……。"
"1002705-18-カリン" = "……じゃあ、はい。これ。"
"1002705-19-カリン" = "先生が着たがってたバニー衣装。好きなだけ使って。"
"1002705-20-カリン" = "……？"
"1002705-21-カリン" = "……え、何でそんなため息を？"
"1002705-22-カリン" = "だ、大丈夫だ！私は絶対誰にも言わないし、秘密も守るから！それに、ここまで来てくれたんだし……！"
"1002705-23" = "[s3] \"やっぱり誤解だった……。\"\n[s4] \"私が着たいわけじゃなくて……。\""
"1002705-24-カリン" = "……え？どういうことだ？"
"1002705-25-カリン" = "……え？どういうことだ？"
"1002705-26-カリン" = "つまり、先生はバニー衣装が着たいのではなく……？"
"1002705-27" = "[s] \"それを着てるカリンが可愛いなって、そういうこと。\""
"1002705-28-カリン" = "……。"
"1002705-29-カリン" = "……？"
"1002705-30-カリン" = "……あ、なるほど……？"
"1002705-31-カリン" = "……うん。"
"1002705-32-カリン" = "……ごめん、ようやく理解した。何だかずっと誤解をしてたけれど……。"
"1002705-33-カリン" = "そうか、そういうことか……。"
"1002705-34-カリン" = "……ごめん、色々と混乱した。"
"1002705-35-カリン" = "じゃあこの衣装に反応してたのは、可愛いと思ってくれてたから……？"
"1002705-36" = "[s5] \"それに、カリンがそれを着ててすごく楽しそうだったし。\"\n[s6] \"そういうのが好きなんだなって知れて嬉しかったのもある。\""
"1002705-37-カリン" = "そ、そうか……。"
"1002705-38-カリン" = "そ、そうか……。"
"1002705-39-カリン" = "うん、なるほど……。"
"1002705-40-カリン" = "つまり先生は色んな意味で、私のことを見て喜んでくれてたのか……。"
"1002705-41-カリン" = "何だか、むず痒いな……こうして誰かが私について興味を持ってくれるなんてこと、これまであんまり無かったし……。"
"1002705-42-カリン" = "でも、確かに……。"
"1002705-43-カリン" = "考えてみると、C&Cに入ってからはずっとメイド服ばっかりで。もちろんこれはこれですごく好きなのだけど。"
"1002705-44-カリン" = "学校の制服も、ほとんど着たことが無いし……他の服も……。"
"1002705-45-カリン" = "そういうこともあって、知らず知らずにこのバニーガール衣装で、テンションが上がっていたのかもしれないな。"
"1002705-46-カリン" = "もともと可愛いとは思っていたけど……それにしても、驚いた。私のことに、私より早く気が付くなんて。"
"1002705-47-カリン" = "何だか最近「私を信じて」って何度も言ってしまったけれど、あんなこと言うまでもないくらいだったね。"
"1002705-48-カリン" = "本当に、先生には驚かされてばっかりだ。それに何度も助けてもらって。私からも何か、お返しできれば良いのだけど……。"
"1002705-49-カリン" = "……ん？ああ、私にできることなら……。"
"1002705-50-カリン" = "もう一度今、ここで見たい……？"
"1002705-51-カリン" = "はぁ……そういうところまで含めて、先生は相変わらずだな。"
"1002705-52-カリン" = "……うん、分かった。それで先生に喜んでもらえるなら。"
"1002705-53-カリン" = "じゃあ……一応、外に出てもらえる？私と先生の間柄とはいえその、目の前ではちょっと……。"
"1002705-54" = "[s] 一旦カリンの部屋を出る。"
"1002705-55-カリン" = "……どう、かな？"
"1002705-56-カリン" = "な、何だかこう、部屋でこんなことをしていると、変な気分になるな……。"
"1002705-57-カリン" = "その、先生、じっと見てるだけじゃなくて何か……。"
"1002705-58-カリン" = "……ん？"
"1002705-59-カリン" = "今の気持ち……？"
"1002705-60-カリン" = "……ああ、だからもう一度着てもらおうと？"
"1002705-61-カリン" = "ふふっ、確かに……。"
"1002705-62-カリン" = "……うん、やっぱりテンションは昂るな。可愛いし、楽しい。"
"1002705-63-カリン" = "……まあこれは、色々な気持ちが混ざっていると思うけれど。"
