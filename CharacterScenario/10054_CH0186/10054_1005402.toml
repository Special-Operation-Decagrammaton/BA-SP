[translation]
"1005402-1" = "慣れない装い"
"1005402-2" = "トリニティ大聖堂・準備室"
"1005402-3" = "（約束通り、マリーの相談に乗るべくトリニティ大聖堂を訪れた）"
"1005402-4" = "（まだ早い時間だからか、人気はない）"
"1005402-5-？？？" = "せ、先生、ですか……？"
"1005402-6-？？？" = "あっ、ごめんなさい。怪しい者ではありません。#n私です、[ruby=いおち]伊落[/ruby]マリーです。その……少々理由がありまして……。"
"1005402-7" = "[ns1] \"……マリー？\"\n[ns2] \"どこにいるの？\""
"1005402-8-マリー" = "その声……。"
"1005402-9-マリー" = "良かった、先生ですね。"
"1005402-10-マリー" = "少々お待ちください……。"
"1005402-11-マリー" = "こ、こちらです……！#n……おはようございます、先生。"
"1005402-12-マリー" = "急なお願いでしたのに、こんな朝早くからありがとうございます。"
"1005402-13" = "[s3] \"マリー……？\"\n[s4] \"今日はシスター服じゃないんだね。\""
"1005402-14-マリー" = "は、はい。そのことでご相談がありまして……。"
"1005402-15-マリー" = "近いうちに[ruby=こうりんたいさい]晄輪大祭[/ruby]がありますよね。#nそれで、私たちシスターフッドからも何人か参加するのですが……。"
"1005402-16-マリー" = "成り行きで私も参加することになりまして……。"
"1005402-17-マリー" = "その……少々困っているんです。#n私、運動には自信がありませんし……その……"
"1005402-18" = "[s5] \"何か心配事が……？\"\n[s6] \"もしかして、体操着になるのを気にしてたり？\""
"1005402-19-マリー" = "その、えっと……"
"1005402-20-マリー" = "はい、少し……"
"1005402-21-マリー" = "すみません……運動用の格好だと分かっていても、どうしても慣れなくて。"
"1005402-22-マリー" = "こんなに肌が見えてしまうなんて……#n先生の前に立っているだけでも恥ずかしいです……。"
"1005402-23-マリー" = "ベールがないのも相まって、更に落ち着かなくて……。"
"1005402-24-マリー" = "あっ、体操着が悪いとかではないんです！#nただ、どうしても慣れそうになくて……。"
"1005402-25-マリー" = "そもそも私にはこのような格好、似合わないですし……運動ができるわけでもないのに、大運動会に参加するのは間違っているような気もしてしまい……"
"1005402-26-マリー" = "こんな状態の私が参加しては、他の方々の迷惑になってしまいます……。"
"1005402-27-マリー" = "ですから……その……"
"1005402-28-マリー" = "私は晄輪大祭に参加せず、いつものようにシスターの格好で……。"
"1005402-29-マリー" = "助けを必要とする方々の力になったほうが……。"
"1005402-30-マリー" = "と、そんなことを考えていました。#n……ですが、私一人で決める事ではないと思い、先生にご相談したかったのです。"
"1005402-31-マリー" = "……え？"
"1005402-32-マリー" = "よく似合って……ますか？"
"1005402-33-マリー" = "そ、そうでしょうか……。#nありがとうございます……ふふっ。"
"1005402-34-マリー" = "……どうして参加に対して気が引けているのか？ですか……。"
"1005402-35-マリー" = "気が引けているというわけではないのですが……。"
"1005402-36-マリー" = "その……こういった大きなイベントに参加したことがなく……。"
"1005402-37-マリー" = "運動といえば、たまに他のシスターと卓球をするくらいで。"
"1005402-38-マリー" = "そんな時でも、皆さんとてもお上手で、私はいつもあと一歩及ばずに負けてしまうんです……。"
"1005402-39-マリー" = "もちろん皆さんお優しいですし、不慣れな私にも親切に教えてくださって、楽しい時間を過ごしています。"
"1005402-40-マリー" = "ですが、それはあくまで大聖堂の中のお話で……#n他の学園も交えた対抗戦ともなると、怖気づいてしまうんです。"
"1005402-41-マリー" = "……えっ？"
"1005402-42-マリー" = "……シスターと卓球をする時、ですか？"
"1005402-43-マリー" = "体操着はどうも気恥ずかしくて……#n私はいつもシスターの格好で皆さんに混ざっていました。"
"1005402-44-マリー" = "実は……体操着に袖を通したのは今日が初めてなんです。#nこの姿をお見せしたのも……先生だけです。"
"1005402-45" = "[s7] \"シスターの格好で卓球を……？\"\n[s8] \"もしかして、実は運動神経がいいのかも……。\""
"1005402-46-マリー" = "ど、どうでしょう……？"
"1005402-47-マリー" = "……えっ？"
"1005402-48-マリー" = "少しでも興味があるなら、挑戦してみても良い、のですか……？#n本当に、私でも……？"
"1005402-49-マリー" = "で、ですが……この格好は流石に……。"
"1005402-50-マリー" = "……なるほど。#nむしろシスター姿のほうが変に目立つのですか……？"
"1005402-51-マリー" = "一人だけシスターの格好をしている自分を思い浮かべてみましたが……。"
"1005402-52-マリー" = "……たしかに、おっしゃる通りですね。"
"1005402-53-マリー" = "ありがとうございます、先生。#n危うく好奇の目で見られてしまうところでした。"
"1005402-54-マリー" = "今さらですが、学園の体操着は統一されていますし、周囲に溶け込んだほうが目立たずに過ごせそうです。"
"1005402-55-マリー" = "どうしても露出は気になってしまいますが……。"
"1005402-56-マリー" = "……先生に相談したおかげで、気持ちが楽になりました。"
"1005402-57-マリー" = "辞退しようか迷っていましたが、改めて参加する旨をお伝えしてきます。"
"1005402-58-マリー" = "あ……そうだ。"
"1005402-59-マリー" = "先生も……晄輪大祭に参加されますか？"
"1005402-60-マリー" = "……あ、選手として参加するわけではありませんよね。#nうっかりしていました。ふふっ、先生なのですから、当然でしたね。"
"1005402-61-マリー" = "でも、当日は会場にいらっしゃいますよね……？"
"1005402-62-マリー" = "ありがとうございます、先生。#n相談したおかげで、決心がつきました。"
"1005402-63-マリー" = "晄輪大祭……辞退したら後悔するところでした。"
"1005402-64-マリー" = "……ふふっ。#n先生とお話できて良かったです。"
"1005402-65-マリー" = "それでは、また後ほど。#nよろしくお願いいたしますね、先生。"
"1005402-66" = "（その後、なぜかうれしそうなマリーに見送られて、シャーレに戻った）"
