[translation]
"2600015-1" = "私にできること"
"2600015-2" = "（散歩していたところ……）"
"2600015-3-？？？" = "……先生？"
"2600015-4-？？？" = "こんなところでお会いするなんて、奇遇ですね。"
"2600015-5" = "[ns1] \"この声は……チナツ！\"\n[ns2] \"チナツに会えるなんて、ついてるなあ！\""
"2600015-6-チナツ" = "え、ええ……。"
"2600015-7-チナツ" = "お、お元気そうでなによりです……。"
"2600015-8-チナツ" = "モモトークでお話したばかりなのに、偶然お会いできるとは思っておらず。"
"2600015-9-チナツ" = "……あ。"
"2600015-10-チナツ" = "今朝のメッセージは、探りを入れたわけではなくですね……？"
"2600015-11-チナツ" = "……え？"
"2600015-12-チナツ" = "ええ、私もお休みをいただいていますから。"
"2600015-13-チナツ" = "……カバン、ですか？"
"2600015-14-チナツ" = "これのことでしょうか？"
"2600015-15" = "[s3] \"薬品のカバンだよね？\"\n[s4] \"休みの日なのに装備してるんだなって。\""
"2600015-16-チナツ" = "ああ、これは……。"
"2600015-17-チナツ" = "これから救急医学部に顔を出すところなんです。"
"2600015-18-チナツ" = "皆さん、常にお忙しいですから。"
"2600015-19" = "[s5] \"風紀委員会のチナツが……\"\n[s6] \"救急医学部に？\""
"2600015-20-チナツ" = "ええ。私はもともと救急医学部所属だったので。"
"2600015-21-チナツ" = "このカバンは、その頃から使っているものなんです。"
"2600015-22-チナツ" = "部長や他の皆さんと――"
"2600015-23-チナツ" = "……忙しくも充実した日々を過ごしたものです。少々、癖のある方も多かったですが。"
"2600015-24" = "[s7] \"救急医学部……。\"\n[s8] \"結構大変そうだよね。\""
"2600015-25-チナツ" = "ふふっ、大変というほどでは。"
"2600015-26-チナツ" = "仕事の量は、今の方がずっと多いですよ。"
"2600015-27-チナツ" = "……？"
"2600015-28-チナツ" = "私に聞きたいことがあるのですか？"
"2600015-29-チナツ" = "……どのようなご質問でしょう？なんとなく予想はつきますが。"
"2600015-30-チナツ" = "私がお話できる範囲でしたらお気軽に。"
"2600015-31" = "[s9] \"チナツはどうして風紀委員会に入ったの？\"\n[s10] \"転部した理由、聞いてもいい？\""
"2600015-32-チナツ" = "ああ……なるほど。"
"2600015-33-チナツ" = "大丈夫です。答えづらい話ではありませんから。"
"2600015-34-チナツ" = "今までも何度かそういった質問をされてきましたし……。"
"2600015-35-チナツ" = "そうですね……簡単にいえば。"
"2600015-36-チナツ" = "……「誰かがやるべきこと」だったからでしょうか。"
"2600015-37-チナツ" = "「放っておけなかった」という方が近いかもしれません。"
"2600015-38" = "[s11] \"誰かがやるべきこと……？\"\n[s12] \"放っておけなかった……？\""
"2600015-39-チナツ" = "……はい。"
"2600015-40-チナツ" = "風紀委員会と救急医学部は、良好な関係にあります。"
"2600015-41-チナツ" = "ですが、常に同じ現場で活動するわけではありません。"
"2600015-42-チナツ" = "風紀委員会は、所属生徒と取り締まり対象の両方に負傷者が発生します。"
"2600015-43-チナツ" = "その都度、救急医学部は現場に急行しますが……即時対応が難しいこともありました。"
"2600015-44-チナツ" = "――そうして現場に向かう中で、私は気付いたんです。"
"2600015-45-チナツ" = "風紀委員会の中に、医療処置を行える者が必要だと。"
"2600015-46-チナツ" = "ですが部長のお二方は常に多忙で、話し合いの場を設けることも難しく……。"
"2600015-47-チナツ" = "組織再編の話が見送られていく中で――"
"2600015-48-チナツ" = "私は、自分にできることを考えました。"
"2600015-49-チナツ" = "そうして、今の私がいます。……これで、答えになっていますか？"
"2600015-50-チナツ" = "……自分で言うのは少々恥ずかしいですが。"
"2600015-51-チナツ" = "……私が来て以来、風紀委員の前線維持能力が向上した、と委員長から聞きました。"
"2600015-52" = "[ns13] \"……えらいね。\"\n[ns14] \"だからみんな、チナツが大好きなんだ。\""
"2600015-53-チナツ" = "そんなことは……ない……と思うのですが……。"
"2600015-54-チナツ" = "……なので、時間を見つけては救急医学部を訪ねているんです。"
"2600015-55-チナツ" = "……話が長くなってしまいましたね。"
"2600015-56-チナツ" = "先生もせっかくのお休みの日でしたのに。"
"2600015-57-チナツ" = "……？"
"2600015-58-チナツ" = "……えっ。"
"2600015-59-チナツ" = "救急医学部に用事ができた……？"
"2600015-60-チナツ" = "……急に、ですか？"
"2600015-61-チナツ" = "本当でしょうか……？今ご用事を作ったのでは？"
"2600015-62" = "[s] \"どうかな……？\""
"2600015-63" = "[ns] \"私も「放っておけない」ことがあってね。\""
"2600015-64-チナツ" = "……先生も、困った方です。"
"2600015-65-チナツ" = "そう言われると、こちらは何も言えなくなってしまうではないですか……。"
"2600015-66-チナツ" = "……分かりました。人手は多いほど助かります。現場の皆さんも、きっと喜ぶでしょう。"
"2600015-67-チナツ" = "先生には、助けてもらってばかりな気がします。"
"2600015-68-チナツ" = "その代わり、といってはなんですが……。"
"2600015-69-チナツ" = "今回は先生にご助力いただいたことですし……。"
"2600015-70-チナツ" = "次のお休みの日には……先生のお手伝いも兼ねて――"
"2600015-71-チナツ" = "――私が、シャーレに伺いますね。"
"2600015-72" = "（そうして、チナツと救急医学部の仕事を手伝った）"
"2600015-73" = "（彼女たちは、チナツを仲間として暖かく迎えていた……）"
