[translation]
"2600006-1" = "思いがけない"
"2600006-2-チナツ" = "あ、先生。お越しいただきありがとうございます。"
"2600006-3-チナツ" = "すみません、まさかこんなすぐに来ていただけるとは思っておらず、"
"2600006-4-チナツ" = "あまり準備もできていなかったのですが……助かります。"
"2600006-5-チナツ" = "あ、えっと、書類はまた別の部屋にありまして。"
"2600006-6-チナツ" = "それ用の場所、といいますか。"
"2600006-7-チナツ" = "はい、こちらです。"
"2600006-8" = "（その部屋は全体的に綺麗だったけれど、物もそれなりにたくさん置かれている）"
"2600006-9" = "（散らかってると言うよりは、何となく生活感が感じられる部屋だった）"
"2600006-10-チナツ" = "すみません、よく考えるとこんな……あまり掃除の行き届いていない場所に先生をお呼びしてしまうことに……。"
"2600006-11-チナツ" = "書類だけ持って、他の場所に移りましょうか……？"
"2600006-12" = "[s1] \"気にしないで、シャーレは時々もっとすごいから。\"\n[s2] \"これもしかして、チナツの私物……？\""
"2600006-13-チナツ" = "ふふっ、そうですか……ありがとうございます。では、ここで。"
"2600006-14-チナツ" = "あ、はい。そうですね。"
"2600006-15-チナツ" = "こういうことを一緒にしてくれる委員も、あまりいないので……。"
"2600006-16-チナツ" = "自然と、私がひとりでここを使うことが多くなってますね。"
"2600006-17-チナツ" = "仕事を処理するためにここに来たり、泊りがけの時に使ったりもします。"
"2600006-18-チナツ" = "この折り畳みのベッドは、そのための物ですね。"
"2600006-19-チナツ" = "……シャーレに似てる？"
"2600006-20-チナツ" = "ふふっ、そうですね。確かに同じような場所なのかもしれません。"
"2600006-21-チナツ" = "では、えっと……書類はこれです。"
"2600006-22" = "（ドンッッ！！！）"
"2600006-23" = "[ns3] \"……これ全部、一人でやる予定だったの？\"\n[ns4] \"……これ、何年分の書類？\""
"2600006-24-チナツ" = "えっと……はい、そうですね。"
"2600006-25-チナツ" = "結構、いつも通りの量ですが……？"
"2600006-26-チナツ" = "いえ。"
"2600006-27-チナツ" = "先週の、一週間分の書類ですが……？"
"2600006-28-チナツ" = "決裁処理はもう既に委員長がやってくださったので、後はこれらを分類するだけです。"
"2600006-29-チナツ" = "まあお察しの通り面倒ではあるのですが……すみません、お願いできますか？"
"2600006-30" = "[s5] \"ううん、任せて。\"\n[s6] \"こういうのも私の専門分野だから。\""
"2600006-31-チナツ" = "……ありがとうございます。"
"2600006-32-チナツ" = "……ありがとうございます。"
"2600006-33-チナツ" = "実は、心の中では……先生ならそう言ってくださるだろうなと、思ってはいました。"
"2600006-34-チナツ" = "何だかそれも、少し失礼な話なのかもしれませんが……。"
"2600006-35-チナツ" = "どうしようかと思った時に、ふと先生のことを思い浮かべてしまって。"
"2600006-36-チナツ" = "……こほん。すみません、話が逸れました。では、よろしくお願いしますね。先生。"
"2600006-37" = "（量が量だったので、気合を入れて集中モードに入った）"
"2600006-38" = "（ただルールに基づいて分類するだけだったのに、二人がかりでも半日以上経ってしまい……）"
"2600006-39-チナツ" = "……これで、終わりですかね。"
"2600006-40-チナツ" = "ふぅ、いつの間に夜に……。"
"2600006-41-チナツ" = "あ、いえ、"
"2600006-42-チナツ" = "とんでもありません。"
"2600006-43-チナツ" = "むしろ先生がいなかったら、こんな時間では済みませんでしたから。"
"2600006-44-チナツ" = "……？"
"2600006-45-チナツ" = "え、あ、この部屋のことですか……？あ、ありがとうございます。"
"2600006-46-チナツ" = "ポスター……？えっと、はい。それは私の、いわゆる私物、ですが……。"
"2600006-47-チナツ" = "その、もしかして変、ですか……？"
"2600006-48-チナツ" = "あ、そうですか……それは良かったです。"
"2600006-49-チナツ" = "そう言っていただけるのは、嬉しいですね。"
"2600006-50-チナツ" = "先ほどもお話にありましたが、結構この部屋は私物が多くて、実質的にはその……"
"2600006-51-チナツ" = "私の部屋、といいますか……"
"2600006-52-チナツ" = "……。"
"2600006-53" = "[s] \"……？\""
"2600006-54-チナツ" = "……。"
"2600006-55-チナツ" = "（こんな遅い時間に、）"
"2600006-56-チナツ" = "（実質的に「私の部屋」で……）"
"2600006-57-チナツ" = "（先生と、ふたりっきり……？）"
"2600006-58" = "[s] \"どうしたの……？\""
"2600006-59-チナツ" = "あ、えと、その……。"
"2600006-60-チナツ" = "……っ！"
"2600006-61" = "[wa:500]― あ、[wa:950]あまり[wa:750]意識してませんでしたが……。"
"2600006-62" = "― この状況は[wa:1250]その、"
"2600006-63" = "[wa:100]― あまり[wa:700]良くないと言いますか……"
"2600006-64" = "[wa:1450]― あの、[wa:1000]先生……？"
"2600006-65" = "[wa:50]― えっと、[wa:1250]何か言っていただけないと、[wa:2050]その……。"
"2600006-66" = "― あまり[wa:500]沈黙が続くと、"
"2600006-67" = "[wa:100]― かえって変な感じに……。"
"2600006-68" = "[wa:350]― いえ、[wa:600]その[wa:550]催促とかではないのですが……！"
"2600006-69" = "― えっと、[wa:1350]何と言えば良いのでしょうか……。"
"2600006-70" = "― こういう時は、[wa:1150]どうしたら……。"
"2600006-71" = "[ns] \"チナツ、大丈夫？顔赤いけど、もしかして疲れで体調が……？\""
"2600006-72" = "[wa:250]― ……ふぅ。"
"2600006-73" = "― いえ……[wa:1400]大丈夫です、[wa:1500]はい。"
"2600006-74" = "― ふふっ。[wa:1100]本当に、[wa:1300]困ってしまいます……"
"2600006-75" = "― 何なんでしょうね、[wa:1400]これは。"
"2600006-76" = "[wa:1500]― 先生と一緒に[wa:700]いるというだけで、"
"2600006-77" = "[wa:50]― 何故か[wa:500]いつも通りではいられなくて……。"
"2600006-78" = "― 本当に、[wa:1400]困りましたね……"
"2600006-79" = "― 色々と……。"
"2600006-80-チナツ" = "……すみません、先生。"
"2600006-81-チナツ" = "その、勝手に早とちりといいますか、変なことを色々と……。"
"2600006-82-チナツ" = "あ、あまりこういう状況には、なったことが無く……。"
"2600006-83-チナツ" = "……大丈夫、ですか？"
"2600006-84-チナツ" = "……はい、"
"2600006-85-チナツ" = "ありがとうございます。"
"2600006-86-チナツ" = "……。"
"2600006-87" = "[s] \"チナツ？\""
"2600006-88-チナツ" = "あ、いえ、何でもありません。大丈夫です……。"
"2600006-89-チナツ" = "その、私が勝手に先走ってしまっただけですので……"
"2600006-90-チナツ" = "はい。"
"2600006-91-チナツ" = "やっぱり、私だけ……ですよね。"
