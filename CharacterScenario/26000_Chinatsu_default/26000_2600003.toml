[translation]
"2600003-1" = "何でもない一日"
"2600003-2-チナツ" = "……来てくださったんですね、先生。"
"2600003-3-チナツ" = "……ゲームセンターは意外、でしたか？"
"2600003-4-チナツ" = "今までお会いした流れからすると、確かにそう思われるのも当然かもしれませんね。"
"2600003-5-チナツ" = "自分でもちょっと、似合わないかなとも思ったりするのですが……。"
"2600003-6-チナツ" = "もちろん仰る通り、図書館ですとか、保健室ですとか、そういった静かな場所も好きです。"
"2600003-7-チナツ" = "ですが私も、時折羽目を外したい時があると言いますか。"
"2600003-8-チナツ" = "他の方とショッピングに行ったり、ゲームセンターに来ることもあります。"
"2600003-9-チナツ" = "……特に今日のように、"
"2600003-10-チナツ" = "こうして、風紀委員会の仕事から解放された日には。"
"2600003-11" = "[s1] \"休日だもんね。\"\n[s2] \"サボり！？私も好きだよそういうの！\""
"2600003-12-チナツ" = "はい、そうですね。"
"2600003-13-チナツ" = "もちろん風紀委員会そのものがお休みというわけではなく、今日は私個人のお休みの日です。"
"2600003-14-チナツ" = "いえ、その……。"
"2600003-15-チナツ" = "普通に正式なお休みをもらっただけです。"
"2600003-16-チナツ" = "と、とにかく。"
"2600003-17-チナツ" = "久々の普通の休日なので……。"
"2600003-18-チナツ" = "もし先生さえ宜しければ。"
"2600003-19-チナツ" = "どこかでこの前のお返しをしたいというのもありますし、その……。"
"2600003-20-チナツ" = "できれば今日一日、お付き合いいただけたらな、と……。"
"2600003-21-チナツ" = "こういう日じゃないと、その、なかなか時間も作れないですし……。"
"2600003-22-チナツ" = "今さらこうしてお聞きするのも変ですが、ご迷惑ではないですか？"
"2600003-23-チナツ" = "付き合って、いただけますか……？"
"2600003-24" = "[s3] \"うん、私で良ければ喜んで。\"\n[s4] \"……もしかして委員会に、苦手な人とかいる？\""
"2600003-25-チナツ" = "あ、ありがとうございます。いえ、もちろん委員会の方と一緒にいるのが嫌ということではありません。皆さん基本的には良い方ですし。"
"2600003-26-チナツ" = "あ、ありがとうございます。いえ、もちろん委員会の方と一緒にいるのが嫌ということではありません。皆さん基本的には良い方ですし。"
"2600003-27-チナツ" = "ですが、ただ、私もお休みの日は欲しいので。"
"2600003-28-チナツ" = "皆さん悪い方ではないのですが、いつも人の話を聞かないで突っ走る方ばかりですし……。"
"2600003-29-チナツ" = "隣にいる誰かが無理しないように見守るのは、それだけでかなり疲れることですから。"
"2600003-30-チナツ" = "……すみません、愚痴のようになってしまいました。"
"2600003-31-チナツ" = "もちろん先生は、そういったことも私よりずっと経験済みでご存知かと思います。"
"2600003-32-チナツ" = "なので、えっと……すみません、また長くなってしまいましたが……何が言いたいかというと……。"
"2600003-33" = "[s5] \"じゃあ、今日はエスコートさせてもらおうかな。\"\n[s6] \"今日一日付き合いますよ、お嬢様。\""
"2600003-34-チナツ" = "……！？"
"2600003-35-チナツ" = "……！？"
"2600003-36-チナツ" = "……え、その……。"
"2600003-37-チナツ" = "……ふう。"
"2600003-38-チナツ" = "はい、分かりました。よろしくお願いします。"
"2600003-39-チナツ" = "ふざけているのか、本心なのかは私には分かりませんが……。"
"2600003-40-チナツ" = "……。"
"2600003-41-チナツ" = "ですが、先生がそう言ってくださるのであれば。"
"2600003-42-チナツ" = "それではあらためてよろしくお願いします。それから、ありがとうございます。"
"2600003-43-チナツ" = "……本当に、ありがとうございます。"
"2600003-44" = "（そう言いながらチナツがいきなりこちらの手を繋いで、軽快に歩き始めた）"
"2600003-45" = "（ゲームセンタ―で遊んで、カフェでお茶をして、道端でヒップホップのパフォーマンスに足を止めて……）"
"2600003-46" = "（最後にはショッピングと、休日らしい出来事を積み重ねて）"
"2600003-47" = "（そうやって何事もなく時間が過ぎていく）"
"2600003-48" = "（……それは本当に、これと言って大した出来事も無い）"
"2600003-49" = "（ごくごく普通の一日だった）"
"2600003-50" = "（夕暮れ時になって、前を歩いていたチナツが急に足を止めた）"
"2600003-51-チナツ" = "これで終わりです、予定していた場所には全て行くことが出来ました。"
"2600003-52-チナツ" = "い、いかがでしたか……？私はすごく楽しかったのですが……。"
"2600003-53-チナツ" = "先生は、その……。"
"2600003-54" = "[s7] \"楽しかったよ、休日らしい休日を過ごせて。\"\n[s8] \"特別な一日になったよ、チナツと一緒だったから。\""
"2600003-55-チナツ" = "……。"
"2600003-56-チナツ" = "……。"
"2600003-57-チナツ" = "先生は、すぐそうやって……。"
"2600003-58-チナツ" = "ですが……はい、でしたら良かったです。"
"2600003-59-チナツ" = "心配だったんです、これまでこうして誰かと二人で過ごしたことは無かったので……。"
"2600003-60-チナツ" = "も、もしよかったら、その……。"
"2600003-61-チナツ" = "これからも、時々で良いので……。"
"2600003-62-チナツ" = "……えっと。"
"2600003-63-チナツ" = "も、もちろん先生がよろしければの話です！無理にとは言いませんので……！"
"2600003-64-チナツ" = "……。"
"2600003-65-チナツ" = "……ふふっ。"
"2600003-66-チナツ" = "不思議な方ですね、先生は。"
"2600003-67-チナツ" = "本当に良いんですか？こうやってまた……。"
"2600003-68" = "[s] \"もちろん。\""
"2600003-69-チナツ" = "……。"
"2600003-70-チナツ" = "……はい、ありがとうございます。"
"2600003-71-チナツ" = "では先生、これからもよろしくお願いします。"
"2600003-72-チナツ" = "もちろんそんな頻繁にというわけにはいかなそうですが……風紀委員会の休日も、そう多くはないので。"
"2600003-73-チナツ" = "……。"
"2600003-74-チナツ" = "今はこんな風にしか言うことができませんが。"
"2600003-75-チナツ" = "今私がどんな気持ちでいるのか、もしかして先生は……。"
"2600003-76-チナツ" = "……。"
"2600003-77-チナツ" = "……いいえ、やはり何でもありません。"
"2600003-78-チナツ" = "……大丈夫です。"
"2600003-79-チナツ" = "……今はゆっくり、時間を重ねていきたいと思います。"
"2600003-80" = "（そうやって今日一番の笑顔を見せてくれたチナツを見送って、シャーレへと戻った）"
