[translation]
"2002503-1" = "季節感"
"2002503-2" = "（近所の商店街に出ると、ハルカが周りを見回していた）"
"2002503-3" = "（……前に一度見た、丈の短い着物を着ている）"
"2002503-4" = "[ns1] \"ハルカ！\"\n[ns2] \"こっちだよ！\""
"2002503-5-ハルカ" = "……あ！せ、先生……！！"
"2002503-6-ハルカ" = "……あ！せ、先生……！！"
"2002503-7-ハルカ" = "す、すみません！すぐ近くにいらっしゃったのに、#n見つけられずにいたなんて……！！"
"2002503-8-ハルカ" = "……え？"
"2002503-9-ハルカ" = "わ、分かりました……ついて行きます……。"
"2002503-10-ハルカ" = "せ、先生……？どうしてこんなところに……。"
"2002503-11-ハルカ" = "寒そうだから暖かい場所に来た……？"
"2002503-12-ハルカ" = "そ、そんな……私なんかのために、そうしていただく必要は……。"
"2002503-13-ハルカ" = "……は、はい？何でしょう？"
"2002503-14" = "[s3] \"えっと……その着物のこと、聞いてもいい？\"\n[s4] \"選んだ理由とか、あったりするの？\""
"2002503-15-ハルカ" = "あ……えっと……こ、これは……。"
"2002503-16-ハルカ" = "あ……えっと……こ、これは……。"
"2002503-17-ハルカ" = "と、特別な理由があるわけではないのですが……。#nただ……これが、一番……。"
"2002503-18-ハルカ" = "値段が……安くて……。"
"2002503-19" = "[s5] \"……なるほど……。\"\n[s6] \"それで丈の短い着物を……。\""
"2002503-20-ハルカ" = "や、やっぱりそうですよね……！どんなに安くても、#n私なんかにこんな綺麗な着物は似合わないですよね……！？"
"2002503-21-ハルカ" = "や、やっぱりそうですよね……！どんなに安くても、#n私なんかにこんな綺麗な着物は似合わないですよね……！？"
"2002503-22-ハルカ" = "本当は買わないつもりだったのですが、事務所の中で私だけ普通の服だったら、浮いてしまいますから……迷惑をかけてしまうのでは、と思いまして……！"
"2002503-23-ハルカ" = "それで、みんなに合わせて買ったはいいものの……#nやはり身の程知らずのような気がして……。"
"2002503-24-ハルカ" = "すみませんすみませんすみません……！！"
"2002503-25-ハルカ" = "……え？"
"2002503-26-ハルカ" = "では、どうして着物の話を……？"
"2002503-27" = "[s7] \"それも似合ってるけど、冬らしい着物も見てみたいな。\"\n[s8] \"お金は大丈夫だから、一緒に新しい着物を買いに行かない？\""
"2002503-28-ハルカ" = "あ……は、はい……。"
"2002503-29-ハルカ" = "あ……は、はい……。"
"2002503-30-ハルカ" = "……はい？"
"2002503-31-ハルカ" = "え……先生……？今、何と……？"
"2002503-32-ハルカ" = "…………。"
"2002503-33-ハルカ" = "いえいえいえいえいえいえいえいえいえいえいえいえいえ！！！"
"2002503-34-ハルカ" = "い、いいいい、いけません！私なんかに先生の貴重なお金を使うなんて！#n絶対に……そんなこと……起きてはいけません……っ！！"
"2002503-35-ハルカ" = "もしそうなったら……服にホコリが一つ付くたび#n死んでお詫びするしか……！！"
"2002503-36-ハルカ" = "ほ、本当に大丈夫です！なのでどうか……#nどうか考え直してください……！！"
"2002503-37" = "[s9] \"そ、そこまで……？\"\n[s10]（余計に気を遣わせちゃったかな……）"
"2002503-38-ハルカ" = "そ、それに、この服にも長所があるんですよ！#n動きやすいですし、値段の割に見た目もいいですし……"
"2002503-39-ハルカ" = "そ、それに、この服にも長所があるんですよ！#n動きやすいですし、値段の割に見た目もいいですし……"
"2002503-40-ハルカ" = "な、なによりこの服のおかげで、先生とここに来られましたから……！"
"2002503-41-ハルカ" = "……！！い、いいいいい、今のはナシです！！#n理由をつけようとしたら、ちょっと口が滑っただけで……！！"
"2002503-42-ハルカ" = "あ、いえ、決して適当なことを言おうとしたわけではなく……！#nうぅ……な、なんて言えばいいんでしょう……。"
"2002503-43-ハルカ" = "えっと……！"
"2002503-44-ハルカ" = "だ、だから……！！"
"2002503-45-ハルカ" = "…………。"
"2002503-46-ハルカ" = "――やっぱり死にます！！！"
"2002503-47" = "（その後、ハルカを落ち着かせてから、着物の代わりにカフェのスイーツを買ってあげた）"
"2002503-48-ハルカ" = "す、すみません……私のせいで……。"
"2002503-49-ハルカ" = "……え？で、でもあんなに騒いでしまったのに……。#nしかも、お金も先生がすべて払ってくださって……。"
"2002503-50-ハルカ" = "……はい？"
"2002503-51-ハルカ" = "約束……ですか？い、一体どんな……？"
"2002503-52-ハルカ" = "い、いえ、もちろん内容が何であれ、#n先生が仰るなら私は命がけで守りますが……。"
"2002503-53" = "[s11] \"その着物を着るときは、あまり無理をしないで。\"\n[s12] \"風邪を引きそうになったら、暖かい場所に行くこと。\""
"2002503-54-ハルカ" = "……え、っと……どうしてそのような約束を……？"
"2002503-55-ハルカ" = "……え、っと……どうしてそのような約束を……？"
"2002503-56-ハルカ" = "で、でも……はい、分かりました！必ず守ります！#n他ならぬ先生との約束ですから！！"
"2002503-57-ハルカ" = "……こ、これで大丈夫……でしょうか……？"
"2002503-58-ハルカ" = "せ、先生が満足ならいいんですが……うぅん……。"
"2002503-59" = "[s13] \"……？\"\n[s14] \"気になることがあるなら言ってね？\""
"2002503-60-ハルカ" = "あ、いえ！そんなことはありません！！"
"2002503-61-ハルカ" = "あ、いえ！そんなことはありません！！"
"2002503-62-ハルカ" = "先生が間違っているなんて……"
"2002503-63-ハルカ" = "そんなの絶対にあり得ませんから！"
"2002503-64-ハルカ" = "違うと言うやつらは、私が全員消し飛ばします！！"
"2002503-65-ハルカ" = "…………。"
"2002503-66-ハルカ" = "……へ……。へへ……。"
"2002503-67" = "（その後、ハルカにカイロを買ってあげた後、シャーレに戻った）"
