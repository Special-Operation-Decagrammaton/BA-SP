[translation]
"1005305-1" = "理性的な応援文化"
"1005305-2" = "シャーレ・休憩室"
"1005305-3-ユウカ" = "こんにちは、先生。[ruby=こうりんたいさい]晄輪大祭[/ruby]の件なんですが……。"
"1005305-4-ユウカ" = "当日の人員配置やスケジュールなど、色々ご相談したくて……。"
"1005305-5" = "あっ、休憩中なのに、お邪魔してすみません。"
"1005305-6" = "[s] \"いや、そろそろ仕事に戻ろうと思ってたから大丈夫だよ。\""
"1005305-7-ユウカ" = "それでしたら、こちらの書類なんですが……。"
"1005305-8-ユウカ" = "あれ？何を見てるんですか？"
"1005305-9-中継キャスター" = "「……続いて、ミレニアムのバッターは……」"
"1005305-10-ユウカ" = "ミレニアム野球部の中継……。"
"1005305-11-ユウカ" = "そういえば今日は地区予選でしたね。"
"1005305-12" = "[s] \"野球のインターハイは、晄輪大祭と関係ないの？\""
"1005305-13-ユウカ" = "はい。野球は人気ですし、単独開催でも多くの人が集まりますから。"
"1005305-14-ユウカ" = "色々な競技をまとめて行う晄輪大祭とは違い、野球は学校選抜で大会が開催されます。"
"1005305-15-ユウカ" = "ただ、以前もお話しましたが、ミレニアムの野球部は地区予選止まりの弱小チームなので……。"
"1005305-16-ユウカ" = "わざわざ日程や選手をチェックしたり、球場まで行くことはありません。"
"1005305-17" = "[ns1] \"ごめんね、もうちょっとかかりそう……。\"\n[ns2] \"悪いけど、ちょっと待っててもらえる？\""
"1005305-18-ユウカ" = "はい、大丈夫です。"
"1005305-19-ユウカ" = "はい、大丈夫です。"
"1005305-20-ユウカ" = "せっかくですし、中継でも見ながら待ってますね。"
"1005305-21" = "（しばらくして……)"
"1005305-22-中継キャスター" = "「続くミレニアムのバッター……二球で追い込まれて……三球三振！」"
"1005305-23-中継キャスター" = "「ツーストライクからピッチャー……落とした、大きなスイングで空振り三振！」"
"1005305-24-ユウカ" = "……くっ。"
"1005305-25" = "[s] \"どうしたの？\""
"1005305-26-ユウカ" = "い、いえっ。#n何でもないですから……あはは。"
"1005305-27-ユウカ" = "気にしないでください。"
"1005305-28-中継キャスター" = "「5回裏の攻撃、ミレニアムはワンナウトからランナーが出ましたね」"
"1005305-29-中継キャスター" = "「おっと！今度は初球から打ったが……」"
"1005305-30-ユウカ" = "……！！"
"1005305-31-中継キャスター" = "「これは……三遊間、詰まってショート！ゲッツーコースだ！」"
"1005305-32-ユウカ" = "ちょっと、どこ打ってるの……！"
"1005305-33" = "[s] \"呼んだ？\""
"1005305-34-ユウカ" = "あ、すみません。#n何でもありませんから。"
"1005305-35" = "[s3] \"いいよ、続けて続けて。\"\n[s4] \"試合に集中してたら、そういう時もあるよね。\""
"1005305-36-ユウカ" = "ち、違います！"
"1005305-37-ユウカ" = "ち、違います！"
"1005305-38-ユウカ" = "結果に一喜一憂して声を上げるなんて、観客の正しい姿とは言えません！"
"1005305-39-ユウカ" = "スポーツは勝ち負けにこだわらず、純粋に選手たちを応援してこそ、健全に楽しめるんです。"
"1005305-40-ユウカ" = "もちろん、応援しているチームが負けたら落ち込みますけど……#n「勝敗は兵家の常」とも言いますし。"
"1005305-41" = "[s] \"ユウカがそう言うなら、いいんだけど……。\""
"1005305-42-ユウカ" = "どうしてロクにヒットも打てないの……？"
"1005305-43-ユウカ" = "狙い球くらい絞りなさいよ……！"
"1005305-44-中継キャスター" = "「ミレニアムサイエンススクール、七回裏の攻撃で逆転のランナーが出塁しましたが……フルカウント……さあ、どうなる？」"
"1005305-45-ユウカ" = "うぅ……今度こそ……。"
"1005305-46-中継キャスター" = "「八球目……ストレート、打ったぞ！」"
"1005305-47-中継キャスター" = "「いい当たりだ、風もある！どうだ……センター見送った！」"
"1005305-48-ユウカ" = "やった！ホームラン！"
"1005305-49-ユウカ" = "先生、見ましたか！？#nミレニアムがホームランを打ちました！一発逆転です！"
"1005305-50-ユウカ" = "あんな剛速球、普通は目で追えませんよ。#nなのにそれを打ち返しちゃうなんて！"
"1005305-51-ユウカ" = "流石はミレニアムの野球部！やると思ってましたから！"
"1005305-52-ユウカ" = "さっ、先生も一緒に！#nかっ飛ばせ～ミレニアム！"
"1005305-53" = "[ns] \"あの……ユウカ、さん？\""
"1005305-54" = "[ns] \"ちょっと、近いなって。\""
"1005305-55-ユウカ" = "……っ。"
"1005305-56-ユウカ" = "そ、その、これは……。"
"1005305-57-ユウカ" = "つい夢中になっちゃっただけで……。"
"1005305-58-ユウカ" = "あの、誤解しないでください！普段はこんなに興奮しませんから！"
"1005305-59-ユウカ" = "ちょ、ちょっと……！なんで笑うんですか！"
"1005305-60-ユウカ" = "本当に誤解ですからね、先生！"
"1005305-61" = "（その後、しばらく慌てるユウカを落ち着かせて、一緒に中継を見た)"
"1005305-62" = "（……ミレニアム野球部はリードを守りきり、試合に勝利した）"
