[translation]
"1005306-1" = "スポーツカード"
"1005306-2" = "シャーレ・オフィス"
"1005306-3-ユウカ" = "先日ご連絡した業務協力報告書を……"
"1005306-4-ユウカ" = "あれ、留守かな？"
"1005306-5-ユウカ" = "こんなに机を散らかしたまんま、一体どこに……。"
"1005306-6-ユウカ" = "ふふっ。先生は私がいないとダメなんだから……。"
"1005306-7-ユウカ" = "あれ？これ……。"
"1005306-8-ユウカ" = "私の写真！？"
"1005306-9-ユウカ" = "い、いつの間に撮られて……#nそれより、どうして先生が私の写真を……？"
"1005306-10-ユウカ" = "もしかして、いつでも私の姿を見られるように、こっそり撮ったのかな……。"
"1005306-11-ユウカ" = "もう……言ってくれたら、写真くらい何枚でも送るのに。"
"1005306-12-ユウカ" = "で、でも……よりによって、こんな汗だくになってる競技中の写真だなんて……。"
"1005306-13-ユウカ" = "なんだかちょっと不健全なような……。"
"1005306-14" = "[ns] \"来てたんだね、ユウカ。\""
"1005306-15-ユウカ" = "あっ、先生いらっしゃったんですね！？"
"1005306-16" = "[s1] \"ううん、ちょっと備品の確認をしてただけだよ。\"\n[s2] \"それより、その手に持ってるのは……？\""
"1005306-17-ユウカ" = "こ、これは、その……。"
"1005306-18-ユウカ" = "こ、これは、その……。"
"1005306-19-ユウカ" = "って、むしろ聞きたいのは私の方です！#n何ですか、この写真！"
"1005306-20-ユウカ" = "全ての生徒を公正に指導すべき立場の先生が、こっそり特定の生徒の写真を持ってるだなんて……。"
"1005306-21-ユウカ" = "ふ、不健全です！"
"1005306-22" = "[s3] \"あ、そのスポーツカードのこと？\"\n[s4] \"クロノススクールの生徒からもらったんだ。\""
"1005306-23-ユウカ" = "……スポーツカード、ですか？"
"1005306-24-ユウカ" = "……スポーツカード、ですか？"
"1005306-25-ユウカ" = "……なるほど。晄輪大祭に参加した生徒たちの写真がトレーディングカードとして流通しているのですね。"
"1005306-26-ユウカ" = "こういったカードを集めるマニアもいることは知っていましたが……#nまさか私まで撮られているなんて……。"
"1005306-27-ユウカ" = "たしかに晄輪大祭中に撮影された写真は、クロノススクールに使用許可を出しましたけど、こんな商売をするだなんて、思いもしませんでした。"
"1005306-28-ユウカ" = "こうなることが分かっていたら、もっと細かく契約書を詰めたんですが……。"
"1005306-29" = "[s5] \"許可の範囲内なら、いいんじゃないかな？\"\n[s6] \"この写真、可愛く撮れてるね。\""
"1005306-30-ユウカ" = "しかし……不思議ですね。#nこんなカードが、とんでもない高値で取引される事もあるのだそうです。"
"1005306-31-ユウカ" = "そ、そんな風に言われても……。"
"1005306-32-ユウカ" = "しかし……不思議ですね。#nこんなカードが、とんでもない高値で取引される事もあるのだそうです。"
"1005306-33-ユウカ" = "会計業務に携わっていると、コレクター品の価値を耳にすることもありますが…………コレクターの世界を理解するのは難しそうです。"
"1005306-34-ユウカ" = "前に耳にしたのですが、こういったカードは本人の活躍次第で価値が変わるのだとか……。"
"1005306-35-ユウカ" = "ふふっ、いつか私のカードも高値で取引されたりして。"
"1005306-36-ユウカ" = "今はただの会計に過ぎませんが、一生懸命頑張れば、ミレニアムの生徒会長になる日が来るかもしれませんから。"
"1005306-37-ユウカ" = "そうだ先生、直筆サイン入りなら、さらに高値が付くんですよね。"
"1005306-38-ユウカ" = "今なら特別に、サインしましょうか？"
"1005306-39" = "[ns] \"そうだね。\""
"1005306-40" = "[ns] \"でも、このカードが高値で取引されることはないよ。\""
"1005306-41-ユウカ" = "……どうしてですか？"
"1005306-42-ユウカ" = "もしかして先生は、私なんかに生徒会長が務まるはずはないと……。"
"1005306-43" = "[ns] \"違うよ、ユウカ。\""
"1005306-44" = "[ns] \"このカードは、私が一生大切にするから。\""
"1005306-45-ユウカ" = "……やっぱり、不健全です。"
