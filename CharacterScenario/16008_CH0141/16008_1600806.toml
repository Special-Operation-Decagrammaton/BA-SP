[translation]
"1600806-1" = "怠けがちな警察官の親切"
"1600806-2" = "（せっかくヴァルキューレ警察学校に来ていたので、フブキの様子を見に生活安全局の事務所を訪れた）"
"1600806-3" = "ヴァルキューレ警察学校・生活安全局"
"1600806-4-フブキ" = "だーから、それはうちらの仕事じゃなくって……。"
"1600806-5-フブキ" = "でも、困ったことがあったら生活安全局にって言われたし……。"
"1600806-6-フブキ" = "本当にすっごく困ってるの！"
"1600806-7-フブキ" = "そうは言われても、こういう問題はちょっと……。"
"1600806-8-フブキ" = "お願い、あのヘアピンは世界に一つだけの大切な……"
"1600806-9-フブキ" = "おばあちゃんが誕生日に作ってくれた、大事なヘアピンなの……！"
"1600806-10-フブキ" = "……忘れ物の管理とかは生活安全局の仕事だけど、わざわざ落とし物を探すのは別の話。"
"1600806-11-フブキ" = "気が付いたのは、いつなんだっけ？"
"1600806-12-フブキ" = "家を出る時は、ちゃんと付けてたのに……学校に着いたら、いつの間に……。"
"1600806-13-フブキ" = "通学路のどこか、かも……？"
"1600806-14-フブキ" = "……事情は分かったけど、どこで失くしたのかも微妙だとすると、そのためにむやみやたらに動くなんてのはできないよ。"
"1600806-15-フブキ" = "いくら生活安全局でも、人員リソースに限界はある。"
"1600806-16-フブキ" = "嘘つき！生活安全局の生徒はやることが無くて、毎日昼寝ばっかりだって知ってるもん！"
"1600806-17-フブキ" = "それなのに、私のヘアピンを探す時間は無いなんて……ひどい！"
"1600806-18-フブキ" = "まあ、昼寝については否定はしないけど。緊急出動に備える意味でも、事務所を長い時間留守にはできないの。"
"1600806-19-フブキ" = "……とりあえずそんな感じの遺失物が届いたら連絡するから、連絡先でも残しておいてくれる？"
"1600806-20-幼い少女" = "……警察のお姉ちゃんのバカっ！"
"1600806-21-フブキ" = "……あーあ、また怒られた。"
"1600806-22-フブキ" = "……って、先生？い、いつから見てた……？"
"1600806-23" = "[s] \"ごめん、結構最初の方から。\""
"1600806-24-フブキ" = "そっか、何だか恥ずかしいところ見られたな……。"
"1600806-25-フブキ" = "まあ気にしないで。ああいうのはよくあることだから。"
"1600806-26-フブキ" = "忘れ物を探してだとか、ドアの鍵を開けてだとか、ペットを探してだとか……全部対応してたらキリがない。"
"1600806-27" = "[s] \"ヘアピンを探してあげることはできないの？\""
"1600806-28-フブキ" = "……せめて場所が特定できてるなら良いけど、あの子の通学路は結構な距離がある。"
"1600806-29-フブキ" = "その道を隅々まで探すとなると、一日あっても多分足りない。"
"1600806-30-フブキ" = "一回依頼を聞いちゃえば、それを知った誰かさんから「私のはどうして」って言われることになるかもしれない。それで忙しくなって大事なことに対応できなきゃ本末転倒。だから基本的には、断るしかない。"
"1600806-31" = "[s1] \"それはまあ、そうなんだろうね……。\"\n[s2] \"フブキは冷静だね。\""
"1600806-32-フブキ" = "……あー。"
"1600806-33-フブキ" = "もちろん、私だってこれでもプロの警察だから。些細な感情に揺らいでられないの。"
"1600806-34-フブキ" = "……あー。"
"1600806-35-フブキ" = "そういえば先生、ちょっとドーナッツが切れててさ。"
"1600806-36-フブキ" = "悪いんだけど買ってくるまでの間、留守番しててくれる？次の交代の時間までには戻るからさ、お願い。"
"1600806-37" = "[s] \"全然良いんだけど、緊急出動に備えるのは？\""
"1600806-38-フブキ" = "ま、まあそっちはキリノとかが……。"
"1600806-39-フブキ" = "それに生活安全局の仕事より、ドーナッツの方が大事！"
"1600806-40-フブキ" = "とにかく、早めに戻るからさ。じゃ、よろしく。"
"1600806-41" = "しかしその後、フブキは交代の時間が過ぎても戻ってこなかった……。"
"1600806-42" = "[ns] フブキを探しに行く。"
"1600806-43" = "D.U.中央区・公立小学校付近"
"1600806-44" = "通学路の茂みの中で、探し物をしてるフブキを見つけた。"
"1600806-45-フブキ" = "……ちっ、栓抜きか。"
"1600806-46-フブキ" = "これでもないし……。"
"1600806-47" = "[s] \"フブキ。\""
"1600806-48-フブキ" = "んー……え、先生！？ど、どうしてここに……！？"
"1600806-49-フブキ" = "え、時間？"
"1600806-50-フブキ" = "あー……ごめんごめん、今日はやたら列が長くってさあ。"
"1600806-51-フブキ" = "これはえっと……帰り道に、ドーナッツを落としちゃって。"
"1600806-52-フブキ" = "やっぱ丸いから転がるんだよね、確かこの辺に行ったと思うんだけど……。"
"1600806-53" = "[s] \"……じゃあ、手伝おうか？\""
"1600806-54-フブキ" = "いや、先生に手伝ってもらわなくても、ほらその……！"
"1600806-55-フブキ" = "……ふふっ、やっぱ先生は騙せなかったか。"
"1600806-56-フブキ" = "……原則的にはダメなんだよ。でもあんな表情を見て、心が動かないと言ったらそれは嘘。"
"1600806-57-フブキ" = "ま、毎回全部は無理だけどさ……あんな気分でドーナッツを食べたところで、美味しくないし。"
"1600806-58-フブキ" = "だからこれは、美味しいドーナッツを食べるためにサボってるだけ。そういうことだから。"
"1600806-59" = "[s] \"うん、だから手伝うよ。\""
"1600806-60-フブキ" = "……。"
"1600806-61" = "[s] \"私も、美味しいドーナッツが食べたいから。\""
"1600806-62-フブキ" = "……ならしょうがない。面倒だけど、背に腹は代えられないってね。"
"1600806-63-フブキ" = "じゃあ先生は、そっちの方をよろしく。こっちは私がやるから。"
"1600806-64" = "（数分後……）"
"1600806-65-フブキ" = "あった、ヘアピンだ！"
"1600806-66-フブキ" = "良かった……ありがとね。"
"1600806-67-フブキ" = "じゃ、「偶然忘れ物として届いた」ってことで。"
"1600806-68" = "[s] \"見つけてあげたって言っても良いと思うよ？\""
"1600806-69-フブキ" = "だってめんどくさいじゃん……。"
"1600806-70-フブキ" = "そんなことバレたら、またどっかからめんどくさい案件が持ち込まれるに決まってるし。そんなの絶対嫌。"
"1600806-71-フブキ" = "私はただ、ドーナッツが美味しく食べられればそれで。"
"1600806-72" = "[s] \"そっか。じゃあ、今からドーナッツ買いに行く？\""
"1600806-73-フブキ" = "だね。あ、もしかして先生が奢ってくれたりする？"
"1600806-74" = "[s3] \"もちろん。\"\n[s4] \"一生懸命頑張ったからね。\""
"1600806-75-フブキ" = "じゃあ、「マスタードーナッツ」のグレーズド・ドーナッツで！"
"1600806-76-フブキ" = "じゃあ、「マスタードーナッツ」のグレーズド・ドーナッツで！"
"1600806-77-フブキ" = "いつ食べても勿論美味しいものだけど、今日は面倒なことが片付いた上に先生の奢り……いやぁ、これは相当美味しいだろうなー！"
"1600806-78" = "ヘアピンを持ち主の女の子に返してから、フブキと一緒にドーナッツを美味しく食べた。"
