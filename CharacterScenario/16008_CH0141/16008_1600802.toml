[translation]
"1600802-1" = "怠けがちな警察官の発想"
"1600802-2" = "フブキのモモトークの件が気になり、生活安全局を訪れた。"
"1600802-3" = "ヴァルキューレ警察学校・生活安全局"
"1600802-4" = "いやぁ、悪いねぇ……。"
"1600802-5" = "こんなにたくさんドーナッツ貰っても良いわけ……？"
"1600802-6" = "生活安全局、最高ー……。"
"1600802-7" = "[s] フブキの肩を揺らして起こす。"
"1600802-8" = "んー……？"
"1600802-9" = "あれ……先生？"
"1600802-10" = "せっかく気持ち良く昼寝してたのに……。"
"1600802-11-フブキ" = "で、今日はどうして急に生活安全局に？"
"1600802-12-フブキ" = "めんどくさい案件ならキリノか、別の局にお願い。私は昼寝で忙しいから。"
"1600802-13" = "[s1] \"「昼寝で忙しい」とは……？\"\n[s2] \"さっきのモモトークの件について聞きたくって……。\""
"1600802-14-フブキ" = "モモトーク？今日先生には送ってなくない？"
"1600802-15-フブキ" = "モモトーク？今日先生には送ってなくない？"
"1600802-16-フブキ" = "……あ、もしかして。"
"1600802-17-フブキ" = "……あー、マクロの誤作動だこれ。"
"1600802-18-フブキ" = "ごめんごめん。ヴァルキューレ内部での定期連絡が、間違って先生の方に飛んでたみたい。特に何も無いから気にしないで。"
"1600802-19" = "[s] \"マクロ……？\""
"1600802-20-フブキ" = "うん。ミレニアムで買ったプログラムをちょいちょいっといじって、私の代わりに働いてくれるようにしておいたの。"
"1600802-21-フブキ" = "これをONにしておくだけで、どんな苦情が来ても自動で処理してくれるわけ。"
"1600802-22-フブキ" = "例えば……"
"1600802-23" = "「フブキ、明日の午前中にある定例会議忘れてないよね？遅れちゃダメだよ！」"
"1600802-24-フブキのマクロ" = "「うん、それは分かってるから心配しないで」"
"1600802-25" = "「フブキ、先週のパトロールの記録って手元にある？報告書を書かなきゃなのに、ちょっと見つからなくって……」"
"1600802-26-フブキのマクロ" = "「それは私にも分からないけど……とりあえず一度、警備局に問い合わせてみたら？」"
"1600802-27-フブキ" = "……こんな感じで！"
"1600802-28-フブキ" = "まあ雑なアルゴリズムではあるけど、この程度のレベルでもほとんどの場合はバレないんだよね。これまでも良い感じに他の部署に押し付けられてるし。"
"1600802-29-フブキ" = "それで私はその間、もっと生産的なことができると。"
"1600802-30-フブキ" = "昼寝とか、おやつとかね。"
"1600802-31" = "[s3] \"……これ、色々と大丈夫なの？\"\n[s4] \"本当に大変なことが舞い込んだ時とかは……？\""
"1600802-32-フブキ" = "大丈夫大丈夫、そもそも生活安全局に「本当に大変なこと」なんてほとんど来ないから。"
"1600802-33-フブキ" = "大丈夫大丈夫、そもそも生活安全局に「本当に大変なこと」なんてほとんど来ないから。"
"1600802-34-フブキ" = "大抵はオウム返しで済むような、めんどくさい苦情ばっかだよ。"
"1600802-35-フブキ" = "まあたとえマクロじゃ処理できないような面倒なことが回ってきても、キリノとかが良い感じにしてくれるはずだし。"
"1600802-36" = "[s] \"うーん……\""
"1600802-37-フブキ" = "ふぁ……まだ寝足りない……。"
"1600802-38-フブキ" = "じゃあ先生、私は本格的に昼寝するから。その間マクロがちゃんと作動してるか見守っててくれると助かるな。"
"1600802-39-フブキ" = "おやすみー。"
"1600802-40" = "その後……"
"1600802-41-警備局の幹部生徒" = "フブキ、こちら警備局。今勤務中だよな？"
"1600802-42-フブキのマクロ" = "「うん、それは分かってるから心配しないで」"
"1600802-43-フブキのマクロ" = "「じゃあ、頑張って働くとしよう」"
"1600802-44-警備局の幹部生徒" = "……何だその態度は。"
"1600802-45-警備局の幹部生徒" = "それに、あんたがいつ頑張って働いたって……？"
"1600802-46-フブキのマクロ" = "それは私にも分からないけど……"
"1600802-47-警備局の幹部生徒" = "自分で言うな！そこは反論するところだろ！？"
"1600802-48-警備局の幹部生徒" = "……まあ良い。今さら生活安全局相手に真面目に怒ったところで、こっちが損するだけだって分かってるからな。"
"1600802-49-警備局の幹部生徒" = "今回連絡した件だけど、以前生活安全局に貸したバリケードについての話。あれはいつ返してくれる予定だ？"
"1600802-50-警備局の幹部生徒" = "しばらく返却が無いせいで、警備局でも困ってるんだ。"
"1600802-51-フブキのマクロ" = "とりあえず一度、警備局に問い合わせてみたら？"
"1600802-52-警備局の幹部生徒" = "……私たちがその警備局だが！？"
"1600802-53-警備局の幹部生徒" = "もしかして、私はバカにされてるのか……？"
"1600802-54-フブキのマクロ" = "うん、私もそう思う"
"1600802-55-警備局の幹部生徒" = "……。"
"1600802-56-警備局の幹部生徒" = "……よく分かった。"
"1600802-57-警備局の幹部生徒" = "今すぐ生活安全局に向かう。そこで待ってろフブキ！"
"1600802-58-フブキ" = "……？何か大きな音がしたような……。"
"1600802-59-フブキ" = "先生、私が寝てる間に何かあった？"
"1600802-60" = "[s5] ゆっくり視線を逸らす。\n[s6] \"自分のことはちゃんと自分でやろうね……。\""
"1600802-61-フブキ" = "え、え？どういうこと？まさか本当に何か大きな問題でも起こった？"
"1600802-62-フブキ" = "え、え？どういうこと？まさか本当に何か大きな問題でも起こった？"
"1600802-63-フブキ" = "先生？先生！？"
"1600802-64" = "その後フブキは生活安全局に来た警備局の幹部に派手に怒られ、大量の始末書を書くこととなった……。"
