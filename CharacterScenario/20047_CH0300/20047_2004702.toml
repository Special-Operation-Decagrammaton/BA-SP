[translation]
"2004702-1" = "作戦参謀の誘い方"
"2004702-2" = "[ns] \"キキョウ！来たよ！\""
"2004702-3-キキョウ" = "なに、もう来たの？"
"2004702-4-キキョウ" = "先生、こっち。#nちょっと手伝って。"
"2004702-5" = "[ns] \"こんにち――\""
"2004702-6" = "[ns1] \"――はっ！\"\n[ns2] \"こ、これは……！？\""
"2004702-7-キキョウ" = "そんなに驚くこと？"
"2004702-8-キキョウ" = "夏だし。珍しい格好でもないでしょ。"
"2004702-9" = "[s] \"どうして水着姿に……？\""
"2004702-10-キキョウ" = "……これ。今から膨らませようと思って。"
"2004702-11-キキョウ" = "見てるなら、手伝ってほしいんだけど。"
"2004702-12" = "[s] \"えっと、部の敷地内でプールを？\""
"2004702-13-キキョウ" = "そう。いい案だと思わない？"
"2004702-14-キキョウ" = "近場で、人目を気にせず、手軽に水浴びができる。"
"2004702-15-キキョウ" = "……なに？"
"2004702-16-キキョウ" = "何か言いたげな顔ね。"
"2004702-17-キキョウ" = "いいよ。聞いてあげる。"
"2004702-18-キキョウ" = "先生の率直な意見を聞かせて。"
"2004702-19-キキョウ" = "私なりに準備したんだけど……。"
"2004702-20-キキョウ" = "……変じゃない？"
"2004702-21" = "[s3] \"変なわけないよ！\"\n[s4] \"水着、似合ってるよ！\""
"2004702-22-キキョウ" = "……水着？"
"2004702-23-キキョウ" = "……！"
"2004702-24-キキョウ" = "そんなことは聞いてない！プールの話！"
"2004702-25" = "[s] \"似合ってるのに……。\""
"2004702-26-キキョウ" = "当然でしょ？#n分かりきってることをわざわざ聞く必要なんて――"
"2004702-27-キキョウ" = "……言いたいことがあるなら、どうぞ。"
"2004702-28-キキョウ" = "あ、ちなみに。"
"2004702-29-キキョウ" = "二度目は無いから。"
"2004702-30-キキョウ" = "内容は、よく考えてね？"
"2004702-31" = "[s5] \"ど、どうかチャンスを！\"\n[s6] \"率直な意見を言わせていただきます！\""
"2004702-32-キキョウ" = "じゃあ、話を戻して――"
"2004702-33-キキョウ" = "ここにプールを置く計画、先生はどう思う？"
"2004702-34-キキョウ" = "手軽に夏を楽しむには最適でしょ？"
"2004702-35-キキョウ" = "……え？#nこれだと、オフィスでクーラーにあたるのと同じ？"
"2004702-36-キキョウ" = "……。"
"2004702-37-キキョウ" = "言ってくれるね。#nでも、言いたいことは分かった。"
"2004702-38-キキョウ" = "海とか、川とか、ウォーターパークとか……。#n行けば楽しいのかもしれないけど。"
"2004702-39-キキョウ" = "行くまでが面倒じゃない？"
"2004702-40-キキョウ" = "だからこうやって、手軽さを実現したのに。"
"2004702-41" = "[s] \"外に出るの好きじゃないんだっけ？\""
"2004702-42-キキョウ" = "別に。誰と行くかによるね。"
"2004702-43-キキョウ" = "あんたとだったら……まぁ、考えなくはないかも。"
"2004702-44" = "[s] \"じゃあ、海に行こう！\""
"2004702-45-キキョウ" = "それって……二人でってこと？"
"2004702-46" = "[s] \"そのつもりだけど……どうかな？\""
"2004702-47-キキョウ" = "……ふーん。"
"2004702-48-キキョウ" = "なら、予定を組まないと。#nこんなプールを準備している場合じゃないね。"
"2004702-49-キキョウ" = "で、あんたのスケジュール、いつが空いてるの？"
"2004702-50-キキョウ" = "……最初からこうなることを狙っていたのかって？"
"2004702-51-キキョウ" = "さあ？好きに考えたら。"
"2004702-52-キキョウ" = "とにかく、海に行くことは決まり。#n撤回は許さないから。"
"2004702-53-キキョウ" = "……ふふっ。"
"2004702-54" = "（海の計画を立てている間、キキョウはいつもより上機嫌にみえた）"
