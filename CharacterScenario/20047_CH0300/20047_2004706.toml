[translation]
"2004706-1" = "作戦参謀の奇策"
"2004706-2" = "（約束の時間ちょうどに到着した）"
"2004706-3-キキョウ" = "待ってたよ、先生。"
"2004706-4" = "[s] \"用事は片付いた？\""
"2004706-5-キキョウ" = "問題ないよ。#nだから、心置きなく楽しめる。"
"2004706-6-キキョウ" = "え？今日のやりたいことは何か、って？"
"2004706-7-キキョウ" = "すぐに分かるよ。"
"2004706-8-キキョウ" = "まず……今日は、胸の深さまで入ってみようと思うの。"
"2004706-9-キキョウ" = "だから手伝ってくれる？"
"2004706-10" = "[s1] \"ハーネスいる？\"\n[s2] \"あやとりの糸持ってくる？\""
"2004706-11-キキョウ" = "何だって構わないから。"
"2004706-12" = "[s] \"構わないの！？\""
"2004706-13-キキョウ" = "あんたのそういうのは今に始まったことでもないし。"
"2004706-14-キキョウ" = "いちいち騒ぐのもバカらしいな、って。"
"2004706-15-キキョウ" = "じゃあ、ほら。"
"2004706-16-キキョウ" = "手、出して。"
"2004706-17" = "ふぅぅ……。"
"2004706-18" = "[s3] \"大丈夫だよ。\"\n[s4] \"ちゃんと隣に居るからね。\""
"2004706-19" = "……うん。よろしく。"
"2004706-20" = "（その後、キキョウと一緒に海の中ではしゃいだ）"
"2004706-21-キキョウ" = "ありがとう、先生。"
"2004706-22-キキョウ" = "これからは一人でも海に入れると思う。"
"2004706-23-キキョウ" = "手を離さないでいてくれたお陰かな。"
"2004706-24" = "[s] \"どういたしまして。\""
"2004706-25-キキョウ" = "そろそろ疲れてない？#nいったん休憩しようか。"
"2004706-26" = "[s] \"私はまだ大丈夫だよ？\""
"2004706-27-キキョウ" = "私はクタクタなのに。"
"2004706-28-キキョウ" = "あんたはまだピンピンしてるわけ？"
"2004706-29" = "[s5] \"あ！急に疲れが……！\"\n[s6] \"な、なんだか力が抜けてくるような……！\""
"2004706-30-キキョウ" = "……そうよね？"
"2004706-31-キキョウ" = "あんたも疲れたみたいだし、特別に用意した休憩所に案内してあげる。"
"2004706-32" = "[s] \"もしかして、さっき言ってた「やること」って……。\""
"2004706-33-キキョウ" = "ふふ、それは見てのお楽しみ。"
"2004706-34-キキョウ" = "こっち。ついてきて。"
"2004706-35" = "[ns] \"おぉ、これは……！\""
"2004706-36-キキョウ" = "乗り方わかる？#nそう、そうやって、横になって。"
"2004706-37" = "[wa:450]― [log=키쿄 수영복]どう？[wa:1240]なかなかじゃない？[/log]"
"2004706-38" = "― [log=키쿄 수영복]今日のために作ったの。[/log]"
"2004706-39" = "[wa:420]― [log=키쿄 수영복]ほら、[wa:1050]存分に楽しんで。[/log]"
"2004706-40" = "[ns7] \"これいいね！\"\n[ns8] \"すごくいい感じだよ！\""
"2004706-41" = "[wa:1200]― [log=키쿄 수영복]実は……[wa:1580]全部、[wa:970]初めてなんだ。[/log]"
"2004706-42" = "[wa:500]― [log=키쿄 수영복]何かを作っているとき、[wa:1970]誰かの顔が[wa:1360]ずっと浮かぶのも。[/log]"
"2004706-43" = "― [log=키쿄 수영복]無防備な姿を、[wa:1850]誰かに見せるのも。[/log]"
"2004706-44" = "[wa:940]― [log=키쿄 수영복]別に……[wa:1350]誰とまでは言わないけど。[/log]"
"2004706-45" = "[wa:860]― [log=키쿄 수영복]……これからも[wa:1380]私のそばにいて。[/log]"
"2004706-46" = "― [log=키쿄 수영복]あんたの隣は、[wa:1790]私が守るから。[/log]"
"2004706-47" = "[wa:730]― [log=키쿄 수영복]……この同盟は、[wa:1730]永遠だからね。[/log]"
"2004706-48" = "（ハンモックに揺られながらのおしゃべりは、とめどなく続いた）"
