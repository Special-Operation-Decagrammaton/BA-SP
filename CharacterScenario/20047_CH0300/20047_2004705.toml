[translation]
"2004705-1" = "こころの天守閣"
"2004705-2" = "（浅いところで海水浴を楽しんだ）"
"2004705-3" = "（それでもキキョウはずっと手を離さなかった）"
"2004705-4-キキョウ" = "ちょっと慣れてきたかも……。"
"2004705-5-キキョウ" = "……あ、誤解しないで。#n別に怖がってるわけじゃないから。"
"2004705-6-キキョウ" = "これはあくまで安全のためで……。"
"2004705-7-キキョウ" = "……。"
"2004705-8-キキョウ" = "まあ、それはもういいとして。"
"2004705-9-キキョウ" = "海水浴は十分だから、他のこと――"
"2004705-10-キキョウ" = "この前できなかったことをしたい、って話したよね？"
"2004705-11-キキョウ" = "ふふ、気になる？"
"2004705-12-キキョウ" = "今から教えてあげる。"
"2004705-13-キキョウ" = "まずはこっちに横になってみて。"
"2004705-14-キキョウ" = "これからするのは、海の中をエスコートしてくれた先生へのご褒美なんだから。"
"2004705-15" = "[s1] \"ご、ご褒美？\"\n[s2] \"なにをしてくれるの！？\""
"2004705-16-キキョウ" = "すぐに分かるから。"
"2004705-17-キキョウ" = "あんたはそうしてるだけでいいよ。"
"2004705-18-キキョウ" = "あとは私に任せて、動かないで。"
"2004705-19-キキョウ" = "じゃあ……目を閉じてもらえる？"
"2004705-20" = "（言われるまま、大人しく目を閉じた）"
"2004705-21-キキョウ" = "動かないでって言ったよね？崩れるでしょ。"
"2004705-22-キキョウ" = "そのまま。じっとしてて。"
"2004705-23" = "（しばらくして……）"
"2004705-24-キキョウ" = "できた。もう目を開けていいよ。"
"2004705-25-キキョウ" = "どう？"
"2004705-26-キキョウ" = "私特製の砂風呂。ご感想は？"
"2004705-27" = "[s3] \"全身が……重い！\"\n[s4] \"た、助けてー！\""
"2004705-28-キキョウ" = "人聞きの悪いこと言わないで。全部あんたのためなんだから。"
"2004705-29-キキョウ" = "これは、色んな効果が期待できるの。"
"2004705-30-キキョウ" = "体温が上昇すれば発汗作用で肌を清潔にすることができるし、心拍数が増えれば全身に酸素と栄養が補給される。"
"2004705-31-キキョウ" = "その上、神経痛と関節にも効くらしいよ。"
"2004705-32-キキョウ" = "どう？少しずつ疲れが取れていく気がしない？"
"2004705-33" = "[s5] \"そ、そうだとしても……。\"\n[s6] \"砂の量多すぎじゃない？\""
"2004705-34-キキョウ" = "普通だと面白くないし、砂のお城にしてみたの。"
"2004705-35-キキョウ" = "先生は生徒を守ってくれる存在でしょ？#nそれならお城のイメージにあってると思うけど。"
"2004705-36-キキョウ" = "はい、天守閣に私の人形を置いてあげる。木彫りのヤツ。"
"2004705-37-キキョウ" = "目標時間は30分。#n途中でこの子が倒れたら、30分数えなおしだからね。"
"2004705-38" = "[s7] \"キキョウを倒すわけにはいかない！\"\n[s8] \"どんな手を使ってでも、守り抜いてみせる……！\""
"2004705-39-キキョウ" = "よ、よくもまぁそんな恥ずかしい台詞が……。"
"2004705-40-キキョウ" = "ふふっ……まだ余裕があるんだね。"
"2004705-41-キキョウ" = "じゃあ、これと、これと……これも。"
"2004705-42-キキョウ" = "人形、追加したから。"
"2004705-43-キキョウ" = "これで百花繚乱の命運は先生に託されたわけだけど……。#nあんたなら一人も倒さないままでいられるよね？"
"2004705-44" = "[s] \"が、頑張ります！\""
"2004705-45-キキョウ" = "私たちの同盟がどのくらい強固なのか……証明して。"
"2004705-46" = "[s] \"すでに強いと思いますけど……。\""
"2004705-47" = "[ns] \"いやぁ……立派な砂のお城だね。\""
"2004705-48-キキョウ" = "小さい頃からよくやってたからね。"
"2004705-49-キキョウ" = "砂の城と人形で、色んな作戦を立てて遊んでたの。"
"2004705-50" = "[s] \"キキョウは昔から参謀だったんだね。\""
"2004705-51-キキョウ" = "昔はごっこ遊びだけどね。"
"2004705-52-キキョウ" = "でも、思い出って大事だから。#n思考や人生に大きな影響を与えるもの。"
"2004705-53-キキョウ" = "思い出を石垣に、心の中に建ってる城が――#nそう簡単に崩れるわけないでしょう？"
"2004705-54-キキョウ" = "あんたと居るこの瞬間だって――"
"2004705-55-キキョウ" = "……！"
"2004705-56-キキョウ" = "い、今のは忘れて。"
"2004705-57-キキョウ" = "つい口が滑っちゃっただけ……。"
"2004705-58-キキョウ" = "先生？城が揺れているけど……。"
"2004705-59" = "[ns] \"……キキョウ！\""
"2004705-60-キキョウ" = "い、いきなり何を――"
"2004705-61-キキョウ" = "きゃっ……！"
"2004705-62-キキョウ" = "せ、先生？"
"2004705-63" = "[s9] \"思い出づくりなら任せて！\"\n[s10] \"今度はキキョウが砂風呂に入る番だよ！\""
"2004705-64-キキョウ" = "それは構わないけど……その前に。"
"2004705-65-キキョウ" = "人形、倒したね？先生。"
"2004705-66" = "（その後、埋めたり、埋められたり、#nキキョウと砂遊びをして過ごした）"
