[translation]
"2005205-1" = "タイムテーブル"
"2005205-2" = "[ns] \"……。\""
"2005205-3-ヤクモ" = "……。"
"2005205-4" = "[s1] \"列車……全然こないね……。\"\n[s2] \"もう1時間くらい待ったけど……。\""
"2005205-5-ヤクモ" = "身内を悪く言うのはよくないんですが。"
"2005205-6-ヤクモ" = "このボロボロインフラ、なんとかならないものですかねぇ……。"
"2005205-7-ヤクモ" = "学園の循環列車が定刻についたためしがないんです……。"
"2005205-8-ヤクモ" = "……もう我慢の限界です、先生。"
"2005205-9-ヤクモ" = "私[ruby=あらまき]荒槇[/ruby]ヤクモ、決心がつきました。"
"2005205-10" = "[s] \"その決心、怖いよ……。\""
"2005205-11-ヤクモ" = "なんですかその反応。別にとって食べたりしませんよぉ？"
"2005205-12-ヤクモ" = "すべての変化には、「ビジョン」が必要。"
"2005205-13-ヤクモ" = "レッドウィンターの鉄道インフラを変えるためには、#n模範となるような鉄道運営……。"
"2005205-14-ヤクモ" = "少なくとも、定時に到着し定時に発車するという事例を、身をもって学ばなければなりません！"
"2005205-15" = "[s] \"まともな話だ！\""
"2005205-16-ヤクモ" = "ムフフ。"
"2005205-17-ヤクモ" = "それで、これから何をするかと言いますと……。"
"2005205-18-ヤクモ" = "私はレッドウィンターの外――"
"2005205-19-ヤクモ" = "D.U.の鉄道を中心に乗車体験をし、路線と時刻表を分析します！"
"2005205-20-ヤクモ" = "先生も調査顧問として、同行お願いしますねぇ～"
"2005205-21" = "[s] \"そうなるのか……。\""
"2005205-22-ヤクモ" = "おっと？これは生徒の教育に関わる業務ですよ～？"
"2005205-23-ヤクモ" = "経緯書さえちゃんと出せば、予算だって下りるはずです。"
"2005205-24-ヤクモ" = "ああ、「その手」の書類が必要でしたらお気軽にご相談ください。いつでもお手伝いしますのでぇ。"
"2005205-25-ヤクモ" = "ムフフフ。"
"2005205-26" = "（……書類のことはさておき、）"
"2005205-27" = "（鉄道の調査は必要な気がして、1日乗車券を2枚購入した）"
"2005205-28-ヤクモ" = "なるほど、まずは地下鉄からですか……。"
"2005205-29-ヤクモ" = "地下鉄というのは定時到着、定時出発が確立してますよねぇ。"
"2005205-30-ヤクモ" = "まあ、これもこれで趣があるし良いでしょう。"
"2005205-31-ヤクモ" = "では今日の列車ツアー、よろしくお願いします～"
"2005205-32-ヤクモ" = "ムフフ。"
"2005205-33-ヤクモ" = "……規則的な揺れにレールの音。防音設備のおかげで、比較的穏やかに聞こえるというか……心地良いですねぇ……。"
"2005205-34-ヤクモ" = "地下鉄に乗ると眠くなる人の気持ちが……#nとても分かります……。"
"2005205-35-ヤクモ" = "……。"
"2005205-36-ヤクモ" = "すやぁ……。"
"2005205-37-ヤクモ" = "おお、立派な駅ですねぇ。#nきれいな設備に、利用客がこんなに大勢いて……！"
"2005205-38-ヤクモ" = "ほぉ、キヴォトス各地に繋がる高速鉄道の路線もここを通る、と。線路だけで32線……なるほどなるほどぉ。"
"2005205-39-ヤクモ" = "ここで問題です先生。主要駅と呼ばれる駅に来たとき、私たちが取るべき行動はなんでしょう～？"
"2005205-40" = "[s3] \"えっと……路線を間違えないようにする？\"\n[s4] \"時刻表をしっかり確認する？\""
"2005205-41-ヤクモ" = "それも大事ですが……。"
"2005205-42-ヤクモ" = "正解は列車の旅の花！駅弁選びです！"
"2005205-43" = "[s] \"そ、そっか……。\""
"2005205-44-ヤクモ" = "リアクションが薄いですねぇ。花より団子って言うじゃないですか。"
"2005205-45-ヤクモ" = "時刻表通りであれば、発車まであと40分あります。"
"2005205-46-ヤクモ" = "ムフフ。ゆっくり駅弁が選べそうですねぇ、行きましょう。"
"2005205-47-ヤクモ" = "おお、これは名物のタコ壺弁当ですねぇ。"
"2005205-48-ヤクモ" = "アナゴの煮つけ、野菜を添えたご飯、それからタコの天ぷら……。"
"2005205-49-ヤクモ" = "お弁当容器が本物の壺、というのがポイントなんです。"
"2005205-50-ヤクモ" = "おかげで少し重くはありますが、そこは仕方ないとして。"
"2005205-51-ヤクモ" = "タコ漁に使う壺に商品性を与えたところは、実に見事ですねぇ。"
"2005205-52-ヤクモ" = "牛丼弁当ですか。"
"2005205-53-ヤクモ" = "定番メニューには、そこでしか味わえない風情があるのです。"
"2005205-54-ヤクモ" = "醤油で味付けした牛肉と、野菜の煮物に卵焼き。紅生姜も欠かせませんよね。"
"2005205-55-ヤクモ" = "車内で食べることを考慮して、紅生姜には消臭処理をしてあるようです。"
"2005205-56-ヤクモ" = "こういった細やかな心配りこそ、売り上げに一番寄与していると思いませんか？"
"2005205-57-ヤクモ" = "これは列車型の弁当！"
"2005205-58-ヤクモ" = "弁当容器が列車の形になってるんです。"
"2005205-59-ヤクモ" = "中身はおにぎりに唐揚げ、ソーセージといったシンプルなラインナップですが……。"
"2005205-60-ヤクモ" = "容器までお土産にできるなんて、得しかないですねぇ～"
"2005205-61-ヤクモ" = "こちらのアイスも有名ですよ。"
"2005205-62-ヤクモ" = "有名になったわけ？それは……。"
"2005205-63-ヤクモ" = "……カチカチに凍りすぎて、数分間は食べれないことで有名だとか。"
"2005205-64-ヤクモ" = "硬さのあまりスプーンでは到底すくえず、振り下ろしたハンマーが跳ね返ったという伝説もあるみたいですねぇ……。"
"2005205-65-ヤクモ" = "どうです？駅弁ってすごいと思いませんか！"
"2005205-66" = "[s] \"うん！全部買おう！\""
"2005205-67-ヤクモ" = "えっ？"
"2005205-68-ヤクモ" = "全部、ですか？"
"2005205-69-ヤクモ" = "そのために選んだんじゃないのか、って……。"
"2005205-70-ヤクモ" = "間違ってはないんですけど……。"
"2005205-71-ヤクモ" = "そんなに快く応じてくださるなんて……。"
"2005205-72" = "[s] \"ヤクモはよく食べる年頃だしね。\""
"2005205-73-ヤクモ" = "……。"
"2005205-74-ヤクモ" = "いくつか戻してきますねぇ。"
"2005205-75-ヤクモ" = "意外、ですか？"
"2005205-76-ヤクモ" = "まあ……。"
"2005205-77-ヤクモ" = "図々しさにも、程度というものがありますのでねぇ。"
"2005205-78-ヤクモ" = "それに、全部買ったところで食べ切れません。#n捨てることになったら、もったいないじゃないですか～"
"2005205-79" = "[ns] \"列車の旅、どうだった？\""
"2005205-80-ヤクモ" = "そうですねぇ……まだ夢のなかにいるような気持ちですが……一つ、確実に言えることは――"
"2005205-81-ヤクモ" = "レッドウィンターは枕木から見直さなければなりませんねぇ。"
"2005205-82" = "[s] \"それは大事だよね。\""
"2005205-83-ヤクモ" = "枕木が不安定ですと振動も騒音も酷くなりますし、"
"2005205-84-ヤクモ" = "何より、列車がちゃんとスピードを出せなくなりますから。"
"2005205-85-ヤクモ" = "しかし枕木の交換となると結局、線路も再整備することになって……。"
"2005205-86-ヤクモ" = "レッドウィンターの広さを考えたとき……。"
"2005205-87-ヤクモ" = "敷地の果てから果てまでの横断鉄道は……。"
"2005205-88-ヤクモ" = "……。"
"2005205-89-ヤクモ" = "はぁ。"
"2005205-90-ヤクモ" = "大変な事業になりそうですが、それでも私はいつか、レッドウィンターにまともな路線が敷かれるところが見たいです。"
"2005205-91" = "[s5] \"鉄道路線に興味あるんだね。\"\n[s6] \"運行図表とか作ってみたら？\""
"2005205-92-ヤクモ" = "えっ、つまりはダイヤ作成ですよね？それは勘弁です。"
"2005205-93-ヤクモ" = "そんなの、引き受けた暁には色んなところからこき使われることになりますよ？"
"2005205-94-ヤクモ" = "出版事業ができなくなるじゃないですか！"
"2005205-95-ヤクモ" = "興味あるのは路線の分析だけです！できれば受け身で！"
"2005205-96-ヤクモ" = "そもそも興味をもったキッカケと言えば、本を鉄道輸送することになったからですし。"
"2005205-97" = "[s] \"そっか。常に出版部のことを思ってるんだね。\""
"2005205-98-ヤクモ" = "ええ。伊達に出版部部長、やってませんから。"
"2005205-99-ヤクモ" = "ムフフ。"
