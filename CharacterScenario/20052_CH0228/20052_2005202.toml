[translation]
"2005202-1" = "インフラストラクチャー"
"2005202-2-ヤクモ" = "今日も寒いですねぇ～"
"2005202-3-ヤクモ" = "ま、いつものことなんですが。"
"2005202-4" = "[s] \"こんな奥地までくる必要……あった？\""
"2005202-5-ヤクモ" = "ええ、ありますとも。"
"2005202-6-ヤクモ" = "出版部にとっては小さな一歩でも、"
"2005202-7-ヤクモ" = "レッドウィンターにとっては大きな一歩となる！"
"2005202-8-ヤクモ" = "……かもしれない事業のためです。"
"2005202-9" = "[s] \"それは一体……？\""
"2005202-10-ヤクモ" = "すなわち……通信線路設備工事です！"
"2005202-11-ヤクモ" = "どうして出版部が？といわんばかりの顔ですねぇ。"
"2005202-12-ヤクモ" = "ムフフ。たしかに通信線路の工事は公共事業にあたるもの。"
"2005202-13-ヤクモ" = "本来ならば、レッドウィンター事務局が担当しなければなりません。"
"2005202-14-ヤクモ" = "まあ、あの事務局では、100年経っても工事に着手できないでしょうねぇ～"
"2005202-15" = "[s] \"じゃあ出版部は……。\""
"2005202-16-ヤクモ" = "お察しのとおり。"
"2005202-17-ヤクモ" = "事務局に代わって請け負うことになったのですよ。"
"2005202-18" = "[s1] \"なるほど……。\"\n[s2] \"事務局の依頼だったんだ……。\""
"2005202-19-ヤクモ" = "はい、ですから今から私一人で通信線路を全部設置……はいたしません。"
"2005202-20-ヤクモ" = "設備を設置したという結果さえあればよいので。"
"2005202-21-ヤクモ" = "は～い、みなさん！こちらですよ～！"
"2005202-22-工務部の部員" = "報酬にプリンをくれるって話、本当なんだよな？"
"2005202-23-工務部の部員" = "予定より早く終わったらおまけに「特製モルス」ももらえるって聞いたけど本当？"
"2005202-24-ヤクモ" = "もちろんです。雇用関係で大切なのは信頼ですから。"
"2005202-25-ヤクモ" = "出版部部長の私、[ruby=あらまき]荒槇[/ruby]ヤクモはお金が関わっている以上、いい加減な仕事はいたしません！"
"2005202-26-ヤクモ" = "……どうしました先生？驚いた顔して。"
"2005202-27" = "[s3] \"いや……下請けの下請けを雇ったヤクモなら――\"\n[s4] \"出版部の利益が最大になるよう、\"\n[s5] \"報酬を最低限にすると勝手に思ってた……。\""
"2005202-28-ヤクモ" = "あらぁ……心外ですねぇ。私だって鬼じゃないですよぉ？"
"2005202-29-ヤクモ" = "まあ、もし誰かに代金を横取りでもされたら、鬼より凶悪になれる自信はありますけれども。"
"2005202-30-ヤクモ" = "……まったく、素人思考ですねぇ先生。ムフフ。"
"2005202-31" = "[s6] \"し、素人って言われた……。\"\n[s7] \"じゃあ、プロの考えを聞かせて！\""
"2005202-32-ヤクモ" = "ムフフ、ずばり……。"
"2005202-33-ヤクモ" = "インフラが安価で整ってこそ、本物の商売ができる、ということです！"
"2005202-34-ヤクモ" = "分かりますか先生？インフラ構築にかかるコストが上がれば、当然その費用は何らかの方法でユーザー側に請求されます。"
"2005202-35-ヤクモ" = "しかも、発注の主体はあのケチな事務局ですからねぇ。"
"2005202-36-ヤクモ" = "そもそもの話、今回は工事ができないようなレベルの予算しかもらってないですし。"
"2005202-37-ヤクモ" = "かと言って、足りない予算分を上乗せしてユーザーをカモにするだなんて――"
"2005202-38-ヤクモ" = "目先の利益しか見えていません……そんなの、長期損失に繋がるだけです！"
"2005202-39-ヤクモ" = "互いがリンクし合ってるこの超接続社会に！#n通信回線はもはやライフライン！"
"2005202-40-ヤクモ" = "そのライフラインを民営化してしまえば、最終的には全員が滅びの道を辿るでしょう！"
"2005202-41-ヤクモ" = "ですのでここでは、出版部が短期損失を恐れず――#nできる限り安く通信インフラを構築した上で！"
"2005202-42-ヤクモ" = "その運営権を事務局と交渉したほうが、理にかなった長期事業になる、というわけです。"
"2005202-43-ヤクモ" = "所有権ではありませんよぉ？運営権ですよ運営権。#n大事なことだから2回いいました。"
"2005202-44" = "[s] \"結局、何をどうするの……？\""
"2005202-45-ヤクモ" = "まあまあ、これから見ていてください。"
"2005202-46-ヤクモ" = "ムフフフ。"
"2005202-47-レッドウィンターの生徒A" = "やっと……寮に有線が繋がった！"
"2005202-48-レッドウィンターの生徒B" = "これで、回線代高い割に遅くて、しょっちゅう切れるポケット無線を使わなくて済むんだ！"
"2005202-49-ヤクモ" = "ところで皆さん――"
"2005202-50-ヤクモ" = "安く、速度が出て途切れない安定したネット環境で……何をされるご予定ですか？"
"2005202-51-ヤクモ" = "えっ？そういえば……。"
"2005202-52-レッドウィンターの生徒B" = "考えたことなかったかも……。"
"2005202-53-ヤクモ" = "ままま、そういう時はまず、楽しいことからはじめませんか？"
"2005202-54-ヤクモ" = "私ども出版部が手掛けたプラットフォームでは、web小説を100話分、無料で読めちゃうのです。"
"2005202-55-ヤクモ" = "100話分！？"
"2005202-56-レッドウィンターの生徒B" = "しかも無料！？"
"2005202-57-ヤクモ" = "ええ。一定時間が経過しますと、別作品が無料で公開されますよぉ～"
"2005202-58-ヤクモ" = "もちろん、課金していただければ、人より早く確実に、最新話をお読みいただけますが……。"
"2005202-59-ヤクモ" = "課金……？"
"2005202-60-レッドウィンターの生徒B" = "100話分もタダで読めるのに？わざわざ課金する必要なくない？"
"2005202-61-ヤクモ" = "（ムフフ……最初は皆さん、そう思いますよねぇ……）"
"2005202-62" = "[s]（ヤクモ……おそろしい子……！）"
"2005202-63-レッドウィンターの生徒A" = "あっ！全部読んじゃった！"
"2005202-64-レッドウィンターの生徒B" = "次！早く次の話が読みたいー！"
"2005202-65-ヤクモ" = "おやおや、落ち着いてください。さきほど申し上げたとおり、課金していただければ……。"
"2005202-66-レッドウィンターの生徒A" = "もう課金したの！読めるところまで読んじゃって……。"
"2005202-67-レッドウィンターの生徒B" = "次はいつ更新されるの？サブスク登録するから！早く読ませて！"
"2005202-68-ヤクモ" = "！？"
"2005202-69-ヤクモ" = "これは驚きですねぇ……なんと凄まじいコンテンツ消費速度。"
"2005202-70-ヤクモ" = "では……最新話公開までの間、こちらの小説をコミカライズしたものはいかがでしょう？"
"2005202-71-ヤクモ" = "文章とはまた違う魅力があると思いますよぉ～？"
"2005202-72-ヤクモ" = "読む読む！"
"2005202-73-レッドウィンターの生徒B" = "あれ、漫画の無料分は10話だけ……？"
"2005202-74-ヤクモ" = "ああ、そこはご了承ください。絵を描くのはかなり工数のかかる作業でして……。"
"2005202-75-ヤクモ" = "更新を待ちきれないようでしたら、追加課金で作家を直接「応援」することもできますよぉ？"
"2005202-76-ヤクモ" = "今の世の中……なんだかんだ人を動かすのはお金、ですからねぇ。ムフフフ。"
"2005202-77-ヤクモ" = "（それにクラファンのプラットフォームも我々出版部が手掛けていますから、#n手数料をいただけてwin-winですとも）"
"2005202-78-ヤクモ" = "それはいいんだけど……なんで課金上限があるの？"
"2005202-79-レッドウィンターの生徒B" = "そうだよ！こっちは制限なく課金したいのに！"
"2005202-80-ヤクモ" = "お気持ちはありがたいのですが……我々出版部の目標は、読者の皆さんの時間を楽しく、豊かにすること。"
"2005202-81-ヤクモ" = "私どものプラットフォームのせいで、皆さんの日常生活に支障が出てしまっては本末転倒なのです。"
"2005202-82-ヤクモ" = "（……消費者を破産させては、長期商売は成り立たないんですよねぇ～）"
"2005202-83-ヤクモ" = "関連コンテンツとして、きっとこちらも気に入っていただけるかと思います。#n私どもが用意した動画なのですが……。"
"2005202-84-ヤクモ" = "ありゃ～……これは困りましたねぇ……。"
"2005202-85-ヤクモ" = "えっ何？どうしたの？"
"2005202-86-レッドウィンターの生徒B" = "……今のネット回線の速度では、高画質の動画がみれない？"
"2005202-87-ヤクモ" = "残念ながらそのようですねぇ～#nいやあ、事務局がなかなか予算をくれないものでして。ですが――"
"2005202-88-ヤクモ" = "触れてみていかがでしたか？より多くのweb小説にweb漫画……。"
"2005202-89-ヤクモ" = "高画質の動画とコンテンツを楽しんでいただくためには、より高速で安定したネット環境が……。"
"2005202-90-ヤクモ" = "……必要、ですよねぇ？"
"2005202-91-レッドウィンターの生徒A" = "そうだよ！！"
"2005202-92-レッドウィンターの生徒B" = "事務局がまた……よし！抗議しにいこう！"
"2005202-93-レッドウィンターの生徒A" = "寮のみんなも呼ぶ？"
"2005202-94-レッドウィンターの生徒B" = "他の寮にも声をかけよう！"
"2005202-95-ヤクモ" = "ムフフ。ついでに私どものプラットフォームの宣伝もすこ～しだけ、お願いできますか～？"
"2005202-96-ヤクモ" = "コンテンツとはみんなで共有してこそ、楽しみが増えるというものですから。"
"2005202-97-ヤクモ" = "ああ、任せて！"
"2005202-98-レッドウィンターの生徒B" = "ここ、SNSみたいな掲示板もあるんだね！レビュー書いとくよ！"
"2005202-99-ヤクモ" = "ムフフ。感謝申し上げます。"
"2005202-100-ヤクモ" = "これからも良質なコンテンツを皆さんに提供できるよう、私どもレッドウィンター出版部は、皆様からの更なるご助力を賜りたく存じます～"
"2005202-101-ヤクモ" = "（ラインナップの3分の1は、レッドウィンターの外から安価で仕入れたコンテンツですけどねぇ……）"
"2005202-102-ヤクモ" = "（それでもレッドウィンターでは新作扱いされますし、まあ問題ないでしょう。ムフフフ）"
"2005202-103" = "（そうして生徒たちは、高速回線の設置を事務局に訴え――）"
"2005202-104" = "（出版部の事業は、勢いよく伸びていくのであった……！）"
"2005202-105-ヤクモ" = "結果、事務局の財政に少しダメージがあったようですが……。"
"2005202-106-ヤクモ" = "元はといえば事務局の怠慢が原因だったわけですし、出版部に非はないんじゃないですかねぇ～？"
"2005202-107-ヤクモ" = "ムフフフ！"
"2005202-108" = "[s] \"ちょっと思ったんだけど……。\""
"2005202-109-ヤクモ" = "はい？"
"2005202-110" = "[s] \"ヤクモって、恐ろしい子だね……。\""
"2005202-111-ヤクモ" = "何をおっしゃるのやら。私ほど無害な生徒はいませんよぉ～？ムフフ。"
