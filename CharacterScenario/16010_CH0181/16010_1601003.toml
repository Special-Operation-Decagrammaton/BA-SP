[translation]
"1601003-1" = "マイスターの熱烈な応援"
"1601003-2" = "シャーレ・オフィス"
"1601003-3" = "（データを復旧するために、夜遅くまで作業していたところ……）"
"1601003-4" = "[ns1] \"……？\"\n[ns2] \"……こんな時間に誰？\""
"1601003-5-？？？" = "……えっと。"
"1601003-6-ヒビキ" = "……せ、先生。"
"1601003-7-ヒビキ" = "その……これは……。"
"1601003-8-ヒビキ" = "先生が……応援してほしいって、言ってたから……。"
"1601003-9" = "[s] \"……だからチアリーダーの格好を？\""
"1601003-10-ヒビキ" = "うん……先生を応援するため、だから。"
"1601003-11-ヒビキ" = "働いてる人は、みんなその場に適した格好をするよね。"
"1601003-12-ヒビキ" = "暑い環境で働く人は放熱服を、粉塵が多い場所で働く人は防塵服が必要なのと一緒で……。"
"1601003-13-ヒビキ" = "……応援する人はチアリーダーの服を着る。簡単な原理だよ。"
"1601003-14" = "[s] \"……これって大運動会の時に着てた衣装？\""
"1601003-15-ヒビキ" = "うん、そうだよ。"
"1601003-16-ヒビキ" = "私がコスプレ始めたての頃に作ったもので……正直クオリティに自信はないけど……。"
"1601003-17-ヒビキ" = "前も言ったみたいに、コスプレで大事なのはキャラクターになりきることだから。"
"1601003-18-ヒビキ" = "この前の大運動会の時は準備がほとんどできなかったから、ちゃんと頭を切り替えられなくて……"
"1601003-19-ヒビキ" = "でも先生を応援したい気持ちでいっぱいの今なら、本物のチアリーダーになれるはず。"
"1601003-20-ヒビキ" = "だから……そこで私の応援を見ててね。"
"1601003-21" = "[wa:150]― フレー、[wa:1200]フレー……[wa:1250]先生！"
"1601003-22" = "― 行け行け、[wa:1250]勝て勝て、[wa:1500]先生……"
"1601003-23" = "[wa:200]― ん？"
"1601003-24" = "― 何に勝つための[wa:1400]応援かって？"
"1601003-25" = "― 何だろう……？"
"1601003-26" = "― 先生を[wa:850]苦しめる[wa:900]業務、[wa:1050]とか。"
"1601003-27" = "― 先生としての[wa:1050]責任[wa:1050]とか……？"
"1601003-28" = "[wa:750]― 気がかりなら、"
"1601003-29" = "― 応援のフレーズを[wa:1350]ちょっと[wa:400]変えようか……？"
"1601003-30" = "[wa:750]― 頑張れ、[wa:1150]頑張れ……[wa:1100]先生！"
"1601003-31" = "[wa:500]― （……なんだか[wa:1200]おかしい。\n"
"1601003-32" = "― 先生、[wa:1300]元気になるどころか、"
"1601003-33" = "― あんまり[wa:350]集中できて[wa:800]なさそうに[wa:650]見える）"
"1601003-34" = "[wa:750]― （……もしかして[wa:1500]今の私、"
"1601003-35" = "― 結構[wa:600]とんでもないことを[wa:650]しちゃってるのかも……？）"
"1601003-36-ヒビキ" = "……どうかな、先生。"
"1601003-37-ヒビキ" = "私の応援を見て、やる気は出た？"
"1601003-38-ヒビキ" = "……えっ、逆に集中力が落ちちゃった？"
"1601003-39-ヒビキ" = "ん……ごめん、それは想像できなかった。"
"1601003-40-ヒビキ" = "……たしかにデスク作業は画面を見る必要があるから、派手な応援は役に立たないね。"
"1601003-41-ヒビキ" = "チアリーダーは事務所で働くわけじゃないし……。"
"1601003-42-ヒビキ" = "先生を助けたくて準備したのに、邪魔しちゃうなんて……。"
"1601003-43-ヒビキ" = "もしかしたら私は、まだまだ真のマイスターにはなれないのかも……。"
"1601003-44" = "[s] \"ヒビキの気持ちは十分伝わったよ。\""
"1601003-45" = "[ns3] \"それに、疲労のせいで集中力が落ちてるだけだと思うよ。\"\n[ns4] \"……コーヒーを一杯お願いできるかな？\""
"1601003-46-ヒビキ" = "……それなら任せて。"
"1601003-47-ヒビキ" = "エンジニア部で徹夜する時は、よくコーヒーを淹れてるからね。"
"1601003-48-ヒビキ" = "じゃあ、まずはコーヒーの風味を最大限引き出すために、高圧抽出装置を作るところから……"
"1601003-49" = "[s] \"……普通のコーヒーで大丈夫だよ。\""
"1601003-50-ヒビキ" = "……分かった。"
"1601003-51-ヒビキ" = "せめて熱烈な応援の気持ちを込めて、最高の一杯を淹れるね。"
"1601003-52" = "（ヒビキの熱烈な応援のおかげで、予想より早く全てのデータを復旧できたが……)"
"1601003-53" = "（深夜にチアリーダー姿の生徒と二人きりでいたという噂が広がり、しばらく市民から変な誤解を招いてしまった……) "
