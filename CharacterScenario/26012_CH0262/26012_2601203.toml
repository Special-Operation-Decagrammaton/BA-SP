[translation]
"2601203-1" = "心肺蘇生法"
"2601203-2" = "（キリノの訓練を手伝うために、ヴァルキューレ警察学校を訪れた）"
"2601203-3-キリノ" = "こんにちは、先生！"
"2601203-4-キリノ" = "今日の訓練では、水に入らない予定です！"
"2601203-5-キリノ" = "水には入りません！"
"2601203-6" = "[s] （二回も言った……）"
"2601203-7-キリノ" = "やはり、心肺蘇生法は応急処置の定番ですよね。"
"2601203-8-キリノ" = "危険な状況下にある落水者の生存率を高めるためには……。"
"2601203-9-キリノ" = "心臓を圧迫し血液を循環させ、脳の損傷を防ぐ必要があります！"
"2601203-10-キリノ" = "本官の調べによると、心肺蘇生法を行なうことで生存率が2.4倍も上がるそうです！"
"2601203-11" = "[s1] \"すごいね、覚えてきたんだ。\"\n[s2] \"しっかり勉強してきたんだね。\""
"2601203-12-キリノ" = "……と、この「ヴァルキューレ警察学校ライフセーバーマニュアル」に書いてあります！"
"2601203-13" = "[s] \"……マニュアルは大事だよね。\""
"2601203-14-キリノ" = "では、実践に移りましょう！#nまずは、訓練用模型を――"
"2601203-15-キリノ" = "あれ？"
"2601203-16" = "[s3] \"もしかして……。\"\n[s4] \"模型はどこに……？\""
"2601203-17-キリノ" = "く、訓練用模型を持ってきておりませんでした……。"
"2601203-18-キリノ" = "どうしましょう？#n備品室は遠いので、往復すると結構な時間が……。"
"2601203-19-キリノ" = "もしかしたら、プールの利用時間を過ぎてしまうかも……。"
"2601203-20" = "[s5] \"忘れちゃったなら仕方ないよ。\"\n[s6] \"私が模型の代わりを務めるね。\""
"2601203-21-キリノ" = "……先生が？"
"2601203-22-キリノ" = "たしかに、そのほうが実際の現場に近いかもしれませんが……。"
"2601203-23-キリノ" = "本当に良いのですか？"
"2601203-24" = "[s] \"訓練を手伝うために来たからね。\""
"2601203-25-キリノ" = "で、ではお願いします！"
"2601203-26-キリノ" = "付き合っていただいた分、頑張ります！"
"2601203-27" = "（目を閉じて横になり、落水者の役になりきった）"
"2601203-28-キリノ" = "大丈夫ですか！聞こえていますか！？#nそこの出入り口にいる方、救急車を呼んでください！"
"2601203-29-キリノ" = "ま、まずは呼吸と脈を確認して……！"
"2601203-30" = "[s] （マニュアル通りにうまくできているようだ）"
"2601203-31-キリノ" = "気道、確保！"
"2601203-32" = "[s] （次は顎を上げて気道を一直線に……）"
"2601203-33-キリノ" = "こ、この次は……。"
"2601203-34" = "[ns] （……ん？）"
"2601203-35-キリノ" = "[ruby=自動体外式除細動器]AEDを使[/ruby]用します！"
"2601203-36" = "[ns] \"！？！？！？！？\""
"2601203-37" = "[ns7] \"な、何してるの！？\"\n[ns8] \"危ないでしょ！？\""
"2601203-38-キリノ" = "で、ですが……#nこのマニュアルにはAEDを使用するよう書かれていますよ？"
"2601203-39-キリノ" = "生存率を高めるためにも、必須だそうです！"
"2601203-40" = "[s] \"でも、これは訓練だからね。\""
"2601203-41-キリノ" = "実践と同じ手順を守ってこそ、水辺の勝者になれると書いてあります！"
"2601203-42-キリノ" = "なので、早く再開しましょう！#n横になってください、先生！"
"2601203-43" = "[s9] \"ま、マニュアルに執着しすぎるのも良くないよ！\"\n[s10] \"水辺の勝者って、何と戦ってるの！？\""
"2601203-44-キリノ" = "うーん、先生がそう仰るのなら、飛ばすしかありません。"
"2601203-45-キリノ" = "マニュアルによると、この次は……。"
"2601203-46-キリノ" = "や、やはりマニュアルに執着するのは、#nあまり良い選択肢じゃないですね。"
"2601203-47-キリノ" = "緊急時の対応を、#n訓練でそっくりそのまま行なうわけにはいきませんから！"
"2601203-48-キリノ" = "せ、先生となら、嫌ではありませんが……まだ早すぎます！"
"2601203-49" = "[s] \"……そ、そうなの？\""
"2601203-50-キリノ" = "は、はい！そうです！"
"2601203-51-キリノ" = "今からでも備品室に行って、模型を取りに行ってきます！"
"2601203-52-キリノ" = "ご協力、ありがとうございました！"
"2601203-53" = "[ns11] \"……。\"\n[ns12] キリノが置いていったマニュアルを見てみる。"
"2601203-54" = "（AEDの使用方法の次には、人工呼吸について書かれていた）"
