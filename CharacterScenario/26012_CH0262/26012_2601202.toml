[translation]
"2601202-1" = "人命救助訓練"
"2601202-2" = "（キリノの頼みを受け、ヴァルキューレ警察学校に向かった）"
"2601202-3-キリノ" = "[USERNAME]先生、お待ちしておりました！"
"2601202-4-キリノ" = "任務開始まで時間がないもので、#nどうすれば良いのかと本当に困っていました……。"
"2601202-5" = "[s1] \"大丈夫だよ、いつでも呼んでね。\"\n[s2] \"私も泳ぐのは好きだから。\""
"2601202-6-キリノ" = "はい、ありがとうございます！"
"2601202-7-キリノ" = "先生がいらっしゃる前に準備運動は済ませておきました！#nいつでも訓練を開始できます！"
"2601202-8" = "[s] \"じゃあ、まずは今の実力を見せてもらっても良い？\""
"2601202-9-キリノ" = "もちろんです！#n反対側まで泳いできます！"
"2601202-10" = "[ns3] （犬かき……？）\n[ns4] （ちゃんと前には進んでるけど……）"
"2601202-11-キリノ" = "ぷはっ！#nただいま戻りました！"
"2601202-12-キリノ" = "どうでしたか、本官の実力は！"
"2601202-13" = "[s5] \"ばっちりだよ。\"\n[s6] \"速くて驚いたよ。\""
"2601202-14-キリノ" = "ふふっ、ありがとうございます。"
"2601202-15-キリノ" = "ですが、人命救助においては特別な泳法があると聞きました。"
"2601202-16-キリノ" = "先ほどのように、ただ泳ぐだけでは救助できませんから。"
"2601202-17-キリノ" = "そこで、訓練マニュアルを見たところ……よい、しょ！"
"2601202-18" = "[s] \"……重り？\""
"2601202-19-キリノ" = "はい！この重りを水に溺れた人と想定して、#n片腕で救出できなければならないそうです。"
"2601202-20-キリノ" = "……あれ。#nこれ、5kgしかありませんよ。人の体重と比べたら軽すぎないでしょうか？"
"2601202-21" = "[s] \"浮力の関係で、そうなってるんだと思う。\""
"2601202-22" = "[ns] \"水中では、体重が10％くらいになるって聞いたよ。\""
"2601202-23-キリノ" = "あ、そうなんですね！"
"2601202-24-キリノ" = "では、本官の体重は水中だと……。"
"2601202-25-キリノ" = "はっ！？"
"2601202-26-キリノ" = "ゆ、誘導尋問にうっかり引っかかるところでした！"
"2601202-27-キリノ" = "やりますね、先生……！"
"2601202-28" = "[s] \"……えっ？\""
"2601202-29-キリノ" = "な、何でもありません！#nでは、訓練を開始しましょう！"
"2601202-30-キリノ" = "先生、この重りをプールに投げていただけますか？#n本官が引き上げますので！"
"2601202-31" = "[ns7] 重りを軽く投げる。\n[ns8] 重りを思いっきり投げる。"
"2601202-32-キリノ" = "落水者を発見しました！"
"2601202-33-キリノ" = "そこの方、救急車を呼ん[ruby=自動体外式除細動器]で、AEDを持[/ruby]ってきてください！"
"2601202-34" = "[s] （実際の現場を想定した本格的な訓練だった）"
"2601202-35-キリノ" = "行きます！えいっ！"
"2601202-36-キリノ" = "ふうっ！"
"2601202-37" = "[ns] \"……。\""
"2601202-38" = "[ns] \"き、キリノ！？\""
"2601202-39-キリノ" = "ぷへえっ！"
"2601202-40-キリノ" = "お、重すぎます！"
"2601202-41-キリノ" = "それに、ぷはっ！#nち、力が入らなっ……！"
"2601202-42" = "[s9] \"落ち着いて、これを掴んで！\"\n[s10] \"キリノ！すぐ助けてあげる！\""
"2601202-43" = "きゅ、救命浮き輪、掴みました！"
"2601202-44" = "[s] \"引っ張るからしっかり掴んでて！\""
"2601202-45-キリノ" = "げほげほ、けふっ！"
"2601202-46" = "[s11] \"はぁ、はぁ……。\"\n[s12] \"キリノ、大丈夫？\""
"2601202-47-キリノ" = "はっ、はい……大丈夫です。#n助けていただきありがとうございます、先生。"
"2601202-48-キリノ" = "まさか、ライフセーバーが溺れるだなんて……。"
"2601202-49-キリノ" = "やはり、もっと訓練をしなければなりませんね。"
"2601202-50" = "（その後も一緒に、人命救助訓練を続けた）"
