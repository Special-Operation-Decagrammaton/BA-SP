[translation]
"1003703-1" = "保安委員長の推理"
"1003703-2" = "レッドウィンター連邦学園の本館前"
"1003703-3" = "（マリナのメッセージを受けて、レッドウィンター連邦学園に到着した。）"
"1003703-4-マリナ" = "先生、こっちだ。"
"1003703-5-マリナ" = "ここが例の犯行現場。あの卑劣なスパイがひっそりと侵入し、プリンを盗んだ場所だ。"
"1003703-6-マリナ" = "よりによって、チェリノ会長のプリンを狙うだなんて……許しがたいやつめ！"
"1003703-7" = "[s] \"その犯人は、どうしてプリンを盗んだんだろうね？\""
"1003703-8-マリナ" = "狙いは明白だ。できるだけ貴重なものを盗むことで学園内で騒動を起こし、それに乗じて学園で内紛を起こさせるつもりだろう！"
"1003703-9-マリナ" = "しかし、この保安委員長の目は騙せない！"
"1003703-10-マリナ" = "この辺りの痕跡を見る限り、スパイは窓から侵入してきたと推測できる。"
"1003703-11-マリナ" = "この足跡からして……スパイの身長は1mも無いな、非常に小柄だ。そしておそらく四つ足歩行と考えられる。"
"1003703-12" = "[s1] \"それって、スパイじゃなくて……。\"\n[s2] \"この辺の野生動物が持ってったってことじゃ……？\""
"1003703-13-マリナ" = "それは早計だぞ、先生！"
"1003703-14-マリナ" = "それは早計だぞ、先生！"
"1003703-15-マリナ" = "相手はなにせ、レッドウィンター連邦学園に侵入できるほどの変装の達人だ！"
"1003703-16-マリナ" = "どんな姿にも変装できる可能性がある……つまりこの痕跡だけで、正体を断言することはできない！"
"1003703-17-マリナ" = "とはいえ今は、この足跡だけが頼りだ。とりあえずこれを追ってみるとしよう。"
"1003703-18-マリナ" = "運が良ければ日が暮れる前に、スパイの基地へと辿り着けるかもしれない。"
"1003703-19" = "[s] \"運が良くても、そんなにかかりそう……？\""
"1003703-20-マリナ" = "ああ。何せこのレッドウィンター連邦学園自治区は、キヴォトスでも最大級の敷地面積を誇る。"
"1003703-21-マリナ" = "不慣れな者が目的地を決めずに歩き回れば、あっさり遭難してしまうくらいだ。"
"1003703-22-マリナ" = "まあ、特にレッドウィンターの生徒でそんなことになるバカはそうそういないがな！はっはっはっは！"
"1003703-23" = "[s3] \"学園の自治区内で遭難……。\"\n[s4] \"なんだか、嫌な予感が……。\""
"1003703-24-マリナ" = "心配するな、先生。私はほぼ完璧にこの学園の地理を把握している。大船に乗ったつもりでついてくるが良い！"
"1003703-25-マリナ" = "心配するな、先生。私はほぼ完璧にこの学園の地理を把握している。大船に乗ったつもりでついてくるが良い！"
"1003703-26" = "（その後……）"
"1003703-27-マリナ" = "……迷ったな。"
"1003703-28-マリナ" = "なぜだ、足跡に沿って進んできただけなのに……！"
"1003703-29" = "[s] \"さっきマリナ、確か地理は把握してるって……。\""
"1003703-30-マリナ" = "う、嘘ではない！レッドウィンター連邦学園の保安委員長として、それは当然のことだ！"
"1003703-31-マリナ" = "そのはず、なのだが……。"
"1003703-32-マリナ" = "……ん？何だかこの辺りの景色、もはや見覚えが無いような……。"
"1003703-33-マリナ" = "くっ、足跡も見えなくなって……これは、犯人を取り逃してしまったか……。"
"1003703-34" = "[s] \"さっきの足跡なら、そこの倉庫に繋がってるみたいだよ。\""
"1003703-35-マリナ" = "なっ……"
"1003703-36-マリナ" = "本当じゃないか！"
"1003703-37-マリナ" = "しかも、倉庫の入り口に落ちているあれらは……盗まれたはずの、チェリノ会長のプリン！"
"1003703-38-マリナ" = "つまり例のスパイは、きっとここに隠れているに違いない！"
"1003703-39-マリナ" = "やるではないか先生。 私でさえ見逃した、犯人の痕跡に気づくとは……。"
"1003703-40-マリナ" = "スパイを無事に捕まえたあかつきには、先生に「特別勇猛髭勲章」が与えられるように提案してみよう！"
"1003703-41-マリナ" = "さあ、ではあの卑劣なスパイに引導を渡しにいくとしようか。"
"1003703-42-マリナ" = "……[ruby=突撃]Ура[/ruby]！"
"1003703-43-マリナ" = "動くな、スパイめ！"
"1003703-44-マリナ" = "なっ……！"
"1003703-45" = "[ns] \"可愛い、猫だね。\""
"1003703-46-マリナ" = "……。"
"1003703-47-マリナ" = "馬鹿な、スパイではなく猛獣だと！？"
"1003703-48" = "[s] \"落ち着いて、マリナ。ただの野良猫だよ。\""
"1003703-49-マリナ" = "お、落ち着けるか！先生はあの鋭い爪と歯が見えないのか！？"
"1003703-50-マリナ" = "やっとスパイの本拠地を見つけたと思ったのに、まさかその先にはさらに大きな脅威が潜んでいたとは……。"
"1003703-51-マリナ" = "くっ……しかしここで退いたら、チェリノ会長には何と報告すれば良いんだ？プリンを盗んだ犯人を見つけたが、撤退するしかなかったと？"
"1003703-52-マリナ" = "だが、それでは粛清されてしまう……麻酔銃か何かで生け捕りにして、事務局に突き出すか……？あの猛獣を？"
"1003703-53" = "[s5] \"マリナ、もしかして……。\"\n[s6] \"猫が怖いとか？\""
"1003703-54-マリナ" = "な、何だと！？レッドウィンター連邦学園の保安委員長が、たった一匹の猫に怯えるわけがないだろう！"
"1003703-55-マリナ" = "な、何だと！？レッドウィンター連邦学園の保安委員長が、たった一匹の猫に怯えるわけがないだろう！"
"1003703-56-マリナ" = "たとえ怒り狂った熊が襲い掛かってきたとしても、私は決して――"
"1003703-57-マリナ" = "うあああっ！"
"1003703-58-マリナ" = "……白状しよう。猫は苦手なんだ……。"
"1003703-59-マリナ" = "幼い頃、野良猫におやつをあげようとしたら、顔を引っかかれて……。"
"1003703-60-マリナ" = "それ以来、猫には近寄りたくもない……。"
"1003703-61" = "[s] \"じゃあこの機会に、あらためて仲良くなってみるのはどう？\""
"1003703-62-マリナ" = "なっ、正気か先生！？猫と仲良くなるだと！？"
"1003703-63-マリナ" = "あの恐ろしい猛獣と親交を交わすくらいなら、飢えた熊と会話をする方がマシだ！"
"1003703-64-マリナ" = "たとえそれが会長からの命令だったとしても、そんなことはできな――"
"1003703-65-マリナ" = "ち、近寄るなっ！！！"
"1003703-66-マリナ" = "あっ……。"
"1003703-67" = "[s7] \"銃弾、当たらなくて良かった……\"\n[s8] \"逃げちゃったね。\""
"1003703-68-マリナ" = "……。"
"1003703-69-マリナ" = "……。"
"1003703-70-マリナ" = "と、とにかくこれで事件は解決だな！"
"1003703-71-マリナ" = "会長のプリンを盗んだ犯人が分かり、その犯人にはしっかりと警告を与えた。もうあのような真似はしないだろう。"
"1003703-72-マリナ" = "これでチェリノ会長の怒りも、少しは和らいでくれるはず……。"
"1003703-73-マリナ" = "……ところでさっき、棚の上から何かが落ちたな。あれは何だ？"
"1003703-74-マリナ" = "ちぇ、チェリノ会長の石像が！！"
"1003703-75-マリナ" = "どうして会長の石像がこんなところに！？それに、どうしてこんなお姿に……！"
"1003703-76-マリナ" = "……え、私？さっき銃を乱射した時に……？"
"1003703-77-マリナ" = "そ、そんな、せっかくプリンを盗んだ犯人を特定したというのに……それに伴って、まさか会長の権威を失墜させてしまったというのか……！？"
"1003703-78-マリナ" = "これ以上の粛清はもう嫌だああぁぁぁぁぁっ！！"
"1003703-79" = "（その後「犯人は猫」ということが明らかになったものの、マリナはチェリノの石像を壊した罰で再び懲戒を受けることになったらしい……。）"
