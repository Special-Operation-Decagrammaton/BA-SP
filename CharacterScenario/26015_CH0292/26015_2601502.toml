[translation]
"2601502-1" = "ビジネス・サーファー"
"2601502-2" = "（海辺を歩いていたら、イチカと遭遇した）"
"2601502-3-イチカ" = "先生？"
"2601502-4-イチカ" = "どうして海に……って、そういや来てたっすね。はは。"
"2601502-5-イチカ" = "私っすか？ええっと……。"
"2601502-6-イチカ" = "実は、うっかり仕事が全部終わっちゃって。いつもはバレない程度にゆるくやるんすけどね……。"
"2601502-7-イチカ" = "で、暇そうに見えるのもアレだし、ぶらぶらしてるっす。"
"2601502-8" = "[s1] \"そういう日もあるんだね。\"\n[s2] \"私の仕事も、うっかり早めに終わればいいのに……！\""
"2601502-9-イチカ" = "おかげで先生に会えたんで、ラッキーかも。"
"2601502-10-イチカ" = "どこか行くとこっすか？"
"2601502-11-イチカ" = "流石にバカンス中も仕事なんて――"
"2601502-12-イチカ" = "……ありそうだから、聞きづらいっすけど。"
"2601502-13-イチカ" = "え……？おサボり共犯者になってほしい？"
"2601502-14-イチカ" = "あはは！いいっすよ。行きますか。"
"2601502-15-イチカ" = "どうしたんすか？先生？"
"2601502-16-イチカ" = "……「あなたもイケてるサーファーに！初心者向け講座」っすか。"
"2601502-17-イチカ" = "ちらっと聞いたんすけど、今日ここでサーフィン大会があるらしいんすよ。"
"2601502-18-イチカ" = "そのついでに、競技人口増やしたいってとこじゃないっすか？"
"2601502-19-イチカ" = "でも意外っす、先生ってサーフィンに興味が――"
"2601502-20-イチカ" = "……はい？"
"2601502-21-イチカ" = "私にやってほしいんすか？"
"2601502-22-イチカ" = "そういうのは間に合ってるっす！"
"2601502-23-イチカ" = "た、たしかに暇そうにはしてたっすけど、サーフィンなんて……。"
"2601502-24-イチカ" = "もっと明るくて、キラキラしてる子がやるやつっすよ？"
"2601502-25-イチカ" = "私なんて、絶対海に落っこちて終わりっす。"
"2601502-26-イチカ" = "……それも楽しい思い出になるっすか？"
"2601502-27-イチカ" = "……ふふ。"
"2601502-28-イチカ" = "先生がそこまで推すなら、しょうがないっすね。"
"2601502-29-イチカ" = "その代わり、やるなら一緒に！っすよ？"
"2601502-30" = "[s] \"え！私も！？\""
"2601502-31-イチカ" = "言い出しっぺじゃないっすか！"
"2601502-32-イチカ" = "付き合ってもらうっすよ！大人のかっこいいとこ見るの、楽しみっす！"
"2601502-33" = "（こうしてサーフィン教室に参加することになったが……）"
"2601502-34" = "（イチカはすぐにコツを掴んだようで……）"
"2601502-35-イチカ" = "ん～……これで合ってるっすかね……？"
"2601502-36-イチカ" = "イチカちゃんすごいよ！実は経験者？"
"2601502-37-イチカ" = "えっ、言われた通りボードに立っただけなんすけど。"
"2601502-38-イチカ" = "立つだけで数日かかる子もいるのに、一発でテイクオフできるなんて……才能あるね！"
"2601502-39-イチカ" = "は、ははは……ありがとうございます。"
"2601502-40-イチカ" = "初日は基礎の動きだけやる予定だったけど、イチカちゃんなら応用編も行けるかな？"
"2601502-41-イチカ" = "どうなっても知らないっすよ～？"
"2601502-42" = "（その後、イチカは瞬く間に波を乗りこなせるようになっていった）"
"2601502-43" = "（そして……）"
"2601502-44-イチカ" = "んん……？"
"2601502-45-イチカ" = "……なんでこんなことに？"
"2601502-46-イチカ" = "次はトリニティ所属、[ruby=なかまさ]仲正[/ruby]イチカ選手です！なんと、大会直前の駆け込み参加だとか！"
"2601502-47-イチカ" = "イチカちゃん～頑張って～！"
"2601502-48" = "[s3] \"頑張れ！イチカーっ！\"\n[s4] \"イチカちゃん！最高～！\""
"2601502-49-イチカ" = "はは……先生ってば、ノリノリじゃないすか。"
"2601502-50-イチカ" = "というか、エントリーするっていうの冗談じゃなかったなんて……。"
"2601502-51-イチカ" = "[ruby=なかまさ]仲正[/ruby]選手。大会に挑むいまのご心境は！"
"2601502-52-イチカ" = "……せいぜい海に落ちないよう、気をつけるっす～"
"2601502-53-イチカ" = "マイペースなコメントから、逆に余裕が感じられますね！"
"2601502-54-イチカ" = "……本心なんすけど。"
"2601502-55-イチカ" = "それじゃ……いってくるっす。"
"2601502-56-大会実況者A" = "おお！先ほどは謙遜していた仲正選手！かなりの実力者であることが窺えます！"
"2601502-57-大会実況者B" = "派手さこそないものの、基礎を抑えた手堅い動き！サーフィン歴はかなりのものか！？"
"2601502-58" = "（イチカは上手に波を乗りこなしていたが、惜しくもトロフィーは逃してしまった)"
"2601502-59-イチカ" = "うーん残念、イチカちゃん！これからは、いろんなテクニックを覚えていこう。そしたら完璧だよ！"
"2601502-60-イチカ" = "はは、大げさっす。"
"2601502-61-イチカ" = "次は優勝しよう！……明日のプロサーファーは君だ！なんてね！"
"2601502-62-イチカ" = "あ～……お言葉は嬉しいんすけど、今は委員会に集中したいと思ってるんで。"
"2601502-63-イチカ" = "くぅ……惜しいなぁ……これ、私の名刺！気が変わったらいつでも連絡してね！"
"2601502-64-イチカ" = "……ふぅ。"
"2601502-65-イチカ" = "不思議っすね。数時間前まで、サーフィンなんて一生やらないもんだと思ってたんすけど。"
"2601502-66" = "[s5] \"すごかったよ！イチカ！\"\n[s6] \"あとちょっとで優勝だった！\""
"2601502-67-イチカ" = "おだて上手っすね～#nちょっと練習したくらいで、優勝できるわけないっすよ。"
"2601502-68-イチカ" = "仮に私が優勝したら、他のみなさんが報われないし……。"
"2601502-69-イチカ" = "ちょうどいい結果だったんすよ。"
"2601502-70-イチカ" = "……考えすぎっすかね？"
"2601502-71-イチカ" = "そうかもっす。"
"2601502-72-イチカ" = "――でも、私が勝っても変な空気になってたし、これでいいんす。"
"2601502-73-イチカ" = "あ、もうこんな時間っすか……。"
"2601502-74-イチカ" = "おかげで楽しい暇つぶしになったっす！"
"2601502-75-イチカ" = "次に海に来たときも……うーん……。"
"2601502-76-イチカ" = "サーフィン……またやるんすかね……？分からないっす。"
"2601502-77" = "（イチカは、なにやら思い悩みながら帰っていった）"
