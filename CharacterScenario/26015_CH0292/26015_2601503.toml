[translation]
"2601503-1" = "アノニマス・ガール"
"2601503-2-イチカ" = "あれっ。"
"2601503-3-イチカ" = "先生？こんな時間に何してるっすか？"
"2601503-4-イチカ" = "……いや、全然人のこと言えないんすけど……はは。"
"2601503-5-イチカ" = "な～んか寝付けなかったんすよね～"
"2601503-6-イチカ" = "せっかくだし、夜の散歩でもしようかなって……。"
"2601503-7-イチカ" = "先生もそんな気分っすか？"
"2601503-8-イチカ" = "……ツイてたかも。"
"2601503-9-イチカ" = "や、独り言っすよ。"
"2601503-10-イチカ" = "んじゃ行きますか。"
"2601503-11-イチカ" = "……。"
"2601503-12" = "[s] \"何か悩んでるの？\""
"2601503-13-イチカ" = "……えっ？急になんすか？"
"2601503-14-イチカ" = "あ、いえ……普段あんま聞かれないんで、ちょっと驚いたっす。"
"2601503-15-イチカ" = "私、悩むキャラじゃないっすからね～"
"2601503-16-イチカ" = "まったく悩まないわけじゃないっすけど……。"
"2601503-17-イチカ" = "わざわざ相談するほどのもんでもないっす。"
"2601503-18-イチカ" = "気にしなくていいっすよ。"
"2601503-19" = "[s] \"では次の質問です！よく海に行くの？\""
"2601503-20-イチカ" = "い、いきなり普通の質問来たっすね？"
"2601503-21-イチカ" = "別にいつも行くわけじゃ……って、ここ誤魔化すとこじゃないか……。"
"2601503-22-イチカ" = "海に来たのは、はじめてっす。"
"2601503-23-イチカ" = "深い理由はないっすけどね。"
"2601503-24-イチカ" = "……うーん、なんて言えばいいのやら。"
"2601503-25-イチカ" = "正義実現委員会って、みんな真面目っていうか……。"
"2601503-26-イチカ" = "自分に厳しい？みたいな？そういう子が多いんすよ……。もちろん、みんながみんなじゃないっすけど。"
"2601503-27-イチカ" = "そう思わないっすか、先生？"
"2601503-28" = "[s1] \"確かに……。\"\n[s2] \"真面目な子が多い印象はあるかも。\""
"2601503-29-イチカ" = "楽しい学園生活も選べたはずなのに、みんな進んで巡回したりしてるんすよね。"
"2601503-30-イチカ" = "そんな中、私だけ遊びにいくのもなんかな～って。"
"2601503-31-イチカ" = "……気になることでもあったっすか？"
"2601503-32" = "[s3] \"海に来ると浮かれる子もいるけど――\"\n[s4] \"イチカは落ち着いてたからさ。\""
"2601503-33-イチカ" = "ああ……たしかに、テンションあがる子は多いっすよね。"
"2601503-34-イチカ" = "でも私は、そんな感情出すタイプじゃないんで――"
"2601503-35-イチカ" = "いや……！内心、ウキウキっすよ？"
"2601503-36-イチカ" = "……ちょっとスベってたっすかね。ははっ。"
"2601503-37-イチカ" = "自分じゃ要領いいと思ってたんすけど、私……先生にはペース狂わされっぱなしっすね……。"
"2601503-38-イチカ" = "……って、こんなことまで話しちゃうし。"
"2601503-39-イチカ" = "今まで海に行かなかったのは……ほんとに大した理由じゃないっす、ないっすけど……。"
"2601503-40-イチカ" = "……まあ、先生にならいっか。"
"2601503-41-イチカ" = "……私は、あんまり海を楽しめないんすよ。"
"2601503-42-イチカ" = "普段とちょっとだけ違う風景でしかないっていうか……。"
"2601503-43-イチカ" = "自治区の巡回や、外交業務での他校訪問……。"
"2601503-44-イチカ" = "そういう遠征の一つにすぎないっすね。"
"2601503-45-イチカ" = "海に行きたがってた後輩もいましたし、こんな私が来てよかったんすかね～"
"2601503-46-イチカ" = "……なんか暗くて申し訳ないっす。面白くなかったっすよね？"
"2601503-47" = "[s5] \"話してくれて、ありがとう。\"\n[s6] \"そう感じてたんだね。\""
"2601503-48-イチカ" = "なのに、私真面目に見えるっぽくて、委員会の中では有望株らしいんすよ？"
"2601503-49-イチカ" = "少なくとも、上の期待に応えられる人材……らしいっす。"
"2601503-50-イチカ" = "……なんか自慢っぽかったっすね。"
"2601503-51-イチカ" = "……大変じゃないのか、っすか？"
"2601503-52-イチカ" = "大変なのはみんな同じっすよ。"
"2601503-53-イチカ" = "誰だって、それぞれ「大変なこと」があるもんじゃないっすか？"
"2601503-54-イチカ" = "私からすれば、先生や先輩たちのほうがずっと大変そうっすけど。"
"2601503-55-イチカ" = "……うん？"
"2601503-56-イチカ" = "いつの間にか、面談になってないすか……？"
"2601503-57" = "[s7] \"な、なんのこと？\"\n[s8] \"バレたか……！\""
"2601503-58-イチカ" = "やっぱ……先生には調子狂わされるんすよね～"
"2601503-59-イチカ" = "イヤじゃないっすよ？むしろ有難いっす。"
"2601503-60-イチカ" = "……ただ、隠し事ができなくなるっていうか。"
"2601503-61-イチカ" = "……いろいろ話せて、スッキリしたっす！"
"2601503-62-イチカ" = "今日はぐっすり眠れそうっすね。"
"2601503-63-イチカ" = "ありがとうございます！"
"2601503-64" = "（その後、イチカともう少し海辺を歩いてから、宿に戻った）"
