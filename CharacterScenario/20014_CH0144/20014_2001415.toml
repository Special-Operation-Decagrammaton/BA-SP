[translation]
"2001415-1" = "ウサギと聖＜軍事＞書"
"2001415-2" = "（サキの本が、テーブルの上にあった）"
"2001415-3-サキ" = "先生、本はあったか？"
"2001415-4-サキ" = "公園中を探しても見当たらなくて……。"
"2001415-5" = "[s] \"これ？\""
"2001415-6-サキ" = "ああ、それだ！"
"2001415-7-サキ" = "そいつを探してたんだ！"
"2001415-8" = "[s] \"何の本なの？\""
"2001415-9-サキ" = "ふふ、驚くなよ？"
"2001415-10-サキ" = "これはただの本ではないんだ。"
"2001415-11-サキ" = "――ここを見てくれ！"
"2001415-12-サキ" = "すごいだろう？"
"2001415-13" = "[ns] \"普通の本に見えるけど……？\""
"2001415-14-サキ" = "なっ……これは、SRTの生徒に配られる教範なんだぞ！"
"2001415-15-サキ" = "SRTで求められる基本事項や戦術の基礎が書かれた――"
"2001415-16-サキ" = "門外不出の一冊だ。#nまぁ、先生なら見ても構わないけど……。"
"2001415-17" = "[s] \"メモと付箋がぎっしり……。\""
"2001415-18-サキ" = "ああ。入学式までに読み込んでいたからな。"
"2001415-19-サキ" = "その後も、時間を見つけては復習している。"
"2001415-20" = "[s] \"「校内を複数人で移動する際は、歩調を合わせること」って書いてあるね。\""
"2001415-21-サキ" = "それは代表的な校則だな。"
"2001415-22-サキ" = "今でも、相手の歩調を見るのが癖になっている。"
"2001415-23-サキ" = "あの頃はよく叱られたな……。"
"2001415-24" = "[s] \"でもこの前、普通に歩いてなかった？\""
"2001415-25-サキ" = "ああ、橋を渡るときだろう？"
"2001415-26" = "[s] \"そういえばそうだったかも。\""
"2001415-27-サキ" = "ふふん、それも教範からの教えだ。"
"2001415-28-サキ" = "橋の固有振動数と、行軍の歩調が合うと……"
"2001415-29-サキ" = "共振を起こし、設計の古い吊り橋などは崩れる可能性がある。"
"2001415-30-サキ" = "どうだ！SRTの教えは抜かりがないだろう？"
"2001415-31" = "[s1] \"そんなことで橋が！？\"\n[s2] \"すごいね！\""
"2001415-32-サキ" = "先生も読むか？"
"2001415-33" = "[ns3] \"あれ、後ろのメモ欄になにか書いてある……\"\n[ns4] \"どれどれ……「シャーレの先生という人が来た」\""
"2001415-34-サキ" = "なっ……！？"
"2001415-35-サキ" = "（……当時は日記代わりにしていたんだった！）"
"2001415-36" = "[s] \"「大人は信用できない」\""
"2001415-37-サキ" = "そ、それは……昔の話で！"
"2001415-38-サキ" = "……って、じっくり読みすぎだろ！"
"2001415-39" = "[s] \"「優しそうだけど、絶対に下心がある」\""
"2001415-40-サキ" = "や、やめろ！返せってば！"
"2001415-41" = "[s] \"「でも……本当に良い人かも」\""
"2001415-42-サキ" = "読むな！！"
"2001415-43" = "（目を覚ますと、サキは消えており……）"
"2001415-44" = "（頬にサキの字で「バカ！」と書かれていた）"
