[translation]
"2600805-1" = "私、すっごい欲張りなんです！"
"2600805-2" = "（楽しみ半分不安半分で、シズコとの待ち合わせ場所に到着した）"
"2600805-3-シズコ" = "いらっしゃいませ！"
"2600805-4-シズコ" = "「百夜堂」直営店、海の家へようこそ！"
"2600805-5" = "[s] \"シズコ、お待たせ。\""
"2600805-6-シズコ" = "とんでもございません！"
"2600805-7-シズコ" = "それではせっかくお越しいただいたことですし、シズコが直接サービスさせていただきます！"
"2600805-8-シズコ" = "まずは、ドジっ子サービスからいかがですか？"
"2600805-9" = "[s1] \"ど、どうしようかな……。\"\n[s2] \"ドジっ子サービス、何だか懐かしい……。\""
"2600805-10" = "（その後、シズコから盛大にサービスをしてもらった）"
"2600805-11" = "（気が付いた頃には、もう夕方になっており……）"
"2600805-12-シズコ" = "どうでしたか、先生！"
"2600805-13-シズコ" = "あ、今はご主人様と呼んだ方が良いかもしれませんね？"
"2600805-14-シズコ" = "先生で大丈夫……？そうですか、了解です。"
"2600805-15-シズコ" = "ところで、感想は……！"
"2600805-16" = "[s] \"これぞ百夜堂だなって感じがして、すごく良かったと思う。\""
"2600805-17-シズコ" = "そ、そうでしたか！"
"2600805-18-シズコ" = "それは何よりです！"
"2600805-19" = "[s] \"悩みは解決した？\""
"2600805-20-シズコ" = "……。"
"2600805-21-シズコ" = "そうですね、何と言いましょうか……。"
"2600805-22-シズコ" = "……全部、先生のおかげです。"
"2600805-23-シズコ" = "おかげで忘れていたことを、思い出しました。"
"2600805-24-シズコ" = "それに、何をするべきなのかも。"
"2600805-25" = "[s] \"大したことはしてないよ。\""
"2600805-26-シズコ" = "ふふっ。何となく、そう言うんじゃないかと思ってました。"
"2600805-27-シズコ" = "そんな先生じゃなかったら…… "
"2600805-28-シズコ" = "私は今でもずっと、迷走してばかりだったかもしれません。"
"2600805-29-シズコ" = "はいっ、恥ずかしいお話はここまで！"
"2600805-30-シズコ" = "明日からは、いつもの[ruby=かわわ]河和[/ruby]シズコです！"
"2600805-31-シズコ" = "ささっ、仕切り直しですよ！"
"2600805-32" = "[s] \"し、シズコ？ちょっと待っ――\""
"2600805-33" = "[wa:750]― 先生。[wa:1450]私、[wa:1150]自分のするべきことが分かりました。"
"2600805-34" = "― 考えてみれば[wa:600]当たり前のことなのに、"
"2600805-35" = "― 今になって気づくとは……[wa:1800]シズコ、[wa:800]一生の不覚！"
"2600805-36" = "[wa:400]― 知ってるかもしれませんが、"
"2600805-37" = "― 私って[wa:400]欲張りなんですよ？"
"2600805-38" = "[wa:50]― やりたいことも、[wa:950]欲しい物もたくさんありますが、"
"2600805-39" = "[wa:50]― 一つも諦めません。"
"2600805-40" = "[wa:250]― みんなを[wa:350]喜ばせることも、[wa:1650]商売としての成功も！"
"2600805-41" = "[wa:100]― 百夜堂を、[wa:1150]キヴォトスいちの喫茶店にすることも！"
"2600805-42" = "[wa:450]― 私、[wa:1250]全部逃したくないんです！[wa:1800]全部！"
"2600805-43" = "― もちろん……[wa:1350]先生のことも！"
"2600805-44-シズコ" = "まずは、フランチャイズ化について色々見直そうと思います。"
"2600805-45-シズコ" = "新メニューもどんどん開発して、ドジっ子サービスもどんどん取り入れて……。"
"2600805-46-シズコ" = "たくさん勉強して、これだと決めつけず、色んなことを学ばねばなりません。"
"2600805-47-シズコ" = "この先に、何が私を待ち受けているのか……"
"2600805-48-シズコ" = "想像するだけで、ワクワクが止まりませんね！"
"2600805-49-シズコ" = "大事なことは忘れず、それでもできることはたくさん試して……"
"2600805-50-シズコ" = "やるべきことを、全部やって！"
"2600805-51-シズコ" = "それで改めて、この群島を私のフランチャイズで全部埋め尽くしてやるんです！"
"2600805-52-シズコ" = "そしたら……"
"2600805-53-シズコ" = "その平和で穏やかで、贅沢な海の景色を……先生にプレゼントしてあげますね！！"
"2600805-54" = "[s] \"それは、本当にすごいね。\""
"2600805-55" = "[s] \"私がそんな、盛大なプレゼントを貰っても良いのかな……？\""
"2600805-56-シズコ" = "先生がどう思うかは、この際関係ありません！"
"2600805-57-シズコ" = "この私、[ruby=かわわ]河和[/ruby]シズコが！そうすると決めたんです！"
"2600805-58-シズコ" = "ただそれだけです！"
"2600805-59-シズコ" = "私が決めて、私が努力して……私がそれを叶える！"
"2600805-60-シズコ" = "その時先生が楽しんでくれたら……"
"2600805-61-シズコ" = "私はそれだけで、すっごく嬉しいので！"
"2600805-62" = "[s] \"……やっぱり、シズコはすごいね。\""
"2600805-63-シズコ" = "ふふっ！"
"2600805-64-シズコ" = "もっともっと、褒めても良いんですよ？褒められるとさらに伸びるので！"
"2600805-65-シズコ" = "私も百夜堂も、この海の家も！この先もっともっと、成長していきますから！！"
