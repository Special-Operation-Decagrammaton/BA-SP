[translation]
"2601305-1" = "最後に撮ったもの"
"2601305-2" = "（被写体探し中のアツコに連絡をもらい、お祭り会場へ向かった）"
"2601305-3-アツコ" = "こんにちは、先生。"
"2601305-4-アツコ" = "来てくれて、ありがとう。"
"2601305-5-アツコ" = "残りのバッテリーで何を撮るか、一人じゃ決められなくて。"
"2601305-6-アツコ" = "先生にアドバイスをもらいたかったの。"
"2601305-7" = "[s1] \"うーん、何が良いかな……。\"\n[s2] \"……難しいね。\""
"2601305-8-アツコ" = "それなら、まずは会場を見て回るとか？"
"2601305-9-アツコ" = "歩いてるうちに、何か見つかるかもしれない。"
"2601305-10-アツコ" = "……どう、かな？"
"2601305-11" = "[s] \"よし、そうと決まったら頑張るよ！\""
"2601305-12-アツコ" = "ふふ、私も頑張る。"
"2601305-13-ヘルメット団員" = "金魚すくい、今ならすぐできますよー！"
"2601305-14-アツコ" = "わあ、金魚がいっぱい。"
"2601305-15-アツコ" = "きれいだね、先生。"
"2601305-16" = "[s] \"撮ってみる？\""
"2601305-17-アツコ" = "……ううん。#nもう少しほかのところも見ておきたい。"
"2601305-18-アツコ" = "行こう、先生。"
"2601305-19-ヘルメット団A" = "ヘルメット団のダンスステージが始まるぞ！"
"2601305-20-ヘルメット団A" = "私たちのパフォーマンスを見逃すなんて、もったいない！"
"2601305-21" = "[ns] \"ダンスステージだってよ、アツコ！\""
"2601305-22-アツコ" = "バッテリーに余裕があったら、撮りたかったけど……。"
"2601305-23-アツコ" = "……最後の1枚かもしれないから。"
"2601305-24-アツコ" = "もっと良いシャッターチャンスを探したい。"
"2601305-25-アツコ" = "あっちに行ってみよう、先生。"
"2601305-26-アツコ" = "素敵な砂のお城があるよ。"
"2601305-27-アツコ" = "私の身長と同じくらい……すごい。"
"2601305-28-アツコ" = "……けど、これでもない。"
"2601305-29" = "[s] \"それじゃあ、もう少し探そっか。\""
"2601305-30" = "（その後も、最後の1枚に相応しいものを探し回ったが……）"
"2601305-31" = "（納得のいくシャッターチャンスは見つからず……）"
"2601305-32-アツコ" = "……日が暮れちゃったね。"
"2601305-33-アツコ" = "結局、何を撮るか決められなかった。"
"2601305-34" = "[s3] \"大丈夫だよ、夜もお祭りはやってるから！\"\n[s4] \"フラッシュを使えば撮れるよ！\""
"2601305-35-アツコ" = "……このカメラ、古いからフラッシュが壊れてるの。"
"2601305-36-アツコ" = "だから、もう何も……。"
"2601305-37-アツコ" = "……付き合ってもらったのに、ごめん。"
"2601305-38-アツコ" = "……あっ。"
"2601305-39-アツコ" = "花火……。"
"2601305-40" = "[s] \"……本当だ、きれいだね。\""
"2601305-41-アツコ" = "花火のこと、すっかり忘れてた。"
"2601305-42-アツコ" = "……そうだ、これなら。"
"2601305-43" = "[ns] \"最後の1枚は、花火にしたんだね。\""
"2601305-44-アツコ" = "えっ……う、うん。"
"2601305-45-アツコ" = "……ふふ、良い写真が撮れた。"
"2601305-46-アツコ" = "ありがとう、[ruby=・   ・]先生[/ruby]。"
"2601305-47" = "[ns] \"私も見たいな。\""
"2601305-48-アツコ" = "……だ、ダメ。"
"2601305-49-アツコ" = "これは、私だけの宝物だから。"
"2601305-50-アツコ" = "けど……いつか、見せてあげるね。"
