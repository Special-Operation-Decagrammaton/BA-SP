[translation]
"2601302-1" = "形がなくとも残るもの"
"2601302-2-アツコ" = "あ、[USERNAME]先生。"
"2601302-3-アツコ" = "こんにちは。"
"2601302-4" = "[s1] \"こんにちは、何だか楽しそうだね。\"\n[s2] \"何か良いことでもあった？\""
"2601302-5-アツコ" = "そう見える？"
"2601302-6-アツコ" = "いつもと変わってない、つもりだったけど……。"
"2601302-7-アツコ" = "顔に出ちゃってたのかな。"
"2601302-8-アツコ" = "……たしかに、ちょっと浮かれてるかもしれない。#nお祭りの熱気もだけど……。"
"2601302-9-アツコ" = "「アウトロービーチ」では、逃げたり隠れたりする必要もないし……。"
"2601302-10-アツコ" = "あと、このカメラがあるから。"
"2601302-11-アツコ" = "写真を撮るの、楽しくて。"
"2601302-12-アツコ" = "大切な瞬間を、切り取っておけるのが。"
"2601302-13-アツコ" = "だから今日は、良い写真が撮れそうな場所を探したいの。"
"2601302-14-アツコ" = "先生、一緒に来てくれる？"
"2601302-15" = "[s] \"もちろんだよ。\""
"2601302-16-アツコ" = "じゃあ、行こう。"
"2601302-17-アツコ" = "とりあえず、たくさん撮ってみようと思う。"
"2601302-18-アツコ" = "このデジタルカメラは、#nブラックマーケットで運良く手に入れたの。"
"2601302-19-アツコ" = "古いけど、まだまだ使えるはず。"
"2601302-20-アツコ" = "あっ……先生、見て。"
"2601302-21-アツコ" = "あそこの看板、良いな。"
"2601302-22" = "[s] \"看板……？\""
"2601302-23-アツコ" = "「焼きそば」、「かき氷」、「とうもろこし」……。"
"2601302-24-アツコ" = "あとで写真を見返したら、#nきっとこの鉄板の音も美味しそうな匂いも……。"
"2601302-25-アツコ" = "きっと、思い出せると思う。"
"2601302-26-アツコ" = "次、行こう。"
"2601302-27-アツコ" = "……風が気持ち良いね。"
"2601302-28-アツコ" = "あっ、先生。そこ、気をつけて。#n今、ヤドカリさんを踏みそうになってたよ。"
"2601302-29" = "[s] \"わっ、危なかった……。\""
"2601302-30-アツコ" = "ふふ、小さくて可愛いね。"
"2601302-31-アツコ" = "助けてあげたお礼に、写真撮らせてもらっても良いかな。"
"2601302-32-アツコ" = "うん、これで良し。#nありがとう、ヤドカリさん。"
"2601302-33-アツコ" = "ここは危ないから、海のほうに戻ってね。"
"2601302-34-アツコ" = "この写真も、思い出に……。"
"2601302-35-アツコ" = "次は、何を撮ろうかな。"
"2601302-36" = "（その後も、アツコと一緒に近くを散策した）"
"2601302-37-アツコ" = "もう、こんな時間……。"
"2601302-38" = "[s3] \"夕焼けがきれいだね。\"\n[s4] \"最後に、夕焼けの写真を撮ってみない？\""
"2601302-39-アツコ" = "良いと思――"
"2601302-40-アツコ" = "あっ！"
"2601302-41-アツコ" = "……！"
"2601302-42-アツコ" = "……良かった。#n砂の上に落ちたから、無事みたい。"
"2601302-43-アツコ" = "あ、バッテリーカバーが開いちゃってる。"
"2601302-44-アツコ" = "砂、入ってないと良いな……。"
"2601302-45-アツコ" = "……あれ。"
"2601302-46" = "[s] \"バッテリーが……。\""
"2601302-47-アツコ" = "……バッテリー、入ってなかったんだ。"
"2601302-48-アツコ" = "それで画面が映らなかったんだね。#n古いカメラだから、そういうものなんだと思ってたけど……。"
"2601302-49-アツコ" = "じゃあ、撮った写真は……。"
"2601302-50" = "[s] \"……たぶん。\""
"2601302-51-アツコ" = "……今日、とっても楽しかったのに、無駄だったのかな。"
"2601302-52-アツコ" = "バッテリーを入れ忘れたせいで、何も残せなかったなんて。"
"2601302-53-アツコ" = "看板も、ヤドカリさんも……。"
"2601302-54-アツコ" = "先生と過ごした思い出が、全部……。"
"2601302-55" = "[s] \"無駄なんかじゃないよ。\""
"2601302-56-アツコ" = "……そう、なの？"
"2601302-57-アツコ" = "でも、写真は一枚も残ってないよ？"
"2601302-58-アツコ" = "いつか、思い出を振り返れるように、頑張ったのに……。"
"2601302-59" = "[s] \"写真がなくても、記憶には残るから。\""
"2601302-60" = "[ns] \"今日が楽しかった事実は変わらないでしょ？\""
"2601302-61-アツコ" = "……そっか。"
"2601302-62-アツコ" = "楽しかった思い出は、どれもしっかり残ってる。"
"2601302-63-アツコ" = "こうして先生とお話してる時間も、絶対に忘れない。"
"2601302-64-アツコ" = "……ありがとう、先生。#n今日も、勉強になったよ。"
"2601302-65" = "[s] \"次は私も、予備のバッテリーを持ってくるね。\""
"2601302-66-アツコ" = "ふふ。"
"2601302-67-アツコ" = "それじゃあ、またお祭りに来よう。"
"2601302-68-アツコ" = "次は、私も忘れないようにするから。"
