[translation]
"2003405-1" = "幸運を迎えるために"
"2003405-2-アカリ" = "「年越しうどん」をご存じですか？"
"2003405-3" = "[s] \"「年越しそば」ではなく？\""
"2003405-4-アカリ" = "ええ、「年越しうどん」です。"
"2003405-5-アカリ" = "数ある「年越しうどん」の中でも、噂で聞いたそのうどんは格別らしく……"
"2003405-6-アカリ" = "ネットにはバイラル広告が多いから気をつけて、ですか？フフ、それはそうですが……。"
"2003405-7-アカリ" = "私はレビュー10件の星5より、レビュー500件の星4の評価を信じるほうなんです★"
"2003405-8-アカリ" = "その年越しうどんの評価は……星4.3にレビュー872件でした。"
"2003405-9" = "[s] \"それは期待できそうだね！\""
"2003405-10-アカリ" = "あ、新しいレビューが投稿されてますね。"
"2003405-11-アカリ" = "「普通のうどんより麺が少し厚くて、ぷりぷりしてて、滑らか」"
"2003405-12-アカリ" = "「シンプルで、基本に立ち返った味」"
"2003405-13-アカリ" = "「スープは少し薄味だが、薬味がたっぷり」"
"2003405-14-アカリ" = "「新年の縁起物だからかな……ピンクのおでんとエビフライの組み合わせ。天ぷらが美味しかった」"
"2003405-15" = "[s1] \"評判が良さそうだね。\"\n[s2] \"どこで売ってるの？\""
"2003405-16-アカリ" = "それが、ここからちょっと遠いサービスエリアだそうです。"
"2003405-17-アカリ" = "車で移動しても、2時間くらいはかかる場所で。"
"2003405-18-アカリ" = "辺鄙なところにあるせいか、直通鉄道も通ってないと聞きました。"
"2003405-19" = "[s] \"困ったなぁ、どうやって行こう？\""
"2003405-20-アカリ" = "フフ……"
"2003405-21-アカリ" = "なので、借りてきました！"
"2003405-22" = "[s3] \"……えっ……。\"\n[s4] \"これ……「借り」たんだよね……？ \""
"2003405-23-アカリ" = "はい！「借り」ましたよ★"
"2003405-24-アカリ" = "用事が済んだらちゃんと元の場所に戻しておきますので、心配しないでください★"
"2003405-25" = "[s] \"それ借りたって言えるの！？\""
"2003405-26-アカリ" = "着きました！あのサービスエリアです。"
"2003405-27-アカリ" = "ん～なんか退屈ですね……"
"2003405-28-アカリ" = "……ちょっと、刺激が足りてないかもしれません★"
"2003405-29" = "[s] \"う、うどん！早くうどんを食べよう！ \""
"2003405-30-アカリ" = "フフッ、そんなに急がなくても。先生も楽しみにされていたんですね★"
"2003405-31-アカリ" = "えーと、地図によりますと……こっちです。"
"2003405-32-店主" = "へいおまち！年越しうどんです！"
"2003405-33-アカリ" = "いただきます。"
"2003405-34" = "[s] \"いただきます～\""
"2003405-35-アカリ" = "うん……"
"2003405-36-アカリ" = "……。"
"2003405-37-アカリ" = "美味しいですね！"
"2003405-38" = "[s] \"これまで食べてきたうどんと、なんか違う！\""
"2003405-39-アカリ" = "冷たい麺に温かいスープを注いだ直後に出されたからでしょうか。"
"2003405-40-アカリ" = "麺がひんやりしていて、コシが保たれてます。"
"2003405-41-アカリ" = "普通のうどんより麺が太いので、弾力を維持したまま茹でるのは容易ではなかったはず。"
"2003405-42-アカリ" = "なのにそれを見事に成し遂げた……このお店は、本物ですね。"
"2003405-43-アカリ" = "薄味のスープが薬味と麺の味をさらに引き立てていて……おでんもエビフライも、なかなかの絶品です。"
"2003405-44" = "[s] \"今のアカリ、別人みたい！\""
"2003405-45-アカリ" = "フフッ……一応私も、美食研究会の一員ですよ？"
"2003405-46-アカリ" = "個人的には、たくさん食べられるボリュームの多いものが好みですが……"
"2003405-47-アカリ" = "「美食」の概念なら、理解していますので。"
"2003405-48-アカリ" = "……もちろん[ruby=ナンバーワン]第一人者[/ruby]への道のりは、まだまだ遠いですけどね。"
"2003405-49" = "[s] \"アカリはそのままでいいと思うよ。\""
"2003405-50-アカリ" = "フフ、ありがとうございます。"
"2003405-51-アカリ" = "でもやはり……"
"2003405-52-アカリ" = "……この量では物足りなく感じてしまいますね……。"
"2003405-53" = "[s] \"……そうだろうと思った。\""
"2003405-54-アカリ" = "お二方も、うどんツアーに来られたんですか？"
"2003405-55-アカリ" = "うどんツアー？"
"2003405-56-店主" = "この辺はうどんが有名でして……地域全体でたくさんのうどん屋が営業されているんです。"
"2003405-57-店主" = "聞いたところによりますと、コンビニの数よりうどん屋の数のほうが多いとか……。"
"2003405-58-アカリ" = "……！"
"2003405-59-店主" = "地域内で特に名が知られている店や、隠れ名店を巡回することを……"
"2003405-60-アカリ" = "「うどんツアー」と呼ぶんですね！"
"2003405-61-店主" = "そ、そうです。地域の観光案内ホームページにうどん屋の紹介が載ってありますので、よろしければご覧になってください。"
"2003405-62-店主" = "そんな素敵なツアーがあったなんて★"
"2003405-63-アカリ" = "先生、聞きましたよね？"
"2003405-64" = "[s5] \"……うん、聞いたよ。\"\n[s6] \"アカリの次のセリフ、分かるかも……。\""
"2003405-65-アカリ" = "早速、うどんツアーに行きましょう！"
"2003405-66" = "[s] \"分かった……。\""
"2003405-67" = "（そうして、アカリとのうどんツアーが始まった）"
"2003405-68" = "（……途中から何軒目か分からなくなり、数えることを諦めた……）"
"2003405-69" = "（地域内の有名店を制覇した人には認定証が贈呈されるというホームページの告知文をみたアカリは……）"
"2003405-70" = "（さらに目を輝かせ、うどんツアーに没頭するのであった……！）"
"2003405-71" = "[ns] \"ねえ、アカリ……。\""
"2003405-72-アカリ" = "先生？どうかされましたか？"
"2003405-73-アカリ" = "フフッ……うどん屋の制覇、やらないとダメなのか、ですか？"
"2003405-74-アカリ" = "……。"
"2003405-75-アカリ" = "ご存知ですか？先生。年越しそばは、食べ残すと不運が訪れるとされています。"
"2003405-76" = "[s] \"そんな話、あったっけ……？\""
"2003405-77-アカリ" = "だから年越しそばを食べるときは、せめて麺だけでもきれいに食べ切ることが大事なんです。"
"2003405-78-アカリ" = "……私たちは今、年越しうどんを食べに来てます。"
"2003405-79-アカリ" = "うどんを残したら……つまり、すべてのうどんを制覇しなければ……！"
"2003405-80-アカリ" = "新年に何か、良くないことが起きてしまうのではないでしょうか★"
"2003405-81" = "[s] \"思う存分うどんを食べたいがためのこじつけじゃ！？\""
"2003405-82-アカリ" = "まさか★私をなんだと思ってるんですか★"
"2003405-83" = "（アカリとのうどんツアーは日が暮れるまで続き……）"
"2003405-84" = "（私たちは……遂に……！）"
"2003405-85-アカリ" = "やりました、先生！うどん制覇認定証です！"
"2003405-86" = "[s7] \"本当に制覇しちゃったね……。\"\n[s8] \"こうなると予想はしてたけど！\""
"2003405-87-アカリ" = "ところで、もうこんな時間に……"
"2003405-88-アカリ" = "……どうしましょう、先生？"
"2003405-89-アカリ" = "私……夜間運転は少し、自信がなくて……。"
"2003405-90" = "（その後、運転代行を呼んでアカリを送り届けた）"
"2003405-91" = "（うどんの消化は大変だった……）"
