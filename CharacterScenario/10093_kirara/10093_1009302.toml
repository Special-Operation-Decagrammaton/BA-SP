[translation]
"1009302-1" = "キララの部活"
"1009302-2" = "（ゲヘナでの用事を終えた後、帰路で楽しそうに話している生徒が目に入った）"
"1009302-3" = "[ns] （楽しそうだな……）"
"1009302-4-キララ" = "あ、私らはこっちだから！#nまたね、キララ！"
"1009302-5-キララ" = "まったね～！"
"1009302-6-キララ" = "あれ？"
"1009302-7-キララ" = "[USERNAME]先生じゃん、はろはろ～！"
"1009302-8-キララ" = "お仕事の帰り？あたしもちょうど帰り道！"
"1009302-9" = "[s] \"一緒にいた子はお友達？\""
"1009302-10-キララ" = "そだよ～！さっき会ったばっかだけど！"
"1009302-11" = "[s1] \"さっき会ったばっか……？\"\n[s2] \"すごく仲良さそうだったけど！？\""
"1009302-12-キララ" = "いつ出会ったかなんて、あんま重要じゃなくない？"
"1009302-13-キララ" = "楽しければそれで良いの♪"
"1009302-14-キララ" = "先生とも、もうマブダチだと思ってるんだけど？"
"1009302-15" = "[s] \"これが、陽キャ……！\""
"1009302-16-キララ" = "あははっ、何それウケる！"
"1009302-17-キララ" = "っていうかそれ……もしかして、嫉妬？"
"1009302-18-キララ" = "あはっ！ごめんごめん♪一緒に帰るから拗ねないでよ～。"
"1009302-19-キララ" = "その時にさ、コンビニで急に――"
"1009302-20-キララ" = "あっ、あたしこっちだった！んじゃね！"
"1009302-21-キララ" = "今日も楽しかったよ～！ありがとね、先生♪"
"1009302-22" = "[s] \"ふと気になったんだけど……。\""
"1009302-23-キララ" = "え？なになに～？"
"1009302-24" = "[s3] \"キララは部活とか入らないの？\"\n[s4] \"この時間に帰るってことは、どこにも入ってないのかなって。\""
"1009302-25-キララ" = "あははっ、真面目な顔するから何かと思った！"
"1009302-26-キララ" = "んー……一応あたし、部活入ってるよ？"
"1009302-27-キララ" = "まあでも、確かにふつーの「帰宅部」に見えるかもね？"
"1009302-28-キララ" = "ふふん、先生には教えてあげちゃおっかな♪"
"1009302-29-キララ" = "実はちょっと前までは、ほんとに帰宅部だったんだけど……。"
"1009302-30-キララ" = "あたしの所属してる部活、その名は――"
"1009302-31-キララ" = "「キラキラ部」！"
"1009302-32" = "[s] \"キラキラ……部？\""
"1009302-33-キララ" = "すんごいワクワクして～#nめーっちゃキラキラしてる部活！"
"1009302-34" = "[s] \"な、なるほど……？\""
"1009302-35-キララ" = "普通の部活動も良いんだけど、あたしにはちょーっと合わないかなって。"
"1009302-36-キララ" = "毎日同じ活動してると、同じ人と会うことになるでしょ？"
"1009302-37-キララ" = "それはそれで楽しそうだけどー……#nあたしは、もーっと色んな人と会いたいの！"
"1009302-38-キララ" = "だから、そういう部活作ったんだ♪"
"1009302-39-キララ" = "昨日までは知りもしなかったような、新しい人とお友達になったり……。"
"1009302-40-キララ" = "そのままフードコートに寄っておしゃべりしたり……服買いに行ったり……。"
"1009302-41-キララ" = "歌いたいな～！って思ったら、そのまますぐにカラオケに行ったり……。"
"1009302-42-キララ" = "そうやって、色んなことして遊ぶの♪"
"1009302-43-キララ" = "もちろん、絶対に初対面である必要もないし、#n買い物やカラオケじゃなくても良いんだけど～。#n「とりあえず、楽しく！」が第一かな♪"
"1009302-44-キララ" = "それがあたし達「キラキラ部」のモットー！"
"1009302-45-キララ" = "めっちゃキラキラワクワクしてない？"
"1009302-46" = "[s] \"うん、キララらしくて良いね。\""
"1009302-47-キララ" = "あははっ、そうかな？"
"1009302-48-キララ" = "ま、好き勝手やってるだけだよ。#n先生も、好き勝手にやりたいことしてみない？"
"1009302-49-キララ" = "あーでも、先生は先生だからダメか！あははっ！"
"1009302-50-キララ" = "今日も楽しかったなー♪"
"1009302-51-キララ" = "んー？何でって……。"
"1009302-52-キララ" = "だってほら、先生とおしゃべりできたじゃん♪マジラッキー！"
"1009302-53-キララ" = "先生はどーだった？"
"1009302-54" = "[s] \"私もキララのことをもっと知れて、楽しかったよ。\""
"1009302-55-キララ" = "あははっ、良いね良いね！"
