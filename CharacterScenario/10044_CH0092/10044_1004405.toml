[translation]
"1004405-1" = "砂上に輝く星"
"1004405-2" = "（あまり寝付けず、少し風に当たろうと外に出た）"
"1004405-3" = "（みんな寝ているからか、夜のしじまに虫の鳴き声だけが響いている）"
"1004405-4" = "[ns1] \"誰か起きてるのかな……？\"\n[ns2] 音がした方に歩いていく。"
"1004405-5-？？？" = "もしかしてと思っていましたが、やっぱり先生でしたか。"
"1004405-6" = "[s3] \"あっ、やっぱり。\"\n[s4] \"この声は……！\""
"1004405-7-ノノミ" = "ふふふ。びっくりさせようと思って、隠れてました♡"
"1004405-8-ノノミ" = "こんな夜中にどうされました？"
"1004405-9-ノノミ" = "何かご用事が……？"
"1004405-10" = "[s5] \"ノノミについてきたんだ。\"\n[s6] \"眠れなくて、風に当たりにきたんだ。\""
"1004405-11-ノノミ" = "ふぅん……そうなんですか。"
"1004405-12-ノノミ" = "ふぅん……そうなんですか。"
"1004405-13-ノノミ" = "ふふっ。実は私もなかなか眠れなくて。"
"1004405-14-ノノミ" = "……せっかくですし……少し一緒に歩きませんか？"
"1004405-15-ノノミ" = "う～ん……。"
"1004405-16-ノノミ" = "……うんうん。"
"1004405-17" = "[s7] \"……ノノミ？\"\n[s8] \"どうしたの？\""
"1004405-18-ノノミ" = "いえ……何でもありません。"
"1004405-19-ノノミ" = "ただ……眠れない理由について考えていました。"
"1004405-20-ノノミ" = "なんというか……少しもったいないというか。"
"1004405-21-ノノミ" = "このまま寝て、起きたらもう明日になっちゃうでしょ？"
"1004405-22-ノノミ" = "そうしたら、ここに居られる大切な一日がどんどん消えて無くなってしまう気がして……。"
"1004405-23-ノノミ" = "本当に、ここに来てからは楽しいんです。だから、帰る日が近づくにつれて、切ない気持ちが強くなってしまって……"
"1004405-24-ノノミ" = "自分で話してて、まとまりがないですね。あはは……。"
"1004405-25-ノノミ" = "……あれ？"
"1004405-26-ノノミ" = "先生、どちらへ……？"
"1004405-27-ノノミ" = "見せたいもの……？"
"1004405-28-ノノミ" = "でもそっちには海しか……"
"1004405-29-ノノミ" = "夜も遅いですし、そろそろ戻ったほうが……。"
"1004405-30-ノノミ" = "……うん？"
"1004405-31-ノノミ" = "先生が保護者だから大丈夫……ですか。"
"1004405-32-ノノミ" = "……確かにそうですね。"
"1004405-33-ノノミ" = "分かりました！ノノミ、保護者についていきます☆"
"1004405-34-ノノミ" = "……とうちゃ～く！"
"1004405-35-ノノミ" = "わぁ……気持ちいい……。"
"1004405-36-ノノミ" = "周囲に灯りもないから……星が綺麗に見えますね。"
"1004405-37-ノノミ" = "……先生？"
"1004405-38" = "[s] \"……ノノミ。\""
"1004405-39" = "[ns9] \"反対の方を見てみて。\"\n[ns10] \"こっちにも星があるよ。\""
"1004405-40-ノノミ" = "…………？"
"1004405-41-ノノミ" = "…………！！！"
"1004405-42" = "[wa:900]― 見てください、先生！[wa:1700]光ってます！"
"1004405-43" = "― 海がまるで[wa:1000]星空みたいです！"
"1004405-44" = "― このために、"
"1004405-45" = "― 私をここに連れてきて[wa:750]くださったんですか？"
"1004405-46" = "[wa:750]― そういえば、"
"1004405-47" = "― パンフレットにも[wa:950]書いてあったような気がします。"
"1004405-48" = "― 「夜になると[wa:1100]プランクトンが光って、[wa:1800]星のように輝く」って……"
"1004405-49" = "― 本当に、[wa:1600]綺麗ですね。"
"1004405-50" = "[ns11] \"ちょっとは元気出た？\"\n[ns12] \"切ない気持ち、少しは消えた？\""
"1004405-51" = "[wa:3300]― ……ふふっ、[wa:1600]どうでしょうね～？"
"1004405-52" = "[wa:3300]― ……ふふっ、[wa:1600]どうでしょうね～？"
"1004405-53" = "― なんて、[wa:1250]冗談です。"
"1004405-54" = "― 今夜は気持ちよく[wa:650]眠れそうです。"
"1004405-55" = "[wa:700]― ありがとうございます、[wa:1150]先生……"
"1004405-56" = "[wa:50]― 本当に、[wa:1000]夢のような一日でした。"
"1004405-57" = "[wa:50]― 私……[wa:1350]ここに来られて[wa:500]よかったです。"
"1004405-58" = "[wa:1000]― ですが、[wa:1400]もう少しだけ……。"
"1004405-59" = "― ……ほんの少しだけ、[wa:1900]一緒にいてください。"
