[translation]
"1008103-1" = "駄菓子の味は、えくせれんと！"
"1008103-2-ユカリ" = "あっ、こちらです！先生！"
"1008103-3-ユカリ" = "先ほどのお話……身共にとって、かるちゃーしょっくでしたの！"
"1008103-4-ユカリ" = "すでにしょっぱいでざーとが出回っているだなんて！#n本当ですの！？"
"1008103-5" = "[s] \"ユカリは普段、どんなデザートを食べてるの？\""
"1008103-6-ユカリ" = "そうですね……身共がいつも食べているのは……"
"1008103-7-ユカリ" = "ひんやりとした、あいすくりーむとか……"
"1008103-8-ユカリ" = "使用人の方が商店街で買ってきてくださる和菓子とか……"
"1008103-9-ユカリ" = "最近だと、れっどうぃんたー学園のぷりんやとりにてぃ特製ろーるけーき、ばくらゔぁなどもお土産でいただいたりしますの。"
"1008103-10" = "[s1] \"ちゃんとしたお菓子をたくさん食べてきたんだね。\"\n[s2] \"たしかに甘い系のお菓子ばかりだね。\""
"1008103-11-ユカリ" = "ええと……？#nそれはどういう……"
"1008103-12" = "[s] \"でもなんと、他にもいろんな味のお菓子があるんだよね。\""
"1008103-13-ユカリ" = "……！"
"1008103-14-ユカリ" = "今日は、しょっぱい系のお菓子が食べられる素敵なお店を身共に教えてくださるのですか？"
"1008103-15" = "[s] \"そういう事。さ、駄菓子屋さんに行こうか。\""
"1008103-16-ユカリ" = "……駄、菓子？"
"1008103-17-ユカリ" = "ここが先生の仰っていた、駄菓子屋さん……"
"1008103-18-ユカリ" = "先生、あそこに人が集まっております！"
"1008103-19-ユカリ" = "あれは……！"
"1008103-20-ユカリ" = "個包装のお菓子がたくさん並んでいますの……"
"1008103-21-ユカリ" = "あ！あちらには飴の入った瓶が！"
"1008103-22-ユカリ" = "その隣には揚げ菓子にらむね……これは……傘のような形の……ちょこれーと？"
"1008103-23-ユカリ" = "花火にべーごま……？"
"1008103-24-ユカリ" = "こんな物まで売っているのですか！？"
"1008103-25-ユカリ" = "このようなお店が世の中にはあるだなんて……"
"1008103-26-ユカリ" = "身共は……身共は、どうしたら良いのでしょうか！？"
"1008103-27" = "[s] \"すみません、うんめえ棒を一つください。\""
"1008103-28-店主" = "毎度あり！"
"1008103-29-ユカリ" = "毎度あり……？"
"1008103-30-ユカリ" = "先生は、毎度ここに来ているのですか……？"
"1008103-31" = "[s] \"それはここの挨拶みたいなものだよ。はいこれ、食べてみて。\""
"1008103-32-ユカリ" = "うんめえ棒……小さな棒状のお菓子、ですのね。"
"1008103-33-ユカリ" = "これぞ駄菓子の元祖であり王様、駄菓子きんぐだむ。駄菓子の頂点であり原点……？#nつまりどういうことですの！？"
"1008103-34-ユカリ" = "意味が分からないのも駄菓子の特徴……？"
"1008103-35-ユカリ" = "う～ん。よく分かりませんが先生のお勧めですから、まずは一口……"
"1008103-36-ユカリ" = "……！お、美味しいです！#nこの絶妙な甘みとすぱいしーな味わいは一体！？"
"1008103-37-ユカリ" = "「こんぽたみっくすふるーつめがまっくす味」……？"
"1008103-38-ユカリ" = "まったく意味が分かりません！"
"1008103-39" = "[s] \"でも、悪くないでしょ？\""
"1008103-40-ユカリ" = "はい！なんだか……わくわくどきどきするお味でした！"
"1008103-41-ユカリ" = "次はこれですの？#n食べると舌の色が変わる飴……？"
"1008103-42-ユカリ" = "あ！ほんほれすわ！ひたが青くらってあすの！"
"1008103-43-ユカリ" = "先生！先生！見てくださいな！#nほら、あ～～～"
"1008103-44" = "（それからもユカリは、様々な駄菓子を食べては笑顔を見せてくれた）"
"1008103-45-ユカリ" = "まさか、こんなにも色とりどりなお菓子があったなんて……"
"1008103-46-ユカリ" = "初めて知りました！#n世界は広いのですね……かるちゃーしょっくですの。"
"1008103-47" = "[s] \"まだまだ！駄菓子屋の醍醐味はここからだよ！\""
"1008103-48-ユカリ" = "まだ何かあるのですか！？"
"1008103-49-ユカリ" = "あら？#nあちらの一角に人が集まっておりますが……"
"1008103-50-子どもA" = "おーい！みんな集まって！#n格闘ゲーム大会を始めるよ！"
"1008103-51-子どもB" = "よっし！今度こそ本当の実力を見せてやるっ！"
"1008103-52-ユカリ" = "格闘……げーむ大会……？"
"1008103-53" = "[s] \"駄菓子屋さんでは、たまにゲーム大会も開かれてるんだ。\""
"1008103-54-ユカリ" = "皆様……とっても楽しそうです。"
"1008103-55-ユカリ" = "……なるほど。駄菓子屋さんとは、ただお菓子が売られているだけではない……ということですのね。"
"1008103-56" = "[s] \"楽しんでもらえたかな？\""
"1008103-57-ユカリ" = "そう、ですね……"
"1008103-58-ユカリ" = "……ふふっ。"
"1008103-59-ユカリ" = "身共には、どれも新鮮なものばかりでした。"
"1008103-60-ユカリ" = "同じ喧騒でも、この前のげーむせんたーとは違う華やかさがありますのね！"
"1008103-61-ユカリ" = "心地良い賑わいと申しましょうか……"
"1008103-62-ユカリ" = "皆様の楽しんでいる姿を見ていると、身共の心まで温かくなるような……"
"1008103-63-ユカリ" = "先生は、いつも身共に新しいことを教えてくれますのね！"
"1008103-64" = "[s3] \"でも、まだいっぱい楽しみはあるよ！\"\n[s4] \"駄菓子屋さんの楽しさ、もっと教えてあげる！\""
"1008103-65-ユカリ" = "……！"
"1008103-66-ユカリ" = "ええ……本日も身共は！"
"1008103-67-ユカリ" = "全力で学ばせていただきますの！"
"1008103-68" = "（その後も日が暮れるまで、ユカリに駄菓子屋の楽しさを共有した）"
