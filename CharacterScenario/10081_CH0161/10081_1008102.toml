[translation]
"1008102-1" = "初めてですの！"
"1008102-2-ユカリ" = "ふふっ！ユカリ、参りました！"
"1008102-3" = "[s] \"待ってたよ、ユカリ。\""
"1008102-4-ユカリ" = "ええ！せっかく先生が「一息つこう」と仰ってくださったので……"
"1008102-5-ユカリ" = "身共、居ても立ってもいられず……"
"1008102-6-ユカリ" = "早速こうしてお邪魔した次第ですの！"
"1008102-7" = "[s] \"そっか。いつも全力なユカリらしくていいね。\""
"1008102-8-ユカリ" = "うふふ！常に全力で臨むこと！#nこれもまた、身共の誇れる長所の一つですの！"
"1008102-9-ユカリ" = "ですから、今日は先生と「一息つく」ために……"
"1008102-10-ユカリ" = "身共は全力を尽くします！"
"1008102-11" = "[s1] \"本末転倒な気もするけど……。\"\n[s2] \"それなら、一緒に一息つこっか。\""
"1008102-12" = "[ns] \"まずはどうしようかな。\""
"1008102-13-ユカリ" = "何でも言ってくださいまし！"
"1008102-14-ユカリ" = "ふふ。"
"1008102-15-ユカリ" = "ふふふ。"
"1008102-16-ユカリ" = "…………ふふっ？"
"1008102-17" = "[s] \"えっと……ユカリ？\""
"1008102-18-ユカリ" = "先生！「一息つく」ために、身共は何をしたら良いのでしょうか！"
"1008102-19" = "[ns] \"……うん？\""
"1008102-20-ユカリ" = "……？"
"1008102-21-ユカリ" = "なんと！身共、勘違いしておりました！"
"1008102-22-ユカリ" = "「一息つく」とは、特に何かをするという意味ではなかったのですね！？"
"1008102-23" = "[s] \"そうだね……ちょっと休むって意味かな。\""
"1008102-24-ユカリ" = "先生のお言葉ですから、なにか特別な意味があるのかと勘違いを……！"
"1008102-25-ユカリ" = "これは身共のみすていくですわ！#n勝手な思い違いで、先生を困らせてしまい……"
"1008102-26-ユカリ" = "も、申し訳ありませんっ！"
"1008102-27" = "[s3] \"謝らなくて大丈夫だよ。\"\n[s4] \"それくらいユカリが頑張ってるって証拠だから。\""
"1008102-28-ユカリ" = "一息つく。#nただ、休むためだけに……"
"1008102-29-ユカリ" = "何も考えず、穏やかな気持ちで過ごすのですね。"
"1008102-30-ユカリ" = "う～ん……もちろん、先生のご提案はとても嬉しいのですが……"
"1008102-31-ユカリ" = "いざ改めてそのようにしようとすると、どこか落ち着かず……"
"1008102-32-ユカリ" = "何かやってみたかったこと、ですか……？"
"1008102-33-ユカリ" = "やってみたかった、こと……"
"1008102-34-ユカリ" = "む～～～！"
"1008102-35-ユカリ" = "すみません、やはり身共には……"
"1008102-36" = "[s] \"そうだ。なら、あそこに行ってみようか。\""
"1008102-37-ユカリ" = "……？"
"1008102-38" = "（ユカリと一緒に、近くのゲームセンターに足を運んだ）"
"1008102-39-ユカリ" = "あの、先生。ここは……？"
"1008102-40" = "[s] \"ゲームセンターだよ。\""
"1008102-41" = "[ns] \"こういう場所で気分転換してみたらどうかなと思って。\""
"1008102-42-ユカリ" = "げえむ、せんたあ……？"
"1008102-43-ユカリ" = "何だか騒がしいところですが……どこか華やかで……"
"1008102-44-ユカリ" = "あっ！先生！何ですの、あの方は！青白い顔でふらふらしております！"
"1008102-45-ユカリ" = "救急車を呼ばなくて良いのですか！？"
"1008102-46" = "[s] \"銃を撃ってゾンビを倒すゲームだね。やってみる？\""
"1008102-47-ユカリ" = "銃を撃って……ぞんびを倒すげーむ……？"
"1008102-48-ユカリ" = "あ、はいっ！ぜひ！"
"1008102-49-ユカリ" = "やっ！倒しました！次は……！"
"1008102-50-ユカリ" = "またぞんびの方々が！？#nあっ！あの強そうな方が総大将なのでしょうか！？"
"1008102-51-ユカリ" = "身共、負けませぬ！"
"1008102-52-ユカリ" = "わぁっ！倒せました！"
"1008102-53-ユカリ" = "なるほど……これがげーむというものなのですね！"
"1008102-54-ユカリ" = "あら？"
"1008102-55-ユカリ" = "先生先生！これは何ですの！？"
"1008102-56" = "[s] \"あ、それはクレーンゲームと言って……\""
"1008102-57-ユカリ" = "くれーんの操縦士になって、人形を誘拐するげーむ……？"
"1008102-58-ユカリ" = "みすてりあすなげーむですわね！"
"1008102-59-ユカリ" = "先生！身共、くれーんげーむもやってみたいです！"
"1008102-60" = "（ユカリと一緒に色々なゲームで遊び、楽しい時間を過ごした）"
"1008102-61-ユカリ" = "ふぅ～！先ほどのげーむも、すっごく面白かったですの！"
"1008102-62-ユカリ" = "銃を撃つげーむ……左から右に進みながら敵を倒すげーむ……りずむに合わせて矢印を踏むげーむ……それに、ばいくに乗って走るげーむ！"
"1008102-63-ユカリ" = "世の中には本当に、いろんなげーむがあるのですね！"
"1008102-64" = "[s] \"気に入ってくれたかな？\""
"1008102-65-ユカリ" = "ええ！"
"1008102-66-ユカリ" = "普段は家に[ruby=こ]籠[/ruby]もっているか、百花繚乱の活動をしているだけですので、どれも初めてだったのですが……"
"1008102-67-ユカリ" = "なるほど……他の皆様は「一息つく」ときに、こういったことをして楽しんでいるのですね。"
"1008102-68-ユカリ" = "身共、とっても気に入りましたの！"
"1008102-69" = "[s] \"一息つけたみたいで良かったよ。\""
"1008102-70-ユカリ" = "はい！"
"1008102-71-ユカリ" = "で、ですが、身共がこうして楽しむことができたのは……"
"1008102-72-ユカリ" = "……身共のために、こうして先生が……"
"1008102-73" = "[s] \"……ん？何か言った？\""
"1008102-74-ユカリ" = "いっ、いえ！何でもないですの！"
"1008102-75-ユカリ" = "さあ！今度はあちらのげーむを……！"
"1008102-76" = "（その後もユカリと様々なゲームで遊び、気分転換をした）"
