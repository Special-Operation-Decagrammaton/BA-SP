[translation]
"1008105-1" = "休みも大切ですの！"
"1008105-2-ユカリ" = "ふふっ。こんにちは、先生。"
"1008105-3" = "[s] \"こんにちは、ユカリ。準備があるから待っててね。\""
"1008105-4-ユカリ" = "ええ、分かりましたの。"
"1008105-5-ユカリ" = "それでは、こちらに失礼してっと……"
"1008105-6-ユカリ" = "ふふん～ふふっん～♪"
"1008105-7-ユカリ" = "本日は先生と～何をいたしましょう～"
"1008105-8-ユカリ" = "ふふっ、とても楽しみですの。"
"1008105-9-ユカリ" = "あら？この音は……"
"1008105-10-ユカリ" = "あっ……"
"1008105-11" = "[s] \"ユカリ？どうかしたの？\""
"1008105-12-ユカリ" = "先生……雨が……"
"1008105-13" = "（しばらく様子を見ていたが、雨は止みそうになかった）"
"1008105-14" = "[s] \"今日は一日中、雨の予報みたい。\""
"1008105-15-ユカリ" = "そう、ですか……それではお出かけは厳しそうですのね。"
"1008105-16" = "[s] \"……ごめんね、天気予報を見てなくって。\""
"1008105-17-ユカリ" = "あっ、いいえそんな……それを言うのなら、身共も同じですの。"
"1008105-18-ユカリ" = "今日は……そうですね。"
"1008105-19-ユカリ" = "大人しくそふぁに座って、先生の仕事っぷりを見守りますの！"
"1008105-20" = "[s] \"あはは、そう言ってもらえると助かるけど……\""
"1008105-21-ユカリ" = "助かる、けど……"
"1008105-22-ユカリ" = "身共の時間を無駄にしてしまったのではないかと、気にしているのですか？"
"1008105-23-ユカリ" = "先生らしいお気遣いではありますが……"
"1008105-24-ユカリ" = "そのように言われると、かえって傷つきますの。"
"1008105-25" = "[s] \"えっ……？\""
"1008105-26-ユカリ" = "今日は先生に会えると思って、身共はとってもわくわくしていました。"
"1008105-27-ユカリ" = "たとえ、どこかに出かけなくとも。#nたとえ、何もなさずとも。"
"1008105-28-ユカリ" = "屋敷から出て、先生と一緒に居るだけで……"
"1008105-29-ユカリ" = "身共には、そのどれもが斬新で……"
"1008105-30-ユカリ" = "かけがえのない時間になっておりますのよ。"
"1008105-31-ユカリ" = "今日でなくとも、明日があります。"
"1008105-32-ユカリ" = "明日でなくとも、明後日があります。"
"1008105-33-ユカリ" = "次に会ったらあれをお話ししよう、これをお話ししよう……"
"1008105-34-ユカリ" = "そんな風に会えない時間も先生のことを考えているだけで、身共は毎日がとても楽しいのです。"
"1008105-35-ユカリ" = "ですから、身共の時間を無駄にしたのではないかと思っているのなら……"
"1008105-36-ユカリ" = "それは大間違いですのよ！"
"1008105-37-ユカリ" = "身共にとって、大好きな先生と過ごす時間は宝物ですから！"
"1008105-38" = "[s] \"私もだよ。ありがとう、ユカリ。\""
"1008105-39-ユカリ" = "あら、身共は心から思っている気持ちを伝えただけですの！"
"1008105-40-ユカリ" = "それに、当たり前のことで感謝されると、少しむず痒いです。"
"1008105-41-ユカリ" = "ふんふふん～♪"
"1008105-42" = "[s] \"でもユカリの本音は、ちゃんと受け取ったから。\""
"1008105-43-ユカリ" = "それは何より……"
"1008105-44-ユカリ" = "なによ、り……"
"1008105-45-ユカリ" = "…………本音？"
"1008105-46-ユカリ" = "身共にとって、大好きな先生と過ごす時間は宝物ですから！"
"1008105-47-ユカリ" = "…………。"
"1008105-48-ユカリ" = "……………………。"
"1008105-49-ユカリ" = "（あ……あれれ――――っ！？）"
"1008105-50-ユカリ" = "（勢いに任せて、う、うっかり……本音を……？）"
"1008105-51" = "[s] \"ユカリの期待に応えられるよう、これからも頑張るね。\""
"1008105-52-ユカリ" = "え……ええ！"
"1008105-53-ユカリ" = "その……せ、先生のお言葉も！"
"1008105-54-ユカリ" = "身共、ユカリは！しっかりと受け取りましたの！"
"1008105-55" = "[s] \"ユカリ？\""
"1008105-56-ユカリ" = "ですから、この話はここまでに……これでお終いです……！"
"1008105-57" = "（その後、なぜかユカリは目を合わせてくれなかったが、雨の音に耳を傾けながら、のんびりと二人の時間を過ごした）"
