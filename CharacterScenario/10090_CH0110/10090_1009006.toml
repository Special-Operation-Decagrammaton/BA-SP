[translation]
"1009006-1" = "あなたのためのお祭り"
"1009006-2-ウミカ" = "わぁ～！先生！"
"1009006-3" = "[s1] \"あ、こんにちは。ウミカ。\"\n[s2] \"なんだか普段より……元気いっぱい、だね？\""
"1009006-4-ウミカ" = "こんにちは、先生！#n元気そう……ですか？自分ではよくわかりませんが……。"
"1009006-5-ウミカ" = "いつもよりテンションが高い、ですか？#nうーん……それは先生の気のせいじゃないですかね？えへへ。"
"1009006-6-ウミカ" = "それで、今日こうして先生をお呼びした理由は――"
"1009006-7" = "[s] \"理由は……！\""
"1009006-8-ウミカ" = "まだ、秘密です～！"
"1009006-9" = "[s] \"秘密かあ……。\""
"1009006-10-ウミカ" = "そ、そんなにガッカリしないでください！"
"1009006-11-ウミカ" = "あの……ですね、先生。"
"1009006-12-ウミカ" = "今から……私は、音を立てないように裏口から外に出ます。"
"1009006-13-ウミカ" = "先生は10数えたあと――"
"1009006-14-ウミカ" = "ゆっくり、私についてきてください。いいですか？"
"1009006-15-ウミカ" = "それでは……私は先に行きます！"
"1009006-16" = "（ウミカは静かに裏口の方へ向かった……）"
"1009006-17" = "（頭の中で10を数える……1、2、3……）"
"1009006-18" = "[ns] （裏口に行く）"
"1009006-19" = "[wa:830]― [log=우미카]お祭りへようこそ、[wa:1520]先生！[/log]"
"1009006-20" = "[wa:250]― [log=우미카]えへへ。[wa:1390]どうですか？[/log]"
"1009006-21" = "[wa:1520]― [log=우미카]今までずっと準備していたのは……[wa:2900]全部、[wa:1400]この瞬間のためでした！[/log]"
"1009006-22" = "[wa:530]― [log=우미카]誰にも知らせてないし、[wa:1880]誰も招待していません。[/log]"
"1009006-23" = "[wa:600]― [log=우미카]このお祭りは……[wa:2430]先生のためのものですから！[/log]"
"1009006-24" = "[wa:370]― [log=우미카]他に誰もいない、[wa:2260]私と先生だけのお祭り……[/log]"
"1009006-25" = "[wa:3120]― [log=우미카]ちょっと恥ずかしいですが……[wa:2880]気に入ってくれたら[wa:1710]嬉しいです！[/log]"
"1009006-26-ウミカ" = "この前、仰ってましたよね。#nシャーレのお仕事で、なかなかお祭りに行く時間がないと……。"
"1009006-27" = "[s] \"それで……このお祭りを準備してくれたの？\""
"1009006-28-ウミカ" = "はい。シャーレのお仕事で、大きなお祭りを回る時間が取れなくても……#n先生ひとりのための小さなお祭りなら楽しんでもらえるんじゃないかって。"
"1009006-29-ウミカ" = "時間的にもそうですが、これなら先生のお仕事の一環になりますし……。"
"1009006-30" = "[s] \"「いいアイデア」ってこのことだったんだね。\""
"1009006-31-ウミカ" = "えへへ、その通りです！"
"1009006-32-ウミカ" = "先生！せっかくのお祭りですから、私がすみずみまでご案内します！"
"1009006-33-ウミカ" = "まずは、この「せんせい団扇」からご覧ください！"
"1009006-34" = "[s] \"う、うん……！たしかに書かれているね。「[USERNAME]」って……。\""
"1009006-35-ウミカ" = "こちらには「せんせい串焼き」もあるんですよ！食べてみてください！"
"1009006-36" = "[s] \"普通の串焼きじゃないんだね……？\""
"1009006-37-ウミカ" = "もちろんです！こちらの串焼きはですね……。#nこれまで百夜堂で先生が注文したメニューを元に――"
"1009006-38-ウミカ" = "先生のお好みのソースを厳選して！焼いたものなんですっ！"
"1009006-39-ウミカ" = "次は「せんせいお好み焼き」を作りますね！#nお好み焼きは本来、自分の好みの具材を入れて焼くものですから――"
"1009006-40-ウミカ" = "つまり、先生の好みの具材と焼き加減で作ったら……。#nそれが、「せんせいお好み焼き」になるってことなんです！"
"1009006-41" = "[s] \"百夜堂で、好みを把握されてる！\""
"1009006-42-ウミカ" = "えへへ。百夜堂のサービスを甘く見ちゃダメですからねっ！"
"1009006-43-ウミカ" = "それに、先生のお写真を使った「せんせい綿菓子」や「せんせいヨーヨー釣り」、#n「せんせい射的」、ほかにも……！"
"1009006-44" = "[ns] \"嬉しいけど、ちょっと照れるかも。\""
"1009006-45-ウミカ" = "羽目を外しても大丈夫ですよ！ここには私たちふたりだけですから！#nあ、写真も撮ってみませんか？"
"1009006-46-ウミカ" = "それに！最後にはとっても特別なメニューも用意してますよ！"
"1009006-47-ウミカ" = "どうですか、先生？楽しんでいただけましたか？#n私が準備した「先生のためのお祭り」……。"
"1009006-48" = "[s] \"ずっと記憶に残り続けると思う……。\""
"1009006-49-ウミカ" = "ですよね、ですよね？"
"1009006-50-ウミカ" = "とっても嬉しいです。私……準備している間もずっと楽しくて――"
"1009006-51-ウミカ" = "私も、このお祭りのこと、ずっとずっと記憶に残ると思います……。"
"1009006-52" = "[s3] \"……うん。特別な思い出になったね。\"\n[s4] \"ありがとう、ウミカ。今日のことは忘れないよ。\""
"1009006-53-ウミカ" = "本当……ですか？"
"1009006-54-ウミカ" = "えへへっ。でも……まだ終わりじゃないんですよ。"
"1009006-55-ウミカ" = "「先生のためのお祭り」は、えっと、ほぼ終わりに近づきましたけど！#nまだ一大イベントが残っているんです！"
"1009006-56" = "[s] \"まだ何か準備してくれてるの？\""
"1009006-57-ウミカ" = "はい！空を見てください！先生。"
"1009006-58" = "[ns] \"花火まで準備してくれてたんだ……。\""
"1009006-59" = "はい！お祭りの締めは、やっぱり花火ですから！"
"1009006-60" = "あの……先生？"
"1009006-61" = "[s] \"うん？\""
"1009006-62-ウミカ" = "花火……お隣に座って見ても、いいですか……？"
"1009006-63-ウミカ" = "……ありがとうございます。えへへ……。"
"1009006-64" = "（ウミカはそっと隣に腰を下ろした）"
"1009006-65" = "（そうして肩を並べ、2人で打ち上げ花火を眺めた……）"
