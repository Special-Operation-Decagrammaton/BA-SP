[translation]
"1009002-1" = "お祭りって素敵です！とっても、とーっても！"
"1009002-2-ウミカ" = "あ、先生！こちらです～！"
"1009002-3-ウミカ" = "えへへ。お祭り会場にようこそ！"
"1009002-4-ウミカ" = "こちらへどうぞ！ご案内します！"
"1009002-5" = "[ns] \"さすが……百鬼夜行のお祭りは賑やかだね。\""
"1009002-6-ウミカ" = "いえいえ！これはまだ序の口です！"
"1009002-7-ウミカ" = "「[ruby=ももよのはるのおうかさい]百夜ノ春ノ桜花祭[/ruby]」や「渦巻映画村のアトラクション祭」、「[ruby=ひゃっきやこうとうろうさい]百鬼夜行燈籠祭[/ruby]」のような規模の大きなお祭りに比べたら――"
"1009002-8-ウミカ" = "く、比べたら……どんなお祭りも小さく見えてしまいます……よね？#nで、でも……！このお祭りにだっていいところがたくさん……！"
"1009002-9-ウミカ" = "そう！そうなんです……！そもそも……#nこんなふうにお祭りに優劣をつけようとする私の姿勢が間違っていました！"
"1009002-10-ウミカ" = "どんなお祭りにも、そのお祭りにしかない価値がありますよね。#nだって、そのお祭りを楽しみに来た人たちの熱がこめられていますから！"
"1009002-11-ウミカ" = "えへへ。やっぱり、先生はさすがです！#n私が間違いそうになったら、すぐ気づかせてくれて……！"
"1009002-12" = "[ns] \"私、まだ何も言ってないよ……？\""
"1009002-13-ウミカ" = "さあ、さあ！こちらへどうぞ！今回のお祭りはですね！#nご覧の通り、人形を乗せたお神輿を祀っているんです！"
"1009002-14-ウミカ" = "昔はお姫様の人形をたくさん使ったそうですが――"
"1009002-15-ウミカ" = "今は昔の風習にとらわれず、いろいろな種類の人形でお神輿を華やかにして、#n街中をねり歩くようなお祭りになっているんです！"
"1009002-16-ウミカ" = "ただ……そのせいでしょうか……？最近は自分の人形をお神輿に乗せるために#n商会や主催者に、いわゆる賄賂が渡されることもありまして……。"
"1009002-17-ウミカ" = "準備の間は、お神輿に関する契約周りでいろいろと複雑な問題も#n発生したりしましたが……。"
"1009002-18" = "[s] \"いろいろと裏の事情もあるんだね。\""
"1009002-19-ウミカ" = "はい……。で、でも！変わらないこともあるんですよ！#n昔からお神輿の真ん中は、お姫様の形の提灯が置かれる場所と決まっていますし――"
"1009002-20-ウミカ" = "それに……こっちに来てください！このお祭りを代表する食べ物は、#n蓮の形のリンゴ飴やイチゴとサクランボのシロップをかけたかき氷なんです！"
"1009002-21-ウミカ" = "あ！見てください！お神輿のパレードが始まりましたよ！#nみなさん、音楽に合わせて楽しそうに踊っています！"
"1009002-22-ウミカ" = "そういえば先生、入場券はお持ちですか？その入場券にあるクーポンで、#nなんでも4つまで屋台で交換できるんですよ！お面も、団扇も、食べ物まで！"
"1009002-23-ウミカ" = "ふあぁ～……さすがに疲れましたね……。#n先生……楽しんでいただけましたか？"
"1009002-24" = "[s] \"ウミカが楽しそうだから、私まで楽しくなったよ。\""
"1009002-25-ウミカ" = "私が……ですか？"
"1009002-26-ウミカ" = "えへへ……先生から言われると、なんだかすこし恥ずかしいですね……。"
"1009002-27-ウミカ" = "……でも、そうですね。"
"1009002-28-ウミカ" = "私は、お祭りが大好きです。"
"1009002-29-ウミカ" = "お祭りは……ここにいるみんなのためのものでしょう？"
"1009002-30-ウミカ" = "お祭りに来ている間だけは……誰もが日常を忘れて……。#n夢のような世界を楽しめるんです……。"
"1009002-31-ウミカ" = "そのための準備は大変ですけど、みんなが楽しむ夢の世界を作っているんだと思うと#nいつもわくわくして、居ても立ってもいられなくなってしまうんです！"
"1009002-32-ウミカ" = "え？……テーマパークとすこし似てる？そ、そうですか？"
"1009002-33-ウミカ" = "テーマパークには、あまり詳しくありませんが……#nも、もちろん、仰るとおり、似ている部分もあるかもしれません！"
"1009002-34-ウミカ" = "何より、違うのは……お祭りは、もっと……そう、生きていますから！"
"1009002-35" = "[s] \"お祭りは、生きている……？\""
"1009002-36-ウミカ" = "えっと……たとえばですね……。"
"1009002-37-ウミカ" = "今日のお祭り会場を見てください！全部一度きりのもので……#n同じお祭りは二度と楽しめないんです。"
"1009002-38-ウミカ" = "お神輿の人形ひとつとっても、去年とは違うものですし！"
"1009002-39-ウミカ" = "――商会から去年と同じ人形ではダメだと言われているからですが……。"
"1009002-40-ウミカ" = "それに、お祭りを準備する時間というのも特別なんです！私だけかもしれませんけど……。いつも次のお祭りにわくわくしながら、準備しているんですよ！"
"1009002-41-ウミカ" = "ですから、お祭りとテーマパークはやっぱりぜんぜん違います！#n訪れた人に、夢のような世界を見せるという点では共通していますけど――"
"1009002-42" = "[s1] \"たしかに、そうだね。\"\n[s2] \"やっぱりウミカにとってお祭りは特別なんだね。\""
"1009002-43-ウミカ" = "あ……！す、すみません。#nひとりで興奮して、しゃべりすぎてしまいました……。"
"1009002-44-ウミカ" = "え……？そういう姿も新鮮でよかった、ですか？#nううぅ～……なんだか、よけいに恥ずかしくなってきました……。"
"1009002-45-ウミカ" = "えっと……そう！#n先生はテーマパークとお祭り、どちらがお好きですか？"
"1009002-46" = "[s] \"できれば、両方楽しみたいけど……。\""
"1009002-47-ウミカ" = "両方「楽しみたい」……ですか？なんだか表情がお暗いですね？"
"1009002-48-ウミカ" = "え……シャーレの仕事でまとまった時間を取るのが難しいから、お祭りも久しぶりに来れたくらい……？"
"1009002-49-ウミカ" = "す、すみません。先生！#nお忙しい中連れ出してしまって……"
"1009002-50" = "[s] \"大丈夫だよ、気にしないで。\""
"1009002-51-ウミカ" = "久しぶりに参加されたお祭りがこれで……なかなか時間がとれない、となると……"
"1009002-52-ウミカ" = "……あっ！いいことを思いつきました！"
"1009002-53" = "[ns] \"どうしたの？ウミカ。\""
"1009002-54-ウミカ" = "いえ！なんでもないんです。ただ……。"
"1009002-55-ウミカ" = "えへへ。すこし、いいアイディアが浮かびまして……。"
"1009002-56-ウミカ" = "え……？どんなアイディアか聞きたい、ですか？#nそれは……秘密です！今はまだ、ですね。"
"1009002-57-ウミカ" = "それより、先生！#nせっかくお祭りに来たんですから、もうすこしご案内させてください！"
"1009002-58-ウミカ" = "お祭りの楽しさを余すところなく先生にお伝えします！#nこれでも百鬼夜行いちのお祭り専門家ですから！……今はまだ自称ですけど。"
"1009002-59" = "（ウミカと会場を歩き回り、お祭りを存分に楽しんだ……）"
