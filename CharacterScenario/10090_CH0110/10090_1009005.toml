[translation]
"1009005-1" = "お祭りを邪魔する子は許しません！"
"1009005-2" = "（ウミカから連絡をもらって、百夜堂にやってきた……）"
"1009005-3" = "[ns] \"こんにちは～。\""
"1009005-4-魑魅一座A" = "ん？誰か来たのか？"
"1009005-5-魑魅一座A" = "気にする必要はないっすよ！#n今日はあたし達も……お客様っすから！"
"1009005-6-魑魅一座A" = "ひゅぅぅー！"
"1009005-7-魑魅一座B" = "いやっほ～ぅ！いいぞ！走れぇ！"
"1009005-8" = "[ns] \"な、なにごと！？\""
"1009005-9-ウミカ" = "ええ……！？先生！こんな時に来られるなんて……！"
"1009005-10-ウミカ" = "い、いえ……私が連絡したからですよね……！#nたしかに先生にはお会いしたかったのですが……！"
"1009005-11-ウミカ" = "ああ、もう！魑魅一座！本当に怒りますよ！？"
"1009005-12-魑魅一座A" = "何言ってんだ、百夜堂！あたし達はお客様だぞ？"
"1009005-13-魑魅一座B" = "そうそう、お会計も前払いしたはずっす！"
"1009005-14-ウミカ" = "それはそうですが……。#nうぅ～、お客様には笑顔で接するべきなのに。"
"1009005-15-ウミカ" = "でも、あんなに暴れ回られてしまっては……！"
"1009005-16-ウミカ" = "このままでは……百夜堂の名に傷が……！"
"1009005-17" = "[s1] \"暴れるお客さんに遠慮する必要はないよ。\"\n[s2] \"百夜堂には他のお客さんも来てるんだし。\""
"1009005-18-ウミカ" = "えっと、つまり……礼儀がなってないお客様には……#n相応の「おもてなし」をするのも接客の一環ということでしょうか……？"
"1009005-19-ウミカ" = "そうしなければ、他のお客様にも迷惑になるから……？"
"1009005-20-ウミカ" = "たしかに……先生の仰るとおりです。#nそれなら……！"
"1009005-21-ウミカ" = "魑魅一座！今から百夜堂の誇りと伝統……。#nなによりも、来てくださる他のお客様のためにも！"
"1009005-22-ウミカ" = "私たちの真心がこもった「おもてなし」をお見せいたします！"
"1009005-23-魑魅一座B" = "え？な、何をする気だ……？"
"1009005-24-魑魅一座B" = "なんだか不穏な気配がするっす……？"
"1009005-25-ウミカ" = "お客様、お席にご案内いたします！！"
"1009005-26-魑魅一座B" = "え、ええ？はい……！"
"1009005-27-魑魅一座B" = "ちょ……！自分で座るから！"
"1009005-28-ウミカ" = "湯呑に緑茶、ウーロン茶。取り皿と紙ナプキン！#nすべてご用意しております！他に必要なものはございませんかっ！？"
"1009005-29-魑魅一座B" = "すっげぇ速さ！なのに、すこしもブレないだと……？"
"1009005-30-魑魅一座B" = "ふ、ふんっ！おしぼりがないっすよ！"
"1009005-31-ウミカ" = "そう仰るだろうと、こちらにご用意しました！"
"1009005-32-魑魅一座A" = "こ、これは多すぎじゃないか！？"
"1009005-33-魑魅一座B" = "え、あの、その、2つあれば十分っすよ……？"
"1009005-34-ウミカ" = "汚した場所を自ら綺麗にしたいというお心遣い……。#n感服いたしました！必要なだけお使いください、お客様！"
"1009005-35-ウミカ" = "ただし、百夜堂の外に持ち出すのはご遠慮ください！"
"1009005-36-ウミカ" = "他に必要なものはございませんか？"
"1009005-37-魑魅一座A" = "うっ……な、ないよ。"
"1009005-38-ウミカ" = "それでは、ご注文を承りますね！私たち百夜堂のメニューは――"
"1009005-39" = "（ウミカは百夜堂にあるすべてのメニューを丁寧に説明した……）"
"1009005-40" = "（魑魅一座、いや、お客さんはイメージが追いつかないようだった……）"
"1009005-41-魑魅一座A" = "う、うぅ。もう何がなんだかちっともわからねぇ。頭がくらくらする……。"
"1009005-42-魑魅一座B" = "こんなんじゃ、注文できないっすよ……。"
"1009005-43-ウミカ" = "承知いたしました。まだご不明な点がおありなんですね？#nそれでは、最初からご説明いたします――"
"1009005-44-魑魅一座A" = "い、いや！大丈夫だ！何とか注文してみせるから……。"
"1009005-45-魑魅一座B" = "あたし達が悪かったよ。……許してほしいっす。"
"1009005-46" = "[ns] \"ふたりとも、すこしは反省した？\""
"1009005-47-魑魅一座B" = "はい……。"
"1009005-48-魑魅一座B" = "あたし達、ここでお祭りが開かれるって聞いてきたっすよ。#nそれで、つい浮かれて……。"
"1009005-49" = "[ns] \"うん？百夜堂でお祭りが？\""
"1009005-50-魑魅一座A" = "その、3日前からお祭りの資材がこの店に運ばれてたんだ。"
"1009005-51-魑魅一座B" = "それに、商会や資材担当、露店のスポンサーにイベントの運営まで……。"
"1009005-52-魑魅一座A" = "みんな、百夜堂に集まってるって……。"
"1009005-53-ウミカ" = "あなたたち、どこでその情報を！？"
"1009005-54-魑魅一座A" = "あたし達は魑魅一座だぞ。#n百鬼夜行で開かれるお祭りは知り尽くしてるはずなんだ……。"
"1009005-55-魑魅一座B" = "しばらく、このあたりでお祭りなんてないはずっす。#nなのに百夜堂で何かお祭りの準備をしていたから……。"
"1009005-56-ウミカ" = "そ、それはっ！勘違いですよ！魑魅一座！"
"1009005-57-魑魅一座A" = "いいや、あたし達はお祭りの気配を勘違いしたりしない！#n魑魅一座は周りから問題児だと言われてるけど！"
"1009005-58-魑魅一座B" = "そうっす！百鬼夜行のお祭りにはいつでも本気なのが、魑魅一座っす！"
"1009005-59-ウミカ" = "う、ううぅぅ～……！"
"1009005-60-魑魅一座A" = "それ以上、言わないでください……！"
"1009005-61-ウミカ" = "違うったら違うんですっ！"
"1009005-62-魑魅一座A" = "あ、あれ……？#nあたし達、何か言っちゃいけないことを言ったりしたか？"
"1009005-63-魑魅一座B" = "もしかして、怒らせたっすか……！？"
"1009005-64-魑魅一座A" = "……も、もう行こうか？"
"1009005-65-魑魅一座B" = "そ、そうっすね！食べ物も美味しかったし！もう十分遊んだし！"
"1009005-66-ウミカ" = "うぅぅ～……。"
"1009005-67-ウミカ" = "ごめんなさい、先生。こんな姿をお見せしてしまって……。"
"1009005-68" = "[s3] \"魑魅一座もお祭りを楽しみにしてたんだね。\"\n[s4] \"……すこし可哀想だったかも。\""
"1009005-69-ウミカ" = "あそこまで言う必要はなかった、ですよね……？"
"1009005-70-ウミカ" = "たしかに、そうなんですけど……。"
"1009005-71-ウミカ" = "でもでも、ダメなんです！"
"1009005-72-ウミカ" = "このお祭りだけは……誰にも邪魔はさせませんっ！"
"1009005-73" = "[ns5] \"本当にお祭りの予定があるの？\"\n[ns6] \"しばらくお祭りはないはずって言ってたけど……\""
"1009005-74-ウミカ" = "あ……！そ、それはですね……。"
"1009005-75-ウミカ" = "えっと、ちょっと、私も思い違いをしていました！"
"1009005-76-ウミカ" = "お祭りについては忘れてください！"
"1009005-77" = "[ns] \"でも、魑魅一座が……。\""
"1009005-78-ウミカ" = "なんでもないんですってば！#nそれより先生！何か食べたいものはありませんか！？"
"1009005-79-ウミカ" = "今日は特別に……私がごちそうしますので！#n気になるものがあれば、なんでも仰ってくださいね！"
"1009005-80" = "[ns] \"お祭りのことが気になっちゃって……。\""
"1009005-81-ウミカ" = "お、お祭りの話は、もう聞きたくありませんっ！"
"1009005-82" = "[s] \"ウミカがそんなことを言うなんて！\""
"1009005-83-ウミカ" = "き、今日の私が変なのは自分でもよくわかってますけど……うぅ～っ！"
"1009005-84" = "（その後、何度かウミカに「お祭り」の話題を振ってみたものの……）"
"1009005-85" = "（慌てて話題を逸らすばかりだった……）"
