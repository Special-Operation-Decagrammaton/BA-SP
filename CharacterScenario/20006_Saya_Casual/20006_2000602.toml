[translation]
"2000602-1" = "天才のコツ"
"2000602-2" = "（待ち合わせ場所に着いて、サヤを待っていたその時……）"
"2000602-3-サヤ" = "うわーーーっ！そこっ、危ないのだーーーっ！"
"2000602-4" = "[s] \"……この声、サヤ？\""
"2000602-5-サヤ" = "な、何してるのだ先生！"
"2000602-6-サヤ" = "道端でボーっと立ってたら危ないのだ……！"
"2000602-7" = "[s1] \"怒られるのは私じゃなくない！？\"\n[s2] \"一歩間違えたら大事故だよ！？\""
"2000602-8-サヤ" = "でも先生、別にスケートボードは車じゃないぞ？"
"2000602-9-サヤ" = "歩道でスケボーに乗っていても、法的には全く問題無いのだ！"
"2000602-10-サヤ" = "ぼく様は名探偵じゃないし、太陽光か何かで充電できるターボエンジン付きのスケートボードとかには乗らないのだ。あれは流石に危ない。"
"2000602-11" = "[s] \"ところで、そのスケートボードはどうしたの？\""
"2000602-12-サヤ" = "そういえば先生はまだ、この辺りに詳しくないんだったね。"
"2000602-13-サヤ" = "ふーっふっふっふ……何を隠そう、休日の玄武商会を回るには、スケートボードみたいな乗り物が必須なのだ！"
"2000602-14-サヤ" = "玄武商会はもともと、一日歩いても回りきれないくらい広いけど……だからといって、何でも良いから乗り物をってわけにもいかない。なにせ、バイクとかじゃ入れない狭い路地にこそ、隠れた名店があったりするのだ！"
"2000602-15-サヤ" = "だからこそ、このスケートボード！"
"2000602-16-サヤ" = "スケボーなら小さいから持ち運びも楽だし、舗装された道路なら自転車と同じくらい速く走れるから、玄武商会を巡るには持って来いなのだ。"
"2000602-17-サヤ" = "先生もこの際だし、スケートボードを買ってみたらどうだ？"
"2000602-18" = "[s] \"確かに良さそうだけど、危なくない？\""
"2000602-19-サヤ" = "大丈夫！むしろ自転車よりずっと安全なのだ！"
"2000602-20-サヤ" = "ぼく様も技を決めたりするわけじゃないから、もし転んでもアザになるぐらいなのだ。"
"2000602-21-サヤ" = "試しにぼく様のスケートボードを貸してあげるから、一度乗ってみる？"
"2000602-22" = "[s] \"じゃあ一回だけ……。\""
"2000602-23-サヤ" = "…………。"
"2000602-24-サヤ" = "……あれ？先生って運動神経悪かったっけ……？なかなか芸術的な転び方だったのだ……。"
"2000602-25-サヤ" = "ん？何かコツは無いのかって？"
"2000602-26-サヤ" = "うーん、なにせぼく様は元々天才だから……最初から上手だったし、コツとかは分かんないのだ！ははっ♪"
"2000602-27-サヤ" = "強いて言えば、「スケートボードと一つになる」という気持ちが大事だと思うのだ。"
"2000602-28" = "[s3] \"スケートボードと一つに……。\"\n[s4] \"よし、力を貸して！スケボー！\""
"2000602-29" = "[ns] \"GO！\""
"2000602-30" = "ガッ！！"
"2000602-31-サヤ" = "お、ゆっくりだけど良い感じ……。"
"2000602-32-サヤ" = "ん……？"
"2000602-33-サヤ" = "おぉっ！？躓いたと思ったら、スケボーを抱えたまま先生が転がっていくのだ！？しかも下り坂！！"
"2000602-34-サヤ" = "確かにスケボーと一つになってる！？って、そういう意味じゃないのだ！先生ーーーーっ！！？"
"2000602-35" = "……その後、勢いのまま12回半ほど回転してから、追いついたサヤにようやく止めてもらった。"
"2000602-36" = "体中アザだらけで、次の日は一日中起き上がることができなかった……。"
