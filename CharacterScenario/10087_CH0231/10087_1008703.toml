[translation]
"1008703-1" = "とにかく返品します！"
"1008703-2-ドレスショップの店員" = "お客様、お着替えは済みましたか？"
"1008703-3-アコ" = "ど、どうですか……先生？"
"1008703-4" = "[s1] \"おお……よく似合ってるよ。\"\n[s2] \"綺麗だよ、アコ。\""
"1008703-5-アコ" = "……先生の好みに合わせましたから。"
"1008703-6-ドレスショップの店員" = "どこか気になる点はございますか？"
"1008703-7-アコ" = "……そうですね。#n強いて言えば、少し背中が心許ないような……"
"1008703-8-アコ" = "なんというか……ちょっと……"
"1008703-9-ドレスショップの店員" = "たしかに仰る通りですが、お似合いだと思いますよ。"
"1008703-10-ドレスショップの店員" = "……ふむ、フィッティングの調整はしておいた方が良いかと。#n一度、着替えていただいてもよろしいですか？"
"1008703-11-アコ" = "うーん……"
"1008703-12" = "[s] \"似合ってると思うけど、気になるところでもあった？\""
"1008703-13-アコ" = "気になる、と言いますか……"
"1008703-14-アコ" = "その……"
"1008703-15-アコ" = "……風紀委員会から？"
"1008703-16-アコ" = "はい、私です。"
"1008703-17-アコ" = "え[ruby=パンデモニウム・ソサエティー]っ？万魔殿がま[/ruby]た問題を！？"
"1008703-18-アコ" = "はい、今は席を外していまして……#nはい……はい、すぐ向かいますので、私が到着するまで待機していてください！"
"1008703-19-アコ" = "すみません、急用で帰らなくては。"
"1008703-20" = "[s] \"どうしたの？\""
"1008703-21-アコ" = "いつもの面倒な事件です！"
"1008703-22-アコ" = "大したことありませんので、お気になさらず。"
"1008703-23-アコ" = "では先生！ドレスをお願いします！"
"1008703-24" = "[ns] \"……相変わらず忙しそうだ。\""
"1008703-25-ドレスショップの店員" = "あれ、お客様は……？"
"1008703-26" = "[s3] \"急用で先に帰りました。\"\n[s4] \"ドレスは私が受け取ります。\""
"1008703-27-ドレスショップの店員" = "そうでしたか……もうお直しは済んでおります。"
"1008703-28-ドレスショップの店員" = "……ああ、失礼いたしました。"
"1008703-29-ドレスショップの店員" = "一つ、伝え忘れていたことがありまして。"
"1008703-30-ドレスショップの店員" = "こちらのドレスですが、インナーの着用を推奨しております。"
"1008703-31-ドレスショップの店員" = "綺麗なシルエットを保つためにも、ぜひご検討ください。"
"1008703-32" = "[s] \"アコが引っかかってたのは、そこだったのかな？\""
"1008703-33-ドレスショップの店員" = "別途お支払いが必要にはなってしまいますが、いかがでしょう？"
"1008703-34-ドレスショップの店員" = "どうぞ、実物をご覧ください。"
"1008703-35" = "[ns] \"……紐に見えるような。\""
"1008703-36-ドレスショップの店員" = "ええ。デザインを活かすために、こうなっておりまして……"
"1008703-37" = "[ns5] \"怒られそうな気が……でも一応、買って帰ろうかな。\"\n[ns6] \"分かりました、それもお願いします。\""
"1008703-38-ドレスショップの店員" = "では、ドレスとご一緒にラッピングいたします。"
"1008703-39-ドレスショップの店員" = "お買い上げ、ありがとうございました。"
"1008703-40" = "（アコの姿が見えなかったので、席にドレスを置いて帰った）"
