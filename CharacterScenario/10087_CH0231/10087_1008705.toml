[translation]
"1008705-1" = "とにかく忙しかったんです！"
"1008705-2" = "（アコに呼び出され、パーティー会場にやって来た）"
"1008705-3-アコ" = "お待ちしていました、先生。"
"1008705-4" = "[s] \"これは何の集まりなの？\""
"1008705-5-アコ" = "ゲヘナと交流がある企業の親睦会です。"
"1008705-6-アコ" = "何かと面倒ではありますが、これも行政官の仕事ですので。"
"1008705-7-アコ" = "いつも通り制服で出席しようかとも思いました。"
"1008705-8-アコ" = "ですが、自宅でドレスを試着したところ少し動きづらく……"
"1008705-9-アコ" = "せっかくですし、この場を有効に使って慣れておこうかと。"
"1008705-10" = "[s] \"それで予行演習って言ってたんだね。\""
"1008705-11-アコ" = "はい、その通りです。"
"1008705-12-アコ" = "当日は、先生と一緒に過ごす時間も無いでしょうし…………"
"1008705-13-アコ" = "先生と一緒に選んだドレスですから……初めては……"
"1008705-14-アコ" = "そ、そういうことですから、今日は付き合っていただきます！！"
"1008705-15" = "[s] \"私でよければ、喜んで。\""
"1008705-16-アコ" = "……はい。"
"1008705-17" = "[ns] アコの手を取る。"
"1008705-18-アコ" = "うーん……"
"1008705-19" = "[s] \"大丈夫？歩きづらそうだけど……\""
"1008705-20-アコ" = "はい……"
"1008705-21-アコ" = "このドレス、思ったより裾が長くて……"
"1008705-22-アコ" = "あっ……！"
"1008705-23-アコ" = "きゃっ！？"
"1008705-24" = "[ns] \"アコ、大丈夫！？\""
"1008705-25-アコ" = "こ、転んでしまうところでした。裾がヒールに引っかかって……"
"1008705-26-アコ" = "でも先生が支えてくださったおかげで……"
"1008705-27-アコ" = "……あれ？"
"1008705-28-アコ" = "もしかして……背中、破れてませんか……？"
"1008705-29-アコ" = "たぶん、腰の辺りから……"
"1008705-30" = "[s] \"ちょっと見てみるね？\""
"1008705-31-アコ" = "あ、はい……お願いします。"
"1008705-32-アコ" = "き、きゃああ！？や、やっぱり破れてますよね……！"
"1008705-33" = "[s1] \"大丈夫だよ、落ち着いて。\"\n[s2] \"とりあえず、隅のほうに移動しようか。\""
"1008705-34" = "[wa:100]― [log=아코 드레스]こ、[wa:750]このままでは困ります！[/log]"
"1008705-35" = "― [log=아코 드레스]もしも他の人が[wa:850]気づいてしまったら……[/log]"
"1008705-36" = "― [log=아코 드레스]大変なことに[wa:850]なってしまいます……！[/log]"
"1008705-37" = "[ns] \"じっとしてて、ひとまず安全ピンで応急処置を……\""
"1008705-38" = "[wa:150]― [log=아코 드레스]よ、[wa:700]よりによって[wa:650]こんなタイミングで……！[/log]"
"1008705-39" = "― [log=아코 드레스]やっぱり、[wa:1100]これは先生と一緒に[wa:1000]来たから……？[/log]"
"1008705-40" = "[ns] \"……えっ！？\""
"1008705-41" = "[wa:150]― [log=아코 드레스]先生！[wa:900]なんとかしてください！[/log]"
"1008705-42" = "― [log=아코 드레스]私が大変なことになる前に、[wa:1900]早く！[/log]"
"1008705-43" = "[ns3] ドレスを直していると、見覚えのある紐が目に入った。\n[ns4] \"これは……\""
"1008705-44" = "[wa:200]― [log=아코 드레스]え？[wa:950]な、[wa:650]何ですか？[wa:750]その顔は……[/log]"
"1008705-45" = "[wa:200]― [log=아코 드레스]え？[wa:950]な、[wa:650]何ですか？[wa:750]その顔は……[/log]"
"1008705-46" = "― [log=아코 드레스]……んん？[/log]"
"1008705-47" = "― [log=아코 드레스]な、[wa:600]何ですか？[/log]"
"1008705-48" = "― [log=아코 드레스]一体何を見つけたんですか……？[/log]"
"1008705-49" = "[ns] \"……返品するんじゃなかったっけ？\""
"1008705-50" = "[wa:250]― [log=아코 드레스]そ、[wa:700]それは、[wa:650]その……[/log]"
"1008705-51" = "― [log=아코 드레스]返品には、[wa:950]色々と[wa:550]手間がかかるものですから……。[/log]"
"1008705-52" = "― [log=아코 드레스]その……[wa:1900]風紀委員会の仕事が忙しくて、[/log]"
"1008705-53" = "― [log=아코 드레스]時間が[wa:400]なかったというか……。[/log]"
"1008705-54" = "[wa:100]― [log=아코 드레스]とにかくそういうことですから！[/log]"
"1008705-55" = "― [log=아코 드레스]そういうことにしておいてください！[/log]"
"1008705-56" = "（どうにかドレスを直し、パーティーは事なきを得た）"
"1008705-57" = "（落ち込んでいたアコをゲヘナまで送ってから、シャーレに戻った）"
