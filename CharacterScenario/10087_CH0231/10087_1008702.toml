[translation]
"1008702-1" = "とにかく負けられません！"
"1008702-2" = "（訳も分からぬまま、ひとまずゲヘナへ向かった）"
"1008702-3" = "風紀委員会・行政官室"
"1008702-4-アコ" = "遅いじゃないですか！！"
"1008702-5" = "[s] \"……まだ5分前なんだけど。\""
"1008702-6-アコ" = "あら……"
"1008702-7-アコ" = "それでも私を待たせたんですから遅刻です！"
"1008702-8" = "[s] \"そ、そっか。\""
"1008702-9-アコ" = "私が時計を何回確認したと思っているんですか！"
"1008702-10-アコ" = "先生が到着されるまで、何回も何回も！"
"1008702-11-アコ" = "……まあ、時間通りなので今回は許しましょう。"
"1008702-12" = "[ns1]（よく分からないけど……）\n[ns2]（いつものアコで良かった）"
"1008702-13" = "[ns] \"何があったのか聞かせてくれる？\""
"1008702-14-アコ" = "[ruby=パンデモニウム・ソサエティー]また万魔殿のタ[/ruby]ヌキどもが問題を！！"
"1008702-15-アコ" = "万魔殿が主催するパーティーの話はご存知ですか？#nまた予算を追加して、規模を大きくするようです。"
"1008702-16-アコ" = "これが、あちらから届いた計画書なのですが……"
"1008702-17" = "[s] \"ふむ……\""
"1008702-18-アコ" = "見てください、この悪意に満ちた内容を！"
"1008702-19-アコ" = "特にここ！「我々は高価なイブニングドレスで出席するが、行政官はいつもの品性の無いボロ切れで出席するように」だなんて！"
"1008702-20-アコ" = "この服のどこがボロ切れなんですか！？#nまったく、言わせておけば……"
"1008702-21" = "[s3] \"…………。\"\n[s4] \"お、落ち着いて……？\""
"1008702-22-アコ" = "私、天雨アコが！こんな悪巧みにやられっぱなしだと思ったら大間違いです！"
"1008702-23-アコ" = "私、天雨アコが！こんな悪巧みにやられっぱなしだと思ったら大間違いです！"
"1008702-24-アコ" = "こういった事態も想定して、秘密資金を蓄えてあります。"
"1008702-25" = "[s] \"秘密資金って……\""
"1008702-26-アコ" = "これは戦争です！#nあのタヌキどもに負けないくらい綺麗なドレスでパーティーに出席します！"
"1008702-27-アコ" = "今一度、格の違いを実感させなければ。"
"1008702-28-アコ" = "事の重大さが分かりましたか、先生？"
"1008702-29" = "[s] \"えっと……それで、私に何か用事があるんだよね？\""
"1008702-30-アコ" = "もちろんです！"
"1008702-31-アコ" = "先生には、私に似合うドレスを選んでいただかないと！"
"1008702-32" = "[ns] \"私が……？\""
"1008702-33-アコ" = "じゃあ一体、"
"1008702-34-アコ" = "誰が選ぶんですか……？"
"1008702-35" = "[s] \"自分で気に入ったドレスを選ばなくていいの……？\""
"1008702-36-アコ" = "……はい？"
"1008702-37-アコ" = "何を言ってるんですか？#nこんなにも重要な服選びを、私一人で行えと……？"
"1008702-38-アコ" = "酷すぎはしませんか？#n私がこれだけ悩んでいるというのに、知ったことじゃない、勝手にしろと……？"
"1008702-39" = "[s] \"あ、いや、その……\""
"1008702-40-アコ" = "先生は万魔殿の味方なんですか！？#nもしも私が自分で選んだドレスをバカにされたら、どうするんですか！？"
"1008702-41-アコ" = "私に似合う色も、デザインも、先生に決めてもらわないと困ります！"
"1008702-42" = "[s] \"えっと……はい、分かりました。\""
"1008702-43-アコ" = "では、始めましょう。"
"1008702-44-アコ" = "こちらがドレスのカタログです。"
"1008702-45-アコ" = "ここから私に似合うドレスを選んでください！"
"1008702-46" = "（こうして、アコのドレス選びが始まった）"
"1008702-47-アコ" = "まずは色からです。先生は何色が私に似合うと思いますか？"
"1008702-48" = "[s5] \"アコのイメージ的に……\"\n[s6] \"やっぱり、青系がいいんじゃないかな？\""
"1008702-49-アコ" = "……なるほど。#n先生は青がお好き、と……参考にします。"
"1008702-50" = "[s] \"私が好きというか、アコに似合いそうな色を……\""
"1008702-51-アコ" = "何ですか？その適当な意見は。"
"1008702-52-アコ" = "ご自身の意見なんですから、もっとはっきり言ってください！#n先生の！好みを！"
"1008702-53" = "[s] \"……は、はい。\""
"1008702-54-アコ" = "デザインは？どういったのがお好きですか？"
"1008702-55" = "[s7] \"大胆なデザインはどうかな？\"\n[s8] \"大人っぽく見えるデザインはどうかな？\"\n[s9] \"会場で目を惹くようなデザインはどうかな？\""
"1008702-56-アコ" = "となると、これとかですか……"
"1008702-57-アコ" = "さ、流石に大胆すぎるのでは？"
"1008702-58-アコ" = "たしかに、これならタヌキどもを黙らせられると思いますが……"
"1008702-59-アコ" = "な、悩ましいですね……"
"1008702-60-アコ" = "……って、先生はこういった風紀を乱すような服がお好きなんですね？"
"1008702-61" = "[ns] \"……えっ？\""
"1008702-62-アコ" = "これを私に着せたいんですか……？#n風紀委員の行政官として、却下します！"
"1008702-63-アコ" = "先生を信じたのが間違いでした！#nこんな格好できるわけないじゃないですか！"
"1008702-64-アコ" = "もういいです！#n先生の意見は当てになりません！自分で選びます！"
"1008702-65" = "[s] \"ご、誤解だよ！\""
"1008702-66-アコ" = "どこが誤解なんですか！"
"1008702-67-アコ" = "え？さっきと言ってることが違う？"
"1008702-68-アコ" = "そんなこと、自分でも分かってます！"
"1008702-69" = "（何故か慌ててソワソワするアコを後にして、シャーレに戻った）"
