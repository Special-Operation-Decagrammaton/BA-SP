[translation]
"2601105-1" = "バッティングセンス"
"2601105-2" = "（佐天に呼ばれた先は、近郊にあるバッティングセンターだった）"
"2601105-3-佐天涙子" = "ふぅ……！ここ、なかなか設備が整ってるなぁ。"
"2601105-4-佐天涙子" = "それに、あたし達の学園都市に似てる気がする。"
"2601105-5" = "[s1] \"お、見つけた。\"\n[s2] 佐天に手を振る。"
"2601105-6-佐天涙子" = "……あ！せんせ～～～い！"
"2601105-7-佐天涙子" = "早かったですね。もっと時間かかるかと思って、先に打っちゃってました。"
"2601105-8-佐天涙子" = "……はい？"
"2601105-9-佐天涙子" = "ああ、これがあたしにとっての息抜きなんですよ。#n向こうでも、よく通ってましたから。"
"2601105-10-佐天涙子" = "……どうかしました？"
"2601105-11" = "[s3] \"いや、佐天が楽しそうで良かったなって。\"\n[s4] \"今日も元気いっぱいだね。\""
"2601105-12-佐天涙子" = "ふふっ、ありがとうございます。#nそういえば先生……あたし、ひとつ気になってることがあって。"
"2601105-13-佐天涙子" = "ここの設備に不満は無いんですけど……"
"2601105-14-佐天涙子" = "ほら、あそこ……変わった打席がありますよね。"
"2601105-15-佐天涙子" = "……見えます？あれです、あれ。"
"2601105-16" = "[ns5] \"……もしかして。\"\n[ns6] \"アレは、いったい……。\""
"2601105-17-佐天涙子" = "先生が来る前に注意書きを読んでみたんです。#nそしたら、ミレニアム製の超豪速球マシーンだそうで……"
"2601105-18-佐天涙子" = "なんか、そう書かれると逆に挑戦したくなりません？"
"2601105-19-佐天涙子" = "……え？そんなに危ないんですか？"
"2601105-20-佐天涙子" = "……ふっふっふ。"
"2601105-21" = "[s7] \"……えっと、佐天さん？\"\n[s8] \"もしかして、余計なこと言ったかな……？\""
"2601105-22-佐天涙子" = "いえ……実は、最初からやると決めてたんです。"
"2601105-23-佐天涙子" = "だって、一度気になったら止められないじゃないですか？"
"2601105-24-佐天涙子" = "それじゃ……"
"2601105-25-佐天涙子" = "……見ててください、先生！"
"2601105-26" = "（佐天は意気揚々と打席に立った）"
"2601105-27" = "[wa:500]― [log=사텐]ん～、[wa:1320] [/log]"
"2601105-28" = "― [log=사텐]特に変わったところは……[wa:1640]なさそうかな。[/log]"
"2601105-29" = "[wa:1000]― [log=사텐]……[wa:100]先生、[wa:1560]顔がこわばってません？[wa:1720] [/log]"
"2601105-30" = "― [log=사텐]ただの[wa:190]バッティングマシーン[wa:520]ですって。[/log]"
"2601105-31" = "[ns] \"危なそうだったら、すぐに止めるよ？\""
"2601105-32" = "[wa:700]― [log=사텐]はい。[wa:680]でも、[wa:500]たぶん大丈夫です。[/log]"
"2601105-33" = "[wa:850]― [log=사텐]バッティングには、[wa:480] [/log]"
"2601105-34" = "― [log=사텐]それなりに[wa:320]自信がありますから。[/log]"
"2601105-35" = "[wa:400]― [log=사텐]……[wa:250]なんですか、[wa:1260] [/log]"
"2601105-36" = "― [log=사텐]その疑いの眼差しは。[/log]"
"2601105-37" = "― [log=사텐]じゃあ、[wa:840]賭けでもします？[/log]"
"2601105-38" = "[wa:600]― [log=사텐]3球以内に[wa:860]打てなかったら、[wa:860] [/log]"
"2601105-39" = "― [log=사텐]大人しく打席を[wa:800]離れます。[/log]"
"2601105-40" = "[wa:500]― [log=사텐]その代わり、[wa:860]もし1球でも打てたら、[wa:1950] [/log]"
"2601105-41" = "― [log=사텐]そこの自販機で[wa:820]飲み物を奢ってください！[/log]"
"2601105-42" = "[wa:700]― [log=사텐]どうですか？[wa:1070] [/log]"
"2601105-43" = "― [log=사텐]先生にとっても、[wa:1060]悪い話じゃないですよね？[/log]"
"2601105-44" = "― [log=사텐]……[wa:400]へへっ。[/log]"
"2601105-45-佐天涙子" = "さあ！佐天選手、バッターボックスに入りました！"
"2601105-46-佐天涙子" = "まずは一球目！"
"2601105-47-佐天涙子" = "よーく引きつけて……"
"2601105-48-佐天涙子" = "……はぁっ！！"
"2601105-49" = "（……飲み物を3つ買うことになった）"
