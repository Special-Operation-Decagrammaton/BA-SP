[translation]
"2601102-1" = "あたしが都市伝説"
"2601102-2" = "（佐天に連絡をもらい、商店街に向かった）"
"2601102-3" = "（到着すると、そこには目をキラキラさせながら街並みを見回している佐天がいた）"
"2601102-4-佐天涙子" = "こ、これが……これが現実……！？"
"2601102-5-佐天涙子" = "テーマパークとかドッキリじゃないよね……？"
"2601102-6-佐天涙子" = "映画のロケ地でもない、よね……！？"
"2601102-7-佐天涙子" = "あそこに翼の生えてる人が……えっ、あっちの人は角が……！#n珍しい形の耳と尻尾がある人に……"
"2601102-8-佐天涙子" = "動物の姿をした人まで……！"
"2601102-9" = "[s1] \"……佐天？\"\n[s2] \"ここで何してるの？\""
"2601102-10-佐天涙子" = "空にも不思議な光の柱と輪っかがある……！"
"2601102-11" = "[s3] \"夢中で聞こえてなさそう……。\"\n[s4] \"えっと、佐天さーん……？\""
"2601102-12-佐天涙子" = "……わっ！？"
"2601102-13-佐天涙子" = "あっ……先生、来てくれたんですね！"
"2601102-14-佐天涙子" = "ビックリしたぁ……実はさっき、ワンちゃんみたいな人に話しかけられて、つい逃げちゃったんです。"
"2601102-15-佐天涙子" = "可愛いな～とは思ったんですけど……"
"2601102-16-佐天涙子" = "……え？"
"2601102-17-佐天涙子" = "みんな良い人だから、心配する必要はない、ですか……？"
"2601102-18-佐天涙子" = "あ、えっと……"
"2601102-19-佐天涙子" = "……別に怖かったわけではないですよ？"
"2601102-20" = "[s5] \"……違うの？\"\n[s6] \"じゃあ、さっきのは……。\""
"2601102-21-佐天涙子" = "どちらかといえば、不思議すぎてビックリしたというか。"
"2601102-22-佐天涙子" = "……なんか気を遣わせちゃったみたいですね。#nあはは……すみません、そんなつもりじゃなかったんですけど。"
"2601102-23-佐天涙子" = "あたしが住んでたところには、なかった光景ばかりで……"
"2601102-24-佐天涙子" = "最初は学園都市って聞いて、似てるのかな～なんて思ってましたが、よく見ると全然違うし……"
"2601102-25-佐天涙子" = "そうだなぁ、うーん……"
"2601102-26-佐天涙子" = "昔から追いかけてきた都市伝説が、ぜーんぶ集まってる世界、みたいな？"
"2601102-27-佐天涙子" = "だから、この街は私にとって不思議に包まれてるんです！"
"2601102-28-佐天涙子" = "でも……"
"2601102-29-佐天涙子" = "……なんか、変なんです。#nこんな状況なのに、どこか落ち着いている自分がいて。"
"2601102-30-佐天涙子" = "みんな、これが当たり前のように暮らしてるから、都市伝説っぽくないし……。"
"2601102-31" = "[s7] \"ここでは、ありふれた光景だからね……。\"\n[s8] \"都市伝説は、相対的に生まれるものじゃないかな。\""
"2601102-32-佐天涙子" = "そう……ですよね、やっぱり。"
"2601102-33-佐天涙子" = "……あれっ。"
"2601102-34-佐天涙子" = "……！？#nってことは、むしろこの街ではあたしの存在の方が都市伝説なんじゃ……！？"
"2601102-35" = "[s9] \"……異世界から来た人、だから？\"\n[s10] \"たしかに、その通りだね。\""
"2601102-36-佐天涙子" = "……！！"
"2601102-37-佐天涙子" = "私としたことが、見落としてましたっ！"
"2601102-38-佐天涙子" = "都市伝説……あたしが、都市伝説に……"
"2601102-39-佐天涙子" = "……おお、おおお……！"
"2601102-40-佐天涙子" = "せ、先生……"
"2601102-41-佐天涙子" = "……あたし、都市伝説っぽいですか？"
"2601102-42" = "[s11] \"えっと……。\"\n[s12] \"ど、どう答えるのが正解なのかな。\""
"2601102-43-佐天涙子" = "ぜーんぜん不思議そうな顔してませんね、残念です。"
"2601102-44-佐天涙子" = "とりあえず、あたしにとっては珍しく映るものも、ここじゃ日常なんだなって分かりました。"
"2601102-45-佐天涙子" = "でも、この街にも都市伝説の一つや二つ、ありますよね？#nもちろん、怪談やオカルトも……"
"2601102-46" = "[s13] \"本当に都市伝説が好きなんだね。\"\n[s14] \"逆に探していくスタイルなんだ……。\""
"2601102-47-佐天涙子" = "もちろんです！諦めなければ、何か見つかるかもしれませんから！"
"2601102-48-佐天涙子" = "さ、先生！一緒に探しに行きましょう！"
"2601102-49" = "[ns] \"……ま、待って！\""
"2601102-50" = "[ns] 急いで佐天の後を追った。"
"2601102-51" = "（その後、佐天と一緒にキヴォトス市内をぐるっと回ったが……）"
"2601102-52" = "（「都市伝説」と呼べるようなものは見つからなかった）"
