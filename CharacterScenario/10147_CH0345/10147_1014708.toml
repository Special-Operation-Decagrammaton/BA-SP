[translation]
"1014708-1" = "京極サツキ "
"1014708-2-サツキ" = "たしかに、先生を見ると――"
"1014708-3-サツキ" = "嬉しいし、安心するわ。"
"1014708-4-サツキ" = "どうしてかしら。前は……会えなくてもなんともなかったのに。"
"1014708-5-サツキ" = "最近は……先生がどこで何をしているかとか、危ない目に遭っていないかとか。#nそんなことばかり気になってしまうの。"
"1014708-6" = "[s1] \"たまに巻き込まれることもあるけど……大丈夫。\"\n[s2] \"心配してくれてありがとう、サツキ。\""
"1014708-7-サツキ" = "……先生は自分のことを後回しにしすぎよ。もう少し自分を大切にして頂戴。"
"1014708-8-サツキ" = "偉大なる万魔殿が誇る一番の協力者として――"
"1014708-9-サツキ" = "いいえ。#nこの[ruby=きょうごく]京極[/ruby]サツキが認める、最高のパートナーとして。"
"1014708-10" = "[s] 頷く。"
"1014708-11-サツキ" = "……うふふ。"
"1014708-12" = "（サツキと他愛もない話をしながら、夜の海辺を歩いた）"
"1014708-13" = "[ns] \"そういえばサツキ、暗いの苦手だったよね？\""
"1014708-14-サツキ" = "ええ。"
"1014708-15-サツキ" = "暗い場所は不安になるの。#nどこから何が出てくるか分からないし……。"
"1014708-16-サツキ" = "暗闇は……怖いし、大嫌いよ……。"
"1014708-17" = "[s] \"今は夜だけど……平気？\""
"1014708-18-サツキ" = "え？"
"1014708-19-サツキ" = "そうね……普段なら、夜に外出なんてしないし、しても明るいところしか歩かないわ。"
"1014708-20-サツキ" = "ここは照明もなくて暗いから、本当だったら怖くて嫌なはずなのに……。"
"1014708-21-サツキ" = "あんまり怖くないし、嫌でもない。どうしてかしら……。"
"1014708-22-サツキ" = "ね、念のため……周囲に危険がないか調べておきましょう。"
"1014708-23-サツキ" = "これは……。"
"1014708-24-サツキ" = "……私たちの足跡、ね。"
"1014708-25-サツキ" = "先生と私のものが並んでるわ……。"
"1014708-26" = "[s] \"一緒に歩いてきたからね。\""
"1014708-27-サツキ" = "……。"
"1014708-28-サツキ" = "そっか。"
"1014708-29-サツキ" = "分かったわ。"
"1014708-30-サツキ" = "どうして怖くないのか。"
"1014708-31-サツキ" = "……先生が、一緒にいるから。"
"1014708-32" = "[ns] （突然、サツキの香りが鼻腔をくすぐる）"
"1014708-33" = "[wa:2270]― [log=사츠키 수영복]思い返せば、[wa:1570]いつもそうだったわね。[/log]"
"1014708-34" = "[wa:3410]― [log=사츠키 수영복]先生は[wa:1190]私の隣を[wa:900]歩いてくれた。[/log]"
"1014708-35" = "[wa:610]― [log=사츠키 수영복]どんなわがままを言っても――[/log]"
"1014708-36" = "[wa:2690]― [log=사츠키 수영복]あなたを拷問したり、[wa:2050]催眠をかけてみたりしても。[wa:3570] [/log]"
"1014708-37" = "― [log=사츠키 수영복]どんなことだって、[/log]"
"1014708-38" = "[wa:1440]― [log=사츠키 수영복]文句も言わずに[wa:940]付き合ってくれた。[/log]"
"1014708-39" = "[wa:560]― [log=사츠키 수영복]……私を守るっ[wa:1210]て言ってくれて、[/log]"
"1014708-40" = "[wa:1040]― [log=사츠키 수영복]ありがとう。[wa:2430] [/log]"
"1014708-41" = "― [log=사츠키 수영복]怖がっているとき、[/log]"
"1014708-42" = "[wa:1640]― [log=사츠키 수영복]手を握ってくれて[wa:990]ありがとう。[wa:3900] [/log]"
"1014708-43" = "― [log=사츠키 수영복]いつでも[wa:410]駆けつけてきてくれて、[/log]"
"1014708-44" = "[wa:1950]― [log=사츠키 수영복]ありがとう。[/log]"
"1014708-45" = "[wa:440]― [log=사츠키 수영복]だから――[/log]"
"1014708-46" = "[wa:3550]― [log=사츠키 수영복]これからも……[wa:1560]よろしくね、[wa:1410]先生。[/log]"
"1014708-47-サツキ" = "そう……そうだったのね。"
"1014708-48-サツキ" = "私はずっと、先生にこの言葉を伝えたかったみたい。"
"1014708-49-サツキ" = "……まだ言いたいことはある気がするけど、少しすっきりしたわ。"
"1014708-50-サツキ" = "今日のところは、このくらいでいいでしょう。"
"1014708-51" = "[ns] \"ところで……。\""
"1014708-52" = "[ns] \"ずっとこのままでいるの？\""
"1014708-53-サツキ" = "ええ。"
"1014708-54-サツキ" = "嫌なの？"
"1014708-55" = "[s] \"嫌なわけじゃないけど……。\""
"1014708-56-サツキ" = "こうしてるとね、なんだか満たされていく感じがするの。"
"1014708-57-サツキ" = "私を守ってくれるって約束したでしょう？#n言っておくけど、契約破棄は認めないわよ。"
"1014708-58" = "（そのまま、サツキと寄り添い海辺を歩いていった）"
