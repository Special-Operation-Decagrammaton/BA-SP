[translation]
"1014706-1" = "サツキの視線対策"
"1014706-2-サツキ" = "こっちのビーチは人が多いわ……。"
"1014706-3-サツキ" = "同じ海でも、場所によって結構違うのね。"
"1014706-4" = "[s1] \"にぎやかというか――\"\n[s2] \"『ザ・海！』って感じだね。\""
"1014706-5-サツキ" = "そうね。ちょっと騒がしいくらいだわ。"
"1014706-6-サツキ" = "実は私、人が多い場所ってあまり好きじゃないの。"
"1014706-7-サツキ" = "人が多いと、気にすることが増えるじゃない？"
"1014706-8-サツキ" = "それでもここに来たのは――"
"1014706-9-サツキ" = "いつもと違う環境で、私の心がどう動くか観察したかったから。"
"1014706-10-サツキ" = "最近、先生と一緒にいると不思議な気分になるの。"
"1014706-11-サツキ" = "あ、別にイヤとかじゃないのよ？むしろその逆。"
"1014706-12-サツキ" = "帰ったら、今日のデータをもとにその理由を分析してみるつもり。"
"1014706-13-子供A" = "あははっ！捕まえたらジュースもらうね！"
"1014706-14-子供B" = "待ってよ……あっ！"
"1014706-15" = "[ns] \"あちゃ～、派手に転んじゃったね……！\""
"1014706-16-子供B" = "うわあああん！痛いよ～！！"
"1014706-17" = "[ns] \"大丈夫？怪我はない？\""
"1014706-18-子供B" = "ぐすっ……うん……。"
"1014706-19" = "[s] \"砂の上は転びやすいから、ゆっくり歩こうね。\""
"1014706-20-子供B" = "うん！ゆっくり歩く！"
"1014706-21-子供A" = "ゆっくり歩く～！"
"1014706-22-サツキ" = "へぇ……すぐ泣き止んでえらいわね。痛かったでしょうに。"
"1014706-23-サツキ" = "それにしても……先生は子どもの扱いにも慣れてるのね。"
"1014706-24" = "[s] \"一応先生だからね。\""
"1014706-25-サツキ" = "うふふ。さすが私の協力者といったところかしら。"
"1014706-26-サツキ" = "それで、さっきの話だけど――"
"1014706-27-サツキ" = "た、助けてください！！"
"1014706-28-サツキ" = "えっ……。"
"1014706-29" = "[s] \"誰か溺れてる！？\""
"1014706-30" = "（溺れかけている人を、水から引き上げた）"
"1014706-31-観光客" = "はぁ、はぁ……あ、ありがとうございます……。"
"1014706-32-観光客" = "突然足がつっちゃって……頭が真っ白になっちゃいまして……。"
"1014706-33" = "[s] \"準備運動を入念にすると良いかもしれませんね。\""
"1014706-34-観光客" = "いやぁ～海を見ていると飛び込みたくなっちゃった！すみません！"
"1014706-35-観光客" = "おかげで命拾いしました。助けていただきありがとうございます。"
"1014706-36-サツキ" = "ふぅん……あんなに即座に動けるなんて。"
"1014706-37-サツキ" = "困っている人を見ると放っておけないのかしら。"
"1014706-38-サツキ" = "でも気をつけて頂戴。#n水難事故の救助は、救助者も巻き込まれる可能性があるのよ。"
"1014706-39" = "[s3] \"うん、ありがとう。\"\n[s4] \"気をつけるね。\""
"1014706-40-サツキ" = "人が多いと、こういう問題も出てくるわね。"
"1014706-41-サツキ" = "じゃあ――"
"1014706-42-サツキ" = "あれ？もしかしてシャーレの先生ですか？"
"1014706-43" = "[s] \"うん、そうだよ。\""
"1014706-44-サツキ" = "ちょうどよかった！ もしよろしければ、少し手伝っていただけませんか？"
"1014706-45-ヴァルキューレの海警" = "海の家でちょっとしたケンカが起きているんですが、二人とも強情で……。"
"1014706-46-ヴァルキューレの海警" = "私たちだけでは手に負えなくて……。#n先生の話なら、二人とも聞くと思うのですが……。"
"1014706-47" = "[s] \"どこに行けばいい？\""
"1014706-48-ヴァルキューレの海警" = "ありがとうございます！こちらです！"
"1014706-49" = "（その後もトラブルは続き、忙しく動き回った……）"
"1014706-50" = "[ns] \"ふう……。\""
"1014706-51-サツキ" = "……。"
"1014706-52" = "[s] \"ごめんね、サツキ……ずっとバタバタしてて。\""
"1014706-53-サツキ" = "ふぅん……。"
"1014706-54-サツキ" = "まあ、仕方ないわ。"
"1014706-55-サツキ" = "先生は事件を見過ごせない性分だものね。"
"1014706-56-サツキ" = "でも……視野が広すぎるのも考え物よ。"
"1014706-57-サツキ" = "今日起きた事件のほとんどは、先生がいなくても解決したんじゃない？"
"1014706-58" = "[s] \"それは……そうかも。\""
"1014706-59-サツキ" = "だから……今からはよそ見禁止。"
"1014706-60-サツキ" = "先生は私のことだけ見ていればいいの。"
"1014706-61-サツキ" = "それが一番安全なんだから。"
"1014706-62" = "[s] \"周りを見ないほうが、むしろ危ないと思うんだけど……。\""
"1014706-63-サツキ" = "先生の代わりに、私が見ていてあげる。これで安心でしょ？"
"1014706-64-サツキ" = "だから……先生は私だけ見ていて頂戴。"
"1014706-65-サツキ" = "ほら、ここに座って。"
"1014706-66" = "（しばらくして……）"
"1014706-67-サツキ" = "……。"
"1014706-68" = "[s] \"ねえ、サツキ。\""
"1014706-69-サツキ" = "なぁに、先生？"
"1014706-70" = "[s5] \"サツキもずっと私のこと見てるけど……。\"\n[s6] \"これだと、他を見られてないんじゃない？\""
"1014706-71-サツキ" = "え？そ、そうかしら？"
"1014706-72-サツキ" = "私……そんなに先生のことばかり見ているの……？"
"1014706-73" = "[s] \"うん。さっきからずっと……。\""
"1014706-74-サツキ" = "……。"
"1014706-75-サツキ" = "よ、よく気づいたわね！"
"1014706-76-サツキ" = "先生がちゃんと私の話を聞いているかテストしていたのよ。"
"1014706-77-サツキ" = "さ、気を取り直して続けましょ。"
"1014706-78" = "（それからも、サツキが視線をそらすことはなかった）"
"1014706-79" = "（帰るまで、ずっと私だけをどこか嬉しそうに見ていた）"
