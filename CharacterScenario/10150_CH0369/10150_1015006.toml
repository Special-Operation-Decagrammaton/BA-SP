[translation]
"1015006-1" = "伝えたいシャチ"
"1015006-2" = "（オデュッセイアの船団がD.U.に戻ってきて、まだ間もない頃）"
"1015006-3" = "（船団が停泊している港近くの商店街で、偶然コトネの姿を見かけた）"
"1015006-4-コトネ" = "うーん……。"
"1015006-5" = "（コトネはポストを見つめたまま、何かを考え込んでいた）"
"1015006-6" = "（いつもより深刻そうな表情を見て、声をかけてみることにした）"
"1015006-7" = "[ns] \"コトネ？\""
"1015006-8-コトネ" = "あ、先生。"
"1015006-9-コトネ" = "商店街で会うのは初めてだね。"
"1015006-10-コトネ" = "お昼ご飯でも食べに来たの？"
"1015006-11" = "[s] \"うん。近くに用事があって、そのついでに。\""
"1015006-12" = "[ns1] \"それより、ポストがどうかしたの？\"\n[ns2] \"間違えて、何か入れちゃったとか？\""
"1015006-13-コトネ" = "そういうわけじゃないんだけど……。"
"1015006-14-コトネ" = "実は……手紙を出すかどうか、迷ってたんだ。"
"1015006-15-コトネ" = "手紙自体はもう書き終わってるんだけど、#nいざ出すとなると気後れしちゃって。"
"1015006-16" = "[s3] \"何か気後れするような理由があるの？\"\n[s4] \"それに、誰に送るつもりなの？\""
"1015006-17-コトネ" = "その……文通相手に送るんだ。"
"1015006-18-コトネ" = "航海中にたまたま知り合ったんだけど――"
"1015006-19-コトネ" = "色々と、すごく趣味が合う子で。"
"1015006-20-コトネ" = "好きな景色とか、ゲームとか、食べ物とか。"
"1015006-21-コトネ" = "……といっても、直接会ったことはないんだけど。"
"1015006-22-コトネ" = "私は陸上の情報を知るために短波通信を使っててさ。#nその子も、たまたま周波数があって知り合ったんだ。"
"1015006-23-コトネ" = "その後、何回も交信して、個人的なことまで打ち明けるようになって――"
"1015006-24-コトネ" = "それで……仲良くなれたと思ってたんだ。"
"1015006-25" = "[s] \"思ってた？\""
"1015006-26-コトネ" = "うん。もしかしたら、私の勘違いだったのかも。"
"1015006-27-コトネ" = "その子、少し前から急に連絡が途絶えちゃって。"
"1015006-28-コトネ" = "港に着く少し前、D.U.で一度会おうって送ったんだけど……#nそれっきり、返事がないんだ。"
"1015006-29-コトネ" = "やっぱり、直接会うのは重かったのかな。"
"1015006-30" = "[s] \"それは……落ちこんじゃうよね。\""
"1015006-31" = "[ns] \"でも、何か事情があるのかも。\""
"1015006-32-コトネ" = "うん。私もそう思った。"
"1015006-33-コトネ" = "だから、前にもらった住所に手紙を送ってみようと思ったんだけど……。"
"1015006-34-コトネ" = "急に不安になってきて。"
"1015006-35-コトネ" = "相手が避けてるかもしれないのに、#n何度も声をかけて迷惑じゃないかな……とか。"
"1015006-36-コトネ" = "顔も知らない相手のために、ここまで悩むのもどうなんだろう……とも思うし。"
"1015006-37-コトネ" = "……私、目が悪くて人の顔をちゃんと覚えられないんだよね。"
"1015006-38-コトネ" = "毎日会っても顔を覚えられない子もいる私が、#n顔も知らないその友達のことを、今すごく心配してる。"
"1015006-39-コトネ" = "これって……少し変？"
"1015006-40" = "[s] \"いや、全然変じゃないよ。\""
"1015006-41" = "[ns5] \"気持ちを伝える方法はいろいろあるから。\"\n[ns6] \"顔を知らなくても深くつながれることもあるよ。\""
"1015006-42-コトネ" = "……そう、かな。"
"1015006-43" = "[s7] \"それに、長くて大変な航海を支えてくれた友達なんでしょ？\"\n[s8] \"それを手放したくないって思うのは当然のことだよ。\""
"1015006-44-コトネ" = "………。"
"1015006-45-コトネ" = "うん、決めた。"
"1015006-46-コトネ" = "どうか、この手紙がちゃんと届きますように。"
"1015006-47-コトネ" = "ふぅ……決めてしまえば、思ったより簡単だったね。"
"1015006-48-コトネ" = "ありがとう、先生。#n先生がいなかったら……ずっと迷った挙句、あきらめてたと思う。"
"1015006-49" = "[s] \"どういたしまして。\""
"1015006-50" = "[ns9] \"それにしても、この時代に文通なんて――\"\n[ns10] \"ロマンがあっていいね。\""
"1015006-51-コトネ" = "そう？"
"1015006-52-コトネ" = "じゃあ今度は、先生にも手紙を書いてあげる。"
"1015006-53" = "[s] \"私に伝えたいことがあるなら、モモトークでもいいよ。\""
"1015006-54-コトネ" = "もちろん、モモトークでもいいけど……。"
"1015006-55-コトネ" = "さっき先生が言ったでしょ？"
"1015006-56-コトネ" = "気持ちを伝える方法はいろいろあるって。"
"1015006-57-コトネ" = "もしかしたら、モモトークでは伝えられない気持ちが届くかもしれないよ？#nふふ。"
