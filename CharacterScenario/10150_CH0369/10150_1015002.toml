[translation]
"1015002-1" = "好奇心旺盛なシャチ"
"1015002-2" = "（シャーレの仕事で、オデュッセイア海洋高等学校を訪れたある日）"
"1015002-3" = "（少し時間が空いたので、埠頭のベンチで日向ぼっこをすることにした）"
"1015002-4" = "（単調な波の音と、あたたかな陽射しで……#nだんだんと眠気が押し寄せてきた……）"
"1015002-5" = "（それから、どれくらい時間が経っただろう……）"
"1015002-6-？？？" = "ふぅん……。"
"1015002-7" = "[ns] \"うわっ……！？\""
"1015002-8-コトネ" = "ああ、先生だったんだ。"
"1015002-9-コトネ" = "私のお気に入りのベンチに座ってるから、誰かと思ったよ。"
"1015002-10" = "[s1] \"コ、コトネ？\"\n[s2] \"そんなに顔を近づけて……どうしたの？\""
"1015002-11-コトネ" = "んー……顔を確かめてたの。"
"1015002-12-コトネ" = "なんで？って……私、目が悪いから。"
"1015002-13-コトネ" = "この距離まで近づかないと、顔がちゃんと見えないんだよね。"
"1015002-14-コトネ" = "メガネ、この辺に置いたはずなんだけどな……。"
"1015002-15-コトネ" = "……あったあった。"
"1015002-16" = "[ns] \"起きたら目の前にコトネがいてびっくりしたよ。\""
"1015002-17-コトネ" = "そんなに驚くことかな？"
"1015002-18-コトネ" = "でも、たしかに……顔の確認をしてたら、慌てる子もいたね。"
"1015002-19-コトネ" = "みんな、このくらいの距離は落ち着かないのかな。"
"1015002-20-コトネ" = "どうしたもんかな。いつもメガネをかけるわけにもいかないし……。"
"1015002-21" = "[s] \"かけてない方が不便じゃない？\""
"1015002-22-コトネ" = "う～ん……でも、ダイビング部は急に潜ることが多いから。"
"1015002-23-コトネ" = "メガネをかけたままだと、不便が多いんだよね。"
"1015002-24" = "[s3] \"潜る時はメガネをかけないもんね……。\"\n[s4] \"でも……見えないと、水中でも危ないよ。\""
"1015002-25-コトネ" = "大丈夫。水の中では、視力以外も使えるから。"
"1015002-26" = "[s] \"視力以外って……？\""
"1015002-27-コトネ" = "肌で感じる海水の流れとか、水温とか……。"
"1015002-28-コトネ" = "一番分かりやすいのは音かな。"
"1015002-29-コトネ" = "水は空気より密度が高いから、音が遠くまで届くんだ。"
"1015002-30-コトネ" = "だから、周囲の状況もすぐに把握できるんだよ。"
"1015002-31-コトネ" = "もちろん、慣れるには少し訓練がいるけどね。"
"1015002-32" = "[s5] \"水の中で耳を澄ませるなんて、考えたこともなかったな……。\"\n[s6] \"どんな風に聞こえるんだろう？\""
"1015002-33-コトネ" = "うーん……。"
"1015002-34-コトネ" = "そうだ。私が水の中で録った音があるんだけど、聴いてみる？"
"1015002-35-コトネ" = "もしかしたら、水中で危険を察知するのに役立つかもしれないし。"
"1015002-36" = "[s] \"そうだね。ぜひ聴かせて。\""
"1015002-37-コトネ" = "うん。じゃあ、一つ目いくよ。"
"1015002-38-コトネ" = "……これは、何の音に聞こえる？"
"1015002-39" = "[s7] \"何か大きな機械が動く音が聞こえるけど……。\"\n[s8] \"エンジン音……？\""
"1015002-40-コトネ" = "正解。これは水中で聞いた船のエンジン音だよ。"
"1015002-41-コトネ" = "こういう音が聞こえたら、上を船が通ってる可能性が高いから……。#n浮上する時は気をつけてね。"
"1015002-42-コトネ" = "次は二つ目の音。"
"1015002-43" = "[ns9] \"なんだか象の鳴き声みたいだね……。\"\n[ns10] \"もしかして、クジラの鳴き声？\""
"1015002-44-コトネ" = "ちょっと似てるけど、これはクジラの鳴き声だよ。"
"1015002-45-コトネ" = "そう。これはザトウクジラの鳴き声なんだ。"
"1015002-46-コトネ" = "クジラの鳴き声って、どこか悲しそうで……。#n聞くとぞくっとすることもあるけど……。"
"1015002-47-コトネ" = "基本無害だから、そこまで警戒しなくて大丈夫。"
"1015002-48-コトネ" = "そもそも……#n大半の海の生き物は、人が先に手を出さない限り襲ってこないからね。"
"1015002-49-コトネ" = "未知の海の生き物を、みんな何となく怖がるけど……#n一番危ない生き物は、もしかしたら人間なのかも。"
"1015002-50-コトネ" = "最後に、三つ目の音は――"
"1015002-51-コトネ" = "ごめん、今のは別の音。"
"1015002-52-コトネ" = "今日、午前のダイビングが終わってから何も食べてなくて……。"
"1015002-53" = "[s] \"空腹も重大な脅威だよね。\""
"1015002-54" = "[ns11] \"何か食べに行こうか？\"\n[ns12] \"食べたいものはある？\""
"1015002-55-コトネ" = "……ポキ。"
"1015002-56-コトネ" = "魚がたっぷり入ったポキが好き。"
"1015002-57" = "[s] \"いいね。じゃあ行こうか。\""
"1015002-58" = "（そのあと……港でマグロがたっぷり入ったポキを食べながら、#nコトネと楽しい時間を過ごした）"
