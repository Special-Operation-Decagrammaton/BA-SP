[translation]
"1015005-1" = "漂流するシャチ"
"1015005-2" = "ロードス号"
"1015005-3" = "（トライデントでの業務を終え、#nコトネが休んでいるという「ロードス号」に向かった）"
"1015005-4" = "（だが、着いてみるとコトネの姿はおろか、#n行き交う生徒もほとんど見当たらない）"
"1015005-5" = "[ns] \"……コトネ？\""
"1015005-6-トライデントの部員" = "あれ、先生？お帰りになられたんじゃ……。"
"1015005-7-トライデントの部員" = "もしかして、誰かお探しですか？"
"1015005-8" = "[s] \"ダイビング部の副部長を探してるんだけど……。\""
"1015005-9-トライデントの部員" = "えっと……[ruby=ふちがみ]淵上[/ruby]さんのことでしょうか？"
"1015005-10-トライデントの部員" = "彼女なら、さっきこの辺りにいたんですけど……。"
"1015005-11-トライデントの部員" = "最後に見た時は水に流されてたので、今どこにいるかは……。"
"1015005-12" = "[s1] \"水に流されてたの！？\"\n[s2] \"一大事じゃないか！！\""
"1015005-13-トライデントの部員" = "あ、はい。まあ、そうなんですけど……。"
"1015005-14-トライデントの部員" = "多分、淵上さんなら大丈夫だと思いますよ。"
"1015005-15-トライデントの部員" = "普段からああやって浮いたまま休んでるみたいですし――"
"1015005-16-トライデントの部員" = "……行っちゃった。"
"1015005-17" = "（しばらくして、甲板を10分ほど走った末に……）"
"1015005-18" = "（穏やかな海の真ん中に横たわり、目を閉じているコトネの姿を見つけた）"
"1015005-19" = "[ns] \"コトネ！\""
"1015005-20" = "（コトネには私の声が届いていないのか、目を閉じたままぷかぷかと浮かんでいた）"
"1015005-21" = "[ns] \"コトネ――！\""
"1015005-22-コトネ" = "ん？誰か呼んだ……？"
"1015005-23-コトネ" = "あれ……先生？"
"1015005-24" = "[wa:1740]― [log=코토네]あ、[wa:1300]先生。[/log]"
"1015005-25" = "― [log=코토네]来てくれてたんだね。[/log]"
"1015005-26" = "― [log=코토네]ごめん。[/log]"
"1015005-27" = "― [log=코토네]水の中にいたから気づいてなくて……。[/log]"
"1015005-28" = "[ns] \"そうしてて平気なの？\""
"1015005-29" = "[wa:1000]― [log=코토네]ん？[wa:1480]ああ……[wa:1260]この本？[/log]"
"1015005-30" = "― [log=코토네]防水加工のものだから[wa:2160]大丈夫だよ。[/log]"
"1015005-31" = "[ns] \"本じゃなくて、コトネの話だよ。\""
"1015005-32" = "[wa:1370]― [log=코토네]そうじゃない……？[/log]"
"1015005-33" = "― [log=코토네]水の上で寝るのは危険？[/log]"
"1015005-34" = "― [log=코토네]心配しないで、[wa:1890]慣れてるから。[/log]"
"1015005-35" = "― [log=코토네]それに……[wa:1780]ここ、[wa:2190]すごく気持ちいいんだ。[/log]"
"1015005-36" = "[wa:1080]― [log=코토네]日向ぼっこしながら、[wa:2180]水中の音を聞いていられるの……。[/log]"
"1015005-37" = "― [log=코토네]そういう意味では、[wa:2360]読書とダイビングって[wa:2270]ちょっと似てるかも。[/log]"
"1015005-38" = "― [log=코토네]どちらも沈みゆくものの声を聴くから。[/log]"
"1015005-39" = "[wa:1500]― [log=코토네]ほら、[wa:2050]先生も一緒にやってみない？[/log]"
"1015005-40" = "― [log=코토네]私が……[wa:2210]水底の世界のお話を、[wa:3570]たくさん聞かせてあげるから。[/log]"
"1015005-41" = "[ns3] \"コトネがそう言うなら……。\"\n[ns4] \"……私もやってみようかな？\""
"1015005-42" = "（コトネに倣って、救命胴衣を着けたまま海に入った）"
"1015005-43" = "（試行錯誤の末、水の上で寝転ぶ姿勢を取ることには成功したが……）"
"1015005-44-コトネ" = "どう、先生？"
"1015005-45" = "[s] \"うーん……。\""
"1015005-46" = "[ns5] \"波が顔にかかって、落ち着かない……。\"\n[ns6] \"少しでもバランスを崩したら沈みそう……。\""
"1015005-47-コトネ" = "うーん、少し難しかったかな。"
"1015005-48-コトネ" = "やっぱり先生って、捕食者というより……被食者っぽいよね。"
"1015005-49-コトネ" = "他の生徒に甘い言葉で誘われても……#nこんなふうに簡単についていっちゃだめだよ。"
"1015005-50-コトネ" = "餌で獲物を水の中に誘い込むのは、典型的なシャチの狩り方だから。"
"1015005-51" = "[s] \"まさかコトネ、私を狩ろうとしてる？\""
"1015005-52-コトネ" = "ふふっ。さあ、どうかな。"
"1015005-53-コトネ" = "もしそうだとしたら――"
"1015005-54-コトネ" = "餌にならないように、頑張ってもがいてね。"
