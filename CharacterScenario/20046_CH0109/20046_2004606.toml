[translation]
"2004606-1" = "天地は只そこにあるなり"
"2004606-2" = "（道すがら、一変した街並みを眺めていた）"
"2004606-3" = "（綺麗になったのはもちろんのこと、お祭りの前よりも鮮やかで華やかな印象を受けた）"
"2004606-4" = "[ns] \"これって……折り紙？\""
"2004606-5-エキストラ部員A" = "お～い！こっちの飾り付け、終わったぞ～！こんな感じでいいんだよな？"
"2004606-6-折り紙部員A" = "は、はい！ばっちりです！#n……でも、本当にいいんですか？"
"2004606-7-折り紙部員A" = "こんな人通りの多い道の……それも、ど真ん中に私たちの作品を置かせてもらうなんて……。"
"2004606-8-地域商人会長" = "いやいや、感謝してもしきれないくらいですよ！#n荒れた街をどうしようか、頭を抱えてましたからね。"
"2004606-9-地域商人会長" = "今日からここは「折り紙ストリート」として再出発です！#n話題になれば、「折り紙祭り」なんてのも夢じゃないですよ！"
"2004606-10-折り紙部員A" = "折り紙祭り……！そんな風に認められるなんて、初めてです……えへへ。"
"2004606-11-エキストラ部員A" = "話の途中で悪いんだけどさ、アタシらの報酬は？"
"2004606-12-地域商人会長" = "ああ、あなたはエキストラ部の！その節は大変失礼しました。"
"2004606-13-地域商人会長" = "まさか報酬が未払いのままだったなんて……。#n今回の報酬とあわせて、しっかりお支払いさせてもらいますから！"
"2004606-14-エキストラ部員A" = "いいってことよ。魑魅一座がどう見られてるかはよく分かってるからな。"
"2004606-15-エキストラ部員A" = "それに、アタシらが「エキストラ部」になれたのも商人会のお陰らしいじゃんか。#nアタシらの活躍を証言してくれたって聞いたぜ。"
"2004606-16-地域商人会長" = "それくらいお安いご用です。"
"2004606-17-地域商人会長" = "次の公演もよろしく頼みますよ！"
"2004606-18-エキストラ部員A" = "もちろん！"
"2004606-19" = "（賑やかな通りを抜けて……）"
"2004606-20-折り紙部員B" = "ほ、本当に……部室を交換してくれるんですか？"
"2004606-21-折り紙部員B" = "こんな場所で、幽霊が出るって噂まであるのに……。"
"2004606-22-エキストラ部員B" = "泣く子も黙る元魑魅一座が、幽霊ごときでビビるわけないだろ！#nまっ、今はエキストラ部だけどな！"
"2004606-23-エキストラ部員B" = "それに、練習のたびに「うるさい！」って苦情が来る場所より、思いっきり騒げるアジトの方が性に合ってるってもんさ！"
"2004606-24" = "（部室問題の解決を喜ぶ生徒たちを横目に……陰陽部の部室に向かった）"
"2004606-25-ニヤ" = "なるほど～そんなことになっているとは。"
"2004606-26-ニヤ" = "ほっといても丸く収まるものですねぇ♪"
"2004606-27" = "[s] \"まだそうやってはぐらかすの？\""
"2004606-28-ニヤ" = "はて、なんのことだか？"
"2004606-29-ニヤ" = "私はなぁんにもしてませんよぉ？先生に叱られてたくらいじゃないですか？"
"2004606-30-ニヤ" = "もしぜ～んぶ上手くいっているとしたら――"
"2004606-31-ニヤ" = "たまたま絶妙なタイミングで、絶妙な場所にピースが揃っただけ。"
"2004606-32-ニヤ" = "こういうのを「陰陽の調和」って言うんじゃないですかね、にゃはは～♪"
"2004606-33-ニヤ" = "……んー、先生、まだ腑に落ちていない顔ですね？"
"2004606-34-ニヤ" = "では、この質問をもう一度。#n……先生は百鬼夜行をどう思いますか？"
"2004606-35" = "[s1] \"美しい場所だと思うよ。\"\n[s2] \"そんなに平和だとは思えないけど。\""
"2004606-36-ニヤ" = "ですよねぇ～。百鬼夜行ってやっぱり魅力的ですもんね。"
"2004606-37-ニヤ" = "四季折々の自然、毎日のように楽しいお祭り、生徒たちは自分の好きなことに全力で取り組む！"
"2004606-38-ニヤ" = "こんな素敵な学院が存続しているのは――"
"2004606-39-ニヤ" = "やっぱり運が良いからでしょうね、にゃははっ！"
"2004606-40-ニヤ" = "今回みたいな絶妙な偶然が積み重なって、この学院は成り立っているんです。"
"2004606-41-ニヤ" = "……う～ん、この答えでも足りませんか？"
"2004606-42-ニヤ" = "では、こうしましょうか！どうしても誰かの手柄にするなら……。"
"2004606-43-ニヤ" = "陰で黙々と頑張ってくれた、みんなのおかげってことで～♪"
"2004606-44" = "[ns] \"……。\""
"2004606-45-ニヤ" = "とまぁ、たまにはこんな大団円もいいのかなぁ……なんて。"
"2004606-46-ニヤ" = "にゃはは……そ、それはそうとですね？"
"2004606-47-ニヤ" = "騒ぎは解決したし、みんななんだかんだ幸せそうだし〜"
"2004606-48-ニヤ" = "今日のお説教は……どうでしょう、ひとつお見逃しを～？"
"2004606-49" = "[ns] \"ニヤ……。\""
"2004606-50-ニヤ" = "に、にゃは……？"
"2004606-51" = "[ns] \"よく頑張ったね。\""
"2004606-52-ニヤ" = "にゃはっ！？"
"2004606-53" = "（その後、ニヤの頭を容赦なく撫で続けた）"
