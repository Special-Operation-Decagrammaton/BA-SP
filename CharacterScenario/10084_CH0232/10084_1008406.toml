[translation]
"1008406-1" = "反響"
"1008406-2-コタマ" = "はぁ、はぁ……"
"1008406-3-コタマ" = "どうして、急に……山頂に登ろうだなんて……"
"1008406-4-コタマ" = "そこまで登らずとも、良い音は録れますし……"
"1008406-5-コタマ" = "むしろ山頂は風が強くて、雑音が入りやすいのに……"
"1008406-6" = "[s] \"でも、いつもは聴けない音にこそ価値があるんだよね？\""
"1008406-7-コタマ" = "うぅ……"
"1008406-8-コタマ" = "まさか、その言葉が自分に返ってくるとは……"
"1008406-9" = "[s1] \"もう少しだから頑張ろう。\"\n[s2] \"山頂はすぐそこだよ！\""
"1008406-10-コタマ" = "くっ……"
"1008406-11-コタマ" = "先生も毒されてしまったようですね……"
"1008406-12-コタマ" = "到着、しました……"
"1008406-13-コタマ" = "足が、震えて……これ以上は、もう……"
"1008406-14-コタマ" = "先生……？#n山の向こうに何か見えるのですか？"
"1008406-15" = "[ns] \"ヤッホー！\""
"1008406-16" = "……ヤッホォォ。"
"1008406-17" = "[ns3] \"コタマ、聴こえた？\"\n[ns4] \"声が返ってきたよ。\""
"1008406-18-コタマ" = "……なるほど、山びこですね。"
"1008406-19-コタマ" = "今の季節は草木が枯れている分、いつもより大きく跳ね返ってきているのかもしれませんね。"
"1008406-20" = "[s5] \"……なんだか元気が無いね。\"\n[s6] \"ごめん、無理させちゃったよね。\""
"1008406-21-コタマ" = "いえ、そこまで疲れているわけでは……"
"1008406-22-コタマ" = "ただ、私は反響音というものが、あまり好きではないのです。"
"1008406-23" = "[s] \"どうして？\""
"1008406-24-コタマ" = "……録音の邪魔になるからです。"
"1008406-25-コタマ" = "反響音とは、音が壁に当たって反射し発生するもの。"
"1008406-26-コタマ" = "録音するときは、いつもノイズが乗らないよう試行錯誤していますが……"
"1008406-27-コタマ" = "それでもゼロに抑えるのは難しく、本来の音を完璧に残すのは容易ではありません。"
"1008406-28-コタマ" = "先ほどもそうです。もっと正確に、先生の声を残したかったのに……"
"1008406-29" = "[s] \"それで元気が無かったんだね。\""
"1008406-30" = "[ns] \"でも、環境音も含めての記録なんじゃない？\""
"1008406-31-コタマ" = "いえ。正確な音源さえ録れていれば、後からいくらでもエコーをかけられます。"
"1008406-32-コタマ" = "結局、反響音はオリジナルの劣化にすぎませんから。"
"1008406-33-コタマ" = "それに、山びこは[ruby=こだま]木霊[/ruby]とも言うでしょう？"
"1008406-34-コタマ" = "小さい頃、それでイジられたこともあって……"
"1008406-35-コタマ" = "……あまり良い思い出がないのです。"
"1008406-36" = "[s] \"でも、単純な劣化ではないんじゃない？\""
"1008406-37-コタマ" = "どうしてですか？"
"1008406-38-コタマ" = "オリジナルの波形を真似た雑音に、一体どんな価値があるのでしょうか？"
"1008406-39" = "[s7] \"山と洞窟では別の跳ね返り方をするし……\"\n[s8] \"反響音によって、環境の違いを楽しめると思ったんだ。\""
"1008406-40" = "[ns] \"そう考えたら、オリジナルって何だろうなって。\""
"1008406-41-コタマ" = "……詭弁ですね。"
"1008406-42-コタマ" = "先生にそう言われたところで、木霊を好きにはなれません。"
"1008406-43-コタマ" = "ですが……"
"1008406-44-コタマ" = "ヤッホー！"
"1008406-45" = "ヤッホォォ……"
"1008406-46-コタマ" = "……それが先生の声なら、別かもしれませんね。"
"1008406-47-コタマ" = "多少のノイズが入ったところで、価値があるのもそうですが……"
"1008406-48-コタマ" = "先生の[ruby=・   ・   ・]コダマ[/ruby]、と考えたら――"
"1008406-49-コタマ" = "……先生、良ければ一緒に木霊を作りませんか？"
"1008406-50-コタマ" = "ここでしか聞けない……先生と私の声が混ざり合った[ruby=コダマ]和音[/ruby]を……"
"1008406-51-コタマ" = "じっくり、聴きたいです。"
"1008406-52" = "（その後、山頂でしか聞けない音をコタマと楽しんでから山を下った）"
