[translation]
"1010102-1" = "食堂アルバイト"
"1010102-2" = "（サオリから連絡をもらい、海辺の食堂に向かった）"
"1010102-3-サオリ" = "ご注文のお好み焼きだ。ごゆっくりどうぞ。"
"1010102-4-食堂の客A" = "美味しそう！"
"1010102-5-食堂の客A" = "……あれ、マヨネーズは？"
"1010102-6-サオリ" = "あっ！そうだった！#nすまない！すぐ持ってくる！"
"1010102-7-食堂の客B" = "すみませーん！#nまだメニュー来てないんですけどー！"
"1010102-8-サオリ" = "すまない！もう少し待ってくれ！"
"1010102-9" = "[ns] （忙しそうだし、ゆっくり待とう）"
"1010102-10-サオリ" = "はぁ、はぁ……。"
"1010102-11-サオリ" = "いらっしゃいませ。こちらはメニューに……。"
"1010102-12-サオリ" = "先生じゃないか。"
"1010102-13-サオリ" = "わざわざ来てくれたのか、感謝する。"
"1010102-14" = "[s] \"すごく忙しそうだね。\""
"1010102-15-サオリ" = "仕事の量が多いというより、まだ慣れなくてな……。"
"1010102-16-サオリ" = "未熟な姿を見せてしまったか。"
"1010102-17-サオリ" = "……あ、メニューならここにある。"
"1010102-18-サオリ" = "好きなものを選んでくれ。"
"1010102-19" = "[s1] \"色々あるんだね。\"\n[s2] \"サオリのオススメは？\""
"1010102-20-サオリ" = "それなら……。"
"1010102-21-サオリ" = "この一番注文の多いメニューにするのはどうだ？"
"1010102-22-サオリ" = "ここに載ってる、「真心サービス付きの特製オムライス」だな。"
"1010102-23-サオリ" = "……うん？"
"1010102-24-サオリ" = "真心サービスは、オムライスにケチャップで絵を描くサービスだ。"
"1010102-25-サオリ" = "絵なんて描いたところで、食べたら消えてしまうだろう？#nなのに、どうしてこんな手間をかけるのか理解できないが……。"
"1010102-26" = "[ns] \"じゃあ、それにする！\""
"1010102-27-サオリ" = "ん！？#n先生もオムライスを頼むのか？"
"1010102-28-サオリ" = "……そうか、分かった。#nしかし、可愛い絵を描ける保証はないが……。"
"1010102-29" = "[s3] \"むしろ、それでいいんだよ！\"\n[s4] \"サオリが描いてくれたら、それだけで充分だよ！\""
"1010102-30-サオリ" = "そ、そうなのか……？"
"1010102-31-サオリ" = "分かった。では――"
"1010102-32-？？？" = "おい！これはいったい、どういうことだ！？"
"1010102-33-サオリ" = "あっちのほうで何か起きたようだな。"
"1010102-34" = "[s] \"行かなくていいの？\""
"1010102-35-サオリ" = "……気になるが、まずは先生の注文が先だろう。"
"1010102-36-サオリ" = "目の前のお客様一人ひとりと向き合うよう、接客マナーを教わったからな。"
"1010102-37-？？？" = "さっさと責任者を呼べ！"
"1010102-38-サオリ" = "……。"
"1010102-39" = "[s] \"私なら大丈夫だよ。\""
"1010102-40-サオリ" = "すまない、様子を見てくる。"
"1010102-41" = "[ns] 心配になって、サオリについていく。"
"1010102-42-食堂の客" = "おい！なんだこれは！#nメニューと違うじゃねえか！"
"1010102-43-食堂の客" = "ふざけてんのか！？"
"1010102-44-サオリ" = "あなたは……たしか、さっきの料理を注文した……"
"1010102-45-サオリ" = "何か問題でもあったのか？"
"1010102-46-食堂の客" = "あるから店員を呼んだんだろ！"
"1010102-47-食堂の客" = "ちゃんと見てみろ！"
"1010102-48-サオリ" = "……すまないが、よく分からない。#n普通のオムライスじゃないか？"
"1010102-49" = "[s] （……それも、食べかけの）"
"1010102-50-食堂の客" = "自分で提供しておいて、気付かねえってどういうことだ？"
"1010102-51-食堂の客" = "ケチャップで猫の絵を描いてくれるって話だっただろ！"
"1010102-52-食堂の客" = "なのに、どっからどう見ても猫じゃなくてウサギになってるじゃねーか！"
"1010102-53" = "[ns] \"ただの言いがかりでしょ！\""
"1010102-54-食堂の客" = "注文と違うもんが出されたんだから……。"
"1010102-55-食堂の客" = "代金は要らねえよな？"
"1010102-56-サオリ" = "なっ……！"
"1010102-57-サオリ" = "……確かに、この絵は猫に見えないかもしれない。"
"1010102-58-サオリ" = "注文をミスした私が悪かった……。"
"1010102-59-食堂の客" = "そんじゃ、ここの飯代はタダってことでいいんだな？"
"1010102-60" = "[s] \"サオリ、それは――\""
"1010102-61-サオリ" = "なら、お前が満足するまで猫の絵を描き直してやろう！"
"1010102-62-食堂の客" = "……は？"
"1010102-63-食堂の客" = "そういうわけじゃ……！"
"1010102-64-サオリ" = "心配ない、期待していてくれ！"
"1010102-65-サオリ" = "こういう事態に備えて、ケチャップなら持ち歩いている！"
"1010102-66-サオリ" = "はぁぁっ！"
"1010102-67-食堂の客" = "ま、待ってくれ……！"
"1010102-68" = "（……1時間後）"
"1010102-69-サオリ" = "過去一番の出来だ……！#nこれで満足してくれたか？"
"1010102-70-食堂の客" = "い、いや。こんなつもりじゃ……。"
"1010102-71-サオリ" = "これでもダメとは……。"
"1010102-72-サオリ" = "よし、もう一度やり直そう！"
"1010102-73" = "（……4時間後）"
"1010102-74-サオリ" = "どうだ！#nこれなら猫に見えるだろう？"
"1010102-75-食堂の客" = "わ、分かったから……！"
"1010102-76-サオリ" = "納得できてなさそうだが……。"
"1010102-77-サオリ" = "よし、もう一度だ！"
"1010102-78-食堂の客" = "も、もうやめてくれぇ！#n私が悪かった！"
"1010102-79-食堂の客" = "か、金なら払う！#n許してくれっ！"
"1010102-80-サオリ" = "ま、待ってくれ！"
"1010102-81-サオリ" = "うまく描けたと思うんだが……！"
"1010102-82-サオリ" = "……行ってしまった。"
"1010102-83-サオリ" = "先生……私の絵は、そんなにダメだったのだろうか？"
"1010102-84" = "[s] \"……絵の問題じゃないと思うよ。\""
"1010102-85-サオリ" = "……？"
"1010102-86-サオリ" = "なるほど……#nつまり、あの客はお金を払いたくないがために、言いがかりをつけてきたと？"
"1010102-87-サオリ" = "しかし、思い通りにならず、金を払って出ていったのか。"
"1010102-88-サオリ" = "ありがとう、勉強になった。#n今日のことはしっかりと覚えておこう。"
"1010102-89-サオリ" = "……それと、今度からは言いがかりをつけられないように、#nケチャップで絵を描く練習もしなくては。"
