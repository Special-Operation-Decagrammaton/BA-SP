[translation]
"1010103-1" = "お祭りの音を探して"
"1010103-2-サオリ" = "先生、こっちだ。"
"1010103-3-サオリ" = "来てくれて感謝する、ありがとう。"
"1010103-4" = "[s] \"具体的には何をするの？\""
"1010103-5-サオリ" = "今回のアルバイトでは、DJステージの準備を手伝っている。"
"1010103-6-サオリ" = "しかし、どうやら人手が足りないようでな。"
"1010103-7-サオリ" = "一番重要な「サンプル」が揃ってないんだ。"
"1010103-8-サオリ" = "……ああ、最初にサンプルの説明をしなくては。"
"1010103-9-サオリ" = "DJは、既存の音源をミックスしてパフォーマンスするらしい。"
"1010103-10-サオリ" = "この手法を「サンプリング」と呼ぶのだと、説明を受けた。"
"1010103-11-サオリ" = "だからいくら機材が揃っていたところで、音源が無くては始まらない。"
"1010103-12" = "[s] \"いつもはどうやってサンプルを揃えてるんだって？\""
"1010103-13-サオリ" = "作者に使用料を払って、一時的に使っていると聞いた。"
"1010103-14-サオリ" = "「DJの始め方」という本にも、そう書かれていたから間違いない。"
"1010103-15-サオリ" = "しかし、どうやら今回は予算が限られているせいで、難しいそうだ。"
"1010103-16-サオリ" = "となれば、自ら音源を手に入れるしかない。"
"1010103-17" = "[s] \"サオリが作曲するってこと？\""
"1010103-18-サオリ" = "そうしたいところだが、今の私には無理だろう。"
"1010103-19-サオリ" = "だが、音を集めに行く程度ならできると思う。"
"1010103-20-サオリ" = "色々なイベントが開催されているお祭りなら、#nサンプルに使えそうな音もあるはず。"
"1010103-21-サオリ" = "要するに、現地調達だ。"
"1010103-22" = "[s] \"分かった、一緒に行こうか。\""
"1010103-23-サオリ" = "ありがとう。"
"1010103-24-サオリ" = "では、さっそく向かうとしよう。"
"1010103-25-サオリ" = "……どこから回ったものか。"
"1010103-26-サオリ" = "先生、何か良いアイデアはあるか？"
"1010103-27" = "[s] \"まずは屋台のほうとかどう？\""
"1010103-28-サオリ" = "確かに、あれほど賑わっていれば……。"
"1010103-29-サオリ" = "良い音源が[ruby=と]録[/ruby]れるかもしれない。"
"1010103-30-屋台の商人" = "イカ焼きに焼き鳥、焼きそばもあるよ！"
"1010103-31-屋台の商人" = "さあ、いらっしゃい！"
"1010103-32" = "[s] \"聞いてるだけでよだれが……。\""
"1010103-33-サオリ" = "食べ物を焼く音か……。"
"1010103-34-サオリ" = "これは使えそうだ。"
"1010103-35-サオリ" = "さっそく、収録を――"
"1010103-36-サオリ" = "……先生、どうした？"
"1010103-37-サオリ" = "焼き鳥を買ってくれるのか？"
"1010103-38-サオリ" = "い、いや、大丈夫だ。#nむしろ、ここは先生を付き合わせている私が……。"
"1010103-39" = "[s] \"サオリを応援したいんだ。\""
"1010103-40-サオリ" = "……そうか。"
"1010103-41-サオリ" = "何も買わずに録音だけするのも、お店に迷惑だろう。"
"1010103-42-サオリ" = "ありがとう……ここは素直に受け取っておく。#nだが、次は私に支払わせてくれ。"
"1010103-43-サオリ" = "……規則的な波の音、か。"
"1010103-44-サオリ" = "これもサンプルに使えそうだ。"
"1010103-45-サオリ" = "よし、録音機の電源を……。"
"1010103-46-サオリ" = "……距離が遠いからか、うまく録音できないな。"
"1010103-47" = "[s] \"私が手伝っても良い？\""
"1010103-48-サオリ" = "うーん……これ以上近づくには、海に入らなくてはいけない。"
"1010103-49-サオリ" = "……なっ、先生！？#nそこまでしてもらっては……。"
"1010103-50" = "[s1] \"風もあって気持ち良いね。\"\n[s2] \"私がサオリの力になりたいんだ。\""
"1010103-51-サオリ" = "分かった、先生がそう言うのなら……。"
"1010103-52-サオリ" = "では、これで録音を――"
"1010103-53" = "[ns] \"うわっ！\""
"1010103-54-サオリ" = "先生、大丈夫か！？"
"1010103-55" = "[s] \"大丈夫、少し足が滑っただけだよ。\""
"1010103-56-サオリ" = "服が濡れてしまったじゃないか。#n早く乾かさなくては風邪を……。"
"1010103-57-サオリ" = "……うん？"
"1010103-58-サオリ" = "録音機は無事だから安心してほしい、と？"
"1010103-59-サオリ" = "先生。こういう状況では、身の安全を最優先にしてくれ。"
"1010103-60-サオリ" = "もし何かあっては、合わせる顔がない。"
"1010103-61-サオリ" = "……だが、感謝はしている。#nありがとう、先生。"
"1010103-62-サオリ" = "今度は森か……。"
"1010103-63-サオリ" = "色々な虫の声が聞こえてくるな。"
"1010103-64" = "[s] \"これも使えそう？\""
"1010103-65-サオリ" = "試してみなくては分からないが、素材が多いに越したことはないだろう。"
"1010103-66-サオリ" = "もう少し進んでみよう。"
"1010103-67-サオリ" = "……こうして歩いていると、なんだか妙な気分になるな。"
"1010103-68-サオリ" = "誰かを必死に追いかけることも、追われることもなく、#nゆったりとした時間を過ごせるだなんて。"
"1010103-69-サオリ" = "考えてみれば、今まで一度もこんな余裕のある時間は無かった。"
"1010103-70-サオリ" = "最近は、アルバイトで色々な経験も積めて……。"
"1010103-71" = "[s] \"こうやって散歩がしたくなったら、いつでも呼んでね。\""
"1010103-72-サオリ" = "……先生なら、そう言うだろうと思った。"
"1010103-73-サオリ" = "ありがとう、ぜひ頼む。"
"1010103-74-サオリ" = "ふぅ、もうこんなに暗くなってしまったとは。"
"1010103-75-サオリ" = "そろそろ戻る時間だ。"
"1010103-76" = "[s] \"いつも頑張ってバイトをしてるサオリは、本当にすごいね。\""
"1010103-77-サオリ" = "……そ、そうだ。#nまだバイトの最中だった。"
"1010103-78-サオリ" = "任務中だというのに、本分を忘れていた。"
"1010103-79-サオリ" = "きっと、気が緩んでいたからに違いない。"
"1010103-80-サオリ" = "なぜなら……。"
"1010103-81" = "[s] \"なぜなら……？\""
"1010103-82-サオリ" = "ぎょ、業務上の秘密だ。"
"1010103-83-サオリ" = "と、とにかく早く戻って、録音した音を加工しなくては。"
"1010103-84-サオリ" = "そろそろ帰ろう、先生。"
"1010103-85-サオリ" = "今日は付き合ってくれて助かった。#n……ありがとう。"
