[translation]
"1003505-1" = "突然の提案"
"1003505-2" = "古書館内部"
"1003505-3" = "（ウイを尋ねて古書館へと訪れた）"
"1003505-4" = "（相変わらず古風で不思議な空気感の中に、微かに生活感も感じられる）"
"1003505-5-？？？" = "あ、せ、先生。お待ちしておりました。"
"1003505-6-？？？" = "えっと、その……。"
"1003505-7-？？？" = "こちら、です……！"
"1003505-8-ウイ" = "ま、まだ真っ白ですが……"
"1003505-9-ウイ" = "その、わ、私と先生で、これから先……！"
"1003505-10" = "[s1] \"ちょ、ちょっと待って。\"\n[s2] \"まず説明を貰えると嬉しいかな……？\""
"1003505-11-ウイ" = "……あ。"
"1003505-12-ウイ" = "……あ。"
"1003505-13-ウイ" = "す、すみません、また順番を間違えました……。"
"1003505-14-ウイ" = "これは、その……いわゆる「交換ノート」、でして……。"
"1003505-15-ウイ" = "い、言いたいことや、考えたこと……それを、交互に書くんです。"
"1003505-16-ウイ" = "も、もしかして既にこの時点で嫌、ですかね……。"
"1003505-17-ウイ" = "少しでも、その……知れればと、思って……。"
"1003505-18-ウイ" = "……せ、先生の、ことを。"
"1003505-19-ウイ" = "そ、そう言った感じなのですが……！"
"1003505-20-ウイ" = "……？"
"1003505-21-ウイ" = "えっと、な、何か私、また失礼を……？"
"1003505-22-ウイ" = "……あ。"
"1003505-23-ウイ" = "や、やっぱり持ち運ぶには大きい、ですかね……？"
"1003505-24-ウイ" = "考えてみたらそうですね……わ、私ったらバカみたいに、そんなことも気づかず……。"
"1003505-25-ウイ" = "す、すみません。この子くらい厚くて大きい方が、たくさん書けて、長く続くかと……。"
"1003505-26-ウイ" = "そう思って、つい……。"
"1003505-27-ウイ" = "ごめん、なさい……。"
"1003505-28" = "[s] \"……。\""
"1003505-29-ウイ" = "あ、す、すみません。でしたらもう少し、小さい子に……手帳サイズくらいの……。"
"1003505-30-ウイ" = "……え、この子のままで？"
"1003505-31-ウイ" = "で、ですがその、少し負担になってしまうのでは……。"
"1003505-32-ウイ" = "あちこち行かれる先生に、それは……。"
"1003505-33-ウイ" = "……わざわざ持ち運ばなくても？"
"1003505-34-ウイ" = "そ、それは、どういう……？"
"1003505-35-ウイ" = "……ここに？"
"1003505-36-ウイ" = "交換ノート自体は、ここに置いたまま……？"
"1003505-37-ウイ" = "……な、なるほど。"
"1003505-38-ウイ" = "ここにお越しになるたびに、書いていくと……。"
"1003505-39-ウイ" = "わ、私はそれでも勿論……せ、先生がよろしければ……。"
"1003505-40" = "[s3] \"せっかくだし、この子が良いなって。\"\n[s4] \"ウイが選んだ子だから。\""
"1003505-41-ウイ" = "……！！"
"1003505-42-ウイ" = "……！！"
"1003505-43-ウイ" = "……。"
"1003505-44-ウイ" = "うっ、あっ……！"
"1003505-45" = "[s5] \"ウイ！？\"\n[s6] \"ご、ごめん！？\""
"1003505-46-ウイ" = "あ、いえ、その……すみません、ただ、私は……。"
"1003505-47-ウイ" = "あ、いえ、その……すみません、ただ、私は……。"
"1003505-48-ウイ" = "その、嬉しくて……。"
"1003505-49-ウイ" = "こういったことは、ほとんど無かったので……。"
"1003505-50-ウイ" = "ありがとうございます、先生……大事に、しますね。宝物として……。"
"1003505-51-ウイ" = "そこまで気負わなくても、ですか？は、はい……。"
"1003505-52-ウイ" = "ほ、本当に、ありがとうございます……っ……。"
"1003505-53" = "（その後泣いてるウイを宥めつつ、今後書いていく交換ノートについてあれこれ話をした）"
"1003505-54" = "（……とはいえ普段からモモトークで会話はしていたため、その交換ノートは読んだ本の感想を書き合う場になった）"
