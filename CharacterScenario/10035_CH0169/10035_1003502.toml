[translation]
"1003502-1" = "古書館の主"
"1003502-2" = "トリニティの街"
"1003502-3" = "（ウイのメッセージが気になり、時間を見つけて古書館へと訪れた）"
"1003502-4" = "（相変わらず建物周辺にはバリケードが築かれており、扉は様々な意味で固く閉ざされている）"
"1003502-5" = "[ns1] ウイを呼んでみる。\n[ns2] 静かにノックをしてみる。"
"1003502-6" = "（……返事が無い）"
"1003502-7" = "[s3] もう少し大きい声で呼んでみる。\n[s4] もう少し強くノックしてみる。"
"1003502-8-？？？" = "な、中には誰もいません！留守なのでお帰りください……！"
"1003502-9-？？？" = "な、中には誰もいません！留守なのでお帰りください……！"
"1003502-10" = "[s5] \"いなかったら普通、返事は来ないのでは……？\"\n[s6] \"私だよ、ウイ。\""
"1003502-11-？？？" = "う、うるさいですね……！"
"1003502-12-？？？" = "う、うるさいですね……！"
"1003502-13-？？？" = "誰もいないと言って――"
"1003502-14-？？？" = "……あれ？"
"1003502-15-？？？" = "そ、その声は……。"
"1003502-16-ウイ" = "……っ！？"
"1003502-17-ウイ" = "せ、先生！？"
"1003502-18-ウイ" = "す、すみません、てっきりまた昨日の方々かと……。"
"1003502-19" = "[s7] \"ううん、大丈夫。＂\n[s8] \"気にしないで。\""
"1003502-20-ウイ" = "あ、ど、どうぞこちらへ……。"
"1003502-21-ウイ" = "あ、ど、どうぞこちらへ……。"
"1003502-22-ウイ" = "せ、先生でしたら、全然構いませんので……！"
"1003502-23-ウイ" = "……あ。"
"1003502-24" = "[s9] \"……ウイ？\"\n[s10] \"どうかした？\""
"1003502-25-ウイ" = "そ、その、えっと……。"
"1003502-26-ウイ" = "そ、その、えっと……。"
"1003502-27-ウイ" = "しょ、少々お待ちください！"
"1003502-28-ウイ" = "……ふぅ。"
"1003502-29-ウイ" = "お、お待たせしました、もう大丈夫です……。"
"1003502-30-ウイ" = "……？ち、違いますよ！？急いで掃除したとかでは……！"
"1003502-31-ウイ" = "い、いや、当たらずとも遠からずと言いますか、完全に否定するわけではありませんが……！"
"1003502-32-ウイ" = "と、とにかくどうぞ……。"
"1003502-33" = "[ns] ウイと一緒に中に入る。"
"1003502-34" = "古書館内部"
"1003502-35" = "（古書館は以前と変わらず、不思議な雰囲気が漂っている）"
"1003502-36" = "（ところどころ慌てて隠したであろう衣類や、何かの機材などが見えた）"
"1003502-37-ウイ" = "い、いらっしゃいませ……。"
"1003502-38-ウイ" = "あ、そ、そっちはダメです……！散らかってますので！"
"1003502-39-ウイ" = "す、すみません、こうなると分かっていたら事前に片づけていたのですが……。"
"1003502-40-ウイ" = "普段はその、だ、誰も来ない場所なので……。"
"1003502-41-ウイ" = "本を借りるなら普通、中央図書館ですし……よっぽどの古書などでなければ……。"
"1003502-42-ウイ" = "そ、そういえば先生は、どうしてわざわざここに……？"
"1003502-43-ウイ" = "中央図書館にいないような子でも、お探しですか？"
"1003502-44-ウイ" = "あ、違いましたか。で、では一体……。"
"1003502-45-ウイ" = "ただ来てみた、だけ……？"
"1003502-46-ウイ" = "あ、あのメッセージで……？き、気になさらなくて良かったのに……。"
"1003502-47-ウイ" = "もう過ぎたことですし、な、何か大きなことがあったわけでもないので……。"
"1003502-48-ウイ" = "その、ただ……。"
"1003502-49-ウイ" = "戻ってきた子たちの、その、状態が……。"
"1003502-50-ウイ" = "チェックのためなのか、端っこが折られていたり……無理やり押さえつけたせいか、つなぎ目が傷ついていたり……。"
"1003502-51-ウイ" = "はあ……。"
"1003502-52-ウイ" = "これだから、外の方は……と、とはいえ、何でもかんでも拒絶するわけにも……。"
"1003502-53-ウイ" = "……そ、それだけのことです、お気になさらず。"
"1003502-54-ウイ" = "……？"
"1003502-55-ウイ" = "息抜き……？そ、そう言われましても、そのたびに先生をお呼びするわけにも……。"
"1003502-56-ウイ" = "……迷惑では、ありませんか？"
"1003502-57-ウイ" = "「先生だから」……。"
"1003502-58-ウイ" = "そ、そうですか……よく分かりませんが、えっと……ありがとうございます、先生。"
"1003502-59-ウイ" = "あぁ、えーと……。"
"1003502-60-ウイ" = "ちょ、ちょっと待っててください。お気遣いいただいてばかりではアレですし、何かその、せめて先生の負担を減らせるように……。"
"1003502-61-ウイ" = "……あ。"
"1003502-62-ウイ" = "先生、こちらを……。"
"1003502-63" = "[s11] \"これは……？\"\n[s12] \"鍵？\""
"1003502-64-ウイ" = "は、はい……ここの正門の鍵、です。"
"1003502-65-ウイ" = "は、はい……ここの正門の鍵、です。"
"1003502-66-ウイ" = "私が寝てる時とかは、開けられませんし……せ、先生のご都合が良いタイミングで、来られるように……。"
"1003502-67-ウイ" = "……？いえ、図書委員会の分とかでは……。"
"1003502-68-ウイ" = "予備とかもありませんし……はい、私の鍵です。"
"1003502-69-ウイ" = "ど、どうせ私はここから出ませんし……必要無いと言いますか、えっと……。"
"1003502-70-ウイ" = "こうすれば、きょ、今日みたいに意図せず先生に、無礼な物言いをせずに済みますし……。"
"1003502-71-ウイ" = "は、入って来られるのは先生だけ、ということになりますので……。"
"1003502-72-ウイ" = "その……。"
"1003502-73-ウイ" = "……？"
"1003502-74-ウイ" = "えっと……。"
"1003502-75-ウイ" = "や、やっぱり要らないですよね……すみません、何だかその、じ、自意識過剰なことを……。"
"1003502-76-ウイ" = "違うんですか？では、どうして鍵を……。"
"1003502-77" = "[s13] \"ただ単に、主が持ってるべきだと思うから。\"\n[s14] \"私が来る時は、モモトークで連絡するから。\""
"1003502-78-ウイ" = "先生……。"
"1003502-79-ウイ" = "先生……。"
"1003502-80-ウイ" = "……わ、分かりました。次からはその、片付けておきますので……。"
"1003502-81-ウイ" = "……ふふっ。"
"1003502-82-ウイ" = "それはそれで、悪くないかもしれませんね……。"
"1003502-83-ウイ" = "えっと、その……。"
"1003502-84-ウイ" = "せっかく古書館までいらっしゃったことですし……少し、私のおすすめの子などを見ていかれませんか？"
"1003502-85-ウイ" = "き、きっと先生が興味を示してくれるような、面白い子がいるはずですので。"
"1003502-86" = "（その後ウイと一緒に、様々な古書を読んで過ごした）"
