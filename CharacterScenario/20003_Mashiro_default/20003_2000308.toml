[translation]
"2000308-1" = "正義の実現"
"2000308-2" = "トリニティ・屋上"
"2000308-3-マシロ" = "うーん……予想より少し遅いですね。#n確かそろそろ、ここを通るタイミングのはずなのですが……。"
"2000308-4-マシロ" = "しかし油断はできません。#n敵を狙えるタイミングは、一瞬しかありませんから！"
"2000308-5-マシロ" = "え？いくら極悪非道な悪の幹部だとしても、銃で撃ち抜くのはひどすぎる……？"
"2000308-6-マシロ" = "ご安心ください。この銃に装填された弾丸は、人を眠らせるための麻酔弾です。"
"2000308-7-マシロ" = "相手が倒れたらすぐに拘束し、ツルギ先輩に取り調べをお願いする予定です。"
"2000308-8" = "― ふう……[wa:1200]今日に限って暑いですね。"
"2000308-9" = "[wa:700]― 完璧な狙撃のためなら、[wa:1700]これぐらいの暑さは[wa:1000]十分耐えられますが。"
"2000308-10" = "― 少し……[wa:1300]汗臭かったりしないかな……？"
"2000308-11" = "― こんな夏の日には、[wa:2000]他の生徒たちの[wa:1000]白い制服が羨ましいですね。"
"2000308-12" = "[wa:500]― 先生……[wa:1500]なんだか視線がいやらしい気がしますが……。"
"2000308-13" = "― きちんと目標を[wa:1000]注視されているんですよね？"
"2000308-14" = "（プルルルル）"
"2000308-15-マシロ" = "あれ、正義実現委員会から連絡が……？"
"2000308-16-正義実現委員会部員" = "マシロさん？#n今はどこで何をされているところですか？"
"2000308-17-マシロ" = "昨日ハスミ先輩からブラックマーケットの幹部が学園近くを通るとお聞きして……#n付近の狙撃ポイントで待機中でした。"
"2000308-18-正義実現委員会部員" = "なんと、それでは、無駄足になってしまいましたね……。"
"2000308-19-マシロ" = "え？それは、どういう意味ですか？"
"2000308-20-正義実現委員会部員" = "例の悪党、昨夜ツルギ先輩が捕まえてきたんです。"
"2000308-21-正義実現委員会部員" = "ツルギ先輩もまったく、勝手に襲撃を敢行されるなんて……。"
"2000308-22-マシロ" = "そんな……それでは私は何のために……。"
"2000308-23-正義実現委員会部員" = "とりあえず帰還をお願いできればと思います、お疲れ様です。"
"2000308-24-マシロ" = "うう……はい。"
"2000308-25" = "その後、落ち込んだマシロを慰めながら学園に戻った。"
