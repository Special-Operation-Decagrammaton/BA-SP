[translation]
"2002002-1" = "天才ハッカーの嗜好"
"2002002-2" = "（ヒマリから連絡をもらって、ミレニアムの部室棟までやって来た）"
"2002002-3" = "ミレニアムサイエンススクール・第8部室棟の廊下"
"2002002-4" = "[ns] \"ヒマリから送られてきた場所はここだけど……。\""
"2002002-5" = "（その時、何かが風の音を立てながら近づいてきた）"
"2002002-6" = "[ns] \"これって……ミレニアムの警備ドローン？\""
"2002002-7" = "[ns] \"あ、ついてきてってことかな？\""
"2002002-8" = "（ドローンに導かれるがまま進むと、そこは奥まったところにある部室だった）"
"2002002-9" = "（扉の横に貼られたドアプレートには、こんな言葉が書かれていた）"
"2002002-10" = "[ns] \"「息継ぎNG・円周率暗唱部」……？\""
"2002002-11-？？？" = "お待ちしておりました、先生。お入りください。"
"2002002-12-ヒマリ" = "ふふっ、時間通りですね。ようこそいらっしゃいました。"
"2002002-13-ヒマリ" = "案内、ご苦労さまでした。持ち場に戻ってくださいね。"
"2002002-14" = "[ns] \"ヒマリ？今のドローンは……。\""
"2002002-15-ヒマリ" = "ミレニアムの警備ドローンですよ？"
"2002002-16-ヒマリ" = "私は病弱美少女ですから、直接先生をお出迎えするのは難しいので。#nたまたま部室近くを警備していたドローンをハッキングし……"
"2002002-17-ヒマリ" = "……ええ、少しお借りしただけですとも。"
"2002002-18-ヒマリ" = "あの子たち、可愛らしくて良い子でしょう？"
"2002002-19-ヒマリ" = "案内役として最適だと思うのです。"
"2002002-20" = "[ns] \"またそんなことを……\""
"2002002-21" = "[ns1] \"それで、ここはどこなの？\"\n[ns2] \"ドアプレートには、なんか妙な名前が書かれてたような……。\""
"2002002-22-ヒマリ" = "えっ……。#nそ、そんなに変な名前でしょうか……？"
"2002002-23-ヒマリ" = "……何か良い名前はないかと、三日三晩熟考を重ねた末に至った、とても知的で上品かつ、正体を隠すのにピッタリな……"
"2002002-24-ヒマリ" = "まさにミレニアムが誇る天才美少女らしい良い名前だと思ったのですが……。"
"2002002-25" = "[s] （見るからに落ち込んでいる表情だ……！）"
"2002002-26" = "[ns] \"いや、その……言葉のあやだよ。個性豊かで素敵な名前だね。\""
"2002002-27-ヒマリ" = "……ふふっ、うふふっ、そうでしょう？"
"2002002-28-ヒマリ" = "先生なら分かってくださると思いました♪"
"2002002-29-ヒマリ" = "誰もが認めるミレニアム最高の天才清楚系病弱美少女ハッカーこと……"
"2002002-30-ヒマリ" = "私、[ruby=あけぼし]明星[/ruby]ヒマリが考えた名前ですもの！"
"2002002-31" = "[ns] \"……それで、ヒマリはなぜここに？\""
"2002002-32-ヒマリ" = "そうでした、まだ話の途中でしたね。"
"2002002-33-ヒマリ" = "一言で説明すると……そうですね。#nここは私だけの秘密の「隠れ家」とでも申しましょうか。"
"2002002-34" = "[s] \"隠れ家？\""
"2002002-35-ヒマリ" = "はい。普段使用している特異現象捜査部とヴェリタスの部室は、「ビッグシスター」の監視下にありますからね。"
"2002002-36-ヒマリ" = "そこでミレニアムの管理システムをハッキングして、使われていない部室の許可証を発行したので、ここは私だけの空間となりました。"
"2002002-37-ヒマリ" = "……なぜそこまでするのか、ですか？"
"2002002-38-ヒマリ" = "もちろん、休息のためです。#n私のような超天才清楚系病弱美少女には、おやすみの時間が……"
"2002002-39-ヒマリ" = "いえ、脳の休息が必要不可欠なのです。"
"2002002-40" = "[s3] \"なるほど。でも行き来してるうちに場所がバレるんじゃない？\"\n[s4] \"さっきのドローンとか、あちこちにある防犯カメラとか……。\""
"2002002-41-ヒマリ" = "ふふっ。その程度のこと、この天才美少女ハッカーにとっては問題になりません。"
"2002002-42-ヒマリ" = "ふふっ。その程度のこと、この天才美少女ハッカーにとっては問題になりません。"
"2002002-43-ヒマリ" = "ドローンの警備ルートはもちろんの事、必要に応じてハッキングし、ルート修正をするくらい造作もありません。"
"2002002-44-ヒマリ" = "防犯カメラの死角も頭に入っていますし、ちょっとした映像の差し替えくらい赤子の手をひねるようなものです。"
"2002002-45-ヒマリ" = "私に隙などありません、無敵です！ふふふふふっ。"
"2002002-46" = "[s5] \"流石はヒマリ、スケールが違うね。\"\n[s6] \"でもそんな大事な場所に、私が来ても良かったの……？\""
"2002002-47-ヒマリ" = "……はい。#nそれでしたら、何も問題ありません。"
"2002002-48-ヒマリ" = "来ていただいて良かったといいますか、来ていただかなければ困ったといえば良いのか……。"
"2002002-49" = "[s] \"どういうこと？\""
"2002002-50-ヒマリ" = "先生もご存知のように、私という存在は常に衆目を集めています。#nそう、それはまるで雲の上に咲く一輪の花のように。"
"2002002-51-ヒマリ" = "立てば芍薬、座れば牡丹……ため息を吐く姿は百合の花――と評されている天才美少女ではありますが……。"
"2002002-52" = "[s] \"よどみなくスラスラと……すごいね。\""
"2002002-53-ヒマリ" = "だからこそ、周囲に隙を見せてはいけないと思っております。"
"2002002-54-ヒマリ" = "しかし……いくら私のように隙一つない完璧美少女であっても、常に気を張って生きていくわけにはいきません。"
"2002002-55-ヒマリ" = "コホン……そうですね。#nここにお呼び立てした理由は……。"
"2002002-56-ヒマリ" = "たまには、その……ほっとできる時間といいますか……。"
"2002002-57-ヒマリ" = "何の見返りもなしに寄り添ってくれて、信頼できる人がいたらいいなと……。"
"2002002-58-ヒマリ" = "私のこのような一面を見せても一緒にいてくれる人の存在を思い出したのです。"
"2002002-59-ヒマリ" = "ですから……。"
"2002002-60" = "[s] \"うん……？\""
"2002002-61-ヒマリ" = "……せっかく隠れ家を用意したものの、やはり一人で過ごすのは退屈でして。"
"2002002-62-ヒマリ" = "先生でしたら、その……"
"2002002-63-ヒマリ" = "私の話し相手になってくれるのではないかと思い……"
"2002002-64-ヒマリ" = "勝手なことではありますが……"
"2002002-65-ヒマリ" = "そのような理由で……"
"2002002-66-ヒマリ" = "来ていただいたといいますか……"
"2002002-67-ヒマリ" = "（チラッ）"
"2002002-68" = "[s] \"なんだ。それならいつでも歓迎だよ、ヒマリ。\""
"2002002-69-ヒマリ" = "……ぁ。"
"2002002-70" = "[s] \"ヒマリ？\""
"2002002-71-ヒマリ" = "あ、いえ……"
"2002002-72-ヒマリ" = "ふふっ。#nやはり私の予想通りでした。"
"2002002-73-ヒマリ" = "私の優れた頭脳にかかれば、一秒もかからずに導き出せましたけどね。#n今日は私の勝利です。"
"2002002-74" = "[ns] \"いつから勝負になってたの……？\""
"2002002-75-ヒマリ" = "些細なことを気にしてはいけませんよ。#n「付き合う」と、そう言ってくだされば、それで十分なのです。"
"2002002-76-ヒマリ" = "……私たちの関係に「アンドゥ」はありませんので。"
"2002002-77" = "[s] \"安心していいよ、ヒマリ。\""
"2002002-78-ヒマリ" = "ふふっ。"
"2002002-79-ヒマリ" = "では本日も一日よろしくお願いしますね、先生。"
"2002002-80" = "（そうして、ヒマリとのんびりとした午後のひとときを過ごすことになった）"
"2002002-81-ヒマリ" = "……こうして先生と二人きりの時間を手に入れた今。"
"2002002-82-ヒマリ" = "普段の私なら、このあたりで天才病弱美少女の成し遂げた結果に「どや顔」するところですが……。"
"2002002-83-ヒマリ" = "残念ながら、一つだけ思い通りにならないことがあるのです。"
"2002002-84" = "[s] \"どんな問題なの？\""
"2002002-85-ヒマリ" = "問題……というほどではありません。"
"2002002-86-ヒマリ" = "ご存知の通り、ミレニアムではお昼の校内放送でリクエスト曲が流れますよね。"
"2002002-87" = "[s7] \"そんな話、初めて聞いたけど。\"\n[s8] \"あれ、そうだっけ……？\""
"2002002-88-ヒマリ" = "ミレニアムの生徒であれば、誰でも自由にリクエスト曲を申請できるのですが……"
"2002002-89-ヒマリ" = "なぜか私の送ったリクエスト曲がまったく選ばれないのです！"
"2002002-90-ヒマリ" = "何度も何度も申し込んでいるというのに、一体なぜなのでしょう。#n先生はどうお考えですか？"
"2002002-91-ヒマリ" = "きっと私の感性が先進的すぎるがゆえに、いつの間にか他の生徒たちと分かり合えない壁ができてしまったのでしょう。"
"2002002-92-ヒマリ" = "知らないうちに悲劇のヒロインになってしまったのですね……。"
"2002002-93" = "[s] \"いや、そういうわけではないと思うけど……。\""
"2002002-94-ヒマリ" = "ただ私は素敵な曲をミレニアムの皆さんと共有したかっただけなのですが……"
"2002002-95-ヒマリ" = "……と、残念がっていた昨日までの私とは、今日でお別れです。"
"2002002-96-ヒマリ" = "今日は私と先生、二人の隠れ家を記念して……"
"2002002-97-ヒマリ" = "少々「特別な方法」に手を出してみましょうか。"
"2002002-98" = "[ns] \"特別な方法……？\""
"2002002-99" = "（スピーカーから校内放送が流れ始めた）"
"2002002-100-ミレニアムの生徒" = "ミレニアム校内放送をお聞きの皆さん、こんにちは！"
"2002002-101-ミレニアムの生徒" = "本日もお昼の時間がやってきました！#nさっそくリクエスト、いってみましょう！"
"2002002-102-ミレニアムの生徒" = "それでは一曲目のリクエストです。"
"2002002-103-ミレニアムの生徒" = "ラジオネーム「ミレニアム最高の清楚系美少女」さん……。"
"2002002-104-ミレニアムの生徒" = "あれ、またこの人……？"
"2002002-105-ヒマリ" = "あ、私のことですね。"
"2002002-106" = "[s] \"だと思った！\""
"2002002-107" = "え～、これを流すの……？"
"2002002-108-ミレニアムの生徒" = "いや、他にもリクエストはたくさん届いてるよね？"
"2002002-109-ミレニアムの生徒" = "……えっ、"
"2002002-110-ミレニアムの生徒" = "いきなりデータが消えた！？"
"2002002-111-ヒマリ" = "……ふふっ。"
"2002002-112" = "[ns] \"ねえ、ヒマリ。まさかとは思うんだけど……。\""
"2002002-113" = "いくらなんでも、これはちょっとなぁ……。"
"2002002-114-ミレニアムの生徒" = "あっ、ちょっと、なんで！"
"2002002-115-ミレニアムの生徒" = "誰か機械止めて！……止まらない！？どうして！？"
"2002002-116" = "（スピーカーから哀愁漂う曲調の演歌が流れ始めた）"
"2002002-117" = "[ns] \"ヒマリの言ってた素敵な曲って……。\""
"2002002-118-ヒマリ" = "以前、エンジニア部の部長からオススメされた曲です。"
"2002002-119" = "[s] \"ヒマリは演歌が好きなんだ。\""
"2002002-120-ヒマリ" = "ふふっ。隠れ家でゆったりとくつろぎながら、先生と同じ時間を、好きな曲を共有する……。"
"2002002-121-ヒマリ" = "どうでしょう。風情を感じはしませんか？"
"2002002-122" = "[ns] \"分かる気はするけど……。\""
"2002002-123" = "[ns] \"うん……素敵な曲だね。\""
"2002002-124-ヒマリ" = "ええ、そうでしょう？ふふっ。"
"2002002-125" = "（スピーカーの向こうで慌てる放送部員のドタバタ音とヒマリの流した演歌を聴きながら……）"
"2002002-126" = "（夜の訪れまで、ヒマリと二人の時間を過ごした）"
