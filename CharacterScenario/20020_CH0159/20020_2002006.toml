[translation]
"2002006-1" = "天才ハッカーの繊細なセミコロン"
"2002006-2" = "（今日はいつもの隠れ家ではなく、ヒマリがヴェリタスの仕事をしている場所に案内された）"
"2002006-3-ヒマリ" = "お待ちしておりました、先生。#nふふっ……無事に到着されましたね。"
"2002006-4" = "[s] \"お説教したからね……それより今日は隠れ家じゃないんだ。\""
"2002006-5-ヒマリ" = "そ、その節は……ええ、反省しております。#n今日はですね、片付けたい業務もあるのですが……。"
"2002006-6-ヒマリ" = "本題はメッセージで送った通りです。"
"2002006-7-ヒマリ" = "ようやく入手したのです。"
"2002006-8" = "[s] \"さっき言ってたお宝のこと？\""
"2002006-9-ヒマリ" = "ふふっ、そうです。お宝ですよ。"
"2002006-10-ヒマリ" = "それも私たちハッカーがこぞって欲しがる幻の一品。"
"2002006-11-ヒマリ" = "一体どんなお宝か想像できましたか？"
"2002006-12-ヒマリ" = "ふふっ、"
"2002006-13-ヒマリ" = "見て驚かないでくださいね……"
"2002006-14-ヒマリ" = "こちらです！"
"2002006-15" = "[ns] \"妖怪MAX？\""
"2002006-16-ヒマリ" = "あら、ただの妖怪MAXではありませんよ？"
"2002006-17-ヒマリ" = "なんと、このスペシャル限定版は、店頭に並んでいる妖怪MAXより100倍美味しいと評判の最高級品なのです。"
"2002006-18" = "[s] \"そ、そうなんだ……。\""
"2002006-19-ヒマリ" = "……思ったより反応が薄いのですね。"
"2002006-20-ヒマリ" = "この限定版にはプレミアがつくほどものすごい代物だというのに……。"
"2002006-21-ヒマリ" = "ヴェリタスの部員たちも「一度でいいから飲んでみたい」と、どれだけ騒いでいたことか。"
"2002006-22" = "[s] \"あ、もしかして本当は部員たちのために？\""
"2002006-23-ヒマリ" = "ふふっ。たまにはあの子たちに部長としての姿を見せて、私の威厳を示さなくては。"
"2002006-24-ヒマリ" = "なかでも、この「胸アツ・情熱のフルーツミックス味」は、ぜひ先生と一緒に味わいたいと思い、残しておいたのです。"
"2002006-25" = "[s] \"そこまで言われると、楽しみになってきたよ。\""
"2002006-26-ヒマリ" = "では、どれだけすごい味なのか、確認してみるとしましょう。#nこれさえ飲めば、今日一日どんな作業も捗るはず。"
"2002006-27-ヒマリ" = "おっと、そうでした、忘れてはいけませんね。#n部員たちから妖怪MAXをさらに美味しく飲む方法を教えてもらったのです。"
"2002006-28" = "[s] \"どんな方法なの？\""
"2002006-29-ヒマリ" = "ふふっ……こうするのです。"
"2002006-30" = "[ns] \"ヒ、ヒマリ！？そんなに振ってどうするの！？\""
"2002006-31-ヒマリ" = "お待ち、くださいっ！"
"2002006-32-ヒマリ" = "こうやって、全力で、缶を振ると……はぁ。"
"2002006-33-ヒマリ" = "内部で、妖怪MAXパワーが、強まって……っ。"
"2002006-34-ヒマリ" = "そのまま、飲むよりも……ふぅ。"
"2002006-35-ヒマリ" = "5倍は美味しくなると、部員の皆さまが……っ！"
"2002006-36" = "[s] \"それ、騙されてるんじゃ！？\""
"2002006-37-ヒマリ" = "んっ！"
"2002006-38" = "[ns] \"ああ、やっぱり……。\""
"2002006-39-ヒマリ" = "あ、あら……。"
"2002006-40-ヒマリ" = "いえ、こ、これくらい予想しておりました。"
"2002006-41-ヒマリ" = "炭酸飲料ですからね。"
"2002006-42-ヒマリ" = "美味しくなると信じて、リスクを承知で挑戦するか……。"
"2002006-43-ヒマリ" = "それとも現状に甘んじて、弱い自分を受け入れるのか……。"
"2002006-44-ヒマリ" = "……とても難しい問題でした。まるで私たちの人生のようですね。"
"2002006-45" = "[s1] \"そんな深刻な問題ではないと思う！\"\n[s2] \"タオル、これ使ってね。\""
"2002006-46-ヒマリ" = "あ……ありがとうございます。"
"2002006-47-ヒマリ" = "あ……ありがとうございます。"
"2002006-48-ヒマリ" = "上は自分でもある程度は拭けますが……。"
"2002006-49-ヒマリ" = "下のほうは手が……。"
"2002006-50-ヒマリ" = "……どうしましょう。"
"2002006-51" = "[s] \"ベタベタするだろうし、洗おうか？\""
"2002006-52-ヒマリ" = "えっ、えぇ！？#n先生が洗ってくださるのですか？"
"2002006-53-ヒマリ" = "それは、その……。"
"2002006-54" = "[s] \"ごめんね、無理にとは――\""
"2002006-55-ヒマリ" = "いえ、だ、大丈夫です。"
"2002006-56-ヒマリ" = "そんなにこの超天才美少女の足に触れたいのですね！#n私は、か、構いませんよ！"
"2002006-57-ヒマリ" = "……すぅ、はぁ。"
"2002006-58-ヒマリ" = "……お願いしても、よろしいですか？"
"2002006-59" = "[ns] \"それじゃあ……触るね。\""
"2002006-60-ヒマリ" = "え、ええ。好きなだけ綺麗にしていただいて構いません！"
"2002006-61" = "[wa:100]― ふふっ、[wa:900]どうでしょう？"
"2002006-62" = "― ミレニアム最高の美少女の足を"
"2002006-63" = "― 洗う機会なんて……。"
"2002006-64" = "― なかなか[wa:300]お目にかかれ……"
"2002006-65" = "― かかれないはずの……。"
"2002006-66" = "[wa:500]― っ……？"
"2002006-67" = "― 思ったより……[wa:1720]なんだか変な……"
"2002006-68" = "[wa:750]― 奇妙な……[wa:1350]は、[wa:1300]恥ずかしいというか……"
"2002006-69" = "― ど、[wa:1300]どうして……？"
"2002006-70" = "― げ、[wa:200]言語化が[wa:600]難しい感情が……！"
"2002006-71" = "[wa:650]― ただ、[wa:950]先生が私の足を"
"2002006-72" = "― 丁寧に洗ってくださっている[wa:1000]だけだというのに……"
"2002006-73" = "― どうして……？"
"2002006-74" = "[ns] \"石鹸で洗ってるだけだからね！？\""
"2002006-75" = "[wa:250]― ふ、[wa:500]ふふっ。"
"2002006-76" = "― ええ、[wa:950]もちろん覚悟はできておりますので、"
"2002006-77" = "― お気になさらず。"
"2002006-78" = "― どうぞ、[wa:900]心ゆくまで……！"
"2002006-79" = "[wa:150]― ……覚悟は、[wa:1000]できている……[wa:1900]はず、[wa:1500]ですので。"
"2002006-80" = "[ns] \"分かった、じゃあ続けるね。\""
"2002006-81" = "[wa:100]― え、[wa:1300]ええ……"
"2002006-82" = "― で、[wa:1420]では……[wa:2000]よろしくお願いします……。"
"2002006-83" = "[ns] \"きれいになったよ。\""
"2002006-84-ヒマリ" = "は、はい……。"
"2002006-85-ヒマリ" = "……う、うぅ…………。"
"2002006-86" = "[s] \"どうしたの？まだベタベタする？\""
"2002006-87-ヒマリ" = "い、いえ。その、ただ……。"
"2002006-88-ヒマリ" = "……私のような超天才美少女にも予想できませんでした。#nその……他人に身体を触れられる事が……こんなにも恥ずかしいとは。"
"2002006-89-ヒマリ" = "本当に……先生と過ごしていると、予想もできないようなことをたくさん学べるので、感激しております。"
"2002006-90" = "[s] \"あの……何を言っているのかさっぱり……。\""
"2002006-91-ヒマリ" = "ふふっ、お気になさることはありません。"
"2002006-92-ヒマリ" = "これは私だけの……"
"2002006-93-ヒマリ" = "……ほんの些細な気づきですので♪"
"2002006-94" = "（その後、二人で妖怪MAXを飲みながら、ヒマリの仕事を手伝った）"
