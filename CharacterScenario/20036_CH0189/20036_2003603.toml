[translation]
"2003603-1" = "姫 on the boat"
"2003603-2-セリカ" = "……あ、先生。"
"2003603-3-セリカ" = "こっちよ。"
"2003603-4-セリカ" = "早く着いちゃったから、準備しておいたわ。"
"2003603-5" = "[s1] \"……バナナボートだ！\"\n[s2] \"……遊んでいいの！？\""
"2003603-6-セリカ" = "な、何？"
"2003603-7-セリカ" = "そ、そんなに好きだったの？"
"2003603-8-セリカ" = "先生って、たまに子どもっぽいところあるわよね。"
"2003603-9-セリカ" = "……うん？"
"2003603-10-セリカ" = "一緒に遊ぶために連絡してくれたんじゃないのかって？"
"2003603-11-セリカ" = "な、なに言ってるのよ！#nそんなわけないでしょ！"
"2003603-12-セリカ" = "えっと、だからその……。"
"2003603-13-セリカ" = "そ、そう！#nテスト！テストのため！"
"2003603-14-セリカ" = "見た目は大丈夫だけど、どこか壊れてるかもしれないじゃない？#nみんなで遊ぶ前に確かめておかないと！"
"2003603-15-セリカ" = "いいから、すぐテストするよ！"
"2003603-16-セリカ" = "絶対！本当に！#n私が遊びたくて呼んだわけじゃないんだから！"
"2003603-17-セリカ" = "……えっ？"
"2003603-18-セリカ" = "私が上に乗って、それを先生が引っ張ってくれるの？"
"2003603-19-セリカ" = "先生は付き合ってくれてるのに……。"
"2003603-20" = "[s3] \"任せて！\"\n[s4] \"深いところもあるかもしれないからね。\""
"2003603-21-セリカ" = "うーん……。"
"2003603-22-セリカ" = "腰くらいの深さだし大丈夫だと思うけど……#n先生がそう言うなら分かったわ。"
"2003603-23-セリカ" = "それじゃ……っと。"
"2003603-24-セリカ" = "思ったより揺れが……。"
"2003603-25-セリカ" = "先生、分かってる？"
"2003603-26-セリカ" = "テストだからね？#nあんまり勢い良く引っ張らないでよ？"
"2003603-27" = "[ns5] \"大丈夫、安心して！\"\n[ns6] バナナボートを引っ張る。"
"2003603-28-セリカ" = "ち、ちょっ……！先生……！？#nは、速いってば！！"
"2003603-29-セリカ" = "まだ心の準備が……！！"
"2003603-30-セリカ" = "わっ……！"
"2003603-31-セリカ" = "ひぃ……！？"
"2003603-32" = "（倒れないように注意しながら、セリカが乗ったボートを引っ張り回した）"
"2003603-33" = "（途中でセリカが何か言っていたような気がするが、水の音でよく聞こえなかった）"
"2003603-34" = "[wa:230]― [log=세리카 수영복]こ、[wa:620]これでもう良くない？[/log]"
"2003603-35" = "[wa:1900]― [log=세리카 수영복]そろそろ降りようよ……[/log]"
"2003603-36" = "― [log=세리카 수영복]もうやめたいとか、[/log]"
"2003603-37" = "[wa:1610]― [log=세리카 수영복]そういうんじゃ[wa:620]ないんだけど……[/log]"
"2003603-38" = "[wa:130]― [log=세리카 수영복]ちょ、[wa:170]ちょっと！！[/log]"
"2003603-39" = "[wa:600]― [log=세리카 수영복]先生！[wa:550]何すんのよ！[wa:840]揺れるでしょ！[/log]"
"2003603-40" = "― [log=세리카 수영복]このボート、[wa:440]ひっくり[wa:290]返りやすいんだから！！[/log]"
"2003603-41" = "[wa:1060]― [log=세리카 수영복]やめて！[/log]"
"2003603-42" = "[wa:630]― [log=세리카 수영복]いや、[wa:720]面白そうだからじゃ[wa:870]ないわよ。[/log]"
"2003603-43" = "[wa:2310]― [log=세리카 수영복]先生、[wa:1270]人で遊ばないで。[/log]"
"2003603-44" = "― [log=세리카 수영복]……[wa:170]はあ。[wa:1200]もういいわよ。[/log]"
"2003603-45" = "[wa:1320]― [log=세리카 수영복]先生はそういう人だったわね。[/log]"
"2003603-46" = "― [log=세리카 수영복]こういう事するって[wa:1570]予想できてたはずなのに……[/log]"
"2003603-47" = "[ns7] \"……セリカ？\"\n[ns8] \"……急にどうしたの？\""
"2003603-48" = "[wa:300]― [log=세리카 수영복]まぁ、[wa:600]いいわ。[/log]"
"2003603-49" = "[wa:920]― [log=세리카 수영복]私もちょっと[wa:615]思いついたことが[wa:540]あるから。[/log]"
"2003603-50" = "― [log=세리카 수영복]さあ、[wa:595]先生！[wa:910]交代よ！！[/log]"
"2003603-51" = "[wa:900]― [log=세리카 수영복]今度は[wa:395]先[wa:305]生[wa:230]の番よ！[/log]"
"2003603-52" = "[ns9] \"せ、セリカ……？\"\n[ns10] \"テストなら、もう充分……。\""
"2003603-53-セリカ" = "なるほどね～？"
"2003603-54-セリカ" = "ようやく分かったわ。#nこれ、引っ張るほうが楽しいやつじゃない！"
"2003603-55-セリカ" = "今度は私の番よ、先生！"
"2003603-56-セリカ" = "……なっ？"
"2003603-57-セリカ" = "先生！どこ行くの！！"
"2003603-58-セリカ" = "ちょっ、待ってってば！"
"2003603-59-セリカ" = "ううっ！#nボートを置いて行くわけにはいかないし……！"
"2003603-60-セリカ" = "ちょっとぉ！！！！！！！！！！"
