[translation]
"2600606-1" = "流星群と願い事"
"2600606-2" = "深夜・シャーレ入口"
"2600606-3-ノドカ" = "待ってました、先生！"
"2600606-4-ノドカ" = "今日が楽しみ過ぎて、あまり眠れなかったせいで……危うく寝坊するところでした。"
"2600606-5-ノドカ" = "でもこうして無事に流星群が見られそうで、本当に良かったです。"
"2600606-6-ノドカ" = "さあ、遅くなる前に早く屋上に行きましょう。"
"2600606-7" = "深夜・シャーレ建物の屋上"
"2600606-8-ノドカ" = "ふう、まだ始まってないみたいですね。"
"2600606-9-ノドカ" = "寒くはないですか、先生？"
"2600606-10-ノドカ" = "最近の夜は結構肌寒いので、しっかり着ておいた方が良いですよ。"
"2600606-11-ノドカ" = "ふふ、お茶でも入れましょうか？"
"2600606-12" = "[s] \"ありがとう。\""
"2600606-13-ノドカ" = "なんだか……こうして夜中に二人っきりでいると、ちょっと照れますね。"
"2600606-14-ノドカ" = "せっかく持ってきた天体望遠鏡も、流星群を観測する時は必要なさそうですし……。"
"2600606-15-ノドカ" = "な、何を話せばいいんでしょうか……？"
"2600606-16" = "[s] \"ノドカ、空を見て。\""
"2600606-17-ノドカ" = "……あっ。"
"2600606-18" = "― うわっ、[wa:500]流れ星です！[wa:2100]あっ……[wa:550]あそこにも！[wa:1550]そっちにも！"
"2600606-19" = "― 空に流れ星がいっぱいです！[wa:3500]流星が[wa:800]本当に、[wa:500]雨のように降ってますね！"
"2600606-20" = "― こんなに美しい光景を実際に見られるなんて……[wa:3500]本当に、[wa:1250]夢みたいです。"
"2600606-21" = "― 願い事ですか？[wa:4500]いえ……[wa:1300]今日は、[wa:650]大丈夫です。"
"2600606-22" = "― 好きな人と一緒に、[wa:2000]こんなに綺麗な星空を見ることができているのに、"
"2600606-23" = "― これ以上願い事をしたら、[wa:1450]なんだか[wa:820]お星様に叱られてしまいそうで……。"
"2600606-24" = "― 今日は[wa:950]これだけで、[wa:800]満足です。"
"2600606-25-ノドカ" = "でも、どうして流れ星に願い事をすると叶う、なんてお話が生まれたんでしょうか？"
"2600606-26-ノドカ" = "たしかに綺麗ですが、人の願い事とは関係のない、ただの天体現象のはずなのに……。"
"2600606-27-ノドカ" = "先生はどう思われますか？"
"2600606-28" = "（返事がない。寝てしまったようだ）"
"2600606-29-ノドカ" = "ああっ、ここで寝ちゃダメですよ！"
"2600606-30-ノドカ" = "も～、先生～！"
"2600606-31" = "それから、流星群がやむまでノドカと一緒に夜空を見ていた。"
