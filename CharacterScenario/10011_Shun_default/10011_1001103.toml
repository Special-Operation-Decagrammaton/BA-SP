[translation]
"1001103-1" = "食事の後は、綺麗に歯磨き"
"1001103-2" = "山海経・梅花園"
"1001103-3-シュン" = "みなさ～ん、お昼は残さず食べましたか？"
"1001103-4-梅花園の園児たち" = "は～い！"
"1001103-5-シュン" = "ふふ、よくできました。そして食事の後は必ず歯磨きをするんでしたね？"
"1001103-6-梅花園の園児たち" = "は～い。"
"1001103-7-シュン" = "ですが、最近きちんと歯を磨かない子がいます。なので今日は先生と一緒に人形劇で、歯を磨かないとどうなってしまうのかをお見せしようと思います。"
"1001103-8-シュン" = "さあ、しっかり見ていてくださいね～。"
"1001103-9-シュン" = "みなさんが甘いものを食べた後、こうやって歯にその小さなカケラが残ってしまうんです。#nそうすると、恐ろしい虫歯菌が、その匂いを嗅いでやってくるんですよ。"
"1001103-10-シュン" = "さあ、先生。今です。虫歯菌になってください。"
"1001103-11" = "[s] \"ギャ、ギャオオオー。\""
"1001103-12-梅花園の園児たち" = "こ、怖い……。"
"1001103-13-シュン" = "見てください、怖いでしょう？きちんと歯を磨かないと、こんなに怖い虫歯菌がやってくるんですよ。"
"1001103-14-シュン" = "でも大丈夫、歯をきちんと磨けば、虫歯菌も力を発揮できません。"
"1001103-15-シュン" = "さあ、先生。続けてお願いします。"
"1001103-16" = "[s] \"ううっ……歯を磨くとは……苦しい――。\""
"1001103-17-梅花園の園児たち" = "わあ、虫歯菌が倒れた！"
"1001103-18-シュン" = "さあ、みなさんいかがでしたか？#nこれからはみなさんも怖い虫歯菌を倒せるように、一生懸命歯を磨くんですよ？"
"1001103-19-梅花園の園児たち" = "は～い！"
"1001103-20-シュン" = "今日は人形劇を手伝っていただきありがとうございました。本当に素晴らしい演技でした！"
"1001103-21" = "[s] \"なんだか恥ずかしい……。\""
"1001103-22-シュン" = "でも、子供たちには効果てき面でした！"
"1001103-23-シュン" = "おかげさまで[ruby=ばいかえん]梅花園[/ruby]の子たちも、これからはきちんと歯を磨いてくれそうです。ふふ……。"
"1001103-24-シュン" = "そうだ、もちろん先生も、今日の食事の後にきちんと歯磨きされましたよね？"
"1001103-25" = "[s] \"もちろん。\""
"1001103-26-シュン" = "うーん、言葉だけでは信じられません。あ～ん、してみてください。"
"1001103-27-シュン" = "ほら、恥ずかしがらないで、あ～ん……。"
"1001103-28" = "[s] 仕方なく口を開ける。"
"1001103-29-シュン" = "流石です、先生。普段からしっかり歯磨きをされているようですね。とってもきれいです。"
"1001103-30-シュン" = "これなら怖い虫歯菌がやってくるのを怖がる必要はなさそうですね、ふふ……。"
"1001103-31-シュン" = "あれ、どうかしましたか？"
"1001103-32-シュン" = "顔が近すぎるから、離れてほしい、ですか？"
"1001103-33-シュン" = "ふふ、ダメです。お口の中を隅々まで確認しないと離れられません。"
"1001103-34-シュン" = "さあ、恥ずかしがらないで、もう一度お口を開けてください。あ～ん……。"
