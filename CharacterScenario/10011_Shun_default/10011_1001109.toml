[translation]
"1001109-1" = "午後過ぎの甘いお昼寝"
"1001109-2" = "梅花園・休憩室"
"1001109-3-シュン" = "あらっ、先生。ちゃんと睡眠はとれていますか？お疲れのご様子ですが……。"
"1001109-4-シュン" = "いくらシャーレの仕事が忙しいからって、睡眠はちゃんととらなきゃダメですよ？"
"1001109-5-シュン" = "そうだ、ちょうど[ruby=ばいかえん]梅花園[/ruby]の子たちは野外活動で外に出ているので、休憩室で少しだけお昼寝をされたらいかがですか？"
"1001109-6-シュン" = "大丈夫です。子供たちが帰ってくる前には起こしますので、一眠りなさってください。"
"1001109-7-シュン" = "そうやって断るのでしたら……私が無理やり抱きしめて寝かせちゃいますよっ！"
"1001109-8-シュン" = "ふふ、そうですか。軽いお昼寝は健康にもいいんですよ。#nさあ、布団を敷いてあげますので、ここに横になってください。"
"1001109-9" = "先生がよく眠れるよう、私が子守唄を歌ってあげます。"
"1001109-10" = "ねんねん、ころりよ、おころりよ、ぼうやはよい子だ。#nねんねしな……。"
"1001109-11" = "ゆっくりとまぶたが落ちる……。"
"1001109-12" = "― あら、[wa:1500]お目覚めになりましたか。"
"1001109-13" = "― 今日は……[wa:1500]本当に楽しかったです。[wa:2200]ふふ。"
"1001109-14" = "― あら、[wa:1500]もう子供たちが帰ってくる時間ですね。"
"1001109-15" = "― そろそろお仕事にお戻りになった方が良いのでは……。"
"1001109-16" = "― いえ、やはり……[wa:2000]ふふ、[wa:1200]もう少しゆっくりしていてください、[wa:2300]先生。"
"1001109-17" = "― 今日の授業は[wa:1300]私が代わりますので。"
"1001109-18" = "― ああ……[wa:2500]可愛い……[wa:1800]ふふっ。"
"1001109-19-シュン" = "お加減いかがですか？"
"1001109-20" = "[s] \"うん、よく寝た。もう起きるね。\""
"1001109-21-シュン" = "ダメです、先生。もう少し横になっていてください。"
"1001109-22-シュン" = "この大事な機会……いえ、せっかくの休憩ですので。"
"1001109-23-シュン" = "私も昨夜眠れなかったせいか、なんだか。こうして横になっていたいです。"
"1001109-24-シュン" = "そうだ、今度は先生が私に、子守唄を歌ってくれませんか？"
"1001109-25-シュン" = "私が眠りにつくまで頭をトントンしながら……先生の暖かい声を聞かせてください。"
"1001109-26-シュン" = "とはいえ、子供たちがもうすぐ帰ってくるのに、本当に寝てしまうのはダメですが……。"
"1001109-27-シュン" = "ふふ、でも今日くらいは、もう少しこうしていてもいいでしょう。"
"1001109-28-シュン" = "先生の前では私も、ただのお寝坊さんな生徒なので。"
