[translation]
"1009703-1" = "Danger close"
"1009703-2" = "（モエのメッセージを見て、教えてもらった場所に急いで向かった）"
"1009703-3" = "[ns] \"モエ、大丈夫！？\""
"1009703-4-モエ" = "あ、先生。#n思ったより早かったね。"
"1009703-5-モエ" = "……それより、走ってきたの？"
"1009703-6" = "[s1] \"だって、爆発が止まらないって……！\"\n[s2] \"もう何とかなったの？\""
"1009703-7-モエ" = "爆発……？"
"1009703-8-モエ" = "あ～、誤解だよ先生。"
"1009703-9-モエ" = "爆発はまだというか、進行中というか。"
"1009703-10" = "[s] \"……進行中？\""
"1009703-11" = "[ns] \"何の音！？\""
"1009703-12-モエ" = "ああ、これこれ。この音……！"
"1009703-13-モエ" = "やっぱり、貝は強火で焼かないとね！"
"1009703-14" = "[s] \"貝……？\""
"1009703-15-モエ" = "うん、炭火で貝を焼いていたの。"
"1009703-16-モエ" = "住民の手伝いをしたら、お礼に貝を分けてくれてさ。"
"1009703-17-モエ" = "新鮮な貝だし、そのまま食べても美味しいけど……。#n焼いて食べるのが一番だよね！"
"1009703-18-モエ" = "強火だと、たまにパッ！って爆発することもあるし……。"
"1009703-19-モエ" = "……はぁ、はぁ。#nいつ爆発するか分からない緊張感で、興奮が止まらないね。"
"1009703-20" = "[s] \"爆発って、貝の話だったんだ……。\""
"1009703-21" = "[ns3] \"弱火でじっくり調理したら良いんじゃない？\"\n[ns4] \"そうすれば、爆発せずに――\""
"1009703-22-モエ" = "なに言ってるの、先生！？"
"1009703-23-モエ" = "貝を弱火で焼くなんて……。"
"1009703-24-モエ" = "たしかに爆発は防げるかもしれないけど、#n水分が飛んで身が固くなるでしょ！"
"1009703-25-モエ" = "爆発を恐れてちゃ、本当の美味しさにたどり着けないよ。"
"1009703-26-モエ" = "美味しいものには、爆発が付きものだからね！"
"1009703-27" = "[s5] \"モエに言われると、謎の説得力が……。\"\n[s6] （どこかで似たようなセリフを聞いたような……？）"
"1009703-28-モエ" = "あ、話しているうちに火が通ったね。"
"1009703-29-モエ" = "先生も食べてみて。#n採れたてだから、このままでも美味しいよ。"
"1009703-30" = "[s7] \"あ、本当だ……。\"\n[s8] \"貝の旨味が詰まってるね。\""
"1009703-31-モエ" = "ふふっ、そうでしょ？"
"1009703-32-モエ" = "新鮮だから、余計な味付けは不要なの。"
"1009703-33" = "[s9] \"でも、貝だけだと寂しいな……。\"\n[s10] \"ほかにはどんな食材がある？\""
"1009703-34-モエ" = "実は、デザートに用意してきた物が……。"
"1009703-35-モエ" = "……冷凍餅だよ！"
"1009703-36" = "[s] 冷凍餅……？"
"1009703-37-モエ" = "前に住民の人からもらったお餅を、冷凍保存してたんだ。"
"1009703-38-モエ" = "……わ、氷がいっぱい付いてる。"
"1009703-39-モエ" = "くひっ、くひひ。#nもし、これを強火で焼いたら……。"
"1009703-40" = "[s] \"待って、モエ！\""
"1009703-41-モエ" = "ああ、あぁ……。"
"1009703-42-モエ" = "冷凍餅が急に膨らんで、今にも飛び跳ねそう……！"
"1009703-43-モエ" = "一緒に貝が爆発する音まで……！"
"1009703-44-モエ" = "はあ、はあ……これだよ、これ……！"
"1009703-45-モエ" = "炭の上で破滅の匂いが立ち上ってる……！"
"1009703-46" = "[s] \"貝と餅を焼く匂いだよね！？\""
"1009703-47" = "（その後、モエと一緒に爆発する貝やお餅を囲みながら、騒がしくも楽しい食事を楽しんだ）"
