[translation]
"1006705-1" = "心休まる場所"
"1006705-2" = "シャーレ・休憩室"
"1006705-3" = "（トキの安否が心配で、なかなか寝つけなかった）"
"1006705-4" = "（何度か眠気は訪れたが、その度に……）"
"1006705-5-トキ" = "こちら、コールサインゼロフォー。#n現在地は……"
"1006705-6" = "[ns] \"トキ！？\""
"1006705-7" = "（通信はすぐに切れるものの、しばらくすると……）"
"1006705-8-トキ" = "こちら、コールサインゼロフォー。#n応答……してくだ……さ……"
"1006705-9" = "（途切れがちな声が……）"
"1006705-10-トキ" = "……承知しました。#n次は……"
"1006705-11" = "（そうして、何度目かのタイミングで……）"
"1006705-12-トキ" = "――回線が復帰しました。"
"1006705-13-トキ" = "……あれ、なぜ先生が？"
"1006705-14" = "[s] \"トキ！何があったの！？\""
"1006705-15-トキ" = "私は……"
"1006705-16" = "[ns] \"また切れちゃった……。\""
"1006705-17-トキ" = "任務完……皆様、お疲れさ……"
"1006705-18" = "（何度電話をかけても、トキの声で留守番メッセージが返ってくるだけだった）"
"1006705-19" = "（明け方まで起きていたはずが、いつの間にか寝てしまっていた）"
"1006705-20" = "（鳥の鳴き声で、ぼんやりと意識を取り戻す）"
"1006705-21" = "（寝ぼけ眼で布団に腕を伸ばし、抱き寄せたところ……）"
"1006705-22" = "（なぜか柔らかい人肌のぬくもりが……）"
"1006705-23" = "[wa:1000]― ん……[wa:1200]先生……？"
"1006705-24" = "[wa:900]― どうされました……？"
"1006705-25" = "[wa:1000]― そんな、[wa:1000]おかしな[wa:300]顔をして……？"
"1006705-26" = "[ns] \"ト、トキさんんんんんん！？\""
"1006705-27" = "[wa:2000]― 差し支えなければ、"
"1006705-28" = "[wa:500]― もう少し[wa:500]寝ても[wa:300]良いでしょうか……？"
"1006705-29" = "[wa:3600]― んん……？[wa:1800]とりあえず[wa:700]起きてって……？"
"1006705-30" = "[wa:1900]― ……嫌です。[wa:1200]私は[wa:500]もっと[wa:500]寝たいです。"
"1006705-31" = "[wa:2000]― それに[wa:500]このベッド……"
"1006705-32" = "[wa:600]― あったかくて、[wa:1500]ふかふかで、[wa:1800]気に入っているのです。"
"1006705-33" = "[wa:2000]― 先生が[wa:500]なんと言おうと、[wa:1800]私は寝ます……。"
"1006705-34" = "[wa:2000]― んん……[wa:1600]眠い……。"
"1006705-35" = "（その後もトキが起きる気配はなく……）"
"1006705-36" = "（目を覚ましてくれたのは、昼過ぎだった）"
"1006705-37-トキ" = "……。"
"1006705-38" = "[s] \"……どうして隣で寝てたの？\""
"1006705-39-トキ" = "先生は、たまに不思議な質問をしますね。#nそこにベッドがあったから、です。"
"1006705-40" = "[s] \"登山家みたいなこと言われても……\""
"1006705-41-トキ" = "仕方ありませんね、説明いたします。#n深夜に任務を終え、帰ってきたところ……"
"1006705-42-トキ" = "シャーレのオフィスに明かりが灯っていたので、気になり足を運びまして。"
"1006705-43" = "[s] \"えっと……ドア、閉まってなかった？\""
"1006705-44-トキ" = "先生、私はC&Cです。"
"1006705-45" = "[s] \"……うん、そうだね。\""
"1006705-46-トキ" = "オフィスに入って最初に目に入ったのは、電気を点けたまま机に突っ伏す先生でした。"
"1006705-47-トキ" = "私が完璧なメイドであり、最高のエージェントでもある事は先生もご存知でしょう。#nですから、先生をベッドに運ぶのは当然です。"
"1006705-48-トキ" = "今回の任務は少々難易度が高く、また、時間も深夜でしたから……"
"1006705-49-トキ" = "流石の私でも、眠気の限界だったのです。"
"1006705-50-トキ" = "その時……なんと目の前には、私に横になってほしそうなベッドがありました。"
"1006705-51-トキ" = "他の選択肢はなかったと言えるでしょう。"
"1006705-52" = "[s] \"だから……隣で寝たと。\""
"1006705-53-トキ" = "そうです。"
"1006705-54-トキ" = "ちなみに寝心地は最高でした。迅速に褒めて差し上げます。"
"1006705-55" = "[s1] \"うん……ありがとう……。\"\n[s2] \"次は勝手に潜り込んじゃダメだからね。\""
"1006705-56-トキ" = "今日は眠気の限界だったのです。"
"1006705-57" = "[s] \"眠かったら、どこでも寝ちゃうの？\""
"1006705-58-トキ" = "……！"
"1006705-59-トキ" = "お待ちください、先生。#n少し考える時間を頂きます。"
"1006705-60" = "[s] \"えっ、うん……。\""
"1006705-61" = "（……しばらくして）"
"1006705-62" = "（そこまで深刻に考える必要はないよ、と言おうとしたところ……）"
"1006705-63-トキ" = "どこでもは……寝ません。#n……が、よく分かりません。"
"1006705-64" = "[s] \"というと……？\""
"1006705-65-トキ" = "何度考えても、他人のベッドで寝るのは抵抗があります。"
"1006705-66-トキ" = "ですが、どうしてそのように感じるのか、自分でも分かりません。"
"1006705-67-トキ" = "そして……なぜ先生なら大丈夫なのでしょうか？"
"1006705-68" = "[s] \"な、なんでだろうね……？\""
"1006705-69-トキ" = "先生でも分からないのですね。"
"1006705-70-トキ" = "でしたら……この問題は、ここまでに致しましょう。"
"1006705-71" = "[s] \"諦めるの早すぎない！？\""
"1006705-72-トキ" = "考えても詮無いことには、時間をかけても仕方ありません。#n非効率ですから。"
"1006705-73-トキ" = "それよりも遥かに重要な問題があると気づきました。"
"1006705-74" = "[s] \"そんなに重要なことが？\""
"1006705-75-トキ" = "はい、非常に重要……かつ重大な問題でしょう。"
"1006705-76-トキ" = "それは、私が暇をしている、ということです。"
"1006705-77" = "[ns] \"重要重大って言わなかった！？\""
"1006705-78-トキ" = "先生には、事の深刻さが理解できないのですか？"
"1006705-79-トキ" = "退屈はウサギを殺すといいます――遊ばないと死んでしまうのです。"
"1006705-80-トキ" = "先生が構ってくださらないのなら……その気になるまで居座ります。"
"1006705-81-トキ" = "それとも、先生は――わざとしているのですか？"
"1006705-82" = "[s] \"……冗談だったり？\""
"1006705-83-トキ" = "私が冗談を口にしたことがありますか？"
"1006705-84" = "（あまりにも堂々としたトキの態度に戸惑いもしたが……）"
"1006705-85" = "（この日はトキと2人で、楽しい時間を過ごした）"
