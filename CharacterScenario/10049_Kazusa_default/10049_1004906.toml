[translation]
"1004906-1" = "猫舌"
"1004906-2-カズサ" = "先生、いるよね？"
"1004906-3-カズサ" = "……失礼します。"
"1004906-4-カズサ" = "こんにちは、先生。"
"1004906-5-カズサ" = "……え？何の用って？"
"1004906-6-カズサ" = "……何よ。そう言われると用事がある時だけ来る人みたいに聞こえるじゃん。#nちょっとひどいかも。"
"1004906-7-カズサ" = "べ、別に……用事がないわけではないけど……"
"1004906-8-カズサ" = "でも、今回はちょっと違うの。"
"1004906-9-カズサ" = "実は、これなんだけど……"
"1004906-10" = "[ns1] \"これは……チョコケーキ？いやちょっと違う……？\"\n[ns2] \"今日は何かの記念日だっけ？\""
"1004906-11-カズサ" = "えっと、正確には「フォンダンショコラ」っていうお菓子なんだけど……"
"1004906-12-カズサ" = "えっと、正確には「フォンダンショコラ」っていうお菓子なんだけど……"
"1004906-13-カズサ" = "その……先生、好きかなって。"
"1004906-14-カズサ" = "ちょ、ちょうど来る時に、フォンダンショコラで有名なお店のそばを通ったから……。"
"1004906-15-カズサ" = "どうかなー、って……。"
"1004906-16-カズサ" = "………"
"1004906-17-カズサ" = "……まぁ、いいや。ホントは違うんだけど、先生だし。"
"1004906-18-カズサ" = "一応……先生にあげようと持ってきたのは事実なんだけど。"
"1004906-19-カズサ" = "ちょっと、私一人だと食べられなくて。先生、ちょっと手を近づけてみて。"
"1004906-20" = "[ns3] \"まだ温かいね。熱がすごい。\"\n[ns4] \"おぉ……出来立てかな？\""
"1004906-21-カズサ" = "うん……フォンダンショコラって、中に熱いチョコが入ってるんだ。"
"1004906-22-カズサ" = "うん……フォンダンショコラって、中に熱いチョコが入ってるんだ。"
"1004906-23-カズサ" = "私、ただのチョコケーキだと思って買っちゃって……#nもっとよく見ればよかった……失敗した。"
"1004906-24-カズサ" = "……ん？何か問題でもあるのかって？"
"1004906-25-カズサ" = "……それが………うーん……。"
"1004906-26-カズサ" = "私、その……熱いの火傷しちゃうから苦手で……。"
"1004906-27-カズサ" = "このフォンダンショコラ、チョコが熱すぎて食べられなくって……。"
"1004906-28-カズサ" = "だからといって冷めるまで待つのもちょっと……#n普通、こういうのって冷めたら美味しくないじゃん？"
"1004906-29-カズサ" = "せっかく買ったのにもったいないし、熱いうちに食べられる人にあげようと思って。"
"1004906-30-カズサ" = "……んー？"
"1004906-31-カズサ" = "結局「処理」させるために持ってきたのって……？"
"1004906-32-カズサ" = "何、何よ！？そんな言い方しなくてもいいじゃん！？#n捨てるために持って来たわけじゃないし！？"
"1004906-33-カズサ" = "ちゃんと新品だよ！？ただ私が食べられないだけで……！"
"1004906-34" = "[s5] \"カズサは猫舌なんだね。\"\n[s6] \"熱いものが苦手なのってまるで猫みたいだね。\""
"1004906-35-カズサ" = "……！？"
"1004906-36-カズサ" = "……！？"
"1004906-37-カズサ" = "う、んん……猫舌……？"
"1004906-38-カズサ" = "そ、そうなのかな……？あんまり考えたことなかったけど……"
"1004906-39-カズサ" = "……ちょっと待って、先生。"
"1004906-40-カズサ" = "先に言っておくけど、そんなこと言われても嬉しくないよ。#n私、猫嫌いだから。"
"1004906-41-カズサ" = "……別にそういうわけじゃないの？#nそう……まぁ、どっちでもいいけど……"
"1004906-42-カズサ" = "……なんかやっぱり気になる。"
"1004906-43-カズサ" = "どう考えてもからかおうとしてたよね……"
"1004906-44-カズサ" = "……うん？フォンダンショコラありがたくいただきます？#nそ、そう。どういたしまして……。"
"1004906-45-カズサ" = "んー……。"
"1004906-46-カズサ" = "……うーん、わからない………はぁ……。"
"1004906-47" = "（疑うような目付きのカズサを見ながら、温かいフォンダンショコラを美味しく「処理」した）"
"1004906-48" = "（カズサの言う通り、とても甘くてまろやかな味だった）"
