[translation]
"1301302-1" = "本を探す旅路"
"1301302-2" = "図書館内部"
"1301302-3-モミジ" = "伝説の同人誌を探したいんです！"
"1301302-4" = "[s1] \"すごいやる気だね……！\"\n[s2] \"ま、まずは話を聞かせてもらえる？\""
"1301302-5-モミジ" = "あっ、す、すみません！気持ちが先走ってしまって、つい……"
"1301302-6-モミジ" = "……以前、レッドウィンター連邦学園のどこかに、知識解放戦線の卒業生が作った伝説の同人誌が眠っているという情報を耳にしたんです。"
"1301302-7-モミジ" = "伝説の同人誌……なんだかその響きだけでワクワクしませんか！？"
"1301302-8-モミジ" = "きっとその本には知識解放戦線の歴史と伝統すべてが……"
"1301302-9-モミジ" = "それさえあれば、知識解放戦線が直面している問題を解決できるに違いありません！"
"1301302-10" = "[s] \"そ、そんなにすごい物なの……？\""
"1301302-11-モミジ" = "さあ、先生！早く伝説の同人誌を探しに行きましょう！"
"1301302-12-モミジ" = "本はとても繊細なんです！こうしている間にも、湿気に[ruby=さら]晒[/ruby]されていたり、何かの下敷きになってダメージを受けているかもしれません！"
"1301302-13-モミジ" = "どうやって探すのか、ですか？#nそれはお任せください！ちゃんと方法がありますから！"
"1301302-14" = "[ns] \"えっと……モミジ、ここは？\""
"1301302-15-モミジ" = "どうかしました？"
"1301302-16-モミジ" = "同人誌を探すんじゃなかったのかって……？#nはい、今まさに探しているところです！"
"1301302-17-モミジ" = "何か問題でもありましたか？"
"1301302-18" = "[s] \"ここじゃ見つからないような……\""
"1301302-19-モミジ" = "ですが、ロッドはこちらを指しています。"
"1301302-20-モミジ" = "「ダウジング」は古代から行われている伝統的な手法なんですよ？"
"1301302-21-モミジ" = "もとは水脈を発見するために使われていたものですけど……"
"1301302-22-モミジ" = "同じ原理で、落とし物の発見にも応用されるようになりました！"
"1301302-23-モミジ" = "しっー、見てください。今ロッドが強い反応を……"
"1301302-24-モミジ" = "このまま進んでみましょう……"
"1301302-25-モミジ" = "ふむ……ふむふむ……"
"1301302-26-モミジ" = "わっ！先生！ここから強い反応が！"
"1301302-27-モミジ" = "あとはもう、私のRPGで爆破させれば……！"
"1301302-28" = "[ns] \"同人誌までバラバラになっちゃうよ！\""
"1301302-29-モミジ" = "た、たしかにそうですね……じゃあ、一体どうすれば……？"
"1301302-30-モミジ" = "まずは地面を掘ってみて……？#nレッドウィンターの雪原は硬いので、スコップで掘るのは少し……"
"1301302-31-モミジ" = "……分かりました。先生がそう仰るなら。"
"1301302-32-モミジ" = "うぅ……もう1メートル以上掘ってるのに、何も見つかりません……"
"1301302-33-モミジ" = "私の実力不足でしょうか……？"
"1301302-34" = "[s] \"実力はあんまり関係ないと思うよ……\""
"1301302-35-モミジ" = "うう……次は別の方法を試してみても良いですか？"
"1301302-36-モミジ" = "……んっと……今度はペンデュラムです！"
"1301302-37-モミジ" = "今は小さく揺れてるこの振り子が……"
"1301302-38-モミジ" = "探し物に近づくほど、大きな円を描いて揺れるはずです！"
"1301302-39-モミジ" = "次は磁気センサーで探してみましょう！"
"1301302-40-モミジ" = "アプリをダウンロードして、スマホの内蔵センサーを使えば……！"
"1301302-41-モミジ" = "地脈探知機！"
"1301302-42-モミジ" = "タロットカード……！"
"1301302-43-モミジ" = "占星術……"
"1301302-44-モミジ" = "うわああぁぁん……"
"1301302-45" = "[s] \"モ、モミジ……泣かないで……\""
"1301302-46-モミジ" = "……うう……伝説の同人誌が見つかりません……"
"1301302-47" = "[s] \"そんなに重要な情報が書いてあるの？\""
"1301302-48-モミジ" = "……。"
"1301302-49-モミジ" = "本当は……大したものではないのかもしれません。"
"1301302-50-モミジ" = "こうして先生に手伝っていただいているというのに、申し訳ないのですが……"
"1301302-51-モミジ" = "それでも私は、知識解放戦線の歴史が知りたいんです。"
"1301302-52-モミジ" = "今まで、見たことのないような絵や漫画、資料がそこに眠っているかもしれない……"
"1301302-53-モミジ" = "そう考えると……ここで諦めたくないんです。"
"1301302-54-モミジ" = "ただ……私のワガママで時間を奪ってしまい申し訳なくて……"
"1301302-55-モミジ" = "……私は大丈夫ですから、もう今日はお帰りになってください。"
"1301302-56-モミジ" = "たくさん迷惑をかけてしまって……ごめんなさい。"
"1301302-57-モミジ" = "今日は、ありがとうございました。"
"1301302-58" = "[s] \"ん～、次はどこを探そっか？\""
"1301302-59-モミジ" = "えっ、えっ？#nそもそも先生は付き合ってくれてただけなのに……"
"1301302-60-モミジ" = "……まだ一緒に、探してくださるんですか？"
"1301302-61-モミジ" = "……。"
"1301302-62-モミジ" = "あ、ありがとうございます……先生！心よりお礼申し上げます！#nそれから……ごめんなさい……"
"1301302-63-モミジ" = "感動的なシーンの後は、目標を達成できるのがお約束のはずなのに……"
"1301302-64-モミジ" = "これが、漫画だったら今頃は……"
"1301302-65-モミジ" = "うぅ……現実は甘くないですね……"
"1301302-66" = "[s3] \"もしかしたら、知識解放戦線の同人誌は……\"\n[s4] \"私たちの心の中にあるのかもしれないね。\""
"1301302-67-モミジ" = "打ち切り漫画の最終回にありそうなセリフですね……"
"1301302-68-モミジ" = "……待ってください、先生。#n心の中……心の中……"
"1301302-69-モミジ" = "もしかして……！"
"1301302-70" = "[s] \"どうしたの？\""
"1301302-71-モミジ" = "ついてきてください、先生！"
"1301302-72-モミジ" = "図書館の一番奥……物置として使われている部屋……"
"1301302-73-モミジ" = "誰も探そうとすらしなかった……ここなら……！？"
"1301302-74-モミジ" = "……！"
"1301302-75-モミジ" = "見つけました、先生！知識解放戦線の同人誌です！"
"1301302-76" = "[s5] \"こんなところにあったなんて……！\"\n[s6] \"良かったね、モミジ！\""
"1301302-77-モミジ" = "えへへ……本当に……嬉しいです……！全部、先生のおかげです。"
"1301302-78-モミジ" = "はい？先生は、ちょっとした冗談のつもりで……？"
"1301302-79-モミジ" = "いえ、そんな……先生の言葉があったから、この場所を思いつけましたし……"
"1301302-80-モミジ" = "それに……今日一日中、私と一緒にいてくださったじゃないですか。"
"1301302-81-モミジ" = "え、えっと……あ！同人誌の内容！#n先生も気になりますよね？"
"1301302-82-モミジ" = "……。"
"1301302-83-モミジ" = "ふふ……なんか、拍子抜けしますね。"
"1301302-84-モミジ" = "線が荒いですし、本としては中途半端で……"
"1301302-85-モミジ" = "……でも、「描きたい」という想いだけは、真っ直ぐに伝わってくる……"
"1301302-86-モミジ" = "初めてコミセンに参加した頃を思い出す、そんな同人誌ですね。"
"1301302-87-モミジ" = "いいえ、がっかりなんてしていません。"
"1301302-88-モミジ" = "これも知識解放戦線の大切な歴史ですから。"
"1301302-89-モミジ" = "もちろん、これが私たちの抱える問題を解決してくれるわけではないですが……"
"1301302-90-モミジ" = "……勇気をもらいました。#n昔の先輩方も、同じ想いで作品を作っていたんだなぁって実感が湧きましたから。"
"1301302-91-モミジ" = "えへへ、先生！"
"1301302-92-モミジ" = "今日は本当に、ありがとうございました！"
