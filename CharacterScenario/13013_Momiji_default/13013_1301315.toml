[translation]
"1301315-1" = " 忘れがちなものについて"
"1301315-2" = "（レッドウィンターの図書館に向かった）"
"1301315-3-モミジ" = "ほ、本当に来てくださるなんて！"
"1301315-4-モミジ" = "ごめんなさい、こんなことで…… 。"
"1301315-5-モミジ" = "ご迷惑じゃ……。"
"1301315-6" = "[s] とりあえず、探してみる！"
"1301315-7-モミジ" = "わ、わかりました……"
"1301315-8-モミジ" = "何を探すの？……ですか。"
"1301315-9-モミジ" = "……"
"1301315-10-モミジ" = "その……！"
"1301315-11-モミジ" = "えっと……！"
"1301315-12-モミジ" = "ルリエル先生のデビュー作の、復刻版限定コレクション……です……。"
"1301315-13" = "[s] \"とっても大事なものじゃない！？\""
"1301315-14-モミジ" = "も、もちろん、ファンには特別なものですが……。"
"1301315-15-モミジ" = "大半の人にとっては、ただの漫画全巻セットです……。"
"1301315-16-モミジ" = "え？私にとっては宝物……？"
"1301315-17-モミジ" = "……！"
"1301315-18-モミジ" = "……ありがとうございます！"
"1301315-19-モミジ" = "元気が出てきました。探していきましょう！"
"1301315-20" = "（モミジの「宝物」を探すため、図書館を隅々まで調べ始めた……）"
"1301315-21" = "（しばらく探していると……）"
"1301315-22" = "[ns] \"あれ？\""
"1301315-23" = "[ns] \"もしかして、これ？\""
"1301315-24-モミジ" = "……？"
"1301315-25-モミジ" = "そ、そんなところに……！"
"1301315-26-モミジ" = "見つかってよかった……！"
"1301315-27-モミジ" = "図書館でなくすなんて、司書失格ですね……"
"1301315-28-モミジ" = "ええ。ビニールは掛けたままで、開封していないんです。"
"1301315-29-モミジ" = "えへへ……！大事に保管しているんですよ？"
"1301315-30-モミジ" = "……私の一番のコレクションですから！"
"1301315-31" = "（興味が湧き、漫画のタイトルを検索した）"
"1301315-32" = "（すると……！）"
"1301315-33" = "[ns1] \"……！？\"\n[ns2] \"モミジ、これ見て！\""
"1301315-34-モミジ" = "どうしたんですか？"
"1301315-35-モミジ" = "このコレクションがプレミア価格に……？"
"1301315-36-モミジ" = "……。"
"1301315-37-モミジ" = "ええっ！？"
"1301315-38-モミジ" = "こ、こんなに……？#nハッキングとか、サイトのエラーじゃ……？"
"1301315-39" = "[s] \"何回も確認したから、多分合ってる……。\""
"1301315-40-モミジ" = "しょ、初回限定版にプレミアが付くのは、それほど珍しいことではありませんが……"
"1301315-41-モミジ" = "こ、こんな額になっているのは初めて見ました……これだけあれば……。"
"1301315-42-モミジ" = "（新しい蔵書を、申請せずに直接購入できますし……）"
"1301315-43-モミジ" = "（新品の暖房器具だって買えます……！）"
"1301315-44-モミジ" = "（工務部の皆さんに依頼して、夢の別館建設も……！あとは………）"
"1301315-45-モミジ" = "（あとは……プリンも食べ放題……！）"
"1301315-46-モミジ" = "（それでもまだお釣りが来る……）"
"1301315-47" = "[ns] \"モミジ、大丈夫？\""
"1301315-48-モミジ" = "は、はい！"
"1301315-49-モミジ" = "……ぼ、ぼーっとしてましたか！？"
"1301315-50-モミジ" = "うぅぅ……。"
"1301315-51-モミジ" = "……。"
"1301315-52-モミジ" = "うぅぅうん……！"
"1301315-53-モミジ" = "や、やっぱりダメです！"
"1301315-54" = "[ns] \"大事なコレクションだもんね。\""
"1301315-55-モミジ" = "はい……。"
"1301315-56-モミジ" = "これは、私の「初めてのコレクション」ですから。 "
"1301315-57-モミジ" = "絶版になる前に無理をして買ったもので……。"
"1301315-58-モミジ" = "プレミア価格がついたとしても、手放せません"
"1301315-59-モミジ" = "私にとって大切な、特別な―― "
"1301315-60-モミジ" = "――コレクションなんです。"
"1301315-61-モミジ" = "それだけ払ってでもこのコレクションをほしいと思う人がいるように――"
"1301315-62-モミジ" = "いくら払われたとしても手放したくない――そう言い張るマニアが、いてもいいですよね？"
"1301315-63" = "[s3] \"うん、私もそう思う。\"\n[s4] \"そういう考え方も大事だよ。\""
"1301315-64-モミジ" = "……ありがとうございます。"
"1301315-65-モミジ" = "……。"
"1301315-66-モミジ" = "…………。"
"1301315-67-モミジ" = "は、はい！？またぼーっとしてましたか！？"
"1301315-68-モミジ" = "……ううっ……！"
"1301315-69-モミジ" = "や、やっぱりコレクター失格です……"
"1301315-70-モミジ" = "……プリンを何十箱も買えるんだよなぁと……。"
"1301315-71-モミジ" = "つい頭をよぎってしまって……。"
"1301315-72" = "[s5] \"プリンなら任せて！\"\n[s6] \"好きなだけ食べさせてあげる！\""
"1301315-73-モミジ" = "ほ、本当ですか！？"
"1301315-74-モミジ" = "えへへ……嬉しいです、先生！"
"1301315-75" = "（こうして、モミジと楽しいおやつの時間を過ごした）"
