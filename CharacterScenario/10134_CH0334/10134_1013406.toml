[translation]
"1013406-1" = "魔法が始まる時間"
"1013406-2-？？？" = "――せ。"
"1013406-3" = "（……？）"
"1013406-4" = "（どこからかアリスの声がする）"
"1013406-5-アリス" = "せ……せい。"
"1013406-6" = "（でも、アリスの姿はどこにもなかった）"
"1013406-7-アリス" = "先生！こっちです！"
"1013406-8" = "[ns1] 声がした方を向く。\n[ns2] 窓の外に目を向ける。"
"1013406-9" = "[wa:900]― [log=아리스 결전]えへへ。[wa:1520]先生、[wa:1350]驚きましたか？[/log]"
"1013406-10" = "― [log=아리스 결전]先生と一緒に、[wa:1900]この夜空を見たくて……[wa:1880]呼んだんです。[/log]"
"1013406-11" = "[wa:2230]― [log=아리스 결전]とても……[wa:1630]綺麗ですね。[/log]"
"1013406-12" = "― [log=아리스 결전]アリスの世界にも、[/log]"
"1013406-13" = "― [log=아리스 결전]まだ行ったことのない世界にも……[/log]"
"1013406-14" = "― [log=아리스 결전]きっと[wa:1140]こんな綺麗なものが[/log]"
"1013406-15" = "― [log=아리스 결전]たくさんあると思うんです。[/log]"
"1013406-16" = "[wa:2900]― [log=아리스 결전]でも……[wa:1430]不思議です。[/log]"
"1013406-17" = "― [log=아리스 결전]世界って、[wa:1790]こんなに綺麗なのに……[/log]"
"1013406-18" = "― [log=아리스 결전]どうして人は争うんでしょう？[/log]"
"1013406-19" = "[wa:1740]― [log=아리스 결전]あの星空みたいに、[/log]"
"1013406-20" = "― [log=아리스 결전]この世界は、[/log]"
"1013406-21" = "― [log=아리스 결전]みんなで分け合っても[/log]"
"1013406-22" = "― [log=아리스 결전]大丈夫なくらい[wa:1840]美しいもので[wa:780]あふれているのに……。[/log]"
"1013406-23" = "[wa:2640]― [log=아리스 결전]……やっぱり、[wa:1880]アリスにはまだわかりません。[/log]"
"1013406-24-アリス" = "えへへ。アリス、戻りました。"
"1013406-25-アリス" = "……っくしゅっ！"
"1013406-26" = "[s3] \"大丈夫？身体冷やしちゃったんじゃない！？\"\n[s4] \"風邪引いちゃったんじゃない！？\""
"1013406-27-アリス" = "大丈夫です！アリスはまだ風邪を引いたことがありません！"
"1013406-28-アリス" = "あっ、先生の手……。"
"1013406-29-アリス" = "温かくて落ち着きます……。ふふっ。"
"1013406-30" = "（温めてあげていたら、そのままアリスは眠ってしまった）"
"1013406-31" = "（起こさないように、アリスを部屋まで運んであげた）"
