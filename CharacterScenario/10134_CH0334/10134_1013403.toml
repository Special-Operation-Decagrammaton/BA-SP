[translation]
"1013403-1" = "始まりの町"
"1013403-2-アリス" = "あの、先生……これは？"
"1013403-3" = "[ns] \"特訓だよ！！\""
"1013403-4-アリス" = "えっと、でもこれは……。"
"1013403-5-アリス" = "普通のゲーム……ですよね？"
"1013403-6" = "[ns] \"特訓だよ！！\""
"1013403-7-アリス" = "た、大変です！"
"1013403-8-アリス" = "先生が壊れてしまいました！"
"1013403-9" = "[s1] \"考えてみたんだけどさ。\"\n[s2] \"アリスはまだ勇者のアーマーに慣れてないんだと思うんだ。\""
"1013403-10" = "[ns3] \"だから、まずは体に馴染ませるところからかなって。\"\n[ns4] \"緊張せずにアーマーを着られるようになろう！\""
"1013403-11-アリス" = "体に馴染ませる……？"
"1013403-12-アリス" = "勇者のアーマーを着用して、ゲームをするだけでいいのですか？"
"1013403-13-アリス" = "うぅん……。"
"1013403-14-アリス" = "それがどうして修行になるのか、アリスにはよく分かりません。"
"1013403-15-アリス" = "先生？なぜ電気を消すのですか？"
"1013403-16-アリス" = "え……？電気を消した方が、没入感があって面白い……？"
"1013403-17-アリス" = "それは、アリスもそう思いますが……。"
"1013403-18-アリス" = "電気を消してゲームをすると目が悪くなる！と、先生はいつも言っていました！"
"1013403-19" = "[s5] \"そう、普段はダメだよ。\"\n[s6] \"でも、今日は特訓だから。\""
"1013403-20-アリス" = "……！"
"1013403-21-アリス" = "アリス、なんだかドキドキしてきました！"
"1013403-22-アリス" = "夜遅くまでゲームをしていて、こっそりコンビニに行った時と似た感じです！"
"1013403-23-アリス" = "……はっ！これは内緒なんでした。"
"1013403-24-アリス" = "そ、それよりもゲームです！何をプレイしたらいいですか？"
"1013403-25-アリス" = "えっ、好きなものでいい……？"
"1013403-26-アリス" = "アリス、好きなゲームはたくさんあります！"
"1013403-27-アリス" = "……どれも名作ばかりで選べません！"
"1013403-28-アリス" = "たとえばこれ！"
"1013403-29-アリス" = "これは、大きな武器でドラゴンを狩るゲームです！"
"1013403-30-アリス" = "ドラゴンを狩って入手した素材で、もっと強い武器を作って、もっともっと強いドラゴンを狩ります！"
"1013403-31-アリス" = "もちろん良い装備だからといって、すぐに強くなるわけじゃありません！#nプレイヤー本人が強くならなければ意味がないのです！"
"1013403-32-アリス" = "まさに、今のアリスにぴったりなゲームかもしれません！"
"1013403-33" = "[s] \"じゃあそれにする？\""
"1013403-34-アリス" = "……たしかに、アリスはこのゲームが好きです。"
"1013403-35-アリス" = "でも、今はその時ではない気がします。すごくプレイ時間が長いので……。"
"1013403-36-アリス" = "やっぱりもう少しだけ見てみます。"
"1013403-37-アリス" = "……あっ、これは！"
"1013403-38-アリス" = "すごく難しいことで有名なゲームです！"
"1013403-39-アリス" = "プレイヤーを即死させる罠がフィールドのあちこちにあって……。"
"1013403-40-アリス" = "なんとかボスにたどり着いても、予備知識がなければ一瞬で負けてしまうんです！#n何度も何度も挑戦して、プレイヤーが成長しないとクリアできないゲームです！"
"1013403-41-アリス" = "だからこそ、クリアした時の達成感は他とは比べ物になりません！"
"1013403-42-アリス" = "……これも、今のアリスみたいですね。"
"1013403-43" = "[s] \"じゃあそのゲームにする？\""
"1013403-44-アリス" = "……いいえ。#nたしかに好きなゲームではありますが……。"
"1013403-45-アリス" = "このゲームをプレイしたら、勇者のアーマーにトラウマができてしまいそうです……。"
"1013403-46-アリス" = "他に……プレイ時間がちょうどよくて、気持ちが落ち着くようなゲームは……。"
"1013403-47-アリス" = "……あ。"
"1013403-48-アリス" = "決めました。アリス、これがいいです。"
"1013403-49" = "[s7] \"それは……。\"\n[s8] \"『テイルズ・サガ・クロニクル』？\""
"1013403-50-アリス" = "はい！無印の『テイルズ・サガ・クロニクル』です！"
"1013403-51-アリス" = "アリスが入る前のゲーム開発部が作った作品です。"
"1013403-52-アリス" = "だからアリスは、このゲームの製作に関わっていません。#nですがゲームを進めていくと、みんなの思いがすごく伝わってきます。"
"1013403-53-アリス" = "そして何よりこのゲームは――"
"1013403-54-アリス" = "クソゲーです！"
"1013403-55" = "[s9] \"アリス！？\"\n[s10] \"だいぶ変わってるゲームだとは聞いてたけど……！\""
"1013403-56-アリス" = "それが事実なのです！"
"1013403-57-アリス" = "最初はアリスも分かりませんでしたが、たくさんゲームをプレイしてきた今なら断言できます。"
"1013403-58-アリス" = "『テイルズ・サガ・クロニクル』はクソゲーです！"
"1013403-59-アリス" = "……でも、いいんです。"
"1013403-60-アリス" = "これは……アリスが初めてプレイしたゲームなんです。"
"1013403-61-アリス" = "このゲームは、アリスのことを初めて「勇者」と呼んでくれました。"
"1013403-62-アリス" = "……やっぱり、アリスはこのゲームが好きです。"
"1013403-63-アリス" = "それに、プレイ時間もちょうどいいです！"
"1013403-64-アリス" = "攻略法さえ分かれば、3時間でトゥルーエンドを見られるのですから！"
"1013403-65-アリス" = "先生！アリスと一緒にやりましょう！"
"1013403-66" = "（勢いに押されて 『テイルズ・サガ・クロニクル』をプレイすることになった）"
"1013403-67" = "[56cd7b]コスモス世紀2354年、人類は劫火の炎に包まれた――[-]"
"1013403-68-アリス" = "正統派ファンタジーRPGなのに、こんなオープニングです！"
"1013403-69-アリス" = "それに「コスモス世紀」という固有名詞は、ここでしか出てきません！"
"1013403-70" = "[56cd7b]チュートリアルを開始します。[-]"
"1013403-71" = "[56cd7b]まずはBボタンを押して、目の前の武器を装着してみてください。[-]"
"1013403-72-アリス" = "あ、これは罠です。ここでBボタンを押したらゲームオーバーです。"
"1013403-73-アリス" = "Aボタンを押すと進められます。"
"1013403-74" = "[ns11] \"想像以上に難しいゲームだね……。\"\n[ns12] \"3時間でクリアできるかな？\""
"1013403-75-アリス" = "攻略法を知らなければ一生クリアできないかもしれません。"
"1013403-76-アリス" = "しかしアリスのようなベテランプレイヤーなら余裕です！"
"1013403-77-アリス" = "あっ。 "
"1013403-78-アリス" = "敵とエンカウントせずに最初の町に着きました。"
"1013403-79-アリス" = "序盤は回復手段が限られるので、これはラッキーです！"
"1013403-80-アリス" = "……この、「始まりの町」のBGM。"
"1013403-81-アリス" = "アリスはすごく好きです。#n聞いていると、初めてこのゲームと出会った時を思い出します。"
"1013403-82-アリス" = "……ふふっ。"
"1013403-83-アリス" = "とても不思議です。あの時のアリスは、まだ何も知りませんでした。"
"1013403-84-アリス" = "あれから光の剣を手に入れ、仲間と出会い、数々の冒険を経て――"
"1013403-85-アリス" = "今はこのように、はるか遠くの氷海にまで来ています。"
"1013403-86-アリス" = "本当に、勇者の冒険みたいです。"
"1013403-87-アリス" = "……この「始まりの町」は、アリスにとっても始まりの場所なんです。"
"1013403-88-アリス" = "……あっ！モンスターとエンカウントしました！"
"1013403-89-アリス" = "ダブルショットガンを使うプニプニです！#n近接では難しいのでここは――"
"1013403-90" = "（アリスと『テイルズ・サガ・クロニクル』を進めた）"
"1013403-91" = "（しばらくして……）"
"1013403-92-アリス" = "……ラスボスを倒しました！クリアです！"
"1013403-93-アリス" = "……先生？どうかしましたか？"
"1013403-94-アリス" = "悲しそうな子犬みたいな顔をしています！"
"1013403-95" = "[s] \"アリス……聞いてもいい？\""
"1013403-96" = "[ns13] \"どうして母親がヒロインで、それでいて実は前世の妻で……。\"\n[ns14] \"どうして腹違いの友人がタイムリープしてきてるんだろう？\""
"1013403-97-アリス" = "アリスにも分かりません！"
"1013403-98-アリス" = "……でも。"
"1013403-99-アリス" = "面白いと思いませんか？"
"1013403-100" = "[s15] \"……そうだね。\"\n[s16] \"すごく面白かった。\""
"1013403-101-アリス" = "先生がアリスと一緒で嬉しいです！アリスもすごく楽しかったです！"
"1013403-102-アリス" = "では次は――"
"1013403-103" = "（自然とゲームを続けることになり）"
"1013403-104" = "（アリスといろんなゲームをしながら過ごした）"
