[translation]
"1013402-1" = "勇者修行"
"1013402-2-アリス" = "パンパカパーン！"
"1013402-3-アリス" = "アリスは新装備を手に入れました！"
"1013402-4-アリス" = "これで[ruby=勇者の武器]光の剣：スーパーノヴァ[/ruby]と[ruby=勇者のアーマー]アビ・エシュフ[/ruby]が揃ったので――"
"1013402-5-アリス" = "伝説の武具を集めたアリスは、真の勇者になったのです！"
"1013402-6" = "[s1] \"おお、おめでとう！\"\n[s2] \"これで最強だね！\""
"1013402-7-アリス" = "いいえ、まだ違います……アリスは忘れていたのです。"
"1013402-8-アリス" = "防具は……ただ装備するだけでは意味がないのだということを！"
"1013402-9-アリス" = "本来の性能を引き出すためには、アリスの熟練度を上げなければいけません！"
"1013402-10" = "[s3] \"アビ・エシュフは高機動兵器だもんね。\"\n[s4] \"使いこなすのは大変だよね。\""
"1013402-11-アリス" = "そうなんです……。"
"1013402-12-アリス" = "今のアリスは、横スクロールが3Dに変わったようなもの……。"
"1013402-13-アリス" = "右も左も分からない状態では戦えません！"
"1013402-14-アリス" = "つまりこの試練を乗り越えるには、勇者修行が必要です！"
"1013402-15-アリス" = "アーマーの使い方はすでに賢者から教わっています！"
"1013402-16-アリス" = "あとはマスターするまで修行を繰り返すのみ！"
"1013402-17-アリス" = "でもこの修行はとても難しいです……#n偏ったジョイスティックでプラットフォームゲームをしているみたいです！"
"1013402-18-アリス" = "なので、ここからは先生の出番です！"
"1013402-19" = "[s5] \"了解！サポートは任せて！\"\n[s6] \"何をしたらいい？\""
"1013402-20-アリス" = "先生は、隣でアリスを応援していてください！"
"1013402-21" = "[ns7] \"……応援？\"\n[ns8] \"……それだけ？\""
"1013402-22-アリス" = "はい！"
"1013402-23-アリス" = "先生はマスコットなので、隣にいてくれたら元気が出ます！"
"1013402-24-アリス" = "どんなに辛い修行でも……#n先生がパーティーにいれば、士気をMAXで保つことができるんです！"
"1013402-25-アリス" = "……どうかしましたか？"
"1013402-26-アリス" = "先生、悲しそうな子犬みたいな顔をしています。"
"1013402-27-アリス" = "えっ？なんでもない、ですか？"
"1013402-28-アリス" = "……？"
"1013402-29-アリス" = "とにかく、勇者修行のスタートです！"
"1013402-30" = "（こうしてアリスの修行が始まった……！）"
"1013402-31-アリス" = "ここでこうすれば……。"
"1013402-32-アリス" = "あっ、逆でした！こういう時はブースターで勢いを相殺して――"
"1013402-33-アリス" = "あれっ！？こっちは側面ブースターでした！"
"1013402-34-アリス" = "うわぁーん！ぐるぐる回り始めました！"
"1013402-35" = "（いろんなハプニングがあったけど、大きなトラブルもなく修行は続き――）"
"1013402-36-アリス" = "はぁ……はぁ……。"
"1013402-37-アリス" = "ここで、もう少し右に回って……。"
"1013402-38" = "（――気づけばかなりの時間が過ぎていた）"
"1013402-39" = "（アリスはまだ勇者修行を続けるつもりみたいだった）"
"1013402-40-アリス" = "……あうっ！"
"1013402-41-アリス" = "さっきまでは上手にできていたのに……。"
"1013402-42-アリス" = "なぜか何度も失敗してしまいます！"
"1013402-43" = "[s9] \"少し休憩しない？\"\n[s10] \"そろそろ疲れてきたんじゃないかな。\""
"1013402-44-アリス" = "いいえ！大丈夫です！"
"1013402-45-アリス" = "アリスはまだ元気いっぱいです！"
"1013402-46-アリス" = "それにアリス、似たようなゲームならたくさんプレイしてきました！"
"1013402-47-アリス" = "見ていてください……こういう風に――っ！"
"1013402-48-アリス" = "あっ！"
"1013402-49" = "[ns11] \"大丈夫！？\"\n[ns12] アリスに駆け寄る。"
"1013402-50-アリス" = "先生……。"
"1013402-51-アリス" = "ちょっとひねっただけなので、大丈夫で――"
"1013402-52-アリス" = "いたっ。"
"1013402-53-アリス" = "やっぱり先生の言うことを聞くべきでしたね。"
"1013402-54-アリス" = "疲労度の管理は育成シミュレーションの基本です！"
"1013402-55-アリス" = "このまま修行を進めたら、ステータスダウンのイベントが発生してしまいます！"
"1013402-56-アリス" = "アリスのようなベテランプレイヤーだって、たまにはこんなミスを犯してしまうものです……。"
"1013402-57-アリス" = "……。"
"1013402-58" = "[ns] \"……今日はもう帰ろっか。\""
"1013402-59-アリス" = "先生……？"
"1013402-60-アリス" = "どうして膝を地面に……？"
"1013402-61" = "[s13] \"おんぶしてあげる。\"\n[s14] \"その足じゃ動けないでしょ？\""
"1013402-62-アリス" = "えっ？でもこの装備なら飛んで帰れば……。"
"1013402-63" = "[s15] \"いいからいいから！\"\n[s16] \"こんな時くらいはさ！\""
"1013402-64-アリス" = "あっ……じゃあ……。"
"1013402-65-アリス" = "えへへ。"
"1013402-66-アリス" = "アリス、先生に毎日おんぶしてもらいたいです。"
"1013402-67" = "（背中越しに感じるアリスの体温は少し冷たかった。#nずっと寒空の下を飛び回っていたからだろうか）"
"1013402-68" = "（アリスのアーマーは想像以上に重たくて……）"
"1013402-69" = "（腰を痛めてしまうかと思った）"
