[translation]
"1011703-1" = "ガール・オン・ザ・ストリート "
"1011703-2" = "（街を歩いていると……）"
"1011703-3" = "[ns] \"あれは……。\""
"1011703-4" = "[ns] \"ヒカリ、何してるの？\""
"1011703-5-ヒカリ" = "あー、先生ー。"
"1011703-6-ヒカリ" = "来て来てー早くー。"
"1011703-7" = "（しゃがみこんでいるヒカリの隣に行った）"
"1011703-8-ヒカリ" = "これ見えるー？"
"1011703-9" = "[ns] \"これは……。\""
"1011703-10" = "（黒アリと赤アリが熾烈な戦いを繰り広げている）"
"1011703-11" = "[ns] \"アリの戦争……！\""
"1011703-12-ヒカリ" = "イエース。#n街角の[ruby=ラグナロク]最終戦争[/ruby]ー。"
"1011703-13" = "[s] \"これを見てたんだね。\""
"1011703-14-ヒカリ" = "そー、ヒカリの趣味ー。"
"1011703-15-ヒカリ" = "ずっと見てられるー。"
"1011703-16-ヒカリ" = "先生どっち派ー？"
"1011703-17" = "[s1] \"なんか昔を思い出すね……。\"\n[s2] \"どっちだろう……。\""
"1011703-18-ヒカリ" = "黒の方は体がデカくてー、"
"1011703-19-ヒカリ" = "赤の方はいっぱいいる。"
"1011703-20" = "[ns3] \"黒！\"\n[ns4] \"赤！\""
"1011703-21-ヒカリ" = "じゃあヒカリは反対のほー。"
"1011703-22-ヒカリ" = "あ、黒アリの親玉出てきたー。"
"1011703-23-ヒカリ" = "でっかーい。赤アリ軍ピンチ。"
"1011703-24" = "[s] \"でも兵力なら赤アリが……！\""
"1011703-25-ヒカリ" = "盛り上がってきたー。"
"1011703-26" = "（二人で戦況を見守っていると……）"
"1011703-27-ヒカリ" = "あっ。赤アリ軍、砲兵部隊しゅつどー。"
"1011703-28-ヒカリ" = "撃ち方はじめー。"
"1011703-29" = "[s5] \"すごい勢いのギ酸！\"\n[s6] \"危ないから少し下がっ……！\""
"1011703-30-ヒカリ" = "いたーい！"
"1011703-31-ヒカリ" = "うあー、ヒカリ被弾したー。"
"1011703-32" = "[s] \"ヒカリ、こっちに！\""
"1011703-33" = "（急いで近くの水道に連れていき、傷口を水で流した）"
"1011703-34-ヒカリ" = "うぅ……致命傷ー……。"
"1011703-35" = "[s7] \"ちょっと当たっちゃったけど……。\"\n[s8] \"痛む？\""
"1011703-36-ヒカリ" = "秒間5億ポイントのダメージー……。"
"1011703-37-ヒカリ" = "報復する。今のヒカリはアベンジャー。"
"1011703-38" = "[s9] \"ヒカリ、いい子だから許してあげて……！\"\n[s10] \"ほら、美味しいもの食べに行こう……！\""
"1011703-39-ヒカリ" = "うー、美味しいもの……。"
"1011703-40-ヒカリ" = "でも、報復しないとナメられるー……。"
"1011703-41-ヒカリ" = "うーん……。"
"1011703-42-ヒカリ" = "じゃ、ヒカリが流した血の量だけ、美味しいものー。"
"1011703-43" = "[s] \"血は出てないけどね……。\""
"1011703-44" = "（手当を済ませて、美味しいものを食べに行った）"
