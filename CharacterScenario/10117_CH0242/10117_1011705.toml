[translation]
"1011705-1" = "ガール・オン・アンド・アドベンチャー "
"1011705-2" = "（とりあえずヒカリが居るという場所に向かった）"
"1011705-3" = "[ns] \"今日は何してるの？\""
"1011705-4-ヒカリ" = "先生、ヒカリ今ちょーぴんち。"
"1011705-5" = "[ns] \"周りには何もないけど……？\""
"1011705-6-ヒカリ" = "ここ、全部マグマー。"
"1011705-7-ヒカリ" = "白いとこは岩場。安全地帯ー。"
"1011705-8-ヒカリ" = "マグマに落ちたらおわりー。"
"1011705-9" = "[ns1] \"ああっ……！\"\n[ns2] \"私もこうやって遊んだ記憶が……。\""
"1011705-10-ヒカリ" = "先生、そこマグマ。"
"1011705-11-ヒカリ" = "逃げてー。"
"1011705-12" = "（ヒカリに言われた通り、白のタイルに移動した）"
"1011705-13-ヒカリ" = "よくやったー。 "
"1011705-14-ヒカリ" = "あっちの交差点まで生き残ろー。"
"1011705-15" = "[s] \"よし、やってみる。\""
"1011705-16-ヒカリ" = "赤いとこは浮島でセーフー。"
"1011705-17-ヒカリ" = "落ちたらアウトー。"
"1011705-18" = "[ns] \"まずい……赤いタイルがない……！\""
"1011705-19-ヒカリ" = "あの店の前、赤いじゅうたんあるよー。"
"1011705-20-ヒカリ" = "あそこ安全地帯ー。"
"1011705-21" = "[s] \"あそこまで飛べるかな……？\""
"1011705-22-ヒカリ" = "無理なら先生の冒険は終わりー。"
"1011705-23" = "[s] \"ぐぬぬ……やってみるよ！\""
"1011705-24" = "[ns] \"あっ！\""
"1011705-25-市民１" = "おわーっ！？"
"1011705-26" = "[s] \"す、すみません……！！\""
"1011705-27-市民１" = "い、一体何を……？"
"1011705-28" = "[s] \"いやっ、その……。\""
"1011705-29-ヒカリ" = "赤ー。"
"1011705-30-ヒカリ" = "赤踏まないとアウトー。"
"1011705-31-ヒカリ" = "この島の上じゃないと生きられないー。"
"1011705-32-市民１" = "えっ？"
"1011705-33-市民１" = "……ああ！"
"1011705-34-市民１" = "懐かしいね。"
"1011705-35-市民１" = "冒険ごっこか、私も小さい頃はよくやったもんだ。"
"1011705-36-市民１" = "ははっ、旅の無事を祈ってるよ。"
"1011705-37" = "[ns] \"ちょっと恥ずかしい……。\""
"1011705-38-ヒカリ" = "恥はいっしゅーん。"
"1011705-39-ヒカリ" = "命のほうが大事ー。"
"1011705-40" = "[s] \"そ、そうだね……！\""
"1011705-41" = "[ns] \"くっ……こうなったら最後まで行くぞ！\""
"1011705-42-ヒカリ" = "いくぞー。"
"1011705-43" = "（ヒカリとの過酷な冒険の旅を経て、シャーレに戻ってきた）"
"1011705-44-ヒカリ" = "今日は最長記録達成ー！はいすこあー。"
"1011705-45" = "[s3] \"楽しかったよ……そろそろ仕事に戻ろうかな。\"\n[s4] \"そういえば、ヒカリはどこに行こうとしてたの？\""
"1011705-46-ヒカリ" = "わすれたー。"
"1011705-47" = "[s] \"い、いいのかなそれで……。\""
"1011705-48-ヒカリ" = "いいのー。ノーデスでクリアできたからー。"
"1011705-49-ヒカリ" = "先生は8回落ちたけど、初挑戦なら悪くないー。 "
"1011705-50" = "[s] \"よかった……大昔にやってたからね。\""
"1011705-51-ヒカリ" = "あ……。"
"1011705-52-ヒカリ" = "ヒカリ、動けない。"
"1011705-53-ヒカリ" = "ここ、安全地帯なさすぎー。"
"1011705-54" = "[s5] \"そういえば……\"\n[s6] \"ここから先は、同じ色のタイルしかないね。\""
"1011705-55-ヒカリ" = "ヒカリ死亡フラグー。"
"1011705-56-ヒカリ" = "いままで楽しかったー。あとはまかせるー。"
"1011705-57-ヒカリ" = "ヒカリのこと、忘れないでねー。"
"1011705-58" = "[ns] \"ヒカリは私が助ける！\""
"1011705-59" = "（動けずにいるヒカリを抱きかかえて、オフィスに向かった）"
"1011705-60-ヒカリ" = "うぉー、たのもしー。"
"1011705-61" = "（ヒカリはシャーレで楽しそうに遊ぶと帰っていった）"
