[translation]
"1011708-1" = "ガール・オン・ファイアー "
"1011708-2" = "（どこか不安になるモモトークを受け取り、しばらくして……）"
"1011708-3-ヒカリ" = "ヒカリ参上ー。"
"1011708-4" = "[s1] \"こんにちは、ヒカリ。\"\n[s2] \"その手に持ってるのは……？\""
"1011708-5-ヒカリ" = "ヒカリの新しいチャレンジー。"
"1011708-6-ヒカリ" = "限界を越えるアイテムー。"
"1011708-7-ヒカリ" = "ご覧あれー"
"1011708-8" = "[s3] \"これは……。\"\n[s4] \"激辛カレー？\""
"1011708-9-ヒカリ" = "イエース、激辛ー。"
"1011708-10-ヒカリ" = "ヒカリ選手は今日から辛いものを食すー。"
"1011708-11-ヒカリ" = "歯を守ってニューヒカリとなるー。"
"1011708-12" = "[s] \"せめて中辛とかで……\""
"1011708-13-ヒカリ" = "心の強さは体の強さー。"
"1011708-14-ヒカリ" = "つまりヒカリは無敵ー。"
"1011708-15-ヒカリ" = "無敵だから辛くない－。"
"1011708-16" = "[s] \"なるほど……。\""
"1011708-17" = "（心配をよそに、ヒカリはカレーを準備した）"
"1011708-18-ヒカリ" = "いくよー。"
"1011708-19-ヒカリ" = "よゆー！ "
"1011708-20" = "[s] \"おおっ？\""
"1011708-21-ヒカリ" = "……。"
"1011708-22-ヒカリ" = "……うう。"
"1011708-23-ヒカリ" = "よゆーじゃないかも……。"
"1011708-24" = "[s] \"辛さって後から来るよね……。\""
"1011708-25-ヒカリ" = "ヒカリ、クリティカルー。"
"1011708-26-ヒカリ" = "くちびる燃えるーいふぁいー。"
"1011708-27-ヒカリ" = "ふぇんふぇーへるふぅー……。"
"1011708-28-ヒカリ" = "ふぅぅーーはぁぁーーー……。"
"1011708-29" = "[s5] \"息がもう辛い！\"\n[s6] \"な、なにか買ってくるから待ってて！\""
"1011708-30" = "（買ってきた牛乳をヒカリに渡した）"
"1011708-31-ヒカリ" = "ふぅ、ふぅ……"
"1011708-32-ヒカリ" = "ふぅーーーー。"
"1011708-33" = "[s] \"落ち着いたかな……？\""
"1011708-34-ヒカリ" = "うー、まだいだいー……。"
"1011708-35-ヒカリ" = "持続ダメージ、100億くらい……。"
"1011708-36-ヒカリ" = "もう辛いの食べない……。"
"1011708-37-ヒカリ" = "心の強さなど無意味だったのだ……。"
"1011708-38-ヒカリ" = "口の中燃えたー。"
"1011708-39-ヒカリ" = "先生、甘いのあるー？"
"1011708-40-ヒカリ" = "まだ口からひ……。"
"1011708-41" = "[s7] \"念のためアイスも買ってきたけど……。\"\n[s8] \"食べたら、ちゃんと歯磨きするんだよ？\""
"1011708-42-ヒカリ" = "約束する、ヒカリちゃんと歯磨きするー。"
"1011708-43-ヒカリ" = "先生もたべよー。"
"1011708-44" = "（アイスを食べたヒカリは疲れたのか、膝の上で眠りについた）"
"1011708-45" = "（……）"
"1011708-46" = "[ns] \"これじゃ動けないな……。\""
"1011708-47" = "（そのまま仕事が終わるまで寝かせてあげた）"
