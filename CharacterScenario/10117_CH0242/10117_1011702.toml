[translation]
"1011702-1" = "ガール・イン・ザ・トレイン"
"1011702-2" = "列車の客室"
"1011702-3" = "[ns] \"……暇だなぁ。\""
"1011702-4" = "（移動中、時間を持て余していると……）"
"1011702-5-ヒカリ" = "切符拝見しまーす。"
"1011702-6-ヒカリ" = "はーいみんな出してー。"
"1011702-7" = "[ns] \"ヒカリ……？\""
"1011702-8-ヒカリ" = "あ、先生だー。"
"1011702-9" = "[s1] \"こんにちはヒカリ、奇遇だね。\"\n[s2] \"仕事中だったんだ。\""
"1011702-10-ヒカリ" = "うんー頑張ってるー。"
"1011702-11-ヒカリ" = "先生出張だっけー。"
"1011702-12-ヒカリ" = "ちょっと待っててー。"
"1011702-13" = "[ns] \"？？\""
"1011702-14" = "（しばらくすると……）"
"1011702-15-ヒカリ" = "わっ！！"
"1011702-16" = "[ns] \"ビックリしたぁ！？\" "
"1011702-17-ヒカリ" = "ビックリしたでしょー。"
"1011702-18" = "[s] \"早かったね。\""
"1011702-19-ヒカリ" = "ヒカリ、切符の穴あけマスター。"
"1011702-20-ヒカリ" = "パパッと終わらせてきたー。"
"1011702-21-ヒカリ" = "んじゃ、何して遊ぶー？"
"1011702-22" = "[s] \"遊ぶ……！？\""
"1011702-23-ヒカリ" = "そーだ、一緒に食べよー。"
"1011702-24-ヒカリ" = "たのしー棒、ナパーム味ー。"
"1011702-25" = "[s3] \"ナパーム味……？\"\n[s4] \"そんな味のお菓子があるんだ？\""
"1011702-26-ヒカリ" = "ナパーム感あるよー。"
"1011702-27" = "[ns5] \"ピリ辛の粉が口の中に散らばる……！\"\n[ns6] \"げほっ、げほっ……。\""
"1011702-28-ヒカリ" = "刺激的でしょー。"
"1011702-29-ヒカリ" = "んじゃ、次これー。"
"1011702-30-ヒカリ" = "パチパチキャンディ、限定版の[ruby=しょうめいだん]照明弾[/ruby]味ー。"
"1011702-31-ヒカリ" = "元は激すっぱ味だけど、こっちは激ヤバすっぱ味らしー。"
"1011702-32-ヒカリ" = "はい、あーん。"
"1011702-33" = "[s] （こわいけど……）"
"1011702-34" = "[ns] \"……あ、あーん。\""
"1011702-35" = "[ns] \"すっっ……っぱいっ！！\""
"1011702-36-ヒカリ" = "梅干しみたいな顔してるー。"
"1011702-37" = "[s] \"ヒカリもあーん、だよ！\""
"1011702-38-ヒカリ" = "あーん……"
"1011702-39-ヒカリ" = "……。"
"1011702-40-ヒカリ" = "んっ……すっふぁいねー。"
"1011702-41" = "[s] \"すっぱそうじゃない！\""
"1011702-42-ヒカリ" = "ひふぁり、ふっふぁいのへいふぃー。"
"1011702-43" = "[s7] \"すっぱいの平気！？\"\n[s8] \"やられた……！\""
"1011702-44" = "（そうしてヒカリと色んなお菓子を楽しんだ）"
"1011702-45" = "[ns] \"ところで……\""
"1011702-46" = "[ns] \"仕事に戻らなくて大丈夫？\""
"1011702-47-ヒカリ" = "先生と遊びたいからもう上がってるよー。"
"1011702-48" = "[s9] \"そんなことが！？\"\n[s10] \"羨ましいっ……！\""
"1011702-49-ヒカリ" = "今のヒカリはむてきー。"
"1011702-50-ヒカリ" = "先生も早上がり推奨ー。"
"1011702-51" = "[s] \"そうしたいのは山々だけど……。\""
"1011702-52-ヒカリ" = "先生あわれー。がんばー。"
"1011702-53-ヒカリ" = "でもヒカリは遊ぶー。"
"1011702-54" = "（ヒカリは終点まで存分に遊ぶと、帰っていった）"
