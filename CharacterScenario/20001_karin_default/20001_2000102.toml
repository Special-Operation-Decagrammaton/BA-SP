[translation]
"2000102-1" = "お手伝いが必要な時は、C&Cへ！"
"2000102-2" = "ミレニアム近郊・繁華街"
"2000102-3-カリン" = "……。"
"2000102-4-カリン" = "こちらコールサインゼロツー、人質が捕らえられている建物の前に到着した。"
"2000102-5-C&C部員" = "現在犯人たちはパソコンを使用中、おそらくパスワードを解析している模様。"
"2000102-6-カリン" = "まだファイルは転送されてない様子、良かった。"
"2000102-7-カリン" = "今、私の方でも人質たちの位置を視認できた。"
"2000102-8-カリン" = "おそらくはファイルを保護しようとして捕まった、生徒会の保安部所属だと推定される。"
"2000102-9-カリン" = "とりあえず人質は、ミレニアムの女子生徒二人と……ん？"
"2000102-10-カリン" = "せ、先生？"
"2000102-11-カリン" = "いったいなぜ先生がここに……？"
"2000102-12-C&C部員" = "巻き込まれたミレニアムの女子生徒たちを守ろうとして、一緒に捕まったという報告が今……！"
"2000102-13-カリン" = "まったく……あの人は！"
"2000102-14-カリン" = "状況は緊急レベルと判断！ゼロツー！先に侵入する！"
"2000102-15" = "ま、待ってください！"
"2000102-16" = "建物内部"
"2000102-17-ヘルメット団A" = "へへ、そろそろファイルの転送を始めようか。"
"2000102-18-ヘルメット団A" = "このファイルさえ依頼主に送れれば、私たちも大金持ちに……。"
"2000102-19" = "（ドカーン！）"
"2000102-20-ヘルメット団A" = "な、な、何だ！"
"2000102-21-ヘルメット団B" = "しゅ、襲撃だ！メイド部が突入してきた！"
"2000102-22-ヘルメット団A" = "くそ！もう嗅ぎ付けられたのか！"
"2000102-23-ヘルメット団A" = "何とかしてこのファイルだけでも……。"
"2000102-24" = "（ターン！）"
"2000102-25" = "ぐあっ！"
"2000102-26-ヘルメット団B" = "な、なんてやつだ！"
"2000102-27-ヘルメット団B" = "に、逃げろ！"
"2000102-28-カリン" = "先生！"
"2000102-29-カリン" = "大丈夫？どうしてこんなとこに……。"
"2000102-30-カリン" = "ん？ミレニアムの女子生徒たちが危ない目に遭ってたけど、助けられなくて……。"
"2000102-31-カリン" = "仕方ないからそのまま一緒に捕まった？"
"2000102-32-カリン" = "……信じられない。"
"2000102-33-カリン" = "先生のそういう善良な意志や、指揮能力は尊敬するけれど……。"
"2000102-34-カリン" = "弾丸一発でも危険なことになり得るんだ……。先生自身は弱いのだから、決して賢明な選択ではないだろう。"
"2000102-35-カリン" = "もし私が来なかったら、先生はこいつらに……。"
"2000102-36" = "撃て！"
"2000102-37-カリン" = "くっ！残党か！"
"2000102-38-カリン" = "諦めの悪いやつらだな……。"
"2000102-39-ヘルメット団" = "ふっ、諦めだと！？"
"2000102-40-ヘルメット団" = "お前の方こそ諦めたらどうだ！"
"2000102-41-ヘルメット団" = "おい、メイド。#nお前の任務はどうせ、人質を救出し、ファイルが転送される前に回収することだろう？"
"2000102-42-ヘルメット団" = "そうじゃなけりゃ、パソコンの前にいるやつを真っ先に撃ったりはしないだろうからな。"
"2000102-43-カリン" = "……！"
"2000102-44-ヘルメット団" = "ふはは、悪いがもう手遅れだよ！#nパスワードの解析も！そしてファイルの転送もな！そうだ、お前は間に合わなかったんだ！"
"2000102-45-カリン" = "な、なに！？"
"2000102-46-ヘルメット団" = "ふはは！さっきお前が攻撃してきた時、すでにファイルの転送残り時間は10秒を切っていた！#n今頃ファイルは依頼主の元に転送され……"
"2000102-47-ヘルメット団" = "あれ？"
"2000102-48-ヘルメット団" = "な、な、なにぃ？！"
"2000102-49-カリン" = "……？"
"2000102-50-ヘルメット団" = "ファイルの転送が1秒を残して止まってるだと！いったいどうして……。"
"2000102-51-ヘルメット団" = "……ん？"
"2000102-52-ヘルメット団" = "せ、先生！？その手にあるのは……。"
"2000102-53" = "[s1] \"私が……時を止めた。フッ。\"\n[s2] \"インターネットの線、抜いちゃった。\""
"2000102-54-カリン" = "よ、よくやった先生！ナイスだ！"
"2000102-55-カリン" = "よ、よくやった先生！ナイスだ！"
"2000102-56-ヘルメット団" = "くっ！その線を返せ！"
"2000102-57" = "[s3] 線を返す。\n[s4] カリンにどうするか聞く。"
"2000102-58-カリン" = "線？返してもいい。"
"2000102-59-カリン" = "線？返してもいい。"
"2000102-60-カリン" = "どうせもう……。"
"2000102-61-カリン" = "（ターンッ！）"
"2000102-62" = "（ドカーーーン！）"
"2000102-63-ヘルメット団" = "くあああっ！PCが！"
"2000102-64-ヘルメット団" = "お、お、覚えてろ！"
"2000102-65-カリン" = "ふぅ……。"
"2000102-66-カリン" = "これでようやく……任務完了か？"
"2000102-67-カリン" = "ん？ああ、追わない。残党がいるかもしれないし。"
"2000102-68-カリン" = "私の役割はあいつらを倒すことじゃなくて、ここにいる人たちを守ることだから。"
"2000102-69-カリン" = "それから、先生のことも……。"
"2000102-70-カリン" = "ああ、そういえば言い忘れていた。"
"2000102-71-カリン" = "ありがとう、先生。おかげで任務を無事完了できた。"
"2000102-72-カリン" = "まさかあの状況でネットの線を抜くなんて。"
"2000102-73-カリン" = "……。"
"2000102-74-カリン" = "さっき、弱いって言ったこと、取り消す。"
"2000102-75-カリン" = "先生は勇気のある人だ。"
"2000102-76-カリン" = "あ、通信。#n……残党は他のメイド部が清掃してるらしい。"
"2000102-77-カリン" = "もう帰らなきゃ。"
"2000102-78-カリン" = "……えっと、先生。"
"2000102-79-カリン" = "これからも、よろしく。"
