[translation]
"2000106-1" = "私と先生の関係？"
"2000106-2" = "ミレニアム・屋上"
"2000106-3-カリン" = "ふう……。"
"2000106-4-カリン" = "あ、先生、来てくれたね。"
"2000106-5-カリン" = "どうしたのかって？うーん。なんて話せばいいのか……。"
"2000106-6-カリン" = "実は友人と、喧嘩してしまって。"
"2000106-7" = "[s1] \"その友人は今、どこの病院にいるの？\"\n[s2] \"……何があったの？\""
"2000106-8-カリン" = "……教室で元気にしてるよ。"
"2000106-9-カリン" = "些細な口喧嘩、というか。"
"2000106-10-カリン" = "誤解しないで。お互い殴り合ったりはしてない。"
"2000106-11-カリン" = "普段私たちはお昼を外で買ってきて、教室で一緒に食べることが多い。"
"2000106-12-カリン" = "でも私は……ちょっと言うのは恥ずかしいのだけど、最近ダイエットをしてたんだ。"
"2000106-13-カリン" = "この前、メイド服を脱いで久しぶりに制服を着たら、あちこち窮屈で……。"
"2000106-14-カリン" = "ただその友人は、ダイエットとかはあまり興味がなくて。"
"2000106-15-カリン" = "急にピザを食べようと言ってきたんだ。"
"2000106-16-カリン" = "そこに、デザートとしてチョコケーキまで買ってこようって言うものだから。"
"2000106-17-カリン" = "別に好き嫌いはないから、いつもなら友人の言う通りにすることが多かったけれど、"
"2000106-18-カリン" = "今日の私は調子も悪かったこともあって、サラダが食べたくて……。"
"2000106-19" = "[s] \"別々に食べればいいんじゃ？\""
"2000106-20-カリン" = "とんでもないことを言わないで、先生。"
"2000106-21-カリン" = "女子高生同士でわざわざご飯を別々に食べるというのは、「あなたは味方じゃない」っていう意思表示も同然。"
"2000106-22" = "[s3] \"まあ……でもそれぐらいのことで、そこまで……。\"\n[s4] \"それは、喧嘩するほどのこと？\""
"2000106-23-カリン" = "うん、私も分かってる。"
"2000106-24-カリン" = "うん、私も分かってる。"
"2000106-25-カリン" = "こういうお互いの意見の違いは、互いに対する尊重だけでも、解決はできると思う。"
"2000106-26-カリン" = "でも私は今まで、ほとんど友人の要求や気持ちに合わせていた。"
"2000106-27-カリン" = "だったらたまには私の言うことを聞いてくれてもいいと思わないか？"
"2000106-28-カリン" = "それが公平さというものではないのか？"
"2000106-29" = "[s5] \"友達同士に必要なのは公平さじゃないと思うよ。\"\n[s6] \"カリンの言うことが正しい、友達が悪い。\"\n[s7] \"それは間違ってる、カリンが悪いよ。\""
"2000106-30-カリン" = "……。"
"2000106-31-カリン" = "はあ。"
"2000106-32-カリン" = "ははっ。"
"2000106-33-カリン" = "そうだね。"
"2000106-34-カリン" = "ちょっと古い気もするけど、そうだね。理解した。"
"2000106-35-カリン" = "そう、友人同士で必要なのは友情、だね。"
"2000106-36-カリン" = "……。"
"2000106-37-カリン" = "ふう。"
"2000106-38-カリン" = "先生、慰めようとして、心にもないことを言ってくれてありがとう。"
"2000106-39-カリン" = "そう言ってくれると、私も悪かったと思えてきた。"
"2000106-40-カリン" = "一緒に食べるってことが大事であって、何を食べるかは大した問題ではないね。"
"2000106-41-カリン" = "……。"
"2000106-42-カリン" = "そうかもね。"
"2000106-43-カリン" = "先生、正直に言ってくれてありがとう。"
"2000106-44-カリン" = "うん、たまには心にも思ってない慰めよりも……。"
"2000106-45-カリン" = "そういう先生らしい言葉の方が、私をもう一歩、成長させてくれるのかもしれない。"
"2000106-46-カリン" = "やっぱり……こうやって悩みを話せる人がいるってことは、嬉しいことだ。"
"2000106-47-カリン" = "謝ってくる。"
"2000106-48-カリン" = "ありがとう先生。おかげで頭も心も、軽くなった。"
"2000106-49-カリン" = "ピザでも買って帰ろう。あ、そうだ、チョコケーキも。"
"2000106-50-カリン" = "あ、それと……。"
"2000106-51-カリン" = "少し考えてみたけど、やっぱり先生と友人にはなれなさそうだ……。"
"2000106-52-カリン" = "へ、変な話じゃない、誤解しないでくれ！"
"2000106-53-カリン" = "えっと、だから友人じゃなくて……。"
"2000106-54-カリン" = "ご主人様、だから……。"
"2000106-55-カリン" = "……ふふっ、冗談だ。"
"2000106-56-カリン" = "ありがとう先生、じゃあお先に失礼する。"
"2000106-57-カリン" = "……また後で。"
