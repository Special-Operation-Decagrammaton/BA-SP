[translation]
"2300605-1" = "百夜堂の看板娘はプロフェッショナル！"
"2300605-2" = "（その後、仕事中もずっとシズコからのメッセージのことが気になってしまい、百夜堂を訪れた）"
"2300605-3" = "[s] \"あっ、シズコ。えっと……。\""
"2300605-4-シズコ" = "こちら、ご注文の饅頭セットです。"
"2300605-5-可愛い物には目がない女子生徒" = "あっ、シズコたーん！私が注文したのは……"
"2300605-6-可愛い物には目がない女子生徒" = "……あれ、饅頭で合ってる。"
"2300605-7-可愛い物には目がない女子生徒" = "……今日は、注文を間違えてない！？"
"2300605-8-シズコ" = "それでは、ごゆっくりどうぞ。"
"2300605-9-可愛い物には目がない女子生徒" = "？？？"
"2300605-10" = "[ns] \"シズコ……？\""
"2300605-11-百夜堂の常連さん" = "あっ、シズコちゃん！危な――"
"2300605-12-百夜堂の常連さん" = "……くない！？"
"2300605-13-百夜堂の常連さん" = "転びそうになった瞬間、シズコちゃんが急にアクロバティックな動きを！？"
"2300605-14-シズコ" = "ああ、すみません。不注意でした。"
"2300605-15-百夜堂の常連さん" = "いつもの愛想が一転、事務的な態度に！？"
"2300605-16-シズコ" = "ご注文はあんみつでしたよね？少々お待ちください。"
"2300605-17-シズコ" = "お待たせしました、どうぞ。"
"2300605-18-百夜堂の常連さん" = "至って普通に、冷静に運んでる！"
"2300605-19-可愛い物には目がない女子生徒" = "なんだか……今日のシズコたん……"
"2300605-20-百夜堂の常連さん" = "正確に注文を受けてて……"
"2300605-21-シズコ" = "えっと、何か問題が？"
"2300605-22-お客さんたち" = "「「「クールで事務的なシズコたんもカッコいい……！」」」"
"2300605-23" = "[s] \"何が起きてるんだろう……。\""
"2300605-24" = "（百夜堂の営業終了時刻が近づいてきた）"
"2300605-25-シズコ" = "はい、それでは本日の営業はこれにて終了です。"
"2300605-26-シズコ" = "今日も百夜堂にお越しいただき、ありがとうございましたー……っと。"
"2300605-27-シズコ" = "……。"
"2300605-28-シズコ" = "……あれ、先生？"
"2300605-29-シズコ" = "いつの間にお越しになってたんです？"
"2300605-30" = "[s1] \"注文を受けに来ないなって思ったら、\"\n[s2] \"やっぱり気づいてなかったんだね。\""
"2300605-31-シズコ" = "す、すみません、私……。"
"2300605-32-シズコ" = "す、すみません、私……。"
"2300605-33-シズコ" = "あっ……"
"2300605-34" = "[s] \"シズコ、大丈夫！？\""
"2300605-35-シズコ" = "はあ、はぁ、はぁ……"
"2300605-36-シズコ" = "う、んぅ……あれ、ここは……？"
"2300605-37" = "[s] \"ごめんね。倒れた後、勝手に部屋に運ばせてもらった。\""
"2300605-38-シズコ" = "た、倒れた？"
"2300605-39-シズコ" = "私……一体何が……？"
"2300605-40" = "[s3] \"多分、過労だと思う。\"\n[s4] \"この間、また別の商店街のお祭りも手伝ってたし……。\""
"2300605-41-シズコ" = "それは……。"
"2300605-42-シズコ" = "それは……。"
"2300605-43-シズコ" = "確かに、最近は百夜堂のお客さんも増えましたし……。"
"2300605-44-シズコ" = "お祭り運営委員会の委員長として、やることも増えていたのは事実ですが……。"
"2300605-45" = "[s] \"あんまり無理しちゃダメだよ。\""
"2300605-46-シズコ" = "でも……。"
"2300605-47-シズコ" = "どれもこれも、全部私がやらなきゃいけないことで……。"
"2300605-48-シズコ" = "蔑ろになんて、できません。"
"2300605-49" = "[s5] \"蔑ろにしないにしても、時には休むことも大事だよ。\"\n[s6] \"少しくらいサボっても大丈夫。\""
"2300605-50-シズコ" = "そんな……。"
"2300605-51-シズコ" = "そんな……。"
"2300605-52-シズコ" = "……先生が、そんなことを言ってもいいんですか？"
"2300605-53" = "[s] \"先生だからだよ。疲れたら休む、眠いなら寝るのが一番。\""
"2300605-54" = "[s7] \"私もこうして、そばにいるから。\"\n[s8] \"私もこうして、手を握ってるから。\""
"2300605-55-シズコ" = "……先生……。"
"2300605-56-シズコ" = "……先生……。"
"2300605-57-シズコ" = "では、少しだけ……。"
"2300605-58-シズコ" = "少しだけ、寝ます……。"
"2300605-59-シズコ" = "先生、それまで……私が眠るまで、そばに……。"
"2300605-60-シズコ" = "…………。"
"2300605-61" = "（そうして、眠りに落ちたシズコのことを静かに見守っていた）"
