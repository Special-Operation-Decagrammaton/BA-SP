[translation]
"1014602-1" = "華麗なる議長の夏"
"1014602-2" = "[log][ruby=はぬま]羽沼[/ruby]マコト議長について[/log]"
"1014602-3" = "[log]どう思いますか？[/log]"
"1014602-4-ゲヘナの生徒A" = "え、誰？"
"1014602-5-ゲヘナの生徒B" = "議長？うちの学園に議会なんてあったっけ？"
"1014602-6" = "[log][ruby=パンデモニウム・ソサエティー] 万魔殿に[/ruby]ついて [/log]"
"1014602-7" = "[log]どう思いますか？[/log]"
"1014602-8-ゲヘナの生徒A" = "そもそも万魔殿って何？"
"1014602-9-ゲヘナの生徒B" = "ほら、あれだよ。#nチアキちゃんとイブキちゃんがいるとこ。"
"1014602-10-ゲヘナの生徒A" = "ああ、そういえばそんなのあったような？"
"1014602-11-ゲヘナの生徒A" = "っていうか、何これ？#n撮られてる？"
"1014602-12-マコト" = "……先生よ。#nこれをどう思う？"
"1014602-13" = "[s1] \"うーん……頑張ってね？\"\n[s2] \"マコト、最近疲れてる？\""
"1014602-14-マコト" = "ん……？#n一体何を……。"
"1014602-15-マコト" = "ああ、勘違いしているのだな。先生。"
"1014602-16-マコト" = "キシシッ！気にするな。#nすべてマコト様の計画通りだ！"
"1014602-17-マコト" = "――政治において、民衆の愚民化は重要だ。"
"1014602-18-マコト" = "無関心であればあるほど、万魔殿とマコト様の権威は高まるというもの！"
"1014602-19-マコト" = "……だが、あまりにも偉大すぎるせいか――"
"1014602-20-マコト" = "マコト様の名前どころか、万魔殿と議長の存在すら忘れられているとは。"
"1014602-21-マコト" = "ああ！才能とはかくも罪なものだ！"
"1014602-22-マコト" = "……そこでだ、先生よ。#nマコト様からの新たな提案だ。"
"1014602-23-マコト" = "今の状況も悪くはないが、やはり認知されてこそだからな。#n畏敬の念は必要だ。"
"1014602-24-マコト" = "万魔殿、ひいてはマコト様の威光をキヴォトス中に広めるためにも――"
"1014602-25-マコト" = "イメージを刷新しようと思ってな！"
"1014602-26-マコト" = "そこで、まずは見た目から変えてみたというわけだ。"
"1014602-27" = "[s3] \"だから水着なんだね！\"\n[s4] \"やっと分かった。\""
"1014602-28-マコト" = "キキッ！先生は話が早くて助かるな。"
"1014602-29-マコト" = "良いだろう？この水着――#nマコト様も実に気に入っている。"
"1014602-30-マコト" = "一流のデザイナーに最高級の生地を使って作らせた逸品だ。"
"1014602-31-マコト" = "親しみの持てる雰囲気を持ちつつも、威厳のある指導者の気品を感じるだろう？"
"1014602-32-マコト" = "……こうして水着を準備したところまでは良かったのだが。"
"1014602-33-マコト" = "問題は、ここからだ。"
"1014602-34-マコト" = "このマコト様の上品な姿を、どうすればゲヘナ生に印象づけられるのか……。"
"1014602-35-マコト" = "無理強いなど言語道断。#nそれに、この姿で校内を歩き回るなど、もってのほか！"
"1014602-36-マコト" = "あくまで偶発的に――自然に姿を見せ、#n「あの素敵な方はどなた！？」と話題にさせるのだ！"
"1014602-37" = "[s5] \"……水泳の授業に参加するとか？\"\n[s6] \"プールや海に行くとか……？\""
"1014602-38-マコト" = "それは無理だ！"
"1014602-39-マコト" = "それでは、マコト様が泳げないことがバレてしまうではないか！"
"1014602-40-マコト" = "ぐああっ！！！言ってしまった！！！"
"1014602-41-マコト" = "……くううっ、これが誘導尋問か。#nやはり先生はただ者ではないな。"
"1014602-42-マコト" = "いや、先生に非は無い。#n気を抜いてしまった私の過ちだ。"
"1014602-43-マコト" = "だが、知られた以上――話すしかあるまい。"
"1014602-44-マコト" = "このマコト様にとって水泳というのは――#n2つしかない弱点のうちの1つなのだ。"
"1014602-45" = "[s7] \"……泳げるようになりたいの？\"\n[s8] \"教えてもらいたいとか？\""
"1014602-46-マコト" = "ん？そんなことは言ってないぞ？"
"1014602-47-マコト" = "今後も水泳を習うことはないだろう。"
"1014602-48-マコト" = "そもそも……泳ぐという行為は矛盾しているじゃないか。"
"1014602-49-マコト" = "人は水中で呼吸できない！#nつまり、水の中に深く入るということは、生命を脅かす危険行為に他ならないのだ！"
"1014602-50-マコト" = "わざわざ好んで水中に潜り、それを楽しもうとは！#nつくづく理解ができない。"
"1014602-51-マコト" = "というわけで、泳ぐ姿を見せるのは却下だ！"
"1014602-52-マコト" = "泳がずとも、このマコト様の魅力的な水着姿はゲヘナ生を虜にするだろう！"
"1014602-53-マコト" = "それに……シャーレの先生なら、きっと素晴らしい策を持っているのではないか？"
"1014602-54" = "[s9] \"ぷ、プレッシャーがすごい！\"\n[s10] \"急に難易度が上がったような！？\""
"1014602-55-マコト" = "もちろん、今すぐ答えろというつもりはない。"
"1014602-56-マコト" = "急な話だ。#n先生にも考える時間が必要だろう。"
"1014602-57-マコト" = "良い案が浮かんだら、すぐにでも連絡してくれ。"
"1014602-58-マコト" = "用件は以上だ。"
"1014602-59-マコト" = "ああ……そうだ。"
"1014602-60-マコト" = "お互いの認識をすり合わせるためにも必要だから……。"
"1014602-61-マコト" = "あえて聞くのだが――"
"1014602-62-マコト" = "先生は、マコト様の水着姿をどう思う？"
"1014602-63" = "[s11] \"よく似合ってるよ。\"\n[s12] \"上品で素敵だね。\""
"1014602-64-マコト" = "キキキッ！そうだろうとも！"
"1014602-65-マコト" = "流石は先生、このマコト様が見込んだだけはある。確かな審美眼だな。"
"1014602-66" = "[s13] \"まあ、水着姿でなくても。\"\n[s14] \"マコトは綺麗だよ。\""
"1014602-67-マコト" = "……そ、そうか。"
"1014602-68-マコト" = "というか……それでは参考にならないだろう。当然すぎる話だ。"
"1014602-69-マコト" = "と、とにかく！"
"1014602-70-マコト" = "良い案が浮かんだら、連絡するように！以上だ！"
"1014602-71" = "（その後、珍しく恥ずかしがるマコトに部屋を追い出されてしまった）"
