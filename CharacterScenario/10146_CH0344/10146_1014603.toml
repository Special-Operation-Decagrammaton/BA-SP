[translation]
"1014603-1" = "慌てる議長の夏"
"1014603-2" = "（マコトから連絡をもらって、万魔殿に向かっていると……）"
"1014603-3-？？？" = "えっと……私たちにどうしろって言うんですか！！"
"1014603-4-万魔殿のメンバー" = "だから、今伝えた通り、解散するように。"
"1014603-5-万魔殿のメンバー" = "広場を占拠して軍事訓練だなんて……デモでもするつもりなのか？"
"1014603-6-風紀委員" = "だから、訓練の許可申請をしたんですけど……。"
"1014603-7-風紀委員" = "さっき[ruby=パンデモニウム・ソサエティー]、万魔殿に[/ruby]許可申請をしろって言ってましたよね？"
"1014603-8-万魔殿のメンバー" = "そうだが……。"
"1014603-9-万魔殿のメンバー" = "こうも反抗的な態度をとっている風紀委員を見過ごすわけにはいかない。#n広場での訓練はやめてもらおう。"
"1014603-10-風紀委員" = "あんた達の議長が訓練場所をここに指定したんじゃない！！"
"1014603-11-風紀委員" = "そっちの指定に従ったら許可を出せないってどういうこと！？"
"1014603-12-万魔殿のメンバー" = "不満があるなら、議長に直接言うんだな。"
"1014603-13-風紀委員" = "ほんっと……何なの？"
"1014603-14" = "（……騒がしい広場を後にして、万魔殿へ向かった）"
"1014603-15-マコト" = "……水着モデルをすればいい！"
"1014603-16-マコト" = "そうすれば、陸にいながらこの姿を披露できるという算段だ！"
"1014603-17-マコト" = "どうだ？素晴らしい案だろう？キキッ！"
"1014603-18-マコト" = "……ん？先生、どうしたんだ？"
"1014603-19-マコト" = "さっきから心ここにあらずといった様子だが……。"
"1014603-20" = "[s1] \"実はさっき……。\"\n[s2] 広場で起きたことを説明する。"
"1014603-21-マコト" = "ふむ。"
"1014603-22-マコト" = "マコト様が見ていなくても、我々万魔殿はちゃんと働いているようだな！"
"1014603-23-マコト" = "ん？どうした、先生？"
"1014603-24" = "[s3] \"いや、今更だけど……。\"\n[s4] \"本当に風紀委員会が嫌いなんだなと思って……。\""
"1014603-25-マコト" = "……先生がそんなことを言うとは。"
"1014603-26-マコト" = "いや、先生だからこそ分からないのか？"
"1014603-27-マコト" = "別に私だけが、風紀委員会を嫌っているわけじゃない。"
"1014603-28-マコト" = "そうだとも――[ruby=・   ・   ・]私だけ[/ruby]ではないのだ。"
"1014603-29-マコト" = "そもそも、風紀委員を好む理由があるのか？"
"1014603-30-マコト" = "断言しよう！ゲヘナの全生徒に同じ質問を投げかけたとしても、#n皆一様に口を閉ざすだろう！"
"1014603-31-マコト" = "なぜなら、やつらの「風紀を正す」という行為が、抑圧に過ぎないからだ。"
"1014603-32-マコト" = "個人の自由を抑圧し、秩序を押しつける。"
"1014603-33-マコト" = "なぜ、そうする必要がある？#n本当にゲヘナは、そうしなければならないほど問題児だらけなのか？"
"1014603-34-マコト" = "否――そんなことをしなくとも、ゲヘナは問題ない。"
"1014603-35-マコト" = "取り締まり、逮捕、処罰……これのどこが学園のためになるというのだ！"
"1014603-36-マコト" = "ただの偽善ではないか！#nいや、自己満足で他人に犠牲を強いるなど、悪質としか言いようがない。"
"1014603-37-マコト" = "風紀委員会こそ「正す」必要があるのではないか？"
"1014603-38-マコト" = "はぁ……つまらぬことを語ってしまったな。"
"1014603-39-マコト" = "あいつらに関して話したところで、不毛なだけだ。"
"1014603-40" = "[s5] \"そっか……正直に話してくれて、ありがとう。\"\n[s6] \"いろいろと考えているんだね。\""
"1014603-41-マコト" = "……こんなことを話すのは、先生くらいなものだぞ。"
"1014603-42-マコト" = "生徒に考えさせたところで意味はない！"
"1014603-43-マコト" = "考え始めた途端に体制へ疑問を抱くようになり――#nひいては万魔殿を脅かすことになるからな！キシシッ！"
"1014603-44" = "[s7] \"いつものマコトで安心したよ！\"\n[s8] \"そのままのマコトでいて……。\""
"1014603-45-マコト" = "それは、どういう……？"
"1014603-46-マコト" = "あー！もう我慢できない！！#n我慢なんかするもんか！！"
"1014603-47-風紀委員" = "本当に毎度毎度……こっちにも我慢の限界ってものがあるのよ！"
"1014603-48-風紀委員" = "議長に直接言え？ええ、分かったわよ！"
"1014603-49-風紀委員" = "万魔殿の議長、出てきなさい！"
"1014603-50-風紀委員" = "――私と勝負だ！"
"1014603-51-マコト" = "なにぃ！？風紀委員が、こんなところにまで……！？"
"1014603-52-マコト" = "親衛隊！何をしている！#n早くあいつをつまみ出せ！"
"1014603-53-マコト" = "……そういえば、親衛隊には風紀委員の対応をさせていたんだったな？"
"1014603-54-マコト" = "ということは……あいつをつまみ出せるのは……？"
"1014603-55-風紀委員" = "マコト議長！！お覚悟！"
"1014603-56-マコト" = "ちょ、ちょっと待ってくれ！！"
"1014603-57" = "[ns] \"二人とも落ち着いて。\""
"1014603-58-風紀委員" = "せ、先生？"
"1014603-59" = "[s9] \"状況は分かってる。\"\n[s10] \"私に手伝わせてもらえないかな？\""
"1014603-60" = "[ns11] \"イライラするだろうけど……。\"\n[ns12] \"感情的になっても、状況は良くならないよ。\""
"1014603-61-風紀委員" = "でも！"
"1014603-62-風紀委員" = "……はぁ、そうですね。"
"1014603-63-風紀委員" = "ですが、どうすればいいんですか。#n委員長も行政官も出払ってて……。"
"1014603-64" = "[ns13] \"マコト、ちょっとお願いしてもいいかな？\"\n[ns14] \"私の顔を立てると思って。\""
"1014603-65-マコト" = "あ、ああ。訓練の件だな？"
"1014603-66-マコト" = "これ以上口出しはしない。約束しよう。"
"1014603-67-マコト" = "であれば問題ないだろう？"
"1014603-68-風紀委員" = "……まあ、カッとなってここまで来ちゃったけど。#n本当にめちゃくちゃにするつもりはなかったし……。"
"1014603-69-風紀委員" = "はぁ……失礼しました。"
"1014603-70-マコト" = "…………。"
"1014603-71" = "[s] \"マコト、ごめんね。\""
"1014603-72-マコト" = "ん？先生、なぜ謝る？"
"1014603-73" = "[s15] \"さっき私が言ったことで……。\"\n[s16] \"二人に譲歩させちゃったよね。\""
"1014603-74" = "[ns] \"マコトが嫌なやり方だったと思うし。\""
"1014603-75-マコト" = "……ああ、その通りだ。"
"1014603-76-マコト" = "先生は、不当な扱いを受けた風紀委員の怒る自由を奪い、この私にも妥協案を出すよう押しつけた。"
"1014603-77-マコト" = "それは、まさにこのマコト様が嫌う、風紀委員会の「やり方」だ。"
"1014603-78-マコト" = "しかし、不思議と不快感はない……どういうことだ？"
"1014603-79-マコト" = "申し訳ない。今日は、ここまでとさせてもらえるだろうか。"
"1014603-80-マコト" = "少し、頭の整理をする時間が欲しい。"
"1014603-81" = "（そうして思索にふけるマコトを残し、万魔殿を後にした）"
