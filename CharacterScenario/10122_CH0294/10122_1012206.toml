[translation]
"1012206-1" = "歩み始めた私から……"
"1012206-2" = "（なんだかいつもと様子が違うミカを探しに行った）"
"1012206-3" = "[ns] \"こっちかな……？\""
"1012206-4-？？？" = "ふへへぇ……へへ。"
"1012206-5" = "[ns] \"ミカ……？\""
"1012206-6-ミカ" = "あ……。"
"1012206-7-ミカ" = "せんせぇ～だあぁ～えへへ～ "
"1012206-8-ミカ" = "本当にぃ……来てくれたんだねぇ～"
"1012206-9-ミカ" = "私ねえ、ここれぇ、座ってただけらよぉ～うぅん……。"
"1012206-10" = "[ns] \"ん？どうしたの……？\""
"1012206-11-ミカ" = "おいひくてとまらなくなっちゃっらぁ。なんはい飲んらかなぁ……。"
"1012206-12-ミカ" = "ちょっと～考え事もあっらひぃ？"
"1012206-13-ミカ" = "先生も、ろむ～？"
"1012206-14-ミカ" = "あははっ。隣に座っれすわっれぇ～"
"1012206-15" = "[ns] （ミカの隣に座る）"
"1012206-16-ミカ" = "あははぁ……となり座ってくれたぁ……。"
"1012206-17" = "[ns1] \"なにか、話したいことがあるんでしょ？\"\n[ns2] \"なんでも聞くよ。\""
"1012206-18-ミカ" = "あ……。"
"1012206-19-ミカ" = "へへぇ～……ご名答ぉ……。"
"1012206-20-ミカ" = "じゃぁ～話しちゃおっかな～？"
"1012206-21-ミカ" = "……ちょっと、考えてみたんら。"
"1012206-22-ミカ" = "昔はれぇ～？わらひ、お姫様らったんらよぉ？"
"1012206-23-ミカ" = "あはは～うそじゃないって、ほんとらよぉ……？"
"1012206-24-ミカ" = "欲しいものはなんれも手に入ったし、好き勝手してたのぉ～"
"1012206-25-ミカ" = "みん～な言うこと聞いてくれてへぇ～"
"1012206-26-ミカ" = "パテル分派でもそうれ……ひょのまま、ティーパーティーにも選ばれたりねぇ……。"
"1012206-27-ミカ" = "ぜ～んぶ、当たり前のことらとおもっへふぁのぉ……。"
"1012206-28-ミカ" = "えへへぇ……わらひはかんぺきで、みんなが認めるすごい子なんらってぇ……。"
"1012206-29-ミカ" = "うぅぅ……。"
"1012206-30" = "[ns] \"……。\""
"1012206-31-ミカ" = "ほんと、バカだったなあ。 "
"1012206-32-ミカ" = "取り返しがつかないことをして……罰を受けて……。"
"1012206-33-ミカ" = "その後も……。"
"1012206-34-ミカ" = "へへ、だからぁ……。"
"1012206-35-ミカ" = "いつもキラキラして～ちやほやされてたティーパーティーのお姫様は……ち～っともわかっれなかったんらぁ。"
"1012206-36-ミカ" = "「ほんとの私」は良い子じゃないし、ちっとも素敵じゃないのにれぇ～……。"
"1012206-37-ミカ" = "腹黒くて、自分が良ければそれでいい、とっても悪い子。"
"1012206-38-ミカ" = "それが……私だったんだよね……。"
"1012206-39-ミカ" = "なんで、いつもめちゃくちゃにしちゃうんだろう……。"
"1012206-40-ミカ" = "なんで……なんでなの……？"
"1012206-41" = "[ns] \"それで悩んでたんだね。\""
"1012206-42-ミカ" = "うん……。"
"1012206-43-ミカ" = "最近は、一人になると、こんなことばっかり考えちゃう……。"
"1012206-44" = "[s3] \"たしかに、話しづらいよね。\"\n[s4] \"いつもと違う空気でもないと。\""
"1012206-45-ミカ" = "あ、あれ……？"
"1012206-46" = "[s] \"飲んでるの、ジュースでしょ？\""
"1012206-47-ミカ" = "う、うぅ……。"
"1012206-48-ミカ" = "ど、どうしよ～！すっごく恥ずかしい！！"
"1012206-49-ミカ" = "もう、先生の顔見れないよ～！！"
"1012206-50" = "[s] \"いつものテンションだと、話しづらかったんだよね。\""
"1012206-51-ミカ" = "ちょ、ちょっと聞いて先生！？こういう雰囲気だと腹を割って話せる～とかって言うでしょ！？"
"1012206-52-ミカ" = "その……こんなこと、話すの怖かったから……。"
"1012206-53-ミカ" = "そ、それで、大人の真似しちゃおうかな……って。"
"1012206-54" = "[ns5] \"無理にそんなことしなくても、大丈夫。\"\n[ns6] \"今のミカなら、素直に気持ちを伝えられるでしょ？\""
"1012206-55-ミカ" = "……うん。"
"1012206-56-ミカ" = "もう……黒歴史確定だよ……ううぅ。"
"1012206-57-ミカ" = "……。"
"1012206-58-ミカ" = "バカみたい……。"
"1012206-59-ミカ" = "先生にも、みんなにも――"
"1012206-60-ミカ" = "ずっと迷惑かけっぱなしなんだろうな……。"
"1012206-61-ミカ" = "私ね、きっと他の子にとって普通のことができないんだよ。#nそれで、変なことばっかりして……。"
"1012206-62" = "[s7] \"ミカはよく頑張ってると思う。\"\n[s8] \"今は自分を見つめ直す、大事な時期なんだよ。\""
"1012206-63-ミカ" = "え、ええっ？"
"1012206-64-ミカ" = "頑張ってる……？"
"1012206-65-ミカ" = "自分を見つめ直すのが、大事……。"
"1012206-66-ミカ" = "こんなに悩んで、バカみたいって思ってたけど……。"
"1012206-67-ミカ" = "無駄じゃない……のかな？"
"1012206-68" = "[s] \"前に進むための、大事な一歩だよ。\""
"1012206-69-ミカ" = "前に進むための……。"
"1012206-70-ミカ" = "大事な……一歩……。"
"1012206-71-ミカ" = "まだ、ちょっとわかんないかも……。"
"1012206-72-ミカ" = "でも……。"
"1012206-73-ミカ" = "先生が、私のために――"
"1012206-74-ミカ" = "言ってくれた言葉だから……。"
"1012206-75-ミカ" = "これからも、もう少しだけ悩んでみようかな。"
"1012206-76" = "[s9] \"その気持ちを大事にしよう。\"\n[s10] \"そうやって悩んだ時間が……これからのミカを支えてくれる。\""
"1012206-77-ミカ" = "……。"
"1012206-78-ミカ" = "うん、忘れないね……。"
"1012206-79-ミカ" = "ずっと……悩んでみる……。"
"1012206-80-ミカ" = "……先生に話せて、よかった。"
"1012206-81-ミカ" = "あれ、なんかほっとしたら……眠くなっ……ちゃっ……。"
"1012206-82" = "[s] \"……あれ？\""
"1012206-83-ミカ" = "うぅぅん……。"
"1012206-84-ミカ" = "……。"
"1012206-85" = "[ns11] \"……。\"\n[ns12] \"……ミカ？\""
"1012206-86" = "（眠ってしまったミカをおんぶして、部屋まで運んだ……）"
