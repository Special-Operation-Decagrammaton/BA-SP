[translation]
"1012205-1" = "浜辺に光るもの"
"1012205-2" = "（海風を浴びに、浜辺を訪れた）"
"1012205-3" = "[ns] \"ミカ？何してるの？\""
"1012205-4-ミカ" = "あ、先生！！"
"1012205-5-ミカ" = "ふふふ、じゃじゃーん☆"
"1012205-6" = "[ns] \"これは……貝殻？\""
"1012205-7-ミカ" = "そうそう！可愛くない？"
"1012205-8-ミカ" = "割れちゃってるのばっかりだけど……中にはこんな綺麗なのもあるんだよ！"
"1012205-9-ミカ" = "ロマンチックだよね～"
"1012205-10-ミカ" = "たくさん集めて、首飾りにしちゃおっかな☆"
"1012205-11" = "[s] \"ミカはアクセサリーが好きだもんね。\""
"1012205-12-ミカ" = "そうだね……可愛いものをたくさん集めてたなぁ。"
"1012205-13-ミカ" = "……今はあんまり残ってないんだけどね。"
"1012205-14-ミカ" = "それに、新しいのもあんまり買ってないんだ。#nちゃんと節約してるから！"
"1012205-15-ミカ" = "家計簿アプリだって入れてるんだよ？"
"1012205-16" = "[s] \"偉すぎる……！\""
"1012205-17-ミカ" = "ふっふっふ……でしょ～？"
"1012205-18-ミカ" = "……コツコツやるのは、ちょっと苦手なんだけどね。"
"1012205-19-ミカ" = "この前なんて、まとめてたレシートがどっか行っちゃって……。"
"1012205-20-ミカ" = "でも、なんとかちゃんと記録してるんだ。"
"1012205-21" = "[s1] \"十分偉いよ。\"\n[s2] \"私も、ミカを見習わないと……！\""
"1012205-22-ミカ" = "えへへ、先生に褒められちゃった！"
"1012205-23-ミカ" = "あっ！綺麗な子みっけ☆"
"1012205-24-ミカ" = "このサザエ、「メルジェラ」のイヤリングにそっくり！"
"1012205-25-ミカ" = "昔、お気に入りだったんだよね～！ラッキー☆"
"1012205-26-ミカ" = "本物のブランド品には敵わないかもだけど……。"
"1012205-27-ミカ" = "貝殻も綺麗だよね。"
"1012205-28" = "[s] \"うん、とっても綺麗だね。\""
"1012205-29-ミカ" = "あはは、それって私のこと？なんちゃって☆"
"1012205-30" = "[ns] \"ミカ、なんだか楽しそう。\""
"1012205-31-ミカ" = "うん？"
"1012205-32" = "[ns] \"なんていうか、前よりのびのびしてる。\""
"1012205-33-ミカ" = "ええ～何それ。"
"1012205-34-ミカ" = "のびのび……？"
"1012205-35-ミカ" = "うーん……。"
"1012205-36-ミカ" = "余裕、あるのかなあ……？"
"1012205-37-ミカ" = "……。"
"1012205-38" = "[ns] \"ミカ……？\""
"1012205-39-ミカ" = "うーん、えっと……。"
"1012205-40-ミカ" = "ま、色々あったからね！"
"1012205-41-ミカ" = "そう、色々……。"
"1012205-42-ミカ" = "……。"
"1012205-43-ミカ" = "先生！あっち行ってみない？貝殻たくさんありそう！"
