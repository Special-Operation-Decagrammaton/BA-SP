[translation]
"1012209-1" = "もう、大丈夫"
"1012209-2-ミカ" = "……あ、先生。"
"1012209-3" = "[s] \"おはよう。\""
"1012209-4-ミカ" = "なんだか恥ずかしくなってきちゃったな……。"
"1012209-5-ミカ" = "あ、あそこ座ろ！？"
"1012209-6" = "（浜辺に座ると、ミカはごそごそと弁当を取り出した）"
"1012209-7-ミカ" = "サンドイッチを作ってみたんだけど……。"
"1012209-8-ミカ" = "味も……いや……うん、大丈夫だと思うよ！"
"1012209-9-ミカ" = "あ、開けるね……？"
"1012209-10" = "[s] \"さて、ミカのサンドイッチは……！\""
"1012209-11-ミカ" = "えいっ！！"
"1012209-12-ミカ" = "大切なのは味って言うでしょ？……言うよね？"
"1012209-13-ミカ" = "きっと美味しいから――"
"1012209-14-ミカ" = "……。"
"1012209-15-ミカ" = "れ、レシピ通りにやってみたんだよ……？"
"1012209-16" = "[ns] \"ミカの頑張りが伝わってくるよ。\""
"1012209-17-ミカ" = "えへへ……食べてみて！"
"1012209-18" = "（サンドイッチを一つ取った）"
"1012209-19" = "[ns] \"いただきます！\""
"1012209-20-ミカ" = "じゃ、私も……。"
"1012209-21" = "[ns] \"ちょっと、個性的な味かも……。\""
"1012209-22-ミカ" = "……。"
"1012209-23-ミカ" = "あれっ？"
"1012209-24-ミカ" = "な、なんで……？ちゃんとレシピ通りにやったんだよ……？"
"1012209-25-ミカ" = "マヨネーズがないから、オイスターソースを入れたり――"
"1012209-26-ミカ" = "ピクルスは苦手だから、ちょっとだけにして――"
"1012209-27-ミカ" = "夏は塩分が不足しがちって聞いたから、お塩をたくさん入れて、あとお砂糖も多めに……。"
"1012209-28" = "[s] \"これは……ミカのオリジナルレシピだね！\""
"1012209-29-ミカ" = "だ、だって～！絶対美味しくなるって思ったんだも～ん！"
"1012209-30-ミカ" = "せ、先生！？美味しくないなら無理に食べなくても……！"
"1012209-31-ミカ" = "え？"
"1012209-32-ミカ" = "真心が感じられて、美味しい……？"
"1012209-33-ミカ" = "うぅぅ……。"
"1012209-34-ミカ" = "ごめんね……美味しいサンドイッチになるはずだったんだけど……。"
"1012209-35" = "[s] \"その気持ちが嬉しいんだよ。ありがとう、ミカ。\""
"1012209-36-ミカ" = "……えへへ。"
"1012209-37-ミカ" = "ありがと、先生。"
"1012209-38-ミカ" = "あれ、私……。"
"1012209-39-ミカ" = "ちょっとだけ……変わったかも？"
"1012209-40-ミカ" = "前は失敗しちゃったら、悔しくてずっと落ち込んでたのに――"
"1012209-41-ミカ" = "今は……そんなじゃないかも……？"
"1012209-42-ミカ" = "次は美味しく作ろう！って……思ってる。"
"1012209-43" = "[s] \"ちょっとだけ前向きになったね。\""
"1012209-44-ミカ" = "そ、そうかな？"
"1012209-45-ミカ" = "いつも先生が一緒にいてくれるから、かもね。"
"1012209-46-ミカ" = "サンドイッチも美味しく食べてくれたし、えへへ。"
"1012209-47-ミカ" = "……。"
"1012209-48-ミカ" = "ちょっと思ったんだ。すっごく素敵で完璧な、良い子じゃなくてもいいのかなって……。"
"1012209-49-ミカ" = "いつも不器用で、失敗して、今回も手が傷だらけになっちゃったけど……。"
"1012209-50-ミカ" = "それでもいい……んだよね？"
"1012209-51" = "[ns1] \"もちろん。\"\n[ns2] \"大丈夫に決まってるよ。\""
"1012209-52-ミカ" = "……うんっ！！"
"1012209-53-ミカ" = "これからもずっと、ずっと――"
"1012209-54-ミカ" = "よろしくね、先生。"
