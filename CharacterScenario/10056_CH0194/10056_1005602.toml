[translation]
"1005602-1" = "サンタのセリナ"
"1005602-2" = "お姉ちゃん、プレゼントー！"
"1005602-3" = "私も、私も！"
"1005602-4" = "私が先だよ！私が先に来たんだもん！"
"1005602-5" = "ふふっ、大丈夫ですよ。"
"1005602-6" = "プレゼントは沢山ありますので、安心してください。"
"1005602-7-セリナ" = "あ、先生。いらしてたんですね。"
"1005602-8" = "[s1] \"お待たせ、セリナ。\"\n[s2] \"もしかして、今は……？\""
"1005602-9-セリナ" = "子どもたちにプレゼントを配っていました。"
"1005602-10-子供たち" = "あっ、お姉ちゃん！この子横入りしたー！悪い子！#n悪い子はプレゼント貰えないんでしょ？"
"1005602-11-セリナ" = "あ、あはは……#n横から割り込むのは良くないですよ。"
"1005602-12-セリナ" = "順番に並ぶというのは、人に優しくすることなんです。"
"1005602-13-子供たち" = "ちゃんと並んだら、プレゼントをもらえる？"
"1005602-14-セリナ" = "はい、もちろん！"
"1005602-15-子供たち" = "じゃあ、ちゃんと並ぶ！"
"1005602-16" = "[ns] \"さすがはセリナ……。\""
"1005602-17-セリナ" = "いえいえ、これは救護騎士団のチャリティー活動の一部でもあるので。"
"1005602-18-セリナ" = "ですが、そうやって褒められると少し恥ずかしいですね……。"
"1005602-19-セリナ" = "優しい上に謙虚……？#nそ、そんな。"
"1005602-20-セリナ" = "これくらい、当然です。#n私は救護騎士団なんですから。"
"1005602-21" = "それに……#n今日は特別な日ですし。"
"1005602-22" = "たとえ年に1日だけでも、誰かが誰かのために願い……優しい気持ちになれるのなら。"
"1005602-23" = "そのために、頑張りたいと思えるんです。"
"1005602-24-セリナ" = "サンタを信じる子供たちの夢を守ることも……#n私のするべきことの一つでもありますから。"
"1005602-25-子供たち" = "ねーねー、サンタさんってお髭の人じゃないの？"
"1005602-26-子供たち" = "そうだよ！#nお髭の人って聞いた！"
"1005602-27-子供たち" = "ねー、お髭の人はー？"
"1005602-28-子供たち" = "お姉ちゃん、お髭の人はどこ行ったの？"
"1005602-29-セリナ" = "えっ、えっ？"
"1005602-30-セリナ" = "そ、それは……。"
"1005602-31" = "[s3] \"今日はサンタさんが忙しくてね……。\"\n[s4] \"代わりにこの、サンタのお姉さんが来たんだよ。\""
"1005602-32-セリナ" = "な、なるほど……？"
"1005602-33-セリナ" = "えっと、そ、そんな感じです。"
"1005602-34-セリナ" = "あらためまして、サンタのお姉さんです。"
"1005602-35-セリナ" = "みなさん、今まで良い子にしてましたね。#nでは、プレゼントをあげましょう。"
"1005602-36-セリナ" = "ちゃんと並んでる子からかな～？"
"1005602-37-子供たち" = "はい！はい！"
"1005602-38-子供たち" = "今度は割り込んでない……ちゃんと並んだよ！"
"1005602-39-子供たち" = "悪い子でも、頑張って良い子になったら、サンタさん来てくれる……？"
"1005602-40-セリナ" = "ふう、お疲れ様でした。先生。"
"1005602-41" = "[s] \"セリナの方こそ。\""
"1005602-42-セリナ" = "い、いえいえ、これくらいでしたら全然。"
"1005602-43-セリナ" = "大変ですが、やり甲斐もありますし。"
"1005602-44" = "[s5] \"お疲れ様、サンタさん。\"\n[s6] \"お疲れ様でした、サンタのお姉さん。\""
"1005602-45-セリナ" = "もう、先生まで……。"
"1005602-46-セリナ" = "えっと、忘れ物は……救援物資も入ってるし……。"
"1005602-47-セリナ" = "……？あ、あはは……まあ救援物資は、今日は出番がなくて良かったです。"
"1005602-48-セリナ" = "救急薬を持ち歩くサンタというのも、#n悪くないと思いませんか？"
"1005602-49" = "[s] \"確かに。ところで、セリナはサンタって……。\""
"1005602-50-セリナ" = "ああ、えっと……。#n実は、救護騎士団に入る前までは、信じてましたね……。"
"1005602-51-セリナ" = "や、やっぱり変ですかね……！？"
"1005602-52-セリナ" = "そ、そんなに変じゃないです……？"
"1005602-53-セリナ" = "あ、ありがとうございます……。#nすみません、何だか先生相手だとものすごく素直に口から出てしまい……。"
"1005602-54-セリナ" = "救護騎士団に入ってから、#n私は色々な面で変わりました。"
"1005602-55-セリナ" = "多くのことを知ったんです……#nサンタさんの正体も含めて。"
"1005602-56" = "[s] \"……がっかりした？\""
"1005602-57-セリナ" = "ふふっ、どうでしょう？"
"1005602-58-セリナ" = "少しは、気落ちしたところもあったかもしれませんが……。"
"1005602-59-セリナ" = "今はこうしてサンタになれて、みんなの夢を支えられて……"
"1005602-60-セリナ" = "これはこれで、とっても嬉しいんです。"
"1005602-61-セリナ" = "あれ？"
"1005602-62-セリナ" = "先生、雪です！"
"1005602-63-セリナ" = "ホワイトクリスマスですよ！"
"1005602-64-セリナ" = "は、はくしゅんっ……！"
"1005602-65-セリナ" = "うう、ちょっと寒いですね……。"
"1005602-66" = "[wa:400]― せ、先生？"
"1005602-67" = "― このマフラーを……[wa:1500]私に？"
"1005602-68" = "― で、[wa:1000]でも……"
"1005602-69" = "[wa:200]― 今日の私は[wa:1100]サンタさんですよ。"
"1005602-70" = "[wa:1000]― 本当は、[wa:1200]私が"
"1005602-71" = "― プレゼントを渡すほうなのに……"
"1005602-72" = "[wa:100]― 先生からいただけるだなんて……"
"1005602-73" = "[wa:200]― えっ、[wa:1600]サンタさんにも"
"1005602-74" = "― ご褒美があってもいい……？"
"1005602-75" = "[wa:1400]― そう[wa:1500]おっしゃるなら……"
"1005602-76" = "― ふふっ。"
"1005602-77" = "[wa:1100]― ありがとうございます、"
"1005602-78" = "― 大切にしますね。"
"1005602-79-セリナ" = "マフラー……暖かいですね。"
"1005602-80-セリナ" = "迷惑をかけてしまったようで、#n申し訳ない気持ちもありますけど……。"
"1005602-81-セリナ" = "あの、先生。"
"1005602-82-セリナ" = "もう少し……#nそばにいてくれませんか？"
"1005602-83-セリナ" = "せっかくなので、今夜は……。"
