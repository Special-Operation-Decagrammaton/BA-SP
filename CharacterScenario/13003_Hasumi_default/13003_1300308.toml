[translation]
"1300308-1" = "短いけれど贅沢な"
"1300308-2" = "トリニティ・別館"
"1300308-3-ハスミ" = "ふう……。"
"1300308-4-ハスミ" = "あれ、先生？"
"1300308-5-ハスミ" = "夜遅くまでお疲れ様でした、今からお帰りですか？"
"1300308-6-ハスミ" = "ええ、はい。私も委員会で必要な、重要書類の作業が中々終わらなくって……。"
"1300308-7-ハスミ" = "ですが、先ほど何とか終わりました。"
"1300308-8-ハスミ" = "報告書は結局のところ、誰かの労力を対価に完成するものなのですよね……。"
"1300308-9" = "[s] \"お疲れ様。\""
"1300308-10-ハスミ" = "ありがとうございます。先生も、お疲れ様でした。"
"1300308-11-ハスミ" = "ふう……夜中まで作業していると肩が凝りますね。"
"1300308-12-ハスミ" = "一緒に帰りましょう。遅いので、私がエスコートいたします。"
"1300308-13" = "（ゴロゴロゴロ……ドカーーン！！）"
"1300308-14-ハスミ" = "……あら。"
"1300308-15-ハスミ" = "雨が降りそうですね。"
"1300308-16-ハスミ" = "先生、走りましょう！"
"1300308-17" = "（ザアーーーーー）"
"1300308-18-ハスミ" = "あ……さらに強くなってきましたね。"
"1300308-19-ハスミ" = "どこか、雨宿りできそうなところは……。"
"1300308-20" = "[s] \"公園に行こう。\""
"1300308-21-ハスミ" = "公園ですか？"
"1300308-22-ハスミ" = "あ……そうですね、あそこなら……。"
"1300308-23" = "（以前ハスミと一緒に夕暮れを見た公園へ向かった）"
"1300308-24" = "[ns] \"ここで雨宿りしよう。\""
"1300308-25" = "はい、ここなら……大丈夫そうですね。"
"1300308-26" = "― ああ、[wa:1500]全身びしょ濡れになってしまいましたね。[wa:2500]困りました。"
"1300308-27" = "― うーん、[wa:1500]雨、[wa:1500]すぐには止みそうにないですね。"
"1300308-28" = "― 二人でどうすることもできず、[wa:2500]足止めされてしまいましたね？"
"1300308-29" = "― ふふ、[wa:1500]このようなことは予想していなかったのですが。"
"1300308-30" = "[wa:3500]― 少しくらいなら……[wa:2000]このような時間もいいでしょう。"
"1300308-31" = "― ……贅沢ですが、[wa:2500]私にとっては[wa:1500]大切な時間です。"
"1300308-32" = "（雨は朝方になって、ようやく止んだ）"
"1300308-33" = "……。"
"1300308-34" = "[s] ハスミを起こす。"
"1300308-35-ハスミ" = "ん……。"
"1300308-36-ハスミ" = "私、寝てしまっていましたか？失礼しました……。"
"1300308-37-ハスミ" = "最近、残業が多かったせいでしょうか……。"
"1300308-38-ハスミ" = "……。"
"1300308-39-ハスミ" = "……徐々に明るくなってきていますね。"
"1300308-40" = "[s] \"大丈夫？\""
"1300308-41-ハスミ" = "はい、大丈夫です。寮には残業すると伝えてありますので……特に心配はないと思います。"
"1300308-42-ハスミ" = "……ふふ。"
"1300308-43-ハスミ" = "またお世話になってしまいましたね、先生。"
"1300308-44-ハスミ" = "……ちょっとだけだと思っていた時間を、こんなに贅沢に過ごせるなんて。"
"1300308-45" = "[s] \"？\""
"1300308-46-ハスミ" = "……何でもありません。"
"1300308-47-ハスミ" = "えっと、誰かに見られてしまう前に、私は寮に戻りますね。"
"1300308-48-ハスミ" = "では、先生。"
"1300308-49-ハスミ" = "また……。"
