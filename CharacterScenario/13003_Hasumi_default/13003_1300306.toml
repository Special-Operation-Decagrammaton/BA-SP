[translation]
"1300306-1" = "ストレスの原因"
"1300306-2" = "トリニティ外郭・商店街"
"1300306-3-ハスミ" = "おはようございます、先生。"
"1300306-4-ハスミ" = "また、偶然ですね。"
"1300306-5" = "[s] \"ハスミ……？何かあった？\""
"1300306-6-ハスミ" = "え？特に、何もございませんが……どうかしましたか？"
"1300306-7-ハスミ" = "……私が怒ってるように見えたから、ですか？"
"1300306-8-ハスミ" = "ああ……すみません。最近スイーツを制限していたからでしょうか……。"
"1300306-9-ハスミ" = "ストレスが……。"
"1300306-10-ハスミ" = "それに、正義実現委員会でもこの頃、ストレスになるようなことが多く発生していまして……。"
"1300306-11-ハスミ" = "近頃は頭痛も……。"
"1300306-12-ハスミ" = "……。"
"1300306-13-ハスミ" = "……ですが、大丈夫です。"
"1300306-14" = "[s] \"全然大丈夫そうに見えないけど。\""
"1300306-15-ハスミ" = "そ、そうですか……。"
"1300306-16-ハスミ" = "ご心配をおかけてしまっていたら……ダイエットも意味がないですね……。"
"1300306-17" = "[s] \"無理してダイエットをしなくてもいいんじゃないかな？\""
"1300306-18-ハスミ" = "え？そ、そうでしょうか？"
"1300306-19-ハスミ" = "ですが……私は……。"
"1300306-20-ハスミ" = "お恥ずかしい話ですが、最近自分と同じように制服を着た女の子たちを見ると、なんだか自信が無くなってしまって……。"
"1300306-21-ハスミ" = "どうしたものでしょう……。"
"1300306-22-ハスミ" = "……先生は、ダイエットをしない方がいいと思いますか？"
"1300306-23" = "[s1] \"そのままのハスミがいいよ。\"\n[s2] \"今でも十分素敵だよ。\""
"1300306-24-ハスミ" = "……。"
"1300306-25-ハスミ" = "……。"
"1300306-26-ハスミ" = "そう、ですか。"
"1300306-27-ハスミ" = "……そうなんですね。"
"1300306-28-ハスミ" = "……ふふ。なんだか頭痛が無くなった気がします。"
"1300306-29-ハスミ" = "行きましょう、近くに美味しいパン屋さんがありまして……。"
"1300306-30-ハスミ" = "先生が保証してくださったのですから、今日は責任をとって、一緒に来てくださいね。"
"1300306-31" = "（それから一緒にパン屋さんに行って、たくさんパンを食べた）"
