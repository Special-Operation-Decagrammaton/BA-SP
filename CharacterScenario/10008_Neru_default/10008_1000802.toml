[translation]
"1000802-1" = "朝、メイド、掃除！"
"1000802-2" = "ミレニアム・近郊通り"
"1000802-3-ネル" = "ふぁあー……。"
"1000802-4-ネル" = "……また寝坊しちまったな、ったく。"
"1000802-5-ネル" = "ちょっとギリギリかもな。急がねぇと遅刻か。"
"1000802-6-ネル" = "まあ、今からでも走れば……ん？"
"1000802-7-ネル" = "ったく……。"
"1000802-8-ネル" = "どこのどいつだよ。"
"1000802-9-ネル" = "道がめちゃくちゃじゃねぇか。誰かが自転車で、ゴミ箱にでも突っ込んだのか？"
"1000802-10-ネル" = "……。"
"1000802-11-ネル" = "はあ、仕方ねぇな。"
"1000802-12" = "（ガサガサ）"
"1000802-13-ネル" = "……大体こんなもんか。"
"1000802-14-ネル" = "ったく、めんどくせぇ。"
"1000802-15-ネル" = "通学路をこんな風にした奴を防犯カメラで探し出して、地獄を見せてやる。"
"1000802-16-ネル" = "あぁ？何だこの缶……。"
"1000802-17-ネル" = "これぐらいなら蹴っ飛ばしてゴミ箱に……。"
"1000802-18" = "（カン！）"
"1000802-19-ネル" = "あ？外れたか。"
"1000802-20-ネル" = "はっ、おもしれぇ。"
"1000802-21-ネル" = "よし、もう一度……。"
"1000802-22" = "（カン！）"
"1000802-23-ネル" = "ああ～、くそ！惜しかった！"
"1000802-24-ネル" = "おし！今度こそ……。"
"1000802-25" = "[s] \"おはよ、何してるの？\""
"1000802-26-ネル" = "うわわわっ！な、なんだ！？"
"1000802-27-ネル" = "は？先生！？何でこんなとこにいんだよ！？"
"1000802-28-ネル" = "……い、いつから見てた？"
"1000802-29" = "[s] ″「……また寝坊しちまったな、ったく」のところから。″"
"1000802-30-ネル" = "最初からじゃねえか！ああもう！"
"1000802-31-ネル" = "……おい、先生！#n今見たこと、どこかでバラしやがったらその時は覚悟しろよ！"
"1000802-32" = "[s1] \"なんで掃除してたのを言っちゃダメなの？\"\n[s2] \"なんで缶を蹴飛ばして遊んでたのを言っちゃダメなの？\""
"1000802-33-ネル" = "あぁん？そりゃ当たり前だろ。"
"1000802-34-ネル" = "あぁん？そりゃ当たり前だろ。"
"1000802-35-ネル" = "そもそもあたしは、ミレニアムのエージェントC&Cとしてだな……。"
"1000802-36-ネル" = "えっと……その……。"
"1000802-37-ネル" = "あー……だって……エージェントのリーダーであるあたしが、のんびり校門の前を掃除してたとか……。"
"1000802-38-ネル" = "缶を飛ばして遊んでたなんて噂にでもなったら……。"
"1000802-39" = "[s] \"恥ずかしいんだ？\""
"1000802-40-ネル" = "恥ずかしいとかじゃねえから！！"
"1000802-41" = "[s] \"じゃあ、私たち二人だけの秘密にしよう。\""
"1000802-42-ネル" = "ひ、秘密？"
"1000802-43-ネル" = "……うーん、二人だけの秘密、か。"
"1000802-44-ネル" = "ははっ、何か悪くねぇ響きだな。"
"1000802-45-ネル" = "いいぜ、先生。二人だけの秘密だからな、分かったか？約束は守れよ？"
"1000802-46-ネル" = "これから先ずっと、ちゃんと守ってるか確認するからな？"
"1000802-47" = "（ネルはなんだかすっきりした表情で、ミレニアムの方向に消えていった）"
