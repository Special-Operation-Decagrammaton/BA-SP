[translation]
"1000820-1" = "スカジャンの理由"
"1000820-2" = "（ネルと待ち合わせをしたミレニアムキャンパスの広場に到着した）"
"1000820-3" = "（広場の片隅にあるベンチで、ネルの姿を見つけた）"
"1000820-4" = "[ns] \"……？\""
"1000820-5-ミレニアムの生徒A" = "えっと、普通に通って良いのかな……。"
"1000820-6-ミレニアムの生徒B" = "絶対にやめたほうがいいって！遠回りしよ！"
"1000820-7-ミレニアムの生徒A" = "C&Cの部長さんって、いつ見ても怖そうだよね……。"
"1000820-8-ミレニアムの生徒B" = "スカジャンが目印になって、遠目からでも分かるのが救いかも……。"
"1000820-9-ミレニアムの生徒A" = "確かに……もはや目印みたいな……。"
"1000820-10-ミレニアムの生徒B" = "ほら、早くあっち行こ！"
"1000820-11" = "[ns] \"……。\""
"1000820-12" = "[ns1] ネルに近づく。\n[ns2] 手を振ってネルを呼ぶ。"
"1000820-13-ネル" = "……？"
"1000820-14-ネル" = "あぁ、先生か。思ってたよりも早いじゃねぇか。"
"1000820-15-ネル" = "あ？さっきからいた？来てるならさっさと声かけろよ。"
"1000820-16-ネル" = "……用事？いや別に、特にねぇけど。"
"1000820-17-ネル" = "まさか、理由がなかったら呼ぶなとは言わねぇだろ？#nあたしと先生の仲じゃねぇか！"
"1000820-18-ネル" = "……は？"
"1000820-19-ネル" = "……スカジャン？あたしのこれ？"
"1000820-20-ネル" = "これがどうかしたか？"
"1000820-21-ネル" = "まさか……"
"1000820-22-ネル" = "先生も興味あんのか！？だったら一着やろうか？#nあ、もしお気に入りを探してぇなら店を紹介してやるぞ！"
"1000820-23-ネル" = "まあ、そう簡単にいいモンが手に入るとは限らねーけどよ。#nもし先生が欲しいって言うんなら、あたしがなんとか……"
"1000820-24-ネル" = "……あぁ？"
"1000820-25-ネル" = "そうじゃない、って？じゃあどうしてスカジャンの話なんか振ったんだよ。"
"1000820-26-ネル" = "あたしが着てる理由……？"
"1000820-27-ネル" = "スカジャンを？"
"1000820-28-ネル" = "……。"
"1000820-29" = "[s3] \"……ネル？\"\n[s4] \"えっと、言いたくなければ無理には……\""
"1000820-30-ネル" = "……！"
"1000820-31-ネル" = "な、なんでもねぇよ。"
"1000820-32-ネル" = "気にするな、本当に何でもねぇから。"
"1000820-33-ネル" = "……あたしの格好に文句をつけるのかって、反射的に構えちまってよ。#n先生はそんなワケねぇのにな。"
"1000820-34-ネル" = "スカジャンの話になると、どいつも否定的な反応ばかりだからよ。"
"1000820-35-ネル" = "だからつい、悪いな。"
"1000820-36-ネル" = "ま、その話はいいだろ。"
"1000820-37-ネル" = "にしても、スカジャンを着てる理由、か……。"
"1000820-38-ネル" = "どうしていきなり？"
"1000820-39" = "[s5] \"何となく、事情があるのかなって。\"\n[s6] \"すごい気にいってそうだから。\""
"1000820-40-ネル" = "……ふぅん。"
"1000820-41-ネル" = "でも、どう答えたもんかな……。"
"1000820-42-ネル" = "あたしが「理由なんてねぇよ」とか言ったら、どうせ先生は変に心配すんだろうし……。"
"1000820-43-ネル" = "別にそれが悪いとは言わねぇけどよ。"
"1000820-44-ネル" = "……いや、やっぱりなんて説明したもんかな。"
"1000820-45-ネル" = "ん？"
"1000820-46-ネル" = "難しく考えないで、そのままの理由が知りたい……？"
"1000820-47-ネル" = "……いや、本当に大した理由じゃねぇんだよ。むしろあまりにも単純な理由だから、これで先生が納得してくれんのかなって思ってよ。"
"1000820-48-ネル" = "まあ、正直に答えるしかねぇか……。"
"1000820-49-ネル" = "私がスカジャンを着る理由はな……"
"1000820-50-ネル" = " ……最高にイカしてるからだ！"
"1000820-51-ネル" = "……どうだ？"
"1000820-52-ネル" = "はははっ！なんだ、その顔！"
"1000820-53" = "[s7] \"な、なるほど……。\"\n[s8] \"一周回って予想外。\""
"1000820-54-ネル" = "ま、そんな反応だろうと思ったぜ。"
"1000820-55-ネル" = "むしろそれ以外に反応のしようもねぇだろうけどよ。"
"1000820-56" = "ま、色々想像されがちだけどな。たとえば背が低いイメージを拭うためとか。"
"1000820-57" = "他人の威圧のためだとか、変なやつに絡まれないようにだとか……。"
"1000820-58" = "ま、想像するのは勝手だから、好き勝手に言わせてんだけどよ。"
"1000820-59" = "誰かから受け継いだんじゃねぇかとか、そういうのも聞いたことあるが……。"
"1000820-60-ネル" = "……ま、本当に大した理由なんて無くてな。ただ気に入ってんだよ、見た瞬間これだ！って思ってな。"
"1000820-61-ネル" = "悪かったな、つまんない答えで。"
"1000820-62-ネル" = "……どうした？"
"1000820-63-ネル" = "このことを知ってるやつ？#nいるわけねぇだろ。そもそもこんな真剣に聞かれたこと自体、先生が初めてだぜ。"
"1000820-64-ネル" = "あたしがスカジャンを着てるのなんて、みんな当たり前だと思ってるんじゃねぇか。"
"1000820-65-ネル" = "……やっぱつまんなかったろ。もっと面白い理由だったら良かったんだけどな。"
"1000820-66" = "[s9] \"そんなことないよ。ネルのことをまた知れたし。\"\n[s10] \"そういう理由だからこそ、良いんじゃないかな。\""
"1000820-67-ネル" = "……へえ。"
"1000820-68-ネル" = "ったく、相変わらずだな先生は。"
"1000820-69-ネル" = "そういうのが良いだなんて、変わってるよ。"
"1000820-70" = "[s11] \"ネルの気持ちが知りたかったから。\"\n[s12] \"服くらい、他人を気にせず好きに着るものだからね。\"\n[s13] \"それに私もそれ、最高にイカしてると思う！\""
"1000820-71-ネル" = "……はっ。"
"1000820-72-ネル" = "くくっ……。"
"1000820-73-ネル" = "ま、それでこそ先生だ。"
"1000820-74-ネル" = "そういうところ、嫌いじゃねぇぜ。"
