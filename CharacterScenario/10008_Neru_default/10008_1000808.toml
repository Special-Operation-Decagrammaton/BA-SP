[translation]
"1000808-1" = "輝く夜に"
"1000808-2" = "ミレニアム・廊下"
"1000808-3-ネル" = "ははっ、先生。夜遅くにお疲れさん。"
"1000808-4-ネル" = "見せたいものは、秘密の場所にあってさ。"
"1000808-5-ネル" = "まだ誰にも教えたことのない場所で……。"
"1000808-6-ネル" = "何でかって、あたしが授業をサボる時によく行くところだから、他の誰かに場所がバレたら困るんだよな……。"
"1000808-7-ネル" = "だから連れて行くのも、先生だけな。"
"1000808-8-ネル" = "じゃあ、先生。"
"1000808-9-ネル" = "目を閉じて。"
"1000808-10-ネル" = "早く。"
"1000808-11-ネル" = "あたしの手を握って。"
"1000808-12-ネル" = "ひぁっ！そっ、そこは手じゃねぇよ！"
"1000808-13-ネル" = "ふう、マジでびっくりした……。"
"1000808-14-ネル" = "……ほら、こっち。"
"1000808-15" = "（チン）"
"1000808-16-ネル" = "ふふ、気づいたか？ああ、エレベーターだ。"
"1000808-17-ネル" = "ん？上がるのかって？もちろん。"
"1000808-18-ネル" = "ここのエレベーターの速度、分速2000mらしいぜ。"
"1000808-19" = "（ウイイィィィィィン……）"
"1000808-20" = "……"
"1000808-21" = "…………"
"1000808-22" = "………………"
"1000808-23" = "（ゴゥン！）"
"1000808-24" = "（チーン）"
"1000808-25-ネル" = "さ、到着。"
"1000808-26-ネル" = "ほら、ゆっくり前へ歩いて。"
"1000808-27" = "（ヒュォーーッ……）"
"1000808-28-ネル" = "目、開けてもいいぞ、先生。"
"1000808-29" = "[s] \"……！\""
"1000808-30" = "― ようこそ、[wa:1000]先生。[wa:1700]あたしだけの特等席、[wa:1200]歓迎するぜ！"
"1000808-31" = "― あたしはこの学園が好きだ。[wa:3500]それに……[wa:1000]この瞬間も。"
"1000808-32" = "― 怖くないのかって？[wa:3000]全然。[wa:1500]ただ、[wa:1000]ドキドキはしてる。"
"1000808-33" = "― まあ、[wa:1000]たまにはサボるのも悪くねぇな。[wa:2000]ははは！"
"1000808-34" = "ミレニアム・屋上"
"1000808-35-ネル" = "あー楽しかった。"
"1000808-36-ネル" = "先生には教えたけど、他のやつに教えるんじゃねえぞ。"
"1000808-37" = "[s] \"うん、二人だけの秘密にするよ。\""
"1000808-38-ネル" = "……。"
"1000808-39-ネル" = "二人だけの秘密……。"
"1000808-40-ネル" = "な、なんか先生とあたしだけの秘密が、どんどん増えてる気がするな……あたしの勘違いか？"
"1000808-41-ネル" = "い、嫌ってわけじゃねぇから！！"
"1000808-42-ネル" = "……。"
"1000808-43-ネル" = "ほ、本当に、嫌じゃない、から。"
"1000808-44-ネル" = "……。"
"1000808-45-ネル" = "だ、だから。"
"1000808-46-ネル" = "……これからも、よ、よろしくな、先生。"
"1000808-47-ネル" = "先生と一緒にいると、これから先も……#nこんな秘密が、たくさんできてく気がするな。"
