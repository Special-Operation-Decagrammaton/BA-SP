[translation]
"1602002-1" = "ある狙撃手のスモールトーク"
"1602002-2" = "（シャーレの近くに最近人気のカフェがオープンしたと聞いたので行ってみた）"
"1602002-3" = "（午後のカフェは、そこそこ混雑していた）"
"1602002-4" = "[ns1] （ここがSNSで話題のカフェか……）\r\n[ns2] （客の好みに合わせたコーヒーを提供してくれるって聞いたけど……）"
"1602002-5-店員" = "いらっしゃいませ。ご注文はお決まりでしょうか。\r\n"
"1602002-6" = "[s] \"えっと、ブラックコーヒーで。\""
"1602002-7-店員" = "ご来店は初めてでしょうか？\r\n"
"1602002-8-店員" = "当店ではお客様に最適な一杯をご提供すべく、多種多様な豆と機材を揃えております。#nなんなりとお申し付けください。"
"1602002-9-店員" = "豆はウォッシュドとナチュラル、どちらがお好みですか？#n焙煎は、どの程度にいたしましょう？"
"1602002-10" = "[s] \"えっと、豆は何があるんですか……？\""
"1602002-11-店員" = "ブルボン、ティピカ、ゲイシャ、カトゥアイ、と多数あり――"
"1602002-12-店員" = "焙煎方法は、段階ごとに承っております。\r\n"
"1602002-13" = "[ns] \"なるほど……それじゃあえっと……。\""
"1602002-14-オトギ" = "あれ、[USERNAME]先生？\n"
"1602002-15-オトギ" = "先生もフルリンクを見て来たの？#n最近、SNSでバズってたもんね～"
"1602002-16" = "[s3] \"オトギ！\"\r\n[s4] \"ちょうど良かった。助けて……。\""
"1602002-17-オトギ" = "……ん？そんな顔して、どうしたの？\r\n"
"1602002-18" = "[s] \"オトギは、ここによく来るの？\""
"1602002-19-オトギ" = "ううん、初めて。何かあったの？"
"1602002-20-オトギ" = "……ああ、ちょっとメニュー複雑だよね。"
"1602002-21-オトギ" = "というかそれなら普通にお店の人に聞けばいいじゃん。\r\n"
"1602002-22-オトギ" = "混んでるから、あれこれ聞いたら迷惑になる？"
"1602002-23-オトギ" = "んじゃ、私に任せて！\r\n"
"1602002-24-オトギ" = "すいませーん。\r\n"
"1602002-25-オトギ" = "豆の説明のウォッシュドとナチュラルって、どういうことですか？"
"1602002-26-店員" = "ウォッシュドは、果肉を取り除いて水で洗ってから乾燥させたもので、すっきりとした味わいになります。"
"1602002-27-店員" = "ナチュラルは、果肉がついたまま乾燥させたもので、フルーツのような風味が特徴です。"
"1602002-28-オトギ" = "おぉ、フルーティーなコーヒーってこと？#nふっしぎ～"
"1602002-29-オトギ" = "私はゆず茶が好きなんだけど、近いのってあります？"
"1602002-30-店員" = "本日、柑橘系の香りが特徴のブルボンが入りましたので、そちらにいたしましょうか。"
"1602002-31-店員" = "抽出方法のご希望は？"
"1602002-32-オトギ" = "うーん……よく分からないから、お任せで。"
"1602002-33-店員" = "では、ハンドドリップでお淹れしますね。"
"1602002-34-店員" = "お連れ様は……。"
"1602002-35" = "[s] \"わ、私も、同じもので！\""
"1602002-36-店員" = "かしこまりました。少々お待ちくださいませ。"
"1602002-37" = "[ns5] \"おかげで助かったよ……。\"\n[ns6] \"最近のお店って、こんなに複雑なんだ。\""
"1602002-38-オトギ" = "そうだねぇ……ニーズに合わせてくれるお店が最近は人気かも。"
"1602002-39-オトギ" = "私は、店員さんとおしゃべりできるから好きだけど。\r\n"
"1602002-40-オトギ" = "注文が複雑すぎると、怖くなってやめちゃう人も多いみたい。"
"1602002-41-オトギ" = "いくら注文が細かくたって、お客さんを食べる料理店なんて、存在しないのにねぇ。"
"1602002-42-店員" = "……お待たせしました。ご注文のコーヒーです。"
"1602002-43-オトギ" = "あ、来た来た。"
"1602002-44-オトギ" = "ん～……ほんとに柑橘系のいい香りがする。"
"1602002-45-オトギ" = "冷たくしたら、アイスティーみたいな感じになるかも？"
"1602002-46-店員" = "アイスだと香りが落ちてしまうのでオススメしませんが、必要でしたら氷をお持ちしましょうか？"
"1602002-47-オトギ" = "ううん。せっかくだから、今日はこの香りを楽しもうかな。"
"1602002-48-オトギ" = "あと、アイスコーヒーに合う豆を教えて。次はそっちにするから。"
"1602002-49-店員" = "比較できるよう、他のコールドブリューのサンプルをお持ちしましょうか？\r\n"
"1602002-50-オトギ" = "それ、気になるかも。お願いしてもいい？"
"1602002-51" = "[ns7] \"知らない人と、こんなに会話が弾むなんて……。\"\n[ns8] \"なんか、オトギは他の狙撃手よりも社交的なんだね。\""
"1602002-52-オトギ" = "他の狙撃手……？"
"1602002-53-オトギ" = "ああ、たしかに単独作戦が多いし――"
"1602002-54-オトギ" = "狙撃手は臆病で内向的っていうイメージはあるかもね。"
"1602002-55-オトギ" = "孤独な一匹狼スタイルは、腕がいい人も多いけど……。"
"1602002-56-オトギ" = "仲間と円滑に進めるためには、ある程度の社交性が必要なんだよ。"
"1602002-57-オトギ" = "それに人と話すことが気にならないのは、私の狙撃手としての鉄則でもあるからね。"
"1602002-58" = "[s] \"狙撃手としての鉄則？\""
"1602002-59-オトギ" = "うん、例えば――"
"1602002-60-オトギ" = "あれ？――ねえ、しおり落としたよ。\r\n"
"1602002-61-生徒" = "あ、ありがとうございます！大切なしおりなんです！\r\n"
"1602002-62-オトギ" = "このサイン、見たことあるかも……。"
"1602002-63-オトギ" = "もしかして「禁断の愛」シリーズの作家、恋よ鯉先生のサイン？\r\n"
"1602002-64-生徒" = "そうなんです！出版記念イベント限定のもので！\r\n"
"1602002-65-生徒" = "一目で分かるなんて……あなたも恋よ鯉先生のファンなんですか？"
"1602002-66-オトギ" = "ファンって言うほどじゃないけど、この作家の本は買って読んでるよ～"
"1602002-67-生徒" = "先週の新作短編集はご存知ですか？\r\n"
"1602002-68-オトギ" = "ううん、知らなかったぁ。"
"1602002-69-生徒" = "良かった……ではこちらをどうぞ。\r\n"
"1602002-70-オトギ" = "え、これ新刊でしょ？もらっちゃっていいの？"
"1602002-71-生徒" = "気にしないでください。これは「布教用」ですから。"
"1602002-72-オトギ" = "じゃあ、ありがたくもらっちゃうね。\r\n"
"1602002-73-オトギ" = "あ、良かったらSNS教えて。後で感想送るからさ。"
"1602002-74-生徒" = "はい、ぜひ……！\r\n\r\n"
"1602002-75" = "（その後も、オトギは店員や他のお客さんと楽しそうに会話をして……）\r\n"
"1602002-76" = "（色々な情報を集めたり、サービスをうけていた）\r\n"
"1602002-77-オトギ" = "ああ、楽しかったぁ～\r\n"
"1602002-78-オトギ" = "ありがと、先生。久しぶりに楽しい午後を過ごせたよ～"
"1602002-79" = "[s] \"私もとても楽しかったよ。\""
"1602002-80" = "[ns] \"それで……「狙撃手としての鉄則」って？\""
"1602002-81-オトギ" = "ああ、その話、途中だったね。\r\n"
"1602002-82-オトギ" = "任務中って、多くのチャンスが回ってくるからさ。"
"1602002-83-オトギ" = "今、引き金を引くべきなのか、待つべきなのか、悩むことが多いんだけど――"
"1602002-84-オトギ" = "私は、迷わずチャンスを掴んだほうがいいって思ってる。\r\n"
"1602002-85-オトギ" = "ミスをしても取り返せるけど―― #n一瞬のチャンスを逃したら、永遠に取り戻せないから。"
"1602002-86-オトギ" = "だから新しいことに出会ったら、ぶつかっていくようにしてるんだ。"
"1602002-87" = "[s9] \"素晴らしい考えだね。\"\n[s10] \"これからも変わらないでほしいな。\""
"1602002-88-オトギ" = "ふふ。自慢じゃないけど、色々経験してきた方だと思うよ。"
"1602002-89-オトギ" = "空でも、大地でも、海でも。私の予測を外れる状況は、ほぼない――\r\n"
"1602002-90-広報スタッフ" = "新商品です！ご試食どうぞ！"
"1602002-91-広報スタッフ" = "新気鋭の味！カップ麺界の革命、チリチョコレート炒め麺！"
"1602002-92-オトギ" = "…………。"
"1602002-93-オトギ" = "新しい物を見つけた時は避けずに、挑むべき……。"
"1602002-94" = "[s11] \"いや、無理に挑む必要はないよ！？\"\r\n[s12] \"時には挑まなくても、良い時があるよ？\""
"1602002-95-オトギ" = "ううん、先生。"
"1602002-96-オトギ" = "SRTの特殊隊員たるもの、失敗だと分かってても、突撃しなきゃいけない時がある！"
"1602002-97-オトギ" = "さあて、お味見といこうか……。"
"1602002-98" = "（そしてオトギは、悲壮な表情で、誰も試食しようとしなかった炒め麺を食べ……）\r\n"
"1602002-99-オトギ" = "あはは……新気鋭の味だったね……。"
"1602002-100" = "[ns] \"オトギー！\""
"1602002-101" = "（苦しそうな表情で倒れてしまった）\r\n"
