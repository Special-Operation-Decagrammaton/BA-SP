[translation]
"1015305-1" = "特別"
"1015305-2" = "ゲヘナカップ競技場"
"1015305-3" = "（仕事があったので競技場の事務所に向かっている途中――）"
"1015305-6" = "（遠くにヒフミが見えた）"
"1015305-12-ヒフミ" = "あ、あの……私、そろそろ帰らないと……。"
"1015305-13-観客A" = "でもでも！こんなところで会えるなんて運命かもっ！！私、大ファンなの！"
"1015305-14-観客B" = "この前のレースもすごかったよ！#nライバルを全員森の中で撃破したやつ！"
"1015305-15-観客C" = "サインください……！#nあなたの攻撃的なプレイが大好きなんです！"
"1015305-16-ヒフミ" = "あれは狙ったわけじゃなくて……あうぅ……。"
"1015305-17-観客B" = "いやいや、名試合だったってすっごく話題になってるんだから！"
"1015305-18-観客A" = "でも、これまであんまり試合に出てなかったのって、どうして？"
"1015305-19-ヒフミ" = "あ、あうぅ……。"
"1015305-21-ヒフミ" = "ごめんなさい！！失礼します！！"
"1015305-25-観客A" = "あ……逃げた。"
"1015305-26-観客B" = "一緒に写真撮りたかったのに。ざんねーん。"
"1015305-27-観客C" = "ミステリアスなのも魅力だよね。#n写真も避けてるし、インタビューも毎回断るんだって。"
"1015305-28-観客A" = "すっごい才能の持ち主なのに謙虚……！すてき……！"
"1015305-30" = "[ns] \"ヒフミ！待って！！\""
"1015305-32" = "（そのままヒフミを追いかけたものの……）"
"1015305-33" = "（人混みの中で見失ってしまった）"
"1015305-39" = "（探し回って疲れたので、しばらく休憩することにした）"
"1015305-46" = "[ns] \"ヒフミ？\""
"1015305-47-ヒフミ" = "先生？どうしてこんなところに？"
"1015305-48-ヒフミ" = "……散歩中？#nあはは、偶然ですね。私も気分転換しようとしていたところなんです。"
"1015305-49" = "[s] \"ヒッチハイクしてもいい？\""
"1015305-50-ヒフミ" = "もちろんです！"
"1015305-51-ヒフミ" = "さあ、どうぞ。こちらへ。"
"1015305-55-ヒフミ" = "あっ、よければペロロ様のブランケットを使ってください。"
"1015305-56-ヒフミ" = "それで、どこに行きましょうか？"
"1015305-57" = "[s] \"ヒフミが行きたい場所！\""
"1015305-58-ヒフミ" = "私の行きたい場所……。"
"1015305-61-ヒフミ" = "……では、あそこにしましょう。"
"1015305-62-ヒフミ" = "発進しますね！"
"1015305-67" = "灯りが消えたゲヘナカップ競技場"
"1015305-69-ヒフミ" = "――着きました。"
"1015305-70-ヒフミ" = "サーキットです。"
"1015305-71-ヒフミ" = "……夜になると少し冷えますね。#nクルセイダーちゃんでお茶をいれられるのですが、1杯いかがですか？"
"1015305-72-ヒフミ" = "夜のサーキットを眺めながら楽しむティータイムも、趣があっていいものですよ。"
"1015305-73" = "[s] \"うん、お願いしようかな。\""
"1015305-74-ヒフミ" = "はい、すぐに用意しますね！"
"1015305-79-ヒフミ" = "……先生。"
"1015305-80-ヒフミ" = "私……特別な人ってすごいなぁと思うんです。#nその、私は平凡なので。"
"1015305-81-ヒフミ" = "だから……もしも。もしもですよ？#n実は自分にも「特別」なことがあると分かったとして……#nでもそれは、自分の求めていた特別さとは違うものだとしたら……どう思いますか？"
"1015305-82" = "[s1] \"特別に綺麗なこと？\"\n[s2] \"特別にかわいいこと？\"\n[s3] \"特別に優しいこと？\""
"1015305-86-ヒフミ" = "あうぅ……！#nお言葉は嬉しいですが、そういうのじゃなくてですね……！"
"1015305-90-ヒフミ" = "戦車……に関することで。"
"1015305-92-ヒフミ" = "運転するのが好きで、なんとなく興味を持つようになって。"
"1015305-93-ヒフミ" = "……気づいたら、ちょっとだけ有名になっていたみたいなんです。#nそれで、たまに声をかけられることもあって……。"
"1015305-94-ヒフミ" = "ですが、こういう風に目立つのはプレッシャーといいますか……。"
"1015305-96-ヒフミ" = "まさか自分が……こんな形で誰かの「特別」になるなんて思いもしませんでした。"
"1015305-99" = "[ns] \"……つらい？\""
"1015305-100-ヒフミ" = "あっ、いえ！それで喜ぶ方がいるなら、私も嬉しいです。"
"1015305-101-ヒフミ" = "でも……どうやら噂が独り歩きして、怖いイメージがついてしまったみたいで。"
"1015305-102-ヒフミ" = "私は真剣に臨んでいただけなのに……あうぅ……。"
"1015305-103-ヒフミ" = "……だから、レースがあった日は、こうやって静かなサーキットを眺めに来るんです。"
"1015305-104-ヒフミ" = "特別な1日が終わって平凡な日常に戻るように、気持ちを切り替えられるので。"
"1015305-105-ヒフミ" = "おかしいですよね。#n特別をうらやんでいたはずなのに、平凡に戻りたいと思うだなんて……。"
"1015305-106" = "[s4] \"「特別」も素敵なことだと思うよ。\"\n[s5] \"でも同じくらい、いつものヒフミも素敵だと思う。\""
"1015305-109-ヒフミ" = "私の特別な部分と、いつもの私……。"
"1015305-112-ヒフミ" = "……ありがとうございます、先生。"
"1015305-113-ヒフミ" = "えへへ、元気出ました！"
"1015305-114-ヒフミ" = "お茶、もう1杯いかがですか？"
"1015305-115" = "[s] \"うん！特別な1杯にしよう！\""
"1015305-116-ヒフミ" = "はい！"
"1015305-118" = "（その後、月明かりに照らされるサーキットを眺めながら、#nヒフミと一緒に紅茶を楽しんだ）"
