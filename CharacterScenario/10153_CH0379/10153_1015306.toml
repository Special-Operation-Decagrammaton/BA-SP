[translation]
"1015306-1" = "平凡な秘密基地！"
"1015306-3-ヒフミ" = "試しに塗ってみたのですが……。"
"1015306-4-ヒフミ" = "先生、どうでしょう……？"
"1015306-5-ヒフミ" = "1番から4番のうち、どれが元の色に近いと思いますか？"
"1015306-6" = "[s] \"……全部同じじゃない？\""
"1015306-7-ヒフミ" = "やっぱりそうですよね……？"
"1015306-8-ヒフミ" = "全部違う色のはずなのに、私も同じにしか見えなくて。"
"1015306-9-ヒフミ" = "部分塗装なので、元の色に合わせないといけないんですけど……。"
"1015306-10" = "[s] \"完璧に一緒じゃないとダメなの？\""
"1015306-11-ヒフミ" = "そこまで厳密にする必要はないのですが、違うはずの4つが全部同じに見えたので。#n自分の見方に問題があるのかなと思って、先生の意見も聞きたかったんです。"
"1015306-12-ヒフミ" = "先生も全部同じ色に見えるなら、気にしないでよさそうですね。"
"1015306-13-ヒフミ" = "では……一気に塗っていくので、ご協力お願いします！"
"1015306-14" = "[s] \"任せて！\""
"1015306-18-ヒフミ" = "ふぅ……。"
"1015306-19-ヒフミ" = "ありがとうございます！#n2人でやるとあっという間でしたね！"
"1015306-20-ヒフミ" = "これでクルセイダーちゃんが綺麗になりました！"
"1015306-21" = "[s] \"ちゃんとメンテナンスしてて偉い！\""
"1015306-22-ヒフミ" = "もちろんです。借り物ですから。"
"1015306-23-ヒフミ" = "借りた時よりも綺麗にして返すくらいの気持ちが大事ですよね！えへへ。"
"1015306-24-ヒフミ" = "あっ、そういえば。#nペンキが乾くまで、ここでのんびりしてから戻るのでも大丈夫ですか？"
"1015306-25" = "[s] \"もちろん！\""
"1015306-26-ヒフミ" = "ありがとうございます！"
"1015306-31-ヒフミ" = "うーん……。"
"1015306-32-ヒフミ" = "やっぱり戦車の中は暑いですね……。"
"1015306-33-ヒフミ" = "クーラーもあることにはあるんですけど、今は故障していて……。"
"1015306-34-ヒフミ" = "だからといって外は――"
"1015306-40-ヒフミ" = "風はありますが、意外と木陰が少なくて直射日光がつらいですね……。"
"1015306-42-ヒフミ" = "うーん……。"
"1015306-43-ヒフミ" = "そうだ！"
"1015306-44-ヒフミ" = "先生！今から秘密基地を作りますね！"
"1015306-48-ヒフミ" = "よい……しょっと！"
"1015306-51" = "（ヒフミは戦車に上って砲塔を後ろへ回し――）"
"1015306-54" = "（砲身に旗をかけて日陰を作った）"
"1015306-59" = "[wa:2000]― [log=히후미 레이싱]はあ～[wa:1720]戦車、[wa:1440]冷たくて気持ちいい……。[/log]"
"1015306-61" = "― [log=히후미 레이싱]やっぱり[wa:720]日陰は涼しいですね……。[/log]"
"1015306-64" = "― [log=히후미 레이싱]戦車を使った秘密基地、[wa:2050]先生はいかがですか？[/log]"
"1015306-67" = "[wa:1360]― [log=히후미 레이싱]……とても静かですよね。[/log]"
"1015306-70" = "― [log=히후미 레이싱]エンジンを切っていると、[/log]"
"1015306-72" = "― [log=히후미 레이싱]装甲が周りの音を[wa:1320]吸収してくれるんです。[/log]"
"1015306-75" = "― [log=히후미 레이싱]呼吸や心臓の鼓動まで[wa:2020]聞こえちゃうくらい[wa:1310]静かで……。[/log]"
"1015306-78" = "[wa:570]― [log=히후미 레이싱]私はこの空間が大好きです。[/log]"
"1015306-80" = "― [log=히후미 레이싱]まるで、[wa:901]世界に二人きりになったみたいで――[/log]"
"1015306-83" = "― [log=히후미 레이싱]あ、[wa:1030]あはは！[wa:1160]私みたいな[wa:910]普通の生徒と一緒にいても、[/log]"
"1015306-85" = "― [log=히후미 레이싱]面白くないかもしれませんが……。[/log]"
"1015306-88" = "[ns1] \"ヒフミは特別な存在だよ。\"\n[ns2] \"かけがえのない生徒だよ。\""
"1015306-91" = "[wa:400]― [log=히후미 레이싱]えっ？[wa:590]あっ、[wa:340]やっ、えっと、[wa:840]その……！[/log]"
"1015306-93" = "― [log=히후미 레이싱]あはは……[wa:1240]先生にはいつも、[wa:1440]元気をもらってばかり、[wa:1330]ですね。[/log]"
"1015306-96" = "― [log=히후미 레이싱]あ、[wa:700]あれ？[wa:1010]なんだか暑くなってきましたね！[/log]"
"1015306-98" = "― [log=히후미 레이싱]ペ、[wa:440]ペンキ、[wa:650]早く乾くといいな……！[/log]"
"1015306-101" = "[wa:2030]― [log=히후미 레이싱]（し、[wa:750]心臓の音が……[wa:2130]先生に聞こえちゃったらどうしよう）[/log]"
"1015306-103" = "― [log=히후미 레이싱]（音楽を流すか、[wa:1510]エンジンをかければよかった……！）[/log]"
"1015306-106" = "― [log=히후미 레이싱]（あうぅ……[wa:1110]恥ずかしい……）[/log]"
"1015306-110" = "（ヒフミはそっぽを向いたまま、黙ってしまった）"
"1015306-113" = "（私はいつの間にか、秘密基地の心地よさに身を任せて眠りに落ちていた）"
