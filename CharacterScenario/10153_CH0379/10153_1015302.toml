[translation]
"1015302-1" = "よくあるユニフォーム？"
"1015302-3" = "（待ち合わせ場所は間違ってないはずだけど……）"
"1015302-4" = "（周りが混雑していて、ヒフミを見つけられずにいた）"
"1015302-5-？？？" = "先生ー！！"
"1015302-8-ヒフミ" = "こっちです、こっちー！"
"1015302-9-ヒフミ" = "よかった……何度か声をかけていたのですが、なかなか気づいてもらえなくて。"
"1015302-10-ヒフミ" = "あはは……こんなに混んでるなら、他の場所にすればよかったですね。"
"1015302-11" = "[s] \"ヒフミ！？その服どうしたの！？\""
"1015302-12-ヒフミ" = "えっ！？なにか変でしょうか！？"
"1015302-13-ヒフミ" = "大会の運営さんからもらったユニフォームです！"
"1015302-14" = "[s1] \"すごくかわいいよ！\"\n[s2] \"でも、レーシングスーツとはちょっと違くない……？\""
"1015302-17-ヒフミ" = "どうなんでしょう？こんな感じだと思いますが……。"
"1015302-21-観客A" = "見て、あの子！"
"1015302-22-観客B" = "モデルさんかな？大胆だね。"
"1015302-23-観客A" = "そりゃこんなおっきな大会だもん。モデルさんも来るでしょ。"
"1015302-26-ヒフミ" = "……先生？何を見てるんですか？"
"1015302-27" = "[s] \"……思ったんだけどさ。\""
"1015302-28-ヒフミ" = "はい！レースにぴったりの衣装ですよね！"
"1015302-29-ヒフミ" = "支給されたのも、これがスタンダードだからでしょうし。"
"1015302-30-ヒフミ" = "ほら、先生、見てください！#nすごく身体にフィットしますし、丈夫な素材が使われているんです。"
"1015302-31-ヒフミ" = "これなら戦車に乗っていてもそうそう破れないと思います！"
"1015302-32-ヒフミ" = "手袋がセットなのは、手を守るためでしょうね。"
"1015302-33" = "[s] \"じゃあ、靴にヒールがついてるのは……？\""
"1015302-34-ヒフミ" = "これも良いですよね！"
"1015302-35-ヒフミ" = "戦車の車長ハッチから顔を出すとき、視野を確保するためだと思います。"
"1015302-36-ヒフミ" = "ペリスコープが無い場合、遠くまで見るには身長が高いほうが有利ですから！"
"1015302-37-ヒフミ" = "コーナリングにせよ、相手を視認するにせよ、視野は勝敗を分ける要素ですし。"
"1015302-38-ヒフミ" = "それと、クルセイダーちゃんにはクロスウィンドセンサーがないので、#n体を乗り出して風向きを感じるのにも役立ちます。"
"1015302-39" = "[s] \"……ウエストが網になってるのは？\""
"1015302-40-ヒフミ" = "走行していると戦車の中が暑くなりますし、服の通気性を上げるためだと思います！"
"1015302-41-ヒフミ" = "クルセイダーちゃんはクーラーが壊れやすいので……。"
"1015302-42-ヒフミ" = "運営さんが配慮してくれたのではないでしょうか？"
"1015302-43-ヒフミ" = "こんなユニフォームを支給してくれるなんて、良い運営さんですよね。"
"1015302-44-観客A" = "す、すごいね……あの子……。"
"1015302-45-観客B" = "ゲヘナのモデルかな？気合ばっちりだね……。"
"1015302-46-ヒフミ" = "……って、服の話ばっかりになってしまいましたね。#nお伝えした通り、先生にプレゼントしたいペロロ様グッズがありまして！"
"1015302-47-ヒフミ" = "あっちに置いてあるので、一緒に取りに行きましょう！"
"1015302-49" = "（道中、ヒフミと一緒に競技場の中でいろいろ寄り道した）"
"1015302-50" = "（周りの注目を集めていることに、ヒフミは全く気づいていなかった）"
