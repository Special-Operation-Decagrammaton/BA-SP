[translation]
"1014802-1" = "アウスフルークレリンと優雅な夏休み"
"1014802-2-イロハ" = "失礼します。"
"1014802-3-イロハ" = "……コーヒー、空じゃないですか。#n仕方ないですね。ポット、借りますよ。"
"1014802-4-イロハ" = "湯を沸かしてる間に、お菓子の準備を……あれ？ない。"
"1014802-5-イロハ" = "ああ、棚に入れたんでしたっけ。"
"1014802-6-イロハ" = "あとはソファを整えたら……。"
"1014802-7-イロハ" = "ふぅ……これで完璧です。"
"1014802-8-イロハ" = "……なんです？"
"1014802-9" = "[s1] \"いえ、何でもありません。\"\n[s2] \"言ったら負けかな……。\""
"1014802-10-イロハ" = "こちらのことはお構いなく。"
"1014802-11-イロハ" = "今日は邪魔するつもりはありませんから。#n[ruby=パンデモニウム・ソサエティー]万魔殿の仕事で[/ruby]来たわけでもないですし。"
"1014802-12-イロハ" = "おとなしく読書してるので、仕事に集中してもらえれば。"
"1014802-13" = "（2時間後）"
"1014802-14-イロハ" = "…………。"
"1014802-15-투명" = "（言葉通り、イロハはずっと本を読んでいた）"
"1014802-16" = "[ns3] \"えっと……。\"\n[ns4] \"私が言うのもあれだけどさ。\""
"1014802-17-イロハ" = "はい？どうかしましたか？"
"1014802-18" = "[s5] \"せっかくの夏休みなんだし。\"\n[s6] \"もう少し夏らしく過ごすとかは……。\""
"1014802-19-イロハ" = "……。"
"1014802-20-イロハ" = "…………。"
"1014802-21-イロハ" = "なるほど。"
"1014802-22-イロハ" = "では、出てってもらえますか？"
"1014802-23" = "[s] \"え？\""
"1014802-24-イロハ" = "私としてはどちらでも構いませんけど。"
"1014802-25-イロハ" = "残ると言うなら――"
"1014802-26-イロハ" = "責任、取っていただきますよ？"
"1014802-27" = "（不安になり、急いで外に出た）"
"1014802-28" = "（扉の前でしばらく待っていると……）"
"1014802-29-イロハ" = "どうぞ。もういいですよ。"
"1014802-30" = "[ns] \"聞きたいことは山ほどあるけど……。\""
"1014802-31" = "[ns] \"その格好は？\""
"1014802-32-イロハ" = "とぼけないでください。"
"1014802-33-イロハ" = "水着姿を見たいと言ったのは先生じゃないですか。"
"1014802-34" = "[s] \"言ったかなぁ！？\""
"1014802-35-イロハ" = "私はソファをお借りしている身。#n言われたら従うほかありません。"
"1014802-36-イロハ" = "ですから、渋々、この格好で過ごしてあげます。"
"1014802-37-イロハ" = "……。"
"1014802-38-イロハ" = "では、読書に戻ります。"
"1014802-39" = "[ns] \"……結局読書なんだね。\""
"1014802-40-イロハ" = "もちろんです。"
"1014802-41-イロハ" = "もしかして……この格好らしい「何か」をお望みですか？"
"1014802-42" = "[s7] \"いえ、とんでもない。\"\n[s8] \"読書っていいよね。\""
"1014802-43" = "（イロハは最後まで水着姿で……そのまま帰った）"
"1014802-44" = "（シャーレは生徒を水着姿で働かせている、という噂が広まった）"
