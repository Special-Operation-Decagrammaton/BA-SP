[translation]
"1014803-1" = "アウスフルークレリンと特別な夏休み"
"1014803-2" = "[ns1] \"ふっふっふっ！\"\n[ns2] \"してやったり！\""
"1014803-3-イロハ" = "……先生が楽しそうでなによりです。"
"1014803-4-イロハ" = "まさか、そのまま海に連れてこられるだなんて……。"
"1014803-5-イロハ" = "もう目的は達成した、なんて言いませんよね？"
"1014803-6" = "[s3] \"せっかくの夏休みなんだから。\"\n[s4] \"特別なことをしなきゃ！\""
"1014803-7-イロハ" = "やけに張り切ってるなとは思いましたが……。"
"1014803-8-イロハ" = "そういうことですか……。"
"1014803-9-イロハ" = "それで。どうして[ruby=とらまる]虎丸[/ruby]を？"
"1014803-10-イロハ" = "海には関係ないのでは？"
"1014803-11" = "[s5] \"いや？\"\n[s6] \"夏の海と言えば戦車！常識でしょ？\""
"1014803-12-イロハ" = "羽が生えたやつらみたいなことを……。"
"1014803-13-イロハ" = "まあ、せっかく来たんですし。"
"1014803-14-イロハ" = "このまま帰るのは、もったいないですね。"
"1014803-15-イロハ" = "今日ぐらいは、付き合ってあげますよ。"
"1014803-16" = "（しばらくして……）"
"1014803-17-イロハ" = "……。"
"1014803-18-イロハ" = "……。"
"1014803-19" = "[s7] \"海にいるのに……。\"\n[s8] \"それだといつもと同じじゃない？\""
"1014803-20-イロハ" = "全然違うと思いますけど。"
"1014803-21-イロハ" = "同じ読書だって、場所が違えば特別になります。"
"1014803-22-イロハ" = "そもそも、私が水遊びをするとでも――思ってたんですね。"
"1014803-23-イロハ" = "せっかくですが、このまま満喫していようかと。#nこんな場所で本を読むなんてそうないですから。"
"1014803-24-イロハ" = "……。"
"1014803-25-イロハ" = "……。"
"1014803-26" = "[s9] \"お腹空かない？喉渇いてない？\"\n[s10] （読書に集中しちゃう前に……！）"
"1014803-27-イロハ" = "……はぁ。今日は付き合うと言いましたし。"
"1014803-28-イロハ" = "散策くらいはしましょうか。"
"1014803-29-海の家の店員" = "らっしゃい！"
"1014803-30-イロハ" = "いろいろありますね。"
"1014803-31-海の家の店員" = "……ではアイスコーヒーを。"
"1014803-32" = "[ns11] \"……それだけ？\"\n[ns12] \"もっと頼んでもいいよ。\""
"1014803-33-イロハ" = "いえ、大丈夫です。"
"1014803-34-イロハ" = "お腹は空いてませんし、戻ればポテトチップスがあるので。"
"1014803-35-イロハ" = "それに――"
"1014803-36-イロハ" = "こういう所で食べるのは……あまり好みではなくて。"
"1014803-37-海の家の店員" = "はいっ、アイスコーヒーね！"
"1014803-38-イロハ" = "……どうも。"
"1014803-39-イロハ" = "これで十分ですよ。"
"1014803-40" = "（その後も散策を続けた）"
"1014803-41" = "（そして……）"
"1014803-42-イロハ" = "……。"
"1014803-43-イロハ" = "……。"
"1014803-44" = "[s13] \"読書に戻っちゃった……。\"\n[s14] \"さっきと同じだよね？\""
"1014803-45-イロハ" = "全然違いますよ。"
"1014803-46-イロハ" = "アイスコーヒー。手を置くのにちょうどいい浮き輪。#nそれに大きなパラソルまでありますから。"
"1014803-47-イロハ" = "これはこれで、意外に良いですね。"
"1014803-48" = "（日が沈むまで、イロハと一緒に読書を楽しんだ）"
