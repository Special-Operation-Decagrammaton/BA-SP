[translation]
"1014805-1" = "アウスフルークレリンと夏休みの終わり"
"1014805-2-イロハ" = "先生。"
"1014805-3-イロハ" = "時間きっかりですね。"
"1014805-4-イロハ" = "まあ、急ぐ旅路でもありませんが。"
"1014805-5-イロハ" = "では、行きましょうか。"
"1014805-6-イロハ" = "へぇ……ミレニアム[ruby=エキスポ]EXPO[/ruby]。面白そうですね。"
"1014805-7-イロハ" = "……はい？#nああ、ミレニアムには業務で何度か。"
"1014805-8-イロハ" = "[ruby=パンデモニウム・ソサエティー]万魔殿は他校と[/ruby]の交流に関心があるほうでして。"
"1014805-9-イロハ" = "とはいえ、まともに観光したことはないですね。"
"1014805-10-イロハ" = "今年のEXPOは終わってしまったみたいですし……。"
"1014805-11-イロハ" = "もしも来年があるなら、ご一緒しませんか？"
"1014805-12-イロハ" = "もちろん、二人きりで。"
"1014805-13-イロハ" = "この駅……降りたことはなかったですね。"
"1014805-14-イロハ" = "先生もですか？"
"1014805-15-イロハ" = "ふふっ。では、お互い初めての場所ということで。"
"1014805-16-イロハ" = "気の向くままに行ってみましょうか。"
"1014805-17-イロハ" = "賑わってますね。"
"1014805-18-イロハ" = "ゲヘナじゃこういうローカルな商店街が減ってきてまして。#n大型ショッピングセンターの勢いがなんとも。"
"1014805-19-イロハ" = "個人的には残念です。小さなお店を見て歩くのが好きなので。"
"1014805-20-イロハ" = "あ。あのお店、見てもいいですか？"
"1014805-21-イロハ" = "お土産屋さんのようですが……。"
"1014805-22-イロハ" = "これは……？"
"1014805-23-イロハ" = "プレスされた……イカ？"
"1014805-24-店主" = "ところがどっこい、本物じゃないんです！"
"1014805-25-店主" = "うちの名物、イカ形せんべい！お一ついかがです？#nみなさん、お土産としてよく買ってイカれますよ。イカだけに！"
"1014805-26-イロハ" = "これ……本当に人気なんですか……？"
"1014805-27-店主" = "それにしても、デートですか？#nこんな所までいらっしゃるなんて珍しい。"
"1014805-28-イロハ" = "……はい？"
"1014805-29-店主" = "あっ、すみません。良い雰囲気だったので、つい……。"
"1014805-30-イロハ" = "……いえ。"
"1014805-31-イロハ" = "……せっかくなので1箱もらいます。"
"1014805-32-店主" = "イカ形せんべいお買い上げ！ありがとうございます！#n少々お待ちください！"
"1014805-33-イロハ" = "ふふっ。聞きました？"
"1014805-34-イロハ" = "悪い気はしませんね。"
"1014805-35-イロハ" = "先生は……どうです？"
"1014805-36" = "（その後もいろいろな場所を見て回った）"
"1014805-37-イロハ" = "このカフェで一休みしましょうか。"
"1014805-38-イロハ" = "少し疲れました。たくさん歩いたので。"
"1014805-39-イロハ" = "なに飲みます？ご馳走しますよ。"
"1014805-40-イロハ" = "いえ、いいですよ、これくらい。#n付き合わせてるのは私ですし。"
"1014805-41-イロハ" = "え？なんでそうなるんですか。いいって言ってるのに……。#nいや、全部出す、って……自分の分は自分で出しますから――"
"1014805-42-イロハ" = "雰囲気は良いのにガラガラですね。人通りの少ない所にあるからでしょうか。"
"1014805-43-イロハ" = "まあ、貸し切りみたいで良いですけど。"
"1014805-44-イロハ" = "ふぅ……落ち着きますね。"
"1014805-45-イロハ" = "うるさすぎるんですよ、ゲヘナは。人も多いですし。"
"1014805-46-イロハ" = "それも悪くはないんですけど。#n……時々、疲れます。"
"1014805-47-イロハ" = "それで……その度に想像するんです。"
"1014805-48-イロハ" = "全て投げ出して、静かな場所でのんびりするのを。"
"1014805-49-イロハ" = "そういうの、先生もやりませんか？"
"1014805-50-イロハ" = "だって、大概忙しいですよね。"
"1014805-51-イロハ" = "やっぱり……先生なら、一緒に逃げるのも悪くないかもしれません。"
"1014805-52-イロハ" = "次、ですか？"
"1014805-53-イロハ" = "そうですね……。"
"1014805-54-イロハ" = "ここ、海が近いですし。"
"1014805-55-イロハ" = "せっかくなので、行ってみませんか？"
"1014805-56-イロハ" = "有名ではないので、賑わってはいないでしょうけど……。"
"1014805-57-イロハ" = "実は、持ってきてまして。"
"1014805-58-イロハ" = "水着。"
"1014805-59-イロハ" = "ふぅ……。"
"1014805-60-イロハ" = "海風が気持ち良い……。"
"1014805-61-イロハ" = "思ったより良い所ですね。"
"1014805-62-イロハ" = "……先生？"
"1014805-63-イロハ" = "もっとこっちに来ないんですか？"
"1014805-64-イロハ" = "服が濡れるとか心配してます？"
"1014805-65-イロハ" = "大丈夫ですよ。そこまでは波がいかないので。"
"1014805-66-イロハ" = "ほら。"
"1014805-67-イロハ" = "近くで見ると、もっときれいですよ？"
"1014805-68-イロハ" = "……。"
"1014805-69-イロハ" = "えいっ。"
"1014805-70" = "[wa:2120]― [log=이로하 수영복]ふふっ。[/log]"
"1014805-71" = "― [log=이로하 수영복]いい顔をしますね。[/log]"
"1014805-72" = "― [log=이로하 수영복]怒らないでください。[/log]"
"1014805-73" = "― [log=이로하 수영복]かわいいイタズラじゃないですか。[/log]"
"1014805-74" = "[wa:620]― [log=이로하 수영복]砂、[wa:1470]温かいですよね。[/log]"
"1014805-75" = "― [log=이로하 수영복]まだ昼の熱が残っていて……。[/log]"
"1014805-76" = "[wa:360]― [log=이로하 수영복]……今日1日、[wa:1710]楽しかったです。[/log]"
"1014805-77" = "― [log=이로하 수영복]先生も？[/log]"
"1014805-78" = "― [log=이로하 수영복]……そうですか。[/log]"
"1014805-79" = "[wa:620]― [log=이로하 수영복]それならいっそ……[/log]"
"1014805-80" = "― [log=이로하 수영복]帰るの、[wa:1580]やめません？[/log]"
"1014805-81" = "[wa:3610]― [log=이로하 수영복]このまま、[wa:1680]どこか遠くへ……[wa:3010]なんて。[/log]"
"1014805-82" = "[ns] \"……イロハ。\""
"1014805-83" = "[ns] \"良い子は帰る時間だよ。\""
"1014805-84-イロハ" = "ちぇっ。"
"1014805-85-イロハ" = "手強いですね。"
"1014805-86" = "[s1] \"今日、楽しめた？\"\n[s2] \"明日から頑張れそう？\""
"1014805-87-イロハ" = "……どうでしょう。"
"1014805-88-イロハ" = "人間は欲張りな生き物ですから。"
"1014805-89-イロハ" = "って、知ってたんですね。今日がどういう日なのか。"
"1014805-90-イロハ" = "夏休みは今日でおしまい。"
"1014805-91-イロハ" = "明日からは、面倒で怠い日常に逆戻りです。"
"1014805-92-イロハ" = "なのでスペシャルだったのですが……。#nまさか最後まで付き合ってくれるとは。想定外です。"
"1014805-93" = "[s3] \"イロハはいつも頑張ってるから。\"\n[s4] \"私たち、サボり仲間だし。\""
"1014805-94-イロハ" = "またそういうことを言って……。"
"1014805-95-イロハ" = "さっきの提案。"
"1014805-96-イロハ" = "しばらく有効なので。"
"1014805-97-イロハ" = "今は「ノー」でしょうけど……。"
"1014805-98-イロハ" = "いつか「イエス」になるはずです。"
