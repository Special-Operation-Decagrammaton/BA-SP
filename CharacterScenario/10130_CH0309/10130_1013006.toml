[translation]
"1013006-1" = "夕暮れのハーモニカ"
"1013006-2" = "[ns] \"スバルの欲しいもの探しだ！！！\""
"1013006-3-スバル" = "こ、声が大きいです！！！"
"1013006-4" = "[s] \"せっかくだし、楽しまなきゃ！！\""
"1013006-5-スバル" = "こういう時の先生は本当に……！"
"1013006-6-スバル" = "それで……何が欲しかったのか、といいますと。"
"1013006-7-スバル" = "えっと……。"
"1013006-8-スバル" = "……。"
"1013006-9-スバル" = "楽譜、です。"
"1013006-10" = "[s] \"ん？ごめん、よく聞こえなかった。\""
"1013006-11-スバル" = "う、うぅ……だ、だから。"
"1013006-12-スバル" = "……。"
"1013006-13-スバル" = "楽譜です、楽譜っ！！できれば、ハーモニカで吹けるやつのっ！"
"1013006-14-スバル" = "ふぅ……。"
"1013006-15" = "[s] \"満足した？\""
"1013006-16-スバル" = "満足……。"
"1013006-17-スバル" = "したような、してないような。"
"1013006-18-スバル" = "初めてのショッピングというものをした割には、楽しめた気がする、といいますか。"
"1013006-19" = "[s] \"……また来ようね。\""
"1013006-20-スバル" = "ショッピングにですか？"
"1013006-21-スバル" = "無理ですよ。私あまりお金ないですし。"
"1013006-22-スバル" = "えっ？今日もそんなにお金を使ったわけではない、って……？"
"1013006-23-スバル" = "それはそうなんですが……。"
"1013006-24-スバル" = "ただ見て回るだけでも、楽しいけど……。"
"1013006-25-スバル" = "でも……「いつか手に入れたくなる」じゃないですか。"
"1013006-26-スバル" = "そんな欲望のおかげで生きる気力が湧く方もいるんでしょうけど……。#n私は、その気持ちを抑えなくては、と思ってしまうんです。"
"1013006-27-スバル" = "欲望はその場では満たせても、また次の欲望が生まれます……。"
"1013006-28-スバル" = "結局、満たされるものなんてないんです。悲しいですが。"
"1013006-29-スバル" = "……。"
"1013006-30-スバル" = "先生。私はもしかしたら……何事にも完璧な答えを求めているのかもしれません。"
"1013006-31-スバル" = "「満たされる欲望」と同じくらい、ありえない話かもしれないです。#nでも、もしかしたら、どこかに正解があるのかも、なんて――"
"1013006-32-スバル" = "そんな期待を、抱いているんです。"
"1013006-33-スバル" = "解決できない、答えのない問題に、たくさん出会ってきましたから。"
"1013006-34" = "[ns1] \"……うん。\"\n[ns2] \"スバルはそれを言う資格があると思う。\""
"1013006-35-スバル" = "……ありがとうございます。"
"1013006-36-スバル" = "でも、こんなことを考えたところで、空しいだけですよね。ははっ。"
"1013006-37" = "[ns3] \"そんなことないよ。\"\n[ns4] \"たとえそうだとしても、今を頑張らない理由にはならないから。\""
"1013006-38-スバル" = "……。"
"1013006-39" = "[s5] \"スバルがハーモニカを演奏することも。\"\n[s6] \"楽譜を買ったことも。\"\n[s7] \"いつか全部消えたとしても、意味があることだからね。\""
"1013006-40-スバル" = "……！"
"1013006-41-スバル" = "……はい。"
"1013006-42-スバル" = "音は、すぐ消えてしまうけれど……心に刻まれるものですからね。"
"1013006-43-スバル" = "……私は、ときどき恥ずかしくなりますけど。"
"1013006-44-スバル" = "趣味を恥ずかしがることない……？わ、分かってますよ、頭では。"
"1013006-45-スバル" = "私にとっては心が和むものですし、後輩のみんなも喜んでくれます。"
"1013006-46-スバル" = "でも、それ以前に……。"
"1013006-47-スバル" = "自分をかっこよく見せるためにやってるんじゃないか？と思う時があるんです。"
"1013006-48-スバル" = "わーっ……こ、言葉にすると恥ずかしいですね……！"
"1013006-49" = "[ns8] \"大丈夫、大丈夫。\"\n[ns9] \"いいんだよそれで。\""
"1013006-50-スバル" = "もう、他人事みたいに……。"
"1013006-51-スバル" = "……。"
"1013006-52-スバル" = "先生。"
"1013006-53-スバル" = "よかったら川の方に行きませんか？"
"1013006-54-スバル" = "先生に聞かせたいものがあって。"
"1013006-55" = "（スバルに連れられてゆっくり川へ向かった）"
"1013006-56" = "（そうこうしているうちに、夕方になっていた）"
"1013006-57" = "（スバルは立ち止まると、ハーモニカを吹き始めた）"
"1013006-58" = "（夕風が頬を撫でる中、綺麗な音色が響く）"
"1013006-59" = "[wa:1890]― [log=니코 스바루]なんだか、[wa:1380]新鮮な気持ちです。[/log]"
"1013006-60" = "― [log=니코 스바루]こうして誰か[wa:660]一人のために[wa:820]演奏するのは[wa:1380]初めてで……。[/log]"
"1013006-61" = "[wa:770]― [log=니코 스바루]どう、[wa:1440]でしたでしょうか？[/log]"
"1013006-62" = "― [log=니코 스바루]変じゃ、[wa:1890]なかったですか……？[/log]"
"1013006-63" = "[ns] \"最高の演奏だったよ。\""
"1013006-64" = "[wa:1260]― [log=니코 스바루]それって……[wa:1760]その、[/log]"
"1013006-65" = "― [log=니코 스바루]本心、[wa:1510]と受け取って[wa:770]いいんですよね？[/log]"
"1013006-66" = "― [log=니코 스바루]……ありがとうございます。[/log]"
"1013006-67" = "[wa:400]― [log=니코 스바루]本当は、[wa:1440]他に何かできることが[wa:1190]あれば[/log]"
"1013006-68" = "― [log=니코 스바루]よかったのですが……。[/log]"
"1013006-69" = "― [log=니코 스바루]今の私には、[/log]"
"1013006-70" = "― [log=니코 스바루]これくらいしかなくて……。[/log]"
"1013006-71" = "[wa:370]― [log=니코 스바루]えっ？[/log]"
"1013006-72" = "― [log=니코 스바루]「また練習したら[wa:930]聞かせてほしい」……？[/log]"
"1013006-73" = "― [log=니코 스바루]「楽譜も[wa:790]たくさん買ったから」……？[/log]"
"1013006-74" = "[wa:360]― [log=니코 스바루]そ、[wa:990]それは……。[/log]"
"1013006-75" = "― [log=니코 스바루]また……[wa:1320]その時になったら、[/log]"
"1013006-76" = "― [log=니코 스바루]考えさせてください。[/log]"
