[translation]
"1013003-1" = "最初の一歩"
"1013003-2-スバル" = "こんにちは、せんせ……ん？"
"1013003-3-スバル" = "なっ、なんですかこれ！？"
"1013003-4" = "[ns] \"スバルの初当番記念パーティーだよ！\""
"1013003-5-スバル" = "ちょっと、大げさですよ先生。#n私、そういうの苦手で……。"
"1013003-6-スバル" = "特別扱いされすぎても、なんだか辛いというか……。"
"1013003-7-スバル" = "……あっ、冷たくされてもそれなりに傷つきますけど。"
"1013003-8" = "[s] \"難しいね……。\""
"1013003-9-スバル" = "あははっ。私たちくらいの年頃の生徒は、#nこの世で一番難しい生き物らしいですよ？"
"1013003-10-スバル" = "それでは先生。初めての当番ですが、ご指導よろしくお願いします。"
"1013003-11-スバル" = "ふぅ……。 "
"1013003-12" = "[s1] \"少し休む？\"\n[s2] \"はい、コーヒー。\""
"1013003-13-スバル" = "あっ。ありがとうございます、先生。"
"1013003-14-スバル" = "コーヒー……ふふ。"
"1013003-15-スバル" = "知ってますか？先生。#nアリウスでもコーヒーやお茶「のようなもの」がよく飲まれていたんです。"
"1013003-16" = "[s] \"そうなんだ？\""
"1013003-17-スバル" = "はい。野生種のレタスやタンポポ、枯れたカブの根っこ、#nアザミ、ニガナの葉、余った食材の野菜たち……。"
"1013003-18-スバル" = "そういったものをローストしてすりつぶすと……。#nコーヒーの色をした何かができました。"
"1013003-19-スバル" = "成績優秀者が温かい水をもらえる「ウォータータイム」のときに、それを飲むんです。"
"1013003-20-スバル" = "もちろん、バレたら贅沢をするなと怒られるので……こっそりと。"
"1013003-21" = "[s3] \"……他に飲みたいものはない？食べ物でもいいよ！\"\n[s4] \"なんでも買ってあげる！好きなだけ言って！\""
"1013003-22-スバル" = "さっきも言いましたけど、大げさですってば！"
"1013003-23" = "（慌てて食べ物や飲み物を持ってくると……）"
"1013003-24" = "（スバルは黙々と、とてもおいしそうに食べていた）"
"1013003-25-スバル" = "あの……先生？"
"1013003-26" = "[s] \"うん？\""
"1013003-27-スバル" = "この前、相談に乗ってくださるといってましたよね？"
"1013003-28" = "[s] \"ええ！なんなりと！！\""
"1013003-29-スバル" = "だから、それやめてくださいってば！"
"1013003-30-スバル" = "……。"
"1013003-31-スバル" = "外の世界は……知らないことばかりで。"
"1013003-32-スバル" = "当たり前なんでしょうけど。"
"1013003-33-スバル" = "でも、そのせいか……。"
"1013003-34-スバル" = "最近なんというか、心が……。"
"1013003-35-スバル" = "ふわふわ？ソワソワ……？なんだか落ち着かなくて……。#nいろいろなものが、混ぜこぜになっているような……。"
"1013003-36-スバル" = "そうですね……。"
"1013003-37-スバル" = "……。"
"1013003-38-スバル" = "やっぱり、どこか許せないものがあるのでしょう。"
"1013003-39-スバル" = "トリニティにも、アリウスにも……。"
"1013003-40-スバル" = "もちろん、自分にも。"
"1013003-41-スバル" = "とても不思議な気持ちになるんです。"
"1013003-42-スバル" = "今も心のどこかで、トリニティが痛い目に遭えばいいと思っている私がいます。"
"1013003-43-スバル" = "でも、アリウスがいつかトリニティに勝つ日まで――"
"1013003-44-スバル" = "何も起こらず、孤高で在って欲しいとも思います。"
"1013003-45-スバル" = "トリニティという学園だけでなく、トリニティ生一人一人も、ですね。"
"1013003-46-スバル" = "私は……自分も含めたアリウスのみんなで、トリニティよりも良い暮らしをするのが目標の一つです。"
"1013003-47-スバル" = "……でも、過激なことをしてまで、それを達成したいわけではありません。"
"1013003-48-スバル" = "……えっ？それは、いい意味での「ライバル意識」……？"
"1013003-49-スバル" = "……。"
"1013003-50-スバル" = "なんかちょっと今、腹が立ちました……。"
"1013003-51-スバル" = "いや、先生の言葉は正しいと思いますよ。#nだからこそ、ですね。"
"1013003-52-スバル" = "はぁ……。"
"1013003-53" = "[s] \"年頃の生徒は難しいね……。\""
"1013003-54-スバル" = "いまさら後悔しているんですか？相談に乗るなんて言ってしまって。"
"1013003-55-スバル" = "……むしろ素直に言ってくれて嬉しい？いつも後輩たちの前では笑顔だから？"
"1013003-56-スバル" = "……！"
"1013003-57-スバル" = "先生って悪い人ですね……。"
"1013003-58" = "[s] \"そう、悪いのは先生！\""
"1013003-59-スバル" = "ほんと、ひどい……。"
"1013003-60" = "[ns] \"そう、ひどいのは先生だからね。\""
"1013003-61" = "[ns] \"あと、複雑な気持ちになるのは、普通のことだよ。\""
"1013003-62-スバル" = "……？"
"1013003-63-スバル" = "いろんな感情を同時に抱くのは――"
"1013003-64-スバル" = "いたって普通のこと……なんでしょうか？"
"1013003-65-スバル" = "……では、いったい何が正しいのでしょう。"
"1013003-66" = "[s5] \"スバルが良いと思ったこと？\"\n[s6] \"スバルが正しいと思ったこと？\""
"1013003-67-スバル" = "選ばなかった方は、あとでゆっくり考えればいい……？"
"1013003-68-スバル" = "大事なのは、自分の選択肢に責任をとること――"
"1013003-69-スバル" = "でも、抱えきれそうにないその時は、いつでも連絡して……ですか？"
"1013003-70-スバル" = "あははっ、なんですかそれ……。#n結局、何も解決してないじゃないですか。"
"1013003-71" = "[s] \"でも、生きるってその繰り返しだから。\""
"1013003-72-スバル" = "……そうなんですか？"
"1013003-73" = "[s] \"うん。\""
"1013003-74-スバル" = "思ったよりもずっと……めちゃくちゃなんですね。"
"1013003-75" = "[s7] \"そうだね、でも……。\"\n[s8] \"みんなそうやって、今を精一杯生きてるみたい。\""
"1013003-76-スバル" = "……。"
"1013003-77-スバル" = "そうなんだ。"
"1013003-78" = "[s9] \"そうそう。\"\n[s10] \"あと、口がうまい人には騙されないように！\""
"1013003-79-スバル" = "なっ。それ、先生が言うんですか！？"
"1013003-80-スバル" = "本当、先生って変な人です。"
"1013003-81-スバル" = "うん……。"
"1013003-82-スバル" = "本当に。"
"1013003-83-スバル" = "変な人……。"
"1013003-84-スバル" = "……ふふ。"
"1013003-85" = "[s] \"スバル。\""
"1013003-86-スバル" = "？"
"1013003-87" = "[s] \"大変だったね。\""
"1013003-88-スバル" = "……え？"
"1013003-89-スバル" = "……あれ。"
"1013003-90-スバル" = "ちょ、ちょっとあっちを向いててください！"
"1013003-91-スバル" = "えっ？ティッシュはテーブルにある……？"
"1013003-92-スバル" = "もう、先生……一言余計です！"
