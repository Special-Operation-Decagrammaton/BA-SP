[translation]
"1013008-1" = "The Giving Girl"
"1013008-2-アリウスの生徒A" = "こんにちは、スバル先輩！あっ、先生もこんにちは！"
"1013008-3-スバル" = "こんにちは。今日も元気そうでなによりです。"
"1013008-4-アリウスの生徒A" = "あれ？先輩、それってもしかして……！"
"1013008-5-アリウスの生徒A" = "伝説の、うんめえ棒バーベキューチーズ味ですか！？"
"1013008-6-スバル" = "えっ、え？"
"1013008-7-スバル" = "そ、そうですが……。"
"1013008-8-スバル" = "……。"
"1013008-9-スバル" = "食べたいですか？"
"1013008-10-アリウスの生徒A" = "い、いいんですか……！？"
"1013008-11-スバル" = "ふふっ、どうぞ。"
"1013008-12-アリウスの生徒A" = "……ありがとうございます！"
"1013008-13-スバル" = "……。"
"1013008-14-スバル" = "（あとで食べようと思ってたけど……）"
"1013008-15" = "[s] \"大丈夫？スバル。\""
"1013008-16-スバル" = "あっ、はい！もちろんです！"
"1013008-17-スバル" = "き、気にしてるように見えましたか？"
"1013008-18-スバル" = "……考え過ぎですよ！"
"1013008-19-アリウスの生徒B" = "えっ？カスタードプリン味ジュース！？"
"1013008-20-アリウスの生徒B" = "あの幻の存在と言われるカスタードプリンの……ジュース版……！？"
"1013008-21-スバル" = "……そ、そうですね。"
"1013008-22-アリウスの生徒B" = "……。"
"1013008-23-アリウスの生徒B" = "あのぉ……先輩。"
"1013008-24-アリウスの生徒B" = "ひ、一口だけ……その、ダメですか？"
"1013008-25-スバル" = "……。"
"1013008-26-スバル" = "いいですよ。全部あげます。"
"1013008-27-アリウスの生徒B" = "いいんですかっ！？"
"1013008-28-スバル" = "もちろん。#nでも、もしよかったら他の子たちにも分けてくれると嬉しいかな、なんて。"
"1013008-29-アリウスの生徒B" = "ありがとうございます！先輩！"
"1013008-30-スバル" = "（手に入れるの、結構大変だったやつだけど……）"
"1013008-31" = "[s] \"……大丈夫？\""
"1013008-32-スバル" = "へっ！？"
"1013008-33-スバル" = "……。"
"1013008-34-スバル" = "も、もちろん！"
"1013008-35-アリウスの生徒C" = "わあ、ありがとうございます！"
"1013008-36-スバル" = "よかった。"
"1013008-37-アリウスの生徒D" = "ありがとうございます、大事にしますね先輩！#n最高です！"
"1013008-38-スバル" = "は、はい……。"
"1013008-39" = "（その後も同じような流れが続き……）"
"1013008-40" = "（見回りを終えたスバルの手には、ほとんど何も残っていなかった）"
"1013008-41-スバル" = "……。"
"1013008-42" = "[s] \"……。\""
"1013008-43-スバル" = "……。"
"1013008-44" = "[s] \"……。\""
"1013008-45-スバル" = "ど、どうしてじっと見ているんです……？"
"1013008-46" = "[s] \"私の前では隠さなくていいんだよ……。\""
"1013008-47-スバル" = "ほ、本当にそういうんじゃないですから！"
"1013008-48-スバル" = "……でもやっぱり。"
"1013008-49-スバル" = "さっきのはたしかに、ちょっと残念というか……。"
"1013008-50" = "[s1] \"これはいけませんね、スバルさん。\" \n[s2] \"ちょっとこちらへ……。\""
"1013008-51-スバル" = "……えっ？  "
"1013008-52-スバル" = "せ、先生？なぜここに……。"
"1013008-53-スバル" = "まずは食べて……？って。"
"1013008-54-スバル" = "……。"
"1013008-55-スバル" = "イヤです。私、先生が何を考えているのか、だいたい分かってますから！#n絶対わたし――"
"1013008-56-ウェイター" = "お待たせしました。ごゆっくりどうぞ。"
"1013008-57" = "[ns] \"……本当にいいの？\""
"1013008-58-スバル" = "だ、大丈夫です！私は平気なので！"
"1013008-59-スバル" = "き、聞いてみただけですから！"
"1013008-60-スバル" = "でも、なんだか私の好きなものばかり……ですね？"
"1013008-61" = "[s3] \"まあね！\"\n[s4] \"この間の初当番記念パーティで、見てたから！\""
"1013008-62-スバル" = "！！！"
"1013008-63-スバル" = "あ、あの時はお世話になりました……が！今回はお気持ちだけいただきます！"
"1013008-64" = "（意地っ張りだなぁと思いつつ、周りを見渡していると）"
"1013008-65" = "（料理の一部が……なくなっていた！）"
"1013008-66" = "（その後も何度か、あちこちよそ見をしていると……）"
"1013008-67" = "（その都度、料理は着実になくなっていった！）"
"1013008-68" = "[ns] \"おかしいなぁ～\""
"1013008-69-スバル" = "なっ、何ですか。どうかしましたか？"
"1013008-70" = "[s] \"なんだか料理が減ってる気がして。\""
"1013008-71-スバル" = "せ、先生が食べたんじゃないんですか……？"
"1013008-72-スバル" = "な、なんですかそのお顔は……？"
"1013008-73-スバル" = "……も、もう！わ、分かりましたよ！"
"1013008-74-スバル" = "……。"
"1013008-75-スバル" = "そうです、私が食べました！ "
"1013008-76-スバル" = "……先生、こんな大食いの生徒は嫌ですよね？"
"1013008-77" = "[s] \"……！\""
"1013008-78" = "[ns5] \"そんなわけない！たくさん食べて、たくさん大きくならないと！\"\n[ns6] \"食べる姿を見てるだけで幸せ！\""
"1013008-79-スバル" = "そ、そうなんですか……？"
"1013008-80-スバル" = "……。"
"1013008-81-スバル" = "ありがとう、ございます……。"
"1013008-82-スバル" = "えっ……？スバルにはまだ不器用なところがある……？"
"1013008-83-スバル" = "素直じゃない……？"
"1013008-84-スバル" = "……先生。そういうこと、他の子にも言ってませんよね？"
"1013008-85-スバル" = "あのー、なんで目をそらすんですか？ちゃんとこっちを見てください。"
"1013008-86" = "（なんとかスバルの追求をかわしつつ、あちこちに連れ出した！）"
"1013008-87" = "[ns] \"どうだった？\""
"1013008-88-スバル" = "どうと言われましても……うーん。"
"1013008-89-スバル" = "よく分からない、というよりも……。"
"1013008-90-スバル" = "経験がなく、慣れていないといった感じでしょうか。"
"1013008-91-スバル" = "前にも、「学外での活動」はありましたけど……。"
"1013008-92-スバル" = "こんな「陽の当たる場所」で……。"
"1013008-93-スバル" = "穏やかな時間を過ごしたことはないので……。"
"1013008-94-スバル" = "……！？"
"1013008-95-スバル" = "この音はなんですか先生！？"
"1013008-96-スバル" = "人間の死こそがエコロジィイイイイ――――！！"
"1013008-97" = "（目を輝かせるスバルを連れてCD屋に入った）"
"1013008-98-スバル" = "へびー、めたる……？これがヘビーメタルというものなんですね！"
"1013008-99-スバル" = "えっと、なんといいますか……。"
"1013008-100-スバル" = "強烈ですね！"
"1013008-101" = "[ns] \"だ、だよね！\""
"1013008-102-スバル" = "このスピード感と勢い……まるで成型炸薬弾です！"
"1013008-103-スバル" = "なにより、「こんな世界ぶっ壊しちまえ」という歌詞が気に入りました！！"
"1013008-104" = "[ns] \"実行するのはやめてね！\""
"1013008-105-スバル" = "ふぅ……すごかったです、先生。 "
"1013008-106-スバル" = "今もまだ、耳と胸が、ドンドン鳴ってるみたいで……。"
"1013008-107-スバル" = "えっ？メタラーになる素質がありそう……？"
"1013008-108-スバル" = "うーん、よく分かりません……ただ、自然と強く惹かれたというか。"
"1013008-109-スバル" = "……特に歌詞に。"
"1013008-110" = "[s] \"……やっぱり、世界が終わってほしい？\""
"1013008-111-スバル" = "……。"
"1013008-112-スバル" = "どうでしょう。私にもよく分かりません。 "
"1013008-113-スバル" = "そんな気持ちがするような、しないような。"
"1013008-114-スバル" = "でも先生も言っていましたよね。感情は単純なものじゃないって……なら。"
"1013008-115-スバル" = "……。"
"1013008-116-スバル" = "先生が私に「この世界はいいものだよ」って、#n確信を持たせてくれればいいんじゃないですか？"
"1013008-117" = "[ns] \"くっ……そう来たか……。\""
"1013008-118-スバル" = "だって先生「大人」じゃないですか。"
"1013008-119" = "[s] \"それはね、無敵の言葉じゃないんだよ……？\""
"1013008-120-スバル" = "ええ？でも、今までご自身で言ってたじゃないですか？"
"1013008-121" = "[s] \"確かに否定はできない……。\""
"1013008-122" = "（そうしてスバルと話しながら、帰路に就いた）"
