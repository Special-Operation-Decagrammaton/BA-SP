[translation]
"1008002-1" = "[ruby=メンタルアウト]心理掌握[/ruby]"
"1008002-2" = "（商店街の落ち着いた雰囲気のあるカフェに[ruby=しょくほう]、食蜂が[/ruby]いるのが見えた）"
"1008002-3-食蜂操祈" = "……あらぁ、先生？"
"1008002-4-食蜂操祈" = "奇遇ねぇ、こんなところで会えるなんて。"
"1008002-5-食蜂操祈" = "今日は良いこと続きだし、ラッキーな日かも？"
"1008002-6" = "[s1] ラッキー？\n[s2] 何かあったの？"
"1008002-7-食蜂操祈" = "そうねぇ……今日は天気にも恵まれたしぃ……"
"1008002-8-食蜂操祈" = "素敵なオーガニックカフェも見つけたわぁ。"
"1008002-9-食蜂操祈" = "……それと、待ち望んでいた人にも会えたし？"
"1008002-10-食蜂操祈" = "結構ラッキーな日と言っても、いいんじゃないかしらぁ？"
"1008002-11-食蜂操祈" = "……先生も同じ気持ち？ふぅん、そう。"
"1008002-12-食蜂操祈" = "残念だけど、今は「確認」する手段が無いのよねぇ。#nまぁ、先生は信頼できそうだしぃ、そういうことにしておいてあげる。"
"1008002-13-食蜂操祈" = "……ん？確認？言葉通りの意味よぉ？"
"1008002-14-食蜂操祈" = "生憎と、ここに来てからは別として、いつもは確認してるの。"
"1008002-15-食蜂操祈" = "相手が何を考えているのかとかぁ、どんな思惑を持っているのか、とかね。"
"1008002-16-食蜂操祈" = "頭の中を見てみないことには、本心なんて分からないでしょう？"
"1008002-17-食蜂操祈" = "でも、ここでは力が使えないのよねぇ。#n本当に困ったものだわぁ。"
"1008002-18-食蜂操祈" = "……まぁ、ちょ～っと本気を出せば、使えなくはないけどぉ☆"
"1008002-19-食蜂操祈" = "ふーん？"
"1008002-20-食蜂操祈" = "……もしかして、警戒、させちゃったかしら？"
"1008002-21" = "[s3] \"ううん。ただ、何か困ってないかなと思って。\"\n[s4] \"いつもと違う状況だと、落ち着かないよね。\""
"1008002-22-食蜂操祈" = "……あらぁ？"
"1008002-23-食蜂操祈" = "警戒しないのねぇ？#nまぁ、そんな予測力はあったけどぉ。"
"1008002-24-食蜂操祈" = "……信用してくれてありがとう、って？"
"1008002-25-食蜂操祈" = "まったく、変わった人ねぇ……私が言うのも何だけど。"
"1008002-26-食蜂操祈" = "状況が状況だけに、仕方なくだしぃ。"
"1008002-27-食蜂操祈" = "……ガッカリしたかしらぁ？"
"1008002-28" = "[s5] \"そんなことないよ。\"\n[s6] \"慣れない場所で、頑張ってると思うよ。\""
"1008002-29-食蜂操祈" = "……疑うのがバカらしくなるくらい良い人ね、あなた。"
"1008002-30-食蜂操祈" = "逆に確認したくなるわねぇ。#nやっぱり、一度覗いてみようかしら？"
"1008002-31-食蜂操祈" = "……え？"
"1008002-32-食蜂操祈" = "むしろ、覗かれたい、操作されたいって……？"
"1008002-33-食蜂操祈" = "さすがに、ちょっとビックリしちゃったかも。"
"1008002-34-食蜂操祈" = "ちょっと疑問力が湧いたわね……具体的に、どういうことかしらぁ？"
"1008002-35-食蜂操祈" = "仕事が多くて大変だから、逃げたくなっちゃう、って？"
"1008002-36-食蜂操祈" = "……つまりぃ？"
"1008002-37-食蜂操祈" = "操作されていたら、怒られずに済むってコトかしらぁ？"
"1008002-38-食蜂操祈" = "……先生。"
"1008002-39-食蜂操祈" = "せっかく私が褒めてあげたのにぃ、さっきの言葉、取り消しちゃうゾ？#nもしかしたら、良い人かもって思ってたけど……ただのおバカさんだったのかもねぇ。"
"1008002-40-食蜂操祈" = "それとも、わざとなのかもしれないけどぉ？"
"1008002-41-食蜂操祈" = "ま、大人なんだから、それくらい自分で何とかなさい？"
"1008002-42-食蜂操祈" = "私の能力をそんな風に使ってほしいなんて言ってきたの、あなたが初めてよぉ？"
"1008002-43-食蜂操祈" = "…………。"
"1008002-44-食蜂操祈" = "ダメなものはダメなんだゾ☆#n仮に能力を使うとしても、それだけは無いかしら。"
"1008002-45-食蜂操祈" = "ん～……ま、でも。 "
"1008002-46-食蜂操祈" = "私を助けてくれたお礼はしておきたいしぃ……"
"1008002-47" = "[s7] \"もしかして……\"\n[s8] \"今回だけは特別に……！？\""
"1008002-48-食蜂操祈" = "……。"
"1008002-49-食蜂操祈" = "まさか。#n冗談もほどほどにしないと怒っちゃうゾ☆"
"1008002-50-食蜂操祈" = "このオーガニックジュースでも飲んでみたら？#n眠気覚ましくらいにはなるかもねぇ。"
"1008002-51-食蜂操祈" = "それじゃ……"
"1008002-52-食蜂操祈" = "頑張ってね、先生。"
