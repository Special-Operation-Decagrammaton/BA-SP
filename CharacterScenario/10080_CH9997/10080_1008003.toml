[translation]
"1008003-1" = "頭脳労働専門"
"1008003-2" = "（近くのグラウンド[ruby=しょくほう]で食蜂と[/ruby]待ち合わせをした）"
"1008003-3-食蜂操祈" = "見当たらないと思ったら、こっちにいたのねぇ。"
"1008003-4-食蜂操祈" = "それで？なんで私を呼び出したのかしらぁ？"
"1008003-5-食蜂操祈" = "……ん？"
"1008003-6-食蜂操祈" = "外の空気に当たれば気分転換になると思った？"
"1008003-7-食蜂操祈" = "そう簡単に解決するとは思わないけどぉ……"
"1008003-8-食蜂操祈" = "ま、先生が言うのなら試してみましょうか。"
"1008003-9-食蜂操祈" = "……えぇ？"
"1008003-10-食蜂操祈" = "ジョギング？"
"1008003-11-食蜂操祈" = "んん……どうかしら。#nあんまり必要力を感じないというかぁ……"
"1008003-12-食蜂操祈" = "良い考えとは思えないんですけどぉ……"
"1008003-13-食蜂操祈" = "スマートな私には似合わないしぃ？"
"1008003-14-食蜂操祈" = "せ、先生！？まだお話は途中だゾ！？"
"1008003-15" = "[s1] \"きっと気が晴れるよ！\"\n[s2] \"大丈夫、軽くジョギングするだけだから！\""
"1008003-16-食蜂操祈" = "ちょ、ちょっと先生、引っ張らないでよぉ！！"
"1008003-17-食蜂操祈" = "まっ、待ちなさ――"
"1008003-18" = "（そしてグラウンド一周目……）"
"1008003-19" = "[ns] \"…………？\""
"1008003-20" = "[ns3] \"……食蜂？\"\n[ns4] \"あれ、どこに……？\""
"1008003-21-食蜂操祈" = "だ、からっ……はぁ……待って……ぜぇ……はぁ……"
"1008003-22-食蜂操祈" = "ぜぇ……はっ……はぁ……！"
"1008003-23-食蜂操祈" = "……ふう……ぅ……"
"1008003-24-食蜂操祈" = "もう……ダメ……"
"1008003-25" = "[ns5] \"……食蜂！？\"\n[ns6] \"大丈夫！？食蜂！食蜂！！\""
"1008003-26" = "（ふらふらの食蜂を連れて、急いで近くの病院に向かった）"
"1008003-27-食蜂操祈" = "…………。"
"1008003-28-食蜂操祈" = "んん……あらぁ……？"
"1008003-29-食蜂操祈" = "寝ちゃってたのねぇ……"
"1008003-30-食蜂操祈" = "……先生？"
"1008003-31-食蜂操祈" = "ずっと待っててくれたのかしら？#n……なによ、そんなに暗い顔してぇ。"
"1008003-32-食蜂操祈" = "……？"
"1008003-33-食蜂操祈" = "ごめん、って……？#n……ああ、さっきの？"
"1008003-34-食蜂操祈" = "謝られるとは思ってなかったわぁ。#nあんまり気にしないでちょうだい。"
"1008003-35-食蜂操祈" = "ふふ、思い通りにいかないからって、すぐ機嫌を損ねるような女だと思ったかしら？"
"1008003-36-食蜂操祈" = "……というか、倒れた時のこと……よく覚えてないんだけどぉ。"
"1008003-37-食蜂操祈" = "医者には診てもらったのよねぇ？#n検査結果はどうだったの？"
"1008003-38-食蜂操祈" = "異常力でも見つかったかしらぁ？"
"1008003-39-食蜂操祈" = "……ちょっと。"
"1008003-40-食蜂操祈" = "なんで目を逸らすのよ？早く聞かせてちょうだい。"
"1008003-41-食蜂操祈" = "もしかして、こっちに来たせいで……"
"1008003-42" = "[s7] \"いや、なんというか……。\"\n[s8] \"病気ではないんだけど……\""
"1008003-43-食蜂操祈" = "……？"
"1008003-44-食蜂操祈" = "病気じゃないなら、良かったじゃない。"
"1008003-45-食蜂操祈" = "医者が怒ってた……？"
"1008003-46-食蜂操祈" = "――もしかして。"
"1008003-47-食蜂操祈" = "日頃の運動不足をどうこう言われたのかしらぁ？"
"1008003-48-食蜂操祈" = "……コホン。"
"1008003-49-食蜂操祈" = "ま、まぁ……仕方ないでしょう。"
"1008003-50-食蜂操祈" = "私は頭脳労働専門だしぃ……？"
"1008003-51-食蜂操祈" = "…………。"
"1008003-52-食蜂操祈" = "……先生？"
"1008003-53-食蜂操祈" = "……別に、頭を覗いたわけじゃないけどぉ、先生が何を考えてるかくらい分かるわぁ。"
"1008003-54-食蜂操祈" = "そんなに見つめられても……"
"1008003-55-食蜂操祈" = "……やらないわよぉ？"
