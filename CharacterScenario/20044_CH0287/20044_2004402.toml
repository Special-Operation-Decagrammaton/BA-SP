[translation]
"2004402-1" = "スタジアムのアルバイト"
"2004402-2" = "（スミレと予定を合わせて、アスレチックスタジアムに来た）"
"2004402-3" = "（いまは、混雑してない時間帯だ）"
"2004402-4-スミレ" = "お待ちしておりました、トレーナー！"
"2004402-5" = "[s] \"バイト中？\""
"2004402-6-スミレ" = "ええ。制服で失礼します。"
"2004402-7-スミレ" = "今は観客席の皆さんに、ドリンクをお届けしているんです。"
"2004402-8-スミレ" = "いつもとは違う格好で働く……。"
"2004402-9-スミレ" = "これはこれで、新鮮な感覚ですね。"
"2004402-10-スミレ" = "普段のジムとはまた異なる体験ですが、"
"2004402-11-スミレ" = "この時間を楽しんでいます。"
"2004402-12-スミレ" = "では、トレーナーも一杯どうぞ。"
"2004402-13" = "（スミレからドリンクを受け取り、一口飲んだ）"
"2004402-14" = "[ns1] \"ところで、そのアルバイトが……\"\n[ns2] \"トレーニングにもなるってどういうこと？\""
"2004402-15-スミレ" = "覚えてくれていたとは、さすがトレーナーです！"
"2004402-16-スミレ" = "うん？なんか変な顔をしませんでしたか……？まぁ気のせいとしましょう。"
"2004402-17-スミレ" = "説明しますと――"
"2004402-18-スミレ" = "このドリンクサーバー、そこそこの重さがありまして！"
"2004402-19" = "[s] \"う、うん！？\""
"2004402-20-スミレ" = "えっと……つまり、正しいフォームでの動きが求められるんです。"
"2004402-21-スミレ" = "これはトレーニングの基本中の基本ですね。"
"2004402-22-スミレ" = "重量を意識するあまり、フォームが崩れていく――"
"2004402-23-スミレ" = "長時間のトレーニングでよく見られる現象ですが、それが怪我に繋がってしまうのです。"
"2004402-24-スミレ" = "なので、トレーナーも、トレーニングの際は正しいフォームを忘れないでくださいね！"
"2004402-25-スミレ" = "そして――"
"2004402-26-スミレ" = "このドリンクサーバーを背負って働くということは、つまり！"
"2004402-27-スミレ" = "アルバイトがトレーニングを兼ねるわけです！"
"2004402-28" = "[s] \"な、なるほどね！\""
"2004402-29-スミレ" = "今背負っているこれが、容量満タンの状態で、およそ20～25kgでしょうか。"
"2004402-30-スミレ" = "これが、低負荷・高回数の持久力トレーニングにはちょうどいい重さでして！"
"2004402-31-スミレ" = "さらに、お客様から注文が入ったときは、膝を曲げてドリンクを注ぐので――"
"2004402-32-スミレ" = "自然とフルスクワットの動きを取り入れられるんです！"
"2004402-33-スミレ" = "「フルスクワットは膝に悪い」との声もありますが、それは偏見がすぎます。"
"2004402-34-スミレ" = "さきほども言ったように、正しいフォームを維持すれば──"
"2004402-35-スミレ" = "怪我を避けつつ、全身をバランス良く鍛えられるメニューです。"
"2004402-36-スミレ" = "なので、むしろ私はジムではフルスクワットを推奨していますね。"
"2004402-37-スミレ" = "「崩れ落ちるか、もう一度立ち上がれるか」を筋肉から問われる瞬間は……たまらないものがありますから。"
"2004402-38" = "[s3] \"言ってることはわからないでもないけど……。\"\n[s4] \"あくまで、目的はアルバイトだよね……？\""
"2004402-39-スミレ" = "……そうでした。私は今、ドリンクの売り子です。"
"2004402-40-スミレ" = "トレーニングと同様、大切なのは、笑顔と思いやり……。"
"2004402-41-スミレ" = "ジムでもこの２つが欠けた瞬間……。"
"2004402-42-スミレ" = "次の日から、お客様が来なくなってしまいます！"
"2004402-43-スミレ" = "……そして、このアルバイトでは、ドリンクサーバーの重さに耐えられることが必須条件になっていまして。"
"2004402-44-スミレ" = "時給がとても高く、売上に比例して追加の手当てまで出るのだとか……！"
"2004402-45-スミレ" = "まさに、私に最適だと思いませんか？"
"2004402-46-スミレ" = "すみませーん、ドリンクお願いします〜！"
"2004402-47-スミレ" = "かしこまりました！ 少々お待ちください。それでは失礼します。"
"2004402-48-スミレ" = "ふぅ……氷の量控えめも、美味しいですね！"
"2004402-49-スミレ" = "喉が渇いたときは、冷え切った飲み物も美味しいですが……。"
"2004402-50-スミレ" = "胃腸の働きを鈍らせ、水分の吸収を妨げることもあります。だから、こちらをおすすめしているんですよ。"
"2004402-51-スミレ" = "また何かありましたら、気軽にお声がけください。では、ごゆっくり。"
"2004402-52" = "（スミレはまるで水を得た魚のようにスタジアムを駆け巡り……）"
"2004402-53" = "（その仕事ぶりは、観客からも好評なようだ）"
"2004402-54-スミレ" = "おかわりですか？どうぞ！"
"2004402-55-スミレ" = "ありがとうございます、追加のドリンクになります。……笑顔のサービス？"
"2004402-56-スミレ" = "はい、どうぞ。"
"2004402-57-スミレ" = "どうしましたか？お困りのようでしたので。"
"2004402-58-スミレ" = "なるほど、注文する人が多く、躊躇われていたんですね。"
"2004402-59-スミレ" = "遠慮せず、お声がけください！"
"2004402-60-スミレ" = "決して聞き逃しませんから！"
"2004402-61-スミレ" = "はい、どうぞ。こぼさないようお気を付けください。"
"2004402-62-スミレ" = "ドリンクサーバーが重くないか、ですか？"
"2004402-63-スミレ" = "まったく問題ありません。むしろ少し物足りないくらいです。"
"2004402-64-スミレ" = "いえ、本当ですよ。このままフォワードランジをしてみせましょうか？"
"2004402-65-スミレ" = "注文もしていないのに悪い、ですか。では一杯いかがでしょう？"
"2004402-66" = "（こうして、スミレはまたたく間に……）"
"2004402-67" = "（スタジアムのスターになっていた！）"
"2004402-68-盛り上がる観客" = "スミレさん！一緒に写真いいですか？"
"2004402-69-スミレ" = "えっ？もちろん構いませんが……。"
"2004402-70-スミレ" = "私の名前を覚えてくださっていたなんて、恐縮です。"
"2004402-71-スミレ" = "スミレさん、今日のアルバイト後に少しお話しできませんか？"
"2004402-72-スミレ" = "すみません、お客様とのプライベートな交流は控えるよう言われているんです。ですが――"
"2004402-73-スミレ" = "体作りのご相談があれば、いつでもミレニアムのトレーニング部に来てください！"
"2004402-74-楽しげな観客" = "スミレさん！カメラに向かってポーズお願いします！"
"2004402-75-スミレ" = "ポーズ……ボディビルのポージングのことですね！"
"2004402-76-スミレ" = "では、まず……サイドチェスト！"
"2004402-77-スミレ" = "うおおお！キレキレだ！"
"2004402-78-スミレ" = "次は……サイドトライセップス！"
"2004402-79-楽しげな観客" = "スミレさんかっこいい！土台が違う土台が！"
"2004402-80-スミレ" = "最後に……ダブルバイセップス！"
"2004402-81-楽しげな観客" = "スミレさん、超仕上がってるよ！"
"2004402-82" = "（もはや、みんな試合を見に来たのか、スミレを見に来たのか分からない……！）"
"2004402-83" = "（その日、スミレはスタジアムの伝説となった……）"
