[translation]
"2004403-1" = "ペースメーカー"
"2004403-2-スミレ" = "お待ちしておりました、トレー……ナー……？"
"2004403-3-スミレ" = "トレーナー！？"
"2004403-4" = "[s] \"えっ、スミレ、どうしたの……？\""
"2004403-5-スミレ" = "気のせいでしょうか……"
"2004403-6-スミレ" = "ちょっと……丸くなりましたか……？"
"2004403-7" = "[s1] \"そう？……あっ\"\n[s2] \"最近、お菓子の量が増えたかも……。\""
"2004403-8-スミレ" = "お菓子！"
"2004403-9-スミレ" = "原因はそれですね……。"
"2004403-10-スミレ" = "わかりました。では、最適なトレーニングメニューを用意しましょう！"
"2004403-11-スミレ" = "さ、まずは体重測定からです！"
"2004403-12" = "（スミレによって、強引に体組成計へと乗せられた……）"
"2004403-13-スミレ" = "……結果が出ました。"
"2004403-14" = "[s3] \"ど、どうですか、スミレコーチ……？\"\n[s4] \"太り過ぎてる……？\""
"2004403-15-スミレ" = "ご安心ください、数値は正常ですよ。ですが――"
"2004403-16-スミレ" = "ここを見てください！わずかながらトレーナーは体脂肪率が高いです！"
"2004403-17-スミレ" = "そのくらい……と思いましたね？甘いですよ！"
"2004403-18-スミレ" = "脂肪は、未来の筋肉のための「燃料」です！"
"2004403-19-スミレ" = "つまり、この脂肪は可能性の塊！"
"2004403-20-スミレ" = "今のトレーナーは……いつか花開く種子なんです！"
"2004403-21-スミレ" = "早速、トレーニングを始めましょうか！"
"2004403-22" = "[s] \"結局、トレーニングをすることに……！\""
"2004403-23-スミレ" = "準備運動は終わりましたね、トレーナー。モチベーションも高いようで嬉しいです！"
"2004403-24" = "[s] \"あれ、着替えたの……？\""
"2004403-25-スミレ" = "ああ、この服は……。"
"2004403-26-スミレ" = "スタジアムでアルバイトをしていた時のものです。"
"2004403-27-スミレ" = "個人的に気に入って、たまにトレーニングでも着ているんですよ。"
"2004403-28-スミレ" = "ドリンクサーバーは、同じ容量のものを自前で用意しました。"
"2004403-29-スミレ" = "では、軽く10kmのランニングから始めましょう。"
"2004403-30-スミレ" = "私もこの装備で、トレーナーと一緒に走ります。"
"2004403-31-スミレ" = "本来ならば20kmが標準的な距離ですが……"
"2004403-32-スミレ" = "今回は、普段あまり運動をしないトレーナーに合わせた距離にしました！"
"2004403-33" = "[s] \"気づかいは嬉しいけど、もう少し距離を短くしてくれると……\""
"2004403-34-スミレ" = "大丈夫、トレーナーなら必ずやり遂げられます！"
"2004403-35-スミレ" = "では始めましょう！"
"2004403-36" = "（スミレと一緒にトラックを走り始めた……！）"
"2004403-37" = "[ns] \"はぁ……はぁ……もうむ……り……\""
"2004403-38-スミレ" = "あと半分です！頑張りましょう！"
"2004403-39-スミレ" = "最後まで私がしっかりと先導しますから！"
"2004403-40-スミレ" = "トレーナー、陸上競技にはペースメーカーという役割の人がいます。"
"2004403-41-スミレ" = "選手のペースを考慮しつつ、その力をより引き出していくサポーターですね。"
"2004403-42-スミレ" = "前を走るペースメーカーが風を受け、後に続く選手の負担を減らし、ペースを作る――"
"2004403-43-スミレ" = "もちろん、共に走る選手の精神を安定させるのも大切な役目です！"
"2004403-44-スミレ" = "さあ、私を信じてついてきてください！"
"2004403-45-スミレ" = "さあ、私を信じてついてきてください！"
"2004403-46-スミレ" = "私も、トレーナーが最後まで走り抜けると信じています！"
"2004403-47" = "[s] \"もう……心臓が爆発しそう……！\""
"2004403-48" = "（こうしてスミレにサポートされながら……）"
"2004403-49" = "（なんとか10kmコースを完走することができた！）"
"2004403-50" = "[wa:1130]― [log=스미레 아르바이트]お疲れ様でした！[wa:940]トレーナー！[/log]"
"2004403-51" = "― [log=스미레 아르바이트]本当に、[wa:1190]見事な走りでした。[/log]"
"2004403-52" = "[wa:260]― [log=스미레 아르바이트]どうぞ、[wa:1080]お飲み物をご用意しています。[/log]"
"2004403-53" = "[ns] \"ありがとう、スミレ……！\""
"2004403-54" = "[wa:1170]― [log=스미레 아르바이트]ええ、[wa:900]この努力は報われるべきです。[/log]"
"2004403-55" = "[wa:650]― [log=스미레 아르바이트]ちゃんとしたご褒美があってこそ、[wa:1960]ですから。[/log]"
"2004403-56" = "[wa:950]― [log=스미레 아르바이트]もちろん、[wa:1300]世の中のすべてが――[/log]"
"2004403-57" = "― [log=스미레 아르바이트]努力に比例した評価が与えられるわけではありません。[/log]"
"2004403-58" = "[wa:1330]― [log=스미레 아르바이트]それでも私は……[/log]"
"2004403-59" = "[wa:200]― [log=스미레 아르바이트]頑張った人がきちんと報われて欲しいと、[wa:2720]思うのです。[/log]"
"2004403-60" = "[wa:670]― [log=스미레 아르바이트]さあ、[wa:950]お飲みください。[/log]"
"2004403-61" = "[wa:250]― [log=스미레 아르바이트]私も一杯、[wa:1320]いただきます。[/log]"
"2004403-62" = "（スミレの気遣いに感動し、ドリンクを飲んだところ……）"
"2004403-63" = "[ns5] \"うっ、口の中が粘ついてる……！\" \n[ns6] \"スミレ、これはもしかして……！？\""
"2004403-64-スミレ" = "よくお気づきですね！"
"2004403-65-スミレ" = "そう、私特製のプロテインドリンクです！"
"2004403-66" = "[s] \"喉が余計に乾いた気がするんだけど！？\""
"2004403-67-スミレ" = "トレーナー、これこそが至高の一杯なんですよ。"
"2004403-68-スミレ" = "運動後にタンパク質を摂取すると、筋肉の回復を促進してくれます。"
"2004403-69-スミレ" = "特に、動物性タンパク質は筋肉の合成に必要不可欠です。"
"2004403-70-スミレ" = "その中でも、吸収の早い乳清タンパクが含まれたこのプロテインは――"
"2004403-71-スミレ" = "まさに、未来の筋肉を創る一杯と言っていいでしょう！"
"2004403-72" = "[ns] \"ダメだ……喉がカラカラで立てない……。\""
"2004403-73-スミレ" = "ト、トレーナー……？喉が渇くようでしたら、糖質ゼロのスポーツドリンクも用意してあります。"
"2004403-74-スミレ" = "どうぞ。少しずつ飲んでくださいね。"
"2004403-75-スミレ" = "いえ、感謝の言葉など……"
"2004403-76-スミレ" = "むしろ、最後まで走り切る姿を見せてくれたことに、私の方こそ感謝しています！"
"2004403-77-スミレ" = "では、トレーナー！"
"2004403-78-スミレ" = "明日も、共に新しい筋肉を育てていきましょう！"
"2004403-79" = "[s] \"えっ、明日も？\""
"2004403-80-スミレ" = "もちろんです。最初にお伝えしましたよね？"
"2004403-81-スミレ" = "「軽く10kmから始めましょう」と！"
"2004403-82" = "（スミレのトレーニングは、効果抜群だったものの）"
"2004403-83" = "（10kmも走ったことで、しばらく筋肉痛に悩まされることになった……）"
