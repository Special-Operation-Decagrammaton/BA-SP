[translation]
"2600205-1" = "克服したい気持ち"
"2600205-2" = "（学食に行く前に、どんな料理を作るかメニューを事前に相談して決めた）"
"2600205-3" = "（今回のメニューは、豚汁）"
"2600205-4-ジュリ" = "ふぅ……。"
"2600205-5" = "[s] \"緊張してる？\""
"2600205-6-ジュリ" = "そうかもしれません……毎回料理に失敗するたびに、原因は何だろうと思ってはいたのですが……。"
"2600205-7-ジュリ" = "一人でジタバタするだけで、#nこういったしっかりとしたアプローチは考えたことがありませんでした。"
"2600205-8-ジュリ" = "でも、先生と一緒であれば……。"
"2600205-9-ジュリ" = "原因を突き止めて、もう失敗することもなく料理に邁進できるかもしれません！"
"2600205-10-ジュリ" = "では、まず材料の下ごしらえから……。"
"2600205-11" = "[s] \"待って、料理に入る前に確認しておこう。\""
"2600205-12-ジュリ" = "確認、ですか？"
"2600205-13" = "[s] \"うん、少なくとも今日は……。\""
"2600205-14" = "[s1] \"レシピに書いてない道具を使わない。\"\n[s2] \"レシピに書いてない材料を使わない。\"\n[s3] \"レシピに書いてない調理法も試さない、OK？\""
"2600205-15-ジュリ" = "しょ、承知しました……。"
"2600205-16-ジュリ" = "しょ、承知しました……。"
"2600205-17-ジュリ" = "しょ、承知しました……。"
"2600205-18-ジュリ" = "今回は効率重視ではなく、まずは実験に集中するということですね。"
"2600205-19" = "[s] \"いつも効率のためにああいうことをしてたんだね……。\""
"2600205-20-ジュリ" = "今回は先生に従うと決めましたので。"
"2600205-21-ジュリ" = "レシピに書いてある通りにやってみますね！"
"2600205-22" = "（そうやって、ジュリと一緒に豚汁を作ってみた結果……）"
"2600205-23-ジュリ" = "完成です、先生！"
"2600205-24" = "[s] \"うん、お疲れ様。じゃあ早速いただきます……。\""
"2600205-25-ジュリ" = "ごくり……。"
"2600205-26" = "[ns] \"こ、これは……！\""
"2600205-27-ジュリ" = "い、いかがですか！？"
"2600205-28" = "[s4] \"酸っぱくてしょっぱくて、甘くて、辛い……？\"\n[s5] \"こんな豚汁、初めて飲んだ……。\""
"2600205-29-ジュリ" = "えぇっ！？"
"2600205-30-ジュリ" = "えぇっ！？"
"2600205-31-ジュリ" = "ど、どうしてでしょう……！？"
"2600205-32" = "[s] \"うーん……条件を変えてみよう！\""
"2600205-33" = "（次はジュリが持ってきた材料ではなく、新たに用意した材料で作ってみることにした）"
"2600205-34-ジュリ" = "もしかしたら私が持ってきた材料の問題かもしれないので、"
"2600205-35-ジュリ" = "今回は先生が買ってきてくれたもので……ということですね。"
"2600205-36-ジュリ" = "では……。"
"2600205-37-ジュリ" = "もう一度作ってみます！"
"2600205-38-ジュリ" = "か、完成しました！"
"2600205-39" = "[s] \"それでは、いただきます……。\""
"2600205-40-ジュリ" = "い、いかがでしょう……？"
"2600205-41" = "[s] \"辛くて甘くてしょっぱくて酸っぱい……。\""
"2600205-42-ジュリ" = "ど、どうして……！？"
"2600205-43" = "[s] \"次！やり方を変えてみよう！\""
"2600205-44-ジュリ" = "こ、今度はどのように……！？"
"2600205-45" = "（次は途中で味見をしつつ、微調整しながら作ってみた）"
"2600205-46" = "[s] \"この方法なら……！\""
"2600205-47" = "[ns] \"すごくしょっぱい！？\""
"2600205-48-ジュリ" = "（ガーン！）"
"2600205-49" = "[s] \"次……っ！\""
"2600205-50" = "（今度は自分の方で途中まで作った料理を、ジュリに仕上げてもらった）"
"2600205-51" = "[ns] \"以下同文。\""
"2600205-52" = "（その後何度も挑戦したが、ジュリが作った料理は毎回変な味になる）"
"2600205-53" = "（全てレシピ通りに作ってから、一番最後の段階でジュリにお玉を差し込んでもらっただけでも、味はとんでもないものに変わった）"
"2600205-54" = "[s] \"……もはや神の御業。\""
"2600205-55-ジュリ" = "うぅ……。"
"2600205-56-ジュリ" = "うわあああん！神の御業なんて嬉しくないです～！"
"2600205-57-ジュリ" = "私は、私は……。"
"2600205-58-ジュリ" = "ただ失敗しないで料理が作りたかっただけなのに～！"
"2600205-59" = "[s] \"うーん……。\""
"2600205-60-ジュリ" = "せっかく……。"
"2600205-61-ジュリ" = "せっかくこうして先生が手伝いに来てくれたのに、私は……。"
"2600205-62-ジュリ" = "失敗はいつものこととはいえ、"
"2600205-63-ジュリ" = "今日は、先生が一緒だったのに……。"
"2600205-64-ジュリ" = "なんとかして原因を突き止めて、"
"2600205-65-ジュリ" = "今日こそきちんと料理を作れる姿をお見せしたかったのに……。"
"2600205-66-ジュリ" = "くすん……ごめんなさい、先生……。"
"2600205-67" = "[s] \"ううん。\""
"2600205-68" = "[s] \"まだ諦めるのは早いよ。\""
"2600205-69-ジュリ" = "……先生？"
"2600205-70" = "[s] \"初めからもう一度、ゆっくりやってみよう。\""
"2600205-71-ジュリ" = "……？"
"2600205-72" = "[s] \"大丈夫、失敗したらまた作ろう。\""
"2600205-73" = "[s6] \"何かが間違ってるなら、また別のことを試してみる。\"\n[s7] \"ジュリがずっとそうしてきたのを、私は知ってるから。\""
"2600205-74-ジュリ" = "先生……。"
"2600205-75-ジュリ" = "先生……。"
"2600205-76-ジュリ" = "……。"
"2600205-77-ジュリ" = "先生……っ！"
"2600205-78" = "[s] \"ど、どうしたの？\""
"2600205-79-ジュリ" = "いえ、先生の仰る通りです……！"
"2600205-80-ジュリ" = "私……つい弱音を吐いてしまいました。"
"2600205-81-ジュリ" = "私はこれでも給食部です。それにずっと頑張ってきて、このまま簡単には諦められません。"
"2600205-82-ジュリ" = "先生のためにも……！まだまだ行けます、はい！"
"2600205-83" = "[s] \"あっ……ジュリ？\""
"2600205-84-ジュリ" = "思った通り、先生の手……。"
"2600205-85-ジュリ" = "すごく温かいです。"
"2600205-86-ジュリ" = "先生、もう少しだけ、こうして手を握っていてくれませんか？"
"2600205-87-ジュリ" = "こうして元気を頂いて、あらためて最初から……今回は包丁の持ち方から、しっかり見直してみようと思います。"
"2600205-88-ジュリ" = "もう少し、私のわがままに付き合ってくださいね！"
"2600205-89" = "（その後も、ジュリと二人で何度も料理に挑戦した）"
