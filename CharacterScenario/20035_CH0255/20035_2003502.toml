[translation]
"2003502-1" = "また別の修行（？）"
"2003502-2-ツバキ" = "むにゃ……むにゃ……。"
"2003502-3" = "[ns] \"……ツバキさん？\""
"2003502-4-ツバキ" = "んん……？"
"2003502-5-ツバキ" = "あ、先生だ……いらっしゃい……待ってたよ……。"
"2003502-6" = "[s] \"その格好は……\""
"2003502-7-ツバキ" = "うん、これが……"
"2003502-8-ツバキ" = "心地よい睡眠に誘うための……ユニフォームだよ……！"
"2003502-9-ツバキ" = "いつでも、どこでもみんなを熟睡に導く……"
"2003502-10-ツバキ" = "それこそが私のガイドの修行だから……。ふぁぁ……。"
"2003502-11" = "[s] \"睡眠、ガイド……？\""
"2003502-12-ツバキ" = "うん……元々はね、百鬼夜行を訪ねてくる人たちを案内するっていう……#nガイドの修行をしてたんだけど……"
"2003502-13-ツバキ" = "先生にも、考えてみてほしいんだ……。"
"2003502-14-ツバキ" = "最近……睡眠不足がすごく社会問題になってるでしょ……？"
"2003502-15" = "[s] \"そうだったっけ……？\""
"2003502-16-ツバキ" = "うん、そうみたいだよ……。"
"2003502-17-ツバキ" = "それでね……思ったの……。"
"2003502-18-ツバキ" = "ガイドの仕事って……どこかに人を導くことだよね……？"
"2003502-19-ツバキ" = "それなら……。"
"2003502-20-ツバキ" = "修行部の部長として……よりよい睡眠に人を導いてあげるのも……。"
"2003502-21-ツバキ" = "ガイドの仕事になるんじゃないかなあ、って……。"
"2003502-22" = "[s] \"よくわからないけど、ツバキのいう睡眠ガイドはそういう事なんだね……。\""
"2003502-23-ツバキ" = "うん……そうなの。#nふぁぁ……。"
"2003502-24-ツバキ" = "それじゃあ先生……今から私が百鬼夜行をガイドしてあげるね～"
"2003502-25-ツバキ" = "ん～？睡眠ガイドじゃないよ……？"
"2003502-26-ツバキ" = "さっきも話した通り……。#n元々は百鬼夜行を訪ねる人たちを案内する……修行をしてたんだ……。"
"2003502-27-ツバキ" = "それに仕事を頑張ったら……ぐっすり眠れるし……。"
"2003502-28-ツバキ" = "これも、睡眠修行ガイドの……一環なの……。"
"2003502-29-ツバキ" = "すやすや……。"
"2003502-30" = "[ns] \"まだ眠っちゃダメだよ！\""
"2003502-31" = "[ns1] \"百鬼夜行をガイドしてくれるって話だったけど……。\"\n[ns2] \"ここって修行部の部室だよね……？ツバキさん……？\""
"2003502-32-ツバキ" = "……。"
"2003502-33-ツバキ" = "ここも……百鬼夜行だからね……。"
"2003502-34-ツバキ" = "……すぅ。"
"2003502-35" = "[s3] \"たしかに間違ってはいないけど……！\"\n[s4] \"ツバキ……起きて！\""
"2003502-36-ツバキ" = "んん……？"
"2003502-37-ツバキ" = "そうだった……先生を案内してるところだった……。"
"2003502-38" = "[s] \"うん、まだ案内してもらってないな～って……\""
"2003502-39-ツバキ" = "……。"
"2003502-40-ツバキ" = "ねえ、先生……。"
"2003502-41-ツバキ" = "人間って……人生の3分の1を睡眠に使うんだって……。"
"2003502-42-ツバキ" = "睡眠が不足したら……老廃物が蓄積されて脳細胞が損傷していって……"
"2003502-43-ツバキ" = "さらにひどくなると……#n脳が全ての感覚を遮断して、強制的に睡眠状態に入っちゃうの……"
"2003502-44-ツバキ" = "それに……睡眠が不足すると……。"
"2003502-45-ツバキ" = "体内の免疫もちゃんと働かなくなっちゃうから……#nウィルスや細菌にも感染しやすくなるらしいよ……。"
"2003502-46" = "[s] \"ツバキがものすごく専門的な話をしてる！これが睡眠ガイド……\""
"2003502-47-ツバキ" = "だからね、よく寝るのは……自分のためにも、先生のためにも、#n大事なことだと思うんだ……。"
"2003502-48-ツバキ" = "うん……。#n今の私は睡眠ガイド[ruby=かすが]春日[/ruby]ツバキ……。"
"2003502-49-ツバキ" = "だからね、先生……？"
"2003502-50-ツバキ" = "一緒に、ここで寝よ……？"
"2003502-51" = "（そうしてツバキは修行部の部室で横になり、ぐっすりと深い眠りについた）"
"2003502-52" = "（ツバキに布団をかけてやり、シャーレに帰ってきた……）"
