[translation]
"1003605-1" = "茂みの中で"
"1003605-2" = "トリニティ聖堂内部"
"1003605-3" = "（ヒナタが頑張る姿を想像しながら、まだこっちにいるかもしれないと思い、一旦トリニティの聖堂に立ち寄った）"
"1003605-4" = "（広々とした空間の中、生徒たちの姿は見当たらない）"
"1003605-5" = "（片隅の方に、ほんの少しだけ開いた扉が見えた）"
"1003605-6" = "[s1] （なんだかデジャヴが……）\n[s2] 扉を開けて入ってみる。"
"1003605-7" = "トリニティ聖堂裏側の公園"
"1003605-8" = "（向こう側は聖堂の裏手に繋がっており、広い公園が目に飛び込んできた）"
"1003605-9" = "（その公園の一角で、木の手入れをしているであろうヒナタの姿が見える）"
"1003605-10-ヒナタ" = "ふんふふん～、ふんふんふ～ん♪"
"1003605-11-ヒナタ" = "……？"
"1003605-12-ヒナタ" = "あれ、先生……？"
"1003605-13" = "[s] \"ヒナタ、おはよう。\""
"1003605-14-ヒナタ" = "あ、はい！おはようございま……"
"1003605-15-ヒナタ" = "……？"
"1003605-16-ヒナタ" = "せ、先生、どうしてここに……？ここは普通、内部の方以外は入って来られない場所なのですが……。"
"1003605-17-ヒナタ" = "……。"
"1003605-18-ヒナタ" = "それに何だか、デジャヴと言いますか……。"
"1003605-19-ヒナタ" = "き、気のせい……ではない、ですよね？"
"1003605-20" = "[s3] \"うん、同感。\"\n[s4] \"とりあえず扉は閉めてきたから、今は大丈夫。\""
"1003605-21-ヒナタ" = "や、やっぱりそうですよね！？また私、扉を開けっ放しのまま……！"
"1003605-22-ヒナタ" = "や、やっぱりそうですよね！？また私、扉を開けっ放しのまま……！"
"1003605-23-ヒナタ" = "うぅ、またしても同じミスを……。"
"1003605-24" = "[s5] \"まあ、そういうこともあるよ。\"\n[s6] ヒナタを慰める。"
"1003605-25-ヒナタ" = "どうして私はこう……。"
"1003605-26-ヒナタ" = "どうして私はこう……。"
"1003605-27-ヒナタ" = "あ、そういえば扉を閉めてくださったんですよね、ありがとうございます。"
"1003605-28-ヒナタ" = "いっつも先生に助けられてばっかりです……。"
"1003605-29-ヒナタ" = "本当に、どうお礼をすれば良いのか……。"
"1003605-30-ヒナタ" = "……あ、はい。連絡させていただいた通り、公園の管理のお仕事をしていました。"
"1003605-31-ヒナタ" = "……？えっと、そうですね。ここも私の担当です。"
"1003605-32-ヒナタ" = "聖堂の中だけではなくって、周囲の諸々を含めての役割……という感じでして。"
"1003605-33-ヒナタ" = "あ、ですがご心配なく！以前より、ちゃんと休むようにはなりましたから。"
"1003605-34-ヒナタ" = "仕事が多い時には、他の方に頼んだりもしますし……以前よりずっと、こう……気持ちが楽になりました。"
"1003605-35-ヒナタ" = "……先生と、みなさんのおかげです。"
"1003605-36-ヒナタ" = "今日の作業は本当に大したことではなかったので、それでひとりなんです。"
"1003605-37-ヒナタ" = "こう、心が落ち着いたと言いますか。私も少し、変われた感じがするかもです……！"
"1003605-38-ヒナタ" = "それで、あの……"
"1003605-39-ヒナタ" = "……！？"
"1003605-40" = "[s7] \"……あ。私ここにいるとマズいんだった。\"\n[s8] 素早く付近の茂みに隠れる。"
"1003605-41-シスターフッドの生徒A" = "シスターヒナタ？いらっしゃいませんかー？"
"1003605-42-シスターフッドの生徒B" = "あれ、こちらに来ていたはずですが……？"
"1003605-43-シスターフッドの生徒A" = "そうですね、先ほど声も聞こえてましたし……。"
"1003605-44-シスターフッドの生徒B" = "えっと、どこに行かれたのでしょうか……？"
"1003605-45-ヒナタ" = "えっと……。"
"1003605-46-ヒナタ" = "こ、困りましたね。まさかこの時間に、ここを訪れる方がいらっしゃるとは……。"
"1003605-47-ヒナタ" = "そ、その、先生……。"
"1003605-48-ヒナタ" = "この茂み、思ったよりも狭くて……。"
"1003605-49-シスターフッドの生徒A" = "……？何か動いたような……？"
"1003605-50-シスターフッドの生徒B" = "そ、そうでしたか……？"
"1003605-51-ヒナタ" = "ば、バレてしまいました……！？"
"1003605-52" = "[s9] \"……よく考えると、ヒナタは隠れなくても良いのでは？\"\n[s10] \"私だけ隠れれば良かったような……？\""
"1003605-53-ヒナタ" = "……。"
"1003605-54-ヒナタ" = "……。"
"1003605-55-ヒナタ" = "……あれ？"
"1003605-56-ヒナタ" = "た、確かにそうですね……。"
"1003605-57-シスターフッドの生徒A" = "やはり、そこの茂みから声が……。"
"1003605-58-ヒナタ" = "うぅ、やっぱりこちらの方に……！"
"1003605-59-ヒナタ" = "と、とりあえず出ますね！？"
"1003605-60-シスターフッドの生徒B" = "ご、ごきげんよう……！"
"1003605-61-シスターフッドの生徒B" = "ど、どうかされましたか……？"
"1003605-62-シスターフッドの生徒A" = "し、シスターヒナタ、どうして茂みの中から……？"
"1003605-63-ヒナタ" = "えっと、ちょっと気になる草だったので、えへへ……。"
"1003605-64-シスターフッドの生徒B" = "そ、そうでしたか……。"
"1003605-65-ヒナタ" = "とっ、ところでどんなご用件ですか！？何か私にお手伝いできることが……！？"
"1003605-66-ヒナタ" = "な、何でも大丈夫ですよ！どこですか？どこに行けば良いでしょうか？今すぐ行きましょう！！"
"1003605-67-シスターフッドの生徒B" = "えっと、それではぜひ……。"
"1003605-68-シスターフッドの生徒A" = "実は、聖堂の本棚の位置を変えなくてはならなくて、お手伝いをお願いしたく……。"
"1003605-69-ヒナタ" = "な、なるほど！もちろんお任せください！私でよければいくらでも！"
"1003605-70" = "（……）"
"1003605-71" = "[ns] \"……。\""
"1003605-72" = "[ns] とりあえず、バレないように帰ることにした。"
"1003605-73" = "（静かに公園を抜け出し、シャーレへと戻った）"
