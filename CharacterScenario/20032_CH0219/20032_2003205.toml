[translation]
"2003205-1" = "作戦準備"
"2003205-2" = "（予想よりも早く仕事が片付いたため、特異現象捜査部の部室に向かった）"
"2003205-3" = "[ns] \"エイミ、いる？\""
"2003205-4-エイミ" = "うーん……"
"2003205-5" = "[s] \"エイミ？\""
"2003205-6-エイミ" = "あれ、先生？"
"2003205-7-エイミ" = "待ってて、すぐ行く。"
"2003205-8-エイミ" = "今日は忙しいって言ってたから、来ないと思ってた。"
"2003205-9" = "[ns] \"エイミ……どうして水着なの……？\""
"2003205-10-エイミ" = "これ？"
"2003205-11-エイミ" = "ん……"
"2003205-12-エイミ" = "気に入ってるから？"
"2003205-13-エイミ" = "心配しないで。#n先生が買ってくれた服もちゃんと着てる。"
"2003205-14-エイミ" = "でも、やっぱり室内でダウンジャケットは暑いね。"
"2003205-15-エイミ" = "これは脱いで……"
"2003205-16" = "[ns] \"え、エイミ！そういえば、今日は何かあったの？\""
"2003205-17-エイミ" = "ああ……氷海用の扇風機を作ってたんだ。"
"2003205-18-エイミ" = "携帯用の扇風機を持っていこうと思ったんだけど……部長に手は温めておくように言われて……"
"2003205-19-エイミ" = "それで手を温めながら風を起こす道具を作ってみた。"
"2003205-20-エイミ" = "先生も使ってみる？感想を聞かせて。"
"2003205-21" = "[s] \"もちろん。\""
"2003205-22-エイミ" = "はい、使ってみて。"
"2003205-23" = "[ns] \"これは……？\""
"2003205-24-エイミ" = "こうやって腕を伸ばして……"
"2003205-25-エイミ" = "手のひらで回すと……"
"2003205-26-エイミ" = "プロペラみたいに回転して、風を起こすの。"
"2003205-27-エイミ" = "これなら風を感じながら手を温められる。"
"2003205-28" = "[s] \"本当だ！\""
"2003205-29-エイミ" = "自信作だよ。"
"2003205-30-エイミ" = "ただ、ずっと使ってると腕が痛くなるし、風もあんまり強くないのが問題。"
"2003205-31-エイミ" = "二人で使えば、交代できるし大丈夫……？"
"2003205-32-エイミ" = "たしかに。やっぱり先生と一緒なら、何でも解決できるね。"
"2003205-33-エイミ" = "うーん……暑くなってきた。#nジャケットの中が汗でびしょびしょ。"
"2003205-34-エイミ" = "とりあえず脱いで……"
"2003205-35" = "[s] \"ちょっと待った！\""
"2003205-36-エイミ" = "どうしたの？"
"2003205-37-エイミ" = "このジャケットは防寒対策だけじゃなくて、洋服の組み合わせも考えられてるって……？"
"2003205-38-エイミ" = "涼しい服と暖かい服を組み合わせた、ハイブリッドなファッション……？"
"2003205-39-エイミ" = "ジャケットを脱ぐとバランスが崩れるって言われても……暑いよ？"
"2003205-40" = "[s] \"オシャレは我慢が大事だから！\""
"2003205-41" = "[ns1] \"そうだ、室温を下げようか？\"\n[ns2] \"氷海の寒さに耐える訓練も兼ねて。\""
"2003205-42-エイミ" = "え？うん……分かった。"
"2003205-43" = "（エイミにジャケットを着てもらうために、エアコンの温度を一番低くした）"
"2003205-44" = "（……その影響で、自分が風邪を引いてしまった）"
