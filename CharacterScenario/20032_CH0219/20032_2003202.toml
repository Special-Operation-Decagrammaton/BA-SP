[translation]
"2003202-1" = "ファッション特訓編"
"2003202-2-エイミ" = "先生、今日もありがとう。"
"2003202-3-エイミ" = "これ？ファッション誌だよ。"
"2003202-4-エイミ" = "私に似合う服が知りたくて。"
"2003202-5-エイミ" = "アドバイスをもらって、参考にするの。"
"2003202-6-エイミ" = "こういうのなんて言うんだっけ、PDCAサイクル？"
"2003202-7" = "[s1] \"……ちょっと違うような？\"\n[s2] \"私で良ければ喜んで。\""
"2003202-8-エイミ" = "ありがとう、じゃあ始めよっか。"
"2003202-9-エイミ" = "一番気になったのは、これ。"
"2003202-10-エイミ" = "せっかくだし、普段は着ない系統もいいかなと思って。#n「ファッション界の新たな風」だって。"
"2003202-11" = "[s] \"……私服にしては派手すぎるんじゃないかな？\""
"2003202-12-エイミ" = "うーん……良いと思ったんだけど。"
"2003202-13-エイミ" = "じゃあ、これは？"
"2003202-14-エイミ" = "フォーマルなオフィスコーデなんだけど……そのままだと面白くないから、あえてスカートは無しで。#nこっちの方が意外性があるかなって。"
"2003202-15-エイミ" = "布の面積が少なすぎる……？#nだからニーソックスを履こうと思ってて……"
"2003202-16-エイミ" = "え？それがダメなの？"
"2003202-17-エイミ" = "あ、じゃあネクタイを結ぶとか……？"
"2003202-18" = "（エイミと二人で「服」を選ぶ時間はしばらく続いて……）"
"2003202-19-エイミ" = "これはレトロ？って言うみたい。"
"2003202-20-エイミ" = "もう古いの？#nファッションには流行があるの？"
"2003202-21-エイミ" = "ん……難しいね。"
"2003202-22-エイミ" = "じゃあ、これはどうかな？"
"2003202-23-エイミ" = "大事な「勝負」の日に着ると、絶対うまくいくんだって。"
"2003202-24-エイミ" = "「アバンギャルド」……って言うらしいよ。"
"2003202-25" = "[s] \"これ、本当にファッション誌なの……？\""
"2003202-26" = "（エイミが持ってきた雑誌は、流行ではなく芸術寄りのもので……）"
"2003202-27" = "（どれも前衛的で尖っているものばかりだった）"
"2003202-28-エイミ" = "これが最先端のだって聞いて持ってきたのに……"
"2003202-29-エイミ" = "……。"
"2003202-30" = "[s] \"エイミ。\""
"2003202-31" = "[ns3] \"今度、二人で買い物に行こう。\"\n[ns4] \"一緒に選ぼうか。\""
"2003202-32-エイミ" = "そうだね。"
"2003202-33-エイミ" = "うん、そうしよう。"
"2003202-34" = "[s] \"ところで、さっきからどれも水着に見えるんだけど……\""
"2003202-35-エイミ" = "そうだよ？#n水着を探してたの。"
"2003202-36-エイミ" = "水着も「服」だよ？"
"2003202-37" = "[s5] \"それはそうだけど……！\"\n[s6] \"今度こそちゃんとした服を買うのかと思ったら……！\""
"2003202-38-エイミ" = "水着も「服」でしょ？#n先生の言ってる意味、よく分からない。"
"2003202-39" = "（そうして、エイミと水着を買いに行く約束をし――）"
"2003202-40" = "（ショッピングの予行練習として、エイミは雑誌から水着を選んだが、どれもやや前衛的なものだった）"
