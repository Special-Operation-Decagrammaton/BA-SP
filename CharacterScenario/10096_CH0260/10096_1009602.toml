[translation]
"1009602-1" = "水着選び"
"1009602-2" = "（カンナから要請を受けて、ヴァルキューレ警察学校に向かった）"
"1009602-3-カンナ" = "わざわざありがとうございます、[USERNAME]先生。"
"1009602-4" = "[s] \"カンナのお願いなら、いつでも歓迎だよ。\""
"1009602-5-カンナ" = "そ、そうですか。"
"1009602-6-カンナ" = "……さっそく、本題に移りたいのですが。"
"1009602-7" = "[s1] \"ライフセーバーを任されたんだよね？\"\n[s2] \"水着選びで困ってるんだよね？\""
"1009602-8-カンナ" = "はい、その通りです。"
"1009602-9-カンナ" = "詳細は、場所を移してからにしましょう。"
"1009602-10-カンナ" = "どうぞ、先生。"
"1009602-11" = "[s3] \"ここ、更衣室じゃん！\"\n[s4] \"こんな場所で二人きりは良くないよ！？\""
"1009602-12-カンナ" = "先生の懸念事項は理解しております。"
"1009602-13-カンナ" = "ですが、この時間は特別に使用許可を頂いているので、#n誰かが入ってくることはありません。"
"1009602-14" = "[s] \"そういう問題じゃ……。\""
"1009602-15-カンナ" = "では、まずこちらを見ていただいて……。"
"1009602-16-カンナ" = "ライフセーバーの任務中は、水着の着用を命じられました。"
"1009602-17-カンナ" = "これらは、ヴァルキューレから支給された物になります。"
"1009602-18-カンナ" = "ですが、今回の任務は厳しい取り決めがなく、#n余計に困っておりまして。"
"1009602-19-カンナ" = "恥を忍んで、先生に助けを求めた次第です。"
"1009602-20" = "[s5] \"つまり……。\"\n[s6] \"カンナが着る水着を選べば良いんだよね？\""
"1009602-21-カンナ" = "ええ、そうです。"
"1009602-22-カンナ" = "実はプライベートでも水着を着たことがほとんどないため、#n何を基準に選んだら良いものか分からず。"
"1009602-23-カンナ" = "どれも、よく見かけるデザインではありますが……。"
"1009602-24-カンナ" = "布面積があまりにも小さい物は、できれば避けたいと考えています。"
"1009602-25" = "[s] \"たしかに、大胆なデザインだね。\""
"1009602-26" = "[ns] \"それじゃあ、これはどうかな？\""
"1009602-27-カンナ" = "むしろ、恥ずかしい気が……！"
"1009602-28-カンナ" = "そうですね……。"
"1009602-29-カンナ" = "ライフセーバーだと周囲に伝わるような水着でお願いします。"
"1009602-30" = "[s] \"なら、これがピッタリじゃない？\""
"1009602-31-カンナ" = "たしかに、これなら一目で分かるでしょうが……。"
"1009602-32-カンナ" = "さすがに、ここまで奇抜なデザインは……。"
"1009602-33" = "[s] \"そうだよね……。\""
"1009602-34-カンナ" = "たとえば、これとか……。"
"1009602-35-カンナ" = "デザインも無難ですし、布面積も充分。#n腕章を着用すれば、ライフセーバーだと利用客にも伝わるでしょう。"
"1009602-36-カンナ" = "先生はどう思いますか？"
"1009602-37" = "[s] \"私も良いと思う。\""
"1009602-38-カンナ" = "では、一度着てみます。"
"1009602-39-カンナ" = "……。"
"1009602-40-カンナ" = "あの、申し訳ないのですが……。"
"1009602-41" = "[s7] \"あっ、ごめん！\"\n[s8] \"ここで着替えるんだもんね！\""
"1009602-42-カンナ" = "着てみましたが、どうでしょう？"
"1009602-43" = "[s9] \"よく似合っていると思う。\"\n[s10] \"とっても可愛いね。\""
"1009602-44-カンナ" = "か、可愛いだなんて、お世辞はやめてください。"
"1009602-45-カンナ" = "私にそのような言葉は似合いませんので。"
"1009602-46-カンナ" = "では、これにしようと思います。"
"1009602-47-カンナ" = "……結局、私が自分で選んでしまいましたね。#nわざわざお呼び立てしたにもかかわらず……。"
"1009602-48-カンナ" = "無駄足を踏ませてしまい、申し訳ありませんでした。"
"1009602-49" = "[s] \"ううん。\""
"1009602-50" = "[ns] \"少しでも力になれたなら、良かったよ。\""
"1009602-51-カンナ" = "……はい。"
"1009602-52-カンナ" = "助けていただき、ありがとうございました。"
