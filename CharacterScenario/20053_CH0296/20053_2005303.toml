[translation]
"2005303-1" = "忍者少女は恥ずかしい！"
"2005303-2" = "百鬼夜行商店街"
"2005303-3-お直し屋" = "はい、こちらが頼まれていたドレスになります。"
"2005303-4-ミチル" = "おおっ……！"
"2005303-5-ミチル" = "……すごい、綺麗！"
"2005303-6-ミチル" = "破れた部分がどこだったか、全然分かんない！"
"2005303-7-ミチル" = "これがプロの腕前……！"
"2005303-8" = "[s] \"良かったね、ミチル。\""
"2005303-9-ミチル" = "ふっふっふ……でも、これで終わりじゃないんだよ。"
"2005303-10-ミチル" = "しばし待たれよ、先生殿！"
"2005303-11" = "（5分後……）"
"2005303-12-ミチル" = "先生殿！"
"2005303-13-ミチル" = "さぁ、次行こー！"
"2005303-14" = "[ns] \"何で！？\""
"2005303-15-ミチル" = "ふふっ、何でも何も……。"
"2005303-16-ミチル" = "服とはすなわち、「着用する」もの。"
"2005303-17-ミチル" = "つまり、本当に修理できてるかを知るためには、着てみないと！"
"2005303-18" = "[s] \"説得力が……ある！？\""
"2005303-19-ミチル" = "ただーし……着るだけじゃダメ！"
"2005303-20-ミチル" = "歩いたり、走ったり、重い物を持ったり！"
"2005303-21-ミチル" = "色んな動きをしてみて初めて……。"
"2005303-22-ミチル" = "完璧に直ってるかが、分かるはず！"
"2005303-23" = "[s] \"一理あるけど……。\""
"2005303-24-ミチル" = "でしょー？"
"2005303-25-ミチル" = "ってことで、そのために最適なコースを練ってきたから！"
"2005303-26-ミチル" = "あっちに行くと、各種グッズを売ってるお店があってー。"
"2005303-27-ミチル" = "そっちの方には、前に二人で行ったお店もあるしー。"
"2005303-28-ミチル" = "ショッピングをしながら通りを抜ければ……！"
"2005303-29-ミチル" = "歩く、走る、重い物を持つ！#n全部の動きが入ってるって寸法！"
"2005303-30-ミチル" = "それに新しいグッズ……じゃなくて、忍具が入荷したんだって！"
"2005303-31-ミチル" = "いやー、これでもーっとたくさんの人が忍者の魅力に気づいちゃうね！"
"2005303-32" = "[s] \"やっぱりそれが狙い！？\""
"2005303-33-ミチル" = "先生なら来てくれると思ったよ～！"
"2005303-34" = "[s] \"まだ何も言ってないけどね！？\""
"2005303-35-ミチル" = "良いの良いの！それじゃあ、レッツゴ～！"
"2005303-36" = "百鬼夜行・グッズ商店街"
"2005303-37" = "（結局、ミチルに手を引かれるがまま商店街へやって来た）"
"2005303-38-ミチル" = "ほらほら、気合い入れて！"
"2005303-39-ミチル" = "同じグッズでも、お店ごとに値段が違ったりするから……。"
"2005303-40-ミチル" = "ちゃんと気を張って、見極めていかないと！"
"2005303-41-ミチル" = "まぁ、忍者グッ……じゃなくて忍具は、大体同じ値段なんだけどね。"
"2005303-42-ミチル" = "そもそも取り扱いが少ないから、比較対象が……。"
"2005303-43-ミチル" = "……ん？"
"2005303-44-ミチル" = "あぁっ、マトリョーシカ手裏剣！"
"2005303-45-ミチル" = "手裏剣の中に小さな手裏剣が入ってる、特殊な忍具！"
"2005303-46-ミチル" = "飛んできた手裏剣を避けても、#nまた別の手裏剣が現れる不可避の武器！"
"2005303-47-ミチル" = "「甲斐犬グルル」監督の作品で登場して以来、#nあちこちでオマージュされてるんだよ！"
"2005303-48-ミチル" = "あっ、こっちは……忍者用火炎煙幕弾！"
"2005303-49-ミチル" = "爆発させれば煙幕の代わりに炎が出て、#n視界を遮りながら攻撃ができるレアな忍具！"
"2005303-50" = "[s] \"それはミサイルと同じでは……？\""
"2005303-51-ミチル" = "まぁまぁ、細かいことは気にしない気にしない。"
"2005303-52-ミチル" = "はっ、これは……古代忍者のホログラム巻物！？"
"2005303-53-ミチル" = "こんなものまで置いてあるの！？"
"2005303-54" = "（こうして、ミチルとしばらく忍者グッ……忍具を見て回った）"
"2005303-55-ミチル" = "うにゃ～、楽しかったぁ。"
"2005303-56-ミチル" = "服の修理にお金を使っちゃったから、手裏剣しか買えなかったけどー……。 "
"2005303-57-ミチル" = "一緒に買い物ができて、楽しかったなぁ。"
"2005303-58-ミチル" = "……その、先生殿。"
"2005303-59-ミチル" = "……わがまま聞いてくれて、ありがと。"
"2005303-60" = "[s] \"ううん、私も楽しかったから。\""
"2005303-61-ミチル" = "ほ、ほんとぉ……？"
"2005303-62-ミチル" = "ふふっ……ふふんっ！"
"2005303-63-ミチル" = "そ、そうだ……！"
"2005303-64-ミチル" = "これ、先生殿に！ "
"2005303-65" = "[s] \"……カプセルトイ？\""
"2005303-66-ミチル" = "さっき回してきたの！"
"2005303-67-ミチル" = "何を隠そう、忍者カプセルトイ！"
"2005303-68-ミチル" = "まぁ中身が何かは分からないけど……。"
"2005303-69-ミチル" = "そのワクワクも含めてプレゼントってことで！"
"2005303-70-ミチル" = "さっ、開けてみよー！"
"2005303-71-ミチル" = "……えっ？"
"2005303-72" = "[wa:1250]― [log=미치루 드레스]中身は……[wa:2300]指輪、[wa:1080]だね！？[/log]"
"2005303-73" = "― [log=미치루 드레스]手裏剣の飾りがついてて、[wa:2440]良い感じ……[wa:1940]じゃん！？[/log]"
"2005303-74" = "[ns] \"せっかくもらったし、つけてみようかな。\""
"2005303-75" = "[wa:440]― [log=미치루 드레스]……[wa:890]え？[wa:1210]先生殿、[wa:1800]つけるの……？[/log]"
"2005303-76" = "― [log=미치루 드레스]あ、[wa:1010]いや、[wa:960]いいんだけど……。[/log]"
"2005303-77" = "[wa:1570]― [log=미치루 드레스]（あれ……？[wa:1250]指輪を、[wa:1180]相手に渡す……？）[/log]"
"2005303-78" = "― [log=미치루 드레스]（これって……[wa:1420]告白、[wa:1540]みたいな――！？）[/log]"
"2005303-79" = "[wa:380]― [log=미치루 드레스]ちょっ、[wa:400]ちょっと待って[wa:790]先生殿！[/log]"
"2005303-80" = "― [log=미치루 드레스]別に[wa:480]狙ってたわけじゃなくて……！[wa:1890]でも、[wa:500]えっと……！[/log]"
"2005303-81" = "[ns] \"ど、どうしたの！？\""
"2005303-82" = "[wa:2040]― [log=미치루 드레스]うぅ……[wa:840]うああぁ～～っ！！[/log]"
"2005303-83-ミチル" = "っ……！"
"2005303-84-ミチル" = "あ、えっと……！"
"2005303-85-ミチル" = "う～～～、えぇいっ！"
"2005303-86" = "ボンッ！"
"2005303-87" = "[ns] \"……。\""
"2005303-88" = "（煙が消えると、ミチルの姿はなくなっていた）"
"2005303-89" = "（……手のひらには、カプセルトイだけが残っていた）"
