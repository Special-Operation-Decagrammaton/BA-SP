[translation]
"2005306-1" = "忍者少女は流行に敏感！"
"2005306-2" = "[ns] \"ミチルかな？\""
"2005306-3-ミチル" = "ドーモ、先生殿。"
"2005306-4" = "[ns] \"！？\""
"2005306-5-ミチル" = "なにその反応！？"
"2005306-6-ミチル" = "ミチルだよ、先生殿！？"
"2005306-7" = "[s1] \"こんな丁寧にノックして入ってくるなんて……。\"\n[s2] \"私の知ってるミチルじゃない！？\""
"2005306-8-ミチル" = "うにゃあ！？#n私のことを何だと思ってるのさぁ！？"
"2005306-9-ミチル" = "……や、やっぱ言わなくて良いや。不安だし。"
"2005306-10-ミチル" = "とにかぁく！今日の私は一味違う！"
"2005306-11-ミチル" = "なんと、「ブリーフィング」なるものの準備までしてきたよ！"
"2005306-12" = "[s] \"ブリーフィング……！\""
"2005306-13-ミチル" = "そうっ！"
"2005306-14-ミチル" = "「少女忍法帖ミチルっち・成長秘訣および計画プレゼンテーションブリーフィング」！"
"2005306-15-ミチル" = "ふふふっ、気になるでしょー？"
"2005306-16" = "[s] \"モモトークで言ってたのはこれ？\""
"2005306-17-ミチル" = "正解っ！"
"2005306-18-ミチル" = "変な方法に頼らず、純度100%で考え出した秘訣……！"
"2005306-19-ミチル" = "それじゃあ、ブリーフィングを始めるよ！"
"2005306-20-ミチル" = "――まず結論！"
"2005306-21" = "[s] \"結論から入った！？\""
"2005306-22-ミチル" = "それは――"
"2005306-23-ミチル" = "映像を作る時には、トレンドを反映するのがベスト！"
"2005306-24-ミチル" = "たとえ忍者に関する話がちょーっと減っちゃうとしても……。"
"2005306-25" = "[s3] \"忍者のチャンネルなのに……？\"\n[s4] \"大丈夫？\""
"2005306-26-ミチル" = "10歩前進するために、1歩後退する……そういうこと！"
"2005306-27-ミチル" = "だってほら、その動画を見たくなる一番の理由って何だと思う？"
"2005306-28-ミチル" = "……それは即ち、再生数！"
"2005306-29" = "[s5] \"再生数を得るためには、再生数が必要……。\"\n[s6] \"鶏か卵かみたいな……？\""
"2005306-30-ミチル" = "でも実際、再生数が低い動画には、みんな興味を持ってくれないもの……！"
"2005306-31-ミチル" = "変なツールを使うつもりはないけど、#nそれ以外の手段は問わずに、再生数を上げるっ！"
"2005306-32-ミチル" = "その方が、視聴者も楽しんでくれるはず！多分。"
"2005306-33-ミチル" = "だから今日は、最新トレンドを反映した動画を上げるの！"
"2005306-34" = "[s] \"例えば、どんな内容を？\""
"2005306-35-ミチル" = "ふっふっふ、良い質問だね先生殿！"
"2005306-36-ミチル" = "今回選んだキーワードは……「ファッション」！"
"2005306-37" = "[s] \"ファッション……！\""
"2005306-38-ミチル" = "うん、時代は「ファッション」だよ。"
"2005306-39-ミチル" = "「人気急上昇中動画」を分析してみたら……。"
"2005306-40-ミチル" = "ランキング上位は、ファッション系の内容ばっかりだったの！"
"2005306-41-ミチル" = "「毎日着ても飽きないTシャツ7選」とか「パーソナルカラーで分かるマイ手榴弾」とか「あの銃と相性抜群のアウター」とかー……。"
"2005306-42-ミチル" = "その流行りに乗って、さっそく企画してみたよ！"
"2005306-43" = "[s] \"おっ、どんな内容を？\""
"2005306-44-ミチル" = "それは～……！ "
"2005306-45-ミチル" = "……じゃじゃん！#nファッションと忍術のコラボレーション！"
"2005306-46-ミチル" = "ファッションに関係する忍術を考案して、毎週動画をアップするの！"
"2005306-47-ミチル" = "このコンテンツで視聴者を引き込んで……。"
"2005306-48-ミチル" = "その合間に本格的な忍者コンテンツを上げれば……。"
"2005306-49-ミチル" = "みんな、いつの間にか忍者の虜になってるはず！"
"2005306-50-ミチル" = "まるで茹でガエルみたいに！"
"2005306-51" = "[s] \"その例えはどうかな！？\""
"2005306-52-ミチル" = "とにかく、これにてブリーフィングは終了……！"
"2005306-53-ミチル" = "あとは結果で語ってみせるよ！"
"2005306-54-ミチル" = "というわけで先生殿、期待しててね！"
"2005306-55-ミチル" = "超有名インフルエンサーになって、先生殿をマネージャーにスカウトしちゃうから！"
"2005306-56-ミチル" = "ってことで、今日の話はおしまい！#nアディオス＝SAYONARA！"
"2005306-57" = "（煙幕弾を使ってるのに、どこから出ていったのか丸分かりだ……）"
"2005306-58" = "（数日後）"
"2005306-59" = "（今日も山積みになった書類を、ギリギリのところで整理していると……）"
"2005306-60-？？？" = "先生殿……。"
"2005306-61-ミチル" = "助けてぇ～……。"
"2005306-62" = "[s7] \"……ミチル！スターになって迎えに来てくれたの！？\"\n[s8] \"この書類地獄から、私を連れ出して……！\""
"2005306-63-ミチル" = "えぇっ！？#nいや、私が助けてもらおうと思って来たんだけど……！"
"2005306-64" = "[s] \"……え？\""
"2005306-65-ミチル" = "この前、ファッションと忍術を掛け合わせた動画を上げたんだけどね……。"
"2005306-66-ミチル" = "おかしいくらい反応が悪くってぇ……。"
"2005306-67-ミチル" = "今までの動画より、低評価がすごい数に……！"
"2005306-68" = "[s] \"映像とかコメントはチェックしてみた？\""
"2005306-69-ミチル" = "……。"
"2005306-70-ミチル" = "その、怖くて……。"
"2005306-71-ミチル" = "だからその、先生殿も一緒に見てもらえないかなーって……。"
"2005306-72" = "[s] \"分かった、じゃあ確認しよう。\""
"2005306-73-ミチル" = "ありがとー、先生殿ぉ……。"
"2005306-74" = "（そうして、ミチルの動画を見てみることに）"
"2005306-75" = "百鬼夜行・第38旧校舎のとある教室"
"2005306-76-ミチル" = "少女忍法帖、ミチルっち～！"
"2005306-77-ミチル" = "ドーモ。#n小生、ミチルと申す。"
"2005306-78-ミチル" = "さーて、本日披露する忍法は～……「早着替えの術」！ "
"2005306-79-ミチル" = "上手く活用すれば、複雑な衣装も一瞬で着替えられる実用的な忍法！"
"2005306-80-ミチル" = "百聞は一見に如かず……。"
"2005306-81-ミチル" = "まずはお手本を披露しよー！"
"2005306-82-ミチル" = "ただ、万が一に備えて……。"
"2005306-83-ミチル" = "はりゃっ！"
"2005306-84" = "[ns] （レンズにカバーを……？）"
"2005306-85-ミチル" = "ってわけで、じゃじゃーん！"
"2005306-86-ミチル" = "一瞬で着替えが終了っ！"
"2005306-87-ミチル" = "さっそく、種明かしを――"
"2005306-88" = "（レンズにカバーがかかっていたせいで……）"
"2005306-89" = "（……最後まで何も映っていなかった）"
"2005306-90" = "シャーレ・オフィス"
"2005306-91-ミチル" = "……。"
"2005306-92" = "[ns] \"……。\""
"2005306-93-ミチル" = "こっ、こここっ、こんな初歩的ミスを……！！"
"2005306-94-ミチル" = "うにゃぁああっ！！"
"2005306-95" = "（あまりにもショックだったのか、煙幕弾を使わずに姿を消してしまった）"
