[translation]
"1006405-1" = "猫とカヨコと甘酒と"
"1006405-2" = "（翌朝、混むと予想して早めに着いたところ……）"
"1006405-3-カヨコ" = "あれ、先生。もう来てたの？"
"1006405-4-カヨコ" = "寒いんだし、先に着いたなら連絡して近くのお店に入ってても……。"
"1006405-5" = "[s] \"大丈夫、いま来たところだよ。\""
"1006405-6-カヨコ" = "先生の手、こんなに冷たいじゃん……。"
"1006405-7-カヨコ" = "早く温めないと……"
"1006405-8-カヨコ" = "何か温かい飲み物でも売ってないかな。"
"1006405-9-管理人" = "甘酒、いかがですか～？"
"1006405-10-管理人" = "今日は一段と冷えますから、皆さんどうぞ～。"
"1006405-11-カヨコ" = "先生、お正月の甘酒を配ってるみたいだね。"
"1006405-12-カヨコ" = "お守りを買いに行く前に、貰ってから行こう？"
"1006405-13" = "[s] \"うん、ちょうど良かったね。\""
"1006405-14-カヨコ" = "甘酒を2杯、お願い。"
"1006405-15" = "[ns1] \"はああ、温かいね……。\"\n[ns2] \"身体の芯まで温まるよ……。\""
"1006405-16-カヨコ" = "ふふ、懐かしい味だ。"
"1006405-17-カヨコ" = "ふふ、懐かしい味だ。"
"1006405-18-カヨコ" = "初めてかも……こうやって周りを気にせず甘酒を飲めたのは。"
"1006405-19" = "[s] \"前に何かあったの？\""
"1006405-20-カヨコ" = "甘酒ってアルコール成分が入ってるのもあるでしょ？"
"1006405-21-カヨコ" = "大量の甘酒を飲んだ生徒が、大騒ぎを起こしたことがあって。"
"1006405-22-カヨコ" = "だから毎年、甘酒を飲む時は周りが気になって、ちゃんと味わえなかったけど……。"
"1006405-23-カヨコ" = "今日は先生と一緒だからね。"
"1006405-24" = "[s] \"カヨコは甘酒で酔わないの？\""
"1006405-25-カヨコ" = "あるわけないじゃん。こんなジュースみたいなもので。"
"1006405-26-カヨコ" = "まあ、何杯も飲み続けたら分からないけど……。"
"1006405-27-カヨコ" = "ふぅ……美味しかった。でも、私は一杯で十分かな。"
"1006405-28-カヨコ" = "さて、身体も温まったところだし、そろそろ……。"
"1006405-29-カヨコ" = "あ……"
"1006405-30-カヨコ" = "先生、悪いけど、ちょっと待っててくれる？"
"1006405-31-カヨコ" = "ちょっと気になるものが……。"
"1006405-32" = "[s] \"うん、いってらっしゃい。\""
"1006405-33-カヨコ" = "じゃあ、すぐに戻るから。"
"1006405-34" = "（しかし、10分以上経ってもカヨコは戻らず……)"
"1006405-35" = "[ns] カヨコが向かった方に行ってみる。"
"1006405-36-？？？" = "よしよし、そう、いい子だね。ふふ……。"
"1006405-37-？？？" = "ここの境内で暮らしてるの？人慣れしてるんだね。"
"1006405-38-？？？" = "にゃ～、可愛いね。"
"1006405-39-カヨコ" = "にゃんにゃん～にゃんにゃん～。ふふっ、にゃんにゃん～♪"
"1006405-40" = "[s3] \"なんだか、楽しそうだね。\"\n[s4] \"可愛い猫たちだね。\""
"1006405-41-カヨコ" = "せ、先生……！？いつからそこに……？"
"1006405-42-カヨコ" = "せ、先生……！？いつからそこに……？"
"1006405-43-カヨコ" = "あっ、ごめん。遅かったから心配してくれたんだよね……。"
"1006405-44-カヨコ" = "それより……。"
"1006405-45-カヨコ" = "…………見た？"
"1006405-46" = "[s] \"……うん。\""
"1006405-47-カヨコ" = "だから、その……いつも猫語で話しかけてるわけじゃ……。"
"1006405-48-カヨコ" = "……なくはないけど。#nはぁ、探しに来ると思ってなくて油断してた……。"
"1006405-49-カヨコ" = "……甘酒のせい。"
"1006405-50-カヨコ" = "さっき甘酒を飲んだから……そう、甘酒のせいだから……。"
"1006405-51-カヨコ" = "もう二度と甘酒は飲まない……！"
"1006405-52" = "(……その後、恥ずかしがるカヨコを宥めて、お守りを買いに行った)"
