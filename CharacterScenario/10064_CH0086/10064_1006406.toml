[translation]
"1006406-1" = "ストレス解消法"
"1006406-2" = "(……新年を迎えても、キヴォトス各地で事件は発生し、落ち着く暇も無かった)"
"1006406-3-百鬼夜行の生徒A" = "先生、羽根突きでスマッシュを打つのはルール違反でしょうか……？"
"1006406-4-百鬼夜行の生徒A" = "ついつい卓球の感覚で羽根を叩いたら、友達に怒られてしまい……。"
"1006406-5" = "[s1] \"難しい問題だね……。\"\n[s2] \"一緒に考えてみようか……。\""
"1006406-6" = "（判断が難しい相談の次は、思いがけないトラブルが……)"
"1006406-7-悪徳店主" = "あんた、なにモンだ？#n人様に口出しするなんて良い度胸だなぁ、あぁん？"
"1006406-8-悪徳店主" = "学生のバイト代が安かろうと、あんたにゃ関係ねぇだろうが。"
"1006406-9-悪徳店主" = "なに？シャーレの先生だぁ……？"
"1006406-10-悪徳店主" = "んだとコラ！シャーレだか連邦生徒会だか知らんが、もし邪魔するってんなら……"
"1006406-11-悪徳店主" = "タダじゃおかねぇぞ！"
"1006406-12" = "[s] \"お、落ち着いて、まずは話を……\""
"1006406-13" = "（仕事が終わった頃には、すっかり疲れ切ってしまった……）"
"1006406-14-カヨコ" = "……あれ、先生？"
"1006406-15-カヨコ" = "こんなところで会えるなんて。"
"1006406-16-カヨコ" = "元気……そうには見えないね。#n何か辛いことでもあった？"
"1006406-17" = "[s3] \"やあ、カヨコ……。\"\n[s4] \"今日は色々と忙しくて……。\""
"1006406-18-カヨコ" = "うーん……なんというか、お疲れ様。"
"1006406-19-カヨコ" = "うーん……なんというか、お疲れ様。"
"1006406-20-カヨコ" = "こんなことしか言えなくて、ごめん。"
"1006406-21" = "[s] \"それだけで十分だよ、ありがとう。\""
"1006406-22" = "[ns] \"ところでカヨコは、どこか行くところ？\""
"1006406-23-カヨコ" = "ああ、この近くで好きなバンドのライブがあって。"
"1006406-24-カヨコ" = "「和楽器クラブ」って、聞いたことある？"
"1006406-25-カヨコ" = "太鼓や三味線、琴なんかの和楽器で、#n現代風のポップスを演奏するバンドグループなんだ。"
"1006406-26-カヨコ" = "和楽器だからこその表現が面白くて、よく行ってる。"
"1006406-27" = "[s5] \"和楽器で現代風ポップスを……。\"\n[s6] \"癒やされそうだね。\""
"1006406-28-カヨコ" = "そうなんだ。和楽器特有の音色がストレスを吹っ飛ばしてくれる。"
"1006406-29-カヨコ" = "そうなんだ。和楽器特有の音色がストレスを吹っ飛ばしてくれる。"
"1006406-30-カヨコ" = "良かったら、先生も一緒に見に行かない？"
"1006406-31-カヨコ" = "便利屋のみんなは用事があるみたいで、チケット余っちゃったから。"
"1006406-32" = "[s7] \"うん、行きたい！\"\n[s8] \"今日は疲れたから、ちょうど良いね！\""
"1006406-33-カヨコ" = "ふふ、良かった。"
"1006406-34-カヨコ" = "ふふ、良かった。"
"1006406-35-カヨコ" = "じゃあ、付いてきて。会場はすぐ近くだよ。"
"1006406-36" = "（その後、カヨコの案内で会場に到着したが……)"
"1006406-37" = "（想像していた「癒し」とは全く違った……)"
"1006406-38-バンドボーカル" = "闇のダークが垂れ込むキヴォトス！死のデスを感じろ――！！"
"1006406-39-バンドボーカル" = "これが破壊のデストロイ！この世の終わりジ·エンド――！！"
"1006406-40" = "（ライブ後――）"
"1006406-41-カヨコ" = "あぁ……最高のステージだった。"
"1006406-42-カヨコ" = "最後の曲で三味線奏者が弦を噛みちぎって、太鼓を頭で叩く演出は痺れたね。"
"1006406-43" = "[s] \"う、うん……。\""
"1006406-44-カヨコ" = "もしかして……"
"1006406-45-カヨコ" = "先生には少し刺激が強かったかな？"
"1006406-46-カヨコ" = "ライブ前より疲れた顔してるね……ごめん。"
"1006406-47" = "[s9] \"いや、むしろ……\"\n[s10] \"つい楽しかったから盛り上がっちゃって……\""
"1006406-48" = "[ns] \"カヨコの言った通り、ストレスが吹き飛んだよ！\""
"1006406-49-カヨコ" = "……そう言ってもらえると、嬉しい。"
"1006406-50-カヨコ" = "けど疲れてるのは誤魔化せないから、早くシャーレに戻って休んで。"
"1006406-51-カヨコ" = "……今日も付き合ってくれてありがとう、先生。"
"1006406-52-カヨコ" = "今度は元気な時に来ようね。#nきっと、もっと楽しいはずだよ。"
