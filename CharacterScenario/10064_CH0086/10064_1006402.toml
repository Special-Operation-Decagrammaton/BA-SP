[translation]
"1006402-1" = "深まる誤解"
"1006402-2" = "D.U.近くの商店街・呉服店"
"1006402-3-カヨコ" = "あの……。"
"1006402-4-店員" = "……あぁっ、申し訳ございません。"
"1006402-5-カヨコ" = "休憩中に邪魔しちゃって悪いけど……新しく着物を買いたくて。"
"1006402-6-店員" = "わ、分かりました。すぐにご案内いたします！"
"1006402-7-店員" = "どうぞこちらへ……。"
"1006402-8-店員" = "（着物屋を開いてから、かれこれ10年は経った)"
"1006402-9-店員" = "（数多くのお客様に接してきた経験で、今や顔を見るだけでお相手の立場が直感で分かるように……）"
"1006402-10-店員" = "（時期的に成人式の晴れ着を駆け込みで買って行かれるのかと思ったが……)"
"1006402-11-店員" = "（裏地の素材まで慎重に確かめる眼光に、全身から放つ殺気……このお客様は裏の世界で名の通っている方に違いない！）"
"1006402-12-店員" = "（万が一にも不手際を起こして、お客様の機嫌を損ねたら、とんでもない目に……！)"
"1006402-13-店員" = "当店ではお客様のような、気品ある方にお似合いの品を豊富に取り揃えています！"
"1006402-14-店員" = "必ずや、お気に召す最高の1枚をご提案いたします。#n私にお任せください！"
"1006402-15-カヨコ" = "いや、そこまでの着物じゃなくて良いんだけど……。"
"1006402-16-店員" = "まず、こちらのお着物はいかがですか？"
"1006402-17-店員" = "最高級の絹で織られた魅惑的な着物でございます。#nこれに袖を通せば、街行く人々の目を釘付けにすることでしょう！"
"1006402-18-カヨコ" = "これはちょっと……露出が多すぎる気が。"
"1006402-19-店員" = "私としたことが、高貴なお方にとんだ無礼を……！"
"1006402-20-店員" = "少々お待ちくださいっ！"
"1006402-21-店員" = "で、では、こちらのお着物はいかがでしょう？"
"1006402-22-店員" = "虎と龍を金糸で施した豪華な刺繍は、お客様の威厳をさらに強めてくれるに違いありません！"
"1006402-23-カヨコ" = "……今度は派手過ぎない？"
"1006402-24-店員" = "な、なるほど……確かにお客様は、こんな派手な装いをせずとも十分なオーラをお持ちですものね……。"
"1006402-25-店員" = "申し訳ございません！すぐに次の品を……。"
"1006402-26-店員" = "当店で取り扱っている最高級の鎧です……！"
"1006402-27-カヨコ" = "もはや着物ですらないけど……。"
"1006402-28-カヨコ" = "ひ、ひいっ……！？"
"1006402-29-店員" = "た、大変失礼いたしました！"
"1006402-30-店員" = "どうか命だけはお許しください……！"
"1006402-31-カヨコ" = "そんなつもりないけど……。"
"1006402-32" = "[s] \"……カヨコ？\""
"1006402-33-カヨコ" = "あれ、先生……？"
"1006402-34" = "[s1] \"近くを通ったら、カヨコの声が聞こえて。\"\n[s2] \"何かあったの？\""
"1006402-35-カヨコ" = "それが……。"
"1006402-36-カヨコ" = "それが……。"
"1006402-37" = "（その後、店員に事情を説明して誤解を解いた）"
"1006402-38-店員" = "そ、そうでしたか……。#nすみません、勝手に黒亀組かどこかのお偉方かと……。"
"1006402-39-店員" = "つい先走ってしまい……申し訳ございませんでした。"
"1006402-40-カヨコ" = "気にしなくて良いよ。怪しい人と思われるのには慣れてるから。"
"1006402-41-カヨコ" = "分かってくれたなら、他の着物を見せてくれる？#n……今度は普通の物で。"
"1006402-42-店員" = "でしたら……こちらはいかがですか？"
"1006402-43-店員" = "黒地の品があるデザインになってまして、お客様の髪色に映えるかと。#n成人式に参加する生徒さん向けですので、お手頃になっております！"
"1006402-44-カヨコ" = "うーん、デザインは気に入ったけど……。"
"1006402-45-カヨコ" = "黒の着物だと暗く見えないかな。#nただでさえ顔が怖いってよく言われるのに……。"
"1006402-46-カヨコ" = "先生はどう思う？"
"1006402-47" = "[s3] \"よく似合うと思うよ。\"\n[s4] \"カヨコの可愛さ倍増だね！\""
"1006402-48-カヨコ" = "可愛いだなんて……。"
"1006402-49-カヨコ" = "……からかわないで、先生。"
"1006402-50-カヨコ" = "じゃあ、これにしようかな。"
"1006402-51-店員" = "もうお決めになったのですか？#nまだ他にもご紹介していない商品が……。"
"1006402-52-カヨコ" = "大丈夫。前に着てたのと雰囲気が似てるし、黒が嫌なわけじゃないから。"
"1006402-53-カヨコ" = "……それに、先生が似合うと思うって言ってくれたし……。"
"1006402-54-店員" = "かしこまりました、こちらでご用意いたします！"
"1006402-55-カヨコ" = "……ありがとう。#n先生には、いつも助けられてばかりな気がする。"
"1006402-56-カヨコ" = "お礼って言うのもなんだけど、今度これを着たところ見せてあげる。"
"1006402-57-カヨコ" = "今すぐに……とはいかないかな。色々と準備があるから。"
"1006402-58" = "[s] \"分かった。楽しみにしてるよ！\""
"1006402-59-カヨコ" = "じゃあ、またね。先生。"
