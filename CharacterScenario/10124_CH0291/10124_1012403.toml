[translation]
"1012403-1" = "決戦の日"
"1012403-2" = "D.U. 郊外のショッピングモール"
"1012403-3" = "（待ち合わせ場所に指定されたのは、トリニティ自治区からかなり離れたショッピングモールだった）"
"1012403-4" = "（ハスミは随分前から待機していたようだ）"
"1012403-5-ハスミ" = "お待ちしておりました、先生。 "
"1012403-6" = "[s1] \"普段と違う場所で会うと、なんだか新鮮だね。\"\n[s2] \"でも、なんで遠くのお店を選んだの？\""
"1012403-7-ハスミ" = "ふふっ。そうですね。"
"1012403-8-ハスミ" = "こうしてトリニティの外へ出る機会は、ほとんどありませんから。"
"1012403-9-ハスミ" = "ええと、それは……。"
"1012403-10-ハスミ" = "水着のサイズが流出するのは……避けたく……。"
"1012403-11-ハスミ" = "いつもと違う土地であっても、支障はありません。"
"1012403-12-ハスミ" = "このモールに「ベロニカ」が出店しているのを確認しておりますから。"
"1012403-13" = "[s3] \"ベロニカって……。\"\n[s4] \"あ、生徒のみんながよく着てるブランドかな？\""
"1012403-14-ハスミ" = "ええ。現代までクラフトマンシップを継承している、数少ない高級ブランドでして……。"
"1012403-15-ハスミ" = "トリニティ総合学園との取り引きも長く、その品質は折り紙付きです。"
"1012403-16-ハスミ" = "あっ、お電話くださったトリニティの生徒さまですね？"
"1012403-17-ベロニカ店員" = "お待ちしておりました。本日[ruby=わたくし]は私が[/ruby]ご案内させていただきます。"
"1012403-18-ハスミ" = "ふふっ。よろしくお願いしますね。"
"1012403-19" = "[ns5] （……「デキる人」って感じだ）\n[ns6] （ハスミ、正義実現委員会のエリートだもんね……）"
"1012403-20-ハスミ" = "それでは先生、行きましょうか。"
"1012403-21" = "ベロニカ店内"
"1012403-22-ベロニカ店員" = "水着をお探しでしたら、こちらへどうぞ。#nちょうど今夏の最新アイテムをご用意しておりまして。"
"1012403-23-ハスミ" = "試着させていただいても大丈夫でしょうか？"
"1012403-24-ベロニカ店員" = "もちろんです。お気に召すものが見つかるまで何着でもどうぞ。"
"1012403-25-ハスミ" = "ふふっ、ありがとうございます。"
"1012403-26-ハスミ" = "それでは先生、後ほど。"
"1012403-27" = "[ns] （……いいお店過ぎて、緊張するな）"
"1012403-28-ハスミ" = "馬鹿な……！こ、こんなことが……！"
"1012403-29" = "[s] \"ハスミ？\""
"1012403-30-ハスミ" = "あっ、先生。す、すみませんが……店員の方は、そちらにいらっしゃいますか？"
"1012403-31-ベロニカ店員" = "はい、こちらに。"
"1012403-32-ハスミ" = "ええっと……。"
"1012403-33-ハスミ" = "こちら、もうワンサイズ上のものはありますか？"
"1012403-34-ベロニカ店員" = "ええ、もちろん。すぐにお持ちいたしますね！"
"1012403-35-ベロニカ店員" = "こちらになります！"
"1012403-36-ベロニカ店員" = "ありがとうございます。……今度こそ！"
"1012403-37-ベロニカ店員" = "そ、そんなはずは……！"
"1012403-38-ベロニカ店員" = "……店員さん。"
"1012403-39-ベロニカ店員" = "えっと……少し小さかった、でしょうか？"
"1012403-40-ベロニカ店員" = "大丈夫です！当店ではさらに大きなサイズも取り扱っておりますので！"
"1012403-41-ベロニカ店員" = "くっ……それを、お願いします！"
"1012403-42-ベロニカ店員" = "ええと……どこだったかな……。"
"1012403-43-ベロニカ店員" = "お待たせいたしました！"
"1012403-44-ベロニカ店員" = "……ありがとうございます。"
"1012403-45-ベロニカ店員" = "……。"
"1012403-46-ベロニカ店員" = "……？"
"1012403-47-ベロニカ店員" = "……店員さん。"
"1012403-48-ベロニカ店員" = "え、ええと……大変申し上げにくいのですが……。"
"1012403-49-ベロニカ店員" = "今試着されたものが、当店でご用意できる……最大のものになります。"
"1012403-50-ハスミ" = "……。"
"1012403-51-ベロニカ店員" = "……。"
"1012403-52" = "[ns] \"……。\""
"1012403-53" = "[ns] \"ハスミ……。\""
"1012403-54" = "[wa:1300]― [log=하스미 수영복]くぅ……[wa:2010]ふんっ！[wa:1390]ぬ[wa:403]ぬぬ……。[/log]"
"1012403-55" = "― [log=하스미 수영복]はっ、[wa:883]入りました！[/log]"
"1012403-56" = "― [log=하스미 수영복]ギリギリ、[wa:760]ですが……。[/log]"
"1012403-57" = "[wa:1950]― [log=하스미 수영복]ご覧の通り！[wa:2330]何の問題も！[/log]"
"1012403-58" = "― [log=하스미 수영복]ございません！[/log]"
"1012403-59" = "[wa:400]― [log=하스미 수영복]もう少し体を絞れば、[/log]"
"1012403-60" = "― [log=하스미 수영복]ジャストサイズになります！[/log]"
"1012403-61" = "[ns] \"い、一旦落ち着こう、ハスミ！\""
"1012403-62" = "[wa:1550]― [log=하스미 수영복]大丈夫です！[/log]"
"1012403-63" = "― [log=하스미 수영복]水着は[wa:430]これにします！[/log]"
"1012403-64" = "[wa:400]― [log=하스미 수영복]むしろ、[wa:1000]これが良いんです……！[/log]"
"1012403-65-ハスミ" = "こちらにします……！"
"1012403-66" = "[s7] \"は、ハスミ！？\"\n[s8] \"無理しなくても……！\""
"1012403-67-ハスミ" = "いいえ！私は覚悟を決めたのです！"
"1012403-68-ハスミ" = "サイズが合うものが見つかったのであれば、任務は達成です！ギリギリですが――"
"1012403-69-ハスミ" = "もう少し時間があれば……さらなる完璧な仕上がりも……！"
"1012403-70" = "[s9] \"（そんなに無理して……）\"\n[s10] \"（仕上げなくても……）\""
"1012403-71-ハスミ" = "さあ、店員さん！早く会計を！"
"1012403-72-ベロニカ店員" = "お、お会計を承ります！"
"1012403-73" = "（結局、ハスミは試着した水着をそのまま購入した）"
"1012403-74" = "（会計を済ませる際も、ハスミは熱い闘志を燃やしていた……！）"
