[translation]
"1012405-1" = "海辺にて"
"1012405-2" = "（絶好の海日和だ。ハスミとはここで待ち合わせをしているのだが……）"
"1012405-3" = "（視線の先……柱の陰から、大きな翼がちらりと見える）"
"1012405-4" = "[ns1] \"ハスミ、こっちだよ！\"\n[ns2] \"ハスミ？\""
"1012405-5-ハスミ" = "ハスミ、しっかり……！この日のためにやってきたのでしょう……！"
"1012405-6-ハスミ" = "せ、先生……。"
"1012405-7-ハスミ" = "……変では、ないですか？"
"1012405-8" = "[s3] \"そんなことないよ！\"\n[s4] \"水着もバッチリ！\""
"1012405-9-ハスミ" = "え、ええ！水着の方は完璧です！きつくもありません！"
"1012405-10-ハスミ" = "た、ただ……その……私は他の方よりも少し……だけ……。"
"1012405-11-ハスミ" = "大きめなので……可愛いデザインが浮いてしまうのでは……と。"
"1012405-12" = "[s] \"すっごく似合ってる！\""
"1012405-13-ハスミ" = "ありがとうございます……安心しました。"
"1012405-14-ハスミ" = "さて……スケジュールに余裕はあるものの……。"
"1012405-15-ハスミ" = "何をして過ごしましょうか？"
"1012405-16" = "[s5] \"私も今日は空いてるから……。\"\n[s6] \"よかったら、遊び相手になってほしいなって。\""
"1012405-17-ハスミ" = "え、ええ……先生のお願いとあらば……。"
"1012405-18" = "[s] \"じゃあ、まずは砂浜でお城を作ろう！\""
"1012405-19-ハスミ" = "す、砂のお城ですか……？"
"1012405-20-ハスミ" = "しょ、少々可愛らしすぎるのでは……？"
"1012405-21-ハスミ" = "ですが、先生がそうおっしゃるならば……。"
"1012405-22-ハスミ" = "喜んでお付き合いしましょう。"
"1012405-23" = "（ハスミと一緒に砂のお城を作って遊んだ）"
"1012405-24" = "（そして……）"
"1012405-25" = "[ns] \"ハスミ、次は砂埋めの時間だ！\""
"1012405-26-ハスミ" = "先生に……砂を乗せれば良いのですか？"
"1012405-27" = "[s] \"埋められるのは……ハスミの方だよ！\""
"1012405-28-ハスミ" = "……えっ！？"
"1012405-29" = "（ハスミと一緒に砂に埋まって遊んだ後は、海に出て……）"
"1012405-30-ハスミ" = "……先生、何か言っていただけませんか？"
"1012405-31" = "[s7] \"み、水に浮いたから半分成功だよ！\"\n[s8] \"なんで……前に進まないんだろう……？\""
"1012405-32-ハスミ" = "い、いえ！ゆっくりですが……確実に前進しています！"
"1012405-33-ハスミ" = "スピードもその内……出るはずです！"
"1012405-34" = "（意外にもハスミが泳ぎが苦手なことが判明したり……）"
"1012405-35-ハスミ" = "せ、先生。ここには立ち寄らないでおきましょう。"
"1012405-36-ハスミ" = "先生が何か召し上がりたいなら、お付き合いしますが……私の分は結構です。"
"1012405-37" = "[s9] \"あれ？お腹空いてない？\"\n[s10] \"海の家の料理は苦手？\""
"1012405-38-ハスミ" = "い、いえ……むしろ大好き……ですが！だからこそ！今は大丈夫です！"
"1012405-39" = "（頑なに拒否するハスミに押され、海の家を通り過ぎることになった……）"
"1012405-40-ハスミ" = "ふぅ……ここですね。"
"1012405-41-ハスミ" = "みなさん苦労されているようでしたが……スイカ割りは結構簡単ですね。"
"1012405-42" = "[s11] \"いや、一発で当てるなんてすごいよ！\"\n[s12] \"狙撃手って、みんなスイカ割りが得意なの……？\""
"1012405-43-ハスミ" = "どうも私は、他の方よりバランス感覚に秀でているようでして。"
"1012405-44-ハスミ" = "他の方よりも大きなこの翼が、重心を安定させている……のかもしれません。"
"1012405-45-ハスミ" = "そう考えると、少々複雑な気持ちですが。"
"1012405-46" = "[s] \"どうして？ハスミの翼、綺麗だと思うけど。\""
"1012405-47-ハスミ" = "そ、そうでしょうか……？"
"1012405-48-ハスミ" = "先生がそうおっしゃるなら――"
"1012405-49-ハスミ" = "この翼も、悪いものではありませんね。"
"1012405-50" = "（一緒にスイカ割りを楽しんだ後は……）"
"1012405-51-ハスミ" = "ビーチバレーは、複数人で行う競技ではないかと……。"
"1012405-52" = "[s13] \"そうだね……。\"\n[s14] \"でも、一対一でやってみたら、案外楽しいかもよ？\""
"1012405-53-ハスミ" = "そうおっしゃいましても……。"
"1012405-54-ハスミ" = "あっ……。"
"1012405-55" = "[s] \"大丈夫？\""
"1012405-56-ハスミ" = "ご心配おかけしました。少し、目眩が……。"
"1012405-57-ハスミ" = "問題ありません。この後も……。"
"1012405-58" = "[ns] \"ハスミ……！？\""
"1012405-59-ハスミ" = "うぅ……ここは……？"
"1012405-60" = "[ns] \"起きられる？\""
"1012405-61-ハスミ" = "先生が……日陰へ運んでくださった……のですね……本当に、申し訳ありません。"
"1012405-62-ハスミ" = "……えっ？先生が……運んでくださった……？"
"1012405-63-ハスミ" = "はっ……！あぁあぁぁぁ……！"
"1012405-64-ハスミ" = "お、重くてご迷惑をおかけしていないでしょうか……！？い、いえ、何もおっしゃらないでください！"
"1012405-65" = "[s] \"ハスミ、ごめん。\""
"1012405-66-ハスミ" = "なぜ先生が謝られるのでしょう？"
"1012405-67" = "[s15] \"ハスミも、疲れてたよね……？\"\n[s16] \"無理に付き合わせちゃったかなって……。\""
"1012405-68-ハスミ" = "そ、そんなことは……！"
"1012405-69-ハスミ" = "これは先生のせいではありません！ええと……その……。"
"1012405-70-ハスミ" = "……。"
"1012405-71" = "[s] \"ハスミ、気になってたんだけど……。\""
"1012405-72" = "[ns] \"何も食べてないの？\""
"1012405-73-ハスミ" = "……はい。"
"1012405-74-ハスミ" = "あっ、先生！どこへ……！？"
"1012405-75-ハスミ" = "ま、まさか、ここは……！？"
"1012405-76-海の家の店員" = "ご注文の焼きそばと、焼きとうもろこし、それにメロンソーダです！お食事が終わる頃に、デザートのかき氷とバニラアイスもお持ちしますね！"
"1012405-77-海の家の店員" = "いやー、いい食べっぷりですね！こっちまで嬉しくなりますよ！"
"1012405-78-ハスミ" = "とても美味しいのですが……すみません、ご馳走していただいて。#nそもそも、ご迷惑をおかけしてしまった後なのに……。"
"1012405-79" = "[s] \"ハスミ。\""
"1012405-80" = "[ns17] \"先生としては、無理にダイエットを頑張るよりも……。\"\n[ns18] \"健康的に、楽しく食べてもらったほうが嬉しいかも。\""
"1012405-81-ハスミ" = "反省します……ズズッ。"
"1012405-82" = "[s] \"硬い話はこの辺にして……もっと食べよう！\""
"1012405-83" = "（少し遅めの夕食をとり、ハスミと楽しい時間を過ごした）"
