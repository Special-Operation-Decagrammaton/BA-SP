[translation]
"1013205-1" = "今度は私の番、です……！"
"1013205-2" = "レストラン"
"1013205-3" = "（13時に、デパートの高級レストランで待ち合わせをした）"
"1013205-4-ツクヨ" = "こ、こんにちは、先生！"
"1013205-5-ツクヨ" = "お腹……空いてます、よね？"
"1013205-6-ツクヨ" = "す、空いてないと、ダメです……！"
"1013205-7" = "[s] \"ダメなの！？\""
"1013205-8-ツクヨ" = "お世話になって、ばかりでしたから……。"
"1013205-9-ツクヨ" = "今度は私が、ご馳走しようと、思いまして……。"
"1013205-10-ツクヨ" = "なので、今日はこうして……来ていただき、ました！"
"1013205-11" = "[s] \"このお店、高そうだけど……。\""
"1013205-12-ツクヨ" = "えへへ……。"
"1013205-13-ツクヨ" = "任せてください……アルバイト代が、入ったので！"
"1013205-14-ツクヨ" = "それに、ランチはバイキング形式で……お手頃、なんです！"
"1013205-15-ツクヨ" = "口コミを書けば、割引してもらえますし……クーポンも、合わせれば……！"
"1013205-16-ツクヨ" = "……ご、ごめんなさい。#n先生みたいに格好良く、ご馳走できたら、良かったのですが……。"
"1013205-17" = "[s] \"ううん、クーポンは私もよく使うよ！\""
"1013205-18-ツクヨ" = "ほ、本当ですか……？"
"1013205-19-ツクヨ" = "で、では……！"
"1013205-20-ツクヨ" = "まず、飲み物を……。"
"1013205-21-ツクヨ" = "あっ……すみません……。"
"1013205-22-ツクヨ" = "も、もしもし……。"
"1013205-23-ツクヨ" = "はい、はい……その、ごめんなさい。"
"1013205-24-ツクヨ" = "代表モデル……？"
"1013205-25-ツクヨ" = "い、いえ……ですが、今回は……。"
"1013205-26-ツクヨ" = "はい、失礼します……。"
"1013205-27" = "[ns] \"今の電話は？\""
"1013205-28-ツクヨ" = "あ、この前の社長さん、です。"
"1013205-29-ツクヨ" = "フィッティングモデルのお話を、頂いたのですが……。"
"1013205-30-ツクヨ" = "……お断り、しました。"
"1013205-31-ツクヨ" = "えっと……飲み物を取りに行くところ、でしたね。"
"1013205-32-ツクヨ" = "行きましょう、先生。"
"1013205-33" = "（ツクヨと楽しく食事をしてから……）"
"1013205-34" = "（散歩を兼ねて、デパートを歩くことにした）"
"1013205-35" = "デパート地下のショッピングモール"
"1013205-36-ツクヨ" = "先生、お口に合いましたか……？"
"1013205-37" = "[s1] \"最高だったよ！\"\n[s2] \"どの料理も美味しかったね！\""
"1013205-38-ツクヨ" = "えへへ……気に入っていただけたなら嬉しい、です……！"
"1013205-39-ツクヨ" = "次は……デザートもどう、ですか？"
"1013205-40-ツクヨ" = "先日、自家製アイスクリームのお店がオープン、したんです。"
"1013205-41-ツクヨ" = "乳脂肪たっぷりで究極の味を追求している有名店、だそうで……！"
"1013205-42" = "[s] \"なるほど……それは気になるね！\""
"1013205-43-ツクヨ" = "実際、すごく美味しいと、評判で――"
"1013205-44-女の子A" = "……もうヤダ。"
"1013205-45-ツクヨ" = "……？"
"1013205-46-女の子A" = "こんな身長じゃ、可愛い洋服が全然着られない……。"
"1013205-47-女の子A" = "このサイズだと、靴も全然ないし……。"
"1013205-48-女の子B" = "さ、探せば見つかるよ！"
"1013205-49-女の子A" = "でも……。"
"1013205-50-女の子A" = "この身体じゃ、どうせ似合わないもん。"
"1013205-51-女の子A" = "どのマネキンも……私よりずっと背が低いじゃん。"
"1013205-52-女の子B" = "け、けど……。"
"1013205-53-ツクヨ" = "あの、先生……。"
"1013205-54-ツクヨ" = "……電話をしてきても、良い、でしょうか？"
"1013205-55" = "[s] \"もちろん。\""
"1013205-56-ツクヨ" = "ありがとう、ございます……。"
"1013205-57-ツクヨ" = "……はい、ツクヨです。"
"1013205-58-ツクヨ" = "フィッティングモデルの件、まだ、間に合いますか……？#nはい……よろしくお願いします！"
"1013205-59" = "[ns] \"ツクヨ……？\""
"1013205-60-ツクヨ" = "……先ほどのオファー、受けることにしました。"
"1013205-61-ツクヨ" = "大きいだけの私、でも……。"
"1013205-62-ツクヨ" = "……誰かに、勇気を与えられるかもしれないと、思ったんです。"
"1013205-63-ツクヨ" = "体の大きさなんて気にせずに、ファッションを楽しんで、もらいたくて……。"
"1013205-64-ツクヨ" = "すみません……その、そこまでの影響があるかは、分かりませんが……。"
"1013205-65" = "[s3] \"そんなことないよ！\"\n[s4] \"ツクヨはキヴォトスで、一番のモデルだよ！\""
"1013205-66-ツクヨ" = "ふええぇ……！"
"1013205-67-ツクヨ" = "それで、その……ごめんなさい。"
"1013205-68-ツクヨ" = "アイスクリームは、また今度に……！"
"1013205-69" = "（数日後）"
"1013205-70" = "デパート地下のショッピングモール"
"1013205-71-ツクヨ" = "（わ、私の写真が、洋服屋さんの広告、に……！）"
"1013205-72-ツクヨ" = "（うぅぅ……覚悟はしていましたが、やっぱり、恥ずかしい……！）"
"1013205-73-ツクヨ" = "（これを見てくれる人、は……）"
"1013205-74-女の子B" = "あっ、ポスター変わってる。"
"1013205-75-女の子A" = "んー？"
"1013205-76-女の子B" = "今回のモデルさん、身長高いね。"
"1013205-77-女の子A" = "……本当だ。"
"1013205-78-女の子B" = "やっぱり身長が高くても、似合う服はいっぱいあるよ。"
"1013205-79-女の子A" = "……うん、そうかも。"
"1013205-80-ツクヨ" = "……えへへ。"
