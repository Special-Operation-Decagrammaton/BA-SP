[translation]
"1011905-1" = "辿り着いた夜明け"
"1011905-2" = "（日が沈む頃、ナグサと合流してパトロールを始めた）"
"1011905-3" = "（広い範囲ではないし、早めに終わると思ったけれど……）"
"1011905-4" = "（その予想は大きく外れるのだった）"
"1011905-5-ナグサ" = "こんな時間に出歩いてたら危ないよ。"
"1011905-6-彷徨う生徒" = "……あんたとは関係ないじゃん。"
"1011905-7-ナグサ" = "そうだね。"
"1011905-8-ナグサ" = "でも、見てしまったから。#nどうせなら、近くのファミレスとかカフェに行った方がいいよ。"
"1011905-9-彷徨う生徒" = "嫌だね。お姉に会っちまう。"
"1011905-10-ナグサ" = "……お姉さん？"
"1011905-11" = "[ns] \"お姉さんと何かあったの？\""
"1011905-12-彷徨う生徒" = "……別に。"
"1011905-13-彷徨う生徒" = "「喧嘩して勢いで家出したけど、行き先がなかった」ってわけじゃないんだからね！"
"1011905-14" = "[s] \"もしよかったら相談に乗るよ。\""
"1011905-15" = "（家出した生徒の面倒を見たり……）"
"1011905-16-ナグサ" = "……ねぇ。"
"1011905-17-怪しげな生徒" = "え、私ですか？"
"1011905-18-ナグサ" = "ここで何をしてるの？"
"1011905-19-怪しげな生徒" = "見ての通り、こ、工事ですよ。"
"1011905-20-怪しげな生徒" = "ここに埋もれた下水道……いや、上水道の交換で……！"
"1011905-21-ナグサ" = "私が知る限りだと、この辺で水道管工事の予定はなかったと思うけど。"
"1011905-22-ナグサ" = "しかも、こんな遅い時間に。"
"1011905-23-怪しげな生徒" = "荷物の中身、見せてくれる？"
"1011905-24-傭兵バイトA" = "ううっ……！"
"1011905-25-魑魅一座A" = "くそっ！みんな逃げろ！"
"1011905-26-魑魅一座B" = "わざわざ暗くなってからやってたのにーっ！"
"1011905-27-魑魅一座A" = "完璧な計画がこんなところでーっ！"
"1011905-28-ナグサ" = "……逃がさない。"
"1011905-29" = "（魑魅一座の企みを阻止したり……）"
"1011905-30" = "[ns] \"失礼ですが……お宅はどちらですか？\""
"1011905-31-泥酔した住民" = "家～？この空が屋根！その下はぜ～んぶ家なんだ～。"
"1011905-32-泥酔した住民" = "自分の家で寝てて……なんか文句あんのか！？"
"1011905-33" = "[s1] \"こんなところで寝るのは危ないので――\"\n[s2] \"近くのヴァルキューレ交番までご案内します。\""
"1011905-34-泥酔した住民" = "何～！？警察に引き渡すってか！？"
"1011905-35-泥酔した住民" = "そうはさせないぞ！かかってこい！"
"1011905-36-ナグサ" = "面倒だから暴れないで。"
"1011905-37" = "[s] \"や、優しくね……！\""
"1011905-38" = "（酔っぱらいの対応をしたり……思ったより時間がかかってしまった）"
"1011905-39" = "[ns] \"つ、疲れた……。\""
"1011905-40-ナグサ" = "お疲れ様、先生。"
"1011905-41-ナグサ" = "今日はいつもより多かったかな。"
"1011905-42-ナグサ" = "こんな時間になるなんて思わなかった。"
"1011905-43" = "[s] \"そろそろ部室に戻ろうか。\""
"1011905-44-ナグサ" = "ちょっと待って。"
"1011905-45-ナグサ" = "一日の中で、この時間帯が一番暗いの。"
"1011905-46-ナグサ" = "足元が見にくいし、いま動くのは得策じゃない。"
"1011905-47-ナグサ" = "……戻るなら、もう少し明るくなってから。"
"1011905-48" = "（近くにあった喫茶店の縁側を借りて、夜が明けるまで待つことにした）"
"1011905-49-ナグサ" = "……静かだよね。"
"1011905-50-ナグサ" = "この喫茶店、いつもお客さんで賑わってるのに……#nこの時間だと、まるで時が止まったみたい……。"
"1011905-51-ナグサ" = "……ここ、たまに来るんだ。"
"1011905-52-ナグサ" = "今日みたいに帰りが遅くなったとき、この縁側で夜明けを待つの。"
"1011905-53" = "[s] \"気に入ってるんだね。\""
"1011905-54-ナグサ" = "……そんな明るい理由じゃない。"
"1011905-55-ナグサ" = "怖さを紛らわせるため。"
"1011905-56-ナグサ" = "私は……暗闇が怖いの……。"
"1011905-57" = "[wa:2040]― [log=나구사ND]夜が明けるこの瞬間が――[/log]"
"1011905-58" = "[wa:2960]― [log=나구사ND]もっとも[wa:1960]闇が深くなる。[/log]"
"1011905-59" = "― [log=나구사ND]私は……[wa:2380]この漆黒が恐ろしかった。[/log]"
"1011905-60" = "[wa:1630]― [log=나구사ND]闇夜を照らすほど[wa:1910]眩しく輝くことも――[/log]"
"1011905-61" = "[wa:3500]― [log=나구사ND]夜が明けるまで[wa:2150]耐え忍ぶことも、[/log]"
"1011905-62" = "― [log=나구사ND]私には[wa:2330]できなかったから。[/log]"
"1011905-63" = "― [log=나구사ND]他人を演じることで――[/log]"
"1011905-64" = "[wa:2680]― [log=나구사ND]影に紛れて[wa:910]平静を装うことしか、[wa:2660]できなかったの。[/log]"
"1011905-65" = "[wa:750]― [log=나구사ND]でも――[wa:1900]今は[wa:590]違う。[/log]"
"1011905-66" = "[wa:1300]― [log=나구사ND]明けない夜はないと――[/log]"
"1011905-67" = "[wa:2700]― [log=나구사ND]私の影が落ちると、[wa:2770]知ったから。[/log]"
"1011905-68" = "― [log=나구사ND]だから――[/log]"
"1011905-69" = "[wa:1520]― [log=나구사ND]黄昏に[wa:2000]名乗りをあげよう――[/log]"
"1011905-70" = "― [log=나구사ND]――私は[wa:1890]百花繚乱紛争調停委員会の[wa:2180]委員長、[/log]"
"1011905-71" = "[wa:2010]― [log=나구사ND]御稜[wa:460]ナグサ！[/log]"
"1011905-72-ナグサ" = "そろそろ日が昇る。"
"1011905-73-ナグサ" = "……散々な夜だったね。"
"1011905-74" = "[s] \"ふふっ、本当にね。\""
"1011905-75-ナグサ" = "でも、もしかしたら……こんな騒がしくも馬鹿らしい夜こそ――"
"1011905-76-ナグサ" = "百鬼夜行連合学院の名に相応しいのかもしれないね。"
