[translation]
"1011906-1" = "雪女の夏"
"1011906-2" = "（シャーレの仕事をこなしながら、当番の生徒を待っていた）"
"1011906-3" = "[ns1] \"今日はナグサだったはず……。\"\n[ns2] \"何かあったのかな……。\""
"1011906-4-ナグサ" = "遅れてごめんなさい。"
"1011906-5-ナグサ" = "道に迷っていたの……。"
"1011906-6" = "[s] \"いいよ、気にしないで。\""
"1011906-7" = "[ns] \"……どこか具合悪い？\""
"1011906-8-ナグサ" = "……いや、大丈夫。"
"1011906-9-ナグサ" = "それより、当番の仕事を――"
"1011906-10" = "[s3] \"無理はしないで。\"\n[s4] \"健康第一だよ。\""
"1011906-11-ナグサ" = "……ちょっと暑さに負けてるかも。"
"1011906-12-ナグサ" = "休めば回復はするから……。"
"1011906-13" = "[ns5] \"ここで扇風機にあたってて。\"\n[ns6] \"休憩室から冷たい飲み物でも持ってくるよ。\""
"1011906-14-ナグサ" = "そんな……先生にこれ以上迷惑をかけるわけには――"
"1011906-15-ナグサ" = "ごめんなさい……素直に休むね……。"
"1011906-16" = "（ナグサに冷たい飲み物を渡して、元気になるまでそばにいた）"
"1011906-17-ナグサ" = "ふぅ……ちょっとよくなった気がする。"
"1011906-18-ナグサ" = "ありがとう、先生。助かったよ。"
"1011906-19" = "[s] \"どういたしまして。\""
"1011906-20" = "[ns7] \"今日ってそんなに暑かったっけ？\"\n[ns8] \"ずっとここにいたから、気づかなかった。\""
"1011906-21-ナグサ" = "いや、そこまでじゃないよ。これは私の問題。"
"1011906-22-ナグサ" = "私……暑さに弱いほうなんだ。"
"1011906-23-ナグサ" = "気温が少し上がるだけで、体調を崩しやすくなるの。"
"1011906-24-ナグサ" = "……小さい頃はよく「雪女」って呼ばれてた。"
"1011906-25-ナグサ" = "子供はこういうところで安直だからね。"
"1011906-26" = "[s] \"美人な妖怪だし、悪い事ばかりでもないんじゃない？\""
"1011906-27-ナグサ" = "……私はあんまり好きじゃないかな。"
"1011906-28" = "[s] \"どうして？\""
"1011906-29-ナグサ" = "雪女の物語はどうせ悲しい結末だから。"
"1011906-30-ナグサ" = "雪女がいくら頑張っても、人々は遠ざかってしまう。#n冷たく見えるからって。"
"1011906-31-ナグサ" = "存在すら否定されて、不幸な結末を迎えるのが……他人事には思えなかった。"
"1011906-32-ナグサ" = "でも、雪女が嫌われる理由も分かるんだ。"
"1011906-33-ナグサ" = "冷たい雪と、暖かい日差し……どちらが好きかなんて、聞くまでもない。"
"1011906-34" = "[s] \"……その飲み物、まだ冷えてるよね？\""
"1011906-35-ナグサ" = "え？うん、氷もいっぱい残ってる。"
"1011906-36" = "[s] \"暑いとさ、冷たい氷が欲しくなるよね。\""
"1011906-37-ナグサ" = "それは……そうだけど……。"
"1011906-38" = "[s9] \"冬の氷と、夏の氷で意味が全然違うように。\"\n[s10] \"同じものでも、見る角度が違えば捉え方は変わってくる。\""
"1011906-39" = "[ns11] \"自分と仲間を信じてあげて。\"\n[ns12] \"いつかきっと、幸せな結末を迎えられるから。\""
"1011906-40-ナグサ" = "……夏を生きた雪女の話は今までなかったよね。"
"1011906-41-ナグサ" = "ふふ……ちょっとだけ、夏が待ち遠しくなったかも。#nありがとう、先生。"
