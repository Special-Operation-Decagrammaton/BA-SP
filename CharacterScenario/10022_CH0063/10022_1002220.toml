[translation]
"1002220-1" = "ずっと大切なもの"
"1002220-2" = "（そうして、ヒナが待っている海辺に急いで向かった）"
"1002220-3" = "[ns] \"ヒナ、お待たせ。\""
"1002220-4-ヒナ" = "あ、先生……。"
"1002220-5-ヒナ" = "急なお願いだったから、心配したけど……。"
"1002220-6-ヒナ" = "……来てくれてありがとう、先生。"
"1002220-7" = "[s] \"ヒナの頼みなら、喜んで駆けつけるよ。\""
"1002220-8-ヒナ" = "あ……。"
"1002220-9-ヒナ" = "……そうなんだ、先生はそんなに……。"
"1002220-10-ヒナ" = "……ふふっ。"
"1002220-11" = "[s1] \"水泳なら任せて。全力で教えるね！\"\n[s2] \"あまり泳ぐのは得意じゃないけど、ヒナのためなら全力で頑張るね。\""
"1002220-12-ヒナ" = "そう言ってくれると、すごく頼もしい。"
"1002220-13-ヒナ" = "そ、そうなの……？"
"1002220-14" = "[s3] \"ヒナと一緒に自分も水泳の勉強をしていくよ。\""
"1002220-15-ヒナ" = "あ……う、うん。"
"1002220-16-ヒナ" = "先生がこんなにもやる気を見せてくれるのなら、私も負けていられない。"
"1002220-17-ヒナ" = "やるからには、全力で頑張るね。#n先生の時間をあまりもらうのも、申し訳ないから。"
"1002220-18-ヒナ" = "その……物覚えが良いところが、数少ない私の長所、だし……"
"1002220-19-ヒナ" = "それじゃ早速……。"
"1002220-20" = "[ns] \"待って、それはダメだよ！\""
"1002220-21-ヒナ" = "……？#nダメ……？"
"1002220-22" = "[s4] \"早く上達しようと思わなくていいよ。時間なんて思う存分奪ってほしい。\"\n[s5] \"短時間の習得は、身についたとしても定着しないからね。\""
"1002220-23-ヒナ" = "でも、せっかくの休日だし……遊ぶというわけでもないのだから。"
"1002220-24-ヒナ" = "私の指導で一日を浪費するのは、やっぱり申し訳……"
"1002220-25" = "[s] \"ヒナと一緒に過ごせるだけでいいんだよ。\""
"1002220-26-ヒナ" = "……二人で穏やかに過ごす時間が、の……のぞ、望むところ……？"
"1002220-27-ヒナ" = "信じられないなら、ここで確かめてもいいって…… "
"1002220-28-ヒナ" = "ま、待って！人目があるから、#nそ……その、やっぱりそういうのはちょっと……。"
"1002220-29-ヒナ" = "……まったく、あなたという人は本当に……。"
"1002220-30-ヒナ" = "……。"
"1002220-31-ヒナ" = "……ふふっ。"
"1002220-32-ヒナ" = "そういうところ……やっぱりあなたらしい。"
"1002220-33-ヒナ" = "わかった。それじゃ先生、今日はよろしくね。"
"1002220-34" = "[s] \"よっしゃ！任せてちょうだい！\""
"1002220-35-ヒナ" = "さてと……。"
"1002220-36-観光客A" = "きゅ、急に何するんですか！？"
"1002220-37-観光客B" = "い、 いきなり撃ってくるなんて！#nどうしてこんなことを！？"
"1002220-38-チンピラA" = "あぁん？当たり前の事を聞くんじゃねぇよ！"
"1002220-39-チンピラB" = "こっちゃあな！あっつい日によぉ！#nイチャついてる奴らを見るとムカついてしゃあねぇんだ！"
"1002220-40-チンピラA" = "メチャクチャにしてやりたくなるんだよぉ！"
"1002220-41-チンピラA" = "リア充は全員地獄に堕ちろってんだ！！"
"1002220-42-観光客A" = "そんな身勝手な理由で！？"
"1002220-43" = "[ns] \"ヒナ、ちょっと……！\""
"1002220-44-ヒナ" = "……先生、少しだけ待ってて。"
"1002220-45-ヒナ" = "すぐに片付けてくる。"
"1002220-46" = "[ns] \"あっ、ヒナ！\""
"1002220-47-チンピラA" = "あん？おめぇ誰だ？"
"1002220-48-チンピラB" = "小柄で銀髪の……ちょ、こいつまさか！"
"1002220-49-チンピラA" = "う、うわあああっ！？"
"1002220-50-チンピラB" = "げ、ゲヘナの風紀委員長がなんでここに！？ガハッ！"
"1002220-51" = "（そうして、ヒナは騒ぎ起こす問題児を無慈悲に撃退していった）"
"1002220-52-観光客A" = "あ、ありがとうございます！おかげさまで助かりました！"
"1002220-53-観光客B" = "このご恩はどうお返しすればいいか……！"
"1002220-54-ヒナ" = "……いい、やるべきことをやっただけだから。"
"1002220-55" = "（感謝の意を表する人々を帰した直後）"
"1002220-56" = "[ns] \"お疲れ様、ヒナ。\""
"1002220-57-ヒナ" = "別に、本当に大したことなかったし。"
"1002220-58-ヒナ" = "夏になると、増えるんだ。こういう手合い、ゲヘナで何人も見てきたから。"
"1002220-59-ヒナ" = "これくらい、いつもの事、というか……。"
"1002220-60" = "[s] \"さすがゲヘナの風紀委員長だね。\""
"1002220-61-ヒナ" = "だから、そんなんじゃないってば……"
"1002220-62" = "[ns] \"あれ？今の音は……。\""
"1002220-63-ヒナ" = "あっ、浮き輪に……穴が開いたみたい。"
"1002220-64" = "[s] \"ヒナの浮き輪が……？急にどうして……\""
"1002220-65-ヒナ" = "ああ……さっき戦った時に銃弾が掠っちゃったみたい。"
"1002220-66-ヒナ" = "私の判断ミスだよ。"
"1002220-67-ヒナ" = "今まで大丈夫だったから、油断したみたい。"
"1002220-68-ヒナ" = "もう少し注意すればよかった……。"
"1002220-69" = "[s] \"それはヒナのせいじゃないよ。\""
"1002220-70-ヒナ" = "ちがう、先生……。"
"1002220-71-ヒナ" = "穴が開いちゃったのは、私の扱い方が悪かったから……。"
"1002220-72-ヒナ" = "どうしようもないの……もう壊れてしまったんだし……。"
"1002220-73-ヒナ" = "…………。"
"1002220-74" = "[s] \"じゃ、直しに行こうか？\""
"1002220-75-ヒナ" = "直すって……浮き輪を？"
"1002220-76-ヒナ" = "それは……難しい。"
"1002220-77-ヒナ" = "この浮き輪、一応風紀委員会の備品だから、特殊な素材で作られているの。"
"1002220-78-ヒナ" = "整備科に持っていかないと、簡単には直せない。"
"1002220-79-ヒナ" = "よりにもよって……先生が水泳を教えてくれるタイミングでこんな……。"
"1002220-80-ヒナ" = "私……いつもこうなんだよね。"
"1002220-81-ヒナ" = "…………。"
"1002220-82-ヒナ" = "……むしろ、これで良かったのかもしれない。"
"1002220-83" = "[s] \"ヒナ？\""
"1002220-84-ヒナ" = "……水泳を習うなら、浮き輪はもう使わないでおこうって思っていたから。"
"1002220-85-ヒナ" = "昔から使ってたけど……いい機会なのかも。"
"1002220-86-ヒナ" = "ちょっと名残惜しいけど……卒業、しないとね。"
"1002220-87-ヒナ" = "……うん、浮き輪がなくても大丈夫。"
"1002220-88-ヒナ" = "その方が練習が捗りそう、だし……。"
"1002220-89-ヒナ" = "…………。"
"1002220-90-ヒナ" = "……先生。#n浮き輪は捨てて、練習しに……"
"1002220-91" = "[s] \"もちろん浮き輪がなくても、水泳の練習はできるよ。\""
"1002220-92-ヒナ" = "……？"
"1002220-93" = "[s] \"そして、ヒナの言う通り、いつかは卒業する日も来る。\""
"1002220-94-ヒナ" = "先生……？"
"1002220-95" = "[s] \"だからといって、それが今である必要はないんじゃない？\""
"1002220-96-ヒナ" = "……！それは……。"
"1002220-97-ヒナ" = "そう、だけど……。"
"1002220-98" = "[s6] \"それに、私はまだ見れてないからね。\"\n[s7] \"浮き輪の上でアワアワしている、可愛いヒナの姿を！\""
"1002220-99-ヒナ" = "せ、先生！？急に何を……！？"
"1002220-100-ヒナ" = "ほ、本気で言ってるのなら……私も怒るよ。"
"1002220-101" = "[ns] \"だ、だから！方法を探す前に諦めないでって話！\""
"1002220-102" = "[ns] \"それに……ヒナが昔から使ってた大切な浮き輪、でしょ？\""
"1002220-103-ヒナ" = "先生……"
"1002220-104-ヒナ" = "……はあ、まったく。"
"1002220-105-ヒナ" = "あなたはいつもそう。"
"1002220-106-ヒナ" = "先生がそこまで言うのなら……やってみる。"
"1002220-107" = "[s8] \"よし！じゃあ、修理してくれる場所を探しに行こうか。\"\n[s9] \"もちろん、全力で、ね！\""
"1002220-108" = "（そうしてヒナを説得した末、一緒に浮き輪を直せるところを探し回ることにした）"
"1002220-109-マスター" = "ふぅむ……これならこっちで直せると思うぞ。"
"1002220-110-ヒナ" = "……本当？"
"1002220-111-マスター" = "ゲヘナの新素材で作られた代物なんだろう？#n俄然やる気がわいてくるってもんだよ。"
"1002220-112-ヒナ" = "じゃあ――"
"1002220-113" = "[s] \"何卒！お願いします！\""
"1002220-114" = "（そうして浮き輪の修理が順調に進み……）"
"1002220-115-ヒナ" = "はいよ、お待ちどうさん！"
"1002220-116" = "[s] \"ありがとうございます！\""
"1002220-117-ヒナ" = "あ、ありがとう……。"
"1002220-118-マスター" = "礼はいいって！こっちこそ勉強させてもらったからな。"
"1002220-119" = "[ns] \"ヒナ、よかったね。\""
"1002220-120-ヒナ" = "うん、そうだね。#n本当に……直せたんだ……。"
"1002220-121-ヒナ" = "壊れちゃった時は、もうどうにもできないと思っていたけど……。"
"1002220-122-ヒナ" = "……ありがとう、先生。"
"1002220-123" = "[s] \"どういたしまして。\""
"1002220-124-ヒナ" = "でも……あちこち歩き回っていたら、もうこんな時間……。"
"1002220-125-ヒナ" = "……今日は色々とありがとう、先生。"
"1002220-126-ヒナ" = "呼び出しておいて言うセリフじゃないけど、もう遅いからこれで……。"
"1002220-127" = "[s] \"待って。まだ終わりじゃないよ。\""
"1002220-128-ヒナ" = "……え？"
"1002220-129" = "[s10] \"約束したよね？浮き輪を直すのも、\"\n[s11] \"水泳を教えるのも全力でやるって。\""
"1002220-130" = "[ns] \"だから、少し遅いかもだけど…… \"\n[ns] \"水泳の授業をしてもいいかな？\""
"1002220-131-ヒナ" = "あ……。"
"1002220-132-ヒナ" = "あ……。"
"1002220-133-ヒナ" = "あなたは相変わらず……。"
"1002220-134-ヒナ" = "うん。"
"1002220-135-ヒナ" = "あなたさえよければ、いくらでも……。"
"1002220-136-ヒナ" = "私も全力で、教わるから。"
"1002220-137" = "（その後、夜が熟して月が彼方に傾くまで、ヒナと水泳の授業を続けた）"
