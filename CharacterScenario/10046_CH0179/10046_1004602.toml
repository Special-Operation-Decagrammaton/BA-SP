[translation]
"1004602-1" = "イズナと一緒にスイカ割り！"
"1004602-2" = "（そうしてイズナに呼ばれ、熱い日差しが降り注ぐ夏の海辺へと向かった）"
"1004602-3-イズナ" = "あっ、主殿主殿！こっちです！こっち！"
"1004602-4" = "[s] \"イズナ、お待たせ。\""
"1004602-5-イズナ" = "いえ、とんでもありません！"
"1004602-6" = "[s1] \"それじゃあ、今日は何をしよっか？\"\n[s2] \"海に適応した忍びになる修行……だっけ？\""
"1004602-7-イズナ" = "はい！せっかくの夏、そして海ですから！"
"1004602-8-イズナ" = "イズナとしても、今しかできない活動をしたいなと！"
"1004602-9" = "[s] \"夏といえばやっぱり……水泳とか？\""
"1004602-10-イズナ" = "（！！）"
"1004602-11" = "[s] \"今日も暑いし、海に入ればきっと気持ち良……\""
"1004602-12" = "[ns] \"イズナ？\""
"1004602-13-イズナ" = "そ、その、主殿……。"
"1004602-14-イズナ" = "も、もちろんそれも良いのですが……！"
"1004602-15-イズナ" = "忍びの者として、ここは……！"
"1004602-16-イズナ" = "やはり、夏の海でしかできない、特殊な修行……！"
"1004602-17-イズナ" = "それをするというのは、いかがでしょう！！"
"1004602-18" = "[s] \"特殊な修行……？\""
"1004602-19-イズナ" = "はい、道具もきちんと準備いたしました！"
"1004602-20" = "[ns] \"スイカと……木刀？もしかしてこれって……\""
"1004602-21-イズナ" = "はい！夏と言えばやはりこの訓練……！"
"1004602-22-イズナ" = "そう、スイカ割りです！"
"1004602-23" = "[s3] \"訓練、かな……？確かに夏らしくはあるけど……。\"\n[s4] \"……忍者と関係、あったっけ？\""
"1004602-24-イズナ" = "ふふふっ……！"
"1004602-25-イズナ" = "何を隠そう、今から行うのはもちろん普通の「スイカ割り」ではありません！"
"1004602-26-イズナ" = "かの名高い忍者たちの間でも密かに流行っているという……#n「忍者流特別版スイカ割り」です！"
"1004602-27" = "[s] \"……ちなみにイズナ、それどこ情報？\""
"1004602-28-イズナ" = "部長が運営する「少女忍法帖ミチルっち」ですよ？"
"1004602-29" = "[s] \"そんな気はしてた。\""
"1004602-30-イズナ" = "この「忍者流特別版スイカ割り」のルールは、いたって簡単！"
"1004602-31-イズナ" = "忠誠を誓った主殿のご命令とあらば、それをしっかりとこなすのが忍びというもの！"
"1004602-32-イズナ" = "なのでご命令に従い、イズナがスイカを割るというルールです！"
"1004602-33" = "[s] \"今のところ、普通のスイカ割りに聞こえるけど……。\""
"1004602-34" = "[ns] \"まあ、とにかくやってみよっか。\""
"1004602-35-イズナ" = "えへへっ、はい！"
"1004602-36-イズナ" = "ではこうして、"
"1004602-37-イズナ" = "まずはスイカをセットしまして……"
"1004602-38-イズナ" = "お待たせしました、準備完了です！"
"1004602-39-イズナ" = "では、目をつぶりますので……"
"1004602-40-イズナ" = "さあ主殿、イズナへお好きなようにご命令を！"
"1004602-41" = "[s] \"じゃあ、まずは……\""
"1004602-42-イズナ" = "（ドキドキ……！）"
"1004602-43" = "[s5] \"そのまま前に三歩。\"\n[s6] \"そのまま後ろに四歩。\""
"1004602-44-イズナ" = "はい！イズナ、参ります！"
"1004602-45-イズナ" = "はい！イズナ、参ります！"
"1004602-46" = "[ns] \"イズナ！？ちょっと待って！？\""
"1004602-47-イズナ" = "けほっ、けほっ……イズナ、不覚を取りました……。"
"1004602-48" = "[s] \"大丈夫？\""
"1004602-49-イズナ" = "はい！ご心配なく！"
"1004602-50-イズナ" = "主殿の声が聞こえるや否や、ついダッシュしてしまいましたが……。"
"1004602-51-イズナ" = "次はきっと大丈夫です！"
"1004602-52-イズナ" = "さあ、今度こそ成功させてみせますよ！主殿！"
"1004602-53" = "[s] \"えっと、じゃあまず右に……\""
"1004602-54-イズナ" = "右！！！"
"1004602-55-イズナ" = "はあぁぁぁっ！！"
"1004602-56" = "[ns] \"い、イズナ！？\""
"1004602-57-イズナ" = "けほ、けほっ……！またしてもやってしまいました"
"1004602-58-イズナ" = "……が！まだ諦めはしません！"
"1004602-59-イズナ" = "主殿！さあ、もう一度！"
"1004602-60" = "[s] \"う、うん。じゃあ、左側に……\""
"1004602-61-イズナ" = "とぉっ！！！"
"1004602-62-イズナ" = "ま、まだです！"
"1004602-63-イズナ" = "行きます、イズナ流忍法！"
"1004602-64" = "（そうして何度か繰り返してみたものの……）"
"1004602-65" = "（砂埃が立ち上がるばかりで、）"
"1004602-66" = "（スイカは相変わらず綺麗な形のままだった）"
"1004602-67-イズナ" = "うぅっ……まさか、スイカがこんなにも強敵だったとは……。"
"1004602-68-イズナ" = "イズナ、剣先ひとつ触れることができませんでした……。"
"1004602-69-イズナ" = "これが「忍者流特別版スイカ割り」……侮れません！"
"1004602-70" = "[s7] \"多分問題はそこじゃないというか……。\"\n[s8] \"その前に、考えた方が良さそうな点が……。\""
"1004602-71-イズナ" = "そ、そうなのですか！？"
"1004602-72-イズナ" = "うぅ……ですが確かに、イズナからこの訓練を言い出したのに……。"
"1004602-73-イズナ" = "一度もまともにこなせず、ミスしてばかりで……。"
"1004602-74-イズナ" = "ですので、主殿がそう仰るのも"
"1004602-75-イズナ" = "無理はありません……。"
"1004602-76-イズナ" = "うっ、申し訳ありません主殿～！"
"1004602-77-イズナ" = "こんな暑い日に！イズナが至らぬせいで！主殿を失望させてしまい……！"
"1004602-78" = "[s] \"せ、責めてるわけじゃないよ！大丈夫！\""
"1004602-79-イズナ" = "そ、そうなのですか……？"
"1004602-80" = "[s9] \"うん。だからまずはその、言われてすぐ動くんじゃなくて。\"\n[s10] \"じっくり考えてから動いてみるのはどうかな？\""
"1004602-81-イズナ" = "なるほど……つまり、命令を受けてすぐ動いてしまうよりも……。"
"1004602-82-イズナ" = "忍びとして、しっかり綿密に作戦を理解して動くべし……そういうことですね！"
"1004602-83-イズナ" = "なるほど！そのお言葉、一生胸に刻もうと思います！"
"1004602-84-イズナ" = "……。"
"1004602-85-イズナ" = "……………。"
"1004602-86-イズナ" = "と思ったのですが、主殿……どうやらそれは難しそうです。"
"1004602-87" = "[s] それはまた、どうして？"
"1004602-88-イズナ" = "その、イズナは主殿の声が聞こえると、すぐ身体が動いてしまうので……。"
"1004602-89-イズナ" = "ですが、スイカ割りはきっちり成功したいですし……。"
"1004602-90-イズナ" = "ですが、やはり主殿の声を聞いて動かないというのは……！"
"1004602-91-イズナ" = "うわぁん！どうしましょう主殿！？"
"1004602-92-イズナ" = "スイカ割りが、こんなに難しい訓練だったとは……イズナ、全く知りませんでした！"
"1004602-93-イズナ" = "それでも、"
"1004602-94-イズナ" = "イズナは諦めません……"
"1004602-95-イズナ" = "せっかくこうして、主殿と訓練ができるのですから！"
"1004602-96" = "[s11] \"そ、そっか……。\"\n[s12] \"イズナ、良い子……！\""
"1004602-97" = "（それ以上イズナに対して）"
"1004602-98" = "（「やめよう」などと言うことはできず……）"
"1004602-99" = "（結局……）"
"1004602-100" = "[ns] \"……よし。じゃあ取り敢えず、成功するまで数をこなそう！\""
"1004602-101-イズナ" = "……！"
"1004602-102-イズナ" = "はい！イズナ、頑張ります！"
"1004602-103-イズナ" = "ニンニン！"
"1004602-104" = "（その後、何度も暴走して飛び出すイズナと一日中スイカ割りをして）"
"1004602-105" = "（どうにか訓練が終わった後、修行で疲れたイズナと一緒に美味しくスイカを食べたのだった）"
