[translation]
"2002802-1" = "落ち着かない心"
"2002802-2" = "（待ち合わせ場所の海辺に到着すると……）"
"2002802-3" = "（サマーベッドやパラソルが用意されているのに、なぜかその隣に立っているヒナタの姿があった）"
"2002802-4" = "[ns1] \"……ヒナタ、どうしたの？\"\n[ns2] \"大丈夫？顔色が悪いけど……。\""
"2002802-5-ヒナタ" = "あ、先生！"
"2002802-6-ヒナタ" = "来てくださって、ありがとうございます。#nすみません、お忙しいところ……"
"2002802-7-ヒナタ" = "……あ、こちらですか？"
"2002802-8-ヒナタ" = "あ……はい。"
"2002802-9-ヒナタ" = "サマーベッドとパラソルで……"
"2002802-10-ヒナタ" = "って、これくらい先生が知らないはずありませんよね！失礼しました！"
"2002802-11-ヒナタ" = "ここにセットしてある理由は……えっと、その……"
"2002802-12-ヒナタ" = "……ど、どう説明すれば、良いのでしょうか……はは……"
"2002802-13-ヒナタ" = "あの……"
"2002802-14-ヒナタ" = "実は、自分で持ってきたのですが……コレに関して悩んでしまっていまして……"
"2002802-15-ヒナタ" = "とりあえず、こうして設置してみたところまでは良かったんです。"
"2002802-16" = "[s3] \"ゆっくりで大丈夫だから、詳しくお願いできるかな？\"\n[s4] \"設置してみたところまでは……？\""
"2002802-17-ヒナタ" = "その……い、今は一応、休暇中ですし……"
"2002802-18-ヒナタ" = "せっかく無人島まで来たのだから、ゆっくりしようと考えたんです。"
"2002802-19-ヒナタ" = "シスターフッドのみなさんに見送っていただいた時、#n調査の手伝いを終えたら、しっかり休むようにと言われたのですが……"
"2002802-20-ヒナタ" = "うまく、できないんです。#n心の片隅にある罪悪感が[ruby=ぬぐ]拭[/ruby]いきれなくて……"
"2002802-21-ヒナタ" = "私だけ、こんな風に過ごしていても良いのだろうか、と思ってしまい……"
"2002802-22-ヒナタ" = "あまりにも日常と異なる時間を過ごしているのが原因かも、しれませんが……"
"2002802-23-ヒナタ" = "ここに来るまでは、朝早くに起きて、決められた日課をこなし……"
"2002802-24-ヒナタ" = "日暮れ頃には、みなさんと片付けを行い、一日を終える……そんな規則正しい生活をしていたので……"
"2002802-25-ヒナタ" = "……きっと、今も聖堂では、私以外の皆さんは同じように過ごしていると思います。"
"2002802-26-ヒナタ" = "そして、本来であれば私がやるべきことまで……他の方が、代わりにやってくださっているのでしょう。"
"2002802-27-ヒナタ" = "……………。"
"2002802-28" = "[s5] \"自分だけ楽をしている気がする、とか？\"\n[s6] \"仕事を押し付けてしまった、と感じてるの？\""
"2002802-29-ヒナタ" = "も、もちろん、他の方がお休みされている時は、"
"2002802-30-ヒナタ" = "そういった気持ちにはならないのですが……"
"2002802-31-ヒナタ" = "……頭では、みなさんが本心から休んでほしいと言ってくださってるのだと理解しているのです。"
"2002802-32-ヒナタ" = "だから、みなさんを疑っているわけではなくて……"
"2002802-33-ヒナタ" = "……え？"
"2002802-34-ヒナタ" = "横に……ですか？"
"2002802-35-ヒナタ" = "い、いえ、まだ気持ちが落ち着かず……見ているだけで。"
"2002802-36-ヒナタ" = "まずは横になってから考えよう……？"
"2002802-37-ヒナタ" = "え、えっと……それは……"
"2002802-38-ヒナタ" = "い、いえ。先生が仰るからには、何か理由があるのですよね。"
"2002802-39-ヒナタ" = "でしたら、まずは試しに……"
"2002802-40-ヒナタ" = "よいしょっと……こうやって、足を伸ばして……"
"2002802-41" = "[wa:200]― [log=히나타 수영복]ん……[wa:850]んん……？[wa:1250]あら……？[/log]"
"2002802-42" = "― [log=히나타 수영복]ここ……[/log]"
"2002802-43" = "― [log=히나타 수영복]思っていた以上に、[wa:1300]リラックスできる……。[/log]"
"2002802-44" = "[wa:400]― [log=히나타 수영복]適度に涼しくて、[wa:1950]でも冷えすぎず……[/log]"
"2002802-45" = "― [log=히나타 수영복]顔は[wa:400]影に隠れますし……。[/log]"
"2002802-46" = "― [log=히나타 수영복]ポカポカしていて……[/log]"
"2002802-47" = "― [log=히나타 수영복]横になっていると、[wa:1550]眠ってしまいそうです。[/log]"
"2002802-48" = "[wa:550]― [log=히나타 수영복]ところで、[wa:850]その……[/log]"
"2002802-49" = "― [log=히나타 수영복]先生の前で私だけ、[wa:2200]横になっているのは……[/log]"
"2002802-50" = "― [log=히나타 수영복]な、[wa:750]なんだか……[wa:1180]申し訳ないような……。[/log]"
"2002802-51" = "[ns7] \"気にしないで大丈夫。\"\n[ns8] \"今は自分のことだけ考えて良いんだよ。\""
"2002802-52" = "[wa:150]― [log=히나타 수영복]か、[wa:850]かしこまりました。[/log]"
"2002802-53" = "[wa:150]― [log=히나타 수영복]か、[wa:850]かしこまりました。[/log]"
"2002802-54" = "― [log=히나타 수영복]それでは、[wa:1100]お言葉に甘えて……。[/log]"
"2002802-55" = "― [log=히나타 수영복]リラックスして……[wa:1680]楽に……。[/log]"
"2002802-56" = "[wa:350]― [log=히나타 수영복]……ふぅん……[wa:3750]んにゃぁ……[wa:1550]ふへへっ……。[/log]"
"2002802-57" = "― [log=히나타 수영복]……はっ！？[wa:550]わ、[wa:850]私は今何を……！？[/log]"
"2002802-58" = "[wa:150]― [log=히나타 수영복]わ、[wa:500]忘れてください、[/log]"
"2002802-59" = "― [log=히나타 수영복]今のは[wa:400]忘れてください！[wa:950]先生！！[/log]"
"2002802-60-ヒナタ" = "先生～～～！！"
"2002802-61" = "（その後、慌てて立ち上がろうとしたヒナタを落ち着かせ、再び横にさせると……）"
"2002802-62" = "（そのまま、1分ほどですぐ眠りに落ちた）"
