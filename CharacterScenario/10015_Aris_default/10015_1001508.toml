[translation]
"1001508-1" = "アリスの魔法"
"1001508-2" = "ミレニアム・ゲーム開発部"
"1001508-3-アリス" = "あっ、こんばんは先生。良い夜ですね。"
"1001508-4-アリス" = "……来てくれて、ありがとうございます。アリスは今日ずっと、一人でゲームをしていました。"
"1001508-5" = "[s] \"遅くなってごめんね、何のゲームをやってたの？\""
"1001508-6-アリス" = "レトロチックなRPGです。"
"1001508-7-アリス" = "やはりRPGが一番楽しいです。他のゲームも楽しいですが、RPGはまるでアリスの心の故郷のような感じがします。"
"1001508-8" = "[s] \"剣と魔法、だね。\""
"1001508-9-アリス" = "はい、RPGには付き物ですね。"
"1001508-10" = "[s] \"現実には無いロマンがあるし。\""
"1001508-11-アリス" = "……そう、思いますか？"
"1001508-12-アリス" = "アリスは、そうは思いません。"
"1001508-13" = "― アリスはキヴォトスに…[wa:2500]魔法がないとは思えません。"
"1001508-14" = "― 魔法は存在しています。[wa:2450]だって、[wa:850]先生は[wa:500]今、[wa:550]アリスを幸せにしてくれましたから。"
"1001508-15" = "― ゲームが面白い理由は[wa:3000]そこに、[wa:800]世界の美しさが込められているから。"
"1001508-16" = "[wa:100]― これは、[wa:550]先生を通じてわかったことです。"
"1001508-17" = "― ゲームも、[wa:1350]猫も、[wa:1350]友達も…[wa:1700]そして[wa:1800]今この瞬間も。"
"1001508-18" = "[wa:200]― この世界には[wa:1130]美しいものがたくさんあります。"
"1001508-19" = "― アリスはもっと知りたいです。[wa:3440]先生と一緒に…"
"1001508-20" = "― この世界のことを[wa:1250]もっと学びたいです！"
"1001508-21" = "（アリスと一緒に夜遅くまで、色々なRPGのことを語り合った）"
