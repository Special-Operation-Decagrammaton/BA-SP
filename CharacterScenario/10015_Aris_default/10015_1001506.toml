[translation]
"1001506-1" = "猫とアリス"
"1001506-2" = "ミレニアム・商店街"
"1001506-3-アリス" = "……。"
"1001506-4" = "（アリスが商店街で、上の方にある何かをボーっと眺めている）"
"1001506-5" = "[s1] \"アリス、何してるの？\"\n[s2] \"何か気になることでもあった？\""
"1001506-6-アリス" = "あ、こんにちは、先生。"
"1001506-7-アリス" = "アリスは今、猫さんを見ていました。"
"1001506-8" = "[s] \"猫……？\""
"1001506-9" = "（商店街の2階の手すりにいる猫が、毛を逆立ててアリスをものすごく警戒していた）"
"1001506-10-黒猫" = "フシャー！"
"1001506-11-アリス" = "アリスの方を見て怒っているんです、アリスは何もしてないのに……。"
"1001506-12-アリス" = "猫さんは、アリスのことが嫌いなんでしょうか？"
"1001506-13-アリス" = "一昨日も、昨日も怒っていたので、そのまま帰るしかありませんでした。"
"1001506-14-アリス" = "アリスは猫さんに触ってみたいのに、こちらに来てくれません……。"
"1001506-15" = "[s3] （持っていた猫のおやつを取り出す）\n[s4] \"こんなこともあろうかと。\""
"1001506-16-アリス" = "先生、これはなんですか？"
"1001506-17-アリス" = "先生、これはなんですか？"
"1001506-18-アリス" = "……もしかして、猫さんとの親密度を上げられるアイテムですか！？"
"1001506-19-アリス" = "先生は、猫さんの攻略法を知っているんですか？"
"1001506-20" = "[s5] \"ふふっ、見てて。\"\n[s6] 猫の前でおやつを振る。"
"1001506-21-黒猫" = "フシャーーーっ！！！"
"1001506-22" = "[s7] \"……！？\"\n[s8] \"おやつが通じない！？\""
"1001506-23-アリス" = "……さらに怒ってしまいました。アイテムの選択を間違えてしまったのかもしれません。"
"1001506-24-アリス" = "……さらに怒ってしまいました。アイテムの選択を間違えてしまったのかもしれません。"
"1001506-25-アリス" = "これ以上構いすぎるのも良くないでしょうし、残念ですがここまでかもしれません……バッドエンドです。"
"1001506-26-アリス" = "ごめんなさい、猫さん。怖がらせるつもりは無かったのですが……。"
"1001506-27-アリス" = "行きましょう、先生。"
"1001506-28" = "[s9] \"そうだね……。\"\n[s10] \"残念だけど仕方ないね……。\""
"1001506-29-黒猫" = "……ニャー。"
"1001506-30-アリス" = "！！"
"1001506-31-アリス" = "猫さんがアリスの元に来てくれました！"
"1001506-32-黒猫" = "ニャー。"
"1001506-33-アリス" = "まだ少しアリスのことを警戒しているようですが……もう、怒ってはいないみたいです……。"
"1001506-34" = "[s] \"触ってもいいんじゃないかな？\""
"1001506-35-アリス" = "そうでしょうか……？"
"1001506-36-アリス" = "それでは……。"
"1001506-37-黒猫" = "……。"
"1001506-38-黒猫" = "ニャー。"
"1001506-39-アリス" = "……。"
"1001506-40-アリス" = "温かくて……すべすべしています。猫さんって、こんな感じなんですね。"
"1001506-41-黒猫" = "ニャー……"
"1001506-42" = "（猫はまた、路地の向こう側に消えていった） "
"1001506-43-アリス" = "……。"
"1001506-44" = "[s] \"行っちゃったね。\""
"1001506-45-アリス" = "はい。でも、大丈夫です。今日のクエストは「一度でも猫と触れ合うこと」でしたから。"
"1001506-46-アリス" = "経験値をゲットしました。今日もまた、少しずつ成長しています。"
"1001506-47" = "[s11] \"良かったね。\"\n[s12] \"うん。毎日少しずつ、大事なことだね。\""
"1001506-48-アリス" = "先生が持っていたおやつを食べてくれなかったのは残念でしたが……。"
"1001506-49-アリス" = "先生が持っていたおやつを食べてくれなかったのは残念でしたが……。"
"1001506-50-アリス" = "そういえば、もしかして……それは先生が、アリスのために用意してくれたものなのですか？"
"1001506-51" = "[s13] \"……さて、どうかな。\"\n[s14] \"諸事情でいつも持ち歩いてるから。\""
"1001506-52-アリス" = "……口ではそんなことを言っていても、アリスには分かります。"
"1001506-53-アリス" = "……口ではそんなことを言っていても、アリスには分かります。"
"1001506-54-アリス" = "先生は優しい方ですから、アリスを放っておけなかったのです。"
"1001506-55-アリス" = "アリスは全部、知っていますよ。"
"1001506-56" = "（なんだか楽しそうなアリスと一緒に、猫の話をしながら学校に戻った）"
