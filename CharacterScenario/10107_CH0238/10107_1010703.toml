[translation]
"1010703-1" = "書記の取材生活"
"1010703-2" = "（チアキからのモモトークから間もなく……）"
"1010703-3-チアキ" = "やっほ！こんにちは、先生～！"
"1010703-4-チアキ" = "プレゼント持ってきましたよ！"
"1010703-5-チアキ" = "どうですか？超ワクワクしてきません～？"
"1010703-6" = "[s] \"お、おはよぉ……チアキ……。\""
"1010703-7-チアキ" = "げっ！？大丈夫ですか、先生？"
"1010703-8-チアキ" = "すごく体調悪そうですね……風邪ですか？"
"1010703-9-チアキ" = "え？仕事が多すぎて徹夜してた……？"
"1010703-10-チアキ" = "でしたら……ちょうどいいですね！"
"1010703-11" = "[s] \"う、うん？\""
"1010703-12-チアキ" = "それはなんと～ぉ！じゃじゃーん！"
"1010703-13-チアキ" = "「週刊万魔殿」の定期購読記念プレゼント！"
"1010703-14-チアキ" = "封筒の中にありますので、開けてみてください！"
"1010703-15" = "[s] 封筒を開ける。"
"1010703-16" = "[ns] \"これは……？\""
"1010703-17-チアキ" = "はい！スイーツビュッフェの利用券2枚です！"
"1010703-18-チアキ" = "疲れた時には、やっぱり甘～いスイーツ！"
"1010703-19-チアキ" = "私も編集作業が行き詰まった時なんかは、よく利用してます！"
"1010703-20-チアキ" = "なので、今の先生にぴったりなプレゼントかと！"
"1010703-21" = "[s] \"チアキ……ありがとう！\""
"1010703-22-チアキ" = "はいっ、どういたしまして～！"
"1010703-23-チアキ" = "休憩するのは大事ですからね。"
"1010703-24-チアキ" = "というわけで、今すぐ使っちゃいましょうか？"
"1010703-25" = "[s] \"でも、まだ仕事が……。\""
"1010703-26-チアキ" = "もう！疲れてる時は仕事の効率も下がっちゃいますよ～！"
"1010703-27-チアキ" = "時には立ち止まって、休憩するのも大事です！"
"1010703-28-チアキ" = "ちょっとだけ！ね？ちょっとだけ～！"
"1010703-29" = "[s] \"じゃ、じゃあそうしようかな？\""
"1010703-30-チアキ" = "はい！しちゃいましょう～！"
"1010703-31-チアキ" = "ではでは、お店までご案内しますね～！"
"1010703-32-チアキ" = "わぁ！美味しそうなスイーツがいっぱい！"
"1010703-33-チアキ" = "早く入りましょう、先生！"
"1010703-34-スイーツカフェの店員" = "いらっしゃいませ！2名様ですね？"
"1010703-35-チアキ" = "はい～！"
"1010703-36" = "[ns] \"こちら、利用券です。\""
"1010703-37-スイーツカフェの店員" = "ありがとうございます！"
"1010703-38-スイーツカフェの店員" = "席までご案内いたしますね。"
"1010703-39-スイーツカフェの店員" = "……ご利用に関する説明は以上となります。#n他に気になるところはございますか？"
"1010703-40-チアキ" = "いえ、ありませ……あ！"
"1010703-41-チアキ" = "もしよかったら……ここのスイーツ、記事にしてもいいですか？"
"1010703-42-チアキ" = "お店の雰囲気も素敵ですし、種類も豊富で超気に入ってるんです！"
"1010703-43-チアキ" = "ぜひ、「週刊万魔殿」に載せたいと思っているんですが……！"
"1010703-44-スイーツカフェの店員" = "どうぞご遠慮なく。当店としては大歓迎です。"
"1010703-45-チアキ" = "わあ！ありがとうございます！"
"1010703-46-スイーツカフェの店員" = "では、ごゆっくりどうぞ。"
"1010703-47-チアキ" = "これで次の特集も準備万端ですね！"
"1010703-48-チアキ" = "いやぁ～まさかスイーツカフェでネタを思いつくなんて！#nこれも書記兼、記者兼、編集長兼、発行人のヒラメキってやつですかね～"
"1010703-49-チアキ" = "しかもこのお店、スイーツが100種類もあるらしいですよ！#n一つひとつ味見して、そのレビューを記事にしたら……！"
"1010703-50-チアキ" = "「週刊万魔殿」がベストセラーになること、間違いなしですね！"
"1010703-51" = "[s] \"100種類、全部食べられるの？\""
"1010703-52-チアキ" = "はっ！そうでした！私、マカロン5つが限界なのに！？"
"1010703-53-チアキ" = "うぅ……どうしよう……。"
"1010703-54-チアキ" = "え、えっと……先生、もしよかったら、その……"
"1010703-55" = "[s1] \"いいよ。私も手伝うね。\"\n[s2] \"食べて感想を言えばいいんだね？\""
"1010703-56-チアキ" = "うぅ、ありがとうございますぅ……。"
"1010703-57-チアキ" = "なるべく味が被らないようにしましょう……。"
"1010703-58-チアキ" = "さて、まずはマンゴータルトの写真から……。"
"1010703-59-チアキ" = "先生、あーんしてみてください！"
"1010703-60" = "[ns3] \"あーん。\"\n[ns4] 手で受け取る。"
"1010703-61-チアキ" = "おお、いいですね！"
"1010703-62-チアキ" = "マンゴータルトですよ～"
"1010703-63-チアキ" = "どうですか、お味は？"
"1010703-64" = "[s] \"うーん……甘くて……。\""
"1010703-65-チアキ" = "甘くて？"
"1010703-66" = "[s] \"美味しい！\""
"1010703-67-チアキ" = "さっきのチェリークッキーと同じですよ？"
"1010703-68-チアキ" = "まだ10個目なのに……。"
"1010703-69-チアキ" = "やっぱり、100種類全部を味見するのって無謀でしたかね……？"
"1010703-70" = "[s] \"胃のキャパ的に厳しいんじゃないかな……。\""
"1010703-71-チアキ" = "うぅ……目玉特集の予定だったのにぃ……。"
"1010703-72-チアキ" = "……あ！"
"1010703-73-チアキ" = "でしたら、他のお客さんに聞けばいいんですよね！"
"1010703-74-チアキ" = "これだけの人数がいるなら、きっといけると思います！"
"1010703-75" = "[s] \"うん、それは良さそうだね。\""
"1010703-76-チアキ" = "あ、ちょうどあちらに二人組のお客さんが！"
"1010703-77" = "[ns] \"大丈夫かな……。\""
"1010703-78-チアキ" = "レビューしてくれる人は、多ければ多いほど良いんですから！"
"1010703-79-チアキ" = "さっそく頼んでみますね！"
"1010703-80-チンピラA" = "こんにちは～！"
"1010703-81-チンピラA" = "あぁん？なんだ？"
"1010703-82-チアキ" = "「週刊万魔殿」の取材なんですけど、いくつかお聞きしてもいいですか？"
"1010703-83-チンピラA" = "今スイーツ食ってる最中なんだけど？"
"1010703-84-チアキ" = "はい！だからぜひ取材のご協力をお願いしたく！"
"1010703-85-チンピラA" = "は、はぁ？"
"1010703-86-チアキ" = "このパフェ、どんな味なのかご感想をお聞かせください～！"
"1010703-87-チンピラA" = "え、ああ……甘いな。"
"1010703-88-チアキ" = "なるほど！"
"1010703-89-チアキ" = "どんな風に甘く感じましたか？#nチョコレートみたいな？それともパイナップルみたいな？"
"1010703-90-チンピラA" = "えっ？違いとかあんの？"
"1010703-91-チアキ" = "もちろんありますよ！チョコレートは舌の上を滑るような甘味で、パイナップルは口の中をパンチするような一撃があります！"
"1010703-92-チンピラA" = "そ、そう言われたら、なんとなく違いが分かるような……？"
"1010703-93-チアキ" = "でしょでしょ～！流石ですね！"
"1010703-94-チアキ" = "あ、こちらのクッキーはどんな味ですか？"
"1010703-95-チンピラA" = "一口食べてみる？"
"1010703-96-チアキ" = "いいんですか？じゃあ、お言葉に甘えて……"
"1010703-97-チアキ" = "うわっ、辛っ！"
"1010703-98-チンピラA" = "あははっ！ホットソースで作ったらしいよ。うちらもビックリしたんだから。"
"1010703-99-チンピラA" = "ほれ、牛乳飲みな。"
"1010703-100-チアキ" = "うぅ、辛い……でも、いい体験になりました！これならいいネタになるかも～！"
"1010703-101-チンピラA" = "ここのマカロン、美味しいからオススメだよ。"
"1010703-102" = "[ns] （いつの間にか仲良くなってる……）"
"1010703-103-チアキ" = "いやぁ～もうこんな時間ですか。#n流石に100種類全部は無理でしたね！"
"1010703-104-チアキ" = "お腹いっぱい！スイーツで満腹になったの、初めてかもしれません～"
"1010703-105-チアキ" = "先生と皆さんのおかげで、取材も無事に終わりました！"
"1010703-106-チアキ" = "私一人だったら、絶対できませんでした。"
"1010703-107-チアキ" = "本当にありがとうございました！これで「週刊万魔殿」もより甘くなるでしょう！"
"1010703-108-チアキ" = "それに、新しい友達もできましたし、嬉しいですね～！"
"1010703-109" = "[s] \"さっき取材してた子？\""
"1010703-110-チアキ" = "はい～！"
"1010703-111-チアキ" = "二人とも、「週刊万魔殿」を定期購読してくれるって！"
"1010703-112-チアキ" = "写真も一緒に撮っちゃいました！"
"1010703-113-チアキ" = "これです！"
"1010703-114-チアキ" = "あ、あれ？"
"1010703-115" = "[s] \"写真……ブレてるね。\""
"1010703-116-チアキ" = "そう、ですね……記事に載せるスイーツの写真も全部……。"
"1010703-117-チアキ" = "ど、どうしよう……。"
"1010703-118-チアキ" = "……ま、仕方ないか！"
"1010703-119-チアキ" = "やり直し！今からもう一度取材してきます！"
"1010703-120" = "[s] \"や、やり直し！？\""
"1010703-121-チアキ" = "はい！記事のために！そして「週刊万魔殿」のために！"
"1010703-122-チアキ" = "幸い、利用券はまだ残ってますので！"
"1010703-123-チアキ" = "それじゃ、行ってきますね～！"
