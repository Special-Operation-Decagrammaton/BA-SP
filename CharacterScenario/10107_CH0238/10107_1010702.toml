[translation]
"1010702-1" = "万魔殿の書記"
"1010702-2-チアキ" = "やっほ～！#n「週刊万魔殿」でーす！"
"1010702-3" = "[s] \"ドア開いてるから入っていいよ。\""
"1010702-4-チアキ" = "こんにちは～！"
"1010702-5-チアキ" = "あ、もしかして、お取込み中でしたか？"
"1010702-6" = "[s] \"ううん、ちょうど暇だったんだ。\""
"1010702-7-チアキ" = "そうですか！では、失礼しますね～"
"1010702-8-チアキ" = "いやぁ～シャーレはいいですね！快適！#n先生はいつもここでお仕事してるんですか？"
"1010702-9-チアキ" = "空気が良いからか、先生の肌もツヤツヤしてますね～！"
"1010702-10" = "[s] \"えと……肌はいつも通りかな。\""
"1010702-11-チアキ" = "まあまあ、細かいことは置いといて！"
"1010702-12-チアキ" = "では、先生へのプレゼント！イッツショータイムです！"
"1010702-13-チアキ" = "じゃーん！「週刊万魔殿」の最新号！"
"1010702-14-チアキ" = "え、初めて見た……？"
"1010702-15-チアキ" = "そうなんですか……？"
"1010702-16-チアキ" = "ゲヘナで絶大な人気を誇り、信頼できると評判の「週刊[ruby=ぱんでも]万魔殿[/ruby]」を……#nまだご覧になってないのですか……！？"
"1010702-17-チアキ" = "そんな……それはあんまりにも……。"
"1010702-18" = "[s] \"チアキ？\""
"1010702-19-チアキ" = "最っっっっ高ですね！！"
"1010702-20-チアキ" = "初めて「週刊万魔殿」を読む瞬間をこの目に焼きつけられるなんて！"
"1010702-21-チアキ" = "先生の生々しい反応をすぐ隣で観察できる幸せ……テンション上がりますね！"
"1010702-22-チアキ" = "さあ、とくとご覧あれ！――「特集！万魔殿の休憩室訪問記」、#n「独占！イブキちゃんの砂遊び記録」などなど！今週も情報目白押し！"
"1010702-23-チアキ" = "ぜひお楽しみください！"
"1010702-24" = "[s] \"あ、うん。ありがとう。\""
"1010702-25-チアキ" = "もしよかったら、私が朗読しましょうか？"
"1010702-26-チアキ" = "書記兼、「週刊万魔殿」の記者兼、編集長兼、発行人であるこの私、[ruby=もとみや]元宮[/ruby]チアキと一緒に読めちゃう特別なサービス！"
"1010702-27-チアキ" = "どうですか？やっちゃいます？"
"1010702-28" = "[s1] \"大丈夫、一人で読むよ。\"\n[s2] \"じゃあ、頼んでみようかな。\""
"1010702-29-チアキ" = "え、そうですか？ほんとに？"
"1010702-30-チアキ" = "これ、滅多にないサービスなんですよ？この機会を逃したら後悔するかもですよ？"
"1010702-31-チアキ" = "え？冗談、ですか？"
"1010702-32-チアキ" = "ははっ！なんだ、そういうことですか！先生って面白いですね！"
"1010702-33-チアキ" = "ナイスチョイス～！"
"1010702-34-チアキ" = "では、お任せください！"
"1010702-35-チアキ" = "まず、1ページ目からですね！こ[ruby=パンデモニウム・ソサエティー]こが万魔殿の執[/ruby]務室です！"
"1010702-36-チアキ" = "私や他の議員たちが毎日訪れる場所ですね。授業がない時は大体ここにいますよ！"
"1010702-37-チアキ" = "ここのソファ、めっちゃふわふわしてて寝心地バツグンなんです！あとで先生も横になってみてください！"
"1010702-38-チアキ" = "執務室なのに仕事は、ですか？"
"1010702-39-チアキ" = "ま、まあ、私は書記ですし、会議の時はちゃんと……"
"1010702-40-チアキ" = "そういえば会議って滅多にやってないような……議事録っていつ書いてたっけ……ま、いっか。"
"1010702-41-チアキ" = "では、次のページ！"
"1010702-42-チアキ" = "あ、ここはかなり力を入れた記事なんですよ！読み上げますね～！"
"1010702-43" = "（その後も、チアキと一緒に「週刊万魔殿」を読んだ……）"
"1010702-44-チアキ" = "あっ、もう最後のページだ。"
"1010702-45-チアキ" = "いやぁ～あっという間でしたね。"
"1010702-46-チアキ" = "どうですか、先生？初めて読んでみた感想は？"
"1010702-47" = "[s] \"うん、面白かったよ。\""
"1010702-48-チアキ" = "へへ、やっぱり見る目ありますね～！"
"1010702-49-チアキ" = "ではでは～ここからが本題！"
"1010702-50-チアキ" = "定期購読、いかがですか？"
"1010702-51-チアキ" = "毎週新しい内容の「週刊万魔殿」をお届けしますよ！"
"1010702-52-チアキ" = "今なら豪華プレゼントもついてくる！"
"1010702-53" = "[s] \"いいね。購読しようか。\""
"1010702-54-チアキ" = "ほ、本当ですか？"
"1010702-55-チアキ" = "やった！ありがとうございます～！ゲヘナ外の定期購読者、初めてかも！"
"1010702-56" = "[s] \"購読料はいくらなの？\""
"1010702-57-チアキ" = "あ、無料です。"
"1010702-58-チアキ" = "別にお金儲けでやってるわけじゃないんで。半分は趣味ですね！"
"1010702-59-チアキ" = "印刷費や発行費などの諸経費は、すべて万魔殿の予算でカバーしています！"
"1010702-60" = "[s] \"……大丈夫なの、それ？\""
"1010702-61-チアキ" = "マコト先輩も万魔殿の名が広まることに異論はないといってますし……"
"1010702-62-チアキ" = "ま、いいんじゃないですか？"
"1010702-63" = "[s] （本当にいいのかな……）"
"1010702-64-チアキ" = "では！こちらにご署名をお願いします！"
"1010702-65-チアキ" = "これですか？購読者の名簿です！"
"1010702-66-チアキ" = "はい！ありがとうございます！"
"1010702-67-チアキ" = "まさかこんなに快く定期購読してくださるなんて……シャーレまで足を運んだ甲斐がありました！"
"1010702-68" = "[s] \"いつもこんな風に宣伝してるの？\""
"1010702-69-チアキ" = "モモトークか電話での営業が多いですけど……時間ある時はこうやって訪問してますね。"
"1010702-70-チアキ" = "新しい生徒さんとお喋りするのって楽しいですし、読者が増える姿をこの目で見るのが好きなので！"
"1010702-71-チアキ" = "それに……"
"1010702-72-チアキ" = "「インタビュー！この人と会ってみた！」コーナーのネタ探しにもなるので、できるだけ人と接するようにしてるんです！"
"1010702-73-チアキ" = "……いつか先生のことも取材してみたいなぁ、とは思ってますけど～！"
"1010702-74" = "[s] \"仕事がない時は、いつでも大丈夫だよ。\""
"1010702-75-チアキ" = "本当ですか？ありがとうございます！"
"1010702-76-チアキ" = "感謝のお礼に、次号の「週刊万魔殿」は2部お送りしますね！"
"1010702-77-チアキ" = "もしよかったら、他の生徒さんにもぜひ～！"
