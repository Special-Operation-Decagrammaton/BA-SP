[translation]
"1014206-1" = "二人だけのサイン"
"1014206-2" = "（そしてビーチを訪れると……）\r\n"
"1014206-3-百鬼夜行の生徒A" = "ナイススパイク～！\r\n"
"1014206-4-百鬼夜行の生徒B" = "や、やられたああぁ……！\r\n"
"1014206-5-ナグサ" = "この声は……？"
"1014206-6-ナグサ" = "先生。あっちに行ってみよう。"
"1014206-7" = "[ns] \"ビーチバレーをしているの？\""
"1014206-8-百鬼夜行の生徒A" = "あ！ナグサさん！先生！\r\n"
"1014206-9-百鬼夜行の生徒B" = "お二人も、一緒にビーチバレーをしませんか？"
"1014206-10-ナグサ" = "私はいいけど、先生は？"
"1014206-11" = "[s1] \"私は見ているよ。\"\r\n[s2] \"ナグサのお荷物になっちゃうから。\""
"1014206-12-ナグサ" = "一緒にやるから楽しいのに。"
"1014206-13-ナグサ" = "あ……。"
"1014206-14-ナグサ" = "もしかして……やるより見るほうが好きなタイプ？"
"1014206-15-ナグサ" = "やっぱり先生は……。"
"1014206-16" = "[s] \"何を考えてるか知らないけど、違うよ！\""
"1014206-17" = "（結局みんなでビーチバレーをすることになった……）\r\n"
"1014206-18-百鬼夜行の生徒A" = "じゃあ、先生とナグサさんがチームですよ！"
"1014206-19-百鬼夜行の生徒B" = "そのほうがバランスが良さそうなので！"
"1014206-20" = "[s] \"お荷物にならないよう、頑張るね。\""
"1014206-21-ナグサ" = "私はお荷物だなんて思わないよ。\r\n"
"1014206-22-ナグサ" = "右腕も今、絶好調だし。"
"1014206-23-ナグサ" = "大丈夫。今の私は……無敵だから。"
"1014206-24" = "[s3] \"で、でも任せっきりにはできないよ。\"\r\n[s4] \"私が役に立てそうな作戦ってある？\""
"1014206-25-ナグサ" = "作戦……。"
"1014206-26-ナグサ" = "それなら簡単なサインを使うのはどうかな。"
"1014206-27-ナグサ" = "試合中に相手にバレないようやり取りできる……。"
"1014206-28-ナグサ" = "二人だけの秘密のサイン。"
"1014206-29" = "（しばらくして訪れた対決の時間……）\r\n"
"1014206-30" = "[fffbab]御[-]"
"1014206-31" = "[fffbab]稜[-]"
"1014206-32" = "[fffbab]ナ[-]"
"1014206-33" = "[fffbab]グ[-]"
"1014206-34" = "[fffbab]サ[-]"
"1014206-35" = "[ffaecd]百[-]"
"1014206-36" = "[ffaecd]鬼[-]"
"1014206-37" = "[ffaecd]夜[-]"
"1014206-38" = "[ffaecd]行[-]"
"1014206-39" = "[ffaecd]の[-]"
"1014206-40" = "[ffaecd]生[-]"
"1014206-41" = "[ffaecd]徒[-]"
"1014206-42" = "[ffaecd]た[-]"
"1014206-43" = "[ffaecd]ち[-]"
"1014206-44" = "[fffbab]VS[-]"
"1014206-45-ナグサ" = "先攻は相手チーム。"
"1014206-46-ナグサ" = "流れを有利にするには、最初のレシーブが大事だね。"
"1014206-47" = "[wa:1451]― [log=나구사 수영복]最初はこの作戦でいこう。[/log]"
"1014206-48" = "― [log=나구사 수영복]向こうは序盤から[wa:1690]全力で来るだろうから。[/log]"
"1014206-49" = "[wa:3201]― [log=나구사 수영복]……[wa:1520]先生？[/log]"
"1014206-50" = "― [log=나구사 수영복]私のサイン、[wa:1880]ちゃんと見てる？[/log]"
"1014206-51" = "― [log=나구사 수영복]最初からよそ見をするなんて、[wa:2450]らしくないね。[/log]"
"1014206-52" = "― [log=나구사 수영복]一体何を見て……。[/log]"
"1014206-53" = "[wa:4161]― [log=나구사 수영복]あ……[wa:1800]そっか。[/log]"
"1014206-54" = "― [log=나구사 수영복]ごめんなさい。[/log]"
"1014206-55" = "― [log=나구사 수영복]逆に集中できないよね。[/log]"
"1014206-56" = "― [log=나구사 수영복]私が……[wa:1740]ミステリアスな[wa:1240]美少女だから。[/log]"
"1014206-57" = "[wa:2081]― [log=나구사 수영복]ビーチバレーはこうやってサインを出すんだけど……。[/log]"
"1014206-58" = "― [log=나구사 수영복]今からでも、[wa:1590]やり方を変えたほうがいいかな？[/log]"
"1014206-59" = "[wa:2321]― [log=나구사 수영복]……ダメか、[wa:1970]流石に遅いよね。[/log]"
"1014206-60" = "[wa:691]― [log=나구사 수영복]このままいこう、[wa:1202]先生。[/log]"
"1014206-61" = "― [log=나구사 수영복]私たちなら……[wa:2490]大丈夫。[/log]"
"1014206-62" = "（そして試合が始まった）\r\n"
"1014206-63" = "（勝敗に関係なく、非常に楽しい時間だった）\r\n"
"1014206-64" = "（こうして試合が終わり……）"
"1014206-65-百鬼夜行の生徒A" = "あはははっ！本当に楽しかったです！\r\n"
"1014206-66-百鬼夜行の生徒B" = "それでは！お二人とも引き続き楽しいお時間を～！\r\n"
"1014206-67-ナグサ" = "た、楽しいお時間をって……どういう意味なのかな？\r\n"
"1014206-68" = "[s5] \"言葉どおりじゃない？\"\r\n[s6] \"楽しい時間を続けてって意味だよ。\""
"1014206-69-ナグサ" = "……。"
"1014206-70-ナグサ" = "……うん。そうだね。"
"1014206-71-ナグサ" = "これまで、本当にいろんなことがあった。"
"1014206-72-ナグサ" = "先生がいなければ、私の腕は今も、暗く不吉な黄昏に吞まれたままだったと思うの。"
"1014206-73-ナグサ" = "先生のおかげで……。"
"1014206-74-ナグサ" = "どう手を差し伸べたらいいのか分かった。"
"1014206-75-ナグサ" = "どう前に進めばいいのか……分かった。"
"1014206-76-ナグサ" = "まだ全てが元通りになったわけじゃないけど……。"
"1014206-77-ナグサ" = "先生がずっとそばにいてくれたら、心配ないと思う。"
"1014206-78-ナグサ" = "……あ。"
"1014206-79-ナグサ" = "しゃべり過ぎたかな。"
"1014206-80" = "[ns] \"な、ナグサ……？\""
"1014206-81-ナグサ" = "ここまで話しちゃったから、もうはっきり言うね。\r\n"
"1014206-82-ナグサ" = "まだまだ未熟だし……。"
"1014206-83-ナグサ" = "美人なこと以外、特に取り柄がないけど……。"
"1014206-84-ナグサ" = "これからもずっとよろしくね、先生。\r\n"
"1014206-85" = "（その後、遅くまでナグサとビーチで楽しんだ）"
