[translation]
"1014205-1" = "おいしいものは制御不能"
"1014205-2" = "（またナグサと海に来たけど……）"
"1014205-3" = "（今日に限って日差しが強すぎる……）"
"1014205-4-ナグサ" = "ううっ……。\r\n"
"1014205-5-ナグサ" = "このままだと……溶けてしまいそう。\r\n"
"1014205-6" = "[s] \"近くの商店街へ行こうか。\""
"1014205-7-ナグサ" = "うん。それなら、あちこち日陰があって休めるね。"
"1014205-8-ナグサ" = "私たちを見てくれる人も、ここよりは多いだろうから。"
"1014205-9" = "[s1] \"おおー……。\"\r\n[s2] \"人の視線を集めたいってこと？\""
"1014205-10-ナグサ" = "……私は誤解を解きたいだけ。"
"1014205-11-ナグサ" = "それ以外の意味はないから。"
"1014205-12-ナグサ" = "……。"
"1014205-13-ナグサ" = "嘘じゃないよ、ほんとに。"
"1014205-14-ナグサ" = "だから、そんな顔で見るのはやめて。"
"1014205-15-ナグサ" = "クールに見えるけど、実は恥ずかしがり屋なんだから。\r\n"
"1014205-16" = "[ns] \"し、失礼しました……。\""
"1014205-17" = "（その後、海岸近くの商店街を訪れた）"
"1014205-18-ナグサ" = "なんだか……楽しそうなお店がたくさんあるね。"
"1014205-19-ナグサ" = "あっちは射的……得点ごとに景品があるみたい。"
"1014205-20" = "[s] \"ナグサがやったら、最高点を取れそうだね？\""
"1014205-21-ナグサ" = "そうだろうけど……。"
"1014205-22-ナグサ" = "他の人の方が楽しめるかも。"
"1014205-23-ナグサ" = "先生、やってみる？"
"1014205-24-ナグサ" = "隣で教えてあげるから。"
"1014205-25" = "[s] \"うん、よろしくお願いします。\""
"1014205-26" = "（その後、ナグサによる指導のもと水鉄砲射撃を始めた）\r\n"
"1014205-27" = "（しかし……もらえたのは参加賞の飴だけだった……）\r\n"
"1014205-28-ナグサ" = "ふふっ、残念。運が良ければ、1つ上の賞も取れそうだったけど。"
"1014205-29" = "[s] \"参加賞の1つ上って何だった？\""
"1014205-30-ナグサ" = "えっと……。"
"1014205-31-ナグサ" = "「串焼き1本引換券」……って書いてある。"
"1014205-32-ナグサ" = "さらに上は「串焼きセット引換券」……。"
"1014205-33-ナグサ" = "……。"
"1014205-34-ナグサ" = "先生。もう1回やろう。#n私もサポートするから。"
"1014205-35" = "[s] \"ちょっと私情が入っちゃってない！？\""
"1014205-36-ナグサ" = "……冗談。"
"1014205-37-ナグサ" = "実は……自覚してるんだ。#n焼き鳥、食べ過ぎだって。"
"1014205-38-ナグサ" = "だから控え目にしてるんだよ。"
"1014205-39" = "[s] \"それで、1週間に何本食べてるの？\""
"1014205-40-ナグサ" = "そ、それは……。"
"1014205-41-ナグサ" = "……内緒。"
"1014205-42-ナグサ" = "と、とりあえず他の所に行こう。ここにいたら、誘惑に負けちゃいそう。"
"1014205-43" = "（それで来た場所が、よりにもよって……）\r\n"
"1014205-44-焼き鳥屋の店主" = "いらっしゃ～い！焼き鳥はいかが～！\r\n"
"1014205-45-ナグサ" = "……。\r\n\r\n"
"1014205-46" = "[s3] \"……。\"\r\n[s4] \"わざとこっちに来たんじゃないよね？\""
"1014205-47-ナグサ" = "ただの偶然……。"
"1014205-48-ナグサ" = "本当だよ。信じて。"
"1014205-49" = "[s5] \"……。\"\r\n[s6] \"1本、食べる？\""
"1014205-50-ナグサ" = "……。"
"1014205-51-ナグサ" = "……ううん、大丈夫。\r\n"
"1014205-52" = "[s] \"本当は買って欲しいって顔してる！\""
"1014205-53-ナグサ" = "う、うううっ……。"
"1014205-54-ナグサ" = "……分かった。先生の好意を断ったら失礼だから。"
"1014205-55-ナグサ" = "焼き鳥、1本だけお願い。"
"1014205-56-ナグサ" = "塩で。"
"1014205-57-ナグサ" = "ちょうど暑いし、塩気のあるものが食べたいんだ。"
"1014205-58" = "[s] \"汗もかいたもんね。\""
"1014205-59" = "[ns] \"すみません、焼き鳥1本、塩で！\""
"1014205-60-焼き鳥屋の店主" = "はいよ～！ちょっと待ってね！"
"1014205-61" = "（しばらくして……）"
"1014205-62-焼き鳥屋の店主" = "はいっ！お待たせ～！\r\n"
"1014205-63-ナグサ" = "それじゃ……。"
"1014205-64" = "[ns] \"おいしい？\""
"1014205-65-ナグサ" = "……見事なバランスだね。\r\n"
"1014205-66-ナグサ" = "肉とネギの歯ごたえが絶妙だし。"
"1014205-67-ナグサ" = "香ばしくて、塩加減もちょうど良い。"
"1014205-68-ナグサ" = "一口でこんなに豊かな味わい……。"
"1014205-69-ナグサ" = "また買いに来ようかな。"
"1014205-70" = "[s] \"聞いているだけでもお腹が空いてくるね。\""
"1014205-71-ナグサ" = "先生も食べてみる？"
"1014205-72-ナグサ" = "……あ。\r\n"
"1014205-73-ナグサ" = "こ、こっちは口つけてないから……別に意味はないけど。\r\n\r\n"
"1014205-74" = "[s] \"うん、ありがとう。そういうことにしておくね。\""
"1014205-75-ナグサ" = "せ、先生……！\r\n\r\n"
"1014205-76" = "（その後、ナグサと商店街を歩きながら楽しい時間を過ごした）"
