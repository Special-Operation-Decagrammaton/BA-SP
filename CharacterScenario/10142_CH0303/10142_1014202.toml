[translation]
"1014202-1" = "水鉄砲遊び"
"1014202-2" = "（ある暑い日。ナグサに会うため、百花繚乱の部室に向かった）"
"1014202-3-ナグサ" = "ん？先生？\r\n"
"1014202-4-ナグサ" = "どうしたの急に？"
"1014202-5" = "[s] \"……水鉄砲で遊んでると思ったのに。\""
"1014202-6-ナグサ" = "……一応訓練の一種だからね。"
"1014202-7-ナグサ" = "それに、暑いときしかやらないから。"
"1014202-8-ナグサ" = "まあ、今日も暑いけど。"
"1014202-9-ナグサ" = "……。"
"1014202-10-ナグサ" = "がっかりした顔してどうしたの？"
"1014202-11-ナグサ" = "それに水鉄砲も持って。"
"1014202-12" = "[s] \"水着も持ってきたよ！\""
"1014202-13-ナグサ" = "……私と水鉄砲で遊ぶつもりだった？"
"1014202-14" = "[s1] \"ナグサが暑さに苦しんでると思ったら……。\"\r\n[s2] \"いてもたってもいられなくて……。\""
"1014202-15-ナグサ" = "……。"
"1014202-16-ナグサ" = "先生は意外としたたかだね。"
"1014202-17-ナグサ" = "そうだね……せっかく来てくれたのに、そのまま帰すのも……。\r\n"
"1014202-18-ナグサ" = "ふぅ……。"
"1014202-19-ナグサ" = "……ちょっと待ってて。#n今日はしばらく、私しかいないだろうから。"
"1014202-20" = "[s] \"やったあ！\""
"1014202-21" = "（しばらくして、私たちは水着に着替えて庭に集まった）"
"1014202-22-ナグサ" = "先生、覚悟はいい？"
"1014202-23" = "[s3] \"ナグサこそ！\"\r\n[s4] \"負けた方がかき氷をおごるんだよ！\""
"1014202-24-ナグサ" = "先生には、百花繚乱式射撃術を封印して――"
"1014202-25-ナグサ" = "左手だけでやろうかな。"
"1014202-26-ナグサ" = "一方的な展開は面白くないからね。"
"1014202-27" = "[s] \"後悔しても知らないよ？\""
"1014202-28-ナグサ" = "ふふっ、それはどうかな？\r\n"
"1014202-29-ナグサ" = "それじゃ……始めようか。"
"1014202-30" = "（結果は……）"
"1014202-31" = "[ns] \"私の完敗……。\""
"1014202-32-ナグサ" = "じゃあ、かき氷よろしくね。\r\n"
"1014202-33" = "（約束どおり、かき氷を買ってきた）\r\n"
"1014202-34" = "（しばらくして……）"
"1014202-35" = "[ns] \"ん？まだ水着だったの？\""
"1014202-36-ナグサ" = "暑いし……先生に聞きたいこともあるから。"
"1014202-37-ナグサ" = "とりあえず、溶けちゃう前にかき氷を食べよっか。"
"1014202-38" = "[ns] \"かき氷は、やっぱり冷たいね。\""
"1014202-39-ナグサ" = "うん。おかげで涼しくなってきた。"
"1014202-40-ナグサ" = "それにしても、突然水鉄砲で遊ぼうだなんて言うから驚いたよ。"
"1014202-41-ナグサ" = "涼むために庭で水遊びをするって……。"
"1014202-42-ナグサ" = "そんなに気になる話だったかな？"
"1014202-43-ナグサ" = "まあたしかに、普通は海やプールだよね。"
"1014202-44-ナグサ" = "だけど……そういう場所は落ち着かないんだ。"
"1014202-45-ナグサ" = "え？理由？"
"1014202-46-ナグサ" = "その……。"
"1014202-47-ナグサ" = "まぁ……。"
"1014202-48-ナグサ" = "私の水着姿は、どうしても輝いちゃうから……かな。"
"1014202-49-ナグサ" = "刺激が強くて、周りの人が大変だと思うし。"
"1014202-50" = "[s] \"……。\""
"1014202-51-ナグサ" = "先生にも、聞いてみたかったんだよね。"
"1014202-52-ナグサ" = "私……輝きすぎてないかな？"
"1014202-53" = "[s] \"…………。\""
"1014202-54-ナグサ" = "……先生？"
"1014202-55" = "[s] \"あはは！やっぱりナグサは面白いね！\""
"1014202-56-ナグサ" = "ん、んん……？"
"1014202-57" = "[s5] \"大丈夫！ナグサのせいで苦しむ人はいないと思うよ。\"\r\n[s6] \"「きれいな人」って思うだけで。\""
"1014202-58-ナグサ" = "そう？うーん……。"
"1014202-59-ナグサ" = "どうして私は……。"
"1014202-60-ナグサ" = "光り輝く少女になってしまったのかな……。"
"1014202-61" = "（ナグサの悩みはかき氷を食べ終わるまで続いた……）\r\n"
