[translation]
"2003703-1" = "ポリス・ストーリー～流れるプール編～"
"2003703-2-フブキ" = "お、先生も手伝いに来てくれたの～？"
"2003703-3-フブキ" = "これで楽が……#nいや、監視を徹底できるね。"
"2003703-4-フブキ" = "特別に、同行させてあげるよ。"
"2003703-5" = "[s1] \"……どうして浮き輪を持ってるの？\"\n[s2] \"仕事してるんじゃなかったの？\""
"2003703-6-フブキ" = "なに言ってるのさ、先生。#nこれもライフセーバーの装備だよ。"
"2003703-7-フブキ" = "パーク全体を見回るためには……。"
"2003703-8-フブキ" = "当然、効率良く移動する必要があるじゃん？"
"2003703-9" = "[s] \"……浮き輪に乗って見回りをする、ってこと？\""
"2003703-10-フブキ" = "その通りっ！"
"2003703-11-フブキ" = "ここのウォーターパーク、#nすっごく長い流水プールがあるでしょ？"
"2003703-12-フブキ" = "浮き輪をつけて流れに身を任せとけば、#nパーク内の監視ができるってわけ。"
"2003703-13-フブキ" = "これが夢に描いた「自動パトロールシステム」だよ！"
"2003703-14" = "[s3] \"……遊ぶ気満々だよね。\"\n[s4] \"流水プールで遊んでるだけじゃない？\""
"2003703-15-フブキ" = "いやいや！#n正真正銘、パーク内のパトロールだよ！"
"2003703-16-フブキ" = "ふふっ。#nもちろん、楽しい任務になると思うけどね。"
"2003703-17-フブキ" = "それじゃ、さっそく仕事しちゃおっかな。#n浮き輪を置いて、っと……。"
"2003703-18-フブキ" = "ほっ！"
"2003703-19-フブキ" = "……あれ？"
"2003703-20" = "[wa:700]― [log=후부키 수영복]あ、[wa:1090]あれれ……？[/log]"
"2003703-21" = "[wa:1170]― [log=후부키 수영복]んぐぐぐっ！[/log]"
"2003703-22" = "[wa:3020]― [log=후부키 수영복]……[wa:770]くうぅ。[/log]"
"2003703-23" = "[wa:1430]― [log=후부키 수영복]ぬ、[wa:1040]抜けない……[/log]"
"2003703-24" = "[wa:2390]― [log=후부키 수영복]まさか[wa:1480]一生このままじゃないよね……？[/log]"
"2003703-25" = "[wa:1430]― [log=후부키 수영복]ねえ、[wa:580]先生。[/log]"
"2003703-26" = "[wa:1300]― [log=후부키 수영복]ちょっと助けて！[/log]"
"2003703-27" = "― [log=후부키 수영복]これからはサボる回数も減らすし、[/log]"
"2003703-28" = "[wa:2730]― [log=후부키 수영복]仕事も真面目にするから……[/log]"
"2003703-29" = "[wa:900]― [log=후부키 수영복]あと、[wa:1200]秘蔵のドーナッツもあげるから！[/log]"
"2003703-30" = "― [log=후부키 수영복]ひゃっ！？[/log]"
"2003703-31" = "[wa:920]― [log=후부키 수영복]う、[wa:620]後ろから触るのは[wa:1540]ちょっと！？[/log]"
"2003703-32" = "（フブキを浮き輪から出してあげた……）"
"2003703-33-フブキ" = "はぁ、はぁ……。"
"2003703-34-フブキ" = "……どうなることかと思った。"
"2003703-35-フブキ" = "当分、浮き輪はコリゴリだよ……。"
"2003703-36" = "[s] \"真面目に歩いてパトロールしないとね。\""
"2003703-37-フブキ" = "はぁ……めんどくさいなぁ。"
"2003703-38-フブキ" = "そうだ！浮き輪じゃなくてライフジャケットなら！"
"2003703-39" = "（その後、サボろうとするフブキを連れてパトロールをした）"
