[translation]
"2003705-1" = "ポリス・ストーリー～ロスト・パラダイス編～"
"2003705-2" = "（フブキのパラダイスを訪ねることにした）"
"2003705-3" = "（フブキはサマーベッドの上で横になって、鼻歌を歌っていた）"
"2003705-4" = "[ns1] \"フブキ、来たよ。\"\n[ns2] \"やっぱりサボってるじゃん！\""
"2003705-5-フブキ" = "わっ、びっくりした。"
"2003705-6-フブキ" = "わっ、びっくりした！"
"2003705-7-フブキ" = "……って、なんだ先生か。#nてっきり上の人に見つかったのかと思ったよ。"
"2003705-8" = "[s] \"ここがフブキのパラダイスなの？\""
"2003705-9-フブキ" = "そういうこと♪"
"2003705-10-フブキ" = "ウォーターパークの隅っこにあるキッズプールだよ。"
"2003705-11-フブキ" = "室内のキッズプールに子どもは集まってるし、#n大人はそもそも来ないからね。"
"2003705-12-フブキ" = "だから、こうしてのーんびりしてられるってわけ。"
"2003705-13-フブキ" = "ここのライフセーバー担当になったら、#n一日中サボり放題だよ！"
"2003705-14-フブキ" = "何より、一番良いのは……。"
"2003705-15-フブキ" = "（ザザ……ザザッ……）"
"2003705-16-フブキ" = "本部と離れてるから、無線がつながりにくいところ！"
"2003705-17" = "[s] \"それの何が良いの……？\""
"2003705-18-フブキ" = "えっ！？"
"2003705-19-フブキ" = "なに言ってるのさ、先生！#n暇そうなライフセーバーには、新しい仕事が振られるんだよ！？"
"2003705-20-フブキ" = "でも、ここにいれば無線機の問題で聞こえなかったことにできるし、#n余計な仕事を回される心配もないじゃん？"
"2003705-21" = "[s3] \"本当に大丈夫なの……？\"\n[s4] \"急用があるかもしれないんじゃ……？\""
"2003705-22-フブキ" = "大丈夫大丈夫。#nその時は、携帯に連絡が来るって。"
"2003705-23-フブキ" = "それまでは、のんびりパラダイスを満喫してようよ。"
"2003705-24-フブキ" = "はい、こっちが先生用のサマーベッドね。"
"2003705-25" = "[s5] \"この炎天下で横になるのは、ちょっと……。\"\n[s6] \"どこか日陰はないの？\""
"2003705-26-フブキ" = "……残念ながら、パラソルは故障中なんだよねぇ。"
"2003705-27-フブキ" = "たしかに、この日差しはつらいけど……。"
"2003705-28-フブキ" = "のんびりできるなら、これくらい我慢我慢！"
"2003705-29-フブキ" = "あ、そうだ。#n喉が乾いたら、そこのクーラーボックスから好きに飲んで良いよ。"
"2003705-30-フブキ" = "キンキンに冷えた飲み物が……。"
"2003705-31-フブキ" = "えっ！？"
"2003705-32-フブキ" = "なんで蓋が開きっぱなしに！？#nコーラが温くなってるんだけど！"
"2003705-33-フブキ" = "……ま、のんびりできることには変わりないし？"
"2003705-34" = "[s] \"……。\""
"2003705-35-フブキ" = "ど、どうしてそんな顔してるのさ。"
"2003705-36-フブキ" = "なーんにも仕事をする必要がないんだよ。"
"2003705-37-フブキ" = "ほら！"
"2003705-38-フブキ" = "こうやって、サマーベッドでお昼寝しても良いし……。"
"2003705-39-フブキ" = "あっつ！"
"2003705-40-フブキ" = "少しおしゃべりしてたら、日差しでこんなに熱く……。"
"2003705-41" = "[s] \"……。\""
"2003705-42-フブキ" = "……いやいや！#nここは天国だから！"
"2003705-43" = "[ns7] （無理して温かいコーラを飲んでるような……）\n[ns8] （つらそうだけど……）"
"2003705-44-フブキ" = "仕事のない時間、楽しいな～……。"
"2003705-45-フブキ" = "せ、先生もそう思わない？"
"2003705-46" = "[s] \"ちゃんと働いて、休憩をもらったほうが楽じゃない？\""
"2003705-47-フブキ" = "べ、別に……？#n充分楽できてるし！"
"2003705-48-フブキ" = "先生こそ、そんなところに突っ立ってると疲れるでしょ。"
"2003705-49-フブキ" = "ま、そこで見てたら良いんじゃない？#nこのまま私は、ずーっとサボっちゃうけどね！"
"2003705-50" = "（2時間後……）"
"2003705-51-フブキ" = "うぅ……。"
"2003705-52-フブキ" = "さ、さすがに暑すぎて……。"
"2003705-53-フブキ" = "でも、ほかの人みたいに仕事はしてないし……。"
"2003705-54-フブキ" = "ここは天国……ここは天国……！"
"2003705-55-フブキ" = "（ザザ……ザザッ……）"
"2003705-56" = "[s] \"連絡来てるよ？\""
"2003705-57-フブキ" = "良いの良いの。#nどうせ、適当に呼び出して雑用を押し付けるだけだから。"
"2003705-58-フブキ" = "私たちは、このまま天国を味わってれば……。"
"2003705-59-フブキ" = "（ピピピッ）"
"2003705-60-フブキ" = "あれ？"
"2003705-61-フブキ" = "携帯に連絡が……。"
"2003705-62-フブキ" = "「本部の休憩所に来てください」……？"
"2003705-63" = "[s] \"緊急の任務かもしれないね。\""
"2003705-64-フブキ" = "うーん。#nまあ、わざわざ携帯に連絡してくるくらいだし。"
"2003705-65-フブキ" = "仕方ないから、行ってあげるとするかぁ。"
"2003705-66-フブキ" = "べ、別にここを離れたかったわけじゃないけどね！？"
"2003705-67" = "ウォーターパークライフセーバー休憩室"
"2003705-68-フブキ" = "失礼するよ～。"
"2003705-69-フブキ" = "うわっ、エアコンガンガンじゃん！#n生き返る……。"
"2003705-70-フブキ" = "あっ、やっと来てくださったんですね！"
"2003705-71-ウォーターパークの責任者" = "ずっと無線で連絡してたんですよ！"
"2003705-72-フブキ" = "パラダイ……いや、担当場所の電波が悪かったんだよね。"
"2003705-73-フブキ" = "でも、安心してよ。"
"2003705-74-フブキ" = "ライフセーバーとしての仕事は全うしてたから！"
"2003705-75-ウォーターパークの責任者" = "……なんと、それは本当ですか！"
"2003705-76-ウォーターパークの責任者" = "もっと早く携帯に連絡を入れれば良かったですね……。"
"2003705-77-ウォーターパークの責任者" = "まさか、休憩時間中もお仕事をしていたとは！"
"2003705-78-フブキ" = "いやいや、私はやるべきことを……。"
"2003705-79-フブキ" = "……えっ？"
"2003705-80-ウォーターパークの責任者" = "実は、1時間前から休憩を取っていたんです。"
"2003705-81-ウォーターパークの責任者" = "頑張っている皆さんに、#nドーナッツの差し入れもあったんですが……。"
"2003705-82-フブキ" = "ドーナッツ！？"
"2003705-83-ウォーターパークの責任者" = "もう全て、なくなってしまったようですね。"
"2003705-84-ウォーターパークの責任者" = "冷たい飲み物も、たくさんあったんですけど……。"
"2003705-85-フブキ" = "そ、そんな……。"
"2003705-86-ウォーターパークの責任者" = "休憩時間を返上してまで、#nパークのために頑張ってくださったフブキさんに……。"
"2003705-87-ウォーターパークの責任者" = "皆さん、拍手を！"
"2003705-88-ウォーターパークの責任者" = "まさにライフセーバーの鑑です！[ruby=ねむがき]合歓垣[/ruby]フブキさん！"
"2003705-89-フブキ" = "ええと……わ、私は別にそんなつもりじゃ……"
"2003705-90-フブキ" = "ううっ……。"
"2003705-91-フブキ" = "いったい私は、何のために……。"
