[translation]
"2002303-1" = "張り込みの定番"
"2002303-2-カンナ" = "本件の被疑者は、警備局の車両を荒らし、#n積まれていた現金及び保安文書を盗んだ容疑をかけられている。"
"2002303-3-カンナ" = "現金と保安文書そのものは、別に大したものではないが……。"
"2002303-4-カンナ" = "コソドロごときに警備局の車両を荒らされたと世間に知られては、#n我々ヴァルキューレ警察学校の威信が地に落ちてしまう。"
"2002303-5-カンナ" = "あのバカ共の失態で、公安局まで動く羽目になるとは……。"
"2002303-6-カンナ" = "いいか、お前たち。本件は市民の信頼に直結する重要な案件だ。#n保安文書の流出を避けるのはもちろん、メディアが騒ぐ前に必ず検挙するぞ！"
"2002303-7-カンナ" = "公安局の内偵によれば、被疑者グループは砂尾町一帯を拠点とし、#n身分を偽って活動しているとのことだ。"
"2002303-8-カンナ" = "被疑者の特徴は、短い髭と折れた耳、#nそれと目元に大きな傷跡がある三毛猫のような……。"
"2002303-9-カンナ" = "[USERNAME]先生……？"
"2002303-10-カンナ" = "いつからいらしたのですか？#nいえ、そもそもどうしてここに……。"
"2002303-11" = "[s1] \"カンナが張り込みをすると聞いて。\"\n[s2] \"手伝いに来たよ。\""
"2002303-12-カンナ" = "……お気持ちは大変ありがたいのですが。"
"2002303-13-カンナ" = "張り込みにそこまでの人数は必要ありません。#n時間も遅いですし、私たちに任せてお帰りください。"
"2002303-14" = "[s] \"もしかして……私がいると邪魔？\""
"2002303-15-カンナ" = "そんなことはないのですが……。"
"2002303-16-カンナ" = "張り込んだところで、いつ被疑者が姿を現すか分かりません。#nそれに、ご多忙の先生を巻き込むのは、申し訳ないですし。"
"2002303-17-カンナ" = "遅くまで私たちの業務を手伝っていただくことで、体調を崩されないか心配です。"
"2002303-18" = "[ns] \"体力がなくなったら、迷惑にならないうちに帰るから大丈夫だよ。\""
"2002303-19" = "[ns3] \"それに、監視の目は多いほうがいいんじゃない？\"\n[ns4] \"怪しい人を見つけるのは得意だよ。\""
"2002303-20-カンナ" = "……そこまで仰るのなら、仕方ないですね。"
"2002303-21-カンナ" = "では……無理のない範囲で、お願いします。"
"2002303-22-カンナ" = "午前0時30分、視界は良好。#n今のところ、周辺で不審人物の目撃情報はなし。"
"2002303-23-カンナ" = "被疑者と思しきヤツが動くまで、このままか……。"
"2002303-24" = "[ns] \"……ごめん、夜ご飯食べてなくて……。\""
"2002303-25-カンナ" = "いえ……そういえば、私も食事のことを忘れていました。"
"2002303-26-カンナ" = "先生、お腹が減っているのでしたら、近くのコンビニで何か食べてきても問題ありませんので。"
"2002303-27-カンナ" = "もしくは、日付も回ってしまいましたし、そろそろシャーレに戻っていただいても――"
"2002303-28" = "[s] \"カンナは平気なの？\""
"2002303-29-カンナ" = "私は、普段から任務中食事を取らないので。"
"2002303-30-カンナ" = "任務中の食事は、後日経費として精算できますが、#n食事にかまけて監視が疎かになっては元も子もありません。"
"2002303-31-カンナ" = "眠気覚ましにコーヒーくらいは飲みますが……"
"2002303-32-カンナ" = "なので、私のことは気にせずに先生だけでどうぞ。"
"2002303-33" = "[s] \"じゃあ、少し外すね。\""
"2002303-34-カンナ" = "はい。"
"2002303-35-カンナ" = "……思ったよりも、早いお戻りでしたね。"
"2002303-36-カンナ" = "明日もお仕事と伺ってますが、どうしてここまで……。"
"2002303-37-カンナ" = "……その袋は？"
"2002303-38" = "[s5] \"カンナと一緒に食べようと思って。\"\n[s6] \"あんパンと牛乳だよ！\""
"2002303-39-カンナ" = "ふふっ……。#nあんパンですか。"
"2002303-40-カンナ" = "張り込みと聞けば、多くの人が思い浮かべるものですね。"
"2002303-41-カンナ" = "私は大丈夫ですので、先生が召し上がってください。"
"2002303-42" = "[s7] \"えっ！？なんで！？\"\n[s8] \"あんパン、嫌いだった？\""
"2002303-43-カンナ" = "いえ……好みの問題ではありません。"
"2002303-44-カンナ" = "ただでさえ遅い時間ですし……お腹が膨れると、眠くなってしまうので。"
"2002303-45-カンナ" = "ヴァルキューレ警察学校の生徒が、#n食後の眠気で被疑者を取り逃がしたなんて知られては、キヴォトス中で笑い者にされます。"
"2002303-46-カンナ" = "なので、お気持ちだけ頂きますね。"
"2002303-47" = "（その後、いろいろな食べ物をカンナに勧めてみたけど……)"
"2002303-48-カンナ" = "先生？今度こそお帰りになったのかと思いましたが……。"
"2002303-49-カンナ" = "ドーナッツを買ってきたのですか？#n私のお腹が空いていると思って……？"
"2002303-50-カンナ" = "先ほどもお伝えしましたが、私は張り込み中に食事を摂りません。"
"2002303-51-カンナ" = "申し訳ないですが、お気持ちだけ受け取っておきますね。"
"2002303-52-カンナ" = "この匂いは……。#nまた何か買ってきたのですか？"
"2002303-53-カンナ" = "……ハンバーガー？#n理由を伺っても……？"
"2002303-54-カンナ" = "前に刑事モノの映画で、張り込みをしながらハンバーガーを食べるシーンを見たから……ですか？"
"2002303-55-カンナ" = "先生、映画は映画です。#nそれに何度も言いましたが、私は――"
"2002303-56-カンナ" = "……というより、これ以上はジッとしていただきたいです。#n被疑者がこちらの動きに気付いて逃亡する恐れもありますので。"
"2002303-57-カンナ" = "……これは？"
"2002303-58" = "[s9] \"焼きそばだよ！\"\n[s10] \"あんパンも定番だけど、焼きそばもたまに見るからね。\""
"2002303-59-カンナ" = "被疑者の身柄を確保できるかどうかという、こんな大事な状況で……"
"2002303-60-カンナ" = "焼きそばなんて食べてる場合じゃないでしょう！"
"2002303-61" = "（また断られちゃった……)"
"2002303-62-カンナ" = "先生……どうしてそう何度も私の邪魔をされるのですか？"
"2002303-63-カンナ" = "また同じようなことを繰り返すおつもりでしたら……。"
"2002303-64-カンナ" = "公務執行妨害で逮捕します！"
"2002303-65" = "[s11] \"じゃ、邪魔をするつもりなんてないよ！\"\n[s12] \"大事な任務中とはいえ、カンナに食事を抜いてほしくなくて……。\""
"2002303-66-カンナ" = "一食程度、大した問題ではありません。"
"2002303-67-カンナ" = "規則正しい食生活が健康を維持するために大切なことくらい分かっていますが、#n物事には優先順位というものがあります。"
"2002303-68-カンナ" = "警察にとって、事件の解決以上に大切なことなどありません。"
"2002303-69" = "[s] \"事件よりも、カンナの健康のほうが大切だよ。\""
"2002303-70-カンナ" = "……本気で仰っているのですか？"
"2002303-71" = "[s13] \"カンナのことが心配だから。\"\n[s14] \"肝心な時に体力がなかったら、捕まえられないよ？\""
"2002303-72-カンナ" = "はぁ……。"
"2002303-73-カンナ" = "分かりました。#nそれでは、あんパンを一つだけ頂きます。"
"2002303-74-カンナ" = "こういうところが、本当に……。"
"2002303-75-カンナ" = "ところで、これはどこで買ったものですか？"
"2002303-76-カンナ" = "この袋や容器のデザインはコンビニのものではないですし……。"
"2002303-77-カンナ" = "かといって、こんな時間では近くの飲食店はどこも閉まっているでしょう。"
"2002303-78" = "[s] \"あそこの屋台で売ってたよ。\""
"2002303-79-カンナ" = "こんな人通りの少ない時間に屋台が？"
"2002303-80-カンナ" = "まさか……。"
"2002303-81-カンナ" = "先生、屋台の店員はどのような人相でした？"
"2002303-82" = "[s] \"折れ耳で、目元に傷跡があって……あっ、三毛猫みたいな感じだったよ。\""
"2002303-83-カンナ" = "そいつだ！"
"2002303-84-カンナ" = "先生、その屋台の場所まで案内してください！"
"2002303-85" = "（その後、カンナは屋台で何食わぬ顔をしていた犯人を見つけると、すぐに身柄を確保した)"
"2002303-86" = "（ただ、張り込みが終わってからも、カンナはなかなか食べ物を受け取ろうとせず……)"
"2002303-87" = "（購入した大量の食べ物は、他の生徒たちと分けて食べた)"
