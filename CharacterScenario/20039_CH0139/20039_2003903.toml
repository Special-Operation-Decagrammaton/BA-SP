[translation]
"2003903-1" = "胡蝶の夢"
"2003903-2" = "シャーレ・執務室"
"2003903-3-キサキ" = "……して、みな上を下への大騒ぎじゃったよ。"
"2003903-4-キサキ" = "門主が軽々しく外部へ協力してはならぬとか、それでは門主としての威厳を損ねるだとか……。"
"2003903-5-キサキ" = "―[ruby=わらわ]―妾は[/ruby]ただ、「おさぼり」したかっただけじゃというのに。"
"2003903-6" = "[s] \"えっ、そうだったの！？\""
"2003903-7-キサキ" = "ふふ、冗談じゃ。"
"2003903-8" = "[s] \"そ、そうだよね……？\""
"2003903-9-キサキ" = "じゃが、事と次第によっては――それも本音になり得るというもの。"
"2003903-10" = "[s] \"どっち！？\""
"2003903-11-キサキ" = "ふふ、それを推測するのも、また一興。"
"2003903-12-キサキ" = "さて、そろそろ業務に移ろうかの。"
"2003903-13-キサキ" = "シャーレの仕事は初めてではあるが――"
"2003903-14-キサキ" = "うむ、その前に……。"
"2003903-15" = "[ns] \"これは何？\""
"2003903-16-キサキ" = "心身の疲れを癒やす[ruby=こうやく]香薬[/ruby]じゃ。"
"2003903-17-キサキ" = "シャーレ当番に行くと伝えたら、錬丹術研究会が用意してくれてな。"
"2003903-18-キサキ" = "さあ、始めようかの。#n時は金なり――じゃぞ？"
"2003903-19" = "（そうやって、キサキと共にシャーレの仕事を始めると……）"
"2003903-20-キサキ" = "ふむ……「旧市街地の廃ビルに、個人配信者が殺到し」"
"2003903-21-キサキ" = "「近隣住民から苦情が入っており、当該地域の治安悪化が懸念されている。」"
"2003903-22-キサキ" = "「これに関して、連邦捜査部シャーレに意見書および協力を要請する。」……か。"
"2003903-23" = "[s] \"キサキならどうする？\""
"2003903-24-キサキ" = "そうさな……我が玄龍門のやり方じゃと……"
"2003903-25-キサキ" = "「問題の原因となる一帯を更地にする」……とかはどうじゃ？"
"2003903-26" = "[s] \"それはちょっとやりすぎじゃないかな……。\""
"2003903-27-キサキ" = "……そうかの？"
"2003903-28-キサキ" = "もっと周囲の状況を考慮すべき？……ふむ。"
"2003903-29-キサキ" = "根本的な解決はそれが一番じゃが……先生の言うことにも一理あるじゃろう。"
"2003903-30-キサキ" = "次は……#n「最新の銃器や弾薬が補給されないことで、生徒から不満の声が上がっている」……？"
"2003903-31-キサキ" = "たしかに、キヴォトスにおいて銃火器は、衣食住と同じくらい重要なものじゃ。"
"2003903-32" = "[s] （そんなに重要なんだ……）"
"2003903-33-キサキ" = "これに対し、生徒が意見を述べるのは当然のこと。#n問題を引き起こした当事者を探す必要があるようじゃな……"
"2003903-34-キサキ" = "なるほど……書類を見る限り、供給側が不正を働いているようじゃの。"
"2003903-35-キサキ" = "玄龍門ではこういう場合、罪人に物理的な制裁を加えるのじゃが――"
"2003903-36" = "[s] \"ぼ、暴力はダメだよ……？\""
"2003903-37-キサキ" = "……無論、妾とて無暗に力を振るうつもりはない。"
"2003903-38-キサキ" = "……じゃが、先生も知っておるのではないか？"
"2003903-39-キサキ" = "この世には、法だけで解決できぬ事柄もあるということを。"
"2003903-40-キサキ" = "じゃから――くまなく調査したうえで、罪状が明白であれば……#n可及的速やかに死刑を言い渡す必要があろう！"
"2003903-41" = "[s] \"死刑もダメだからね！？\""
"2003903-42-キサキ" = "ああ、ここで言う死刑はあくまで比喩的な意味ではあるが……。"
"2003903-43" = "[s] \"それでも死刑はダメ！禁止！！\""
"2003903-44-キサキ" = "そ、そうか……。"
"2003903-45-キサキ" = "これで今日の仕事は終わりじゃな。"
"2003903-46-キサキ" = "普段より大幅に時間短縮できた？#nふふ、役に立てたようで嬉しいのう。"
"2003903-47-キサキ" = "うん？迅速かつ正確な判断に驚いたけど、解決法がやや極端……？"
"2003903-48-キサキ" = "……ふむ。玄龍門のやり方が世に理解されるには、まだ時間が必要なようじゃな。"
"2003903-49-キサキ" = "さて、次の予定に移ろうではないか。"
"2003903-50-キサキ" = "うん？想定以上に早く仕事が片付いてしまったから、何も考えていない？#nふむ……。"
"2003903-51" = "（どこかから、落ち着くような香りがしてきた）"
"2003903-52" = "（キサキが持ってきた香炉からのようだ……）"
"2003903-53-キサキ" = "先生？顔色が悪いようじゃが……。"
"2003903-54-キサキ" = "おや……3日も眠っておらなんだか。"
"2003903-55-キサキ" = "よもやシャーレの仕事がここまで激務であったとは……これは由々しき事態じゃ。#nそうさな……まずは場所を移そう。"
"2003903-56-キサキ" = "ほれ、横になるといい。#n妾の膝を貸してやろう。"
"2003903-57-キサキ" = "ふふ、どうやらずうっと我慢をしていたようじゃのう。#n妾にすべて委ねると良い。"
"2003903-58-キサキ" = "目を閉じて……そう。#n息をゆっくりと吸って、吐くのじゃ……うむ、そうじゃ……。"
"2003903-59" = "（目を閉じていると……ここが夢なのか現実なのか、曖昧になってくる）"
"2003903-60" = "（小さくて柔らかい手のひらが、そっと髪に触れてくる……）"
"2003903-61-キサキ" = "穏やかな顔をしておる……良い夢を見れているのじゃろう。"
"2003903-62-キサキ" = "じゃが、夢を見ているということは……言い換えれば、深い眠りにはつけていないという証左。"
"2003903-63" = "（……額に温かな手が添えられる）"
"2003903-64-キサキ" = "昔からの言い伝えでの……"
"2003903-65-キサキ" = "ある者が夢の中で蝶となり、飛び回っておった。"
"2003903-66" = "（……額にあった指先が頬にゆっくりと滑っていき）"
"2003903-67-キサキ" = "蝶はその感覚に満足しすぎたあまり、自分が人間であったか蝶であったかすら定かでなくなってしまった。"
"2003903-68-キサキ" = "ふと夢から目を覚ますと、やはり自分は人間であることに気が付いたのじゃ。"
"2003903-69" = "（……首元でそっと止まる）"
"2003903-70-キサキ" = "その者は考えておった。#n蝶が自分なのか、自分が蝶なのか。"
"2003903-71-キサキ" = "あるいは――区別がつかないものは、最初から重要ではないのか、と……。"
"2003903-72" = "（目が覚めた頃には……キサキも、彼女が持ってきた香炉も姿を消していた）"
"2003903-73" = "（本当にキサキがシャーレを訪ねていたかすら分からなくなるくらい、不思議な気分に包まれていた……）"
