[translation]
"2000902-1" = "とある髭の生徒会長の冬休み"
"2000902-2-チェリノ" = "よく来たな、カムラッド！待っていたぞ！"
"2000902-3" = "[s] \"あれ、今日はチェリノだけ？\""
"2000902-4-チェリノ" = "うーん、それがだな……"
"2000902-5-チェリノ" = "せっかくこの豪勢な温泉を丸ごと貸し切ったというのに、みんな仕事が忙しくて来れないとか……。"
"2000902-6-チェリノ" = "その誠実な労働態度は悪くないが、本来仕事というのは適度に休んでこそ効率良く働けるものだというのに……全く、要領が悪いことだ。"
"2000902-7-チェリノ" = "それに、こんな広い温泉なのに……。"
"2000902-8-チェリノ" = "け、決して寂しいとか心細いとか、そういう話じゃないからな！"
"2000902-9-チェリノ" = "指導者というのは、元より孤独なもの。"
"2000902-10-チェリノ" = "レッドウィンター連邦学園の書記長であり生徒会長であり、さらには環境美化部部長であり清掃部部長であるおいらにとって、今さら孤独など大したことではない。"
"2000902-11-チェリノ" = "……だがまあ、今日はせっかくカムラッドが来てくれたからな。特別に少しぐらいは付き合ってやろう！"
"2000902-12-チェリノ" = "ふふ……光栄に思うが良い、カムラッド！"
"2000902-13-チェリノ" = "ところで、おいらは今から何を楽しめば……？"
"2000902-14" = "[s] \"……？私に聞かなくても、チェリノの好きなように……。\""
"2000902-15-チェリノ" = "おいらは偉大なる生徒会長とはいえ、今まで温泉で休暇を楽しんだ経験はほとんど無い。"
"2000902-16-チェリノ" = "この間旧校舎に温泉ができた時は、バカ共の尻ぬぐいのせいできちんと休めなかったし……。"
"2000902-17-チェリノ" = "ということであらためて、今度こそ色々とたくさん楽しんでやろう！"
"2000902-18-チェリノ" = "さあカムラッド、おいらに温泉での楽しみ方を提案すると良い！"
"2000902-19" = "[s] \"まずはゆっくり温泉に浸かってみたら？\""
"2000902-20-チェリノ" = "温泉はもう良い！"
"2000902-21-チェリノ" = "ずっと浸かってるとのぼせちゃうし、疲れるし……あんなものに長時間入ってるやつらの気が知れん。"
"2000902-22" = "[s] \"読んだことのない漫画を読んでのんびりするとか。\""
"2000902-23-チェリノ" = "それはいつも事務局でしてる。"
"2000902-24" = "[s] \"美味しい物を食べて、お昼寝をするとか……。\""
"2000902-25-チェリノ" = "それも、いつも事務局で……。"
"2000902-26-チェリノ" = "ううっ！せっかくの冬休みなのに、これではいつもと同じじゃないか！"
"2000902-27-チェリノ" = "うーん、遊園地とかプリン工場の方が良かったか……？"
"2000902-28" = "[s1] \"それは普段からくつろぎ過ぎなのでは……？\"\n[s2] \"もういつも休暇みたいな感じだね……。\""
"2000902-29-チェリノ" = "うっ、うるさいぞカムラッド！粛清されたいのか！？"
"2000902-30-チェリノ" = "うっ、うるさいぞカムラッド！粛清されたいのか！？"
"2000902-31-チェリノ" = "せっかくの冬休みなのに、このままでは……何か良い手は無いものか……？"
"2000902-32-チェリノ" = "温泉郷でしか楽しめないような娯楽……。"
"2000902-33-チェリノ" = "……ん？あの休憩室の端っこにあるテーブルは何だ、カムラッド？"
"2000902-34" = "[s] \"卓球台かな？\""
"2000902-35-チェリノ" = "卓球……そういえば旧校舎の温泉の時にも、浴衣姿でやっていた生徒たちが結構いたような。"
"2000902-36-チェリノ" = "もしかして温泉で卓球というのは定番なのか？"
"2000902-37-チェリノ" = "まあ何はともあれ、試してみるとしよう。"
"2000902-38-チェリノ" = "よしカムラッド、今からおいらと一緒に卓球をするぞ！"
"2000902-39" = "[s3] \"それは全然良いんだけど……。\"\n[s4] \"上手く手加減できるかな……。\""
"2000902-40-チェリノ" = "ふふっ、自信満々じゃないか。"
"2000902-41-チェリノ" = "ふふっ、自信満々じゃないか。"
"2000902-42-チェリノ" = "そこまで自信があるなら、プリンを賭けるのはどうだ？"
"2000902-43-チェリノ" = "それも普通のプリンではない、あの「ルワゾー・ブッレ」の最高級抹茶プリンだ！"
"2000902-44" = "[s] \"うん、それは全然良いよ。\""
"2000902-45-チェリノ" = "ふふっ……[ruby=ただ]無料[/ruby]でプリンが食べられると思うと、ますますやる気が溢れてきたな。"
"2000902-46-チェリノ" = "では……"
"2000902-47-チェリノ" = "尋常に勝負！"
"2000902-48" = "その後、だいぶ長い間チェリノと卓球をやった。"
"2000902-49" = "チェリノはあまり上手では無かったのだけれど、なかなか負けを認めないこともあって10セット以上も続いた……。"
