[translation]
"2000905-1" = "防水の髭"
"2000905-2-チェリノ" = "ふふっ、ふふふふふっ……。"
"2000905-3" = "[s] \"チェリノ、何だか嬉しそうだね？\""
"2000905-4-チェリノ" = "うむ。長らくおいらを苦しめてきた問題を解決できる、良い方法が浮かんだからな。"
"2000905-5-チェリノ" = "これも全部、この前カムラッドがモモトークで教えてくれたことのおかげだ。"
"2000905-6-チェリノ" = "おいらにインスピレーションを提供してくれたカムラッドには、特別に理知的髭栄誉章を授与しよう。"
"2000905-7-チェリノ" = "光栄に思え、カムラッド！"
"2000905-8" = "[s1] \"この前のってことは……。\"\n[s2] \"白鳥の話？\""
"2000905-9-チェリノ" = "うむ。まずカムラッドからその話を聞いて、おいらはすぐに白鳥の生態を調べてみた。"
"2000905-10-チェリノ" = "うむ。まずカムラッドからその話を聞いて、おいらはすぐに白鳥の生態を調べてみた。"
"2000905-11-チェリノ" = "カムラッドの言う通り、白鳥は尾羽から出た油のおかげなどがあって、水に浮くことができるらしい。"
"2000905-12-チェリノ" = "さらにそのキラキラ光る油のおかげで、羽毛が白く輝いて見える効果まであるとか……つまり白鳥の権威は、油から出ているといっても過言ではない！"
"2000905-13" = "[s] \"……えっと、なるほど？\""
"2000905-14-チェリノ" = "まあ聞けカムラッド……実はおいらは、温泉自体そこまで好きではない。"
"2000905-15-チェリノ" = "熱いお湯のせいですぐにのぼせてしまうのも理由の一つだが……何よりも権威の象徴であるこの髭が、びっしょり濡れてしまうことが問題だ。"
"2000905-16-チェリノ" = "濡れた髭はみっともない形になるのはもちろん、時々接着力が弱まって外れたりもするし……"
"2000905-17-チェリノ" = "い、いや、実際に髭が外れるなんてことは無い！この髭はなにせ、本物の髭だからな！"
"2000905-18-チェリノ" = "とにかく！そこでおいらは長い研究を経て、髭を濡らさずに温泉を楽しめる画期的な方法を発見したんだ。"
"2000905-19-チェリノ" = "その方法とは……"
"2000905-20-チェリノ" = "ズバリ、髭に油を塗れば良い！"
"2000905-21-チェリノ" = "髭に油をたくさん塗っておくことで、白鳥の羽根のように水に濡れることなく、お風呂の中でもかっこいい髭の形を維持できる上に……。"
"2000905-22-チェリノ" = "油を塗った髭はいつもよりもっと輝くはずだから、おいらの権威もまたこれまで以上に光り輝くんじゃないか？"
"2000905-23-チェリノ" = "ふふっ、完璧だ……キラキラと輝くかっこいい髭を見て、感激する生徒たちの反応が目に浮かぶ。"
"2000905-24-チェリノ" = "では早速、用意したこの油を髭に塗ってみよう。"
"2000905-25-チェリノ" = "筆に油をつけて……。"
"2000905-26-チェリノ" = "……ああもう、めんどくさい！"
"2000905-27-チェリノ" = "こんな一本一本油を塗ってたらキリがない！"
"2000905-28-チェリノ" = "髭ごと油の瓶に漬けて、放置しておけば大丈夫か。"
"2000905-29" = "[s] \"髭、外れてるけど大丈夫……？\""
"2000905-30-チェリノ" = "細かいことは気にするなカムラッド！"
"2000905-31-チェリノ" = "じゃあおいらは少し昼寝をしてくるから、その間髭の監視を頼む！"
"2000905-32-チェリノ" = "おお、ついに完成したか……おいらの防水髭！"
"2000905-33-チェリノ" = "油で艶めくこの美しい姿……これを付けていれば生徒たちもこの輝く権威に対し、感激せずにはいられないだろう！"
"2000905-34-チェリノ" = "さあ、それでは試着してみようか。"
"2000905-35-チェリノ" = "ぐあぁぁっ！？"
"2000905-36-チェリノ" = "な、なんだこれは！？カムラッド、髭からものすごい臭いがするぞ！？"
"2000905-37-チェリノ" = "この鼻を刺すような臭い……頭が痛くなる……"
"2000905-38" = "[s] \"これ、ごま油……？\""
"2000905-39-チェリノ" = "なっ、それではダメなのか？"
"2000905-40-チェリノ" = "でも確かこれを持ってくる時には、こんなにひどい臭いでは無かったはず……。"
"2000905-41" = "[s] \"さすがに、そこまで至近距離で付けてると……。\""
"2000905-42-チェリノ" = "そういうことか……どうしよう、今は予備の髭が無いし……。"
"2000905-43-チェリノ" = "この髭をずっと付けるのは耐えられないし……。"
"2000905-44" = "[s] \"しばらくは髭無しで過ごすしか……？\""
"2000905-45-チェリノ" = "なっ……レッドウィンター連邦学園の書記長であり、生徒会長であるおいらが、髭無しで休暇を送らなきゃいけないなんて……。"
"2000905-46-チェリノ" = "そんなこと、あってはならないのにっ……！"
