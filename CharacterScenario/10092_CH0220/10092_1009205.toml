[translation]
"1009205-1" = "あなたのために奏でて"
"1009205-2" = "（約束した時間に合わせて、待ち合わせ場所に向かった）"
"1009205-3" = "（部屋はがらんとしていて、電気も点いていない）"
"1009205-4" = "[ns1] \"ヨシミはまだかな……？\"\n[ns2] 電気を点ける。"
"1009205-5-ヨシミ" = "……ふふっ。"
"1009205-6-ヨシミ" = "待ってたわよ、先生。"
"1009205-7" = "[ns3] \"……ヨシミ？\"\n[ns4] \"これはどういう状況……？\""
"1009205-8-ヨシミ" = "そうね、ひとことで言うと――今から演奏をするわ。"
"1009205-9-ヨシミ" = "死ぬほど練習したけど……やっぱりこうなると緊張するわね。"
"1009205-10-ヨシミ" = "誰かにちゃんと聴かせるのは初めてだし。"
"1009205-11-ヨシミ" = "……ん？"
"1009205-12-ヨシミ" = "なに、説明？"
"1009205-13-ヨシミ" = "……はぁ。"
"1009205-14-ヨシミ" = "これ以上、言葉が必要？"
"1009205-15-ヨシミ" = "いくら先生でも、分かるでしょ？"
"1009205-16-ヨシミ" = "……練習の成果を、聴いてもらおうと思ったの。"
"1009205-17-ヨシミ" = "ほら、分かったら口閉じて。"
"1009205-18-ヨシミ" = "緊張したんだから……誘うのも、準備するのも。"
"1009205-19-ヨシミ" = "……本気なんだから、茶化さないでよね。"
"1009205-20" = "[ns5] \"うん、分かった。\"\n[ns6] 無言で近くの椅子に座る。"
"1009205-21-ヨシミ" = "……ふぅ。"
"1009205-22-ヨシミ" = "先生がそう真面目だと、逆に緊張するわね……。"
"1009205-23-ヨシミ" = "それじゃ……。"
"1009205-24-ヨシミ" = "……ん？"
"1009205-25-ヨシミ" = "曲？"
"1009205-26-ヨシミ" = "バンドでやってたのとは別で、"
"1009205-27-ヨシミ" = "個人的に練習してたヤツ。"
"1009205-28-ヨシミ" = "ちゃんと私が選んだ――"
"1009205-29-ヨシミ" = "……はあ。"
"1009205-30-ヨシミ" = "良いから、細かいことは聞かないで。"
"1009205-31-ヨシミ" = "黙って聴いててよ？"
"1009205-32" = "それじゃ……。"
"1009205-33" = "ふぅ……。"
"1009205-34" = "……。"
"1009205-35" = "んー……。"
"1009205-36" = "うーん……。"
"1009205-37" = "ううーん……！"
"1009205-38" = "……やっぱりダメね。"
"1009205-39" = "[ns7] \"座った……？\"\n[ns8] \"そんなに緊張しなくてもいいのに。\""
"1009205-40" = "ごめん。やっぱりミスりそうだから、練習の時みたいに座ってやるわ。"
"1009205-41" = "ちょっと姿勢がアレかもしれないけど……気にしないで。"
"1009205-42" = "それじゃ……。"
"1009205-43" = "……。"
"1009205-44" = "（ヨシミの演奏が部屋に響き渡る）"
"1009205-45" = "（アンプやスピーカーに繋げているわけではなく、生の音を直に聴くことができた）"
"1009205-46" = "（その演奏は……）"
"1009205-47" = "（……とても上手だった）"
"1009205-48" = "[wa:580]― [log=요시미 밴드]ふぅ……[wa:1020]ふう……。[/log]"
"1009205-49" = "― [log=요시미 밴드]……や、[wa:1030]やった……。[/log]"
"1009205-50" = "― [log=요시미 밴드]やり遂げたわ……。[/log]"
"1009205-51" = "[ns9] \"本当にすごかった。\"\n[ns10] \"すごい、心に響いたよ。\""
"1009205-52" = "[wa:400]― [log=요시미 밴드]そ、[wa:550]そう……？[/log]"
"1009205-53" = "[wa:400]― [log=요시미 밴드]そ、[wa:550]そう……？[/log]"
"1009205-54" = "― [log=요시미 밴드]先生が[wa:470]聴いてた感じも[wa:550]そうだった……？[/log]"
"1009205-55" = "― [log=요시미 밴드]ふざけてるんじゃ[wa:550]ないわよね？[/log]"
"1009205-56" = "― [log=요시미 밴드]これは……[wa:1020]本当にそう思ってる？[/log]"
"1009205-57" = "[wa:1350]― [log=요시미 밴드]なんか……[wa:1180]ドキドキして……。[/log]"
"1009205-58" = "― [log=요시미 밴드]こんなの、[wa:1250]初めて……。[/log]"
"1009205-59" = "[wa:650]― [log=요시미 밴드]……先生……。[/log]"
"1009205-60" = "― [log=요시미 밴드]思い返して見たら、[/log]"
"1009205-61" = "― [log=요시미 밴드]先生に[wa:400]初めて見せたんじゃないかな。[/log]"
"1009205-62" = "[wa:1160]― [log=요시미 밴드]なんというか……[wa:1630]その……。[/log]"
"1009205-63" = "― [log=요시미 밴드]……私の[wa:500]「格好いい」姿……[wa:1650]ってやつ……。[/log]"
"1009205-64-ヨシミ" = "……は、はい！もう終わり！"
"1009205-65-ヨシミ" = "用事は終わったから解散！"
"1009205-66-ヨシミ" = "ほら、もう良いでしょ！"
"1009205-67-ヨシミ" = "それとも何か――"
"1009205-68-ヨシミ" = "……え？"
"1009205-69-ヨシミ" = "も、もう一回……？アンコール……？"
"1009205-70-ヨシミ" = "な、何言ってんの！？"
"1009205-71-ヨシミ" = "これは、コンサートとかそんなのじゃなくて……！"
"1009205-72" = "[s11] \"それでも、聴きたいなって。\"\n[s12] \"初めてのアンコールも欲しいな？\""
"1009205-73-ヨシミ" = "……！！！！"
"1009205-74-ヨシミ" = "くっ……うっ……！！本当にもう！！"
"1009205-75-ヨシミ" = "この減らず口は……っ！"
"1009205-76-ヨシミ" = "～～～～～～～～！！！！！！"
"1009205-77-ヨシミ" = "はぁ……もう良いわよ。"
"1009205-78-ヨシミ" = "……よし。"
"1009205-79-ヨシミ" = "そんなに言うなら、やってやるわ。"
"1009205-80-ヨシミ" = "でも、覚悟してよね。"
"1009205-81-ヨシミ" = "そっちがそのつもりなら……"
"1009205-82-ヨシミ" = "先生の「初めて」――"
"1009205-83-ヨシミ" = "――全部持ってってやるんだから。"
"1009205-84" = "（そうして、ヨシミの色んな演奏を聴いた）"
"1009205-85" = "（中盤からは体力が尽きたのか、へとへとになっていた……）"
