[translation]
"1009203-1" = "アドバイス（？）"
"1009203-2" = "（ヨシミの連絡を受けてカフェへと向かった）"
"1009203-3-？？？" = "あ、先生！こっちこっち！"
"1009203-4" = "（店の片隅で、紙を並べているヨシミが見えた）"
"1009203-5-ヨシミ" = "急にごめん。"
"1009203-6-ヨシミ" = "大丈夫だった？"
"1009203-7-ヨシミ" = "べ、別に絶対来てとは言ってないでしょ！？"
"1009203-8-ヨシミ" = "いや、来てくれたのは嬉しいけど……"
"1009203-9-ヨシミ" = "と、とにかく！"
"1009203-10-ヨシミ" = "いざデザイン始めてみたら、ちょっと行き詰まっちゃって……。"
"1009203-11-ヨシミ" = "先生、ちょっとアドバイスしてくれない？"
"1009203-12" = "[ns1] \"そういうのは詳しくないけど、とりあえず……。\"\n[ns2] \"バンドのマークを描くんだよね？\""
"1009203-13-ヨシミ" = "……ん？"
"1009203-14-ヨシミ" = "何そのアイコン？"
"1009203-15-ヨシミ" = "……？"
"1009203-16-ヨシミ" = "……え？"
"1009203-17-ヨシミ" = "……？？"
"1009203-18-ヨシミ" = "え、もしかして何かすれ違ってる？"
"1009203-19-ヨシミ" = "バンドのロゴなら、後でやるけど……。"
"1009203-20" = "[ns3] \"……え？\"\n[ns4] \"じゃあ今のこれは？\""
"1009203-21-ヨシミ" = "あ、説明してなかったわね。"
"1009203-22-ヨシミ" = "えっと、これなんだけど……。"
"1009203-23" = "[ns] \"…………。\""
"1009203-24-ヨシミ" = "…………？"
"1009203-25" = "[ns5] \"えっと「デザイン」ってつまり……。\"\n[ns6] \"自分のサイン……？\""
"1009203-26-ヨシミ" = "そうだけど、何か問題でもあるの？"
"1009203-27-ヨシミ" = "……え？"
"1009203-28-ヨシミ" = "何でって……？"
"1009203-29-ヨシミ" = "いや、当然でしょ？"
"1009203-30-ヨシミ" = "ほら、これからバンドやるわけだし。"
"1009203-31-ヨシミ" = "オープニングイベントにも出るんだから、沢山の人が見るわけで――"
"1009203-32-ヨシミ" = "演奏が上手くいけば、有名人になるわけじゃない？"
"1009203-33-ヨシミ" = "その時にサインが決まってなかったら困るでしょ？#nここまでで、何かおかしいとこあった？"
"1009203-34-ヨシミ" = "……え？合ってるわよね？"
"1009203-35-ヨシミ" = "何も、間違ってないわよね……？"
"1009203-36" = "[s7] \"も、もちろん悪くは無いけど……。\"\n[s8] \"その、ほんのちょっとだけ気が早いかも……？\""
"1009203-37-ヨシミ" = "そ、そう……かしら……？"
"1009203-38-ヨシミ" = "え、待って。#nえっと……。"
"1009203-39-ヨシミ" = "そ、その……なんかそう言われたら急に……。"
"1009203-40-ヨシミ" = "……恥ずかしくなってきた、かも。"
"1009203-41-ヨシミ" = "……待って、先生。"
"1009203-42-ヨシミ" = "何も言わないで。そのまま黙ってて。#n絶対喋らないで。"
"1009203-43" = "[s9] \"大丈夫、みんな通る道！\"\n[s10] \"みんなでサインの練習中だったり？\""
"1009203-44-ヨシミ" = "喋らないでって言ったでしょ！！！！！"
"1009203-45-ヨシミ" = "ああもうっ！！！"
"1009203-46-ヨシミ" = "はぁ……。"
"1009203-47" = "[ns] 慰めようとする。"
"1009203-48-ヨシミ" = "動かないで！！！！じっとして！！！"
"1009203-49-ヨシミ" = "ほんと、最悪……。"
"1009203-50" = "[s11] \"本当に気にしないで良いのに。\"\n[s12] \"そのサイン、私欲しいな。\""
"1009203-51-ヨシミ" = "もう良いから！！リップサービス本当にありがとうございましたぁ！！"
"1009203-52-ヨシミ" = "ほんと勘弁して！！"
"1009203-53-ヨシミ" = "良いじゃない、別に考えたって……。"
"1009203-54-ヨシミ" = "……なによ。"
"1009203-55-ヨシミ" = "え、これ……？"
"1009203-56-ヨシミ" = "……欲しいの？"
"1009203-57-ヨシミ" = "……そうすれば、慰めになるとでも思ってる？"
"1009203-58" = "[s13] \"ううん、純粋に欲しいから。\"\n[s14] \"リップサービスなんかじゃないよ。\""
"1009203-59-ヨシミ" = "はぁ……。"
"1009203-60-ヨシミ" = "またそうやって……。"
"1009203-61-ヨシミ" = "そうやって言えば、私が機嫌直すって思ってるんでしょ？"
"1009203-62-ヨシミ" = "……別に良いわよ。"
"1009203-63-ヨシミ" = "はぁ、ムカつく！！"
"1009203-64-ヨシミ" = "機嫌直っちゃう私も、そういう先生も！"
"1009203-65-ヨシミ" = "……ま、今さらよね。"
"1009203-66-ヨシミ" = "それじゃ、一番良さげなのを……。"
"1009203-67-店員" = "失礼します、こちらお会計を。"
"1009203-68-店員" = "こちらにサインをお願いできますか？"
"1009203-69-ヨシミ" = "あ、はい。"
"1009203-70-ヨシミ" = "サイン、サイン……。"
"1009203-71-ヨシミ" = "……？"
"1009203-72-ヨシミ" = "……あ、間違えた。"
"1009203-73-店員" = "……？"
"1009203-74" = "[ns15] \"あ、可愛い。\"\n[ns16] \"すごく良いと思う。\""
"1009203-75" = "[ns] \"カッコいいね！\""
"1009203-76-ヨシミ" = "いや待って、これは……！！"
"1009203-77-ヨシミ" = "だめ、本当にダメ！！！"
"1009203-78-ヨシミ" = "その、これは違くて……。"
"1009203-79-ヨシミ" = "ほんとにダメなんだってば！！"
"1009203-80" = "[ns17] \"ご、ごめん。\" \n[ns18] \"ここの支払いは私がするからね。\""
"1009203-81-ヨシミ" = "ああああああああああっ！！"
"1009203-82" = "（……後で店員さんから怒られた）"
