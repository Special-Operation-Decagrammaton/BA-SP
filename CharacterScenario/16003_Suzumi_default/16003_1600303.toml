[translation]
"1600303-1" = "目が眩むほどに輝いて"
"1600303-2-スズミ" = "こんにちは、先生。こちらです。"
"1600303-3-スズミ" = "今日のエスコートの目的地はどこですか？"
"1600303-4-スズミ" = "……なるほど、承知しました。"
"1600303-5-スズミ" = "なかなか距離がありますね、ですがご心配なく。私が責任を持って最後まで安全に……"
"1600303-6-スズミ" = "……！"
"1600303-7" = "[s] \"……スズミ？\""
"1600303-8-スズミ" = "先生こちらへ！！車の後ろに！"
"1600303-9-スズミ" = "閃光弾、投擲します！！"
"1600303-10" = "バンッッ！！キイイイイィィィィィン――"
"1600303-11-生徒A" = "きゃああぁっ！？な、なに！？目が……！目が見えない！"
"1600303-12-生徒B" = "何だっ……！？ぐぅっ……！"
"1600303-13-生徒A" = "い、いったい何なの！？"
"1600303-14-スズミ" = "距離を取りましょう、こちらへ！！"
"1600303-15-スズミ" = "……ふう、とりあえず危険な位置は脱しました。"
"1600303-16-スズミ" = "まさかこんな日中からあんな形で先生を狙うとは……大胆不敵ですね。"
"1600303-17-スズミ" = "え、普通の生徒に見えた……？いえ、そんなことはありません。"
"1600303-18-スズミ" = "あの生徒たち、スマホを胸の高さまで持ち上げていました。"
"1600303-19-スズミ" = "角度のことも鑑みて、きっと先生の写真を撮って上層部に送ろうとしていたに違いありません。"
"1600303-20" = "[s1] \"そうは見えなかったけど……。\"\n[s2] \"本当に……？\""
"1600303-21-スズミ" = "もちろん絶対というわけではありませんが、可能性は十分にあります。"
"1600303-22-スズミ" = "もちろん絶対というわけではありませんが、可能性は十分にあります。"
"1600303-23-スズミ" = "先生は良い人なのですね。ですが任務・戦闘の基本は、まず疑ってかかることです。"
"1600303-24-スズミ" = "今は先生をエスコートしながら目的地を目指すという任務中ですから。"
"1600303-25-スズミ" = "……っ！！あそこにまた怪しい人物が！"
"1600303-26-スズミ" = "閃光弾、投擲！！"
"1600303-27" = "バンッッ！！キイイイイィィィィィン――"
"1600303-28-店員" = "うわあっ！！なんだ！？"
"1600303-29-生徒C" = "ぐっ！！目が……！！"
"1600303-30-スズミ" = "やはり人が多いところは危険……！もう少し場所を移しましょう！"
"1600303-31-スズミ" = "先生、こちらへ！"
"1600303-32-スズミ" = "はあ、はあ……。"
"1600303-33-スズミ" = "大丈夫ですか、先生？ここなら安全です。"
"1600303-34-スズミ" = "人通りも少ないですし、誰かが来てもすぐに視界に入ります。"
"1600303-35-スズミ" = "襲われても制圧しやすいですし、悪くない場所です。"
"1600303-36-スズミ" = "……？ここまでしなくても大丈夫……ですか？"
"1600303-37-スズミ" = "そんなことはありません。今日は、何があっても先生を無事にエスコートしなくてはいけませんので。"
"1600303-38-スズミ" = "もしも先生に何があったら、それは全面的に私の責任です……そんなことは決して許されません。"
"1600303-39-スズミ" = "ところでどうしてそんなに……。"
"1600303-40-スズミ" = "……えっと、もしかして今日の私、気を張りすぎでしょうか？"
"1600303-41" = "[s3] \"ありがたいけど、もうちょっと肩の力抜いて。\"\n[s4] \"一緒にお散歩するぐらいの気持ちでいてもらえれば。\""
"1600303-42-スズミ" = "そ、それはそれで逆に緊張してしまうのですが……。"
"1600303-43-スズミ" = "そ、それはそれで逆に緊張してしまうのですが……。"
"1600303-44-スズミ" = "……でも、ありがとうございます。はい、では少し深呼吸をして……。"
"1600303-45-スズミ" = "この道を真っすぐに行けば着くはずです、行きましょう。"
"1600303-46" = "[s] （スズミについて行く）"
"1600303-47-スズミ" = "……到着しましたね。何事も無くて良かったです。"
"1600303-48-スズミ" = "先生の言う通り、序盤は緊張しすぎていたかもしれません。"
"1600303-49-スズミ" = "……もしかして私、先生の邪魔をしてしまいましたか？普通に行くより、ずっと時間がかかってしまったような……。"
"1600303-50-スズミ" = "え、もともと織り込み済みの時間だから大丈夫……？"
"1600303-51-スズミ" = "……ただ一緒に歩きたかっただけだから？"
"1600303-52-スズミ" = "せ、先生！？こ、これは自警団の護衛であって、決してデートというわけではなく、その……！"
"1600303-53-スズミ" = "い、いえ、もちろん呼んでほしくないというわけではないのですが……！"
"1600303-54-スズミ" = "最初からそう言っていただければ私もそのつもりで……！"
"1600303-55-スズミ" = "じゃなくて！とにかくこういうのは良くありません！"
"1600303-56-スズミ" = "……。"
"1600303-57-スズミ" = "……えっと。"
"1600303-58-スズミ" = "ですが、また呼んでいただけると、嬉しいです。"
"1600303-59-スズミ" = "護衛としてのエスコートではなく、ただのご同行であれば、私もそういう風にお付き合いいたしますので……。"
"1600303-60-スズミ" = "その時はきっと……今より、もう少し上手くできると思いますから。"
"1600303-61-スズミ" = "……はい、ありがとうございます。"
"1600303-62-スズミ" = "そ、それでは今日はこれで……！"
"1600303-63" = "（そうやって、スズミは素早くどこかへ消えていってしまった）"
"1600303-64" = "（その後ろ姿は、前と同じでどこかぎこちなかった）"
