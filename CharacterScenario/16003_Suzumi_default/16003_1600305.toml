[translation]
"1600305-1" = "閃光弾万能説"
"1600305-2-スズミ" = "ここです、先生。"
"1600305-3-スズミ" = "大丈夫です、私も今来たところですので。"
"1600305-4-スズミ" = "急に呼び出して大丈夫だったか……？それはどういう……？"
"1600305-5-スズミ" = "あ、自警団のことならお気になさらず。"
"1600305-6-スズミ" = "年がら年中、趣味のようにやっているわけでもありませんから。"
"1600305-7-スズミ" = "ああいえ、決して誰かに無理やりやらされているわけではありません、れっきとした自分の意志です。"
"1600305-8-スズミ" = "ただ……楽しくて、好きでああいったことをしてるわけではない、という意味です。"
"1600305-9-スズミ" = "むしろ、いつかこんなことをしなくて良い街になってくれれば、それが一番ですし……。"
"1600305-10-スズミ" = "……優しい？私が、ですか？"
"1600305-11-スズミ" = "ご冗談を、私のことを見ると多くの人は「怖い」と言って避けるか、警戒してしまいます。"
"1600305-12-スズミ" = "普段はああいったことをしているので、仕方ないことなのですが。"
"1600305-13-スズミ" = "……でも、ありがとうございます。それでも、そう言っていただけるのは嬉しいです。"
"1600305-14-スズミ" = "行きましょう、先生。私が前を……いえ。"
"1600305-15-スズミ" = "……隣にいます、一緒に行きましょう。"
"1600305-16" = "[s] （スズミと一緒に歩き出す）"
"1600305-17-スズミ" = "……ここ、私のお気に入りのカフェなんです。少し休んでいきませんか？"
"1600305-18-スズミ" = "お気に入りといっても、いつもカフェラテしか頼まないのですが。でもすごく美味しくて……"
"1600305-19" = "ガシャーン！"
"1600305-20-店員" = "キャアッ！な、何なんですかあなたたちは！"
"1600305-21-スズミ" = "……！？"
"1600305-22" = "ははっ！見て分かるだろう、強盗が趣味の不良生徒だよ！"
"1600305-23-不良生徒B" = "今回こそ徹底的に事前調査をしたんだ！今日は自警団も活動が無い！"
"1600305-24-不良生徒A" = "つべこべ言わず、さっさとここにある現金を全部出しな！今すぐに！！"
"1600305-25" = "……はあ。"
"1600305-26-スズミ" = "懲りないですね、この街のチンピラは……その熱意を勉強なり部活なりに向ければ良いものを……。"
"1600305-27-スズミ" = "（ですが、今日の私は自警団ではなく、先生と……）"
"1600305-28-スズミ" = "……。"
"1600305-29-店員" = "や、やめてください！そこには今週の売上が……！"
"1600305-30-不良生徒B" = "ははっ、それはありがたいねえ！あたしらが豪勢に使ってあげるよ！"
"1600305-31-不良生徒A" = "無駄な抵抗はするなよ、病院代がかかって売り上げがマイナスになるのは嫌だろう！？ははははははっ！"
"1600305-32-スズミ" = "……。"
"1600305-33-スズミ" = "……ふう。"
"1600305-34-スズミ" = "先生……その……。"
"1600305-35-スズミ" = "……いえ。すみません、何でもありません……。"
"1600305-36" = "[s1] \"大丈夫、行ってきて。\"\n[s2] \"黙っていられないでしょ？\""
"1600305-37-スズミ" = "……！"
"1600305-38-スズミ" = "……！"
"1600305-39-スズミ" = "……はい、ありがとうございます。"
"1600305-40-スズミ" = "ちょっとだけ待っていてください、できるだけ手早く片付けますので。"
"1600305-41" = "……カチッ！"
"1600305-42-不良生徒B" = "ん？今、何かの音が……？"
"1600305-43-不良生徒B" = "そうだね、何の音だい？何となくデジャヴのような……。"
"1600305-44" = "閃光弾、投擲！！"
"1600305-45" = "バンッッ！！キイイイイィィィィィン――"
"1600305-46" = "（……その後は前と同じ光景になった。チンピラたちは閃光弾で気絶し、制圧され、）"
"1600305-47" = "（柱に縄で縛られたあと、爆音の『ベイビー』を耳元で聞かされていた）"
"1600305-48-スズミ" = "……戻りました、先生。すみません。思ったより時間がかかってしまいました。"
"1600305-49-スズミ" = "すみません、この後の予定に……。"
"1600305-50-スズミ" = "……はい、ありがとうございます。"
"1600305-51-スズミ" = "……それよりも、どうして毎回閃光弾なのか？"
"1600305-52-スズミ" = "……それは、"
"1600305-53-スズミ" = "誰も怪我をしない方法だからです。"
"1600305-54-スズミ" = "閃光弾は安全に相手の行動を封じ、制圧することができます。"
"1600305-55-スズミ" = "相手は往々にして悪いことをした人だとはいえ……だからといって怪我をさせることは望んでいません。"
"1600305-56-スズミ" = "怪我無く制圧が出来れば、それに越したことはありません。私はあくまで、自警団ですから。"
"1600305-57" = "[s] \"やっぱりスズミは優しいね。\""
"1600305-58-スズミ" = "ど、どうしてそれがそこに繋がるんですか……！"
"1600305-59-スズミ" = "と、とにかくもう行きましょう！"
"1600305-60-スズミ" = "さあ先生、こちらへ。"
"1600305-61" = "（しかしその後に立ち寄った場所でも次々に問題が起こり、その度にスズミは閃光弾を投擲した）"
"1600305-62" = "（最終的にその日投げた閃光弾の数は、二桁にも上る）"
"1600305-63-スズミ" = "……。"
"1600305-64-スズミ" = "……申し訳ありません、先生。"
"1600305-65-スズミ" = "結局今日一日、普通の自警団活動の様相とあまり変わりませんでした……。"
"1600305-66-スズミ" = "先生を私に付き合わせる形になってしまいました、申し訳ないです……。"
"1600305-67-スズミ" = "え、楽しかった……ですか？"
"1600305-68-スズミ" = "だから、また今度もぜひ……？"
"1600305-69-スズミ" = "……。"
"1600305-70-スズミ" = "はい、もちろん、私はいつでも大歓迎です。"
"1600305-71-スズミ" = "こんな私でよろしければ、喜んで。"
"1600305-72-スズミ" = "本当に、ありがとうございます。"
"1600305-73-スズミ" = "……すごく、楽しかったです。"
"1600305-74" = "（その後、スズミはゆっくりと反対方向へと帰っていった）"
"1600305-75" = "（その歩き方は以前と違って悠然としていて、どこか落ち着いていたように思う）"
