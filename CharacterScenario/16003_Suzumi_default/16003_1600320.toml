[translation]
"1600320-1" = "大切なパートナー"
"1600320-2" = "（到着したよ、とスズミにメッセージを送った）"
"1600320-3" = "（ほどなくして、遠くから近づいてくるスズミの姿が見えた）"
"1600320-4" = "はぁ……はぁ。も、申し訳ありません、先生。#nお待たせすることになってしまい……。"
"1600320-5" = "……あ。"
"1600320-6-スズミ" = "……し、失礼しました。"
"1600320-7" = "[s1] \"あれ、何かあった？\"\n[s2] \"ヘッドホンを外してどうしたの？\""
"1600320-8-スズミ" = "い、いえ、大したことでは……。"
"1600320-9-スズミ" = "……すみません、こちらを外しておりまして。"
"1600320-10-スズミ" = "その……。"
"1600320-11-スズミ" = "普段からパトロールの時に、よく使っているヘッドホン、なのですが……。"
"1600320-12-スズミ" = "急いでいたので、つけたまま来てしまって……。#nも、もちろん曲は停止していたのですが、ただ……。"
"1600320-13-スズミ" = "……いえ、何でもありません。私の話で足を止めてしまいましたね。#n先生のスケジュールを遅らせるわけにはいきませんので、急ぎご案内いたします。"
"1600320-14-スズミ" = "で、では、行きましょう……。"
"1600320-15-スズミ" = "…………。"
"1600320-16" = "[s3] \"スズミ、大丈夫……？\"\n[s4] \"どこか上の空だけど、何かあったの……？\""
"1600320-17-スズミ" = "は、はい！？あ、いえ……。"
"1600320-18-スズミ" = "うーん……。"
"1600320-19-スズミ" = "すみません。#nかえって気を遣わせてしまいましたね。"
"1600320-20-スズミ" = "その……先ほどのヘッドホンについてです。"
"1600320-21-スズミ" = "あれからずっと気がかりで……。"
"1600320-22-スズミ" = "なんだか、先生に変な印象を与えてしまったのではないかと……。"
"1600320-23" = "[s5] \"変な印象……？\"\n[s6] \"えっと……どういう意味？\""
"1600320-24-スズミ" = "その……自警団としてパトロールしているというのに、ヘッドホンをしながら、だなんて……。"
"1600320-25-スズミ" = "もちろん、音量は抑えていますし、いつもというわけではありません。#n基本的に聞くのは、パトロールの休憩中です。"
"1600320-26-スズミ" = "ただ……パトロールが長時間続くと、気分転換したくなりまして……。"
"1600320-27-スズミ" = "けして、自警団の活動をおろそかにしているわけではありません。"
"1600320-28-スズミ" = "ですが、そんな私の姿を先生が見て、変な印象を抱いていないか、と。#n不安に……なってしまって。"
"1600320-29-スズミ" = "……え？"
"1600320-30-スズミ" = "気にしてない、ですか？#nそ、それなら、良いのですが……。"
"1600320-31" = "[s7] \"本心からそう思ってるよ。\"\n[s8] \"だって、スズミが頑張ってることを知ってるからね。\"\n[s9] \"私が見てないところでも、ね。\""
"1600320-32-スズミ" = "それは……。"
"1600320-33-スズミ" = "…………。"
"1600320-34-スズミ" = "…………はい。"
"1600320-35-スズミ" = "ありがとうございます。#n私は先生に対しての印象を意識するばかりで、大切なことを忘れていたようです。"
"1600320-36-スズミ" = "パトロールは、自分の意志で始めたことなのに。"
"1600320-37-スズミ" = "普段ならこんなこと全然思わないのに、先生の前となると、どうにも自分のペースが崩れてしまうようで……。"
"1600320-38-スズミ" = "反省しないといけないですね。"
"1600320-39-スズミ" = "……ですが、そう言っていただいたおかげで、心が楽になりました。"
"1600320-40-スズミ" = "本当にありがとうございます、先生。"
"1600320-41-スズミ" = "……はい？"
"1600320-42-スズミ" = "ヘッドホンですか？#nいえ、何か改造してるわけではありません。"
"1600320-43-スズミ" = "お店で普通に売られている何の変哲もないものです。"
"1600320-44-スズミ" = "昔から使っているくらいでしょうか……？#nそこまで特別というわけでは。"
"1600320-45-スズミ" = "外に持ち歩くことも多いので、少し傷がありますね。"
"1600320-46-スズミ" = "パトロール中、ヘッドホンをした状態で交戦することもありましたが、運が良かったのか、壊れるようなことはありませんでした。"
"1600320-47-スズミ" = "もし壊れてしまったら、ですか？"
"1600320-48-スズミ" = "うーん……。#nたぶん、修理を依頼して使い続けると思います。"
"1600320-49" = "[s10] \"大切にしてるんだね。\"\n[s11] \"ヘッドホンもスズミにとってパートナーなんだね。\""
"1600320-50-スズミ" = "パートナー……"
"1600320-51-スズミ" = "そうですね……先生にそう言われると、なんとなくそう思えてきます。"
"1600320-52-スズミ" = "……ふふっ。"
"1600320-53-スズミ" = "先生と過ごしていると……何でもないようなお話も、とても楽しく感じます。"
"1600320-54-スズミ" = "……不思議な、気持ちです。"
"1600320-55-スズミ" = "ずっと、一人でパトロールをしていると思っていましたが、そうではなかったのですね。私のそばには、いつも銃やヘッドホンがいてくれました。"
"1600320-56" = "[s12] \"うん、それに私もいるよ。\"\n[s13] \"いつでも呼んでね。もちろん、パトロール以外でも。\""
"1600320-57-スズミ" = "……なっ。"
"1600320-58-スズミ" = "……う。"
"1600320-59-スズミ" = "その、えっと……。"
"1600320-60-スズミ" = "す、すみません。言葉が出てこなくて。"
"1600320-61-スズミ" = "お気持ちはありがたいのですが、#nそこまでしていただくわけにはいきません。"
"1600320-62-スズミ" = "先生がお忙しいのは、よく知っていますから。"
"1600320-63-スズミ" = "なので……。"
"1600320-64-スズミ" = "……うーん。"
"1600320-65-スズミ" = "……すみません、今のはなかったことにしても……いいでしょうか？"
"1600320-66-スズミ" = "先生には、いつも感謝しています。"
"1600320-67-スズミ" = "仕事でお忙しいなか、私のことまで……本当にありがとうございます。#n先生さえよろしければ、その、時々でいいので……。"
"1600320-68-スズミ" = "……お願い、できれば。"
"1600320-69-スズミ" = "……いえ。#nぜひお願いします、先生。"
