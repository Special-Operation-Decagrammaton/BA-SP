[translation]
"1600306-1" = "輝きを追いかけて"
"1600306-2" = "（スズミが教えてくれた場所は、トリニティにある閑散とした遊園地だった）"
"1600306-3" = "（既に夜遅い時間ということもあり、他にお客さんもいない状態で、乗り物だけが動き続けていた）"
"1600306-4-スズミ" = "あ、先生。こちらです。"
"1600306-5-スズミ" = "お忙しい中お越しいただきありがとうございます。それに、こんな遅い時間になってしまい……"
"1600306-6" = "[s1] \"ううん、気にしないで。\"\n[s2] \"ところで今日はどうしたの？\""
"1600306-7-スズミ" = "その、モモトークで書かせていただいた通り、特に大した用事ではないのですが……。"
"1600306-8-スズミ" = "その、モモトークで書かせていただいた通り、特に大した用事ではないのですが……。"
"1600306-9-スズミ" = "その……。"
"1600306-10" = "[s] \"……？\""
"1600306-11-スズミ" = "……星を。"
"1600306-12-スズミ" = "星を、お見せしたいなと。"
"1600306-13" = "[s3] \"……え？\"\n[s4] \"星……？\""
"1600306-14-スズミ" = "す、すみません、唐突だとは思ったのですが……。"
"1600306-15-スズミ" = "す、すみません、唐突だとは思ったのですが……。"
"1600306-16-スズミ" = "急な話で困ってしまいますよね。"
"1600306-17-スズミ" = "その、用事がありましたら今からでも全然……"
"1600306-18-スズミ" = "あ、そ、それは良かったです……"
"1600306-19-スズミ" = "理由、ですか？"
"1600306-20-スズミ" = "それも、大した理由ではないのですが……。"
"1600306-21-スズミ" = "ただ、先生にもお見せしたいなと思ったのです。"
"1600306-22-スズミ" = "この遊園地……"
"1600306-23-スズミ" = "ここは私が、毎日パトロールの終着点にしているところなのです。"
"1600306-24-スズミ" = "以前はスケバンの方々なども、よくいらっしゃったのですが……。"
"1600306-25-スズミ" = "最近は、他の場所に移られてしまったようですね。"
"1600306-26-スズミ" = "……こうして。"
"1600306-27-スズミ" = "手すりに寄りかかって、空を眺めるようになりました。"
"1600306-28-スズミ" = "そのうち、もっと高いところに行けばよく見えるだろうかと思い……。"
"1600306-29-スズミ" = "観覧車に乗ろうかと、そう思ったのですが。"
"1600306-30-スズミ" = "その……。"
"1600306-31-スズミ" = "やはり、ひとりで乗るよりは……などと、そういったことを想ってしまいまして。"
"1600306-32" = "[s] \"なるほど、それで誘ってくれたってこと？\""
"1600306-33-スズミ" = "言葉にすると、子どもっぽい理由でしたね……なんだかすみません。"
"1600306-34-スズミ" = "え、今すぐ……？"
"1600306-35-スズミ" = "あ、そ、そうですね……？"
"1600306-36-スズミ" = "いえ、何でもありません。"
"1600306-37-スズミ" = "失礼しました。行きましょうか、先生。"
"1600306-38-スズミ" = "では、こちらへ。"
"1600306-39" = "[s] スズミについて行く。"
"1600306-40" = "（そうやってスズミと並んで歩きながら観覧車の方に向かった）"
"1600306-41-スズミ" = "以前、お話していたことを思い出しました。"
"1600306-42-スズミ" = "もっとゆったりとした形で言葉を交わせれば良いのに、と。そんなことを言いましたが……。"
"1600306-43-スズミ" = "よく考えたら……"
"1600306-44-スズミ" = "すでに、叶っていますね。"
"1600306-45-スズミ" = "失礼しました、"
"1600306-46-スズミ" = "また急に変なことを。"
"1600306-47-スズミ" = "……では、行きましょうか。"
"1600306-48" = "[wa:1200]― ……綺麗ですね。"
"1600306-49" = "[wa:1200]― ここからなら、"
"1600306-50" = "[wa:500]― 星が[wa:200]掴めて[wa:200]しまいそうです。"
"1600306-51" = "[wa:1200]― ここ最近は[wa:1200]こうして[wa:300]ゆっくりと、"
"1600306-52" = "[wa:500]― 落ち着いた時間も[wa:500]過ごす[wa:300]ことができて……。"
"1600306-53" = "[wa:1200]― ……先生と[wa:900]出会った頃から、[wa:500]かもしれません。"
"1600306-54" = "[wa:2800]― ……先生。"
"1600306-55" = "[wa:1100]― よろしければ[wa:700]これからも、"
"1600306-56" = "[wa:900]― 一緒に[wa:600]居ていただけ[wa:300]ますでしょうか。"
"1600306-57" = "[wa:1300]― 私は[wa:200]いつも、"
"1600306-58" = "[wa:200]― つまらないことばかり[wa:1300]口にしてしまうかもしれませんが……。"
"1600306-59" = "[wa:1800]― それでも[wa:400]いつかは[wa:1900]私も……。"
"1600306-60" = "[wa:1300]― ……はい[wa:1600]いつか[wa:1500]きっと。"
"1600306-61-スズミ" = "きちんと、伝えられればと。"
