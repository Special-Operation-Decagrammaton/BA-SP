[translation]
"1300902-1" = "今日も頑張ってうとうと修行"
"1300902-2" = "（ツバキとの約束場所に着くと、片隅に人混みが見えた）"
"1300902-3" = "[ns] \"何かあったのかな？\""
"1300902-4" = "（近づいてみると、その人混みの真ん中に、立ったまま寝ているツバキがいた）"
"1300902-5-ツバキ" = "むにゃむにゃ……ぐぅ……。"
"1300902-6" = "（そんなツバキを見て、周囲がざわつき始めた）"
"1300902-7-通行人A" = "おい、見ろ。あの人はもしかして……。"
"1300902-8-通行人B" = "百鬼夜行の眠り姫だ！"
"1300902-9-通行人C" = "眠り姫って、まさか……。"
"1300902-10-通行人C" = "あの、寝ることに関しては誰も敵わないと言われる、眠りのプロの！？"
"1300902-11" = "[s1] \"眠り姫……？\"\n[s2] \"眠りのプロ……？\""
"1300902-12-通行人A" = "そう言えば私、この前見てしまったんだ。"
"1300902-13-通行人A" = "そう言えば私、この前見てしまったんだ。"
"1300902-14-通行人A" = "眠り姫がすやすや眠ったまま、ジクソーパズルをしているところを！"
"1300902-15" = "[s] \"ジクソーパズル……？\""
"1300902-16-通行人B" = "やれやれ、それぐらい驚くことじゃないよ。"
"1300902-17-通行人B" = "私なんか、眠り姫がうつらうつらと寝ぼけながら、トランプでタワーを作ってるところを見たんだから！"
"1300902-18" = "[s] \"トランプでタワー……？\""
"1300902-19-通行人C" = "ちっちっちっ、それくらい大したエピソードじゃないな！私が見た眠り姫なんて……！"
"1300902-20" = "（その後も、人々の熱い声は止まらなかった）"
"1300902-21" = "（知らなかったけれど、どうやらツバキは百鬼夜行の有名人のようだった）"
"1300902-22" = "[ns] \"えっと、とりあえず話しかけようか……。\""
"1300902-23-？？？" = "やっと見つけた！百鬼夜行の修行部の！！"
"1300902-24-百鬼夜行の問題児B" = "ここ、ここです姉御！"
"1300902-25-百鬼夜行の問題児A" = "道端で寝てる生徒がいると聞いて、もしかしてと思ったら……。"
"1300902-26-百鬼夜行の問題児A" = "やはりお前だったか、修行部の部長……！"
"1300902-27-ツバキ" = "ぐぅ……。"
"1300902-28-百鬼夜行の問題児A" = "まさか、私たちのことを忘れたとは言わせないぞ！"
"1300902-29-ツバキ" = "むにゃ……。"
"1300902-30-ツバキ" = "ぐぅ……。"
"1300902-31-百鬼夜行の問題児A" = "無視か！？"
"1300902-32-百鬼夜行の問題児A" = "姉御、こいつ生意気にも聞く耳持たないようですぜ！"
"1300902-33-百鬼夜行の問題児B" = "くうっ、もういい！"
"1300902-34-百鬼夜行の問題児B" = "この前は夜道で、社会への怒りを表現した私たちの芸術行為を、よくも邪魔してくれたな！"
"1300902-35-百鬼夜行の問題児A" = "まあぶっちゃけ落書きでしたけど。ね、姉御！"
"1300902-36-百鬼夜行の問題児B" = "う、うるさい！"
"1300902-37-百鬼夜行の問題児B" = "やつが眠ってる今がチャンスだ！やれ！"
"1300902-38" = "いやっほ～ぅ！！"
"1300902-39-通行人A" = "銃弾が眠り姫に……！"
"1300902-40-通行人B" = "あ、危ない！"
"1300902-41" = "[s] \"ツバキ……！？\""
"1300902-42-ツバキ" = "……ぐぅ。"
"1300902-43-百鬼夜行の問題児B" = "ぐっ、銃弾の雨の中でも眠りから覚めないとは！これを避けるぐらい大したことないということか！"
"1300902-44-百鬼夜行の問題児B" = "姉御、これじゃ足りません！もっとデカいやつを！"
"1300902-45-百鬼夜行の問題児A" = "よしっ、くらえ！手榴弾！"
"1300902-46" = "[ns] \"ツバキ！危ない……！ \""
"1300902-47-百鬼夜行の問題児B" = "はーっはっは！どうだ、やったか！？"
"1300902-48-百鬼夜行の問題児B" = "あっ、姉御……その台詞は……！"
"1300902-49-百鬼夜行の問題児A" = "こ、こいつ……！寝ながら私の攻撃を全部かわしただと！？"
"1300902-50-百鬼夜行の問題児B" = "き、聞いてた以上の怪物ですよ。姉御、どうしましょう？！"
"1300902-51-通行人A" = "す、すごい！"
"1300902-52-通行人B" = "これが百鬼夜行の眠り姫！"
"1300902-53-通行人C" = "見ろ、姫のあの勝ち誇った表情を！"
"1300902-54-ツバキ" = "ふぁあ、んん……ぐぅー……。"
"1300902-55-みんな" = "寝言で高らかに勝利を宣言しているぞ！"
"1300902-56" = "（なんだか色々とすごい光景だった）"
"1300902-57-百鬼夜行の問題児B" = "ちっ、こうなったら……！"
"1300902-58" = "[s] \"あの、ちょっといいかな？\""
"1300902-59-百鬼夜行の問題児B" = "あ、あなたは、シャーレの先生！？"
"1300902-60-百鬼夜行の問題児B" = "うわっ！？シャーレと絡むと面倒なことになりますよ姉御！"
"1300902-61-百鬼夜行の問題児A" = "くっ、し、仕方ない！戦略的撤退だ！"
"1300902-62" = "（声をかけるや否や、二人は逃げてしまった）"
"1300902-63" = "（……まあいいか）"
"1300902-64" = "[ns] \"ツバキ、大丈夫？\""
"1300902-65-通行人A" = "うん？ちょっと、どこのどなただか知らないが、そんな風に呼びかけたところで眠り姫が簡単に目を覚ますはずが……。"
"1300902-66-ツバキ" = "ふあぁ……ん？この、声……。"
"1300902-67-ツバキ" = "……あ、先生。"
"1300902-68-通行人B" = "あの騒ぎの中でも起きなかった眠り姫が！"
"1300902-69-通行人C" = "呼ばれてすぐに起きただと！？"
"1300902-70" = "[s] \"メッセージをくれたから来たんだけど……何してるの？\""
"1300902-71-ツバキ" = "んー？先生を待ちながら、ちょっと寝てただけだよ……？"
"1300902-72-ツバキ" = "そう言えば、今日は日差しもぽかぽかで……。"
"1300902-73-ツバキ" = "さっきまでなんだか、すごく楽しい夢を見てた気がする……。"
"1300902-74" = "[s] \"……そっかあ。\""
"1300902-75-ツバキ" = "風もこんなに気持ち良いし、寝るのに……ううん、修行するのにぴったりの天気だね。"
"1300902-76-ツバキ" = "先生も、そう思うでしょ……？ふあぅ……。"
"1300902-77" = "[s] \"そうかも……？\""
"1300902-78-ツバキ" = "それじゃあ先生、約束通り、私が修行のお手本を見せてあげる。"
"1300902-79-ツバキ" = "どこか適当な場所に……。"
"1300902-80" = "[s3] \"ううん、大丈夫。\"\n[s4] \"もう見せてもらったよ、すごかった。\""
"1300902-81-ツバキ" = "ん？もう見た……？"
"1300902-82-ツバキ" = "ん？もう見た……？"
"1300902-83-ツバキ" = "うーん……じゃあ、どうしよう。修行のやり方を見せてあげようと思って、先生を呼んだのに……。"
"1300902-84-ツバキ" = "困った……。"
"1300902-85" = "[s] \"それならせっかくだし、一緒にお昼でも食べよう。\""
"1300902-86-ツバキ" = "お昼……？"
"1300902-87-ツバキ" = "ふふっ。起きてすぐに先生に会えて、そのままお昼だなんて。"
"1300902-88-ツバキ" = "まるで幸せな夢でも見てるみたい。"
"1300902-89-ツバキ" = "うん、そうだね。じゃあ、先生、そしたら……。"
"1300902-90-ツバキ" = "……ぐぅ。"
"1300902-91" = "[s] \"……いやいやツバキ、また寝ちゃダメだって、ツバキ！？\""
"1300902-92" = "（その後ツバキとお昼を食べるために場所を移した）"
"1300902-93" = "（お昼を食べてる間も、しょっちゅうツバキは修行（？）していた）"
