[translation]
"1012705-1" = "……ダメ、ですか？"
"1012705-2" = "（ミヨと約束した場所へ向かった）"
"1012705-3" = "アンティークショップ商店街"
"1012705-4" = "[ns] \"お待ちしておりました。\""
"1012705-5-ミヨ" = "な、なんですか、それ。"
"1012705-6-ミヨ" = "今日の先生はちょっと変では……？"
"1012705-7" = "[s] \"ミヨは犯罪小説の女王様だから……。\""
"1012705-8-ミヨ" = "か、書きません、そんなの……！"
"1012705-9-ミヨ" = "筆が乗りそうでは……ありますが！"
"1012705-10" = "[s] \"ところで今日はどうしたの？\""
"1012705-11-ミヨ" = "あ、このアンティークショップ街で手に入れないといけないものがありまして。"
"1012705-12-ミヨ" = "二人で探したほうが見つけやすいかなと……。"
"1012705-13" = "[s1] \"特殊交易部の部長も……。\"\n[s2] \"自分で現場に行くんだね。\""
"1012705-14-ミヨ" = "……こ、今回だけです！#nこれで足を洗いますから。"
"1012705-15" = "[s] \"さすがだね！\""
"1012705-16-ミヨ" = "うぅぅ……！"
"1012705-17-ミヨ" = "か、からかわないでください！"
"1012705-18" = "[s3] \"そういえば……。\"\n[s4] \"今日も外出許可がとれたんだね？\""
"1012705-19-ミヨ" = "あ……。"
"1012705-20-ミヨ" = "今回はですね……。"
"1012705-21-ミヨ" = "……許可をとっていません。"
"1012705-22" = "[s] \"……え？\""
"1012705-23-ミヨ" = "じ、実は、ワイルドハントには「自由外出部」という部活がありまして。"
"1012705-24-ミヨ" = "今日はそちらの部員さんに手伝ってもらいました。"
"1012705-25" = "[s] \"ワイルドハント……奥が深い。\""
"1012705-26-ミヨ" = "まあ……芸術で食べていきたい方々が集まる場所ですから……。"
"1012705-27-ミヨ" = "その分、クセの強い生徒が多いといいますか……。"
"1012705-28" = "[s] \"み、ミヨもそこの生徒じゃ――\""
"1012705-29-ミヨ" = "では、行きましょうか。"
"1012705-30" = "[s] \"無視された！？\""
"1012705-31-ミヨ" = "見てください！このタイプライター！#nミルキースイートのモデル42ですよ！"
"1012705-32" = "[s] \"かわいいデザインだね。\""
"1012705-33-ミヨ" = "ええ。でも、市場では売れず廃番となったモデルなんです。"
"1012705-34" = "[s] \"どうして売れなかったの？\""
"1012705-35-ミヨ" = "人間工学に基づいた設計をし、#n自社で考案したキー配列を導入したのですが――"
"1012705-36-ミヨ" = "既存の配列とまったく違ったことで、手に取る方がおらず――"
"1012705-37-ミヨ" = "初回出荷の100万台のみで、生産終了となってしまいました。"
"1012705-38" = "[s5] \"100万台って……。\"\n[s6] \"どれだけ自信あったの……。\""
"1012705-39-ミヨ" = "でも、そのおかげで私もこうして一台手に入れることができましたから。"
"1012705-40-ミヨ" = "あっ、これは……！#n先生、デミントン社のタイプライターと万年筆ですよ！"
"1012705-41" = "（一緒にアンティークショップを巡っていると……）"
"1012705-42" = "（ある店の前でミヨが立ち止まった）"
"1012705-43-ミヨ" = "少しお待ちください、先生！"
"1012705-44" = "（なにかの包みを抱えて、ミヨが店から出てきた）"
"1012705-45-ミヨ" = "さあ、行きましょう！"
"1012705-46" = "[s] \"ミヨ、その包みは？\""
"1012705-47-ミヨ" = "自由外出部に渡すものです。"
"1012705-48" = "[s] \"自由外出部？\""
"1012705-49-ミヨ" = "ええ。これを確保するという条件で、外出を手伝ってもらったので――"
"1012705-50-ミヨ" = "……あ。"
"1012705-51" = "[s7] \"つまり、密輸のために外出したんじゃなくて……。\"\n[s8] \"ただお出かけがしたかったんだね。\""
"1012705-52-ミヨ" = "え、あ、そ、その……。"
"1012705-53-ミヨ" = "……いけなかったでしょうか？"
"1012705-54" = "[s9] \"ううん。\"\n[s10] \"なんか外に出たい日ってあるよね。\""
"1012705-55-ミヨ" = "先生と会いたかったから……じゃ、ダメですか？"
"1012705-56" = "[ns] \"えっ。\""
"1012705-57" = "[ns] \"私！？\""
"1012705-58-ミヨ" = "せ、先生だって、私に会いたいとおっしゃっていましたよね？"
"1012705-59-ミヨ" = "モモトークのこと、忘れてませんから！"
"1012705-60" = "[s] \"た、たしかにそう送ったけど……！\""
"1012705-61-ミヨ" = "い、いいですか？#nこれは先生が悪いんです！"
"1012705-62-ミヨ" = "で、ですから、今日は大人しく私に、つ……付き合ってください！"
"1012705-63-ミヨ" = "まだ見てみたいタイプライター……いっぱい……あるんです……。"
"1012705-64" = "（その後も、ミヨと一緒に商店街を見て回った）"
