"2001506-83" = "[s] \"……そうだね。\""
"2001506-84-女の子" = "ううっ……。"
"2001506-85-カエデ" = "そこの君、泣かないで！"
"2001506-86-女の子" = "えっ……"
"2001506-87-カエデ" = "はい、これ！今日発売の新パックだよ！"
"2001506-88-女の子" = "おねえちゃん……？これ、くれるの……？"
"2001506-89" = "[s] \"カエデ、大丈夫？\""
"2001506-90-カエデ" = "うん！！遠くから、頑張ってきたんだし……。"
"2001506-91-カエデ" = "それに『ムシクイーン』でもね、そういう話があったの。"
"2001506-92-カエデ" = "どんなに難しいバトルだったとしても……最後まで努力した分は報われる。報われて良いんだ、って！"
"2001506-93-女の子" = "あ、知ってる！『ムシクイーン』139話！"
"2001506-94-カエデ" = "そうそう！だから、はい！"
"2001506-95-女の子" = "……あ、ありがとう！おねえちゃん！"
"2001506-96" = "[ns] \"カエデ。\""
"2001506-97-カエデ" = "先生。さっきの私、素敵なレディーだったと思わない？"
"2001506-98" = "[s] \"それはもう。\""
"2001506-99-カエデ" = "…………うん、なら良かった！"
"2001506-100-カエデ" = "ああっ、お二方！ここにいらっしゃったんですね……！"
"2001506-101-カエデ" = "あれ、確かさっき会ったコンタクトレンズの……？"
"2001506-102-通行人A" = "申し遅れました、こういう者です。"
