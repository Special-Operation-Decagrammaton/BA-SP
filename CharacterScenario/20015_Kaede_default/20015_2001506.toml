"2001506-155" = "― 「ドリルホーンのウサギ・究極体」の[wa:2000]ドリルインパクトー！！"
"2001506-156" = "― にひひっ！"
"2001506-157-カエデ" = "やった、私の勝ち！カエデの不敗神話はまだまだ続く！"
"2001506-158-カエデ" = "どう、先生？私強くない？最強じゃない？"
"2001506-159-カエデ" = "もしかして私、強くなり過ぎたかも……ふふっ。"
