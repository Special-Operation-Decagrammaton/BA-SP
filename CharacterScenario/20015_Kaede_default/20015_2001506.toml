[translation]
"2001506-1" = "そして少女は素敵なレディーに"
"2001506-2-カエデ" = "あ、先生！こっちこっち！"
"2001506-3" = "[s1] \"えっと、とりあえず急いできたものの……。\"\n[s2] \"……非常事態？\""
"2001506-4-カエデ" = "先生、驚かないで聞いてね？"
"2001506-5-カエデ" = "先生、驚かないで聞いてね？"
"2001506-6-カエデ" = "私が極秘裏に入手した情報によると、今日の午後3時から大型スーパー・ぽんぽこで……。"
"2001506-7" = "[s] \"スーパーで……？\""
"2001506-8-カエデ" = "『ムシクイーン』の、新しいパックが限定販売されるらしいの！"
"2001506-9" = "[s] \"……？\""
"2001506-10-カエデ" = "この日のために、ちゃんと貯金してきたの！このチャンスを逃すわけにはいかない！"
"2001506-11" = "[s] \"なるほど、非常事態……？\""
"2001506-12-カエデ" = "非常事態でしょ！？"
"2001506-13-カエデ" = "新しいパックが出ることによって、『ムシクイーン』の環境がどれだけ激変すると思ってるの！？"
"2001506-14" = "[s] \"なるほどぉ……？\""
"2001506-15-カエデ" = "というわけで助けて、先生！"
"2001506-16-カエデ" = "多分壮絶な奪い合いになってるだろうから、私ひとりじゃ怖いし……"
"2001506-17-カエデ" = "お願い！"
"2001506-18-カエデ" = "先生も、『ムシクイーン』を目指す熱い魂が燃え上がってるでしょ！？いつか決勝戦で、私と運命のバトルして友情を再確認するんでしょ！？"
"2001506-19" = "[s3] \"それは知らない展開だけど！？\"\n[s4] \"まあ買い物自体は、もちろん行くけども。\""
"2001506-20-カエデ" = "ありがと、先生！"
"2001506-21-カエデ" = "ありがと、先生！"
"2001506-22-カエデ" = "さあ今ここに、"
"2001506-23-カエデ" = "最強コンビが結成された！"
"2001506-24-カエデ" = "これでいつかラスボスと対峙したとしても……"
"2001506-25-カエデ" = "先生が犠牲になって、私が覚醒するイベントが発生するね！"
"2001506-26" = "[s] \"犠牲かぁ……。\""
"2001506-27-カエデ" = "とにかく行こう、先生！"
"2001506-28" = "（そうしてカエデに手を引かれ、大型スーパー・ぽんぽこへと向かった）"
"2001506-29-カエデ" = "早く早く、のんびりしてたら売り切れちゃうよ！"
"2001506-30-通行人A" = "ああっ、困りました……。"
"2001506-31-カエデ" = "ん？"
"2001506-32-通行人A" = "なんてことでしょう、こんなタイミングで落としてしまうだなんて……。"
"2001506-33-カエデ" = "……。"
"2001506-34" = "[s] \"カエデ？どうしたの？\""
"2001506-35-カエデ" = "何か困ってそうな気配……。"
"2001506-36-通行人A" = "あのっ！"
"2001506-37-通行人A" = "えっと、お嬢さん？何かご用で……？"
"2001506-38-カエデ" = "私は修行部のカエデ！もしかして何か、困ってたりしない？"
"2001506-39-通行人A" = "あ、実はその、コンタクトレンズを落としてしまい……それを探していたのです。"
"2001506-40" = "[s] \"それは大変だ。\""
"2001506-41-通行人A" = "な、何だか説明してしまいましたが、お気になさらず。どこかへ向かう途中なのでしょう？わざわざお手を煩わせるわけには……。"
"2001506-42-カエデ" = "そ、それはそうだけど、『ムシクイーン』は大事だけど……！"
"2001506-43-通行人A" = "ムシクイーン……？"
"2001506-44-カエデ" = "えっと、それでも……！"
"2001506-45" = "[s] \"素敵なレディーとして、困ってる人を見捨てられない？\""
"2001506-46-カエデ" = "うん！そういうわけで、手伝うよ！"
"2001506-47-通行人A" = "あっ、ありがとうございます……！"
"2001506-48" = "（その後）"
"2001506-49-カエデ" = "助かりました！まさかカラスのせいであんなところにあったとは……。"
"2001506-50" = "[s] \"見つかって良かったです、もう使えないかもしれませんが……。\""
"2001506-51-カエデ" = "とにかく見つかって良かった！"
"2001506-52-通行人A" = "何とお礼を言えば良いのか……ああ、よろしければ私の名刺を……。"
"2001506-53-カエデ" = "あっ、そういえば忘れてた！"
"2001506-54-カエデ" = "急ごう、先生！じゃあね、またカラスに取られちゃダメだよー！"
"2001506-55" = "[s] \"あ、待って……！えっと、失礼します！\""
"2001506-56-通行人A" = "あぁっ……！"
"2001506-57" = "（そうしてカエデと共に走り出したものの……）"
"2001506-58-通りすがりの女子生徒１" = "あ、私のポピーちゃんが……！"
"2001506-59-カエデ" = "捕まえたー！！"
"2001506-60-通りすがりの女子生徒１" = "ありがとうございます、助かりました！"
"2001506-61-カエデ" = "ふふん！まあこれくらい、ムシクイーンバトラーの私と先生にかかれば朝飯前だよ！"
"2001506-62-人質" = "ああ、時限爆弾のカウントが……！ヴァルキューレの生徒がまだ来ていないのに、いったいどちらの線を切れば……！？"
"2001506-63-カエデ" = "えぇいっ！"
"2001506-64-カエデ" = "とりあえず赤！"
"2001506-65-カフェのオーナー" = "今日新発売の飲み物、売れるでしょうか……。"
"2001506-66-カエデ" = "すっごい美味しい！大丈夫！"
"2001506-67-ドーナツ屋の店長" = "この新作のドーナッツ、果たして受け入れてもらえるものか……。"
"2001506-68-カエデ" = "うん、モチモチしてて良い感じ！"
"2001506-69" = "（そうやって、幾つもの苦難を乗り越え……）"
"2001506-70-カエデ" = "はぁ、はぁ……ようやく着いた……。"
"2001506-71" = "[s] \"本当に「ようやく」だね……。\""
"2001506-72-カエデ" = "でも、もう新しいパックは目の前！"
"2001506-73-カエデ" = "すみません、ムシクイーンの新しいのください！"
"2001506-74-カエデ" = "おや、運が良いですね。最後のひとつですよ、はいどうぞ。"
"2001506-75-カエデ" = "わあ……！すごいすごい！もうパックそのものがキラキラしてるよ！"
"2001506-76" = "[s] \"うん、カエデが嬉しそうで良かった。\""
"2001506-77-店員" = "あっ、こうしてる場合じゃない！中にはレアカードが1枚は入ってるらしいし、早く帰ってデッキを"
"2001506-78-女の子" = "え、売り切れ……！？"
"2001506-79-カエデ" = "……ん？"
"2001506-80-カエデ" = "申し訳ありません、ちょうど在庫が無くなってしまいまして……。"
"2001506-81-女の子" = "うぅ……朝早く起きて、電車に4時間乗ってきたのに……売り切れなんて……。"
