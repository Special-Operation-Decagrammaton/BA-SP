"2001506-114-通行人A" = "ああ、もちろんタダでとは言いません。まずはこちらをどうぞ。"
"2001506-115-通行人A" = "今は手元にこれくらいしか無いのですが、新パックです。まずはこれを20パック差し上げます！"
"2001506-116-カエデ" = "えぇぇっ！？ど、どうしよう先生！？"
"2001506-117-通行人A" = "お、お気に召しませんでしたでしょうか……？もちろん別のお礼も……。"
"2001506-118-カエデ" = "や、そんなことはないんだけど、でも……！"
"2001506-119-カエデ" = "ど、どうしよう……？"
"2001506-120" = "[s5] \"これくらいは報われても良いんじゃないかな。\"\n[s6] \"カエデがさっき言ってた通りだよ。\""
"2001506-121-カエデ" = "あっ……。"
"2001506-122-カエデ" = "あっ……。"
"2001506-123-カエデ" = "「最後まで努力した分は報われる。報われて良いんだ」……。"
"2001506-124-カエデ" = "……うん！"
"2001506-125-カエデ" = "じゃあ、素敵なレディーとして……ありがたく貰うね！"
"2001506-126-通行人A" = "はい、是非！"
"2001506-127-通行人A" = "よし、じゃあ帰って早速バトルしよ、先生！"
"2001506-128-カエデ" = "手加減とかしないからね！"
"2001506-129" = "[s] \"うん、そうだね。\""
"2001506-130" = "（そうして部室に戻り、カエデと一緒にムシクイーンのバトルを始めた）"
"2001506-131-カエデ" = "じゃあまずは私のターン！サイコロを投げて……。"
"2001506-132-カエデ" = "数字は……6！じゃあカードを引くね！"
"2001506-133-カエデ" = "おお、「ドリルホーンのウサギ・究極体」！急にエースが来てくれた！"
"2001506-134-カエデ" = "カードの魂が、私の魂に応えてくれたんだね！"
"2001506-135" = "[s] \"な、なるほど……？\""
"2001506-136-カエデ" = "じゃあまずは、「ドリルホーンのウサギ・究極体」を召喚するためのダンスを開始！"
"2001506-137-カエデ" = "ふんふふん～♪ふふんふん～♪よし、この踊りによって「ドリルホーンのウサギ・究極体」を特殊召喚！"
"2001506-138-カエデ" = "そして「ドリルホーンのウサギ・究極体」の能力を発動！この子の可愛さに加えて、私もすっごく可愛いから……！"
"2001506-139-カエデ" = "「ドリルホーンのウサギ・究極体」の攻撃力は、なんと10倍に！"
"2001506-140" = "[s] \"バランスが心配になる数値……！\""
"2001506-141-カエデ" = "私のターンはまだまだ続くよ！"
"2001506-142-カエデ" = "さあ、覚悟……"
"2001506-143" = "[wa:1200]― ……ふふっ。"
"2001506-144" = "― なんだか今日は、[wa:1500]色んな事があったなー。"
"2001506-145" = "[wa:800]― 色々バタバタの[wa:900]一日だったけど……。"
"2001506-146" = "― 先生のおかげで、[wa:1300]また一歩立派なレディーに[wa:1200]近付けたかも！？"
"2001506-147" = "[wa:900]― ありがとね、[wa:700]先生！"
"2001506-148" = "― いつも私のこと、[wa:1100]手伝ってくれて！"
