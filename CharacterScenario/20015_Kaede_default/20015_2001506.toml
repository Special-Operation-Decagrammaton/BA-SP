"2001506-104-カエデ" = "……えっ！？『ムシクイーン』の人！？"
"2001506-105-通行人A" = "ここに来る途中、何度もお二人に助けられたという方たちに会いました。"
"2001506-106-通行人A" = "急いでここに来ようとしてくれたのでしょう……そしてそれにも関わらず、困ってる人を見たら助けるというその精神……。"
"2001506-107-通行人A" = "まさに『ムシクイーンバトラー』としての精神そのものです！"
"2001506-108" = "[s] \"そ、そうだったんですね。\""
"2001506-109-カエデ" = "そうだよ、ムシクイーンバトラーはある意味、素敵なレディーと一緒！"
"2001506-110-通行人A" = "はい、真のムシクイーンバトラーにして素敵なレディー……そんな姿を見せていただきました！そして良いアイディアも思いついたのです！"
"2001506-111-カエデ" = "……？"
