[translation]
"2001503-1" = "素敵なレディーになりたい！"
"2001503-2" = "（カエデに呼ばれて、修行部の部室を訪れた）"
"2001503-3-カエデ" = "あっ、先生！"
"2001503-4" = "[s] \"「世紀の大発見」を聞きに来たよ。\""
"2001503-5-カエデ" = "えっと、まずはね、私こう見えても「素敵なレディー」になるために、毎日鍛錬を重ねてるでしょ？"
"2001503-6-カエデ" = "この前なんか、刻んだピーマンが入ったカレーを残さず食べたんだから！"
"2001503-7" = "[s] \"それは偉い！\""
"2001503-8-カエデ" = "えへへっ！それでね、他にも何かできることはないかなって思って。"
"2001503-9-カエデ" = "ふとインターネットで検索してみたの。"
"2001503-10" = "[s1] \"なるほど。\"\n[s2] \"現代っ子だ。\""
"2001503-11-カエデ" = "そんなに褒めなくても～。まあとにかく、検索をしたの！ズババっと！"
"2001503-12-カエデ" = "そんなに褒めなくても～。まあとにかく、検索をしたの！ズババっと！"
"2001503-13-カエデ" = "そしたら「素敵なレディーとは、どんな状況でも慌てずに余裕を持っているもの」なんだって！"
"2001503-14" = "[s] \"なるほど……？\""
"2001503-15-カエデ" = "でも私その辺については、もう既に自信があるんだ！"
"2001503-16-カエデ" = "どんな状況になっても慌てないよ、なんたって修行部のマスコットだからね！"
"2001503-17-カエデ" = "それで気づいたの、もしかして私……いつの間に……！？"
"2001503-18" = "[s] \"なるほど、それが世紀の大発見……。\""
"2001503-19-カエデ" = "そう、私はもう「素敵なレディー」だったのかもしれない！！"
"2001503-20" = "[s] \"筋は通ってなくもない、気がする。\""
"2001503-21-カエデ" = "でもやっぱり、それを私だけじゃ証明できないでしょ？"
"2001503-22-カエデ" = "だからこそ、今日は先生を呼んだの！"
"2001503-23-カエデ" = "というわけで先生、私を慌てさせてみて！どんな状況でも慌てないってこと、証明してみせるんだから！"
"2001503-24-カエデ" = "さあ、先生と私の一対一の勝負だよ！"
"2001503-25" = "[s3] \"勝負……？\"\n[s4] \"まあとにかく、了解。\""
"2001503-26-カエデ" = "よし、じゃあスタート！"
"2001503-27-カエデ" = "よし、じゃあスタート！"
"2001503-28" = "（そうして、カエデを慌てさせる勝負（？）が始まった）"
"2001503-29-カエデ" = "よし、どっからでもかかってきて良いよ！"
"2001503-30" = "[s] \"今日実は、ショートケーキのお土産を持ってきたんだけど。\""
"2001503-31-カエデ" = "ほ、ほんとに！？"
"2001503-32" = "[s] \"ケーキの上のイチゴ、私が貰っても良い？\""
"2001503-33-カエデ" = "ぐっ、い、イチゴを……！ショートケーキで一番大事な部分と言っても過言じゃないイチゴを……！？"
"2001503-34" = "[s5] \"冗談だよ、ケーキはここに置いておくね。\"\n[s6] \"もしかして今、慌ててたような……？\""
"2001503-35-カエデ" = "……はっ！？ち、違う違う！今のはノーカンっていうか、その……"
"2001503-36-カエデ" = "……はっ！？ち、違う違う！今のはノーカンっていうか、その……"
"2001503-37-カエデ" = "そ、そう！先生がイチゴばっかり食べたら体調を崩すんじゃないかなって、心配しただけ！"
"2001503-38-カエデ" = "ぜ、全然あわ、慌ててたりはしないから！"
"2001503-39-カエデ" = "さあ、次々！"
"2001503-40" = "（その後もカエデとの、火花を散らす熾烈な心理戦（？）は続いた）"
"2001503-41" = "[ns] \"カエデ、冷蔵庫に残ってるプリンなんだけど。\""
"2001503-42-カエデ" = "え、「スイートキャラメルプリン」の話！？"
"2001503-43-カエデ" = "ま、まさかそれを……！？"
"2001503-44-カエデ" = "でも、先生がどうしても食べたいって言うなら、ぐうぅっ……！！"
"2001503-45" = "[s] \"いや、えっと……。\""
"2001503-46" = "[ns] \"カエデ、この宝物がたくさん入ってる箱ってカエデの物？\""
"2001503-47-カエデ" = "ああっ！！先生、それは気を付けて扱ってね！すっごく大事なものが入ってるから！"
"2001503-48-カエデ" = "この間レッサー川沿いで見つけた、つるつるした綺麗な石も入ってるから！"
"2001503-49-カエデ" = "あ、せっかくだし見てみる？すっごいよー、もう今まで見たことないような――"
"2001503-50" = "[ns] \"……というわけで、色々やってきたけれど。\""
"2001503-51-カエデ" = "ふ、ふふっ……先生はすごいね、色々と……。"
"2001503-52-カエデ" = "危うくこの私も、慌てるところだったよ！まあ、ギリギリのところで慌ててないけどね！"
"2001503-53" = "[s] \"そ、そっか……。\""
"2001503-54-カエデ" = "とにかくこれで、「素敵なレディーはいつも慌てないもの」……"
"2001503-55-カエデ" = "それが私にも適用されてることが、ついに実証されたと言っても過言じゃないかも……！"
"2001503-56-カエデ" = "ってあぁっ！？"
"2001503-57" = "[s] \"どうしたの？\""
"2001503-58-カエデ" = "今日「仮面ドライバー」シリーズの特別生放送があるの、忘れてた！！"
"2001503-59-カエデ" = "あれ、リモコンは……あった！"
"2001503-60-CM" = "画面の前にいるみんなへ、お知らせだ！"
"2001503-61-CM" = "「世の中に道路がある限り、仮面ドライバーは運転し続ける！」"
"2001503-62-CM" = "今年で15周年を迎える「仮面ドライバー」、遂に新シリーズ開始！同時に、ヒーローショーも開催予定だ！実際に「仮面ドライバー」と会えるチャンス、お見逃しなく！"
"2001503-63-カエデ" = "っ！！"
"2001503-64-カエデ" = "う……"
"2001503-65" = "[s] \"……カエデ？\""
"2001503-66-カエデ" = "うわああああっ！！？！？"
"2001503-67-カエデ" = "せ、先生！「仮面ドライバー」のヒーローショーだって！仮面ドライバーに直接会えるんだって！！"
"2001503-68-カエデ" = "は、早く予約しないと！？"
"2001503-69-カエデ" = "ってああぁっ！？"
"2001503-70-カエデ" = "先生、予約サイトが全然繋がらない！どうしよう！？"
"2001503-71" = "[s] \"えっと、ちょっと貸してくれる？\""
"2001503-72-カエデ" = "ありがとう先生！お願い！好き！！"
"2001503-73" = "[ns] \"道は遠いかもしれないな……。\""
"2001503-74-カエデ" = "……？"
