[translation]
"1006102-1" = "誤解されやすい人"
"1006102-2" = "（モモトークの内容が気になったので、空き時間に大聖堂を訪れた）"
"1006102-3" = "（比較的空いている時間帯だからか人影はなく、祈りを捧げるサクラコが遠くに見える）"
"1006102-4-サクラコ" = "……。"
"1006102-5" = "[s1] 近くで祈りを終えるのを待つ。\n[s2] 隣で一緒に祈りを捧げる。"
"1006102-6-サクラコ" = "……"
"1006102-7-サクラコ" = "……？"
"1006102-8-サクラコ" = "……っ！？#n先生、いつからこちらに……！"
"1006102-9" = "[s3] \"邪魔しちゃってごめんね。\"\n[s4] \"驚かせるつもりはなかったんだけど……\""
"1006102-10-サクラコ" = "……い、いえ大丈夫です。ちょうど祈りを終えたところです。"
"1006102-11-サクラコ" = "……い、いえ大丈夫です。ちょうど祈りを終えたところです。"
"1006102-12-サクラコ" = "それより、どうかされましたか？"
"1006102-13-サクラコ" = "この時間は、特に催し物などは――"
"1006102-14-サクラコ" = "――え？"
"1006102-15-サクラコ" = "私に呼ばれたから……？"
"1006102-16-サクラコ" = "えっと、その……あまり心当たりが……"
"1006102-17-サクラコ" = "モモトーク……？"
"1006102-18" = "[ns5] \"お話する機会が欲しいと言ってたから……\"\n[ns6] モモトークを見せる。"
"1006102-19-サクラコ" = "あっ……なるほど……"
"1006102-20-サクラコ" = "これは……"
"1006102-21-サクラコ" = "その、何と言いますか……"
"1006102-22-サクラコ" = "本当に、深い意味はなくて……ただの挨拶のつもりだったのです。"
"1006102-23-サクラコ" = "……本当なんです。"
"1006102-24-サクラコ" = "……はぁ。"
"1006102-25-サクラコ" = "また、誤解を招いてしまったかもしれません……#n申し訳ありません、先生。"
"1006102-26" = "[s7] \"大丈夫、気にしないで。\"\n[s8] \"「また」って……？\""
"1006102-27-サクラコ" = "その……実は、周囲の方に誤解されてしまう事が多くて……。"
"1006102-28-サクラコ" = "その、私のことを気難しい性格だと思っている節があるといいますか……。"
"1006102-29-サクラコ" = "やはり……シスター全体を管理する立場ですから、#n距離を感じてしまうのでしょうか。"
"1006102-30-サクラコ" = "改善しようと、アドバイスも頂いたりもするのですが、うまくいかず……"
"1006102-31-サクラコ" = "あ、もちろん、皆様心優しい方ばかりですので、私のこういった一面も理解しようとしてくださります。#n進んでアドバイスも下さるくらいに。"
"1006102-32-サクラコ" = "今回先生にお送りしたモモトークも、他のシスターからいただいたアドバイスを取り入れてみたりもして……。"
"1006102-33-サクラコ" = "「メッセージの前後に笑いを入れると親しみを感じやすい」と聞いたので……。"
"1006102-34" = "[s9] \"なるほど……\"\n[s10] \"それで「うふふ」と……。\""
"1006102-35-サクラコ" = "少し……心配なのです。#n個人の問題ならいいのですが、私はトリニティ大聖堂のシスターですので。"
"1006102-36-サクラコ" = "人々の悩みを聞くシスターとして、#n相手に気を遣わせてしまうのはあまり望ましくありません。"
"1006102-37-サクラコ" = "先生とお話をしたいとお伝えしたのも、実はこのことをご相談したかったのです。"
"1006102-38-サクラコ" = "すみません、話が長くなってしまいましたね。#n詳しい内容はまた後日……"
"1006102-39-サクラコ" = "ご心配をおかけして申し訳ありません。#nもしよろしければ、お見送りさせてください。"
"1006102-40-サクラコ" = "どうぞこちらへ。"
"1006102-41" = "トリニティ大聖堂前の公園"
"1006102-42-サクラコ" = "では、私はこれにて……"
"1006102-43-サクラコ" = "本日は、短い時間でしたがお話ができて嬉しかったです。"
"1006102-44-サクラコ" = "……ふふっ。"
"1006102-45-サクラコ" = "ではお足元にお気をつけて――"
"1006102-46-シスターフッドの生徒B" = "あっ、シスターサクラコ様！"
"1006102-47-シスターフッドの生徒B" = "ごきげんよう。今日もいい天気ですね。"
"1006102-48-サクラコ" = "あら、シスターの皆様。"
"1006102-49-サクラコ" = "いいお天気ですね、ふふっ……"
"1006102-50-サクラコ" = "今日も皆様の一日が、平和でありますよう。"
"1006102-51-サクラコ" = "いつも、皆様を陰ながら見守っておりますよ……。"
"1006102-52-サクラコ" = "それでは、よい一日を。うふふっ。"
"1006102-53-シスターフッドの生徒B" = "ひ、ヒッ……！は、はい……！"
"1006102-54-シスターフッドの生徒B" = "今日も良い一日を……！#nわ、私たちはこれで――！"
"1006102-55-サクラコ" = "あら、そんなに慌てると怪我をしてしまいます……。"
"1006102-56" = "[ns11] \"そこで「笑う」と……\"\n[ns12] \"なるほど……これは……。\""
"1006102-57-サクラコ" = "……？#nどうされました？"
"1006102-58-サクラコ" = "なんでもない、ですか？"
"1006102-59-サクラコ" = "それなら良いのですが……。"
"1006102-60-サクラコ" = "では、これにて失礼致します。"
"1006102-61" = "（ベールを風になびかせて去っていくサクラコを見届けて、シャーレに帰った）"
