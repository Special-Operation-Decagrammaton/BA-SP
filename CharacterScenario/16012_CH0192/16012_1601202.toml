[translation]
"1601202-1" = "新年を新たな装いで！"
"1601202-2" = "洋菓子店「ルワゾー・ブッレ」"
"1601202-3" = "（ジュンコに呼ばれて「ルワゾー・ブッレ」を訪れた）"
"1601202-4-ジュンコ" = "いらっしゃいませ、「ルワゾー・ブッレ」です！"
"1601202-5-ジュンコ" = "あっ、先生！来てくれたんだ！早速だけど、どう、どう？"
"1601202-6" = "[s] \"「どう？」っていうのは、つまり……。\""
"1601202-7" = "そう、この着物のこと！"
"1601202-8-ジュンコ" = "新年ってことで特別に、着物姿で働くことになったの！"
"1601202-9-ジュンコ" = "別に強制じゃないから、着なくても良いんだけどね。"
"1601202-10" = "[s] \"たしかに、言われてみれば店中が……。\""
"1601202-11-ジュンコ" = "うん！みんな半分以上、着物姿でしょ？"
"1601202-12-ジュンコ" = "……っていうか、先生。"
"1601202-13-ジュンコ" = "他の人じゃなくて、私を見なさいよ！先生を呼んだ意味が無いじゃない！"
"1601202-14-ジュンコ" = "……急にじっと見つめるのもやめて！どうしてそう極端に……。"
"1601202-15-ジュンコ" = "そ、それで、どう？"
"1601202-16-ジュンコ" = "な、何ってそりゃ……似合ってるかどうかよ！"
"1601202-17" = "[s] \"もちろん、すごく似合ってるよ。\""
"1601202-18-ジュンコ" = "ふぅん……。"
"1601202-19-ジュンコ" = "……感想はそれだけ？"
"1601202-20-ジュンコ" = "うーん……まあ先生だし、そうかもしれないとは思ったけど。はぁ……。"
"1601202-21" = "[s] \"世界一似合ってるよジュンコ！可愛い、最っ高に可愛い！テイクアウトしたい！！\""
"1601202-22-ジュンコ" = "な、何言ってんの！？私を持ち帰ってどうするつもり！？"
"1601202-23-ジュンコ" = "ああもう、だから何でそう極端なのよ！"
"1601202-24-ジュンコ" = "……とにかく。私としてもこの着物、結構気に入ってるの。"
"1601202-25-ジュンコ" = "しばらく借りて、お店の外でも着たいくらい。"
"1601202-26-ジュンコ" = "でもそのためには、レンタル費用とクリーニング代が必要で……。"
"1601202-27-ジュンコ" = "結局……いつも以上にバイトを頑張らないといけないわけ。"
"1601202-28" = "[s1] \"世の中、そう簡単じゃないよね……。\"\n[s2] \"欲しいものを手に入れるために、犠牲はつきものだから……。\""
"1601202-29-ジュンコ" = "まあ、そういうことね。うーん……。"
"1601202-30-ジュンコ" = "こうなったらいっそ……一番高いメニューを先生に沢山買ってもらって、店の売上を爆上げさせるとか？"
"1601202-31" = "[s3] \"なんて邪悪な手口を！仕方ないなぁ！\"\n[s4] \"ここからここまで、全部ください！\""
"1601202-32-ジュンコ" = "ま、冗談よ……って、え！？じょ、冗談だってば！なに本気にしてんの！？"
"1601202-33" = "[s] \"せっかく可愛いウェイトレスさんがいるんだから、高いものを頼まないとね。\""
"1601202-34-ジュンコ" = "だ、だからそれは……！"
"1601202-35" = "[s] \"それに私も、「ルワゾー・ブッレ」のお正月メニュー食べたい！\""
"1601202-36-ジュンコ" = "そ、それなら仕方ないけど……。"
"1601202-37-ジュンコ" = "にしても、こんなにたくさん頼む必要はないんじゃない？"
"1601202-38-ジュンコ" = "え、注文しちゃったんだから受け取る？う、うーん……。"
"1601202-39-ジュンコ" = "えっと、じゃあ、ご注文ありがとうございます……。"
"1601202-40-ジュンコ" = "……。"
"1601202-41-ジュンコ" = "だから言ったのに……。"
"1601202-42" = "[s] \"やっぱり頼み過ぎたかも……？\""
"1601202-43-ジュンコ" = "まったく、聞く耳持たないから。"
"1601202-44-ジュンコ" = "これどうするのよ、半分以上手つかずじゃない。"
"1601202-45-ジュンコ" = "え、良いアイディア？何それ？"
"1601202-46-ジュンコ" = "増援を呼べば良い……？"
"1601202-47" = "[s5] \"一緒に食べよう、ジュンコ。\"\n[s6] \"ジュンコも食べたくない？\""
"1601202-48-ジュンコ" = "はぁっ！？い、一応私はここの従業員だし、バイト中なんだけど……！？"
"1601202-49-ジュンコ" = "で、でもまあ、そこまで言うなら……。"
"1601202-50-ジュンコ" = "……なんで店長も遠くからオッケーサイン出してるのよ。"
"1601202-51-ジュンコ" = "ああもう、仕方ないわね！一緒に食べてあげる！"
"1601202-52" = "（ジュンコと並んで座って、ゆったりケーキを食べた）"
"1601202-53" = "（帰り際に「デート楽しかったね」と言ったら、なぜか殴られた）"
