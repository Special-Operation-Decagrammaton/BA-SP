[translation]
"1011805-1" = "意外な場所"
"1011805-2" = "（いつも通り、地下鉄に向かっていると）"
"1011805-3" = "[ns] \"ん？\""
"1011805-4-ノゾミ" = "あれ？先生じゃん。"
"1011805-5-ノゾミ" = "パヒャッ！奇遇だね。"
"1011805-6" = "[ns1] \"こんにちは、ノゾミ。\"\n[ns2] \"何してるの？\""
"1011805-7-ノゾミ" = "ん？そりゃ地下鉄に乗るんだよ。"
"1011805-8-ノゾミ" = "先生も？"
"1011805-9-ノゾミ" = "なら一緒にいこーよ。"
"1011805-10-ノゾミ" = "ラッキー！座れた～。"
"1011805-11-ノゾミ" = "ほら、隣どーぞ、先生。"
"1011805-12" = "[ns3] \"地下鉄で会うなんてビックリした。\"\n[ns4] \"よく乗るの？\""
"1011805-13-ノゾミ" = "地下鉄は地下鉄で好きなんだよ。"
"1011805-14-ノゾミ" = "列車と似てるとこもあるし。"
"1011805-15" = "[s] \"確かにそうだね。\""
"1011805-16-ノゾミ" = "人がたくさん乗れて、ちゃんと時間通り動くし……。"
"1011805-17-ノゾミ" = "そんなに揺れないのもいいよね。"
"1011805-18-ノゾミ" = "小さくまとまった列車って感じ？パヒャヒャッ！"
"1011805-19-ノゾミ" = "ときどき止まるのが、玉にキズかな。"
"1011805-20-ノゾミ" = "やっぱ一番は、パワフルな列車じゃない？"
"1011805-21" = "[s5] \"私も列車が通ってない土地では、\"\n[s6] \"地下鉄やバスを使うかな。\""
"1011805-22-ノゾミ" = "ふ～ん。"
"1011805-23-ノゾミ" = "[ruby=まちなか]街中[/ruby]とかはそうだよね。"
"1011805-24-ノゾミ" = "いつか地下鉄も運転してみたいなぁ。"
"1011805-25" = "[s] \"船とかは動かさないの？\""
"1011805-26-ノゾミ" = "船、酔うらしいじゃん？"
"1011805-27-ノゾミ" = "あんま興味ないかな！"
"1011805-28-ノゾミ" = "「大きさによっては酔わないよ」？……先生は乗ったことあるんだ。"
"1011805-29-ノゾミ" = "パヒャヒャッ！私もいつか船に乗る日がくるのかな？"
"1011805-30-ノゾミ" = "それとも……海上列車とか？"
"1011805-31" = "[s7] \"海を列車が疾走するの！？\"\n[s8] \"そんなことができたらカッコイイだろうな～\""
"1011805-32-ノゾミ" = "陸の次は海っしょ。パヒャヒャッ！"
"1011805-33" = "（ノゾミとの話で盛り上がりすぎて……）"
"1011805-34" = "（乗り過ごしてしまった……！）"
