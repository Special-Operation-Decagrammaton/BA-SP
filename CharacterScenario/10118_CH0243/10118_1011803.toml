[translation]
"1011803-1" = "「可愛い」は意外なところに"
"1011803-2-ノゾミ" = "コンコーン。"
"1011803-3-ノゾミ" = "やっほ、先生。"
"1011803-4" = "[s1] \"こんにちは、ノゾミ。\"\n[s2] \"面倒な話って？\""
"1011803-5-ノゾミ" = "んー、まぁ、そんな面倒ではないんだけど。#n見た方が早いよ。"
"1011803-6-ノゾミ" = "はい、これ。"
"1011803-7" = "[s] \"これは……？\""
"1011803-8-ノゾミ" = "こいつは「シュッポ」。行政委員会の新しいマスコットなんだってさ。"
"1011803-9-ノゾミ" = "デザインコンテストで入賞したとかなんとか……。"
"1011803-10-ノゾミ" = "グッズがちょー余ってるし、あんま人気ないみたいだけど。"
"1011803-11" = "[s] \"これを届けに来てくれたの？\""
"1011803-12-ノゾミ" = "こいつ、私らの制服着てるじゃん？"
"1011803-13-ノゾミ" = "学園の知名度アップのために、シャーレに持ってけって言われたんだよ。"
"1011803-14-ノゾミ" = "……って先生、もしかして気に入ったの？"
"1011803-15" = "[s] \"可愛いもの、好きだからね。\""
"1011803-16-ノゾミ" = "へぇ？こういうのが好きなんだ？パヒャヒャッ。"
"1011803-17-ノゾミ" = "私はあんまピンと来ないんだよね。"
"1011803-18-ノゾミ" = "まわりで流行ってても、ふーんって感じ。"
"1011803-19-ノゾミ" = "そもそも、可愛いとか思ったことないかも？"
"1011803-20-ノゾミ" = "うーん、正直どっちでもいいというか？"
"1011803-21" = "[s] \"なるほど……！\""
"1011803-22" = "[ns] \"ちょっと待ってて！\""
"1011803-23" = "[ns] \"これとかどう？\""
"1011803-24-ノゾミ" = "何これ。"
"1011803-25" = "[s] \"この前取ったぬいぐるみ！\""
"1011803-26-ノゾミ" = "そうなんだ。"
"1011803-27" = "[ns3] \"反応薄っ！\"\n[ns4] \"え、えっと……そうしたら……\""
"1011803-28" = "[ns] \"これとかどう？\""
"1011803-29-ノゾミ" = "ちょっとグロくない？"
"1011803-30" = "[ns5] \"こ、この大怪獣オルテガノスが！？！？\"\n[ns6] \"そんなっ……！！\""
"1011803-31-ノゾミ" = "先生はそういうのが好きなの？"
"1011803-32-ノゾミ" = "……他のみんなも？"
"1011803-33-ノゾミ" = "パヒャッ、わっかんないな～。"
"1011803-34" = "[s] \"きっと、ノゾミが気になるものがあるはず……！\""
"1011803-35" = "（その後もあらゆるキャラグッズを見せたが……）"
"1011803-36" = "（どれもノゾミには響かないようだった……）"
"1011803-37" = "[ns] \"こ、これなら……どう……？\""
"1011803-38-ノゾミ" = "くくっ！"
"1011803-39" = "[ns7] \"おおっ。\"\n[ns8] \"気に入った？\""
"1011803-40-ノゾミ" = "ぷっ、くくっ……！そうじゃなくってさ。"
"1011803-41-ノゾミ" = "先生、大人のくせにさ……。"
"1011803-42-ノゾミ" = "超必死こいてるっしょ？"
"1011803-43-ノゾミ" = "それが……なんか……ぷぷっ。"
"1011803-44-ノゾミ" = "可愛かったかも。"
"1011803-45" = "[ns] \"ええっ……！？\""
"1011803-46-ノゾミ" = "パヒャヒャッ！だってほんとにそうなんだもん！"
"1011803-47" = "[ns] \"……。\""
"1011803-48" = "（ちょっと恥ずかしくなり、背を向けた）"
"1011803-49-ノゾミ" = "ぷぷっ……あれー？先生照れちゃったのー？"
"1011803-50-ノゾミ" = "可愛いって言わせたかったんじゃないのぉ？"
"1011803-51-ノゾミ" = "えー、先生が可愛いんじゃダメぇ～？"
"1011803-52" = "[s] \"うぎぎ……！\""
"1011803-53" = "（ひとしきりからかった後、ノゾミは満足気に帰っていった）"
