[translation]
"1011806-1" = "意外な弱点？"
"1011806-2-ノゾミ" = "こんちゃ、せんせー。"
"1011806-3" = "[s1] \"こんにちは、ノゾミ。\"\n[s2] \"早かったね。\""
"1011806-4-ノゾミ" = "そりゃ当番だからね。"
"1011806-5-ノゾミ" = "ふぁあぁあぁあ～……！"
"1011806-6" = "[ns3] \"すごいあくび！\"\n[ns4] \"結構疲れてる？\""
"1011806-7-ノゾミ" = "昨日、夜間運行だったんだよ。"
"1011806-8-ノゾミ" = "あんま寝る時間なくってさ。"
"1011806-9" = "[s] \"お疲れ様。休んでもよかったのに……。\""
"1011806-10-ノゾミ" = "パヒャヒャッ、いいのいいの。"
"1011806-11-ノゾミ" = "先生に会いに来てんだからさ。"
"1011806-12-ノゾミ" = "んで、何すればいい？"
"1011806-13" = "（心配をよそに、ノゾミはやる気満々だったが……）"
"1011806-14" = "[ns] \"……寝ててもいいよ？\""
"1011806-15-ノゾミ" = "ん～……？大丈夫！"
"1011806-16-ノゾミ" = "へっちゃらだよ！パヒャヒャッ！"
"1011806-17" = "[s5] \"じゃあソファで横になってるとか……\"\n[s6] \"それくらいならいいでしょ？\""
"1011806-18-ノゾミ" = "……じゃあちょっとだけ。"
"1011806-19-ノゾミ" = "んん～……。"
"1011806-20-ノゾミ" = "おぉ……体が沈んでゆくぅ……。"
"1011806-21" = "[ns] \"寝ちゃっていいからね。\""
"1011806-22-ノゾミ" = "いやぁ……そういうわけにはぁ……。"
"1011806-23-ノゾミ" = "せっかく……シャーレま……で来……て……ぇ……。"
"1011806-24-ノゾミ" = "……。"
"1011806-25" = "（ノゾミに毛布をかけてあげた）"
"1011806-26" = "（夕方になって目を覚ましたノゾミは、もったいないことをしたと笑っていた）"
