[translation]
"1011802-1" = "意外な同行者"
"1011802-2" = "（出張先に向かう列車に乗った）"
"1011802-3-アナウンス" = "ご乗車のお客様にご案内いたします。"
"1011802-4-アナウンス" = "ただいま車両点検を行なっております。#n出発は予定時刻より約20分ほど――"
"1011802-5" = "[ns] \"これは遅刻かも……。\""
"1011802-6" = "（20分後）"
"1011802-7-乗客A" = "あっ、やっと動いた。"
"1011802-8-乗客A" = "これじゃ遅れちゃうよー！"
"1011802-9-？？？" = "あー、あー。乗客のみなさーん、聞こえてる？"
"1011802-10-？？？" = "ちょーっと飛ばすよー……パヒャッ。"
"1011802-11-乗客A" = "えっ？"
"1011802-12" = "[ns] \"この声は……。\""
"1011802-13" = "[ns] \"うわっ！\""
"1011802-14" = "[ns] \"時間通りに着いた……\""
"1011802-15-ノゾミ" = "あ、先生じゃん。"
"1011802-16" = "[s1] \"こんにちは、ノゾミ。\"\n[s2] \"もしかして、今の列車……。\""
"1011802-17-ノゾミ" = "パヒャヒャッ！運転手は私だよ！"
"1011802-18-ノゾミ" = "奇遇だね、先生も乗ってたんだ！"
"1011802-19-ノゾミ" = "で、ご感想は！？"
"1011802-20" = "[s] \"すごいスピード……だった……。\""
"1011802-21-ノゾミ" = "私の列車に遅延の二文字はないからね！"
"1011802-22-ノゾミ" = "用事には間に合いそう？"
"1011802-23" = "[s] \"うん、おかげさまで！\""
"1011802-24-ノゾミ" = "よかったよかった。"
"1011802-25-ノゾミ" = "帰りはいつ頃なの？"
"1011802-26" = "[s] \"夕方かな……。\""
"1011802-27-ノゾミ" = "じゃ、終わったら連絡して。いってらっしゃい！"
"1011802-28" = "（ノゾミは風のように去っていった……）"
"1011802-29" = "（改札に入り、ノゾミに連絡すると……）"
"1011802-30-ノゾミ" = "タイミングいい！1番ホームに入るから、先頭車両に来てよ。"
"1011802-31" = "[ns] \"えーっと、先頭だっけ……。\""
"1011802-32-ノゾミ" = "や、先生。"
"1011802-33" = "[ns] \"ここでいいの……？\""
"1011802-34-ノゾミ" = "はやく乗った乗った！"
"1011802-35" = "（ノゾミに促され、運転室に乗り込んだ）"
"1011802-36" = "[ns] \"初めて入ったよ……\""
"1011802-37-ノゾミ" = "いいよ、見学見学！"
"1011802-38-ノゾミ" = "んじゃ、出発進行～。"
"1011802-39" = "[wa:4860]― [log=노조미]運転室からの景色はどう？[/log]"
"1011802-40" = "― [log=노조미]この時間帯は特に綺麗でさ。[/log]"
"1011802-41" = "― [log=노조미]好きなんだよね……[wa:2040]夕暮れ。[/log]"
"1011802-42" = "[ns3] \"カッコイイ……！\"\n[ns4] \"でも、列車の運転って難しそうだね。\""
"1011802-43" = "[wa:1030]― [log=노조미]自動運転システムもあるんだけど、[/log]"
"1011802-44" = "[wa:2600]― [log=노조미]あんま使わないんだ。[/log]"
"1011802-45" = "― [log=노조미]だってつまんないじゃん？[/log]"
"1011802-46" = "[wa:1480]― [log=노조미]運転はやっぱ[wa:1430]自分の手でやらなきゃ。[/log]"
"1011802-47" = "[wa:520]― [log=노조미]お？[wa:1430]先生もやってみる～？[/log]"
"1011802-48" = "[ns] \"流石に怖いからやめとく！\""
"1011802-49" = "[wa:250]― [log=노조미]あはははっ！[wa:980]じょーだんじょーだん！[/log]"
"1011802-50" = "[wa:1080]― [log=노조미]先生は[wa:1440]機関士の免許ないし。[/log]"
"1011802-51" = "― [log=노조미]いくらなんでも[wa:1640]流石に素人に触らせないよ。[/log]"
"1011802-52" = "[ns] \"よ、よかった……。\""
"1011802-53" = "（そうして、ノゾミが運転する列車で帰ってきた）"
"1011802-54" = "[ns] \"楽しかったよ。ありがとう\""
"1011802-55-ノゾミ" = "お礼なんていいよ！"
"1011802-56-ノゾミ" = "私も楽しかったし！パヒャヒャッ！"
"1011802-57" = "[ns] \"次は普通のお客さんとして乗るね。\""
"1011802-58" = "[ns5] \"免許もないし……。\"\n[ns6] \"私は客席ってことで、どうかな？\""
"1011802-59-ノゾミ" = "ふ～ん？ま、いーけど。"
"1011802-60-ノゾミ" = "先生は素人だもんね。パヒャッ！"
"1011802-61" = "（送ってくれたお礼として、ノゾミにアイスを買ってあげた）"
