[translation]
"2006206-1" = "私たちみんな化学！"
"2006206-3-エリナ" = "あ～今回も失敗！！"
"2006206-4-エリナ" = "設備が古くて全然ダメです！んがああ～～っ！"
"2006206-5" = "[s] \"何を作るの？\""
"2006206-6-エリナ" = "もう諦めちゃったので教えますけど……。"
"2006206-7-エリナ" = "人工ダイヤモンドを作ってたんです！529カラットまでいったのに、1カラットの壁を越えられなくて……。"
"2006206-8-エリナ" = "これが私の限界、か……悔しいっ……。"
"2006206-9" = "[s] \"限界っていうけどすごくない！？\""
"2006206-13" = "[ns] \"というか、どうしてダイヤモンド……？\""
"2006206-14-エリナ" = "拾った雑誌に「プレゼントの選び方」コーナーがあったんです！#n贈り物をすると、日頃の感謝とか気持ちを伝えられるって書いてあって。"
"2006206-15-エリナ" = "先生にはいつもお世話になってるし、何か贈りたかったんですが……#n何がいいのか全然分からなくて！#n相手が負担に感じることもあるって書いてあったから……。"
"2006206-16-エリナ" = "実用的すぎても寂しいし、かと言って使い道が全くないのも困るし。#n値段が高すぎても問題だし……すっごく複雑で。"
"2006206-17-エリナ" = "悩んでる時、突然ひらめいたんです！「ダイヤモンドだ！」って。"
"2006206-18-エリナ" = "色々な用途に使えるし、自分で作るから高すぎない。#nそれに、綺麗だから飾ることもできる。ほら、贈り物にピッタリだと思いません？"
"2006206-19-エリナ" = "……まあ、あえなく失敗しましたが。"
"2006206-20" = "[s] \"その気持ちが何よりのプレゼントだよ！\""
"2006206-21-エリナ" = "それって「気持ちだけで結構」ってことですよね！？それも書いてありました！"
"2006206-22-エリナ" = "私が、先生に何かをあげたいんです！#n一度決めたら最後までやり通さないと気が済まないんです～～！"
"2006206-23-エリナ" = "もう1回やれば出来そうなんで、50時間だけ待ってくれませんか？"
"2006206-24-エリナ" = "それか、欲しい物を言ってもらえればすぐに作りますよ？"
"2006206-25" = "[s] \"エリナがくれるなら何でもいい！\""
"2006206-26-エリナ" = "ん～、なんだろ。……ダイヤモンドで作った私の胸像、とか？"
"2006206-27-エリナ" = "うーん……。"
"2006206-28-エリナ" = "あっ、これだ！"
"2006206-29-エリナ" = "先生！ちょっと待っててください！すぐに戻ります！"
"2006206-34" = "（3時間後）"
"2006206-37" = "（夕方になり、吹雪が吹き始めた）"
"2006206-38" = "[ns] \"ダメだ、探しに行こう……！\""
"2006206-40-エリナ" = "ゴホッ……！へくしゅっ！"
"2006206-41-エリナ" = "うう～～さぶいよぉ！くしゅんっ！"
"2006206-47-エリナ" = "ただいま帰りました！ゴホゴホ！"
"2006206-48" = "[s] \"大丈夫！？心配したよ！\""
"2006206-49-エリナ" = "ご心配なく！念のため、命綱を付けていったので！"
"2006206-50-エリナ" = "ほらっ！寒いですし、お布団へどーぞ！"
"2006206-51-エリナ" = "見せたい物があるんです！"
"2006206-59" = "[wa:430]― [log=에리나]へへっ、[wa:1040]綺麗ですよね？[wa:1660]ゲホゲホ。[/log]"
"2006206-61" = "― [log=에리나]雪の結晶を[wa:1300]ポリビニルアセタールで[wa:1160]固めたものです。[/log]"
"2006206-64" = "― [log=에리나]時間が経ったとしても、[wa:1430]温かい場所でも溶けません。[/log]"
"2006206-67" = "[wa:1070]― [log=에리나]せっかくなので[wa:1000]一番大きくて[wa:1010]綺麗なものを探そうとしたら……[/log]"
"2006206-69" = "― [log=에리나]こんな時間になってしまって。[/log]"
"2006206-72" = "― [log=에리나]ズビズビ……[wa:2240]せっかくなので、[wa:1120]永久に光る[wa:990]雪結晶にしてみました。[/log]"
"2006206-75" = "― [log=에리나]どうでしょう？[/log]"
"2006206-77" = "― [log=에리나]これを見るたびに、[wa:1460]私のことを思い出してくれますか？[/log]"
"2006206-80" = "[ns] \"もちろん！とても大事なプレゼントだからね。\""
"2006206-82" = "[wa:600]― [log=에리나]ふふっ！[wa:850]やっ[wa:320]たぁ！[/log]"
"2006206-84" = "― [log=에리나]喜んでもらえてよかったです。[/log]"
"2006206-87" = "― [log=에리나]すごいですよね……[/log]"
"2006206-89" = "― [log=에리나]これも、[wa:910]あれも、[wa:1140]ぜーん[wa:650]ぶ[wa:300]化学なんです。[/log]"
"2006206-92" = "― [log=에리나]先生と、[wa:1830]私も……[/log]"
"2006206-94" = "― [log=에리나]化学で説明できるわけです。[/log]"
"2006206-97" = "[wa:1420]― [log=에리나]見えているものも、[wa:1610]情報処理も、[wa:1550]電気信号でしかありません。[/log]"
"2006206-99" = "― [log=에리나]なのに反応しあうんです。[/log]"
"2006206-102" = "― [log=에리나]どれもただの電気信号でしかないのに、[/log]"
"2006206-104" = "― [log=에리나]感情なんて名前が付いてしまいました。[/log]"
"2006206-107" = "― [log=에리나]いえ、[wa:800]それが[wa:780]嫌というわけではなく……。[/log]"
"2006206-110" = "[wa:1420]― [log=에리나]こんな風に反応が起こるなら、[wa:2720]同じがいいな、[wa:1450]と思って。[/log]"
"2006206-113" = "― [log=에리나]なーんて！[wa:1100]ゲホゲホ！[/log]"
"2006206-115" = "― [log=에리나]私、[wa:770]風邪でおかしくなっちゃったのかもしれません！[/log]"
"2006206-118" = "― [log=에리나]あははっ……！[wa:1260]ははっ……。[/log]"
"2006206-121-エリナ" = "げほっ、ごほっ……！"
"2006206-122" = "[s] \"ごめんね、プレゼント作りのせいで風邪引いちゃったね……。\""
"2006206-123-エリナ" = "そんな、気にしないでください！だいじょーぶいっ！"
"2006206-124-エリナ" = "それでも気になるなら……これを、毎日見る場所に飾ってくれると嬉しいです！"
"2006206-125-エリナ" = "約束ですよ……！ふああ……。"
"2006206-126" = "[s] \"分かった！約束だね！\""
"2006206-127-エリナ" = "えへへ……。"
"2006206-128-エリナ" = "へへ……。"
"2006206-129-エリナ" = "……ぐぅ……。"
"2006206-131" = "（エリナは疲れていたのかあっという間に眠りに落ちていった）"
"2006206-132" = "（すやすや眠るエリナを雪の結晶と一緒に見守った）"
