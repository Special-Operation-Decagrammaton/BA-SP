[translation]
"2006202-1" = "料理は化学！"
"2006202-3-エリナ" = "ようこそ――"
"2006202-4-エリナ" = "――183号レストランへ！"
"2006202-5" = "[s] \"まさかの転職！？\""
"2006202-6-エリナ" = "よっ！ツッコミ上手！"
"2006202-7-エリナ" = "実際、食堂も研究所も似たようなもんです！料理は現代化学の寵児ですから！"
"2006202-8-エリナ" = "キッチンも研究室の一つ――ということです！"
"2006202-9" = "[s] \"ただの研究室に見えるけど……。\""
"2006202-10-エリナ" = "そうですね……ガスで色々吹き飛んで、あちこち凍ってしまってますが……。"
"2006202-11-エリナ" = "キッチンが研究室になれるのなら、逆もまた然り、です！"
"2006202-12-エリナ" = "今日はキッチンの化学を紹介するので、先生には試食をお願いしたく！"
"2006202-13-エリナ" = "183号のシェフ、[ruby=にき]二木[/ruby]エリナの実力、とくとご覧あれ～！"
"2006202-14" = "[s] \"183号のシェフ？\""
"2006202-15-エリナ" = "ですです！183号では私が料理担当なんです。"
"2006202-16-エリナ" = "化学担当でもあるので、味付けには自信ありますよぉ～！"
"2006202-17-エリナ" = "それでは早速始めます！ドクターエリナの～クッキングタイム！"
"2006202-18-エリナ" = "今日は冷蔵庫にあるもので素敵な一品を作ろうと思います！"
"2006202-19-エリナ" = "冷蔵庫にある食材は――！"
"2006202-20-エリナ" = "ジャガイモ、お肉、ジャガイモ……そして、なんとぉ～！山盛りの！霜！"
"2006202-24-エリナ" = "……。"
"2006202-25-エリナ" = "ま、まずは肉じゃがを作りましょうか！"
"2006202-26" = "[s] \"肉じゃが……！？\" "
"2006202-27-エリナ" = "最近悪天候が続いたので、作れそうなものはそれくらいですね……えへへ。"
"2006202-28-エリナ" = "では気を取り直して材料チェック！お肉よし、ジャガイモよし、醤油よし、砂糖よし……。"
"2006202-29-エリナ" = "って、あれ！？塩がない……醤油だけじゃ味の深みが出ないのにぃ！"
"2006202-30-エリナ" = "ですが問題ありません！なければ作るまでです！"
"2006202-31-エリナ" = "どれどれ、塩酸と水酸化ナトリウムはっと……おっ、ありました！"
"2006202-32" = "[s1] \"塩酸……？えっ！？\"\n[s2] \"水酸化ナト……えええっ！？\""
"2006202-35-エリナ" = "び、ビックリしたぁ！？こぼしたらどうするんですか！？"
"2006202-36-エリナ" = "もしかして、初めて見ます？そんなに珍しい薬品ではないと思うんですけど……#nレッドウィンターの外ではそうなのかな？"
"2006202-37" = "[s3] \"そういう話じゃなくて……！\"\n[s4] \"どうして塩酸と水酸化ナトリウムを？\""
"2006202-40-エリナ" = "塩が必要だからです！ほら、塩って塩化ナトリウムでしょ？"
"2006202-41-エリナ" = "塩酸と水酸化ナトリウム水溶液を混ぜると、#n中和反応で塩化ナトリウムができるんです。"
"2006202-42-エリナ" = "発熱反応で温まるのはオマケです！"
"2006202-43" = "[s] \"これ、研究室……いやキッチンでやっていいの？\""
"2006202-44-エリナ" = "普通はダメですよ？比率を間違えると大変なことになりますからね！"
"2006202-45-エリナ" = "でも私はプロですし～？ここはキッチンではなく研究室なので、問題ないってことで！"
"2006202-46-エリナ" = "じゃあ、ささっと作りまっしょい！"
"2006202-47" = "[s] （プロを信じることにした）"
"2006202-50-エリナ" = "ん～～っ！ちゃんと塩の味がしますね！今のところ順調じゅんちょ～♪"
"2006202-51-エリナ" = "次はみりんですが……これも無いですね。"
"2006202-52-エリナ" = "しゃーなしです。これも作っちゃいましょうか！"
"2006202-53" = "[s] \"作らずになんとかならないかな！？\""
"2006202-54-エリナ" = "ダメです！料理初心者は「無いからいっか」とか「他で代用しよう」とか言って、#n料理の化学反応を台無しにしちゃうんですから！"
"2006202-55-エリナ" = "みりんはお肉に味を染み込みやすくして、脂っぽさや臭みを取ってくれるんです。#n化学的にめーっちゃ重要なんですよ？"
"2006202-56-エリナ" = "こっちもすぐに出来ますから！#nちょちょ～っと作っちゃいます！"
"2006202-57" = "[s] \"本当に安全なんだよね！？\""
"2006202-58-エリナ" = "当然です！こう見えて、先生の安全を第一に考えているんですよ？"
"2006202-59-エリナ" = "ってわけで、作っていきまっしょい！"
"2006202-63-エリナ" = "ちなみに、セーターとか着てませんよね？"
"2006202-64-エリナ" = "そうそう起こることはないんですけど、エチレンガスが静電気とアレで……#nえーっと、なんて言うんだっけ……。"
"2006202-65-エリナ" = "とにかく！先生はじっとしていてください！"
"2006202-66" = "[s] （悲鳴をなんとかこらえた）"
"2006202-67-エリナ" = "待っててくださいね～！#n化学の力で超絶おいしい肉じゃがを作るので！"
"2006202-69" = "（その後もエリナは足りない調味料をその場で作っていった）"
"2006202-70" = "（完成した肉じゃがは絶品だった。エリナを褒めちぎると嬉しそうだった）"
"2006202-71" = "（緊張して足の力が抜けてしまったので、しばらく休んでからシャーレに帰った）"
