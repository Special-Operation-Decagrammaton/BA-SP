[translation]
"2006205-1" = "ファッションだって化学！"
"2006205-2" = "白イルカ市場"
"2006205-3" = "（エリナの出張を手伝うためレッドウィンターへ訪れた）"
"2006205-4-エリナ" = "ああ……これが、標高が低い場所の空気……。"
"2006205-5-エリナ" = "まさに、この天才二木エリナにピッタリですね。"
"2006205-6" = "[s] \"いよっ！かっこいいー！！\""
"2006205-7-エリナ" = "ふっふーん！当然の事実ですがっ！称賛は何度聞いても気持ちいいですねぇ～！"
"2006205-8-エリナ" = "今日は、私が研究してきた化学繊維製品の市場調査をします！#n報告書を提出する条件で、事務局にも許可をもらいました！"
"2006205-9-エリナ" = "ズナーミャカフェにも行きたかったんですけど……従業員が全員病欠みたいで。"
"2006205-10-エリナ" = "残念ですが仕方ありません！今日はやることも多いですし！"
"2006205-11" = "[s] \"製品ってどんなの？\""
"2006205-12-エリナ" = "良い質問ですね！今日紹介する力作は3つです！"
"2006205-13-エリナ" = "一つ目はポリビニルアルコール繊維！#n安価で流通量が多い、石炭と石灰石で作ることが可能です。#n加えて、吸水性も良い！"
"2006205-14-エリナ" = "二つ目は再生セルロース繊維。#nこれは古紙やおがくず、古綿に化学的処理をして作られています。#n資源の節約にもなるし、環境にも優しいんです。"
"2006205-15-エリナ" = "最後に保温ウール繊維！#n普通のウールに化学的処理を施して、保温性を高めています。"
"2006205-16-エリナ" = "3つとも中間評価は好評でした。#n183号から抜け出せるのもそう遠くないかもしれません！"
"2006205-17" = "[s] \"どれもすごいね！\""
"2006205-18-エリナ" = "でしょ～？私、やるときはやる子なんです！"
"2006205-19-エリナ" = "早くみんなの喜ぶ顔が見たいです！早速お店に行きましょう！"
"2006205-20-エリナ" = "今回の新製品用に作ったお店なので、すっごくカッコいいと思います！"
"2006205-21-エリナ" = "化学の魔法を、ご照覧あれ！"
"2006205-23-エリナ" = "わあ～！素敵な内装！これですよ、これこれ！！"
"2006205-24-エリナ" = "え～……えーっと、なんだっけ？暗いところを明るくする電気装置――"
"2006205-25-エリナ" = "ああそう、照明！煌びやかですね！#nおお、床はPVCタイル？防水で断熱効果も高いやつ！"
"2006205-26-エリナ" = "雰囲気最高ですね！在庫もたくさんあるし、お客さんも全然いなくて……。"
"2006205-30-エリナ" = "お客さんが全くいない！？"
"2006205-35-エリナ" = "あ、あの～？なんで誰もいないんでしょう？もしかして、まだオープンしてないとか？"
"2006205-36-洋服店の店員" = "オープンはしていますよ。お客さんがいないだけです。"
"2006205-37-エリナ" = "なんで！？可愛いし、安いし……売り場だってこんなに素敵なのに！？"
"2006205-38-エリナ" = "こ、これとか人気じゃないんですか？#nポリビニルアルコール繊維で作ったブラウス！めちゃくちゃ可愛いし売れそうですけど！"
"2006205-39-洋服店の店員" = "ああそれ、店内の拭き掃除に使ってます。あまりにも売れないので全部下げました。"
"2006205-40-エリナ" = "拭き掃除ですとぉ！？"
"2006205-41-洋服店の店員" = "はい。風通し悪いし、ツルツルしていてパジャマにも使えないので。#n一度これを着て寝てみたんですがベッドから落ちそうになりました。#nしかも洗うとすごく縮むし。"
"2006205-42-洋服店の店員" = "吸水性だけは良いんで雑巾として使ってますよ。"
"2006205-43-エリナ" = "……。"
"2006205-44-エリナ" = "じゃ、じゃあこれは？再生セルロースで作ったコートと制服！"
"2006205-45-エリナ" = "ツヤツヤで綺麗だし、お手頃な値段だし……人気ですよね！？何よりエコですよ？"
"2006205-46-洋服店の店員" = "その商品、事務局から販売禁止令が出てます。"
"2006205-47-エリナ" = "ええっ！？"
"2006205-48-洋服店の店員" = "確かにそれが一番売れました、安くて可愛いんで。#n品切れになったこともあるくらいです。"
"2006205-49-エリナ" = "じゃあ、なんで……。"
"2006205-50-洋服店の店員" = "何回か洗っただけで急速に劣化しちゃうんです。#n先週の強風の日なんか、みんな服が破けてましたよ。"
"2006205-51-洋服店の店員" = "公然わいせつの罪で何十人も捕まったけど、#n事務局の人も服がなくなったのでみんな解放されたとか。"
"2006205-52-洋服店の店員" = "「太陽ではなく北風が服を脱がせた」って子供たちが思ったようで、#n初等部の教育をやり直さないといけなくなったとか。もうすごい騒ぎですよ。"
"2006205-53-エリナ" = "ああっ……生分解性の素材で作るとこうなるんだ……。"
"2006205-54-エリナ" = "ま、まだ一つ……最後の希望が残ってます！"
"2006205-55-エリナ" = "保温ウール繊維で作った防寒パンツは？#n最近寒かったし結構人気あったんじゃないですか？"
"2006205-56-洋服店の店員" = "ああ、あの「ヒアリパンツ」ですか？もうあれは売ってないですよ。"
"2006205-57-洋服店の店員" = "あれを着ると肌がピリピリして体温が上がるんです。#n朝それに気づかず着ていって、夜発狂しながら帰ってくるとか。#nヒアリで作ったに違いないと噂になっています。"
"2006205-58-洋服店の店員" = "そこのズナーミャカフェは新しい制服に採用したので、#nみんなストレスで参っているらしく、今も休業中です。"
"2006205-59-エリナ" = "あ、ああっ……。"
"2006205-60-洋服店の店員" = "艶出し用には使えるようなので、そこの金物屋に行けば売ってると思いますよ。"
"2006205-61-洋服店の店員" = "それにしても、無くなった商品ばかりお探しなんですね。何かあったのですか？"
"2006205-62-エリナ" = "……。"
"2006205-63" = "[s1] \"と、とりあえず出ようか。\"\n[s2] （エリナを連れて外へ出た）"
"2006205-69-エリナ" = "……。"
"2006205-70" = "[s3] \"あまり落ち込まないで……。\"\n[s4] \"こういう時もあるよ、元気出して！\""
"2006205-73-エリナ" = "うぅ……。"
"2006205-74-エリナ" = "よっしゃあ！大成功～！"
"2006205-75-エリナ" = "当初の想定よりもすごい物を発明しちゃいました！"
"2006205-76" = "[s] \"落ち込んでたんじゃないんだ！？\""
"2006205-77-エリナ" = "えっ？何か落ち込むようなことありました？"
"2006205-78-エリナ" = "ああ、たしかに服としてはダメでしたね。#nヒリヒリするとか、分解されるとか……ずり落ちるとか。それは残念です！"
"2006205-79-エリナ" = "でも分かったことも多いです！#n艶出しとしては有用なこととか……#n生分解の速度とか、ツルツルだけど吸水性がいいこととか。"
"2006205-80-エリナ" = "つまり、無意味な発明ではなかったんですよ！#nこの世のどこかでは、役に立つものです！"
"2006205-81-エリナ" = "最初の意図とは異なる成果を上げた発明は他にもあります！#n失敗した接着剤をメモ紙に使ったり、薬の副作用を他に活かしたり！"
"2006205-82-エリナ" = "大事なのは「何かを成し遂げた」ってことです！ブイッ！"
"2006205-83" = "[s5] \"良い心構えだね！\"\n[s6] \"でも報告書はどうしようか？\""
"2006205-86-エリナ" = "それはですね……実は一番簡単です！"
"2006205-90-エリナ" = "「意図した仕様」と企画書を書き直せばいいんです！"
"2006205-91-エリナ" = "こうなると思って鉛筆で書いておいたんで、ハンコだけ残して書き直せば――"
"2006205-92-エリナ" = "これでオールオッケー！"
"2006205-93" = "[s] \"そ、そうなの……？\""
"2006205-95" = "（エリナは上機嫌で事務局のポストに報告書を押し込んだ）"
"2006205-96" = "（嬉しそうなエリナを見て胸をなでおろした）"
