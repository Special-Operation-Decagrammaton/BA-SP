[translation]
"1007405-1" = "不器用な一面"
"1007405-2" = "（沈みゆく夕日を浜辺で眺めていると……）"
"1007405-3" = "（後ろから足音が聞こえてきた）"
"1007405-4" = "[ns1] \"やあ、ハナコ。\"\n[ns2] \"わざわざ来てもらってごめんね。\""
"1007405-5-ハナコ" = "いえ、むしろ急なご連絡だったのに、ありがとうございます。"
"1007405-6-ハナコ" = "……隣、失礼しますね。"
"1007405-7" = "[ns3] （ものすごく近いような……）\n[ns4] \"さ、流石にこの距離は……\""
"1007405-8-ハナコ" = "そんな風に言われると、私も傷ついてしまうのですが……"
"1007405-9-ハナコ" = "……ふふ、冗談です。"
"1007405-10-ハナコ" = "ですが、大事な生徒の可愛いワガママだと思って、許していただけませんか？"
"1007405-11-ハナコ" = "それとも、私は先生にとって、大事な生徒ではないのでしょうか……"
"1007405-12-ハナコ" = "……なんて、こう言えば先生は断れないと思っていました。"
"1007405-13-ハナコ" = "ふふっ……"
"1007405-14-ハナコ" = "ありがとうございます。"
"1007405-15-ハナコ" = "……それにしても、こんなに素敵な場所を独り占めしていたなんて。"
"1007405-16-ハナコ" = "綺麗ですね……空も、海も、全てが茜色に。"
"1007405-17-ハナコ" = "きっと、これも今しか見られない景色なのでしょう。"
"1007405-18-ハナコ" = "今回の調査を振り返って……#n皆さんと来られたのは、運に恵まれたからだと思いました。"
"1007405-19-ハナコ" = "……自分でセッティングしたのに、ですか？"
"1007405-20-ハナコ" = "それはそうなのですが……常にうまくいくとは限りませんし。"
"1007405-21-ハナコ" = "望んだ結果を得られるかどうかは、運によるところが大きいですから。"
"1007405-22-ハナコ" = "もちろん、今回の件は先生が居てくださったおかげですが……"
"1007405-23-ハナコ" = "…………。"
"1007405-24-ハナコ" = "えっと……"
"1007405-25-ハナコ" = "その……"
"1007405-26-ハナコ" = "……先生。"
"1007405-27" = "[s5] \"今日は話したいことがあるって聞いたけど……\"\n[s6] \"あれ、照れてるの？\""
"1007405-28-ハナコ" = "そ、そんなことは。たしかに、少し顔が熱いですが……"
"1007405-29-ハナコ" = "……ふふ。"
"1007405-30-ハナコ" = "そういう言い方は、あまり良くないですよ。そんな風に言われたら、言いたいこともうまく言葉にできなくなったりしてしまうのですから。"
"1007405-31" = "[s7] \"いつものお返しだよ。\"\n[s8] \"ちゃんと、相手に合わせて言葉を選んでるよ。\""
"1007405-32-ハナコ" = "……なるほど。"
"1007405-33-ハナコ" = "そうですか……ふむ……。"
"1007405-34-ハナコ" = "距離が縮まったのは嬉しいのですが、こういう親しさを求めていたわけでは……"
"1007405-35" = "[s9] \"夏だからね。\"\n[s10] \"少しは緊張が[ruby=ほぐ]解[/ruby]れたかな？\""
"1007405-36-ハナコ" = "ふふっ……まさか、先生に振り回されるなんて。"
"1007405-37-ハナコ" = "……もう。またそうやって……"
"1007405-38-ハナコ" = "ふふ。"
"1007405-39-ハナコ" = "ふふふっ。"
"1007405-40-ハナコ" = "でも、仰るとおりかもしれません。#n私は、こういう時でさえ言葉にできないのですから……"
"1007405-41-ハナコ" = "……。"
"1007405-42-ハナコ" = "……うーん。"
"1007405-43-ハナコ" = "…………そうですね。"
"1007405-44" = "[ns] ハナコから話してくれるのを待つ。"
"1007405-45-ハナコ" = "……先生。"
"1007405-46-ハナコ" = "…………。"
"1007405-47-ハナコ" = "……本当に、ありがとうございます。"
"1007405-48-ハナコ" = "今回のことも、これまでのことも……もう、何から何まで。"
"1007405-49-ハナコ" = "先生がいなければ、今の私は存在しません。"
"1007405-50-ハナコ" = "お気づきだとは思いますが……#n私は、周囲の評価ほど器用なタイプではないんです。"
"1007405-51-ハナコ" = "今こうやって先生にお話ししているのも、自分の中で抱えているものを吐き出して、楽になりたかったからで……"
"1007405-52-ハナコ" = "私のこんな考えも……先生には伝わっていると思うのですが……"
"1007405-53-ハナコ" = "感謝の言葉を口にするのも……自分自身でその行為を確認したいからなんだと思います。"
"1007405-54-ハナコ" = "ですが……"
"1007405-55-ハナコ" = "きちんと言葉にできて、良かったです。"
"1007405-56-ハナコ" = "本当に、考えれば考えるほど……"
"1007405-57-ハナコ" = "この島に……先生と、みなさんと来られて良かったです。"
"1007405-58-ハナコ" = "……私ばかり話してしまいましたね、ごめんなさい。"
"1007405-59-ハナコ" = "先生は、どうでしたか……？#n少しでも楽しい時間になっていたら、良いのですが……"
"1007405-60" = "[s11] \"もちろん、楽しかったよ。\"\n[s12] \"ハナコの気持ちを聞けて良かった。\""
"1007405-61-ハナコ" = "ふふっ……良かったです。"
"1007405-62-ハナコ" = "……先生。"
"1007405-63-ハナコ" = "これからも、よろしくお願いしますね。"
