[translation]
"1007402-1" = "今日は安全日です"
"1007402-2" = "（ハナコに呼ばれて、島の外れに位置する森に足を踏み入れた）"
"1007402-3" = "（そこは暖かい日差しと柔らかな風を感じる心地良い場所だった）"
"1007402-4-？？？" = "あら、先生。思ったよりも早くいらっしゃったのですね。"
"1007402-5-ハナコ" = "ふふっ。そんなに急がなくても大丈夫でしたのに。"
"1007402-6-ハナコ" = "……先生？ "
"1007402-7-ハナコ" = "どうかされましたか？#nなんだか緊張しているご様子ですが……"
"1007402-8" = "[s1] \"い、いや、そんなことはないと思うけど……\"\n[s2] \"手に持ってるのは……何？\""
"1007402-9-ハナコ" = "ああ、これはただのフルーツですよ。#nこの島は、色々なフルーツが実っているみたいで……不思議なものですね？"
"1007402-10-ハナコ" = "見てください、先生。イチゴにバナナ、桃……"
"1007402-11-ハナコ" = "ふふっ、こんなに大きなスイカもありました。"
"1007402-12-ハナコ" = "……先生？"
"1007402-13" = "[s3] \"あっ……そ、そうだね。\"\n[s4] \"フルーツのラインナップ的に、もしかしたら……って。\""
"1007402-14-ハナコ" = "……なるほど。"
"1007402-15-ハナコ" = "ふふっ……そんな事を思っていたなんて。"
"1007402-16-ハナコ" = "そう構えられると、なんだか申し訳ない気持ちになってきます。#nたしか、以前も似たようなことがありましたね。"
"1007402-17-ハナコ" = "先生が何を心配されているのか、分かるような気もしますけど……今回は大丈夫ですよ。"
"1007402-18-ハナコ" = "……いえ。[ruby=・   ・]今回[/ruby]ではなく、[ruby=・   ・   ・   ・]ここでは[/ruby]と言った方が正しいでしょうか。"
"1007402-19-ハナコ" = "ここは――違う場所なので。"
"1007402-20-ハナコ" = "……うん？"
"1007402-21-ハナコ" = "何が違うのか、と？#nそうですね。ここはトリニティではありませんし――私たち以外、誰もいません。"
"1007402-22-ハナコ" = "なので、こんな所で先生を困らせても――面白くないなと思いまして。"
"1007402-23" = "[s5] \"そこなの！？\"\n[s6] \"困らせてる自覚はあったんだ……。\""
"1007402-24-ハナコ" = "ふふっ、ですが……以前も申し上げた通り――"
"1007402-25-ハナコ" = "私の忠告を聞かず、ナカに踏み込んできたのは……先生、ですよね。"
"1007402-26-ハナコ" = "もちろん、私が――"
"1007402-27-ハナコ" = "……ふふっ。"
"1007402-28" = "[s7] \"……ハナコ？\"\n[s8] \"何か言いかけてたみたいだけど……\""
"1007402-29-ハナコ" = "うふふっ……あの時も申し上げた通り、このくらいは大目に見てくださいな。"
"1007402-30-ハナコ" = "……私はただ、この心地良さを手放したくないだけなのです。"
"1007402-31-ハナコ" = "ここでは――他人にどう思われるのかとか、自分に何を求められているのかとか……そういった細々とした事を気にする必要もありません。"
"1007402-32-ハナコ" = "……こうして、胸の[ruby=うち]裡[/ruby]をさらけ出したって問題になることもない。"
"1007402-33-ハナコ" = "ふふっ。もしコハルちゃんやウイさんがいれば、このフルーツを絡めて楽しいお話ができそうなものですが――"
"1007402-34-ハナコ" = "残念ながら、ここには先生と私しかいませんし……ご安心ください。"
"1007402-35-ハナコ" = "それとも……"
"1007402-36-ハナコ" = "先生は[ruby=・   ・   ・   ・]いつもの[/ruby]私を期待されていたのでしょうか？"
"1007402-37-ハナコ" = "でしたら、今からでも先生の期待に応えて――"
"1007402-38" = "[s9] \"今のままで十分だよ！？\"\n[s10] \"どうかこのままでお願いします……。\""
"1007402-39-ハナコ" = "……ふふっ。"
"1007402-40-ハナコ" = "それでは……そろそろ戻りましょうか？ "
"1007402-41-ハナコ" = "……そうだ、こちらを一緒に持っていただけませんか？"
"1007402-42" = "（ハナコが持ってきたフルーツを代わりに持って、一緒に拠点まで戻ると……）"
"1007402-43" = "（拠点に着くや否や、ハナコはフルーツを手にみんなを困らせるのだった……）"
