[translation]
"1004206-1" = "今よりもっとたくさん"
"1004206-2" = "（昨夜降った大雨で、花壇の土がめちゃくちゃに掘り返されていた。）"
"1004206-3-アツコ" = "……。"
"1004206-4" = "[s] \"花が……。\""
"1004206-5-アツコ" = "うん……みんな、死んじゃった。"
"1004206-6-アツコ" = "雨に耐えられるほど、根を下ろせなかったんだね。"
"1004206-7-アツコ" = "……。"
"1004206-8" = "[s] \"アツコ、大丈夫？\""
"1004206-9-アツコ" = "……植え替えをしちゃった、私のせいかもしれない。"
"1004206-10-アツコ" = "野花の育て方とか習性とか、何も知らなかった。方法が間違っていたのかもしれないし、環境も……。"
"1004206-11-アツコ" = "放っておいても、死んでたかもしれない……でも、私が勝手なことをしちゃったから……。"
"1004206-12-アツコ" = "何も、知らないのに……"
"1004206-13-アツコ" = "……。"
"1004206-14" = "[s] \"じゃあ、一緒に学ぼう。アツコ。\""
"1004206-15-アツコ" = "学ぶ……?"
"1004206-16" = "[ns] \"花の種類、育て方、土の種類、花の名前……いろんなことを。\""
"1004206-17" = "[ns] \"少しずつ、ゆっくり学んでいけばいいよ。\""
"1004206-18-アツコ" = "学んでいく……？"
"1004206-19-アツコ" = "私が？"
"1004206-20-アツコ" = "……。"
"1004206-21-アツコ" = "ああ……そっか。うん、そうだね。"
"1004206-22-アツコ" = "学んで、生かせば、いいんだね……。"
"1004206-23-アツコ" = "そういうことを……ずっと、知らなかった。"
"1004206-24-アツコ" = "………。"
"1004206-25-アツコ" = "先生と、一緒に……。"
"1004206-26-アツコ" = "……あ、なんでもない。忘れて。"
"1004206-27" = "[s] \"……？\""
"1004206-28-アツコ" = "うん、先生。そうしてみるね。"
"1004206-29-アツコ" = "私、学んでいく。"
"1004206-30-アツコ" = "……これから、たくさんのことを。"
"1004206-31-アツコ" = "先生が、教えてくれるんでしょ？"
"1004206-32" = "[s] \"うん、一緒に頑張ろう。\""
"1004206-33-アツコ" = "……うん。"
