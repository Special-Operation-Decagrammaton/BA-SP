[translation]
"1004203-1" = "真夜中の学校"
"1004203-2" = "某学園・本館の屋上"
"1004203-3-アツコ" = "おはよう、先生。"
"1004203-4" = "[s1] \"おはよう。\"\n[s2] \"おはよう、今日も既に夜だけど……。\""
"1004203-5-アツコ" = "挨拶は大事。"
"1004203-6-アツコ" = "挨拶は大事。"
"1004203-7" = "[s] \"確かに。ところでここは……。\""
"1004203-8-アツコ" = "この間見つけたの。"
"1004203-9" = "[s] \"なるほど……？\""
"1004203-10-アツコ" = "こっちのドアが開いてるから、ここから建物の中に入れる。"
"1004203-11-アツコ" = "さあ、行こう。"
"1004203-12" = "[ns3] \"ちょ、ちょっと……ま、待って、アツコ！\"\n[ns4] \"勝手に入るのは……！\""
"1004203-13-アツコ" = "……すごい。先生、早く来て。"
"1004203-14-アツコ" = "……すごい。先生、早く来て。"
"1004203-15" = "[ns] とりあえずついて行く。"
"1004203-16-アツコ" = "すごいね。他の学校って、こうなってるんだ。"
"1004203-17-アツコ" = "あれが教室？"
"1004203-18" = "[ns5] \"ま、待って！\"\n[ns6] 追いかける。"
"1004203-19-アツコ" = "……。"
"1004203-20-アツコ" = "こんな感じ、なんだね……。"
"1004203-21" = "[s] \"アツコ、勝手に学校に入ったらダメだよ。\""
"1004203-22-アツコ" = "……どうして？"
"1004203-23-アツコ" = "別に、問題を起こそうとしているわけじゃない。"
"1004203-24-アツコ" = "……でも、分かってる。見つかったら多分、怒られるだろうし……。"
"1004203-25-アツコ" = "もう少ししたら出るから、それなら良い？"
"1004203-26" = "[ns7] \"……うん、そうだね。\"\n[ns8] \"少しだけだよ？\""
"1004203-27-アツコ" = "……うん！"
"1004203-28-アツコ" = "……うん！"
"1004203-29" = "（アツコが前の席に座った。）"
"1004203-30-アツコ" = "先生、質問。"
"1004203-31" = "[s] \"……質問？\""
"1004203-32-アツコ" = "授業の中で、気になることがありました。"
"1004203-33" = "[s9] （あ………学校ごっこか）\n[s10] \"はい。アツコさん、どうぞ。\""
"1004203-34-アツコ" = "子どもって、どうやってできるの？"
"1004203-35-アツコ" = "子どもって、どうやってできるの？"
"1004203-36" = "[s] \"……。\""
"1004203-37-アツコ" = "……冗談。先生、そんなに困らないで。"
"1004203-38-アツコ" = "それじゃ、他のところにも行こう。"
"1004203-39-アツコ" = "ここは講堂？"
"1004203-40-アツコ" = "この席が全部、生徒で埋まるのかな。"
"1004203-41-アツコ" = "きっと賑やかな光景なんだろうね。"
"1004203-42-アツコ" = "ここはシャワー室かな。"
"1004203-43-アツコ" = "みんなで洗い合うの、楽しいよね。私も好き。"
"1004203-44-アツコ" = "アリウスにいる時も……みんなで一緒にシャワーを浴びる時間が、一番好きだった。"
"1004203-45-アツコ" = "じゃあ、次の場所に行こう。"
"1004203-46-アツコ" = "ここは部室、かな。"
"1004203-47-アツコ" = "小石研究部……石を集めてるのかな？……ふふっ、そんな部活もあるんだ。"
"1004203-48-アツコ" = "そっか……趣味の数だけ、部活があるんだね。"
"1004203-49" = "[s] \"アツコの趣味は？\""
"1004203-50-アツコ" = "趣味……?"
"1004203-51-アツコ" = "私は……"
"1004203-52-アツコ" = "あっ、バレちゃった！"
"1004203-53" = "[s] \"逃げよう！\""
"1004203-54" = "（アツコを連れて、急いで学校の外に出た。）"
"1004203-55-アツコ" = "……ふふ。危なかったね。"
"1004203-56-アツコ" = "でも……スリルがあって楽しかった。ね？"
"1004203-57" = "[s] \"はぁ……。\""
"1004203-58-アツコ" = "私のワガママに付き合ってくれてありがとう、先生。"
"1004203-59-アツコ" = "今日はここまで。じゃあ、また。"
