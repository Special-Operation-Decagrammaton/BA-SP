[translation]
"2000008-1" = "雨が降る日のセンチメンタル"
"2000008-2" = "ミレニアム校内・第42図書室"
"2000008-3-ヒビキ" = "あ、先生。"
"2000008-4-ヒビキ" = "先生も、本を探しに来たの？"
"2000008-5-ヒビキ" = "ん？私？"
"2000008-6-ヒビキ" = "ふふっ、どんな本を読んでるか、気になる？"
"2000008-7-ヒビキ" = "当ててみて？"
"2000008-8" = "[s1] \"間違いなくBL。\"\n[s2] \"科学専門誌？\"\n[s3] \"詩集……？\""
"2000008-9-ヒビキ" = "ふふっ、全部外れ。"
"2000008-10-ヒビキ" = "ふふっ、全部外れ。"
"2000008-11-ヒビキ" = "ふふっ、全部外れ。"
"2000008-12-ヒビキ" = "じゃん、これだよ。"
"2000008-13" = "[s] \"『少女のための心理学概論』？\""
"2000008-14-ヒビキ" = "みんな、意外、って反応するんだよね。"
"2000008-15-ヒビキ" = "でも……最近、先生と色々な物を作りながら……"
"2000008-16-ヒビキ" = "合理性と同じぐらい、誰かの気持ちへの配慮を大切にしなきゃいけないと思った。"
"2000008-17-ヒビキ" = "物理学と心理学は全然違ってて、"
"2000008-18-ヒビキ" = "慣れない、というのが正直なところ。"
"2000008-19-ヒビキ" = "水に石を投げた時、なぜ水面に波紋が起きるのかを考えるのが、物理。"
"2000008-20-ヒビキ" = "人に言葉を投げかけた時、なぜ心に波紋が起きるのかを考えるのが、心理。"
"2000008-21-ヒビキ" = "今日はそういう……今の私に足りない部分をもっと勉強したくて。"
"2000008-22" = "そうすれば……先生にとって、もっと役立つ何かが作れるんじゃないかなって。"
"2000008-23-ヒビキ" = "ふふっ、褒めてくれてありがとう。"
"2000008-24-ヒビキ" = "ん？でも……"
"2000008-25-ヒビキ" = "先生は本を借りに来たんじゃないって？"
"2000008-26" = "[s] \"急な雨だったから、傘を借りたくて。\""
"2000008-27-ヒビキ" = "なるほど、そうだったんだ。"
"2000008-28-ヒビキ" = "それならちょうどいいものがある。私が作った……"
"2000008-29" = "[s] \"普通の傘で。\""
"2000008-30-ヒビキ" = "うーん、自爆機能が付いてるとかそういうのではないんだけど……。"
"2000008-31-ヒビキ" = "分かった。"
"2000008-32-ヒビキ" = "どんな注文にも答えるのが、ミレニアムのマイスターだから。"
"2000008-33-ヒビキ" = "じゃあこっち、この傘は……"
"2000008-34-ヒビキ" = "これまでの「傘」という概念の枠組み、パラダイムを完全に変えてしまうもの。"
"2000008-35" = "[s] \"お願いだから普通の傘で……。\""
"2000008-36-ヒビキ" = "うーん、仕方ない。"
"2000008-37-ヒビキ" = "普通の傘……私のなら……。"
"2000008-38-ヒビキ" = "……。"
"2000008-39-ヒビキ" = "……ふふっ。"
"2000008-40-ヒビキ" = "一緒に入っていく？"
"2000008-41-ヒビキ" = "シャーレまでなら、私の通り道だから。"
"2000008-42-ヒビキ" = "あ、ちょっとだけ待ってて。#n本を借りてくる。"
"2000008-43-ヒビキ" = "さ、行こう、先生。"
"2000008-44-ヒビキ" = "……たまには普通の傘もいいね。"
