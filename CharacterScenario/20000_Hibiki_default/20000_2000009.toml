[translation]
"2000009-1" = "この夜をあなたに！"
"2000009-2" = "ミレニアム・廊下"
"2000009-3-ヒビキ" = "先生！"
"2000009-4-ヒビキ" = "来てくれたんだね。"
"2000009-5-ヒビキ" = "ありがとう、でもちゃんと挨拶する時間もなさそう。"
"2000009-6-ヒビキ" = "さっき、橋の向こうにあるミレニアム第1発電所で、誰かがいたずらをしたの。"
"2000009-7-ヒビキ" = "おそらくミレニアムをよく思ってない、どこかの不良集団の仕業じゃないかと思うけど。"
"2000009-8-ヒビキ" = "このままだとミレニアムへの電力供給が途切れる。"
"2000009-9-ヒビキ" = "今は明るいからいいけど、"
"2000009-10-ヒビキ" = "夜になるまでにこの事態を解決できなければ……"
"2000009-11-ヒビキ" = "ミレニアムは、暗闇に包まれてしまう。"
"2000009-12" = "[s] \"そんな大げさな……。\""
"2000009-13-ヒビキ" = "冗談を言ってるわけじゃない。"
"2000009-14-ヒビキ" = "科学の先端にある学校だから、ここではロウソクやランプも珍しい。"
"2000009-15-ヒビキ" = "それに……今夜から、ミレニアムの夜景を楽しむイベントが始まるのに……。"
"2000009-16-ヒビキ" = "この日を待っていた生徒たちは……きっと多いはず。"
"2000009-17-ヒビキ" = "……私も、その一人。"
"2000009-18-ヒビキ" = "私にできることは、壊れた発電所を修理すること。"
"2000009-19-ヒビキ" = "他のエンジニア部の先輩たちは、内部側の修理に全力を尽くしてる。"
"2000009-20-ヒビキ" = "発電所の方は、私が行かなきゃいけない。"
"2000009-21-ヒビキ" = "手伝ってほしい、先生。"
"2000009-22" = "ミレニアム第1発電所"
"2000009-23-ヒビキ" = "これは……思ったより深刻。"
"2000009-24-ヒビキ" = "多分不良集団を追い出すときに、激しい戦闘があったんだと思う。"
"2000009-25-ヒビキ" = "……言ってても仕方ない、先生、始めよう！"
"2000009-26-ヒビキ" = "まずは1番コアを確認……やっぱり、完全に壊れてる。"
"2000009-27-ヒビキ" = "持ってきた補助コアに取り換えて……よし……1番コア連結！"
"2000009-28-ヒビキ" = "エネルギーの稼働を確認。良かった。電源部は無事みたい。"
"2000009-29-ヒビキ" = "でも……このままじゃきりがない。"
"2000009-30-ヒビキ" = "もし13番コアまで全部この状態だったら……"
"2000009-31-ヒビキ" = "このまま順番に直していっても……#n夜までに、間に合わないかもしれない。"
"2000009-32-ヒビキ" = "3番コアを確認！#n幸い、状態はひどくないから電線の修理さえすれば……。"
"2000009-33-ヒビキ" = "7番コアも……何とか修理完了。#nはあ、ようやく繋がった。"
"2000009-34" = "[s1] \"ちょっと休んだら……？\"\n[s2] \"あとどれぐらい残ってる？\""
"2000009-35-ヒビキ" = "……まだこれで、やっと半分ぐらいだから。"
"2000009-36-ヒビキ" = "……まだこれで、やっと半分ぐらいだから。"
"2000009-37-ヒビキ" = "どうしよう、このまま時間までに間に合わなかったら……。"
"2000009-38-ヒビキ" = "……ぐすっ。"
"2000009-39" = "[s3] \"諦めないで。\"\n[s4] \"一日ぐらい、文明の助けなしで生活するのも悪くないよ。\""
"2000009-40-ヒビキ" = "……うん。"
"2000009-41-ヒビキ" = "……嫌だ！"
"2000009-42-ヒビキ" = "諦め……られない。"
"2000009-43-ヒビキ" = "もし、このまま時間に間に合わないとしても……"
"2000009-44-ヒビキ" = "ここで諦めてしまったら、ミレニアムのマイスターとはいえない。"
"2000009-45-ヒビキ" = "……そう思わない？先生。"
"2000009-46-ヒビキ" = "……よし、やろう。"
"2000009-47-ヒビキ" = "せめて、やれるところまで……ん？"
"2000009-48-ヒビキ" = "……8番……良好？"
"2000009-49-ヒビキ" = "ま、まさか！？"
"2000009-50-ヒビキ" = "きゅ、9番もほぼ新品状態？"
"2000009-51-ヒビキ" = "お、思っていたより早く終わるかもしれない！"
"2000009-52-ヒビキ" = "先生！"
"2000009-53-ヒビキ" = "急いで！"
"2000009-54-SYSTEM" = "13番コアまで連結されました。システムを再起動します。"
"2000009-55" = "（ウイィィィィィン……）"
"2000009-56-ヒビキ" = "お願い……お願い……。"
"2000009-57" = "（……ピロン）"
"2000009-58-ヒビキ" = "っ！成功！"
"2000009-59-ヒビキ" = "ほ、本当にありがとう、先生！"
"2000009-60-ヒビキ" = "おかげで発電所の動力を全部再起動することができた。"
"2000009-61-ヒビキ" = "もちろん応急処置な部分も多いから、後できちんと整備しなきゃいけないけど。"
"2000009-62-ヒビキ" = "……。"
"2000009-63-ヒビキ" = "……先生、手伝ってくれたお返しがしたい。"
"2000009-64-ヒビキ" = "前に、花火よりすごいものを見せてあげるって約束したの……覚えてる？"
"2000009-65-ヒビキ" = "お返しとして、良いものを見せてあげられそうだから。"
"2000009-66-ヒビキ" = "ちょっと外に出てみない？"
"2000009-67-ヒビキ" = "もう何度目か分からないけど……あらためて。"
"2000009-68" = "[wa:1000]― ありがとう、[wa:500]先生。[wa:1500]この風景は、[wa:1000]先生のおかげで叶ってるの。"
"2000009-69" = "― 美しいでしょ？[wa:2700]間に合ってよかった。"
"2000009-70" = "― うん？[wa:1000]どうして[wa:1000]そんなに……[wa:1000]頑張ったのかって？"
"2000009-71" = "― ミレニアムの生徒たちが、[wa:1700]安全に……。"
"2000009-72" = "― 輝く夜道が歩けるようにしてあげたかったから。"
"2000009-73" = "[wa:500]― 私にできることは……[wa:1800]これくらいしかないから。"
"2000009-74" = "― そして[wa:800]私にとって……。"
"2000009-75" = "― こういう瞬間は[wa:1600]すでに[wa:400]「プレゼント」以上の、素敵なものなの。"
"2000009-76" = "[wa:3000]― どう、[wa:500]先生？[wa:1500]まだ時間はあるから……。"
"2000009-77" = "― もう少し……[wa:1300]一緒にいてくれる？"
"2000009-78-ヒビキ" = "変な気分だね。"
"2000009-79-ヒビキ" = "毎日見てた、見慣れた風景なのに。"
"2000009-80-ヒビキ" = "先生と一緒だと……こんなにも……。"
"2000009-81-ヒビキ" = "……。"
"2000009-82-ヒビキ" = "……きれい。"
