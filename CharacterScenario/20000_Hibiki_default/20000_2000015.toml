[translation]
"2000015-1" = "愛着のかたち"
"2000015-2" = "（部室の奥から、整備の音が聞こえる）"
"2000015-3" = "[ns] \"ヒビキ、着いたよ～！”"
"2000015-4-ヒビキ" = "あ、先生。#nちょっと待ってて。"
"2000015-5-ヒビキ" = "はい、先生の自転車。"
"2000015-6" = "[s1] \"きれいに直ってる！”\n[s2] \"ありがとう、ヒビキ！”"
"2000015-7-ヒビキ" = "本当はこの機会にいろいろ改造しようと思ったんだけど――"
"2000015-8-ヒビキ" = "「修理だけにして」って、先生に何度も言われたから……"
"2000015-9-ヒビキ" = "安全のためにも、高速榴弾発射機や火炎放射器くらいはつけたかった……。"
"2000015-10" = "[s] \"つけたら安全じゃなくなりそうだけど……。\""
"2000015-11-ヒビキ" = "タイヤだけ変えない？#nチタンエアレス素材に。"
"2000015-12-ヒビキ" = "スパイクストリップでタイヤが損傷する可能性もあるから……。"
"2000015-13" = "[s3] \"いや、大丈夫……。\"\n[s4] \"ふつうの自転車で十分だよ……。\""
"2000015-14-ヒビキ" = "先生がそこまで言うなら……今回は我慢する。"
"2000015-15" = "[s] \"気を遣ってくれてありがとう、ヒビキ。\""
"2000015-16-ヒビキ" = "先生はどうして改造したがらないの？#nロマンがあるのに。"
"2000015-17-ヒビキ" = "……ありのままの良さ？"
"2000015-18-ヒビキ" = "もちろん純正品の美しさは尊重するよ。#n本来の姿に意味があるとも思ってる。"
"2000015-19-ヒビキ" = "けど、改造による機能の追加は、いわば効率性の極大化。"
"2000015-20-ヒビキ" = "各々の機能を、一つのツールに集約させて手間を省くの。#n便利じゃない？"
"2000015-21-ヒビキ" = "改造を拒む理由、ないと思うんだけど……。"
"2000015-22" = "[s5] \"言われてみれば……\"\n[s6] \"ヒビキの言う通りかも？\""
"2000015-23-ヒビキ" = "ふふ、そうでしょ？"
"2000015-24-ヒビキ" = "……そうだ、効率の極大化といえば――"
"2000015-25-ヒビキ" = "これ、見てくれる？"
"2000015-26" = "[ns] \"これは……ヒビキのゴーグル？\""
"2000015-27-ヒビキ" = "このゴーグルは何回も改造してるんだ。"
"2000015-28-ヒビキ" = "超多用途というか、値段をつけられないスーパーブランド品というか……。"
"2000015-29-ヒビキ" = "これがないと作業に支障が出ちゃうくらい。"
"2000015-30" = "[s] \"マイスターの自信作、なんだね！\""
"2000015-31-ヒビキ" = "うん。まず、目の保護機能はもちろんのこと――"
"2000015-32-ヒビキ" = "溶接の炎や砂漠の砂塵、自由落下の時に発生する風圧も難なく防げる。"
"2000015-33-ヒビキ" = "防弾、ブルーライトカット、UVカット機能と……"
"2000015-34-ヒビキ" = "拡大縮小機能もついてるよ。#n裁縫するときに有効活用してる。"
"2000015-35" = "[s] \"裁縫って……コスプレ衣装の？\""
"2000015-36-ヒビキ" = "うん。衣装とか小道具を作るときに。"
"2000015-37-ヒビキ" = "裁縫って繊細な作業なんだ。#n用途や表現したいものに応じて適切な方法で縫い込まないといけない。"
"2000015-38-ヒビキ" = "最新のミシンを使うとしても、狭いところに繰り返し糸を通す作業は、決して簡単じゃない。クッキリ見えるかどうかは大事なの。"
"2000015-39-ヒビキ" = "それで15焦点レンズ機能を入れたんだ。#n最大限まで拡大すれば分子単位の観測も可能だよ。"
"2000015-40" = "[s7] \"や、やりすぎじゃない？？\"\n[s8] \"裁縫に分子まで観測する場面ってある！？\""
"2000015-41-ヒビキ" = "そういう機能も搭載してるって話。"
"2000015-42-ヒビキ" = "他にはどんな機能があると思う？"
"2000015-43" = "[s] \"戦闘に役立つもの、とか？\""
"2000015-44-ヒビキ" = "正解。GPS結合型光学測量機能も追加してある。"
"2000015-45-ヒビキ" = "これさえあれば、観測手やオペレーターがいなくても迫撃砲を発射できるの。"
"2000015-46-ヒビキ" = "赤外線検知機能？#nもちろんついてるよ。夜間作戦の遂行も余裕。"
"2000015-47-ヒビキ" = "マイスターとして、一人の生徒として。#n必要な機能はすべて搭載してるの。"
"2000015-48" = "[s] \"じゃあ、もしかしてそのゴーグルに……\""
"2000015-49" = "[ns] \"ヒビキの好きな自爆機能も……？”"
"2000015-50-ヒビキ" = "えっと……自爆……機能……？"
"2000015-51" = "[s] \"発明品の大半に自爆機能をつけてなかったっけ？\""
"2000015-52-ヒビキ" = "うーん……このゴーグルに……"
"2000015-53-ヒビキ" = "自爆機能はついてないよ。"
"2000015-54-ヒビキ" = "たしかにマイスターの発明品に自爆機能は必須だけど……"
"2000015-55-ヒビキ" = "このゴーグルには、なぜか入れる気にならなかったというか……"
"2000015-56-ヒビキ" = "……"
"2000015-57-ヒビキ" = "どうしてだろ。まだマイスターとしての心構えが足りないのかも。"
"2000015-58" = "[ns] \"その気持ち、わかるよ。\""
"2000015-59-ヒビキ" = "うん？"
"2000015-60" = "[s9] \"そのゴーグルは、ヒビキにとって大切なものだから。\"\n[s10] \"愛着があるものが爆発してしまうのは、嫌だったんじゃないかな。\""
"2000015-61-ヒビキ" = "……"
"2000015-62-ヒビキ" = "たぶん……そうだと思う。"
"2000015-63-ヒビキ" = "このゴーグルは……私がずっと前から使ってきたものだし。"
"2000015-64-ヒビキ" = "最初はデザインがすごく気に入って……追加したい機能を思いつく度に、#n一生懸命改造をして……"
"2000015-65-ヒビキ" = "長い間、共に歩んできた……"
"2000015-66-ヒビキ" = "うん……私にとって大切なものなの。"
"2000015-67-ヒビキ" = "自爆機能を入れなかったのは、多分……"
"2000015-68-ヒビキ" = "無くなってほしくなかったから。"
"2000015-69-ヒビキ" = "それが想定や仮定の話であったとしても。"
"2000015-70" = "[s11] \"これからもずっと一緒だといいね！\"\n[s12] \"爆発しなければ、だけど。\""
"2000015-71-ヒビキ" = "……うん。だといいな。"
"2000015-72" = "[ns] \"ヒビキ？\""
"2000015-73-ヒビキ" = "ふふっ……何でもない。"
"2000015-74-ヒビキ" = "……ちょっと思っただけ。"
"2000015-75-ヒビキ" = "先生にも、自爆機能はいらないかなって。"
"2000015-76" = "[s] \"つけないでね！？\""
"2000015-77-ヒビキ" = "これからもずっと……よろしくね。"
