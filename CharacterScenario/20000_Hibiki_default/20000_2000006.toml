[translation]
"2000006-1" = "もしも夢を見られるのなら、あなたと共に一日を"
"2000006-2" = "ミレニアム・エンジニア部"
"2000006-3-ヒビキ" = "睡眠は大事。"
"2000006-4-ヒビキ" = "まあ、私は横になれるなら、棺の中でも気にしないけど。"
"2000006-5-ヒビキ" = "不眠というものは辛いものらしい。"
"2000006-6-ヒビキ" = "私の周りにも、それで辛そうにしてる人が多いから。"
"2000006-7-ヒビキ" = "うん？……クマがひどくなった気がするって？"
"2000006-8-ヒビキ" = "いや……私はただ、徹夜のしすぎで。"
"2000006-9-ヒビキ" = "……。"
"2000006-10-ヒビキ" = "……あ、あんまりじっと見ないで。"
"2000006-11-ヒビキ" = "とにかく、よく眠れない人たちにとって、夜は苦しくて辛い時間になってる。"
"2000006-12-ヒビキ" = "だから、とりあえずは二つほど試作品を用意してみた。"
"2000006-13-ヒビキ" = "一つ目、これの名前は……"
"2000006-14-ヒビキ" = "「気絶マシン」。"
"2000006-15" = "[s1] \"名前から深刻なエラーが発見されてるみたいだけど。\"\n[s2] \"枕かな？\""
"2000006-16-ヒビキ" = "気のせいだよ。"
"2000006-17-ヒビキ" = "一応、寝具の形をしてるけどね。"
"2000006-18-ヒビキ" = "人によって差はあるだろうけど……。"
"2000006-19-ヒビキ" = "人は一日の、いや人生の1/3をベッドの上で過ごすらしい。"
"2000006-20-ヒビキ" = "だから、寝具に投資をすることは、人生の1/3を心地良く過ごせるようにしてくれる選択だと言える。"
"2000006-21-ヒビキ" = "とりあえず、この枕型の機械の上に横になってくれる？"
"2000006-22-ヒビキ" = "ん？熟睡はしたいけど、気絶はしたくない？"
"2000006-23-ヒビキ" = "うーん、私も人体工学にはあまり自信ないけど。"
"2000006-24-ヒビキ" = "たまに気絶した後、まるで長い時間寝て起きたみたいに気持ちよかった、って話を聞いたことない？"
"2000006-25-ヒビキ" = "うん？とにかく気絶はダメ？"
"2000006-26-ヒビキ" = "うーん、それもそうかも。"
"2000006-27-ヒビキ" = "まあ、これはプロトタイプに過ぎない。"
"2000006-28-ヒビキ" = "もっと先生を満足させられる……他の作品もあるから。"
"2000006-29-ヒビキ" = "その名も……"
"2000006-30-ヒビキ" = "「失神鉄パイプ」、というものだけど……。"
"2000006-31-ヒビキ" = "あっ、なんでそんなに離れるの。"
"2000006-32-ヒビキ" = "先生、また誤解してるみたいだね。"
"2000006-33-ヒビキ" = "多少古典的な方法だけれど……#nこの失神鉄パイプの効果は検証されてる。"
"2000006-34" = "[s] \"一歩間違えたら永遠に眠れそう。\""
"2000006-35-ヒビキ" = "あ、誤解しないで。これで先生の後頭部を殴るとか、"
"2000006-36-ヒビキ" = "そういう古典的な方法ではないから。"
"2000006-37-ヒビキ" = "この鉄パイプには……"
"2000006-38-ヒビキ" = "私の一番のお気に入り機能が付いてるの。"
"2000006-39" = "[s3] \"自爆機能……？\"\n[s4] \"殺傷機能……？\""
"2000006-40-ヒビキ" = "Bluetoothスピーカー機能だよ。"
"2000006-41-ヒビキ" = "Bluetoothスピーカー機能だよ。"
"2000006-42-ヒビキ" = "この鉄パイプには、聞くだけで眠くなってくる物理学講義10講とか……。"
"2000006-43-ヒビキ" = "約200曲の睡眠誘導音楽を、好きなように出力できるの。"
"2000006-44" = "[s5] \"一度試してみようかな？\"\n[s6] \"それで眠れるわけ……。\""
"2000006-45-ヒビキ" = "本当に？"
"2000006-46-ヒビキ" = "本当に？"
"2000006-47-ヒビキ" = "じゃあ試してみよう、先生。#nとりあえず簡単な寝具は用意したから。"
"2000006-48-ヒビキ" = "一度横になってみる？"
"2000006-49-ヒビキ" = "よし。じゃ、音楽を流すね。"
"2000006-50-ヒビキ" = "失神鉄パイプ……起動。"
"2000006-51-ヒビキ" = "……。"
"2000006-52-ヒビキ" = "……ふふっ。#n先生、疲れてたみたいだね。"
"2000006-53-ヒビキ" = "ほぼ音が流れ始めた瞬間に、意識を失ってた。"
"2000006-54-ヒビキ" = "今回の作品も……おかげでいい評価がもらえそう。"
"2000006-55-ヒビキ" = "それに……"
"2000006-56-ヒビキ" = "……ふふっ。"
"2000006-57-ヒビキ" = "寝顔、可愛かったよ。"
