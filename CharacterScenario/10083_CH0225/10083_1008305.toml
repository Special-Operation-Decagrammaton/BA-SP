[translation]
"1008305-1" = "隠したかった思い"
"1008305-2" = "百鬼夜行・商店街"
"1008305-3" = "（キキョウとの約束はキャンセルになったが、他の業務があったため百鬼夜行を訪れた）"
"1008305-4" = "[ns] \"陰陽部の件は解決、と……\""
"1008305-5-商店街の住人" = "これはこれは、シャーレの先生じゃないですか。"
"1008305-6-商店街の住人" = "今日はどうされたんですか？"
"1008305-7" = "[s] \"今日はシャーレの仕事があったもので。\""
"1008305-8-商店街の住人" = "はは、今日もお忙しそうですね。"
"1008305-9-商店街の住人" = "ですが、そのおかげで私たちは助かっていますし、ありがたいことです。"
"1008305-10-商店街の住人" = "そうでした。先日、問題児がまた暴れていたのですが、そのときは百花繚乱の方々にも助けていただきましてね。"
"1008305-11-商店街の住人" = "たしか……キキョウさん、だったか。#n的確に指示を出す姿が印象的で覚えていますよ。"
"1008305-12" = "[s] \"そうだったんですね、キキョウが……\""
"1008305-13-商店街の住人" = "先生はたしか、百花繚乱の方ともよく一緒に居ましたよね？"
"1008305-14-商店街の住人" = "ちょうど良かった。"
"1008305-15-商店街の住人" = "こちら、当店の和菓子です。よろしければ受け取ってください。百花繚乱の皆さんにも、よろしくお伝えいただけると助かります。"
"1008305-16" = "[s] \"あっ、はい。ありがたく頂きます。\""
"1008305-17-商店街の住人" = "今度は生徒さんと一緒にいらしてください。#nその際は、たっぷりおもてなし致しますので。はははっ。"
"1008305-18" = "[ns] \"こんなにもらっちゃって良かったのかな……？\""
"1008305-19" = "（思わぬ出来事に戸惑っていると……）"
"1008305-20-百鬼夜行の生徒A" = "あっ！先生だ！"
"1008305-21-百鬼夜行の生徒A" = "今日もパトロール？"
"1008305-22-百鬼夜行の生徒A" = "なんだ、違ったのか～じゃあキキョウさんは一緒じゃないんですね。"
"1008305-23-百鬼夜行の生徒A" = "キキョウさんに用事があったのかって？#nん～そうじゃないんですけど～前に助けてもらったから、お礼がしたくて。"
"1008305-24-百鬼夜行の生徒A" = "うーん……そうだ！"
"1008305-25-百鬼夜行の生徒A" = "これ、キキョウさんに渡そうと思ってたんだけど、直接渡すのはちょっと恥ずかしいし……"
"1008305-26" = "[s] \"それじゃあ、代わりに渡しておくね。\""
"1008305-27-百鬼夜行の生徒A" = "ほんと！？ありがと、せんせ！"
"1008305-28-魚屋のおやじ" = "おお、シャーレの先生じゃないか。今日も仕事かい？#nあはは、そうやって仕事ばっかしてたら、いつか倒れるかもしれないぞ？"
"1008305-29-魚屋のおやじ" = "……なるほど、百花繚乱が戻ってきたから仕事量が減ったのか？#nそりゃ良かった！"
"1008305-30-魚屋のおやじ" = "そういえば、キキョウって子に取引先とのトラブルを解決してもらったな……"
"1008305-31-魚屋のおやじ" = "本当に賢いお嬢さんだ。"
"1008305-32-魚屋のおやじ" = "よし、そうだな。仕入れてきたばかりの新鮮な魚をやろう！#n二匹渡すから、お嬢ちゃんと一緒に食べてくれ！"
"1008305-33" = "[ns] \"百花繚乱が戻ってきてくれて良かった、か……\""
"1008305-34" = "（色々なところで百花繚乱の活躍を聞き、自分のことのように嬉しくなった）"
"1008305-35" = "[ns] \"……忙しいかもしれないけど、顔だけでも見せに行こうかな。\""
"1008305-36" = "（……調停室を訪ねてみたが、反応は無かった）"
"1008305-37" = "[ns] \"そろそろ戻ってると思ったんだけど……\""
"1008305-38" = "[ns] \"勝手に入るのは失礼だし、また今度に……\""
"1008305-39" = "（また今度にしようと思い、踵を返したところ……）"
"1008305-40-？？？" = "う、うぅ…………"
"1008305-41" = "[ns] \"……キキョウ？\""
"1008305-42" = "はぁ……はあ……"
"1008305-43" = "[ns] \"キキョウ！？\""
"1008305-44" = "[ns] \"……すごい熱！？ちょっとごめんね？\""
"1008305-45-キキョウ" = "……ここは？"
"1008305-46" = "[s] \"キキョウ、大丈夫？気がついた？\""
"1008305-47-キキョウ" = "先生……？どうしてあんたが……？"
"1008305-48-キキョウ" = "百鬼夜行に用事があったの……？"
"1008305-49-キキョウ" = "あんたって、本当に……"
"1008305-50-キキョウ" = "ゲホッゲホッ……！"
"1008305-51" = "[ns] \"こんなに体調が悪かったなら、言ってくれても……\""
"1008305-52-キキョウ" = "……別に、これくらい。"
"1008305-53" = "[s1] \"メッセージがおかしかったのは……\"\n[s2] \"約束を別の日にしようって言ってたのは……\""
"1008305-54-キキョウ" = "おかしく、ない。"
"1008305-55-キキョウ" = "……あれは、押し間違えただけ。"
"1008305-56-キキョウ" = "誰にでもあるでしょ。"
"1008305-57-キキョウ" = "ちょっと体調を崩したくらいで、先生は気にしすぎだから。"
"1008305-58-キキョウ" = "でも結局、見られちゃうなんてね……"
"1008305-59-キキョウ" = "それは……"
"1008305-60-キキョウ" = "……もう、言い訳できないか。"
"1008305-61-キキョウ" = "あんたにこんな姿……見せたくなかった。"
"1008305-62-キキョウ" = "自分から約束したくせに、体調管理すらできない無責任な私を……"
"1008305-63-キキョウ" = "……立っているのすらままならない、こんな醜態を晒しちゃって。"
"1008305-64-キキョウ" = "あんたに迷惑を、かけるとか。"
"1008305-65-キキョウ" = "これじゃあ……作戦参謀として失格だね。#nたかが風邪で……"
"1008305-66" = "[s] \"日頃の疲れが溜まってるんじゃない？\""
"1008305-67-キキョウ" = "疲れ？そんなわけないでしょう。"
"1008305-68-キキョウ" = "百花繚乱の作戦参謀ともあろう者が……"
"1008305-69-キキョウ" = "……なに、これ？"
"1008305-70" = "[s] \"ここに来る途中で、みんなにもらったんだ。\""
"1008305-71" = "（百花繚乱にお礼をしたいと言って渡された贈り物の量を見て、キキョウは目を丸くした）"
"1008305-72" = "[ns] \"いつも頑張ってるんだね。\""
"1008305-73-キキョウ" = "……当然でしょ。"
"1008305-74-キキョウ" = "ここしばらく、まともに活動できてなかったから。"
"1008305-75-キキョウ" = "……その埋め合わせをしただけ。"
"1008305-76-キキョウ" = "私たちにできることなら何だってする。#n……そうでもしないと、信頼を取り戻せないし。"
"1008305-77" = "[s] \"キキョウ……\""
"1008305-78-キキョウ" = "ゲホ、ゲホッ！"
"1008305-79-キキョウ" = "そう……ただ、それだけ。"
"1008305-80-キキョウ" = "周りから甘く見られるのも、弱い姿を見せるのも嫌。"
"1008305-81-キキョウ" = "まだ戻ってきたばかりだから仕方ない、なんて言われるのも嫌。"
"1008305-82-キキョウ" = "これは私の意地。作戦参謀として、こう在りたいというワガママ。"
"1008305-83-キキョウ" = "だから、もう十分。先生も忙しいんだし、これ以上は時間の無駄。#n私は別に一人でも……"
"1008305-84" = "[ns] \"今は大人しく横になってて。\""
"1008305-85-キキョウ" = "ちょ、ちょっと……い、今はそんなに近づかないで。"
"1008305-86" = "[s] \"休息も大切なことくらい、キキョウも分かってるんだよね？\""
"1008305-87-キキョウ" = "いや、あれは……"
"1008305-88-キキョウ" = "それに……私の話、聞いてた？#n弱い姿を見せるのは嫌。それは、あんたも例外じゃない。"
"1008305-89" = "[s] \"私はキキョウの事、弱いだなんて思ってないよ。\""
"1008305-90-キキョウ" = "なっ……"
"1008305-91" = "[s3] \"生徒が苦しんでたら、助けるものだから。\"\n[s4] \"先生として、当たり前でしょ？\""
"1008305-92" = "[ns5] \"でも、もし頼りづらかったら……\"\n[ns6] \"都合の良いように使ってもらっても構わないよ。\""
"1008305-93" = "[ns] \"「どんな手段だって厭わない」んでしょ？\""
"1008305-94-キキョウ" = "……また、そうやって。"
"1008305-95-キキョウ" = "それで、あんたに何の得があるの……？"
"1008305-96-キキョウ" = "私には、何も返せない。"
"1008305-97-キキョウ" = "そう……何も、返せないのに……"
"1008305-98-キキョウ" = "私には、あんたに何もしてあげられないのに……"
"1008305-99-キキョウ" = "…………。"
"1008305-100-キキョウ" = "あんたみたいな人、初めて。"
"1008305-101-キキョウ" = "変な人。"
"1008305-102-キキョウ" = "……本当に。"
"1008305-103-キキョウ" = "…………変な人。"
"1008305-104" = "[s] \"わざわざ2回も言わなくても……\""
"1008305-105-キキョウ" = "……ふん、思ったことを言っただけだから。"
"1008305-106-キキョウ" = "……ゲホゲホッ！"
"1008305-107-キキョウ" = "はあ……いいよ。#nどうぞ、勝手に、すれば……"
"1008305-108-キキョウ" = "でも、ね……先生。"
"1008305-109-キキョウ" = "あんたが言ったんだから。"
"1008305-110-キキョウ" = "その言葉、後悔しないでね。"
"1008305-111-キキョウ" = "百花繚乱の作戦参謀は……とても……"
"1008305-112-キキョウ" = "こわい、ん……だから……"
"1008305-113-キキョウ" = "…………。"
"1008305-114" = "[s] \"うん。後悔しないよ、絶対に。\""
"1008305-115" = "[ns] \"おやすみ、キキョウ。\""
