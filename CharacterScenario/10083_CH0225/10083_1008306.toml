[translation]
"1008306-1" = "こころ開いて"
"1008306-2" = "[ns] \"言われた通り、調停室に来たけど……\""
"1008306-3-キキョウ" = "裏の倉庫で待ってるから。"
"1008306-4" = "[ns] \"裏に倉庫なんてあったんだ。\""
"1008306-5" = "（横を抜けて裏に回ると、すぐに倉庫らしき建物が見つかった）"
"1008306-6" = "[ns] \"キキョウ、入るよ？\""
"1008306-7" = "[wa:500]― [log=키쿄]間に合ったね。[wa:1450]先生。[/log]"
"1008306-8" = "― [log=키쿄]相変わらず、[wa:1300]間抜けな顔。[/log]"
"1008306-9" = "[ns] \"今日のキキョウは、何だか雰囲気が違うね。\""
"1008306-10" = "[wa:550]― [log=키쿄]まあね……[wa:1650]ある人が言ってたんだ。[/log]"
"1008306-11" = "― [log=키쿄]休息を取る事は、[wa:1750]働くのと同じぐらい、[/log]"
"1008306-12" = "[wa:100]― [log=키쿄]いや、[wa:1000]それ以上に大事だ、[wa:1550]って。[/log]"
"1008306-13" = "[wa:250]― [log=키쿄]ふふ、[wa:1650]優秀な参謀は、[/log]"
"1008306-14" = "― [log=키쿄]他人の金言も[wa:900]ちゃんと覚えているんだよ。[/log]"
"1008306-15" = "[wa:500]― [log=키쿄]みて、[wa:1300]先生にオススメしたい本、[/log]"
"1008306-16" = "― [log=키쿄]こんなにたくさんあるの。[/log]"
"1008306-17" = "― [log=키쿄]あ、[wa:850]その前に……[/log]"
"1008306-18" = "― [log=키쿄]部屋の掃除と、 [wa:1300]緑茶を一杯、[wa:1500]お願いできるかな。[/log]"
"1008306-19" = "― [log=키쿄]自分で言いだしたことでしょう？[/log]"
"1008306-20" = "― [log=키쿄]断ったりしないよね？[/log]"
"1008306-21" = "[ns] \"もちろんだよ！\""
"1008306-22" = "[wa:950]― [log=키쿄]そうだ……[wa:1450]あんたってそういう人だった……[/log]"
"1008306-23" = "― [log=키쿄]知ってたけど。[/log]"
"1008306-24" = "― [log=키쿄]まぁいっか。[/log]"
"1008306-25" = "[wa:100]― [log=키쿄]桐生キキョウは、[wa:1550]せっかくの機会を[wa:1000]棒に振る真似はしない。[/log]"
"1008306-26" = "― [log=키쿄]全身全霊で甘えるから、[/log]"
"1008306-27" = "[wa:200]― [log=키쿄]覚悟しててね……[wa:2150]ふふ。[/log]"
"1008306-28" = "（そうして、いつもとは違う表情を浮かべるキキョウと遅くまで過ごした）"
