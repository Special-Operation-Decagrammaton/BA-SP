[translation]
"1002103-1" = "そばにいるから"
"1002103-2" = "（ざわざわ……）"
"1002103-3" = "[s] \"……？\""
"1002103-4" = "（慌てて走ってきたけれど、そこでは特に戦闘が起きているわけでもなく、珍しく銃声も響き渡っていなかった）"
"1002103-5" = "（たどり着いたのは海の家。そのすぐそばには、きょろきょろと忙しなく周囲を見ているアズサがいた）"
"1002103-6-アズサ" = "……。"
"1002103-7" = "[s] \"……アズサ？\""
"1002103-8-アズサ" = "……あ、先生。"
"1002103-9-アズサ" = "こんなに早く来てくれると思わなかった、ありがとう。"
"1002103-10" = "[s] \"助けが必要って……。\""
"1002103-11-アズサ" = "そう、先生の手助けが必要。今、だいぶ難しい状況に陥ってて……。"
"1002103-12-アズサ" = "その、何と言えば良いのか……"
"1002103-13" = "（アズサは無言のまま、海の家の看板をチラッと見る）"
"1002103-14" = "（そこには「限定焼きそば！先着順です！」と大きく書かれていた）"
"1002103-15" = "（すでに並んでる人たちを見る限り、今から並んでもギリギリ間に合うかどうか……）"
"1002103-16-アズサ" = "えっと、実は……。"
"1002103-17-アズサ" = "その……。"
"1002103-18" = "[s] \"並んでまで買うのがちょっと恥ずかしい……みたいな？\""
"1002103-19-アズサ" = "……っ！"
"1002103-20" = "[s1] \"なるほど、了解。\"\n[s2] \"「限定」って書かれると気になっちゃうよね。\""
"1002103-21-アズサ" = "えっと、その、どうしてもってわけじゃなくて……。"
"1002103-22-アズサ" = "えっと、その、どうしてもってわけじゃなくて……。"
"1002103-23-アズサ" = "……え？買ってくれるの……？……ほ、本当に？"
"1002103-24" = "[s3] \"私はアズサの先生だからね。\"\n[s4] \"これくらい、喜んで！\""
"1002103-25-アズサ" = "そこまで言ってくれるなら、じゃあ……。"
"1002103-26-アズサ" = "そこまで言ってくれるなら、じゃあ……。"
"1002103-27-アズサ" = "……お願い。この借りは、必ず返すから。"
"1002103-28-アズサ" = "……ありがとう、先生。"
"1002103-29" = "（幸い、ギリギリのところで売り切れずに済み、アズサと一緒に焼きそばを食べた）"
"1002103-30" = "（限定版の味は、正直何とも言えない感じだったけれど……）"
"1002103-31-アズサ" = "……はむ。"
"1002103-32" = "[s] \"……どう？\""
"1002103-33-アズサ" = "……ん？"
"1002103-34-アズサ" = "うん、すごく美味しい。期待以上だ。"
"1002103-35-アズサ" = "先生は？"
"1002103-36-アズサ" = "……何だか微妙な表情だね。思っていたのとは違った？"
"1002103-37" = "[s5] \"ううん、普通に美味しかったよ。\"\n[s6] \"アズサが美味しかったなら、それが何より。\""
"1002103-38-アズサ" = "……そっか。"
"1002103-39-アズサ" = "……そっか。"
"1002103-40-アズサ" = "……ふふっ。"
"1002103-41" = "[s] \"……アズサ？\""
"1002103-42-アズサ" = "いや、何でもない。"
"1002103-43-アズサ" = "美味しかったよ。今まで食べてきた、どの焼きそばよりも。"
"1002103-44-アズサ" = "……何でだろうね。本当に、心からそう感じる。"
"1002103-45" = "（その後焼きそばだけじゃ物足りず、二人でたくさん色々な話をしながら、仲良く追加でかき氷を買いに行った）"
"1002103-46" = "（そのかき氷は何となく、今まで食べたどのかき氷よりも美味しかった気がする）"
