[translation]
"1002105-1" = "私の世界"
"1002105-2" = "（お互いに思ったよりすぐ近くにいたので、アズサの元へ向かう。辿り着いたのは、夕焼けに染まった海辺だった）"
"1002105-3-アズサ" = "あ、先生。私の方から行くって言ったのに……"
"1002105-4" = "[s1] \"ううん、私がアズサを迎えに来たかったから。\"\n[s2] \"じゃあ、戦術的直感による戦略的話し合いをしよっか。\""
"1002105-5-アズサ" = "……はぁ。"
"1002105-6-アズサ" = "……はぁ。"
"1002105-7-アズサ" = "と、とにかく……えっと、先生のおかげで、ようやく少し海を楽しめるようになったけど……。"
"1002105-8-アズサ" = "……でも、もうあまり時間も残されてない。"
"1002105-9-アズサ" = "下調べをする時間も、そんなに無いし……。"
"1002105-10-アズサ" = "どうすれば残りの時間で、最大限効率的に海を楽しめるのか……。"
"1002105-11-アズサ" = "先生はどうすれば良いと思う？"
"1002105-12" = "[s3] \"効率的、かあ……。\"\n[s4] \"色んなものを、一気に楽しめるような何か……。\""
"1002105-13-アズサ" = "もうすでに、かなりの時間を使ってしまった。"
"1002105-14-アズサ" = "もうすでに、かなりの時間を使ってしまった。"
"1002105-15-アズサ" = "いや、そうは言っても、これまでの時間が無駄だったと言いたいわけじゃなくて……。"
"1002105-16-アズサ" = "……ん？"
"1002105-17-アズサ" = "良い方法がある？"
"1002105-18-アズサ" = "流石、先生に連絡して正解だった。じゃあ、この後は……"
"1002105-19-アズサ" = "……え？取り合えずついてきてほしい……？"
"1002105-20-アズサ" = "まあ、別に構わないけれど……。"
"1002105-21-アズサ" = "分かった、先生の選択を信じる。"
"1002105-22-アズサ" = "じゃあ、行こうか。"
"1002105-23-アズサ" = "……？"
"1002105-24-アズサ" = "……先生？"
"1002105-25-アズサ" = "えっと、これはどこに向かって……？"
"1002105-26-アズサ" = "もう20分くらいは歩いたけれど……。"
"1002105-27-アズサ" = "いや、先生のことを信じてないわけじゃない。ただ、作戦内容の確認というか……。"
"1002105-28-アズサ" = "海からは遠ざかってるような……？"
"1002105-29-アズサ" = "……どうして海から離れて、山の方に？"
"1002105-30-アズサ" = "それに、ぐるっと回って、またさっきまでいた海の方向へ向かっている気がするけど……。"
"1002105-31-アズサ" = "先生のことだし、何か理由があるはず……。"
"1002105-32-アズサ" = "……ん？"
"1002105-33-アズサ" = "もうすぐ着く？"
"1002105-34-アズサ" = "そうか、質問に対する答えにはなってない気がするけど。"
"1002105-35-アズサ" = "……先生のことは、信じてるから。"
"1002105-36-アズサ" = "んしょ……。"
"1002105-37-アズサ" = "……？"
"1002105-38-アズサ" = "これは、風の流れが……？"
"1002105-39-アズサ" = "この先は、もしかして……？"
"1002105-40-アズサ" = "……っ！"
"1002105-41" = "[wa:500]― わぁ……！[wa:2350]こんなの[wa:500]初めて……"
"1002105-42" = "― 目に映る[wa:700]全部がキラキラして、[wa:2550]すごい……"
"1002105-43" = "[wa:3000]― 何にも邪魔されずに、"
"1002105-44" = "― こうして[wa:500]何もかもを見渡せる場所があったなんて……。"
"1002105-45" = "― 何だか、[wa:1250]不思議な感覚……"
"1002105-46" = "[wa:1000]― 元々、[wa:1000]こういう開けた場所は[wa:1850]あまり[wa:500]好きじゃなかった。"
"1002105-47" = "― 隠れる場所も無いし、[wa:2450]周囲の警戒も大変で……"
"1002105-48" = "[wa:750]― でも今は……[wa:2300]全然不安じゃない。"
"1002105-49" = "[wa:500]― きっと[wa:450]これは、[wa:2600]うん……"
"1002105-50" = "[wa:750]― 今の私の視界には、[wa:3500]いつもこうやって……"
"1002105-51" = "― ……先生が、[wa:1850]いてくれるからかな。"
"1002105-52" = "……やっぱり、私の直感は間違ってなかった。"
"1002105-53" = "うん、思ってたよりずっと悪くない。ううん、むしろ……"
"1002105-54" = "……ありがとう。初めての海は、良い思い出になった。"
"1002105-55" = "……ふふっ。"
"1002105-56-アズサ" = "……本当に、ありがとう。先生。"
