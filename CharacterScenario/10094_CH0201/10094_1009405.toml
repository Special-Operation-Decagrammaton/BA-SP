[translation]
"1009405-1" = "メイドの休息！"
"1009405-2" = "[ns] \"あれ？行き先はゲーム開発部の部室じゃないの？\""
"1009405-3-モモイ" = "う～ん、最初はそのつもりだったんだけど……。"
"1009405-4-モモイ" = "色んな部活から、先生の休息をぜひ支援したいって言われて。"
"1009405-5-モモイ" = "ダイエット部、生活健康部、トレーニング部……#nそれに、エンジニア部まで！"
"1009405-6-モモイ" = "聞いただけで不安になってきた？#n大丈夫！心配しすぎだって！"
"1009405-7-モモイ" = "トレーニング部とエンジニア部は、先生も慣れてるでしょ？#n他の部活は初めて聞いたかもしれないけど！"
"1009405-8-モモイ" = "ダイエット部は食事制限や運動をしないで、科学的な方法で#n体づくりをすることを目的とした健全な部活！"
"1009405-9-モモイ" = "生活健康部は合法的な人体実験で、体質改善を目指している#n真っ当な部活なんだからね！"
"1009405-10" = "[s] \"説明を聞いたらもっと不安になってきた！\""
"1009405-11-モモイ" = "大丈夫大丈夫！#nミレニアムに先生を傷つけるような生徒なんて滅多にいないよ！"
"1009405-12-モモイ" = "んん？悪意がないのはわかってるって？#nだったら、何も心配することないじゃん！"
"1009405-13-モモイ" = "みんなのことを信じよう！#nきっと身も心もスッキリするからさっ！"
"1009405-14-モモイ" = "もう使用後のレビューを書くって約束しちゃったし。#n今さら逃げられないよ！"
"1009405-15-モモイ" = "というわけで……最初に試すのは――"
"1009405-16-モモイ" = "この、超高周波マッサージマシン！"
"1009405-17-モモイ" = "説明しよう！超高周波マッサージマシンとは！#n筋肉をほぐす効果を最大化するために……！"
"1009405-18-モモイ" = "一般的なマッサージマシンを遥かに凌駕した周波数になるように#n改良したものである！"
"1009405-19-モモイ" = "……って、マニュアルに書かれてるね。"
"1009405-20-モモイ" = "使い方は簡単だよ！#nマッサージが必要な場所にこうやってマシンを装着して……。"
"1009405-21-モモイ" = "スイッチをオンにすればオッケー！"
"1009405-22" = "（不安に震えながら、マッサージマシンのスイッチを入れた……）"
"1009405-23" = "[ns] \"うわぁぁあぁぁあぁぁ！？\""
"1009405-24-モモイ" = "し、振動がぁぁぁ凄いぃぃ！あぁぁ頭の中まで揺れてるぅぅぅ！"
"1009405-25-モモイ" = "うわぁぁぁ……め、めまいがぁぁぁぁ！"
"1009405-26-モモイ" = "は、はやくぅぅぅスイッチをぉぉぉ、オフにぃぃぃ……！#n指が動かないぃぃぃ……！"
"1009405-27-モモイ" = "せせせ先生ぇぇ！助けてぇぇぇ！！"
"1009405-28" = "（何とかして、マッサージマシンの電源を切った……）"
"1009405-29-モモイ" = "はぁ、はぁ……あ、危なかったぁ……。"
"1009405-30-モモイ" = "う、うぅっ！つ、次！#n次は絶対に大丈夫！さあ、特殊EMSスーツの出番だ！"
"1009405-31" = "[s] \"特殊EMSスーツ？\""
"1009405-32-モモイ" = "これはね……運動はしたくない！でも、トレーニング効果は欲しい！#nそんな人のために開発された特別なスーツ！"
"1009405-33" = "[s1] \"運動せずにトレーニングの効果が！？\"\n[s2] \"画期的だね！さっそく試してみよう！\""
"1009405-34-モモイ" = "ふっふっふっ……！そう言うと思った！"
"1009405-35-モモイ" = "私も、キツイ運動はイヤだし……。"
"1009405-36-モモイ" = "このスーツは筋肉を電気で刺激するから……。"
"1009405-37-モモイ" = "筋繊維も強化されて、持久力もアップするんだって！"
"1009405-38" = "（モモイと一緒にマニュアルを読みつつ、EMSスーツを試してみた）"
"1009405-39-モモイ" = "うわぁぁぁあぁぁぁっ！？！？"
"1009405-40-モモイ" = "し、刺激が強いぃぃぃぃっ！"
"1009405-41-モモイ" = "き、筋肉がびりびりするぅぅぅぅ……！"
"1009405-42-モモイ" = "先生ぇ！助けてぇぇ！！"
"1009405-43" = "（どうにかしてEMSスーツの電源を切った……）"
"1009405-44" = "[ns] \"これ……本当に大丈夫……？\""
"1009405-45-モモイ" = "つ、次っ！これは絶対に間違いないよ！#nなんたって、トレーニング部とエンジニア部の共同開発！"
"1009405-46-モモイ" = "ええっ、不安も倍増した！？#nへーき！へーきっ！たまには信じてあげようよ！"
"1009405-47-モモイ" = "見てみて！これはただのストレッチローラーだから！"
"1009405-48-モモイ" = "……マニュアルによると。#n研究から分かった慢性的な疲労の原因は、不自然な姿勢……。"
"1009405-49-モモイ" = "そこで、姿勢を維持する体幹を強化するために開発されたのが#nこのAI搭載のストレッチローラー！"
"1009405-50-モモイ" = "このローラーは使う人の状態を自動的にチェックして#n最適な形に変化するらしいよ！"
"1009405-51-モモイ" = "どれどれ……。#nまずローラーの上に座って、体を前後に動かす、と――"
"1009405-52-モモイ" = "う、うわぁぁぁ！？"
"1009405-53-モモイ" = "このローラー！は、はやすぎるっ！しかも、勝手に動いてぇぇ！#nど、どこかに連れてかれるぅぅ！先生ぇぇ――！"
"1009405-54" = "[s3] \"た、助けてあげたいけど、私も……！\"\n[s4] \"うわぁぁ！壁にぶつかる――！\""
"1009405-55" = "（その後も休息のために準備された様々なマシンを試した結果……）"
"1009405-56" = "（モモイと一緒に、筋肉痛で倒れることになってしまった）"
