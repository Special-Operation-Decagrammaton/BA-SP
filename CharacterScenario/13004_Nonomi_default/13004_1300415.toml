[translation]
"1300415-1" = "内緒のノート"
"1300415-2" = "（ある日、用事があって対策委員会の教室を訪れた）"
"1300415-3-ノノミ" = "ふふん～ふっふふん～"
"1300415-4" = "[ns] \"おはよう、ノノミ。\""
"1300415-5-ノノミ" = "せ、先生！？"
"1300415-6-ノノミ" = "いついらしたんですか！？"
"1300415-7-ノノミ" = "つ、ついさっきですか……ドアの音にも気づかなかったなんて……"
"1300415-8-ノノミ" = "先生がいらっしゃると知ってたら、お菓子くらい用意したのに……"
"1300415-9" = "[s] \"それで、ノノミは何をしてたの？\""
"1300415-10-ノノミ" = "えっと、その……"
"1300415-11-ノノミ" = "ひ、秘密です。"
"1300415-12" = "[s1] \"そっか、ちょっと気になったんだけど……\"\n[s2] \"きっと、何か事情があるんだよね。\""
"1300415-13-ノノミ" = "うーん、事情と言うほどではありません。"
"1300415-14-ノノミ" = "そうですね、ちょっと恥ずかしいんですけど……"
"1300415-15-ノノミ" = "先生にだけ、特別に見せちゃいますね。"
"1300415-16" = "[ns] \"何のノートなの……？\""
"1300415-17-ノノミ" = "対策委員会のみんなと、いつかやってみたいことをメモしたウィッシュリストです。"
"1300415-18-ノノミ" = "内緒のノートですから、秘密にしてくださいね？"
"1300415-19-ノノミ" = "今日は誰も教室に来ないはずだったので、こっそり見てたんです。"
"1300415-20" = "[s] \"どうしてみんなには秘密なの？\""
"1300415-21-ノノミ" = "それは……"
"1300415-22-ノノミ" = "私の目標を達成しようと、みんな助けてくれるに決まってますから。"
"1300415-23-ノノミ" = "ただでさえ借金の返済で大変なのに、負担を増やすわけにはいきません。"
"1300415-24-ノノミ" = "だから、これは私だけの内緒のノートなんです。"
"1300415-25-ノノミ" = "と言っても、先生には見られてしまいましたけど……あはは。"
"1300415-26" = "[s] \"そうだったんだ……ごめんね。\""
"1300415-27-ノノミ" = "気にしないでください。#n教室で開いている以上、いつか見られてしまうとは思っていましたから☆"
"1300415-28-ノノミ" = "この際ですし、先生も見てみませんか？"
"1300415-29" = "[s3] \"見てもいいの？\"\n[s4] \"読んでもいいの？\""
"1300415-30-ノノミ" = "もちろんです。実は、そんなに大した内容ではないので。"
"1300415-31-ノノミ" = "うんうん、ぜひ一緒に見ましょう☆"
"1300415-32-ノノミ" = "達成したものには、赤ペンで丸をつけてるんです。"
"1300415-33-ノノミ" = "一緒にスイーツを食べに行く、学校中を大掃除する……#n何気ないことも、みんなで力を合わせて達成したことも、色々ありましたね。"
"1300415-34-ノノミ" = "これを見ていると……みんなの笑顔を思い出して、とっても幸せな気持ちになるんです。"
"1300415-35-ノノミ" = "あっ……「5辛のピザにチャレンジする」なんてのもありましたね。"
"1300415-36-ノノミ" = "顔を真っ赤にしながら食べてたセリカちゃんが懐かしいです☆"
"1300415-37-ノノミ" = "それから……こっちは、まだ達成できてない目標ですね。"
"1300415-38-ノノミ" = "いつか、このリスト全部に赤い印をつけたいのですが……"
"1300415-39-ノノミ" = "一つ達成しても、今度は二つ目標ができてしまって――"
"1300415-40-ノノミ" = "どんどんリストが増えるばかりなんです。"
"1300415-41-ノノミ" = "まだ達成できてないものが、100個も……あはは、どうしましょう。"
"1300415-42" = "[s] \"むしろ、いいことじゃない？\""
"1300415-43" = "[ns5] \"それだけ、これから思い出が作れるってことだから。\"\n[ns6] \"きっと、楽しい毎日が待ってるよ。\""
"1300415-44-ノノミ" = "……そうですよね！"
"1300415-45-ノノミ" = "いつも借金の返済に悩まされていますが……"
"1300415-46-ノノミ" = "楽しい時間もいっぱいありますからね。"
"1300415-47-ノノミ" = "うんうん。リストを達成できるよう、もっと頑張ります！"
"1300415-48-ノノミ" = "せっかくですし、先生も一緒に思い出を作りませんか？"
"1300415-49" = "[s] \"もちろんだよ。\""
"1300415-50-ノノミ" = "ではまずは、スカイダイビングから！"
"1300415-51-ノノミ" = "地上から約4000メートルのフリーフォール……#n想像しただけで楽しそうですよね！"
"1300415-52" = "[ns] \"そ、それは遠慮したいかな……\""
"1300415-53-ノノミ" = "ふふっ、冗談です☆"
