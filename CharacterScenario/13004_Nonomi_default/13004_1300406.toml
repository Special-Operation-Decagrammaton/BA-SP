[translation]
"1300406-1" = "ゲームは楽しいです"
"1300406-2" = "対策委員会・教室"
"1300406-3-ノノミ" = "はい？オセロの特訓を手伝ってくださるんですか？"
"1300406-4-ノノミ" = "うーん……でも。"
"1300406-5-ノノミ" = "い、いいえ。嬉しいです！先生が気を遣ってくださって……。"
"1300406-6-ノノミ" = "でも私、すごく下手なので……せめて教えを受けられるぐらいの実力をつけないと……。"
"1300406-7-ノノミ" = "……。"
"1300406-8-ノノミ" = "はい。分かりました。実践こそ最高の学び！"
"1300406-9-ノノミ" = "分かりました、先生！ぜひ、私が知らないことを教えてください！"
"1300406-10" = "……。"
"1300406-11" = "[s] \"負けました……。\""
"1300406-12-ノノミ" = "……。"
"1300406-13-ノノミ" = "10戦やったのに……全勝。"
"1300406-14-ノノミ" = "先生、私よりも弱いんですね。"
"1300406-15-ノノミ" = "うーん……もしかしたら他の部員のみんながすごく強いのでしょうか……。"
"1300406-16-ノノミ" = "でも、勝利を経験しましたので、この体験を上手く活かせれば道が見つかる気がします！"
"1300406-17-ノノミ" = "先生のおかげで今日もまた一つ、新しいことが分かりました☆"
"1300406-18" = "（優しく慰めてくれるノノミだった）"
