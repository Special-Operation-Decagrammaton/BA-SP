[translation]
"2000209-1" = "行方不明のネズ助"
"2000209-2" = "サヤの研究室"
"2000209-3-サヤ" = "先生、大変、大変なのだ！ネズ助が……ネズ助が……。"
"2000209-4-サヤ" = "ネズ助がいなくなったのだ！"
"2000209-5-サヤ" = "もしかしてどこかに隠れてるのかなと思って研究室を探したけど、どこにもいない！"
"2000209-6-サヤ" = "ネズ助が何も言わずいなくなったのなんて今回が初めてで……ど、どうしよう？うわああん！"
"2000209-7" = "[s] サヤを落ち着かせる。"
"2000209-8-サヤ" = "くすん、くすん。でも……もしネズ助に何かあったら……。"
"2000209-9-サヤ" = "え、ネズ助が行きそうな場所？#nネズ助は、ぼく様と相棒でいつでも一緒だったから、一人ではどこにも行ったことがない。"
"2000209-10" = "[s] \"錬丹術研究会の他の部員たちに聞いてみよう。\""
"2000209-11-サヤ" = "分かった……くすん。"
"2000209-12" = "山海経・教室"
"2000209-13-錬丹術研究会員A" = "ネズ助がいなくなった？それは大変ですね……。"
"2000209-14-サヤ" = "今日、ネズ助見たりした？"
"2000209-15-錬丹術研究会員A" = "いえ、私は、先輩の研究室以外の場所でネズ助を見たことはないですね。"
"2000209-16-錬丹術研究会員A" = "でも珍しいですね。ネズ助が一匹でいなくなるなんて……。"
"2000209-17-サヤ" = "どうしよう、くすん……。"
"2000209-18-錬丹術研究会員A" = "こんなこと言うのもあれなのですが……もしかしてネズ助は家出をしたんじゃないでしょうか？"
"2000209-19-サヤ" = "……家出？"
"2000209-20-錬丹術研究会員A" = "はい、先輩が毎日のように、実験を言い訳にしてネズ助のことをいじめましたし……。"
"2000209-21-錬丹術研究会員A" = "逆に今まで逃げなかったのがすごい、と言いますか。"
"2000209-22-サヤ" = "いじめるだなんて！ぼく様は実験を手伝ってもらっていただけで、ネズ助をいじめたことはないのだ！"
"2000209-23-錬丹術研究会員A" = "でもネズ助は、実験に参加するのを嫌がってたでしょう？#nよく変な姿にさせられるし、ネズ助の気持ちも分かります。"
"2000209-24-サヤ" = "うう……。"
"2000209-25" = "[s] \"他の部員にも聞いてみよう。\""
"2000209-26-サヤ" = "分かったのだ……。"
"2000209-27-錬丹術研究会員B" = "うそ、ネズ助さんがいなくなったんですか？"
"2000209-28-サヤ" = "うん。今日、どこかでネズ助見てたりしないか？"
"2000209-29-錬丹術研究会員B" = "ううん……今日はネズ助さんを見た覚えはないですね。"
"2000209-30-サヤ" = "本当、どこに行っちゃったのだ……くすん。"
"2000209-31-錬丹術研究会員B" = "あのう、お言葉ですが……ネズ助さんは家出をしたのではないでしょうか。"
"2000209-32-サヤ" = "みんな……なんでそう思うの？"
"2000209-33-錬丹術研究会員B" = "みんな……？えっと、それはその、ネズ助さんはいつもサヤ先輩にいじめられてましたから……。"
"2000209-34-サヤ" = "いじめるつもりじゃなかったのに、ううう……。"
"2000209-35" = "[s] \"校内を回ってネズ助を探してみよう。\""
"2000209-36-サヤ" = "うん……。"
"2000209-37" = "山海経高級中学校"
"2000209-38-サヤ" = "ネズ助――本当に、どこに行っちゃったの……。"
"2000209-39" = "[s] \"あっちも探してみよう。\""
"2000209-40-サヤ" = "……ううん、もういい。#nネズ助は、メイとキンが言った通り、家出をしたに違いないのだ。"
"2000209-41-サヤ" = "今までぼくがいじめすぎたせいなのだ。うう……#nネズ助はぼくにがっかりして、もう帰ってこないのだ。"
"2000209-42" = "[s] 諦めないで、と言う。"
"2000209-43-サヤ" = "先生も今までぼくの実験のせいで辛かったでしょう？#nなのに……どうしてぼくにこんなに良くしてくれるの？"
"2000209-44" = "[s1] \"私はサヤと一緒で楽しかったよ。\"\n[s2] \"先生だからね。\""
"2000209-45-サヤ" = "先生……。"
"2000209-46-サヤ" = "先生……。"
"2000209-47-ネズ助" = "チュ、チューチュー……。"
"2000209-48-サヤ" = "ああっ、ネズ助ぇっ……！どこに行ってたのさ、うああああん！"
"2000209-49-ネズ助" = "チューチュー……。"
"2000209-50-サヤ" = "くすん、くすん……今までぼく様がひどく扱ったから家出してたのか？#n本当ごめんね……。"
"2000209-51-ネズ助" = "チューチュー、チュ。"
"2000209-52-サヤ" = "え？商会で大きなひまわりの種を配ると聞いて行ってきた？#nならどうして何も言わずに行ったのだ！一日中探したじゃんか！"
"2000209-53-サヤ" = "くすん……でもごめんね。これからはもうひどいいたずらはしないから……#nもう二度と、何も言わないでいなくなっちゃダメだからな？"
"2000209-54-ネズ助" = "チュー……。"
"2000209-55-サヤ" = "うん、約束するのだ！これからは真面目な実験にしかお前を付き合わせない！"
"2000209-56-ネズ助" = "チューッ！"
"2000209-57" = "このやろう、ネズ助！バタバタするな！#nもう絶対に逃さないからな！"
"2000209-58-ネズ助" = "チュ、チュチュー！"
"2000209-59" = "その後、サヤはネズ助と仲良く研究室に帰った。"
