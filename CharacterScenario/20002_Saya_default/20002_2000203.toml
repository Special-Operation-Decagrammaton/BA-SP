[translation]
"2000203-1" = "不老不死の霊薬"
"2000203-2" = "サヤの研究室"
"2000203-3-サヤ" = "やあ、先生！待っていたのだ。"
"2000203-4-サヤ" = "連絡した通り、ぼく様はようやく、今度こそ本当に不老不死の霊薬を作るのに成功したのだ！"
"2000203-5-サヤ" = "また肌が金色に変わるのかって？#n違う違う、このネズ助を見てみて。"
"2000203-6-サヤ" = "このツヤツヤな毛と、キラリと輝く目……幼い頃のネズ助に戻ったに違いない、と思わない？"
"2000203-7-サヤ" = "……ネズミだから歳が分からないって？#nそんなことないのだ、ほらちゃんと見て。"
"2000203-8" = "[s] ネズ助の年齢を聞く。"
"2000203-9-サヤ" = "ネズ助の年齢？ぼく様が10歳の時から飼ってたから、少なくとも6歳は越えてるんじゃないかな？"
"2000203-10-サヤ" = "そう考えると、ネズミにしてはまあまあ歳を取ったおじいちゃんネズミなのだ……。"
"2000203-11-サヤ" = "でもぼく様が実験のためにこまめに飲ませた霊薬のおかげで、ネズ助は今でも全然元気なのだ。#nそうだろう、ネズ助？"
"2000203-12" = "ネズ助の返事がない、怯えているようだ。"
"2000203-13-サヤ" = "ネズ助ぇ……！どうしてこのタイミングで口をつぐむのだ？#n知らない人が見たらぼく様がお前をいじめてるみたいじゃないか！"
"2000203-14-サヤ" = "……うん？たまに爆弾にネズ助をくっつけて投げてないかって？"
"2000203-15-サヤ" = "あれはいじめじゃない！ただ実験に付き合ってもらっただけなのだ。ふっふっふっ。"
"2000203-16-サヤ" = "ネズ助は忠実な助手として、ぼく様の実験を手伝ってくれてるだけなのだ。#nそうだろう、ネズ助？"
"2000203-17" = "相変わらずネズ助の返事がない、怯えているようだ。"
"2000203-18-サヤ" = "こいつっ、口を開かないなら、無理やりにでもそう言わせてやるのだ！"
"2000203-19" = "[s] 不老不死の霊薬について聞く。"
"2000203-20-サヤ" = "あ、そうだった。忘れるとこだったのだ。"
"2000203-21-サヤ" = "さあ、これが今回開発した不老不死の霊薬なのだ。"
"2000203-22" = "サヤが怪しげな、色鮮やかなフラスコを渡してきた。"
"2000203-23" = "[s1] \"……。\"\n[s2] \"……今回は本当に効果があるんだよね？\""
"2000203-24-サヤ" = "まだぼく様を疑ってるのだ？今回の薬はすでに、ネズ助でも実験済みだから心配無用なのだ。"
"2000203-25-サヤ" = "まだぼく様を疑ってるのだ？今回の薬はすでに、ネズ助でも実験済みだから心配無用なのだ。"
"2000203-26-サヤ" = "今度こそ、高校生の頃の先生に戻れるはずだから！"
"2000203-27" = "[s] 薬を飲む。"
"2000203-28-サヤ" = "さて、どう？若くなった感じする？"
"2000203-29" = "[s] \"手に……。\""
"2000203-30-サヤ" = "手に？"
"2000203-31" = "[s] \"手に灰色の毛が生えてる！\""
"2000203-32-サヤ" = "灰色の毛？そんなはずが……。"
"2000203-33-サヤ" = "この秘薬に入れた材料は確か、カエルの後ろ足、月見草の根っこ、ネズ助の毛を一握り、それから……。"
"2000203-34-サヤ" = "うわっ、勘違いしてた！間違えて不老不死の霊薬じゃなくて、全身にツヤツヤの灰色の毛が生える霊薬を作ってしまったのだ！"
"2000203-35-サヤ" = "ど、どうしよう、先生？か、剃刀とか持ってくる？"
"2000203-36" = "[s] 体を元に戻してと言う。"
"2000203-37-サヤ" = "う、うわぁっ！近寄らないで！巨大な化け猫みたいで怖いのだ！"
