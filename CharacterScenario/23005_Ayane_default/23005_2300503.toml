[translation]
"2300503-1" = "走れアヤネ"
"2300503-2" = "（アビドス高等学校に着くと、ちょうど鉄をたくさん積んだトラックが出発しようとしていた）"
"2300503-3-廃品回収業者" = "いつもありがとうございます、アヤネさん。"
"2300503-4-アヤネ" = "いえいえ、来ていただいてありがとうございます、お疲れ様です。"
"2300503-5-廃品回収業者" = "これくらいあれば良い値段になりますね。すぐに処理場に持っていって、測ってから溶鉱炉に入れてきちゃいます。じゃあまた後で連絡しますんで。"
"2300503-6-廃品回収業者" = "では、よろしくお願いします。"
"2300503-7-アヤネ" = "はい、こちらこそまたよろしくお願いします！"
"2300503-8-アヤネ" = "あっ、先生。"
"2300503-9" = "[s] \"今のは……？\""
"2300503-10-アヤネ" = "あ、いつも取引してもらっている廃品とか資財とかを回収する業者さんでして。出張費はともかく、それなりの額になりそうです。"
"2300503-11-アヤネ" = "すみませんわざわざお越しいただいて、特に面白いものでは……。"
"2300503-12" = "[s] どこで見つけた鉄なのかを聞く。"
"2300503-13-アヤネ" = "えっと、学校の隅にある資材置き場として使っていた倉庫の奥です。防水の布で覆われていたので、今まで気づかなかったのですが。"
"2300503-14-アヤネ" = "ざっと見て300kg近くはあるみたいだったので、単価が安くてもきっと……"
"2300503-15" = "[s] その倉庫に向かう。"
"2300503-16-アヤネ" = "え？"
"2300503-17-アヤネ" = "えっと……何か気になることでもあるんですか？"
"2300503-18-アヤネ" = "あ、こっちです。"
"2300503-19" = "（ガチャッ）"
"2300503-20-アヤネ" = "こちらです、ちょっと汚れていますが……。"
"2300503-21-アヤネ" = "ここにありました。"
"2300503-22" = "[s] 布の内側を確認する。"
"2300503-23-アヤネ" = "それはおそらく普通の……あれ……？"
"2300503-24-アヤネ" = "何か書いてありますね……「取扱い注意。この資財は高価な特殊製の鉄のため、湿気や温度には注意が必要。詳細は……」"
"2300503-25-アヤネ" = "……高価な？"
"2300503-26-アヤネ" = "……高価な！？"
"2300503-27" = "[s] …………。"
"2300503-28-アヤネ" = "……。"
"2300503-29-アヤネ" = "だっ、ダメぇ！！"
"2300503-30-アヤネ" = "駄目です、電話繋がりません！"
"2300503-31-アヤネ" = "お店の方も同じです……！"
"2300503-32-アヤネ" = "ど、どうしましょう！？"
"2300503-33" = "[s1] \"落ち着こう、アヤネ。\"\n[s2] \"冷静に何か方法を考えよう。\""
"2300503-34-アヤネ" = "は、はい！"
"2300503-35-アヤネ" = "は、はい！"
"2300503-36-アヤネ" = "しっかりして、アヤネ……追い込まれた状況なんて、いつものこと……！"
"2300503-37-アヤネ" = "……ふう、よし！"
"2300503-38-アヤネ" = "……まずは、現状の把握を！"
"2300503-39-アヤネ" = "（……！）"
"2300503-40-アヤネ" = "……OKです、整理できました。あのトラックは直接処理場に行くわけではなく、貨物駅で列車に積み込むはず。"
"2300503-41-アヤネ" = "貨物列車に乗せてしまったらもう手出しできません、ミッション失敗です。"
"2300503-42-アヤネ" = "それ以前に、貨物駅に向かうハイウェイに乗ってしまった時点でもう追跡は出来ないでしょう。"
"2300503-43" = "（カタカタカタカタ……）"
"2300503-44" = "[s] \"その貨物駅に連絡をするっていうのは？\""
"2300503-45-アヤネ" = "ここから一番近い貨物駅は無人で運用されているので、そこに連絡を受けてくれる人はいないんです。"
"2300503-46-アヤネ" = "そして今から貨物駅に向かってもトラックの方が到着が早いですから、私たちの勝負所は貨物駅ではありません。"
"2300503-47" = "[s] \"ということは……。\""
"2300503-48" = "（カタカタカタカタ……）"
"2300503-49-アヤネ" = "その前に勝負をつける必要があります、そこまでの動線を考えましょう。"
"2300503-50-アヤネ" = "以前からずっと取引してる方なので、その辺りの情報は記録していたはず……。"
"2300503-51" = "（カタカタカタカタ……）"
"2300503-52-アヤネ" = "……なるほど、いつもの通りであれば、アビドスの商店街にある大型建築資材管理センターに向かうはずです。"
"2300503-53" = "[s] \"じゃあそこに行けば……！？\""
"2300503-54-アヤネ" = "……いえ、ですがそれはきっと「まだトラックに積み込みができる場合」でしょう。"
"2300503-55-アヤネ" = "今はトラックに300kgの荷物が載せられています、あそこであれ以上載せられるものは無いはず。"
"2300503-56-アヤネ" = "あの場所は文字通り、大型建築資材を取り扱う場所ですから。"
"2300503-57" = "[s] \"な、なるほど……！\""
"2300503-58-アヤネ" = "万が一行ったとしても、その分をショートカットして先回りできます。そこをパスしたと仮定して、その次は……。"
"2300503-59-アヤネ" = "…………。"
"2300503-60-アヤネ" = "……ここです、「アビドス中央公園第3地区」！"
"2300503-61-アヤネ" = "ここの公園では今撤去作業がされてます、ここである程度軽いものを載せるはず！"
"2300503-62-アヤネ" = "距離、約3km……遠くありません！"
"2300503-63-アヤネ" = "予測される到着時刻まで、約10分……。"
"2300503-64" = "[s] \"タクシーとか車とか……！\""
"2300503-65-アヤネ" = "いえ、タクシーが来るまでの時間は不確定ですし、おそらく間に合いません。"
"2300503-66-アヤネ" = "……走ります。"
"2300503-67" = "[s] \"え！？\""
"2300503-68-アヤネ" = "トラックの経路はそれなりに遠回りですし、信号もあります。一方で私一人でしたら、最短経路で向かえば3kmを10分はおそらく可能です。"
"2300503-69" = "[s] \"うそぉ！？\""
"2300503-70-アヤネ" = "先生、指揮をお願いします。"
"2300503-71" = "[s] \"え、指揮？\""
"2300503-72-アヤネ" = "極力荷物を減らします、それに地図を確認しながらでは全速力で走れません。私に、道を教えてください。"
"2300503-73-アヤネ" = "それでは、行ってきます！！"
"2300503-74" = "（アヤネが風のように消えてしまった）"
"2300503-75" = "（……仕方ない、今日は私が全力でオペレーターをしよう）"
"2300503-76-アヤネ" = "先生、十字路です！どの方向ですか！？"
"2300503-77" = "[s] \"み、右！\""
"2300503-78-アヤネ" = "はい！"
"2300503-79-アヤネ" = "はぁ、はぁ……っ！！先生、向こう側のはずなのですがっ、横断歩道がありません……っ！"
"2300503-80" = "[s] \"300m先に歩道橋が！\""
"2300503-81-アヤネ" = "歩道橋、承知です！はっ、はっ……！！"
"2300503-82-アヤネ" = "……きゃっ！？"
"2300503-83" = "（バタン！）"
"2300503-84" = "[s] \"どうしたの！？\" "
"2300503-85-アヤネ" = "な、何でもありません！続けてください！"
"2300503-86-アヤネ" = "はっ、はっ、はっ……。"
"2300503-87-アヤネ" = "はぁ……普段から、もっと……はぁ、はぁ……運動しておけば、良かった……。"
"2300503-88-アヤネ" = "やっと着い……あ、ま、待ってください！！はぁ、はあ……っ！"
"2300503-89-廃品回収業者" = "え、えっ！？アヤネさん！？"
"2300503-90-廃品回収業者" = "ど、どうしてここに！？何かありましたか？"
"2300503-91-アヤネ" = "ちょ、ちょっと、待ってくだ、はっ、はぁっ……先ほどの……鉄……。"
"2300503-92-アヤネ" = "あれ……は……"
"2300503-93" = "（バタンッ）"
"2300503-94-廃品回収業者" = "あ、アヤネさん！？"
"2300503-95" = "（結局あの鉄は、元の2倍近い単価で買ってもらうことができたらしい）"
"2300503-96" = "（そう誇らしそうに笑顔で話してくれたアヤネは、かなり満身創痍の状態だったけれど……）"
