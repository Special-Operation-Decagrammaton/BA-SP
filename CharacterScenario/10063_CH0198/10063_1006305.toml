[translation]
"1006305-1" = "パンドラの箱（２）"
"1006305-2-？？？" = "くくくっ……いくら先生でも、この時間なら……。"
"1006305-3-コユキ" = "誰にも私を止めることはできない……！#n先生の隠してる秘密、ちょちょ～っと覗いちゃいましょうか。"
"1006305-4-コユキ" = "ふむふむ……どれどれ……。"
"1006305-5-コユキ" = "にはは。先生ったら、また新しいセキュリティシステムを導入したんですね。"
"1006305-6-コユキ" = "私が来るたびに更新するなんて、その努力は認めますけど……。"
"1006305-7-コユキ" = "時間稼ぎにもなりませんよ！"
"1006305-8-コユキ" = "これを、こうして……と。"
"1006305-9-コユキ" = "これで秘密が……。"
"1006305-10-コユキ" = "明らかに……。"
"1006305-11-コユキ" = "……？"
"1006305-12" = "[s1] \"……コユキさん。\"\n[s2] \"ダメって……言ったよね？\""
"1006305-13-コユキ" = "げっ！"
"1006305-14-コユキ" = "なんでここに先生が！？"
"1006305-15" = "[s3] \"それはこっちのセリフだよ！\"\n[s4] \"そろそろ諦めて……これで何回目？\""
"1006305-16-コユキ" = "くうっ！セキュリティが通用しないからって、私を張ってたんですね！！#nなんてアナログな手法！"
"1006305-17-コユキ" = "いつから待ってたんですか！？#n大の大人が私みたいな子供を捕まえようとするなんて！！"
"1006305-18" = "[s5] \"ダメって言ってるのに聞かないから……。\"\n[s6] \"というか、ここは私の家なんだけどね。\""
"1006305-19-コユキ" = "くうぅ……悔しい！#nでも諦めませんよ！次こそ必ず……。"
"1006305-20-コユキ" = "……え？"
"1006305-21-コユキ" = "次やったらセミナーの先輩たちに報告する、と……！?"
"1006305-22-コユキ" = "……ぐぬぬぬぬ！"
"1006305-23-コユキ" = "卑怯ですよ！先生がそんなことしていいと思ってるんですか！？#nそもそもこれは私と先生だけの戦いです！"
"1006305-24-コユキ" = "戦いを受けた覚えはない、って……？#n……そ、そうでしたっけ～……"
"1006305-25" = "[s7] \"コユキ、シャーレの秘密は私だけのものじゃないんだよ。\"\n[s8] \"お願い。これはみんなにとって大切なものなんだ。\""
"1006305-26-コユキ" = "……せ、先生？"
"1006305-27-コユキ" = "……急に……そんな真剣な顔で言われても……。"
"1006305-28-コユキ" = "うぅ……。"
"1006305-29-コユキ" = "……はい。"
"1006305-30-コユキ" = "分かりました。先生にそこまで言われたら仕方ないですね。"
"1006305-31-コユキ" = "何も怒らせたくてやってるわけじゃないですし……。"
"1006305-32-コユキ" = "シャーレの秘密からは手を引こうと思います。"
"1006305-33" = "[s9] \"ありがとう、コユキ。\"\n[s10] \"そんなにあっさりと……？\""
"1006305-34-コユキ" = "……先生が本気で嫌がってることをしてまで知りたいわけではないですから。#nただ、ちょーっと気になるな～って思ってただけなので。"
"1006305-35-コユキ" = "……でも。"
"1006305-36" = "[s] \"……でも？\""
"1006305-37-コユキ" = "先生は「みんなにとって大切なもの」だから、見られたら困るんですよね……？"
"1006305-38-コユキ" = "……それはつまり！逆を言えば！！"
"1006305-39-コユキ" = "先生の「個人的なもの」だったら、なーんにも問題ないということですね！"
"1006305-40" = "[ns11] \"そんなつもりじゃないんだけど！\"\n[ns12] \"……はっ、まさか！？\""
"1006305-41-コユキ" = "ではでは、お先に～！#nにはははは～！！！！！"
"1006305-42" = "[ns13] \"ま、待って！コユキ！！\"\n[ns14] \"追いかけないと！\""
"1006305-43" = "（コユキを追って、シャーレの居住区まで走ってきた）"
"1006305-44" = "（あまりの速さに、最後まで後ろ姿が見えなかった）"
"1006305-45" = "[ns15] \"こ、コユキ……！\"\n[ns16] \"ちょっと！……何を見てるの？\""
"1006305-46-コユキ" = "…………。"
"1006305-47" = "[s17] \"……コユキ？\"\n[s18] \"……えっと、その手に持ってるのは……。\""
"1006305-48-コユキ" = "…………。"
"1006305-49-コユキ" = "その……先生……。"
"1006305-50-コユキ" = "ここに来たら、暗証番号のかかった引き出しが見えて……。#nとりあえず開けてみたら……。"
"1006305-51-コユキ" = "……「薄い本」がたくさん入ってたんですが……。#nちょっと……こ、この数は流石に……。"
"1006305-52-コユキ" = "まさかの事態に、私も驚いちゃったり……。"
"1006305-53-コユキ" = "ま、まあ……先生も息抜きが必要ですもんね……。#nに、にはははは……。"
"1006305-54" = "[s] \"…………。\""
"1006305-55" = "[ns] \"………！！！！！！！！！！\""
"1006305-56-コユキ" = "な、なんだかすみませんでした……。#n私も先生の「秘密」がこういったものだとは……にはは……。"
"1006305-57" = "[s19] \"ま、待って！まずは私の話を聞いて！！\"\n[s20] \"ぼ、没収したものだから！本当だって！！\""
"1006305-58-コユキ" = "だ、大丈夫ですよ。誰にだって秘密の一つや二つありますから……。"
"1006305-59-コユキ" = "あっ……急に用事を思い出したので……。"
"1006305-60-コユキ" = "お先に……。"
"1006305-61-コユキ" = "失礼しますね……。"
"1006305-62-コユキ" = "そ、それじゃあ……はい。"
"1006305-63" = "（その後、走り去るコユキを追いかけたが、早すぎて捕まらなかった）"
"1006305-64" = "（……まもなくセミナーから連絡をもらい、謝罪と取り調べを受けた）"
