[translation]
"1006315-1" = "やり返してやります！"
"1006315-2" = "（コユキを手伝うために、反省部屋に向かった）"
"1006315-3" = "（部屋に入ると、机の上の物に目が留まった）"
"1006315-4" = "（置かれているのは、透明の玉）"
"1006315-5" = "（その中に、四つ葉のクローバーが浮かんでいた）"
"1006315-6" = "[ns] \"これは……。\""
"1006315-7-コユキ" = "どうですか、先生！"
"1006315-8-コユキ" = "あの時のクローバーを閉じ込めたんです！"
"1006315-9-コユキ" = "これで枯れることも――"
"1006315-10-コユキ" = "なくす心配もありません！"
"1006315-11-コユキ" = "にははは！永久保存版です！"
"1006315-12" = "[ns] \"いいね……！\""
"1006315-13" = "[ns] \"……そういえば、落とし物をしたんだっけ。\""
"1006315-14-コユキ" = "そうなんです！"
"1006315-15-コユキ" = "この四つ葉のクローバーのように――"
"1006315-16-コユキ" = "私のメダルも探してください、先生！"
"1006315-17" = "[s1] \"メダル？\"\n[s2] \"……困ってるなら、貸そうか？\""
"1006315-18-コユキ" = "ただのメダルじゃないんです！"
"1006315-19-コユキ" = "ちっちゃい穴が空いてるやつで……私の宝物なんです。"
"1006315-20" = "[s] \"もしかして……これ？\""
"1006315-21-コユキ" = "……え？"
"1006315-22" = "（ポケットから取り出して、コユキに見せた）"
"1006315-23-コユキ" = "はっ！？どうして先生がこれを！？"
"1006315-24-コユキ" = "まさか……薄い本の時の仕返しに……！？"
"1006315-25" = "[s] \"違うよ。反省部屋の前で拾ったんだ。\""
"1006315-26-コユキ" = "絶対嘘です！#n図星だからって適当なことを言ってるんですよね！？"
"1006315-27-コユキ" = "え……？#n嘘じゃない……？"
"1006315-28-コユキ" = "あっ……その……。"
"1006315-29-コユキ" = "すみません……。"
"1006315-30-コユキ" = "授業に行くときに落としたのかな……。"
"1006315-31" = "（穴の空いたメダルをコユキに渡した）"
"1006315-32-コユキ" = "にはは！やっぱり先生を呼んで正解でした！"
"1006315-33-コユキ" = "ありがとうございます、先生！"
"1006315-34-コユキ" = "ふふ、私の手に戻ってきましたね……にははは……。"
"1006315-35" = "[s3] \"特別なメダルなの？\"\n[s4] \"エラーメダル……みたいな。\""
"1006315-36-コユキ" = "エラーメダル？何ですか、それ。"
"1006315-37-コユキ" = "あ、製造ミスのやつは高く売れるっていう？"
"1006315-38-コユキ" = "いやー、違いますよ。これは、コユキオリジナルメダルです！#nこのメダルに穴を空けたのは私ですから！"
"1006315-39" = "[s] \"たしかに……これ、よくあるメダルじゃないね。\""
"1006315-40-コユキ" = "ゲーセン用ですからね！"
"1006315-41" = "[s5] \"じゃあ、なんで穴を空けたの？\"\n[s6] \"教室の机につい穴を開けちゃう……みたいな？\""
"1006315-42-コユキ" = "机に穴……たしかに楽しいですよね……。"
"1006315-43-コユキ" = "ですが……ふっふっふ。#nこれは、そんな幼稚な遊びとは違いますよ？"
"1006315-44-コユキ" = "何を隠そう――私が昔作った「勝負メダル」なんです！"
"1006315-45" = "[s] \"勝負メダル？\""
"1006315-46-コユキ" = "はい！#nこのメダルには糸が通してありますよね？"
"1006315-47-コユキ" = "糸の端を握ったまま、ゲーム機に入れます。"
"1006315-48" = "[s7] \"ゲームが終わったら、糸を引っ張って――\"\n[s8] \"メダルを回収するんだね！\""
"1006315-49-コユキ" = "正解！流石ですね、先生！"
"1006315-50" = "[ns] \"それじゃ「チートメダル」だよ……！\""
"1006315-51-コユキ" = "え？なに言ってるんですか。"
"1006315-52-コユキ" = "これはフェアな勝負のためですよ！"
"1006315-53-コユキ" = "クレーンゲームで、やたらアームがゆるかったこと……ありません？"
"1006315-54-コユキ" = "この前の「喫茶店登山」もそう！#n私たちの番になったら、急に難しいパターンになりましたよね！？"
"1006315-55-コユキ" = "[ruby=やつら]ゲーム機[/ruby]は私たちを陥れようとしてるんです！"
"1006315-56-コユキ" = "だったら、やりかえさないと！"
"1006315-57" = "[s] \"それ、犯罪……。\""
"1006315-58-コユキ" = "くっ……！"
"1006315-59-コユキ" = "先生にだけはわかってもらえると思ったのに……！"
"1006315-60-コユキ" = "と、とにかく、このメダルは渡せません！"
"1006315-61-コユキ" = "そもそも使えないんですよ！#n最近のやつは、みんなセキュリティが強化されちゃって！"
"1006315-62" = "[s] \"じゃあ、何でそんな大事にしてるの？\""
"1006315-63-コユキ" = "え？#nそ、それは……。"
"1006315-64-コユキ" = "……うーん。"
"1006315-65-コユキ" = "なんででしょうね。"
"1006315-66-コユキ" = "なんか……捨てられないっていうか。"
"1006315-67-コユキ" = "まあ細かいことはいいじゃないですか。#nそれよりほら！せっかくですし、遊びましょうよ！"
"1006315-68-コユキ" = "新作ボードゲームを、ベッドの下に隠してあるんです！"
"1006315-69" = "（反省部屋でコユキとボードゲームを楽しんだ後――）"
"1006315-70" = "（ヴァルキューレの「公共マナー講座一日コース」にコユキを登録した）"
