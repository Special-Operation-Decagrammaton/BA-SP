[translation]
"1006306-1" = "日頃の行い"
"1006306-2" = "（……シャーレの用事で市内を歩いていると、ゲームセンターでコユキを見かけた）"
"1006306-3-コユキ" = "ああっ！どうか、どうか！お願いだから今度こそ～～～！"
"1006306-4-コユキ" = "……おっ？"
"1006306-5-コユキ" = "お！お！お！お！お！お！お……！"
"1006306-6-コユキ" = "おおおおおおおおおー！！"
"1006306-7-コユキ" = "あああああああああー！！"
"1006306-8-コユキ" = "なんでえええ！#nこんなのって、ほんと！ありえないでしょ！"
"1006306-9-コユキ" = "これで何回連続失敗！？#nなんで！？私、何か悪いことした！？"
"1006306-10-コユキ" = "もうっ！#nこの！"
"1006306-11-コユキ" = "あああああああああっ！！"
"1006306-12" = "[ns1] \"コユキ、どうしたの？\"\n[ns2] \"そんなに台を叩いたら壊れちゃうよ。\""
"1006306-13-コユキ" = "……はっ！#nす、すみません……！"
"1006306-14-コユキ" = "って、あれ！？私、先生にゲーセンにいるって言いましたっけ……？"
"1006306-15-コユキ" = "シャーレの仕事で近くまで……？#nにはは、そんな偶然もあるんですね！"
"1006306-16-コユキ" = "……え？ああ……#n見ての通りゲームしてました！「喫茶店登山」って知ってます？"
"1006306-17-コユキ" = "もうほんと、とんでもないクソゲーなんです！#n操作難易度も高いんですけど、ランダム要素もあるから理不尽に負け続けて……！"
"1006306-18-コユキ" = "はぁ……。他の人はてきとーに遊んでても、あっさり5階くらい行っちゃうものなんですけどね。どうして私は3階にすら届かないのか……。"
"1006306-19" = "[s3] \"コユキは本当にゲームが好きなんだね。\"\n[s4] \"前にも似たような光景を見たことがあったような……。\""
"1006306-20-コユキ" = "まあ、そうです……かね？"
"1006306-21-コユキ" = "でも、最近はみんなゲームくらいやりますよね？#nもしかして、先生はゲームが嫌いなんですか？"
"1006306-22-コユキ" = "なーんだ、好きなんじゃないですか！#nにはは、そうだと思ってましたよ！"
"1006306-23-コユキ" = "……え？"
"1006306-24-コユキ" = "ゲームなら何でも好きなのか、って？いやー、何でもってわけじゃないですよ。"
"1006306-25-コユキ" = "チェスとかそういうのはちょっと……。#nたまに先輩たちから誘われますけど、逃げてますね！"
"1006306-26-コユキ" = "どこに何を打って～、今度はこっちに～って計算しないといけないじゃないですか？#nそういうのはあんまり好きじゃなくって。"
"1006306-27-コユキ" = "もっと予想できないようなのがいいんですよ！#nこんなの無理～～～ってところから、いけちゃうみたいな！#nそのほうが面白くないですか？"
"1006306-28-コユキ" = "無理だと思ってたのが成功すると、すごく気持ちいいじゃないですか！#nダメだって言われてることほど、やってやったときに爽快なのと同じですよ！！論理的にはダメですけど！"
"1006306-29" = "[s5] \"この前のこと、反省してない……？\"\n[s6] \"何となく理解はできるけど……。\""
"1006306-30-コユキ" = "にはははは！"
"1006306-31-コユキ" = "まあ、残念ながら私は運があまりいいほうじゃないので、いつもこうやって負けてばっかですけど……。"
"1006306-32-コユキ" = "思い通りにいかないからこそ、成功したときに達成感がありますので！"
"1006306-33-コユキ" = "そう、たとえ先輩たちに何度捕まったとしても、諦めずに脱出するのと同じように！！"
"1006306-34" = "[s7] \"そこにつなげるんだ？\"\n[s8] \"全然楽しそうには見えなかったけど……。\""
"1006306-35-コユキ" = "もーっ！そこはツッコまないでくださいよ！#nいろんな考え方があるってことです！！"
"1006306-36-コユキ" = "……ん？"
"1006306-37-コユキ" = "日頃の行いが良ければ、ゲーム運も上がるかもしれない、って？"
"1006306-38-コユキ" = "えー……。"
"1006306-39-コユキ" = "先生こそ、そこにつなげるんですか？"
"1006306-40-コユキ" = "どう考えても日頃の行いは関係しないと思いますけど……。"
"1006306-41-コユキ" = "はっ、もしかして私を丸め込もうとしてましたね！？"
"1006306-42-コユキ" = "……つまり？"
"1006306-43-コユキ" = "もし先生の話が本当だとしたら……。"
"1006306-44-コユキ" = "私と違って普段から良い行いをしてる先生は、きっとゲーム運がものすごく高いはず！#nそういうことですよね、ね？"
"1006306-45-コユキ" = "……はい？"
"1006306-46-コユキ" = "……必ずとは言ってない、と？"
"1006306-47-コユキ" = "まあ、そういう言葉が返ってくると思ってましたけど……。"
"1006306-48-コユキ" = "あいにくと先生は～……。"
"1006306-49-コユキ" = "自信が～……。"
"1006306-50-コユキ" = "……なさそう、ですし～？"
"1006306-51" = "[s9] \"…………。\"\n[s10] \"私に自信がないって……そう言ったね？\""
"1006306-52-コユキ" = "なんだかんだ、私は自分の運のなさに文句を言いながらも、2階までは到達しましたからね～！"
"1006306-53-コユキ" = "先生がおっしゃる通り～？#n「日頃の行い」が関係してるなら……？"
"1006306-54-コユキ" = "10階くらい、簡単に到達すると思ったんですけどねー！"
"1006306-55-コユキ" = "まー、ダメなときだってありますよ！#n今日はたまたま調子が良くないんですよね？"
"1006306-56-コユキ" = "でも……そうじゃないなら、せめて3階くらい到達できるんじゃないですか？#nどうです、先生？"
"1006306-57-コユキ" = "……にひひっ。やる気になりました？"
"1006306-58" = "[s11] \"……そこまで言うなら！\"\n[s12] \"大人の本気を見せてあげようか。\"\n[s13] \"後悔させてあげましょう。\""
"1006306-59" = "（それから、コユキの横で「喫茶店登山」を始めた）"
"1006306-60" = "（……持っていたお小遣いを全部使っても、2階が限界だった）"
