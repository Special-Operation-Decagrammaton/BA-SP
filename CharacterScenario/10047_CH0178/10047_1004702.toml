[translation]
"1004702-1" = "キラキラを見つけたい"
"1004702-2" = "（そんなわけで、チセに会うために海を訪れていた）"
"1004702-3" = "[ns] \"あ、チセ。\""
"1004702-4-チセ" = "先生だ～。"
"1004702-5" = "[s1] \"とりあえず来てみたけど……。\"\n[s2] \"今日は何をしに？\""
"1004702-6-チセ" = "それは……。"
"1004702-7" = "[s] \"それは……?\""
"1004702-8-チセ" = "何だろうね～？"
"1004702-9" = "[ns] \"……そっか。\""
"1004702-10-チセ" = "……あ、思い出した。"
"1004702-11-チセ" = "きらきら。"
"1004702-12-チセ" = "きらきらを、見つけにいかなきゃ。"
"1004702-13" = "[s] \"きらきら……？\""
"1004702-14-チセ" = "私、今日から夏休みなの。"
"1004702-15-チセ" = "それで、何をしようかなって悩んで。"
"1004702-16-チセ" = "昨日ネットで検索したの。「夏　やること」って。"
"1004702-17" = "[s3] \"チセもネット使うんだね。\"\n[s4] \"なるほど、計画的！\""
"1004702-18-チセ" = "やった、褒められた。"
"1004702-19-チセ" = "そう、それでね。"
"1004702-20-チセ" = "こういうのを見つけたの。"
"1004702-21-チセ" = "先生にも見せてあげる。"
"1004702-22-チセ" = "これこれ、見て。見える？"
"1004702-23" = "[ns] \"近い！チセ、ちょっと近いかも！\""
"1004702-24-チセ" = "そうなの？"
"1004702-25-チセ" = "じゃあ、これくらい？"
"1004702-26" = "（ほぼゼロ距離まで迫ってくるチセを落ち着かせ、）"
"1004702-27" = "（目に入ったのはネットの記事だった）"
"1004702-28" = "（見出しの内容は……）"
"1004702-29" = "[s5] \"「この夏、自分だけの大人な輝きをゲットして――\"\n[s6] \"一肌脱いで成長しよう！夏完全攻略マニュアル！」……？\""
"1004702-30-チセ" = "うん、だから、この夏休み中にキラキラを見つけ出して……"
"1004702-31-チセ" = "成長したいな～って。"
"1004702-32" = "[s] \"……なるほど？\""
"1004702-33-チセ" = "せっかくの夏休みだから。"
"1004702-34-チセ" = "大事に使いたいなって思って……"
"1004702-35-チセ" = "この貴重な時間……"
"1004702-36-チセ" = "何をしたら陰陽部の部員として、それに俳句を作る人……"
"1004702-37-チセ" = "俳句erとしても、成長できるのかなって。"
"1004702-38" = "[s] \"それ「ハイカー」って読むと、またちょっと別の意味なんじゃ……？\""
"1004702-39-チセ" = "それで、これを見つけたの。"
"1004702-40-チセ" = "キラキラを見つければ、成長できる……"
"1004702-41-チセ" = "じゃあそれを、見つけないとなって。"
"1004702-42-チセ" = "だから、探しに行きたいの、私だけのきらきらを。"
"1004702-43" = "[s7] \"なるほど。成長自体は良いことだと思うけど……\"\n[s8] \"多分この記事は、ちょっと違うっていうか……。\""
"1004702-44-チセ" = "……？"
"1004702-45-チセ" = "違う？"
"1004702-46-チセ" = "きらきら、探しちゃダメなの？"
"1004702-47-チセ" = "先生と見つけにいくの、楽しみにしてたのに……。"
"1004702-48" = "[s] \"ぐっ……！\""
"1004702-49" = "[ns] \"いや、それ自体は止めないんだけど、協力するんだけど……！\""
"1004702-50-チセ" = "やった～。"
"1004702-51-チセ" = "じゃあ行こう、先生。"
"1004702-52-チセ" = "頑張ってきらきらを見つけて……"
"1004702-53-チセ" = "全部脱ぎ捨てて、成長しちゃお～。"
"1004702-54" = "[s] \"あの、あまり「脱ぐ」とかは口にしない方が……。\""
"1004702-55-チセ" = "先生と私、ふたりとも……"
"1004702-56-チセ" = "戦車になれるくらい、成長できたら良いな～。"
"1004702-57" = "[s] \"戦車……になれるかは分からないけど、頑張ろう！\""
"1004702-58" = "（そうして、チセとのきらきら探しが始まった）"
"1004702-59" = "[ns] \"ところでチセ、「きらきら」って具体的には……？\""
"1004702-60-チセ" = "あ、それはね～……"
"1004702-61-チセ" = "きらきらしてるもの、だよ。"
"1004702-62-チセ" = "だから、きらきらしてるものを見つけるの。"
"1004702-63" = "[s] \"分かるけど分からない……！\""
"1004702-64-チセ" = "夏の海にピッタリのきらきら……。"
"1004702-65-チセ" = "今ここでしか見つけられないきらきらは……。"
"1004702-66-チセ" = "あ、見て、先生。"
"1004702-67-チセ" = "あそこ、きらきらがある。"
"1004702-68" = "[ns] \"ま、待って、チセ……！\""
"1004702-69-チセ" = "きらきらしてる……"
"1004702-70-チセ" = "……これ、クラゲさん？"
"1004702-71" = "[s] \"……ゴミ袋、だね。日差しに反射して輝いて見えたのかな。\""
"1004702-72-チセ" = "そっかぁ……。"
"1004702-73-チセ" = "ゴミ袋って、こんなにキラキラしてたんだね。"
"1004702-74-チセ" = "よいしょっと。"
"1004702-75" = "[s] \"それ、持って帰るの？\""
"1004702-76-チセ" = "放っておいたら、また海に流されちゃうかもだし。"
"1004702-77-チセ" = "きらきらの袋のクラゲさんは、連れて帰ろうかなって。"
"1004702-78-チセ" = "あ、先生あそこ。"
"1004702-79-チセ" = "また、きらきらがある。"
"1004702-80" = "[ns] \"チセ速い！待って！\""
"1004702-81-チセ" = "このきらきら……小石?"
"1004702-82" = "[s] \"えっと……「抹茶味ラムネ」の瓶？\""
"1004702-83-チセ" = "そっか～……。"
"1004702-84-チセ" = "じゃあ、これも……よいしょ。"
"1004702-85-チセ" = "次に行こうか、先生。"
"1004702-86-チセ" = "きらきらを求めて、出発～。"
"1004702-87-チセ" = "これは、貝さん？"
"1004702-88" = "[s] \"使い切ったパウダーケース……？\""
"1004702-89-チセ" = "そっか～。"
"1004702-90-チセ" = "これは？ワカメ？"
"1004702-91" = "[s] \"それは、海で使う網かな……。\""
"1004702-92-チセ" = "じゃあ先生、これは?"
"1004702-93-チセ" = "これは？"
"1004702-94-チセ" = "……これは何だろ？"
"1004702-95" = "（その後もきらきらを探してチセと砂浜を歩き回り、）"
"1004702-96" = "（色んなものを収集していった）"
"1004702-97-チセ" = "たくさん見つかったね～。"
"1004702-98" = "[s] \"そうだね、殆どゴミだったけど……。\""
"1004702-99" = "（約3時間、チセと一緒に見つけたものは……）"
"1004702-100" = "（抹茶ラムネの瓶、ゴミ袋、ひび割れたBDの欠片、網、）"
"1004702-101" = "（捨てられたペットボトル、ワカメが絡まったブイ……）"
"1004702-102" = "[s] \"……良い掃除になったね。\""
"1004702-103-チセ" = "……すごい。"
"1004702-104" = "[s] \"すごい……？\""
"1004702-105-チセ" = "今日一日集めたこれ……。"
"1004702-106-チセ" = "全部キラキラしてた。"
"1004702-107-チセ" = "クラゲみたいに、小石みたいに、サンゴ礁みたいに、貝みたいに。"
"1004702-108-チセ" = "海ってこんなにも、きらきらで溢れていたんだね。"
"1004702-109" = "[s] \"……確かにそうかもね。\""
"1004702-110-チセ" = "でも、まだ足りない。"
"1004702-111-チセ" = "目を閉じると、浮かび上がってくるものがあるの……。"
"1004702-112-チセ" = "ずっと探してたきらきら……。"
"1004702-113-チセ" = "まだぼんやりしてて、はっきりは見えないんだけど……。"
"1004702-114-チセ" = "何だと思う、先生？"
"1004702-115" = "[s] \"んー、何だろ……。\""
"1004702-116-チセ" = "……。"
"1004702-117-チセ" = "まあでも、先生が一緒に探してくれただけで。"
"1004702-118-チセ" = "それで、私は……"
"1004702-119-チセ" = "……あ、ご飯の時間だ。そろそろ帰ろっか、先生。"
"1004702-120" = "[s] \"「私は」の続きが気になるんですが！？\""
"1004702-121-チセ" = "んー……。"
"1004702-122-チセ" = "あ、そういえば……。"
"1004702-123-チセ" = "先生と一日中探して、見つからなかったことは……。"
"1004702-124-チセ" = "つまり、これって……。"
"1004702-125-チセ" = "……私やっぱり、戦車にはなれないのかな？"
"1004702-126" = "[s] \"……大丈夫、まだ夏休みは始まったばっかりだし。\""
"1004702-127-チセ" = "先生?"
"1004702-128" = "[s9] \"チセが見つけたいものを見つけるまで、どこまでも付き合うよ。\"\n[s10] \"だから、心配しないで。\""
"1004702-129-チセ" = "……。"
"1004702-130-チセ" = "……そうだね。"
"1004702-131-チセ" = "先生とこの後も……"
"1004702-132-チセ" = "あ。"
"1004702-133" = "[ns] \"チセ？\""
"1004702-134-チセ" = "先生、今ね……。"
"1004702-135-チセ" = "……ううん、なんでもない。"
"1004702-136" = "そうだね、夏休みは始まったばかりだから……行こう、先生。"
"1004702-137" = "じゃあ、帰宅帰宅～。"
"1004702-138" = "競争しよう、先生。"
"1004702-139" = "先に帰れた方がトマトね。"
"1004702-140" = "[s] \"トマト！！？！？！？！？\""
"1004702-141" = "（そうしてチセと一緒に日が沈んでいく海辺を歩き、リゾートへと戻ったのだった）"
