[translation]
"1004720-1" = "思い出の宝箱"
"1004720-2" = "（チセが心配になって、急いで探しに海へ出た）"
"1004720-3" = "[ns] \"たぶんチセなら、きっとこの辺に……\""
"1004720-4" = "（そうしてチセを探し、海辺を見回していると……）"
"1004720-5" = "[ns] \"もしかして、この音は……？\""
"1004720-6-チセ" = "やあっ！"
"1004720-7" = "（音がする方を見ると、そこには勢いよく海辺の砂をポーチに詰め込んでいるチセの姿があった）"
"1004720-8" = "[ns] \"ち、チセ？\""
"1004720-9-チセ" = "ん～？#n先生だ～こんにちは～"
"1004720-10" = "[s1] \"あ、チセ。\"\n[s2] \"こんにちは……って、今何してるの？\""
"1004720-11-チセ" = "私～？"
"1004720-12-チセ" = "これはね～"
"1004720-13-チセ" = "海を持っていこうと思って～"
"1004720-14" = "[s] \"海を持っていくって、その、どういう意味かな……？\""
"1004720-15-チセ" = "こうやって、ここにある砂を詰めるの。"
"1004720-16-チセ" = "それを陰陽部の部室に飾れば～"
"1004720-17-チセ" = "海に来れなかった人も、一緒に楽しめるでしょ～？"
"1004720-18" = "[s5] \"なるほど……思い出になるものを持っていくんだね。\"\n[s6] \"チセが言ってたのは、そういう意味だったんだ……\""
"1004720-19-チセ" = "ん～？なにか別の意味もあるの～？"
"1004720-20" = "[s7] \"いや、突拍子もないとは思うんだけど……\"\n[s8] \"チセなら、もしかして……と思って。\""
"1004720-21-チセ" = "……？"
"1004720-22" = "[s] \"え、えっと、そうだね。チセはみんなのために海を……\""
"1004720-23-チセ" = "うん、でも海だけじゃないよ～"
"1004720-24-チセ" = "みんなに見せたいもの、いっぱいあるから。"
"1004720-25-チセ" = "……海で見つけた素敵なもの、全部ここに入れたの。"
"1004720-26-チセ" = "先生も見る～？"
"1004720-27" = "（そう言ってチセは、ポーチから何かを取り出し始めた）"
"1004720-28-チセ" = "この貝殻は～あっちの隅で拾ったものだよ。"
"1004720-29-チセ" = "こっちの小石は、干潟に落ちてたもので～"
"1004720-30-チセ" = "この栓抜きは、海の家からのプレゼント～"
"1004720-31-チセ" = "それでね～……"
"1004720-32-チセ" = "先生、これは～……"
"1004720-33-チセ" = "先生～……"
"1004720-34" = "（チセのポーチには、海辺で拾ったものだけでなく、たくさんの思い出が詰まっていた）"
"1004720-35" = "（貝殻やヤドカリの殻に、一見なんてことのない小石や栓抜き）"
"1004720-36" = "（他にも海辺に落ちていた網やビニール袋のようなゴミまで）"
"1004720-37" = "（……その「思い出」には、見覚えがあった）"
"1004720-38" = "[ns] \"チセ、これってもしかして……\""
"1004720-39-チセ" = "うん、先生と一緒にきらきらを探してたときに拾ったものだよ～"
"1004720-40-チセ" = "これには、先生と一緒に過ごした思い出が込められてるから。"
"1004720-41-チセ" = "だから、みんなにも見せたいと思ったの。"
"1004720-42-チセ" = "それで、何があったのか一晩中お話をして……"
"1004720-43-チセ" = "俳句を詠んであげたいんだ～"
"1004720-44-チセ" = "……そうしたら、みんな喜んでくれるかな？"
"1004720-45" = "[ns] \"うん、喜んでくれるよ。\""
"1004720-46" = "[ns] \"きっと……ううん、絶対に。\""
"1004720-47-チセ" = "ほんとう～？"
"1004720-48-チセ" = "それなら良かった～"
"1004720-49-チセ" = "じゃあ、もっとたくさん持って帰ろ～"
"1004720-50" = "（そうしてチセがポーチに詰め込んでいったものは、何事にも代えがたい宝物のように……）"
"1004720-51" = "（……きらきら、きらきらしていた）"
"1004720-52" = "[ns] \"そのポーチは、チセにとって宝箱だね。\""
"1004720-53-チセ" = "宝箱……？"
"1004720-54" = "[s9] \"うん。誰かに見せたり……\"\n[s10] \"語りたい思い出が詰まってるから。\""
"1004720-55-チセ" = "誰かに見せたり……語りたい思い出……"
"1004720-56-チセ" = "それをいっぱい集めた、宝箱……"
"1004720-57-チセ" = "……あ。"
"1004720-58-チセ" = "宝物。"
"1004720-59-チセ" = "持って帰らないと。"
"1004720-60" = "[ns] \"……どうしたの、チセ？\""
"1004720-61" = "[ns] \"ち、チセ！？急にどうしたの！？\""
"1004720-62-チセ" = "先生も宝物だから、陰陽部に持っていく～"
"1004720-63" = "[s] \"そ、それは……うぷっ！口に砂が……！？\""
"1004720-64" = "[ns] \"お、陰陽部になら一緒に行くから～～～！\""
"1004720-65" = "（こうしてチセに手を引かれながら……）"
"1004720-66" = "（海辺でゆったりと時間が流れていくのを感じた）"
