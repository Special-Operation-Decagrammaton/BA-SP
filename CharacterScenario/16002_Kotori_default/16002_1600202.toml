[translation]
"1600202-1" = "私の説明を聞いてください！"
"1600202-2" = "（……どこからか騒々しい声が聞こえてくる）"
"1600202-3-ミレニアムの生徒A" = "うう……もう無理……帰らせて……！"
"1600202-4-ミレニアムの生徒B" = "耳が……いや、もう脳が限界……！助けて……！助けてっ！！"
"1600202-5" = "[s] \"……？\""
"1600202-6-ミレニアムの生徒A" = "あっ、せ、先生！"
"1600202-7-ミレニアムの生徒B" = "ちょうど良かった、なんとかしてください先生！"
"1600202-8-コトリ" = "……待ってください、どこに行くんですか！？まだまだ始まったばかりですよ！"
"1600202-9-ミレニアムの生徒A" = "ひいいぃぃいいぃっ！！"
"1600202-10-ミレニアムの生徒B" = "私たちが悪かったから、何が悪かったは正直分かってないけど、とにかく許して！"
"1600202-11-コトリ" = "許すも何も、無知は罪ではありません！もちろん罪に繋がってしまうこともある危険なことではありますが……。"
"1600202-12-コトリ" = "そのためにも普段から無知を自覚・警戒し、日々一つでも多く知っていこうとする姿勢こそが大事なのです！"
"1600202-13-コトリ" = "というわけで話の続きです！元々缶詰というものは缶ではなく瓶から始まった軍事的な食べ物の保管方法であって、ずいぶんと後になって市場競争において……"
"1600202-14-コトリ" = "というわけで、瓶詰から鉄製の缶詰へと歴史は移り変わっていくわけですが、この時から他の平べったい缶詰とは違ってどうしてコンビーフの缶詰だけが台形になったかと言いますと……"
"1600202-15-ミレニアムの生徒B" = "うああああああ！！"
"1600202-16" = "[s] \"コンビーフの缶詰……？\""
"1600202-17-コトリ" = "あっ、先生！こんにちは！"
"1600202-18-コトリ" = "はい？どうしたのか……って？……特にどうしたもこうしたもありませんよ？"
"1600202-19-コトリ" = "ただこちらの方々が「どうしてコンビーフの缶詰は台形なのか」と聞いてくれましたので、簡単な説明を……"
"1600202-20-ミレニアムの生徒A" = "簡単な！？これが簡単な説明なの！？もうかれこれ二時間経ってるけど！？"
"1600202-21-ミレニアムの生徒B" = "コンビーフを入れる缶詰の原材料である、アルミニウムの採掘の歴史と鉱員たちの技術の話まで遡ってるじゃん！！"
"1600202-22-コトリ" = "当然です！何事も外側の薄っぺらい部分だけの理解では、本当の理解とは言えません！"
"1600202-23-コトリ" = "本質的な原因と因果を把握しないと、表層的な話だけを聞いても本当の理解はできませんので！"
"1600202-24-ミレニアムの生徒A" = "いくらなんでも原材料の起源まで知らなくていいでしょ！？"
"1600202-25-ミレニアムの生徒B" = "そうだよ！原材料とかじゃなくて私たちはただ、あの形に何か科学的な理由があるのかを知りたかっただけであって……！"
"1600202-26-コトリ" = "……！！"
"1600202-27-ミレニアムの生徒B" = "……はっ！"
"1600202-28-ミレニアムの生徒A" = "い、今、絶対に言ってはいけないことを言ったような気が……。"
"1600202-29-コトリ" = "なるほど！歴史的な側面よりも、科学的な理由が知りたかったんですね？そういうことであれば、正に私の専門分野です！"
"1600202-30-コトリ" = "だとするとまずは、なぜ缶詰の原材料にアルミニウムが使用されているのかについて話し始めるのが良いですね。ご存知の通りアルミニウムは周期表で原子番号13番の……"
"1600202-31-コトリ" = "元々使われていた鉄に比べて、表面が不動態になることにより外部からの刺激に対する抵抗が強く、その反応が……"
"1600202-32" = "ひいっ！！もういい、もういいから！！うあああああ！！"
"1600202-33-ミレニアムの生徒B" = "トラウマになりそう……！もうしばらくコンビーフは懲り懲りっ！！"
"1600202-34-コトリ" = "ま、待ってください！どこに行くんですか！待って、まだ説明は途中……！"
"1600202-35-コトリ" = "……。"
"1600202-36-コトリ" = "……行ってしまいましたね、まだほんのさわりだったのですが……。"
"1600202-37-コトリ" = "どうして知識を得ることに拒否反応を起こすのでしょう。知らないことを知るということは、嬉しいことだと思うのですが……。"
"1600202-38-コトリ" = "先生は分かってくれますよね、なんたって先生ですし。"
"1600202-39" = "[s1] \"もちろん、無知は罪だからね。\"\n[s2] \"まず相手のレベルに合わせた話が大事だと思う。\""
"1600202-40-コトリ" = "さすがは先生！世界の知を底上げしていくお方！"
"1600202-41-コトリ" = "私、いつも先生のことを尊敬しています！特にその……"
"1600202-42-コトリ" = "……な、なるほど。うーん、確かにそれはそうなのですが……。"
"1600202-43-コトリ" = "むしろ、だからこそできるだけ基本的な部分から説明しようとしたのに……"
"1600202-44-コトリ" = "……。"
"1600202-45" = "[s] \"……コトリ？\""
"1600202-46-コトリ" = "そういえば先生って、いつも他の生徒たちから質問を受けてますよね……。"
"1600202-47-コトリ" = "先生から行かなくても、みんなが進んで聞きに行く……。"
"1600202-48-コトリ" = "いったいどうすれば、私も同じようになれるのでしょうか！？"
"1600202-49-コトリ" = "かっこいいです！憧れです！私、先生みたいな人になりたいです！"
"1600202-50-コトリ" = "いつか大きな講堂を満員にして、堂々と講演ができるぐらい……！"
"1600202-51-コトリ" = "……あ。"
"1600202-52-コトリ" = "す、すみません騒ぎ過ぎました。あはは……"
"1600202-53-コトリ" = "……本当に説明するのが好きなんだね、ですか？？"
"1600202-54-コトリ" = "うーん、そうですね……その通りと言いたいような、そうではないような……。"
"1600202-55-コトリ" = "説明そのものも好きではあるんですが……。"
"1600202-56-コトリ" = "正確には、説明をした後、相手が理解できた時の喜ぶ表情を見るのが好きと言いますか……。"
"1600202-57-コトリ" = "私の説明を理解してくれた人と、理解できた快感を感じたままそのことについて話すのが好きと言いますか……。"
"1600202-58-コトリ" = "……あはは、説明するのが好きなはずなのに、こういう説明はいざしてみるとちょっと難しいですね。"
"1600202-59-コトリ" = "……こんな風におしゃべりなのって、先生はあんまり良くないと思いますか？"
"1600202-60" = "[s3] \"いっぱい話すのは良いことだと思うよ。\"\n[s4] \"ヒヨコみたいで可愛いと思う。\""
"1600202-61-コトリ" = "そ、そうですよね？やっぱりそう思いますよね？"
"1600202-62-コトリ" = "（……良かった）"
"1600202-63-コトリ" = "ひ、ヒヨコ……ですか……？"
"1600202-64-コトリ" = "（きゅ、急に可愛いと言われるのは予想外でした……！）"
"1600202-65-コトリ" = "安心しました、先生にあまり良く思われてないのではと心配になってしまいまして……。"
"1600202-66-コトリ" = "やっぱり先生は、私にとって随一の理解者です！"
"1600202-67-コトリ" = "えへへ。"
"1600202-68-コトリ" = "……。"
"1600202-69" = "[s] \"……コトリ？\""
"1600202-70-コトリ" = "いえ、そういえば「理解」という言葉が出てふと思い出したのですが、"
"1600202-71-コトリ" = "人間が何かを外的に「理解する」というのは、どうやら前提としてまず自分自身に対する「理解」というものが必要だそうでして。"
"1600202-72-コトリ" = "自分自身への理解というのは、自分の行動や感情、判断や選択などを「外部」のものとは区別するということですよね？"
"1600202-73-コトリ" = "つまりある意味では、自分自身を外界から乖離させるようなそういった行為が、実は「外界の事物を受け入れる」というための前提になっているというのは非常に興味深いことでして……。"
"1600202-74-コトリ" = "……先生？"
"1600202-75-コトリ" = "あれ、先生？どちらへ？"
"1600202-76-コトリ" = "……お手洗い？"
