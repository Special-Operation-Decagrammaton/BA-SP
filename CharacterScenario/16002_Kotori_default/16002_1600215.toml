[translation]
"1600215-1" = "変わった形のメガネ"
"1600215-2" = "（コトリが心配になり、ミレニアムを訪ねた）"
"1600215-3-コトリ" = "あっ、先生！！"
"1600215-4-コトリ" = "どうしてミレニアムに？お仕事ですか？"
"1600215-5-コトリ" = "違うんですか？ならどうして……"
"1600215-6-コトリ" = "……え？"
"1600215-7-コトリ" = "私に、会いに？"
"1600215-8-コトリ" = "えっと……ど、どうしてでしょう？"
"1600215-9" = "（コトリに会いにきた理由を説明した）"
"1600215-10-コトリ" = "あー……"
"1600215-11-コトリ" = "う、うーん……なるほど……"
"1600215-12-コトリ" = "す、すみません……気を遣わせてしまったみたいで。"
"1600215-13-コトリ" = "まさか私のためにここまで来てくださるとは思わず……#nもう少し考えて話すべきでしたね。"
"1600215-14-コトリ" = "ご覧の通り、メガネの修理は無事に終わりましたので。#nなんの問題もありません！"
"1600215-15-コトリ" = "あ、いえ、「なんの問題もない」わけではないんでしょうか……？"
"1600215-16-コトリ" = "先生に無駄足を踏ませてしまいましたし、むしろ問題しかないのでは……？"
"1600215-17" = "[s1] \"大丈夫だよ、確認できただけでも嬉しいから。\"\n[s2] \"久しぶりにコトリと会えてよかった。\""
"1600215-18-コトリ" = "う、うぅ……"
"1600215-19-コトリ" = "そう言っていただけるのは、ありがたいのですが……"
"1600215-20-コトリ" = "……え？"
"1600215-21-コトリ" = "気になることがある……？"
"1600215-22-コトリ" = "気になること……！？"
"1600215-23-コトリ" = "なんでしょう！なんでも聞いてください！"
"1600215-24-コトリ" = "この[ruby=とよみ]豊見[/ruby]コトリが説明します！#n知ってることなら今すぐに、知らないことなら調べた後に！！"
"1600215-25-コトリ" = "来てくださったお礼という意味でも、是非！#n先生の質問に答えさせてください！！"
"1600215-26" = "[s3] \"いいの？\"\n[s4] \"どんな質問でも？\""
"1600215-27-コトリ" = "はい、もちろんです！！"
"1600215-28-コトリ" = "本当になんでも大丈夫ですから！さあ、遠慮なくどうぞ！！"
"1600215-29" = "[ns] \"……じゃあ……\""
"1600215-30" = "[ns5] \"そのメガネは特別なものなの？\"\n[ns6] \"毎日大切に使っているよね。\""
"1600215-31-コトリ" = "はい、このメガネについてですね！これは……！"
"1600215-32-コトリ" = "……え。"
"1600215-33-コトリ" = "えと、わ、私の……私の、メガネですか？これは……その……"
"1600215-34-コトリ" = "あ、あれ……？#nす、すみません。予想外の質問で、一瞬頭が……"
"1600215-35-コトリ" = "うぅ……そ、そういえば前にも似たようなことがあったような……"
"1600215-36-コトリ" = "あは、あはは……わ、私ってなんだか、#n自分のことを質問される度に、こうなってる気がしますね……"
"1600215-37-コトリ" = "あうあうあう……"
"1600215-38-コトリ" = "……い、いえ。このままじゃダメです！"
"1600215-39-コトリ" = "しっかりしないと！なんでも説明する――そう先生に約束しましたので！"
"1600215-40-コトリ" = "コホン。すーはー、すーはー……"
"1600215-41" = "[s7] \"こ、答えにくかったら大丈夫だよ……？\"\n[s8] （深呼吸するほどなんだ……）"
"1600215-42-コトリ" = "……いえ、大丈夫です。少し落ち着きましたから。#nでは約束通り、説明しましょう！"
"1600215-43-コトリ" = "とはいえ、大したことでもないのですが……"
"1600215-44-コトリ" = "私のメガネは少し変わった形をしていますよね？#nほら、左目の下の部分が。"
"1600215-45-コトリ" = "こういう形だから、レンズを新しくするのも難しくて。"
"1600215-46-コトリ" = "ですがこのメガネには、普通のメガネにはない効果があるんです。"
"1600215-47-コトリ" = "だからこそ、私が意図的にかけているのですから！"
"1600215-48-コトリ" = "ご存じの通り、私は色々と説明してしまう癖があります。#nそして、その説明は時々長くなってしまうことも……"
"1600215-49-コトリ" = "ですがこのメガネがあれば、#nそういう時でも聞いている方の視線を集められるんです。"
"1600215-50-コトリ" = "いわば、注目してもらうポイントみたいなものですね！#n実は結構、効果があるんですよ！"
"1600215-51" = "[s9] \"なるほど！\"\n[s10] \"意外と実用的だったんだ。\""
"1600215-52-コトリ" = "ふっふっふ……わかってくださいましたか。"
"1600215-53-コトリ" = "こういう些細なことが、#n集中力の維持と円滑な情報伝達に役立っているのです！"
"1600215-54-コトリ" = "……ですが効果がありすぎたのか、最近はこのメガネを見ただけで#nみんな逃げるようになってしまったんですよね……"
"1600215-55" = "[s11] （……なるほど）\n[s12] \"アイデンティティになっているんだね。\""
"1600215-56-コトリ" = "はい。あっ、でも初めて会う方には、本来の効果がありますよ！"
"1600215-57-コトリ" = "……実は今回メガネが壊れた時、#nいっそのこと普通のメガネに戻そうかなとも思ったんです。"
"1600215-58" = "[ns13] \"……コトリ？\"\n[ns14] \"どうしたの？\""
"1600215-59-コトリ" = "……えへへ。"
"1600215-60-コトリ" = "でもやっぱり、このままかけ続けることにしました。"
"1600215-61-コトリ" = "だってこのメガネは、説明以外でも嬉しい効果を発揮してくれましたから！"
"1600215-62" = "（しばらくコトリと雑談をした後、軽く食事をしてシャーレに戻った）"
