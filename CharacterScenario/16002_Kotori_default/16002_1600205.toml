[translation]
"1600205-1" = "正解は、先生のことです！"
"1600205-2-コトリ" = "あっ、来てくれたんですね先生！お待ちしておりました！"
"1600205-3-コトリ" = "今日先生をお呼びしたのはですね……！"
"1600205-4-図書館の司書" = "……（チラッ）"
"1600205-5-コトリ" = "……あ。"
"1600205-6-コトリ" = "……そういえば図書館ですから、小声の方が良いですね。でないと周りの方の迷惑に……。"
"1600205-7-コトリ" = "ここの司書の方、結構怖いんですよ。私も今まで何度か……。"
"1600205-8-コトリ" = "いえ、ブラックリストというわけでは……！無い、と思います、はい、多分。"
"1600205-9-コトリ" = "きっと「要注意人物」くらいかと……よく「静かに」って言われてしまいます。"
"1600205-10-コトリ" = "……えへへ。"
"1600205-11-コトリ" = "と、とにかく今日先生にお聞きしたかったことは……これです！"
"1600205-12-コトリ" = "はい、心理学の本です。"
"1600205-13-コトリ" = "ですが、心理学の本だけではありません。自伝、ゴシップ誌、それから……。"
"1600205-14-コトリ" = "実は最近、とある方から「質問」を受けまして。"
"1600205-15-コトリ" = "いつも私から逃げる人が多いせいでこういったのは久しぶりで、上手く答えられるかどうか緊張しているところです。"
"1600205-16-コトリ" = "え、全然そうは見えない？そんなことありません！これでも結構緊張してるんですよ……！"
"1600205-17-コトリ" = "とにかく、せっかく質問してもらったので、できる限り完璧に、きちんと説明をしてあげたいところなのですが……。"
"1600205-18-コトリ" = "その質問の内容がですね……。"
"1600205-19-女子生徒" = "「自分でも、自分の気持ちがよく分からないの……」"
"1600205-20-女子生徒" = "「このふわふわした気持ちは何なの？コトリなら分かったりしない？」"
"1600205-21-コトリ" = "……という質問だったんです。私にも正直何が何やら……。"
"1600205-22-コトリ" = "科学的にすでに解明された話でしたら、何時間でも説明できるのですが……。"
"1600205-23-コトリ" = "ですがコトリの辞書に「分からない」という言葉はありません、つい「次会った時に説明してあげるね！」って言っちゃいました。"
"1600205-24-コトリ" = "なので、次に会う時までにどうにかして理解しなくてはいけないんです！彼女のいう「ふわふわした気持ち」とは何なのかを！"
"1600205-25-コトリ" = "……というのが、だいたいの経緯なのですが。"
"1600205-26-コトリ" = "まだ全然分かってません、さっぱりです。調べても調べても見えてこなくて、壁にぶつかったまま正解が見えてきません……。"
"1600205-27-コトリ" = "色々な紙媒体の資料を漁ったのですが、どれもこれも表記が統一されておらず、インターネットに至ってはもうあれこそ何が何やら……。"
"1600205-28-コトリ" = "このままでは、まずデータの整理すらできそうにありません。"
"1600205-29-コトリ" = "どうしたらいいと思いますか？先生ならこんな時、どうします？"
"1600205-30-コトリ" = "いえ、それどころか、もしかして先生だったら……ご存じではないですか？「ふわふわした気持ち」とは、いったい何なのか。"
"1600205-31" = "[s1] \"一番身近な資料で確かめてみるとかどう？\"\n[s2] \"一番分かりやすいリファレンスから当たってみる？\""
"1600205-32-コトリ" = "そ、そういったものがあれば確かに良いのですが、それはいったいどこに……。"
"1600205-33-コトリ" = "そ、そういったものがあれば確かに良いのですが、それはいったいどこに……。"
"1600205-34-コトリ" = "……え？"
"1600205-35-コトリ" = "……私、ですか？"
"1600205-36-コトリ" = "え、ど、どういうことですか？"
"1600205-37-コトリ" = "まずは自分のことを振り返ってみれば……？"
"1600205-38-コトリ" = "そ、そう言われましても……それは一体どういう……。"
"1600205-39-コトリ" = "だって、私は彼女ではありませんし……あの子と私は結構違うタイプですし……。"
"1600205-40-コトリ" = "……もしかしたら同じ感情を持ってるかもしれない？うーん、ちょっとよく分かりませんが……。"
"1600205-41-コトリ" = "その質問した人のことをよく思い出してみて……？それはできますが、どうして……。"
"1600205-42-コトリ" = "……うーん。"
"1600205-43-コトリ" = "ちょっとよく分かっていませんが、先生からのアドバイスですし、もう一度考えてみます。"
"1600205-44-コトリ" = "あの質問……彼女の姿……表情……。"
"1600205-45-コトリ" = "うーーん……あの仕草、私がああいうことをする時……ふわふわした気持ち……。"
"1600205-46-コトリ" = "今までの私が、ああいった表情をしてたのは……。"
"1600205-47-コトリ" = "その時、考えていたこと…………んん、んんんんん？"
"1600205-48-コトリ" = "はっ！"
"1600205-49-コトリ" = "も、もしかして……なるほど！分かりました！"
"1600205-50-コトリ" = "あれはですね！私が先生のことを考えてる時とおな、じ……"
"1600205-51-コトリ" = "……っ！！"
"1600205-52" = "[s] \"……コトリ？\""
"1600205-53-コトリ" = "え、あ、う、その……。"
"1600205-54-コトリ" = "……えっと、先生。お手洗いに行っても良いでしょうか……？"
"1600205-55-コトリ" = "す、すぐに戻りますからっ！"
"1600205-56" = "[s] \"……？\""
"1600205-57-コトリ" = "で、では！！"
"1600205-58" = "（そうやって走って行ったコトリは、なぜかそのまま戻ってこなかった）"
"1600205-59" = "（しばらくしてから、「おかげさまで全部解決しました、ありがとうございました」とだけメッセージが来た）"
