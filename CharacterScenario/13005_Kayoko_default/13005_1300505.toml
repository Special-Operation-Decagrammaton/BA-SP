[translation]
"1300505-1" = "ロック・スピリッツ"
"1300505-2" = "キヴォトス・街路"
"1300505-3" = "道で下を向いたまま、何かに夢中になってるカヨコを見かけた。"
"1300505-4-カヨコ" = "…………。"
"1300505-5" = "[s] \"カヨコー！\""
"1300505-6-カヨコ" = "…………。"
"1300505-7-カヨコ" = "…………♫"
"1300505-8" = "[s] \"カヨコ……？\""
"1300505-9-カヨコ" = "……ん？先生？"
"1300505-10-カヨコ" = "ごめん、音楽聞いてて、#n気がつかなかった。"
"1300505-11-カヨコ" = "何の音楽を聞いてるか、って？"
"1300505-12-カヨコ" = "ふふ、私の大好きなバンドの新曲が出たんだ。"
"1300505-13-カヨコ" = "すごく良い曲だから、最近は登下校中もずっと聞くようになって。"
"1300505-14-カヨコ" = "よかったら先生も聞いてみる？"
"1300505-15" = "[s] カヨコからイヤホンを受けとって、耳に付ける。"
"1300505-16" = "\"私が渇望するのは死っ！お前に要らないものは生っ！\""
"1300505-17" = "\"相手の心臓をえぐり抜いて、溢れ出す血でのどを潤せええぇぇぇぇぇっ！\""
"1300505-18" = "……。"
"1300505-19" = "[ns] \"こ、これ、何の曲？\""
"1300505-20-カヨコ" = "良い歌詞だと思わない？私が好きなヘビーメタルのグループ、「ブラック・デス・ポイズン」の新曲。"
"1300505-21-カヨコ" = "ずっと新曲が出てなくて、解散するって噂もあったから心配してたけど……。"
"1300505-22-カヨコ" = "やっぱり今回も、良い曲を持って帰ってきてくれた。"
"1300505-23-カヨコ" = "歌詞が、教育に悪そうに聞こえる、って？"
"1300505-24-カヨコ" = "そんなことはない、「ブラック・デス・ポイズン」の曲は多少過激に聞こえるかもしれないけど、人生において不可欠で、教訓的な良い内容が込められてる。"
"1300505-25-カヨコ" = "先生も「ブラック・デス・ポイズン」のファーストアルバムを聞いたら、考えが変わると思う。"
"1300505-26-カヨコ" = "さあ、一度聞いてみて。"
"1300505-27" = "\"この世はゴミ！この音楽を聞くお前もゴミ！\""
"1300505-28" = "\"すべて分別して世の中を掃除してやるぁぁぁああ！\""
"1300505-29" = "……。"
"1300505-30" = "その後、耳が痛くなるまでカヨコに勧めてもらった音楽を聞いた……。"
