[translation]
"1300506-1" = "雨の降る日の路地裏"
"1300506-2" = "シャーレ・建物前"
"1300506-3" = "仕事を終えて建物の外に出たら、土砂降りの雨が降っていた。"
"1300506-4" = "[s] \"さっきまで晴れてたのに……。\""
"1300506-5-カヨコ" = "……ん？先生？#nどうかした？"
"1300506-6-カヨコ" = "え？うっかり傘を忘れてきたって？"
"1300506-7-カヨコ" = "朝、メッセージ送ったのに、それでも忘れるって……。"
"1300506-8-カヨコ" = "はい、これ。傘。"
"1300506-9-カヨコ" = "なんで傘をいくつも持ち歩いてるのかって？"
"1300506-10-カヨコ" = "周りにそそっかしい人が多いからね。#n予備を持っておくと便利だから。"
"1300506-11-カヨコ" = "ほんと、すごく手のかかる人たちだから……。"
"1300506-12-カヨコ" = "学園は反対方面なのにどこに行くのか、って？"
"1300506-13-カヨコ" = "……同じような、雨の日は放っておけないのがいるから。"
"1300506-14-カヨコ" = "大したことじゃないから。気にしなくていい。"
"1300506-15" = "[s1] カヨコに気を使わせる人が他にもいるなんて、\n[s2] 気になるからついて行くと言う。"
"1300506-16-カヨコ" = "え？……一緒に来る？"
"1300506-17-カヨコ" = "え？……一緒に来る？"
"1300506-18-カヨコ" = "いや、まあ、ダメってわけじゃ……。"
"1300506-19-カヨコ" = "大したことじゃないし……。"
"1300506-20-カヨコ" = "雨も降ってるし、この先結構汚い場所だから、ここで待ってた方が良いと思うけど。"
"1300506-21-カヨコ" = "……はあ。まあ、止めたところで聞いてくれないんだろうね。"
"1300506-22-カヨコ" = "……好きにして。"
"1300506-23" = "[ns] カヨコについて行く。"
"1300506-24" = "[ns3] \"これ、猫の……？\"\n[ns4] \"放っておけないの、ってこの……。\""
"1300506-25" = "[wa:500]― ここまで付いてこなくてもよかったのに、先生。"
"1300506-26" = "[wa:2000]― 今は、いないのかな……。"
"1300506-27" = "[ns5] \"お出かけ中かな。\"\n[ns6] \"少し待ってみる？\""
"1300506-28" = "[wa:3700]― 雨が降ってたから、[wa:1200]見に来ただけ。"
"1300506-29" = "― ……多分、大丈夫。[wa:2500]一人でも平気な子だから。"
"1300506-30" = "[wa:2000]― 縛られることも、[wa:1500]傷つけられることもないのはいいけど……。"
"1300506-31" = "― でも、[wa:1500]一人は寂しいから……。"
"1300506-32" = "[ns7] \"…………。\"\n[ns8] \"カヨコは優しいね。\""
"1300506-33" = "[wa:6000]― ……放っておけなかった。[wa:2500]ただ、それだけ。"
"1300506-34" = "― 別に深い意味はないから。[wa:2500]先生、[wa:1500]分かった？"
"1300506-35-カヨコ" = "……いつの間に雨が止んだね。"
"1300506-36-カヨコ" = "ん？傘返すって？"
"1300506-37-カヨコ" = "いや、またいきなり夕立が降るかもしれないし……#n明日でいいよ。"
"1300506-38-カヨコ" = "それに、貸しておけば、また明日会えるでしょ？"
"1300506-39-カヨコ" = "さっきはあんなこと言ったけど……今は縛られるのも、そんなに嫌いじゃないから。"
"1300506-40-カヨコ" = "じゃあまた明日、先生。"
