[translation]
"1300502-1" = "抜き打ち検査"
"1300502-2" = "キヴォトス・裏通り"
"1300502-3" = "暗い路地裏で、カヨコが警察と何かを話していた。"
"1300502-4-カヨコ" = "だから、私は何もやってないって。"
"1300502-5-警察" = "嘘つくな！そんな怪しい見た目で……。"
"1300502-6-警察" = "こんな場所をうろついて、何か用事でもあるのか？"
"1300502-7-カヨコ" = "それは、だから……。"
"1300502-8-警察" = "……だから？"
"1300502-9-カヨコ" = "……いや、何も。"
"1300502-10-警察" = "ほら見たことか、何か企んでいるんじゃないのか！？"
"1300502-11-警察" = "とりあえず学生証を出しなさい、身元確認をするから。"
"1300502-12-カヨコ" = "（ゲヘナの所属ってバレたら、また風紀委員会から何か言われるし……）"
"1300502-13-カヨコ" = "（めんどくさいことに巻き込まれちゃったな……）"
"1300502-14" = "[ns] \"うちの生徒に何か問題でもありましたか？\""
"1300502-15-警察" = "ん？どなたですか？"
"1300502-16" = "[s] \"シャーレの先生です。\""
"1300502-17-カヨコ" = "……先生？"
"1300502-18-カヨコ" = "先生がどうしてこんなところに……。"
"1300502-19" = "その後、警察の人と話してカヨコのことを弁護した。"
"1300502-20-警察" = "ふう……シャーレの先生がそこまでおっしゃるのなら仕方ないですね。"
"1300502-21-カヨコ" = "……どうして助けてくれたの？"
"1300502-22-カヨコ" = "困ってるように見えたから……？そりゃ、困ってたけど……。"
"1300502-23" = "不審者に誤解されるのは慣れてるから、あまり気にしなくていい。"
"1300502-24-カヨコ" = "ああやって警察に捕まるのはよくあることだから……。"
"1300502-25-カヨコ" = "やっぱりめんどうだね、この怖い顔立ち。"
"1300502-26-カヨコ" = "それで、実際のところ何をしてたのか、って？"
"1300502-27-カヨコ" = "関係ないでしょ、私がここで何をしてても。"
"1300502-28-カヨコ" = "…………。"
"1300502-29-カヨコ" = "……はぁ。野良猫に、エサをやってたの。#n警察が来て、すぐ逃げちゃったけど。"
"1300502-30-カヨコ" = "どうして最初から正直に話さなかったのか、って？"
"1300502-31-カヨコ" = "それは……正直に言っても、信じてもらえないから。"
"1300502-32-カヨコ" = "似合わないのは、自分でもよく分かってる。"
"1300502-33-カヨコ" = "こんな怖い顔で猫の世話をしてるなんて、傍から見たらおかしいよね。"
"1300502-34-カヨコ" = "……おかしくない？#nあ、うん……ありがとう……。"
"1300502-35-カヨコ" = "とにかく、今日は借りを作っちゃったね。"
"1300502-36-カヨコ" = "この借りは今度、絶対返すから。"
"1300502-37" = "その後、便利屋の事務所までカヨコを送ってあげた。"
