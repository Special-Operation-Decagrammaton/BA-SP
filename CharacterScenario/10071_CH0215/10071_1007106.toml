[translation]
"1007106-1" = "SRT、報告します"
"1007106-2" = "（……偶然、いつもより早い時間に目が覚めた）"
"1007106-3" = "（二度寝するには微妙な時間だったため、軽く散歩をすることにした）"
"1007106-4" = "[ns] 着替えて宿の外に出る。"
"1007106-5-？？？" = "……あれ、先生？"
"1007106-6" = "[ns] \"この声は……\""
"1007106-7" = "[wa:450]― [log=미야코 수영복]おはようございます。[/log]"
"1007106-8" = "― [log=미야코 수영복]先生も、[wa:1200]朝の散歩ですか？[/log]"
"1007106-9" = "[wa:1000]― [log=미야코 수영복]私はいつもの[wa:850]ジョギングの代わりに、[/log]"
"1007106-10" = "― [log=미야코 수영복]ひと泳ぎしようと[wa:600]思いまして。[/log]"
"1007106-11" = "[wa:100]― [log=미야코 수영복]せっかくの海ですから、[/log]"
"1007106-12" = "[wa:100]― [log=미야코 수영복]普段とは[wa:500]違う事をするのも[wa:1000]悪くないかなと。[/log]"
"1007106-13" = "[wa:1300]― [log=미야코 수영복]……早朝から[wa:670]このような姿を[wa:950]お見せしてしまって、[/log]"
"1007106-14" = "― [log=미야코 수영복]少し、[wa:500]恥ずかしいです。[/log]"
"1007106-15" = "[wa:1800]― [log=미야코 수영복]………くしゅん。[/log]"
"1007106-16" = "― [log=미야코 수영복]少々、[wa:550]長居しすぎて[wa:870]しまったみたいですね……[/log]"
"1007106-17" = "― [log=미야코 수영복]身体が[wa:380]冷えてきました。[/log]"
"1007106-18" = "[ns] \"こんな朝早くから……冷たいよね、大丈夫？\""
"1007106-19" = "[wa:2100]― [log=미야코 수영복]……そうですね。[/log]"
"1007106-20" = "― [log=미야코 수영복]ウサギは[wa:370]水に入ってはいけないと[wa:1280]言われていますが……。[/log]"
"1007106-21" = "― [log=미야코 수영복]私は、[wa:1250]ウサギではありませんので。[/log]"
"1007106-22" = "[ns] \"RABBIT小隊は、みんな水泳が上手なの？\""
"1007106-23-ミヤコ" = "はい、SRT特殊学園の生徒は、いかなる環境でも作戦を遂行できなければなりませんので。"
"1007106-24-ミヤコ" = "完璧とまではいかないかもしれませんが、基本的な泳法は身につけています。"
"1007106-25-ミヤコ" = "それに水泳は、身体に負担がかかりにくいですし……"
"1007106-26-ミヤコ" = "全身の筋肉を鍛えるのに適しているので――"
"1007106-27-ミヤコ" = "こ、これは、その……"
"1007106-28-ミヤコ" = "す、水泳は、体力の消費が激しい全身運動ですので……"
"1007106-29-ミヤコ" = "食事をしてからの方が、良いですね……"
"1007106-30" = "[s] \"ここに来る途中で、朝から営業してる食堂を見かけたんだ。\""
"1007106-31" = "[ns] \"一緒に食べに行こうか、ミヤコ。\""
"1007106-32-ミヤコ" = "……はい、先生！"
"1007106-33" = "（その後、ミヤコと手をつないで食堂に向かった）"
