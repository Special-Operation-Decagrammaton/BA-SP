[translation]
"2003803-1" = "寒国の秘書室長"
"2003803-2-トモエ" = "ふぅ……。"
"2003803-3" = "[s] \"大丈夫？\""
"2003803-4-トモエ" = "ええ、何とか。"
"2003803-5-トモエ" = "山海経の気候に慣れるまで、時間はかかりそうですが……。"
"2003803-6-トモエ" = "こちらの服に着替えたところ、多少は暑さが和らぎました。"
"2003803-7-トモエ" = "今度は何か冷たい飲み物でも口にしたいと思い、#n街に出てきたものの……。"
"2003803-8" = "[s] \"……見つからなかった、とか？\""
"2003803-9-トモエ" = "はい、先生が仰る通りです。"
"2003803-10-トモエ" = "冷たい飲み物は体に悪いから、と。"
"2003803-11-トモエ" = "その考えが間違っているとは言いませんが……。"
"2003803-12-トモエ" = "この暑さのなか、温かいお茶を頂く気にはなれず。"
"2003803-13-トモエ" = "先ほどは冷たい飲み物かと思い注文したところ、#n常温で出てきてしまいまして。"
"2003803-14" = "[s] \"とりあえず、これでも使ってみる？\""
"2003803-15-トモエ" = "あら。"
"2003803-16-トモエ" = "きれいなうちわですね。"
"2003803-17-トモエ" = "レッドウィンターでは、使う機会がありませんでしたし……。"
"2003803-18-トモエ" = "せっかくですから、お借りします。"
"2003803-19" = "[wa:1670]― [log=토모에 치파오]涼しい風……[wa:2430]ちょうどよい日陰……[/log]"
"2003803-20" = "[wa:2810]― [log=토모에 치파오]更にはうちわで涼む……。[/log]"
"2003803-21" = "[wa:830]― [log=토모에 치파오]ふふ。[wa:1180]たしかにこれは[wa:1210]初めての経験です。[/log]"
"2003803-22" = "[wa:1500]― [log=토모에 치파오]こういった経験一つ一つが……[/log]"
"2003803-23" = "[wa:3950]― [log=토모에 치파오]視野を広げてくれるのですね。[/log]"
"2003803-24" = "[ns] \"トモエの目には、何が映ってるの？\""
"2003803-25" = "[wa:1230]― [log=토모에 치파오]あら？[wa:1610]あまり面白いものでは[wa:1100]ないかもしれませんよ？[/log]"
"2003803-26" = "[wa:670]― [log=토모에 치파오]ふふ、[wa:1260]先生。[wa:1360]そんなところで見てないで……[/log]"
"2003803-27" = "[wa:2580]― [log=토모에 치파오]こちらにお越しください。[/log]"
"2003803-28" = "[wa:2830]― [log=토모에 치파오]ほら、[wa:1160]うちわで扇いで差し上げますので。[/log]"
"2003803-29-山海経の生徒A" = "ねぇ、あの欄干のとこ見て。"
"2003803-30-山海経の生徒B" = "どうしたの？"
"2003803-31-山海経の生徒A" = "ほら、あそこの人。"
"2003803-32-山海経の生徒B" = "すごい……どこかのお嬢様なのかな？"
"2003803-33-山海経の生徒A" = "普通のうちわのはずなのに……。"
"2003803-34-山海経の生徒B" = "……高級な物に見えるね。"
"2003803-35-トモエ" = "……！"
"2003803-36" = "[s1] \"まだそんなに暑いの？\"\n[s2] \"さっきよりも顔が赤いような……。\""
"2003803-37-トモエ" = "い、いえ……。"
"2003803-38-トモエ" = "と、とりあえず、どこか場所を移しませんか？"
"2003803-39" = "[s] \"なら、[ruby=バオビン]刨冰[/ruby]を食べに行こう！\""
"2003803-40-トモエ" = "[ruby=バオビン]刨冰[/ruby]、ですか……？"
"2003803-41-トモエ" = "……なるほど、かき氷の一種でしたか。#nでしたら、ぜひご一緒させてください。"
"2003803-42-トモエ" = "道中は暑いでしょうし、着くまで扇いで差し上げますね。"
"2003803-43" = "（こうして、トモエと街を散策することになった）"
"2003803-44" = "（交代で、お互いをうちわで扇ぎながら）"
