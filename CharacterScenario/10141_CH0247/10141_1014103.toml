[translation]
"1014103-1" = "予想外のプレゼント"
"1014103-2" = "シャーレ・オフィス"
"1014103-3-ハルカ" = "お、お邪魔します、先生。"
"1014103-4-ハルカ" = "い、[ruby=いぐさ]伊草[/ruby]ハルカ、当番に来ました……。"
"1014103-5" = "[s1] \"いらっしゃい、ハルカ。\"\n[s2] \"ちょうどコーヒーを淹れてるところだけど、飲む？\""
"1014103-6-ハルカ" = "せ、先生が淹れたコーヒー！？そ、そんな貴重なものを……！"
"1014103-7-ハルカ" = "あ、そういえば私も持ってきたものがあるんです！"
"1014103-8-ハルカ" = "その……先生への献上品です……。"
"1014103-9" = "[s] \"献上！？\""
"1014103-10-ハルカ" = "はい。ど、どうか受け取ってください！"
"1014103-11" = "（ハルカが渡してきたのは普通サイズの紙箱だった）"
"1014103-12-ハルカ" = "その……この前、先生が気に入っていたようでしたので……。"
"1014103-13-ハルカ" = "箱に入れて、持ってきました……。"
"1014103-14" = "[s] \"いったいなんの話だろう……？\""
"1014103-15" = "（見当もつかなかったので、ひとまず箱を開けてみた）"
"1014103-16" = "（中には……）"
"1014103-17" = "[ns] \"……ドレス？\""
"1014103-18" = "（……ハルカが着ていたドレスが綺麗に畳まれていた）"
"1014103-19-ハルカ" = "はい。その、博覧会場でお会いしたとき……。"
"1014103-20-ハルカ" = "ど、ドレスが綺麗だとおっしゃってくださったので……。"
"1014103-21-ハルカ" = "も、持ってきました！"
"1014103-22-ハルカ" = "き、きっと先生にも似合うと思います……！"
"1014103-23" = "[s] \"私に！？\""
"1014103-24-ハルカ" = "はい！す、好きなだけ着ていいですから！"
"1014103-25" = "[s] \"着る！？\""
"1014103-26-ハルカ" = "し、心配しなくて大丈夫です！"
"1014103-27-ハルカ" = "私の体臭が残らないよう、ドライクリーニングやアイロンがけ……できることは全部やりました！"
"1014103-28-ハルカ" = "あれ？もしかしてこれ、マナー違反でしたか……？"
"1014103-29-ハルカ" = "この場合は、新しいものを買うのが正しいとか……！"
"1014103-30-ハルカ" = "でも、これと同じドレスはどこにもなくて……。"
"1014103-31-ハルカ" = "買ったお店にすらなかったので……。"
"1014103-32-ハルカ" = "私のを持ってきたんですが……。"
"1014103-33-ハルカ" = "す、すみません！ブラックマーケットを隅から隅まで探してでも新しいドレスを……！"
"1014103-34" = "[s3] \"いやいやいや！\"\n[s4] \"ドレスが綺麗という意味で言ったわけじゃないよ。\""
"1014103-35-ハルカ" = "えっ……？"
"1014103-36-ハルカ" = "そ、そうなんですか……？"
"1014103-37-ハルカ" = "でも、そのような感じのことを聞いたような気がするんですが……。"
"1014103-38-ハルカ" = "ま、まさか……私の幻聴……！？"
"1014103-39" = "[s] \"ううん、綺麗だと言ったのは事実だよ。\""
"1014103-40" = "[ns] \"ドレスを着たハルカがね。\""
"1014103-41-ハルカ" = "……。"
"1014103-42-ハルカ" = "え、えええ！？"
"1014103-43-ハルカ" = "そ、そ、そんな……。"
"1014103-44-ハルカ" = "わ、私が……綺麗……。"
"1014103-45-ハルカ" = "昔聞いたことがあります。こうすれば夢から目覚めるって……。"
"1014103-46" = "[ns] \"す、ストップ！\""
"1014103-47" = "（ひとまずハルカを落ち着かせたあと……）"
"1014103-48" = "（ドレスが入っている箱をハルカに渡した）"
"1014103-49" = "[ns] \"信じられないなら、あっちの部屋でドレスに着替えてみたら？\""
"1014103-50-ハルカ" = "え？い、今ですか……？"
"1014103-51-ハルカ" = "改めてとなると、すごく緊張しますけど……。"
"1014103-52-ハルカ" = "せ、先生がそう仰るなら……はい。"
"1014103-53" = "（しばらくして）"
"1014103-54-ハルカ" = "き、着替えてきました……。"
"1014103-55-ハルカ" = "あっ、姿見……。"
"1014103-56" = "[s] \"どう？\""
"1014103-57-ハルカ" = "ど、どうって言われましても……。"
"1014103-58-ハルカ" = "その……。"
"1014103-59-ハルカ" = "うう……！"
"1014103-60-ハルカ" = "うぁぁ……！"
"1014103-61" = "（ハルカは頬を赤くしたままオフィスを去ってしまった……）"
