[translation]
"1014102-1" = "思いがけない出会い"
"1014102-2" = "（仕事を終え帰る途中）"
"1014102-3" = "（なにかの博覧会場？の前でハルカがうろうろしていた）"
"1014102-4" = "（なぜか入場しないハルカを見て――）"
"1014102-5" = "（とりあえず、話しかけてみることにした）"
"1014102-6-ハルカ" = "せ、先生！？"
"1014102-7" = "[ns] \"こんにちは、ハルカ。\""
"1014102-8-ハルカ" = "こ、こんにちは！"
"1014102-9-ハルカ" = "す、すみません！いらっしゃっているのに気付かず……！"
"1014102-10" = "[s] \"これって、なにかの博覧会？\""
"1014102-11-ハルカ" = "え？あ、はい……そんな感じです。"
"1014102-12-ハルカ" = "えっと、どのような博覧会かというと……。"
"1014102-13-ハルカ" = "キヴォトス園芸博覧会といって――"
"1014102-14-ハルカ" = "街路樹や低木、園芸用品などを展示し販売する一大イベント……だと聞きました。"
"1014102-15" = "[s] \"なるほど、それで綺麗にドレスアップしてきたんだね。\""
"1014102-16-ハルカ" = "え？"
"1014102-17-ハルカ" = "ええええ！？"
"1014102-18-ハルカ" = "き、綺麗って！そ、そんな！"
"1014102-19-ハルカ" = "い、いくら素敵なドレスでも、私みたいな根暗が着たところで……！"
"1014102-20" = "[s] \"本当に綺麗だよ？\""
"1014102-21-ハルカ" = "ふ、ふええぇぇ……！"
"1014102-22-ハルカ" = "わ、私なんかのために、心にもないことを言ってくださらなくても……。"
"1014102-23" = "[s] \"本気なのに……。\""
"1014102-24-ハルカ" = "うあああああ……！"
"1014102-25-ハルカ" = "すみませんすみませんすみません……！"
"1014102-26" = "（慌てるハルカを優しくなだめてあげた）"
"1014102-27-ハルカ" = "うぅぅぅ……。"
"1014102-28-ハルカ" = "すみません……また暴走しちゃって……。"
"1014102-29-ハルカ" = "え？どうして入場しないのか、ですか？"
"1014102-30-ハルカ" = "そ、それは……。"
"1014102-31-ハルカ" = "私には、入る資格がないので……。"
"1014102-32" = "[s1] \"え？\"\n[s2] \"入る資格がないって、どういうこと？\""
"1014102-33-ハルカ" = "い、いえ、その……。"
"1014102-34-ハルカ" = "今日の私は、ここのセキュリティとして来ているので……。"
"1014102-35-ハルカ" = "そもそも入場する必要がないんです……。"
"1014102-36" = "[s] \"セキュリティ……？\""
"1014102-37-ハルカ" = "はっ、もしかして私、セキュリティの意味を誤解してますか！？"
"1014102-38-ハルカ" = "門番じゃなく、門そのものになったほうがよかったですか！？"
"1014102-39" = "[s] \"もはやそれはセキュリティじゃないよ！？\""
"1014102-40" = "（話を聞いてみると、ハルカは博覧会の警備員として雇われているとのことだった）"
"1014102-41" = "[ns] \"じゃあ、ドレスを着ている理由も……。\""
"1014102-42-ハルカ" = "はい、ドレスコード……といいますか。"
"1014102-43-ハルカ" = "警備員もある程度フォーマルな格好をする必要があるみたいで……。"
"1014102-44-ハルカ" = "……もしかして、この格好はフォーマルじゃなかったですか！？"
"1014102-45" = "[s] \"ううん、そんなことないよ。\""
"1014102-46-ハルカ" = "そ、そうですか。"
"1014102-47-ハルカ" = "なら安心して――"
"1014102-48" = "ドッカァァン！"
"1014102-49" = "[ns] \"爆発音……！？\""
"1014102-50-ハルカ" = "会場の中からです！"
"1014102-51-ハルカ" = "喧嘩でしょうか！？"
"1014102-52-イチョウ派の構成員A" = "キヴォトスで一番優れている街路樹はイチョウしかない！その他はすべて邪道だぁ！"
"1014102-53-プラタナス派の構成員A" = "ふんっ、この頑固頭が！あんな臭い木のどこがいいんだよ！"
"1014102-54-イチョウ派の構成員B" = "なっ、臭い！？お前が推しているプラタナスだって、春になれば汚い毛みたいな種をばら撒くくせに！"
"1014102-55-プラタナス派の構成員B" = "なんだと……！？汚い毛！？"
"1014102-56-プラタナス派の構成員B" = "もう我慢できん！撃て！！"
"1014102-57-ハルカ" = "が、街路樹のことで喧嘩しているみたいですね……。"
"1014102-58-ハルカ" = "どうしましょう？止めるべきでしょうか？"
"1014102-59-ハルカ" = "うぅぅ、こんなのマニュアルに載ってないのに……。"
"1014102-60" = "[ns] \"あれ？木片がこっちに――\""
"1014102-61" = "[ns] \"痛っ。\""
"1014102-62" = "[ns] \"いたた……ってハルカ？どうしたの？\""
"1014102-63-ハルカ" = "こ……。"
"1014102-64-ハルカ" = "この虫けらどもが――！！！"
"1014102-65" = "[s5] \"ハルカ！？\"\n[s6] \"私は本当に大丈夫だか――\""
"1014102-66-ハルカ" = "よくも先生の顔に傷をつけましたね！？"
"1014102-67-イチョウ派の構成員A" = "あ、あんた誰だよ！"
"1014102-68-ハルカ" = "死んでください死んでください死んでください死んでください！！"
"1014102-69-ハルカ" = "全員木の下に埋めてやるうううぅぅぅ！！！！"
"1014102-70-プラタナス派の構成員B" = "た、助けてくれぇ！！"
"1014102-71" = "（そうやって、ハルカは騒動を瞬く間に制圧した）"
"1014102-72" = "（……代償として、会場は大破してしまった）"
"1014102-73" = "万博会場・路地裏"
"1014102-74" = "[ns] \"お疲れ様、ハルカ。\""
"1014102-75-ハルカ" = "う、ううぅぅ……。"
"1014102-76-ハルカ" = "す、すみませんすみませんすみません。"
"1014102-77-ハルカ" = "私のために運営側に弁明までしてくださって……。"
"1014102-78" = "[s] \"ハルカは自分の仕事を全うしただけだよ。\""
"1014102-79-ハルカ" = "うう……。"
"1014102-80-ハルカ" = "ありがとうございます、先生……。"
"1014102-81" = "（ベンチに座って、しばらく休憩したあと）"
"1014102-82" = "（ハルカを便利屋の事務所まで送ってあげた）"
