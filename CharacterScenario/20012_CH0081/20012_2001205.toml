[translation]
"2001205-1" = "氷室セナ"
"2001205-2" = "（予定よりも早めにシャーレを出発した）"
"2001205-3" = "（……待ち合わせの時間よりかなり早かったはずなのだけれど、すでにセナが待っていた）"
"2001205-4-セナ" = "……あ、先生。"
"2001205-5-セナ" = "お疲れ様です。"
"2001205-6" = "[s1] \"ごめん、待たせちゃった？\"\n[s2] \"ずいぶん早いね……？\""
"2001205-7-セナ" = "まあ、はい……。"
"2001205-8-セナ" = "まあ、はい……。"
"2001205-9" = "[s] \"……セナ？\""
"2001205-10-セナ" = "……いえ、何でもありません。1時間27分前からお待ちしていただけです。"
"2001205-11-セナ" = "今日は他の予定や業務も無く、息抜きも兼ねてと言いますか。"
"2001205-12-セナ" = "先生との約束を、楽しみにしておりましたので。"
"2001205-13-セナ" = "内心かなり期待しておりまして、こういった姿は他の部員に見せられませんね。"
"2001205-14" = "[s3] \"ストレートだ……。\"\n[s4] \"ずいぶん早くから来てくれたんだね。\""
"2001205-15-セナ" = "……まあ、はい。"
"2001205-16-セナ" = "……まあ、はい。"
"2001205-17-セナ" = "それはさておき、以前のタオルなどを……"
"2001205-18-セナ" = "……はい？"
"2001205-19-セナ" = "その前に……？"
"2001205-20-セナ" = "まずシートを？何故ですか？"
"2001205-21-セナ" = "……お弁当？"
"2001205-22-セナ" = "……ああ、ピクニックですか。お礼と仰ってましたね。"
"2001205-23-セナ" = "いえ、好みでないなんてことは。"
"2001205-24-セナ" = "むしろ、好きなくらいです。"
"2001205-25-セナ" = "……すみません。私はどうしてもこういった感じですので、色々と伝わりにくいですね。"
"2001205-26-セナ" = "本当に、嬉しいと思っています。ここしばらくの出来事の中で、一番心に残るでしょう。"
"2001205-27-セナ" = "救急医学部でもこうして野外で食事をしたことはありますが、部活の延長線上なのでこういった雰囲気でもありませんでしたし。"
"2001205-28-セナ" = "デートというのは、こんな感じなのでしょうか。胸がときめきますね。"
"2001205-29-セナ" = "実はこのような経験は皆無でして、このような表現が合っているのかも分かりませんが。"
"2001205-30" = "[s5] \"そ、そっか……。\"\n[s6] \"何か私が緊張してきた……！\""
"2001205-31-セナ" = "まあ、とにかく。"
"2001205-32-セナ" = "まあ、とにかく。"
"2001205-33-セナ" = "口下手なのは自覚していますので、このように素直に申し上げると何だか、逆に上手く伝わらないのではとも思うのですが。"
"2001205-34-セナ" = "まあ先生なら、という期待もありまして……。"
"2001205-35-セナ" = "……不思議な方ですね、先生は。"
"2001205-36-セナ" = "予想通りの反応をするかと思いきや、時々予想外の言動を取って……。"
"2001205-37-セナ" = "ですが一緒にいて不安になったり、気持ちが淀むことがありません。"
"2001205-38-セナ" = "まだ然程長い時間を過ごしていないにも関わらず、それでもこんな気持ちになるのは、自分でも不思議なのですが。"
"2001205-39" = "[s7] \"そうかな？\"\n[s8] \"私もそう思うから、似た者同士なのかもね。\""
"2001205-40-セナ" = "……？"
"2001205-41-セナ" = "……？"
"2001205-42-セナ" = "そうですか。似た者同士……。"
"2001205-43-セナ" = "先生と私が、ですか。"
"2001205-44-セナ" = "今いちしっかり飲み込めてないかもしれませんが、純粋に喜ばしい言葉として受け取っておきます。"
"2001205-45-セナ" = "……話し過ぎましたね。ピクニックを始めましょうか。"
"2001205-46-セナ" = "タオルなどはまた帰り際にでも……"
"2001205-47-セナ" = "帰り際……。"
"2001205-48-セナ" = "……。"
"2001205-49" = "[s9] \"……？\"\n[s10] \"……セナ？\""
"2001205-50-セナ" = "……いえ、何でもありません。"
"2001205-51-セナ" = "……いえ、何でもありません。"
"2001205-52-セナ" = "またそのタイミングでお話します。"
"2001205-53" = "（その後セナと一緒に、ちょっとしたピクニックを楽しんだ）"
"2001205-54" = "（お弁当はいつものお店から買ってきたものだったが、いつもよりも美味しく味わえた）"
