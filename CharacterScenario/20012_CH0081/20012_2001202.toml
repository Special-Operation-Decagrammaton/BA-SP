[translation]
"2001202-1" = "負傷者なので"
"2001202-2" = "（流石に心配になったので、セナの言っていた場所へと訪れた）"
"2001202-3" = "（ゲヘナではよくあることとはいえ、あちこちに少し怪我をした生徒たちの姿が見える）"
"2001202-4" = "（そして生徒たちの傍で、救急医学部の部員たちを指揮しているセナの姿が見えた）"
"2001202-5-セナ" = "死体……ではなく負傷者は救急車に積載してください。歩ける方は一旦向こうの方へ。"
"2001202-6-セナ" = "「歩くのが面倒だから」と気絶したふりをする生徒は、射撃して本当に気絶状態なのかどうか確認してください。"
"2001202-7-セナ" = "……では、始め。"
"2001202-8-救急医学部の部員たち" = "はいっ！！"
"2001202-9-ずる賢い生徒" = "のあぁぁっ！？分かった分かった！歩ける、歩けるから！"
"2001202-10-ずる賢い生徒" = "確認だからってそう簡単に撃つな！本当に歩けなくなるから！？"
"2001202-11-セナ" = "……輸送を終えましたら、再度こちらに集合。"
"2001202-12-セナ" = "まだ向こうの方で戦闘は続いてますので死た……負傷者は増えるでしょう。ですので次は……"
"2001202-13-セナ" = "……聞いてください。"
"2001202-14-セナ" = "はいっ！"
"2001202-15-セナ" = "私はしばらく離脱します。みなさんは予定通り、作業を行ってください。"
"2001202-16-セナ" = "……それでは、始め。"
"2001202-17-セナ" = "はいっ！！"
"2001202-18-セナ" = "まさか先生が来ていたとは。どうしてここに……？"
"2001202-19-セナ" = "メッセージ、届いてましたよね？ここは危ないので、他の場所へ行かれた方が…"
"2001202-20-セナ" = "……はい？"
"2001202-21-セナ" = "心配で来た……？"
"2001202-22-セナ" = "……あぁ。"
"2001202-23-セナ" = "なるほど、そうでしたか……まあ確かに、先生の立場であればむしろ無視する方が難しいと……。"
"2001202-24-セナ" = "結果として、先生のことを呼び出す形になってしまいましたね。すみません、私のミスです。"
"2001202-25-セナ" = "これからはああいったことが無いように、設定を修正します。"
"2001202-26-セナ" = "そういう話ではない、ですか？"
"2001202-27-セナ" = "気にしないでと言われましても……。"
"2001202-28-セナ" = "……はい。では先生がそう仰るのでしたら。"
"2001202-29-セナ" = "……手伝えること、ですか？"
"2001202-30-セナ" = "お気持ちはありがたいですが、大丈夫です。基本的にいつも通りですから。"
"2001202-31-セナ" = "確かに今回は予想以上に長期戦で、死……"
"2001202-32-セナ" = "いえ、負傷者の数が多くなりそうなのは確かですが。"
"2001202-33-セナ" = "もう少しで風紀委員会も来るはずです。その後はもう、ほぼ私たちの管轄外ですので。"
"2001202-34-セナ" = "ああ、言った傍から来ましたね。"
"2001202-35-風紀委員" = "よしっ、全員確保！！"
"2001202-36-風紀委員" = "取り急ぎ一掃し、状況を収めろ！"
"2001202-37-セナ" = "……まあ、ここまでいつも通りですね。"
"2001202-38" = "[s1] \"いつも通りなんだ……。\"\n[s2] \"いつものゲヘナだね……。\""
"2001202-39-セナ" = "はい。そして後は片付き次第、私たちも負傷者への対応を行うのみ。"
"2001202-40-セナ" = "はい。そして後は片付き次第、私たちも負傷者への対応を行うのみ。"
"2001202-41-セナ" = "それ以上のことを考えるには、現状どうしても手が足りませんから。"
"2001202-42-セナ" = "それでは仕事に戻って……"
"2001202-43-？？？" = "そこ！"
"2001202-44-風紀委員" = "救急医学部か？"
"2001202-45-セナ" = "はい、部長の[ruby=ひむろ]氷室[/ruby]セナです。何かご用でしょうか？"
"2001202-46-風紀委員" = "ぶ、部長……？こ、これは失礼を。"
"2001202-47-風紀委員" = "実はそこの横たわっている負傷者の中に、事件の首謀者が一名いまして。"
"2001202-48-セナ" = "……はい、そうですか。"
"2001202-49-セナ" = "……それで？"
"2001202-50-風紀委員" = "そ、それでというのは……"
"2001202-51-セナ" = "それで、私に何をどうしろと言っているのか、と聞いているのです。"
"2001202-52-風紀委員" = "そ、それはもちろん、連れて行って尋問をしなきゃですので、身元を引き渡していただきたく……。"
"2001202-53-セナ" = "お断りします。"
"2001202-54-風紀委員" = "……え？"
"2001202-55-セナ" = "救急医学部が引き受けた負傷者は、その瞬間から私たちの管轄です。例外はありません。"
"2001202-56-セナ" = "その生徒についての措置は、治療が終了してからにしてください。"
"2001202-57-風紀委員" = "で、ですが、こちらとしても経緯を調べる必要が……！"
"2001202-58-風紀委員" = "くそっ、かくなる上は強引にでも……"
"2001202-59-セナ" = "……そうですか。"
"2001202-60" = "[ns] \"えっと、セナ……？\""
"2001202-61-セナ" = "……気絶してしまいましたね。"
"2001202-62-セナ" = "患者、もう一名追加です。"
"2001202-63-セナ" = "すぐに救急車で搬送を。"
"2001202-64-救急医学部の部員たち" = "はいっ！！"
"2001202-65" = "[ns3] \"えぇ……？\"\n[ns4] \"強硬手段すぎる……。\""
"2001202-66-セナ" = "大丈夫です。衝撃で気絶させただけであって、実際に撃ち込んだわけでも、傷を負わせたわけでもありませんから。"
"2001202-67-セナ" = "大丈夫です。衝撃で気絶させただけであって、実際に撃ち込んだわけでも、傷を負わせたわけでもありませんから。"
"2001202-68-セナ" = "静かに事を済ませるには、これが最善だと判断しました。"
"2001202-69-セナ" = "……さて。"
"2001202-70-セナ" = "もうおよそ死体の積載は終わったようですし……。"
"2001202-71" = "[s5] \"セナ、修正できてないよ……。\"\n[s6] \"もう全く隠せなくなってるけど……。\""
"2001202-72-セナ" = "とにかく申し訳ないのですが、今日は後片付けもありますのでこれにて。"
"2001202-73-セナ" = "それでは……。"
"2001202-74" = "[ns] \"……。\""
"2001202-75" = "（そうして「負傷者」たちを全員車に積み、セナと救急医学部一同はすごい勢いで消えてしまった……）"
