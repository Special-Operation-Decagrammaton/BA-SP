[translation]
"1002315-1" = "夕暮れの海辺"
"1002315-2" = "夕暮れの浜辺"
"1002315-3-イオリ" = "いい加減諦めろ！"
"1002315-4-イオリ" = "いま降参すれば見逃してやる。"
"1002315-5-チンピラA" = "ううっ……！ふ、ふざけんな！"
"1002315-6-チンピラB" = "多国籍料理専門の海の家って聞いてたのに、#nワサビ入りのかき氷が出てくるってどういうことだよ！！"
"1002315-7-チンピラB" = "いや、百歩譲ってそれはいいとして！#n焼きそばにイチゴジャムってなんだよ！？いくらなんでもひどくないか！？"
"1002315-8-チンピラA" = "こんなの有り得ねえ！あんな店……許せねえよ！"
"1002315-9-店主" = "そ、創作料理には挑戦が大事ですから……！"
"1002315-10" = "[s] \"それは流石に同情する……。\""
"1002315-11-イオリ" = "同情してる場合じゃない！#nそれに、風紀委員としては見逃すわけにいかないんだよ。"
"1002315-12-イオリ" = "指揮をお願い、先生！さっさと片付けるぞ！"
"1002315-13" = "[s] \"まあ仕方ないか……！\""
"1002315-14-チンピラA" = "くっ！このまま倒れるわけには……！"
"1002315-15-チンピラB" = "うう……痛いよぉ！"
"1002315-16-チンピラB" = "や、やられっぱなしでいられるか！"
"1002315-17" = "[ns] \"手榴弾……！\""
"1002315-18-イオリ" = "フン、こんなもの！"
"1002315-19" = "[ns1] \"海にはじき返した……！\"\n[ns2] \"ナイス、イオリ！\""
"1002315-20" = "[ns] \"あ……。\""
"1002315-21" = "（大量の海水を被り、びしょ濡れになってしまった……）"
"1002315-22-イオリ" = "ふう、だいたい片付いたか。"
"1002315-23-イオリ" = "先生、良い指揮だっ……"
"1002315-24-イオリ" = "なっ、何でそんなびしょ濡れなんだ？"
"1002315-25" = "[s3] \"さっきの手榴弾が海に落ちて……\"\n[s4] \"水を被っちゃったんだ……。\""
"1002315-26-イオリ" = "あ……。"
"1002315-27-イオリ" = "そ、そうだった。私が海に吹き飛ばしたから……。"
"1002315-28-イオリ" = "大丈夫か？怪我は？"
"1002315-29" = "[s] \"あ、うん……濡れただけだよ。大丈夫。\""
"1002315-30-イオリ" = "それならいいけど……。"
"1002315-31-イオリ" = "うーん、でも夏とはいえ夜は冷えるし……"
"1002315-32-イオリ" = "そのままだと風邪引くかも……。"
"1002315-33-イオリ" = "……先生、着替えは持ってる？"
"1002315-34" = "[s] \"ホテルになら……。\""
"1002315-35-イオリ" = "そうだ、あれを……。"
"1002315-36" = "[ns] \"これは……\""
"1002315-37" = "[ns] \"イオリが使っていたブランケット？\""
"1002315-38-イオリ" = "し、仕方ないだろ、今は着替え持ってきてないし。"
"1002315-39-イオリ" = "風邪を引かれても困るから……。"
"1002315-40-イオリ" = "ホテルに戻るまで使ってくれ。"
"1002315-41" = "[s] \"あったかい……。\""
"1002315-42-イオリ" = "それ、結構大事にしてるやつだから……#n扱いには注意してよ！？"
"1002315-43" = "[s] \"これも風紀委員会の備品？\""
"1002315-44-イオリ" = "備品というか……風紀委員会に入って初めての合宿でもらったんだ。"
"1002315-45-イオリ" = "手触りもいいし、あったかくて気に入ってる。"
"1002315-46-イオリ" = "嫌なことがあった時も、それを触ってるとちょっと落ち着くというか……。"
"1002315-47" = "[s] \"イオリの「安心毛布」的なもの？\""
"1002315-48-イオリ" = "そ、そんな大層なものじゃないけど……。"
"1002315-49" = "[s] \"大切な毛布を貸してくれてありがとう。\""
"1002315-50-イオリ" = "……。"
"1002315-51-イオリ" = "新品ってほどきれいじゃないけど……。"
"1002315-52" = "[s] \"普段はどういう時に使ってるの？\""
"1002315-53-イオリ" = "いつもはひざ掛けにしたり……ベンチに敷いたり……"
"1002315-54-イオリ" = "教室で仮眠を取る時の布団代わりにもしてるかな……。"
"1002315-55" = "[ns] \"たしかに、そこはかとなくイオリの匂いがするかも……。\""
"1002315-56-イオリ" = "は、はぁっ！？何言ってるんだ！？#nちゃんと洗ってるぞ！？"
"1002315-57-イオリ" = "変なこと言うなバカ！！！"
"1002315-58" = "[ns5] \"（ブランケットのにおいを嗅ぐ）\"\n[ns6] \"（鼻をうずめて息をする）\""
"1002315-59-イオリ" = "へ、ヘンタイ！！！"
"1002315-60" = "[s] \"イオリのにおい！！！\""
"1002315-61-イオリ" = "もう、返せっ！！！このヘンタイ！死ね！！！"
"1002315-62" = "（結局ブランケットを没収されて、風邪を引いた……）"
