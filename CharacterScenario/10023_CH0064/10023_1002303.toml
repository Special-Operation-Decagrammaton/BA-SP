[translation]
"1002303-1" = "とある風紀委員の弱点"
"1002303-2" = "（イオリのモモトークのことが気になって、こっそり後をつけてみた）"
"1002303-3-イオリ" = "……ふぅ、誰にも見られてないよな？"
"1002303-4-イオリ" = "よりによって、先生に送っちゃうなんて……。"
"1002303-5-イオリ" = "……そろそろ時間か。"
"1002303-6" = "[ns] イオリの後をついて行く。"
"1002303-7-怪しげな生徒" = "ふふっ、いらっしゃい。お待ちしておりましたよ。"
"1002303-8-イオリ" = "……約束のブツは？"
"1002303-9-怪しげな生徒" = "もちろん、しっかりとこちらに。"
"1002303-10-怪しげな生徒" = "しかし意外ですね。血も涙も無いと言われるあのゲヘナ風紀委員のスペシャリストが、こんな形で取引を要請してくるだなんて……ふふふっ。"
"1002303-11-イオリ" = "し、仕方ないだろ！普通に「それ」を買おうとして、誰かに見られるのも嫌だし……。"
"1002303-12-イオリ" = "……対価はちゃんと渡す、秘密は守れよ？"
"1002303-13-怪しげな生徒" = "もちろんです。顧客の情報を漏らしたとあっては、我々の信用にも関わってしまうのでね。"
"1002303-14-怪しげな生徒" = "では、こちらを……。"
"1002303-15-イオリ" = "……ああ、悪くない。"
"1002303-16-イオリ" = "じゃあ、お代を――"
"1002303-17" = "[s] \"……何を買ってるの？\""
"1002303-18-イオリ" = "うわっ！？せ、せせせ、先生！？"
"1002303-19-イオリ" = "ど、どうしてこんな場所に先生が……？"
"1002303-20" = "[s] \"どうしても気になって、ついてきちゃった。\""
"1002303-21-イオリ" = "なっ……！つまり、私のことをずっと尾行して……！？"
"1002303-22-イオリ" = "このっ、ヘンタイ！死ね！痴漢！"
"1002303-23" = "[s] \"でも、何かイオリが良くないことに巻き込まれてるかと思って……。\""
"1002303-24-怪しげな生徒" = "べ、別に良くないものではありません……！"
"1002303-25-怪しげな生徒" = "これはただの――"
"1002303-26-イオリ" = "ちょっ、待て！顧客情報だろそれは！？厳守しろって！"
"1002303-27-イオリ" = "先生には言うな！"
"1002303-28-怪しげな生徒" = "ですが怪しいモノを取り扱ってると思われたら、我々もそうですが、イオリさんも困るのでは……？"
"1002303-29-怪しげな生徒" = "……どちらにせよ、いつまでも隠しておけるものではないじゃないですか。"
"1002303-30-イオリ" = "それは、そうだけど……。"
"1002303-31" = "[s] \"何だったとしても怒らないから、正直に言ってほしいな。\""
"1002303-32-イオリ" = "…………き輪。"
"1002303-33" = "[s] \"……え？\""
"1002303-34-イオリ" = "……浮き輪。"
"1002303-35" = "[s] \"…………え？\""
"1002303-36-イオリ" = "絶対に聞こえてるだろ！？浮き輪だよ！泳げないやつが使うあの浮き輪！！"
"1002303-37-イオリ" = "ああもうっ！先生には一番バレたくなかったのに！"
"1002303-38" = "[s] \"それってつまり、もしかして……。\""
"1002303-39-イオリ" = "ああそうだよ、泳げないの！！"
"1002303-40-イオリ" = "風紀委員会の活動が忙しくて、しょっちゅう水泳の授業を休んでたこともあって……。"
"1002303-41-イオリ" = "とはいえ、規則違反者が海に逃げ込んだりした時に「泳げない」なんて言ってられないから……。"
"1002303-42-イオリ" = "それで、こっそり浮き輪を買って泳ぐ練習をしようと思ってたのに……。"
"1002303-43-イオリ" = "くそっ、よりにもよって先生にバレるなんて……。"
"1002303-44" = "[s] \"私がその練習、付き合おうか？\""
"1002303-45-イオリ" = "え？どうして先生が……？"
"1002303-46-イオリ" = "……どうせ、何かいやらしいことでも考えてるんだろ？騙されないからな。"
"1002303-47" = "[s] \"ひとりで練習するより効率良いんじゃないかなって思って。\""
"1002303-48-イオリ" = "確かに、それはそうだけど……。"
"1002303-49-イオリ" = "（考えてみたら、もうバレちゃったんだから先生には隠す必要も無いし……）"
"1002303-50-イオリ" = "（それで、みんなの前で恥をかかずに済むなら……）"
"1002303-51-イオリ" = "……分かった、じゃあお願い。"
"1002303-52-イオリ" = "……でも、もし変なとこ触ったらその場で撃つから。"
"1002303-53" = "[s] \"善処するね。\""
"1002303-54-イオリ" = "「善処」じゃダメなんだって！絶っ対触るなよ！？"
"1002303-55" = "その後、イオリと一緒に深夜の海に行って、しっかり教えてあげた。"
