[translation]
"1601803-1" = "隊長の重み"
"1601803-2" = "（ラブと一緒に商店街へ向かった）"
"1601803-3-ラブ" = "ん～……ううーーんん……。"
"1601803-4-ラブ" = "悩むなぁ……。"
"1601803-5" = "[s1] \"きな粉？みたいに見えるけど……。\"\n[s2] \"何に使うの？\""
"1601803-6-ラブ" = "きな粉じゃないわ。これはクルミの殻を砕いたもの。"
"1601803-7-ラブ" = "ヘルメット団の必需品よ。これを使って磨いていくの。"
"1601803-8-ラブ" = "ヘルメットを塗る時は、まず元の色を紙やすりで全部剥がすんだけど……。"
"1601803-9-ラブ" = "剥がした直後は表面がツルツルで光を反射するから、#n磨いて元のガサガサに戻さないといけないのよ。"
"1601803-10" = "[s] \"ツルツルなヘルメットも持ってたよね？\""
"1601803-11-ラブ" = "ええ、使い分けてるわ。"
"1601803-12-ラブ" = "戦闘の時はガサガサのツヤ消しメット、#nカッコつけたい時はツヤツヤメット……みたいにね。"
"1601803-13-ラブ" = "それで、ガサガサにするのにクルミの研磨剤を使うってわけ。"
"1601803-14-ラブ" = "問題は、粗さの番手を30番にするか50番にするかなんだけど……。"
"1601803-15" = "[s] \"全部同じじゃないの？\""
"1601803-16-ラブ" = "違うわよ！もっとよく見て！？"
"1601803-17-ラブ" = "んん……今月も金欠だし、一つに絞らないと……。"
"1601803-18-スケバンB" = "ん？"
"1601803-19-スケバンB" = "あいつ、ジャブジャブヘルメット団のリーダーじゃね？"
"1601803-20-スケバンA" = "隣にシャーレの先生もいるな。"
"1601803-21-スケバンA" = "おい！そこのオカッパ！"
"1601803-22-スケバンB" = "ヘルメット団は引退して、大人とお出かけでちゅか～？"
"1601803-23-ラブ" = "あぁ？"
"1601803-24-スケバンB" = "子分はどうしたんだ？"
"1601803-25-スケバンB" = "おい、今のうちにやっちまうか？"
"1601803-26-ラブ" = "……はぁ。"
"1601803-27-ラブ" = "先生、ちょっと失礼するわね。"
"1601803-28" = "[s] \"なんで靴下を銃に……？\""
"1601803-29-スケバンB" = "ん？どうしたアイツ。"
"1601803-30-スケバンB" = "ビビって血迷ったか？"
"1601803-31-ラブ" = "お姉さんね、いま弾代も節約しなきゃいけないの。"
"1601803-32-ラブ" = "これはチャンスよ？#n[ruby=・]お[/ruby][ruby=・]買[/ruby][ruby=・]い[/ruby][ruby=・]物[/ruby]が済んだら、とっとと失せな。"
"1601803-33-スケバンA" = "ふざけやがって……。"
"1601803-34-スケバンA" = "やっちまえ！！"
"1601803-35-スケバンB" = "ぐはっ！"
"1601803-36-スケバンA" = "銃で殴るたぁ卑怯だぞ……！"
"1601803-37-スケバンA" = "よこせ！！"
"1601803-38-スケバンA" = "靴下が滑って、銃が掴めない……っ！"
"1601803-39-ラブ" = "この靴下がすっぽ抜けたら、転んじゃうわね。"
"1601803-40-ラブ" = "やっ、やめっ……！"
"1601803-41-ラブ" = "やめない。"
"1601803-42-ラブ" = "あー、めんどくさ。"
"1601803-43-スケバンC" = "[ruby=こまかぜ]河駒風[/ruby]ラブ！うちらの縄張りで、よくも……！！"
"1601803-44-スケバンC" = "手榴弾でもくらえ！"
"1601803-45-ラブ" = "危ないでしょ！"
"1601803-46-ラブ" = "ふんっ！"
"1601803-47-スケバンC" = "ぐあぁっ！！"
"1601803-48-ラブ" = "おっ、綺麗に飛んだわね。"
"1601803-49-ラブ" = "他の奴らも呼んでこい！絶対捕まえてやるっ！！"
"1601803-50-スケバンZ" = "つ、[ruby=つえ]強[/ruby]え……ぐぅっ。"
"1601803-51-スケバンZ" = "撤退！てったーい！！"
"1601803-52-ラブ" = "ほんっと、めんどくさい連中……。"
"1601803-53-ラブ" = "一日を棒に振っちゃったじゃない！！"
"1601803-54-ラブ" = "次は足腰立たなくしてやるわよ！"
"1601803-55-ラブ" = "はぁ……もうクタクタ。"
"1601803-56-ラブ" = "先生、大丈夫？怪我は？"
"1601803-57" = "[s3] \"大丈夫！なんともないよ！\" \n[s4] \"いつもこんな感じなの？\""
"1601803-58-ラブ" = "今日はやたらと絡んできたけど、まあ、いつも通りかしら。"
"1601803-59-ラブ" = "スケバンもだけど、ヘルメット団の内輪もめもよくあるわね。"
"1601803-60-ラブ" = "まあ、今日みたいにガツンとやっとけば、当分は静かなはずよ。"
"1601803-61" = "[s] \"ラブってすごく強いんだね！\""
"1601803-62-ラブ" = "はっ、当たり前でしょ？"
"1601803-63-ラブ" = "ヘルメット団隊長の名は伊達じゃないわ！"
"1601803-64" = "[s] \"みんなが頼れるリーダーだね！\""
"1601803-65-ラブ" = "ちょっと褒めすぎじゃない……？#nえへへっ。"
"1601803-66" = "[s] \"そして根は優しくて！\""
"1601803-67-ラブ" = "ちょっ……。"
"1601803-68" = "[s] \"とげとげの歯も可愛い！\""
"1601803-69-ラブ" = "うるさいっ！！"
"1601803-70" = "（その後、ポカポカ殴られながらラブを褒めちぎった）"
