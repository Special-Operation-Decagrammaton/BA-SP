[translation]
"1601806-1" = "隊長の優しさ"
"1601806-2-ラブ" = "先生さ。いつも走ってきて、疲れない？"
"1601806-3-ラブ" = "ほんとに転んだらどうすんのよ。"
"1601806-4" = "[s] \"大事な生徒を待たせるわけにはいかないからね！\""
"1601806-5-ラブ" = "（大事な生徒……）"
"1601806-6-ラブ" = "ま、まあ別に大した用事じゃないんだけど。"
"1601806-7-ラブ" = "いい天気だし、散歩でもどう……？"
"1601806-8-ラブ" = "で、あいつ。うちの前に仁王立ちして言ったの。"
"1601806-9-ラブ" = "「隊長！行くならあたしを倒してからだ！」って。"
"1601806-10-ラブ" = "ほんと、あれは誰かに見せたかったわね！"
"1601806-11-ラブ" = "あと、うちのヘルメットが壊れた時さ。"
"1601806-12-ラブ" = "あいつ、みんなでお金出し合って修理してくれたんだよ？"
"1601806-13-ラブ" = "そういう可愛いとこもあるってワケ！"
"1601806-14-ラブ" = "――で、めっちゃボコられて帰って来たの。"
"1601806-15-ラブ" = "それでうちが「そいつら今どこ？ギッタギッタにしてやる」って――"
"1601806-16-ラブ" = "ん？あれって……。"
"1601806-17" = "[s] \"アヒルだ。\""
"1601806-18-ラブ" = "アヒルかぁ……うち、アヒルとガチョウの違いもあんま分からないけど……。"
"1601806-19-ラブ" = "あの子は、カッコイイわね。"
"1601806-20-ラブ" = "6羽も雛を連れてる。"
"1601806-21" = "[s1] \"あの子たち……。\"\n[s2] \"排水溝の上を通ろうとしてるね。\""
"1601806-22-ラブ" = "そうね。"
"1601806-23-ラブ" = "……あっ！！子供たちが落ちちゃった！"
"1601806-24-ラブ" = "もう、みんなまだ小っちゃいんだから！気をつけなきゃ！"
"1601806-25-ラブ" = "はぁ、仕方ないわね。"
"1601806-26-ラブ" = "先生、ちょっと手伝って。"
"1601806-27" = "[wa:1880]― [log=라브]いち、[wa:640]に、[wa:810]さん、[wa:740]し、[wa:810]ご、[wa:780]ろく。[wa:1300]よしっ！[/log]"
"1601806-28" = "― [log=라브]6羽ともちゃんと全員いるわね！[/log]"
"1601806-29" = "― [log=라브]ママの言うことはちゃんと聞いときなさいよ、[/log]"
"1601806-30" = "― [log=라브]あんたたち。[/log]"
"1601806-31" = "[wa:1850]― [log=라브]母アヒルももう大丈夫そうね。[/log]"
"1601806-32" = "― [log=라브]これで一件[wa:770]落着、っ[wa:1020]と！[/log]"
"1601806-33" = "[ns] \"ラブってあんまり生徒っぽくないよね。\""
"1601806-34" = "[wa:700]― [log=라브]な、[wa:590]ななな……[wa:580]なに言ってんのよ！！[/log]"
"1601806-35" = "― [log=라브]先生、[wa:960]それってちょっと失礼じゃない？[/log]"
"1601806-36" = "― [log=라브]え？[wa:1580]……あっ！？[wa:2240]えっ[wa:1060]と……。[/log]"
"1601806-37" = "[ns] \"ヘルメット団のみんなを引っ張るところとかさ。大人っぽいっていうか。\""
"1601806-38" = "[wa:880]― [log=라브]あ、[wa:270]ああっ！[wa:1000]そ、[wa:250]そういうことね！？[/log]"
"1601806-39" = "― [log=라브]も、[wa:520]もちろん！[wa:580]リーダーだもの！[/log]"
"1601806-40" = "― [log=라브]この程度できないとダメじゃない！[/log]"
"1601806-41" = "[wa:1540]― [log=라브]（先生ってば、[wa:910]ホントに言い間違えただけ？）[/log]"
"1601806-42" = "― [log=라브]（それともワザと……？）[/log]"
"1601806-43" = "― [log=라브]（どっちにしろ腹立つわね！）[/log]"
"1601806-44" = "― [log=라브]（わざとだったらもっとムカつくし！！）[/log]"
"1601806-45" = "― [log=라브]（まさか、[wa:1920]わざとだっ[wa:960]たり[wa:1120]するのかしら……？）[/log]"
"1601806-46-ラブ" = "よいしょ……っと。#nこの辺りならいいかしら。"
"1601806-47-ラブ" = "みんな、足元にはちゃんと気をつけるのよ？"
"1601806-48-ラブ" = "えっとそれで……どこまで話したかしら。"
"1601806-49-ラブ" = "スケバンと3対100でやりあった話は――"
"1601806-50" = "[s] \"ヘルメット、そのまま被って平気？\""
"1601806-51" = "[ns3] \"アヒルたちが落ちたところ……。\"\n[ns4] \"排水溝……だよね？\""
"1601806-52-ラブ" = "！！！"
"1601806-53-ラブ" = "先生のバカ！！"
"1601806-54" = "（ラブは慌ててヘルメットを外し、遠くに消えていった……）"
