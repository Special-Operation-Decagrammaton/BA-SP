[translation]
"1010906-1" = "小さなシミ"
"1010906-2" = "シャーレ・執務室"
"1010906-3" = "（翌日、ノアとシャーレの仕事を片付けていると……）"
"1010906-4" = "[ns] \"食後だからか眠気が……。\""
"1010906-5" = "[ns] \"ノアもコーヒー飲む？\""
"1010906-6-ノア" = "そうですね……。"
"1010906-7-ノア" = "ご一緒に、いただきたいです。"
"1010906-8" = "[ns1] \"はい、お待たせ。\"\n[ns2] \"熱いから気をつけ――\""
"1010906-9" = "[ns] \"っ！\""
"1010906-10-ノア" = "だ、大丈夫ですか！？"
"1010906-11" = "[s] \"う、うん。ノアこそ熱くなかった？\""
"1010906-12-ノア" = "私は平気です。"
"1010906-13-ノア" = "スカートに少しかかっただけですから。"
"1010906-14-ノア" = "床は私が拭くので……先生は手をしっかり冷やしてくださいね。"
"1010906-15" = "[s3] \"後で冷やしてくるよ。\"\n[s4] \"ごめん、早く洗わないと……！\""
"1010906-16-ノア" = "制服のことは、お気になさらず。#nそろそろクリーニングに出すつもりでしたから。"
"1010906-17-ノア" = "……やっぱり、気になって仕事に集中できないかもしれません。"
"1010906-18-ノア" = "楽な服に着替えてきますね……ふふっ。"
"1010906-19" = "（しばらくして……）"
"1010906-20-ノア" = "戻りましたよ、先生。"
"1010906-21" = "[s] \"ノア、その格好は……。\""
"1010906-22-ノア" = "楽な格好に着替えてきただけですよ？"
"1010906-23-ノア" = "ふふっ、予備のパジャマを置いていって正解でした。"
"1010906-24-ノア" = "では気を取り直して、残りのお仕事を進めましょうか。"
"1010906-25" = "[s] \"誰か来たら、今度こそ誤解されちゃうよぉ……。\""
"1010906-26-ノア" = "「コーヒーで服が汚れた」と説明すれば、納得してくださると思いますよ？"
"1010906-27-ノア" = "それとも、他に気になることが……？"
"1010906-28" = "[s5] \"いや、そうじゃないけど……。\"\n[s6] \"パジャマも白いから、気を使うんじゃないかなって。\""
"1010906-29-ノア" = "大丈夫です、慣れていますから。"
"1010906-30-ノア" = "白は汚れやすいとよく言われますが、良いところもいっぱいあるんですよ？"
"1010906-31-ノア" = "どんな色にも合わせられますし、汚れてもすぐ気づけます。"
"1010906-32-ノア" = "熱を持ちにくいので、白い服は暑さをやわらげてくれますし。"
"1010906-33-ノア" = "それに、「シミ」がついても……思い出として記録できますから。"
"1010906-34" = "[ns] \"……ノア。\""
"1010906-35-ノア" = "は、はいっ？"
"1010906-36" = "[s7] \"コーヒーのシミはなかなか落ちないんだよ！\"\n[s8] \"だから、急いで洗わないと！\""
"1010906-37-ノア" = "……。"
"1010906-38-ノア" = "ふぅ……。"
"1010906-39-ノア" = "……肝心なところで、鈍感なんですから。"
"1010906-40" = "[s] \"ど、どういうこと……？\""
"1010906-41-ノア" = "……もう、知りません。"
"1010906-42" = "（そう言ってむくれてしまったノアは、しばらくの間ご機嫌斜めなままだった……）"
