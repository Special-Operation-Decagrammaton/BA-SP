[translation]
"1014008-1" = "見送るキツネ"
"1014008-2" = "（連邦生徒会の会議が長引いたある日）"
"1014008-3" = "（駅を出てシャーレへ復帰する頃……）"
"1014008-4" = "[ns1] \"街灯が……？\"\n[ns2] \"……道が暗い。\""
"1014008-5" = "[ns] \"うわっ！？\""
"1014008-6" = "[ns3] （暗いから、転びそうになる）\n[ns4] （ひとけがないし……）"
"1014008-7-クルミ" = "最近この街に強盗が現れたんだって。"
"1014008-8-クルミ" = "ひとけのない場所からあとをつけて財布とかを盗むらしいわ。"
"1014008-9" = "[ns] \"急がないと……。\""
"1014008-10" = "[ns] （誰かにつけられてる……？）"
"1014008-11" = "[ns5] \"た、助けてください！\"\n[ns6] \"か、金目のものはありません……！\""
"1014008-12-クルミ" = "……なに言ってるの？"
"1014008-13-クルミ" = "まさか、私を強盗だと勘違いしてたの？"
"1014008-14" = "[s7] \"クルミか……よかった。\"\n[s8] \"……尾行されたのかと思ったよ。\""
"1014008-15-クルミ" = "コンビニ帰りに見かけたから追ってたけど……やっぱり先生だったのね。"
"1014008-16-クルミ" = "そこまで怯えるなら、なんでひとりで夜道を歩いてたの？"
"1014008-17-クルミ" = "……私に連絡していいって言ったでしょ。"
"1014008-18" = "[s] \"すぐ着くから大丈夫だと思って。\""
"1014008-19-クルミ" = "本当に甘いわね。"
"1014008-20-クルミ" = "そんなんじゃ、いつか悪い子に襲われちゃうわよ？"
"1014008-21" = "[s9] \"それより、懐中電灯とか持ってる？\"\n[s10] \"暗すぎて道が見えなくて。\""
"1014008-22-クルミ" = "懐中電灯？今は持ってないけど。"
"1014008-23-クルミ" = "スマホのライト機能なら……。"
"1014008-24-クルミ" = "げっ、バッテリーが残り10％しかないわ。"
"1014008-25" = "[s] \"クルミの閃光盾は？\""
"1014008-26-クルミ" = "これは一時的に光を放つもので、道を照らすのには向いてないの。"
"1014008-27-クルミ" = "それに、こんな夜中にそんなことしたら近隣の迷惑になるでしょ？"
"1014008-28" = "[s] \"おっしゃる通りです……。\""
"1014008-29-クルミ" = "ほら、私の手握って。"
"1014008-30-クルミ" = "こう見えて夜目が利くから、私について来れば倒れることはないと思うわ。"
"1014008-31-クルミ" = "……手を握る必要はあるのかって？"
"1014008-32-クルミ" = "べ、別に変な意味じゃないわよ！？これは実際よく使われる戦術なんだから！"
"1014008-33-クルミ" = "ご、誤解しないで！ほら、ちゃんと手握って！"
"1014008-34" = "（クルミの手を握ったまま、暗い路地を歩いた）"
"1014008-35" = "[ns] \"クルミは……こういう状況に慣れているんだね。\""
"1014008-36-クルミ" = "当然。ポイントマンは、隊を導くのが仕事だもの。"
"1014008-37-クルミ" = "暗い場所でも先頭に立って、道を照らす。いつものことよ。"
"1014008-38-クルミ" = "でも気を緩めることはできないわ。"
"1014008-39-クルミ" = "暗闇の中、私が進む道を間違ってしまったら……。"
"1014008-40-クルミ" = "みんなを危険にさらすことになっちゃうんだから。"
"1014008-41-クルミ" = "一歩進むたびに、恐怖が押し寄せてくるの。"
"1014008-42-クルミ" = "……私は、みんなを正しい方向へ導けているのかなって。"
"1014008-43" = "[s11] \"暗闇は、不安が大きくなるよね。\"\n[s12] \"一歩踏み出さない限り、何も見えないからさ。\""
"1014008-44-クルミ" = "そう。それが私を不安にさせ――"
"1014008-45" = "[s] \"でも、今は私の手を握っているでしょう？\""
"1014008-46-クルミ" = "…………。"
"1014008-47" = "[s13] \"クルミが足を踏み外しそうになったら、そのときは私が支える。\"\n[s14] \"だからこそ、小隊には後ろ盾が存在するんだよ。\""
"1014008-48-クルミ" = "ふふっ、先生も特殊部隊っぽいことを言うようになったわね。"
"1014008-49-クルミ" = "ええ。繋いだ手は、相手を前へ導くためだけじゃない。"
"1014008-50-クルミ" = "だから、先生――"
"1014008-51-クルミ" = "絶対、この手を離しちゃダメよ。"
"1014008-52" = "（その後、クルミと手を握ったままシャーレへ帰ってきた）"
