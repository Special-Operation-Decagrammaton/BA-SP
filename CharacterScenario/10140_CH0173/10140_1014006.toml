[translation]
"1014006-1" = "おめかしするキツネ"
"1014006-2" = "FOX小隊HQ"
"1014006-3" = "[ns] \"おはよう、みんな。\""
"1014006-4-クルミ" = "あれ、[USERNAME]先生？"
"1014006-5-クルミ" = "今日作戦はないはずなのに……何か用？"
"1014006-6" = "[ns] \"こないだ害獣駆除でお手伝いした農家からお礼が届いてね。\""
"1014006-7" = "[ns1] \"一人じゃ食べきれない量のジャガイモをもらったから……。\"\n[ns2] \"みんなにお裾分け。\""
"1014006-8-クルミ" = "あら、ありがとう！助かるわ！"
"1014006-9-クルミ" = "ジャガイモは色々料理できるものね。"
"1014006-10-クルミ" = "みんなで美味しくいただくわ。"
"1014006-11" = "[s] \"ところで、今日はひとり？\""
"1014006-12-クルミ" = "ええ。みんな用事があって。"
"1014006-13-クルミ" = "みんなに要件でもあったの？"
"1014006-14" = "[s3] \"特にないけど。\"\n[s4] \"クルミと二人きりって、なんか緊張しちゃって。\""
"1014006-15-クルミ" = "……急にキモイこと言わないでくれる？今更でしょ。"
"1014006-16" = "[ns] \"クルミは何してたの？\""
"1014006-17-クルミ" = "ああ、盾の手入れをしてたのよ。"
"1014006-18-クルミ" = "最近よく作戦に出かけるから、キズとかペンキの剥がれが目立つようになっちゃって……。"
"1014006-19-クルミ" = "ちゃんと磨いて、色も新しく塗ろうと思ってね。"
"1014006-20" = "[s] \"そうなんだ。お疲れ様。\""
"1014006-21" = "[ns5] \"毎回こうやって盾の手入れを？\"\n[ns6] \"キズとかできやすいと思うけど……。\""
"1014006-22-クルミ" = "ああ、毎回塗る必要ないんじゃないってこと？"
"1014006-23-クルミ" = "たしかに銃弾を防ぐために作られたものだし、擦れたり壊れるものだから、毎回丁寧に手入れする必要はないけど……。"
"1014006-24-クルミ" = "私は綺麗にしておきたいのよね。"
"1014006-25-クルミ" = "作戦のとき、相手が最初に目にするのは、ポイントマンが持っているこの盾だもの。"
"1014006-26-クルミ" = "そういう意味では、この盾が小隊の印象を決定づけるのよ。#nなら、綺麗にしておきたいじゃない？"
"1014006-27-クルミ" = "まあ、戦闘に入ったらそんなこと気にする余裕なんてないでしょうけど。"
"1014006-28-クルミ" = "……やっぱり、自己満足にすぎないのかな。"
"1014006-29" = "[s7] \"私は素晴らしいと思うよ。\"\n[s8] \"そういう心構えが、FOX小隊をより強くしたんだと思う。\""
"1014006-30-クルミ" = "そ、そう？先生なら分かってくれると思ったわ！"
"1014006-31-クルミ" = "そういった日頃からの心構えが大切よね。たとえ、相手が敵だとしても。"
"1014006-32-クルミ" = "……たまに、お気に入りのシールも貼ったりしてるの。"
"1014006-33-クルミ" = "見て。こないだの雑誌の付録でもらったやつ。かわいいでしょ？"
"1014006-34" = "[s] \"かわいいね！\""
"1014006-35" = "[ns] \"そういえば、景品でもらったシールがあるんだけど。\""
"1014006-36-クルミ" = "これは、ネコちゃんのシール？"
"1014006-37-クルミ" = "かわいい……。"
"1014006-38" = "[s] \"これ、盾に貼って――\""
"1014006-39-クルミ" = "貼らない！"
"1014006-40-クルミ" = "銃弾が飛び交う戦場で使う盾に、こんなかわいいシールを貼るなんて……#n先生は人の心がないの？"
"1014006-41-クルミ" = "こんなものを貼ったら、FOX小隊は血も涙もない鬼集団って思われちゃうでしょ！"
"1014006-42" = "[s9] \"ごめん、そこまでは考えてなかった。\"\n[s10] \"じゃあ、このシールは私が――\""
"1014006-43-クルミ" = "……イヤ。"
"1014006-44-クルミ" = "返さない。"
"1014006-45-クルミ" = "盾じゃなくても貼る場所はあるもの。日記帳とか、軍用手帳とか……。"
"1014006-46" = "[s] \"クルミ、もしかして……。\""
"1014006-47-クルミ" = "べ、別に先生からもらったものだから大事にしてるわけじゃないわよっ！"
"1014006-48-クルミ" = "これはただ……ネ、ネコが好きなだけなんだから！"
"1014006-49-クルミ" = "か、勘違いしないでよ！バカ！"
"1014006-50" = "（その後、クルミの罵倒を浴びせられながら楽しい手入れの時間を過ごした）"
