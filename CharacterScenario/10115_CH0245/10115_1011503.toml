[translation]
"1011503-1" = "コントロールの特訓"
"1011503-2-レイ" = "というわけで！次はピッチングの練習をやります！"
"1011503-3" = "[ns1] \"あれ？\"\n[ns2] \"レイはピッチャーもやるんだっけ\""
"1011503-4-レイ" = "いえ。私はバッター専業ですよ。"
"1011503-5-レイ" = "たしかに、極稀に「二刀流」と呼ばれる……"
"1011503-6-レイ" = "つまり、ピッチャーとバッターの両方をこなす選手もいますが。"
"1011503-7-レイ" = "私はまだそんなレベルじゃないですし……。"
"1011503-8-レイ" = "でも、いつかはそうなりたいって思ってます！"
"1011503-9-レイ" = "私の場合、まずはバッティングの上達からかなって。"
"1011503-10-レイ" = "バッティングが上手くなるためには、ピッチングの練習をして、#nピッチャー目線でバッターを見るのも大事だと思ったんです。"
"1011503-11-レイ" = "ピッチャーの気持ちを理解して、次に来る球を予測できるようになれば、#nもっと的確にスイングできるはずですから！"
"1011503-12-レイ" = "球のコースを予測して、狙って撃てば……。"
"1011503-13-レイ" = "そうすれば打率が上がって、飛距離も伸びて……最終的には……！"
"1011503-14-レイ" = "ホームランだって打てるようになると思いませんか！？"
"1011503-15" = "[s] \"そうかもしれない！\""
"1011503-16-レイ" = "ですよね！？"
"1011503-17-レイ" = "ということで、今日はピッチング練習を頑張ります！"
"1011503-18" = "（そう言ってレイは意気揚々とマウンドに向かったが……）"
"1011503-19-レイ" = "<デッドボール！>"
"1011503-20-レイ" = "力入りすぎたかな……？"
"1011503-21-レイ" = "次こそは！"
"1011503-22-レイ" = "<ボール……フォアボール！>"
"1011503-23-レイ" = "えっ、真ん中を狙ったのに！？"
"1011503-24-レイ" = "……いや、冷静になれ、私！ピッチャーに大事なのは落ち着き……！"
"1011503-25-レイ" = "<ホームラン！>"
"1011503-26-レイ" = "私だってまだ打ったことないのに！？"
"1011503-27-レイ" = "球が甘かった……？次は慎重に……。"
"1011503-28-レイ" = "<デッドボール！……エラー。バッターロボットの左腕が破損しました>"
"1011503-29-レイ" = "うっ……！"
"1011503-30-レイ" = "<デッドボール！……エラー。バッターロボットの腹部が破損しました>"
"1011503-31-レイ" = "今度こそ……っ！"
"1011503-32-ロボット練習サポーター" = "<デッドボール！……エラー。バッターロボットの頭部が破損。メインカメラが損傷しました>"
"1011503-33-ロボット練習サポーター" = "<……エラー。使用可能なバッターロボットが見つかりません。#n使用可能なバッターロボットを準備してください>"
"1011503-34-レイ" = "ぐぬぬ……。"
"1011503-35-レイ" = "どうしてうまくいかないんでしょうか……。"
"1011503-36" = "[ns] \"誰だって最初は失敗するものだよ\""
"1011503-37-レイ" = "ううっ。先生……。"
"1011503-38-レイ" = "何か、良い練習方法はありませんか……？"
"1011503-39-レイ" = "私はどうすれば……。"
"1011503-40" = "[ns] \"うーん……ピッチャーに必要なものって何だと思う？\""
"1011503-41-レイ" = "コントロール……だと思っています。"
"1011503-42-レイ" = "「ストライクを投げろ。ホームプレートの位置は変わらない」って言われるほどですから。"
"1011503-43-レイ" = "まずストレートで制球力を磨いてから、カーブの練習をすると良いとも聞きますし。"
"1011503-44" = "[s3] \"コントロールか……。\"\n[s4] \"よし、また特訓をしよう！\""
"1011503-45-レイ" = "ぜひお願いします！……って、先生、どちらへ？"
"1011503-46-レイ" = "え、練習場でやるんじゃないんですか？"
"1011503-47-レイ" = "また！"
"1011503-48-レイ" = "またゲームセンターじゃないですか！今日はコントロールの特訓をするのでは？"
"1011503-49-レイ" = "えっ？前とは違うゲームを使うんですか？"
"1011503-50-レイ" = "ダーツ、ですか。やってみるのは初めてですね。"
"1011503-51-レイ" = "ダーツを投げて、的に当てて得点を競うルール……なるほど。"
"1011503-52-レイ" = "集中力やコントロールを鍛えるには良さそうな感じがします。やってみます！"
"1011503-53-レイ" = "えいっ！"
"1011503-54-レイ" = "ブル！950点！"
"1011503-55-レイ" = "あと……一投……！"
"1011503-56-見物しているゲーマーA" = "見ろよ！あの子、真ん中に5回連続で当ててるぞ！"
"1011503-57-見物しているゲーマーB" = "最後もハットトリックで締めるのか……？"
"1011503-58-レイ" = "ふぅ……。"
"1011503-59-レイ" = "それっ！"
"1011503-60-レイ" = "ブル！1000点！おめでとうございます！本日の最高スコアです！"
"1011503-61" = "[ns5] \"すごいよ、レイ！\"\n[ns6] \"コントロールの才能あるんじゃない？\""
"1011503-62-レイ" = "……。"
"1011503-63-レイ" = "いいえ、これじゃダメです！"
"1011503-64" = "[s] \"え？どうして？\""
"1011503-65-レイ" = "ダーツは、野球ボールに比べて軽すぎます！"
"1011503-66-レイ" = "ピッチャーとしてのコントロールを鍛えるには、必要な条件があるんです。"
"1011503-67-レイ" = "少し投げにくくて、適度な重さを持っているもの……。"
"1011503-68-レイ" = "！"
"1011503-69-レイ" = "先生、分かりました！"
"1011503-70" = "[s] \"その心は？\""
"1011503-71-レイ" = "それは……フリスビーです！"
"1011503-72" = "[s] \"えっ……？\""
"1011503-73-レイ" = "大きな弧を描いて戻ってくるように投げますね！"
"1011503-74" = "[ns] \"それはフリスビーじゃなくてブーメラン！\""
"1011503-75-レイ" = "コントロールさえあればできます！"
"1011503-76-レイ" = "今度は……まっすぐ飛んだ後、急に跳ね上がる感じで投げます！"
"1011503-77" = "[ns] \"変なところに飛んで行ったら危ないんじゃ……\""
"1011503-78-レイ" = "これも大丈夫です、コントロールさえあればできます！"
"1011503-79-レイ" = "さあ、次は先生の番です。"
"1011503-80-レイ" = "えっ、なにを驚いているんですか。先生も投げるんですよ。"
"1011503-81-レイ" = "飛んでくるフリスビーをキャッチするのは、野手の練習にもなりますから。"
"1011503-82" = "（レイに押されて、フリスビーを投げてみた）"
"1011503-83-レイ" = "あっ、風に流されて変なほうに……でも大丈夫です！ヘッドスライディングなら……！"
"1011503-84-レイ" = "届けえぇっ――！！"
"1011503-85-レイ" = "やった！捕れました！でも、これじゃまだまだ足りません……次はもっと高く投げてください！"
"1011503-86" = "[s] \"頭の上を越えちゃうんじゃない？\""
"1011503-87-レイ" = "フライは頭の上を越えていくものです。"
"1011503-88-レイ" = "お願いします！"
"1011503-89-レイ" = "……ほっ！"
"1011503-90-レイ" = "ジャンプすれば意外と届きますね……"
"1011503-91-レイ" = "……じゃあ、今度は思いっきり遠くに！"
"1011503-92" = "[s] \"今度こそ、捕れないかも知れないよ……？\""
"1011503-93-レイ" = "ヒットは自分の思い通りになんて飛んでくれません！"
"1011503-94-レイ" = "バッチコーイ！"
"1011503-95" = "あれ見て。シャーレの先生じゃない？"
"1011503-96-市民１" = "フリスビー投げて拾わせたり、わざと遠くに投げたり……犬みたいな扱い……。"
"1011503-97-市民２" = "先生って色々噂はあるけど、まさか生徒にこんなことまでしてるとはね……。"
"1011503-98" = "[ns] \"また、私の評判が……\""
"1011503-99-レイ" = "何か言いました？早く次、投げて下さーい！"
