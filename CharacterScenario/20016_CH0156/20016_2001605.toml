[translation]
"2001605-1" = "狡猾なフロイライン"
"2001605-2" = "（いつものようにシャーレで、やってもやっても終わらない仕事をしていた時……）"
"2001605-3-イロハ" = "どうも、生きてますか？"
"2001605-4" = "[s] \"いらっしゃい、イロハ……何とかね……。\""
"2001605-5-イロハ" = "そうでしたか、結構ギリギリみたいですね。"
"2001605-6-イロハ" = "クマがすごいことになって、そのままでもホラー映画に出られそうな感じですが。"
"2001605-7" = "[s] \"褒め言葉……ではないよね……？\""
"2001605-8-イロハ" = "（……反応がいつもより弱いですね）"
"2001605-9-イロハ" = "まあ、「苦労は買ってでもせよ」に特に反対はしませんので、そこに関与はしませんが。"
"2001605-10-イロハ" = "私がおとなしく、隣で仕事……もとい、サボることを全力でします。"
"2001605-11-イロハ" = "……。"
"2001605-12" = "[s] \"うん、了解……何もできなくてごめんね……。\""
"2001605-13-イロハ" = "先生、大丈夫ですか？"
"2001605-14" = "[s1] \"大丈夫、ちょっとめまいが来ただけで……。\"\n[s2] \"あ、コーヒーならポットにあるよ。\""
"2001605-15-イロハ" = "ふぅ……。"
"2001605-16-イロハ" = "ふぅ……。"
"2001605-17-イロハ" = "……。"
"2001605-18-イロハ" = "そこの机、借りますね。"
"2001605-19-イロハ" = "ふむ、これは……。"
"2001605-20-イロハ" = "うーん、良くないですね……。"
"2001605-21-イロハ" = "これは参りましたね～……。"
"2001605-22" = "[s] \"……イロハ、どうしたの？\""
"2001605-23-イロハ" = "はい？"
"2001605-24-イロハ" = "いえ、お気になさらず。先日のメンテナンスの確認です。"
"2001605-25-イロハ" = "これでも戦車長なので、整備とかも担当していまして。"
"2001605-26-イロハ" = "まあ総合評価としては、Aくらいですかね……。"
"2001605-27" = "[s] \"さすが、良さそうな結果だね。\""
"2001605-28-イロハ" = "いえ、一番上はSなので。つまりAというのは……"
"2001605-29-イロハ" = "万魔殿におけるトップレベルの優等生であり、最高の戦車長であり、「憧れのゲヘナ生ランキング2年生編」において常に300位圏を死守する私にとっては――"
"2001605-30" = "[s] \"何ともコメントしがたい数字。\""
"2001605-31-イロハ" = "……先生？"
"2001605-32" = "[s] \"流石はイロハ先輩！\""
"2001605-33-イロハ" = "言わされた感マシマシですね。"
"2001605-34-イロハ" = "とにかくこのAという結果は、私にとっては恥も良いところです。"
"2001605-35-イロハ" = "まだまだ未熟ということですね。"
"2001605-36-イロハ" = "ふむ、内容としては装備の老化の見落としと、あとは……。"
"2001605-37-イロハ" = "なるほどなるほど、めんどくさいですが……こうなっては仕方ありませんね。"
"2001605-38-イロハ" = "というわけで先生。困ってる生徒のために、少しだけ時間を貸していただけませんか？"
"2001605-39" = "[s] \"えっと、今からの方が良さそう……？\""
"2001605-40-イロハ" = "はい、今です。これについては、万魔殿からシャーレへの正式な依頼だと思ってもらっても構いません。"
"2001605-41-イロハ" = "つまりゲヘナの優等生、そしてゲヘナの生徒会に借りを作っておくチャンスですよ？"
"2001605-42-イロハ" = "それでも、ダメですか？"
"2001605-43" = "[s] \"まあ、そこは気にしないけど……とりあえず了解。\""
"2001605-44-イロハ" = "そうでしたか、では早速……"
"2001605-45-イロハ" = "ショッピング、行きましょうか。"
"2001605-46" = "ゲヘナ自治区東・商店街"
"2001605-47-イロハ" = "さて、では最初に……"
"2001605-48-イロハ" = "こちらのお店です。"
"2001605-49" = "[s] \"……ぬいぐるみ？\""
"2001605-50-イロハ" = "いらっしゃいませ、何かお探しのものはありますでしょうか？"
"2001605-51-イロハ" = "ああ、少々お待ちを。買い物リストがあるので。えっと……"
"2001605-52-イロハ" = "「リボンのついたクマのぬいぐるみver.ゲヘナ」をください。"
"2001605-53" = "[s] \"……ん？\""
"2001605-54-店主" = "あ、お客さんラッキーですね！こちら限定版の商品なのですが、ちょうど昨日一つだけ入荷されたんですよ！"
"2001605-55-イロハ" = "ではそれを。あ、そのままで大丈夫です、プレゼント用ではないので。"
"2001605-56" = "[s] \"えっと、イロハ……？\""
"2001605-57-店主" = "お買い上げありがとうございます！"
"2001605-58-店主" = "さあ、最初の目標はクリアです。次へ行きましょう。"
"2001605-59" = "[s] \"……？\""
"2001605-60-イロハ" = "いらっしゃいませー。"
"2001605-61-イロハ" = "「ウェーブキャットの枕」、在庫はありますか？"
"2001605-62-店主" = "はい、それならこちらに……！"
"2001605-63-イロハ" = "ではそれを一つ。"
"2001605-64" = "[ns] \"？？？\""
"2001605-65" = "（その後もイロハは、あちこちのお店に向かっては次々に買い物を繰り返していった）"
"2001605-66-イロハ" = "この写真立てを。"
"2001605-67-イロハ" = "「ワサビ味ポテトチップス」を一つ。"
"2001605-68-イロハ" = "「恋よ鯉」さんの棚は、えっと……？"
"2001605-69-イロハ" = "「ふかふか座布団」ってまだ在庫あります？"
"2001605-70" = "[ns] \"……？\""
"2001605-71" = "（疑問ばかりが積もっていく中で、1時間ほど買い物を続けた後……）"
"2001605-72-イロハ" = "まあ、こんなものですかね。"
"2001605-73-イロハ" = "先生、わざわざお付き合いいただいてありがとうございました。"
"2001605-74-イロハ" = "おかげでリストにあったものはほとんど買えました。"
"2001605-75" = "[s] \"えっと、戦車の装備を見に来たはずだったのでは……？\""
"2001605-76-イロハ" = "私はそんなこと、一言も言っていませんよ？"
"2001605-77-イロハ" = "そもそも普通の部品ならともかく、万魔殿の主力戦車の部品はその辺で簡単に買えるものではありません。"
"2001605-78-イロハ" = "そのための買い物でしたら、わざわざこういう商店街には来てませんよ。"
"2001605-79" = "[s] \"じゃあ、今日の買い物は……\""
"2001605-80-イロハ" = "普通に私の買い物です。万魔殿の休憩スペース用の。"
"2001605-81-イロハ" = "私だけの休憩スペースがあるんですが、まあ逆に言うと誰かが補充してくれるようなところではないので。自分で買い物に来たんです。"
"2001605-82-イロハ" = "あとイブキが遊びに来た時のために、お菓子やおもちゃなども。"
"2001605-83" = "[s] \"そ、そっかぁ……。\""
"2001605-84-イロハ" = "何ですか、その表情は？"
"2001605-85-イロハ" = "仕方ないじゃないですか。今日は何だかシャーレに来た瞬間から、全然覇気が無いわ、ツッコミも弱いわで……"
"2001605-86-イロハ" = "面白くないと言いますか、プライドが許さないと言いますか……。"
"2001605-87-イロハ" = "そんな状態で私だけサボるのもあれなので、おびき寄せてみたわけです。"
"2001605-88-イロハ" = "結果は大成功です、ふふっ。"
"2001605-89-イロハ" = "どうですか、忙しいのに……いえ、忙しいからこそサボってみた感想は？"
"2001605-90" = "[s] \"イロハ……。\""
"2001605-91-イロハ" = "さて、そろそろ帰るとしましょうか。"
"2001605-92-イロハ" = "シャーレに戻ったらまずは、やり方の説明をしてください。中間管理職同志、困った時には助け合いということで。"
"2001605-93" = "[s3] \"イロハ……。\"\n[s4] \"ありがとね。\""
"2001605-94-イロハ" = "……何に対しての感謝なんですか、それは。"
"2001605-95-イロハ" = "……何に対しての感謝なんですか、それは。"
"2001605-96-イロハ" = "ふふっ、さあ帰りましょう。"
"2001605-97" = "（その後シャーレに戻ってからイロハに色々と手伝ってもらい、無事に仕事は片付いたのだった）"
