[translation]
"2001615-1" = "追憶するフロイライン"
"2001615-2" = "（……気がつけば、コーヒーを持って万魔殿まで来てしまっていた）"
"2001615-3" = "（何やら車庫の方が騒がしい）"
"2001615-4" = "（中に入ると……「休憩スペース」の外で、荷物が山積みになっていた）"
"2001615-5" = "[ns] \"イロハ？\""
"2001615-6-イロハ" = "あれ？先生？"
"2001615-7-イロハ" = "……本当に来てくださったんですね。"
"2001615-8-イロハ" = "そのコーヒー……もしかして私の分ですか？"
"2001615-9-イロハ" = "助かります。そろそろカフェインが切れそうだったので。"
"2001615-10" = "[s1] \"掃除してるの？\"\n[s2] \"えらいね。\""
"2001615-11-イロハ" = "えらい、ですか……。"
"2001615-12-イロハ" = "放っておくと地獄を見るので……今やっているだけです。"
"2001615-13" = "[s3] \"同じことじゃない……？\"\n[s4] \"やっぱりイロハはえらいよ。\""
"2001615-14-イロハ" = "……私はそう思いませんけど。"
"2001615-15-イロハ" = "まあ、わざわざ印象を悪くする理由もありませんし……そういうことにしておきます。"
"2001615-16-イロハ" = "……今日は本当にコーヒーを渡しに来られただけなんですか？"
"2001615-17" = "[s5] \"そういうわけじゃないよ。\"\n[s6] \"何か手伝えるかなと思って。\""
"2001615-18-イロハ" = "……ああ、なるほど。"
"2001615-19-イロハ" = "あのメッセージを、救難信号だと受け取られたんですね。"
"2001615-20-イロハ" = "でも……大丈夫なんですか？"
"2001615-21-イロハ" = "そんなことを言ったら、お言葉に甘えちゃいますよ？"
"2001615-22" = "[s7] \"何でも任せてよ！\"\n[s8] \"イロハにはいつも助けてもらってるからね！\""
"2001615-23-イロハ" = "……はぁ。"
"2001615-24-イロハ" = "そんなことを言っていると、悪い人に利用されちゃいますよ。"
"2001615-25-イロハ" = "まあ、私のことですけど。"
"2001615-26-イロハ" = "では……まずは家具から、ですね。"
"2001615-27" = "（しばらくイロハの休憩スペースを一緒に片付けた）"
"2001615-28" = "（そして……）"
"2001615-29-イロハ" = "お疲れさまでした。"
"2001615-30-イロハ" = "先生のおかげで日が沈む前に終わりましたね。"
"2001615-31" = "[s9] \"結構量があったね……。\"\n[s10] \"これ、一人でやるつもりだったの？\""
"2001615-32-イロハ" = "ええ、まあ……。休憩スペースには私物が多いので。"
"2001615-33-イロハ" = "誰かに手伝ってもらうつもりも……なかったですね。"
"2001615-34-イロハ" = "先生は以前にもここに入っていますし、色々見せても問題ありませんから……#nそういう意味では適任だったんです。"
"2001615-35-イロハ" = "……色々は色々です。"
"2001615-36-イロハ" = "ふふ、なら……。"
"2001615-37-イロハ" = "どこまで見せても大丈夫なのか……。"
"2001615-38-イロハ" = "今、確かめてみます？"
"2001615-39" = "[s11] \"あ、えっと、大丈夫！\"\n[s12] \"そういえばさっき本を見つけたよ！\""
"2001615-40-イロハ" = "……分かりやすい話題逸らしですね。"
"2001615-41-イロハ" = "あれ、その本……？"
"2001615-42-イロハ" = "ああ、どうりで見つからないわけです。#n棚から抜けていたんですね、ありがとうございます。"
"2001615-43" = "[ns] 特別な本なの？"
"2001615-44-イロハ" = "まあ……そう、なりますね。"
"2001615-45-イロハ" = "……先生は、ご自身の趣味のきっかけって覚えていますか？"
"2001615-46-イロハ" = "私は覚えています。最初にその本を読んだとき――"
"2001615-47-イロハ" = "「本の中の世界ってこんなに広いんだ」と驚いて。#nそこから、似た傾向の物語を追いかけているうちに、そのまま抜けられなくなったというか……。"
"2001615-48-イロハ" = "えいっ。"
"2001615-49" = "[ns13] \"大切な本じゃなかったの！？\"\n[ns14] \"そんな雑に扱っていいの！？\""
"2001615-50-イロハ" = "へ？いえ、全然大事じゃないですよ。"
"2001615-51-イロハ" = "私が本にのめり込んだのはかなり前のことですし。"
"2001615-52-イロハ" = "そんな古い本が残っているわけないじゃないですか。これは買い直したものです。"
"2001615-53-イロハ" = "思い出の品でも初版でも限定版でもなく……。#n処分しても心が痛まない類いのものですよ。"
"2001615-54" = "[s15] \"でも好きな本なんでしょ？\"\n[s16] \"ブックカバーとかつけなよ？\""
"2001615-55-イロハ" = "いやです。面倒なので。"
"2001615-56-イロハ" = "まあ、思い出があるわけじゃないとは言いましたけど……。"
"2001615-57-イロハ" = "この本を見るたびに、今日の会話くらいは思い出すかもしれませんね。ふふ。"
