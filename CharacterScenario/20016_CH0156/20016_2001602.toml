[translation]
"2001602-1" = "襲来するフロイライン "
"2001602-2" = "（日差しの暖かい、穏やかな昼下がり）"
"2001602-3" = "（手元の仕事もひと段落し、久しぶりにのんびりとした時間が訪れていた）"
"2001602-4" = "[ns] \"こんなに何も無い時間なんて珍し――\""
"2001602-5-イロハ" = "失礼します。"
"2001602-6" = "[s1] \"ですよね。\"\n[s2] \"イロハ、急にどうしたの……？\""
"2001602-7-イロハ" = "いえ、大したことではありません。"
"2001602-8-イロハ" = "いえ、大したことではありません。"
"2001602-9-イロハ" = "シャーレにいると聞いたので、それで伺っただけです。"
"2001602-10-イロハ" = "万魔殿から任務と言いますか、シャーレ……すなわち先生をおびき寄せろ、とのことでして。"
"2001602-11-イロハ" = "脅迫でも懐柔でも人質でも、或いは誘惑でも何でも良いから、"
"2001602-12-イロハ" = "どうにかして味方に付けろと言われました。"
"2001602-13-イロハ" = "それでここに来たわけですが、これ以外に何か質問は？"
"2001602-14" = "[s] \"……そういうのって、相手に全部言っちゃって良いの？\""
"2001602-15-イロハ" = "…………。"
"2001602-16-イロハ" = "めんどくさい人ですね……。"
"2001602-17" = "[s] \"私が悪いのかなこれ！？\""
"2001602-18-イロハ" = "いや、だってめんどくさいじゃないですかこういうの……。"
"2001602-19-イロハ" = "まあ別に、それについて説明しても良いのですが……。"
"2001602-20-イロハ" = "言ってしまえば単に、外堀から埋めようとしたり、策略を練って様子を伺ったりしても意味が無さそうだなと思っただけです。"
"2001602-21-イロハ" = "万魔殿で把握している情報からすると、そもそも先生がそういった手段に騙されにくいことは分かっていましたし。"
"2001602-22-イロハ" = "なのでそんなことをするくらいだったら、最初から全部堂々と言ってしまえば……"
"2001602-23-イロハ" = "「敵意」を買うことにはなりませんし、まあその方が損は無いでしょうと思ったんです。"
"2001602-24-イロハ" = "あとめんどくさいですし。"
"2001602-25" = "[s] \"それが本音なんだね……。\""
"2001602-26-イロハ" = "それに、自分の本心を隠している人に近づかれたくはないでしょう？"
"2001602-27-イロハ" = "そういうリスクも計算してと言いますか、できるだけ本音を言うに越したことは――"
"2001602-28" = "[s] \"その辺はまあ、もしイロハが何か隠してても多分気にしないけど……。\""
"2001602-29-イロハ" = "……？"
"2001602-30-イロハ" = "……どういうことですか？"
"2001602-31-イロハ" = "もし表面上だけニコニコして近づく存在がいたら、普通嫌じゃないですか？自分が利用されそうだなと思いませんか？"
"2001602-32-イロハ" = "そんなトリニティみたいなやり方、気味悪くありません？"
"2001602-33" = "[s3] \"せめてもう少しオブラートに！\"\n[s4] \"まあそういう時は、それなりの事情があるんだろうから……。\""
"2001602-34-イロハ" = "……調査で予め知ってはいましたが、こういう方でしたか。"
"2001602-35-イロハ" = "……調査で予め知ってはいましたが、こういう方でしたか。"
"2001602-36-イロハ" = "まあ先生がそう仰るのであれば、その辺については何でも良いのですが……。"
"2001602-37-イロハ" = "ではあらためて、一度真正面からお願いしてみましょうか？"
"2001602-38-イロハ" = "先生、シャーレのお力を私たち万魔殿にお貸しください。"
"2001602-39-イロハ" = "全面的にという形でなくても、協業やサポートという形でも構いません。"
"2001602-40-イロハ" = "もちろん、十分な報酬はお約束いたしましょう。"
"2001602-41-イロハ" = "「キヴォトスを制圧した暁には、このキヴォトスの半分をくれてやろう！」……みたいなことも言ってましたので。"
"2001602-42-イロハ" = "まあ、この辺はあんまり信頼しないでください。こういうのは凡そにして強調されまくってるものなので。"
"2001602-43-イロハ" = "「半分には及ばないもののまあ主観的には半分くらい」だと思っててください。アイスの配分のようなものです。"
"2001602-44-イロハ" = "というわけで、いかがでしょうか？"
"2001602-45" = "[s] \"お断りします……。\""
"2001602-46-イロハ" = "そうでしたか、了解です。"
"2001602-47" = "[s] \"……？\""
"2001602-48" = "[ns] \"イロハ、どうして急にソファに……。\""
"2001602-49-イロハ" = "少々お待ちを、ベストポジションを探してますので。"
"2001602-50-イロハ" = "……はい、こんな感じですね。"
"2001602-51" = "[ns5] \"読書始めちゃった！\"\n[ns6] \"展開についていけない！\""
"2001602-52-イロハ" = "あ、そういえば……。"
"2001602-53-イロハ" = "あ、そういえば……。"
"2001602-54" = "[ns] \"そういえば……？\""
"2001602-55-イロハ" = "シャーレにもコーヒーぐらいはありますよね？温かいエスプレッソでお願いします。"
"2001602-56-イロハ" = "では、私は読書に戻るので。"
"2001602-57" = "[ns] \"……えぇ？\""
"2001602-58" = "（そうして突如としてシャーレに襲来して寛ぎ始めたイロハを横に、変な緊張感を持ったまま過ごすことになった）"
