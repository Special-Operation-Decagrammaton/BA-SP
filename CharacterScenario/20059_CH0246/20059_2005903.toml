[translation]
"2005903-1" = "小悪魔とバイヤー"
"2005903-2" = "（そして夕方、ムツキとブラックマーケットを訪ねた）"
"2005903-3-ムツキ" = "こっちだよ、先生！早く行こ！"
"2005903-4" = "[ns] \"ブラックマーケットのコンビニ、久しぶりかも。\""
"2005903-5-ムツキ" = "面白い爆弾が入荷されたんだって～"
"2005903-6-ムツキ" = "レインボー煙幕弾ってやつ。#n殺虫効果が凄いらしいよ？"
"2005903-7-ムツキ" = "これ一発で部屋中の蚊が全滅！"
"2005903-8-ムツキ" = "どう？すっごい便利だと思わない？"
"2005903-9" = "[s] \"おお！私も買おうかな？\""
"2005903-10-ムツキ" = "くふふっ。ねっ、面白いでしょ？#nいっぱい買ってこ♪"
"2005903-11-ムツキ" = "虹色のパッケージらしいんだけど……。"
"2005903-12-ムツキ" = "……あれ？"
"2005903-13-ムツキ" = "ん～……？#nどこにもないなー。"
"2005903-14" = "[s] \"普通の爆弾も置いてないね。\""
"2005903-15-ムツキ" = "もしかして、爆弾を探してるんですか？"
"2005903-16-ムツキ" = "多分無理ですよ。#nヘルメット団が買い占めちゃったので。"
"2005903-17" = "[s] \"ヘルメット団が？\""
"2005903-18-ムツキ" = "ええ。あとはそこにある模造品だけです。"
"2005903-19-コンビニバイト" = "よければ再入荷時に何個か取り置きしておきましょうか？"
"2005903-20-コンビニバイト" = "その分割高にはなりますけどね。ははっ。"
"2005903-21-ムツキ" = "あははっ。遠慮しとくね♪"
"2005903-22-ムツキ" = "そこまでして買いたくはないかな～"
"2005903-23-ムツキ" = "行こっか、先生。#n爆弾がないのは本当みたいだし。"
"2005903-24-ムツキ" = "くふふっ、なんだか事件の匂いがするねぇ～？"
"2005903-25-ムツキ" = "調査ついでに聞き込みでもしてみよっかな？"
"2005903-26" = "（聞き込みの情報をまとめた結果……）"
"2005903-27-ムツキ" = "ヘルメット団が爆弾を買い占めてるのは本当みたい。"
"2005903-28-ムツキ" = "それを転売してるんだって。"
"2005903-29-ムツキ" = "爆弾は消耗品だから、みんな泣く泣く転売品を買ってるみたいだよ。"
"2005903-30-ムツキ" = "このままじゃ……。"
"2005903-31-ムツキ" = "転売屋だらけになっちゃう！#nそんなの許せるわけなくない？"
"2005903-32" = "[s] \"爆弾の転売、か……。\""
"2005903-33-ムツキ" = "先生！一緒に奴らを見つけよう！"
"2005903-34-ムツキ" = "私、いい考えがあるの！"
"2005903-35" = "（しばらくして、とある日……）"
"2005903-36" = "ヘルメット団の秘密物流倉庫"
"2005903-37-ヘルメット団A" = "そろそろ時間だな……。"
"2005903-38-ヘルメット団A" = "きひっ！どんなマヌケか知らねえが、ありがてえ話だ。うちのモン全部買ってくれるなんてな！"
"2005903-39-ヘルメット団A" = "油断するな。他の組織の奴かもしれないぞ。"
"2005903-40-ヘルメット団B" = "よし、来たぞ。"
"2005903-41" = "[ns] \"こちらです、お嬢様。\""
"2005903-42-ムツキ" = "……。"
"2005903-43-ヘルメット団A" = "お……見るからに金持ちっぽいな？"
"2005903-44-ヘルメット団C" = "おい、お前が例の購入者か？"
"2005903-45" = "[s1] \"無礼者め！\"\n[s2] \"こちらはあのカッペリーニ・ファミリーの、カペラお嬢様だぞ！\""
"2005903-46-ヘルメット団B" = "カッペリーニ・ファミリー……？そんなのいたか？"
"2005903-47-ヘルメット団B" = "で、そんなとこのお嬢様が大量の爆弾をどうするつもりだ？"
"2005903-48-ムツキ" = "はあ。くだらない質問ね。"
"2005903-49-ムツキ" = "[ruby=わたくし]私が[/ruby]どうしようと、貴女たちには関係ないでしょう？"
"2005903-50-ムツキ" = "貴女たちはただブツを渡せばいいの。"
"2005903-51-ヘルメット団C" = "そ、そりゃそうだけどよ……。"
"2005903-52-ムツキ" = "分かったなら早く渡しなさい。#nこんな汚らわしい場所、すぐにでも出ていきたいんだから。"
"2005903-53-ヘルメット団B" = "くっ、ムカつく女だぜ。"
"2005903-54-ヘルメット団A" = "嫌な奴め！"
"2005903-55-ヘルメット団A" = "もういい。まずはカネを見せろ！"
"2005903-56-ムツキ" = "フン。疑り深い小心者ね。"
"2005903-57-ムツキ" = "[USERNAME]、カバンを。"
"2005903-58" = "[s] \"はい、お嬢様。\""
"2005903-59-ヘルメット団C" = "これ、本物だよな？"
"2005903-60-ムツキ" = "当然よ。あなた、まさか見分けられないの？"
"2005903-61-ヘルメット団A" = "本物は表面だけかもしれないだろ！一旦よこせ、後はこっちで確認する！"
"2005903-62" = "[s] \"止まれ。次はこっちの番だ。\""
"2005903-63-ヘルメット団A" = "ええ。こちらのターンね。"
"2005903-64-ヘルメット団A" = "例の物を見せなさい。お金はこちらの確認が終わってからよ。"
"2005903-65-ムツキ" = "フン、いいだろう。"
"2005903-66" = "（布を剥がすと、箱には大量の爆弾があった）"
"2005903-67-ムツキ" = "一つ、手に取ってみても？"
"2005903-68-ヘルメット団A" = "ど、どうする？"
"2005903-69-ヘルメット団B" = "1個くらい、好きにさせてやれ。"
"2005903-70-ヘルメット団A" = "い、いいだろう！"
"2005903-71-ムツキ" = "確認できましたわ。たしかに本物ですわね。"
"2005903-72-ムツキ" = "くふふっ♪先生、ありがたいことに爆弾が一か所にまとまってる。"
"2005903-73-ムツキ" = "狭いところに押し込められた大量の爆弾……なんだか見覚えがない？"
"2005903-74" = "[s3] \"なるほど……。\"\n[s4] \"私は隠れていればいいかな？\""
"2005903-75-ムツキ" = "三つ数えたら始めるね？"
"2005903-76-ムツキ" = "さんっ、にー……。"
"2005903-77-ヘルメット団A" = "おい！なに二人でコソコソ――"
"2005903-78-ムツキ" = "いち！"
"2005903-79-ヘルメット団A" = "え？"
"2005903-80-ヘルメット団A" = "ばっ、バカっ！？こっちには爆弾の山があるんだぞ！これじゃ……！"
"2005903-81-ムツキ" = "ぜーんぶ爆発しちゃうね！"
"2005903-82-ムツキ" = "でも関係ないよ。これは「メッセージ」だから！"
"2005903-83-ヘルメット団A" = "あっ、あいつ……！最初から爆弾を買うつもりなんて……！！"
"2005903-84-ヘルメット団A" = "ぐ、ぐあっ……！みんな、逃げろ……！！"
"2005903-85-ムツキ" = "くふふっ！転売屋と爆弾を一網打尽！"
"2005903-86-ムツキ" = "これでもう、爆弾を転売しようとするバカは現れないはず。"
"2005903-87-ムツキ" = "あ～楽しかった。"
"2005903-88-ムツキ" = "ねっ？先生。"
"2005903-89" = "[s5] \"ええ、お嬢様。\"\n[s6] \"これで今後も無事、趣味を続けられますね。\""
"2005903-90-ムツキ" = "あはははっ！先生の執事の真似、超おもしろーい。"
"2005903-91" = "（現場をひと通り片付け、その場を後にした）"
"2005903-92" = "（これでうまく解決するといいけど……）"
