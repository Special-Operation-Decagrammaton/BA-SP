[translation]
"2600906-1" = "ゲーム開発部の掃除"
"2600906-2" = "（ゲーム開発部の掃除を手伝うために部室を訪れた）"
"2600906-3" = "ミレニアム・ゲーム開発部の部室"
"2600906-4" = "[ns] \"……ユズ？\""
"2600906-5-ユズ" = "せ、せせ、先生！？い、いつから……？"
"2600906-6-ユズ" = "全然気づきませんでした……どうしてここに……？"
"2600906-7" = "[s] \"ユズの掃除を手伝いに来たよ。\""
"2600906-8-ユズ" = "あ、そうでしたか……ありがとうございます。"
"2600906-9-ユズ" = "でも大丈夫です。もうほとんど終わってますから。"
"2600906-10" = "[s1] \"ほとんど終わってる……？\"\n[s2] \"机の上にお菓子の袋や空き缶が残ってるけど……。\""
"2600906-11-ユズ" = "机の上……？"
"2600906-12-ユズ" = "……あ。もしかして、誤解させてしまったかもしれません。"
"2600906-13-ユズ" = "わたしが掃除すると言っていたのは、#n部室ではなくパソコンのストレージのことです。"
"2600906-14-ユズ" = "パソコンのストレージも現実の作業スペースと同じで、#n溜まった一時ファイルを整理してあげないと#n作業速度が遅くなるんです。"
"2600906-15-ユズ" = "特に最近は長い間作業していたからか、#n速度がかなり遅くなった気がして……"
"2600906-16-ユズ" = "ですので、不要なファイルを削除し#nレジストリを整理する「掃除」をしていたわけです。"
"2600906-17" = "[ns] \"だから一人でするものって言ってたんだ……。\""
"2600906-18" = "[ns] \"じゃあ、部室の掃除の方は……？\""
"2600906-19-ユズ" = "ぶ、部室ですか……？"
"2600906-20-ユズ" = "ええと、部室の掃除は……他にやらないといけない作業もあるし、部員のみんなも特に気にしてないみたいだし……後で、いいかな、と……。"
"2600906-21" = "[s3] \"ダメだよ。後回しにすると余計に大変になるから。\"\n[s4] \"手伝うから、今から片付けよう。\""
"2600906-22-ユズ" = "うう……で、でもこのまま掃除を始めたら#n服が汚れちゃいそうで……着替えもないですし……。"
"2600906-23" = "[s5] \"こんなこともあろうかと……。\"\n[s6] \"「メイドラマチック」からメイド服を借りてきたよ！\""
"2600906-24-ユズ" = "――何でですか！"
"2600906-25-ユズ" = "……でも先生の仰る通り、#n早く掃除をしないともっと大変になるでしょうし、#n他の作業着もないので……。"
"2600906-26-ユズ" = "少しだけ……掃除をしている間だけなら……。"
"2600906-27-ユズ" = "……ロッカーで着替えてきます。"
"2600906-28" = "（その後、メイド服を着たユズと部屋の掃除をした）"
"2600906-29-ユズ" = "……これで一通り終わりましたね。お疲れ様でした……。"
"2600906-30" = "[s] \"お疲れ様、ユズ。\""
"2600906-31-ユズ" = "……先生の仰る通り、掃除をしてよかったです。"
"2600906-32-ユズ" = "綺麗になった部室を見ていると、なんだかやる気が湧いてきましたから。"
"2600906-33-ユズ" = "ですが、やっぱり部室でメイド服を着ているのは恥ずかしいです……。#n人が来る前に早く着替えないと――"
"2600906-34-ミレニアムの生徒" = "ユズ部長ー、ちょっといいー？"
"2600906-35-ミレニアムの生徒" = "この前借りたゲームのボスなんだけどさー、#n行動パターンが読みにくくて――"
"2600906-36-ユズ" = "あ……あうぅ……。"
"2600906-37-ミレニアムの生徒" = "………。"
"2600906-38-ユズ" = "ええと……今回も、その……。"
"2600906-39-ミレニアムの生徒" = "……やっぱりそういうことだったんだ。#nごめん、また邪魔しちゃったね……。"
"2600906-40-ユズ" = "ま、待っ……だから誤解――！"
"2600906-41-ミレニアムの生徒" = "じゃ、また出直してくるね！"
"2600906-42-ユズ" = "う、うあああああ……！"
"2600906-43" = "（その後、ロッカーに引きこもったユズをなだめるのに苦労した）"
