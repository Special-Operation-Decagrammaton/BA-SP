[translation]
"1301006-1" = "寝坊"
"1301006-2" = "ミレニアム・セミナー"
"1301006-3-ユウカ" = "先生といい、みんなもそうだけど、どうしてこんなに遅刻するのかしら……。"
"1301006-4-ユウカ" = "規則正しく寝て起きてさえいれば、遅刻なんてしないでしょうに。どうしてこんな簡単なことができないの……。"
"1301006-5-ユウカ" = "ミレニアムの全生徒がしっかり校則を守って生活してくれれば、私の仕事ももっと減るのに……。"
"1301006-6-ユウカ" = "んんっ……あら、もうこんな時間。"
"1301006-7-ユウカ" = "これ以上起きてると、明日に響くわね……シャーレの会議もあることだし。"
"1301006-8-ユウカ" = "早く仕事を、終わらせない、と……。"
"1301006-9-ユウカ" = "……？あれ、いつの間に朝に……。"
"1301006-10-ユウカ" = "ああ、あのまま生徒会の仕事をしながら……やっちゃったわね……。"
"1301006-11-ユウカ" = "それよりも今何時……。"
"1301006-12-ユウカ" = "午前11時！？ち、遅刻じゃない！"
"1301006-13-ユウカ" = "急いで髪のセットをして……！いや、その前に会議の資料を……！"
"1301006-14" = "シャーレ・執務室"
"1301006-15-ユウカ" = "お、遅くなりました！"
"1301006-16" = "[s] \"おはよう、ユウカ。\""
"1301006-17-ユウカ" = "す、すみません。昨日遅くまで仕事をしてて、そのまま寝てしまって……。"
"1301006-18-ユウカ" = "………。"
"1301006-19-ユウカ" = "えっと、先生。今日は遅刻しませんでしたか？"
"1301006-20" = "[s] \"うん、昨日絶対に遅刻しないでって言われたから。\""
"1301006-21-ユウカ" = "……ごめんなさい！"
"1301006-22-ユウカ" = "先生にあれだけ言っておきながら、自分が遅刻するなんて……弁解の余地もありません。"
"1301006-23-ユウカ" = "こうなった以上、罰は甘んじて受けます。"
"1301006-24-ユウカ" = "さあ、何でも構いません。私に命令してください！"
"1301006-25" = "[s] \"別に良いのに……。\""
"1301006-26-ユウカ" = "いいえ、罰則も規則です！自分で言っておきながら自分だけは例外なんて、セミナーの会計として面子が立ちません！"
"1301006-27-ユウカ" = "ですので、どうぞ！"
"1301006-28" = "[s] \"じゃあ、居住区で昼寝してきてくれる？\""
"1301006-29-ユウカ" = "……え？それは、罰ではないのでは……？"
"1301006-30-ユウカ" = "きちんとしたものでないと、罰になりません。"
"1301006-31" = "[s] \"いつも頑張り屋さんのユウカに必要な罰はこれだよ。\""
"1301006-32-ユウカ" = "でも……。"
"1301006-33" = "[s] \"どんな命令でも良いんでしょ？\""
"1301006-34-ユウカ" = "はぁ……本当に、先生らしいと言いますか……。"
"1301006-35-ユウカ" = "分かりました。ではご命令通り、少し休んでくることにします。"
"1301006-36-ユウカ" = "ですが、「遅刻をしても大丈夫」とは思ってませんから！今後も先生の遅刻については、私が厳しく見張ります！"
"1301006-37-ユウカ" = "もちろん、私も遅刻しないようにしますから！"
"1301006-38" = "その後、ユウカが眠っている間、セミナーの溜まった仕事を片付けておいた。"
