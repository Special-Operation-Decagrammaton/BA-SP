[translation]
"1301020-1" = "暗算の女王"
"1301020-2" = "（シャーレの仕事もあったので、ミレニアムへと立ち寄った）"
"1301020-3-ユウカ" = "分解していけば、全ては単純な計算で成り立っているのに……。"
"1301020-4-ユウカ" = "どうしてこう、ちょくちょく計算が合わないんでしょうね？"
"1301020-5" = "[s] \"まあ、人のやることだから……。\""
"1301020-6-ユウカ" = "悲しいですが、そうかもしれませんね。"
"1301020-7-ユウカ" = "えっと、バランスシートが確か……。"
"1301020-8" = "[s] \"ユウカの電卓、よく見ると何かすごいね。\""
"1301020-9-ユウカ" = "ああ、これですか？SI-LABモデルです。"
"1301020-10-ユウカ" = "3次元グラフ、仮想シミュレーション、表計算からプログラミングまで……。"
"1301020-11-ユウカ" = "ちょっと手を入れれば、写真や動画鑑賞もできるようになります。"
"1301020-12-ユウカ" = "人によっては、ゲームのシミュレーターとしても使ってるみたいですし。"
"1301020-13-ユウカ" = "それで、まあ便利なのは良いことなのですが……#n最近どうも自分自身これに頼りきりなのが心配です。"
"1301020-14" = "[s] \"会計のために電卓を頼るのは、普通のことのような……？\""
"1301020-15-ユウカ" = "それはそうなんですが……。"
"1301020-16-ユウカ" = "たとえば、暗算で済むようなことでも、つい電卓を使ってしまったり……。"
"1301020-17-ユウカ" = "ガロンからリットルへの換算くらい、本来なら全然脳内で可能な範囲なのですが。"
"1301020-18" = "[s] \"頭脳を外部化していくのは文明発展の一つの方向性だし、良いんじゃない？\""
"1301020-19-ユウカ" = "……先生、体調は大丈夫ですか？"
"1301020-20-ユウカ" = "私の知っている先生とは思えないほど、知性的な発言でしたが……。"
"1301020-21" = "[s] \"それはちょっと失礼では！？\""
"1301020-22-ユウカ" = "まあ、とにかく。先生が仰ることは分かります。"
"1301020-23-ユウカ" = "とはいえ、本来の頭の方を使っていかないと衰退する一方ですし……。"
"1301020-24-ユウカ" = "銃器と同じことです。きちんと手入れをしないと、どんどん劣化してしまいます。"
"1301020-25-ユウカ" = "そうですね、せっかくの機会ですし……。"
"1301020-26-ユウカ" = "先生も一緒に、暗算の特訓でもしてみませんか？"
"1301020-27-ユウカ" = "ちょっと、逃げちゃダメですよ。"
"1301020-28-ユウカ" = "さあ、楽しい算数のお時間ですよ？"
"1301020-29-ユウカ" = "さて、準備は良いですか？"
"1301020-30" = "[s1] \"ふふっ、ユウカには多分言ったことなかったけど……。\"\n[s2] \"実は私、暗算は結構速いんだよ！\""
"1301020-31-ユウカ" = "そ、そうだったんですか……？"
"1301020-32-ユウカ" = "そ、そうだったんですか……？"
"1301020-33-ユウカ" = "まあそれはそれで好都合です。さあ、始めましょうか？"
"1301020-34-ユウカ" = "まず……「13×17」は？"
"1301020-35" = "[s] \"231！\""
"1301020-36-ユウカ" = "即答……！？"
"1301020-37-ユウカ" = "で、では「187－23÷37」は！？"
"1301020-38" = "[s] \"「7.2737」以下循環小数！\""
"1301020-39-ユウカ" = "速い……っ！"
"1301020-40-ユウカ" = "こ、今度は難しいですよ！"
"1301020-41-ユウカ" = "「3x3行列1、19、37、23、101、3、7、41、31の逆行列」は！？"
"1301020-42" = "[s] \"「8、34、108、287、324、83、70、61、6」！\""
"1301020-43-ユウカ" = "そ、そんな……こんなに速いなんて……！？"
"1301020-44-ユウカ" = "……ん？ちょっと待ってください。"
"1301020-45-ユウカ" = "せ、先生！全部間違ってるじゃないですか！"
"1301020-46-ユウカ" = "全部てきとうに答えてたんですね！？"
"1301020-47" = "[s] \"「速い」としか言ってないからね！\""
"1301020-48-ユウカ" = "な、何て屁理屈……。"
"1301020-49-ユウカ" = "仕方ないですね……#nそんな先生のために、脳の特訓用プログラムを考えておいてあげます。"
"1301020-50" = "[s] \"嫌すぎる……。\""
"1301020-51-ユウカ" = "逃がしませんからね、一緒にやってもらいますよ！"
