[translation]
"2600705-1" = "焦っていた理由"
"2600705-2" = "（アヤネに頼まれた通り、工具箱とネジを持って外に出た）"
"2600705-3" = "（場所は、ヘリが墜落したところだったからなんとなく覚えていた）"
"2600705-4" = "（…………）"
"2600705-5" = "（作業をしているはずなのに、何も音がしない）"
"2600705-6" = "[ns] \"……アヤネ？\""
"2600705-7-アヤネ" = "…………う……。"
"2600705-8-アヤネ" = "……うう。"
"2600705-9" = "[ns] \"……アヤネ、大丈夫！？\""
"2600705-10-アヤネ" = "すみません、先生……お呼び立てしておいてこんな……。"
"2600705-11-アヤネ" = "少し考えたら当たり前のことなのですが……リゾート地とはいえ、炎天下でずっと作業していたら……。"
"2600705-12-アヤネ" = "ヘリも金属だから熱もすごいですし……もっと早くそれに気付けていれば……。"
"2600705-13-アヤネ" = "すみません……。"
"2600705-14" = "[s1] \"こっちこそ、気づくのが遅くなってごめん。\"\n[s2] \"体調管理、大切にしないとね。\""
"2600705-15-アヤネ" = "はい……。"
"2600705-16-アヤネ" = "はい……。"
"2600705-17-アヤネ" = "あれ、そういえば先生……"
"2600705-18-アヤネ" = "それは……。"
"2600705-19-アヤネ" = "私がお願いしたネジ……。"
"2600705-20-アヤネ" = "ありがとうございます、先生。もう大丈夫です。あと少しなので、残りも片付けちゃいますね。"
"2600705-21-アヤネ" = "……え？先生もご一緒に……？"
"2600705-22-アヤネ" = "ヘリの修理を……？"
"2600705-23-アヤネ" = "だ、大丈夫です！これくらい一人で……。"
"2600705-24-アヤネ" = "そ、それか、今日はここまでにしましょうか？残りは明日に回して……。"
"2600705-25-アヤネ" = "……え？"
"2600705-26-アヤネ" = "私の代わりに……？"
"2600705-27-アヤネ" = "部品を持ってきてくださっただけでなく……"
"2600705-28-アヤネ" = "どうして作業まで……。"
"2600705-29-アヤネ" = "……いえ、ありがとうございます先生。"
"2600705-30-アヤネ" = "それでは、よろしくお願いします！"
"2600705-31" = "（その後アヤネに指示をもらってヘリの修理を続けた）"
"2600705-32" = "（一日で終わる量ではなかったので、夜になっても終わらなかったものの、作業は確実に進んでいた）"
"2600705-33-アヤネ" = "よいしょっと……"
"2600705-34-アヤネ" = "結構進んだかな……。"
"2600705-35-アヤネ" = "今日はここまでにしましょうか、キリも良いですし。"
"2600705-36" = "[s3] \"うん、大丈夫そうかな。\"\n[s4] \"うん、だいぶ良くなったね。\""
"2600705-37-アヤネ" = "まだ完全な修理にはほど遠いんですけどね……あはは……。"
"2600705-38-アヤネ" = "まだ完全な修理にはほど遠いんですけどね……あはは……。"
"2600705-39-アヤネ" = "……えっ？……ヘリではなく、私の話……ですか？"
"2600705-40-アヤネ" = "それは、どういう……。"
"2600705-41" = "[s5] \"体調も大事だけど、無理に中断させるのも良くないかなって。\"\n[s6] \"途中で帰ったら、ずっと気にしちゃうかもなって思って。\""
"2600705-42-アヤネ" = "先生……気を遣ってくださったのですね……。"
"2600705-43-アヤネ" = "だから帰らずに、私の代わりにやると……。"
"2600705-44-アヤネ" = "とても嬉しいのですが……それと同時に、これでいいのかなって……。"
"2600705-45-アヤネ" = "先生に迷惑をかけないようにしようと、いつも思っているのに……。"
"2600705-46-アヤネ" = "……先生だから大丈夫、ですか……？"
"2600705-47-アヤネ" = "……あはは。"
"2600705-48-アヤネ" = "先生……それ、よく言ってませんか？"
"2600705-49-アヤネ" = "……でも、ありがとうございます。今日は安らかな気持ちで眠れそうです。"
"2600705-50-アヤネ" = "そしてまた明日も……。"
"2600705-51-アヤネ" = "えっ……？ヘリの横に……？は、はい。こうですか？"
"2600705-52-アヤネ" = "……記念撮影？"
"2600705-53-アヤネ" = "だ、大丈夫です！写真なんて、そんな……！"
"2600705-54" = "[s7] \"頑張った記念に。\"\n[s8] \"せっかくだしね。\""
"2600705-55-アヤネ" = "そ、そうですか？……う～ん。"
"2600705-56-アヤネ" = "そ、そうですか？……う～ん。"
"2600705-57-アヤネ" = "ふふ……はい。"
"2600705-58-アヤネ" = "先生にそこまで言われたら、仕方ないですね。"
"2600705-59" = "[wa:4000]― えっと、[wa:1450]私はこの辺の、"
"2600705-60" = "― 端っこに写っていれば[wa:1350]良いでしょうか……？"
"2600705-61" = "― こんな感じで、[wa:1250]大丈夫ですかね……？"
"2600705-62" = "[wa:1000]― ど、[wa:650]どうすれば[wa:500]ヘリが際立つんでしょう……？"
"2600705-63" = "[wa:50]― すみません、"
"2600705-64" = "― こういうのは[wa:800]あまり慣れてなくって…"
"2600705-65" = "[wa:1200]― えっと……[wa:1550]先生？"
"2600705-66" = "― 修理の[wa:500]記念写真ということでしたら……"
"2600705-67" = "― もっと[wa:650]ヘリを中心に[wa:800]撮った方が良いのでは……？"
"2600705-68" = "[wa:200]― ……え、[wa:950]ヘリではなくて、[wa:1550]私の記念写真……？"
"2600705-69" = "[wa:50]― そ、[wa:650]そうだったんですか！？[wa:1450]えぇっ！？"
"2600705-70" = "[wa:950]― そ、[wa:500]それはその、[wa:1350]いえ、[wa:800]嫌ではないですが……！"
"2600705-71" = "― な、[wa:600]何だか急に、[wa:1400]顔が熱く……っ"
"2600705-72-アヤネ" = "写真一枚撮るのに、すごく時間かかっちゃいましたね……。"
"2600705-73-アヤネ" = "ありがとうございます先生。今日は色々と運がいい日みたいです。"
"2600705-74-アヤネ" = "……代わりにというのも何ですが、その分、このヘリを先生のためにもたくさん飛ばしますね！"
"2600705-75-アヤネ" = "御用の際はいつでも呼んでください！すぐに飛んでいきますので！"
"2600705-76" = "[s9] \"ヘリってそんなに頻繁に飛ばせるの？\"\n[s10] \"いいの？それなりに燃料もかかっちゃうと思うけど……。\""
"2600705-77-アヤネ" = "……あ。"
"2600705-78-アヤネ" = "……言われてみれば。"
"2600705-79-アヤネ" = "あ……あはは。"
"2600705-80-アヤネ" = "……えっと。"
"2600705-81-アヤネ" = "あ、あまり頻繁には、ダメです……。"
