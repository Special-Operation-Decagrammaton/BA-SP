[translation]
"2600703-1" = "布団の中のアヤネ"
"2600703-2" = "（心配になったので、アヤネの部屋を訪れた）"
"2600703-3" = "（返事がない）"
"2600703-4" = "う～ん……セリカちゃん……？"
"2600703-5" = "先輩たちに言われたの……？"
"2600703-6" = "……ごめん……あと5分だけ……。"
"2600703-7" = "（………）"
"2600703-8" = "……5分だけって……いったでしょ～。"
"2600703-9" = "セリカちゃんが起こしてもダメだよ。今日はそう決めたんだから。"
"2600703-10" = "セリカちゃん……今日はちょっとしつこいよ。"
"2600703-11" = "今日は絶対に外に出ないから……セリカちゃんが諦めて……。"
"2600703-12" = "[ns] \"……。\""
"2600703-13" = "[ns] ドアを開けて入る。"
"2600703-14" = "（ドアを開けて入ると、ベッドの上の「何か」が目に入った）"
"2600703-15" = "[ns] \"…………。\""
"2600703-16" = "セリカちゃん……？"
"2600703-17" = "たとえセリカちゃんでも……私からこの布団をはがすことはできない……。"
"2600703-18" = "私はこの中で睡眠を満喫するの……。"
"2600703-19" = "……ここは私だけの秘密基地。"
"2600703-20" = "[s] \"…………。\""
"2600703-21" = "[ns] 布団ごと揺らしてみる。"
"2600703-22" = "むむ……いつもより優しいけど、少し重い手つき……。"
"2600703-23" = "でも、この程度で基地は崩れません……私はもっと寝るんだから……！"
"2600703-24" = "[s] 布団をさらに揺らしてみる。"
"2600703-25" = "セリカちゃん……。"
"2600703-26" = "もう今日は諦めたら……。"
"2600703-27" = "いくら私でも……我慢の限界っていうのがあって……。"
"2600703-28" = "[s] 構わず布団を揺らしてみる。"
"2600703-29" = "……。"
"2600703-30" = "せ……りか……ちゃん……！！"
"2600703-31" = "もう……っ！"
"2600703-32" = "まったく、ちょっとは人の言うことを……！！"
"2600703-33" = "……聞いた……ほう……。"
"2600703-34" = "……が…………？"
"2600703-35" = "[s1] \"……おはよう、アヤネ。\"\n[s2] \"ごめんね、セリカじゃなくて。\""
"2600703-36" = "あれ……？"
"2600703-37" = "あれ……？"
"2600703-38" = "えっ……。"
"2600703-39" = "こ、こんにちは、先生……えっと……どうしてここに……。"
"2600703-40" = "えっ……モモトーク？"
"2600703-41" = "……あっ。"
"2600703-42" = "これは……寝ぼけて送っちゃったみたいですね……。"
"2600703-43-アヤネ" = "その……先生……。"
"2600703-44-アヤネ" = "これは、あの……えっと……。"
"2600703-45" = "[s3] \"……そろそろ行こうか。みんな待ってるよ。\"\n[s4] \"もうご飯できたから食べに行こう。\""
"2600703-46-アヤネ" = "……はい。"
