[translation]
"2300006-1" = "ちょっとしたデート"
"2300006-2" = "シャーレ・執務室"
"2300006-3" = "（後回しにし続けていた書類が山のように重なり、まるで何かの生き物かのように鎮座していた）"
"2300006-4" = "（どうやら、そろそろ本格的に取り組まないとマズそうだ……）"
"2300006-5" = "ポーン♪"
"2300006-6" = "[ns] \"モモトークかな？\""
"2300006-7" = "[ns] \"でも今は仕事をしないと……。\""
"2300006-8" = "（その後も何度かスマホに通知が来たが、脇目も振らずに仕事に集中した）"
"2300006-9" = "（次の日）"
"2300006-10" = "（徹夜をしてさらにお昼が過ぎた頃、ようやく積まれていた書類が全て片付いた）"
"2300006-11" = "（寝ようかとも思ったが、コーヒーを大量に飲んだせいか眠気が来ない）"
"2300006-12" = "（悩んだ末に、ちょっと外に出てみることにした）"
"2300006-13" = "（シャーレ付近のひと気のない散歩道で、見慣れた顔が目に入る）"
"2300006-14" = "[s] \"……アイリ？\""
"2300006-15-アイリ" = "あっ、先生！？"
"2300006-16-アイリ" = "わっ！お久しぶりです！"
"2300006-17-アイリ" = "これからどこかへ行かれるんですか？"
"2300006-18-アイリ" = "あ、お散歩でしたか。"
"2300006-19-アイリ" = "ということは、お仕事は終わったのでしょうか？"
"2300006-20-アイリ" = "それは良かったです……！それに、本当に会いたかったです、先生！"
"2300006-21" = "[s1] \"アイリは元気だった？\"\n[s2] \"心配させちゃってごめんね。\""
"2300006-22-アイリ" = "もちろんです。"
"2300006-23-アイリ" = "いつも通り、楽しく過ごしてました。"
"2300006-24-アイリ" = "あ、いえ、そんな……！"
"2300006-25-アイリ" = "でも、本当に良かったです。えへへ……。"
"2300006-26-アイリ" = "先生はいかがですか、体調を崩してないですか？"
"2300006-27-アイリ" = "私の方もつい最近まで、試験勉強でずっとお家にいまして。久々に外に出かけることが出来ました。"
"2300006-28-アイリ" = "え、私がここで何をしていたのか……ですか？"
"2300006-29-アイリ" = "えっと、特に何か用事があったわけではなくって。"
"2300006-30-アイリ" = "試験も終わったので、久しぶりにお散歩でもしようかなって。"
"2300006-31-アイリ" = "……。"
"2300006-32-アイリ" = "お会いできると分かってたら……。"
"2300006-33-アイリ" = "……え？"
"2300006-34-アイリ" = "あ、いえ、ただ今日は会えると思ってなかったので、"
"2300006-35-アイリ" = "何もお菓子とかスイーツとか持ってないなって思いまして。"
"2300006-36-アイリ" = "この周辺にはカフェとかも無いですし……。"
"2300006-37" = "（大丈夫だよとは伝えたものの、アイリはしゅんとした様子のままだった）"
"2300006-38" = "[s] \"あ、あれって……アイスクリームの移動販売？\""
"2300006-39-アイリ" = "え？あ、あのトラックですか？"
"2300006-40-アイリ" = "わあ、本当だ！久しぶりに見ました……！"
"2300006-41-アイリ" = "子供の時はよく食べてましたね。"
"2300006-42-アイリ" = "……先生？"
"2300006-43-アイリ" = "え、えっ……？"
"2300006-44" = "（アイリの手を取って、トラックの方へと向かう）"
"2300006-45-アイスクリームおじさん" = "はいどうぞ、ご注文のアイスクリームです。"
"2300006-46" = "（アイリとアイスクリームを受け取って、川沿いの道で少し休むことにした）"
"2300006-47" = "[wa:1000]― 私の分も買っていただいて[wa:2500]ありがとうございます、[wa:1300]先生。[wa:2500] "
"2300006-48" = "― あ、[wa:700]甘くて美味しいです！"
"2300006-49" = "[wa:1500]― カフェではなく、[wa:1000]外で食べるアイスクリームって[wa:2300]すごく[wa:700]久しぶりな気がします。[wa:3000] "
"2300006-50" = "― それに、[wa:1500]先生と一緒ですし。 [wa:3000]えへへっ。"
"2300006-51" = "[ns3] \"ちゃんとしたスイーツとかじゃなくてごめんね。\"\n[ns4] \"そういうお店のは、また今度で。\""
"2300006-52" = "[wa:500]― い、[wa:500]いえ、[wa:500]全然[wa:1000]そんなことは。[wa:2500] "
"2300006-53" = "[wa:500]― むしろ[wa:600]懐かしくて、[wa:900]嬉しいです。"
"2300006-54" = "[wa:1500]― 嬉しいですし、[wa:2500]その……。[wa:3500] "
"2300006-55" = "― 何と言えばいいんでしょう、[wa:2500]周りに人も少ないですし……。[wa:3500] "
"2300006-56" = "― すごく、[wa:2000]ドキドキすると[wa:1000]言いますか……。[wa:3500] "
"2300006-57" = "[wa:500]― ……な、[wa:500]なっ、[wa:800]なんでもありません！[wa:2700] "
"2300006-58" = "― 今のは[wa:1000]忘れてください！[wa:3000] "
"2300006-59" = "― はは、[wa:1000]あはは……。"
"2300006-60" = "[wa:3000]― ……ありがとうございます、[wa:1500]先生。[wa:1800] "
"2300006-61" = "― 今日も先生のおかげで、[wa:2200]もうすでに[wa:1500]幸せな一日になりました。"
"2300006-62" = "（その後、夕方になるまでアイリと一緒に川沿いの道で楽しくおしゃべりをした）"
