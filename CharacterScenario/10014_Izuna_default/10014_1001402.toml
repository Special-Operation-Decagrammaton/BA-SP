[translation]
"1001402-1" = "そしてイズナは尾行する"
"1001402-2" = "（買い物で、道を歩いてる時だった）"
"1001402-3-イズナ" = "ササッ――"
"1001402-4" = "[ns] \"……ん？\""
"1001402-5-イズナ" = "サササッ――"
"1001402-6" = "（ガッ）"
"1001402-7-イズナ" = "あっ！？"
"1001402-8-イズナ" = "ううっ、足がもつれました……。"
"1001402-9-イズナ" = "も、もう一度行きます！"
"1001402-10-イズナ" = "サササッ――"
"1001402-11" = "[ns] \"えっと……。\""
"1001402-12-イズナ" = "ササッ……。"
"1001402-13-あくびをしている猫" = "ニャー？"
"1001402-14-イズナ" = "しっ、しーっ！猫殿！しーっですよ！"
"1001402-15-イズナ" = "鳴いたらバレてしまいます……！"
"1001402-16-イズナ" = "あっ、もしかして猫だから言葉が通じないのでしょうか？"
"1001402-17-イズナ" = "であれば、古来より忍者が動物と会話をする時に使う動物語を……！"
"1001402-18-イズナ" = "にゃ、にゃおー？"
"1001402-19-あくびをしている猫" = "……ニャ？"
"1001402-20-イズナ" = "通じない！？"
"1001402-21-イズナ" = "ええいっ！では仕方ありません、"
"1001402-22-イズナ" = "緊急回避の術！"
"1001402-23-イズナ" = "ふう……これならバレずに移動できたはずです。"
"1001402-24" = "[s] \"……。\""
"1001402-25" = "[s1] スマホを取り出して、\n[s2] イズナに電話を掛けた。"
"1001402-26" = "（ピロン♪ピロン♪）"
"1001402-27" = "（ピロン♪ピロン♪）"
"1001402-28-イズナ" = "うわっ、あっ！スマホが！"
"1001402-29-イズナ" = "ど、どうやって止めるんでしょう、あれっ！？"
"1001402-30-イズナ" = "これを、こうやってっ、これで……！？"
"1001402-31" = "（プッ）"
"1001402-32-イズナ" = "ふぅ、無事に乗り切りました。"
"1001402-33" = "[s3] \"何を乗り切ったの？\"\n[s4] \"結構前からバレてたよ……。\""
"1001402-34-イズナ" = "あ、主殿！？"
"1001402-35-イズナ" = "あ、主殿！？"
"1001402-36-イズナ" = "なぜ……！どうして気づくことができたのですか！？"
"1001402-37" = "[s] \"どうしてって、だいぶバタバタしてたし……。\""
"1001402-38-イズナ" = "イズナの熟練の尾行術が通じないだなんて、"
"1001402-39-イズナ" = "まさか……。"
"1001402-40" = "[s] \"……まさか？\""
"1001402-41-イズナ" = "主殿も……"
"1001402-42-イズナ" = "忍者の子孫なのですか？（ゴクリ）"
"1001402-43" = "[s5] \"然り。某は伝説の忍者、服部ハム次郎の末裔でごじゃる！\"\n[s6] \"……って、そんなわけないでしょ。\""
"1001402-44-イズナ" = "ち、違いましたか……。"
"1001402-45-イズナ" = "ち、違いましたか……。"
"1001402-46-イズナ" = "残念です……。"
"1001402-47" = "[s] \"残念なんだ……。\""
"1001402-48-イズナ" = "代わりというわけではありませんが、イズナは完璧な忍者ですので！"
"1001402-49-イズナ" = "同じ忍者でなくても大丈夫です、主殿は主殿のままでいていただければ！"
"1001402-50" = "[s] \"立ち直り早いね……。\""
"1001402-51" = "[ns7] \"そもそも尾行なら、もっと静かにしたほうが良いよ。\"\n[ns8] \"足音にも気を付けて、他人の視線を意識して。\"\n[ns9] \"あと何よりも携帯はマナーモードに。\""
"1001402-52-イズナ" = "おおっ、なるほど！勉強になります！"
"1001402-53-イズナ" = "おおっ、なるほど！勉強になります！"
"1001402-54-イズナ" = "おおっ、なるほど！勉強になります！"
"1001402-55-イズナ" = "主殿のお言葉はすべて金科玉条です！"
"1001402-56-イズナ" = "メモしておかないと！"
"1001402-57-イズナ" = "あれ、イズナの手帳はどこに……？"
"1001402-58" = "[s] \"ところで、なんで尾行してたの？\""
"1001402-59-イズナ" = "あっ、それはですね、"
"1001402-60-イズナ" = "忍者として、主殿を護衛するためです！"
"1001402-61" = "[s] \"護衛……？\""
"1001402-62-イズナ" = "先日、イズナがとあることで悩んでいるとお伝えしましたが、"
"1001402-63-イズナ" = "あれは……"
"1001402-64-イズナ" = "実は主殿についての悩みだったのです！"
"1001402-65" = "[s] \"えっと……？\""
"1001402-66-イズナ" = "ある時、イズナはふと思いました。"
"1001402-67-イズナ" = "主殿はすごい方です、であれば……。"
"1001402-68-イズナ" = "いつどこで主殿が狙われてしまってもおかしくはない、と！"
"1001402-69" = "[s] \"いやいやいや。\""
"1001402-70-イズナ" = "いいえ、"
"1001402-71-イズナ" = "油断は禁物です！"
"1001402-72-イズナ" = "時代劇でもよくありますよ！"
"1001402-73-イズナ" = "いつも城の主君が油断して、飲めや歌えやと宴を開いた時……"
"1001402-74-イズナ" = "そこに敵襲が！"
"1001402-75-イズナ" = "お決まりの展開です！"
"1001402-76" = "[s10] \"お決まりなんだ……？\"\n[s11] \"いや、宴とか開いたことないけど。\""
"1001402-77-イズナ" = "時代劇のお約束ですから！"
"1001402-78-イズナ" = "時代劇のお約束ですから！"
"1001402-79" = "[s] \"そっか……。\""
"1001402-80-イズナ" = "ですので、主殿に安心して仕事をしてもらえるように、"
"1001402-81-イズナ" = "そのためにイズナができることは何なのか……"
"1001402-82-イズナ" = "悩みに悩んだ結果、たどり着いた結論！"
"1001402-83-イズナ" = "それは朝から晩まで、主殿の一挙手一投足を監視しつつ護衛する、ということでした！"
"1001402-84" = "[s] \"それで尾行してたんだ……。\""
"1001402-85-イズナ" = "えへへっ！"
"1001402-86-イズナ" = "はい！"
"1001402-87-イズナ" = "こっそり護衛してました！"
"1001402-88" = "[s] \"でも、それはちょっと困るかも。\""
"1001402-89-イズナ" = "困る……私、主殿を困らせてしまったのですか？"
"1001402-90" = "[s] \"同意無しで尾行するのって、良くないことだと思わない？\""
"1001402-91-イズナ" = "え、あ、はい……"
"1001402-92-イズナ" = "で、ですが！イズナは主殿のために影で……！"
"1001402-93" = "[s] \"もしかしたらその人の迷惑になるかもしれないよね？\""
"1001402-94-イズナ" = "う、うう、それは……。"
"1001402-95" = "[s] \"人それぞれ、知られたくないこともあると思わない？\""
"1001402-96-イズナ" = "う、うう……"
"1001402-97-イズナ" = "確かに、そうですね……ごめんなさい、主殿……。"
"1001402-98" = "[s] \"怒ってないよ、でもこれからは先に聞こうね。\""
"1001402-99" = "（グゥ……）"
"1001402-100-イズナ" = "はい……あぅ……"
"1001402-101-イズナ" = "朝から何も食べなかったせいで、力が……。"
"1001402-102" = "[s] \"じゃあ一緒にご飯食べに行く？\""
"1001402-103-イズナ" = "ご、ごはんですか？"
"1001402-104" = "[s12] \"イズナが良ければ。\"\n[s13] \"もちろん、無理にとは言わないけど。\""
"1001402-105-イズナ" = "いえ、ぜひ！行きましょう！主殿！"
"1001402-106-イズナ" = "もちろんごはんを食べに行くまでの道はこの私、イズナに任せてください！"
"1001402-107-イズナ" = "後ろでこっそり尾行をするのではなく、"
"1001402-108-イズナ" = "忍者として、主殿の目の前で！完璧な護衛をして見せますので！"
"1001402-109" = "[s] \"よろしくね。\""
"1001402-110-イズナ" = "えへへっ、はい！"
"1001402-111-イズナ" = "ニンニン！"
"1001402-112" = "（そうやってイズナにやけに目立つ派手な護衛をしてもらいながら、二人で食堂に向かった）"
