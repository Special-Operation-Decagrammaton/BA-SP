[translation]
"1001406-1" = "一緒にいられるこの今を"
"1001406-2" = "[ns1] \"ところで、忍者の道の追求って、\"\n[ns2] \"具体的には何をするの？\""
"1001406-3-イズナ" = "まずはあらためて、忍者とは何か……。"
"1001406-4-イズナ" = "その根本的な部分を追求してみようと思います！"
"1001406-5-イズナ" = "時代劇も、もちろん立派な資料ですが……。"
"1001406-6-イズナ" = "映像だけでは分からないものがきっとあるのではないかと、イズナは思います！"
"1001406-7" = "[s3] \"確かにそうかも。\"\n[s4] \"資料は多ければ多いほどいいよね。\""
"1001406-8-イズナ" = "はい！そこで、どこに行けば忍者について知ることができるのか……"
"1001406-9-イズナ" = "はい！そこで、どこに行けば忍者について知ることができるのか……"
"1001406-10-イズナ" = "徹底的な事前調査の末に、そのリストを作ってきました！"
"1001406-11-イズナ" = "この通りに巡りますので、お付き合いいただければと！"
"1001406-12" = "[s] \"うん、じゃあそれに従って行ってみよっか。\""
"1001406-13-イズナ" = "はい！では行きましょう！"
"1001406-14" = "[ns5] \"ここ……カフェ？\"\n[ns6] \"ここで忍者のことが分かるの？\""
"1001406-15-イズナ" = "そうです！こちらを見てください、これです。"
"1001406-16-イズナ" = "そうです！こちらを見てください、これです。"
"1001406-17" = "（イズナが見せてくれたメニューにはこう書いてあった）"
"1001406-18" = "（柴犬ワン蔵の時代劇シリーズコラボイベント『忍者スイーツ祭り77種』）"
"1001406-19" = "[s] \"コラボ……？\""
"1001406-20-イズナ" = "はい、コラボです！それも柴犬ワン蔵監督の代表作の……！"
"1001406-21-イズナ" = "主殿！主殿はどれにしますか？"
"1001406-22-イズナ" = "イズナのおすすめはこの「彷徨うパフェ」ですね。"
"1001406-23-イズナ" = "あっ、でもこちらの「孤独なクレープ」や「手裏剣クッキー」も良さそうです！"
"1001406-24-イズナ" = "えっ！主殿っ、ここでメニューを4つ以上頼むと、映画の名場面がプリントされた色紙もくれるそうです！"
"1001406-25" = "[s] \"そ、そっか……。\""
"1001406-26-イズナ" = "早く頼みましょう！主殿！"
"1001406-27" = "（イズナと一緒にメニューを4つ頼んで、コラボの特典色紙をもらった……）"
"1001406-28" = "[ns] \"デザートの次は、ラーメン屋！？\""
"1001406-29-イズナ" = "あれっ、イズナ、言っていませんでしたっけ？"
"1001406-30-イズナ" = "ここでも、コラボ商品として忍者ラーメンを売っているんです！"
"1001406-31" = "[s] \"忍者ラーメン！？\""
"1001406-32-イズナ" = "主殿！一緒に調べてみましょう！"
"1001406-33-イズナ" = "あっ、冊子がありますね。どれどれ……。"
"1001406-34-イズナ" = "忍者が普段食べるラーメンは豚骨がベースになっており、"
"1001406-35-イズナ" = "細麺、ニンニク多め、チャーシュートッピングで食べるのが常である、とのことです！"
"1001406-36-イズナ" = "イズナも同じメニューに挑戦します！"
"1001406-37" = "[s] \"う、うん……？\""
"1001406-38-イズナ" = "ズルズルっ！"
"1001406-39" = "（その後もイズナにあちこちに連れられて、忍者コンテンツを体験していった）"
"1001406-40" = "（忍者たこ焼き、忍者ラムネ、忍者フリースローなどなど……）"
"1001406-41-イズナ" = "ん～！今日は主殿と、忍者についてたくさん学ぶことができました！"
"1001406-42" = "[s] \"これ、忍者についての追求っていうか……。\""
"1001406-43-イズナ" = "あっ、主殿！あそこを見てください！"
"1001406-44-イズナ" = "忍者を体験できるボートがあるそうです！"
"1001406-45" = "[s] \"水蜘蛛のこと？……って、あれはただのボートでは……？\""
"1001406-46" = "（イズナは、ボート乗り場の横に立てられた説明文を真剣に読んでいる）"
"1001406-47-イズナ" = "ふむふむ……。"
"1001406-48-イズナ" = "なるほど……忍者たちは身体を鍛えるために、ボートを漕いで……。"
"1001406-49-イズナ" = "主殿ーっ！"
"1001406-50" = "[s7] \"はいはい。\"\n[s8] \"一緒に乗るんでしょ？\""
"1001406-51-イズナ" = "なっ、読心術……！？心を読むだなんて……！"
"1001406-52-イズナ" = "なっ、読心術……！？心を読むだなんて……！"
"1001406-53-イズナ" = "主殿は、超能力忍者だったのですか……？"
"1001406-54" = "[s] \"それは忍者なの？超能力者なの？\""
"1001406-55-イズナ" = "冗談です、えへへっ！さっ、主殿！"
"1001406-56-イズナ" = "二人で乗りましょう！"
"1001406-57" = "― あっ、[wa:1000]主殿、[wa:500]主殿！[wa:1000]今の見ましたか！？"
"1001406-58" = "[wa:500]― 鯉が[wa:500]水面で[wa:500]跳ねていましたよ！"
"1001406-59" = "[ns] \"落ち着いて、船が揺れると危ないよ？\""
"1001406-60" = "― あ、[wa:500]そうですね。[wa:1000]落ち着いて、[wa:500]イズナ……[wa:1200]精神を[wa:800]落ち着けて……。"
"1001406-61" = "― ……えへっ、[wa:1000]えへへへっ。"
"1001406-62" = "[ns] \"イズナ、すごく楽しそうだね。\""
"1001406-63" = "[wa:500]― はい！[wa:500]楽しいです、[wa:1500]こんなにも楽しいのはやはり……"
"1001406-64" = "― 大好きな主殿と、[wa:1500]一緒だから、[wa:1500]でしょうか？"
"1001406-65" = "[wa:800]― 今日のこの日は、[wa:1200]イズナにとって[wa:800]きっと[wa:700]一生の思い出になります。"
"1001406-66" = "[ns9] \"思い出になるのはきっと、今日だけじゃないよ。\"\n[ns10] \"これから先もずっと、いくらでも付き合うから。\""
"1001406-67" = "[wa:500]― ……っ！[wa:1500]はい、[wa:500]主殿！[wa:1000]不束者ではありますが……！"
"1001406-68" = "― これからもイズナを、[wa:1000]よろしくお願いいたします！[wa:1500]えへへっ！[wa:500] "
"1001406-69" = "（しばらくボートを漕ぎながら、イズナと一緒に静かで楽しい時間を過ごした）"
