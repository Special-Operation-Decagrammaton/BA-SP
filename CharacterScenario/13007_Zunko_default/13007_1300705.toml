[translation]
"1300705-1" = "貧困な美食会"
"1300705-2" = "シャーレ・執務室"
"1300705-3-ジュンコ" = "ただいま……。"
"1300705-4-ジュンコ" = "うう、最悪。#n最高級の和牛をビュッフェ形式で食べられるお店があるからって楽しみにしてたのにぃ……。"
"1300705-5-ジュンコ" = "まさか今日は定休日だったなんて！想定外！"
"1300705-6-ジュンコ" = "和牛の焼肉がたくさん食べられると思って、お昼を控えめにしてたのに。#nうう、お腹空いた……。"
"1300705-7-ジュンコ" = "先生、何か食べ物ない？お腹空いた～。"
"1300705-8" = "[s] \"今持ってる食べ物は……。\""
"1300705-9-ジュンコ" = "ん？何これ？「ミッシン」のミートラーメン？"
"1300705-10-ジュンコ" = "あ、食べたことはないけど知ってる。#n器に入れて熱いお湯を注いで食べるインスタントラーメンでしょ？"
"1300705-11-ジュンコ" = "いくらお腹が空いてるからって、美食家の私にこんな安物のインスタントラーメン……。"
"1300705-12" = "[s] \"無理に食べなくても大丈夫だよ。\""
"1300705-13-ジュンコ" = "た、食べないとは言ってないけど！？返して！"
"1300705-14-ジュンコ" = "えーっと……コップに麺を入れてお湯を注いで3分ね……。"
"1300705-15-ジュンコ" = "スープの素もかやくもないこんな安いラーメンが美味しいはずが……。"
"1300705-16-ジュンコ" = "（え、美味しいっ！？）"
"1300705-17-ジュンコ" = "（調理された油で揚げた麺特有のプリっとした食感が、こんなに素敵な……）"
"1300705-18-ジュンコ" = "（それに麺から染み出る旨味たっぷりのスープまで……想像以上！）"
"1300705-19" = "[s] \"味はどう？大丈夫？\""
"1300705-20-ジュンコ" = "ま、まあまあ食べれるくらいね！#n美食家の私の基準には遠く及ばないけど！あは、あはは！"
"1300705-21-ジュンコ" = "それよりちょっと量が少ないんだけど……もう一個あったりする？"
"1300705-22-ジュンコ" = "か、勘違いしないで！美味しくてもっと食べたいとか、そういうのじゃないから！"
"1300705-23-ジュンコ" = "ただお腹が空きすぎて仕方なかっただけだから！誤解しないでよね！"
"1300705-24" = "それから、ジュンコは二つ目のミートラーメンをキレイに完食し、結局計三つ食べた。"
