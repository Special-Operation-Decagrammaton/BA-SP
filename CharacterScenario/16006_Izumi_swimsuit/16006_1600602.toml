[translation]
"1600602-1" = "イズミと夏を楽しむ幾つかの方法"
"1600602-2" = "（イズミから教えてもらって辿り着いた海の家は、すでにたくさんの人でごった返していた）"
"1600602-3-イズミ" = "あっ、先生～！"
"1600602-4-イズミ" = "もうっ、遅いよ！"
"1600602-5-イズミ" = "こうしてる間に、「噂の珍味」が食材切れとかで食べられなくなっちゃったらどうするの！？"
"1600602-6" = "[s1] \"ご、ごめんイズミ……。\"\n[s2] \"それにしても、すごい人の数だね……。\""
"1600602-7-イズミ" = "ね！みんなやっぱり、賞品って聞いて集まってきたのかな！"
"1600602-8-イズミ" = "ね！みんなやっぱり、賞品って聞いて集まってきたのかな！"
"1600602-9-イズミ" = "あっ、ちなみにこれがお店のチラシ！"
"1600602-10" = "[s] \"……「棒倒し」でゲーム対決？\""
"1600602-11-イズミ" = "そうそう！「山崩し」って呼んだりもするのかな？砂山に刺さった棒を倒さないように、順番に砂を取っていくあのゲーム！"
"1600602-12-イズミ" = "これで勝てたら、この海の家の名物「特製ロコモコ丼」とかをタダで食べられるんだって！"
"1600602-13-イズミ" = "一体どんな味なのかな～……じゅるり。"
"1600602-14" = "[s] \"イズミ、よだれよだれ。\""
"1600602-15-イズミ" = "はっ！……ふふっ、すっごく楽しみにしてたんだー、ここのチャバ……いや、ロコモコ丼！"
"1600602-16" = "[ns] \"……？\""
"1600602-17-司会" = "ゲーム、終了ーーーーっ！！！"
"1600602-18-イズミ" = "あ、ちょうどゲームが終わったみたい！"
"1600602-19-司会" = "勝者は……"
"1600602-20-司会" = "このお店の店主さんです！"
"1600602-21-「海の家」の店主" = "……ふっ。"
"1600602-22-チンピラB" = "だからそんなに、一気に欲張らない方が良いって言ったじゃん！"
"1600602-23-チンピラA" = "だ、だってさぁ……。"
"1600602-24-司会" = "ちなみにこちらの方、ただの店主ではありません……！"
"1600602-25-司会" = "「キヴォトス棒倒し選手権」において、15年連続で優勝しているという相当の実力者なんです！"
"1600602-26-チンピラたち" = "はぁ！？"
"1600602-27-司会" = "さあ、惜しくも負けてしまった方々には罰ゲームとして……！"
"1600602-28-司会" = "こちらの、ある意味有名な裏看板メニュー……"
"1600602-29-司会" = "チャバスコの辛さとココナッツの甘さの化学反応、ココナッツの実に入った「チャバスコジュース」を一気飲みしていただきます！"
"1600602-30-チンピラB" = "くっ……ええいっ、やってやろうじゃんか！"
"1600602-31-チンピラA" = "ぶふぉっ！？"
"1600602-32-チンピラB" = "ゴバッ！？"
"1600602-33-「海の家」の店主" = "それが人生のスパイスの味……ってやつさ。お嬢ちゃんたちにはちょっと早かったかな。"
"1600602-34-司会" = "では次のチャレンジャーの方、どうぞ！"
"1600602-35-イズミ" = "あ、私たちの番だよ！行こう！"
"1600602-36" = "[s3] \"ちょっと待って、これ負けたらさっきのやつ飲むの？\"\n[s4] \"罰ゲームなんて聞いてな――\""
"1600602-37-イズミ" = "大丈夫大丈夫っ！"
"1600602-38-イズミ" = "大丈夫大丈夫っ！"
"1600602-39-「海の家」の店主" = "ふむ……君たちが次の挑戦者か？"
"1600602-40-イズミ" = "うん、ロコモコ丼を食べに来たの！"
"1600602-41-「海の家」の店主" = "なるほど。これまでの戦いを見た上で、いきなり事実上の勝利宣言とは……。"
"1600602-42-「海の家」の店主" = "面白い！その挑戦、受けて立つ！"
"1600602-43-司会" = "それでは、競技……始めっ！"
"1600602-44-「海の家」の店主" = "では、私から……。"
"1600602-45-「海の家」の店主" = "［スーッ］"
"1600602-46-司会" = "初手から4分の1近くの砂を持っていきました、これは大胆！さすがチャンピオンです！"
"1600602-47-司会" = "これに対し、チャレンジャーたちはどう出るのか！"
"1600602-48-市民１" = "頑張れー！"
"1600602-49-市民２" = "さて、どう来る……？"
"1600602-50" = "[s] \"じゃあ、えっと……。\""
"1600602-51-「海の家」の店主" = "……ふっ、ずいぶんと慎重じゃないか。"
"1600602-52-「海の家」の店主" = "そんな消極的な戦い方で、私に勝てるとでも？"
"1600602-53" = "[s5] \"いや、ちょっと負けるのは嫌なので……。\"\n[s6] \"店主さん、ノリノリですね……。\""
"1600602-54-イズミ" = "じゃあ私の番だね！"
"1600602-55-イズミ" = "じゃあ私の番だね！"
"1600602-56-イズミ" = "さて、どうしよっかな～！"
"1600602-57-イズミ" = "うーん……？"
"1600602-58" = "じゃあ、えっと……。"
"1600602-59-司会" = "さあ、チャレンジャーはどう動くのか！！"
"1600602-60-司会" = "一歩間違えれば、口の中がチャバスコで真っ赤になってしまいます！"
"1600602-61-司会" = "あの地獄のジュースを避けようと、大半のチャレンジャーは慎重に動きますが……！？"
"1600602-62-「海の家」の店主" = "ふふっ、どうせ大人しく……"
"1600602-63-イズミ" = "えいっ！"
"1600602-64-司会" = "おおっと！チャレンジャー、一気に攻めていきます！これは短期決戦か！？"
"1600602-65-市民１" = "すごい、砂を半分近く一気に……！"
"1600602-66-市民２" = "おい、もうあれ倒れるんじゃないか！？グラグラしてるぞ！？"
"1600602-67" = "[s] \"ちょっ、イズミ！？\""
"1600602-68-市民３" = "ううん、見て……！すごい、ギリギリだけど……"
"1600602-69-人だかり" = "まだ棒は立ってる……！"
"1600602-70-イズミ" = "な、なんだと……！？今の技、まさか……！"
"1600602-71-「海の家」の店主" = "10年前……私とチャンピオンの座を争った、通称「黄金のサソリ」……。"
"1600602-72-「海の家」の店主" = "あいつの必殺技……「十戒」だと！？な、なぜその技を……！？まさか、後継者はいないはず……！"
"1600602-73-イズミ" = "……？何それ？"
"1600602-74-イズミ" = "あれ？棒、まだ倒れてない？なんだ、ざんねーん。"
"1600602-75" = "[s] \"……ちょっと待ってイズミ。\""
"1600602-76-イズミ" = "チャバスコジュースが……え？先生、何か言った？"
"1600602-77" = "[s] \"もしかして、わざと負けようとしてない！？\""
"1600602-78-イズミ" = "やっ、えっと、手を抜いてたわけじゃなくて……！"
"1600602-79-イズミ" = "そうじゃなくて、その、私は本気で……。"
"1600602-80-イズミ" = "本気で、珍味を味わおうと……"
"1600602-81" = "[s7] \"イズミが狙ってる「珍味」ってロコモコじゃなくて……。\"\n[s8] \"あの「チャバスコジュース」の方！？\""
"1600602-82-イズミ" = "えっと、えぇっと……！"
"1600602-83-イズミ" = "えっと、えぇっと……！"
"1600602-84-イズミ" = "……。"
"1600602-85-イズミ" = "し、仕方ないじゃん！普通に注文しても出てこなくて、このゲームで負けないと飲めないんだから！"
"1600602-86-イズミ" = "そ、それにゲームに参加するにはコンビが必要で、それで先生に……。"
"1600602-87" = "[s] \"えぇ……？\""
"1600602-88-「海の家」の店主" = "ふふふ……この血が騒ぐ感覚、久しぶりだ。"
"1600602-89-イズミ" = "ふぇ？"
"1600602-90-「海の家」の店主" = "あいつもいないし、しばらく退屈してたんだ。この身体に滾る熱い衝動、懐かしいな……！"
"1600602-91-「海の家」の店主" = "良いだろう、私にもプライドがある……全力で行くとしよう！"
"1600602-92" = "[s] \"本当にノリノリですね！？\""
"1600602-93-「海の家」の店主" = "さあ、行くぞ！"
"1600602-94-イズミ" = "ふえぇぇ！？よ、よく分からないけど私も負けな、いや、勝ち……？"
"1600602-95-イズミ" = "と、とりあえず頑張る！"
"1600602-96-「海の家」の店主" = "認めよう……私の、負けだ。"
"1600602-97-司会" = "なんとなんと……！"
"1600602-98-司会" = "チャレンジャーの勝利です！"
"1600602-99-人だかり" = "うおおおおおぉぉぉ！！！"
"1600602-100" = "[s] \"か……勝った。\""
"1600602-101-イズミ" = "ふええぇぇぇん！？え、勝ったの！？なんで、どうして！？"
"1600602-102-イズミ" = "勝っちゃったらあの「チャバスコジュース」飲めないじゃーん！"
"1600602-103-イズミ" = "あれだけネットでみんな「口の感覚が消えた」「私の歯、まだある？」「途中から逆に味が無い」って言ってたから……"
"1600602-104-イズミ" = "すっごく楽しみにしてたのにいぃ！！！"
"1600602-105" = "[s] \"何でそのコメントで飲もうと思ったの！？\""
"1600602-106-「海の家」の店主" = "……心配するな、チャレンジャー。君たちの情熱は確かに受け取った。"
"1600602-107-「海の家」の店主" = "そこのお嬢さんに敬意を表して、ロコモコ丼だけじゃなく……"
"1600602-108-「海の家」の店主" = "「チャバスコジュース」も、一緒に贈呈しよう！"
"1600602-109-「海の家」の店主" = "え、嘘！？やったああぁぁぁぁ！！本当に！？ありがとーー！！"
"1600602-110-イズミ" = "やった！やったよ先生！！"
"1600602-111" = "[s] \"えっと、良かったね……。\""
"1600602-112-イズミ" = "ほら先生！一緒に食べよう！"
"1600602-113-イズミ" = "はい、ストロー！先に一口飲んで良いよ！"
"1600602-114" = "（太陽に負けないほど輝いたイズミの笑顔を前にして、どうしても断ることができなかった）"
"1600602-115" = "（トイレとの絆ランクが上がった）"
