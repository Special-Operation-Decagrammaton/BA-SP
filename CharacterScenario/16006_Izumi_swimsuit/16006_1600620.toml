[translation]
"1600620-1" = "最高の（？）避暑"
"1600620-2-イズミ" = "先生と……海で……美味しいものを……。"
"1600620-3" = "[s] \"イズミと……海で……暑さを忘れて……。\""
"1600620-4-イズミ" = "ダメだ～……。#nこのままじゃ時間がもったいないのに……。"
"1600620-5-イズミ" = "ふええええん……。"
"1600620-6" = "[ns1] \"あ……イズミがふにゃふにゃに……。\"\n[ns2] \"じゃあ、私も遠慮なく……。\""
"1600620-7-イズミ" = "ふええ……。#n先生もふにゃふにゃになっちゃった～……。"
"1600620-8" = "[s] \"だって仕方ないよ……。\""
"1600620-9-イズミ" = "そうだね……仕方ないよね……。"
"1600620-10-イズミ" = "これは……あまりにも……。"
"1600620-11-イズミ" = "暑すぎるううううぅぅぅ～～～！"
"1600620-12-イズミ" = "はぁ……なんとか日陰まで来れた……。#nやっと生き返るよ～"
"1600620-13-イズミ" = "でも暑すぎるからか、お店はしばらく休業だっていうし！"
"1600620-14-イズミ" = "このままじゃ先生と一緒に#n海の珍味を制覇する計画がめちゃくちゃだよぉ～！"
"1600620-15" = "[s] \"なんでもいいから……冷たいものを……。\""
"1600620-16-イズミ" = "ううっ……そうだね……#n冷たいもの、冷たいもの……。"
"1600620-17-イズミ" = "そうだ、これがあった！"
"1600620-18-イズミ" = "じゃじゃ～ん！"
"1600620-19-イズミ" = "クーラーボックスで～す！#nフルーツとかジュースとかをたくさん入れて持ってきたんだ～！"
"1600620-20-イズミ" = "これで私がフルーツポンチを作ってあげる！"
"1600620-21" = "[s] \"イ、イズミが作るフルーツポンチ……？\""
"1600620-22-イズミ" = "えーっと、まずはスイカにパイナップルでしょ？#nブルーベリーとチェリーもいれて～……"
"1600620-23-イズミ" = "あっ、ジュースも入れなきゃだよね？#nオレンジジュースとソーダ、それからそれから～……"
"1600620-24" = "（日陰に避難したからか、涼しい風が吹いてきた）"
"1600620-25-イズミ" = "カラマンシー、パッションフルーツ、カリン、アボカド……"
"1600620-26" = "（波の音とともに、カモメが空へ飛んでいく）"
"1600620-27-イズミ" = "ドリアン、マルメロ、ペピーノ、キワーノの塩漬け、ノニ……"
"1600620-28-イズミ" = "あとあと、濃縮タルトチェリー果汁と#n松葉ジュース、ルートビアも……！"
"1600620-29" = "[ns3] \"ちょ、ちょっと待って！イズミ！\"\n[ns4] \"フルーツポンチらしくない材料が紛れてたけど！？\""
"1600620-30-イズミ" = "え？フルーツとジュースしか入れてないけど……#nフルーツポンチだし、どんなフルーツを入れても問題ないよね？"
"1600620-31-イズミ" = "あ！もしかしてフルーツポンチじゃ涼めないと思ったとか？#n大丈夫だよ、氷もいっぱい入れておいたから！"
"1600620-32-イズミ" = "それじゃ仕上げに、私特製・秘伝スパイスをかけて……！"
"1600620-33-イズミ" = "ぐるぐる～っと混ぜれば……！"
"1600620-34-イズミ" = "かんせ～い！さあさあどうぞ召し上がれ！"
"1600620-35-イズミ" = "あれ、どうしたの先生？"
"1600620-36-イズミ" = "……あっ、わかった。#n私が作ったから、先を譲ってくれてるんだね？"
"1600620-37-イズミ" = "ありがとう先生！それじゃ遠慮なく……！"
"1600620-38" = "（イズミは何のためらいもなくフルーツポンチを口に入れた……）"
"1600620-39-イズミ" = "もぐもぐ……んんっ！#n先生！これほんとに美味しいよ！"
"1600620-40-イズミ" = "それぞれのフルーツの味が引き立っててもう最高！"
"1600620-41" = "[s] \"イズミが好きそうな材料だったからね……。\""
"1600620-42-イズミ" = "えへへっ、だからかな？#nこのフルーツポンチ、結構気に入っちゃった！"
"1600620-43-イズミ" = "自分で言うのもなんだけど、#n今までに食べた中で一番記憶に残る味だよ！"
"1600620-44-イズミ" = "ほらほら、先生も早く食べてみて！"
"1600620-45-イズミ" = "……どうしたの？#nもしかして、私が作ったものは食べたくないとか……？"
"1600620-46" = "[s] \"うっ、予期せぬイズミの攻撃が……！\""
"1600620-47-イズミ" = "え、どういうこと？私、何もしてないよ？"
"1600620-48-イズミ" = "それより、はい！#n食べたくない訳じゃないなら、受け取って！#n先生のは特別に、大きな皿に入れておいたから！"
"1600620-49" = "（イズミの期待に満ちた目に勝つことができなかった……！）"
"1600620-50-イズミ" = "……い、先生……！"
"1600620-51-イズミ" = "しっかりして、先生！うわああぁぁん！"
"1600620-52" = "[s] \"イズミ……？\""
"1600620-53-イズミ" = "先生、起きたの！？大丈夫！？"
"1600620-54-イズミ" = "心配するってば～！#nついさっきまで気を失ってたんだよ？"
"1600620-55" = "[s] \"すべては真夏の夜の夢……いや昼か……。\""
"1600620-56-イズミ" = "ふぇ？どういうこと？#n先生は時々よくわからないことを言うよね……。"
"1600620-57-イズミ" = "でも……どうしよう、先生。もう夕方になっちゃったよ？#n結局一日中何もできなかったし……。"
"1600620-58" = "[s5] \"でも結果的に暑さは忘れられたから。\"\n[s6] \"目的は達成したんじゃないかな？\""
"1600620-59-イズミ" = "う～ん、そうかな……？"
"1600620-60-イズミ" = "よくわからないけど……#n先生がそう言うんだし、そういうことにする！うん！"
