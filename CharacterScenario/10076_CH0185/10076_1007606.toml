[translation]
"1007606-1" = "説明したくない気持ち"
"1007606-2" = "（すべての競技が終わった後、1人でスタジアムに残っているコトリを見かけた）"
"1007606-3" = "（コトリはベンチに座り、がらんとしたグラウンドを無言で眺めていた）"
"1007606-4-コトリ" = "……あれ、先生。"
"1007606-5-コトリ" = "すみません……。#n来ていただきたくて言ったわけじゃ、なかったのですが……。"
"1007606-6" = "[s1] \"大丈夫？\"\n[s2] \"元気ないね。\""
"1007606-7-コトリ" = "あはは……顔に出ちゃってましたか……？"
"1007606-8-コトリ" = "……はぁ。"
"1007606-9-コトリ" = "自分でも思うんです。いつもの私らしくないって……。"
"1007606-10-コトリ" = "だけど、何だか力が出なくて……#nもちろん疲れているせいもあるのでしょうが……。"
"1007606-11-コトリ" = "理由を考えていたんですけど……よくわからなくて……。"
"1007606-12-コトリ" = "……そうですね……寂しい、のかもしれません。"
"1007606-13-コトリ" = "私、大運動会をずいぶん楽しんでいたみたいです。#nスポーツは、苦手なくせに……。"
"1007606-14-コトリ" = "実は賑やかな雰囲気が好きだったんですかね？あはは……。"
"1007606-15-コトリ" = "……だから、でしょうか？#nこれで全部終わりと思うと、少し気分が沈んでしまって……。"
"1007606-16-コトリ" = "……はい？"
"1007606-17-コトリ" = "この先イベントはいくらでもあるし、大運動会も次がある……？"
"1007606-18-コトリ" = "確かに、そうですね……。"
"1007606-19-コトリ" = "私も、そう思います……。"
"1007606-20-コトリ" = "……。"
"1007606-21-コトリ" = "でも……「次回」の大運動会は、#n「今回」と同じものではありません。"
"1007606-22-コトリ" = "ただ、似ているだけ。中身はまったく違います……。"
"1007606-23-コトリ" = "「今回」はもう二度と戻ってこないのです……。#n「次回」があるからと考えるのは、#nただの「ポジティブシンキング」に過ぎません……。"
"1007606-24-コトリ" = "…………あっ。"
"1007606-25-コトリ" = "あ、えっと……わ、私、今なんて……？"
"1007606-26-コトリ" = "……えっ！？#nす、すみません！先生の話にケチをつけるなんて……！"
"1007606-27-コトリ" = "ううう……私、体調が悪いのかも……。#n早く帰って休むことにします……。"
"1007606-28" = "[s3] \"正直に言ってくれてありがとう。\"\n[s4] \"コトリとちゃんと話ができて嬉しいよ。\""
"1007606-29-コトリ" = "え？先生……？"
"1007606-30-コトリ" = "違う視点から考えてみる、ですか……？"
"1007606-31-コトリ" = "どういう風に……？"
"1007606-32-コトリ" = "……え？"
"1007606-33-コトリ" = "二度と戻ってこないからこそ、いい……？"
"1007606-34-コトリ" = "それはどういう……。"
"1007606-35" = "[s5] \"唯一だから特別！とかね。\"\n[s6] \"だからこそ大切な時間だ！みたいな。\""
"1007606-36-コトリ" = "え、えっと……。"
"1007606-37-コトリ" = "それは「ポジティブシンキング」と、どう違うのでしょうか……？"
"1007606-38-コトリ" = "……え？"
"1007606-39-コトリ" = "あれ……？"
"1007606-40-コトリ" = "……不思議です。どうしてでしょう……？"
"1007606-41-コトリ" = "先生の話を聞いたら……少し元気になってきました。"
"1007606-42-コトリ" = "言葉が変わっただけだと思ったのに……一体どうして……？"
"1007606-43-コトリ" = "でも……先生のおっしゃる通りかもしれません。"
"1007606-44-コトリ" = "……たった、一度きりの時間。"
"1007606-45-コトリ" = "前回でも次回でもなく、「今回」を後悔したくないから――"
"1007606-46-コトリ" = "だからみんな、一生懸命向き合っていたのですね。この大運動会に。"
"1007606-47-コトリ" = "……はい。"
"1007606-48-コトリ" = "それから……。"
"1007606-49-コトリ" = "……もしかしたらこの時間も、#n「今回」の大運動会だからできたのかもしれません。"
"1007606-50-コトリ" = "ここまで頑張って、そして自分で考えて……。"
"1007606-51-コトリ" = "またひとつ、新たに学ぶ機会が得られて。"
"1007606-52-コトリ" = "そのお陰で、今……。"
"1007606-53-コトリ" = "先生と、並んで夕陽を眺めていることができているのかもしれませんね……。"
"1007606-54-コトリ" = "えへ、えへへ……。"
"1007606-55-コトリ" = "ポジティブシンキング……意外と効果絶大ですね……。"
"1007606-56" = "[s7] \"……もう大丈夫？\"\n[s8] \"いつものコトリに戻ったね。\""
"1007606-57-コトリ" = "はい！先生からのアドバイス、すごく効果がありました！#nありがとうございます！"
"1007606-58-コトリ" = "……え？"
"1007606-59-コトリ" = "さっきと温度差がすごい、と？"
"1007606-60-コトリ" = "えへへ……。"
"1007606-61-コトリ" = "……先生。"
"1007606-62-コトリ" = "私がこんなことを言うと驚かれるかもしれませんが……。"
"1007606-63-コトリ" = "世の中にはですね……。"
"1007606-64-コトリ" = "「言わぬが花」、という言葉が存在するんですよ？"
"1007606-65" = "[s9] \"コ、コトリ！？今なんて！？\"\n[s10] \"何とおっしゃいましたか、コトリさん！？\""
"1007606-66-コトリ" = "ふふっ、予想通りの反応ですね！"
"1007606-67-コトリ" = "でも、こればかりはダメです。絶対に説明しませんから！"
"1007606-68-コトリ" = "……。"
"1007606-69-コトリ" = "その代わり、というのは変ですけど……。"
"1007606-70-コトリ" = "もう少し、このまま……。"
"1007606-71-コトリ" = "せめて日が暮れるまでは……そばにいてくださいね。"
