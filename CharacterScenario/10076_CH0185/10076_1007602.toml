[translation]
"1007602-1" = "準備を一緒に"
"1007602-2" = "（早朝、がらんとしたスタジアムで備品をチェックしていると……）"
"1007602-3-コトリ" = "せんせ～～い！！"
"1007602-4-コトリ" = "お待たせしてすみません！可能な限り早く走ってきたのですが……！"
"1007602-5" = "[s1] \"ゆっくりでもよかったのに。\"\n[s2] \"朝から元気いっぱいだね。\""
"1007602-6-コトリ" = "そ、そうですか！？あはっ、あははは……。"
"1007602-7-コトリ" = "しかし先生は日中忙しいでしょうし、狙うなら今かと思いまして！"
"1007602-8-コトリ" = "それでですね。「提案」というのは、#n今日という日に起こりうる様々な出来事への準備――"
"1007602-9-コトリ" = "――ずばり、ストレッチです！！"
"1007602-10-コトリ" = "……あれっ？リアクションが薄いですね。#nもしかして、もう終わらせてたり……？"
"1007602-11-コトリ" = "おおっ、まだですか？よかったです！"
"1007602-12-コトリ" = "選手でなくても今日は一日中動き回ると思いますので、#nストレッチはやっておいたほうがいいですよ！"
"1007602-13-コトリ" = "……え？"
"1007602-14-コトリ" = "そうですね……ちゃんとやらないと、予期せぬ負傷を招く可能性があります。#nそれを防止するという意味でも、事前に……。"
"1007602-15-コトリ" = "……あ！"
"1007602-16-コトリ" = "ちなみにストレッチとは、使用する筋肉を意図的に緊張、または#n弛緩させることで「回復性」と「弾力性」を向上させる運動の1つで、#nとあるスポーツ科学の論文によると……"
"1007602-17" = "[s3] \"やろうやろう！ストレッチ大好き！\"\n[s4] \"今すぐはじめよう！わ～！楽しみ～！\""
"1007602-18-コトリ" = "おお！やる気に満ち溢れたその表情、いいですね！"
"1007602-19-コトリ" = "ですが、ストレッチはただ動けばいいというものではありません。#nちゃんとした手順を踏まないと効果が最大化できませんからね！"
"1007602-20-コトリ" = "ですが、先生はお忙しいので正しいストレッチを調べる時間も惜しいかと思います……#nなので、私がやり方を覚えてきました！"
"1007602-21-コトリ" = "先にやってみせますので、先生はそれを真似してくださいね！"
"1007602-22-コトリ" = "最初は……体を伸ばす運動から！"
"1007602-23-コトリ" = "まずは片足を上げて……。"
"1007602-24-コトリ" = "それから……こうやっ、て……。"
"1007602-25-コトリ" = "こ、こう……でしょうか……？"
"1007602-26" = "[ns5] \"……コトリ？\"\n[ns6] （何をしているんだろう……？）"
"1007602-27-コトリ" = "あれっ……？えっと……？んん……？"
"1007602-28-コトリ" = "だからこれは……。"
"1007602-29-コトリ" = "……ふぇん！？"
"1007602-30" = "[wa:1400]― [log=코토리 응원단ND]あっ、[wa:900]あれ……？[/log]"
"1007602-31" = "― [log=코토리 응원단ND]む、[wa:1000]むむっ……[wa:1800]腕が……[wa:1600]届くはず、[wa:1800]なのに……？[/log]"
"1007602-32" = "[wa:1700]― [log=코토리 응원단ND]そんな……！[/log]"
"1007602-33" = "[wa:100]― [log=코토리 응원단ND]ここで、[wa:1200]力を[wa:800]グッと――！？[/log]"
"1007602-34" = "― [log=코토리 응원단ND]いいいっ！？[/log]"
"1007602-35" = "― [log=코토리 응원단ND]いっ、[wa:600]いたたたたたたた！！？[/log]"
"1007602-36" = "[ns7] \"コトリ！？怪我しちゃうよ！\"\n[ns8] \"無理しなくて大丈夫だから……！\""
"1007602-37" = "[wa:500]― [log=코토리 응원단ND]お、[wa:800]おかしいです……！[/log]"
"1007602-38" = "― [log=코토리 응원단ND]調べた通りに、[wa:1300]やってるのに……！[/log]"
"1007602-39" = "[wa:400]― [log=코토리 응원단ND]人によって[wa:700]差があるとは[wa:700]知ってましたが、[/log]"
"1007602-40" = "― [log=코토리 응원단ND]ここまでとは……[/log]"
"1007602-41" = "[wa:1500]― [log=코토리 응원단ND]も、[wa:900]もう一回……。[/log]"
"1007602-42" = "[wa:100]― [log=코토리 응원단ND]っ……！？[wa:2000]いいい！[wa:900]いたたたたた！！[/log]"
"1007602-43" = "[wa:200]― [log=코토리 응원단ND]も、[wa:1300]もう、[wa:900]ムリ……。[/log]"
"1007602-44" = "― [log=코토리 응원단ND]ううう……[wa:3400]あ、[wa:1000]あの……[wa:1650]先生、[wa:1800]これは……[/log]"
"1007602-45" = "[wa:1100]― [log=코토리 응원단ND]こんな姿を[wa:1100]見せるつもりじゃ……[/log]"
"1007602-46" = "― [log=코토리 응원단ND]なかったんです……[/log]"
"1007602-47" = "― [log=코토리 응원단ND]ダメダメな姿を……[wa:2200]見られて、[wa:1600]しまいました……[/log]"
"1007602-48" = "[wa:200]― [log=코토리 응원단ND]うううう……。[/log]"
"1007602-49-コトリ" = "ご、ごめんなさい先生……。#n計画までは、その、完璧だったはずなのですが……。"
"1007602-50-コトリ" = "うう……これでは、ただ先生の時間を奪っただけです……。"
"1007602-51" = "[s9] コトリの背中をゆっくり押す。\n[s10] \"手伝ってあげるから、力を抜いて。\""
"1007602-52-コトリ" = "せ、先生……！？"
"1007602-53-コトリ" = "り、理由はわかりませんが、#n何だかすごく恥ずかしくなってきたような……！？"
"1007602-54-コトリ" = "……え？"
"1007602-55-コトリ" = "ストレッチは人と一緒にやることが多い……？#n初心者は、特に……？"
"1007602-56-コトリ" = "そ、そうだったんですか！？そこまでは調べられていませんでした……。"
"1007602-57-コトリ" = "そ、そそ、それじゃあ……！"
"1007602-58-コトリ" = "よ、よろしくお願いします！！"
"1007602-59" = "（その後、コトリと一緒にストレッチ[ruby=おこな]を行っ[/ruby]た）"
"1007602-60" = "（終わった時には身体がほぐれ、動きやすくなっていた）"
