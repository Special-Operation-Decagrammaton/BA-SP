[translation]
"2601402-1" = "休むなら心のタガを外して"
"2601402-2-カリン" = "作戦エリアを俯瞰的にカバーするなら……。"
"2601402-3-カリン" = "こっちか……いや、反対のほうが……。"
"2601402-4" = "[s] \"カリン。\""
"2601402-5-カリン" = "ああ、先生。"
"2601402-6-カリン" = "来ていたんだな。#n気がつかず、すまない。"
"2601402-7-カリン" = "ああ、これか？"
"2601402-8-カリン" = "使い勝手の良さそうな狙撃ポイントを見つけたから、メモを取っていたんだ。"
"2601402-9-カリン" = "いや、任務中というわけではない。#nこれは習慣みたいなものだ。"
"2601402-10" = "[s] \"今日はお休みなんだよね？\""
"2601402-11-カリン" = "そ、それはそうだが……。"
"2601402-12" = "[s1] \"ちゃんと休むことも任務のうちだよ。\"\n[s2] \"メモ帳は没収。\""
"2601402-13-カリン" = "ああっ……！"
"2601402-14-カリン" = "……でも、そうだな。#n……分かった。今日は任務と関係ないことをするとしよう。"
"2601402-15-カリン" = "……えっと。"
"2601402-16-カリン" = "……何をすればいいんだ？"
"2601402-17" = "[s] \"いつも任務の後は何してるの？\""
"2601402-18-カリン" = "後片付けや、次の任務の準備をしている。"
"2601402-19-カリン" = "あとは、バイトをしたり……。"
"2601402-20" = "[s] \"じゃあ、趣味に没頭してみるとか？\""
"2601402-21-カリン" = "趣味か……掃除だな。"
"2601402-22-カリン" = "……ただ、C&Cの任務の一環として、普段からも掃除をしている。"
"2601402-23-カリン" = "結局普段と同じことをしているなら、休みとは言えないかもしれないな……。"
"2601402-24" = "[s] \"今日は息抜きの日とします！\""
"2601402-25" = "[ns] \"適度にガス抜きしないと、疲れが溜まっちゃうよ！\""
"2601402-26-カリン" = "……そ、そうなのか？"
"2601402-27-カリン" = "別に、疲れは感じていないが……。"
"2601402-28-カリン" = "え？気が付かないうちに、溜まっているもの……？"
"2601402-29-カリン" = "蓄積した疲労を放置しすぎると、いざという時、#n力を十分に発揮できなくなる……かもしれない……か。"
"2601402-30-カリン" = "任務に支障をきたすのはよくないな……。"
"2601402-31-カリン" = "……分かった。先生の言うとおりにしてみよう。"
"2601402-32-カリン" = "ただ、休み方については、先生に教えてもらいたい。"
"2601402-33" = "[s] \"任せて！まずは……。\""
"2601402-34" = "[ns] \"美味しいものを食べに行こう！\""
"2601402-35-カリン" = "お祭りか……任務ならまだしも、#n自分から積極的に参加したことは無かったな……。"
"2601402-36-カリン" = "これまで、あまり縁がなかった場だ。"
"2601402-37-カリン" = "ここで食事をするのか？"
"2601402-38" = "[s] \"カリンにはぜひ、屋台料理を味わってほしくて。\""
"2601402-39" = "[ns] \"気になるものがあったら、なんでも言って！\""
"2601402-40-カリン" = "分かった。じゃあ、一緒に周ってくれるか？"
"2601402-41-露店商人A" = "おいしい串焼き～いかがですか～"
"2601402-42-露店商人B" = "揚げたてのアメリカンドッグ～焼きそばもありますよ～"
"2601402-43-カリン" = "串焼き、アメリカンドッグ、焼きそば……どれもおいしそうだ。"
"2601402-44-カリン" = "……よし、決めた。あの串焼きにしよう。"
"2601402-45-カリン" = "すみません。串焼きを二本、お願いします。"
"2601402-46-カリン" = "あい！毎度あり！"
"2601402-47-カリン" = "……はい、こっちは先生の分だ。"
"2601402-48" = "[s] \"へたっぴ……”"
"2601402-49-カリン" = "え？"
"2601402-50" = "[ns] \"カリンは……欲望の解放のさせ方が下手……！\""
"2601402-51-カリン" = "えっ！？"
"2601402-52-カリン" = "いきなり、何を……？"
"2601402-53" = "[s] \"全部二つずつください！\""
"2601402-54-カリン" = "あいよ！"
"2601402-55-カリン" = "ありがとうございま～す！"
"2601402-56-カリン" = "か、買いすぎじゃないのか……？"
"2601402-57-カリン" = "いや、いらないわけではない。気になっていたのは事実だが……。"
"2601402-58-カリン" = "全部、食べても……いいのか……？"
"2601402-59-カリン" = "分かった……先生がそう言うのなら。"
"2601402-60-カリン" = "あそこのベンチで食べよう。"
"2601402-61-カリン" = "おいしい……ほら、先生も串焼きを食べてみてくれ。"
"2601402-62-カリン" = "うん……焼きそばも、悪くない……。"
"2601402-63-カリン" = "食べたいものを我慢しちゃダメ。本当にその通りだな。"
"2601402-64" = "[s] \"まだまだ、アメリカンドッグもあるよ。\""
"2601402-65-カリン" = "ああ。"
"2601402-66-カリン" = "……こっちもおいしい。"
"2601402-67" = "[s] \"よかった！じゃあ……\""
"2601402-68-カリン" = "あっ！先生！危なっ――！"
"2601402-69-カリン" = "キャッ……ッチ！"
"2601402-70" = "[s] \"ナイス、カリン！\""
"2601402-71-カリン" = "でも、えっと、これ……どうしよう……。"
"2601402-72" = "[wa:400]― [log=카린 교복]……あっ！[wa:670]先生！[wa:900]ま、[wa:500]待ってくれ！[/log]"
"2601402-73" = "[wa:2300]― [log=카린 교복]このまま渡すのは、[wa:1150]ちょっと……！[/log]"
"2601402-74" = "[wa:500]― [log=카린 교복]その、[wa:2000]私が[wa:650]脚で挟んでしまったもの、[wa:1850]だから……[/log]"
"2601402-75" = "[wa:2800]― [log=카린 교복]これは[wa:400]私が食べるから、[wa:1450]先生は[wa:700]こっちを……！[/log]"
"2601402-76" = "[wa:1650]― [log=카린 교복]……あ。[/log]"
"2601402-77" = "[wa:1400]― [log=카린 교복]これは[wa:900]私の[wa:700]食べかけ……[/log]"
"2601402-78" = "[wa:550]― [log=카린 교복]ち、[wa:400]違う！[wa:900]そういう意味じゃ[wa:700]なくて……！[/log]"
"2601402-79" = "― [log=카린 교복]やっぱ[wa:400]こっちの……[/log]"
"2601402-80" = "[wa:1000]― [log=카린 교복]……！[wa:1500]では、[wa:300]なくて！[/log]"
"2601402-81" = "[ns3] \"お、落ち着いて、カリン！\"\n[ns4] \"大丈夫。どっちでも、私は気にしないから\""
"2601402-82" = "[wa:830]― [log=카린 교복]本当に、[wa:700]そんな[wa:750]つもりは……！[/log]"
"2601402-83" = "[wa:830]― [log=카린 교복]本当に、[wa:700]そんな[wa:750]つもりは……！[/log]"
"2601402-84" = "― [log=카린 교복]ど、[wa:1450]どちらを渡しても……[wa:2600]うう……[/log]"
"2601402-85" = "[wa:1900]― [log=카린 교복]わ、[wa:1600]私は[wa:900]どうすれば……！[/log]"
"2601402-86" = "（なんとかカリンを落ち着かせて、一緒にアメリカンドッグを食べた……）"
"2601402-87-カリン" = "……もう大丈夫。"
"2601402-88-カリン" = "アメリカンドッグ、おいしかった。"
"2601402-89" = "[s] \"……うん、おいしかったね。\""
"2601402-90-カリン" = "うう……変な間を置かれると、なんか気になるな。"
"2601402-91-カリン" = "とにかく、今日はありがとう。"
"2601402-92-カリン" = "おかげで休日を楽しむことができた。#n一人なら、こうはいかなかっただろうな。"
"2601402-93-カリン" = "……もしよかったら、また教えてもらえると嬉しい。"
