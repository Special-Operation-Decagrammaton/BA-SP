[translation]
"2001105-1" = "もう少しだけ"
"2001105-2" = "（セリカとの約束の時間より少し前に到着した）"
"2001105-3" = "（そのまま待って、約束の時間を過ぎたものの、セリカは約束の場所に現れない）"
"2001105-4" = "[s] \"バイト、忙しくなっちゃったとか……？\""
"2001105-5" = "（約束の時間から、約20分が過ぎ……）"
"2001105-6" = "[ns] \"まさか、どこかで倒れてるとか……。\""
"2001105-7" = "（以前セリカが過労で倒れてしまったことが頭をよぎり、急いでセリカを探しに行くことにした）"
"2001105-8" = "[ns] \"セリカ……。\""
"2001105-9" = "[ns] \"セリカ……！\""
"2001105-10" = "[ns] \"……っ！\""
"2001105-11-セリカ" = "あの、そろそろどいてくれないかな……？"
"2001105-12-セリカ" = "うーん、ビクともしてくれないわね……。"
"2001105-13-セリカ" = "どかすのは忍びないけど、先生を待たせちゃってるし……。"
"2001105-14" = "[s] （今の、セリカの声……？）"
"2001105-15" = "（声が聞こえてきた方へ向かう）"
"2001105-16" = "[ns] \"セリカ！？\""
"2001105-17-セリカ" = "あっ、せ、先生……？"
"2001105-18" = "[s1] \"……良かった。\"\n[s2] \"あれ、その子は……？\""
"2001105-19-セリカ" = "えっと、その……"
"2001105-20-セリカ" = "えっと、その……"
"2001105-21" = "[wa:350]― ご、[wa:1050]ごめん、[wa:700]先生……。"
"2001105-22" = "― この通り、[wa:1200]ちょっと[wa:350]動けなくって……。"
"2001105-23" = "[ns3] \"すごく気持ちよさそうに寝てるね、可愛い。\"\n[ns4] \"何だかセリカに似てるかも。\""
"2001105-24" = "[wa:350]― え、[wa:850]そ、[wa:400]それって[wa:500]どういう意味！？"
"2001105-25" = "[wa:350]― え、[wa:850]そ、[wa:400]それって[wa:500]どういう意味！？"
"2001105-26" = "[wa:100]― っていうかそれ、[wa:1300]褒めてるの……？"
"2001105-27" = "[wa:350]― あ、[wa:1400]そういえばその、[wa:2400]約束破って[wa:1050]ごめんなさい……。"
"2001105-28" = "― え、[wa:1450]ここで[wa:500]一緒に[wa:350]休む……？"
"2001105-29" = "[ns] \"ううん、倒れたとかじゃなくて良かった。代わりってわけじゃないけど――\""
"2001105-30" = "[wa:100]― ずっと[wa:350]アルバイト[wa:700]頑張ってたんだから、"
"2001105-31" = "[wa:50]― 今くらい[wa:600]ゆっくりしてほしい、[wa:1900]って……？"
"2001105-32" = "― あはっ、[wa:1000]何それ。"
"2001105-33" = "[wa:100]― ほんと、[wa:1400]先生はいつも[wa:1150]そうやって……。"
"2001105-34" = "― でも、[wa:1550]うん。[wa:1900]じゃあちょっとだけ、"
"2001105-35" = "― こうして一緒に[wa:550]ゆっくりしよっか。[wa:1550]先生。"
"2001105-36" = "（そうしてその日は、セリカと縁側に腰掛けてゆっくり過ごした）"
