[translation]
"1004305-1" = "焚き火のそばでちらつく心"
"1004305-2-地域商人会長" = "これで準備は全て終わりです。"
"1004305-3-地域商人会の青年" = "皆さん、お疲れ様でした！"
"1004305-4" = "[ns] \"ふう、やっと終わった。\""
"1004305-5" = "（いろいろと騒ぎがあったけれど、最終的には無事、花火大会の準備を終えることができた）"
"1004305-6" = "（しばらく時間に余裕ができたところで、ワカモにモモトークの返事を送った）"
"1004305-7" = "[s] \"「仕事は全部終わったよ。ワカモはどこ？」\""
"1004305-8" = "（いつもすぐ返ってくるのに、待てど暮らせどワカモから返事は来なかった）"
"1004305-9" = "[s] \"ワカモから返事が来ないなんて珍しい……。\""
"1004305-10-地域商人会長" = "おや、天気が……。"
"1004305-11-地域商人会長" = "風の様子も怪しいですし、こりゃ海が荒れそうですなぁ。"
"1004305-12" = "（ふと、漠然とした不安を感じた）"
"1004305-13" = "[ns] \"……ちょっと出かけてきます。\""
"1004305-14-地域商人会の青年" = "あっ、先生お待ち下さい！雨風が強くなってきてます！"
"1004305-15" = "（漠然とした不安に突き動かされるままに周辺を探し回っていると……）"
"1004305-16" = "[ns] \"はぁはぁ……みつけた……。\""
"1004305-17-ワカモ" = "あら、先生。いらっしゃったのですね♡"
"1004305-18" = "[ns] \"……ワカモ、ここで何を？\""
"1004305-19-ワカモ" = "何を…といいますと？"
"1004305-20-ワカモ" = "うふふっ、ここでずうっと……あなた様をお待ちしておりました♡"
"1004305-21" = "[s] \"この天気の中、ここで待っていたの……？どうして……。\""
"1004305-22-ワカモ" = "うふふ、そんな質問をなさるなんて……あなた様も本当に意地の悪いお方。"
"1004305-23-ワカモ" = "それは、申し上げるまでもなく……。"
"1004305-24-ワカモ" = "あなた様と「約束」を、しましたから。"
"1004305-25-ワカモ" = "「少しだけ待ってくれる？」"
"1004305-26-ワカモ" = "あなた様がそう仰ってくださるのですから……。"
"1004305-27-ワカモ" = "このワカモ。お言葉通り――雨が降ろうと、雪が降ろうと。あなた様を待つのは当然のこと。"
"1004305-28-ワカモ" = "そういう「約束」なんですから。"
"1004305-29" = "[s] \"約束……そういえば、この間の花火倉庫でも……。\""
"1004305-30-ワカモ" = "うふふっ、ええ……あなた様に「約束」をしたので。今日という日を、特別なものにして差し上げる、と。"
"1004305-31-ワカモ" = "ですから、私たちを邪魔し続けるこの障害物……。"
"1004305-32-ワカモ" = "ええ……花火自体を、吹き飛ばします！"
"1004305-33" = "[ns] \"それでワカモは約束を守ろうと……。\""
"1004305-34-ワカモ" = "はい、その通りでございますが……。"
"1004305-35-ワカモ" = "私……もしかして……何か間違ってしまったのでしょうか。"
"1004305-36-ワカモ" = "あなた様にご迷惑をおかけするようなことを、してしまった……とか……？"
"1004305-37" = "[s1] \"ううん、ミスなら私の方だよ。こんなところで待たせてしまうなんて。\"\n[s2] \"ワカモにもっとちゃんと説明すべきだったね。\""
"1004305-38-ワカモ" = "えっ……"
"1004305-39-ワカモ" = "えっ……"
"1004305-40-ワカモ" = "そんな、この程度、私は何とも――"
"1004305-41-ワカモ" = "うっ！？せ、先生……？"
"1004305-42" = "[ns3] \"……大丈夫なわけ、ないでしょう。\"\n[ns4] \"身体をこんなに冷やしちゃって……！\""
"1004305-43-ワカモ" = "先生……。"
"1004305-44-ワカモ" = "先生……。"
"1004305-45-ワカモ" = "あなた……様……。"
"1004305-46-ワカモ" = "……熱い、です。"
"1004305-47" = "[s] \"……ワカモ、ちょっと待ってね！\""
"1004305-48-ワカモ" = "あっ、は、はい……?"
"1004305-49-ワカモ" = "これは……たき火……？"
"1004305-50" = "[s5] \"帰る前に、ここでちょっと冷えた身体を温めようか。\"\n[s6] \"その間、ワカモの傍に座っているから。\""
"1004305-51-ワカモ" = "……！"
"1004305-52-ワカモ" = "はっ、はぁい……♡"
"1004305-53-ワカモ" = "で、では、失礼いたします。"
"1004305-54" = "[wa:200]― ふふっ、[wa:2150]温かいですね……。"
"1004305-55" = "[wa:120]― もちろん[wa:1450]焚火のせいも[wa:500]ありますが……。"
"1004305-56" = "[wa:1300]― あなた様の声、[wa:1950]その言葉一つ一つが……。"
"1004305-57" = "[wa:100]― 今は[wa:950]この私のためだけに、"
"1004305-58" = "[wa:80]― 紡がれているのだと思うと……"
"1004305-59" = "[wa:850]― ……まだ私は、"
"1004305-60" = "― 色々と[wa:1000]至らぬ身ではあります。"
"1004305-61" = "― あなた様の[wa:450]そばにいることで、[wa:2400]たくさん[wa:850]迷惑をかけ"
"1004305-62" = "[wa:50]― また、[wa:1200]間違いを[wa:550]犯してしまうかも[wa:750]しれません。"
"1004305-63" = "[wa:500]― それでも、[wa:2000]私は[wa:1350]こうしてあなた様の……"
"1004305-64" = "― 先生のおそばにいても、[wa:2500]よろしいでしょうか……？"
"1004305-65" = "[ns] \"もちろん……いくらでも。\""
"1004305-66" = "[wa:400]― ありがとうございます……"
"1004305-67" = "― そんな[wa:300]あなた様だから、[wa:2300]私は……"
"1004305-68" = "（ワカモの凍った体が溶けるまで、一緒にたき火の揺れる水面を眺めていた）"
