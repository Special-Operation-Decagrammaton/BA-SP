[translation]
"1004303-1" = "ただ約束を守りたくて"
"1004303-2" = "（花火大会の準備をするべく、海にやってきた）"
"1004303-3-地域商人会長" = "いやぁ、お陰様で大変助かりましたよ[USERNAME]先生。"
"1004303-4" = "[s] \"いえ、これくらいのことでしたら全然。\""
"1004303-5-地域商人会長" = "またまたぁ、ご謙遜なさらずに。"
"1004303-6-地域商人会の青年" = "失礼いたします。[USERNAME]先生にお会いしたいというお客様が……。"
"1004303-7" = "[ns] \"私に来客……？まさか……。\""
"1004303-8" = "[ns] \"やっぱり……ワカモ……！\""
"1004303-9-ワカモ" = "うふふっ……そんな熱烈に歓迎していただけるなんて……このワカモ、感涙に咽び泣いてしまいそうです♡"
"1004303-10" = "[s] \"仕事が終わった後に会おうって……。\""
"1004303-11-ワカモ" = "ええ……"
"1004303-12-ワカモ" = "あなた様はそう「約束」してくださりました。"
"1004303-13-ワカモ" = "ですので、このワカモ……モモトークの後からずっとお待ちしておりました。"
"1004303-14-ワカモ" = "ええ……一日千秋の思いでお待ちして……そうして、お仕事が終わったタイミングを見計らってお迎えに上がったのです♡うふふっ。"
"1004303-15" = "[s] \"うん！そうだと思ったけどさぁ！\""
"1004303-16-ワカモ" = "もしかして……私、あなた様にご迷惑をおかけしてしまいましたか……？"
"1004303-17-ワカモ" = "お迎えに上がることが、あなた様のご迷惑になってしまうのであれば……その……。"
"1004303-18" = "[s] \"そんなことはないよ……でも、まだ仕事が……。\""
"1004303-19-地域商人会長" = "そういうご事情でしたら大丈夫です。もうほとんど終わっておりますし。"
"1004303-20-地域商人会の青年" = "あとはうちの商会にお任せください！先生、お疲れ様でした！"
"1004303-21" = "[s] \"それではお言葉に甘えて……じゃあ、一緒に行こうか？\""
"1004303-22-ワカモ" = "うふふっ。ええ、もちろんです！"
"1004303-23" = "[ns1] \"一緒に出たのはいいものの……。\"\n[ns2] \"これから一体何をすれば……。\""
"1004303-24-ワカモ" = "うふふっ、お任せください。計画なら入念に立ててまいりました。"
"1004303-25-ワカモ" = "今日という日を、あなた様にとって完璧な一日にするための「約束」。"
"1004303-26-ワカモ" = "名づけて……"
"1004303-27-ワカモ" = "「ワカモの完璧サマーデートプラン」を！"
"1004303-28-ワカモ" = "……時に先生、夏の海で最も欠かせないものは何だと思いますか？"
"1004303-29" = "[s3] \"うーん……なかなか一つに決められないなぁ。\"\n[s4] \"密かに持ち出した、学園の備品用戦車とか……？\""
"1004303-30-ワカモ" = "うふふ、ご安心ください。このワカモが様々なプランをご用意して参りましたので。"
"1004303-31-ワカモ" = "えっ？備品？戦車……？"
"1004303-32-ワカモ" = "ええと、申し訳ございません……あなた様の仰ることがよく理解できず……。"
"1004303-33-ワカモ" = "それではまず、お腹を満たす事に致しましょう。"
"1004303-34-ワカモ" = "ふふっ……この間果たせなかった「約束」を今度こそ成し遂げましょうね。"
"1004303-35" = "[s] \"……？\""
"1004303-36-店員" = "いらっしゃいませ！お客様二名様、入りまーす！"
"1004303-37" = "[s] \"ここは……海の家？\""
"1004303-38-ワカモ" = "ええ、そうです。"
"1004303-39-ワカモ" = "この間、あなた様が「かき氷を食べたい」と仰ってくださったのに、結局果たせなかったと思いまして……。"
"1004303-40" = "[s] \"うん……気にかけてくれてたんだね。\""
"1004303-41-ワカモ" = "うふふっ……ここではカップル専用のフルーツ……えぇと……フルーツなんとかのかき氷が人気らしく。"
"1004303-42-ワカモ" = "ええ……このワカモ、あなた様と寄り添って、このかき氷を食べさせあえたらな、と。"
"1004303-43-ワカモ" = "ふふっ。そういうプランを組んでまいりました。いかがでしょう？"
"1004303-44-店員" = "お待ちどうさまです！こちら「フルーツシロップと果肉たっぷりの夏を制する最強王者降臨かき氷！」です！"
"1004303-45" = "[s] \"呪文みたいな名前だ……！\""
"1004303-46-ワカモ" = "さあ、あなた様……おそばに失礼いたしますね。"
"1004303-47-ワカモ" = "そう、口をゆっくり開けて……はい♡私のすくった愛情たっぷりのかき氷を……どうぞ召し上がれ♡"
"1004303-48" = "[s] \"あーん……ぱくっ\""
"1004303-49" = "[ns] \"うん、おいしいね。\""
"1004303-50-ワカモ" = "あ、ああ……そ、そんなに迷わず一口で……私の愛を……。"
"1004303-51-ワカモ" = "このワカモ……火照ってしまいそうです……。"
"1004303-52" = "[s] \"次はワカモの番だよ。\""
"1004303-53-ワカモ" = "え？私の番……？で、ですが。"
"1004303-54" = "[ns] \"はい、あーん。\""
"1004303-55-ワカモ" = "あ、あなた様手ずからの「あーん」だなんて……"
"1004303-56-ワカモ" = "あああ、わ、私は、こ、このワカモは……。"
"1004303-57-ワカモ" = "うう……で、では失礼して……。"
"1004303-58" = "[ns] \"あっ！ワカモごめん。ちょっと待ってね……\""
"1004303-59-地域商人会長" = "お忙しいところ急に申し訳ございません！"
"1004303-60-地域商人会長" = "花火大会関連でトラブルが……！"
"1004303-61" = "[ns] \"ごめんワカモ、ちょっと火急の用が……。\""
"1004303-62-ワカモ" = "ええ、"
"1004303-63-ワカモ" = "大丈夫です。"
"1004303-64-ワカモ" = "あなた様はいつも多事多忙の身。このワカモ、弁えておりますので……。"
"1004303-65-ワカモ" = "いってらっしゃいませ……ここで、お待ちしておりますね。"
"1004303-66" = "[s] \"ごめんね！すぐ戻るから！\""
"1004303-67" = "（そうして仕事を片付ける間に、かき氷はすべて溶けてしまった）"
"1004303-68" = "[ns] \"本当にごめん……！また新しく注文し直そうか……。\""
"1004303-69-ワカモ" = "とんでもないです！あなた様が謝ることではございません……！"
"1004303-70-ワカモ" = "私のプランはまだ始まったばかりですから！"
"1004303-71-ワカモ" = "さあ、次へ参りましょう！"
"1004303-72" = "[s] \"うん……ごめんね。\""
"1004303-73-ワカモ" = "次のプランは他でもなく……。"
"1004303-74-ワカモ" = "この間、あなた様とできなかった水遊びを楽しもうと思いまして……。"
"1004303-75" = "[s] \"たしかに海なら色んな水遊びが楽しめるね。何をしようか？\""
"1004303-76-ワカモ" = "ええ……ですが、私がやってみたいのはただの水遊びではなく……その……。"
"1004303-77" = "[s] \"……？\""
"1004303-78-ワカモ" = "恋人同士、浜辺で行えるユニークな独特の「遊び」があると小耳に挟みまして。"
"1004303-79-ワカモ" = "私、それをずっとやってみたいと思っていたのです……。"
"1004303-80" = "[s] \"へぇ、それはどんな遊びなの？\""
"1004303-81-ワカモ" = "今や世間では絶滅してしまい、探すのが極めて難しくなってしまったという伝説的なイベント……。"
"1004303-82-ワカモ" = "「アハハ、ワタシを捕まえてごらん～」です……！"
"1004303-83" = "[s] \"かなりベタな……！\""
"1004303-84-ワカモ" = "おかしいでしょうか……少し、その、お恥ずかしいかもしれませんが。"
"1004303-85-ワカモ" = "愛を分かち合う恋人同士なら、海でこういった遊びをすると伺いまして……。"
"1004303-86" = "[s] \"いや……全然おかしい事ではないんだけど……。\""
"1004303-87-ワカモ" = "それでは……恥を忍んで、始めてみましょうか。"
"1004303-88-ワカモ" = "さあ……身も心もすべて準備が整いました。"
"1004303-89-ワカモ" = "あとはあなた様の……。"
"1004303-90" = "[ns] \"……ん？\""
"1004303-91-ワカモ" = "どうか……[ruby=・   ・   ・]私から[/ruby]、全力で逃げていただけますか？"
"1004303-92-ワカモ" = "あなた様を手に入れるためでしたら、このワカモ……"
"1004303-93-ワカモ" = "世界の果てまでだって追いかけてみせますとも！うふふっ……！"
"1004303-94" = "[s] \"ま、待って！ワカモと私が想像してるイベントが違うんじゃない！？\""
"1004303-95-ワカモ" = "絶対に、逃しません……"
"1004303-96-ワカモ" = "あ・な・た・様♡"
"1004303-97" = "[ns] \"ご、ごめんワカモ！電話が！ちょっと待ってね！"
"1004303-98-ワカモ" = "あっ……。"
"1004303-99-地域商人会長" = "お忙しいところすみません、[USERNAME]先生！アレが準備過程から漏れてしまっておりまして！"
"1004303-100-地域商人会長" = "申し訳ございませんが至急……。"
"1004303-101" = "[ns] \"ごめん、ワカモ……！急用が……！\""
"1004303-102-ワカモ" = "あっ……ええ……。"
"1004303-103-ワカモ" = "私、お待ちしておりますので……どうぞお気をつけて……。"
"1004303-104" = "（その後も、ワカモが用意してくれたサマーデートプランを実行しようとする度に、シャーレの仕事で席を外すことを余儀なくされ……）"
"1004303-105-ワカモ" = "あ、先生……。"
"1004303-106-ワカモ" = "あの、あなた様と一緒に……。"
"1004303-107-ワカモ" = "ええと……。"
"1004303-108" = "（そうして怒濤のように押し寄せてくる仕事を処理していたら、いつのまにかすっかり日が暮れてしまっていた）"
"1004303-109" = "[ns] \"ごめんワカモ……本当にごめん！\""
"1004303-110-ワカモ" = "うふふっ。私は大丈夫ですよ、先生。"
"1004303-111-ワカモ" = "あなた様がご多忙を極めていることは、このワカモよく存じ上げておりますから。"
"1004303-112-ワカモ" = "今から、私が用意した「ワカモの完璧サマーデートプラン」に沿って……。"
"1004303-113-ワカモ" = "最後は、あなた様と一緒に夕暮れの海を見つめながら――"
"1004303-114" = "[ns5] \"ごめん、また花火大会関連の連絡みたい。\"\n[ns6] \"この埋め合わせはまた……。\""
"1004303-115-ワカモ" = "うふふっ、ええ、大丈夫です。"
"1004303-116-ワカモ" = "うふふっ、ええ、大丈夫です。"
"1004303-117-ワカモ" = "お気をつけていってらっしゃいませ。"
"1004303-118" = "[s] \"ごめん！\""
"1004303-119-ワカモ" = "……花火大会。"
"1004303-120-ワカモ" = "私とあなた様の時間を……何度も、何度も……。"
"1004303-121-ワカモ" = "よくも、よくも……よくも……！"
"1004303-122-ワカモ" = "……花火大会ごときが、私たちの邪魔をするなんて……。"
"1004303-123-ワカモ" = "ああ……それなら……。"
"1004303-124-ワカモ" = "うふふふ……約束を守るために……。"
"1004303-125-ワカモ" = "ええ……簡単な、事でしたね。"
"1004303-126-地域商人会長" = "いやあ～[USERNAME]先生。大変お手数をおかけしました。"
"1004303-127-地域商人会長" = "お陰様でお祭りの準備は完璧に終わりましたわい。"
"1004303-128" = "[s7] \"それなら良かったのですが……\"\n[s8] （ワカモが待ってる……早く帰らないと……）"
"1004303-129" = "（その時、一件のモモトークが届いた）"
"1004303-130-ワカモ" = "ふふふ。あなた様を煩わせる全ての心配事は、このワカモが処理致しますので。どうかご安心なさってくださいね。"
"1004303-131" = "[s] \"ワカモ？処理って一体……。\""
"1004303-132" = "（ワカモから送られてきた文章に首を傾げたその瞬間）"
"1004303-133-地域商人会の青年" = "た、た、大変です！花火が保管されている倉庫に爆弾を持った不審者が！"
"1004303-134-地域商人会長" = "……な、なんだと！？"
"1004303-135" = "[s] \"まさか！？\""
"1004303-136" = "花火積込倉庫"
"1004303-137-ワカモ" = "うふふっ。初めから、こうすれば良かったのです……。"
"1004303-138-ワカモ" = "私と先生の邪魔をするものは全部ここにあるのですから。"
"1004303-139-ワカモ" = "これを全て破壊してしまえば……！"
"1004303-140-地域商人会の青年" = "そんな危険な事はやめてください……！"
"1004303-141-ワカモ" = "……ふん。また邪魔者ですか。"
"1004303-142-ワカモ" = "何と言われようと、私はもう決心を……。"
"1004303-143" = "[s] \"ワカモ……！\""
"1004303-144-ワカモ" = "あなた様……?"
"1004303-145" = "[s] \"ワカモ、一体何をしようとしてるの！？\""
"1004303-146-ワカモ" = "うふふっ、ええ……あなた様に「約束」をしたので。今日という日を、特別なものにして差し上げる、と。"
"1004303-147-ワカモ" = "ですから、私たちを邪魔し続けるこの障害物……。"
"1004303-148-ワカモ" = "ええ……花火自体を、吹き飛ばします！"
"1004303-149-ワカモ" = "そうすれば、あなた様も私との時間を邪魔されることなく、自由に今日という一日を過ごしていただける……！"
"1004303-150" = "[s] \"ちょっと待って、怪我してない？大丈夫？\""
"1004303-151-ワカモ" = "い、いえ……怪我は、ありませんが……"
"1004303-152-ワカモ" = "そ、その……。"
"1004303-153" = "[s] \"よかった……大丈夫そうだね。\""
"1004303-154" = "[ns] \"じゃあ、安心してねワカモ。今から始めるよ。\""
"1004303-155-ワカモ" = "えっ……？"
"1004303-156-ワカモ" = "え、ええと……先生……？始めるって、一体、何を？"
"1004303-157" = "[ns] \"花火倉庫を爆破しようとするなんて、一体どうして？\""
"1004303-158" = "（思ったよりずっと大きな声で、ワカモに向かって言ってしまった）"
"1004303-159-ワカモ" = "……ビクッ！"
"1004303-160-ワカモ" = "そ、その……今日一日、私とあなた様の時間を邪魔したのは……全部、この、花火、だから……。"
"1004303-161-ワカモ" = "そのことに気がついたら居ても立っても居られず……これさえ始末すれば……。"
"1004303-162-ワカモ" = "ええ……！あなた様も、私と一緒に穏やかに今日という日を過ごせると思って……！"
"1004303-163" = "[s] \"そんな事をしたら、怪我人が出るかもしれないでしょう！？\""
"1004303-164-ワカモ" = "で、ですが……私は……。"
"1004303-165" = "[s] \"もしも、ワカモが怪我をしたらどうするつもりだったの？\""
"1004303-166" = "[ns] \"それでもワカモは私の……私たちのためって言えるの！？\""
"1004303-167" = "[ns] \"私に心配なんてしないでって言えるの？\""
"1004303-168" = "[ns] \"逆の立場だったとして、ワカモは納得できる！？\""
"1004303-169-ワカモ" = "あ、私……私は……。"
"1004303-170" = "[s] \"そうなってしまったら、私は絶対にワカモを許せなかったと思うよ。\""
"1004303-171-ワカモ" = "許せ、ない……？あなた様が、私を？"
"1004303-172-ワカモ" = "あ、ダメ。ダメです……そんなの、ダメ……。"
"1004303-173-ワカモ" = "も、も、申し訳、ございませんんん……。"
"1004303-174-ワカモ" = "か、勝手に……爆破しようとして、すみませんでした……許せないなんて、言わないでください……。"
"1004303-175-ワカモ" = "わ、私はあなた様に嫌われてしまったら……。"
"1004303-176-ワカモ" = "私が生きていく意味が……この心の、想いの行き場が……無くなってしまう。ダメ。それだけは、どうか……すみません、すみません……"
"1004303-177-ワカモ" = "すみま……ううぅ……。"
"1004303-178" = "[s] \"……とりあえず帰ろう。\""
"1004303-179" = "（幸い、事件が起こる前に確保したワカモを連れて、宿に戻ることができた）"
