[translation]
"2005005-1" = "ひとりはダメ！"
"2005005-2" = "シャーレ・正門"
"2005005-3-リツ" = "わっ！はやーい！"
"2005005-4" = "[s] \"こんにちは、リツ！\""
"2005005-5-リツ" = "でも先生、忙しいんじゃないの？"
"2005005-6" = "[s1] \"……大人はね。\"\n[s2] \"仕事から逃げるチャンスを、見逃がさないんだ。\""
"2005005-7-リツ" = "あっ！ボク、それ知ってる！"
"2005005-8-リツ" = "えーっと、「職務怠慢」って言うんじゃない？"
"2005005-9" = "[s] \"うぐぅ……！\""
"2005005-10-リツ" = "でも、ボクと出かけてくれるんだよね？"
"2005005-11-リツ" = "なら、職務怠慢の先生でもおっけー！"
"2005005-12-リツ" = "んじゃ、しゅっぱーつ！ボクの「シマ」に案内するよ！"
"2005005-13" = "（リツに手を引かれ、商店街へ向かった）"
"2005005-14" = "洋服商店街"
"2005005-15-リツ" = "とうちゃーく！"
"2005005-16-リツ" = "普段着から勝負服まで、ぜ～んぶここに揃ってるんだ！"
"2005005-17" = "[s] \"ファッションの街なんだね！\""
"2005005-18-リツ" = "あそこの角のお店はね、先生の好きなスケスケのやつも売ってるから！"
"2005005-19" = "[s3] \"好きじゃないってば！\"\n[s4] \"あと、需要あるの！？\""
"2005005-20-リツ" = "あはは！じゃあこっちから回ろっか！"
"2005005-21-リツ" = "お買い得な服、見つけに行こ～！"
"2005005-22" = "（そうして、リツと服屋を見て回った）"
"2005005-23" = "（時々、リツは尖ったデザインの服を勧めてきたけど……）"
"2005005-24" = "（なんだかんだで、ちょうど良い服が手に入った）"
"2005005-25" = "ブラックマーケット・入り口"
"2005005-26-リツ" = "いや～、いい買い物ができたよ！"
"2005005-27-リツ" = "先生はどう？"
"2005005-28" = "[s] \"ふっ……私にもファッション革命が来たかも。\""
"2005005-29-リツ" = "へへっ、誘ってよかった！"
"2005005-30-リツ" = "ね、先生、ちょっとここで待っててくれる？"
"2005005-31" = "[s] \"もしかして、「輸入」？\""
"2005005-32-リツ" = "先生はなんでも分かっちゃうんだなぁ～"
"2005005-33-リツ" = "ちょっと行ってくるね！"
"2005005-34" = "[ns] （……待ってる間、ぶらぶらしてようかな）"
"2005005-35" = "[ns] （こっちの路地は……雰囲気が違うな……）"
"2005005-36-怪しい洋服屋の店員" = "らっしゃい！お客さん、なんかお探し？"
"2005005-37" = "[s] \"えっと、アウターを……。\""
"2005005-38-怪しい洋服屋の店員" = "ドンピシャのタイミング！#nちょうど今、入荷仕立てのやつがあってさ！"
"2005005-39-怪しい洋服屋の店員" = "これ、どう？一目ぼれしたでしょ？着てみたいよね？#nはい、試着はこちら～"
"2005005-40" = "[s] \"あの……もう少し見てから……。\""
"2005005-41-怪しい洋服屋の店員" = "いやいや、ほかを見たって時間の無駄だよ！#nこれがピッタリ！オレたちの仲だろ？オレのこと、信じるよな？"
"2005005-42" = "[s] \"……初対面です。\""
"2005005-43-怪しい洋服屋の店員" = "ま～着てみろって！"
"2005005-44-怪しい洋服屋の店員" = "くぅ～！やっぱりオレの目に狂いはない！もはやオーダーメイド！#nお客さんのために生まれた服だよ、これは！"
"2005005-45" = "[s] \"……袖が長すぎますけど。\""
"2005005-46-怪しい洋服屋の店員" = "心配ご無用！あそこの直し屋さんです～ぐ切ってくるよ！#nちょっと待ってな！"
"2005005-47" = "[s] \"いや、まだ買うと決めたわけでは……。\""
"2005005-48-怪しい洋服屋の店員" = "おいおい、いまさら何言ってんだよ！一期一会って言うだろ？#nここで逃したら二度と手に入らないぞ？"
"2005005-49-怪しい洋服屋の店員" = "何してるの？"
"2005005-50-恭しい洋服屋の店員" = "はっ……！あ、姉御！？"
"2005005-51-リツ" = "また押し売り～？"
"2005005-52-リツ" = "そ、そんな滅相もない！#nこ、この方のご希望の服がなく、次回ご案内するとお伝えしていて！"
"2005005-53-リツ" = "そうだったんだ！じゃ、先生はもらってくね～"
"2005005-54-リツ" = "はいっ！気をつけておかえりくださいっ！"
"2005005-55-リツ" = "こっち側はちょっと危ないんだよね～"
"2005005-56" = "[s] \"リツって……姉御って呼ばれてるんだ……。\""
"2005005-57-リツ" = "へへ。"
"2005005-58-リツ" = "ひとりにしちゃってごめんね？#nこれからはボクがちゃ～んとくっついてるから！"
"2005005-59-リツ" = "それなら安心でしょ？"
