[translation]
"2005002-1" = "岩がしゃべった！"
"2005002-2" = "シャーレ・オフィス"
"2005002-3" = "（翌日）"
"2005002-4" = "（約束の時間から30分経っても……）"
"2005002-5" = "（リツが来る気配はなく……）"
"2005002-6" = "[ns] \"電話にも出ない……。\""
"2005002-7" = "（心配で、ソワソワしていると……）"
"2005002-8" = "[ns] \"……リツ？\""
"2005002-9" = "（窓の外にリツの姿があった）"
"2005002-10" = "（庭の岩の前でリツが何かしている……？）"
"2005002-11" = "[ns] \"……何してるんだろう？\""
"2005002-12" = "シャーレ・前庭"
"2005002-13" = "（1階に降りた瞬間、目に入ったのは……）"
"2005002-14" = "（リツが、自分の身体よりも大きな岩をノミとハンマーで削っていた）"
"2005002-15" = "[ns] \"えっと、これは……？\""
"2005002-16-リツ" = "あっ！先生！"
"2005002-17-リツ" = "やっほ～！"
"2005002-18-リツ" = "……あっ、そうだ！#nボク、今日当番だったね！"
"2005002-19" = "[ns1] \"心配したよ、リツ！\"\n[ns2] \"それは彫刻をしてる……の？\""
"2005002-20-リツ" = "うんっ！#nこの岩にお願いされたんだ！"
"2005002-21" = "[s] \"岩がお願い……？\""
"2005002-22-リツ" = "そう！岩の中には、いろんな形をした子が隠れててさ――"
"2005002-23-リツ" = "この岩は「ボクの中にはキレイな子が隠れてるんだよ～」って教えてくれたんだ。"
"2005002-24-リツ" = "だから……。"
"2005002-25-リツ" = "壊してるんだ！"
"2005002-26" = "[s] \"なんで！？\""
"2005002-27-リツ" = "じゃなきゃ、出してあげられないもん。"
"2005002-28-リツ" = "ゴツゴツした岩の中に隠れてる、この子をね。"
"2005002-29" = "[ns3] \"なるほど……！\"\n[ns4] \"そういうことか……！\""
"2005002-30" = "[ns] \"ところで……これ、校則上大丈夫なの？\""
"2005002-31-リツ" = "別に大丈夫じゃないよ？"
"2005002-32-リツ" = "……。"
"2005002-33-リツ" = "ところでね、先生！"
"2005002-34" = "[s] \"誤魔化した！？\""
"2005002-35-リツ" = "肩車してくれる？"
"2005002-36" = "[s] \"……もう乗ってない？\""
"2005002-37-リツ" = "わ、高い！"
"2005002-38-リツ" = "へへ……ボク、ちっちゃいからね。#n上のほうまで手が届かなかったんだ！"
"2005002-39-リツ" = "これで削れるよ！ありがとね、先生！"
"2005002-40" = "（そうしてリツは肩に乗ったまま岩を削り続け……）"
"2005002-41" = "（……その下には大量の岩粉が降ってきた）"
"2005002-42-リツ" = "ふぅ、あともう少し！"
"2005002-43-リツ" = "最後はこのへんを整えて……あれ？"
"2005002-44-リツ" = "ええっ！先生大丈夫？#n顔が粉だらけ！"
"2005002-45" = "[s] \"ら、らいじょうぶ……ぷはっ！\""
"2005002-46-リツ" = "ど、どうしよう？"
"2005002-47-リツ" = "そうだ！逆向きで肩車してもらえば――"
"2005002-48-リツ" = "先生の顔に粉がつかないよね！"
"2005002-49" = "[s] \"それだとリツのお腹が私の顔に……やめとこう！\""
"2005002-50-リツ" = "そう？いいかなーって思ったんだけど。"
"2005002-51-リツ" = "じゃ、続けるね！"
"2005002-52" = "（彫刻は順調に進み……）"
"2005002-53-リツ" = "よし！完成！"
"2005002-54" = "[s] \"お疲れ様、リツ。\""
"2005002-55-リツ" = "ありがとうございます、先生！へへっ。"
"2005002-56" = "[s5] \"この彫像は……。\"\n[s6] \"なんて言えばいいんだろう……。\""
"2005002-57-リツ" = "先生、感想に困ってる？"
"2005002-58-リツ" = "それなら大丈夫！"
"2005002-59" = "[s] \"えっ？\""
"2005002-60-リツ" = "初めて見た作品の感想をその場で言うって……。"
"2005002-61-リツ" = "難しくない？"
"2005002-62-リツ" = "どんな角度でその作品を解釈すればいいのか分からないし……#nその言葉が本当に適切なのかも判断つかないし。"
"2005002-63-リツ" = "作者の前だと、気をつかっちゃうこともあるよね。"
"2005002-64-リツ" = "だからね、これからこの彫刻のことで、#nふわーって言葉が浮かんでくることがあったら……。"
"2005002-65-リツ" = "そのときは聞かせてよ！"
"2005002-66" = "[s] \"わかったよ。ありがとう、リツ。\""
"2005002-67-リツ" = "これどうしよっか？先生の部屋まで持ってく？"
"2005002-68" = "[s] \"それもいいけど……。\""
"2005002-69" = "[ns7] \"たくさんの人に見てもらえるように――\"\n[ns8] \"ここに置いておきたいかな。\""
"2005002-70-リツ" = "あ……。"
"2005002-71-リツ" = "……ありがと、なんだか胸がいっぱい！"
"2005002-72-リツ" = "先生のおかげで、とってもいい日になったよ！"
"2005002-73" = "[s9] \"今日を締めくくるのは、まだ早いかな。\"\n[s10] \"これから当番の仕事が待ってるんだし……！\""
"2005002-74-リツ" = "……えっ。"
"2005002-75" = "[s] \"いざ、お仕事の世界へ！\""
"2005002-76-リツ" = "ふえん……！"
"2005002-77" = "（その後、当番のリツと仕事を片付けていき、#n夕方頃には終えることができた）"
