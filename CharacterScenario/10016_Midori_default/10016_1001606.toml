[translation]
"1001606-1" = "大切な思い出です、先生"
"1001606-2-ミドリ" = "わあ、すごいです！こんなにも色んなゲームが一か所に集まってるなんて！"
"1001606-3" = "[s] \"最近のゲームは派手だし、種類も多いね。\""
"1001606-4-ミドリ" = "そうですね、やったことのないゲームがこんなにたくさん……。"
"1001606-5-ミドリ" = "ん？"
"1001606-6-ミドリ" = "先生、あれ見てください。ゲーム機の中にぬいぐるみが……。"
"1001606-7-ミドリ" = "あっ、このぬいぐるみ……"
"1001606-8-ミドリ" = "レトロゲーム『フルゼリー』に出てくる、ゼリーズです！"
"1001606-9-ミドリ" = "この中にいるということは……まさか、閉じ込められているんですか？"
"1001606-10" = "[s] \"その発想はなかなか斬新。\""
"1001606-11-ミドリ" = "あっ、待ってください……私、真実に気づいてしまったかもしれません。"
"1001606-12-ミドリ" = "ゲーム開発部に代々受け継がれる話の中に、こういうものがありました。"
"1001606-13-ミドリ" = "世の中にはUFOの操縦士になって、罪のない人形たちを大量に連れ去るゲームがある、という……。"
"1001606-14-ミドリ" = "まさか、これがその……？"
"1001606-15" = "[s1] \"なかなかハードな見方だね。\"\n[s2] \"間違ってはいないけど……。\""
"1001606-16-ミドリ" = "わあ……すごいです。"
"1001606-17-ミドリ" = "わあ……すごいです。"
"1001606-18" = "[s] \"見てるだけじゃなくて、ミドリもやってみたら？\""
"1001606-19-ミドリ" = "え？私が、ですか？"
"1001606-20-ミドリ" = "で、できますかね？"
"1001606-21" = "[s] \"大丈夫。それに、挑戦してみたらきっと勉強になるよ。\""
"1001606-22-ミドリ" = "そ、それでは一度だけ……。"
"1001606-23" = "[wa:1000]― 今まで[wa:1000]ドット絵のゲーム以外には[wa:1800]あまり興味がなかったんですけど……"
"1001606-24" = "― ゲームセンターには[wa:1500]こういったゲームもあるんですね。"
"1001606-25" = "[wa:500]― 視野が広がった気がします、[wa:2500]勉強になりました。"
"1001606-26" = "[wa:1000]― ……ありがとうございます、[wa:1500]先生、"
"1001606-27" = "― ここに連れて来てくださって。"
"1001606-28" = "― ……そのお陰で[wa:500]私、[wa:1500]今、[wa:800]すごく楽しいです。"
"1001606-29" = "[wa:2000]― あ、[wa:500]そうだ……"
"1001606-30" = "― 今日のこと、[wa:1000]お姉ちゃん[wa:500]には……[wa:1500]内緒ですよ？"
"1001606-31" = "[wa:200]― 絶対、[wa:1000]絶対ですからね！"
"1001606-32-ミドリ" = "あっ、せ、先生！取れちゃいました！"
"1001606-33-ミドリ" = "こ、これ、どうしましょう？"
"1001606-34" = "[s3] \"ミドリが取ったんだから、ミドリのものだよ。\"\n[s4] \"勝者の戦利品だね。\""
"1001606-35-ミドリ" = "あ……。"
"1001606-36-ミドリ" = "あ……。"
"1001606-37-ミドリ" = "ぬいぐるみ……先生との、思い出の……。"
"1001606-38-ミドリ" = "……きっと、これからゲームセンターに来るたび、それに、このぬいぐるみを見るたびに。先生のことを思い浮かべると思います。"
"1001606-39-ミドリ" = "ありがとうございます。先生。"
"1001606-40-ミドリ" = "このぬいぐるみ、大事にしますね。"
