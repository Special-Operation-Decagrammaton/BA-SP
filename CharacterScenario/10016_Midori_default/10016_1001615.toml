[translation]
"1001615-1" = "思い出は続くものですよ、先生"
"1001615-2" = "（そうしてミドリと一緒に……）"
"1001615-3" = "（モンスター狩りに励んでいた、そのとき……！）"
"1001615-4-ミドリ" = "あっ、スタンが入りましたね！今なら……！"
"1001615-5-ミドリ" = "えっ……！？"
"1001615-6" = "[ns] \"ミ、ミドリのキャラが固まってる！\""
"1001615-7-ミドリ" = "で、電源が落ちちゃいました……。"
"1001615-8" = "（色んな方法を試してみるもゲーム機は再起動せず。修理窓口へ持ち込むことになった……）"
"1001615-9-ミドリ" = "うーん……一世代前の機種ですか……。"
"1001615-10-ミドリ" = "このパーツは生産終了してますし、こっちも新しいのに取りかえないとですが……#n仮に換えたとして、正常に動作する保証は……。"
"1001615-11-ミドリ" = "難しい……ですか？"
"1001615-12-ミドリ" = "一旦、本社に在庫を確認しますね。少々お待ちください。"
"1001615-13-ミドリ" = "はい……。"
"1001615-14" = "[ns] \"直るといいね……。\""
"1001615-15-ミドリ" = "あとちょっとで倒せそうだったんですが……。"
"1001615-16-ミドリ" = "ふぅ……ひさびさに先生と二人きりだったのに……。"
"1001615-17-ミドリ" = "お待たせしました。申し訳ありません……本社にも、こちらのパーツの在庫がないようでして。"
"1001615-18-ミドリ" = "ええっ！そんな……。"
"1001615-19-ミドリ" = "お力になれず――"
"1001615-20-ミドリ" = "あ、あの！"
"1001615-21-ミドリ" = "どうしても、ダメですか……？た、例えば、中古ショップからパーツを取り寄せるとか……！"
"1001615-22-ミドリ" = "こちらはメーカー直営の窓口ですので、そういった規定外のご対応は……。"
"1001615-23-ミドリ" = "データが破損するリスクもありますし……。"
"1001615-24-ミドリ" = "デ、データが消えちゃう！？そんなの絶対ダメです！"
"1001615-25-ミドリ" = "でしたら、こちらはいかがでしょうか。"
"1001615-26-ミドリ" = "ちょうど、データ移行サービスが無料になるキャンペーンを実施しておりまして。#n最新機種をお買い上げいただいた方が対象なのですが……。"
"1001615-27-ミドリ" = "……。"
"1001615-28" = "[ns] \"……。\""
"1001615-29-ミドリ" = "それしか、ないんですよね……？"
"1001615-30-ミドリ" = "分かりました……。"
"1001615-31-ミドリ" = "領収書は、ミレニアムサイエンススクールのゲーム開発部宛てで。"
"1001615-32-ミドリ" = "先生、大丈夫……です！これは正当な部費の請求ですから！セミナーも分かってくれます。#nきっと……多分……！"
"1001615-33-ミドリ" = "それではデータ移行完了後にお呼びしますので、少々お待ちください。"
"1001615-34-ミドリ" = "はい……よろしくお願いします。"
"1001615-35" = "[ns] \"……ゲーム機、モモイとお揃いだったりする？\""
"1001615-36-ミドリ" = "えっ！ど、どうしてそれを！？"
"1001615-37" = "[s] \"なんとなくそう思って。\""
"1001615-38-ミドリ" = "顔に出ていましたか……。"
"1001615-39-ミドリ" = "そうです。#nあれは、前にお姉ちゃんと一緒に買ったもので……。"
"1001615-40-ミドリ" = "お姉ちゃんはゲームをやりすぎて先に壊しちゃったけど……私はずっと使い続けてて……。"
"1001615-41-ミドリ" = "でも、ついに私のも……。"
"1001615-42-ミドリ" = "そんな顔しないでください先生。いつかは壊れるものですし……。"
"1001615-43-ミドリ" = "いや、やっぱりちょっと悔しいですけど……。"
"1001615-44-ミドリ" = "あのゲーム機は、お姉ちゃんが頑張って節約したお金で買ってくれたんです。"
"1001615-45-ミドリ" = "私を――堕落させるために。"
"1001615-46" = "[ns] \"だ、堕落！？\""
"1001615-47-ミドリ" = "そうですよ！"
"1001615-48-ミドリ" = "もともと、私はそこまでゲーム好きじゃなかったんです……。"
"1001615-49-ミドリ" = "い、今では堕落させられましたけど、それでもプレイ時間はお姉ちゃんより短いし……！"
"1001615-50-ミドリ" = "対戦の勝率も、私のほうがちょっと上だし、実質私の勝利です！"
"1001615-51" = "[s] \"そ、そうだったんだ……。\""
"1001615-52-ミドリ" = "でも……やっぱりお姉ちゃんはすごいです。いつも前向きだし……。"
"1001615-53-ミドリ" = "面白そうなことにはすぐ飛び込んで、新しいものを見つけては、それを自分の物語に取り入れる……。"
"1001615-54-ミドリ" = "クリエイターとして、尊敬しています……。"
"1001615-55-ミドリ" = "毎回トラブルに私を巻き込むのは、勘弁してほしいんですけどね。"
"1001615-56-ミドリ" = "……それでも、ゲームの世界が眩しすぎて、距離を取ろうとしてた私より、ずっと凄いです。"
"1001615-57" = "[s] \"ゲームの世界が眩しい？\""
"1001615-58-ミドリ" = "はい……。"
"1001615-59-ミドリ" = "ゲームに触れていく中で……。"
"1001615-60-ミドリ" = "すごく綺麗なイラストを見たとき――"
"1001615-61-ミドリ" = "つい、比べてしまうんです。#nプロの作品と、自分の絵を。"
"1001615-62-ミドリ" = "あのときは今より下手だったから、なおさら……。"
"1001615-63" = "[s1] \"そうだったんだ。\"\n[s2] \"迷っちゃうときも、あるよね。\""
"1001615-64-ミドリ" = "はい……。"
"1001615-65-ミドリ" = "他人からの評価を気にしすぎて、何を描きたいのか分からなくなった時期もありました。"
"1001615-66-ミドリ" = "……でも、お姉ちゃんは違います。いつだって自分を貫くんです。"
"1001615-67-ミドリ" = "好きなものに「好き」と言えて、嫌なことがあってもすぐ忘れちゃう。"
"1001615-68-ミドリ" = "この世界は素敵なものであふれてるから、それに触れるだけで精一杯だよって……。"
"1001615-69-ミドリ" = "ご、ごめんなさい！つい、昔話を……。"
"1001615-70" = "[s] \"ううん。いい話が聞けたよ。\""
"1001615-71-ミドリ" = "そ、そうですか？"
"1001615-72-ミドリ" = "それは、よかったです……。"
"1001615-73-カスタマースタッフ" = "お待たせしました！データの移行が完了しました。#nこちらが……お持ちいただいた端末と、購入された最新機種になります。"
"1001615-74-ミドリ" = "ありがとうございます。"
"1001615-75-ミドリ" = "……前のゲーム機、どうしようかな。"
"1001615-76" = "[s3] \"スタンドとショーケースを買って飾ろっか！\"\n[s4] \"記念品だし、大事に保管しなきゃね！\""
"1001615-77-ミドリ" = "えっ？そ、そこまでは……。"
"1001615-78-ミドリ" = "思い出の品……。"
"1001615-79-ミドリ" = "それはそうですけど……。"
"1001615-80-ミドリ" = "用意する……？スタンドとケースをですか！？"
"1001615-81-ミドリ" = "そそそ、そこまでお世話になるわけには……！"
"1001615-82-ミドリ" = "余ってるから譲る……？"
"1001615-83-ミドリ" = "……。"
"1001615-84-ミドリ" = "どうして余ってるんですか！？"
"1001615-85" = "[s] \"大人が積んでるのは、ゲームだけじゃないんだよ！\""
"1001615-86-ミドリ" = "そ、そんな悲しいことって……！"
"1001615-87-ミドリ" = "……。"
"1001615-88-ミドリ" = "先生、実は……。"
"1001615-89-ミドリ" = "お姉ちゃんも、前に壊したゲーム機をそうやって飾っていたんです。"
"1001615-90-ミドリ" = "私もゲーム機の寿命が来たらやろうと思ってたんですが……。"
"1001615-91-ミドリ" = "……お姉ちゃんのマネをしてるみたいで、ちょっと悔しいですね。"
"1001615-92" = "[s] \"でも、ミドリにはミドリの眩しさがあるから。\""
"1001615-93-ミドリ" = "ありがとうございます……。"
"1001615-94-ミドリ" = "……つい、お姉ちゃんに対抗しちゃうんですよね。"
"1001615-95-ミドリ" = "姉妹って、ずっとケンカする[ruby=さだめ]運命[/ruby]なのかな……。"
"1001615-96" = "[s] \"……まぁ、ほどほどにね！\""
"1001615-97-ミドリ" = "安心してください！"
"1001615-98-ミドリ" = "対戦では私のほうが強いですから！"
"1001615-99" = "（ミドリと一緒に戻って、モンスター狩りを再開した）"
"1001615-100" = "（そして……無事狩猟は成功した！）"
