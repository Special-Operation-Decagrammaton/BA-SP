[translation]
"1001603-1" = "展示会ですよ、先生"
"1001603-2" = "ミレニアム・ゲームアート展示会場入り口"
"1001603-3-ミドリ" = "朝早く起きて作ったサンドイッチ、OK。"
"1001603-4-ミドリ" = "先生と一緒に飲むための烏龍茶と、おやつも入れたし……。"
"1001603-5-ミドリ" = "メモ用の手帳とスケッチブックも入れた……忘れ物、無いよね？"
"1001603-6-ミドリ" = "ダンジョンの攻略には、事前準備が必須。"
"1001603-7-ミドリ" = "すーっ……ふぅー……よしっ。"
"1001603-8-ミドリ" = "これはチャンス。この展示会で、先生に私の大人っぽいところを……"
"1001603-9" = "[s] \"一人で何を呟いてるの？\""
"1001603-10-ミドリ" = "うわああっ！？"
"1001603-11-ミドリ" = "び、びっくりしました……！先生、いつからいたんですか！？"
"1001603-12" = "[s1] \"ミドリが荷物とにらめっこしてた辺りから。\"\n[s2] \"ダンジョン突入前の勇者みたいに深呼吸してたとこから。\""
"1001603-13-ミドリ" = "ほぼ最初からじゃないですか！"
"1001603-14-ミドリ" = "ほぼ最初からじゃないですか！"
"1001603-15" = "[s] \"今日の展示会、相当楽しみだったんだね。\""
"1001603-16-ミドリ" = "そ、それは……年に1度だけの展示会ですから。"
"1001603-17-ミドリ" = "この機会にたくさん見て回って、資料集めもたくさんしたいですし。"
"1001603-18-ミドリ" = "（も、もちろん、楽しみだったのはそれ以外にも……）"
"1001603-19-ミドリ" = "……さあ、こうしてはいられません！早く行きましょう、先生！"
"1001603-20" = "ミレニアム・ゲームアート展示会場1F"
"1001603-21-ミドリ" = "まず1階は最新のゲームブース、という感じで、フロアごとにジャンルで分かれてるみたいですね。"
"1001603-22-ミドリ" = "あ、レトロゲームの展示は3階みたいです。"
"1001603-23" = "[s] \"すごい人数だね。\""
"1001603-24-ミドリ" = "そうですね、こういうイベントもまた、ゲームの魅力ですから。"
"1001603-25-ミドリ" = "みんなが違う場所で、違う時間に、それぞれ違うジャンルのゲームを楽しんで……"
"1001603-26-ミドリ" = "その後にこうやってみんなで集まって、思い出を分かち合ったりするんです。"
"1001603-27-ミドリ" = "あ、こうしてる場合ではありませんね、行きましょう。きっと先生も圧倒されるような、魅力的なアートがたくさんあるはずですから……！"
"1001603-28-ミドリ" = "（先生と二人っきりでここに来るっていうミッションはまず成功、次は……）"
"1001603-29-ミドリ" = "結構歩きましたね、先生。喉、乾いていませんか？"
"1001603-30-ミドリ" = "ちょうどここに、家から持ってきた烏龍茶が……"
"1001603-31-ミドリ" = "（上手いタイミングで気を利かせることで、先生にアプローチを……！）"
"1001603-32" = "[s] \"ミドリ、あれ見て。\""
"1001603-33-ミドリ" = "えっ、あれって……？"
"1001603-34-ミドリ" = "あっ……！あの、まるで生命の存在を許さないような、荒涼とした空気感が伝わってくる砂漠のイラスト……！"
"1001603-35-ミドリ" = "もしかして……！"
"1001603-36-ミドリ" = "やっぱり！"
"1001603-37-ミドリ" = "レトロゲームの中でも名作と呼ばれるラン&ガンシューティングゲーム……！"
"1001603-38-ミドリ" = "『メタルバレット2』の砂漠マップのイラストです！すごい！"
"1001603-39-ミドリ" = "あっ、あっちのイラストも！"
"1001603-40-ミドリ" = "『モラルハザード』シリーズでも有名な、ゾンビが集まる「アライグマシティ」のアートワークまで……！"
"1001603-41-ミドリ" = "あれもこれも全て、レトロゲームの中でも、ものすごい名作ばかりです！"
"1001603-42" = "[ns3] \"ミドリ、落ち着いて。\"\n[ns4] \"ミドリ、口が開きっぱなしだよ。\""
"1001603-43-ミドリ" = "興奮せずにはいられません！"
"1001603-44-ミドリ" = "興奮せずにはいられません！"
"1001603-45-ミドリ" = "あっ！"
"1001603-46-ミドリ" = "あれはかの有名なレトロゲーム、横スクロールアクション『ウルトラマリンシスターズ』の、ステージ1-1のマップイラスト！"
"1001603-47-ミドリ" = "先生、ご存知ですか？"
"1001603-48-ミドリ" = "『ウルトラマリンシスターズ』に出てくる草むらと雲には、同じドット絵が使われてるんですよ！"
"1001603-49-ミドリ" = "ううぅっ……！すごいです！アイデアがどんどん浮かんできそう……！"
"1001603-50-ミドリ" = "め、メモ帳……！メモ帳はどこだっけ？！今すぐ描きとめておかないと……！"
"1001603-51" = "（その後、しばらくミドリは興奮したまま、すごい勢いで絵を描いていた）"
"1001603-52" = "（ゲームアート展示会が終わった後）"
"1001603-53-ミドリ" = "ごめんなさい……私、つい興奮してしまって……。"
"1001603-54-ミドリ" = "先生、すみません。私一人だけ楽しくなっちゃって、好き勝手に先生を連れ回してしまいました……。"
"1001603-55-ミドリ" = "（子供みたいに興奮しちゃった……先生に私の大人っぽいところをアピールしようっていう計画が、全部水の泡に……）"
"1001603-56" = "[s5] \"ううん、興味深いものがたくさんあって、面白かった。\"\n[s6] \"ミドリは本当に、レトロゲームが好きなんだね。\""
"1001603-57-ミドリ" = "あ、はい、そうですね。実は私、最初の頃はレトロゲームに対して「何でみんな、こんな古いゲームをやるんだろう」って思っていたんですが……"
"1001603-58-ミドリ" = "あ、はい、そうですね。実は私、最初の頃はレトロゲームに対して「何でみんな、こんな古いゲームをやるんだろう」って思っていたんですが……"
"1001603-59-ミドリ" = "ゲーム開発部に入って、"
"1001603-60-ミドリ" = "ひとつひとつ楽しくやっていくうちに興味を惹かれて、だんだん好きになりました。"
"1001603-61-ミドリ" = "中には、今でも理解し難いルールのゲームもありますが……"
"1001603-62-ミドリ" = "……そもそも、あれは氷を割りながら協力して氷山を登るゲームですよね！？"
"1001603-63-ミドリ" = "なんで画面の外に置いていかれたら死んじゃうんですか！どうして待ってくれないんですか！？"
"1001603-64" = "[s] \"今日は楽しそうなミドリを何度も見られて、私も楽しい。\""
"1001603-65-ミドリ" = "あぅっ……。"
"1001603-66-ミドリ" = "せ、先生は、いつもそうやって……。"
"1001603-67-ミドリ" = "……ですが、そうですね。はい。今日は楽しかったです。"
"1001603-68-ミドリ" = "ぜひまたこうやって、一緒に遊びに来ましょう。先生。"
