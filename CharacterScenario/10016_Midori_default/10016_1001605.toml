[translation]
"1001605-1" = "初回限定盤ですよ、先生"
"1001605-2" = "ミレニアム・電気街「春葉原」"
"1001605-3" = "（事前にミドリと約束した場所に向かうと、そこは身動きが取れないほど大勢の人でごった返していた）"
"1001605-4" = "[ns1] \"わぁー……すごい人の数。\"\n[ns2] \"ゲームを愛する人がこんなにもたくさん……。\""
"1001605-5-ミドリ" = "先生、気を付けてください！ボーっとしてたら迷子になってしまいますよ！"
"1001605-6-ミドリ" = "先生、気を付けてください！ボーっとしてたら迷子になってしまいますよ！"
"1001605-7" = "[s3] \"本当に迷子になりそうなくらいだね……。\"\n[s4] \"ゲーム発売に合わせて、イベントでもやってるの？\""
"1001605-8-ミドリ" = "今日発売されるゲームは、ただの新作ではありません。"
"1001605-9-ミドリ" = "今日発売されるゲームは、ただの新作ではありません。"
"1001605-10-ミドリ" = "なんと、十数年も前に出た伝説的な名作、当時の評論サイトでも審査員全員が満点を付けたことで有名なゲーム……"
"1001605-11-ミドリ" = "あの『ゼルナの伝説』の新作なんですから！"
"1001605-12-ミドリ" = "数多くのゲーマーはもちろん、コレクターの人たちなど、多くの人が今回の初回限定版特典を狙っています。"
"1001605-13-ミドリ" = "私たちは今、その獲物を我先に勝ち取らんとする狩人……。"
"1001605-14-ミドリ" = "いえ、戦士となり、この戦いに臨まなくてはいけません！場合によっては発砲も許可します！"
"1001605-15" = "[s] \"ゲームを、買いに来たんだよね……？\""
"1001605-16-ミドリ" = "ゲームの発売開始時刻は、今から1時間後。"
"1001605-17-ミドリ" = "物理的に訪問できるお店の数が限られる以上、どんなルートでお店を回るか、戦略的に判断する必要があります。"
"1001605-18" = "[s] \"ミドリがいつも以上に頼もしい……。\""
"1001605-19-ミドリ" = "もちろんです、今日という今日を待ちわびていたんですから！"
"1001605-20-ミドリ" = "さあ、こうしている場合ではありません。先生、クエストを始めましょう！"
"1001605-21-ミドリ" = "王道的観点から様々のルートを考慮した結果、まず最初に選んだのはここ、大型家電量販店です。"
"1001605-22-ミドリ" = "一番規模が大きいので、数も一番多く入荷されるはず。ここで手に入れられればベスト……！"
"1001605-23" = "[ns] \"あっ、でもミドリ、これを見て。\""
"1001605-24-ミドリ" = "品切れの、お知らせ……？"
"1001605-25-ミドリ" = "「本日入荷予定の『ゼルナの伝説』の新作はすべて売り切れました」？"
"1001605-26-ミドリ" = "フ、フ、フラゲ！？"
"1001605-27-ミドリ" = "発売日前に全部売り切れですか！？"
"1001605-28" = "[s5] \"みんなの執念が凄い……。\"\n[s6] \"開場前に完売……。\""
"1001605-29-ミドリ" = "こ、これは通報ものですよ！……いえ、それより今は、ここに無いならすぐにでも他のところに探しに行かないとです！"
"1001605-30-ミドリ" = "こ、これは通報ものですよ！……いえ、それより今は、ここに無いならすぐにでも他のところに探しに行かないとです！"
"1001605-31-ミドリ" = "先生、走りましょう！"
"1001605-32-ミドリ" = "はあ、はあ……見つからない……。"
"1001605-33" = "[s] \"もしかしてこれ、もうどこにも無いんじゃ……。\""
"1001605-34-ミドリ" = "いえ、まだです、まだ分かりません！"
"1001605-35-ミドリ" = "今日のこの日をずっと待っていたんです。このまま、諦めるわけにはいきません。"
"1001605-36-ミドリ" = "最後に、まだ一か所……！"
"1001605-37-ミドリ" = "ここが最後です、ここにもなかったら……。"
"1001605-38-ミドリ" = "あ……"
"1001605-39-ミドリ" = "せ、先生！ありました、新作『ゼルナの伝説』の初回限定盤！"
"1001605-40" = "[s7] \"良かった……！\"\n[s8] \"何とか無事に……。\""
"1001605-41-女の子" = "あっ、見つけた！『ゼルナの伝説』最後の一つ！"
"1001605-42-女の子" = "あっ、見つけた！『ゼルナの伝説』最後の一つ！"
"1001605-43-ミドリ" = "あっ……。"
"1001605-44" = "[s] \"ミドリ……。\""
"1001605-45-ミドリ" = "……。"
"1001605-46-女の子" = "店員さん！これください！"
"1001605-47" = "[s9] \"……大丈夫？\"\n[s10] \"ミドリも一日中探し回ったのに……。\""
"1001605-48-ミドリ" = "はい……私も絶対やりたいとは思っていましたが……。"
"1001605-49-ミドリ" = "はい……私も絶対やりたいとは思っていましたが……。"
"1001605-50-ミドリ" = "あの笑顔に、水を差すことなんてできません。ゲームというのは、楽しくプレイしてもらうべきものですから。"
"1001605-51-ミドリ" = "だから、私は大丈夫です、先生。"
"1001605-52-ミドリ" = "（なんて、大人なふりをしてみたけど……やっぱりやりたかったぁっ！うわあぁん……！）"
"1001605-53" = "（次の日、プレゼントを持ってゲーム開発部の部室を訪れた）"
"1001605-54-ミドリ" = "あれ？先生、どうしたんですか？"
"1001605-55" = "[s] \"ミドリ、これプレゼント。\""
"1001605-56-ミドリ" = "これは……。"
"1001605-57-ミドリ" = "『ゼルナの伝説』、初回限定盤……！"
"1001605-58-ミドリ" = "ど、どうしてこれを！？"
"1001605-59" = "[s11] \"たまたまね。\"\n[s12] \"あちこち探し回ってみたら、見つかったから。\""
"1001605-60" = "[s] \"ルール内での徹夜は大人の特権、ってことで。\""
"1001605-61-ミドリ" = "これが、徹夜のできる大人……！"
"1001605-62-ミドリ" = "……先生、私のために……。"
"1001605-63" = "[s] \"ミドリ？\""
"1001605-64-ミドリ" = "い、いえ、なんでもありません、先生。"
"1001605-65-ミドリ" = "本当に嬉しいです……プレゼント、ありがとうございます！先生！"
