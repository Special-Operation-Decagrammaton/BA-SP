[translation]
"2005106-1" = "偉いね、レイサ"
"2005106-2-レイサ" = "先生、ここです！"
"2005106-3" = "[s] \"いらっしゃい、レイサ！\""
"2005106-4-レイサ" = "ふっふっふっ……「[ruby=うざわ]宇沢[/ruby]レイサ」……。"
"2005106-5-レイサ" = "たしかに、そう名乗っていた頃もありましたね……。"
"2005106-6" = "[s] \"えっ？\""
"2005106-7-レイサ" = "今の私は……「テルミットピンク」！です！"
"2005106-8" = "[s] \"ついに……覚醒したのか！？\""
"2005106-9-レイサ" = "わっはっはっは！"
"2005106-10-レイサ" = "……くぅ。"
"2005106-11-レイサ" = "二度も服に閉じ込められるなんて……。"
"2005106-12-レイサ" = "自分に呆れました……。"
"2005106-13" = "[s] \"せっかくだし、魔法少女を楽しもうよ！\""
"2005106-14-レイサ" = "たしかに、好きな服を着られるのは、嬉しいです！"
"2005106-15-レイサ" = "でも、もうパトロールの時間なんですよ！"
"2005106-16-レイサ" = "出かける前の、ちょっとした気分転換のつもりが……。"
"2005106-17-レイサ" = "こんなことになるなんて……！"
"2005106-18-レイサ" = "早く着替えて、パトロールに行かなきゃ……。"
"2005106-19-スケバン" = "おいてめぇどうしてくれんだァ？ああん？"
"2005106-20-スケバン" = "いってぇぇ！あー、こりゃ肩外れてんなぁ！"
"2005106-21-市民A" = "そ、そんな！少しぶつかっただけじゃないですか！"
"2005106-22-スケバン" = "ケガさせといてなんだその態度は！？"
"2005106-23-スケバン" = "入院費はてめぇの財布からもらってくからな～"
"2005106-24-市民A" = "や、やめてください！"
"2005106-25-レイサ" = "そこまでです！"
"2005106-26-スケバン" = "あん？なんだその服？"
"2005106-27-スケバン" = "お姫様ごっこか？"
"2005106-28-市民A" = "それとも妖精さんごっこか？"
"2005106-29-市民A" = "今取り込み中なんだよ！あっち行きな！"
"2005106-30-スケバン" = "うああっ！か、肩がぁ！！"
"2005106-31-スケバン" = "本当に折れたかもしれねぇ！！"
"2005106-32-レイサ" = "今すぐ謝ってください！"
"2005106-33-市民A" = "ぐ、ぐうぅ……。#nご、ごめんなさい！当たり屋でごめんなさい！"
"2005106-34-市民A" = "あ、ええと……は、はい……。"
"2005106-35-レイサ" = "もう二つ、謝ってください！#nお姫様とか妖精さんって言ったことも！"
"2005106-36-スケバン" = "そ、そっちも！？"
"2005106-37-市民B" = "ああ……！うちのふわ助が！"
"2005106-38-市民B" = "うちの可愛いふわ助が、木の上に……！"
"2005106-39-レイサ" = "なるほど！"
"2005106-40-レイサ" = "今度は木から降りられなくなった猫ちゃんですね！"
"2005106-41-レイサ" = "出動です！"
"2005106-42-レイサ" = "よいしょ！"
"2005106-43-レイサ" = "猫ちゃんじゃなくて、ドローンが枝に引っかかってました。"
"2005106-44-レイサ" = "ああ、ふわ助！怖かったよな……！"
"2005106-45-市民B" = "ふわ助を助けてくださり、ありがとうございます！"
"2005106-46-レイサ" = "？？？"
"2005106-47-市民C" = "誰か！助けてください！"
"2005106-48-レイサ" = "参ります！"
"2005106-49-レイサ" = "今日は立て続けに事件が起きましたね。"
"2005106-50-レイサ" = "着替える暇もありませんでした。"
"2005106-51" = "[s] \"やっと落ち着いたね、お疲れ様。\""
"2005106-52-レイサ" = "ふふ、私は自警団のエースですから！"
"2005106-53-レイサ" = "では、そろそろ帰り――"
"2005106-54-子供A" = "うわぁ～ん！私の凧が～！"
"2005106-55-子供A" = "川に落ちちゃう～！"
"2005106-56-子供A" = "工作の宿題で頑張ってつくったのに～！うわぁ～ん！"
"2005106-57-レイサ" = "！！"
"2005106-58-レイサ" = "あの子の努力の結晶を守らないと！"
"2005106-59-レイサ" = "いきます！！！！！"
"2005106-60" = "[wa:1950]― [log=레이사 매지컬]セーフッ！[/log]"
"2005106-61" = "― [log=레이사 매지컬]ふふ……[wa:1500]凧の平和は[wa:928]守られました！[/log]"
"2005106-62" = "― [log=레이사 매지컬]水に落ちる寸前に！[wa:1930]こうやって捕まえられたのですから！[/log]"
"2005106-63" = "[ns] \"レイサ、大丈夫？\""
"2005106-64" = "[wa:540]― [log=레이사 매지컬]みんなのためでしたら、[wa:1280]自警団は[wa:720]迷いません！[/log]"
"2005106-65" = "― [log=레이사 매지컬]火の中だろうと、[wa:1270]水の中だろうと！[/log]"
"2005106-66" = "― [log=레이사 매지컬]どこだって[wa:760]飛び込んでみせますから！[wa:1690]にへへ……っ！[/log]"
"2005106-67" = "[ns] \"早くあがって！風邪ひいちゃう！\""
"2005106-68" = "[wa:570]― [log=레이사 매지컬]ヒーローの[wa:630]衣装というのは――[/log]"
"2005106-69" = "― [log=레이사 매지컬]ヒーローとしての[wa:650]仕事をするときにこそ[wa:1800]輝くものっ！[/log]"
"2005106-70" = "― [log=레이사 매지컬]あと、[wa:730]これは洗濯機オッケーなので[wa:1560]大丈夫です！[/log]"
"2005106-71" = "[wa:1736]― [log=레이사 매지컬]それに……[wa:1675]先生に、[wa:400]教わりましたから。[/log]"
"2005106-72" = "― [log=레이사 매지컬]迷わない者こそ――[wa:1780]みんなを守ることができる、[wa:1530]と！[wa:1030]えへへっ！[/log]"
"2005106-73" = "[wa:380]― [log=레이사 매지컬]へへ、[wa:790]え、[wa:290]へえっ……。[/log]"
"2005106-74" = "― [log=레이사 매지컬]へくしょん！！[/log]"
"2005106-75" = "― [log=레이사 매지컬]ううぅ……。[/log]"
"2005106-76" = "（その後、頑張ったレイサをシャーレに連れて戻り……）"
"2005106-77" = "（シャワーを使ってもらい、ゆっくり休ませた）"
