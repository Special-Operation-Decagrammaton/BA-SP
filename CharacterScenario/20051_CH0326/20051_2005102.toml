[translation]
"2005102-1" = "また会ったね、レイサ"
"2005102-2" = "（ある晴れた日、シャーレの前を散歩していたところ……）"
"2005102-3" = "[ns] \"いい天気だなぁ。\""
"2005102-4-レイサ" = "あ、あの……先生……。"
"2005102-5" = "[s] \"うん？\""
"2005102-6-レイサ" = "ううぅ……。"
"2005102-7-レイサ" = "こ、こんにちは、先生……！"
"2005102-8" = "[s1] \"あ、あなたは！！\"\n[s2] \"テルミットピンク！\""
"2005102-9-レイサ" = "じょ、冗談を言ってる場合じゃないんです！"
"2005102-10-レイサ" = "ここに来るまで……色んなことがあったんですから……ふぅ……。"
"2005102-11" = "[s] \"マスコットキャラに契約してよって言われた？\""
"2005102-12-レイサ" = "そ、それならよかったかもしれません……。"
"2005102-13-レイサ" = "この服が、先日お話したコスチュームなんですけど……。"
"2005102-14-レイサ" = "今日届いたので、試しに着てみたんですが……。"
"2005102-15-レイサ" = "ブツッ！っと、ファスナーの持ち手が取れて……！"
"2005102-16-レイサ" = "服に閉じ込められてしまいました……。"
"2005102-17-レイサ" = "自分一人じゃファスナーも見えないし、困ってしまって……。#nとりあえずシャーレに来ました！"
"2005102-18-レイサ" = "助けてください、先生……！"
"2005102-19" = "[s3] \"オフィスの備品で直せると思うよ。\"\n[s4] \"その格好でここまで……大変だったね。\""
"2005102-20-レイサ" = "はは、もう、すごかったんですよ……。"
"2005102-21-レイサ" = "まるで、スーパースターになった気分でした。"
"2005102-22-レイサ" = "バスに乗れば子供たちに写真を撮られ……。"
"2005102-23-レイサ" = "イベント会場の前を通れば、キャストに間違えられ……て……。"
"2005102-24-レイサ" = "これが……スーパー、スター……はは……。"
"2005102-25" = "[s5] \"レイサが疲れ果ててる！\"\n[s6] \"魔法少女、好きじゃなかったの？\""
"2005102-26-レイサ" = "大好きです！！！"
"2005102-27-レイサ" = "この服もサイズピッタリで、色もお気に入りです……が……！"
"2005102-28-レイサ" = "心の準備をする暇もなく、強制変身になってしまったので！！"
"2005102-29-レイサ" = "ロボットが好きでも、#nいきなり乗り込むことになったらビックリしませんか！？"
"2005102-30-レイサ" = "変身を解かせてください……。"
"2005102-31" = "[s7] \"アニメや漫画でしか聞かないセリフだ！\"\n[s8] \"とりあえずオフィスに行こうか。\""
"2005102-32-レイサ" = "ありがとうございます……。"
"2005102-33" = "[ns] \"よし、これで大丈夫。\""
"2005102-34-レイサ" = "「リリース・フォーム」！……なんちゃって！"
"2005102-35-レイサ" = "なんだか本当に魔法少女みたいですね！"
"2005102-36" = "[s] \"元の姿に戻るところを見られるなんて！\""
"2005102-37-レイサ" = "うまくいってよかったです。"
"2005102-38-レイサ" = "先生ならなんとかしてくださると信じていました！"
"2005102-39-レイサ" = "いつも、私の悩みを解決してくれますから！"
"2005102-40" = "[s] \"変身を解く手伝いができてよかったよ！\""
"2005102-41-レイサ" = "あはは！さすが先生！"
"2005102-42-レイサ" = "それでは、この辺で失礼します！"
"2005102-43-レイサ" = "またお会いしましょう！"
"2005102-44" = "[s9] \"待って！その格好で出るの？\"\n[s10] \"背中のファスナー、開きっぱなしだよ。\""
"2005102-45-レイサ" = "げっ、そ、そうでした！"
"2005102-46-レイサ" = "うう、着替えを持ってくればよかったです……！"
"2005102-47-レイサ" = "ううぅ……本当にミスばかりで……。"
"2005102-48" = "[s] \"そ、そんなヘコまないで！\""
"2005102-49" = "（レイサに羽織れそうな上着を貸してあげた）"
"2005102-50" = "（レイサは元気を取り戻し、シャーレを出た）"
