[translation]
"1601406-1" = "イブキとお勉強！"
"1601406-2" = "（イブキから連絡をもらい、万魔殿に向かった）"
"1601406-3-イブキ" = "あっ！先生！来てくれてありがとう！"
"1601406-4-イブキ" = "待ってたよ！"
"1601406-5" = "[s1] \"やりたいことが見つかったの？\"\n[s2] \"好きなことが見つかったの？\""
"1601406-6-イブキ" = "この前、先生といろんなところに行ってから、ずーっと考えてたの。"
"1601406-7-イブキ" = "ぜーんぶ楽しかったから、どれにしようって……でもイブキ、選べなかった。"
"1601406-8-イブキ" = "お巡りさんにもなりたいし、コックさんにもなりたいし、戦車長にもなりたい……"
"1601406-9-イブキ" = "それでね、先生！"
"1601406-10-イブキ" = "考えてたら先生の顔が浮かんだの！"
"1601406-11" = "[s] \"私……？\""
"1601406-12-イブキ" = "うん！先生はイブキの気持ちを分かってくれるでしょ？"
"1601406-13-イブキ" = "シャーレを遊園地にしてくれたり！"
"1601406-14-イブキ" = "イブキのやりたいお仕事、いろいろ見せてくれたよね！"
"1601406-15-イブキ" = "だから……"
"1601406-16-イブキ" = "イブキも、いつか先生になりたいって思ったの！"
"1601406-17" = "[s] \"イブキが、先生に……うん、きっといい先生になると思う。\""
"1601406-18-イブキ" = "えへへ、本当？"
"1601406-19-イブキ" = "それでそれで、先生に見せたいものがあって！"
"1601406-20-イブキ" = "今日は、そのために先生を招待したんだよ！"
"1601406-21" = "[s] \"何を見せてくれるの？\""
"1601406-22-イブキ" = "こっちこっち！"
"1601406-23-イブキ" = "イブキの算数教室へようこそ！"
"1601406-24" = "[wa:900]― [log=이부키]今日は[wa:790]イブキが先生だよ！[/log]"
"1601406-25" = "[wa:3000]― [log=이부키]今から……[wa:1390]さんすうの授業をします！[/log]"
"1601406-26" = "[wa:800]― [log=이부키]イブキ、[wa:640]さんすうは[wa:480]自信あるんだ！[/log]"
"1601406-27" = "― [log=이부키]昨日、[wa:260]テストで100点とってね、[/log]"
"1601406-28" = "[wa:1360]― [log=이부키]はなまるもらったの！[/log]"
"1601406-29" = "[ns] \"すごい！さすがイブキ先生！\""
"1601406-30" = "[wa:800]― [log=이부키]えへへっ……[wa:1630]じゃあ、[wa:340]先生に……[/log]"
"1601406-31" = "[wa:1410]― [log=이부키]イブキ先生から[wa:1310]問題です！[/log]"
"1601406-32" = "[wa:200]― [log=이부키]ここに！[wa:530]アイスクリーム2コと、[/log]"
"1601406-33" = "[wa:1290]― [log=이부키]プリン1コがあります。[/log]"
"1601406-34" = "― [log=이부키]全部で[wa:250]何個でしょうか〜？[/log]"
"1601406-35" = "[ns] \"合計で、3コ……？\""
"1601406-36" = "[wa:1200]― [log=이부키]ぶぶー！[wa:580]残念！[/log]"
"1601406-37" = "[wa:1990]― [log=이부키]正[wa:540]解[wa:310]は～……[/log]"
"1601406-38" = "[ns] \"正解は……？\""
"1601406-39" = "[wa:900]― [log=이부키]「おやつが3コもあったら[wa:2270]すっごく幸せ～」[wa:2610]だよ！[/log]"
"1601406-40" = "― [log=이부키]あっ！[wa:820]食べたあとは、[/log]"
"1601406-41" = "[wa:1230]― [log=이부키]歯みがきを忘れないでね！[/log]"
"1601406-42" = "― [log=이부키]イブキはね、[wa:1170]毎日3回、[/log]"
"1601406-43" = "[wa:1190]― [log=이부키]ちゃんと[wa:200]歯みがきをしてるんだよ！[/log]"
"1601406-44-イブキ" = "イブキの授業、どうだった？"
"1601406-45" = "[s] \"楽しい授業だったよ！\""
"1601406-46-イブキ" = "えへへ、本当に～？"
"1601406-47-イブキ" = "イブキ、いつかね……"
"1601406-48-イブキ" = "先生みたいな大人になりたいな！"
"1601406-49" = "[s] \"イブキなら、きっとなれるよ。\""
"1601406-50-イブキ" = "えへへっ！"
"1601406-51-イブキ" = "ありがとう！先生！"
"1601406-52-イブキ" = "イブキ、い～っぱい頑張るね！"
"1601406-53" = "（その後もしばらく、小さな教室でイブキ先生の授業を受けた）"
