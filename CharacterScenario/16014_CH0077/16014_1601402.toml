[translation]
"1601402-1" = "イブキと遊ぼう！"
"1601402-2-イブキ" = "失礼しまーす！"
"1601402-3-イブキ" = "先生！こんにちは！遊びにきたよ！"
"1601402-4" = "[s1] \"イブキ！待ってたよ！\"\n[s2] \"久しぶりだね！\""
"1601402-5-イブキ" = "えへへ～"
"1601402-6-イブキ" = "今日はね、マコト先輩にシャーレで遊んできてもいいって言われたの。"
"1601402-7-イブキ" = "だからイブキ、先生とい～っぱい遊びたいと思って！"
"1601402-8" = "[s3] \"……私も遊びたいんだけど、ごめんね。\"\n[s4] \"今ちょうど急ぎの仕事が来ちゃって……\""
"1601402-9-イブキ" = "大丈夫！"
"1601402-10-イブキ" = "イブキが手伝ってあげる！"
"1601402-11" = "[s5] \"それじゃあ、お願いしてもいい？\"\n[s6] \"イブキが手伝ってくれたら、きっとすぐに終わるよ！\""
"1601402-12-イブキ" = "うん！何でも任せて！"
"1601402-13" = "（そうして、イブキと仕事を始めた）"
"1601402-14-イブキ" = "んっと……1枚、2枚……3枚……"
"1601402-15-イブキ" = "……。"
"1601402-16-イブキ" = "……（ちらっ）"
"1601402-17" = "[s] （……？）"
"1601402-18-イブキ" = "よ、4枚、5枚……"
"1601402-19-イブキ" = "…………（ちらっ）"
"1601402-20" = "[s] （イブキの視線は、どうやらゲームに向いているようだった）"
"1601402-21-イブキ" = "（ふりふり）"
"1601402-22-イブキ" = "……だめ。#nちゃんとお手伝いしなきゃ、悪い子になっちゃう……"
"1601402-23" = "[s] \"イブキ。\""
"1601402-24-イブキ" = "うん？先生、どうしたの？"
"1601402-25" = "[s] \"ちょっとだけ、一緒にゲームする？\""
"1601402-26-イブキ" = "う、ううん！イブキ、今日は先生のお手伝いをするの！"
"1601402-27-イブキ" = "ここで遊んじゃったら、いつものイブキと一緒だもん！"
"1601402-28" = "[s] \"でも先生は、イブキとゲームがしたいなぁ。\""
"1601402-29" = "[ns7] \"いつも仕事ばかりで……\"\n[ns8] \"ゲームをする時間があんまり無いから。\""
"1601402-30-イブキ" = "うん……？"
"1601402-31-イブキ" = "じゃあ、時間が無いのにどうしてゲームやおもちゃがたくさんあるの？"
"1601402-32" = "[s9] \"か、買うのが好きというか……\"\n[s10] （そんな純粋な目で見ないで……！）"
"1601402-33-イブキ" = "先生、お腹痛いの？顔色が悪いよ……？"
"1601402-34" = "[s] \"だ、大丈夫だよ。……それで、どうかな？一緒にゲームしてくれる？\""
"1601402-35-イブキ" = "えっと……"
"1601402-36-イブキ" = "い、イブキは……"
"1601402-37" = "[ns] \"遠慮しないで言ってほしいな。\""
"1601402-38" = "[ns] \"先生は素直に言ってもらった方が嬉しいから。\""
"1601402-39-イブキ" = "へへ、そうなんだ。"
"1601402-40-イブキ" = "イブキもね、先生と遊びたかったの！#nゲームも人形遊びも、い～っぱいしたい！"
"1601402-41-イブキ" = "本当に、遊んでもいいの……？"
"1601402-42" = "[s] \"もちろん！じゃあ、まずはゲームから！\""
"1601402-43-イブキ" = "やった～！"
