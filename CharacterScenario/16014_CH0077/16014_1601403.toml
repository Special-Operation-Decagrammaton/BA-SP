[translation]
"1601403-1" = "イブキと楽しいピクニック！"
"1601403-2-イブキ" = "おまたせ、先生！イブキが居ない間も元気にしてた～？"
"1601403-3" = "[s1] \"イブキと会えなくて寂しかった……\"\n[s2] \"首を長くしてイブキを待ってたよ……\""
"1601403-4-イブキ" = "あっ、ダメだよ先生！"
"1601403-5-イブキ" = "一人のときも元気でいられるようにって、マコト先輩が言ってた！"
"1601403-6-イブキ" = "そういうマコト先輩は、いつもイブキにベッタリだけどね～えへへ。"
"1601403-7-イブキ" = "でもイブキが来たから、もう大丈夫！"
"1601403-8" = "[s] \"元気出たよ！はいこれ、プリン買っておいたよ！\""
"1601403-9-イブキ" = "わあ！ありがとう先生！"
"1601403-10" = "[s] \"一緒に食べよう！\""
"1601403-11-イブキ" = "は～い！"
"1601403-12-イブキ" = "いただきま～す！"
"1601403-13-CM" = "日常の疲れを癒してくれる最高のパラダイスが、ここに！"
"1601403-14-CM" = "キヴォトス最大の遊園地！「ユニーク・スタジオ・キヴォトス」へようこそ！"
"1601403-15-CM" = "家族や友人と共に楽しいひと時をお過ごしください！"
"1601403-16-イブキ" = "……。"
"1601403-17" = "[s] \"イブキ、プリンこぼしてるよ？\""
"1601403-18-イブキ" = "……。"
"1601403-19" = "[ns] \"……遊園地、行く？\""
"1601403-20-イブキ" = "えっ！本当！？いいの？"
"1601403-21-イブキ" = "あ、でも……遊園地は……"
"1601403-22-イブキ" = "特別な日だけって……マコト先輩が……"
"1601403-23" = "[s] \"イブキと会えた日は、いつでも特別な日だよ！\""
"1601403-24-イブキ" = "行きたい！"
"1601403-25-イブキ" = "イブキ、遊園地行きたい！"
"1601403-26-イブキ" = "先生とメリーゴーランドも乗りたいしパレードも見たい！"
"1601403-27" = "[s3] \"よし、行こう！\"\n[s4] \"さっそく明日にしよう！\""
"1601403-28-イブキ" = "わあ！先生、大好き！"
"1601403-29-イブキ" = "じゃあじゃあ、チケット買って、お弁当も用意しなきゃ！"
"1601403-30" = "[s] \"チケットは私が取っておくね。\""
"1601403-31-イブキ" = "お弁当はイブキが作る！自信あるよ！"
"1601403-32-イブキ" = "材料買いに行こ、先生！"
"1601403-33-イブキ" = "お弁当はね、イブキの好きなものでいっぱいにするの！"
"1601403-34-イブキ" = "くまさんのゼリーとオレンジのキャンディーと～#nキャラメルも入れて……デザートはプリン！"
"1601403-35" = "[s5] \"お菓子もいいと思うんだけど……\"\n[s6] \"先生はおにぎりも食べたいな！\""
"1601403-36-イブキ" = "うん！イブキもおにぎり好き！"
"1601403-37-イブキ" = "イブキが作ったおにぎり、イロハ先輩も好きって言ってた！#n先生にも食べてもらいたい！"
"1601403-38" = "[s] \"今から楽しみだよ！\""
"1601403-39-イブキ" = "えへへっ、楽しみにしてて！"
"1601403-40" = "（食材を買ってから、シャーレに戻った）"
"1601403-41-イブキ" = "じゃあ早速お弁当を作るよ、先生！"
"1601403-42-イブキ" = "見てて。こうやって、お米を取ったら中にくまさんゼリーを……ぎゅうって……"
"1601403-43" = "[s] \"く、くまさんゼリー！？\""
"1601403-44-イブキ" = "そう！イブキの大好きなくまさんゼリーおにぎり！#nイロハ先輩も美味しいって褒めてくれたの！"
"1601403-45" = "[s7] \"な、なるほど……！\"\n[s8] \"せ、先生の好きな梅干しおにぎりも作ってもらいたいな。\""
"1601403-46-イブキ" = "分かった！梅干しおにぎりね！"
"1601403-47-イブキ" = "じゃーん！できたっ！#n先生も一緒に作ろ！"
"1601403-48" = "[s] \"お米を手に取って……\""
"1601403-49-イブキ" = "そうそう！よくできました！"
"1601403-50-イブキ" = "でも先生のおにぎりだから、特別にもっと大きくしてあげる！"
"1601403-51-イブキ" = "んっ……こうして……"
"1601403-52-イブキ" = "できたあー！"
"1601403-53" = "[s] \"美味しそう！食べてみてもいい？\""
"1601403-54-イブキ" = "あっ！ダメ！これは明日の遊園地で食べるの！"
"1601403-55-イブキ" = "イブキと一緒に我慢するんだよ！"
"1601403-56" = "（翌日……）"
"1601403-57-イブキ" = "うぅ……"
"1601403-58-イブキ" = "雨、すごい……遊園地に行くって、約束したのに……"
"1601403-59-イブキ" = "先生とメリーゴーランド乗って、パレード見て、お弁当……食べたかった……"
"1601403-60-イブキ" = "う、うう……ぐすん……"
"1601403-61" = "[s] \"……イブキ！\""
"1601403-62-イブキ" = "……うん？"
"1601403-63-イブキ" = "先生？どうしてシートを広げてるの？"
"1601403-64" = "[s] \"シートを敷いた瞬間から、ここは遊園地だよ！\""
"1601403-65" = "[ns] \"シャーレ・パークへようこそ！\""
"1601403-66-イブキ" = "……しゃーれ、ぱーく？"
"1601403-67" = "[s9] \"「ユニーク・スタジオ・キヴォトス」には行けなくなったけど……\"\n[s10] \"今日は一日限定、シャーレ遊園地だよ！\""
"1601403-68-イブキ" = "シャーレが……遊園地に……？"
"1601403-69" = "[s11] \"それでは、遊園地ピクニックをします！\"\n[s12] \"まずはお弁当を食べよう！\""
"1601403-70-イブキ" = "イブキも靴を脱いで上がればいいの……？"
"1601403-71-イブキ" = "……わぁ！ピクニックみたいだね！"
"1601403-72" = "[s] \"イブキ、こっちにおいで。\""
"1601403-73-イブキ" = "うん！"
"1601403-74-イブキ" = "はい、先生のために作ったおにぎり！"
"1601403-75-イブキ" = "……。"
"1601403-76" = "[s] \"イブキ？\""
"1601403-77-イブキ" = "……先生は、悲しくないの？"
"1601403-78" = "[s] \"……たしかに、残念ではあったかな。\""
"1601403-79-イブキ" = "このおにぎり、ユニーク・スタジオで食べようと思って作ったのに……"
"1601403-80-イブキ" = "お外がずっと雨だから……"
"1601403-81" = "[s13] \"どこで食べるのかよりも、誰と食べるのかが大切だから。\"\n[s14] \"イブキと一緒に食べられるなら、それが一番だよ。\""
"1601403-82-イブキ" = "……。"
"1601403-83-イブキ" = "うん！そうだね！"
"1601403-84-イブキ" = "イブキも先生と一緒ならどこでも楽しい！"
"1601403-85" = "（その後、「シャーレ・パーク」でゲームやおもちゃで遊び、イブキと楽しい時間を過ごした）"
