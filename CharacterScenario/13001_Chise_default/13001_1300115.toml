[translation]
"1300115-1" = "風が来る音"
"1300115-2" = "（チセに連絡をもらい、陰陽部の休憩室にやって来た）"
"1300115-3" = "[ns] \"チセ？\""
"1300115-4-チセ" = "あ、先生。"
"1300115-5-チセ" = "ここだよ～。"
"1300115-6" = "[s] \"床で何してるの？\""
"1300115-7-チセ" = "お日様が元気だから……。"
"1300115-8-チセ" = "じっとしてたの。"
"1300115-9-チセ" = "こうしてないと、溶けちゃいそう。"
"1300115-10" = "[s] \"少し動いただけでも汗が出るよね……。\""
"1300115-11-チセ" = "さあ、先生も一緒に待とう。"
"1300115-12-チセ" = "きっと聞こえて来るよ。"
"1300115-13" = "[s] \"「風が来る音」が？\""
"1300115-14-チセ" = "うん、きれいな音だよ。"
"1300115-15-チセ" = "涼しい音なの。"
"1300115-16-チセ" = "耳を澄ませば、すぐ聞こえてくると思うよ～。"
"1300115-17" = "[s] \"……？\""
"1300115-18-チセ" = "先生、じっとしてて。"
"1300115-19-チセ" = "こうやって耳を傾けて、静かに待っていれば……。"
"1300115-20-チセ" = "聞こえた？"
"1300115-21" = "[s] \"鐘の音……？\""
"1300115-22-チセ" = "ちょっと違うよ。"
"1300115-23-チセ" = "本当はね〜。"
"1300115-24" = "[ns] \"風鈴だったんだ。\""
"1300115-25-チセ" = "うん、そうだよ～。"
"1300115-26-チセ" = "吊るしておいたの。"
"1300115-27" = "[s] \"たしかに、風鈴の音は風が来る合図だね。\""
"1300115-28-チセ" = "うん、清らかな音。"
"1300115-29-チセ" = "毎年、この季節になったら出してるの。"
"1300115-30-チセ" = "一番大切な風鈴だから。"
"1300115-31" = "[s] \"ほかの風鈴とは何が違うの……？\""
"1300115-32-チセ" = "同じように見えるけど……。"
"1300115-33-チセ" = "これは、青い音がするから。"
"1300115-34" = "[s] \"青い音……？\""
"1300115-35-チセ" = "うん。"
"1300115-36-チセ" = "青くて、清らかな音。"
"1300115-37-チセ" = "先生も、一緒に聞こう？"
"1300115-38-チセ" = "こっち来て。"
"1300115-39-チセ" = "ここで横になってみて。"
"1300115-40" = "（チセの隣で横になってみた）"
"1300115-41-チセ" = "じゃあ、先生。"
"1300115-42-チセ" = "静かに耳を澄ませて。"
"1300115-43" = "[s] \"……。\""
"1300115-44" = "[ns1] \"うん、青い音がするね。\"\n[ns2] \"うん、清らかな音だね。\""
"1300115-45-チセ" = "そうでしょ？"
"1300115-46-チセ" = "……あっ。"
"1300115-47" = "暑#nい#n日#nに"
"1300115-48" = "床#n横#nた#nわ#nり"
"1300115-49" = "触#nれ#nる#n風"
"1300115-50" = "（その後、しばらくの間、チセと風鈴の音に耳を傾けた……）"
