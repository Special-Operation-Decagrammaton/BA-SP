[translation]
"1300103-1" = "陰陽部のアイドル"
"1300103-2" = "（チセと合流して本屋に向かう途中、事件は起こった）"
"1300103-3-チセのファンA" = "あっ、も、もしかしてチセ様ですか！？"
"1300103-4-チセ" = "ん……？"
"1300103-5" = "ほ、本物だ！本物のチセ様！"
"1300103-6-チセのファンB" = "なに、チセ様だと！？"
"1300103-7-チセのファンC" = "こんなところにチセ姫が！？どこ！？どこにいらっしゃるんだ！？"
"1300103-8" = "[ns] \"な、なになに！？\""
"1300103-9-チセ" = "んー？"
"1300103-10-チセのファンA" = "きゃー！チセ様ーー！！"
"1300103-11-チセのファンB" = "チセ様、こっち見て笑ってください！"
"1300103-12-チセ" = "笑う……"
"1300103-13-チセ" = "こう？"
"1300103-14-チセのファンC" = "はあっはあっ！天使だ！チセ様、本物の天使！"
"1300103-15-チセのファンA" = "チセ様！俳句！俳句を詠んでくれませんか！？"
"1300103-16-チセ" = "……詠めた。"
"1300103-17-チセ" = "やあみんな"
"1300103-18-チセ" = "ちゃんと歯磨き"
"1300103-19-チセ" = "してるかな？"
"1300103-20-チセのファンA" = "わあああぁぁっ……！チセ様の即吟……！"
"1300103-21-チセのファンB" = "ああ…め、めまいが……！"
"1300103-22-チセのファンC" = "チセ様！チセ様ー！C・H・I・S・E！チセ姫ぇぇぇっ、愛してますっ！！"
"1300103-23-チセ" = "ん。先生、動けない。どうしよう。"
"1300103-24" = "[s] \"えっと、一旦落ち着いてもらって……。\""
"1300103-25" = "ん？あなた、誰ですか？どうしてそんなにチセ様のそばにいるんですか？"
"1300103-26-チセのファンB" = "もしかしてマネージャー？"
"1300103-27-チセのファンC" = "いや、もしかしたら悪質なストーカーかもしれない！"
"1300103-28-チセのファンたち" = "違いない！"
"1300103-29" = "[s] \"違うよ！\""
"1300103-30" = "[s1] \"見ての通り私は、チセのマネージャー！\"\n[s2] \"見ての通り私は、チセの先生！\""
"1300103-31-チセのファンたち" = "そうは見えないけど……本当に？"
"1300103-32-チセのファンたち" = "そうは見えないけど……本当に？"
"1300103-33" = "[s3] \"くっ、信じてもらえそうにない……！\"\n[s4] \"チセ、逃げよう！\""
"1300103-34-チセ" = "え？うん、わかった～。"
"1300103-35-チセ" = "え？うん、わかった～。"
"1300103-36" = "あっ、逃げるぞ！追いかけろ！"
"1300103-37" = "[ns] \"はあ、はあ、危ないところだった……。\""
"1300103-38-チセ" = "先生、災難だったね？"
"1300103-39" = "[s] \"いや、この件は私というか……。\""
"1300103-40-チセ" = "んー？"
"1300103-41" = "[s] \"……まあいっか。こういうことはよくあるの？\""
"1300103-42-チセ" = "道を歩いてると、たまに。"
"1300103-43-チセ" = "陰陽部の部員だからかな？"
"1300103-44" = "[s5] \"そういえば陰陽部って、観光PRのために、\"\n[s6] \"あちこちで色々活動してるって言ってたね。\""
"1300103-45-チセ" = "うん。さっきの人たちもみんな、応援してくれてるみたいだし、"
"1300103-46-チセ" = "うん。さっきの人たちもみんな、応援してくれてるみたいだし、"
"1300103-47-チセ" = "頑張らないと、って思う。"
"1300103-48" = "[s7] \"そうなんだ……。\"\n[s8] \"チセは人気者なんだね。\""
"1300103-49-チセ" = "人気……？"
"1300103-50-チセ" = "人気……？"
"1300103-51" = "[s] \"みんな、チセのことを好きなんだなって。\""
"1300103-52-チセ" = "……うん、そうかも。"
"1300103-53-チセ" = "好きでいてくれるのは、嬉しいこと。"
"1300103-54-チセのファンA" = "あっ、見つけた！チセ様ぁー！"
"1300103-55" = "[s] \"しまった、追いつかれた！\""
"1300103-56-チセのファンB" = "チセ様～～！！！せめて握手だけでも～！！"
"1300103-57" = "[s9] \"くっ、仕方ない！チセ、逃げて！\"\n[s10] \"ここは私に任せて！\""
"1300103-58-チセ" = "うん、分かった。"
"1300103-59-チセ" = "うん、分かった。"
"1300103-60-チセ" = "あっ。"
"1300103-61" = "[s] \"どうしたの！？\""
"1300103-62-チセ" = "先生見て、アリの行列。"
"1300103-63" = "[s] \"チセ！？今はそんな場合じゃないから……！\""
"1300103-64" = "（てんやわんやしつつもその後、なんとかチセとその場から逃れることに成功した）"
