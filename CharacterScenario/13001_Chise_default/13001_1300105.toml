[translation]
"1300105-1" = "月夜　作句　特別な"
"1300105-2" = "（メッセージを受けて公園に来てみた）"
"1300105-3" = "（ガサッ）"
"1300105-4" = "（ガサガサッ）"
"1300105-5" = "[s] \"……チセ？茂みの中で何してるの？\""
"1300105-6-チセ" = "にゃー。"
"1300105-7-チセ" = "……今の私はチセじゃないよ、先生。"
"1300105-8-チセ" = "今の私は猫、なのにゃー……。"
"1300105-9" = "[s] \"猫……？\""
"1300105-10-チセ" = "茂みの中を歩き回る猫になってるの。"
"1300105-11-チセ" = "私は猫、私は猫……。"
"1300105-12-チセ" = "猫なのにゃ～。"
"1300105-13" = "[s] \"急にまたどうして……？\""
"1300105-14-チセ" = "ひらめきが欲しくて。"
"1300105-15-チセ" = "俳句を作らなきゃいけないから。"
"1300105-16" = "[s1] \"ひらめき？\"\n[s2] \"俳句？\""
"1300105-17-チセ" = "うん。こうやって色々やってみて、"
"1300105-18-チセ" = "うん。こうやって色々やってみて、"
"1300105-19-チセ" = "心に届くような俳句を作りたいなって。"
"1300105-20-チセ" = "締め切りまで、あと少し。"
"1300105-21" = "（しばらくチセ語を分析しながら話を聞いてみた結果、何となく分かってきた）"
"1300105-22" = "[ns3] \"つまり今度陰陽部の広報イベントの一環で、\"\n[ns4] \"公民館に展示する用の俳句が必要、ってことでOK？\""
"1300105-23-チセ" = "（こくり）"
"1300105-24-チセ" = "（こくり）"
"1300105-25-チセ" = "そのために、俳句を詠む。"
"1300105-26" = "[s] \"そういえば、そういう活動をしてるって言ってたね。\""
"1300105-27-チセ" = "うん、でもエマージェンシー。"
"1300105-28-チセ" = "頭の中が真っ白で何も浮かばない。"
"1300105-29-チセ" = "だから。"
"1300105-30-チセ" = "良い俳句が浮かぶように、今日一日、手伝ってほしい。"
"1300105-31-チセ" = "手伝ってくれる……？"
"1300105-32" = "[s] \"もちろん、手伝うよ。\""
"1300105-33-チセ" = "ありがとう、先生。"
"1300105-34-チセ" = "じゃあまず、先生に会えたことだし……。"
"1300105-35-チセ" = "猫になりきった気分で、今の気持ちを詠むと……。"
"1300105-36" = "先#n生#nに#nゃ"
"1300105-37" = "あ#nあ#n先#n生#nに#nゃ"
"1300105-38" = "先#n生#nに#nゃ#n｜"
"1300105-39" = "[ns] \"これが、チセの俳句……。\""
"1300105-40-チセ" = "もっと、先生と一緒にいれば、いっぱい浮かぶかも。"
"1300105-41-チセ" = "行こう、先生。"
"1300105-42" = "（ケロケロケロ……）"
"1300105-43-チセ" = "鳴き声。"
"1300105-44" = "[s] \"うん、近くにカエルがいるみたいだね。\""
"1300105-45-チセ" = "カエルさんが私を呼んでる。"
"1300105-46" = "[s] \"うん。……えっ？\""
"1300105-47-チセ" = "けろけろ。"
"1300105-48-チセ" = "けろ、けろ……？"
"1300105-49" = "（ケロケロッ！ケロケロッ！）"
"1300105-50" = "[s] \"会話が通じてる！？\""
"1300105-51-チセ" = "あ。"
"1300105-52-チセ" = "カエルさんたちのおかげでひらめいた。"
"1300105-53-チセ" = "今なら詠めそう。"
"1300105-54" = "け#nろ#nけ#nろ#nろ"
"1300105-55" = "輪#n唱#n幕#n引#nき"
"1300105-56" = "ぴ#nょ#nん#nと#n跳#nぶ"
"1300105-57-チセ" = "……どう？カエルさんたちも気に入ってくれた？"
"1300105-58" = "（ケロケロッ！！ケロケロッ！！）"
"1300105-59" = "[s] \"すごく気に入ってるみたい……だね？\""
"1300105-60-チセ" = "よかった♪"
"1300105-61-コンビニバイト" = "いらっしゃいませー！"
"1300105-62" = "[s] \"今度はコンビニ？\""
"1300105-63-チセ" = "うん。"
"1300105-64-チセ" = "コンビニは色がたくさんあって可愛いから、"
"1300105-65-チセ" = "良いひらめきをもらえるかなって。"
"1300105-66" = "[s] \"うーん、でも俳句に繋がりそうなものは特に……。\""
"1300105-67-チセ" = "あ。"
"1300105-68-チセ" = "先生、これ見て。"
"1300105-69-チセ" = "抹茶味のラムネ、限定商品だって。"
"1300105-70" = "[s] \"ま、抹茶味のラムネ……？\""
"1300105-71-チセ" = "抹茶味のラムネ、それ以外にもたくさんの色のお菓子が……。"
"1300105-72-チセ" = "あ、浮かんだ。"
"1300105-73" = "[s] \"コンビニでも詠めるなんて！\""
"1300105-74" = "め#nく#nる#nめ#nく"
"1300105-75" = "闇#n夜#nの#n中#nで#nも"
"1300105-76" = "色#n光#nる"
"1300105-77-チセ" = "どう、先生？"
"1300105-78" = "[s5] \"私にはちょっと分からないけど、すごく良いと思う。\"\n[s6] \"素敵な俳句だと思うよ。\""
"1300105-79-チセ" = "そっか。うーん……でも、これだけじゃ足りないかも。"
"1300105-80-チセ" = "そっか。うーん……でも、これだけじゃ足りないかも。"
"1300105-81-チセ" = "足りてないもの……ん～……。"
"1300105-82" = "（こんな感じで、チセと丸一日あちこちを歩き回った）"
"1300105-83" = "（いくつもの俳句を詠むものの……）"
"1300105-84-チセ" = "何かが足りない。"
"1300105-85-チセ" = "もう少し、心にぐっと来るような、そういう……。"
"1300105-86" = "（チセはずっと首を傾げっぱなしだった）"
"1300105-87" = "（そうこうしている間に日が暮れて……）"
"1300105-88" = "[ns7] \"今日は結構歩いたね。\"\n[ns8] \"どう、何か浮かんだ？\""
"1300105-89-チセ" = "……。"
"1300105-90-チセ" = "……。"
"1300105-91-チセ" = "よく、分からない。"
"1300105-92-チセ" = "先生と一日中歩きながら、色んなことが浮かんできたけど。"
"1300105-93-チセ" = "何か、ちょっと捉えきれてない気が、する。"
"1300105-94-チセ" = "どうしてだろ？"
"1300105-95" = "[s] \"うーん、何だろうね……。\""
"1300105-96-チセ" = "……。"
"1300105-97" = "[s] \"でも私は今日一日、楽しかったよ。\""
"1300105-98-チセ" = "……楽しい？"
"1300105-99" = "[s9] \"チセの俳句も聞けたし、\"\n[s10] \"二人でお散歩できて楽しかった。\""
"1300105-100-チセ" = "お散歩……。"
"1300105-101-チセ" = "お散歩……。"
"1300105-102-チセ" = "……楽しい。"
"1300105-103-チセ" = "あ。"
"1300105-104" = "[s] \"チセ？\""
"1300105-105-チセ" = "ピコンって来た。"
"1300105-106-チセ" = "帰って、作らなきゃ。"
"1300105-107" = "[ns] \"ま、待って！チセ！？\""
"1300105-108" = "百鬼夜行連合学院・旧第3校舎"
"1300105-109" = "（その後、急に走り出したチセを追いかけて……）"
"1300105-110" = "[s] \"ここ、百鬼夜行の……旧校舎？\""
"1300105-111-チセ" = "先生、こっちだよ。こっち。"
"1300105-112" = "[wa:500]― ようこそ、[wa:1850]先生。"
"1300105-113" = "― ここは[wa:1350]静かだから…"
"1300105-114" = "― 俳句を作るのに[wa:1900]ちょうど良くて。"
"1300105-115" = "[wa:350]― 今日は[wa:800]先生と一緒で……"
"1300105-116" = "[wa:50]― すごく[wa:650]楽しかった。"
"1300105-117" = "― それで私、[wa:2300]気づいたの。"
"1300105-118" = "― 私が[wa:800]作りたかった俳句、[wa:3950]それは……。"
"1300105-119" = "― 今日[wa:950]ずっと感じていた[wa:1600]この気持ちを、"
"1300105-120" = "― 込めたものだったんだって。"
"1300105-121" = "日#nは#n暮#nれ#nど"
"1300105-122" = "今#nな#nお#n続#nく"
"1300105-123" = "音#nふ#nた#nつ"
"1300105-124" = "[wa:450]― ……先生と一緒なら、[wa:3050]まだまだいくつでも、"
"1300105-125" = "[wa:50]― 詠めそうな気がする。"
"1300105-126" = "[wa:200]― 次もまた、[wa:1950]付き合ってくれる？"
"1300105-127" = "[wa:150]― あ……[wa:1650]先生、[wa:1700]見て。"
"1300105-128" = "[ns] \"ん？……月？\""
"1300105-129" = "[wa:1200]― 月、[wa:1500]綺麗だね。"
"1300105-130" = "[ns] \"チセ？それって、その……。\""
"1300105-131" = "― 本当に、[wa:2250]綺麗……。"
"1300105-132" = "[ns] \"あ、文字通り美しいって意味ね……。\""
"1300105-133" = "[ns11] \"うん、チセの言う通り、本当に……。\"\n[ns12] \"月が綺麗だ。\""
"1300105-134" = "（そうやってチセの隣に座って、一緒に月を見て長い時間を過ごした）"
