[translation]
"1011602-1" = "新しいアルバイト"
"1011602-2" = "（しばらくすると、サオリが大きなバッグを持ってシャーレに来た）"
"1011602-3-サオリ" = "時間を作ってくれて感謝する、先生。"
"1011602-4-サオリ" = "なぜ連絡したかと言うと――"
"1011602-5-サオリ" = "いや、見せた方が早いな。"
"1011602-6-サオリ" = "少し席を外してもらえないだろうか。"
"1011602-7-サオリ" = "準備が必要でな。"
"1011602-8" = "[s1] \"了解！\"\n[s2] \"なんだか楽しみ！\""
"1011602-9-サオリ" = "それでは、終わったらまた声を掛ける。"
"1011602-10-サオリ" = "くっ……以前よりもきついな。"
"1011602-11-サオリ" = "まさか、また大きく……？#nこれは想定外だ……。"
"1011602-12" = "[ns3] \"あ、あのー、サオリさん？\"\n[ns4] \"一体何を……？\""
"1011602-13-サオリ" = "まっ、まだだ……！"
"1011602-14-サオリ" = "もう少しそこで待っていてくれ！"
"1011602-15" = "（しばらくして……）"
"1011602-16-サオリ" = "……待たせたな。#n入ってもらって構わない。"
"1011602-17-サオリ" = "……。"
"1011602-18" = "[ns] \"んん……？\""
"1011602-19-サオリ" = "……先生、その顔はどうしたんだ？"
"1011602-20-サオリ" = "何かおかしいところでも……？"
"1011602-21" = "[s5] \"ドレス！？\"\n[s6] \"ほ、本当にサオリなの！？\""
"1011602-22-サオリ" = "わ、私だ！！"
"1011602-23-サオリ" = "やはり、私には似合わないだろうか……。"
"1011602-24-サオリ" = "時間をとらせてすまなかった。この件は忘れてくれ……。"
"1011602-25" = "[ns] \"ご、ごめん！ビックリしちゃって……とっても似合ってるよ！\""
"1011602-26-サオリ" = "そ、そうか……ありがとう。"
"1011602-27-サオリ" = "先に説明すればよかったな。"
"1011602-28-サオリ" = "実は、時給の良いアルバイトをすることになってな。"
"1011602-29-サオリ" = "ドレスを着て撮影を行うというものだ。#nあとで雑誌に載るのだとか。"
"1011602-30" = "[s7] \"おお、モデルの仕事だね！\"\n[s8] \"本格的なやつだ！\""
"1011602-31-サオリ" = "ああ。しかし、準備がこちらに一任されていてな。"
"1011602-32-サオリ" = "ドレスは事前に渡されたものの……。"
"1011602-33-サオリ" = "ほかのことがさっぱり分からなくてな。"
"1011602-34" = "[s9] \"それにしては……。\"\n[s10] \"綺麗に着こなしてるね。プロがやったみたい！\""
"1011602-35-サオリ" = "こ、これはたまたま上手くいっただけで……！"
"1011602-36-サオリ" = "とにかく……モデルについて、撮影時にポーズを取ることくらいしか知らないんだ。"
"1011602-37-サオリ" = "だから、先生に色々聞きたくて……。"
"1011602-38-サオリ" = "モデルとは、一体どういうポーズを取るのだろうか？"
"1011602-39" = "[s11] \"うーん、普通はポーズ指定が入るけど……。\"\n[s12] \"ないなら今の自然体がサオリらしいんじゃない？\""
"1011602-40-サオリ" = "そ、そうか……？#n私らしい、とは……？"
"1011602-41-サオリ" = "強くて気高さを感じさせるが、どこか抜けているような……？"
"1011602-42-サオリ" = "ふ、普段の私はそう映っていたのか……！？"
"1011602-43" = "[s13] \"悩みすぎなくていいよ！\"\n[s14] \"いつものサオリを出していこう！\""
"1011602-44-サオリ" = "いつもの自分……。"
"1011602-45-サオリ" = "……そうか。緊張せずに自然体で、ということだな。"
"1011602-46-サオリ" = "では……歩き方は、こういう感じだろうか。"
"1011602-47-サオリ" = "そして、背筋を伸ばして胸を張れば……どうだ？自信を感じられるだろうか。"
"1011602-48-サオリ" = "先生？その表情はどういう……。"
"1011602-49-サオリ" = "……やはり変か。私なりに考えてみたんだが。"
"1011602-50" = "[ns] \"……写真撮ってもいいかな？\""
"1011602-51-サオリ" = "だっ、ダメだ！"
"1011602-52" = "[s] \"ほかのみんなには見せないから！\""
"1011602-53-サオリ" = "なおさらダメだ！"
"1011602-54-サオリ" = "先生の手元に残るのなら、もう少しちゃんと……！"
"1011602-55-サオリ" = "……あっ。"
"1011602-56" = "[s] \"今の表情、すごくよかったよ！\""
"1011602-57-サオリ" = "……な、何が良いというんだ？"
"1011602-58-サオリ" = "とにかく、まだダメだ。"
"1011602-59-サオリ" = "もう少し慣れてきたら、写真を送ろう。"
"1011602-60" = "[s15] \"貰えるんだ！？嬉しい！\"\n[s16] \"じゃあ、私も頑張ってポーズを考えるね！\""
"1011602-61-サオリ" = "……先生には敵わないな。"
"1011602-62-サオリ" = "いいだろう、望むところだ！覚悟はできている！"
"1011602-63" = "[ns] \"覚悟してねサオリ！私の指導は厳しいよ！\""
"1011602-64" = "（その後、サオリとポーズの研究に勤しんだ）"
