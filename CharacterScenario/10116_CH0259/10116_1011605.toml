[translation]
"1011605-1" = "お礼"
"1011605-2" = "（サオリと会うべく飲食街に向かった）"
"1011605-3" = "（……ところが）"
"1011605-4-サオリ" = "……。"
"1011605-5" = "[ns] \"あ、あのー……サオリさん？\""
"1011605-6-サオリ" = "ああ、先生。待っていた。"
"1011605-7-サオリ" = "すぐ店に向かおう。どこがいいだろうか。"
"1011605-8" = "[ns] \"ま、待って！\""
"1011605-9" = "[ns] \"もしかして、ずっとその格好だったの？\""
"1011605-10-サオリ" = "大切な席には、ドレスを纏って行くものだと聞いたが……。"
"1011605-11-飲食街の店員" = "ドレス……？どこかのお嬢さまかな？"
"1011605-12-飲食街の客" = "こんなところで何してるんだろ？"
"1011605-13-飲食街の通行人" = "綺麗な人……写真撮っていいか聞いてみようかな？"
"1011605-14-サオリ" = "……先生。なにやら視線を感じるのだが。"
"1011605-15" = "[ns1] \"ま、まずは場所を変えよう！\"\n[ns2] \"ここは人目につくから……！\""
"1011605-16-サオリ" = "ちょっ……先生？"
"1011605-17" = "（そうして私たちがたどり着いたのは……）"
"1011605-18" = "（サオリに周囲の視線の理由を説明した）"
"1011605-19-サオリ" = "……場違いな服を選んでしまっていたとはな。"
"1011605-20-サオリ" = "あのままでは、いい晒し者になるところだった。"
"1011605-21-サオリ" = "先生に嫌な思いをさせるつもりはなかったんだ……。"
"1011605-22-サオリ" = "すまない。せっかくお礼をしようと思っていたのに。"
"1011605-23-サオリ" = "これでは台無しだ。"
"1011605-24-サオリ" = "すぐに着替えてこよう。少し待って――"
"1011605-25-サオリ" = "……この服のままでいい？どういうことだ？"
"1011605-26" = "[s3] \"ドレス姿にサオリの本気を感じたから！\"\n[s4] \"その想いを無駄にできないよ！\""
"1011605-27-サオリ" = "っ……！"
"1011605-28-サオリ" = "で、でもこの格好でお店には……。"
"1011605-29-サオリ" = "……先生が料理を作る？"
"1011605-30" = "[s5] \"私ばかり貰っている気がしたからね。\"\n[s6] \"サオリも頑張ったんだから、ご褒美がないと！\""
"1011605-31-サオリ" = "そ、そうか……。"
"1011605-32-サオリ" = "わかった。言う通りにしよう。"
"1011605-33-サオリ" = "それに、先生の手作り料理には興味がある。"
"1011605-34" = "[ns] \"今日は特別な日になりそう！\""
"1011605-35" = "[ns] \"こういう時こそ、写真に残したいんだけど……。\""
"1011605-36-サオリ" = "写真？そうか……。"
"1011605-37-サオリ" = "わかった。"
"1011605-38" = "[s] \"えっ、いいの？\""
"1011605-39-サオリ" = "モデルとして撮られることにもすっかり慣れたからな。これも先生のおかげだ。"
"1011605-40-サオリ" = "……そうだ、先生に渡そうと思っていたものがある。"
"1011605-41-サオリ" = "受け取ってくれ。"
"1011605-42-サオリ" = "私の写真が載ったファッション誌だ。"
"1011605-43-サオリ" = "気がつけば、表紙モデルにも選ばれていてな。"
"1011605-44-サオリ" = "今後も依頼をすると言われている。"
"1011605-45-サオリ" = "バイト代はもちろん、ドレスまで貰ってしまった。"
"1011605-46-サオリ" = "……すべて先生のおかげだ。だからこれはまず先生に受け取――"
"1011605-47" = "[ns] \"なんと……！これが！\""
"1011605-48-サオリ" = "は、速い！？ 先生、今ここで見るのか！？"
"1011605-49" = "[ns7] \"サオリ、こんな立派に……！先生、すごく嬉しいよ！\"\n[ns8] \"見てるだけでも私、胸がいっぱいで……！\""
"1011605-50-サオリ" = "わ、分かったから！写真と見比べるのはやめてくれ……！"
"1011605-51-サオリ" = "こういう写真は補正されて、実物より美化されているんだ……！"
"1011605-52-サオリ" = "……差がない？ほ、本当か……？"
"1011605-53" = "[ns] \"おっ、今の表情すごくよかった！！\""
"1011605-54" = "[ns] \"今度こそサオリの写真をいっぱい撮らせて……！\""
"1011605-55-サオリ" = "くっ……"
"1011605-56-サオリ" = "い、いいだろう。ただ……"
"1011605-57-サオリ" = "ほかの人には絶対に見せないでくれ。いいな？"
"1011605-58" = "[ns] \"やった！\""
"1011605-59" = "（たくさん写真を撮った後、サオリとゆっくり料理を楽しんだ）"
