[translation]
"1006802-1" = "おはよう、レイサ"
"1006802-2-レイサ" = "よいしょ、っと……"
"1006802-3-レイサ" = "……あれ？"
"1006802-4-レイサ" = "……あっ！"
"1006802-5-レイサ" = "あああっ！！先生！！こんにちは！！"
"1006802-6" = "[s1] \"こんにちは、レイサ。\"\n[s2] \"こんな所で会うなんて奇遇だね。\""
"1006802-7-レイサ" = "本当ですね！私も会えるとは思っていませんでした！"
"1006802-8-レイサ" = "その……先生は、こちらで何をなさっているんですか……？"
"1006802-9-レイサ" = "あっ、帰りのバス……たしかに言われてみれば時間的にそうですよね！#n変なことを聞いてしまってすみません！"
"1006802-10-レイサ" = "んん……"
"1006802-11-レイサ" = "あはは！では、私はこれで……！"
"1006802-12" = "[ns3] \"朝はごめんね。いま時間、大丈夫？\"\n[ns4] レイサを呼び止める。"
"1006802-13-レイサ" = "……？"
"1006802-14-レイサ" = "どうしました？何かご用でも……？"
"1006802-15-レイサ" = "……あっ、今朝のモモトークですか？"
"1006802-16-レイサ" = "あ、あはは……! あれは……すみません、気を遣わせてしまって。#n全然、本当に大丈夫ですので！"
"1006802-17-レイサ" = "特に何かあったわけじゃないんです！#nご挨拶を、と思っただけで……"
"1006802-18-レイサ" = "ですが、よくよく考えたら先生はお忙しいのですから、ご迷惑だったな、と思い直しまして……"
"1006802-19-レイサ" = "これからは無駄な連絡をしないよう、気をつけます！"
"1006802-20" = "[s5] \"もっと気軽に連絡して大丈夫だよ。\"\n[s6] \"気兼ねなくいつでも送ってね。\""
"1006802-21-レイサ" = "……え？"
"1006802-22-レイサ" = "ん……は、はい？#nあ、ありがとうございます……"
"1006802-23-レイサ" = "もしかして……それを言うために……？"
"1006802-24-レイサ" = "……え？この後、ですか？#n予定は、特にありませんが……"
"1006802-25-レイサ" = "何か事件でも起きない限り……あはは。"
"1006802-26-レイサ" = "……あっ！！"
"1006802-27-レイサ" = "えっと……クラスの子には、仲良くしてもらってます！！#n全然、そういうのじゃありませんから！！本当に！！"
"1006802-28-レイサ" = "むしろ、色々と誘ってもらっているのですが……#nその……うまく返事ができなくて……"
"1006802-29-レイサ" = "なんて返事をしようか悩みすぎて結局送れなかったり、#n大げさな反応をして困らせてしまったり……#nまぁ、そんな感じなんです！"
"1006802-30-レイサ" = "そ、それで……その……#nアドバイスを、先生に伺えたら、と……"
"1006802-31" = "[s7] \"話し相手が欲しかったんだね。\"\n[s8] \"レイサの気持ち、よく分かるよ。\""
"1006802-32-レイサ" = "お忙しいのに、申し訳ないです……ただ……"
"1006802-33-レイサ" = "不思議なことに先生の前では、その……なんというか……"
"1006802-34-レイサ" = "ちょっとくらい変な事を言っても、許してくださるというか……#nきっと大丈夫、と甘えてしまう気持ちが……"
"1006802-35-レイサ" = "あ……私、今とっても失礼なことを……すみません。"
"1006802-36-レイサ" = "大丈夫？そう、でしょうか……"
"1006802-37" = "[s9] \"うん、素直なレイサが一番だよ。\"\n[s10] \"あまり細かいところを気にしないほうが逆に良いかもね。\""
"1006802-38-レイサ" = "……？？？#nどういう意味でしょうか？"
"1006802-39-レイサ" = "失言ばかりしてしまっているのに、気にしなくて良い、だなんて……"
"1006802-40-レイサ" = "気にすると意識が引っ張られてしまう……？#nうーん……んん……？"
"1006802-41-レイサ" = "……すみません、まだよく分かりません！"
"1006802-42-レイサ" = "ですが！先生から頂いたアドバイスですから！"
"1006802-43-レイサ" = "正直、自分の中で理解はできておらず、怖いところもありますが……#nまずは挑戦してみます！当たって砕けろ、ですね！"
"1006802-44-レイサ" = "あっ、ちょうどバスが来ましたね。#nすみません、すっかり話し込んでしまいました。"
"1006802-45-レイサ" = "私はお先に失礼します！先生、良い一日を！"
"1006802-46-レイサ" = "……では、またご連絡しますね！！！"
"1006802-47" = "[ns11] \"……怪我しないようにね。\"\n[ns12] バスに乗り込む。"
