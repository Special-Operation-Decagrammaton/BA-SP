[translation]
"1009803-1" = "ヒーロー、パトロール"
"1009803-2-ホシノ" = "あ、先生。こっち、こっち。"
"1009803-3-ホシノ" = "……あれ。#nなんか嬉しそうじゃん、何かあったの？"
"1009803-4" = "[s] \"だって、ホシノのヒーロー姿がまた見られるんでしょ！\""
"1009803-5-ホシノ" = "いや～ヒーローなんて言われても、おじさん変身できないよ？"
"1009803-6-ホシノ" = "ま、とりあえず準備はできた？"
"1009803-7-ホシノ" = "今日は砂に覆われてる場所もパトロールするからね。"
"1009803-8-ホシノ" = "下手したら、今日中には帰ってこられないかもしれないし。"
"1009803-9" = "[s] \"もちろん、準備万端だよ。\""
"1009803-10-ホシノ" = "それじゃ、行こっか。"
"1009803-11-ホシノ" = "相変わらず、人がいないねぇ。"
"1009803-12-ホシノ" = "ん～？#nどうしてこんな遠くまでパトロールするのかって？"
"1009803-13-ホシノ" = "そりゃ、先生を疲れさせるためかな。#nおじさんに変なこと言う体力がなくなるようにね。"
"1009803-14" = "[s] \"そうだったの！？\""
"1009803-15-ホシノ" = "冗談だよ、冗談。#n先生はリアクションが良いね。"
"1009803-16-ホシノ" = "本当は、この間のトラブルが気になったんだ。"
"1009803-17-ホシノ" = "ヘルメット団が学校の掲示板を盗もうとしてたでしょ？"
"1009803-18" = "[s] \"あの時のホシノ、本当にカッコ良かったよ！\""
"1009803-19-ホシノ" = "……それは置いといて、やけに良い装備をしてなかった？"
"1009803-20-ホシノ" = "いつもは大したことなかったのに……。"
"1009803-21-ホシノ" = "それで今日は遠くまでパトロールしようと思ったんだ。"
"1009803-22-ホシノ" = "先生も怪しいと思わなかった？"
"1009803-23" = "[s] \"たしかに、言われてみれば……。\""
"1009803-24-ホシノ" = "そうでしょ？#nじゃ、早く行こっか。"
"1009803-25-ホシノ" = "あれ？#nあの家、前に見た時は何ともなかったのに……。"
"1009803-26" = "[s] \"完全に埋れてるね。\""
"1009803-27-ホシノ" = "最近、砂嵐が多いからかな……。"
"1009803-28-？？？" = "はぁ。#nやっぱり、一人じゃ無理だ……。"
"1009803-29-市民" = "……仕方ない、もう諦めるとするか。"
"1009803-30-ホシノ" = "何か困ってるなら手伝おうか？"
"1009803-31-市民" = "……君は？"
"1009803-32-ホシノ" = "あ～、ただの通りすがりの生――"
"1009803-33" = "[s] \"通りすがりのヒーローです。\""
"1009803-34-ホシノ" = "ちょっ、先生……！"
"1009803-35-市民" = "……ヒーロー？"
"1009803-36-市民" = "よく分からないけど、手伝ってくれるなら助かるよ。"
"1009803-37-市民" = "ここには昔、住んでいてね。#n探しものがあって久しぶりに来たんだ。"
"1009803-38-市民" = "でも砂嵐のせいか、この有り様で……。"
"1009803-39-市民" = "砂をいくら退かしたところで、キリがないんだ。"
"1009803-40-ホシノ" = "たしかに、この量を一人で何とかするのは……。"
"1009803-41-ホシノ" = "んじゃ、ここはおじさんが一肌脱ごうかな。"
"1009803-42" = "[s] \"私も手伝うね。\""
"1009803-43-ホシノ" = "うへへ。ありがとう、先生。"
"1009803-44-ホシノ" = "ふぅ、これで大丈夫そうだね。"
"1009803-45-市民" = "す、すごい！#nあんな大量にあった砂が……！"
"1009803-46-市民" = "ありがとう、アビドスのヒーロー！"
"1009803-47-ホシノ" = "まったく、先生が余計なこと言うから……。"
"1009803-48" = "[s1] \"困っている人がいたら見過ごせない……。\"\n[s2] \"それが、ヒーローだよね。\""
"1009803-49-ホシノ" = "う、うへぇ～。"
"1009803-50-ホシノ" = "ほんと、先生は平気でそういうこと言うんだから……。"
"1009803-51" = "（その後も、ホシノと一緒にアビドス自治区のパトロールを続けた）"
"1009803-52-ホシノ" = "うーん。#nたしか、ここは通行路だったはずなのに。"
"1009803-53-ホシノ" = "いつの間にか、砂に埋もれちゃってるね。"
"1009803-54" = "[s] \"迂回する？\""
"1009803-55-ホシノ" = "……。"
"1009803-56-ホシノ" = "ん～。"
"1009803-57-ホシノ" = "せっかくだし、ここの砂も退かしちゃおっか。"
"1009803-58-ホシノ" = "うわぁ、砂埃で街灯がすごい汚れてるねぇ。"
"1009803-59-ホシノ" = "先生、そこに登ってから肩車してもらえる？"
"1009803-60-ホシノ" = "これじゃ、暗くなった時に困るしね。"
"1009803-61-ホシノ" = "うへ～。#nいつの間にか、こんなところまで来ちゃったね。"
"1009803-62" = "[s] \"いったん休憩しよっか。\""
"1009803-63-ホシノ" = "そうだね、ずっと動きっぱなしだったし。"
"1009803-64-ホシノ" = "……ねぇ先生。#nおじさんと一緒に来たこと、後悔してない？"
"1009803-65" = "[s] \"まったくしてないよ。\""
"1009803-66" = "[ns] \"アビドスを思うホシノの気持ちが、伝わってきたからね。\""
"1009803-67-ホシノ" = "うへ～、照れるねぇ。"
"1009803-68-ホシノ" = "でもおじさんが頑張れたのは、先生のおかげだよ。"
"1009803-69-ホシノ" = "私だけだったら、途中でバテちゃってたかも。"
"1009803-70-ホシノ" = "……だから、ありがとう先生。"
"1009803-71-ホシノ" = "うん？#nヒーローの役に立てて嬉しい、って？"
"1009803-72-ホシノ" = "ひ、ヒーローっていう設定、まだ続いてるんだ。"
"1009803-73-ホシノ" = "ま、おじさんがヒーローだとしたら……。"
"1009803-74-ホシノ" = "先生は「相棒」で良いんだよね？"
"1009803-75" = "[s] \"相棒？\""
"1009803-76-ホシノ" = "ヒーローと一緒に戦う存在だよ。"
"1009803-77-ホシノ" = "まぁ、悪役にやられて、#nヒーローが覚醒するきっかけになるのが定番だけどね。"
"1009803-78" = "[s] \"！？\""
"1009803-79-ホシノ" = "うへへ。冗談だよ、冗談。"
"1009803-80-ホシノ" = "とりあえず、これでも食べる？"
"1009803-81-ホシノ" = "ポケットに入れてたせいで、グチャってなってるけど……。"
"1009803-82-？？？" = "あ、あのぉ……。"
"1009803-83-アビドス市民A" = "噂に聞いたんですが、#nあなたが最近この辺りで人助けをしているヒーローの方ですか？"
"1009803-84-ホシノ" = "えぇ！？"
"1009803-85" = "[s] \"噂が広がってるんだ……。\""
"1009803-86-ホシノ" = "たぶん、その人で合ってると思うけど……。"
"1009803-87-ホシノ" = "何か頼み事でもあるの？"
"1009803-88-アビドス市民A" = "……忘れ物を探してほしいんです。"
"1009803-89-アビドス市民A" = "この前、郊外を散歩していたら砂嵐に遭いまして。"
"1009803-90-アビドス市民A" = "そこで放置されていた車両に身を隠した時までは、#n持っていたはずなんです。"
"1009803-91-アビドス市民A" = "探しに行こうにも、砂漠の中なので場所が分からず……。"
"1009803-92-アビドス市民A" = "大切な物なんです！#n必ずお礼をしますので、どうかお願いします！"
"1009803-93-ホシノ" = "仕方ないかぁ。"
"1009803-94-ホシノ" = "わざわざ探してくれたんだし、ちょうどパトロール中だしね。"
"1009803-95-ホシノ" = "先生も、それで良い？"
"1009803-96" = "[s] \"もちろん、相棒も付いていくよ！\""
"1009803-97-ホシノ" = "うへへ、元気いっぱいだね。"
"1009803-98-ホシノ" = "じゃあ、ざっくりとした方向で良いから教えてもらえるかな？"
"1009803-99-アビドス市民A" = "はい！"
"1009803-100-アビドス市民A" = "えっと、背中に朝日を浴びながら、町に戻っていたはずなので……。"
"1009803-101-ホシノ" = "それじゃ、東のほうだね。"
"1009803-102-ホシノ" = "行こうか、先生。"
"1009803-103" = "（忘れ物を探すため、ホシノと一緒にアビドスの郊外へ向かった）"
"1009803-104-ホシノ" = "うへ～、たぶんこれじゃないかな？"
"1009803-105-ホシノ" = "無事に見つかったし、あとは持ち主に返すだけだね。"
"1009803-106-ホシノ" = "先生もお疲れ様～。"
"1009803-107" = "[s] \"ホシノもお疲れ様。\""
"1009803-108-ホシノ" = "うへへ。"
"1009803-109-ホシノ" = "でも、ちょっと困ったね。"
"1009803-110-ホシノ" = "ほら……。"
"1009803-111" = "[ns] \"あ、もうこんな時間だったんだ……。\""
"1009803-112-ホシノ" = "そうなんだよねぇ。"
"1009803-113-ホシノ" = "移動途中で完全に日が落ちたら、迷うかもしれないし……。"
"1009803-114-ホシノ" = "……仕方ない。"
"1009803-115-ホシノ" = "今日はここで一晩過ごそっか。"
"1009803-116-ホシノ" = "先生も休も～。"
"1009803-117" = "[wa:660]― [log=호시노 무장 모드 4]いやー[wa:1210]もうこんな時間になっちゃったかぁ。[/log]"
"1009803-118" = "[wa:3320]― [log=호시노 무장 모드 4]こうなったら、[wa:980]朝まで待つしかないねぇ。[/log]"
"1009803-119" = "[ns] \"ホシノと一緒だったら、待ってる時間も楽しいよ。\""
"1009803-120" = "[wa:470]― [log=호시노 무장 모드 4]……へ？[/log]"
"1009803-121" = "[wa:2020]― [log=호시노 무장 모드 4]またまたぁ～[wa:1840]こんなおじさんといたって、[wa:1240]別に楽しくないでしょ～[/log]"
"1009803-122" = "[ns] \"ううん。だって、ホシノはヒーローだからね。\""
"1009803-123" = "[wa:550]― [log=호시노 무장 모드 4]う、[wa:380]うへぇ～……[/log]"
"1009803-124" = "[wa:1970]― [log=호시노 무장 모드 4]その設定、[wa:680]まだやるの……？[wa:1830]おじさんにはちょっと[wa:640]荷が重いかも～[/log]"
"1009803-125" = "[wa:1170]― [log=호시노 무장 모드 4]……[wa:740]まあ、[wa:690]先生が相棒役を買って[wa:1380]出てくれるのなら、[/log]"
"1009803-126" = "[wa:1030]― [log=호시노 무장 모드 4]合わせるけどさぁ。[/log]"
"1009803-127" = "[wa:280]― [log=호시노 무장 모드 4]んじゃ、[wa:600]ヒーローと相棒の[wa:800]質素な夕食にしよっか。[wa:2260]……非常食だけど。[/log]"
"1009803-128" = "[ns] \"これって、小さい子に人気のグミだよね？\""
"1009803-129" = "[wa:1270]― [log=호시노 무장 모드 4]それは、[wa:1320]そうだけどさぁ～……[/log]"
"1009803-130" = "[wa:5360]― [log=호시노 무장 모드 4]おじさんはこれが好きなんだ。[wa:2270]大目にみてよ～[/log]"
"1009803-131-ホシノ" = "うへへ。#nポケットに入れっぱなしだったみたい。"
"1009803-132-ホシノ" = "まあ、味は変わらないから安心して。"
"1009803-133-ホシノ" = "これで、とりあえず今晩は何とかなりそうだね。"
"1009803-134" = "[s] \"ホシノは、こういうことに慣れてるの？\""
"1009803-135-ホシノ" = "それなりじゃない？"
"1009803-136-ホシノ" = "おじさんは屋根がない場所でも野営してきたからね。"
"1009803-137-ホシノ" = "それと比べたら、ここは随分と快適じゃないかな？#n良かったねぇ、先生。"
"1009803-138" = "[s] \"そのセリフは、本当におじさんっぽいような……。\""
"1009803-139-ホシノ" = "ええっ……。"
"1009803-140-ホシノ" = "ま、まぁ、とにかく寝る準備しよっか。"
"1009803-141-ホシノ" = "その辺の枯れ木を集めて火をつければ……"
"1009803-142-ホシノ" = "うへ～、温かいね。"
"1009803-143-ホシノ" = "非常用毛布を敷けば、寝床の完成だよ。"
"1009803-144-ホシノ" = "夜の砂漠は冷えるし、体温を維持しないとね。"
"1009803-145-ホシノ" = "まだ眠くないなら、#nしばらく列車にもたれかかりながら話でもしようか？"
"1009803-146-ホシノ" = "……おじさんはどこで寝るのかって？"
"1009803-147-ホシノ" = "気にしなくて平気平気。"
"1009803-148-ホシノ" = "おじさんはどこでも寝られるからね～。"
"1009803-149" = "[s] \"ホシノもこっちにおいでよ。\""
"1009803-150-ホシノ" = "えっ。#nいやいや、それはさすがに……。"
"1009803-151" = "[s3] \"体温維持は大切なんでしょ？\"\n[s4] \"二人で毛布に包まれば、温かいと思うよ。\""
"1009803-152-ホシノ" = "うへぇ、たしかにそうだけど……。"
"1009803-153-ホシノ" = "……はぁ。"
"1009803-154-ホシノ" = "やっぱり先生って、平気でそういうこと言うよね。"
"1009803-155-ホシノ" = "……まあ、お言葉に甘えてちょっとだけご一緒させてもらおうかな。"
"1009803-156" = "（こうしてホシノと同じ毛布で、陽が昇るまで休憩した）"
