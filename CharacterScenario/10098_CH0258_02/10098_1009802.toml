[translation]
"1009802-1" = "ヒーロー、誕生"
"1009802-2" = "（ホシノに連絡をもらい、アビドスへ向かった）"
"1009802-3-ホシノ" = "うぅ……ここは予測値で、こっちは目標値？"
"1009802-4-ホシノ" = "数字ばっかりで頭が痛いよ～。"
"1009802-5" = "[s1] \"……もしかして、書類仕事？\"\n[s2] \"書類に囲まれてるなんて珍しいね。\""
"1009802-6-ホシノ" = "あっ、先生！"
"1009802-7-ホシノ" = "もう来てくれたの？"
"1009802-8-ホシノ" = "助かったよ～。"
"1009802-9" = "[s] \"困ってそうだったからね。\""
"1009802-10-ホシノ" = "うへ～、心配させちゃったかな。"
"1009802-11-ホシノ" = "ごめんごめん。"
"1009802-12" = "[s] \"その書類仕事を手伝えば良いんだよね？\""
"1009802-13-ホシノ" = "あれ、どうして分かったの？"
"1009802-14-ホシノ" = "……おじさん、そこまでつらそうな顔してたかな？"
"1009802-15-ホシノ" = "まぁ、その通りなんだけど。"
"1009802-16-ホシノ" = "先生も知ってるようにさ、#nここ最近アビドスでいろんなことがあったでしょ？"
"1009802-17-ホシノ" = "そのせいで、書類が溜まっててね。"
"1009802-18-ホシノ" = "……べ、別におじさんが面倒で放置してたわけじゃないよ。"
"1009802-19" = "[s] \"……どうしてホシノ一人でやってるの？\""
"1009802-20-ホシノ" = "あ～。"
"1009802-21-ホシノ" = "実は、自分でやるって言い出しちゃったんだよね。"
"1009802-22-ホシノ" = "書類がこんなに溜まってるのは、おじさんの責任でもあるし。"
"1009802-23-ホシノ" = "みんなには、いつもお世話になってるからさ。"
"1009802-24-ホシノ" = "それで、書類ならおじさんがやるよ～って言っちゃって。"
"1009802-25-ホシノ" = "昔みたいに、なんとかなると思ってたんだけど……。"
"1009802-26-ホシノ" = "この量は、さすがに厳しくてね。"
"1009802-27" = "[s] \"それで私に連絡をくれたんだ。\""
"1009802-28-ホシノ" = "うへ～。"
"1009802-29-ホシノ" = "自分でやるって言っておいて、#n今さら助けて～なんて言いづらいじゃん？"
"1009802-30-ホシノ" = "でも、一人で抱えて期限内に終わらなかったら、#nみんなに迷惑かけちゃうし。"
"1009802-31-ホシノ" = "そこで先生なら、助けてくれるかな～って。"
"1009802-32-ホシノ" = "あとでちゃんとお礼はするから、おじさんのこと助けてくれない……？"
"1009802-33" = "[s] \"もちろんだよ、書類仕事なら慣れてるから。\""
"1009802-34-ホシノ" = "ほんと！？"
"1009802-35-ホシノ" = "ありがと～先生！"
"1009802-36" = "[ns] \"けど……。\""
"1009802-37" = "[ns] \"ちゃんとお礼はしてもらおうかな？\""
"1009802-38-ホシノ" = "ちょ、ちょっと目が怖いよ、先生。"
"1009802-39-ホシノ" = "おじさんにどんな命令をするつもりなの……？"
"1009802-40-ホシノ" = "う～ん。"
"1009802-41-ホシノ" = "まぁ、そもそも先生の手を借りないと終わらないし、しょうがないか。"
"1009802-42" = "[s] \"それで、まずは何をすれば良い？\""
"1009802-43-ホシノ" = "収支報告書からお願い！"
"1009802-44-ホシノ" = "いや、在庫管理表も手を付けてなかったっけ……。"
"1009802-45" = "（こうして、ホシノの書類仕事を手伝い始めた）"
"1009802-46" = "[ns] \"これで終わりかな？\""
"1009802-47-ホシノ" = "……。"
"1009802-48-ホシノ" = "すごいよ、先生！"
"1009802-49-ホシノ" = "おじさんだけだったら、絶対に3日はかかってたのに！"
"1009802-50-ホシノ" = "やっぱり先生に頼って良かった～！"
"1009802-51" = "[s] \"書類仕事なら、いつもやってるから。\""
"1009802-52-ホシノ" = "そっか、さすがは大人だね。"
"1009802-53-ホシノ" = "いや～本当に助かったよ。"
"1009802-54-ホシノ" = "ありがとう、先生。"
"1009802-55" = "[s] \"どういたしまして。\""
"1009802-56" = "[ns] \"それで、お礼なんだけど……。\""
"1009802-57-ホシノ" = "う、うへ～。#nやっぱりそうなるよね……。"
"1009802-58-ホシノ" = "まぁ、先生に助けてもらったのは事実だし。"
"1009802-59-ホシノ" = "おじさんにできることなら、何でも言ってよ。"
"1009802-60-ホシノ" = "……でも、あんまり恥ずかしくないやつでお願いしたいかな。"
"1009802-61" = "[ns3] \"体操服を着てほしいんだ！\"\n[ns4] \"スクール水着を着てほしいんだ！\""
"1009802-62-ホシノ" = "うへっ！？"
"1009802-63-ホシノ" = "せ、先生……？"
"1009802-64-ホシノ" = "おじさんのそんな格好が見たいって……本気で言ってるの？"
"1009802-65" = "[s] \"本気だよ！絶対可愛いと思う！\""
"1009802-66-ホシノ" = "か、可愛いって……#n先生はす～ぐ平気でそういうこと言うんだから。"
"1009802-67-ホシノ" = "でも、褒めたところで無理なものは無理だよ。"
"1009802-68-ホシノ" = "恥ずかしいのもそうだけど……。"
"1009802-69-ホシノ" = "そんな姿をみんなに見られたら……。"
"1009802-70-ホシノ" = "「ん、人の好みはそれぞれ……」とか、"
"1009802-71-ホシノ" = "「わぁ☆ホシノ先輩、可愛いです☆」とか絶対言われるじゃん！"
"1009802-72-ホシノ" = "……後輩たちから質問攻めに遭うのは勘弁だよ。"
"1009802-73" = "[s] \"けど、さっきは何でもしてくれるって……。\""
"1009802-74-ホシノ" = "何でも「言って」とは言ったけど、#n何でも「する」とは言ってないでしょ！"
"1009802-75-ホシノ" = "せ、せめてもう少し恥ずかしくないお願いで……。"
"1009802-76" = "[s] \"じゃあ、前に着てた戦闘服は？\""
"1009802-77-ホシノ" = "戦闘服って……。"
"1009802-78-ホシノ" = "たぶん、あれのことだよね。"
"1009802-79-ホシノ" = "一応、あるにはあるけど……。"
"1009802-80" = "[ns] \"じゃあ、それでお願いします！\""
"1009802-81-ホシノ" = "急に元気になったね……。"
"1009802-82-ホシノ" = "あれも恥ずかしいんだけどなぁ……。"
"1009802-83" = "[s] \"お願いします！この通り！！\""
"1009802-84-ホシノ" = "……はぁ。"
"1009802-85-ホシノ" = "ま、体操服とかスクール水着よりはマシかな。"
"1009802-86-ホシノ" = "うへぇ。"
"1009802-87-ホシノ" = "まさか、またこの格好をするとはね。"
"1009802-88-ホシノ" = "先生って、こういうのが好きなの……？"
"1009802-89" = "[ns] \"うん、かっこいいよ！\""
"1009802-90-ホシノ" = "そ、そう？"
"1009802-91-ホシノ" = "うへへ、ちょっと恥ずかしいけど……。"
"1009802-92-ホシノ" = "先生が喜んでくれたなら、まぁいっか。"
"1009802-93" = "[s] \"一週間、この格好で過ごしてね！\""
"1009802-94-ホシノ" = "い、一週間も！？"
"1009802-95-ホシノ" = "さすがに、それは……。"
"1009802-96" = "[s] \"だって、すごく似合ってるよ！\""
"1009802-97-ホシノ" = "に、似合ってるって……。"
"1009802-98" = "[s] \"ホシノ最高！\""
"1009802-99-ホシノ" = "そ、そんなお世辞で落ちるくらい、おじさんはそんなにチョロくないよ。"
"1009802-100" = "[s] \"お世辞じゃないよ、本当にかっこいいから！\""
"1009802-101-ホシノ" = "うぅ……。"
"1009802-102-ホシノ" = "分かったよ。"
"1009802-103-ホシノ" = "それじゃ、一週間だけだからね？"
"1009802-104-ホシノ" = "うへぇ、そんな嬉しそうな顔しちゃって……。#nそこまで喜ばれると、おじさん恥ずかしいなぁ。"
"1009802-105-ホシノ" = "ほんと、先生って……。"
"1009802-106" = "[ns] \"何の音？\""
"1009802-107-ホシノ" = "……警報だね。"
"1009802-108-ホシノ" = "不審者が現れたり、非常事態があった時にアラートが鳴る仕組み。"
"1009802-109-ホシノ" = "……ヘルメット団だ。"
"1009802-110-ホシノ" = "学校の掲示板で何をしてるんだろ……。"
"1009802-111-ホシノ" = "とにかく、こうしちゃいられないね。"
"1009802-112-ホシノ" = "行こう、先生。"
"1009802-113-ヘルメット団幹部A" = "本当にやっちゃって良いのか？"
"1009802-114-ヘルメット団幹部B" = "良いんだよ！#n潰れかけてる学校の掲示板なんて、必要ないだろ。"
"1009802-115-ヘルメット団幹部B" = "だったら、ウチらが有効活用してやろうぜ！"
"1009802-116-ヘルメット団幹部A" = "たしかに、使われてる形跡もないし……。"
"1009802-117-ヘルメット団幹部B" = "おい、お前ら！#n早く運び出すぞ！"
"1009802-118-一同" = "はいっ！"
"1009802-119-？？？" = "君たち、何してるのかな。"
"1009802-120-ヘルメット団幹部A" = "そりゃ、これを奪って換金――"
"1009802-121-一同" = "っ！？"
"1009802-122-ホシノ" = "抵抗せずに、大人しくした方が良いと思うけどな～。"
"1009802-123-ヘルメット団幹部B" = "なんか文句でもあるのか？"
"1009802-124-ヘルメット団幹部B" = "待て。#nあんな武装をしてるってことは、只者じゃ……。"
"1009802-125-ホシノ" = "えっと、これには事情があって……。"
"1009802-126-ホシノ" = "まあ、それは置いといて。#nその掲示板、うちの設備だから持って行かないでほしいんだよね。"
"1009802-127-ヘルメット団幹部A" = "錆びたまま放置されてるじゃねぇか。"
"1009802-128-ヘルメット団幹部A" = "どうせ使われてないんだったら、ウチらがもらっていっても良いだろ？"
"1009802-129-ホシノ" = "……。"
"1009802-130-ホシノ" = "うーん。"
"1009802-131-ホシノ" = "あんまり問題にはしたくないんだけどなぁ。"
"1009802-132-ホシノ" = "いくら使ってないとはいえ、学校の財産なんだよね。\n"
"1009802-133-ホシノ" = "そっちが引き下がらないなら、戦うしかないか……。"
"1009802-134-ヘルメット団幹部B" = "……やんのか？"
"1009802-135-ヘルメット団幹部B" = "いくら武装したところで、この数に勝てるとでも？"
"1009802-136-ヘルメット団幹部B" = "お前ら、囲め！"
"1009802-137-ヘルメット団幹部B" = "痛い目に遭いたくなかったら、今のうち――"
"1009802-138-ヘルメット団幹部A" = "おい、大丈夫か！？"
"1009802-139-ヘルメット団幹部A" = "くそっ。やるぞ、お前ら！"
"1009802-140-ホシノ" = "……へぇ。"
"1009802-141-ホシノ" = "意外と根性あるね。"
"1009802-142-ホシノ" = "うへぇ。"
"1009802-143-ヘルメット団員" = "……ぐっ。"
"1009802-144-ヘルメット団幹部A" = "ひ、一人で、これだけの人数を……！"
"1009802-145-ヘルメット団幹部A" = "チッ、覚えとけよ！"
"1009802-146-ホシノ" = "今どき「覚えとけよ」なんていかにもな捨て台詞、#nそうそう聞かないよねぇ。"
"1009802-147-ホシノ" = "って、先生は大丈夫だった？#n怪我してない？"
"1009802-148" = "[s] \"ホシノ……。\""
"1009802-149-ホシノ" = "ん？"
"1009802-150-ホシノ" = "どうしたの、せんせ――"
"1009802-151" = "[ns] \"格好良かったよ！\""
"1009802-152-ホシノ" = "大げさだなぁ、先生は。"
"1009802-153-ホシノ" = "いつもと変わらないでしょ。"
"1009802-154-ホシノ" = "……うん？#nこの装備で戦ってる姿が新鮮だったの？"
"1009802-155" = "[s] \"まるで……\""
"1009802-156" = "[ns] \"ヒーローみたいだった！\""
"1009802-157-ホシノ" = "うへ～。"
"1009802-158-ホシノ" = "アニメとか映画に出てくるアレだよね？"
"1009802-159-ホシノ" = "おじさんとヒーローって、正反対な気がするけど……。"
"1009802-160" = "[s] \"大切な学校を守るために戦う姿は、まさにヒーローだよ！\""
"1009802-161-ホシノ" = "うへぇ、そんなに褒められると恥ずかしいよ。"
"1009802-162-ホシノ" = "……えっ。"
"1009802-163-ホシノ" = "タカナシ・ナイトって？"
"1009802-164-ホシノ" = "せ、先生の考えたヒーロー名！？"
"1009802-165" = "[ns] \"アビドスのヒーロー頑張れ～！\""
"1009802-166-ホシノ" = "……うぅ。"
"1009802-167-ホシノ" = "これならスクール水着のほうがマシだったかも……。"
