[translation]
"1009805-1" = "ヒーロー、決戦"
"1009805-2-ホシノ" = "あ、先生。"
"1009805-3-ホシノ" = "来てくれて助かったよ。"
"1009805-4" = "[s1] \"ホシノ一人で大丈夫？\"\n[s2] \"アジトってことは、たくさん人がいるはずじゃない？\""
"1009805-5-ホシノ" = "うへ～、一人なんかじゃないでしょ。"
"1009805-6-ホシノ" = "頼もしい相棒が、ここにいるじゃん。"
"1009805-7" = "[s] \"あれ、もう照れなくなったんだね。\""
"1009805-8-ホシノ" = "まぁ、あれだけヒーローって呼ばれてたらねぇ。"
"1009805-9-ホシノ" = "よっぽどのことがなければ、もう動揺しないかな……？"
"1009805-10-ホシノ" = "……うへへ。#nやっぱり、まだちょっと恥ずかしいかも。"
"1009805-11-ホシノ" = "ま、とりあえず商店街を見て回ろっか。"
"1009805-12-ホシノ" = "……そんなに余裕ぶってる時間はあるのか、って？"
"1009805-13-ホシノ" = "正直に言うと、アジトの場所が合っているのかすら、まだ分かんないし。"
"1009805-14-ホシノ" = "だから、まあ焦っても仕方ないよ。"
"1009805-15" = "[s] \"これがヒーローの余裕……。\""
"1009805-16" = "[ns] \"正体を隠して周囲に溶け込むのも、ヒーローには大事だよね！\""
"1009805-17-ホシノ" = "うへ～、なんか勝手に解釈されてるけど……。"
"1009805-18-ホシノ" = "ま、どっちでもいっか。"
"1009805-19-ホシノ" = "それじゃ、出発しよ～。"
"1009805-20-小物ショップの店主" = "いらっしゃいませ！"
"1009805-21-ホシノ" = "うへへ～、可愛い物がいっぱいだね。"
"1009805-22-ホシノ" = "見て見て、先生。#n[ruby=くじら]鯨の[/ruby]ポーチがあるよ！"
"1009805-23-ホシノ" = "チョッキに付けても似合うかな……。"
"1009805-24" = "[s] \"買ってあげるよ。\""
"1009805-25-ホシノ" = "うへっ？#nあ、いや、そういう意味で言ったわけじゃ……。"
"1009805-26-ホシノ" = "ヒーローにはマスコットが必要、って……？"
"1009805-27-ホシノ" = "……そういうものなんだ。"
"1009805-28-ホシノ" = "じゃあ、ありがたくもらおうかな？"
"1009805-29-ホシノ" = "うん、やっぱり可愛いね。#nありがとう、せんせ～。"
"1009805-30-ホシノ" = "うへ～、美味しそうな匂いだぁ。"
"1009805-31-ホシノ" = "この辺り、食べ歩きしてる人たちが多くない？"
"1009805-32-ホシノ" = "お店の数は少ないけど、#nどれも美味しいから人が集まってるんだろうねぇ。"
"1009805-33-ホシノ" = "少数精鋭って、こういう時にも使って良いのかな？"
"1009805-34" = "[s] \"たぶん良いんじゃない……？\""
"1009805-35-ホシノ" = "ね、先生。そろそろお昼の時間だし……。"
"1009805-36-ホシノ" = "私たちも食べ歩きしない？"
"1009805-37-ホシノ" = "まずは、あそこのたこ焼きから！"
"1009805-38-ホシノ" = "うへ～、やっぱり商店街は良いね。#n買い物も食事も一緒に済ませられるし。"
"1009805-39-ホシノ" = "先生も楽しめてる？"
"1009805-40" = "[s] \"もちろんだよ。\""
"1009805-41" = "[ns] \"今日はヒーローの日常パートだね。\""
"1009805-42-ホシノ" = "日常パートかぁ……。"
"1009805-43-ホシノ" = "……うへへ。#n先生とのんびり過ごすのは、楽し――"
"1009805-44-ホシノ" = "……先生、あれ見て。"
"1009805-45-ヘルメット団員" = "サンドイッチと……。"
"1009805-46-ヘルメット団員" = "あ、飲み物も頼む。"
"1009805-47-ホシノ" = "……ヘルメット団。"
"1009805-48-ホシノ" = "少し監視しよう。"
"1009805-49-ヘルメット団員" = "お釣りは大丈夫だ。"
"1009805-50-商店の主人" = "……えっ？#nあ、ありがとうございました！"
"1009805-51-ホシノ" = "お釣りを快くあげるだなんて……。"
"1009805-52-ホシノ" = "やっぱり怪しくない？#nいつもとは違う気がする。"
"1009805-53" = "[s] \"後をつけてみようか？\""
"1009805-54-ホシノ" = "……うん。"
"1009805-55-ホシノ" = "見つからないように、距離を保とう。"
"1009805-56-ヘルメット団幹部" = "遅かったなぁ！？#n急げって言ったのによ……。"
"1009805-57-ヘルメット団員" = "す、すみません！"
"1009805-58-ヘルメット団幹部" = "もういい。#nおら、さっさと食って残りの仕事を終わらせるぞ。"
"1009805-59-ヘルメット団幹部" = "今のうちに、たんまり稼いでおかないとな。"
"1009805-60-ヘルメット団たち" = "はいっ！"
"1009805-61-ホシノ" = "……旧校舎？"
"1009805-62-ホシノ" = "砂に埋もれていたはずじゃ……。"
"1009805-63" = "[s] \"この前の砂嵐の影響かな？\""
"1009805-64-ホシノ" = "……そうかもしれない。"
"1009805-65-ホシノ" = "偶然、ここを見つけたヘルメット団は、#n金になりそうな物を集めて売ってたんだ……。"
"1009805-66-ホシノ" = "装備が新しくなった理由も、#nほかの自治区で姿を見かけなくなった理由も、これで説明がつく。"
"1009805-67-ホシノ" = "……掲示板を盗もうとしてた連中みたいに。"
"1009805-68-ホシノ" = "これは見過ごせないね、先生。"
"1009805-69" = "[s] \"ヒーローの活躍パートだ！\""
"1009805-70-ヘルメット団幹部" = "ん？"
"1009805-71-ヘルメット団幹部" = "何の音だ？"
"1009805-72-ヘルメット団員" = "侵入者です！"
"1009805-73-ヘルメット団幹部" = "はっ。私たちに楯突くとは、怖い物知らずだな！"
"1009805-74-ヘルメット団幹部" = "お前たち、目にものを――"
"1009805-75-ホシノ" = "うへ～。"
"1009805-76-ヘルメット団員" = "た、隊長がやられた……！"
"1009805-77-ヘルメット団員" = "に、逃げろぉぉ！"
"1009805-78-ヘルメット団たち" = "お、おいっ！#n先に逃げんじゃねえ！"
"1009805-79-ホシノ" = "……さすがに、あの人数を追いかけるのはね。"
"1009805-80-ホシノ" = "でも、これであいつらも手を引くでしょ。"
"1009805-81" = "[s] \"さすが、アビドスのヒーロー！\""
"1009805-82-ホシノ" = "うへ～、照れるねぇ。"
"1009805-83-ホシノ" = "まぁ、ひとまず一件落着かな。#n先生もお疲れ～。"
"1009805-84-ホシノ" = "……うん？#nこれでしばらく静かになるのか、って？"
"1009805-85-ホシノ" = "それはどうだろね。"
"1009805-86-ホシノ" = "アビドスが今の状態であり続ける限り、#nすぐにまた別のトラブルが起こると思うよ。"
"1009805-87" = "[s] \"じゃあ、ヒーローの活動は続くんだね！？\""
"1009805-88-ホシノ" = "……。"
"1009805-89-ホシノ" = "うへ～、そうきたかぁ。"
"1009805-90-ホシノ" = "ま、たしかに続けるしかないかもね。"
"1009805-91-ホシノ" = "でも、おじさんのヒーロー活動が続くってことは……"
"1009805-92-ホシノ" = "つまり――"
"1009805-93" = "[s] \"つまり？\""
"1009805-94-ホシノ" = "先生には、これからもおじさんの相棒でいてもらわなきゃ。"
"1009805-95-ホシノ" = "うへへ～。#nこうなったからには、とことん付き合ってもらうよ。"
"1009805-96" = "[ns] \"もちろんだよ！\""
"1009805-97-ホシノ" = "うへへ、頼もしいねぇ。"
"1009805-98-ホシノ" = "じゃ、さっそくほかの商店街の様子も見にいこっか。"
"1009805-99-ホシノ" = "ついでに、おじさん綿菓子食べたいな～。"
