[translation]
"1002506-1" = "それは秘密の"
"1002506-2" = "梅花園の近くの公園"
"1002506-3-シュン" = "ここに私が昔、秘密基地にしてた場所があるんです。"
"1002506-4-シュン" = "最後に来たのは、どれくらい前くらいでしょうか……"
"1002506-5-シュン" = "とっても久しぶりな気がしますが、ほとんど変わっていませんね。"
"1002506-6-シュン" = "私の秘密基地も、撤去されてなくて良かったです。"
"1002506-7" = "[s] \"普通の公園に見えるけど……？\""
"1002506-8-シュン" = "それはそうですよ、簡単に探せたら「秘密基地」ではありませんし。"
"1002506-9-シュン" = "さあ先生、私の秘密基地を探し当ててみてください！"
"1002506-10" = "[ns1] \"滑り台の下の、この木の茂みの奥に……！\"\n[ns2] \"全然分からない……。\""
"1002506-11-シュン" = "残念、違います！"
"1002506-12-シュン" = "そこはただの茂みですよ、何もありません……多分。"
"1002506-13-シュン" = "あはは……まあ確かに、ぱっと見は本当にただの公園ですからね……。"
"1002506-14-シュン" = "では、そろそろ教えちゃいますね。"
"1002506-15-シュン" = "私の秘密基地は……"
"1002506-16-シュン" = "ここです！"
"1002506-17" = "[s] \"……土管？\""
"1002506-18-シュン" = "はい、廃棄された工事用の土管みたいなのですが、ちょうど子どもなら出入りできるくらいのサイズでして。"
"1002506-19-シュン" = "梅花園に通っていた昔の私は、何か悲しいことがあったり迷ったりすると、ここに来て心を落ち着かせていました。"
"1002506-20-シュン" = "誰も来ないこの中にいると、不思議と心が落ち着いてくるんです。"
"1002506-21-シュン" = "苦手な友達への愚痴を呟いてみたり、カッコいい教官になった未来の自分を想像してみたり……。"
"1002506-22" = "[s] \"シュンは昔から良い子で、大人っぽい子だったんだね。\""
"1002506-23-シュン" = "ふふっ、そうですかね？今思うと、自分としてはすごく子どもっぽい行動だったなあと思ってしまいますが……。"
"1002506-24-シュン" = "しばらくして身体も成長すると、入るには窮屈そうだったので、少しずつ足が遠のいて……。"
"1002506-25-シュン" = "ですが、今のこの身体なら、難なく入れそうです。"
"1002506-26-シュン" = "……あ、別に太ったからとか、そういうわけではありませんよ……！？あくまで身長とか、そういう諸々のことでして……！"
"1002506-27" = "[s] \"そ、そっか……。\""
"1002506-28-シュン" = "はい、そこは誤解しないでいただけますとありがたいです。"
"1002506-29-シュン" = "さて、では久しぶりに入ってみましょうか？先生はそこで待っていてくださいね。"
"1002506-30-シュン" = "んしょ……。"
"1002506-31" = "[wa:4100]― ふふ、[wa:1600]この中は[wa:750]ほとんど[wa:400]変わっていませんね。"
"1002506-32" = "― 私が書いた、[wa:1550]自分との約束も……"
"1002506-33" = "[wa:50]― あの時のままです。"
"1002506-34" = "[wa:1350]― 懐かしい……。"
"1002506-35" = "― この約束、[wa:1400]今こうして見てみると、"
"1002506-36" = "― ほとんどは[wa:500]守ることができましたね。"
"1002506-37" = "[wa:750]― では[wa:450]せっかくですし、"
"1002506-38" = "― 今度はここに[wa:1200]将来の夢でも[wa:850]書いてみましょうか？"
"1002506-39" = "[ns] \"将来の夢？どんな夢なの？\""
"1002506-40" = "[wa:1850]― そ、[wa:650]それは教えられません！"
"1002506-41" = "― 秘密です……！"
"1002506-42" = "[wa:1150]― 大人には[wa:550]教えられない、"
"1002506-43" = "[wa:50]― 子供だけの[wa:650]秘密……[wa:1270]ですから。[wa:980]ふふっ。"
"1002506-44-シュン" = "ふふっ、何だか気持ちまで童心に返った気分です。"
"1002506-45-シュン" = "久しぶりに、昔の私が考えていたことを思い出して……。"
"1002506-46-シュン" = "まさに、初心に返ることができました。"
"1002506-47" = "[s] \"私も頑張れば入れるかな……。\""
"1002506-48-シュン" = "ダメです。この秘密基地は子どもだけの秘密の空間ですので。"
"1002506-49-シュン" = "……その代わり、ではありませんが……これから先生と私だけの秘密を、たくさん作りましょう♡"
"1002506-50" = "その後、日が暮れるまで人けのない場所でシュンとたくさん遊んだ。"
