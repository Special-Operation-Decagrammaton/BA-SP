[translation]
"2004003-1" = "京極サツキは尋ねている"
"2004003-2" = "（サツキからの連絡後、しばらくして……）"
"2004003-3-サツキ" = "待たせたわね。"
"2004003-4" = "[s] \"こんにちは、サツキ……。\""
"2004003-5-サツキ" = "相変わらずシャーレのオフィスは狭いわね。"
"2004003-6-サツキ" = "[ruby=パンデモニウム・ソサエティー]万魔殿に来てく[/ruby]れるなら、#n広場全体を先生専用のオフィスにしてあげてもいいのよ？"
"2004003-7" = "[s1] \"いや、大丈夫。\"\n[s2] \"それは罰ゲームのような……。\""
"2004003-8-サツキ" = "ふうん……まだ応じないつもり？#nまあ、長期戦は覚悟の上だけど。"
"2004003-9-サツキ" = "前に言ったでしょう？まだまだ他にも方法があるって。"
"2004003-10-サツキ" = "今日は別の方法を試すつもりよ。"
"2004003-11-サツキ" = "そう――拷問をね。"
"2004003-12" = "[s] \"えっ！？\""
"2004003-13-サツキ" = "あら、あまりにも陳腐すぎて驚いたかしら？"
"2004003-14-サツキ" = "シャーレもよくやっているんじゃないの？"
"2004003-15" = "[s] \"そんな怖いことしないよ！？\""
"2004003-16-サツキ" = "ふふっ、でも私たちの拷問は少し特殊よ。#nきっと先生にもよく効くわ。"
"2004003-17-サツキ" = "はい、こちらに座ってちょうだい。"
"2004003-18" = "[s] \"いやいや！遠慮するよ。\""
"2004003-19-サツキ" = "野蛮なトリニティは、毒草でお茶を淹れたり、電動ノコギリを突きつけたりするらしいけど……。"
"2004003-20-サツキ" = "ゲヘナではそんな倫理に反した拷問はしないから、安心して頂戴。"
"2004003-21" = "（サツキに促されるまま椅子に座ってしまった……）"
"2004003-22-サツキ" = "それじゃあ、一つめの拷問よ。#n先生なら耐えられるかもしれないわね……ふふふっ。"
"2004003-23" = "（サツキは私の手を取り……）"
"2004003-24" = "[ns] \"わ、わわ私の爪をどうするつもり……！？\""
"2004003-25-サツキ" = "……さあ、耐えられるかしら？"
"2004003-26" = "[ns3] \"爪を、切ってる……？\"\n[ns4] \"これが拷問……？\""
"2004003-27-サツキ" = "うふふっ。まだ気付かないの？"
"2004003-28-サツキ" = "こーんなに短く切っちゃったら……"
"2004003-29-サツキ" = "もう可愛いネイルはできないのよ？"
"2004003-30" = "[s] \"……！\""
"2004003-31-サツキ" = "普通の生徒なら、人差し指あたりで情報を吐くわ。"
"2004003-32-サツキ" = "果たして先生は、どこまで耐えられるのかしら……？うふふっ……！"
"2004003-33-サツキ" = "これを止めたければ、「協力する」と言うことね。#n先生が言うまで私はやめないわよ？"
"2004003-34-サツキ" = "……。"
"2004003-35" = "（結局サツキは全部の爪を切ってくれた）"
"2004003-36-サツキ" = "本当に大丈夫なの？#nこんなに短い爪……耐えられるわけ？"
"2004003-37" = "[s] \"ありがとねサツキ。ちょうど切ろうと思ってたんだ。\""
"2004003-38-サツキ" = "さすがは先生ね……瞬きもせず平然としていられるだなんて。"
"2004003-39-サツキ" = "でも私はまだ諦めないわよ。#n次は……。"
"2004003-40-サツキ" = "これに着替えてきて頂戴。"
"2004003-41" = "[ns] \"ん……Tシャツ？\""
"2004003-42-サツキ" = "ええ。先生のクローゼットから持ってきたわ。"
"2004003-43-サツキ" = "今回の拷問には、真っ白なTシャツが必要なのよ。"
"2004003-44" = "（サツキの希望通りTシャツに着替えてきた）"
"2004003-45-サツキ" = "うふふっ。その格好もなかなか似合うわね。"
"2004003-46-サツキ" = "それじゃあ……今からこれを食べて頂戴。"
"2004003-47" = "[s5] \"これは……\"\n[s6] \"カレーうどん……？\""
"2004003-48-サツキ" = "アハッ！そうよ！#nこの恐ろしさにようやく気づいたのかしら？"
"2004003-49-サツキ" = "「食べるときに服を汚してしまう料理トップスリー」に入る、カレーうどんよ！"
"2004003-50-サツキ" = "普通のTシャツじゃないわ！汚れが最も目立つ、真っ白なTシャツを着て食べるのよ！当然、エプロンなどないわ！"
"2004003-51-サツキ" = "どう？このプレッシャー、耐えられる？#n普通の生徒なら食べる前から猛烈なストレスに苦しめられるのよ！"
"2004003-52-サツキ" = "果たして先生はどうかしら！？"
"2004003-53" = "[ns] \"おいし～！\""
"2004003-54-サツキ" = "何のためらいもなく食べ始めた……？#nこれは予想外だわ……。"
"2004003-55-サツキ" = "カレーが跳ねることもいとわない、この大胆さ……流石先生ね。"
"2004003-56" = "（カレーうどんを一瞬で平らげた）"
"2004003-57-サツキ" = "この拷問も失敗するなんて……大した人ね……ふふ。"
"2004003-58-サツキ" = "でも、ここからの私は本気よ。"
"2004003-59-サツキ" = "今度こそ、先生の協力を取り付けるんだから。"
"2004003-60" = "[s] \"なるほど……。\""
"2004003-61" = "（その後もサツキから様々な拷問？を試されたが）"
"2004003-62" = "（特にどれも苦に感じなかった……）"
"2004003-63-サツキ" = "万魔殿情報部の、恐怖の拷問が効かない……？"
"2004003-64-サツキ" = "これほどまでに鋼のメンタルを持ち合わせていたなんて……。"
"2004003-65-サツキ" = "ふぅ……これで最後の拷問よ。"
"2004003-66-サツキ" = "さあ、先生。手を縛れるよう、両手を後ろに出して頂戴。"
"2004003-67-サツキ" = "何をするつもり？と言わんばかりの表情ね。"
"2004003-68-サツキ" = "今回は手を使えないようにすることが大事なのよ。"
"2004003-69-サツキ" = "うふふっ……準備はできたわ。"
"2004003-70-サツキ" = "それじゃ、これを見て頂戴。"
"2004003-71" = "[ns] \"これは……ネコのおもしろ映像？\""
"2004003-72-サツキ" = "アハッ！そう。これはネコのいろんなシーンを集めたハイライト映像よ。"
"2004003-73-サツキ" = "これを見れば知らず知らず笑顔になっている自分がいる……そんな貴重な資料よ。"
"2004003-74-サツキ" = "さあ、そろそろね？#nこのクライマックスシーンで……。"
"2004003-75" = "[ns] \"ああっ……！広告が……！！\""
"2004003-76" = "[ns] \"手が縛られててスキップボタンが押せない……！\""
"2004003-77-サツキ" = "うふっ、うふふふふっ！どうかしら！！無力でしょう！？"
"2004003-78-サツキ" = "スキップボタンを押したいでしょう？次が気になるでしょう？アハハハッ！"
"2004003-79-サツキ" = "この広告は1分もあるのよ？#nしかも30秒ごとに広告が流れるわ！"
"2004003-80" = "[s] \"な、なんて残酷な……。\""
"2004003-81-サツキ" = "悪質でしょう？恐ろしいでしょう！？"
"2004003-82-サツキ" = "終わりの見えない悪夢のような時間……でも先生が私たちに忠誠を誓うのなら、腕を解放してあげてもいいのよ！うふふふっ！"
"2004003-83-サツキ" = "……。"
"2004003-84-サツキ" = "うっ……まさか私まで次のシーンが気になるなんて。"
"2004003-85-サツキ" = "私も一緒に観ているのを失念していたわ。"
"2004003-86-サツキ" = "この広告いつ終わるのよ！もう！"
"2004003-87" = "（後ろからサツキがもたれてきた）"
"2004003-88" = "[ns7] \"さ、サツキ……？\"\n[ns8] \"ち、近い……。\""
"2004003-89-サツキ" = "ふぅ……ふぅ……。#n押したい……！広告なんてイヤ……！！"
"2004003-90" = "（サツキの荒い息が首元にかかっている……）"
"2004003-91" = "[ns] （な、なんだか、存在しない秘密基地の場所を言っちゃいたい！）"
"2004003-92" = "[ns] \"あ……広告終わっちゃった。\""
"2004003-93-サツキ" = "ふーん……ネコの尻尾ってあんな風に逆立つのね。"
"2004003-94-サツキ" = "この拷問はダメね。私まで気になっちゃうもの。"
"2004003-95" = "[ns] （よ、よかった……）"
"2004003-96-サツキ" = "先生……厳しい拷問をよく耐え抜いたわね。さすがだわ。"
"2004003-97-サツキ" = "でも私も学んだことがあるのよ。"
"2004003-98-サツキ" = "次を期待してて頂戴？ふふふっ。"
"2004003-99" = "[ns] \"さ、サツキ！？この縄を解いてから…‥！！\""
"2004003-100" = "（結局、他の生徒に縄をほどいてもらった…‥）"
"2004003-101" = "（……また変な噂が広まりそうだ）"
