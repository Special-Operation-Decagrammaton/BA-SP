[translation]
"11005-1-ユウカ" = "着いた！！"
"11005-2-ハスミ" = "はい。"
"11005-3-リン" = "「シャーレ」部室の奪還完了。 私も、もうすぐ到着予定です。 建物の地下で会いましょう。"
"11005-4" = "シャーレ・建物の地下"
"11005-5-ワカモ" = "うーん……これが一体何なのか、まったく分かりませんね。これでは壊そうにも……。"
"11005-6-ワカモ" = "……あら？"
"11005-7" = "[s1] 怪しい生徒と出くわしてしまった。\n[s2] 挨拶する。"
"11005-8-ワカモ" = "あら、あららら……。"
"11005-9-ワカモ" = "あら、あららら……。"
"11005-10-ワカモ" = "……。"
"11005-11-ワカモ" = "あ、ああ……。"
"11005-12-ワカモ" = "し、し……。"
"11005-13-ワカモ" = "失礼いたしましたー！！"
"11005-14" = "[s] \"……？\""
"11005-15" = "シャーレ・建物の地下"
"11005-16-リン" = "お待たせしました。"
"11005-17-リン" = "……？何かありましたか？"
"11005-18" = "[s] \"ううん、大丈夫。\""
"11005-19-リン" = "……そうですか。ここに、連邦生徒会長の残したものが保管されています。"
"11005-20" = "（スッ）"
"11005-21-リン" = "……幸い、傷一つなく無事ですね。"
"11005-22-リン" = "……受け取ってください。"
"11005-23" = "[s] \"タブレット端末……？\""
"11005-24-リン" = "はい。これが、連邦生徒会長が先生に残した物。#n「シッテムの箱」です。"
"11005-25" = "[s] （どこかで聞いたことある名前……）"
"11005-26-リン" = "普通のタブレットに見えますが、実は正体の分からない物です。製造会社も、OSも、システム構造も、動く仕組みのすべてが不明。"
"11005-27-リン" = "連邦生徒会長は、この「シッテムの箱」は先生の物で、先生がこれでタワーの制御権を回復させられるはずだと言っていました。"
"11005-28-リン" = "私たちでは起動すらできなかった物ですが、先生ならこれを起動させられるのでしょうか、それとも……。"
"11005-29" = "[s] \"…………。\""
"11005-30-リン" = "……。"
"11005-31-リン" = "……では、私はここまでです。ここから先は、全て先生にかかってます。"
"11005-32-リン" = "邪魔にならないよう、離れています。"
"11005-33" = "…………。"
"11005-34" = "[ns] 「シッテムの箱」を起動させる。"
