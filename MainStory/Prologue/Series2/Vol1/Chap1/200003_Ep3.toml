[translation]
"200003-1" = "第3話;奇妙な夢"
"200003-2" = "「これは――シャーレの先生である『あなた』と、『スマートウォッチ』に関する物語です」"
"200003-3" = "「あなたは不規則な生活を送っていますが、#nそれでも早起きをしようと努力していました」"
"200003-4" = "「サイドテーブルに置かれたスマートウォッチが、あなたの起床を手伝う唯一無二のアシスタントです」"
"200003-5" = "[ns1] \"アロナ……？\"\n[ns2] \"シッテムの箱はどこ？\""
"200003-6" = "「どうやら、あなたはまだ眠りの中にいるようです。#nなぜなら、見つかるはずのないタブレットを探しているのですから」"
"200003-7" = "「……あなたが連邦生徒会長からもらった電子機器は、「シャーケードの杖」と呼ばれるスマートウォッチだけだというのに」"
"200003-8" = "[s] シッテムの箱を探す。"
"200003-9" = "「寝室を探し回りますが、見つからずに終わるでしょう」"
"200003-10" = "「あなたは考えます。タブレットをどこかへ置いてきてしまったのではないかと」"
"200003-11" = "「慣れた仕草でスマートウォッチをつけて、あなたは休憩室へと向かいます」"
"200003-12" = "「まだ明かりのついていない休憩室の中で、#nあなたはいつも通りコーヒーマシンの電源を入れて、エスプレッソを一杯淹れました」"
"200003-13" = "「豆を挽く音が響き、黒い液体がカップを満たしていきます。#n香りがほとんどない安物ですが、眠気覚ましにピッタリです」"
"200003-14" = "「一息に飲み干して、あなたは執務室へと向かいます」"
"200003-15" = "「執務室に着いたあなたは、別の異変に気づきました」"
"200003-16" = "「普段ならいるはずの当番の生徒がいません。#nしかし、遅刻することもあるだろう、と大して気にも留めませんでした」"
"200003-17" = "「……カーテンを開けるまでは」"
"200003-18" = "[ns] \"え……？\""
"200003-19" = "「ようやく第三の異変に気づきます」"
"200003-20" = "「世界がモノクロになっていたのです。輝きに満ち、鮮やかな色で彩られていたキヴォトスから色が抜け落ち、灰色に染まっていました」"
"200003-21" = "「曇り空ではありません。世界のすべてがモノトーンになっているのです」"
"200003-22" = "「……そして、人の気配が全くありません」"
"200003-23" = "「まるで、あなただけを残していなくなってしまったかのように」"
"200003-24" = "[ns] \"この声は……なに？\""
"200003-25" = "「数々の異変に混乱するあなたは、頭の中に浮かぶ言葉にすら疑問を抱くようになります」"
"200003-26" = "「ですがご安心を。これだけは異変ではありません」"
"200003-27" = "「物語を綴る時――感情描写の観点から一人称視点で書き始めたものの、物語の展開に行き詰まって三人称視点へ切り替えてしまう。#nそれは、初めて筆を執る人によく見られる現象です」"
"200003-28" = "「……失礼。共感しづらい話題だったかもしれません」"
"200003-29" = "「話を戻しましょう。あなたは上着を羽織って急いで病院へと向かいます。#n自分の身に何が起きているのか、明らかにしようとするでしょう」"
"200003-30" = "[ns] 連邦生徒会のビルに向かう。"
"200003-31" = "「……いえ、あなたは別の方法をとりました」"
"200003-32" = "「連邦生徒会へ向かっている間も、周りの景色は変わりません」"
"200003-33" = "「揺れる車内も、色を忘れてしまったかのようにモノクロに染まっています」"
"200003-34" = "「あなたは……以前目にした光景を思い出しました」"
"200003-35" = "「あの時、世界は鮮烈な赤に染まっていました。それでも――」"
"200003-36" = "「生徒たちが共にいました」"
"200003-37" = "「ですが――今は違います」"
"200003-38" = "「連邦生徒会の建物に着いたあなたは隅々まで見て回るでしょう。#nしかし依然として人の気配はありません」"
"200003-39" = "「小言を言いながらもあなたの面倒をみてくれたメガネの行政官も、#nいつも明太子味のポテトチップスを頬張っている桃色髪の役員も――誰もいません」"
"200003-40" = "「……あなたは最後に「あの場所」へ向かいます」"
"200003-41" = "「まるで何かに追い立てられるように階段を駆け上がりました」"
"200003-42" = "「すべてが始まった、あの場所へ」"
"200003-43" = "「連邦生徒会長の執務室。そこには、見知らぬ少女が――」"
"200003-44" = "「いえ。どこか懐かしさを感じさせる少女が座っていました」"
"200003-45" = "[ns] \"この声は……君なの？\""
"200003-46" = "「はい。ですが同時に……いいえ、でもあります」"
"200003-47" = "「この世界は少女の回顧であり、あなたの夢」"
"200003-48" = "「あなたが少女を見ているように、少女もあなたを見ています」"
"200003-49" = "[ns] \"君は誰？\""
"200003-50-？？？" = "お会いできて嬉しいです、先生。"
"200003-51-？？？" = "私はキヴォトスの――"
"200003-52" = "[ns] \"ここは……。\""
"200003-53-アロナ" = "先生、大丈夫ですか！？"
"200003-54-アロナ" = "ずっとうなされていたので心配しました！"
"200003-55" = "[s] \"夢……？\""
"200003-56-プラナ" = "推察。悪夢でも見たのでしょうか。"
"200003-57" = "[s] \"ううん。悪夢ではなかったけど……。\""
"200003-58" = "[ns] \"変な夢ではあったかな。\""
"200003-59-プラナ" = "悪夢でないのはなによりですが……。"
"200003-60-プラナ" = "定期的に健康診断を受けることをオススメします。睡眠障害には、様々な原因が潜んでいますから。"
"200003-61-アロナ" = "不規則な生活をしているからですよ！#nスーパーアロナちゃんには全部わかっているんですから！"
"200003-62-アロナ" = "これからは食事の時間にはお声がけしますね。ちゃんと食べてください！"
"200003-63" = "[s] \"心配かけてごめんね。ありがとう。\""
"200003-64" = "[ns] \"……「シャーケードの杖」って知ってる？\""
"200003-65-プラナ" = "……否定。私のメモリには記録されていません。"
"200003-66-アロナ" = "うーん……聞いたことがあるような……無いような……。"
"200003-67-アロナ" = "先生は一体どこで聞いたんですか？"
"200003-68" = "[s] \"私もよく思い出せなくて……。\""
"200003-69" = "[ns3] \"夢のことは後で考えるとして……。\"\n[ns4] \"ちょっと早いけど、今日の仕事を始めようか。\""
"200003-70-アロナ" = "まだ朝4時ですよ！？"
"200003-71-プラナ" = "推奨。健康のためにも、再び就寝することをおすすめします。"
"200003-72-アロナ" = "そうですよ！ベッドに戻ってください。"
"200003-73-アロナ" = "寝付けないなら、子守唄を歌いますから！"
"200003-74-プラナ" = "私たちに歌唱プラグインはありませんが……頑張ります。"
"200003-75" = "次回;輝くトラペゾヘドロン"
