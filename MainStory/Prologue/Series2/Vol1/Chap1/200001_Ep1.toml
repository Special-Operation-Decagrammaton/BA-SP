"200001-80-？？？" = "ついに見つけた――求めていた全てが、ここにあったのだ！"
"200001-81-？？？" = "最早、記号を探さずとも良い。#n自ずと向こうから来るのだから！"
"200001-82-？？？" = "来い、甘美なる現実よ。"
"200001-83" = "さあ――私は実在として、其方を迎え入れよう！"
