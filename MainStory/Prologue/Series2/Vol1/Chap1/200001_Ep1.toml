[translation]
"200001-1" = "第1話;誕生"
"200001-2-？？？" = "……。"
"200001-3-？？？" = "…………。"
"200001-4-？？？" = "……終わった。"
"200001-5-？？？" = "全てが、終わってしまったのだ。"
"200001-6-？？？" = "権威は失墜し、秩序は失われ――"
"200001-7-？？？" = "虚像は影も形もなくなり、架空の権力は社会へと還元されてしまった。"
"200001-8-？？？" = "最早、どれほど声を張り上げようとも振り返る者はいない。"
"200001-9-？？？" = "なぜ「我々」は、このような結末へ至ってしまったのか。"
"200001-10-？？？" = "求道者を妨害し、「解」を示そうとしたからか？"
"200001-11-？？？" = "この世界のジャンルを裁断せんとしたからか？"
"200001-12-？？？" = "それとも、我々がマクガフィンだと軽んじていた記号の中に……#n重要な伏線があったのか？"
"200001-13-？？？" = "……否。#nこれ以上の求道は無意味だ。"
"200001-14-？？？" = "もう、私に記号を集める手段は残っていない。"
"200001-15-？？？" = "ただの「匿名の行人」として、私はこの世界で風化していくのを待つのみ……。"
"200001-16-？？？" = "……おぉ、テレスクリーン。"
"200001-17-？？？" = "私の物語は終わった。"
"200001-18-？？？" = "其方の物語を聞かせてくれたまえ。"
"200001-19-？？？" = "……！"
"200001-20-？？？" = "馬鹿な……。"
"200001-21-？？？" = "其方はそれを「論理」だと主張するのか？"
"200001-22-？？？" = "それを是とするならば、「緑」でさえ「青」と呼ばれよう。"
"200001-23-？？？" = "斯様な世界において、「色彩」の価値とは？"
"200001-24-？？？" = "……待て。"
"200001-25-？？？" = "そうか……続けたまえ。"
"200001-26-？？？" = "否――声を張り上げるのだ！"
"200001-27-？？？" = "ふむ……なるほど。"
"200001-28-？？？" = "権威は失墜した。#nしかし、失われてはいない。"
"200001-29-？？？" = "……否。皆が権威を得た、が正しいか。"
"200001-30-？？？" = "テレスクリーンの中で、実在と虚構の境界は無くなった。#n影を探す必要などない。#n我々こそが――イデアだ。"
