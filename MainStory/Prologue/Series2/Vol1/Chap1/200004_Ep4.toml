[translation]
"200004-1" = "第4話;輝くトラペゾヘドロン"
"200004-2-部長" = "ね、ねぇ……。"
"200004-3-部長" = "帰ってくるの、遅くないかな？"
"200004-4-部員A" = "……まだ潜って3分も経ってない。"
"200004-5-部長" = "で、でも水中では何が起こるか分からないし……。"
"200004-6-部長" = "急流に流されてないかな？#n危ない生き物に襲われてないかな？"
"200004-7-部員A" = "……分からない。"
"200004-8-部員A" = "でも、あの子たちなら大丈夫。"
"200004-9-部員A" = "……合図だ。"
"200004-10-部長" = "ビーコンの位置は？"
"200004-11-部員A" = "南東1000フィート。"
"200004-12-部員A" = "だいぶ遠くまで流されたね。#n暗いし、迎えに行こっか。"
"200004-13-部員C" = "ふぅ……。"
"200004-14-部員A" = "……予定のポイントより離れてる。どうしたの？"
"200004-15-部員B" = "ごめんごめん。思ったより流れが速くてさ。#nちょっと方向の調整に手間取っちゃって。"
"200004-16-部長" = "……減圧はちゃんとした？"
"200004-17-部員B" = "当然。私を誰だと思ってるの？"
"200004-18-部員A" = "私は別にしなくても平気だけど……。"
"200004-19-部長" = "油断は禁物。水中では何が起きてもおかしくないんだから。"
"200004-20-部員C" = "うぅ……。"
"200004-21-部員A" = "それで、「難破船」の中はどうだった？"
"200004-22-部員B" = "収穫ゼロ。時間が経ちすぎてる。"
"200004-23-部長" = "やっぱ今回もダメかぁ……。"
"200004-24-部員B" = "あ、でも……面白いものは見つけたよ。"
"200004-25-部長" = "これはガラスの欠片……？"
"200004-26-部員A" = "ガラスより固そう……綺麗な形をしてるね。"
"200004-27-部員B" = "なんか光ってるようにも見えるよね。ちょっと宝石っぽくない？"
"200004-28-部長" = "そうだね。この光……夕暮れに染まる水平線みたい。"
"200004-29-部員A" = "……あまり見すぎないようにね。#nどんな影響があるか分からないし。"
"200004-30-部員C" = "皮膚が焼けちゃうかも……。"
"200004-31-部員B" = "んで、この任務いつまで続けるの？"
"200004-32-部員A" = "いまさら？"
"200004-33-部長" = "……新しい指示が来るまで。勝手にやめちゃいけないよ。"
"200004-34-部長" = "これが、私たちの使命だもの。"
"200004-35-部員C" = "シワシワになっちゃう……。"
"200004-36-部長" = "……今日はここまで。#nそろそろ帰ろっか。"
"200004-37-部長" = "この――「輝くトラペゾヘドロン」を持って。"
