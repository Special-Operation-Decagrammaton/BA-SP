[translation]
"70006010-1" = "美食とクッキー、そして救護（１）"
"70006010-2-ジュンコ" = "あー、お腹空いた……。今日のお昼は何にするの？"
"70006010-3-ハルナ" = "あら、もう良い時間ですわね。"
"70006010-4-イズミ" = "私はみんなと食べられるなら何でもいいよ！"
"70006010-5-アカリ" = "それなら、食べ放題でしょうか。"
"70006010-6-ハルナ" = "私、金欠なんだよね……最近の食べ放題高くない？"
"70006010-7-ハルナ" = "低価格でありながらボリューミーで、満足のいく味のお店を探す……大変悩ましいお題ですね。"
"70006010-8-アカリ" = "うふふっ★良い事を思いつきました。"
"70006010-9-アカリ" = "もしかして……アレやるの？"
"70006010-10-イズミ" = "アレだね！"
"70006010-11-アカリ" = "ええ。アレですよ★"
"70006010-12-ハルナ" = "そうですか、なるほど……皆さんがそう仰るのであれば。"
"70006010-13-ハルナ" = "今日も、フウカさんにお願いしに行きましょうか。"
"70006010-14-ジュンコ" = "いや、それさ……。"
"70006010-15-ジュンコ" = "いっつも「お願い」じゃなくない！？"
"70006010-16-イズミ" = "「お願い」にもいろんな種類があるんですから。誤解しちゃダメですよ★"
"70006010-17-イズミ" = "私はフウカが作ってくれるものなら何でもいいよ！"
"70006010-18-ハルナ" = "はぁぁ、もー……。"
"70006010-19-ジュンコ" = "あら。少々お待ちを。"
"70006010-20-ハルナ" = "……ジュリさんからですね。"
"70006010-21-ハルナ" = "はい、[ruby=くろだて]黒舘[/ruby]です。どうかなさいましたか？"
"70006010-22-ジュリ" = "もしもし、ハルナさん。#nその、確認したいことがありまして……。"
"70006010-23-ジュリ" = "フウカ先輩、今そちらにいらっしゃいますか？"
"70006010-24-ジュンコ" = "いえ、ちょうど私たちも伺おうとしていたところなのですが……。"
"70006010-25-ジュンコ" = "というかそれ、私たちに聞いていいの？"
"70006010-26-ジュリ" = "あっ、連絡がつかない時は大体皆さんとご一緒だったので……。"
"70006010-27-ジュリ" = "今日は違うんですね。"
"70006010-28-ジュリ" = "どこに行ったんだろう……油がもう切れちゃいそうなのに……。"
"70006010-29-アカリ" = "ああ、油でしたらキッチンの入口側にある棚の奥にありますよ。"
"70006010-30-ジュリ" = "えっと、この棚の奥に……。"
"70006010-31-ジュリ" = "ありました！ありがとうございます……！"
"70006010-32-アカリ" = "えっ、何で知ってるの？"
"70006010-33-アカリ" = "ウフフッ、どうしてでしょうね？"
"70006010-34-ジュリ" = "助かりました！おかげで大丈夫そうです！"
"70006010-35-ジュリ" = "それでは、今日も先輩をよろしくお願いしますね！"
"70006010-36-ジュンコ" = "……なんか、自然な流れでフウカ探しをお願いされちゃったような。"
"70006010-37-ハルナ" = "ふむ……フウカさん、どうされたのでしょう。"
"70006010-38-イズミ" = "誰かが誘拐しちゃったのかなぁ？"
"70006010-39-アカリ" = "それは許せませんね★"
"70006010-40-イズミ" = "ええ。私たち以外がフウカさんを連れ去るなど、決してあってはなりません。"
"70006010-41-アカリ" = "というわけで……これよりフウカさんの安全確保のため、捜索を開始します。"
"70006010-42-イズミ" = "フウカを助け出して美味しいもの、作ってもらお！"
"70006010-43-ジュンコ" = "結局、私たちに協力してもらうなら変わらなくない！？"
"70006010-44-アカリ" = "フフッ。私たちはあくまで「お願い」ですから。"
"70006010-45-イズミ" = "しゅっぱーつ！"
"70006010-46-ジュンコ" = "くんくん……。"
"70006010-47-ジュンコ" = "ねえ、なんかこっちから嗅ぎ慣れた匂いがするよ？"
"70006010-48-ジュンコ" = "うん！絶対美味しいものの匂い！"
"70006010-49-ジュンコ" = "食べ物の匂いもするけど……なんか別の馴染のある感じもするような……？"
"70006010-50-ハルナ" = "フウカさんが近くにいるのかもしれませんね。"
"70006010-51-イズミ" = "わあ！ジュンコはフウカの匂いが分かるんだね！"
"70006010-52-ジュンコ" = "そ、そんなわけないでしょ！"
"70006010-53-アカリ" = "匂いまでは分かりませんが、足跡からしてフウカさんがここに来たのは間違いなさそうです。"
"70006010-54-アカリ" = "これです。この足跡……フウカさんがよく履いている靴の形をしています。"
"70006010-55-アカリ" = "こんないっぱいある足跡から、それが分かるの……？"
"70006010-56-アカリ" = "なんとなくです★"
"70006010-57-ハルナ" = "フウカさんの行動パターンを考えると、今日はこちらの商店街にいる可能性が高いです。"
"70006010-58-ハルナ" = "普段から贔屓にしているお店がこの辺りに……。"
"70006010-59-ジュンコ" = "みんなフウカのストーカーなの！？"
"70006010-60-ジュンコ" = "……ん？あれ？あそこにいるのって……。"
"70006010-61-ジュンコ" = "嘘っ！？本当に居た……。"
"70006010-62-ハルナ" = "楽しそうに食材を選んでますね。#n事件性がなくて良かったです。"
"70006010-63-アカリ" = "どうします？探して欲しいと言われてますし、念のために私たちで保護しましょうか？"
"70006010-64-イズミ" = "うんうんっ！危なくなる前に保護しよ～！"
"70006010-65-ジュンコ" = "はあ……もうツッコむのも疲れてきたわね……。"
"70006010-66-フウカ" = "なっ！？あんた達、どうやってここに……。"
"70006010-67-アカリ" = "あら？そんなに驚かなくても……。"
"70006010-68-アカリ" = "私たちの仲じゃありませんか★"
"70006010-69-イズミ" = "フウカ～！今日のお昼な～に～？"
"70006010-70-ハルナ" = "ジュリさんが心配しておりましたわよ。"
"70006010-71-フウカ" = "ジュリ？……あっ。"
"70006010-72-フウカ" = "完全に連絡忘れてた……後で謝っとこ。"
"70006010-73-イズミ" = "今日はいつもよりすごいのを作る感じ？楽しみ～！"
"70006010-74-フウカ" = "すごいと言えばすごい……のかな。"
"70006010-75-フウカ" = "茶々入れるつもりなら、今日はやめておいた方が良いと思うよ。"
"70006010-76-ハルナ" = "あら？それはどういった――"
"70006010-77-ジュンコ" = "あっ！みんな気を付けて！！"
"70006010-78-ハルナ" = "けほっ、けほっ……何が起きて……"
"70006010-79-ハルナ" = "あなた方は……救護騎士団……でしょうか？"
"70006010-80-ジュンコ" = "「団長が壊して騎士団が治す」っていう、あの！？"
"70006010-81-アカリ" = "私も聞いたことあります。瀕死まで追い込んでから、治療を施すのだとか……。"
"70006010-82-イズミ" = "ええっ！？何でそんな人たちとフウカが一緒にいるの？"
"70006010-83-ミネ" = "救護が必要な場に救護を！！フウカさん、ご無事ですか？"
"70006010-84-ハナエ" = "まさか、噂が他校の方にまで知れ渡っているとは……。"
"70006010-85-ハナエ" = "えへへ。怪我をされても綺麗に治しますからね！心配しないでください！"
"70006010-86-ジュンコ" = "怪我する前提なの！？"
"70006010-87-ミネ" = "皆さんのことはフウカさんから伺っております。"
"70006010-88-ミネ" = "窮地に陥った者に手を差し伸べることもまた、救護……。"
"70006010-89-ミネ" = "救護騎士団団長[ruby=あおもり]蒼森[/ruby]ミネ……参ります！"
"70006010-90-ハルナ" = "アカリさん、ありがとうございます……間一髪でしたわね。"
"70006010-91-アカリ" = "うーん……手ごわいですね★"
"70006010-92-イズミ" = "うわーん！痛い！痛いよぉ！"
"70006010-93-イズミ" = "は、ハルナ！どうするのこれ！？"
"70006010-94-アカリ" = "これは……迷うまでもなく――"
"70006010-95-ハルナ" = "――撤退しましょう！"
"70006010-96-アカリ" = "ですよね★"
"70006010-97-ミネ" = "逃がしません……！"
"70006010-98-セリナ" = "要救護者を確保！直ちに治療を開始します！"
"70006010-99-ハナエ" = "はい、じっとしててくださいね。動いたら痛いですよ！"
"70006010-100-イズミ" = "うわーん！ハルナ、アカリ、ジュンコ待って！置いてかないでーー！！"
"70006010-101-ジュンコ" = "ごめん！イズミのこと、忘れないから！！  "
"70006010-102-セリナ" = "うわあぁぁん！！覚えてなさいよっ！死んでも仕返ししてやるんだからっっ！！"
"70006010-103-ミネ" = "仲間を置き去りにするなど、なんと不届きな……。"
"70006010-104-ミネ" = "その性根……救護の名のもとに叩き直して差し上げます！"
"70006010-105-イズミ" = "そーだそーだ！みんな捕まえちゃえっ！"
"70006010-106-ジュンコ" = "あんたが言うの！？"
"70006010-107-ジュンコ" = "……あれ？"
"70006010-108-ハルナ" = "これが救護とは……聞いて呆れますわね……"
"70006010-109-アカリ" = "その場で治せばOKという考えが怖いですね～★"
"70006010-110-セリナ" = "ジュンコさん、脚を怪我されてますね……。"
"70006010-111-セリナ" = "大変です！早く切断しないと！"
"70006010-112-イズミ" = "ええっ！？嘘でしょ！？嘘だよね！？"
"70006010-113-イズミ" = "うぅ……お腹が空いてなければ捕まらなかったのに……。"
"70006010-114-ジュンコ" = "ちょっ！？私の腕は食べられないわよ！？"
"70006010-115-アカリ" = "脱落したお二人のことは残念ですが、ここは態勢を立て直して……"
"70006010-116-ハルナ" = "……アカリさん？"
"70006010-117-アカリ" = "私もどうやらここまでのようです……。"
"70006010-118-アカリ" = "ハルナをかばった傷が……後はよろしく……。"
"70006010-119-アカリ" = "ぐふっ……。"
"70006010-120-ハルナ" = "アカリさん……！！"
"70006010-121-ミネ" = "残るはあなただけですね。"
"70006010-122-ミネ" = "ふふ……ふふふっ……。"
"70006010-123-ハルナ" = "抵抗しても無駄なようですね。降参いたしますわ。"
"70006010-124-ハルナ" = "噂には聞いておりましたが……まさかこれほどとは。"
"70006010-125-ハルナ" = "さすがは破壊のミネさん、といったところでしょうか。"
"70006010-126-ミネ" = "は、破壊……！？またあらぬ誤解が……。"
"70006010-127-ハルナ" = "ともかく。私のことは大丈夫ですので、みなさんの治療を――"
"70006010-128-ハナエ" = "あっ、これは腕を切断しないとダメかも……。"
"70006010-129-イズミ" = "うわああぁぁん！！"
"70006010-130-セリナ" = "ハナエちゃん、怖がらせてはいけません。本当に切断すると思われてしまいますよ？"
"70006010-131-ハナエ" = "えっ？本当ですよ？"
"70006010-132-ジュンコ" = "あのキラキラした笑顔が余計怖いんだけど！？"
"70006010-133-ジュンコ" = "ウフフッ。大ピンチですね。こういう時こそ精をつけて……。"
"70006010-134-ジュンコ" = "うわっ！？腕舐めないでよ！？"
"70006010-135-ハルナ" = "適切な治療をお願いできればと……。"
"70006010-136-ミネ" = "心配は無用です。彼女たちも、れっきとした救護騎士団ですから。"
"70006010-137-フウカ" = "たまには痛い目見たほうが、良い薬になるんじゃない？"
"70006010-138-ハルナ" = "ところで……なぜ救護騎士団のみなさんがフウカさんと一緒に？"
"70006010-139-ミネ" = "そ、それは……。"
