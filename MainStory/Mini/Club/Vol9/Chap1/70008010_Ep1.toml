[translation]
"70008010-1" = "何にも縛られぬ者たち（１）"
"70008010-2" = "（平和な春の日……）"
"70008010-3-アラタ" = "あああああっ！！もうやってらんねぇ！！"
"70008010-4-魑魅一座B" = "うわっ！どしたんすか急に。"
"70008010-5-アラタ" = "言われなきゃ分かんねぇのか！？"
"70008010-6-魑魅一座A" = "えぇ……？掃除もいいもんじゃないですか。"
"70008010-7-アラタ" = "それだ！それが問題なんだよ！#n毎日、毎日、掃除ばっか！"
"70008010-8-魑魅一座A" = "まぁ、百花繚乱の連中にやられちゃったわけですし。"
"70008010-9-魑魅一座B" = "そうだ！今度あたしらが勝ったら、あいつらに掃除させてやろうよ！"
"70008010-10-魑魅一座A" = "おっ、いいねぇ！"
"70008010-11-魑魅一座B" = "あー、でも最近……道端でゴミを見つけたらつい拾っちゃうんだよね。#n街がきれいになるし、掃除も悪くないっていうか……。"
"70008010-12-魑魅一座A" = "え、お前も？実はあたしもなんだけど――"
"70008010-13-アラタ" = "だーーーーっ！#nそんな話で盛り上がるな！"
"70008010-14-アラタ" = "[ruby=すだまいちざ]魑魅一座[/ruby]の名が泣くぞ！#nもっと「あたしららしい」ことをするんだよ！"
"70008010-15-魑魅一座A" = "魑魅一座らしいことって……？"
"70008010-16-アラタ" = "それはな！その……！"
"70008010-17-アラタ" = "あれっ……魑魅一座らしさって……何だろう……？"
"70008010-18" = "魑魅一座・路上流のアジト"
"70008010-19-アラタ" = "うぅぅ……。"
"70008010-20-魑魅一座B" = "なんすか、リーダー、まださっきのこと考えてるんですか？"
"70008010-21-魑魅一座B" = "らしさなんて何でもいいじゃないですか～#n楽しく遊べればそれでよし！"
"70008010-22-魑魅一座C" = "たっ、大変だ～！！"
"70008010-23-魑魅一座C" = "リーダー！リーダー！緊急事態ですっ！"
"70008010-24-アラタ" = "いいから、用件を言え、用件を！"
"70008010-25-魑魅一座C" = "あ、実は全然緊急じゃないです。ちょっと驚かせたくて大げさに……。"
"70008010-26-アラタ" = "くあああっ！！このぉ！！！"
"70008010-27-魑魅一座C" = "うわっ！おーたーすーけーをー！！"
"70008010-28-魑魅一座" = "あははははっ！リーダーが爆発した～！"
"70008010-29-アラタ" = "……で？結局何だったんだ？"
"70008010-30-魑魅一座C" = "あっ、そうでした。えっと……はい、これ。#nリーダー宛の招待状です。"
"70008010-31-アラタ" = "招待状？誰からだ？"
"70008010-32-魑魅一座C" = "魑魅一座ナイト……って言えばわかるはずって。"
"70008010-33-アラタ" = "何！？本当か！？"
"70008010-34-魑魅一座B" = "何ですか？それ。#n……お前知ってる？"
"70008010-35-魑魅一座B" = "どっかで聞いたような……。"
"70008010-36-アラタ" = "お前ら、それでも本当に魑魅一座か？いいか、よ～く聞け！"
"70008010-37-アラタ" = "それは魑魅一座が誕生した大昔から続く秘密集会。"
"70008010-38-アラタ" = "魑魅一座の中でも「本物」だけが招待される……と噂の集会！"
"70008010-39-アラタ" = "それこそが、魑魅一座ナイト！"
"70008010-40-アラタ" = "今までの努力が認められたんだよ！"
"70008010-41-魑魅一座A" = "へぇ……。"
"70008010-42-アラタ" = "何だ、しけてんなぁ。嬉しくないのか！？"
"70008010-43-魑魅一座A" = "……正直よくわかんないんですよね。"
"70008010-44-魑魅一座A" = "ってか、魑魅一座の歴史ってそんなに長かったんですか？#nリーダーが作ったもんだとばっかり思ってました。"
"70008010-45-アラタ" = "やめだやめだ。お前たちとじゃ話にならねぇ。"
"70008010-46-アラタ" = "とにかく、魑魅一座ナイトの連中に舐められるわけにはいかないんだ。#n……そろそろ、お面を拵えるときなのかもな。"
"70008010-47-魑魅一座A" = "リーダーってお面はつけないんじゃ……。"
"70008010-48-魑魅一座B" = "しぃぃぃっ！言うなよ！なんかヤバい事情があるのかもしれないだろ！"
"70008010-49-魑魅一座A" = "あっ、ごめん。"
"70008010-50-アラタ" = "こいつら、言わせておけば……！"
"70008010-51-アラタ" = "あたしに相応しいお面がなかっただけだっての！"
"70008010-52-魑魅一座B" = "たしかに……流行ってるお面には個性がないし……個性を重視するとダサいし……。"
"70008010-53-魑魅一座B" = "わかる～私もこのお面にするまですっごい大変だった……。"
"70008010-54-アラタ" = "あたしらにとって、お面は自分そのものといってもいい……感情の全てを一つの表情で表現しきるんだ。"
"70008010-55-アラタ" = "2年前――当時の百花繚乱の委員長と100回戦って引き分けになった伝説の魑魅一座は、お面をたくさん持ってて、感情に合わせて付け替えてたとか。"
"70008010-56-アラタ" = "……魑魅一座ナイトでお面付けてないのなんて、裸で街歩くのと同じなんだよ！"
"70008010-57-アラタ" = "でも、ありきたりなお面は笑われるに決まってる！"
"70008010-58-魑魅一座B" = "ってことは……！"
"70008010-59-アラタ" = "お面を探しに行くぞ！！"
"70008010-60-魑魅一座B" = "いよいよリーダーもお面を！"
"70008010-61-魑魅一座B" = "実はもう見つけてあるんですよ！"
"70008010-62-アラタ" = "だ～か～ら！遊びじゃねぇんだ！真面目にやれ！！"
