[translation]
"70008020-1" = "何にも縛られぬ者たち（２）"
"70008020-2-ナグサ" = "あ。"
"70008020-3-アラタ" = "ひっ。"
"70008020-4-アラタ" = "なんでこんなときにまで……！"
"70008020-5-ナグサ" = "……。"
"70008020-6-ナグサ" = "はぁ……。"
"70008020-7-アラタ" = "な、何だよ、その反応は！"
"70008020-8-ナグサ" = "今度は何をやらかしたの？"
"70008020-9-アラタ" = "まだ何もしてない！！"
"70008020-10-ナグサ" = "まだ……？"
"70008020-11-アラタ" = "ゆっ、誘導尋問だ！"
"70008020-12-ナグサ" = "……ちょっと調べさせて。"
"70008020-13-アラタ" = "いや、今日は本当に何もしてない……ってか、急いでて――"
"70008020-14-？？？" = "その声は……アラタだね？"
"70008020-15-商人A" = "おや本当だ。友達も連れてきてくれたのかい？"
"70008020-16-商人B" = "すまないねぇ、今日は頼むことがないんだ。"
"70008020-17-ナグサ" = "……知り合い？"
"70008020-18-アラタ" = "小遣いのために、お使いしただけ。"
"70008020-19-アラタ" = "お祭りにはお金がいるからな……。"
"70008020-20-魑魅一座A" = "まぁまぁ、寄っていきなぁ。羊羹があるんだよ。お茶も用意しようねぇ。"
"70008020-21-魑魅一座A" = "いいんですか！？リーダー、どうします？"
"70008020-22-アラタ" = "ばか！あほ！どうしたもこうしたもねぇ！"
"70008020-23-商人A" = "あ、そうだった……ごめん、今日はちょっと急いでて……。"
"70008020-24-商人A" = "そうかいそうかい。お腹がすいたら、いつでも来るんだよ。"
"70008020-25-商人B" = "やんちゃなところもあるけど、本当は良い子たちなんだ。"
"70008020-26-ナグサ" = "あ……はい。"
"70008020-27-商人B" = "百鬼夜行同士なんだから、みんな仲良くしなね。"
"70008020-28-アラタ" = "しっ！しっ！！早く行っちまえ！！"
"70008020-29-商人B" = "アラタ、照れ隠しもほどほどに――"
"70008020-30-商人B" = "ささ、後は若い者に任せて。私たちは退散するとしよう。"
"70008020-31-アラタ" = "ふ～ん？"
"70008020-32-ナグサ" = "仲良くする？"
"70008020-33-アラタ" = "するかよ！！"
"70008020-34-アラタ" = "百花繚乱と仲良くなんて、まっぴらごめんだね！！"
"70008020-35-ナグサ" = "リーダー！置いてかないでくださいよ～！"
"70008020-36-アラタ" = "はぁ、はぁ、撒いたか……？"
"70008020-37-アラタ" = "あれっ？#n今日は別に、逃げなくてもよかったんじゃ……。"
"70008020-38-魑魅一座A" = "はぁ、はぁ……リーダー、足速くなったよね……。"
"70008020-39-魑魅一座B" = "逃げ回ってばっかだもんね……。"
"70008020-40-アラタ" = "うるさい！速くなるのはいいことだろうが！"
"70008020-41-魑魅一座A" = "でも……さっきの話、よかったんじゃないですか？"
"70008020-42-アラタ" = "なにが？"
"70008020-43-魑魅一座A" = "百花繚乱と仲良くする、って。そうすれば、逃げる必要なくなりますよね？"
"70008020-44-魑魅一座B" = "たしかに。百花繚乱はエリートだし、お祭りの金券とかもらえるかも？"
"70008020-45-アラタ" = "それ、本気で言ってんのか……！？"
"70008020-46-魑魅一座A" = "そこまで怒らなくても……。"
"70008020-47-アラタ" = "いいか？魑魅一座と百花繚乱は何があっても仲良くできない。そう決まってるんだ！"
"70008020-48-魑魅一座B" = "え……そんなの、誰が決めたんです……？"
"70008020-49-アラタ" = "そ、それは……最初からだよ！！そう決めた人はな……！"
"70008020-50-アラタ" = "……。"
"70008020-51-アラタ" = "ともかく！そんな間抜けな話は二度とするなよな！！"
"70008020-52-魑魅一座B" = "……リーダーもよく知らないっぽいね？"
"70008020-53-魑魅一座B" = "あんま聞かないであげよう。"
"70008020-54-アラタ" = "はぁ……あいつのせいで無駄な時間を食っちまったな。"
"70008020-55-アラタ" = "商店街は地味なのばっかだし……目を引く、特別なお面はねぇのか……？"
"70008020-56-？？？" = "百鬼夜行って、全部が観光地なんじゃないの？"
"70008020-57-？？？" = "こんなことなら下調べしてくるんだったわね……。"
"70008020-58-アラタ" = "……あれだ！"
"70008020-59-アラタ" = "見つけたぞ！！"
"70008020-60-ラブ" = "ん？"
"70008020-61-ラブ" = "えっ……えっ！？なに！？"
