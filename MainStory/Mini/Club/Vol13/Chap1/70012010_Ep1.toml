[translation]
"70012010-1" = "ON AIR：ゲヘナ（１）"
"70012010-2-キララ" = "足りない！"
"70012010-3-エリカ" = "何が？"
"70012010-4-キララ" = "キラキラが！"
"70012010-5-エリカ" = "またずいぶん漠然とした……。"
"70012010-6-エリカ" = "……要は「惹かれることがない」って解釈でいい？"
"70012010-7-エリカ" = "さすがエリカちゃん！それそれ。"
"70012010-8-エリカ" = "あんま面白いことがないっていうか……最近のゲヘナってなんか静かじゃない？"
"70012010-9-キララ" = "そう……？先週も部室棟の本館が爆発してなかったっけ。"
"70012010-10-エリカ" = "あれから1週間も経ってるんだよ？復旧だって終わってたし。"
"70012010-11-エリカ" = "なーんかもうちょっと楽しくて、おもしろいことないかなー。"
"70012010-12-キララ" = "キララちゃんをアゲてくれるようなネタは……なかなかねぇ。"
"70012010-13-エリカ" = "おぉ？エリカちゃん、あれ見て。"
"70012010-14-キララ" = "うん？なんかある？"
"70012010-15-通りすがりの生徒" = "ですから、ただ座って話すだけで――"
"70012010-16-イロハ" = "え、めんどくさ……。"
"70012010-17-イロハ" = "悪いんだけど、カレー温めないとだから。それじゃ。"
"70012010-18-イロハ" = "めんどくさいって……。"
"70012010-19-イロハ" = "まあ……だから私も人を探しているわけですが。"
"70012010-20-イロハ" = "……ん？"
"70012010-21-イロハ" = "私は今、面倒ごとを避けるために面倒ごとを……？"
"70012010-22-イロハ" = "つまり、めんどくささはプラマイゼロ……？"
"70012010-23-イロハ" = "……。"
"70012010-24-イロハ" = "いや、これ以上考えるのはやめておきましょう。胃の調子が悪くなるだけですね……。"
"70012010-25-イロハ" = "にしても、どこで代わりを……。"
"70012010-26-イロハ" = "お礼で釣りたいところですが、用意できるのはマコト先輩のサインくらいですし……#n欲しがる人もいないでしょうね……。"
"70012010-27-イロハ" = "ねえね[ruby=パンデモニウム・ソサエティー]え、万魔殿のイ[/ruby]ロハちゃん……だよね？"
"70012010-28-イロハ" = "なんか困ってるみたいだけど、どうしたの？"
"70012010-29-イロハ" = "あなた達は……。"
"70012010-30-イロハ" = "……。"
"70012010-31-イロハ" = "あっ！"
"70012010-32-イロハ" = "適任者、発見です。"
"70012010-33" = "少し前のこと……"
"70012010-34-マコト" = "キシシッ、そういうことだ。"
"70012010-35-マコト" = "え、急にどうしたんですか？"
"70012010-36-イロハ" = "ただ言いたかったのだ。そういう気分の時もあるだろう？"
"70012010-37-イロハ" = "気分とは、イロハが思っているよりも重要なんだ。"
"70012010-38-マコト" = "はいはい、そうですね……。"
"70012010-39-イロハ" = "キシシッ。それはそうと、[ruby=われわれ]万魔殿[/ruby]の校内放送の準備は順調か？"
"70012010-40-マコト" = "ゲヘナ各地の出来事を紹介するコーナーもできたと聞いたぞ。"
"70012010-41-イロハ" = "ええ、まあ。"
"70012010-42-イロハ" = "というか、勝手に朗読コーナーを入れるなと言いましたよね？#n予算の浪費はしないようにと何度言えば……。"
"70012010-43-イロハ" = "そもそも、ちゃんと聞いてる人なんて居ないじゃないですか。"
"70012010-44-イロハ" = "まだまだだな。だから良いのだよ。キシシッ！"
"70012010-45-マコト" = "どういうことですか。"
"70012010-46-イロハ" = "誰も興味がない……すなわち何をやっても良いということだ。"
"70012010-47-イロハ" = "たとえば、決定した予算案のことを話しておけば……。"
"70012010-48-イロハ" = "「風紀委員会の予算削減は公発表済み」――なんてことも言えるのだ！キキキッ。"
"70012010-49-イロハ" = "しょうもない理由ですね。"
"70012010-50-マコト" = "ともかく！誰も気に留めないのが校内放送のいいところだ。"
"70012010-51-マコト" = "ご報告です！"
"70012010-52-マコト" = "校内放送の担当が、突然辞退を申し出ました！"
"70012010-53-マコト" = "なにぃっ！？なぜだ！！？"
"70012010-54-万魔殿のメンバー" = "わ、わかりません……！#n引き留めたものの呆然とした様子で、一身上の都合とばかり……。"
"70012010-55-万魔殿のメンバー" = "急いで代わりを探していますが、未だ適切な人材が見つからず……。"
"70012010-56-マコト" = "どうしてこんなことに……！？"
"70012010-57-マコト" = "はぁ……仕方ありません。今回の放送はお休みですね。"
"70012010-58-イロハ" = "それは有り得ない！！"
"70012010-59-マコト" = "はい？だって聞いている人がいるわけでもないじゃないですか。#nそれがいいところなのでしょう？"
"70012010-60-イロハ" = "そういう問題ではない――！！"
"70012010-61-イロハ" = "放送を休むというのはまた別の問題なのだ！"
"70012010-62-マコト" = "これは万魔殿……いいや、マコト様の威信に関わる重要案件だ！！"
"70012010-63-イロハ" = "誰もそんなこと気にしないと思いますけどね。"
"70012010-64-マコト" = "すぐに代わりを見つけてこい！！"
"70012010-65-イロハ" = "いや、ですから……話聞いてましたか？#n放送の経験者なんて早々見つからな――"
"70012010-66-マコト" = "この際だ。未経験でも構わん！！"
"70012010-67-マコト" = "なんとしてでも放送するのだ――！！"
"70012010-68-イロハ" = "ワガママもいい加減にしてください！！！"
"70012010-69-エリカ" = "そんなことが……。"
"70012010-70-エリカ" = "はあ……分かっていただけましたよね……徒労もいいところだって……。"
"70012010-71-キララ" = "超たのしそ～っ！！"
"70012010-72-イロハ" = "……。"
"70012010-73-イロハ" = "はい？"
"70012010-74-キララ" = "エリカちゃん、どうどう？せっかくだしやってみない？"
"70012010-75-キララ" = "まあ、いい経験になりそうだよね。#n素人でもよければだけど……。"
"70012010-76-キララ" = "本当ですか……？"
"70012010-77-キララ" = "うんっ！！何を準備したらいい！？"
"70012010-78-キララ" = "あ……別にやることが決まっているわけではないので……。"
"70012010-79-イロハ" = "というか本当に……本気なんですよね……？"
