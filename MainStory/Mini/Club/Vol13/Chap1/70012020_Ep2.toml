[translation]
"70012020-1" = "ON AIR：ゲヘナ（２）"
"70012020-2-マコト" = "キシシッ！さすがはイロハだ！"
"70012020-3-マコト" = "まさにピッタリな人選じゃないか！"
"70012020-4-マコト" = "私が選んだというか、向こうから来たといいますか……。"
"70012020-5-イロハ" = "[ruby=はたみ]旗見[/ruby]エリカと[ruby=よざくら]夜桜[/ruby]キララ。#nさぞや万魔殿にふさわしい放送にしてくれることだろう！！"
"70012020-6-マコト" = "先輩、名前を覚えるのは得意ですよね……。"
"70012020-7-マコト" = "とにかく、2人に任せることにしたんですから。後で文句とか言わないでくださいね。"
"70012020-8-マコト" = "人を動かすなら信ずるべし。信ずるなら後悔するべからず――"
"70012020-9-マコト" = "それこそトップが持つべき志！安心して進行せよ！"
"70012020-10-イロハ" = "はいはい……では。"
"70012020-11-イロハ" = "というわけで。次回のパーソナリティーとしてお二人のことを告知したところ――"
"70012020-12-イロハ" = "かなりの反響がありました。"
"70012020-13-キララ" = "ほんと！？わー！嬉しい！"
"70012020-14-キララ" = "お二人は校内の有名人ですから。こちらとしても助かっています。"
"70012020-15-キララ" = "ちょっとプレッシャーだね……。進行マニュアルとか、あったりする？"
"70012020-16-キララ" = "最低限は。とはいえ、そもそも適当で大丈夫ですから。#nいつもの放送みたいに――って、あれ？校内放送って聞いたことあります？"
"70012020-17-キララ" = "え……どんな感じだったっけ……？あんま思い出せないかも。"
"70012020-18-キララ" = "イブキちゃんが喋ってたよね。あと、何か歌ってた気がする。"
"70012020-19-キララ" = "えっ、歌も歌うの？"
"70012020-20-キララ" = "いえ、それはやる必要なくて……まあ普通の放送です。ラジオみたいな。"
"70012020-21-イロハ" = "ああ、そういえば。体験談のコーナー宛に、たくさんお便りが届いているみたいです。#nですが全部は読まなくていいので。"
"70012020-22-イロハ" = "そういうわけにはいかないっしょ。#n私の話を聞いてほしい！ってわざわざ送ってくれたんだから。"
"70012020-23-イロハ" = "いつ読まれるかな～って楽しみにしてるはずだもん。ガッカリさせちゃダメでしょ？"
"70012020-24-キララ" = "まあ……そうですね。そこはお任せします。"
"70012020-25-イロハ" = "ほんと？本当にいいんだよね？"
"70012020-26-エリカ" = "はい。お二人を信じてお任せします。"
"70012020-27-エリカ" = "変なことをするような方々でもないでしょうし……。"
"70012020-28-イロハ" = "うわぁ、なんか万魔殿から信頼されてるって思ったらプレッシャーかも。"
"70012020-29-エリカ" = "そんなに大げさなものでもありませんよ。"
"70012020-30-イロハ" = "トラブルが起きても……最後はどうにかするので。"
"70012020-31-キララ" = "あははっ！信じてくれたイロハちゃんのためにも頑張るね！"
"70012020-32-イロハ" = "お気持ちはありがたいですが……#n急なお願いでしたし、あまり気負わずにやってもらえれば。"
"70012020-33-イロハ" = "そろそろですね。"
"70012020-34-イロハ" = "では、よろしくお願いします。"
"70012020-35-エリカ" = "まっかせて！"
"70012020-36-キララ" = "ふぅ……なんか緊張してきたかも。"
"70012020-37-エリカ" = "だいじょーぶだいじょーぶ！ここにコーナーの説明もあるし。なるようになるって。"
"70012020-38-キララ" = "そうだね。じゃあいってみますか。"
"70012020-39-エリカ" = "コホン！みなさ～ん、こんにちはー！こちら、放送室からお届けしてまーす！"
"70012020-40-キララ" = "本日の「ON AIR：ゲヘナ」の進行をサプライズで担当する、夜桜キララと――"
"70012020-41-エリカ" = "旗見エリカです。"
"70012020-42-エリカ" = "至らないところがあるかもしれませんが、よろしくお願いします。"
"70012020-43-ゲヘナの生徒B" = "あれ？今日の放送……いつもと違う？"
"70012020-44-ゲヘナの生徒A" = "担当変わったのかな？"
"70012020-45-ゲヘナの生徒B" = "キララちゃんがやってるの……？"
"70012020-46-キララ" = "それでは最初のコーナー！部活宣伝ターイムっ！"
"70012020-47-キララ" = "今日もたくさんのお便りが届いているみたいですね。"
"70012020-48-エリカ" = "じゃあまずは最初のお便り！おー、カラフルで可愛いっ！"
"70012020-49-キララ" = "すごい文字の量……気持ちが伝わってきますね。"
"70012020-50-エリカ" = "さてさて、どんな部活なんでしょうか。"
"70012020-51-キララ" = "「この手紙はトリニティから始まり、受け取った人に幸せを届けてきました。#nですがこの手紙を1週間以内に7人に送らなければたちまち不幸が訪れ……」"
"70012020-52-キララ" = "……え？"
"70012020-53-エリカ" = "うわぁ……懐かしいね、こういうの。今もあるんだ。"
"70012020-54-キララ" = "どうやら部活の宣伝ではなさそうです！次のお便りにいっちゃいましょう！"
"70012020-55-ゲヘナの生徒D" = "ちょっと、聞いちゃったじゃん！？不幸が訪れるってヤなんだけど！？"
"70012020-56-ゲヘナの生徒C" = "送る相手7人もいないんだけど……どうしよう……。"
"70012020-57-キララ" = "はい、つぎー！今度はちゃんと部活の宣伝でありますよーに！"
"70012020-58-キララ" = "じゃあエリカさん、お願いします！"
"70012020-59-キララ" = "コホン……では。"
"70012020-60-キララ" = "「学園境界哲学部はあなたをお待ちしています。#n私たちと一緒に内と外の境界でたたずみ、その曖昧さを味わいませんか？#n登校とサボりの境界線上――あなたも癖になること間違いなし！」"
"70012020-61-エリカ" = "あっ、これ！いっつも校門らへんに座ってる人たちだ！"
"70012020-62-キララ" = "あー、あれ、ガーゴイルごっこだと思ってた。部活だったんだ？"
"70012020-63-キララ" = "えっと……入部希望の人は毎週火曜か木曜に西門に行けばいいみたい。#nそれでは、「学園境界哲学部」をよろしくお願いしまーす！"
"70012020-64-イロハ" = "（想像よりもスムーズですね。この2人に頼んで正解でした）"
"70012020-65-ゲヘナの生徒A" = "今日の放送、なんか良い感じじゃない？"
"70012020-66-ゲヘナの生徒B" = "ね。いつもは万魔殿の賛歌ばっかりなのに。"
"70012020-67-ゲヘナの生徒A" = "いつもこんな感じなら、ちょっと楽しみかも……？"
"70012020-68-イロハ" = "（反応も悪くないようです）"
"70012020-69-イロハ" = "（……マコト先輩は嫌がるかもしれませんが）"
"70012020-70-キララ" = "はい、では次のコーナー。"
"70012020-71-エリカ" = "みなさんお待ちかね！「キラキラ☆集まれ！リスナーエピソード」のお時間です！"
"70012020-72-キララ" = "そんな名前だったっけ……まあ、いっか。"
"70012020-73-キララ" = "たくさんのお便りをいただいていますが、時間の都合で全部読むのは難しそうです。#n読めなかった人はごめんなさい。"
"70012020-74-キララ" = "では、最初のお便りです。"
"70012020-75-エリカ" = "「私は今2年生です。お昼の時間は1人でゆっくりご飯を食べるのが好きなのですが、よく誘ってくれる友達がいます」"
"70012020-76-エリカ" = "「悪い気がして、断りたくても断れません。友達のことが嫌いなわけではないんです。#nどうしたらいいでしょうか？」"
"70012020-77-エリカ" = "あーこういうタイプの子、結構多いんじゃない？"
"70012020-78-エリカ" = "たしかに悩むよね。自分の時間を大事にすべきか、友達を優先すべきか。"
"70012020-79-エリカ" = "あたし、これは自信をもって答えられます！"
"70012020-80-キララ" = "お？そうなんですか？"
"70012020-81-キララ" = "はいっ！！"
"70012020-82-キララ" = "勇気を出して、正直に話してみてください。#n本当は、1人で食べるのも好きなんだって。"
"70012020-83-キララ" = "友達と気まずくなりそうと思って一歩を踏み出せないかもしれません。#nでも本音で話し合ったら、もっと仲良くなれると思うんです。"
"70012020-84-エリカ" = "おお……。"
"70012020-85-キララ" = "心を込めてお話しすれば、きっと分かってくれるはず。だって友達だもん！#nだからあんまり不安にならないで！"
"70012020-86-エリカ" = "ふふっ、そうですね。#nお互いの好みや性格を尊重しあえる関係。それが友達というものですよね。"
"70012020-87-キララ" = "ではキララちゃん、次にいってみましょう。"
"70012020-88-エリカ" = "は～い。こちらも匿名のお便りですね。1年生の方だそうです。"
"70012020-89-ジュンコ" = "「私は常に不幸がつきまといます。よく転ぶし、お団子とかお菓子は落とすし、お店で何か食べようとすると爆発が起きるし、食券を失くしたり、自販機にお金を飲まれたりします。私の何が問題なんでしょう？」"
"70012020-90-エリカ" = "うわぁ……聞いてるだけで涙が出ちゃいそう。"
"70012020-91-キララ" = "それでもいつも何かに挑戦してるってこと？すごいね。"
"70012020-92-エリカ" = "うーん、それだけ不幸があるってことは、#n後でおっきな幸せがやってくるんじゃないでしょうか？#n幸せはどこかでバランスが取れるっていうもんね。"
"70012020-93-キララ" = "それか、ブイログとかストリーミングをやってみてもいいかも。"
"70012020-94-キララ" = "いっつも不幸に襲われる……それって撮影のネタにピッタリだと思うので。"
"70012020-95-エリカ" = "つまりピンチをチャンスに変えるってことですね！#n日常の不幸を、むしろセールスポイントにしちゃう！みたいな？"
"70012020-96-エリカ" = "そうそう。不幸なことが起きない時も、それはそれで幸せだからね。"
"70012020-97-エリカ" = "頑張って！あたし達も応援してるね！"
"70012020-98-エリカ" = "はい、では次のお便りへ――"
"70012020-99-エリカ" = "うっ！？ヤな音！"
"70012020-100-エリカ" = "ん……機材トラブルかな。"
"70012020-101-ゲヘナの生徒A" = "わっ、なに！？"
"70012020-102-？？？" = "……！！"
"70012020-103-エリカ" = "どうしよ？ここまでにする？"
"70012020-104-エリカ" = "うーん、ケーブルが干渉してるだけなら……。"
"70012020-105-エリカ" = "これを、こうして……。"
"70012020-106-エリカ" = "できた。"
"70012020-107-エリカ" = "すごーい！エリカちゃん、どうやったの？"
"70012020-108-キララ" = "ケーブルが絡まってるとたまに起きるんだよね。#nしかも放送室のは古くなってるやつが多いし。"
"70012020-109-キララ" = "だから特別なことはしてないよ。絡まったケーブルをほどいただけ。"
"70012020-110-エリカ" = "お～さっすが。こういうの詳しいんだね！"
"70012020-111-エリカ" = "これくらい、なんてことないって。"
"70012020-112-エリカ" = "あーあー。機材トラブルによりご迷惑をおかけしてごめんなさい。#nただいま復旧しましたので、放送を続けます。"
"70012020-113-エリカ" = "はいっ！では次のお便りにいきましょ～！"
"70012020-114-エリカ" = "（ノイズに紛れてなんか声がした気がするけど……） "
"70012020-115-エリカ" = "（まあ、気のせいかな）"
"70012020-116-イロハ" = "いい感じだと思っていたら機材トラブル……。"
"70012020-117-イロハ" = "マコト先輩。この先も放送を続けるなら、交換した方がいいんじゃないんでしょうか。"
"70012020-118-イロハ" = "……。"
"70012020-119-マコト" = "先輩？聞いてます？"
"70012020-120-イロハ" = "ん？ああ。"
"70012020-121-マコト" = "キシシッ。たしかに、校内放送が注目されるのも悪くはないな。"
"70012020-122-マコト" = "この私の威厳を示す朗読が、より多くの者に届くこととなる！"
"70012020-123-マコト" = "イロハ！校内放送を活性化させるための案を積極的に提出するように！"
"70012020-124-イロハ" = "はぁ……そう言うと思いました。"
"70012020-125-キララ" = "では、そろそろこの辺りで……。"
"70012020-126-キララ" = "あれ？"
"70012020-127-キララ" = "わあ、曲のリクエストが届いていますね！"
"70012020-128-キララ" = "あ、その曲。エンディングにピッタリだね。"
"70012020-129-キララ" = "――せん！"
"70012020-130-キララ" = "どうしたの？"
"70012020-131-キララ" = "そんな最新の曲……ありません！"
"70012020-132-エリカ" = "えっ？スマホを繋げるんじゃダメなの？"
"70012020-133-エリカ" = "そんな設備、ここにはなくて……いま流せるのは万魔殿の賛歌くらいしか……。"
"70012020-134-エリカ" = "リクエストと全然違うじゃん！？"
"70012020-135-キララ" = "それなら仕方ないよ。リクエスト曲は残念ながら――"
"70012020-136-キララ" = "エリカちゃん！"
"70012020-137-エリカ" = "うん？"
"70012020-138-キララ" = "エリカちゃんが歌ってよ！ちょうどそこにギターもあるし。"
"70012020-139-エリカ" = "えっ？私？"
"70012020-140-エリカ" = "そ！エリカちゃん超歌うまじゃん！#nしかもこの曲、前にカラオケで歌ってなかった？"
"70012020-141-キララ" = "いや、うまいってほどじゃ……歌える程度、っていうか……。"
"70012020-142-キララ" = "それにカラオケと校内放送って全然違うし……。"
"70012020-143-エリカ" = "あははっ、いいのいいの！歌う人がいて、聞いてくれる人がいるんだから！"
"70012020-144-エリカ" = "リクエストを送ってくれた人も喜ぶと思うよ？"
"70012020-145-キララ" = "うーん……私の歌を聞きたかったわけじゃない、とは思うけど……。"
"70012020-146-キララ" = "……まあ、やれないこともない、か。"
"70012020-147-エリカ" = "わ～い！エリカちゃんの生歌～！！"
"70012020-148-キララ" = "ふぅ……。"
"70012020-149-エリカ" = "では、お聞きください。タイトルは――"
"70012020-150-エリカ" = "～～～♪"
"70012020-151-エリカ" = "～～～♪"
"70012020-152" = "（こうしてキラキラ部の校内放送は成功裏に終わった）"
"70012020-153-イロハ" = "お二人ともお疲れ様でした。……本当に。"
"70012020-154-キララ" = "あははっ、すっごい楽しかったよ！案外、放送向いてるのかも！"
"70012020-155-キララ" = "そうだね。結構新鮮だった。#n聞いてた人たち、どんな反応だったのかな。"
"70012020-156-キララ" = "ああ、よかったですよ。すごく。"
"70012020-157-キララ" = "ほんと！？じゃあこれでイロハちゃんも、少しは気が楽になったかな？"
"70012020-158-キララ" = "それは……えっと……反応がよすぎて困っている、といいますか……。"
"70012020-159-キララ" = "えっ？そんなに？"
"70012020-160-キララ" = "反応がよくて困ることってあるの？"
"70012020-161-マコト" = "まあ……反応とは関係なく手のかかる人がいるといいますか。#nそして案の定ご機嫌斜めのようで……。"
"70012020-162-イロハ" = "とはいえ個人的には、今後もお二人に放送をお任せしたいと思っています。"
"70012020-163-イロハ" = "……。"
"70012020-164-イロハ" = "お二人にも部活動があるでしょうし、無理にとは言いませんが。"
"70012020-165-キララ" = "ヤバ！超嬉しい！"
"70012020-166-キララ" = "そうだね。もったいない言葉って思うくらい。"
"70012020-167-キララ" = "でも、もともと担当してた生徒がいるんだよね？"
"70012020-168-キララ" = "はい。一身上の都合で辞めてしまいましたが……。"
"70012020-169-キララ" = "その子が戻ってくるかは分からないけどさ。"
"70012020-170-エリカ" = "私たちが居場所を取っちゃうのはどうなのかなって。#nそういう経験って……案外引きずるんだよね。"
"70012020-171-エリカ" = "だから、お誘いは嬉しいけど……。"
"70012020-172-エリカ" = "あたしらはただの[ruby=・]補[/ruby][ruby=・]欠[/ruby]ってことで！#n……そういうことだよね？"
"70012020-173-キララ" = "ふふっ……そう。さすがキララちゃん。"
"70012020-174-イロハ" = "ええ、お気持ちは分かりました。優しいんですね。"
"70012020-175-イロハ" = "その生徒が戻ってくるかどうかは分かりませんが、伝えておきます。"
"70012020-176-イロハ" = "ああ、それと。#n頑張ってくださったお二人に、ささやかなお礼をできればと思いまして。"
"70012020-177-イロハ" = "マコト先輩の直筆サインを渡す予定だったのですが、一旦これは置いといて――"
"70012020-178-キララ" = "えっ、お礼？"
"70012020-179-キララ" = "エリカちゃん……どう思う？"
"70012020-180-キララ" = "うーん……多分、同じ考えじゃないかな？"
"70012020-181-キララ" = "あははっ、そうだよね？じゃあ……。"
"70012020-182-キララ" = "お礼は気持ちだけもらっておくね！#nあたしらはキラキラな経験ができただけで満足だから！"
"70012020-183-エリカ" = "うん。楽しかった。それでお役に立てたなら十分だよ。"
"70012020-184-イロハ" = "……そうですか。"
"70012020-185-エリカ" = "あー、じゃあじゃあ、イロハちゃんのモモトークとか。そっちの方が嬉しいかも？"
"70012020-186-イロハ" = "……。"
"70012020-187-イロハ" = "ふふっ、ええ。いいですよ。#nというより、こちらから言おうと思っていたところです。"
"70012020-188-キララ" = "きゃ～！イロハちゃん、かわいーーっ！！"
"70012020-189-エリカ" = "たまに連絡してもいい？あ、もしこの後予定ないなら――"
"70012020-190" = "キラキラな日々は、いつまでも。"
"70012020-191" = "ON AIR：ゲヘナ"
