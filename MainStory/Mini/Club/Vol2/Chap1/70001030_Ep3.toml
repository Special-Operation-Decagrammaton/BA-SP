[translation]
"70001030-1" = "テルマエ・アカエ（３）"
"70001030-2-ノドカ" = "結局、ここに来ることになるとは……"
"70001030-3-シグレ" = "仕方ないよ。それぞれ欠点があったんだし。"
"70001030-4-ノドカ" = "それはそうだけど……"
"70001030-5-ノドカ" = "ミレニアムサイエンススクールだけは避けたかったのに……"
"70001030-6-シグレ" = "……どうして？"
"70001030-7-ノドカ" = "ミレニアムサイエンススクールといえば、最先端の技術が有名だよね？"
"70001030-8-ノドカ" = "休憩室のコーヒーマシーンにさえ人工知能が搭載されてるって噂があるくらいだから……入浴施設の設備なんて、私たちには絶対に手が届かないよ……"
"70001030-9-シグレ" = "噂なんて[ruby=おおげさ]大袈裟[/ruby]に広がるものじゃない？"
"70001030-10-シグレ" = "とりあえず、値段だけでも聞いてこうよ。"
"70001030-11-ノドカ" = "うん……"
"70001030-12-ウタハ" = "き、緊急撤去！？"
"70001030-13-ウタハ" = "私たちの改造した入浴施設に、何か問題でもありましたか！？"
"70001030-14-ミレニアム寮長" = "い、いえ。その……[ruby=・   ・]現状[/ruby]、問題はありませんが……"
"70001030-15-ミレニアム寮長" = "後ほど、他の学園の方が寮の浴場を見学されるので……"
"70001030-16-ミレニアム寮長" = "セミナーの審査を通ってないエンジニア部の発明品を、他の学園の方に見せるのはちょっと……"
"70001030-17-ウタハ" = "それはおかしい。私たちエンジニア部だって、ミレニアムサイエンススクールの一員として、発明品を外部に披露する資格があるはずだ。"
"70001030-18-ウタハ" = "それに外部からお客さんが来るというのなら、なおさら私たちに任せた方が良いのでは？"
"70001030-19-ミレニアム寮長" = "いえ、むしろ……そもそも皆さんはこれまで――"
"70001030-20-ノドカ" = "あの、すみません……レッドウィンター連邦学園の者ですが……"
"70001030-21-ノドカ" = "も、もう到着したんですか！？"
"70001030-22-ミレニアム寮長" = "申し訳ありませんが……まだお見せする準備が整っていなくて……"
"70001030-23-ノドカ" = "そうなんですか？#n問題ないように見えますけど……"
"70001030-24-ウタハ" = "その通り。新しい入浴施設の準備は完璧さ。"
"70001030-25-ミレニアム寮長" = "ウ、ウタハ部長……！"
"70001030-26-ノドカ" = "新しい入浴施設……？"
"70001030-27-ヒビキ" = "新型入浴施設の機能については、私から説明しましょう！"
"70001030-28-ヒビキ" = "まずはこちら。浴槽に搭載された最先端の人工知能が、使用者のコンディションに合わせリアルタイムで水温を調整してくれます！"
"70001030-29-ヒビキ" = "使用者の肌状態を自動的に分析してくれるので、温度を設定する必要はありません！"
"70001030-30-ヒビキ" = "給湯器は、周辺のエネルギー源から熱を吸収するヒートポンプ式。#n冷媒としても使える……"
"70001030-31-ヒビキ" = "冷媒を活用した冷蔵庫もあるから、入浴中に冷たい飲み物が飲めるよ。"
"70001030-32-シグレ" = "冷蔵庫つきの浴槽……それはいいね。"
"70001030-33-ウタハ" = "それと、この入浴施設には面倒くさがり屋のための自動入浴補助機能もあるんだ。"
"70001030-34-ウタハ" = "複数のロボットアームが音声認識で動作し、身体を自動で洗ってくれる。"
"70001030-35-ウタハ" = "この浴槽ひとつで、複数の家電代わりになるんだ。"
"70001030-36-ノドカ" = "あの……お話を聞いていると、確かにすごそうですけど……"
"70001030-37-ノドカ" = "これほどの機能があるとすると……やっぱり導入にはお金がかかりますよね……？"
"70001030-38-コトリ" = "お代のことでしたら、心配無用です！"
"70001030-39-コトリ" = "この新型入浴施設はまだ試作品ですので、製作費を除く設置費や修理費は全て、私たちエンジニア部で負担いたします！"
"70001030-40-ヒビキ" = "運転中に発生した事故については責任を負わない、という制約はつくけど……"
"70001030-41-ヒビキ" = "……この額でどう？"
"70001030-42-ノドカ" = "こんなに安いの！？"
"70001030-43-ノドカ" = "すぐに契約します！"
"70001030-44-ノドカ" = "あの……ひとつ先に申し上げておきますと……"
"70001030-45-ミレニアム寮長" = "エンジニア部の発明品は性能こそ確かなのですが、いつも予想外の機能が追加されることで悪名高いので……"
"70001030-46-ミレニアム寮長" = "安全性のテストが終わるまで時間もかかりますし……他の学園の施設を取り入れた方が……"
"70001030-47-ノドカ" = "大丈夫です！機能が追加されるならむしろお得じゃないですか！"
"70001030-48-ウタハ" = "うん、その通りだとも。タダでおまけまで付いてくるのに、断る理由は無いね。"
"70001030-49-ヒビキ" = "サービス、サービス。"
"70001030-50-ノドカ" = "レッドウィンター連邦学園の使者として、この場で承認します！"
"70001030-51-ノドカ" = "私たちレッドウィンター連邦学園の寮に、新型入浴施設の設置をお願いします！"
"70001030-52-ヒビキ" = "お任せください！"
"70001030-53" = "レッドウィンター連邦学園・学生寮"
"70001030-54-チェリノ" = "ふむ……これが特別クラスのやつらがミレニアムサイエンススクールから取り入れたという入浴施設か……"
"70001030-55-チェリノ" = "見た目は普通だが……ミレニアムの理屈バカがレッドウィンター連邦学園の生徒をサボタージュさせようと、怪しい機能を仕込んでいるかもしれない。"
"70001030-56-チェリノ" = "我がレッドウィンター連邦学園生の安全のためにも、この生徒会長であり、環境美化部部長兼、書記長兼、運動部代表兼等々の……おいらがじっくり試さねばな。"
"70001030-57-チェリノ" = "……別に好奇心で先に入ろうとしているわけではないぞ！"
"70001030-58-チェリノ" = "ふむむ……説明書によると、人工知能を搭載したロボットが自動で身体を洗ってくれるらしいな。"
"70001030-59-チェリノ" = "聞いてるか、人工知能。このチェリノ様の頭を洗うんだ。"
"70001030-60-お風呂ロボット" = "＜自動入浴補助機能を起動します＞"
"70001030-61-チェリノ" = "おお……本当に自動で頭を洗ってくれるとは……"
"70001030-62-チェリノ" = "うむ……悪くない……"
"70001030-63-チェリノ" = "……うぅ！ちょっと待て！目に泡が入ったじゃないか！"
"70001030-64-チェリノ" = "もっと優しく洗わんか！さもなければ、お前を粛清するぞ！"
"70001030-65-お風呂ロボット" = "＜粛清……＞"
"70001030-66-お風呂ロボット" = "＜申し訳ありません。「粛清」の意味が理解できませんでした。自動入浴補助機能を再開します>"
"70001030-67-チェリノ" = "粛清の意味すら理解できないのか、ポンコツめ！"
"70001030-68-チェリノ" = "もうよい、おいらが自分で洗う！手を退けてくれ！"
"70001030-69-お風呂ロボット" = "<警告、ロボットアームの作動中に立ち上がるとケガの原因になります>"
"70001030-70-お風呂ロボット" = "<……使用者の安全のため、拘束モードに切り替えます>"
"70001030-71-チェリノ" = "ううっ……？ロボットアームが身体を締め付けて、動けない……？"
"70001030-72-チェリノ" = "放せ！お風呂はもうよいと言ったはずだ！"
"70001030-73-お風呂ロボット" = "<十分な入浴効果を得るためには、身体を洗う前に5分以上お湯で肌を温めるのが推奨されます>"
"70001030-74-お風呂ロボット" = "<普段は手の届かない耳や首の後ろなど、隅々までお流しします>"
"70001030-75-チェリノ" = "やっ、やめるのだ！これは命令だぞ！"
"70001030-76-お風呂ロボット" = "<使用者の急激な心拍数増加を確認……>"
"70001030-77-お風呂ロボット" = "<状態安定に効果的なクラシック音楽を再生します……>"
"70001030-78-チェリノ" = "やめろおおおおお！"
"70001030-79" = "（しばらくして……）"
"70001030-80-トモエ" = "あら、チェリノちゃん。今日のお風呂は随分と長かったですね。"
"70001030-81-トモエ" = "水の滴る姿がシャワーを浴びたばかりのチワワみたいで……可愛いです、ふふ。"
"70001030-82-チェリノ" = "……。"
"70001030-83-トモエ" = "お肌もモチモチ……今日は石鹸を使ってよく洗えたんですね？"
"70001030-84-トモエ" = "ミレニアムサイエンススクールから取り入れた新しい入浴施設、気に入ってもらえたようで良かったです。"
"70001030-85-チェリノ" = "……だ……"
"70001030-86-トモエ" = "……はい？"
"70001030-87-チェリノ" = "……これを作ったやつらは、全員粛清だ！"
"70001030-88" = "（その後、エンジニア部の新型入浴施設は撤去され、227号特別クラスの生徒たちは再び旧校舎に追いやられる事となった……）"
"70001030-89" = "（この件でミレニアムサイエンススクールとレッドウィンター連邦学園の関係性に若干のヒビが入り、いくつか問題が発生したが……それはまた別のお話）"
"70001030-90" = "テルマエ・アカエ"
