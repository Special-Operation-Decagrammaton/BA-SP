[translation]
"70001010-1" = "テルマエ・アカエ（１）"
"70001010-2-デモ隊A" = "隊長！あのチビが事務局を率いてこちらに……！"
"70001010-3-デモ隊B" = "チッ。今回のクーデターもここまでなのかっ……！"
"70001010-4-デモ隊B" = "これで終わりだと思うなよ！"
"70001010-5-デモ隊B" = "次こそ必ずや、あのチビを追い出してレッドウィンター連邦学園に新たな――"
"70001010-6-チェリノ" = "全員粛清！粛清だ！"
"70001010-7" = "チェリノのオフィス"
"70001010-8-チェリノ" = "ふぅ……なんとか治まったな。"
"70001010-9-マリナ" = "チェリノ会長、クーデターの関係者を全員逮捕しました！"
"70001010-10-チェリノ" = "うむ、よくやった。マリナ委員長！"
"70001010-11-チェリノ" = "その功績を賞賛して、特別に「第一級髭勲章」を……"
"70001010-12-チェリノ" = "……むむ？「第一級髭勲章」は前回のクーデターで授与したような？"
"70001010-13-チェリノ" = "トモエ秘書室長、今週のクーデターはこれで何回目だ？"
"70001010-14-トモエ" = "未遂止まりが2回、成功したのが5回になります。"
"70001010-15-トモエ" = "……あら、今週は1日も静かな日がありませんでしたね。"
"70001010-16-トモエ" = "この1週間、クーデターに立ち向かい続けた会長の偉業が後世に伝わるよう、画家を呼んで戦争画を描かせましょうか？"
"70001010-17-チェリノ" = "戦争画はもう良い……#nというか前回のクーデターでは、その画家が首謀者だったではないか……"
"70001010-18-チェリノ" = "……それで、今度は何が不満なんだ？"
"70001010-19-マリナ" = "はい……？不満、ですか？"
"70001010-20-チェリノ" = "いくらあいつ[ruby=ら]等[/ruby]が衝動的とはいえ、特に理由もなくこれほどの人数を動員するのは不可能だろう。"
"70001010-21-チェリノ" = "普段は3日に1度だったクーデターが、7日連続で起こったのだからな。"
"70001010-22-チェリノ" = "おいらが治めるレッドウィンター連邦学園の何が気に食わないというのだ？"
"70001010-23-マリナ" = "ええと……それは、その……"
"70001010-24-トモエ" = "調査によると、今回の首謀者はレッドウィンター連邦学園内の入浴施設の改善を求めてクーデターを起こしたそうです。"
"70001010-25-チェリノ" = "入浴施設……？#nそれなら我がレッドウィンター連邦学園には、すでにあるではないか。"
"70001010-26-チェリノ" = "しかし、なぜ今になって入浴施設が理由で……？"
"70001010-27-トモエ" = "……「227号温泉郷」を味わってしまったから、ではないかと。"
"70001010-28-チェリノ" = "227号温泉郷？#nどうしてその名が出てくるのだ？"
"70001010-29-トモエ" = "227号温泉郷は、レッドウィンター連邦学園で類を見ないほどに贅沢な温泉でしたから。"
"70001010-30-トモエ" = "豪華な湯を経験してしまったことで、老朽化した寮の施設に不満を抱いたようです。"
"70001010-31-チェリノ" = "ふん、おいらからすれば大差なかったぞ。"
"70001010-32-チェリノ" = "温水さえ出れば問題なかろう。#nレッドウィンター連邦学園の寮だって、温水くらい出ている！"
"70001010-33-トモエ" = "……午前7時と午後7時からの2時間だけではありますが。"
"70001010-34-マリナ" = "給湯器が故障して冷水しか出ない日も……"
"70001010-35-チェリノ" = "なにを言う。レッドウィンター連邦学園のシャワー室は、数百人の生徒が同時に入れる広さを誇っている。"
"70001010-36-チェリノ" = "キヴォトスいちの規模と言っても過言ではない！"
"70001010-37-トモエ" = "隣と仕切りすらない、錆びた蛇口が並んでいるだけの空間ですが……"
"70001010-38-マリナ" = "あぁ……仕事終わりに広い温泉で1日の疲れを癒やしていたあの時間が恋しい……"
"70001010-39-マリナ" = "お風呂上がりの冷たいコーヒー牛乳は、まさに至福の1杯で――"
"70001010-40-マリナ" = "も、もも、もちろん！#nコーヒー牛乳がいくら甘かろうが、チェリノ会長がお作りになられている「チェリョンカ」の足元にも及びませんが！"
"70001010-41-マリナ" = "そもそも温泉などという贅沢を求めるなど、ブルジョワの発想……"
"70001010-42-チェリノ" = "……。"
"70001010-43-マリナ" = "ほ、本心です！信じてください、チェリノ会長！どうか粛清だけは……！"
"70001010-44-チェリノ" = "……レッドウィンター連邦学園の入浴施設を、大々的に改修するとしよう。"
"70001010-45-マリナ" = "は、はい……？"
"70001010-46-チェリノ" = "話を聞いてなかったのか、マリナ委員長？"
"70001010-47-チェリノ" = "レッドウィンター連邦学園の入浴施設を、改修すると言ったのだ。"
"70001010-48-チェリノ" = "他の生徒ならともかく、事務局の功臣までもが言うのなら、生徒の大半が同じ不満を抱いているのは明白。"
"70001010-49-チェリノ" = "偉大なる指導者とは、常に民衆の声に耳を傾けるもの……"
"70001010-50-チェリノ" = "生徒の不満から目を逸らし、独断を強行するほどおいらは無能ではない！"
"70001010-51-チェリノ" = "それに、たかがお風呂ごときでクーデターを起こされては困るし……"
"70001010-52-チェリノ" = "素晴らしいお考えです、会長！"
"70001010-53-トモエ" = "会長の権威に反旗を翻した生徒にさえ、寛大なお心で許し、広い心で包み込むなんて……トモエ、感激しました！"
"70001010-54-チェリノ" = "えっへん、当然であろう。おいらはレッドウィンター連邦学園の生徒会長であり、環境美化部部長兼、書記長兼、運動部代表兼等々の……チェリノ様なのだぞ！"
"70001010-55-トモエ" = "会長が入浴施設を改修されると聞いた学園中の生徒は、その慈悲深さに感激のあまり涙を流すことでしょう。"
"70001010-56-トモエ" = "今すぐ『レッドベア』に連絡し、特集記事を書かせましょうか？"
"70001010-57-チェリノ" = "うむ、任せた。トモエ秘書室長。"
"70001010-58-チェリノ" = "さて、入浴施設の改修だが……"
"70001010-59-チェリノ" = "……とりあえず、シャワー室の大きさを2倍にすれば良いのか？"
"70001010-60-マリナ" = "ええと……それはちょっと、方向性が違うような――"
"70001010-61-トモエ" = "シャワー室の増築も良い案なのですが、この件は[ruby=・   ・   ・]専門家[/ruby]に任せてはいかがでしょう？"
"70001010-62-チェリノ" = "[ruby=・   ・   ・]専門家[/ruby]……？#n我がレッドウィンター連邦学園に適任がいるというのか？"
"70001010-63-トモエ" = "はい。レッドウィンター連邦学園には、大規模温泉施設の運営を見事に成し遂げた方がおります。"
"70001010-64-トモエ" = "それは……"
"70001010-65-ノドカ" = "飢えと寒さの厳しい旧校舎生活に耐えながら、嘆願書を書き続けていた日々が……"
"70001010-66-ノドカ" = "ついに私たちの切実な声が、チェリノ会長に届いたんですね！"
"70001010-67-ノドカ" = "……釈放されるんですよね？"
"70001010-68-チェリノ" = "いや、仮釈放だが。"
"70001010-69-チェリノ" = "今まで反省の気配など微塵も無かったくせに、釈放を期待するなんて厚かましいことこの上ないな。"
"70001010-70-ノドカ" = "そんな！"
"70001010-71-ノドカ" = "旧校舎の劣悪な環境下で、真面目に反省文を提出して静かに謹慎してたじゃないですか！"
"70001010-72-チェリノ" = "……静かに？"
"70001010-73-ノドカ" = "た、たまに[USERNAME]先生の姿を覗きはしてましたけど……"
"70001010-74-シグレ" = "……シャーレ近くの電柱に登ったときは、ヴァルキューレ生に逮捕されてたよね。"
"70001010-75-チェリノ" = "ほら見ろ。ロクに反省もせず違反を繰り返す生徒を釈放しては、おいらの権威に関わるのだ！"
"70001010-76-ノドカ" = "……ぬか喜びして損しました。"
"70001010-77-ノドカ" = "釈放じゃないなら、どうして急に呼び出したんですか？"
"70001010-78-チェリノ" = "……お前たちに、頼みがある。"
"70001010-79-チェリノ" = "今回の件を解決してくれるのであれば、お前たちの過ちを不問にしよう。#n名誉ある勲章に、事務局の職位も与えてやろう！"
"70001010-80-ノドカ" = "チェリノ会長の勲章はどうでもいいけど……"
"70001010-81-ノドカ" = "今の今まで私たちを気にかけすらしてなかったのに、いきなり呼び出してお願いだなんて……一体なにを企んでるんですか！"
"70001010-82-ノドカ" = "まさか、勝手に温泉を運営した件を蒸し返す気じゃ――"
"70001010-83-ノドカ" = "いえ、そうではありません。#n私たちレッドウィンター事務局一同は、皆さんの勤勉な姿に大変感銘を受けました。"
"70001010-84-トモエ" = "ゼロから温泉施設を築き、学園内外のお客さんを立派にもてなした特別クラスの皆さんのご活躍は、まさにレッドウィンター連邦学園の全労働者の鑑。"
"70001010-85-ノドカ" = "まぁ……無許可運営だったけど。"
"70001010-86-トモエ" = "たしかに事務局の許可は得ていませんでしたが……"
"70001010-87-トモエ" = "そこで今回は、事前に私たちが皆さんに入浴施設の運営機会を差し上げようと思いまして。"
"70001010-88-ノドカ" = "えっ？それって……227号温泉郷を復活させるんですか？"
"70001010-89-チェリノ" = "ふん、ゲヘナの問題児どもによって、危うく学園が溶岩の海に飲み込まれるところだったのだ。なのに再開発を許すわけないだろう。"
"70001010-90-トモエ" = "正確に申し上げますと、お願いしたいのは学園寮の入浴施設の管理です。"
"70001010-91-チェリノ" = "この度、生徒の皆さんから要望を受けて、入浴施設を全面的に改修する運びとなりました。"
"70001010-92-トモエ" = "そこで大規模な温泉施設の運営経験がある227号特別クラスの皆さんに、ご相談をしようと思い。"
"70001010-93-トモエ" = "なあんだ、温泉じゃなくて寮のお風呂か……"
"70001010-94-シグレ" = "それじゃ、売店で[ruby=・   ・   ・]飲み物[/ruby]の販売は出来そうにないね。"
"70001010-95-シグレ" = "将来的には他の施設の追加も視野に入れておりますが、まずは大勢の生徒が利用できる大規模入浴施設の用意が先決。"
"70001010-96-トモエ" = "227号特別クラスの皆さんで他の学園の入浴施設を見学してから、どの学園の設備を導入するか検討していただきたく思います。"
"70001010-97-トモエ" = "他の学園の見学……？"
"70001010-98-トモエ" = "はい。財源も技術も不足しているので、私たちだけで改修するのは難しいですから。"
"70001010-99-トモエ" = "そこで今回は、すでに存在する入浴施設と同じものを発注したいと考えておりまして。"
"70001010-100-トモエ" = "私たち事務局が行っては利害関係が絡む恐れもあるため、特別クラスの皆さんにお願いしたく。"
"70001010-101-トモエ" = "もちろん、見学に必要な費用はレッドウィンター事務局が全額負担いたします。#n入浴施設の運営に関わるものなら、ご自由に見てきて頂いて構いません。"
"70001010-102-トモエ" = "本来なら一般生徒にはあり得ない待遇なのだぞ！光栄に思え！"
"70001010-103-シグレ" = "う～ん……なんだか展開がトントン拍子すぎて逆に気が乗らないなぁ……"
"70001010-104-シグレ" = "でもシグレちゃん、これはチャンスだよ！"
"70001010-105-ノドカ" = "ここで手柄を上げれば、厳しい旧校舎生活から抜け出せるんだよ！#n温泉運営も再開できるかも！"
"70001010-106-ノドカ" = "それに、いろんな学園の入浴施設をタダで体験できるんだよ？#nこれ以上、失うものは無いし受けてみても良いんじゃない？"
"70001010-107-ノドカ" = "まあ、ノドカがそう言うなら反対はしないけど……"
"70001010-108-ノドカ" = "はいはい！やります！"
"70001010-109-ノドカ" = "今は無き227号温泉郷の名にかけて、レッドウィンター連邦学園の全生徒が満足できる最高の入浴施設を目指します！"
"70001010-110-トモエ" = "ふふ、心強いですね。"
"70001010-111-トモエ" = "では……お願いします。"
