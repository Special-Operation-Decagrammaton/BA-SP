"70002010-108-キララ" = "なら、そんなに遠くないね。"
"70002010-109-キララ" = "うん！こっちの階段を降りて、あっちにまっすぐ行って――"
"70002010-110-キララ" = "うーん……口だとちょっと分かりづらいか。#nエリカちゃん、案内してあげない？"
"70002010-111-エリカ" = "そうだね、一緒に行こっか。"
"70002010-112-キララ" = "うん、じゃあついてきて～！"
"70002010-113-温泉部の部員A" = "ありがとー！すっごく助かるよ～！"
"70002010-114-温泉部の部員A" = "さあみんな、移動するよ～！"
"70002010-115-エリカ" = "こっちこっちー！"
"70002010-116-キララ" = "とーちゃーく！"
"70002010-117-エリカ" = "ここで良いんだよね？"
