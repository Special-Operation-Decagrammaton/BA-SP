"70002010-119-温泉部の部員A" = "ありがとね！じゃあ、私達は部活動があるから！"
"70002010-120-エリカ" = "ユアウェルカム！じゃあね～！"
"70002010-121-エリカ" = "良いことをすると気持ちいいね～！"
"70002010-122-エリカ" = "たしかに、そうだね。"
"70002010-123-キララ" = "ほんと、キララちゃんと帰ると退屈しないな。"
"70002010-124-エリカ" = "――毎回、色んなことが起こる。"
"70002010-125-ゲヘナ自治区の市民B" = "温泉開発部がまた爆破してる！"
"70002010-126-ゲヘナ自治区の市民B" = "みんな離れて！巻き込まれるよ！"
"70002010-127-エリカ" = "うんうん！毎日がワクワク！たのし～い！"
"70002010-128-キララ" = "でも、ちょーっとだけ物足りない気もするんだよね。"
"70002010-129-エリカ" = "ん？どうしたの？"
"70002010-130-キララ" = "うーん……。"
"70002010-131-キララ" = "あははっ！何でもない！"
"70002010-132-キララ" = "そろそろ帰ろっか！"
"70002010-133-エリカ" = "さて、ここまでかな。"
"70002010-134-エリカ" = "んじゃ、また明日。"
"70002010-135-キララ" = "……。"
"70002010-136-エリカ" = "キララちゃん？"
"70002010-137-キララ" = "……うん、やっぱりエリカちゃんには言わなきゃだよね。"
"70002010-138-エリカ" = "さっきから悩んでたこと？"
"70002010-139-キララ" = "あ、あれ？あたし、そんな顔に出てた？"
"70002010-140-エリカ" = "どれだけ一緒にいると思ってるのさ、そりゃ分かるよ。"
"70002010-141-エリカ" = "なんか悩んでたみたいだから、聞かなかったけど。"
"70002010-142-キララ" = "あははっ！やっぱエリカちゃんに隠しごとはできないなぁ。"
"70002010-143-キララ" = "えっとね……"
"70002010-144-キララ" = "今も楽しいんだけど、なんかちょっと物足りないな～って。"
"70002010-145-エリカ" = "なにが？"
"70002010-146-キララ" = "青春が！"
"70002010-147-キララ" = "ワクワクが！！"
"70002010-148-キララ" = "キラキラが！！！"
"70002010-149-エリカ" = "う、うーん……？"
"70002010-150-エリカ" = "どういうこと？"
"70002010-151-キララ" = "えっとね、つまり――"
"70002010-152-キララ" = "――部活動がしたいの！"
"70002010-153-エリカ" = "部活動？"
"70002010-154-エリカ" = "急にどうしたの？"
"70002010-155-キララ" = "昨日、「私たちの青春物語～最強の部活編～」を見てさ……。"
"70002010-156-エリカ" = "ああ、最近ハマってるやつ？"
"70002010-157-キララ" = "そうそう！主人公が部活を頑張る内容だったんだけど、すっごく楽しそうで……。"
"70002010-158-キララ" = "だから、やってみたくなったの！"
"70002010-159-キララ" = "帰宅部も良いけど、ちゃんと部活を始めたらもっと楽しいことに出会えるんじゃないかなって！"
"70002010-160-キララ" = "今日会った人たちも、みんなそれぞれ部活を頑張ってたし？"
"70002010-161-キララ" = "部活の楽しさを知らないまま学生時代を終えるなんて、もったいないかも～？って！"
"70002010-162-キララ" = "青春の半分以上を損しちゃってるのかも、って思って！"
"70002010-163-エリカ" = "そ、そうかな……？"
"70002010-164-キララ" = "そうだよ！青春の思い出を語る時、部活がよく挙がるくらいだし！"
"70002010-165-エリカ" = "キララちゃんがそう思うなら……。"
"70002010-166-エリカ" = "まあ、いいんじゃない？#nやってみよっか。"
"70002010-167-キララ" = "一緒にやってくれるの？"
"70002010-168-エリカ" = "そりゃまあ、いつものことでしょ？"
"70002010-169-エリカ" = "今回も付き合うよ、親友だもの。"
"70002010-170-キララ" = "わーい！エリカちゃん最高！ありがとう！"
"70002010-171-エリカ" = "で、どんな部活が良いの？入りたいとことか決まってる？"
"70002010-172-キララ" = "ううん！これから考える！"
"70002010-173-エリカ" = "ふーん、そっか。"
"70002010-174-エリカ" = "じゃあ、こういうのはどう？"
"70002010-175-エリカ" = "どこでも大抵、体験入部のシステムがあるだろうし……。"
"70002010-176-エリカ" = "色んな部活を体験してから、入りたい部活を探してみたら？"
"70002010-177-キララ" = "その手があったか！いいね！"
"70002010-178-キララ" = "キラキラしてて、ワクワクできる部活があるといいな～！"
