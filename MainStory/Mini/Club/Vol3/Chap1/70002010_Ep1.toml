[translation]
"70002010-1" = "キララとエリカのキラキラな日（１）"
"70002010-2-キララ" = "ナイトリップパック、オッケー！#nナイトキャップ、オッケー！"
"70002010-3-キララ" = "準備もばっちし～！#nそろそろ寝よっ！"
"70002010-4-キララ" = "明日は何をしよっかな～。"
"70002010-5-キララ" = "ん？"
"70002010-6-キララ" = "なんだろ……。"
"70002010-7-キララ" = "えーマジ！？新作じゃん！"
"70002010-8-キララ" = "うわ、しかもアレの続編！？"
"70002010-9-キララ" = "寝てる場合じゃないんだけど！？"
"70002010-10" = "青春の思い出を作っていこう！"
"70002010-11" = "思い出づくりといえば……！"
"70002010-12-キララ" = "……！"
"70002010-13-キララ" = "キララちゃん、一緒に帰ろ～。"
"70002010-14-キララ" = "……。"
"70002010-15-エリカ" = "あれ、どしたの？"
"70002010-16-エリカ" = "わっ！？エリカちゃん！？いつ来たの！？"
"70002010-17-キララ" = "さっき来たとこ。#nチャイムもう鳴ったよ。"
"70002010-18-キララ" = "あ、うん、そっか。"
"70002010-19-エリカ" = "なんかぼーっとしてるみたいだけど、なんかあった？"
"70002010-20-キララ" = "え、いや別に！？何もないよ？"
"70002010-21-キララ" = "強いて言えば、昨日夜ふかししたからかも？ちょっと寝不足でさー。"
"70002010-22-エリカ" = "……？"
"70002010-23-キララ" = "うん、今日もキラキラしてる！"
"70002010-24-キララ" = "帰りにどこ寄ってく～？"
"70002010-25-キララ" = "あ！エリカちゃん、見て見て！"
"70002010-26-エリカ" = "ん？"
"70002010-27-キララ" = "ああ、あの子……。"
"70002010-28-キララ" = "タピオカ良いな～！#nっていうかあれって、噂の限定品だよね？"
"70002010-29-エリカ" = "ああ、なかなか手に入らないってやつ？#nどうやって買ったんだろ？"
"70002010-30-キララ" = "直接聞いてみよっか♪"
"70002010-31-エリカ" = "……また始まった。"
"70002010-32-キララ" = "はろはろ～！"
"70002010-33-ゲヘナの生徒" = "え、えっ！？誰？"
"70002010-34-キララ" = "はじめまして、あたしはキララ！#nこっちはエリカちゃん！"
"70002010-35-エリカ" = "そんな急に話しかけたら困っちゃうよ。"
"70002010-36-キララ" = "いま、大丈夫？"
"70002010-37-ゲヘナの生徒" = "あ、う、うん……大丈夫、だけど……。"
"70002010-38-キララ" = "んじゃ、ちょっとだけ時間ちょうだい！"
"70002010-39-ゲヘナの生徒" = "う、うん……まぁいいけど……。"
"70002010-40-キララ" = "ありがと♪#nそのタピオカドリンク、限定のヤツだよね？"
"70002010-41-キララ" = "マジで手に入らないって聞いてるんだけど、どうやって手に入れた感じ？"
"70002010-42-キララ" = "そこんとこ教えてもらいたいな～って！"
"70002010-43-エリカ" = "またそうやって畳みかけて……。"
"70002010-44-エリカ" = "急にごめんね。"
"70002010-45-エリカ" = "それ私たちも狙ってたんだけど、ずっと買えなくってさ。ちょっと気になって。"
"70002010-46-ゲヘナの生徒" = "そ、そっか……。"
"70002010-47-ゲヘナの生徒" = "確かに、普通に並ぶと大変らしいね。#nだから朝イチで予約したんだけど……。"
"70002010-48-キララ" = "あ、予約できるんだ！知らなかった！"
"70002010-49-キララ" = "教えてくれてありがと♪#nお返しじゃないけど、イチオシのクレープ屋さんシェアしたげる！"
"70002010-50-キララ" = "せっかくだしモモトーク教えて、お友達になろ♪"
"70002010-51-ゲヘナの生徒" = "と、友達？"
"70002010-52-キララ" = "そそ♪ダメかな？"
"70002010-53-ゲヘナの生徒" = "あ、いや……ダメじゃないけど……。"
"70002010-54-キララ" = "ありがとー！"
"70002010-55-ゲヘナの生徒" = "あ、そうだ……余計なお世話かもしれないけど……。"
"70002010-56-ゲヘナの生徒" = "ん？どしたの？"
"70002010-57-ゲヘナの生徒" = "この限定タピオカ、あんまり美味しく――"
"70002010-58-一同" = "わ、なんだろ？"
"70002010-59-通行人A" = "うわっ！スイーツカフェが！"
"70002010-60-通行人B" = "ええ！？なになに！？"
"70002010-61-某研究会のメンバーA" = "ふむ、それなりの有名店とのことでしたが……。"
"70002010-62-某研究会のメンバーA" = "こだわりの無い食材選び。#nバイラルマーケティングに頼り切った手法……。"
"70002010-63-某研究会のメンバーA" = "基本がなっていませんわ。これでは食材も悲しんでいることでしょう。"
"70002010-64-某研究会のメンバーA" = "でもでも、キシリトールキュウリサンドイッチは美味しかったよ～！"
"70002010-65-某研究会のメンバーA" = "それはイズミだけでしょ！"
"70002010-66-某研究会のメンバーA" = "食べ放題じゃないのが減点ですね～★"
"70002010-67-某研究会のメンバーA" = "食べ放題目当てなら、最初からそういうお店に行きなさいよ！#nっていうか私、結局食べられなかったんだけど！？"
"70002010-68-イオリ" = "そこまでだ、美食研究会！"
"70002010-69-某研究会のメンバーC" = "あらあら。"
"70002010-70-某研究会のメンバーA" = "風紀委員会！？早くない！？"
"70002010-71-イオリ" = "給食部から通報があって、パトロールを強化していたんだが――"
"70002010-72-イオリ" = "まさか、こんなにすぐ見つかるなんてな。"
"70002010-73-イオリ" = "それにしても、またお店を爆破だなんて……罪状追加だ、お縄につけ！"
"70002010-74-某研究会のメンバーA" = "色々とご説明したいところではありますが……。#n申し訳ありません、次の予定がありまして。"
"70002010-75-某研究会のメンバーA" = "――アカリさん。"
"70002010-76-某研究会のメンバーC" = "はいはーい★#nそれではまた会う日まで♪"
"70002010-77-某研究会のメンバーC" = "イズミ、ぼさっとしてないで撤退するわよ！"
"70002010-78-某研究会のメンバーB" = "ま、待って～～～！置いてかないで～！！"
"70002010-79-イオリ" = "ちょっ、こらぁ！"
"70002010-80-イオリ" = "げほっげほっ……。"
"70002010-81-イオリ" = "盗んだ給食部のトラックで、そのまま逃げるなんて……。"
"70002010-82-イオリ" = "ちょっと、そこの帰宅部の2人！"
"70002010-83-キララ" = "ん、あたし達？"
"70002010-84-イオリ" = "手を貸してほしい！#n今度こそ美食研究会を捕まえないと！"
"70002010-85-エリカ" = "ええ、そんな急に言われても……。"
"70002010-86-キララ" = "オッケー♪"
"70002010-87-エリカ" = "本当に良いの？"
"70002010-88-キララ" = "だって面白そうじゃん！"
"70002010-89-エリカ" = "……キララちゃんらしいね。"
"70002010-90-エリカ" = "わかった、付き合うよ。"
"70002010-91-キララ" = "やった♪エリカちゃん最高！"
"70002010-92-イオリ" = "助かる！"
"70002010-93-イオリ" = "さあ、行くぞ！"
"70002010-94-エリカ" = "イヤッホ～！"
"70002010-95" = "（そうして走り続け……）"
"70002010-96-キララ" = "はあ、はあ……もう無理～。"
"70002010-97-キララ" = "いやー、トラックも風紀委員会もどっか行っちゃったね。"
"70002010-98-キララ" = "ちょっと運動不足だったかも？"
"70002010-99-エリカ" = "私たちでアレに追いつくのはちょっと厳しいでしょ。"
"70002010-100-キララ" = "あははっ、でも面白かったし！久しぶりにいい汗かいたー！"
"70002010-101-エリカ" = "うん、私も。"
"70002010-102-メグ" = "そこの二人！"
"70002010-103-キララ" = "ん？"
