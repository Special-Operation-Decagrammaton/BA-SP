[translation]
"70002020-1" = "キララとエリカのキラキラな日（２）"
"70002020-2-キララ" = "はろはろ～！"
"70002020-3-キララ" = "[ruby=パンデモニウム・ソサエティー]万魔殿の休憩室[/ruby]ってここであってる？"
"70002020-4-エリカ" = "体験入部したいんだけど、良いかな？"
"70002020-5-マコト" = "……よく来た。"
"70002020-6-マコト" = "――ようこ[ruby=パンデモニウム・ソサエティー]そ、万魔殿へ。[/ruby]"
"70002020-7-マコト" = "ゲヘナ学園生徒会長であるこのマコト様と接する栄誉を、お前たちに授けよう。"
"70002020-8-キララ" = "授かった～！で、合ってる？"
"70002020-9-エリカ" = "多分。"
"70002020-10-キララ" = "どこかで見たことある気がするけど、あなたが受付の人？"
"70002020-11-マコト" = "なっ……！？受付……！？"
"70002020-12-マコト" = "このマコト様を……知らない、だと！？"
"70002020-13-マコト" = "私こそ[ruby=パンデモニウム・ソサエティー]が、万魔殿の永[/ruby]遠不滅のリーダー！#nいつかキヴォトスの覇者となる最も偉大な指導者、マコト様だ！"
"70002020-14-キララ" = "へー、そうなんだ？"
"70002020-15-マコト" = "なんだこいつは……無礼な奴め……。"
"70002020-16-マコト" = "……いや。まだ天地の見分けもつかぬ新人に、いちいち振り回されてはならない。"
"70002020-17-マコト" = "こほん。話を戻そう……。"
"70002020-18-マコト" = "キキキッ……！[ruby=パンデモニウム・ソサエティー]我が万魔殿の活[/ruby]動を体験したいと言ったな。"
"70002020-19-マコト" = "歓迎しよう！キララ、そしてエリカよ！"
"70002020-20-エリカ" = "あれ？私たちの名前知ってるの？"
"70002020-21-マコト" = "キシシッ、無論だ。"
"70002020-22-マコト" = "我々万魔殿に直接足を運び、さらには体験入部を求める者の名を覚える程度のこと……。"
"70002020-23-マコト" = "このマコト様にとっては造作もない。"
"70002020-24-マコト" = "キキキッ……期待しても良いぞ。#n今後、我々万魔殿の幹部になることだって夢では――"
"70002020-25-キララ" = "んー、それは良いかな。"
"70002020-26-マコト" = "なにぃっ！？"
"70002020-27-マコト" = "くっ。なるほど、そこまではまだ時間が必要、ということか。"
"70002020-28-マコト" = "幹部ではなく下っ端だからこそ、見えてくる景色もあると……ふむ。"
"70002020-29-マコト" = "そこまで見越していたのだな、[ruby=よざくら]夜桜[/ruby]キララ……！"
"70002020-30-エリカ" = "違うと思うけど……。"
"70002020-31-イロハ" = "はい、ありがとうございます。体験入部希望ですね。"
"70002020-32-イロハ" = "しかし体験入部だなんて、何と言うか……奇特な方々ですね。"
"70002020-33-エリカ" = "普段、万魔殿って何してるの？"
"70002020-34-エリカ" = "ゲヘナ学園の生徒会みたいな役割とは聞いてるけど……。"
"70002020-35-エリカ" = "学園の運営に関わる予算管理、とか？"
"70002020-36-イロハ" = "はい、そういう仕事もありますね。"
"70002020-37-イロハ" = "他にもゲヘナの顔として、対外業務や外部との契約などを担っていますが……。"
"70002020-38-イロハ" = "まぁ最近は……マコト先輩のやらかしに対する後始末が多いですね……。"
"70002020-39-マコト" = "じー……。"
"70002020-40-マコト" = "ん？何だ、イロハ。#nマコト様の顔に、尊厳以外なにか付いているのか？"
"70002020-41-イロハ" = "いえ、何でもありません。#nはぁ……。"
"70002020-42-エリカ" = "なんだか大変そうだね。"
"70002020-43-イブキ" = "たっだいまー！"
"70002020-44-イブキ" = "あれ？帰宅部のお姉さんたち？"
"70002020-45-エリカ" = "え？"
"70002020-46-キララ" = "イブキちゃーん！はろはろ～！"
"70002020-47-エリカ" = "やっほ、イブキちゃん。また会ったね。"
"70002020-48-イブキ" = "わあ、お姉さんたち！会えて嬉しい！#n遊びに来てくれたのー？"
"70002020-49-キララ" = "そうそう！今日は体験入部に来たんだ♪#nまあ、遊びに来たのと同じかな！"
"70002020-50-イブキ" = "ほんと？やったー！"
"70002020-51-エリカ" = "イブキちゃんと会うのは久しぶりなのに、全然そんな感じしないね。"
"70002020-52-エリカ" = "「週刊万魔殿」で、イブキちゃんの写真をいっぱい見てるからかな？"
"70002020-53-イロハ" = "なるほど……。#nマコト先輩とチアキが作っているあの週刊誌、無意味ではなかったのですね。"
"70002020-54-マコト" = "クククッ！ようやくマコト様の真価が分かったか！"
"70002020-55-イロハ" = "はいはい……。"
"70002020-56-マコト" = "さて……。"
"70002020-57-マコト" = "イブキ～？"
"70002020-58-マコト" = "何を隠そう、冷蔵庫にプリンがあるぞー？"
"70002020-59-エリカ" = "そういえばイブキちゃん、お手玉が得意なんだっけ？#n「週刊万魔殿」で読んだよ！"
"70002020-60-キララ" = "よかったら見せてくれない？"
"70002020-61-イブキ" = "いいよー！"
"70002020-62-イブキ" = "お姉さんたちにもお手玉教えてあげる！"
"70002020-63-キララ" = "やった～、イブキちゃんのお手玉♪"
"70002020-64-エリカ" = "あっちでやろっか。"
"70002020-65-マコト" = "……！"
"70002020-66-マコト" = "い、イブキ……？"
"70002020-67-マコト" = "プリン……は……？"
"70002020-68-マコト" = "い、イブキぃ！？#n私よりあいつらの方が良いと言うのか！？"
"70002020-69-マコト" = "そ、そんな……違うよな？"
"70002020-70-マコト" = "イブキ！う、嘘だと言ってくれ！#nイブキぃ！！"
"70002020-71-イロハ" = "……。"
"70002020-72-イロハ" = "今日は静かに過ごせそうですね。"
"70002020-73-キララ" = "イブキちゃんと遊ぶの、すっごく楽しかった～！"
"70002020-74-エリカ" = "意外と時間使っちゃったね。#n次の体験入部に間に合わないかも、急ごう。"
"70002020-75-キララ" = "あははっ、そうだね！次ってどこだっけ？"
"70002020-76-エリカ" = "次は……"
"70002020-77-ジュリ" = "ようこそ、ゲヘナ給食部です！"
"70002020-78-ジュリ" = "体験入部、歓迎します！"
"70002020-79-エリカ" = "わ～！美味しそうな匂い！お腹空いてきちゃった！"
"70002020-80-エリカ" = "食堂はよく来てたけど、キッチンに入ったのは初めてかも。"
"70002020-81-フウカ" = "ここでみんなの食事を作ってるの。#nゲヘナの台所へようこそ。"
"70002020-82-フウカ" = "ちなみに二人とも、料理経験はある？"
"70002020-83-エリカ" = "うーん、たまに肉じゃが作るくらいかな？"
"70002020-84-キララ" = "あたしはからっきしー！"
"70002020-85-ジュリ" = "大丈夫ですよ！これから勉強していけばいいですから！"
"70002020-86-ジュリ" = "今日は私がお教えしますね！"
"70002020-87-フウカ" = "ごめんね、私も手伝えたら良かったんだけど、#n夕食の仕込みをしないといけなくて……。"
"70002020-88-フウカ" = "いつもみたいにトラックで一気に食材を運べれば、こんなに時間かからなかったのに……。"
"70002020-89-フウカ" = "私たちの……。"
"70002020-90-フウカ" = "私たちの、給食部のトラックが……！"
"70002020-91-ジュリ" = "ふ、フウカ先輩！大丈夫です！#nきっと戻っ……何とかなります！"
"70002020-92-フウカ" = "と、とりあえずそういうことだから、#n後はジュリに任せるね。"
"70002020-93-ジュリ" = "はい、お任せください！基礎から丁寧に教えます！"
"70002020-94-フウカ" = "ありがとう。それじゃあ二人も、ごゆっくり……。"
"70002020-95-ジュリ" = "それでは、私についてきてください！"
"70002020-96-ジュリ" = "施設見学の後に、実際の料理へと移っていきましょう。"
"70002020-97-キララ" = "シェフ・キララの第一歩、って感じ？#nワクワクしてきた！"
"70002020-98-ジュリ" = "こちらがキッチン内部です。"
"70002020-99-ジュリ" = "ここが食器棚でこちらはグリル……コンロはこれで……。"
"70002020-100-エリカ" = "このキッチンでいつも何人分の料理を作ってるの？"
"70002020-101-ジュリ" = "そうですね……数千人分くらいでしょうか。"
"70002020-102-キララ" = "えっ！？マジ！？"
"70002020-103-キララ" = "あーでも、毎日食堂に来る生徒数すごいもんね。"
"70002020-104-キララ" = "大変そ～。"
"70002020-105-ジュリ" = "最初は大変でしたが、もう慣れました！"
"70002020-106-ジュリ" = "それではそろそろ、料理に移ります！"
"70002020-107-ジュリ" = "今日はまず……基本の料理であるオムライスを！"
"70002020-108-ジュリ" = "おお……！"
"70002020-109-ジュリ" = "こうして器に盛れば……ジャーン！"
"70002020-110-ジュリ" = "ど、どうでしょう？"
"70002020-111-エリカ" = "さすがベテランは一味違う――"
"70002020-112-エリカ" = "……いや、ちょっと待って。"
"70002020-113-エリカ" = "オムライスってこんな色だっけ？"
"70002020-114-ジュリ" = "え？違うんですか？"
"70002020-115-エリカ" = "というかこれ動いてるんだけど？何作ったの？"
"70002020-116-キララ" = "あははっ！くねくねしてるの、ちょっとキモカワい～！"
"70002020-117-キララ" = "ん？手が出てきた、挨拶？"
"70002020-118-エリカ" = "ちょ、ちょっと待って、それ本当に大丈夫なの？"
"70002020-119-キララ" = "え、かわいくない？#nハイタ～ッチ！"
"70002020-120-エリカ" = "通じ合った……！？"
"70002020-121-エリカ" = "ビックリしたけど……。"
"70002020-122-エリカ" = "まあ、こういうところもキララちゃんらしいね。"
"70002020-123-キララ" = "あれ、オムちゃん？"
"70002020-124-エリカ" = "あっ、逃げた。"
"70002020-125-エリカ" = "……オムちゃん、って何？名前？"
"70002020-126-ジュリ" = "ちょ、ちょっと待ってください！オムちゃん！"
"70002020-127-エリカ" = "……あ、名前なんだ。っていうか共通認識なんだ。"
"70002020-128-ジュリ" = "逃げないでください！？"
"70002020-129-ジュリ" = "ま、待って～！"
"70002020-130-エリカ" = "給食部も……色々大変だったね。"
"70002020-131-キララ" = "あはははっ！なんか愉快で面白かったね！"
"70002020-132-キララ" = "オムちゃぁぁん！！"
"70002020-133" = "（給食部の体験入部は主催側の都合により中断された）"
"70002020-134-セナ" = "あなた達が体験入部の希望者でしょうか。"
"70002020-135-エリカ" = "はろはろ～、キララでーす！よろしくお願いしま～す！"
"70002020-136-エリカ" = "私はエリカ、よろしく。"
"70002020-137-セナ" = "救急医学部の部長、[ruby=ひむろ]氷室[/ruby]セナです。"
"70002020-138-エリカ" = "ここも体験入部を受け入れてるなんて、意外だね。"
"70002020-139-エリカ" = "いつも忙しそうっていうか、余裕無さそうだったのに。"
"70002020-140-セナ" = "むしろ逆です。目が回るほど忙しいからこそ、体験入部を受けたのです。"
"70002020-141-キララ" = "え？そうなの？"
"70002020-142-セナ" = "現在、自治区内で不良たちのいざこざが勃発し、多数の死体……#nいえ、負傷者が移送されています。"
"70002020-143-セナ" = "早速ですが皆さんは、戦力として対応していただきますので。"
"70002020-144-エリカ" = "え、良いの？私たち何も知らないけど？"
"70002020-145-キララ" = "絆創膏貼るくらいならできるけどねー？"
"70002020-146-セナ" = "ご心配なく、もちろん専門家でない皆さんに難しいことはさせません。"
"70002020-147-セナ" = "私が注射の準備をしている間、皆さんは負傷者を落ち着かせていただければ。"
"70002020-148-セナ" = "では、準備を！"
"70002020-149-エリカ" = "合点承知～。"
"70002020-150-エリカ" = "まぁ……やってみよっか。"
"70002020-151-チンピラA" = "い……痛っ……。"
"70002020-152-チンピラB" = "ちっ、まだいけるのに、膝が……。"
"70002020-153-チンピラC" = "弱音はそこまでにしときな！#nこのままだとあたしらのエリアが奪われるんだぞ！"
"70002020-154-チンピラC" = "こんな怪我でくたばってる場合かっ！"
"70002020-155-チンピラA" = "おっし！"
"70002020-156-チンピラC" = "早く抜け出すぞ！救急医学部の部長にバレないように、こっそりな！"
"70002020-157-チンピラC" = "はい！姉御！"
"70002020-158-キララ" = "はろはろ～！#n臨時だけど白衣の天使、キララ参上～！"
"70002020-159-チンピラA" = "だ、誰だ！？"
"70002020-160-キララ" = "今日一日、体験入部で入ったの。あなた達が負傷者さん？"
"70002020-161-キララ" = "よろしくね～！"
"70002020-162-チンピラA" = "よ、よろしくもなにも！あたしらは今から戻るんだよ！"
"70002020-163-チンピラA" = "そうだそうだ！こんな所にいつまでも居られるか！"
"70002020-164-エリカ" = "ん？治療したくないの？"
"70002020-165-エリカ" = "その傷とか、放っておいたら結構痛いと思うけど？"
"70002020-166-エリカ" = "んなもん知るか！"
"70002020-167-エリカ" = "あたしらのエリアを守る方が大事なんだよ！"
"70002020-168-キララ" = "そうなの？君たちのエリアって？"
"70002020-169-チンピラA" = "そこの十字路から少し入った屋台裏の路地、あそこだよ。"
"70002020-170-キララ" = "え？クレープ屋さんのとこ？あたし、そこ知ってる！"
"70002020-171-キララ" = "めっちゃおいしいよね！#nあたし常連なんだ！"
"70002020-172-チンピラB" = "え、えっと……そうなの？それは奇遇だね。"
"70002020-173-キララ" = "いつもイチゴとソフトクリーム、チョコチップトッピングが好きなんだけど、そっちは？"
"70002020-174-チンピラA" = "私はやっぱりバナナかな。"
"70002020-175-チンピラB" = "パイナップルとアイスクリームの組み合わせは食べてみた？美味しかったよ！"
"70002020-176-キララ" = "えっ、マジ？でもそれ聞くだけで美味しそう～！"
"70002020-177-チンピラC" = "あたしは果物好きじゃないから、チョコチップクッキーと生クリーム特盛りだな！"
"70002020-178-キララ" = "え～いいな！今度やってみよ♪"
"70002020-179-キララ" = "あ、そうだ！ついでに――"
"70002020-180-チンピラたち" = "あっ！？救急医学部の部長！？"
"70002020-181-チンピラC" = "思わず……おしゃべりに……。"
"70002020-182-セナ" = "麻酔完了。"
"70002020-183-エリカ" = "患者に銃を向けても良いの？"
"70002020-184-セナ" = "治療のために必要な措置です。#n何かを守る時には、やむを得ないこともあります。"
"70002020-185-セナ" = "……お二方には素質がありますね。#nこのトラブルメーカーたちの足をきちんと止められるとは。"
"70002020-186-エリカ" = "まあ、狙ってやったわけじゃないけど……キララちゃんの力っていうか……。"
"70002020-187-キララ" = "クレープ、一緒に食べに行きたかったなー……。"
"70002020-188-エリカ" = "IDでも残しておいたら？#nみんな目を覚ましたら、その後一緒に行けば良いでしょ。"
"70002020-189-キララ" = "あっ、そうだね！部長、良いかな？"
"70002020-190-セナ" = "本来なら、患者との個人的な連絡はよろしくありませんが……。"
"70002020-191-セナ" = "今回は良いでしょう、皆さんが立派に仕事を遂行してくださったお礼に。"
"70002020-192-キララ" = "やったー！ありがとう、部長！部長の分も買ってくるね！"
"70002020-193-セナ" = "いえ、私は結構です。"
"70002020-194-キララ" = "良いから良いから、遠慮しないで～！"
"70002020-195-キララ" = "ぷは～！楽しかった～！"
"70002020-196-キララ" = "こんなにたくさん部活があると思わなかった！"
"70002020-197-エリカ" = "おかげで、私も色んな経験ができたよ。"
"70002020-198-エリカ" = "それで、見つかった？"
"70002020-199-キララ" = "ん？何が？"
"70002020-200-エリカ" = "体験入部の目的、忘れちゃったの？"
"70002020-201-エリカ" = "キララちゃんが入りたい部活を探してたんでしょ？"
"70002020-202-キララ" = "あ、そうだった！うっかりうっかり、あははっ！"
"70002020-203-キララ" = "うーん……どこもめっちゃ楽しかったよね。"
"70002020-204-キララ" = "新しい友達もできて、色んな経験もできて！"
"70002020-205-キララ" = "そうだなぁ……体験入部した中で、一番行きたいところ……。"
"70002020-206-キララ" = "……無いかも！"
"70002020-207-エリカ" = "え？"
"70002020-208-エリカ" = "さっき、めっちゃ楽しかったって言ってなかった？"
"70002020-209-キララ" = "うん！めっちゃ楽しかった！ワクワクしたし！"
"70002020-210-キララ" = "イブキちゃんと遊んだことも、給食部のキッチンに入ったことも、#n患者さんの面倒を見たことも！"
"70002020-211-キララ" = "どれも新鮮で楽しかった！"
"70002020-212-エリカ" = "じゃあどうして？"
"70002020-213-キララ" = "うーん……その中から一つを選ぶってなると、それは……。"
"70002020-214-キララ" = "何か勿体なくない！？"
"70002020-215-エリカ" = "勿体ない……？"
"70002020-216-キララ" = "ほら！部活ってさ！"
"70002020-217-キララ" = "入部したら毎日同じ活動することになるでしょ？"
"70002020-218-キララ" = "それはそれで良いけど、あたしの性に合わないっていうか……。"
"70002020-219-キララ" = "何か、もったいないなーって。"
"70002020-220-エリカ" = "……そっか。キララちゃんは毎日新しいことをしたいってこと？"
"70002020-221-キララ" = "そうそう、さっすがエリカちゃん！あたしの気持ちを一番良く分かってる～！"
"70002020-222-キララ" = "だってその方があたし的に、キラキラしてワクワクする最高の毎日になりそうだし？"
"70002020-223-キララ" = "それってすっごく青春じゃん！"
"70002020-224-キララ" = "例えば、新しい友達を作ったり――"
"70002020-225-キララ" = "トラックを追いかけて走ったり――"
"70002020-226-キララ" = "道に迷った友達を助けたり――"
