[translation]
"70015020-1" = "イブキ家出事件（２）"
"70015020-2-アコ" = "……。"
"70015020-3-ヒナ" = "つまり……。"
"70015020-4-ヒナ" = "そちらのタヌキがイブキちゃんのプリンを食べたせいで……。"
"70015020-5-イロハ" = "はい……。"
"70015020-6-アコ" = "イブキちゃんは出ていってしまい……。"
"70015020-7-アコ" = "挙句所在がつかめなくなり、私たちに助けを求めにきた……ということですね？"
"70015020-8-イロハ" = "情けないお話ですが、その通りです……。"
"70015020-9-イオリ" = "どうしてそうなったんだ……。"
"70015020-10-アコ" = "あれだけ風紀委員会を目の敵にしておいて、こんな時だけ助けて欲しいって……。#nいくらなんでも、都合が良すぎるとは思わないんですか？"
"70015020-11-アコ" = "弁解の余地もありません……。"
"70015020-12-ヒナ" = "……分かった。私たちも手伝うわ。"
"70015020-13-ヒナ" = "イブキはまだ小さい……道に迷っているのなら、きっと不安になってるわ。"
"70015020-14-アコ" = "風紀委員長……。"
"70015020-15-アコ" = "……委員長のおっしゃる通りです。イブキちゃんのために、今回は協力しましょう。"
"70015020-16-イオリ" = "これからパトロールだから、私も探してみるよ。"
"70015020-17-アコ" = "ありがとうございます……。"
"70015020-18-アコ" = "一応確認ですが……。#nこれ、風紀委員会を牛耳るための手の込んだ作戦とかじゃないですよね？"
"70015020-19-イロハ" = "そんなことを考える余裕はないかと……。"
"70015020-20-マコト" = "イブキィー！私が悪かった！！帰ってきてくれー！！！"
"70015020-21-アコ" = "……。"
"70015020-22-アコ" = "はあ……。"
"70015020-23-アコ" = "かれこれ数時間は探していますが……。#nイブキちゃん本人はおろか、手がかりすら見つかりませんね……。"
"70015020-24-アコ" = "一体どこに行ってしまったんでしょうか……。"
"70015020-25-アコ" = "あれは……。"
"70015020-26-イブキ" = "わ～！すごい、すごい！たか～い！"
"70015020-27-ハルカ" = "ハルカおねえちゃん、シーソー上手だね！"
"70015020-28-イブキ" = "えへへ……楽しんでくれて何よりです……。"
"70015020-29-イブキ" = "次は、ブランコに乗ってみましょうか？"
"70015020-30-ハルカ" = "うん！イブキ、ブランコ大好き！"
"70015020-31-アル" = "くふふっ。イブキちゃんとハルカちゃん、すっかり仲良しだね～"
"70015020-32-アル" = "うん。ハルカは面倒見いいからね。"
"70015020-33-ムツキ" = "……。"
"70015020-34-カヨコ" = "どうかした～？アルちゃん。"
"70015020-35-カヨコ" = "いえ……このままでいいのかなと思って……。"
"70015020-36-アル" = "たしかに、イブキちゃんは万魔殿の子だもんね。#nあいつらが乗り込んできたらどうしようって、ビビっちゃってるんだ？"
"70015020-37-アル" = "べ、別にビビってなんかいないわよ！"
"70015020-38-アル" = "私たちは不認可の部活だし、もし会ったらバツが悪いと思ったの！"
"70015020-39-アル" = "ただそれだけ！"
"70015020-40-アル" = "……実際、今頃向こうもイブキのこと探してるだろうね。"
"70015020-41-アル" = "私たちはイブキちゃんを保護してるようなものじゃん！心配し過ぎだって。"
"70015020-42-アル" = "そ、そうよね？"
"70015020-43-ムツキ" = "お菓子もいっぱいあげてるし、むしろ感謝されてもいいくらいじゃない？"
"70015020-44-アル" = "え、ええ！そうよ！"
"70015020-45-カヨコ" = "大丈夫。私たちがイブキを誘拐したとは思われないよ……多分。"
"70015020-46-アル" = "……！！"
"70015020-47-アル" = "ゆ、ゆゆ、誘拐って！そんな物騒なこと……！"
"70015020-48-アル" = "でも私たちはハードボイルドでアウトローな便利屋68……。#nそう判断されたとしても不思議じゃないわ……！！"
"70015020-49-カヨコ" = "いや、落ち着いて社長。仮にそうなっても、イブキがちゃんと説明してくれるよ。"
"70015020-50-アル" = "え、ええ……そうね。"
"70015020-51-アル" = "ふぅ……。もちろん、そんなことは分かっているわ。"
"70015020-52-ムツキ" = "くふふっ。やっぱアルちゃんって面白ーい。"
"70015020-53-アル" = "問題は、イブキをいつ帰すかだけど……。"
"70015020-54-カヨコ" = "向こうが先にこっちを見つけるってパターンも……。"
"70015020-55-カヨコ" = "……。"
"70015020-56-アコ" = "……あ。"
"70015020-57-アコ" = "……どういう状況か、説明してくれますか？"
"70015020-58-イブキ" = "――ってことがあったんだよ！"
"70015020-59-アコ" = "……なるほど。イブキちゃんは……。#nこの人たちに遊んでもらって、お菓子も買ってもらったと。つまりこれは――"
"70015020-60-アコ" = "誘拐です！"
"70015020-61-アル" = "やっぱり！？"
"70015020-62-イブキ" = "ううん、違うよ。イブキが勝手に出ていったの。"
"70015020-63-イブキ" = "このおねえちゃんたちは、イブキと遊んでくれてただけ。とってもいい人たちだよ！"
"70015020-64-アコ" = "……それなら良いんですが……。"
"70015020-65-アコ" = "い、イブキ。迎えが来たので、もう帰らないとですね……。"
"70015020-66-アコ" = "一緒に遊べて楽しかったです。向こうでも元気でいてください……。"
"70015020-67-ハルカ" = "……そうですね。帰りましょう、イブキちゃん。今万魔殿は――"
"70015020-68-イブキ" = "やだ！まだ帰りたくない！"
"70015020-69-ハルカ" = "ど、どうしてですか？まだ怒ってます？"
"70015020-70-イブキ" = "……ううん。もうおこってないけど……。"
"70015020-71-イブキ" = "まだ帰りたくないんだもん。"
"70015020-72-イブキ" = "イブキ、おねえちゃんたちともっといたい！"
"70015020-73-ハルカ" = "えへへ……そ、そうですか。私も、イブキともっと一緒にいたいです。"
"70015020-74-イブキ" = "うん！そうする！！"
"70015020-75-アル" = "あ、アル様……。"
"70015020-76-ハルカ" = "うーん……。"
"70015020-77-アコ" = "はあ……。"
"70015020-78-アル" = "それなら……私たちの事務所に、来る？"
