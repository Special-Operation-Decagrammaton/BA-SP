[translation]
"70015030-1" = "イブキ家出事件（３）"
"70015030-2-アル" = "い、いらっしゃい。ここが私たちの事務所よ……。今お茶を出すわね。"
"70015030-3-アル" = "はい。結構なお点前よね。"
"70015030-4-アル" = "それ、後半はもらった側のセリフだから。"
"70015030-5-イブキ" = "わ～！カッコいい！！"
"70015030-6-イブキ" = "ふふ、気に入りましたか……イブキ……。"
"70015030-7-イブキ" = "うん！大人がお仕事する場所って感じ！"
"70015030-8-アル" = "え、ええ！そうでしょう！"
"70015030-9-アル" = "（今月は家賃を払えててよかったわ……下手したらテントを見せる羽目に……）"
"70015030-10-アコ" = "……外では何度かお会いしましたが、ここに来るのは初めてですね。"
"70015030-11-カヨコ" = "そうだね。#n……本音を言えば、アコがここに来るような機会は来ないで欲しかったけど。"
"70015030-12-アコ" = "ええ、そうですね。その逆も然り、です。"
"70015030-13-カヨコ" = "ふっ。"
"70015030-14-カヨコ" = "でも、そんな機会が来ちゃったからね……ゆっくりしていってよ。"
"70015030-15-アコ" = "……。"
"70015030-16-アコ" = "ここが、あなたが見つけた居場所なんですね。"
"70015030-17-カヨコ" = "……うん。"
"70015030-18-カヨコ" = "……どう？"
"70015030-19-アコ" = "……手狭ですし、ごちゃごちゃしていて気が散りますが……。"
"70015030-20-アコ" = "まあ、悪くないですね。"
"70015030-21-カヨコ" = "……そう。"
"70015030-22-イブキ" = "おねえちゃん！イブキ、これ読んでみる！"
"70015030-23-アル" = "え、ええ。難しいけど、読めるかしら？"
"70015030-24-イブキ" = "うん！い、いちにち……一日一悪、だよね？"
"70015030-25-イブキ" = "せ、正解よ……。"
"70015030-26-イブキ" = "どういう意味なの？"
"70015030-27-アル" = "そ、それは……！"
"70015030-28-ムツキ" = "アルちゃん、まさか子どもに教えちゃうのー？"
"70015030-29-イブキ" = "うっ……！"
"70015030-30-アル" = "うん？イブキ、まだ子どもだけど色んなの知ってるよ！"
"70015030-31-ムツキ" = "くふふっ、そう？じゃあ、アルちゃ……うちの社長が教えても大丈夫だね。"
"70015030-32-アル" = "うん！教えて、アルおねえちゃん！"
"70015030-33-アル" = "え、えーっと……これはね……。"
"70015030-34-アル" = "……一日一つ、悪いことをする……という意味よ……。"
"70015030-35-イブキ" = "……。"
"70015030-36-イブキ" = "我が便利屋の座右の銘よ！#n何も恐れず、何にも縛られないハードボイルドなアウトローなの……！"
"70015030-37-アル" = "（い、言っちゃった！怖がらせちゃったらどうしよう……！？）"
"70015030-38-イブキ" = "うん？"
"70015030-39-アル" = "だ、だから、私たちは悪党なの！すごく怖い人なのよ！"
"70015030-40-イブキ" = "おねえちゃんたちは、悪党じゃないよ？"
"70015030-41-イブキ" = "みんな、すっごく優しいもん！"
"70015030-42-イブキ" = "一人で寂しかったイブキと一緒に遊んでくれて……。"
"70015030-43-アル" = "えっと、それは……。"
"70015030-44-イブキ" = "お菓子もいっぱい買ってくれて、シーソーとブランコにも乗せてくれたよ。"
"70015030-45-イブキ" = "おててだって、つないでくれたよね？"
"70015030-46-アル" = "……。"
"70015030-47-イブキ" = "うん！やっぱりおねえちゃんたちは悪党じゃない！"
"70015030-48-ムツキ" = "くふふっ。だってさ、アルちゃん？"
"70015030-49-アル" = "ぐぬぬ……。"
"70015030-50-アル" = "……たしかに、昔よりはマシになりましたね。"
"70015030-51-アル" = "……！"
"70015030-52-アコ" = "トラブルメーカーで、私たちと衝突することはありますが……。"
"70015030-53-アコ" = "一線は、越えない人たちだと思っています。"
"70015030-54-アル" = "そ、そう言われると複雑だけど……。"
"70015030-55-アル" = "あれ？それってつまり、もう私たちを捕まえないってこと？"
"70015030-56-アル" = "まさか。一線を越えたら即刻逮捕です。"
"70015030-57-ムツキ" = "ちぇ～。"
"70015030-58-イブキ" = "あっ！これ、イブキ上手だよ！ハルカおねえちゃん、一緒にしよう？"
"70015030-59-イブキ" = "バランスゲームですか？……いいですよ、えへへっ。"
"70015030-60-アル" = "ふぅ……。えーっと……あなたもお客様なのだから、ゆっくりしていってちょうだい。"
"70015030-61-アル" = "何か飲むかしら？"
"70015030-62-アコ" = "ありがとうございます。では、コーヒーで。"
"70015030-63-アル" = "砂糖とミルクは？"
"70015030-64-アコ" = "？いえ、そのままブラックでお願いします。"
"70015030-65-アル" = "え？ええ、分かったわ……。"
"70015030-66-アル" = "砂糖もミルクもなし……！？#nあんな苦いのをそのままなんて……か、カッコいいじゃない……！"
"70015030-67" = "（時間が経ち……）"
"70015030-68-イブキ" = "やったー！今回はイブキの勝ち～！！"
"70015030-69-イブキ" = "す、すごいです、イブキ。他のルールでもやってみますか？"
"70015030-70-イブキ" = "やるー！"
"70015030-71-アコ" = "……なんだか、癒されますね。"
"70015030-72-アコ" = "と、ところで、イブキはずっとここにいていいのかしら？#n万魔殿が探してると思うんだけど……？"
"70015030-73-アコ" = "それなら、そろそろ着くころでしょう。"
"70015030-74-アル" = "な？なにが？"
"70015030-75-アコ" = "先ほどイブキちゃんの居場所を教えたので、もう間もなくかと……。"
"70015030-76-アル" = "だ、誰に！？"
"70015030-77-アコ" = "もちろん、万魔殿にです。"
"70015030-78-アル" = "な、なんですってえ！？"
"70015030-79-ムツキ" = "これはちょーっとマズいんじゃない？"
"70015030-80-アル" = "わ、私たちの住所を勝手に晒してどういうつもり！？#nしかも、よりによって万魔殿に……！"
"70015030-81-アコ" = "晒すって……ここのことなんて、とっくに知ってますよ？"
"70015030-82-アコ" = "え？"
"70015030-83-アコ" = "風紀委員会も、万魔殿も……それくらいは当然把握しています。"
"70015030-84-アコ" = "あなた達だって、秘密裏に活動しているわけでもないでしょうに。"
"70015030-85-アコ" = "あ。"
"70015030-86-アル" = "そういえば、そうね……？"
"70015030-87-カヨコ" = "部活としては不認可だけど、事業者登録はしてるからね。"
"70015030-88-アル" = "い、いや！それとこれは別でしょ！というか、万魔殿がここに来るってことは……！"
"70015030-89-？？？" = "イブキィー！！"
"70015030-90-マコト" = "イブキィー！！！"
"70015030-91-イブキ" = "ま、マコト先輩！"
"70015030-92-マコト" = "イブキ！私が悪かった！この通りだ！！許してくれぇ！！！"
"70015030-93-투명" = "マコト先輩……だ、大丈夫……？"
"70015030-94-투명" = "わー、すっごい顔。"
"70015030-95-アル" = "マコト議長……！"
"70015030-96-アル" = "あ、アル様！ど、どうしましょう……！？や、やっぱり殺しますか？"
"70015030-97-アル" = "お、落ち着きなさい、ハルカ！"
"70015030-98-サツキ" = "お邪魔するわね。"
"70015030-99-チアキ" = "初めまして、便利屋68の皆さん！イブキちゃんがここにいると聞いて参りました！"
"70015030-100-イロハ" = "……失礼します。"
"70015030-101-アル" = "万魔殿の、役員が全員……。"
"70015030-102-ハルカ" = "あ、アル様～！！"
"70015030-103-ムツキ" = "アルちゃん！深呼吸、深呼吸！！"
"70015030-104-マコト" = "い、イブキ……本当に悪かった……もう二度としない……。"
"70015030-105-マコト" = "……本当？"
"70015030-106-マコト" = "ああ！本当だ！"
"70015030-107-イブキ" = "じゃあ、イブキのプリンだけじゃなくて……。#nみんなのプリンも勝手に食べないって約束して。"
"70015030-108-マコト" = "ぐっ！そ、それは……。"
"70015030-109-マコト" = "……分かった。約束しよう。"
"70015030-110-イブキ" = "はい、ゆびきりげんまん～"
"70015030-111-マコト" = "……フッ。嘘ついたら針千本だな。"
"70015030-112-イブキ" = "うん！えへへ。"
"70015030-113-イブキ" = "マコト先輩のこと、許すね。"
"70015030-114-マコト" = "ほ、本当か……！ああ、まるで海のように広大な心だ……！"
"70015030-115-マコト" = "では、万魔殿へ帰ろう。謝罪の気持ちとしてプリンも10個買っておいたからな。"
"70015030-116-イブキ" = "わ～！あ、でも……おねえちゃんたちにご挨拶しないと。"
"70015030-117-マコト" = "お、おねえちゃんたち、だと……？"
"70015030-118-イブキ" = "うん！イブキと遊んでくれて、お菓子も買ってくれたの！"
"70015030-119-マコト" = "フッ、便利屋68か……。"
"70015030-120-アル" = "わ、私たちを知っているの？"
"70015030-121-アル" = "キシシッ……当然だろう。[ruby=りくはちま]陸八魔[/ruby]アル。#nお前たちは要注意人物だからな。"
"70015030-122-アル" = "名前まで……！"
"70015030-123-マコト" = "だが……。"
"70015030-124-マコト" = "この[ruby=はぬま]羽沼[/ruby]マコト様は、お前たちに指図するつもりはない。"
"70015030-125-アル" = "えっ……。"
"70015030-126-マコト" = "お前たちが行っているものも、自由の一つ。"
"70015030-127-アル" = "学籍がどうなっていようが、生徒が己の夢を叶えることは奨励すべきだ。"
"70015030-128-アル" = "……！！"
"70015030-129-ムツキ" = "アルちゃん、これって……？"
"70015030-130-マコト" = "その上独自のビジネス手腕を持っているとくれば、もうこれ以上言うことはない。"
"70015030-131-マコト" = "この寛大なマコト様は、多少の違法行為は見逃すということだ。キシシッ。"
"70015030-132-マコト" = "我々万魔殿は、あの頑固な風紀委員会とは違うからな！"
"70015030-133-アコ" = "はあ？せっかく助けてあげたのに、どこまで恩知らずなんですか！"
"70015030-134-アコ" = "マコト先輩！アコ先輩がイブキを探しにここまで来てくれたんだよ～！"
"70015030-135-マコト" = "……そういえば、イブキの居場所を教えてくれたのは#n[ruby=あまう]天雨[/ruby]アコ行政官だったか……。"
"70015030-136-マコト" = "……。"
"70015030-137-アコ" = "……。"
"70015030-138-マコト" = "今のは忘れろ！"
"70015030-139-アコ" = "忘れるわけないでしょう！？"
"70015030-140-イロハ" = "このたびは……本当にありがとうございました。"
"70015030-141-アル" = "い、いえ……当然のことをしたまでよ。"
"70015030-142-サツキ" = "謙遜しなくてもいいのに。#nイブキちゃんは私たちの大切な後輩なんだから、感謝されて当然よ。"
"70015030-143-ムツキ" = "くふふっ、それなら遠慮なく感謝されるね～！"
"70015030-144-サツキ" = "この机……少し古そうね。万魔殿で使っているものでよかったらあげましょうか？"
"70015030-145-アル" = "え、ええ？本当？"
"70015030-146-サツキ" = "原木を使った机なんだけど、趣味じゃないなら言ってね。"
"70015030-147-アル" = "（ここですぐ受け取ってしまうのはカッコ悪いわね……まずは一回断って……）"
"70015030-148-アル" = "うーん、どうかしら。この事務所はインテリアにこだわっているから――"
"70015030-149-サツキ" = "やっぱりそうよね。失礼したわ。"
"70015030-150-アル" = "あ、あれ？"
"70015030-151-マコト" = "……。"
"70015030-152-カヨコ" = "……。"
"70015030-153-マコト" = "久しぶりだな……[ruby=おにかた]鬼方[/ruby]カヨコ。"
"70015030-154-カヨコ" = "……元気そうで何より。"
"70015030-155-マコト" = "当然だ。ゲヘナのトップとして、重大な責任と使命を背負っているからな。キシシッ。"
"70015030-156-カヨコ" = "相変わらずみたいだね。"
"70015030-157-マコト" = "ふん。今日はイブキの件で、期せずしてここに来たわけだが……。"
"70015030-158-マコト" = "こうして直接会ったからには、一つ聞きたいことがある。"
"70015030-159-カヨコ" = "……。"
"70015030-160-カヨコ" = "何故万魔殿に来なかった？本来なら、お前も所属すべきだっただろう。"
"70015030-161-カヨコ" = "……前の生徒会とは全然違うらしいね。"
"70015030-162-マコト" = "無論だ。このマコト様がいる限り、昔のようになることはありえない。"
"70015030-163-カヨコ" = "……それならいい。"
"70015030-164-カヨコ" = "もう部外者なんだから、私の考えなんてどうでもいいでしょ。"
"70015030-165-カヨコ" = "万魔殿の議長はあんたで、ゲヘナはあんたが作っていくんだから。"
"70015030-166-マコト" = "キキッ、そうか……そうだな。"
"70015030-167-マコト" = "それに、私の居場所はここだから。"
"70015030-168-カヨコ" = "ハードボイルドを目指すけど生まれつきお人よしな社長、いたずら好きでも#nやる時はやる室長、そしてたまに心配になるけど繊細で純粋な社員……。"
"70015030-169-カヨコ" = "そんなみんながいる……この便利屋68こそが、私の居場所だよ。"
"70015030-170-マコト" = "……ふむ。"
"70015030-171-マコト" = "ならいい、キシシッ。"
"70015030-172-カヨコ" = "うん。"
"70015030-173-チアキ" = "あ、そうだ。皆さん、イブキちゃんと一緒に写真撮りませんか？"
"70015030-174-ハルカ" = "ええ！？しゃ、写真……ですか？"
"70015030-175-チアキ" = "はい！これも何かの縁ですし！イブキちゃんはどうです？"
"70015030-176-チアキ" = "うん！イブキもおねえちゃんたちと写真撮りたい～！！"
"70015030-177-ムツキ" = "くふふっ、面白そ～！ほら、カヨコちゃんも早く～！"
"70015030-178-カヨコ" = "……うん。"
"70015030-179-チアキ" = "では！こちらに立ってください！"
"70015030-180-アル" = "こ、ここでいいの？"
"70015030-181-チアキ" = "じゃあ撮りますよ～！"
"70015030-182-チアキ" = "はい！チーズ！"
"70015030-183-マコト" = "……今回は世話になったな、便利屋68。"
"70015030-184-マコト" = "キキッ、引き続きこのマコト様が見ていることを忘れるなよ！"
"70015030-185-アル" = "うっ……。"
"70015030-186-マコト" = "さあ、行くぞ！"
"70015030-187-サツキ" = "お邪魔したわね。"
"70015030-188-チアキ" = "写真、あとで送りますね～！"
"70015030-189-イブキ" = "おねえちゃんたち、ありがとう！絶対にまた遊ぼうね！"
"70015030-190-ムツキ" = "わ、私も楽しかったです……また会いましょう、イブキ！"
"70015030-191-ムツキ" = "まったね～！くふふっ。"
"70015030-192-カヨコ" = "……。"
"70015030-193-カヨコ" = "……何か言いたそうだね。"
"70015030-194-アコ" = "ええ……。"
"70015030-195-アコ" = "これだけは伝えておいたほうがいいと思いまして。"
"70015030-196-カヨコ" = "……まさか。"
"70015030-197-アコ" = "……「嵐」の動きが確認されました。"
"70015030-198-アコ" = "……！！"
"70015030-199-アコ" = "あなたは今、この手の情報収集に不利な立場にいますから。"
"70015030-200-カヨコ" = "……うん、ありがとう。"
"70015030-201-アコ" = "……気をつけてください。もう昔のようなことはしたくありません。"
"70015030-202-カヨコ" = "私もだよ。……アコも気を付けて。"
"70015030-203-アコ" = "ふっ、お互い様ですね。"
"70015030-204-アコ" = "では、また。"
"70015030-205-カヨコ" = "…………。"
"70015030-206-アル" = "うっ……げほっ、げほっ！や、やっぱり苦い！！"
"70015030-207-ハルカ" = "どしたの、アルちゃん？急にブラックコーヒーなんか飲んで。"
"70015030-208-ハルカ" = "あ、アル様……！大丈夫ですか！？#nこのコーヒーが原因ですね！撃ちましょうか！？"
"70015030-209-カヨコ" = "……。"
"70015030-210-カヨコ" = "ふふっ。"
"70015030-211-カヨコ" = "社長、牛乳でも飲んで落ち着いて。"
"70015030-212-アル" = "うぅ……！"
"70015030-213" = "イブキ家出事件"
