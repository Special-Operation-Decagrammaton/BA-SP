[translation]
"70000020-1" = "怪しい交流会（２）"
"70000020-2" = "（――そうして、レッドウィンター事務局と万魔殿の交流会が始まった）"
"70000020-3-マコト" = "キキキッ！見たか、会長？#n今回、我が万魔殿に対して再び行われた信任投票率は、過去最低の記録を更新したのだ！"
"70000020-4-イロハ" = "（マコト先輩……失った勢いを取り戻そうと、さっきから必死ですね)"
"70000020-5-マコト" = "よく分からないって顔をしているな？#n特別に教えてやろう。"
"70000020-6-マコト" = "どうせほとんどの生徒は政治なんて分からない！#nつまり、生徒が政治をああだこうだ考えるよりも、関心など持っていないほうが支配しやすい！"
"70000020-7-マコト" = "この3.8%の投票率こそ、我々の権力が揺るぎないことを証明しているのだ！"
"70000020-8-チェリノ" = "実にくだらないな、議長。#nそんな見通しの甘い拙策では、すぐに足元を掬われてしまうぞ？"
"70000020-9-チェリノ" = "トモエ、今回のレッドウィンター総選挙の投票率を言うがよい。"
"70000020-10-トモエ" = "300%です、会長。"
"70000020-11-マコト" = "な、なんだと！？"
"70000020-12-チェリノ" = "議長も分かっただろう？#n数字というものは大きければ大きいほど良い！"
"70000020-13-チェリノ" = "我がレッドウィンター連邦学園に対抗するというのなら、これくらいの支持を集めることだな！"
"70000020-14-マコト" = "な、なんてことだあああ！#nまさか支持率でも負けるとは……。"
"70000020-15-イロハ" = "………………。"
"70000020-16-マコト" = "くっ、見下されているのか……！？#n万魔殿の議長ともあろう、このマコト様が……！！ "
"70000020-17-イロハ" = "……計画も失敗したみたいですし、ここに残る理由もないのでは？#nほら、帰りましょう先輩。"
"70000020-18-マコト" = "ま、まだだ！#nレッドウィンターなんぞにやられたまま帰るなど、そんな屈辱は決して……。"
"70000020-19-マコト" = "……ん？"
"70000020-20-マコト" = "こ、これはいったい……。"
"70000020-21-チェリノ" = "うむ。気付いたか、議長。"
"70000020-22-マコト" = "しょ、書記長……？"
"70000020-23-チェリノ" = "それはおいらの権威を象徴する肖像画だ。"
"70000020-24-チェリノ" = "あまりにも立派な姿に見惚れてしまったのだな。#n見ていると思わず敬意を表したくなるだろう？"
"70000020-25-マコト" = "いや、全然……。"
"70000020-26-マコト" = "（しかし、これを本人と言い張っていいものなのか？）"
"70000020-27-マコト" = "（そもそも性別が違うじゃないか……）"
"70000020-28-チェリノ" = "芸術を見る目がないようだな。"
"70000020-29-チェリノ" = "絵画などプロパガンダの基本ではないか。#nこれが万魔殿の議長とは……。"
"70000020-30-チェリノ" = "ははは、ゲヘナの未来は暗いな！"
"70000020-31-マコト" = "なんだと？"
"70000020-32-イロハ" = "先輩……ここで暴れてしまっては、全て水の泡です。"
"70000020-33-イロハ" = "まずは落ち着いてください。#n先輩の心の狭さがバレてしまいます。"
"70000020-34-チェリノ" = "うむ。ちょっとした冗談をいちいち気にしないことだな、議長よ。"
"70000020-35-チェリノ" = "それに心が狭かろうとも、おいらのように偉大な会長は気にしないのだ！"
"70000020-36-チェリノ" = "せっかくだから、ゲヘナとレッドウィンターの友好を記念して記念品を作るとしよう。"
"70000020-37-チェリノ" = "そうだな……議長の信念や座右の銘を聞いても？"
"70000020-38-マコト" = "信念……座右の銘……？"
"70000020-39-イロハ" = "マコト先輩、たしか前に言ってませんでした？"
"70000020-40-イロハ" = "冷蔵庫のプリンを勝手に食べた時の……。"
"70000020-41-マコト" = "あぁ？プリン？"
"70000020-42-マコト" = "キキキキキッ。#nああ、私が食べたとも。"
"70000020-43-マコト" = "それがどうしたというのだ？#nこの私が謝罪するとでも思ったか？"
"70000020-44-イロハ" = "別に謝ってほしいわけでは……。"
"70000020-45-イロハ" = "マコト先輩のことだから、開き直られたところで何も思いませんよ。"
"70000020-46-マコト" = "キキキキキッ。よく聞け、イロハ。マコト様の辞書には後悔も反省もない。"
"70000020-47-マコト" = "万魔殿の議長ともなれば、そんなものなくて当然だろう？"
"70000020-48-マコト" = "この[ruby=はぬま]羽沼[/ruby]マコト――"
"70000020-49-マコト" = "我が生涯に一片の悔いなし！"
"70000020-50-イロハ" = "あ、はい……。"
"70000020-51-チェリノ" = "……うむ、流石は万魔殿の議長だな。"
"70000020-52-チェリノ" = "人のプリンを勝手に食べるだなんて……。#n恐れ知らずではないか。素晴らしいな、マコト議長。"
"70000020-53-チェリノ" = "よし、気に入った！"
"70000020-54-チェリノ" = "トモエ、レッドウィンターで一番の職人を呼んでこい！"
"70000020-55-トモエ" = "はい、書記長。"
"70000020-56-チェリノ" = "その勇ましい姿に相応しい品を授けるのだ！"
"70000020-57-イロハ" = "（どうしてこんな話に……）"
"70000020-58" = "（数日後、ゲヘナ校門前）"
"70000020-59-ヒナ" = "……アコ、これは？"
"70000020-60-アコ" = "万魔殿がレッドウィンターから送られた彫像らしいですが……。"
"70000020-61-アコ" = "これ、マコト議長……ですよね？"
"70000020-62-ヒナ" = "………………。"
"70000020-63" = "（拳を空に突き上げた彫像は、デストロイヤーの銃声が響き渡ると跡形もなく消えた) "
"70000020-64" = "万魔殿のレッドウィンター 巡回録"
"70000020-65-イブキ" = "じゃーん！イブキだよ！"
"70000020-66-イブキ" = "おっはよー！#nふふん、プリンプリ～ン♪"
"70000020-67-マコト" = "……はっ！"
"70000020-68-イロハ" = "い、イブキ……それがですね……。"
"70000020-69-マコト" = "ま、待ってくれ、イブキ……！"
"70000020-70-イブキ" = "あれ……？#nイブキのプリン……どこ……？"
"70000020-71-イブキ" = "イブキ……プリン、食べられないの？イブキが悪い子だから？"
"70000020-72-イロハ" = "そんなことありませんよ。#n悪いのは全部……。"
"70000020-73-マコト" = "い、イブキィー！私が悪かったあああ！#nイブキのプリンとは知らず、私が……私があああー！！！"
"70000020-74-マコト" = "ごめんなイブキィーーー！！！この通りだ、許してくれえええ！！！"
"70000020-75-イロハ" = "はぁ……。"
