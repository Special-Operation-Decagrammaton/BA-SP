[translation]
"70014040-1" = "薬屋の彷徨い（４）"
"70014040-2-老人" = "保護費……？普段から何もしとらんだろうが。"
"70014040-3-ブラックマーケットギャングC" = "何も起きないようにするのがパトロールだからな。#n強盗に入られても知らねぇぞ？"
"70014040-4-老人" = "ならそうすればよかろう。#n強盗に取られるか、あんたらに取られるか。違いはそれだけよ。"
"70014040-5-ブラックマーケットギャングC" = "ったく、話が通じねぇなぁ。#nあれか？カイとかいうのを置いてるから強気になってんのか？"
"70014040-6-老人" = "あの子は関係ない！"
"70014040-7-ブラックマーケットギャングC" = "良い機会だから教えてやるよ。あの[ruby=しんたに]申谷[/ruby]カイってのはな――"
"70014040-8-ブラックマーケットギャングC" = "手の付けられない問題児で、七囚人って呼ばれるほどの極悪人なんだよ！"
"70014040-9-ブラックマーケットギャングC" = "山海経とかいう学園を引っ掻き回してたらしいぜ？"
"70014040-10-ブラックマーケットギャングC" = "しかもブラックマーケットの住人もわんさか雇っていたらしいし？"
"70014040-11-ブラックマーケットギャングC" = "あいつは、お前が思ってる以上にヤベェんだ！"
"70014040-12-老人" = "……！"
"70014040-13-ブラックマーケットギャングC" = "ああ、そうそう。"
"70014040-14-ブラックマーケットギャングC" = "あいつ、やろうと思えば婆さんの病気だって治せるらしいな！"
"70014040-15-老人" = "……。"
"70014040-16-ブラックマーケットギャングC" = "ほう……物知りだな。"
"70014040-17-ブラックマーケットギャングC" = "腕だけは良いみたいなんだよな。"
"70014040-18-ブラックマーケットギャングC" = "じゃあ、なんで婆さんをほったらかしてるんだろうな？"
"70014040-19-ブラックマーケットギャングC" = "それはな……婆さんの家を乗っ取るためさ！"
"70014040-20-ブラックマーケットギャングC" = "ここじゃ隠し事なんてできやしねぇ。"
"70014040-21-ブラックマーケットギャングC" = "いずれ知れ渡るのがブラックマーケットなんだよ！"
"70014040-22-ブラックマーケットギャングC" = "あと……カイには借りがあってな。"
"70014040-23-ブラックマーケットギャングC" = "わりぃが、婆さんが代わりになってくれよな！"
"70014040-24-老人" = "……！！！"
"70014040-25" = "[ns] \"止めないと！\""
"70014040-26-カイ" = "……。"
"70014040-27" = "[s] \"カイ……？\""
"70014040-28-老人" = "……ふんっ、若造が。"
"70014040-29-老人" = "そんなこと、とうに知っておったわい。"
"70014040-30-ブラックマーケットギャングC" = "なっ、なにぃ！？！？"
"70014040-31-カイ" = "……？"
"70014040-32-老人" = "……伊達に長い間、ここに住んどらん。"
"70014040-33-老人" = "騙し騙される連中をどれほど見てきたか。あんたらには分かるまいよ。"
"70014040-34-老人" = "言われんでも、最初から気づいておったわ。"
"70014040-35-ブラックマーケットギャングC" = "じ、じゃあ、どうして……？"
"70014040-36-老人" = "家を譲ろうとしたことか？"
"70014040-37-老人" = "それでもう十分なんだよ。"
"70014040-38-老人" = "カイがどんな子であろうと、外で何をしていようと、ワシには関係ない。"
"70014040-39-老人" = "あの子は確かにここに居た。短い間でもワシの家で暮らしていた。#nそれで良い。これ以上、何を求める。"
"70014040-40-老人" = "独りより、2人のほうが良い。そして……空よりは、独りのほうが良い。#n家も、そう思っているに違いない。"
"70014040-41-老人" = "だから――掃除の邪魔をするでない！"
"70014040-42-老人" = "あの子に、この家を引き継がせねばならんのじゃ！"
"70014040-43-ブラックマーケットギャングC" = "だっ、だからってなぁ！あたしらにゃそんな事情関係ねぇ！"
"70014040-44-ブラックマーケットギャングC" = "講釈垂れんのもここまでだ！"
"70014040-45-ブラックマーケットギャングC" = "事を荒立てたのは婆さんだからな！"
"70014040-46-ブラックマーケットギャングC" = "お前ら！出てこい！"
"70014040-47-カイ" = "……腹立たしい。"
"70014040-48" = "[s] \"カイ……？\""
"70014040-49-カイ" = "気に入らないねぇ。ああ、実に気に入らない。"
"70014040-50-カイ" = "……。"
"70014040-51-カイ" = "家を引き継がせるだなんだと言う老人も。"
"70014040-52-カイ" = "阿保らしく騒ぐ連中も。何もかも。"
"70014040-53-カイ" = "先生、邪魔立てはしてくれるな。これは警告だ。"
"70014040-54-カイ" = "……心配せずとも、殺しはしない。"
"70014040-55-カイ" = "殺し[ruby=・]は[/ruby]しないさ。"
"70014040-56-？？？" = "お、お前は！？#nカイだ！申谷カイが――！！"
"70014040-57-？？？" = "い、息がっ――！#n苦、しい……！"
"70014040-58-？？？" = "ふっ、はぁっ！？ぜ、全身が、かゆい――！うあああああ――っ！！！"
"70014040-59-？？？" = "や、やめろ……これ以上は……堪えられ――！！"
"70014040-60-？？？" = "幻覚……？#nく、来るな！近づくな――っ！！！"
"70014040-61-？？？" = "雨だ……！ああ！雨だ……！"
"70014040-62-？？？" = "か、身体が溶けるような……！足が……！腕が……！髪が……！！！"
"70014040-63-？？？" = "ぐあああああああああああああああっ！！！！！"
"70014040-64" = "[ns] \"カイ。今のは……？\""
"70014040-65-カイ" = "見ての通りさ。"
"70014040-66-カイ" = "……。"
"70014040-67-カイ" = "全員無事だろう？#n……見た目は。"
"70014040-68" = "[s] \"それは、そうだけど……！\""
"70014040-69-カイ" = "心配するな。"
"70014040-70-カイ" = "私は取り返しのつかないことはしない。#n……よほどのことがない限り。"
"70014040-71-カイ" = "カイ……？"
"70014040-72-カイ" = "……！"
"70014040-73-老人" = "……。"
"70014040-74-老人" = "帰ろう。もう日が暮れておる。"
"70014040-75-カイ" = "……ああ。"
"70014040-76-老人" = "怪我はないかい？"
"70014040-77-カイ" = "……それはこちらの台詞だと思うが。"
"70014040-78-老人" = "ほっほっほっ……元気も元気。これでも、此処の住民なのでな。"
"70014040-79" = "（カイと老人の会話は、自然に途切れることなく続いた）"
"70014040-80" = "（2人の話を、黙って聞いていた）"
"70014040-81-老人" = "もうこんな時間か……。"
"70014040-82-老人" = "先に休ませてもらうとしよう。"
"70014040-83-老人" = "2人も、あまり遅くならんようにな。"
"70014040-84-老人" = "……そうする。"
"70014040-85-투명" = "（老人は前よりも少し軽やかに、足を引きずりながら部屋に戻った）"
"70014040-86-투명" = "（……まもなく、寝息が聞こえてきた）"
"70014040-87-カイ" = "……。"
"70014040-88" = "[s] \"強い方だね。\""
"70014040-89-カイ" = "……まあ、そうだな。"
"70014040-90" = "[s] \"大丈夫？\""
"70014040-91-カイ" = "……変なことを聞くねぇ。"
"70014040-92-カイ" = "その台詞は、先ほどの輩どもにかけるべきじゃないかい？"
"70014040-93" = "[s] \"でも、複雑そうな顔をしてるから。\""
"70014040-94-カイ" = "……！"
"70014040-95-カイ" = "……。"
"70014040-96-カイ" = "どう言ったものか……。"
"70014040-97-カイ" = "……馴染みがなくてな。"
"70014040-98" = "[s] \"ご老人を助けたこと？\""
"70014040-99-カイ" = "……！"
"70014040-100-カイ" = "……こんなことで先生を騙そうとしても無駄か。"
"70014040-101-カイ" = "だが「良い事」などという判断軸で行動したわけではない。"
"70014040-102-カイ" = "心の赴くままに行動し、その結果がこうなっただけだ。"
"70014040-103-カイ" = "……今日1日、私がそうしたように。"
"70014040-104" = "[s] \"それでいいんだよ。\""
"70014040-105-カイ" = "なに……？"
"70014040-106" = "[s] \"善人じゃなくたって、良いことをしてもいいんだよ。\""
"70014040-107-カイ" = "理解に苦しむな。"
"70014040-108" = "[s1] \"なんとなくも大事だよ。\"\n[s2] \"結果良ければすべて良し、ってね。\""
"70014040-109-カイ" = "いいのか？そんな考えで。"
"70014040-110" = "[s] \"少なくとも、今はね。\""
"70014040-111-カイ" = "……！"
