[translation]
"70014020-1" = "薬屋の彷徨い（２）"
"70014020-2-カイ" = "……。"
"70014020-3-カイ" = "なぜ私が？"
"70014020-4-カイ" = "それでなんの得がある？"
"70014020-5-カイ" = "まもなくこの家は私のものになる。"
"70014020-6-カイ" = "治さなくとも結果は変わらない。#nむしろ、治せば損をする可能性すらある。"
"70014020-7" = "[s1] \"それはほら、やってみないと分からないし。\"\n[s2] \"お礼に、私がカイのお願いを1つ聞くってのでどうかな。\""
"70014020-8-カイ" = "ほう……？"
"70014020-9-カイ" = "私が言えたことでは無いが――"
"70014020-10-カイ" = "正気か？"
"70014020-11" = "[s3] \"生徒のためを思ってのことなのに……。\"\n[s4] \"ひどいよ！\""
"70014020-12-カイ" = "……生徒、か。"
"70014020-13-カイ" = "まだ……。"
"70014020-14-カイ" = "……ククッ。いいだろう。"
"70014020-15-カイ" = "だが、気をつけることだ。約束の持つ重みは……想像以上だからな。"
"70014020-16" = "（カイは鞄からいくつかの薬材を取り出し――）"
"70014020-17" = "（よく分からない過程を経て、何かを作り上げた）"
"70014020-18" = "（そして……）"
"70014020-19-老人" = "お、おお……！？関節が……！"
"70014020-20-カイ" = "まだ完治したわけじゃないが、1週間もすれば良くなるはずだ。"
"70014020-21-カイ" = "もしも再発した場合はこれを飲んでくれ。"
"70014020-22-カイ" = "ただ、症状がないのに服用するのは、「薬屋」としておすすめしない。"
"70014020-23-老人" = "ありがとう……ありがとうねぇ……。"
"70014020-24-老人" = "こうあっさり治ってしまうと、#nどうして今まで症状が続いたのか不思議なくらいだよ……。"
"70014020-25-カイ" = "……。"
"70014020-26" = "[ns5] \"そ、それは！カイが処方してきた薬と……！\"\n[ns6] \"新しく処方した薬が上手いこといって！\"\n[ns7] \"やっと効き目が現れたんじゃないですかね……？\""
"70014020-27-老人" = "そうか……そうなんだね。カイ、本当にありがとうねぇ……。"
"70014020-28-カイ" = "ああ。"
"70014020-29-老人" = "ほっほっ……体が軽く感じるのはいつぶりだろうね。階段だって下りられてしまうよ。"
"70014020-30-老人" = "久々にお出かけでもしようかのう。"
"70014020-31" = "[ns] \"さすがだね……。\""
"70014020-32-カイ" = "当然のことだ。症状が改善されなかったら、憤っていただろう。"
"70014020-33" = "[s8] \"それ、治らなかったことに対してじゃないよね？\"\n[s9] \"カイが間違ってることになるからかな……？\""
"70014020-34-カイ" = "分かった風なことを言ってくれるねぇ。"
"70014020-35-カイ" = "私は自分の誤りを嫌悪する。医師であり薬屋として、当然のことだ。"
"70014020-36-カイ" = "だからこそ、老人の病が治ったところで、私には何の感慨もない。#n起こるべきことが起こった。それだけだ。"
"70014020-37-カイ" = "でも、まあ……。"
"70014020-38-カイ" = "……。"
"70014020-39-カイ" = "これはこれで、悪くない。"
"70014020-40-カイ" = "で。それはそれとして、だ。"
"70014020-41-カイ" = "約束を果たしてもらおうかね。"
"70014020-42-カイ" = "うむ？ちょっと待ってほしい？"
"70014020-43-カイ" = "まさか、約束を反故にするつもりじゃ……。"
"70014020-44-カイ" = "……。"
"70014020-45-カイ" = "ああ、そういえば。何か用事があるのだったか。#nここは、先生には似つかわしくない場所だからね。"
"70014020-46-カイ" = "それで、理由は？"
"70014020-47" = "[ns] \"ブラックマーケットがどんな場所なのかを確かめたいんだ。\""
