[translation]
"70013050-1" = "一人では咲かない雑草（5）"
"70013050-2" = "数日後……。"
"70013050-3" = "ホテルのファインダイニングレストランのラウンジ"
"70013050-4-アル" = "……。"
"70013050-5-アル" = "……まさか、また来ることになるとはね。"
"70013050-6-アル" = "くふふ、ホテルのほうからお礼だって言われたんでしょ？それならありがたくいただいちゃうのが礼儀だって！"
"70013050-7-ムツキ" = "だ、大丈夫かしら？損害賠償を請求するための罠じゃないわよね？"
"70013050-8-カヨコ" = "大丈夫。"
"70013050-9-カヨコ" = "このホテル、前からリガトーニ・ファミリーに悩まされてたみたい。"
"70013050-10-カヨコ" = "それを退治してあげたんだから、お礼をしたいって気持ちは嘘じゃないと思う。"
"70013050-11-ハルカ" = "もし我々をだますようなことがあれば……私が消します。"
"70013050-12-ハルカ" = "だから心配しないでください、アル様。"
"70013050-13-アル" = "え、えぇ！？"
"70013050-14-アル" = "し、心配なんてしてないわよ？私はただ、色々な可能性を考慮した方がいいって言いたかっただけ。"
"70013050-15-ハルカ" = "えへへ……。さすがアル様……何事も慎重に、ですね。"
"70013050-16-ウェイター" = "皆様！ようこそいらっしゃいました！"
"70013050-17-ウェイター" = "ご案内いたします！"
"70013050-18-ハルカ" = "変なことをしてきたら……すぐに始末します。"
"70013050-19-アル" = "だ、だから、そんな心配いらないわよ！"
"70013050-20-ウェイター" = "では、お好きなところにお座りください。"
"70013050-21-アル" = "あら……？私たち以外、誰もいないのね？"
"70013050-22-ウェイター" = "今夜は皆様だけを特別招待させていただきました。"
"70013050-23-ウェイター" = "メニューも特別なものを準備しております。"
"70013050-24-ウェイター" = "本日のために我こそはというシェフが集まりましたので、ご期待ください。"
"70013050-25-ウェイター" = "こちらがメニューです。"
"70013050-26-アル" = "こ、これは……！"
"70013050-27-ムツキ" = "ん？なになに？ま～た変なことでも書いてあった？"
"70013050-28-ムツキ" = "お～"
"70013050-29-カヨコ" = "……どうしたの？"
"70013050-30-カヨコ" = "これは……。"
"70013050-31-ハルカ" = "ど、どうしましたか？私たち、罠にはめられたんですか？"
"70013050-32-ハルカ" = "ハルカちゃん。これ、どういうことか分かる～？"
"70013050-33-ハルカ" = "オシェトラ・ゴールデンインペリアルキャビア・ブリニ……？"
"70013050-34-ムツキ" = "こ、これは何ですか……？読めはしますが、意味不明なものだらけです……。"
"70013050-35-ハルカ" = "そ、そもそも料理の名前で合ってるんでしょうか？何かの暗号ではないですよね？"
"70013050-36-ムツキ" = "くふふっ、さっぱり分からないけど、頼んでみよっ！"
"70013050-37-ムツキ" = "これとーこれとー、これも！"
"70013050-38-カヨコ" = "でも一つぐらい、ちゃんと分かりそうなものを頼んだほうがいいんじゃない？"
"70013050-39-カヨコ" = "例えば……トリュフクリームリゾットとか。"
"70013050-40-ハルカ" = "そ、それもよく分かりませんけど……お任せします……！"
"70013050-41-アル" = "いいわ。じゃあ注文しましょう。"
"70013050-42-アル" = "すみません！"
"70013050-43-ウェイター" = "いかがなさいますか？"
"70013050-44-アル" = "ここからここまで、全部お願いするわ。"
"70013050-45-アル" = "あと、このトリュフクリームリゾットもね！"
"70013050-46-ウェイター" = "お飲み物は？"
"70013050-47-アル" = "の、飲み物？"
"70013050-48-アル" = "（ううっ、それは考えてなかったわ……）"
"70013050-49-アル" = "（こんな所で平凡なものを頼むわけにはいかないじゃない……！）"
"70013050-50-ウェイター" = "ふふ、ごゆっくりどうぞ。"
"70013050-51-ウェイター" = "このレストランは本日、皆様のものですから。"
"70013050-52" = "その後、一同は豪華な夕食を楽しんだ。"
"70013050-53" = "便利屋68が始まって以来、一番豪華とも言える夕食だった。"
"70013050-54-ムツキ" = "あー、お腹いっぱい。本当に幸せ～"
"70013050-55-ムツキ" = "デザートの前に食べた料理？あれ超おいしかったー"
"70013050-56-ムツキ" = "何ていう料理だったっけ？アルちゃん覚えてる？"
"70013050-57-アル" = "ぎゅ、牛肉を焼いたものだからステーキでしょう。"
"70013050-58-カヨコ" = "ただのステーキじゃなかったけど。"
"70013050-59-アル" = "と、とにかくおいしかったんだから、いいのよ。ね、ハルカ？"
"70013050-60-ハルカ" = "……。"
"70013050-61-ハルカ" = "ハルカ？"
"70013050-62-ハルカ" = "あ……はい！アル様。私もうれしかったです。えへへ……。"
"70013050-63-アル" = "どこを見てたの？"
"70013050-64-ハルカ" = "あ、その……あっちに見慣れた路地があったので……。"
"70013050-65-カヨコ" = "あの路地……。"
"70013050-66-アル" = "……あ。"
"70013050-67-ムツキ" = "くふふ、あっちに行こうよ。なんか、面白そうじゃん。"
"70013050-68-ハルカ" = "ですが……。"
"70013050-69-ムツキ" = "大丈夫。行こー行こー！"
"70013050-70-アル" = "ええ。気になることがあるなら、行きましょう。"
"70013050-71-アル" = "時には、過去と向き合うことも大事よ。"
"70013050-72-ハルカ" = "……はい。"
"70013050-73-ハルカ" = "皆さんが……そうおっしゃるなら……。"
"70013050-74-ハルカ" = "……久しぶりですね。"
"70013050-75-ハルカ" = "皆さんと初めて会ったのが……この路地です。"
"70013050-76-ムツキ" = "ここは変わらないね。"
"70013050-77-ムツキ" = "けどさー、ハルカちゃんは、すっごく変わったよね？"
"70013050-78-ハルカ" = "そ、そうですか？よく分かりません……。"
"70013050-79-アル" = "確かにそうね。"
"70013050-80-アル" = "あの時はただ弱くてかわいそうな子だったけど、今じゃ我が便利屋68の優秀社員なんだから。"
"70013050-81-ハルカ" = "えへへ……そんな風に言っていただけるなんて……感謝してもしきれません。"
"70013050-82-ハルカ" = "……。"
"70013050-83-ハルカ" = "たぶんこっちの方です。アル様が私を助けてくださった場所は。"
"70013050-84-ハルカ" = "あの時、私は……面倒を見ていた子を守ろうと思ったのに……。"
"70013050-85-ハルカ" = "……。"
"70013050-86-ハルカ" = "で、ですが大丈夫です！私は皆さんのおかげで……！"
"70013050-87-ムツキ" = "……あれ？ちょっと待って、ハルカちゃん。"
"70013050-88-ムツキ" = "今ハルカちゃんが立っているところにある草、あの時の草じゃな～い？"
"70013050-89-ハルカ" = "……はい？それはどういう……。"
"70013050-90-ハルカ" = "あ……！あぁ……！"
"70013050-91-ハルカ" = "い、生きていました……！この子……ちゃんと生きていました……！！"
"70013050-92-ハルカ" = "それに花まで咲かせて……。どうやって一人で……。"
"70013050-93-アル" = "この子は一人で咲いたんじゃないわ。"
"70013050-94-アル" = "ハルカが毎日面倒を見てあげたから咲いたのよ。"
"70013050-95-アル" = "あなたのおかげで、花を咲かせられるほどの栄養を蓄えられたの。"
"70013050-96-ハルカ" = "そ、それは……。"
"70013050-97-ムツキ" = "あっ！いいこと思いついちゃった～"
"70013050-98-ムツキ" = "この子、事務所に持っていこうよ！鉢に入れて、みんなで面倒を見てあげるの！"
"70013050-99-アル" = "ええ、すごくクールだわ。これぞまさにハードボイルドね。"
"70013050-100-カヨコ" = "だって、ハルカ。"
"70013050-101-ハルカ" = "…………。"
"70013050-102-ハルカ" = "あ、ありがとうございます。"
"70013050-103-ハルカ" = "あのとき、引き取ってくださり、感謝しています。"
"70013050-104-ハルカ" = "小さい頃から周りに嫌われていた私を……大事にしてくださって、ありがとうございます。"
"70013050-105-ハルカ" = "本当に、このご恩は死んでもお返しします……！"
"70013050-106-ハルカ" = "何言ってるのよ。恩返しはすでに終わってるって言ったでしょう。"
"70013050-107-ムツキ" = "くふふっ、「死ぬ」って言うのもやめてよー、ハルカちゃんがいなくなったら、私たちどうしたらいいの？"
"70013050-108-カヨコ" = "うん。みんなが揃ってこその便利屋68なんだから。"
"70013050-109-アル" = "そうよ。これからもよろしくね、ハルカ。"
"70013050-110" = "こうして次の日も、その次の日も――"
"70013050-111" = "便利屋68のハードボイルドな日常は続いた。"
"70013050-112" = "一人では咲かない雑草"
