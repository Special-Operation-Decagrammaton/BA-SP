[translation]
"70013020-1" = "一人では咲かない雑草（2）"
"70013020-2" = "[log]時は、ハルカが便利屋68のメンバーになる前――[/log]"
"70013020-3-アル" = "ふふ、今回の依頼も大成功だったわね。"
"70013020-4-アル" = "ん～、けどさーアルちゃん。"
"70013020-5-ムツキ" = "「猫探し」と「ハードボイルド」って全然違うと思うけど？"
"70013020-6-アル" = "えっ……。"
"70013020-7-アル" = "ま、まさか！すごく密接なつながりがあるわ！"
"70013020-8-ムツキ" = "自由を求めて家出した猫を、主人のもとに連れ戻したのよ？"
"70013020-9-アル" = "猫の自由を奪ってやったんだから、かなりの悪党でしょう？"
"70013020-10-ムツキ" = "くふふっ、そうかな～？"
"70013020-11-カヨコ" = "はあ……。社長がそう言うなら、そうなんでしょ。"
"70013020-12-ムツキ" = "ねえ、カヨコちゃん。あの猫、どうして自分で下りられないトコに行ったんだろ？"
"70013020-13-ムツキ" = "危ないってことぐらい、分かってるはずなのに。"
"70013020-14-カヨコ" = "……どうして私に聞くの？"
"70013020-15-ムツキ" = "ん～、カヨコちゃんだったら知ってそうだから？"
"70013020-16-カヨコ" = "……。"
"70013020-17-カヨコ" = "どうせ他の猫か犬に追いかけられて、気付かないうちに上っちゃったんじゃない？"
"70013020-18-ムツキ" = "必死になりすぎて、まともな判断ができなかったんだよ。"
"70013020-19-カヨコ" = "私たちにもあるでしょ？"
"70013020-20-カヨコ" = "逃げるのに夢中で行ってはいけない方へ……。"
"70013020-21-カヨコ" = "気付いたら戻れなくなってるってこと。"
"70013020-22-カヨコ" = "そういう人たち、たくさん見てきたし。"
"70013020-23-カヨコ" = "おお～、さすがカヨコちゃん。真面目に答えてくれちゃって～"
"70013020-24-カヨコ" = "……そうだね。どうしたんだろ。"
"70013020-25-アル" = "ふふふっ。とにかく一稼ぎしたんだし、ラーメンでも食べにいきましょう。"
"70013020-26-アル" = "今日は、大盛りでもオッケーよ！"
"70013020-27-アル" = "わ～お！アルちゃんの奢り？じゃあ、チャーシュー追加もオッケー？"
"70013020-28-アル" = "も、もちろんよ！私が目指してるのは、福利厚生も手厚い会社なんだから！"
"70013020-29-アル" = "……それって、ハードボイルドとはかけ離れてるんじゃない？"
"70013020-30-アル" = "いいから、奢るって言った時は黙って食べなさい！"
"70013020-31-ムツキ" = "あれ？「雑草ちゃん」じゃ～ん。"
"70013020-32-ムツキ" = "雑草ちゃん？"
"70013020-33-ムツキ" = "うん。いーっつも雑草の面倒みてるから、雑草ちゃん。"
"70013020-34-アル" = "本当の名前は？"
"70013020-35-ムツキ" = "分かんない。#n話しかけても、答えてくれないし？"
"70013020-36-アル" = "ふぅん……変わった子ね。"
"70013020-37" = "……えへ、えへへ。"
"70013020-38-ハルカ" = "……えへ、えへへ。"
"70013020-39-ハルカ" = "昨日よりちょっと大きくなりましたね。葉っぱも元気いっぱいで……。"
"70013020-40-ハルカ" = "今日は水をあげに来ましたよ。そろそろ喉が渇くかと思って……。"
"70013020-41-ハルカ" = "……えへ……えへへへ。"
"70013020-42-いじめグループのリーダー" = "一日中姿が見えないと思ったら、こんなとこに隠れてたんだ？"
"70013020-43-ハルカ" = "ち、違います！隠れてなんかいません……！"
"70013020-44-チンピラA" = "じゃあ、なんでこんな暗いとこにいんだ？"
"70013020-45-ハルカ" = "そ、それはこの子のために……。"
"70013020-46-チンピラB" = "ん？まさか今、雑草を「この子」って呼んだ？"
"70013020-47-いじめグループのリーダー" = "ウケる～この子って何だよ！"
"70013020-48-いじめグループのリーダー" = "ふざけてないで、さっさとお金持ってきなよ！"
"70013020-49-いじめグループのリーダー" = "あ、この雑草汚いからお掃除しておいて。"
"70013020-50-ハルカ" = "あ、ああ……！"
"70013020-51-ハルカ" = "す、すみません！どうか……！！"
"70013020-52-ハルカ" = "や、やめてください！い、いっそ私を……！踏みつけてください……！"
"70013020-53-チンピラA" = "そんなに言うなら、お望みどおりにしてやるよ！"
"70013020-54-チンピラB" = "きゃはっははははは……！！"
"70013020-55-いじめグループのリーダー" = "これでよく分かったでしょう？#n逆らってもムダなのよ。"
"70013020-56-いじめグループのリーダー" = "分かったら早くお金を持ってきて。"
"70013020-57-いじめグループのリーダー" = "次はその顔ーー"
"70013020-58-チンピラA" = "な、なんだ！どこのどいつが……！"
"70013020-59-アル" = "……。"
"70013020-60-チンピラA" = "お前……！今、誰を撃ったか分かってんのか！？"
"70013020-61-アル" = "誰かしら。"
"70013020-62-アル" = "まあ、大した人じゃないんでしょうけど。"
"70013020-63-アル" = "こんな所で弱い者いじめをしているくらいだもの、ね。"
"70013020-64-チンピラB" = "こ、こいつ……！！"
"70013020-65-ムツキ" = "へぇ、やる気満々じゃん？頭数もこっちが多いのに。"
"70013020-66-カヨコ" = "……。"
"70013020-67-チンピラB" = "（あ、あいつの目……ヤバ……！）"
"70013020-68-チンピラA" = "い、行くぞ！"
"70013020-69-チンピラB" = "お、覚えとけよ……！"
"70013020-70-ハルカ" = "ねぇ、大丈夫？"
"70013020-71-ハルカ" = "……。"
"70013020-72-カヨコ" = "この子の大事な草が……めちゃくちゃに……。"
"70013020-73-アル" = "……。"
"70013020-74-アル" = "も、もう大丈夫よ！あの連中は私たちが追っ払ってあげたから。"
"70013020-75-ハルカ" = "大丈夫じゃ……ないです。"
"70013020-76-ハルカ" = "きっと……また来るだろうから……。"
"70013020-77-ハルカ" = "……ごめんなさい。本当にごめんなさい……。"
"70013020-78-ハルカ" = "守って……あげられませんでしたね……。"
"70013020-79-アル" = "……。"
"70013020-80-アル" = "あの連中に付きまとわれてるんでしょう？"
"70013020-81-アル" = "私たちが解決してあげるわ。あなた、名前は？"
"70013020-82-ハルカ" = "……すみません。言うことはできません。"
"70013020-83-ハルカ" = "何も知ろうとしないでください。"
"70013020-84-ハルカ" = "私なんかと関わったら……皆さんも無事では済まないでしょうから。"
"70013020-85-カヨコ" = "どうしてそんなこと……。"
"70013020-86-カヨコ" = "……いったん、戻ろう。"
"70013020-87-カヨコ" = "あの子、今説得できる状態じゃない。"
"70013020-88-カヨコ" = "下手に追っても……逃げていくだけだよ。"
"70013020-89-アル" = "……。"
"70013020-90-アル" = "分かったわ。とりあえず引き下がりましょう。"
"70013020-91-ハルカ" = "……。"
"70013020-92-ハルカ" = "じゃあ、あとでね～雑草ちゃん！"
"70013020-93-ハルカ" = "雑草……ちゃん？"
"70013020-94-ムツキ" = "あ……ご、ごめーん！つい……。"
"70013020-95-ムツキ" = "面倒見てた草がこんなことになっちゃったのに……本当にごめんね！"
"70013020-96-ハルカ" = "……。"
"70013020-97-ハルカ" = "……いいえ、気にしないでください。"
"70013020-98-ハルカ" = "どうせ私は雑草みたいなもんですから……。えへへ……。"
"70013020-99-ハルカ" = "私にはぴったりのあだ名……。"
"70013020-100-ハルカ" = "えへへへ……。"
"70013020-101-ムツキ" = "う……やっちゃったぁ。"
"70013020-102-カヨコ" = "……やっぱり放っておけないわ。"
"70013020-103-カヨコ" = "タダ働きするの？"
"70013020-104-アル" = "た、タダ働きじゃないわよ！"
"70013020-105-アル" = "うちのテリトリーでスケバンが暴れてるのが気に入らないだけ。#nこんなの、仕事の内にも入らないわ。"
"70013020-106-カヨコ" = "はいはい。そういうことにしとくよ。"
"70013020-107-カヨコ" = "けどさーアルちゃん。名前も知らない子をどうやって助けるの？"
"70013020-108-アル" = "そ、それは……。"
"70013020-109-カヨコ" = "……当てがある。ついてきて。"
"70013020-110" = "しばらくの間、カヨコの情報収集が続いた。"
"70013020-111" = "そして――"
"70013020-112-カヨコ" = "二人とも、こっち。大体のことは分かったよ。"
"70013020-113-ムツキ" = "おお～さすがカヨコちゃん。なになにー？早く教えて！"
"70013020-114-カヨコ" = "あの子をいじめてた連中、やっぱりただのスケバンじゃない。"
"70013020-115-カヨコ" = "マフィアとつながってた。"
"70013020-116-アル" = "スケバンが……マフィアと？"
"70013020-117-カヨコ" = "うん。マフィアがスケバンを使って、生徒たちから金を巻き上げてたみたい。"
"70013020-118-カヨコ" = "あの連中は下っ端の下っ端だから、倒しても意味がないの。"
"70013020-119-カヨコ" = "マフィアの方をどうにかしないと。"
"70013020-120-ムツキ" = "ふぅ～ん、思ったより深刻だね？"
"70013020-121-アル" = "それで、どこの組織なの？"
"70013020-122-カヨコ" = "組織の名前は――"
"70013020-123-カヨコ" = "リガトーニ・ファミリー。"
