[translation]
"70013010-1" = "一人では咲かない雑草（1）"
"70013010-2" = "ホテルのファインダイニングレストランのラウンジ"
"70013010-3-アル" = "……。"
"70013010-4-アル" = "……ついに。"
"70013010-5-アル" = "来たわよ！"
"70013010-6-アル" = "最高級ホテルのレストラン……！"
"70013010-7-ハルカ" = "こ、こんな場所でアル様と食事ができるなんて……もう死んでも心残りはありません！"
"70013010-8-ムツキ" = "アルちゃん、本当に大丈夫～？#nここ、すっごく高そうだけど？"
"70013010-9-アル" = "安心してちょうだい、今日は私の奢りよ。#nそれに、最近は収入も安定してきているのよ。"
"70013010-10-アル" = "……とはいえ、あまり無理しない方がいいんじゃないかな。"
"70013010-11-アル" = "こ、これくらいは大丈夫よ！"
"70013010-12-アル" = "最近はちゃんと貯金できるくらいの余裕があるのよ。"
"70013010-13-カヨコ" = "私も社長として、このくらいはしないとね。"
"70013010-14-アル" = "だからみんな、今日は楽しんでちょうだい。"
"70013010-15-カヨコ" = "くふふ、そこまで言われたら楽しんであげなきゃね～"
"70013010-16-カヨコ" = "一応聞くけど、予約はちゃんとしてる？"
"70013010-17-アル" = "あ、当たり前でしょ！"
"70013010-18-アル" = "えーっと、あの、すみません。"
"70013010-19-アル" = "いらっしゃいませ。"
"70013010-20-アル" = "[ruby=りくはちま]陸八魔[/ruby]ですが……。"
"70013010-21-ウェイター" = "お待ちしておりました。こちらへどうぞ。"
"70013010-22-ウェイター" = "窓側のお席へどうぞ。"
"70013010-23-ウェイター" = "では、本日のコースを簡単に説明いたします。"
"70013010-24-ウェイター" = "メインディッシュは、シェフ特製ワイルドハント風の牛フィレ煮込みです。"
"70013010-25-ウェイター" = "酸味が控え目のワインと肉汁を[ruby=Deglaze]デグレイズ[/ruby]したソースで煮詰めています。"
"70013010-26-ウェイター" = "また、芳醇で深い味わいが感じられるよう……。"
"70013010-27" = "その後もウェイターの説明は続いたが――"
"70013010-28" = "[ruby=Infusion]インフュージョン[/ruby]、[ruby=Al dente]アルデンテ[/ruby]、[ruby=Brunoise]ブリュノワーズ[/ruby]など……アルたちにとって、普段耳にしない言葉ばかりが並んだ。"
"70013010-29-アル" = "な、なるほど！どれも美味しそうね！"
"70013010-30-アル" = "では、[ruby=amuse bouche]アミューズブーシュ[/ruby]からお持ちいたします。"
"70013010-31-アル" = "アルちゃん、ほんとに意味分かってる～？"
"70013010-32-アル" = "よ、要するに最高級の料理ってことでしょう？"
"70013010-33-アル" = "細かいことを気にしていてはダメよ。#n高いんだから、どれも美味しいはず。"
"70013010-34-カヨコ" = "そういえば、水も……ちょっと違うね。"
"70013010-35-カヨコ" = "……ミネラルウォーターだって。"
"70013010-36-ハルカ" = "ど、どういう人が普段こんな所で食事をするんでしょうか……？"
"70013010-37-ムツキ" = "わぁ！みんな、見るからにお金持ちそ～"
"70013010-38-アル" = "私たちだって客として来ているのよ、周囲と比べる必要はないわ。"
"70013010-39-アル" = "それに、ドレスコードだって完璧――"
"70013010-40-ムツキ" = "ちょっと張り切りすぎじゃない？"
"70013010-41-アル" = "そ、そんなことないわよ……！"
"70013010-42-アル" = "優雅な食事にぴったりじゃない？"
"70013010-43-ムツキ" = "くふふっ。じゃあアルちゃんはマナーも完璧なんだね？"
"70013010-44-ムツキ" = "それじゃあしつもーん。#nナイフとフォークを使う順番は分かる？"
"70013010-45-アル" = "わ、私も気になってました。どうしてこんなに種類があるんですか？"
"70013010-46-アル" = "えっ……そ、それは……。"
"70013010-47-カヨコ" = "料理ごとに使う食器が違うんだよ。"
"70013010-48-カヨコ" = "……どれから使うのかは知らないけど。"
"70013010-49-アル" = "て、テキトーでいいんじゃないかしら？#n要は、食べられればいいのよ。"
"70013010-50-ホテルのVIP顧客" = "やけに騒がしいな？"
"70013010-51-ホテルのVIP顧客" = "どうやら、場違いな奴がいるようだが……。"
"70013010-52-ハルカ" = "ふ～ん？それって、私たちのこと？"
"70013010-53-ハルカ" = "今……アル様を侮辱しましたか？"
"70013010-54-ホテルのVIP顧客" = "アル？"
"70013010-55-ホテルのVIP顧客" = "……。"
"70013010-56-ホテルのVIP顧客" = "おっ、お前たちは……！"
"70013010-57-ホテルのVIP顧客" = "便利屋68！！"
"70013010-58-カヨコ" = "えっと……どちら様？"
"70013010-59-ホテルのVIP顧客" = "私を……！忘れたのか！？"
"70013010-60-ムツキ" = "悪党ってみんな似たような感じだし～？"
"70013010-61-ムツキ" = "いちいち覚えてないんだよね。"
"70013010-62-リガトーニ" = "リガトーニ・ファミリーの！#nブルーノ・リガトーニ！"
"70013010-63-リガトーニ" = "この名を忘れたとは言わせんぞ！"
"70013010-64-カヨコ" = "リガトーニ……ファミリー……？"
"70013010-65-カヨコ" = "……まさか。"
"70013010-66-カヨコ" = "そういえば……。"
"70013010-67-リガトーニ" = "ふ、ふふ……。"
"70013010-68-リガトーニ" = "ふっはははは……！"
"70013010-69-リガトーニ" = "ようやく思い出したようだな！"
"70013010-70-リガトーニ" = "復讐の時だ！いくぞ、お前ら！！"
"70013010-71-カヨコ" = "こんなところで戦うなんて正気？"
"70013010-72-リガトーニ" = "私はこの店にかなり金を払っているからな！#n何をしようが多少は目を瞑ってもらえるんだよ！"
"70013010-73-リガトーニ" = "ここで会ったが百年目――"
"70013010-74-リガトーニ" = "あの時の恨みを晴らしてやる！"
"70013010-75-リガトーニ" = "[ruby=や]殺[/ruby]っちまえ！"
"70013010-76-カヨコ" = "きゃははっ。#nド派手な歓迎だねぇ。"
"70013010-77-カヨコ" = "社長、どうする？"
"70013010-78-カヨコ" = "店の物を壊して、弁償できる？"
"70013010-79-カヨコ" = "う……で、でも――"
"70013010-80-カヨコ" = "――ここで逃げたらハードボイルドじゃないわ！"
"70013010-81-カヨコ" = "みんな、反撃開始よ！"
"70013010-82-カヨコ" = "さすがアルちゃん！そうこなくっちゃ！"
"70013010-83-カヨコ" = "お……お任せください、アル様。一人残らず始末します……！"
"70013010-84" = "突如始まったレストランでの銃撃戦。"
"70013010-85" = "便利屋68とリガトーニ・ファミリーの間に、一体何があったのだろう――"
