[translation]
"70013030-1" = "一人では咲かない雑草（3）"
"70013030-2-リガトーニ" = "この日をどれだけ待ちわびてきたことか。"
"70013030-3-リガトーニ" = "正に運命的な再会だ！お前らにはここで消えてもらう！"
"70013030-4-ムツキ" = "くふふ。あんな目に遭ったのに、ま～だ懲りないんだ？"
"70013030-5-ムツキ" = "それなら部下たちの前で、あの日の恥ずかし～こと、バラしちゃうよー？"
"70013030-6-リガトーニ" = "だ、黙れ！これまで見逃してやったのに、恩知らずな奴め……！"
"70013030-7-カヨコ" = "ウェブ上に広まるのが怖かったんじゃないんだ。"
"70013030-8-カヨコ" = "お望みなら今、やってあげるけど。"
"70013030-9-リガトーニ" = "く、くぅぅっ……！"
"70013030-10-リガトーニ" = "おい！徹底的にやっちまえ！"
"70013030-11-アル" = "ふふっ、良いわ。最高ね。"
"70013030-12-アル" = "過去の敵と再会し、かっこよくやっつける。これもまたハードボイルド……！"
"70013030-13-アル" = "みんな、本気で行くわよ！"
"70013030-14-ハルカ" = "はい、アル様！あの時の分まで……！！"
"70013030-15-ハルカ" = "うわあああ！死んでください！みんな死んでください……！！"
"70013030-16-ギャングメンバー" = "ぐっ！い、一旦下がれ！近づくのは危険だ！"
"70013030-17-ムツキ" = "くふふっ、ちゃ～んと集まれてえらいねー"
"70013030-18-ムツキ" = "さあ、弾ける準備はいいかな～？"
"70013030-19-ムツキ" = "……！"
"70013030-20-ギャングメンバー" = "ぐあああっ……！"
"70013030-21-ムツキ" = "きゃははっ！ポップコーンみたい！"
"70013030-22-リガトーニ" = "な、なにを手こずってる！早く始末しろ！"
"70013030-23-カヨコ" = "……しつこい。"
"70013030-24-カヨコ" = "社長。修理代が増えちゃいそうだけど、大丈夫？"
"70013030-25-アル" = "構わないわ！私たちが勝てばいいのよ！"
"70013030-26-アル" = "歴史は勝者によって作られるものなんだから！"
"70013030-27-カヨコ" = "なんか違う気がするけど……。"
"70013030-28-カヨコ" = "社長の考えには賛成……何が何でも勝つ。"
"70013030-29-アル" = "ふふっ、そろそろ降参しなさい。これ以上続けても、そっちが損するだけよ。"
"70013030-30-ムツキ" = "くふふっ、今回もオモシロ写真を何枚か撮ったら終わってあげる！"
"70013030-31-リガトーニ" = "く、くそっ……！"
"70013030-32-リガトーニ" = "何か、何かないのか……！"
"70013030-33-リガトーニ" = "あれは……？そうだ！"
"70013030-34-レストランの客" = "ひ、ひいいいっ！た、助けてください……！"
"70013030-35-リガトーニ" = "いい加減にしろ！こいつがどうなっても知らないぞ！！"
"70013030-36-アル" = "あ、あいつらを無事に返してほしけりゃ……降参するんだ！"
"70013030-37-アル" = "卑怯だわ！人質だなんて……！"
"70013030-38-リガトーニ" = "さあ、銃を置け！これはお遊びじゃないぞ！！"
"70013030-39-アル" = "（ううっ……！）"
"70013030-40-アル" = "（でもここで銃を置いたら……うちの社員が危ない！）"
"70013030-41-アル" = "（だからといって、戦い続けたら人質が……！）"
"70013030-42-アル" = "（あああっ……！）"
"70013030-43-カヨコ" = "……。"
"70013030-44-カヨコ" = "ムツキ、あのキッチンに料理用の小型リフトがある。"
"70013030-45-カヨコ" = "ハルカとそっちに行って。"
"70013030-46-カヨコ" = "ええーっ？それじゃあ、アルちゃんとカヨコちゃんは？"
"70013030-47-カヨコ" = "ひとまず、降参するしかないかな。"
"70013030-48-カヨコ" = "社長の性格、知ってるでしょ？人質を放ってはおけない。"
"70013030-49-カヨコ" = "どういうことか、[ruby=・   ・   ・   ・   ・]分かるよね[/ruby]？"
"70013030-50-ムツキ" = "……一旦下がってから、やっちゃえばいいってこと？オッケー！"
"70013030-51-ムツキ" = "ハルカちゃん！行こう！"
"70013030-52-ハルカ" = "はい？ど、どこへですか！？"
"70013030-53-ハルカ" = "ついてきて！今は、こうするしかないのー！"
"70013030-54-ハルカ" = "あ、アル様……！"
"70013030-55-アル" = "そ、そうよ！ここは私たちに任せて！"
"70013030-56-アル" = "あなたの望みどおり、銃を置いたわ！だからうちの社員は行かせてちょうだい！"
"70013030-57-リガトーニ" = "こ、こいつら、ふざけた真似を……！"
"70013030-58-カヨコ" = "今！早く……！"
"70013030-59-ムツキ" = "はあっ、はあっ……。"
"70013030-60-ムツキ" = "ハルカちゃん、大丈夫～？"
"70013030-61-ハルカ" = "あ、アル様……すみません。本当にすみません。アル様を残して逃げるだなんて……。"
"70013030-62-ハルカ" = "や、やっぱり私に生きる資格なんてないんです！今すぐにでも死んだほうがいいんです……！！"
"70013030-63-ムツキ" = "何言ってんの！私たちが力を合わせて二人を助けないとじゃん！"
"70013030-64-ムツキ" = "あいつは前にも倒したんだから、今回だって大丈夫！"
"70013030-65-ハルカ" = "だ、だけどその時私は……。"
"70013030-66-アル" = "あ……！見つけたわ！"
"70013030-67-ハルカ" = "ひ、ひいいいっ……！"
"70013030-68-ハルカ" = "どうして逃げるの？待って！"
"70013030-69-ハルカ" = "で、でも、わ、私なんかに関わったら……！"
"70013030-70-アル" = "大丈夫よ……！"
"70013030-71-ハルカ" = "は、はい……？"
"70013030-72-アル" = "心配ないわ！あなたを苦しめてた連中は私が懲らしめたから！"
"70013030-73-アル" = "マフィアたちも、おとなしくなるはずよ。"
"70013030-74-ハルカ" = "ど、どうやって……。"
"70013030-75-ムツキ" = "くふふっ、とっ捕まえて恥ずかし～写真を撮ってやったんだー！"
"70013030-76-カヨコ" = "誓約書まで書かせたから、安心して。"
"70013030-77-ムツキ" = "ほら！あんたも出てきて謝りなさーい！"
"70013030-78-いじめグループのリーダー" = "く、ううっ……！"
"70013030-79-いじめグループのリーダー" = "す、すみませんでした！二度とハルカ様の前に現れません！！"
"70013030-80-いじめグループのリーダー" = "こ、これからは深く反省しながら生きていきます……！！"
"70013030-81-ハルカ" = "あ……ああっ……。"
"70013030-82-アル" = "ふふふっ、どう？私たちの実力は。"
"70013030-83-ハルカ" = "こ、こんなことをタダでしていただけるはずは……。"
"70013030-84-ハルカ" = "わ、私は皆さんに何をしたらよろしいでしょうか！？"
"70013030-85-ハルカ" = "お、お金ですか？で、でも今は……！"
"70013030-86-アル" = "報酬なんていらないわ。そんなの、ハードボイルドじゃないでしょう？"
"70013030-87-ハルカ" = "ハード……ボイルド？"
"70013030-88-アル" = "そう。一日一悪！冷酷無比！ハードボイルドなアウトロー！これがうちのモットーよ。"
"70013030-89-アル" = "あなたを助けたのも、その一環ってこと。報酬のためではないの。"
"70013030-90-アル" = "だから……立ちなさい。"
"70013030-91-アル" = "あなたはもう、自由なのよ！"
"70013030-92-ハルカ" = "……！！"
"70013030-93-ハルカ" = "あの時はただ……助けてもらうだけでした。"
"70013030-94-ハルカ" = "だからアル様に私の全てを捧げようと決めたのに……。"
"70013030-95-ハルカ" = "アル様のためなら……何でもすると誓ったのに……。"
"70013030-96-ムツキ" = "そうそう！だから今でしょ～！"
"70013030-97-ムツキ" = "何としてでも！二人でアルちゃんとカヨコちゃんを助けようよ！"
"70013030-98-ハルカ" = "……。"
"70013030-99-ハルカ" = "……そうですね。"
"70013030-100-ハルカ" = "私がお助けいたします、アル様。"
"70013030-101-ハルカ" = "あの時、アル様が……私を助けてくださったように……！"
