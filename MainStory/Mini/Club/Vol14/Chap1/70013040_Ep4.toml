[translation]
"70013040-1" = "一人では咲かない雑草（4）"
"70013040-2" = "リガトーニ・ファミリーが占領したホテル正門"
"70013040-3" = "リガトーニ・ファミリーが占領したホテル後門"
"70013040-4" = "近くの他のビルの屋上"
"70013040-5-ムツキ" = "わ～お、警備が超厳重。このまま中に入るのは難しそうかなー？"
"70013040-6-ハルカ" = "どうしましょう？アル様と連絡もできないですし……このままじゃ……！"
"70013040-7-ムツキ" = "くふふっ、大丈夫だよ。ちゃ～んと考えてるから。"
"70013040-8-ムツキ" = "ということでハルカちゃん、まずは着替えようか。"
"70013040-9-ハルカ" = "着替えですか？どの服に……？"
"70013040-10-ムツキ" = "あいつらに近づいてもバレない服！"
"70013040-11" = "しばらくして――"
"70013040-12-ギャングメンバーA" = "は、始めましょうか？け、消しちゃいましょうか！？"
"70013040-13-ギャングメンバーA" = "ううん、ちょっと待って。何か話してるから、聞いてみようよ。"
"70013040-14-ギャングメンバーA" = "……はあ、夜に緊急招集って、何があったんだ？"
"70013040-15-ギャングメンバーB" = "以前ボスにちょっかい出した奴らを捕まえたんだけど、その内何人かに逃げられたんだと。"
"70013040-16-ギャングメンバーA" = "えっ？何人？"
"70013040-17-ギャングメンバーB" = "二人。"
"70013040-18-ギャングメンバーA" = "は？……たった二人のために全員集合したのかよ？"
"70013040-19-ギャングメンバーA" = "いったいどんな奴らなんだ？"
"70013040-20-ギャングメンバーB" = "ボスがあれだけ神経質になってるんだ。もしかしたら七囚人のアケミぐらいヤバいのかもな。"
"70013040-21-ギャングメンバーA" = "おいおい、あんな怪物が他にもいるってことか？"
"70013040-22-ギャングメンバーA" = "構成員がみんな集まったみたいですね……。"
"70013040-23-ギャングメンバーA" = "くふふっ、これは爆弾の使い甲斐がありそう～"
"70013040-24-ギャングメンバーA" = "行こう、ハルカちゃん。"
"70013040-25-ムツキ" = "いやあ～こんな時間にお疲れさま。"
"70013040-26-ハルカ" = "お、お疲れさまです……！"
"70013040-27-ギャングメンバーB" = "ん？お前たちは？"
"70013040-28-ハルカ" = "全員招集されたよね？ちょっと遅れちゃった。"
"70013040-29-ギャングメンバーA" = "初めて見る顔だな……新人か？"
"70013040-30-ハルカ" = "うん。だからよく分からないんだけどー"
"70013040-31-ムツキ" = "すごい集団のボスを捕まえたんでしょ？ちゃんと逃げられないようにしてるのかなぁ？"
"70013040-32-ギャングメンバーA" = "ボスと最上階にいるから、平気だろ？"
"70013040-33-ギャングメンバーA" = "くふふっ、そっか～ありがと！"
"70013040-34-ムツキ" = "お礼にスペシャルなプレゼントをあげるね。"
"70013040-35-ギャングメンバーB" = "ん？何だ突然……。"
"70013040-36-ギャングメンバーC" = "い、入り口で爆発……！？"
"70013040-37-ギャングメンバーD" = "おい！何があった！？"
"70013040-38-ムツキ" = "よーし！バタついてる間に最上階まで行っちゃおー！"
"70013040-39-ハルカ" = "待っていてください、アル様！今、参ります……！"
"70013040-40-ギャングメンバーC" = "ぼ、防犯カメラを確認しろ！侵入者を見つけるんだ……！！"
"70013040-41-ギャングメンバーD" = "ちゅ、中央廊下にいるぞ！急げ！！"
"70013040-42" = "ホテル下層階の中央廊下"
"70013040-43-リガトーニ" = "何！？奴らが侵入してきただと！？"
"70013040-44-リガトーニ" = "絶対にここへは来させるな……！！"
"70013040-45-リガトーニ" = "し、しかし奴ら……チビのくせに異様に強くて……！"
"70013040-46-リガトーニ" = "ぐ、わあああっ……！！"
"70013040-47-リガトーニ" = "バカヤロー！チビ二人に手こずってどうすんだ！？"
"70013040-48-リガトーニ" = "ふふふっ……。"
"70013040-49-アル" = "ボスがその程度だから、部下だってその程度なのよ。"
"70013040-50-アル" = "つまり、[ruby=・   ・   ・]この私[/ruby]の下にいるうちの社員は最高に優秀ってこと。"
"70013040-51-アル" = "私たちを敵に回したのが――"
"70013040-52-アル" = "貴方の、最大のミスよ。"
"70013040-53-リガトーニ" = "ぐっ！捕らわれの身でえらそうに！"
"70013040-54-アル" = "あら？私を撃とうっていうの？"
"70013040-55-アル" = "好きにしなさい。"
"70013040-56-アル" = "けど、これだけは覚えておくのね。"
"70013040-57-アル" = "うちの社員が来たときに、私がケガでもしていたら……それはもう大変なことになるわ。"
"70013040-58-アル" = "よく考えたほうが賢明よ。"
"70013040-59-リガトーニ" = "ぐううっ……！"
"70013040-60-アル" = "社長……大胆だね？"
"70013040-61-アル" = "こ、怖かった……！ホントは怖かったのよ……！！"
"70013040-62-アル" = "（……でも耐えないと）"
"70013040-63-アル" = "（私はうちの社員を信じてるんだから……！）"
"70013040-64" = "ホテル中間階"
"70013040-65" = "ホテル上層部"
"70013040-66-ハルカ" = "ハルカちゃん！大丈夫？"
"70013040-67-ハルカ" = "だ、大丈夫です！ちょっとかすっただけなので！"
"70013040-68-ハルカ" = "それより、早く行きましょう！"
"70013040-69-ハルカ" = "アル様が……私たちを待っているでしょうから……！"
"70013040-70-リガトーニ" = "何ぃ……！？もう近くまで来ているだと！？"
"70013040-71-リガトーニ" = "い、一体どうやって……！！"
"70013040-72-アル" = "あなたは、あの時から何も変わっていないのね。"
"70013040-73-アル" = "いや、むしろ退化したと言うべきかしら。"
"70013040-74-アル" = "それに比べて、私たちは劇的に強くなったわ。"
"70013040-75-アル" = "あなたに苦しめられてたあの弱々しい子が、今では我が便利屋68最強の爆破工作員になったの。"
"70013040-76-アル" = "さっきから聞こえてる爆発音は、全てあの子によるものよ。"
"70013040-77-アル" = "どうかしら？自分の過ちによって追い詰められた気分は？"
"70013040-78-リガトーニ" = "ひいいいっ……！"
"70013040-79-カヨコ" = "社長……結構やるじゃん。"
"70013040-80-アル" = "わ、私もここまでかっこよくきまるとは思わなかったわ……！"
"70013040-81-リガトーニ" = "こ、ここまで来やがったか……！！"
"70013040-82-カヨコ" = "アル様！カヨコ課長……！ただいま参りました！おケガはありませんか？"
"70013040-83-アル" = "ふふふっ、信じてたわよ。"
"70013040-84-カヨコ" = "私たちは大丈夫だから、心配しなくていいよ。"
"70013040-85-ムツキ" = "くふふっ、じゃあ散々困らせてくれたあいつに、たっぷりお仕置きしなきゃね～？"
"70013040-86-リガトーニ" = "…………。"
"70013040-87-リガトーニ" = "ふ、ふふふ……。"
"70013040-88-リガトーニ" = "ふはははは……！"
"70013040-89-リガトーニ" = "愚かな奴らめ！誰にお仕置きだと？"
"70013040-90-リガトーニ" = "お仕置きされるのは、お前たちの方だ！"
"70013040-91-リガトーニ" = "傭兵たちよ！出番だぞ……！！"
"70013040-92-カヨコ" = "な、何よ？隠れてたの！？"
"70013040-93-カヨコ" = "包囲された……！ムツキ！ハルカ！気を付けて！"
"70013040-94-PMC兵士" = "くはははは、お遊びもここまでだ！"
"70013040-95-リガトーニ" = "撃て……！！"
"70013040-96-PMC兵士" = "全弾発射。制圧完了です。"
"70013040-97-リガトーニ" = "ふふふ……ふははは！！"
"70013040-98-リガトーニ" = "これだけ弾丸を食らわせたら、無事ではいられまい。"
"70013040-99-リガトーニ" = "便利屋の社長！次はお前だ……！"
"70013040-100-アル" = "…………。"
"70013040-101-アル" = "…………まだよ。あっちを見てみなさい。"
"70013040-102-ハルカ" = "…………。"
"70013040-103-ハルカ" = "何ぃ！？"
"70013040-104-ムツキ" = "ゴホッ、ゴホゴホッ！"
"70013040-105-ムツキ" = "うう……助けてくれてありがとう。やっぱりハルカちゃんのタフさにはかなわないね～"
"70013040-106-リガトーニ" = "ど、どうなってる？あれほどの火力に耐えるなんて……。"
"70013040-107-リガトーニ" = "なんだ……お、お前はいったい何なんだ……！？"
"70013040-108-ハルカ" = "私は……雑草……。"
"70013040-109-ハルカ" = "踏まれても踏まれても死なない……雑草です。"
"70013040-110-ハルカ" = "……。"
"70013040-111-ハルカ" = "全部、消します。"
"70013040-112-ハルカ" = "アル様を…そしてカヨコ課長を人質に取り……。"
"70013040-113-ハルカ" = "ムツキ室長まで私の目の前で傷つけようとするなんて……。"
"70013040-114-ハルカ" = "許さない……。"
"70013040-115-ハルカ" = "許さない許さない許さない許さない許さない許さない許さない……！"
"70013040-116-ハルカ" = "許さない……！"
"70013040-117-リガトーニ" = "ひ、ひいいいっ！？"
"70013040-118-リガトーニ" = "た、助けてくれ……！に、二度とお前たちの前に現れないから……！！"
"70013040-119-リガトーニ" = "お、お願いだ！こ、このとおり……！！"
"70013040-120-ハルカ" = "……。"
"70013040-121-ハルカ" = "……アル様、どうしましょう？"
"70013040-122-ハルカ" = "ふっ、解放してあげなさい。"
"70013040-123-アル" = "評判が地に落ちたあいつらには、生きているほうが厳しい罰になるわ。"
"70013040-124-アル" = "ふふ、どん底を這いずりながら思い出すことね。"
"70013040-125-アル" = "冷酷無比で真のハードボイルドなアウトローは、誰なのかを！"
"70013040-126-リガトーニ" = "ひ、ひいいいっ！？"
"70013040-127-ハルカ" = "……えへへ。さすがアル様、かっこいいです。"
"70013040-128-ハルカ" = "お前……アル様のおかげで命拾いしましたね。"
"70013040-129-リガトーニ" = "ぐ、ぐはっ……！！"
"70013040-130-カヨコ" = "アルちゃんとカヨコちゃん、大丈夫なの？"
"70013040-131-アル" = "ええ、私たちは大丈夫よ。"
"70013040-132-カヨコ" = "社長の悪党ぶり、二人にも見せたかったね。"
"70013040-133-アル" = "ふふっ、私のハードボイルドな姿はこれからもずっと見られるわよ。"
"70013040-134-ハルカ" = "えへへ……良かった……です……。"
"70013040-135-アル" = "は、ハルカ……！"
"70013040-136-ムツキ" = "ハルカちゃん……！"
"70013040-137-アル" = "うぅ……。"
"70013040-138-カヨコ" = "……。"
"70013040-139-カヨコ" = "……大丈夫。ちょっと疲れただけみたい。"
"70013040-140-アル" = "……。"
"70013040-141-アル" = "……ありがとう、ハルカ。今回はあなたに大きな借りができたわね。"
"70013040-142-ハルカ" = "と、とんでもないです……。私を助けてくださったのはアル様ですから……。"
"70013040-143-ハルカ" = "まだまだ……ご恩に報いることはできていません……。"
"70013040-144-アル" = "ううん、恩返しならもう十分にしてもらったわ。だからこれからは、そんなこと思わなくていいのよ。"
"70013040-145-ハルカ" = "アル様……ありがとうございます。"
"70013040-146-ハルカ" = "あ、あのー、ハルカちゃん……。"
"70013040-147-ムツキ" = "さっき自分のこと「雑草」って言ってたけど……まさか、まだそう思ってたの？"
"70013040-148-ムツキ" = "前に私が……「雑草ちゃん」って呼んだせいで……？"
"70013040-149-ハルカ" = "……。"
"70013040-150-ハルカ" = "そ、そうじゃないです……。"
"70013040-151-ハルカ" = "私が、このあだ名を気に入ってるだけで……。"
"70013040-152-ムツキ" = "は、ハルカちゃ～ん……！"
"70013040-153" = "その後、到着したヴァルキューレによってリガトーニは逮捕された。"
"70013040-154" = "便利屋68にとって、本当に忘れられない夜となった。"
