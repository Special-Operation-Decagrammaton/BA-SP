[translation]
"70017010-1" = "第1話;183 vs 227"
"70017010-4-ラナ" = "おつかい完了。確認作業、開始。"
"70017010-8-ラナ" = "エリナのおつかいから。#n「スーパーでじゃがいもを3キロ買う。#nもし芽が出てるものがあったら、重いからその場で捨てていいよ～」"
"70017010-9-ラナ" = "「じゃがいも3キロ購入。うち2つに芽が出てたため、スーパーのゴミ箱に全数破棄」#nチェック。"
"70017010-10-ラナ" = "次はアンナのおつかい。「金物屋で、+5ミリ-8ミリのドライバーを買ってきてちょうだい」。"
"70017010-11-ラナ" = "「[ruby=・]-3[/ruby][ruby=・]ミ[/ruby][ruby=・]リ[/ruby]ドライバーを1個購入」チェック。"
"70017010-12-ラナ" = "最後に私の。「パンチカードに書き込む用の適当な色鉛筆」。"
"70017010-13-ラナ" = "「厚紙でも書きやすい硬質油性RIS S 6006の色鉛筆、#n5R 4/14のカーマインレッド、3.0ミリ芯の色鉛筆12本購入」チェック。"
"70017010-17-ラナ" = "今回のおつかいもエラーなし。満足。"
"70017010-18-ラナ" = "それに、荷物が軽くて楽。"
"70017010-19-ラナ" = "ですが……。"
"70017010-23-ラナ" = "うーん……。"
"70017010-27-ラナ" = "ここは……どこでしょう？"
"70017010-33" = "227号特別クラス"
"70017010-39-ラナ" = "ふぅ……ひどい吹雪でしたね。助けてくださり、ありがとうございます。"
"70017010-40-ラナ" = "ご心配には及びません。迷子には慣れていますので。"
"70017010-41-ラナ" = "11歳の頃と比べると、頻度は約10%減少しました。良い傾向です。"
"70017010-42-ラナ" = "自己紹介を忘れていました。私は[ruby=ふるはた]古畑[/ruby]ラナ、12歳です。#nおつかいの達人で、趣味は編み物と岩登りです。 "
"70017010-44-シグレ" = "迷子って、泣いたり不安がったりするものだと思うんだけど……#nこの子は結構しっかりしてるね。"
"70017010-45-ノドカ" = "吹雪になる前にシグレちゃんが見つけてくれて、本当によかったよ……。"
"70017010-46-シグレ" = "雪の中で立ったまま動かないからびっくりした。大丈夫？"
"70017010-48-ラナ" = "経路探索に失敗し、Idle状態で待機していました。"
"70017010-49-ラナ" = "ラムネ色の旅人さんにインタラプトしていただかなかったら、#n今頃遭難していたことでしょう。感謝します。"
"70017010-51-ノドカ" = "イ、インタラプト……？"
"70017010-52-シグレ" = "あはは、面白いこと言うね。"
"70017010-53-ノドカ" = "それで……ラナちゃん、おうちはどこ？"
"70017010-55-ラナ" = "ふむ……。"
"70017010-62-ラナ" = "（183号は、特別クラス。だから、厳密にいうと家ではない）"
"70017010-63-ラナ" = "（あそこは、大好きな友達と住んでいる場所。#nつまり、愛着のある集団と構造物にすぎない）"
"70017010-69-ラナ" = "[ruby=・]お[/ruby][ruby=・]う[/ruby][ruby=・]ち[/ruby]は……ありません。"
"70017010-74-シグレ" = "……！"
"70017010-75-ノドカ" = "おうちがない！？そんな……まだ、子供なのに……。"
"70017010-76-ノドカ" = "事務局は何をしてるの！？"
"70017010-78-ラナ" = "事務局の決定でこうなったのです。とはいえ、特に支障はありません。"
"70017010-80-ノドカ" = "あの無責任なチビ！なんてことを！"
"70017010-81-シグレ" = "でもそれなら、普段はどこに住んでるの？"
"70017010-83-ラナ" = "身を寄せる場所はあります。私は、そこへ帰るつもりでした。"
"70017010-84-ラナ" = "自治区の西側に位置する山の……5番目に高いシラカバの横道を行くと、#n中腹に3人で暮らしている私たちの住処があります。"
"70017010-86-シグレ" = "よかった、住む場所はあるんだね……。"
"70017010-87-シグレ" = "大吹雪が止んだら、送っていくよ。"
"70017010-91-シグレ" = "あっ、私たちの紹介がまだだった。この子はノドカで、私はシグレ。よろしく。"
"70017010-93-ノドカ" = "ラナちゃん、毛布いる？あったかいココアもあるよ！#n欲しいものがあったら、いつでも言っていいからね！"
"70017010-95-ラナ" = "ご親切に、ありがとうございます。"
"70017010-99-ラナ" = "このような事態に備えて作った、友達づくり用のチェックリストが役に立ちそうです。"
"70017010-100-ラナ" = "その1……自己紹介、チェック。次は「スモールトーク」ですね。"
"70017010-101-ラナ" = "えっと……ここは、どういった場所なのでしょうか？"
"70017010-106-ラナ" = "今、私が身を寄せている場所と似ています。#n……こういった軽い質問から会話を始めると良いそうです。"
"70017010-107-ラナ" = "とても古風で、何故だか落ち着きます。"
"70017010-112-シグレ" = "ああ、言い忘れてたね。私たちは22――"
"70017010-113-ノドカ" = "！！"
"70017010-120-シグレ" = "いたっ！なに！？"
"70017010-121-ラナ" = "？"
"70017010-122-ノドカ" = "あ、あははー！ごめーん、シグレちゃん！間違えて踏んじゃったー！"
"70017010-123-ノドカ" = "早く汚れを落としに行かないと！"
"70017010-124-ノドカ" = "ラナちゃん、ちょっとそこで待っててね！"
"70017010-125-シグレ" = "ちょっ……ノドカ！？"
"70017010-126-ノドカ" = "いいから、ちょっと来て！"
"70017010-136-シグレ" = "急にどうしたの？"
"70017010-137-ノドカ" = "シグレちゃん……小学生相手に、特別クラスのことなんて話しちゃダメだよ！"
"70017010-138-シグレ" = "え、ええっ……？"
"70017010-139-ノドカ" = "そんなことしたら、「特別クラスって何？」って聞かれちゃうでしょ！"
"70017010-140-ノドカ" = "進級したら、罰を受けた人はこんなところに送られるなんて……。"
"70017010-141-ノドカ" = "子供たちにそんな現実を見せるわけにはいかないよ。"
"70017010-142-シグレ" = "たしかに、事実をそのまま伝えるのは良くないかもしれないね。"
"70017010-143-ノドカ" = "でしょう？子供たちには未来は明るいって希望を持たせてあげないと。"
"70017010-144-シグレ" = "分かった。「特別クラス」は今から禁止ワードだね。"
"70017010-145-ノドカ" = "そう！おくちチャックだよ！"
"70017010-146-シグレ" = "うん、おくちチャック。"
"70017010-152-ノドカ" = "ラナちゃん、お待たせー！なかなか汚れがとれなくて、ごめんね～"
"70017010-153-シグレ" = "あ、あはは……。"
"70017010-155-ラナ" = "お二人はとても仲が良さそうですね。"
"70017010-156-ラナ" = "お戻りになったので、スリープモードを解除します。質問の回答をお聞かせください。"
"70017010-157-ラナ" = "ここはどのような場所なのでしょうか？"
"70017010-159-シグレ" = "えーっと……そ、そうだな……うーん……。"
"70017010-160-ノドカ" = "りょ、寮！そう！ここは寮なの！"
"70017010-161-ノドカ" = "私たちが2人で住んでるところ！"
"70017010-163-ラナ" = "……。"
"70017010-165-シグレ" = "（間違ってはないけど、そんなすぐバレる嘘……）"
"70017010-170-ラナ" = "こんなに広いところにお2人で、ですか。ご立派です。"
"70017010-171-ラナ" = "壊れていない窓を探すほうが難しいのは、私のところと同じですが……#nそういったところも親しみを感じます。"
"70017010-176-ノドカ" = "（疑ってなさそう……！）"
"70017010-177-シグレ" = "ふぅ……。"
"70017010-179-ラナ" = "次に、最近はいかがお過ごしでしょうか。#nちなみにこれは、スモールトークのテーマランキング第2位です。"
"70017010-180-ラナ" = "日常会話をすることで、親睦を深めようと思います。"
"70017010-181-ラナ" = "例えば、直近のことを思い出してみるのも良いそうです。"
"70017010-182-ラナ" = "昨日はどんなことがありましたか？"
"70017010-183-シグレ" = "うーん、昨日ねぇ……。"
"70017010-184-シグレ" = "いつも通りかな。熊がドアを壊して入ってきたから、#n震えながらなんとかドアを直して……眠りについた。"
"70017010-185-ラナ" = "ふむ。ここにもお腹を空かせた熊が来るのですね。"
"70017010-187-ノドカ" = "あとは……食べるものがなくなっちゃったから、#nさっきシグレちゃんがおつかいに行ってくれたよ。"
"70017010-189-ラナ" = "私の仕事と同じですね。食べるものがないのも、そっくりです。"
"70017010-190-シグレ" = "ごめんね、ノドカの好きなプリンは買えなかったよ……。"
"70017010-192-ノドカ" = "気にしないで、シグレちゃん！最近はスイーツを手に入れるだけでも大変だし！"
"70017010-193-ラナ" = "おまけに……甘いものも足りていない、と。"
"70017010-197-ラナ" = "ふむ……。"
"70017010-220-ラナ" = "どうも他人事とは思えません。"
"70017010-221-ラナ" = "とても親近感を覚えます。"
"70017010-223-シグレ" = "……それっていいことなのかな？"
"70017010-224-ノドカ" = "そういえば……ラナちゃんとこの人たちは、なにをしてるの？"
"70017010-228-ラナ" = "私の友達のことでしょうか？"
"70017010-229-ラナ" = "推測で話をするのもよくないですが……。"
"70017010-234-エリナ" = "ここにもいない！！"
"70017010-235-エリナ" = "おーい、ラナー？どこ～？"
"70017010-240-アンナ" = "その棚はもう見たわよ！どこいったのかしら……タオルの山に埋もれて寝てると思ったんだけど……。"
"70017010-241-アンナ" = "冷蔵庫は？野菜室も全部見た？#nほら、この前は暑いとか言って冷蔵庫に入ってたじゃん！"
"70017010-242-エリナ" = "見たってば！冷蔵庫はすっからかんなんだから、見落とすわけがないでしょ！"
"70017010-243-アンナ" = "本当だったら……もうとっくに帰ってきて、お昼寝しててもおかしくないんだけど……。"
"70017010-247-エリナ" = "もしかして、迷子になってるとか……？"
"70017010-248-エリナ" = "こんな大吹雪だし……。"
"70017010-254-エリナ" = "いやいや、どっかで昼寝してるだけでしょ。"
"70017010-255-アンナ" = "そ、そうね……#n最近は、どこかに入って昼寝をしていることが多いから……！"
"70017010-256-アンナ" = "……う、ううう～！ラナー！！どーこー！！"
"70017010-257-エリナ" = "名前なんて呼んでも意味ないって！あの子、一度寝たら絶対に起きないし！"
"70017010-258-アンナ" = "うえ～ん！何もしないよりマシでしょ！ラナー！"
"70017010-259-エリナ" = "……もう！ラナー！おやつの時間だよー！出ておいでー！"
"70017010-260-エリナ" = "こうなったら、屋根裏部屋も探すしか！"
"70017010-263-ラナ" = "そうですね。"
"70017010-264-ラナ" = "今頃……私を探して、扉がついている家具を片っ端から開けていると思います。"
"70017010-265-ノドカ" = "どういうこと！？"
"70017010-266-ノドカ" = "猫探しじゃあるまいし！"
"70017010-267-ラナ" = "断言はできませんが……#nこれまでのパターンを考えると、遠からずといったところでしょう。"
"70017010-268-シグレ" = "今現在、何をしてるのか聞いたわけじゃないんだけど……#nとりあえず、みんな仲が良いことは分かったよ……。"
"70017010-269-ラナ" = "そうですね。少し騒がしいですが、毎日楽しく過ごしています。"
"70017010-270-ラナ" = "……。"
"70017010-271-ラナ" = "あの、「欲しいものがあったら、いつでも言って」というのはまだ有効でしょうか。"
"70017010-272-シグレ" = "うん、まだ大丈夫だよ。どうかしたの？"
"70017010-273-ラナ" = "ルーティンの時間になりましたので、少し横になろうと思います。"
"70017010-274-ラナ" = "よろしければ、お昼寝のために毛布をお借りしてもよろしいでしょうか。"
"70017010-279-ノドカ" = "もちろん！お昼寝してるうちに、吹雪もやむと思うよ！"
"70017010-281-シグレ" = "はい、毛布。私とノドカが普段使ってるやつだから、ちょっとボロボロだけど……。"
"70017010-282-ラナ" = "ありがとうございます。#nむしろ……少しくたびれているほうが落ち着くので、大丈夫です。"
"70017010-283-ラナ" = "あと、寝かしつけもお願いしたいです。こちらも、眠る際の必須条件なので。"
"70017010-284-シグレ" = "寝かしつけ？分かった！"
"70017010-286-ノドカ" = "か、かわいい～！任せて！子守唄とかでいい？"
"70017010-287-ノドカ" = "ねーむれー、ねーむれー♪"
"70017010-289-シグレ" = "ふふっ。ねーむれー、ねーむれー♪"
"70017010-290-ラナ" = "ちょうど良いリズムです。お二人とも、寝かしつけの才能がありますね。"
"70017010-291-ラナ" = "では、おや……すみ……。"
"70017010-292-ラナ" = "……なさ……い。"
"70017010-296-ラナ" = "すぅ……すぅ……。"
"70017010-301-ノドカ" = "よしよし。子供はたくさん寝て、たくさん成長するんだよ。"
"70017010-302-シグレ" = "ふふっ、ずいぶん疲れてたみたいだね。"
"70017010-303-シグレ" = "すぐに寝ちゃった。"
"70017010-304-ノドカ" = "こんな小さな子が、どうして大変な思いをしてるんだろうね……。"
"70017010-305-ノドカ" = "特別クラスの私たちは仕方がないかもしれないけど……#nそうじゃない子が、同じような生活をしてるなんて…… 。"
"70017010-306-シグレ" = "泣かないで、ラナが起きちゃうよ。"
"70017010-307-ノドカ" = "ぐすん。ご、ごめん……。"
"70017010-308-シグレ" = "私たちは特別クラスだから、こんなにつらいんだと思ってたけど……#nどこも同じような状況なのかも。"
"70017010-309-シグレ" = "そうだね。私たちも頑張ろう。#n特別クラスじゃないラナがこんなに頑張ってるんだから、私たちもくよくよしてられないよ。"
"70017010-310-ノドカ" = "うん……！"
"70017010-314" = "183号特別クラス前"
"70017010-318-ラナ" = "あれが私の住処です。"
"70017010-324-アンナ" = "うわあーん！！ラナぁぁぁー！！"
"70017010-325-エリナ" = "会いたかったよぉぉぉー！"
"70017010-330-ラナ" = "どうしたんでしょう？2人とも急いでいるようです。"
"70017010-331-シグレ" = "ふふっ、ラナが心配だったんだよ。"
"70017010-335-アンナ" = "お二方、はじめまして！このたびは、ラナをありがとうございます……！"
"70017010-336-アンナ" = "どこにいるのか見当もつかず、心配で心配で……！"
"70017010-337-エリナ" = "てっきり、誘拐されたのかと……ほんとーに、よかったぁ……！"
"70017010-342-ノドカ" = "え！？まさか、以前そんなことが！？"
"70017010-344-エリナ" = "いや、そういうわけじゃないんですけど……可能性としてはあり得るよなって。#n心配になって……。"
"70017010-351-ラナ" = "ほっぺ、引っ張らないで。伸びる。"
"70017010-355-ラナ" = "これ、おつかいしてきたよ。はい、アンナに頼まれたドライバー。"
"70017010-360-アンナ" = "えっと……3ミリのマイナスドライバー、だけ？#n5ミリのプラスドライバーと､8ミリのマイナスドライバーが欲しかったんだけど……?"
"70017010-361-ラナ" = "書いてある通りに買ってきた。「+5ミリ-8ミリのドライバー」だよね。"
"70017010-367-アンナ" = "……。"
"70017010-368-アンナ" = "……うん……ありが……とう。"
"70017010-369-エリナ" = "夜ごはんのじゃがいもは？どこかに落としてきちゃった？"
"70017010-370-エリナ" = "……まぁいっか。ラナの無事より大事なことなんてないし。"
"70017010-372-ラナ" = "3キロ買ったけど、#n「芽が出てるのがあったら捨てる」って書いてあったから、全部捨ててきた。"
"70017010-374-エリナ" = "……。"
"70017010-375-エリナ" = "ラナの無事より……大事、な……こと……なんて……。"
"70017010-377-シグレ" = "感動的な再会だね。"
"70017010-382-アンナ" = "あっ、自己紹介が遅れました……！私はアンナ。この子はエリナっていいます！"
"70017010-384-シグレ" = "はじめまして。私はシグレ。この子はノドカだよ。"
"70017010-386-エリナ" = "はじめましてー！私たちは183号特――"
"70017010-387-アンナ" = "！！"
"70017010-392-エリナ" = "いったぁ～！！"
"70017010-393-エリナ" = "ちょっとぉ！なんで踏むの！！"
"70017010-394-アンナ" = "しーーーっ！！"
"70017010-395-アンナ" = "特別クラスにいるってバレたら恥ずかしいでしょ！？"
"70017010-396-エリナ" = "た、たしかに……！無自覚だったわ。りょーかい！"
"70017010-403-エリナ" = "えっと、その……。"
"70017010-404-エリナ" = "研究？部活？まあ、そんなところですかね？あはは……。"
"70017010-405-アンナ" = "はは、あはは……！！"
"70017010-407-シグレ" = "研究部なんだ、すごいね！"
"70017010-408-ノドカ" = "（研究部って、重要な部活じゃなかったっけ？#nそれが、私たちみたいな劣悪な環境で……）"
"70017010-409-ノドカ" = "（みんな、早く環境がよくなるといいな……）"
"70017010-415-シグレ" = "……もうこんな時間。また吹雪が来そうだから、そろそろ帰らないと。"
"70017010-416-シグレ" = "ラナ。お友達の言うことをちゃんと聞いて、仲良くするんだよ。"
"70017010-417-ノドカ" = "じゃあね、ラナちゃん！お二人もまた会いましょう！"
"70017010-419-アンナ" = "シグレさん、ノドカさんも……お気をつけて！"
"70017010-421-ラナ" = "迷子にならないよう、気をつけてください。"
"70017010-423-エリナ" = "それ、ラナが言っちゃダメなやつじゃない？"
"70017010-431-エリナ" = "それにしても……すごいね、ラナ！新しい友達ができたじゃん！"
"70017010-433-ラナ" = "友達？"
"70017010-434-ラナ" = "お互い自己紹介して、あったかいココアを飲みながらお話しして……#n一緒にお昼寝して、また会おうって約束しただけ。"
"70017010-435-アンナ" = "ふふっ。それは友達って言ってもいいんじゃない？"
"70017010-436-アンナ" = "それで、どうだったの？特別クラスの外の人たちは？"
"70017010-438-エリナ" = "いいな～！最近の流行スイーツとか、ファッションの話をしたんでしょ！"
"70017010-440-アンナ" = "寮は？私が新しい施工法を提案しておいたし、なかなか快適だったんじゃない？"
"70017010-444-ラナ" = "……。"
"70017010-445-ラナ" = "私たちと同じ。廃墟みたいなところに住んで、熊と戦って……寒さと飢えに震えてた。"
"70017010-446-アンナ" = "……え？"
"70017010-447-ラナ" = "スイーツも食べられないし、毛布も1枚しかない。"
