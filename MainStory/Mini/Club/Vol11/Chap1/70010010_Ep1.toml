[translation]
"70010010-1" = "手動期の終り（１）"
"70010010-2" = "ミレニアムエキスポコンピューター工学館"
"70010010-3-演算科学研究部長" = "これより、デモンストレーションを始めます！"
"70010010-4-演算科学研究部長" = "開始に先立ち、特別にお越しいただいたレッドウィンター事務局の皆様から、お言葉を頂戴します。"
"70010010-5-チェリノ" = "うむ。おいらに相応しい歓待、ご苦労だった。"
"70010010-6-チェリノ" = "私は……レッドウィンター連邦学園の生徒会長であり、環境美化部部長兼、書記長兼、掃除部部長兼、運動部代表兼、[ruby=・   ・   ・   ・]生徒会長[/ruby]兼、風紀委員長兼、給食部長兼――"
"70010010-7-チェリノ" = "そして今月の最優秀プリン試食家兼、レッドウィンター科学アカデミーの議長であるチェリノ様だ！"
"70010010-8-チェリノ" = "最先端をゆくレッドウィンター連邦学園の科学技術に更なる進歩をもたらすべく、ミレニアム[ruby=エキスポ]EXPO[/ruby]に足を運んだのだ。期待しているぞ。"
"70010010-9-演算科学研究部長" = "……チェリノ会長、ありがとうございました。それではさっそくご紹介します！#nミレニアムの力作……スーパーコンピューター「SEN9000」です！"
"70010010-10-チェリノ" = "ん？これがスーパーコンピューター？#nモニターもキーボードも無いじゃないか。"
"70010010-11-チェリノ" = "それは、私が画像と音声を用いて、情報の入出力を行うからです！"
"70010010-12-SEN9000" = "はじめまして！#nレッドウィンター連邦学園の生徒会長であり、環境美化部部長兼、書記長兼、掃除部部長兼、運動部代表兼、[ruby=・   ・   ・   ・]生徒会長[/ruby]兼、風紀委員長兼、給食部長兼――"
"70010010-13-SEN9000" = "そして今月の最優秀プリン試食家兼、レッドウィンター科学アカデミーの議長であるチェリノ様！ミレニアムサイエンススクールへようこそ！"
"70010010-14-チェリノ" = "こ、これはどういうことだ！？いきなり話しかけてきたぞ！？"
"70010010-15-チェリノ" = "しかも、おいらの肩書きを全部覚えたのか！？たった一度聞いただけなのに！？"
"70010010-16-マリナ" = "（会長の[ruby=・   ・   ・   ・   ・]言い間違い[/ruby]まで模倣していた……）"
"70010010-17-マリナ" = "（それができるのは私だけだと思っていたのに！）"
"70010010-18-演算科学研究部長" = "ふふっ、私が言う間もなくSEN9000が答えてしまいましたね。"
"70010010-19-演算科学研究部長" = "このSEN9000は対話型モデルを搭載しています。そのため、文字入力なしで言葉を理解し、命令に応えることができるんです。例えば、こんな風に――"
"70010010-20-演算科学研究部長" = "SEN9000、得意分野を教えてくれる？"
"70010010-21-演算科学研究部長" = "はい！私は数学の演算と、質問に対して正確に回答するのが得意です！"
"70010010-22-演算科学研究部長" = "じゃあ、数学からやってみよう。この問題を解いてくれるかな？"
"70010010-23-トモエ" = "あれは……数学なのか？数字はほとんど無いが……。"
"70010010-24-トモエ" = "それに手書きですね。あれを理解できるのでしょうか？"
"70010010-25-SEN9000" = "……。"
"70010010-26-チェリノ" = "ふんっ、答えられるはずがない。"
"70010010-27-チェリノ" = "我がレッドウィンター連邦学園に存在しない技術が、他校にあるわけ――"
"70010010-28-チェリノ" = "……すみません！私としたことが！#nミュートになっていると気づかず、一人でしゃべっちゃってました！"
"70010010-29-SEN9000" = "それにしても、デモンストレーションだからって、こんな簡単な問題出さなくてもいいんですよ？答えは42です！"
"70010010-30-演算科学研究部長" = "正解！#n言語モデルの学習能力もあるので、最近は冗談も言えるようになったんです。"
"70010010-31-演算科学研究部長" = "次は質問に答えてもらいましょう。#nせっかくですし会長、何か質問してみませんか？"
"70010010-32-チェリノ" = "お、おいらか！？"
"70010010-33-チェリノ" = "そうだな……レッドウィンター連邦学園内にあるおいらの銅像は、全部で何個だ？"
"70010010-34-チェリノ" = "ふっふっふ。どうだ？さすがに答えられないだろう！"
"70010010-35-SEN9000" = "合計199個で、さらに1個、来月上旬に公開される予定です。"
"70010010-36-SEN9000" = "この情報は公式SNSおよび電子版「レッドベア」、#n報道発表資料を参照したため、誤差が含まれている可能性があります。"
"70010010-37-SEN9000" = "なお統計上、翌週には10個以上の銅像が破壊されることでしょう。"
"70010010-38-SEN9000" = "お役に立ちましたか？"
"70010010-39-トモエ" = "迷わず答えた、だと……？"
"70010010-40-トモエ" = "情報も……正確、ですね……。"
"70010010-41-演算科学研究部長" = "これらの他にも様々な機能があります。#n次はこちら――"
"70010010-42-チェリノ" = "うぅ……。"
"70010010-43-演算科学研究部長" = "これをもちまして、デモンストレーションを終了させていただきます！"
"70010010-44-観客B" = "すごかったね！なんでもできちゃうんじゃない！？"
"70010010-45-観客B" = "これがミレニアムの技術力……想像以上だよ……。"
"70010010-46-演算科学研究部長" = "そしてレッドウィンター連邦学園の皆様！#n改めて、本日はお越しいただきありがとうございました！"
"70010010-47-チェリノ" = "う、うぅ……。"
"70010010-48-チェリノ" = "く、くだらん！！"
"70010010-49-チェリノ" = "なかなか面白いものを見せてもらった！#nだが！そ、そんなもの、偉大なるレッドウィンター連邦学園にも存在する！"
"70010010-50-チェリノ" = "しかも、もっと大きくて温かいんだぞ！"
"70010010-51-マリナ" = "（会長、それはコンピューターの自慢にはなりません……）"
"70010010-52-演算科学研究部長" = "なんと！#nレッドウィンターもスーパーコンピューターを運用していたんですね……！"
"70010010-53-演算科学研究部長" = "不勉強ですみません……コンピューター研究学会ではお見かけしたことがなかったので……。"
"70010010-54-チェリノ" = "そ、それは性能が良すぎて、ずっと秘匿していたからだ！"
"70010010-55-チェリノ" = "しかし今日の発表をみるに、ミレニアムの技術はようやく我々に追いついてきたようだからな。これなら教えてやっても問題ないだろう！"
"70010010-56-演算科学研究部長" = "ほ、本当ですか！？"
"70010010-57-チェリノ" = "今度、レッドウィンター連邦学園に招待しようじゃないか。#n我々の技術力を見せてやる！"
"70010010-58-演算科学研究部長" = "では、来週の月曜日に行きますね！"
"70010010-59-チェリノ" = "……え？"
"70010010-60-演算科学研究部長" = "ちょうど、近くまで行く用事がありますので！"
"70010010-61-演算科学研究部長" = "ベールに包まれた、レッドウィンターの最先端技術……！#nそれを見せていただけるなんて本当に光栄です！当日はよろしくお願いします！"
"70010010-62-チェリノ" = "あ、ああ！来週の月曜日だな！"
"70010010-63-チェリノ" = "レッドウィンター連邦学園の偉大さを、その目に焼きつけるといい！！"
"70010010-64-チェリノ" = "どうしよう……？"
"70010010-65-チェリノ" = "来週の月曜って……スーパーコンピューターなんて無いぞ……。"
"70010010-66-マリナ" = "訪問時期に合わせて、不穏分子のクーデターを誘導するのはいかがでしょう？"
"70010010-67-チェリノ" = "良い案だが……この前はクーデターが成功しすぎて、復権までが面倒だった。しばらくは嫌だな。"
"70010010-68-チェリノ" = "うーん……よく探せば1つくらい、誰かが持ってたりしないか……？#nそれとも、いっそ作らせるとか――"
"70010010-69-トモエ" = "チェリノ会長、183号特別クラスに依頼していた制作見積書が届きました。"
"70010010-70-トモエ" = "技術の理論研究および、コンピューターの設計まで完了したとのことです。"
"70010010-71-チェリノ" = "本当か！？でかしたぞ、トモエ！"
"70010010-72-チェリノ" = "今すぐ制作に取り掛からせろ！#n事務局の権限で、あらゆる資材と労働力を総動員しよう！"
"70010010-73-トモエ" = "それで、見積書の内訳ですが……#nレッドウィンター連邦学園の電子工学技術を踏まえると――"
"70010010-74-トモエ" = "真空管を1600億本。"
"70010010-75-トモエ" = "電力供給用の発電所を27カ所。"
"70010010-76-トモエ" = "常駐スタッフの居住用に新都市を3つ用意する必要があります。#nそして……。"
"70010010-77-チェリノ" = "……ん？"
"70010010-78-トモエ" = "施設用地を確保するために、山8つを崩さなければなりません。"
"70010010-79-チェリノ" = "えぇ……。"
"70010010-80-トモエ" = "1日16時間の週7日労働、交代勤務により全労働力を投入した場合――"
"70010010-81-トモエ" = "完成まで約6世紀かかる見込みです。"
"70010010-82-チェリノ" = "……。"
"70010010-83-トモエ" = "取り掛かりますか？"
"70010010-84-チェリノ" = "ミレニアムが来るのは来週だぞ！？間に合わないではないか！！！"
"70010010-85-チェリノ" = "はっ……はくしょん！"
"70010010-86-マリナ" = "（緊張で喉が渇いたな……お茶を一杯もらおう……)"
"70010010-87-マリナ" = "（それにしても……トモエ秘書室長、大変そうだ……保安委員会が絡んでなくてよか――）"
"70010010-88-マリナ" = "（……！？お茶が変なところに……！むせてしまう……！）"
"70010010-89-マリナ" = "く、くふっ！"
"70010010-90-トモエ" = "……マリナ、何がおかしい？"
"70010010-91-チェリノ" = "おいらが困っているのはそんなに面白いか？"
"70010010-92-マリナ" = "ち、違います！く、くはっ、そんなことは……！"
"70010010-93-チェリノ" = "それなら……ヒゲが取れたおいらを見下しているのか？"
"70010010-94-マリナ" = "そ、そうではなくて、お、ちゃ――"
"70010010-95-チェリノ" = "茶番？この状況を茶番だと言いたいのか？"
"70010010-96-マリナ" = "（ま、マズい！このままでは粛清されてしまう……！！）"
"70010010-97-マリナ" = "ちゃ……。"
"70010010-98-マリナ" = "着手しています……！#nそう！保安委員会は、既にスーパーコンピューターの準備に着手しています！"
"70010010-99-チェリノ" = "なに？それは本当か？"
"70010010-100-マリナ" = "当然です！不肖マリナ、期日までに責任をもってご用意します！"
"70010010-101-チェリノ" = "マリナ。"
"70010010-102-マリナ" = "は、はいっ！"
"70010010-103-チェリノ" = "お前のような忠臣が傍にいて、おいらは果報者だ。"
"70010010-104-チェリノ" = "レッドウィンターとおいらのために尽くすその献身的な姿……称賛に値する。"
"70010010-105-チェリノ" = "……分かった。この件はお前に任せる。#n無事に終われば「第一級髭労働章」を――"
"70010010-106-チェリノ" = "いいや！それでは小さすぎる！"
"70010010-107-チェリノ" = "「レッドウィンター連邦英雄」の勲章を授与するとしよう！"
"70010010-108-マリナ" = "はい！お任せください！"
"70010010-109-マリナ" = "どうする……？"
"70010010-110-マリナ" = "来週までに……？#nスーパーコンピューターなんて作って無いぞ……。"
"70010010-111-ミノリ" = "どうしよう、とはなんだ。"
"70010010-112-ミノリ" = "圧政者のくせに、あたしたち勤労大衆に助けを求めるのか？"
"70010010-113-ミノリ" = "わはは！崖っぷちじゃん！"
"70010010-114-ミノリ" = "この話、漫画のネタに使ってもいい？#nあ～笑いすぎてしんどい！"
"70010010-115-ミノリ" = "その前に、今の原稿をあげてもらえますか？#n締切が守れなかった先輩だって、崖っぷちですからね。"
"70010010-116-ミノリ" = "しゅん……。"
"70010010-117-タカネ" = "ムフフ。このままじゃ赤っ恥ですねぇ？#n事前にインタビューでも取っておきましょうか。"
"70010010-118-ヤクモ" = "お茶が原因で粛清された保安委員長……次号の「レッドベア」の表紙はこれでいきましょう。"
"70010010-119-タカネ" = "ノンフィクションとはいえ、あまりの愚かさに文学的価値を感じませんね。"
"70010010-120-タカネ" = "10点中2点、差し上げますわ。"
"70010010-121-メル" = "なんで点数？"
"70010010-122-タカネ" = "ふつうの評論では皆さんに響かないようでしたので、昨日から点数制を導入いたしまして。"
"70010010-123-タカネ" = "ああ、メルリーさんの現在の原稿は0点です。#n完成していなければ、作品とは呼べませんから。"
"70010010-124-メル" = "えっと……私より評論しがいのある人が目の前にいるんだし、そっちの話しない？"
"70010010-125-マリナ" = "……いくらでも笑ってくれ。#n何とか、手を貸してもらえないだろうか……？"
"70010010-126-ミノリ" = "断る。圧政者に提供する労働力はない。"
"70010010-127-ミノリ" = "どうしてあたしが――いや、我々があなたに協力しなければならないんだ？"
"70010010-128-マリナ" = "その、これには理由があるんだ……。"
"70010010-129-マリナ" = "実は……誰と一緒に作っているのか、と会長に聞かれて――"
"70010010-130-マリナ" = "思いつくまま、お前たちの名前を言ってしまったんだ……。"
"70010010-131-マリナ" = "皆で、力をあわせる、と……。"
"70010010-132-一同" = "な、なんだってー！？！？"
"70010010-133-モミジ" = "1点です、1点！！あなた、気はたしかですか！？"
"70010010-134-モミジ" = "どうして私たちを巻き込むのさ！？"
"70010010-135-モミジ" = "ひぇ……み、みんな粛清されてしまいますよ！"
"70010010-136-ヤクモ" = "圧政だけでは飽き足りず、失策の責任まで民衆に背負わせるのか？"
"70010010-137-ヤクモ" = "関係者を増やして、責任の所在を曖昧にするという手口です？#n私たち、何か恨まれるようなことしましたかねぇ？"
"70010010-138-マリナ" = "ち、違う！慌てて、つい言ってしまったんだ。#n悪気はなかったんだ……本当だ。"
"70010010-139-マリナ" = "皆とは顔見知りだから……私が勝手に、友達だと……思い込んでいただけで……。"
"70010010-140-メル" = "友達……？"
"70010010-141-メル" = "おん？"
"70010010-142-マリナ" = "わ、忘れて……ごめん、名前を出しちゃったことは、本当に……。"
"70010010-143-マリナ" = "……会長に白状する。#nお前たちが濡れ衣を着せられないよう責任を取ろう。"
"70010010-144-マリナ" = "私がもっと慎重になるべきだった……友達なら、なおのこと……。#n本当に、ごめん。"
"70010010-145-タカネ" = "9点……です。"
"70010010-146-メル" = "ちょっと！！なんでそんな高評価なの！？#n私の漫画はボロクソ言うのに！"
"70010010-147-タカネ" = "リアルなヒューマンストーリーの感動に比べたら、#nメルリーさんはまだまだですわ。"
"70010010-148-タカネ" = "友達だと思ったから頼りたかった……今のは心に響きました。"
"70010010-149-ヤクモ" = "友達……あの保安委員長がそんなことを言うなんて……。"
"70010010-150-ヤクモ" = "これは……スクープ級の特大ネタですねぇ。ムフフフ。"
"70010010-151-マリナ" = "やはり、友達ではなかったんだな……私の思い込みか……。"
"70010010-152-モミジ" = "い、いやいや、そういう話じゃなくってさ！"
"70010010-153-メル" = "手伝うったって、どうすればいいか分からないなあ～って、ね？みんな？"
"70010010-154-モミジ" = "そうですよ……#nレッドウィンターの労働力を総動員しても600年かかるんですよね？#n私たち5人が手伝ったところで……。"
"70010010-155-モミジ" = "いや……4人でしたね。#nメル先輩はこんなことしてる場合じゃないですよね？"
"70010010-156-メル" = "あとちょっとであがるってば！"
"70010010-157-ミノリ" = "[ruby=いけくら]池倉[/ruby]マリナ。レッドウィンターの事務局員であり、保安委員長……。"
"70010010-158-ミノリ" = "圧制者の走狗に「友達」だと思われていたのか……。"
"70010010-159-ミノリ" = "我々の同志となることを歓迎するぞ！"
"70010010-160-マリナ" = "ど、同志！？"
"70010010-161-ヤクモ" = "ミノリさん！？"
"70010010-162-ヤクモ" = "おっと……これは意外な展開。"
"70010010-163-ヤクモ" = "もう少し粘って保安委員会との取引に持ち込もうと思ったのですが……そうきましたか……。"
"70010010-164-タカネ" = "部長、ビジネスチャンスを狙うにしてもTPOを弁えて欲しいですわ。"
"70010010-165-ヤクモ" = "これは失敬。ムフフ。"
"70010010-166-マリナ" = "……マリナよ、圧政者の暴政に怯え、民衆の階級意識に目覚めたのだな。"
"70010010-167-マリナ" = "闘争の戦線に合流せよ！悩みなき明日は、我々の手で勝ち取るのだ！"
"70010010-168-マリナ" = "気持ちはありがたいが、どう考えても方法がないんだ……。"
"70010010-169-マリナ" = "あれほど大がかりな工事……たとえ工務部総出でも不可能だろう……。"
"70010010-170-マリナ" = "いっそのこと、クーデターを準備したほうが現実的な気がするのだが……。"
"70010010-171-ヤクモ" = "具体的には何なんです？チェリノ会長の欲しいものって。#n複雑な機械なのは分かりましたけど。"
"70010010-172-マリナ" = "ミレニアム[ruby=エキスポ]EXPO[/ruby]の視察で見たコンピューターだ。"
"70010010-173-マリナ" = "どんな質問にも答えてくれていた。"
"70010010-174-ミノリ" = "質問に答えてくれる機械？"
"70010010-175-ミノリ" = "なんだ、簡単じゃないか。"
"70010010-176-メル" = "……簡単だと！？"
"70010010-177" = "[log]ミレニアム演算科学研究部 訪問1日前[/log]"
"70010010-178-チェリノ" = "マリナ委員長、いよいよ明日に迫ったわけだが。"
