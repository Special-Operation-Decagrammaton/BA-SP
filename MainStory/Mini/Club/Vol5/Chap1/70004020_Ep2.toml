[translation]
"70004020-1" = "主なきプレゼント（２）"
"70004020-2" = "（翌朝……）"
"70004020-3-ソラ" = "いらっしゃいませ、「エンジェル24」です！"
"70004020-4-ヒナ" = "あら、朝早いのに大変ね。"
"70004020-5-ソラ" = "（この人はゲヘナの風紀委員の、[ruby=そらさき]空崎[/ruby]ヒナ委員長。#n他校にも名前が知られてる有名人だったよね……）"
"70004020-6-ソラ" = "（無口で感情を表に出さない人だから、#n誰かにプレゼントを贈るなんて想像できないけど……）"
"70004020-7-ソラ" = "（ゲヘナ風紀委員と先生は何かと関わりがあるし、可能性はあるはず！）"
"70004020-8-ヒナ" = "あ、あの……ゲヘナ学園の空崎ヒナ委員長、ですよね？"
"70004020-9-ヒナ" = "そうだけど、私に何か？"
"70004020-10-ソラ" = "あっ、いえ！何かあったわけじゃ、ないんですが……！"
"70004020-11-ソラ" = "その……ええと……"
"70004020-12-ソラ" = "く、クリスマスのご予定は……？"
"70004020-13-ヒナ" = "クリスマス……？"
"70004020-14-ソラ" = "は、はい。委員長はいつもお忙しいと聞いていますが……#nクリスマスくらいは、その……ゆっくり過ごされるのかなぁ、って……"
"70004020-15-ソラ" = "た、例えば豪華なパーティーに参加されるとか、#n誰かに「プレゼントをする」とか――"
"70004020-16-ヒナ" = "……さぁ、どうかしら。"
"70004020-17-ヒナ" = "私の予定を聞いてどうするの？"
"70004020-18-ソラ" = "（うっ、怪しまれちゃった……！）"
"70004020-19-ソラ" = "そ、それは……"
"70004020-20-ソラ" = "じ、実は私、いま中学生で。さ、再来年には、高校生になるんです！"
"70004020-21-ソラ" = "でも、どの学園に進学しようか迷っていて……#n参考に、ゲヘナでのクリスマスの過ごし方を聞けたらなぁと……。"
"70004020-22-ヒナ" = "進学……？ゲヘナ学園に……？"
"70004020-23-ソラ" = "えっ？わ、私、何か変なこと言いました？"
"70004020-24-ヒナ" = "いえ、変ではないけど……"
"70004020-25-ヒナ" = "ゲヘナを目指す中学生は、初めて見た。"
"70004020-26-ヒナ" = "真面目そうな子だと思っていたけど……#n案外、自由に憧れるところがあったのかしら。"
"70004020-27-ソラ" = "えっ。私のこと、見ていてくださったんですか？"
"70004020-28-ヒナ" = "まあ……シャーレに来るたび見かけるから。"
"70004020-29-ヒナ" = "ソラはいつもこのコンビニにいるでしょう？"
"70004020-30-ヒナ" = "サボらず真面目に働いている姿を見て、しっかりした子だと思っていたの。"
"70004020-31-ヒナ" = "ゲヘナ生のように気ままに振る舞うイメージがなくて、驚いただけ。#nだから気にせず、進路は自由に決めていいと思う。"
"70004020-32-ヒナ" = "風紀委員長の立場から言わせてもらうと……#nソラのような真面目な生徒が後輩になってくれたら、とても心強いわ。"
"70004020-33-ヒナ" = "あ、ありがとう、ございます……。"
"70004020-34-ヒナ" = "話を戻すと……今年のクリスマスは、#n風紀委員会の教室で部員たちと過ごす予定なの。"
"70004020-35-ヒナ" = "アコ――風紀委員会の行政官が、何か用意してくるらしくて。"
"70004020-36-ヒナ" = "とはいえ仕事は山積みだから……クリスマスは一日中、教室に缶詰かな。"
"70004020-37-ソラ" = "そうですか……じゃあ、このプレゼントは一体……"
"70004020-38-ヒナ" = "……プレゼント？"
"70004020-39-ソラ" = "いっ、いえ！な、なんでもありません！"
"70004020-40-ヒナ" = "そう？#n……一応、私の連絡先を教えてあげる。何かあればここに。"
"70004020-41-ヒナ" = "進路相談も……力になるわ。"
"70004020-42-ソラ" = "あっ、ありがとうございます！#nコンビニが襲撃されたら、真っ先に連絡しますね！"
"70004020-43-ヒナ" = "……そんなことは、ないと嬉しいけれど。"
"70004020-44-ソラ" = "いらっしゃいませ、「エンジェル24」です！"
"70004020-45-カズサ" = "えっと……新発売のミントチョコあんまん？を一つください。"
"70004020-46-カズサ" = "それと、もし余ってれば……他の味も一つずつ。"
"70004020-47-ソラ" = "はい、少々お待ちください。"
"70004020-48-ソラ" = "（あの人、確かトリニティ総合学園の生徒だっけ……）"
"70004020-49-ソラ" = "（……少し怖い顔をしてるけど、#n甘くてふわふわしたスイーツが好きなお客さんなんだよね）"
"70004020-50-ソラ" = "（いつも差し入れ用のスイーツを買ってて……あっ。#nもしかして、先生へのプレゼントも……？）"
"70004020-51-ソラ" = "あっ、あの！クリスマスケーキのご予約はお済みですか？"
"70004020-52-ソラ" = "……ケーキ？"
"70004020-53-カズサ" = "あ、ケーキのキャンペーンでもやってるんですか？"
"70004020-54-ソラ" = "い、いえ！ちょっと個人的に聞きたいんですが……"
"70004020-55-ソラ" = "トリニティのみなさんは、クリスマスにどんなケーキを食べるんでしょう？"
"70004020-56-カズサ" = "え……？"
"70004020-57-ソラ" = "……？"
"70004020-58-カズサ" = "わ、私がトリニティの生徒って、言いましたっけ？"
"70004020-59-ソラ" = "……？#nいえ、聞いてはいないのですが……"
"70004020-60-ソラ" = "そっか……なら私、トリニティの生徒に見えたってことですよね。#nえへへ……。"
"70004020-61-ソラ" = "（な、なんだか喜んでる……？#n見えるもなにも、トリニティの制服を着てるのに……）"
"70004020-62-ソラ" = "そういえばこの前、SNSで「トリニティの生徒は高級スイーツしか食べない」#nなんて噂が広まってたな……あ、だからですか？"
"70004020-63-カズサ" = "でもトリニティのお嬢様だって、普通のスイーツは好きですよ。#n全員がそうとは言い切れないですけど……"
"70004020-64-カズサ" = "美味しいって感覚は、みんな同じだし。#n私も今年はD.U.のお店で予約したブッシュドノエルを……"
"70004020-65-カズサ" = "あ。でもあれは先着限定販売だったから、一般的とは言えないか。#nすみません、参考にならなくて。"
"70004020-66-カズサ" = "い、いえ！教えていただいてありがとうございます！"
"70004020-67-ソラ" = "じ、じゃあ……そのケーキは、誰と食べるんですか？"
"70004020-68-ソラ" = "部活の人か、クラスメイト……それとも、「[USERNAME]先生」――"
"70004020-69-カズサ" = "そ、そんなわけないでしょ！？"
"70004020-70-ソラ" = "す、すみませんっ！"
"70004020-71-カズサ" = "……あっ。"
"70004020-72-カズサ" = "またやっちゃった……"
"70004020-73-カズサ" = "ごめん……驚くとつい大声が出ちゃって。"
"70004020-74-カズサ" = "あんたは何も悪くないから。#nこれは、あいつらといる時の癖みたいなもので……#nほんとごめん、できたら大目に見てほしいというか……"
"70004020-75-ソラ" = "だ、大丈夫です。お気になさらず……！"
"70004020-76-カズサ" = "……ありがとう。あんた、思ったより大人なんだね。"
"70004020-77-カズサ" = "質問の答えだけど、ケーキは部活のみんなと食べる予定だよ。#nまぁ先生とスイーツを食べることも、なくはないけど……"
"70004020-78-カズサ" = "今年のクリスマスは、シスターフッドの手伝いがあるからね。"
"70004020-79-カズサ" = "聖誕祭の後、シスターフッドが焼き立てのパネットーネを配るんだって。#n特別なものじゃないけど……気になってさ。"
"70004020-80-ソラ" = "そうでしたか……ではプレゼントは、他の方の……"
"70004020-81-ソラ" = "……？"
"70004020-82-カズサ" = "……ソラ、だっけ？クリスマスは何するの？"
"70004020-83-カズサ" = "私は当日もシフトを入れました。"
"70004020-84-カズサ" = "えっ、せっかくのクリスマスなのにアルバイト？"
"70004020-85-ソラ" = "あはは……どうしても欲しい物がありまして……"
"70004020-86-カズサ" = "そっか……大変だね……"
"70004020-87-カズサ" = "……じゃあ、これあげる。"
"70004020-88-ソラ" = "こ、これは……？"
"70004020-89-カズサ" = "トリニティで売ってる限定マカロン。#nちょっと買いすぎちゃったから、よければ食べて。"
"70004020-90-カズサ" = "ほら、働いてると甘いものが欲しくなるときってあるじゃん？"
"70004020-91-ソラ" = "あっ、ありがとうございます……！"
"70004020-92-カズサ" = "気にしないで。さっき怖がらせちゃったお詫びでもあるし。"
"70004020-93-カズサ" = "じゃあね、ソラ。"
"70004020-94-ユウカ" = "ねえ、モバイルバッテリーは置いてるかしら！？"
"70004020-95-ソラ" = "はっ、はい！右奥の棚の一番下の段です！"
"70004020-96-ユウカ" = "ありがとう！はぁ～、やっと充電できる……！#n大事な連絡が来ることになってたから、助かったわ！"
"70004020-97-ユウカ" = "けど戻るまでは持つ計算だったのに……何が問題だったのかしら？"
"70004020-98-ソラ" = "（ミレニアムサイエンススクールで会計をしているユウカさん……）"
"70004020-99-ソラ" = "（決算シーズンによく先生と一緒にいるよね……）"
"70004020-100-ソラ" = "（先生に怒っているところをよく見るけど……#nこっそりプレゼントを用意してたりするかも……？）"
"70004020-101-ソラ" = "あ、あの……"
"70004020-102-ソラ" = "あれっ。おつりの計算、間違ってた？"
"70004020-103-ソラ" = "い、いえ。実はその、個人的に聞きたいことがありまして……。"
"70004020-104-ユウカ" = "あら。ソラちゃんの個人的な質問なんて、珍しいわね。"
"70004020-105-ユウカ" = "いいわよ。私に答えられるなら。"
"70004020-106-ソラ" = "ありがとうございます！#nあの……先生のクリスマスの予定って、知ってますか？"
"70004020-107-ユウカ" = "どっ、どど、どうしてそれを私に聞くの！？"
"70004020-108-ユウカ" = "えっ？だってユウカさんは、#n先生の会計記録や夜勤記録を知ってるみたいですし……"
"70004020-109-ソラ" = "他の方よりも先生と親しそうなので、#nスケジュールくらいはお互い共有しているのではと――"
"70004020-110-ソラ" = "ごっ、ごめんなさい！私、ものすごい勘違いを……！？"
"70004020-111-ユウカ" = "……こほん。そうね、確かに私は先生がお金の無駄使いをしないよう、#n助言をしているわ。"
"70004020-112-ユウカ" = "けれどそれは、あくまで生徒と先生の関係として。#n急用でもない限り、休日は連絡を控えてるの。"
"70004020-113-ユウカ" = "それに先生は、休日も忙しいみたいだし？"
"70004020-114-ソラ" = "そ、そうだったんですね。#nじゃあ、ユウカさんはクリスマスの日に……"
"70004020-115-ユウカ" = "セミナーのみんなと過ごすでしょうね。"
"70004020-116-ソラ" = "それに最近、手のかかる後輩が一人、悩んでるみたいで。"
"70004020-117-ユウカ" = "年末は部員たちの面倒を見ながら、静かに過ごすことになると思うわ。"
"70004020-118-ユウカ" = "でも、そんな話題が出るってことは……#n誰かが先生とクリスマスの約束でもしているの？"
"70004020-119-ソラ" = "あっ、いえ！そういうわけでは……！"
"70004020-120-ソラ" = "ふーん……ま、私には関係ないけど。"
"70004020-121-ユウカ" = "とにかく、さっきは過剰に反応しちゃったけど……#nまた何かあったら、気楽に聞いてくれていいから。"
"70004020-122-ソラ" = "ありがとうございます……！"
"70004020-123-ソラ" = "ば、バレたかと思った……#nやっぱり、ストレートに聞くのはよくないなぁ……"
"70004020-124-ソラ" = "けど誰も、プレゼントのことは知らないみたいだった。"
"70004020-125-ソラ" = "先生宛てのプレゼントじゃなかったのかな……？"
"70004020-126-ソラ" = "ううん、決めつけるにはまだ早い。#n最後の一人まで、徹底的に調査しないと！ "
"70004020-127-ソラ" = "いらっしゃいませ、「エンジェル24」です！"
"70004020-128" = "（その後もソラはプレゼントの出所を探ったが……）"
"70004020-129" = "（……これといった手がかりは見つからなかった）"
