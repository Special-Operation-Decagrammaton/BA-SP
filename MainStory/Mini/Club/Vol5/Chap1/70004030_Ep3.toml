[translation]
"70004030-1" = "主なきプレゼント（３）"
"70004030-2-ソラ" = "はぁ……"
"70004030-3-ソラ" = "結局、落とし主は分からなかったなぁ……。"
"70004030-4-ソラ" = "このプレゼントのせいで、キヴォトスが大混乱に陥ったらどうしよう……"
"70004030-5-ミヤコ" = "……今、大混乱と聞こえましたが？"
"70004030-6-ソラ" = "うひゃあっ！？"
"70004030-7-ソラ" = "み、ミヤコさん！？いつからそこに……？"
"70004030-8-ミヤコ" = "ついさっきです。ごめんなさい、驚かせてしまって。"
"70004030-9-ミヤコ" = "それより、なにか事件でも？"
"70004030-10-ソラ" = "い、いえ、別に大したことでは……！"
"70004030-11-ソラ" = "そ、その……#nじ、実は今週発売の「爆裂・神チキン」がすっごく辛いと評判でして！"
"70004030-12-ソラ" = "キヴォトス中にセンセーションを巻き起こしているそうなので……#n辛さのあまり、みんなが大混乱したら大変だなぁ、なんて……。"
"70004030-13-ミヤコ" = "ああ、新商品のことでしたか。"
"70004030-14-ミヤコ" = "私はてっきり、先生が何かの標的にされたのではと。"
"70004030-15-ソラ" = "あはは……そんなぁ……"
"70004030-16-ソラ" = "と、ところで今日はどうされたんですか？#n廃棄弁当でしたら、今まとめているところで……"
"70004030-17-ミヤコ" = "いえ、今回はお弁当の件ではなく……"
"70004030-18-ミヤコ" = "こちらをソラさんに、と思いまして。"
"70004030-19-ソラ" = "これは？なんだか香ばしい匂いがしますが……。"
"70004030-20-ミヤコ" = "ローストターキーです。#n近所の方たちにお肉をもらって作ったのですが、量が多くて……"
"70004030-21-ミヤコ" = "日頃のお弁当のお礼にと思い、持ってきました。#nよければ食べていただけると嬉しいです。"
"70004030-22-ソラ" = "ええっ！？廃棄弁当の件は、むしろこっちが感謝しているくらいなのに……#nあ、ありがとうございます！"
"70004030-23-ソラ" = "そうだ、ミヤコさんもここで一緒に食べませんか？#nこの時間はお客さんもほとんどいませんし。"
"70004030-24-ミヤコ" = "……いえ。#n実は先生にも、お裾分けして差し上げたいと思っているので……"
"70004030-25-ミヤコ" = "この後は先生のところへ向かいます。#nせっかくお誘いいただいたのに、ごめんなさい。"
"70004030-26-ソラ" = "そうですか……"
"70004030-27-ヒナ" = "……ふふ、そう言うと思った。"
"70004030-28-カズサ" = "まぁ先生とスイーツを食べることも、なくはないけど……"
"70004030-29-ユウカ" = "けれどそれは、あくまで生徒と先生の関係として。"
"70004030-30-ソラ" = "キヴォトスの生徒のみなさんは、[USERNAME]先生が大好きなんですね。"
"70004030-31-ミヤコ" = "……はい。誰に対しても親切で、優しい方ですから。"
"70004030-32-ソラ" = "……でも、怪しい噂を聞くこともあります。#nスケバンとつるんでるとか、変な格好で深夜の公園を徘徊しているとか……。"
"70004030-33-ミヤコ" = "ふふっ、まさか。"
"70004030-34-ソラ" = "私はずっと「理由もなく親切にしてくる人には気をつけるように」#nと言われてきました。"
"70004030-35-ソラ" = "だから……どうしてみなさんが、#n先生を簡単に信頼できるのか分からないんです。"
"70004030-36-ミヤコ" = "それはきっと……先生が「頼りない大人」だからでしょう。"
"70004030-37-ソラ" = "頼りない大人、ですか？"
"70004030-38-ソラ" = "ええ。[USERNAME]先生は危なっかしいところもあれば、#nときどき理解不能な行動も取る。#nとても完璧とは言い難い人ですが……。"
"70004030-39-ミヤコ" = "不器用ながらも精いっぱい生徒と向き合って、まっすぐに話を聞いてくれます。"
"70004030-40-ミヤコ" = "だから先生の前では、ありのままを打ち明けることができるのだと#n私は思います。"
"70004030-41-ソラ" = "ミヤコさん……"
"70004030-42-ソラ" = "……先生に弱みでも握られていませんか？"
"70004030-43-ミヤコ" = "そ、そんなことはありません！"
"70004030-44-ソラ" = "それならいいんですが……#nあ、そうだ。念のため、ミヤコさんにも聞きたいのですが……"
"70004030-45-ソラ" = "最近、どこかに忘れ物をしませんでしたか？"
"70004030-46-ミヤコ" = "いえ……思い当たりませんね。#n失ったものはあっても、忘れたものは特に。"
"70004030-47-ミヤコ" = "……すみません、そろそろ私はいかないと。#nではソラさん、いいクリスマスを。"
"70004030-48-ソラ" = "……。"
"70004030-49" = "[ns] \"ソラ、こんばんは。\""
"70004030-50-ソラ" = "ひゃあっ！？せ、先生っ！？"
"70004030-51" = "[s1] \"仕事の息抜きで来たんだけど……\"\n[s2] \"そんなに驚いてどうしたの？\""
"70004030-52-ソラ" = "そ、そうでしたか……「エンジェル24」へようこそ！"
"70004030-53-ソラ" = "そ、そうでしたか……「エンジェル24」へようこそ！"
"70004030-54" = "[s3] \"何か悩み事？\"\n[s4] \"深刻そうな顔をしていたけど。\""
"70004030-55-ソラ" = "そ、そういうわけでは……"
"70004030-56-ソラ" = "そ、そういうわけでは……"
"70004030-57-ソラ" = "……いえ。実は一つ、ありまして……"
"70004030-58-ソラ" = "お店で拾った、このプレゼントの落とし主が見つからず……"
"70004030-59" = "[s] \"あれ。まだ開けていなかったの？\""
"70004030-60-ソラ" = "…………えっ？"
"70004030-61-ソラ" = "ということは、まさか……"
"70004030-62" = "[s5] \"うん、私からのクリスマスプレゼントだよ。\"\n[s6] \"ちゃんと伝えておけばよかったね。\""
"70004030-63-ソラ" = "そ、そんな……突然プレゼントなんていただいても……"
"70004030-64-ソラ" = "そ、そんな……突然プレゼントなんていただいても……"
"70004030-65-ソラ" = "私は……先生にお返しできるものなんて、何も……"
"70004030-66-ソラ" = "……あ！そういえばお弁当の割引券があったような――"
"70004030-67" = "[s] \"気にしないで。いつも助けてもらってるから。\""
"70004030-68-ソラ" = "えっ？"
"70004030-69" = "[s7] \"ソラはいつも笑顔で迎えてくれるでしょ？\"\n[s8] \"どんな時でもコンビニが開いてることに、安心するんだ。\""
"70004030-70-ソラ" = "それは……別に私は、特別なことをしているわけではありません。"
"70004030-71-ソラ" = "それは……別に私は、特別なことをしているわけではありません。"
"70004030-72-ソラ" = "ただ……バイト代を稼ぐために、当たり前のことをしているだけで……"
"70004030-73" = "[ns] \"「当たり前」って、意外と難しいんだよ。\""
"70004030-74" = "[ns9] \"ソラが「当たり前」を頑張ってくれているから――\"\n[ns10] \"みんな安心して、「日常」を楽しめるんだ。\""
"70004030-75-ソラ" = "そう、ですか……"
"70004030-76-ソラ" = "そう、ですか……"
"70004030-77-ソラ" = "先生はこのなんでもない日常を、そんな風に見ていたんですね。"
"70004030-78-ソラ" = "プレゼントの中身は、なんでしょう……？"
"70004030-79-ソラ" = "……手袋？"
"70004030-80" = "[s11] \"この季節は、外にいるとすぐに手が冷えちゃうから。\"\n[s12] \"これで少しは暖かくなると思って。\""
"70004030-81-ソラ" = "……ふふ、かわいいデザイン。"
"70004030-82-ソラ" = "……ふふ、かわいいデザイン。"
"70004030-83-ソラ" = "軽くて温かくて……サイズもピッタリです。#nまるで、あらかじめ測っておいたみたいに――"
"70004030-84-ソラ" = "……手のサイズ、どうして分かったんですか？"
"70004030-85" = "[s13] \"先生たるもの、これくらい把握しておかないと！“\n[s14] \"おつりをもらうたび、ソラの手を見ていたからね！\""
"70004030-86-ソラ" = "…………やっぱり先生は、怪しい大人では？"
"70004030-87-ソラ" = "…………やっぱり先生は、怪しい大人では？"
"70004030-88-ソラ" = "けれど、プレゼントはとても嬉しいです。"
"70004030-89-ソラ" = "いつも私を――#n「エンジェル24」を信頼してくださって、ありがとうございます。"
"70004030-90-ソラ" = "これからも「エンジェル24」は先生のために24時間営業しますね！"
"70004030-91" = "主なきプレゼント"
