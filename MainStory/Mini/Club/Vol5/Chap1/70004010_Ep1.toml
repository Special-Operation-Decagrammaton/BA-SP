[translation]
"70004010-1" = "主なきプレゼント（１）"
"70004010-2-ヒナ" = "……先生？今シャーレについたところ。"
"70004010-3-ヒナ" = "うん、今日は特に問題を起こす子が多くて。#nコンビニで飲み物を買ったらそっちへ行くから。"
"70004010-4-ヒナ" = "あ……先生も、何かいる？"
"70004010-5-ヒナ" = "……ふふ、そう言うと思った。"
"70004010-6-ヒナ" = "なるべく早く向かうから。今日の当番、楽しみにしてる。"
"70004010-7-ヒナ" = "エナジードリンク2点と、ブラックコーヒー1点。合計420円になります！"
"70004010-8-ヒナ" = "支払いはカードでお願い。"
"70004010-9-ヒナ" = "……袋は大丈夫よ、ありがとう。"
"70004010-10-ソラ" = "（……怪しい）"
"70004010-11-カズサ" = "……そういえば、先生。クリスマスケーキ、もう注文した？"
"70004010-12-カズサ" = "え、ケーキ食べないの？うっそ……先生ってチキンだけで済ませる派？"
"70004010-13-カズサ" = "あー、クリスマスも仕事のパターンか。それはなんというか……#nお疲れ様です。"
"70004010-14-カズサ" = "一応、いまモモトークでリンク送ったんだけど……#nデリバリー専門のショートケーキのお店で、結構オススメ。"
"70004010-15-カズサ" = "せっかくのクリスマスなんだから。#n美味しいスイーツ食べとかないと損だよ。"
"70004010-16-ソラ" = "ダックワーズが1点、プリンが2点、#nチョコレートバウムクーヘンが1点……"
"70004010-17-カズサ" = "あっ、すみません。これも一緒で。"
"70004010-18-ソラ" = "牛乳を1点追加ですね。でしたら合計780円になります！#n袋はご利用ですか？"
"70004010-19-カズサ" = "はい、お願いします。"
"70004010-20-ソラ" = "（どう考えても……）"
"70004010-21-ユウカ" = "せ～ん～せ～い～？なんですか、あの領収書は！"
"70004010-22-ユウカ" = "とぼけないでください！昨日セミナーに提出された領収書の中に、#nロボットのおもちゃを購入した履歴が混じっていましたよ！？"
"70004010-23-ユウカ" = "先月はゲームの購入履歴を混ぜていましたよね……？"
"70004010-24-ユウカ" = "はい？自分用のクリスマスプレゼント……？"
"70004010-25-ユウカ" = "どう考えても個人的な出費じゃないですか！#n会計報告書に入れていいものではありません！"
"70004010-26-ユウカ" = "……はぁ、もういいです。#n今から私がそっちへ行って、帳簿をきっちり確認しますから！"
"70004010-27-ユウカ" = "え、ええと……9mm銃弾が30点、#nスピードローダーが1点でお間違いないでしょうか？"
"70004010-28-ユウカ" = "ええ、問題ないわ。ごめんなさい、会計中に大声を出して。"
"70004010-29-ユウカ" = "合計1810円よね。はい、ぴったりあるわ。"
"70004010-30-ソラ" = "あ、ありがとうございます。袋は――"
"70004010-31-ソラ" = "……行っちゃった。"
"70004010-32-ソラ" = "（やっぱり、怪しすぎる……！）"
"70004010-33-ソラ" = "今日、ここに来た生徒は全部で10人……"
"70004010-34-ソラ" = "コンビニに寄らなかった生徒まで数えると、#n20人くらいはシャーレに来てるはず。"
"70004010-35-ソラ" = "用事がある生徒ならともかく、#n何もないのにわざわざシャーレに来るなんて、絶対におかしい。"
"70004010-36-ソラ" = "シャーレの先生は困っている生徒を助けて、#n市民を危険から守る優しい大人って言われてるけど……"
"70004010-37-ソラ" = "全学校のプールで裸で泳いでたとか、生徒の足をなめたとか、#n怪しい噂も聞くのに……"
"70004010-38-ソラ" = "どうしてみんな、先生に会いたがるのかな？"
"70004010-39-ソラ" = "まさか……いかがわしい手で誘惑してるとか……？"
"70004010-40-ソラ" = "そういえばシャーレには、人を操る道具があるって噂も聞いたような――"
"70004010-41" = "[s] \"なんの話？\""
"70004010-42-ソラ" = "ひゃああっ！？せせせせ、先生っ！？"
"70004010-43-ソラ" = "い、いらっしゃいませ、「エンジェル24」です！#n……い、いつから来ていたんですか？"
"70004010-44" = "[s1] \"こんにちは、ソラ。さっき来たところだよ。\"\n[s2] \"何か考えごと？\""
"70004010-45-ソラ" = "い、いえその、SNSで流行ってる投稿を見ていただけです……"
"70004010-46-ソラ" = "い、いえその、SNSで流行ってる投稿を見ていただけです……"
"70004010-47" = "[s3] \"SNSの投稿って、面白いよね。\"\n[s4] \"けど、あまり鵜呑みにしちゃダメだよ。\""
"70004010-48-ソラ" = "は、はい！気をつけます……！"
"70004010-49-ソラ" = "は、はい！気をつけます……！"
"70004010-50" = "[ns] \"ところで……最近、調子はどう？\""
"70004010-51-ソラ" = "そうですね……ちょっとバタバタしてます。"
"70004010-52-ソラ" = "もうすぐクリスマスですから。#nケーキやチキンを買いに来るお客さんが多くて。"
"70004010-53" = "[s] \"もうそんな時期か……あ、これお会計お願いします。\""
"70004010-54-ソラ" = "お預かりします。ミントガムが1点、レモンゼリーが1点ですね。"
"70004010-55-ソラ" = "こちらのレモンゼリーはキャンペーンの対象商品でして、#n1点ごとにビタミンドリンクを1本、サービスしています。"
"70004010-56" = "[s] \"それはソラにあげるよ。\""
"70004010-57-ソラ" = "えっ、私に……？"
"70004010-58" = "[s5] \"ソラはいつも頑張ってるから。\"\n[s6] \"同じビルで働く者同士、助け合わないとね。\""
"70004010-59-ソラ" = "……ありがとうございます。"
"70004010-60-ソラ" = "……ありがとうございます。"
"70004010-61-ソラ" = "（……[USERNAME]先生は、怪しい大人だけど……）"
"70004010-62-ソラ" = "あの、先生。少し聞きたいことが――"
"70004010-63-市民" = "すみません。妖怪MAXのコーヒー味、売り切れですか？"
"70004010-64-ソラ" = "は、はいっ？妖怪MAXのコーヒー味……？"
"70004010-65-ソラ" = "ち、ちょっと在庫を確認してみますね。でも……"
"70004010-66" = "[ns] \"お客さん優先で大丈夫だよ。\""
"70004010-67-ソラ" = "あ、ありがとうございます！では、失礼します……！"
"70004010-68" = "（……しかし、その後も客はひっきりなしにやってきて……）"
"70004010-69-ソラ" = "はぁ……やっと落ち着いた……"
"70004010-70-ソラ" = "途中で店内の掃除もできなかったなぁ。#nこんなにお客さんが続いたのは初めてかも……"
"70004010-71-ソラ" = "……生徒のみんなが先生を訪ねる理由も、聞きそびれちゃったし。"
"70004010-72-ソラ" = "とりあえず、今は掃除しよっと。"
"70004010-73-ソラ" = "まいにち～幸せとどける～♪#nはっぴーはっぴーエンジェル24～♪"
"70004010-74-ソラ" = "あれ？これは……"
"70004010-75-ソラ" = "――プレゼント？"
"70004010-76-ソラ" = "シャーレに来た生徒の落とし物かな？"
"70004010-77-ソラ" = "とりあえず、お店の前にお知らせを――"
"70004010-78-ソラ" = "……いや、ちょっと待って。#nもしこれが、先生宛のプレゼントだったら……？"
"70004010-79-ソラ" = "生徒のほとんどは、先生のことが好きなはず。#nこの状況で、もし誰かが抜け駆けして告白しようとしてるって#n知れ渡ったら、大騒ぎになるんじゃ……"
"70004010-80-ソラ" = "しかも、落とし主が学園の偉い人だった場合……#n学園同士の抗争になったりして……！？"
"70004010-81-ソラ" = "ど、どうしよう……！？捨てる訳にはいかないけど、#n防犯カメラの死角に落ちてたから、落とし主を特定するのも難しいし……"
"70004010-82-ソラ" = "……直接、聞いてみるしかないよね。"
"70004010-83-ソラ" = "今日来たお客さんの顔は覚えてる。#nだからプレゼントのことがバレないように、一人ずつ聞いてみよう。"
"70004010-84-ソラ" = "落とし主を見つけて、キヴォトスの平和を守るために――！"
