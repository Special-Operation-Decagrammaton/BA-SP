"70003010-93-違法営業の生徒" = "みなさーん、少しお時間をください！"
"70003010-94-違法営業の生徒" = "私が誰かは気にするところではありません！"
"70003010-95-違法営業の生徒" = "それよりも……"
"70003010-96-違法営業の生徒" = "今から、とっておきの商品をご紹介します！"
"70003010-97-違法営業の生徒" = "ここにいる人たちだけの特別プライスです！"
"70003010-98-違法営業の生徒" = "なんか、怪しい生徒がいるんだけど……。"
"70003010-99-違法営業の生徒" = "こちらの商品を着けると、遠赤外線とマイナスイオンで血行が良くなるんです！#nしかもお持ちの銃の汚れを減らす効果まであり、弾詰まりもなくなる優れもの！"
"70003010-100-違法営業の生徒" = "その名も「げるげるゲルマニウム・ブレスレット」！"
"70003010-101-違法営業の生徒" = "皆さんにだけ特別、50％オフでご提供します！"
