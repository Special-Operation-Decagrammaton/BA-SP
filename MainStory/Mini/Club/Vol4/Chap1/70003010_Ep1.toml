"70003010-103-違法営業の生徒" = "安いな……。"
"70003010-104-違法営業の生徒" = "弾が詰まらなくなるなんて、すごい……。"
"70003010-105-乗客D" = "あっ、お客様！手を触れてしまいましたね？#nご購入していただかなくては！"
