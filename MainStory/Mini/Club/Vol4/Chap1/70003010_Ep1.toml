"70003010-72-乗務員の生徒" = "……。"
"70003010-73-乗務員の生徒" = "……はぁ、平和すぎると思ったんだよね。"
"70003010-74-乗務員の生徒" = "すみません、乗務員さん……。"
"70003010-75-乗務員の生徒" = "はい、どうされましたか？"
"70003010-76-乗客B" = "あの人たち、なんとかなりませんか？#nさっきからうるさいんですけど……。"
"70003010-77-乗務員の生徒" = "申し訳ありません……。"
"70003010-78-乗客B" = "さっさと大人しくさせてください。#nはぁ、まったく使えない。"
"70003010-79-乗務員の生徒" = "は、はい……。"
"70003010-80-乗務員の生徒" = "ご迷惑をおかけし、申し訳ございません……。"
"70003010-81-運転士の生徒" = "……7号車でトラブルですか？"
"70003010-82-運転士の生徒" = "なるほど……。"
"70003010-83-運転士の生徒" = "対応が難しければ、私も向かいます。"
