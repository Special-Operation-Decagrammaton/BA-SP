"70003010-85-運転士の生徒" = "毎日毎日、どうしてこう……。"
"70003010-86-運転士の生徒" = "今度は8号車……？#n3号車も！？"
"70003010-87" = "8号車"
"70003010-88-迷惑な客C" = "おい、出るほうが先だろ！"
"70003010-89-迷惑な客B" = "は？避ければ済む話じゃないか！"
"70003010-90-迷惑な客B" = "そっちが譲ってもいいんじゃないのか？"
"70003010-91-迷惑な客C" = "うっせえな、文句あんのか？"
