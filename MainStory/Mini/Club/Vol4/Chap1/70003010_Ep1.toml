"70003010-114-乗客D" = "よーし！大出血サービスです！"
"70003010-115-違法営業の生徒" = "この車両限定で！他の皆さんにもこちらのお値段でご提供いたします！"
"70003010-116-違法営業の生徒" = "さらに先着三名様には……百鬼夜行の厄除けもお付けしちゃいます！"
"70003010-117-乗客D" = "買います！"
"70003010-118-乗客B" = "私も！"
"70003010-119" = "6号車"
