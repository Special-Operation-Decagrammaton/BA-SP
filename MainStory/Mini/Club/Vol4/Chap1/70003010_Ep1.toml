[translation]
"70003010-1" = "ハイランダー鉄道学園の運行日誌（１）"
"70003010-2-運転士の生徒" = "こんにちは、私はハイランダー鉄道学園で運転士をしています！"
"70003010-3-運転士の生徒" = "本日も「循環線内回り」は平常通り運転予定です。"
"70003010-4-運転士の生徒" = "ご存じの通り、年間で最も事故や事件が起きている路線ですが……。"
"70003010-5-運転士の生徒" = "応援を要請しても、なかなか応援が来ないので……。"
"70003010-6-運転士の生徒" = "何かあっても、基本的に自分たちで解決してるんです。"
"70003010-7-運転士の生徒" = "結構大変な……。"
"70003010-8-運転士の生徒" = "……。"
"70003010-9-運転士の生徒" = "……いや、結構どころじゃないかも。"
"70003010-10-運転士の生徒" = "あはは……！まあ！"
"70003010-11-運転士の生徒" = "車両の管理やトラブルの対応をしていると、#n毎日があっという間に過ぎていくんですよね～！"
"70003010-12-運転士の生徒" = "良いような、悪いような……あはは。"
"70003010-13-乗務員の生徒" = "何してるの？"
"70003010-14-運転士の生徒" = "あっ。"
"70003010-15-運転士の生徒" = "いや、これは……。"
"70003010-16-運転士の生徒" = "ちょっと、Vlogを撮ろうと思って……。"
"70003010-17-乗務員の生徒" = "そうなんだ？"
"70003010-18-運転士の生徒" = "いや、その……なんというかハイランダーのリアルな姿を、たくさんの人に見てもらおうかなと……。"
"70003010-19-乗務員の生徒" = "すごい、面白そう。"
"70003010-20-運転士の生徒" = "乗客も私たちの仕事を知ったら、協力してくれるようになるかもしれないし……。"
"70003010-21-乗務員の生徒" = "ただ立ってるだけだと思ってる人もいそうだよね。"
"70003010-22-乗務員の生徒" = "この前なんて、「良いご身分だな」って言われたなぁ。"
"70003010-23-運転士の生徒" = "……私もです。"
"70003010-24-乗務員の生徒" = "いろんな人に見てもらえると良いね。"
"70003010-25-乗務員の生徒" = "じゃ、そろそろ準備しよっか。"
"70003010-26-運転士の生徒" = "は、はい！"
"70003010-27-運転士の生徒" = "ふぅ……。"
"70003010-28-運転士の生徒" = "とにかく今日の運行も頑張ります！#n目指せ、今月の優秀生徒賞……！"
"70003010-29" = "列車の機関室"
"70003010-30-運転士の生徒" = "……今のところは異常ありませんね。"
"70003010-31-運転士の生徒" = "客室はどうなってますか？"
"70003010-32-運転士の生徒" = "異常なし。"
"70003010-33-運転士の生徒" = "3号車で座席を間違えてるお客様がいたくらいかな。"
"70003010-34-運転士の生徒" = "良かった、このまま平和に運行できますように……。"
"70003010-35-運転士の生徒" = "さっそく5号車から連絡が……。"
"70003010-36-運転士の生徒" = "ええっと……車両が寒すぎる？"
"70003010-37-運転士の生徒" = "少し温度を上げましょうか。"
"70003010-38" = "（しばらくして）"
"70003010-39-運転士の生徒" = "……また5号車からですね。"
"70003010-40-運転士の生徒" = "今度は暑すぎる……？"
"70003010-41-運転士の生徒" = "さっきと同じお客様？"
"70003010-42-運転士の生徒" = "いえ、違いました。"
"70003010-43-整備士の生徒" = "んー、困ったね。"
"70003010-44-運転士の生徒" = "こればかりは、人それぞれですから……。"
"70003010-45-整備士の生徒" = "至急、応答してください！"
"70003010-46-乗務員の生徒" = "どうしました？"
"70003010-47-運転士の生徒" = "5号車のお客様が服を……！"
"70003010-48-乗務員の生徒" = "はぁ……ちょっと行ってきます。"
"70003010-49-乗務員の生徒" = "ひとまず、寒くて困ってるお客様には毛布を渡そう。"
"70003010-50-運転士の生徒" = "それが良さそうですね。"
"70003010-51-運転士の生徒" = "はい、お願いします……。"
"70003010-52" = "7号車"
"70003010-53-迷惑な客A" = "まったく、最近の若者は。"
"70003010-54-迷惑な客A" = "目上の者には席を譲るべきじゃろ？"
"70003010-55-チンピラB" = "……？"
"70003010-56-チンピラA" = "ここ、指定席なんですけど……。"
"70003010-57-迷惑な客A" = "そんなの知らん！#n私は疲れているんだ！さっさと退きたまえ！"
"70003010-58-チンピラA" = "うお、危なっ！#n棒……！？"
"70003010-59-チンピラB" = "そんなの振り回したら怪我するだろ！"
"70003010-60-迷惑な客A" = "ええい、礼儀がなっておらん！#nワシが若かった頃はな――"
"70003010-61-チンピラA" = "うっせえなクソじじい！"
"70003010-62-迷惑な客A" = "お、お客様……落ち着いてください。"
"70003010-63-迷惑な客A" = "まったく、君は誰だね？"
"70003010-64-迷惑な客A" = "このじじいが先に喧嘩売ってきたんだぞ！"
"70003010-65-チンピラA" = "他のお客様の迷惑になりますから、まずはあちらに……。"
"70003010-66-迷惑な客A" = "ふざけおって！#nワシもお客様じゃろうが！"
"70003010-67-乗務員の生徒" = "いえ、ですからあちらに移動してからお話を……。"
"70003010-68-チンピラB" = "こっちは指定席を取ったのに、なんでだよ！"
"70003010-69-チンピラA" = "移動なんてするもんか！"
"70003010-70-乗務員の生徒" = "ええっと……。"
