[translation]
"70011010-1" = "監原ミスズの憂鬱（１）"
"70011010-2-ミスズ" = "ありがとね、スズちゃん！"
"70011010-3-ミスズ" = "おかげで私、頑張れる気がする！絶対また連絡するから！"
"70011010-4-ミスズ" = "といっても、それはあなたが努力したからですよ。"
"70011010-5-ミスズ" = "3か月連続で表彰！？すごいねスズちゃん！"
"70011010-6-ミスズ" = "ヴァルキューレ全体でもそうそうないよね！？"
"70011010-7-ミスズ" = "といっても、皆さんのご協力あってのものですよ。"
"70011010-8-ミスズ" = "まぁ、スズちゃんしかいないよね。"
"70011010-9-ミスズ" = "スズちゃん？ああ、[ruby=かんばら]監原[/ruby]ミスズ？#nあの性格で大丈夫なのかな……。"
"70011010-10-ミスズ" = "でもほら、実績はあるし……。"
"70011010-11-ミスズ" = "（……ん？）"
"70011010-12-ミスズ" = "あっ、あちらに！こんにちは！監原ミスズさんですね？"
"70011010-13-ミスズ" = "次期矯正局長に選ばれたお気持ちをお聞かせください！"
"70011010-14-ミスズ" = "（どうして、こんなことになったのでしょう……）"
"70011010-15-ミスズ" = "（私はこんなこと……）"
"70011010-16-？？？" = "……ズちゃん。"
"70011010-17-収監中の生徒" = "スズちゃん。"
"70011010-18-ミスズ" = "ひあぁあっ！？"
"70011010-19-収監中の生徒" = "うわっ、ビックリしたぁ……大丈夫？"
"70011010-20-収監中の生徒" = "ごめんなさい……少し考え事をしていて……。"
"70011010-21-ミスズ" = "もー、ただでさえ普段ぽけーっとしてるんだから。しっかりしてよ？"
"70011010-22-収監中の生徒" = "えへへ……そうですね、気をつけないと。ご心配ありがとうございます。"
"70011010-23-ミスズ" = "……それで、お願いしてたやつなんだけど。"
"70011010-24-収監中の生徒" = "あ……これ、ですよね？"
"70011010-25-ミスズ" = "これこれぇ！これ無いとほんとに朝キツいんだよー。"
"70011010-26-収監中の生徒" = "ありがと！またお願いね！"
"70011010-27-収監中の生徒" = "あ、えっと……一応、外の物を何度も持ち込むのはルール的に……。"
"70011010-28-収監中の生徒" = "なので次はちょっと難しいかも……しれません……。"
"70011010-29-ミスズ" = "え？持ってきてくれたの、今日が初めてじゃないよね？"
"70011010-30-収監中の生徒" = "えっと……これまでは特例のようなもの、といいますか……。"
"70011010-31-ミスズ" = "じゃあ次も特例で頼むよ～"
"70011010-32-収監中の生徒" = "はいぃ……。"
"70011010-33-ミスズ" = "でも……少しずつ減らしてみてはいかがでしょう？#nあまり体に良いものでもありませんから。"
"70011010-34-収監中の生徒" = "んー……まぁ、そうだけど……。"
"70011010-35-収監中の生徒" = "……あれ？ちょっと。"
"70011010-36-矯正局の生徒A" = "げっ、看守！"
"70011010-37-収監中の生徒" = "だから看守じゃないって何回言えば……あー、もういいや。"
"70011010-38-収監中の生徒" = "で、何やらかしたんだ？"
"70011010-39-矯正局の生徒A" = "なんで決めつけるんだよ！"
"70011010-40-収監中の生徒" = "日頃の行いを振り返ってみろって。#nそれで……。"
"70011010-41-ミスズ" = "……。"
"70011010-42-収監中の生徒" = "ほら。ボディチェックされる前に自分から出しな。"
"70011010-43-矯正局の生徒A" = "チッ。"
"70011010-44-収監中の生徒" = "……なんだこれ？"
"70011010-45-矯正局の生徒A" = "見りゃ分かんだろ、抹茶ラテスティックだよ。カフェイン入ってるやつ。"
"70011010-46-収監中の生徒" = "カフェイン？それならインスタントコーヒーが支給されてるだろう？"
"70011010-47-矯正局の生徒A" = "あれ苦くてまずいもん。"
"70011010-48-収監中の生徒" = "はぁ……遊びに来てるんじゃないんだぞ……。"
"70011010-49-収監中の生徒" = "というかこれ、結構高いやつじゃなかったか？金はどうしてるんだ？"
"70011010-50-矯正局の生徒A" = "え？そうなの？"
"70011010-51-収監中の生徒" = "は？知らないのか？ってことはまさか……。"
"70011010-52-ミスズ" = "え、えへへ……それは私が選んだ物なのです。"
"70011010-53-ミスズ" = "ただでさえ窮屈な思いをされていますから……#nせめて食べ物くらい、美味しいものをと思って……えへへ……。"
"70011010-54-ミスズ" = "あっ、それに……収監されている生徒の体調管理は私たちの仕事ですし……。"
"70011010-55-矯正局の生徒A" = "局長。"
"70011010-56-矯正局の生徒A" = "あ、や、えっと……えへへ……。"
"70011010-57-ミスズ" = "はぁ……毎度これでは困ります。私たちの仕事が増えるんですよ？"
"70011010-58-矯正局の生徒A" = "ごめんなさい……。"
"70011010-59-矯正局の生徒A" = "おいおい、あんまスズちゃんを責めんなって。無理言ったのは私なんだから。"
"70011010-60-収監中の生徒" = "責めるなら私にしろ！！"
"70011010-61-矯正局の生徒A" = "いや、それはそうだろうよ……。"
"70011010-62-矯正局の生徒A" = "どうして私が悪者みたいになってるんだ……。"
"70011010-63-矯正局の生徒A" = "おい、何事だ？"
"70011010-64-矯正局の生徒B" = "あっ、先輩……。"
"70011010-65-矯正局の生徒B" = "あー……だいたい分かった。"
"70011010-66-矯正局の生徒B" = "お前は自分の部屋に戻れ。それも忘れずに持ってけよ。"
"70011010-67-収監中の生徒" = "こんなつもりじゃなかったんだけど……。"
"70011010-68-収監中の生徒" = "やっぱカフェイン減らすか……スズちゃん、ごめんな。"
"70011010-69-ミスズ" = "えへへ……お気をつけて。"
"70011010-70-矯正局の生徒B" = "では、私たちもこれで。持ち場に戻ります。"
"70011010-71-ミスズ" = "はい……引き続き、よろしくお願いします……。"
"70011010-72-矯正局の生徒B" = "こんなんでいいんですか？"
"70011010-73-矯正局の生徒B" = "局長の性格は知ってるだろ……うちらが合わせるしかない。"
"70011010-74-矯正局の生徒B" = "はぁ……ミスズさん、優しすぎますよ。"
"70011010-75-矯正局の生徒B" = "いや、良い人なのは分かるし、私も好きですけど……。"
"70011010-76-矯正局の生徒B" = "まぁ言いたいことは分かるよ。誰にだって向き不向きはある。でも――"
"70011010-77-矯正局の生徒B" = "矯正局長の振る舞いとしては、ちょっとな……。"
"70011010-78-ミスズ" = "今日もなんとか終わりました……。"
"70011010-79-ミスズ" = "局長室……私には広すぎますね。"
"70011010-80-ミスズ" = "といっても、局員の頃のデスクは狭くて不便でしたし……#n皆さんにスペースを分けてあげられたらいいのに……。"
"70011010-81-ミスズ" = "歴代の局長も、同じ思いだったのでしょうか……？#nそれとも……私が庶民的すぎるだけなのか……。"
"70011010-82-ミスズ" = "といっても、あまり悩んでいても仕方ありませんね。#nやめやめ。この辺にしておきましょう。"
"70011010-83-ミスズ" = "もっと良いことを考えないと。せっかく今日は仕事が早く終わったのですし。"
"70011010-84-ミスズ" = "これだって。多少無理はしましたが……なんとか間に合いそうで良かったです。"
"70011010-85-ミスズ" = "ふふっ。"
"70011010-86-ミスズ" = "編み物はいいですね……心が落ち着いて……。"
"70011010-87-ミスズ" = "このまま時間が止まればいいのに――"
"70011010-88-ミスズ" = "局長！"
"70011010-89-ミスズ" = "はひっ！？"
"70011010-90-ミスズ" = "夜分遅くに失礼します！これは早急に報告すべきと思い……！"
"70011010-91-矯正局の生徒A" = "は、はい、構いません。急務なら当然です。"
"70011010-92-矯正局の生徒A" = "それで、どうされましたか？"
"70011010-93-ミスズ" = "それが……囚人が脱獄を――"
"70011010-94-矯正局の生徒A" = "ええっ！？脱獄ぅ！？"
"70011010-95-ミスズ" = "いつ！？誰が！？ワカモですか！？1人で！？"
"70011010-96-矯正局の生徒A" = "あっ……違います。"
"70011010-97-ミスズ" = "1人じゃない！？"
"70011010-98-ミスズ" = "じゃあ何人のワカモが脱獄を！？"
"70011010-99-ミスズ" = "いや、そもそもワカモは1人しか……。"
"70011010-100-ミスズ" = "というか、ワカモはずっと前に脱獄したじゃないですか。"
"70011010-101-矯正局の生徒A" = "あ……そうでした。取り乱しました……。"
"70011010-102-ミスズ" = "ご安心ください。脱獄は阻止できています。"
"70011010-103-ミスズ" = "とはいえ事が事なので、処分についての判断をいただきたく。"
"70011010-104-ミスズ" = "脱獄を試みた生徒の身元はこちらです。"
"70011010-105-矯正局の生徒A" = "あぁ、それでしたら。"
"70011010-106-ミスズ" = "少し、時間をいただけますか？直接話をしてみようと思います。"
"70011010-107-ミスズ" = "つまり、取り調べですよね？"
"70011010-108-矯正局の生徒A" = "あまり好きな表現ではありませんが……そうなります。"
"70011010-109-ミスズ" = "ですが、わざわざ局長が危険人物と対面しなくても……。"
"70011010-110-ミスズ" = "矯正局は人手不足なのですから。"
"70011010-111-ミスズ" = "私にやらせてください。"
"70011010-112-矯正局の生徒A" = "……分かりました。準備に取り掛かります。"
"70011010-113-ミスズ" = "……昔なら、こういうこともなかったのですが。"
