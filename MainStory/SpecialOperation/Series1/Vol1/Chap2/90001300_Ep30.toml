[translation]
"90001300-1" = "第30話;出発の準備"
"90001300-2-リオ" = "もうすぐ輸送船がこちらに到着するわ。"
"90001300-3-リオ" = "残された施設の調査にも目途がつきそうだけれど……。"
"90001300-4-リオ" = "もっと……。"
"90001300-5-リオ" = "もっと急がなければ……。"
"90001300-6-エイミ" = "十分早いよ、会長。"
"90001300-7-リオ" = "いえ、これでは間に合わない。"
"90001300-8-エイミ" = "できることなら、今すぐにでも出発したいのに。"
"90001300-9-ヒマリ" = "落ち着いてください、リオ。#n焦る気持ちも分かりますが、まだ航路の算出もできていませんよ？"
"90001300-10" = "[ns] \"どうしてそこまで急ぐ必要があるの？\""
"90001300-11-リオ" = "……ここに来た理由を思い出してちょうだい。"
"90001300-12-ユズ" = "理由……たしか、資源の搬入ルートを探しに……。"
"90001300-13-ユズ" = "あっ！"
"90001300-14-リオ" = "ええ、そのルートなら、多次元バリアを迂回できる可能性に賭けたのよ。"
"90001300-15-トキ" = "ティファレトと遭遇したのはその途中でした。"
"90001300-16-リオ" = "……ここから一つ、仮説が立てられるわ。"
"90001300-17-リオ" = "資源の輸送を担っていたティファレトが鋼鉄大陸と合流してしまえば――#nそのために用意されていたルートは閉ざされてしまうのではないか、と。"
"90001300-18-トキ" = "……コクマーの時、あの子たちは「資源の採掘は完了した」と話していましたね。"
"90001300-19-エイミ" = "会長が焦ってる理由って――"
"90001300-20-リオ" = "ええ……でも、多次元バリアの領域は、すぐに変えられるものではないと考えているわ。"
"90001300-21-リオ" = "あれは、そもそも生成すら難しい。#n領域の再定義ともなれば、なおさら。"
"90001300-22-リオ" = "多次元の[ruby=どうじざひょうけい]同次座標系[/ruby]を、可能性を含めてゲージ変換し、再演算するところから始めなければならない。それに――"
"90001300-23-モモイ" = "ゲージ変換……？"
"90001300-24-モモイ" = "HPゲージみたいなやつ？"
"90001300-25-リオ" = "違うわ。ゲージ変換というのは――"
"90001300-26-トキ" = "難しい話はいったん置いておきましょう。#nリオ様はすぐに、と仰いました。"
"90001300-27-トキ" = "――つまり、遅からずルートが閉じられてしまう可能性があるのですね。"
"90001300-28-リオ" = "ええ、勝手口は用が終われば閉めるものでしょう？"
"90001300-29" = "[ns] \"航路を算出するまで、あとどれくらい……？\""
"90001300-30-ケイ" = "出発だけなら何とかなりますが……それとは別の問題をお忘れでは？"
"90001300-31-リオ" = "どういう意味かしら……？"
"90001300-32-ケイ" = "このまま踏み込めば、輸送船は鋼鉄大陸の一部になってしまいます。"
"90001300-33-ケイ" = "……それに、私も。"
"90001300-34-リオ" = "……っ！"
"90001300-35-ヒマリ" = "残骸を分析して判明したことがあります。"
"90001300-36-エイミ" = "鋼鉄大陸が物質を変換する仕組みが分かったんだっけ？"
"90001300-37-エイミ" = "ええ。無策で上陸すれば、輸送船を含めすべての物質が取り込まれてしまいます。"
"90001300-38-アリス" = "うわーん！ムリゲーです！！クソゲーです！！！"
"90001300-39-ヒマリ" = "ふふっ、ご心配なく。この超天才病弱美少女ハッカーであり、好奇心旺盛な分析家、かつ科学少女の私がいるのですから。"
"90001300-40-ヒマリ" = "そして、ケイも。"
"90001300-41-ケイ" = "あ、はい……。"
"90001300-42-ヒマリ" = "結論から言いますと、鋼鉄大陸と預言者が発している特殊な波動を無力化すれば対抗できます。"
"90001300-43-ヒマリ" = "どのようにそれを実現すればいいのか、頭を悩ませていたのですが……。"
"90001300-44-ヒマリ" = "ケイのおかげでどうにかなりそうです。"
"90001300-45-アリス" = "わあ、さすがケイです！#nアリス信じていました！"
"90001300-46-ケイ" = "あ、いえ……その、このままキヴォトスを放っておいたらアリスが悲しむと思い……。"
"90001300-47-アリス" = "アリス、知ってます！#nこういうのをツンデレと言うんですよね！"
"90001300-48-アリス" = "でも、ツンデレ属性だけではキャラが弱いことも知っています！#n大丈夫です、ケイ！アリスも一緒に萌え要素を探しますから！"
"90001300-49-ケイ" = "私は今のままで十分ですよ！？"
"90001300-50-アリス" = "……話を戻しましょう。鋼鉄大陸の拡大は、情報の変形と蓄積、そして独自拡張によるものだと分かりました。"
"90001300-51-ケイ" = "その原因である「波動」に対抗するための「波動干渉装置」は、すでにヒマリと私で設計図を作成してあります。"
"90001300-52-ケイ" = "これを製作して、輸送船に装備させれば活動が可能となります。#nそれと、皆さんには戦闘服を――"
"90001300-53-ケイ" = "……なんです？皆さん、ニヤニヤして。"
"90001300-54-ヒマリ" = "ふふっ、それはですね……。"
"90001300-55-ヒマリ" = "アリス、分かる気がします！"
"90001300-56-ヒマリ" = "はい、なんだかんだ言いつつ……。"
"90001300-57-ヒマリ" = "うんうん！"
"90001300-58" = "[ns] \"ケイちゃんは優しい子なんだなって！\""
"90001300-59-ケイ" = "アリスのため！アリスのためです！#n別に皆さんのためじゃないんですからね！"
"90001300-60-アイン" = "……もうすぐ、ティファちゃんが到着します。"
"90001300-61-アイン" = "かわいそうなティファちゃん……あんなに種を大事にしてたのに――"
"90001300-62-アイン" = "って、えっ！？ええええっ！？"
"90001300-63-オウル" = "アイン！？"
"90001300-64-アイン" = "ティ、ティファちゃんが……いません！！"
"90001300-65-ソフ" = "いない？え、どういうこと！？"
"90001300-66-アイン" = "そ、その……今、コンテナに積まれているのは――"
"90001300-67-アイン" = "ティファちゃんの種だけです……！！"
"90001300-68-ソフ" = "！"
"90001300-69-オウル" = "！！！"
"90001300-70-ソフ" = "待って。つまり、ティファレトは――"
"90001300-71-ソフ" = "自分より、種を優先したの！？"
"90001300-72-オウル" = "不確定要素の塊でしかない種なんかを、どうして……！？"
"90001300-73-アイン" = "うえぇーん！！！"
"90001300-74-オウル" = "……。"
"90001300-75-オウル" = "……。"
"90001300-76-オウル" = "これも、ティファレトの選択ですか。"
"90001300-77-ソフ" = "……だね。"
"90001300-78-アイン" = "で、でも……！ティファちゃんは今までずっと苦労してきて……。#n私たちは何もしてあげられてなくて……！"
"90001300-79-アイン" = "なのに……わ、私たちは……結局、ティファちゃんを利用する形に……？#nうわあぁぁーん！！！"
"90001300-80-アイン" = "泣かないで、アイン。もう大丈夫だから。"
"90001300-81-アイン" = "だ、大丈夫、なんかじゃ、ありません……！"
"90001300-82-アイン" = "うん、そうだね……ごめん。"
"90001300-83-アイン" = "私が、もっと上手に――"
"90001300-84-アイン" = "そ、そそそそ、そんなわけありません……！#nソフは、ソフはぁ……！"
"90001300-85-オウル" = "感動的なシーンに水を差しますが……ティファレトは鋼鉄大陸で「復活」できるかもしれません。#nあそこはそういう場所ですから。"
"90001300-86-オウル" = "でも復活したティファレトのことを、「ティファレト」と呼んで良いのかは……。"
"90001300-87-アイン" = "種子貯蔵庫での記憶は消えるだろうね。"
"90001300-88-オウル" = "私たちにとっては、記憶こそが存在証明なのに……。"
"90001300-89-アイン" = "うぅ……うぅっ……。"
"90001300-90-オウル" = "ぐすっ……。"
"90001300-91-アイン" = "もう、大丈夫です……ソフ。#nありがとう、ございます……。"
"90001300-92-ソフ" = "本当に……？"
"90001300-93-アイン" = "はい……いつまでも、こうしてはいられませんし……それに……。"
"90001300-94-アイン" = "ティファちゃんが自分を犠牲にしてまで守った種を、お迎えしてあげないといけないですよね……？"
"90001300-95-ソフ" = "……！"
"90001300-96-オウル" = "……種を守ろうとしたのはティファレトです。"
"90001300-97-オウル" = "これは、ティファレトが選んだ結果ですよ。"
"90001300-98-オウル" = "汝の欲する所を為せ、それが汝の法とならん――"
"90001300-99-ソフ" = "私たちの「掟」だね。"
"90001300-100-オウル" = "私たちにはティファレトの選択を尊重する義務があります。"
"90001300-101-オウル" = "そして、無粋な追手を……迎え撃たなくては。"
"90001300-102-ソフ" = "……うん。"
"90001300-103-アイン" = "で、では……あの人たちは……。"
"90001300-104-アイン" = "さっそく、イェソドちゃんと戦うことに、なるのでしょうか……？"
"90001300-105-ソフ" = "……そう、だろうね。"
"90001300-106-オウル" = "あの子は最初から一貫して、多次元バリアの外に陣取っていますからね。"
"90001300-107-アイン" = "そ、それがイェソドちゃんの、希望ですし……。"
"90001300-108-ソフ" = "文字通り、鋼鉄大陸の門番。#nその力を象徴する子。"
"90001300-109-オウル" = "ソフ、万が一の話ですが……。"
"90001300-110-ソフ" = "言いたいことは分かってるから。"
"90001300-111-ソフ" = "今はこれ以上……不吉な話はしたくない、かな。"
"90001300-112-オウル" = "……。"
"90001300-113-アイン" = "わ、私は……ソフの言葉を聞きたいです。"
"90001300-114-ソフ" = "えっ……？"
"90001300-115-オウル" = "アイン、大丈夫ですか？#nソフに殴られすぎて、おかしくなりましたか！？"
"90001300-116-オウル" = "私がアインを殴るわけないじゃん！"
"90001300-117-オウル" = "私はいいんですか！？"
"90001300-118-オウル" = "変なこと言うからでしょ！"
"90001300-119-オウル" = "うぅ、暴力反対……。"
"90001300-120-アイン" = "あ、あうう……ご、ごめんなさい！#n全部私が悪いので、喧嘩しないでください！"
"90001300-121-アイン" = "わ、私も、イェソドちゃんが突破されないように、願っていますが……。"
"90001300-122-アイン" = "そ、それでも、ちゃんと……言葉で聞いておきたいんです……。"
"90001300-123-アイン" = "最悪の場合を、想定すべき……ですから。"
"90001300-124-アイン" = "なので、ソフ……お話、してくれませんか……？"
"90001300-125-マルクト" = "ソフ。我からもお願いします。"
"90001300-126-ソフ" = "お姉様まで……。"
"90001300-127-ソフ" = "はあ……分かった。#nもしも、イェソドも突破された場合――"
"90001300-128-ソフ" = "多次元バリアを解除して、その動力を鋼鉄大陸の全システムに振り分けるよ。"
"90001300-129-オウル" = "……そう、なりますよね。"
"90001300-130-ソフ" = "多次元バリアは維持するだけで、とてつもない動力を消耗するからね。"
"90001300-131-オウル" = "……鋼鉄大陸の拡張とキヴォトスの侵食が予定通りだったら、この手に頼る必要もなかったけど。"
"90001300-132-ソフ" = "あいつらは、鋼鉄大陸にたどり着く可能性が高いんでしょ？"
"90001300-133-ソフ" = "しかも一度、多次元バリアを突破してる。"
"90001300-134-アイン" = "ど、どのようにして突破したのかは……わ、分かりませんが……。"
"90001300-135-オウル" = "一度成功している以上、二度目も想定しておくべきかと。"
"90001300-136-ソフ" = "でも、鋼鉄大陸の全システムと対峙するのは初めてだから。"
"90001300-137-ソフ" = "……まあ、私たちだって全システムを稼働させるのは、初めてだけど。"
"90001300-138-ソフ" = "どっちにしろ、多次元バリアを維持するよりも、鋼鉄大陸の機能を解放して迎え撃ったほうが、勝算はあると思う。"
"90001300-139-オウル" = "つまり、イェソドが突破された瞬間――"
"90001300-140-ソフ" = "……うん。"
"90001300-141-ソフ" = "――鋼鉄大陸は、戦場と化す。"
"90001300-142-マルクト" = "……。"
"90001300-143-マルクト" = "アイン、ソフ、オウル、少し外に出てみませんか？"
"90001300-144-アイン" = "外に、ですか……？"
"90001300-145-マルクト" = "こういう時は、気分転換をするものらしいですから。"
"90001300-146-ソフ" = "う、うん……お姉様がそう言うなら。"
"90001300-147-アイン" = "わ、わぁ……。"
"90001300-148-ソフ" = "ここまで……来たんだね。"
"90001300-149-オウル" = "……こんな気持ちでこの景色を眺めることになるとは、思いもしませんでした。"
"90001300-150-アイン" = "えへへ。みんな、ちゃんといますよ。#nケテルちゃんも、コクマーちゃんも……それに、ビナーちゃんも。"
"90001300-151-ソフ" = "ケセドにゲブラ、ティファレトもいずれ……って、ゲブラは本当に氷が好きなんだね。"
"90001300-152-オウル" = "ネツァクは……まあ、目に見えるすべてがネツァクですから。#nあそこには、ホドとイェソドが……。"
"90001300-153-オウル" = "それと、[ruby=お姉様]マルクト[/ruby]も。"
"90001300-154-ソフ" = "……。"
"90001300-155-アイン" = "あ、あの、お姉様……。"
"90001300-156-アイン" = "どうして、外の景色を……？"
"90001300-157-マルクト" = "気分転換、ですよ。"
"90001300-158-マルクト" = "悩んだ時には、一度立ち止まって深呼吸することも必要です。"
"90001300-159-マルクト" = "自分たちの目的に立ち返ることで、今なにをすべきか自然と分かるようになるものですから。"
"90001300-160-ソフ" = "……！"
"90001300-161-マルクト" = "アイン、ソフ、オウル。"
"90001300-162-マルクト" = "あなた達と過ごしてきた時間は、決して無駄ではありませんでした。"
"90001300-163-マルクト" = "いえ、言い方が違いますね。とても……感謝しています。#nだから――"
"90001300-164-マルクト" = "――怖がらず、自信を持ってください。"
"90001300-165-マルクト" = "これは、あなた達が選び、掴んだ結果。"
"90001300-166-マルクト" = "あなた達の力で到達した場所です。"
"90001300-167-マルクト" = "そして――あの方の意を継ぎ、すべての約束が成就される場所でもあります。"
"90001300-168-マルクト" = "「だから、目を覚ましていなさい。あなた方は、その日、その時を知らないのだから」"
"90001300-169-マルクト" = "この福音に従い、目を覚まし、その日を待つのです。"
"90001300-170-ソフ" = "…………。"
"90001300-171-アイン" = "……お姉様。"
"90001300-172-アイン" = "何が起きたとしても……。"
"90001300-173-ソフ" = "……。"
"90001300-174-ソフ" = "私たちが、何かを犯しても……。"
"90001300-175-オウル" = "お姉様は、私たちのそばにいてくれますか？"
"90001300-176-マルクト" = "もちろんですよ。"
"90001300-177-マルクト" = "新たな天地が開かれ、この身が新しい契約を授かることになったとしても……。"
"90001300-178-マルクト" = "我は、いつまでもアイン、ソフ、オウルの味方です。"
"90001300-179-マルクト" = "ですから、怖がらずにいてほしいのです。"
"90001300-180-マルクト" = "せめてこの瞬間だけは、もっと楽しんでも良いと思いませんか？"
"90001300-181-ケイ" = "波動干渉装置の製作完了。#n輸送船に搭載しました。"
"90001300-182-ヒマリ" = "航路の計算も終わっています。いつでも出航できますよ。"
"90001300-183-モモイ" = "中ボスを倒して次のマップに行く……RPGだとパワーアップイベントが起きるタイミングだよね！"
"90001300-184-アリス" = "はい！新しい装備と、レベルキャップ解放の時です……！"
"90001300-185-ケイ" = "まあ……さっき話した戦闘服なら、移動中でも作れますが……。"
"90001300-186-アリス" = "フィールド専用の防御アイテムですね！#nアリス、楽しみです！"
"90001300-187-リオ" = "戦闘服……そうね、すぐにデザインを起こすわ。"
"90001300-188-ミドリ" = "……！"
"90001300-189-ミドリ" = "リオ会長！ぜひ、私にやらせてください……！"
"90001300-190-ミドリ" = "実際の戦闘服のデザインなんて、なかなかできない経験、なので……！"
"90001300-191-リオ" = "えっ……？"
"90001300-192-モモイ" = "賛成！#nデザインはミドリの得意分野だもんね！"
"90001300-193-ユズ" = "た、たしかに……。"
"90001300-194-ケイ" = "はい、私も大賛成です。"
"90001300-195-リオ" = "で、でも……。"
"90001300-196-ケイ" = "いいですから！"
"90001300-197-リオ" = "……わ、分かったわ。#nでも、作戦遂行のために合理的なものを作るには――"
"90001300-198-トキ" = "それは心配ないと思います、リオ様。"
"90001300-199-トキ" = "アビ・エシュフのデザインには、私の意見が多く反映されていますが、作戦遂行に問題はありませんので。"
"90001300-200-リオ" = "思い出せば、あの頃は時間に余裕がなかったものね。#n今からでもリデザインを――"
"90001300-201-トキ" = "い、いえ！アビ・エシュフのデザインはあれで完璧だと思います！"
"90001300-202-リオ" = "……ヒマリ、貴女の考えは？"
"90001300-203-ヒマリ" = "……。"
"90001300-204-ヒマリ" = "デザインはセンスにも依存する分野ですし……。"
"90001300-205-ヒマリ" = "こういった場合、専門家に任せたほうが合理的だと思いませんか？"
"90001300-206-リオ" = "私には任せられない、ということかしら……？"
"90001300-207-エイミ" = "……。"
"90001300-208-エイミ" = "うーん……。"
"90001300-209-エイミ" = "適材適所だと思うよ、会長。"
"90001300-210-リオ" = "あくまで比較した場合の話だけど。"
"90001300-211-エイミ" = "多分、この中で一番デザインが得意なのはミドリだから。"
"90001300-212-エイミ" = "なら、ここは任せたほうが効率的だと思わない？"
"90001300-213-リオ" = "……。"
"90001300-214-リオ" = "そうね……ええ、分かったわ。#nたしかに、そのほうがより合理的ね。"
"90001300-215-エイミ" = "ありがとうございます、エイミさん……。"
"90001300-216-エイミ" = "ううん、気にしないで。"
"90001300-217-エイミ" = "会長のデザインは、私も心配だし……。"
"90001300-218-リオ" = "！？"
"90001300-219-ヒマリ" = "！？"
"90001300-220" = "[ns] \"あれ、この番号は……？\""
"90001300-221" = "[ns] \"……ユウカ！？\""
"90001300-222-リオ" = "ゆ、ユウカ！？"
