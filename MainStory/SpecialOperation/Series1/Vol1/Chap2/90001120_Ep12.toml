[translation]
"90001120-1" = "第12話;提案"
"90001120-2-トキ" = "そういえばあの時、アリスが大活躍したと聞きます。"
"90001120-3-トキ" = "私が覚えているのは、全てが終わった後にゲーム開発部の皆さんが部室に来たことくらいですが。"
"90001120-4-トキ" = "パーティの提案、2キロバイトのデータ、ロボット型のキーホルダー、適切な雰囲気、感動的なBGM――そして私がメインヒロインになるまで。"
"90001120-5-トキ" = "色々ありました。"
"90001120-6-トキ" = "……ふっ。"
"90001120-7-ヒマリ" = "前半は分かりますが……後半は何ですか？"
"90001120-8-トキ" = "言ってみただけです。"
"90001120-9-エイミ" = "（最近なんかああいうのよく言ってくる気がする……）"
"90001120-10-ヒマリ" = "あの時、ウトナピシュティムの[ruby=もとぶね]本船[/ruby]からアリスが再構築した箱舟は――アリスの「勇者の証」そのものでした。"
"90001120-11-ヒマリ" = "ふふっ。今でも私が付けた名前を覚えています。#n「光の剣：アトラ・ハシースのスーパーノヴァ」。"
"90001120-12-ヒマリ" = "あの時は言わなかったけど……貴女のネーミングセンス、少し変じゃないかしら？"
"90001120-13-リオ" = "あなたにそんなこと言われたくありません！"
"90001120-14-エイミ" = "（懲りないな、この二人は……）"
"90001120-15-ヒマリ" = "こほん。"
"90001120-16-ヒマリ" = "ですが、問題が一つ。#n私たちはアリスが具体的に何をしたのか分かっていません。"
"90001120-17-ヒマリ" = "どのようなメカニズムで、どのプロセスを経て再構築したのか……知る由もなかったのです。"
"90001120-18-リオ" = "そうね……エネルギー源は何だったのか、物質の再構築はどのように行われたのか。"
"90001120-19-リオ" = "原理も何も分からなかった。理解する時間もなかった。"
"90001120-20-リオ" = "私たちにとっては、「一瞬の出来事」だったもの。"
"90001120-21-ヒマリ" = "つまり再現が非常に難しい……あるいは不可能に近いと言えるでしょう。"
"90001120-22-ヒマリ" = "一度きりの奇跡というのは、ロマンチックではありますが。"
"90001120-23-ヒマリ" = "だからこそ、理論や学問の敵でもあります。"
"90001120-24-リオ" = "そうね。学問は再現性があるプロセスだもの。"
"90001120-25-リオ" = "その過程を理解すれば、同じ結果が出せるように作られている。"
"90001120-26-リオ" = "……。"
"90001120-27-リオ" = "私は、アリスと直接話すべきだと思うのだけれど。"
"90001120-28-リオ" = "それは……アリスをここに呼ぶ、と？"
"90001120-29-リオ" = "ええ。アリスに当時を分析、再現してもらうのよ。"
"90001120-30-ヒマリ" = "……本当にそれでいいのですか？"
"90001120-31-リオ" = "それ以外に方法があるのかしら？"
"90001120-32-ヒマリ" = "……アリスを問題解決の「道具」にする、とも解釈できるのだけれど。"
"90001120-33-リオ" = "……そうね。"
"90001120-34-トキ" = "……。"
"90001120-35-エイミ" = "会長……。"
"90001120-36-ヒマリ" = "リオ、二度は言いません。#n私たちは既に一度同じような話をしていますよね。"
"90001120-37-ヒマリ" = "その時はトキが対象で、今はアリス。"
"90001120-38-ヒマリ" = "もちろん清楚な崖の上の一輪の花は、あなたが後悔しようが気にしませんが……"
"90001120-39-ヒマリ" = "同じ過ちを繰り返す様を見せられるのは……愉快なことではありません。"
"90001120-40-リオ" = "そうね……。"
"90001120-41" = "[s] \"……。\""
"90001120-42" = "[ns] \"ねえ、リオ。\""
"90001120-43-リオ" = "……な、なにかしら？"
"90001120-44" = "[ns] \"本当にアリスが必要なのかな？\""
"90001120-45-リオ" = "ごめんなさい。私も100％の確信はないの。#n……可能性の一つと思ってもらって構わないわ。"
"90001120-46-リオ" = "今の話は一旦忘れてちょうだい。#n私の考えが正しいとは限らないもの。"
"90001120-47" = "[s] \"……私がアリスとゲーム開発部に話をしてみるよ。\""
"90001120-48-リオ" = "せ、先生！？"
"90001120-49-ヒマリ" = "先生！？"
"90001120-50-エイミ" = "え、先生？どうしたの？"
"90001120-51-トキ" = "本当に大丈夫なのですか？#nそれは、捉え方によっては……。"
"90001120-52-ヒマリ" = "この事態が……特殊だから？#nそれは……そう、だけれど……。"
"90001120-53-ヒマリ" = "アリスにその言葉を伝えるのは、先生の仕事……？"
"90001120-54" = "[s] \"その代わり、リオに提案したいことがあるんだ。\""
"90001120-55-ヒマリ" = "私に……？"
"90001120-56" = "[s] \"リオも氷河の拠点に来てほしい。\""
"90001120-57-ヒマリ" = "！？"
"90001120-58-トキ" = "会長が、直接！？"
"90001120-59-トキ" = "先生、それは一体……？"
"90001120-60-リオ" = "……。"
"90001120-61-リオ" = "「一緒に責任を負う姿勢」ということかしら……？"
"90001120-62" = "[s] \"その判断は、リオに任せるよ。\""
"90001120-63" = "[ns] \"リオが提案してくれたように。\""
"90001120-64" = "[ns] \"私も、提案しただけだから。\""
"90001120-65-リオ" = "……。"
"90001120-66-リオ" = "分からないわ、先生。#n私は……。"
"90001120-67-リオ" = "私にそんな資格があるのか……。#nまた、間違えてしまうのではないか……。"
"90001120-68-トキ" = "……今回リオ様は私たちを助けてくださりました。"
"90001120-69-ヒマリ" = "……。"
"90001120-70-トキ" = "私にはリオ様の言う「正しさ」がどこにあるのかよく分かりません。#n常に間違わない選択が果たして可能なのか。"
"90001120-71-トキ" = "ですが私は……リオ様にもう一度会いたいです。"
"90001120-72-トキ" = "そんな理由では、ダメなのでしょうか？"
"90001120-73-リオ" = "トキ……。"
"90001120-74-ヒマリ" = "リオ。#n今度はあなたが選ぶ番です。"
"90001120-75-ヒマリ" = "あなたの判断基準は理解しています。#nそれは文字通り「合理」といえるでしょう。"
"90001120-76-ヒマリ" = "あなたの合理的な判断の結論を教えて下さい。"
"90001120-77-リオ" = "…………。"
"90001120-78-リオ" = "そうね……通信だけでは限度がある。#nセキュリティの面でも、安全の面でも。"
"90001120-79-リオ" = "電波が妨害されてしまったら全てが狂う可能性もあるわ。#n今回もそうだったように。"
"90001120-80-リオ" = "だから、私は……。"
"90001120-81-ヒマリ" = "はい、決まりですね。"
"90001120-82-ヒマリ" = "では、私たちも氷河の拠点に向かいますので、そこで落ち合いましょう。"
"90001120-83-ヒマリ" = "……わかっ、たわ。"
"90001120-84-エイミ" = "リオ会長……何か気になることでもあるの？"
"90001120-85-リオ" = "そういうわけでは、ないのだけれど……。"
"90001120-86-リオ" = "本当に、私が行っても良いのかしら……？"
"90001120-87-ヒマリ" = "……。"
"90001120-88-ヒマリ" = "氷河拠点の座標を送信します。#n移動手段は……まあ、あなたならとっくに用意しているのでしょう？"
"90001120-89-リオ" = "……ええ。"
"90001120-90-トキ" = "久しぶりにお会いできるのを楽しみにしております、リオ様。"
"90001120-91-リオ" = "トキ。"
"90001120-92-リオ" = "はい。いかがされましたか？"
"90001120-93-リオ" = "今までお疲れ様。#nそして……ありがとう。"
"90001120-94-リオ" = "とんでもございません。"
"90001120-95" = "（皆がそれぞれのことで忙しい中、たまたま一人の時間ができた）"
"90001120-96" = "（せっかくだから……）"
"90001120-97-アロナ" = "あれ？先生？"
"90001120-98-プラナ" = "おかえりなさい先生。どうかされましたか？"
"90001120-99-アロナ" = "え？私たちの顔が見たくなった？"
"90001120-100-アロナ" = "そ、それはとても嬉しいですけど……えへへ……。"
"90001120-101-アロナ" = "でも、何かあったなら言ってくださいね。"
"90001120-102-プラナ" = "肯定。顔色が悪いです。#nもう一度聞きますが、何かありましたか？"
"90001120-103" = "[s] \"私ってそんなに顔に出てる……？\""
"90001120-104-アロナ" = "今までどれだけ一緒にいたと思ってるんですか？"
"90001120-105-アロナ" = "顔に出さないようにしたって、私たちにはわかりますよ！"
"90001120-106-プラナ" = "肯定。今の先生は、知らないかもしれませんが。"
"90001120-107-プラナ" = "私が知っている先生は、そういう方でした。"
"90001120-108-アロナ" = "さあさあ、アロナが何でも聞きますよ！"
"90001120-109-プラナ" = "私もです。"
"90001120-110-アロナ" = "あ、はい。プラナちゃんも！"
"90001120-111" = "[ns1] \"……問題解決を生徒にお願いするのがちょっとね。\"\n[ns2] \"生徒を危険に晒すのが辛いんだ。\""
"90001120-112-アロナ" = "先生……。"
"90001120-113-プラナ" = "……。"
"90001120-114-アロナ" = "で、でも先生！"
"90001120-115-アロナ" = "先生は今までも……何度も、同じような状況を解決してきたじゃないですか！#nとか言ってみたり……えへへ。"
"90001120-116" = "[ns] \"あの時とは少し違う気がするんだ。\""
"90001120-117-アロナ" = "え？あの時は、既に起こったことを、何とかするために動いてたけど……"
"90001120-118-プラナ" = "今回は、先生のせいで生徒が危険に晒されるかもしれない、と。"
"90001120-119-プラナ" = "納得。ですが、それが最善策なのですよね？"
"90001120-120" = "[ns3] \"そうだね……。\"\n[ns4] \"でも、そのせいで生徒たちが危険な目に遭うのなら。\""
"90001120-121" = "[ns] \"私は、彼らと何が違うんだろうなって。\""
"90001120-122-アロナ" = "……。"
"90001120-123-プラナ" = "……。"
"90001120-124" = "[ns] \"あぁ、もう！急にめっちゃくちゃ強くならないかな！\""
"90001120-125-アロナ" = "せ、先生？"
"90001120-126-プラナ" = "理解不能。急にどうされたんですか、先生。"
"90001120-127" = "[s5] \"いや、その……ほら！\"\n[s6] \"空も飛べたり？バリアだって何だって、全部突破して！\""
"90001120-128" = "[ns7] \"名もなき神だのデカグラマトンだのぜーんぶ！\"\n[ns8] \"一気に解決できる能力が私にあったら良かったな……って！\""
"90001120-129-アロナ" = "ど、どうしたんですか……？"
"90001120-130-プラナ" = "混乱。理解できません。詳細な説明を要求します。"
"90001120-131" = "[ns] \"ごめん、大丈夫。言ってみただけだから。\""
"90001120-132" = "[log]生徒たちを……よろしく、お願いします。[/log]"
"90001120-133" = "[ns] \"やるしかないか……よし！\""
"90001120-134" = "[ns9] \"やれること全部やって！最後まで足掻いて！\"\n[ns10] \"それでもダメだったら！\""
"90001120-135-アロナ" = "だ、ダメだったら？"
"90001120-136" = "[ns11] \"……この話はまた今度ね！\"\n[ns12] \"まだどうなるか分からないからね！\""
"90001120-137-アロナ" = "せ、先生？本当に大丈夫……ですよね？"
"90001120-138-プラナ" = "疑問、困惑。先生のメンタルチェックを要請します。"
"90001120-139" = "[s] \"大丈夫！大丈夫！\""
"90001120-140-アロナ" = "な、撫でてくださるのは嬉しいですけど……あうぅ……。"
"90001120-141-プラナ" = "混乱。先生の意図が分かりません。"
"90001120-142" = "（そうしてずっと二人を撫でて）"
"90001120-143" = "（眠りについたのを確認してから、そっと離れた）"
"90001120-144" = "次回;出発"
