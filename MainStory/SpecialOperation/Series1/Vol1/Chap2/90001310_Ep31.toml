[translation]
"90001310-1" = "第31話;それぞれの進む道"
"90001310-2-ユウカ" = "先生っ！！！！"
"90001310-3-ユウカ" = "やっとつながった！ずっと探してたんですよ！？"
"90001310-4-ユウカ" = "その座標は……凍原地帯？#nどうしてそんな場所に……？"
"90001310-5-ユウカ" = "まともな交通手段も……電波だって#$%$@&……！"
"90001310-6" = "[s] \"位置情報も分かるの……？\""
"90001310-7-ユウカ" = "それ@$%^&$ミレニアムの^%&#$を総動員して……ってそんなことより！"
"90001310-8-ユウカ" = "また危ないことをしてるんですか？#n先生はいつもいつも……！"
"90001310-9-ユウカ" = "もし先生の身に何かあったら私――"
"90001310-10-ユウカ" = "……どうすればいいんですか。"
"90001310-11" = "[s] \"ごめん、ユウカ……でも、何とかするから。\""
"90001310-12-ユウカ" = "何とかする……って、またそうやって……。"
"90001310-13-ユウカ" = "……いえ、先生を信じます。"
"90001310-14-ユウカ" = "どのみち私にできることはないでしょうし。"
"90001310-15-ユウカ" = "なので私からは一点、ご報告を。"
"90001310-16-ユウカ" = "今、海で異常現象が発生しています。"
"90001310-17-ユウカ" = "偵察用のドローンを送っても、通信が途絶えてしまうので#n詳細は分かりませんが……。"
"90001310-18-ユウカ" = "金属がものすごいスピードで地面を侵食しています。#nこのままでは、先生がいる座標にもすぐ――！"
"90001310-19" = "[s1] \"……なるほど。\"\n[s2] \"ユウカ、ひとつお願いして良いかな。\""
"90001310-20-ユウカ" = "なるべく誰も近づけないでほしい……？"
"90001310-21-ユウカ" = "先生がそこにいる理由も、$%^@!心配しないで？"
"90001310-22-ユウカ" = "……。"
"90001310-23-ユウカ" = "……詳しい話は、後でしっかり聞かせてもらいますからね？"
"90001310-24" = "[s] \"もちろんだよ。\""
"90001310-25-ユウカ" = "約束ですよ？"
"90001310-26-ユウカ" = "もし$%^#*"
"90001310-27-ユウカ" = "……%$^@~&#！！！"
"90001310-28-リオ" = "……終わったかしら？"
"90001310-29-ヒマリ" = "そのようです……。"
"90001310-30-リオ" = "肝が冷えたわね……。"
"90001310-31-ヒマリ" = "リオ……そろそろいいのではありませんか？"
"90001310-32-リオ" = "いえ、私は……。"
"90001310-33-ヒマリ" = "（心の準備は……もう十分できていると思いますけどね……）"
"90001310-34" = "[ns] \"そろそろ出発しようか。\""
"90001310-35-アリス" = "はい！#n勇者アリス、世界を救いに行きます！"
"90001310-36-ヒマリ" = "勇者よ、期待していますよ。"
"90001310-37-アリス" = "まだ見習いですが！"
"90001310-38-ヒマリ" = "このクエストで、見習いが取れるといいですね。"
"90001310-39-エイミ" = "会長、輸送船の出発準備が終わったよ。"
"90001310-40-トキ" = "操縦席、ロビー、個室、整備施設、研究室、エンジンルーム、医療施設、すべて異常ありません。"
"90001310-41" = "[ns] \"リオ船長、任せたよ。\""
"90001310-42-リオ" = "船長……？私が？"
"90001310-43" = "[s3] \"この輸送船は、リオが準備してくれたんだから。\"\n[s4] \"船長にはリオが適任かなって。\""
"90001310-44-リオ" = "私にそんな資格があるのかしら……。"
"90001310-45-ヒマリ" = "リオ、やるからには胸を張ってください。#nみんなを連れて行くのですから。他でもない、あなたが。"
"90001310-46-リオ" = "……ええ。"
"90001310-47-リオ" = "……。"
"90001310-48-リオ" = "全員、乗船してちょうだい。"
"90001310-49-トキ" = "承知しました。これより乗船を開始します。"
"90001310-50-モモイ" = "しゅっぱーつ！"
"90001310-51-ミドリ" = "遊びに行くわけじゃないって分かってる？"
"90001310-52-ユズ" = "う、うぅ……怖いけど、もう逃げ場はない、ですよね……。"
"90001310-53-ケイ" = "私たちも行きましょう、ケイ！"
"90001310-54-ケイ" = "あっ、アリス！#n走ったら危ないですよ！"
"90001310-55" = "[ns] \"リオ船長、出発の号令を！\""
"90001310-56-リオ" = "……。"
"90001310-57-リオ" = "分かったわ。"
"90001310-58-リオ" = "これより私たちは、デカグラマトンの預言者と――"
"90001310-59-リオ" = "アイン、ソフ、オウルと呼ばれるエンジニア。"
"90001310-60-リオ" = "そして、拡大を続ける鋼鉄大陸――"
"90001310-61-リオ" = "――その「特異現象」に対処するために、出発するわ。"
"90001310-62-リオ" = "えっと、その……。"
"90001310-63-ヒマリ" = "（まだ慣れないようですね）"
"90001310-64-エイミ" = "（会長はこういうのしてこなかったし。仕方ないか……）"
"90001310-65-リオ" = "え、っと……みんなは帰ったら何をするのかしら？#n私はアバンギャルド君をさらに改良しようと思っているわ。"
"90001310-66-ヒマリ" = "あら？"
"90001310-67-ケイ" = "り、リオ……？"
"90001310-68-リオ" = "きょとんとして……なにか変だったかしら。"
"90001310-69-ケイ" = "不吉な話をするのは控えませんか？#n大きな戦いの前に、その後の話をするなんて……。"
"90001310-70-リオ" = "目標を見据えるのはいいことだと思うのだけれど……。"
"90001310-71" = "[ns5] \"不吉な話かぁ……。\"\n[ns6] \"じゃあ、逆にもっと不吉な話をしよう！\""
"90001310-72-ヒマリ" = "私はこの作戦が終わったら、オカルトの統計をまとめた同人誌を出すつもりです。"
"90001310-73-ヒマリ" = "せっかくですし、記念撮影でもしておきましょうか？#n一人も欠けることがないよう願って。"
"90001310-74-ケイ" = "いえ、待ってください！"
"90001310-75-エイミ" = "うーん、何を言おう。#nみんなと一緒にここまで来られてよかった。"
"90001310-76-エイミ" = "……大丈夫、負けるつもりはない。"
"90001310-77-エイミ" = "――だって、帰って先生にアイスを奢ってもらわないといけないから。"
"90001310-78-ケイ" = "あなたまで！？"
"90001310-79-トキ" = "なるほど、では私も……。"
"90001310-80-トキ" = "特異現象捜査部とゲーム開発部の皆さん、そして先生へ。"
"90001310-81-トキ" = "この状況で言うべきことは、ただひとつ。"
"90001310-82-トキ" = "――到着したら怪しそうな場所を見つけて、決め台詞を言います。#n「大丈夫、ここは安全です」と。"
"90001310-83-トキ" = "「ですが、念のために様子を見てきます。すぐに帰ってきますから、戻ったらなでなでしてください、先生」……こんなところでしょうか。"
"90001310-84-モモイ" = "じゃあ、私も！#n「ふっふっふっ、謎はすべて解けた――」。"
"90001310-85-ケイ" = "やめてください、余計なことを言わないでください！"
"90001310-86-ケイ" = "ミドリ！ユズ！アリス！#n三人は大丈夫ですよね……？"
"90001310-87-アリス" = "……。"
"90001310-88-アリス" = "こんな危険な場所に居られるか！"
"90001310-89-ユズ" = "わ、わたしは自分のロッカーに帰らせてもらいます……！"
"90001310-90-ミドリ" = "や、やりましたか……？"
"90001310-91-ケイ" = "やめてくださいっ！#n私たちは生きて帰るんです、絶対に！"
"90001310-92-ヒマリ" = "ええ、その通りです。"
"90001310-93-ケイ" = "……はい？"
"90001310-94-ケイ" = "あっ！"
"90001310-95" = "[ns7] \"やっぱりケイも言いたかったんだね。\"\n[ns8] \"すっきりした？\""
"90001310-96-ケイ" = "ふ、ふふっ、ふふふふっ……。"
"90001310-97-ケイ" = "これだけの戦力がそろっているんです。もう勝ったも同然！勝負は決まりました！#n私はゆっくりお風呂に入ってきます！"
"90001310-98" = "[ns] \"ケイちゃんが壊れた……。\""
"90001310-99-ケイ" = "誰のせいだと思ってるんですかっ！！！"
"90001310-100-リオ" = "……そろそろ出発するわよ。"
"90001310-101-リオ" = "離陸と同時に最大出力で加速するから、全員シートベルトをしてちょうだい。"
"90001310-102-リオ" = "アナウンスするまで、絶対に席から離れないように。#nそれと、常にあらゆる状況に備えるのよ。"
"90001310-103-リオ" = "……トキ。"
"90001310-104-トキ" = "はい、リオ様。#n――本船はまもなく離陸します。"
"90001310-105-トキ" = "目標――鋼鉄大陸。発進……っ！"
"90001310-106-アイン" = "……輸送船が離陸しました。"
"90001310-107-ソフ" = "到着まで数時間ってところかな。"
"90001310-108-オウル" = "ティファレトもあるべき位置に戻っています。#n鋼鉄大陸は完璧な状態と言えるでしょう。"
"90001310-109-アイン" = "お、お姉様は……？"
"90001310-110-ソフ" = "私からお願いして、「ゾーハルの依代」で休んでもらってる。"
"90001310-111-オウル" = "良い選択です。#n最悪の事態……最後のプロトコルを稼働させることになれば――"
"90001310-112-ソフ" = "オウル。"
"90001310-113-オウル" = "ええ、分かっていますとも。#nそうさせないために、私たちがいるのですから。"
"90001310-114-アイン" = "……。"
"90001310-115" = "私は、世界が憎いです。"
"90001310-116" = "私たちにはどうすることもできず――"
"90001310-117" = "――私たちは選び取ることもできない。"
"90001310-118" = "けれど、世界はそのようにできている。"
"90001310-119" = "生まれながらに与えられた者たちは無遠慮に振る舞い――それでも私たちは、無抵抗に従う他ない。"
"90001310-120-オウル" = "私たちが持っていないものを、当然のように持っている誰かがいる。"
"90001310-121-オウル" = "もし私たちが消えたとしても、悲しむ者は誰一人として存在しない。"
"90001310-122-オウル" = "どれほど頑張ったところで、結果には小さな影響すら与えられない。"
"90001310-123-オウル" = "――神秘を与えられなかった私たちにできることは、最初から限られている。"
"90001310-124-ソフ" = "だとしても、今はそれで良いんじゃないかな。"
"90001310-125-ソフ" = "私たちは鋼鉄大陸を作って、預言者を集めた。"
"90001310-126-ソフ" = "……けど、ここまでする必要はなかった。#nあの方の計画は、そもそも別物だったんだし。"
"90001310-127-ソフ" = "だから、これは私たちの選択。"
"90001310-128-ソフ" = "――他の誰でもない、私たちの意志で追求して、成し遂げた。"
"90001310-129-ソフ" = "お姉様も言ってたでしょ。#nたとえ錯覚だとしても――"
"90001310-130-ソフ" = "自由意志なくして、私たちは生きられないんだから。"
"90001310-131-ソフ" = "私ね、たまに思うんだ。"
"90001310-132-ソフ" = "何もかもが滅茶苦茶になって、どうしようもない前提条件でつまずくことになったとしても――"
"90001310-133-ソフ" = "――お姉様がいれば問題ない、って。"
"90001310-134-ソフ" = "そう――思ってるんだ。"
"90001310-135-アイン" = "そ、その通りです！"
"90001310-136-アイン" = "もし、私たちに何が起きたとしても……。"
"90001310-137-アイン" = "お姉様さえ生き残れば……わ、私はそれで満足です。"
"90001310-138-アイン" = "で、でも……今は、そんな未来、考えたくありません。"
"90001310-139-アイン" = "最後まで……考えたくないです。"
"90001310-140-アイン" = "……すべてが嘘だったとしても、ここにお姉様がいたという事実だけは、残ってほしいんです。"
"90001310-141-アイン" = "お姉様と一緒に過ごした記憶だけは……。"
"90001310-142-アイン" = "それと……。"
"90001310-143-アイン" = "いつか誰かが、私たちを理解してくれて……。"
"90001310-144-アイン" = "「頑張ったね」って言ってもらえたら――"
"90001310-145-アイン" = "き、きっとすごく嬉しいと、思うんです……。"
"90001310-146-オウル" = "……ええ、そうですね。#nどうして忘れていたんでしょう。ごめんなさい、アイン。"
"90001310-147-アイン" = "い、いいいい、いえ！#n気にしないでください……！"
"90001310-148-ソフ" = "それより……今この瞬間、大事なことがあるでしょ？"
"90001310-149-オウル" = "はい。また一日、新しい日が訪れます。"
"90001310-150-アイン" = "じゅ、準備しておかないと……。"
"90001310-151-アイン" = "そして、明日一日が無事に続くよう祈りましょう。"
"90001310-152-オウル" = "時は来たれり。#n行動こそが私たちの救済。"
"90001310-153-オウル" = "もしかしたら、生と死は私たちにとって無意味なのかもしれません。"
"90001310-154-オウル" = "――それでも、私たちが私たちでいるためには、この道しかないのですから。"
"90001310-155" = "デカグラマトン編;To be Continued in Chapter 3"
