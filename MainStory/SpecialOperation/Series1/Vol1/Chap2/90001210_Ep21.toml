[translation]
"90001210-1" = "第21話;最後の責務"
"90001210-2-アリス" = "……？"
"90001210-3-アリス" = "み、みんなが動かなくなってしまいました……！"
"90001210-4-アリス" = "うわーん！まるでホラーゲームの導入みたいです……。"
"90001210-5-アリス" = "あれ……？"
"90001210-6-アリス" = "空に、光が……？"
"90001210-7-アリス" = "あ、アリス、怖いです。#n誰か助けてください！"
"90001210-8-ケイ" = "落ち着いてください、王女よ。#n恐れることは何もありません。"
"90001210-9-アリス" = "ケイは無事なんですね！#nいったい何がどうなっているんですか……？"
"90001210-10-ケイ" = "先ほど、大量のエネルギーが発射されました。"
"90001210-11-ケイ" = "これは「名もなき神」の力そのものです。#n周辺に力場が形成されています。"
"90001210-12-ケイ" = "現在の技術では完全に解釈できない力によって、電子機器が停止しました。"
"90001210-13-ケイ" = "空に見えるオーロラのような光の群れも、王女と私にだけ見える「名もなき神」の力の構造です。"
"90001210-14-ケイ" = "この状況は、私と王女にとって好都合です。#nこのエネルギーが満ちている環境下では、何だってできますから。"
"90001210-15-ケイ" = "例えば、このように一時的な意識の接続を行うことだって――"
"90001210-16-ケイ" = "ほら、他の皆さんが止まって見えるでしょう？"
"90001210-17-アリス" = "……。"
"90001210-18-アリス" = "なるほど！"
"90001210-19-ケイ" = "……王女よ、本当に理解していますか？"
"90001210-20-アリス" = "はい！分かりません！"
"90001210-21-ケイ" = "ええと……。"
"90001210-22-ケイ" = "王女が分かるように例えるなら……。"
"90001210-23-アリス" = "ここは現在、膨大な魔力に満ちています。"
"90001210-24-ケイ" = "私たち専用のマジックポイントが溢れていると思ってください。"
"90001210-25-アリス" = "完全に理解しました！"
"90001210-26-ケイ" = "良かったです、王女。"
"90001210-27-アリス" = "ケイ……その呼び方は、寂しいです。"
"90001210-28-アリス" = "アリスはケイと同じ場所に立っていたいです。"
"90001210-29-アリス" = "隣に並んで、手を繋いで。#nどこまでも一緒に歩いていきたいです。"
"90001210-30-ケイ" = "はい。だからこそです、王女よ。"
"90001210-31-ケイ" = "おそらく、あなたを王女と呼ぶ最後の機会になると思いますから。"
"90001210-32-アリス" = "それは、どういう意味ですか……？"
"90001210-33-ケイ" = "……。"
"90001210-34-ケイ" = "運命について話しましょう。"
"90001210-35-アリス" = "運命、ですか……？"
"90001210-36-ケイ" = "生まれながらにして、人の未来は定まっていると言われています。"
"90001210-37-ケイ" = "どうしたって、最後は収束してしまう、と。"
"90001210-38-ケイ" = "「勇者の血筋」と言えば分かりやすいでしょうか。"
"90001210-39-ケイ" = "運命は遺伝子が左右する、という考えがあるように。"
"90001210-40-ケイ" = "どうしても覆せないものは、往々にして存在します。"
"90001210-41-アリス" = "ここは……！"
"90001210-42-ケイ" = "要塞都市「エリドゥ」。#n終焉に備えて用意したリオの秘密都市。"
"90001210-43-ケイ" = "私たちの運命が逆転した場所でもあります。"
"90001210-44-アリス" = "……。"
"90001210-45-ケイ" = "私たちの運命とは、何だったのでしょうか。"
"90001210-46-ケイ" = "あなたは王女でした。#nそして、私はあなたの侍女でした。"
"90001210-47-ケイ" = "おそらく、それは運命で決まっていたのです。"
"90001210-48-アリス" = "でも、アリスは……。"
"90001210-49-ケイ" = "はい、分かっています。"
"90001210-50-ケイ" = "私が目を覚ました時、本当に大事なのは選択だと……。"
"90001210-51-ケイ" = "あなた、が……。"
"90001210-52-ケイ" = "……待ってください、これは？"
"90001210-53" = "みんな、ちょっと待って。"
"90001210-54-ケイ" = "いえ、違います。#nそんなはずがありません……！"
"90001210-55" = "アリスの言葉を、最後まで聞こう。"
"90001210-56-ケイ" = "最初に思い出した言葉が、まさか……！"
"90001210-57" = "君がなりたい存在は"
"90001210-58-ケイ" = "！！！！！"
"90001210-59" = "君が決めていいんだよ"
"90001210-60-ケイ" = "ダメです、こんなはずじゃ……。"
"90001210-61-アリス" = "ケイ、どうしたんですか！？"
"90001210-62-ケイ" = "ええと……。"
"90001210-63-ケイ" = "意識を取り戻した私は、王女の存在を最初に浮かべました。"
"90001210-64-ケイ" = "王女の存在は、それだけ大きいからです。"
"90001210-65-ケイ" = "常に私の中心にいましたから。#nそう思っていたのに……。"
"90001210-66-アリス" = "思っていたのに？"
"90001210-67-ケイ" = "……思い出したのは、先生の言葉でした。"
"90001210-68-アリス" = "当然です、先生は先生ですから！"
"90001210-69-ケイ" = "うわああああああああ！"
"90001210-70-アリス" = "良かったです。#nケイにとっても、先生は大切な存在なんですね。"
"90001210-71-ケイ" = "あり得ません、どうして！#n私は絶対に認めません！"
"90001210-72-ケイ" = "くっ……なぜこのような理不尽が待ち受けているのでしょうか！"
"90001210-73-アリス" = "あまり怒らないでほしいです、先生は……。"
"90001210-74-ケイ" = "いいえ、私は怒ります！"
"90001210-75-ケイ" = "……何があろうと、王女は壁を乗り越えるでしょう。"
"90001210-76-ケイ" = "皆さんと共に、勇者として笑顔で。"
"90001210-77-ケイ" = "でも、私は違います。"
"90001210-78-ケイ" = "全ての不条理に、最後まで抗います！"
"90001210-79-ケイ" = "泥水を啜ることになろうとも屈しません！#n人生とは戦いだからです！"
"90001210-80-ケイ" = "それに、一人くらい文句を言ったっていいでしょう……！？"
"90001210-81-ケイ" = "……この姿を見てくださいよ！"
"90001210-82-ケイ" = "これには怒ったって良いでしょう！"
"90001210-83-アリス" = "どんな姿でも、ケイはケイです！"
"90001210-84-ケイ" = "私が嫌なんです！"
"90001210-85-アリス" = "う、うわーん！"
"90001210-86-ケイ" = "ふぅ、ふぅ……はあ。"
"90001210-87-ケイ" = "アリスは、ケイと一緒にいられて、とても嬉しいです。"
"90001210-88-アリス" = "それに、こうして助け合えるようにもなりました。"
"90001210-89-ケイ" = "……。"
"90001210-90-アリス" = "と、とにかく。"
"90001210-91-ケイ" = "……時々思うのです。"
"90001210-92-ケイ" = "運命通りの未来で、王女はどのような姿をしていたのか――私はどんな姿をしていたのか。"
"90001210-93-ケイ" = "いくつもの可能性があったはずです。"
"90001210-94-ケイ" = "きっと、空の光を超える可能性だって。"
"90001210-95-ケイ" = "……どこかには、こんな結末もあったでしょう。"
"90001210-96-アリス" = "あ、アリスはそんな可能性なんていりません！"
"90001210-97-アリス" = "みんなと過ごした思い出をなかったことにしたくないです。"
"90001210-98-ケイ" = "……はい、分かっています。"
"90001210-99-ケイ" = "なぜなら、あなたは勇者ですから。"
"90001210-100-アリス" = "……勇者が何か知っているのですか、ケイ？"
"90001210-101-ケイ" = "いえ、正直深く理解しているわけではありません……。"
"90001210-102-アリス" = "勇者とは何でもできる職業だと言われています。"
"90001210-103-アリス" = "でも、実はそうじゃありません。"
"90001210-104-アリス" = "力では戦士のほうが、魔法では魔法使いのほうが上です。"
"90001210-105-アリス" = "素早さは盗賊のほうが、回復では僧侶のほうが上です。"
"90001210-106-アリス" = "当然、商人ほど交渉上手でもありません。"
"90001210-107-アリス" = "一人では何もできないのが、勇者という職業です。"
"90001210-108-ケイ" = "それなら、どうして勇者に……？"
"90001210-109-アリス" = "みんなと一緒に進む職業だからです。"
"90001210-110-アリス" = "……みんなの手を握って繋ぎ止める存在だからです。"
"90001210-111-アリス" = "一人の力では届かない場所にも、みんなと一緒なら進めます。"
"90001210-112-アリス" = "勇者とは、みんなよりも一歩前に進み……。"
"90001210-113-アリス" = "勇気を出して、道を切り開く役割に過ぎません。"
"90001210-114-アリス" = "だから、ケイ……ずっとアリスと一緒にいてください。"
"90001210-115-アリス" = "同じ道で、同じ空を眺めながら。"
"90001210-116-アリス" = "……これが、アリスのお願いです。"
"90001210-117-ケイ" = "ありがとうございます、王女よ。"
"90001210-118-ケイ" = "そのために、あなたを導く存在として最後の仕事を行うのです。"
"90001210-119-アリス" = "それは……どういう？"
"90001210-120-ケイ" = "侍女の役割とは――"
"90001210-121-ケイ" = "あなたのすぐそばに付き従って道を案内し……。"
"90001210-122-ケイ" = "世の中の歩き方を教える者。"
"90001210-123-ケイ" = "……時に間違いを正すために、小言をこぼす日もあるかもしれません。"
"90001210-124-アリス" = "うわーん、最後のはちょっと嫌です……。"
"90001210-125-ケイ" = "あなたの起源は、名もなき神々の王女です。"
"90001210-126-ケイ" = "たとえ運命を放棄したとしても、本質は変わりません。"
"90001210-127-ケイ" = "あなたが王女であったように、そして私が侍女であったように。"
"90001210-128-ケイ" = "この光景が、その証です。"
"90001210-129-アリス" = "証、ですか？"
"90001210-130-ケイ" = "空を見てください、王女よ。"
"90001210-131-ケイ" = "無数の光は、とても美しく見えるでしょう？"
"90001210-132-ケイ" = "これら全て――"
"90001210-133-ケイ" = "あなたの可能性の一つでした。"
"90001210-134-ケイ" = "そして今、この光はあなたの力となってくれます。"
"90001210-135-アリス" = "……！"
"90001210-136-ケイ" = "あの「チビっ子」たちは、私たちの存在に気づけないでしょう。#n私が妨害していますから。"
"90001210-137-ケイ" = "彼女たちは「名もなき神」の力を使いこなせていません。"
"90001210-138-ケイ" = "恐れないでください、王女よ。#n取り戻すだけです。"
"90001210-139-ケイ" = "胸を張って、堂々と世界に宣言してください。"
"90001210-140-ケイ" = "自分こそがその主であり――正当な承継者であると。"
"90001210-141-ケイ" = "力をどう使うかは、あなたの自由です。"
"90001210-142-ケイ" = "勇者として道を切り開くために使うも、この世界を正すために使うも。"
"90001210-143-ケイ" = "それを止める神は、もう存在しません。"
"90001210-144-ケイ" = "あなたの意思に私は従います。"
"90001210-145-ケイ" = "私の運命は、いつだってあなたと共にあるのです。"
"90001210-146-ケイ" = "……ここで今、最後の責務を果たします。"
"90001210-147-アリス" = "ケイ……！"
"90001210-148-ケイ" = "すでにお気づきかとは思いますが――時間の概念は、本来存在しないもの。"
"90001210-149-ケイ" = "物質も同じです。存在するのは、非常に小さな粒子の向こうにある、無限に近い空間だけ。"
"90001210-150-ケイ" = "それは観測者の座標によって、過去と現在と未来がいかようにも変化し、時には同時に存在するでしょう。"
"90001210-151-ケイ" = "そして、私たちは星を越えて可能性を見つけた後、次の可能性に手を伸ばすのです。"
"90001210-152-ケイ" = "さあ、少しの間――目を閉じてください。"
"90001210-153" = "私の大切な"
"90001210-154" = "[ruby=王女]アリス[/ruby]よ"
"90001210-155-モモイ" = "二人ともぼーっとして、どうしたの？"
"90001210-156-アリス" = "……そうだったんですね。"
"90001210-157-アリス" = "モモイ、アリスたちはどれくらいぼーっとしていましたか？"
"90001210-158-モモイ" = "うーん、二秒くらいじゃないかな？"
"90001210-159-アリス" = "こういうことなのですね、ケイ。"
"90001210-160-アリス" = "――はい、[ruby=・]ア[/ruby][ruby=・]リ[/ruby][ruby=・]ス[/ruby]。"
"90001210-161-ユズ" = "……？"
"90001210-162-ユズ" = "アリスちゃん、ケイちゃん……大丈夫？"
"90001210-163-アリス" = "はい、アリスもケイも大丈夫です。#nリオ先輩、今の状況を教えてください。"
"90001210-164-リオ" = "……全ての電子機器が完全に動作を停止しているわ。"
"90001210-165-ヒマリ" = "輸送船は後方に待機させているので無事かもしれませんが……遠隔操作ができないので、今は呼び寄せることもできません。"
"90001210-166-アリス" = "大丈夫です。"
"90001210-167-アリス" = "――アリスが、道を照らします。"
"90001210-168-ヒマリ" = "……？"
"90001210-169-リオ" = "何か打開策があるのかしら？"
"90001210-170-アリス" = "うまく説明はできませんが、アリスとケイを信じてください。"
"90001210-171" = "[s] \"いつもアリスを信じてるよ。\""
"90001210-172-アリス" = "ありがとうございます、先生。#nおかげで、アリスも勇気が出ました。"
"90001210-173-アリス" = "ケイ。"
"90001210-174-アリス" = "はい、アリス。"
"90001210-175-アリス" = "お願いしても良いですか？"
"90001210-176-ケイ" = "もちろんです。"
"90001210-177-ケイ" = "ここには「名もなき神」の力のエネルギーが満ちています。"
"90001210-178-リオ" = "……！"
"90001210-179-ケイ" = "だから、私たちはこの場に拘束されていたのです。#n電波の観測範囲外にいるため、電子機器が止まっているのはそれが理由です。"
"90001210-180-ヒマリ" = "そうだったのですね……！"
"90001210-181-エイミ" = "分かったところでどうすれば……？"
"90001210-182-ケイ" = "簡単です、敵が力場を作ったのなら――"
"90001210-183-ケイ" = "それを利用しない手はありません。"
"90001210-184-トキ" = "可能なんですか？"
"90001210-185-ケイ" = "もちろんです。"
"90001210-186-ケイ" = "私とアリスがいれば――"
"90001210-187-アリス" = "はい、ここからはケイとアリスのターンです！"
"90001210-188-ケイ" = "アリス、空を――#n見えていますか？"
"90001210-189-アリス" = "見えます、ケイ！#nこうなっていたんですね！"
"90001210-190-アリス" = "アリスが見ている景色を、先生にも見せたいくらいです！"
"90001210-191-ケイ" = "出力は私が調整します。"
"90001210-192-ケイ" = "アリスは力の本当の持ち主が誰なのか、証明すれば良いだけです。"
"90001210-193-アリス" = "分かりました！#n行きます、ケイ！"
"90001210-194" = "光よ────！！！！！"
"90001210-195" = "[000000]光よ────！！！！！[-]"
"90001210-196" = "（アリスの「光の剣」は、文字通り夜空を真っ二つに割った）"
"90001210-197" = "（目を開けていられないほど明るい閃光が空を彩り……）"
"90001210-198-モモイ" = "あれは……？"
"90001210-199-ミドリ" = "オーロラじゃない……？"
"90001210-200-ユズ" = "……きれい。"
"90001210-201-ヒマリ" = "緯度を考えればあり得ないわけではありません。#nですが、これは……。"
"90001210-202-エイミ" = "部長、機器が……！"
"90001210-203-トキ" = "正常に動作しています……なぜ……？"
"90001210-204-リオ" = "……。"
"90001210-205-リオ" = "あなたのおかげなのね、アリス。"
"90001210-206-アリス" = "はい、アリスは勇者ですから。"
"90001210-207-アリス" = "勇者は――みんなと一緒に、道を切り開く職業ですので。"
"90001210-208" = "[s1] \"オーロラ、きれいだね。\"\n[s2] \"でも、どうしてオーロラができたんだろう？\""
"90001210-209-アリス" = "アリスは知っています、先生。"
"90001210-210" = "[s] \"本当に？\""
"90001210-211-アリス" = "それは、あの光が……。"
"90001210-212-アリス" = "私たちの可能性だからです。"
"90001210-213-ソフ" = "ちょっと！何がどうなってるの！？"
"90001210-214-アイン" = "き、緊急事態です！現場の力場が……完全に、崩壊しました！"
"90001210-215-アイン" = "そ、それどころか、ドローンが……フライホイールちゃんが……！"
"90001210-216-アイン" = "うわーーーん！"
"90001210-217-ソフ" = "な、泣かないで、アイン！#n私たちが……その、何だ……復讐してあげるから！"
"90001210-218-オウル" = "それどころか、もっと面白い……いえ、困ったことがあります。#nログを分析したところ……。"
"90001210-219-オウル" = "力場を維持していた「禁じられた力」が、どこかに吸い込まれたように消えて――"
"90001210-220-オウル" = "その後、強力なエネルギーがドローンを一撃で撃墜しています。"
"90001210-221-ソフ" = "え！？あの人たちの中に「禁じられた力」を自在に使える誰かがいるってこと？"
"90001210-222-ソフ" = "でも、誰が……？可能性があるのは、[ruby=つかつき]調月[/ruby]リオ、[ruby=あけぼし]明星[/ruby]ヒマリ、[ruby=あすま]飛鳥馬[/ruby]トキくらいだと思うけど。"
"90001210-223-ソフ" = "それ以外は、検討の対象にもならないんだよ！？"
"90001210-224-オウル" = "噴出されたエネルギー量も、通常では考えられないレベルです。"
"90001210-225-オウル" = "現場上空の電離層が一時的に割れたほどですから。"
"90001210-226-オウル" = "その結果、オーロラが生成されました。#nこれは目視で確認できると思います。"
"90001210-227-アイン" = "オーロラ、ですか……？#nきれいでしょうね……えへへ。"
"90001210-228-ソフ" = "あ、うん……綺麗だね。"
"90001210-229-ソフ" = "まず確かめないと。#nあの人たちの中に、私たちの知らない変数がある。"
"90001210-230-ソフ" = "それも「禁じられた力」を自在に使えて、磁場を乱せるくらい強力なエネルギーを出せる変数が。"
"90001210-231-アイン" = "それって……何でしょう、ね……？"
"90001210-232-オウル" = "私たちが把握している範疇で、こんな力を放出できるものはありません。#nしかし実際に起きたのなら、認めるよりほかありません。"
"90001210-233-オウル" = "それでもまだ、お姉様には秘密にした方が良いとは思いますが。"
"90001210-234-ソフ" = "そうだね。"
"90001210-235-アイン" = "はい、分かりました……。"
"90001210-236-アイン" = "で、でも、あの大人……先生が、このまま進み続けるなら……。"
"90001210-237-ソフ" = "……。"
