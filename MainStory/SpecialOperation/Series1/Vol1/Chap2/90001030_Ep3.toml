[translation]
"90001030-1" = "第3話;二度目の邂逅"
"90001030-2-ヒマリ" = "氷河の痕跡を辿り始めて大分経ちますが……なにもないですね。"
"90001030-3-ヒマリ" = "少し状況を整理してみましょうか。"
"90001030-4-ヒマリ" = "エイミ、画面に出力してください。"
"90001030-5-ヒマリ" = "了解、部長。"
"90001030-6-ヒマリ" = "私たちの今までの行動は、次の3つに分けられます。#nゲブラとの交戦、痕跡の発見、そして追跡。"
"90001030-7-ヒマリ" = "しかし、どの行動もゲブラが何をしていたかを突き止めることには繋がりませんでした。"
"90001030-8-エイミ" = "今までだってそうじゃない？軍需工場だったケセドや、廃墟水没地区を守っていたケテルはちょっと例外だったけど。"
"90001030-9-トキ" = "他と違って、今回はデカグラマトンのエンジニアを名乗る3人が攻撃してきました。"
"90001030-10-ヒマリ" = "ええ。そして、彼女たちは「名もなき神」の力について言及していました。"
"90001030-11-エイミ" = "正確には「禁じられた技術」、だけど。"
"90001030-12-トキ" = "アビ・エシュフにそれが使われていることも把握していましたね。"
"90001030-13-ヒマリ" = "……少し違和感があります。"
"90001030-14-ヒマリ" = "デカグラマトンと「名もなき神」はそれぞれ独立した存在です……#n一度調べてみましたが、この二つに関連性はありませんでした。"
"90001030-15-ヒマリ" = "デカグラマトンのエンジニアが、何故私たちを呼び寄せたのか……そして、何を求めているのか。"
"90001030-16-ヒマリ" = "一つ確かなのは、彼女たちが「お姉様」のために動いているということです。"
"90001030-17-ヒマリ" = "そして、そのために戦闘データを収集している……それが無名の司祭と名もなき神々の技術が反映されている「アビ・エシュフ」なのか……。"
"90001030-18-ヒマリ" = "それとも連邦生徒会長の残したオーパーツ、「シッテムの箱」か……。"
"90001030-19" = "[s] \"……。\""
"90001030-20-ヒマリ" = "もしくは、天才清楚系病弱美少女ハッカーである私、[ruby=あけぼし]明星[/ruby]ヒマリの恐るべき「全知」か……。"
"90001030-21-エイミ" = "（それは違うと思うけど）"
"90001030-22-ヒマリ" = "……ここからは私の仮説ですが。"
"90001030-23-ヒマリ" = "氷河に私たちを呼び寄せた理由が「お姉様」という存在を完成させるためだとしたら……。"
"90001030-24-ヒマリ" = "アビ・エシュフに関する情報――「名もなき神」の力を求めての行動だと推測できます。"
"90001030-25-トキ" = "なるほど……それであればたしかに辻褄が合います。"
"90001030-26" = "[s] \"アビ・エシュフの情報？\""
"90001030-27-トキ" = "はい。といっても、あくまで仮定の話ですが。"
"90001030-28-トキ" = "すでに向こうは「名もなき神」の力の実態を知っていたのでしょう。"
"90001030-29-トキ" = "であれば、次に必要となるのは……。"
"90001030-30-ヒマリ" = "そう……「既存知識と実データの比較検証」。"
"90001030-31-エイミ" = "つまり、私たちと戦ってアビ・エシュフの能力や戦闘情報のデータを取っていたってこと？"
"90001030-32" = "[s] \"じゃあ、これまでの戦闘は……。\""
"90001030-33-ヒマリ" = "はい。全て相手の思惑通り……ということになります。"
"90001030-34-ヒマリ" = "集めたデータで何をしようとしていたかまでは、流石に分かりません。"
"90001030-35-ヒマリ" = "そもそも、この話自体があくまで仮説ですし……。"
"90001030-36-ヒマリ" = "ですが、それが正しければ、ゲブラのこれまでの行動も説明がつきます。"
"90001030-37-ヒマリ" = "うーん……ゲブラの件も気になるけど、別の預言者がいるかもしれないんだよね？"
"90001030-38-エイミ" = "こっちは何の目的で氷河にいるんだろう？"
"90001030-39-ヒマリ" = "ゲブラとは異なる目的を持っている可能性が高いかと。"
"90001030-40-トキ" = "どんな見た目なのか気になりますね。"
"90001030-41-ヒマリ" = "ただ、そちらに関しては今のところ何も手がかりがありません。"
"90001030-42-ヒマリ" = "痕跡の規模から考えると、かなりの大きさであること――"
"90001030-43-ヒマリ" = "そして、長時間自律稼働できる預言者であることくらいでしょうか。"
"90001030-44-エイミ" = "名もなき神の力とゲブラ、デカグラマトンのエンジニア――そして別の預言者の可能性……。"
"90001030-45" = "[s] \"なんだか不吉な予感がするね……。\""
"90001030-46-ヒマリ" = "それらが一体何を考えて動いているのか……。"
"90001030-47-ヒマリ" = "私たちの目に映っていない、別の何かが隠されている可能性が高いです。"
"90001030-48-ヒマリ" = "ッ！？何事ですか！？"
"90001030-49-エイミ" = "対空砲撃を受けたみたい……！#nこのまま飛行を続けるのは危険だけど、どうする？"
"90001030-50-トキ" = "気流も不利です。いかがしましょう？"
"90001030-51" = "[s] \"緊急着陸！\""
"90001030-52-ヒマリ" = "了解。緊急着陸、実行します。"
"90001030-53-ヒマリ" = "……囲まれましたね。"
"90001030-54-ヒマリ" = "突破しようか。#nトキ？"
"90001030-55-トキ" = "はい、お任せください。"
"90001030-56-エイミ" = "数が全く減らない……これもデータを集めてるのかな？"
"90001030-57-ヒマリ" = "いえ、これは……！"
"90001030-58-ヒマリ" = "（痕跡を辿った先に、待ち構えていたといわんばかりの兵……）"
"90001030-59-ヒマリ" = "（これは罠だったのでしょうか？それとも……）"
"90001030-60-エイミ" = "あれ？撤退し始めた。"
"90001030-61-トキ" = "劣勢を察しての行動には見えません。#nというよりも……。"
"90001030-62-エイミ" = "！？"
"90001030-63-トキ" = "これは……まさか！？"
"90001030-64-エイミ" = "部長！地下15m下から――"
"90001030-65-ヒマリ" = "ゲブラ！こんなところに……！"
