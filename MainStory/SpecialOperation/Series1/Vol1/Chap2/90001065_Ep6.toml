[translation]
"90001065-1-エイミ" = "防衛突破！トキ、お願い！"
"90001065-2-トキ" = "はい。遠くへ離れてください。"
"90001065-3-ヒマリ" = "施設の破壊を確認……！妨害電波が止まりました！"
"90001065-4-ヒマリ" = "ようやく回線が繋がったわ。大丈夫かしら？"
"90001065-5-ヒマリ" = "ええ、無事です。"
"90001065-6-ヒマリ" = "AMASの制御権も戻ったわ。"
"90001065-7-ヒマリ" = "リオ様のトレーラーも動き出しました。良かったです。"
"90001065-8-リオ" = "貴方達のいるその場所は……？"
"90001065-9-エイミ" = "ジャミングされてる間に移動したんだ。妨害電波を出す施設があってね。"
"90001065-10-エイミ" = "それを破壊したら……その奥に大きな建物が見えてきたの。"
"90001065-11-リオ" = "……氷河だけではなく、陸上の……こんな場所に？"
"90001065-12-リオ" = "これは……まさか……。"
"90001065-13-ヒマリ" = "何か気付いたのですか、リオ？"
"90001065-14-リオ" = "今断言するのは難しいわ。"
"90001065-15-リオ" = "けれど、一つだけ確かなのは……この地域で採掘された資源量は、私がこれまで調査していた預言者――"
"90001065-16-リオ" = "氷河地域で採掘していた船の預言者が獲得した量を上回っているわ。"
"90001065-17-リオ" = "そこには意味があるはずよ。理由もなく大量の資源を採取するわけがないもの。"
"90001065-18-リオ" = "こんなに……一体何に使うつもりなのかしら？"
"90001065-19-リオ" = "もしかしたら……。"
"90001065-20-リオ" = "（自分たちの王国でも作るつもりで……？）"
"90001065-21-ヒマリ" = "……これからどうすれば良いのでしょう？"
"90001065-22" = "[s] \"……この施設を探索しよう。\""
"90001065-23-ヒマリ" = "危険ではありませんか？"
"90001065-24-ヒマリ" = "でも、さっきよりはマシなんじゃない？#n通信も繋がったし。"
"90001065-25-ヒマリ" = "ええ。私たちの目的は、現場の探索と預言者の追跡ですから。"
"90001065-26-トキ" = "また敵兵が現れたら、倒せばいいだけです。私は最強のメイドであり、秘密エージェントですから。"
"90001065-27-ヒマリ" = "……なんだか不吉の前兆のような物言いですね。"
"90001065-28-ヒマリ" = "……分かりました。こんな何もない凍原地帯にこれだけの施設を建設するなんて。"
"90001065-29-ヒマリ" = "それだけで調査する価値はあると思います。"
"90001065-30-ヒマリ" = "リオの言う通り、私たちが調べてきた情報と違う状況になっているようですし。"
"90001065-31-エイミ" = "はぁ……そう言うと思った……。"
"90001065-32-トキ" = "ヒマリ部長はそういう方ですから。"
"90001065-33-ヒマリ" = "最近、私に対して誤解を生むような表現が増えている気がしますが……。"
"90001065-34-ヒマリ" = "まあいいでしょう。#nそれでは皆さん、探索を続けましょう。"
"90001065-35" = "次回;探索"
