[translation]
"90001245-1" = "[ns] \"明るくなった！\""
"90001245-2-モモイ" = "うわっ、眩しっ！"
"90001245-3" = "[ns] \"みんな怪我はない？\""
"90001245-4-リオ" = "私たちは平気よ。"
"90001245-5-リオ" = "先生も……無事みたいね。"
"90001245-6-モモイ" = "もう、逃げるなんて卑怯だよ！"
"90001245-7-ミドリ" = "なんか……気持ち悪い機械でした……。"
"90001245-8-ヒマリ" = "これまでの敵とは違った印象がありますね。"
"90001245-9-ヒマリ" = "機体の破片があれば、持ち帰って分析したいところですが……。"
"90001245-10-ヒマリ" = "んー、残念。ひとつ残らず持ってかれちゃった。"
"90001245-11-ヒマリ" = "なんだか勝ったような気がしません。#n何故でしょうか……。"
"90001245-12-ユズ" = "逃げるまでがワンセットの……イベント戦をしていたような気分です……。"
"90001245-13-アリス" = "獲得経験値が少なかったのも、ドロップアイテムがなかったのも、そのせいだったのですね……。"
"90001245-14-ケイ" = "アリス、それはちょっと違うような気がします……。"
"90001245-15-ケイ" = "（さっきの襲撃は……）"
"90001245-16-ケイ" = "（こちらの戦力を探っていた……？）"
"90001245-17-アイン" = "……。"
"90001245-18-ソフ" = "……！"
"90001245-19-オウル" = "……！！！"
"90001245-20-マルクト" = "どうかしましたか？"
"90001245-21-アイン" = "あ、あれは、もしかして……！？"
"90001245-22-ソフ" = "み、見間違いじゃ、ないよね……？"
"90001245-23-オウル" = "なぜあの二人がここにいるのですか！？"
"90001245-24" = "次回;生命について"
