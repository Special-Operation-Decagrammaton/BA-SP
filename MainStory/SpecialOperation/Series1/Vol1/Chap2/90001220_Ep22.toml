[translation]
"90001220-1" = "第22話;グリッドポイント"
"90001220-2-ヒマリ" = "オーロラも消えて、全ての機器が元に戻りましたね。"
"90001220-3-モモイ" = "せっかく良い景色だったのに！"
"90001220-4-ヒマリ" = "ふふ。たしかにオーロラは素敵な自然現象ですが、実はかなり危険な信号なんですよ？"
"90001220-5-ヒマリ" = "磁場の乱れによって、無線が被害を受けますし。"
"90001220-6-モモイ" = "じゃあ、早く消えて良かったのかな……？"
"90001220-7-モモイ" = "仮に障害が発生しても、数時間で回復するからそこまで心配する必要はないわ。"
"90001220-8-モモイ" = "会長って、前まで無茶苦茶だと思ってたし、なんか怖かったけど……。"
"90001220-9-モモイ" = "実は良い人なの？"
"90001220-10-リオ" = "そ、そうかしら……？"
"90001220-11-モモイ" = "あと15分くらいで輸送船が到着するよ。#n最後に荷物をチェックして。忘れ物がないように。"
"90001220-12-モモイ" = "はーい！"
"90001220-13-エイミ" = "会長は大丈夫かな。"
"90001220-14-エイミ" = "もう準備終わってそうだし。"
"90001220-15-リオ" = "ケイ、準備はできたかしら？"
"90001220-16-ケイ" = "はい。そもそも、この身体に準備の必要はありませんが……。"
"90001220-17-リオ" = "ええ、私が設計したもの。何があろうと対応できるはずよ。"
"90001220-18-ケイ" = "本気で言っている表情ですね……。"
"90001220-19-ケイ" = "その……リオ……。"
"90001220-20-ケイ" = "どうかしたのかしら？"
"90001220-21-ケイ" = "ええと、その……。"
"90001220-22-ケイ" = "？"
"90001220-23" = "[s] （これはもしかして……）"
"90001220-24" = "[ns1] \"しまった！\"\n[ns2] \"忘れ物しちゃったかも！\"\n[ns3] \"ヒマリ、リオとケイを少し借りるよ！\""
"90001220-25-ケイ" = "せ、先生？"
"90001220-26-ケイ" = "今度は何を企んでいるのですか？#n引っ張らないでください。車輪が一つしかないので、バランスを取るのが大変なんです！"
"90001220-27-ヒマリ" = "先生、探し物なら……。"
"90001220-28-ヒマリ" = "二人と一緒ですし……。"
"90001220-29-ヒマリ" = "……きっと、大丈夫でしょう。"
"90001220-30-ヒマリ" = "遅くならないよう、メッセージだけ送っておきますか。"
"90001220-31-ケイ" = "……何か話でもあるのでしょうか？"
"90001220-32-リオ" = "探し物をしに来たのではなくて？"
"90001220-33-ケイ" = "本当に信じていたのですか……詐欺に遭わないよう気をつけてくださいね。"
"90001220-34-リオ" = "嘘だったのね……。"
"90001220-35-ケイ" = "二人で話したいこと……私が、リオと？"
"90001220-36-ケイ" = "な、何を言っているんですか！"
"90001220-37-ケイ" = "誰が、そんな……！"
"90001220-38" = "[s] \"ケイちゃんはツンデレだね。\""
"90001220-39-ケイ" = "まったく、この大人は！"
"90001220-40-ケイ" = "……。"
"90001220-41-ケイ" = "はぁ、分かりました。"
"90001220-42-リオ" = "（何の話なのかしら……）"
"90001220-43-ケイ" = "こんなことを言うのは、今さらかもしれませんが……。"
"90001220-44-アリス" = "ケイと一緒にいられて、アリスは嬉しいです。"
"90001220-45-アリス" = "これからも、助け合っていきたいです！"
"90001220-46-ケイ" = "……お礼を、言いたかったんです。"
"90001220-47-リオ" = "貴女が私を憎んでいるのは――"
"90001220-48-ケイ" = "はい？"
"90001220-49-リオ" = "え？"
"90001220-50-ケイ" = "いや、どうして……？"
"90001220-51-リオ" = "そちらこそ、どうして……？"
"90001220-52" = "[ns] （どこかにポップコーンとかないかな……）"
"90001220-53-ケイ" = "私のことを恩知らずだとでも思っているのですか？"
"90001220-54-リオ" = "昔から私を嫌う人は多かったもの……。"
"90001220-55-ケイ" = "そんなわけないじゃないですか！"
"90001220-56-ケイ" = "私は、ただ……ありがとうと伝えたかったんです。#n新しい人生を与えてくれて……。"
"90001220-57-リオ" = "……！"
"90001220-58-ケイ" = "リオのおかげで、少しですが……。"
"90001220-59-ケイ" = "見て、聞いて、動ける状態になったので……。"
"90001220-60-ケイ" = "生きているのだと、実感できました。"
"90001220-61-ケイ" = "……こんな身体では、ありますが。"
"90001220-62-リオ" = "もしかして、怒らせてしまったかしら？"
"90001220-63-ケイ" = "あなたは本当に……！"
"90001220-64-ケイ" = "はぁ……わかりました。ちゃんと言葉にしなければならないのですね。"
"90001220-65-リオ" = "ご、ごめんなさい……？"
"90001220-66" = "[ns] \"ケイちゃん、ちょっと落ち着こう。\""
"90001220-67-ケイ" = "何回言えば分かるんですか、私はケイちゃんではありません！"
"90001220-68-リオ" = "……。"
"90001220-69-リオ" = "ケイ、私も貴女に言わなければならないことがあるわ。"
"90001220-70-リオ" = "……謝らせてちょうだい。"
"90001220-71-ケイ" = "……どうして謝りたいと思ったのか、聞いても良いですか？"
"90001220-72-リオ" = "アリスと貴女を……。"
"90001220-73-リオ" = "私は……。"
"90001220-74-ケイ" = "もう気にしていません。"
"90001220-75-リオ" = "……本当に？"
"90001220-76-ケイ" = "アリスがあなたを許したので。"
"90001220-77-ケイ" = "それに、いつまでもこういう話を続けていても仕方がないですから。"
"90001220-78-ケイ" = "これからは、もう少し自然に話せればと思います。"
"90001220-79-リオ" = "分かったわ。"
"90001220-80-リオ" = "……ありがとう。"
"90001220-81-リオ" = "これで話したいことは終わりです。"
"90001220-82-ケイ" = "また変な空気になっても困りますから。"
"90001220-83-ケイ" = "そろそろ輸送船が到着する時間ですし、先に戻っています。"
"90001220-84-ケイ" = "リオ。"
"90001220-85-ケイ" = "ん？"
"90001220-86-ケイ" = "……命を吹き込んでくれて、ありがとうございます。"
"90001220-87-ケイ" = "……！"
"90001220-88" = "（ケイがいなくなってからも、リオは動かなかった）"
"90001220-89" = "（そっと、そばに寄った）"
"90001220-90-リオ" = "先生……？"
"90001220-91-リオ" = "その、ごめんなさい。#n今は、こっちを見ないでもらえると……。"
"90001220-92-リオ" = "……少しだけ時間をちょうだい。"
"90001220-93" = "[s] \"ハンカチ、使って。\""
"90001220-94-リオ" = "……！"
"90001220-95-リオ" = "ええ……。"
"90001220-96-リオ" = "……ありがとう。"
"90001220-97" = "（リオが落ち着くまで、隣で静かに待った）"
"90001220-98-リオ" = "……ありがとう、先生。"
"90001220-99-トキ" = "視界良好、乱流の兆しもありません。"
"90001220-100-トキ" = "しかし、重大な問題が残っています。"
"90001220-101-ヒマリ" = "何ですか、トキ？"
"90001220-102-ヒマリ" = "……どこに向かえば良いのでしょうか？"
"90001220-103-ヒマリ" = "そこは心配しなくても大丈夫です。可愛い後輩のアリスに何か妙案があるそうなので。"
"90001220-104" = "[s] \"いつの間にそんな話を……？\""
"90001220-105-ヒマリ" = "先生がケイとリオに忘れ物の「探索」を頼んだ時、アリスが私にこそっと話してくれたのです。"
"90001220-106-ケイ" = "パンパカパーン！#nここからはアリスのターンです！"
"90001220-107-ヒマリ" = "なるほど、それなら安心です。#nアリスも操縦席に座りますか？"
"90001220-108-ケイ" = "はい！#nケイも一緒で良いですか？"
"90001220-109-ヒマリ" = "問題ありません。揺れに気をつけて移動してください。"
"90001220-110" = "[ns] \"それじゃあ、よろしくね！\""
"90001220-111-トキ" = "何を言ってるのですか、先生。"
"90001220-112" = "[s] \"えっ……？\""
"90001220-113-トキ" = "先生も一緒に座るのです。"
"90001220-114" = "[s] \"席が足りないんじゃないかな……？\""
"90001220-115-トキ" = "私の膝の上が空いています、ぶい。"
"90001220-116" = "（結局、トキの膝の上には座らず……）"
"90001220-117" = "（指定された席におとなしく座った）"
"90001220-118-アリス" = "このまま進んでください。"
"90001220-119-アリス" = "ありがとうございます。#n方角だと、どちらになりますか？"
"90001220-120-アリス" = "えっと……そうでした！"
"90001220-121-アリス" = "進路を北北西にしてください！"
"90001220-122-トキ" = "西北西ではなく……？"
"90001220-123-ケイ" = "……私が座標を指定します。"
"90001220-124-ケイ" = "ここに行けば問題ありません。"
"90001220-125-ケイ" = "ありがとうございます、ケイ。#nやはり、私の目に狂いはなかったようです。"
"90001220-126-ケイ" = "……嫌な予感がします。"
"90001220-127-ケイ" = "私はただ……。"
"90001220-128-トキ" = "ケイが優しくて良い子だと言いたかっただけです。"
"90001220-129-ケイ" = "絶対、絶対、絶対、ぜーったい、違いますからね！？"
"90001220-130" = "[s] \"ケイちゃんは本当に優しくて良い子だよね。\""
"90001220-131-ケイ" = "先生を殺して私も死にます！"
"90001220-132-アリス" = "ケイ！？暴れてはいけません！"
"90001220-133-トキ" = "そうですよ、ケイ。操縦席でのちょっとしたミスは、取り返しのつかない事故に繋がります。"
"90001220-134" = "[ns] \"ケイちゃんは優しくて良い子だけど、たまに暴走するよね。\""
"90001220-135-ケイ" = "うわぁぁぁぁぁぁぁ！！！！！"
"90001220-136" = "（そうして、ケイに恨みがましい目を向けられながら……）"
"90001220-137" = "（私たちは、謎の施設に到着した）"
"90001220-138-ソフ" = "……敵のグリッドポイント到着を確認。"
"90001220-139-アイン" = "本当に、ここまで来られたんですね……す、少しは認めざるを得ないかも。"
"90001220-140-アイン" = "そうですね。他のすべての愚かな人間よりはマシだったということで。"
"90001220-141-アイン" = "プランC……いや、プランDにする場合、ティファレトを鋼鉄大陸に後退させる案も視野にいれるよ。判断はアインに任せていい？"
"90001220-142-アイン" = "は、はい！お任せください！"
"90001220-143-アイン" = "それでは、始めましょう。"
"90001220-144-オウル" = "ソフ曰く、歓迎パーティーは盛大に、とのことですから！"
"90001220-145" = "次回;種子貯蔵庫"
