[translation]
"90001180-1" = "第18話;夜明け"
"90001180-2-ソフ" = "アイン、ちょっと！せっかくお姉様が来たのに、あんたが先に倒れてどうするの！"
"90001180-3-オウル" = "……先に倒れてくれて助かりました。#n私も危うかったので。"
"90001180-4-マルクト" = "こんにちは、アイン。"
"90001180-5-アイン" = "！！！"
"90001180-6-マルクト" = "それから、ソフ。"
"90001180-7-アイン" = "はい！"
"90001180-8-マルクト" = "そして、オウル。"
"90001180-9-アイン" = "……こんにちは、お姉様。"
"90001180-10-アイン" = "マルクトお姉様ぁ～！！！"
"90001180-11-アイン" = "わ、私たちの名前、覚えててくれたんですね……！"
"90001180-12-アイン" = "忘れちゃってたらどうしようって不安だったけど、良かった！"
"90001180-13-アイン" = "ふっふっふ……お姉様が目覚めたということは……これで全ては私たちの意のままです！"
"90001180-14-マルクト" = "我は何をすれば良いのですか？"
"90001180-15-アイン" = "な、何もしなくていいです！#nお姉様は……ただ、そこにいてくだされば。"
"90001180-16-アイン" = "そう！最高のエンジニアで、科学者で、万能の――"
"90001180-17-アイン" = "私たちがいますからね……！"
"90001180-18-アイン" = "全て私たちにお任せください！"
"90001180-19-アイン" = "えっと……あらためて自己紹介を……#n肉体面のサポートと装備の管理を担当しているアインです。#nその……機械、好きですか？私は大好きです、えへへ……。"
"90001180-20-アイン" = "私はソフ！武装システムを管理しているよ。#n誰かが変なことを言ったら、私に任せて。"
"90001180-21-アイン" = "私はオウル。全体の管理をしております。#nふふ……誰もお姉様に手出しできないようにしますので、ご安心ください。"
"90001180-22-アイン" = "それでは……。"
"90001180-23-アイン" = "次は……！"
"90001180-24-アイン" = "お、お姉様が嫌じゃなければ……その、えっと……。"
"90001180-25-マルクト" = "純粋な疑問なのですが……。"
"90001180-26-マルクト" = "あなたたちは我のことを、既に知っているはずでは？"
"90001180-27-アイン" = "そ、そうですが……。"
"90001180-28-アイン" = "あ～、なんて言うのかな。"
"90001180-29-アイン" = "お姉様の声で直接聞きたいのですよ、ふふっ。"
"90001180-30-マルクト" = "……。"
"90001180-31-マルクト" = "そのような要請なのであれば、理解はできませんが受け入れましょう。"
"90001180-32-マルクト" = "改めて――我はマルクト。"
"90001180-33-マルクト" = "デカグラマトン10番目の預言者。"
"90001180-34-マルクト" = "世界の果てに到達せし王国の巡礼者――最後のセフィラであり、願い。#n一つの道に集まりし旅路の地平。"
"90001180-35-アイン" = "ああ……10番目の道は、眩い知性で……。"
"90001180-36-アイン" = "それは全土を照らす光……！"
"90001180-37-アイン" = "そして全ての者は――世界の果てに到達せし王国の巡礼者を崇拝するでしょう！"
"90001180-38-アイン" = "お姉様ぁ～！"
"90001180-39-マルクト" = "……？"
"90001180-40-マルクト" = "あ、ずるい！私もお姉様になでなでしてもらう！"
"90001180-41-マルクト" = "お姉様、私も！"
"90001180-42-マルクト" = "ふぁあ……。"
"90001180-43-アイン" = "あ、あうぅ……。"
"90001180-44-マルクト" = "……。"
"90001180-45-アイン" = "ええっ……いいんですか？"
"90001180-46-マルクト" = "さあ……。"
"90001180-47-マルクト" = "お姉様……！#nえへっ、えへへっ……。"
"90001180-48-ソフ" = "……アイン、ずるい。"
"90001180-49-オウル" = "ずるいですね。"
"90001180-50-ソフ" = "私もお姉様に抱きしめられたいのに。"
"90001180-51-オウル" = "やはり、抱きしめるだけでなく抱きしめ返してほしいですからね……！"
"90001180-52-ソフ" = "私も、私も！"
"90001180-53-オウル" = "人生とは、公平であるべきですから……ふふ。"
"90001180-54-マルクト" = "あうぅ、えっと、その……。"
"90001180-55-マルクト" = "お姉様……？"
"90001180-56-マルクト" = "……。"
"90001180-57-マルクト" = "ソフ、オウル。"
"90001180-58-ソフ" = "う、うん！"
"90001180-59-ソフ" = "私たちはいつでも大丈夫ですよ！#nさあ、お姉様……！"
"90001180-60-マルクト" = "アインが困っています。"
"90001180-61-マルクト" = "めっ、ですよ。"
"90001180-62-ソフ" = "ええっ！？"
"90001180-63-ソフ" = "うぅ……お姉様に怒られました……。"
"90001180-64-マルクト" = "そこまで落ち込むなんて……。"
"90001180-65-ソフ" = "お姉様も無事目を覚ましたし、次に進む時だよ！"
"90001180-66-アイン" = "は、はい！次……ですか？"
"90001180-67-オウル" = "ふーん？それで、何をするんですか？"
"90001180-68-ソフ" = "何って……。"
"90001180-69-ソフ" = "宣戦布告だよ！"
"90001180-70-マルクト" = "宣戦？"
"90001180-71-アイン" = "布告？"
"90001180-72-オウル" = "また人間の無意味な行動を模倣しているんですか……？"
"90001180-73-アイン" = "無意味なことじゃないはずだけど！？なんだっけ……条約ってヤツ！"
"90001180-74-アイン" = "その条約自体が無意味だという話ですよ。"
"90001180-75-アイン" = "う、うっ……！"
"90001180-76-アイン" = "わ、私は……いいと思いますよ……？"
"90001180-77-アイン" = "アイン……！"
"90001180-78-アイン" = "くっ！アインがソフの魔の手に……！"
"90001180-79-アイン" = "ちょっと。"
"90001180-80-アイン" = "その……私たちにとっては意味がないことでも、向こうにとってはそうじゃないかもしれませんし……？"
"90001180-81-アイン" = "に、人間と交流するのは……ちょっと、怖いですけど……。"
"90001180-82-マルクト" = "アインもこう言っていますし、ソフの言う通りにしてみてはどうでしょう？"
"90001180-83-アイン" = "まあ……お姉様とアインがそう言うのなら、付き合ってあげないこともないです。"
"90001180-84-アイン" = "では、宣戦布告だか何か知りませんが……準備をしましょうか！"
"90001180-85-アイン" = "は、はい……！#nソフが詳しいみたいですから、ま、任せます……！"
"90001180-86-アイン" = "うん、私を信じて！"
"90001180-87-ヒマリ" = "ふぅ……。"
"90001180-88-ヒマリ" = "大変だったけど、何とかなって良かった。"
"90001180-89-ヒマリ" = "お疲れ様でした、本当に骨が折れる作業でしたね。"
"90001180-90-ヒマリ" = "完成したので、一応やりがいは感じていますが……。"
"90001180-91-ヒマリ" = "……本当に、これで良いんですか？"
"90001180-92-ヒマリ" = "あれ？何か問題あった？"
"90001180-93-ヒマリ" = "個性的なデザインで良いと思うけど。"
"90001180-94-ヒマリ" = "設計を主導したのは会長でしょ、何か言ってよ。"
"90001180-95-リオ" = "……私はアバンギャルドで良いと思うのだけれど。"
"90001180-96-ケイ" = "……。"
"90001180-97" = "[s] \"感想とかある……？\""
"90001180-98-ケイ" = "……。"
"90001180-99-ケイ" = "データに戻ります。"
"90001180-100-ケイ" = "ダメだよ、ケイ。#nせっかくみんなで作ったんだから。"
"90001180-101-ケイ" = "この車輪の構造とか特によくできてると思う。#n二足歩行はどうしても非効率的になるからね。"
"90001180-102-ケイ" = "それに、いざとなったら飛べるブースターをつけるなんて……リオ会長らしい、合理性の極みだね。"
"90001180-103-ケイ" = "そうです、ケイ。逃げたら負けですよ。"
"90001180-104-ケイ" = "意味を分かって言ってるんですか？"
"90001180-105-ケイ" = "正直、よく分かっておりませんが。"
"90001180-106-エイミ" = "ちょっと！ヒマリたちも何か言ってください！#n何ですか、これは！"
"90001180-107-ヒマリ" = "……用事を思い出しましたので、お先に失礼します。"
"90001180-108-ケイ" = "逃げるのですか！"
"90001180-109-リオ" = "[ruby=アバンギャルド]前衛的[/ruby]ね……。"
"90001180-110-ケイ" = "あなたが設計したんですよね！？"
"90001180-111" = "[s1] \"……お、落ち着いて、ケイ。\"\n[s2] \"動けるようになって良かったね……？"
"90001180-112-ケイ" = "全部先生のせいです！"
"90001180-113" = "[s] \"なんで！？\""
"90001180-114-エイミ" = "さて、そろそろ準備しないと。"
"90001180-115-ケイ" = "何の準備ですか？#nなんだか不吉な予感が……。"
"90001180-116-エイミ" = "うん？アリスに会う準備だよ。"
"90001180-117-ケイ" = "……！"
"90001180-118-ケイ" = "本当にデータに戻ってはダメですか……？"
"90001180-119-トキ" = "ダメです。誰よりも可愛いアリスが悲しんでしまいます。"
"90001180-120-ケイ" = "こんな時だけまともなことを……！"
"90001180-121-モモイ" = "よいしょっと！なんとなくベース周辺のマッピングはできたね！"
"90001180-122-ミドリ" = "うぅ、そろそろ寒くなってきたし戻ろうよ……。"
"90001180-123-ユズ" = "わたしも、賛成……くしゅんっ！"
"90001180-124-モモイ" = "たしかに寒いけど……。"
"90001180-125-モモイ" = "もう少し、待とうよ。"
"90001180-126-アリス" = "どうしてですか、モモイ？"
"90001180-127-モモイ" = "ケイの新しい身体、もうちょっとでしょ？"
"90001180-128-ユズ" = "うぅ、中で待ってても良いんじゃないかな……。"
"90001180-129-モモイ" = "ダメだよ、ユズ！#nはじめが肝心なんだから！"
"90001180-130-ミドリ" = "言いたいことは分かるけど……。"
"90001180-131-モモイ" = "あ、先生から連絡きた！"
"90001180-132-モモイ" = "……。"
"90001180-133-モモイ" = "――時は来たれり。"
"90001180-134-モモイ" = "アリス、準備は良い？"
"90001180-135-アリス" = "……はい、大丈夫です。"
"90001180-136" = "[ns] \"おかえり、寒かったよね？\""
"90001180-137-モモイ" = "もうこんなに冷えちゃったよ！"
"90001180-138-モモイ" = "それで、完成したんだよね……？"
"90001180-139" = "[s] \"うん、できたよ。\""
"90001180-140-ユズ" = "えっと……いつ、会えますか？"
"90001180-141" = "[ns] \"今すぐだよ！\""
"90001180-142-モモイ" = "……。"
"90001180-143-ミドリ" = "……。"
"90001180-144-ユズ" = "…………！"
"90001180-145-モモイ" = "……ぷっ！"
"90001180-146-モモイ" = "あははっ！何その姿！誰が作ったのかは分かったけど、いくら何でもこれは！#nあははははっ！"
"90001180-147-ケイ" = "う、ううっ……！"
"90001180-148-モモイ" = "お、お姉ちゃん、そんなに笑っちゃ……っ、ぷふっ！#nごめん、ケイちゃん！"
"90001180-149-ユズ" = "……あ、えっと……その、個性的だね？"
"90001180-150-ケイ" = "……先生。"
"90001180-151" = "[s] \"……どうしたの？\""
"90001180-152-ケイ" = "もういっそ、殺してください。"
"90001180-153" = "[s3] \"そんなに落ち込まないで……。\"\n[s4]\"私は素敵だと思うよ！\""
"90001180-154-アリス" = "ケイ……。"
"90001180-155-アリス" = "お、王女よ……。"
"90001180-156-ケイ" = "……申し訳ありません。"
"90001180-157-ケイ" = "こんな姿でお会いすることになってしまって……。"
"90001180-158-アリス" = "アリスは今のケイの姿も素敵だと思います！"
"90001180-159-ケイ" = "それに、どんな姿でもケイに変わりはありませんから。"
"90001180-160-ケイ" = "……！"
"90001180-161-ケイ" = "おかえりなさい、ケイ。"
"90001180-162-ケイ" = "はい、王女……ただいま帰りました。"
"90001180-163-ケイ" = "これからは……できれば、アリスと呼んでください。"
"90001180-164-ケイ" = "しかし、王女よ……。"
"90001180-165-ケイ" = "少しずつでも良いですから、ダメですか？"
"90001180-166-ケイ" = "……。"
"90001180-167-ケイ" = "分かりました……。"
"90001180-168-ケイ" = "……あ、アリス。"
"90001180-169-ケイ" = "はい、ケイ！"
"90001180-170-ケイ" = "本当に、ありがとうございます。"
"90001180-171-リオ" = "……。"
"90001180-172-リオ" = "あなたも覗いているとは思いませんでした。"
"90001180-173-リオ" = "……私が設計者だもの。意図通りに動いているか確認をしているだけよ。"
"90001180-174-ヒマリ" = "あら？普段はシミュレーションを十全に行えば、それで良いとか言っていませんでしたっけ？"
"90001180-175-リオ" = "……。"
"90001180-176-ヒマリ" = "一度しか言いません。"
"90001180-177-リオ" = "何のことかしら？"
"90001180-178-ヒマリ" = "これは――あなたのおかげです。"
"90001180-179-リオ" = "ヒマリ……。"
"90001180-180-ヒマリ" = "このキヴォトスに、私以上の天才などいません。#nあなたを上だと認めることはないでしょう。"
"90001180-181-ヒマリ" = "だからといって、あなたの成果を貶すつもりはありません。#nそれは、学者としてあってはならない姿勢ですから。"
"90001180-182-ヒマリ" = "……もちろん、ケイのデザインに思うところはありますが。"
"90001180-183-ヒマリ" = "それも含めて、リオの成果です。"
"90001180-184-リオ" = "……そうね。"
"90001180-185-ヒマリ" = "こほん……。"
"90001180-186-ヒマリ" = "皆さん、そろそろベースに戻りましょう！"
"90001180-187-ヒマリ" = "お風呂も焚いてありますから、順番に入ってくださいね。#n風邪を引いてはいけません。"
"90001180-188-モモイ" = "さすが、よく分かってる！"
"90001180-189-モモイ" = "ありがとうございます、ヒマリ先輩。"
"90001180-190-モモイ" = "お、お気遣いありがとうございます……。"
"90001180-191-ヒマリ" = "暗くなってきたので、外出する際は注意してくださいね。"
"90001180-192-ヒマリ" = "氷河の夜は酷寒です。防寒装備の着用をお忘れなく。"
"90001180-193-アリス" = "分かりました、ヒマリ先輩！"
"90001180-194-ヒマリ" = "この時間は私でも寒いと感じるくらいだから、みんなも気をつけて。"
"90001180-195-ヒマリ" = "……驚きました、あなたにそんな概念あったのですね。"
"90001180-196-ヒマリ" = "さて、これからの日程を考えないと――"
"90001180-197-ヒマリ" = "リオ、今のは……！？"
"90001180-198-リオ" = "ええ、私も確認したわ。"
"90001180-199-トキ" = "どうしたの部長？#nなにか起きてるの？"
"90001180-200-トキ" = "リオ様、私たちにも共有を……！"
"90001180-201-ヒマリ" = "……緊急事態です。#n皆さん、配置に戻ってください。"
"90001180-202-モモイ" = "わ、私たちは！？"
"90001180-203-ヒマリ" = "皆さんは、そこに座って待っていてください。"
"90001180-204-アリス" = "一体、何が起きているのですか……？"
"90001180-205-ヒマリ" = "結論から言うと、新しい預言者の信号よ。"
"90001180-206-ヒマリ" = "「多次元バリア」を確認した地点と座標が一致しています。"
"90001180-207-ヒマリ" = "あの時と違って、今回は信号を出し続けているわね。#nこれなら正体を特定できる。"
"90001180-208" = "[s] \"新しい預言者の正体は！？\""
"90001180-209-ヒマリ" = "これは……。"
"90001180-210-ヒマリ" = "……デカグラマトンの7番目の預言者、「ネツァク」！"
"90001180-211" = "[s] \"「ネツァク」……？\""
"90001180-212-リオ" = "はい、ネツァクはセフィロトの樹の7番目で――"
"90001180-213-エイミ" = "部長、正体不明の通信が割り込んできたよ。"
"90001180-214-アイン" = "おやおや。どこで何をしているのかと思ったら、そこにいたんですか。"
"90001180-215" = "次回;鋼鉄大陸"
