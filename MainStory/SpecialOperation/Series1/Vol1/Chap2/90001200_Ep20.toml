[translation]
"90001200-1" = "第20話;兆候"
"90001200-2-ヒマリ" = "凍原地帯に戻ってきましたね。"
"90001200-3-アリス" = "アリス、知っています！#nここに巨大変身怪獣がいるのだと！"
"90001200-4-アリス" = "ゲームだったら大ヒット間違いなしだよ！"
"90001200-5-アリス" = "その通りです、モモイ！#n怪獣、変身、ロボットの要素は、いつの時代も大人気です！"
"90001200-6-モモイ" = "間違いなく神ゲーになる！"
"90001200-7-ケイ" = "……一つ聞いてもいいですか、モモイ。#nそれはどんなシナリオになるんですか？"
"90001200-8-モモイ" = "そ、それはこれから考えるけど……とりあえず、一回世界を滅亡させようかなって？"
"90001200-9-ケイ" = "却下です。"
"90001200-10-ケイ" = "なんでぇ！？"
"90001200-11-トキ" = "リオ様、鉄道の痕跡を発見しました。"
"90001200-12-トキ" = "とりあえず降りてみる？#nそれとも、空から偵察する？"
"90001200-13" = "[s1] \"ここからは見えないものもあると思う。\"\n[s2] \"気をつけながら、降りてみよう。\""
"90001200-14-エイミ" = "ご安心ください、先生。#nもしもの時は、私が必ずお守りします。"
"90001200-15" = "[s] \"ありがとう、頼もしいね。\""
"90001200-16-トキ" = "行動で示してくれても良いんですよ。"
"90001200-17-トキ" = "一応、操縦中は……。"
"90001200-18-トキ" = "仕方ありません。ここはリオ様の言葉に従います。"
"90001200-19-トキ" = "高度を下げるので、揺れに注意してください。"
"90001200-20-ミドリ" = "なんだか、寂しい風景ですね……。"
"90001200-21-エイミ" = "まあ、ここは元々誰もいなかったところだし。"
"90001200-22-ヒマリ" = "それもそのはずです。長らく忘れられていた土地に鉄道を作って……。"
"90001200-23-ヒマリ" = "資源回収が終わったら施設を放棄したのですから。"
"90001200-24-トキ" = "線路は二手に別れていますね。#n……二度と利用できないように、処理がされています。"
"90001200-25-トキ" = "ですが、ルートは分かりそうですね。"
"90001200-26-トキ" = "こ、このまま……ずっと徒歩で追跡するんですか……？"
"90001200-27-ユズ" = "車を使いましょう。#n輸送船は自動操縦でまた呼べばいいわ。"
"90001200-28-ヒマリ" = "そうですね。状況が悪くなったら、すぐに撤退しましょう。"
"90001200-29-マルクト" = "……そして、いつまでも幸せに暮らしました。"
"90001200-30-マルクト" = "そ、その先は？#nそれで、どうなったのですか？"
"90001200-31-マルクト" = "この話はこれで終わりです、アイン……。"
"90001200-32-マルクト" = "そんな……。"
"90001200-33-マルクト" = "まあ、童話ってこういうものだよね？終わりが決まっているわけだし。#nアインなんか泣きそうだったけど。"
"90001200-34-マルクト" = "で、でも……！"
"90001200-35-オウル" = "あれ？泣きそうだったのは、ソフも同じでは？"
"90001200-36-ソフ" = "わ、私は、別に……！"
"90001200-37-オウル" = "しかし、ソフの言う通り終わりは決まっています。#nだからこそ、どうせならハッピーエンドがいいわけです。"
"90001200-38-アイン" = "そ、そうですね……えへへ。そ、それに、お姉様の声が良かったです……。"
"90001200-39-ソフ" = "お姉様、次のお話は？"
"90001200-40-マルクト" = "童話が好きなんですね、アイン、ソフ、オウル。"
"90001200-41-アイン" = "は、はい……！#nお姉様が読み聞かせてくれたから、もっと好きになりました！"
"90001200-42-アイン" = "外の「現実」も収集できるし一石二鳥！"
"90001200-43-アイン" = "私はそこまで興味はありませんが。人間の愚かな話なんて面白いんですか？"
"90001200-44-アイン" = "ああでも、お姉様の声が聞けるので好きですよ？"
"90001200-45-マルクト" = "次はどんなものにしましょうか？#n邪悪な資本家のキツネに対して、労働者階級の鶴が革命を成功させる話にしましょうか。"
"90001200-46-マルクト" = "それとも、太陽と北風が貧しい旅人の上着を奪うために様々な手を繰り出す物語にしましょうか？"
"90001200-47-アイン" = "わ、私は……。"
"90001200-48-アイン" = "警報音？"
"90001200-49-アイン" = "見てみましょう……へぇ、これはこれは？"
"90001200-50-アイン" = "えっ！？あの大人と[ruby=つかつき]調月[/ruby]リオたちが……凍原地帯に……？"
"90001200-51-アイン" = "これは……。"
"90001200-52-アイン" = "まあ、あれですね。#nソフの「宣戦布告」に対する、向こうの回答でしょう。"
"90001200-53-アイン" = "凍原に戻ったということは……なるほど、資源輸送鉄道の痕跡を探しに行く、と。"
"90001200-54-アイン" = "……少し、面倒なことになる可能性も出てきましたね。"
"90001200-55-アイン" = "だから宣戦布告なんて人間の悪癖を真似する必要はないと言ったじゃないですか。"
"90001200-56-アイン" = "うっ……。"
"90001200-57-アイン" = "ま、いいですけど。#nソフをからかう口実になりましたし。"
"90001200-58-アイン" = "ちょっと！？"
"90001200-59-アイン" = "で、でも、あの道を進んだ先は……。"
"90001200-60-アイン" = "ええ。だからこそ、私は心配していないのですよ。"
"90001200-61-アイン" = "あっ……！"
"90001200-62-アイン" = "そういうことです。あそこに向かうのなら、障壁がたくさんありますから。"
"90001200-63-アイン" = "けど、向こうも人が増えたみたいだね。#nもう一度チェックした方がいいかも。"
"90001200-64-アイン" = "わ、私が調べます！#nえ、えっと……この人は……。"
"90001200-65-モモイ" = "どれどれ……名前は[ruby=さいば]才羽[/ruby]モモイ。属性はシナリオライター。その他、特徴なし。これはどう見ても無害ですね。"
"90001200-66-ミドリ" = "こっちは[ruby=さいば]才羽[/ruby]ミドリ。[ruby=さいば]才羽[/ruby]モモイの双子の妹。属性はアマチュアのイラストレーター。その他、特徴なし。これも同じく。"
"90001200-67-ユズ" = "さ、最後は……[ruby=はなおか]花岡[/ruby]、ユズ？属性は、えっと、プログラマーですね……？こちらも、害はないかと……。"
"90001200-68-ユズ" = "……別の信号が二つ、捕捉されて消えたように見えますが。"
"90001200-69-マルクト" = "お、お姉様！？#nこんなこと気にしなくても……！"
"90001200-70-マルクト" = "これは私たちがやることだから。#nお姉様の力は、別のところで……！"
"90001200-71-マルクト" = "ですが、我もあなた達を助けたいのです。"
"90001200-72-マルクト" = "妹を助けるのは、姉として当然でしょう？"
"90001200-73-アイン" = "あ、ああ……。"
"90001200-74-アイン" = "眩しい……尊い。"
"90001200-75-アイン" = "ですが、お姉様。このような信号は、よくあることなのです。#nおそらくノイズが入ってしまったのでしょう。"
"90001200-76-アイン" = "原因は、宇宙から飛んでくる中間子だってよく聞くよね。"
"90001200-77-アイン" = "理論上、あらゆる電子回路はエラーを起こす可能性があるのです。#n「単一事象反転」と言います。"
"90001200-78-アイン" = "だ、だからここは……私たちのことをもう少し、信じてもらえると、う、嬉しいです！"
"90001200-79-アイン" = "私たちは……お姉様の自慢の妹ですから！"
"90001200-80-マルクト" = "……。"
"90001200-81-マルクト" = "分かりました。では、よろしくお願いします。"
"90001200-82-マルクト" = "我に手伝えることがあったらすぐに言ってください、約束してもらえますか？"
"90001200-83-アイン" = "は～い！"
"90001200-84-アイン" = "さて、それじゃ……どうする？"
"90001200-85-アイン" = "う、えっと……。"
"90001200-86-アイン" = "うーん、まあ。"
"90001200-87-アイン" = "放っておきましょうか？"
"90001200-88-アイン" = "何となく、そう言いそうな気がしてたけど、あんたさぁ……。"
"90001200-89-アイン" = "下手に手を出して、こちらの戦力が削がれるくらいなら――"
"90001200-90-アイン" = "あのまま泳がせて、時間を無駄にさせたほうが安全でしょう？"
"90001200-91-アイン" = "私たちの最大の目標は……覚醒したネツァクちゃんを、より安定させることですからね……！"
"90001200-92-アイン" = "そうだね、拡張の速度を上げないといけないし。#nそう考えると……無駄足を踏ませた方がいいのか。"
"90001200-93-アイン" = "それに、あの一行が「グリッドポイント」に到達したとしても。"
"90001200-94-アイン" = "「ティファレト」を突破できなければ、鋼鉄大陸に足を踏み入れることすらできないのですよ？"
"90001200-95-アイン" = "そ、それに、もしティファちゃんを突破したとしても……その先がありますし……！"
"90001200-96-アイン" = "それもそうだね。門番を突破したとしても、鋼鉄大陸が私たちの本陣だもの。"
"90001200-97-アイン" = "門番は絶対に突破されません！"
"90001200-98-アイン" = "うわっ？……ごめん、アイン。#n本当にそう思ってるわけじゃないよ。"
"90001200-99-アイン" = "ほら、あらゆる想定をしておいた方が良いでしょ？"
"90001200-100-アイン" = "す、すみません……つ、つい熱く……。"
"90001200-101-アイン" = "大丈夫大丈夫。"
"90001200-102-アイン" = "そうですね。最悪の可能性が、全て実現したとしても――"
"90001200-103-アイン" = "鋼鉄大陸で全て終わらせれば良いだけですから。"
"90001200-104-アイン" = "……お姉様が外に出ることだけは避けましょう。"
"90001200-105-アイン" = "う……そ、そうですね。"
"90001200-106-アイン" = "そう、だね。#nそれだけは、絶対に……。"
"90001200-107-アイン" = "……！"
"90001200-108-アイン" = "オウル。あんた、ちょっといたずらしてみない？"
"90001200-109-アイン" = "私が？珍しいですね。#nソフが私に「いたずら」しろと言うなんて。"
"90001200-110-アイン" = "ちょっと面白いこと思いついてさ、えっとね――"
"90001200-111-アイン" = "――って感じなんだけど、どう？"
"90001200-112-アイン" = "う、うわぁ……。"
"90001200-113-アイン" = "……。"
"90001200-114-アイン" = "ソフったら、私の趣味をよ～く分かってますねぇ！"
"90001200-115-アイン" = "そりゃね……それで、やるの？"
"90001200-116-アイン" = "もちろんです！そもそもあの一行が、この程度も突破できなければ結局そこまでということですし？"
"90001200-117-アイン" = "そ、その、「この程度」では、ないような……。"
"90001200-118-オウル" = "それこそ、私の知ったことではありません！"
"90001200-119-アイン" = "は、はい……。"
"90001200-120-アイン" = "すぐに準備に取り掛かります。#n少し時間がかかるかもしれません！"
"90001200-121-ソフ" = "はい、はい……頑張って。"
"90001200-122-ユズ" = "ずいぶんと移動した気がしますが……一体どこまで続いているのでしょうか……。"
"90001200-123" = "[s] \"気分は大陸横断鉄道みたいだね。\""
"90001200-124-ヒマリ" = "いつの間にか夜になってしまいました。#n続けるべきでしょうか……？"
"90001200-125-リオ" = "本来であれば、夜間の偵察はやめるべきだけれど……。"
"90001200-126-リオ" = "……ごめんなさい。#nこうしている間にも鋼鉄大陸は大きくなっていく……ここで退くわけにいかないわ。"
"90001200-127-トキ" = "ハードスケジュールになるね。"
"90001200-128-トキ" = "それは良いのですが……線路がここで途絶えています。"
"90001200-129-ミドリ" = "えっ、じゃあどうするの！？"
"90001200-130-ミドリ" = "行き先を見失ってしまいました……。"
"90001200-131-ケイ" = "……悪い知らせが、もう一つあります。"
"90001200-132-ケイ" = "じょ、冗談だよね……？"
"90001200-133-ケイ" = "私も冗談であってほしかったのですが。"
"90001200-134-ケイ" = "先ほどから、GPSの信号が失われています。"
"90001200-135-ヒマリ" = "！？"
"90001200-136-ヒマリ" = "本当だわ、私の個人衛星から受信しているのに……。"
"90001200-137" = "[s] \"個人衛星なんて持ってるの！？\""
"90001200-138-ヒマリ" = "それより、今は道を――"
"90001200-139-ケイ" = "――伏せてください！"
"90001200-140-アイン" = "よし、入った！"
"90001200-141-アイン" = "や、やりました……！"
"90001200-142-アイン" = "アインのドローンを使った、あの[ruby=エネルギー]禁じられた力[/ruby]の発射……良いですね。これであそこは、完全に外界と遮断されました。"
"90001200-143-アイン" = "まるで大規模なEMP攻撃を受けたかのように、電子機器を使用できなくなったはずです！"
"90001200-144-アイン" = "ありがとうございます、アイン！いつもお世話になっています！"
"90001200-145-アイン" = "ど、どういたしまして……えへへ。#nうちのフライホイールちゃんたちは、いつも頑張ってくれるから……！"
"90001200-146-アイン" = "今回の名前は、比較的分かりやすいですね……。"
"90001200-147-リオ" = "そっちはどう！？"
"90001200-148-ヒマリ" = "ダメ、会長……どの回路も応答しない。"
"90001200-149-ヒマリ" = "EMPの対策はしていたはずなのに、どうして……？"
"90001200-150-ヒマリ" = "私のアビ・エシュフも起動できません。#nこの状況で襲撃でもされたら……。"
"90001200-151-モモイ" = "……そ、そうなったら私たちはどうなるんですか？"
"90001200-152-モモイ" = "うぅ……。"
"90001200-153-アリス" = "先生、ケイ……。"
"90001200-154" = "[s3] \"みんな落ち着こう。\"\n[s4] \"まずは冷静になろう。\""
"90001200-155" = "[ns] （でも……どうすれば良いんだろう？）"
"90001200-156-？？？" = "はぁ……危なっかしくて仕方ありませんね。"
"90001200-157-アリス" = "け、ケイ！？"
"90001200-158" = "[ns] \"ケイ？\""
"90001200-159-ケイ" = "大丈夫です、王女……いえ、アリス。"
"90001200-160-ケイ" = "私は対処法を知っています。"
"90001200-161-アリス" = "ほ、本当ですか！？"
"90001200-162-ケイ" = "まずは、私の目を見てください……。"
"90001200-163-ケイ" = "これで大丈夫です。#nでは、あの「チビっ子」に分からせてあげましょう。"
"90001200-164-ケイ" = "……いったい誰に喧嘩を売っているのかを！"
"90001200-165" = "次回;最後の責務"
