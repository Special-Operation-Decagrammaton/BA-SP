[translation]
"90001040-1" = "第4話;邂逅・再び"
"90001040-2-ヒマリ" = "！！！"
"90001040-3-エイミ" = "ちょっと強すぎない……？"
"90001040-4-トキ" = "先日とは段違いですね。"
"90001040-5-トキ" = "まるで別物のような……！"
"90001040-6" = "[ns1] （どうしよう……！？）\n[ns2] （脱出を優先しよう……！）"
"90001040-7-トキ" = "ゲブラ、接近してきます！"
"90001040-8-トキ" = "……。"
"90001040-9-トキ" = "私が時間を稼ぎますので、その間に――"
"90001040-10-エイミ" = "それ、本当に悪癖だと思うよ。"
"90001040-11-ヒマリ" = "（しかし、この状況でヘリだけを離陸させられるでしょうか……？）"
"90001040-12-ヒマリ" = "（せめて先生だけでも、そして……）"
"90001040-13-？？？" = "AMAS部隊――出撃。"
"90001040-14" = "[ns] \"え……？\""
"90001040-15-ヒマリ" = "まさか！？"
"90001040-16-リオ" = "――挨拶は非効率的だから省かせてもらうわ。"
"90001040-17-リオ" = "今はそんなことをしている場合ではないでしょう？"
"90001040-18-ヒマリ" = "あっ────あなた──！？"
"90001040-19" = "[ns] \"リオ！\""
"90001040-20-リオ" = "目の前の敵に集中しなさい。"
"90001040-21-リオ" = "5番目の預言者――ゲブラに関しては……対策があるの。#n支援するわ。"
"90001040-22-ヒマリ" = "……今は他に方法がありません、任せましたよリオ！"
"90001040-23" = "[s] \"ありがとう！\""
