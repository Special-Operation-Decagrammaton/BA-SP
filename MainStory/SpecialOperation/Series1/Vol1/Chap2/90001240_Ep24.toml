[translation]
"90001240-1" = "第24話;希望"
"90001240-2" = "[ns] \"ずっと同じ通路が続いてるような……。\""
"90001240-3-リオ" = "そう感じるのも無理はないわ。構造上、致し方ないの。"
"90001240-4-リオ" = "でも、あと少しでコントロールルームに着くはずよ。"
"90001240-5-モモイ" = "会長、なんで分かるの？"
"90001240-6-リオ" = "この建物……何故かミレニアムの貯蔵庫によく似ているのよ。"
"90001240-7-モモイ" = "そうですね。典型的な「ミレニアム式」とでも言いましょうか。"
"90001240-8-リオ" = "でも、私が知る限り、ミレニアム保有の施設リストにここは存在しないわ。"
"90001240-9-ヒマリ" = "ふむ……学外からの依頼で、建設だけミレニアムが請負った可能性は？"
"90001240-10-リオ" = "ええ、私もその可能性が高いと考えているわ。"
"90001240-11-ヒマリ" = "この施設は――"
"90001240-12-リオ" = "世界滅亡の危機に瀕したとき、生き残った人類に生存の道を残すべく建てられたとされているわ。"
"90001240-13-リオ" = "つまり、終末に備えるための貯蔵庫よ。"
"90001240-14-ヒマリ" = "こうして実際に目にするまで、ただの噂話だと思っていました。"
"90001240-15-ヒマリ" = "終末を想定して備えるだなんて、とんだ変わり者がいたものですね。"
"90001240-16-リオ" = "私には、理解できるわ……。"
"90001240-17-ヒマリ" = "……。"
"90001240-18-ヒマリ" = "施設を作った理念は、私も理解できます。"
"90001240-19-ヒマリ" = "ですが、その位置を公にせず、管理はAI任せ。"
"90001240-20-ヒマリ" = "これでは、いざという時に誰もたどり着けないのでは？"
"90001240-21-ヒマリ" = "まぁ、そこまで考えていなかった可能性はありますし……。"
"90001240-22-ヒマリ" = "ただの気まぐれで建てたのかもしれませんが。"
"90001240-23-ケイ" = "もしくは……誰かに見つけてもらう日。#n芽吹きの時を、ただ待っていたのかもしれません。"
"90001240-24-ケイ" = "まるで、種のように。"
"90001240-25-ヒマリ" = "まるで――"
"90001240-26-リオ" = "種の――"
"90001240-27-アリス" = "ように……？"
"90001240-28-アリス" = "……！！！！"
"90001240-29-アリス" = "ついにケイも[ruby=いのち]生命[/ruby]を理解してくれるようになったのですね！"
"90001240-30-ケイ" = "い、いえ……そこまでは。#nただ、似ていると思っただけです。"
"90001240-31-ケイ" = "種には、可能性が秘められているのでしょう……？"
"90001240-32-ケイ" = "そうです。#nそうなんです！"
"90001240-33" = "[ns] \"ふふっ。\""
"90001240-34-ケイ" = "アリスはともかく、なぜあなたまで笑うんですか……。"
"90001240-35-リオ" = "……補足するなら「誰もたどり着けない」には語弊があるわ。"
"90001240-36-リオ" = "少なくとも、私は知っていたもの。"
"90001240-37-ヒマリ" = "この施設を建てた変わり者は、リオと似ているのかもしれないですね。"
"90001240-38-ヒマリ" = "もし会えたとしたら、建設的な議論ができそうね。"
"90001240-39-ヒマリ" = "そういう意味で言ったのではないのですが……。#nそれに変わり者は一人で十分ですから。"
"90001240-40-ヒマリ" = "それは、どういう……？"
"90001240-41-ヒマリ" = "……お気になさらず。"
"90001240-42-ヒマリ" = "これ以上あなたのような人が増えたら、私の血圧が大変なことになってしまうというだけです。"
"90001240-43-ヒマリ" = "何事ですか！？"
"90001240-44-リオ" = "停電……にしては狙っていたかのような――"
"90001240-45-ケイ" = "……っ！#n周囲に警戒を。"
"90001240-46-ケイ" = "何か、います……。"
"90001240-47-アリス" = "たくさん出てきました！"
"90001240-48-ユズ" = "う、うあああ……！"
"90001240-49" = "[ns] \"みんな、落ち着いて！\""
"90001240-50-リオ" = "……！"
"90001240-51-リオ" = "先生の保護を最優先に！"
"90001240-52-アイン" = "ティ、ティファちゃんが……威力偵察を決行しました……！"
"90001240-53-ソフ" = "いい判断だと思うよ。#nさて、どんな隠し玉が出てくるやら……。"
"90001240-54-オウル" = "うまくいけば、あの時どうやって[ruby=エネルギー]禁じられた力[/ruby]の力場を突破したのか分かるかもしれません。"
"90001240-55-アイン" = "で、でででで、でも、施設が崩れてしまったら、どうします……？"
"90001240-56-ソフ" = "心配しすぎじゃない？#nティファレトだって、まだそこまで派手なことはしないだろうし。"
"90001240-57-オウル" = "ええ。最低限の偵察だけで引き下がるでしょう。"
"90001240-58-オウル" = "まあ、相手の戦力を削ってくれても良いんですけどね～"
