[translation]
"90001190-1" = "第19話;鋼鉄大陸"
"90001190-2-アイン" = "おやおや。どこで何をしているのかと思ったら、そこにいたんですか。"
"90001190-3" = "[s] \"……！\""
"90001190-4-ケイ" = "アリス、こっちへ……。"
"90001190-5-ケイ" = "どうしたのですか、ケイ？"
"90001190-6-ケイ" = "なんだか姿を見せないほうが良い気がしまして。"
"90001190-7-アイン" = "こ、こん、にちは！そして気をつけて、ください！#nわ、私たちはこれから―― "
"90001190-8-アイン" = "と、とっても怖いことを、します！"
"90001190-9-アイン" = "はぁ……私はこの通信の必要性を疑っていますが……まぁいいでしょう。"
"90001190-10-アイン" = "そう、私たちは……。"
"90001190-11-ソフ" = "あんたたちに！宣戦布告をしにきたの！"
"90001190-12-トキ" = "宣戦？"
"90001190-13-トキ" = "布告？"
"90001190-14-ヒマリ" = "……ついにネツァクを完成させたのですね。"
"90001190-15-アイン" = "ち、違いますよ！？#nネ、ネツァクちゃんはずっと前に完成していました！"
"90001190-16-アイン" = "そう！私たちはネツァクが「鋼鉄大陸」になるまで、見つからないように守っていただけ！"
"90001190-17-アイン" = "ああ、これがどれほど素晴らしい偉業なのか、理解できていないのでしょうが。"
"90001190-18-アイン" = "はぁ……もはや落胆を通り越して同情してしまうくらいです。#nなんてもったいない。"
"90001190-19-リオ" = "鋼鉄大陸……？"
"90001190-20-アイン" = "へえ。[ruby=つかつき]調月[/ruby]リオでも、ここまでは把握できてなかったのかな？#nまあ、それも当然だけど。"
"90001190-21-アイン" = "さすがアイン！誰も想像すらできなかったことを平然とやってのけるなんて！"
"90001190-22-アイン" = "え、えへへっ。ありがとう、ソフ。これからも頑張ります……！"
"90001190-23-アイン" = "鋼鉄大陸とは！"
"90001190-24-アイン" = "ね、ネツァクちゃんの進化した姿そのもので……。"
"90001190-25-アイン" = "「禁じられた力」を使って、触れた物質を変換し、領域を広げる金属の大陸……！"
"90001190-26" = "[s] \"拡大する金属の大陸……？\""
"90001190-27-アイン" = "ふふっ、理解力の足りないあなたたちのために、分かりやすく説明してあげましょう。"
"90001190-28-アイン" = "鋼鉄大陸を構成しているのは、「名もなき神々の力」です。"
"90001190-29-アイン" = "そ、その力は……触れた物質の構成を、根本的に変えてしまう……。"
"90001190-30-アイン" = "ここで問題！では、その力で作られた構造体が、周囲の物質に接触したらどうなると思う？"
"90001190-31-ヒマリ" = "まさか……！"
"90001190-32-ヒマリ" = "触れたものを自分と同じ成分に……！？"
"90001190-33-アイン" = "ご明察。鋼鉄大陸に触れたものは全て大陸の一部となっていく――"
"90001190-34-アイン" = "そう、まさに無敵の大陸なんだから！"
"90001190-35-アイン" = "お気をつけて。何の準備もせずに足を踏み入れてしまえば……。"
"90001190-36-アイン" = "一瞬で……ネツァクの一部になってしまいますよ？"
"90001190-37-アイン" = "我にお手伝いできることはありませんか？"
"90001190-38-アイン" = "お、お姉様！？いえ、大丈夫です！お姉様は気にしなくても大丈夫です！私たちが全部やりますから！"
"90001190-39-アイン" = "そうだ！あれがどこまで増大するのか、気になりませんか？#n一緒に観察しましょう！"
"90001190-40-アイン" = "鋼鉄大陸……ネツァクちゃんの限界は、私たちにもよく分かってないので……！"
"90001190-41-アイン" = "どこまで大きくなるんだろうね。楽しみだなぁ。"
"90001190-42-アイン" = "私たちのネツァクは文字通り無限に周囲を喰らい尽くしていくんだから！"
"90001190-43-アイン" = "ゆくゆくは――キヴォトス全土をも飲み込むことでしょう！"
"90001190-44-アイン" = "ふふっ、すごいですよね？驚いて言葉も出ませんよねぇ！？"
"90001190-45" = "[s] \"……質問しても良いかな。\""
"90001190-46-アイン" = "ん？特別に答えてあげるよ。"
"90001190-47" = "[s1] \"キヴォトスを鋼鉄大陸にする目的は？\"\n[s2] \"消えたデカグラマトンの復活でも企んでいるの？\""
"90001190-48-アイン" = "あの方の名を軽々しく呼ぶな！#nそれはあんたが口にしてはいけない神聖な十文字の名前なんだよ！"
"90001190-49-アイン" = "……本当にすごいですね、シャーレの先生。いろいろな意味で。"
"90001190-50-アイン" = "そ、そのうちに、誰もあの方の事を話せなくなる世界が来るでしょう。"
"90001190-51-アイン" = "そう！#n「信じない」を「信じたくない」に変えるんだから！"
"90001190-52-アイン" = "その時になって後悔しても遅いんですけどね？#nキヴォトスは、私たちの計算通りであれば……。"
"90001190-53-アイン" = "――あと三日で、鋼鉄大陸に変わるのだから。"
"90001190-54" = "[ns] \"三日……？\""
"90001190-55-トキ" = "普段であれば、ただの誇大妄想だと放って置くのですが……。"
"90001190-56-トキ" = "デカグラマトンのエンジニアが言うのであれば、聞き流すわけにはいきません。"
"90001190-57-トキ" = "でも、具体的にどうするの？#n鋼鉄大陸に近づいたら一部になっちゃうんだよね？"
"90001190-58-トキ" = "それに、元に戻すのは不可能だとも言っていましたね。"
"90001190-59-ケイ" = "おそらく、あなた達は大丈夫です。#n鋼鉄大陸になるのは、無機物だけでしょうから。"
"90001190-60" = "[s] \"ケイ！\""
"90001190-61-ケイ" = "どこに行っていたのですか？"
"90001190-62-ケイ" = "……あれに見つかったら色々と面倒なことになりそうだったので。"
"90001190-63-ヒマリ" = "話だけは隠れて聞いていましたが……。"
"90001190-64-ケイ" = "本当に、馬鹿げた話ですね。"
"90001190-65-ケイ" = "……どういう意味ですか？"
"90001190-66-ケイ" = "あれは名もなき神の力の劣化版に過ぎません。#n対処法はあります。"
"90001190-67-ケイ" = "いやぁ～、強敵が味方になると頼もしいね！"
"90001190-68-ケイ" = "その言い方だと、補正がかかりそうで嫌ですね……。"
"90001190-69-ケイ" = "そういうの、ケイちゃんも知ってるんだね……嬉しい。"
"90001190-70-ケイ" = "あ……いえ！違います！忘れてください！"
"90001190-71-ケイ" = "「名もなき神」の力の中で代表的なのは、物質の再構築です。"
"90001190-72-ケイ" = "そうね、プロトコルATRAHASISも同じだったわ。"
"90001190-73-ケイ" = "はい。「名もなき神」の力は、波動と粒子の関係を根本から変化させることができます。"
"90001190-74-リオ" = "私はそれをデータの「収集」と「変形」だと解釈したけれど……。"
"90001190-75-ケイ" = "根本的な部分は同じです。#n粒子はエネルギーと同義であり、情報値が存在します。"
"90001190-76-リオ" = "なので、あの鋼鉄大陸――7番目の預言者、ネツァクは無機物の情報値を変換しているだけで、大したことはしていません。"
"90001190-77-ケイ" = "プロトコルATRAHASISに比べれば、児戯のようなものです。#nただ……。"
"90001190-78" = "[s] \"ただ……？\""
"90001190-79-ケイ" = "ここまで大規模な物質の再構築を起こしているという点は、無視できませんが。"
"90001190-80-ケイ" = "それに、対抗手段もないし。"
"90001190-81-ケイ" = "……そうですね。"
"90001190-82-トキ" = "どうすれば良いのでしょうか？"
"90001190-83-ヒマリ" = "「鋼鉄大陸に変換されるのは無機物だけ」という仮説が正しくとも、問題は残ります。"
"90001190-84-リオ" = "そうね。AMASとケイは、鋼鉄大陸に近づけないわ。"
"90001190-85-トキ" = "「アビ・エシュフ」も使えないかと。"
"90001190-86-ミドリ" = "こういう場合って、服や武器も使えなくなるんじゃないですか……？"
"90001190-87-モモイ" = "えっ！？#nじゃあ、私たち近づいたら裸になっちゃう？"
"90001190-88-ミドリ" = "お、お姉ちゃん……！？"
"90001190-89-エイミ" = "裸になったら何か問題あるの？"
"90001190-90-エイミ" = "そう思っているのはあなたくらいですからね……？"
"90001190-91-ユズ" = "わ、わわわわわ、わたしは無理です……！"
"90001190-92-トキ" = "私のパーフェクトメイドボディをお見せするチャンスですね。#n今から楽しみです。ちらっ。"
"90001190-93" = "[ns] \"わ、私！？\""
"90001190-94-トキ" = "……先生以外の方に見られるのは困りますね。#nこれは由々しき事態です。"
"90001190-95-リオ" = "と、トキ……？"
"90001190-96-リオ" = "この極寒の地で清楚系病弱美少女の身体を晒すなんて、たしかに問題ですが……。"
"90001190-97-ヒマリ" = "それ以前に根本的な問題を忘れてはいませんか？"
"90001190-98-ヒマリ" = "そもそも私たちは「多次元バリア」を突破しなければなりません。"
"90001190-99-リオ" = "ありがとう、ヒマリ。その通りよ。"
"90001190-100-アリス" = "ゲームなら、裏技や突破アイテムが用意されていますが……。"
"90001190-101-ユズ" = "（裏技……）"
"90001190-102-ユズ" = "！"
"90001190-103-ユズ" = "あの……バックドアみたいなものが、あったりしませんか？"
"90001190-104-ヒマリ" = "バックドアとは、通常ハッキングの際に――"
"90001190-105-ユズ" = "この場合だと、物理的なバックドアになるんですけど……。"
"90001190-106-リオ" = "詳しく教えてもらえるかしら？"
"90001190-107-リオ" = "そ、その、えっと、あの子たち、資源を大量に集めているって言ってたんですよね……？それなら……！"
"90001190-108-リオ" = "……！"
"90001190-109-リオ" = "なるほど……たしかに採掘された資源は、ネツァクと同じ座標に運ばれていたわ。"
"90001190-110-リオ" = "鉄道と施設を作って資源を加工してたよね？"
"90001190-111-トキ" = "それを守るために、眷属を配置していました。"
"90001190-112-ヒマリ" = "ネツァクが全ての無機物を鋼鉄大陸に変換できるのなら、資源を集める必要なんてない……。"
"90001190-113-リオ" = "そうね。周囲を飲み込んで大きくなるのを待てば良いだけだわ。"
"90001190-114-ヒマリ" = "つまり、この表現が適切か分かりませんが……。"
"90001190-115-ヒマリ" = "ネツァクを進化させるために――資源が必要だったのでしょう。"
"90001190-116-ヒマリ" = "工場で加工された資源がネツァクに使われていると仮定すると……"
"90001190-117-ヒマリ" = "――どこかに物質変換の影響を受けないバックドアがあるはず。"
"90001190-118-ユズ" = "わぁ！さすがユズです！UZQueenは最強です！"
"90001190-119-トキ" = "資源の搬入ルートを調べれば良いのですね。"
"90001190-120-トキ" = "つまり、ネツァクがいる場所へのショートカットを探そうって話だよね？"
"90001190-121-トキ" = "そうです、「賢いモモイ」。"
"90001190-122-モモイ" = "へへっ。私が本気を出したら、これくらいお茶の子さいさいだよ！"
"90001190-123-トキ" = "……「賢い残念なモモイ」に訂正します。"
"90001190-124-モモイ" = "えっ、称号システムなの！？"
"90001190-125-ヒマリ" = "次の目標は決まりました。"
"90001190-126-ヒマリ" = "まずは資源の搬入ルートを探るために、凍原地帯の調査をしましょう。"
"90001190-127-ヒマリ" = "部長、今からでも支援要請したら？"
"90001190-128-リオ" = "……一度は考えたけれど、今からでは時間が足りないわ。"
"90001190-129-リオ" = "あの子たちの言葉を信じるのであれば、キヴォトスが鋼鉄大陸に変わるまであと三日。"
"90001190-130-リオ" = "機密保持を考慮した人選となると……今から最速で行ったとしても……。"
"90001190-131-リオ" = "私たちがここに来るだけでも、三日くらいかかってるもんね。"
"90001190-132-リオ" = "ええ。時間が足りないのよ。"
"90001190-133-エイミ" = "今すぐにでも対応可能な特殊部隊が必要って話だよね。"
"90001190-134-エイミ" = "いつも通り、厳しい条件。"
"90001190-135-アリス" = "リオ先輩、それならアリスたちは……。"
"90001190-136-リオ" = "そうね、貴女の言葉で言うのなら……。"
"90001190-137-リオ" = "私たちで――世界を守るわよ。"
"90001190-138-アリス" = "もちろん、リオ先輩も一緒ですよね？"
"90001190-139-リオ" = "（こういう時はどう答えれば……？）"
"90001190-140-リオ" = "（……）"
"90001190-141-リオ" = "……ええ、その通りよ。"
"90001190-142-アリス" = "パンパカパーン！#nリオ先輩がアリスの正式な仲間になりました！"
"90001190-143-リオ" = "（良かった、間違っていなかったようね）"
"90001190-144-ヒマリ" = "どう思う、部長？"
"90001190-145-ヒマリ" = "まあ、70点ってところですね。リオにしては上出来かと。"
"90001190-146" = "[ns3] \"じゃあ、出発しよう！\"\n[ns4] \"おやつは忘れずに持った？\""
"90001190-147-リオ" = "私たちは、ピクニックに行くわけじゃ……。"
"90001190-148-ヒマリ" = "あら、別に良いと思いますよ？#n過度に緊張しては、能力を発揮できませんから。"
"90001190-149-ヒマリ" = "これは冗談ではなく……極論、遠足気分だって構いません。"
"90001190-150-リオ" = "ヒマリ部長の意見に賛成です。#nどうせ戦闘が始まれば、気を引き締めざるを得ませんから。"
"90001190-151-リオ" = "そ、そういうものかしら……？"
"90001190-152-トキ" = "ええ。ピクニック気分で世界を守る勇者がいても良いのです。"
"90001190-153-ミドリ" = "そうだよ！世界を救った勇者だって、最初は部屋の掃除をしたり庭の雑草を抜くところから始まったんだから！"
"90001190-154-ミドリ" = "……できれば部屋の掃除は真面目にやってほしいけど。"
"90001190-155-モモイ" = "な、なんでぇ！？#n私、今週はちゃんとゴミ捨ててきたよ！？"
"90001190-156-ミドリ" = "お皿は流しに放置してたし、掃除機もかけてないし。"
"90001190-157-モモイ" = "うっ。"
"90001190-158-アリス" = "大丈夫です、モモイ！#n掃除機はアリスがかけておきましたので！"
"90001190-159-アリス" = "そうやって、いつも甘やかすんだから……。"
"90001190-160-アリス" = "あ、アリスが悪いのですか……？"
"90001190-161-ケイ" = "アリス以外、全員悪いです。"
"90001190-162-ケイ" = "わ、わたしも……？"
"90001190-163-ケイ" = "……ユズは大目に見ます。"
"90001190-164-ユズ" = "あ、ありがとう、ケイちゃん……えへへ。"
"90001190-165-ケイ" = "ケイちゃんと呼ばれる回数が増えていませんか……？"
"90001190-166" = "[s] \"ケイちゃんは、ケイちゃんだから！\""
"90001190-167-ユズ" = "先生は黙っててください！"
"90001190-168-リオ" = "私の輸送船を使うと良いわ。#nそこまで大きくないかもしれないけど……。"
"90001190-169-リオ" = "十分大きいと思うけど……？"
"90001190-170-モモイ" = "この大きさでは、運べる物資の量が少ないのよ。"
"90001190-171-ヒマリ" = "皆さん、迅速に出発しましょう。"
"90001190-172-ヒマリ" = "車椅子は私が運ぶよ。"
"90001190-173-ヒマリ" = "あら、では私は先生におんぶしてもらうとしましょうか。"
"90001190-174-エイミ" = "もちろん、清楚で可憐な私をお姫様抱っこしたいと言うのなら、#n私は一向に構いませんが。"
"90001190-175-ヒマリ" = "……先生？#n女性を待たせてはいけませんよ。"
"90001190-176-トキ" = "……。"
"90001190-177-リオ" = "トキ、ヒマリを運んであげて。"
"90001190-178-トキ" = "……。"
"90001190-179-トキ" = "はい、リオ様。"
"90001190-180-ヒマリ" = "あ、あなたたちにはお願いしていませんよ！？"
"90001190-181-ヒマリ" = "こういう時は、助け合っていくものです。"
"90001190-182-ヒマリ" = "私の経験上、トキがまともなことを言う時は何か裏が――"
"90001190-183-ヒマリ" = "ひぃっ、せ、先生……！"
"90001190-184" = "[ns] \"……みんな、出発しようか。\""
"90001190-185-モモイ" = "う、うん……じゃあゲーム開発部も出動！"
"90001190-186-モモイ" = "はい！"
"90001190-187" = "次回;兆候"
