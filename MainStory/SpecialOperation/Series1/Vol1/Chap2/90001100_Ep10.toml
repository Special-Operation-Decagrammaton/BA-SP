[translation]
"90001100-1" = "第10話;名もなき神の遺産"
"90001100-2-ヒマリ" = "私たちは氷河からコクマーの痕跡を辿ってここに至り――"
"90001100-3-ヒマリ" = "火山地帯で採取した資源を輸送していることを把握しました。"
"90001100-4-リオ" = "そうね。鉄道を作ってどこかに送っていたわ。#nそのための施設が至る所に残っているはずよ。"
"90001100-5-リオ" = "では、私がそれを偵察してきてもよろしいでしょうか？"
"90001100-6-リオ" = "ええ。お願い。"
"90001100-7-エイミ" = "私も手伝おうか？"
"90001100-8-ヒマリ" = "いえ、エイミには他に頼みたいことがあります。"
"90001100-9-ヒマリ" = "頼みたいこと？"
"90001100-10-ヒマリ" = "はい。周辺に残っているデカグラマトンの残留基地を分析してください。"
"90001100-11-ヒマリ" = "サンプルをもっと集めてくればいいのかな？"
"90001100-12-ヒマリ" = "話が早くて助かります。#nサンプルは多ければ多いほどいいですからね。"
"90001100-13-ヒマリ" = "……リオは一体何を？"
"90001100-14-リオ" = "サンプルを追加で集めるのではなくて？"
"90001100-15-リオ" = "……手伝ってくれるのですね？"
"90001100-16-リオ" = "ええ、そのつもりよ。その方が効率的だもの。"
"90001100-17-ヒマリ" = "ありがとうございます。それでは、手早く済ませましょう。"
"90001100-18" = "[s] \"なんだかんだ……。\""
"90001100-19" = "[ns] \"仲良いんだね！\""
"90001100-20-ヒマリ" = "そんなことありませんよ！？"
"90001100-21-リオ" = "それは勘違いよ。"
"90001100-22-エイミ" = "これで大丈夫そう？"
"90001100-23-ヒマリ" = "ええ、十分です。分析も……もう終わりそうです。#n結果は無事届いていますか？"
"90001100-24-リオ" = "問題ないわ。私の方も結論が出せそうよ。"
"90001100-25-リオ" = "あら、どのような結論でしょうか？"
"90001100-26-リオ" = "これは現場でも確認できることだけれど――"
"90001100-27-リオ" = "物質の再構築がされた痕跡が残っているの。"
"90001100-28-ヒマリ" = "なるほど……以前、目の当たりにしたことのある力ですね。"
"90001100-29" = "[s] \"そうなの？\""
"90001100-30-ヒマリ" = "はい。アトラ・ハシースの箱舟を覚えていますか？"
"90001100-31-ヒマリ" = "そこでアリスと――ケイと呼ばれる個体……あの子に起きたことを。"
"90001100-32" = "[ns] \"あ……！\""
"90001100-33-リオ" = "そういうことよ。"
"90001100-34-ヒマリ" = "はい。その通りです。"
"90001100-35-リオ" = "物質の再構築は、「名もなき神」の力の中で最も代表的なものよ。"
"90001100-36-リオ" = "コクマー本体は確認する方法がないけれど……少なくとも、この凍原地帯の資源採取や輸送設備、もしかしたら眷属も……"
"90001100-37-ヒマリ" = "ええ。物質再構築――「名もなき神」の力を利用して作られたものではないかと。"
"90001100-38-ヒマリ" = "それによって、私たちの仮説は確定段階に到達したと言えます。"
"90001100-39" = "[s] \"確定段階？\""
"90001100-40-ヒマリ" = "はい。すべてのピースが揃ったと言えるでしょう。#nそれは――"
"90001100-41-トキ" = "[ruby=あすま]飛鳥馬[/ruby]トキ、ただいま戻りました。報告いたします。"
"90001100-42-トキ" = "火山地帯から続く線路を発見。#n道中に少数の眷属を確認しました。"
"90001100-43" = "[s] \"お疲れ様、トキ。\""
"90001100-44-トキ" = "職務を遂行したまでです。#nですが、先生はもっと私を褒めてください。"
"90001100-45-トキ" = "具体的には、頭を撫でる、軽いハグ、頬を両手で包み込むなどがあります。"
"90001100-46-リオ" = "……何をそんなに慌てているのですか？"
"90001100-47-リオ" = "トキ……？"
"90001100-48-エイミ" = "諦めて、会長。#nこれがトキの素なのか、変わったからなのかわからないけど……最近はずっとこんな感じだよ。"
"90001100-49-ヒマリ" = "……話を戻しましょう。"
"90001100-50" = "[s] \"そ、そうだね！すべてのピースが揃ったってどういうこと？\""
"90001100-51-ヒマリ" = "……しょぼん。"
"90001100-52-トキ" = "特異現象捜査部がこれまでに相対したデカグラマトンの預言者は、ビナー、ケセド、ホド、ケテルの4体……"
"90001100-53-ヒマリ" = "4体とも、「名もなき神」の力とは何の関係もありませんでした。"
"90001100-54-ヒマリ" = "ですが、氷河に到着してから相対したゲブラとコクマーには、「名もなき神」の力の痕跡が残っていたのです。"
"90001100-55-ヒマリ" = "溶岩の上に船が浮かぶのも……それと関係があるのかもしれません。"
"90001100-56" = "[s1] \"つまり、デカグラマトンと預言者が。\"\n[s2] \"「名もなき神」の力を使ってるってこと？\""
"90001100-57-ヒマリ" = "はい。それは確実かと。"
"90001100-58-ヒマリ" = "問題はその力を利用して何をするつもりなのか、ですが……"
"90001100-59-ヒマリ" = "ッ！？#nリオ、今のは……？"
"90001100-60-リオ" = "ええ。こちらでも確認できたわ。"
"90001100-61-エイミ" = "何か起きたの？"
"90001100-62-トキ" = "私たちにも共有を……。"
"90001100-63-ヒマリ" = "先に伝えておきます。#nこれは……緊急事態です。"
"90001100-64-リオ" = "結論から言うと――新しい預言者の信号を探知したわ。"
"90001100-65-ヒマリ" = "それも、今までとは一線を画す……。"
"90001100-66-ヒマリ" = "とても強力な信号、です。"
"90001100-67" = "次回;行き止まり"
