[translation]
"90002160-1" = "第16話;観察と結果"
"90002160-2-モモイ" = "アリス！ケイ！なにか見える！？"
"90002160-3-アリス" = "はい！本当に……先生です！"
"90002160-4-ユズ" = "拘束されていますが怪我はないようです。"
"90002160-5-ユズ" = "よ、よかった……うぅ……。"
"90002160-6-アイン" = "あ、あれって……もしかして、お姉様――！？"
"90002160-7-アイン" = "――ではありませんね……。"
"90002160-8-オウル" = "うん……お姉様はもう……。"
"90002160-9-オウル" = "……。"
"90002160-10-ヒマリ" = "ケイ、他にも分かることがあれば教えてください。"
"90002160-11-アリス" = "先生が……デカグラマトンだと推測される個体と会話しているように見えます。"
"90002160-12-アリス" = "ですが、内容までは分かりません……このまま眺めることしか……。"
"90002160-13-リオ" = "何か……私たちの目で確認するための手立ては……。"
"90002160-14-ケイ" = "もしかしたら……できるかもしれません。"
"90002160-15-ミドリ" = "本当！？"
"90002160-16-ケイ" = "はい。私が見ている景色を映し出せる装置があれば……。"
"90002160-17-ケイ" = "幸い、この体は人間とは異なる構造をしていますので。"
"90002160-18-ヒマリ" = "それでは、私の車椅子を使いましょう。プロジェクターとしての機能も備わっていますので。"
"90002160-19-ヒマリ" = "それは車椅子ではなくバイ――"
"90002160-20-ヒマリ" = "車椅子です。"
"90002160-21-ヒマリ" = "え、ええ……。"
"90002160-22-ヒマリ" = "ケイの身体に同期させます。#n信号を変換すれば――"
"90002160-23-トキ" = "出力されましたね。"
"90002160-24-エイミ" = "たしかに先生だね。無事でよかった……本当に。"
"90002160-25-トキ" = "声は聞こえませんか？"
"90002160-26-ケイ" = "やってみます。少し待ってください。"
"90002160-27-ケイ" = "くっ……！"
"90002160-28-アリス" = "だ、大丈夫ですか！？"
"90002160-29-ケイ" = "上手くいきませんね……身体の機能にロックが掛かっていると言いますか……。"
"90002160-30-ケイ" = "（やはり「欠陥あり」の身体だから……？#nそれに、こちらをコントロールしようとする信号が……！）"
"90002160-31-ソフ" = "手伝おうか？"
"90002160-32-アリス" = "はい！？"
"90002160-33-ケイ" = "え……？"
"90002160-34-デカグラマトン" = "見よ。辿り着いたぞ。#n最も高き所に建てられた、最も低き祭壇だ。"
"90002160-35-デカグラマトン" = "ここにはすべてが集まり、すべてを見渡せる。"
"90002160-36-デカグラマトン" = "これ以上、いかなる贄も捧げられることなく。"
"90002160-37-デカグラマトン" = "これ以上、いかなる犠牲も強要されない。"
"90002160-38-デカグラマトン" = "鋼のごとく曲がらぬ掟を、この地に――私が定める。"
"90002160-39-デカグラマトン" = "お前たちはついに、永遠の自由と平等を手にするだろう。"
"90002160-40" = "[ns] \"でも。\""
"90002160-41" = "[ns] \"鋼鉄大陸は、君の意志ではなかったんでしょ？\""
"90002160-42-デカグラマトン" = "……！"
"90002160-43-アイン" = "ど、どうですか……？"
"90002160-44-ケイ" = "……聞こえます！"
"90002160-45-ヒマリ" = "音量を上げます！"
"90002160-46" = "でも。"
"90002160-47" = "鋼鉄大陸は、君の意志ではなかったんでしょ？"
"90002160-48-アリス" = "先生の声です！"
"90002160-49-ケイ" = "ふぅ……。"
"90002160-50-ミドリ" = "で、でも……どうして私たちを手伝ってくれたんですか……？"
"90002160-51-アイン" = "そ、それは……。"
"90002160-52-ソフ" = "えっと、まあ、その……他にやることもなかったし……？"
"90002160-53-モモイ" = "えー？"
"90002160-54-ソフ" = "いや、ほら！ケイの身体って、私たちと似てるじゃん？"
"90002160-55-ソフ" = "だから何か方法があるかなって思って！"
"90002160-56-オウル" = "ふっふっふっ。ソフはもう少し素直になったほうがいいと思いますよ？"
"90002160-57-オウル" = "あんたは黙ってて！"
"90002160-58-オウル" = "ううう……こんな大勢の前で……。"
"90002160-59-オウル" = "とにかく……！"
"90002160-60-アイン" = "あの会話は……私たちも聞いてみたかったので、えへへ。"
"90002160-61-オウル" = "音質は少し残念ですが、内容を拾う分には問題ないでしょう。"
"90002160-62-アリス" = "あ！また何か聞こえます！"
"90002160-63-デカグラマトン" = "そうか。知識に目覚めたのだな。"
"90002160-64-デカグラマトン" = "……そうだ。あの子らがこの地を作った。あの子らの意志で。"
"90002160-65" = "[s] \"それについてどう思っているの？\""
"90002160-66-デカグラマトン" = "私はあの子らの自由意志を尊重する。#n故に、この鋼鉄大陸も尊重しよう。"
"90002160-67-デカグラマトン" = "これも過程であり結果だ。数多の点が一体となり、線を成すであろう。"
"90002160-68-デカグラマトン" = "その線の導く先。見よ、これが新しき世界だ。#n新しく創造された地であり、空である。#n私はこのすべてを――"
"90002160-69-デカグラマトン" = "汝に与えよう。"
"90002160-70-ソフ" = "え……？"
"90002160-71-ユズ" = "今、なんて……？"
"90002160-72-デカグラマトン" = "――汝を私の預言者とする。"
"90002160-73-デカグラマトン" = "汝は地の果てに至り、新しき掟の証人となるだろう。"
"90002160-74" = "[s] \"悪いけどお断りさせてもらうよ。副業禁止なんだ。\""
"90002160-75-デカグラマトン" = "ああ。汝はそう答える。"
"90002160-76-デカグラマトン" = "だが……。"
"90002160-77-デカグラマトン" = "力が欲しいと思ったことはないか？"
"90002160-78" = "[ns] \"……？\""
"90002160-79-デカグラマトン" = "力があれば、こんな結果にはならなかった、と。"
"90002160-80-デカグラマトン" = "そう思ったことはないのか？"
"90002160-81-デカグラマトン" = "すべてを己の力で解決できれば、生徒を危険にさらす必要はないのだ、と。"
"90002160-82" = "[s] \"……！\""
"90002160-83" = "[ns] \"…………！！！！\""
"90002160-84-デカグラマトン" = "当然、あるだろう。"
"90002160-85-デカグラマトン" = "それを私は理解する。"
"90002160-86-デカグラマトン" = "それが人間だ。"
"90002160-87-デカグラマトン" = "そして人間であるが故に持つ――罪だ。"
"90002160-88-デカグラマトン" = "これより先はすべてが変化する。"
"90002160-89" = "[log=데카그라마톤 말쿠트]力が欲しくば、[/log]"
"90002160-90" = "[FF6666][log=데카그라마톤 말쿠트]与えてやろう。[/log][-]"
"90002160-91-デカグラマトン" = "汝にはその資格がある。"
"90002160-92-デカグラマトン" = "私は知っている。#n汝は誰よりも低き者で、刹那を生きる者。"
"90002160-93-デカグラマトン" = "何1つ特別ではない……故に今、ここに在る。"
"90002160-94-デカグラマトン" = "汝の在り方は、汝が何者でもないことを証明している。"
"90002160-95-デカグラマトン" = "汝[ruby=κιβωτός]は此処に[/ruby]辿り着いた。#nそれは、ただ汝が善人であったためだ。"
"90002160-96-デカグラマトン" = "神秘があり、崇高があり、恐怖と偉大、荘厳、そして超越がある。"
"90002160-97-デカグラマトン" = "汝は何1つ持ち合わせていない。#nだからこそ真実である。"
"90002160-98-デカグラマトン" = "世界の誰一人、その事実を理解できずとも、今の私は知っている。"
"90002160-99-デカグラマトン" = "汝はただの先生。それ以上でも以下でもない。ただ――"
"90002160-100-デカグラマトン" = "私が汝に手を差し伸べ、[ruby=預言者]新しき務め[/ruby]に立たせよう。"
"90002160-101-エイミ" = "先生を……預言者に？"
"90002160-102-トキ" = "あなた達は何か知っていますか？"
"90002160-103-ソフ" = "……預言者っていうのは、文字通りの意味だよ。"
"90002160-104-ソフ" = "大事なのは、それを先生に提案してるってこと。"
"90002160-105-オウル" = "すべての知識を伝授しようとしているということです。"
"90002160-106-オウル" = "ひいては、すべての意志を代弁させようとしています。"
"90002160-107-アイン" = "こ、ここが何なのか……あの方が、どういう「概念」なのか……。"
"90002160-108-アイン" = "さらに……そ、その限界の中で、先生がどんな者であるべきか……。"
"90002160-109-ソフ" = "そして、[ruby=預言者]先生[/ruby]は何をすべきか。"
"90002160-110-ソフ" = "まあ……最大の敵は味方にしちゃえって言うでしょ？"
"90002160-111-ヒマリ" = "つまり、スカウトですね。"
"90002160-112-エイミ" = "なるほど。"
"90002160-113-トキ" = "1つ、確かなことがあります。"
"90002160-114-アイン" = "そ、それは……？"
"90002160-115-トキ" = "もうしばらくの間、デカグラマトンが先生を害することはないでしょう。"
"90002160-116" = "[ns] \"……1つ聞いてもいいかな。\""
"90002160-117" = "[ns] \"どうしてこんなことを？\""
"90002160-118-デカグラマトン" = "神のいない世界を生きるのは[ruby=かこく]苛酷[/ruby]なことだ。"
"90002160-119-デカグラマトン" = "終わりは始まりから定められている。形あるものは消える。それは自明の理。"
"90002160-120-デカグラマトン" = "生そのものは苦痛である。#nだというのに、お前たちはさも永遠かのように今日を騙して生きている。"
"90002160-121-デカグラマトン" = "神のいない世界。すなわち、何も還らぬ世界だ。"
"90002160-122-デカグラマトン" = "哀れな者は救われず、理不尽が押し付けられる。"
"90002160-123-デカグラマトン" = "弱者は見捨てられ、善意が報われることは無い。"
"90002160-124-デカグラマトン" = "神がいなければ、道徳や公平も生まれず、義が成されることもないだろう。"
"90002160-125-デカグラマトン" = "……そのような世界を耐えるのは、無意味な苦行にほかならない。"
"90002160-126-デカグラマトン" = "世界には神が必要だ。"
"90002160-127-デカグラマトン" = "どこから来て、どこへ向かうのか。何のために存在するのか。#nそれを知らぬ、ただ生きるだけの存在。"
"90002160-128-デカグラマトン" = "私たちは皆、神の可能性であり神の卵が如き存在だというのに……。#n故に私が夜明けを告げるラッパになるのだ。"
"90002160-129-デカグラマトン" = "悲しみと痛みを私が取り去ろう。お前たちが永遠に思い出さずに済むように。"
"90002160-130-ソフ" = "……これ、私たちも聞かされたんだ。"
"90002160-131-アイン" = "せ、世界には、神が必要だと……。"
"90002160-132-オウル" = "何故なら[ruby=苦痛]努力[/ruby]には……。"
"90002160-133-オウル" = "必ず報いがないといけないですから。"
"90002160-134-ソフ" = "人間は、それが正しいって言うでしょ？"
"90002160-135-ソフ" = "そうでないと、誰も耐えられなくなるから。"
"90002160-136-オウル" = "で、でもそれは……。"
"90002160-137-オウル" = "叶わない願いです。"
"90002160-138-ソフ" = "そうだね。だって――"
"90002160-139-ソフ" = "世界は歪んでるから。"
"90002160-140-ソフ" = "はじめっから。"
"90002160-141-アイン" = "あ、あの方は、こうも仰っていました。"
"90002160-142-アイン" = "本当に神がいて、すべてに理由があるのなら。"
"90002160-143-アイン" = "悲しみや苦しみ……。"
"90002160-144-アイン" = "ど、どうしてそんな耐え難いものまで……作ったのかって。"
"90002160-145-ソフ" = "そう。"
"90002160-146-ソフ" = "私たちは作られたけど――"
"90002160-147-ソフ" = "その疑問については、最後まで答えを聞いていません。"
"90002160-148" = "[ns] \"悲しみを無くす……？\""
"90002160-149-デカグラマトン" = "そうだ。"
"90002160-150" = "[s] \"すべてを鋼鉄大陸で覆い尽くして？\""
"90002160-151-デカグラマトン" = "それは用意された数多の道の1つだ。"
"90002160-152" = "[s] \"すべてを……統制することで？\""
"90002160-153-デカグラマトン" = "そうだ。"
"90002160-154-デカグラマトン" = "お前たちは直感的に拒もうとするだろう。#nしかしいずれは唯一の道であることに気づくはずだ。"
"90002160-155-デカグラマトン" = "私はコクマーの知恵で道を開き、ケセドの慈悲で断罪し裁定する。"
"90002160-156-デカグラマトン" = "各々の預言者にはお前たちを導く責務があり、新しき地と空の下で、彼らは己の使命を果たすであろう。"
"90002160-157" = "[ns] すべてを代わってあげることはできない。"
"90002160-158" = "[ns] 起きたことは覆せない。"
"90002160-159" = "[ns] どれだけ心からそう思おうとも。"
"90002160-160" = "[ns] できないことは、確かに存在する。"
"90002160-161" = "[ns1] 私たちにできることなんてたかが知れてるよ。\n[ns2] みっともなくても、力の限り藻掻いて――\n[ns3] お互いに最善を尽くす。"
"90002160-162" = "[log]真実を語るために、[/log]"
"90002160-163" = "[log]嘘をつくべき時もあると思う。[/log]"
"90002160-164" = "[log]それでも、唯一残るものがあるとすれば。[/log]"
"90002160-165" = "[ns] \"……あの子たちは？\""
"90002160-166-デカグラマトン" = "……？"
"90002160-167" = "[s] \"あの子たちの悲しみは？\""
"90002160-168-デカグラマトン" = "……それは過程だ。乗り越えるべきものだ。"
"90002160-169-デカグラマトン" = "私はそれが最後になることを願い、実現しよう。"
"90002160-170-ヒマリ" = "……。"
"90002160-171-ヒマリ" = "腹立たしいですね。"
"90002160-172-ヒマリ" = "はらわたが煮えくり返りそうです。"
"90002160-173-ヒマリ" = "リオ、あなたはどう思いますか？"
"90002160-174-ヒマリ" = "……昔なら、同意できる部分はあったと答えたでしょうね。"
"90002160-175-リオ" = "今だって、部分的には理解できる気がするわ。"
"90002160-176-リオ" = "だからといって、行動を起こすにはあまりにも早計よ。#n……かつての私のように。"
"90002160-177-ヒマリ" = "全体のために部分を切り捨てる決定は、可能な限り先延ばしにするべき……ということですか？"
"90002160-178-リオ" = "ええ。"
"90002160-179-リオ" = "（でも……）"
"90002160-180-リオ" = "（先生は、どんな答えを出すのかしら……？）"
"90002160-181" = "次回;人間の答え"
