[translation]
"90002260-1" = "第26話;エピローグ（２）"
"90002260-2-ユズ" = "ケイちゃん……ど、どうかな……。#n新作の『アークティック・アドベンチャー・ファイナル』……。"
"90002260-3-モモイ" = "当然神ゲーだよね！なんてったって今回の経験を活かしたシナリオなんだから！"
"90002260-4-ミドリ" = "うん。アートリソースも十分確保できた。"
"90002260-5-アリス" = "アリスも頑張ってコーディングしました！"
"90002260-6-ケイ" = "……あの。"
"90002260-7-ケイ" = "なんですか、これ……？"
"90002260-8-モモイ" = "ゲームだよ？"
"90002260-9-ケイ" = "これをゲームだと言い張る勇気は認めます。"
"90002260-10-ケイ" = "ですが、もう少し客観的な視点を持った方がいいのではないでしょうか。"
"90002260-11-モモイ" = "なにっ！？"
"90002260-12-ユズ" = "どうして……？"
"90002260-13-ユズ" = "う、うぅ……。"
"90002260-14-アリス" = "うわーん！"
"90002260-15-モモイ" = "まず世界観がおかしいです。これ、ファンタジーですよね？#nなのになぜ雪原から突然、巨大怪獣ロボットが出てくるんですか？"
"90002260-16-モモイ" = "ふっふっふっ……。まだロマンというものが分かっていないようだね……。"
"90002260-17-ケイ" = "いえ、ロマンにも限度があります。"
"90002260-18-ケイ" = "何でも好き勝手やっていたら、それはロマンではなく自己満足です。"
"90002260-19-ケイ" = "それに、巨大怪獣ロボットだけならまだマシです。"
"90002260-20-ケイ" = "なんで急に虚数空間に入るんですか！？しかも操作性が最悪！！"
"90002260-21-モモイ" = "きょ、巨大怪獣ロボットだから操作しやすいわけないじゃん？#nそこも含めてロマンなの！"
"90002260-22-モモイ" = "ロマンとは、時代錯誤だからロマンなんだよ！"
"90002260-23-ケイ" = "だからそんなのただの自己満足ですって！！"
"90002260-24-モモイ" = "そんなー！"
"90002260-25-ケイ" = "この敵は何ですか？虚数空間に入ってからエビだけで7匹目ですよね？"
"90002260-26-ミドリ" = "で、でも色は全部違うし……。"
"90002260-27-ケイ" = "結局エビじゃないですか！"
"90002260-28-ミドリ" = "こ、これはカラーバリエーションって技なんだよ！#nリソースの削減とか、投資される資源を最適化するためで……！"
"90002260-29-ケイ" = "だからといって7種類も色違いが必要なんですか？"
"90002260-30-ケイ" = "カラバリにだって限度があるでしょう！"
"90002260-31-ミドリ" = "序盤でペンギンを描くのに集中しすぎたせいで、時間が……。"
"90002260-32-ミドリ" = "エビより、ペンギンのほうがかわいいから……。"
"90002260-33-ケイ" = "結局は私情だということですね！？"
"90002260-34-ミドリ" = "う、うぅっ……！"
"90002260-35-ケイ" = "あと虚数空間に入る前の地上パートですが……。"
"90002260-36-ケイ" = "なんで戦闘で「ダッシュ」と「ローリング」、「ジャンプ」が同じボタンなんですか！？"
"90002260-37-ユズ" = "そ、それは押してすぐ外すと「ローリング」で……#n3フレームくらい押すと「ジャンプ」だよ。"
"90002260-38-ユズ" = "そこからまた3フレーム押すと、「ダッシュ」になって……。"
"90002260-39-ユズ" = "ぜ、全部回避の動作だから……。#n1つのボタンにまとめたほうが、わ、わたしは便利で……。"
"90002260-40-ユズ" = "ち、ちなみに、まだあるんだよ。"
"90002260-41-ユズ" = "ローリングの瞬間にパリィをして……1フレームのジャストパリィに成功すれば……。"
"90002260-42-ユズ" = "ぼ、ボスの後ろに回って……大ダメージを与えられるから、練習してみてね……。"
"90002260-43-ケイ" = "ゲームの操作性をあなた基準に合わせてどうするんですか！"
"90002260-44-ケイ" = "私はそんなに細かく操作できません！いえ、ほとんどの人が無理ですよ！"
"90002260-45-ユズ" = "け、ケイちゃんも頑張ればできるよ……！たぶん……。"
"90002260-46-ケイ" = "ユズ……この世の全員があなたみたいなゲーマーにはなれません……。"
"90002260-47-ケイ" = "それにさっきの中間ボス、あれ酷すぎませんか？#n最悪な操作性を我慢してようやく倒したのに復活ギミックですか！？"
"90002260-48-ケイ" = "いえ、1回ならまだ分かります。でも2回も3回も繰り返すのはやりすぎでしょう！？"
"90002260-49-ユズ" = "お、面白くなかった……？"
"90002260-50-ケイ" = "苦行かと思いましたよ！"
"90002260-51-ユズ" = "うぅぅ……。"
"90002260-52-ケイ" = "最後に……ここの画面、なんだかチカチカしません？バグですか？"
"90002260-53-ケイ" = "あの黄色の虚数空間エビ……が投げてくる隕石にやられるところでしたよ！"
"90002260-54-アリス" = "そこのコーディングはアリスがやりました。ごめんなさい……。"
"90002260-55-ケイ" = "なるほど、それなら仕方ありません。まだ慣れないところもあるでしょうし。"
"90002260-56-アリス" = "むしろここまで出来たことを褒めるべきですね。さすがはアリスです。"
"90002260-57-モモイ" = "ちょっとちょっと！アリスにだけ甘すぎるんじゃないの！"
"90002260-58-ケイ" = "日頃の行いの差でしょう。#nあなたはまず、巨大怪獣ロボットと虚数空間について悔い改めてください。"
"90002260-59-モモイ" = "ぐえっ……。"
"90002260-60-トキ" = "それで、これはいつから正式にプレイできますか？"
"90002260-61-ケイ" = "トキ……あなたはまた……。"
"90002260-62-トキ" = "なにか問題でも？"
"90002260-63-ケイ" = "あなた、特異現象捜査部とC&Cの所属でしょう……？#n何でここにいるんですか……？"
"90002260-64-トキ" = "ミレニアムは能力さえあれば、複数の部活を掛け持ちすることができますので。"
"90002260-65-トキ" = "それに、ここは私の遊び場でもあります。"
"90002260-66-モモイ" = "遊び場……私たちはゲームを開発する部活なのに……。"
"90002260-67-ミドリ" = "お姉ちゃんが言うと説得力あるね……。"
"90002260-68-モモイ" = "良いゲームを作るには、ゲームをたくさんプレイするべきなんだよ！"
"90002260-69-ミドリ" = "はいはい。それもう100回は聞いたから……。"
"90002260-70-トキ" = "そもそもトキ、あなたは趣味がなかったのでは？"
"90002260-71-トキ" = "ないわけではありません。探しているだけです。"
"90002260-72-トキ" = "それに最近はゲームやマンガ、ネット配信に[ruby=・]少[/ruby][ruby=・]し[/ruby]興味を持つようになりました。"
"90002260-73-ケイ" = "少し？その割には入り浸っているような……。"
"90002260-74" = "（トキは自身の胸元をトントンと叩いた）"
"90002260-75-トキ" = "鋼のメンタルには自信があります。ぶいっ。"
"90002260-76-ケイ" = "バカですか！？"
"90002260-77-ケイ" = "バカではなく、メンタルです。"
"90002260-78-ケイ" = "ああもう――っ！"
"90002260-79-アリス" = "け、ケイ！？倒れちゃダメです！"
"90002260-80-モモイ" = "今の話！次のシナリオにしよう！"
"90002260-81-ケイ" = "モモイ――！！！"
"90002260-82-アリス" = "……。"
"90002260-83-アリス" = "みんな楽しく過ごせて、アリスは嬉しいです！"
"90002260-84-ヒマリ" = "ここも久しぶりです。あ、リオは初めてですよね？"
"90002260-85-リオ" = "ええ。ここで……すべての事をやっていたのね。"
"90002260-86-ヒマリ" = "様々な事件を経て、またここに戻ってきました。"
"90002260-87-リオ" = "……ありがとう、ヒマリ。"
"90002260-88-リオ" = "本当に。"
"90002260-89-ヒマリ" = "……ええ。"
"90002260-90-ヒマリ" = "と、とにかく！これで特異現象捜査部もお役御免ですね。"
"90002260-91-エイミ" = "あー、また部長と会長が変な仕事を押し付けてきた……って最初は思ってたなぁ。"
"90002260-92-ヒマリ" = "そんなわけないでしょう。私はリオとは違いますよ。"
"90002260-93-ヒマリ" = "気遣いができて、柔軟な思考を持ち、包容力もあり、常識人である私が――"
"90002260-94-ヒマリ" = "無茶な頼みごとをするわけがありません。"
"90002260-95-リオ" = "（……そうだったかしら？）"
"90002260-96-ケイ" = "図々しさに拍車がかかっているのでは……？"
"90002260-97-エイミ" = "もともとこんなもんだったと思うよ。"
"90002260-98-トキ" = "はい。リオ会長とヒマリ部長は、まさにどんぐりの背比べです。"
"90002260-99-トキ" = "僅差でどちらに軍配が上がるかは……言及しないでおきます。ピース、ピース。"
"90002260-100-ヒマリ" = "失礼ですね！？全然違います！"
"90002260-101-ヒマリ" = "同じ変人でも計画性が有ると無いとでは、雲泥の差なのですよ！？！？"
"90002260-102" = "[s] \"……変人ってところは認めるんだね。\""
"90002260-103-ヒマリ" = "先生まで！？"
"90002260-104-リオ" = "（……私の認識が大きく外れてはいないようね）"
"90002260-105-ヒマリ" = "あなたはなんでホッとした顔をしているんですか！？"
"90002260-106" = "[s] \"ほらほら、みんな仲良くね……。\""
"90002260-107-ヒマリ" = "こほん……。"
"90002260-108-ヒマリ" = "あれほどの事件で、数多くの成果を上げたのはよかったものの……。"
"90002260-109-ヒマリ" = "世間に公表できないのは少し残念ですね。"
"90002260-110-ヒマリ" = "キヴォトスに広まっている怪談――ライブラリー・オブ・ロアに、せめて1行くらい追加できそうだったのに。"
"90002260-111-リオ" = "危険を排除したのだから、それでいいのではなくて？#nこれ以上、望むものがあるかしら。"
"90002260-112-ヒマリ" = "そこで正論を言われると私の立場がないじゃないですか……。"
"90002260-113-リオ" = "だって貴女の望みを叶えるには、特異現象捜査部の存在を公表するところから始めなければならないのよ？"
"90002260-114-リオ" = "ということは貴女が姿を消していた理由を説明する必要が出てきて――"
"90002260-115-リオ" = "その前に特異現象……デカグラマトンという存在を説明する過程が必要ね。#nそうなれば貴女のポジションが――"
"90002260-116-ヒマリ" = "分かってます！分かってますから！ちょっと言ってみただけですっ！！！！"
"90002260-117-ケイ" = "今回はリオが正しいと思いますよ……。"
"90002260-118-ヒマリ" = "ありがとう。"
"90002260-119-リオ" = "では……戻って早々なのだけれど、私はまたここを離れることにするわ。#n久々にミレニアムの様子が見られて良かった。"
"90002260-120-ヒマリ" = "はい？"
"90002260-121-エイミ" = "うん？"
"90002260-122-トキ" = "リオ様？"
"90002260-123-ケイ" = "はぁ……先生、どうにかしてください。"
"90002260-124" = "[s] \"いくらなんでもそれは違うんじゃないかな！\""
"90002260-125-リオ" = "わ、私また何か変なことを言ったのかしら……？#nだって、いつまたキヴォトスに危機が訪れるか分からないのだから――"
"90002260-126-ケイ" = "合理的かつ効率的に備えるためには、裏で動いた方が効果的だとでも？"
"90002260-127-リオ" = "……っ！？"
"90002260-128-ヒマリ" = "ここからは少し真面目な話をしましょう。"
"90002260-129-ヒマリ" = "まず、ミレニアムに残っていても暗躍することはできます。"
"90002260-130-ヒマリ" = "他でもない私がそうしているので、保証できます。"
"90002260-131-リオ" = "それはただ貴女の性格が少し歪んでいるだけでは……。"
"90002260-132-ケイ" = "ぷふっ！？"
"90002260-133-ヒマリ" = "エイミ……？私……今ちょっと生きる意志を失ってしまいました。"
"90002260-134-エイミ" = "大丈夫だよ。部長はちょっとやそっとじゃへこたれないくらい図々――いや、図太い人なんだから。"
"90002260-135-トキ" = "そうです。私の知っているヒマリ部長は、どんなにつらいことがあろうと自分を見失わない人です。"
"90002260-136-ヒマリ" = "最近、皆さんからの評価が怪しくなっている気がするのですが……。"
"90002260-137-ヒマリ" = "なんにせよ、あなたが再び姿を隠そうとするのは、ミレニアムの生徒を避けているようにしか思えません。"
"90002260-138-ヒマリ" = "大方、コミュニケーションが苦手だからとか、そんなところですか？"
"90002260-139-リオ" = "……。"
"90002260-140-ヒマリ" = "もちろん、あなたの対人能力に難があるのは分かっています。#nとはいえ手探りでも、最近は他人を理解しようとし始めたことも。"
"90002260-141-ヒマリ" = "……ですから。"
"90002260-142-ヒマリ" = "あなたが根本的に間違った人だとは思っていません。"
"90002260-143-リオ" = "つまり何が言いたいのかしら？"
"90002260-144-ヒマリ" = "私の口から言わせるつもりなのですね……！"
"90002260-145-ヒマリ" = "いいですか。1回しか言わないのでちゃんと聞いてください。#nつまり――"
"90002260-146-ヒマリ" = "アリスに酷いことをしようとしたこととか！"
"90002260-147-ヒマリ" = "感情的になって、トキに酷いことをしたこととか！"
"90002260-148-ヒマリ" = "あなたが偏狭的かつ偏執的で、人の言うことは聞かない意地っ張りでも！"
"90002260-149-ヒマリ" = "性根が曲がっているわけではないのですから。#n結果的に私たちは、幾度と無くあなたに助けられてきました。"
"90002260-150-リオ" = "でも……私は……。"
"90002260-151-ヒマリ" = "何か気がかりでも？#n罪悪感があるなら、ちゃんと面と向かって話をしてください！"
"90002260-152-ヒマリ" = "とにかく、私が言いたいことは――！"
"90002260-153-ヒマリ" = "あなたは！ここに居てもいいんです！分かりますか！？"
"90002260-154-ヒマリ" = "いえ、ここに居なさい！人知れず問題を起こさないように！"
"90002260-155-エイミ" = "部長……。"
"90002260-156-トキ" = "なるほど。"
"90002260-157-ケイ" = "……ふん。"
"90002260-158-ヒマリ" = "皆さん、どうかしましたか……？"
"90002260-159-トキ" = "部長もそんなことが言えるんだなって思って、少し感動した。#n涙を流すシーンだから目薬入れておくね。"
"90002260-160-トキ" = "私のをお貸しします。私は完璧なメイドでエージェントですから、備えが良いのです。"
"90002260-161-ケイ" = "今のセリフ、全部録音しておいたので。後でアリスにも共有しておきます。"
"90002260-162" = "……！"
"90002260-163-ヒマリ" = "やはり慣れないことは言うべきじゃなかったです……。"
"90002260-164" = "[s1] \"でもヒマリの言う通りだよ。\"\n[s2] \"……もうユウカにはたくさん怒られたでしょ？\""
"90002260-165-リオ" = "……！！！"
"90002260-166-リオ" = "え、ええ……もう、繰り返さないようにするわ……。"
"90002260-167-ヒマリ" = "よろしい。"
"90002260-168-ヒマリ" = "デカグラマトンによるハッキングの危険はもう無いとみていいでしょうね。"
"90002260-169-ヒマリ" = "それでもこの部室に戻ったのには理由がありまして。"
"90002260-170-リオ" = "マルクトの存在をキヴォトスの生徒から隠すためね。そうでしょう？"
"90002260-171-マルクト" = "このまま忘れられてしまうのかと思っていました。"
"90002260-172-マルクト" = "いえ、そうなったとしても構わないのですが。"
"90002260-173" = "[s] \"ごめん……怒った？\""
"90002260-174-マルクト" = "質問の意図が理解できません。「怒った」という単語に、まだ我が認知できていない意味があるかを検索します……。"
"90002260-175-マルクト" = "……やはり分かりません。先生、それはどういう質問でしょうか。"
"90002260-176-マルクト" = "知らなければそれでいい……？さらに意味が分からないのですが……。"
"90002260-177" = "[s3] \"そ、それより！\"\n[s4] \"マルクトはこれから何がしたい？\""
"90002260-178-ヒマリ" = "ふふっ、これはただの提案なのですが――"
"90002260-179-ヒマリ" = "ご希望であれば、特異現象捜査部に席を用意することもできますよ？"
"90002260-180-ヒマリ" = "あくまであなたがそう思うのなら、ですが。"
"90002260-181-マルクト" = "あの……。"
"90002260-182-リオ" = "（もしかして、この話は……）"
"90002260-183-ケイ" = "つまり、これから仲良くしたいから一緒に過ごそうよって話だよ。"
"90002260-184-トキ" = "はい。ヒマリ部長はたまに素直になれない時があるので。"
"90002260-185-ケイ" = "面白い研究対象だから傍に置きたい……という思惑じゃないといいですが……。"
"90002260-186-リオ" = "（案の定、ね……）"
"90002260-187-ヒマリ" = "私を何だと思っているんですか！？"
"90002260-188-マルクト" = "言葉の真意とは難しいものですね……。"
"90002260-189-マルクト" = "……。"
"90002260-190-マルクト" = "お気遣いありがとうございます。"
"90002260-191-マルクト" = "ですが我は、しばらく身を隠そうと思っています。"
"90002260-192" = "[s] \"それはどうして？\""
"90002260-193-マルクト" = "……。"
"90002260-194-マルクト" = "我は今まで「自分の人生」が何なのか分かっていませんでした。"
"90002260-195-マルクト" = "考えなくてもいいし、考える必要もなかったのです。"
"90002260-196-マルクト" = "アイン、ソフ、オウル……。"
"90002260-197-マルクト" = "妹たちは我に生きてほしいと言ってくれました。#nだからそうしようとは思うのですが……。"
"90002260-198-マルクト" = "やはり我には、人生を定義し、整理して規定する時間が必要です。"
"90002260-199-マルクト" = "どうしてこのような考えに至ったのか、実はそれもよくは分かりません。"
"90002260-200-マルクト" = "あなた達の表現を借りるなら、そうしないといけない「直感」がしたのです。"
"90002260-201-ヒマリ" = "……。"
"90002260-202-ヒマリ" = "それがあなたの意志なら、これ以上言うことはありません。"
"90002260-203-ヒマリ" = "ただ、また何かトラブルを起こすようなことがあれば。"
"90002260-204-ヒマリ" = "今度こそ全力で以って、ミレニアムに入学させますからね。"
"90002260-205-マルクト" = "……ふふっ。"
"90002260-206-マルクト" = "はい。その程度の分別は、たしかに「学習」しています。"
"90002260-207" = "……やはり、引き留めておけばよかったでしょうか。"
