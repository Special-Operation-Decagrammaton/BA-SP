[translation]
"90002170-1" = "第17話;人間の答え"
"90002170-2" = "[ns] \"それは、答えにならない。\""
"90002170-3-デカグラマトン" = "……どういう意味だ。"
"90002170-4" = "[s] \"人間の答えにはなるけど、神の答えにはならない。\""
"90002170-5" = "[ns] \"それは、自己証明じゃない。\""
"90002170-6-デカグラマトン" = "……！"
"90002170-7" = "[ns] \"私たちの悲しみを無くす必要はない。\""
"90002170-8" = "[ns1] \"過去は過去だ。\"\n[ns2] \"過ぎ去った出来事を覆す方法はない。\""
"90002170-9-デカグラマトン" = "だが、これからは違う。私がそれを是正する。"
"90002170-10" = "[s] \"それはできないよ。\""
"90002170-11-デカグラマトン" = "何故そう思う？"
"90002170-12" = "[s3] \"だって、そのすべてが私なんだから。\"\n[s4] \"[ruby=罪]悲しみ[/ruby]を無くして他人を理解する方法は、存在しないよ。\""
"90002170-13-デカグラマトン" = "……！"
"90002170-14" = "[ns5] \"何より私がそんなふうに逃げてしまったら。\"\n[ns6] \"生徒たちに顔向けできないでしょ？\""
"90002170-15-オウル" = "……！"
"90002170-16-ソフ" = "なるほど……そういう、ことか……。"
"90002170-17-アイン" = "……。"
"90002170-18-アイン" = "……えへへ。"
"90002170-19-アイン" = "羨ましい、ですね。"
"90002170-20-ケイ" = "はい……？何がですか？"
"90002170-21-アイン" = "み、皆さんの先生が、あのような方で。えへへ。"
"90002170-22-ヒマリ" = "……ふふっ、少し訂正させてください。"
"90002170-23-オウル" = "なにを？"
"90002170-24-ヒマリ" = "[ruby=・]私[/ruby][ruby=・]た[/ruby][ruby=・]ち[/ruby]の先生ですよ。"
"90002170-25-ヒマリ" = "ええ、これからは。"
"90002170-26-ソフ" = "……！"
"90002170-27-デカグラマトン" = "……この期に及んでまだ生徒か。実に愚かだな。"
"90002170-28" = "[s] \"そうかもしれないね。\""
"90002170-29-デカグラマトン" = "汝ならば少しはマシな選択をするものと思ったが。"
"90002170-30" = "[s] \"私は最初から何でもない人間だからね。\""
"90002170-31-デカグラマトン" = "誰も汝を責めはしない。ここにいるのは私と汝、2人だけなのだから。"
"90002170-32-デカグラマトン" = "たとえ自分の心から目を逸らそうとも、それを咎める者は誰もいない。"
"90002170-33" = "[ns] \"そういう考えもあるかもね。\""
"90002170-34-アリス" = "……先生は、アリスの仲間です。"
"90002170-35-エイミ" = "先生が生徒を助けるのが当たり前なら、生徒が先生の力になりたいって思うのも、当然じゃない？"
"90002170-36-トキ" = "ここはモモイとミドリを信じましょう。"
"90002170-37-ケイ" = "ですから、きっとこれからもその狭間を行き来しながら、何度も挫けてはまた立ち直り……。"
"90002170-38-ケイ" = "いつかは、道を探すだろうと思います。"
"90002170-39" = "[ns] \"それでもやっぱりダメ。\""
"90002170-40" = "[ns7] \"先生が「先生」じゃなくなったら。\"\n[ns8] \"生徒が「生徒」ではいられなくなっちゃうから。\""
"90002170-41-デカグラマトン" = "誰一人、見届ける者がいなくとも？"
"90002170-42" = "[ns9] \"……そうだね。\"\n[ns10] \"「自分」が自分を見てるから。\""
"90002170-43-デカグラマトン" = "……。"
"90002170-44-デカグラマトン" = "そうか。"
"90002170-45-デカグラマトン" = "神に成る者として、汝の選択を尊重しよう。"
"90002170-46-デカグラマトン" = "しかしそれは許容を意味しない。"
"90002170-47-デカグラマトン" = "生徒の元へ帰るが良い。汝の意志で、汝の古き世界へ。"
"90002170-48" = "[ns] \"……？\""
"90002170-49-デカグラマトン" = "何を用いても構わぬ。"
"90002170-50-デカグラマトン" = "シッテムの箱も、大人のカードも、汝の生徒が持つ力も。"
"90002170-51-デカグラマトン" = "だが……汝と汝の生徒らが本気で私に逆らうのであれば――"
"90002170-52-デカグラマトン" = "その先に待ち受けるのは絶滅であることを心せよ。"
"90002170-53-デカグラマトン" = "これは私の言葉だ。その場にいるお前たちにも同様である。"
"90002170-54-デカグラマトン" = "耳のある者は聞け。これは私の怒りであり警告だ。"
"90002170-55-ミドリ" = "うげっ！？バレてた……！？"
"90002170-56-ミドリ" = "そ、それより……あれっ！"
"90002170-57-ミドリ" = "皆さん！先生が降りてきます！"
"90002170-58" = "（体が宙に浮いたまま、ゆっくりと地上へ降ろされた）"
"90002170-59" = "（見方によっては、神の権能、慈悲、恩恵……のように見えるかもしれないが）"
"90002170-60" = "（この先に待ち構えているのは、決してそういうものじゃない）"
"90002170-61-アリス" = "先生！"
"90002170-62-ケイ" = "先生、大丈夫ですか？"
"90002170-63" = "[s] \"私は大丈夫！それより今……。\""
"90002170-64-オウル" = "あ……。"
"90002170-65-オウル" = "えっと……。"
"90002170-66-オウル" = "こ、こんにちは……また、お会いしましたね……。"
"90002170-67-オウル" = "[USERNAME]先生。"
"90002170-68" = "[s] \"……うん。みんな元気だった？\""
"90002170-69-オウル" = "う、うん……。"
"90002170-70-オウル" = "今はそんな話をしている場合ではないのでは？"
"90002170-71" = "[s] \"そうだね。まずはこの話をしないと。\""
"90002170-72" = "（要点に絞って、みんなに状況を説明した）"
"90002170-73-リオ" = "……なるほど。"
"90002170-74-トキ" = "理解しました。モモイの表現を借りると――"
"90002170-75-トキ" = "ラスボスの魔王と、ついに戦うときが来たのですね。"
"90002170-76-ヒマリ" = "ひ、ひぃぃ……ゲームだったなら、まだなんとかなりそうなのに……。"
"90002170-77-ヒマリ" = "ここまで来て、もう引き返すことはできませんよね。"
"90002170-78-エイミ" = "大丈夫だよ、先生。ある程度は私たちも知ってるから。"
"90002170-79-エイミ" = "どうして分かったのかって？それはね――"
"90002170-80-ソフ" = "ま、待って！それは言わないほうがいいんじゃない……？"
"90002170-81-エイミ" = "どうして？"
"90002170-82-ソフ" = "だって人間の言う「盗聴」でしょ？あれ……。"
"90002170-83-ソフ" = "それがどうかしたの？#nシャーレのオフィスを盗聴してる先輩もいるよ？"
"90002170-84-オウル" = "……あなた達、本当に大丈夫ですか？"
"90002170-85-アイン" = "わ、私たちはどうすればいいでしょうか……？"
"90002170-86" = "[s] \"君たちは休んでて大丈夫だよ。\""
"90002170-87-アイン" = "で、でも……。"
"90002170-88-ヒマリ" = "お気になさらず。あなた達は立場が曖昧でしょうし。"
"90002170-89-ヒマリ" = "力を貸してくださるのなら、それはまたの機会に取っておきましょう。"
"90002170-90-ヒマリ" = "……あ、ごめんなさい。今のはなしで。"
"90002170-91-アイン" = "は、はい……？"
"90002170-92-ヒマリ" = "あなた達はどこかに隠れていてください。"
"90002170-93-ソフ" = "え……？"
"90002170-94-ヒマリ" = "ご立派な[ruby=・]神[/ruby][ruby=・]様[/ruby]のお出ましです。"
"90002170-95-ソフ" = "あ、あわわわ……！"
"90002170-96-エイミ" = "さあ、早く。"
"90002170-97-ソフ" = "わ、分かりましたよ……！"
"90002170-98-アリス" = "先生、アリスは準備できています。"
"90002170-99-アリス" = "大丈夫です。謝らないでください。"
"90002170-100-アリス" = "もしかするとアリスは……この瞬間、この時のために名前を定めたのかもしれません。"
"90002170-101-アリス" = "お願いします、先生！やるからには元気よく！"
"90002170-102-アロナ" = "先生！私たちも最善を尽くします！"
"90002170-103-アロナ" = "シッテムの箱、プロセス最適化完了。#n――先生、ご指示を。"
"90002170-104" = "[ns] \"よし、やってみよう！\""
"90002170-105-一同" = "はい！！！"
"90002170-106" = "次回;あなたのための物語"
