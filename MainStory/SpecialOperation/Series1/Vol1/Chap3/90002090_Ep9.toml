[translation]
"90002090-1" = "第9話;Dress Up"
"90002090-2-ミドリ" = "お待たせしました、先生！"
"90002090-3" = "[s] \"ミドリ……？\""
"90002090-4-ミドリ" = "へ、変じゃないでしょうか……？"
"90002090-5" = "[s] \"すごくかわいい……！\""
"90002090-6-ミドリ" = "えへへ。ありがとうございます。よかったです……。"
"90002090-7-ケイ" = "アリスの言葉を借りると、全員分の新しい鎧と武具を作りました。"
"90002090-8-ケイ" = "ミドリが着ている防護服もその一種です。"
"90002090-9" = "[s1] \"全員分？\"\n[s2] \"8人分も？\""
"90002090-10-ケイ" = "はい。"
"90002090-11-ケイ" = "それくらい簡単です。"
"90002090-12-ケイ" = "デザインはミドリが準備してくれました。"
"90002090-13-ケイ" = "機能面は私とトキでチェックしています。"
"90002090-14-ミドリ" = "今回のために、ケイちゃんがデザインを起こすための設備も作ってくれたんです。#nおかげで、すごく作業しやすかったです。"
"90002090-15-ミドリ" = "待ってくれ、妹よ。お姉ちゃんは言いたいことがあるのだ。"
"90002090-16-モモイ" = "私たち2人だけ、なんかデザイン違くない！？"
"90002090-17-ケイ" = "実際の動きには問題ありません。見た目はちょっと、鈍そうですが。"
"90002090-18-ミドリ" = "見た目も大事なの！"
"90002090-19-ミドリ" = "痛いのは嫌だってお姉ちゃんが言うから、安全性重視のデザインにしたんだよ？"
"90002090-20-モモイ" = "た、たしかに言ったけどさ……。"
"90002090-21-モモイ" = "でもほら、もっとこう、主人公っぽく！カッコいいデザインがよかったのに！"
"90002090-22" = "[s] \"私は十分カッコいいと思うよ？\""
"90002090-23-モモイ" = "そ、そう？まあ、先生が言うなら……。"
"90002090-24-ケイ" = "モモイとミドリのは、この中で一番防御力が高いです。"
"90002090-25-ケイ" = "何かあったとしても……#n最後まで生き延びて、みんなの後片づけくらいはできるでしょう。"
"90002090-26-ケイ" = "け、ケイちゃん！？#n作ってるときは、そんな話してなかったよね……？"
"90002090-27-ケイ" = "言ってみただけです。"
"90002090-28-ミドリ" = "それで、次は――"
"90002090-29-ケイ" = "過去の重武装から一転して、軽量化と最適化を遂げた機動型の[ruby=あすま]飛鳥馬[/ruby]トキです。#nぴょんぴょん。"
"90002090-30-ケイ" = "片時もじっとしていられないんですね……。"
"90002090-31-ケイ" = "新しい装いは、いの一番に先生に見てほしいですよね？"
"90002090-32-ケイ" = "みんながみんなそう思うわけではないんですよ……。"
"90002090-33-ケイ" = "でも私はそうです。"
"90002090-34-ケイ" = "そうですか……。"
"90002090-35" = "[s] \"あっ、そっか。アビ・エシュフをアリスに引き継いだから……。\""
"90002090-36-ケイ" = "はい。この機会にコンセプトと雰囲気を一新しました。#nこれからはスピードを武器に機動捜査隊として活躍する予定です。"
"90002090-37-ケイ" = "なにより、優れた保温性を持っていることには大変満足しています。#n既存のメイド服は体温低下の問題があったので。"
"90002090-38" = "[ns] \"……もしかして、ずっと寒かったの？\""
"90002090-39-トキ" = "はい。"
"90002090-40" = "[s] \"なのに、メイド服を着てたの？\""
"90002090-41-トキ" = "はい。"
"90002090-42-トキ" = "なぜかって？"
"90002090-43-トキ" = "……。"
"90002090-44-トキ" = "先生。人には、根性を見せるべき時があります。"
"90002090-45-トキ" = "それはなぜか？"
"90002090-46-トキ" = "……エイミには負けられないからです。"
"90002090-47" = "[s] \"トキのこと、たまに分からなくなっちゃうんだよね……。\""
"90002090-48-トキ" = "大丈夫です。私はちゃんと分かっていますので。"
"90002090-49-ケイ" = "と、トキさん……。"
"90002090-50-ケイ" = "はぁ……。"
"90002090-51-ケイ" = "防寒の話もいいですが……二丁のエネルギー銃がメイン武装です。#n充電が切れたバッテリーは、エジェクターで後方に排出されます。"
"90002090-52-ケイ" = "カラーリングは私がやりました！#nトキさんのパーソナルカラーはやっぱり白と青だと思うので！"
"90002090-53-ケイ" = "そしてこのジャケットを脱ぐと、私のナイスでパーフェクトなボディが露わになります。ご覧になりますか？"
"90002090-54-ミドリ" = "えぇっ！？"
"90002090-55" = "[s] \"今はダメ！大変なことになっちゃうから！\""
"90002090-56-ケイ" = "[ruby=・   ・]今は[/ruby]。なるほど。ではいつか、2人だけの特別な時間にお見せするとしましょう。"
"90002090-57-ミドリ" = "トキさん！？"
"90002090-58-ケイ" = "……いちいち反応していては、日が暮れてしまいますよ。"
"90002090-59-ミドリ" = "それで、次はエイミなのですが……エイミ？はい？もう暑い？"
"90002090-60-ケイ" = "少しは我慢してください……。あなたの体質はどうなっているんですか……。"
"90002090-61-エイミ" = "ふぅ……。"
"90002090-62-エイミ" = "上着は！？"
"90002090-63-エイミ" = "暑くて脱いだけど。"
"90002090-64-ケイ" = "それは見れば分かりますが……。"
"90002090-65-エイミ" = "今回、エイミは主に後方支援担当なんでしょう？#nであれば、上着を被って擬装するのが「効率的」だと思いませんか？"
"90002090-66-エイミ" = "でもあんなのずっと被ってたら、先に熱中症で倒れちゃうよ？"
"90002090-67-エイミ" = "暑さのせいで支援できなくなると、それこそ非効率的じゃない？"
"90002090-68-ミドリ" = "はい……だと思って、エイミさんの上着は腰に巻きやすいデザインにしておきました。"
"90002090-69-エイミ" = "ありがとう。おかげで助かったよ。"
"90002090-70-エイミ" = "……。"
"90002090-71-エイミ" = "そういえば、元々こういう人でしたよね……忘れていた私の落ち度です……。"
"90002090-72-エイミ" = "それはさておき、エイミもメイン武装を変更しました。#nバッテリーを使うエネルギー武器という点では、トキと共通しています。"
"90002090-73-ケイ" = "もちろん、出力やバッテリーの容量は全然違いますが。"
"90002090-74-ケイ" = "エイミ用のバイザーは、手早く支援ポイントを見極められるように追加した#n[ruby=HUD]ヘッドアップディスプレイ[/ruby]です。"
"90002090-75-ケイ" = "バイザーも武器と同じバッテリーで駆動するため、バックパックがトキのものより大型になっています。"
"90002090-76-エイミ" = "先生から見て、どうかな。"
"90002090-77-エイミ" = "え？効率的に見える？#nそっか、うーん……。"
"90002090-78-エイミ" = "……。"
"90002090-79" = "[s] \"あれ、どうしたの？\""
"90002090-80-エイミ" = "うーん、今までなら最高の褒め言葉だったのに……。"
"90002090-81-エイミ" = "自分でも不思議なんだけど……ちょっと別のが聞きたいな。"
"90002090-82-エイミ" = "例えば……。"
"90002090-83-エイミ" = "……。"
"90002090-84-エイミ" = "かわいい……とか？"
"90002090-85-ケイ" = "！？"
"90002090-86-ケイ" = "！？"
"90002090-87" = "[ns] \"よく似合ってるし、とってもかわいいよ。\""
"90002090-88-エイミ" = "うん。"
"90002090-89-エイミ" = "ありがとう、先生。"
"90002090-90-ケイ" = "ミドリ。私いま、ものすごく恐ろしい光景を目にした気がします……。"
"90002090-91-ケイ" = "そ、そんな風に言っちゃダメだよ！"
"90002090-92-ケイ" = "分かっていますが……。"
"90002090-93-ケイ" = "……。"
"90002090-94-ケイ" = "ぐああー！次！次です！#n待ちきれなくてルンルンしている人。出番ですよ。"
"90002090-95-ヒマリ" = "ふふふ。いかがですか？"
"90002090-96" = "[s] \"えっと……これは失礼かもだけど……。\""
"90002090-97-ヒマリ" = "はい？"
"90002090-98" = "[s] \"寒くない……？\""
"90002090-99-ヒマリ" = "あら、何をおっしゃるのかと思いきや。"
"90002090-100-ヒマリ" = "この超天才戦闘系万能病弱美少女ハッカーが対策を講じないわけがありません。"
"90002090-101-ヒマリ" = "防寒や防水を始めとした、環境への適応性はもちろんのこと……#nか弱さに清楚さまで兼ね備えた、現場支援型の万能スーツなんですよ。"
"90002090-102" = "[ns3] \"か弱さ……。\"\n[ns4] \"清楚さ……。\""
"90002090-103-ケイ" = "その、前から気になっていたんですけど……#n自分でそんなこと言って、恥ずかしくないんですか……？"
"90002090-104-ヒマリ" = "事実を明確に示すことは、科学的方法の基礎ですよ。"
"90002090-105-ケイ" = "事実を、明確に、示す……そう、ですね……。"
"90002090-106-ヒマリ" = "そうは言ったものの……このように純白のスーツを着ていると……。"
"90002090-107-ヒマリ" = "ぐすっ……。"
"90002090-108" = "[s] \"どうしたの？急に泣いて……。\""
"90002090-109-ヒマリ" = "どうしましょう……自分の美しさと可愛さのあまり、感激の涙が――"
"90002090-110-ヒマリ" = "ごめん、部長のことは私が責任もって何とかしておくね。"
"90002090-111-ヒマリ" = "ちょっ、エイミ！？#nまだ話は終わっていな――！？"
"90002090-112" = "[ns] \"なんだか、嵐が通り過ぎたような気分だね……。\""
"90002090-113-ケイ" = "まったくその通りです……。"
"90002090-114-ミドリ" = "（早く空気を入れ替えないと……！）"
"90002090-115-ミドリ" = "で、では！次はリオ会長の番です！"
"90002090-116" = "[ns] \"リオ……？\""
"90002090-117-リオ" = "なにかしら。"
"90002090-118" = "[s] \"いや、その……。\""
"90002090-119-リオ" = "その反応の理由は分からないけれど、こうなったわ。"
"90002090-120-リオ" = "現場対応、施設活用、状況分析……あらゆるシーンに対応できる、汎用性重視の戦闘スーツよ。"
"90002090-121-リオ" = "文字通り、合理的ね。"
"90002090-122-リオ" = "スーツの色は、ヒマリ先輩との対比を狙いました。#nなんとなく、そうするべきかなと思いまして……。"
"90002090-123-リオ" = "あのデザイン、やはり問題があると思います！"
"90002090-124-リオ" = "部長、落ち着いて。また無理やり部屋に閉じ込められたい？"
"90002090-125-リオ" = "うぅぅ……。"
"90002090-126-ミドリ" = "これはデザイナーのプライドがかかった問題……！どうしても譲れませんでした！"
"90002090-127-ミドリ" = "この選択に……悔いはありません！"
"90002090-128-ケイ" = "私からのコメントは控えておきます……。"
"90002090-129-ケイ" = "なので、淡々と説明を。#nリオのスーツは、防御力アップのほか、電子戦に対応できる仕様になっています。"
"90002090-130-ケイ" = "現場で技術支援をできるように、というリオの要望を反映しました。"
"90002090-131" = "[s] \"リオが？危ないんじゃないかな……？\""
"90002090-132-リオ" = "ヒマリが出張るよりは合理的よ。"
"90002090-133-リオ" = "何より、ここは鋼鉄大陸だもの。電子戦も想定しておくべきだと思うわ。"
"90002090-134" = "[s5] \"そっか。\"\n[s6] \"よろしくね。\""
"90002090-135-リオ" = "ええ。"
"90002090-136-リオ" = "任せてちょうだい。"
"90002090-137-リオ" = "あと、最後は……。"
"90002090-138-リオ" = "ユズ？"
"90002090-139-ケイ" = "隠れてないで……出てきてください。"
"90002090-140-ミドリ" = "ユズちゃん、大丈夫だよ。"
"90002090-141-ユズ" = "うぅぅ……。"
"90002090-142" = "[s] \"あれ？モモイとミドリとはだいぶ違うね。\""
"90002090-143-ユズ" = "そ、それが……。"
"90002090-144-ユズ" = "私が依頼したの。"
"90002090-145-ユズ" = "元々は私たちと同じデザインにしようとしてたんですけど……。"
"90002090-146" = "[s] \"それはどうして？\""
"90002090-147-リオ" = "……。"
"90002090-148-リオ" = "今は伏せておきたいのだけれど、いいかしら。"
"90002090-149-ユズ" = "万全は期しているけれど、この会話が盗聴されている可能性も、完全には否定できないから。"
"90002090-150-リオ" = "……このスーツは、ある意味で秘密兵器なのよ。"
"90002090-151" = "[s] \"切り札は味方にも秘密ってことだね？\""
"90002090-152-リオ" = "……ごめんなさい。悪いとは思っているわ。"
"90002090-153-リオ" = "みんなを信じてこそ乗り越えられる……それは、もう分かっているつもりよ。#nでも……。"
"90002090-154" = "[s] \"大丈夫。リオを信じるよ。\""
"90002090-155-リオ" = "先生……。"
"90002090-156-ケイ" = "いいんですか、それで？"
"90002090-157-ケイ" = "はい？今までリオが本当の意味で悪巧みをしたことはないからいい？"
"90002090-158-ケイ" = "まあ、それはそうですが……。"
"90002090-159-アリス" = "はい！アリスもそう思います！"
"90002090-160-ユズ" = "アリス！？"
"90002090-161-ミドリ" = "アリスちゃん！？"
"90002090-162-ユズ" = "あ、アリスちゃん……？"
"90002090-163-リオ" = "……。"
"90002090-164-リオ" = "信じて、くれるの……？"
"90002090-165-アリス" = "はい。だってリオ先輩は、アリスのアビ・エシュフとケイの銃を、最後まで頑張って調整してくれました！"
"90002090-166-アリス" = "もしリオ先輩が悪いことを考えているなら、絶対ここまでしてくれなかったと思います！"
"90002090-167-ヒマリ" = "私も手伝いましたよ！？"
"90002090-168-アリス" = "そうです！ヒマリ先輩も一緒でした！"
"90002090-169-ヒマリ" = "ふふっ……アリスの顔に免じて、今回は見逃してあげましょう。"
"90002090-170-ヒマリ" = "あ、そうそう。隠し機能もあるので、乞うご期待ですよ。"
"90002090-171" = "[ns] \"あれ？さっき、ケイの銃って言った？\""
"90002090-172-ケイ" = "はい？"
"90002090-173-ケイ" = "あ、ええ、まあ、一応……。"
"90002090-174-ケイ" = "キヴォトスで銃を持たずに歩くのは、裸で歩くよりおかしいと言われているらしいので……。"
"90002090-175-リオ" = "名は「エアレンデル：ルミナス・ノヴァ」。エネルギー武器よ。"
"90002090-176-ユズ" = "うぅぅ……やっぱりまだ分かりません。#nこの服……わたしに似合っているんでしょうか……？"
"90002090-177-ユズ" = "そ、そもそも、本当にわたしでいいんですか……？"
"90002090-178" = "[s7] \"大丈夫、よく似合ってるよ。\"\n[s8] \"私たちには……ユズの力が必要なんだ！\""
"90002090-179-ユズ" = "は、はい！？"
"90002090-180-ユズ" = "それは、えっと……。"
"90002090-181-ユズ" = "せ、先生が、おっしゃるのでしたら……。"
"90002090-182-ユズ" = "が、頑張り、ます……。"
"90002090-183" = "[s] \"よっし、じゃあ最後の点検を始めよう！\""
"90002090-184-リオ" = "ケイ、ちょっといいかしら？"
"90002090-185-ケイ" = "どうしました？"
"90002090-186-リオ" = "貴女にだけ、話しておきたいことがあるの。"
"90002090-187-ケイ" = "私にだけ？先生も含めずに、ですか？"
"90002090-188-リオ" = "それが……。"
"90002090-189-リオ" = "前々から推測していたのだけれど……。"
"90002090-190-リオ" = "貴女は……どんな情報を、鋼鉄大陸とあの3人から隠せるのかしら？"
"90002090-191-ケイ" = "……。"
"90002090-192-ケイ" = "よく気づきましたね。どうしてそれを？"
"90002090-193-リオ" = "ティファレトのところに着くまで、あの3人は貴女とアリスの存在に気づかなかったからよ。"
"90002090-194-ケイ" = "私になら、さっきの秘密――切り札とやらを共有できると判断したんですね？"
"90002090-195-ケイ" = "……いいでしょう。#nただし、ファイアウォールは長くても30秒しか持ちません。ご留意を。"
"90002090-196-リオ" = "ええ、問題ないわ。"
"90002090-197-ケイ" = "……。"
"90002090-198-ケイ" = "…………。"
"90002090-199-ケイ" = "………………。"
"90002090-200-リオ" = "ケイ……？"
"90002090-201-ケイ" = "あなた……。"
"90002090-202-ケイ" = "はい？"
"90002090-203-ケイ" = "正気ですか？"
"90002090-204-リオ" = "え、ええ……。これくらい普通だと思うのだけれど……。"
"90002090-205-ケイ" = "普通？これがですか？"
"90002090-206-リオ" = "……いえ、備えが多いに越したことはありません。"
"90002090-207-ケイ" = "とは言っても、そんな……。"
"90002090-208-リオ" = "変、かしら……？"
"90002090-209-ケイ" = "別の状況なら、そう思っていたのかもしれません。"
"90002090-210-ケイ" = "でも、今は……。"
"90002090-211-ケイ" = "……。"
"90002090-212-ケイ" = "あなたが居てくれて良かった、と思っています。"
"90002090-213-リオ" = "そ、そう……？"
"90002090-214-ケイ" = "ユズのスーツについても、これで合点がいきました。"
"90002090-215-リオ" = "そう。"
"90002090-216-リオ" = "それと、さっき話した第二段階だけれど……。"
"90002090-217-ケイ" = "できないことはないと思います。#n前例があるので……案外、容易いかもしれません。"
"90002090-218-ケイ" = "あなたの言うように、使わずに済むのが一番ですが。"
"90002090-219-リオ" = "ええ。切り札は、切り札であるうちが最も強力だものね。"
"90002090-220" = "[s] \"うん？切り札？\""
"90002090-221-リオ" = "先生！？"
"90002090-222-リオ" = "えっと、これは、その……！"
"90002090-223-ケイ" = "……。"
"90002090-224-ケイ" = "打ち上げでは、どんなメニューが切り札になるかを話していました。"
"90002090-225" = "[s] \"打ち上げ？\""
"90002090-226-ケイ" = "はい。"
"90002090-227-ケイ" = "私たちは、勝つのでしょう？"
"90002090-228" = "[s] \"なるほど、そういう話ね。\""
"90002090-229-ケイ" = "はい。"
"90002090-230-ケイ" = "ですよね、リオ？"
"90002090-231-リオ" = "……。"
"90002090-232-リオ" = "ええ、そうよ。"
"90002090-233-アリス" = "先生、ここで何をしているのですか？あ、リオ先輩に、ケイも！"
"90002090-234-アリス" = "はい？終わったあとの打ち上げについてですか？いいですね！"
"90002090-235-アリス" = "アリスは先生と一緒なら何でも嬉しいです！"
"90002090-236" = "[s9] \"うん！私もだよ！\"\n[s10] \"そのためには……みんな、無事に帰ろうね。\""
"90002090-237-ケイ" = "……はい。"
"90002090-238-ケイ" = "さて……勝つために、もう少し具体的な作戦をお話します。"
"90002090-239-リオ" = "というと？"
"90002090-240-ケイ" = "各預言者の撃退およびエリアの占領に、特定の順番はありません。#n先生の指揮に従って進んでいいと思います。"
"90002090-241-ケイ" = "ですが、「ビナー」のエリアだけは、最初に占領する必要があります。"
"90002090-242" = "[s] \"それはどうして？\""
"90002090-243-ケイ" = "ちょうど、ビナーの居場所を突き止めました。"
"90002090-244" = "[s] \"さすがケイちゃん！\""
"90002090-245-ケイ" = "誰がケイちゃんですか！！"
"90002090-246-ケイ" = "こほん……それと、別の理由もあります。"
"90002090-247-ケイ" = "先ほどもお話しましたが、鋼鉄大陸は、全体がネットワークで覆われています。"
"90002090-248-ケイ" = "ビナーのエリアには、それを守るためのファイアウォールが#n設置されているんです。"
"90002090-249-ケイ" = "私たちが先に進むためには、ファイアウォールを物理的であれ電子的であれ解除する必要があります。"
"90002090-250-ケイ" = "突破に成功すれば、残りの預言者の位置も分かりやすくなるはずです。"
"90002090-251-ケイ" = "逆にファイアウォールを放っておいたら……アリスの言葉を借りると――"
"90002090-252-ケイ" = "いくらレベルを上げても、鋼鉄大陸に命令を下すことができません。"
"90002090-253" = "[s] \"なる、ほど？\""
"90002090-254-リオ" = "つまり、作戦遂行のためには――"
"90002090-255-ケイ" = "はい。ビナーの情報コアを、いち早く確保しなければなりません。"
"90002090-256" = "[s] \"じゃあ、これで決まりだね。\""
"90002090-257-ケイ" = "最初のターゲットは、デカグラマトンの3番目の預言者。"
"90002090-258-ケイ" = "「違いを痛感する静観の理解者」を自称する――"
"90002090-259-ケイ" = "「ビナー」です。"
"90002090-260" = "次回;000, 00, 0"
