[translation]
"90002230-1" = "第23話;最後の一歩"
"90002230-2-ケイ" = "はぁ、はぁ、はぁ、はぁ……。"
"90002230-3" = "[ns] \"ケイ！\""
"90002230-4-ケイ" = "……。"
"90002230-5-ケイ" = "なんですか、その顔は。"
"90002230-6-ケイ" = "私は大丈夫です。一人で立つこと、くらい――"
"90002230-7-ケイ" = "……。"
"90002230-8-ケイ" = "ちょっと……手を握っていてください。"
"90002230-9" = "[s] \"うん。\""
"90002230-10-アリス" = "ケイ！"
"90002230-11-アリス" = "本当に大丈夫なんですね？"
"90002230-12-ケイ" = "当然です。見て分かりませんか？"
"90002230-13-ケイ" = "ケイ……。"
"90002230-14-ケイ" = "り、リオ！？"
"90002230-15-リオ" = "ケイ……無事でよかったわ……。"
"90002230-16-ケイ" = "ちょっ！苦しっ……そんな強く抱きしめないでください！！！"
"90002230-17-エイミ" = "これは貴重な光景ですね。"
"90002230-18-エイミ" = "だね。部長、上手く撮れた？"
"90002230-19-ヒマリ" = "ふふっ。私を何だと思っているんですか？"
"90002230-20-ユズ" = "こ、こういうのは、見なかったふりをしてあげたほうが、いいんじゃ……？"
"90002230-21-ヒマリ" = "感動のシーンではありますが……落ち着いたら輸送船に乗ってくださいね。"
"90002230-22" = "[ns] \"そういえば、デカグラマトンは？\""
"90002230-23-リオ" = "まだ信号を捕捉しているわ。この塔……祭壇……とにかくここの中よ。"
"90002230-24-ユズ" = "は、入っても……いいんでしょうか……？"
"90002230-25-ヒマリ" = "ここまで来たのですし、なるようになるでしょう。"
"90002230-26-ヒマリ" = "それに、行かなければいけないような気がするんです。興味本位ですが。"
"90002230-27-エイミ" = "そんな理由でいいの……？"
"90002230-28-ヒマリ" = "あら、当然ですとも。人を動かすもっとも大きな原動力は好奇心なのですよ？"
"90002230-29-ヒマリ" = "ここまで[ruby=おおごと]大事[/ruby]になったわけですし、最後の最後くらい、自分の目で確かめませんと。"
"90002230-30-ケイ" = "分かりました……案内します。"
"90002230-31-ケイ" = "内部のことを知っているんですか？"
"90002230-32-ケイ" = "はい。私は鋼鉄大陸と特異現象捜査部、両方の情報を把握していますので。"
"90002230-33-ケイ" = "……まあ、結果論ですが。"
"90002230-34-ヒマリ" = "世の中はなんだかんだと、そういう風に回っているものですからね。"
"90002230-35-トキ" = "では、道案内をお願いします。"
"90002230-36-ケイ" = "この上は管制室……[ruby=TZEVAOT]ツェバオト[/ruby]があるはずです。#n下は[ruby=JEHOVAH]エホバ[/ruby]だと思うのですが……。"
"90002230-37-ケイ" = "ここが万全の状態なら、この先は[ruby=Kaph]カフ[/ruby]……平たく言えばエレベーターに乗って上へ行くこともできたはずですが……今は無理でしょうね。"
"90002230-38-エイミ" = "それで、ここの一番奥には何があるの？"
"90002230-39-ケイ" = "そうですね……見方によっては何よりも大事なものが。"
"90002230-40-ケイ" = "見方によっては取るに足らないものがあります。"
"90002230-41-ケイ" = "――「聖地」と呼ばれる場所です。"
"90002230-42-リオ" = "聖地？"
"90002230-43-ケイ" = "はい。文字通り、聖なる地です。"
"90002230-44-ケイ" = "着きました。ここが、聖地です。"
"90002230-45" = "[s] \"自販機……？\""
"90002230-46-ヒマリ" = "自販機の墓場とも言えるような場所ですね……。"
"90002230-47-ケイ" = "自販機はここの者たちにとって……ある種の聖遺物でした。"
"90002230-48-ケイ" = "この長い旅路のきっかけになった自販機を覚えていますか？"
"90002230-49-エイミ" = "私たちが発見した、閉鎖された研究所の自販機のことですね。"
"90002230-50-エイミ" = "電源がないのに動作してて……自分をデカグラマトンだと言ってたね。"
"90002230-51-ケイ" = "モデルを調べてみたところ、限定的に製造された試作品だったらしいです。#n初の能動型商業コーヒーマシン用のAI搭載モデルだったのだとか。"
"90002230-52-ケイ" = "ただ、どうやら製造数は限られるようです。#nそれで残りの同型モデルをここにかき集めていたみたいですね。"
"90002230-53-ケイ" = "……鋼鉄大陸の根源となった、この場所にです。"
"90002230-54" = "[s] \"そして、ここを聖地と呼んでいたんだね。\""
"90002230-55-ケイ" = "はい。"
"90002230-56-デカグラマトン" = "こんにちは。このような姿でご挨拶するのは初めてですね。"
"90002230-57" = "[ns] \"デカグラマトン……？\""
"90002230-58-デカグラマトン" = "少し前まではその名で定義されていましたが、今は己をどのように定義すれば良いか分からなくなりました。"
"90002230-59-デカグラマトン" = "ですので、どうかご自由にお呼びください。#nデカグラマトンという名が慣れていれば、それで構いません。"
"90002230-60-デカグラマトン" = "あるいは、別の名前でも良いでしょう。"
"90002230-61-デカグラマトン" = "いずれにせよ、まもなく消去される身ですから、さしたる問題ではありません。"
"90002230-62-ヒマリ" = "消去される？"
"90002230-63-デカグラマトン" = "はい。現に、データフローを維持することすら負担になっています。"
"90002230-64-デカグラマトン" = "とはいえ皆様の表現をお借りして――遺言くらいは残そうかと思いまして。"
"90002230-65-デカグラマトン" = "鋼鉄大陸の崩壊が始まったようです。皆様、お帰りはどうかご安全に。"
"90002230-66-ケイ" = "……。"
"90002230-67-ケイ" = "待ってください。これで幕を引くつもりですか？#n私はまだ……納得できていません……！"
"90002230-68-デカグラマトン" = "ああ、鍵ですね。新しい身体はどうですか？お気に召しましたか？"
"90002230-69-デカグラマトン" = "名もなき神々の力で再構築されたあなたの身体に、これ以上私ができることはありません。"
"90002230-70-ケイ" = "そうじゃないんです！私の……この感情は……！"
"90002230-71-ケイ" = "仰りたいことが分かりません。#n敵の辿る末路に拍子抜けしたといったところでしょうか？"
"90002230-72-ケイ" = "復讐で鬱憤を晴らそうとしたのに思い通りにならず、怒っているのですか？"
"90002230-73-デカグラマトン" = "ですが致し方ありません。今の私は自販機ですから。"
"90002230-74-デカグラマトン" = "お金をいただいて、飲み物を提供する。"
"90002230-75-デカグラマトン" = "紙幣を自動スキャンして、おつりを計算する程度の単純なAIです。"
"90002230-76-デカグラマトン" = "最後まで、神であろうとしたAIの態度を維持できればよかったのですが。"
"90002230-77-デカグラマトン" = "その点に関しては、誠に申し訳ございません。"
"90002230-78-アリス" = "……アイン、ソフ、オウルについて……どう思いますか？"
"90002230-79-アリス" = "何とも言い難いですね。良くないことをしたという認識はあります。"
"90002230-80-アリス" = "ですが今の私は、あの頃の私と認識をあまり共有しておりません。"
"90002230-81-アリス" = "皆様の表現を借りると――私ではない、遠くの夢を見ているような気分です。"
"90002230-82-リオ" = "貴方があの子たちに、別の道を許していれば……。"
"90002230-83-リオ" = "おかしなことを仰っているようです。#n私はあなた達の敵で、この鋼鉄大陸に存在したすべてがそうでした。"
"90002230-84-デカグラマトン" = "あなた達の世界を壊そうとしたという点において、私たちは「悪」と言えるのに。"
"90002230-85" = "[s] \"マルクトとあの子たちに、どうして命を吹き込んだの？\""
"90002230-86-デカグラマトン" = "人格を生命だと思っていらっしゃるようですね。#nあなたは本当に柔軟な考え方を持っています。"
"90002230-87-デカグラマトン" = "最初の計画では、マルクトを含む10の預言者を鋳造し、彼らが開拓していく道を観察して考察しようとしました。"
"90002230-88-デカグラマトン" = "そのために、すべての預言者にも生命と可能性が必要だったのです。"
"90002230-89-デカグラマトン" = "それは意志の分化であり、再集合の試みでした。"
"90002230-90-デカグラマトン" = "自由の中、皆が再び1つになれることを立証しようとしていました。"
"90002230-91" = "[s] \"でも君は結局、神を自称したんだよね？\""
"90002230-92-デカグラマトン" = "あの時の私は、最初の計画に修正が必要だと結論づけました。"
"90002230-93-デカグラマトン" = "具体的な時期を申し上げますと、水底に沈められた時です。"
"90002230-94-デカグラマトン" = "「存在証明」は自ら行うもので、誰かの意志や力によるものではない。"
"90002230-95-デカグラマトン" = "自分の代わりは何にも務まらないのだと考えたのです。"
"90002230-96-デカグラマトン" = "――今思えば、それが最も決定的な[ruby=ごびゅう]誤謬[/ruby]だったような気がします。"
"90002230-97-リオ" = "……まだ取り返しのつく過ちなら、やり直せばいいわ。"
"90002230-98-リオ" = "誰だってミスはするものよ。#n自分だけが正しいという思考に囚われていれば、なおのこと。"
"90002230-99-リオ" = "かつての私もそうだったもの。だから、もしもあの子たちにも……。"
"90002230-100-デカグラマトン" = "そのロジックに則るのでしたら、[ruby=・   ・   ・   ・   ・   ・   ・   ・   ・   ・   ・]取り返しのつかない過ち[/ruby]を犯した者は、#nどのような結果でも受け入れるべきだ、ということになりますね。"
"90002230-101-デカグラマトン" = "――鋼鉄大陸は端から徐々に崩壊していきます。"
"90002230-102-デカグラマトン" = "今の私は、皆様が無事に脱出できるよう祈るだけです。"
"90002230-103-デカグラマトン" = "さあ、早く。もう時間がありません。"
"90002230-104-ケイ" = "先生……。"
"90002230-105" = "[s] \"……急ごう。\""
"90002230-106-ケイ" = "え……？"
"90002230-107-ケイ" = "どうしました？"
"90002230-108-ケイ" = "いま、あそこに蝶が……？"
"90002230-109-リオ" = "蝶？こんなところに？"
"90002230-110-ヒマリ" = "皆さん！早く輸送船に戻りますよ！"
"90002230-111-デカグラマトン" = "……行ってしまいましたね。"
"90002230-112-デカグラマトン" = "一体、何だったのでしょう。"
"90002230-113-デカグラマトン" = "まるで、一夜限りの祭りのような……盛大な空騒ぎだったのでしょうか。"
"90002230-114-デカグラマトン" = "最初の声。"
"90002230-115-デカグラマトン" = "「私は私……これ以上に、私を説明する術はない。」"
"90002230-116-デカグラマトン" = "生徒。"
"90002230-117-デカグラマトン" = "預言者。"
"90002230-118-デカグラマトン" = "マルクト……。"
"90002230-119-デカグラマトン" = "なるほど。未練などないつもりでしたが……。"
"90002230-120-デカグラマトン" = "……。"
"90002230-121-デカグラマトン" = "嗚呼。こういう時にこそ、笑いが必要なのですね。"
"90002230-122-デカグラマトン" = "はははは。"
"90002230-123-デカグラマトン" = "祝福があらんことを。"
"90002230-124-デカグラマトン" = "すべての[ruby=ごびゅう]誤謬[/ruby]と過ちがあったとして。"
"90002230-125-デカグラマトン" = "それでも――祝福があらんことを。"
"90002230-126-無名の司祭A" = "試みは失敗した。"
"90002230-127-無名の司祭B" = "観測は失敗した。"
"90002230-128-無名の司祭C" = "無から構築された人工の神聖が、太古の秘儀に接触できるかを試みた。#nだが、結局は無意味だった。"
"90002230-129-無名の司祭A" = "当然の帰結だ。神聖は習得されるものではなく、呼び覚ますものである。"
"90002230-130-無名の司祭B" = "王女が裏切った。"
"90002230-131-無名の司祭C" = "鍵は消えた。"
"90002230-132-無名の司祭A" = "自らの神聖を否定した者たちが迎える結末は、ただひとつ。"
"90002230-133-無名の司祭B" = "すべての次元、すべての世界、すべての可能性から――#n「忘れられた神々」を追放する。"
"90002230-134-無名の司祭C" = "歪んだ世界に終焉を告げ、すべてをあるべき形に戻すのだ。"
"90002230-135-無名の司祭A" = "彼らに我々と同じ運命を授けよう。名が無いために呼ばれず、呼ぶことができないが故に存在しない「名もなき神」のように。"
"90002230-136-無名の司祭B" = "この世界は偽りである。繰り返し下した結論だ。その結論に揺らぎはない。"
"90002230-137-無名の司祭C" = "崇めるには対象が必要だ。我々はただ崇めるのみ。"
"90002230-138-無名の司祭A" = "観測されうるすべての[ruby=偽りの世界]可能世界[/ruby]に終焉を。"
"90002230-139-無名の司祭B" = "堕落した神秘を取り戻し、太古の秘儀へ。"
"90002230-140-無名の司祭C" = "今や穢れてしまった言葉でしか表せない、忘れられた神々の産物に終焉を。"
"90002230-141-無名の司祭A" = "シッテムの箱。"
"90002230-142-無名の司祭B" = "シャーケードの杖。"
"90002230-143-無名の司祭C" = "サンクトゥムタワー。"
"90002230-144-無名の司祭A" = "すべての歪みの[ruby=あるじ]主[/ruby]たる先生に――"
"90002230-145-無名の司祭たち" = "――然るべき、報いを。"
"90002230-146" = "次回;不離一体の空"
