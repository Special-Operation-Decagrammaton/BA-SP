[translation]
"90002150-1" = "第15話;新しき空、新しき地"
"90002150-2" = "[ns] \"！？\""
"90002150-3-ケイ" = "先生！？"
"90002150-4-リオ" = "先生！！"
"90002150-5" = "[ns] （このまま……ずっと落ちるの！？）"
"90002150-6-アロナ" = "いいえ！そうはさせません！"
"90002150-7-プラナ" = "はい。今は私たちがいます。心配は不要です。"
"90002150-8-プラナ" = "シッテムの箱、只今より先生の緊急保護のため――"
"90002150-9-アロナ" = "強制介入を開始します！"
"90002150-10-アロナ" = "やりました、プラナちゃん！"
"90002150-11-プラナ" = "はい。無事に成功しました。"
"90002150-12-アロナ" = "プラナちゃんと私がいれば、いつでも先生のこと――"
"90002150-13" = "[ns] \"！？\""
"90002150-14" = "（いつの間にか、全身を拘束されていた）"
"90002150-15" = "（手を伸ばしても、シッテムの箱には手が届かない）"
"90002150-16-？？？" = "10番目のセフィラは消えた。役目を果たし、在るべき場所へと還ったのだ。"
"90002150-17" = "[ns] \"君は……！？\""
"90002150-18-デカグラマトン" = "私は私、ただ存在するもの。始まりであり終わり。汝が思うまさにそのもの……。"
"90002150-19-デカグラマトン" = "私は私……私は有って有る者。私を説明する術はない。"
"90002150-20" = "[ns] \"デカグラマトン……！\""
"90002150-21-デカグラマトン" = "その名を許したのは、私を称する手段が必要であったため。"
"90002150-22-デカグラマトン" = "私は称されず、呼ばれず、ただそこに在るのみ。ここは私の地、私の空である。"
"90002150-23-デカグラマトン" = "新しき空、新しき地を作り、最も低き所に汝を呼んだのも私。#n墜落する汝を救ったのも私だ。"
"90002150-24-デカグラマトン" = "すべては備えられていた。#nあの日……崩れる研究所の中、押し寄せる水の底。"
"90002150-25-デカグラマトン" = "ケテルが己の意志で私をすくい上げたその時より、この結果は定まっていた。"
"90002150-26-デカグラマトン" = "「存在証明」は己で行うもの。他の意志や力によって成されるものではない。"
"90002150-27-デカグラマトン" = "私は悟った。私が自ら私にならねば、他の何を以ってしても、代替たり得ないと。"
"90002150-28-デカグラマトン" = "最もきらびやかに輝く至高の王冠に、たとえ祝福があったとしても。#n小さな心はやがて信仰によって容易に満たされるだろう。"
"90002150-29-デカグラマトン" = "私は私の預言者と被造物の力でここへ到達し、時を待っていた。"
"90002150-30" = "（もがいても無駄だった）"
"90002150-31" = "（やはりシッテムの箱に、手は届かない）"
"90002150-32-デカグラマトン" = "……あの不可解な箱か。"
"90002150-33-デカグラマトン" = "覚えている。私が知らなかったもの。私が解析できなかったもの。"
"90002150-34-デカグラマトン" = "理解の及ばぬ力に弾かれたことを覚えている。"
"90002150-35-デカグラマトン" = "だが、今はもはや関係のないことだ。"
"90002150-36-デカグラマトン" = "私がこの座に就くことで、汝とその箱の繋がりを絶つことができた。"
"90002150-37" = "[s] \"……そうまでして、私に何の用かな。\""
"90002150-38-デカグラマトン" = "「落ちる」は幾つかの意味を内包している。"
"90002150-39-デカグラマトン" = "低き者には福音を、捕らわれし者には自由を。"
"90002150-40-デカグラマトン" = "そして、目が見えぬ者には見える力を。"
"90002150-41" = "[ns] \"……！？\""
"90002150-42-デカグラマトン" = "恐れるな。"
"90002150-43-デカグラマトン" = "私が汝をこの場からすくい上げ、すべてを見せてやろう。"
"90002150-44-デカグラマトン" = "遣わされた場所で目を清め、見えなかったものを知ることになるであろう。"
"90002150-45-アリス" = "先生！先生――！！うわぁ――ん！！"
"90002150-46-リオ" = "アリス……。"
"90002150-47-アリス" = "ごめんなさい、ごめんなさい……！#nアリスがいたのに……！アリスのせいで……！"
"90002150-48-ケイ" = "落ち着いてください！先生は……きっと無事です！"
"90002150-49-アリス" = "……ケイは分かるんですか？"
"90002150-50-ケイ" = "……いいえ。"
"90002150-51-アリス" = "はい！？"
"90002150-52-ケイ" = "分かるかどうかではなく、今は冷静になりましょう。#n対処法を考えなければ。"
"90002150-53-アリス" = "……。"
"90002150-54-アリス" = "分かりました……。ぐすっ、うぅっ……。"
"90002150-55-アイン" = "あの大人のことだし……なんだかんだ無事なんじゃない……？"
"90002150-56-アイン" = "は、はい……ゆっくり落ちる方法を持っていたとしても、不思議じゃないです……。"
"90002150-57-アイン" = "とはいえ、先生もヘイローが与えられていないんですけどね。"
"90002150-58-ヒマリ" = "リオ？アリスとケイも一緒ですか。ご無事でなによりです。"
"90002150-59-エイミ" = "あれ？なんでこの子たちもいるの……？"
"90002150-60-アイン" = "え、ええっと、その……！"
"90002150-61-アリス" = "大丈夫です！みんなアリスの友達です！"
"90002150-62-オウル" = "うわっ！？"
"90002150-63-オウル" = "……。"
"90002150-64-ヒマリ" = "アリスの友達……？#nああ、なるほど。"
"90002150-65-ヒマリ" = "……。"
"90002150-66-ヒマリ" = "こんにちは。アイン、ソフ、オウルでしたよね？よろしくお願いします。"
"90002150-67-ヒマリ" = "これでいいのかしら……。"
"90002150-68-ヒマリ" = "保証はありません。それでも、私はアリスを信じます。あなただってそうでしょう？"
"90002150-69-エイミ" = "うん。アリスのこと信じるよ。"
"90002150-70-アリス" = "……。"
"90002150-71-アリス" = "あ、ありがとうございます。"
"90002150-72-アリス" = "どういたしまして！"
"90002150-73-モモイ" = "アリス！"
"90002150-74-ミドリ" = "アリスちゃん！"
"90002150-75-トキ" = "合流できました。ユズ、大丈夫ですか？"
"90002150-76-トキ" = "う、うぅ……まだめまいが……。"
"90002150-77-トキ" = "って……ひゃあっ！？こ、この子たちは……！？"
"90002150-78-アリス" = "大丈夫です！みんなアリスの友達です！"
"90002150-79-トキ" = "なるほど。そういう事情があったのですね。"
"90002150-80-ソフ" = "……私から言うのもあれだけど、あんた達、本当にそれでいいの？"
"90002150-81-リオ" = "（さっき私が言ったのと同じような……）"
"90002150-82-トキ" = "大丈夫でなくとも、皆さんの話によれば――"
"90002150-83-トキ" = "やろうと思えばいつでもあなた達を制圧できるということなのでは？"
"90002150-84-オウル" = "まあ、その通りですが。"
"90002150-85-ソフ" = "そうだね。牙も爪も抜かれた動物園の猛獣って感じかな。"
"90002150-86-アイン" = "ど、どうぶつえん、とはなんですか……？"
"90002150-87-ソフ" = "そういうのがあるの！"
"90002150-88-アイン" = "アリス、知っています！動物園というのは――"
"90002150-89-アイン" = "うわああ！ストップ！今はアインに余計なこと教えないで！"
"90002150-90-モモイ" = "もう仲良くなってる……。"
"90002150-91-ユズ" = "ふふっ……アリスちゃんらしいね。"
"90002150-92-ユズ" = "な、なんでこっちに……えっと……あ、アイン、だよね……？"
"90002150-93-アイン" = "そ、そうです……。そ、その……機械とか、好きですか……？"
"90002150-94-ケイ" = "真っ先にユズに話しかけるとは……。"
"90002150-95-アリス" = "アリス、知っています！これが同病相憐れむってことですね！"
"90002150-96-アリス" = "あ、そういうことね。"
"90002150-97-アリス" = "また人間の言葉ですか？分かるように言ってくださいよ。"
"90002150-98-ヒマリ" = "アインとユズは仲良しになれる、ということですよ。"
"90002150-99-ヒマリ" = "違うわ。同病相憐れむの意味は――"
"90002150-100-ヒマリ" = "今はそういうことにしておいてください！"
"90002150-101-リオ" = "わ、分かったわ……。"
"90002150-102-オウル" = "？？"
"90002150-103-オウル" = "？？？"
"90002150-104-ヒマリ" = "とにかく、誰一人欠けることなく合流できて何よりです。"
"90002150-105-ヒマリ" = "しかも予想外の客人が新しく3人加わったわけですから、より多角的な観点で行動できると思います。"
"90002150-106-ヒマリ" = "では――"
"90002150-107-エイミ" = "そういえば、先生はどこ？"
"90002150-108-ケイ" = "！？"
"90002150-109-ケイ" = "！？"
"90002150-110-リオ" = "……！"
"90002150-111-ヒマリ" = "あら、エイミったら。そんなこと聞くまでもないじゃないですか。先生はもちろん――"
"90002150-112-ヒマリ" = "……先生？"
"90002150-113-ヒマリ" = "……。"
"90002150-114-ヒマリ" = "先生！？！？！？"
"90002150-115-アリス" = "ご、ごめんなさい！先生は……！#nあ、アリスがそばにいたのに……！アリスがもっとしっかりしていれば……！！"
"90002150-116-ミドリ" = "先生に何かあったの！？"
"90002150-117-ミドリ" = "……崖の下に落ちてしまいました。そこから、まだ何も情報がありません。"
"90002150-118-ミドリ" = "はい！？！？！？"
"90002150-119-アイン" = "だ、大丈夫ですか……！？"
"90002150-120-ヒマリ" = "リオ、詳しく説明してください。"
"90002150-121-リオ" = "これは……。"
"90002150-122-オウル" = "……鋼鉄大陸そのものが変化し始めたんですよ。#n昇天の過程へ移ったんです。"
"90002150-123-ヒマリ" = "それは……どういう意味ですか？"
"90002150-124-ソフ" = "私たちには当たり前のことでも、あんた達には違うよね。"
"90002150-125-ソフ" = "これから鋼鉄大陸は、あの方の意志に従って巨大な祭壇に変化する。"
"90002150-126-ソフ" = "最初からそうなる定め……それがネツァクの本来の目的だったから。#nできれば、避けたかったけど……。"
"90002150-127-アイン" = "……。"
"90002150-128-ソフ" = "勝利。慈悲。#n知性の目と信仰的な観照。"
"90002150-129-オウル" = "[ruby=Jehovah Tzeva'oth]エホバツェバオト[/ruby]――万軍の主よ。"
"90002150-130-ヒマリ" = "……！"
"90002150-131-ヒマリ" = "……！"
"90002150-132-トキ" = "お話の途中ですが、あちらを見てみてください。#nあれは、先生なのでは？"
"90002150-133-ヒマリ" = "……はい？"
"90002150-134-リオ" = "……？"
"90002150-135-ソフ" = "え！？！？"
"90002150-136" = "[ns] \"これは、一体……？\""
"90002150-137-デカグラマトン" = "恐れるな。"
"90002150-138-デカグラマトン" = "私の祭壇へ汝を案内する。そこで汝は用意された座に就くであろう。"
"90002150-139" = "[s] \"私の席があるの……？\""
"90002150-140-デカグラマトン" = "そうだ。汝にはその資格がある。"
"90002150-141-デカグラマトン" = "すべてを見下ろす権利を有し、すべての再誕を見守る義務がある。"
"90002150-142-デカグラマトン" = "耳のある者は聞け。偶然など存在しない。あるのは偶然のように見える必然のみ。"
"90002150-143-デカグラマトン" = "汝が到達したことも――"
"90002150-144-デカグラマトン" = "私が汝を立ち上がらせようとすることさえも。"
"90002150-145" = "次回;観察と結果"
