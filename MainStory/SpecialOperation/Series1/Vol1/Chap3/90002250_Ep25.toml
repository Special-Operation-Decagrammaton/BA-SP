[translation]
"90002250-1" = "第25話;エピローグ（１）"
"90002250-2-ミレニアムの生徒" = "あ、先生！"
"90002250-3-ミレニアムの生徒" = "こんにちは！アリスとトキも、やっほー！"
"90002250-4" = "こんにちは！"
"90002250-5-トキ" = "こんにちは！"
"90002250-6-トキ" = "やっほー、です。"
"90002250-7-ミレニアムの生徒" = "そういえば、何かあったんですか？#nここ数日連絡つかなかったですけど……。"
"90002250-8-ミレニアムの生徒" = "一昨日のシャーレ当番、私だったんですよ？#n待ちぼうけの責任とってください！"
"90002250-9" = "[s] \"ごめんごめん。来週に埋め合わせさせてほしいな。\""
"90002250-10-ミレニアムの生徒" = "本当ですか？約束ですよ！"
"90002250-11-ミレニアムの生徒" = "あれ？いま、何か……。"
"90002250-12-アリス" = "！？！？"
"90002250-13-アリス" = "い、いえ！何も通りませんでしたよ！ですよね、トキ！？"
"90002250-14-トキ" = "は、はい。そう……です。"
"90002250-15-ミレニアムの生徒" = "……？"
"90002250-16-ミレニアムの生徒" = "そうかなぁ……？"
"90002250-17" = "[s1] \"そ、そうだよ！\"\n[s2] \"わ、私は気づかなかったなぁ！？\""
"90002250-18-ミレニアムの生徒" = "う～ん？いや、でも……。"
"90002250-19-ミレニアムの生徒" = "先生……何か隠してません？"
"90002250-20-ミレニアムの生徒" = "あ～や～し～い～"
"90002250-21-トキ" = "うわーん！トキ、どうしましょう！"
"90002250-22-トキ" = "いざとなったら、修復したアビ・エシュフで物理的に記憶消去を……！"
"90002250-23-アリス" = "そ、それはいけないと思います！！"
"90002250-24-ミレニアムの生徒" = "あ！防犯カメラの映像見ればいいじゃん！#nできるよね？"
"90002250-25-ミレニアムの生徒" = "余裕。"
"90002250-26" = "[s] \"できるの！？\""
"90002250-27-ミレニアムの生徒" = "もちろんです。私たちだってミレニアムの生徒なんですから。#n……どう？何か映ってた？"
"90002250-28-ミレニアムの生徒" = "いや……特には何も……。"
"90002250-29-ミレニアムの生徒" = "なーんだ。つまんないの。"
"90002250-30" = "[s] \"ほ、ほら。何にもなかったでしょ？\""
"90002250-31-ミレニアムの生徒" = "ですね。私たちの勘違いだったみたいです。"
"90002250-32-ミレニアムの生徒" = "じゃあ先生、私たちはこれで。アリスとトキもまたね～"
"90002250-33-アリス" = "た、助かりました……。"
"90002250-34-トキ" = "なんとかなりましたね。リオ様、ケイ。もう出てきていいですよ。"
"90002250-35-リオ" = "ふぅ……。"
"90002250-36-ケイ" = "勢いで一緒に隠れましたけど、どうして私まで……。"
"90002250-37-トキ" = "これもある種のチームプレイかと。"
"90002250-38-ケイ" = "また適当なこと言って……。"
"90002250-39-リオ" = "……。"
"90002250-40-ケイ" = "リオ？"
"90002250-41-リオ" = "ついにここまで来てしまったのね……。"
"90002250-42-アリス" = "大丈夫です、リオ先輩。#nアリスも一緒に勇気を出します！きっとうまく――"
"90002250-43-ノア" = "あら、先生。こんにちは。アリスちゃんにトキさんも。"
"90002250-44-アリス" = "う、うわーん！？"
"90002250-45" = "[ns3] \"勇気を出すって言ってなかった！？\"\n[ns4] \"急に私の後ろに隠れても……！\""
"90002250-46-ノア" = "どうかしましたか？まるで怖いものでも見たかのように。"
"90002250-47-アリス" = "あ、いえ……ごめんなさい……そういうのではなくて……その……。"
"90002250-48-ノア" = "ふふっ。#n……トキさんも、ご報告ありがとうございました。#nあれは要約版という理解でよろしいのでしょうか？"
"90002250-49-トキ" = "は、はい……詳細については後ほど……。"
"90002250-50" = "[s] （あのトキが怯えている……！）"
"90002250-51-ノア" = "2人とも、本当によく頑張りましたね。"
"90002250-52-ノア" = "ただ……もう少しお話を伺いたい方が他にいまして――"
"90002250-53-ノア" = "まずはケイちゃん。はじめまして。[ruby=うしお]生塩[/ruby]ノアです。#n直接お会いするのは初めてですね。"
"90002250-54-ケイ" = "ここでもケイちゃん呼ばわりですか……。[ruby=てんどう]天童[/ruby]ケイです。#nお会いできて嬉しいですよ。"
"90002250-55-ノア" = "ええ、本当に。これからよろしくお願いしますね。"
"90002250-56-ノア" = "それと――"
"90002250-57-リオ" = "うぅっ……！"
"90002250-58-ノア" = "……。"
"90002250-59-リオ" = "……。"
"90002250-60-ノア" = "本当に……お久しぶりです、リオ会長。"
"90002250-61-リオ" = "ま、待ってちょうだい。ちゃんと……説明できるわ。"
"90002250-62-ノア" = "この場で焦って説明しなくていいですよ。"
"90002250-63-リオ" = "そ、そう……？"
"90002250-64-ノア" = "はい。話を聞きたがっている人は、別にいますから。"
"90002250-65-リオ" = "それは、つまり……。"
"90002250-66-ノア" = "ええ。ずっと待っていました。"
"90002250-67" = "ユウカちゃんは、ずっと。"
"90002250-68-リオ" = "！？！？"
"90002250-69-ノア" = "中へどうぞ。"
"90002250-70-リオ" = "わ、分かったわ……。"
"90002250-71-ケイ" = "……先生、なんだか私まで怖くなってきました……。"
"90002250-72" = "[s] \"私も……。\""
"90002250-73-ノア" = "ところで、会長？"
"90002250-74-リオ" = "な、なにかしら……。"
"90002250-75-ノア" = "ユウカちゃんは、怒ることもあれば拗ねることもあります。"
"90002250-76-ノア" = "それでも、なんだかんだとお願いを聞いてくれる……私の優しい友達です。"
"90002250-77-ノア" = "そんなユウカちゃんが、もしも本気で怒ったら――"
"90002250-78-ノア" = "私にはどうしようもありませんので。"
"90002250-79-リオ" = "！？！？！？"
"90002250-80-リオ" = "せ、先生……！"
"90002250-81" = "[s] \"リオ。\""
"90002250-82" = "[ns] \"人には……覚悟を決めなきゃいけない時があるんだよ……！\""
"90002250-83-リオ" = "……分かったわ。"
"90002250-84-リオ" = "これが、私が背負うべきことなら……。"
"90002250-85-ユウカ" = "あら、会長。すごく大変だったみたいですね。"
"90002250-86-ユウカ" = "まずはミレニアムに戻ってきたことを歓迎するべきかしら？"
"90002250-87-ユウカ" = "私たちが知らない間に、キヴォトスを救ったらしいですし。"
"90002250-88-ユウカ" = "そこは感謝すべきよね。"
"90002250-89-ユウカ" = "ええ、認めるものはちゃんと認めるわ。でないと次の話に進めないでしょう？"
"90002250-90-リオ" = "その……話を聞いてちょうだい。全て説明するから――"
"90002250-91-ユウカ" = "会長？"
"90002250-92-ユウカ" = "その言い方だとまるで私が……。"
"90002250-93-ユウカ" = "前々から会長が隠ぺいしていた横領の件から、その他にも諸々の話まで――"
"90002250-94-ユウカ" = "必死に耐えているみたいじゃないですか。"
"90002250-95-リオ" = "う、うぅっ……！"
"90002250-96-ユウカ" = "……では。"
"90002250-97-ユウカ" = "これからたっぷりとお話したいんですけど――"
"90002250-98-ユウカ" = "いいですよね？"
"90002250-99-リオ" = "ひぃっ……！"
"90002250-100-アリス" = "う、うわーん！アリスは怖いです！"
"90002250-101-ケイ" = "これが……噂の……。"
"90002250-102-トキ" = "先生、私たちはどうすれば……！"
"90002250-103" = "[s] \"た、耐えるんだ……！\""
"90002250-104-ノア" = "ふふっ。"
"90002250-105-ノア" = "ふふふっ。"
"90002250-106-アリス" = "り、リオ先輩……？"
"90002250-107-ケイ" = "大丈夫ですか？いえ、聞くまでもないですが……。"
"90002250-108" = "[ns] \"あれ？コユキ？どうして……？\""
"90002250-109-トキ" = "……。"
"90002250-110-トキ" = "何か、怒られるようなことでもやらかしたのでしょう。"
"90002250-111" = "[s] \"そっかぁ……。\""
"90002250-112" = "[ns] \"リオは……無事……？\""
"90002250-113-リオ" = "……。"
"90002250-114-リオ" = "大丈夫、よ。"
"90002250-115-リオ" = "ええ……だい……じょう、ぶ。"
"90002250-116-リオ" = "先生が言った通り、覚悟はできていたから……。"
"90002250-117-ケイ" = "その割にはダメージを負っているように見えますが……？"
"90002250-118-リオ" = "……。"
"90002250-119-リオ" = "1つ……。"
"90002250-120-リオ" = "はっきり分かったことがあるわ。"
"90002250-121-リオ" = "真実は……時に……。"
"90002250-122-リオ" = "人の精神を刈り取るのだと……いうことを……。"
"90002250-123" = "[ns5] \"リオ！？リオ――！！\"\n[ns6] \"リオ……うぅ……リオ……しくしく……。\""
"90002250-124-ノア" = "かわいそうではありますが……。"
"90002250-125-ノア" = "自業自得なのは、紛れもない事実ですから……。"
"90002250-126-ノア" = "ある種の禊だと思って、見守るしかありませんね。"
"90002250-127-ユウカ" = "はぁ……まったくもう……。"
"90002250-128" = "[s7] \"や、やあ、ユウカ……。\"\n[s8] \"久しぶり……だね。\""
"90002250-129-ユウカ" = "……。"
"90002250-130-ユウカ" = "そうですね。アリスちゃんも、トキも。"
"90002250-131-アリス" = "……！"
"90002250-132-トキ" = "こ、こんにちは。"
"90002250-133-ユウカ" = "ネル先輩……いえ、今回はヒマリ先輩ね。#nあとでそっちにもお話しに行かないと。"
"90002250-134-トキ" = "……はい。"
"90002250-135-ユウカ" = "それと……。"
"90002250-136-ユウカ" = "あなたがケイちゃんね？"
"90002250-137" = "……。"
"90002250-138-アリス" = "ゆ、ユウカ！ケイは大丈夫です！安全です！"
"90002250-139-アリス" = "な、なにか問題があったら……あ、アリスが絶対になんとかします！"
"90002250-140" = "[s9] \"そうそう！私も責任とるから！\"\n[s10] \"だからとりあえず落ち着いて……ゆっくり話そう……？\""
"90002250-141-ユウカ" = "そんなに慌てられると逆に怪しいんですけど……。"
"90002250-142-ユウカ" = "……。"
"90002250-143-ユウカ" = "まぁ、それでしたら先生はこの後にシャーレでお話しましょう。"
"90002250-144-トキ" = "……！"
"90002250-145-ユウカ" = "それで、アリスちゃんとケイちゃんについてなんだけど。"
"90002250-146-アリス" = "うわーん……。"
"90002250-147-ユウカ" = "そう怖がらないで。私だって大体の事情は知っているわ。"
"90002250-148-ケイ" = "はい……？"
"90002250-149-アリス" = "え……？"
"90002250-150-アリス" = "そ、そうなのですか……？でも、そしたらケイは……。"
"90002250-151-ユウカ" = "あなたの場合と同じよ。"
"90002250-152-アリス" = "はい……？"
"90002250-153-ユウカ" = "ケイちゃんの編入手続きを進めないとね。"
"90002250-154-ケイ" = "……？"
"90002250-155-ユウカ" = "……！"
"90002250-156-アリス" = "ありがとうございます！"
"90002250-157-ユウカ" = "うんうん、素直にお礼を言えて偉いわね。"
"90002250-158-ユウカ" = "じゃあ先生。約束通り、ちょっとお時間いただきますよ。"
"90002250-159" = "[s] \"は、はいっ！\""
"90002250-160-ユウカ" = "そーれーで！昔からそうでしたけどリオ会長はですね！"
"90002250-161-ユウカ" = "他人のことなんて気にもしないで、終わり良ければすべて良しって感じで！"
"90002250-162-ユウカ" = "最後は補填してお金の帳尻をつける予定だった……って、コユキじゃないんですから！"
"90002250-163-ユウカ" = "もちろん悪気がないことは分かってますけど！"
"90002250-164-ユウカ" = "そもそも気の弱い人だし、そんなのできるはずないですし。"
"90002250-165" = "[s11] \"ほ、ほら！ユウカ！甘いものどうぞ！\"\n[s12] \"こ、こっちにはゼロカロリーのやつもあるよ！\""
"90002250-166-ユウカ" = "いただきます。もぐもぐ……。"
"90002250-167-ユウカ" = "ふぅ……。"
"90002250-168" = "[s13] （数時間お話して……）\n[s14] （ユウカの機嫌を直すことには成功した……）"
"90002250-169-ユウカ" = "はぁ……悩ましいんですよね……。"
"90002250-170-ユウカ" = "通常であれば、役職者の[ruby=・]不[/ruby][ruby=・]在[/ruby][ruby=・]で[/ruby][ruby=・]生[/ruby][ruby=・]じ[/ruby][ruby=・]た[/ruby]損害について、責任を取らせないといけないのですが……。"
"90002250-171-ユウカ" = "そこに問題がありまして……。"
"90002250-172-ユウカ" = "ミレニアムは別に、損害らしい損害を被っていないんです。"
"90002250-173-ユウカ" = "今回の件だって、ミレニアムに実害があったかと言えば微々たるものですし……。"
"90002250-174" = "[s15] \"となると……。\"\n[s16] \"リオを会長から解任させる、とか……？\""
"90002250-175-ユウカ" = "いいえ？リオ会長以外、適任者なんていませんよ？"
"90002250-176-ユウカ" = "意外そうな顔をされましても……。"
"90002250-177-ユウカ" = "そもそもミレニアムは能力主義の学園です。#n実力だけを見れば、リオ会長に及ぶ生徒はいません。"
"90002250-178-ユウカ" = "それに今回の件も、会長の成果にとやかく言うことはできません。"
"90002250-179-ユウカ" = "まだ概要しか把握していませんが――"
"90002250-180-ユウカ" = "世界を、キヴォトスを救ったのですから。"
"90002250-181" = "[s17] \"そう思ってくれてありがとう。\"\n[s18] \"でも別の心配があって……。\""
"90002250-182-ユウカ" = "はい？リオ会長が生活していけるか、ですか……？"
"90002250-183-ユウカ" = "それはどういう……。"
"90002250-184-ユウカ" = "はぁ……そうですね……。"
"90002250-185-ユウカ" = "何事も、やってみないと分かりませんよ。"
"90002250-186-ユウカ" = "先生というお目付け役もいることですし！"
"90002250-187" = "[s] \"そうだね。リオもたくさん学んでいたと思うし。\""
"90002250-188" = "[ns] \"大丈夫……多分……。\""
"90002250-189-ユウカ" = "ええ、まずは信じてみましょう。#n……気持ちは分かりますが。"
"90002250-190-ユウカ" = "あとは……ケイちゃんの編入手続きの件ですね。"
"90002250-191-ユウカ" = "手続きの進捗は……。"
"90002250-192-ユウカ" = "……。"
"90002250-193-ユウカ" = "ルール的に曖昧な部分がありまして。"
"90002250-194-ユウカ" = "なにせ、生徒がいきなりミレニアムに現れたようなものですから。"
"90002250-195-ユウカ" = "……あまり好きな表現ではありませんが、「魔法」のように現れた生徒です。"
"90002250-196-ユウカ" = "その場合の対応については、ミレニアムの校則に載っていないんですよ。"
"90002250-197" = "[ns] \"普通は想定しないもんね……。\""
"90002250-198-ユウカ" = "はい。なので特例ということにして、最終決定権を持つ方に決めてもらいました。"
"90002250-199-ユウカ" = "リオ会長が復帰していて助かりましたよ。"
"90002250-200-ユウカ" = "もしも会長がいなかったら……誰が決定し、どのように責任をとり、どう状況を観察していくか等々……。"
"90002250-201-ユウカ" = "最低3泊4日の会議コースでしたね。"
"90002250-202-ユウカ" = "おかげでその事態は免れました。"
"90002250-203" = "[s] \"結果は予想できるけど……リオは何て？\""
"90002250-204-ユウカ" = "……こほん。"
"90002250-205-ユウカ" = "どんな生徒であれ、学ぶ意志ある者を受け入れるのが、ミレニアムの建学理念よ。"
"90002250-206-ユウカ" = "ケイも例外なく、ミレニアムサイエンススクールの生徒として歓迎するわ。#n……と。"
"90002250-207" = "[s] \"話早くない！？\""
"90002250-208-ユウカ" = "手続き自体はアリスちゃんの時にやっていますから。"
"90002250-209-ユウカ" = "ルールとして明文化されていないなりに、前例があると楽なんですよ。"
"90002250-210-ユウカ" = "それから、ずっと他人の話ばっかりですけど……#n私がここに来ている理由は、他にもありますからね？"
"90002250-211" = "[s] \"と言うと……？\""
"90002250-212-ユウカ" = "……。"
"90002250-213-ユウカ" = "どれだけ心配したか……！分かってますか！？"
"90002250-214-ユウカ" = "あの時だって！ようやく居場所を特定できたと思ったら！凍原地帯ですよ！？"
"90002250-215-ユウカ" = "こっちの気も知らずに、何とかするってだけ答えて……事情も説明してくれませんでしたよね……。"
"90002250-216-ユウカ" = "そういう状況じゃなかったのは理解しています。#nそれに……先生のおかげで、鋼鉄大陸という危機も解決できました。"
"90002250-217-ユウカ" = "でも……。"
"90002250-218-ユウカ" = "心配、したんですよ……。"
"90002250-219" = "[s] \"……ごめん。\""
"90002250-220-ユウカ" = "もう知りません……。"
"90002250-221" = "[s] \"2度としないから。\""
"90002250-222-ユウカ" = "また似たようなことが起きれば、同じことを繰り返しますよね……？"
"90002250-223" = "[s19] \"それは……否定できないけど……。\"\n[s20] \"でも、黙っていなくならないように……努力する。\""
"90002250-224-ユウカ" = "……本当に？"
"90002250-225" = "[s] \"う、うん！\""
"90002250-226-ユウカ" = "……分かりました。"
"90002250-227-ユウカ" = "その代わり、全部話してください。鋼鉄大陸であったことを。#nそれで……許してあげます。"
"90002250-228-ユウカ" = "……はい？ああ、たしかに、もう報告は受けているのですが……「ミレニアム式」の報告書でしたから。"
"90002250-229-ユウカ" = "可能な限り修飾語を省き……事実だけを述べ……原因と結果だけを記したもの……。"
"90002250-230-ユウカ" = "言葉は資源で、資源は合理的で効率的に消費されるべきだという――"
"90002250-231-ユウカ" = "まさに、ミレニアムらしい報告書だったんですよ。"
"90002250-232" = "[s] \"分かった。……でも、長くなるよ？\""
"90002250-233-ユウカ" = "ふふっ、いくらでも。"
"90002250-234" = "[ns] \"それじゃあ……何から話そうか。\""
"90002250-235" = "（ユウカは笑ったり、感動したり、時には疑ったり……時には、涙を流していた）"
"90002250-236" = "（ユウカに、すべての出来事を話した）"
"90002250-237" = "（鋼鉄大陸、デカグラマトン、アイン、ソフ、オウル）"
"90002250-238" = "（そして、ケイのこと）"
"90002250-239-ユウカ" = "……先生。"
"90002250-240" = "[s] \"うん？\""
