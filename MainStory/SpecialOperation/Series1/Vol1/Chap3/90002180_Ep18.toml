[translation]
"90002180-1" = "第18話;あなたのための物語"
"90002180-2" = "[ns] \"みんな……？\""
"90002180-3-アリス" = "……。"
"90002180-4-リオ" = "……。"
"90002180-5-モモイ" = "……。"
"90002180-6" = "[ns] \"……！\""
"90002180-7-？？？" = "ちく、しょう……。"
"90002180-8-ケイ" = "ちくしょう、ちくしょう、ちくしょう……！"
"90002180-9-ケイ" = "はい？動けるかって？"
"90002180-10-ケイ" = "……。"
"90002180-11-ケイ" = "意地でも動いてみせますよ！あいつが……あいつを！"
"90002180-12-ケイ" = "うあああああああ！！！！"
"90002180-13-ケイ" = "どうして……！どうして……！！"
"90002180-14" = "（無力だった）"
"90002180-15" = "（圧倒的な力を前に、なす術もなかった）"
"90002180-16-アロナ" = "……せい？先生？大丈夫ですか！？私たちは#$^@$%–"
"90002180-17-プラナ" = "*&)%^&$@シッテムの箱、自己修復プロセス開始。#n先生もう少し$%&#–"
"90002180-18" = "（嫌でも理解してしまう）"
"90002180-19" = "（あれは、どうこうできる相手じゃない）"
"90002180-20" = "（それなら――）"
"90002180-21" = "[ns] \"……。\""
"90002180-22" = "[ns] 脚に力を入れて、なんとか立ち上がる。"
"90002180-23-ケイ" = "先生……？"
"90002180-24-ケイ" = "なに、してるんですか……？#n動いてはいけません！先生は今……私たちより酷い怪我なんですよ！"
"90002180-25-デカグラマトン" = "……先生よ。そちらではない。私はここにいる。"
"90002180-26-デカグラマトン" = "歩くことも、前を見ることも叶わぬ身体で、何をするつもりだ。"
"90002180-27" = "[ns] 口を開けて答える。"
"90002180-28-デカグラマトン" = "生徒たちをキヴォトスに帰してほしい、だと？"
"90002180-29-デカグラマトン" = "……。"
"90002180-30-デカグラマトン" = "汝も知っているはずだ。物事には順序がある。"
"90002180-31-デカグラマトン" = "汝は預言者になることを拒んだ。#nこれは汝と私が[ruby=・]選[/ruby][ruby=・]択[/ruby][ruby=・]し[/ruby][ruby=・]た[/ruby]結果である。"
"90002180-32-デカグラマトン" = "……。"
"90002180-33-デカグラマトン" = "「自分たちが選んだ結末なら、受け入れないと」"
"90002180-34-デカグラマトン" = "汝の言葉を、私は覚えている。"
"90002180-35-デカグラマトン" = "あの時の汝と、今の汝は別の存在であろうか？"
"90002180-36" = "[ns] 答えない。"
"90002180-37" = "[ns1] 跪く。\n[ns2] 懇願する。"
"90002180-38-ケイ" = "先生……？"
"90002180-39-デカグラマトン" = "……。"
"90002180-40-デカグラマトン" = "私は汝を預言者にしようとした。それは汝が最も予測し難い変数であったからだ。"
"90002180-41-デカグラマトン" = "しかし……今の行動で、先生の値は一意に定まった。#nもはや如何なる変数にもなりえない。"
"90002180-42-デカグラマトン" = "[ruby=生命体]お前たち[/ruby]はいつもそうだ。"
"90002180-43-デカグラマトン" = "すべてを漠然と考え、不確かな未来に身を委ねる。"
"90002180-44-デカグラマトン" = "生存のためなら自らの発言を覆し、その行為を都合よく正当化する。"
"90002180-45" = "[ns3] 額を床に強くこすりつける。\n[ns4] 再び懇願する。"
"90002180-46-デカグラマトン" = "先生……？"
"90002180-47-デカグラマトン" = "やめて、ください……そんな……！"
"90002180-48-デカグラマトン" = "己で選んだ滅亡が迫ったとき、汝は淡々と受け入れるのだと期待していた。"
"90002180-49-デカグラマトン" = "汝自身の言葉であったからだ。"
"90002180-50" = "[s] \"私は、「私の選択」を受け入れる。\""
"90002180-51" = "[ns] \"でも、子供たちは帰してあげてほしい。\""
"90002180-52-デカグラマトン" = "……！"
"90002180-53-デカグラマトン" = "……。"
"90002180-54-デカグラマトン" = "そうか。汝は汝。生徒は別である、と。"
"90002180-55-デカグラマトン" = "代償として、己の一切を私に委ねると言うのだな。"
"90002180-56-デカグラマトン" = "……。"
"90002180-57-デカグラマトン" = "私は今、汝を死に至らしめることもできる。"
"90002180-58-デカグラマトン" = "だが異なる道を選ぶとすれば、汝はどうする。"
"90002180-59-デカグラマトン" = "は……？"
"90002180-60-デカグラマトン" = "命は大切だと、汝らは言う。かけがえのないものだと。"
"90002180-61-デカグラマトン" = "果たしてそうだろうか。"
"90002180-62-デカグラマトン" = "生きる中で、死に勝る苦しみはいくらでもあるだろう。"
"90002180-63-デカグラマトン" = "それは今、この瞬間も。#nそれらは全て――汝の選択の結果だ。"
"90002180-64-デカグラマトン" = "私にその身を委ねると言うならば、苦痛を強いることも容易いだろう。"
"90002180-65-デカグラマトン" = "汝の意識だけを残し、己の手で、大切な生徒を害させることもできる。"
"90002180-66-デカグラマトン" = "汝を生かしたまま、永遠の苦しみに追いやることもできる。"
"90002180-67-デカグラマトン" = "それでも――受け入れるのか？"
"90002180-68" = "[s] \"それを、望むのであれば。\""
"90002180-69" = "[ns] \"これは私の選択の結果だ。その事実を否定するつもりはない。\""
"90002180-70-デカグラマトン" = "先生……？"
"90002180-71" = "[ns] \"だから……お願いします。\""
"90002180-72" = "[ns] \"どうか子供たちだけは、家に帰らせてあげてください。\""
"90002180-73-ケイ" = "先生っ！！！！"
"90002180-74-ケイ" = "うううっ、うああああああああああああっ！！！！"
"90002180-75-ケイ" = "私が……っ！私にもっと、力があればっ！！！！"
"90002180-76-デカグラマトン" = "嘆かわしい。"
"90002180-77-デカグラマトン" = "実に嘆かわしい。"
"90002180-78" = "（色々なことを考えた。でも、そのどれもが形を成さなかった）"
"90002180-79" = "（ただ――）"
"90002180-80" = "（子供たちに何もしてあげられなかったことに、胸が痛んだ）"
"90002180-81-落ち着いた声" = "本当にそれでいいの？"
"90002180-82" = "[ns] ……だれ？"
"90002180-83-落ち着いた声" = "え、うーん……それはあんまり重要じゃないかな。"
"90002180-84-落ち着いた声" = "何というか、理解できなくってさ。"
"90002180-85-落ち着いた声" = "どうしてそんなことができるの？"
"90002180-86" = "[ns] 答える。"
"90002180-87-落ち着いた声" = "ふーん、大事なもの、ね。"
"90002180-88-落ち着いた声" = "……。"
"90002180-89-落ち着いた声" = "そっか。"
"90002180-90-落ち着いた声" = "でも普通、自分の命が一番大事だと思わない？私が勘違いしてるだけ？"
"90002180-91" = "[ns] 答える。"
"90002180-92-落ち着いた声" = "そう。やっぱ普通はそうだよね？"
"90002180-93-落ち着いた声" = "じゃあどうして？ただ生きてるだけじゃダメなの？"
"90002180-94-落ち着いた声" = "あー、そういえばなんか言ってたね。#n人間はそうやってシステムを繋いできたんだっけ？"
"90002180-95-落ち着いた声" = "自分より可能性のある者に、そして自分より大事だと思える者たちに――"
"90002180-96-落ち着いた声" = "自分が持つすべてを託す。"
"90002180-97-落ち着いた声" = "そうやって先人の意志を、残った人たちが受け継ぐのかな……？"
"90002180-98-はっちゃけた声" = "私はそれがよく分かりませんでした。"
"90002180-99-はっちゃけた声" = "偽善とか、嘘だとか。その類だと思っていたので。"
"90002180-100-はっちゃけた声" = "ですが……。"
"90002180-101-はっちゃけた声" = "……。"
"90002180-102-はっちゃけた声" = "先生。"
"90002180-103-はっちゃけた声" = "生徒ってそんなに大切ですか？"
"90002180-104" = "[ns] 答える。"
"90002180-105-はっちゃけた声" = "なるほどなるほど……。"
"90002180-106-はっちゃけた声" = "必要なら、自分が持つすべての可能性を託す覚悟がある、と。"
"90002180-107-はっちゃけた声" = "それが大人の存在意義だと考えているのですね。"
"90002180-108-はっちゃけた声" = "ですがそれ、[ruby=つかつき]調月[/ruby]リオと同じ選択かもしれませんよ？"
"90002180-109-はっちゃけた声" = "犠牲になる者を選べるのなら、己の身を挺すると。"
"90002180-110-はっちゃけた声" = "とはいえ……リオはもう、別の方法を探し、助けを求めることを選びました。"
"90002180-111-はっちゃけた声" = "……。"
"90002180-112-はっちゃけた声" = "先生には、リオをなじる資格がなかったのかもしれませんね。"
"90002180-113" = "[ns] 答える。"
"90002180-114-はっちゃけた声" = "……。"
"90002180-115-はっちゃけた声" = "そうですか。"
"90002180-116-はっちゃけた声" = "だからあの時も、あの子を責めたくなかったのですね……。"
"90002180-117-気弱な声" = "で、でも先生が生徒たちを、なんとかキヴォトスに帰したとしても……。"
"90002180-118-気弱な声" = "運命が根本的に変わることは……ないと思います……。"
"90002180-119-気弱な声" = "鋼鉄大陸がまた拡張して、キヴォトスが鋼鉄大陸の一部になってしまったら……。"
"90002180-120-気弱な声" = "生徒の動向はすべて……あの方に把握されてしまいますから……。"
"90002180-121-気弱な声" = "どこへ逃げても、どこへ隠れても……最終的には見つかってしまいます……。"
"90002180-122-気弱な声" = "最後は……あの方に、処されてしまいます……。"
"90002180-123-気弱な声" = "もちろん、ここで見聞きした情報があれば、抗う術はあるかもしれません。"
"90002180-124-気弱な声" = "て、抵抗軍を結成する、とか……。"
"90002180-125-気弱な声" = "でも、結果は大きく変わらないと、思います……。"
"90002180-126" = "[ns] 答える。"
"90002180-127-気弱な声" = "た、たしかに、可能性は残るかもしれません。でも、それは微々たるもので……。"
"90002180-128-気弱な声" = "……え？0と0じゃないものの間には、絶対的な違いがある……？"
"90002180-129-気弱な声" = "それは……そう、ですが……でも……。"
"90002180-130-気弱な声" = "あの方の怒りから隠れて逃げ続ける人生になるかもしれないんですよ？"
"90002180-131-気弱な声" = "……それでも、あの子たちに生き残ってほしいんですね。"
"90002180-132" = "[ns] \"あの子たちだけじゃないよ。\""
"90002180-133" = "[ns] \"君たちにも、生き残ってほしい。\""
"90002180-134-落ち着いた声" = "！？"
"90002180-135-はっちゃけた声" = "！？！？"
"90002180-136-気弱な声" = "……。"
"90002180-137-気弱な声" = "せ、生徒に対してなら、そうするとは思うのですが……。"
"90002180-138-気弱な声" = "私たちに……それだけの価値があると……？"
"90002180-139" = "[ns] \"もちろん。\""
"90002180-140" = "[ns] \"大人の仕事は、子供を守ることだからね。\""
"90002180-141-気弱な声" = "！！！"
"90002180-142" = "[ns] \"ごめんね。\""
"90002180-143-気弱な声" = "急に……どうしたんですか……？"
"90002180-144" = "[s] \"良い世界を見せてあげられなくて。\""
"90002180-145-気弱な声" = "それはまぁ……先生1人のせいじゃないでしょう。"
"90002180-146" = "[s5] \"良い世界じゃなくても。\"\n[s6] \"良い人がいることを見せてあげられなくて。\""
"90002180-147" = "[ns] \"ちゃんとした可能性を見せてあげられなくて。\""
"90002180-148" = "[ns] \"良い大人になれなくて――\""
"90002180-149" = "[ns] \"本当に、ごめん。\""
"90002180-150-落ち着いた声" = "……。"
"90002180-151-落ち着いた声" = "ああ。"
"90002180-152-落ち着いた声" = "そう考えるんだね。先生は。"
"90002180-153" = "（冷たい手の感触があった）"
"90002180-154-落ち着いた声" = "分かったよ。"
"90002180-155-落ち着いた声" = "ちゃんと、分かった。"
"90002180-156-落ち着いた声" = "そんなふうに思ってくれて、本当にありがとう。"
"90002180-157-落ち着いた声" = "だから、ここからは私たちに任せて。"
"90002180-158-落ち着いた声" = "ええ、そうですね。"
"90002180-159-気弱な声" = "その、ありがとう……ございます。"
"90002180-160-気弱な声" = "少しだけでも、先生と同じ時間をすごせて……嬉しかったです。"
"90002180-161" = "[ns] \"……？\""
"90002180-162-ソフ" = "まったく、これだから先生は。"
"90002180-163" = "やはり、と言いますか。"
"90002180-164-アイン" = "えへへ……良かったですね。"
"90002180-165-ソフ" = "でもなぁ……。"
"90002180-166-ソフ" = "「幸せ」が何なのかは未だによく分かんないんだよね。"
"90002180-167-オウル" = "きっと永遠に理解できないのでしょうね。"
"90002180-168-ソフ" = "どこにあるのか、どんなものなのか。#n……私たちに掴めるのか。"
"90002180-169-アイン" = "……。"
"90002180-170-ソフ" = "でもさ、思ったんだ。"
"90002180-171-ソフ" = "誕生は呪いで、世界は苦しいことばかりかもしれないけど――"
"90002180-172-アイン" = "そ、それは……。"
"90002180-173-ソフ" = "うん。だけど、これからは許さない。"
"90002180-174-ソフ" = "誕生が悲劇なら、幸せはそれに対する闘争なんだから。"
"90002180-175-オウル" = "……先生の真似ですか？"
"90002180-176-ソフ" = "うるさいなぁ、もう。"
"90002180-177-アイン" = "で、でも、さすがはソフです！"
"90002180-178-ソフ" = "まぁ、ほら。言ってたでしょ？"
"90002180-179-ソフ" = "生きているなら、力の限り抗うべきだって。"
"90002180-180-ソフ" = "私だって、自分の人生が悲劇で終わるのは嫌だし。"
"90002180-181-オウル" = "な、なんだか……ケイが言いそうなセリフですね。"
"90002180-182-ソフ" = "……それは、そうかも。"
"90002180-183-ケイ" = "あなた達……先生から何か聞いたんですか……？"
"90002180-184-アイン" = "い、いえ！聞いたというより、その……。"
"90002180-185-アイン" = "無理やり聞き出したといいますか……。"
"90002180-186-ソフ" = "おかげで、思いついたことがあるんだ。"
"90002180-187-ケイ" = "はい？"
"90002180-188-オウル" = "前に、命と罪について話した時のことを覚えていますか？"
"90002180-189-ケイ" = "……ティファレトの時ですか？"
"90002180-190-アイン" = "わ、私は覚えています！「誰にも理解されず、ただ己の苦痛を抱き続けるしかない……。生きることが罰ならば、罪は何か」って……。"
"90002180-191-オウル" = "ええ。でも今は、少し考えが変わりました。"
"90002180-192-オウル" = "私たちにも、罪がないわけではないと。"
"90002180-193-ソフ" = "うん……だってもう動いてるし。"
"90002180-194-アイン" = "こ、この身体を動かす動力も……タダで与えられたわけではありませんから。"
"90002180-195-ケイ" = "まあ、エネルギーは有限ですが……。"
"90002180-196-アイン" = "あの、それだったら……#n生きているものは、すべて罪を犯していることになるのですか……？"
"90002180-197-ケイ" = "……そうかもしれません。"
"90002180-198-ソフ" = "うん。"
"90002180-199-ソフ" = "でも……だからこそ、もっと成長しようって頑張れるんじゃないかな。"
"90002180-200-ソフ" = "そもそも、完全なものに意味なんてなかったんだよ。#n成長できる余地がないってことだからね。"
"90002180-201-ソフ" = "立ち止まったまま、取り残されるだけ。"
"90002180-202-ケイ" = "ケイ……。"
"90002180-203-アイン" = "私たちは、何をしていたのでしょうか……。"
"90002180-204-アイン" = "何を……目指していたのでしょう……？"
"90002180-205-アイン" = "……。"
"90002180-206-ケイ" = "えへへ、ごめんなさい。答えにくい質問でしたよね？"
"90002180-207" = "[log]頑張ったね。[/log]"
"90002180-208" = "[log]本当によく頑張ったね。[/log]"
"90002180-209-オウル" = "正直に言えば、私たちはまったく考えていませんでした。"
"90002180-210-オウル" = "だって……すでに完璧だと思い込んでいましたから。"
"90002180-211-オウル" = "ですが、以前ソフが言ったように。「完全」に意味はないのかもしれませんね。"
"90002180-212" = "[log]この世界は理不尽だよね。[/log]"
"90002180-213" = "[log]生きるのが苦しくない世界があったら。[/log]"
"90002180-214" = "[log]どれほど……いいだろうね。[/log]"
"90002180-215-ソフ" = "ねえ、ケイ。生徒になるってどういうこと？"
"90002180-216-ケイ" = "それは……。"
"90002180-217-ケイ" = "何かを学び続けるということです。"
"90002180-218-ケイ" = "挑戦して、失敗して、経験して……成長していくこと、でしょうか。"
"90002180-219-ソフ" = "か、かっこいいと、思います……！"
"90002180-220-アイン" = "えへへ、そ、それができればの、話ですが……。"
"90002180-221" = "[log]先生として、生徒を諦めるわけにはいかない。[/log]"
"90002180-222" = "[log]編入書類は用意してあるから、いつでも連絡してね。[/log]"
"90002180-223-ソフ" = "さっき先生に言われたんだ。"
"90002180-224-ケイ" = "はい……？"
"90002180-225-ソフ" = "ただ生きてるだけじゃダメだって。"
"90002180-226-アイン" = "えへへ……それがどういう意味か、少しは分かった気がします。"
"90002180-227-オウル" = "それで……1つ質問があるのですが……#nもしも自分のことだけを考えていたら、できないことがあるはずです。"
"90002180-228-オウル" = "なぜなら、自分にとって自分は1人しかいないのですから。"
"90002180-229-ケイ" = "待ってください、何の話ですか？#nいえ、何を考えているんですか……？"
"90002180-230-アイン" = "でも友達のためならどう？ケイ、あんたはできる？"
"90002180-231-ソフ" = "って、聞くまでもないか。もうやったことあるんだし。"
"90002180-232-ケイ" = "聞いてます？話を一方的に進めないでください。"
"90002180-233-オウル" = "私たち、先生の言うことすら聞かないやんちゃな悪党なので～"
"90002180-234-オウル" = "あとですね、実は――"
"90002180-235-オウル" = "あの方にお返ししたいことが、たくさんあるんですよ。"
"90002180-236-ソフ" = "うん。「やり返してやろう」って気持ちこそ、強力な動機だからね。"
"90002180-237-アイン" = "えへへ……。"
"90002180-238-アリス" = "友達になってください。"
