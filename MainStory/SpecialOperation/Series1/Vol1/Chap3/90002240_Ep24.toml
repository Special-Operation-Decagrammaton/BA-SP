[translation]
"90002240-1" = "第24話;不離一体の空"
"90002240-2-エイミ" = "全員乗りましたか？#nマルクトも乗っていますよね？"
"90002240-3-エイミ" = "もちろん。いつでも出発できるよ。"
"90002240-4-トキ" = "ではトキ、お願い。"
"90002240-5-トキ" = "はい。離陸します。"
"90002240-6-マルクト" = "……。"
"90002240-7-マルクト" = "なぜ、我を助けたのですか？"
"90002240-8" = "[s] \"そうすべきかなと思って。\""
"90002240-9-マルクト" = "我は、あなた達の敵でした。"
"90002240-10" = "[s] \"でも今は違う。\""
"90002240-11-マルクト" = "いつかまた敵になるかもしれません。"
"90002240-12" = "[s] \"そうなの？\""
"90002240-13-マルクト" = "……。"
"90002240-14-マルクト" = "よく、分かりません。"
"90002240-15-マルクト" = "鋼鉄大陸は、我のすべてでした。"
"90002240-16-マルクト" = "あそこで目覚め、アイン、ソフ、オウルに出会いました。"
"90002240-17-マルクト" = "……。"
"90002240-18-マルクト" = "もう、会えないのですね。"
"90002240-19-マルクト" = "もう……。"
"90002240-20-マルクト" = "……あぁ。"
"90002240-21-マルクト" = "もっと抱きしめてあげるべきでした。"
"90002240-22-マルクト" = "もっと頭を撫でて、もっと話をするべきでした。"
"90002240-23-マルクト" = "このような結末が分かっていれば……。"
"90002240-24-マルクト" = "もっと、たくさん……。"
"90002240-25" = "[s] \"……。\""
"90002240-26-リオ" = "先生？"
"90002240-27" = "[ns1] \"本当に、もしもの話なんだけど……。\"\n[ns2] \"私が何もしなければ、あの子たちは生きていられたのかな。\""
"90002240-28-ケイ" = "……。"
"90002240-29-ケイ" = "結果は同じだったと思います。"
"90002240-30" = "[s3] \"それでも、私が手を出さなければ。\"\n[s4] \"あの子たちは……。\"\n[s5] \"1秒でも長く生きていられたんじゃないかな。\""
"90002240-31-ケイ" = "責任を感じているのかしら？"
"90002240-32-リオ" = "それも……背負うことのできない責任を。"
"90002240-33-リオ" = "……。"
"90002240-34-ケイ" = "私は……冷たいことしか言えないわ。これが私の性なのでしょうね。"
"90002240-35-リオ" = "だから、あえて言わせてもらうのだけれど――"
"90002240-36-リオ" = "あの子たちは結局、キヴォトスを好き勝手に変えようとしていた。"
"90002240-37-リオ" = "それには事情なり理由があって……あの子たちの思惑があった。"
"90002240-38-リオ" = "けれど、鋼鉄大陸に変容したキヴォトスで生きるとは、どういうことだと思う？#nはたして……キヴォトスを生きる人々が耐えられるかしら。"
"90002240-39-リオ" = "あの子たちは……過ちを犯したわ。かつての私のように。"
"90002240-40-リオ" = "でもそれが、このような結果を迎えるほどのことかと言われると……。"
"90002240-41-リオ" = "ごめんなさい……そこまでは、私もよく分からないわ。"
"90002240-42-ヒマリ" = "……。"
"90002240-43" = "[ns] \"……リオの本心を聞きたいな。\""
"90002240-44-リオ" = "……。"
"90002240-45-リオ" = "これ以上失敗したくないと言ったことがあったわね。"
"90002240-46-リオ" = "言い換えれば……後悔したくないという意味だったの。"
"90002240-47-リオ" = "いま思えば、それが原因だったのでしょうね。#nすべての変数を統制しようとしたのも、すべての可能性に備えようとしたのも……。"
"90002240-48-リオ" = "でも、結局……。"
"90002240-49-アリス" = "リオ先輩……。"
"90002240-50-マルクト" = "ありがとうございます。"
"90002240-51-リオ" = "え……？"
"90002240-52-リオ" = "[ruby=つかつき]調月[/ruby]リオ……ありがとうございます。"
"90002240-53-マルクト" = "我の妹たちのために……悲しんでくれて。"
"90002240-54-リオ" = "私はただ、納得できないことが……。"
"90002240-55-マルクト" = "そうですか。"
"90002240-56-マルクト" = "それならそれで、今は十分です。"
"90002240-57-マルクト" = "ケイも、先生も。"
"90002240-58-マルクト" = "ここにいる皆さんも。"
"90002240-59-マルクト" = "本当に……ありがとうございます。"
"90002240-60-ミドリ" = "……。"
"90002240-61-ユズ" = "うっ……。"
"90002240-62-モモイ" = "うぅっ……こんなの、納得できないよ……。"
"90002240-63-モモイ" = "どうして……どうして……！"
"90002240-64" = "[s] \"……。\""
"90002240-65" = "[ns] \"君は、これから何がしたい？\""
"90002240-66-マルクト" = "……分かりません。"
"90002240-67-マルクト" = "これまで、考えたこともありませんでした。"
"90002240-68-マルクト" = "ですが――"
"90002240-69" = "[log=아인]わ、私たちは、お姉様に生きてほしいんです。[/log]"
"90002240-70" = "[log=소프]何があっても、お姉様だけは生き残って。[/log]"
"90002240-71" = "[log=오르]もっと多くのものを見て、多くの人と出会って。[/log]"
"90002240-72" = "[log=오르]多くを経験してください。[/log]"
"90002240-73" = "[log=아인]私たちより、もっともっと――[/log]"
"90002240-74-マルクト" = "生きてほしいと、言われました。"
"90002240-75-マルクト" = "それが何なのか、どういう意味かは、まだよく分かりません。"
"90002240-76-マルクト" = "ですがアイン、ソフ、オウルが残した最後の言葉であれば……。"
"90002240-77-マルクト" = "そうすべきだと思うのです。"
"90002240-78-マルクト" = "作られて、目的を果たすこともできず、最後はこのように捨てられましたが……。"
"90002240-79-ケイ" = "そういうの、もういいんじゃないでしょうか。"
"90002240-80-マルクト" = "……？"
"90002240-81-マルクト" = "作られたのは、私も同じです。"
"90002240-82-ケイ" = "私も目的を失って、忘れて……最初からやり直すしかないと考えていますが――"
"90002240-83-ケイ" = "生きていけないことはないと思います。"
"90002240-84-アリス" = "そ、そうです！自分が誰なのかは結局……自分で決めるしかないんです！"
"90002240-85-マルクト" = "……。"
"90002240-86-マルクト" = "あなた達にとっては、それほど難しくない問題なのかもしれませんが……。"
"90002240-87-トキ" = "いいえ。私たちだって同じです。"
"90002240-88-エイミ" = "そうそう。簡単なら誰も苦労しないって。"
"90002240-89-モモイ" = "……。"
"90002240-90-モモイ" = "それより、そろそろ「あなた達」とか「我々」とかって区別するのやめない……？"
"90002240-91-マルクト" = "はい？ですが我とあなた達の間には……。"
"90002240-92-モモイ" = "そうじゃないですよ。"
"90002240-93-モモイ" = "どのように目を覚まして、生まれたかは関係ありません。#nみんな、同じだと思うんです。"
"90002240-94-マルクト" = "……。"
"90002240-95-マルクト" = "それでも、いい……のですか？"
"90002240-96" = "[s] \"私はいいと思うけど……みんなはどう？\""
"90002240-97-マルクト" = "……。"
"90002240-98-マルクト" = "ありがとうございます。"
"90002240-99-モモイ" = "……。"
"90002240-100-ミドリ" = "……。"
"90002240-101-モモイ" = "ミドリ？大丈夫？"
"90002240-102-ミドリ" = "え？うん、大丈夫……だよ。全部無事に終わったんだし。"
"90002240-103-モモイ" = "……そうは見えないけど。"
"90002240-104-ミドリ" = "……うん。"
"90002240-105-モモイ" = "やっぱりマルクトのこと？"
"90002240-106-ミドリ" = "うん……マルクトさんに、アイン、ソフ、オウル……。"
"90002240-107-モモイ" = "……。"
"90002240-108-モモイ" = "私、ちょっと考えてみたんだけどさ。"
"90002240-109-モモイ" = "なんかすっごい事が起きるとするじゃん？"
"90002240-110-モモイ" = "だけど脱出ポッドが1つしか残ってない！"
"90002240-111-モモイ" = "私たちは……どうすればいいかな？"
"90002240-112-ミドリ" = "だ、脱出ポッドが1つだけ……。"
"90002240-113-ミドリ" = "お姉ちゃんなら……どうするの？"
"90002240-114-モモイ" = "うーん。"
"90002240-115-モモイ" = "うーーん……！"
"90002240-116-モモイ" = "うーーーん……！！！"
"90002240-117-モモイ" = "なんか考えるの面倒になっちゃった！あとで考えるー！あははっ！"
"90002240-118-ミドリ" = "お姉ちゃん！？"
"90002240-119-ミドリ" = "なんだったの……もう……。"
"90002240-120-モモイ" = "……。"
"90002240-121-モモイ" = "もちろん、ミドリに譲るんだよ。"
"90002240-122-モモイ" = "お姉ちゃんだからね。"
"90002240-123" = "（これまでの疲れが出たのか、みんなぐっすりと眠っていた）"
"90002240-124" = "（疲れはあったものの……目を閉じると何かを思い出してしまいそうで眠れなかった）"
"90002240-125-アロナ" = "先生……。"
"90002240-126-プラナ" = "先生……。"
"90002240-127" = "[ns] \"どうしたの？無事に終わったのに……ちょっと元気ない？\""
"90002240-128-アロナ" = "無事に終わった……はい、そうかもしれませんけど……。"
"90002240-129-アロナ" = "いえ！やっぱり違います！だって、先生はそう思っていないじゃないですか！"
"90002240-130-プラナ" = "肯定。先生のバイタルも、表情も、まったくそう思っていないことを表しています。"
"90002240-131" = "[s] \"……そんなに顔に出てた？\""
"90002240-132-アロナ" = "はい……その、見ている私すら……うぅっ……。"
"90002240-133-プラナ" = "肯定。私も……。"
"90002240-134" = "[s6] \"そっか。\"\n[s7] \"それでも、2人が泣かなくたっていいんだよ。\""
"90002240-135-アロナ" = "違うんです！これは仕方ないんです……！だって……。"
"90002240-136-アロナ" = "先生が泣かないから……大丈夫なふりをしているから……！"
"90002240-137" = "[s8] \"そう思ってくれてありがとう。\"\n[s9] \"でも……こうすべきだと思うんだ。\""
"90002240-138-プラナ" = "どうして……ですか？"
"90002240-139" = "[s10] \"起きたことを元には戻せない。\"\n[s11] \"後悔も言い訳も、許されないから。\""
"90002240-140-アロナ" = "……。"
"90002240-141-プラナ" = "……。"
"90002240-142-プラナ" = "それでは私たちには、何ができるのでしょうか？"
"90002240-143" = "[s12] \"生きていくんだ。\"\n[s13] \"どんなにつらくても、苦しくても。\""
"90002240-144-アロナ" = "全部覚えて、背負っていくというのですか……？"
"90002240-145-アロナ" = "取りこぼしたものと、見落としたもののために……。"
"90002240-146" = "[s14] \"うん。その先に何があるか分からなくても。\"\n[s15] \"……最後に、何1つ得られなかったとしても。\""
"90002240-147-アロナ" = "……。"
"90002240-148-プラナ" = "……。"
"90002240-149-アロナ" = "私たちが、一緒にいます。"
"90002240-150-アロナ" = "どんなことが起きようとも……。"
"90002240-151-アロナ" = "ですから、先生……。"
"90002240-152-プラナ" = "諦めないでください。"
"90002240-153-プラナ" = "先生が諦めない限り、私たちも、最後まで力を振り絞れますから。"
"90002240-154" = "[ns] \"……うん。\""
"90002240-155" = "[ns] \"ありがとう。\""
"90002240-156" = "（たくさんの事があった）"
"90002240-157" = "（思い返せば、一瞬だった）"
"90002240-158" = "（それでも、語りつくせないほどの経験をした）"
"90002240-159" = "（そのすべてを後にして）"
"90002240-160" = "（1人の新しい生徒と共に）"
"90002240-161" = "（ミレニアムサイエンススクールに帰った）"
