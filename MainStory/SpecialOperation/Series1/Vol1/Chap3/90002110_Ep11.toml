"90002110-62-アイン" = "……。"
"90002110-63-アイン" = "う、ううう、ううううぅぅぅっ……！"
"90002110-64-アイン" = "あああああああああああああ――！！！"
"90002110-65-マルクト" = "アイン、ソフ、オウル。ありがとうございます。#n……ごめんなさい。"
