[translation]
"90002040-1" = "第4話;イェソド"
"90002040-2-エイミ" = "こういうのは相手しやすいんだけど。"
"90002040-3-エイミ" = "……あの腕、大きすぎるんだよね。"
"90002040-4-エイミ" = "これで1回……。"
"90002040-5-エイミ" = "うっ！？"
"90002040-6-エイミ" = "脚が……！"
"90002040-7-エイミ" = "瓦礫に、挟まって……！"
"90002040-8-エイミ" = "ふっ、んっ、ふうぅっ……！"
"90002040-9-エイミ" = "ちょっと抜けそうにないね……。"
"90002040-10-エイミ" = "……！！！"
"90002040-11-エイミ" = "（イェソドが、また腕を上げた）"
"90002040-12-エイミ" = "（包囲して退路を断って……味方ごと押し潰すつもりか）"
"90002040-13-エイミ" = "（効率的ではあるね。また作ればいいわけだし）"
"90002040-14-エイミ" = "（でも、私は……）"
"90002040-15-エイミ" = "ちょっとの怪我は覚悟してでも――！"
"90002040-16-エイミ" = "……え？"
"90002040-17-モモイ" = "大丈夫！？"
"90002040-18-ミドリ" = "お姉ちゃん！3で動かすよ……！"
"90002040-19-ミドリ" = "いち、に――"
"90002040-20-モモイ&ミドリ" = "――さんっ！！！"
"90002040-21-エイミ" = "……モモイ？ミドリ？"
"90002040-22-ミドリ" = "へっへん！助けに来たよ！先生に頼まれてね！"
"90002040-23-ミドリ" = "大丈夫ですか？"
"90002040-24-エイミ" = "うん。ありがとう、二人とも。"
"90002040-25-エイミ" = "それと……。"
"90002040-26-モモイ" = "うん？"
"90002040-27-ミドリ" = "はい？"
"90002040-28-エイミ" = "いますぐ、振り向かずに右側へ全速力で走って。"
"90002040-29-ミドリ" = "どうして――えっ！？"
"90002040-30-ミドリ" = "きゃあああっ！？"
"90002040-31-ミドリ" = "か、間一髪……。"
"90002040-32-ミドリ" = "ありがとうございます、エイミさん。"
"90002040-33-エイミ" = "ううん。こちらこそ。"
"90002040-34-エイミ" = "じゃあ、先生。"
"90002040-35-エイミ" = "しっかりやってよね。"
"90002040-36-ヒマリ" = "これで最高速度ですか！？"
"90002040-37-ケイ" = "はい。これ以上回転数を上げればエンジンが爆発してしまいます。"
"90002040-38-ヒマリ" = "オーグメンターはダメですか？"
"90002040-39-ケイ" = "もって数秒ですが……いいんですか？"
"90002040-40-ヒマリ" = "許可します！"
"90002040-41-ケイ" = "分かりました。ゲートを開きます！"
"90002040-42-トキ" = "では皆さん、イェソドの上でお会いしましょう。"
"90002040-43-アリス" = "アリス、出撃します！"
"90002040-44-ケイ" = "イェソド攻撃組、降下開始しました。"
"90002040-45-ヒマリ" = "先生に指揮権をお返しします。よろしくお願いします。"
"90002040-46" = "[s] \"エイミたちが無事なうちにケリをつけるよ！\""
