[translation]
"90002050-1" = "第5話;前進基地"
"90002050-2-トキ" = "これが最後のノートパソコンです。こちらに置きますか？"
"90002050-3-リオ" = "ええ、お願い。"
"90002050-4-ミドリ" = "ここの風景って……。"
"90002050-5-ミドリ" = "うん。デザインのインスピレーションになる……。"
"90002050-6" = "[s] \"文字通り、鋼鉄でできた大陸だね。\""
"90002050-7-リオ" = "あの子たち、案外いいネーミングセンスを持っていると思うわ。"
"90002050-8-ケイ" = "（いい……？）"
"90002050-9-ヒマリ" = "（センス……？）"
"90002050-10-ユズ" = "そ、それより……どうして外で準備しないといけないんですか……？"
"90002050-11-リオ" = "鋼鉄大陸の特殊性が原因よ。"
"90002050-12-アリス" = "特殊性、ですか？"
"90002050-13" = "分析した限り……#nこの瞬間にも、私たちの位置や情報は、リアルタイムで把握されています。"
"90002050-14-モモイ" = "えっ、ハッキングされてるってこと！？誰に！？"
"90002050-15-リオ" = "もちろん――"
"90002050-16-リオ" = "鋼鉄大陸そのものによ。"
"90002050-17-ミドリ" = "そんなことができるんですか……？"
"90002050-18-ケイ" = "ここの地面――いえ、そもそも地面かどうか怪しいですが。"
"90002050-19-ケイ" = "鋼鉄大陸の地面は、巨大な回路や機械装置、コンピューターで構成されています。"
"90002050-20-ケイ" = "そのため、私たちは一挙手一投足を監視されていると言っても#n過言ではありません。"
"90002050-21-モモイ" = "じゃあ……この床とか、あっちの壁とか、ビルみたいに見えるあれとかも……#n全部が私たちを見てるってこと？"
"90002050-22-ケイ" = "そういうことです。"
"90002050-23-アリス" = "何か、対抗する方法はないんですか……？"
"90002050-24-ケイ" = "もちろんあります。ちょうど、ヒマリとリオが対応しているところです。"
"90002050-25-リオ" = "簡潔に言えば……この場所を[ruby=・]占[/ruby][ruby=・]領[/ruby]するわ。"
"90002050-26-ヒマリ" = "この辺りの主導権を少し、あの子たちから電子的に借りるのです。"
"90002050-27-ヒマリ" = "半永久的な権限の移動、とでも言いますか。"
"90002050-28" = "[s] \"どれくらいかかりそう？\""
"90002050-29-エイミ" = "やってみないと分からない。"
"90002050-30-エイミ" = "でも、占領中はむやみに移動できないと思う。#n完了するまで、輸送船のリソースを演算装置に割り当てなきゃいけないから。"
"90002050-31-トキ" = "つまり、ここでしばらく足止めということですね。"
"90002050-32-トキ" = "足場を固めるために。"
"90002050-33-リオ" = "ええ、その通りよ。"
"90002050-34-トキ" = "分かりました。では最大限の警戒態勢で、ここをお守りします。"
"90002050-35-アリス" = "はい！アリスもついていきます！"
"90002050-36-ヒマリ" = "ありがとうございます。皆さん頼もしいですね。"
"90002050-37-エイミ" = "じゃあ、私は辺りを探索してみるね。#nデカグラマトンの兵とかレイバーみたいなのが襲ってくるかもしれないし。"
"90002050-38-リオ" = "あまり遠くまでは行かないでちょうだい。戦力が分散するわ。"
"90002050-39-エイミ" = "うん、分かった。"
"90002050-40-オウル" = "イェソドが……突破されました。"
"90002050-41-オウル" = "……一応、この場合のシナリオも想定してはいましたが、その方向に進めますか？"
"90002050-42-オウル" = "……ソフ？"
"90002050-43-マルクト" = "こんにちは、ソフ。今回は1人ですか？"
"90002050-44-ソフ" = "……。"
"90002050-45-マルクト" = "なにか、言いたいことがあるのですね？"
"90002050-46-ソフ" = "お姉様……。"
"90002050-47-マルクト" = "念のため、聞かせてください。"
"90002050-48-マルクト" = "イェソドは、どうなりましたか？"
"90002050-49-ソフ" = "……！！！"
"90002050-50-マルクト" = "大丈夫ですよ。"
"90002050-51-ソフ" = "で、でも……もう……！"
"90002050-52-マルクト" = "大丈夫です。心配しないでください。"
"90002050-53-ソフ" = "私の……ぜんぶ、私の、せいで……。"
"90002050-54-ソフ" = "お、お姉様！？#nそんな……強く抱きしめたら、息が……！"
"90002050-55-マルクト" = "しーっ。少しだけ、このままで。"
"90002050-56-ソフ" = "うっ……ううっ……！"
"90002050-57-マルクト" = "よしよし。"
"90002050-58-マルクト" = "……落ち着きましたか？"
"90002050-59-ソフ" = "うん……。"
"90002050-60-マルクト" = "では、問題解決に移りましょう。"
"90002050-61-マルクト" = "我にできることはありますか？"
"90002050-62-ソフ" = "……！"
"90002050-63-マルクト" = "驚かなくていいのですよ。"
"90002050-64-マルクト" = "ソフが何を望んでいるのか、我には分かります。#n我は、ソフの姉なのですから。"
"90002050-65-マルクト" = "そして、なぜソフが何も言ってくれないのかも分かります。#nソフは、我の妹ですから。"
"90002050-66-マルクト" = "ですから、大丈夫です。我もまた、我にできることをしますので。"
"90002050-67-ソフ" = "私たちは――お姉様を失いたくない！"
"90002050-68-ソフ" = "お姉様を失うのは……嫌だよ。"
"90002050-69-マルクト" = "ええ、分かっています。"
"90002050-70-マルクト" = "アイン、ソフ、オウル。#nあなた達が、ゾーハルの依代に我を案内したのも、それが理由でしょう？"
"90002050-71-マルクト" = "我にはもう、これ以上のメンテナンスなど要らないというのに。"
"90002050-72-ソフ" = "うぅっ……！"
"90002050-73-マルクト" = "優しいソフ。悲しまないでください。"
"90002050-74-マルクト" = "我は知っています。そして、何をすることが「次善の策」なのかも。"
"90002050-75-マルクト" = "ですから、心配しないでください。すべて上手くいきます。"
"90002050-76-マルクト" = "速やかに、終わらせてきますので。"
"90002050-77-ソフ" = "お姉様……。"
"90002050-78-？？？" = "うーん、本当にそれで足りますかね？"
"90002050-79-ソフ" = "！？"
"90002050-80-マルクト" = "……。"
"90002050-81-ソフ" = "……どうして、ここに。"
"90002050-82-オウル" = "なにを今更。私たちが行く場所なんて、限られているでしょう？"
"90002050-83-オウル" = "確率や変数を計算して、最も可能性の高い場所に来ただけですよ。"
"90002050-84-オウル" = "そんなことより……ソフ。私たちが最初に交わした約束、まだ覚えていますか？"
"90002050-85-オウル" = "なにがあっても、「その時」が訪れるより前には、お姉様を外に出さない。#n――そうでしたよね？"
"90002050-86-ソフ" = "……。"
"90002050-87-オウル" = "そして、私たちが今こうしているのは、「その時」の到来を望まないからだったはずですが。"
"90002050-88-ソフ" = "……。"
"90002050-89-オウル" = "考えてもみてください。#nこのことを他の預言者たちに知られたら、どう言い訳するつもりですか？"
"90002050-90-ソフ" = "……ごめん。ぜんぶ私のせい。"
"90002050-91-ソフ" = "でも……あの人たちを止めないと。"
"90002050-92-ソフ" = "イェソドが突破された。あんたもその意味は分かってるでしょ？"
"90002050-93-オウル" = "……ええ。アインなんて気絶したくらいですし。"
"90002050-94-ソフ" = "あんたの言う通りだよ。私たちはお姉様に頼っちゃダメ。"
"90002050-95-ソフ" = "でもここで何もしなかったら、結局、もっとお姉様に頼ることになっちゃう。"
"90002050-96-ソフ" = "もしそうなれば……私たちは、「その時」の到来を阻止できなくなる……。"
"90002050-97-オウル" = "……。"
"90002050-98-マルクト" = "オウル。ソフは――"
"90002050-99-ソフ" = "分かっていますとも。私だって、別に問い詰めるつもりはありません。#nただ――"
"90002050-100-オウル" = "ソフをからかってみたかっただけです！"
"90002050-101-ソフ" = "ちょっと！"
"90002050-102-マルクト" = "やはり、オウルは優しいのですね。"
"90002050-103-ソフ" = "ソフ、その拳は一旦下ろしておいてください！#n大事な話があってきたんですから。"
"90002050-104-ソフ" = "また変なこと言ったら本当にぶつからね……。"
"90002050-105-オウル" = "では、本題に入りましょう。お姉様の出撃には、いくつかの難点があります。"
"90002050-106-オウル" = "まず大前提ですが、お姉様の出撃を、他の預言者に悟られてはいけません。"
"90002050-107-ソフ" = "うん……。"
"90002050-108-オウル" = "ですが出撃のためには、鋼鉄大陸の全エネルギーをお姉様に集約させる必要があります。"
"90002050-109-オウル" = "この時点で矛盾する以上、両立は不可能です。"
"90002050-110-ソフ" = "そう……だね。"
"90002050-111-オウル" = "状況は理解できましたか？"
"90002050-112-ソフ" = "分かってるって……。それで？"
"90002050-113-オウル" = "即ち――ここからは私の出番というわけです！"
"90002050-114-ソフ" = "何か方法があるの？"
"90002050-115-オウル" = "ちょっとだけ、預言者たちを[ruby=・]ご[/ruby][ruby=・]ま[/ruby][ruby=・]か[/ruby][ruby=・]し[/ruby][ruby=・]て[/ruby]おきますよ。#nこういうの、得意分野ですし？"
"90002050-116-ソフ" = "それ……味方を騙すってこと！？"
"90002050-117-オウル" = "どうせ、人間のことわざか何かで、似たようなものがあるのでは？"
"90002050-118-ソフ" = "まぁ……「敵を欺くにはまず味方から」とか……。"
"90002050-119-オウル" = "やっぱりあるんですね。#nとはいえ、時間厳守です。ごまかしておくのにも、限界がありますので。"
"90002050-120-オウル" = "もしオーバーすれば、もう取り繕うことはできません。"
"90002050-121-マルクト" = "オウルもこう言っています。ソフ、よろしいですね？"
"90002050-122-ソフ" = "……ありがとう。"
"90002050-123-オウル" = "な、なんですか？急に手を差し出して……。"
"90002050-124-ソフ" = "この手を握って上下に揺らせば、握手になる。#n大事な約束とか決意を固めたとき、人間はこれをするらしいよ。"
"90002050-125-オウル" = "……またそれですか。まあ、いいでしょう。"
"90002050-126-マルクト" = "では、我もしていいですか？その「握手」というものを。"
"90002050-127-ソフ" = "えっ……う、うん……。"
"90002050-128-マルクト" = "……良いですね。#nソフもオウルも、より距離が縮まった気がします。"
"90002050-129-？？？" = "あ、あの……ネツァクちゃん……鋼鉄大陸のことは、どうするつもりですか……？"
"90002050-130-マルクト" = "わっ！？"
"90002050-131-マルクト" = "アイン！？"
"90002050-132-マルクト" = "身体はもう大丈夫ですか？"
"90002050-133-アイン" = "えへへ、はい！ちょっとめまいがしただけで……もう大丈夫です！"
"90002050-134-アイン" = "それより、さっきの話ですが……他のみんなには隠し通せても……#nネツァクちゃんには無理だと、思います。"
"90002050-135-アイン" = "ネツァクちゃんは……鋼鉄大陸そのもの、ですから……#n気づかないわけがないので……。"
"90002050-136-ソフ" = "言われてみれば……。"
"90002050-137-ソフ" = "どうにかならないの？"
"90002050-138-オウル" = "合理的に考えてくださいよ。できると思いますか？"
"90002050-139-ソフ" = "うっ、今回ばかりは言い返せない……。"
"90002050-140-アイン" = "えへへ……だ、大丈夫です！#nネツァクちゃん……今回だけは見逃すって言ってくれました！"
"90002050-141-ソフ" = "え、本当？"
"90002050-142-アイン" = "はい！でも次は難しいかもって……。"
"90002050-143-オウル" = "1回あれば十分、ですよね？"
"90002050-144-ソフ" = "……！"
"90002050-145-ソフ" = "もちろん！"
"90002050-146-マルクト" = "では、アイン、ソフ、オウル。"
"90002050-147-マルクト" = "我の初出撃を、見届けてください。"
"90002050-148-アイン&ソフ&オウル" = "はい！"
"90002050-149" = "次回;マルクト"
