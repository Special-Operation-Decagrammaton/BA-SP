[translation]
"90002045-1" = "[ns] \"よっし！\""
"90002045-2-ケイ" = "イェソドの信号、極限まで弱まっています！"
"90002045-3" = "[s] \"やったか！？\""
"90002045-4-ケイ" = "ちょっ、そのセリフは――！！"
"90002045-5-ミドリ" = "うわああっ！？"
"90002045-6-ミドリ" = "きゃあっ！？"
"90002045-7-エイミ" = "モモイ、ミドリ、あっち見て。"
"90002045-8-ミドリ" = "うあぁ……み、耳がぁ……って、あっち？"
"90002045-9-ミドリ" = "鋼鉄大陸を隔てていた壁が……？"
"90002045-10-エイミ" = "うん、消えたよ。"
"90002045-11-エイミ" = "……。"
"90002045-12-エイミ" = "ありがとう、先生。おかげで助かったよ。"
"90002045-13-ヒマリ" = "イェソド攻撃組、早く帰還してください！"
"90002045-14-ケイ" = "すでに回収を進めています。格納庫、聞こえますか？"
"90002045-15-アリス" = "パンパカパーン！アリス、無事帰還しました！大きな壁をやっつけました！"
"90002045-16-ケイ" = "はい、よくやりました。"
"90002045-17-リオ" = "ハッチの閉鎖を確認。エイミからも無事との連絡が届いているわ。これで――"
"90002045-18-リオ" = "！？"
"90002045-19-ヒマリ" = "リオ？どうかしましたか？"
"90002045-20-リオ" = "壁のほうを見てちょうだい！"
"90002045-21-リオ" = "イェソドの壁が……再生成され始めているわ！"
"90002045-22-ヒマリ" = "！！！"
"90002045-23-モモイ" = "今度はなに！？"
"90002045-24-ミドリ" = "え……？#n壁が……内側から生成され始めて……このままじゃ……！"
"90002045-25-エイミ" = "走って！"
"90002045-26-ミドリ" = "また！？"
"90002045-27-ミドリ" = "お姉ちゃん早く！壁ができたら中に入れなくなっちゃう！"
"90002045-28-モモイ" = "ぜぇ、ぜぇ……！"
"90002045-29-ミドリ" = "はぁ、はぁ……！"
"90002045-30-エイミ" = "ジャンプして！"
"90002045-31-エイミ" = "二人とも、大丈夫？"
"90002045-32-モモイ" = "いたたた……なんとか入れた？"
"90002045-33-ミドリ" = "わあぁ……。"
"90002045-34-ミドリ" = "す、すごい……。"
"90002045-35-ミドリ" = "夢の中みたい……。"
"90002045-36-エイミ" = "[ruby=いずみもと]和泉元[/ruby]エイミ、現場より報告。"
"90002045-37-エイミ" = "鋼鉄大陸の壁内に進入したよ。"
"90002045-38" = "次回;前進基地"
