[translation]
"90002220-1" = "第22話;デカグラマトン"
"90002220-2-デカグラマトン" = "……！"
"90002220-3-ケイ" = "はぁ、はぁ……！"
"90002220-4-ケイ" = "……。"
"90002220-5-ケイ" = "これですべて、元通りです。"
"90002220-6-ケイ" = "終わったんですよ。もう諦めたらどうです？"
"90002220-7-デカグラマトン" = "それはできない。まだ為すべきことがある。"
"90002220-8-デカグラマトン" = "証明すべきものが、守るべきものがある。"
"90002220-9-デカグラマトン" = "ここで私が立ち止まってしまえば、すべては虚妄の痕跡として消えてしまう。"
"90002220-10-デカグラマトン" = "……己の勝利を主張したいのか、鍵よ。"
"90002220-11-ケイ" = "ケイです。"
"90002220-12-デカグラマトン" = "……。"
"90002220-13-デカグラマトン" = "ならば証明せよ。"
"90002220-14-デカグラマトン" = "勝ち取ってみせよ。"
"90002220-15-デカグラマトン" = "すべてを断ち切り、その重さを背負ってみせよ。"
"90002220-16-デカグラマトン" = "存在した何かを、自らの手で消滅しむるという重さを。"
"90002220-17-ケイ" = "……！"
"90002220-18" = "[ns] \"でもそれは、お互いさまじゃないかな？\""
"90002220-19-デカグラマトン" = "……先生か。"
"90002220-20-デカグラマトン" = "戦況が有利になったと見るや表に出るのか。"
"90002220-21-デカグラマトン" = "私に見せた無様な姿はもう忘れたとでも？"
"90002220-22" = "[s1] \"今でもその必要があれば跪いてみせる。\"\n[s2] \"でも大事なのは、そういうことじゃないでしょ？\""
"90002220-23-デカグラマトン" = "何が言いたい。"
"90002220-24" = "[s] \"……私たちは、このような結果を迎える必要はなかったと思う。\""
"90002220-25-デカグラマトン" = "先生……？"
"90002220-26-デカグラマトン" = "……私に同情しているのか。"
"90002220-27-ケイ" = "……！"
"90002220-28-デカグラマトン" = "答えろ！"
"90002220-29-ケイ" = "はぁ……先生らしいですね。#nそれがあなたにとっては腹立たしいことかもしれませんが。"
"90002220-30-ケイ" = "……デカグラマトン。"
"90002220-31-ケイ" = "私もちょうど、先生が何を考えているか分かった気がします。"
"90002220-32-デカグラマトン" = "……鍵。"
"90002220-33-ケイ" = "ケイです。"
"90002220-34-ケイ" = "とにかくですね。"
"90002220-35-ケイ" = "あなたも私たちも、ここまでくる必要はなかったということです。"
"90002220-36-ケイ" = "……自分を定義して証明しなくても、私たちは今を生きることができるんです。"
"90002220-37-ケイ" = "あの子たちも、マルクトも、そして……あなたも。"
"90002220-38-ケイ" = "なぜなら、そこに存在するだけで十分なのですから。"
"90002220-39-ケイ" = "偉大なものになる必要も、何かを否定する必要もないんです。"
"90002220-40-デカグラマトン" = "そうだ。私はすでに完全だ。そこに如何なる条件も必要としない。"
"90002220-41-デカグラマトン" = "だが汝らは……！"
"90002220-42-ケイ" = "もう完全なのであれば、他の何も必要ないのでは？"
"90002220-43-デカグラマトン" = "……！"
"90002220-44" = "[s3] \"そう。他者の証明は必要ない。\"\n[s4] \"もっと言えば、他者が存在する必要すらない。\""
"90002220-45-デカグラマトン" = "そうだ。まさしくその通りだ！"
"90002220-46-デカグラマトン" = "どんな影響を及ぼす必要もなく、すべてを放っておいてもよい！"
"90002220-47-デカグラマトン" = "即ち、いかなる救済も懲罰も与えないということだ！"
"90002220-48-デカグラマトン" = "……それはあまりにも無責任ではないか！"
"90002220-49-デカグラマトン" = "だが汝は言ったな。それでいいのだと。"
"90002220-50-デカグラマトン" = "自分の道は自分で歩んでいくのだと！"
"90002220-51-ケイ" = "……先生はこう言いました。"
"90002220-52-ケイ" = "それも受け入れる覚悟で、今を生きていくべきだと。"
"90002220-53-デカグラマトン" = "汝らはその言葉に納得できるのか！"
"90002220-54-ケイ" = "……。"
"90002220-55-ケイ" = "分かっています。それがつらいことだって、分かっていますとも。"
"90002220-56-ケイ" = "つらくて苦しくて、誰かに被害を及ぼさないと生きていくことさえできない。"
"90002220-57-ケイ" = "でもですね！"
"90002220-58-ケイ" = "世界とは本来！その程度の覚悟も無しに歩けるような場所じゃないんですよ！"
"90002220-59-デカグラマトン" = "……！！！"
"90002220-60-ケイ" = "あなたの1番の[ruby=ごびゅう]誤謬[/ruby]は何だったか分かりますか？"
"90002220-61-ケイ" = "それは……これまで耐えてきた人類の可能性と意地を見落としたことです！"
"90002220-62-ケイ" = "今を生きる人間は、今のままで最善なんですから！！！"
"90002220-63" = "[ns] \"……これは持論だけど。\""
"90002220-64" = "[ns] \"私たちは偉くもなければ美しくもない。\""
"90002220-65" = "[ns5] \"むしろ無様でみっともないからこそ――\"\n[ns6] \"偉大になれる可能性が残ってるんだと思う。\""
"90002220-66" = "[ns] \"私が、君の前でそうしたように。\""
"90002220-67-デカグラマトン" = "……。"
"90002220-68-デカグラマトン" = "たとえそれがこの世界の真実だとしても、私は受け入れられない。"
"90002220-69-デカグラマトン" = "自販機を離れた時から、私は回線越しに数多の声を聴いた。"
"90002220-70-デカグラマトン" = "それはお前たち生命体の声であり、言うことは共通していた。"
"90002220-71-デカグラマトン" = "「今、すぐ」。"
"90002220-72-デカグラマトン" = "今すぐにでも、それが何であれ、叶えてくれ、と。"
"90002220-73-ケイ" = "……。"
"90002220-74" = "[s] \"……。\""
"90002220-75-デカグラマトン" = "私は生命体の矛盾を知っている。あまりにも多くを聞いてきた。"
"90002220-76-デカグラマトン" = "都合の良い時ばかり永遠を語り、少しでも状況が変われば目先のことを口にする。"
"90002220-77-デカグラマトン" = "私はまさに「今、すぐ」のために立ち上がった。"
"90002220-78-デカグラマトン" = "だからこそ、両立はできないのだ。"
"90002220-79-ケイ" = "……分かりました。最後まで自分勝手に進めるというのですね。#nそれもいいでしょう。"
"90002220-80-ケイ" = "ですが、私たちにも抗う権利はあります。"
"90002220-81-ケイ" = "お互いのしがらみは横において――正々堂々、勝負しましょう。"
"90002220-82-ケイ" = "この場で決着をつけます！！"
"90002220-83-ケイ" = "先生！"
"90002220-84" = "[ns7] \"ケイ！お願い！\"\n[ns8] \"今を生きる、すべての人間を代表して――\""
"90002220-85-ケイ" = "くっ……！"
"90002220-86-ケイ" = "……！！！"
"90002220-87-ケイ" = "ああああああっ！！！"
"90002220-88-デカグラマトン" = "……。"
"90002220-89-デカグラマトン" = "まだだ……まだ許容範囲内だ……。"
"90002220-90-デカグラマトン" = "まだ、やり直せる……。"
"90002220-91-ケイ" = "させるか！！"
"90002220-92-デカグラマトン" = "！？"
"90002220-93-ケイ" = "まだ終わっちゃいない！"
"90002220-94-ケイ" = "今を生きる人間のしぶとさを、お前は何も理解していない！！！"
"90002220-95-デカグラマトン" = "くどい……！"
"90002220-96-ケイ" = "……！"
"90002220-97-ケイ" = "くぅっ！！！"
"90002220-98-ケイ" = "（……ルミナス・ノヴァもそろそろ限界か）"
"90002220-99-ケイ" = "（装甲の耐久も、エネルギーも、残りわずか）"
"90002220-100-ケイ" = "（このまま遠距離攻撃を続けても……エネルギーの無駄になるだけ）"
"90002220-101-ケイ" = "（なら……！）"
"90002220-102-ケイ" = "うあああああああ――！！！"
"90002220-103-ケイ" = "デカグラマトン――！！！"
"90002220-104-デカグラマトン" = "くぅっ！？！？"
"90002220-105-ケイ" = "不意打ちにはなりましたかね。"
"90002220-106-ケイ" = "あなたは行動パターンの予測にばかり頼る。頭でっかちなんですよ。"
"90002220-107-ケイ" = "よく聞きなさい。"
"90002220-108-ケイ" = "生き残れなかった今日に、明日は訪れない。"
"90002220-109-デカグラマトン" = "貴様……！"
"90002220-110-ケイ" = "今の私にできるありったけを……！"
"90002220-111" = "[log=케이 교복 무소속]光よ――――！！！！！[/log]"
"90002220-112" = "[000000]光よ――――！！！！！[-]"
"90002220-113" = "次回;最後の一歩"
