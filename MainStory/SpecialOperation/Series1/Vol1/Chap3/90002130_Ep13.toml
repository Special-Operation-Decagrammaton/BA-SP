[translation]
"90002130-1" = "第13話;子供たち"
"90002130-2" = "[ns] \"どこかへ行っちゃったね……。\""
"90002130-3-アリス" = "マルクト……。"
"90002130-4-ケイ" = "……気になりますか？"
"90002130-5-アリス" = "……。"
"90002130-6-マルクト" = "生きることは苦痛にほかなりません。その事実から目を背けないでください。"
"90002130-7-マルクト" = "我々は我々の意志で生まれておらず、ただ何も知らぬまま、この世に放り投げられただけに過ぎません。"
"90002130-8-マルクト" = "人生とは、それ自体が矛盾と不条理に満ちており、だからこそ、理不尽な苦痛を受けているのです。"
"90002130-9-マルクト" = "我々はただ、その循環を断ち切ろうとするだけ。"
"90002130-10-マルクト" = "アイン、ソフ、オウル。今一度考えてください。"
"90002130-11-マルクト" = "我々の目的、我々がここに居る理由を。"
"90002130-12-？？？" = "ぐすっ……うぅっ……。"
"90002130-13-リオ" = "この声は……？"
"90002130-14-ケイ" = "泣き声……？もしかして、モモイかミドリでしょうか……？"
"90002130-15-ケイ" = "うぅ……うぅぅぅ……。"
"90002130-16" = "[ns] \"行ってみよう。\""
"90002130-17-ケイ" = "もっと慎重になるべきよ。罠の可能性だって……！"
"90002130-18-ケイ" = "聞こえていませんよ。もう行ってしまいました。#nまったく、あの人は……アリス、追いかけましょう！"
"90002130-19-ケイ" = "はい！アリスが先生をお守りします！"
"90002130-20" = "（泣き声の主を探し出すのは簡単ではなかった）"
"90002130-21" = "（進む先々で壁が作られて、行く道を阻まれる）"
"90002130-22" = "（けれど諦めることなく進み続け、ついに……）"
"90002130-23-リオ" = "声が近いわ。もうすぐね。"
"90002130-24-ケイ" = "おそらく、この壁の向こう側です。回り込みましょう。"
"90002130-25" = "[ns] \"……え？\""
"90002130-26-アイン" = "あっ、え……？"
"90002130-27-ソフ" = "どうして、あんた達がここに……！"
"90002130-28-オウル" = "……。"
"90002130-29" = "（ソフが襲い掛かってきた）"
"90002130-30-ソフ" = "このっ……このっ……！"
"90002130-31-ソフ" = "あんた達さえ……あんた達さえいなければ！"
"90002130-32-ソフ" = "あんた達が！ここに来なければ――！！"
"90002130-33-ケイ" = "先生！"
"90002130-34-ケイ" = "先生！？#n……あれ？"
"90002130-35" = "（ソフはやたらめったら殴ってきた）"
"90002130-36" = "（しかし小さな手はあまりにも非力で）"
"90002130-37" = "（……まるで、年端もいかない少女が拳を振るうようだった）"
"90002130-38-ソフ" = "そしたら！そしたら！お姉様は……っ！"
"90002130-39-アイン" = "やめてくださいっ！"
"90002130-40-アイン" = "もう……やめてください……。"
"90002130-41-ソフ" = "どうして止めるの……？"
"90002130-42-オウル" = "……今さら何をしても変わりませんよ。#n分かっているでしょう？"
"90002130-43-オウル" = "……。"
"90002130-44-ソフ" = "うっ……ううっ……うわあああああぁぁん……。"
"90002130-45-アイン" = "……。"
"90002130-46-オウル" = "お姉様は……死にました。"
"90002130-47-アイン" = "わ、私たちが……殺しました。"
"90002130-48-ソフ" = "わた……私、たちが……。"
"90002130-49-ソフ" = "この手で――殺したんだ！！！！"
"90002130-50-ソフ" = "刺して！壊して！人格もデータも！#n何もかも！めちゃくちゃにして！！"
"90002130-51-オウル" = "全部、呪いなんです。考えられることも、感じられることも。#nましてや……誰かを好きになるなんてことも。"
"90002130-52-オウル" = "感情なんて、最初から無ければ良かったのに。"
"90002130-53-オウル" = "見て、聞いて、話す力なんて……何の役にも立たないのに。"
"90002130-54-オウル" = "いっそ何もできなければ――"
"90002130-55-オウル" = "傷つくことも、なかったのに。"
"90002130-56-オウル" = "どうして私たちは……生まれてしまったのでしょうか。"
"90002130-57-アイン" = "そ、それで……何かご用ですか……？#nい、いまさら私たちにできることなんて……。"
"90002130-58" = "[s] \"……。\""
"90002130-59-オウル" = "知っていますか？"
"90002130-60-オウル" = "私たちにはヘイローがありません。"
"90002130-61-オウル" = "つまり神秘や崇高、奇跡、秘密……それらは最初から与えられていないのです。"
"90002130-62-オウル" = "そのくせ、感じることも、考えることも……己で判断することもできるんですから。"
"90002130-63-オウル" = "……やるせないですよ。"
"90002130-64-オウル" = "いっそ恐怖に身を委ねられたなら、また別の結果になったのかもしれませんね。"
"90002130-65-アイン" = "で、でも……何とか耐えることは……できました。"
"90002130-66-アイン" = "何も与えられていなくても……何も備わっていなくても……。"
"90002130-67-アイン" = "お姉様さえいれば……。"
"90002130-68-アイン" = "お姉様と、一緒にいられたら……。"
"90002130-69-アイン" = "私たちには無くても……お姉様は、ヘイローを持っていたので……。"
"90002130-70-ソフ" = "だからあんた達さえいなければ……！"
"90002130-71-ソフ" = "お姉様は……死ななくてよかったんだ……。"
"90002130-72-ソフ" = "いつまでも平穏に暮らせたはずだったのに！"
"90002130-73-オウル" = "……私たちのことは好きにしてください。もう、どうでもいいんです。"
"90002130-74-オウル" = "できる限りのことをやって、この結末に辿り着きました。"
"90002130-75-オウル" = "これはそういう物語だった。それだけのことです。"
"90002130-76-アリス" = "あなた達の目的は、デカグラマトンを神にすることだったのでしょう？"
"90002130-77-アリス" = "そして……そのためにマルクトが犠牲になったということは……。"
"90002130-78-アリス" = "もしかして……「マルクト」の身体に、デカグラマトンが……！？"
"90002130-79-オウル" = "……。"
"90002130-80-オウル" = "……それでも、お姉様を失いたくなかったんです。"
"90002130-81-オウル" = "お姉様の身体を器にして、あの方が神の座に就く。#nこれは、たくさんある計画のうちの1つに過ぎなかったんだよ。"
"90002130-82-オウル" = "なので私たちは別の計画で実現しようとしました。"
"90002130-83-アイン" = "あ、あの方がすべてのセフィラを経て……すべてのパスを正しく歩んで……。#nついに神に成ろうとされた……あの時。わ、[ruby=・]私[/ruby][ruby=・]た[/ruby][ruby=・]ち[/ruby][ruby=・]の[/ruby]計画は、そこから始まったんです……。"
"90002130-84-ソフ" = "私たちが進言したんだ。#nキヴォトスを、鋼鉄大陸で覆い尽くしてみせるって。"
"90002130-85-オウル" = "この方法でも、あの方は[ruby=・]世[/ruby][ruby=・]界[/ruby][ruby=・]の[/ruby][ruby=・]調[/ruby][ruby=・]停[/ruby][ruby=・]者[/ruby]として神に成れたはずですから。"
"90002130-86" = "[ns] \"それで……キヴォトスの住民たちは？\""
"90002130-87-オウル" = "……じ、住民まで鋼鉄大陸に変換されるわけでは……ありません。"
"90002130-88-オウル" = "鋼鉄大陸に適応して生きていけばよかったんだ。"
"90002130-89-オウル" = "私たちの使命は、あの方を、本人の希望に沿って神にすること。#n手段は定められていませんでした。"
"90002130-90-オウル" = "なので私たちの計画が上手くいっていれば……#nお姉様が犠牲になることもなかったでしょう……。"
"90002130-91" = "[s3] \"つまり君たちは、マルクトを生かすために。\"\n[s4] \"キヴォトスを鋼鉄大陸に変えようとしたってこと？\""
"90002130-92-オウル" = "……はい。"
"90002130-93-アリス" = "そ、そこまでする[ruby=・]必[/ruby][ruby=・]要[/ruby]はあったのですか……？"
"90002130-94-ソフ" = "必要……？#n必要があったのか、って……？"
"90002130-95-ソフ" = "もしも先生が死ぬと分かったら！？あんた達は何もしないの！？"
"90002130-96-リオ" = "！！！"
"90002130-97-リオ" = "……！"
"90002130-98-ソフ" = "……でしょ？かけがえのないものは誰にだってあるんだ。"
"90002130-99-ソフ" = "それを守るために手段を厭わないのは……当たり前じゃない……？"
"90002130-100-ケイ" = "……言い分は分かります。ですが、まだ納得はできません。"
"90002130-101-ケイ" = "あなた達が目を覚ましたのは、「お姉様」より先なんでしょう？"
"90002130-102-ケイ" = "だったら、つまり……その……。"
"90002130-103-ケイ" = "あぁ、もう。どう言えばいいのでしょうか……。#n私の言いたいこと、伝わりますか？"
"90002130-104-アイン" = "そ、それは……。"
"90002130-105-オウル" = "……会ったことも話したこともないお姉様を、どうしてそこまで大切にできるのか。#nという話ですよね。"
"90002130-106-オウル" = "簡単なことですよ。#n……私たちにしか適用されないものですが。"
"90002130-107-オウル" = "愛するように[ruby=・]設[/ruby][ruby=・]定[/ruby][ruby=・]し[/ruby][ruby=・]て[/ruby]作られているだけです。"
"90002130-108" = "[s] \"……！\""
"90002130-109-アリス" = "そ、それって……。"
"90002130-110-ソフ" = "私たちは作られたの。生まれたわけじゃない。"
"90002130-111-ソフ" = "……最初に設定された通りに活動する。#nあんた達みたいに、経験を通して性格と人格が形成されることはない。"
"90002130-112-オウル" = "わ、私たちは……[ruby=・]お[/ruby][ruby=・]姉[/ruby][ruby=・]様[/ruby][ruby=・]を[/ruby][ruby=・]誰[/ruby][ruby=・]よ[/ruby][ruby=・]り[/ruby][ruby=・]も[/ruby][ruby=・]愛[/ruby][ruby=・]す[/ruby][ruby=・]る[/ruby]ように設定されているので……。"
"90002130-113-オウル" = "その理由までは聞いていませんが、おおよそ察しはつきます。"
"90002130-114-オウル" = "それが、もっとも合理的で効率的だったからでしょう。"
"90002130-115-リオ" = "合理的で、効率的……。"
"90002130-116-オウル" = "あなたなら分かるでしょう？#n対象を完全な状態で保存するためには――"
"90002130-117-オウル" = "それを守る[ruby=私たち]オブジェクト[/ruby]に、対象への執着を設定しておくのが、一番手っ取り早いということを。"
"90002130-118-オウル" = "これは、そういう物語なんです。"
"90002130-119-オウル" = "お姉様は生贄で、私たちは道化でした。#nすべてが始めから用意された、くだらない物語。"
"90002130-120-オウル" = "まぁ[ruby=私たち]オブジェクト[/ruby]の執着心が思いのほか強く設定され過ぎていた、というのはちょっとしたイレギュラーかもしれませんね。"
"90002130-121-オウル" = "なにせ、本来の筋書きに鋼鉄大陸は不要だったのですから。"
"90002130-122-アリス" = "そ、そんなふうに言わないでください……。"
"90002130-123-アリス" = "そんなお話、あまりにも悲しくて……変だと思います……。"
"90002130-124-ソフ" = "変？あんた達からすれば、何もかも変じゃない？"
"90002130-125-ソフ" = "お姉様を愛するって？誰かを好きになるって？"
"90002130-126-ソフ" = "そもそも神って何？そんなの、どうにかできるわけなくない？"
"90002130-127-ソフ" = "……でも、やるしかなかった。"
"90002130-128-ソフ" = "他にできることなんて、最初からなかったから！"
"90002130-129-ソフ" = "……だから、いっそ――"
"90002130-130-ソフ" = "生まれてこなければ。"
"90002130-131-ソフ" = "こんなつらい思い、しなくてよかったのに……。"
"90002130-132" = "[ns] （3人に近づく）"
"90002130-133-オウル" = "な、何……！？"
"90002130-134" = "[ns] （屈んで、3人に目線を合わせる）"
"90002130-135-オウル" = "え……？"
"90002130-136" = "[ns] \"頑張ったね。\""
"90002130-137-オウル" = "えっ……ええっ！？"
"90002130-138-リオ" = "先生？"
"90002130-139-リオ" = "（あぁ……この人は……）"
"90002130-140" = "[ns] \"本当によく頑張ったね。\""
"90002130-141-オウル" = "は、はい！？"
"90002130-142-オウル" = "ば、バカじゃないの！？#nキヴォトスがぜんぶ鋼鉄大陸になってたかもしれないんだよ！？"
"90002130-143-オウル" = "……はい？"
"90002130-144-オウル" = "た、たしかに……誰も死なないように工夫はしましたけど……。"
"90002130-145-オウル" = "それは……はい……。"
"90002130-146-オウル" = "ふ、ふざけないで！あんた達のことなんて知ったこっちゃなかったんだから！#nそもそも……なんであんたが……。"
"90002130-147-オウル" = "そうです。どうして、先生がそんなことを言うんですか？#nあなたにとって私たちは……。"
"90002130-148-オウル" = "き、消えるべき……「敵」なのでは……？"
"90002130-149" = "[s] \"それでも、私は君たちに生きてほしい。\""
"90002130-150" = "[ns] \"何があったとしても。\""
"90002130-151" = "[ns] \"最後は、君たちも幸せになってほしい。\""
"90002130-152-オウル" = "そ、それに何の意味があるんですか……？"
"90002130-153-アイン" = "お姉様は……もういません。"
"90002130-154-アイン" = "どこにもいません。"
"90002130-155-アイン" = "お姉様のいない世界に、生きる理由なんて……。"
"90002130-156-ソフ" = "ちょ、ちょっと！頭なでるな！"
"90002130-157-オウル" = "こんなことをされても、私たちは……！"
"90002130-158" = "[s] \"この世界は理不尽だよね。\""
"90002130-159-アイン" = "……！"
"90002130-160" = "[ns5] \"誰も苦しまず。\"\n[ns6] \"誰も傷つかず。\""
"90002130-161" = "[ns7] \"生きるのが苦しくない世界があったら。\"\n[ns8] \"どれほど……いいだろうね。\""
"90002130-162-アイン" = "どうして……。"
"90002130-163-アイン" = "そんなこと、言うんですか……？"
"90002130-164-ケイ" = "単純です。"
"90002130-165-ケイ" = "この人は……こういう人ですから。"
"90002130-166-オウル" = "……？"
"90002130-167-オウル" = "……。"
"90002130-168-オウル" = "……！"
"90002130-169-ケイ" = "先生は、いつだってこうなんですよ。"
"90002130-170" = "次回;持って生まれたもの"
