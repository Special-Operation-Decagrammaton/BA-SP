[translation]
"90002020-1" = "第2話;風雲急を告げる"
"90002020-2-トキ" = "ご搭乗の皆様、おはようございます。#n当機の機長を務めております[ruby=あすま]飛鳥馬[/ruby]トキでございます。"
"90002020-3-トキ" = "当機はただいま、高度8000メートルを飛行しており、航路上の問題は予測されておりません。"
"90002020-4-トキ" = "間もなく目的地の鋼鉄大陸に到着いたします。#n予期せぬ揺れに備え、シートベルトをご着用ください。"
"90002020-5-トキ" = "また安全のため、テーブルを元の位置にお戻しいただきますよう#nお願いいたします。"
"90002020-6-モモイ" = "え？テーブルなんて無くない？"
"90002020-7-トキ" = "はい。言ってみただけです。"
"90002020-8-ヒマリ" = "ふふっ。トキ機長は意外と茶目っ気があるんですね。"
"90002020-9-ヒマリ" = "では私も――#nオペレーションおよび運航アシストを担当している[ruby=あけぼし]明星[/ruby]ヒマリと申します♪"
"90002020-10-ヒマリ" = "現時点では、定刻通りの到着となる見通しです。"
"90002020-11-ヒマリ" = "さて、空の旅であるわけですが……皆さん、[ruby=・]あ[/ruby][ruby=・]の[/ruby][ruby=・]時[/ruby]と比べていかがですか？"
"90002020-12-ミドリ" = "あの時は高すぎるところにいたので、実感が湧かなかったんですが……。"
"90002020-13-ユズ" = "い、今は、ちゃんと空を飛んでいる気分です、えへへ……。"
"90002020-14-エイミ" = "ねえ、会長。#n一応、言われたとおり副操縦席に座ってるけど、ここまでする必要あった？"
"90002020-15-エイミ" = "ちょっと非効率的じゃない？"
"90002020-16-リオ" = "いいえ、このほうが合理的よ。"
"90002020-17-リオ" = "人員の増加に比例して、気を使うべきことも多くなっているわ。#nその分、トキの負担を減らす必要があったのよ。"
"90002020-18" = "私は完璧なメイドですので、一人でも何の問題もなかったと思います。"
"90002020-19-リオ" = "万が一を考慮すべきよ。#nあらゆる変数に備えておかなければならないもの。"
"90002020-20-トキ" = "リオ様がそこまで仰るのでしたら。"
"90002020-21-アリス" = "それにしても、この輸送船……とってもすごいです！"
"90002020-22-ミドリ" = "わ、わたしも……船の中をちゃんと見るのは初めてで……。"
"90002020-23-モモイ" = "うーん、どうせならもっと探検しておけばよかったね。"
"90002020-24-ミドリ" = "仕方ないでしょ、状況が状況なんだし。"
"90002020-25-ケイ" = "今は、記憶を辿るに留めましょう。#nコックピットを出ると、すぐそこがロビーでしたね。"
"90002020-26-モモイ" = "正直、私の部屋より綺麗だった……。"
"90002020-27-ケイ" = "……どれだけ散らかっているんですか。ちゃんと掃除してください。"
"90002020-28-リオ" = "ええ……掃除は大事だと、改めて感じたわ。"
"90002020-29-ヒマリ" = "ぷふっ！？"
"90002020-30-ケイ" = "あなたがそれを言うんですか……。"
"90002020-31-リオ" = "輸送船の中で最も脆弱で、最も重要なスペースが格納庫ね。"
"90002020-32-トキ" = "はい。外に繋がるハッチと、降下用のポッドもありますので。"
"90002020-33-ヒマリ" = "持ってきたAMASもすべて格納庫にありますよね？#nそういえば、なにか……円錐型のものを見かけたような？"
"90002020-34-リオ" = "それは……。"
"90002020-35-リオ" = "……気にしなくていいわ。"
"90002020-36-ヒマリ" = "ふむ？"
"90002020-37-ミドリ" = "格納庫だとエンジンの音がほとんど聞こえなくてびっくりしました。"
"90002020-38-ユズ" = "はい……い、いざという時、安心して隠れられそうって思うくらい……。"
"90002020-39-ヒマリ" = "有事の際には最も危険な場所ですから、やめてくださいね……？"
"90002020-40" = "[ns1] \"改めてすごいと思うけど……。\"\n[ns2] \"どうやって準備したの？\""
"90002020-41-リオ" = "別に大したことはないわ。ミレニアムが培ってきた技術を応用しただけよ。"
"90002020-42-リオ" = "想像できる分野を研究し、具現化するのは……そう難しいことではないわ。"
"90002020-43-リオ" = "問題は、想像すらできない分野を研究する場合。"
"90002020-44-ヒマリ" = "ええ。想像できるということは、それだけで糸口が見えている証拠ですから。"
"90002020-45-ヒマリ" = "不意に、想像もしないような事実だけを突きつけられた時の絶望感たるや……。"
"90002020-46" = "[s] \"そんなこともあったの？\""
"90002020-47-ヒマリ" = "研究をしていると、時々あるんですよ。"
"90002020-48-リオ" = "重力がいい例ね。#n私たちは皆、重力に縛られて生きているけれど、その根源といえる重力子は――"
"90002020-49-モモイ" = "スト～ップ！いきなり専門的なこと言い出すの、リオ会長の悪い癖だよ！#nそんなんじゃ、みんなに嫌われちゃうんだから！"
"90002020-50-リオ" = "そ、そうかしら……。"
"90002020-51-リオ" = "でも……嫌われるのは、もう慣れているから……。"
"90002020-52-ケイ" = "ここでその返し方はちょっと……。"
"90002020-53-ヒマリ" = "……話を変えましょうか。#nトキ、飛行状況はいかがですか？"
"90002020-54-エイミ" = "航路に異常はありません。鋼鉄大陸の信号がどんどん強くなっています。"
"90002020-55-エイミ" = "強いて言えば、信号が強すぎるかな。着陸地点を決めるのが難しいかも。"
"90002020-56-モモイ" = "着陸なんてどこでもいいんじゃないの？"
"90002020-57-エイミ" = "そうはいきません。#n万が一、防空システムが整った場所に向かった場合は、一巻の終わりです。"
"90002020-58-エイミ" = "この輸送船は「輸送」と「研究」に重点を置いてるからね。#nその分、防御力は少し低いんだよ。"
"90002020-59-リオ" = "それに相手が鋼鉄大陸……つまり、7番目の預言者「ネツァク」である以上――"
"90002020-60-リオ" = "私たちの常識は、通用しない可能性が高いわ。"
"90002020-61-ヒマリ" = "その通りです。実際、すでに飛行高度の判断すら難しくなっています。"
"90002020-62-エイミ" = "現在は雲の中に隠れながら、可視光線や赤外線、レーダーぐらいは撹乱できるように飛行しています。"
"90002020-63-エイミ" = "……私たちも、肉眼で鋼鉄大陸を視認するのは難しいけどね。"
"90002020-64-ケイ" = "能動的にネツァクを探知することはできませんか？"
"90002020-65-エイミ" = "そのためには、こちらから電波を発する必要があります。#nすぐに逆探知されてしまうかと。"
"90002020-66-エイミ" = "それに、信号が強すぎるせいで別の問題も起きてるよ。"
"90002020-67-エイミ" = "どんな信号を検知しても、結局は1つに収束しちゃう。#nもう分析する意味もないくらい。"
"90002020-68" = "[s] \"つまり……どうすればいいの？\""
"90002020-69-エイミ" = "……。"
"90002020-70-リオ" = "……。"
"90002020-71-トキ" = "このまま進むほかありません。"
"90002020-72" = "もう少し言い方というものが……。"
"90002020-73-トキ" = "なにか問題でも？"
"90002020-74-ケイ" = "……いいえ。"
"90002020-75-トキ" = "いずれにせよ、まもなく到着します。"
"90002020-76-トキ" = "これより、高度を下げ――"
"90002020-77-ミドリ" = "きゃぁっ！？"
"90002020-78-アリス" = "トキ、何が起きているんですか！？"
"90002020-79-トキ" = "緊急事態です！巨大な……反応を検知しました！"
"90002020-80-エイミ" = "あれは……機械の腕？"
"90002020-81-トキ" = "信号分析、完了――9番目の預言者「イェソド」です！"
"90002020-82-リオ" = "イェソド！？"
"90002020-83-ケイ" = "うわああっ！？"
"90002020-84-アリス" = "うわーん！？"
"90002020-85-ユズ" = "あわわわわ……！"
"90002020-86-モモイ" = "な、なにあれぇぇ！！"
"90002020-87-ミドリ" = "ひ、ひぃっ……！"
"90002020-88-リオ" = "皆、なんでもいいから掴まりなさい！#nエイミ！被害の状況は？"
"90002020-89-エイミ" = "エンジンに損傷。でも、メインエンジンは出力維持できてる。#nサブエンジンはもうダメかな……。"
"90002020-90-トキ" = "エンジンから火災発生！消火システムを稼働します！"
"90002020-91-エイミ" = "高度と機体バランスを維持できない……。会長！このままだと――！"
"90002020-92-トキ" = "墜落します！"
"90002020-93-ヒマリ" = "火災の状況は！？"
"90002020-94-トキ" = "エンジン火災は鎮火しました！ただ、機体の外壁が延焼しています！"
"90002020-95-リオ" = "臨界点まで、エンジンを逆噴射！"
"90002020-96-エイミ" = "臨界点まで、エンジンを逆噴射！#n緊急着陸シーケンス稼働！衝撃に備えて――！"
"90002020-97" = "[ns] \"みんな、大丈夫！？\""
"90002020-98-モモイ" = "いたたた……目がグルグルしてるよぉ……。"
"90002020-99-ミドリ" = "シートベルトって大切なんですね……。"
"90002020-100-ケイ" = "車輪1つであることを、こんなに恨んだことはありません……。"
"90002020-101-ユズ" = "そ、それより……ここは、どこですか……？#n説明で聞いてた、鋼鉄大陸のようには見えないですけど……。"
"90002020-102-リオ" = "鋼鉄大陸の端……辛うじて残っていた土地のようね。"
"90002020-103-リオ" = "私たちは、イェソドの巨大な腕に攻撃されて――"
"90002020-104-ヒマリ" = "その結果、ここに不時着したのですね。"
"90002020-105-モモイ" = "ま、また！？"
"90002020-106-エイミ" = "レーダーに敵性反応多数！#nトキ、外のカメラにつなげて！"
"90002020-107-トキ" = "映します。"
"90002020-108-ヒマリ" = "あれは……[ruby=シード・ボルト]種子貯蔵庫[/ruby]で襲ってきた個体ですね。"
"90002020-109-リオ" = "包囲されているわね。このままでは……！"
"90002020-110-アリス" = "大丈夫です、リオ先輩！ここはアリスがみんなを守ります！"
"90002020-111-ミドリ" = "あっ、あ……！"
"90002020-112-ミドリ" = "アリスちゃん！？"
"90002020-113-モモイ" = "……。"
"90002020-114-モモイ" = "ゲーム開発部！出動だよ！"
"90002020-115-ユズ" = "お姉ちゃん！？"
"90002020-116-ユズ" = "わ、わたし達が……？"
"90002020-117-モモイ" = "そう！アリスにだけ任せるわけにはいかないでしょ？#n先生、行ってくる！"
"90002020-118-ミドリ" = "お、お姉ちゃん！……私も！"
"90002020-119-ユズ" = "一人は……みんなのために……みんなは……一人のために……。"
"90002020-120-ヒマリ" = "皆さん、待ってください！"
"90002020-121" = "[s] \"……。\""
"90002020-122" = "[ns] \"エイミ、ゲーム開発部のみんなを頼めるかな。\""
"90002020-123-エイミ" = "私？"
"90002020-124-エイミ" = "……。"
"90002020-125-エイミ" = "うん、任せて。"
"90002020-126" = "[ns] \"リオとトキは、可能な限り輸送船の修理をお願い。\""
"90002020-127-トキ" = "ええ……分かったわ。"
"90002020-128-トキ" = "行きましょう、リオ様。まずはエンジンからです。"
"90002020-129-ヒマリ" = "私たちは何をしましょうか。"
"90002020-130" = "[s] \"ケイとヒマリは……一旦待機で。\""
"90002020-131-ヒマリ" = "あら、頼られないというのも寂しいものですね……。"
"90002020-132-ヒマリ" = "いえ、分かっております。状況の全体把握はお任せください。"
"90002020-133-モモイ" = "あーもう！キリがない！"
"90002020-134-アリス" = "ですが、ここで引くわけにはいきません！先生とみんなを守るために！"
"90002020-135-？？？" = "みんな、ちょっと後ろへ下がろうか。モモイは私についてきて。"
"90002020-136-モモイ" = "え……？"
"90002020-137-ミドリ" = "この声は……エイミさん！"
"90002020-138-エイミ" = "助けに来たよ。#n最前線は私とモモイに任せて。"
"90002020-139-エイミ" = "アリスは後方から火力支援をお願い。"
"90002020-140-エイミ" = "ミドリとユズは隊列の中間を埋めてほしいな。"
"90002020-141-アリス" = "はい！お願いします、エイミ！"
"90002020-142-エイミ" = "うん。やれるとこまでやってみよう。"
"90002020-143-モモイ" = "だ、大丈夫かな……？"
"90002020-144-エイミ" = "まあ。"
"90002020-145-エイミ" = "これくらい、どうとでもなるよ。"
