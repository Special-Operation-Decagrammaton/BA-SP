[translation]
"90002100-1" = "第10話;000、00、０"
"90002100-2-モモイ" = "鋼鉄大陸ー！"
"90002100-3-ユズ" = "こ、攻略戦……！#n……うぅ。"
"90002100-4-モモイ" = "せっかく新装備になったんだよ？もっと気合入れないと！"
"90002100-5-ユズ" = "で、でも……。"
"90002100-6-ミドリ" = "お姉ちゃん、だる絡みしないで。ユズちゃんが困ってるでしょ。"
"90002100-7-モモイ" = "人聞きが悪い！#n私は、ユズを勇気づけるために言っているのに！"
"90002100-8-ケイ" = "そうです！勇気こそ、勇者にとって一番大事な武器なのです！"
"90002100-9-ケイ" = "あなたまで乗ってどうするんですか……。"
"90002100-10" = "[ns] \"まずはビナーのエリアに向かうんだよね？\""
"90002100-11-リオ" = "ええ。あのエリアには、鋼鉄大陸を守るファイアウォールが設置されているわ。#n突破に成功すれば、その先の攻略が幾分か容易になるはず。"
"90002100-12-リオ" = "最初の目標は、ビナーのコアを確保して、鋼鉄大陸のネットワークへのアクセス権を得ること。#nそこから先は、先生の判断に任せるわ。"
"90002100-13-ヒマリ" = "その際は、2組に分かれて行動するのが良いかと。#nこの輸送船であれば、機動力は申し分ないですから。"
"90002100-14-ヒマリ" = "チームの編成は、その都度柔軟に変更していきましょう。"
"90002100-15-エイミ" = "でも、エリアを占領したあとは、必ずケイを呼ばないといけないんだよね？"
"90002100-16-トキ" = "はい。そうすればケイが預言者のコアから情報を取り出して、#n私たちの戦力に換えてくれるはずです。"
"90002100-17-アリス" = "……敵の能力を利用する生命体みたく言わないでもらえますか。"
"90002100-18-アリス" = "あっ、ケイもそのゲームを知っているのですね！#nあれは本当に神ゲーです！"
"90002100-19" = "[ns] \"ケイもゲーム好きなの？\""
"90002100-20-ケイ" = "そんなわけありません！#nこれはただ、アリスと同期した時の記憶と経験が残っているだけで――！"
"90002100-21-アリス" = "そうでしたか……。ケイにとって、アリスの記憶は余計なものだったんですね……。"
"90002100-22-ケイ" = "ち、違います！#nえっと、私が言いたいのは、その……！"
"90002100-23-アリス" = "大丈夫です……アリスは、そんなケイも大事にしたいです……#nケイが、アリスのことをどう思っていても……。"
"90002100-24-ケイ" = "だから違いますって！アリス、話を聞いてください！！"
"90002100-25-アリス" = "ケイ、気にしないでください。アリスは大丈夫ですから……。"
"90002100-26-ケイ" = "アリス――！！"
"90002100-27" = "（慌てるケイとは反対に、アリスはこちらを振り向くと――）"
"90002100-28" = "（いたずらっぽく笑った……！）"
"90002100-29" = "[ns] \"アリス、からかうのはそれくらいにしようね。\""
"90002100-30-アリス" = "えへへ、ごめんなさい、ケイ。"
"90002100-31-ケイ" = "はい？からかう……？"
"90002100-32" = "[ns] \"ケイって反応が大きいもんね……。\""
"90002100-33-アリス" = "えへへ、そうなんです。"
"90002100-34-ケイ" = "……。"
"90002100-35-ケイ" = "…………。"
"90002100-36-ケイ" = "………………。"
"90002100-37-ケイ" = "先生――っ！！！"
"90002100-38-エイミ" = "では、いきましょうか。#nこの[ruby=あすま]飛鳥馬[/ruby]トキが、完璧なメイドとして先生を補佐いたします。"
"90002100-39-エイミ" = "その格好だとあんまりメイドと言えないような……？"
"90002100-40-エイミ" = "……完璧なエージェントとして先生を補佐いたします。"
"90002100-41-エイミ" = "切り替え早いね……。"
"90002100-42-エイミ" = "状況に応じて機敏に対応する。まさに優秀なエージェントだと思いませんか？"
"90002100-43-エイミ" = "ぶい。"
"90002100-44" = "[s] \"そ、そうだね……。\""
"90002100-45-ケイ" = "あの、そろそろ始めますよ？"
"90002100-46-ヒマリ" = "全員、持ち場に戻ってちょうだい。"
"90002100-47-ヒマリ" = "では、先生に指揮権をお返しします。"
"90002100-48" = "[s] \"緊張するね。\""
"90002100-49-ヒマリ" = "あら、指揮は手慣れているのでは？"
"90002100-50" = "[s] \"それもそうだね。いつも通りやっていこう。\""
"90002100-51" = "[ns] \"じゃあ、ビナー攻略戦を始めようか！\""
