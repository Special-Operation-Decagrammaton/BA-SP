[translation]
"90000050-1" = "第6話;「データ収集（５）廃墟」"
"90000050-2-エイミ" = "廃墟？それってどこにあるの？"
"90000050-3-エイミ" = "あら、意外と疎いのですね、エイミ。"
"90000050-4-ヒマリ" = "「廃墟」はミレニアム自治区の近くにあるものの、連邦生徒会によって立入禁止となった未知の地域を指しています。捨てられてしまい、長い間放置された都市だからそう呼ばれているのだとか。"
"90000050-5-ヒマリ" = "その都市の起源や正体については何も明らかになっていません。研究や調査そのものが禁止された地域ですので……。"
"90000050-6-エイミ" = "そうなんだ……初めて聞いた。そんな話、リオ会長も教えてくれなかったし。"
"90000050-7-ヒマリ" = "……まぁ、リオなら言わない可能性はありますね。あの人、自分が本当に重要だと思うことは誰にも教えたりしませんから。"
"90000050-8-ヒマリ" = "リオは「廃墟」にとても執着しているので。さすが、情報を独占したがるビッグシスターらしいと言いますか……。"
"90000050-9-ヒマリ" = "ですが、それでも「廃墟」に対する噂はミレニアム生徒の間で密かに広がっている状態です。"
"90000050-10-エイミ" = "先生もあの場所に関して、ご存知なのではないでしょうか？"
"90000050-11" = "[s1] \"まぁ、ちょっとだけね。\"\n[s2] \"うーん、どうだろう？\""
"90000050-12-ヒマリ" = "アリスは……。"
"90000050-13-ヒマリ" = "……いえ、この話はやめておきましょう。今の任務と関係ありませんし。"
"90000050-14-ヒマリ" = "……この話は、また次の機会に。"
"90000050-15-ヒマリ" = "さて……ミレニアムの「廃墟」は言うなれば、トリニティの「カタコンベ」や、ゲヘナのヒノム火山にある「アビス」のようなものだと言えるでしょう。"
"90000050-16-ヒマリ" = "その全容が把握されていない、キヴォトスの未開の地の一つ……。"
"90000050-17-ヒマリ" = "可能性の話ですが。ここは、キヴォトスから忘れ去られたものが集積される……ある種の下水道のような場所なのではないかと思っております。"
"90000050-18-エイミ" = "下水道……浄化槽……ヒマリ先輩ってそういう言葉選び好きだよね。"
"90000050-19-ヒマリ" = "その「なんで汚いものが好きなの？」とでも言いたげな視線をやめていただけませんか？比喩ですよ、比喩。私の清楚なイメージを汚さないでください。"
"90000050-20-エイミ" = "比喩なら他の単語でもいいと思うけど。"
"90000050-21-ヒマリ" = "それはですね、エイミ。世の中には……。"
"90000050-22" = "[s] \"……本題に戻ろっか。\""
"90000050-23-ヒマリ" = "……はい。"
"90000050-24-ヒマリ" = "また話が逸れちゃった。これも全部、部長のせいだよ。"
"90000050-25-ヒマリ" = "私が罪深い女であることは認めますが……今回は絶対にエイミのせいですよ。先生も注意していますし、適当にそういう事にします。"
"90000050-26-エイミ" = "適当にそういう事にしないで。……とにかく、その「廃墟」に次のターゲットがいるの？"
"90000050-27-ヒマリ" = "はい。4番目の預言者、「ケセド」が廃墟のどこかにいると思います。"
"90000050-28-エイミ" = "「ケセド」か……。"
"90000050-29-ヒマリ" = "デカグラマトンは軍需工場の生産コントロールAIを自身の預言者とし、無限の兵力を手に入れたのです。"
"90000050-30-ヒマリ" = "つまり、「ケセド」はデカグラマトンの軍団を生産する「軍需工場」そのもの。"
"90000050-31-ヒマリ" = "「ケセド」こそ、デカグラマトン……その軍団の主戦力と思っていいでしょう。"
"90000050-32-エイミ" = "ですが、廃墟はあまりにも広大です。あの中で「軍需工場」の位置を探すことは不可能に近い……なのでまずは、情報収集から始めましょう。"
"90000050-33-エイミ" = "つまり、廃墟にいるであろうデカグラマトンの兵隊が次のターゲットなんだね？"
"90000050-34-ヒマリ" = "はい。その兵からデータを収集し、「ケセド」の位置を割り出します。"
"90000050-35-エイミ" = "わかった。"
"90000050-36-ヒマリ" = "廃墟に向かう道は既に確保しました。そこから進入して任務を始めるとしましょう。"
"90000050-37-ヒマリ" = "それじゃあ出発しようか。"
