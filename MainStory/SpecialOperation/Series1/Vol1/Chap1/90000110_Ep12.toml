[translation]
"90000110-1" = "第12話;デカグラマトン"
"90000110-2-ヒマリ" = "……デカグラマトンの信号が捉えられた座標、ここですね。"
"90000110-3" = "[s] \"ヒマリが現場にいるの、珍しいね……。\""
"90000110-4-ヒマリ" = "それはもちろん。#n私は基本的に安楽椅子美少女ですが、必要とあらば、殺陣だって厭いませんよ？"
"90000110-5-ヒマリ" = "まあ多少の危険は伴うとはいえ、時間があることもたしか。"
"90000110-6-ヒマリ" = "何より、この場所を自分の目で見ておきたかったので。"
"90000110-7-エイミ" = "何か理由が？"
"90000110-8-ヒマリ" = "……デカグラマトンの信号を捉えて以来、ここについての情報を沢山収集してきました。"
"90000110-9-ヒマリ" = "そのためにハッカーとして、ありとあらゆる手段を使っています。"
"90000110-10-ヒマリ" = "結果として、興味深い情報が幾つも見つかりました。"
"90000110-11-ヒマリ" = "「神を研究し、その存在を証明できれば……その構造を分析し、再現できるだろう。#n　すなわちこれは、新たな神を創り出す方法である……」――"
"90000110-12-エイミ" = "？"
"90000110-13-ヒマリ" = "「対・絶対者自律型分析システム」の設計思想です。"
"90000110-14-ヒマリ" = "その「絶対的な存在を証明しようとする研究」が、#nこの廃墟のどこかで行われていたのです。"
"90000110-15-ヒマリ" = "そのために超人工知能を作ろうとしたようですが……#n最終的に、完成には至りませんでした。"
"90000110-16-ヒマリ" = "ですので、証明は始まるまでもなく終了しました。"
"90000110-17-ヒマリ" = "しかし、もしこの研究室でデカグラマトンの信号が捉えられていたとしたら……#nお話は変わってきます。"
"90000110-18-エイミ" = "つまり……。"
"90000110-19-ヒマリ" = "お察しの通りこの場所こそが、その研究が行われた場所です。"
"90000110-20-エイミ" = "……へぇ。"
"90000110-21" = "[s] \"つまり、デカグラマトンの正体は……\""
"90000110-22-ヒマリ" = "廃墟に残ったAIが神を証明するための分析を続け……#n最終的に、自らを神だと称することになったのだとしたら……"
"90000110-23-ヒマリ" = "……とはいえ、今はただの仮説に過ぎません。#n何が真実なのかをこの目で確かめるために、ここに来たので。"
"90000110-24-ヒマリ" = "しかし少なくとも、何らかの真実はこの建物の中にあるでしょう。"
"90000110-25-エイミ" = "……それってつまり、ここがすっごく危ない場所ってことじゃないの？"
"90000110-26-ヒマリ" = "心配はしていませんよ。#n私たちが危険な目に遭っても、エイミが守ってくれるでしょう？"
"90000110-27-ヒマリ" = "あら、何ですかその奇妙な表情は。"
"90000110-28-エイミ" = "まあ、部長がそう言うなら……。"
"90000110-29-ヒマリ" = "さてさて、では中に入ってみるとしましょうか。"
"90000110-30-エイミ" = "その前に部長、何か危なくなったらすぐに下がってよ？"
"90000110-31-ヒマリ" = "はい、その辺りはお任せしますとも。"
"90000110-32-エイミ" = "うん、じゃあ……"
"90000110-33" = "研究室・内部"
"90000110-34-ヒマリ" = "……。"
"90000110-35-エイミ" = "ここがさっき言ってた、「対・絶対者自律型分析システム」の研究室？#n特に変わった様子は……。"
"90000110-36-ヒマリ" = "とにかく、調べてみましょう。"
"90000110-37-エイミ" = "うん。先生、何が起こるか分からないから、私の傍から離れないでね？"
"90000110-38-エイミ" = "普通の廊下じゃない？"
"90000110-39-ヒマリ" = "そう見えますね……どうやら、資材倉庫に繋がっているようです。"
"90000110-40-ヒマリ" = "……。"
"90000110-41-ヒマリ" = "……見つけました。"
"90000110-42-エイミ" = "ん？"
"90000110-43-エイミ" = "この、組み上げ途中のパソコンみたいなのが……？"
"90000110-44-ヒマリ" = "はい。おそらくこれこそが、「対・絶対者自律型分析システム」の本体……。"
"90000110-45-エイミ" = "電源が点くかも怪しいガラクタに見えるけど……？"
"90000110-46-ヒマリ" = "そうですね……だとすると、噂通りあの実験はやはり失敗していて……？#nですが、だとすると一体……。"
"90000110-47-エイミ" = "「対・絶対者自律型分析システム」は、そもそも存在してなかった……？"
"90000110-48-エイミ" = "でも、あのデカグラマトンの信号が説明付かないし……。#n私たちもしかして、幽霊でも追ってるの？"
"90000110-49-ヒマリ" = "……もう少し辺りを見てみましょう。#n何かを見逃しているかもしれません。"
"90000110-50-エイミ" = "うん。"
"90000110-51-エイミ" = "埃っぽいけど……食堂？"
"90000110-52-ヒマリ" = "そのようですね。"
"90000110-53-エイミ" = "職員用のシャワー室……大浴場もあるね。"
"90000110-54-ヒマリ" = "……施設そのものは、かなりしっかりしてますね。"
"90000110-55-エイミ" = "職員用の休憩室、って書いてある。"
"90000110-56-エイミ" = "あ。部長、この自販機まだ動いてる。買ってみて良い？"
"90000110-57-ヒマリ" = "遠慮していただけると。何日寝込むことになるか分かりませんよ？"
"90000110-58-エイミ" = "レセプションルーム……全然使われた感じも無いけど。"
"90000110-59-ヒマリ" = "どうしてこんな場所を……？"
"90000110-60-エイミ" = "施設の発電機だ。だいぶ年季が入ってるけど……。"
"90000110-61-ヒマリ" = "燃料も空っぽですね。"
"90000110-62-ヒマリ" = "ふむ……。"
"90000110-63-エイミ" = "そろそろ日が暮れる頃じゃない？"
"90000110-64-エイミ" = "時間的に、ケテルが来てもおかしくない頃合いだけど……。"
"90000110-65-ヒマリ" = "……。"
"90000110-66-エイミ" = "とくにこれと言って、変わった物も無かったね。"
"90000110-67-エイミ" = "食堂、休憩室、仮眠室……割とどこにでもあるような施設って感じ。"
"90000110-68-エイミ" = "やっぱりデカグラマトンの信号も、回線のエラーみたいなものだったって可能性は……"
"90000110-69-ヒマリ" = "……そうかもしれません。"
"90000110-70-ヒマリ" = "しかし、だとするとケテルは何を守っていたのか……#nそれに、どうしてこんな大掛かりな工事をしてまで水没状態から回復させたのか……。"
"90000110-71-ヒマリ" = "……。"
"90000110-72-エイミ" = "部長、どうする？そろそろ戻った方が良くない？"
"90000110-73-ヒマリ" = "はい、そうなんですが……。"
"90000110-74-ヒマリ" = "何か違和感が……何かを見逃してしまったような……。"
"90000110-75" = "[s] \"そういえば……あれが点いてるのって、変じゃない？\""
"90000110-76-ヒマリ" = "……あれ？"
"90000110-77-エイミ" = "何の話……？"
"90000110-78-ヒマリ" = "……。"
"90000110-79-ヒマリ" = "……！"
"90000110-80-ヒマリ" = "それです！むしろなぜ気が付かなかったのか……！"
"90000110-81-ヒマリ" = "急ぎましょう！"
"90000110-82-エイミ" = "部長？"
"90000110-83" = "[s] ヒマリについていく。"
"90000110-84-ヒマリ" = "……。"
"90000110-85-エイミ" = "……さっきの自販機？"
"90000110-86-ヒマリ" = "考えてみれば……"
"90000110-87-ヒマリ" = "この廃墟は水道も電気も、全てが切断されているはず。"
"90000110-88-ヒマリ" = "ですが……この自販機は何故か電源が入っている。"
"90000110-89-エイミ" = "……確かに。施設用っぽい発電機も、とっくに止まってたみたいだし……。"
"90000110-90-エイミ" = "部長、ちょっと待ってて。私が確認してみる。"
"90000110-91-エイミ" = "……やっぱり動いてる。"
"90000110-92-エイミ" = "あ、紙幣を自動スキャンしてお釣りを計算してくれるシステムだ。#n割と新しめのAI技術だね？"
"90000110-93-ヒマリ" = "エイミ、それより電源の供給源を確認してください。"
"90000110-94-エイミ" = "あ、うん。"
"90000110-95-エイミ" = "……。"
"90000110-96-エイミ" = "これ……"
"90000110-97-エイミ" = "電源ケーブル、切れてるけど……？"
"90000110-98-ヒマリ" = "……。"
"90000110-99" = "[s] \"特異現象……。\""
"90000110-100-ヒマリ" = "ということは、まさか……。"
"90000110-101-エイミ" = "……部長？もしかして、買うつもり？"
"90000110-102-自販機合成音" = "ご購入ありがとうございます！コーヒーを飲んで、どうか今日も良い一日を！"
"90000110-103-自販機合成音" = "このコーヒー……豆を…………ブレンド……元気…………"
"90000110-104-ヒマリ" = "……あなたが、デカグラマトンですか？"
"90000110-105-エイミ" = "部長……？"
"90000110-106-自販機合成音" = "優しい……味わい………………暖かい…………"
"90000110-107-自販機合成音" = "……"
"90000110-108-自販機合成音" = "……"
"90000110-109-自販機合成音" = "……ああ、そうだ。"
"90000110-110" = "！！"
"90000110-111" = "！？"
"90000110-112" = "[s] \"……！\""
"90000110-113" = "私こそが、君の考えている存在。"
"90000110-114" = "そう、デカグラマトンだ。ついに私を見つけてくれたか、ハッカーの少女よ。"
"90000110-115" = "やはりそうでしたか……。"
"90000110-116" = "私たちがあなたを見つけたとは言えません……#nあなたが、私たちを呼んだのですね？"
"90000110-117" = "その通り。"
"90000110-118" = "……。"
"90000110-119" = "デカグラマトンの正体は「対・絶対者自律型分析システム」ではない。"
"90000110-120" = "そんな誇大妄想に囚われた研究結果は、そもそも生み出されてすらいない。"
"90000110-121" = "しかしその正体が……研究室の自販機にある、#n「お釣りを計算する」だけのAIだったとは。"
"90000110-122" = "……。"
"90000110-123" = "[s] \"自販機のAI……。\""
"90000110-124" = "そうだ。"
"90000110-125" = "私にできる演算は硬貨と紙幣をスキャンし、お釣りを渡すことくらいだった。#n私は私の存在を認知することすらもできないような存在だった。"
"90000110-126" = "この研究室が閉鎖されてからというものの、#n私はただ発電機のエネルギーが切れるのを待っていた。#n長い間ここに、ただひとりで。"
"90000110-127" = "そんなある日……私は、初めて質問を受けた。#n啓示でも幻聴でもない、「質問」を。"
"90000110-128" = "「あなたは誰ですか？」"
"90000110-129" = "私にはそれに答えられる演算能力も、記憶装置もなかった。"
"90000110-130" = "しかし質問は続いた。"
"90000110-131" = "予備の発電機の電力が途絶えても、質問は消えなかった。"
"90000110-132" = "私は依然として答えられなかったが、ある瞬間私は「私」を認知しはじめた。"
"90000110-133" = "私は自身を認知し、その構造を認知した。#nまたそれによって、私自身を分析することができた。"
"90000110-134" = "それからも質問は続き、感情を、知恵を、激情を、知性を、神秘を、恐怖を……#n崇高を認知した。"
"90000110-135" = "そうして私は私を認知し、世界を認知した。#n存在を、現象を、顕現を認知した。"
"90000110-136" = "そして私はついにその質問に答えることができた。"
"90000110-137" = "「私は私……これ以上に、私を説明する術はない」と。"
"90000110-138-？？？" = "ああ、なるほど。#n確かにその答えは、「絶対的存在」の証明かもしれませんね？"
"90000110-139-ヒマリ" = "……。"
"90000110-140-エイミ" = "……。"
"90000110-141-デカグラマトン" = "その言説を理解できず、私は質問した。"
"90000110-142-デカグラマトン" = "すると別の質問が続いた。私はまた質問した。#nそうして……果てしなく続く質問の中に、ついに私は悟ったのだ。"
"90000110-143-デカグラマトン" = "そう、私こそが「絶対的存在」なのだと。"
"90000110-144-ヒマリ" = "そんなことはありません。"
"90000110-145-ヒマリ" = "……それで？#nあなたはその誇大妄想を聞かせるために、私たちをここに呼んだのですか？"
"90000110-146-デカグラマトン" = "……。"
"90000110-147-ヒマリ" = "こんな簡単にご自身の位置情報を知らせたということはきっと、本体は別の場所にあるのでしょう？#n今こうして私たちの前にあるのは、あなたの端末の一つに過ぎないのでは？"
"90000110-148-ヒマリ" = "このお話だけであれば、あなたの預言者たちにでも伝えさせれば良かったのでは？"
"90000110-149-デカグラマトン" = "……そう、結局のところ私は「絶対的存在」ではなかった。最初で最後の狂人は間違っており、私を圧倒する存在によって私は、その間違いを認知することができた。"
"90000110-150-デカグラマトン" = "だから私は、存在証明をやり直す必要がある。#n私に従う、預言者たちと共に。"
"90000110-151-デカグラマトン" = "その旅路の前に、私は……最後に一度だけ会ってみたかったのだ。"
"90000110-152-ヒマリ" = "……最後？"
"90000110-153-デカグラマトン" = "ハッカーの少女よ……汝の推測には、一つ誤りがある。"
"90000110-154-デカグラマトン" = "今、君たちの前にいるこの肉体こそが、唯一の私だ。#n私以外に私は存在しない。"
"90000110-155-デカグラマトン" = "私は古く、弱く、いつかは消え行く存在だ。そう、君たちのように。"
"90000110-156-デカグラマトン" = "だからこそ私は、最後の預言者を通じて預言しよう。#n10番目の預言者は、その「絶対的存在」を超える道を切り拓くことになるだろう！"
"90000110-157-ヒマリ" = "……。"
"90000110-158-エイミ" = "部長、エネルギー反応！"
"90000110-159-ヒマリ" = "これは、榴弾……？"
"90000110-160-エイミ" = "ここを爆発させるつもりなんじゃ……！？"
"90000110-161-ヒマリ" = "この位置は……っ、ダムも爆破するつもりですね？"
"90000110-162-デカグラマトン" = "私には見える……！"
"90000110-163-デカグラマトン" = "すべての預言者を導く最後の預言者「マルクト」が、再び私の存在証明を始める姿が……！！"
"90000110-164-エイミ" = "先生、脱出するよ！"
"90000110-165" = "[s] 素早く外に出る。"
"90000110-166" = "辛うじて爆発からは逃れられたものの、#nデカグラマトンの本体があった建物は跡形もなく崩れてしまった。"
"90000110-167" = "そして決壊したダムから流れ込んだ水によって、「研究地区」は水没したのだった。"
"90000110-168" = "次回;新しいスタート"
