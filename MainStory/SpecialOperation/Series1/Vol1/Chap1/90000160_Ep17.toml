[translation]
"90000160-1" = "第17話;5番目の預言者"
"90000160-2-エイミ" = "……無理。もうなんの痕跡も残ってない。"
"90000160-3-トキ" = "文字通り、跡形もなく消えてしまったのですね。"
"90000160-4-ヒマリ" = "……。"
"90000160-5" = "[s] \"一体、何者なんだろう？\""
"90000160-6-ヒマリ" = "……デカグラマトンの意志を受け継ぐエンジニアであり、科学者であり、預言者の協力者……。今はそう思うしかありません。"
"90000160-7-ヒマリ" = "デカグラマトンが死んでも、意志はまだ生きている、と。"
"90000160-8-ヒマリ" = "何故私たちを呼び寄せたのかは分かりませんが……「お姉様」と呼んでいた存在を完成させるのに私たちが必要だったのではないかと……。"
"90000160-9-ヒマリ" = "……一体、彼女たちは何を求めていたのでしょう……。"
"90000160-10-ヒマリ" = "無名の司祭と名もなき神々の技術が反映されている「アビ・エシュフ」なのか……"
"90000160-11-ヒマリ" = "それとも連邦生徒会長の残したオーパーツ、「シッテムの箱」か……"
"90000160-12" = "[s] \"……。\""
"90000160-13-ヒマリ" = "もしくは、天才清楚系病弱美少女ハッカーである私、[ruby=あけぼし]明星[/ruby]ヒマリの恐るべき「全知」の力かもしれません……"
"90000160-14-エイミ" = "（それは違うと思うけど）"
"90000160-15-トキ" = "ところで、彼女たちが言っていた「お姉様」とは、誰のことを指していたのでしょうか。"
"90000160-16-ヒマリ" = "そうですね。それを含めて分析が必要かと……"
"90000160-17-エイミ" = "部長、覚えてる？"
"90000160-18-ヒマリ" = "はい？"
"90000160-19-エイミ" = "以前、廃墟の研究地区でデカグラマトンが言った最期の言葉。"
"90000160-20-デカグラマトン" = "私には見える……！"
"90000160-21-デカグラマトン" = "すべての預言者を導く最後の預言者「マルクト」が、再び私の存在証明を始める姿が……！！"
"90000160-22-ヒマリ" = "マルクト……。"
"90000160-23-エイミ" = "……。"
"90000160-24-トキ" = "……。"
"90000160-25-ヒマリ" = "……生命の樹の「最後のセフィラ」……でしたね。"
"90000160-26-ヒマリ" = "……これまでとは全く異なる、新たな脅威が訪れているのかもしれません。"
"90000160-27-エイミ" = "……私たちは何をすればいい？"
"90000160-28-ヒマリ" = "備えましょう。"
"90000160-29-ヒマリ" = "デカグラマトンの意志を受け継ぐ存在……アイン、ソフ、オウル。#n彼女たちとの戦いに。"
"90000160-30" = "[s] \"……。\""
"90000160-31-ヒマリ" = "おそらくそれは……そう遠くない未来にはじまります。"
"90000160-32-ヒマリ" = "生命の樹に記録された10の預言者を敵とする、長い戦いとなることでしょう。"
"90000160-33-トキ" = "預言者全員を……"
"90000160-34-ヒマリ" = "はい。ですので、今から万全を期して対策の準備にかかります。"
"90000160-35-ヒマリ" = "……まずは、引き続き氷海で情報収集を。#n5番目の預言者、ゲブラの情報をできる限り確保しなければなりません。"
"90000160-36-エイミ" = "うん、賛成。ここ、涼しくて気に入ってるんだ。#nバカンス気分でゆっくりしていこう。"
"90000160-37-ヒマリ" = "いえ、それは違いますよエイミ。こんな寒いところではバカンスになりません。"
"90000160-38-トキ" = "バカンス、良いと思います。こういう時こそ、余裕を失わない姿勢が大切です。"
"90000160-39-エイミ" = "ほら、トキもこう言ってるし。"
"90000160-40-ヒマリ" = "……先生? "
"90000160-41" = "[s] \"まあ、気を張っても仕方ないし、のんびりやっていこうか。\""
"90000160-42-ヒマリ" = "はあ……先生まで。"
"90000160-43-ヒマリ" = "……分かりました。私も防寒対策を強化します。#n酷寒地のバカンスを楽しむとしましょうか。"
"90000160-44-エイミ" = "うん、それじゃあ出発～"
