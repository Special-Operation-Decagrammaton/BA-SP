[translation]
"90000130-1" = "第14話;信号"
"90000130-2" = "特異現象捜査部・部室"
"90000130-3-エイミ" = "先生、急に呼び出してごめん。"
"90000130-4-エイミ" = "来てくれてありがとう。"
"90000130-5" = "[s] \"大丈夫。一体何があったの？\""
"90000130-6-エイミ" = "その……怒らないで聞いてほしいんだけど……"
"90000130-7" = "[s] \"……うん？\""
"90000130-8-エイミ" = "まず、先生を呼んだのは私じゃなくて――"
"90000130-9-トキ" = "緊急招集プロトコル、異常なし。"
"90000130-10" = "[s] \"え、えっと……？\""
"90000130-11-トキ" = "緊急事態が発生した際、どの程度の時間で先生がいらっしゃるかは、#n作戦遂行において極めて重要です。責任者ですので。"
"90000130-12" = "[ns] \"……トキ？\""
"90000130-13-トキ" = "はい。[ruby=あすま]飛鳥馬[/ruby]トキです。私たちの仲ですので、名乗りは省略させていただければと。ちなみに「私たちの仲」とは、非常に親密な関係を意味します。"
"90000130-14-トキ" = "先生は無事時間内に到着――そして、緊急招集プロトコルが正常に動作することを確認しました。"
"90000130-15" = "[s] \"ええと……つまり……。\""
"90000130-16-トキ" = "はい、特に何かが起きたわけではありません。"
"90000130-17-トキ" = "強いて言えば……C&Cの任務で呼ばれることもなく、#nゲーム開発部の件も一段落しているため、無期限の待機状態……。"
"90000130-18-トキ" = "つまり、退屈です。"
"90000130-19" = "[ns] \"それで、暇つぶしに非常ベルを押してみた、と……？\""
"90000130-20-トキ" = "その通りです。ピース、ピース。"
"90000130-21-エイミ" = "トキ、それは流石にやめよう。失礼だよ。"
"90000130-22-トキ" = "そうなのですね……以降、気をつけます。#nとにかく遊んでください、先生。暇です。"
"90000130-23-エイミ" = "話聞いてる？"
"90000130-24" = "[s1] \"こういうキャラだったっけ、トキ……。\"\n[s2] \"エイミが先輩になってる……。\""
"90000130-25-ヒマリ" = "おや、賑やかですね。"
"90000130-26-エイミ" = "部長。"
"90000130-27-トキ" = "ヒマリ部長、おかえりなさい。"
"90000130-28-ヒマリ" = "先生と……トキ……？#n何かありましたか？"
"90000130-29-エイミ" = "何かあったわけでは、ないんだけど……"
"90000130-30-エイミ" = "……。"
"90000130-31-ヒマリ" = "あら、これは……？"
"90000130-32-エイミ" = "トキ……？"
"90000130-33-トキ" = "断じて違います。私は無闇に非常ベルを押したりなどしません。"
"90000130-34-エイミ" = "それは後で話を聞くとして……"
"90000130-35-エイミ" = "部長……この信号……"
"90000130-36-ヒマリ" = "ええ……まさか再び現れるだなんて……"
"90000130-37-トキ" = "信号？"
"90000130-38-エイミ" = "……うん。#n前にもあったものなんだけど……もう二度と現れないと思ってたのに……"
"90000130-39-トキ" = "あの信号とは一体……？"
"90000130-40-ヒマリ" = "あれは――デカグラマトンの信号です。"
"90000130-41-トキ" = "デカグラマトン……本体は廃墟水没地区の水面下に沈んだと聞きましたが。"
"90000130-42-ヒマリ" = "その通りです。朽ちた[ruby=肉体]自販機[/ruby]であの爆発に耐え抜いたとは思えません。アレが生存している確率は、ゼロと言ってもよいでしょう。"
"90000130-43-ヒマリ" = "……だというのに。"
"90000130-44-エイミ" = "信号の発信源、特定できたよ。"
"90000130-45-トキ" = "この座標は……海をも凍らせる極寒の地、「氷海地域」ですね。"
"90000130-46-トキ" = "自治区も存在しない破棄された地域のはずですが……#nこんなところにデカグラマトンが……？"
"90000130-47-ヒマリ" = "……確認します。"
"90000130-48-ヒマリ" = "……やはり。#n――この信号がデカグラマトンの可能性は低いです。"
"90000130-49-ヒマリ" = "一見似ていますが、真似たものに過ぎません。"
"90000130-50-エイミ" = "となると……。"
"90000130-51-トキ" = "これは別の預言者……なのでしょうか。"
"90000130-52-トキ" = "今までに特異現象捜査部が見つけた預言者は、ホドを含め4つ……#nあと6つは存在すると伺っています。"
"90000130-53-ヒマリ" = "ええ……5番目の預言者である可能性も、#nデカグラマトンを模した新しい敵である可能性もあります。"
"90000130-54-ヒマリ" = "どちらにせよ、直接確かめるまでは断言できません。"
"90000130-55-ヒマリ" = "ですが、1つだけ明確なのは――アレの正体が何であれ……。"
"90000130-56-トキ" = "……。"
"90000130-57-ヒマリ" = "私たちを呼んでいる――ということです。"
"90000130-58" = "次回;氷河（１）"
