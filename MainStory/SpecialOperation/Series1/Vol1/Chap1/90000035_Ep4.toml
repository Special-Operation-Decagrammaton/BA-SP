[translation]
"90000035-1" = "PMCのデータベースを分析中……"
"90000035-2-エイミ" = "部長、何か使えそうなデータあった？"
"90000035-3-ヒマリ" = "……いえ、見事に空っぽですね。"
"90000035-4-エイミ" = "空っぽ？"
"90000035-5-ヒマリ" = "はい、ほとんど文字通りに。データベース内の全ての情報が暗号化されて、本社に送信した履歴だけがあります。"
"90000035-6-エイミ" = "セキュリティのためかな。でも、何でそんなことを？"
"90000035-7-ヒマリ" = "そうですね、かなり怪しいです。民間軍事会社がここまでセキュリティに気を遣うなんて……。"
"90000035-8-ヒマリ" = "……目標を、本社の方に変えましょうか。"
"90000035-9-エイミ" = "そっちは侵入しにくい、みたいなこと言ってなかった？"
"90000035-10-ヒマリ" = "そうですね、多少難易度は変わるでしょう。"
"90000035-11-ヒマリ" = "……「多少」の難易度ごとき、この美少女ハッカーにとっては無意味ですが。"
"90000035-12-エイミ" = "さすが部長。「美少女」は関係ないと思うけど。"
"90000035-13-ヒマリ" = "関係ありますとも、「美少女」は「天才」と相性が良いのです。"
"90000035-14-ヒマリ" = "さて、データの中身を見せていただくとしましょうか。"
"90000035-15-ヒマリ" = "……なるほど。"
"90000035-16-エイミ" = "あったね。"
"90000035-17-ヒマリ" = "はい……ビナーの戦闘記録、それもかなりの数の。"
"90000035-18-ヒマリ" = "PMCは発掘区域で、ビナーと戦っていた……いえ、このパターンは……"
"90000035-19-エイミ" = "ビナーが発掘区域に近づかないよう、PMCが防衛してた……みたいな？"
"90000035-20-ヒマリ" = "そうですね、一体これは……。"
"90000035-21-ヒマリ" = "……「発掘区域」そのものに関するデータ、やたらと厳重に守られてますね。初めて見るタイプのファイアウォール……"
"90000035-22-ヒマリ" = "新しい技術でしょうか、生意気ですね……楽しくなってきてしまいます。"
"90000035-23-ヒマリ" = "パターンそのものはワンタイムパスワード……乱数アルゴリズムですか。物理的に時間がかかるタイプですね。"
"90000035-24-ヒマリ" = "時間を稼ぎつつパターンを変える、と……なるほど。"
"90000035-25-ヒマリ" = "まあ4時間くらいで何とかなりそうです。"
"90000035-26-エイミ" = "……部長、とりあえずビナーを探さない？"
"90000035-27-ヒマリ" = "ですが、美少女ハッカー魂がですね……"
"90000035-28-エイミ" = "そっちは今の目標じゃないでしょ？「美少女」関係無いし。"
"90000035-29-ヒマリ" = "……。"
"90000035-30" = "[s]（しゅんってなっちゃった……）"
"90000035-31-ヒマリ" = "……そうですね。今はデカグラマトンの預言者を追いかけることが最優先。これは後日に……ううん……。"
"90000035-32-エイミ" = "（……往生際が悪いなぁ）"
"90000035-33-ヒマリ" = "分かりましたから、そんな目で見ないでください。仕方ないですねぇ。"
"90000035-34-エイミ" = "それはこっちの台詞。"
"90000035-35" = "[ns]（不思議な関係性だ……）"
"90000035-36" = "次回;「データ収集（４）ビナー」"
