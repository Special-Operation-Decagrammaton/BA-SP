[translation]
"90102050-1" = "第5話;末端と幹部"
"90102050-5-クルミ" = "少々よろしいですか？#nハイランダー鉄道学園の者です。"
"90102050-6-乗客" = "わ、私はちゃんと切符持ってますけど！？"
"90102050-7-クルミ" = "あ、いや、検札しに来たわけじゃなくて……。"
"90102050-9-オトギ" = "ご安心ください。#n私たちはこの駅の駅員ではなく、ハイランダー鉄道学園[ruby=中央管制センター]のCCC所[/ruby]属ですから。"
"90102050-10-オトギ" = "今は顧客満足度調査を行っているところでして。"
"90102050-11-オトギ" = "改善のため、積極的に反映予定ですので忌憚のないご意見をお聞かせください！"
"90102050-12-乗客" = "意見……。"
"90102050-13-乗客" = "正直に答えて……線路に投げ込んだりしませんよね？"
"90102050-14-クルミ" = "するわけないでしょ！？"
"90102050-15-オトギ" = "（ハイランダーの生徒って、なんでこんなに乗客から警戒されてるんだろう……）"
"90102050-16-乗客" = "それじゃあ、乗務員の方についてなんですけど……少し不親切かなって。"
"90102050-17-乗客" = "全員じゃないですけどね。#n古い路線とかだと、乗客を矯正局の囚人みたいに扱うんです。"
"90102050-18-乗客" = "少しでも怪しいところがあると、すぐ銃を抜いてくるんですよ？"
"90102050-19-クルミ" = "それは困りますね……。"
"90102050-20-オトギ" = "ご不快な思いをさせてしまい申し訳ございません。"
"90102050-21-オトギ" = "再発防止のため、具体的な内容をお聞かせいただけますでしょうか？"
"90102050-22-乗客" = "最近だと先週ですかね。"
"90102050-23-乗客" = "残業で帰りが遅くなって、終電ギリギリでホームに着いたんですよ。"
"90102050-24-乗客" = "そしたら目の前でドアが閉まり始めたんで。"
"90102050-25-乗客" = "とっさに傘を突っ込んだら、「列車から離れろ」って駅員が銃向けてきたんですよ！？"
"90102050-26-乗客" = "ちょっとドア開けてくれりゃいいのにケチ臭い――"
"90102050-30-乗客" = "うわっ！？#n正直に言ってもいいって言ったじゃないですか！"
"90102050-31-クルミ" = "失礼しました。ついうっかり。"
"90102050-32-オトギ" = "お気持ちは分かりますが……。"
"90102050-33-オトギ" = "故障や事故の原因になりますので、ドアに傘を挟む行為は控えてくださいね。"
"90102050-34-乗客" = "ちっ……融通が利かないな。"
"90102050-38-乗客" = "なっ、なんでもないです！"
"90102050-39-オトギ" = "他にはどうですか？"
"90102050-40-オトギ" = "たとえば、時刻表にない列車を見たとか……。"
"90102050-41-乗客" = "いえ、そういうことは。#nハイランダーは時間だけはきっちりしてるので、そこに不満はないですね。"
"90102050-42-乗客" = "とんでもない速度で暴走してるのはたまに見かけますが。"
"90102050-43-オトギ" = "なるほど……調査にご協力いただきありがとうございました。"
"90102050-44-オトギ" = "お礼といっては何ですが……安全ピンを抜いた手榴弾を差し上げます！"
"90102050-50-乗客" = "ちょっ、ちょっちょっちょっ、どうしろっていうんですか！"
"90102050-51-乗客" = "こんなの急に渡されても――"
"90102050-52-オトギ" = "安全レバーを離したら爆発するので、しっかり握っててくださいね？"
"90102050-57-乗客" = "ハイランダーの幹部にまともな奴はいないって話は本当なんだな……。"
"90102050-58-乗客" = "こんなことなら正直に答えなきゃよかった！"
"90102050-60" = "（その後もオトギとクルミは市民から聞き込みを続けた……）"
"90102050-64-ユキノ" = "こちらFOX1。#nFOX3、FOX4。何か新しい情報は掴めたか？"
"90102050-65-クルミ" = "こちらFOX3。ぜ～んぜん。収穫なし。"
"90102050-66-クルミ" = "ネットの情報と大差ないし……何より、例の列車を見たって人が1人もいない。"
"90102050-67-クルミ" = "ハイランダーのサービスに文句言う人ばっかり。"
"90102050-68-オトギ" = "乗客側の不満も、自業自得っぽいの多いけどね。"
"90102050-69-オトギ" = "無賃乗車とか、車内で怪しい物売りを始めるやつとか……。"
"90102050-70-オトギ" = "なんで列車って、他の交通機関に比べて変な人が集まりやすいんだろ。"
"90102050-71-ニコ" = "それだけ利用者が多いってことじゃないかな。"
"90102050-72-ニコ" = "こちらFOX2。#nFOX3とFOX4の聞き込み中に、事件当時に切れてた監視カメラを調べてみたよ。"
"90102050-73-ニコ" = "外部からハッキングできる構造じゃなかったし、#n回路の一部が老朽化してる以外に異常は見つからなかった。"
"90102050-74-ニコ" = "やっぱり、あの時間だけ録画されてなかったのは偶然だったのかも。"
"90102050-75-ユキノ" = "たしかに、偶然の可能性も排除はできない。#nとはいえ、状況が犯人にとって都合よく働きすぎていることは考慮すべきだ。"
"90102050-76-ユキノ" = "……これ以上は駅員に怪しまれる。そろそろ駅務室に向かえ。"
"90102050-77-ユキノ" = "FOX3、FOX4。#n正体を悟られないよう注意しつつ、引き続き対象への聴取を続行せよ。"
"90102050-78-オトギ＆クルミ" = "了解！"
"90102050-80" = "川西駅・駅務室"
"90102050-82-駅長" = "よ、ようこそお越しくださいました！"
"90102050-83-駅長" = "本日はどのようなご用件で……？"
"90102050-87-オトギ" = "もう、そんな緊張しなくていいって。肩の力抜いて楽にして。"
"90102050-88-オトギ" = "さっきの子にも言ったけど、通りがかりに寄っただけだから。"
"90102050-89-クルミ" = "そうそう。お困りごととか確認しておこうかなって。"
"90102050-90-駅長" = "そ、そうでしたか……。"
"90102050-91-駅長" = "とりあえずお掛けください。"
"90102050-92-駅長" = "いらっしゃると事前に分かっていれば、お茶菓子を用意したのですが……#nお茶も、安物のティーバッグしかなくて申し訳ありません。"
"90102050-93-オトギ" = "これで十分だよ。"
"90102050-94-オトギ" = "甘いもの食べる気分じゃないんだよね。"
"90102050-95-クルミ" = "お茶菓子が無くても話はできるし。"
"90102050-96-駅長" = "……。"
"90102050-97-オトギ" = "じゃ、本題に入ろっか。"
"90102050-98-オトギ" = "えっと、この川西駅を通る列車の本数は……#nうわ、全路線合わせたら1日にほぼ1000本じゃん！"
"90102050-99-オトギ" = "……え、1分に1本くらいのペースってこと？"
"90102050-100-オトギ" = "それをさばきながら駅の管理やら何やらまでこなすって……大変だねぇ。#n毎日お疲れさま。"
"90102050-101-駅長" = "も、もったいないお言葉です……。"
"90102050-102-クルミ" = "でもさ、こんなに忙しいと目が届かないこともあるわよね？"
"90102050-103-駅長" = "え？それはどういう……。"
"90102050-104-クルミ" = "目が回るほど忙しいのに、人員配置は最低限。"
"90102050-105-クルミ" = "となると、時刻表にない列車が通過しても気づけない時はあるんじゃない？#nどうかな。"
"90102050-106-駅長" = "それはないと思います。#n目視でとなると、たしかに全てのホームを見張ることはできませんが……。"
"90102050-107-駅長" = "列車の運行はすべてシステムで管理されていますから。#n予定にない列車がホームに入ってくるなんてことは絶対に――"
"90102050-108-オトギ" = "いやいや、別に駅員を責めてるわけじゃないって。"
"90102050-109-オトギ" = "忙しいなら忙しいって、正直に言ってくれればいいんだよ。#nもしかしたら上が人員増やしてくれるかもしれないし？"
"90102050-114-駅長" = "……少々よろしいでしょうか。"
"90102050-118-駅長" = "差し支えなければ、お二人の身分証を確認させていただけますか？"
"90102050-119-クルミ" = "急にどうして……？"
"90102050-120-駅長" = "……どうにも妙でして。"
"90102050-121-駅長" = "連絡もなしに現れた時点で違和感はありましたが、#n私の知る幹部の方々とはどこか雰囲気が違います。"
"90102050-122-駅長" = "駅務室に押しかけてきて、お菓子をたかったり雑用を押し付けたりするどころか――"
"90102050-123-駅長" = "あのCCCが現場を心配し始めるなど……どう考えても不自然です。#n「人員は足りている」が決まり文句だったじゃないですか。"
"90102050-124-駅長" = "身分証を学園内ネットワークと照合するだけです。お時間は取らせません。"
"90102050-125-駅長" = "念のための確認ですので、どうかご容赦ください。"
"90102050-126-クルミ" = "こんなことで怪しまれるなんて……。"
"90102050-127-クルミ" = "身分証はあるけど、データベースに照合されたら偽物だって一発でバレるわよ……。"
"90102050-128-クルミ" = "こうなったらプランBに移る？"
"90102050-129-オトギ" = "……いや、ちょっと待って。考えがある。"
"90102050-130-オトギ" = "もちろん協力するよ。"
"90102050-131-オトギ" = "えーっと、身分証どこだっけな～？"
"90102050-136-オトギ" = "そういえば、ホームでお客さんと話したんだけどさ。"
"90102050-137-駅長" = "あ、はい。"
"90102050-138-オトギ" = "乗客がドアに傘を挟んで騒ぎになったって本当？"
"90102050-139-駅長" = "ああ、そんなこともありましたね。#n駅員が引き剥がしたので大事には至りませんでしたが……。"
"90102050-140-オトギ" = "それで？ちゃんと[ruby=・   ・   ・   ・]定刻通り[/ruby]発車できたんだよね？"
"90102050-141-駅長" = "そ、それは……。"
"90102050-142-オトギ" = "まさかとは思うけど、そんな些細なトラブルで遅延したわけじゃないよね？"
"90102050-143-オトギ" = "定時運行は私たちの根幹。お客様の利便性を担保して、車両の運用効率を支えている。#n定刻通り発車できなかったなんて無責任な事態、起きてないよねぇ？"
"90102050-144-オトギ" = "う～ん……一応、その日の記録を確認しないといけないかな。"
"90102050-145-駅長" = "い、いえ、そこまでしていただく必要は……。"
"90102050-146-オトギ" = "どうして？#n駅長の言うとおり、念のために確認するのは大事なことじゃない？"
"90102050-147-オトギ" = "駅長は几帳面みたいだし、当然分かってくれるよね？"
"90102050-152-駅長" = "（はぁ……藪蛇だった……）"
"90102050-153-駅長" = "（この2人……間違いなくCCCの幹部だ……！）"
"90102050-154-駅長" = "（そういえばCCCの幹部には、#nやたら性格の悪いチビのコンビがいるって聞いたことあるけど……）"
"90102050-155-駅長" = "（……まさか、この2人が？）"
"90102050-156-駅長" = "……も、申し訳ありません！#n幹部の方々とは知らず、失礼なお願いをいたしました。"
"90102050-157-駅長" = "身分証は……結構です。"
"90102050-158-オトギ" = "そう？#n面倒なことをしなくて済んで助かったよ～"
"90102050-159-クルミ" = "（はぁ……心臓に悪いわ……）"
"90102050-161-駅長" = "おっしゃる通り、D.U.の鉄道管制は交通室との連携のもと、#nネットワークで管理されています。"
"90102050-162-駅長" = "そのため、予定外の列車が進入することは基本的にありませんが……#n最近、少し気になる噂を耳にしておりまして。"
"90102050-166-駅長" = "拝金のブローカーをご存じでしょうか？#nハイランダー鉄道学園出身の七囚人として有名な人物なのですが。"
"90102050-168-クルミ" = "知ってるに決まってるでしょ！"
"90102050-169-クルミ" = "あいつ捕まえるために、何本列車乗り継いだと思って――"
"90102050-170-駅長" = "え？拝金のブローカーを捕まえたのですか？"
"90102050-171-オトギ" = "ああ、気にしないで。前に[ruby=鉄道安全部]RSD[/ruby]にいた時の話だから。"
"90102050-172-オトギ" = "そんなことより、どうして急に拝金のブローカーが出てくるの？"
"90102050-173-駅長" = "あくまで噂ですが……拝金のブローカーが活動を再開した、と。"
"90102050-174-駅長" = "最近はSNSでも、深夜に見知らぬ列車を見たという投稿がちらほらあるようですね。"
"90102050-175-駅長" = "拝金のブローカーは元CCC幹部なだけあって、列車の管制系統に精通しています。#nそれに運転技術もかなりのものですから。"
"90102050-176-駅長" = "ダイヤの隙間に列車を紛れ込ませて行き先をごまかす手口は、#n拝金のブローカーの常套手段でしたので。"
"90102050-177-クルミ" = "……それだ！"
"90102050-178-駅長" = "はい？"
"90102050-179-オトギ" = "ありがとう。おかげで有力な情報が手に入ったよ。"
"90102050-180-オトギ" = "これで事件の輪郭が見えてきたかも。"
"90102050-181-クルミ" = "FOX4――いや、オトギ。急いで戻って共有しよう。"
"90102050-182-駅長" = "お役に立てたようで何よりですが……事件、とは？"
"90102050-183-駅長" = "深夜に現れる謎の列車というのは……実在するんですか……？"
"90102050-184-オトギ" = "あ、念のため。"
"90102050-185-オトギ" = "今日のこと。他の駅員もだけど、CCCの別の幹部にも絶対話しちゃダメだからね？"
"90102050-186-オトギ" = "アビドス砂漠の近くにある無人駅で勤務したくはないでしょ？"
"90102050-187-駅長" = "も、もちろんですとも！決して口外いたしません！"
"90102050-188-駅長" = "お帰りはお気をつけて……。"
"90102050-195-駅長" = "はぁぁぁ……。#nほんっとCCCの幹部って――"
"90102050-196-駅長" = "会うたびロクなことがない！"
"90102050-198" = "次回;思わぬ再会"
