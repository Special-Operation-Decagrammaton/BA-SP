[translation]
"90102030-1" = "第3話;存在しえない列車"
"90102030-2-モモカ" = "だから、それはあり得ないって言ってるの！"
"90102030-7-連邦生徒会長" = "モモカ、落ち着いてください。"
"90102030-8-連邦生徒会長" = "理解できない点は私にもあります。#nですが、複数の目撃証言があるのも事実です。"
"90102030-9-連邦生徒会長" = "だからこそ[ruby=ゆらき]由良木[/ruby]モモカ――皆が信頼する優秀な交通室長の意見をもとに、#n市民を説得しようとしているのです。"
"90102030-10-モモカ" = "う……。"
"90102030-11-連邦生徒会長" = "もう一度、具体的に説明していただけますか？"
"90102030-12-連邦生徒会長" = "失踪した生徒が乗りこんだとされる列車は、なぜその時刻に存在しえないのですか？"
"90102030-13-モモカ" = "しょうがないなぁ……。"
"90102030-14-モモカ" = "報告書の内容によると、先週金曜日の午後9時7分、#n川西駅4番線に定刻通りの急行列車が入ってきた。"
"90102030-15-モモカ" = "その直後、原因不明の障害が発生して3分間監視カメラが停止。#n証言を信じるなら、ここで問題の列車が入ってきてる。"
"90102030-16-モモカ" = "で、9時10分に監視カメラが復旧したら、次の各駅停車が駅に停まってた。だよね？"
"90102030-17-連邦生徒会長" = "その通りです。"
"90102030-18-モモカ" = "連邦生徒会長はさ、列車が駅にどれくらい停車するか知ってる？"
"90102030-19-連邦生徒会長" = "そうですね……数十秒ほどではありませんか？"
"90102030-20-モモカ" = "D.U.の路線の平均停車時間は、だいたい30秒から1分。"
"90102030-21-モモカ" = "つまり、カメラが停止してた3分の間に問題の列車が割り込むためには、#n1分未満で線路を切り替えなきゃいけない。"
"90102030-22-モモカ" = "そんな危ない運行をする運転士がいると思う？"
"90102030-23-連邦生徒会長" = "たしかに。#n列車が突然現れて消えるには、あまりにも短すぎる時間ですね。"
"90102030-24-モモカ" = "それに、近くの駅の監視カメラも確認したけど、#n時刻表にない列車が通過した様子は映ってなかった。"
"90102030-25-モモカ" = "だから言ってるわけよ。交通室の管理を外れた列車が運行するなんて不可能だって。#n誰かが列車を丸ごと持ち上げて線路に置いたとかでもない限りね。"
"90102030-26-連邦生徒会長" = "……モモカの話を聞く限り、失踪した生徒が列車に乗って消えた可能性は極めて低いのでしょうね。"
"90102030-27-連邦生徒会長" = "ありがとうございます、参考になりました。#n今のお話をもとに対応策を整理してみます。"
"90102030-28-モモカ" = "本当、こ[ruby=主要7大学園首脳会議]っちはA7関連の[/ruby]仕事で死ぬほど忙しいってのに、#nどうしてこんな実のない怪談が広まるかなぁ？"
"90102030-29-モモカ" = "どうせなら、減らない明太子味のポテチが詰まった袋とか、#nそういうのが流行ればいいのに。"
"90102030-30-連邦生徒会長" = "会期中に大きな問題が起きないことを願うばかりですね。"
"90102030-31-連邦生徒会長" = "では、モモカも頑張ってくれていますし――"
"90102030-32-連邦生徒会長" = "行事が無事に終わったら、トリニティ近くのスイーツ巡りに行きませんか？#nリンには内緒で。"
"90102030-33-モモカ" = "私はもちろん賛成だけど……。"
"90102030-34-モモカ" = "こっそり行って大丈夫？"
"90102030-35-連邦生徒会長" = "リンはこういう集まりを楽しむタイプではないでしょう？#n誘っても断ると思いますよ。"
"90102030-36-モモカ" = "でもリン先輩……最近、なんか寂しそうに見えるんだよね。"
"90102030-37-モモカ" = "仕事に余裕ができたからかな？#nぼんやり座ってることも多いし……なんか私たちを避けてるような感じ。"
"90102030-38-連邦生徒会長" = "そうですか……。"
"90102030-39-連邦生徒会長" = "……それなら、トリニティ限定のオムレツサンドをお土産にしましょうか。"
"90102030-40-連邦生徒会長" = "以前、リンがおいしそうに食べていたのを覚えていますので。"
"90102030-41-モモカ" = "さっすが。連邦生徒会長はリン先輩の好みをよく分かってるね。"
"90102030-42-モモカ" = "まあ、ちゃんと賄賂があれば大丈夫でしょ。ふふ。"
"90102030-46-モモカ" = "――おっと、注文したご飯が届く時間だ。"
"90102030-47-モモカ" = "じゃっ！"
"90102030-55-連邦生徒会長" = "……以上が、交通室長の見解です。"
"90102030-56-連邦生徒会長" = "ユキノさんはどう思いますか？"
"90102030-62-ユキノ" = "交通室長の言う通り、現実味に欠ける実のない怪談ですね。"
"90102030-63-ユキノ" = "失踪事件の捜査を妨害するために誰かが流したデマだ……と、考えたはずです。#n以前の私なら。"
"90102030-64-ユキノ" = "ですが――"
"90102030-72-ユキノ" = "今は、噂がただの噂で終わらないことを知っていますから。"
"90102030-73-連邦生徒会長" = "ええ。#n怪物による、非現実的な手段を用いた襲撃が発生していることも、また事実です。"
"90102030-74-連邦生徒会長" = "最初は実体のない噂に過ぎなくとも、市民が真剣に受け止めることで……#n怪談は現実のものとなりうる。"
"90102030-75-連邦生徒会長" = "特に列車は、1日の間で非常に多くの市民が利用します。#n事故が起きた場合、その被害は計り知れません。"
"90102030-76-ユキノ" = "……駅構内のような密閉空間なら、なおさらです。"
"90102030-81-連邦生徒会長" = "ユキノ小隊長？何か気になることでも？"
"90102030-82-ユキノ" = "いえ。昔のことを思い出しただけです。"
"90102030-83-ユキノ" = "ところで、調査に先立って伺いたいことがあります。#n本件はD.U.で発生した事件。本来はヴァルキューレ公安局が担当のはず。"
"90102030-84-ユキノ" = "それでも私たちに追加調査を命じられた理由は……#nSNSで話題になっているからでしょうか？"
"90102030-85-連邦生徒会長" = "それもありますが、最大の問題は[ruby=・   ・   ・   ・]線路上で[/ruby]発生した事件だという点です。"
"90102030-86-連邦生徒会長" = "ご存じの通り、ハイランダー鉄道学園に他の学園のような自治区は存在しません。#n代わりに、各学園を結ぶ線路と列車については独自の運営権限を持っています。"
"90102030-87-連邦生徒会長" = "そのため、ハイランダー[ruby=Railway Safety Department]の鉄道安全部―[/ruby]―通称RSDは、#n伝統的にヴァルキューレと折り合いが悪いのです。"
"90102030-88-連邦生徒会長" = "交通室も認めていない状況で、ヴァルキューレの生徒を投入することはできません。"
"90102030-89-ユキノ" = "学園間の利害関係が絡み、風紀組織との連携が期待できない状況……ですか。"
"90102030-90-ユキノ" = "なじみ深いですね。"
"90102030-91-連邦生徒会長" = "はい。ですから今回の事件も――"
"90102030-97-ユキノ" = "――私たちSRTが担当することになりました。"
"90102030-98" = "[s1] \"そんなことが……。\"\n[s2] \"今回の事件も謎が多いね……。\""
"90102030-101-クルミ" = "SNSの情報だけじゃ限界があるから、現場で情報を集めないと。"
"90102030-102-クルミ" = "問題の列車が本当に存在するのかすらはっきりしてない状況だし。"
"90102030-103-オトギ" = "また聞き込みか～"
"90102030-104-オトギ" = "戦闘よりはずっとマシだけど、聞き込みもけっこう疲れるんだよねぇ。#nほら、私、内向的だから。"
"90102030-105-クルミ" = "あんたが内向的なら、外向的な人はどうなっちゃうのよ……。"
"90102030-110" = "[ns3] \"じゃあ今回もニコの出番かな？\"\n[ns4] \"「FOX EATS」の出番だね！\""
"90102030-113-ニコ" = "あ、そのことなのですが……。"
"90102030-114-ニコ" = "残念ながら、「FOX EATS」はしばらく休業です。"
"90102030-115" = "[s] \"どうして！？\""
"90102030-116-クルミ" = "ニコ、SNSでちょっとした有名人になっちゃったのよ。"
"90102030-117-クルミ" = "FOX EATSが本当に存在するサービスなのか疑ってる生徒もちらほらいて……。"
"90102030-118-ニコ" = "目立つ行動はしばらく避けたほうが良さそうなので。"
"90102030-119-ニコ" = "今回の作戦では後方支援を担当することになりました。"
"90102030-120" = "[s5] \"ニコのアルバイト衣装はお預けかぁ……。\"\n[s6] \"それなら、今回はどうするの？\""
"90102030-121-ニコ" = "あ……先生がお望みでしたら、シャーレでは時々……。"
"90102030-122-クルミ" = "なに言ってるの！？"
"90102030-123-オトギ" = "はいはい、冗談はそこまでにして。"
"90102030-125-オトギ" = "「木を隠すなら森の中」って言うでしょ？"
"90102030-126-オトギ" = "その言葉通り、列車が行き交うホームで身分を隠したいなら――"
"90102030-127-オトギ" = "ハイランダーの生徒に変装するのが一番だよ！"
"90102030-129" = "次回;抜き打ち検査"
