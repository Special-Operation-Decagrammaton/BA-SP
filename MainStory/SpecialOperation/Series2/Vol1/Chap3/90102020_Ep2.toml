[translation]
"90102020-1" = "第2話;無賃乗車"
"90102020-4" = "（暑さが和らぎ始めたある日のこと）"
"90102020-5" = "（シャーレの業務で列車に乗っていた）"
"90102020-8" = "（前の駅を出てから1時間ほど経った頃……）"
"90102020-12-乗務員の生徒" = "ご乗車の皆様、ただいまより車内検札を開始いたします。"
"90102020-13-乗務員の生徒" = "指定された席にご着席のうえ、お手元に乗車券をご用意ください。"
"90102020-14-乗務員の生徒" = "なお、検札に応じていただけない場合、または不正な乗車券をお持ちの場合――#nやむを得ず手荒な手段を取らせていただくこともございますので、#nご理解ご協力の程よろしくお願いいたします。"
"90102020-15-乗客" = "ひぃぃっ……。"
"90102020-19-乗務員の生徒" = "お客様、乗車券のご提示をお願いいたします。"
"90102020-20-年配の乗客" = "うむ……あのな、乗務員さん。"
"90102020-21-年配の乗客" = "その、なんだ。別に金がなくて言ってるわけじゃないんだよ。"
"90102020-25-年配の乗客" = "これはただの昔話だがね。#nあの頃は1日に枕木を何百本も背負って運んで線路を敷いたんだ。"
"90102020-26-年配の乗客" = "言ってしまえば、ここらの線路は全部わしが作ったようなものでな。"
"90102020-27-年配の乗客" = "だというのに連邦生徒会は、苦労に報いるどころか運賃を取ろうとする。#n道理に合わないとは思わんかね。"
"90102020-28-年配の乗客" = "実際、この距離で5000円は高すぎるだろう？"
"90102020-29-乗務員の生徒" = "つまり……乗車券をお持ちではない、ということでしょうか？"
"90102020-30-年配の乗客" = "やれやれ、察しが悪いのう。"
"90102020-31-年配の乗客" = "お前さんが目をつぶってくれれば、何の問題もないという話だよ。"
"90102020-32-年配の乗客" = "年寄りを敬う心があるのなら……分かるだろう？"
"90102020-33-乗務員の生徒" = "はぁ……。"
"90102020-34-乗務員の生徒" = "乗車券をお持ちでないなら、お客様ではありません。#nただちに列車から降りていただきます。"
"90102020-35-年配の乗客" = "何を言っとるんだ。列車は走ってるんだぞ？"
"90102020-36-乗務員の生徒" = "お任せください。"
"90102020-43-年配の乗客" = "うわああああ――"
"90102020-45-乗務員の生徒" = "では、次のお客様。"
"90102020-46-慌てる乗客" = "わ、私はちゃんと持ってます！"
"90102020-47-慌てる乗客" = "ほら！川西駅までの乗車券が――"
"90102020-48-乗務員の生徒" = "そのようですね……はい、ありがとうございます。問題な――"
"90102020-52-乗務員の生徒" = "――この乗車券、利用日が1週間前ですが。"
"90102020-53-乗務員の生徒" = "まさか、1週間前の乗車券でごまかせるとお思いで？"
"90102020-54-慌てる乗客" = "あっ、しまっ――"
"90102020-55-乗務員の生徒" = "本日分の乗車券をお持ちでないなら、お客様ではありません。#nただちに列車から降りていただきます。"
"90102020-56-慌てる乗客" = "その、そんなつもりじゃなくて――"
"90102020-63-慌てる乗客" = "うわああああ――"
"90102020-66" = "[ns] （ずいぶん物騒だな……）"
"90102020-67-乗務員の生徒" = "はあ……どうして[ruby=・   ・   ・]お客様[/ruby]が半分にも満たないのでしょうか……。"
"90102020-72-乗務員の生徒" = "お客様。乗車券を拝見します。"
"90102020-73-乗務員の生徒" = "お持ちでない……なんてことはございませんよね？"
"90102020-74" = "[s1] \"あるある、あるよ！ちゃんと持ってる。\"\n[s2] \"ほら、バッグの前ポケットに――\""
"90102020-80" = "[ns] \"……あれ？\""
"90102020-81-乗務員の生徒" = "はあ……。"
"90102020-82-乗務員の生徒" = "乗車券をお持ちでない、と。"
"90102020-83" = "[s] \"乗る時までは確かに持ってたんだけど……！\""
"90102020-84-乗務員の生徒" = "言い訳は結構です。"
"90102020-85-乗務員の生徒" = "乗車券をお持ちでないなら、お客様ではありません。#nただちに列車から降りて――"
"90102020-86" = "[s] \"ま、待って！\""
"90102020-90" = "[ns] \"実は私、シャーレの先生なんだよね……。\""
"90102020-92" = "[ns3] \"次の駅に着いたら、すぐ新しい切符を買うから。\"\n[ns4] \"列車から放り出すのは勘弁してもらえないかな？\""
"90102020-95-乗務員の生徒" = "シャーレの先生？あなたが？"
"90102020-96-乗務員の生徒" = "はは、ははは、はははは！"
"90102020-97-乗務員の生徒" = "そう言って乗務員を騙そうとす[ruby=やから]る輩が[/ruby]どれほど多いかご存じですか？"
"90102020-98-乗務員の生徒" = "連邦生徒会の高位役員だと名乗って運賃を値切ろうとした輩が、#n今日の午前中だけで3人もいたんですよ。"
"90102020-99-乗務員の生徒" = "あなたがシャーレの先生なら、私は連邦生徒会長ですかね？"
"90102020-100" = "[s] \"そんな……。\""
"90102020-101-乗務員の生徒" = "ともかく。乗車券をお持ちでないなら、お客様ではありません。#nそろそろ列車から降りて――"
"90102020-102-？？？" = "あの、少しよろしいでしょうか。"
"90102020-103-？？？" = "これ、座席の下に落ちてましたよ。"
"90102020-110" = "[ns] \"あれ？ニコ？どうして――\""
"90102020-111-ニコ" = "しーっ。今は話を合わせてください。"
"90102020-112-ニコ" = "席に座られた時に落としてしまったみたいですね。"
"90102020-113-ニコ" = "乗車券はきちんと持っておかないと。#n外へ放り出されてしまうかもしれませんから。"
"90102020-114-ニコ" = "この乗車券、先生のもので間違いありませんよね？"
"90102020-115" = "[s] \"あ、はい！私ので間違いありません！\""
"90102020-116-乗務員の生徒" = "どれどれ……ん？"
"90102020-117-乗務員の生徒" = "これ……連邦生徒会しか発行できない特別パスでは……？"
"90102020-118-乗務員の生徒" = "まさか、本当にシャーレの先生……！？"
"90102020-119" = "[s] \"分かってもらえて嬉しいよ……。\""
"90102020-120-乗務員の生徒" = "も、ももも申し訳ございません！#n嘘をついて無賃乗車する輩が多すぎて……少々神経質になっていたようです。"
"90102020-121-乗務員の生徒" = "大変失礼いたしました。どうぞ、良い旅を！"
"90102020-126-クルミ" = "まったく……何やってるのよ。"
"90102020-127-クルミ" = "乗車券を忘れるなんて、外に投げ出されても文句言えないわよ？"
"90102020-128" = "[s5] \"みんないたんだね……。\"\n[s6] \"おかげで助かったよ……。\""
"90102020-131-ユキノ" = "先生の安全に関わる事態でしたので。"
"90102020-132-ユキノ" = "ただし、次も我々がお守りできるとは限りません。#n列車に乗る際は乗車券を肌身離さず持ち歩かれることを推奨します。"
"90102020-133-オトギ" = "でもさ、あるあるっちゃあるあるだよね。"
"90102020-134-オトギ" = "乗車券みたいな小さい紙って、必要な時に限って見つからなくてさ。#n忘れた頃にバッグの底の方からくしゃくしゃになって出てくるんだよねぇ。"
"90102020-136" = "[ns] \"それにしても、この乗車券は……？\""
"90102020-137-ニコ" = "連邦生徒会長から預かっている、緊急用の特別パスです。"
"90102020-138-ニコ" = "容疑者を追跡する時みたいな、#n乗車券を発券する余裕がない時に使える万能パスなんですよ。"
"90102020-139-ニコ" = "だからといって、使いすぎると財務室からお小言をいただくかもしれないので。#n使うのは、本当に緊急の時だけです。"
"90102020-140" = "[s7] \"そっか……貸してくれてありがとね。\"\n[s8] \"それで、みんなはD.U.の外に用事？\""
"90102020-143-ニコ" = "いえ、もう少し手前です。"
"90102020-144-ユキノ" = "D.U.外縁部にある川西駅へ向かっているところでした。"
"90102020-145-ユキノ" = "川西駅は複数路線が交差する乗換駅のため、多くの生徒が通学に使用します。"
"90102020-146-ユキノ" = "そんな駅で、生徒の失踪に関する噂が複数報告されていまして……。"
"90102020-147" = "[s9] \"それは大変だね……。\"\n[s10] \"また怪物が出たわけじゃないよね……？\""
"90102020-150-ユキノ" = "今のところ、怪物を目撃したという話はありません。"
"90102020-151-ユキノ" = "……先生。#n時刻表にない列車が現れ、生徒を乗せて消えたという話をご存知ですか？"
"90102020-153" = "次回;存在しえない列車"
