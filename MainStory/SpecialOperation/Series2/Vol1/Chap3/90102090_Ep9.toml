[translation]
"90102090-1" = "第9話;私立ヒヤシンス学園行き急行列車"
"90102090-2" = "（同じ日の夜。約束の時間にホームで合流した）"
"90102090-3" = "（遅い時間だからかホームには誰もおらず、息が詰まるほど静まり返っていた）"
"90102090-11-気弱そうな生徒" = "き、来てくださったんですね……！"
"90102090-12-気弱そうな生徒" = "一人でいると、何だか怖くなってしまって……#nもう少し待っても来なかったら、帰ろうかと思っていたところでした。"
"90102090-13-気弱そうな生徒" = "ところで……その装備は？"
"90102090-17-オトギ" = "ごめんごめん。準備してたら思ったより時間かかっちゃって。"
"90102090-18-オトギ" = "クラスターグレネードと線路用テルミット剤……それから予備ドローンも用意したよ！"
"90102090-19-クルミ" = "急いでたからこれくらいしか持ってこられなかったけど……まあ、十分でしょ。"
"90102090-20-気弱そうな生徒" = "あの、タカハシを探すんですよね？"
"90102090-21-気弱そうな生徒" = "その装備……列車を爆破するためのものに見えるんですけど。"
"90102090-22-オトギ" = "まあ、否定はできないかな。"
"90102090-23-クルミ" = "必要なら列車を爆破してでも止める必要があるからね。"
"90102090-24-クルミ" = "線路に地雷を仕掛けておく案も考えたけど、色んな人に迷惑かかりそうだし……。"
"90102090-25-ユキノ" = "無駄な出費は避けるべきだろう。後ろ盾があるとはいえな。"
"90102090-26-気弱そうな生徒" = "（ミヤコちゃんの先輩たち、思ったより危ない人なのかも……）"
"90102090-27-ニコ" = "それで、今日はどうですか？"
"90102090-28-気弱そうな生徒" = "えっと……何がでしょうか？"
"90102090-29-ニコ" = "ホームの雰囲気です。怪しい列車を目撃した時と似ていますか？"
"90102090-30-気弱そうな生徒" = "……はい、あの時もこんな感じでした。"
"90102090-31-気弱そうな生徒" = "私が乗ろうとしてた列車までは少し時間があったので、#n椅子に座って昔のことを考えていたんです。"
"90102090-36-気弱そうな生徒" = "ちょうど、前の定期券が鞄に残ってたから……なんだか懐かしくなって、眺めてたんです。"
"90102090-38-気弱そうな生徒" = "辺りが静かだからでしょうか……今見ている景色が少しずつぼやけていって、思い出がハッキリと見えるような感覚になって。"
"90102090-39-気弱そうな生徒" = "ずっと昔の思い出を、まるで昨日のことみたいに思い出せたんです。"
"90102090-43-気弱そうな生徒" = "遠くからかすかに聞こえてくる、踏切の遮断機が下りる音。"
"90102090-47-気弱そうな生徒" = "楽しそうにおしゃべりする生徒の声。"
"90102090-49-気弱そうな生徒" = "線路沿いに咲き乱れる彼岸花と、季節ごとに移り変わる懐かしい景色……。"
"90102090-54-アナウンス" = "「まもなく、4番線に列車が参ります」"
"90102090-55-気弱そうな生徒" = "え……？"
"90102090-56-気弱そうな生徒" = "お、おかしいです……時刻表通りなら、まだ列車が来る時間じゃないのに……！"
"90102090-57-アナウンス" = "「まもなく、4番線に私立ヒヤシンス学園行き急行列車が参ります」"
"90102090-58-アナウンス" = "「危ないですから、黄色い線の内側までお下がりください」"
"90102090-59-ユキノ" = "FOX4、駅構内の監視カメラは？"
"90102090-60-オトギ" = "Signal Lost。うんともすんとも言わないねぇ。"
"90102090-61-ニコ" = "失踪事件が起きた時と同じ状態だね。"
"90102090-62-クルミ" = "ってことは……。"
"90102090-63-ユキノ" = "接近する列車が今回のターゲット――オブジェクト・アルファだ。"
"90102090-64-ユキノ" = "総員、戦闘準備。ボルトチェック、安全装置解除。"
"90102090-65-ニコ" = "確認。目標、現在位置から約300メートル。"
"90102090-66-気弱そうな生徒" = "こ、これからいったい何を……。"
"90102090-67-オトギ" = "大丈夫。ただの安全確認だから。"
"90102090-71-アナウンス" = "「ドアが開きます。足元にお気をつけてご乗車ください」"
"90102090-76-クルミ" = "中には誰もいない。聞いてた通りね。"
"90102090-77-ユキノ" = "……情報のない車両に突入するのは気が進まないが、今はやむを得ない。"
"90102090-78-ユキノ" = "FOX小隊、総員乗車する。"
"90102090-83-ユキノ" = "先生。#n私たちが作戦を進めている間、ここで依頼人と一緒に待機してもらえますか？"
"90102090-84" = "[s1] \"どうして……？\"\n[s2] \"私も一緒に行っちゃだめ？\""
"90102090-87-ユキノ" = "今回の作戦は、これまで以上に危険です。"
"90102090-88-ユキノ" = "列車の内部がどうなっているのか、何が私たちを待っているのか。#n把握できていることが何ひとつありません。"
"90102090-89-ユキノ" = "事前調査の済んだ場所で怪物を迎え撃つのとは違い、今回の作戦は――#n言わば怪物の口の中へ自ら踏み込むようなものですから。"
"90102090-90" = "[s3] \"それなら、なおさらだよ。\"\n[s4] \"列車の外から遠隔で指示を出せる保証もないでしょ？\""
"90102090-93-ユキノ" = "ですが、先生に何かあったら……。"
"90102090-94" = "[s] \"ユキノは私を信じてるよね？\""
"90102090-95-ユキノ" = "それはもちろん。"
"90102090-96" = "[s5] \"私も、ユキノを信じてる。\"\n[s6] \"だから、ユキノのそばにいたいんだ。\""
"90102090-102-ユキノ" = "…………はあ。"
"90102090-103-ユキノ" = "では、絶対に私の後ろから離れないでください。"
"90102090-104-ユキノ" = "総員、突入する。"
"90102090-105-気弱そうな生徒" = "あ、あの……本当に大丈夫なんですか？"
"90102090-106-クルミ" = "何が？"
"90102090-107-気弱そうな生徒" = "この列車に乗った人は1人も戻ってきてないのに……そんな危険を冒してまで……。"
"90102090-108-気弱そうな生徒" = "私にとっては友達のことですけど、皆さんにとっては赤の他人ですよね……？#n依頼だからってここまでしなくても……。"
"90102090-113-ユキノ" = "赤の他人ではないな。"
"90102090-114-ニコ" = "消えた生徒たちも、誰かにとっては大切な友達であり、家族だと思うし……。"
"90102090-115-オトギ" = "それに、私たちの大切な後輩ちゃんの友達だからね。"
"90102090-116-クルミ" = "約束する。必ず連れて帰るから。"
"90102090-122-オトギ" = "ああ、そうだ。ちょっと定期券借りるね。"
"90102090-126-気弱そうな生徒" = "あの……ミヤコちゃんを見ていて、少し思っていたんですけど……#n皆さんは、もしかして――"
"90102090-127-オトギ" = "しーっ。"
"90102090-128-オトギ" = "それ以上は機密事項だよ。"
"90102090-135-アナウンス" = "「ドアが閉まります。無理なご乗車はおやめください」"
"90102090-140" = "次回;ブレット・トレイン"
