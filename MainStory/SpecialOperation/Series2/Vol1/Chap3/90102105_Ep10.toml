[translation]
"90102105-2-クルミ" = "こちらFOX3。運転室にいた車掌――いや、あれを車掌って呼んでいいのかな？"
"90102105-3-クルミ" = "……[ruby=・   ・]目標[/ruby]を完全制圧。もう動かないみたい。"
"90102105-4-オトギ" = "近くで見ると、悪夢に出てくる列車の心臓みたいな見た目だね。"
"90102105-5-オトギ" = "車両の部品と乗務員の制服がぐちゃぐちゃに絡み合ってて……#n今までのロアとはまるで別物だよ。"
"90102105-6-ニコ" = "何かになろうとして失敗したようにも見えるけど……どんな意味があったのかな？"
"90102105-7-ユキノ" = "……詳しい調査は列車が止まってからでも遅くないだろう。"
"90102105-8-ユキノ" = "運転[ruby=電子制御ブレーキシステム]室のEBSを作[/ruby]動させた。#nまもなく列車は停止する。"
"90102105-9-オトギ" = "じゃあ……これで解決？"
"90102105-10-クルミ" = "FOX4、作戦中にそういう不吉なこと言うのやめてくれる？"
"90102105-11-クルミ" = "急に復活して、第二形態のボス戦が始まりそう――"
"90102105-17-ニコ" = "あれ？#n列車の速度が上がってるような……。"
"90102105-18-ニコ" = "FOX1、ブレーキシステムを作動させたんだよね？"
"90102105-19-ユキノ" = "ブレーキ管の圧力が下がらない……何かが減圧を妨害している！"
"90102105-20-クルミ" = "オトギがあんなこと言うから！"
"90102105-21-オトギ" = "えー、それ関係ある？#n言葉ひとつで作戦の成否が決まるならSRTなんて必要ないでしょ。"
"90102105-23" = "[ns] \"別の方法はないの？\""
"90102105-24-ユキノ" = "最後の手段として取っておくつもりでしたが……やむを得ません。"
"90102105-25-ユキノ" = "これから、所持しているクラスターグレネードをすべて使用し、機関部を破壊します。"
"90102105-26-ユキノ" = "脱線の可能性がありますので……身を低くし、衝撃に備えてください。"
"90102105-27" = "[s] \"わ、分かった！\""
"90102105-28-ユキノ" = "全員、有効範囲の外へ退避。"
"90102105-32-ユキノ" = "クラスターグレネード投入！"
"90102105-37-ユキノ" = "3、2、1――"
"90102105-38-オトギ" = "爆発するよ！"
"90102105-45-クルミ" = "……はあ。"
"90102105-46-クルミ" = "なんで毎回こんな感じなの……しばらくは列車に乗りたくないわ……。"
"90102105-47-オトギ" = "今回は本当に……やったか！？"
"90102105-48-クルミ" = "だからそれやめてってば！また復活したらどうするの！？"
"90102105-49-ニコ" = "あはは……流石に無理じゃないかな？#n完全に脱線しちゃったし。"
"90102105-53-ユキノ" = "先生、ご無事ですか！？"
"90102105-54" = "[s5] \"うん。かすり傷ひとつないよ。\"\n[s6] \"シートが衝撃を受け止めてくれたみたい。\""
"90102105-60-ユキノ" = "……お怪我がなくて何よりです。"
"90102105-61-オトギ" = "おー……線路まで吹っ飛んでるね。#nこれ、復旧にいくらかかるんだろう……？"
"90102105-62-オトギ" = "SRTの時だったら、財務室長が直々に来てお説教だったかもね。"
"90102105-63-クルミ" = "連邦生徒会も知らない極秘作戦で本当に良かった……。"
"90102105-64-？？？" = "う、ん……。"
"90102105-70-憂鬱な表情の生徒" = "こ、ここは……？"
"90102105-71-憂鬱な表情の生徒" = "あれ……？#n川西駅でヒヤシンス学園行きの列車に乗って……。"
"90102105-72-クルミ" = "私たち以外も乗ってたみたい。"
"90102105-73-ユキノ" = "FOX2、民間人のバイタルチェックを頼む。"
"90102105-74-ニコ" = "うん、任せて。"
"90102105-77-ニコ" = "お体は大丈夫ですか？#n目眩がしたり、どこか痛むところは？"
"90102105-78-憂鬱な表情の生徒" = "ううん、特にはないけど……あなた達は？"
"90102105-79-ニコ" = "えっと、私たちは……。"
"90102105-80-オトギ" = "あ、もしかして君がタカハシ？"
"90102105-81-憂鬱な表情の生徒" = "どうして私の名前を？"
"90102105-82-オトギ" = "君の友達に頼まれて探してたんだ。#n列車に乗ってから連絡が取れなくなったって。"
"90102105-83-クルミ" = "すっごく心配してたわよ。#nだからこれからは、知らない列車には不用意に乗らないこと。#n犯罪に巻き込まれる可能性もあるんだから。"
"90102105-84-憂鬱な表情の生徒" = "友達って……。"
"90102105-88-憂鬱な表情の生徒" = "そっか。私のこと、まだ忘れてなかったんだ。"
"90102105-89-憂鬱な表情の生徒" = "それで……ここはどこなの？"
"90102105-90-クルミ" = "さあ？私たちもよく分かんないんだよね。"
"90102105-91-クルミ" = "今GPS拾い直してるから、もうすぐ――"
"90102105-95-憂鬱な表情の生徒" = "あ……分かった気がする。"
"90102105-96-憂鬱な表情の生徒" = "この線路、ヒヤシンス学園に向かう途中だ……。"
"90102105-97-憂鬱な表情の生徒" = "こんなふうに彼岸花が一面に咲いている線路なんて、そうそうないだろうし。"
"90102105-103-ユキノ" = "彼岸花が一面に咲き、燃えるような赤が揺れる通学路の景色。"
"90102105-104-ニコ" = "綺麗……。"
"90102105-105-ニコ" = "過去に戻りたいと思った生徒の気持ちも……少しだけ、分かる気がする。"
"90102105-106-ユキノ" = "だが、過去は戻らない。私たちは今を生きていかなければならないのだから。"
"90102105-107-ユキノ" = "とはいえ……この美しい景色を忘れることはないだろうな。"
"90102105-108-ニコ" = "うん。"
"90102105-109-ニコ" = "私たちにも、また1つ思い出ができたね。"
"90102105-115" = "次回;駅弁"
