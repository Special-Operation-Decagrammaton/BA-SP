[translation]
"90102010-1" = "第1話;過去行きの列車"
"90102010-2" = "D.U.川西駅"
"90102010-4-下校中の生徒A" = "ねえ、5番出口の前さ、気づいた？"
"90102010-5-下校中の生徒A" = "ずっと工事してたお店、オープンしてたよ。"
"90102010-6-下校中の生徒B" = "え、ほんと？何のお店だった？"
"90102010-7-下校中の生徒A" = "クレープ屋さんっぽかった。"
"90102010-8-下校中の生徒A" = "「生クリームクレープ始めました！」って書いてあったから。"
"90102010-9-下校中の生徒B" = "今度食べ行ってみようよ。"
"90102010-10-下校中の生徒B" = "よく行ってたお店、急になくなっちゃったし。"
"90102010-11-下校中の生徒A" = "ああ、学園の前にあったとこ？#nあそこのバナナチョコクレープ好きだったな～"
"90102010-12-下校中の生徒B" = "分かる～！"
"90102010-13-下校中の生徒B" = "ああ……なんか甘いの食べたくなってきた。"
"90102010-14-下校中の生徒A" = "え？お腹いっぱいーってさっき言ってなかった？"
"90102010-15-下校中の生徒B" = "デザートは別腹なんですー！"
"90102010-23-憂鬱な表情の生徒" = "……。"
"90102010-24-憂鬱な表情の生徒" = "はぁ……昔はよく行ってたのにな……クレープ屋。"
"90102010-25-憂鬱な表情の生徒" = "こっちに転校してから、1回も行ってないや。"
"90102010-26-憂鬱な表情の生徒" = "ああいうお洒落な店に一人で入るの怖いし……。"
"90102010-30-憂鬱な表情の生徒" = "……だから転校なんてしたくなかったんだ。"
"90102010-31-憂鬱な表情の生徒" = "通学路に咲いてた綺麗な花も、好きだったカフェも……新しい学園には全部ない。"
"90102010-32-憂鬱な表情の生徒" = "友達も――"
"90102010-33-憂鬱な表情の生徒" = "みんな、廃校と一緒にバラバラになっちゃった。"
"90102010-37-憂鬱な表情の生徒" = "……昔に戻りたいなぁ。"
"90102010-38-憂鬱な表情の生徒" = "戻れるなら……何だってするのに。"
"90102010-44-アナウンス" = "「まもなく、4番線に列車が参ります」"
"90102010-45-憂鬱な表情の生徒" = "……え？"
"90102010-46-憂鬱な表情の生徒" = "来るの早くない？"
"90102010-47-憂鬱な表情の生徒" = "ダイヤ乱れてるのかな？"
"90102010-51-アナウンス" = "「まもなく、私立ヒヤシンス学園行き急行列車が参ります」"
"90102010-52-アナウンス" = "「危ないですから、黄色い線の内側までお下がりください」"
"90102010-57-憂鬱な表情の生徒" = "……ヒヤシンス学園行き？"
"90102010-58-憂鬱な表情の生徒" = "もう廃線になってるのに、どうして……？"
"90102010-62-憂鬱な表情の生徒" = "でも……本当にこの列車が連れていってくれるなら――"
"90102010-67-アナウンス" = "「ドアが閉まります。無理なご乗車はおやめください」"
"90102010-68-アナウンス" = "「次の列車の予定は……ありません」"
"90102010-70" = "次回;無賃乗車"
