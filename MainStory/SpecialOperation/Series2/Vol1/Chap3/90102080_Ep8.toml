[translation]
"90102080-1" = "第8話;友達を探しています"
"90102080-3-オトギ" = "え？ミヤコちゃんに会ったの？"
"90102080-4-ニコ" = "ミヤコちゃんに……？"
"90102080-5-クルミ" = "ミヤコに！？"
"90102080-9-ユキノ" = "ああ。駅で聞き込みをしていたら出くわしたんだ。"
"90102080-10-ユキノ" = "偶然、[ruby=つきゆき]月雪[/ruby]小隊長も今回の失踪事件を調べていたようだ。"
"90102080-11-ユキノ" = "おかげで、例の列車を目撃したという生徒に接触する機会を得られた。"
"90102080-12-ユキノ" = "話を聞けば、手掛かりが見つかるかもしれない。"
"90102080-13-クルミ" = "そっか……でもなぁ……なんか、ちょっと残念。"
"90102080-14-ユキノ" = "進展があったのに、何が残念なんだ？"
"90102080-15-クルミ" = "ミヤコのこと！私も話したかったのに……。"
"90102080-16-ニコ" = "私も。RABBIT小隊と直接話したのも、もうずいぶん前な気がするし。"
"90102080-17-オトギ" = "気弱な狙撃手ちゃんは元気にしてるかな～"
"90102080-18-ユキノ" = "惜しい気持ちは私も同じだが、今は作戦中だ。"
"90102080-19-ユキノ" = "作戦を終えてから、改めて挨拶に行こう。"
"90102080-20-ニコ" = "そうだね。全部終われば、きっと話す機会はあるよ。"
"90102080-21-ニコ" = "私たちの過去とも、そして未来とも。"
"90102080-27-気弱そうな生徒" = "あの……。"
"90102080-28-気弱そうな生徒" = "ミヤコさんから話を聞いて来たんですけど……#n解決屋のお仕事をされてる先輩方でしょうか？"
"90102080-29-クルミ" = "消えた友達を探してほしいって頼んだのはあなたね？"
"90102080-30-オトギ" = "まっかせて。後輩ちゃんの紹介でもあるし、全力で探すよ。"
"90102080-31-オトギ" = "まずは……消えた友達の話から聞かせてもらおうかな。"
"90102080-32-気弱そうな生徒" = "は、はい！"
"90102080-35-気弱そうな生徒" = "タカハシとは、小さい頃からずっと一緒でした。"
"90102080-36-気弱そうな生徒" = "同じ町に住んで、同じ学園に通って、登下校もいつも一緒で。"
"90102080-37-気弱そうな生徒" = "でも、通っていたヒヤシンス学園が突然廃校になってしまって……#n別々の学園に離れ離れになったんです。"
"90102080-38-クルミ" = "そういえば、前に記事を見た気がする。"
"90102080-39-クルミ" = "どうして閉鎖されたの？#n生徒がいなかったわけでもないわよね？"
"90102080-40-気弱そうな生徒" = "私も詳しくは知らないんですけど、経営状況に問題があったみたいです。"
"90102080-41-気弱そうな生徒" = "新入生の数はずっと減ってて、学園の経営も悪くなって……。"
"90102080-42-気弱そうな生徒" = "ヒヤシンス学園は財団の利益のために運営されていた私立学園だったので、生徒会も反対する大義名分を見つけられなかったみたいで。"
"90102080-43-気弱そうな生徒" = "今になって思い返すと後悔ばかりです。#n学園がなくならないように、何かできたんじゃないかって……。"
"90102080-44-クルミ" = "そうね……急に自分の学園がなくなるなんて、受け入れられなくて当然だよね。"
"90102080-45-オトギ" = "分かるなぁ……私たちも似たような気持ちだったよ。"
"90102080-46-気弱そうな生徒" = "もしかして、皆さんの通っていた学園も閉鎖になったんですか？"
"90102080-47-オトギ" = "閉鎖されたっていうか……。"
"90102080-48-クルミ" = "話すとちょっと複雑で……。"
"90102080-49-ユキノ" = "それで、友達が失踪したのはいつだ？"
"90102080-50-気弱そうな生徒" = "あ、はい。#nええと、先週の金曜日でした。"
"90102080-51-気弱そうな生徒" = "そもそも最近まで、タカハシとは連絡を取れてなかったんです。#n私も新しい学園に慣れるのに精一杯で……会うのが難しくなり、連絡も減って。"
"90102080-53-気弱そうな生徒" = "でも金曜日の夜に突然、「過去へ行く列車が来た」ってメッセージが届きました。"
"90102080-54-気弱そうな生徒" = "どういう意味か聞いたんですけど、返事はなくて……#nそのままタカハシは行方不明になりました。"
"90102080-56-ニコ" = "長年の友達が突然いなくなって……心配ですよね。"
"90102080-57-気弱そうな生徒" = "心配もそうなんですけど……メッセージの内容がずっと引っかかっているんです。"
"90102080-58-気弱そうな生徒" = "本当に、過去へ行く列車に乗って「現在」から消えてしまったのだとしたら――"
"90102080-59-気弱そうな生徒" = "タカハシは、今の生活に満足していなかったんじゃないかって。"
"90102080-60" = "[s] \"どうしてそう思ったの？\""
"90102080-61-気弱そうな生徒" = "私も……時々、過去に戻りたいって思うことがあるからです。"
"90102080-63-気弱そうな生徒" = "周りの目を避けて、誰もいない教室で1人きりの昼食を取る時。"
"90102080-65-気弱そうな生徒" = "新しいクレープ屋さんの味が、思い出のクレープ屋さんには敵わないなって思った時。"
"90102080-67-気弱そうな生徒" = "時期になると、彼岸花が一斉に咲いて、燃えるような赤に染まる通学路が恋しくなる時。"
"90102080-69-気弱そうな生徒" = "そういう時、過去に戻って別の選択をしたくなるんです。"
"90102080-70-気弱そうな生徒" = "もう少し積極的に動いていたら、学園はなくならなかったかもしれない……。"
"90102080-71-気弱そうな生徒" = "せめて、タカハシともっとこまめに連絡を取っていれば……#nあの子がいなくなることもなかったんじゃないか……って。"
"90102080-72-ユキノ" = "それは無意味な仮定にすぎない。"
"90102080-73-ユキノ" = "過去は、過去だ。過ぎ去ったものだからな。"
"90102080-74-気弱そうな生徒" = "じゃあ……皆さんには全く無いんですか？"
"90102080-75-気弱そうな生徒" = "戻りたい過去……これまでの決断に、少しの後悔もないと？"
"90102080-76-ユキノ" = "それは……。"
"90102080-80-？？？" = "全部お前たちの責任だろ！？"
"90102080-81-？？？" = "市民のための作戦？冗談じゃない！#n私はその作戦のせいで被害を受けたんだぞ！"
"90102080-84-？？？" = "どうして私だけが犠牲にならなきゃいけない！？私だって市民だ！私も助けてくれよ！"
"90102080-85-？？？" = "……事件なんて、いっそ放っておけばよかったのに。"
"90102080-91" = "[ns] \"どれだけ今が苦しくても、過去は戻ってこないよ。\""
"90102080-93-気弱そうな生徒" = "それは……分かっています。"
"90102080-94-気弱そうな生徒" = "でも、今が辛くて苦しい時……どうしても振り返ってしまうんです。"
"90102080-95-気弱そうな生徒" = "振り返ることも……悩むことも無意味だと思いますか？"
"90102080-96" = "[s1] \"過去を振り返るな、という意味じゃないよ。\"\n[s2] \"思い出や経験は、私たちを前に進ませてくれるから。\""
"90102080-102" = "[ns] \"でも、私たちは今を生きているでしょ？\""
"90102080-103-気弱そうな生徒" = "それは……どういう意味ですか？"
"90102080-104" = "[s3] \"過去から歩きなおしても、結局は「今」を通らなきゃいけない。\"\n[s4] \"「今」から目を逸らしたら、未来へは一歩も踏み出せないよ。\""
"90102080-107-ニコ" = "過去の勝利に酔って失敗した事例は、教範の外にも山ほどありますからね。"
"90102080-108-ニコ" = "昨日の経験で今日の作戦を失敗させてしまっては、本末転倒です。"
"90102080-109-気弱そうな生徒" = "でも、タカハシが過去へ戻ってしまったのなら……。"
"90102080-110" = "[s] \"大切な友達を、過去に置き去りにしていいの？\""
"90102080-111-気弱そうな生徒" = "ち、違います！#nもう一度タカハシに会わなきゃいけない理由がたくさんあるんです！"
"90102080-112-気弱そうな生徒" = "今まで話せなかったこともたくさん話して、新しくできたクレープ屋にも行って……。"
"90102080-116-気弱そうな生徒" = "……ずっと連絡できていなかったことも、謝りたいんです。"
"90102080-117-クルミ" = "よし、じゃあ決まりね。"
"90102080-118-オトギ" = "君も、駅で怪しい列車を見たんだよね？"
"90102080-119-気弱そうな生徒" = "はい。3日前の放課後、手がかりを探すために川西駅へ行ったら、#n時刻表にない、来るはずのない列車が来たんです。"
"90102080-120-気弱そうな生徒" = "……とてもよく知っている、見覚えのある列車でした。"
"90102080-121-気弱そうな生徒" = "それは――通学で使っていた、ヒヤシンス学園行きの列車だったんです。"
"90102080-122-オトギ" = "何か怪しいところはなかった？#n列車番号が違ってたとか、車内の構造が違ってたとか。"
"90102080-123-気弱そうな生徒" = "一瞬のことだったので、詳しくは……#nでも、誰も乗ってなかったのは変でしたね。"
"90102080-124-気弱そうな生徒" = "川西駅は乗換駅なので、遅い時間でも1人や2人は必ず乗ってるんです。"
"90102080-125-気弱そうな生徒" = "だけどその列車には誰も乗ってなくて……不気味だったので乗る気にはなれませんでした。"
"90102080-126-クルミ" = "やっぱり、ヒヤシンス学園出身の生徒の前にだけ現れるのかな？"
"90102080-127-オトギ" = "そうかもね。#n私たちはその路線に思い入れもないし、どんな見た目かも知らないわけだし。"
"90102080-128-クルミ" = "ほんっとロアって面倒ね。一昨日は一晩中ホームで待ってても出てこなかったのに。"
"90102080-129-ニコ" = "だからこそ、不可解な現象と呼ぶのかもしれないね。"
"90102080-130-ニコ" = "でも、これでひとまず列車の出現条件はクリアかな……？"
"90102080-131-ユキノ" = "今夜もう一度川西駅のホームへ来てもらえないか？"
"90102080-132-気弱そうな生徒" = "いいですけど……えっと、何をするんですか？"
"90102080-133-ユキノ" = "心配するな。大したことじゃない。"
"90102080-135-ユキノ" = "……楽しかった過去と、向き合いに行こう。"
"90102080-137" = "次回;私立ヒヤシンス学園行き急行列車"
