[translation]
"90102100-1" = "第10話;ブレット・トレイン"
"90102100-4-ユキノ" = "扉の両脇に突入隊形。"
"90102100-5-ユキノ" = "進入後、左右に展開して死角をカバーしろ。"
"90102100-6-ユキノ" = "突入する。#n……3、2、1！"
"90102100-11-ニコ" = "左側クリア。"
"90102100-12-クルミ" = "右側クリア。"
"90102100-13-オトギ" = "後方異常なし。#n7号車、確保。"
"90102100-14-ユキノ" = "次の車両へ移動する。"
"90102100-19-オトギ" = "……変だね。"
"90102100-20-クルミ" = "……だよね。"
"90102100-22" = "[ns] \"どうしたの？\""
"90102100-23-オトギ" = "勘違いかもしれないけどさ……。"
"90102100-24-オトギ" = "この列車って8両編成くらいじゃなかった？"
"90102100-25" = "[s] \"たしかに、すっごく長い感じはしなかったかも。\""
"90102100-26-オトギ" = "でしょ？なのに、もう8両目なんだよね……。#n先頭車両に着く気配がない。"
"90102100-27-オトギ" = "あとは……外を見て。#n真っ暗で、どこを走ってるのかも分からないし……。"
"90102100-28-オトギ" = "まるで、輪になった列車の中を延々と回り続けてるみたい。"
"90102100-29" = "[s1] \"言われてみれば……。\"\n[s2] \"まさか列車の中で迷子になるとは……。\""
"90102100-35-ユキノ" = "全員停止。現在位置を維持しろ。"
"90102100-36-ユキノ" = "短くブリーフィングを行った後に作戦を再開する。"
"90102100-39-ユキノ" = "……このままでは埒が明きませんね。"
"90102100-40-ユキノ" = "前の車両に移動し続けることは無意味だと判断しますが……#n先生はいかがお考えでしょうか。"
"90102100-41" = "[s3] \"私も同じかな。\"\n[s4] \"別のやり方を探す必要がありそうだけど……。\""
"90102100-44-クルミ" = "でも今回のロアって、過去に戻りたいっていう願いから生まれたんでしょ？"
"90102100-45-クルミ" = "列車の中で迷子になるなんて話はなかったのに、どうしてこうなってるんだろ？"
"90102100-46-ニコ" = "実際に時間を過去へ戻すことはできないから、#n対象を過去の風景に閉じ込めようとしてるのかも。"
"90102100-47-ニコ" = "それか「ドラム缶ガニ」みたいに、列車にまつわる別の噂やイメージが混ざり込んでるのかもしれないね。"
"90102100-48-ニコ" = "みんな、何か知ってる？"
"90102100-49-オトギ" = "そういえば最近工事をしてる新国駅あるじゃん？#n新国駅にまつわる変な噂を聞いたんだよね。"
"90102100-50-オトギ" = "誰かが出口標識いじったりしてるのか、案内どおりに歩いてるのに同じところをずっとぐるぐる回り続けることになるんだって。"
"90102100-51-ニコ" = "今の私たちの状況に似てはいるけど……ここは駅じゃなくて列車だよね？"
"90102100-52-クルミ" = "そうね。というか、駅構内で迷うのって別の駅でもよくあることじゃない？"
"90102100-53-クルミ" = "他の都市伝説なら、何かないかな？"
"90102100-54-オトギ" = "うーん……これも少し前に聞いた話なんだけど。"
"90102100-55-オトギ" = "通学時間の列車って満員なことが多いじゃん？#nでも、たまに1両だけすかすかなことがあるんだって。"
"90102100-56-オトギ" = "んで、そういう車両には絶対乗っちゃいけないんだとさ。"
"90102100-57-クルミ" = "なんで？"
"90102100-58-オトギ" = "理由はよく知らないけど……噂ってそういうもんじゃん？#nそれに、人が避けてるところにわざわざ入ってもいいことないし……。"
"90102100-60-ニコ" = "私は初めて聞く怪談だけど……それに、この列車は最初から誰も乗ってないから関係ないんじゃないかな？"
"90102100-61-オトギ" = "他に噂かぁ……。"
"90102100-62-オトギ" = "うーん……だめだ。#n「ハイランダーの生徒にボコられた体験談」が強烈すぎる……。"
"90102100-63-クルミ" = "同じく。"
"90102100-64-ニコ" = "そういえば、この列車に乗務員はいないのかな？#nいてくれれば尋問できるんだけど……。"
"90102100-65" = "[s] \"SRT式尋問法……。\""
"90102100-70" = "[ns] \"車内に問題が起きてないから出てこないのかも？\""
"90102100-71-ユキノ" = "問題がなければ来ない……。"
"90102100-72-ユキノ" = "さすがは先生。良いアイデアです。"
"90102100-73" = "[s] \"そんな大事なこと言ったかな……。\""
"90102100-74-ユキノ" = "いえ、先生のおっしゃる通りです。"
"90102100-75-ユキノ" = "いくら進んでも変わり映えしないのなら、乗務員を呼び出せばいい。"
"90102100-76-ユキノ" = "こちらに有利な状況へ誘い出すのは、特殊戦術の基本ですから。"
"90102100-80-ユキノ" = "全員、防御態勢。後方ドアを固定後、遮蔽物を設置しろ。"
"90102100-81-ユキノ" = "FOX3は前方警戒を維持。FOX2とFOX4は後方へ。間隔を保て。"
"90102100-82-クルミ" = "確認。"
"90102100-83-ユキノ" = "射線が重ならないよう配置し、前方を注視。すぐに合図を送る。"
"90102100-84-ユキノ" = "……非常停止スイッチ、ON。"
"90102100-90-アナウンス" = "「お客様にご案内いたします。車内非常停止スイッチの作動を確認いたしました」"
"90102100-91-アナウンス" = "「お客様は着席いただくか吊り革にお掴まりください」"
"90102100-92-アナウンス" = "「状況確認のため、非常停止スイッチが作動した車両へ乗務員が向かっております」"
"90102100-93-アナウンス" = "「なお、緊急時以外における非常停止スイッチの不正使用が確認された場合、#n鉄道安全法に基づき『活けづくり』『えぐり出し』『挽肉』等の処置が#n行われる場合があります」"
"90102100-94-アナウンス" = "「安心安全なご利用のため、乗務員の調査にご協力ください」"
"90102100-95-クルミ" = "……活けづくり？何それ？"
"90102100-96-オトギ" = "都市伝説の細かいところに突っ込まないの。#n大事なのはちゃんと反応があったってことだから。"
"90102100-97-ユキノ" = "……来るぞ。"
"90102100-104-オトギ" = "何あれ？ハイランダーの生徒じゃないよね。"
"90102100-105-クルミ" = "……獣？#nいや、生き物にしては異様に大きいし、動きもおかしい。"
"90102100-109-ニコ" = "歯車みたいな音がして、油の匂いがする……。"
"90102100-110-ニコ" = "遊園地のアニマトロニクスみたいな感じだね。"
"90102100-117-ユキノ" = "…………ふぅ。"
"90102100-118-ニコ" = "FOX1、大丈夫？"
"90102100-119-ユキノ" = "問題ない。少し吐き気のする記憶を思い出しただけだ。"
"90102100-121" = "[ns] \"本当に大丈夫？\""
"90102100-122-ユキノ" = "問題ありません。"
"90102100-123-ユキノ" = "先ほども言いましたが……先生、決して私から離れないでください。"
"90102100-128-ユキノ" = "全員。相手がキルゾーンに入るまで、絶対に動くな。"
"90102100-134-ユキノ" = "……3、2、1。"
"90102100-138-ユキノ" = "射撃開始。"
