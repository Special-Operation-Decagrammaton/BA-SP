[translation]
"90100020-1" = "第2話;超人と狐の間"
"90100020-2-クルミ" = "あっつ……。"
"90100020-3-クルミ" = "なんでこんな暑いわけ？夏ってまだ先でしょ？"
"90100020-4-クルミ" = "というか……このグラウンド最悪。#n全然日陰ないし、塀があるから風も通らないし……。"
"90100020-5-クルミ" = "囚人には日除けなんかいらないってわけ？"
"90100020-6-オトギ" = "看守から見て死角ができないようにしてるんじゃない～？"
"90100020-7-オトギ" = "隠れられるところがあったら脱獄しやすいし？"
"90100020-8-オトギ" = "実際、ワカモなんかは木陰で脱獄用の工具を受け取ってたらしいよ。"
"90100020-9-クルミ" = "あいつ……最初っから気に入らなかったのよね。"
"90100020-10-クルミ" = "脱獄する気も起きないくらいに締め上げておけばよかった！"
"90100020-11-ニコ" = "落ち着いてクルミちゃん。過度な制圧は禁止されてるからね。"
"90100020-12-クルミ" = "それは分かってるけど……今は自分が矯正局にいるんだって思うと、#n昔のことを思い出しちゃってイライラするのよ。"
"90100020-13-クルミ" = "……というか、ニコは暑くないの？#n一緒に走ってるのに全然汗かいてなくない？"
"90100020-14-ニコ" = "暑いのは平気なんだ。今日くらいの気温なら、涼しく感じるくらい。"
"90100020-15-クルミ" = "おかしい……暑熱順化の訓練だって同じメニューを受けてたはずなのに……。#nどうしてこんなに差が……。"
"90100020-16-クルミ" = "やっぱり体質の違いかしら？"
"90100020-17-オトギ" = "……クルミはニコより[ruby=・]ア[/ruby][ruby=・]レ[/ruby]が小さいからじゃない～？"
"90100020-18-クルミ" = "小さいって何がよ！？"
"90100020-19-オトギ" = "耳だよ、耳。#n……あはっ、何を想像したの？"
"90100020-20-オトギ" = "ほら、体の末端って気温の変化に敏感だって言うじゃん？"
"90100020-21-オトギ" = "ニコは耳が大きいから、そのぶん熱も逃がしやすいんじゃないかなって。"
"90100020-22-ニコ" = "たしかに……夏は真っ先に耳が熱くなるかも。"
"90100020-23-ニコ" = "その代わり、冬だとすぐ冷えて痛くなっちゃうんだけどね。"
"90100020-24-クルミ" = "そうなの……？まあ、そういう差はあるんでしょうけど。"
"90100020-25-クルミ" = "はぁ……でも、私は冬のほうが好きかも。#n夏って胸の下が蒸れて辛くて……。"
"90100020-26-オトギ" = "………………ちっ。"
"90100020-27-クルミ" = "いま舌打ちしたでしょ！"
"90100020-28-オトギ" = "……してないけど？"
"90100020-29-クルミ" = "嘘よ！「ちっ」って聞こえてるんだから！"
"90100020-30-ニコ" = "……ユキノはまだ走ってるね。"
"90100020-31-クルミ" = "ユキノー、いつまでやるつもり？もうすぐ運動の時間終わっちゃうよー。"
"90100020-32-ユキノ" = "……もう一周走ったら戻る。"
"90100020-33-オトギ" = "ユキノ、矯正局に入ってから訓練ばっかだよね。#n私たちともあんまり話してくれないし。"
"90100020-34-クルミ" = "1人で考えたいことでもあるのかしら？"
"90100020-35-オトギ" = "まあ……そりゃあ、たくさんあるでしょ。"
"90100020-36-クルミ" = "それは、そうだろうけど……。"
"90100020-37-オトギ" = "それでも、あんまり無理しないでほしいね……。"
"90100020-38-ユキノ" = "（[ruby=ここ]矯正局[/ruby]でのうのうと過ごしていたって、私の罪が晴れるわけではない）"
"90100020-39-ユキノ" = "（責任を取れる大人になるためにも、より学び、より努力し――人を信じなければ）"
"90100020-40-ユキノ" = "（でも……）"
"90100020-41-？？？" = "全部お前たちのせいだろう！？"
"90100020-42-？？？" = "市民のための作戦？冗談じゃない！#n私はその作戦で被害を受けたんだぞ！"
"90100020-43-？？？" = "どうしてこんな目に遭うんだ！？私だって市民だ！助けてくれよ！"
"90100020-44-？？？" = "……いっそ、放っておいてくれたらよかったのに。"
"90100020-45-？？？" = "あんたらと話すことなんてない！#nもっと上の――責任が取れるヤツを呼んでこい！"
"90100020-46-ユキノ" = "（あの時……何を選び、どう行動すべきだったのか。今も答えは分からない）"
"90100020-47-ユキノ" = "（先生の言うように、時間が解決してくれる問題だったのだろうか？）"
"90100020-48-ユキノ" = "（それとも、[ruby=超人]連邦生徒会長[/ruby]だけが解決できることだったのだろうか……）"
"90100020-49-？？？" = "……5、5020番……。"
"90100020-50-？？？" = "しゅ、囚人番号5020番……！"
"90100020-51-オトギ" = "あれ？矯正局長だ。誰かを探してるみたいだね。"
"90100020-52-オトギ" = "ユキノの番号じゃない？"
"90100020-53-クルミ" = "ユキノー、呼ばれてるよー？"
"90100020-54-ミスズ" = "……ごめんなさい、ユキノさん。#n番号呼びに慣れないとは思いますがご容赦ください……。"
"90100020-55-ユキノ" = "……いえ、こちらも訓練に集中していて反応が遅くなりました。"
"90100020-56-ユキノ" = "どのようなご要件でしょうか。"
"90100020-57-ミスズ" = "面会要請が来ています。#n外出準備をお願いできますと……。"
"90100020-58-ユキノ" = "本日の面会時間はすでに終了しているはずですが。"
"90100020-59-ミスズ" = "はい……ですが、特別な方でして。"
"90100020-60-ミスズ" = "――連邦生徒会長がお呼びです。"
"90100020-61-ユキノ" = "連邦生徒会長が……？"
"90100020-62-ユキノ" = "……同じことを何度も伺ってしまい、申し訳ございません。"
"90100020-63-ユキノ" = "本当に、行方不明だった連邦生徒会長が戻ってこられたのですか？"
"90100020-64-ユキノ" = "はい……急なことだったので、ヴァルキューレもしばらくはバタバタしてしまいまして。"
"90100020-65-ミスズ" = "ですが、ようやく一段落ついたんです。#nそれに、連邦生徒会長のおかげで、滞っていた仕事もだいぶ片付きまして。"
"90100020-66-ミスズ" = "この調子なら、矯正局も少しずつ改善できるかと。"
"90100020-67-ユキノ" = "（私たちは、連邦生徒会長が戻ってくるのを信じて待つべきだった……のか）"
"90100020-68-ミスズ" = "もちろん、これだけでヴァルキューレが正常化したとは言えませんが。#n防衛室長の一件もありますし――"
"90100020-69-ミスズ" = "あっ、ごめんなさい……無神経なことを言いました。"
"90100020-70-ユキノ" = "いえ、構いません。"
"90100020-71-ミスズ" = "会長。ユキノ――いえ、囚人番号5020番をお連れしました。"
"90100020-72-？？？" = "どうぞ、お入りください。"
"90100020-73-ユキノ" = "（……聞き慣れない声だ）"
"90100020-74-ユキノ" = "（違和感がある……どこか、会長らしくないような……？）"
"90100020-75-ユキノ" = "（連邦生徒会長は、どんな声だっただろうか……？）"
"90100020-76-ユキノ" = "（彼女の姿が……思い出せない）"
"90100020-77" = "連邦生徒会長執務室"
"90100020-78-連邦生徒会長" = "お久しぶりですね、ユキノ小隊長。"
"90100020-79-ユキノ" = "あなたは――"
"90100020-80-ユキノ" = "――連邦生徒会長。"
"90100020-81-ユキノ" = "ご無沙汰しております。なんだか、印象が変わりましたね。"
"90100020-82-連邦生徒会長" = "最近よく言われるんです。あまり自覚は無いのですが。"
"90100020-83-連邦生徒会長" = "それだけ長く席を空けてしまったということなのでしょうね。"
"90100020-84-連邦生徒会長" = "立ち話もなんですから、お掛けください。"
"90100020-85-連邦生徒会長" = "……不在中の一連の出来事については既に報告を受けています。"
"90100020-86-連邦生徒会長" = "カヤ防衛室長が、あなた達を使ってクーデターを企てたそうですね。"
"90100020-87-ユキノ" = "………はい。"
"90100020-88-連邦生徒会長" = "お気になさらず。あなたを責めるつもりはありません。"
"90100020-89-連邦生徒会長" = "むしろ私の方が……皆さんに謝らなければ。"
"90100020-90-連邦生徒会長" = "様々な事件が起き、混乱が広がったことでしょう。#nそれもすべて、私が姿を消してしまったがゆえ。"
"90100020-91-連邦生徒会長" = "その[ruby=さなか]最中[/ruby]で、誰かが誤った選択をしたとして――どうして責任を追及できるというのでしょう。"
"90100020-92-連邦生徒会長" = "……私の不手際でした。"
"90100020-93-ユキノ" = "いえ……申し訳ありません。"
"90100020-94-連邦生徒会長" = "特に……SRT特殊学園の皆さんに対しては、本当に申し訳なく思っています。"
"90100020-95-連邦生徒会長" = "SRTの管理権限を巡って争いが起こり……学園の解体にまで至ったのですから。"
"90100020-96-連邦生徒会長" = "RABBIT小隊をはじめとして――"
"90100020-97-連邦生徒会長" = "入学して間もない1年生には、つらい経験をさせてしまいました。"
"90100020-98-連邦生徒会長" = "公務が落ち着き次第にはなりますが、SRT特殊学園を復活させようと考えておりまして。#n隊員たちが最良の教育を受けられるよう尽力するつもりです。"
"90100020-99-ユキノ" = "そこまでしていただけるのであれば、他に望むことはありません。"
"90100020-100-連邦生徒会長" = "……ただし。"
"90100020-101-連邦生徒会長" = "だからといって、皆さんの過去が無かったことになるわけではありません。"
"90100020-102-連邦生徒会長" = "クーデターのためにインフラを止め、連邦生徒会を襲撃し――#n都心で爆破テロを起こそうとした。その罪は重いです。"
"90100020-103-連邦生徒会長" = "もちろん、恩赦を与えることはできます。ですが、それでは市民の不満は溜まる一方で、信頼回復などとてもできないでしょう。"
"90100020-104-連邦生徒会長" = "これは慎重に進めなければならない事案です。#n……SRTが、本来の役割を取り戻すためにも。どうか、ご理解ください。"
"90100020-105-ユキノ" = "罪を犯した時点で、どのような処罰も甘んじて受ける覚悟はできていました。"
"90100020-106-ユキノ" = "ただ……他の小隊員は、あくまで私の命令に従っただけです。"
"90100020-107-ユキノ" = "私はどうなろうと構いません……どうか、他の小隊員には便宜を図っていただけないでしょうか。"
"90100020-108-連邦生徒会長" = "全ての責任を1人で背負おうとする。#nあなたの悪い癖ですね。"
"90100020-109-連邦生徒会長" = "世の中のあらゆる事象は複雑に絡み合っています。#nただ1人に全ての責任を負わせることなどできません。"
"90100020-110-連邦生徒会長" = "この現状は……そうですね。#n全員が少しずつ責任を持ち、役割を果たした結果といえるでしょう。"
"90100020-111-連邦生徒会長" = "……もちろん、私も例外ではありません。"
"90100020-112-連邦生徒会長" = "ですからこの事態の代償も、みんなで支払うべきなのです。"
"90100020-113-ユキノ" = "……以前、作戦行動中に容疑者の初動対応に失敗し、#n市民を巻き込んでしまったことがありました。"
"90100020-114-ユキノ" = "その市民が批難すべきは、現場で指揮官を務めていた私だというのに……。"
"90100020-115-ユキノ" = "会長がすべての矢面に立ってくださったおかげで、私たちの責任は一切問われませんでした。"
"90100020-116-ユキノ" = "世の中のあらゆる問題は1人で背負うことができないのだとしたら……#nなぜ会長は、これまでSRTの力と責任を1人で背負われていたのですか？"
"90100020-117-連邦生徒会長" = "当時は……余裕があったからです。"
"90100020-118-連邦生徒会長" = "あの頃の私は、皆さんの過失を補えるだけの余裕も、地位も、責任も持っていました。"
"90100020-119-連邦生徒会長" = "私の依頼で任務に就いた者が、窮地に陥ってしまった。#nそれを助けられる余裕があるのに責任だけを押しつける。#nそれは、正しいリーダーの姿とは言えませんから。"
"90100020-120-ユキノ" = "であれば私も――"
"90100020-121-連邦生徒会長" = "今のあなたにそれができるとは思えません。#n疲れが滲んでいますよ。自分の罪を背負うだけでも精一杯なように見えます。"
"90100020-122-連邦生徒会長" = "いつか、他人の罪を背負えるだけの余裕があなたに戻ってからでも遅くはありません。"
"90100020-123-連邦生徒会長" = "それまでは、どうかこのわがままを聞いてください、ユキノさん。"
"90100020-124-ユキノ" = "……会長のお気持ちは理解しました。"
"90100020-125-ユキノ" = "ですが矯正局に籠って反省しているだけでは、SRTの名誉は取り戻せません。"
"90100020-126-ユキノ" = "罪を償える機会をいただけるのでしたら、どんな任務でもお引き受けします。#nご指示を。"
"90100020-127-連邦生徒会長" = "……恩赦は難しくとも、市民に奉仕する機会を用意する程度は許されるでしょう。"
"90100020-128-連邦生徒会長" = "……「ロア」という言葉を聞いたことはありますか？"
"90100020-129-連邦生徒会長" = "人々の間で噂として伝わっていく、根拠も出どころも分からない胡乱な話。#n伝承……都市伝説、あるいは怪談。"
"90100020-130-連邦生徒会長" = "にわかには信じがたい、けれど説得力があるがゆえに、語り継がれ――#n生き永らえていく物語。"
"90100020-131-連邦生徒会長" = "現実には存在しない異界の駅へと向かう列車――"
"90100020-132-連邦生徒会長" = "真夜中に、聞くだけで呪われてしまう声が流れてくるラジオ――"
"90100020-133-連邦生徒会長" = "決まった手順で乗り降りすると、二度と戻ってこられなくなるエレベーター――"
"90100020-134-連邦生徒会長" = "……驚かないのですね。#n実は怪談がお好きなのですか？"
"90100020-135-ユキノ" = "真偽が定かではない話に感情移入するのは非効率的です。"
"90100020-136-連邦生徒会長" = "そうですね。ロアとは本来、まともに取り合うべきではない――#n取るに足らない空想の産物にすぎなかったのでしょう。"
"90100020-137-連邦生徒会長" = "ですがこの頃、実際に[ruby=・]遭[/ruby][ruby=・]遇[/ruby][ruby=・]し[/ruby][ruby=・]た[/ruby]という報告が増えているのです。"
"90100020-138-連邦生徒会長" = "それは目撃談に留まらず――実害も出始めている。"
"90100020-139-ユキノ" = "実害……それは、ロアによるものでしょうか？"
"90100020-140-連邦生徒会長" = "ロアとの遭遇を主張する生徒は、真相を確かめる間もなく声を失ったり、#n失踪してしまったりするケースがほとんどです。"
"90100020-141-連邦生徒会長" = "テロや失踪事件であれば、ヴァルキューレ警察学校の出番ですが、#nこと今回に至っては実情すら把握できていない状態でして。"
"90100020-142-連邦生徒会長" = "ロアの伝播を防ぐべく、行政委員会は捜査をより上位の組織に移管すべきだと判断しました。"
"90100020-143-連邦生徒会長" = "通常の治安組織では対応できない状況において、迅速かつ半ば超法規的な捜査が必要とされるのであれば――"
"90100020-144-ユキノ" = "SRTに白羽の矢が立った、というわけですね。"
"90100020-145-連邦生徒会長" = "その通りです。"
"90100020-146-連邦生徒会長" = "ただ、これはあくまで連邦生徒会長からの[ruby=・]提[/ruby][ruby=・]案[/ruby]です。#n命令でも、指示でもありません。"
"90100020-147-連邦生徒会長" = "相手の正体さえ分からず、最悪の場合、被害者と同じ末路を辿るかもしれない。"
"90100020-148-連邦生徒会長" = "あなたがロアを見つける前に、ロアがあなたを見つけてしまったなら──#n次は、あなた自身がロアとなる可能性すらあります。"
"90100020-149-連邦生徒会長" = "それでも、この作戦に臨みますか？"
"90100020-150-ユキノ" = "はい。"
"90100020-151-ユキノ" = "私たちには、償うべき罪がありますので。"
"90100020-152-連邦生徒会長" = "良いでしょう。こちらで集めた情報を共有します。"
"90100020-153-連邦生徒会長" = "ロアの実態を探り、キヴォトスに広まる脅威を一掃してください。"
"90100020-154-連邦生徒会長" = "……それから、もう1つ。#nこれは連邦生徒会長ではなく、私個人としてのお願いです。"
"90100020-155-連邦生徒会長" = "どうか――無事に帰ってきてください。"
"90100020-156-ユキノ" = "ご心配なく。"
"90100020-157-ユキノ" = "勝ち目のない戦いは即時撤退。それも、特殊部隊の仕事ですから。"
"90100020-158-ユキノ" = "1点、作戦に先立って質問をよろしいでしょうか。"
"90100020-159-連邦生徒会長" = "ええ、どうぞ。"
"90100020-160-ユキノ" = "非公式に行われる作戦とはいえ、拠点の確保や弾薬の補給のためには外部と連絡を取る必要があります。支援を担う組織も。"
"90100020-161-ユキノ" = "以前までは連邦生徒会長がやってくださりました。#nしかし、今は状況がそれを許さないでしょう。"
"90100020-162-連邦生徒会長" = "そうですね。私がFOX小隊の支援を直接引き受けてしまえば、#n連邦生徒会長がSRT特殊学園の復活を公に認めた、という印象を与えかねません。"
"90100020-163-連邦生徒会長" = "ですが幸いなことに、その役割を担える組織があります。"
"90100020-164-連邦生徒会長" = "連邦生徒会に匹敵する権限と予算を有していて、連邦生徒会の誰もが認める捜査機関。"
"90100020-165-連邦生徒会長" = "――シャーレです。"
"90100020-166-ユキノ" = "……聞き間違いでしょうか？"
"90100020-167" = "次回;小隊は腹ごしらえしてから行進する"
