[translation]
"90100080-1" = "第8話;陽炎の向こうから"
"90100080-2-クルミ" = "報告、こちらFOX3。"
"90100080-3-クルミ" = "現在、キヴォトス標準時1000。気温は摂氏28度、風速およそ3ノット。"
"90100080-4-クルミ" = "FOX4と共にポイントロメオにおいて、#n方位0-3-0方向に特異現象――通称「白いかかし」の発生を監視中。"
"90100080-5-クルミ" = "地面の温度は順調に上がってきてるけど、まだ陽炎が立つ気配はなさそう。"
"90100080-6-オトギ" = "なんか退屈だなぁ。いつ来るか分からない対象を待つなんてさ。"
"90100080-7-オトギ" = "あっ、オトギ――じゃなくてFOX4！回線に割り込まないでよ！"
"90100080-8-オトギ" = "そんな細かいこと気にしなくてよくない？#nおしゃべりしてたほうが楽しいじゃん。"
"90100080-9-オトギ" = "こちらFOX4。FOX3の言う通り、特異現象どころか普通の陽炎すら立ってないよ。#n地面の熱さが足りてないんだろうね。"
"90100080-10-オトギ" = "……にしても、今日は日陰で待機してて平気なの？"
"90100080-11-オトギ" = "前より全然ラクだから不満はないけど。"
"90100080-12-ユキノ" = "こちらFOX1。作戦に変更はない。今は陽炎に集中しろ。"
"90100080-13-ユキノ" = "容疑者の決定的証拠はまだないが、被害者と同じ視界で現場を観測すれば、手がかりを拾えるかもしれない。"
"90100080-14-オトギ" = "つまり……陽炎をずっと見てたら、なんか出てくるってこと？"
"90100080-15-オトギ" = "陽炎の形にぐにゃっと歪んだゾンビが歩いてくるとかさ～"
"90100080-16-クルミ" = "そ、そんなのあるわけないでしょ！？"
"90100080-17-オトギ" = "「白いかかし」の正体を確認するまでは、「ありえない」と切り捨てることはできない。"
"90100080-18-オトギ" = "……冗談だって。ほんと隊長さんは冗談が通じないよねぇ。"
"90100080-19-ニコ" = "こちらFOX2。ポイントシエラにて方位2-1-0方向を観測中。#nこっちも今のところ異常なしだよ。"
"90100080-20-ニコ" = "それより……今日は先生来ないのかな？"
"90100080-21-クルミ" = "あ、なんか別の仕事があるって言ってたよ。"
"90100080-22-クルミ" = "なにさ、何か用でもあったの？"
"90100080-23-ニコ" = "う、ううん。そういうのじゃないんだけど……。"
"90100080-24-ニコ" = "なんだろう……嫌な予感がするんだ。"
"90100080-25-ニコ" = "急に先生の助けなしで動くと思うと、ちょっと不安になってね。"
"90100080-26-オトギ" = "えー、今までだって自分たちで片づけてきたじゃん？"
"90100080-27-オトギ" = "まあ、先生と一緒だとおいしいお菓子とか出てきて楽しいのはあるけど。"
"90100080-28-クルミ" = "あんた、先生のことを補給係か何かだと思ってない……？"
"90100080-29-クルミ" = "ていうかFOX4……矯正局を出てから太ったよね？"
"90100080-30-オトギ" = "筋肉だから！"
"90100080-31-ユキノ" = "FOX2。何かあったか？"
"90100080-32-ニコ" = "ううん。さっきも言ったけど、ただの予感だから。気にしないで。"
"90100080-33-ユキノ" = "だが、ニコの勘はよく当たる。無視はできない。"
"90100080-34-ニコ" = "……FOX1らしくないね。ちょっと弱気で、感覚的。"
"90100080-35-ニコ" = "情報が揃うまでは軽々しく判断するなって言ってなかった？"
"90100080-36-ユキノ" = "作戦立案と違って、現場では直感も武器になり得る。"
"90100080-37-ユキノ" = "いくら慎重になっても足りないくらいだ。"
"90100080-38-ニコ" = "経験が多いと身体が覚えてる時もあるし……一理あるね。"
"90100080-39-ユキノ" = "でも私が気になったのは、敵の奇襲とか、狙撃とか、そういうのじゃなくて……。"
"90100080-40-ニコ" = "もしかしたら、この作戦そのものに落とし穴があるかもしれない。#nいつの間にか味方に銃口を向けてるかもしれないみたいな――そういう根本の不安。"
"90100080-41-ニコ" = "例えば……そう、あのときの「兎狩り」みたいに。"
"90100080-42-ユキノ" = "…………。"
"90100080-43-ニコ" = "……FOX1。連邦生徒会長って……本当に連邦生徒会長だった？"
"90100080-44-ユキノ" = "当たり前だ。FOX2も映像と写真で確認しただろう？"
"90100080-45-ニコ" = "うん。顔立ちも、振る舞いも……間違いなく、記憶通りの連邦生徒会長だった。"
"90100080-46-ニコ" = "でも[ruby=不確かな存在]、ロアを[/ruby]相手にしてるからかな……任務中ずっと不安が消えないの。"
"90100080-47-ニコ" = "せめて、先生が隣にいてくれたら……。"
"90100080-48-ニコ" = "でも、忙しい先生を、毎日呼び出すわけにもいかないもんね。"
"90100080-49-ユキノ" = "ああ。ひとまず、覚えておく。"
"90100080-50-オトギ" = "こちらFOX4、外気温が31度に到達。"
"90100080-51-オトギ" = "そろそろ陽炎が立ち始めるよ。"
"90100080-52-オトギ" = "かかしっぽいの見える？"
"90100080-53-オトギ" = "全然。あーでも、窓ガラスの反射した白い光と重なれば、白いかかしに見える……かも？"
"90100080-54-オトギ" = "うーん……。"
"90100080-55-クルミ" = "FOX4？"
"90100080-56-オトギ" = "いや、ちょっと目眩が……ずっと陽炎見てるせいかな……。"
"90100080-57-クルミ" = "そういえば、オデュッセイアで任務やってる隊員から聞いたんだけどさ。"
"90100080-58-クルミ" = "黙って水面を見続けてる生徒がいたら、すぐ引き離さなきゃいけないんだって。"
"90100080-59-オトギ" = "なんで？"
"90100080-60-クルミ" = "詳しくは聞けてないけど、波の動きが人を催眠にかけるとか何とか。"
"90100080-61-クルミ" = "だから自分で飛び込む前に、水面から引き離せって。"
"90100080-62-オトギ" = "それって……絵本に出てくる「セイレーンの歌」みたいな話？"
"90100080-63-クルミ" = "まあ、岩の上で歌う半人半魚の怪物よりは現実的かな。"
"90100080-64-クルミ" = "だからFOX4も気をつけて。#n陽炎に誘われてアスファルトの向こうに引きずり込まれるかもしれないから。"
"90100080-65-オトギ" = "まっさかぁ。似たような作戦はこれまで何回もやってきたじゃん。"
"90100080-66-オトギ" = "それに、おしゃべりな相棒が隣にいるんだから、そうやすやすと――"
"90100080-67-オトギ" = "……あれ？"
"90100080-68-クルミ" = "どうしたの？"
"90100080-69-オトギ" = "あんなとこに……草原なんてあったっけ？"
"90100080-70-クルミ" = "草原？どこ、何時方向？"
"90100080-71-オトギ" = "道路の向こう。青空の草原が見える。#n地図には載ってないし……蜃気楼？"
"90100080-72-オトギ" = "草が生い茂ってて……かかしが、1つ……その向こうで笑ってる白い服の人が――"
"90100080-73-クルミ" = "ん……？それ！「白いかかし」じゃない！？"
"90100080-74-クルミ" = "FOX4、座標は！？どっち！？"
"90100080-75" = "薄気味悪くて……むわっとする風が吹いてくる方……。"
"90100080-76" = "みんな「白いかかし」って言ってたけど……あれはかかしなんかじゃない。"
"90100080-77" = "意志を持って動いてる。そうしないと存在できないんだ……。#n観測されなきゃ干渉できないから、目立つ白い服を着て踊ってるんだ。"
"90100080-78" = "なに言ってんの！？FOX4！しっかりして！！"
"90100080-79" = "来る……来るよ！巨大な灰色の波が、痙攣するみたいに、くねくねと、踊るみたいに、くねくねと――"
"90100080-80" = "くねくねくねくねくねくね――"
"90100080-81-クルミ" = "オトギ！！"
"90100080-82-ニコ" = "な、なに！？銃声が聞こえたけど……。"
"90100080-83-ユキノ" = "ポイントロメオ、応答しろ。何が起きた？"
"90100080-84-オトギ" = "いったた……FOX3が急におかしくなったみたい！#nいきなり走ってきて私の頭ぶん殴ったんだけど！"
"90100080-85-クルミ" = "はぁ！？あんた正気！？私が誰か分かる？"
"90100080-86-オトギ" = "なんでそんなこと聞くのさ……いつも通りの平坦な胸が目の前にあるし。"
"90100080-87-クルミ" = "ふざけないで！この指、何本に見える！？"
"90100080-88-オトギ" = "2本……？なに、どしたの。"
"90100080-89-クルミ" = "よかった……。#n被害者の人数が増えなくて……。"
"90100080-90-ユキノ" = "FOX3。状況を報告しろ。"
"90100080-91-クルミ" = "こちらFOX3。直前まで陽炎を観測してたFOX4が――"
"90100080-92-クルミ" = "「白いかかし」を目撃したって言った。"
"90100080-93-オトギ" = "私が！？"
"90100080-94-クルミ" = "そうだよ。覚えてないの？#n「青い空の草原がどうの」とか、「灰色の波がどうの」とか、変なこと言い出したでしょ。"
"90100080-95-オトギ" = "全然覚えてない。"
"90100080-96-オトギ" = "クルミがオデュッセイアの話をしてるのを聞きながら、#nスコープ越しに陽炎を見てたつもりなんだけど。"
"90100080-97-オトギ" = "なんでだろ。白昼夢でも見てたのかな。"
"90100080-98-ユキノ" = "無事ならそれでいい。さっき発砲された流弾による被害はないか？"
"90100080-99-オトギ" = "うぅ……いま確認する。"
"90100080-100-オトギ" = "変な所に飛んでなきゃいいけど。"
"90100080-101-オトギ" = "……あれ？"
"90100080-102-クルミ" = "ど、どうしたの？まさか市民に当たったとかじゃ――"
"90100080-103-クルミ" = "いや、それが……そもそも弾痕がない。#nでも弾は不発じゃないから、確かに撃ってるのに。"
"90100080-104-クルミ" = "は？50口径の弾丸が空中で蒸発でもしたってわけ？"
"90100080-105-クルミ" = "……やっぱり本当に幽霊だったのかな。"
"90100080-106-ニコ" = "FOX1、何か心当たりでも？"
"90100080-107-ユキノ" = "まだ断定はできない。だが状況の整理は必要だな。"
"90100080-108-ユキノ" = "全隊員、直ちにHQへ復帰する。装備を回収し、ランデブーポイントに集結しろ。"
"90100080-109-一同" = "ラジャー！"
"90100080-110" = "次回;手掛かり"
