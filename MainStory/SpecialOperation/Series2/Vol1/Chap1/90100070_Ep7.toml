[translation]
"90100070-1" = "第7話;高速道路を走る人影"
"90100070-2" = "第3業務地区第2区域"
"90100070-3-クルミ" = "こちらFOX3。1人目の被害者が発見された、第3業務地区の2区域を聞き込み中。"
"90100070-4-クルミ" = "被害者は近くにある製薬会社の営業で、昼間もこの辺りをよく歩いてたみたい。"
"90100070-5-クルミ" = "でも、ガラスの反射で眩しいってこと以外、白いかかしと見間違えるような物は見当たらないかな。"
"90100070-6" = "甲種閉鎖区域内・解体現場"
"90100070-7-オトギ" = "こちらFOX4。3人目の被害者が見つかった甲種閉鎖区域の解体現場を捜索中。"
"90100070-8-オトギ" = "被害者は解体現場の作業員で、日陰のない空き地で作業することが多かったんだって。"
"90100070-9-オトギ" = "けほっ、けほっ……土煙がすっごい。白いかかしどころか白い物すらよく見えない。#n暑すぎる以外は異常なし。"
"90100070-10" = "月天場外市場"
"90100070-11-ニコ" = "こちらFOX2。月天の場外市場で聞き込みをしてるよ。#n6人目の被害者が発見された場所だね。"
"90100070-12-ニコ" = "被害者はここの屋台の店主だって聞いたんだけど……#n暑いからかな？お店が閉まっちゃってて、人にはほとんど会えなかったよ。"
"90100070-13-ニコ" = "うーん……白い服の観光客をかかしと見間違えた可能性はあるのかも？"
"90100070-14-ニコ" = "特に目立った点はなさそう。"
"90100070-15" = "KVハイウェイ35番道路"
"90100070-16-ユキノ" = "こちらFOX1。KVハイウェイ35号道路を捜索中。"
"90100070-17-ユキノ" = "９人目の被害者はD.U.道路管理局所属の整備士で、点検中に事故に遭ったらしい。"
"90100070-18-ユキノ" = "発見された橋の下まで入念に確認したが――"
"90100070-19-ユキノ" = "やはり足りないな。"
"90100070-20-クルミ" = "何が？水？もっと補給要る？"
"90100070-21-オトギ" = "たぶん、白いかかしを特定できる手掛かりが足りないってことかな。"
"90100070-22-オトギ" = "最初からやり直そう、なんて言わないよね……？"
"90100070-23-ユキノ" = "しかし――"
"90100070-24" = "[ns1] \"こんにちは、シャーレEATSです！\"\n[ns2] \"冷たいお水とエナジードリンクを持ってきたよ！\""
"90100070-25-ニコ" = "あ、先生……。"
"90100070-26-ニコ" = "こんなに……ありがとうございます。重かったんじゃないですか？#n毎回ついて来てくださるのも大変でしょうに……。"
"90100070-27" = "[s3] \"思ったより時間かかってるみたいだったから。\"\n[s4] \"何か問題でもあった……？\""
"90100070-28-ユキノ" = "大きな問題はありません。#nですが、被害者の証言を裏付ける情報が不足していて……。"
"90100070-29-ユキノ" = "やはり捜索範囲を拡大し、聞き込みを再開する必要がありそうです。"
"90100070-30-オトギ" = "うぅっ……。"
"90100070-31" = "[ns5] \"こんな暑さだし、後に回せないの？\"\n[ns6] \"せめて日が落ちてから再開するとか……。\""
"90100070-32-ユキノ" = "それは……難しいですね。"
"90100070-33-ユキノ" = "現場証拠は場所だけでなく、時間や天候によって姿を変えるものです。"
"90100070-34-ユキノ" = "被害者は全員、日差しの強い真昼に発見されている。#nとなれば日が落ちてからの聞き込みは意味がありません。"
"90100070-35-ニコ" = "証拠集めとしては効率的だけど……#n小隊員のコンディションも少し考えたほうがいいんじゃないかな？"
"90100070-36-ニコ" = "何日も炎天下で動いてて、みんな疲れが溜まってるころだと思うよ。"
"90100070-37-ユキノ" = "……仕方ない。"
"90100070-38-ユキノ" = "みんなは周辺で休憩を取っていてくれ。次の聞き込みは私一人で――"
"90100070-39-オトギ" = "まったく……。"
"90100070-40-オトギ" = "また出た。いつもの悪い癖。"
"90100070-41-クルミ" = "ユキノ、そう言われて私たちが本気で休めると思う？#nそれとも私たちが、隊長の苦労を見て見ぬふりする最低な隊員だとでも？"
"90100070-42-ユキノ" = "そ、そんなつもりでは……。"
"90100070-43" = "[ns7] \"特に期日が決められてるわけじゃないし……。\"\n[ns8] \"少しくらい、肩の力を抜いてみない？\""
"90100070-44-ユキノ" = "ですが……こうしている間にも新しい被害者が出るかもしれません。"
"90100070-45-ユキノ" = "私の怠慢で市民が傷つくようなことが……また、起きたら。"
"90100070-46-ユキノ" = "そうなる前にもっと早く判断して、責任を取れなければ――"
"90100070-47-クルミ" = "待って。高速道路のインターチェンジ方面から新規の存在が接近中。"
"90100070-48-クルミ" = "動きと速度的に……人っぽい？"
"90100070-49-オトギ" = "高速道路上に人がいるの？#n道路管理局の点検予定ってあったっけ。"
"90100070-50-オトギ" = "いや、スケジュールにはのってないね。"
"90100070-51-オトギ" = "まさか、噂の「白いかかし」が……。"
"90100070-52-ユキノ" = "どこかへ消えてしまう前に、急いで追うぞ。"
"90100070-53-オトギ" = "未識別って、あそこを走ってる生徒？"
"90100070-54-ニコ" = "あのー、すみませ――"
"90100070-55-人力車の生徒" = "あれ？こんな所に人が……？"
"90100070-56-人力車の生徒" = "何かお困りですか？"
"90100070-57-オトギ" = "いやいや、困ってるのはむしろそっちに見えるんだけど。"
"90100070-58-オトギ" = "この先は歩行者通行禁止だ。迂回しろ。"
"90100070-59-オトギ" = "そもそも高速道路に入っちゃダメでしょ？どうして入ってきちゃったの？"
"90100070-60-人力車の生徒" = "そりゃ当然――"
"90100070-61-人力車の生徒" = "路上研修です！"
"90100070-62" = "[s] \"あれ？その格好って、百鬼夜行連合学院の……。\""
"90100070-63-人力車の生徒" = "……[USERNAME]先生？"
"90100070-64-ナツキ" = "はいっ、百鬼夜行連合学院の人力車部所属！[ruby=あさくさ]浅草[/ruby]ナツキです！#nお祭り以来ですね！"
"90100070-65-ナツキ" = "もしよかったら……乗っていかれます？"
"90100070-66-ナツキ" = "今ならD.U.のどこへでも、タクシーより安くお送りできますよ！"
"90100070-67" = "[s9] \"いや、人力車は大丈夫。\"\n[s10] \"それより、聞きたいことがあるんだけど……。\""
"90100070-68-オトギ" = "つまり……自治区の外まで行きたい客がいるかもしれないから、#n高速道路で人力車を引く練習をしてたってこと？"
"90100070-69-ナツキ" = "はい！目的地まで最短ルートで迅速にお連れするのがモットーですから！"
"90100070-70-ナツキ" = "地理の把握不足で遠回りになってしまっては、#nお客様からの信頼を失ってしまうかもしれませんし。"
"90100070-71-オトギ" = "うん……分かる。急に知らない道に入られて、わざと遠回りしてるんじゃないかって不安になったことあるし。"
"90100070-72-オトギ" = "タクシーと人力車を一緒にしないでよ！？"
"90100070-73-ニコ" = "ナツキちゃん、でいいかな？#nD.U.の高速道路は人力車の通行が禁止されてるんだ。#nだから、別ルートにしたほうがいいんじゃないかな。"
"90100070-74-ナツキ" = "えっ、そうなんですか！？"
"90100070-75-ナツキ" = "うぅ……百鬼夜行で禁止条例が出たばっかりなのに……まさかD.U.もだったなんて。"
"90100070-76-クルミ" = "人力車が高速道路に入ったら危ないのは、条例以前に常識でしょ……。"
"90100070-77-クルミ" = "というか、この天気でよく走ろうと思ったわね。#nそこらの運動部でも半日走ったらフラつきそうな暑さなのに。"
"90100070-78-ナツキ" = "ちょっと暑いですけど……大丈夫です！よくあることですから！"
"90100070-79-ナツキ" = "舗装された路面は照り返しが強いですし、暑い場所で走るのには慣れてるんです。"
"90100070-80-ナツキ" = "繁忙期の真夏に比べれば、まだ涼しいほうですよ！"
"90100070-81" = "[s11] \"それでも熱中症には気をつけてね。\"\n[s12] \"はい、1本あげる。よく冷えてるよ。\""
"90100070-82-ナツキ" = "あ……ありがとうございます。"
"90100070-83-ナツキ" = "まさかこんな場所でシャーレの先生から飲み物を頂けるなんて……#n今日は運がいいですね。"
"90100070-84-ユキノ" = "いつも暑い道路を走っているのなら、聞きたいことがある。"
"90100070-85-ユキノ" = "「白いかかし」を見たことはないか？"
"90100070-86-ナツキ" = "白いかかし……ですか？"
"90100070-87-ニコ" = "そのかかしを見た人は、みんな意識を失って痙攣を起こしちゃうらしいんだけど……。"
"90100070-88-ナツキ" = "……もしかして「くねくね」のことですか？"
"90100070-89-クルミ" = "くねくね……？"
"90100070-90-ユキノ" = "あ、でも普通は田舎の田んぼで目撃されるものなので、#nビルだらけの都会で見たって話はあまり聞かないですけど……。"
"90100070-91-ナツキ" = "何でも構わない。そのくねくねとは何だ？"
"90100070-92-ナツキ" = "くねくねは百鬼夜行自治区で有名な都市伝説です。#nといっても、わりと最近流行り始めた怪談ですが。"
"90100070-93-ナツキ" = "暗くてジメッとした場所で目撃される他の怪異とは違って、#n晴れて見晴らしのいい草原で目撃されるって言われてます。"
"90100070-94-ナツキ" = "遠目には踊ってる白いかかしみたいにも見えるんですけど、#n正体が人なのか、かかしなのか分かった人はいない、って。なぜなら――"
"90100070-95-ナツキ" = "近づいて正体を見た人は……気が狂って――#nくねくねと同じになっちゃうからです。"
"90100070-96-ナツキ" = "薄気味悪い笑みを浮かべて、くねくね……って。"
"90100070-97-オトギ" = "えっ、何それこわ。"
"90100070-98-ナツキ" = "まあ、あくまで怪談ですから。#n百鬼夜行でも本気で信じてる人はほとんどいないと思いますよ。#n私たちみたいな人力車引きならともかく。"
"90100070-99-クルミ" = "うん？じゃあナツキちゃんは信じてるの？"
"90100070-100-ナツキ" = "怪談を信じてるっていうより……広まった理由を理解できる、って感じです。"
"90100070-101-ナツキ" = "ほら、暑い日にアスファルトの上を歩いてると、陽炎が立ち上って……#nくねくねする白い煙みたいに見える時、あるじゃないですか。"
"90100070-102-ナツキ" = "そういう日は、無理して人力車を引くと熱中症になることもあるんです。"
"90100070-103-ナツキ" = "だから地平線の近くでくねくねする「白いかかし」を見たら帰れ、っていうのは……#n意外と常識的な助言なのかもしれません。"
"90100070-104-ユキノ" = "陽炎……。"
"90100070-105-ユキノ" = "……そうか。陽炎か。"
"90100070-106-ユキノ" = "助かった。大きな手掛かりだ。"
"90100070-107-ナツキ" = "え、えっ……？それはよかった……です？"
"90100070-108-ユキノ" = "[USERNAME]先生。現時刻をもって小隊作戦を終了し、HQへ復帰します。"
"90100070-109" = "[s] \"分かった。戻ろうか。\""
"90100070-110" = "[ns] \"ナツキも暑さに気をつけて帰ってね～\""
"90100070-111-ナツキ" = "はい、そちらもお気をつけて……！"
"90100070-112-ナツキ" = "それにしても、あのセーラー服の生徒たち……見覚えがあるような……。"
"90100070-113-ナツキ" = "うちに修学旅行とかで来てたっけ？"
"90100070-114" = "次回;陽炎の向こうから"
