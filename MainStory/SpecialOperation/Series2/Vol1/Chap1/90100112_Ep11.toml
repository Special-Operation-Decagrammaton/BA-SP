[translation]
"90100112-1" = "連邦生徒会長執務室"
"90100112-2-連邦生徒会長" = "囚人番号1192番をお連れしました。"
"90100112-3-連邦生徒会長" = "どうぞ、お入りください。"
"90100112-4-連邦生徒会長" = "お久しぶりですね、防衛室長。"
"90100112-5-連邦生徒会長" = "いえ……[ruby=しらぬい]不知火[/ruby]カヤ。"
"90100112-6-カヤ" = "あなたは……。"
"90100112-7-連邦生徒会長" = "私が不在だった間のことは、すべて報告を受けました。"
"90100112-8-連邦生徒会長" = "[ruby=なながみ]七神[/ruby]リン代行が失脚した隙を突いて、クーデターを試みたそうですね。"
"90100112-9-連邦生徒会長" = "キヴォトスが混乱に陥ったそもそもの原因は私にあります。#nとはいえ、あなたの行動は連邦生徒会を崩壊させかねないものでした。"
"90100112-10-連邦生徒会長" = "だからこそ裁判に先立って、あなたの証言を聞いておきたいのです。"
"90100112-11-連邦生徒会長" = "何故あなたは連邦生徒会長の座を狙ったのですか？"
"90100112-12-カヤ" = "………。"
"90100112-13-カヤ" = "いや、あなた……誰なんですか？"
"90100112-14-連邦生徒会長" = "……はい？"
"90100112-15-連邦生徒会長" = "私が……分からないのですか？"
"90100112-16-カヤ" = "分かるも何も、初対面ですよね？"
"90100112-17-カヤ" = "そんなことより、どうして連邦生徒会長の服を着てるんです？#nまさか、あなたもクーデターを――"
"90100112-18-連邦生徒会長" = "では、改めて自己紹介をさせてください。"
"90100112-19-連邦生徒会長" = "私は学園都市キヴォトスを管理する連邦生徒会の長――"
"90100112-20-カヤ" = "何を言ってるんですか！？"
"90100112-21-カヤ" = "私[ruby=連邦生徒会長]の超人は[/ruby]こんなのじゃない！！"
"90100112-22-カヤ" = "あなたにだって[ruby=・]そ[/ruby][ruby=・]れ[/ruby][ruby=・]な[/ruby][ruby=・]り[/ruby][ruby=・]の[/ruby][ruby=・]品[/ruby]はありますけど、比べるべくもありません！"
"90100112-23-カヤ" = "本物の連邦生徒会長はもっと優雅で、なのに親しみがあって……#nたまに抜けて見えることもあるけど、それも含めて完璧な――"
"90100112-24-矯正局の看守" = "お前！連邦生徒会長に向かって何て口のきき方だ！"
"90100112-25-カヤ" = "あなたもこの偽物に買収されたんですか？#n何もかもが違うじゃないですか！！"
"90100112-26-カヤ" = "本物が戻ってきたら、あなたも、シャーレの先生も、リンも、みんなただじゃ――"
"90100112-27-カヤ" = "ぐえっ！"
"90100112-28-カヤ" = "申し訳ありません。長い収監生活で頭がおかしくなったようです。"
"90100112-29-連邦生徒会長" = "……いえ。カヤさんとの面談は日を改めましょう。"
"90100112-30-カヤ" = "次こそ失敗しないんだからぁぁぁぁ――！"
"90100112-31-連邦生徒会長" = "……私の印象、そんなに変わったんでしょうか。"
"90100112-32" = "ロア追跡編;To be Continued in Chapter 2"
