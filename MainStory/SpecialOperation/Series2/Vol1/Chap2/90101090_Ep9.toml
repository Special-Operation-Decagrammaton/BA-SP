[translation]
"90101090-1" = "第9話;SRT式尋問法"
"90101090-2" = "鐘崎港倉庫前"
"90101090-3-カルパッチョ構成員A" = "誰だ？"
"90101090-4-カルパッチョ幹部" = "私だよ。あんたらの[ruby=Capo]支部長[/ruby]だ。"
"90101090-5-カルパッチョ幹部" = "私の顔を忘れたわけ？"
"90101090-6-カルパッチョ構成員A" = "あっ、姐さん……失礼しました！"
"90101090-7-カルパッチョ幹部" = "はいはい。で、午後は何もなかった？"
"90101090-8-カルパッチョ構成員A" = "はい！私らがここを守ってる間、カニ一匹近寄りませんでした！"
"90101090-9-カルパッチョ幹部" = "まぁ、そりゃそうだ。#nカルパッチョ・ファミリーの縄張りをうろつくような怖いもの知らずなんて――"
"90101090-10-カルパッチョ幹部" = "――いや、最近ちょっと増えてきてる気もするけどね。"
"90101090-11-ニコ" = "すみません～デリバリーをお届けに来たのですが、入り口に誰もいなくて。"
"90101090-12-ニコ" = "外においておいたら悪くなっちゃうので、人を探しにここまで来てしまいました。"
"90101090-13-カルパッチョ幹部" = "本当か？正門の警備がここまで通したと？"
"90101090-14-ニコ" = "えっと……正門には誰もいませんでしたよ？"
"90101090-15-カルパッチョ幹部" = "チッ……カルパッチョ・ファミリーの格も、昔ほどじゃないってことか。"
"90101090-16-カルパッチョ幹部" = "ボスの信頼を取り戻すためにも、次の入札を落とすわけにはいかない……！"
"90101090-17-カルパッチョ幹部" = "姐さん、何か心配事でも？"
"90101090-18-カルパッチョ幹部" = "いや、別に。"
"90101090-19-カルパッチョ幹部" = "それよりあんた達、昼の巡回当番じゃなかった？#nもう18時過ぎてるのに、なんでまだ倉庫に張り付いてるわけ？"
"90101090-20-カルパッチョ構成員A" = "あ、それが……。"
"90101090-21-カルパッチョ構成員A" = "夜の巡回だった連中が腹を壊しまして。"
"90101090-22-カルパッチョ構成員A" = "弱っちい奴らね。何食ったらそうなるの？"
"90101090-23-カルパッチョ構成員A" = "なんとか寿司？だったような。#n昨日デリバリーで頼んだとかで。"
"90101090-24-カルパッチョ構成員A" = "それで今夜の巡回に穴が空いちまって、どうするか悩んでたとこです。"
"90101090-25-カルパッチョ構成員A" = "こんのバカども……。"
"90101090-26-カルパッチョ幹部" = "私が来なかったら一晩中待つつもりだったの！？"
"90101090-27-カルパッチョ構成員A" = "す、すみません！"
"90101090-28-カルパッチョ幹部" = "寮に行ってサトウとスズキ連れてきな。今日は非番だから暇してるはずさ。"
"90101090-29-カルパッチョ幹部" = "休みは後でカポが埋め合わせするって言っときな。今日はちょいと頑張れって。"
"90101090-30-カルパッチョ構成員A" = "は、はい……！"
"90101090-31-カルパッチョ幹部" = "……何グズグズしてんの？"
"90101090-32-カルパッチョ構成員A" = "あ、どっちが行くかで悩んでまして。"
"90101090-33-カルパッチョ構成員A" = "いつもボスが言ってるじゃないですか。#n区画守る時は常に2人1組。持ち場を空けるなって。だから……。"
"90101090-34-カルパッチョ幹部" = "はぁ……ほんっと、手がかかるわね。"
"90101090-35-カルパッチョ幹部" = "じゃあ何？#n片方が呼びに行ってる間、もう片方はここで私と駄弁るつもりだったの？"
"90101090-36-カルパッチョ幹部" = "1分1秒でも早く連れてくるなら、2人で動いた方が早いに決まってんでしょ！"
"90101090-37-カルパッチョ幹部" = "それとも……いっちょ前に私の心配でもしてるわけ？"
"90101090-38-カルパッチョ構成員A" = "い、いえ！"
"90101090-39-カルパッチョ幹部" = "さっさと行って連れてきな！"
"90101090-40-カルパッチョ幹部" = "……はぁ。あんな間抜けを抱えて区画を回す羽目になるなんて。"
"90101090-41-クルミ" = "あの……。"
"90101090-42-クルミ" = "さすがに不意打ちされたら、カポでも危ないんじゃないですかね？"
"90101090-43-クルミ" = "は？いま、何て――"
"90101090-44-カルパッチョ幹部" = "――っぐ。"
"90101090-45-クルミ" = "多分あんたのボスは、こういう状況を心配してたんだろうけど。"
"90101090-46-クルミ" = "こちらFOX3。カルパッチョ・ファミリーの中間管理職を確保したわ。"
"90101090-47-クルミ" = "FOX4、了解。半径50m以内に他構成員の気配なし。"
"90101090-48-クルミ" = "FOX1、了解。ターゲットは秘匿してポイントチャーリーへ移送。目撃者に注意しろ。"
"90101090-49-クルミ" = "何なんだ、よ……。"
"90101090-50-カルパッチョ幹部" = "うっ……うぅぅ……。"
"90101090-51-？？？" = "……意識、戻りました？"
"90101090-52-ニコ" = "ここは……どこだ。お前らは……？"
"90101090-53" = "鐘崎港外れの廃倉庫"
"90101090-54-ニコ" = "FOX1、ターゲットの意識が回復したよ。"
"90101090-55-ユキノ" = "横で騒音を出し続けた甲斐があったな。"
"90101090-56-ユキノ" = "では、尋問を始める。"
"90101090-57-カルパッチョ幹部" = "尋問……？ハッ、私をか？"
"90101090-58-カルパッチョ幹部" = "あんたら、見たことない制服だが――"
"90101090-59-カルパッチョ幹部" = "アランチーノ・ファミリーの差し金か？"
"90101090-60-カルパッチョ幹部" = "大人まで連れて、ずいぶん威勢がいいじゃないか。#nこんなことして、うちのボスが黙っちゃいないよ？"
"90101090-61" = "[s] \"え、えっと……。\""
"90101090-62-ユキノ" = "耳を貸す必要はありませんよ。"
"90101090-63-ユキノ" = "苦し紛れの脅しですから。"
"90101090-64-ユキノ" = "黙れ。お前に質問は許していない。"
"90101090-65-カルパッチョ幹部" = "はは、ずいぶん偉そうだね。"
"90101090-66-カルパッチョ幹部" = "いいよ、見せてもらおうか。何をしようが私は口を割らないけどね。"
"90101090-67-カルパッチョ幹部" = "組織を裏切るくらいなら、いっそカニの餌になった方が――"
"90101090-68-オトギ" = "FOX2。これ、発電機逝ってない？"
"90101090-69-オトギ" = "他にないの？ついでにもうちょっとパワフルなやつ。"
"90101090-70-カルパッチョ幹部" = "ま、待て！何をする気だ！？"
"90101090-71-オトギ" = "何って。さっき言ったでしょ？#n尋問。"
"90101090-72-オトギ" = "でも悪いけど、もう少し待ってくれる？#n配線がまだ途中なんだよね。"
"90101090-73-カルパッチョ幹部" = "そ、それで拷問しようってのか！？"
"90101090-74-カルパッチョ幹部" = "そんな残酷なこと……連邦生徒会が黙ってないぞ！"
"90101090-75-カルパッチョ幹部" = "お、お前らも聞いたことくらいあるだろ？#nD.U.で度を過ぎたことをすると、連邦生徒会長直属の特殊部隊が来るって……！"
"90101090-76-カルパッチョ幹部" = "逃げたってキヴォトスの果てまで追ってくるんだぞ……！#nお、お前ら、連邦生徒会長が怖くないのか！？"
"90101090-77" = "[s] \"あ、その特殊部隊なら……。\""
"90101090-78-クルミ" = "問題ないわ。話はつけてきたから。"
"90101090-79-オトギ" = "うんうん。ものすごーく誠実な「対話」をしてきたよ。"
"90101090-80-オトギ" = "あんたらが連邦生徒会長と直で話した？ホラも大概に――"
"90101090-81-オトギ" = "まぁまぁ。そんなに心配しなくていいよ。#n傷跡が残るようなことまではするつもりないし。"
"90101090-82-オトギ" = "この発電機は、サーバーを回すために持ってきただけ。#n人に使うためじゃないから。"
"90101090-83-オトギ" = "サーバー……？"
"90101090-84-ニコ" = "あなたのお名前は、タカハシさん。#nカルパッチョ・ファミリーのカポで、鐘崎港を警備するチームのリーダー……ですよね？"
"90101090-85-ニコ" = "構成員からは、血も涙もないと怖がられているみたいですけど、#n実は「可愛いもの集め」が趣味だとか――"
"90101090-86-カルパッチョ幹部" = "お、お前……どうしてそれを……！"
"90101090-87-ニコ" = "ご自身で全部書いているじゃないですか。「フルリンク」の裏アカに。"
"90101090-88-ニコ" = "もちろん、隠しているつもりだったようですが……。"
"90101090-89-ニコ" = "フォローしているアカウントと、タカハシさんの行動ルーティンを照らし合わせたら、#nすぐに特定できました。"
"90101090-90-ニコ" = "先月はウロミちゃんの限定ぬいぐるみを買いに、#nコーギータウンのポップアップストアにも行ってて……。"
"90101090-91-ニコ" = "あら。可愛い猫も一匹、飼ってるんですね。"
"90101090-92-カルパッチョ幹部" = "くっ……。"
"90101090-93-ニコ" = "さて。この裏アカをバラしたら……どうなるでしょう？"
"90101090-94" = "[s1] \"なんて恐ろしい発想なんだ……！\"\n[s2] \"怖い……怖すぎます……。\""
"90101090-95-カルパッチョ幹部" = "や、やめろ！そんなことをされたら私の威厳が――！"
"90101090-96-ニコ" = "であれば、質問に素直に答えた方がいいと思いますよ。"
"90101090-97-ニコ" = "「化け蟹」の噂を流した理由は何ですか？"
"90101090-98-カルパッチョ幹部" = "チッ……そこまで掴んでるのか。"
"90101090-99-カルパッチョ幹部" = "だが……私はボスの寵愛を受けるカポ。港の商人会が震える恐怖の――"
"90101090-100-クルミ" = "まだ分かってないみたいだねぇ。"
"90101090-101-クルミ" = "FOX1。さっき言われたやつ、持ってきたわよ。"
"90101090-102-クルミ" = "これでしょ？"
"90101090-103-ユキノ" = "……よし、ご苦労。"
"90101090-104-ユキノ" = "FOX3、交渉が決裂したらすぐカポの家に行け。これを飼い猫に食わせるんだ。"
"90101090-105-カルパッチョ幹部" = "なっ、何を食わせる気だ……！？"
"90101090-106-クルミ" = "「いなり社」のツナ味ウェットの缶。#n猫がどれだけ食いつくか……猫好きなら分かるわよね？"
"90101090-107-クルミ" = "知らない人から高級缶を差し出されたら……猫はどうすると思う？"
"90101090-108-クルミ" = "ま、まさか……。"
"90101090-109-クルミ" = "いつもの味気ないカリカリとは段違い。たまらず普段は見せないような甘え方をしたり――"
"90101090-110-クルミ" = "あ。[ruby=・]ま[/ruby][ruby=・]ず[/ruby][ruby=・]い[/ruby][ruby=・]餌[/ruby][ruby=・]し[/ruby][ruby=・]か[/ruby][ruby=・]く[/ruby][ruby=・]れ[/ruby][ruby=・]な[/ruby][ruby=・]い[/ruby][ruby=・]飼[/ruby][ruby=・]い[/ruby][ruby=・]主[/ruby]とは、ちょっと距離できちゃうかも？"
"90101090-111-クルミ" = "どうしてそんな残酷なことができるんだ！？"
"90101090-112-ユキノ" = "……残酷？"
"90101090-113-ユキノ" = "勘違いしているみたいだな。"
"90101090-114-ユキノ" = "私たちは人じゃない。「執念深くて残酷な狐」だ。"
"90101090-115-ユキノ" = "取引に応じないのなら、お前が想像している以上のことも平気でやる。"
"90101090-116-カルパッチョ幹部" = "ぐぅっ……！"
"90101090-117" = "[s3] \"みんな落ち着いて。\"\n[s4] \"相手が話す隙は残してあげよう？\""
"90101090-118-カルパッチョ幹部" = "大人……お前は誰だ？"
"90101090-119-カルパッチョ幹部" = "お前らにしたって、大人を連れてるってことは、ただのチンピラじゃないな。#n企業の人間か？"
"90101090-120" = "[s5] \"私はシャー……この子たちの保護者だよ。\"\n[s6] \"乱暴なやり方で連れてきてごめんね。\""
"90101090-121-カルパッチョ幹部" = "はっ、今さら謝られて誰が信じる？"
"90101090-122-カルパッチョ幹部" = "丸め込もうったって、腹の底は見え見えなんだよ。"
"90101090-123" = "[s7] \"私の顔を賭けて誓うよ。\"\n[s8] \"私たちはカルパッチョ・ファミリーの利権に、欠片も興味がない。\""
"90101090-124-カルパッチョ幹部" = "そんな言葉を信じ――"
"90101090-125-カルパッチョ幹部" = "……本当に、今回の入札には興味ないのか？"
"90101090-126-オトギ" = "お、先生が出ると一気に空気が柔らかくなるねぇ。"
"90101090-127-オトギ" = "古典的だが、飴とムチは有効な戦略だ。先生が飴役とは想定外だったが。"
"90101090-128-オトギ" = "たぶん先生はそういう意図で宥めたわけじゃないと思うけど……。"
"90101090-129" = "[ns] \"私たちは、噂を流した理由が知りたいだけだよ。\""
"90101090-130-カルパッチョ幹部" = "恐怖を煽る理由くらい、大人なら分かるだろ。"
"90101090-131-カルパッチョ幹部" = "人間は感情が昂ると判断が鈍る。それが喜びでも、悲しみでも、恐怖でも……。"
"90101090-132-カルパッチョ幹部" = "感情が先に立てば理性的には考えられない。他人の言葉にも簡単に振り回される。"
"90101090-133-カヤ" = "このキヴォトスには、[ruby=・]恐[/ruby][ruby=・]怖[/ruby]が足りない。"
"90101090-134" = "[log=카야]このキヴォトスには、[ruby=・]恐[/ruby][ruby=・]怖[/ruby]が足りない。[/log]"
"90101090-135-カヤ" = "……ありったけの恐怖を見せれば、"
"90101090-136-カヤ" = "……ありったけの恐怖を見せれば、"
"90101090-137" = "誰もが私の言うことを聞くようになる。"
"90101090-138" = "[log=카야]……ありったけの恐怖を見せれば、誰もが私の言うことを聞くようになる。[/log]"
"90101090-139-カルパッチョ幹部" = "その中で最もコントロールしやすいのが「恐怖」だ。#n未知の存在は、とりあえず怖がるからな。"
"90101090-140-カルパッチョ幹部" = "そう、連邦生徒会長の特殊部隊みたいなもんだよ。#nいるかもしれない。それだけでチンピラどもは手を出しにくくなるだろ？"
"90101090-141-カルパッチョ幹部" = "本当に存在するか、何人捕まえたかなんて、重要じゃない。"
"90101090-142-ミヤコ" = "人々の恐怖の上に建てられた学園が……"
"90101090-143" = "[log=미야코]人々の恐怖の上に建てられた学園が……[/log]"
"90101090-144-ミヤコ" = "どうしてSRT特殊学園になれるというのですか？"
"90101090-145" = "[log=미야코]どうしてSRT特殊学園になれるというのですか？[/log]"
"90101090-146-ユキノ" = "………。"
"90101090-147-カルパッチョ幹部" = "組織を維持するために、似た手を借りただけだ。"
"90101090-148-カルパッチョ幹部" = "「怖い目にあいたくないなら、ウチの仕事に手を出すな」、ってな。"
"90101090-149-ユキノ" = "恐怖を植えつけるなら、他にも手段はあったはずだ。"
"90101090-150-ユキノ" = "わざわざ「カニ」の噂を選んだ理由は何だ？"
"90101090-151-カルパッチョ幹部" = "港で動く連中に馴染みがある怪談を見つけたから使っただけだ。"
"90101090-152-カルパッチョ幹部" = "「カルパッチョに逆らえばカニの餌。未知の恐怖に直面する」"
"90101090-153-カルパッチョ幹部" = "とはいえ、一番大事なのは誰も傷つかないってことだ。"
"90101090-154-カルパッチョ幹部" = "少し調べれば――いや、港で働く者ならすぐに分かる。#n[ruby=・]普[/ruby][ruby=・]通[/ruby][ruby=・]サ[/ruby][ruby=・]イ[/ruby][ruby=・]ズ[/ruby][ruby=・]の[/ruby][ruby=・]カ[/ruby][ruby=・]ニ[/ruby]に大した力は無い。"
"90101090-155-カルパッチョ幹部" = "だけど私らが相手にしてるのは不特定多数の一般人だ。"
"90101090-156-カルパッチョ幹部" = "鋭そうなハサミと硬そうな甲羅、そのイメージだけで恐怖を連想する。"
"90101090-157-カルパッチョ幹部" = "ただの噂話じゃあヴァルキューレは動かない。"
"90101090-158-カルパッチョ幹部" = "私らは形のない恐怖を利用しているだけだ。"
"90101090-159-カルパッチョ幹部" = "何も問題ないだろう？なにせ、誰も消えてないじゃないか。"
"90101090-160" = "……よくもまぁぬけぬけと。"
"90101090-161-ユキノ" = "多くの者が不安を抱き、入札が始まる前から勝者が決まってしまう。"
"90101090-162-ユキノ" = "どうして「問題がない」と言い切れる！？"
"90101090-163-カルパッチョ幹部" = "な、なんだよ急に。何か地雷踏んだか？"
"90101090-164" = "[ns] \"ユキノ、落ち着いて。\""
"90101090-165-ユキノ" = "ですが、私は――"
"90101090-166-クルミ" = "ん？何の音？"
"90101090-167-クルミ" = "なんか「カチカチ」してる？"
"90101090-168-クルミ" = "昆虫とか、節足動物が動く時みたいな……。"
"90101090-169-オトギ" = "……ゴキブリが大量発生してるとか？"
"90101090-170-クルミ" = "ゾッとすること言わないで！#nゴキブリがこんな音出すわけないでしょ！？"
"90101090-171-クルミ" = "ていうか、この揺れなに？近くで重機でも使ってるわけ？"
"90101090-172-ニコ" = "この時間に工事の予定があるなんて聞いてないよ。"
"90101090-173-ニコ" = "……それに、音がどんどん大きくなってる。"
"90101090-174-ユキノ" = "先生、下がってください。"
"90101090-175-ユキノ" = "……来ます。"
"90101090-176" = "[s] \"な、何が……？\""
"90101090-177-カルパッチョ幹部" = "なんだよアレ――！？"
