[translation]
"90101070-1" = "第7話;定期入札の公告"
"90101070-2" = "鐘崎港、「穐田水産」"
"90101070-3-店主" = "へぃらっしゃい！"
"90101070-4-店主" = "うん？嬢ちゃんは――"
"90101070-5-ニコ" = "こんにちは。いつもお世話になっています。"
"90101070-6-ニコ" = "少し早い時間ですが……もう開いてますか？"
"90101070-7-店主" = "ああ。ちょうど今、開けたとこだが……。"
"90101070-8-店主" = "配達の嬢ちゃんが来るってことは、どっかから注文が入ったのかい？"
"90101070-9-ニコ" = "いえ、今日はここでご飯をいただこうと思いまして。"
"90101070-10-ニコ" = "ふふっ、友だちも連れて来たんですよ。"
"90101070-11-クルミ" = "ここが、ニコが前に言ってたお店？"
"90101070-12-オトギ" = "見た感じは周りのお店とそんなに変わんないね。"
"90101070-13-オトギ" = "水槽にシミひとつない。それに火口もきれいだ。衛生には相当気を使っているな。"
"90101070-14-オトギ" = "これなら魚の鮮度も心配はいらなさそうだ。"
"90101070-15-店主" = "おっ、なんだなんだ嬉しいねぇ！"
"90101070-16-店主" = "若い生徒さんが喜びそうなメニューは多くないが、すぐ作れる。何でも頼んでくれ！"
"90101070-17-店主" = "あ、メニュー裏の揚げ物だけは無しだ。まだ材料が届いてなくってな。"
"90101070-18" = "[ns] \"アジフライも気になってたのに……残念。\""
"90101070-19-店主" = "で……あんたは？"
"90101070-20-店主" = "朝っぱらから女子生徒を連れて港をうろつくって、ちょっと怪しいぞ。"
"90101070-21" = "[s1] \"この子たちの保護者であり――\"\n[s2] \"ニコの雇い主……みたいな者です！\""
"90101070-22-店主" = "ああ、「狐の配達」だか何だかの社長さんか！こりゃ失敬！"
"90101070-23-店主" = "おたくんとこの配達員さんには色々と助けてもらってるよ。"
"90101070-24-店主" = "困りごとに先回りして商談を持ちかけてくるんだ。なかなかやり手だねぇ。"
"90101070-25" = "[s3] \"お目が高いですね。\"\n[s4] \"うちの生徒は全員優秀ですから。\""
"90101070-26-オトギ" = "何でそんなに誇らしげなのよ……。"
"90101070-27-オトギ" = "直球の誉め言葉は効くよねぇ。"
"90101070-28-オトギ" = "ニコの耳、真っ赤になってるよ。"
"90101070-29-ニコ" = "せ、先生！はやく決めましょう！選んで頼んじゃってください！"
"90101070-30" = "[ns5] \"そっ、それじゃあ……。\"\n[ns6] \"「気まぐれ海鮮丼」を5つください！\""
"90101070-31-店主" = "「気まぐれ海鮮丼」ね。はいよ！"
"90101070-32-ユキノ" = "これ……「気まぐれ海鮮丼」ってなんでこの名前なんですか？"
"90101070-33-店主" = "そりゃネタが決まってないからな。"
"90101070-34-店主" = "うちみたいな店の海鮮丼ってのは、刺身切った残りとか雑魚で作るんだよ。"
"90101070-35-店主" = "となりゃその日入った魚で中身が変わる。#n店主の気分で決まるから「気まぐれ」ってわけだ。"
"90101070-36-店主" = "代わりに一番安いし、運試しだってあえて頼む客もいる。"
"90101070-37-クルミ" = "え、じゃあアジの刺身だけ山盛りで出てくる可能性もあるってこと？"
"90101070-38-クルミ" = "クルミはまだ社会の闇に触れてないねぇ。#n「刺身しか乗らない」とは限らないんだよ。"
"90101070-39-クルミ" = "単価合わせでカニカマとかツナ缶が乗ってくる可能性だってある。"
"90101070-40-クルミ" = "それ海鮮丼って呼んでいいわけ！？"
"90101070-41-ユキノ" = "ツナマヨ丼も味は悪くない。カロリーがやや高いのは難点だが。"
"90101070-42-ユキノ" = "ほらよ、「気まぐれ海鮮丼」5つ！"
"90101070-43-ユキノ" = "これは……。"
"90101070-44-ユキノ" = "あの、間違ってませんか？"
"90101070-45-ユキノ" = "ほかのお客さんのマグロ丼と入れ替わった、とか……。"
"90101070-46-店主" = "なに言ってんだ。今日の一発目の注文だぞ？"
"90101070-47-店主" = "今朝マグロをさばいてたら手ぇ滑らせてな。#n切れ端が思ったより残っちまっただけだ。"
"90101070-48-店主" = "……毎日こうなるわけじゃねぇ。毎回期待すんなよ。"
"90101070-49-ユキノ" = "ふふっ、今日はツイてますね。"
"90101070-50-ユキノ" = "それじゃあ、いただきます！"
"90101070-51-クルミ" = "こっ、この味は……！？"
"90101070-52" = "[s] \"何か分かるの！？\""
"90101070-53-クルミ" = "いや、よく分かんないけど。"
"90101070-54-オトギ" = "でも、このマグロ……高い部位っぽい。高そうな味がする！"
"90101070-55-クルミ" = "私も詳しくないけど……これは絶対いいマグロって感じ。"
"90101070-56-クルミ" = "脂がのってて、口にいれたら溶けちゃうみたいで――"
"90101070-57-クルミ" = "まさか……！#nこれが「大トロ」ってやつ！？食べたことないから分かんないけど。"
"90101070-58-ユキノ" = "かかってる醤油だれも、すごく美味しいね。"
"90101070-59-ユキノ" = "柚子の香りがふわっとしていて……酸味が魚の味を邪魔せず、他の具ともよくあっています。"
"90101070-60-ユキノ" = "ああ。味のバランスが取れているな。"
"90101070-61-ユキノ" = "気まぐれという割には手が込んでいるように思うが。"
"90101070-62-店主" = "へへっ、うまそうに食ってくれるのは嬉しいねぇ。"
"90101070-63-店主" = "他のメニューも自信あるんだ。次は別のも食べに来てくれよな。"
"90101070-64-店主" = "……もっとも、来月もこの店が残ってりゃの話だが。"
"90101070-65-ニコ" = "このお店、なくなっちゃうんですか？"
"90101070-66-店主" = "いや、まだ決まったわけじゃねぇさ。"
"90101070-67-店主" = "つっても、鐘崎港の中に入ってる店は、定期的に入札で再契約する決まりでよ。"
"90101070-68-店主" = "なにせ立地が良くて来る人も多い。競争がきついったらありゃしない。#nんで、次の入札がもうすぐなんだが、最近客足が落ちてたんだ。"
"90101070-69-店主" = "だから次は諦めるか悩んでたんだが……嬢ちゃんたちに元気もらったぜ。#n来月も挑んでみる気になった。"
"90101070-70-ニコ" = "それは良かったです。"
"90101070-71-店主" = "……まぁ、うちなんかよりカルパッチョ・ファミリーのほうが大変そうだがな。"
"90101070-72-店主" = "この前、派手にやられたろ？#n次の入札で、港の「警備業務」の枠を狙ってくる連中が湧いてくるはず……。"
"90101070-73-ニコ" = "……次の入札、ですか？"
"90101070-74-店主" = "……やっちまった。"
"90101070-75-店主" = "悪ぃな。今のは聞かなかったことにしてくれ。"
"90101070-76-店主" = "カルパッチョの評判を下げたなんてバレたら、連中この店を放っとかねぇからよ……。"
"90101070-77-ニコ" = "いえ、そうではなくて――"
"90101070-78-ニコ" = "カルパッチョ・ファミリーが担っている警備業務も、入札を通して資格を得ているのですか？"
"90101070-79-店主" = "ああ。鐘崎港の仕事の大半は連邦生徒会の入札で決まる。"
"90101070-80-店主" = "ただ、今までは誰も競争に踏み込めなかったんだ。#nカルパッチョの報復が怖くてな。"
"90101070-81-店主" = "それが今回の抗争で、あいつらが「牙の抜けた虎」だと知れ渡っちまった。#nやってみようって奴も出てくるだろうさ。"
"90101070-82-店主" = "ああもう、口が滑る滑る。私としたことが……。"
"90101070-83" = "[ns] \"……ユキノ。\""
"90101070-84-ユキノ" = "はい。"
"90101070-85-ユキノ" = "もしもカルパッチョ・ファミリーが対外的なイメージを気にしているのなら。"
"90101070-86-ユキノ" = "「恐怖」をばら撒く動機は十分かと。"
"90101070-87-ニコ" = "ごちそうさまでした！"
"90101070-88-店主" = "そんな急いで食わなくたって――"
"90101070-89-ニコ" = "急に用事を思い出してしまって。"
"90101070-90-クルミ" = "また来るね～"
"90101070-91-店主" = "……まさか。"
"90101070-92-店主" = "あの子たち、カルパッチョ・ファミリーの関係者じゃねぇよな……？"
"90101070-93" = "次回;カルパッチョ・ファミリーの秘密"
