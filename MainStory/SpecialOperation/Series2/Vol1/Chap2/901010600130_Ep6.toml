[translation]
"901010600130-1-ニコ" = "すみません。"
"901010600130-2-ニコ" = "お仕事中、失礼します。#nよかったら冷えたエナジードリンク、いかがですか？"
"901010600130-3-漁師" = "あれ、この間の配達の子かい？"
"901010600130-4-漁師" = "今日も世話になるよ、ありがとう！いただくね！"
"901010600130-5-ニコ" = "ふふっ。「FOX EATS」の「いいね」、お願いしますね！"
"901010600130-6-ニコ" = "ところで、あちらの漁師さんから聞いたんですが……。"
"901010600130-7-ニコ" = "ミヤ……新入りの船員さんが失踪したって……。"
"901010600130-8-漁師" = "はあ……あの爺、またあの話を……。"
"901010600130-9-漁師" = "気にしないで。船仕事ではよくあることだよ。"
"901010600130-10-ニコ" = "そんなによくあることなんですか？"
"901010600130-11-漁師" = "そうだねぇ……仕事自体がキツくて逃げ出すヤツもいるけど……。"
"901010600130-12-漁師" = "ミヤグチは、爺が言うよう根性なしじゃない。#n口では文句ばっかだったけど、仕事は真面目にやってたんだ。"
"901010600130-13-漁師" = "俺が思うに……アイツは借金苦で逃げたんじゃないかって思ってるよ。"
"901010600130-14-ニコ" = "借金、ですか？"
"901010600130-15-漁師" = "ああ。漁師の中には借金返済のために船に乗るやつもいる。"
"901010600130-16-漁師" = "船仕事は大変な分、実入りがいいからな。"
"901010600130-17-漁師" = "だが、ミヤグチはギャンブルに手を出しちまったらしい。借金が減るどころか、むしろ増えていたとか……。"
"901010600130-18-漁師" = "結局は、「カルパッチョ・ファミリー」が牛耳ってるサラ金にも手を出したらしくて……。"
"901010600130-19-ニコ" = "カルパッチョ・ファミリーですか？"
"901010600130-20-漁師" = "ああ。港の正門で検問をしてる黒服を見たことあるだろう？あいつらだよ。"
"901010600130-21-漁師" = "この辺では結構有名な昔ながらのファミリーだよ。#n普段は鐘崎港で警事をしている。"
"901010600130-22-漁師" = "たまに、金に困っている人間に貸しているらしいんだが……#nカルパッチョ・ファミリーの金利はとんでもなく高いらしい。"
"901010600130-23-漁師" = "ギャンブルにハマったミヤグチが返済できるわけないだろう？#n借金がふくらむ前に、とんずらしたに違いない。"
"901010600130-24-ニコ" = "そんな事情があったんですね……。"
"901010600130-25-漁師" = "ああ。君はギャンブルなんかに手を出しちゃダメだよ。"
"901010600130-26-漁師" = "サラ金は言うまでもなく、ね。"
"901010600130-27-ニコ" = "はい、肝に銘じます。"
