[translation]
"901010600120-1-ニコ" = "こんにちは！"
"901010600120-2-漁師" = "おや？君はこの間、いなり寿司を持ってきてくれた子じゃないか。"
"901010600120-3-漁師" = "今日も何かのプロモーションで来たのかい？"
"901010600120-4-ニコ" = "いえ、残念ながら「FOX EATS」のレビューイベントは終了しまして……。"
"901010600120-5-ニコ" = "代わりに、イベントで余ったエナジードリンクならいっぱいあります。#n1本いかがですか？"
"901010600120-6-漁師" = "……タダなら断る理由はないね。"
"901010600120-7-ニコ" = "今日もカニはいっぱい捕れましたか？"
"901010600120-8-漁師" = "ああ。かなりの量でな。#n船が転覆するかと思ったくらいだよ。"
"901010600120-9-漁師" = "カニが底値になっていなけりゃなぁ……。"
"901010600120-10-ニコ" = "たくさんあるのに、元値で売れないのは残念ですね。"
"901010600120-11-ニコ" = "そういえば、カニってカゴで捕るんですね。"
"901010600120-12-ニコ" = "捕獲した時に脚が折れたり、ハサミが傷んじゃうという話はよく聞きますが……ここのカニはどれも状態が良いです。"
"901010600120-13-ニコ" = "こうして丁寧に水揚げしているんですから、きっとカニの価格も落ち着きますよ。"
"901010600120-14-漁師" = "……君は優しいね。"
"901010600120-15-漁師" = "みんなが君みたいだったら、新人教育も苦労しないんだろうな。"
"901010600120-16-ニコ" = "新人教育？何かあったんですか？"
"901010600120-17-漁師" = "大したことじゃあないさ。#n最近漁船で働いてた新入りが急にいなくなってしまってな……ったくミヤグチのやつどこに行ったんだか。"
"901010600120-18-漁師" = "一言くらい書き置きしていけばいいものを……。"
"901010600120-19-ニコ" = "それは大変ですね。"
"901010600120-20-ニコ" = "急にいなくなってしまうなんて……何かあったんでしょうか？"
"901010600120-21-ニコ" = "大病に罹ったとか、事故に遭ったとか……。"
"901010600120-22-漁師" = "ふんっアイツはただの根性なしなだけだ。"
"901010600120-23-漁師" = "カニ漁が辛くて逃げ出したに違いない。漁具の手入れだって文句タラタラだったからな。"
"901010600120-24-ニコ" = "カニ漁ってそんなに大変なんですか？"
"901010600120-25-漁師" = "大変ってほどじゃあない。根性さえあれば誰でもできる仕事だ。"
"901010600120-26-漁師" = "他の船員にも聞いてみるといい。#nあいつがどれだけ軟弱だったか、みんな知ってるからな。"
"901010600120-27-漁師" = "ったく、これだから最近の若者は……。"
