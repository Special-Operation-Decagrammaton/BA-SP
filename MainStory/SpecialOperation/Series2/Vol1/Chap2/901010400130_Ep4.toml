[translation]
"901010400130-1-ニコ" = "……こんにちは！"
"901010400130-2-漁師A" = "……っ！"
"901010400130-3-漁師A" = "驚かせやがって……手元が狂ったらどうするんだ。"
"901010400130-4-ニコ" = "すみません。ビッグニュースをお伝えしたくて、つい。"
"901010400130-5-漁師B" = "……ビッグニュース？"
"901010400130-6-ニコ" = "はい。夕方になったら小腹が空いてきますよね？#nそんな皆さんのために――"
"901010400130-7-ニコ" = "お得なプロモーションをご用意してきました！"
"901010400130-8-ニコ" = "今「FOX EATS」で開催中のアンケート調査にご協力いただくと――"
"901010400130-9-ニコ" = "有名いなり寿司店「吉野いなり」のお弁当を無料でプレゼントします！"
"901010400130-10-ニコ" = "この機会にいかがでしょう？"
"901010400130-11-漁師B" = "……怪しいな。"
"901010400130-12-漁師B" = "無料のお弁当……何か企んでいるのか？"
"901010400130-13-ニコ" = "もちろん食べて頂くためのアンケートには、条件がいくつかありまして……。"
"901010400130-14-ニコ" = "このアンケート調査は「FOX EATS」の製品およびサービス向上のため使用され、特定製品に関する調査および広報を目的として第3者に提供される可能性があります。調査結果は調査時点から36ヶ月間保存され、内容に異議がある場合は「FOX EATS」のお客様相談窓口へ――"
"901010400130-15-漁師B" = "……もういい、分かった。"
"901010400130-16-漁師A" = "はぁ……またどこぞのマーケティング企業が余計なことにお金を使っているようだな。"
"901010400130-17-漁師B" = "まあ、食べ物に罪はないが。"
"901010400130-18-漁師B" = "ちょうどお腹も減ってたところだし。"
"901010400130-19-漁師A" = "どれ……。"
"901010400130-20-漁師B" = "おお、これは中々……。"
"901010400130-21-漁師B" = "旨い！米がふっくらしていて、油揚げも厚みがあって……気に入った。"
"901010400130-22-漁師A" = "一つ気になるのは……。"
"901010400130-23-ニコ" = "何かありましたか？"
"901010400130-24-ニコ" = "ご意見はいつでも大歓迎です！"
"901010400130-25-漁師A" = "……この具は、カニカマか？"
"901010400130-26-漁師A" = "こんなに美味いおいなりさんなのに、カニカマを使うなんて、勿体ないな。"
"901010400130-27-ニコ" = "ですが、「本物のカニ」はすごく高いので……。"
"901010400130-28-ニコ" = "カニのような高級食材を使っては、お弁当の利益が――"
"901010400130-29-漁師A" = "いつの話をしてるんだ？カニの値段が底値まで下がって数ヶ月経ってるんだぞ。"
"901010400130-30-漁師B" = "ああ……あまりにも安くなりすぎちまった。#n最近は漁に出る回数を減らすか悩んでるくらいでな。"
"901010400130-31-漁師A" = "そうなんですか？市場やスーパーでは、まだ高いみたいですが……。"
"901010400130-32-漁師A" = "信じられないなら、あっちの物流倉庫を見てみな。#n出荷されてないカニが山ほど残っとる。"
"901010400130-33-ニコ" = "なるほど……ありがとうございます。#nいただいたフィードバックは、お店に伝えておきますね。"
"901010400130-34-ニコ" = "あ、そうだ。もう一つお伺いしたいことがあるのですが。"
"901010400130-35-ニコ" = "――「ドラム缶ガニ」について、何かご存知ですか？"
"901010400130-36-漁師A" = "ドラム缶ガニ……？カニをドラム缶に入れて輸送する業者がいるのか？"
"901010400130-37-漁師B" = "他は知らんが、うちは木箱に入れて納品するんだ。#n物流倉庫に行けば分かると思うぞ。"
"901010400130-38-ニコ" = "はい！ご協力いただき、ありがとうございました。"
"901010400130-39-ニコ" = "よい一日を！"
