[translation]
"901010400110-1-ユキノ" = "こちらFOX1。#nFOX2、目標エリアに進入できたか？"
"901010400110-2-ニコ" = "FOX2、ただいまポイントアルファに進入。#n現在トラブルはなし。引き続き作戦を進めるね。"
"901010400110-3-クルミ" = "こちらFOX3。FOX4と一緒にポイントシエラに到着。#n作戦エリアの視界は良好。こっちも問題ないわ。"
"901010400110-4-クルミ" = "さっきFOX2が検問で捕まりかけた時は、ハラハラしたけどね……。"
"901010400110-5-オトギ" = "FOX2すごかったね。本当のお弁当配達員って言っても信じちゃうくらい。"
"901010400110-6-ニコ" = "ふふっ、「FOX EATS」配達員の気持ちで作戦に臨んでいるからね。"
"901010400110-7-ニコ" = "……それでFOX1。#n最初のターゲットは誰？"
"901010400110-8-ユキノ" = "作戦エリア――鐘崎港で最近失踪したのは、カニ漁船で働いていた「ミヤグチ」という青年だ。"
"901010400110-9-ユキノ" = "新人だったようだが、金遣いも口も悪く、周囲とよく揉めていたらしい。#n噂では借金もしていたらしい。"
"901010400110-10-オトギ" = "借金に揉め事……心当たりがありすぎるねぇ。"
"901010400110-11-ニコ" = "消費者金融に手を出すと、一気に普通の生活に戻れなくなっちゃうからね……。#nみんなも気をつけるんだよ。"
"901010400110-12-クルミ" = "FOX4、聞いた？"
"901010400110-13-オトギ" = "うん……？急に私？"
"901010400110-14-クルミ" = "あんた、弾薬を受け取る時、たまにツケ払いにしてるでしょ。#nこの前だって高いハンドガードを注文したのに支払い忘れて――"
"901010400110-15-オトギ" = "ちょ、ちょっと、いつの話！？"
"901010400110-16" = "ふ～ん、今度詳しく教えてね、FOX3。"
"901010400110-17-オトギ" = "今はそんな話してる場合じゃないよね？#nさ、作戦に集中しないと。"
"901010400110-18-ユキノ" = "その通りだ、FOX2。説明を続けるぞ。"
"901010400110-19-オトギ" = "……そうだね。後でお話しよっか。"
"901010400110-20-オトギ" = "うう……。"
"901010400110-21-ユキノ" = "同僚の漁師によると……ミヤグチは1週間前、停泊中の漁船から降りた後、いなくなったとのことだ。"
"901010400110-22-ユキノ" = "荷物はそのまま船に残っていて、文字通り本人だけ行方をくらましたとのことだ。"
"901010400110-23-ニコ" = "下船しているところを見たのも同僚の漁師だけ？"
"901010400110-24-ユキノ" = "ああ。だから、漁師も今回の失踪事件の容疑者として見ている。"
"901010400110-25-ユキノ" = "なるべく慎重に近づくように。#n疑われるなよ。"
"901010400110-26-ニコ" = "大丈夫、任せて。"
"901010400110-27-ニコ" = "それで……漁師はどこにいるのかな？"
"901010400110-28-クルミ" = "3番埠頭にカニ漁船が泊まってるわ。"
"901010400110-29-クルミ" = "この時間帯なら、その辺で漁具を整理しているんじゃない？"
"901010400110-30-ニコ" = "うん、行ってくるね。"
