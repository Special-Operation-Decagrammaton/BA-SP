[translation]
"901010800110-1-警備員A" = "ただいま。"
"901010800110-2-警備員B" = "遅かったじゃん。一人で門番するの退屈なんだよね。"
"901010800110-3-警備員A" = "ごめんって。思ったよりもドラム缶が重くてよ……運ぶのに時間がかかっちまった。"
"901010800110-4-警備員B" = "慣れないと転がすのも難しいもんな。"
"901010800110-5-警備員A" = "でも中に何も入ってないドラム缶を転がして港を歩き回って、一体何の意味があるんだ？"
"901010800110-6-警備員A" = "それも深夜にさ……騒音の苦情が来るんじゃないのか？"
"901010800110-7-警備員B" = "上の考えがうちらに分かるわけないだろ？"
"901010800110-8-警備員B" = "うちらみたいな末端は、言われた通り仕事をすりゃいいんだよ。"
"901010800110-9-ニコ" = "こちらFOX2。現在、ポイントウィスキーで待機中。"
"901010800110-10-ニコ" = "指定ポイントから離れたタンゴ2の復帰を確認。その他、特にないよ。"
"901010800110-11-クルミ" = "……あいつら何やってるの？夜中にドラム缶を転がすなんて。"
"901010800110-12-クルミ" = "まさか……あのドラム缶にカニや人が入っているんじゃないわよね？"
"901010800110-13-ニコ" = "そうは見えないよ。"
"901010800110-14-ニコ" = "倉庫を出てからすぐに戻ってきたし――"
"901010800110-15-ニコ" = "ドラム缶の音が軽すぎる。中に何か入っていたらもっと重たい音がすると思うよ。"
"901010800110-16-オトギ" = "深夜のトレーニングじゃないなら、何か理由があるんだろうね。"
"901010800110-17-ユキノ" = "FOX3、ターゲットを裏門方向へ誘導できるか？"
"901010800110-18-クルミ" = "任せて。鬼ごっこなら私の専門よ。"
"901010800110-19-ユキノ" = "FOX4は現場の管制を、FOX2はターゲットの注意が逸れた隙に倉庫内部へ進入するように。"
"901010800110-20-オトギ&ニコ" = "了解。"
"901010800110-21-警備員A" = "なんの音だ？"
"901010800110-22-警備員B" = "ネコとかカラスじゃない？"
"901010800110-23-警備員A" = "いや、足音が聞こえた気がする……。"
"901010800110-24-警備員A" = "確認しに行こう。"
