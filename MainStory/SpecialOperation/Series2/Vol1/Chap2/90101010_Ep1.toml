[translation]
"90101010-1" = "第1話;恨み晴らさでおくべきか"
"90101010-2" = "鐘崎港第4埠頭"
"90101010-3-逃げ惑う船員" = "はぁっ、はぁっ……。"
"90101010-4-逃げ惑う船員" = "早く……早く逃げねぇと。"
"90101010-5-逃げ惑う船員" = "あいつら正気じゃねぇ。#nでなきゃ「あんなもん」に手を出すわけが……。"
"90101010-6-逃げ惑う船員" = "返済がちょっと遅れたけどよ……わざとじゃなかったんだ……！"
"90101010-7-逃げ惑う船員" = "あの程度の額でここまでやるか普通！？"
"90101010-8-？？？" = "たしかに大した金額じゃないよな。#nだがそれは――"
"90101010-9-カルパッチョ構成員A" = "それすら用意できないヤツの台詞じゃあねぇよなぁ？"
"90101010-10-逃げ惑う船員" = "ひっ、ひいっ……！？"
"90101010-11-逃げ惑う船員" = "す、すみません！今のは、その――"
"90101010-12-逃げ惑う船員" = "ああ、謝らなくていい。"
"90101010-13-？？？" = "今のが本音だろうが、強がりだろうが、どうでもいい。"
"90101010-14-？？？" = "だが……「見せしめ」は必要だ。#nどんな額だろうが、返済しないヤツの末路を見せてやらんとな。"
"90101010-15-逃げ惑う船員" = "み、見せしめって……まさか……。"
"90101010-16-？？？" = "ああ、知ってるのか？#nなら話は早いな。"
"90101010-17-ドラム缶" = "お前には、このドラム缶に入ってもらう。"
"90101010-18-ドラム缶" = "こいつら食い意地張ってるからな。満足するまで止まらないんだが……。"
"90101010-19-ドラム缶" = "さて……今回はどれくらい持つかな？"
"90101010-20-逃げ惑う船員" = "は、はは……なぁ、冗談だろ？冗談だって言ってくれよ！"
"90101010-21-逃げ惑う船員" = "なんでも食っちまうって噂の「化け蟹」がドラム缶にいるわけじゃないよなぁ！？"
"90101010-22-ドラム缶" = "さあな。"
"90101010-23-？？？" = "それは自分で確かめてくれ。"
"90101010-24-逃げ惑う船員" = "まっ、待てっ！借りた金の3倍……いや、5倍払う！"
"90101010-25-逃げ惑う船員" = "頼む、やめてくれ！「ドラム缶」だけは――！"
"90101010-26" = "次回;カニ味魚肉ソーセージ"
