[translation]
"201040-1" = "第4話;空色の懐かしさ"
"201040-2" = "（カヤとの面会が終わったあと、リンを連邦生徒会まで送った）"
"201040-3-リン" = "……見送りは大丈夫だと言ったはずですが。"
"201040-4-リン" = "私のせいで先生の帰宅時間が遅くなっては――"
"201040-5" = "[s1] \"気にしないで。私が好きでやってるんだから。\"\n[s2] \"むしろこんな時間に一人じゃ危ないでしょ？\""
"201040-6-リン" = "いくら事務作業が得意だとはいえ、私も連邦生徒会の一員です。#nそこらのスケバンであれば問題にもなりません。"
"201040-7-リン" = "むしろ危ないのは[USERNAME]先生のほうでは……。"
"201040-8-リン" = "……こんなことを言っても今更ですね。"
"201040-9-リン" = "それより、せっかく連邦生徒会まで来たのですから。#n少し寄っていかれてはいかがですか？"
"201040-10" = "[s3] \"お誘いは嬉しいけど……。\"\n[s4] \"生徒の家に上がるのはちょっと……。\""
"201040-11-リン" = "何を考えているんですか！"
"201040-12-リン" = "私はただ確認をお願いしたかっただけです。#n……先ほどカヤが話していた「シャーケードの杖」。"
"201040-13-リン" = "カヤには普通のスマートウォッチに見えたとしても、「シッテムの箱」のように、#n先生であればその価値が分かるかもしれません。"
"201040-14-リン" = "あれが本当に連邦生徒会長が残したオーパーツなのだとしたら、#nキヴォトスの混乱を収める一助となるか、あるいは――"
"201040-15-リン" = "連邦生徒会長の行方を掴む、鍵となりうる可能性があります。"
"201040-16-リン" = "一刻も早く調査に取りかかりたいのです。"
"201040-17" = "[s5] \"そこまで急ぐ必要はないと思うよ？\"\n[s6] \"今はもっと大事なことがあるからね。\""
"201040-18-リン" = "連邦生徒会長を探すより大事なことなど――"
"201040-19" = "[s] \"リンの休暇だよ。\""
"201040-20" = "[ns7] \"今日はお休みでしょ？\"\n[ns8] \"だから、仕事に関係することはやめておこう。\""
"201040-21-リン" = "……分かりました。"
"201040-22-リン" = "1日お付き合いいただきありがとうございました。先生もゆっくりとお休みください。"
"201040-23-リン" = "では、お先に失礼します。"
"201040-24" = "連邦生徒会長室内の倉庫"
"201040-25-リン" = "これが……聖櫃。"
"201040-26-リン" = "「シャーケードの杖」はこの中に……。"
"201040-27-リン" = "見た目には問題なさそうですが……鍵がかかっていますね。"
"201040-28-リン" = "……これは？"
"201040-29-リン" = "見たことのないマークが……連邦生徒会長が残したものではありません。#nどうして……。"
"201040-30-リン" = "刻まれている文字は……。"
"201040-31-リン" = "この者は――汝らを楽園から導きし者だ。"
"201040-32-アナウンス" = "パスワード承認。#nアクセス者、現連邦生徒会長代行、七神リン行政官。"
"201040-33-アナウンス" = "アクセス権限確認。声紋照合――99％一致。"
"201040-34-アナウンス" = "……確認完了。聖櫃の封印を解除します。"
"201040-35-リン" = "こんなに簡単に開くとは……。"
"201040-36-リン" = "これが……「シャーケードの杖」……。"
"201040-37-リン" = "普通のスマートウォッチにしか見えませんが……。"
"201040-38-リン" = "やはり、先生にお願いしましょう。"
"201040-39-リン" = "しかし……「シッテムの箱」といい、会長はどのような用途でこれを使っていたのでしょうか。"
"201040-40-リン" = "世界を完璧に制御できるのは、あなたのような超人だけなのでしょうけれど……。"
"201040-41-リン" = "それでも……先生のような大人でなければ、#nあなたが残した片鱗に近づくことすら許されないのでしょうか。"
"201040-42-リン" = "……会長。"
"201040-43-リン" = "あなたのいない世界で……私は、あなたの役割を果たせる自信がありません。"
"201040-44-リン" = "この声が聞こえたら、嘘でもいいですから――"
"201040-45-リン" = "――大丈夫だよ、と。言ってください。"
"201040-46-リン" = "私は……。"
"201040-47-？？？" = "……リンちゃん。"
"201040-48-？？？" = "もしも私が消えたら、リンちゃんはどうする？"
"201040-49-？？？" = "長期休暇をお考えでしたら、2週間前までに申請してください。"
"201040-50-？？？" = "違うよ！もしもの話！"
"201040-51-？？？" = "私が怪我とか病気で連邦生徒会に来れなくなったら――"
"201040-52-？？？" = "いきなり事故に巻き込まれて失踪しちゃったら、リンちゃんはどうする？"
"201040-53-？？？" = "想像しがたいですが、そのようなことが起きたら……。"
"201040-54-リン" = "……少し、困りますね。"
"201040-55-リン" = "会長が急にいなくなると、私のタスクが2倍になってしまいますので。"
"201040-56-？？？" = "ひどい！そんな状況でも仕事の話なの！？"
"201040-57-？？？" = "当然です。会長が処理している業務量を考えると――"
"201040-58-リン" = "キヴォトスの誰であろうと、代わりは務まりません。"
"201040-59-？？？" = "……そんなことないよ。#n努力すれば、誰だって、何でも叶えられるんだから。#nちょっと、時間はかかるだろうけど。"
"201040-60-？？？" = "私の役割なんて、そんなに大したことじゃないよ。"
"201040-61-？？？" = "でも……どんなに優秀な人でも代われないものが、1つだけあるの。"
"201040-62-？？？" = "それは……。"
"201040-63-柔らかい声" = "……リン。"
"201040-64-柔らかい声" = "……リン、起きてください。"
"201040-65-柔らかい声" = "[ruby=なながみ]七神[/ruby]リン行政官！！"
"201040-66-リン" = "……。"
"201040-67-リン" = "この声は……。"
"201040-68-？？？" = "……おはようございます。"
"201040-69-？？？" = "昨日は遅くまでお仕事をされていたんですか？"
"201040-70-？？？" = "頑張るのもいいですが、あまり無理をしては本末転倒だと何度もお伝えしていますよ。"
"201040-71-リン" = "あなたは……。"
"201040-72-リン" = "……誰ですか？"
"201040-73-リン" = "どうやってここに……？"
"201040-74-？？？" = "もう……私のことを忘れてしまったんですか？寂しいことを言わないでください。"
"201040-75-？？？" = "それとも、寝ぼけているんですか？"
"201040-76-？？？" = "では、改めて自己紹介をしましょう。"
"201040-77-？？？" = "私はあなたの古い友人であり――"
"201040-78-？？？" = "この学園都市、キヴォトスを管理する連邦生徒会の長。"
"201040-79-連邦生徒会長" = "連邦生徒会長です。"
"201040-80" = "次回;記憶の誤り"
