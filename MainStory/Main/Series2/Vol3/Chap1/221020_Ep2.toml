[translation]
"221020-1" = "第2話;オリュンポス号の帰還"
"221020-2" = "D.U.アオハマ港入口"
"221020-3-マイ" = "クロノスチャンネルをご覧の皆さん、こんにちは！#nクロノス報道部の[ruby=かざまき]風巻[/ruby]マイです！"
"221020-4-マイ" = "本日の『風巻マイの時事分析』チャンネルはアオハマ港からお送りしています。"
"221020-5-マイ" = "遠洋航海から帰ってきたオデュッセイア海洋高等学校！#n4ヶ月ぶりの帰港を一目見ようと、すでに多くの市民がやってきています！"
"221020-6-マイ" = "港湾管理局のお偉方に……あっ、連邦生徒会の役員もいますね！"
"221020-7-マイ" = "すみません！クロノスチャンネルです！#n少しインタビューを――"
"221020-8-マイ" = "ちっ……一言くらい答えたって減るもんじゃないでしょ。"
"221020-9-マイ" = "コホン、ともあれ。"
"221020-10-マイ" = "皆さんもご存じの通り、オデュッセイア海洋高等学校は海洋活動に特化した学園です。#n一度航海に出れば、最低でも1年は海の上で生活することでも有名なのですが――"
"221020-11-マイ" = "出航してまだ半年も経っていないタイミングでの電撃帰港！#n残りの航海日程を突然取りやめてD.U.へ戻ってきたそうです！"
"221020-12-マイ" = "オデュッセイアが航海を中断し、陸へ引き返した理由とはいったい何なのか？"
"221020-13-マイ" = "未だ学園側からの発表がなく詳細は不明ですが、#nシャーレの先生が訪問を要請したという噂もあります！"
"221020-14-マイ" = "つまり……シャーレが捜査しなければならないほどの事件が#nオデュッセイアで発生したということなのでしょうか！？"
"221020-15-マイ" = "それともただの先生の気まぐれなのか！？"
"221020-16-マイ" = "おっと、噂をすれば[USERNAME]先生です！"
"221020-17-マイ" = "こんにちは、先生！クロノスチャンネルです！"
"221020-18" = "[s1] \"こんにちは。\"\n[s2] \"さすが、いい嗅覚してるね……。\""
"221020-19-マイ" = "もちろんです！キヴォトス各地の話題を誰よりも早くお届けする！#nそれがクロノススクール報道部ですから。"
"221020-20-マイ" = "それはそうと先生。#n今回の件に先生が関わっているという噂は本当なんですか？"
"221020-21" = "[s] \"関係あると言うべきか、ないと言うべきか……。\""
"221020-22-マイ" = "ほほう？スクープの香りがしますね……。"
"221020-23-マイ" = "シャーレの先生が直々に動くとなれば、#nオデュッセイアに何かあるということですよね？"
"221020-24-マイ" = "悩み相談ですか？それとも部活同士の揉め事？#nあるいは[ruby=アイランド]オデュッセイア生徒会[/ruby]との極秘会談――"
"221020-25-マイ" = "まさかまさか、最近ネットで話題の[ruby=ロア]都市伝説[/ruby]に関わる件だったり？"
"221020-26" = "[s] \"えっと、それが……。\""
"221020-27-？？？" = "先生をあまり困らせないでいただけますか、[ruby=かざまき]風巻[/ruby]さん？"
"221020-28-連邦生徒会長" = "先生は様々な相談を受けていらっしゃいます。#n口に出せないこともその分たくさんあるのですよ。"
"221020-29-連邦生徒会長" = "取材熱心なのは結構ですが、相手を困らせるのは本末転倒ではありませんか？"
"221020-30-マイ" = "れ、連邦生徒会長！？"
"221020-31-マイ" = "まさか……歓迎式に連邦生徒会長も参加されるんですか！？"
"221020-32-マイ" = "ええ。何か問題でも？"
"221020-33-マイ" = "いえ、ただ……ほとんど外出されない連邦生徒会長が、#n一学園の行事に足を運ぶだなんて――"
"221020-34-マイ" = "スクープどころの騒ぎじゃないですよ！"
"221020-35-連邦生徒会長" = "ふふ。聞きたいことがたくさんあるようですね。"
"221020-36-連邦生徒会長" = "……よろしければ行事の後に、インタビューの場を設けましょうか？"
"221020-37-連邦生徒会長" = "気分次第では……#nまだ話したことのないプライベートなことまでお答えするかもしれませんよ。"
"221020-38-マイ" = "いいんですか！？ぜひ、なにとぞ……！"
"221020-39-連邦生徒会長" = "では……今は、先生との先約がありますので、これで。"
"221020-40-マイ" = "マイ先輩、追わなくていいんですか？"
"221020-41-マイ" = "連邦生徒会長の視察なんて、特ダネも特ダネ――"
"221020-42-マイ" = "うるさい！絶好のチャンスを潰す気！？#n下手に追って機嫌を損ねられる方が困るの！"
"221020-43-マイ" = "連邦生徒会長の単独インタビューなんて、#n1年前から申請しても通るかどうかなのよ！？"
"221020-44-マイ" = "この案件でクロノスチャンネルの最高再生数を更新できるかも……！"
"221020-45-連邦生徒会長" = "……これで一息つけましたね。"
"221020-46" = "[s3] \"助けてくれてありがとう。\"\n[s4] \"おかげで窮地を抜けられたよ……。\""
"221020-47-連邦生徒会長" = "いえいえ。#nクロノススクールの皆さんの熱意には、調停室長も頭を抱えていましたから。"
"221020-48-連邦生徒会長" = "良い機会ですし、ゆっくりお話しできそうですね。"
"221020-49" = "[ns5] \"それはそうと、一緒に来て大丈夫だったの？\"\n[ns6] \"玉について聞くだけなら、私一人でもよかったのに。\""
"221020-50-連邦生徒会長" = "あら、私と一緒では居心地が悪かったですか？"
"221020-51-連邦生徒会長" = "自分の立場をもっと考えるべきでしたね……#n先生に負担をかけてしまい――"
"221020-52" = "[s] \"そうじゃなくって！\""
"221020-53" = "[ns7] \"仕事がいつも忙しいでしょ？\"\n[ns8] \"無理やり時間を作らせちゃったかなって。\""
"221020-54-連邦生徒会長" = "常に忙しいのは否定しませんが、座りっぱなしでは健康に悪いですから。"
"221020-55-連邦生徒会長" = "こうやって外の空気を吸うための「口実」があると、気分転換がしやすいんです。"
"221020-56-連邦生徒会長" = "それに、オデュッセイアは海洋学園ならではの趣があって、#n見ているだけでも楽しいんですよ？"
"221020-57" = "[s] \"前にもオデュッセイアに来たことがあるの？\""
"221020-58-連邦生徒会長" = "いえ、こうしてオデュッセイアに来るのは初めて――"
"221020-59-連邦生徒会長" = "――2度目ですね。"
"221020-60" = "[ns] （なんだろう……この妙な感じ、前にも……）"
"221020-61-連邦生徒会長" = "先生。あちらをご覧ください。"
"221020-62-連邦生徒会長" = "まもなく、オデュッセイアの生徒会「アイランド」の旗艦、#nオリュンポス号が接岸するようです。"
"221020-63-連邦生徒会長" = "綱取り作業のために、陸上作業員が[ruby=がんぺき]岸壁[/ruby]で待機しています。"
"221020-64-オデュッセイアの生徒A" = "接岸準備！艦内常時閉鎖！"
"221020-65-オデュッセイアの生徒C" = "陸上作業員配置確認！"
"221020-66-オデュッセイアの生徒B" = "[ruby=げんもん]舷門[/ruby]位置、前へならえ！"
"221020-67-オデュッセイアの生徒C" = "前部ブレストライン！引いて保持！そのままだと持ってかれるぞ！"
"221020-68" = "[ns] \"ずいぶん緊張感があるね。\""
"221020-69-連邦生徒会長" = "あれが最適化されたやり方なのではないでしょうか？"
"221020-70-連邦生徒会長" = "巨大な船を動かすには、寸分の狂いもない動きが求められますから。"
"221020-71-連邦生徒会長" = "なにせ、船を繋いでいる係留索の張力は数十トンに及びます。#n切れてしまえば大事故になりかねません。"
"221020-72" = "[s] \"そう、だよね……。\""
"221020-73-連邦生徒会長" = "……先生が懸念されていることも分かります。#nあれだけ人数がいれば、空気に馴染めない生徒がいるかもしれない――"
"221020-74-連邦生徒会長" = "ですが、それは学園の領分です。#n連邦生徒会長であっても安易に介入はできません。"
"221020-75-連邦生徒会長" = "シャーレの先生なら、可能かもしれませんが。"
"221020-76-オデュッセイアの生徒A" = "オリュンポス号、着岸！"
"221020-77-オデュッセイアの生徒C" = "作業完了。陸上作業員、配置解除。"
"221020-78-オデュッセイアの生徒B" = "配置解除！お疲れさまでした！"
"221020-79-スミカ" = "は、初めまして、連邦生徒会長！#n本日、会長の警護を担当させていただく、トライデントの[ruby=こもり]小森[/ruby]スミカであります！"
"221020-80-スミカ" = "こ、このたびは我が校へご来訪くださり、大変なご負担――#nじゃなくて、光栄であります！"
"221020-81-スミカ" = "下船されるその時まで、身辺警護は我らトライデントにお任せください！"
"221020-82-連邦生徒会長" = "小森さん、ありがとうございます。"
"221020-83-連邦生徒会長" = "[USERNAME]先生も、ご一緒してよろしいでしょうか。"
"221020-84-スミカ" = "え、あっ、そちらは……シャーレの[USERNAME]先生ですね！"
"221020-85-スミカ" = "……[USERNAME]先生！？"
"221020-86" = "[ns9] \"また会ったね。\"\n[ns10] \"前に万魔殿と一緒の時に会ったよね？\""
"221020-87-スミカ" = "あっ、あう、ああっ……！"
"221020-88-スミカ" = "どっ、どうして先生がオデュッセイアに……？"
"221020-89-スミカ" = "ま、まさか……先生の乗っていた船を海賊船だと勘違いして攻撃した件ですか……？#nそれで直々に抗議を――"
"221020-90" = "[s] \"あの時のことは大丈夫だって……。\""
"221020-91-スミカ" = "はいっ、それは承知しています！#n承知していますが……。"
"221020-92-スミカ" = "……ほんと～に、あの件では……ないですよね？"
"221020-93" = "[s] \"本当に本当だよ。\""
"221020-94-スミカ" = "そ、それなら良かったです……。"
"221020-95-スミカ" = "あの件については、存在しない敵船に発砲して砲弾を無駄にした、と#n副部長に大目玉を食らったばかりでして。"
"221020-96-スミカ" = "いま以上に減点を重ねると、ひじょ～にマズくて――"
"221020-97-スミカ" = "――はっ！これは良い機会なのでは……？"
"221020-98-スミカ" = "本日の当直である、この小森スミカが！お二人を全力でエスコートいたします！#nそ、それで、その……別に見返りというわけじゃないんですが……#nお帰りになる前に「今日の当直はとても親切だった」と一言いただけると～……えへっ！"
"221020-99-スミカ" = "小森さん、タラップを昇る時に注意すべきことはありますか？"
"221020-100-スミカ" = "特にありません！どうぞお進みください！"
"221020-101-スミカ" = "連邦生徒会長、ならびにシャーレの先生が乗船されます！"
"221020-102" = "（初めて目にしたオデュッセイアの姿は、#n船というよりも巨大な海上都市のように感じられた）"
"221020-103" = "（幾層もの艦橋が高層ビルのようにそびえ立ち、#n長期間の航海を終えた後にも関わらず、すべてが白く輝いていた）"
"221020-104" = "[ns11] \"これが……船なの？\"\n[ns12] \"数千人が住めそうな規模だけど……。\""
"221020-105-スミカ" = "もちろんですとも！#n速度はあまり出ませんが、はるか昔からキヴォトスの大海原を航海してきた、#nオデュッセイアの旗艦であります！"
"221020-106-スミカ" = "実は私も乗るのは初めてですけど……。"
"221020-107-スミカ" = "……あれ？"
"221020-108-スミカ" = "これはこれは。"
"221020-109-連邦生徒会長" = "この仰々しい[ruby=かんえつしき]観閲式[/ruby]も歓迎行事の一つですか？"
"221020-110-スミカ" = "そ、その……私もオリュンポスに乗船するのは初めてで勝手が分からないのですが……。"
"221020-111-スミカ" = "皆さん下がってください！#nお二人の警護は私たちトライデントの担当です！"
"221020-112-アイランド部員A" = "艦長、入校。"
"221020-113-アイランド部員B" = "艦長、入校！"
"221020-114" = "[ns] \"艦長……？\""
"221020-115" = "[ns] \"あの2人が……。\""
"221020-116-連邦生徒会長" = "会長職、副会長職に相当する「艦長」と「副長」なのでしょう。"
"221020-117-連邦生徒会長" = "ふふっ……想像以上に、優秀そうですね。"
"221020-118-アイランド部員" = "前方に対し、[ruby=ささげつつ]捧げ銃[/ruby]！"
"221020-119-アミ" = "お会いできて光栄です、連邦生徒会長。#n……そして、[USERNAME]先生。"
"221020-120-アミ" = "私はアイランドの部長を務める、#n[ruby=うみじ]海路[/ruby]ミナトと申します。"
"221020-121-アミ" = "船まで、ご足労をおかけしました。"
"221020-122-連邦生徒会長" = "いえ、無理な要請をしたのはこちらですから。"
"221020-123-連邦生徒会長" = "お会いできて嬉しいです、海路艦長。"
"221020-124-連邦生徒会長" = "そちらは――"
"221020-125-アミ" = "アイランドの副部長を務めます、#n[ruby=ともした]灯下[/ruby]アミです。"
"221020-126-アミ" = "ご多忙にも関わらず、貴重なお時間をいただきありがとうございます。"
"221020-127-連邦生徒会長" = "……なるほど、そうでしたか。"
"221020-128-連邦生徒会長" = "初めまして、灯下副長。本日はどうぞよろしくお願いいたします。"
"221020-129-連邦生徒会長" = "そして、こちらは――"
"221020-130" = "[ns13] \"シャーレの先生です。\"\n[ns14] \"これからよろしく！\""
"221020-131-アミ" = "……あなたが。"
"221020-132-ミナト" = "噂には聞いていますよ。#n連邦生徒会長直属の超法規的組織――シャーレの[ruby=・]大[/ruby][ruby=・]人[/ruby]。"
"221020-133-ミナト" = "初めまして、[USERNAME]先生。"
"221020-134-ミナト" = "オデュッセイア海洋高等学校へのご来校を心より歓迎いたします。"
"221020-135" = "次回;海の禁忌"
