[translation]
"221040-1" = "第4話;白い制服とカレー"
"221040-2" = "オリュンポス号・アイランド士官室"
"221040-3-ミツキ" = "本日の夕食は、タラのフィレを添えたシーフードカレーです。"
"221040-4-ミツキ" = "どうぞ、お召し上がりください。"
"221040-5" = "[ns1] \"見た目は普通のカレーだけど……。\"\n[ns2] \"何が問題なの？\""
"221040-6-ミナト" = "それが……。"
"221040-7-ミナト" = "オデュッセイアの伝統として、入港した日は全艦で夕食にカレーを食べます。"
"221040-8-アミ" = "好き嫌いが分かれにくいですし、航海中に使い切れなかった食材を一気に消費できるので。"
"221040-9-アミ" = "ただ、一部の生徒は味の好みとは別の理由で、カレーを嫌がることがありまして……。"
"221040-10-連邦生徒会長" = "アレルギーの問題ですか？"
"221040-11-アミ" = "いえ、そういう類でもなく――"
"221040-12-アミ" = "カレーは白い服に跳ねると、落としにくいんです。"
"221040-13-連邦生徒会長" = "なるほど。"
"221040-14-ミツキ" = "連邦生徒会長。差し出がましいのは承知ですが、ご無理はなさらずとも……。"
"221040-15-ミツキ" = "跳ねたカレーが落ちないのを嫌がって、#n制服が黒いと言う理由でトライデントに志願した生徒までいるので……。"
"221040-16-連邦生徒会長" = "お気遣いありがとうございます。#nですが、せっかくのおもてなしを無下にするつもりはありません。"
"221040-17-連邦生徒会長" = "では……いただきます。"
"221040-18-連邦生徒会長" = "この味は――"
"221040-19" = "[ns] \"シーフードとカレーのマリアージュ……。\""
"221040-20-ミナト" = "カレーは香辛料の集合体。#n良い風味を引き立てるのはもちろんのこと、臭み消しにもなります。"
"221040-21-ミナト" = "海鮮の生臭さが苦手でも、シーフードカレーなら食べられる生徒も多いんですよ。"
"221040-22-ミナト" = "もちろん、クルーズ運営部の調理の腕が確か、というのもありますが。"
"221040-23" = "[ns3] \"タラのフィレ、すごく合うね！\"\n[ns4] \"美味しすぎてスプーンが止まらない……！\""
"221040-24-ミナト" = "……先生。"
"221040-25-ミナト" = "魚はひっくり返さずに、骨を外しながら召し上がるのをおすすめします。"
"221040-26" = "[s] \"……それも船上の[ruby=タブー]禁忌[/ruby]なの？\""
"221040-27-ミナト" = "はい。ご不便をおかけしますが、ご理解ください。"
"221040-28" = "[s] \"まあ、難しくないし構わないけど……。\""
"221040-29" = "（落ち着いた空気の中で夕食は続いた）"
"221040-30-連邦生徒会長" = "……ごちそうさまでした。"
"221040-31" = "[ns5] \"ごちそうさま！\"\n[ns6] \"すっごく美味しかったよ！\""
"221040-32-ミツキ" = "お口に合ったようですね。#n張り切って用意した甲斐がありました。"
"221040-33-ミツキ" = "厨房の生徒にも、感想を伝えておきます。"
"221040-34-ミツキ" = "実は、ハバネロソースをたっぷり混ぜた「当たり」を用意する案も――"
"221040-35-ミツキ" = "絶対にやめてください。外交問題を起こすつもりですか。"
"221040-36-スミカ" = "それにしても連邦生徒会長、白いお召し物を汚すことなく完食されるとは……！"
"221040-37-スミカ" = "やはり「超人」の噂に偽り無しなのですね……！"
"221040-38-スミカ" = "「超人」の呼び名はそういう意味ではないと思いますが。"
"221040-39-連邦生徒会長" = "お褒めにあずかり光栄です。#nですが、服にまで気を回していたつもりはありません。"
"221040-40-連邦生徒会長" = "夢中で食べていたら、こうなっていただけでして。"
"221040-41-連邦生徒会長" = "それを無意識で……？"
"221040-42-ミナト" = "洗濯で頭を抱えている生徒が大勢いるのに……#nぜひとも秘訣を教えていただきたいですね。"
"221040-43-ミナト" = "よろしければ、次に訪問される時のお食事はカレーうどんにして――"
"221040-44-連邦生徒会長" = "変なことを連邦生徒会長で試さないでください。"
"221040-45-ミナト" = "はい……。"
"221040-46-ミナト" = "さて、そろそろ本題に入りましょうか。"
"221040-47-ミナト" = "申し訳ないけど、アミ副長以外は席を外してもらえるかな。"
"221040-48-ミナト" = "学園の機密を取り扱う可能性があるから。"
"221040-49-スミカ" = "承知しました。"
"221040-50-スミカ" = "会談が終わり次第、必ずお呼びください！"
"221040-51-ミナト" = "…………はぁ。"
"221040-52-ミナト" = "疲れた……。"
"221040-53-アミ" = "艦長。まだ会談は始まってすらいません。姿勢を正してください。"
"221040-54-ミナト" = "でも……他のオデュッセイアの生徒がいない時くらい、#n肩の力を抜いてもいいと思わない？"
"221040-55-ミナト" = "きっと連邦生徒会長も先生も、これくらい気にしないよ。"
"221040-56-アミ" = "艦長！"
"221040-57-連邦生徒会長" = "ふふっ。"
"221040-58-連邦生徒会長" = "やはり、普段の[ruby=うみじ]海路[/ruby]艦長はこういった雰囲気なのですね。"
"221040-59-ミナト" = "締まりのない姿をお見せしてしまい、申し訳ありません……。"
"221040-60" = "[s] \"私はこっちの方が話しやすいよ。\""
"221040-61-ミナト" = "ほら、副長。先生もこうおっしゃってるんだからさ。"
"221040-62-アミ" = "……ちっ。"
"221040-63-ミナト" = "舌打ち！？"
"221040-64-アミ" = "はぁ……では、会談を始めましょう。"
"221040-65-アミ" = "我が校について気になることがあれば、この機会に遠慮なくお尋ねください。"
"221040-66" = "[s] \"うーん……真っ先に気になったのは――\""
"221040-67" = "[ns7] \"オデュッセイアは、迷信に敏感すぎる気がして。\"\n[ns8] \"学園ごとに文化が違うのは知ってるけど……。\""
"221040-68-アミ" = "……たしかに、気にすることは多いですね。"
"221040-69-ミナト" = "先生は、沖へ出られたことはありますか？"
"221040-70-ミナト" = "陸に近い海は、風も穏やかで波が甲板を越えることは滅多にありません。#nですが遠洋では話が違います。#n刻一刻と風向きが変わり、波が甲板を叩きつけることも珍しくありません。"
"221040-71-ミナト" = "そういった気まぐれな環境で船を動かしていると、危険は簡単にやってきます。"
"221040-72-ミナト" = "重い荷に弾かれたり、海に落ちたり、油で燃えたり……。"
"221040-73-ミナト" = "命を脅かす状況に備えるため、船乗りは[ruby=・]ル[/ruby][ruby=・]ー[/ruby][ruby=・]ル[/ruby]を作ってきました。"
"221040-74-ミナト" = "それこそが――禁忌。"
"221040-75-ミナト" = "荒唐無稽な迷信に思えても、それは船乗りが長い歴史の中で積み上げた、#n血と汗の「安全指針」なんです。"
"221040-76" = "[s] \"口笛とか、ウサギも？\""
"221040-77-ミナト" = "ええ。#n1つ、例を挙げましょう。"
"221040-78-ミナト" = "「水面で垂直に浮いて溺れている者は助けない」という禁忌があります。#nなぜ、そんな禁忌が作られたと思いますか？"
"221040-79" = "[s9] \"う～ん……。\"\n[s10] \"魔物が海に引っ張り込もうとしてるから……とか？\""
"221040-80-ミナト" = "そう考える生徒も多いです。#nですが、真の理由は別にあります。"
"221040-81-ミナト" = "溺れている者が水面に対して垂直の姿勢の場合、#n渦流に引き込まれている可能性が高いのです。"
"221040-82-ミナト" = "下手に近づけば救助者も危険に巻き込まれかねない。#nだからこそルールとして作られ、今なお禁忌として伝わっているんです。"
"221040-83-ミナト" = "口笛やウサギも同じです。"
"221040-84-ミナト" = "船の警報や救難信号は、口笛の高い音に似ています。#nゆえに、誤認を防ぐために口笛がタブーに。"
"221040-85-ミナト" = "ウサギは木造船の時代に、船体を傷つけかねないという理由でタブーとなり、#n今に残っているのでしょう。"
"221040-86" = "[s] \"魚をひっくり返して食べちゃいけないのは……？\""
"221040-87-ミナト" = "……由来の分からないものもあります。"
"221040-88-ミナト" = "身が崩れるのを嫌って禁じた……といったところではないでしょうか？"
"221040-89-連邦生徒会長" = "すべてに納得はできずとも、理由もなく押しつけているわけではない、#nということですね。"
"221040-90-ミナト" = "はい。[ruby=・]そ[/ruby][ruby=・]う[/ruby][ruby=・]い[/ruby][ruby=・]う[/ruby][ruby=・]も[/ruby][ruby=・]の[/ruby]として覚えて、守っていくんです。"
"221040-91" = "[ns] \"でも、それだと限界があるよね。\""
"221040-92" = "[ns] \"もしも禁忌にない事態が起きたら――\""
"221040-93-ミナト" = "先生。私たちを呼び戻したのは、禁忌の話をするためですか？"
"221040-94-連邦生徒会長" = "……いいえ。違います。"
"221040-95-連邦生徒会長" = "先日、オデュッセイアからと思われる遭難信号を[USERNAME]先生が発見しました。"
"221040-96-ミナト" = "遭難信号、ですか？"
"221040-97-アミ" = "それが本当なら、一体誰が……。"
"221040-98-連邦生徒会長" = "お二人は、これについて何かご存じありませんか？"
"221040-99-アミ" = "これは……！"
"221040-100-アミ" = "良かった。心当たりがあるようですね。"
"221040-101-ミナト" = "ええ、よく知っています。#nこの玉は、私が作った物ですから。"
"221040-102-ミナト" = "前の航海で海に落としてしまったのですが――"
"221040-103-サミー" = "――にゃっ！"
"221040-104-アミ" = "サミー！"
"221040-105-アミ" = "すみません。サミーがまた悪さを……。"
"221040-106-アミ" = "サミー、こっちへ来なさい！#n本気でお仕置きされたいの？"
"221040-107-？？？" = "にゃあん……。"
"221040-108-ミナト" = "あらら……騒がしくなってしまいましたね。"
"221040-109-連邦生徒会長" = "でも、おかげで答え合わせができました。"
"221040-110-連邦生徒会長" = "海路艦長。あの玉は、何のために作られたものなのですか？"
"221040-111-ミナト" = "見てのとおり――"
"221040-112-ミナト" = "サミーのおもちゃです。"
"221040-113" = "次回;年老いた猫、サミー"
