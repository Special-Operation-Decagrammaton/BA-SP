[translation]
"221010-1" = "第1話;S.O.S."
"221010-2" = "（仕事の都合で、D.U.の港から出る連絡船のチケットを予約した）"
"221010-3" = "（初めてということもあり、遅れないようアロナに道案内を頼んだのだが――）"
"221010-4" = "（――埠頭に着いた時には、すでに乗船受付が終了していた）"
"221010-5" = "[ns] \"アロナ……。\""
"221010-6-アロナ" = "こ、今回は間違っていません！"
"221010-7-アロナ" = "スーパーアロナの計算通りなら、余裕を持って着けるはずで……#n実際、まだ出航時間の前ですし！"
"221010-8-アロナ" = "肯定。たしかに、先輩の[ruby=・]計[/ruby][ruby=・]算[/ruby][ruby=・]は[/ruby]正しかったです。"
"221010-9-プラナ" = "ですが船は出航準備に時間がかかるため、出航15分前には錨を上げ、#n桟橋を引き上げて乗船できなくなる場合があります。"
"221010-10-プラナ" = "従って、もっと余裕を見ておくべきでした。"
"221010-11-プラナ" = "そもそも！約束の時間より先に出ちゃった船が悪いんですよ！"
"221010-12-アロナ" = "アロナの計算は完璧だったのに……！"
"221010-13-アロナ" = "うぅ……ごめんなさい。"
"221010-14-アロナ" = "ちゃんと確認していれば、乗り遅れずにすみましたよね……。"
"221010-15" = "[ns1] \"大丈夫。気にしなくていいよ。\"\n[ns2] \"把握してなかったのは私も同じだから。\""
"221010-16" = "[ns] \"せっかく時間ができたし……宝探ししない？\""
"221010-17-アロナ" = "宝探し……ですか？"
"221010-18-プラナ" = "困惑。この付近に宝が埋まっている、という情報は聞いたことがありません。"
"221010-19" = "[ns3] \"綺麗な貝殻とか、丸い小石とか。\"\n[ns4] \"そういうのも、立派な宝物だよ。\""
"221010-20" = "[ns] \"宝物の発見者にはイチゴミルクをご馳走しよう。\""
"221010-21-アロナ" = "わーい！"
"221010-22-アロナ" = "先生！あっちです！"
"221010-23-アロナ" = "あの岩の下！綺麗な貝殻がありますよ！"
"221010-24-アロナ" = "これはキサゴの一種ですね。"
"221010-25-プラナ" = "浜辺によくある貝で、環境によって色や模様が変化します。"
"221010-26-プラナ" = "この近郊では濃い珊瑚色にはならないはずなのですが……#nおそらく、別の場所から運ばれてきたのでしょう。"
"221010-27" = "[ns5] \"すごく綺麗な色だね。\"\n[ns6] \"アロナ、良い発見だね！\""
"221010-28-アロナ" = "ふふん、スーパーアロナの目を持ってすればお茶の子さいさいです！"
"221010-29-アロナ" = "どこかにボトルメールとか落ちてないですかね～#n運が良ければ、埋蔵金の在処を示す地図が入ってるかもしれません！"
"221010-30-プラナ" = "……否定。この浜辺は港湾管理局が定期的に清掃しています。#nボトルメールのような漂着物は片づけられている可能性が高いです。"
"221010-31-プラナ" = "加えて、完全な状態のボトルメールは回収率が低く、そう簡単には見つかりません。"
"221010-32-プラナ" = "瓶があったとしても、観光客が捨てたゴミでしょう。"
"221010-33-アロナ" = "もう、どうしてプラナちゃんはそんなに否定的なんですか？#nロマンが欠けてますよ！"
"221010-34-アロナ" = "流れ着いたボトルメールには、夢がぎゅーっと詰まったお手紙が入ってるものなんです！"
"221010-35-プラナ" = "孤島に閉じ込められたお姫様の救助要請とか、未来に宛てた手紙とか～"
"221010-36-アロナ" = "……あれ？"
"221010-37-アロナ" = "先生！見てください、あそこ！#n小さいボールが流れてきました！"
"221010-38-アロナ" = "ロープを編んで作ってあるみたいですけど……。"
"221010-39" = "[ns] \"どれどれ……？\""
"221010-40-プラナ" = "使用されているのは、強度の高いポリエステルロープです。#n構造に特筆すべき点は見当たりません。"
"221010-41-プラナ" = "……注目。反対側に何か書いてあります。"
"221010-42-アロナ" = "S、O、S……？"
"221010-43-プラナ" = "これはまさか……。"
"221010-44-アロナ" = "遭難信号です！"
"221010-45-アロナ" = "誰かが助けを求めてこの玉を投げたに違いありません！#n早く救助船を――"
"221010-46" = "[s7] \"アロナ、落ち着いて。\"\n[s8] \"気持ちは分かるけど、もう少し確かめよう。\""
"221010-47-アロナ" = "うぅっ……そうですね……。"
"221010-48-アロナ" = "この玉には「S.O.S.」以外、他には何も……。"
"221010-49-アロナ" = "これでは誰が助けを求めているのか分かりません。"
"221010-50-プラナ" = "D.U.の海岸で見つかった……これが遠洋から流れてきたとすれば……。"
"221010-51" = "[s] \"何か心当たりがあるの？\""
"221010-52-プラナ" = "まだ確信はありません。"
"221010-53-プラナ" = "……もしかすると[ruby=・]彼[/ruby][ruby=・]女[/ruby]なら知っているかもしれません。#n気は進みませんが。"
"221010-54-連邦生徒会長" = "これは――"
"221010-55-連邦生徒会長" = "オデュッセイア海洋高等学校で作られたものですね。"
"221010-56" = "[s9] \"即答？\"\n[s10] \"見ただけで分かるの？\""
"221010-57-連邦生徒会長" = "まさか。いくら私でも、そこまで全知全能というわけではありません。"
"221010-58-連邦生徒会長" = "ですが、材質や痕跡から推測はできます。"
"221010-59-連邦生徒会長" = "使われているロープは、日差しや湿気に強いポリエステル素材。"
"221010-60-連邦生徒会長" = "主に工事現場や埠頭で重い物を引っ張る時に使われます。"
"221010-61-連邦生徒会長" = "そして、この青い[ruby=へんそしき]編組式[/ruby]のロープはオデュッセイアにしか卸されていない特注品です。#n他の作業場では入手が難しいでしょう。"
"221010-62-連邦生徒会長" = "また、このボールはモンキーフィストノットで作られています。#nこれは船乗りが好んで使う結び方ですので。"
"221010-63" = "[s] \"じゃあ、この遭難信号はオデュッセイアから？\""
"221010-64-連邦生徒会長" = "遭難信号とは断言できませんが、#nオデュッセイアから流れてきた可能性は高いでしょう。"
"221010-65-連邦生徒会長" = "よろしければ、こちらで詳しく調べましょうか？"
"221010-66" = "[s] \"お願いしてもいいかな。\""
"221010-67" = "[ns11] \"そういえば、オデュッセイアってどこにあるの？\"\n[ns12] \"噂は聞くけど、まだ行ったことなくて。\""
"221010-68-連邦生徒会長" = "……今は遠洋に出ているので、訪ねるのは難しいかと。"
"221010-69-連邦生徒会長" = "オデュッセイアの主船団は現在、D.U.から1500海里――#nつまり約2700km離れた海域を航行中です。"
"221010-70-連邦生徒会長" = "快速船を休まず走らせたとしても、到着まで2日以上はかかると思います。"
"221010-71" = "[s13] \"そんなに遠くにいるの！？\"\n[s14] \"いっつもそんな遠くに？\""
"221010-72-連邦生徒会長" = "いえ、基本的にはD.U.近海に留まり、#n他の学園との交流や港湾業務の補助をしているのですが――"
"221010-73-連邦生徒会長" = "ちょうど先生がキヴォトスにいらっしゃる数ヶ月前に、オデュッセイアは遠洋へと航海に出てしまいまして。"
"221010-74" = "[s] \"今回みたいな航海はよくやってるの？\""
"221010-75-連邦生徒会長" = "そうですね、二年に一度くらいのペースでしょうか。"
"221010-76-連邦生徒会長" = "遠洋に出て航海術を磨き、生徒同士の結束を高めるための恒例行事です。"
"221010-77-連邦生徒会長" = "近代的な艦船が開発される前から続く伝統で、#nオデュッセイアの生徒にとっては通過儀礼ともいえるものでして。"
"221010-78-連邦生徒会長" = "とはいえ、矯正局に入れられたみたいだ、と嫌がる生徒もいるようです。#n航海中は陸からの補給ができず、他の学園とも連絡が取れませんからね。"
"221010-79" = "[s15] \"それは困ったね……。\"\n[s16] \"オデュッセイアの現状を知る方法は無いってこと？\""
"221010-80-連邦生徒会長" = "まったく無いわけではありません。"
"221010-81-連邦生徒会長" = "あくまで通じないのは通常回線の話です。連邦生徒会は連絡手段を持っていますよ。"
"221010-82-連邦生徒会長" = "調停室長。今すぐ「アイランド」に打電してもらえますか？"
"221010-83-連邦生徒会長" = "内容は次の通りでお願いします。"
"221010-84-連邦生徒会長" = "オデュッセイアの全船団は、直ちにD.U.へ帰港せよ――"
"221010-85" = "次回;オリュンポス号の帰還"
