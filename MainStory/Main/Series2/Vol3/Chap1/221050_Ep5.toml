[translation]
"221050-1" = "第5話;年老いた猫、サミー"
"221050-2" = "[ns] \"おもちゃ……！？\""
"221050-3-ミナト" = "ええ。猫は動くものが好きですから。"
"221050-4-ミナト" = "布やゴムのボールだとすぐに壊れてしまうので、簡単に切れないようロープで作ったんです。"
"221050-5-アミ" = "お客様の前なのに……困った子ね。#n今日だけで何回いたずらする気？"
"221050-6-투명" = "にゃお～"
"221050-7-連邦生徒会長" = "そうでしたか。#n遭難信号ではなかったのなら何よりです。"
"221050-8-連邦生徒会長" = "……では、この玉のS.O.S.はどういう意図なのでしょう？"
"221050-9-連邦生徒会長" = "Sammy, O Spoudeios――年老いた猫、サミーという、サミーの愛称です。"
"221050-10-ミナト" = "普段であれば、誤解を招くような「S.O.S.」表記をしないのですが……これは猫のおもちゃだったので……。"
"221050-11-ミナト" = "そもそも、誰かの手に渡ることは予想もしておらず――"
"221050-12-ミナト" = "ご心配をおかけしてしまい、誠に申し訳ありません。"
"221050-13" = "[ns] \"S.O.S.じゃないなら良かった。\""
"221050-14" = "[ns1] \"君が、あの玉の持ち主なんだね。\"\n[ns2] \"可愛い困ったちゃんだ。\""
"221050-15-투명" = "ごろごろ……。"
"221050-16-アミ" = "初対面の人に顎を差し出すなんて、警戒心の欠片もないんだから……。"
"221050-17-アミ" = "……だからオデュッセイアのみんなに愛されてるんでしょうけど。"
"221050-18-連邦生徒会長" = "ふふ、可愛らしい……。"
"221050-19-連邦生徒会長" = "何歳なんですか？「年老いた猫」なんて呼ばれるくらいですし、かなりの高齢なのでしょうか？"
"221050-20-連邦生徒会長" = "記録にあるだけでも15歳は超えているはずです。"
"221050-21-ミナト" = "いつから船にいるのか分からないため、正確な年は分かりませんが……。"
"221050-22" = "[ns] \"猫にしてはだいぶ長生きだね。\""
"221050-23-ミナト" = "ええ、本当に。"
"221050-24-ミナト" = "ずっと子猫みたいに振る舞っていますけどね。"
"221050-25-투명" = "にゃあ……。"
"221050-26-連邦生徒会長" = "学園中の生徒がサミーを知っているように見えたのは、気のせいではなかったんですね。"
"221050-27-連邦生徒会長" = "たしか、オデュッセイアでは珍しくないとおっしゃっていましたが……#n船で猫を飼うのも伝統なのですか？"
"221050-28-ミナト" = "はい。「[ruby=Ship Cat]船乗り猫[/ruby]」という習わしです。"
"221050-29-ミナト" = "由来を遡れば、ネズミ捕りのために乗せたのが始まりなのだとか。"
"221050-30-ミナト" = "時代は変わりましたが、船で猫に出会うのは吉兆とされるので、#n生徒の士気向上やストレス管理のために今でも猫を飼っているのです。"
"221050-31-투명" = "ごろごろ、ごろごろ……。"
"221050-32-ミナト" = "話ついでに、サミーのことをご紹介しましょうか。"
"221050-33-ミナト" = "すでにお話した通り、サミーは15歳を数える老猫です。"
"221050-34-ミナト" = "先々代の艦長が入学した時には、既にオリュンポス号の甲板を走り回っていたそうで。#nつまり、この学園で最も経験豊富な船員ともいえます。"
"221050-35-ミナト" = "ですが実は……前々からサミーの件で、D.U.に戻るべきかを悩んでいました。#nそれこそ、今回の帰港要請を受ける前から。"
"221050-36-ミナト" = "サミーに、何か問題が？"
"221050-37-ミナト" = "もういい年ですから。#n相変わらず元気ではあるのですが、老化による衰えが見え始めまして。"
"221050-38-ミナト" = "医務室の[ruby=ふなもり]船守[/ruby]室長の診断では、血圧が高く、関節炎の症状もあるそうです。"
"221050-39-アミ" = "左の後ろ脚が痛いのか、引きずって歩いていますし……。"
"221050-40-ミナト" = "これまでが元気すぎたのかもしれません。#nここ数か月は甲板で転んだり咳き込んだりすることが増えていて……。"
"221050-41" = "[ns] \"それで、治療のために帰港を考えてたんだね。\""
"221050-42-ミナト" = "いえ、さすがに猫1匹のために船団全体の進路は変えられません。"
"221050-43-ミナト" = "いざとなれば、トライデントの高速艇でサミーだけ陸に送ることもできましたから。"
"221050-44-ミナト" = "ただ、それ以上に気がかりだったのは――"
"221050-45-連邦生徒会長" = "海の禁忌、ですか？"
"221050-46-ミナト" = "……はい。"
"221050-47-ミナト" = "船乗りの迷信には、猫にまつわる話がとにかく多いんです。"
"221050-48-ミナト" = "猫の機嫌が良い時は吉事が起きて、悪いと凶事が起きる、とか。"
"221050-49-ミナト" = "猫が転べば不運が起きるとか、猫がくしゃみをすれば嵐が来るとか……。"
"221050-50-ミナト" = "なのでサミーが体調を崩すたびに生徒が動揺してしまって。#n下船させるべきかずっと悩んでいたんです。"
"221050-51-ミナト" = "ですが……。"
"221050-52" = "[s] \"下船させられない理由ができたんだね。\""
"221050-53-ミナト" = "はい。#n健康を理由に、サミーを陸へ送るのはどうかと提案したところ――"
"221050-54-ミナト" = "オデュッセイアの意見は2つに割れてしまいました。"
"221050-55-アミ" = "片方は、船乗りの禁忌を理由にサミーを下ろそうと主張しました。"
"221050-56-オデュッセイアの生徒A" = "もう嵐が3回も来てるんだよ？#nもっと悪いことが起こる前にサミーを船から下ろさなきゃ。"
"221050-57-オデュッセイアの生徒B" = "想像したくないけど……サミーの具合が今以上に悪くなったらどうするの？"
"221050-58-オデュッセイアの生徒A" = "設備がしっかりしている陸で治療を受ける方がサミーにとっても良いことだと思うよ。"
"221050-59-アミ" = "――という具合に。"
"221050-60-アミ" = "ですがもう一方は積み重ねてきた絆を理由に、下ろすべきではないと主張しました。"
"221050-61-オデュッセイアの生徒C" = "オデュッセイアはただの船じゃない！#n船内でも治療は十分できる！"
"221050-62-オデュッセイアの生徒D" = "サミーはずっと海の上で過ごしてきたんだよ？#n今さら陸の環境に馴染めるのかな？"
"221050-63-オデュッセイアの生徒D" = "ちょっと不運が続いてるからって、何年も一緒に過ごしてきたサミーを、#nどこの馬の骨とも知らない誰かに任せられるわけない！"
"221050-64-アミ" = "――と、いうわけです。"
"221050-65-連邦生徒会長" = "双方の言い分が理解できるからこそ、判断がつかないのですね。"
"221050-66-アミ" = "はい……。"
"221050-67" = "[ns] \"ミナトはどう思ってるの？\""
"221050-68-ミナト" = "私は……。"
"221050-69-ミナト" = "……これが、D.U.に戻って連邦生徒会長にお会いしたかった理由なのです。"
"221050-70-ミナト" = "オデュッセイアの禁忌は長い年月をかけて積み重ねられてきたものです。#nそれゆえに、生徒を導く指標になってきました。"
"221050-71-ミナト" = "これまでオデュッセイアの生徒同士で起きた対立も、#n前例と規則で収めてきたんです。"
"221050-72-ミナト" = "ですがサミーの件だけは、どの規則でも判断がつかず……。"
"221050-73-ミナト" = "何がサミーのためか、生徒のためか、学園のためか。#nいくら議論しても答えに辿り着けなかったんです。"
"221050-74-ミナト" = "時間が解決してくれるような問題でもありませんし……。"
"221050-75-ミナト" = "ですので……連邦生徒会長と先生のお考えを伺いたいんです。"
"221050-76-連邦生徒会長" = "得るものがあれば、失うものもあります。"
"221050-77-連邦生徒会長" = "どんな選択をしても、何も失わずに済むことはありません。"
"221050-78-連邦生徒会長" = "[ruby=・]あ[/ruby][ruby=・]な[/ruby][ruby=・]た[/ruby][ruby=・]の[/ruby]選択で生徒が何かを失うのなら、その責任はあなたが負うべきです。"
"221050-79-連邦生徒会長" = "――それが、艦長なのではありませんか？"
"221050-80-アミ" = "ですが――"
"221050-81-アミ" = "……連邦生徒会長のおっしゃる通りです。"
"221050-82" = "[ns] \"ちょっと待って。\""
"221050-83-連邦生徒会長" = "何かご意見が？"
"221050-84" = "[s3] \"概ね同意見ではあるんだけど。\"\n[s4] \"それでも、私たちに手伝えることはあると思うんだ。\""
"221050-85-連邦生徒会長" = "たしかに、困難に直面している学園を助けるのは、連邦生徒会長の責務です。"
"221050-86-連邦生徒会長" = "ですが、どのような方法で？"
"221050-87" = "[s] \"数日、猶予をもらえないかな？\""
"221050-88" = "[ns5] \"別の答えが見つかるかもしれないでしょ？\"\n[ns6] \"第三者の視点ならさ。\""
"221050-89-連邦生徒会長" = "第三者の視点、ですか。"
"221050-90-連邦生徒会長" = "一理ありますね。#n私たちはまだ、彼女たちが置かれている状況を十分に理解しているとはいえません。"
"221050-91-アミ" = "では――"
"221050-92-連邦生徒会長" = "――期限は1週間とします。"
"221050-93-連邦生徒会長" = "お忙しい先生を、この案件に縛りつけておくわけにもいきませんので。"
"221050-94-連邦生徒会長" = "その間に、学園を見て回って方法を考えましょう。"
"221050-95-連邦生徒会長" = "ご配慮ありがとうございます。"
"221050-96-連邦生徒会長" = "とんでもありません。"
"221050-97-連邦生徒会長" = "[ruby=・]責[/ruby][ruby=・]任[/ruby][ruby=・]あ[/ruby][ruby=・]る[/ruby][ruby=・]者[/ruby][ruby=・]が[/ruby][ruby=・]果[/ruby][ruby=・]た[/ruby][ruby=・]す[/ruby][ruby=・]べ[/ruby][ruby=・]き[/ruby]――当然のことですから。"
"221050-98" = "次回;好奇心は猫をも……"
