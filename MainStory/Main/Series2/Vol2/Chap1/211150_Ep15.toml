[translation]
"211150-1" = "第15話;マユミ"
"211150-2" = "（ふと、再興委員会の活動を思い出した）"
"211150-3" = "[ns] \"すごい光景だ……。\""
"211150-4" = "（トリガー・ハッピー・ゾーンは、ゲヘナ生の破壊本能が形になっていた）"
"211150-5-？？？" = "……ふぅ。"
"211150-6" = "[ns] \"あれは……。\""
"211150-7-マユミ" = "やーっと終わった。"
"211150-8-マユミ" = "こっちのドラム缶はもうダメだね……追加で調達しなきゃ。"
"211150-9-マユミ" = "的も新しいのに張り替えておかないと。"
"211150-10-マユミ" = "あれ、先生？"
"211150-11-マユミ" = "わぁー！いらっしゃい！先生も暴れたくなった？"
"211150-12" = "[s1] \"それは違うけど……。\"\n[s2] \"一人で片づけてたの？\""
"211150-13-マユミ" = "うん、そうだよ。"
"211150-14-マユミ" = "すごいでしょ、「トリガー・ハッピー・ゾーン」！#n1日に何人も来る場所になったんだ。"
"211150-15-マユミ" = "撃って、爆破して、掘り返して、投げて……そりゃもう大騒ぎ！"
"211150-16-マユミ" = "流石は私たちだよね。効果抜群！みんなめちゃくちゃ気に入ってる！"
"211150-17-マユミ" = "でもね、そのぶん壊れるのも早くて。"
"211150-18-マユミ" = "1日も持たないですぐボロボロになっちゃうんだ。"
"211150-19-マユミ" = "笑える話なんだけど、壊れたままだと、みんなテンション下がるんだよね。"
"211150-20" = "[s] \"新しくしても、結局は壊すんだよね？\""
"211150-21-マユミ" = "そうなんだけどさ。人の心って複雑じゃん？"
"211150-22-マユミ" = "「撃つぞー！」って時に、すでにボロボロの所は撃ちたくならないっていうか。"
"211150-23-マユミ" = "新品っぽい方が、壊す楽しさというか、破壊の快感があるんだよ！#n先生もそう思わない？"
"211150-24" = "[s3] \"そういうものかな……？\"\n[s4] \"言われてみると分かる気も……。\""
"211150-25-マユミ" = "ふふ、でしょ？"
"211150-26-マユミ" = "だから、いつも綺麗にしておくの。"
"211150-27-マユミ" = "そうじゃないと、みんなが来てくれなくなっちゃうから。"
"211150-28" = "[s] \"一人でやるのは大変じゃない？\""
"211150-29-マユミ" = "他の子も手伝ってくれるよ。でも、一番来てるのは私かな！"
"211150-30-マユミ" = "片づけようって思ったときには、もう足が勝手に動いちゃうんだ。#n私、行動力だけは自信あるから！"
"211150-31" = "[s] \"私も手伝うよ。\""
"211150-32-マユミ" = "えぇっ！？"
"211150-33-マユミ" = "えーっと……それはありがたいけど、結構重労働だよ？"
"211150-34-マユミ" = "……。"
"211150-35-マユミ" = "えへへっ、まあいっか！一緒にやれば早く終わるもんね！"
"211150-36-マユミ" = "よーっし、がんばろー！"
"211150-37" = "（マユミと一緒に片付けと修理を続けた）"
"211150-38" = "（思ったよりも大変で、片がつく頃にはかなり時間が経っていた）"
"211150-39" = "[ns] \"終わった～！\""
"211150-40-マユミ" = "先生のおかげですっごい早かった！大助かりだよ！"
"211150-41-マユミ" = "先生、ほんっと頼りになるね！"
"211150-42-マユミ" = "……ま、こんなに綺麗にしても、すぐボロボロになるんだけど。"
"211150-43-マユミ" = "そのときはそのときで、また片づければいいし！"
"211150-44-マユミ" = "えへへ、みんなが思いっきり楽しんでくれるといいな～"
"211150-45-マユミ" = "んー？どうしてここまでやるのかって？"
"211150-46-マユミ" = "それは――"
"211150-47-マユミ" = "ゲヘナを偉大にするためだよ！！"
"211150-48-マユミ" = "先生も感じてくれてるよね？#n私たちのやってきたことは無駄じゃなかった。"
"211150-49-マユミ" = "毎日のように起きてた爆発とか撃ち合いとか。事件も事故も目に見えて減った。#n校庭のど真ん中でクレイモアが爆発することもない。"
"211150-50-マユミ" = "しかも、列にちゃんと並べるようになったんだよ！"
"211150-51-マユミ" = "問題児だらけ、トラブルメーカーの学園、混乱ばっかのゲヘナが……#n少しずつ変わってきてるんだ。"
"211150-52-マユミ" = "私たちが頑張った結果だよ！ゲヘナは一歩一歩、偉大になってる！"
"211150-53" = "[s] \"マユミは本当にゲヘナが好きなんだね。\""
"211150-54-マユミ" = "もっちろん！"
"211150-55-マユミ" = "誰だって自分の学園は好きだと思うけどさ。"
"211150-56-マユミ" = "やっぱりゲヘナが1番！とびっきり素敵な学園だから！！"
"211150-57-マユミ" = "……もちろん、今まではちょっとあれだったけど。"
"211150-58-マユミ" = "でもこれから絶対、もっと良くなる！"
"211150-59" = "[s] \"今のマユミがしてるみたいに、だね。\""
"211150-60-マユミ" = "えへへ……うん。"
"211150-61-マユミ" = "先生、私ね。最近……毎日がすっごく楽しいんだ。"
"211150-62-マユミ" = "昨日まで当たり前だったことを「なんで当たり前なんだろう？」って考えて、#n明日からは当たり前じゃなくする。"
"211150-63-マユミ" = "今までのゲヘナを作っていたものには、一つも「私たち」の選択なんて入ってなかったから。"
"211150-64-マユミ" = "でも今は私たちの選択がゲヘナをゆっくり変えてる。#nこれってすごいことだと思わない？"
"211150-65-マユミ" = "だから、もっともっと頑張らないとね！"
"211150-66-マユミ" = "特に今日みたいに先生が手伝ってくれたら、何だってできる気がするんだ。うん！絶対に！！"
"211150-67" = "[s] \"これからもよろしくね。\""
"211150-68-マユミ" = "はーい！よろしくお願いします、先生！"
"211150-69-マユミ" = "ゲヘナを、再び偉大に！！"
"211150-70" = "（マユミはいつも明るく、全力で頑張っている）"
"211150-71" = "（この子の笑顔が、ずっと続けばいいと思った）"
"211150-72-マコト" = "キシシッ！[ruby=いがらし]五十嵐[/ruby]ショウコ、今日は何の用だ？"
"211150-73-マコト" = "放送室の整備は終わったのか？"
"211150-74-ショウコ" = "既に完了しています。それと、マコト議長が喜びそうな報告が1つ。"
"211150-75-マコト" = "ほう？"
"211150-76-ショウコ" = "放送設備全体の点検はもちろんのこと、学園の隅々まで最新の音響機器を設置し、#n放送が届かない場所を無くしました。"
"211150-77-マコト" = "キシシッ、見事だ！"
"211150-78-マコト" = "万魔殿の予算を使わずにインフラを拡充するとは。#nまさに「濡れ手で粟」というやつだな。"
"211150-79-イロハ" = "当事者の目の前で言うことじゃないのでは。"
"211150-80-マコト" = "この図太さこそ、ゲヘナの頂点に立つ者の器量というものでしょう。"
"211150-81-マコト" = "よく分かっているではないか！#nイロハ、お前も積極的に見習うといい！"
"211150-82-イロハ" = "はいはい。"
"211150-83-マコト" = "マコト議長。ご提案がございます。"
"211150-84-ショウコ" = "まもなく校内放送が再開されます。#nその記念すべき瞬間を、ただ流すのはもったいないと思いませんか？"
"211150-85-マコト" = "何か考えがあるようだな。言ってみろ。"
"211150-86-ショウコ" = "学園全体に向けて、マコト議長による電撃演説を行うのはいかがでしょう。"
"211150-87-ショウコ" = "新しいゲヘナの幕開けを告げる挨拶として、これ以上ふさわしい瞬間はないはずです。"
"211150-88-マコト" = "キキキキキッ。まさに私のために用意された舞台というわけだな！"
"211150-89-マコト" = "この[ruby=はぬま]羽沼[/ruby]マコト様が、歴史に残る名演説をゲヘナに轟かせてみせよう！"
"211150-90-チアキ" = "やる気に火がついたわね。"
"211150-91-チアキ" = "これで来週号のネタは心配なさそうです！バリバリ取材しますよ～！"
"211150-92-イブキ" = "マコト先輩の演説、イブキも楽しみ～！"
"211150-93-ショウコ" = "――ゲヘナを、再び偉大に。"
"211150-94" = "次回;起こるべくして起こる"
