[translation]
"211130-1" = "第13話;森の中の木"
"211130-2-ショウコ" = "こんにちは、[ruby=はたみ]旗見[/ruby]エリカさん、[ruby=よざくら]夜桜[/ruby]キララさん。"
"211130-3-キララ" = "あれ、あたしたちのこと知ってるの？"
"211130-4-エリカ" = "そっちは最近話題の委員会だよね？"
"211130-5-エリカ" = "名前はたしか――"
"211130-6-ショウコ" = "ゲヘナ再興委員会。私は[ruby=いがらし]五十嵐[/ruby]ショウコです。"
"211130-7-キララ" = "あたしたちタメなんだよね。知ってた？"
"211130-8-ショウコ" = "ええ、ある程度は。"
"211130-9-キララ" = "そっかそっか、よろしくね！#nそれで、何か用？"
"211130-10-マユミ" = "ちょっと聞きたいことがあるんだ。"
"211130-11-カレン" = "あ、無理にとは言わないよ。"
"211130-12-ショウコ" = "……あれ？先生も一緒だったんだ！"
"211130-13" = "[s] \"やぁ、キララ、エリカ！\""
"211130-14-エリカ" = "もしかして意外と大事？"
"211130-15-ショウコ" = "いえ、お手間は取らせませんので。"
"211130-16-エリカ" = "もう帰ろうとしてたとこだから。なんでも聞いて。"
"211130-17-ショウコ" = "では、お言葉に甘えて。"
"211130-18-キララ" = "おっけおっけ、新しい友だちはいつでも歓迎だし。"
"211130-19-エリカ" = "ん～！やっぱここのホワイトチョコが一番だよね！"
"211130-20-エリカ" = "奢ってもらっちゃって悪いね。ここまでしてもらわなくてもいいのに。"
"211130-21-ショウコ" = "私が払うから遠慮せず食べてね。お代わりもどんとこいだよ。"
"211130-22-ショウコ" = "――と、先生は考えました。"
"211130-23" = "[s] \"またそれか……！\""
"211130-24-エリカ" = "あはは、二人はそういうノリなんだ。#nさすが、先生は誰とでも馴染むね。"
"211130-25-エリカ" = "それで、話って？"
"211130-26-マユミ" = "えっと……。"
"211130-27-マユミ" = "前に校内放送やってたよね？"
"211130-28-エリカ" = "ああ、あれね。"
"211130-29" = "1回だけだったけどすっごく楽しかったよ！ああいうの初めてだったし！"
"211130-30-キララ" = "校内放送に興味あるの？"
"211130-31-マユミ" = "なくはないんだけど、今は調べたいことがあってさ。"
"211130-32-マユミ" = "最近、校内放送やってないじゃん？たぶん、二人の放送の後から。#n……何かあった？"
"211130-33-キララ" = "言われてみればそうだね。"
"211130-34-エリカ" = "失敗したわけでもないし、機材壊したりもしてないし……なんでだろ。"
"211130-35-キララ" = "あたしたちが上手すぎて、次の人がプレッシャー感じちゃったとか？"
"211130-36-エリカ" = "ないない。"
"211130-37-エリカ" = "あ、でも……放送部長が戻ってきたって話は聞いてないね。"
"211130-38-キララ" = "実はあの時、あたしたちが放送を続けるって話もあったんだ。"
"211130-39-エリカ" = "元からやってた人のほうがいいと思って断っちゃったけど。"
"211130-40-ショウコ" = "それから放送は止まったまま……。"
"211130-41-ショウコ" = "お二人が放送していたとき、何かおかしな点はありませんでしたか？"
"211130-42-エリカ" = "例えば？"
"211130-43-ショウコ" = "何かトラブルが起きたとか、聞こえないはずの音が混ざっていたとか……。"
"211130-44-キララ" = "そういえば、一瞬だけピーッって音が鳴ってたかも。#nすっごい高いキーン！ってやつ。分かるでしょ？"
"211130-45-ショウコ" = "……そうでしたか。"
"211130-46-キララ" = "うん。でもエリカちゃんがすぐ何とかしてくれたんだ！"
"211130-47-エリカ" = "ケーブルが絡まってただけだったから。ちょっと配線を直したらすぐ収まったよ。"
"211130-48-ショウコ" = "あとは特に何も？"
"211130-49-エリカ" = "えっと……あ。"
"211130-50-エリカ" = "何か変な声を聞いた気もするんだよね。"
"211130-51-キララ" = "そんなのあったっけ？"
"211130-52-エリカ" = "聞き間違いかもしれないから、誰にも言ってなかったんだけど。"
"211130-53-ショウコ" = "どんな声でしたか？"
"211130-54-エリカ" = "うーん……女の人の声で……。"
"211130-55-エリカ" = "何か……単語を言ってたかな。"
"211130-56-エリカ" = "[ruby=・]て[/ruby][ruby=・]っ[/ruby][ruby=・]け[/ruby][ruby=・]つ[/ruby]？とか、[ruby=・]ち[/ruby][ruby=・]つ[/ruby][ruby=・]じ[/ruby][ruby=・]ょ[/ruby]とか……#nそんなのだったと思うけど、細かくは覚えてないや。"
"211130-57-エリカ" = "あ、エリカちゃんって呼んじゃっていい？"
"211130-58-エリカ" = "もちろん。エリカでもいいよ。"
"211130-59-カレン" = "エリカちゃんには、はっきり聞こえてたってこと？#nうちらが聞いたのはもうちょっと曖昧だったんだけど。"
"211130-60-エリカ" = "いや、私も細かく聞き取れたわけじゃないよ。だいたいのニュアンスってくらい。"
"211130-61-カレン" = "そっか……不思議だねぇ。"
"211130-62-キララ" = "でも、どうして気になってるの？"
"211130-63-カレン" = "うちら、その「幽霊騒ぎ」を解決してるところでさ。"
"211130-64-キララ" = "わーっ、何それ！すっごく楽しそう！キラキラしてる～！"
"211130-65-カレン" = "生徒のお悩み解決みたいなことをやってるんだ。成り行きでね。"
"211130-66-キララ" = "そういうのもやってるんだ？あははっ！絶対面白いじゃん！"
"211130-67-マユミ" = "どう？興味あるなら入らない？"
"211130-68-エリカ" = "残念。私たち、キラキラ部なんだ。"
"211130-69-マユミ" = "二人にはピッタリだと思うんだけどな！一緒にゲヘナを偉大にしようよ！"
"211130-70-エリカ" = "ゲヘナを偉大に、か……。"
"211130-71-エリカ" = "偉大になりすぎてもちょっと困るかも？"
"211130-72-マユミ" = "どうして？キヴォトスで一番がよくない？"
"211130-73-エリカ" = "うーん……私には、ちょっと看板が重すぎるかなって。"
"211130-74-エリカ" = "別に、否定するわけじゃないよ。#n私はもっとこじんまりしてるほうが性に合うってだけだから。"
"211130-75-キララ" = "ねえ、偉大なゲヘナってどんなの？"
"211130-76-マユミ" = "ふふん、偉大なゲヘナとは！"
"211130-77-マユミ" = "秩序だった規則と統制のもと、みんなが一つになって――"
"211130-78-マユミ" = "心を一つに同じ目標へ向かって突き進んでいく！"
"211130-79-マユミ" = "絵に描いたみたいに理想的な学園だよ！#nまさに、昔のゲヘナみたいに！"
"211130-80-キララ" = "みんなが同じだったらつまんなくない？"
"211130-81-マユミ" = "そんなことないよ！長く険しい道の先にあるから、偉大でワクワクするんだよ！"
"211130-82-エリカ" = "でも……ドラマも音楽も、同じようなのばっかりになっちゃうよね。"
"211130-83-エリカ" = "バラバラだからこそ面白くなるんじゃないかな……。"
"211130-84-マユミ" = "……。"
"211130-85-カレン" = "あ、マユミちゃんフリーズしちゃった。"
"211130-86-エリカ" = "ち、違くて！コンテンツと……その、なんだっけ？全体の方向性は！別だから！"
"211130-87-エリカ" = "ふーん……？"
"211130-88-マユミ" = "……ショ……！"
"211130-89-マユミ" = "ショウコ！！"
"211130-90-マユミ" = "……ショウコ？考え込んでないで助けてよ！"
"211130-91-ショウコ" = "……あ。"
"211130-92-カレン" = "どしたん？なんかあった？"
"211130-93-ショウコ" = "いえ。ちょっと考えさせられることがあって。"
"211130-94-カレン" = "なになに？"
"211130-95-ショウコ" = "……。"
"211130-96-ショウコ" = "どうやら、放送室に入る必要がありそうです。"
"211130-97-マユミ" = "あっ、そっち？まあ決着はつけないとだよね。"
"211130-98-ショウコ" = "でも、どうやって入るつもり？"
"211130-99-ショウコ" = "万魔殿と……正面から交渉する他ないでしょうね。"
"211130-100-キララ" = "か～っこいい～！"
"211130-101-ショウコ" = "活動の甲斐もあって、私たちの格はそれなりに上がりました。#n今なら正面から話しても、そう簡単には押し切られないはずです。"
"211130-102-エリカ" = "急に話がヘビーになってきたね……応援してるよ。"
"211130-103-キララ" = "うん！これもキラキラかも！"
"211130-104-ショウコ" = "……その前に。"
"211130-105-ショウコ" = "ホワイトチョコチップフラペチーノ……もう一杯頼んでもいいですか？"
"211130-106" = "[ns] \"お代わりもどんとこいだよ。\""
"211130-107" = "次回;揺れる炎の影"
