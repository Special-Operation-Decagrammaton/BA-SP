[translation]
"211030-1" = "第3話;ゲヘナを偉大に！"
"211030-2-マユミ" = "もー！"
"211030-3-マユミ" = "AT4無反動砲ぶっ放したの誰！？"
"211030-4-ゲヘナの生徒" = "ごめ～ん！#nロケットジャンプの練習してたら飛んでっちゃった！"
"211030-5-マユミ" = "なんで校内でそんな練習するの！"
"211030-6-ゲヘナの生徒" = "ここじゃなきゃどこでやるの？"
"211030-7-マユミ" = "人のいないとことか！#n見てよこれ！駐車場に大穴あいてるし、街灯は折れてるし！"
"211030-8-ゲヘナの生徒" = "おー！ほんとだー！"
"211030-9-マユミ" = "こんなだから「ゲヘナはいつも散らかっててカオスだ」って言われるんだよ！"
"211030-10-ゲヘナの生徒" = "え、今さら？ゲヘナって元からこうでしょ？"
"211030-11-マユミ" = "なぁっ……！"
"211030-12-ゲヘナの生徒" = "ま、風紀委員会が来る前に逃げるね！お疲れ～"
"211030-13-カレン" = "おー、ちょっと目を離した隙にコレかぁ。"
"211030-14-ショウコ" = "マユミ委員長、大丈夫ですか。"
"211030-15-マユミ" = "どうにかね。#n交通整理してたんだけど、無反動砲ぶっ放して逃げた生徒がいてさ……はぁ。"
"211030-16-ショウコ" = "1発で済んだのは幸いでしたね。"
"211030-17-カレン" = "どんまいどんまい。"
"211030-18-カレン" = "まあ最初だし、こんなもんっしょ。#n交通整理とか校内ボランティアとか。コツコツやってこうよ。"
"211030-19-マユミ" = "うん……。"
"211030-20-カレン" = "……失敗したのはいいの。やってればこういうこともある。"
"211030-21-マユミ" = "でも、あの一言だけは許せないんだ。"
"211030-22-マユミ" = "私がいっちばん嫌いな言葉。"
"211030-23-マユミ" = "「ゲヘナは元からこう」ってやつ！！"
"211030-24-マユミ" = "何が「元から」なの？#nそれって何も変える気ありませんってことじゃん！"
"211030-25-マユミ" = "それに、ゲヘナは最初からこんなんじゃなかったんだよ？#nいつからこうなっちゃったのさ！"
"211030-26-？？？" = "それはそう。ゲヘナは元々こんなじゃなかった。"
"211030-27-ショウコ" = "誰……？"
"211030-28-万魔殿の3年生" = "君たち、あれでしょ？ゲヘナ再興委員会。"
"211030-29-マユミ" = "そうだけど……。"
"211030-30-カレン" = "センパイは？"
"211030-31-万魔殿の3年生" = "通りすがりの万魔殿さ。"
"211030-32-万魔殿の3年生" = "気になったから、一言だけね。話に混ざる気はないから、それじゃ……。"
"211030-33-マユミ" = "待って！"
"211030-34-マユミ" = "先輩は昔を知ってるの？"
"211030-35-マユミ" = "秩序が保たれて、学園全体が統制に従ってた頃の話。"
"211030-36-万魔殿の3年生" = "知ってるさ。よく知ってる。"
"211030-37-万魔殿の3年生" = "その頃のゲヘナはカッコよかったんでしょ？"
"211030-38-万魔殿の3年生" = "今みたいなカオスじゃなくて……。"
"211030-39-万魔殿の3年生" = "……。"
"211030-40-万魔殿の3年生" = "そうか。君たちは昔を知らないんだな。"
"211030-41-万魔殿の3年生" = "誰もちゃんと話してくれないんだもん！"
"211030-42-万魔殿の3年生" = "……皆が口をつぐむなりの理由があるんだよ。"
"211030-43-マユミ" = "どういうこと？"
"211030-44-万魔殿の3年生" = "手放しには褒められないってことさ。"
"211030-45-万魔殿の3年生" = "君たちは憧れてるみたいだけど……。"
"211030-46-万魔殿の3年生" = "私は……あの頃に戻りたいとは思わない。"
"211030-47-マユミ" = "どうして！？"
"211030-48-万魔殿の3年生" = "じゃあセンパイは、今の方がいいってこと？"
"211030-49-万魔殿の3年生" = "ああ。"
"211030-50-カレン" = "……。"
"211030-51-万魔殿の3年生" = "詳しいことを話す気はないし、話せることでもない。"
"211030-52-万魔殿の3年生" = "君たちがゲヘナのために何かしようとしてるのは分かるよ。#nそれにはきっと意味がある。"
"211030-53-万魔殿の3年生" = "ただ、幻想を抱きすぎない方がいいってだけさ。"
"211030-54-万魔殿の3年生" = "ま、応援してるよ。頑張ってる姿を見るのは悪くないからな。"
"211030-55-カレン" = "……。"
"211030-56-マユミ" = "……。"
"211030-57-マユミ" = "あの先輩は何も分かってないんだよ！きっとそう！"
"211030-58-マユミ" = "昔のゲヘナはちゃんと秩序があって、カッコいい学園だったに決まってる！#nでしょ？"
"211030-59-ショウコ" = "……はい。もちろんです。"
"211030-60-マユミ" = "よし！落ち込んでる場合じゃない！#n私たちのやることには意味があるんだから！！"
"211030-61-カレン" = "やはっ、それでこそ委員長だよね！"
"211030-62-ショウコ" = "さっきの先輩にも思い知らせてやるんだから。"
"211030-63-マユミ" = "私たちが頑張って、ゲヘナの偉大さを取り戻す！"
"211030-64-カレン" = "もち！"
"211030-65-マユミ" = "そのためには、何か――"
"211030-66-マユミ" = "今みたいに地道に走り回ってるだけじゃ限界があるよね。"
"211030-67-マユミ" = "私たちに足りないものって何だと思う？"
"211030-68-ショウコ" = "ちょうど、いくつか計画を立ててあります。"
"211030-69-カレン" = "さっすがうちのブレイン！ショウコちゃん！"
"211030-70-マユミ" = "聞きたい聞きたい！"
"211030-71-ショウコ" = "その前に。"
"211030-72-ショウコ" = "どれだけ立派な主張でも、聞いてもらえなければ意味がありません。"
"211030-73-マユミ" = "それは、まあ……そうだよね。"
"211030-74-ショウコ" = "主張を通すために必要なもの。"
"211030-75-ショウコ" = "それは「権威」です。"
"211030-76-マユミ" = "権！"
"211030-77-カレン" = "威！"
"211030-78-ショウコ" = "ええ。"
"211030-79-ショウコ" = "そして――お誂え向きな象徴がありまして。"
"211030-80" = "次回;ゲヘナを偉大に……！"
