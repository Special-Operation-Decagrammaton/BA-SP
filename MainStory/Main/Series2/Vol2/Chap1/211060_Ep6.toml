[translation]
"211060-1" = "第6話;交渉"
"211060-2-マコト" = "……。"
"211060-3-マコト" = "ダメだ！！"
"211060-4-マユミ" = "なんで！？"
"211060-5-カレン" = "場所が必要な理由は説明したよね？"
"211060-6-マコト" = "知らん！気に入らないからだ！"
"211060-7-マユミ" = "理不尽！？"
"211060-8-マコト" = "お前たちが作ろうとしているのは「はけ口」にすぎん。"
"211060-9-マコト" = "そんなものに浪費する予算など一銭たりともない。#nまだ校内放送の設備を拡充したほうがマシだ。#nマコト様の威厳を広く知らしめられるからな！"
"211060-10-マユミ" = "でも、これで問題が減れば今より予算減らせるかもよ？"
"211060-11-マユミ" = "そうすれば風紀委員会の負担だって――"
"211060-12-マコト" = "それが問題なのだ！！"
"211060-13-マユミ" = "えぇっ！？"
"211060-14-マコト" = "出張るのも後始末も、全て風紀委員会の仕事！#n予算？激務？[ruby=パンデモニウム・ソサエティー]我ら万魔殿の知[/ruby]ったことではない！"
"211060-15-マコト" = "風紀委員会が楽をする姿など見たくないのだ！キシシッ！"
"211060-16-イロハ" = "はぁ……。"
"211060-17-カレン" = "風紀委員会と仲悪すぎだよ……。"
"211060-18-カレン" = "だからって、万魔殿は生徒会なんじゃん？#nこれは全部、生徒のためだから――"
"211060-19-マユミ" = "ゲヘナ再興委員会の委員長補佐、2年の[ruby=みょうらく]明楽[/ruby]カレン。"
"211060-20-カレン" = "うちの名前覚えてたの？"
"211060-21-マユミ" = "そして委員長は2年の[ruby=ふりはた]降旗[/ruby]マユミ。"
"211060-22-マユミ" = "私も！？"
"211060-23-マユミ" = "キシシッ。ゲヘナを思う心意気――実に健気だ。"
"211060-24-マコト" = "だが！ゲヘナは変わる必要などない！#nそれが万魔殿の頂点たる[ruby=はぬま]羽沼[/ruby]マコト様のお考えだ。"
"211060-25-マユミ" = "どうして？ゲヘナを偉大にしたくないの？"
"211060-26-マコト" = "いいや。ゲヘナは既に偉大だからだ。"
"211060-27-マユミ" = "今のゲヘナが？"
"211060-28-マコト" = "青二才どもは知らないだろうから教えてやる。#n今の校風は、この私が意図して形作ったものだ。"
"211060-29-イロハ" = "ただ面倒で放置してるようにしか見えませんけどね。"
"211060-30-マコト" = "じゃあカオスなまま放っとくつもりなの？これからもずっと？"
"211060-31-マコト" = "本気？ゲヘナは「問題児学園」だって言われてるんだよ？"
"211060-32-マコト" = "そう思っているのはお前たちだけだ！"
"211060-33-マコト" = "他人の視線など気にしてどうする！#nリーダーを名乗るには器が小さすぎるぞ！"
"211060-34-マユミ" = "ぐああ、「器」の話を返された！"
"211060-35-ショウコ" = "……マコト議長、よろしいでしょうか。"
"211060-36-マコト" = "書記で2年の[ruby=いがらし]五十嵐[/ruby]ショウコか。"
"211060-37-ショウコ" = "……全校生徒を覚えているというのは本当だったのですね。"
"211060-38-マコト" = "頂点に立つ者として、この程度は当然だ。"
"211060-39-マコト" = "で、なんだ？"
"211060-40-ショウコ" = "現在のゲヘナが議長の哲学で形作られていることは理解しました。"
"211060-41-ショウコ" = "それはまさしく「無為の治」。#n凡人には真似ることすらできない、高度な政治手腕と言えるでしょう。"
"211060-42-マコト" = "キシシッ！その通りだ！よく分かっているではないか！"
"211060-43-カレン" = "出たっ！ショウコの「媚びモード」……！"
"211060-44-カレン" = "絶対なんか企んでるやつだ……。"
"211060-45-マコト" = "騒ぎを起こす問題児と、取り締まる風紀委員会。#n今のゲヘナはそのいたちごっこで回っています。"
"211060-46-ショウコ" = "勝手をする生徒が増えるほどに風紀委員会は激務に追われ。#n風紀委員会が取り締まりに精を出すほど、生徒から「圧政と恐怖の象徴」として恐れられていくという仕組み。"
"211060-47-ショウコ" = "これこそ、マコト議長が意図した結果なのでしょう。"
"211060-48-マコト" = "風紀委員会の評判は落ちる一方だな。"
"211060-49-ショウコ" = "ですが議長。そこには1つ、見落としがあります。"
"211060-50-マコト" = "ほう？"
"211060-51-ショウコ" = "問題児は[ruby=・]風[/ruby][ruby=・]紀[/ruby][ruby=・]委[/ruby][ruby=・]員[/ruby][ruby=・]会[/ruby][ruby=・]を[/ruby]怖がり、嫌ってはいても――#n万魔殿の存在感は、ほとんど感じていないのです。"
"211060-52-ショウコ" = "賢明な議長はあえて大衆の無関心を誘っているのでしょう。#nしかし残念ながら、風紀委員会の存在感を盤石にする土壌になっています。"
"211060-53-マコト" = "うぬぬ……。"
"211060-54-ショウコ" = "今のゲヘナの「主人公」といえるのは――"
"211060-55-ショウコ" = "風紀委員長。[ruby=そらさき]空崎[/ruby]ヒナでしょう。"
"211060-56-マコト" = "交渉がしたいのなら、言葉は選んだ方が賢明だぞ？"
"211060-57-ショウコ" = "私たちの提案を受けていただければ、話は変わってきます。"
"211060-58-マコト" = "我々が管理する特別区域「トリガー・ハッピー・ゾーン」は、#nただ単に「はけ口」を提供するだけではありません。"
"211060-59-ショウコ" = "[ruby=・]万[/ruby][ruby=・]魔[/ruby][ruby=・]殿[/ruby][ruby=・]の[/ruby][ruby=・]議[/ruby][ruby=・]長[/ruby][ruby=・]が[/ruby][ruby=・]許[/ruby][ruby=・]し[/ruby][ruby=・]た[/ruby]自由と悦楽の空間となるのです。"
"211060-60-ショウコ" = "生徒は利用するたびに実感するでしょう。#n「この楽しみを与えてくださったのは、万魔殿の頂点にして寛大なる羽沼マコト議長であって、鬼の風紀委員長空崎ヒナではない」と。"
"211060-61-マコト" = "ほう……。"
"211060-62-マユミ" = "いけー！ショウコ！押せ押せ！"
"211060-63-ショウコ" = "自分たちを締め付ける風紀委員会と、真の自由を与えてくれる万魔殿。"
"211060-64-ショウコ" = "生徒がどちらを好み、どちらを称えるか。答えは明白でしょう。"
"211060-65-マコト" = "自由を抑えるのではなく、発散の方法を作る――か。"
"211060-66-ショウコ" = "……。"
"211060-67-マコト" = "随分と甘く見られたものだ。"
"211060-68-ショウコ" = "……はい？"
"211060-69-マコト" = "美辞麗句を並べたところで、結局はお前たちのやりたいことをやるだけではないか。"
"211060-70-マコト" = "偉大なる万魔殿の権力を少しずつ盗みながら……！"
"211060-71-ショウコ" = "誤解です。私たちはただ――"
"211060-72-マコト" = "ふん。そんな権限を青二才に握らせるわけにはいかん。"
"211060-73-マユミ" = "……。"
"211060-74-マコト" = "風紀委員会の仕事が減るというのも気に入らん！#nこの世には譲れぬものがあるのだ！"
"211060-75" = "[s] \"マコト。\""
"211060-76" = "[ns1] \"政治的な判断も大事だけどさ。\"\n[ns2] \"後輩にもチャンスをあげてみない？\"\n[ns3] \"やってみようとする気持ちは、応援してあげたい。\""
"211060-77-マコト" = "……。"
"211060-78-マユミ" = "……。"
"211060-79-ショウコ" = "……。"
"211060-80-マコト" = "キシシッ……やるではないか。先生を口説き落として、後押しを取り付けるとは。"
"211060-81-マコト" = "……この根回しを、力量の証だと見なしてやらんこともない。"
"211060-82-カレン" = "口説く……？"
"211060-83-カレン" = "しーっ、黙って。"
"211060-84-マコト" = "……。"
"211060-85-マコト" = "ここは先生の顔を立てて、ひとまずは活動を許可してやるとしよう。"
"211060-86-マユミ" = "やったー！ばんざーい！！"
"211060-87" = "[ns] \"ありがとう！\""
"211060-88-マコト" = "キシシッ……今回の万魔殿の譲歩は、貸し1つとしておこう。"
"211060-89-マコト" = "いずれこの件以上の「何か」を受け取らねば、釣り合わないからな！"
"211060-90-マコト" = "相応の誠意を、必ず――！！"
"211060-91-マコト" = "ごほっ、ごほっ！！げほっ！！"
"211060-92-イロハ" = "あー……変なとこに入りましたね。#n急に大声出すから……大丈夫ですか？"
"211060-93-イロハ" = "げほっ！ごほごほっ！！"
"211060-94-イロハ" = "まあ、話はまとまったみたいですし。#nこっちは片づけておくので。もう帰っていいですよ。"
"211060-95" = "[s4] \"ありがとう、イロハ。\"\n[s5] \"マコト……お大事に……。\""
"211060-96-ショウコ" = "……。"
"211060-97-サツキ" = "何かしら？"
"211060-98-ショウコ" = "……いえ。では。"
"211060-99-サツキ" = "げーっほ、げほげほっ！！"
"211060-100-サツキ" = "も～、背中さすってあげましょうか？"
"211060-101-マユミ" = "やったー！成功だよ！大成功！"
"211060-102-ショウコ" = "説得しきる自信はありましたが……。"
"211060-103-ショウコ" = "最後の一押しは、やはり先生でしたね。"
"211060-104-カレン" = "やる～。さっきの言い方、ちょっと感動したかも！"
"211060-105" = "[s] \"みんな本気だったからね。\""
"211060-106-ショウコ" = "そうそう！私たちこそ、本気でゲヘナを愛してる生徒だもん！"
"211060-107-カレン" = "ショウコちゃんも、しゃべり方エグかったよ。詐欺師とかできるんじゃない？"
"211060-108-ショウコ" = "それは褒め言葉ではないのでは？"
"211060-109-ショウコ" = "とりあえず、これで大きな山を1つ越えたね。"
"211060-110-ショウコ" = "それじゃあ次は～！！"
"211060-111-ショウコ" = "……。"
"211060-112-ショウコ" = "……どこだっけ？"
"211060-113-ヒナ" = "……そんなことをしていたのね。"
"211060-114-ヒナ" = "異論はないわ。何かしようとしている後輩を止めるつもりはないもの。"
"211060-115-ヒナ" = "その区域に、風紀委員会は手を出さない。それでいいのね？"
"211060-116-ヒナ" = "みんなに伝えておくわ。"
"211060-117" = "[s] \"ヒナはどう思う？\""
"211060-118-ヒナ" = "どうって……何を？ゲヘナ再興委員会？"
"211060-119-ヒナ" = "……どうかしら。まだ、よく分からないけど……。"
"211060-120-ヒナ" = "やり方はどうあれ、ゲヘナを良くしたいという気持ちは伝わってくる。"
"211060-121-ヒナ" = "その過程で面倒を起こさなければいいのだけど……。"
"211060-122-ヒナ" = "しばらくは見守るつもり。心配のタネは、あまり増やしたくないから。"
"211060-123-ヒナ" = "なにより、先生がついているのでしょう？それなら心配ないわ。"
"211060-124" = "[s] \"やっぱりヒナは優しいね。\""
"211060-125-ヒナ" = "ん……。"
"211060-126-ヒナ" = "……。"
"211060-127-ヒナ" = "先生の助けが必要なのは、なにもあの子たちだけではなくて……。"
"211060-128-ヒナ" = "少し……時間をもらえるかしら。"
"211060-129" = "（ヒナが少しでも安らげるよう、一緒にお茶を飲んだ）"
"211060-130" = "（今回のことで、風紀委員会の仕事が減るといい……そう思った）"
"211060-131" = "次回;カレン"
