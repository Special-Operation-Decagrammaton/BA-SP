[translation]
"211110-1" = "第11話;見知らぬ平和"
"211110-2-マコト" = "……。"
"211110-3-マコト" = "くっ……。"
"211110-4-サツキ" = "最近のマコトちゃん、ずっとあの調子じゃない？"
"211110-5-イロハ" = "はい。静かで助かってます。"
"211110-6-サツキ" = "あんな状態になるの珍しいわよね。何かあったのかしら？"
"211110-7-チアキ" = "深刻そうな表情……シャッターチャンスです！"
"211110-8-マコト" = "……。"
"211110-9-チアキ" = "わぁっ、すかさずポーズを取るマコト先輩！さすがは万魔殿の鑑！"
"211110-10-マコト" = "当然だ。頂点に立つ者はいかなる時もメディアに晒され得るからな。"
"211110-11-サツキ" = "マコトちゃん、そんなに真剣な顔してどうしたの？"
"211110-12-マコト" = "それは……。"
"211110-13-イロハ" = "どうせ、あれのせいでしょう？"
"211110-14-イロハ" = "ゲヘナ再興委員会が注目されているから、危機感を覚えているのでは？"
"211110-15-マコト" = "イロハ……なぜそれを……！！"
"211110-16-イロハ" = "そりゃ見てれば分かりますよ、そういうの。"
"211110-17-イロハ" = "この前あれだけ大口叩いておいて……実際にそうなると不安がるんですから。"
"211110-18-サツキ" = "なんだ、そんな理由？マコトちゃんらしいわね。"
"211110-19-サツキ" = "でも、誰が注目されててもいいんじゃないかしら。私たちとは関係ないでしょう？"
"211110-20-マコト" = "いや、それは違う。"
"211110-21-マコト" = "あいつらはゲヘナに不可逆の変化を起こそうと躍起になっている。"
"211110-22-マコト" = "そして……その足掻きは着実に成果を上げつつある。"
"211110-23-マコト" = "これまでのゲヘナには、影響力で万魔殿に張り合える組織などなかった。#nせいぜいが風紀委員会くらいだ。"
"211110-24-マコト" = "だからこそ、私の統治理念たる「無為の治」を実現できていたのだ！"
"211110-25-イロハ" = "そんな理念、一度も聞いたことないですけど。"
"211110-26-マコト" = "とにかく、我々の存在感が根本から脅かされている現実を直視するべきだ。"
"211110-27-マコト" = "イロハ！今すぐ「あれ」を用意しろ！！"
"211110-28-イロハ" = "「あれ」が何かも分からないですし、そもそも何も準備していません。"
"211110-29-マコト" = "なにぃ！？この程度は察して先回りしておくべきだろう！！"
"211110-30-イロハ" = "無茶言わないでくださいよ……。"
"211110-31-イロハ" = "そもそも、別に悪影響はないですよね？"
"211110-32-イロハ" = "なんなら面倒ごとを肩代わりしてくれてるようなものですし。"
"211110-33-マコト" = "それが問題なのだ！！"
"211110-34-マコト" = "あいつらがゲヘナ中を掻き回すせいで、我々の失態が掘り返されるかもしれんのだぞ。"
"211110-35-マコト" = "風紀委員会を困らせるために放置していた諸々が表沙汰になれば……#n確実に厄介なことになる！"
"211110-36-マコト" = "万魔殿の威信と権力に傷が付く事態は、絶対に防がねばならん！"
"211110-37-マコト" = "威信と権力があるのか怪しいですし、叩かれたところで特に変わらなくないですか？"
"211110-38-マコト" = "このマコト様の立場が揺らぐかもしれないだろう！！"
"211110-39-イロハ" = "先輩はそれが一番大事ですもんね……。"
"211110-40-チアキ" = "でも、いろいろ変化は感じるよね。"
"211110-41-サツキ" = "そうね。特に売店とか食堂で。"
"211110-42-サツキ" = "みんな並ぶようになったし、割り込みもしないもの。#n我先にって突っ込んでいく子も減ったわよね。"
"211110-43-チアキ" = "近々、週刊[ruby=ぱんでも]万魔殿[/ruby]でも特集を組む予定なんです！"
"211110-44-チアキ" = "見出しは……「ゲヘナに訪れた秩序！我々の未来は？」とかどうです？"
"211110-45-マコト" = "却下だ！ゲヘナは自由であるべきなのだぞ！#n羽根の生えた連中のような思想は捨ててしまえ！"
"211110-46-マコト" = "秩序だなんだと縛りつけたところで奴隷根性を育てるだけだ。#nこのマコト様が上に立つ意義も薄れてしまう。"
"211110-47-マコト" = "奴隷の王など、道化に過ぎないではないか！！"
"211110-48-チアキ" = "わあ～！この発言も記録必須ですね！"
"211110-49-イブキ" = "マコト先輩……怒ってる？"
"211110-50-マコト" = "い、イブキ！？"
"211110-51-マコト" = "いや、怒ってなどいない。ちょっとだけ、ほんの僅かに不安なだけで……！"
"211110-52-イブキ" = "うぅ……マコト先輩が不安にならないといいな……。"
"211110-53-マコト" = "ほ、ほんの少しだ！#nゼロ……とまではいかんが、ほとんどゼロみたいなものだ！"
"211110-54-マコト" = "安心しろ、イブキ！#nマコト様はこれしきでくじけるほどヤワではない！"
"211110-55-イブキ" = "ほんと？じゃあイブキ安心～！"
"211110-56" = "イブキ、お手柄です。マコト先輩がようやく静かになりました。"
"211110-57-イブキ" = "でもね～最近、銃を撃ってる子が減った気がするの。"
"211110-58-イブキ" = "爆弾を爆発させたり～グレネードを撃ってる子もいないよね。"
"211110-59-マコト" = "そうだ……再興委員会の活動のせいで……。"
"211110-60-イブキ" = "イブキ、嬉しいんだ～#nビックリすることが、前より少なくなったから！"
"211110-61-マコト" = "そ、そうか……イブキは喜んでいるのか……。"
"211110-62-イロハ" = "おぉ、完全に勢い削がれましたね。"
"211110-63-チアキ" = "でも、本当に静かになりましたよね？"
"211110-64-チアキ" = "記者としては事件も事故も減って残念ではあるんですけどね。#nゲヘナの外まで取材に行くのも楽しいので私はオーケーです！"
"211110-65-マコト" = "くぅぅ……！！"
"211110-66-マコト" = "危機が迫っているのに、風紀委員会は何をしているのだぁぁ～～！！"
"211110-67-アコ" = "……。"
"211110-68-イオリ" = "……。"
"211110-69-チナツ" = "……。"
"211110-70-アコ" = "平和ですね……。"
"211110-71-チナツ" = "うん。こんな時間、いつぶりだろう。"
"211110-72-チナツ" = "最近、何かありました？校内がこんなに静かなわけないと思うんですけど……。"
"211110-73-イオリ" = "ゲヘナ再興委員会のおかげらしいよ。"
"211110-74-チナツ" = "ただの委員会が……これだけの影響力を？"
"211110-75-アコ" = "予想よりも精力的に活動しているようですよ。#n問題児を1ヶ所に集めて上手く統制しているのだとか。"
"211110-76-イオリ" = "前はゲヘナ中で事件が起きてたけど、最近は予測がつくようになった。"
"211110-77-イオリ" = "出動だって小規模な案件が多いし。仕事の負担も目に見えて減ってるよ。"
"211110-78-チナツ" = "負傷者が目に見えて減少しています。書類作業も同様ですね。"
"211110-79-アコ" = "そして何より――"
"211110-80-アコ" = "こんなに穏やかな寝顔……いつ以来でしょう。"
"211110-81-アコ" = "あのヒナ委員長が居眠りできる日がくるとは……。"
"211110-82-チナツ" = "このまま平和だといいね。"
"211110-83-チナツ" = "ふふ……こんな日々が続けば、風紀委員会が必要なくなるかも――"
"211110-84-イオリ" = "……。"
"211110-85-アコ" = "……。"
"211110-86-チナツ" = "あっ。いえ……そんなことは、ないと思いますけど！"
"211110-87-アコ" = "風紀委員会のないゲヘナ、ですか……。"
"211110-88-アコ" = "そんな未来も……悪くないのかもしれません。#n委員長は、ずっと引退したがっておられましたし……。"
"211110-89-イオリ" = "……。"
"211110-90-イオリ" = "……。"
"211110-91-カレン" = "はい、活動申請書。"
"211110-92-カレン" = "万魔殿の認可も取ったし、問題ないよね？"
"211110-93-イオリ" = "ああ。ちゃんと本物なんだな。"
"211110-94-カレン" = "やはっ、うちらは正当で合法的な手続きに基づいて活動してるんだよ。"
"211110-95-イオリ" = "うちの部活にしては常識的だな。"
"211110-96-カレン" = "面倒だしムカつくけど、やることはやらないと。"
"211110-97-カレン" = "好き勝手やるってのは、駄々こねてる子どもと変わんないし。"
"211110-98-イオリ" = "念のため言っとくけど……騒ぎは起こさないようにな。"
"211110-99-カレン" = "分かってるって。#nてか、そんなこと言ってていいの？"
"211110-100-イオリ" = "何？"
"211110-101-カレン" = "風紀委員会の仕事、無くなっちゃうかもだから。"
"211110-102-イオリ" = "何が言いたい？"
"211110-103-カレン" = "あれ、分かんない？"
"211110-104-カレン" = "考えてみて。みんなが規則を守って、問題児なんていないゲヘナを。"
"211110-105-カレン" = "そこに、風紀委員会って必要かな？"
"211110-106" = "それは……。"
"211110-107-イオリ" = "いや、そうとも限らない。いざという時の抑止力は――"
"211110-108-カレン" = "だ～か～ら～その抑止力が必要ない場所になったら？"
"211110-109-イオリ" = "……。"
"211110-110-カレン" = "まっ、ただの目標にすぎないけどね。今はまだ。"
"211110-111-イオリ" = "……少なくとも、今は違う。"
"211110-112-イオリ" = "騒ぎを起こせば私たちが出動する。忘れるなよ。"
"211110-113-カレン" = "そんなこと起こす気もないんだけどなぁ……。"
"211110-114-カレン" = "ねえ。あんた達が来た後ってどうなるの？"
"211110-115-イオリ" = "……何？"
"211110-116-カレン" = "来て、見てるだけ？違うよね？ね、どうなるのかな？"
"211110-117-イオリ" = "お望みなら実演してやろうか？"
"211110-118-カレン" = "お。やる？やっちゃう？"
"211110-119-カレン" = "委員長以外はあんまり信用してなかったし。#n腕前を直接確かめられるなんて良い機会じゃん？"
"211110-120-イオリ" = "……。"
"211110-121-ヒナ" = "だからこそ、線を引くために私たちがいる。"
"211110-122-イオリ" = "……やめとく。"
"211110-123-カレン" = "あれ？"
"211110-124-カレン" = "逃げたってことでいいの？"
"211110-125-カレン" = "……いや、こんな挑発したって意味なさそうな目してるね。"
"211110-126-イオリ" = "……。"
"211110-127-カレン" = "何か理由があるんでしょ？#n緩くて中途半端な風紀委員会なりの。"
"211110-128-イオリ" = "好きに思えば。"
"211110-129-カレン" = "やはっ。じゃあ今日はお開きかな。"
"211110-130-カレン" = "次は我慢しないでくれると嬉しいな。"
"211110-131-イオリ" = "……。"
"211110-132-イオリ" = "そんな日が来たら……。"
"211110-133" = "次回;お悩み解決"
