[translation]
"211090-1" = "第9話;チャンス"
"211090-2" = "ゲヘナ再興委員会"
"211090-3-カレン" = "先生！やっほー！"
"211090-4-カレン" = "やっほ～！"
"211090-5" = "[s] \"やっほー。\""
"211090-6-ショウコ" = "お越しいただきありがとうございます。"
"211090-7-ショウコ" = "早速本題で恐縮なのですが、本日協力していただきたいのは――"
"211090-8-ショウコ" = "「ポイント提携店」との新規契約です！"
"211090-9" = "[s] \"気合の入れ方が違う……！\""
"211090-10-カレン" = "最近SNSでめっちゃバズってるお蕎麦屋さんだよ。#n昼休みは2時間待ちが当たり前。"
"211090-11" = "[s] \"昼休みに……2時間待ち？\""
"211090-12-ショウコ" = "授業をサボって昼休み前から並ぶか、次の授業をサボるかしているそうです。"
"211090-13-ショウコ" = "実にゲヘナらしいですね。"
"211090-14-ショウコ" = "規律に従わない生徒がいるのなら、そうせずに済む環境を整えるのが私たちの目標。"
"211090-15-ショウコ" = "この店を新規提携先に選んだ理由も、そこにあります。"
"211090-16-ショウコ" = "前置きはこのくらいにして、ひとまず行きましょう。"
"211090-17-マユミ" = "こちらです。"
"211090-18-マユミ" = "蕎麦食べるの久しぶりかも！#n最近忙しかったし、ずっと売店で済ませてたからね。"
"211090-19-カレン" = "食べてみようって話には賛成だけど、奢ってもらっちゃっていいの？"
"211090-20" = "[s] \"大丈夫、大丈夫。\""
"211090-21-ショウコ" = "人に厚意を示せる機会はそう多くありません。どうか私たちに感謝してください。"
"211090-22" = "[s] \"あ、そっちが感謝される側？\""
"211090-23-マユミ" = "奢ってもらうのに何言ってんのさ。"
"211090-24-ショウコ" = "私はこれでいいんです。一介の書記ですから。"
"211090-25-マユミ" = "ショウコちゃんの中で書記って……。"
"211090-26-マユミ" = "とにかく！ありがとう、先生！"
"211090-27-ショウコ" = "おや？なにやら面白いイベントをやっているようですね。"
"211090-28-ショウコ" = "わんこそば100杯チャレンジ成功で全額無料……。"
"211090-29-マユミ" = "やー、100杯は無理じゃない？そんな食べらんないよ。"
"211090-30-マユミ" = "フードファイターか、お腹に亜空間を持ってる人しか挑戦しないでしょ。"
"211090-31-マユミ" = "早く順番来ないかな～！"
"211090-32-ゲヘナの生徒A" = "ありがとうございました～！"
"211090-33-ゲヘナの生徒A" = "……。"
"211090-34-ゲヘナの生徒B" = "……もう来なくていいかな。"
"211090-35-ゲヘナの生徒A" = "だよね。あんなに待たされたのに。時間の無駄だった。"
"211090-36" = "[ns] \"……。\""
"211090-37" = "（その後も、楽しそうな顔で出てくる人はほとんどいなかった）"
"211090-38" = "（かなり長い時間待ち続けた）"
"211090-39" = "（ようやく席について注文を済ませると……）"
"211090-40-店主" = "はい、お待ちどうさま～！ざるそば定食、四人前で～す！"
"211090-41-マユミ" = "えっ、早すぎない！？もうお腹ぺこぺこだから嬉しいけど！"
"211090-42-カレン" = "見た目はめちゃ美味しそうだね。"
"211090-43-マユミ" = "いただきまーす！"
"211090-44" = "[s] \"いただきます！\""
"211090-45-カレン" = "……。"
"211090-46-マユミ" = "……。"
"211090-47-ショウコ" = "……。"
"211090-48-マユミ" = "うーん……。"
"211090-49-マユミ" = "……味、薄くない？"
"211090-50-ショウコ" = "私のは驚くほどしょっぱいです。#nそちらの塩分がすべて移ってきたのかと思うくらい。"
"211090-51-カレン" = "なんか、バランスがさ……。"
"211090-52" = "[s] \"美味しくは……ないね。\""
"211090-53-カレン" = "だよね、かなり微妙。"
"211090-54-ショウコ" = "空腹補正がかかっていてこの評価なら、かなり深刻です。"
"211090-55-マユミ" = "なんで人気なんだろ……？"
"211090-56-カレン" = "先生が奢ってくれたし、楽しく食べたかったのに……。"
"211090-57-ショウコ" = "私たちはまんまと騙されたわけです。"
"211090-58-ショウコ" = "わんこそば100杯という噂に！！"
"211090-59-マユミ" = "それ気にしてたのショウコだけじゃない？"
"211090-60-？？？" = "これは……見過ごせませんわね。"
"211090-61" = "[ns] \"この声は……！\""
"211090-62-ハルナ" = "SNSで話題だと聞き、美食の地平を広げるべく足を運んでみれば――"
"211090-63-ハルナ" = "とんだ無駄骨でした。"
"211090-64-店主" = "ひっ……！あ、あなた達は……！"
"211090-65-ハルナ" = "蕎麦は「三たて」……すなわち、挽きたて・打ちたて・茹でたてが命です。#nですが……これはどうでしょう？"
"211090-66-ハルナ" = "蕎麦の香りはまったく感じられず。#nすすぎ切れていないでんぷん質は、まるで泥を噛んでいるような舌触り。"
"211090-67-ハルナ" = "何より絶望的なのは、つゆのアンバランスさ！#n醤油と出汁が好き勝手に暴走して悲鳴を上げています。"
"211090-68-イズミ" = "見てこれ！麺が伸びて団子みたいに固まってるんだけど！？#nどうやって食べろって言うのよ！"
"211090-69-アカリ" = "期待していたんですけど……残念ですね★#nただただ[ruby=・]量[/ruby]しか言及するところがないなんて。"
"211090-70-イズミ" = "ピーナッツバターとタバスコを一緒に入れたらどうかな？#nちょっとはマシになるかも！"
"211090-71-ハルナ" = "基本すら忘れた飲食店に存在価値はありません。"
"211090-72-店主" = "や、やめて……！！心を入れ替えるから、どうかお慈悲を……！"
"211090-73-ハルナ" = "いえ……このような店は存在自体が食への冒涜！ならば――！！"
"211090-74" = "[ns] \"待って……！\""
"211090-75-ハルナ" = "あら、先生もいらしたのですね。ごきげんよう。"
"211090-76-イズミ" = "こんにちは～"
"211090-77-イズミ" = "わ～先生だ！"
"211090-78-イズミ" = "え、先生も食べたの？これ……。"
"211090-79-ハルナ" = "……。"
"211090-80-ハルナ" = "なるほど。この粗末な蕎麦を先生にも出したのですね。#nもはや考慮の余地はありません。"
"211090-81" = "[s] \"ちょっ、ちょっと考え直さない？\""
"211090-82-ハルナ" = "……。"
"211090-83-ハルナ" = "なぜ止めるのですか？#nまさか……料理がお気に召したとでも？"
"211090-84" = "[s] \"あ、不味いのは確かだよ、うん。\""
"211090-85-店主" = "ぐふぅっ……！？"
"211090-86-マユミ" = "美食研究会の爆破行為は、ゲヘナの評判をひどく傷つけています。"
"211090-87-マユミ" = "彼女たちを統制できれば、理想に大きく近づきます。"
"211090-88-マユミ" = "……よし、勝負だね！"
"211090-89-マユミ" = "こんにちは！"
"211090-90-ハルナ" = "あなた方は……。"
"211090-91-マユミ" = "私たちはゲヘナ再興委員会！"
"211090-92-ハルナ" = "存じています。ゲヘナを変えようとしているのだとか。"
"211090-93-マユミ" = "そう！#nそれで相談なんだけどさ、このお店の「改善」に賭けてみない？"
"211090-94-ハルナ" = "改善？あり得ませんわね。"
"211090-95-カレン" = "それでも爆破は下策かと。可能性の芽を摘んでしまうのですから。"
"211090-96-カレン" = "気持ちは分かるけど、即爆破はやりすぎじゃない？"
"211090-97-ハルナ" = "だから、私たちと勝負！"
"211090-98-マユミ" = "このお店に時間をあげるの。1週間くらい！"
"211090-99-マユミ" = "それまでは爆破をいったん保留。"
"211090-100-ハルナ" = "……？"
"211090-101-マユミ" = "この店が改善して合格点に届いたらさ、希望が証明されるでしょ？"
"211090-102-ハルナ" = "……？"
"211090-103-マユミ" = "しかも、もしかしたら美食の聖地になるかも！"
"211090-104-ハルナ" = "……。"
"211090-105-マユミ" = "……。"
"211090-106-マユミ" = "えっと……なんか反応ほしいな……。"
"211090-107" = "[ns] \"あっ……！！\""
"211090-108" = "ドカーン！！"
"211090-109-店主" = "あああああ！私の店がぁ！！"
"211090-110" = "[ns] \"ハルナ～！\""
"211090-111-マユミ" = "げほっ、げほっ……！"
"211090-112-カレン" = "結局こうなるんじゃ～ん。"
"211090-113-ショウコ" = "はあ……。"
"211090-114-ハルナ" = "当然の帰結です。"
"211090-115-ハルナ" = "ああ、みなさんの言いたいことは理解しました。"
"211090-116-マユミ" = "じゃあどうして！！"
"211090-117-ハルナ" = "私たちの信念とは相反するからです。"
"211090-118-ハルナ" = "すでにこの店は美食の道を踏みにじりました。#nなぜ「チャンス」という贅沢を与えねばならないのでしょうか？"
"211090-119-ハルナ" = "なにより、この店だけ特別扱いしては、今まで木っ端微塵になってきた数多の店が浮かばれませんわ。"
"211090-120-アカリ" = "そういうことです★"
"211090-121-ジュンコ" = "うえっ、ぺっぺっ！木くず入った！"
"211090-122-ジュンコ" = "私、まだ一口も食べれてないのに……。"
"211090-123-マユミ" = "うぅ……本気でこれ続ける気！？"
"211090-124-マユミ" = "あっちこっちの店を爆破して回るつもりなの！？"
"211090-125-ハルナ" = "勘違いされては困ります。私たちは手当たり次第に爆破しているわけではありません。"
"211090-126-ハルナ" = "美食への想いを、軽く見ないでいただけますか？"
"211090-127-マユミ" = "こんなことしてるからゲヘナの印象が悪くなるんだよ！テロリストじゃん！"
"211090-128-マユミ" = "本質的な過ちは、対価に見合うサービスを提供できない飲食店側にあるのでは？"
"211090-129-マユミ" = "客は代金を支払い、店は金額に見合う料理を出す。簡単なことでしょう？"
"211090-130-マユミ" = "この基本すらできない店に存続する価値があるとでも？"
"211090-131-マユミ" = "言ってることは正論だ……！"
"211090-132-ハルナ" = "覚えておいてください。私たちは美食研究会。"
"211090-133-アカリ" = "美味しいものを食べるためなら。"
"211090-134-ジュンコ" = "どんな苦難も乗り越えてみせる――"
"211090-135-ジュンコ" = "――あれ、なんだっけ？"
"211090-136-イズミ" = "EAT OR DIE～！"
"211090-137-アカリ" = "では、またお会いしましょう。先生と――"
"211090-138-アカリ" = "「料理の後に残ったオイスターソース保存委員会」の皆さん！"
"211090-139-マユミ" = "ちがーう！「ゲヘナ再興委員会」だから！！"
"211090-140" = "[ns] \"結局こうなるのか……。\""
"211090-141-ショウコ" = "やはり彼女たちは一筋縄ではいきませんね。"
"211090-142-カレン" = "そもそも、どうにかできるのかな？#n力ずくでねじ伏せるとかならともかく――"
"211090-143-ショウコ" = "なんであれ、努力は続けなければなりません。#nゲヘナのために、制御不能な存在を減らすのです。"
"211090-144-ショウコ" = "……必ず。"
"211090-145-マユミ" = "次こそは説得してみせる！"
"211090-146-カレン" = "とはいえ……美食研究会の考え方自体には共感できる部分もあります。"
"211090-147-カレン" = "どのへん？"
"211090-148-ショウコ" = "弱肉強食の世界で「もう1度」は贅沢だ、という点です。"
"211090-149-マユミ" = "ショウコ、たまに冷たいよね。"
"211090-150-ショウコ" = "事実ですから。"
"211090-151" = "[s] \"でも、やり直すチャンスはあるといいよね。\""
"211090-152-ショウコ" = "……そうですか。"
"211090-153-ショウコ" = "誰にでも等しく与えられるなら、それも悪くはないかもしれません。"
"211090-154-マユミ" = "まあまあ。今日は失敗しちゃったけど気にしない！"
"211090-155-マユミ" = "私たちの歩みは止まらないんだから！"
"211090-156-カレン" = "んー、とりあえず何か食べない？もうお腹ぺこぺこ……。"
"211090-157-ショウコ" = "わんこそばにしましょう。近くに別の店があるので。"
"211090-158-カレン" = "そんなに食べたかったの？"
"211090-159-マユミ" = "行こ行こ！先生もお腹空いてるでしょ？"
"211090-160-ショウコ" = "その言葉を待ってたよ。是非ご馳走させてほしいな。"
"211090-161-ショウコ" = "――と、先生は考えました。"
"211090-162" = "[s] \"元々そのつもりだよ！\""
"211090-163" = "（食べるそばから出てくるお代わりと格闘しながら、与えられなかったチャンスについて考えた）"
"211090-164" = "（なお、その店はポイント提携をしてくれることになった）"
"211090-165" = "次回;交渉……？"
