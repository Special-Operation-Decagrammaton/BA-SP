[translation]
"211100-1" = "第10話;交渉……？"
"211100-2" = "ゲヘナ再興委員会"
"211100-3-ショウコ" = "では、次の議題に移りましょう。"
"211100-4-ショウコ" = "美食研究会との一件は覚えていますね？"
"211100-5-カレン" = "う、うん……統制できないって確信した。"
"211100-6-カレン" = "言葉が通じない感じ。"
"211100-7-ショウコ" = "別の方法を講じない限り、今後も不確定要素として残り続けるでしょう。"
"211100-8-ショウコ" = "そして――"
"211100-9-ショウコ" = "ゲヘナの不確定要素は、もう1つ。"
"211100-10-マユミ" = "あっ、分かったかも……！"
"211100-11-カレン" = "温泉開発部！！"
"211100-12-マユミ" = "あ～！先に言われた～！"
"211100-13-ショウコ" = "正解です。美食研究会と並び「二大テロ組織」と呼ばれる存在ですね。"
"211100-14-ショウコ" = "それすなわち、私たちが築こうとする「偉大なゲヘナ」の基盤を揺るがす存在です。"
"211100-15-カレン" = "美食研究会より話聞いてくれなさそうだけど……。"
"211100-16-カレン" = "何か作戦ある？"
"211100-17-ショウコ" = "すでに考えてあります。#n温泉開発部の強みは、メンバー同士の結束力です。"
"211100-18-ショウコ" = "そして同時に、それが弱点にもなるのです。"
"211100-19" = "[ns] \"だから私を呼んだんだね。\""
"211100-20-ショウコ" = "はい。"
"211100-21-ショウコ" = "温泉開発部を説得するには、先生の協力が不可欠だと判断しました。"
"211100-22" = "[s1] \"自信はあんまりないけど……。\"\n[s2] \"とりあえず行ってみよっか。\""
"211100-23-ショウコ" = "この先に、最近完成した温泉があるそうです。"
"211100-24-？？？" = "あれ？お客さん？#nごめんねー、まだオープンしてなくて――"
"211100-25-メグ" = "って、先生？"
"211100-26-メグ" = "どうしてここが分かったの？#nあっ！温泉の匂いを嗅ぎつけてきたのかな？"
"211100-27" = "[s3] \"そんなところかな。\"\n[s4] \"今日は一人？\""
"211100-28-メグ" = "うん！作業は全部終わってるから、部員はお休み！"
"211100-29-メグ" = "あ、カスミ部長なら別の現場だよ！"
"211100-30-ショウコ" = "……想定通りですね。"
"211100-31-メグ" = "あれ？その子は？#n私はメグ！温泉開発部の――"
"211100-32-ショウコ" = "作業班長で、元部長ですね。"
"211100-33-メグ" = "わわっ、なんで知ってるの？"
"211100-34-ショウコ" = "はじめまして、メグ班長。私はゲヘナ再興委員会の書記、[ruby=いがらし]五十嵐[/ruby]ショウコと申します。"
"211100-35-メグ" = "よろしくね！"
"211100-36-ショウコ" = "では、本題に入りましょう。"
"211100-37-ショウコ" = "本日お訪ねしたのは、とっておきの「贈り物」をお届けするためなんです。"
"211100-38-メグ" = "わあ！どんなプレゼント！？"
"211100-39-ショウコ" = "ゲヘナ全域の地温勾配図です。#nゲヘナ自治区に存在する大規模かつ活発な地脈が14箇所、#n細かいものを含めれば56箇所記されています。"
"211100-40-メグ" = "う～ん……？私、そういうのよく分かんなくて……。"
"211100-41-ショウコ" = "簡単に言えば、温泉を掘り当てられる場所が載っている「宝の地図」です。"
"211100-42-ショウコ" = "この地図には、温泉が湧く可能性のある地脈を記してあります。"
"211100-43-ショウコ" = "ですが、載せてあるのは全体のごく一部。#n電力網や上下水道ラインが通っていない地点だけを選びました。"
"211100-44-ショウコ" = "そのため、分布は都市外縁に集中しています。#n大規模な温泉リゾートを造成すれば、ゲヘナ自治区の収益に直結するでしょう。"
"211100-45" = "[s] \"前にデータを欲しがってたのは、これのためだったんだね。\""
"211100-46-ショウコ" = "ええ。もっと多くのデータがあれば理想でしたが、温泉開発部を統制するためなら、#nこの程度でも十分でしょう。"
"211100-47-ショウコ" = "ただし、注意点があります。#nこの地図は必ず、[ruby=しもくら]下倉[/ruby]メグに渡さなければなりません。"
"211100-48-ショウコ" = "先生の疑問はもっともです。#nなぜ部長である[ruby=きぬがわ]鬼怒川[/ruby]カスミに渡さないのか。"
"211100-49-ショウコ" = "その答えは、彼女は絶対に思い通りには動かないからです。#n先生がいらしたとしても変わらないでしょう。"
"211100-50-ショウコ" = "先生個人の頼みならともかく、そうでないことはすぐに見抜かれるはず。"
"211100-51-ショウコ" = "そこで、下倉メグなのです。"
"211100-52-ショウコ" = "なぜなら、鬼怒川カスミは下倉メグの「意思」に従うから。"
"211100-53-ショウコ" = "正確には、下倉メグの願いを叶えるために温泉開発部の部長を担っている、#nというべきでしょう。"
"211100-54" = "[s] \"……それ、どうやって知ったの？\""
"211100-55-ショウコ" = "目的意識と執念があれば、見えてくるものは多いものですよ。"
"211100-56-ショウコ" = "話が逸れましたね。#n結論として、私たちは下倉メグが1人のタイミングを見極める必要があります。"
"211100-57-メグ" = "これさえあれば、温泉を好きなだけ作れるってこと！？"
"211100-58-ショウコ" = "もちろんです。さらに、記載してあるのは厳選したポイントだけ。#n風紀委員会に追われる心配もありません。"
"211100-59-メグ" = "そうなの！？カスミ部長、ほんっとに風紀委員長を怖がってるから喜ぶと思う！"
"211100-60-メグ" = "あっ！でもカスミ部長に相談しなきゃ。"
"211100-61-メグ" = "うちはぜ～んぶ、カスミ部長の計画通りに動いてるんだ！"
"211100-62-ショウコ" = "違います。"
"211100-63-メグ" = "え？"
"211100-64-ショウコ" = "重要なのはあなたの意思。下倉メグがやりたいかどうか、です。"
"211100-65-メグ" = "そうなの？"
"211100-66-ショウコ" = "はい。温泉開発部では、それが最も優先されていますから。"
"211100-67-ショウコ" = "先生からも一言いただけますか？#nそのほうがメグさんも安心でしょう。"
"211100-68-メグ" = "うぅ……。"
"211100-69" = "（なんだか腑に落ちない気もするけど……）"
"211100-70" = "（地図の場所だけを開発するなら被害が減るのは事実だ）"
"211100-71" = "[ns] \"……メグは、温泉開発が好きだよね？\""
"211100-72-メグ" = "うん！大好き！ラーメンくらい……いや、ラーメン我慢できるくらい大好き！"
"211100-73" = "[s5] \"それなら地図の場所はぴったりだよ。\"\n[s6] \"他より質が良いらしいし。\""
"211100-74-メグ" = "えへへ、先生が言うなら間違いないね！"
"211100-75-メグ" = "よし！じゃあカスミ部長に言ってみる！"
"211100-76-ショウコ" = "必ず、[ruby=・]地[/ruby][ruby=・]図[/ruby][ruby=・]の[/ruby][ruby=・]場[/ruby][ruby=・]所[/ruby][ruby=・]だ[/ruby][ruby=・]け[/ruby]を開発してください。"
"211100-77-メグ" = "えっ？そういう決まりなの？"
"211100-78-ショウコ" = "別の場所は開発しない。それがこの地図をお渡しする条件です。"
"211100-79-メグ" = "そっか……うーん……それもカスミ部長に伝えておくね！"
"211100-80-ショウコ" = "ええ、そのままお伝えいただければと。"
"211100-81-メグ" = "こんな地図くれてありがとう！ショウコはいい人なんだね！"
"211100-82-ショウコ" = "……。"
"211100-83-メグ" = "じゃあカスミ部長のところ行ってくる！#n部長、絶対喜ぶよ～！"
"211100-84-メグ" = "ばいば～い！"
"211100-85-ショウコ" = "……簡単でしたね。"
"211100-86-ショウコ" = "鬼怒川カスミの反応は未知数ですが、結局は逆らえないでしょう。"
"211100-87-ショウコ" = "最も強い動機は、下倉メグの願いを叶えることですから。"
"211100-88-ショウコ" = "……先生。表情が晴れませんね。"
"211100-89" = "[s] \"ちょっと……罪悪感があって。\""
"211100-90-ショウコ" = "……。"
"211100-91-ショウコ" = "私たちは彼女に嘘はついていません。もちろん、騙してもいません。"
"211100-92-ショウコ" = "選別された情報を、選別された相手に渡しただけ。"
"211100-93-ショウコ" = "このまま上手く運べば、誰も損はしません。"
"211100-94-ショウコ" = "温泉開発部は温泉を掘り当てられる。ゲヘナは不確定要素を抑えられる。#nしかも熟練した土木作業員を必要な場所に投入できるおまけ付き。"
"211100-95-ショウコ" = "……誤解があるようですが、私は個人の自由を否定しているわけではありません。"
"211100-96-ショウコ" = "ええ、意外に思われるのも無理はありません。#n一見すると私たちの理念とは矛盾していますから。"
"211100-97-ショウコ" = "「自由」の定義が違うのです。#n「撃ちたい」「食べたい」。それらは自由ではなく、衝動に過ぎません。"
"211100-98-ショウコ" = "これまでのゲヘナ生は本能や衝動の奴隷でした。#nですがこれからは違います。"
"211100-99-ショウコ" = "そして私は、個人の自由より上位にある価値として「共同体への参加」があると考えています。自由とは集団の中でこそ完成するものですから。"
"211100-100" = "[s] \"どう考えるかは人それぞれじゃない？\""
"211100-101-ショウコ" = "そうでしょうね。承知しています。"
"211100-102" = "（ショウコと一緒に山を下りた）"
"211100-103-？？？" = "ハーハッハッハッハ！そうだ、この道を通ると思っていたよ！"
"211100-104" = "[ns] \"この声は……。\""
"211100-105-カスミ" = "いやぁ、さっきメグから話を聞いてね。#n居ても立っても居られず駆けつけてしまった。"
"211100-106-ショウコ" = "鬼怒川カスミ。"
"211100-107-カスミ" = "仲間外れだなんて、酷いことをするヤツもいたもんだなぁ？"
"211100-108-ショウコ" = "ふっ……。"
"211100-109-ショウコ" = "自己紹介をさせていただいても？"
"211100-110-カスミ" = "もちろんだとも！こんな気分にさせられたのは久しぶりだ。#n名前が気にならないわけないだろう？"
"211100-111-ショウコ" = "ゲヘナ再興委員会の書記、[ruby=いがらし]五十嵐[/ruby]ショウコです。"
"211100-112-カスミ" = "なるほど、なるほど。ふ～ん？"
"211100-113-カスミ" = "……。"
"211100-114-カスミ" = "おっ、と。お隣さんに挨拶をしそびれていた。#nやぁ先生。息災かな？"
"211100-115" = "[s] \"おかげさまで……。\""
"211100-116-カスミ" = "あーあー、そんな申し訳なさそうな顔をしないでくれ。#n先生は相変わらずお優しいようだ。"
"211100-117" = "心配せずとも、[ruby=・]し[/ruby][ruby=・]ょ[/ruby][ruby=・]う[/ruby][ruby=・]ゆ[/ruby]ちゃんの企みは分かっている。"
"211100-118" = "五十嵐ショウコです。"
"211100-119-カスミ" = "すまない、物覚えが悪くてね。ショックちゃん、だったか？#nいつか覚えてあげられる日が来るといいんだが……はてさて、来るかねぇ？"
"211100-120-カスミ" = "ま、挨拶はこの辺にしておこう。用件は分かっているだろう？#nわざわざメグ班長に、こんな「贈り物」をくれたんだから。"
"211100-121-カスミ" = "だがど～にもこれ、偏った地図に見えてしまうんだ。"
"211100-122-ショウコ" = "……。"
"211100-123-カスミ" = "「統制」しようって思惑が、ジワジワ～っと滲んでくるようじゃないか。"
"211100-124-カスミ" = "大人しく「ここほれワンワン」してろ、と？"
"211100-125-カスミ" = "こんなに熱心なファンレターをもらってしまったんだ。#n顔くらいは出しておきたくもなるってもんさ。"
"211100-126-ショウコ" = "それで？"
"211100-127-カスミ" = "……。"
"211100-128-カスミ" = "うん？"
"211100-129-ショウコ" = "つまり、やらないという話でしょうか？"
"211100-130-カスミ" = "……。"
"211100-131-カスミ" = "ハーッハッハッハ！いや～、実にいい！素晴らしい！"
"211100-132-カスミ" = "もちろん、やるとも。この地図に載っている場所を、すべて。#n……なぜだと思う？"
"211100-133-ショウコ" = "下倉メグが望むから。"
"211100-134-カスミ" = "……ああ、そうだ。"
"211100-135-カスミ" = "今回は乗ってやろう。"
"211100-136-カスミ" = "だが……これだけは覚えておけ。"
"211100-137-カスミ" = "「次」はないぞ？"
"211100-138-ショウコ" = "構いません。その時は「あそこ」に戻ってもらいましょう。"
"211100-139-カスミ" = "……何？"
"211100-140-ショウコ" = "そのままの意味です。"
"211100-141" = "[s] （あそこ……？）"
"211100-142-カスミ" = "ふむ……ハッタリにしては薄っぺらいなぁ。"
"211100-143-カスミ" = "少なくとも「こっち側」じゃあなさそうだ。#nそういう言い回しをしてるやつは生き残れなかったからな。"
"211100-144-ショウコ" = "用が済みましたら――"
"211100-145-ショウコ" = "気をつけてお帰りください。"
"211100-146-カスミ" = "……。"
"211100-147-カスミ" = "はーっはっはっは！いいじゃないか。気に入ったよ。"
"211100-148-カスミ" = "また会おう。……絶対に、な。"
"211100-149-カスミ" = "先生も！"
"211100-150" = "[s] \"カスミ……。\""
"211100-151-ショウコ" = "ふう……。"
"211100-152-ショウコ" = "やはり下倉メグを糸口にしたのは正しい判断でした。"
"211100-153-ショウコ" = "これでゲヘナ最大の不確定要素が1つ排除されました。#n……しばらくはですが。"
"211100-154-ショウコ" = "それでも、偉大なゲヘナに向けてまた一歩前進したと言えるでしょう。"
"211100-155-ショウコ" = "皆が同じ場所を見据える理想郷。#n一つの心で結束し、団結するゲヘナもそう遠くありません。"
"211100-156" = "[s] \"……。\""
"211100-157-ショウコ" = "……。"
"211100-158-ショウコ" = "先生は――"
"211100-159-ショウコ" = "私のやり方が間違っていると、お考えですか？"
"211100-160" = "[ns7] \"正しさは、私にも分からないけど……。\"\n[ns8] \"あんまり自分を追い詰めすぎないでほしいかな。\""
"211100-161-ショウコ" = "そう……見えましたか。"
"211100-162" = "[s9] \"必ず、とか。やらなきゃ、とか。\"\n[s10] \"そういうのって、先に自分がすり減っちゃうから。\""
"211100-163-ショウコ" = "……。"
"211100-164-ショウコ" = "…………。"
"211100-165" = "[ns] \"ショウコ？\""
"211100-166" = "（早足で遠ざかるショウコを追いかけた）"
"211100-167-ショウコ" = "……ショックです。そんな風に見えていただなんて。"
"211100-168-ショウコ" = "まっすぐな意志で突き進む立派な人のつもりだったのですが。"
"211100-169" = "[s] \"少し……危うく見えるよ。\""
"211100-170-ショウコ" = "そうですか……。"
"211100-171" = "[s] \"ショウコは、そういう人になりたかったの？\""
"211100-172-ショウコ" = "なりたかった……というより、見てみたかった、でしょうか。"
"211100-173-ショウコ" = "迷いもなく判断を下して、疑いもなく進み続けられる……そんな人を。#n先生はどなたかご存じですか？"
"211100-174-ショウコ" = "……なりたい人ならたくさん、ですか。"
"211100-175-ショウコ" = "どれだけ立派でも、自分を疑わなければ、いずれ独善になる……？"
"211100-176-ショウコ" = "……。"
"211100-177-ショウコ" = "さあ。世界のどこかには本当にそんな人も「いる」のかもしれませんね。"
"211100-178-ショウコ" = "……いえ。「いた」のかもしれません。"
"211100-179" = "（それ以降の帰り道に会話はなかった）"
"211100-180" = "次回;見知らぬ平和"
