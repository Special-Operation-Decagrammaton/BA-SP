[translation]
"211080-1" = "第8話;トリガー・ハッピー・ゾーン"
"211080-2" = "（なんだか、広場のほうが騒がしい）"
"211080-3" = "[ns] \"あれは……。\""
"211080-4-ゲヘナの生徒A" = "整理券！整理券ちょうだい！ずっと待ってたんだから！"
"211080-5-マユミ" = "ちょっと待ってね……はい、確認完了！#nおめでとう！今日の一番乗りだよ！"
"211080-6-ゲヘナの生徒A" = "ほら～みんなー、整理券配るから一列に並んで～！"
"211080-7-ゲヘナの生徒B" = "うげ、出遅れた……列ここで合ってる？"
"211080-8-ゲヘナの生徒B" = "はい。そのままお並びください。整理券は27番ですね。"
"211080-9-ゲヘナの生徒B" = "もうそんな後ろなの？結構並んでるとは思ったけど……。"
"211080-10-ゲヘナの生徒B" = "すぐ順番は回ってきますよ。"
"211080-11-ショウコ" = "……それでは30名に達しましたので、最初の組は出発しましょうか。#n皆さん、列のまま進んでください。"
"211080-12-ゲヘナの生徒C" = "みんなで一緒に動くのも、意外と楽しいよね。"
"211080-13-ゲヘナの生徒C" = "分かる！やってると癖になるって言うか。"
"211080-14-ゲヘナの生徒C" = "気づいたらポイントもすごい溜まってるしさ。#n二人はどんくらいになった？"
"211080-15-ゲヘナの生徒E" = "なにあれ……。"
"211080-16-ゲヘナの生徒F" = "なんの行列？"
"211080-17-ゲヘナの生徒E" = "ふっふっふっ、気になる？#nじゃあ……はい、パンフレット！"
"211080-18-ゲヘナの生徒E" = "え？あ、ども。"
"211080-19-ゲヘナの生徒E" = "なになに……#n『撃つも爆破もなんでもござれ！なんでも有りのトリガー・ハッピー・ゾーン』？"
"211080-20-ゲヘナの生徒F" = "『もう風紀委員会は怖くない！』……？"
"211080-21-ゲヘナの生徒E" = "こんな場所あったんだ？"
"211080-22-ゲヘナの生徒F" = "行ってみる？"
"211080-23-ゲヘナの生徒E" = "まあ、話のタネにはなりそうかな。#nイマイチだったら、いつも通り暴れればいいし！"
"211080-24-ゲヘナの生徒E" = "え、いいじゃん！"
"211080-25-ゲヘナの生徒F" = "これ、来てすぐ使えるの？もう撃っていい？"
"211080-26-マユミ" = "先着順だから、早い者勝ち！#nはい、この列に並んで～！"
"211080-27-ゲヘナの生徒G" = "ちょっ、なに！？私が先なんだけど！"
"211080-28-ゲヘナの生徒H" = "いや、変なとこに突っ立ってたじゃん。#n列に並んだのは私が先。あんたは後ろ行きな。"
"211080-29-ゲヘナの生徒G" = "はぁ？なんだよそれ！ルール守れって！"
"211080-30-ゲヘナの生徒H" = "は？あんた専用ルールでもあんの？#nここのルールは、先着で列に並んだ順。分かる？"
"211080-31-ゲヘナの生徒G" = "ちょっと、係員！ワガママ言うやつがいるんだけど！どうにかしてよ！"
"211080-32-ゲヘナの生徒G" = "はいはい、割り込みはダメだよ～？順番は守ろうね。"
"211080-33-カレン" = "このまま大人しく並んでるか、一番後ろに並びなおしか。どっちがいい？"
"211080-34-ゲヘナの生徒H" = "……わ、分かったよ。順番守ればいいんでしょ。"
"211080-35-カレン" = "分かればよろしい。そのほうが、結果早いから。"
"211080-36" = "[ns] \"思ったよりみんなルール守ってるね。\""
"211080-37-マユミ" = "先生！来てたんだ！"
"211080-38-ショウコ" = "ようこそいらっしゃいました。"
"211080-39-カレン" = "やっほ～、せんせ！"
"211080-40-カレン" = "み～んな、うちらが作ったルールを守ってくれてるんだよ。#nやはっ、すごくない？"
"211080-41-マユミ" = "あ、そうだ！今日ね、実は……大事なお知らせがあるの。"
"211080-42-マユミ" = "せっかく先生が来てくれたし、今やっちゃお。#n今回も手伝ってくれる？"
"211080-43-マユミ" = "あ、先生がやること？"
"211080-44-マユミ" = "今までと一緒！隣にいてほしいんだ！"
"211080-45-マユミ" = "皆さーん！楽しんでますかー！？"
"211080-46-マユミ" = "はーい！"
"211080-47-マユミ" = "今日は大事なお知らせがありまーす！"
"211080-48-マユミ" = "より良い環境を提供するために、『トリガー・ハッピー・ゾーン』は――#n営業時間を設けることになりました！"
"211080-49-ゲヘナの生徒A" = "えっ、24時間じゃなくなるってこと！？"
"211080-50-マユミ" = "そういうことです！"
"211080-51-ゲヘナの生徒C" = "なんで！？"
"211080-52-ゲヘナの生徒C" = "時間まで決められちゃったら、ここ来る意味なくない？"
"211080-53-マユミ" = "で、す、が……代わりに、特別イベントを開催します！#nなんと、ポイントが2倍たまるチャンス！"
"211080-54-ゲヘナの生徒A" = "おっ！マジ！？"
"211080-55-ゲヘナの生徒C" = "助かるー。新型スコープまでちょっと足りなかったんだ。"
"211080-56-ゲヘナの生徒B" = "でも、使える時間を制限されるのはなぁ……。"
"211080-57-ゲヘナの生徒C" = "それ。急に撃ちたくなったらどうすんのさ？"
"211080-58-ゲヘナの生徒B" = "みんな、思い出してみて。#n最後に風紀委員会を見たのっていつ？"
"211080-59-ゲヘナの生徒C" = "それは……まあ。ここなら、撃っても爆破しても風紀委員会はこないもんね……。"
"211080-60-ショウコ" = "ふふっ。追いかけられて、逮捕されて。その繰り返し。楽しくないですよね？"
"211080-61-ゲヘナの生徒A" = "……反省室送りはヤだなぁ。"
"211080-62-ゲヘナの生徒B" = "でも、ここなら「自由」だし……。"
"211080-63-ゲヘナの生徒B" = "それにさ、我慢も悪くはないかもよ？"
"211080-64-ゲヘナの生徒B" = "なにが？"
"211080-65-ゲヘナの生徒B" = "グッとこらえて、あとで一気に爆発させるってこと。"
"211080-66-ゲヘナの生徒B" = "……どゆこと？"
"211080-67-ゲヘナの生徒B" = "だから……ほら、ムズムズするあれ！#nはち切れそうな欲求不満を、ドッカーン！ってぶっ放す快感！"
"211080-68-ゲヘナの生徒A" = "なんか危ない話してる……？"
"211080-69-ゲヘナの生徒A" = "でも……。"
"211080-70-ゲヘナの生徒A" = "……分かるなぁ。良いかもしれない！"
"211080-71-カレン" = "いつでも手に入る快感って、だんだん価値なくなるでしょ？"
"211080-72-カレン" = "我慢して……待って……耐えに耐えて……むりむり、もう限界……っ！#nってところで得られる快感。これ、めっちゃクルんだよね。"
"211080-73-ゲヘナの生徒B" = "そう言われると、たしかに……。"
"211080-74-ゲヘナの生徒C" = "1回くらい我慢してみるのも、悪くないかも。"
"211080-75-ゲヘナの生徒B" = "え、じゃあ結局いつ使えるの？"
"211080-76-ゲヘナの生徒C" = "詳しい説明を聞きたい方は、こちらにお集まりください。"
"211080-77" = "（しばらくして）"
"211080-78-マユミ" = "ふぅ。思ったよりスムーズに行ったね！"
"211080-79-カレン" = "先生さまさまだね！隣にいてくれるだけで大助かり。"
"211080-80-カレン" = "ん？時間を制限した理由？"
"211080-81-カレン" = "や、24時間は無理っしょ。管理はうちらの仕事だから。#nずーっと、ここに張り付きってわけにもいかないし。"
"211080-82-カレン" = "これ、ショウコちゃんの案なんだ～"
"211080-83-マユミ" = "先生、考えてみて！#n前はさ、どこでも撃って、爆弾投げて、それが日常だったでしょ？"
"211080-84-マユミ" = "でも今は違う。ストレス発散のために、わざわざここに来るようになった。#n習慣が変わりはじめてるの！"
"211080-85-マユミ" = "じゃあ場所を守るようになった生徒が、時間も守るようになったらどうなると思う？"
"211080-86-マユミ" = "――ゲヘナにルールと秩序が生まれるの！！"
"211080-87-マユミ" = "無茶も好き勝手な行動もどんどん減って、偉大なゲヘナに近づく！どう？どう？"
"211080-88-ショウコ" = "こうしてゆっくり規律と統制に慣れさせる……まさに茹でガエル理論のように。"
"211080-89-カレン" = "やはっ、それってうちらが悪の組織みたいじゃん。#nショウコちゃん、たまにブラックなときあるよね～"
"211080-90-カレン" = "ぴったりの例えだなーとは思うけど。"
"211080-91-ショウコ" = "よほど特殊なケースでもない限り、人の考え方は1日やそこらで変わりませんから。"
"211080-92-マユミ" = "催眠術とかあったら楽なんだけどね……あるわけないか！"
"211080-93-ショウコ" = "そうですね。"
"211080-94-マユミ" = "でも……だからこそさ、コツコツ頑張ってきた甲斐があるよね。"
"211080-95-マユミ" = "無秩序で混沌としたゲヘナとはお別れだよ！"
"211080-96-マユミ" = "これまではゲヘナのポテンシャルが見えてなかったけど……。"
"211080-97-マユミ" = "きっといつかどの学園より秩序があって、綺麗で、誇らしい学園になるんだから！"
"211080-98" = "[s1] \"そんなゲヘナか……。\"\n[s2] \"あんまり想像つかないな……。\""
"211080-99-マユミ" = "先生、なんか反応ぬるくない？"
"211080-100-マユミ" = "あんま乗り気じゃない感じ？"
"211080-101" = "[s3] \"そういうわけじゃないんだけど……。\"\n[s4] \"アイデンティティがさ。\""
"211080-102-マユミ" = "なんで？"
"211080-103-マユミ" = "アイデンティティなんてこれから作ってけばよくない？"
"211080-104-マユミ" = "え、うーん……生徒一人ひとりの可能性を信じるのは……。"
"211080-105-マユミ" = "すっごく先生らしい意見だとは思う！"
"211080-106-マユミ" = "だって……私たちの可能性を信じてくれたんだもんね。"
"211080-107-ショウコ" = "……。"
"211080-108-マユミ" = "偉大になる道は1つじゃない……。みんな同じにならなくても、か……。"
"211080-109-マユミ" = "でもさ、全員で同じ場所を目指せたら素敵じゃん？#nゲヘナってそれが全然できてなかったから。"
"211080-110-ショウコ" = "協調性と集団意識は、偉大なゲヘナに必須の素養です。"
"211080-111-カレン" = "それに、ここにいる生徒は全員、自分の意思で集まってる。"
"211080-112-カレン" = "楽しそうだから、友達が行くから、なんとなく気になったから。#n理由はバラバラでも、自分から動いたんだよ。"
"211080-113-カレン" = "うちらは絶対に強要しない。無理やり変わっても意味ないから。"
"211080-114" = "[ns] \"そっか、私が心配しすぎだったのかも。\""
"211080-115-マユミ" = "そうそう！先生は生徒を信じて応援してほしいな。"
"211080-116-ショウコ" = "これからはゲヘナのために、粉骨砕身の覚悟で頑張るから心配しなくていいよ。"
"211080-117-ショウコ" = "――と、先生は考えました。"
"211080-118" = "[s] \"そこまで考えてないよ！\""
"211080-119-ショウコ" = "ちぇっ。"
"211080-120-マユミ" = "とにかく、私たちがやることは1つ！"
"211080-121-マユミ" = "ゲヘナを、再び偉大に！！"
"211080-122-ゲヘナの生徒A" = "一つになったゲヘナのために！"
"211080-123" = "（生徒が自分で選んだ道を進もうとしている）"
"211080-124" = "（その気持ちを大人として支えていく）"
"211080-125" = "（今は全力を尽くそうと、心に決めた）"
"211080-126" = "次回;チャンス"
