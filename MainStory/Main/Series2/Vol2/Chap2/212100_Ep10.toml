[translation]
"212100-1" = "第10話;レジスタンス結成"
"212100-2" = "[ns] \"みんな顔見知りだよね？\""
"212100-3-イオリ" = "……この組み合わせ、本気なのか？"
"212100-4-カレン" = "力を合わせるって、風紀委員会と万魔殿だったの……？"
"212100-5-カレン" = "ちょっと、ちょっと！信用していいの？"
"212100-6-カレン" = "問題の中心にいるのって、この子らの先輩じゃん？"
"212100-7-チアキ" = "言い方はあれですが、反論の余地がありません……！"
"212100-8-イオリ" = "おい、ゲヘナ再興委員会、口の利き方には気をつけろ。"
"212100-9-イオリ" = "それに、怪しいのはお前らもだからな？"
"212100-10-カレン" = "へぇ？何が怪しいっていうわけ？"
"212100-11-イオリ" = "いつも言ってたよな、「一つになったゲヘナ」って。"
"212100-12-イオリ" = "この状況、無関係なわけないだろ？"
"212100-13-イオリ" = "そ、れは私たちにも分からなくて……！こんなの望んでなかったってば！！"
"212100-14" = "皆さん、落ち着いてください。"
"212100-15-チナツ" = "ここにいるのは先生が集めた生徒だけです。"
"212100-16-チナツ" = "信用する理由はそれで十分ではないでしょうか。"
"212100-17-イオリ" = "むぅ……。"
"212100-18-マユミ" = "……まあ、それはそう。"
"212100-19-イロハ" = "流石は先生。信頼が厚いですね。……まあ、私も同意見ですけど。"
"212100-20-イロハ" = "ともかく、現状に問題を感じる者が集まっている。そういうことでしょう。"
"212100-21-イオリ" = "というか……お前ら、もう1人いなかったか？"
"212100-22-マユミ" = "あ――"
"212100-23-カレン" = "……ショウコちゃんは考えが違うみたい。"
"212100-24-イオリ" = "風紀委員会の中ですら意見が割れるくらいだしな……。"
"212100-25" = "[s] \"大変な状況なのに集まってくれてありがとう。\""
"212100-26" = "（分かっていることの全てを説明した）"
"212100-27-マユミ" = "洗脳って……そんなことできるの……？"
"212100-28-カレン" = "3年生が変わったのも、それが原因……？"
"212100-29-チアキ" = "NKウルトラって本当にあったんですか！？なんで？何のために？"
"212100-30" = "[s1] \"急に言われても混乱するとは思う。\"\n[s2] \"でも、何としても阻止しなきゃいけない。\""
"212100-31-イロハ" = "はい、必ず。"
"212100-32-マユミ" = "洗脳を解く方法ってあるの？"
"212100-33-イオリ" = "それは……別で研究中。"
"212100-34-マユミ" = "……できるのかな？"
"212100-35-チナツ" = "原理は不明でも、完全に不可能ではないと聞いています。"
"212100-36-カレン" = "もしも洗脳が解けなかったら……？"
"212100-37-イロハ" = "……。"
"212100-38-マユミ" = "このまま進んで、キヴォトス全部がゲヘナになるなんて、私は嫌だよ！"
"212100-39-マユミ" = "そんなの誇れるゲヘナじゃないもん！"
"212100-40-マユミ" = "私が作りたかったのは、いつも堂々としていられて恥ずかしくないゲヘナなの。#n誰かを踏みにじるようなのじゃなかったんだから！"
"212100-41-マユミ" = "どれだけ強くたって、そんなのは絶対ヤダ！"
"212100-42-カレン" = "やはっ！そういうこと！誰彼構わず撃つための銃じゃないんだからさ！"
"212100-43-イオリ" = "……嫌いじゃないよ、そういうの。"
"212100-44-チナツ" = "私も、マユミ委員長のお話には賛成です。"
"212100-45-チナツ" = "私たちは、越えてはならない線を守るために風紀委員会に入りました。"
"212100-46-チナツ" = "その線は必ずしも明文化されているわけではありません。#n時には自分で判断しなければならないものだと思っています。"
"212100-47-イオリ" = "今がその時なんだ。線を越えようとするのがゲヘナそのものでも、貫いてみせる。"
"212100-48-イオリ" = "……その相手が身内だとしても。"
"212100-49-チナツ" = "委員長……行政官……。"
"212100-50-サツキ" = "手掛かりが見つかったわ！"
"212100-51-カレン" = "うわっ、万魔殿の議員！！"
"212100-52-カレン" = "ねぇ、この人3年生じゃないの？"
"212100-53-サツキ" = "あら、あなた達もいたのね。呼ぶとは聞いていたけど。"
"212100-54-カレン" = "3年生はみんなおかしくなったって話じゃなかった？"
"212100-55" = "サツキ先輩は例外です。さっき言ったでしょう？NKウルトラを研究していたと。"
"212100-56-マユミ" = "あ、そっか。びっくりした。"
"212100-57-サツキ" = "ふーん、チアキも来たのね。"
"212100-58-チアキ" = "はい～！マコト先輩があんな風になっちゃったのに、じっとしてなんていられません！"
"212100-59-チアキ" = "サツキ先輩までこっち側だとは思ってませんでしたけど！"
"212100-60-サツキ" = "あっちとかこっちとか……間違ってはいない表現かもしれないわ。"
"212100-61-サツキ" = "じゃあ今、イブキは？"
"212100-62" = "……。"
"212100-63-サツキ" = "ここに連れてくるには、さすがにまだ幼いものね。"
"212100-64-サツキ" = "なにせ「反逆者クラブ」なのだから。"
"212100-65-イオリ" = "反逆者って……。"
"212100-66-サツキ" = "イブキは何も知らないままの方がいいのかもしれません。"
"212100-67-イロハ" = "……それはそうと、サツキ先輩は手掛かりを見つけたのでは？"
"212100-68-サツキ" = "あ、そうそう。ふふ。聞いて驚きなさい。"
"212100-69" = "[s] \"何か分かったの？\""
"212100-70-サツキ" = "ええ。ここからはよく聞いて頂戴。"
"212100-71-サツキ" = "人間の神経網にはそれぞれ固有の共振周波数がある。それは知っているわよね？"
"212100-72" = "いや、全然。"
"212100-73-サツキ" = "そう……まぁ知らなくても構わないわ。"
"212100-74-サツキ" = "真なるNKウルトラ計画――つまり雷帝の洗脳は、この固有振動数を外部の周波数によって強制同期させた……と仮定してみたの。"
"212100-75-サツキ" = "すると、1つの仮説が浮かぶわ。"
"212100-76-サツキ" = "脳波を特定の状態に無理やり固定しているのだとしたら、#n波の打ち消し効果でその固定を解けるかしら？"
"212100-77-イオリ" = "……え、あの、何て？"
"212100-78-サツキ" = "それが可能なのよ！理論上は！"
"212100-79-サツキ" = "でも、本当の問題はここから。"
"212100-80-サツキ" = "この方法は、洗脳に使われた周波数が分かっていることが大前提。"
"212100-81-サツキ" = "どうやって割り出すのかが問題なのよね。#nもう1回洗脳してみろ、なんて言えるわけもないし。"
"212100-82-チアキ" = "……あ。言ってることはほとんど分からなかったですけど、#n最後のだけ心当たりあるかもです！"
"212100-83-サツキ" = "教えて頂戴。"
"212100-84-チアキ" = "それ、放送室にあるんじゃないですか？"
"212100-85-チアキ" = "マコト先輩の演説は放送室の機材を使っていました。"
"212100-86-チアキ" = "一緒にずっと流れてたノイズとか変な単語も同じなのかも？"
"212100-87-チアキ" = "放送室を探れば、何か出てくるんじゃないかなって……。"
"212100-88-サツキ" = "……。"
"212100-89-チアキ" = "あ、やっぱり的外れでしたかね？"
"212100-90-サツキ" = "違うわ、逆よ！大手柄！どうしてその発想に至らなかったのかしら！"
"212100-91-イロハ" = "鋭い着眼点だと思いますよ。"
"212100-92-チアキ" = "あはっ、記者としての勘ってやつですかね。"
"212100-93-マユミ" = "じゃあ放送室に行けば何とかできるの！？"
"212100-94-サツキ" = "まだ何とも言えないけれど、使われた機材を解析できれば手掛かりは得られるはずよ。"
"212100-95-サツキ" = "そのために必要なのは、キャリアウェーブを抽出できる装置と――"
"212100-96" = "[ns] \"なんか、うまくいきそう……！\""
"212100-97" = "（楽観は禁物だが、小さくとも希望が芽生えた気がした……）"
"212100-98" = "次回;そばにいたい"
