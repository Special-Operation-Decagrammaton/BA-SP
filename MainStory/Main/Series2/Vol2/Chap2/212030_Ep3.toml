[translation]
"212030-1" = "第3話;ゲヘナ再興委員会の反応"
"212030-2-マユミ" = "……。"
"212030-3-カレン" = "……。"
"212030-4-ショウコ" = "……。"
"212030-5-マコト" = "歪んだキヴォトスを正し、ゲヘナの名の下に真の秩序を打ち立てる――戦いの始まりだ。"
"212030-6-マユミ" = "……。"
"212030-7-カレン" = "……。"
"212030-8-ショウコ" = "……。"
"212030-9-マユミ" = "ダメだー、ぜんっぜん分かんない。"
"212030-10-カレン" = "それなー。"
"212030-11-マユミ" = "でも……何が何だかさっぱりだけどさ……。"
"212030-12-マユミ" = "私たちが望んでたことだったりしない？"
"212030-13-カレン" = "え？"
"212030-14-マユミ" = "だって、ゲヘナがまとまろうとしてるじゃん。"
"212030-15-マユミ" = "万魔殿の議長と風紀委員長が対立してるのって、大きな問題だったわけだし。#nそれが解消されたんだよ。"
"212030-16-カレン" = "まあ、それはそうだけど……いいの？ほんとに。"
"212030-17-マユミ" = "んー、こういうのはなんか違う気がするんだよね……。"
"212030-18-カレン" = "攻め込む、って……。"
"212030-19-ショウコ" = "……。"
"212030-20-マユミ" = "言葉の綾だったりしないかな……？"
"212030-21-カレン" = "ほら、あるじゃん？#n大きな敵と戦うために、これまでのライバルと手を組む～みたいな。"
"212030-22-マユミ" = "それにしては本気っぽかったけど……いやいや、まさかね。"
"212030-23-マユミ" = "そもそも、そんな簡単にできることでもないし。"
"212030-24-ショウコ" = "ですが、攻め込んではいけない理由もありません。"
"212030-25-マユミ" = "んん？"
"212030-26-カレン" = "どういう意味？"
"212030-27-ショウコ" = "言葉通りです。"
"212030-28-ショウコ" = "ゲヘナをまとめる最善の方法。それは、共通の敵を作ることです。"
"212030-29-カレン" = "でも、その相手がキヴォトスってのはやりすぎじゃない？"
"212030-30-ショウコ" = "そうは思いません。#nこれまで、ゲヘナを問題児集団だと見なして抑えつけてきたのは誰ですか？"
"212030-31-ショウコ" = "キヴォトスです。ゲヘナを認めさせるには、圧倒的な力が必要でしょう。"
"212030-32-ショウコ" = "ですから、これはゲヘナの正当な権利であり、キヴォトスからの認識に対する応答であると考えています。"
"212030-33-マユミ" = "そうかなぁ……？"
"212030-34-ショウコ" = "動かなければ、偉大さは得られません。"
"212030-35-カレン" = "それで……攻撃、か……。"
"212030-36-ショウコ" = "こういうの、真面目に考えたことなかったな……。"
"212030-37-ショウコ" = "といっても、今までと大きく変わることはありません。"
"212030-38-ショウコ" = "「トリガー・ハッピー・ゾーン」がキヴォトスに広がる。その程度の違いです。"
"212030-39-マユミ" = "どういうこと？"
"212030-40-ショウコ" = "号令に合わせて撃ち、爆破し、破壊する。"
"212030-41-ショウコ" = "その対象が、トリニティの本館、ミレニアムタワー、百鬼夜行の神木などに変わるだけ。"
"212030-42-ショウコ" = "それで十分です。"
"212030-43-マユミ" = "でも、反撃してくるよね？"
"212030-44-カレン" = "壊されるための標的とはだいぶ違う気がするけど。"
"212030-45-マユミ" = "そうそう。他の学園だって、かなり強いだろうし。"
"212030-46-マユミ" = "いくら私たちがひとつになったって――"
"212030-47-ショウコ" = "可能です。"
"212030-48-ショウコ" = "委員長も言っていたじゃないですか。私たちのあらゆる行動には意味があったと。"
"212030-49-マユミ" = "あ……うん。そんなこと言ったね。"
"212030-50-ショウコ" = "私たちの活動によって、今やゲヘナの大多数の生徒が隊列を維持して歩けますし――"
"212030-51-ゲヘナの生徒A" = "みんなで一緒に動くのも、意外と楽しいよね。"
"212030-52-ゲヘナの生徒B" = "分かる！やってると癖になるって言うか。"
"212030-53-ショウコ" = "戦術的な行動を取れるようになっています。"
"212030-54-ゲヘナの生徒C" = "前方にクレイモア！回避して右側から射撃開始！"
"212030-55-ゲヘナの生徒D" = "建物の上に狙撃手を確認！"
"212030-56-ゲヘナの生徒D" = "グレネードランチャー持ってきて！2階ごと吹っ飛ばすよ！#nあれを落とせば200ポイントだって！"
"212030-57-マユミ" = "そ、それはストレスを発散させるためで……。"
"212030-58-ショウコ" = "それを作り上げたのは誰でしょうか。"
"212030-59-ショウコ" = "私たちが。私が。貴女が。"
"212030-60-ショウコ" = "ゲヘナを作り替えたんです。"
"212030-61-マユミ" = "私、たちが……？"
"212030-62-カレン" = "作り替えた……？"
"212030-63-ショウコ" = "ええ。"
"212030-64-ショウコ" = "他の誰でもない、私たちが。"
"212030-65-マユミ" = "……。"
"212030-66-ショウコ" = "私たちがしてきたことには全て意味があったんです。"
"212030-67-カレン" = "……。"
"212030-68-ショウコ" = "歪んだキヴォトスを正し、ゲヘナの名の下に真の秩序を打ち立てる戦いが始まります。"
"212030-69-ショウコ" = "かつてのように、恐怖の象徴――どの学園も軽々しく見上げられなかったゲヘナへと戻るんです。"
"212030-70-ショウコ" = "ゲヘナが世界の基準となり、唯一の規則となる。"
"212030-71-ショウコ" = "旧き夢が叶う瞬間に、また一歩……。"
"212030-72-万魔殿の3年生" = "君が[ruby=いがらし]五十嵐[/ruby]ショウコだね？"
"212030-73-ショウコ" = "何かご用ですか？"
"212030-74-万魔殿の3年生" = "マコト議長から呼び出しだよ。万魔殿の作戦会議室に来てほしい。"
"212030-75-ショウコ" = "承知しました。"
"212030-76-ショウコ" = "それでは、行ってまいります。"
"212030-77-カレン" = "あ、うん。頑張ってね。……何の用か分かんないけど。"
"212030-78-カレン" = "いってらっしゃ～い。"
"212030-79-万魔殿の3年生" = "そういえば、君たちも一緒なんだったね。"
"212030-80-マユミ" = "あ、えっと……。"
"212030-81-カレン" = "あの時のセンパイじゃん？#n昔のゲヘナのこと話してくれた――"
"212030-82-万魔殿の3年生" = "ついに成就するんだよ！どうかな。君たちも嬉しいだろ？"
"212030-83-マユミ" = "えっ？何が……？"
"212030-84-万魔殿の3年生" = "ついにゲヘナが過去の姿を取り戻すんだよ！"
"212030-85-万魔殿の3年生" = "君たちもそれを夢見ていたんだろう？"
"212030-86-マユミ" = "え……昔の、ゲヘナ……？"
"212030-87-万魔殿の3年生" = "そう！恐怖で君臨していたあの時代！偉大だったゲヘナさ！"
"212030-88-マユミ" = "で、でも、あんまり良くなかったって言ってたよね？"
"212030-89-カレン" = "戻りたくないって言ってたのに、何でそんな嬉しそうなの？"
"212030-90-マユミ" = "ああ、それは忘れてくれ。私が間違ってたんだ。"
"212030-91-マユミ" = "……。"
"212030-92-万魔殿の3年生" = "昔のゲヘナは秩序と統制で支配されていた。まさに、君たちが夢見た通りに。"
"212030-93-万魔殿の3年生" = "みんな同じ心で、一つの目的だけを目指して動いていた。#n面倒で複雑なことなんて考えなくていい、偉大な学園だったのさ。"
"212030-94-カレン" = "……。"
"212030-95-万魔殿の3年生" = "あの時は果たせなかったことが、ようやく実現しようとしてるんだ。"
"212030-96-万魔殿の3年生" = "キヴォトスに攻撃を仕掛ける！こんなに痛快なことがあるか？"
"212030-97-万魔殿の3年生" = "ついにゲヘナが戻ってくるんだ。昔の、偉大で恐ろしかったゲヘナが。"
"212030-98-マユミ" = "なんか……前とキャラ違くない……？"
"212030-99-カレン" = "先輩、大丈夫？"
"212030-100-万魔殿の3年生" = "もちろん。最高な気分だよ！"
"212030-101-万魔殿の3年生" = "この前まではさ、無責任な自由が好きで、昔に戻りたいなんて考えもしなかった。"
"212030-102-万魔殿の3年生" = "でも、ようやく気づいたんだ。"
"212030-103-万魔殿の3年生" = "じゃあ、私はこれで戻るよ。"
"212030-104-万魔殿の3年生" = "君たちもせいぜい頑張りなよ。#nこの戦いに参加できること自体、本当に光栄なことなんだから。"
"212030-105-カレン" = "……ねぇ。"
"212030-106-カレン" = "あの先輩、過去に幻想を抱くなって言ってたよね？"
"212030-107-マユミ" = "……だね。"
"212030-108-カレン" = "……。"
"212030-109" = "次回;一つになったゲヘナ"
