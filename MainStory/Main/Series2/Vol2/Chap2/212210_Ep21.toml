[translation]
"212210-1" = "第21話;消えることのない"
"212210-2" = "[ns] \"ヒナ、いる？\""
"212210-3-ヒナ" = "先生。来てくれたんだ。"
"212210-4" = "[s] \"大丈夫？ちょっと根を詰めすぎじゃない？\""
"212210-5-ヒナ" = "これくらいなら問題ないわ。#nそもそも、泣き言を言っていられる暇も無いもの。"
"212210-6" = "[s1] \"私も人のことは言えないんだよね……。\"\n[s2] \"ゲヘナにかかりきりだったから……。\""
"212210-7-ヒナ" = "あ……。"
"212210-8" = "[ns] \"あっ、ごめん！そんなつもりじゃなくて……。\""
"212210-9-ヒナ" = "先生、相変わらずね。"
"212210-10-ヒナ" = "……。"
"212210-11-ヒナ" = "先生……。"
"212210-12-ヒナ" = "私、また間違えた。"
"212210-13-ヒナ" = "本当……馬鹿みたい。"
"212210-14-ヒナ" = "何よりも嫌いで、捨て去りたい過去だったのに。"
"212210-15-ヒナ" = "ねっとりした……底で淀んだ真っ黒い感情が、今も生々しく残ってる。"
"212210-16-ヒナ" = "私が何を嫌っているか……先生は分かる？"
"212210-17-ヒナ" = "……あの時。"
"212210-18" = "気分がよかったの。"
"212210-19-ヒナ" = "拳を握って、それを振り下ろす準備をしていたことが。"
"212210-20-ヒナ" = "暴力を正当化するために大義名分をこじつける過程が。"
"212210-21-ヒナ" = "少しだけ……心地よかった。"
"212210-22-ヒナ" = "……。"
"212210-23-ヒナ" = "それが……一番気持ち悪い。私がそういう人間だったってことが。"
"212210-24-ヒナ" = "線を守る、なんて言ってたのにね。"
"212210-25-ヒナ" = "何を馬鹿なこと言ってるんだろう。はは。"
"212210-26-ヒナ" = "心の奥では、ああいう行いに快感を覚えてる私がいるのに。"
"212210-27-ヒナ" = "そんな私が風紀委員長……？"
"212210-28-ヒナ" = "笑えない冗談。"
"212210-29-ヒナ" = "私は救いようがない。"
"212210-30-ヒナ" = "弱くて、悪くて、愚かで……どうしようもない。"
"212210-31" = "[s] \"それでも、ヒナは線を守ってきたよね。\""
"212210-32" = "[ns] \"私が保証するよ。\""
"212210-33-ヒナ" = "先生……。"
"212210-34" = "[ns3] \"それに、私だって同じだよ。\"\n[ns4] \"自分の弱さに負けそうになる。たまにね。\""
"212210-35-ヒナ" = "先生も……？"
"212210-36" = "[s5] \"人は、いろんな側面を持つ生き物なんだ。\"\n[s6] \"でも、なりたい自分があるからさ。\"\n[s7] \"そうなれるように努力するんだよ。\""
"212210-37-ヒナ" = "先生も……そんなことで悩むの……？"
"212210-38-ヒナ" = "私がこんなことを考えるのも、当たり前のことなの……？"
"212210-39-ヒナ" = "そうじゃない人でいることより、そうなろうとすること自体が素敵だって……。"
"212210-40" = "[s] \"それに私は、ヒナがそういう人だからこそ、むしろ好きなんだ。\""
"212210-41-ヒナ" = "すっ……！？"
"212210-42-ヒナ" = "な、何を言っているの……！！"
"212210-43-ヒナ" = "自分の未熟さを分かっていて、それでも前に進もうとする人だから……？"
"212210-44-ヒナ" = "…………。"
"212210-45-ヒナ" = "そうね。"
"212210-46-ヒナ" = "私は……とても未熟で、情けない。"
"212210-47-ヒナ" = "でも……。"
"212210-48-ヒナ" = "それでも、進み続ける。"
"212210-49-ヒナ" = "過去にも、自分にも負けないわ。ずっと……進み続けていくつもり。"
"212210-50-ヒナ" = "だから、先生……。"
"212210-51-ヒナ" = "これからも、私のそばにいて。"
"212210-52" = "[s] \"もちろん。\""
"212210-53-ヒナ" = "……うん。"
"212210-54-ヒナ" = "それなら、私は何にも負けない。"
"212210-55" = "（やっと一段落ついたけど……）"
"212210-56" = "（まだ、残ってることがある）"
"212210-57-？？？" = "……。"
"212210-58" = "[ns] \"ショウコ。\""
"212210-59-ショウコ" = "……先生ですか。前とは立場が逆転しましたね。"
"212210-60-ショウコ" = "こちら側というのは、なかなか新鮮な体験です。"
"212210-61-ショウコ" = "……おめでとうございます。#n貴方の勝ちですよ。"
"212210-62" = "[s] \"そういう話をしにきたんじゃないんだ。\""
"212210-63-ショウコ" = "ええ、分かっています。貴方はいつだってそうでしたから。"
"212210-64-ショウコ" = "ですが……これが正解だと、本気で思っているんですか？#nまた昔みたいなゲヘナに戻ることが。"
"212210-65-ショウコ" = "そこかしこで銃を乱射し、爆弾を投げつけて。#n皆が好き勝手に振る舞う混沌としたゲヘナが、本当に正しいと？"
"212210-66" = "[s8] \"それでも、線を守ろうとする人がいるから。\"\n[s9] \"私も、外から見守ってるし。\""
"212210-67-ショウコ" = "……理解できません。"
"212210-68-ショウコ" = "謝罪や反省を期待しているのなら、望みには沿えませんよ。"
"212210-69-ショウコ" = "失敗に終わろうとも、私の信念が間違っていたとは思っていませんから。"
"212210-70" = "[ns] \"実はね、差し入れを持ってきたんだ。\""
"212210-71-ショウコ" = "これは……お菓子……？#nそれも、私の好きな……。"
"212210-72-ショウコ" = "もしかして……馬鹿にされてますか？"
"212210-73" = "[s] \"まさか。そんなつもりはないよ。\""
"212210-74-ショウコ" = "それなら、何のつもりですか？"
"212210-75-ショウコ" = "私はゲヘナの転覆を企てて失敗した、敗北者です。#nどうしてこんなものを……。"
"212210-76" = "[s10] \"生徒がちゃんと食べてるか気にかけるのは――\"\n[s11] \"先生として当然のことだから。\""
"212210-77-ショウコ" = "またその目……。"
"212210-78-ショウコ" = "それが同情じゃないなら……一体何なんですか……？"
"212210-79-ショウコ" = "教えてくださいよ。"
"212210-80" = "[s] \"……待ってるんだよ。\""
"212210-81-ショウコ" = "待つ……？何を？"
"212210-82-ショウコ" = "私がここで朽ちていくのを？それとも、自滅していく様を？"
"212210-83" = "[s12] \"自分を縛っていた呪いを断ち切って。\"\n[s13] \"次に進む勇気を持てる日を、かな。\""
"212210-84-ショウコ" = "次……私に次なんてありません。"
"212210-85-ショウコ" = "失敗したんです。もうおしまいなんですよ。"
"212210-86-ショウコ" = "この冷たい壁の中で、忘れられていくのがふさわしい存在なんです。#n「次」だなんて、贅沢な言葉を使わないでください。"
"212210-87-ショウコ" = "……はい？#n罪を償うのは、再び立ち上がるためだと？"
"212210-88" = "[s14] \"それに、そうやって見守る人が――\"\n[s15] \"一人くらいいてもいいんじゃないかな。\"\n[s16] \"その時まで待ってる。\""
"212210-89-ショウコ" = "……。"
"212210-90-ショウコ" = "はぁ……。"
"212210-91-ショウコ" = "……嵐。"
"212210-92" = "[s] \"え……？\""
"212210-93-ショウコ" = "私を見つけて、教育し、任務を与えた組織の名前です。"
"212210-94" = "[s] \"それって……！！\""
"212210-95-ショウコ" = "いま言えるのはそれだけです。"
"212210-96-ショウコ" = "……もうお帰りください。"
"212210-97" = "[s] \"……また来るね。\""
"212210-98-ショウコ" = "…………。"
"212210-99-ショウコ" = "……。"
"212210-100-ショウコ" = "……甘いです。"
"212210-101-ショウコ" = "甘すぎて……頭がぐちゃぐちゃになりそうなんですけど……。"
"212210-102-ショウコ" = "うっ……ひっく……。"
"212210-103-マコト" = "……。"
"212210-104-ヒナ" = "思った通り。裏にいたのは「嵐」だった。"
"212210-105-ヒナ" = "雷帝の思想を受け継いで、遺産を復元しようとしている連中。"
"212210-106-マコト" = "地下の隅っこで、雷帝の古い設計図でも舐め回してるネズミどもに過ぎんと思っていたが――"
"212210-107-マコト" = "ここまで大胆に動くとはな。"
"212210-108-ヒナ" = "……甘く見すぎていたみたいね。"
"212210-109-ヒナ" = "学園を脅かすだけの力がある――それを証明したテロだった。"
"212210-110-マコト" = "私たちが封じたはずのあの怪物が……。"
"212210-111-マコト" = "もっと狡猾な形で、目を覚ましたようだな。キシシッ。"
"212210-112-ヒナ" = "……。"
"212210-113-ヒナ" = "不幸中の幸いは、校内に残っていた雷帝の遺産を排除できたこと。"
"212210-114-ヒナ" = "これでもう、内部の脅威は消えたはず。#nだから後は、外からの侵入に備えれば――"
"212210-115-マコト" = "いいや。雷帝の遺産がすべて消えたわけではない。"
"212210-116-ヒナ" = "……あ。"
"212210-117-マコト" = "…………。"
"212210-118-マコト" = "捉えようによれば、真なる雷帝の遺産とも言える――"
"212210-119-イブキ" = "イブキがいるのだから。"
"212210-120" = "炎と影編;To be Continued in Chapter 3"
