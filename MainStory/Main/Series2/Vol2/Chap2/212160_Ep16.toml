[translation]
"212160-1" = "第16話;ゲヘナ奪還作戦（１）"
"212160-2" = "[ns] \"！？\""
"212160-3-風紀委員A" = "緊急事態だ！全隊員出動！"
"212160-4-風紀委員A" = "何だって……！！"
"212160-5-風紀委員A" = "繰り返す！全隊員、戦闘態勢で出動しろ！"
"212160-6-風紀委員A" = "！！"
"212160-7" = "[ns] \"何が……起きたんだ……？\""
"212160-8" = "[ns] \"……ん？この振動は！？\""
"212160-9" = "[ns] \"うわっ！？\""
"212160-10" = "[ns] \"けほっ、けほっ！\""
"212160-11-温泉開発部の部員A" = "おやおや、温泉かと思ったら他のものを掘り当ててしまったな。"
"212160-12" = "[s] \"カスミ！\""
"212160-13-温泉開発部の部員A" = "ハーッハッハッハ！なに、予想通りだ。やはりここにいたか！"
"212160-14-温泉開発部の部員" = "部長、トンネル開通っす！"
"212160-15-温泉開発部の部員A" = "上出来だ！諸君、ご苦労だった！"
"212160-16-温泉開発部の部員A" = "しっかしこれ、床下の備えがまるでなっていないじゃないか。#n我々の存在もずいぶん甘く見られていたようだねぇ？"
"212160-17-温泉開発部の部員A" = "あるいは、完全に操り人形になったとでも思っていたのかね。#nなんにせよ、こうして鼻を明かすのは気持ちがいいな！"
"212160-18-温泉開発部の部員A" = "さあ、先生！"
"212160-19-温泉開発部の部員A" = "脱獄だ！！"
"212160-20" = "[s] \"来てくれてありがとう！\""
"212160-21-温泉開発部の部員A" = "ハーッハッハッハ。先生を助けるんだ。断るわけにもいかんだろう？"
"212160-22-温泉開発部の部員A" = "それに――"
"212160-23-温泉開発部の部員A" = "メグをあんなふうにした連中に、一泡吹かせてやりたくてね。"
"212160-24-温泉開発部の部員A" = "ささ、積もる話はあとにしよう。見つかる前にずらかるぞ！"
"212160-25-風紀委員B" = "襲撃……！？"
"212160-26-風紀委員B" = "どこから来たんだ？いったい誰が！？"
"212160-27-風紀委員B" = "ぐあっ！"
"212160-28-風紀委員A" = "うああっ！！"
"212160-29-後輩の風紀委員B" = "ごめん、先輩……！"
"212160-30-後輩の風紀委員A" = "ちょっと休んでてくださいっ！"
"212160-31-後輩の風紀委員B" = "目指すは作戦会議室！ゲヘナ本館まで駆け抜けるぞ！"
"212160-32-後輩の風紀委員A" = "派手に注意を引けばいいんだよね！"
"212160-33-後輩の風紀委員B" = "ちょっと怖いけど……私たちがやらなきゃ！"
"212160-34-後輩の風紀委員A" = "はい。私たちは、線を守る者ですから。"
"212160-35-イオリ" = "線を越えた人は連れ戻す！それが私たちなんだ！私たちの委員長だろうと関係ない！！"
"212160-36" = "（30分前……） "
"212160-37-イロハ" = "これから作戦の概要を説明します。"
"212160-38-イロハ" = "主力として戦闘を担うのは、イオリさんとチナツさん、風紀委員会の皆さんです。#n便宜上、このチームを戦闘班と呼びます。"
"212160-39-イロハ" = "戦闘班の最大の役目は、風紀委員長に放送室の異変を察知させないことです。#n作戦開始と同時に騒ぎを起こして、敵の視線を引きつけてください。"
"212160-40-イロハ" = "戦闘班が目指すのは、作戦会議室があるゲヘナ本館です。"
"212160-41-イロハ" = "あそこには万魔殿の精鋭戦力に加えて、風紀委員長が常駐しています。"
"212160-42-イロハ" = "もしも放送室の異変を察知されたとしても、可能な限り足止めしてください。"
"212160-43-カレン" = "イオリちゃん、チナツちゃん。ちゃんとできる？"
"212160-44-カレン" = "あ、からかってんじゃないよ。#n自分とこの委員長に銃を向けられるのかって聞いてるの。"
"212160-45-チナツ" = "……やるしかない。"
"212160-46-チナツ" = "やらねばなりません。"
"212160-47-チナツ" = "たとえ委員長に私たちの叫びが届かなくても、抵抗し続けます。"
"212160-48-イオリ" = "狙って、撃って、戦う。負けたって、伝えなきゃいけないことがあるんだ。"
"212160-49-イロハ" = "……お願いします。"
"212160-50-イロハ" = "次に技術班。戦闘班が引きつけている間に放送室へ侵入して作業を進めます。"
"212160-51-エリカ" = "技術班は、サツキ先輩、エリカさん、キララさんです。"
"212160-52-エリカ" = "エリカさんとキララさんが、遠隔操作システムをごまかす細工を行い、#nサツキ先輩が妨害周波数を解析した後に学園全体へ送信します。"
"212160-53-イロハ" = "その間も放送室の警備は厳重なままだと思われます。#n予備戦力が抜けたとしても、散発的な戦闘は起こるはずです。"
"212160-54-イロハ" = "その相手をするのがマユミさん、カレンさん、ゲヘナ再興委員会の皆さんです。"
"212160-55-カレン" = "任せて。"
"212160-56-カレン" = "カレンがいるなら安心だし、私たちも全力で戦うよ。"
"212160-57-イロハ" = "それからチアキ。"
"212160-58-チアキ" = "は～い！"
"212160-59-イロハ" = "先生を現場まで案内する役割です。"
"212160-60-イロハ" = "戦闘班が注意を引きつけている間に、温泉開発部が先生を脱出させます。"
"212160-61-イロハ" = "途中で引き継いで、指揮を必要とする場所まで安全にお連れしてください。"
"212160-62-チアキ" = "まっかせてください！"
"212160-63-イロハ" = "決して簡単な任務じゃありません。"
"212160-64-イロハ" = "先生の顔は広く知られています。#n最悪の場合、向こう側の生徒と何度も交戦する可能性があります。"
"212160-65-イロハ" = "それをかいくぐって、絶対に先生を守ってください。"
"212160-66-チアキ" = "ふっふっふ、心配ご無用です！記者の端くれとして、隠密は得意分野ですから！"
"212160-67-イロハ" = "……そしてエリカさん、キララさん、サツキ先輩。"
"212160-68-イロハ" = "三人がこの作戦の要です。"
"212160-69-イロハ" = "妨害周波数を設定し、学園全体へ送信できるかどうかで勝敗が決まります。"
"212160-70-イロハ" = "周波数がズレても失敗、送信ができなくても失敗、#nそもそも仮説が間違っていても失敗です。"
"212160-71-イロハ" = "私たちの勝利条件は、戦闘班が持ちこたえている間に洗脳を解くこと。"
"212160-72-イロハ" = "こうして口にすると絶望的ですね……。"
"212160-73-サツキ" = "イロハちゃん。"
"212160-74-イロハ" = "……はい。"
"212160-75-サツキ" = "心配いらないわ。私は失敗しないもの。"
"212160-76-チナツ" = "いいえ、私だけじゃない。この作戦に関わる誰ひとり、失敗なんてしない。"
"212160-77-チアキ" = "守りたい人のための戦いなのだから。必ず勝つのよ。"
"212160-78-イロハ" = "……先輩、いつからそんなに頼もしくなったんですか？"
"212160-79-サツキ" = "あら、私は昔から頼もしかったでしょう？"
"212160-80-キララ" = "ふふ、大丈夫だよ。きっと何とかしてみせるから。"
"212160-81-キララ" = "うん！キラキラっとやっちゃうよ！"
"212160-82-イロハ" = "……はい。よろしくお願いします。"
"212160-83-サツキ" = "イロハは全体の調整をお願い。あなたが私たちの目よ。"
"212160-84-イロハ" = "オペレーションは任せてください。"
"212160-85-イロハ" = "それでは――"
"212160-86-イロハ" = "ゲヘナ奪還作戦を開始します。"
"212160-87-万魔殿のメンバー" = "いたぞ！反逆者どもだ！"
"212160-88-風紀委員" = "全員攻撃！退くな！"
"212160-89-万魔殿のメンバー" = "うわぁっ！！"
"212160-90-イオリ" = "よっし、順調に集まってきてる……！"
"212160-91-イオリ" = "敵の数は増えていますが、これくらいなら持ちこたえられます。"
"212160-92-イオリ" = "……委員長は？まだ出てこないのか？"
"212160-93-イオリ" = "依然として本館内部にいると確認できています！"
"212160-94-イオリ" = "……了解！作戦通り進めるぞ！"
"212160-95-イオリ" = "行きましょう、イオリ。"
"212160-96-イオリ" = "待ってろ……委員長……っ！"
