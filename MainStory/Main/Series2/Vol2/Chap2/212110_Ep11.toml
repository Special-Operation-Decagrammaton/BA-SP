[translation]
"212110-1" = "第11話;そばにいたい"
"212110-2-イブキ" = "……。"
"212110-3-マコト" = "……それで、進撃路は――"
"212110-4-イブキ" = "マコト先輩……。"
"212110-5-マコト" = "イブキ、どうした。今は忙しいのだが……。"
"212110-6-イブキ" = "……すごく忙しいの？"
"212110-7-マコト" = "うむ。どうにも人手が足りなくてな。処理すべき仕事が山積みなのだ。"
"212110-8-マコト" = "話は後にしてくれ。"
"212110-9-イブキ" = "……わかった。"
"212110-10-イブキ" = "サツキ先輩～"
"212110-11-イブキ" = "チアキ先輩～"
"212110-12-イブキ" = "……。"
"212110-13-イブキ" = "誰もいない……。"
"212110-14-イブキ" = "イロハ先輩は……ほんとに、もう帰ってこないのかな……。"
"212110-15-イブキ" = "イブキは、ずっと一緒にいたいのに……。"
"212110-16-イロハ" = "イブキ。"
"212110-17-イブキ" = "わあ～！イロハ先輩だ～！！"
"212110-18-イブキ" = "帰ってきてくれたの？イブキ、すっごくうれしい！"
"212110-19-イロハ" = "あ……それは違います。"
"212110-20-イブキ" = "え……？"
"212110-21-イブキ" = "でもイロハ先輩、まだ腕章つけてるよね……？"
"212110-22-イロハ" = "これは……。"
"212110-23-イロハ" = "自分でもどうしてまだ持っているのか分かりませんけど……。"
"212110-24-イロハ" = "マコト先輩が元通りになるまでは、万魔殿に戻るつもりはありません。"
"212110-25-イブキ" = "マコト先輩、ずっと変なまま……。"
"212110-26-イロハ" = "……。"
"212110-27-イロハ" = "イブキはどう過ごしていましたか？"
"212110-28-イロハ" = "心配で様子を見に来たんです。"
"212110-29-イブキ" = "イブキはね、すっごく元気に――"
"212110-30" = "……。"
"212110-31-イブキ" = "……。"
"212110-32-イロハ" = "……元気に過ごせているわけではなさそうですね。"
"212110-33-イブキ" = "うん……みんな、すっごく忙しそう。"
"212110-34-イブキ" = "イロハ先輩が出ていっちゃってから、マコト先輩も一生懸命お仕事してる。"
"212110-35-イブキ" = "他の人たちといろいろやってるの。"
"212110-36-イブキ" = "作戦とか、計画とか、そういうのをいーっぱい。"
"212110-37-イブキ" = "だから疲れてるみたいで……イブキともあんまり遊んでくれない。"
"212110-38" = "……。"
"212110-39-イブキ" = "サツキ先輩とチアキ先輩も、最近はあんまり来てないんだ。"
"212110-40-イブキ" = "だから、イブキさみしい。"
"212110-41-イロハ" = "……予想通りでしたか。"
"212110-42-イロハ" = "イブキ、私と一緒に来ますか？"
"212110-43-イブキ" = "え？ほんとに？"
"212110-44-イロハ" = "はい。万魔殿は……もうイブキにとって良い環境じゃない気がするんです。"
"212110-45-イロハ" = "ちゃんと見てくれる人もいないのならなおさら。"
"212110-46-イロハ" = "私と一緒に来れば髪をとかしてあげますし、本も読んであげますよ。"
"212110-47-イブキ" = "わあ～！イブキ、イロハ先輩に髪とかしてもらうのが一番好き！"
"212110-48-イロハ" = "……ふふ。はい。"
"212110-49-イブキ" = "でも……。"
"212110-50-イブキ" = "そしたら、マコト先輩がひとりぼっちになっちゃう。"
"212110-51-イロハ" = "……。"
"212110-52-イブキ" = "ひとりだとさみしいって、イブキ知ってるんだ。"
"212110-53-イブキ" = "マコト先輩……すごくさみしいと思う。"
"212110-54-イロハ" = "……そうですね。"
"212110-55-イブキ" = "だから、イブキはね――"
"212110-56-イブキ" = "マコト先輩と一緒にいる。"
"212110-57-イロハ" = "……大丈夫ですか？"
"212110-58-イブキ" = "うん。イブキ、つよいもん。おりこうにしてられるよ！"
"212110-59-イロハ" = "イブキの気持ちがそうなら……分かりました。"
"212110-60-イブキ" = "イロハ先輩、マコト先輩が元に戻るまで、ちゃんと待っててね。"
"212110-61-イブキ" = "それで、絶対に万魔殿に戻ってくるの。いい？"
"212110-62-イロハ" = "……はい。そうします。"
"212110-63-イブキ" = "約束！"
"212110-64-イロハ" = "約束です。"
"212110-65-マコト" = "……。"
"212110-66-マコト" = "ふぅ……ようやく一息つけそうだ。"
"212110-67-イブキ" = "……マコト先輩、もう忙しいの終わった？"
"212110-68-マコト" = "ああ、イブキ。"
"212110-69-マコト" = "1つ山場を越えただけだ。まだまだ終わりは見えんな。"
"212110-70-マコト" = "イロハのやつはこんなものを黙々と処理していたのか……。"
"212110-71-マコト" = "ふん、いないやつの話をしても仕方あるまい。"
"212110-72-イブキ" = "マコト先輩、イロハ先輩に会いたい？"
"212110-73-マコト" = "はっ！誰がそんなことを言った？"
"212110-74-マコト" = "この程度、私ひとりでも処理できるということだ。"
"212110-75-マコト" = "普段は仕事をしていないからといって、実務も完璧に把握しているのでな。キシシッ。"
"212110-76-イブキ" = "違うよ。イブキは、会いたい？って聞いたの。"
"212110-77-マコト" = "…………。"
"212110-78-イブキ" = "……最近のマコト先輩、すごくさみしそう。"
"212110-79-マコト" = "……そんなことはない。"
"212110-80-マコト" = "この[ruby=はぬま]羽沼[/ruby]マコト様は、来る者拒まず、去る者追わずだ。"
"212110-81-マコト" = "特に今のような大事な時に反旗を翻した者であれば、なおさらな。"
"212110-82-マコト" = "なにより、優れた指導者とは孤独なものだ。お前にはまだ分からぬだろうがな。"
"212110-83-イブキ" = "うん……イブキ、そういう難しいのはよく分かんない……。"
"212110-84-イブキ" = "でもマコト先輩、前に言ってたよね？反抗はかっこいいことだって。"
"212110-85-マコト" = "……私が？"
"212110-86-イブキ" = "うん。"
"212110-87-マコト" = "……反抗。反抗か。"
"212110-88-マコト" = "……。"
"212110-89-マコト" = "……ああ。"
"212110-90" = "[log=???][ff4444]イブキ、どうして命令に従わないのですか？[-][/log]"
"212110-91-？？？" = "マコトさんがかわいそうだから……#nイブキがスイッチを上げたら、マコトさん痛がるから……。"
"212110-92" = "[log=???][ff4444]あれはゴミですよ、イブキ。[-][/log]"
"212110-93" = "[log=???][ff4444]統制に従わず、[-][/log]"
"212110-94" = "[log=???][ff4444]体制に反抗して留年までしたゴミ。[-][/log]"
"212110-95-？？？" = "ち、違うよ……ゴミじゃない……。"
"212110-96-？？？" = "ごほっ、ごほっ……キシシッ、どうした雷帝？#n……思い通りにならんのか？"
"212110-97-マコト" = "くっ……！頭が……。"
"212110-98-イブキ" = "マコト先輩……！！"
"212110-99-イブキ" = "マコト先輩……大丈夫……？#nごめんなさい……イブキが……。"
"212110-100-マコト" = "……。"
"212110-101-マコト" = "ああ、いや……違うんだ。"
"212110-102-マコト" = "大したことではない。少し頭痛がしただけだ。"
"212110-103-イブキ" = "大丈夫……？"
"212110-104-マコト" = "もちろんだ。お前は悪くない。謝る必要なんて何ひとつない。"
"212110-105-マコト" = "……そうだ。お前には何の罪もない。"
"212110-106-マコト" = "お前が望むことを、お前がしたいことをやればいい。"
"212110-107-マコト" = "それでいいのだ。"
"212110-108-イブキ" = "……だったら、イブキはマコト先輩のそばにいたい。"
"212110-109-マコト" = "……。"
"212110-110-マコト" = "……ああ。"
"212110-111-マコト" = "そうしよう。"
"212110-112" = "次回;応援してくれる、先生？"
