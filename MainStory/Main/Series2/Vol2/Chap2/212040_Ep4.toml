[translation]
"212040-1" = "第4話;一つになったゲヘナ"
"212040-2" = "万魔殿・作戦会議室"
"212040-3-マコト" = "これまで、多くの資源が自由の下に浪費されてきた。"
"212040-4-マコト" = "今後、あらゆる物資は[ruby=・]ゲ[/ruby][ruby=・]ヘ[/ruby][ruby=・]ナ[/ruby][ruby=・]の[/ruby][ruby=・]た[/ruby][ruby=・]め[/ruby]だけに活用する。"
"212040-5-マコト" = "自治区内の流通を遮断。すべての食糧と弾薬を軍需倉庫へ集結させよ。"
"212040-6-マコト" = "既存設備では保管スペースが足りないだろう。#n温泉開発部に命じて、倉庫を8棟新設させろ。"
"212040-7-マコト" = "用地には学園東側の公園を使え。#nかつて私の指示で作らせた場所ではあるが、この局面においては考慮に値しない。"
"212040-8-マコト" = "攻撃開始の直前まで、学園全域への出入りを厳しく管理する。#nもしも自治区外部に向かう電波通信があれば、すべて遮断しろ。"
"212040-9-万魔殿のメンバー" = "委細、抜かりなく！"
"212040-10-マコト" = "キヴォトス全土を相手取る戦い……容易でないのは確かだ。"
"212040-11-マコト" = "だが、それだけだ。決して不可能ではない。"
"212040-12-マコト" = "ヒナ、準備の進捗は？"
"212040-13-ヒナ" = "各学園の司令部打撃作戦は立案完了。#n奇襲が成功すれば、すべて30分以内にケリをつけられる。"
"212040-14-アコ" = "弾薬消費のシミュレーションも結果が出ています。#n現在の備蓄量であれば、各学園中枢部に対して合計48時間の焦土砲撃が可能です。"
"212040-15-アコ" = "この計算には民間の備蓄を含んでいません。#n自治区全域から徴発すれば、より長時間の戦闘継続が可能です。#nとはいえ、そもそもそこまで長引かないでしょうけど。"
"212040-16-ヒナ" = "際立った戦力は放置でいいわ。#nどうせ短期決着するなら、個人としての抵抗に意味はないから。"
"212040-17-ヒナ" = "それでも必要なら、私が出れば処理できる。"
"212040-18-マコト" = "キシシッ、流石は[ruby=そらさき]空崎[/ruby]ヒナだ。#nあれほどの面倒くさがりが、いざ目標を得れば残酷なほど有能になるのだから。"
"212040-19-ヒナ" = "これが、正しい目的意識なのでしょうね。"
"212040-20-ヒナ" = "私の頭の中には、キヴォトスの地図をゲヘナで染め上げることしかない。"
"212040-21-マコト" = "上出来だ。"
"212040-22-ショウコ" = "恐れながら、意見具申よろしいでしょうか。"
"212040-23-マコト" = "[ruby=いがらし]五十嵐[/ruby]ショウコ、我らが作戦参謀ではないか。発言を許可する。"
"212040-24-ショウコ" = "ゲヘナの現有戦力だけでは、不測の事態への対応に懸念が残ります。"
"212040-25-ショウコ" = "勝利を確かなものとすべく、軍備の拡張が望ましいかと。#n例えば……一撃で敵の戦意を喪失させられるような戦略兵器の開発。"
"212040-26-マコト" = "ああ、それはすでに考えていた。"
"212040-27-マコト" = "雷帝は天才的工学者にして発明家だった。#nその遺産を、さらに発展した形で製造させるとしよう。"
"212040-28-ヒナ" = "可能なの？雷帝の遺産は全て破棄したはずでしょう？"
"212040-29-マコト" = "[ruby=そらさき]空崎[/ruby]ヒナ。私を誰だと思っている。"
"212040-30-マコト" = "誰よりもあれを知り尽くしているのは、このマコト様だ。#n一つひとつ、徹底的に分析していたからな。"
"212040-31-マコト" = "雷帝に対抗するための努力が、今になって我々の力になる。#nまったく皮肉なものだな、キシシッ。"
"212040-32-ヒナ" = "……それならいいわ。"
"212040-33-ショウコ" = "つまり……偉大なる雷帝の炎が、このゲヘナに再び灯るのですね。#nマコト議長の辣腕によって！"
"212040-34-ヒナ" = "キシシッ、使えるものを状況に応じて使うだけのことだ。"
"212040-35-マコト" = "――それで、万魔殿の役員はどこへ行ったんだ。#n風紀委員会や再興委員会がこれほどゲヘナのために尽くしているというのに。"
"212040-36-ヒナ" = "それぞれの役割で手一杯なのではないかしら。"
"212040-37-マコト" = "どうだかな。理由は知らんが、今回の宣言について反発していた。"
"212040-38-ヒナ" = "……こちらも同じ。意見はまとまらなかった。"
"212040-39-マコト" = "ちっ。なぜ大義を理解できんのだ。"
"212040-40-マコト" = "つらつらと弱腰なことばかり並べ立ておって……。"
"212040-41-アコ" = "状況が変われば立場も変わる。当然のことですが、実に歯がゆいですね。"
"212040-42-ショウコ" = "悟りに至れぬ者に大局は見えません。混乱するのも当然でしょう。"
"212040-43-ショウコ" = "戦いに先立ち、内部の引き締めも考慮すべきです。"
"212040-44-マコト" = "キシシッ。もっともな話だ。皆がまとまってこそ、真に強くなれるのだから。"
"212040-45-万魔殿のメンバー" = "これより、全ての弾薬を徴発する。"
"212040-46-ゲヘナの生徒" = "え、昨日買ったばっかなんだけど？"
"212040-47-万魔殿のメンバー" = "この重大事において、そんなことは関係ない。"
"212040-48-ゲヘナの生徒" = "ちょっ、何でよ。そっちの事情なんて知らないし、これ、私のなんだけど？"
"212040-49-万魔殿のメンバー" = "間もなくゲヘナの総力戦が始まるんだぞ！"
"212040-50-ゲヘナの生徒" = "そんなこと言われても知らないよ～"
"212040-51-風紀委員" = "そこまでだ。これ以上の抵抗は非常戒厳法違反と見なす。"
"212040-52-ゲヘナの生徒" = "風紀委員！ちょうどよかった！#n私の弾薬を取り上げようとしてるんだけど！何とかしてよ！"
"212040-53-風紀委員" = "非常戒厳法第8条。#n「学園の存立が懸かった状況において、使用可能なすべての弾薬はゲヘナ統合司令部へ帰属する」例外はない。"
"212040-54-ゲヘナの生徒" = "なにそれ！？#nそんな条文いつできたの？"
"212040-55-風紀委員" = "無秩序だった過去と今を同列に語るな。#nゲヘナはキヴォトスを相手取る。私人の所有権より優先されるのは当然だ。"
"212040-56-万魔殿のメンバー" = "風紀委員長と我らが議長が合意した事項だ。さあ、大人しく差し出せ。"
"212040-57-万魔殿のメンバー" = "それとも、裏切り者の烙印を押されて、風紀委員監獄に投獄されたいか？"
"212040-58-ゲヘナの生徒" = "裏切り者って……だって、これ……私の弾薬なのに……。"
"212040-59" = "素直に応じた生徒には「貢献ポイント」が付与される予定だ。#nポイントには馴染みがあるだろう？"
"212040-60-風紀委員" = "だが拒否するなら……この場で即決処分することも可能だ。"
"212040-61-ゲヘナの生徒" = "分かったよ、渡せばいいんでしょ。"
"212040-62-ゲヘナの生徒" = "どうなってんの？マジで……。"
"212040-63-風紀委員" = "貢献度の受付完了。次。"
"212040-64-ゲヘナの生徒たち" = "……。"
"212040-65-ゲヘナ2年生A" = "……ねぇ、見た？風紀委員会と万魔殿の先輩たちの目。あれ、ただ事じゃないって。"
"212040-66-ゲヘナ2年生C" = "だよね。弾薬取り上げられる時、余計なこと言ったら撃たれてたかも。"
"212040-67-ゲヘナ2年生C" = "ちょっと怖いけど……でもさ、逆にちょっとすごくない？"
"212040-68-ゲヘナ2年生A" = "何が？"
"212040-69-ゲヘナ2年生C" = "万魔殿と風紀委員が一緒に動いてるなんて、入学してから初めて見たよ。"
"212040-70-ゲヘナ2年生A" = "あー、それはそうだね。ゲヘナ史上初だったりして。"
"212040-71-ゲヘナ2年生B" = "なーんか、キヴォトスに攻撃するってのもさ、上手くいきそうじゃない？"
"212040-72-ゲヘナ2年生B" = "あの二人が本気で手を組んだら、案外いけるかもしれないでしょ……？"
"212040-73-ゲヘナ2年生A" = "さっき演習場の横通った時さ、見たことないくらい戦車集まってたよね。#nうちってあんなに数持ってたっけ……？"
"212040-74-ゲヘナ2年生A" = "……で、結局、何でこんな話になってるの？#n別に私は前のままでいいんだけど。"
"212040-75-ゲヘナ2年生B" = "でもまあ、そんなに怖いことでもないんじゃないかな？"
"212040-76-ゲヘナ2年生B" = "撃ったり爆破したりはいつも通りじゃん？#nそれを他の学園でやるってだけでしょ？"
"212040-77-ゲヘナ2年生C" = "それに、歴史の転換点に立ち会ってる感じはするし……。"
"212040-78-ゲヘナ2年生C" = "う、裏切り者扱いされるよりはマシかもね……。"
"212040-79-ゲヘナ2年生A" = "だよね……。私たちだけ違うこと言ってたら後でどうなるか分かんないし……。"
"212040-80-ゲヘナ2年生B" = "実は私さ、トリニティの建物に迫撃砲ぶち込んでみたかったんだよね。"
"212040-81-ゲヘナ2年生C" = "あ、私も。"
"212040-82-ゲヘナ2年生C" = "私は神木かなぁ。百鬼夜行の。#nこの前行った時から、燃やしたらどうなるのか気になってたんだ。"
"212040-83-ゲヘナ2年生A" = "……案外アリかも？"
"212040-84-ゲヘナ2年生B" = "言われた通りにしてれば何とかなるんじゃない？"
"212040-85-ゲヘナ2年生A" = "先輩たちだって、何か考えがあってやってるんだろうし。"
"212040-86-マユミ" = "……。"
"212040-87-カレン" = "……。"
"212040-88-カレン" = "ねえ、委員長。"
"212040-89-マユミ" = "うん。"
"212040-90-カレン" = "うちら……「一つになったゲヘナ」を作りたかったんだよね？"
"212040-91-カレン" = "万魔殿と風紀委員会が争わず、学園の目標に向かって生徒みんなで進んでいく……#nそういう姿。"
"212040-92-マユミ" = "……うん、そうだった。"
"212040-93-マユミ" = "落第生も、問題児も、みんながゲヘナの旗の下で誇りを感じられる……#nそんな偉大な学園を夢見てた。"
"212040-94-カレン" = "これがそう……なのかな？"
"212040-95-マユミ" = "私は……。"
"212040-96-マユミ" = "分かんなくなってきちゃった……。"
"212040-97-カレン" = "……。"
"212040-98-マユミ" = "だったら、聞きに行くしかないよね。"
"212040-99" = "次回;辞めます"
