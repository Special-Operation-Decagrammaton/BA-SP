[translation]
"212130-1" = "第13話;監禁"
"212130-2" = "[ns] \"牢屋……久しぶりだなぁ……。\""
"212130-3" = "（外とは完全に遮断されており、不安ばかりが募る）"
"212130-4-マコト" = "……先生よ。"
"212130-5" = "[s] \"やあ、マコト。\""
"212130-6-マコト" = "……こんな場所しか用意できなかったこと、どうか理解してほしい。"
"212130-7-マコト" = "私とてこんな形を望んでいたわけではない。"
"212130-8-マコト" = "ただ、先生は我々にとって最大の懸念だ……そういう意見があってな。"
"212130-9-マコト" = "先生の力は、この私ですら予測できぬほどだからな。#n私も同意した以上、この手段を取るしかなかった。"
"212130-10-マコト" = "……。"
"212130-11-マコト" = "なぜ先生が反対の立場をとるのか、分からぬわけではない。"
"212130-12-マコト" = "どんな学園であれ、どんな生徒であれ大切に思うのが先生だ。#nならば、キヴォトスを害する可能性に対して反対せざるを得ないのも当然だろう。"
"212130-13-マコト" = "だが、こう考えてみるのはどうだ？"
"212130-14-マコト" = "今のキヴォトスは多様な学園が各々の個性を武器に、好き勝手に秩序を主張している。"
"212130-15-マコト" = "故に無意味な対立が生まれ、不信による非効率な決定が下され、争いが起こる。"
"212130-16-マコト" = "しかし！！ゲヘナの旗のもと、全ての生徒が同じ目標に向かって歩くのなら！#nそうした問題は二度と起こらなくなる。"
"212130-17-マコト" = "それだけではない。#n散らばっていた思考と資源を束ねられれば、キヴォトスは目覚ましい発展を遂げるだろう。"
"212130-18-マコト" = "先生よ、素晴らしいとは思わないか？#nゲヘナに留まらず、キヴォトスが偉大になれる道だ。"
"212130-19" = "[s] \"私は……。\""
"212130-20" = "[ns1] \"前のゲヘナの方がずっと素敵だと思う。\"\n[ns2] \"マコトが作りたかった、自由なゲヘナの方が。\""
"212130-21-マコト" = "……。"
"212130-22-マコト" = "ぐっ……！！"
"212130-23" = "[s] \"マコト……！？\""
"212130-24-マコト" = "……ふぅ。"
"212130-25-マコト" = "そうか。先生の考えは理解した。"
"212130-26-マコト" = "キシシッ……ならば、今日はこれで帰るとしよう。"
"212130-27-マコト" = "だが、先生は私の長所を知っているだろう？"
"212130-28-マコト" = "――執念深いのだよ。"
"212130-29" = "[ns] \"……またね。\""
"212130-30-マコト" = "……ここで過ごす間、不自由のないようには手配しておこう。"
"212130-31" = "[ns] \"……。\""
"212130-32-ショウコ" = "先生。"
"212130-33" = "[s3] \"やあ、ショウコ。\"\n[s4] \"今日は人気者だなあ。\""
"212130-34-ショウコ" = "ふふ……相変わらずですね。"
"212130-35-ショウコ" = "先ほどのお話、私も聞かせていただきました。"
"212130-36-ショウコ" = "マコト議長は先生を説得するつもりのようですが、できると思っているのでしょうか。"
"212130-37-ショウコ" = "私の知る限り、先生の思考パターンは一貫しています。"
"212130-38-ショウコ" = "1人でも多く、生徒のために。"
"212130-39-ショウコ" = "平和的で、慈悲深く、皆が幸せになる方向へ。"
"212130-40-ショウコ" = "……。"
"212130-41" = "[s] \"……。\""
"212130-42-ショウコ" = "だからこそ、先生が肯定するはずがない。"
"212130-43-ショウコ" = "まったく、マコト議長にもヒナ風紀委員長にも困ったものです。"
"212130-44-ショウコ" = "皆、甘すぎるんですよ。"
"212130-45-ショウコ" = "先生だってそう。"
"212130-46-ショウコ" = "皆が幸せになれる世界など夢物語です。"
"212130-47-ショウコ" = "先生は、生徒がいつか答えを出すと信じているのでしょうけれど……現実は違います。"
"212130-48-ショウコ" = "烏合の衆から生ずるエネルギーなんて、ほとんどが浪費されてしまいます。#n極めて非効率なんですよ。"
"212130-49" = "[s] \"それも答えを見つけていく過程だと思ってるよ。\""
"212130-50" = "[ns] \"みんなが幸せな世界を作るのは、たしかに難しいと思う。\""
"212130-51" = "[ns] \"だからこそ努力し続ける必要があるんだ。\""
"212130-52-ショウコ" = "……それは限られた者の特権ですよ。#n自分探しをできる人たちの陰で、非効率の被害者となる子も間違いなく存在します。"
"212130-53-ショウコ" = "全員に手を差し伸べられるとでもお思いですか？#nどれだけ無茶をしようと、時間も心も限りがあるというのに。"
"212130-54-ショウコ" = "先生の優しさも次第にすり減って、取り残された子は無秩序の奈落へ落ちていく。"
"212130-55-ショウコ" = "いくら先生でも「みんなが幸せ」など不可能なのですよ。"
"212130-56" = "[s] \"…………。\""
"212130-57-ショウコ" = "この点においては抑圧による統制の方が、より大きなメリットをもたらします。"
"212130-58-ショウコ" = "ゲヘナがキヴォトスに秩序を打ち立てるその時から、真の平和が始まるんです。"
"212130-59-ショウコ" = "先生もいずれ分かりますよ。#n強大な力で統治された社会の方が、中途半端な自由よりずっとマシだということを。"
"212130-60" = "[ns] \"前に、理想像の話をしてくれたよね。\""
"212130-61" = "[ns5] \"一切迷わずに正しい決断を下せて。\"\n[ns6] \"何も疑わず前へ進める人。\""
"212130-62-ショウコ" = "……そうでしたね。"
"212130-63-ショウコ" = "それが何か？"
"212130-64" = "[ns7] \"もしかしてだけどさ。\"\n[ns8] \"自分を信じきれてないんじゃない？\""
"212130-65-ショウコ" = "なっ……！"
"212130-66" = "[s] \"間違った選択を怖がってるように見えるよ。\""
"212130-67-ショウコ" = "……。"
"212130-68-ショウコ" = "なぜです？この状況でどうしてそんなことを言うんですか？"
"212130-69-ショウコ" = "先生は牢の中に閉じ込められているんですよ？"
"212130-70-ショウコ" = "隔てた反対側にいる、私によって。"
"212130-71-ショウコ" = "マコト議長と風紀委員長に進言したのは私なんです。"
"212130-72" = "[s] \"分かってるよ。\""
"212130-73-ショウコ" = "ならば憎んで……恨むべきでしょう？"
"212130-74-ショウコ" = "……なのに、どうして私を……そんな目で見るんですか？"
"212130-75" = "[s9] \"憎むのは簡単なことだよ。\"\n[s10] \"でも、それは先生の仕事じゃない。\""
"212130-76-ショウコ" = "馬鹿らしい！恨んで呪うのが人間の本性なんです！！#nそれがこの混沌として醜い世界の真実なんですよ！！"
"212130-77-ショウコ" = "同情されるべきは私じゃなくて！無力に閉じ込められている先生の方でしょう！？"
"212130-78" = "[s11] \"そうやって私に憎まれたがってるのはさ。\"\n[s12] \"ショウコが自分自身を許せてないからじゃないかな。\""
"212130-79-ショウコ" = "……！！"
"212130-80-ショウコ" = "……最低です。先生は……最低最悪の先生です。"
"212130-81-ショウコ" = "二度と、そんな目で私を見ないでください。"
"212130-82" = "[ns] \"……。\""
"212130-83" = "次回;反逆者たち"
