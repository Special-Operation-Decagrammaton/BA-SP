[translation]
"212020-1" = "第2話;チナツ"
"212020-2-チナツ" = "ほとんどの3年生が影響を受けている……委員長やアコ行政官のように……。"
"212020-3-チナツ" = "それなら、もしかすると……。"
"212020-4-チナツ" = "……確かめなければ。"
"212020-5-チナツ" = "セナ先輩、おはようございます。"
"212020-6-セナ" = "チナツ。"
"212020-7-セナ" = "久しぶりですね。"
"212020-8-チナツ" = "ご無沙汰になってしまい、すみません。"
"212020-9-セナ" = "忙しさは分かっています。こちらも似たようなものですよ。"
"212020-10-チナツ" = "そう、ですか……。"
"212020-11-セナ" = "……救急医学部も、戦いの準備をしているんですね。"
"212020-12-セナ" = "もちろんです。"
"212020-13-セナ" = "これこそ、私たち全員の宿願ですから。"
"212020-14-チナツ" = "宿願……？"
"212020-15-セナ" = "……チナツも、そうでしょう？"
"212020-16-セナ" = "風紀委員会の力をゲヘナの外に示す時が来たのです。"
"212020-17-チナツ" = "私は……。"
"212020-18-セナ" = "チナツ。私は覚えています。"
"212020-19-チナツ" = "何を……ですか？"
"212020-20-セナ" = "チナツが風紀委員会へ行くと言った時のことです。"
"212020-21-チナツ" = "そ、それは……。"
"212020-22-セナ" = "理由は、「放っておけなくて」でしたよね。"
"212020-23-チナツ" = "そんなことまで……。"
"212020-24-セナ" = "もちろんです。チナツのことですから。"
"212020-25-チナツ" = "……はい？"
"212020-26-セナ" = "期待していましたから。#nいずれ、部長を任せられるかもしれない、と。"
"212020-27-チナツ" = "今まではそんな話、一度も……。"
"212020-28-セナ" = "それはそうでしょう。いま初めて言いましたから。"
"212020-29-チナツ" = "先輩がそこまで評価してくださっていただなんて……。"
"212020-30-セナ" = "だからこそ……部を移ると聞かされた時は衝撃を受けました。#n表に出さないよう取り繕ってはいましたが。"
"212020-31-チナツ" = "……。"
"212020-32-セナ" = "[ruby=ここ]救急医学部[/ruby]では望みを叶えてあげられなかったのだろうか？"
"212020-33" = "私たちに問題があったのだろうか？#nだとしたら、どうすれば解決できたのだろうか。"
"212020-34-セナ" = "当時は、そんなことをずいぶんと考えました。"
"212020-35" = "そ、そんな……。"
"212020-36-チナツ" = "不満があったから部を移ろうとしたのではなくて……。"
"212020-37-チナツ" = "負傷者が出るたび、もっと早く対処できる方法を考えているうちに……。"
"212020-38-セナ" = "ふふ。#n……ええ、分かっています。"
"212020-39-チナツ" = "セナ先輩……。"
"212020-40-セナ" = "[ruby=・]私[/ruby][ruby=・]た[/ruby][ruby=・]ち[/ruby]では、チナツに最良な場所にはなれなかった。"
"212020-41-セナ" = "いろいろ理由はあるでしょう。ですが、あえて言葉にするような話でもありません。"
"212020-42-セナ" = "私たちは選択をし、それぞれの場所を得て。#nそして今、ここにいるのですから。"
"212020-43-セナ" = "私はチナツを誇りに思います。"
"212020-44-チナツ" = "……ありがとうございます。"
"212020-45-チナツ" = "ここで私が「申し訳ない」と言うのは……先輩に対する侮辱なのでしょうね。"
"212020-46-チナツ" = "先輩はいつだって最善を尽くして、自分にできることを懸命にやってきました。"
"212020-47-チナツ" = "私だって先輩を尊敬してきましたし、今も変わりません。"
"212020-48-セナ" = "私は良い後輩を持ちましたね。"
"212020-49-セナ" = "だから――"
"212020-50-セナ" = "これからも、どうぞよろしくお願いします。"
"212020-51-セナ" = "名実ともにゲヘナ最強の武力集団。風紀委員会の役割は大きいのですから。"
"212020-52-セナ" = "なにせ戦闘の継続は、チナツの働きにかかっています。"
"212020-53-セナ" = "風紀委員長も、チナツに期待しているでしょう。"
"212020-54-チナツ" = "先輩……。"
"212020-55-セナ" = "……不安ですか？"
"212020-56-チナツ" = "いえ……そうではなくて……。"
"212020-57-セナ" = "応急処置、簡易手術、患者の搬送、緊急時の対応と補給。#nどれも救急医学部で教えたことです。"
"212020-58-セナ" = "今はそこに、チナツ自身の経験も加わっている。"
"212020-59-セナ" = "ですから、私は心配していません。"
"212020-60-セナ" = "チナツを信じています。"
"212020-61-チナツ" = "…………。"
"212020-62-チナツ" = "セナ先輩。"
"212020-63-セナ" = "はい。"
"212020-64-チナツ" = "もしもゲヘナがキヴォトスを破壊するとして……。"
"212020-65-チナツ" = "それは……先輩が望むことなんですか？"
"212020-66-チナツ" = "先輩は、そんなゲヘナを誇れるんですか……？"
"212020-67-セナ" = "……偉大さには、犠牲が伴うものです。"
"212020-68-チナツ" = "きっと多くの負傷者が出ます。"
"212020-69-チナツ" = "ゲヘナだけじゃない。多くの市民まで傷つき、苦しむはずです。"
"212020-70-チナツ" = "先輩は……本当にそんなことを望んでいるんですか？"
"212020-71-セナ" = "そうですね……。"
"212020-72-チナツ" = "……。"
"212020-73-セナ" = "私個人としては、そういった事は好みません。"
"212020-74-セナ" = "ですが、個人の好き嫌いを越えて、[ruby=・]必[/ruby][ruby=・]要[/ruby][ruby=・]な[/ruby][ruby=・]こ[/ruby][ruby=・]と[/ruby]だと理解しています。"
"212020-75-チナツ" = "攻撃を行うことが、ですか？"
"212020-76-セナ" = "ええ。キヴォトスに対する医療行為ですから。"
"212020-77-チナツ" = "言っている意味が分かりません。"
"212020-78-セナ" = "キヴォトスは、乱立した学園秩序の上に成り立っています。#nこれを救急患者と呼ばずして何と呼びましょう。"
"212020-79-セナ" = "ゲヘナによる統一。#nそして強力な秩序の確立こそが、キヴォトスを治療する唯一の方法なのです。"
"212020-80-セナ" = "先ほど、負傷者の話をしましたね。それは手術中に起こる出血と同じです。"
"212020-81-セナ" = "出血が怖いからと手術を諦めれば、患者は取り返しのつかないことになる。#nチナツなら分かっていますよね？"
"212020-82-セナ" = "……よほど悩んでいるようですね。"
"212020-83-チナツ" = "先輩……。"
"212020-84-セナ" = "……。"
"212020-85-セナ" = "薬品整理が途中でした。"
"212020-86-セナ" = "今日のところはこれくらいで。……また次の機会に。"
"212020-87-チナツ" = "……はい。また伺います。"
"212020-88-セナ" = "チナツ。"
"212020-89-チナツ" = "はい？"
"212020-90-セナ" = "どうか、正しい道へ進めるよう願っています。"
"212020-91-チナツ" = "……ありがとうございます。"
"212020-92-チナツ" = "セナ先輩……。"
"212020-93-チナツ" = "私を信じてくださる、澄んだ瞳。あの目は変わっていないのに。"
"212020-94-チナツ" = "なのに……。"
"212020-95-チナツ" = "必ず……元に戻してみせます。"
"212020-96" = "次回;ゲヘナ再興委員会の反応"
