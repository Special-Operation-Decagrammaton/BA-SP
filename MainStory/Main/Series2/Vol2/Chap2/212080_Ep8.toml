[translation]
"212080-1" = "第8話;チアキ"
"212080-2-マコト" = "……。"
"212080-3-マコト" = "ふぅ……。"
"212080-4-マコト" = "イロハがいなくなったせいで私自ら実務をやる羽目になるとは。"
"212080-5-マコト" = "それでまたサツキはどこをほっつき歩いているのだ……！#n居ないことがあまりにも多すぎる！"
"212080-6-チアキ" = "わあーっ！マコト先輩が実務してる！"
"212080-7-チアキ" = "これは特ダネ――"
"212080-8-チアキ" = "……。"
"212080-9-チアキ" = "でも、撮ったところで記事に使えるのかな？"
"212080-10-チアキ" = "週刊万魔殿は休刊になっちゃったし……。"
"212080-11-チアキ" = "うーん、分かんない！とりあえず撮っとけば、いつか使えるでしょ！"
"212080-12-チアキ" = "……なんか、寂しそう？"
"212080-13-チアキ" = "イロハちゃんは出ていっちゃうし、サツキ先輩もあんまりいないし。"
"212080-14-チアキ" = "イブキちゃんも元気ないし……。"
"212080-15-チアキ" = "はあ……あんなに騒がしかった万魔殿が、どうしてこんなことに。"
"212080-16-チアキ" = "ん？あれは……。"
"212080-17-ショウコ" = "――はい。"
"212080-18-ショウコ" = "～で、……ます。"
"212080-19-ショウコ" = "――ください。"
"212080-20-チアキ" = "ゲヘナ再興委員会の書記……いえ、今や作戦参謀、ですか。"
"212080-21-チアキ" = "この状況でもまるで動じてませんね。"
"212080-22-チアキ" = "むしろ一番張り切ってるような……。"
"212080-23-チアキ" = "あ、こんにちは～あはは。"
"212080-24-ショウコ" = "……チアキさん。"
"212080-25-チアキ" = "何か、大事なお電話だったんですか？"
"212080-26-ショウコ" = "……そうですね。"
"212080-27-チアキ" = "ちょ～っと、途中で声かけにくい雰囲気でしたよ？"
"212080-28-ショウコ" = "何かご用でしょうか？"
"212080-29-チアキ" = "いえいえ、別にそういうわけじゃないんですけど……。"
"212080-30-チアキ" = "せっかくですから、1つ、聞いてもいいですか？#n軽く雑談！みたいな？"
"212080-31-ショウコ" = "……どうぞ。"
"212080-32-チアキ" = "あ。そういえば私たち「書記ーズ」ですよね！#n万魔殿と、ゲヘナ再興委員会の書記で！"
"212080-33-ショウコ" = "……。"
"212080-34-チアキ" = "こほん……では質問です！"
"212080-35-チアキ" = "ショウコさんは、今のゲヘナをどう思いますか？"
"212080-36-ショウコ" = "……なぜ、そんなことを？"
"212080-37-チアキ" = "な～んか重要そうな気がするんですよね。記者の勘ってやつですかね！"
"212080-38-チアキ" = "ほら、ショウコさんって何と言うか、計画的な人……頭の切れる人？って感じなので！"
"212080-39-ショウコ" = "……。"
"212080-40-ショウコ" = "今のゲヘナをどう思うか、でしたね。"
"212080-41-ショウコ" = "偉大になったと思います。再び。"
"212080-42" = "皆の考えが1つに束ねられ、同じ目的に向けて歩いている。#n銃口を向ける相手を確かに認識している今こそ、真に偉大なゲヘナです。"
"212080-43" = "おお……。"
"212080-44-ショウコ" = "かつて到達しえなかった夢を現実にするため、皆が全力を尽くしていますから。"
"212080-45-チアキ" = "……ん？そんな夢ありましたっけ？"
"212080-46-ショウコ" = "ええ。キヴォトスをゲヘナに染め上げるという夢があったと聞いています。"
"212080-47-チアキ" = "へぇ……初耳ですね。"
"212080-48-ショウコ" = "ご存じでなくとも結構です。"
"212080-49-チアキ" = "うーん……でも、私の意見はちょっと違うと言いますか……。#n正直、この空気はあんまり好きじゃないんですよね。静かすぎて。"
"212080-50-チアキ" = "そこら中でドッカンドッカンして、あっちこっちで事件が起きてる！#nそれでこそゲヘナって感じしません？"
"212080-51-ショウコ" = "「不完全な自由」が支配していた頃の話ですね。"
"212080-52-チアキ" = "それはちょっと分かんないですけど……前の方が記事のネタに困らなかったので。"
"212080-53-ショウコ" = "チアキさんは、今のゲヘナに反対なのですか？"
"212080-54-チアキ" = "それは……えっと……。"
"212080-55-ショウコ" = "……。"
"212080-56-チアキ" = "重い空気が全部を押さえつけてる感じがします。"
"212080-57-チアキ" = "みんな周りの顔色をうかがって、言われるままに統制に従って……#nこういうの、あんまり面白くなくないですか？"
"212080-58-ショウコ" = "面白さ、ですか……。"
"212080-59-ショウコ" = "ご存じですか？#nその「面白さ」のせいで、ゲヘナは2年もの間、機会損失を生み続けてきたんです。"
"212080-60-チアキ" = "えっ？そうなんですか？"
"212080-61-ショウコ" = "「面白さ」などという空虚な価値を追い求めた者は、何を成し遂げましたか？"
"212080-62-ショウコ" = "あるいは温泉を掘り、あるいは食堂を壊し、あるいは弾薬や爆弾を浪費している間。#nゲヘナという巨大なエンジンは空転していただけです。"
"212080-63" = "ですがようやく全ての歯車が嚙み合いました。#n動力は余すことなくゲヘナの端々まで伝わり、その一歩を踏み出すのです。"
"212080-64" = "だからって、キヴォトスに攻撃するってのはどうなんでしょう……？"
"212080-65-ショウコ" = "必要不可欠な事です。マコト議長も仰っていたでしょう。"
"212080-66-ショウコ" = "全ての学園がゲヘナの旗を掲げる時、ゲヘナ主導の真なる秩序が始まるのだと。"
"212080-67-チアキ" = "う～～ん……。"
"212080-68-チアキ" = "それ、やらなきゃダメなんです？"
"212080-69-チアキ" = "みんな違うから良いんだと思うんです。#nトリニティやミレニアムがゲヘナになっても面白くないと思いますよ。"
"212080-70-ショウコ" = "個性や多様性とは、力の分散に帰結します。"
"212080-71-ショウコ" = "異なる声は摩擦を生み、衝突の解消にはコストがかかります。#n何かを生むためにではなく、マイナスをゼロに戻すためにエネルギーが使われる。"
"212080-72-チアキ" = "いやいや、摩擦があるから特ダネが生まれるんですよ！"
"212080-73-チアキ" = "ショウコさん、本当に全部の学園をゲヘナにしたいんですか？"
"212080-74-ショウコ" = "もちろん。それがゲヘナの存在証明であり、私たちの到達すべき最終目標ですから。"
"212080-75-チアキ" = "私の考えとは異なりますけど……じゃあ、最後にもう1つだけ質問。"
"212080-76-チアキ" = "ゲヘナ一色にして、ショウコさんは何がしたいんですか？"
"212080-77-ショウコ" = "……はい？"
"212080-78-チアキ" = "そこまで目的意識が強いなら、その先にやりたいことがあるんじゃないですか？"
"212080-79-ショウコ" = "私は……。"
"212080-80-ショウコ" = "完璧なゲヘナで、新たな秩序を盤石なものにして……。"
"212080-81-チアキ" = "……まさか、考えてないんですか？"
"212080-82-ショウコ" = "……インタビューはここまでにしましょう。#n当然のことをわざわざ説明しているほど暇ではないので。"
"212080-83-チアキ" = "それは残念。ご協力ありがとうございました～"
"212080-84-チアキ" = "……考えてなかったのかな。"
"212080-85-チアキ" = "ってことは……手段と目的が逆転してる？#nそれとも、攻撃すること自体が目的……？"
"212080-86-チアキ" = "なんか怪しいんですよね……記者としての勘がビリビリしっぱなしです。"
"212080-87-チアキ" = "うーーーん……。"
"212080-88-チアキ" = "まあ何にせよ、私の好みじゃなさそうだなぁ。"
"212080-89-チアキ" = "先輩たちは……本当に……？"
"212080-90-チアキ" = "前みたいな万魔殿じゃダメだったのかな……。"
"212080-91" = "次回;サツキ"
