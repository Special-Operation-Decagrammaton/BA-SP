[translation]
"212010-1" = "第1話;一歩遅れた対処"
"212010-2-イオリ" = "……何だって？"
"212010-3" = "[s] \"真の……NKウルトラ計画？\""
"212010-4-イロハ" = "つまり……サツキ先輩が研究していたものとは別物なんですか？"
"212010-5" = "ええ、まったく違うわ。"
"212010-6-サツキ" = "雷帝が夢見ていたのは、人の根幹に触れる精神操作。"
"212010-7-サツキ" = "それは、深層意識を意のままに操れる。#n催眠なんて生ぬるいものじゃない、邪悪で非倫理的な実験なの。"
"212010-8" = "急に言われても理解しにくいでしょうけれど……全て事実よ。"
"212010-9" = "[s] \"詳しく聞かせてくれる？\""
"212010-10-サツキ" = "本当は口にするつもりなんてなかったのだけど……。"
"212010-11-サツキ" = "こうなってしまった以上、仕方ないわね。#n私の知る限りを教えてあげる。"
"212010-12-イロハ" = "先輩たちが話したがらない、過去の話……ですね。"
"212010-13-サツキ" = "ええ、2年前の出来事よ。"
"212010-14-サツキ" = "恐怖でゲヘナを支配していた雷帝は、非人道的な実験を平然と行っていた。"
"212010-15-サツキ" = "その中の1つに、生徒の自由意志を奪って学園全体を一つに統合する「プログラム」もあったわ。"
"212010-16-サツキ" = "幸い、その計画が本格的に始動する前に、マコトちゃんや私を含む反雷帝勢力によって彼女は失脚した。だから、そこまで進むことはなかったの。"
"212010-17-サツキ" = "私たちは、雷帝の目指す先が間違っていると考えていた。#nだから関連資料はすべて廃棄したの。"
"212010-18-サツキ" = "マコトちゃんの方針は、雷帝に関わるものは無条件で破棄。"
"212010-19-サツキ" = "それほど彼女の研究は危険だったの。"
"212010-20-チナツ" = "ですが、今の状況は……！#n資料は全部捨てたはずなのでは……？"
"212010-21-サツキ" = "だからこそ、事態は深刻よ。"
"212010-22-サツキ" = "この研究は完成していなかったし、トリガーに関する情報は何も残されていなかった。"
"212010-23-サツキ" = "だから、どういう仕組みで作動するのかも判明していなかった。"
"212010-24-サツキ" = "それがどうして今になって、こんなことが起こってしまったのか。"
"212010-25-イロハ" = "そんなものがあったなんて……にわかには信じられませんね……。"
"212010-26-サツキ" = "百聞は一見に如かず、と言うでしょう？"
"212010-27-サツキ" = "あのマコトちゃんが風紀委員長と手を取り合って、キヴォトス征服を叫んでいた。#nあなたも見たわよね？"
"212010-28-イロハ" = "……。"
"212010-29" = "[s] \"……。\""
"212010-30-サツキ" = "どうして3年生だけがおかしくなったのか――"
"212010-31-サツキ" = "それは……雷帝の実験は、当時のゲヘナ生を対象にしていたからよ。"
"212010-32-チナツ" = "だから、今の2年生と1年生は無事なんですね……。"
"212010-33-チナツ" = "ということは……今の3年生以外にも……！？"
"212010-34-サツキ" = "ああ、「卒業」した先輩のこと？"
"212010-35-サツキ" = "あくまで私の考えだけれど、そこまでの影響は無いはずよ。"
"212010-36-サツキ" = "さっきの放送が届く範囲なんて、せいぜいゲヘナ学園の敷地内だもの。"
"212010-37-チナツ" = "それなら、まだ救いはありますが……。"
"212010-38-イロハ" = "サツキ先輩。あれを元に戻すことはできるんですか？"
"212010-39-サツキ" = "分からないわ。"
"212010-40-サツキ" = "あれは雷帝の遺産だもの。#n私の催眠にかかったマコトちゃんみたいに、一眠りしたら解ける――#nなんて簡単な話ではないでしょうね。"
"212010-41-イロハ" = "はあ……どうしましょう。"
"212010-42-サツキ" = "万魔殿の情報部長として、できることは全部やってみるわ。"
"212010-43-サツキ" = "あんなマコトちゃんは見ていたくないもの。"
"212010-44-サツキ" = "私が望むのは世界平和。#n誰も傷つかない世界を作りたいの。このままじゃ正反対になっちゃうじゃない。"
"212010-45-イロハ" = "あんな馬鹿げたことに風紀委員長が乗っかるだなんて……。"
"212010-46-イオリ" = "行政官のおまけ付きでな……。"
"212010-47-サツキ" = "風紀委員会が加わったことも問題だけど……本当に厄介なのは別のことよ。"
"212010-48-イオリ" = "別？"
"212010-49-サツキ" = "マコトちゃんが「本気」に見えること。"
"212010-50-イオリ" = "うーん……こんな言い方するのも何だけど……。"
"212010-51-イオリ" = "万魔殿の議長ってそんなにヤバいの？#n本気だとしても、大した脅威には見えないけど……。"
"212010-52-サツキ" = "それはマコトちゃんのことをよく知らないから言えるのよ。"
"212010-53-サツキ" = "マコトちゃんは、倒すべき敵がいる時に強くなるの。"
"212010-54-サツキ" = "立ちはだかる相手が強ければ強いほど、なおさら。"
"212010-55-サツキ" = "雷帝と対峙していた頃なんて、いきいきしてたわよ。"
"212010-56-サツキ" = "あれ以来……本気を出していないんじゃないかしら。"
"212010-57-イオリ" = "いつだって面倒ごとばっかり起こしてるのに？"
"212010-58-サツキ" = "[ruby=・]面[/ruby][ruby=・]倒[/ruby]で済んでいるのが幸運ってわけ。"
"212010-59-イオリ" = "むっ……。"
"212010-60-サツキ" = "とにかく、敵に回ったら厄介な相手よ。#nあの執念深さと闘争心はキヴォトスの誰にも負けないもの。"
"212010-61-サツキ" = "そんなマコトちゃんが本気の闘争を決めたとなれば……。"
"212010-62-サツキ" = "絶対、簡単には終わらない。"
"212010-63-チナツ" = "それは……そうですね。普段は抜けたところばかり見せるくせに……。"
"212010-64-チナツ" = "……。"
"212010-65-イオリ" = "あれ？じゃあなんでサツキ議員は平気なんだ？#n3年生はみんなおかしくなったんだろ？"
"212010-66" = "あくまで推測だけれど、私の研究に関係しているんじゃないかしら？"
"212010-67-チナツ" = "それって……まさか催眠術か？"
"212010-68" = "そうよ。私は私でNKウルトラ計画について研究していたから。"
"212010-69-サツキ" = "雷帝の研究から着想を得たけれど、倫理的に問題なく、強制力も弱い――いわば[ruby=きょうごく]「京極サ[/ruby]ツキ流NKウルトラ」ね。"
"212010-70-サツキ" = "ちなみに、名前をそのまま使おうって言いだしたのはマコトちゃんなの。#n名前を被せることで、存在ごと上書きしちゃおうって発想。"
"212010-71-サツキ" = "まぁとにかく。#nその影響で、私には効かなかったんじゃないかしら。"
"212010-72-イオリ" = "……本当に正気なんだよな？#n実は洗脳されてたり……。"
"212010-73-サツキ" = "本当よ。"
"212010-74-チナツ" = "……何にせよ、無事でよかったです。"
"212010-75-チナツ" = "それで……これからどうすればいいのでしょうか？"
"212010-76" = "[ns1] \"みんなを元に戻す方法を探そう。\"\n[ns2] \"洗脳を解除できる方法を探そう。\""
"212010-77-サツキ" = "[ruby=・]シ[/ruby][ruby=・]ャ[/ruby][ruby=・]ー[/ruby][ruby=・]レ[/ruby]として力を貸してくれるの？"
"212010-78-サツキ" = "それは止めておいた方がいいかもしれないわね。"
"212010-79-イオリ" = "どうして？"
"212010-80-サツキ" = "シャーレは連邦生徒会長直属。#nとなれば、ゲヘナの問題に連邦生徒会が介入する形になるわ。"
"212010-81-サツキ" = "ゲヘナ自治区の主権に関わる話になりかねない。"
"212010-82" = "[s] \"サツキの言う通りだよ。\""
"212010-83-イオリ" = "そ、そうかも……。"
"212010-84-サツキ" = "ゲヘナの問題は、ゲヘナで解決する。"
"212010-85-サツキ" = "この原則はできる限り守りたい。"
"212010-86-サツキ" = "もちろん、助けを求めるのは悪いことではないわ。"
"212010-87-サツキ" = "でも、まずは自分たちで頑張るべきじゃないかしら。"
"212010-88-イロハ" = "……私も賛成です。"
"212010-89-チナツ" = "ゲヘナの首脳部がキヴォトスへの攻撃を宣言した。#nこの事実が外に漏れるだけで大混乱になります。"
"212010-90-イロハ" = "何としてでも、内々で片づけないといけませんね。"
"212010-91" = "[s] \"うん、何としてでもやろう。\""
"212010-92-イオリ" = "じゃあシャーレに頼るのは最後の手段として残しておいて、#n手遅れになる前にできる限り自分たちで何とかする。"
"212010-93-イオリ" = "それが目標ってことだよね？"
"212010-94-イロハ" = "はい、その通りです。"
"212010-95" = "（その後も議論を重ねたが……）"
"212010-96" = "（決定的な方法は、とうとう浮かばなかった）"
"212010-97-サツキ" = "どこから手をつけるべきかしら……。"
"212010-98-イオリ" = "サツキ議員、覚えてるか？#nあの時の放送、変な音声が流れてただろ？"
"212010-99-イオリ" = "その……何だっけ。"
"212010-100-イオリ" = "そうだ！トリガー！あれがトリガーじゃないのか？"
"212010-101-サツキ" = "可能性は高いわ。"
"212010-102-サツキ" = "文脈が一定じゃない特定の言葉の組み合わせがトリガーになって、眠ってた深層意識が目を覚ます……。"
"212010-103-イオリ" = "そこに手がかりがありそうじゃないか？"
"212010-104-イオリ" = "単語を逆再生で聞かせると解除できるとか。"
"212010-105-サツキ" = "それなりに研究してきた私からすると、テープを巻き戻すみたいにして解ける洗脳は存在しないと思うわ。"
"212010-106-イオリ" = "そう簡単にはいかないか……。"
"212010-107-サツキ" = "でも、アイデアは悪くないわ。#n時には単純な解決策こそが、難題をほどく鍵になることもあるもの。"
"212010-108-チナツ" = "うっ……。"
"212010-109-イオリ" = "頭に響く……！"
"212010-110-イロハ" = "そういえば、あの音、放送のときも鳴ってましたよね。"
"212010-111-サツキ" = "……。"
"212010-112-サツキ" = "周波数……？"
"212010-113" = "[s] \"何か思い当たる？\""
"212010-114-サツキ" = "トリガーとなるキーワードは、ただの信号にすぎないとしたら？#n洗脳で重要なのは特定の周波数？それが深層意識を目覚めさせて……。"
"212010-115-イロハ" = "先輩……？"
"212010-116-イオリ" = "なんか考え込んでるけど……。"
"212010-117-チナツ" = "邪魔しないほうがよさそうですね。"
"212010-118-サツキ" = "もしかしたら……手がかりを見つけたかもしれないわ。"
"212010-119-イオリ" = "本当か！？"
"212010-120-サツキ" = "確証はないけれど、試してみる価値は十分あるはずよ。"
"212010-121-サツキ" = "いくつも方法が浮かんできているから、私は戻って研究してみるわ。"
"212010-122-イオリ" = "頼りになる……！普段は変な人だと思ってたけど！"
"212010-123-イロハ" = "イオリ……！"
"212010-124-イロハ" = "まあ……事実ですから……。"
"212010-125-イロハ" = "でも、やるときはやる人なんですよ。"
"212010-126-サツキ" = "万魔殿の情報部長として、無様な姿は見せられないでしょう？"
"212010-127" = "[s3] \"サツキ、頼んだよ。\"\n[s4] \"助けが必要ならいつでも呼んでね。\""
"212010-128-サツキ" = "心強いわ。"
"212010-129-サツキ" = "あ、それから。#nこれは予想だけれど、洗脳されている人たちは――"
"212010-130-サツキ" = "逆らう者には容赦しないはずよ。"
"212010-131-チナツ" = "……！"
"212010-132-サツキ" = "それが雷帝のやり方だったから。"
"212010-133-サツキ" = "だから……気をつけてね。成果が出たら知らせるわ。"
"212010-134-チナツ" = "……私たちも戻りましょうか。不在が長いのも怪しまれるでしょうし。"
"212010-135-イロハ" = "そうですね。それにどのみち、事を起こすにも私たちだけでは限界がありそうですし。"
"212010-136" = "[s] \"他の生徒にも協力を頼んでみるよ。\""
"212010-137-イロハ" = "とはいえ、サツキ先輩の懸念が正しければ、一番危ないのは先生なのでは？"
"212010-138-イロハ" = "ただでさえ目立つのに、派手に動いたら……。"
"212010-139" = "[s5] \"慎重に動くようにするよ。\"\n[s6] \"心配してくれてありがとね。\""
"212010-140-イロハ" = "……先生のことですから。賢く立ち回るとは思いますけど。"
"212010-141-チナツ" = "先生……一緒にいてくださってありがとうございます。"
"212010-142-チナツ" = "心強いです。#n……本当に。"
"212010-143-イオリ" = "うん。ほんとにな……。"
"212010-144" = "[s] \"じゃあ、いったん解散しようか。\""
"212010-145-チナツ" = "皆さん、お気をつけて。"
"212010-146-チナツ" = "またお会いしましょう。"
"212010-147-イオリ" = "何かあったら連絡してくれ！"
"212010-148-イオリ" = "はぁ……。"
"212010-149-イオリ" = "先輩たち……雷帝の遺産なんかに負けるなよ……！"
"212010-150-イオリ" = "お願いだから、正気に戻って……。騒ぎを起こしてもいいから。しばらく私一人で巡回したっていいから。"
"212010-151-イオリ" = "万魔殿にいびられるのだって2回……いや、3回までなら我慢してやるからさ……！"
"212010-152-イオリ" = "だから……だから……。"
"212010-153-イオリ" = "……。"
"212010-154" = "次回;チナツ"
