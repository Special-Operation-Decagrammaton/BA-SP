[translation]
"212090-1" = "第9話;サツキ"
"212090-2" = "[ns] \"ここを、こうして……。\""
"212090-3" = "[ns] \"お、開いた。\""
"212090-4" = "（足を踏み入れると部屋の中はたくさんの電子機器で埋め尽くされていた）"
"212090-5-サツキ" = "キャリアウェーブを抽出して……。"
"212090-6" = "（集中しているのか、こちらには気づいていないようだ）"
"212090-7" = "[ns] \"サツキ。\""
"212090-8-サツキ" = "あら、先生。辿り着けてなによりだわ。"
"212090-9" = "[s] \"うん。でも、こんな複雑な手順で入る部屋があるんだね……。\""
"212090-10-サツキ" = "情報が外に漏れるわけにはいかないもの。"
"212090-11-サツキ" = "ここに来る間、尾行されていないわよね？"
"212090-12" = "[s] \"何度も確認したよ。\""
"212090-13-サツキ" = "結構。先生なら抜かりないでしょうね。"
"212090-14-サツキ" = "この部屋？あら、ごめんなさい。説明がまだだったわね。"
"212090-15-サツキ" = "万魔殿情報部のシークレット・チャンバーへようこそ。"
"212090-16-サツキ" = "私はここでマインドコントロールの研究を行っているの。"
"212090-17-サツキ" = "部外者を入れるのは先生が初めてよ。歓迎するわ。"
"212090-18-サツキ" = "前置きが長くなってしまったわね。#n先生には実験体になってもらおうと思って呼んだの。"
"212090-19" = "[s] \"私を？\""
"212090-20-サツキ" = "雷帝のNKウルトラ計画に対抗するための研究には、先生も積極的に協力するって話だったじゃない？"
"212090-21" = "[s] \"確かに言ったけど……！\""
"212090-22-サツキ" = "ここに他所の生徒を呼ぶわけにはいかないでしょう？#nだって、万魔殿情報部の特級機密の部屋ですもの。"
"212090-23-サツキ" = "先生を置いて、他に適任なんていないわ。"
"212090-24-サツキ" = "それに、私の立てた仮説はどうにも、他の生徒で試すには危険要素が多いのよねぇ。"
"212090-25" = "[s] \"そういうことなら……。\""
"212090-26-サツキ" = "先生みたいに、どんな誘惑や拷問にも屈しない不屈の精神の持ち主なら、#n万が一副作用があっても平気でしょうし。"
"212090-27-サツキ" = "あら、そんな表情もするのね。#n緊張しているからといって、取り繕わなくていいのよ？"
"212090-28-サツキ" = "もう少しで数式を詰め終わるから、待っていて頂戴。"
"212090-29" = "（椅子に腰掛けて、部屋の中を見回していた）"
"212090-30-サツキ" = "脳波を特定の状態に強制固定してるのだとしたら……。"
"212090-31-サツキ" = "……バイノーラルビートを使って？#nこれと、これを……ひとまず合成して――"
"212090-32" = "（サツキは何かを延々と計算し続けていた）"
"212090-33" = "（どれくらい時間が経っただろう……）"
"212090-34-サツキ" = "なかなか一筋縄じゃいかないわね。"
"212090-35-サツキ" = "でも、やり遂げないと。"
"212090-36-サツキ" = "万魔殿の情報部長として、過去に負けるようじゃ格好がつかないもの。"
"212090-37-サツキ" = "とはいえ根を詰めすぎても効率が落ちるし……少し休憩するわ。#n先生も何か飲むかしら？色々あるわよ。"
"212090-38-サツキ" = "コーヒーね？分かったわ。"
"212090-39" = "（サツキと一緒に温かいコーヒーを飲みながら、しばし休憩を取った）"
"212090-40" = "[ns] \"ところでさ。\""
"212090-41-サツキ" = "なにかしら？"
"212090-42-サツキ" = "……昔の情報部について？"
"212090-43-サツキ" = "自己紹介をした時に言ったのだったかしら。#nかつて存在したゲヘナ生徒会情報部を引き継いでいる、と。"
"212090-44-サツキ" = "ふふっ。覚えていてくれたのね。"
"212090-45-サツキ" = "ええ、そうよ。昔の生徒会情報部は雷帝直属の機関だったの。"
"212090-46-サツキ" = "問題のNKウルトラ計画も含めて、機密性の高い情報を扱っていた組織よ。"
"212090-47-サツキ" = "だけど、私は情報部所属じゃなかったの。#n……むしろ情報部にいたのは――"
"212090-48-サツキ" = "じゃあ、どうして情報部の後継を名乗ってるのか、って？"
"212090-49-サツキ" = "そうね……いろいろな事情があるのだけれど……。"
"212090-50-サツキ" = "端的に言えば、雷帝が残した情報を回収して、廃棄したり管理したりするためよ。"
"212090-51-サツキ" = "私が引き受けた理由は……誰かがやらないといけなかったから。#n……それだけだわ。"
"212090-52-サツキ" = "もともと情報部にいた人たちは大半が雷帝と一緒に姿を消してしまったの。#n残った人だって、もっと差し迫った仕事を抱えていたから。"
"212090-53-サツキ" = "マコトちゃんからすれば、私なら情報を悪用しないという確信もあったんじゃないかしら。"
"212090-54" = "[s] \"なるほどね……。\""
"212090-55-サツキ" = "なんにせよ、旧ゲヘナ生徒会と一緒に、情報部も消滅。#n万魔殿情報部が新設されたというわけ。"
"212090-56-サツキ" = "今の子たちで、昔の話を知っている人はほとんどいない。#nわざわざ知る必要もないもの。"
"212090-57-サツキ" = "これまで、雷帝の情報や計画を見つけては処分してきたのだけれど……。"
"212090-58-サツキ" = "……。"
"212090-59-サツキ" = "マコトちゃんも、こんなことが起こるとは思っていなかったでしょうね。"
"212090-60" = "[s] \"……。\""
"212090-61-サツキ" = "……どうして、NKウルトラが復活したのか。"
"212090-62-サツキ" = "事故じゃないのなら、何者かが裏で糸を引いている。"
"212090-63-サツキ" = "ゲヘナ内部の人間ではないと思うわ。"
"212090-64-サツキ" = "昔の資料は未完成だったし、雷帝失脚の時に全部処分したもの。#nマコトちゃんと私が、直々にね。"
"212090-65" = "[s] \"だとすると……外部の人物……？\""
"212090-66-サツキ" = "おそらくは。"
"212090-67-サツキ" = "……キヴォトスのどこかに、雷帝を崇拝する勢力が残っているの。"
"212090-68-サツキ" = "組織の所在は把握できていないわ。未だに尻尾を掴めたことすらない。"
"212090-69-サツキ" = "雷帝の失脚と共に姿を消した旧生徒会幹部が運営しているとは思うのだけど……。"
"212090-70-サツキ" = "あ……！もしかして、この方法なら……？"
"212090-71" = "（何かを閃いたらしいサツキは、再び机に向かって作業を始めた）"
"212090-72" = "（結局、実験はできなかったけれど、何かしら収穫はあったようだった）"
"212090-73" = "次回;レジスタンス結成"
