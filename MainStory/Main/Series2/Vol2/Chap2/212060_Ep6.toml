[translation]
"212060-1" = "第6話;温泉開発部"
"212060-2-万魔殿のメンバー" = "――以上が議長からの命令だ。"
"212060-3-カスミ" = "……はぁ、呆れてものも言えんな。"
"212060-4-万魔殿のメンバー" = "何だと？"
"212060-5-カスミ" = "いやいや、いつから我々は万魔殿の小間使いになったんだ？#n頼みごとの1つすら聞いた覚えはないんだけどねぇ。"
"212060-6-カスミ" = "そもそも内容がおかしいじゃないか。M級の倉庫8棟を1週間で？"
"212060-7-カスミ" = "冗談は休み休み言いたまえ。#n我々は温泉開発部であって、土木建設部じゃあないんだ。"
"212060-8-万魔殿のメンバー" = "関係ない。命令は下った。お前たちは従えばいい。"
"212060-9-カスミ" = "ほぉ……？"
"212060-10-万魔殿のメンバー" = "キヴォトスを相手取る戦いの前で、万魔殿の指示を拒むつもりか？"
"212060-11-万魔殿のメンバー" = "であればお前たちはゲヘナの裏切り者だ。#nその末路は、わざわざ言われなくとも分かるだろう？"
"212060-12-カスミ" = "お優しいことで涙がこぼれそうだ。"
"212060-13-メグ" = "おおっ！仕事？次にやること決まった？"
"212060-14" = "メグ……！"
"212060-15-カスミ" = "メグ……！"
"212060-16-万魔殿のメンバー" = "その通りだ。偉大なるゲヘナの礎となる重要な仕事だ。"
"212060-17-メグ" = "じゃあ頑張ろう！やっと私たちにも出番がきたね！"
"212060-18-カスミ" = "メグ、これは勢いで決めるような――"
"212060-19-メグ" = "部長！これは重要なんだよ！"
"212060-20-カスミ" = "だから、それは――"
"212060-21-メグ" = "部長は頭いいから、私よりちゃんと分かってるはずだよ！#n私たちは偉大なゲヘナのために……えっと、何だっけ？"
"212060-22-カスミ" = "……。"
"212060-23-メグ" = "なんか、キヴォトスに攻撃するって言ってたよね？ほかの学園と戦うって！"
"212060-24-メグ" = "だったら私たちも手伝わなきゃ！#nもしかしたら温泉掘るより大事かもしれないし！"
"212060-25-カスミ" = "……メグ……？"
"212060-26-万魔殿のメンバー" = "では承諾したものと認識させてもらう。"
"212060-27-万魔殿のメンバー" = "明日からは進捗確認のために、毎日午後に人員を派遣する。"
"212060-28-メグ" = "私たち、建設も得意なんだ！まっかせといて～！"
"212060-29-カスミ" = "……。"
"212060-30-メグ" = "あれ？部長、顔色よくないよ。"
"212060-31-メグ" = "……わ、私、何かまずいことしちゃったかな？"
"212060-32-カスミ" = "……いや。"
"212060-33-カスミ" = "メグ班長がやりたいと言うのなら、やるしかない！#nそう、だよな？ははっ。"
"212060-34-メグ" = "わぁ～い！部長、ありがとう！"
"212060-35-カスミ" = "……ああ。"
"212060-36-メグ" = "じゃあ早く準備しなきゃ――"
"212060-37-カスミ" = "メグ。"
"212060-38-メグ" = "なに～？"
"212060-39-カスミ" = "温泉を掘るより……こっちがいいのか？"
"212060-40-メグ" = "……。"
"212060-41-メグ" = "うん！今は！！"
"212060-42-メグ" = "だってこれを作れば、攻撃が上手くいくだろうし！"
"212060-43-メグ" = "ゲヘナのためになるんでしょ？そうだよね？"
"212060-44-カスミ" = "……ああ、そうだな。"
"212060-45-メグ" = "それなら、私は絶対やりたい！"
"212060-46-カスミ" = "分かった。では、準備に取り掛かるとしよう。"
"212060-47-メグ" = "みんな～集まって～！"
"212060-48-カスミ" = "…………。"
"212060-49" = "[ns] \"カスミ。\""
"212060-50-カスミ" = "む、先生？"
"212060-51-カスミ" = "まったく、声をかけられるまで気づきもしないなんて。私も焼きが回ったか？"
"212060-52-カスミ" = "……って、先生、何があったんだ？#n目の下、すごいぞ？顔色も酷い。"
"212060-53-カスミ" = "あ～、聞くまでもなかったか。最近のゲヘナはロクなもんじゃないからな。"
"212060-54-カスミ" = "皆が皆、あれやこれやとお忙しそうだ。"
"212060-55-カスミ" = "……うん？悩んでる？私が？"
"212060-56-カスミ" = "ははっ、先生は何でもお見通しだな。"
"212060-57-カスミ" = "でもまあ、大したことではないんだ。"
"212060-58-カスミ" = "お疲れの先生を煩わせるのもアレだ。この話はまた今度にしよう。#nでは、私はこれで――"
"212060-59" = "[s1] \"それはできない。\"\n[s2] \"話してくれるまでついて行くよ。\""
"212060-60-カスミ" = "……。"
"212060-61-カスミ" = "はぁ……そんな状態で、今は先生のほうが心配される側だろうに……。"
"212060-62-カスミ" = "仕方ない。面白くもない私の悩みを聞いてもらうとしよう。"
"212060-63" = "（カスミから、今の状況について話を聞いた）"
"212060-64" = "[ns] \"うーん……。\""
"212060-65-カスミ" = "……私は、メグの望むことなら何だって叶えてやるつもりだ。"
"212060-66-カスミ" = "それこそ、感じの悪いあの生徒……あぁ、失礼。#n誰だったか。ショウユちゃん？に言われた通りさ。"
"212060-67-カスミ" = "しかしだ。今のメグが言っていることは……。"
"212060-68-カスミ" = "本当にメグの望みなのか、確信が持てない。"
"212060-69-カスミ" = "……あんなことを言うはずがないんだよ。メグは。"
"212060-70-カスミ" = "だが同時に、こんな考えも浮かんだ。"
"212060-71-カスミ" = "私が勝手にメグを判断していいのか、と。"
"212060-72-カスミ" = "メグの気持ちを決めつけて、私の物差しで測っていいのか？"
"212060-73-カスミ" = "ご存じの通り、メグは自分の気持ちに正直な子だ。"
"212060-74-カスミ" = "純粋なくらい、言葉と行動が一致しているんだよ。"
"212060-75-カスミ" = "だからこそ、今のメグは今のメグで、一番やりたいことを言っているのかもしれない。"
"212060-76" = "[s] \"でも、違和感を覚えたんだね。\""
"212060-77-カスミ" = "その通り。"
"212060-78-カスミ" = "あれはいつものメグじゃない。私の知るメグはあんなことを言わない。そう思うんだ。"
"212060-79-カスミ" = "……。"
"212060-80-カスミ" = "いやいや困ったもんだ。"
"212060-81-カスミ" = "さて、先生ならどうする？"
"212060-82-カスミ" = "変わらず、メグの望みを叶えてやれ。そんなところか？"
"212060-83" = "[s3] \"たぶん、メグの本心じゃないと思う。\"\n[s4] \"メグの考えは変えられてるんだ。\""
"212060-84-カスミ" = "……は？"
"212060-85-カスミ" = "変えられてる……？"
"212060-86-カスミ" = "メグだけじゃなく、ほとんどの3年生が……？"
"212060-87-カスミ" = "冗談……ではなさそうだ。"
"212060-88-カスミ" = "なるほど。おかしいとは思っていた。"
"212060-89-カスミ" = "万魔殿の議長と風紀委員長が手を組んで、世迷言を語り始めた時も。"
"212060-90-カスミ" = "まるでこの瞬間を待っていたかのように、動きの良すぎる連中がいることも。"
"212060-91-カスミ" = "……先生は何を知っているんだ？"
"212060-92" = "（ゲヘナの現状を話した）"
"212060-93-カスミ" = "……なるほど。"
"212060-94-カスミ" = "雷帝の遺産だと言われれば筋は通る。"
"212060-95-カスミ" = "集団に対する認識改変、か。ぞっとしないな。"
"212060-96-カスミ" = "私は……あんなメグの姿、見たくない。"
"212060-97-カスミ" = "それにこのままじゃあ――"
"212060-98-カスミ" = "ゲヘナが、私の最も嫌悪する形になってしまいそうだ。"
"212060-99-カスミ" = "自分の意志はなく、他人の意のままに振り回される。"
"212060-100-カスミ" = "何も考えず従って、「自分は命令に従っただけだ」などと宣う。"
"212060-101-カスミ" = "……斯くいう私も、そういう人間だった。"
"212060-102-カスミ" = "頭の中に埋め込まれた声を、自分の声だと勘違いして生きていたんだ。"
"212060-103" = "[s] \"カスミ……。\""
"212060-104-カスミ" = "ははっ、前にも言ったが、この話は長くなる。"
"212060-105-カスミ" = "どうしても聞きたいと言うのなら……#n話す話さないの問答も含めて、事が片づいた後にしてくれ。"
"212060-106" = "[s] \"話したくなったら聞かせてほしいな。\""
"212060-107-カスミ" = "……ああ、そうさせてもらおう。"
"212060-108-カスミ" = "とかく、これではっきりした。"
"212060-109-カスミ" = "大事な友人が抜け殻にされそうになっているんだ。見過ごすわけにはいかない。"
"212060-110-カスミ" = "ゲヘナのため？はっ！違うな。メグはそんなものを望む子じゃない。"
"212060-111-カスミ" = "あの子が望むのは、地面から噴き上がる熱い湯の温もりなのだから。"
"212060-112-カスミ" = "……過去の亡霊なんぞに、私の日常を汚させはしないさ。"
"212060-113-カスミ" = "先生、手伝えることがあれば何でも協力しよう。"
"212060-114" = "（これからの方針について話し合った）"
"212060-115" = "次回;よく分からない"
