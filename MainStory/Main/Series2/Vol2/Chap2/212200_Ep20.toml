[translation]
"212200-1" = "第20話;残されたもの"
"212200-2-フウカ" = "はい、サンマの塩焼き。あとお味噌汁。"
"212200-3-イズミ" = "わぁ～い！もうお腹ペコペコだよ～！"
"212200-4-ジュンコ" = "すっごく美味しそう！"
"212200-5-アカリ" = "ふふ、ありがとうございます。"
"212200-6-アカリ" = "せっかく作ってくださったのですし、冷めないうちにいただきましょう。"
"212200-7-フウカ" = "なんでご飯作ってあげてるのか、我ながら釈然としないけど……。"
"212200-8-フウカ" = "お腹すかせてるのに放ってはおけないし。"
"212200-9-アカリ" = "やっぱりお優しいですね。"
"212200-10-アカリ" = "優しさついでに、ご飯を3杯ほど追加でお願いできますか？"
"212200-11-ジュリ" = "はい、ただいま！#nいつもの特大お茶碗でお持ちしますね！"
"212200-12-イズミ" = "あむ、はむっ……ん～……。"
"212200-13-ジュンコ" = "……あれ？どうしたの？#n特製ソース出しかけてやめるなんて。"
"212200-14-イズミ" = "うーん、今日はかけなくてもいいかなって。"
"212200-15-イズミ" = "フウカが心を込めて作ってくれたご飯だもん。このままで十分おいしい！"
"212200-16-ジュンコ" = "え、イズミもそういうこと言うんだ。#n普段から素材の味を楽しんでみたら？"
"212200-17-イズミ" = "それとこれとは違うよ。#nあっ！じゃあ今度一緒に、ガリとピーナッツバターをセットで――"
"212200-18-ジュンコ" = "遠慮しとく……。"
"212200-19-ハルナ" = "……。"
"212200-20-アカリ" = "ハルナ、何か考え事ですか？"
"212200-21-フウカ" = "やけに静かじゃない。逆に怖いんだけど。"
"212200-22-ハルナ" = "……サンマの焼き目にムラがあります。#nお味噌汁のお豆腐は大きさがバラバラです。"
"212200-23-フウカ" = "それは……その、急いで準備したから――"
"212200-24-フウカ" = "ん？ちょっと待って、なんで私が言い訳してるのよ？"
"212200-25-フウカ" = "せっかく作ってあげたのに、文句言うなら……。"
"212200-26-ハルナ" = "これぞ美食ですわ。"
"212200-27-ハルナ" = "……この料理をいただきながら、思い返していました。"
"212200-28-ハルナ" = "私が強要した献立や、補給日程、その準備工程について。"
"212200-29-ハルナ" = "そして……誤りを正そうとする皆さんを監視していた、私自身のこと。"
"212200-30-フウカ" = "……。"
"212200-31-ハルナ" = "あのような行いをしてた私すべての行いで汚れた私の情けない魂を、静かに潤してしまうほど――"
"212200-32-ハルナ" = "フウカさんのお料理は温かいんですのね。"
"212200-33-フウカ" = "ハルナ……。"
"212200-34-ハルナ" = "美食とはすなわち、誰かの真心に感謝すること――#nその当たり前を、私は忘れていました。"
"212200-35-ハルナ" = "フウカさんの繊細な手仕事も、ジュリさんの献身も……#n数々の非礼を、ここにお詫びします。"
"212200-36-フウカ" = "……まあ、雷帝のせいだったんでしょ？#nそれなら、あなたたちも被害者じゃない。"
"212200-37-アカリ" = "どのような事情があったとしても……それを言い訳にはしません。"
"212200-38-アカリ" = "あろうことか美食の本分を忘れ、皆さんを統制の枠に押し込もうとしたんですから。"
"212200-39-アカリ" = "それだけでも、反省すべき理由としては十分すぎます。#n本当に……申し訳ありませんでした。"
"212200-40-イズミ" = "あの時の二人、ほんと変だったよ。"
"212200-41-イズミ" = "……怖かった。あんな美食研究会、ぜんぜん楽しくないよ。"
"212200-42-ジュリ" = "ゲヘナがどうにかなっちゃうんじゃないかって思いましたね……。"
"212200-43-ハルナ" = "不安にさせてしまってごめんなさい。"
"212200-44-フウカ" = "……。"
"212200-45-フウカ" = "はい、もう終わり！しょんぼりしてたって何にもならないでしょ？"
"212200-46-フウカ" = "その代わり、これだけは絶対に覚えておいて。"
"212200-47-フウカ" = "もしも同じことをしたら、金輪際ご飯作ってあげないから。分かった！？"
"212200-48-ハルナ" = "ふふ、それは大問題ですわね。"
"212200-49-イズミ" = "私たちだって！またそうなったら、一緒にご飯食べに行かないから！"
"212200-50-イズミ" = "ソースも分けてあげないんだから！"
"212200-51-アカリ" = "あらあら。精神力を鍛えないといけませんね。#n洗脳ごとき、最初から効かないくらいには。"
"212200-52-アカリ" = "な、の、で……お代わりいただけますか？#n何をするにも、ご飯の力があってからこそですから★"
"212200-53-ジュリ" = "もう3杯全部食べたの！？"
"212200-54-ジュリ" = "はーい！少々お待ちください！"
"212200-55" = "（謝り方はそれぞれ違う。だが、その気持ちはきちんと伝わっているはずだ）"
"212200-56-セナ" = "……。"
"212200-57-チナツ" = "セナ先輩。"
"212200-58-セナ" = "チナツでしたか。どうしました？"
"212200-59-チナツ" = "……調子はいかがですか？"
"212200-60-セナ" = "絶好調です。最近は死体……いえ、患者もいませんでしたし。"
"212200-61-チナツ" = "それはよかっ――"
"212200-62-セナ" = "ですが、気持ちは晴れませんね。"
"212200-63-チナツ" = "……。"
"212200-64-セナ" = "覚えているんです。#n……私がチナツに話したこと。"
"212200-65-セナ" = "攻撃は医療行為だとか、出血は手術の過程として許容すべきだとか――"
"212200-66-セナ" = "あのような詭弁を、私は並べ立てていた。"
"212200-67-セナ" = "……救急医学部を預かる者として、部長失格です。"
"212200-68-チナツ" = "あれが先輩の本心じゃなかったことは分かっています。"
"212200-69-セナ" = "そうだとしても。一度吐いた言葉をなかったことにはできません。"
"212200-70-セナ" = "偉大さには犠牲が伴う？まさか。#n医療が犠牲を当然にしていいはずがありません。"
"212200-71-セナ" = "たった一滴でさえも、出血を防ぐためにもがく。#nそれこそが私たちの本分であるはずなのに。"
"212200-72-チナツ" = "ちゃんと……先輩は実践されてきました。これからだって、きっと。"
"212200-73-セナ" = "……。"
"212200-74-セナ" = "チナツが戦う姿を見ました。"
"212200-75-セナ" = "ヒナ風紀委員長に立ち向かい、苦しみながらも銃を構える姿を。"
"212200-76-セナ" = "己の信じる道を進み、道理に外れたことに抗うチナツを……私は見ました。"
"212200-77-チナツ" = "そ、それは……。"
"212200-78-チナツ" = "以前、あなたが風紀委員会に行くと言った時、私は道を違えてしまったように受け止めていました。"
"212200-79-チナツ" = "ですが、今回の件でようやく気づきました。#nあなたは風紀委員会という名の救急隊員になって、道を見失っていた私を正しい場所へ搬送してくれたのだと。"
"212200-80-チナツ" = "ありがとうございます。あなたが私の後輩であることを、誇りに思いますよ、チナツ。"
"212200-81-セナ" = "あなたは私が教えたすべてを超えて、最も完璧な応急処置を成し遂げました。"
"212200-82-チナツ" = "……よかったです。本当に、先輩が戻ってきてくださってよかった。"
"212200-83-セナ" = "ふふっ……。"
"212200-84-セナ" = "さあ、搬送は終わりましたから、次はリハビリ治療を始めなければなりませんね。"
"212200-85-セナ" = "二度とあんな事が起こらないように、#n風紀委員会と救急医学部の合同点検を提案するつもりです。"
"212200-86-チナツ" = "私からもお伝えします。委員長、きっと喜ばれますよ。"
"212200-87-セナ" = "……改めて、私の心を正しい方向へ導いてくれてありがとうございました。"
"212200-88-チナツ" = "セナ先輩も……。"
"212200-89-チナツ" = "私を信じてくださって……ありがとうございます。"
"212200-90-温泉部の部員A" = "いっちょ上がり！#n次！次はどこ！？"
"212200-91-温泉部の部員B" = "のんびりなんてしてらんない！#nまだ見ぬ温泉が私たちを待っているのだから！"
"212200-92-温泉部の部員B" = "最近さ、攻撃だの何だのって、ほんっと馬鹿みたいだったよね。#n温泉より大事なものなんてないのに！"
"212200-93-温泉部の部員B" = "そうだそうだー！"
"212200-94-メグ" = "わぁ～！良い温度だし、湧き出す勢いもすっごい！最高の温泉だ～！"
"212200-95-メグ" = "やっぱり部長の言う通りだったね！"
"212200-96-カスミ" = "ハーッハッハッハ！当然だとも。我々は己が力で掘り当てられるのだ。"
"212200-97-カスミ" = "……だから、あの地図のことは忘れていいぞ。"
"212200-98-メグ" = "地図……？#nあっ、あったね！忘れてた！"
"212200-99-カスミ" = "ははっ。つまりはその程度の代物だったということさ。#n気にかける必要もない。"
"212200-100-メグ" = "あー……でも、それで思い出したんだけどさ……#n何であんな気持ちになってたんだろ？"
"212200-101-メグ" = "ゲヘナのためとか……役に立ちたいとかさ。"
"212200-102-カスミ" = "それは――"
"212200-103-メグ" = "だけど、もうどうでもいいんだ！"
"212200-104-メグ" = "私、難しい話はよく分かんないし。わくわくしないもん！"
"212200-105-カスミ" = "ああ、そうだな。面白みなんてありはしないさ。何一つ、な。"
"212200-106-メグ" = "私たちには部長がいるから大丈夫！"
"212200-107-カスミ" = "……。"
"212200-108-カスミ" = "メグ。別に、私の言う通りにばっかりする必要はないんだ。"
"212200-109-メグ" = "え？"
"212200-110-カスミ" = "それでは、[ruby=あれ]洗脳[/ruby]と変わらなくなってしまうからな……。"
"212200-111-カスミ" = "大事なのは、メグが何をしたいかだ。"
"212200-112-メグ" = "も～、何度も聞いてるよ、それ。"
"212200-113-メグ" = "な～んにも心配しなくていいよ！"
"212200-114-メグ" = "私が一番やりたいのは、部長と――みんなと一緒にいることだもん！"
"212200-115-メグ" = "みんなで温泉掘って、おいしいもの食べて、建物も建てて。#n私はそういうのが好き！これからもずーっとそうしてたい！"
"212200-116-カスミ" = "ははっ！ハーハッハッハッハ！"
"212200-117-カスミ" = "そこまで言われちゃあ仕方ない。この私が叶えてやろうじゃないか。"
"212200-118-メグ" = "うん！いつもありがとう、部長！"
"212200-119-温泉部の部員A" = "そうだそうだ！よく言ったぞメグ班長！#nみんな！私たちは誰だ――！？"
"212200-120-温泉部の部員B" = "温泉開発部！！"
"212200-121-カスミ" = "そこに温泉があるから我々がいる！"
"212200-122-カスミ" = "いや、たとえ温泉がなくとも我々がいる！！"
"212200-123-カスミ" = "さあ、次の場所へ移動だ！#n今日中にあと5つは温泉を掘るからな！1秒たりとて無駄にはできないぞ！"
"212200-124-メグ" = "……部長？行かないの？"
"212200-125-カスミ" = "ん？ああ。少し考えたいことがあるんだ。#n後で追いつくから、先に行っててくれ。"
"212200-126-メグ" = "分かった！気をつけて来てね！下り道は危ないから！"
"212200-127-カスミ" = "ああ、心配してくれてありがとな、メグ。じゃあまた後でな。"
"212200-128-カスミ" = "さて……。"
"212200-129-カスミ" = "今回の一件……どこか懐かしさがあった。"
"212200-130-カスミ" = "目的も、やり口も、「あっち」を彷彿とさせるような……。"
"212200-131-カスミ" = "あいつらが動いてるという前提で考えると――"
"212200-132-カスミ" = "ふーむ、私の身が危ないな。"
"212200-133-カスミ" = "引っかかる点は多すぎて困るんだが、さてどうしたものか。"
"212200-134-カスミ" = "面倒事に巻き込まれる予感しかないが……。"
"212200-135-カスミ" = "うわっ、寒っ！やっぱ山頂だからかな？"
"212200-136-カスミ" = "はっ！どれだけ冷たい風が吹こうが、地の底から煮えたぎる私たちの熱は冷ませない！"
"212200-137-カスミ" = "ああ、そうだな。"
"212200-138-カスミ" = "そちらがそのつもりなら……歓迎しよう。"
"212200-139-カスミ" = "[ruby=Bodensatz]ボーデンザッツ[/ruby]の諸君。"
"212200-140" = "次回;消えることのない"
