[translation]
"212050-1" = "第5話;辞めます"
"212050-2" = "万魔殿・作戦会議室"
"212050-3-万魔殿のメンバー" = "マコト議長、ゲヘナ再興委員会が面会を求めています。"
"212050-4-マコト" = "うむ、許可する。"
"212050-5-万魔殿のメンバー" = "中へお通しいたします。"
"212050-6-ショウコ" = "……。"
"212050-7-カレン" = "あ……。"
"212050-8-マコト" = "ふん。何の用だ。[ruby=ふりはた]降旗[/ruby]マユミ、[ruby=みょうらく]明楽[/ruby]カレン。"
"212050-9-カレン" = "えっと、その……。"
"212050-10-カレン" = "議長先輩、まどろっこしいのは無しね。"
"212050-11-マコト" = "キシシッ……無礼極まりなくとも許してやるのが度量というもの。言ってみるがいい。"
"212050-12-カレン" = "っとにもう……。"
"212050-13-カレン" = "とにかく、あの演説。あれ、本気？"
"212050-14-マコト" = "この私はいつだって本気だ。"
"212050-15-カレン" = "じゃあ、ゲヘナはキヴォトスに攻撃をしかけるの？"
"212050-16-マコト" = "逆に問おう。なぜ本気を疑う？#nこの[ruby=はぬま]羽沼[/ruby]マコト様の言葉では信用に足らぬとでも？"
"212050-17-マユミ" = "いや、だって……キヴォトスを攻撃する、とか。いきなり言われても困っちゃうよ。"
"212050-18-マユミ" = "それに、ちょっと強引だよ。さっき見たけど、生徒の弾薬まで取り上げてたし。#nそこまでする？"
"212050-19-マコト" = "キキキッ。私の指令は正しく機能しているようだな。"
"212050-20-マユミ" = "そんな……。"
"212050-21-マコト" = "ふん、あれだけ大口を叩いておきながら、怖がっているのか？#n変化とは常に見慣れず、恐ろしいものなのだ。"
"212050-22-マコト" = "今や風紀委員会と万魔殿は手を組み、全校生徒がゲヘナの旗の下に集結した。"
"212050-23-マコト" = "お前が夢見ていた「一つになったゲヘナ」はここに結実したのだ。"
"212050-24-マユミ" = "……でもさ、個人の意志も大事じゃない？#n私たちが夢見てたのは、みんなが自分の意志でまとまって、それで偉大になることだったのに……。"
"212050-25-ショウコ" = "お言葉ですが委員長。#n意志は環境によって形作られるものです。"
"212050-26-ショウコ" = "無秩序という既存の環境を、徹底的に統制された秩序へと変えてきただけですよ。"
"212050-27-マコト" = "ショウコ……。"
"212050-28-マコト" = "ならば問おう。お前たちは本気なのか？"
"212050-29-カレン" = "な、何が？"
"212050-30-マコト" = "偉大なゲヘナの礎とするため、キヴォトスに敵対する覚悟はあるのか？"
"212050-31-マコト" = "お前たちは口癖のように言っていたではないか。#nゲヘナを偉大に、偉大なゲヘナを再び、と。"
"212050-32-カレン" = "……。"
"212050-33-マコト" = "かつてのゲヘナに戻りたかったのだろう？#nまさに今がその時なのだ。"
"212050-34-マコト" = "あの頃のように皆の心が一つにまとまり、同じ目標へ向かい進んでいる。"
"212050-35-カレン" = "でもさ……。"
"212050-36-カレン" = "議長先輩、昔より今のゲヘナのほうが良いんじゃなかったの？"
"212050-37-カレン" = "うちらが活動の許可をもらいに来たとき、そう言ってたじゃん。自由だって。"
"212050-38-マユミ" = "そうだよ。何で急に変わったの？先輩だけじゃなく、ほかの先輩たちまで……。"
"212050-39-マコト" = "キシシッ……あの時はまだ真理に辿り着いていなかった。それだけのことだ。"
"212050-40-マコト" = "完全な統制の下に成り立つ秩序と比べてみろ。#n半端に与えられた自由など、極めて非効率で予測のつかない不安要素にすぎんのだ。"
"212050-41-マコト" = "むしろあの時、お前たちこそ言っていたではないか。#n見かけ倒しの自由に意味はないと。"
"212050-42-カレン" = "そ、それは確かに言ったけど……。"
"212050-43-マコト" = "この私が保証しよう。#n事を成し遂げた後のゲヘナは、お前たちでは想像もできぬほど眩く輝く学園となる。"
"212050-44-マコト" = "今はただ、このマコト様についてくればいい。"
"212050-45-イロハ" = "……。"
"212050-46-カレン" = "……分かった。今日は帰るね。"
"212050-47-マコト" = "キシシッ。今後の振る舞いを、よく考えておくことだ。"
"212050-48-マコト" = "何だ、イロハ。言いたいことがあるならさっさと言え。"
"212050-49-イロハ" = "マコト先輩は……本気なんですよね？"
"212050-50-マコト" = "またその話か？お前なら知っているはずだ。私は戯言を口にしたことなど一度もない。"
"212050-51-イロハ" = "……。"
"212050-52-イロハ" = "じゃあ、私……万魔殿、辞めます。"
"212050-53-マコト" = "何だと？"
"212050-54-イロハ" = "私の知っているマコト先輩は、そんなことは言いません。"
"212050-55-イロハ" = "変わってしまったマコト先輩を……私はもう、見たくないので。"
"212050-56-サツキ" = "い、イロハちゃん……？"
"212050-57-サツキ" = "……。"
"212050-58-イブキ" = "イロハ先輩……？"
"212050-59-イロハ" = "……そうか。"
"212050-60-イロハ" = "はい。"
"212050-61-マコト" = "ならば、好きにするがいい。"
"212050-62-イロハ" = "……。"
"212050-63-マコト" = "ふん……お前ならば、万魔殿を継ぐこともあり得ると思っていたのだが……。"
"212050-64-マコト" = "ここまで、ということか。"
"212050-65-イロハ" = "はい。短くない間、お世話になりました。"
"212050-66-マコト" = "……。"
"212050-67-イブキ" = "イロハ……先輩……？"
"212050-68-イブキ" = "やめる、って……もう万魔殿じゃないの……？"
"212050-69-チアキ" = "ど、どどどうしましょう！？イロハちゃんが……！！"
"212050-70-マコト" = "騒ぐな。"
"212050-71-チアキ" = "で、でも！"
"212050-72-マコト" = "今のゲヘナは重要な岐路に立っている。#n精巧な歯車のように全てが噛み合わなければ、大業は成せん。"
"212050-73-マコト" = "身命を賭して臨み、偉大なるゲヘナを築かねばならぬ時――軋むネジなど不要！！"
"212050-74-イブキ" = "……マコト先輩、ひどい！"
"212050-75-イブキ" = "そんなこと言っちゃダメだよ！"
"212050-76-マコト" = "……違うぞ、イブキ。今は個人的な関係に囚われる時ではないのだ。"
"212050-77-マコト" = "我らの宿願を果たすためには――"
"212050-78-イブキ" = "知らない！イブキ、よく分かんないけど……イロハ先輩は悲しそうだった！"
"212050-79-マコト" = "くっ……！"
"212050-80-マコト" = "サツキ、チアキ。イブキをなだめておけ。"
"212050-81-マコト" = "ショウコ、視察に出る。在庫物資の書類を持って随行しろ。"
"212050-82" = "承知しました。"
"212050-83-サツキ" = "……。"
"212050-84-チアキ" = "マコト先輩……。"
"212050-85-イブキ" = "……ひっく。"
"212050-86-イブキ" = "う、うぅ……うえぇ……うええぇぇ～～～～ん。"
"212050-87-チアキ" = "い、イブキちゃん！#nマコト先輩もイロハちゃんも……ほ、本心じゃないかもしれないよ！"
"212050-88-チアキ" = "あっ、そうだ！プリン食べよっか？甘いもの食べたら気分も良くなるし～～！！"
"212050-89-イブキ" = "いらない……うえぇん……ケンカしないで……ひどいことも言わないでぇ……ひぃん。"
"212050-90-チアキ" = "言わないよ！言わないから！ほら、落ち着いて……。"
"212050-91-サツキ" = "イロハちゃん……。"
"212050-92-ショウコ" = "……。"
"212050-93-ショウコ" = "議長。"
"212050-94-マコト" = "……。"
"212050-95-ショウコ" = "イロハ議員……いえ[ruby=なつめ]、棗イ[/ruby]ロハをこのまま放置されるおつもりですか。"
"212050-96-マコト" = "何が言いたい。"
"212050-97-ショウコ" = "棗イロハは、議長に従わぬ意志を明確にしました。"
"212050-98-ショウコ" = "もはや彼女はゲヘナの結束を損なう者。見逃してよい理由は無いかと。"
"212050-99-ショウコ" = "要注意人物に指定し、事と次第によっては反逆に対する――"
"212050-100-マコト" = "そこまでだ。"
"212050-101-マコト" = "……。"
"212050-102-マコト" = "処遇は、この私が決める。"
"212050-103-マコト" = "進言は聞いてやる。だが、分を弁えろ。"
"212050-104-ショウコ" = "……失礼しました。"
"212050-105-マコト" = "……行くぞ。"
"212050-106-ショウコ" = "……やはり、すべてをコントロールできるわけではありませんか。"
"212050-107-ショウコ" = "とはいえ、この程度でも十分でしょう。ふふ。"
"212050-108" = "次回;温泉開発部"
