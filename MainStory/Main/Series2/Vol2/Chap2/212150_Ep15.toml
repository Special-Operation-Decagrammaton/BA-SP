[translation]
"212150-1" = "第15話;作戦立案"
"212150-2-マユミ" = "……。"
"212150-3-風紀委員" = "……。"
"212150-4-万魔殿のメンバー" = "……。"
"212150-5-イロハ" = "……。"
"212150-6-？？？" = "カッコウは――"
"212150-7-イロハ" = "巣の上へ飛んでいく。"
"212150-8-？？？" = "入って。"
"212150-9-カレン" = "いらっしゃい、イロハちゃん。"
"212150-10-イロハ" = "はぁ……息苦しくなっていきますね。"
"212150-11-マユミ" = "だよねー。監視、どんどん厳しくなってる。"
"212150-12-イオリ" = "しかも私たちは要注意人物に指定されてるんだから。#n隙を見て抜け出すのだって大変だ。"
"212150-13-イロハ" = "このままではすぐに限界が来ます。"
"212150-14-カレン" = "でも焦りは禁物っしょ。1ミスでアウトなんだし。"
"212150-15-サツキ" = "はぁ……問題が起きたわ。"
"212150-16-イロハ" = "何があったんですか……？"
"212150-17-イオリ" = "尾行にバレたのか！？"
"212150-18-サツキ" = "いいえ、そんなヘマはしないわ。"
"212150-19-サツキ" = "問題はそれより厄介だけれどね……。"
"212150-20-イオリ" = "……何だよ。"
"212150-21-サツキ" = "集中指揮室に、遠隔操作システムがあると判明したわ。"
"212150-22-マユミ" = "遠隔操作……？どこの？"
"212150-23-サツキ" = "放送室よ。機材を遠隔で操作できるみたい。"
"212150-24-イロハ" = "……！！"
"212150-25-マユミ" = "つまり……？"
"212150-26-チナツ" = "……放送機材に触れた時点で、集中指揮室に気づかれるということですね。"
"212150-27-イオリ" = "ええ。放送機材の電源を入れた瞬間に、遠隔で落とされるはずだわ。"
"212150-28-サツキ" = "目的を果たすにはこれを欺くか……システムそのものを無力化する必要がある。"
"212150-29-イオリ" = "そんなことできるのか……？"
"212150-30-サツキ" = "作戦会議室には風紀委員長が常駐しているわ。そう簡単には手を出せない。"
"212150-31-サツキ" = "だけど放送室に潜入して妨害電波を流すには、遠隔操作システムをどうにかしないといけないし……。"
"212150-32-イオリ" = "無茶言うなよな……。"
"212150-33-カレン" = "学園ひっくり返すのが簡単なわけなくない？"
"212150-34-イオリ" = "それはそうだけど……！ってお前、どっちの味方なんだよ！？"
"212150-35-カレン" = "頭を冷やせって言ってんの。興奮したって解決しないでしょ。"
"212150-36-イオリ" = "それはそうだけど……。"
"212150-37-イオリ" = "でもやっぱり、お前は感じ悪い。"
"212150-38-カレン" = "やはっ、同じ穴の狢って感じ？"
"212150-39-イオリ" = "……は？"
"212150-40-カレン" = "まあまあ。少しは頭冷えたっしょ？"
"212150-41-イオリ" = "むぅ……。"
"212150-42-イロハ" = "八方ふさがりにも思えますが……何か他の手は……。"
"212150-43-イロハ" = "放送室への潜入……放送室……。"
"212150-44-イロハ" = "サツキ先輩、放送室の機材から遠隔操作システムを切り離すことってできますか？"
"212150-45-サツキ" = "……断言はできないわ。すべての通信機器を把握しているわけではないもの。"
"212150-46-サツキ" = "どのみち周波数の分析まで考えると、どう考えても時間が足りないのよ。"
"212150-47-イロハ" = "はぁ……。"
"212150-48-イロハ" = "待ってください。そういえば――"
"212150-49-マユミ" = "何か思いついたの？"
"212150-50-イロハ" = "放送室に詳しそうな人に心当たりが……。"
"212150-51-キララ" = "やる！やる！！"
"212150-52-イロハ" = "即答ですか！？#n何をしようとしてるのか、ちゃんと分かってます？"
"212150-53-エリカ" = "キララちゃん、落ち着いて。"
"212150-54-エリカ" = "まあ……どのみち、やるつもりだったけど。"
"212150-55-イロハ" = "校内放送の経験があるお二人ならと思ったのですが、正直ここまで話が早いとは……。"
"212150-56" = "そういえばイロハちゃん、万魔殿辞めたんだって？"
"212150-57-イロハ" = "えっ、それもうそんなに広まってるんですか？"
"212150-58-キララ" = "辞めたのって、万魔殿の進もうとしてる方向と合わなかったからでしょ？"
"212150-59-イロハ" = "……ええ、まあ。その通りです。"
"212150-60-キララ" = "最近いろいろあったもんね。"
"212150-61-エリカ" = "私たちも、あんまりいい気はしてなかったんだ。"
"212150-62-エリカ" = "キヴォトスに攻撃するとか意味が分からない。"
"212150-63-エリカ" = "他の学園にも友達いるのに、本気で戦えって？それは勘弁かな。"
"212150-64-キララ" = "……はい。ほんと、何を言ってるんでしょうね。"
"212150-65-キララ" = "うんうん。あたしたちも同じ気持ち。"
"212150-66-エリカ" = "だから協力するよ。"
"212150-67-イロハ" = "持つべきものは友ですね。"
"212150-68-エリカ" = "おぉっ、それ、すっごく嬉しいんだけど！"
"212150-69-エリカ" = "これからもよろしくね。"
"212150-70-エリカ" = "で、具体的に何をすればいいの？"
"212150-71-サツキ" = "――という話なの。機材の使い方は覚えているかしら？"
"212150-72-エリカ" = "先に整理してもいい？"
"212150-73-エリカ" = "遠隔操作システムを迂回できればいいんだよね？"
"212150-74-サツキ" = "ええ。電源を介さずに送信機へ直接つなげられたら理想的ね。"
"212150-75-エリカ" = "……それならできると思うよ。"
"212150-76-イオリ" = "で、できるのか！？"
"212150-77-キララ" = "エリカちゃん、こういうの結構得意なんだよ！"
"212150-78-エリカ" = "自慢するほどじゃないけど……放送室にあった機材くらいなら。"
"212150-79-マユミ" = "ってことは問題解決！？"
"212150-80-サツキ" = "最後のピースがはまったわね。運が向いてきたのかしら。"
"212150-81-カレン" = "やはっ、なんか上手くいきそうじゃん？"
"212150-82-イロハ" = "それでは、給食部が時間を稼いでくれているうちに作戦を立てましょう。"
"212150-83-イロハ" = "少なくとも数日。運が良ければ数週間は稼げるはずで――"
"212150-84-チアキ" = "た、大変です……！！"
"212150-85-サツキ" = "落ち着いて。何があったの？"
"212150-86-チアキ" = "もうすぐ……攻撃が始まりそうです！！"
"212150-87-マユミ" = "なんで！？"
"212150-88-チアキ" = "――ということなんです……。"
"212150-89-イオリ" = "ちょ、ちょっと待て。化学弾！？"
"212150-90-チアキ" = "それも、ものすごい威力の……。"
"212150-91-エリカ" = "スケール大きすぎてついていけないんだけど～！"
"212150-92-エリカ" = "これ……今まで聞いた話の中で一番怖いんだけど……。"
"212150-93-チナツ" = "そんなものがゲヘナにあったんですか……？"
"212150-94-サツキ" = "……あるわ。"
"212150-95-サツキ" = "正確には、あった……と言うべきかしら。"
"212150-96-サツキ" = "マコトちゃん……やっぱり覚えてたのね。作らなかっただけで……。"
"212150-97-イロハ" = "なんでマコト先輩がそんなことを知ってるんですか！？"
"212150-98-サツキ" = "言ったでしょう？一緒に雷帝の痕跡を処分したって。"
"212150-99-サツキ" = "つまり、全部自分の目で見ているのよ。"
"212150-100-チアキ" = "見ただけでそこまで覚えられるものなんですか……？"
"212150-101-サツキ" = "マコトちゃん、興味のある分野に関しては記憶力がとてもいいもの。"
"212150-102-イロハ" = "ほんっとうに……こういう時に限って有能なんですから。"
"212150-103-サツキ" = "本気になったマコトちゃんはキヴォトスの誰よりも厄介とはこういうことよ。"
"212150-104-イオリ" = "って、それが本当なら時間がほとんど残ってないってことだよな？"
"212150-105-イオリ" = "のんびり作戦なんか練ってる場合じゃなかった……！！"
"212150-106-イロハ" = "……行きましょう、今すぐ。"
"212150-107-エリカ" = "えっ？もう！？"
"212150-108-イオリ" = "速攻でいこう。この際それがいい。基本の作戦はもうできてるし。"
"212150-109-キララ" = "怖いけど……役に立てるなら頑張るよ！"
"212150-110-イロハ" = "……決戦の時がこんなに早く来るとは思いませんでしたね。"
"212150-111-イロハ" = "ああ、それと。[ruby=・]あ[/ruby][ruby=・]っ[/ruby][ruby=・]ち[/ruby]にも連絡を入れておきます。"
"212150-112-イオリ" = "頼るしかないよな……気は進まないけど。"
"212150-113-チナツ" = "今は、志を同じくする[ruby=・]仲[/ruby][ruby=・]間[/ruby]ですから。"
"212150-114-イロハ" = "はい。では――"
"212150-115" = "次回;ゲヘナ奪還作戦（１）"
