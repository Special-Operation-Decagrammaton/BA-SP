[translation]
"52135-1" = "（一方、同時刻の「彼岸邸」の前では……）"
"52135-2" = "[ns1] \"やっぱり出たか……。\"\n[ns2] \"先にこっちに来るとはね……。\""
"52135-3-アザミ" = "……付喪神！？"
"52135-4-アザミ" = "先生、私の後ろに！"
"52135-5-シュロ" = "イヒヒッ……。"
"52135-6-シュロ" = "あはっ……アハハハッ……。"
"52135-7-シュロ" = "アハハハハハハハッ！！"
"52135-8-シュロ" = "ざまぁないですぅ！コクリコ様はぜぇんぶ分かってたんですよぉ！？"
"52135-9-シュロ" = "手前らが変な模様を頼りに「彼岸邸」に来るのも、百物語は百蓮でしか倒せないことも！"
"52135-10-シュロ" = "ちょーっと手前が怖がって見せたら、先生をほっぽって散り散りになるなんて！"
"52135-11-シュロ" = "花鳥風月部を罠にかけたですってぇ？"
"52135-12-シュロ" = "蛇の口に手を突っ込んでるとも知らないでぇ！イヒヒヒッ！"
"52135-13" = "[s] \"……シュロ。\""
"52135-14-シュロ" = "何です、シャーレの先生？今になって命が惜しくなりましたぁ？"
"52135-15-シュロ" = "もう誰も助けてくれませんよぉ。"
"52135-16-シュロ" = "おとなしく黄昏に食われてくださいねぇ。[ruby=・]あ[/ruby][ruby=・]っ[/ruby][ruby=・]ち[/ruby]で、生徒たちの相談に乗ってあげてくださぁい。"
"52135-17" = "[s] \"……本当に、さっきのは演技だったの？\""
"52135-18-シュロ" = "……っ！"
"52135-19-シュロ" = "演技だって言ってるでしょ！手前が怖がってたとでも！？"
"52135-20-シュロ" = "何でも知ったようなこと言って、吐き気がする！とっとと百物語の餌になってください！"
"52135-21-シュロ" = "ほら、さっさと[ruby=や]撃[/ruby]るんですよぉ！"
"52135-22-シュロ" = "え……？"
"52135-23-シュロ" = "怪談の百物語が……手前を……？"
"52135-24-シュロ" = "う、うそ……だぁ……そんな……コクリコ様ぁ……。"
"52135-25-シュロ" = "ぐずっ……ぞんなわげないぃ……。"
"52135-26" = "[ns3] \"どういうこと……？\"\n[ns4] \"なんで百物語がシュロを撃ったの？\""
"52135-27-アザミ" = "……花鳥風月部の内輪で、何かあったのでしょうか？"
"52135-28-アザミ" = "それより、今のシュロさんは百物語を扱えないようです。"
"52135-29-アザミ" = "今、攻撃を受けたら……。"
"52135-30-アザミ" = "彼女が黄昏に……。"
"52135-31-アザミ" = "自業自得……かもしれませんが。"
"52135-32" = "[s] \"……行ってくるよ。\""
"52135-33-アザミ" = "ほ、本気ですか？"
"52135-34-アザミ" = "百物語は消えましたが、まだ危険です。"
"52135-35-アザミ" = "「彼岸邸」は敵地のままですし……。"
"52135-36-アザミ" = "あの子は、あなたを殺そうとしていたんですよ？"
"52135-37-アザミ" = "そんな無謀な――"
"52135-38" = "[ns5] \"危険な目に遭ってる子がいるなら、助けなきゃ。\"\n[ns6] \"判断はその後だよ。\""
"52135-39-アザミ" = "はは……。"
"52135-40-アザミ" = "なんとなく、そう仰ると思ってたんですけどね。"
"52135-41-シュロ" = "はぁ……はぁ……はぁ……。"
"52135-42-シュロ" = "（うそだ、うそだ、うそだ……！）"
"52135-43-シュロ" = "（ほんとに……手前は捨てられたの？）"
"52135-44-シュロ" = "（二度も失敗して、コクリコ様が怒っちゃった……？）"
"52135-45-シュロ" = "（だから百物語が、手前を……）"
"52135-46-シュロ" = "（そんなのイヤだ！コクリコ様がいなきゃ、手前はまた……）"
"52135-47-シュロ" = "やだ……やめてぇ……。"
"52135-48-シュロ" = "もう捨てられたくない……あんなとこ、戻りたくないよぉ……。"
"52135-49-シュロ" = "……と、とまれぇっ！！"
"52135-50-シュロ" = "……え？"
"52135-51" = "[s] \"間に合って……よかった。\""
"52135-52-シュロ" = "……シャーレの先生？"
"52135-53-シュロ" = "なんで飛び出して……？"
"52135-54" = "[s] \"助けにきたよ。\""
"52135-55-シュロ" = "でも……。"
"52135-56-シュロ" = "手前は……手前を殺そうとしたのに……。"
"52135-57-シュロ" = "な、なにを勘違いしてるんですかぁ！？"
"52135-58-シュロ" = "そんなことで、手前がいい子になるとでも！？"
"52135-59" = "[s7] \"危険に陥った子を助けるのに理由はいらない。\"\n[s8] \"人として、当然のことだよ。\""
"52135-60-シュロ" = "ふざけたことを……！"
"52135-61-シュロ" = "手前が、手前らとは違って銃弾一発で倒れるのくらい、知ってますよぉ！"
"52135-62-シュロ" = "なのに……なのに、自分だけじゃなく、生徒たちまで黄昏に食わせようとした敵を助けるなんてぇ！？"
"52135-63-シュロ" = "……バカなんですかぁ！？"
"52135-64" = "[s] \"大丈夫だよ、シュロちゃん。私は意外と丈夫だから。\""
"52135-65-シュロ" = "誰がシュロちゃんっ――"
"52135-66" = "[s] \"でも、やっぱり痛いね……。\""
"52135-67-シュロ" = "……は？"
"52135-68-レンゲ" = "師匠ーっ！"
"52135-69-アザミ" = "ああ、皆さんもご無事でしたか！"
"52135-70-アザミ" = "さ、先ほど百物語が現れて……。"
"52135-71-キキョウ" = "わかってる。"
"52135-72-キキョウ" = "……[USERNAME]先生は無事？"
"52135-73-アザミ" = "あの……先生は――"
"52135-74-アザミ" = "百物語に襲われたシュロさんを追っていきました……。"
"52135-75-アザミ" = "私も止めたのですが……。"
"52135-76-レンゲ" = "だからって、師匠を一人で行かせたのかよ？"
"52135-77-レンゲ" = "力ずくでも――"
"52135-78-レンゲ" = "キキョウ！？"
"52135-79-レンゲ" = "そ、そこまでしなくても……。"
"52135-80-キキョウ" = "アヤメ委員長ばかり気にしてた。"
"52135-81-キキョウ" = "どこかに花鳥風月部が潜んでるとは思ったけど……。"
"52135-82-キキョウ" = "こんな近くにいたなんてね。"
"52135-83-アザミ" = "……あはっ。"
"52135-84-アザミ" = "……どうして分かったのですか？ "
"52135-85" = "次回;花鳥風月部の怪芸家"
