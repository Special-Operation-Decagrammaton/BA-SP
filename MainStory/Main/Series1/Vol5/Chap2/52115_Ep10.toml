[translation]
"52115-1" = "第11話;彼岸へと至る道"
"52115-2" = "北部自治区・雪原"
"52115-3-レンゲ" = "――奴らの居場所がわかったって、ほんとか？"
"52115-4" = "うん。説明してなかったっけ？"
"52115-5-アヤメ" = "うん。説明してなかったっけ？"
"52115-6-ユカリ" = "されてないよ。"
"52115-7-ユカリ" = "と、突然飛び出されたので、ついていくのが大変でしたわ……。"
"52115-8-アヤメ" = "ごめんごめん！魑魅魍魎や黄昏は闇の中で力を増すって聞くから……。"
"52115-9-アヤメ" = "日が暮れる前にって、つい焦っちゃった。"
"52115-10-ナグサ" = "花鳥風月部の本拠地が、こんな近場にあるの？"
"52115-11-ユカリ" = "シュロさんは何もおっしゃっていませんでしたが……。"
"52115-12-アヤメ" = "そこの[ruby=げんりょうつくもがみ]幻魎付喪神[/ruby]を見ていて、気づいたんだ。"
"52115-13-アヤメ" = "ほら、持ち手を見て。印が入ってるでしょ？"
"52115-14-アヤメ" = "以前、町の近くに付喪神が現れて騒ぎになったとき、私はそこら中の古びた物に別々の印を刻んで、町の出入口に置いたの。"
"52115-15-アヤメ" = "付喪神が花鳥風月部の怪書によって生まれるのなら、その元となったものの印を確認すれば、花鳥風月部がどこを訪れたかわかる。"
"52115-16-レンゲ" = "なるほど、そんな手が……。"
"52115-17-キキョウ" = "やられっぱなしでなく、そんな奇策を思いついていたなんて……さすが、百花繚乱の委員長ですわ！"
"52115-18-キキョウ" = "じゃあ、その傘を置いた方向に向かってるの？"
"52115-19-アヤメ" = "そう、この紋様を刻んだ傘は、町の北側の出入り口に置いてたんだ。"
"52115-20-アヤメ" = "北側はこの通り見渡す限りの雪原で、隠れ家はなさそうなんだけど……。"
"52115-21-アヤメ" = "街の人いわく、半日くらい歩いた場所に、古民家があるんだって。"
"52115-22-アザミ" = "雪原の向こう……「[ruby=ひがんてい]彼岸邸[/ruby]」のことですね。"
"52115-23-レンゲ" = "……なんか、名前だけでいや～な雰囲気だな。"
"52115-24-アザミ" = "かつて、ここ一帯を治めていた名家の邸宅だったとか。#nここ数十年の間放置され、廃墟となっていますね。"
"52115-25-アザミ" = "でも、そんな場所だからこそ……。"
"52115-26-ナグサ" = "隠れ家には向いてるかもね。"
"52115-27-ナグサ" = "もしかすると、近くで目撃された百物語もそこに……。"
"52115-28" = "[s1] \"準備もなしに行って大丈夫かな？\"\n[s2] \"なにか罠があったら……。\""
"52115-29-レンゲ" = "大丈夫！思い立ったが吉日、だろ？"
"52115-30-レンゲ" = "もう逃げられるのはごめんだし！"
"52115-31-レンゲ" = "それにさ、師匠。今回は最強のアヤメ委員長もついてるんだ！"
"52115-32-ユカリ" = "ええ！無敵の百花繚乱伝説のいちぺーじを、ここに刻みますの！"
"52115-33-アザミ" = "しかし、百物語は一筋縄ではいかないはず……。"
"52115-34-キキョウ" = "そうだよ。二人とも忘れてないよね？百物語に普通の銃は通じない。"
"52115-35-キキョウ" = "怪書から生まれた「怪談」を倒せるのは、大預言者クズノハ様から資格を与えられた者だけ。"
"52115-36-キキョウ" = "こう言ってはなんだけど、いくらアヤメ委員長でも百蓮がなければ戦えない。"
"52115-37-ナグサ" = "そ、そうかな？私なんかより、アヤメの方が――"
"52115-38-キキョウ" = "そもそも……私たち抜きで、委員長はどうやって百物語を倒せると思ったの？"
"52115-39-アヤメ" = "そうだねぇ……。"
"52115-40-アヤメ" = "「怪談」には太刀打ちできなくても、怪書を操る子の方はなんとかなるかなって。"
"52115-41-キキョウ" = "「なんとか」……？百花繚乱の委員長が、策もなしに戦いを挑むの？"
"52115-42-アヤメ" = "でもさ、「身を捨ててこそ浮かぶ瀬もあれ」って言うでしょ？"
"52115-43-アヤメ" = "それに……私はナグサを信じてたから。"
"52115-44-ナグサ" = "……私を？"
"52115-45-アヤメ" = "百蓮を使いこなすナグサを見て、気がついたの。"
"52115-46-アヤメ" = "これが、大預言者クズノハに認められた継承者なんだなって。"
"52115-47-アヤメ" = "間違いなく、百花繚乱紛争調停委員会の委員長にふさわしい姿だった。"
"52115-48-ナグサ" = "そ、そんな……アヤメに比べたら、私なんて……。"
"52115-49-アヤメ" = "自分を卑下しないでよ、ナグサ。"
"52115-50-アヤメ" = "友達のそんな姿見たくないよ。"
"52115-51-ナグサ" = "ずっと頑張ってたのだって、知ってるよ？今では私を追い越して、みんなに認められてるなんて、本当に凄い……。"
"52115-52-アヤメ" = "ナグサはいつか絶対に花開くんだって思ってたから、嬉しいんだ。"
"52115-53-アヤメ" = "残念だけど、私はクズノハ様に認めてもらえなかった。#nでもナグサは……私にはない何かを持ってるんだよ。"
"52115-54-アヤメ" = "それに、約束したでしょ？#nナグサのそばに、ずっといるって。"
"52115-55-アヤメ" = "だから……私の委員長としての最後の任務に、力を貸して欲しいんだ。"
"52115-56-ナグサ" = "うん。ありがとう、アヤメ……。"
"52115-57-レンゲ" = "くーっ！これぞ青春だ……！"
"52115-58-レンゲ" = "……よーし！アタシらも負けてらんないな！この勢いで花鳥風月部をぶっ飛ばそう！"
"52115-59-ユカリ" = "身共が読んだすぽーつ漫画でも、こんな熱い展開がありましたわ！"
"52115-60-ユカリ" = "レンゲ先輩が「青春」に心躍らせるお気持ち、わかりますの！"
"52115-61-アザミ" = "はは……なんだか、いい感じにまとまっちゃいましたね。"
"52115-62-キキョウ" = "……まあ、ナグサ先輩がいいなら無理には止めないよ。"
"52115-63-キキョウ" = "……で、なんでこの子も来たの？"
"52115-64-シュロ" = "来たくて来たんじゃないですぅ！勝手に連れてきたくせにっ！"
"52115-65-アヤメ" = "子どもから目を離しちゃ危ないからね……何しでかすかもわからないし。"
"52115-66-アヤメ" = "私たちがいない隙に、また怪書で百物語を呼び出されても困るから。"
"52115-67-ユカリ" = "そりゃ大丈夫だろ。おチビの持ってた怪書「[ruby=いのうもののけろく]稲生物怪録[/ruby]」は前にぶっ壊れたし……。"
"52115-68-レンゲ" = "……待てよ？じゃあなんで、昨日も付喪神がいたんだ？"
"52115-69-ユカリ" = "……も、もしや、怪書は何冊もあるんですの！？"
"52115-70-キキョウ" = "……あり得る話だね。一冊しかないなら、こんな子に任せないでしょ？"
"52115-71-シュロ" = "はぁっ！？コクリコ様は手前をいい子だって言ってますぅ！"
"52115-72-キキョウ" = "レンゲ、ユカリ。この子を抑えてて。"
"52115-73-シュロ" = "なっ、何するつもりですかぁ！？"
"52115-74-キキョウ" = "身体検査。他の怪書を隠し持ってたら大変だからね。"
"52115-75-ナグサ" = "じゃあ足側は私がやるね。"
"52115-76-シュロ" = "は、離せぇ！[ruby=てめぇ]手前[/ruby]ら、こんなことしてただで済むと――"
"52115-77-シュロ" = "……いひっ！？ふふっ……きゃはっ！きゃはははっ！や、やめぇっ……！"
"52115-78-キキョウ" = "ここにはないか……じゃあ、こっち……？"
"52115-79-シュロ" = "や、やめてぇ……！#nほ、本当に、きゃはっ……許さないっ………いひひひっ！"
"52115-80-ユカリ" = "キキョウ先輩！ここに文庫サイズの本が！"
"52115-81-キキョウ" = "でかしたよ、ユカリ。"
"52115-82-シュロ" = "そ、それはっ！ほんとにダメですぅ……！！！"
"52115-83-レンゲ" = "へぇ～？そこまで言うんなら、大事な物なんだな。"
"52115-84-レンゲ" = "ナグサ先輩、早く見てみよう！"
"52115-85-ナグサ" = "うん、ええっと……。"
"52115-86" = "[log]題[/log]"
"52115-87" = "[log]最強の怪談家[/log]"
"52115-88" = "[log]作[/log]"
"52115-89" = "[log]朽木修羅[/log]"
"52115-90" = "[log]降り注ぐ銃弾も爆弾も、[/log]"
"52115-91" = "[log]その鋼鉄のような[ruby=ぼでぃ]肉体[/ruby]の前には無力。[/log]"
"52115-92" = "[log]最強[ruby=すとおりいてらあ]の怪談家の[/ruby]噂が、百鬼夜行に轟く。[/log]"
"52115-93" = "[log][ruby=こおり]冰[/ruby]のような眼を持つ彼女は、[/log]"
"52115-94" = "[log]今日も漆黒[ruby=だあくねす]の夜闇に[/ruby]紛れ、[/log]"
"52115-95" = "[log]人々の心を惑わせる。[/log]"
"52115-96" = "[log]逆らう者は、その代償[ruby=いのち]を血で[/ruby]払うだろお。[/log]"
"52115-97" = "[log]その指の一振りで、配下[ruby=もんすたあ]の怪異た[/ruby]ちが、[/log]"
"52115-98" = "[log][ruby=すとおりいてらあ]怪談家[/ruby]を怒らせた、哀れで[ruby=おばか]愚鈍[/ruby]な奴らに飛びかかる。[/log]"
"52115-99" = "[log]特に、生意気な[ruby=やつら]百花繚乱[/ruby]には容赦しない。[/log]"
"52115-100" = "[log]連中は、泣きながら帰っていくんだ。[/log]"
"52115-101" = "[log]それが、誰もが[/log]"
"52115-102" = "[log]怖がる究極[ruby=すとおりいてらあ]の怪談家。[/ruby][/log]"
"52115-103-アザミ" = "あー……。"
"52115-104-アザミ" = "……はい。"
"52115-105-ユカリ" = "あらぁ……。"
"52115-106" = "[s] \"えーっと……朽木修羅……さん？\""
"52115-107-キキョウ" = "……ほらユカリ、手を止めないで。"
"52115-108-シュロ" = "今、見て見ぬふりしましたよねぇ！？"
"52115-109-ナグサ" = "もしかして……自分で書いた小説、なの？"
"52115-110-レンゲ" = "なんか、変なルビが多いな。"
"52115-111-シュロ" = "う、ううううぅぅ……！"
"52115-112-シュロ" = "ば、バカにしてっ！勝手に人の荷物を漁って[ruby=ぎょっこう]、玉稿を[/ruby]公開朗読ぅ！？"
"52115-113-シュロ" = "この傑作をもし誰かがパクッて、それが当たりでもしたら――"
"52115-114-シュロ" = "手前たちは責任取れるんですかぁっ！？"
"52115-115" = "[s] \"失礼しました……。\""
"52115-116-レンゲ" = "……そ、それは大丈夫だ！"
"52115-117-レンゲ" = "この題材で書ける人は、あんまりいない……だろ！？"
"52115-118-シュロ" = "……おや？わかってるようですねぇ。#nそう、いくら題材が良くても、肝心なの[ruby=ひつりょく]は筆力―[/ruby]―"
"52115-119-シュロ" = "手前の文才に触れてみて、皆さん如何でしたかぁ？"
"52115-120-シュロ" = "感動のあまり、声も出ないようですねぇ？"
"52115-121-シュロ" = "「最強の怪談家」を書き上げた手前こと朽木修羅……。#n我ながら才能が恐ろしいですよぉ。"
"52115-122-ユカリ" = "あの……その……身共は……。"
"52115-123-ナグサ" = "……急ごう。日が暮れる前には「彼岸邸」に着いてないと。"
"52115-124-ユカリ" = "そ、そうですわ！感想はの、後ほど……！"
"52115-125-キキョウ" = "結局、他の怪書はなしか……。時間の無駄だったね。"
"52115-126-レンゲ" = "ま、まあ……なんだ……勝手に人を襲ったりしない物語でよかったよ。"
"52115-127" = "[s] \"いっぱい読んで、いっぱい書き続けるのが大事だね……！\""
"52115-128-シュロ" = "うぅ……ううううぅっ……。"
"52115-129-シュロ" = "ナ～グ～サああぁぁぁぁぁぁっ！！！"
"52115-130" = "次回;勘解由小路家の巫女"
