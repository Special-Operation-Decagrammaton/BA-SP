[translation]
"52160-1" = "第16話;造花"
"52160-2-コクリコ" = "……[ruby=すす]煤[/ruby]が、積もったねえ。"
"52160-3-コクリコ" = "これも、元は雪に染められた枝だったんやろか。"
"52160-4-コクリコ" = "ええ香り……おまえさんも飲むかえ？シュロ。"
"52160-5-シュロ" = "は、はい！コクリコ様が淹れてくださるのなら……！"
"52160-6-コクリコ" = "[ruby=せんや]先夜[/ruby]はご苦労だったねえ。"
"52160-7-コクリコ" = "アザミと手を取って、「[ruby=とうていぶっかいろく]稲亭物怪録[/ruby]」で百花繚乱を退け……その上、シャーレの先生を捕らえたときた。"
"52160-8-コクリコ" = "てっきり、いがみ合ってるんじゃないかと案じていたんやけど……ええ子やね、シュロ。"
"52160-9-シュロ" = "い、いえ、あれは向こうが勝手に……。"
"52160-10-コクリコ" = "ふむ……何かあったのかえ？"
"52160-11-シュロ" = "あっ、その……。"
"52160-12-シュロ" = "……コクリコ様のために頑張りました。"
"52160-13-コクリコ" = "物語の美しき終幕のためには、苦難がつきものさね。"
"52160-14-コクリコ" = "何があったかは知らへんけど、シャーレの先生を捕らえたのはおまえさんの功やと思うとるよ。"
"52160-15-コクリコ" = "アレは、大河を濁らせる流木のようなもの。#n絶望を希望に、悲劇を喜劇へとすり替え、物語へと介入する――"
"52160-16-コクリコ" = "風聞を怪談とする我らにとっての……いわば天敵。"
"52160-17-コクリコ" = "あの者と百花繚乱を同時に相手取ることになっていたら……#n例え怪書の力を以てしても、勝つのは難しかったやろねぇ。"
"52160-18-コクリコ" = "でも、おまえさんが生徒と引き離してくれたおかげで、捕らえることができた。#n本当に良い子やね、シュロ。"
"52160-19-シュロ" = "コクリコ様ぁ……！"
"52160-20-シュロ" = "ただ――ひとつ、分からんことがあってなぁ？"
"52160-21-コクリコ" = "先生は、常に自分の身よりも生徒を優先すると聞くからねぇ。#nでも、あの時は敵であるはずのシュロを追った……おまえさん、何か秘策でもあったのかえ？"
"52160-22-シュロ" = "そ、それは……。"
"52160-23-シュロ" = "……え？"
"52160-24-シュロ" = "……シャーレの先生？"
"52160-25-シュロ" = "なんで飛び出して……？"
"52160-26" = "\"助けにきたよ。\""
"52160-27-シュロ" = "でも……。"
"52160-28-シュロ" = "手前は……手前を殺そうとしたのに……。"
"52160-29-シュロ" = "な、なにを勘違いしてるんですかぁ！？"
"52160-30-シュロ" = "そんなことで、手前がいい子になるとでも！？"
"52160-31" = "\"危険に陥った子を助けるのに理由はいらない。\""
"52160-32" = "\"人として、当然のことだよ。\""
"52160-33-シュロ" = "……実は、手前にもよく分かっていないんです。"
"52160-34-シュロ" = "普段から奇行に走ることもあると聞きます。#nあの時も、気まぐれを起こしたのでは……？"
"52160-35-コクリコ" = "……そうさな。#n予測不可能……それが、あの者の強みであり、弱みやもしれんね。"
"52160-36-シュロ" = "あの、コクリコ様……。"
"52160-37-コクリコ" = "どうしたのかえ？"
"52160-38-シュロ" = "シャーレの先生を捕まえた時……。"
"52160-39-シュロ" = "ほら、さっさと[ruby=や]撃[/ruby]るんですよぉ！"
"52160-40-シュロ" = "え……？"
"52160-41-シュロ" = "「稲亭物怪録」から作られた付喪神は、百花繚乱ではなく手前を襲いました。"
"52160-42-シュロ" = "本来、怪書から生まれた存在は、「味方」に危害を加えないはずなのに……。"
"52160-43-コクリコ" = "……そうさな。"
"52160-44-シュロ" = "そ、そうですよね？どうして急に手前を……。"
"52160-45-コクリコ" = "怪談の種となる心が脆く儚いものなれば、#nそこから生まれるものも然り。"
"52160-46-コクリコ" = "あっけなく傾く人の心を信じられないというのに……そこから生まれ出ずる怪異を信頼できる道理があるかえ？"
"52160-47-コクリコ" = "所詮は噂が静まれば消えゆく陽炎のようなもの。#n気にしても詮無きことさね。"
"52160-48-シュロ" = "百花繚乱と一緒にいた「アヤメ」は、ナグサの心が生み出した百物語……なんですよね？"
"52160-49-シュロ" = "ナグサと共に笑い、悲しむ姿は……なんだか本物みたいで……。"
"52160-50-シュロ" = "少なくとも彼女自身は、普通の生徒と変わらないように見えました。"
"52160-51-シュロ" = "……コクリコ様。"
"52160-52-シュロ" = "怪談から生まれた百物語が、自分を生徒の一人だと信じ込むことはあるんですか？"
"52160-53-コクリコ" = "……愚問さね。"
"52160-54-コクリコ" = "我が答える意味も、必要もない問いやけど……。"
"52160-55-コクリコ" = "何故、それを聞くのかえ？"
"52160-56-シュロ" = "もしも……コクリコ様のこと以外、何の記憶も持っていない手前が――"
"52160-57-シュロ" = "噂が、静まった時……どうなって、しまうのか。#n気になって……。"
"52160-58-コクリコ" = "おや……お茶が冷めてしまったね。"
"52160-59-コクリコ" = "それで――話は終わりかえ？"
"52160-60-コクリコ" = "さて……少し、様子を見てこようかね。"
"52160-61-コクリコ" = "百花繚乱も、シャーレの先生も此処にいる。#n他に邪魔者はおらんからね。"
"52160-62-コクリコ" = "話の続きは――世が焼け落ちたその時に……それでええ？#nシュロ。"
"52160-63-シュロ" = "……はい。"
"52160-64" = "次回;委員長の帰還"
