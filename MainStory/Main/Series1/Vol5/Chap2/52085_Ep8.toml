[translation]
"52085-1-ナグサ" = "はぁ、はぁ……。"
"52085-2-ナグサ" = "……まだまだ！"
"52085-3-シュロ" = "しっつこいなぁ……ナグサちゃんのくせに。"
"52085-4-シュロ" = "さっさと切り上げるつもりだったんですけどぉ――"
"52085-5-キキョウ" = "ナグサ先輩！"
"52085-6-レンゲ" = "……って、なんだよこれ！"
"52085-7-ユカリ" = "先輩！大丈夫ですの！？"
"52085-8" = "[ns] \"ナグサ、無事！？\""
"52085-9-ナグサ" = "私は大丈夫、それより花鳥風月部の怪談家が……。"
"52085-10-シュロ" = "くそっ、もう嗅ぎつけましたか。"
"52085-11-ユカリ" = "あの子……。"
"52085-12-レンゲ" = "あの時の生意気チビだ！"
"52085-13-シュロ" = "誰が生意気チビですってぇ！？ "
"52085-14-シュロ" = "くっそぉ……あと少しなのに……！"
"52085-15-シュロ" = "……しょうがないですねぇ。#nでも、手前さん方がこの地に足を踏み入れたからには、#n物語を再開する機会はまだあるはず。"
"52085-16-シュロ" = "それではそれでは、今日はこの辺りでお暇させていただきますぅ。"
"52085-17-レンゲ" = "逃がすかっ！"
"52085-18-キキョウ" = "レンゲ、ユカリ。今度こそ捕まえるよ！"
"52085-19-ユカリ" = "なんてすばしっこいんですの！"
"52085-20-レンゲ" = "くっそー、イタチかあいつは……！"
"52085-21-シュロ" = "ふふん♪#nそぉんな動きじゃ、何年かかっても手前を捕まえられませんよぉ～？"
"52085-22-シュロ" = "それではぁ、次にお会いする日ま――"
"52085-23-シュロ" = "えっ……？"
"52085-24-シュロ" = "うぎゃあああっ！"
"52085-25-？？？" = "……いいタイミングだったみたいだね。"
"52085-26-？？？" = "みんな、ケガは？"
"52085-27-ナグサ" = "うそ……。"
"52085-28-キキョウ" = "この声……。"
"52085-29-？？？" = "久しぶりだね、ナグサ。"
"52085-30-アヤメ" = "それにみんなも。会えて嬉しいよ。"
"52085-31-ナグサ" = "……アヤメっ！"
"52085-32" = "次回;百花繚乱の委員長"
