[translation]
"52195-1-シュロ" = "もう半日も歩いているのに……。"
"52195-2-シュロ" = "雪と岩しかないじゃないですかぁ！本当にこっちなんですぅ！？"
"52195-3-ナグサ" = "……合ってるよ。"
"52195-4-ナグサ" = "あの時よりも雪が深いけど、この切り株も、寺院に続く道も……覚えてる。"
"52195-5-ナグサ" = "ここが、黄昏の寺院だよ。"
"52195-6-レンゲ" = "着いたのか？"
"52195-7-レンゲ" = "先輩、でもここは……人がいるようには……。"
"52195-8-キキョウ" = "……もうずっと前から朽ち果ててるように見えるけど。"
"52195-9-シュロ" = "ははっ……アハハハッ！"
"52195-10-シュロ" = "ナグサちゃん、一体なんのつもりですかぁ？"
"52195-11-シュロ" = "こんな廃墟に手前を連れてきて……。"
"52195-12-シュロ" = "のこのこくっついてくる手前を見て、面白がっていたんですかぁ？"
"52195-13-シュロ" = "それとも……ここで戦えば、勝算があるとでも？"
"52195-14-シュロ" = "本当に……ほんっとうにガッカリですぅ！"
"52195-15-シュロ" = "どんな小細工を考えてたのかは知りませんが、全部ぜぇんぶ、無駄ですよぉ？"
"52195-16-シュロ" = "[ruby=てめぇ]手前[/ruby]らはここで、永遠の眠りにつくんですからねぇ……！"
"52195-17-キキョウ" = "ついに本性を出したね……！"
"52195-18-レンゲ" = "大人しくやられるかよ！"
"52195-19-ナグサ" = "いや、ここだよ。嘘なんて吐いてない。"
"52195-20-ナグサ" = "私はここでクズノハと名乗る少女から先生宛ての手紙を受け取った。"
"52195-21-ナグサ" = "以前ここに来た時は桜が満開で――美しい道が続いていた。"
"52195-22-シュロ" = "そんなバカな話――"
"52195-23-ナグサ" = "彼女の言葉を借りるなら、黄昏は現実の全てが意味を失う場所。"
"52195-24-ナグサ" = "あの中は、春の桜と秋の彼岸花が同時に咲いている世界。#n[ruby=むかし]過去[/ruby]と[ruby=いま]現在[/ruby]が交わっていたとしても、不思議じゃない。"
"52195-25-ナグサ" = "おぼろげな夕闇が、空に染み渡るとき――"
"52195-26-ナグサ" = "沈む陽と夜闇の[ruby=はざま]間[/ruby]で言葉を交わす――"
"52195-27-ナグサ" = "其の名は――"
"52195-28-？？？" = "百花繚乱紛争調停委員会――初代委員長クズノハ。"
"52195-29-レンゲ" = "あれ？さっきまでボロボロの廃墟だったのに……。"
"52195-30-ユカリ" = "桜の花が、咲いておりますの……。"
"52195-31-？？？" = "やけに騒がしいと思うたら、客人かの……？#n招かれざる客でないと良いのじゃが。"
"52195-32-？？？" = "かの名は――"
"52195-33-ナグサ" = "……百花繚乱紛争調停委員会、委員長代理の御稜ナグサ。"
"52195-34-ナグサ" = "あなたの希望通り、シャーレの先生を連れてきたよ。"
"52195-35-クズノハ" = "ふふ……また会えるとはのう、かわいい後輩や。"
"52195-36" = "次回;本当の姿"
