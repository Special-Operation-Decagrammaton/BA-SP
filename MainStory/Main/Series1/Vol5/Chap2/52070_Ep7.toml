[translation]
"52070-1" = "第7話;雪国"
"52070-2" = "エビス分校付近の小さな駅"
"52070-3-レンゲ" = "うう……さぶっ！大して離れてないのに、こんな冷えるのか！？"
"52070-4-キキョウ" = "……だから着込めって言ったでしょ。"
"52070-5-キキョウ" = "北側からの寒気が、この地域の山脈にぶつかって雪を降らせてるの。#nこの北部自治区は「山を境に季節が変わる」って言われてるくらいだよ。"
"52070-6-キキョウ" = "とある本では、国境の長いトンネルを抜けると――"
"52070-7-ユカリ" = "雪国ですわーっ！"
"52070-8-ユカリ" = "こんな美しい景色、初めて見ましたの！"
"52070-9-ユカリ" = "先生先生！ほら、あそこですの！#n愛らしいイタチが元気に雪の中を走り回って……！"
"52070-10-キキョウ" = "……鼻水出てる。ほら、ハンカチ。"
"52070-11-ユカリ" = "ふ、不覚でひゅの！ありがとうございますの！"
"52070-12-ナグサ" = "……綺麗な町だね。#n大雪原の近くに、こんなところがあったなんて。"
"52070-13" = "[s] \"前来た時は、ここを通らなかったの？\""
"52070-14-ナグサ" = "あの時はアヤメを探すことに必死で、ひたすら北を目指してたから。"
"52070-15-ナグサ" = "……駅を経由した方が、早く着いてたかな。"
"52070-16" = "[s1] \"雪山を徒歩で越えるなんて……すごい。\"\n[s2] \"でも、危ないからもうやめようね。\""
"52070-17-ナグサ" = "うん、気をつける。"
"52070-18-レンゲ" = "で、幻魎百物語はどこにいるんだよ？日暮れまで待つのか？"
"52070-19-キキョウ" = "たしか、ニヤ部長はエビス分校から迎えが来るって言ってたよね。"
"52070-20-キキョウ" = "こっちは時間通りに着いたし、そろそろ……。"
"52070-21-？？？" = "百花繚乱紛争調停委員会の皆さん、ですか？"
"52070-22-？？？" = "初めまして、お待ちしていました。"
"52070-23-ナグサ" = "あなたがエビス分校の……？"
"52070-24-アザミ" = "ええ。#nエビス分校の自治委員会会長――[ruby=はぶ]土生[/ruby]アザミと申します。"
"52070-25-アザミ" = "会長といっても、他の生徒は皆、出ていってしまったのですが。"
"52070-26-レンゲ" = "大変そうだな……。"
"52070-27-ユカリ" = "たったひとりで学園を守り続けていらっしゃるだなんて、#nすごいですわ！"
"52070-28-アザミ" = "ふふっ、恐縮です。"
"52070-29-アザミ" = "とはいえ、こんな僻地に仕事と呼べるほどのこともありませんから。#n時間を持て余しているくらいですよ。"
"52070-30-アザミ" = "おや、あなたがシャーレの[USERNAME]先生ですね？"
"52070-31-アザミ" = "ニヤ部長から伺っております。#n数えきれないほどの功績をお持ちの方だと。"
"52070-32" = "[s] \"大したことはしてないよ。\""
"52070-33-アザミ" = "そうなのですか？#n想像を絶するような胆力をお持ちだと伺っておりますが……。"
"52070-34-アザミ" = "たしか、一糸まとわぬ姿で野原を疾走したとか――"
"52070-35" = "[s3] \"すごいってそっち！？\"\n[s4] \"そ、それには理由が……。\""
"52070-36-アザミ" = "ふふ、ご謙遜なさらずに。"
"52070-37-アザミ" = "大火災を収束させ、百花繚乱をまとめ――百物語を討伐した。#nその噂は、山を越えてこちらにも伝わっています。"
"52070-38-アザミ" = "[USERNAME]先生と百花繚乱の皆さんの手にかかれば、#nこの辺りの怪談も一掃できそうですね。"
"52070-39-ナグサ" = "その怪異……姿を変えて人を襲う幻魎百物語は――"
"52070-40-ナグサ" = "どこに行けば会えるの？"
"52070-41-アザミ" = "そうですね……あちこちで目撃されているのですが……。"
"52070-42-アザミ" = "いずれにしても、日が暮れるまでは出てこないかと。#nそれまでは、目撃情報があった場所を見て回るのはいかがでしょう？"
"52070-43-アザミ" = "自治区の紹介も兼ねて、私がご案内いたします。"
"52070-44-レンゲ" = "そうだな……アタシたちは土地勘もないし。頼んだよ。"
"52070-45-ユカリ" = "新しい冒険みたいで、身共、うきうきしてきましたの！"
"52070-46-キキョウ" = "まぁ……これも、任務か。"
"52070-47" = "[ns] \"よろしくね、アザミ。\""
"52070-48-アザミ" = "はい。ではこちらへ――"
"52070-49" = "エビス分校近くの商店街"
"52070-50-アザミ" = "ここは北部自治区の住民が利用する商店街です。"
"52070-51-アザミ" = "百鬼夜行の商店街には及びませんが、商会や宿泊施設もありますよ。"
"52070-52-ユカリ" = "あら？こちらのお花の彫刻はガラス製ですの？#nきらきらして、まるで宝石みたい……！"
"52070-53-アザミ" = "こちらのガラス細工は、特産品の一つでして。"
"52070-54-アザミ" = "長年ガラス細工に携わってきた職人たちが、一つ一つ手掛けております。"
"52070-55-アザミ" = "実は……最初に百物語と遭遇したのが、そのガラス職人の方でして。#n明け方に工房へ出向いた時にかち合ったとか。"
"52070-56-ナグサ" = "そのとき、百物語はどんな姿をしていたの？"
"52070-57-アザミ" = "聞くところによれば、白いイタチのような姿だったとかで……。"
"52070-58-レンゲ" = "……イタチ？全然怖くなくないか？"
"52070-59-アザミ" = "それは……。"
"52070-60-アザミ" = "ああ、ちょうどいらっしゃいました。"
"52070-61-アザミ" = "おはようございます。"
"52070-62-ガラス職人" = "……んん？どちらさんかな？"
"52070-63-アザミ" = "エビス分校の自治委員会会長、土生アザミです。#nもう、お忘れですか？"
"52070-64-ガラス職人" = "あそこにまだ生徒さんがいたのかい？#nここんとこ、物覚えが悪くなってねぇ。"
"52070-65-アザミ" = "もう、昨日もお会いしましたのに。"
"52070-66-アザミ" = "2週間ほど前、#n工房付近で目撃したという怪異についてお聞きしたいのですが……。"
"52070-67-ガラス職人" = "怪異……？ああ！あの白いイタチかい？"
"52070-68-ガラス職人" = "もちろん覚えてるとも！そりゃあ凶暴なやつだった。"
"52070-69-ガラス職人" = "小さい頃、山でイタチに噛まれたのを思い出したよ……#n本当に、あいつは恐ろしいんだ。"
"52070-70-ガラス職人" = "明け方頃、工房に入ろうとしたら……「アイツ」が目に入ってな。#nビックリして瓶を落としちまったよ。"
"52070-71-ガラス職人" = "床にガラスが飛び散ったんだが……#nそれでもアイツは、平気な顔で破片の上を歩いてた。"
"52070-72-ガラス職人" = "そこで気付いたんだ。こいつは、本物のイタチじゃないってな。"
"52070-73-キキョウ" = "……子どもの頃に怖がっていたイタチ。"
"52070-74-レンゲ" = "そういうことか……。"
"52070-75-ユカリ" = "そんな……大事なガラス瓶が割れてしまうなんて。"
"52070-76-ユカリ" = "ここに並ぶ品々を見ただけで、こだわりが伝わってきますのに……。"
"52070-77-ガラス職人" = "ああ、それなら気にしないでくれ！#nあの時に割れたのはただの牛乳瓶さ。"
"52070-78-ガラス職人" = "……にしてもこいつの価値に気づくとは、お嬢さん見る目あるね！"
"52070-79-ガラス職人" = "中に他のもあるぞ。見てみるかい？"
"52070-80-ユカリ" = "ええ、喜んで！"
"52070-81" = "エビス分校付近の農地"
"52070-82-アザミ" = "ここはエビス自治区の農地になります。"
"52070-83-アザミ" = "百鬼夜行のお祭りに使われるトウモロコシやジャガイモ、#nニンジンなどは、ここら一帯の畑で採れたものなんですよ。"
"52070-84-アザミ" = "百鬼夜行で食べるエビス産の野菜も美味しいとは思いますが……#n作物は収穫したそばから糖度が落ちていくもの。#nやはり一番は採れたてです。"
"52070-85-アザミ" = "と、いうことで……#nこちらに今しがた収穫したトウモロコシがございます。#nいかがですか？"
"52070-86-レンゲ" = "じゃあ、せっかくだし……。"
"52070-87-レンゲ" = "……あ、甘い！砂糖でもかかってるみたいだ！"
"52070-88-ユカリ" = "トウモロコシの風味が全開で、とっても美味しいですの！"
"52070-89-アザミ" = "ふふっ、この味を皆さんにお届けできて、私も嬉しいです。"
"52070-90-ナグサ" = "……ここにも百物語が出没したの？"
"52070-91-アザミ" = "ええ。#nこちらのお方が大きなクマの姿をしたものと遭遇したそうで……。"
"52070-92-農家" = "ああ、俺はこの目で見た！"
"52070-93-農家" = "先週末のことだ……畑仕事中に気配を感じて振り向いたら、#nクマがじっとこっちを見てて……。"
"52070-94-農家" = "また畑を荒らしに来たのかと思って猟銃をぶっぱなしたんだが、#nそいつはびくともしねえ！"
"52070-95-農家" = "……おかげで、本物のクマじゃないって気づいたんだけどな。"
"52070-96-レンゲ" = "野生のクマでも、猟銃で仕留めきれないヤツはいるんじゃない？"
"52070-97-レンゲ" = "このあたりじゃ、珍しくないのか？"
"52070-98-農家" = "今年は日照り続きでどんぐりや栗が少ないからな。#n冬眠し損ねたやつが、作物を狙って下りてくるんだ。"
"52070-99-農家" = "なんたって……#nうちのジャガイモは、サツマイモ顔負けの甘さだからな！"
"52070-100-農家" = "焚き火で焼き芋をしたら、#n熊も怪異も匂いに釣られて出てくるってもんよ！"
"52070-101-農家" = "せっかくだ。おやつに持ってきたんだが、お嬢ちゃん達もどうだい？"
"52070-102-ユカリ" = "ええ、いただきますわ！"
"52070-103-レンゲ" = "うおお……一口食べるたびに濃厚な甘さが広がる……#nこれ、ほんとにジャガイモなのか！？"
"52070-104-ユカリ" = "もっちりした食感も相まって……これはもう天然のすいーつですの！"
"52070-105-農家" = "はっはっは。そんなに喜んでくれると気持ちがいいな！"
"52070-106-農家" = "ちょっと待ってろ、まだあるからな！"
"52070-107-ナグサ" = "ここは……。"
"52070-108-アザミ" = "船着場です。ここから海産物をキヴォトス各地に出荷しております。"
"52070-109-アザミ" = "近海で獲れるさまざまな海産物も、#nエビス自治区の特産品の一つですからね。"
"52070-110-アザミ" = "お祭りの屋台で一番人気のイカ焼き。#nきっと、ここのイカを使っているはずですよ。"
"52070-111-キキョウ" = "……ここでも百物語が目撃されたの？"
"52070-112-アザミ" = "はい。朝の仕事を終えた漁師の方が、巨大なタカアシガニを……。"
"52070-113-キキョウ" = "……タカアシガニ？"
"52070-114-キキョウ" = "漁師なのに、カニを怖がるの？"
"52070-115-アザミ" = "私もそう思ったのですが、クモに似ていると言われまして……。"
"52070-116-アザミ" = "虫が嫌いな方は、だめかもしれませんね。"
"52070-117-ユカリ" = "今回は目撃者の方とお会いできないのですか？"
"52070-118-アザミ" = "残念ながら、今は漁に出ている時間なので……。"
"52070-119-レンゲ" = "じゃあしょうがないな。#nあんまりゆっくりもできないし、次の場所に――"
"52070-120-アザミ" = "ですが……#n実はこの近くに、すごく美味しい焼き魚を出すお店があるんです。"
"52070-121-アザミ" = "もうすぐお昼時ですし、この辺りでお食事でもいかがでしょう？"
"52070-122-キキョウ" = "……焼き魚？"
"52070-123-アザミ" = "ええ。エビスの伝統的な調理法がありまして――"
"52070-124-アザミ" = "皮がパリッとなるまで焼いた後、溶いた味噌をかけてホイル蒸しにするんです！"
"52070-125-アザミ" = "今が旬のホッケなんかは、肉厚の皮に味噌が絡みついて……#n本当に絶品なんですよ！"
"52070-126-キキョウ" = "……。"
"52070-127-アザミ" = "ですが、時間がないのでしたら致し方ありません。#n分校の方で軽くおにぎりなど――"
"52070-128-キキョウ" = "ずっと歩きづめだったし、この辺で休憩したほうが良いんじゃないかな。"
"52070-129-キキョウ" = "補給は兵法の基本だよ。そろそろお昼に――"
"52070-130-レンゲ" = "ん？そんな歩いてないだろ？"
"52070-131-キキョウ" = "私は疲れたの。"
"52070-132-キキョウ" = "……とにかく。少し休憩するのはどうかな。"
"52070-133-ユカリ" = "身共は賛成ですわ！"
"52070-134-レンゲ" = "なーんか釈然としないけど……まぁいいや。#nんじゃ、腹ごしらえしよっか！"
"52070-135" = "（その後もエビス分校の近くで聞き込みを続けたけれど、#nこれといった情報はつかめず……）"
"52070-136" = "（……気づけば日が暮れていた）"
"52070-137-ナグサ" = "……暗くなってきたね。"
"52070-138-ナグサ" = "百物語は、日が暮れてから出るっていってたよね。#n本格的な調査はこれから――"
"52070-139-アザミ" = "いえいえ。お客様に、そんなご無理はさせられません。"
"52070-140-アザミ" = "遠路はるばるいらっしゃって、お疲れでしょう。#nよろしければ、寮の部屋を好きに使ってください。#n他に生徒はいないので、数は足りると思います。"
"52070-141-ナグサ" = "いや、まだそんなには……。"
"52070-142-アザミ" = "そうだ、寮には温泉もありますよ？"
"52070-143-アザミ" = "それはそれは風流で立派な温泉なのですが……#nもし、よろしければ……。"
"52070-144-レンゲ" = "温泉！？"
"52070-145-ユカリ" = "寮に温泉があるんですの！？"
"52070-146-アザミ" = "ええ。昔は大浴場として全校生徒で使っていたようですが……#n今は私専用になってしまっていたので。"
"52070-147-アザミ" = "どうぞ旅の疲れを癒やしていってください。#nその間に、お食事の用意をしてまいりますので。"
"52070-148-レンゲ" = "くぅ～！委員会のみんなで温泉！#nこれって青春の1ページじゃん！夜は枕投げか！？"
"52070-149-レンゲ" = "みんな、早く行くよっ！"
"52070-150-キキョウ" = "はぁ……。#n水を差すようで悪いけど、あくまでこれは任務。"
"52070-151-キキョウ" = "私は部屋にいるから、入るならあんた達だけで行ってきて。"
"52070-152-レンゲ" = "え～？ノリ悪いなぁ。"
"52070-153-ユカリ" = "ぜひキキョウ先輩も一緒に参りましょう！#n身共は、先輩方と湯浴みをするのが夢だったのです！"
"52070-154-キキョウ" = "そんなこと言われても……。"
"52070-155-ユカリ" = "これからは歯磨きも忘れませんし、アイスも一日一個にしますから！"
"52070-156-キキョウ" = "それは元々約束してたでしょ？"
"52070-157-ユカリ" = "キ～キョ～ウ～せ～ん～ぱ～い～！"
"52070-158-キキョウ" = "……1時間だけね。"
"52070-159-レンゲ" = "よし、話はまとまったな？#nんじゃ、いざ温泉へ！"
"52070-160-ユカリ" = "身共、お風呂上がりにふる～つ牛乳が飲みたいですの！"
"52070-161-アザミ" = "お着替えをご用意しましょうか？"
"52070-162-ナグサ" = "あ……うん、お願い。"
"52070-163-ナグサ" = "先生はまだ休まないの？"
"52070-164" = "[s5] \"うん、ちょっと考え事があってね。\"\n[s6] \"私のことは気にしないで。\""
"52070-165-ナグサ" = "そっか。じゃあお先に。"
"52070-166-レンゲ" = "はぁぁぁ……極楽極楽ぅ。"
"52070-167-レンゲ" = "体はポカポカなのに、風が冷たくて気持ちいい～……。"
"52070-168-ユカリ" = "なんて美しい雪景色！ろまんちっくですの～！"
"52070-169-ユカリ" = "それに、こんな大きなお風呂に入るのも初めてですし……#n来られてよかったですの！"
"52070-170-キキョウ" = "……。"
"52070-171-レンゲ" = "キキョウ、なにモタモタしてんだ？"
"52070-172-レンゲ" = "もしかして……入るのが怖いのか？"
"52070-173-キキョウ" = "なっ！？百花繚乱の参謀が水を怖がるわけ――！"
"52070-174-キキョウ" = "……か、勘違いしないで。私はお風呂の入り方を守っているだけ。"
"52070-175-キキョウ" = "足先から少しずつお湯をかけて慣らしていかないと。#nヒートショックが怖いからね。"
"52070-176-レンゲ" = "寒い中飛び込むのも楽しいぞ？"
"52070-177-レンゲ" = "ナグサ先輩もそう思わないか？"
"52070-178-ナグサ" = "……うん。#nお風呂、温かくて気持ちいいね。"
"52070-179-ナグサ" = "なんだか、一日の疲れが流れていくみたい。"
"52070-180-キキョウ" = "……今日は観光してただけな気がするけど。"
"52070-181-レンゲ" = "だなぁー。#n……なんだかんだで、どっかの誰かさんが一番楽しんでたけど。"
"52070-182-キキョウ" = "何か言った？"
"52070-183-ユカリ" = "身共も、今日は本当に楽しかったですわ！"
"52070-184-ユカリ" = "美しい景色に、住民の皆さまとお話するひととき……#nそれに、トウモロコシもジャガイモも焼き魚も、#nとーってもおいしゅうございました！"
"52070-185-ユカリ" = "ただ……。"
"52070-186-ユカリ" = "ナグサ先輩のお顔が、なんだか暗いように見えて……。"
"52070-187-ナグサ" = "……そう？"
"52070-188-キキョウ" = "うん。エビス分校に着いてから、ずっと険しい顔してたよ。"
"52070-189-キキョウ" = "大雪原に行った日のことでも思い出してた？"
"52070-190-レンゲ" = "それか、百物語の気配を感じたり――"
"52070-191-ナグサ" = "そんなんじゃないよ。百物語の気配はしなかった。"
"52070-192-ナグサ" = "ただ……。"
"52070-193-ナグサ" = "相手の恐怖を形にする怪異は、#n私の前でどんな姿を見せるんだろうって思ったの。"
