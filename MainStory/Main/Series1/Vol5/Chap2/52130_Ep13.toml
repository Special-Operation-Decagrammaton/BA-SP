[translation]
"52130-1" = "第13話;蛇の口中"
"52130-2-キキョウ" = "やられた……！"
"52130-3-キキョウ" = "ユカリはどこ？"
"52130-4-レンゲ" = "書斎の方だろ。"
"52130-5-レンゲ" = "……どうしたんだ？"
"52130-6-キキョウ" = "罠だよ。早くユカリの――"
"52130-7-キキョウ" = "いや……[USERNAME]先生のところに行かないと！"
"52130-8-レンゲ" = "師匠の？どうしたんだよ……。"
"52130-9-レンゲ" = "こいつら、前に見た化け物か！"
"52130-10-レンゲ" = "どこに隠れてたんだよ……！"
"52130-11-キキョウ" = "レンゲ、対処法は覚えてるね？"
"52130-12-キキョウ" = "普通の銃弾は効かないけど、物理法則には逆らえない。床を狙って。"
"52130-13-レンゲ" = "まかせろ！"
