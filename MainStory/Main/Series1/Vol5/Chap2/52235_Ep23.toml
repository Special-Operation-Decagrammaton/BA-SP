[translation]
"52235-1-ニヤ" = "……考え事ですか？ニヤ部長。"
"52235-2-ニヤ" = "あら、初めまして……ですよね？"
"52235-3-ニヤ" = "あなたが今回の主犯の怪談家さんですか？#nそれとも、誰かさんの影……？"
"52235-4-アザミ" = "あんなおバカと一緒にされるのは、少々不愉快ですね。"
"52235-5-ニヤ" = "うふふっ、事前連絡なくいらっしゃるところ、シュロさんにそっくりだったもので。"
"52235-6-ニヤ" = "気に障られましたかね？ご容赦くださいな。"
"52235-7-アザミ" = "……そんな安っぽい挑発じゃ何も変わりませんよ。"
"52235-8-アザミ" = "お祭りを強行したとしても、この局面は覆らない。それと同じです。"
"52235-9-ニヤ" = "ほぉ……。"
"52235-10-アザミ" = "おっと、ご挨拶が遅れましたね。"
"52235-11-アザミ" = "私の名は[ruby=はぶ]土生[/ruby]アザミ。"
"52235-12-アザミ" = "お察しの通り、今宵の物語の担い手にして、花鳥風月部の[ruby=かいげいか]怪芸家[/ruby]――コクリコ様の腹心でございます。"
"52235-13-ニヤ" = "怪談を生み出す書、「[ruby=いのうもののけろく]稲生物怪録[/ruby]」は前回壊したはずですが……。"
"52235-14-ニヤ" = "それに、どんな面白い逸話だって、何度も聞けば飽きてしまうもの……懲りないですねぇ。"
"52235-15-アザミ" = "あのような駄作と並べて語られるのは心外です。"
"52235-16-アザミ" = "私の怪書「稲亭物怪録」は、恐怖から生まれしもの。"
"52235-17-アザミ" = "「稲生物怪録」が必要とする[ruby=・]欲[/ruby][ruby=・]望[/ruby]とは違う。「稲亭物怪録」の恐怖は、より鮮やかに怯える者の心を浮かび上がらせるのですから。"
"52235-18-アザミ" = "自分の欲望を知らない者はいても、恐怖を感じぬ者などいません。"
"52235-19-アザミ" = "ウジ虫から巨大な猛獣……見慣れた悪友や、自分を罵る他人……。"
"52235-20-アザミ" = "心の中に潜む恐怖は十人十色。#nひとところに集まれば、美しい虹がかかることでしょう。"
"52235-21-アザミ" = "どれだけ足掻こうが、永遠にこの恐怖から抜け出すことはできません。"
"52235-22-アザミ" = "ヒトツメに視線を向けられている限り、あなたたちは「稲亭物怪録」の恐怖を生む土台なのですよ。"
"52235-23-ニヤ" = "にゃは……自分に酔ってる方の話って、長いし退屈なんですよねぇ。"
"52235-24-アザミ" = "ではもう一度聞きますよ、ニヤ部長。"
"52235-25-アザミ" = "足掻いてこの状況が好転すると、本気でお考えなのですか？"
"52235-26-ニヤ" = "いいえ？"
"52235-27-ニヤ" = "己の非力さを痛感してる真っ最中でして。"
"52235-28-アザミ" = "じゃあ何故、わざわざお祭りの決行を？"
"52235-29-アザミ" = "焼け石に水では？"
"52235-30-ニヤ" = "……アザミさんでしたっけ。こちらからも一つ聞いていいですか？"
"52235-31-ニヤ" = "過去の戦乱の時代から、いまに至るまで。"
"52235-32-ニヤ" = "百鬼夜行の各所で人々を惑わし、怪談のきっかけとなった怪異が――#nなぜ学園の統合後は郊外にしか現れなくなったのか……わかります？"
"52235-33-アザミ" = "[ruby=あなたたち]陰陽部[/ruby]のような連中が、何かしたのでしょう？"
"52235-34-ニヤ" = "にゃはは、まっさかぁ。"
"52235-35-ニヤ" = "そんな業務までやってたら、陰陽部の部長なんてとっくにやめてます。"
"52235-36-ニヤ" = "答えは……どんな時にも執り行われる、百鬼夜行のお祭りですよ。"
"52235-37-アザミ" = "……お祭り？"
"52235-38-ニヤ" = "ええ。大勢で盛り上がる、派手なやつです。"
"52235-39-ニヤ" = "これまで不思議に思いませんでしたか？"
"52235-40-ニヤ" = "なぜ、一介の部活に過ぎない「お祭り運営委員会」が学園行事を決定し、自治区の資金の流れまでも把握しているのか。"
"52235-41-ニヤ" = "これは単なる私の怠慢によるものじゃあないんですよ。#n古来、クズノハの時代より定められていることなんです。"
"52235-42-ニヤ" = "当初、お祭りは安らかな生活を願う祭事から始まったとされています。"
"52235-43-ニヤ" = "お供え物をし、現在の苦難を天に告げて、安らかな未来を願う……。"
"52235-44-ニヤ" = "要は、これから行うのはただのお祭りじゃありません。"
"52235-45-ニヤ" = "……苦難を祓う「祭儀」なのです。"
"52235-46-アザミ" = "わけのわからぬことを……。"
"52235-47-アザミ" = "ヒトツメが……薄れていく？"
"52235-48-アザミ" = "一体何を……！"
"52235-49-ニヤ" = "なーんにも特別なことはしてませんよ。"
"52235-50-ニヤ" = "[ruby=・]こ[/ruby][ruby=・]れ[/ruby][ruby=・]ま[/ruby][ruby=・]で[/ruby][ruby=・]通[/ruby][ruby=・]り[/ruby]調和のとれた日々を過ごせるよう力をお貸しするのが、我々陰陽部の仕事ですから。"
"52235-51-ニヤ" = "――陰に傾いたときは、陽の力で調和をもたらす。#n至って普通な、[ruby=おんみょう]陰陽[/ruby]の理です。"
"52235-52-百鬼夜行の住民A" = "こ、ここにも目が！"
"52235-53-百鬼夜行の住民A" = "そこかしこに目がある……ずっとこっちを見てるよ……！"
"52235-54-百鬼夜行の住民B" = "も、もうダメだ……逃げても無駄なんだ……。"
"52235-55-百鬼夜行の住民A" = "百花繚乱もいない……みんなあの怪物に、食われちまうんだ！"
"52235-56-百鬼夜行の住民B" = "……あれ？どっかから歌が聞こえないか？"
"52235-57-百鬼夜行の住民A" = "こんな状況で……？空耳じゃない？"
"52235-58-百鬼夜行の住民B" = "いや……間違いない、歌だよ。#nそれにこの声、どこかで……。"
"52235-59-カホ" = "みなさん！和楽まつりは予定通り開催いたします！#nどうぞ舞台の前にお集まりください！"
"52235-60-カホ" = "チセちゃんの未発表曲を最前列で聴ける、千載一遇のチャンスです！"
"52235-61-カホ" = "秘蔵のチセちゃんアクスタ、チセにゃんぬいぐるみなどなど……限定グッズもこの機会に大放出！"
"52235-62-ウミカ" = "観賞のお供に、さくらソーダはいかがでしょうか～！"
"52235-63-百鬼夜行の住民A" = "誰だ？こんなときにライブだなんて……。"
"52235-64-百鬼夜行の住民B" = "ご存知ないんですか！？#n百鬼夜行随一のアイドルであり、今回のお祭りの主役「和楽姫のチセちゃん」ですよ！"
"52235-65-百鬼夜行の住民A" = "まさか決行するだなんて……もうチセ様の歌声は聞けないとばっかり……。"
"52235-66-百鬼夜行の住民B" = "どけ！私はチセ様のライブを観に行くんだ！"
"52235-67-百鬼夜行の住民A" = "そこら中にお化けがいるのに！？"
"52235-68-百鬼夜行の住民B" = "どうせおしまいなら、最期にチセ様のスペシャルライブが観たい！"
"52235-69" = "みんな掴まって～"
"52235-70" = "さあ、黄昏の向こう側へ～"
"52235-71-アザミ" = "……なるほど。考えあってのことでしたか。"
"52235-72-アザミ" = "恐怖の色を、お祭り騒ぎで拭い去る……。#nたしかに、これなら「稲亭物怪録」の恐怖を中和できることでしょう。"
"52235-73-アザミ" = "でも……永遠に続くお祭りなんてありませんよね？"
"52235-74-アザミ" = "祭りはいずれ幕を下ろすもの。#nそのときは、再び恐怖がこの学園を覆います。"
"52235-75-アザミ" = "奇策のつもりでしょうが、結局はその場しのぎでしかない。"
"52235-76-ニヤ" = "どうでしょう？今はご自身の心配をされては？"
"52235-77-ニヤ" = "天守閣に白い花火も打ち上げられたことですし……。"
"52235-78-アザミ" = "あんな[ruby=もの]花火[/ruby]、いくら打ち上げたところで……。"
"52235-79-ニヤ" = "あら、ご存じなかったとは。ではこの機会にお教えしましょう。"
"52235-80-ニヤ" = "無線技術が発達する前は――花火は救助者の位置を知らせる信号として使われていたんですよ。"
"52235-81-アザミ" = "貴様、まさか――"
"52235-82-？？？" = "これが百花繚乱式射撃術――"
"52235-83-？？？" = "青春の花火だぁっ！！"
"52235-84" = "次回;鬼哭は獅子の遠吠えに"
