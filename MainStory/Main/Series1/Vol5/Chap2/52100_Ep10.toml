[translation]
"52100-1" = "第10話;不完全な記憶"
"52100-2-シュロ" = "ナグサちゃんのくせに……！"
"52100-3-シュロ" = "ナグサちゃんごときに、二回もやられた！！"
"52100-4-シュロ" = "あの時シャーレが……いや、アヤメさえいなければ……！"
"52100-5-シュロ" = "ううぅぅ……。"
"52100-6-シュロ" = "くやしいぃ～～～！！"
"52100-7-シュロ" = "というか、なんであいつがいたんです？アヤメはあの時、黄昏に……。"
"52100-8-シュロ" = "アヤメのふりをした誰か？それとも、手前の知らない何かが起きてるんです……？"
"52100-9-シュロ" = "……なんだっていいですけど！汚い手を使ったに決まってます！"
"52100-10-シュロ" = "せっかくの計画が、あんなあっけなく終わるわけないんですから――"
"52100-11-アヤメ" = "可愛い顔が台無しだよ、おチビさん。"
"52100-12-シュロ" = "……アヤメ！？"
"52100-13-アヤメ" = "ん？どこかで会ったっけ？"
"52100-14-アヤメ" = "ああ、そうか……。"
"52100-15-アヤメ" = "北部自治区にも私のファンがいたんだ！困っちゃうな～もう！"
"52100-16-シュロ" = "だーれが[ruby=てめぇ]手前[/ruby]のファンですかっ！？"
"52100-17-シュロ" = "怪書さえあれば、手前みたいな偽物――"
"52100-18-アヤメ" = "……話は終わり？"
"52100-19-シュロ" = "ぐっ……くそおぉぉ！！"
"52100-20-キキョウ" = "で、アヤメ委員長……見せたいものって？"
"52100-21-キキョウ" = "そこに縛られて転がってるおチビさんとの寸劇……じゃないよね。"
"52100-22-アヤメ" = "はは、違うって。ちょっと昨日の戦いで確認したいことがあってね。"
"52100-23-アヤメ" = "ええっと……。"
"52100-24-アヤメ" = "あったあった。"
"52100-25-ナグサ" = "それ、昨日の[ruby=げんりょうつくもがみ]幻魎付喪神[/ruby]……？"
"52100-26-アヤメ" = "うん。ほとんど壊れちゃって、原形を留めてるのはこれだけ。"
"52100-27-アヤメ" = "レンゲ、これって何だと思う？"
"52100-28-レンゲ" = "何って……ボロい傘？"
"52100-29-アヤメ" = "そう。ただの古びた傘だね。"
"52100-30-アヤメ" = "でも、昨夜はこれが生き物のように暴れて、私たちを攻撃した。"
"52100-31-アヤメ" = "「花鳥風月部」の怪書は、どうやってこれを怪異にしたんだろう。"
"52100-32-シュロ" = "フンッ、愚問ですねぇ。"
"52100-33-シュロ" = "怪書に不可能はないんですよぉ。傘のオバケくらい、いくらでも――"
"52100-34-アヤメ" = "だったら、丈夫な新品の傘で付喪神を作ればいいんじゃない？"
"52100-35-アヤメ" = "金属の骨を持つ、丈夫で強い傘の怪異になったりして。"
"52100-36-シュロ" = "そ、それは……。"
"52100-37-アヤメ" = "できないでしょ？"
"52100-38-アヤメ" = "みんなが想像する「唐笠お化け」は、ボロボロの傘だもんね。"
"52100-39-シュロ" = "[ruby=てめぇ]手前[/ruby]、知ったかぶるんじゃないです――"
"52100-40-アヤメ" = "怪書の力は知らないよ。#nでも、怪談……物語のことならわかる。"
"52100-41-アヤメ" = "本来、物語は一人で語っても意味がない。"
"52100-42-アヤメ" = "それを聞く者が共感し、理解を示してこそだからね。"
"52100-43-アヤメ" = "だから、誰もが経験したり、感じたことのある要素が必要不可欠。"
"52100-44-アヤメ" = "道端に落ちたボロボロの傘をみんなが不気味に思うから、怪談は成立するんだ。"
"52100-45-アヤメ" = "心が動かないなら、はじめから怖くなんてないでしょ？"
"52100-46-シュロ" = "……。"
"52100-47-アヤメ" = "クズノハ様探しを諦めかけていたとき、このあたりで噂を聞いたんだ。"
"52100-48-アヤメ" = "見る者によって姿かたちを変える、百物語が現れた……って。"
"52100-49-アヤメ" = "噂に尾ひれがついただけって思うこともできたけど……百物語を操る花鳥風月部が実在するのなら、それを撃退した伝説の委員長だっているはず。"
"52100-50-アヤメ" = "それで、私は真相を探っていたの。"
"52100-51-キキョウ" = "……だから。"
"52100-52-キキョウ" = "……今まで連絡の一つもせずに、姿を消していたの？"
"52100-53-アヤメ" = "……うん。迷惑をかけたのはわかってる。納得してもらえるとも思ってないよ。"
"52100-54-レンゲ" = "まあ……らしいっちゃ、らしいというか。"
"52100-55-レンゲ" = "前さ、委員長が家出猫を探しに山に入ったきり、二日間音信不通になっただろ？"
"52100-56-レンゲ" = "仕事には全力で！ってのがアヤメ委員長のいいところでもあるからさ。"
"52100-57-ユカリ" = "やると決めたら、脇目も振らずに進み続ける……まさに理想的なりぃだあ～ですわ！ "
"52100-58-ナグサ" = "……アヤメは変わらないね。"
"52100-59-アヤメ" = "この子も捕まえたことだし、花鳥風月部の本拠地も――"
"52100-60-シュロ" = "手前さん方に教えるわけないでしょうっ！"
"52100-61-シュロ" = "[ruby=てめぇ]手前[/ruby]らが何したって、ぜーったいにコクリコ様を裏切ったりなんてしませんから！"
"52100-62-アヤメ" = "あ、そう？なら……。"
"52100-63-アヤメ" = "アザミさん、囲炉裏を少し借りてもいいかな？"
"52100-64-アザミ" = "ええ。で、ですが何に使――"
"52100-65-アザミ" = "も、もしかして……！？"
"52100-66-シュロ" = "い、いやだ……！"
"52100-67-レンゲ" = "本気か！？"
"52100-68-アヤメ" = "うん！焼き鳥を食べよう！"
"52100-69-アヤメ" = "お腹空いたかなって思ってね。この子、昨夜から何も食べてないでしょ？"
"52100-70-アヤメ" = "……何か変なこと言ったかな？ "
"52100-71-アザミ" = "い、いえ。別に変ではありませんが……。"
"52100-72-シュロ" = "絶対変ですよぉ！？誰が朝から焼き鳥なんて食うんですかぁっ！"
"52100-73-シュロ" = "あと、今言ったこと忘れたんですかぁ！？[ruby=てめえ]手前[/ruby]らが何をしようが無駄無駄無駄です！"
"52100-74-シュロ" = "まして焼き鳥で買収だなんて……手前はそこらの[ruby=がき]餓鬼[/ruby]とは違うんですから！"
"52100-75-レンゲ" = "いや……子どもだろ。"
"52100-76-アヤメ" = "別に取引しようってわけじゃないよ。"
"52100-77-アヤメ" = "花鳥風月部の居所は、もう目星がついてる。"
"52100-78-シュロ" = "そっ、そんなデタラメ……！"
"52100-79-アヤメ" = "あと、朝から焼き鳥は普通だよ？"
"52100-80-アヤメ" = "脂の乗った鶏肉にネギの風味が合わさって、もう……！ねぎまは、お祭りにも野営にもぴったりだよね！"
"52100-81-ナグサ" = "その通り。"
"52100-82-アヤメ" = "えっと、シュロちゃんだっけ。むね肉ともも肉、どっちがいい？"
"52100-83-シュロ" = "……。"
"52100-84-アヤメ" = "あっ……塩派じゃなかったか。うーん、今たれがなくてね……。"
"52100-85-シュロ" = "て、手前は鶏は好きですけど、ネギなんてグニャグニャぶにゅぶにゅのモノ、食べないんですぅ！"
"52100-86-アヤメ" = "ネギ、嫌いなんだ。でも騙されたと思って食べてみてよ！"
"52100-87-ナグサ" = "そうそう。炭火で焼いた鶏の脂が加わると、ネギはとっても深みのある味になるんだ。"
"52100-88-ナグサ" = "辛みと苦みが抑えられて、甘さと旨味が増すんだよ。食べないなんて、人生の半分を損していると言っても過言ではないね……。"
"52100-89-シュロ" = "こ、コクリコ様のお願いでも、ネギだけは食べませんしぃ……！"
"52100-90-シュロ" = "な、なんで近づいてくるんですかぁ……！"
"52100-91-シュロ" = "や、やだぁ……近づけないで……こ、この外道ぉ……！"
"52100-92-キキョウ" = "みんな……それに、[USERNAME]先生も。"
"52100-93-キキョウ" = "ちょっと、こっち来て……。"
"52100-94" = "[ns1] \"急にどうしたのキキョウ？\"\n[ns2] \"ナグサのいない場所で何か話でも……？\""
"52100-95-キキョウ" = "うん。アヤメ委員長について、話があるの。"
"52100-96-キキョウ" = "ナグサ先輩は……。"
"52100-97-キキョウ" = "今言っても、分かってもらえない気がして。"
"52100-98-キキョウ" = "先生は、あのアヤメ委員長に違和感はなかった？しばらく黙ってたけど……。"
"52100-99" = "[s3] \"違和感といっても……。\"\n[s4] \"前のアヤメに会ったことがないからさ。\""
"52100-100-キキョウ" = "……ああ。 "
"52100-101-キキョウ" = "ごめんなさい、そうだよね。"
"52100-102-キキョウ" = "結論から言えば、私の知ってるアヤメ委員長とは、少し違うと感じてる。"
"52100-103-ユカリ" = "そ、そんな……！誰かが、アヤメ委員長の真似をしているんですの？"
"52100-104-キキョウ" = "断言するには早いよ。けど、その可能性も捨てきれない。"
"52100-105-レンゲ" = "でも、アヤメ委員長と瓜二つの生徒がいるって話も……。"
"52100-106-レンゲ" = "それに、アタシには前と同じに見えたけど。そんなに変なとこあったかな？ "
"52100-107-キキョウ" = "なんとなくだけど……。"
"52100-108-キキョウ" = "前よりも、「隙」がない気がする。"
"52100-109-アザミ" = "隙ですか……。"
"52100-110-キキョウ" = "いやいや、前からアヤメ委員長はちゃんとしてただろ？"
"52100-111-レンゲ" = "どんなややこしい任務も面倒な相談も、笑顔で請け負いあっさり片付ける。それが百花繚乱の委員長のアヤメ先輩で……。"
"52100-112-キキョウ" = "もちろん、私もそう思ってるよ。"
"52100-113-キキョウ" = "でも、アヤメ委員長にも苦手なことはあったでしょ？"
"52100-114-キキョウ" = "たとえば、ナグサ先輩とは違って少食だった。"
"52100-115-キキョウ" = "いつもご飯を少しだけ残して……それを見た私は、よく小言を漏らしてた。"
"52100-116-レンゲ" = "……今日はめちゃくちゃお腹空いてたんじゃないか？"
"52100-117-キキョウ" = "それに、さっきレンゲが言ったように、「仕事には全力」な性格なら……。"
"52100-118-キキョウ" = "なぜ北部自治区で出没した百物語を追わないで、私たちと合流したの？"
"52100-119-レンゲ" = "んー……花鳥風月部の拠点を調べてる最中だったとか？"
"52100-120-レンゲ" = "それだけで偽物ってのは無理があるだろ。"
"52100-121-キキョウ" = "たしかに、過敏になってると自分でも思うよ。"
"52100-122-キキョウ" = "でも、いろいろあった後だし、慎重でいたいの。#n……みんなの意見は？"
"52100-123-アザミ" = "百花繚乱の一員ではありませんので、口をはさむのは気が引けますが……。"
"52100-124-アザミ" = "私も、突然現れたアヤメ委員長を信じるのは難しいと思います。"
"52100-125-アザミ" = "ここ数か月、エビス分校付近で百物語を追っていたそうですが……私は、青い羽織を着た生徒の噂を一度も耳にしていません。"
"52100-126-アザミ" = "何より、百物語は我々と同じ姿になることもできるとか……。"
"52100-127-キキョウ" = "でも、百物語がアヤメ先輩になるかな？"
"52100-128-レンゲ" = "昨日、アヤメ先輩はナグサ先輩を助けに駆けつけたし……敵ならそんなことしないだろ。"
"52100-129-レンゲ" = "それに……花鳥風月部の罠だとしても、挑まれた勝負は受ける！その方が燃えるしな！"
"52100-130-キキョウ" = "……熱血に目がくらむのは、あんたの悪い癖だね。"
"52100-131-レンゲ" = "だって、偽物だとしてもアタシらに何ができるんだ？"
"52100-132-ユカリ" = "身共は……よく分かりません。"
"52100-133-ユカリ" = "久しぶりのアヤメ先輩は、以前と変わらずお日様のように明るく完璧なお方でしたが……。"
"52100-134-ユカリ" = "キキョウ先輩のお気持ちもわかりますわ。"
"52100-135-ユカリ" = "言葉にするのは難しいのですが……お日様のような暖かさはない、というか……。#nまるで人工照明のような無機質さといいますか。"
"52100-136-ユカリ" = "今のアヤメ先輩の全てを信じられるかというと……素直には頷けません。"
"52100-137-ユカリ" = "……でも、ナグサ先輩のあんな笑顔を見るのはいつぶりでしょうか。"
"52100-138-ユカリ" = "今までのナグサ先輩は、楽しいときでもどこか寂しそうで、ふっと消えてしまいそうな儚さのある方でした……。"
"52100-139-ユカリ" = "でも、アヤメ先輩と一緒にいるナグサ先輩は、本当に幸せそうですの。"
"52100-140-ユカリ" = "たとえ今のアヤメ先輩の存在が危ういものだったとしても……。"
"52100-141-ユカリ" = "悲しそうなナグサ先輩は……もう見たくありません。"
"52100-142-キキョウ" = "私も……そうだよ。"
"52100-143" = "[s] \"キキョウにとって、アヤメはどんな先輩だったの？\""
"52100-144-キキョウ" = "私……？"
"52100-145-キキョウ" = "うん……私にとってアヤメ委員長は、本当に優秀な先輩だった。"
"52100-146-キキョウ" = "なんでもそつなくこなして、誰にでも分け隔てなく優しい。みんなに好かれていたのもわかるよ。"
"52100-147-キキョウ" = "でも、決して完全無欠なんかじゃない。彼女にも限界はあったの。"
"52100-148" = "[s5] \"うん。誰でも限界はあると、私も思う。\"\n[s6] \"完璧なように振る舞っていただけなのかも。\""
"52100-149-キキョウ" = "そうだね。でも、昨日からのアヤメ委員長にはそういう隙がないように感じたから。"
"52100-150-キキョウ" = "……先生は、今のアヤメ委員長をどう見てる？"
"52100-151" = "[ns] \"今は答えられないかも、ごめんね。\""
"52100-152-キキョウ" = "……なぜ？"
"52100-153" = "[s7] \"世の中に完璧なものがないのと同じで……。\"\n[s8] \"誰かを正確に判断することもできないよ。\""
"52100-154" = "[ns] \"それに、私はアヤメの信頼を得られるほど、まだ関わっていないから。\""
"52100-155-キキョウ" = "……？私は、「先生がアヤメ委員長を信頼できるか」って聞いているんだよ。"
"52100-156" = "[s9] \"信頼は小さな積み重ねだから。\"\n[s10] \"まだ、その時間が足りなかったのかも。\""
"52100-157-キキョウ" = "……「時間が足りない」？"
"52100-158-キキョウ" = "長い間、一緒に過ごしてきたつもりだったけれど……。"
"52100-159" = "[s11] \"まずは一旦、目の前のアヤメと向き合おう。\"\n[s12] \"ちゃんとしているように見えても、危なっかしい一面があるのかもしれないし。\""
"52100-160-キキョウ" = "……わかった。たしかに、結論を出すにはまだ早いね。"
"52100-161-キキョウ" = "でも、私はこれからも疑っておくつもり。#n百花繚乱の参謀として、リスクは可能な限り排除したいから……。"
"52100-162-レンゲ" = "……少なくとも、このキキョウは本物だな！"
"52100-163-ユカリ" = "先輩がそう仰ってくださると、頼もしいですわ！"
"52100-164-キキョウ" = "それにね……。"
"52100-165-キキョウ" = "ナグサ先輩をあんな風にしたのに、笑顔で帰ってきたこと――"
"52100-166-キキョウ" = "まだ私は、許してないから。"
"52100-167" = "次回;彼岸へと至る道"
