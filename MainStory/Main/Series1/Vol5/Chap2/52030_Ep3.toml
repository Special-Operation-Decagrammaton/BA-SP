[translation]
"52030-1" = "第3話;新たなお祭り"
"52030-2-作業員A" = "ほら、落っことすなよ！"
"52030-3-作業員A" = "足元気をつけて、ゆっくり行けよ。"
"52030-4-作業員B" = "っと……！この看板、聞いてた話よりデカくないです？"
"52030-5-作業員B" = "お祭り運営委員会の発注ミスだったり……？"
"52030-6-作業員A" = "いや、こいつ[ruby=おんみょうぶ]は陰陽部の[/ruby]特注だよ。#n元々このサイズなんだって。"
"52030-7-作業員A" = "なんでもチセ様直筆の俳句を飾りたいんだそうだ。#nそれも、お祭り会場のどこからでも見えるように。"
"52030-8-作業員B" = "うわっ……！？"
"52030-9-作業員B" = "こんなところで走んな！あぶねーだろ！"
"52030-10-作業員A" = "おい、平気か？"
"52030-11-？？？" = "ちっ、失敗だな……。"
"52030-12-作業員A" = "んん……？"
"52030-13-魑魅一座A" = "リーダー！#n「チセ様の看板を壊してすり替える作戦」は失敗です！"
"52030-14-アラタ" = "ん……？そんな作戦立てたっけ？"
"52030-15-魑魅一座B" = "あっ、やっぱ[ruby=私たち]魑魅一座[/ruby]らしく、#n「銃撃戦の間に素早くトレード作戦」がいいですかね！？"
"52030-16-作業員A" = "魑魅一座……？#nどっかで聞いたような――"
"52030-17-作業員A" = "あ！思い出した！#nお祭りが近づくと出てくる不良集団！#n難癖つけてクーポンを強奪していくってのはお前たちか！"
"52030-18-魑魅一座A" = "ふんっ。#n他の祭りならともかく、#n「和楽まつり」のクーポンなんざ興味ねえよっ！"
"52030-19-魑魅一座B" = "そーだ！そーだ！#nいくら和楽姫でも、#nリーダーのカリスマと比べちゃ足元にも及ばないんだから！"
"52030-20-アラタ" = "そ、そう思ってくれてるのは嬉しいけど……。"
"52030-21-アラタ" = "今、言うことじゃないというか……。"
"52030-22-作業員B" = "はあ？それならどうして邪魔すんだよ！"
"52030-23-作業員B" = "もしかして、本気でチセ様に恨みが――"
"52030-24-魑魅一座B" = "和楽姫なんか関係ないっての！"
"52030-25-魑魅一座B" = "その看板、先週の俳句大会のやつだろ！？"
"52030-26-作業員B" = "ああ、陰陽部主催の？優勝したのはチセ様だったな。"
"52030-27-魑魅一座A" = "そうだよ！#nリーダーも気合いを入れて参加したのに……。"
"52030-28-魑魅一座B" = "ううっ……卑劣な妨害工作で予選さえも……。"
"52030-29-アラタ" = "予選は出てるからな！？"
"52030-30-魑魅一座B" = "みんな和楽姫ばっか褒めるけど、リーダーの句の方がすごいのに！"
"52030-31-魑魅一座B" = "そーだそーだ！文字に込められた想いに魂が震えたんだからな！"
"52030-32-魑魅一座B" = "みんなもリーダーの俳句を見たら、その素晴らしさに気づくはずなのに！"
"52030-33-アラタ" = "へへっ……ちょっと照れるな。"
"52030-34-アラタ" = "……って、そのために看板すり替えようとしたのか！？"
"52030-35-魑魅一座B" = "だってリーダー、#n大会の後からずっとしょんぼりしてたじゃないですか。"
"52030-36-魑魅一座B" = "だから、リーダーの俳句をお祭り会場のど真ん中に置いて、#nその素晴らしさを広めようかなって！"
"52030-37-魑魅一座A" = "こうなってしまったなら仕方ない……#nここでリーダーの俳句をみんなに聞かせてやりましょう！"
"52030-38-アラタ" = "ま、待て！それは――"
"52030-39" = "祭#nり#nの#nご#nは#nん#nは"
"52030-40" = "割#n引#n券#nな#nし#nじ#nゃ"
"52030-41" = "楽#nし#nめ#nな#nい#nよ#nね"
"52030-42-魑魅一座B" = "ほら、リーダー！みんな感動して声も出ないみたいですよ！"
"52030-43-作業員B" = "……そもそもそれ、俳句か？"
"52030-44-作業員B" = "まぁ……祭りは夏の季語だけど。"
"52030-45-魑魅一座A" = "うるさいな、リーダーが俳句と言ったら俳句なんだ！"
"52030-46-魑魅一座A" = "芸術を型にはめようとするな！"
"52030-47-作業員A" = "やっぱ俳句じゃないような……。"
"52030-48-アラタ" = "う……ううっ……！"
"52030-49-アラタ" = "こ、こうなったら、とりあえず祭りをぶち壊してやる！"
"52030-50-？？？" = "騒がしいと思ったら……。"
"52030-51-アラタ" = "だ、誰だっ。"
"52030-52-ナグサ" = "俳句を披露したい気持ちは分かるけど、お祭りの邪魔はさせないよ。"
"52030-53-キキョウ" = "個人的な恨みで暴れようだなんて、感心しないね。"
"52030-54-ユカリ" = "みんなの青春を台無しにするつもりか？"
"52030-55-ユカリ" = "これ以上の狼藉は、身共たちが許しませんわ！"
"52030-56-魑魅一座B" = "ひゃ、百花繚乱……！"
"52030-57-魑魅一座B" = "り、リーダー、どうしましょう！？#nなんか前より人増えてますけど！"
"52030-58-アラタ" = "百花繚乱対策は……考えてある！"
"52030-59-アラタ" = "勝負だ！今日こそ雪辱を果たすぞ……！"
