[translation]
"52050-1" = "第5話;憧れは記憶の彼方に"
"52050-2-ナグサ" = "10か月くらい前かな。#nアヤメは私に百蓮を託して、クズノハ様を探しに北部へと向かった。"
"52050-3-ナグサ" = "でも、私は戸惑うばかりで、何もできなかったの。#n彼女を止めることも、追いかけることも。"
"52050-4-ナグサ" = "……アヤメの代わりにはなれない。#n私に百花繚乱の委員長なんてできるはずがない。#n……そう思ってた。"
"52050-5-ナグサ" = "そうして……気づけば私も、大雪原に向かっていたの。"
"52050-6-ナグサ" = "どれだけ歩いて、いくつの夜を越えたのか、もう覚えてない。"
"52050-7-ナグサ" = "広大な大雪原でアヤメを探すなんて、無謀でしかなかったけど……#n私はボロボロになりながら、「黄昏の寺院」の跡地を見つけた。"
"52050-8-ナグサ" = "そこにアヤメはいた。まるで誰かを待ってるみたいに――"
"52050-9-ナグサ" = "みんなも、アヤメの顔と声は覚えてるよね？"
"52050-10-ナグサ" = "雨の日でも、太陽のように明るい笑顔。#n何もかも包み込むような優しい声……。"
"52050-11-ナグサ" = "私は指先さえも凍りついてしまいそうな中で、#nあの水色の羽織を目にして思ったんだ。"
"52050-12-ナグサ" = "全部投げ捨てて、わがままを言いに来た馬鹿な私を――#n包み込んでほしい……って。"
"52050-13-ナグサ" = "「しょうがないなあ」って笑う姿を見せてほしかった。"
"52050-14-ナグサ" = "もう一度、私たちの委員長に戻ってほしかった。"
"52050-15-ナグサ" = "でも、アヤメは……。"
"52050-16-アヤメ" = "何で、ここにいるの？"
"52050-17-ナグサ" = "あんなに冷たい声を出すアヤメは、初めてだった。"
"52050-18-ナグサ" = "相手を軽蔑しきった、氷のような眼差し。"
"52050-19-ナグサ" = "私の知ってるアヤメじゃなかった……。"
"52050-20-ナグサ" = "何でって……私はアヤメを……。"
"52050-21-アヤメ" = "言ったでしょ？私はクズノハ様に会えるまで帰らない。"
"52050-22-ナグサ" = "でも、アヤメがいないと……みんな不安がってる。"
"52050-23-ナグサ" = "あなたは、みんなが頼りにしてる百花繚乱の委員長なんだから。"
"52050-24-ナグサ" = "もう帰ろうよ。"
"52050-25-ナグサ" = "だって、アヤメも知ってるでしょ？"
"52050-26-ナグサ" = "クズノハ様なんて、いない。ただの言い伝えで――"
"52050-27-アヤメ" = "……そうかもね。"
"52050-28-アヤメ" = "黄昏の寺院はこんな有様だし。#nいくら名前を呼んでも、返事一つないもの。"
"52050-29-アヤメ" = "それでも、私はクズノハ様に会わなきゃいけないの。"
"52050-30-アヤメ" = "あなたには分からないだろうね。#n私がどうしてクズノハ様に会いたいのか。"
"52050-31-ナグサ" = "ううん……私にもわかるよ。"
"52050-32-ナグサ" = "みんなを守るために、クズノハ様の助言を貰いに来たんでしょ？#nアヤメは責任感が強いから……。"
"52050-33-アヤメ" = "ははっ……あははっ……。"
"52050-34-アヤメ" = "……はあ。"
"52050-35-アヤメ" = "ほんっと……ナグサって、私のことなにも知らないよね。"
"52050-36-アヤメ" = "いや……分かろうともしなかったのか。"
"52050-37-ナグサ" = "アヤメ、どうしてそんなこと……。"
"52050-38-？？？" = "古来より、人の心とは摩訶不思議。"
"52050-39-？？？" = "理解した[ruby=うそぶ]と嘯く[/ruby]も、それは傲慢。#n硝子のように脆いものさね。"
"52050-40-？？？" = "おまえさんは無能で、その上傲慢ときた。#n付ける薬なんてありゃせんのさ。"
"52050-41-ナグサ" = "あなたは……？"
"52050-42-？？？" = "我は、風流と物語を慈しむ道行き人。"
"52050-43-？？？" = "雪にまみれた、迷い子を迎えに来たのさ。"
"52050-44-アヤメ" = "あなた、クズノハ様の居場所がわかるの？"
"52050-45-？？？" = "我とて彼岸の境界には触れられない。#n雪を眺め、風流で己を慰めていたところさね。"
"52050-46-？？？" = "しかし――互いに行き先は異なれど、「そこ」への道なら我にもわかる。"
"52050-47-アヤメ" = "じゃあ……案内して。"
"52050-48-ナグサ" = "待って……っ！#nアヤメを、私の友達を連れていかないで！"
"52050-49-アヤメ" = "……友達？"
"52050-50-アヤメ" = "ナグサ。"
"52050-51-アヤメ" = "私は……あんたを友達だと思ったことなんて、ない。"
"52050-52-ユカリ" = "……信じられませんわ。#nアヤメ先輩が、そんなひどいことを仰るだなんて。"
"52050-53-レンゲ" = "いくら怒ってても、そんなこと言うか……？"
"52050-54-キキョウ" = "私の知ってるアヤメ先輩とは……あんまり結びつかないけど。"
"52050-55-ナグサ" = "たしかに普段のアヤメなら、あんなこと絶対言わない。"
"52050-56-ナグサ" = "悪い夢でも見てたんじゃないか……って、何度も考えた。"
"52050-57-ナグサ" = "でも、アヤメと一緒に呑まれた腕が……#nこの傷が、あれは現実なんだって訴えてくる。"
"52050-58-キキョウ" = "それが、最後に見た先輩の姿？"
"52050-59-ナグサ" = "うん……その後、倒れちゃって。"
"52050-60-ナグサ" = "[ruby=ひとけ]人気[/ruby]のない大雪原で意識を失うなんて、#n死んでもおかしくなかったのに――"
"52050-61-ナグサ" = "助けが来て、なんとか命拾いしたんだ。"
"52050-62-ユカリ" = "そのような場所に人がいらっしゃるだなんて、幸運の持ち主なのですね！"
"52050-63-ナグサ" = "……。"
"52050-64-ナグサ" = "そうだね。そんなものがあればよかったのに。"
"52050-65-ナグサ" = "……んん。"
"52050-66-？？？" = "気がついたかの。"
"52050-67-？？？" = "もう動けるのなら、帰るがよい。#nここでは気力を保持することはできても、治せはせぬ。"
"52050-68-ナグサ" = "あなたが私を……？"
"52050-69-？？？" = "ふふ……先達に対して「あなた」とは大きく出たのう。"
"52050-70-？？？" = "まあ、今日のところは大目に見てやろうかの。#n己が名は覚えておるか？"
"52050-71-ナグサ" = "私は百花繚乱紛争調停委員会の……委員長代理、[ruby=ごりょう]御稜[/ruby]ナグサ。"
"52050-72-ナグサ" = "真冬に……桜？"
"52050-73-？？？" = "おや。ここに来るまで気づかなんだか？"
"52050-74-？？？" = "「黄昏の寺院」は現実と時間の流れが異なっていての。#n彼岸花と桜が共に咲き乱れることもある。"
"52050-75-ナグサ" = "ここが……？"
"52050-76-ナグサ" = "じゃあ……あなたがあの、大預言者クズノハ？"
"52050-77-？？？" = "ふむ……。"
"52050-78-？？？" = "妾が本当にクズノハだとすれば、どうするのじゃ？"
"52050-79-？？？" = "百花繚乱の後継者として、聞きたいことでもあるのか？"
"52050-80-ナグサ" = "いや……あなたはクズノハ様じゃない。"
"52050-81-？？？" = "……ほう。"
"52050-82-ナグサ" = "本当にクズノハ様なら……#n呼びかけ続けたアヤメを無視して、私なんかを助けない。"
"52050-83-ナグサ" = "そんな冷たいこと……#n百花繚乱の初代委員長、クズノハはしない。"
"52050-84-？？？" = "どう受け止めるかは、おぬしの自由じゃ。"
"52050-85-？？？" = "だが……ちょうどいいときに来てくれた。#nひとつ、使いを頼まれてくれぬか？"
"52050-86-ナグサ" = "これは……巻物？"
"52050-87-？？？" = "「シャーレ」の先生に、これを渡して欲しい。"
"52050-88-？？？" = "妾を探しているようじゃったからな。#nここに記されているのは――"
"52050-89-？？？" = "ある者を、助ける方法じゃ。"
"52050-90-ナグサ" = "……私が見たのはここまで。"
"52050-91-ナグサ" = "私はアヤメを助けるどころか拒まれた……#nその影響で、右腕も使い物にならない。"
"52050-92-ナグサ" = "今まで黙ってたのは……#n本当のことを知ったら、みんな私に失望するんじゃないかって、怖くて。"
"52050-93-ナグサ" = "でも……私はもう、逃げないよ。"
"52050-94-ナグサ" = "みんな……私のことを恨んでいいから。#n好きなだけ、責めて構わないよ。"
"52050-95-ユカリ" = "そんな……そんな……。"
"52050-96-ユカリ" = "ナグサ先輩のこと、恨むわけありませんの！"
"52050-97-ナグサ" = "ゆ、ユカリ……？"
"52050-98-ユカリ" = "みんなが混乱している中、#nアヤメ先輩を探しに行ったのはナグサ先輩だけです。"
"52050-99-ユカリ" = "この百花繚乱に、先輩を恨む者などおりません……#nむしろ感謝しているくらいですの！"
"52050-100-キキョウ" = "……以前の一件で成長したんじゃなかったの？"
"52050-101-キキョウ" = "優しかったアヤメ委員長が豹変して、#nそこに都合良く現れた花鳥風月部……。"
"52050-102-キキョウ" = "そんなの、あいつらの策に決まってるでしょ。"
"52050-103-ユカリ" = "ええ！アヤメ先輩は悪者に騙されているだけですの！"
"52050-104-ユカリ" = "ユカリの言うとおりだ。#nそれに、自分を責めたってしょうがないだろ？"
"52050-105-ユカリ" = "今すぐ大雪原に向かって、アヤメ先輩を助けよう。#nもちろん、ナグサ先輩の腕も取り返す！"
"52050-106-ユカリ" = "えっくせれんとな案ですわ！身共、賛成です！"
"52050-107-ナグサ" = "で、でも……。"
"52050-108-ナグサ" = "大雪原は危険だよ。#nそれに、みんなでここを離れるわけには……。"
"52050-109-？？？" = "失礼します。百花繚乱の方はいらっしゃいますか？"
"52050-110-陰陽部の部員" = "ああ、ちょうどお揃いでしたか。"
"52050-111-ナグサ" = "あなたは[ruby=おんみょうぶ]陰陽部[/ruby]の……どうしたの？"
"52050-112-陰陽部の部員" = "はい……部長の命で。"
"52050-113-陰陽部の部員" = "折り入ってご相談があるとかで――皆さんをお探しです。"
"52050-114-ナグサ" = "……ニヤ様が？"
"52050-115" = "次回;お祭りと準備"
