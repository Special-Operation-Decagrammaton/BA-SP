[translation]
"52035-1-アラタ" = "くっ……つ、強い……！"
"52035-2-アラタ" = "でっ、でも……！弱点を知ってるんだぞ！"
"52035-3-アラタ" = "みんな、あいつの右腕を狙え！"
"52035-4-レンゲ" = "おい！セコいことするな！"
"52035-5-キキョウ" = "甘いね、レンゲ。#n戦いで手段を選ばないやつは強いよ。"
"52035-6-ユカリ" = "ナグサ先輩、今ですの！"
"52035-7-ナグサ" = "……私は、簡単に弱点を握られるくらい未熟。"
"52035-8-ナグサ" = "でも……一緒に戦ってくれるみんながいるから。"
"52035-9-魑魅一座B" = "ぐっ……！リーダー、これ以上は厳しいです！"
"52035-10-魑魅一座B" = "俳句は諦めて……次の川柳大会に賭けましょう！"
"52035-11-アラタ" = "だからそれは関係ないって言ってるだろ！？"
"52035-12-アラタ" = "ううっ……覚えてろよ！"
"52035-13-？？？" = "ちょっとちょーっと！？"
"52035-14-シズコ" = "お祭りを邪魔する不届き者は誰！？"
"52035-15-シズコ" = "陰陽部にいくら広告費をもらったと――"
"52035-16-ウミカ" = "い、委員長～っ！いくらなんでも、会議中に飛び出すのは……！"
"52035-17-ウミカ" = "……あれ？百花繚乱のみなさん？"
"52035-18-シズコ" = "ん？あれ、本当だ……百花繚乱の皆さんが、なんで？"
"52035-19-シズコ" = "「俳句を詠みながら戦ってる連中がいる」って……聞いたから、#nてっきり忍術研究部かと……。"
"52035-20-レンゲ" = "いやいや、アタシらはケンカを止めに入った側だって！"
"52035-21-レンゲ" = "ってか、忍術研究部って、そんなことするのか……？"
"52035-22-シズコ" = "私たちもよくは知りませんが、フィーナの言う「挨拶」みたいなものかと……。"
"52035-23-ナグサ" = "魑魅一座が妨害してたから、「調停」に入ろうとしたんだけれど……。"
"52035-24-ナグサ" = "迷惑をかけてしまったのなら、ごめんなさい。"
"52035-25-シズコ" = "いえいえ、とんでもない！"
"52035-26-シズコ" = "お祭りのたびに魑魅一座が問題を起こすから……#n正直、自分たちの手に負えないと思っていたところでした。#n本当に感謝しています。"
"52035-27-シズコ" = "委員会と商店街を代表して、お礼を言わせてください。"
"52035-28-ユカリ" = "当然のことをしたまでですの！#n正義を守り、狼藉者を退ける……#nそれが、身共たち百花繚乱のお仕事ですから！"
"52035-29-ユカリ" = "困ったときにはいつでもお呼びくださいまし！"
"52035-30-シズコ" = "……ところで、[ruby=ももよどう]百夜堂[/ruby]絡みで、#n皆さんにお願いしたいことがあるんですけど……。"
"52035-31-キキョウ" = "ごめん、今は個人の依頼は受けていないの。#nよほど危ない目に遭ってるとかじゃない限りね。"
"52035-32-キキョウ" = "百花繚乱はあくまで学園内の調停が仕事だから――"
"52035-33-シズコ" = "それは残念。"
"52035-34-シズコ" = "トリニティ産の特製マロンクリームを使った「マロンだんご」……#nお祭りで販売する前に、試食をお願いしようと思っていたのですが――"
"52035-35-シズコ" = "お忙しいなら仕方ないですね！#n他の方に召し上がっていただくとしましょう……。"
"52035-36-キキョウ" = "……忙しいとは、言ったけど。"
"52035-37-レンゲ" = "あーあ、残念だな～！#n作戦参謀さまはお忙しいみたいだし、アタシら3人で行くしかないか。"
"52035-38-シズコ" = "ちょっとレンゲ！"
"52035-39-シズコ" = "ふふっ、冗談ですよ。"
"52035-40-シズコ" = "では皆さん、こちらへどうぞ！"
"52035-41-レンゲ" = "んんっ、甘い……！"
"52035-42-レンゲ" = "これ、本当にアタシの知ってるだんごか？#nほんのり甘くて柔らかいクリームと組み合わさって……#nまるで別のデザートみたいだ……！"
"52035-43-ユカリ" = "身共はてっきり、#n和菓子にとりにてぃ風のくりーむは合わないものとばかり……。"
"52035-44-ユカリ" = "この栗まんじゅうのような香ばしさと、#nくりーむならではの柔らかさが、#nおだんごとまっちしておりますの！"
"52035-45-キキョウ" = "ユカリ、口元にクリームついてる。"
"52035-46-キキョウ" = "おだんごは歯にくっつくから、後で歯磨きをしっかりするんだよ。"
"52035-47-ユカリ" = "も、もちろんですわ！"
"52035-48-ナグサ" = "定番のおだんごとマロンクリームを合わせるのは、#n良いアレンジだと思う。"
"52035-49-ナグサ" = "でも……どっちも柔らかいから、食感が少し単調になるかも。#n……おだんごの間に、つくねを挟むのはどう？"
"52035-50-レンゲ" = "それじゃデザートにならないだろ！？"
"52035-51-ウミカ" = "ふふっ。皆さん気に入ってくださったようで、なによりです。"
"52035-52-ウミカ" = "このおだんごは、いつもお祭りのために尽力していただいている皆さんのためにご用意したんです。#nどうぞ遠慮せず、たくさん召し上がってくださいね！"
"52035-53-ユカリ" = "お気遣いありがとうございますの！#nですが、皆様こそ百鬼夜行を盛り上げるために日夜奮闘されていますでしょうに……。"
"52035-54-ユカリ" = "それに、前回の[ruby=とうろうさい]「燈籠祭」[/ruby]では身共たちが不覚を取り、#nご迷惑をおかけしてしまいました……。"
"52035-55-ウミカ" = "いえ！私たちなんて、事件の間気を失っていましたから……！"
"52035-56-ウミカ" = "みなさんもアヤメ委員長がいなくなって大変でしょうし――"
"52035-57-ウミカ" = "あっ……ご、ごめんなさい！"
"52035-58-ナグサ" = "……大丈夫、帰ってくるから。"
"52035-59-ナグサ" = "そのときは、皆がどれだけ心配していたか、彼女に伝えておくよ。"
"52035-60-ウミカ" = "……ありがとうございます。よろしくお願いしますね！"
"52035-61-作業員" = "あのー、会場周りの壁なんですけど……#n昨夜雨も降ったし、土のうで補強しようかと思いまして。"
"52035-62-作業員" = "……少し手を貸していただけませんか？"
"52035-63-シズコ" = "あ、ちょうどみんな、資材の受け取りに行っちゃったところで。"
"52035-64-シズコ" = "誰か戻り次第、すぐに手伝いに向かわせますので――"
"52035-65-ユカリ" = "そういうことでしたら、この百花繚乱にお任せくださいまし！"
"52035-66-キキョウ" = "ああ、ちょうど体を動かしたくなってたんだ！"
"52035-67-ナグサ" = "……食後の運動に良さそうだね。"
"52035-68-シズコ" = "あっ、それじゃあ……みんなが戻るまでの間、よろしくお願いします！"
"52035-69-ユカリ" = "ええ！"
"52035-70-キキョウ" = "っと……ここに置いておくから、順番に積んで。 "
"52035-71-キキョウ" = "重いから気をつけて。"
"52035-72-レンゲ" = "心配すんなって。こんなの、訓練で飽きるほど持ったよ。"
"52035-73-ユカリ" = "ふふっ。美味しいおだんごをたくさん食べて、元気いっぱいですの！"
"52035-74-ユカリ" = "ナグサ先輩、そちらの土のうを頂けますか？"
"52035-75-ナグサ" = "うん。今渡す――"
"52035-76-ナグサ" = "ぐっ……。"
"52035-77-レンゲ" = "どうした、すごい音したぞ！？"
"52035-78-ユカリ" = "せ、先輩！大丈夫ですの！？"
"52035-79-ナグサ" = "大丈夫。ちょっと手首をひねっただけ。"
"52035-80-ユカリ" = "でも、すごく辛そうですわ……。"
"52035-81-キキョウ" = "ナグサ先輩……右腕の包帯、ほどいてくれる？"
"52035-82-ナグサ" = "そんな大事じゃない……。"
"52035-83-キキョウ" = "いいから。"
"52035-84-レンゲ" = "こ、これは……。"
"52035-85-ユカリ" = "大したことないなんて嘘ですわ……。"
"52035-86-ユカリ" = "ナグサ先輩、いつからこんな……？"
"52035-87-ナグサ" = "大雪原の時の傷だよ。すぐに治るから、気にしないで。"
"52035-88-レンゲ" = "いやいや！腕が使えなくなったらどうするんだよ！"
"52035-89-レンゲ" = "今すぐ病院に……いや、救急車か？"
"52035-90-ナグサ" = "……騒ぎすぎだよ。"
"52035-91-ユカリ" = "ナグサ先輩、少しお時間をいただけませんか？"
"52035-92-ユカリ" = "もしかしたら……[ruby=かでのこうじ]勘解由小路[/ruby]家で治療できるかもしれません。"
"52035-93" = "次回;勘解由小路家の貴人"
