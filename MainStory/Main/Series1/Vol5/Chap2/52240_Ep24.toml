[translation]
"52240-1" = "第24話;鬼哭は獅子の遠吠えに"
"52240-2-ニヤ" = "にゃはは～間一髪！#nんや、間半髪ですかねぇ。"
"52240-3-ニヤ" = "相手を油断させようと、わざとのんびりしていたのですが……内心ひやひやでしたよ。"
"52240-4-キキョウ" = "百花繚乱に代々伝わるあの信号を、見落とすはずないでしょ。"
"52240-5-キキョウ" = "天守閣に上がる白い花火は、「陰陽部に問題発生」の合図。"
"52240-6-ユカリ" = "完璧なたいみんぐでしたわ！#n間に合ってよかったですの！"
"52240-7-レンゲ" = "チッ……どいつもこいつも逃げ足だけは速いな。#n今度こそ尻尾を掴んだと思ったのに……。"
"52240-8-シュロ" = "む、無理矢理連れてきてぇ……。#n怪書があれば[ruby=てめえ]手前[/ruby]らなんて……！"
"52240-9-ニヤ" = "あら？意外な方とご一緒ですね。"
"52240-10-ニヤ" = "この不思議な組み合わせ……なにやら色々とあったようですねぇ。"
"52240-11" = "[s1] \"ニヤ、大丈夫？\"\n[s2] \"怪我はしてない？\""
"52240-12-ニヤ" = "ええ。身体は丈夫ですので♪"
"52240-13-ニヤ" = "それに、頼もしい護衛のみなさんもいらっしゃいましたし。おかげさまで、和楽まつりも無事開催と相成りました。#n[USERNAME]先生、ありがとうございます。"
"52240-14" = "[s] \"それはよかったよ。\""
"52240-15-ニヤ" = "ええ、とても助かりましたとも。"
"52240-16-ニヤ" = "ですが、私にできたのはここまで……。#n現状維持に務めるので精一杯です。"
"52240-17-ニヤ" = "百物語という圧倒的な不条理を前に、私はあまりに無力でした。"
"52240-18-ニヤ" = "これは陰陽部の部長の座を退く日も近――"
"52240-19-ニヤ" = "……にﾞゃﾞっﾞ！？"
"52240-20-ユカリ" = "じっとしてくださいまし！傷口を消毒しますわ！"
"52240-21-ニヤ" = "か、かすり傷みたいなものですって……。"
"52240-22-ナグサ" = "痕になってからじゃ、遅いからね。"
"52240-23-ナグサ" = "ほんの小さなことでも‥…やるべきときにやらないと。"
"52240-24-ユカリ" = "……ナグサさん。"
"52240-25" = "[s3] \"無力と言うけど。\"\n[s4] \"全部をひとりでできる人はいないよ。\""
"52240-26" = "[ns] \"私も、[ruby=みんな]生徒[/ruby]がいなければ、何者でもないから。\""
"52240-27-ニヤ" = "……先生がそうおっしゃるのなら。"
"52240-28-ニヤ" = "たしかに、今は弱音を吐いている場合ではありませんね。"
"52240-29-ニヤ" = "まず、無事に帰還されて何よりです。#n[USERNAME]先生、そして百花繚乱の皆さん。"
"52240-30-ニヤ" = "あと……花鳥風月部のちっちゃな怪談家さんも。"
"52240-31-シュロ" = "ちっちゃいって言わないでくれますっ！？"
"52240-32-ニヤ" = "――まず、状況を整理しましょうか。#n陰陽部の把握している情報をお伝えしますね。"
"52240-33-ニヤ" = "現状を把握し、対策を立てるには記録と噂をより分けることが第一です。"
"52240-34-キキョウ" = "うん。精査されていない情報が、一番の敵だからね。"
"52240-35-ニヤ" = "なるほど、そうですか。アヤメさんは……。"
"52240-36-ニヤ" = "どこか危うさを感じる方ではありましたが……それほどとは。"
"52240-37-ニヤ" = "百花繚乱の委員長が、そこまで追い込まれていたことを感知できなかったのは……こちらの落ち度です。"
"52240-38-ナグサ" = "違う、アヤメの苦しみに気がつけなかったのは、私のせいだよ。#n私がもっと寄り添っていたら――"
"52240-39-キキョウ" = "非があるのは、私たち全員でしょ。"
"52240-40-キキョウ" = "何もかも一人で背負うの、先輩の悪い癖って言ったよね？"
"52240-41-レンゲ" = "そうですわ！アヤメ先輩に無茶をさせてしまったのは身共たちだって同じですもの！"
"52240-42-レンゲ" = "今度こそ、アタシらみんなで背負おう！"
"52240-43-ナグサ" = "……そうだね。アヤメを守るのは、私たち全員の目標だった。"
"52240-44-キキョウ" = "……一つ聞きたいのだけど、ニヤ部長。"
"52240-45-キキョウ" = "お祭りを続けるだけで、アヤメの百物語‥‥…ヒトツメの力を抑えられるのは事実なの？"
"52240-46-ニヤ" = "いえ？怪芸家の言っていた通り、その場しのぎですよ。"
"52240-47-ニヤ" = "お祭りに熱狂する人々の心から恐怖が薄まり、それによって弱まるのは確かです、が……。"
"52240-48-ニヤ" = "感情は、揺れ動くものです。"
"52240-49-ニヤ" = "お祭りの熱気が収まれば、#n再度ヒトツメが百鬼夜行全域に現れることでしょう。"
"52240-50-ニヤ" = "一番の問題は……アヤメ委員長です。"
"52240-51-ユカリ" = "アヤメ先輩はたしかにお強いですが……。"
"52240-52-ニヤ" = "そう、まさにそれが問題でして。"
"52240-53-ニヤ" = "アヤメ委員長に敵う者は、私の知る限りいません。"
"52240-54-ユカリ" = "それは……そうですの。"
"52240-55-ユカリ" = "私も、一度だってアヤメに勝てなかった……。"
"52240-56-ニヤ" = "いくらヒトツメを倒しても、大元のアヤメ委員長が健在な限り、恐怖を餌としてまた活動を始めるでしょう。"
"52240-57-レンゲ" = "くそっ……頼りになっただけに、いざ敵に回ると恐ろしいな。"
"52240-58-ニヤ" = "ですが、打つ手なしというわけでもないんですよ？"
"52240-59-ニヤ" = "怪書を貫く伝説の銃「百蓮」と、百花繚乱の皆さんがお揃いなんですから。"
"52240-60-ニヤ" = "市中の怪談を倒しながらアヤメ委員長の元へと辿り着ければ、怪書を破壊するチャンスだって……。"
"52240-61-レンゲ" = "でも、百蓮は一丁しかないぞ？この数の化け物が相手じゃ……。"
"52240-62-ニヤ" = "ですので……こちらも怪書を使うんですよ。"
"52240-63-ニヤ" = "ほら、「毒を以て毒を制す」と言いますでしょう？"
"52240-64-ニヤ" = "怪異の相手は、怪異にしてもらいます。"
"52240-65-キキョウ" = "でも、肝心の怪書がないなら……。"
"52240-66-ニヤ" = "それはですね――"
"52240-67-シュロ" = "はぁ？何を言っているんですかぁ……？"
"52240-68-シュロ" = "怪書に怪書で対抗？#nそんな簡単に手に入るなら、手前がこんなことしてないですよぉ！"
"52240-69-シュロ" = "それに、怪談家の手前が「稲生物怪録」を扱えるようになるまで、#nどれだけかかったと思ってるんですぅ？#n手前らじゃ何年かかってもぉ――"
"52240-70-ニヤ" = "ありますよ、「稲生物怪録」。"
"52240-71-シュロ" = "……は？"
"52240-72-ニヤ" = "はい、どうぞ。"
"52240-73-シュロ" = "こ、これは……本物！？"
"52240-74-シュロ" = "あ、ありえない……「稲生物怪録」は燃えてなくなったはず……。"
"52240-75-ニヤ" = "そうですねぇ。我々が発見した時には、ボロボロになった表紙と、ページの切れ端くらいしか残っていませんでした。"
"52240-76-ニヤ" = "燃えかすから一冊の本を復元するなんて、普通は不可能。#n怪書ともなればなおさらです……。"
"52240-77-ニヤ" = "しかし、我々が交流している学園の中には、そんな不可能を可能にする「魔術師」のような方がおりまして……。"
"52240-78-シュロ" = "ただの生徒が、稲生物怪録を直したっていうんですかぁ……？"
"52240-79-シュロ" = "そんなことできるわけ……！"
"52240-80-シュロ" = "……ってこの本、何も書かれてないじゃないですか！"
"52240-81-ニヤ" = "流石の魔術師といえど、焼失した内容までは分からないとのことでして。"
"52240-82-シュロ" = "そ、それでは意味がないじゃないですかぁ！#n怪書の力は、本の中の怪談から生まれるのですから！"
"52240-83-シュロ" = "見かけだけ直したって――"
"52240-84-クズノハ" = "あのようなものに何の意味があるんじゃ？"
"52240-85-シュロ" = "何の意味もない……って。"
"52240-86-ニヤ" = "ええ、何も書かれていない怪書など、ただの本です。"
"52240-87-ニヤ" = "それならば……ここに新しい物語を書いてしまえばいいじゃないですか。"
"52240-88-ニヤ" = "人気小説家「朽木修羅」が。"
"52240-89-レンゲ" = "……朽木修羅？"
"52240-90-レンゲ" = "朽木修羅って……。"
"52240-91" = "[s] \"シュロのペンネーム、だよね？\""
"52240-92-シュロ" = "て、てて[ruby=てめえ]手前[/ruby]ぇ！なんでそれを！"
"52240-93-ニヤ" = "もちろん知っていますとも。投稿サイトの「小説、書こうよ！」で毎週連載していましたよね？"
"52240-94-ニヤ" = "私、以前書かれていた「異世界に行ったら怪談家になって超レベルアップした件」シリーズのファンでして～"
"52240-95-シュロ" = "う、うわあぁぁぁぁぁぁっ！あ、あの頃と今では作風が違ぁ……っ！"
"52240-96-シュロ" = "なんでもできるチート能力や、思いつきをそのまま入れたような超展開……。#n最新話がアップされるたびに燃え上がるコメント欄が必見の名作だったのですが……。"
"52240-97-シュロ" = "そっ、それは、だからぁっ……！"
"52240-98-ニヤ" = "いえ、分かっておりますとも。#nあの作品の真髄は、各章に込められた深いテーマたちですよね。"
"52240-99-ニヤ" = "行間も読めない読者を相手して、悔しくてたまらなかったことでしょう。"
"52240-100-シュロ" = "……手前の小説、読んだんですかぁ？"
"52240-101-ニヤ" = "ええ。だからファンだとお伝えしたじゃないですか。"
"52240-102-ニヤ" = "シュロさん、考えてもみてくださいよ。"
"52240-103-ニヤ" = "あなたの物語が怪書の力で現実となったとき、「リアリティがない」とコメントしていた方々が、どんな顔をするか……。"
"52240-104-ニヤ" = "ちゃんと読んでもらえず笑い物にされて、悔しく惨めだった、あの気持ち――"
"52240-105-ニヤ" = "そのままそっくり返してやりたい……そうは思いませんか？"
"52240-106-シュロ" = "……はっ。"
"52240-107-シュロ" = "そうはいきませんからぁ！"
"52240-108-シュロ" = "手前は、コクリコ様が喜んでくれる百物語以外は――"
"52240-109-ニヤ" = "別にいいですよ？#n百鬼夜行に新しい百物語を作り出しても。"
"52240-110-シュロ" = "……本気なんですかぁ！？"
"52240-111-シュロ" = "ええ……はたして、読者は彼女とあなたの物語、どちらに惹かれるのでしょう。気になりますねぇ。"
"52240-112-レンゲ" = "ま、待てよニヤ部長。そんなことやらせたら……！"
"52240-113-キキョウ" = "しっ……。"
"52240-114-キキョウ" = "考えがあるみたい。"
"52240-115-シュロ" = "て、手前の百物語が……ここに……。"
"52240-116-クズノハ" = "これがわかった時には、きっと……其方だけの書を手に入れられるはずじゃ。"
"52240-117-シュロ" = "手前だけの、怪書……。"
"52240-118-シュロ" = "返答はいかに……？"
"52240-119-シュロ" = "……本当に、何を書いてもいいんですねぇ？"
"52240-120" = "それじゃ……次の曲は……。"
"52240-121" = "チセちゃん、ファイトです……！"
"52240-122-イズナ" = "フィーナ殿、後ろからまた敵が！"
"52240-123-フィーナ" = "ま、前からもデス……！こ、これ以上は流石ニ……！"
"52240-124-ミチル" = "うう……減ったと思ったのに、また増えてる……。"
"52240-125-ミチル" = "このままじゃ……。"
"52240-126-百鬼夜行の住民A" = "あれ？この鳴き声……。"
"52240-127-百鬼夜行の住民B" = "猫？"
"52240-128-百鬼夜行の住民B" = "まさか、前回のあの化け猫まで――！？"
"52240-129-？？？" = "ぐにゃおぉぉぉぉんっ！"
"52240-130-百鬼夜行の住民A" = "……えっ、なにあれ。"
"52240-131-百鬼夜行の住民B" = "なんか、あの時の化け猫とはちょっと……いや、大分違うっていうか……。"
"52240-132-百鬼夜行の住民A" = "こ、子供の落書きみたいな……？"
"52240-133" = "[log=슈로]『最強[ruby=すとおりいてらあ]の怪談家の[/ruby]手によって生まれ変わったみょうきクロカゲは……[/log]"
"52240-134" = "[log=슈로]一目見るだけで誰もが震え上がる強さがほとばしり……[/log]"
"52240-135" = "[log=슈로]えーっと……[wa:1000]とにかく全員おそれおののいた！』[/log]"
"52240-136" = "[log=슈로]『……大きい[wa:1000]……ヒゲと、[wa:1000]額の角は触れるもの全てを傷つけ……[/log]"
"52240-137" = "[log=슈로]超、[ruby=だあく]邪悪[/ruby]なすごい見た目……！』[/log]"
"52240-138" = "[log=슈로]『猛々しく吠える姿は、[wa:1000]最早猫ではなく、[/log]"
"52240-139" = "[log=슈로]まるで気高く最強でデカい[ruby=らいおん]獅子[/ruby]のようだった……』[/log]"
"52240-140-百鬼夜行の生徒A" = "あははっ、何あれ！"
"52240-141-百鬼夜行の生徒B" = "あれも和楽まつりの演出？"
"52240-142-百鬼夜行の生徒A" = "なんか可愛い～！"
"52240-143-イズナ" = "部長、ツクヨ殿！怪物たちが動揺しています！"
"52240-144-イズナ" = "今です！"
"52240-145-イズナ" = "で、でもあの怪物には、私たちの銃や爆弾は効かないよ……？"
"52240-146-イズナ" = "罠を仕掛けたり他の場所に誘導するのも、もうネタ切れだし……。"
"52240-147-ツクヨ" = "あっ……！いつの間に……！"
"52240-148-ツクヨ" = "ツクヨ殿、危険です！"
"52240-149-ミチル" = "銃弾が……当たった？"
"52240-150-ミチル" = "な、なんで……？"
"52240-151-レンゲ" = "おい、この展開どうなんだよ……？"
"52240-152-レンゲ" = "強い敵に熱く逆転するんなら、もうちょっと段取りって言うか……なぁ？"
"52240-153-シュロ" = "これだから素人の読者は困るんですよぉ！こういう時のお約束といえばぁ……！"
"52240-154" = "[log=슈로]『その時……[ruby=らいおん]獅子[/ruby]の傍には、[wa:1000]えっと…[ruby=あるてぃめっと・にんじゃ]…共に戦う者た[/ruby]ちがいた！』[/log]"
"52240-155-イズナ" = "わあっ！？きゅ、急にすごい力が湧き出てきましたよ！"
"52240-156-イズナ" = "部長、こんな術があったとは！"
"52240-157-ミチル" = "えっ、何それ知らない……怖っ！"
"52240-158-ツクヨ" = "と、とにかく、これなら怪物を食い止められそうです！舞台を守りましょう！"
"52240-159-ミチル" = "忍術研究部、突入します！"
