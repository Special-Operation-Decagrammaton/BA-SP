[translation]
"52260-1" = "第26話;暗く、深い影の底から"
"52260-2" = "百物語とは、百の数の物語を交わすこと。"
"52260-3" = "草木も眠る夜半に催され、物語の終幕と共に、一つ、また一つと火を消していく。#n―[ruby=いにしえ]―古よ[/ruby]り伝わる、百鬼夜行の[ruby=あそび]遊戯[/ruby]から始まりし怪談。"
"52260-4" = "語れば語るほど[ruby=ともしび]に灯は[/ruby]減り、闇は深まる。"
"52260-5" = "闇に覆われるほど露わになるは、己の内面。"
"52260-6" = "奇妙な物語のごとく、不可解なその心。"
"52260-7" = "世を包む噂、風説……怪談もまた、欲望を映す鏡でしかない。"
"52260-8" = "[log][ff4444]さぁ、暗闇の底に告げよ。[-][/log]"
"52260-9" = "[log][ff4444]お前は、どんな嘘の仮面を被っている？[-][/log]"
"52260-10" = "[log][ff4444]お前は、どんな欲望を抱え――[-][/log]"
"52260-11" = "[log][ff4444]なにから目を背けている？[-][/log]"
"52260-12-レンゲ" = "アタシは……。"
"52260-13-レンゲ" = "百花繚乱の正義を貫こうと稽古を頑張ってきたけど、不安もあった。"
"52260-14-レンゲ" = "少女マンガや小説には、いつだってキラキラした青春が広がっているのに、アタシは――"
"52260-15-レンゲ" = "青春を無駄にしているかもしれない、って。"
"52260-16-レンゲ" = "……とっくに、お前は知ってたんだろ？"
"52260-17-レンゲ" = "汗と火薬にまみれた日常なんて、青春とは程遠いって。"
"52260-18-キキョウ" = "私は……。"
"52260-19-キキョウ" = "百花繚乱の作戦参謀として、全てを正す義務があると思っていた。"
"52260-20-キキョウ" = "「百花繚乱を取り戻す」……その大義名分を盾にして、みんなに酷い言葉を投げつけた。"
"52260-21-キキョウ" = "いなくなった先輩を責めて、思い通りにならない現実を恨んだ……。"
"52260-22-キキョウ" = "そうやって……私が、百花繚乱を壊していたのに。"
"52260-23-ユカリ" = "身共は……。"
"52260-24-ユカリ" = "皆様に受け入れてもらえました。でも……いつだって身共は[ruby=・]誰[/ruby][ruby=・]か[/ruby]の代わりですの。"
"52260-25-ユカリ" = "勘解由小路の巫女も……百花繚乱の一員も……。"
"52260-26-ユカリ" = "誰も、本当の身共を求めていないのです。"
"52260-27-ユカリ" = "……いっそのこと、操り人形として生まれていれば。"
"52260-28" = "[ns] \"……みんなに、何をした？\""
"52260-29-コクリコ" = "ほう、やはりシャーレの先生に怪書の力は届かないか。#n厄介やねえ。"
"52260-30-コクリコ" = "……我は何もしておらぬよ。"
"52260-31-コクリコ" = "自らを見つめ直せるよう、その瞳を覆っただけ。"
"52260-32-コクリコ" = "しかし、己を[ruby=せいさつ]省察[/ruby]しただけで、心は脆く崩れるもの。"
"52260-33-コクリコ" = "所詮、人に人の心はわからぬものさ。"
"52260-34-コクリコ" = "たとえそれが……自分の心だとしても、ね。"
"52260-35" = "[s] \"理解できないとして、それの何が問題なの？\""
"52260-36" = "[ns1] \"理解できるまで、問い続ければいい。\"\n[ns2] \"だからみんな、寄り添って生きていき……。\"\n[ns3] \"互いから学ぶことをやめないんだよ。\""
"52260-37-コクリコ" = "ほう……この子らに希望を吹き込んだのは[ruby=おのし]御主[/ruby]かい？"
"52260-38-コクリコ" = "ならばそこで、じっくりと観ているがよいさ。"
"52260-39-コクリコ" = "そなたがこれまで説いてきた、空っぽの希望の行き先を――"
"52260-40-ナグサ" = "……私は。"
"52260-41-ナグサ" = "一人じゃ何もできない泣き虫。"
"52260-42-ナグサ" = "大切なものに手を伸ばしても、全てこぼれ落ちて……壊れていくのを眺めることしかできなかった。"
"52260-43-ナグサ" = "私は結局、アヤメになれなかった。"
"52260-44-ナグサ" = "……だって、私は御稜ナグサだから。"
"52260-45-ナグサ" = "すぐ壁にぶつかるし……何かのフリをすることしかできないけど。"
"52260-46-ナグサ" = "――だからって、諦めていいわけじゃない。"
"52260-47-ナグサ" = "コクリコ。あなたがどれだけ現実を見せようと、私の考えは変わらない。"
"52260-48-ナグサ" = "私は御稜ナグサ。"
"52260-49-ナグサ" = "――誰が何と言おうとも、アヤメの一番の友達！"
"52260-50-コクリコ" = "……そうかい、もう知っていたのかえ。"
"52260-51-コクリコ" = "己の脆さを……手を伸ばすことの無意味さを。"
"52260-52-コクリコ" = "それでも、この厳しい現実を変えて見せると[ruby=しょ]怪書[/ruby]を閉じたのかえ？"
"52260-53-コクリコ" = "……ほんとうに、わからぬねえ。"
"52260-54-ナグサ" = "……アヤメにも、これを見せたんでしょう？"
"52260-55-ナグサ" = "暗闇に閉じ込めて、囁き続けたんだ。"
"52260-56-ナグサ" = "だから、アヤメは絶望して逃げ出した。"
"52260-57-コクリコ" = "ご明察。誰もがうらやむ百花繚乱の委員長も、心折れて、我らに同調した。#nそんな彼女を……おまえさんは呼び戻せると？"
"52260-58-コクリコ" = "アヤメよりも弱い己が、彼女を助けられる……本当に、そう信じているのかえ？"
"52260-59-ナグサ" = "私は、そんなことできないよ。#nだって……アヤメじゃないから。"
"52260-60-ナグサ" = "でも……この手を、差しのべることはできる。"
"52260-61-アザミ" = "バカな……その右腕は、黄昏に呑まれたはず。"
"52260-62-アザミ" = "そんな小手先の奇術で、怪書を繰る私たちを貶めるつもりなら――"
"52260-63-ナグサ" = "もう一度聞くよ。"
"52260-64-ナグサ" = "アヤメはどこ？"
"52260-65-アザミ" = "ありえ……ない……。"
"52260-66-アザミ" = "枯れ木に花が咲かぬよう、黄昏に呑まれたものも取り戻せないはず……。"
"52260-67-アザミ" = "こ、コクリコ様……。"
"52260-68-コクリコ" = "必然は物語に骨子を、そして偶然は物語に興味を与える。"
"52260-69-コクリコ" = "黄昏の中から、まさか自身の影のみならず、他人に差し伸べた手をも掴むとは。#nおまえさんは、場をかき回す才があるねえ……。"
"52260-70-コクリコ" = "[ruby=そんなとこ]百花繚乱[/ruby]にいるよりも、よほど語り手向きやと思うよ。"
"52260-71-コクリコ" = "アヤメは今も天守閣の上で、おまえさんたちを見ている。"
"52260-72-コクリコ" = "万一、[ruby=・]そ[/ruby][ruby=・]の[/ruby][ruby=・]手[/ruby]が本当にアヤメへ届いたのならば。"
"52260-73-コクリコ" = "――少しだけ、我も違う物語に目を向けてみようかね。"
"52260-74" = "[ns] \"……待って！\""
"52260-75-ナグサ" = "逃げたね……。"
"52260-76-キキョウ" = "う、うわっ……！？い、今のはなんだ？"
"52260-77-キキョウ" = "すごく悪い夢を見ていた気がしますの……。"
"52260-78-キキョウ" = "コクリコ……花鳥風月部は？"
"52260-79-ナグサ" = "……消えたよ。止められなかった。"
"52260-80-ナグサ" = "でも今は、アヤメを探す方が大事だから。"
"52260-81-ナグサ" = "[USERNAME]先生。最後に一つ……お願いしていい？"
"52260-82-ナグサ" = "すこし危険かもしれないけど……私とアヤメの戦いを、見届けてほしいんだ。"
"52260-83" = "[s] \"何があっても見守るよ。\""
"52260-84-ナグサ" = "……ありがとう。"
"52260-85-ナグサ" = "じゃあ、行こうか。アヤメを、助けに。"
