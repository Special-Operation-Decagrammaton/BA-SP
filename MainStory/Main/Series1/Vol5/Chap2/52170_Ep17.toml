[translation]
"52170-1" = "第17話;委員長の帰還"
"52170-2-ニヤ" = "……会場設置の追加予算案。"
"52170-3-ニヤ" = "……お祭り安全管理者任命書。"
"52170-4-ニヤ" = "陰陽部補助金の監査結果報告書……。"
"52170-5-ニヤ" = "うう……ううぅっ……！"
"52170-6-ニヤ" = "どうして「和楽まつり」の前日に、こんな書類と格闘しているのでしょうか……？"
"52170-7-ニヤ" = "事務作業の全てをカホに投げ、街へ遊び……いえ、視察に行く計画が――"
"52170-8-チセ" = "それでは私たちはリハーサルへ行ってまいります。#nその間に溜まった稟議の処理、よろしくお願いしますね。"
"52170-9-チセ" = "行ってくるね～"
"52170-10-チセ" = "ええっ！？私も一緒に……！"
"52170-11-チセ" = "もちろん、ついてきていただいても構いません。"
"52170-12-カホ" = "返送期限の過ぎた和楽まつりの書類、稟議、その他の事務作業……すべて済ませてくださるのなら、ですけど。"
"52170-13-カホ" = "あううっ……！"
"52170-14-カホ" = "これまで、数々の職務怠慢に目を瞑ってきましたが……。"
"52170-15-カホ" = "ニヤ様の怠慢で、和楽まつりに影響が出るようなことがあれば……。"
"52170-16-カホ" = "今回ばかりは――ただじゃおきませんよ？"
"52170-17-チセ" = "カホの顔が怖い～"
"52170-18-チセ" = "わ、わかりました……。"
"52170-19-ニヤ" = "カホってば、前より勘が鋭くなったような……。"
"52170-20-ニヤ" = "あーあ、私もチセにゃんのリハーサル観たかったなぁ……。"
"52170-21-ニヤ" = "どこかに事務作業を後回しにできる口実、落ちていないかしら……。"
"52170-22-ニヤ" = "例えば突然の来客、とか……。"
"52170-23-ニヤ" = "ニヤ様、お忙しいところ申し訳ありません。"
"52170-24-陰陽部の部員" = "お客人です。なにやら至急の用件と……。"
"52170-25-ニヤ" = "おやっ、口実が……！"
"52170-26-陰陽部の部員" = "口実？"
"52170-27-ニヤ" = "い、いえ、こちらの話です。"
"52170-28-ニヤ" = "それにしても、こんな時期に来客とは……どちら様です？"
"52170-29-ニヤ" = "「和楽まつり」の見学を希望する学園でも？"
"52170-30-陰陽部の部員" = "いえ、それが……。"
"52170-31-陰陽部の部員" = "百花繚乱紛争調停委員会の委員長、[ruby=ななかど]七稜[/ruby]アヤメさんがいらっしゃいました。"
"52170-32-ニヤ" = "アヤメ委員長が……？"
"52170-33-アヤメ" = "お久しぶりです、ニヤ様。"
"52170-34-アヤメ" = "お元気でしたか？"
"52170-35-ニヤ" = "にゃは……元気ではあるけど、万事順調というわけでもないですねぇ。"
"52170-36-ニヤ" = "あなたが不在の間、百鬼夜行では[ruby=・]い[/ruby][ruby=・]ろ[/ruby][ruby=・]い[/ruby][ruby=・]ろ[/ruby]とあったものですから。"
"52170-37-アヤメ" = "委員長としての責務を放棄し、長らく席を空けたこと……本当に申し訳ありません。#nご迷惑をおかけしました。"
"52170-38-ニヤ" = "いえいえ、なんとか回っていましたから。ふふっ。"
"52170-39-ニヤ" = "それで……百花繚乱のみなさんが「アヤメ委員長」を探そうと、エビス分校に向かったのはご存知です？"
"52170-40-アヤメ" = "ええ。向こうでナグサたちと会いましたから。"
"52170-41-ニヤ" = "それなら何故、お一人で戻られたのですか……？"
"52170-42-ニヤ" = "それに……同行していたはずのシャーレの先生は？"
"52170-43-アヤメ" = "至急の要件というのが、まさにそれでして……。"
"52170-44-アヤメ" = "大雪原で花鳥風月部の本拠地を探している最中に、突然の雪崩に遭遇してしまったのです。"
"52170-45-アヤメ" = "私は運よく無事だったものの、みんなは今も雪の下にいます。#n一刻も早く救助隊を派遣していただきたく――"
"52170-46-ニヤ" = "……ふむ。一刻を争う事態ですね。"
"52170-47-ニヤ" = "聞いておりましたか？"
"52170-48-ニヤ" = "お呼びでしょうか、ニヤ様。"
"52170-49-ニヤ" = "今すぐ機動力の高い生徒を北部自治区の大雪原へ。#n百花繚乱のみなさんと[USERNAME]先生が遭難したとのことです。"
"52170-50-陰陽部の部員" = "は、はいっ！"
"52170-51-アヤメ" = "……迅速なご対応に感謝します。[ruby=・]さ[/ruby][ruby=・]す[/ruby][ruby=・]が[/ruby]ニヤ様ですね。"
"52170-52-ニヤ" = "いえいえ～陰陽部の長として当然のことです。"
"52170-53-アヤメ" = "では、私は部室に――"
"52170-54-ニヤ" = "失礼。"
"52170-55-ニヤ" = "お疲れのところ申し訳ないのですが、一つお尋ねしても？"
"52170-56-アヤメ" = "ええ、もちろん。"
"52170-57-ニヤ" = "遭難しているのは……百花繚乱の[ruby=・]全[/ruby][ruby=・]員[/ruby]と先生、ですか？"
"52170-58-アヤメ" = "……？#nそれはどういう意味ですか？"
"52170-59-アヤメ" = "ああ、ナグサやキキョウのことでしたら――"
"52170-60-ニヤ" = "いいえ、百花繚乱の委員長、[ruby=・]七[/ruby][ruby=・]稜[/ruby][ruby=・]ア[/ruby][ruby=・]ヤ[/ruby][ruby=・]メ[/ruby]さんのことです。"
"52170-61-ニヤ" = "あなたは彼女を模している――ただの「影」でしょう？"
"52170-62-アヤメ" = "何を……。"
"52170-63-ニヤ" = "まさか隠しきれているとでも？#n――こんなに邪気を振りまいておいて？"
"52170-64-ニヤ" = "それに……「死中にある仲間を置き去りにする七稜アヤメ」なんて――#nお笑い種にもなりません。"
"52170-65-ニヤ" = "それで、アヤメさんはどちらに？#n……百物語さん。"
"52170-66-？？？" = "……さすがはニヤ部長、か。#nこんなに早く気づかれるなんて。"
"52170-67-ニヤ" = "……！"
"52170-68-？？？" = "でも……困ったな。"
"52170-69-アヤメ" = "私、別に仲間思いじゃないんだよね。"
"52170-70" = "次回;同床異夢"
