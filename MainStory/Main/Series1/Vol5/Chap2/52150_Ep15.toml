[translation]
"52150-1" = "第15話;甘い夢の終わり"
"52150-2-アヤメ" = "ふあぁ……。"
"52150-3-ナグサ" = "どうしたの？あんまり寝れてない？"
"52150-4-アヤメ" = "うーん……夢を見たからかな？"
"52150-5-ナグサ" = "……悪い夢？"
"52150-6-アヤメ" = "そんなことない。いい夢だったよ。"
"52150-7-アヤメ" = "山積みの依頼もなくて、急な事件も起きたりしない、平和な世界……。"
"52150-8-ナグサ" = "じゃあ、なんでそんなに辛そうなの……？"
"52150-9-アヤメ" = "悪い夢は、覚めたら終わり……。"
"52150-10-アヤメ" = "でも、幸せな夢から覚めたら、現実と向き合わなきゃいけない。"
"52150-11-アヤメ" = "夢が恋しくなって、現実を否定したくなるのが辛い……。"
"52150-12-アヤメ" = "……って、なんかの映画で言ってた！"
"52150-13" = "いつも、アヤメの言う通りだね……。"
"52150-14" = "悪夢より、幸せな夢の方が苦しい。"
"52150-15" = "あれが夢なら……いっそ、永遠に……。"
"52150-16-？？？" = "……起きたみたいだね。"
"52150-17-ナグサ" = "……アヤメ？"
"52150-18-アヤメ" = "[ruby=・]久[/ruby][ruby=・]し[/ruby][ruby=・]ぶ[/ruby][ruby=・]り[/ruby]。ナグサ。"
"52150-19-ナグサ" = "ここは……。"
"52150-20-ナグサ" = "他のみんなは……？それに[USERNAME]先生は？"
"52150-21-アヤメ" = "大丈夫。隣の部屋にいるよ。"
"52150-22-アヤメ" = "みんな無事だよ。シャーレの先生は眠ってるけどね。"
"52150-23-ナグサ" = "今まで一緒にいたアヤメは……？"
"52150-24-ナグサ" = "それに「久しぶり」って……。"
"52150-25-アヤメ" = "「あれ」は、恐怖を餌とする百物語が作り出した何か。"
"52150-26-ナグサ" = "私はあの姿に、恐怖なんて……。"
"52150-27-アヤメ" = "そう？「あれ」はあなたの心が生んだのに。"
"52150-28-アヤメ" = "……本当は、とっくに気づいてたんでしょ？"
"52150-29-アヤメ" = "これは、いつか消えてしまう夢だって。それに、残酷な現実はすぐ目の前にあるってことも。"
"52150-30-ナグサ" = "そ、そんなこと……知らな……。"
"52150-31-アヤメ" = "もうたくさん！"
"52150-32-アヤメ" = "いつもいつもいつも言い訳して！誰かに頼って！"
"52150-33-アヤメ" = "いつまで続けるの？"
"52150-34-アヤメ" = "……ああでも、あの幻の言ったことは本当だよ？#n実際、私は限界を感じてクズノハ様を探しに行ったんだからね。"
"52150-35-アヤメ" = "「他人の欲望」に疲れてたんだ……あの時の私は。"
"52150-36-アヤメ" = "私はね、大嫌いだったんだよ……。"
"52150-37-アヤメ" = "一人じゃ何もできないからって、誰かに縋りつく連中が。"
"52150-38-アヤメ" = "偉そうに口では労うけど、また重荷を押しつけてくる奴らが。"
"52150-39-アヤメ" = "何かあると、すぐに泣き出すあんたが……。"
"52150-40-アヤメ" = "本当に、嫌いだった。"
"52150-41-アヤメ" = "でも、百花繚乱の委員長として「この現実」は守りたかった。だからクズノハ様を探しに行ったけど……そこにあったのは、何の役にも立たないおとぎ話だけ。"
"52150-42-アヤメ" = "だから、決めたの。百鬼夜行の大預言者がおとぎ話なら――#n怪書を使って、[ruby=ほんもの]現実[/ruby]にしてやるんだって。"
"52150-43-アヤメ" = "そして、私はみんなを見守る目を貰うんだ……。"
"52150-44-ナグサ" = "ダメだよ、アヤメ……きっとコクリコに騙されてるんだ。"
"52150-45-アヤメ" = "あんたには一生分からないよ。"
"52150-46-アヤメ" = "私がどんな気持ちで、みんなに笑顔を向けてたのか。"
"52150-47-ナグサ" = "そんなことない……そんなことないよ。今からでも話――"
"52150-48-アヤメ" = "よく言うよ。"
"52150-49-アヤメ" = "私から目を背けて、都合の良い「あれ」と楽しく過ごしてたくせに。"
"52150-50-ナグサ" = "アヤメ、私は……。"
"52150-51-アヤメ" = "言ったでしょ？"
"52150-52-アヤメ" = "私はあんたを――"
"52150-53" = "友達だと思ったことなんて、ない。"
"52150-54" = "次回;造花"
