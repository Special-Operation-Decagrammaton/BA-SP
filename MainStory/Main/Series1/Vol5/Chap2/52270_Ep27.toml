[translation]
"52270-1" = "第27話;つかんだ指先"
"52270-2-アヤメ" = "結局来たんだね、ナグサ。"
"52270-3-ナグサ" = "アヤメ、私は……。"
"52270-4-アヤメ" = "わざわざ説明しなくていい。"
"52270-5-アヤメ" = "全部[ruby=ここ]ヒトツメ[/ruby]から見てたから。"
"52270-6-アヤメ" = "理解だの、不可解だの……ほんと、くだらない。"
"52270-7-アヤメ" = "あんたが何を言おうと、私があんたを理解することはないと思う。"
"52270-8-アヤメ" = "相手が誰だろうと……別に、理解したくないから。"
"52270-9-ナグサ" = "アヤメ、私はわかってもらいたくて、ここに来たんじゃないよ。"
"52270-10-アヤメ" = "じゃあ、何？"
"52270-11-ナグサ" = "あなたが背負っているものを全部、渡してもらうために来たの。"
"52270-12-ナグサ" = "……百花繚乱紛争調停委員会、委員長。[ruby=ななかど]七稜[/ruby]アヤメ。"
"52270-13-ナグサ" = "百花繚乱の役目に背き、百鬼夜行を危険に晒すその所業、委員長の座にふさわしくないと判断した。"
"52270-14-ナグサ" = "――あなたに、継承戦を申し込む。"
"52270-15-アヤメ" = "言うようになったね、あの泣き虫が。"
"52270-16-ユカリ" = "一人で大丈夫なのかよ！"
"52270-17-ユカリ" = "そ、そうですわ！アヤメ先輩がお相手なら、全員で……！"
"52270-18-ナグサ" = "みんなで相手をしたところで、結果は変わらないと思う。"
"52270-19-ナグサ" = "レンゲとユカリは先生をお願い。"
"52270-20-ナグサ" = "それに……百花繚乱の継承戦には条件があるでしょ。"
"52270-21-ナグサ" = "継承戦の判断が公平であることを示すための、百花繚乱以外の立会い人が1人……。"
"52270-22-ナグサ" = "百花繚乱所属の幹部が1人。"
"52270-23-ナグサ" = "キキョウ、先生。継承戦の証人をお願い。"
"52270-24-キキョウ" = "……了解。"
"52270-25" = "[ns] \"喜んで。\""
"52270-26-アヤメ" = "ルールばっかり気にするとこ、相変わらずだね。"
"52270-27-アヤメ" = "でも……分かった、けじめは大事だから。"
"52270-28-アヤメ" = "百花繚乱紛争調停委員会委員長、七稜アヤメ。"
"52270-29-アヤメ" = "挑戦者、[ruby=ごりょう]御稜[/ruby]ナグサの継承戦を受けて立つ。"
"52270-30-ナグサ" = "……ぐっ！"
"52270-31-アヤメ" = "…………。"
"52270-32-レンゲ" = "すげえ……ナグサ先輩が、あのアヤメ委員長と互角にやりあってる。"
"52270-33-レンゲ" = "まだ安心はできませんが……このままいけば、もしかすると……！"
"52270-34-アヤメ" = "（どうして……前はすぐに倒せたはず）"
"52270-35-アヤメ" = "（ナグサのくせに……ナグサなんかに……！）"
"52270-36-ナグサ" = "……どうしてそんなに必死なの？"
"52270-37-アヤメ" = "必死……？"
"52270-38-アヤメ" = "必死なのはそっちでしょ、強がらないで。"
"52270-39-ナグサ" = "ちがう。あなたの動き、呼吸、表情……。"
"52270-40-ナグサ" = "その全部が「負けられない」って言ってる。前までのアヤメじゃない。"
"52270-41-アヤメ" = "はっ……手を抜くつもりがあったら、ハナから継承戦なんてやらないよ。"
"52270-42-ナグサ" = "まだ委員長の座に、未練があるの？"
"52270-43-ナグサ" = "じゃあ全部諦めて、戻ってくればよかったのに。"
"52270-44-アヤメ" = "諦める？"
"52270-45-アヤメ" = "地位も、望みも、真面目さも捨てたら、私に何が残るっていうの……？"
"52270-46-アヤメ" = "誰からも理解されず、誰からも認められなかったら、私は何のために生きればいいの！"
"52270-47-ナグサ" = "……理由なんていらない。"
"52270-48-ナグサ" = "……ただ、そこにいてくれれば。"
"52270-49-ナグサ" = "暖かい日差しが気持ちいい、抜けるような青空が綺麗……市場からおいしそうな香りがする……。"
"52270-50-ナグサ" = "ひとつひとつが、「今日も楽しかった。明日もきっと……」って思わせてくれる。#n理由なんて、探さなくてもいいんだよ。"
"52270-51-ナグサ" = "私は……アヤメがいるだけで、よかった。"
"52270-52-アヤメ" = "私は……。"
"52270-53-アヤメ" = "……成長したね、ナグサ。言葉で私を揺さぶろうだなんて。"
"52270-54-アヤメ" = "でも、そんな手は通じない。"
"52270-55-アヤメ" = "私の価値も、生きる理由も、ここで証明する――"
"52270-56-アヤメ" = "あーあ……これでおしまいか。"
"52270-57-アヤメ" = "おめでとう……ナグサ、これであんたが委員長だよ。"
"52270-58-アヤメ" = "今まで何百回も挑戦して、一度も勝てなかったあんたが……やっと私に勝ったんだ。"
"52270-59-アヤメ" = "胸を張りなよ。これが目標だったんでしょ？"
"52270-60-アヤメ" = "……ねえ。"
"52270-61-アヤメ" = "……なんで、そんな顔で泣いてるの？"
"52270-62-ナグサ" = "ごめんね……。"
"52270-63-ナグサ" = "本当にごめんなさい……アヤメ。"
"52270-64-ナグサ" = "今まであなたのことを、ちゃんと見れてなくて……ずっと隣で悲鳴を上げてたのに、聞こえなかった……。"
"52270-65-ナグサ" = "アヤメも、助けて欲しい、って、手を伸ばしてたことに気づけなかった……！"
"52270-66-ナグサ" = "アヤメはずっと苦しんでいたのに、頼ってばかりで……ごめんなさい。"
"52270-67-ナグサ" = "私は、アヤメに比べたら何にもないけど……この手だけは、絶対に……もう離さないよ。"
"52270-68-ナグサ" = "アヤメの苦しみも一緒に、抱えていくから……。"
"52270-69-ナグサ" = "本当に、本当にごめん……ね……アヤメ……。"
"52270-70-アヤメ" = "やっぱり、私は――"
"52270-71-アヤメ" = "あんたのその泣き顔が……大嫌いだったよ。"
"52270-72" = "次回;ともに芽吹きを待ち侘びて"
