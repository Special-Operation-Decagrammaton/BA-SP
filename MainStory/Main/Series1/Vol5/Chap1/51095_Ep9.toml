[translation]
"51095-1-ユカリ" = "……！"
"51095-2" = "[ns] \"ユカリ、大丈夫！？\""
"51095-3-ユカリ" = "そ、それでも……身共は……"
"51095-4-レンゲ" = "これで分かっただろ。アタシは帰らない。 "
"51095-5-レンゲ" = "百花繚乱は……#nアタシたちは――もう、元には戻れない。"
"51095-6-ユカリ" = "……。"
"51095-7-レンゲ" = "でも誤解しないでくれ、ユカリ。"
"51095-8-レンゲ" = "あんたはそもそもアタシたちとは違うんだ、百花繚乱に帰る必要なんてない。"
"51095-9-レンゲ" = "そうだろ？#nだって、お前には帰る場所が――"
"51095-10-ユカリ" = "…………！"
"51095-11-レンゲ" = "っ……！"
"51095-12" = "[s1] \"ユカリは、レンゲなら助けてくれると信じてここに来たんだ。\"\n[s2] \"もう少しだけ、話を聞いてあげてくれないかな？\""
"51095-13-レンゲ" = "いや……"
"51095-14-レンゲ" = "これ以上、話すことはない。"
"51095-15-レンゲ" = "ユカリ、先輩として一つ忠告させてくれ。"
"51095-16-レンゲ" = "無駄なことはやめて、今のうちに青春を楽しんでおいた方がいい。"
"51095-17-レンゲ" = "過去にしがみついていても、時間が無駄に過ぎるだけだ。"
"51095-18-レンゲ" = "……話はそれだけ。じゃあな。"
"51095-19-ミモリ" = "れ、レンゲちゃん！待ってください！"
"51095-20-カエデ" = "ああっ……ど、どうしようっ！？"
"51095-21-ツバキ" = "……先生、私たちはこれで。 "
"51095-22" = "[s] \"うん、みんなレンゲをよろしくね。\""
"51095-23-ユカリ" = "……レンゲ先輩。"
"51095-24" = "（ユカリは、レンゲと修行部の後ろ姿が見えなくなっても、その場から動けずにいた）"
"51095-25" = "次回;赤い頬"
