[translation]
"51050-1" = "第5話;自称えり～と少女、登場！"
"51050-2-ニヤ" = "ユカリ、ユカリ……#nふむ……どこかで聞き覚えがあるような。"
"51050-3-ニヤ" = "百花繚乱のユカリ……もしや、[ruby=かでのこうじ]勘解由小路[/ruby]家の……？"
"51050-4" = "[s] \"君はさっきの……？\""
"51050-5-ユカリ" = "あら？シャーレの先生が……どうしてこちらに？"
"51050-6-ユカリ" = "ハッ……！[ruby=みども]身共[/ruby]、気がついてしまいましたの。"
"51050-7-ユカリ" = "先ほど身共を助けてくださったのは、この展開を見越してだったのですね……！？"
"51050-8-ユカリ" = "先輩が仰っていた通り、「オレだよ！オレ！」の手口ですの！#nまさかそのような事をなさるだなんて……身共はしょっくです！"
"51050-9-ニヤ" = "おやおや、私の知らない間にお二人はなにやら複雑なご関係になったようで……？"
"51050-10" = "[s] \"いや、これは誤解で……\""
"51050-11-ニヤ" = "にゃはは～。それで、百花繚乱のユカリさんが――#n陰陽部にどんなご用で？"
"51050-12-ユカリ" = "そうでしたの！"
"51050-13-ユカリ" = "身共、あの噂を聞きまして！"
"51050-14-ユカリ" = "百花繚乱紛争調停委員会の副委員長……"
"51050-15-ユカリ" = "いえ、委員長代理のナグサ先輩が姿を現したと！"
"51050-16-ユカリ" = "……おや？"
"51050-17-カホ" = "……ちなみに、その話はどちらで？"
"51050-18-ユカリ" = "空が赤く染まった、あの日――"
"51050-19-ユカリ" = "身共たち百花繚乱は、陰陽部が事態を収拾すべく裏で動いていたという情報を入手しましたの。"
"51050-20" = "[s] \"一体どこでそれを……\""
"51050-21-カホ" = "……百花繚乱であれば、情報収集は容易いでしょう。#n彼女たちは独自の情報網を持っていますから。"
"51050-22-ニヤ" = "私たちも百花繚乱をマークしてるからねぇ。#n当然あちらも同じ。"
"51050-23-カホ" = "ニヤ様…………"
"51050-24-カホ" = "はぁ。"
"51050-25-ユカリ" = "それによれば、陰陽部は北部の大雪原にえーじぇんとを派遣したのだとか。"
"51050-26-ユカリ" = "百鬼夜行で数々の事件を解決してきた、陰陽部直属のえーじぇんと部隊……！"
"51050-27-ユカリ" = "伝説の――「特殊忍者隊」を！！"
"51050-28" = "[ns] \"微妙に話が大きくなってない……？\""
"51050-29-ユカリ" = "任務の詳細までは掴めておりませんが、一つ分かっているのは……"
"51050-30-ユカリ" = "派遣された部隊が、大雪原で「百花繚乱のどなたか」と会ったこと。"
"51050-31-ユカリ" = "ふっふ～ん！百花繚乱の調査能力にびっくりしたでしょう？"
"51050-32-ニヤ" = "にゃはは。混乱を招かないようにと、情報の管理は徹底していたのですが、そこまで知られているとは……なかなか優秀なようですね♪"
"51050-33-ユカリ" = "ええ！ええ！そうでしょうとも！キキョウ先輩の情報収集能力に敵うものなどおりませんの！"
"51050-34-ニヤ" = "なるほど～キキョウ……#n百花繚乱の2年生、作戦参謀の[ruby=きりゅう]桐生[/ruby]キキョウさんでしたっけ？"
"51050-35-ユカリ" = "ハッ……！先輩の名前を出してしまいました……い、今のは無しですの！"
"51050-36-ニヤ" = "まあ、あえて隠す必要はありませんし……そうですね、事実です。"
"51050-37-カホ" = "ニヤ様――"
"51050-38-ユカリ" = "まあまあ、カホ。#nもう過ぎたことだし、百花繚乱なら本当のことを知っても良いでしょう。"
"51050-39-ユカリ" = "では、本当に……！"
"51050-40-ニヤ" = "ええ。私たちは百花繚乱紛争調停委員会の副委員長、「[ruby=ごりょう]御稜[/ruby]ナグサ」さんと接触しました。"
"51050-41-ユカリ" = "……！"
"51050-42-ユカリ" = "それなら、むしろ話は早いですわ！#n身共、陰陽部にお願いがありますの！"
"51050-43-ニヤ" = "ふむ……？"
"51050-44" = "[s] \"ナグサに帰ってくるよう説得してほしい、とか……？\""
"51050-45-ユカリ" = "いいえ、違いますわ。"
"51050-46-ユカリ" = "身共が、百花繚乱の委員長になれるよう――"
"51050-47-ユカリ" = "[ruby=ひゃっかりょうらんけいしょうせん]「百花繚乱継承戦」[/ruby]の証人となってくださいまし！"
"51050-48" = "[ns] \"継承……戦？\""
"51050-49" = "[log=유카리]（「百花繚乱継承戦」とは……）[/log]"
"51050-50" = "（百花繚乱……それは紛争を調停する役割を担い、百鬼夜行の中でも選りすぐりの者だけが入れる由緒正しい委員会）"
"51050-51" = "（当然、上に立つ者には相応の能力が無くてはならない）"
"51050-52" = "（そこで、肩書に見合わない者が上にいると幹部クラスが判断した場合――）"
"51050-53" = "（委員会のメンバーであれば、誰でも「継承戦」を申し込んで、その座を奪うことができる！それが「百花繚乱継承戦」である！）"
"51050-54" = "[ns] \"百花繚乱って、そんな下剋上制度があるんだ！？\""
"51050-55-ニヤ" = "ふむぅ……やりたい事は分かりましたが、どうして継承戦を……？"
"51050-56-ユカリ" = "身共の口からこれを申し上げるのは大変心苦しいのですが……"
"51050-57-ユカリ" = "現在の百花繚乱は、誰の目から見ても「委員会」とは呼べない状態にあります。"
"51050-58-ユカリ" = "その原因は……本来であれば、百花繚乱の中心に立つべきナグサ先輩が…… "
"51050-59-ユカリ" = "……委員長代理のナグサ先輩が、席を空けたがゆえ。#n委員長の不在ゆえなのです！"
"51050-60-ニヤ" = "ふむ……"
"51050-61-ユカリ" = "百花繚乱の解散令を耳にし……"
"51050-62-ユカリ" = "お風呂でどうすればいいのかと考えていた時に……！"
"51050-63-ユカリ" = "そう！キラッ！とひらめいてしまったのです！ "
"51050-64-ユカリ" = "その昔、＜噂＞で聞いていた継承戦のことを！！"
"51050-65" = "[s] \"そんなに行われるわけじゃないんだ？\""
"51050-66-カホ" = "はい。「継承戦」は、百花繚乱の教範に載っているものの、そう何度も行われるものではないため……"
"51050-67-カホ" = "入学したばかりのユカリさんが、今まで目にしてこなかったのも不思議ではありません。"
"51050-68-ユカリ" = "でありますゆえ！今の状況を覆す……突破口になるかもしれない方法を知った以上、身共は決心したのです！"
"51050-69-ユカリ" = "百花繚乱のえりーとであり！期待の超新星であるユカリが！"
"51050-70-ユカリ" = "継承戦でナグサ先輩を倒し、委員長の座を見事、引き継いでみせますの！"
"51050-71-ユカリ" = "そうすれば、全ては丸く収まるはず……#nゆえに、どうか……身共にお力を貸してほしいのです！"
"51050-72" = "[s] \"えっと、でもナグサは委員長代理なんだよね……？\""
"51050-73-カホ" = "はい。百花繚乱の現委員長は[ruby=ななかど]七稜[/ruby]アヤメさんです。"
"51050-74-カホ" = "御稜ナグサさんは、あくまで副委員長に過ぎませんので。"
"51050-75-ニヤ" = "ふむ……それでもナグサさんに継承戦を申し込む理由をお聞きしても？"
"51050-76-ユカリ" = "アヤメ委員長は……随分と前に百花繚乱を離れました。"
"51050-77" = "[s] \"……どのくらい前から？\""
"51050-78-ユカリ" = "身共が百花繚乱に入ったのとほぼ同時期ですから、約10ヶ月ほど前のことです。"
"51050-79-ユカリ" = "アヤメ委員長は、百花繚乱に代々受け継がれている[ruby=あかし]「証」[/ruby]をナグサ先輩に継承しました。それきり、姿をくらましたのです。"
"51050-80-ユカリ" = "本来なら、証を受け取ったナグサ先輩が委員長の座に就くところですが……"
"51050-81-ニヤ" = "なぜかナグサさんは拒否し、代理に落ち着いた、と…… "
"51050-82-ニヤ" = "何か理由でもあるのでしょうか？"
"51050-83-ユカリ" = "…………身共は何も存じませぬ。"
"51050-84-ユカリ" = "アヤメ委員長とは、あまり話す機会が無かったのですが……"
"51050-85-ユカリ" = "あの方が決めた事に、1年生の身共たちが何か口を出すことはできません。"
"51050-86-ユカリ" = "アヤメ先輩の決断を、レンゲ先輩やキキョウ先輩は受け入れました。"
"51050-87-ユカリ" = "ただ、ナグサ先輩は最後まで受け入れず……アヤメ先輩が委員長でなければダメだ、と。"
"51050-88-ユカリ" = "そうして、委員長はどこかへと行方をくらませ、ナグサ先輩だけが……。"
"51050-89-ユカリ" = "……こんな暗い話はおしまい！"
"51050-90-ユカリ" = "大事なのは、未来！ふゅ～ちゃ～、です！"
"51050-91-ユカリ" = "全ては、この超天才えりーとのユカリが委員長になれば解決ですの！"
"51050-92-ユカリ" = "そう――これより、百花繚乱のユカリ伝説が幕を開けるのです！"
"51050-93-ユカリ" = "……と言いたいところですが、残念ながら継承戦は身共の意志だけではできません。"
"51050-94" = "[s] \"継承戦には、何か特別な条件があるの？\""
"51050-95-ニヤ" = "はい、仰る通りです。"
"51050-96-ニヤ" = "誰でも自由に継承戦ができるのなら、皆こぞって立候補するでしょう？#nある程度のルールは必要ですから。"
"51050-97-カホ" = "継承戦を行うには、最低でも2名以上の承認を得なくてはなりません。"
"51050-98-カホ" = "継承戦の判断が公平であることを示すために、百花繚乱所属の幹部が1人と――"
"51050-99-ユカリ" = "百花繚乱以外の立会い人が1人。"
"51050-100" = "[s] \"公平性を担保するためのルールなんだね。\""
"51050-101-カホ" = "にゃはは。継承戦は代々、陰陽部が立ち会ってきました。"
"51050-102-ニヤ" = "一応、百鬼夜行の中では、一目置かれる立場でして♪"
"51050-103-カホ" = "とはいえ、現在の百花繚乱は「解散令」が出されている状態です。"
"51050-104-カホ" = "このタイミングで「継承戦」を行うのは……"
"51050-105-ユカリ" = "きっと、間違っているのです。"
"51050-106-カホ" = "ほう……？"
"51050-107-ユカリ" = "だって、キキョウ先輩もレンゲ先輩も……それに他の皆様も。"
"51050-108-ユカリ" = "百花繚乱を愛する人がいる限り、解散令なんてあり得ませんわ。"
"51050-109" = "[s] \"……。\""
"51050-110-ニヤ" = "なるほどねぇ……"
"51050-111-ニヤ" = "つまり、解散令なんてあり得ないから、継承戦は問題なくできる、と……"
"51050-112-ユカリ" = "ええ、おふこーすですわ！"
"51050-113-ニヤ" = "――であれば、一つ。確認しても？"
"51050-114-ユカリ" = "……？"
"51050-115-ニヤ" = "ユカリさんもご存じの通り、現在の百花繚乱は機能しておりません。これは純然たる事実。"
"51050-116-ニヤ" = "そんな中、「継承戦」を行えば、外部からは「百花繚乱の混乱に乗じて委員長の座に就いた」と思われる可能性があります。"
"51050-117-ニヤ" = "その上、陰陽部の手も借りるとなると……"
"51050-118-ニヤ" = "要は、私たちに反乱の片棒を担がせようとしている事になるわけですが。"
"51050-119-ニヤ" = "――その認識はお有りですか？"
"51050-120-ユカリ" = "……うっ！"
"51050-121-ユカリ" = "そこまでは考えが及んでおりませんでした……。"
"51050-122-ユカリ" = "まさか、そのように受け取られてしまうだなんて……"
"51050-123-ユカリ" = "……で、ですが！"
"51050-124-ユカリ" = "それでも…… "
"51050-125-ユカリ" = "……それでも、身共は。"
"51050-126-ニヤ" = "……理解した上で力を借りたいということは。"
"51050-127-ニヤ" = "……[ruby=かでのこうじ]勘解由小路[/ruby]家の者としての[ruby=・   ・   ・]お願い[/ruby]でしょうか？"
"51050-128-ユカリ" = "……っ！！"
"51050-129-ユカリ" = "…………。"
"51050-130-ユカリ" = "いいえ、違いますわ。"
"51050-131-ユカリ" = "これは……"
"51050-132-ユカリ" = "ただのユカリ……身共[ruby=・   ・]個人[/ruby]としてのお願いです。"
"51050-133-ニヤ" = "……なるほど。"
"51050-134-ユカリ" = "しかし、周りからそのように見られる可能性があるのなら……"
"51050-135-ユカリ" = "陰陽部が困ってしまうのなら、身共は……"
"51050-136-ニヤ" = "なーんて。普段であれば「危ない橋は渡れませんねぇ」と断ったと思いますが～"
"51050-137-ニヤ" = "にゃははっ、ユカリさんは幸運ですねぇ。"
"51050-138-ユカリ" = "へ……？"
"51050-139-ニヤ" = "ちょうどここに、あなたの悩みを見て見ぬ振りなどできないお方がいらっしゃいまして……"
"51050-140-カホ" = "ニヤ様……！ "
"51050-141-ユカリ" = "あらぁ？私、何か間違ったことでも言いましたっけ、先生？"
"51050-142" = "[s] \"まぁ……間違ってはいないけど……\""
"51050-143-ユカリ" = "……？？どういう、意味でしょうか……？"
"51050-144-ニヤ" = "「シャーレの先生」が立ち会うのであれば、少なくとも政治的な問題は避けられる、ということですよ。にゃはっ。"
"51050-145-カホ" = "ニヤ様……これ以上、私たちの事情で先生にご迷惑をおかけするのは……"
"51050-146-ユカリ" = "まぁまぁ、カホったら……そんな怖い顔しなくても。"
"51050-147-ニヤ" = "先生なら、生徒のお願いを断るはずないですし……ねぇ？"
"51050-148" = "[s] \"ユカリが困っているなら、それくらいお安い御用だよ。\""
"51050-149-ユカリ" = "……！"
"51050-150-ニヤ" = "うふふ、それは良かったです。#nシャーレの名は、全てのバランスをひっくり返せるほどの力がありますからねぇ♪"
"51050-151-ニヤ" = "では、「立会い人」はシャーレの[USERNAME]先生にお願いするとして……"
"51050-152-ニヤ" = "ま、シャーレに突っかかる人は居ないと思いますが……#n万が一に備えて、私も立会い人をいたしましょう。"
"51050-153-ニヤ" = "これで……ご満足、いただけましたか？"
"51050-154-ニヤ" = "は、はいっ！もちろん……！"
"51050-155-ユカリ" = "お心遣いに感――"
"51050-156-ニヤ" = "――ただし。"
"51050-157-ニヤ" = "これはシャーレの存在があってこその特例であること[ruby=ゆめゆめ]、努々お[/ruby]忘れなく。"
"51050-158-ユカリ" = "……ええ！"
"51050-159-ユカリ" = "心に留めておきますわ。"
"51050-160-ユカリ" = "はぁ……分かりました。"
"51050-161-ユカリ" = "それでは手続きを進めますので、ユカリさんはこちらへ……"
"51050-162-ユカリ" = "チセちゃんもこちらに。"
"51050-163-ユカリ" = "うん～#nそれじゃ先生、またね～"
"51050-164-ニヤ" = "にゃはは～、これは何とも絶妙なタイミングでしたねぇ。#n良かった良かった。"
"51050-165" = "[s] \"こうなると分かっていたから私を呼んだの？\""
"51050-166-ニヤ" = "ん～？何を仰っているのやら、さっぱりですねぇ。"
"51050-167-ニヤ" = "たまたま偶然が重なったといいますか、タイミングの問題といいますか。"
"51050-168-ニヤ" = "利害が一致しているのなら、手を取らない理由は無いでしょう？#n後はまあ、単純に面白いんじゃないかなぁと。"
"51050-169-ニヤ" = "……それに、百花繚乱に近づけば、クズノハを知る良い機会になるかな、と思いましてねぇ。"
"51050-170" = "[s] \"ニヤは初めから、そこまで読んで……？\""
"51050-171-ニヤ" = "にゃは～、どうでしょうねぇ。"
"51050-172-ニヤ" = "少なくとも、一方的に迷惑をかけ続ける状態からは脱却できそうかな～なんて。"
"51050-173-ニヤ" = "もらってばかりの関係ですと、やりづらいですし？"
"51050-174" = "[ns] \"……ありがとう。\""
"51050-175-ニヤ" = "あらあら、それはこちらの台詞ですよ。んふふ。"
"51050-176-ニヤ" = "……どうか百鬼夜行をお願いしますね、先生。"
"51050-177" = "次回;次の目的地"
