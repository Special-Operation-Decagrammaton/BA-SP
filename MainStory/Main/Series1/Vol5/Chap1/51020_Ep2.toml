[translation]
"51020-1" = "第2話;思いがけない出会い（１）"
"51020-2" = "[ns] \"……いつもとなんだか雰囲気が違うような。\""
"51020-3" = "（百鬼夜行連合学院の自治区に到着すると、街中を彩る提灯が目に入った）"
"51020-4-？？？" = "この目で！[ruby=みども]身共[/ruby]は見たんですの！"
"51020-5" = "[ns] \"……ん？\" "
"51020-6-チンピラA" = "だから、知らないっつってんだろ。"
"51020-7-チンピラA" = "こっちが財布を盗った証拠でもあんのか？"
"51020-8-？？？" = "証拠は……ありません……#nですが、身共は本当に……！"
"51020-9-村の住民" = "もういいよ、お嬢さん。"
"51020-10-村の住民" = "お祭りの準備で忙しいだろうに、気を遣わせてしまってすまないのう。"
"51020-11-村の住民" = "失くしてしまったものは仕方あるまい。"
"51020-12-チンピラB" = "ほら、本人もいいって言ってんだろ！#nもう行っていいよなぁ？"
"51020-13-チンピラB" = "言いがかりつけたんだから、謝るくらいしたらどうだ？ハハッ！"
"51020-14-チンピラA" = "ここまで俺らに突っかかってきたんだからなぁ？"
"51020-15-？？？" = "そ、そんな……！！"
"51020-16-？？？" = "…………。"
"51020-17-ユカリ" = "……やはり、見て見ぬ振りはできません！"
"51020-18-ユカリ" = "このお方が良いと仰っても、お天道様は見ていますのよ！"
"51020-19-チンピラB" = "なっ、なんだよ。やんのか？"
"51020-20-チンピラB" = "痛い目を見なきゃ分かんねぇようだな！"
"51020-21" = "[ns] \"すみません、何かトラブルですか？\""
"51020-22-チンピラB" = "チッ！一体今度は誰だ！？"
"51020-23-チンピラB" = "これ以上、邪魔をしようってんなら――"
"51020-24-ユカリ" = "隙あり！"
"51020-25-チンピラA" = "おわっ！？"
"51020-26-ユカリ" = "……お財布、ありましたの！"
"51020-27-村の住民" = "なんと……本当にあの若者たちが……"
"51020-28-チンピラB" = "お、おい！なに落としてんだよ！"
"51020-29-チンピラA" = "クソッ……おい、お前ら！来い！"
"51020-30-ユカリ" = "……あら？"
"51020-31-チンピラたち" = "騒ぎが大きくなる前に黙らせてやる……！"
"51020-32-ユカリ" = "わわっ！？この方々、一体どこから来ましたの！？"
"51020-33-ユカリ" = "あなた様は……？"
"51020-34" = "[s] \"手伝うよ。\""
"51020-35-ユカリ" = "……！"
"51020-36-ユカリ" = "はい！"
