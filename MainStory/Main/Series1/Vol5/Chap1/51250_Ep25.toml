[translation]
"51250-1" = "第25話;今あなたに"
"51250-2-ナグサ" = "っ……！"
"51250-3-キキョウ" = "……逃げたか。"
"51250-4-レンゲ" = "今のは何だったんだ……？#n本を破ったと思ったら、突然……！"
"51250-5-ユカリ" = "すごい音がして、身共びっくりしてしまいました……！"
"51250-6" = "[s] \"もしかしたらアレも百物語だったのかも……。\""
"51250-7-レンゲ" = "んー……追いかけるのは無理そうだな。"
"51250-8-レンゲ" = "何だあの意味わかんないヤツ！#nってか花鳥風月部って何者なんだ！？"
"51250-9" = "[s1] \"とりあえず、今は怪我の手当てをしよう！\"\n[s2] \"みんな大丈夫？怪我は？\""
"51250-10-レンゲ" = "ああ、こっちは大丈夫だ。ユカリは？"
"51250-11-ユカリ" = "身共もバッチリですわ！ "
"51250-12" = "[s] \"キキョウとナグサは……\""
"51250-13-キキョウ" = "……。"
"51250-14-ナグサ" = "……。"
"51250-15-レンゲ" = "えーと……。"
"51250-16-キキョウ" = "ナグサ先輩……さっき言ってたことだけど……。"
"51250-17-ナグサ" = "……うん。"
"51250-18-キキョウ" = "……いや、何でもない。"
"51250-19-ナグサ" = "…………そっか。"
"51250-20-レンゲ" = "…………。"
"51250-21" = "[s] \"…………。\""
"51250-22-レンゲ" = "（ひそひそ）先生、アタシの口から言うのもなんだけどさ……"
"51250-23-レンゲ" = "（ひそひそ）あの2人……ちょっとギクシャクしすぎじゃないか？"
"51250-24" = "[s] \"（ひそひそ）それ、言っちゃう！？\""
"51250-25-レンゲ" = "で、でもさ……！"
"51250-26-レンゲ" = "元凶は一応倒し……てはないけど、逃げたし！"
"51250-27-レンゲ" = "は、ハッピーエンド！とまではいかなくても、そろそろ帰る雰囲気になるんじゃないかなって……"
"51250-28-レンゲ" = "ずっとここにいるわけにもいかないし……先生、ちょっと何とかしてくんない？"
"51250-29" = "[s] \"うーん、そう言われても……。\""
"51250-30-ユカリ" = "こほん。"
"51250-31-ユカリ" = "ナグサ先輩、キキョウ先輩、レンゲ先輩。#nそして……先生。"
"51250-32" = "[ns] \"ユカリ？\""
"51250-33-ユカリ" = "この一日、本当に数え切れないほどの出来事がありました。"
"51250-34-ユカリ" = "そのせいで、たくさんの方にご迷惑をかけて……そして手助けいただいたおかげで、身共もここまでこれました。"
"51250-35-ユカリ" = "本当に運よく、皆様とこうして向き合えたのだと思っております。"
"51250-36-ユカリ" = "誠に……ありがとう存じます。"
"51250-37-キキョウ" = "ううん……むしろ……"
"51250-38-レンゲ" = "最後まで諦めずにいてくれたユカリに、アタシたちが感謝したいくらいっていうか……"
"51250-39-ナグサ" = "ユカリ……私の方、こそ……"
"51250-40" = "[s] \"みんなが努力した結果だよ。\""
"51250-41-ユカリ" = "ええ！それに、せっかくこうして皆様とまた集まれたのですし……"
"51250-42-ユカリ" = "身共、皆さんの前でナグサ先輩に伝えたいことがありますの！"
"51250-43-ユカリ" = "この[ruby=かでのこうじ]勘解由小路[/ruby]ユカリ、ナグサ先輩に継承戦を申し込みます！！"
"51250-44" = "[ns] \"…………え？\""
"51250-45-レンゲ" = "え、今……！？"
"51250-46-ユカリ" = "はい！これは大切なことですので！"
"51250-47-ユカリ" = "レンゲ先輩、キキョウ先輩も覚えていらっしゃいますよね？#n元はといえば、身共はナグサ先輩に継承戦を申し込むためにここまで来たのです！"
"51250-48" = "それは、そう、だけど……"
"51250-49" = "[s] \"でも、今から継承戦はナグサも……\""
"51250-50-ナグサ" = "うん、分かった。"
"51250-51-キキョウ" = "マジか！？"
"51250-52-キキョウ" = "……先輩？"
"51250-53-ナグサ" = "本来の目的がそうなら、ちゃんとしないとね。"
"51250-54-ナグサ" = "百花繚乱紛争調停委員会の委員長代理、[ruby=ごりょう]御稜[/ruby]ナグサ……"
"51250-55-ナグサ" = "勘解由小路ユカリの挑戦に、受けて立つ。"
"51250-56-ユカリ" = "……はい！"
"51250-57" = "[ns] \"では……始め！\""
"51250-58-ユカリ" = "きゃううん！？"
"51250-59" = "[ns] \"あっ、えっと……勝者、御稜ナグサ！\""
"51250-60-キキョウ" = "わわっ、一瞬じゃん。"
"51250-61-キキョウ" = "薄々予想はしてたけど……相手はナグサ先輩だし#n……まぁ、当然の結果だよね。 "
"51250-62-ナグサ" = "もしかして……空気読めてなかった……？"
"51250-63" = "[s3] \"ううん、勝負の世界は厳しいからね。\"\n[s4] \"だからユカリもあまり落ち込まずに――\""
"51250-64-ユカリ" = "ユカリ！復活！ですの！！"
"51250-65" = "[s] \"全っ然落ち込んでなかったね！？\""
"51250-66-ユカリ" = "落ち込む……？"
"51250-67-ユカリ" = "ふふっ、先生ったら。"
"51250-68-ユカリ" = "身共は全力で戦いに挑み、敗北したのです。"
"51250-69-ユカリ" = "それこそ完璧な勝負でしたわ。身共がこれに納得できない理由などありません。"
"51250-70-ユカリ" = "ええ！当然の結果！ということですの！"
"51250-71-ユカリ" = "この戦いを通して、今一度ナグサ先輩が身共の憧れであると、確かめたかっただけですゆえ！！"
"51250-72-ナグサ" = "そ、そっか……。"
"51250-73-ユカリ" = "はい！！"
"51250-74-レンゲ" = "それならいいけどさ……うん、なんというか。"
"51250-75-キキョウ" = "本当、ユカリらしいね。"
"51250-76" = "[s] \"……そうだね。\""
"51250-77-ユカリ" = "えへへ……それでは、皆様！早く戻りましょう！"
"51250-78-ユカリ" = "百花繚乱に…… "
"51250-79-ユカリ" = "身共たちの、家に――！"
"51250-80" = "次回;願いを込めて"
