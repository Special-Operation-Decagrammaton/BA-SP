[translation]
"51240-1" = "第24話;普通のこと"
"51240-2-ナグサ" = "アヤメにとって、恥ずかしくない人でありたかった。"
"51240-3-ナグサ" = "本当の姿を知られるのが怖くて、アヤメに相応しい人を……演じてた。"
"51240-4-ナグサ" = "気がついたら、みんなが私を見ていた。"
"51240-5-ナグサ" = "それが怖かったの。"
"51240-6-ナグサ" = "自分はそんな人間じゃないのに、みんなが自分のことを買い被って、誤解して…… "
"51240-7-ナグサ" = "アヤメに引けを取らないって。優秀ですごい人だって。"
"51240-8-ナグサ" = "私は、アヤメに恥じない人になりたかっただけなのに。 "
"51240-9-ナグサ" = "そのために必死に取り繕っていた……だけなのに。"
"51240-10" = "[ns] \"それで十分なんじゃないかな。\""
"51240-11-ナグサ" = "…………！？"
"51240-12-シュロ" = "………………何ですって？"
"51240-13" = "[ns1] \"偽りの自分を演じて……\"\n[ns2] \"偽りの自分が受け入れられることの、何が悪いのかな。\""
"51240-14" = "[ns3] \"偽りだとしても、それを演じ続けていけば、\"\n[ns4] \"いつしかそれは本当になる。\""
"51240-15" = "[ns5] \"誰だって……\"\n[ns6] \"自分[ruby=つくろ]を繕う[/ruby]ものだよ。\""
"51240-16" = "[ns] \"誰もがやる、普通のこと。\""
"51240-17-シュロ" = "…‥！？"
"51240-18-シュロ" = "ハッ……！そんな屁理屈がまかり通るとでもぉ？"
"51240-19-シュロ" = "嘘はどこまでいっても嘘。#nだからこそ多くの人間が傷つき、悲劇を招くのです。"
"51240-20" = "[s] \"本人にとっては嘘だったとしても、他人の視点では違うかもしれないよ。\""
"51240-21" = "（例えば、ユカリとナグサが出会った時のように）"
"51240-22-ナグサ" = "ケガは？"
"51240-23-ナグサ" = "悪事を目の当たりにしても[ruby=ひる]怯[/ruby]まないその姿勢。"
"51240-24-ナグサ" = "すごく、格好良かったよ。"
"51240-25-ユカリ" = "……！"
"51240-26-ナグサ" = "あとは私たちに任せて。それじゃ。"
"51240-27" = "（例えば、みんなと過ごした時のように）"
"51240-28-ナグサ" = "レンゲは優秀な子。私みたいな半人前なんかよりも、ずっと。"
"51240-29-ナグサ" = "そんなレンゲを誇らしく思ってる。#nね、ユカリもそう思うでしょ？"
"51240-30-ユカリ" = "ええ！ "
"51240-31-キキョウ" = "ユカリ、今のはナグサ先輩よりもレンゲが優秀だって言ってるんだけど。"
"51240-32-ユカリ" = "ハッ……！？"
"51240-33-ユカリ" = "ちょっ！聞いてるこっちが恥ずかしくなるからやめてくれないか！？"
"51240-34-ユカリ" = "アタシより強いナグサ先輩にそんな事言われても素直に喜べないって！"
"51240-35-ナグサ" = "……ふふっ。"
"51240-36" = "（例えば、百花繚乱を離れると決心した時のように）"
"51240-37-ナグサ" = "キキョウ、あなたは優秀。#n百花繚乱の作戦参謀として、みんながあなたを頼りにしてる。"
"51240-38-ナグサ" = "他のメンバーだけじゃなく……私もそう。"
"51240-39" = "[ns] \"最初は「演技」だったのかもしれない。でも、ナグサはそのおかげで――\""
"51240-40" = "[ns7] \"誰よりも3人のことを……\"\n[ns8] \"よく知っている人になれた。\""
"51240-41" = "[ns] \"そう……ナグサが憧れていた誰かのように、ね。\""
"51240-42-シュロ" = "…………！！！"
"51240-43" = "[s] \"演技だとしても、取り繕っていただけだとしても、いいじゃん。\""
"51240-44-シュロ" = "結果、互いを憎み合い攻撃することになっても！？"
"51240-45-シュロ" = "傷つき、絶望に暮れ、憎み合うと分かっているのに、そんな[ruby=ざれごと]戯言[/ruby]を――"
"51240-46" = "[s9] \"たしかに、それでいがみ合ったり……\"\n[s10] \"ケンカするかもしれない。\""
"51240-47" = "[ns] \"後ろ指差されたり、傷つくこともあると思う。\""
"51240-48" = "[ns] \"そういうのも含めて、誰にだってあることだよ。\""
"51240-49" = "[ns11] \"ケンカをしたのなら、仲直りできるよう努力すればいい。\"\n[ns12] \"私も、そのために全力でみんなの力になるよ。\""
"51240-50-シュロ" = "………………なぁにそれ。"
"51240-51-シュロ" = "くっだらない……ああ！ああ！反吐が出そうな理想論……"
"51240-52-シュロ" = "そんなの風流でも何でもない！最悪な物語ですぅ！！"
"51240-53-シュロ" = "「百物語」を侮辱する最低最悪の屁理屈なんてぇ……#n全部、ぜ～んぶめちゃくちゃにして差し上げますよぉ……"
"51240-54-シュロ" = "まずは先生、[ruby=てめぇ]手前[/ruby]から――"
"51240-55-？？？" = "そうはさせませんの！"
"51240-56" = "[ns] \"ユカリ……！\""
"51240-57-シュロ" = "ハァ？……気がついたんですかぁ？[ruby=カタシロ]無貌の形代[/ruby]に呑まれていたのにぃ？#n……どうやって？"
"51240-58-ユカリ" = "暗闇の中で――声が聞こえてきましたの。"
"51240-59-ユカリ" = "先生と…… "
"51240-60-ユカリ" = "ナグサ先輩の声が――ハッキリと。"
"51240-61-ユカリ" = "ええ！身共、[ruby=かでのこうじ]勘解由小路[/ruby]ユカリ、ここに復活！ですの！！"
"51240-62-シュロ" = "ハ？なに言ってんの？"
"51240-63-シュロ" = "忘れたんですぅ？そこにいるヤツらが[ruby=てめぇ]手前[/ruby]を拒絶して、果ては[ruby=てめぇ]手前[/ruby]の気持ちを[ruby=むげ]無碍[/ruby]にしたってこと。"
"51240-64-シュロ" = "それゆえに「[ruby=カタシロ]無貌の形代[/ruby]」は生まれたんですよぉ……？"
"51240-65-シュロ" = "なのに今更なんなんですぅ！？"
"51240-66-ユカリ" = "何も傷ついていないといえば、嘘になりますわ！"
"51240-67" = "[s] \"ユカリ……。\""
"51240-68-ユカリ" = "胸が痛くて張り裂けそうなのも、事実ですの！"
"51240-69-ユカリ" = "でも、ぼんやりとした意識の中で聞こえてきた先生の声――"
"51240-70-ユカリ" = "そのおかげで……！今更ながら、気づくことができたのです。"
"51240-71-シュロ" = "気づく……？何を？"
"51240-72-ユカリ" = "それらが――「普通」であることに。"
"51240-73-ユカリ" = "嘘をついたのはナグサ先輩だけではありません。"
"51240-74-ユカリ" = "身共だって同じなのです。"
"51240-75-ユカリ" = "そしてレンゲ先輩も……キキョウ先輩だってそう。"
"51240-76-ユカリ" = "表と裏の姿……恐怖をごまかすため、人のため――#nもしくは自分を騙すためかもしれません。"
"51240-77-ユカリ" = "それで傷つく人も、それを偽善だと罵る人も、火種となってケンカすることだってあるでしょう。"
"51240-78-ユカリ" = "ですが、それは――身共だけじゃない。#n皆様、同じなのだと。"
"51240-79" = "[s] \"……うん。\""
"51240-80-シュロ" = "はぁあ……？"
"51240-81-ユカリ" = "喧嘩したのなら仲直りすればいい――そうおっしゃっていただけるのなら！"
"51240-82-ユカリ" = "身共はその言葉を受け入れようと思いますの！"
"51240-83-ユカリ" = "お互いを深く傷つけてしまったかもしれません……#nですが、身共は仲直りしたいのです！"
"51240-84-ユカリ" = "皆様と仲直りして――あの時の百花繚乱に戻りたいのです！"
"51240-85-シュロ" = "そんな子供じみた台詞を、よくもまぁ……！"
"51240-86-ユカリ" = "[ruby=やぶき]箭吹[/ruby]シュロ――でしたね？"
"51240-87-ユカリ" = "このユカリ！百花繚乱の皆を守るため、あなたに決闘を申し込みますわ！"
"51240-88-ユカリ" = "百花繚乱のえり～ととしての、身共の決意ですの！"
"51240-89-シュロ" = "はは……そう……お好きになさればいいんじゃないですぅ？"
"51240-90-シュロ" = "[ruby=てめぇ]手前[/ruby]から生まれた[ruby=カタシロ]無貌の形代[/ruby]は、まだここに残っていますから……！ "
"51240-91-シュロ" = "これがあれば、嘘つきナグサも、愚かな先生も、身の程知らずの小娘も――"
"51240-92-シュロ" = "――み～んな！"
"51240-93-シュロ" = "……へ？"
"51240-94-レンゲ" = "どりゃぁぁぁあっ！！来たぞ！！！"
"51240-95-レンゲ" = "……ユカリ、大丈夫！？"
"51240-96-ユカリ" = "…………あ。"
"51240-97-ユカリ" = "あああっ！！レンゲ先輩、キキョウ先輩！！！"
"51240-98-レンゲ" = "ふぅ……間に合ってよかった……。"
"51240-99" = "[s] \"2人ともどうやってここに！？\""
"51240-100-レンゲ" = "他のヤツらが助けてくれてさ。#nアタシたちだけ先に来れたんだ。"
"51240-101-キキョウ" = "で、今は激戦真っ最中って感じ？"
"51240-102-キキョウ" = "……花鳥風月部の、[ruby=やぶき]箭吹[/ruby]シュロ。"
"51240-103-キキョウ" = "百花繚乱の作戦参謀として忠告するよ……大人しく降参して。"
"51240-104-シュロ" = "はっ……"
"51240-105-シュロ" = "はは――"
"51240-106-シュロ" = "アッハハハハッ！"
"51240-107-シュロ" = "まさかここに来て、こ～んな薄っぺらい物語にしてしまうだなんて！"
"51240-108-シュロ" = "……いいでしょう。やれるところまでやってみましょうか！"
"51240-109-シュロ" = "手前の「百物語」を――こんな支離滅裂なものにしてしまうくらいなら……"
"51240-110-シュロ" = "今からでもぜぇんぶリセットして！最初からやり直しますよぉ！"
"51240-111-シュロ" = "全て終わりにしてしまえ！"
"51240-112-シュロ" = "百花繚乱を滅茶苦茶に――！！"
"51240-113-レンゲ" = "キキョウ……ユカリ、先生！"
"51240-114" = "[s] \"うん、いくよ！\""
"51240-115-キキョウ" = "ここまで来たからには、引き下がれない。"
"51240-116-ユカリ" = "全力で！参りますの！"
