[translation]
"51120-1" = "第12話;桐生キキョウと継承戦（１）"
"51120-2" = "（次の日）"
"51120-3-ユカリ" = "せんっせーっ！ "
"51120-4-ユカリ" = "ごきげんよう！ふふっ！"
"51120-5" = "[s] \"おはよう、ユカリ。調子はどう？\""
"51120-6-ユカリ" = "調子と言いますと……身共の健康ですか？それとも気分でしょうか！ "
"51120-7-ユカリ" = "いずれにせよ……"
"51120-8-ユカリ" = "身共は絶好調ですの！"
"51120-9-ユカリ" = "さあ！こうしている場合ではありませぬ。今日はと～っても重要な日なのです！"
"51120-10-ユカリ" = "今日はキキョウ先輩とお会いし、継承戦の証人をお願いするのですから……！"
"51120-11-ユカリ" = "ええ！そうすれば、みっしょんこんぷりーとっ！"
"51120-12-ユカリ" = "[ruby=かでのこうじ]勘解由小路[/ruby]ユカリ伝説の始まりですの～！"
"51120-13" = "[s] \"キキョウってどんな子なの？\""
"51120-14-ユカリ" = "うふふっ、流石は先生！#n事前にりさーちする[ruby=すき]隙[/ruby]の無さ！"
"51120-15-ユカリ" = "キキョウ先輩を一言で表すのなら……とっても理性的で、論理的……それでいて合理的なお方ですの！"
"51120-16-ユカリ" = "どんな感じか、と言いますと――"
"51120-17-ユカリ" = "ユカリ。前にも言ったよね。"
"51120-18-ユカリ" = "ご、ごくり……！"
"51120-19-キキョウ" = "アイスは1日に1つまでって。まさか忘れたの？"
"51120-20-ユカリ" = "もっ、もちろんです……！しかしキキョウ先輩……！"
"51120-21-キキョウ" = "言い訳はいらない。#nそもそも、寝る直前に食べるのは身体に良くないでしょ。"
"51120-22-キキョウ" = "ちゃんと、歯磨きしてる？"
"51120-23-ユカリ" = "ももも、もちろんですの！！"
"51120-24-ユカリ" = "今日は疲れてるから、うがいだけでもいいかしら……なんて全然思って――"
"51120-25-キキョウ" = "そっか。今日から毎日、歯磨きチェックするから。"
"51120-26-ユカリ" = "へぇっ！？！？"
"51120-27-ユカリ" = "――ということがありましたの。"
"51120-28-ユカリ" = "そんなキキョウ先輩なら、きっとお力を貸してくださるはず！"
"51120-29" = "[ns] \"ユカリがキキョウを信頼しているのはよく伝わったよ。\""
"51120-30-ユカリ" = "ふふっ。"
"51120-31-ユカリ" = "そうなのです！"
"51120-32-ユカリ" = "では！さっそく参りましょう！！"
"51120-33-ユカリ" = "キキョウ先輩！身共、参りましたわ！"
"51120-34-ユカリ" = "お邪魔いたします！"
"51120-35" = "百花繚乱調停室"
"51120-36-シズコ" = "あ、あれっ……？せ、先生！？"
"51120-37-ユカリ" = "…………？"
"51120-38" = "[s] \"シズコ？どうしてここに……？\""
"51120-39-キキョウ" = "ユカリ？"
"51120-40-ユカリ" = "キキョウ先輩！ご無沙汰しておりますの！"
"51120-41-キキョウ" = "ああ……うん。そうだね、久しぶり。相変わらず元気そうでなにより。"
"51120-42-キキョウ" = "タイミングはあんまり良くないけど……"
"51120-43-キキョウ" = "ひょっとして、運命のイタズラなのかな。"
"51120-44-ユカリ" = "……？"
"51120-45-キキョウ" = "今日は先客が居てね。"
"51120-46-ユカリ" = "先客……"
"51120-47" = "[ns] \"二人は何の話をしてたの？\""
"51120-48-シズコ" = "こほんっ、それはですね……"
"51120-49-シズコ" = "なんとこの度、皆さんと力を合わせて「百鬼夜行燈籠祭」を復活させることになりまして……！"
"51120-50-シズコ" = "あっ、すでにご存じでしたか……？#n大変そうだけど、応援してる……？"
"51120-51-シズコ" = "えへへ～っ。"
"51120-52-シズコ" = "先生がそう言ってくださるだけで、シズコは……！"
"51120-53-シズコ" = "……って、そうじゃなくて！#nそれはそれで嬉しいですが、今は喜んでいる場合じゃ！"
"51120-54-シズコ" = "ともかく！お祭りのクライマックスで、#n「[ruby=かでのこうじ]勘解由小路[/ruby]家の巫女様」のお力を借りたいと思ってるんです。"
"51120-55" = "[s] \"勘解由小路家の巫女様……？\""
"51120-56-ユカリ" = "……あ。"
"51120-57-キキョウ" = "勘解由小路家――それは代々、百鬼夜行連合学院で行われる祭儀や行事など重要な役目を担ってきた一族。"
"51120-58-キキョウ" = "その立場は、いまさら説明するまでもないかな。#n百鬼夜行の誰もが、その名を知っているほどの名家だよ。"
"51120-59-シズコ" = "その通り！"
"51120-60-シズコ" = "実際に二十年前のお祭りでも、舞を担当したのが勘解由小路家だったのです。"
"51120-61-シズコ" = "記録によれば、二十年前は祭儀が行なわれずじまいだったようで……"
"51120-62-シズコ" = "今回のお祭りこそ、巫女さまにお願いできればと思い、連絡したのですが……"
"51120-63-シズコ" = "まだお返事をいただけてなくて……ご自宅に伺ってもご不在で……。"
"51120-64" = "[s] \"つまり、シズコが百花繚乱にきた理由は……\""
"51120-65-シズコ" = "はい、このまま待っていても仕方ないので！ "
"51120-66-シズコ" = "百花繚乱に勘解由小路の巫女様が居ると聞いて、こちらに伺ったんです！"
"51120-67-シズコ" = "そういうことみたいだよ、[ruby=・   ・   ・   ・   ・]勘解由小路[/ruby]ユカリさん。"
"51120-68-シズコ" = "あっ！もしや先生の隣の方が勘解由小路さんなんですか！？"
"51120-69-シズコ" = "ちょうど良かった！私たちお祭り運営委員会と一緒に――"
"51120-70-ユカリ" = "み、身共は……"
"51120-71-ユカリ" = "……ごくっ。"
"51120-72-ユカリ" = "申し訳ございません、お祭り運営委員会の委員長殿。#n身共はお力添えできませぬ。"
"51120-73-シズコ" = "……ええっ！？"
"51120-74-シズコ" = "ど、どうしてですか？"
"51120-75-ユカリ" = "身共は……"
"51120-76-ユカリ" = "百花繚乱でありたいのです。"
"51120-77-ユカリ" = "そのために、キキョウ先輩にお力添えいただきたいのです。"
"51120-78-キキョウ" = "……どういうこと？"
"51120-79-ユカリ" = "キキョウ先輩、身共はナグサ先輩に「継承戦」を申し込む予定ですの。"
"51120-80" = "つい先日――「解散令」を出されたと耳にしました。"
"51120-81" = "…………。"
"51120-82" = "あれは本当なのでしょうか？#n皆様、どうすれば良いのかと混乱しております。"
"51120-83" = "……ユカリ。"
"51120-84" = "ですので、これ以上その噂が広がる前に！"
"51120-85-ユカリ" = "この勘解由小路ユカリが……「継承戦」でナグサ先輩に勝利し、この事態を収めてみせますの！"
"51120-86-キキョウ" = "……それで陰陽部や私の元に、か。"
"51120-87-ユカリ" = "ええ！ですのでキキョウ先輩、継承戦の証人になっていただけないでしょうか？"
"51120-88-ユカリ" = "身共が、百花繚乱紛争調停委員会を元に戻してみせますの！"
"51120-89-キキョウ" = "なるほどね。「解散令」を耳にしたら、すぐに飛んでくると思ってたけど……"
"51120-90-キキョウ" = "……まさか「継承戦」とは。"
"51120-91-キキョウ" = "あんたらしいと言えばあんたらしいけど……流石にそれは想像できなかったな。"
"51120-92-キキョウ" = "……言いたいことは分かったよ。"
"51120-93-ユカリ" = "……！"
"51120-94-ユカリ" = "それでは、キキョウ先輩……！"
"51120-95-キキョウ" = "うん、言葉にするまでもないかもしれないけど――"
"51120-96-キキョウ" = "――断る。"
"51120-97-シズコ" = "あっ、えっ？ど、どうして……！？"
"51120-98" = "[s] \"……えっ。\""
"51120-99-ユカリ" = "な、何故ですかキキョウ先輩！？"
"51120-100-ユカリ" = "先輩は、今もこうして調停室に居るくらいですから、#n当然……当然、身共の考えにも……！"
"51120-101-キキョウ" = "同意すると思ったの？"
"51120-102-キキョウ" = "それなら言わせてもらうけど……"
"51120-103-キキョウ" = "あんた、[ruby=うぬぼ]自惚[/ruby]れすぎじゃない？"
"51120-104-ユカリ" = "……！！"
"51120-105-キキョウ" = "私もナグサ先輩の件は聞いてる。あの人がどこで姿を現したか、どういう経緯で陰陽部と接触したのかも。"
"51120-106-キキョウ" = "でも、答えは変わらないよ。"
"51120-107-キキョウ" = "あの人は――百花繚乱に帰ってこない。"
"51120-108-キキョウ" = "いや……たしかに一度、帰ってきたといえばそうかもしれないね。"
"51120-109-キキョウ" = "アヤメ委員長から受け取った「証」を――返却するために。"
"51120-110" = "[ns] （レンゲが言ってたのは、この事だったんだ）"
"51120-111-ユカリ" = "ナグサ先輩が……「証」を、返却……？#nそ……そんなはずは……"
"51120-112-ユカリ" = "だって、ナグサ先輩は……"
"51120-113-キキョウ" = "……レンゲは、あんたのことを思って話さなかったんだろうね。"
"51120-114-キキョウ" = "けど私は違う。事実から目を背けるべきではないもの。"
"51120-115-キキョウ" = "私たちを見捨てたあの人を、もう百花繚乱だと思わない方がいい。"
"51120-116-ユカリ" = "ですが……"
"51120-117-ユカリ" = "それでも……！"
"51120-118-キキョウ" = "なら、仮にあんたが望む通り「継承戦」を行うとして――"
"51120-119-キキョウ" = "ナグサ先輩を倒して、委員長の座を引き継ぐ。#nその考え自体は立派だと思うよ。"
"51120-120-キキョウ" = "ただ、何か忘れてるんじゃないの？"
"51120-121-ユカリ" = "……！"
"51120-122-キキョウ" = "あんたが――"
"51120-123-キキョウ" = "ナグサ先輩に勝てるとでも？"
"51120-124-キキョウ" = "あの人は強いよ。"
"51120-125-キキョウ" = "あんたよりも、ずっと。 "
"51120-126-ユカリ" = "いいえ……！"
"51120-127-ユカリ" = "身共は……身共は……勝てますわ！"
"51120-128-ユカリ" = "身共は……"
"51120-129-ユカリ" = "百花繚乱の、えりーと……ですから……！"
"51120-130-キキョウ" = "私にも勝てないのに？"
"51120-131-ユカリ" = "や、やってみなければ分かりませんの！"
"51120-132-ユカリ" = "分かりました……そこまで仰るのであれば、ここで身共の実力を証明してみせましょう！"
"51120-133-ユカリ" = "キキョウ先輩、あなたに模擬戦を申し込みます！"
"51120-134-キキョウ" = "――分かった。"
"51120-135-キキョウ" = "そんなに言うなら、あんたを夢から覚まさせてあげる。"
"51120-136-キキョウ" = "私に「継承戦」を申し込めばいい。"
"51120-137-ユカリ" = "…………え？"
"51120-138-ユカリ" = "忘れたなんて言わせないよ。"
"51120-139-キキョウ" = "百花繚乱の正義は、力の優劣で決まる。"
"51120-140-キキョウ" = "どうしても認めさせたいのなら、私をねじ伏せるといい。"
"51120-141-ユカリ" = "……！！"
"51120-142" = "[s] \"待って。二人とも、まずは落ち着いて……\""
"51120-143-シズコ" = "あ、あうっ……せ、先生……"
"51120-144-シズコ" = "も、もしかして私……とんでもないタイミングで来ちゃったんでしょうか！？"
"51120-145-ユカリ" = "わ……分かり、ましたわ。"
"51120-146-ユカリ" = "であれば、この勘解由小路ユカリ……#nキキョウ先輩に「継承戦」を申し込みます！"
"51120-147-キキョウ" = "挑戦者、勘解由小路の継承戦を受諾し、ここに宣言する。"
"51120-148-キキョウ" = "委員長の座ではなく「作戦参謀」の座を賭けたこの継承戦は、シャーレの[USERNAME]先生を立会い人とし――また、本来であればもう一人証人が必要であるが…… "
"51120-149-キキョウ" = "お互いの合意のもと行なわれる戦いであることを考慮し、今回のみ特例とする。"
"51120-150-キキョウ" = "よって、百花繚乱のメンバーである勘解由小路ユカリ、そして桐生キキョウ。互いを証人とみなし実施する。"
"51120-151-キキョウ" = "異論は？"
"51120-152-ユカリ" = "ございませんわ。"
"51120-153-キキョウ" = "――じゃあ、始めよう。"
