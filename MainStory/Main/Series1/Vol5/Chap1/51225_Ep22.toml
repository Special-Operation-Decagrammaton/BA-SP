[translation]
"51225-1-ユカリ" = "んん……ここは……？"
"51225-2-ユカリ" = "アハッ、お目覚めですかぁ？"
"51225-3-ユカリ" = "あなたは……？"
"51225-4-シュロ" = "あらあら、ざんね～ん。#nもうお忘れなのですかぁ？"
"51225-5-シュロ" = "手前は……手前さんの代理人です。 "
"51225-6-シュロ" = "手前さんの「感情」を手前さん方に伝えるための……[ruby=怪談家]語り手[/ruby]。"
"51225-7-ユカリ" = "感情……？"
"51225-8-シュロ" = "「手前さんのその感情――そのままそ～っくり返してやりたい――そうは思いませんかぁ？」"
"51225-9-ユカリ" = "まさ、か……。 "
"51225-10-シュロ" = "ほらほら、こっちをご覧なさい？#nとてもとて～も、美しい景色でしょ？"
"51225-11-ユカリ" = "え……？"
"51225-12-ユカリ" = "これは……どうして、お祭り会場が……！"
"51225-13-シュロ" = "アハハハッ、素晴らしいでしょ？"
"51225-14-シュロ" = "ああ、ああ！なんという風流……！#n手前、と～っても気に入ってるんです。"
"51225-15-ユカリ" = "どうして……こんな非道な事を……！"
"51225-16-シュロ" = "あらあら、そんな寂しい事、言わないでくださいなぁ。"
"51225-17-シュロ" = "まるでぜ～んぶ、手前一人でやったみたいじゃないですかぁ。"
"51225-18-ユカリ" = "……え？"
"51225-19-シュロ" = "手前はただ、巫女様の感情を代わりに伝えただけですよぉ？"
"51225-20-シュロ" = "見えませんか？#n手前さんの前にいる、ソレ。"
"51225-21-シュロ" = "手前さんが吐き出した…… "
"51225-22-シュロ" = "胸の奥底から溢れた――「感情」ですよぉ？"
"51225-23-ユカリ" = "……！！"
"51225-24-ユカリ" = "あ……あ……"
"51225-25-ユカリ" = "これが……身共の……"
"51225-26-ユカリ" = "身共から、生まれた……感情？"
"51225-27-ユカリ" = "っ……！"
"51225-28-シュロ" = "見ているだけで感じとれるでしょ？ "
"51225-29-シュロ" = "その中に渦巻く煙……燃え上がる炎。"
"51225-30-シュロ" = "全身を埋め尽くす、深く鮮烈な――感情が！"
"51225-31-シュロ" = "これも……ぜ～んぶ、手前さんのおかげですよ。巫女様。"
"51225-32-ユカリ" = "身共の、おかげ……？"
"51225-33-シュロ" = "ええ、ええ。理解できます。"
"51225-34-シュロ" = "誰も私の声に耳を傾けてくれない……誰も私のことなんて分かってくれない……！"
"51225-35-シュロ" = "他人は、私の気持ちも声も願いさえも、踏みにじっていくだけ。"
"51225-36-シュロ" = "正しい選択をしなさい、と自分の願いと欲を押しつけるだけ。"
"51225-37-シュロ" = "だから――苦しかったのでしょ？疲れてしまったのでしょ？"
"51225-38-ユカリ" = "あ……う……"
"51225-39-シュロ" = "だから……ぜ～んぶ、投げ出してしまいたかったのでしょ？"
"51225-40-シュロ" = "自分の意見には耳を傾けず、取り合ってもくれない彼女らに――そんな言葉を浴びせる者に向かって――"
"51225-41" = "[log][ff4444]＜――全部燃えてしまえばいい＞[-][/log]"
"51225-42-シュロ" = "と……思ったのでしょ？"
"51225-43-ユカリ" = "み……身共は……"
"51225-44-シュロ" = "アハハハッ！"
"51225-45-シュロ" = "アレは、そんな手前さんの記憶と感情の狭間から生まれた、顔を持たない[ruby=かたしろ]形代[/ruby]。"
"51225-46-シュロ" = "名を付けるとすれば…… "
"51225-47-シュロ" = "そうですねぇ、「[ruby=むぼう]無貌[/ruby]の[ruby=かたしろ]形代[/ruby]」……とでも呼びましょかぁ。"
"51225-48-シュロ" = "アレなら手前さんの望み通り……百鬼夜行を隅々まで焼け野原にしてくれますよぉ？#nそう！美しくも儚い絶景を！"
"51225-49-シュロ" = "ええ、ええ！実に素晴らしい風流となってくれるでしょう。"
"51225-50-ユカリ" = "ああ――"
"51225-51" = "街が燃えている。"
"51225-52" = "地を這う紅蓮の炎。"
"51225-53" = "遠くから聞こえる誰かの悲鳴。"
"51225-54" = "これは全部――自分のせいだ。 "
"51225-55" = "一瞬でも自分が、あんなことを思ってしまったせいで。"
"51225-56" = "百花繚乱を夢見て、本来の責務から逃げ出して――"
"51225-57" = "……百花繚乱としての自分を描いて、その姿を演じようとしたせいで下った、罰。"
"51225-58-ユカリ" = "（……そっか）"
"51225-59-ユカリ" = "（身共のせいで……）"
"51225-60-ユカリ" = "あれは……[ruby=身　共　の　間　違　い]身共から生まれたもの[/ruby]なんだ。"
"51225-61-シュロ" = "あらあらぁ？気を失ってしまいましたかぁ。 "
"51225-62-シュロ" = "面白くないですねぇ。宴はこれからだというのに。"
"51225-63-シュロ" = "ま、構いませんか。巫女様、手前さんの役目はもう終わり。#nここからは手前の番です。"
"51225-64-シュロ" = "役者も舞台も整った――"
"51225-65-シュロ" = "ついに、コクリコ様が望んだ……"
"51225-66-シュロ" = "手前だけの「百物語」が……！"
"51225-67-シュロ" = "完成するのです――"
"51225-68" = "[ns] \"そこまでだよ、シュロ！\""
"51225-69-ナグサ" = "ユカリを、返してもらう……！"
"51225-70-シュロ" = "……興醒めですねぇ？"
"51225-71" = "次回;偽りの言葉"
