[translation]
"51010-1" = "第1話;プロローグ"
"51010-2-アラタ" = "ど、どこだ！？#nあいつは一体どこに……！"
"51010-3-魑魅一座A" = "……！"
"51010-4-魑魅一座B" = "リーダー！後ろっす！"
"51010-5-アラタ" = "ちっ、逃すか！"
"51010-6-アラタ" = "へっ！どんなもんだい！"
"51010-7-魑魅一座A" = "リーダーすごい！これなら……！"
"51010-8-魑魅一座B" = "いや、あいつはまだ……！"
"51010-9-魑魅一座たち" = "ぐ、ぐあああっ！？"
"51010-10-ナグサ" = "――ここまで。#n観念して、[ruby=すだまいちざ]魑魅一座[/ruby]。"
"51010-11-アラタ" = "なっ……あたしらは何も……！"
"51010-12-ナグサ" = "何も……？"
"51010-13-ナグサ" = "さっきまで色んな人に迷惑かけてた。"
"51010-14-魑魅一座B" = "失礼な！言いがかりだ！"
"51010-15-魑魅一座B" = "あたしらはリーダーの偉大なる計画のために、動いていただけだ！"
"51010-16-魑魅一座B" = "リーダー！例の計画を教えてやりましょうよ！"
"51010-17-魑魅一座B" = "計画を聞いたら、驚きすぎて腰抜かしても知らないかんな！"
"51010-18-ナグサ" = "……？"
"51010-19-アラタ" = "あっ、いや。なんていうか……#nそこまで持ち上げられると困るんだけど……"
"51010-20-アラタ" = "「来週のお祭り前に好き勝手暴れる計画」を始めようと……"
"51010-21-ナグサ" = "…………。"
"51010-22-アラタ" = "まあ、みんなが乗り気じゃないなら、やめようと思ってたというか……"
"51010-23-魑魅一座B" = "これぞ！我らがリーダーの完璧なる計画！"
"51010-24-魑魅一座B" = "邪魔なんかさせねぇっすよ！！"
"51010-25-アラタ" = "や、やっぱりこの計画、すごいんだな……？"
"51010-26-ナグサ" = "久しぶりに帰ってきたけど……相変わらずだね。"
"51010-27-ナグサ" = "でも、私の目に入ったからには…… "
"51010-28-ナグサ" = "これ以上、思い通りにはさせない。"
"51010-29-アラタ" = "うっ……！"
"51010-30-アラタ" = "ま、待てよ！"
"51010-31-アラタ" = "私たちの邪魔をするあんたは何者なんだ！"
"51010-32-魑魅一座A" = "ん……？"
"51010-33-魑魅一座A" = "あの水色の羽織……"
"51010-34-魑魅一座B" = "あっ、やっぱり！#nあいつ、「百花繚乱」っすよ！"
"51010-35-アラタ" = "何っ！？"
"51010-36-アラタ" = "百花繚乱ってことは――"
"51010-37-ナグサ" = "違う。"
"51010-38-魑魅一座A" = "ま、まだ最後まで言ってないんだけど――！？"
"51010-39-ナグサ" = "あなた達の想像とは違う。"
"51010-40-ナグサ" = "これは……"
"51010-41-ナグサ" = "……ただの、コスプレだから。"
"51010-42-ナグサ" = "「アレ」を返しに来た以上……"
"51010-43-ナグサ" = "私は……もう、百花繚乱ではないのだから。"
"51010-44" = "シャーレ・執務室"
"51010-45" = "（いつも通りシャーレの仕事を片付けていると……）"
"51010-46" = "[ns] \"はい、シャーレです。\""
"51010-47-ニヤ" = "にゃはは。先生、ご無沙汰しております～"
"51010-48-ニヤ" = "いかがお過ごしでしょうか？"
"51010-49" = "[s] \"事務作業をしていたところだよ。\""
"51010-50" = "（デスクに広げられている書類はどれも、「各自治区の被害状況」や「支援予算の運用指針」など直近の出来事に関連しているものだった）"
"51010-51-ニヤ" = "なるほど～#n先日、百鬼夜行からもお送りしたアレですね。"
"51010-52-ニヤ" = "色々……ありましたからねぇ。"
"51010-53" = "[ns] \"それはそうと……一体どうしたの？\""
"51010-54-ニヤ" = "ああ、そうでしたそうでした。"
"51010-55-ニヤ" = "先生は相変わらず、お忙しそうに働かれてるみたいですし～？"
"51010-56-ニヤ" = "そんな仕事三昧の先生のために！#n私も何かお役に立てないかと思い……少し考えてみたのです。"
"51010-57" = "[s] \"お気遣いありがとう……？\""
"51010-58-ニヤ" = "んふふ……よろしければ、百鬼夜行にいらっしゃいませんか？"
"51010-59-ニヤ" = "もうすぐお祭りが開催されるんですよ。"
"51010-60-ニヤ" = "たまには息抜きするのも大事ですし、#n気分転換がてら楽しんでいただけたらな～と思いましてね。"
"51010-61-ニヤ" = "それに、こちらの近況もお伝えしておきたいですし……#nちょ～っぴり個人的なお願いもあるといいますか～"
"51010-62" = "[s] \"個人的なお願い？\""
"51010-63-ニヤ" = "ふふっ。#n百鬼夜行に来たら、愛らし～いチセにゃんをなでなでできますよ？"
"51010-64-チセ" = "にゃー？"
"51010-65-チセ" = "にゃははは～♪"
"51010-66-ニヤ" = "それでは、お待ちしておりますねぇ。"
"51010-67" = "[ns] \"……百鬼夜行。\""
"51010-68-クズノハ" = "「色彩」によって反転した者を元に戻す方法など、存在せぬ。"
"51010-69-クズノハ" = "其れは――死者が生き返らないのと同様に。#nこの世界の絶対的なルールである。"
"51010-70-クズノハ" = "だがそれでも……助けたい者が居ると申すのなら、"
"51010-71-クズノハ" = "――妾を訪ねてくりゃれ。"
"51010-72" = "[ns] \"もしかしたら、彼女の手がかりを得られるかも……\""
"51010-73" = "次回;思いがけない出会い（１）"
