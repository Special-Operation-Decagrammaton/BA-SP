"51245-4" = "[ns] （キリがない上に、攻撃の勢いが……強い！）"
"51245-5-シュロ" = "黙れ。"
"51245-6-シュロ" = "黙れ黙れ黙れ黙れ！"
"51245-7-シュロ" = "全部ぜ～んぶ無駄。[ruby=てめぇ]手前[/ruby]らが何しようと倒せやしない。"
"51245-8-シュロ" = "いくら言葉を並べ立てたって……"
"51245-9-シュロ" = "物語をぶち壊そうとしたって……"
"51245-10-シュロ" = "言ったはずですよねぇ……物語の絶対的な前提は変えられない。"
"51245-11-シュロ" = "資格がなければ、百物語は倒せない――"
"51245-12-シュロ" = "そういう物語だと――最初から既に決まっているのですから。"
"51245-13-シュロ" = "……そう。"
"51245-14-シュロ" = "百花繚乱の委員長――アヤメがここに居ない以上！"
"51245-15-シュロ" = "[ruby=てめぇ]手前[/ruby]らもアヤメと同じように、全員「黄昏」に堕としてや――！"
"51245-16-シュロ" = "……はぁ？"
"51245-17-シュロ" = "なに？なんなんですぅ……？"
"51245-18-シュロ" = "ねぇ、どういうことですかぁ？"
"51245-19-シュロ" = "窮地に、追い込まれてたでしょ？ねえ。"
"51245-20-シュロ" = "何回も何回も、[ruby=てめぇ]手前[/ruby]の心を折ったじゃない。"
"51245-21-シュロ" = "なのに――"
"51245-22-シュロ" = "ちょっと、鏡見たらどうですぅ？#n情けないその姿――"
"51245-23-シュロ" = "足元は震えて、顔は涙でぐっちゃぐちゃ。"
"51245-24-シュロ" = "今にも逃げ出したくてたまらないくせに……"
"51245-25-シュロ" = "何をそんな「委員長」にでもなったみたいに……#nねえ、ナグサちゃんさぁ……！！"
"51245-26-シュロ" = "今更、どんなツラ下げてアヤメの真似してるの？"
"51245-27" = "[log=나구사ND]私はアヤメじゃない。[/log]"
