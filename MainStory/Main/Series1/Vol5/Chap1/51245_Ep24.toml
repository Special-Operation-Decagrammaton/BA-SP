"51245-145-シュロ" = "ナグサ、ちゃん……！"
"51245-146-シュロ" = "ナ～グ～サ～ちゃぁああああああん！！！！！"
"51245-147-シュロ" = "そう……いいですよぉ。もう、どうでもいい……#n正直、気に入らないですけどぉ……"
"51245-148-シュロ" = "今回は[ruby=てめぇ]手前[/ruby]らの勝ちってことにしてあげる……！#nええ、ええ！そういう結末だって納得してあげましょ。"
