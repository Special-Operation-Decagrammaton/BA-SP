"51245-120-シュロ" = "アレなら……！！"
"51245-121-シュロ" = "……無い？……どうして？"
"51245-122-ユカリ" = "[ruby=カタシロ]無貌の形代[/ruby]なら、もうここには居ませんわ。"
"51245-123-ユカリ" = "これ以上身共の感情を、あなたの思い通りになんてさせない。#nそう心に決めましたの。"
"51245-124-シュロ" = "[ruby=かでのこうじ]勘解由小路[/ruby]、ユカリ……。"
"51245-125-ユカリ" = "はい。この勘解由小路ユカリ。"
"51245-126-ユカリ" = "百花繚乱紛争調停委員会の一員として…… "
"51245-127-ユカリ" = "[ruby=やぶき]箭吹[/ruby]シュロ――あなたを逮捕しますの！"
"51245-128-シュロ" = "！！"
