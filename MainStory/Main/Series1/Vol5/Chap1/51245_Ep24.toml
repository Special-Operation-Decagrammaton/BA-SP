"51245-115-シュロ" = "[ruby=てめぇ]手前[/ruby]の攻撃なんて、手前には通らない……！"
"51245-116-シュロ" = "は……？床、が……！？"
"51245-117-キキョウ" = "攻撃が通じないから何？#n地面は壊せるよね。"
