"51245-107-レンゲ" = "射撃を鍛錬し続けてはや2年。"
"51245-108-レンゲ" = "青春を捧げて会得した百花繚乱式射撃術において――頭数など無意味だってこと、覚えておけ！"
"51245-109-シュロ" = "くそっ……！"
"51245-110-シュロ" = "まずい！後方へ……！"
"51245-111-シュロ" = "っ……！退路に……！？"
"51245-112-？？？" = "視野を遮った瞬間に退却を選択。そして、安全を確保すると同時に百物語を呼び出す――という手立てだったんだろうけど。"
