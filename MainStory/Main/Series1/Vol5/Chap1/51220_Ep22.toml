[translation]
"51220-1" = "第22話;炎に包まれた街"
"51220-2" = "[ns] \"はあ……はあ……舞台は……\""
"51220-3-ナグサ" = "先生、気をつけて……！"
"51220-4" = "[ns] \"なんだか数が増えているような……！\""
"51220-5-ナグサ" = "……このままじゃ幻魎百物語は、突破できない……"
"51220-6-ナグサ" = "（やっぱり私だけでは力不足……舞台は目の前なのに……！これじゃあ私は、何も……！）"
"51220-7-ニヤ" = "間一髪。先生、大丈夫ですかぁ～？"
"51220-8-チセ" = "来たよ～"
"51220-9" = "[s] \"ニヤ……チセ！？どうして2人がここに……！\""
"51220-10-チセ" = "ニヤ部長が、先生を助けようって～"
"51220-11" = "[s] \"ニヤが？\""
"51220-12-ニヤ" = "ええ。一連の事態を収拾するため……と言いますか。"
"51220-13-ニヤ" = "お祭り運営委員会と連絡がつかず、直接確認しようと街に出向いたのですよぉ。"
"51220-14-ニヤ" = "先ほどあった電波ジャックの件も確認したかったので……"
"51220-15-ニヤ" = "やはり、彼女が手紙を送った張本人……花鳥風月部の部員なのでしょうか？"
"51220-16" = "[s] \"うん、そうみたい。\""
"51220-17-ニヤ" = "……ふむ。"
"51220-18-ニヤ" = "私のミスです。判断を誤ってしまいました……#n百鬼夜行をこんな風にしてしまうなんて……"
"51220-19-ニヤ" = "私が軽率でした。覆水盆に返らずとは言いますが、それでも――"
"51220-20" = "[s] \"私にも非があるよ。ここから一緒に乗り越えていこう。\""
"51220-21-ニヤ" = "……そうですね、過去を悔やんだところで状況は変わりません。"
"51220-22-ニヤ" = "反省会は後にして、今は前を向きましょうか――ナグサさん。"
"51220-23-ナグサ" = "あ……うん。"
"51220-24-ニヤ" = "現状をざっとまとめてみました。"
"51220-25-ニヤ" = "今、お祭り広場を乗っ取った者は、花鳥風月部の[ruby=やぶき]箭吹[/ruby]シュロ。そして、人質に百花繚乱のユカリさんが捕らわれている……合っていますね？"
"51220-26-ナグサ" = "……うん。"
"51220-27-ニヤ" = "彼女を助けるには、あちらに向かわねばなりません。"
"51220-28-チセ" = "あっちこっち、怪物でいっぱい～"
"51220-29-チセ" = "……部長、どうする？"
"51220-30-ニヤ" = "う～ん……私だけでは難しそうですねぇ。"
"51220-31-ニヤ" = "陰陽部の援軍が来るまで耐えたとして、果たしてどうなるやら……"
"51220-32" = "……　……　……　……！！！"
"51220-33" = "[ns] \"いや、まだ突破口はある！\""
"51220-34-ニヤ" = "ん……？"
"51220-35-ナグサ" = "先生、一体なにを――"
"51220-36-？？？" = "秘技！爆裂手裏剣！えいっ！"
"51220-37-ミチル" = "ふっふ～ん、忍術研究部……！"
"51220-38-ミチル" = "ここに……！"
"51220-39-ミチル" = "参上！です！ニンニン！"
"51220-40" = "[ns] \"イズナ！ミチル！ツクヨ……！\""
"51220-41-ナグサ" = "あなた達は……忍術研究部？"
"51220-42-チセ" = "みんな、やっほ～"
"51220-43-ミチル" = "わっ！陰陽部の部長、とチセ様……！？"
"51220-44-ミチル" = "というかそこにいるのはナグサ！？"
"51220-45-ニヤ" = "何故みなさんがこちらに……？"
"51220-46-ミチル" = "ん？それはねぇ――"
"51220-47-イズナ" = "先生から、ご相談を受けたのです……！"
"51220-48-イズナ" = "はい！主殿のお力になれるのなら、忍術研究部一同！#nたとえ火の中水の中！どこでも馳せ参じる準備はできております！ニンニン！"
"51220-49-ツクヨ" = "はい……！イズナちゃんの言う通りです！"
"51220-50-ミチル" = "いやいやいや！？いくらなんでも火の中はちょっと無理かなぁ！？"
"51220-51-ツクヨ" = "大丈夫です、部長ならできます……！"
"51220-52-ツクヨ" = "なんたって部長ですから……！"
"51220-53-ミチル" = "うう……そう言われたら仕方ないよね……！"
"51220-54-ミチル" = "もちろん忍術研究部の部長として、覚悟はできてるよ！#nやってやろうじゃない！"
"51220-55-ツクヨ" = "はい！それでこそ部長です……！"
"51220-56-ミチル" = "んんんっ！！それじゃあ私も頑張るよ！"
"51220-57-ミチル" = "よーし！大船に乗ったつもりでどーんと全部任せてよ、先生殿！"
"51220-58" = "[s] \"みんな……ありがとう！\""
"51220-59-ニヤ" = "さすがは忍術研究部のみなさん……"
"51220-60-ニヤ" = "相変わらず頼もしいですねぇ。"
"51220-61-ニヤ" = "……それでは参りましょうか。#n道は私たちが切り開きましょう。"
"51220-62-チセ" = "任せて～#n練習の成果、見せてあげるね。"
"51220-63-ミチル" = "それじゃあ行くよ！"
"51220-64-ミチル" = "忍術研究部、とつげーき！"
"51220-65-ナグサ" = "……うん！"
