[translation]
"51180-1" = "第18話;街を歩く怪談（２）"
"51180-2-ユカリ" = "それでも……それでも、身共は取り戻したかったのです……"
"51180-3-ユカリ" = "身共はただ、みんなで過ごしていた時間が恋しくて……！"
"51180-4-キキョウ" = "「もしも、相手を思っての建前だとしたら……"
"51180-5-キキョウ" = "それは互いを傷つけるだけだよ」って……。"
"51180-6-キキョウ" = "……ユカリのために、ああ言ったけど。"
"51180-7-キキョウ" = "結局一番苦しんだのは……。"
"51180-8-キキョウ" = "ナグサ先輩……"
"51180-9-キキョウ" = "なんで、あなたはあの時……。"
"51180-10-キキョウ" = "……誰？"
"51180-11-ナグサ" = "キキョウ、久しぶり。"
"51180-12-キキョウ" = "ナグサ先輩……！？"
"51180-13-キキョウ" = "今までどこに……？"
"51180-14-キキョウ" = "いや……そういうのはいいか。#n――おかえり、先輩。 "
"51180-15-キキョウ" = "今の百花繚乱の惨状はすごいよ……#nアヤメ委員長とナグサ先輩が居なくなって、他のメンバーもどんどん抜けていった。"
"51180-16-キキョウ" = "このままじゃ本当に……百花繚乱は無くなってしまうかもしれない。#n今からでも遅くない……ナグサ先輩がみんなに話を――"
"51180-17-ナグサ" = "――キキョウ、これを受け取って。"
"51180-18-キキョウ" = "これは……「証」？#nどうして？"
"51180-19-ナグサ" = "キキョウ、あなたは優秀。#n百花繚乱の作戦参謀として、みんながあなたを頼りにしてる。"
"51180-20-ナグサ" = "他のメンバーだけじゃなく……私もそう。"
"51180-21-ナグサ" = "だから思ったの。私よりも……あなたの方が、百花繚乱の委員長に相応しいと。 "
"51180-22-ナグサ" = "だから……証を返すよ。"
"51180-23-ナグサ" = "キキョウに預かっていてほしい。"
"51180-24-キキョウ" = "半年も連絡がとれなくなったと思ったら……#nこんなものが答え？"
"51180-25-ナグサ" = "そう。"
"51180-26-キキョウ" = "……どうして？"
"51180-27-ナグサ" = "……私は、アヤメじゃないから。"
"51180-28-ナグサ" = "私は、アヤメの代わりになれないから。"
"51180-29" = "腹が立った。"
"51180-30" = "証を返して逃げようとしたから、じゃない。"
"51180-31" = "あなたは、私たちの憧れだった。"
"51180-32" = "私たちの前を歩くあなたの姿が好きだった。#n心から敬愛していた。"
"51180-33" = "なのに……それなのに。"
"51180-34-キキョウ" = "アヤメ委員長の事なんてどうでもいいんだよ。"
"51180-35-キキョウ" = "私、今までナグサ先輩を委員長代わりだと思ったことなんて…… "
"51180-36-キキョウ" = "代わりになってほしいと思ったことなんて……一度もなかったのに。"
"51180-37-キキョウ" = "私が……間違ってたの？"
"51180-38-キキョウ" = "私に、どうしろと……！？"
"51180-39-キキョウ" = "……街が騒がしい。"
"51180-40" = "（至る所に火の手が広がり、街は混乱に陥っていた）"
"51180-41-商店街の住人A" = "うわああっ！"
"51180-42-商店街の住人A" = "た、助けて、か、怪物が……！！"
"51180-43-ナグサ" = "ふぅ……大丈夫？"
"51180-44" = "[ns] \"こっち側の怪物は倒してきたので安全です！さあ、避難を！\""
"51180-45-商店街の住人A" = "は、はい……！#nあ、ありがとうございます！"
"51180-46-ナグサ" = "……キリがないね。"
"51180-47" = "[s] \"逃げ遅れてる人がいないか探してみよう。\""
"51180-48-ナグサ" = "……！この状況で何を言ってるの？"
"51180-49-ナグサ" = "先生……あなた、本気？"
"51180-50-ナグサ" = "緊急事態である認識くらい、持っていると思っていたのだけど。"
"51180-51-ナグサ" = "こういう時は退路を確保して避難しないと……それなのに、どうして。"
"51180-52" = "[s] \"みんなに危険が迫ってるからだよ。\""
"51180-53-ナグサ" = "ここで誰が逃げ遅れようと、何が起ころうとあなたにとっては関係ない……#n他人なのに……"
"51180-54-ナグサ" = "普通、こういう時に優先するのは自身の命。そうじゃないの？"
"51180-55-ナグサ" = "なのに、どうしてあなたは……？"
"51180-56" = "[s1] \"生徒含め……\"\n[s2] \"百鬼夜行の人たちとは知り合いだからね。\""
"51180-57" = "[ns3] \"たとえ他人だったとしても……\"\n[ns4] \"危険な状況を見過ごすことはできないよ。\""
"51180-58-ナグサ" = "そんなの所詮、綺麗事でしょ……！"
"51180-59" = "[ns] \"それに、ナグサだって一緒に来てくれてるでしょ。\""
"51180-60" = "[ns] \"放っておけないんだよね？私もそう。\""
"51180-61-ナグサ" = "……！！"
"51180-62-ナグサ" = "それは……"
"51180-63-ナグサ" = "私は、ただ……"
"51180-64" = "[s5] \"教えてほしいんだ。\"\n[s6] \"あいつらの正体、知ってるんだよね？\""
"51180-65-ナグサ" = "……帰るつもりはないのね。"
"51180-66-ナグサ" = "…………"
"51180-67-ナグサ" = "アレは……[ruby=げんりょうつくもがみ]「幻魎付喪神」[/ruby]。"
"51180-68-ナグサ" = "かつては百花繚乱が退治してきた、説話やうわさ――"
"51180-69-ナグサ" = "――「黄昏」より[ruby=きた]来[/ruby]る「怪談」の一つ。"
"51180-70" = "[s] \"……怪談。\""
"51180-71-ニヤ" = "いわば都市伝説の一種でありゴシップ的な存在……いえ、もう少しそれっぽい言い方をすれば……"
"51180-72-ニヤ" = "「[ruby=かいだん]百物語[/ruby]」――でしょうか。"
"51180-73-ニヤ" = "彼らは｢百鬼夜行の連合の今の形態を認めない、極悪非道の部活｣だとか、｢怪書を操り、人々を惑わす[ruby=ちみもうりょう]魑魅魍魎[/ruby]」と呼ばれたり､呼ばれなかったり……"
"51180-74-ナグサ" = "だとしてもおかしい……"
"51180-75-ナグサ" = "どうしてここに……？"
"51180-76-ナグサ" = "こんなところにいるはずないのに……どうして……"
"51180-77" = "[s] \"これも花鳥風月部の……？\""
"51180-78-ナグサ" = "どこでその名を……！"
"51180-79-ナグサ" = "後ろ……！？"
"51180-80-？？？" = "わわっ、待った待った！#nアタシは怪物じゃないってば！"
"51180-81-ナグサ" = "この声は……"
"51180-82-カエデ" = "あっ、先生だ～！"
"51180-83-ミモリ" = "先生！お怪我はありませんか……！？"
"51180-84" = "[s] \"うん、大丈夫。そっちは？\""
"51180-85-ツバキ" = "……私たちは大丈夫～"
"51180-86-ツバキ" = "それより……"
"51180-87-カエデ" = "先生聞いて！"
"51180-88-カエデ" = "なんか変なのと戦ったり転んだりで大変だったんだよ！"
"51180-89-カエデ" = "何が何だかもう分かんないよぉ！うわぁあん！"
"51180-90-カエデ" = "大丈夫ですよカエデちゃん。#nみなさんと一緒ですから、怖がらないでください。"
"51180-91-カエデ" = "ううっ……ミモリ先輩～！"
"51180-92" = "[s] \"怪我がなくてよかった。修行部以外には……\""
"51180-93-レンゲ" = "ナグサ先輩、ここに居たんだな。"
"51180-94-ナグサ" = "……レンゲ。"
"51180-95-レンゲ" = "言いたいことも、聞きたいことも……山ほどあるけど。"
"51180-96-レンゲ" = "その前にまず――"
"51180-97-レンゲ" = "この怪物を片付けないとな！"
"51180-98-レンゲ" = "その……ナグサ先輩も協力してくれるよな？"
"51180-99-ナグサ" = "私は……"
"51180-100-ナグサ" = "獣……"
"51180-101-ナグサ" = "この鳴き声……もしかして……！"
"51180-102" = "（街中が燃えている）"
"51180-103" = "（鳴き声が木霊する）"
"51180-104" = "花鳥風月部がここに来たという事は…… "
"51180-105" = "[ruby=つくもがみ]付喪神[/ruby]が最後では、ない……？"
"51180-106-ナグサ" = "逃げるよ。"
"51180-107-レンゲ" = "へ！？待ってくれナグサ先輩、逃げるって……"
"51180-108-レンゲ" = "ちょっと！待ってくれよ、また逃げるのかよ！"
"51180-109" = "[s] \"レンゲ、落ち着いて……\""
"51180-110-レンゲ" = "落ち着いてられるか！#nあの人はまた……！"
"51180-111-ナグサ" = "付喪神なら大丈夫……#n――付喪神[ruby=・   ・]まで[/ruby]なら、ね。"
"51180-112-ナグサ" = "アレは百物語の一部に過ぎない……「うわさ」によって作られた、物語から派生した存在……"
"51180-113-ナグサ" = "でも、「アレ」が現れたのなら……"
"51180-114-ナグサ" = "物語が、「うわさ」を超えて「怪談」となってしまうのなら……#nこの次は――"
"51180-115-レンゲ" = "なんだ……アレ？"
"51180-116-ミモリ" = "…………ねこ、さん？"
"51180-117-カエデ" = "えっ、あんなデカい猫、いる！？"
"51180-118-ナグサ" = "遅かった……"
"51180-119-ナグサ" = "[ruby=げんりょうひゃくものがたり]「幻魎百物語」[/ruby]が……ここに。"
"51180-120-ナグサ" = "アレは――[ruby=・   ・   ・   ・   ・   ・   ・]怪談へと成った[/ruby]百物語は……！ "
"51180-121-ナグサ" = "アヤメじゃないと、もう……！"
"51180-122" = "[ns] \"みんな気を付けて！来るよ……！\""
