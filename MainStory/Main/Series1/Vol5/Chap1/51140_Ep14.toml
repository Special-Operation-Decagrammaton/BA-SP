[translation]
"51140-1" = "第14話;少女の決心"
"51140-2" = "[ns] \"ユカリはどこに……。\""
"51140-3" = "（探したものの、既にユカリの姿はなかった）"
"51140-4-百鬼夜行の生徒A" = "お祭り会場ってこっちだっけ？"
"51140-5-百鬼夜行の生徒B" = "早く行こ！屋台売り切れちゃう！"
"51140-6-百鬼夜行の生徒C" = "あっ、待ってよ～！"
"51140-7-商店街の住人A" = "お祭りが始まる時に花火が打ち上がるんだって。"
"51140-8-商店街の住人B" = "花火製造所の新作らしいね！楽しみ～！"
"51140-9" = "（街中で飛び交う、期待に満ちた声を横目に）"
"51140-10" = "（人混みの中、ユカリを探し続けていると……）"
"51140-11-シズコ" = "先生……！"
"51140-12-シズコ" = "あちらも探してみましたが、どこにも見当たらなくて…… "
"51140-13-シズコ" = "もしかしたらもう、この辺りにはいないのかもしれません……#nどうしましょう？"
"51140-14" = "[s1] \"人が多すぎるからね……。\"\n[s2] \"人が増えてきてるし、探すのはどんどん難しくなるかも。\""
"51140-15-シズコ" = "あ、もうこんな時間……！？"
"51140-16" = "[s] \"そろそろお祭りが始まるんだよね？\""
"51140-17-シズコ" = "あっ、はい。#nあと1時間くらいしたら本格的に始まります。"
"51140-18-シズコ" = "今も本部ではウミカとフィーナが準備を進めてくれてて……"
"51140-19" = "[s3] \"シズコ達が頑張って準備したお祭りだもんね。\"\n[s4] \"そろそろ戻ったほうがいいんじゃないかな？\""
"51140-20-シズコ" = "あ……それは、そうですが……"
"51140-21-シズコ" = "……。"
"51140-22-シズコ" = "……やっぱり放っておけません。"
"51140-23-シズコ" = "今回のお祭りの主役は「儀式」………つまり「勘解由小路の巫女による舞」なんです。"
"51140-24-シズコ" = "20年前のお祭りを再現すると決めた以上、#n「巫女の舞」は必要だと思っています。誰もが心躍るようなお祭りにするためにも。"
"51140-25-シズコ" = "ですが……それ以上に今は、ユカリさんと話をしたいです。"
"51140-26" = "[s] \"……シズコ。\""
"51140-27" = "[ns] \"どうして、お祭りを再現しようと思ったの？\""
"51140-28-シズコ" = "その……"
"51140-29-シズコ" = "なにか特別な理由があるわけではなくて……"
"51140-30" = "単に……忘れられてしまったお祭りを再現したい、そう思っただけなんです。"
"51140-31" = "百鬼夜行が、連合となった時から連綿と続いていたお祭り――"
"51140-32" = "そんな素晴らしいお祭りがこのまま忘れ去られてしまうのは、もったいないと思いませんか？ "
"51140-33" = "[s] \"たしかに、もったいないかも……。\""
"51140-34-シズコ" = "そうなんです！"
"51140-35-シズコ" = "私は、たくさんの人が笑顔になれるようなお祭りを作りたいんです。"
"51140-36-シズコ" = "そんなお祭りを開催できれば観光客も楽しめますし……#nその分、財布の紐も緩くなるかも？なーんて期待もできちゃいますし。 "
"51140-37-シズコ" = "百夜堂の名前もキヴォトス全域に広まってブランドパワーをゲット！"
"51140-38-シズコ" = "……というのは流石に冗談ですけどね。"
"51140-39" = "[s] \"冗談かな……？\""
"51140-40-シズコ" = "本当に冗談ですからね！？"
"51140-41-シズコ" = "……開催にあたって、障害もたくさんありました。"
"51140-42-シズコ" = "でも、たくさんの人に助けられて、なんとかここまでこられたんです。"
"51140-43-シズコ" = "だから……みんなが笑顔でお祭りの日を迎えられたらな、って……"
"51140-44-シズコ" = "そんなお祭りにできるようにって、頑張ってきたんですけど……"
"51140-45" = "[s] \"シズコはそのために百花繚乱にも来てたもんね。\""
"51140-46-シズコ" = "はい……でも、ユカリさんの件は……私のせいです。"
"51140-47-シズコ" = "これまで[ruby=かでのこうじ]勘解由小路[/ruby]家の巫女様と連絡がつかないのは、タイミングが悪かったとしか思ってなくて。そのうち連絡もとれるだろうと思っていたんです。"
"51140-48-シズコ" = "まさか……ユカリさんと百花繚乱の間でそんなことがあったなんて。 "
"51140-49-シズコ" = "私、安易に考えすぎていたのかもしれません。"
"51140-50" = "[s] \"シズコ……。\""
"51140-51-シズコ" = "ですから、なおさら引き返せません。 "
"51140-52-シズコ" = "お祭りの成功のため、だけじゃなく……"
"51140-53-シズコ" = "先生も言っていましたよね。"
"51140-54-シズコ" = "「ユカリさんの気持ちは、ユカリさんのもの」だと……"
"51140-55-シズコ" = "私もそう思います。"
"51140-56-シズコ" = "やりたいことをやるべきだし、それを決めるのは本人です。"
"51140-57-シズコ" = "……誰も、ユカリさんにそれを伝えていないんですよね？"
"51140-58-シズコ" = "なら、このままでは帰れません。"
"51140-59-シズコ" = "いや……帰りたくないんです。#nユカリさんと会って、話をするまでは。"
"51140-60" = "[ns5] \"そっか……シズコらしいね。\"\n[ns6] \"さすが、我らがお祭り運営委員会の委員長！\""
"51140-61-シズコ" = "へっ！？"
"51140-62-シズコ" = "い、いえ！そんな風に言われるようなことじゃ……"
"51140-63" = "[s] \"じゃあ、二手に分かれて探そうか。\""
"51140-64-シズコ" = "これから人が増える前に、短期決戦でいこうってわけですね。"
"51140-65-シズコ" = "うう……"
"51140-66-シズコ" = "はい！それでいきましょう！"
"51140-67" = "[s] \"お互い、見つけたら連絡を入れよう。\""
"51140-68-シズコ" = "はい！お任せください！"
"51140-69-シズコ" = "ユカリさんの捜索――"
"51140-70-シズコ" = "再開です！"
"51140-71" = "（皆、口を揃えて言う――）"
"51140-72-使用人A" = "今代のお嬢様は大変優秀ですね。"
"51140-73-使用人B" = "ええ。この間の百鬼夜行連合試験でも満点で！"
"51140-74-使用人C" = "先日のコンクールでも優勝されて……"
"51140-75-使用人A" = "本当にまっすぐで真面目で、美しいお方です。"
"51140-76-使用人B" = "どんなことでもテキパキとこなす姿は、まさに皆の鑑。"
"51140-77-使用人C" = "本当によかった……これであれば無事、今代も――"
"51140-78" = "百鬼夜行の歴史に、[ruby=かでのこうじ]勘解由小路[/ruby]の名を刻めることでしょう。"
"51140-79" = "（満点をとるのは当然で）"
"51140-80" = "（他人の役に立つのは当たり前で）"
"51140-81" = "（期待通りに在るのは義務だった）"
"51140-82" = "名は、勘解由小路ユカリ。"
"51140-83" = "百鬼夜行の中でも名高い一家、勘解由小路家の令嬢。"
"51140-84" = "「勘解由小路家の者としてまっすぐ在りなさい」"
"51140-85" = "それが私の使命であり、義務。"
"51140-86" = "……身共も存じております。それが身共のやるべきことだと。"
"51140-87" = "でも。"
"51140-88" = "（まっすぐな背中）"
"51140-89" = "初めて……「やるべきこと」ではなく「やりたいこと」を教えてくれた人。"
"51140-90" = "初めてあの方に会ったあの日。"
"51140-91-ユカリ" = "お、お待ちください！"
"51140-92-ナグサ" = "……あれ？まだ帰ってなかったんだ。#nもう遅い時間だから――"
"51140-93-ユカリ" = "ナグサ……先輩！#nその……今の、とっても格好良くて……身共感銘を受けましたの！"
"51140-94-ナグサ" = "……ん？"
"51140-95-ユカリ" = "どうしたら身共もナグサ先輩のようになれるのでしょうか？"
"51140-96-ナグサ" = "……私の、ように。"
"51140-97-ナグサ" = "そうだね……"
"51140-98-ナグサ" = "毎日、一生懸命運動する……とか？"
"51140-99-ユカリ" = "むむ……毎日の運動！なるほど……身共には少し難しいかもしれません……"
"51140-100-ユカリ" = "身共、思いつきました！"
"51140-101-ユカリ" = "身共も百花繚乱に入れば良いのです！"
"51140-102-ナグサ" = "ん……？"
"51140-103-ユカリ" = "そうすれば、ナグサ先輩と共に……！ "
"51140-104-ユカリ" = "ナグサ先輩の隣で活動できるはず！#n身共、決めましたの！"
"51140-105-ユカリ" = "あの時……身共は心を決めたのです。"
"51140-106-ユカリ" = "百花繚乱の一員になって、憧れのあの方と、皆様と一緒になりたいと。"
"51140-107-ユカリ" = "でも――"
"51140-108-レンゲ" = "あの時点で、百花繚乱は終わってたんだ。"
"51140-109-キキョウ" = "認めたら？"
"51140-110-キキョウ" = "百花繚乱[ruby=・   ・   ・]ごっこ[/ruby]は、もう終わったんだよ。"
"51140-111-ユカリ" = "レンゲ先輩、キキョウ先輩……"
"51140-112-ユカリ" = "皆様……。"
"51140-113-ユカリ" = "身共が描いていた光景を……"
"51140-114-ユカリ" = "誰も望んでいないのなら……"
"51140-115-ユカリ" = "…………お祭り。"
"51140-116-ユカリ" = "そう……お祭りが、始まりますのね。"
"51140-117-ユカリ" = "本来であれば、百花繚乱が警備をするのですが……"
"51140-118-ユカリ" = "今はもう……。"
"51140-119-？？？" = "はぁ……はぁ……#n見つけた……！こちらに居たんですね！"
"51140-120-シズコ" = "ユカリさん！探しましたよ！"
"51140-121-ユカリ" = "あなた様はたしか……お祭り運営委員長？#nどうして身共を……？"
"51140-122-ユカリ" = "あ……お祭りのことで身共を探して……？"
"51140-123-シズコ" = "百花繚乱の調停室に戻りましょう！"
"51140-124-ユカリ" = "……えっ。"
"51140-125-シズコ" = "百花繚乱の作戦参謀でしたっけ、あの方。"
"51140-126-シズコ" = "ちょっと言い過ぎだと思います！ユカリさんの話を聞きもしないであんなこと言うなんて！"
"51140-127-シズコ" = "自分の居場所を決めるのは自分なのに……偉そうに……！"
"51140-128-シズコ" = "さあっ！戻って話し合いましょう！"
"51140-129-シズコ" = "こういう時は、腹を割って話すものです！"
"51140-130-ユカリ" = "もうお祭りが始まるのに……"
"51140-131-ユカリ" = "委員長が身共の個人的な問題を……何故？"
"51140-132-シズコ" = "私、こういうのを見過ごせないんです！"
"51140-133-ユカリ" = "………………そうですか。"
"51140-134-ユカリ" = "……お言葉ありがとうございます。#nでも身共は大丈夫ですわ。"
"51140-135-シズコ" = "えっ、大丈夫ってどういう……"
"51140-136-ユカリ" = "キキョウ先輩のお言葉も、間違ってないと思うのです。"
"51140-137-ユカリ" = "身共が家から逃げ出したというのは、本当ですから。"
"51140-138-ユカリ" = "お遊びだと言われるのも当然でしょう。#nたとえ、身共にそのつもりがなかったとしても。"
"51140-139-シズコ" = "でも……！"
"51140-140-ユカリ" = "お祭り運営委員長……いえ、シズコさん。"
"51140-141-ユカリ" = "もう時間がありません。#n幸い、儀式の手順は覚えておりますので……"
"51140-142-ユカリ" = "身共、[ruby=かでのこうじ]勘解由小路[/ruby]ユカリは――"
"51140-143-ユカリ" = "――ご希望の通り、巫女として参加いたしましょう。"
"51140-144-シズコ" = "ええっ！？"
"51140-145" = "（ユカリを探して街中を走り続けていると）"
"51140-146" = "[ns] \"……あ。\""
"51140-147" = "（お祭りのスタートが目前に迫っていた）"
"51140-148-観光客A" = "聞きました？"
"51140-149-観光客A" = "今回のメインイベント、「巫女の舞」らしいですよ！"
"51140-150-観光客B" = "「百鬼夜行燈籠祭」のですよね？#n「巫女の舞」……今回は誰がやるのでしょう？"
"51140-151-観光客B" = "やっぱりチセ様でしょうか？"
"51140-152-観光客A" = "あ、それなんですけど、20年前の「巫女の舞」を務めた一族の方がやるらしいですよ。"
"51140-153-観光客A" = "たしか……"
"51140-154-観光客A" = "――「[ruby=かでのこうじ]勘解由小路[/ruby]」って言ってたような。"
"51140-155" = "[s] （勘解由小路……）"
"51140-156-観光客C" = "そういえば、どうして百鬼夜行灯篭祭はなくなってしまったんでしょうね？"
"51140-157-観光客B" = "今回再現したとは聞きましたが、どうしてなくなったのかは知らないですねぇ。"
"51140-158-観光客A" = "ま、終わったことだしいいじゃないですか。#nこれからを楽しみましょう。"
"51140-159-観光客C" = "それもそうですね。"
"51140-160-観光客B" = "このために百鬼夜行まで来たんだし、全力で楽しみましょ！"
"51140-161" = "[ns] \"……お祭りがなくなった理由、か。\""
"51140-162" = "[ns] \"あ、シズコからの電話だ。\""
"51140-163" = "（電話に出ようとしたその時――）"
"51140-164" = "[ns] （…………ん？）"
"51140-165-？？？" = "機は熟した。"
"51140-166-？？？" = "数多の積み上げられた物語が、いま始まりが訪れるのを待っている。"
"51140-167-？？？" = "これより紡がれるは、手前どもの「[ruby=かいだん]百物語[/ruby]」。"
"51140-168-？？？" = "アハハッ！ご挨拶申し上げますぅ。"
"51140-169-？？？" = "ずっと、手前様にお会いしたかったんですよぉ？#n――シャーレの先生。"
"51140-170" = "次回;遭遇"
