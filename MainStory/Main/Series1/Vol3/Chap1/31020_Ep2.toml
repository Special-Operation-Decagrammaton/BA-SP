[translation]
"31020-1" = "第2話;補習授業部"
"31020-2-コハル" = "もう嫌っ！！"
"31020-3-コハル" = "こんなことやってらんない！分かんない！つまんない！めんどくさい！！"
"31020-4-コハル" = "それもこれも、全部先生のせい！！"
"31020-5" = "[s] \"えぇ、私……？\""
"31020-6-ハナコ" = "もう、コハルちゃん。そんな無茶苦茶なことを言ったら、先生が困ってしまうでしょう？"
"31020-7-ハナコ" = "あくまで先生は私たちを助けるために来てくださってるんですし……そもそも勉強が分からないのも試験に落ちたのも、先生ではなくコハルちゃん自身のせいで……。"
"31020-8-コハル" = "うっ……！！"
"31020-9-コハル" = "わ、私は正義実現委員会の一員だから！それで、授業に出られないことが多くて……そう！そのせいなの！"
"31020-10" = "それは他の正義実現委員会のメンバーも同じだ。でもここに来てるのはコハルだけ。"
"31020-11-コハル" = "……。"
"31020-12-ハナコ" = "なるほど。つまりアズサちゃんが言おうとしているのは、ただただコハルちゃんがおバカさんだからですよ、ということで合ってますか？"
"31020-13-アズサ" = "まあ、それも強ち間違ってはいない。仕方のないものは仕方ない、人生は往々にして虚しいものだ。"
"31020-14-ハナコ" = "確かに人生は苦痛の連続ですからね……そういうこともあります。"
"31020-15-コハル" = "ああもう、うるさいなぁっ！？そんなこといったらあんたたちもみんな一緒じゃん！私がバカならここにいる全員バカでしょバーカ！！！！"
"31020-16" = "あ、あはは……えっと、それはその……。"
"31020-17-コハル" = "な、何も間違ってないでしょ？バカだからここにいるんでしょ！？"
"31020-18-ヒフミ" = "あんたも！"
"31020-19-ハナコ" = "あんたも！！"
"31020-20-アズサ" = "あんたも！！！"
"31020-21-コハル" = "あんたもっ！！！！"
"31020-22" = "[s] \"私は一応、先生なんだけどな……？\""
"31020-23-ヒフミ" = "あう……こ、コハルちゃん、ちょっと落ち着いて……。"
"31020-24-コハル" = "落ち着いてなんていられないわよ！みんな仲良く退学になりそうな、こんな状況で……！"
"31020-25-コハル" = "もし退学になったら……せ、正義実現委員会のメンバーじゃ、なくなっちゃう……うぅ……。"
"31020-26-アズサ" = "もちろん私も、退学になるつもりはない。何をしてでも、例え惨めな思いをしてでも、乗り越えてみせる。"
"31020-27-ハナコ" = "まあまあ、退学になったからといって何もかもが終わりというわけではありませんから、気楽に行きましょう。むしろ……"
"31020-28-ヒフミ" = "あ、あのっっっ！！"
"31020-29-アズサ" = "……。"
"31020-30-コハル" = "……。"
"31020-31-ハナコ" = "……。"
"31020-32-ヒフミ" = "あ、えっと、その……こうして集まっているのは、そもそも退学せずに済むようにするためですし……。"
"31020-33-ヒフミ" = "取り合えずその、今はみんなで知恵を寄せ合って、何か良い方法を探さないと……。"
"31020-34-ヒフミ" = "そうしないと、一週間後には本当に仲良く全員退学、なんてことに……。"
"31020-35-ハナコ" = "「知恵を寄せ合う」……なるほど。悪くないのですが、あまりグッと来る感じではありませんね。もう少しこう、何か……。"
"31020-36-ハナコ" = "ここは例えば、そうですね……「弱くて敏感な部分を寄せ合う」、という形でいかがでしょう？"
"31020-37-コハル" = "い、いきなり何言ってんの！？下ネタはダメ！禁止！死刑！！び、敏感な部分って、何をどう寄せ合おうっていうわけ！？"
"31020-38-ハナコ" = "ああ、ちょっと分かりにくかったですか？では、実際にやってみせましょうか。もう少しこう、脚を開いていただいて……"
"31020-39-ハナコ" = "……え？えっ！？"
"31020-40-ハナコ" = "や、やめて！近づかないで！知らないし分かりたくもないしまだ早いからっ！！"
"31020-41-コハル" = "えいっ♡"
"31020-42-コハル" = "や、やめっ……！やめてぇっ！たっ、助けて先生……！"
"31020-43-コハル" = "わっ、私が悪かったです先輩相手にタメ口ですみませんでした！もう許してやめてっ、それはまだ嫌ぁーーー！！！！"
"31020-44-アズサ" = "なるほど、そういう制圧術もあるのか。白兵戦で使えそうだ……勉強になった。"
"31020-45-アズサ" = "ただ、無駄な動作が多い気がするな。私ならあと2テンポ前の段階で、関節をきめてる。"
"31020-46" = "……。"
"31020-47-ヒフミ" = "せ、先生ぇ……。"
"31020-48" = "[s] \"……うん、私も頑張るね。\""
"31020-49-ヒフミ" = "よ、よろしくお願いします……。"
"31020-50-ヒフミ" = "このままだと、本当に……私たちみんな、退学に……。"
"31020-51" = "（話の発端は、数週間前にさかのぼる……）"
"31020-52" = "トリニティ・テラス"
"31020-53-ナギサ" = "こんにちは、[USERNAME]先生。こうしてお会いするのは初めまして、ですね。"
"31020-54-ナギサ" = "ティーパーティーのホスト、[ruby=きりふじ]桐藤[/ruby]ナギサと申します。"
"31020-55-ミカ" = "そしてこちらは、同じくティーパーティーのメンバー、[ruby=みその]聖園[/ruby]ミカさんです。"
"31020-56-ミカ" = "あらためまして、お初にお目にかかります。私たちがトリニティの生徒会、ティーパーティーです。"
"31020-57" = "次回;ティーパーティー"
