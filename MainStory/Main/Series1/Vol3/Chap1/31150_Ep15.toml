[translation]
"31150-1" = "第15話;正義実現委員会の副委員長（２）"
"31150-2-コハル" = "……その、"
"31150-3-コハル" = "い、言っておくけど、こればっかりは本当に間違いだから！"
"31150-4" = "[s] \"……？\""
"31150-5-コハル" = "いつものはちゃんと隠……じゃなくて、あんまり持ち歩いたりしないし……。"
"31150-6" = "[s] \"バレないように、上手く隠さないとね。\""
"31150-7-コハル" = "！？！？"
"31150-8-コハル" = "な、なに言ってるの！？それ、バレなきゃ持ってても良いって言ってるのと同じじゃん！？"
"31150-9-コハル" = "せ、先生なんでしょ！？何考えてるの！？エッチなのはダメ！死刑！！"
"31150-10" = "[s] \"その理論だと、コハルも刑に……。\""
"31150-11-コハル" = "え、や、ちがっ……！？"
"31150-12-コハル" = "わ、私は、その……"
"31150-13-コハル" = "こ、これについては本当に間違いだから！つまりノーカン！！"
"31150-14" = "[s] \"うん、じゃあそういうことにしよう。\""
"31150-15-コハル" = "……！？なっ、何それ！大人の余裕ってわけ！？"
"31150-16" = "[s] \"色々あるけど、無理に縛られなくて良いと思うよ。\""
"31150-17-コハル" = "え……？"
"31150-18" = "[s] \"コハルはコハルだから。\""
"31150-19-コハル" = "……。"
"31150-20-コハル" = "分かったような、分からないような……。"
"31150-21-コハル" = "うん、でも……。"
"31150-22-コハル" = "先生が私のことを考えてくれてるってことは、少しだけ分かった……。"
"31150-23-コハル" = "……。"
"31150-24-コハル" = "じゃ、じゃあっ！"
"31150-25-コハル" = "お返しに、ひとつ私の秘密を教えてあげる！"
"31150-26" = "[s] \"秘密？\""
"31150-27-コハル" = "……。"
"31150-28-コハル" = "実は、私……"
"31150-29-コハル" = "……補習授業部が上手く回ってるかを監視するための、スパイなの！"
"31150-30" = "[s] \"……スパイ？\""
"31150-31-コハル" = "つまり、秘密のミッションを遂行中の身ってこと。だから今は私がバカみたいに見えてるかもしれないけど、これも全部フェイクってわけ！"
"31150-32" = "[s] \"ミッション……誰からの指示で……？\""
"31150-33-コハル" = "う、えっと……だ、誰って、その……。"
"31150-34-コハル" = "んと……は、ハスミ先輩！"
"31150-35-コハル" = "そう！ハスミ先輩はトリニティの中でもすっごい強くて、正義実現委員会の副委員長だし！"
"31150-36-コハル" = "あ、あと、そう！つ、ツルギ委員長だっているんだから！"
"31150-37" = "[s] \"……なるほど。\""
"31150-38-コハル" = "つ、ツルギ委員長はその、えっと、委員長だし……そう、何でもできるの！ぶ、文武両道……？だから！多分！"
"31150-39-コハル" = "何回かしか会ったことないけど……と、とにかくすごいの！"
"31150-40-コハル" = "だから、そういうこと。私は別に、本当に勉強ができなくて補習授業部に入ったわけじゃないってこと、覚えといて！"
"31150-41-コハル" = "私はスパイとして大事な任務を任されてる、エリートなんだから！"
"31150-42" = "[s] \"そうなんだ。\""
"31150-43-コハル" = "ふふんっ。"
"31150-44" = "[s] \"でもこれ、教えちゃって大丈夫なことだったの？\""
"31150-45-コハル" = "……！！"
"31150-46-コハル" = "せ、先生が生徒の秘密をやたらに言いふらしたりしないでしょ！？しないよね！？……じゃ、じゃあ大丈夫！"
"31150-47" = "正義実現委員会・押収品管理室"
"31150-48-コハル" = "……うん、これで良し。"
"31150-49-コハル" = "とりあえずひと安心――"
"31150-50-ハスミ" = "……コハル？"
"31150-51-コハル" = "は、ハスミ先輩！？"
"31150-52-ハスミ" = "それに、先生まで……？たしか合宿で別館にいると聞いたのですが、どうかしましたか？"
"31150-53-ハスミ" = "成績が良くなるまで、ここへは出入り禁止になっているはずですが……。"
"31150-54-コハル" = "そ、その、違うんです、えっと……。"
"31150-55" = "[s] 良い感じに誤魔化す。"
"31150-56-ハスミ" = "……なるほど、授業に使う書籍の件で。"
"31150-57-ハスミ" = "そういうことでしたら、仕方ありませんね。"
"31150-58-コハル" = "は、はい……。"
"31150-59-ハスミ" = "ですが、ある意味ちょうど良かったです。コハルにあらためて伝えておきたいこともありましたし……"
"31150-60-コハル" = "え？わ、私ですか……？"
"31150-61-ハスミ" = "先生、申し訳ないのですが少し席を外していただけますでしょうか？正義実現委員会としてお話したいこと、と言いますか……。"
"31150-62" = "[s] \"うん、分かった。\""
"31150-63" = "……すみません、ありがとうございます。"
"31150-64" = "隣の部屋で待つことにした。"
"31150-65-ハスミ" = "……コハル…………てください。"
"31150-66-ハスミ" = "本来の……を……ないで………………"
"31150-67" = "[ns] （この距離でも、微妙に声が聞こえてきてしまう……）"
"31150-68" = "でも…………には……無理……"
"31150-69" = "……なんて…………あまりにも……ことで……"
"31150-70" = "それではダメなんです！"
"31150-71" = "[ns] （もっと遠くの方に、と思った瞬間ハスミの怒鳴り声が……）"
"31150-72" = "……なさい………………ずっと……ために………………"
"31150-73" = "……先生…………を……です…………"
"31150-74" = "……はい………………ます。"
"31150-75-コハル" = "お、お待たせ……先生？"
"31150-76-コハル" = "……帰らないの？"
"31150-77" = "[s] \"……コハル、大丈夫？\""
"31150-78-コハル" = "え、う、うん？別に、大丈夫だけど……？"
"31150-79" = "コハルと一緒に帰路につき……"
"31150-80" = "そして、また一日が終わりに近づいていく。"
"31150-81" = "次回;小さな隙間"
