[translation]
"31160-1" = "第16話;小さな隙間"
"31160-2-ヒフミ" = "ふぅ、スッキリしました！"
"31160-3-アズサ" = "もうお風呂に入ったんだ、早いねヒフミ。"
"31160-4-ハナコ" = "うふふ、そうですよね。なにせヒフミちゃん朝にシャワーを浴びれず、今日一日あるがままの香りで――"
"31160-5-ヒフミ" = "わわっ！そ、その言い方は恥ずかしいです……っ！うう、寝坊さえしなければ……。"
"31160-6-アズサ" = "……でも、それは私たちのために模試を準備していたからだ。"
"31160-7-アズサ" = "ごめん、ヒフミ。もし明日の朝も起きるのが辛かったら言って。今度はヒフミの身体を洗ってあげる。"
"31160-8-ヒフミ" = "い、いえ、それは遠慮させていただこうかと……！？"
"31160-9" = "自分で洗えば良いでしょ！子どもじゃないんだから！"
"31160-10-アズサ" = "効率の問題だ。みんなで洗うことによる利点は少なくない。もちろん水の節約にもなる。"
"31160-11-ハナコ" = "大浴場は無いので、みんなで一心不乱に洗いっこというイベントはちょっと難しいようですが……"
"31160-12-ハナコ" = "あ、良いことを思いつきました。今度お風呂代わりに、みんな裸でプールに飛び込むのはどうでしょう？"
"31160-13-コハル" = "さらっと何言ってんの！？ダメ！そんなすごいの絶対禁止っ！！"
"31160-14-アズサ" = "悪くない案だと思うけど、それをプールでやるメリットがあるのか？"
"31160-15-ハナコ" = "解放感があると思いませんか？青空の下、全てをさらけ出して掛け合う様子を想像するだけで……うふふ♡"
"31160-16-アズサ" = "なるほど、そういうのは確かに考えてなかった。解放感、か……"
"31160-17-コハル" = "バカバカバカバカ！！考えちゃダメ想像しちゃダメそういうのはダメっ！"
"31160-18-ハナコ" = "アズサを変な風に染めるな！トリニティの変態はあんただけで十分だから！！"
"31160-19-ハナコ" = "そういえばコハルちゃんも全裸で泳ぎたい派ですよね？"
"31160-20-コハル" = "脈絡全無視！？無敵なの！？そっ、そもそもそんなこと言ってないから！プールでは普通に水着！それが正義なの！あんただって昨日はちゃんと着てたじゃん！"
"31160-21-ハナコ" = "あら……？"
"31160-22-コハル" = "よく思い出してみてください、コハルちゃん。私が昨日プールで着ていたものを……"
"31160-23-コハル" = "え、あ、あの水着が何……？"
"31160-24" = "あれは、本当に[wa:1500] [ruby=・]水[/ruby][wa:1000] [ruby=・]着[/ruby][wa:1000] だったと思いますか……？"
"31160-25-コハル" = "！？！！？"
"31160-26-コハル" = "み、水着じゃなかったら何なのよ……！？"
"31160-27-ハナコ" = "最近の下着はデザインがかなり充実していますし、一目で水着かどうかの判断は難しいと思いませんか？それに、ペイントという線も……♡"
"31160-28-コハル" = "……！？！？"
"31160-29-コハル" = "え、嘘！？って、いうことは……！？"
"31160-30-ハナコ" = "あら、どうしたんですか？"
"31160-31-ハナコ" = "あれがもし水着じゃなかったとして、何かが変わってしまうんでしょうか？ねえ、コハルちゃん？"
"31160-32-コハル" = "え、だ、だって……"
"31160-33-ハナコ" = "例えば、水着と下着の違い……それは何でしょう？防水機能？お肌の保護？デザイン？露出の範囲？"
"31160-34-ハナコ" = "コハルちゃんは見た目で分からなかったですよね？あの場、あの時は、それは「水着」だと信じられていましたよね？"
"31160-35-コハル" = "……？？？"
"31160-36-ハナコ" = "実はあれが下着だったとして……その「真実」かもしれない何かは、どうすれば証明できるのでしょう？"
"31160-37-ハナコ" = "証明できない真実ほど無力なものは無い……そう思いませんか？"
"31160-38-ハナコ" = "な、なに言ってるのかわかんない……け、結局どういうこと！？"
"31160-39-コハル" = "あの水着可愛かったですよね、というお話です♡"
"31160-40-ハナコ" = "……はぁ！？全部冗談！？"
"31160-41-ハナコ" = "……なるほど、五つ目のあれか。"
"31160-42-コハル" = "……！"
"31160-43-アズサ" = "五つ目……？えっと、アズサちゃん、何のお話ですか……？"
"31160-44-ヒフミ" = "……。"
"31160-45" = "ただの聞いた話だけど……キヴォトスに昔から伝わる七つの古則。確か、その内の五つ目だったはず。"
"31160-46-アズサ" = "「楽園に辿り着きし者の真実を、証明することはできるのか」……そんな感じだった気がする。残りは知らないけれど。"
"31160-47-アズサ" = "つまり、誰も証明できない楽園は存在し得るのか……そういう禅問答みたいなものだったと記憶してる。"
"31160-48-ハナコ" = "アズサちゃん、どうしてそれを……。"
"31160-49-ハナコ" = "その話を知ってるのは……"
"31160-50-ハナコ" = "もしかしてアズサちゃん、セイアちゃんに会ったことがあるんですか……！？"
"31160-51-アズサ" = "……。"
"31160-52-ヒフミ" = "……セイア？"
"31160-53-ヒフミ" = "それって、ティーパーティーのセイア様のことですか……？"
"31160-54-ハナコ" = "……。"
"31160-55-アズサ" = "……分からない。この話はただ、どこかで聞いた記憶があるだけで……。"
"31160-56-ハナコ" = "……。"
"31160-57-ハナコ" = "そうでしたか……そういえばアズサちゃんは転校生、でしたね……。"
"31160-58-ハナコ" = "vanitas vanitatum……ということは……"
"31160-59-ハナコ" = "……いえ、何でもありません。もう遅い時間ですし、そろそろ寝た方が良さそうですね。"
"31160-60-ハナコ" = "では、今日も一日お疲れ様でした！"
"31160-61" = "先生の部屋"
"31160-62" = "その日の夜……"
"31160-63-ヒフミ" = "……先生。"
"31160-64-ヒフミ" = "ハナコちゃんのこと、なのですが……。"
"31160-65" = "[s] \"………。\""
"31160-66-ヒフミ" = "……模範解答を集めている最中に、なぜか束になって保管されていたんです。珍しいことだから保管されていたのか、その理由は分かりませんが……。"
"31160-67-ヒフミ" = "昨年の試験、1年生から3年生までの全ての試験における解答用紙が、まとまっていました。どういうわけか、その全てを回答した方がいたようでして……"
"31160-68" = "[s] \"それが……。\""
"31160-69-ヒフミ" = "……はい、ハナコちゃんでした。"
"31160-70-ヒフミ" = "昨日見つけた1年生の時の成績に引き続き、盗み見る形になってしまったのですが……。"
"31160-71-ヒフミ" = "ハナコちゃんは去年の1年生の段階で、3年生の秀才クラスでも難しいとされる課程を含めて「全ての試験」で満点を出しています……完膚なきまでに秀才、と言えるレベルです……。"
"31160-72-ヒフミ" = "1年生の分の試験結果を見て、ハナコちゃんはきっと「今年になって急に成績が落ちてしまったんだ」と思っていました。でも、この結果を見る限りそうではなく……。"
"31160-73" = "[s] \"去年の段階で、どんな問題でも解けてるはず。つまり……\""
"31160-74-ヒフミ" = "……はい。ハナコちゃんは今……わざと試験に落ちているとしか思えません……。"
"31160-75-ヒフミ" = "ハナコちゃん……どうして……。"
"31160-76" = "合宿所・ロビー"
"31160-77-アズサ" = "……。"
"31160-78-ハナコ" = "……。"
"31160-79-ハナコ" = "アズサちゃん、また見張りを……？"
"31160-80-ハナコ" = "……。"
"31160-81-ヒフミ" = "ふぁ……。"
"31160-82-ヒフミ" = "……おはようございます。"
"31160-83-アズサ" = "……よし。"
"31160-84-ハナコ" = "……。"
"31160-85-コハル" = "んん……？"
"31160-86-ヒフミ" = "（……あれ？そういえば今朝から、先生が見当たらないような……）"
"31160-87-ヒフミ" = "（いったいどこに……？）"
"31160-88" = "合宿所・プール"
"31160-89-ミカ" = "わぁっ、水が入ってるー！"
"31160-90-ミカ" = "あはっ、ここに水が入ってるのなんて久しぶりに見たなー。もしかしてこれから泳ぐの？それともみんなでプールパーティー？"
"31160-91" = "[s] \"お待たせ。用件を聞いても良いかな？\""
"31160-92-ミカ" = "……えへへ。"
"31160-93-ミカ" = "先生は上手くやってるかな、って思って。"
"31160-94" = "次回;トリニティの裏切り者"
