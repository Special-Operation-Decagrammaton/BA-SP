[translation]
"31110-1" = "第11話;大掃除！"
"31110-2-ヒフミ" = "それではまず、建物周辺の雑草から抜いていきましょう！"
"31110-3-ヒフミ" = "今日は日差しも強いですし、熱中症には気を付けてくださいね。"
"31110-4-ハナコ" = "は～い♪"
"31110-5-ハナコ" = "草を、抜く……ま、まあ別に……。"
"31110-6-ハナコ" = "なるほど。確かに本陣の周囲で、敵が隠れられそうなポイントから取り除くのは理に適ってる。"
"31110-7-ヒフミ" = "えっと……と、とにかくまず建物の周りを整えたら、その後はそれぞれ一か所ずつお掃除をしていくという順番でお願いします！"
"31110-8-ヒフミ" = "さあ、始めましょうか！"
"31110-9" = "合宿所周辺の雑草を一通り抜き取り、放置されていたガラクタなどを片付けた。"
"31110-10" = "居住区・廊下"
"31110-11-ヒフミ" = "ここはまず箒でホコリを掃いて、その後にモップが良さそうですね。"
"31110-12-ヒフミ" = "埃の溜まりやすいところですので、一度では終わらないかもしれませんが……。"
"31110-13-アズサ" = "大丈夫、問題無い。"
"31110-14-ヒフミ" = "アズサちゃんにはこの廊下が終わったら、シャワー室とお手洗いの辺りをお願いしても良いですか？"
"31110-15-アズサ" = "うん、了解。任せて。"
"31110-16" = "掃いて拭いてを何度か繰り返し……"
"31110-17" = "他の場所も、順番に掃除を始めていく。"
"31110-18" = "合宿所・ロビー"
"31110-19-コハル" = "けほっ、けほっ……！何ここ、すごいほこり……。"
"31110-20-ヒフミ" = "そうですね、家具が多いからでしょうか……えっと、ではここも埃を掃いて――"
"31110-21-コハル" = "やっ、やり方くらい知ってる！正義実現委員会でずっとやってるし！"
"31110-22-コハル" = "マスクを着けてほこりを払ってから、水拭きすれば良いんでしょ！バカにしないで！"
"31110-23-ヒフミ" = "ば、バカにしたつもりは無いですよ……？では、ここはコハルちゃんにお任せしますね！"
"31110-24" = "ロビーの埃がたちまち掃われていき、家具も綺麗になっていった。"
"31110-25-ヒフミ" = "えっと、ここは……。"
"31110-26-ハナコ" = "ヒフミちゃん、ここは私に任せてください。"
"31110-27-ハナコ" = "これから色々とお世話になる場所ですし、きちんとお掃除しておかないとですよね。"
"31110-28-ハナコ" = "寝具類は今洗って干しておけば、午後には乾くでしょうし……。"
"31110-29" = "他の部屋にもマットレスがあったので、古そうなものは交換して……あとは換気を……。"
"31110-30" = "すごい、詳しいですね！ではお願いしますね、ハナコちゃん。"
"31110-31-ハナコ" = "うふふ、はい♡"
"31110-32" = "合宿所・教室"
"31110-33" = "合宿所・体育館"
"31110-34" = "合宿所・簡易キッチン兼食堂"
"31110-35" = "[ns] \"こんなところかな……？\""
"31110-36-コハル" = "良いんじゃない？ずいぶんキレイになった気がする。うん、気持ち良い。"
"31110-37-コハル" = "……うん、悪くない。"
"31110-38-コハル" = "そうですね、お疲れ様でした！"
"31110-39-ハナコ" = "あ、まだ一か所だけ残ってますよ？"
"31110-40-ヒフミ" = "あれ、そうでしたっけ……？"
"31110-41-ハナコ" = "はい、屋外プールが♡"
"31110-42-ヒフミ" = "ぷ、プール……？あ、そういえばさっき……"
"31110-43-ヒフミ" = "これは……。"
"31110-44-ヒフミ" = "だいぶ大きいな、どこから取り掛かれば良いのか……いやそもそも、補習授業に水泳の科目は無かったはずだけど？"
"31110-45-ヒフミ" = "試験に関係無いなら、別にこのままでも良いじゃん。掃除する必要ある？"
"31110-46-ハナコ" = "いえいえ、よく考えてみてください、コハルちゃん。"
"31110-47-ハナコ" = "キラキラと輝く水で満たされたプール、楽しい合宿、はしゃぎ回る生徒たち……"
"31110-48-ハナコ" = "……楽しくなってきませんか？"
"31110-49-コハル" = "……！？え、何！？分かんない、何か私に分からない高度な話してる！？"
"31110-50-ヒフミ" = "ですが確かに、こうして放置されてしまったプールを見ていると……何だか寂しい気持ちになりますね。"
"31110-51-アズサ" = "このサイズだったし、昔はきっと使われていた時期もあったんだろう。元々は、にぎやかな声が響き渡っていた場所なのかもしれない。"
"31110-52-アズサ" = "それでも、こんな風に変わってしまう。「vanitas vanitatum」……それが、この世界の真実。"
"31110-53-ヒフミ" = "えっと……？"
"31110-54-ハナコ" = "古代の言葉ですね、[ruby=vanitas vanitatum]「全ては虚しいものである」[/ruby]……確かに、そうなのかもしれません。"
"31110-55-ハナコ" = "……。"
"31110-56-ハナコ" = "……アズサちゃん、ヒフミちゃん、コハルちゃん！"
"31110-57-ハナコ" = "今から遊びましょう！"
"31110-58-ヒフミ" = "え、えぇっ！？"
"31110-59-ハナコ" = "今から掃除して、プールに水を入れて、みんなで飛び込んだりしましょう！"
"31110-60-ハナコ" = "明日からは頑張ってお勉強をし続けないといけませんし、となると今日が最後のチャンスかもしれないじゃないですか。"
"31110-61-ハナコ" = "今のうちにここで楽しく遊んでおかないと！途中からはまた別のことで、色々と疲れてしまうかもしれませんし……！"
"31110-62-ハナコ" = "さあさあ、早く濡れても良い格好に着替えてきてください！プール掃除を始めましょう！"
"31110-63-アズサ" = "……うん。たとえ全てが虚しいことだとしても、それは今日最善を尽くさない理由にはならない。"
"31110-64-アズサ" = "問題無い、ちゃんと水着も持ってきてる。待ってて。"
"31110-65-ヒフミ" = "あ、アズサちゃん！？早っ……！？"
"31110-66-ハナコ" = "さあヒフミちゃんも！コハルちゃんも早く水着……いえ、何でも良いので濡れても良い格好に！"
"31110-67" = "[s] \"何だかハナコの目が怖い……。\""
"31110-68-ヒフミ" = "うーん、でも確かにここだけ掃除しないのも何だか気持ち悪いですし……私も、着替えてきます！"
"31110-69" = "え、えぇっ！？補習授業とは全然関係ないじゃん……うぅ、何で……。"
"31110-70-ハナコ" = "ふふっ、コハルちゃん♡"
"31110-71-コハル" = "わっ、分かった！分かったから！！無言で近寄らないで！"
"31110-72-ヒフミ" = "……。"
"31110-73-ヒフミ" = "……。"
"31110-74-ヒフミ" = "……。"
"31110-75-ハナコ" = "さあ、これでびしょびしょになっても構わないということですね♡"
"31110-76-アズサ" = "うん、問題ない。"
"31110-77-ヒフミ" = "ま、まあ一応……。"
"31110-78-ハナコ" = "では、みんなでお掃除を始めましょうか？"
"31110-79-コハル" = "待て待て待てっ！！"
"31110-80-ハナコ" = "コハルちゃん？どうかしましたか？"
"31110-81-コハル" = "あんた掃除の時は水着でどうして今度は制服なの！？本当にバカなの！？「濡れても良い服」ってあんたが言ったんじゃん！？"
"31110-82-ハナコ" = "これが「濡れても良い格好」ですよ？"
"31110-83-コハル" = "もうあんたが何言ってるか分かんない！制服が濡れても良いの！？"
"31110-84-ハナコ" = "コハルちゃん、これは各々の美学の問題かもしれませんが……"
"31110-85-コハル" = "え、美学……？"
"31110-86-ハナコ" = "水着と制服、どちらの方が濡れた時に「良い感じ」になると思いますか？"
"31110-87-コハル" = "は、はぁっ！？「良い感じ」って何よ！？何の話！？"
"31110-88-ハナコ" = "ふふっ、まあ半分は冗談ですよ。ほら、実は中に着てるんです。お小遣いで買ったビキニの水着♡"
"31110-89-コハル" = "え、え……？"
"31110-90-ハナコ" = "先ほどコハルちゃんに「水着の着用禁止」と言われてしまいましたし、確かに学校ではスクール水着の方が鉄板ですが……今日はこれで許していただけませんか？"
"31110-91-ハナコ" = "スクール水着は今洗濯中でして、これがダメだとすると私、下に何も……"
"31110-92-コハル" = "な、何で私に判断を託すのさ……！べっ、別に勝手にすれば良いじゃん……！？"
"31110-93-ハナコ" = "うふふ、ではそういうことで♪"
"31110-94-ハナコ" = "あらためて、お掃除始めましょうか！"
"31110-95-ハナコ" = "見てください、虹ですよ！虹！"
"31110-96-ヒフミ" = "ひゃっ！？ちょっ、ハナコちゃん冷たいですよぉ！"
"31110-97-ハナコ" = "ふふっ、トリニティの湖から引っ張ってきている水みたいですので、そのまま口を開けて飲んでも大丈夫ですよ？"
"31110-98-コハル" = "ど、どうしてこんなことに……。"
"31110-99-アズサ" = "こちらのブロックは完遂した。続けて速やかにそちらへ向かう。"
"31110-100" = "そうしてみんなで掃除を終えた後、プールに水を入れ始めたものの……。"
"31110-101" = "想像以上に時間がかかり、プールに水が溜まった頃には、すでに日が暮れてしまった。"
"31110-102" = "次回;合宿初日の夜"
