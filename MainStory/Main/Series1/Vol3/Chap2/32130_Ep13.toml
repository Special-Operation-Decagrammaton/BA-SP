[translation]
"32130-1" = "第13話;それでも"
"32130-2" = "（その後も補習授業部のみんなは、第3次特別学力試験に向けて日々努力を重ねた……）"
"32130-3" = "第4次補習授業部模試、結果――"
"32130-4" = "ハナコー100点[007eff]（合格）[-]"
"32130-5" = "アズサー82点[FF6666]（不合格）[-]"
"32130-6" = "コハルー74点[FF6666]（不合格）[-]"
"32130-7" = "ヒフミー79点[FF6666]（不合格）[-]"
"32130-8" = "第5次補習授業部模試、結果――"
"32130-9" = "ハナコー100点[007eff]（合格）[-]"
"32130-10" = "アズサー94点[007eff]（合格）[-]"
"32130-11" = "コハルー90点[007eff]（合格）[-]"
"32130-12" = "ヒフミー93点[007eff]（合格）[-]"
"32130-13" = "第6次補習授業部模試、結果――"
"32130-14" = "ハナコー100点[007eff]（合格）[-]"
"32130-15" = "アズサー91点[007eff]（合格）[-]"
"32130-16" = "コハルー83点[FF6666]（不合格）[-]"
"32130-17" = "ヒフミー89点[FF6666]（不合格）[-]"
"32130-18" = "最後の特別学力試験まで、あと6日"
"32130-19" = "最後の特別学力試験まで、あと5日"
"32130-20" = "最後の特別学力試験まで、あと4日"
"32130-21" = "最後の特別学力試験まで、あと3日"
"32130-22" = "最後の特別学力試験まで、あと2日"
"32130-23" = "最後の特別学力試験まで、あと1日"
"32130-24-ヒフミ" = "……ついに明日、ですね。"
"32130-25-ハナコ" = "はい……。"
"32130-26-アズサ" = "……。"
"32130-27-コハル" = "ま、まさかまた急に、色々と変わったりしないよね？"
"32130-28-ヒフミ" = "はい、今のところは……。"
"32130-29-ハナコ" = "そうですね。試験範囲は以前の通りですし、合格ラインも変わらず90点以上。"
"32130-30-ハナコ" = "場所はトリニティ第19分館の第32教室。本館からは離れてますが、そこまで遠くはありません。"
"32130-31-ハナコ" = "時間は午前9時からで、変わっていませんね。"
"32130-32-ハナコ" = "むしろ気になる点と言えば……昨日から本館が不自然なくらいに静かなことです。人けがピタッと無くなってしまったようで。"
"32130-33-ハナコ" = "……念のため今晩も、私の方で掲示板をずっと見ておきますね。"
"32130-34-ヒフミ" = "は、ハナコちゃんも寝た方が……。"
"32130-35-ハナコ" = "ふふっ、私は大丈夫です。それに、私にはこれくらいしかできませんし……。"
"32130-36-ヒフミ" = "そ、そんなことはありません！ハナコちゃんがすごく丁寧に勉強を教えてくれたおかげで、私もアズサちゃんもコハルちゃんも、すっごく成績が上がって……！"
"32130-37-ハナコ" = "それは、みなさんが頑張ったからですよ。"
"32130-38-ハナコ" = "何日もろくに睡眠を取れなかったのに、よく頑張ったと思います。"
"32130-39" = "[s] \"……うん、きっと大丈夫。\""
"32130-40-ヒフミ" = "はい。それでも、90点はギリギリですが……明日の試験問題が簡単だったら、きっと……。"
"32130-41" = "……。"
"32130-42-コハル" = "……っ！そ、そんな都合の良いこと起きるわけない！私はまだまだ深夜まで勉強するから！"
"32130-43-コハル" = "100点！100点取れれば、誰も文句なんて言えないでしょ！？"
"32130-44-ヒフミ" = "こ、コハルちゃん……気持ちは分かりますが、今日はもうゆっくり休んだ方が……。"
"32130-45-ハナコ" = "そうですよ。コハルちゃんが頑張ったのはみんなが知ってます、大丈夫です。今日はもう休んで、明日に備えた方が良いと思いますよ。"
"32130-46-アズサ" = "休むのも戦略のうちだ。"
"32130-47-ハナコ" = "はい。そしてそれは、アズサちゃんも同じですよ？"
"32130-48-アズサ" = "……うん。今日くらいはゆっくり休もうと思う。"
"32130-49-ヒフミ" = "いよいよ明日……私たちの運命が決まります。"
"32130-50-アズサ" = "もし……いや、縁起の悪いことは言わないでおこう。必ず合格する。"
"32130-51-コハル" = "わ、私も！絶対に負けないんだから！"
"32130-52-ヒフミ" = "そ、そうですね。泣いても笑ってもあと一回です。頑張りましょう。"
"32130-53-ハナコ" = "はい。ここまでしっかり頑張ってきたのですから、後は最後まで最善を尽くすだけです。"
"32130-54" = "[s] \"……今までの頑張りを信じよう。きっと大丈夫。\""
"32130-55-ヒフミ" = "はいっ。"
"32130-56-ハナコ" = "そうですね。"
"32130-57-アズサ" = "うん。"
"32130-58-コハル" = "……。"
"32130-59" = "最後の特別学力試験まで、あと1日"
"32130-60-アズサ" = "……。"
"32130-61-ハナコ" = "……。"
"32130-62-？？？" = "アズサ、日程が変わった。"
"32130-63-アズサ" = "……？"
"32130-64-？？？" = "明日の午前中だ、約束の場所で命令を待て。"
"32130-65-アズサ" = "ま、待ってサオリ、明日は……。"
"32130-66-サオリ" = "何か問題が？"
"32130-67-アズサ" = "ま、まだ準備ができてない。計画よりも日程を早めるのは、リスクが大きすぎる。"
"32130-68-サオリ" = "いや、明日決行だ。これは確定事項、しっかり準備をしておけ。"
"32130-69-アズサ" = "……。"
"32130-70-サオリ" = "明日になれば、全てが変わる。私たちのアリウスにも、このトリニティにも、不可逆の大きな変化が起きることになる。"
"32130-71-サオリ" = "トリニティのティーパーティーのホスト、[ruby=きりふじ]桐藤[/ruby]ナギサのヘイローを破壊する……そのためにお前はここにいるんだ。"
"32130-72-アズサ" = "……。"
"32130-73-サオリ" = "お前の実力は信頼している。上手くやれ、[ruby=ゆりぞの]百合園[/ruby]セイアの時のように。"
"32130-74-アズサ" = "……分かった。"
"32130-75-アズサ" = "準備しておく。"
"32130-76-サオリ" = "アズサ。"
"32130-77-アズサ" = "……？"
"32130-78-サオリ" = "忘れてないだろうな、「vanitas vanitatum」。"
"32130-79-アズサ" = "……全ては虚しいもの。"
"32130-80-アズサ" = "どんな努力も、成功も、失敗も……全ては最終的に、無意味なだけ。"
"32130-81-アズサ" = "……一度だって、忘れたことはない。"
"32130-82-サオリ" = "……。"
"32130-83-ハナコ" = "……。"
"32130-84" = "次回;こくはく"
