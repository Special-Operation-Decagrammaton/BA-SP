[translation]
"32070-1" = "第7話;新しい視点"
"32070-2-ハルナ" = "あら、ジュンコさんにアカリさん。"
"32070-3-ジュンコ" = "あ、ハルナ。あんたも捕まったの？"
"32070-4-ハルナ" = "ふふっ、10メートルくらいは頑張ったのですけれど。"
"32070-5-ジュンコ" = "みじか……。"
"32070-6-ハルナ" = "では、無事脱出に成功したのはイズミさんだけということでしょうか。良かったですね、私たちの犠牲は無駄ではなかったようです。"
"32070-7-ジュンコ" = "いや犠牲っていうか、最初はほぼ逆の構造だったけど……。"
"32070-8-ハルナ" = "正義実現委員会……なるほど、流石はトリニティきっての武力集団ですわね。凄まじい戦闘能力です。"
"32070-9-ジュンコ" = "びっくりしたよ！あのアカリが一瞬で潰れた缶ジュースみたいに……マジでびっくりした……。"
"32070-10-ジュンコ" = "もう、だからトリニティの本拠地まで来るなんて……いくらマグロだからって、どうしてこんなところにまで……！"
"32070-11-ハルナ" = "それはですねジュンコさん。つまるところ、こういうことですわ。誰もいない流し台で水が流しっぱなしになっていたら――"
"32070-12-ジュンコ" = "それ前にも聞いたから！！"
"32070-13-ジュンコ" = "……私たち、これからどうなるのかな？"
"32070-14" = "まあ順当に考えて、風紀委員会に引き渡しじゃないでしょうか？"
"32070-15-ジュンコ" = "びっっっくりしたぁ！？無言で起き上がらないでよ！？無事で良かったわねアカリ！？"
"32070-16" = "ふふ、まあそうそう簡単にはやられませんよ★"
"32070-17-ジュンコ" = "っていうか、そっか、風紀委員会か……やだなぁ、もう考えるだけで……。"
"32070-18-アカリ" = "参りましたわね……ヒナさんの手に私たちの命運が託されるのは、できれば避けたかったのですが……。"
"32070-19-ジュンコ" = "まあちょっと今回は無茶をし過ぎましたね★仕方ないかもしれません。"
"32070-20-フウカ" = "（どうして私まで……）"
"32070-21" = "トリニティ自治区の境界付近"
"32070-22" = "（一方その頃、イズミは……）"
"32070-23-イズミ" = "こ、ここはどこ……？私はイズミ……うわーん！もう、どこに行けばいいのぉ！？"
"32070-24-ハスミ" = "お疲れ様でした。先生、そして補習授業部のみなさん。お陰様で、事態を無事に収拾することができました。"
"32070-25-ヒフミ" = "あ、あはは……途中からはもう、無我夢中という感じでしたが……。"
"32070-26-アズサ" = "正義実現委員会の戦術を目の前で見ることができて、良い勉強になった。"
"32070-27-コハル" = "や、役に立てたのかどうかは、分かりませんが……！"
"32070-28-ハナコ" = "ところで、あの方々はこの後どうなるのですか？"
"32070-29-ハスミ" = "本来ならば私たちの方でこの後の処遇を決めるのですが……今回は時期が時期ですので、ゲヘナの風紀委員会に託そうかと。"
"32070-30" = "[s] \"なるほど。\""
"32070-31-ハスミ" = "はい。そこで、先生にもう一つお願いがあるのですが……。"
"32070-32" = "[s] \"うん、何をしたら良い？\""
"32070-33" = "エデン条約のことを考えると、ここから先も私たちが能動的に動くのは少々避けたいところです。"
"32070-34-ハスミ" = "ですので、風紀委員会への引き渡し……この部分を先生にお願いできませんでしょうか？"
"32070-35-ハスミ" = "「シャーレ」が生徒を引き渡す……この形でしたら、私たちにとってもゲヘナ側にとっても、政治的な憂慮がだいぶ減るのです。"
"32070-36" = "[s] \"分かった、任せて。\""
"32070-37-ハスミ" = "はい。何から何までありがとうございます、先生。それでは、私たちは一旦引いた位置にいますので……よろしくお願いいたします。"
"32070-38" = "トリニティ自治区・外郭の大橋"
"32070-39" = "（風紀委員会の車両の到着を待っていると……）"
"32070-40-セナ" = "……お待たせしました、死体はどこですか？"
"32070-41" = "[s] \"……え？\""
"32070-42-セナ" = "……失礼。死体ではなく負傷者でしたね。たまに混同してしまって。"
"32070-43-セナ" = "えー……納品リストには、新鮮な負傷者3名と人質1人……と書かれていましたが。"
"32070-44" = "[s] \"新鮮な……？\""
"32070-45-セナ" = "……ところであなたは？正義実現委員会ではなさそうですが……？"
"32070-46" = "[s] \"えっと……。\""
"32070-47-？？？" = "その方は、「シャーレ」の[USERNAME]先生。"
"32070-48" = "[ns] \"ヒナ！\""
"32070-49-ヒナ" = "久しぶりね、先生。いつぶりかしら。……ところで、ここで何をしてたの？"
"32070-50-セナ" = "知り合いでしたか、風紀委員長。"
"32070-51-ヒナ" = "うん……まあ、そうね。"
"32070-52-ヒナ" = "なるほど。このタイミングでお互い政治的な問題にしないために、先生が……。"
"32070-53-ヒナ" = "確かに、問題にしたくないのはこちらも同じ。だからこそ、公的には今回こうして風紀委員会ではなく、こっちの「救急医学部」が来たってことになってる。私は基本的に、ただの付き添い。"
"32070-54-セナ" = "……救急医学部の部長、[ruby=ひむろ]氷室[/ruby]セナです。以後よろしくお願いいたします、先生。"
"32070-55-セナ" = "死た……いえ、負傷者がいたらいつでもお呼びください。配送料は頂きませんので。"
"32070-56" = "[s] \"よ、よろしくね……。\""
"32070-57-ヒナ" = "「救急医学部」はゲヘナの中でも、特に政治的な部分に関わりが薄い立場にいる。だから今回、こうしてお願いしたの。"
"32070-58-セナ" = "政治ごっこは風紀委員長にお任せします。私は死体以外に興味ありませんので。"
"32070-59-ヒナ" = "「負傷者」でしょう？それに、本物の死体を見たことないでしょうに。"
"32070-60-セナ" = "はい、負傷者でした。そのことについては、風紀委員長も無いでしょう？"
"32070-61-ヒナ" = "とにかく……美食研究会はこの中？じゃあ、こっちに移してもらえる？"
"32070-62-ハルナ" = "……ふふっ。ヒナさん、お久しぶりですわね。"
"32070-63-ヒナ" = "ハルナ、相変わらず……いや、詳しい話は帰ってからで。"
"32070-64" = "あら、やはり「救急医学部」の方でしたか★ちょっと私の腕の角度があり得ない方向に曲がってるのですが、診ていただけます？"
"32070-65-ジュンコ" = "うぇっ、酔った……吐きそう……。"
"32070-66-フウカ" = "た、助かった……。"
"32070-67-ヒナ" = "あら、給食部の……今日一日見てないと思ったら、こんなところに。"
"32070-68-ヒナ" = "今、学園でジュリが……いや、やっぱり説明は帰りながらで。"
"32070-69-ヒナ" = "なんだか、美食研究会がもう一人足りてない気がするけど……まあ面倒だから良いわ。"
"32070-70-ハルナ" = "色々と配慮していただいてありがとうございます、先生。今度ゲヘナにいらした際には、何か美味しいものでおもてなし致しますね。"
"32070-71-アカリ" = "ではまた今度～★"
"32070-72-ヒナ" = "……うるさい、早く入って。"
"32070-73" = "[s] \"えっと、じゃあまた。気をつけてね……。\""
"32070-74-セナ" = "……積載完了しました。出発の準備もできてます。"
"32070-75-ヒナ" = "……少し待ってて。"
"32070-76-ヒナ" = "……。"
"32070-77-ヒナ" = "先生……トリニティで、何をしてるの？"
"32070-78" = "[s] \"補習授業部っていうところの担任を……。\""
"32070-79-ヒナ" = "それはもう知ってる。色々と情報は入ってきてるから……。"
"32070-80-ヒナ" = "そうじゃなくて、シャーレは中立的な組織だったはず。この時期にトリニティにいるとまるで……"
"32070-81" = "[s] \"………。\""
"32070-82-ヒナ" = "……やっぱり今のは無し、気にしないで。先生がそんなことするわけが無い。"
"32070-83" = "[s] \"ヒナ、こっちからも一つ聞きたいんだけど。\""
"32070-84-ヒナ" = "うん？聞きたいこと……？"
"32070-85" = "[s] エデン条約についてヒナの考えを聞く。"
"32070-86" = "（今の状況とこの先の展望について、ヒナに詳しく話した。）"
"32070-87-ヒナ" = "なるほど……先生、結構複雑な状況にいるのね。"
"32070-88-ヒナ" = "……いや、待って。何か今、変な場面が混ざってなかった？"
"32070-89" = "[s1] \"気のせいだと思う。\"\n[s2] \"間違いなく気のせいです。\""
"32070-90-ヒナ" = "……。"
"32070-91-ヒナ" = "……。"
"32070-92-ヒナ" = "まあ、とにかく……。"
"32070-93-ヒナ" = "「トリニティの裏切り者」……ね。"
"32070-94-ヒナ" = "数多くの言葉が飛び交い、誰の言葉が真実なのか、誰が嘘をついているのか分からない状況……。"
"32070-95" = "[s3] \"色んな見方がありそうだなって思って。\"\n[s4] \"見方によって、真実は変わるかもしれないから。\""
"32070-96-ヒナ" = "慎重なのか楽天的なのか、ほんと分からないわね……。"
"32070-97-ヒナ" = "慎重なのか楽天的なのか、ほんと分からないわね……。"
"32070-98-ヒナ" = "……ところで、こんな大事なことを私に話して良いの？"
"32070-99" = "[s] \"うん、ヒナのこと信じてるから。\""
"32070-100-ヒナ" = "……。"
"32070-101-ヒナ" = "……そういうのが、先生の悪いところ。"
"32070-102" = "[s] \"……？\""
"32070-103-ヒナ" = "……独り言よ。"
"32070-104-ヒナ" = "エデン条約が軍事同盟、ね……まあ、興味深い見方ではあるかもしれない。"
"32070-105-ヒナ" = "ただ、少なくとも私はそうは思わない。あれはれっきとした平和条約、私はそう考えてる。"
"32070-106" = "[s] \"なるほど……？\""
"32070-107-ヒナ" = "条約によって生み出される[ruby=ETO]エデン条約機構[/ruby]……あれを武力集団と捉えたところで、あれはナギサが単身で統制できるようなものじゃない。"
"32070-108-ヒナ" = "万魔殿のリーダーであるマコトも、ナギサと同様の権限を持つことになる。"
"32070-109-ヒナ" = "それだけじゃなく、他のティーパーティーや万魔殿のメンバーに対してもある程度の権限が分割される。だからETOが誰かひとりの意志で本来の目的を失って、暴走するようなことは考えにくい。"
"32070-110-ヒナ" = "もちろん、その全員が協力するなんて事態になれば、理論的にはあり得ることかもしれないけれど……。"
"32070-111-ヒナ" = "そもそもの話として、もしそんなことができるのなら、初めから両学園の統合でもしておけば良いだけのはず。"
"32070-112-ヒナ" = "それに、マコトは誰かと協力するだなんてことができない[ruby=たち]質[/ruby]だから……。"
"32070-113" = "[s] \"……じゃあマコトは、どうしてエデン条約に賛同してるの？\""
"32070-114-ヒナ" = "……賛同というか多分、何も考えてないんじゃないかしら。そもそも、ゲヘナ側でエデン条約を推進したのは、私だったから。"
"32070-115" = "[s] \"ヒナが……？どうして？\""
"32070-116-ヒナ" = "……色々面倒だし、引退するのもアリかなって。"
"32070-117-ヒナ" = "ETOができたら、今よりも遥かにゲヘナの秩序はマシになるはず。そうなったらもう、私が風紀委員長じゃなくても良いでしょう。"
"32070-118" = "[s] \"なるほど……。\""
"32070-119-セナ" = "風紀委員長、まだですか？"
"32070-120-ヒナ" = "……ええ、今行く。"
"32070-121-ヒナ" = "じゃあお疲れ様、先生。また……"
"32070-122-ヒナ" = "……補習授業部のことは、先生が守るのよね？"
"32070-123" = "[s] \"うん。\""
"32070-124-ヒナ" = "……そう。"
"32070-125-ヒナ" = "……じゃあ、またね。"
"32070-126-ヒフミ" = "何だか、怒涛の一日でしたね……。"
"32070-127-ハナコ" = "そうですね、夜のお散歩がこんなハードなことになるなんて……。"
"32070-128-アズサ" = "うん、でも楽しかった。"
"32070-129-コハル" = "……えへへ。"
"32070-130-ハナコ" = "コハルちゃんは、あれからずっと嬉しそうですね？やはり、ハスミさんをしっかり手助けして共闘できたからですか？"
"32070-131-コハル" = "そうよっ、悪い！？ハスミ先輩と一緒に戦えるのなんて、初めてだったし……。"
"32070-132-コハル" = "私が役に立てたなんて、嬉しい……！えへ、えへへへっ……！"
"32070-133-ハナコ" = "うふふ、それは何よりです♡あとはハスミさんが願っている通り、落第を免れないといけませんね？"
"32070-134-コハル" = "わ、分かってる！大丈夫よ、わ、私はエリートなんだから！"
"32070-135-ハナコ" = "はい……私も、頑張らないとです♡"
"32070-136-ヒフミ" = "あはは……もう遅いですし、そろそろ寝ましょうか。明日の勉強に支障が出ると良くないですし……。"
"32070-137-ヒフミ" = "では、お疲れ様でした。"
"32070-138" = "[s] \"みんなお疲れ様、お休み。\""
"32070-139" = "（そうして、長い一日が終わって……。）"
"32070-140" = "次回;差し込む希望"
