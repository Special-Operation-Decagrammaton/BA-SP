[translation]
"32185-1-ミカ" = "……何これ、洒落にならないなぁ。"
"32185-2-ミカ" = "……どうして？"
"32185-3-ミカ" = "セイアちゃんが襲撃された時だって、動かなかったのに……今このタイミングでシスターフッドが介入するなんて、冗談にもほどがあるよ。"
"32185-4-ミカ" = "……何を見誤ったのかな。"
"32185-5-ハナコ" = "……ハナコちゃんのことを、見くびったから？"
"32185-6-ハナコ" = "……。"
"32185-7-ミカ" = "ううん、「浦和ハナコ」がとんでもない存在だってことは知ってた。でも、いつの間に無害な存在になってた。変数として計算する必要がないくらいに。"
"32185-8" = "……アズサちゃんが、裏切ったから？"
"32185-9-アズサ" = "……。"
"32185-10-ミカ" = "ううん、アズサちゃんはただの操り人形。裏切ろうと裏切らなかろうと、私の望む結果には何も関係なかった。"
"32185-11" = "……ヒフミちゃんはただの普通の子で、コハルちゃんはただのおバカさんでしょ？変数になるような存在じゃなかった。"
"32185-12-ミカ" = "それなのに、どうして負けるかなぁ……。"
"32185-13-ミカ" = "どこからズレちゃったんだろ。"
"32185-14" = "[s] \"……。\""
"32185-15-ミカ" = "……そういえば、一番大きい変数を忘れてたね。"
"32185-16-ミカ" = "シャーレの、先生……うん、そうだね。考えてみればきっと、あなたを連れて来た時点で私の負けだった。"
"32185-17-ミカ" = "ナギちゃんが裏切り者がいるって騒ぐから、仕方ないなぁって、ちょうど良さそうだなって思って「シャーレ」に連絡して……そっか、あの時かぁ。"
"32185-18-ミカ" = "いやー……ダメだな、私……。"
"32185-19-ミカ" = "はぁ……。"
"32185-20-ハナコ" = "ミカさん、セイアちゃんは……。"
"32185-21-ミカ" = "……本当に、殺すつもりじゃなかったの。今の私が何を言っても言い訳になるけど……。"
"32185-22-ミカ" = "多分、事故だった。セイアちゃん、元々体が弱かったし……それに……"
"32185-23-ハナコ" = "……セイアちゃんは無事です。"
"32185-24-ミカ" = "……！？"
"32185-25-ハナコ" = "ずっと、偽装していたんです。"
"32185-26-ハナコ" = "襲撃の犯人が見つからなかったので、安全のためというのもあって……トリニティの外で身を隠しています。"
"32185-27-ミカ" = "セイアちゃんが……無事……？"
"32185-28-ハナコ" = "はい。傷が治らなくて、まだ目が覚めていないのですが……救護騎士団の団長が、今もすぐそばで守ってくれています。"
"32185-29-ミカ" = "ミネ団長が……？"
"32185-30-ハナコ" = "はい。そしてあの時、セイアちゃんを助けてくれたのは……"
"32185-31-ハナコ" = "……。"
"32185-32-ハナコ" = "……いえ、これは直接ご本人の口からが良いでしょう。"
"32185-33-ミカ" = "……そっか。生きてたんだ……。"
"32185-34" = "……良かったぁ。"
"32185-35-ミカ" = "……降参。私の負けだよ。"
"32185-36-ミカ" = "おめでとう、補習授業部……そして先生。あなたたちの勝ちってことにしておいてあげる。"
"32185-37-ミカ" = "もう何でもいいや、私のことも好きにして。"
"32185-38-アズサ" = "……。"
"32185-39-ミカ" = "……アズサちゃん。自分が何をしてるのか、その結果この先どうなるのか。それは分かってるんだよね？"
"32185-40-アズサ" = "もちろん。"
"32185-41-ミカ" = "……トリニティが、あなたのことを守ってくれると思う？"
"32185-42-ミカ" = "これからずっと追われ続けるよ。ずっと、どこに行っても。"
"32185-43-ミカ" = "……あなたが安心して眠れる日は、来るのかな？"
"32185-44-ミカ" = "……それに、サオリから逃げ切れると思う？アリウスの出身ならもちろん知ってるよね、et omnia vanitas……"
"32185-45-アズサ" = "うん、分かってる。それでも私は最後まで足掻いてみせる、最後のその時まで。"
"32185-46-ミカ" = "……うん、そっか。"
"32185-47" = "[ns] \"ミカ……。\""
"32185-48-ミカ" = "今はちょっと、先生からは何も聞きたくないなぁ……。"
"32185-49-ミカ" = "やっぱりシャーレを巻き込んだのが、私の最大のミスだった。"
"32185-50-ミカ" = "うん、でも……"
"32185-51" = "[ns] \"もちろん、ミカの味方でもあるよ。\""
"32185-52-ミカ" = "……あの言葉を聞いた時は本当に、本当に嬉しかったんだ。"
"32185-53-ミカ" = "あの時、もし……"
"32185-54-ミカ" = "……ううん、やっぱり何でもない。"
"32185-55-ミカ" = "バイバイ、先生。"
"32185-56" = "次回;第3次特別学力試験"
