[translation]
"32190-1" = "第19話;第3次特別学力試験"
"32190-2-ヒフミ" = "あ、あうぅ……もう色々あり過ぎて、疲労困憊です……。"
"32190-3-ハナコ" = "ようやく落ち着きましたね……。"
"32190-4-コハル" = "うん……。"
"32190-5-ヒフミ" = "コハルちゃん！？"
"32190-6-コハル" = "ご、ごめん、何だか力が抜けちゃって……あ、ありがと。"
"32190-7-ハナコ" = "それもそうですよね、一晩中走り回りましたし……。"
"32190-8-ヒフミ" = "それにここ一週間、あまり睡眠もきちんと取れてないですからね。これでようやく……。"
"32190-9-アズサ" = "何を言ってるのヒフミ、ここからがスタートだ。"
"32190-10-コハル" = "……はい？"
"32190-11-ハナコ" = "あー……。"
"32190-12-ヒフミ" = "そ、そうでした、試験が……。"
"32190-13-コハル" = "……忘れてた。"
"32190-14-アズサ" = "現在時刻は午前7時50分。"
"32190-15-アズサ" = "試験会場まで1時間で着かないと、走ろう。"
"32190-16-ヒフミ" = "えぇっ！？走るんですか！？待ってくださいアズサちゃん早っ！ここから走って着く距離ですか！？"
"32190-17-ハナコ" = "うーん、全力で走ればギリギリでしょうか？さあヒフミちゃん、コハルちゃん！ファイトです！"
"32190-18-コハル" = "うぅ、もう歩くだけでも足痛いのに……待ちなさいよぉ……！"
"32190-19-ヒフミ" = "ど、どうして最後の最後までこんなことに……！"
"32190-20-コハル" = "はあっ、はあっ、はぁ、はぁ……はぁ……はぁ……もう、無理……。"
"32190-21-ヒフミ" = "や、やっと到着しましたね……。"
"32190-22-正義実現委員会部員" = "お待ちしておりました、補習授業部のみなさん。ハスミ副委員長からの伝言です。"
"32190-23-正義実現委員会部員" = "頑張ってください……と。"
"32190-24" = "あらあら。"
"32190-25-コハル" = "は、ハスミ先輩……！"
"32190-26-正義実現委員会部員" = "それから……力になれなくてごめんなさい。この分はいつか必ず……とも。"
"32190-27-アズサ" = "……そうか。"
"32190-28" = "[s] \"うん。じゃあ、入ろっか。\""
"32190-29-アズサ" = "……。"
"32190-30-コハル" = "……。"
"32190-31-ハナコ" = "……。"
"32190-32-ヒフミ" = "……。"
"32190-33" = "[s] \"これが、最後の試験だね。\""
"32190-34-アズサ" = "……うん。どんな結果であれ、この試験で全てが決まる。"
"32190-35-ハナコ" = "そうですね。"
"32190-36-ヒフミ" = "あうぅ……。"
"32190-37-コハル" = "……っ。"
"32190-38-ハナコ" = "……ここまで色々ありましたね。"
"32190-39-アズサ" = "……気持ちは分かる、けど感傷に浸るのは試験が終わってからにしよう。"
"32190-40-ヒフミ" = "はい、そうですね……とにかく、私たちの努力の成果をしっかり発揮しましょう。"
"32190-41-アズサ" = "うん、最後まで諦めない。"
"32190-42-ハナコ" = "はい、私もです。せっかくアズサちゃんに、教えてもらいましたから。"
"32190-43-コハル" = "わ、私今度こそ満点取るから！取っちゃうからね！"
"32190-44" = "[ns] \"では第3次特別学力試験……開始！\""
