[translation]
"32040-1" = "第4話;水着パーティー"
"32040-2-ヒフミ" = "あうぅ……結構降ってますね……。"
"32040-3-ハナコ" = "そうですねぇ。"
"32040-4-ヒフミ" = "んぅ……。"
"32040-5-ヒフミ" = "あら、おはようございますコハルちゃん。"
"32040-6-コハル" = "おはようございます。アズサちゃんは……まだちょっと起きられなさそうですね。"
"32040-7-アズサ" = "んっ……んん……。"
"32040-8-ハナコ" = "どうしたの、アズサ結構早起きだったのに……。"
"32040-9-ヒフミ" = "今までは、無理をしていたんじゃないでしょうか？少し寝かせておいてあげたいですね……。"
"32040-10-アズサ" = "んんっ……ダメ、かわいいものが……ふわふわで……それは、よくない……"
"32040-11-ヒフミ" = "それに、何だか良い夢を見ているようですし♡"
"32040-12" = "[s] \"雨が降ってるからってこともあるのかもね。\""
"32040-13-コハル" = "あ、あうぅ……なんだか雷まで……。"
"32040-14-コハル" = "……あら。"
"32040-15-ヒフミ" = "どうしたの？"
"32040-16-ハナコ" = "忘れてました、洗濯物が外に……！"
"32040-17" = "ま、まずいですっ……！？"
"32040-18-アズサ" = "……？"
"32040-19" = "（それから、約1時間後……。）"
"32040-20" = "さあでは記念すべき第1回、補習授業部の水着パーティーを始めます♡"
"32040-21" = "あうぅ……。"
"32040-22" = "……。"
"32040-23" = "なんで、どうしてこんなことに……。"
"32040-24" = "[ns] \"色々とすごい状況だ……。\""
"32040-25" = "うふふっ、仕方ないじゃないですか♡"
"32040-26" = "（少し遡って、40分ほど前……。）"
"32040-27-アズサ" = "多分これで全部だ。"
"32040-28-ハナコ" = "これは……見事に全滅ですね。泥も跳ねちゃってますし、洗い直しが必要そうです。"
"32040-29-コハル" = "体操着もすごいことに……うぅっ、中まで全部びちゃびちゃ……！"
"32040-30-アズサ" = "それはコハルが途中で転んだからだ。"
"32040-31-ハナコ" = "ごめんなさい、つい失念していて……私がみんな一緒にと言い出したせいです。"
"32040-32-アズサ" = "いや、ハナコのせいじゃない。洗濯はもう一度すれば良いし、服は着替えれば良い。そんなに気に病むことでもない。"
"32040-33-ヒフミ" = "はい、そうですよ。濡れた服のままですと風邪を引いてしまいますし、まずは早く着替えてしまいましょう。"
"32040-34-ハナコ" = "……ありがとうございます。そうですね、髪も乾かさないと。"
"32040-35-コハル" = "……あ。"
"32040-36-ヒフミ" = "コハルちゃん？どうかしましたか？"
"32040-37-コハル" = "……もう、着るものが無い。"
"32040-38-ヒフミ" = "……え？"
"32040-39-アズサ" = "そういえば私もそうだ。制服もこの体操着もびしょ濡れで、他に予備の服は無い。"
"32040-40" = "そ、そういえば私も、あぅぅ……。"
"32040-41-ハナコ" = "……あらあら♡まあ、下着姿で勉強というのもすごくアリだと思いますよ？"
"32040-42-コハル" = "何言ってるの！？バカ！そんなハレンチなのダメっ！どうしてそういう方向になるの！？"
"32040-43-アズサ" = "でも話は分かる。下着は多めに用意してあるし、靴下も履いておけば体温の維持も問題なさそうだ。"
"32040-44-コハル" = "変に同調しないで！？教室で下着なんてやばいでしょ！？"
"32040-45-ハナコ" = "ですがコハルちゃん、想像してみてください――"
"32040-46-コハル" = "もうあんたは黙っててっ！！"
"32040-47-コハル" = "手早く洗濯して、ドライヤーでも使ってすぐ乾かせば良いでしょ！"
"32040-48-コハル" = "その間は、バスタオルとか巻いておけば良いし！何かあっても先生にやってもらえば良いじゃん！"
"32040-49-コハル" = "それに、この状況で急いで勉強のこと考える必要も無いでしょ！なんでそんな急に勉強したがりなの！？"
"32040-50-ハナコ" = "そうだとしても、その間はどちらにせよ下着姿なのでは？"
"32040-51-ハナコ" = "早く勉強したいのだけど、洗濯が終わるまでは教室には行けないなら仕方ない。とりあえず脱ごう。"
"32040-52-ハナコ" = "あうぅ、仕方ありませんね……とにかく脱ぐしか……。"
"32040-53-コハル" = "何でみんなそんなに脱ぎたがるの！？露出は犯罪なんだよっ！？"
"32040-54" = "先生の部屋"
"32040-55" = "（洗濯が終わるまで、とりあえず部屋にいることにした。）"
"32040-56-コハル" = "えっ！？な、なにっ！？"
"32040-57-ヒフミ" = "て、停電みたいですね……？"
"32040-58-ハナコ" = "落雷による停電、でしょうか？"
"32040-59-ヒフミ" = "え。い、今のは何の音ですか……！？"
"32040-60-アズサ" = "……問題が発生した。"
"32040-61-アズサ" = "洗濯機が止まってる、それに蓋も開かない。困った。"
"32040-62-コハル" = "……！？"
"32040-63" = "[ns] \"まあ、仕方ないような気もする……。\""
"32040-64" = "そうですよ。こうとなっては、パジャマパーティーならぬ水着パーティーくらいしかすることはありません♡"
"32040-65" = "あうぅ……な、何か他にもありそうな気はしますが……。"
"32040-66" = "なるほど、下着パーティーとかもありそうですね♡確かによく考えると他にも幾つかあると思いますが、それで本当に良いんですか……？ふふっ。"
"32040-67" = "こうなると授業もやりにくいし……こんな落雷くらいで全部の建物が機能不全だなんて、ひどいセキュリティだ。"
"32040-68" = "まあ、古い建物ですし……。"
"32040-69" = "っていうか待って！流されないわよ！？水着パーティーって何なの！卑猥！！"
"32040-70" = "授業もできないし着る服も無いところまでは同意だけど、だったらおとなしく部屋で休めばいいでしょ！普通に考えて！"
"32040-71" = "あら、ですがこういう時間こそ合宿の花だと思いませんか？"
"32040-72" = "みんな寄り添って、お互いの深い部分をさらけ出し合う……雨も降っている上に停電で何も見えませんし、雰囲気は最高です！"
"32040-73" = "うふふふ……♡せっかくの休み時間なんですし、そうやって有意義に過ごしません？"
"32040-74" = "あはは……た、確かに合宿の定番という感じはしますね。"
"32040-75" = "なるほど、それがこの水着パーティーと。"
"32040-76" = "いやいやいや納得するか！水着とかけ合わせる意味は！？"
"32040-77" = "あうぅ、確かに……。"
"32040-78" = "まあまあ、せっかくなんですし楽しむとしましょう。"
"32040-79" = "そうは言ってもただのおしゃべりですし、話題も何でもアリということで♡"
"32040-80" = "ふふっ♡私こういうこと、すっごくしてみたかったんですよね。なので、ちょっとテンションが上がっていると言いますか……。"
"32040-81" = "[s] \"ハナコ、本当に楽しそうだね。\""
"32040-82" = "気持ちは分かる。私も何なら、補習授業部に入って以来ずっとそういう気持ちだ。"
"32040-83" = "あら、そうなんですか？"
"32040-84" = "うん。何かを学ぶということも、みんなでご飯を食べることも、洗濯も掃除も、その一つ一つが楽しい。"
"32040-85" = "あら……♡"
"32040-86" = "水着は泳ぐ時にだけ着るものだと思っていたのに、こんな活用方法があるなんてことも初めて知った。知らなかったことを知れるというのは、楽しいことだ。"
"32040-87" = "み、水着の件はちょっと違う気もしますが……。"
"32040-88" = "でも、動きやすいし通気性も良い。ハナコがこれを着て学校を歩いてたというのも納得がいく。"
"32040-89" = "そうですよね、だから言ったじゃないですかコハルちゃん。"
"32040-90" = "いやそれで外を歩くのは犯罪だから！納得しちゃダメ！公然淫猥罪だよ！？"
"32040-91" = "コハルと一緒に勉強するのも楽しい。"
"32040-92" = "っ！？きゅ、急になに！？何でそんな急に恥ずかしいことを！？"
"32040-93" = "あらあら……♡"
"32040-94" = "ま、まあ、私みたいなエリートと一緒に勉強して、タメになることは多いと思うけど？"
"32040-95" = "うん、本当にそうだ。"
"32040-96" = "アズサちゃん……最初はあまり表情の変化も読み取れなくて心配でしたが……良かったですっ。"
"32040-97" = "もちろんヒフミもだ。本当にいつも世話になってる、ありがとう。"
"32040-98" = "あ、アズサちゃんっ！！うわーん！！"
"32040-99" = "（ぎゅっ）"
"32040-100" = "ひ、ヒフミ、少し息苦しい。"
"32040-101" = "（そうして、補習授業部一同は話に花を咲かせ……。）"
"32040-102" = "そういえば今トリニティのアクアリウムで、「ゴールドマグロ」という希少なお魚が展示されているらしいですね。"
"32040-103" = "あ、私もそれパンフレットで見ました！「幻の魚」と呼ばれているんですよね？"
"32040-104" = "はい、どうやら近くの海で発見されたとか。見に行きたいのですが、入場料も安くないので……。"
"32040-105" = "海、か……そういえば一度も行ったことないな。"
"32040-106" = "そ、そうなんですか！？一回も……！？"
"32040-107" = "それで、とっくに潰れたアミューズメントパークなのにも関わらず、夜になると何やら騒がしい音が聞こえてきて……。"
"32040-108" = "そ、そんなわけないじゃん！聞き間違えよ！"
"32040-109" = "まあ、私もそういう噂として聞いただけですが……。"
"32040-110" = "いやだっ！絶対嘘！全部誰かの悪ふざけ！"
"32040-111" = "あ、あはは……。"
"32040-112" = "水着で街や学園の中を歩くのは別に、そこまで変なことじゃないですよ？"
"32040-113" = "そんなわけないでしょ！？勝手に常識改変しないでっ！"
"32040-114" = "ですが、これは私がシスターたちから聞いた話ですが……どうやらキヴォトスどこかの無法地帯では、水着姿で覆面を被っている犯罪集団があるらしいですよ？"
"32040-115" = "み、水着に覆面……！？ド変態じゃん！？なにそれ！？"
"32040-116" = "っていうか「犯罪者集団」なんじゃん！そんなの何もしてなくたって、見た目からしてすでに犯罪よ！"
"32040-117" = "そういう集団があるくらい、他の地域では普通なんですよ。ですからコハルちゃんも今度一緒に――"
"32040-118" = "いやっ！何言いだすか分からないけどとりあえず嫌っ！！"
"32040-119" = "………………。"
"32040-120" = "アズサちゃんはもっと、夜はきちんと眠った方が良いと思いますよ？"
"32040-121" = "……うん。今朝は寝坊して迷惑をかけてしまった。"
"32040-122" = "慣れない場所で寝坊なんて、これまでほとんど無かったのに……。"
"32040-123" = "……もうここは、「慣れない場所」じゃないからかもしれないな。"
"32040-124" = "……とにかく、もっとしっかり寝た方が良いです。深夜の見張りは減らしていただいて。"
"32040-125" = "見張り……？なにそれ？"
"32040-126" = "ああ、毎晩夜中にちょっと見張りを……。"
"32040-127" = "[s] \"ハナコ、アズサのことすごく心配してたよ。\""
"32040-128" = "そうなのか……？"
"32040-129" = "……ごめん。"
"32040-130" = "実は、見張りは言い訳で……ブービートラップとかを設置していたんだ。"
"32040-131" = "ブービートラップ……？"
"32040-132" = "……？"
"32040-133" = "どうしてそんなことを……？"
"32040-134" = "心配しないで、ここに悪意を持って侵入しようとするルートにだけ設置してるから。普通の生活をする上では、安全面に問題は無い。"
"32040-135" = "（昨日のマリーさんのことを考えると、そうでもない気がしますが……）"
"32040-136" = "なるほど……ですが、それならそれで教えてくれると嬉しいです。どうしても、心配しちゃいますから。"
"32040-137" = "……そうか。うん、これからは気を付ける。"
"32040-138" = "私のせいで、先生とみんなが被害を受けるのは望むところじゃないから。"
"32040-139" = "[s] \"アズサは優しいね。\""
"32040-140" = "なっ……こ、子ども扱いしないで、先生。"
"32040-141" = "私は別に……そんなのじゃない。"
"32040-142" = "だってこの世界は、全てが無意味で、虚しいものだ。だから、もしかしたら……。"
"32040-143" = "私はいつか裏切ってしまうかもしれない……みんなのことを、その信頼を、その心を。"
"32040-144" = "……。"
"32040-145" = "アズサちゃん……？"
"32040-146" = "……？"
"32040-147" = "あ、電気が……。"
"32040-148" = "直ったみたいですね。"
"32040-149" = "あ、雨もいつの間に……！"
"32040-150" = "そうですね。では、もう一度あらためて洗濯しましょうか。"
"32040-151" = "うん。じゃあ、第1回水着パーティーはここで閉幕か。2回目も楽しみにしてる。"
"32040-152" = "二回戦とか無いから！こんなの最初で最後だからっ！"
"32040-153" = "（洗濯を終わらせて、今日の残り時間は休息をとることにした。）"
"32040-154" = "（そうやって一日が過ぎ……）"
"32040-155-ハナコ" = "いいえ、まだです！このまま一日が終わりだなんて、そんな勿体ないことはさせません！"
"32040-156-ヒフミ" = "は、はい……！？"
"32040-157-コハル" = "な、なに！？急に飛び上がって、びっくりした……。"
"32040-158-ハナコ" = "突然のことでしたが、せっかくのお休みじゃないですか。みんな裸で交わったのに、このままはいお休みなさいなんて――"
"32040-159-コハル" = "勝手に記憶を捏造しないで！裸じゃないから！"
"32040-160-ハナコ" = "それはともかく、このまま寝てしまうのは勿体ないです。まだ火照っているといいますか、物足りないと言いますか……。"
"32040-161-アズサ" = "具体的には？"
"32040-162-ハナコ" = "うふふっ♡合宿といえば、やはり合宿所を抜け出すこと……それも一つの醍醐味だと思いませんか？"
"32040-163-ヒフミ" = "え……？"
"32040-164-ハナコ" = "さあ！今からみんなでこっそり外に出て、お散歩しましょう♡"
"32040-165-ハナコ" = "トリニティの商店街は夜遅くまで営業している店も結構ありますし、食べ歩きとかショッピングとかもできます！"
"32040-166-コハル" = "そ、そんなの校則違反じゃん！ダメっ！"
"32040-167-ハナコ" = "細かい校則は知りませんが、結構みなさんこっそりやってると思いますよ？意外とそういう方周りにいませんか、ヒフミちゃん？"
"32040-168-ヒフミ" = "あ、あはは……そ、そう、ですね……？"
"32040-169-ヒフミ" = "で、ですが普段であればまだしも、今は補習授業部の合宿中ですし……良いんでしょうか……？"
"32040-170-ハナコ" = "遠出するわけでもありませんし、すぐそこですよ。コハルちゃん、いかがですか？楽しそうだと思いません？"
"32040-171-コハル" = "え、っと……きょ、興味はある、けど……。"
"32040-172-ハナコ" = "はい、ちょっと行って戻ってくるだけですから大丈夫ですよ。良いですか、先生？"
"32040-173" = "[s] \"楽しそうだね、行こっか。\""
"32040-174-コハル" = "い、良いの！？"
"32040-175-アズサ" = "準備はできた。もうすぐにでも出発できる。"
"32040-176-ヒフミ" = "アズサちゃん！？いつの間に着替えて……！"
"32040-177-ハナコ" = "では決定ですね♡"
"32040-178-ハナコ" = "さあ早く準備して行きましょう！楽しくなってきましたね、深夜に裸で散歩……！"
"32040-179-コハル" = "さりげなくすり替えないで！！服は着ろ！！"
"32040-180" = "（そうして、唐突に夜のお散歩が始まることになった。）"
"32040-181" = "次回;真夜中の大騒ぎ（１）"
