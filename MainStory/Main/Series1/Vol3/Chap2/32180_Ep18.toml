[translation]
"32180-1" = "第18話;そんな世界も（２）"
"32180-2-ミカ" = "シスターフッド……！？"
"32180-3-ミカ" = "っ、浦和ハナコ……！"
"32180-4-ハナコ" = "……まあ、ちょっとした約束をしましたので。"
"32180-5-ミカ" = "約束……？"
"32180-6-ハナコ" = "あなたは知らなくても良いことですよ、ミカさん。"
"32180-7-マリー" = "けほっ、今日も平和と安寧が、みなさんと共にありますように……けほっ。"
"32180-8-ヒナタ" = "す、すみません、お邪魔します……。"
"32180-9-マリー" = "シスターフッド、これまでの慣習に反することではありますが……ティーパーティーの内紛に、介入させていただきます。"
"32180-10-マリー" = "ティーパーティーの[ruby=みその]聖園[/ruby]ミカさん。他のティーパーティーメンバーへの傷害教唆及び傷害未遂で、あなたの身柄を確保します。"
"32180-11-ミカ" = "シスターフッド、[ruby=うたずみ]歌住[/ruby]サクラコ……。"
"32180-12-ミカ" = "……あはっ。流石にシスターフッドと戦うのは初めてだなー。なるほどね、これが切り札ってこと？"
"32180-13-ミカ" = "……浦和ハナコ、どうやってシスターフッドを動かしたの？"
"32180-14-ミカ" = "シスターたちと仲良かったのは知ってる。でもあの子たちが何の得も無く動くはずが無い……ねえ、[ruby=・   ・   ・   ・   ・   ・]何を支払った[/ruby]の？"
"32180-15-ハナコ" = "……。"
"32180-16-ミカ" = "……うん、興味深いね。さて、片付けないといけない相手が一気に増えちゃったなぁ。"
"32180-17-ハナコ" = "……ようやく顔色が変わりましたね、ミカさん？"
"32180-18-ミカ" = "……そうかな？まあどうせホストになったら、大聖堂も掃除しようと思ってたところだし。うん、一気にやれるチャンスだって考えることにしようかな。"
"32180-19-ミカ" = "……さて、じゃあやってみよっか？"
"32180-20-ハナコ" = "……あくまでも戦うつもりですか、ミカさん。この状況での勝算がどれくらいか、分からないあなたではないですよね？"
"32180-21-ミカ" = "……うん、そうかもね。でもここまで来て、「おとなしく降参します」なんてわけにはいかないでしょ？"
"32180-22-ミカ" = "……もう私は、行くところまで行くしかないの。"
