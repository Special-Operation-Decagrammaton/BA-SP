[translation]
"32120-1" = "第12話;再び原点へと"
"32120-2" = "（その後……）"
"32120-3-コハル" = "もう嫌っ！！"
"32120-4-コハル" = "こんなことやってらんない！分かんない！つまんない！めんどくさい！！"
"32120-5-ヒフミ" = "あ、えっと、その……こうして集まっているのは、そもそも退学せずに済むようにするためですし……。"
"32120-6-ヒフミ" = "取り合えずその、今はみんなで知恵を寄せ合って、何か良い方法を探さないと……。"
"32120-7-ヒフミ" = "そうしないと、一週間後には本当に仲良く全員退学、なんてことに……。"
"32120-8-ハナコ" = "「知恵を寄せ合う」……なるほど。悪くないのですが、あまりグッと来る感じではありませんね。もう少しこう、何か……。"
"32120-9-ハナコ" = "ここは例えば、そうですね……「弱くて敏感な部分を寄せ合う」、という形でいかがでしょう？"
"32120-10-コハル" = "い、いきなり何言ってんの！？下ネタはダメ！禁止！死刑！！び、敏感な部分って、何をどう寄せ合おうっていうわけ！？"
"32120-11-ハナコ" = "ああ、ちょっと分かりにくかったですか？では、実際にやってみせましょうか。もう少しこう、脚を開いていただいて……"
"32120-12-ハナコ" = "……え？えっ！？"
"32120-13-ハナコ" = "や、やめて！近づかないで！知らないし分かりたくもないしまだ早いからっ！！"
"32120-14-コハル" = "えいっ♡"
"32120-15-コハル" = "や、やめっ……！やめてぇっ！たっ、助けて先生……！"
"32120-16-コハル" = "わっ、私が悪かったです先輩相手にタメ口ですみませんでした！もう許してやめてっ、それはまだ嫌ぁーーー！！！！"
"32120-17-アズサ" = "なるほど、そういう制圧術もあるのか。白兵戦で使えそうだ……勉強になった。"
"32120-18-アズサ" = "ただ、無駄な動作が多い気がするな。私ならあと2テンポ前の段階で、関節をきめてる。"
"32120-19" = "……。"
"32120-20-ヒフミ" = "せ、先生ぇ……。"
"32120-21" = "[s] \"……うん、私も頑張るね。\""
"32120-22-ヒフミ" = "よ、よろしくお願いします……。"
"32120-23-ヒフミ" = "このままだと、本当に……私たちみんな、退学に……。"
"32120-24" = "（その後ナギサに会おうとしてみたのだけれど、彼女は見つからなかった。）"
"32120-25" = "（同様に、どうにか連絡を取ろうとしてみたものの、ミカもどこにいるのかすら分からずにいた。）"
"32120-26" = "合宿所"
"32120-27-ハナコ" = "何だかんだで戻ってくることになっちゃいましたね。"
"32120-28-アズサ" = "もうお別れだと思って出たのに、すぐこうなるなんて。やっぱり人生は分からないものだ。"
"32120-29-コハル" = "感傷に浸ってる場合じゃないでしょ！？これからどうするの！？"
"32120-30-コハル" = "っていうか、本当にティーパーティーの偉い方たちが私たちを退学させようとしてるなら、どうしようもないじゃん！知恵を寄せ合ったところで、何したって無駄なんじゃないの！？"
"32120-31" = "一応、一週間後にある第3次特別学力試験が最後のチャンスではありますが……。"
"32120-32-ハナコ" = "ここまでありとあらゆる手で邪魔をされてしまいますと、確かに厳しいかもしれませんね。"
"32120-33-ヒフミ" = "あうぅ……。"
"32120-34-コハル" = "そ、そもそもどうしてこんなことになってるのよ！？何で退学にならなきゃいけないわけ！？"
"32120-35-コハル" = "「トリニティの裏切り者」とか意味分かんない！どうして私たちが疑われなきゃいけないのさ！？"
"32120-36-コハル" = "もし本当に退学になったら……正義実現委員会には、もう……。"
"32120-37-ヒフミ" = "コハルちゃん……。"
"32120-38-アズサ" = "……。"
"32120-39" = "[ns] \"……ごめん。私がナギサにああ言ったせいで……。\""
"32120-40-ハナコ" = "……いいえ。そのお話を聞いた限り、先生は私たちのために言ってくださったのでしょう？むしろ感謝するべきことです。"
"32120-41-ハナコ" = "もし私がその場にいたら、あの猫ちゃんにはもっと酷いことをしていたかもしれません。"
"32120-42-アズサ" = "……。"
"32120-43-ヒフミ" = "この一週間で、90点以上を取れるようになんて……。"
"32120-44-ハナコ" = "そうですね……それに、これ以上ナギサさんが良からぬことをしないように見張らねばなりませんし……。"
"32120-45-コハル" = "ぐすっ……無理、絶対無理よ……ここまですっごい頑張ったのに、これ以上なんて……。"
"32120-46-コハル" = "頑張ったもん……でもこれ以上は、私にはもう無理……私、バカなのに……無理だって……うぅっ……。"
"32120-47-アズサ" = "コハル……。"
"32120-48-ハナコ" = "コハルちゃん……。"
"32120-49-ヒフミ" = "と、とりあえず、今日はもう休みませんか？"
"32120-50-ヒフミ" = "何か、何かしらきっと方法はあると思います……いいえ、あるはずです。頑張って見つけます。それに先生も手伝ってくれますし……。"
"32120-51-ハナコ" = "ヒフミちゃんも、きちんと休んだ方が良いですよ……？ここまでずっと無理されてましたし……。"
"32120-52-ヒフミ" = "で、ですが今頑張らないと……。"
"32120-53-ハナコ" = "私も、一緒に考えますから。コハルちゃんの勉強も、ヒフミちゃんのことも手伝います。"
"32120-54-ハナコ" = "……とにかく今日は、一旦休むとしましょう。"
"32120-55-ヒフミ" = "そう、ですね……はい。"
"32120-56-ハナコ" = "では、今日は一旦この辺りで。お疲れ様でした。"
"32120-57" = "最後の特別学力試験まで、あと6日"
"32120-58-アズサ" = "……。"
"32120-59-ハナコ" = "……。"
"32120-60" = "次回;それでも"
