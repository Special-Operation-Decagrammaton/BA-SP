[translation]
"32110-1" = "第11話;第2次特別学力試験（２）"
"32110-2" = "ゲヘナ自治区"
"32110-3-ヒフミ" = "えっと、何とか内部には入れましたが……。"
"32110-4-ハナコ" = "いくら夜中とはいえ、人けが無さすぎません？"
"32110-5-アズサ" = "……銃声だ。どこかで戦闘が起きてる。"
"32110-6-ハナコ" = "うーん、目的地に行くにはこのまま進むしかありませんし……とりあえず行ってみましょうか。"
"32110-7-ヒフミ" = "あれは、検問……？"
"32110-8-風紀委員A" = "止まれ！ここから先は立ち入り禁止になっている！"
"32110-9-風紀委員A" = "そもそも今日は、街全体に外出禁止令が出されているはずだ！早く戻って――"
"32110-10-風紀委員A" = "……その制服、トリニティ？"
"32110-11-風紀委員B" = "どうしてここに……！ゲヘナに何をしに来た！目的は何だ！"
"32110-12-ヒフミ" = "い、いえその、本当にここを通りたいだけでして……！"
"32110-13-風紀委員A" = "何の目的も無しに、トリニティがゲヘナに来るわけがあるか！"
"32110-14" = "ですが私たちは本当に、ただ試験を受けに来ただけなんです。特に問題を起こしに来たわけではなく……。"
"32110-15-風紀委員A" = "トリニティの生徒が試験を受けるために、どうしてゲヘナの自治区に来るんだ！！せめてもっとまともな嘘をつけ！"
"32110-16-ヒフミ" = "せ、正論……あうぅ……。"
"32110-17-風紀委員B" = "……っ！そこのお前、正義実現委員会じゃないか！？"
"32110-18-風紀委員A" = "なっ、ほ、本当だ！襲撃！正義実現委員会が襲撃しに来たぞ！"
"32110-19-風紀委員A" = "上層部に報告！正義実現委員会が遂に来た！！"
"32110-20-コハル" = "えぇっ！？いやその、そ、そうなんだけど、今は違うって言うか、うぅっ……！"
"32110-21-アズサ" = "仕方ない、倒そう。"
"32110-22-ヒフミ" = "えぇっ！？誤解が深まりませんか！？"
"32110-23-風紀委員A" = "のあぁぁっ！？"
"32110-24-風紀委員B" = "こ、こいつら、やはり……。"
"32110-25-ヒフミ" = "アズサちゃーーーん！？"
"32110-26-アズサ" = "……いや、まだ手は出してない。私以外の誰かだ。"
"32110-27-ハナコ" = "そうですね、今のは私たちの遥か後方から飛んできました。しかし、一体誰が……。"
"32110-28-アカリ" = "あらっ★やっぱり先生でしたか！"
"32110-29-ハルナ" = "大当たりでしたわね。ご機嫌よう。ここで何をされているのですか、先生？"
"32110-30" = "[s] \"美食研究会のみんな！\""
"32110-31-コハル" = "あ、あれ！？確かこの間戦った……！？"
"32110-32-ハナコ" = "あら、あの水族館を襲撃した……。"
"32110-33-ヒフミ" = "え、えっと……？も、もう何が何やら……。"
"32110-34-ハルナ" = "……なるほど、状況は概ね理解しました。とにかくこの場所に行かねばならないのですね？"
"32110-35" = "[s] \"うん。\""
"32110-36-ハルナ" = "事情は分かりましたが、タイミングが悪かったですね……この辺りは今、それなりに大きな騒動になっていまして。"
"32110-37-アカリ" = "温泉開発部が市街地のど真ん中をドカン★と爆発させたとかで、とにかくめちゃくちゃな状態なんです。"
"32110-38-ハルナ" = "そのせいで、風紀委員会も慌ただしく動いているという状況で……まあそのおかげで機に乗じて、私たちもこうして風紀委員会の牢屋から抜け出せたのですけれど。ふふっ♪"
"32110-39-アカリ" = "そうですね。それに非常事態ということもあって、またしてもその場に偶然居合わせた給食部のフウカさんが、部の車を快く貸してくれましたし★"
"32110-40-フウカ" = "んんっ！？んーっ！んーーーっ！！"
"32110-41-アカリ" = "新しく買ったばかりの車を貸してくれるなんて……これぞ美しい友情というやつですね★"
"32110-42-フウカ" = "んんっ！んっ、んんんんっ！！！！"
"32110-43-ハナコ" = "……その友情のお相手、縛られたままトランクに積まれてません？"
"32110-44-アカリ" = "問題ありませんわ、フウカさんはこういったことに慣れていますから。"
"32110-45-アカリ" = "もはや専門家と言っても過言ではありませんね★"
"32110-46-ジュンコ" = "ハルナ、アカリ！今どこ！？こっちも包囲網を破ったけど、合流できそう！？"
"32110-47-イズミ" = "ぎゃーーーっ！風紀委員会がまだ追いかけてきてる！！"
"32110-48-ハルナ" = "ジュンコさん、脱出作戦は取り消しです。"
"32110-49-ジュンコ" = "えっ、何で！？"
"32110-50-ハルナ" = "ふふっ、あの時のお礼ということで。先生とトリニティの皆さんのことは、私たちが責任をもってご案内しますわ。"
"32110-51-アカリ" = "ですね★それではとにかく乗ってください！"
"32110-52" = "[s] \"ありがとう、よろしくね。\""
"32110-53-ヒフミ" = "え、えっと……それではよろしくお願いします……？"
"32110-54-アズサ" = "……本当だ、給食って書いてある。じゃあ失礼するけど……給食部のあなたは本当にそのままで大丈夫か？"
"32110-55-アカリ" = "ちゃんと捕まっていてくださいね★出発です！"
"32110-56" = "（そして約2時間後……）"
"32110-57" = "うわあぁぁぁぁぁっ！？"
"32110-58-ヒフミ" = "何ですか何なんですか！？一体どうしてこんなことに！？"
"32110-59-コハル" = "ヒフミ、揺らさないで！照準が合わないからっ！"
"32110-60-ヒフミ" = "わ、私が揺らしてるんじゃありません！じ、地面がさっきから揺れっぱなしで……！"
"32110-61" = "また爆発しましたぁっ！？"
"32110-62" = "トリニティのあなた、バイクの運転上手だね！"
"32110-63-ジュンコ" = "良いじゃん良いじゃん、頑張れー！"
"32110-64-ヒフミ" = "いえいっぱいいっぱいなんですけどぉっ！？"
"32110-65-ハルナ" = "アカリさん、8秒後にまた爆撃が来ますわ。"
"32110-66-アカリ" = "はい、問題ありません★"
"32110-67" = "ハルナぁっ！もう車は良いから降ろして――っ！？"
"32110-68" = "フウカさんもこうして応援してくれていますし、もう少し派手にやるとしましょうか。"
"32110-69" = "そうですね、声援を力に★そして速度に♪"
"32110-70-コハル" = "ショベルカーにブルドーザーまで来てる！？何で！？"
"32110-71-ヒフミ" = "ど、どうしてゲヘナの温泉開発部にまで追われてるんですかぁっ！？"
"32110-72-コハル" = "やばっ、風紀委員会も来た！"
"32110-73-アズサ" = "こちらチームブラボー。チームアルファ、応答せよ。"
"32110-74-ヒフミ" = "あ、アズサちゃん！？"
"32110-75-アズサ" = "名前を言われると、隠語を使った意味が無い……それはそれとして、ごめん。陽動作戦は失敗した、こっちは包囲されてる。"
"32110-76-ヒフミ" = "はいぃ！？"
"32110-77-アズサ" = "前方には火炎放射器を持った温泉開発部、後方はやたら強いツインテールの風紀委員。退路を塞がれた。"
"32110-78-アズサ" = "ハナコと私は何とか自力で逃げるから、後で落ち合おう。幸運を祈る。"
"32110-79" = "（ピッ）"
"32110-80-ヒフミ" = "アズサちゃぁぁぁんっ！？"
"32110-81-ヒフミ" = "わ、私たちはあくまで、試験を受けに来ただけなのに……。"
"32110-82" = "どうしてこんなことになっているんですか！？うわあぁぁぁんっ！"
"32110-83-ヒフミ" = "あ、あうぅ……。"
"32110-84-コハル" = "し、試験会場は、ここ……？"
"32110-85" = "[s] \"ふたりとも、無事で良かった。\""
"32110-86-コハル" = "あっ、先生！！"
"32110-87-ヒフミ" = "せ、先生、ご無事でしたか……必死になってるうちに、いつの間にはぐれてしまってましたね……。"
"32110-88-ヒフミ" = "良かったです……給食部の車が川にダイブした時は、もう終わりかと思いましたが……。"
"32110-89" = "[s] \"ハルナ、親指立てながら沈んでたけど大丈夫かな……。\""
"32110-90-コハル" = "あ、アズサとハナコは！？"
"32110-91" = "お待たせいたしました♡"
"32110-92-アズサ" = "2時45分……何とか開始時間前に着いたか。流石に疲れた。"
"32110-93-コハル" = "えっと……。"
"32110-94-コハル" = "そ、そっちは何があったのよ……。"
"32110-95" = "[s] （今は深くは聞かないことにした。）"
"32110-96-コハル" = "試験の場所って、ここ……？"
"32110-97-ハナコ" = "ゲヘナ自治区第15エリア77番街、廃墟の1階……はい、ここで合ってます。この建物ですね。"
"32110-98" = "ど、どうしてこんなところで試験を……。あ、試験用紙とかどうなるんでしょうか、誰か来てるんですかね……？"
"32110-99-アズサ" = "いや、誰もいなさそうだ。でも何かしら、手段は用意してるはず。"
"32110-100-アズサ" = "……これだ。"
"32110-101-ハナコ" = "これは……不発弾、ですか？"
"32110-102-アズサ" = "L118、牽引式榴弾砲の弾頭だ。スローガンとかの散布用なのか、雷管と爆薬を取り除いて爆発しないようにしてある。"
"32110-103-ハナコ" = "なるほど。L118ということはティーパーティーの……つまり、ナギサさんからということですね。"
"32110-104-アズサ" = "この中に何かあるはず。"
"32110-105-アズサ" = "開けてみよう。"
"32110-106" = "（カチャッ）"
"32110-107-ヒフミ" = "あ、中に紙が……これが試験用紙ということですね！"
