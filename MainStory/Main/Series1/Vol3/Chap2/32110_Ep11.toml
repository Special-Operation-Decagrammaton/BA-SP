"32110-109-ナギサ" = "……これを見ているということは、無事に到着されたようですね。"
"32110-110-ヒフミ" = "な、ナギサ様！？"
"32110-111-ハナコ" = "……。"
"32110-112-コハル" = "え、じゃあこの方が、ティーパーティーの……？"
"32110-113" = "[s] \"ナギサ……！\""
"32110-114-ナギサ" = "ふふっ……恨みの声が聞こえてきますね。まあこれは録画映像なので、リアルタイムには聞こえないのですが。ですので、今の私に話しかけても無意味ですよ。"
"32110-115" = "[s] \"……。\""
"32110-116-ハナコ" = "それでは約束の時間までに試験を終えて、戻ってきてくださいね。"
"32110-117" = "一応引き続きモニタリングはさせていただいておりますので、そのことをお忘れなく……では幸運を祈りますね、「補習授業部」のみなさん。"
"32110-118-ナギサ" = "[ruby=・   ・   ・   ・   ・   ・   ・   ・   ・]どうかお気を付けて[/ruby]。"
"32110-119" = "（ピッ）"
"32110-120-ヒフミ" = "あうぅ……。"
"32110-121-ハナコ" = "なんだか最後、含みのある言い方でしたね……？"
"32110-122-アズサ" = "とにかく時間が無い、早く始めよう。"
"32110-123-ヒフミ" = "は、はい！みなさん入りましょう、いよいよ第2次特別学力試験です！"
"32110-124-ハナコ" = "そうですね。"
"32110-125-コハル" = "う、うん！"
"32110-126" = "[s] \"よし、頑張ろう！\""
"32110-127-温泉部の部員A" = "で、ここが例の場所？"
