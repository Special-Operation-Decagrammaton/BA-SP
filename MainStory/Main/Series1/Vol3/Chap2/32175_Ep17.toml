[translation]
"32175-1-ミカ" = "……なるほどねー、そっかそっかぁ。そりゃみんな「シャーレ」「シャーレ」って言うわけだ。厄介だね、「大人」って。"
"32175-2-ミカ" = "予想外ではあったけど……うん、まあ問題無いかな。ちょっと時間はかかりそうだけど。"
"32175-3-ミカ" = "セイアちゃんもナギちゃんもいなくなるんだし、これでようやく始められるっていうのに、変に邪魔しないでほしいなあ。"
"32175-4-ハナコ" = "……！"
"32175-5-ミカ" = "さて、増援部隊もまだまだ来るみたいだし続けよっか？"
"32175-6-ハナコ" = "ミカさん、一つ聞かせてください！セイアちゃんを襲撃したのも、あなたの指示だったんですか！？"
"32175-7-ミカ" = "……？"
"32175-8-ミカ" = "あはっ、ハナコもそんな目をするんだね。"
"32175-9-ミカ" = "うん、私の指示だよ。セイアちゃんってば、いつも変なことばっかり言って。楽園だのなんだの、難しいことばっかり。"
"32175-10-ミカ" = "でもヘイローを破壊しろとは言ってないよ。私は人殺しじゃない。"
"32175-11-ミカ" = "ただ卒業するまで、檻の中に閉じ込めておいた方が良いなって思っただけ。でも、自然とああなっちゃったの。"
"32175-12-アズサ" = "……。"
"32175-13-ミカ" = "それ以上は、当事者に聞いた方が早いんじゃないかな？……ねえ、白洲アズサ。何だか一部誤解があるみたいだし、私の代わりに説明してくれない？"
"32175-14-ミカ" = "セイアちゃんがあんなことになっちゃったのが、ここまで事態が大きくなったきっかけなんだよ？"
"32175-15-ミカ" = "そこからもう色んなことがどうしようもなくなっちゃったわけだし……ねえ、その辺りどう思う？"
"32175-16-アズサ" = "そ、それは……。"
"32175-17-ヒフミ" = "アズサちゃん……？それはいったい、何のお話、ですか……？"
"32175-18-アズサ" = "ち、違う……あれは……。"
"32175-19-ミカ" = "んー？"
"32175-20-アリウスの生徒" = "トリニティの生徒が一部、こちらへ向かってきています！"
"32175-21-ミカ" = "……？なんで？ティーパーティーの戒厳令に背くような人たちは、もう……"
"32175-22-ミカ" = "……いますよ。ティーパーティーにも命令できない、独立的な集団が。"
"32175-23-アリウスの生徒" = "確認できました、大聖堂からです！ということは……"
"32175-24-アリウスの生徒" = "……シスターフッド！？"
"32175-25" = "次回;そんな世界も（２）"
