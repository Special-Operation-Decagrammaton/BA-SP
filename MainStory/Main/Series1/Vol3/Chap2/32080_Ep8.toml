[translation]
"32080-1" = "第8話;差し込む希望"
"32080-2-アズサ" = "遅い！おはよう！"
"32080-3-ヒフミ" = "あ、アズサちゃん。早いですね？"
"32080-4-アズサ" = "日が昇る前には、すでにここで予習と復習をしてた。"
"32080-5-ハナコ" = "ふふっ、やる気満々ですねアズサちゃん。"
"32080-6-アズサ" = "当然だ、何せ今日も模擬試験がある。だよね、ヒフミ？"
"32080-7-ヒフミ" = "はい、そうですね。アズサちゃんはその様子ですと、もう模試への準備は万全という感じですね？"
"32080-8-アズサ" = "うん。第2次特別学力試験まで二日しか残ってないし、いつまでもみんなに心配をかけるわけにはいかない。"
"32080-9-アズサ" = "そして、今回こそ……！"
"32080-10-コハル" = "す、すごい気合入ってるじゃん……。"
"32080-11-アズサ" = "試験範囲の予想問題も、もう何周もしてある。準備は完璧だ。"
"32080-12-コハル" = "わ、私も負けないんだから！正義実現委員会のエリートの力、見せてあげる！"
"32080-13-コハル" = "では、私も精一杯頑張るとしましょうか♡"
"32080-14" = "[s] \"みんな、良い感じに張り切ってるね。\""
"32080-15-ヒフミ" = "はい……！ではせっかくの勢いですし、早速模擬試験を始めましょうか？"
"32080-16" = "第3次補習授業部模試"
"32080-17" = "[ns] \"じゃあ、スタート！\""
"32080-18" = "……。"
"32080-19" = "ふふっ……♡"
"32080-20" = "こ、これ、知ってるはず……！えっと、んと、んんん……っ！"
"32080-21-ヒフミ" = "（何だかみんな、手の動きが以前より速くなっているような……！）"
"32080-22" = "（模擬試験が終わり、みんなの採点結果が出た。）"
"32080-23-ヒフミ" = "先生……発表をお願いします！"
"32080-24" = "[s] テストの結果を発表する。"
"32080-25" = "第3次補習授業部模試、結果――"
"32080-26" = "ハナコ―69点[007eff]（合格）[-]"
"32080-27" = "アズサ―73点[007eff]（合格）[-]"
"32080-28" = "コハル―61点[007eff]（合格）[-]"
"32080-29" = "ヒフミ―75点[007eff]（合格）[-]"
"32080-30-ヒフミ" = "や、やりました……！？"
"32080-31-コハル" = "ほ、本当っ！？嘘ついてない！？"
"32080-32-アズサ" = "……！"
"32080-33-ハナコ" = "あらあら♡"
"32080-34-ヒフミ" = "すごいです！アズサちゃん、60点どころか70点を超えてしまいました！本当にすごいです！頑張りましたね……！"
"32080-35-アズサ" = "……うん！"
"32080-36" = "コハルちゃんも！ギリギリでしたが、これは紛う方なき合格です！すごいです、やりましたね！"
"32080-37" = "ゆ、夢とかじゃないよね……？ほ、本当に……！"
"32080-38-コハル" = "あはっ……こ、これが私の実力よ！見たか！！"
"32080-39-ヒフミ" = "はい！これぞ正義実現委員会のエリートです、さすがです！"
"32080-40-ハナコ" = "それに、ハナコちゃんも……"
"32080-41-ハナコ" = "……運が良かったですね、うふふ。良い感じの数字です♡"
"32080-42-ヒフミ" = "良かったです……ハナコちゃん、うぅ……。"
"32080-43-ハナコ" = "ひ、ヒフミちゃん……？"
"32080-44-ヒフミ" = "ハナコちゃんに以前何があったのか、何を抱えてるのかはまだ分かりませんが……でも、良かったです……。"
"32080-45-ハナコ" = "ヒフミちゃん……はい、ありがとうございます。"
"32080-46-ヒフミ" = "前の実力をすぐ取り戻せるよう、私もお手伝いしますね。本当に、本当に良かったです……。"
"32080-47-ヒフミ" = "はい……ごめんなさい。ご心配をおかけしてしまって……。"
"32080-48-ヒフミ" = "……ということで、約束通りモモフレンズグッズの授与式を始めますっ！"
"32080-49-アズサ" = "……！！！"
"32080-50-ハナコ" = "あはは……。"
"32080-51-コハル" = "……。"
"32080-52-ヒフミ" = "さあ、どうぞ！みなさん好きな子を、欲しい子を自由に選んで良いんですよ！"
"32080-53-アズサ" = "なるほど、となると……！むむ……！"
"32080-54-ハナコ" = "えっと、私は謹んで遠慮しますね。"
"32080-55-コハル" = "わ、私も……。"
"32080-56-ヒフミ" = "あ、あうぅ……そう、ですか……。"
"32080-57-アズサ" = "ど、どうしよう……私は、私は……！"
"32080-58-アズサ" = "ダメだ、この中から選ぶなんてそんな難しいこと……！"
"32080-59-アズサ" = "あの黒くて角が生えたのも良いし、メガネのカバも……！"
"32080-60-ヒフミ" = "か、カバではなく、ペロロ様は鳥なのですが……。"
"32080-61-アズサ" = "どうすれば……このどちらかを選ぶなんて、私には……！"
"32080-62-アズサ" = "私には、無理だ……頼むヒフミ。ヒフミが私の代わりに選んで……。"
"32080-63-ヒフミ" = "わ、私ですか？"
"32080-64-ヒフミ" = "えっと、スカルマン様とペロロ博士ですよね。強いて選ぶとすると……"
"32080-65-ヒフミ" = "……。"
"32080-66" = "ではこちらの、インテリなペロロ博士でどうでしょうか！"
"32080-67-アズサ" = "……！よし、じゃあこの子だ！"
"32080-68-ヒフミ" = "実はこのペロロ博士は、物知りで勉強もできるという設定なんです。"
"32080-69-ヒフミ" = "まさに今お勉強を頑張って、すごい成長している真っ最中のアズサちゃんにぴったりかなと！"
"32080-70-アズサ" = "なるほど、そうなのか。"
"32080-71-ヒフミ" = "ちょ、ちょっとだけ勉強しすぎたせいで、少しおかしくなっているという裏設定もあるのですが……。"
"32080-72" = "[s] \"良かったね、アズサ。\""
"32080-73-アズサ" = "うん、気に入った。本当に可愛い、好き。えへへ……。"
"32080-74-アズサ" = "ありがとう、ヒフミ。これは一生大切にする。"
"32080-75-ヒフミ" = "あ、ありがたいのですが、そこまで言っていただけるとちょっとビックリしてしまいますね……！？ですが、私も嬉しいです。それは、アズサちゃんがやり遂げたからこそですよ。"
"32080-76-アズサ" = "うん。それでも同時に、友達からもらった初めてのプレゼントだから……。"
"32080-77-アズサ" = "これからはこのカバのことを、ヒフミだと思って大事にする！"
"32080-78-ヒフミ" = "そ、それはちょっと恥ずかしいですね……！？そ、それとカバではなく鳥でして……！"
"32080-79-ハナコ" = "うーん……趣味の世界は広いですねぇ。"
"32080-80-コハル" = "……。"
"32080-81" = "（みんなの士気も高く、勉強は引き続き良い雰囲気で進んでいった。）"
"32080-82" = "（そして時間は過ぎていき……）"
"32080-83-ヒフミ" = "……いよいよ明日です。"
"32080-84-コハル" = "う、うん……。"
"32080-85-アズサ" = "第2次特別学力試験。"
"32080-86-ハナコ" = "ふふっ……何だかあっという間でしたね。"
"32080-87-ヒフミ" = "はい……1週間という短い時間でしたが、私たちはきちんと努力を積み上げました。これは必ずや無駄にはならないと信じています。"
"32080-88-ヒフミ" = "模試の結果も良かったですし……今の私たちであれば十分に、第2次特別学力試験に合格できるはずです！"
"32080-89-ヒフミ" = "ですが慢心することなく、最後まで頑張らないといけません！あと一日、最善を尽くしましょう！"
"32080-90-アズサ" = "うん、当然だ。何なら100点を目指して頑張る。"
"32080-91-コハル" = "わ、私も！"
"32080-92-ハナコ" = "あら、では私もそういうことで……ふふっ♡"
"32080-93-ヒフミ" = "わ、私はちょっと100点は難しそうですが……と、とにかく！"
"32080-94-ヒフミ" = "最終日も、張り切って勉強していきましょう！"
"32080-95" = "[s] \"よし、頑張ろう！\""
"32080-96-ナギサ" = "……お待ちしておりました。ご無沙汰しております、先生。"
"32080-97-ナギサ" = "あれからお変わりはありませんか？合宿の方はいかがでしょう、何か困ったことなどありませんでしたか？"
"32080-98" = "[s] \"うん、おかげさまで何とか。ところで今日はどんな用事？\""
"32080-99-ナギサ" = "ふふっ……この合宿は言うなれば元々、「生徒たちをよく観察できるように」という配慮でした。"
"32080-100-ナギサ" = "そういうことなのですが、いかがでしたでしょうか？何か判明したことなどありましたか？"
"32080-101-ナギサ" = "もっと直接的に言いましょうか、「トリニティの裏切り者」はどなただと思いますか？"
"32080-102" = "[s] \"……前と同じになるけど、私は私のやり方で対処するよ。\""
"32080-103-ナギサ" = "……そうでしたね。ただ第2次特別学力試験を目の前にして、あらためてそこを確認したかったのです。"
"32080-104-ナギサ" = "そこで、本日もこうしてお越しいただいたわけでして。"
"32080-105" = "……おそらく、ミカさんも接触してきましたよね？"
"32080-106-ナギサ" = "ミカさんと何をお話しになったのか……よろしければ、教えていただけません？"
"32080-107" = "次回;黒い手"
