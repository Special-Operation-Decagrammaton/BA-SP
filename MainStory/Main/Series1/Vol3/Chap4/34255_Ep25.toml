[translation]
"34255-1-アリウスの生徒A" = "ど、どうしたんだ！何故マダムと連絡がとれない！？"
"34255-2-アリウスの生徒A" = "緊急事態です！！自治区にある数十箇所のカタコンベの入口から……！！"
"34255-3-アリウスの生徒B" = "と、トリニティの兵が……！！"
"34255-4-アリウスの生徒A" = "な、何だって！？"
"34255-5-正義実現委員会部員A" = "こ、こちらです！"
"34255-6-正義実現委員会部員B" = "しゅ、出動ー！"
"34255-7-アリウスの生徒A" = "だ、誰だ！！"
"34255-8-ミネ" = "ここがアリウス自治区……。"
"34255-9-ミネ" = "セイア様の言う通り……「救護」が必要ですね。"
"34255-10-アリウスの生徒B" = "と、止まれ！！"
"34255-11-ミネ" = "――私をお許しください。個人的な感傷によって、果たすべき義務を疎かにしました。彼女たちもまた、救護が必要な方々であるというのに……。"
"34255-12-ミネ" = "セリナ、ハナエ。彼女たちの治療を。"
"34255-13-セリナ" = "は、はい……団長。"
"34255-14-ミネ" = "そして――これから私が生み出す負傷者も、速やかに救護し治療するようお願いします。"
"34255-15-ミネ" = "参ります！！"
"34255-16-セリナ" = "だ、団長……"
"34255-17-セリナ" = "まさに「ミネ団長が壊して騎士団が治す」という私たちのモットーですね！！#n久しぶりの救護騎士団、本領発揮です！"
"34255-18-セリナ" = "そ、そんなモットーはないのですが……。"
"34255-19-ミネ" = "さあ、テキパキと動いてください！"
"34255-20-ミネ" = "信念と誇りを胸に！適切に、必要なところに救護を！"
"34255-21-ミネ" = "アリウス自治区を解放し、先生とミカ様を救うのです！！"
"34255-22-セリナ" = "はい！"
"34255-23-セリナ" = "夜明けに呼びだされて急にこんな任務だなんて……！#nうわーん！"
"34255-24" = "次回;これからの私たち"
