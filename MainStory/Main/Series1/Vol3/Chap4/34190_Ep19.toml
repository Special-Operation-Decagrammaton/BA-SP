[translation]
"34190-1" = "第19話;無限の可能性"
"34190-2-サオリ" = "先生……姫を助けに行ったんじゃ……？"
"34190-3" = "[s] \"もちろん行くよ。サオリと一緒に。\""
"34190-4-サオリ" = "……！！"
"34190-5-ミサキ" = "ごめんリーダー……説得したけど止められなかった。"
"34190-6-ヒヨリ" = "リーダー……無事でよかったです……いえ、無事じゃないですね？#nと、とにかく、よかったです……。"
"34190-7-サオリ" = "ミサキ……ヒヨリ……。"
"34190-8" = "[ns] \"サオリと戦ったんだね、ミカ。\""
"34190-9-ミカ" = "せ、先生……えっと……。"
"34190-10" = "[s] \"ごめんね、ミカ。\""
"34190-11-ミカ" = "せ、先生……！？"
"34190-12" = "[s1] \"私がきちんと説明をしなければならなかったのに、できていなくて。\"\n[s2] \"ミカと向かい合って、きちんと話をしなければならなかったのに……。\""
"34190-13-ミカ" = "ど、どうして先生が私に謝るの……？"
"34190-14-ミカ" = "ど、どうして先生が私に謝るの……？"
"34190-15-ミカ" = "先生は悪くないよ……悪いのは私でしょう！？#nそれなのに、どうして……。"
"34190-16" = "[s] \"生徒の命が懸かっていたから、サオリの手伝いをしているんだ。\""
"34190-17-サオリ" = "……。"
"34190-18" = "[s] \"だから――アツコを助けたら、一緒にトリニティに戻ろう。\""
"34190-19-ミカ" = "……！！"
"34190-20-ミカ" = "ど、どうして……。"
"34190-21-ミカ" = "……そんな事したって、何も変わらないのに……。"
"34190-22-ミカ" = "私は……退学が決まってて……セイアちゃんも、私のせいで……。"
"34190-23" = "[s] \"私が手伝うよ。\""
"34190-24-ミカ" = "……！！"
"34190-25" = "[s3] \"ミカが直面していること、状況、望んでいた事……。\"\n[s4] \"私はミカがどんな子なのか、知っているから。\""
"34190-26-ミカ" = "あはは……先生は何を言ってるの？"
"34190-27-ミカ" = "あはは……先生は何を言ってるの？"
"34190-28-ミカ" = "私がどんな子なのか知ってる……？#n――私の何を、知ってるの？"
"34190-29" = "私は……「魔女」だよ。"
"34190-30-ミカ" = "何か勘違いしてない？#n先生、ちゃんと私を見てる？この姿を――私が犯した罪を。"
"34190-31" = "[ns] \"そうだね――ミカは悪い子だ。\""
"34190-32" = "[ns5] \"人を騙し、己を偽り。\"\n[ns6] \"人を傷つけ、己を痛めつけ。\""
"34190-33" = "[ns7] \"そんな事をしておきながら、\"\n[ns8] \"結果を受け入れる事ができずに泣いてしまう――そんな子だ。\""
"34190-34" = "[ns9] \"でも、和解の手を差し伸べようとする優しさも持ち合わせているし、\"\n[ns10] \"嫌われる事を恐れて自傷してしまう、不安定な子供でもある。\""
"34190-35" = "[ns11] \"ミカは魔女じゃないよ。\"\n[ns12] \"ミカは、人の言う事を聞かないだけの不良生徒だ。\""
"34190-36" = "[ns] \"だから――ちゃんと、話を聞かせてほしいな。\""
"34190-37-ミカ" = "……。"
"34190-38-ミカ" = "なんで……"
"34190-39-ミカ" = "そのまま、振り向かないで行ってくれたら良かったのに……#nどうして私を苦しめるの……？"
"34190-40-ミカ" = "こんな……最後まで……。"
"34190-41-ミカ" = "まだ私にチャンスがあると信じさせるの……？"
"34190-42" = "[s] \"大丈夫、ちゃんとあるよ。\""
"34190-43-ミカ" = "……？"
"34190-44" = "[s] \"チャンスは、なければ作り出せばいいからね。\""
"34190-45-ミカ" = "……そ、そんなの無茶苦茶だよ。"
"34190-46" = "[ns] \"もしそれがダメでも、次のチャンスを作ればいい。\""
"34190-47" = "[ns] \"失敗したとしても、何度でも。\""
"34190-48" = "[ns] \"道が続いている限り、チャンスは何回だって生み出せる。\""
"34190-49" = "[ns13] \"ミカ、サオリ……\"\n[ns14] \"一度や二度の失敗で道が閉ざされるなんて事はないんだよ。\""
"34190-50" = "[ns] \"――この先に続く未来には、\""
"34190-51" = "[ns] \"無限の可能性があるんだから。\""
"34190-52-サオリ" = "……。"
"34190-53-サオリ" = "……。"
"34190-54" = "[ns15] \"チャンスがないというのなら、私が何度だって作るよ。\"\n[ns16] \"――生徒が未来を諦める事なんてあってはいけない。\"\n[ns17] \"そういう事は、大人に任せて。\""
"34190-55" = "戯言もそこまでになさい！"
"34190-56-ベアトリーチェ" = "よくも私のバシリカでそんな戯言を言えますね。"
"34190-57" = "[s] \"ベアトリーチェ……！\""
"34190-58-ベアトリーチェ" = "興が冷めました。見世物はここまでといたしましょう。"
"34190-59-ベアトリーチェ" = "――あなた達の位置を、私が知らないとでも？#nいいえ、私はただ見守っていただけ。"
"34190-60-ベアトリーチェ" = "こんなつまらない余興はもう終わりにしましょう。#nさあ、今から私の全力を尽くしてあなた達を相手して差し上げます。"
"34190-61-ベアトリーチェ" = "――儀式を、始めましょうか。"
"34190-62-サオリ" = "あ、アツコ……！！"
"34190-63-ミサキ" = "そ、そんな……まだ時間は……"
"34190-64-ヒヨリ" = "た、太陽はまだ昇ってないのに……。"
"34190-65-ベアトリーチェ" = "何を勘違いしているのですか？"
"34190-66-ベアトリーチェ" = "私が日が昇るまで待つとでも？#nいいえ、遊びは終わりです。ロイヤルブラッドのヘイローは、もう間もなく破壊されるでしょう。"
"34190-67-ベアトリーチェ" = "そして――その神秘の欠片を通じ、私は高位の存在となるのです。"
"34190-68-サオリ" = "や、やめろ！！……姫！！アツコ！！"
"34190-69-ミカ" = "……。"
"34190-70-ベアトリーチェ" = "それでは幕引きといたしましょう。"
"34190-71-ベアトリーチェ" = "さぁ、ユスティナの聖女バルバラ。"
"34190-72-ベアトリーチェ" = "戯言ばかりの先生の口を封じなさい！！"
