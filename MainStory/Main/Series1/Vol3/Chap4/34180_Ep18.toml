[translation]
"34180-1" = "第18話;もう一人の私たち"
"34180-2-サオリ" = "こっちだよ、ヒヨリ、ミサキ。#nここに隠れよう。"
"34180-3-ヒヨリ" = "さ、サオリ姉さん……"
"34180-4-サオリ" = "しーっ！静かに。もっと頭を下げて。"
"34180-5-ヒヨリ" = "は、はいぃ……ところで、あの中央にいるのは誰ですか？#nす、す、すごくきれいな服を……き、着てるけど……。"
"34180-6-サオリ" = "私もよく知らない……えらい人なんじゃないかな。"
"34180-7-ミサキ" = "お姫様なんだって。高貴な血を引いているとかなんとか。"
"34180-8-ヒヨリ" = "お、お姫様！？お姫様なんですか？"
"34180-9-ヒヨリ" = "よ、世の中にはお姫様もいるんですね？わ、私たちのような底辺とは違って……。"
"34180-10-ヒヨリ" = "飢えたりもしないだろうし……怪我もしないだろうし……#nみ、道端で寝たりもしないですよね……？そうですよね？"
"34180-11-ミサキ" = "う、うん……そうなんじゃない？"
"34180-12-ヒヨリ" = "……この世には苦しみしかないと思っていたのに……あんなにきれいで、幸せに過ごせているお姫様もいるんですね……なんだか感動です。うわぁぁぁんー！"
"34180-13-サオリ" = "きゅ、急に泣かないで！バレるでしょ！"
"34180-14-ヒヨリ" = "す、すみませんサオリ姉さん……うわぁぁぁん！#nでも……うわぁぁぁん！"
"34180-15-ミサキ" = "……お姫様っていっても私たちと変わらない境遇か、もしかしたらそれ以下の扱いだと思うよ。"
"34180-16-サオリ" = "……？"
"34180-17-ミサキ" = "パレードに見えるけど、あれは人質を敵に送る行列だよ。#n内戦中だからなのかな……こんな事もあるんだね。"
"34180-18-ミサキ" = "あのお姫様も、きっと監獄で飢えることになる。#n食べ残しをもらえたらラッキーなくらいの生活になるよ。"
"34180-19-ヒヨリ" = "あ、あうう……。"
"34180-20-サオリ" = "やめて、ミサキ。ヒヨリが怖がってるでしょ。"
"34180-21-ミサキ" = "……で、どうするのサオリ姉さん？#nここまで来たのに見物だけして帰るつもり？"
"34180-22-サオリ" = "いや、当然襲うよ。#nあの人だかりに紛れ込んで、役立ちそうなものを拝借する。"
"34180-23-サオリ" = "さあ、行こう。"
"34180-24-サオリ" = "やめろ！！"
"34180-25-アリウスの幹部" = "どけ、第8分隊長。"
"34180-26-サオリ" = "ヘイローを壊すつもりなのか！？#nやめろ！！"
"34180-27-ヒヨリ" = "ど、どうか……どうか、もうやめてください……うっ、うぅっ……。"
"34180-28-アリウスの幹部" = "あいつは我々に抵抗したから当然だ。#n退かなければ、お前らも同じ目に遭うことになるぞ。"
"34180-29-殴られた子供" = "ゲホ、……ゲホ。#n笑わせないで……だれが……。"
"34180-30-アリウスの幹部" = "こいつ、よくも！！"
"34180-31-サオリ" = "待て！！"
"34180-32-サオリ" = "……私が、指導しよう。"
"34180-33-アリウスの幹部" = "指導……？"
"34180-34-ミサキ" = "……また無駄なことを。"
"34180-35-サオリ" = "ヒヨリも、ミサキも私が指導した生徒だ。姫も同じく――皆、成績が良いだろう？"
"34180-36-サオリ" = "だから、任せてくれ――私が責任を持ってこいつを指導する。"
"34180-37-ミサキ" = "……痛い。"
"34180-38-サオリ" = "ミサキ……二度と、二度とそんな事をするな！#n絶対にだ……！！"
"34180-39-ミサキ" = "……どうして？"
"34180-40-サオリ" = "なに……？"
"34180-41-ミサキ" = "どうしてダメなの？#nなんで、こんな意味のない苦痛の中で生き続けなきゃいけないの？"
"34180-42-ミサキ" = "――寒くて、空腹で、辛くて。#nただ苦痛が繰り返される日々なのに。"
"34180-43-ミサキ" = "どうして姉さんはこの無意味な苦痛を私たちに強要するの？#nそれに一体何の意味があるの？"
"34180-44-サオリ" = "そ、それは……"
"34180-45-サオリ" = "それ……は……。"
"34180-46-ミサキ" = "……ほら、答えられないじゃん。#n何でも知っているフリをして、姉さんだって私たちと同じくせに。"
"34180-47-サオリ" = "……み、ミサキ！待て……。"
"34180-48-サオリ" = "待て！わ、私は……"
"34180-49-サオリ" = "……許してください……申し訳ございません……。"
"34180-50-サオリ" = "二度と……二度とこのような事は……。"
"34180-51-サオリ" = "二度と、大人の言葉を破りません……反抗しません……将来に希望を抱かないよう努めます……。"
"34180-52-サオリ" = "二度と幸福を望みません……祈りません……。"
"34180-53-サオリ" = "だから、どうか……"
"34180-54-サオリ" = "どうか……慈悲を……。"
"34180-55-サオリ" = "慈悲を……。"
"34180-56-サオリ" = "……どうしてそこまで抵抗するんだ、アズサ？"
"34180-57-サオリ" = "和解の象徴……？いや、それは欺瞞にすぎない。#nお前はそんな存在ではない。"
"34180-58-サオリ" = "お前が準備し、勉強してきたことはすべて「その任務」のためだ。"
"34180-59-サオリ" = "だから、諦めて受け入れろ――すべては虚しいだけなのだから。"
"34180-60-サオリ" = "アズサ……？"
"34180-61-サオリ" = "今、何と？#n待て……。"
"34180-62-サオリ" = "ど、どこへ？アズサ！"
"34180-63-サオリ" = "待て！何を……お前はどこに行くんだ？#n私たちはまだ「ここ」にいるのに……。"
"34180-64-サオリ" = "アズサ……"
"34180-65-サオリ" = "お、お前は……知ったのか？#nお前には……その答えが分かっているのか………？"
"34180-66-サオリ" = "教えてくれ、私は……"
"34180-67-サオリ" = "私は一体……どうすれば……"
"34180-68-サオリ" = "……アズサ。"
"34180-69-ミカ" = "……アズサ？"
"34180-70-サオリ" = "……！！#nく、ぐっ……。"
"34180-71-サオリ" = "……う、ぐっ。"
"34180-72-ミカ" = "……その傷じゃ無理だよ、サオリ。"
"34180-73-サオリ" = "……そうか。"
"34180-74-サオリ" = "そうだな……私は負けたのか。"
"34180-75" = "……もういい。"
"34180-76-ミカ" = "もう、いい……？"
"34180-77-サオリ" = "……ああ。これ以上もう、何が正しいことなのか分からない。"
"34180-78-サオリ" = "今まで、これが正しいと思って突き進んできた……#nだが、いざ振り返ってみたら、すべてが間違っていた……。"
"34180-79-ミカ" = "……[ruby=しらす]白洲[/ruby]アズサ。"
"34180-80-サオリ" = "……？"
"34180-81-ミカ" = "あなたはアズサちゃんに、何を聞きたかったの？"
"34180-82-サオリ" = "……聞いていたのか。"
"34180-83-ミカ" = "補習授業部のアズサちゃん。#nそもそも私のクーデター計画を手伝うために選ばれたスパイだったでしょ？"
"34180-84-ミカ" = "先生の助けがなければ、ただのコマの一つだったはずなのに……"
"34180-85-サオリ" = "……アズサは。"
"34180-86-サオリ" = "もともと、スパイとして選んだわけではない。"
"34180-87-ミカ" = "……えっ？"
"34180-88-サオリ" = "あの子は……"
"34180-89-サオリ" = "……「和解の象徴」になる予定だった。"
"34180-90-ミカ" = "……。"
"34180-91-ミカ" = "なっ……"
"34180-92-サオリ" = "トリニティとアリウスの……#n最初にその表現を使ったのはお前だったな、ミカ。"
"34180-93-ミカ" = "何言ってるの……それは……#nうん、思い出したよ……先生を騙すために適当に言い繕った……"
"34180-94-サオリ" = "――いや。お前が初めて訪ねてきた時に使った言葉だった。"
"34180-95-サオリ" = "セイアの襲撃が起こる前――そもそもエデン条約も、お前のクーデター計画も、何一つ計画されていなかった頃。"
"34180-96-ミカ" = "……。"
"34180-97-サオリ" = "お前はあの時、アリウスと和解したいと言った。"
"34180-98-ミカ" = "はじめまして☆誰だか知らないけど、あなたがアリウスの生徒だよね……？"
"34180-99-ミカ" = "今日、とてもいい天気だね？すごくのどかで……"
"34180-100-サオリ" = "用件だけ言え、トリニティ。"
"34180-101-ミカ" = "うわぁ……アイスブレイクとか嫌いなんだね。#n……うん、じゃあ仕方なく本題から。"
"34180-102-ミカ" = "――私は、あなた達アリウスと和解したい。"
"34180-103-サオリ" = "和解……？"
"34180-104" = "うん。ちょっと過激な主張かもしれないけど、でも……"
"34180-105-ミカ" = "あなた達は多分、まだ私たちを憎んでいるよね？"
"34180-106-ミカ" = "だから私たちの助けも、連邦生徒会の助けも断って、秘匿された自治区で孤立しているんでしょ？過去の憎悪が残っているから。"
"34180-107-サオリ" = "……。"
"34180-108-ミカ" = "でも、これを解決するには……互いの憎悪が大きすぎる……#nそれに、積み重なった誤解も相当だろうし……まぁ、簡単じゃないよね。"
"34180-109-ミカ" = "ナギちゃんも、セイアちゃんも反対するのは当たり前だよ……。"
"34180-110-ミカ" = "でもさ……仲良くするって、そんなに難しいのかな？#nお互いに少しずつ歩み寄れば、いつかは叶うものじゃない？"
"34180-111-ミカ" = "私はそう思うの……だから、少しずつ努力しようと思って、ここに来たの。"
"34180-112-サオリ" = "……その言葉が本心であると、どうやって信じろと？"
"34180-113-ミカ" = "うん……その反応も理解できるよ。#nだから、考えてみたの。"
"34180-114-ミカ" = "あなた達アリウスの生徒1人をトリニティに転校させるのはどうかな？#nもちろん内緒で。"
"34180-115-ミカ" = "私が後見人になれば何とかなるよ。#nこう見えても、私はティーパーティーだからね。"
"34180-116-サオリ" = "……。"
"34180-117-ミカ" = "それで、アリウス生が何の問題もなく、私たちの学園で仲良く過ごしながら幸せになれるということを証明するの。"
"34180-118-ミカ" = "言わばその子が「和解の象徴」になってくれるってこと。#nどうかな？"
"34180-119-サオリ" = "……荒唐無稽な計画だな。"
"34180-120" = "で、でも……そんな存在がいたら、きっとセイアちゃんも、ナギちゃんも納得してくれると思うんだ！"
"34180-121-サオリ" = "……。"
"34180-122-サオリ" = "いいだろう。だが、私一人で決められる問題ではない。#n次の連絡を待ってもらうことになる。"
"34180-123-ミカ" = "え？ちょ、ちょっと待って！#nそんな子、本当にいるの？"
"34180-124-サオリ" = "……。"
"34180-125-サオリ" = "アズサ、任務だ。"
"34180-126" = "……なに？"
"34180-127-ベアトリーチェ" = "和解？呆れるほど純真無垢な発想ですね。罠でなければおかしいくらいです。"
"34180-128-ベアトリーチェ" = "ふむ……まあ、急ぐことはないでしょう。#n無垢なのか、それとも腹黒い蛇なのか、ひとまず見守ることにしましょうか。"
"34180-129-ベアトリーチェ" = "一旦断ってください。#nそして適度に言いくるめて関係を保ち、トリニティの情報を得なさい。"
"34180-130-サオリ" = "それは断るという……事ですか？"
"34180-131-ベアトリーチェ" = "もちろんです。和解の象徴？何を寝ぼけているのでしょう。#n彼女は、トリニティの情報を得る道具として利用して差し上げましょう。"
"34180-132-サオリ" = "……。"
"34180-133-ベアトリーチェ" = "サオリ……何か問題でもありますか？#nまさか私の許可を得ず、何か準備でも？"
"34180-134-サオリ" = "い、いえ……違います、マダム。"
"34180-135-ベアトリーチェ" = "まさか、忘れてはいませんよね？#nあなた達が苦しんでいる理由を――寒さに震え、飢え続ける理由の根源を？"
"34180-136-サオリ" = "……はい。それはすべて私たちを追放したトリニティのせいです。"
"34180-137-ベアトリーチェ" = "ええ。仇と和解なんて未来永劫あり得ません。#n――ゆめゆめ、その憎悪を忘れぬように。"
"34180-138-サオリ" = "はい、マダム。#n私は憎悪を忘れません。"
"34180-139-サオリ" = "何故だったのかは私もよく分からない……でもアズサなら……#nあの、アズサなら……。"
"34180-140-サオリ" = "私は……アズサにそんな存在になってほしいと思っていたのだろう……。"
"34180-141-ミカ" = "……。"
"34180-142-サオリ" = "だが、それを確認できる機会は永遠に来なかった……。"
"34180-143-アリウスの生徒" = "……セイアちゃんはここにいる。"
"34180-144-アリウスの生徒" = "静かに、病院にでも送ってくれれば……。"
"34180-145-アリウスの生徒" = "そういうことだから、よろしくね。"
"34180-146-ミカ" = "……。"
"34180-147-サオリ" = "……マダムはその機会を逃さなかった。#nセイアはマダムにとって目障りな存在だったから。"
"34180-148-サオリ" = "お前は私たちを便利な私兵くらいに思ってたのだろう。#nそうでなければ極秘であるセイアの位置を教えるはずがない。"
"34180-149-サオリ" = "だが、私たちはそんな便利な存在なんかじゃない。#n私たちは……。"
"34180-150-サオリ" = "「ヘイローを壊す方法」を学び、訓練し、その道具を持っている………#n人殺し集団だ。"
"34180-151-サオリ" = "「ヘイローを破壊する爆弾」でセイアを殺す任務が私たちに下った。"
"34180-152-サオリ" = "アズサは……和解の象徴となるべくトリニティの多くの知識を持っていたから、その任務に投入されることになった。"
"34180-153-ミカ" = "……ナギちゃんが変なことを企んでる。"
"34180-154-サオリ" = "……。"
"34180-155-ミカ" = "セイアちゃんが死んでしまってから気が抜けちゃったみたい。#nゲヘナと平和条約だなんて、全く。ナギちゃんったら……。"
"34180-156-ミカ" = "だから――そう。この前私が提案した計画を始めてほしいな。"
"34180-157-ミカ" = "トリニティ内部にスパイを送り込むの。#nセイアちゃんの時とは違って、慎重な方法でね。"
"34180-158-サオリ" = "ミカ……"
"34180-159-サオリ" = "私はお前のことが理解できなかった。#n一体何を望んでいるのか、全く見当がつかなかった。"
"34180-160-サオリ" = "ただ単にバカなのかもしれないとも思った……だが、もしも本当にそう思ってくれているのなら……"
"34180-161-サオリ" = "お前から「和解」という言葉を初めて聞いた時も……何の[ruby=うわごと]譫言[/ruby]だと頭では理解しつつも……"
"34180-162-サオリ" = "もしも、「そんな未来」が私たちにあるのなら、と……。"
"34180-163-サオリ" = "そんな考えを、完全に消すことはできなかった……。"
"34180-164-ミカ" = "……。"
"34180-165-サオリ" = "ミカ､お前は……"
"34180-166-サオリ" = "本当に、心から私たちと和解したかったのだろう。"
"34180-167-ミカ" = "……。"
"34180-168-サオリ" = "お前は善意を持って私たちを訪ねてきた。#nそんなお前の心を踏みにじり、騙し、この地獄に導いたのは私だった。"
"34180-169-サオリ" = "そして、お前はこの地獄を受け入れられなかった……だから、自分自身の記憶に蓋して否定した。"
"34180-170-サオリ" = "そう、お前だけじゃなく……。"
"34180-171-サオリ" = "……姫が声と顔を隠して生きなければならなくなったことも、#nヒヨリとミサキをスクワッドに引き込んだことも……"
"34180-172-サオリ" = "「和解の象徴」ではなく、「人殺し」として――皆を欺いて踏みにじらなければならない「スパイ」として、再びトリニティに送られたアズサも……"
"34180-173-サオリ" = "――すべてが私のせいだ。"
"34180-174" = "私は……猟犬なんかじゃない。私は……"
"34180-175-サオリ" = "周囲のすべてに苦痛を撒き散らす……疫病神だ。"
"34180-176-サオリ" = "……。"
"34180-177-サオリ" = "アズサに聞きたかったこと、か……#nそう……あったな……。"
"34180-178-サオリ" = "そのすべてを押しつけられたにも関わらず、アズサは……"
"34180-179-サオリ" = "……幸せそうに見えたんだ。"
"34180-180-サオリ" = "誰にも感情を表さず、私たちを最後まで受け入れず、#n孤独を貫いていたあのアズサが……。"
"34180-181-サオリ" = "水底の貝のように固く心を閉ざしていたあの子が……。"
"34180-182-サオリ" = "友達と……大人と一緒に力を合わせて……"
"34180-183-サオリ" = "最後には、苦難を乗り越えて……。"
"34180-184-サオリ" = "晴れやかで幸福に満ちた青空の下に……進んで行った……。"
"34180-185-サオリ" = "いや……そんな事ない。#nあんな……あんなもの嘘だ。偽物だ！"
"34180-186-サオリ" = "いつかは消えてしまう蜃気楼のような幸福だ！"
"34180-187-サオリ" = "[ruby=こうべ]頭[/ruby]を垂れ、祈り縋ったって何も変わらない！"
"34180-188-サオリ" = "アズサ、私たちは結局幸せになどなれない。#nよくわかっているだろう？――すべては虚しいものだということを。"
"34180-189-サオリ" = "しかし……結局、認めざるを得なかった……。"
"34180-190-サオリ" = "ああ……そうか。"
"34180-191-サオリ" = "私たちの憎悪も……「すべては虚しいもの」という言葉も……#nやってきたすべてが……"
"34180-192-サオリ" = "――全部、嘘だったんだ……。"
"34180-193-サオリ" = "[ruby=ぐどん]愚鈍[/ruby]で[ruby=だじゃく]惰弱[/ruby]だった私は……疫病神のように周囲を破滅に追い込んだんだ……。"
"34180-194-サオリ" = "――嗚呼、結局そういう事だったんだな。#n全て、私が原因だった。"
"34180-195-サオリ" = "アズサは私から離れられたから幸せになれたんだ。"
"34180-196-サオリ" = "私は、その真実を最後まで否定したかったのだろう……。"
"34180-197-サオリ" = "アズサ、お前なら……正解が分かるのか？"
"34180-198-サオリ" = "アズサ……私は……。"
"34180-199" = "――幸せに、なれるだろうか？"
"34180-200-サオリ" = "どうすれば、私もお前のようになれるのだろうか。#nそんな機会は存在するのだろうか？私が、そんなことを願ってもいいのだろうか……？"
"34180-201-サオリ" = "もし……私が……。"
"34180-202" = "……いい大人に、もう少し早く出会えていたら……。"
"34180-203-サオリ" = "こんな私にも……他の人生があったのだろうか……。"
"34180-204-サオリ" = "こんな悲惨な結末ではなく、他の未来を迎えられたのだろうか……。"
"34180-205-サオリ" = "私にも……そんな……機会が……。"
"34180-206-サオリ" = "アズサ……お前はあの時……何と言っていたんだ？"
