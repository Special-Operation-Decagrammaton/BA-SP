[translation]
"34210-1" = "第21話;至聖所へ"
"34210-2-ミカ" = "はぁ……はぁ……"
"34210-3" = "[ns] \"ミカ！大丈夫？\""
"34210-4-ミカ" = "……。"
"34210-5-ミカ" = "……アレは私が引きつけるよ。"
"34210-6-ミカ" = "サオリ……あなたがあの子を助けたい理由が、少しだけ分かるよ。"
"34210-7-ミカ" = "私もそうだったから……だから……"
"34210-8-ミカ" = "私が引きつけている間に――アツコを助けに行って。"
"34210-9-ミカ" = "先生……ごめんね。#nいつも問題ばっかり起こして……。"
"34210-10-ミカ" = "そして……ありがとう。#n私にもまだチャンスがあると言ってくれて……。"
"34210-11-サオリ" = "お前は……。"
"34210-12-ミカ" = "行きなよ、サオリ！#n時間がないんでしょう？"
"34210-13-サオリ" = "……ああ。"
"34210-14" = "[s] \"ミカ、気をつけて……。\""
"34210-15-ミカ" = "……心配しないで、先生。#n知ってるでしょ？――私って結構強いんだよ？"
"34210-16-サオリ" = "……。"
"34210-17-ミサキ" = "……自分勝手な女。"
"34210-18-サオリ" = "……急ごう。"
