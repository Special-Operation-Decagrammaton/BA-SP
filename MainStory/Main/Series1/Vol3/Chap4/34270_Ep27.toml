[translation]
"34270-1" = "第27話;エピローグ"
"34270-2-ヒヨリ" = "こ、こっちの道は初めてです……。"
"34270-3-ヒヨリ" = "どこに繋がっているんでしょうか……。"
"34270-4-アツコ" = "とりあえず進んでみよう。"
"34270-5-アツコ" = "どこだって、これから私たちが初めて歩く道だから。"
"34270-6-ヒヨリ" = "はい……そうですね。"
"34270-7-ヒヨリ" = "……あれ。"
"34270-8-ヒヨリ" = "り、リーダーは！？"
"34270-9-アツコ" = "あれ？"
"34270-10-ヒヨリ" = "た、たしかリーダー後ろにいたはずなんですが………#nい、いなくなりました！？"
"34270-11-ミサキ" = "……チッ。"
"34270-12-アツコ" = "ミサキ……？"
"34270-13-ミサキ" = "リーダーは、どっか行ったよ……。"
"34270-14-ヒヨリ" = "ど、どっか行ったって、なんですか！？"
"34270-15-ミサキ" = "私に、みんなを頼むって言い残して……勝手だよね。"
"34270-16-ヒヨリ" = "リーダー……ど、どうして……。"
"34270-17-アツコ" = "……。"
"34270-18-ミサキ" = "ずるいよサオリ。#nこんな風に足枷を残すなんて……。"
"34270-19-ミサキ" = "私には、重すぎる……。"
"34270-20-アツコ" = "……大丈夫、ミサキ。"
"34270-21-ミサキ" = "姫……。"
"34270-22-アツコ" = "サオリには、もう少しだけ時間が必要なんだ。"
"34270-23-アツコ" = "――己を振り返り、自身を知る時間が。"
"34270-24-アツコ" = "自分の命題に答えるための時間が……。"
"34270-25-ヒヨリ" = "リーダーは……サオリ姉さんは、帰ってくるんでしょうか？"
"34270-26-アツコ" = "うん……サッちゃんは帰ってくるよ。"
"34270-27-ヒヨリ" = "今後、私たちだけで……生きていかないといけないんですか？"
"34270-28-アツコ" = "うん……いつまでもサッちゃん頼りじゃいけないからね。"
"34270-29-ミサキ" = "そんな……"
"34270-30-ミサキ" = "私たちは、これからどうすればいいの……？"
"34270-31-ミサキ" = "アリウス自治区にも、トリニティにも、ゲヘナにも……私たちの居場所はない。"
"34270-32-ミサキ" = "……追撃から逃げるために、街を転々とし続ける事になると思う。"
"34270-33-ミサキ" = "私たちを待ち受けているのは、そんな未来だよ……姫。"
"34270-34-アツコ" = "うん……それでも、私たちは大丈夫。"
"34270-35-ミサキ" = "……。"
"34270-36" = "姫ちゃん……。"
"34270-37-ミサキ" = "姫……簡単なことじゃないよ。"
"34270-38-アツコ" = "ううん、大丈夫だよ。"
"34270-39-ミサキ" = "……。"
"34270-40-アツコ" = "こんな事で弱音を吐いたら、コンクリートに咲いてる花に失礼だからね。"
"34270-41-アツコ" = "アズサはあの時、花を見てこう言ってた。"
"34270-42-アツコ" = "それがたとえ虚しいことであっても……抵抗し続けることを止めるべきじゃないと。"
"34270-43-アツコ" = "アズサがやり遂げているのだから、私たちもできないわけないよ。#n私たちの青春は、私たちだけのものだから。"
"34270-44-アツコ" = "ちゃんと見守ってくれる人もいるし……そうでしょう？"
"34270-45-ミサキ" = "……先生、ですね。"
"34270-46-ミサキ" = "……うん。"
"34270-47-ミサキ" = "そうだね……。"
"34270-48-アツコ" = "うん、一緒に頑張ろう。"
"34270-49-サオリ" = "……。"
"34270-50-ブラックマーケット幹部" = "……ククッ。見たことのない顔ですね。#nここまで流れてきたということは、それなりの事情がおありなのでしょう。"
"34270-51-ブラックマーケット幹部" = "実力さえあれば何でも構いません。#nさて、どんな依頼をお望みですか？#n簡単なもの？難しいもの？"
"34270-52-サオリ" = "難しいやつで……いや、どれほど不可能な依頼でも解決してみせよう。#n依頼料が高い任務をくれ。"
"34270-53-サオリ" = "（私は犯罪者だ――追われる身でもあるし、この先は辛く苦しい日々が続くだろう）"
"34270-54-サオリ" = "（しかし、その苦難の旅路の果てに……）"
"34270-55-サオリ" = "（私たちにも素晴らしい未来があるというのなら……）"
"34270-56-アツコ" = "うん、訪れるよ……私たちにも……"
"34270-57-アツコ" = "……最後には、きっとハッピーエンドを迎えられる。"
"34270-58-アツコ" = "私たちもそうだよね、サオリ。"
"34270-59-ミカ" = "……。"
"34270-60-ナギサ" = "……。"
"34270-61-セイア" = "……。"
"34270-62-セイア" = "先生……私は、もう予知夢を視る事はないだろう。"
"34270-63-セイア" = "其れが――かの夢から抜け出すための代償だった。"
"34270-64-セイア" = "最後の予知夢で目撃した事……其れを、先生と議論しなければならない……。"
"34270-65-セイア" = "だが……其れは、もう少し未来でも良いだろうか？"
"34270-66-セイア" = "今はただ……此処に集まっている、私たちの「現在」に注力したいから。"
"34270-67-セイア" = "そして……私たちは……"
"34270-68-セイア" = "今までのように力を合わせ――努力を重ねて、その試練を乗り越えるから。"
"34270-69" = "[ns] \"それじゃあ、聴聞会を始めようか。\""
"34270-70-サオリ" = "待て、約束が違うぞ。"
"34270-71-ブラックマーケット幹部" = "はて、何の事でしょうか？"
"34270-72-サオリ" = "これはなんだ？#n予定額の半分も入っていないぞ！！"
"34270-73-ブラックマーケット幹部" = "先に約束を破ったのはそちらですが。"
"34270-74-ブラックマーケット幹部" = "こちらの契約書にも書かれておりますように、生徒は時給1000円です。"
"34270-75-ブラックマーケット幹部" = "ところが、あなたは中退ということを隠したじゃありませんか？#nだから時給500円です。"
"34270-76-サオリ" = "ちょっと待て……それは……"
"34270-77-ブラックマーケット幹部" = "そこに税金と各種費用、食費を除いたのがこの金額ですが……何か問題でも？"
"34270-78-ブラックマーケット幹部" = "ああ……それに、指名手配までされているようですが。#nこの事実が知られたら困るのはそちらではないのですか？"
"34270-79-ブラックマーケット幹部" = "ということで、口止め料としてさらに15%差し引かせていただきます。"
"34270-80-サオリ" = "ま、待て……それじゃあ私の給料は……。"
"34270-81-ブラックマーケット幹部" = "0円ですね。"
"34270-82-ブラックマーケット幹部" = "さあ、では出口はあちらです。"
"34270-83-ブラックマーケット幹部" = "何か言いたいことでも？#nそれともヴァルキューレ警察学校にでも訴えてみますか？"
"34270-84-サオリ" = "……いや、分かった。"
"34270-85-サオリ" = "教訓を得たということにしよう。"
"34270-86-ハルカ" = "し、失礼します。"
"34270-87-ブラックマーケット幹部" = "あなたは……この間、依頼をした……！？"
"34270-88-ハルカ" = "あ、はい……え、えっと……。#nうっかりしてしまって……。"
"34270-89-ブラックマーケット幹部" = "精算は済ませたはずですが。"
"34270-90-ハルカ" = "は、はい……そ、そ、そうです。#nその通りです……だ、だから……。"
"34270-91-ハルカ" = "ゆ、許せ……"
"34270-92-ブラックマーケット幹部" = "ゆるせ？"
"34270-93-ハルカ" = "許せません！！！！！！！"
"34270-94-ブラックマーケット幹部" = "ひ、ひいぃっ！？た、助けて！？"
"34270-95-ハルカ" = "アル様のお金を踏み倒すなんて、絶対許せません！！！"
"34270-96-ハルカ" = "……はぁ、はぁ。"
"34270-97-ハルカ" = "あ、アル様が、ちゃんと挨拶して……#nし、しっかりと計算してくるようにって……だ、だから……。"
"34270-98-ハルカ" = "こ、これでしたら、ちゃんと、挨拶になりましたよね……？"
"34270-99-サオリ" = "……。"
"34270-100-ハルカ" = "あ、ああっ……！？#n他の方がいらっしゃっていたなんて！？"
"34270-101-ハルカ" = "お、お騒がせし、た、大変失礼しました！！"
"34270-102-サオリ" = "……いや、別に。"
"34270-103-ハルカ" = "で、では、また今度……#n私は爆弾を設置しに行かなければならないので……。"
"34270-104-サオリ" = "これが、裏世界のやり方か……。"
"34270-105-アル" = "なっ、何ですってーーーー！？"
"34270-106-ハルカ" = "ご、ごめんなさい……ごめんなさい……ごめんなさい……。#n「挨拶」ってそういうのではなかったなんて……ま、またご迷惑をかけてしまいました。し、死にましょうか？死んでもいいですか？"
"34270-107-カヨコ" = "……はぁ。"
"34270-108-ムツキ" = "あははははは！超ウケる！！#nハルカちゃん本当に挨拶してるー。"
"34270-109-ムツキ" = "そこ、すっごく怖そうな連中だったのに、これからどうするのー？"
"34270-110-カヨコ" = "また騒がしくなりそう……はぁ。"
