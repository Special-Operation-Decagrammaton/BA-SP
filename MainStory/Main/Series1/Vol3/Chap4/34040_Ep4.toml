[translation]
"34040-1" = "第4話;夢と蜃気楼の狭間で"
"34040-2" = "[ns] \"キヴォトスが、終焉……?\""
"34040-3-セイア" = "……。"
"34040-4-セイア" = "ああ、そうだ。"
"34040-5-セイア" = "終焉を迎えて滅亡したというべきか……結果的にそこへと至ってしまうのか……それは[ruby=よう]杳[/ruby]として知れないけれどね。"
"34040-6" = "[s] \"どんな光景だったの……？\""
"34040-7-セイア" = "天から巨大な塔が飛来し、虚空が緋色に染められ――"
"34040-8-セイア" = "不吉な塔は、まるで悲鳴を上げるように鳴動し……この世界を少しずつ削りとって……そうして、世界の破片を「何か」に被せていった。"
"34040-9-セイア" = "削られた世界の欠片が嵐のように吹き荒れる中で、黒い光が天から舞い降りて……世界が終焉に傾いていく……。"
"34040-10-セイア" = "そうして……キヴォトスのすべてが崩壊し――"
"34040-11-セイア" = "塵一つ残さずに、すべてが虚無へと消えた。"
"34040-12" = "[ns] \"…………。\""
"34040-13-セイア" = "私が視たのが単なる悪夢なのか、それとも本当に未来を、あるいは過去に起きたことを観測したものだったのか……。"
"34040-14-セイア" = "今のところ、何も分かってはいない……けれど、その光景を目にしてしまったからには、私は真実を見極めなければならない。"
"34040-15-セイア" = "……。"
"34040-16-セイア" = "そうしてあの光景が何かを明らかにするために、私は果てしない明晰夢の中を彷徨い歩いた。"
"34040-17-セイア" = "……明晰夢は、夢である自覚をもって意識的に微睡みに沈む行為。起こった事を全て記憶できることの代償に、夢と現実の境界が曖昧になってしまう。"
"34040-18-セイア" = "繰り返し夢と現実を行き来しすぎた私には今、自分が立っている世界がどちら側なのかさえ知覚できていない。"
"34040-19" = "[s] \"すごく危険な状態に聞こえるけど……大丈夫？\""
"34040-20-セイア" = "……まあ、否定をすれば嘘だろうね。しかし、それでも必要な事だ。"
"34040-21-セイア" = "以前の私だったなら、未来を知ることを恐れて狭間の世界に逃げ込んでいただろう。けれど、今回ばかりはそうもいかない。"
"34040-22-セイア" = "あの光景がただの悪夢ではないと、私の直感が告げているんだ。"
"34040-23-セイア" = "アレはキヴォトスに存在し得ない――キヴォトスの外部から到来したモノ。私の想像を遥かに上回る、理解の及ばない存在。"
"34040-24-セイア" = "これは私の推測だが、恐らくアレを招いたのは「ゲマトリア」――"
"34040-25-セイア" = "彼らがキヴォトスに外部の存在を呼び寄せ、終焉に導こうとしているのではないかと考えている。"
"34040-26" = "[s] \"……ゲマトリアが？\""
"34040-27-セイア" = "もしかしたら、あの破滅を防ぐ方法があるかもしれない……だから、私は……。"
"34040-28" = "[ns] \"セイア。\""
"34040-29-セイア" = "……うん？"
"34040-30" = "[s1] \"「ゲマトリア」に関わる事なら、今すぐ手を引いたほうがいい。\"\n[s2] \"セイアは今、あまりにも危険な事をしてるよ。\""
"34040-31-セイア" = "……。"
"34040-32-セイア" = "……。"
"34040-33-セイア" = "ああ、たしかに……あの集団の痕跡を追うのは、自殺行為に近いかもしれないね。"
"34040-34" = "[s3] \"セイアの推測が事実だったとしても、今のようなやり方はダメ。\"\n[s4] \"きちんと情報を集めて、みんなで協力してやる事だよ。\""
"34040-35-セイア" = "……。"
"34040-36" = "[s] \"そういう事は大人に任せて。セイアは、目の前にいる人をちゃんと見てあげて。\""
"34040-37-セイア" = "（ミカ……）"
"34040-38-セイア" = "……君の言うことはもっともだよ。"
"34040-39-セイア" = "まだ何の情報もない状態であの夢に圧倒されて……私は、自分を見失っていただけなのかもしれない。"
"34040-40-セイア" = "それに、今私に何か起きてしまえば。ミカが……彼女がまた選択を誤ってしまう。"
"34040-41-セイア" = "……そう。"
"34040-42-セイア" = "今、ミカは考え得る限りで最悪の状況下にある。"
"34040-43-セイア" = "……あの子は今まで甘やかされながら生きてきた。皆が彼女を崇め、讃える――まるで童話に出てくるお姫様のような存在として。"
"34040-44-セイア" = "そんな彼女が、今のような――世界から憎悪の対象になるというのは、おそらく生まれて初めての体験だろう。"
"34040-45-セイア" = "彼女が背負うには、その運命は少し過酷すぎるかもしれない……"
"34040-46-セイア" = "……今は、ミカをあの泥濘から救うことが最優先事項。"
"34040-47-セイア" = "どうして私は、それに今まで気付かずに……。"
"34040-48-セイア" = "霧が晴れたような気分だよ……ありがとう、先生。私たちは一歩ずつ――まずはミカの問題から解決していかなければならない。"
"34040-49" = "[s] \"ありがとうセイア。ところで、ミカが謝りたがってたよ。\""
"34040-50-セイア" = "謝る……？私は既に彼女を許したはずだが……。"
"34040-51-セイア" = "……ああ、それは夢の中での話だったか。"
"34040-52-セイア" = "そうか……まだ、ミカは私に許されていないと思っているのか。"
"34040-53-セイア" = "自分が犯した罪……その一番の被害者が私だと、彼女は感じているのだろうから。"
"34040-54-セイア" = "愚かだね……。"
"34040-55-セイア" = "我が儘で、浅慮で、衝動的で――欲張りなくせに自傷的でもある君は……"
"34040-56-セイア" = "童話に出てくるような、生意気で傲慢な悪役令嬢がお似合いだったのに。"
"34040-57-セイア" = "よりによって……。"
"34040-58-セイア" = "己の気に入らない存在を苦しめようとした悪役令嬢は……"
"34040-59-セイア" = "童話ではなく、寓話の主題となる愚かな存在と成り果ててしまった。"
"34040-60-セイア" = "だが……そんな彼女にも救いがあるとすれば……。"
"34040-61-セイア" = "私が一命をとりとめた事で、彼女が辛うじて人殺しには墜ちなかったという点。"
"34040-62-セイア" = "ミカがこの地獄のような状況に耐えていられるのは……その事実があるからなのだろうね。"
"34040-63-セイア" = "私の安否は、ミカにとって心の拠り所になっていると言っても過言ではない。"
"34040-64-セイア" = "……。"
"34040-65-セイア" = "私は彼女に優しくなかったのに……彼女は私のせいであんな……。"
"34040-66-セイア" = "……ああ、そうだな。"
"34040-67-セイア" = "子供じゃあるまいに……私もミカも「ごめんね」の一言すら伝えられずにいるだなんて……恥ずかしい限りだ。"
"34040-68-セイア" = "――今すぐ、ミカを呼んできてもらうとしようか。"
"34040-69-セイア" = "彼女と言葉を交わし……そして、明日の聴聞会に私も参加する。"
"34040-70-セイア" = "ミカの罪状の中で最も重いのは、私に危害を加えたことだから――その当事者である私が一緒にいれば、多少罪は軽くなるだろう。"
"34040-71-ティーパーティーの行政官" = "お、お呼びでしょうかセイア様？"
"34040-72-セイア" = "悪いが、ミカに会いたい。今すぐここに連れてきてもらえるかな？"
"34040-73-ティーパーティーの行政官" = "み、ミカ様をですか？わ、分かりました。ナギサ様に確認してみます！"
"34040-74-セイア" = "ありがとう。あと……なるべくミカと二人きりで話したいと伝えてくれないか。どうにも、他人が同席するのは恥ずかしいからね……。"
"34040-75-ティーパーティーの行政官" = "か、かしこまりました！あわせて確認します！"
"34040-76" = "[ns] \"それじゃあ、私もナギサのところに行って、この事を伝えてくるよ。\""
"34040-77-セイア" = "ああ……ありがとう先生。"
"34040-78-セイア" = "私は――久しぶりに人と接しすぎたみたいだ……少し、横になってくる。"
"34040-79-セイア" = "……悪いが、先生。それでは失礼……。"
"34040-80" = "[s] \"それじゃあ、明日の聴聞会で。おやすみセイア。\""
"34040-81-セイア" = "……ああ、お休み。それでは、お気をつけて。"
"34040-82" = "（明日の聴聞会に、ミカとセイアが参加することをナギサに伝えた。）"
"34040-83" = "（喜ぶナギサの感謝の言葉を受け取りながら、明日行われる聴聞会のために早くシャーレに帰ることにした。）"
"34040-84-？？？" = "……それでは次の議題を。"
"34040-85-？？？" = "そういうこった！"
"34040-86-？？？" = "異論は無い……が、その前に確認しておきたいことがある。"
"34040-87-セイア" = "（……）"
"34040-88-セイア" = "（やれやれ……ミカが来る前に少し休むつもりが……いつの間にか眠ってしまったのか）"
"34040-89-セイア" = "（また明晰夢の中……最近、夢から目覚めるのがだんだん難しくなっているというのに……）"
"34040-90-セイア" = "（しかし……ここは一体……）"
"34040-91-黒服" = "マエストロ、何か気になることが？"
"34040-92-マエストロ" = "……。"
"34040-93-セイア" = "（……彼らは……まさか……！？）"
"34040-94" = "ベアトリーチェに質問がある。"
"34040-95-ベアトリーチェ" = "……はい、何でしょう？"
"34040-96-セイア" = "（ゲマトリア……！？）"
"34040-97" = "次回;不可解な探求者"
