[translation]
"34155-1-ミカ" = "ケホ、ケホ……。"
"34155-2-サオリ" = "はぁ……ぐっ……。"
"34155-3-サオリ" = "やっと、制圧できた……。"
"34155-4-ヒヨリ" = "う、うう……倒せたんでしょうか。"
"34155-5-ミカ" = "んんっ……痛いね……やっぱ先生がいると厄介だな……。"
"34155-6" = "[s1] \"ミカ……セイアはたぶん無事だよ。\"\n[s2] \"だからトリニティに戻って……ミカを傷つけたくない。\""
"34155-7-ミカ" = "先生……。"
"34155-8-ミカ" = "先生……。"
"34155-9-ミカ" = "ごめんね……私はいつもこんなだよね……。"
"34155-10-ミカ" = "私みたいな問題児はさ……先生に何度も心配をかける生徒は……先生の傍にいられないってことも、よく分かってる……。"
"34155-11" = "でも……私……。"
"34155-12-ミカ" = "私……わたしには……。"
"34155-13-ミカ" = "もう、帰る場所がないの……トリニティにも……どこにも……。"
"34155-14-ミカ" = "私はトリニティの裏切り者で、みんなの敵で……#n――何度もセイアちゃんを傷つけてしまった魔女だから……。"
"34155-15-ミカ" = "学園から追い出されたら、ナギちゃんにも、大切な人たちにも……二度と会えなくなる……。"
"34155-16-ミカ" = "生徒じゃなくなったら……私みたいな問題児、先生だって、もう会ってくれないよ……。"
"34155-17-ミカ" = "私に、これ以上幸せな未来なんか訪れないってことも、よく分かってる……。"
"34155-18-ミカ" = "わ、私は……悪党だから……人殺しだから……。"
"34155-19-ミカ" = "だから……私に残っているのは[ruby= ・   ・   ・   ・   ・ ]こんなもの[/ruby]しか、ないの……。"
"34155-20-ミカ" = "なのに、あなた達は……どうして？"
"34155-21-ミカ" = "私は大切なものを全部失ったのに！#n――ぜんぶ、奪われたのに！！"
"34155-22-ミカ" = "あなた達は……どうして？"
"34155-23-サオリ" = "……。"
"34155-24-ヒヨリ" = "……。"
"34155-25-ヒヨリ" = "……。"
"34155-26-ミカ" = "あなた達が何の代償も支払わないで、何も奪われないでいるなんてそんなの……。"
"34155-27-ミカ" = "そんな事、許したら……私は……"
"34155-28-ミカ" = "私は……何者でもなくなってしまう……。"
"34155-29-ミカ" = "私には、何の意味も残らない……。"
"34155-30-ミカ" = "わたし……。"
"34155-31" = "わたしは、どうしたらいいの……。"
"34155-32-ミカ" = "……。"
"34155-33-ミカ" = "スクワッドを――サオリを、そのままになんてしておけない……"
"34155-34-ミカ" = "その女が、何の代償もなく先生の庇護を受けるなんてダメ……。"
"34155-35-サオリ" = "……。"
"34155-36-ミカ" = "だから先生、私を止めないでね。"
"34155-37" = "[ns] \"ミカ！\""
"34155-38-ヒヨリ" = "い、行ってしまいました……？"
"34155-39-ミサキ" = "一体なんなの……あの女。"
"34155-40-ヒヨリ" = "そんなに……私が憎いのか、ミカ。"
"34155-41-ヒヨリ" = "……仕方ないのかも、しれないな。"
"34155-42-ヒヨリ" = "リーダーどうする？あの女、また私たちを追いかけてきそうだけど……このままバシリカに突入するのは少し危険かもしれない。"
"34155-43-ヒヨリ" = "アリウスに聖徒会……さらにストーカーまで……相手しきれないよ。"
"34155-44-ヒヨリ" = "……このまま旧校舎地下の回廊を通ってバシリカに進入する。"
"34155-45-ヒヨリ" = "彼女が何を企んでいようが構わない。行くぞ……時間がない。"
"34155-46" = "は、はい！"
"34155-47" = "……仕方ない、か。"
"34155-48-ミサキ" = "行こう、先生。"
"34155-49" = "[ns3] ついて行く。\n[ns4] （ミカ……）"
"34155-50" = "次回;地下回廊"
