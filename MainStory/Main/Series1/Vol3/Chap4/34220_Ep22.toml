[translation]
"34220-1" = "第22話;[ruby=神の子羊]Agnus dei[/ruby]"
"34220-2-ベアトリーチェ" = "……ですが、遅かったですね。#n儀式は既に進行しています。"
"34220-3-サオリ" = "……！！"
"34220-4-ベアトリーチェ" = "ロイヤルブラッドの神秘を搾取し、キヴォトス外から到来する力を借りて……私は自分の存在をより高位のものへと昇華しています。"
"34220-5-ベアトリーチェ" = "さあ、先生。#n――不可解な大人、私の敵対者よ。"
"34220-6-ベアトリーチェ" = "あなたは、もしかしたら私を誤解しているのかもしれませんね。"
"34220-7-ベアトリーチェ" = "私たちはこの世界を通じて各自が望むことを追求しています。#nあなただって、同じ。何に成る事もできるし、全てを識ることができます。"
"34220-8-ベアトリーチェ" = "より高位の存在になること――それを通じて全てを救うことが大人の義務なのです。"
"34220-9-ベアトリーチェ" = "ええ、この儀式はキヴォトス外の力を利用し、私がより高位の存在になるために用意されたのです。"
"34220-10-ベアトリーチェ" = "そうして高みに登り、この世界を救う――それこそ大人が到達すべき境地！"
"34220-11-ベアトリーチェ" = "その過程での小さな[ruby=Agnus dei]犠牲[/ruby]は、仕方のないことです。"
"34220-12-ベアトリーチェ" = "そう……この犠牲は必要な事。"
"34220-13" = "これこそが「崇高」へと至る道。"
"34220-14-ベアトリーチェ" = "あなたなら、この価値を理解しているでしょう？#nすべての生徒を審判することも、救うこともできる絶対的な力を有すあなたなら……！！"
"34220-15" = "[s] \"それは違うよ。\""
"34220-16-ベアトリーチェ" = "……！？"
"34220-17" = "[s1] \"私を誤解している。\"\n[s2] \"私は大した存在じゃない。\""
"34220-18-ベアトリーチェ" = "なに……？"
"34220-19-ベアトリーチェ" = "なに……？"
"34220-20" = "[ns] \"私は審判者ではない。誰かを審判する権利は、私にない。\""
"34220-21" = "[ns] \"私は救済者ではない。この世界の苦痛を消し去ることはできない。\""
"34220-22" = "[ns] \"私は絶対者ではない。この世界の罪悪をなくすことはできない。\""
"34220-23-ベアトリーチェ" = "……！！"
"34220-24" = "[s] \"私はそんな存在ではないよ。\""
"34220-25-ベアトリーチェ" = "では……あなたは一体何だと言うのですか！！"
"34220-26-ベアトリーチェ" = "あなたの能力は、存在価値は何だというのですか！"
"34220-27" = "[s] \"生徒たちのための先生だよ。\""
"34220-28-ベアトリーチェ" = "……！！"
"34220-29" = "[ns] \"忘れられ、苦しむ生徒に寄り添いたいだけ。\""
"34220-30-ベアトリーチェ" = "ならば、それを証明してみせなさい……！！"
"34220-31-サオリ" = "……！！"
"34220-32-ミサキ" = "なっ……。"
"34220-33-ヒヨリ" = "あ、あうう……。"
"34220-34" = "さあ、その目にしかと映しなさい！#nこれが私……高位の存在となった姿です！"
"34220-35-ベアトリーチェ" = "これこそが本来の姿――偉大なる大人の姿なのです………！！"
"34220-36" = "[s] \"それが正体なんだね、ベアトリーチェ。\""
"34220-37-ミサキ" = "あれが……本物のマダム……。"
"34220-38-ヒヨリ" = "ただの怪物にしか見えませんが……。"
"34220-39-ヒヨリ" = "そう……私たちはあんなものに、ずっと……。"
"34220-40" = "[s] \"――サオリ、ヒヨリ、ミサキ。\""
"34220-41-ミサキ" = "……ああ。"
"34220-42-ヒヨリ" = "……はい！"
"34220-43-ヒヨリ" = "……うん。"
"34220-44" = "[s] \"怖がらないで……私がついてるから。一緒に頑張ろう。\""
"34220-45-サオリ" = "……ああ。"
"34220-46-ミサキ" = "うん――あの怪物を倒そう。"
"34220-47-ヒヨリ" = "はい！！姫ちゃんを救うのです……！！"
"34220-48" = "[ns] \"行こう！！！\""
