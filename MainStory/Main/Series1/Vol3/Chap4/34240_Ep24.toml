[translation]
"34240-1" = "第24話;少女たちのためのキリエ（２）"
"34240-2-ベアトリーチェ" = "……。"
"34240-3-ベアトリーチェ" = "……何故、来ないのですか……？"
"34240-4-ベアトリーチェ" = "バルバラは？#n何故まだ誰も……"
"34240-5-ベアトリーチェ" = "……！！"
"34240-6-ヒヨリ" = "この歌は……。"
"34240-7-ヒヨリ" = "これは……[ruby=キリエ]Kyrie eleison[/ruby]……？"
"34240-8" = "[s] \"ミカ……！\""
"34240-9-ベアトリーチェ" = "なりません！！！"
"34240-10-ベアトリーチェ" = "なりません！私の領地で慈悲を語る歌を響かせるなど！"
"34240-11-ベアトリーチェ" = "一体どのような手段を……？"
"34240-12-ベアトリーチェ" = "楽器も蓄音機もすべて破壊したというのに！――奇跡が起きたとでも？"
"34240-13-ベアトリーチェ" = "なりません！！#n生徒は憎悪を軽蔑を……呪いを謳わなければなりません！"
"34240-14-ベアトリーチェ" = "お互いを騙し傷つけ合う地獄の中で、私たちに搾取される存在であるべきなのです！"
"34240-15" = "[ns] \"黙れ。\""
"34240-16-ベアトリーチェ" = "……なに！？"
"34240-17" = "[s] \"私の大切な生徒に話しかけるな。\""
"34240-18-ベアトリーチェ" = "……！！！"
"34240-19" = "[s1] \"あなたは偽りの教えで子供たちを奈落へ落とした。\"\n[s2] \"あなたを絶対に許せない。\""
"34240-20-ベアトリーチェ" = "よ、よくも私にそのような……"
"34240-21-ベアトリーチェ" = "よ、よくも私にそのような……"
"34240-22-ベアトリーチェ" = "言葉をぉおおお――！！"
"34240-23-ヒヨリ" = "ま、また変わり始めましたよ……！？"
"34240-24-ベアトリーチェ" = "ああ、そうだサオリ――"
"34240-25-ベアトリーチェ" = "貴様を新しい生贄として捧げましょう！"
"34240-26-サオリ" = "……！！"
"34240-27-ベアトリーチェ" = "貴様が私の計画を台無しにしたのですから、その代償を支払うのです！！"
"34240-28-サオリ" = "――いくらでもどうぞ、マダム。"
"34240-29-ミサキ" = "り、リーダー！？"
"34240-30-ミサキ" = "……何をバカな事言ってるの！？"
"34240-31-サオリ" = "私にまだ払える代償があるのなら……むしろ感謝したいくらいだ。"
"34240-32-サオリ" = "さあ、マダム。#n私はここにいる！！持っていくがいい！"
"34240-33-ヒヨリ" = "くっ、先生……！早く……！"
"34240-34" = "[ns] \"最後の戦いだ！みんな行こう！\""
"34240-35-ヒヨリ" = "は、はい！！"
"34240-36-サオリ" = "ぐっ、……あッ、アアアア！"
