[translation]
"34010-1" = "第1話;プロローグ"
"34010-2-？？？" = "いたぞ！！"
"34010-3-？？？" = "あっちだ！追え！！"
"34010-4-？？？" = "も、もうおしまいです……ここは行き止まりですし……。"
"34010-5-？？？" = "……反対側も。完全に包囲されてる。"
"34010-6-？？？" = "くっ……。"
"34010-7-アリウスの生徒B" = "諦めるんだな。#nこれ以上は逃げられないぞ。"
"34010-8-サオリ" = "……。"
"34010-9-ヒヨリ" = "ひ、ひっ……。"
"34010-10-サオリ" = "（スッ、ススッ……）"
"34010-11-ミサキ" = "……弾薬、ほとんど残ってないし、もう体力も限界……。"
"34010-12-ミサキ" = "リーダーの傷も大きい。このままじゃ、逃げるどころかリーダーの命が危ないよ。"
"34010-13-サオリ" = "……最後の手段ならまだ残っている。これなら……。"
"34010-14-ヒヨリ" = "ま、まさか。"
"34010-15-ミサキ" = "……ヘイローを破壊する爆弾。"
"34010-16-サオリ" = "ミサキ、ヒヨリ。私が時間を稼ぐ間に姫を連れて……ここを離れるんだ。"
"34010-17-アツコ" = "……サオリ。"
"34010-18-サオリ" = "ここを離れて……そうしたら……その次は……。"
"34010-19-サオリ" = "その……次は……。"
"34010-20-アツコ" = "サオリ。"
"34010-21-サオリ" = "……姫？"
"34010-22-アツコ" = "もういいよ。私たちは頑張った。"
"34010-23-ミサキ" = "……。"
"34010-24-ヒヨリ" = "ひ、姫ちゃん……どうしたんですか……？"
"34010-25-アツコ" = "「彼女」が求めているのは私……そうでしょう？"
"34010-26-アツコ" = "私が行くよ。だから、他のメンバーは見逃してほしい。"
"34010-27-アリウスの生徒A" = "……。"
"34010-28-サオリ" = "アツコ！？……一体何をっ！？"
"34010-29-サオリ" = "……もういいよ、サオリ。ぜんぶ、無意味だよ。"
"34010-30-アツコ" = "ここを切り抜けたその先は？一体どこに向かうの？"
"34010-31-サオリ" = "……。"
"34010-32-アツコ" = "トリニティにゲヘナ――そしてアリウスさえも私たちを追いかけてる。"
"34010-33-アツコ" = "このキヴォトスで私たちが安心できる場所はないよ。#n私達の命が尽きるまで、息を潜めて逃げ隠れる人生が続くだけ。"
"34010-34" = "でも、それも私がいるからの話。サオリも、ミサキも、ヒヨリも。私のせいでこうなってしまったから……。"
"34010-35-アツコ" = "だから、私が終わらせる。"
"34010-36-ヒヨリ" = "ひ、姫ちゃん……。"
"34010-37-ミサキ" = "……姫。"
"34010-38-ミサキ" = "……ダメだアツコ、戻ったら殺される……それくらい、分かってるだろう？"
"34010-39-アツコ" = "……今まで私は何の決定も判断もしなかった。だから、今回くらいは自分で決めたっていいでしょ？"
"34010-40-アリウスの生徒A" = "約束してくれる？みんなを自由にしてくれるって。"
"34010-41-アリウスの生徒A" = "……。"
"34010-42-アリウスの生徒A" = "……少し待ってろ、マダムに確認を取る。"
"34010-43-？？？" = "ほぉ"
"34010-44-？？？" = "……なるほど、わかりました。お約束いたしましょう。"
"34010-45-アツコ" = "その名にかけて、誓って。"
"34010-46-？？？" = "名前を……？それにどれほどの意味が？"
"34010-47-アツコ" = "必ず約束を守ってほしいから。"
"34010-48-？？？" = "いいでしょう……すべての巡礼者の幻想である私「ベアトリーチェ」の名にかけて、お約束いたします。"
"34010-49-アツコ" = "……うん、約束だよ。"
"34010-50-アリウスの生徒B" = "姫様、こちらを。マダムのご指示です。勝手にマスクを外されては困ります。"
"34010-51-ベアトリーチェ" = "傷一つないよう、丁重に扱いなさい。儀式は明朝、日の出と共に始めます。"
"34010-52-アツコ" = "……元気でね。サオリ、みんな――さようなら。"
"34010-53-ミサキ" = "姫……。"
"34010-54-ヒヨリ" = "姫ちゃん……。"
"34010-55-サオリ" = "ダメだ……アツコ……。"
"34010-56-サオリ" = "私は……お前まで守れなかったら……"
"34010-57-サオリ" = "信念も……守るべきものも……全部なくなってしまったら……。"
"34010-58-サオリ" = "私は……。"
"34010-59-サオリ" = "アツコ、私は……。"
"34010-60-サオリ" = "私は一体何のために今まで……。"
"34010-61-サオリ" = "何のために……生きているんだ……？"
"34010-62-アリウスの生徒B" = "……残りのスクワッドはどうしますか？"
"34010-63" = "すべて始末なさい。"
"34010-64-アリウスの生徒B" = "かしこまりました。"
"34010-65-アリウスの生徒A" = "撃て。"
"34010-66-ミサキ" = "……。"
"34010-67-ミサキ" = "……。"
"34010-68-ミサキ" = "……。"
"34010-69" = "次回;不揃いなティーパーティー"
