[translation]
"33120-1" = "第12話;加速する混乱（２）"
"33120-2-ハナコ" = "先生の容体は！？"
"33120-3-シスターフッドの行政官A" = "現在は救護騎士団の部屋に！団員の情報によると出血多量ですが、応急処置はきちんとなされているとのことで……"
"33120-4-ハナコ" = "ご無事なんですね……！？"
"33120-5-シスターフッドの行政官A" = "は、はい。幸い命に別状は無さそうなのですが、意識を取り戻せてないと……。"
"33120-6-ハナコ" = "意識が……先生……。"
"33120-7-シスターフッドの分析官" = "分析結果が出ました！古聖堂に向けて放たれていたのは、ラムジェットエンジンのものではありません！"
"33120-8-ハナコ" = "！！"
"33120-9-シスターフッドの行政官A" = "ラムジェットではない……となるとゲヘナは、そんなあり得ないレベルの技術をどうやって手に入れたんですか？"
"33120-10-シスターフッドの分析官" = "発射位置についても現在確認中……！"
"33120-11-シスターフッドの行政官B" = "ゲヘナのどの連中ですか、場所さえわかれば……！"
"33120-12-シスターフッドの分析官" = "い、いえ、それが……"
"33120-13-シスターフッドの分析官" = "詳しい位置は特定できませんが……発射地点は「トリニティ自治区の内部」です！"
"33120-14-ハナコ" = "……！！"
"33120-15-シスターフッドの分析官" = "カメラの映像が復旧しました、古聖堂が爆発された時のものです！現在古聖堂でゲヘナと交戦中の、シスターたちの報告と一致します！！"
"33120-16-シスターフッドの分析官" = "映像、再生します！"
"33120-17-ハナコ" = "これは……"
"33120-18-ハナコ" = "先生やみなさんが戦っていたのは、まさか……？"
"33120-19-マリー" = "あ、あれは……。"
"33120-20-ハナコ" = "……「ユスティナ聖徒会」です。"
"33120-21-マリー" = "え、えっ……！？"
"33120-22-ハナコ" = "……。"
"33120-23-マリー" = "は、ハナコさん……。"
"33120-24-ハナコ" = "…………。"
"33120-25-ハナコ" = "…………………………………。"
"33120-26-ハナコ" = "ユスティナ聖徒会、エデン条約、あの襲撃……"
"33120-27-ハナコ" = "アリウススクワッド、第一回公会議、古聖堂、発射地点とタイミング……"
"33120-28-ハナコ" = "カタコンベ、アミューズパークの怪談、アリウス自治区の位置……"
"33120-29-ハナコ" = "戒律の守護者…………エデン条約……「エデン」…………"
"33120-30-ハナコ" = "……"
"33120-31-マリー" = "は、ハナコさん……！？大丈夫ですか！？"
"33120-32-ハナコ" = "……。"
"33120-33-ハナコ" = "……仮定に過ぎません。"
"33120-34-ハナコ" = "数十にも渡る飛躍を前提としていますが、しかし、万が一これが本当なら……"
"33120-35-ハナコ" = "これを解決できる方法は、存在しない……？"
"33120-36-マリー" = "……え？"
"33120-37-ハナコ" = "このままでは……トリニティとゲヘナは文字通り、キヴォトスの地図から消えてしまいます。"
"33120-38-ハナコ" = "……かつて「第一回公会議」の後、アリウスがそうなったように。"
"33120-39" = "次回;届かない向こう側"
