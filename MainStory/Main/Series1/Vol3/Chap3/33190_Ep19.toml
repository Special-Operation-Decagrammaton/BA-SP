"33190-69-セリカ" = "それにこの間なんて、カイザーPMCを砲撃で吹っ飛ばしたんだからね！"
"33190-70-ホシノ" = "そうだよ、恐ろしいんだよ～？生きて動く災いと言っても過言じゃないし、暗黒街を支配するボスみたいなものなんだから。"
"33190-71-シロコ" = "うん、それがファウスト。"
