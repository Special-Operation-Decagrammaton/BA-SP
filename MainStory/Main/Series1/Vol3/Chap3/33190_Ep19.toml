"33190-57-ハナコ" = "……！？"
"33190-58-コハル" = "え、えっ！？"
"33190-59-ハナコ" = "じ、実在したんですね……？"
"33190-60-ヒヨリ" = "あいつらは……。"
"33190-61-ミサキ" = "……分からない。詳細なデータは無し。"
"33190-62-ヒヨリ" = "ふ、覆面水着団……噂に過ぎないと思ってましたが、本当にいたんですねえ……。"
"33190-63-ミサキ" = "……リーダー、あいつらヘラヘラしてるけど注意した方が良さそう。少なくとも舐めてかかると痛い目に遭う。"
"33190-64-サオリ" = "……。"
"33190-65-ホシノ" = "なーにうちのリーダーを泣かせようとしてるのかな～？ねぇ、そこの君たち？"
"33190-66-ホシノ" = "どこの誰なのか知らないけど、知らないよ？うちのファウストさんは怒ると怖いんだから。"
