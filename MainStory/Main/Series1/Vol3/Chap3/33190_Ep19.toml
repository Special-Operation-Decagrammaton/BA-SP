"33190-10-アズサ" = "……！？"
"33190-11-ヒフミ" = "……。"
"33190-12-アズサ" = "ヒフ、ミ……？"
"33190-13-ヒヨリ" = "増員、ですね……数は4、いえ、後ろにそれ以上……。"
"33190-14-ミサキ" = "あれは……。"
"33190-15-サオリ" = "……なんだ、お前は？"
"33190-16-ヒフミ" = "普通の、トリニティの生徒です。"
"33190-17-アズサ" = "ヒフミ、ダメだ……どうしてこんなところに……。"
"33190-18-アズサ" = "ここはヒフミみたいな、普通の人が来るべきところじゃ……。"
"33190-19-ヒフミ" = "……。"
"33190-20-ヒフミ" = "……はい、確かに私は普通で平凡です。"
"33190-21-ヒフミ" = "先日見せてくれたガスマスクの姿が、本当のアズサちゃんなのだと。そのことも理解しました。"
"33190-22-ヒフミ" = "そんなアズサちゃんは本当なら、私なんかには手の届かない世界に生きてるのだと……そう言いたいのも分かりました。"
"33190-23-アズサ" = "ヒフミ……？"
"33190-24-ヒフミ" = "でも！！！"
"33190-25-ヒフミ" = "アズサちゃんは一つ、大きな間違いをしています！！！"
"33190-26-アズサ" = "……！？"
"33190-27-ヒフミ" = "今ここで、私の本当の姿をお見せします！！！"
"33190-28-ヒフミ" = "私の正体、それは……"
"33190-29-ヒフミ" = "「覆面水着団」のリーダー、ファウストです！！"
"33190-30-ヒフミ" = "……え？"
"33190-31-ヒフミ" = "見てください、この恐ろしさ！アズサちゃんと並んだって、全然見劣りしないほど不気味でしょう！こっちの方が恐ろしくて怖いと言う人だっているはずです！"
"33190-32-アズサ" = "ひ、ヒフミ……？"
"33190-33-サオリ" = "……。"
"33190-34-ヒヨリ" = "……！？"
"33190-35-ミサキ" = "……。"
"33190-36-ヒフミ" = "ヒフミ、いったい何を――"
"33190-37-ヒフミ" = "だからっ！！"
"33190-38-ヒフミ" = "だから私たちは、違う世界にいるなんてことはありません！"
"33190-39-アズサ" = "……。"
"33190-40-ヒフミ" = "同じです！隣にだっていられます！"
"33190-41-ヒフミ" = "だから世界が違うだなんて、一緒にいられないだなんて……そんなことを言わないでください！"
"33190-42-ヒフミ" = "拒絶されても、すぐ近くに行ってみせます！私は……！"
"33190-43-ヒフミ" = "……私は、アズサちゃんのそばにいます！"
"33190-44-ヒフミ" = "こうやって、すぐ触れられるところに……！"
"33190-45-アズサ" = "ヒフミ……"
"33190-46-アズサ" = "でも、私のためにそんな嘘を言ってくれたところで……"
"33190-47" = "誰が嘘だって！？"
"33190-48-ホシノ" = "いや～、何だか大事なところみたいだね？"
"33190-49-ハナコ" = "あの覆面、まさか……！？"
"33190-50-アズサ" = "！？"
"33190-51-コハル" = "っ！？"
"33190-52-ホシノ" = "目には目を、歯には歯を。無慈悲に、孤高に、#n我が道の如く[ruby=まきょう]魔境[/ruby]を行く……"
"33190-53-シロコ" = "ん、それが私たちのモットー。"
