"33190-86-ツルギ" = "完治した。"
"33190-87-正義実現委員会部員" = "さ、さすがです！"
"33190-88-ツルギ" = "私はツルギほど丈夫ではないので、まだですが……とはいえ少しは役立つはずです。力になると、約束しましたから。"
"33190-89-イオリ" = "この間はよくも……！無事に帰れると思うなよ！"
"33190-90-イオリ" = "……委員長は？"
"33190-91-イオリ" = "……。"
"33190-92-ヒナ" = "っ、先生……。"
