[translation]
"33010-1" = "第1話;ポストモーテム（１）"
"33010-2" = "秘密の部屋"
"33010-3-？？？" = "……[ruby=ゆりぞの]百合園[/ruby]セイア？"
"33010-4-セイア" = "ああ、そうだよ。君を待っていたんだ、アリウス分校所属「[ruby=しらす]白洲[/ruby]アズサ」。"
"33010-5-？？？" = "……待ってた？私を？"
"33010-6-セイア" = "うん、夢でもこのシーンを見ていたからね。"
"33010-7-セイア" = "何と説明するのが良いかな……まあ、「予知夢」のようなものだと思ってくれると良い。"
"33010-8-セイア" = "時々、そういう夢を見るんだ。後で現実になってしまう夢、それ以外にも色々な夢をね。"
"33010-9-？？？" = "……つまり、これから私が何をするのかも分かってる、と？"
"33010-10-セイア" = "ああ、私のヘイローを壊しに来たんだろう？"
"33010-11-セイア" = "他にも仲間がいたようだけれど、君だけがここまで到達した。素晴らしい力だ、白洲アズサ。"
"33010-12-？？？" = "……分かってて、どうして逃げなかった？"
"33010-13-セイア" = "……無意味だからさ。"
"33010-14-セイア" = "「全ては虚しいものである」……アリウスが大好きな言葉だったね。同じことだ。未来が見える私にとって、足掻くことは無意味。"
"33010-15-セイア" = "「死」というものが、キヴォトスにおいて見えにくい概念であることは確かだ。それでもやはり私たちは生きているのだし、ともすれば「死」が隣り合わせでないなんてことはあり得ない。"
"33010-16-セイア" = "「ヘイローを壊す」……つまり誰かが、私の死を願っている。"
"33010-17-セイア" = "そして君は、この秘密の部屋まで他の誰にも気づかれずに侵入してきた。ここまでのことが出来てしまうのだから、やはり足掻いても無駄さ……君の立場からだってそう思わないかい、白洲アズサ？"
"33010-18-セイア" = "まあそれ以外にも理由が無いわけではないが……ところで、君は以前にもヘイローを壊したことが？"
"33010-19-？？？" = "……いや、無い。でもやり方は習った。"
"33010-20-セイア" = "「習った」……。"
"33010-21-セイア" = "肉体に取り返しがつかない、致命的なダメージを与える……与え続ける。"
"33010-22-？？？" = "普通は5.56mm弾を何発撃ったところで、ほとんど致命傷にはならないはず。"
"33010-23-？？？" = "でも、ダメージが無いわけじゃない。尋常じゃない量の弾薬、そしてダメージを与え続けるだけの圧倒的優位と、そのための時間。それらを「異常なほど」叩き込みさえすれば……銃火器だけでヘイローを壊すことも、不可能じゃない。"
"33010-24-？？？" = "銃火器以外だって、いくらでもある。病気だって無いわけじゃない。例えば、水や食料の摂取を長期間にわたって強制的に絶つ、呼吸ができないような環境下に強制的に閉じ込める、身体機能が停止するほどの流血をさせる、体温が一定以下になるような状態でずっと拘束し続ける……"
"33010-25-？？？" = "「死」に至らせる方法は、幾らでもあるはずだ。"
"33010-26-？？？" = "それに、「百合園セイアは身体が弱い」と聞いている。"
"33010-27-セイア" = "……だから、その銃火器でも十分だと？"
"33010-28-？？？" = "……それもあり得ない話じゃない。でも今の私には十分な時間も、優位性も保障されてない。"
"33010-29-？？？" = "だから、この特殊な爆弾を使用する。これで「ヘイローを破壊」する。"
"33010-30-セイア" = "つまりそれは、「ヘイローを破壊する爆弾」ということかい？聞いたことのない技術だが……"
"33010-31-セイア" = "……なるほど、アリウスはそういう研究をしていると。「ヘイローを破壊する方法」、すなわち「人を殺す方法」を。"
"33010-32-？？？" = "……ああ、そしてそういうことを習った。「学校」とは、そういうことを「習う」場所なのだろう？"
"33010-33-セイア" = "……。"
"33010-34-セイア" = "そうか……アリウスは、そこまで……。"
"33010-35-セイア" = "……白洲アズサ、一つ聞かせてほしい。君は「人殺し」になってしまっても大丈夫なのかい？"
"33010-36-？？？" = "……。"
"33010-37-セイア" = "私は見たんだ、「人殺し」になることを恐れる君の姿を。"
"33010-38-セイア" = "君が望んだかどうか、他に選択肢があったかどうか……その辺りは実のところ、さしたる問題じゃない。"
"33010-39-セイア" = "「人殺しは人殺しである」。その明確で絶対的で、何より絶望的なまでに分かりやすい命題がその身に刻まれる。そして、この世界に残り続ける。"
"33010-40-セイア" = "そうなってしまった後に君が感じる絶望、苦しみ、怒り、後悔と挫折、そして無力感……それらは、誰に届くことも無く虚空へと消えていく。"
"33010-41-セイア" = "君もアリウスなら知らないはずが無い。「vanitas vanitatum」……この世界の真実を。"
"33010-42-セイア" = "……しかし、私は知っているんだ。君がこの言葉に同意しながらも、どこかで否定しているということも。"
"33010-43-セイア" = "……そうだろう？"
"33010-44-セイア" = "その花を見つめながら、君はそう考えていた。"
"33010-45-セイア" = "「全ては虚しいもの」だ……しかし、それでも足搔かなければならない。"
"33010-46-セイア" = "これが君の根幹に根差すもの、君を現す心象……私にはよく分からなかったけれど。"
"33010-47-セイア" = "となると、君は実のところ……"
"33010-48-セイア" = "……私を殺しに来たのではなく、私に助言を貰いに来たんじゃないのかい？"
"33010-49" = "君がこの先、どう足掻くべきなのかについて。"
"33010-50" = "シスターフッドの会議室"
"33010-51-サクラコ" = "……[USERNAME]先生？"
"33010-52" = "[s1] \"……ごめん、ちょっと寝てた。\"\n[s2] \"何か、夢を見たような……。\""
"33010-53-サクラコ" = "……お忙しいのは存じておりますが、もう少々集中していただけますと。"
"33010-54-サクラコ" = "……お忙しいのは存じておりますが、もう少々集中していただけますと。"
"33010-55" = "[s] \"ごめん……。\""
"33010-56-サクラコ" = "確かにここしばらくずっと、事件の後始末と言いますか……色々奔走されていると聞きました。あなたの管轄外のことまで。"
"33010-57" = "[s] \"力不足でね……色々とやり切れなかったこととか、たくさんあって……。\""
"33010-58-サクラコ" = "……そうでしたか。"
"33010-59-サクラコ" = "立て続けに色々なことがありましたし、少し整理しておきましょうか。"
"33010-60-サクラコ" = "退屈なお話になるでしょう。少なくとも面白くはないことだと思いますが……整理することで、進むことができることもあります。「ポストモーテム」と呼ばれるものです。"
"33010-61-サクラコ" = "……では、本題に入りましょう。"
"33010-62-サクラコ" = "セイアさんの部屋が爆破されたのは、夜中の3時頃。"
"33010-63-サクラコ" = "その後、現場へ最初にたどり着いたのは「救護騎士団」のミネ団長でした。"
"33010-64-サクラコ" = "ミネ団長は室内の状況を確認した後、すぐにその事実をティーパーティーに報告。"
"33010-65-サクラコ" = "ティーパーティーは混乱に陥りつつも、情報の隠蔽工作や犯人捜しが始まりました。"
"33010-66-サクラコ" = "しかしその騒動に紛れるようにして、ミネ団長はセイアさんの遺体と共に姿をくらましました。救護騎士団の他の団員さえ行方が分からなかったそうです。"
"33010-67-サクラコ" = "……と、ここまでがティーパーティー視点の状況です。しかし実のところ「セイアさんの遺体」という情報自体がフェイク。ミネ団長は「ヘイローが破壊された」という偽の情報を流しつつ、セイアさんを安全なところに隠したのです。"
"33010-68-サクラコ" = "普通に考えて、「ヘイローが破壊された生徒」が狙われるはずもありません。セイアさんを守るためには、最善の方法だったと言えるでしょう。"
"33010-69-サクラコ" = "ティーパーティーのメンバーが襲撃されるという異常事態……今は誰を信じるべきかと考える前に自分の手で、と。そう考えたのではないでしょうか。"
"33010-70-サクラコ" = "実際のところ犯人が、本来であれば情報が集約される「ティーパーティー」のミカさんであったことを考えると、彼女の判断は結果的に正しかったと言えますが……。"
"33010-71-サクラコ" = "……しかしまだ、セイアさんは目覚めていません。"
"33010-72-サクラコ" = "爆発の傷は癒えたものの、ずっと眠り続けている状態……団長も、原因が分からないと言っていました。"
"33010-73-サクラコ" = "今もミネ団長とセイアさんは、誰も知らない場所に身を隠しています。"
"33010-74-サクラコ" = "……おおよそといった形ではありますが、この辺りが百合園セイアさんが襲撃された件についてのお話です。"
"33010-75" = "[ns] \"ハナコ！\""
"33010-76-ハナコ" = "あまり面白くないサクラコさんに捕まって苦しんでいるのではないかと思い、先生を助けに来ちゃいました。ふふっ♡"
"33010-77-サクラコ" = "……冗談を言うタイミングではありませんよ、ハナコさん。"
"33010-78-ハナコ" = "サクラコさんは相変わらずですねえ……今度一緒に、ちょっと過激な本でも読みませんか♡"
"33010-79-ハナコ" = "何となくですが、サクラコさんはそういった方面に免疫が無さそうですし……うふふ♡"
"33010-80" = "……ハナコさん。あの時の約束、忘れていませんよね？"
"33010-81-ハナコ" = "……もちろんですよ。"
"33010-82" = "[ns] \"いた、ハナコ。\""
"33010-83-マリー" = "あら。先生、どうしてここに……。"
"33010-84" = "[ns] \"前に言ってた、シスターフッドとの約束って……。\""
"33010-85-マリー" = "ああ、それは……。"
"33010-86-マリー" = "……シャーレの先生、これはあなたが介入するべき問題ではありません。"
"33010-87" = "[s] \"ハナコは補習授業部の、私の生徒だから。\""
"33010-88-マリー" = "あらまあ……。"
"33010-89-マリー" = "……。"
"33010-90-ハナコ" = "すみません……それはその、私が……。"
"33010-91-サクラコ" = "マリーちゃん……。"
"33010-92" = "私がお願いしたんです。ハナコさんを助けるために、サクラコ様を説得する……"
"33010-93-マリー" = "その代わりに約束として、"
"33010-94" = "ハナコさんに退学を撤回してもらう、と……。"
"33010-95-サクラコ" = "……。"
"33010-96-マリー" = "私では、ハナコさんを止めることができなくって……ハナコさんの心の奥底を、分かってあげることができなくて……。"
"33010-97-マリー" = "こんな形になってしまってごめんなさい……でも私は、ハナコさんに学園に残ってほしくって……。"
"33010-98-ハナコ" = "……いいえ、マリーちゃん。"
"33010-99-ハナコ" = "マリーちゃんが謝ることではありません。色々と勝手なことをして、みんなを心配させたのは私なんですから。むしろ謝るのは私です。"
"33010-100-ハナコ" = "ごめんなさい、マリーちゃん……心配させてしまいましたね。"
"33010-101-マリー" = "ハナコさん……。"
"33010-102-ハナコ" = "今の私は、退学しようとは考えてませんから。安心してください。"
"33010-103-マリー" = "本当、ですか……？"
"33010-104-ハナコ" = "はい。補習授業部で習いましたからね……もう少し、「足掻いて」みようかと。ねえ、先生？"
"33010-105" = "[s] \"……うん。\""
"33010-106-マリー" = "……ありがとうございます。ハナコさん、[USERNAME]先生。"
"33010-107-マリー" = "……ですが、それ一つでは足りませんね。"
"33010-108-ハナコ" = "サクラコ様……？"
"33010-109-ハナコ" = "もう一つ、お願いがあります。ハナコさん。"
"33010-110-マリー" = "……。"
"33010-111-マリー" = "それは――"
"33010-112-ハナコ" = "「登校時の服装には、裸のみを認める」……そんな校則を作り、トリニティを「裸の楽園」へと変える計画に手を貸してほしい……そういうことでしたよね？"
"33010-113-サクラコ" = "ええ、そうで――"
"33010-114-サクラコ" = "……はい？"
"33010-115-ハナコ" = "まさかシスターフッドがこんな陰謀を企んでいたなんて……さすがサクラコさん、謎に包まれた秘密主義集団の長ですね。"
"33010-116-ハナコ" = "それにあの例外に関する条項、「原則は全裸。ただしシスターフッドのみ、登校時にベールの着用を認める」……"
"33010-117-ハナコ" = "流石の私も慄きましたよ。裸にベールだなんて、何という新しい世界……"
"33010-118-サクラコ" = "はい……っ！？"
"33010-119-ハナコ" = "ですが、今の立場では協力せざるを得ません……そしてやるからには、必ずや成功させてみせます！"
"33010-120-ハナコ" = "しかしそのベールの件はズルすぎます。ですので私からの提案ですが、「原則は全裸。ただし全生徒、靴下だけは着用可能とする」というのは如何でしょうか！"
"33010-121-ハナコ" = "これを飲んでくださるなら、その計画に協力しましょう！"
"33010-122-マリー" = "さ、さささサクラコ様！？そ、そんな計画を……！？"
"33010-123-サクラコ" = "違いますよ！？"
"33010-124-ハナコ" = "そんな……。"
"33010-125-サクラコ" = "「そんな……」ではありません！いきなり何を言っているのですかあなたは！"
"33010-126-サクラコ" = "「私たちがハナコさんの頼みを聞く代わりに、ハナコさんも私たちからの頼みを一つ聞く」、そういう約束でしょう！？"
"33010-127-ハナコ" = "……ああ、そんなお話もありましたねぇ。"
"33010-128-サクラコ" = "はあ……。"
"33010-129-サクラコ" = "本当なら、あなたがシスターフッドに入ってくれればそれが一番良いのですが……それはあなたをただ虐めて、追い詰めるようなものでしょうから。"
"33010-130-サクラコ" = "……今回の事件を契機として、私たちのこれまでの「無干渉主義」も変わっていきます。政治的なことにも徐々に、足を踏み入れることになるでしょう。"
"33010-131-サクラコ" = "その過程できっと、色々とあるはずです。その時、ハナコさんのような方から助けてもらえるというのは大きなキーになり得ます。あくまでそういうお話ですよ。"
"33010-132-ハナコ" = "まあ、その程度なら構わないのですが……はぁ……。"
"33010-133-サクラコ" = "どうしてそう残念そうな表情をするのですか……いえ、もう話をそちらに戻さないでほしいのですが……。"
"33010-134" = "[s] \"……ハナコは、本当に嫌じゃない？\""
"33010-135-ハナコ" = "先生……。"
"33010-136-サクラコ" = "……無理やりに、という手段は取りません。どちらにせよハナコさんには「手伝っていただく」という形ですし、無茶なことを要求するつもりもありませんから。"
"33010-137" = "……ありがとうございます、サクラコ様。"
"33010-138-サクラコ" = "話が逸れましたね……本題に戻りましょうか。えっと……"
"33010-139-ハナコ" = "「全裸登校」についてのお話ですね♡"
"33010-140-サクラコ" = "はい、その話……ではありません！話を戻さないでと言ったでしょう……！"
"33010-141-サクラコ" = "ふう、"
"33010-142-ハナコ" = "仕方ありませんねぇ……セイアちゃんの襲撃事件、その話に戻りましょうか。実行犯はご存じの通り、アズサちゃんだったようです。"
"33010-143-ハナコ" = "……セイアちゃんの部屋が爆破されたのは夜中の3時です。しかし、その部屋に侵入したのは夜中の2時頃。"
"33010-144-ハナコ" = "ここには、約1時間の空白があります。侵入者……つまりアズサちゃんはセイアちゃんと一緒に1時間、そのお部屋にいたんです。"
"33010-145" = "その60分の間、お二人の間にはいったいどんなお話があったのか……。"
"33010-146-ハナコ" = "アズサちゃんは、あまり詳しくお話ししてくれませんでしたが……"
"33010-147" = "相談室"
"33010-148-ティーパーティーの監察官" = "白洲アズサさん、中へどうぞ。"
"33010-149-ヒフミ" = "……。"
"33010-150" = "次回;ポストモーテム（２）"
