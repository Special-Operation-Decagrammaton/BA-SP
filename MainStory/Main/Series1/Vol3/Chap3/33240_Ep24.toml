[translation]
"33240-1" = "第24話;誰の憎しみ"
"33240-2-サオリ" = "う、くっ……。"
"33240-3-サオリ" = "アズ、サ……。"
"33240-4-アズサ" = "はぁ、はぁ、はぁ……。"
"33240-5" = "[ns] \"アズサ！\""
"33240-6-アズサ" = "先生……。"
"33240-7-アツコ" = "……。"
"33240-8-アズサ" = "アツコ……。"
"33240-9-サオリ" = "げほっ！姫、どうして逃げなかった……。"
"33240-10" = "私たちの負けだよ、アズサ。"
"33240-11-サオリ" = "だ、ダメだ、姫！喋ると、彼女が――"
"33240-12-アツコ" = "大丈夫、もう全部終わりだから。"
"33240-13-アツコ" = "それにどちらにせよ、彼女は私を生かしておくつもりは無かったはず。だから、良いの。"
"33240-14-サオリ" = "……？"
"33240-15-アツコ" = "もうやめよう、サオリ。"
"33240-16-サオリ" = "……やめる？"
"33240-17-サオリ" = "アリウスに帰るということか……？帰ったところで、私たちは殺されるだけ……。"
"33240-18-アツコ" = "だから逃げよう、一緒に。"
"33240-19-サオリ" = "逃げる……。"
"33240-20-アツコ" = "うん。"
"33240-21-アツコ" = "アズサが教えてくれた。"
"33240-22-アツコ" = "いつからか持っていたこれは……私たちの憎しみじゃない。"
"33240-23" = "この憎しみを、私たちは習った。それからずっと、私たちのものだと思い込んでいた。"
"33240-24-アツコ" = "……アズサはきっと、それに気づいたんでしょう？"
"33240-25-アズサ" = "……。"
"33240-26-アツコ" = "アズサは色々なことを学び、様々な経験を得た……"
"33240-27-アツコ" = "良い大人に出会えたんだね、アズサ。"
"33240-28-アツコ" = "そして、自分のいるべき場所を見つけた……。"
"33240-29-アツコ" = "だから、サオリ。"
"33240-30" = "……逃げよう。"
"33240-31-アツコ" = "この場から、アリウスから。"
"33240-32-アツコ" = "いつの間に植え付けられた、私たちのものじゃないはずの憎しみから。"
"33240-33-サオリ" = "逃げるだなんて、そんな……。"
"33240-34-マエストロ" = "素晴らしい……。"
"33240-35-マエストロ" = "知性と品格、礼儀と信念、そして培ってきた経験と知恵……。"
"33240-36" = "やはり、そなたならば……。"
"33240-37-マエストロ" = "私の「崇高」を、理解してくれるに違いない……！"
"33240-38-アズサ" = "こ、これは……。"
"33240-39-アツコ" = "……まさか。"
"33240-40-アツコ" = "あの「教義」が、完成した……？"
"33240-41" = "[s] （これは……）"
"33240-42-アツコ" = "これは、レベルが違う……。"
"33240-43-サオリ" = "どういうことだ……。"
"33240-44-アズサ" = "せ、先生。これは……。"
"33240-45-アズサ" = "マズい、逃げないと……！"
"33240-46" = "[s] \"……どうやら、反則みたいだね。\""
"33240-47-アズサ" = "先生……？"
"33240-48" = "[ns1] \"出さないで終わらせたかったけど……。\"\n[ns2] 大人のカードを取り出す。"
"33240-49-マエストロ" = "おお、おおおおっ……！"
"33240-50-マエストロ" = "そうか、あれが例の「カード」……！"
"33240-51-マエストロ" = "人生を、時間を代価として得られる力……その根源も限界も、私たちですら把握できない不可解なもの……！！"
"33240-52-マエストロ" = "嗚呼、ゴルコンダならあれをどう呼称しただろう……何か高次的な表現を教えてくれたのであろうか……。"
"33240-53-マエストロ" = "見せてくれたまえ、先生。そなたが払ってきた代価を……"
"33240-54-マエストロ" = "そうして手に入れたものの輝きを……！"
"33240-55-マエストロ" = "私の作品に、全力で応えてくれたまえ！"
