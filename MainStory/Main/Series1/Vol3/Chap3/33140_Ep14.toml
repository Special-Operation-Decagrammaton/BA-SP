[translation]
"33140-1" = "第14話;暗闇の中で"
"33140-2-？？？" = "ウォォォォォォン――――"
"33140-3-ヒヨリ" = "か、確認しました……あれが、例の……。"
"33140-4-サオリ" = "「戦術兵器」か……ただの化け物だな。"
"33140-5" = "（スッ、ススッ……）"
"33140-6-ミサキ" = "「太古の教義」をもとに作られた、失敗作……？あの人形、失敗したってこと？"
"33140-7-アツコ" = "（ふるふる）"
"33140-8-アツコ" = "（スッ、ススッ、スーッ、ススッ……）"
"33140-9-ミサキ" = "難しいことはよく分からないけど……失敗作ではありつつも、「戦術兵器」であることに違いは無い？"
"33140-10-ミサキ" = "なら良いけど……そろそろバレる頃合いじゃないの？「ユスティナ聖徒会」にせよ、この「戦術兵器」にせよ、それから私たちの次の目標にせよ。"
"33140-11-サオリ" = "……どのみち、もう手遅れだ。"
"33140-12-サオリ" = "待機中の部隊に連絡を。"
"33140-13-サオリ" = "これより、トリニティへの進撃を開始する。"
"33140-14" = "トリニティ自治区・捨てられた遺跡地帯"
"33140-15" = "トリニティ自治区・カタコンベ"
"33140-16" = "トリニティ自治区・地下水路"
"33140-17-サオリ" = "よし、では命令を――"
"33140-18-サオリ" = "……。"
"33140-19-ミサキ" = "リーダー？"
"33140-20-ヒヨリ" = "ど、どうかされましたか？"
"33140-21-サオリ" = "……私たちがここを空けていたのは、どれくらいだ？"
"33140-22-ヒヨリ" = "3時間くらい、ですかね……。"
"33140-23-サオリ" = "……。"
"33140-24-サオリ" = "……あいつがいる。"
"33140-25-ミサキ" = "あいつ？"
"33140-26-アツコ" = "（スッ、ススッ……）"
"33140-27-ミサキ" = "あ、アズサちゃん、ですか？"
"33140-28-ヒヨリ" = "ひっ、ひいいいぃぃっ！？"
"33140-29-ミサキ" = "ブービートラップ、いつの間に……！？"
"33140-30-ヒヨリ" = "あ、こっ、こっちにも！？"
"33140-31-アツコ" = "……！！"
"33140-32-サオリ" = "動くなっ！！"
"33140-33-ミサキ" = "……っ！"
"33140-34-ミサキ" = "！！"
"33140-35-アツコ" = "……。"
"33140-36" = "この狙いは私たちの動揺だ。私たちの隙を突くためのもの。"
"33140-37-サオリ" = "相変わらず、そういう手法だけは上手い。しかし逆に冷静に対処すれば……"
"33140-38-ヒヨリ" = "いえこの感じ、恐らくまだ周囲にもありますよ！？早く出ないと……！"
"33140-39" = "ヒヨリ！"
"33140-40-ミサキ" = "くっ……！"
"33140-41-ヒヨリ" = "く、苦しいですね、痛いですね……どうして人生は、こんなに……"
"33140-42-ミサキ" = "……。"
"33140-43-サオリ" = "……。"
"33140-44-アツコ" = "……。"
"33140-45-ミサキ" = "明らかにヒヨリから狙った。狙撃手から処理したってことは……。"
"33140-46-サオリ" = "……接近戦に持ち込む気か？"
"33140-47" = "（ガチャッ）"
"33140-48-アツコ" = "！！"
"33140-49-ミサキ" = "上っ、手榴弾！"
"33140-50-サオリ" = "[ruby=しらす]白洲[/ruby]アズサっ！！"
"33140-51-サオリ" = "逃がすか！！"
"33140-52-ミサキ" = "リーダー。追いかけたら、それこそ思う壺……"
"33140-53-ミサキ" = "……まあ、仕方ないか。姫、ヒヨリの状態は？"
"33140-54" = "（スッ、ススッ、スーッ……）"
"33140-55-ミサキ" = "そっか。"
"33140-56-アツコ" = "（ススッ、スッ……）"
"33140-57-ミサキ" = "……長期戦になる？まあ、アズサが本気になったら確かに……"
"33140-58-ミサキ" = "……リーダーの銃声。追いついたかな。"
"33140-59-アツコ" = "……。"
"33140-60-ミサキ" = "仕方ない。私たちも行こう、姫。"
"33140-61-アツコ" = "……。"
"33140-62-サオリ" = "そっちか！！"
"33140-63-サオリ" = "判断は悪くないな、アズサ！お前では正面から私に勝てない！"
"33140-64-サオリ" = "そうやって逃げて……"
"33140-65-サオリ" = "私の隙を狙うしかないだろうっ！！"
"33140-66-アズサ" = "はぁっ、はぁっ……角を曲がって、次……！"
"33140-67-アズサ" = "っ！？"
"33140-68-アツコ" = "（カチャッ）"
"33140-69-アズサ" = "……っ！"
"33140-70-アツコ" = "……。"
"33140-71-アズサ" = "アツコ……。"
"33140-72-アツコ" = "（スッ、ススッ……）"
"33140-73-アズサ" = "……断る。"
"33140-74" = "ドカアアァァァン！！！"
"33140-75-アズサ" = "……！？"
"33140-76-サオリ" = "アズサっ！！"
"33140-77-ミサキ" = "待って、リーダー。このままじゃキリがない。"
"33140-78-ミサキ" = "ユスティナ聖徒会を呼んだら？"
"33140-79-サオリ" = "……。"
"33140-80-アツコ" = "（ふるふる）"
"33140-81-サオリ" = "聖徒会は、トリニティとゲヘナの紛争にしか介入しない……それにアズサは、トリニティの生徒ではないと解釈される可能性もある。"
"33140-82-ミサキ" = "……ふうん、結構面倒な構造だね。"
"33140-83-アツコ" = "（こくこく）"
"33140-84-サオリ" = "それどころか、アズサが「アリウススクワッドだ」と解釈されたら……"
"33140-85-ミサキ" = "……まあ、戒律も結局は解釈次第ってことだね。確かに元々そうやって手に入れた力だし、制約やらペナルティがあるのも当然かもしれない。"
"33140-86-サオリ" = "ああ。だからこそ、こうするしかない。"
"33140-87-サオリ" = "あいつの戦い方、考え方……それらは全て基本的に、私が教えたものだ。私じゃないと倒せない。"
"33140-88-サオリ" = "追うぞ。"
"33140-89" = "……じゃあ、私は反対の方から。姫は他の道からよろしく。"
"33140-90-アツコ" = "……。"
"33140-91" = "（ゴゴゴゴゴゴゴ……）"
"33140-92-ミサキ" = "何これ、地震……？いや、まさか……"
"33140-93-ミサキ" = "このフロア、全体に……？"
"33140-94" = "ゴゴゴゴゴ……！"
"33140-95-ミサキ" = "くっ、いつの間にこんな……！まずい、上の階が崩れる。走って！"
"33140-96" = "ドカアアアアアァァァァァン！！！"
"33140-97-ミサキ" = "げほっ、げほっ……あー……。"
"33140-98-ミサキ" = "動けないな、これ……。"
"33140-99-サオリ" = "アズサあああぁぁっ！！！"
"33140-100-ミサキ" = "……げほっ。"
"33140-101-サオリ" = "チェックメイトだ、アズサ。"
"33140-102-アズサ" = "……くっ。"
"33140-103-サオリ" = "……お前にしては良くやった。それでも無駄だ。お前の考え方、思考、それらは最初から全てお見通し……。"
"33140-104-サオリ" = "最初から、無駄な抵抗だったんだよ。"
"33140-105-アズサ" = "いつから……？"
"33140-106-サオリ" = "？"
"33140-107-アズサ" = "いつからアリウスは、巡航ミサイルなんて物を……？"
"33140-108-アズサ" = "それにいつの間に、あんな不思議な力を操れるようになったんだ……？"
"33140-109-アズサ" = "……「ヘイローを壊す爆弾」も。"
"33140-110" = "一体、いつから……。"
"33140-111-サオリ" = "……。"
"33140-112-サオリ" = "アズサ、どうしてお前が勝てないのか分かるか？"
"33140-113-サオリ" = "弱いからだ。"
"33140-114-アズサ" = "……。"
"33140-115-サオリ" = "何が人を「人殺し」にすると思う？"
"33140-116-サオリ" = "それは「殺意」の有無。"
"33140-117-サオリ" = "経典に出てくる最初の「人殺し」は、たったひとつの石ころで人を殺めたそうだ。"
"33140-118-サオリ" = "そういうことなんだよ、アズサ。意志さえあれば、道具は関係ない。重要なのはただそこに込められた「意志」だけ。"
"33140-119-サオリ" = "ミサイルを含め、それ以外の手段や何やらは、私たちの恨みを証明する道具でしかない……それ以上でも、それ以下でも無いのさ。"
"33140-120-アズサ" = "サオリ……"
"33140-121-アズサ" = "もう一度聞く、「いつから」だ？"
"33140-122-サオリ" = "……！？"
"33140-123" = "その恨み、私はあの時ただあそこで「習った」だけだ……その恨みは、一体誰の――"
"33140-124-サオリ" = "虚しい。"
"33140-125-サオリ" = "弱いな、白洲アズサ。その弱さはお前を縛り付けているんだ。"
"33140-126-サオリ" = "そう、こんな状況でも離そうとしないその人形のように。"
"33140-127-アズサ" = "！！"
"33140-128-サオリ" = "初めてお友達がくれたプレゼント、か？"
"33140-129-サオリ" = "虚しいな。"
"33140-130-サオリ" = "虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい"
"33140-131-サオリ" = "虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい"
"33140-132-サオリ" = "虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい、虚しい"
"33140-133-アズサ" = "ぐっ、あぁぁっ！？"
"33140-134-サオリ" = "虚しいな、アズサ。"
"33140-135-サオリ" = "友情か……ならばその無駄で虚しいものから壊してやろう。たしかヒフミ、だったか？"
"33140-136-アツコ" = "（ふるふる）"
"33140-137-サオリ" = "……姫。"
"33140-138-サオリ" = "……心配しなくても、手加減はしてる。こいつのことなら、よく分かって――"
"33140-139-サオリ" = "アズサ、また逃げるのか！"
"33140-140-アツコ" = "……。"
"33140-141-サオリ" = "……相変わらず逃げ足の速い。"
"33140-142-サオリ" = "まあ良い、どうせあいつはまたやって来る。"
"33140-143-アツコ" = "……？"
"33140-144-サオリ" = "なにせ、この大事な「友情の証」とやらを落としていってしまったからな。"
"33140-145-アツコ" = "……。"
"33140-146-サオリ" = "あいつは必ず、これを取り戻しに来るだろう。"
"33140-147-アツコ" = "（スッ、ススッ……）"
"33140-148-サオリ" = "……闇の中で光を見つけた虫は、もうそれ無しでは生きられない。"
"33140-149-サオリ" = "こんなつまらない物が、アズサの心を支える[ruby=希望]光[/ruby]なんだろう。"
"33140-150-サオリ" = "あいつはこれを諦められない、絶対に戻ってくる。"
"33140-151-サオリ" = "その時にまた捕まえて、あらためてこの世界の真実を教えてやる。"
"33140-152-サオリ" = "そう、無理やりにでも……"
"33140-153-サオリ" = "……ん？"
"33140-154-サオリ" = "何だ、中に……"
"33140-155-サオリ" = "……っ！！"
"33140-156-サオリ" = "これは、セイア襲撃の時に渡した……！"
"33140-157-サオリ" = "逃げろ、姫っ！！！"
"33140-158-アツコ" = "……っ！"
"33140-159" = "……。"
"33140-160" = "…………。"
"33140-161" = "うっ……。"
"33140-162" = "うっ、ううっ……。"
"33140-163" = "ごめん、ヒフミ……ごめん……。"
"33140-164" = "私は……もうこれで、二度と……うっ、ううっ……。"
"33140-165-アズサ" = "ごめん、ごめん、みんな……うっ、うぅぅっ……！！ああぁっ……！！！"
"33140-166" = "次回;五つ目の古則への答え"
