[translation]
"33245-1-マエストロ" = "……。"
"33245-2-マエストロ" = "心から感謝しよう、先生。"
"33245-3-マエストロ" = "不完全な姿でお見せしてしまったことは汗顔の至りだが、すぐに完成させてみせる。"
"33245-4-マエストロ" = "黒服の言う通りだったな……普段はあまり共感できないものの、この件については感謝をせざるを得まい。"
"33245-5-マエストロ" = "……では[USERNAME]先生。そなたにまた会える時を、心待ちにしている。"
"33245-6-マエストロ" = "また、夢の中で。"
"33245-7" = "その後アリウススクワッドのみんなを探したものの、とうとう見つけることはできなかった。"
"33245-8" = "古聖堂のどれかの地下通路から逃げたのだろうけど、それを特定することもできず……。"
"33245-9-サオリ" = "げほっ、げほっ……！"
"33245-10-ヒヨリ" = "だ、大丈夫ですか、リーダー……。"
"33245-11-ヒヨリ" = "……で、どこに行く？"
"33245-12-ヒヨリ" = "……自治区には戻れない。彼女に、殺される……。"
"33245-13-ヒヨリ" = "……まあ、そういう終わり方も悪くないけど。"
"33245-14-ヒヨリ" = "そ、それは苦しそうですね……そうでなくても、この先もずっと……。"
"33245-15-ヒヨリ" = "うん、それが人生だから。"
"33245-16-アツコ" = "……。"
"33245-17" = "次回;エピローグ"
