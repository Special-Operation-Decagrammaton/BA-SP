[translation]
"33130-1" = "第13話;届かない向こう側"
"33130-2-セイア" = "……。"
"33130-3-セイア" = "ハナコは賢い。"
"33130-4-セイア" = "盤面に落ちている情報だけでも、確かに彼女なら真実のすぐ傍まで至れるだろう。"
"33130-5-セイア" = "今こうして繰り広げられている状況、その原因、そして自分にはこれを防ぐ方法が無いということまで。全てを理解しただろうね。"
"33130-6-セイア" = "ようやく好きになれたトリニティ総合学園……その終わりを為す術なく見守るしかないというのは、ハナコにとって残酷な話だ。"
"33130-7-セイア" = "……。"
"33130-8-セイア" = "そしてそこに至ろうとしているのは、ひとりではないみたいだね。まあここでの「ひとりではない」というのは、決して希望のある話を意味しないのだが。"
"33130-9-セイア" = "アズサを探して奔走していたヒフミ……彼女もまた、同じような結論に到達しつつあるようだ。"
"33130-10-セイア" = "一通のメッセージ。座標と時間、そして動物の名を用いた隠語。そんなメッセージを送ってくる相手が誰なのか、それに気が付かない彼女ではない。"
"33130-11-ヒフミ" = "アズサちゃん……？"
"33130-12-ヒフミ" = "アズサちゃん、私です。どこにいるんですか……？"
"33130-13-ヒフミ" = "アズサちゃん……答えてください、アズサちゃん……！"
"33130-14-ヒフミ" = "アズサ、ちゃん……？"
"33130-15" = "……ヒフミ。"
"33130-16-ヒフミ" = "アズサちゃん、今までどこに……学園は今、大騒ぎで……。"
"33130-17-アズサ" = "……うん、知ってる。"
"33130-18-ヒフミ" = "アズサちゃん……？"
"33130-19-アズサ" = "……これを、誰かが止めなくちゃいけない。"
"33130-20-ヒフミ" = "それは、どういう……どうしてそんな顔で……。"
"33130-21-ヒフミ" = "アズサちゃん……"
"33130-22-アズサ" = "来ないで！！"
"33130-23-ヒフミ" = "……！！"
"33130-24-アズサ" = "……。"
"33130-25-アズサ" = "……ありがとう、ヒフミ。"
"33130-26-アズサ" = "でもここまでだ。ここから先には来ちゃいけない。"
"33130-27-アズサ" = "ここから先は、私の居場所。"
"33130-28-アズサ" = "ヒフミみたいな善良な人は、これ以上来ちゃいけないんだ。"
"33130-29-ヒフミ" = "あ、アズサちゃん……？何の、何のお話ですか……？"
"33130-30-ヒフミ" = "私じゃ、何がダメなんですか……？"
"33130-31-アズサ" = "……平凡で優しいヒフミには、似合わない話だよ。"
"33130-32-ヒフミ" = "アズサちゃん、私は……！"
"33130-33" = "「人殺し」"
"33130-34-アズサ" = "……！"
"33130-35-アズサ" = "……人殺しになった私は、もう友達ではいられないだろう？"
"33130-36-ヒフミ" = "あ、アズサちゃん……？"
"33130-37-ヒフミ" = "だって、だってアズサちゃんはそんな……"
"33130-38-アズサ" = "私のせいだ。"
"33130-39-アズサ" = "私のせいでみんなが傷ついて……先生が、撃たれた。"
"33130-40" = "正義実現委員会、ティーパーティー、シスターフッド、それにゲヘナの人たちも……"
"33130-41-アズサ" = "セイアが昏睡状態になったのも、学園がここまで破壊されたのも……全部、私のせいだ。"
"33130-42-アズサ" = "ヒフミ、それにハナコとコハル。このままじゃみんなまで危険になる。"
"33130-43-ヒフミ" = "そ、それは、アズサちゃんのせいではありません……それは……"
"33130-44-ヒフミ" = "だ、大丈夫です。せ、先生は……"
"33130-45-ヒフミ" = "先生もきっと、すぐに目が覚めるはず、ですし……ですから……！"
"33130-46-アズサ" = "ヒフミ。"
"33130-47-アズサ" = "そんなハッピーエンドは……この世界には無いんだ。"
"33130-48-ヒフミ" = "……。"
"33130-49-アズサ" = "今から私はサオリのヘイローを「壊しに」行く。"
"33130-50-アズサ" = "それ以外に、この事態を止める方法はない。"
"33130-51-ヒフミ" = "ま、待ってください、方法……方法なら、きっと……！"
"33130-52-アズサ" = "私はこれから、人を殺す。"
"33130-53-アズサ" = "それが当たり前の場所で、それが当たり前だと教わり、それが当たり前みたいに動けるように訓練された存在……。"
"33130-54-アズサ" = "それが、本当の私。"
"33130-55-アズサ" = "こんな私が、ヒフミと同じ世界になんていられない。"
"33130-56-ヒフミ" = "アズサ、ちゃん……？"
"33130-57" = "……ヒフミ。私を友達だと思ってくれてありがとう。"
"33130-58" = "「アズサちゃん」って呼んでくれてありがとう。"
"33130-59" = "可愛いぬいぐるみをくれて、ありがとう。"
"33130-60" = "海に連れて行ってくれてありがとう。楽しい思い出をくれてありがとう。"
"33130-61" = "可愛いものが、綺麗なものが、"
"33130-62" = "知らないものがあるって教えてくれてありがとう。"
"33130-63" = "補習授業部での毎日……"
"33130-64" = "あんなに素敵な日々を過ごして、たくさんの事が学べて良かった。"
"33130-65-アズサ" = "学ぶことは本当に楽しいことだった……これまでの時間は、死んでも忘れない。"
"33130-66-アズサ" = "少しでも、補習授業部の生徒でいられて良かった……。"
"33130-67-アズサ" = "ありがとう、ヒフミ。さよなら。"
"33130-68-ヒフミ" = "アズサ、ちゃん……。"
"33130-69-ヒフミ" = "ダメです、待って、待ってください……。"
"33130-70-ヒフミ" = "きっと、他に方法が……せ、先生が、みんなが……。"
"33130-71-ヒフミ" = "だって……だって、まだ……"
"33130-72-ヒフミ" = "「次はみんなで一緒に海に行こう」って、約束したじゃないですか……まだ一緒に、ペロロ様の冒険アニメだって、見れてないじゃないですか……"
"33130-73-ヒフミ" = "い、行かないでください……"
"33130-74-ヒフミ" = "アズサちゃん……ダメです、行かないで……待ってくださいアズサちゃん……"
"33130-75-ヒフミ" = "アズサちゃんっ！！！！"
"33130-76" = "次回;暗闇の中で"
