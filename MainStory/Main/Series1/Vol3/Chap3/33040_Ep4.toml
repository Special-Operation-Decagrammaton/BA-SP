[translation]
"33040-1" = "第4話;それから"
"33040-2-ツルギ" = "きえええぇぇぇぇぇぇっ！！！"
"33040-3" = "（ドゴオォォォォン！！！ズドオォォォォォォン！！！！）"
"33040-4-マシロ" = "ツルギ先輩、今日は絶好調ですね。"
"33040-5-マシロ" = "……正直、任務続きで疲れもあったのですが、こんな姿を目の前にして弱音は吐けません。"
"33040-6-マシロ" = "私も先輩を見習って、もっと頑張らないと！"
"33040-7-イチカ" = "ハスミ先輩ちーっす。さっきちょっと誰かさんに、学校にあった備品の戦車を奪われちゃいましてー。"
"33040-8-ハスミ" = "何ですって……！？"
"33040-9-イチカ" = "ちょっと頭数が足りないんで来てほしいんすけど……おわっ、何かすげードリフトしてる！？なんつーテク！"
"33040-10-ハスミ" = "今はバタバタしているのですが……えっと、コハルがまだ校内に……。"
"33040-11-ハスミ" = "いえ、コハルは風邪で休んでいるんでしたね……。"
"33040-12-マシロ" = "そもそもコハルさんはまだ補習授業部の所属ですよ。というわけで先輩、私が行ってきます！"
"33040-13-マシロ" = "ぎゃはははははははははぁっ！"
"33040-14-ハスミ" = "まあ、ここはツルギに任せても良さそうですね……私も一緒に行きます！"
"33040-15-ハナコ" = "あ、あの、ハナコさん……？"
"33040-16-ハナコ" = "はい、どうかしましたかヒナタさん？"
"33040-17-ハナコ" = "あの、背中に何かが当たっているような……？"
"33040-18-ハナコ" = "そうですねぇ、困りましたねぇ♡"
"33040-19-ヒナタ" = "あうぅ……。"
"33040-20-ハナコ" = "えっと、ハナコさん？何かお辛いことでも……？"
"33040-21-ハナコ" = "いえいえ、何もありませんよ。お出かけしたいタイミングにこうして頼みごとをされて、何日も資料整理という「大切な」お手伝いに従事させられているだけですから。まあ全員一緒ではありませんでしたし……何ひとつ問題はありません♡"
"33040-22-マリー" = "うぅ、ごめんなさい……ハナコさんが怖い……。"
"33040-23" = "万魔殿・議事堂"
"33040-24-マコト" = "キキキキッ！お前が「シャーレ」の先生か！"
"33040-25-マコト" = "なるほど、これは予想外だ！いっそ愉快なくらいにな！キキキキキッ！"
"33040-26" = "[s] \"えっと……こんにちは。君がゲヘナの生徒会長……？\""
"33040-27-マコト" = "キキッ、ああそうさ。"
"33040-28-マコト" = "万魔殿の議長であるこのマコト様に協力の申し出とは、悪くない判断だ。"
"33040-29" = "[s] \"……え？\""
"33040-30-マコト" = "キキキキッ……「シャーレ」と「万魔殿」。この二つが力を合わせたら、ゲヘナの風紀委員会ごとき簡単に壊せるはずだ。至って論理的な判断だと言える。"
"33040-31-マコト" = "計算は完了した、さあすぐにでも計画を実行……！"
"33040-32-マコト" = "……あの。そういう会話は、相手がいないところでした方が良いですよ？"
"33040-33-イロハ" = "マコト先輩……話を変な方向に捻じ曲げないでください。"
"33040-34-イロハ" = "こちらの「シャーレ」の先生はあくまで、形式的な問題で私たちに会いに来ただけです。エデン条約にも参列されますので。"
"33040-35-マコト" = "……なら、我々との協力は？"
"33040-36-イロハ" = "するわけがないじゃないですか。そもそも今日初めて会ったばかりですよ？"
"33040-37-マコト" = "……。"
"33040-38-マコト" = "……ふっ、そうか。なるほど。"
"33040-39-マコト" = "まあ、楽しみは後に取っておくとしよう。"
"33040-40-マコト" = "よし、帰るぞイロハ。"
"33040-41-イロハ" = "はい？もう良いんですか？"
"33040-42-アコ" = "はぁ……。"
"33040-43" = "[s] \"アコも、元気だった？\""
"33040-44-アコ" = "それは……。"
"33040-45-アコ" = "まあまあ、ですかね……。"
"33040-46-アコ" = "でも意外でした、先生がエデン条約に参列されるだなんて。"
"33040-47-アコ" = "ということは、この後はトリニティに……？"
"33040-48" = "[s] \"さっきトリニティに行ってから、ここに来たところ。\""
"33040-49-アコ" = "なっ、いつの間に……！？"
"33040-50-アコ" = "風紀委員会の行政官である私が、そんな重要な情報を見逃していた……！？"
"33040-51-アコ" = "いくら条約の準備で忙しかったとはいえ、先生の行動を把握できていなかっただなんて……。"
"33040-52" = "[s] \"アコ、落ち着いて……。\""
"33040-53-アコ" = "……ふぅ。"
"33040-54-アコ" = "委員長にも先日言われてしまいました、少し落ち着いた方が良いと……。"
"33040-55" = "[s] \"ヒナは今仕事中？\""
"33040-56-アコ" = "委員長は、今所用でゲヘナの外に……。"
"33040-57-アコ" = "いつも通り、お忙しい毎日です……エデン条約が締結されたら、委員長のお仕事も減るとは思いますが……。"
"33040-58-アコ" = "……。"
"33040-59-アコ" = "とにかく、先生の用事は終わりですよね。お帰りはあちらの方――"
"33040-60-ヒナ" = "……見送る。"
"33040-61-アコ" = "い、委員長？"
"33040-62-アコ" = "明日まで出張だったはずでは……？"
"33040-63-ヒナ" = "思ったより早く片付いたから。アコもお疲れ様、私が送ってくるから休んでて。"
"33040-64-アコ" = "あ、はい……。"
"33040-65-ヒナ" = "ほら、先生。"
"33040-66-ヒナ" = "ふぅ……。"
"33040-67-ヒナ" = "……それで、先生。トリニティの件は落ち着いた？"
"33040-68" = "[s1] \"まだ全然、どうにかしたいことが山積みで……。\"\n[s2] \"エデン条約が終わった後に、また色々やる予定……。\""
"33040-69-ヒナ" = "そう……ということは、私にも言ってないことをまた色々と抱えてるってわけね。"
"33040-70-ヒナ" = "そう……ということは、私にも言ってないことをまた色々と抱えてるってわけね。"
"33040-71-ヒナ" = "あの時私に言ったことが本当に全部なら、まだ終わってないはずが無いと思うのだけど？"
"33040-72-ヒナ" = "……別に、「どうして全部言わなかったの」って責めてるわけじゃない。アビドスならまだしも、トリニティのことだし。やたらと複雑で、色々先生側にも考えることとか事情があっただろうし……。"
"33040-73" = "[s] \"ま、まあ……でも水着パーティーの件は全部説明した通りだよ。\""
"33040-74-ヒナ" = "そっ、そういうのは良いの！"
"33040-75-ヒナ" = "ああもう……。"
"33040-76-ヒナ" = "……まあ、とにかく。"
"33040-77-ヒナ" = "色んな観点があって、見方によって真実は変わるかもしれない……あの時先生はそう言ってたけれど。"
"33040-78-ヒナ" = "例え「トリニティの裏切り者」が見つかったとしても、それは特定の観点からの真実にすぎない……それだけで全てを判断するのは難しい。"
"33040-79-ヒナ" = "情報だけを鵜呑みにせず、色んな観点から他の真実をも探しつつ、自分にできる努力をし続ける。なぜならそれは……"
"33040-80-ヒナ" = "……。"
"33040-81-ヒナ" = "……その子たちは、先生に信じられてるのね。"
"33040-82" = "[s] \"ヒナのことも信じてるよ。\""
"33040-83-ヒナ" = "っ！急に何を……！"
"33040-84-ヒナ" = "あと、それは前にも聞いた！"
"33040-85-ヒナ" = "全くもう……。"
"33040-86-ヒナ" = "帰り道、気を付けて。"
"33040-87" = "[ns] \"……もしかしてだけど、まだアコに引退のこと話してない？\""
"33040-88-ヒナ" = "……そうね。"
"33040-89-ヒナ" = "先生以外はまだ誰も知らない。アコは何となく気づいてるかもしれないけど。"
"33040-90-ヒナ" = "引退と言ったって、そんなに大げさなことじゃない。少し疲れたから休みたいってだけで……。"
"33040-91-ヒナ" = "……この話はやめよう。そんなに大事なことでもないし。"
"33040-92-ヒナ" = "……じゃあまた、調印式で。"
"33040-93" = "[s] \"うん、ありがとう。ヒナ。\""
"33040-94" = "それからまた、時間は流れて……"
"33040-95" = "エデン条約調印式、当日を迎える。"
"33040-96" = "次回;エデン条約調印式（１）"
