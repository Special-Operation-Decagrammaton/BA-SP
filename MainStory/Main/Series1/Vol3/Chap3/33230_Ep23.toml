[translation]
"33230-1" = "第23話;古聖堂の地下に"
"33230-2-ミサキ" = "……今度こそ終わりかな。"
"33230-3-ヒヨリ" = "そうですね、これ以上はもう……。"
"33230-4-ミサキ" = "……。"
"33230-5-ミサキ" = "まだだ……。"
"33230-6" = "まだ古聖堂の地下に……あれが……。"
"33230-7-アズサ" = "サオリ……！？"
"33230-8-ハナコ" = "古聖堂の地下へ……！"
"33230-9-ハナコ" = "何か手段が残っているような言い方でした、止めなくては！"
"33230-10" = "まだ、こんな力がありましたか……。"
"33230-11-アズサ" = "……私が行く。"
"33230-12" = "あ、アズサちゃん、私も……！"
"33230-13-アズサ" = "その怪我だ、安静にしてて。心配しなくても平気。サオリを止めて、すぐに戻ってくる。"
"33230-14" = "[s] \"私も行くよ。\""
"33230-15-アズサ" = "……ありがとう、先生。"
"33230-16-ヒフミ" = "アズサちゃん、気を付けて……！"
"33230-17-アズサ" = "……うん。私はもう大丈夫。"
"33230-18-アズサ" = "ヒフミ、ハナコ、コハル……行ってくる。"
"33230-19-ヒフミ" = "はいっ！"
"33230-20-ハナコ" = "待ってますよ。"
"33230-21-コハル" = "き、気を付けてねっ！"
"33230-22" = "[ns] \"じゃあ、行こうか。\""
"33230-23-サオリ" = "アズサ……。"
"33230-24-アズサ" = "サオリ、もう終わりにしよう。"
"33230-25-サオリ" = "……良いだろう。全てをかけて、最後の戦いにしてやる。"
"33230-26-サオリ" = "……まだ私と1対1で、正面から勝てるとでも思ってるのか？"
"33230-27-アズサ" = "いや、私はひとりじゃない。"
"33230-28-サオリ" = "っ、先生……！"
"33230-29-サオリ" = "何もかも、全て片付けてやる。お前も、その大人も！"
"33230-30-サオリ" = "全てが虚しいこの世界で、真実を思い知れ！！"
"33230-31" = "[ns] \"アズサ、行こう。\""
"33230-32-アズサ" = "……うん。"
