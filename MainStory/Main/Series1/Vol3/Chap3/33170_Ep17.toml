[translation]
"33170-1" = "第17話;憎しみの正体"
"33170-2-ティーパーティー傘下の主戦派A" = "どきなさい、今の状況が分からないの！？"
"33170-3-ティーパーティー傘下の主戦派B" = "緊急の事態なのよ！？"
"33170-4-コハル" = "で、でも、私は……！"
"33170-5-ティーパーティー傘下の主戦派C" = "どけっ！！"
"33170-6-コハル" = "……い、嫌っ！"
"33170-7-コハル" = "わ、私はバカだから、何がどうなってるのか全然分からないけど……"
"33170-8-コハル" = "でも、これは違う！こんなの絶対にダメ！！"
"33170-9-ティーパーティー傘下の主戦派B" = "聞かないやつだ、それなら……"
"33170-10-ティーパーティー傘下の主戦派A" = "ま、待って。この子、どこかで……。"
"33170-11-ティーパーティー傘下の主戦派B" = "よく見ると、何だか見覚えが……"
"33170-12" = "[ns] \"コハルは補習授業部の、私の生徒だよ。\""
"33170-13-コハル" = "せ、先生っ！？"
"33170-14-ミカ" = "……。"
"33170-15-ティーパーティー傘下の主戦派C" = "シャーレの……！？"
"33170-16-ティーパーティー傘下の主戦派B" = "そんな、意識不明の重体だったはず……？"
"33170-17-ティーパーティー傘下の主戦派C" = "せ、先生が、どうしてここに……。"
"33170-18" = "[s] \"お願いだから、まず暴力はやめてほしい。\""
"33170-19-ティーパーティー傘下の主戦派A" = "そ、それは……。"
"33170-20-ティーパーティー傘下の主戦派B" = "……。"
"33170-21-ティーパーティー傘下の主戦派C" = "か、帰ろう。あの先生の表情、絶対にマズいって……。"
"33170-22-ティーパーティー傘下の主戦派A" = "……ああ、行こう。"
"33170-23-コハル" = "せ、先生……先生……。"
"33170-24" = "[s] \"コハル、カッコよかったよ。流石は正義実現委員会のエリート。\""
"33170-25-コハル" = "先生……！"
"33170-26-ミカ" = "……。"
"33170-27-ミカ" = "先生……。"
"33170-28" = "[s] \"ミカ、大丈夫？\""
"33170-29-ミカ" = "えっと……うん。"
"33170-30-ミカ" = "何て言うか、久しぶり……だね？"
"33170-31" = "[s] \"そうだね。ミカ……ミカは、どうしてさっき……\""
"33170-32-ミカ" = "え、あー、それは……。"
"33170-33-ミカ" = "……何でだろ。絶好のチャンスだし、今立ち上がればって分かってはいるんだけど……。"
"33170-34-ミカ" = "今でも嫌い、なんだけど……どうしてだろ……。"
"33170-35-ミカ" = "私にも、よく分かんないな……。"
"33170-36-ミカ" = "あれ、ちょ、ちょっと待って……"
"33170-37-ミカ" = "私……。"
"33170-38-セイア" = "ミカ……"
"33170-39-セイア" = "その憎しみは……君が先陣に立っていた、その憎悪は……。"
"33170-40-セイア" = "君は、どうして……。"
"33170-41-ナギサ" = "ミカさん、そろそろ聞かせていただけませんか？「アリウスと和解する」……そこにある意図を。"
"33170-42-ミカ" = "え、意図？"
"33170-43-セイア" = "どういった政治的な利益があるのか……と、ナギサは聞いているんだよ。"
"33170-44-ミカ" = "別に政治的な利益っていうか……だって元々は、同じトリニティでしょ。"
"33170-45-ミカ" = "直接自治区に行ってさ、「仲良くしよ？」って言ってみようよ！ほら、みんなでお茶会でも開いてさ！"
"33170-46" = "……。"
"33170-47-セイア" = "……。"
"33170-48-ミカ" = "……え、何この空気。私何か変なこと言った？"
"33170-49-ミカ" = "良いと思わない？あーあ、私がホストだったらすぐにでも動いたのに。"
"33170-50" = "ミカさん、あなたは本当に……まあそれは一先ず良いとして。あちらが応じるかは分からないでしょう。自治区の場所も判明していないことですし。"
"33170-51-セイア" = "それにミカ、君はもしそれが達成できたとしてどうするつもりだい？アリウスを吸収してより強大になったトリニティ……何か大きな戦いを起こそうとでも？"
"33170-52-ミカ" = "んー、まあどうするも何も無かったけど……それも良いかもね？そういう声もたくさんあるし。"
"33170-53-ミカ" = "それにそうなったら、ゲヘナをどうにかできちゃうかもしれないし？"
"33170-54-セイア" = "……。"
"33170-55-ミカ" = "……なぁに、セイアちゃん。そのお顔は。"
"33170-56-セイア" = "君は自分勝手だ。あんまり何も考えていない上に衝動的で、欲張りで、時に自傷的な……"
"33170-57-セイア" = "そんな君のことが、私は好きではなかったかもしれない。"
"33170-58-ミカ" = "……セイアちゃんはここにいる。"
"33170-59-ミカ" = "静かに、病院にでも送ってくれれば……。"
"33170-60-ミカ" = "そういうことだから、よろしくね。"
"33170-61-アリウスの生徒" = "これについては、「スクワッド」に任せます。"
"33170-62-ミカ" = "……スクワッド？"
"33170-63-アリウスの生徒" = "はい、ご存じでしょう？"
"33170-64-ミカ" = "（セイアちゃんが、死んだ……？）"
"33170-65-ミカ" = "（……何で？どうして？）"
"33170-66-ミカ" = "（何がどうなって、え、何でそんなことに……？）"
"33170-67-ミカ" = "（どうして？バカなの？だって、私は……）"
"33170-68-ミカ" = "（あれ、私……）"
"33170-69-ミカ" = "（私、どうしてセイアちゃんを襲撃してって指示したんだっけ……？）"
"33170-70-ミカ" = "（セイアちゃんがいなくなったら、私……）"
"33170-71-ミカ" = "（……）"
"33170-72-ミカ" = "（……ああ、そうだ。私は、ホストになろうとして……）"
"33170-73-ミカ" = "（そう、ゲヘナのことが嫌いだったから。嫌いなものは嫌いだったから。ナギちゃんも条約とか、何か変なことをしようとしてるし）"
"33170-74-ミカ" = "（何でそんなことするんだろ。相変わらずおバカさんなんだから。ゲヘナとの平和条約だなんて、絶対。絶対に許せない）"
"33170-75-ミカ" = "（……セイアちゃん。未来が見えるとか何とか言ってたのに、どうして自分のことも守れなかったの？それくらい見えてたんでしょ？）"
"33170-76-ミカ" = "（そもそもあんなに身体も弱いのにティーパーティーに入って、いつもいつも私に「しっかり考えたまえ」って小言ばっかりで……この間だって、あんな目で私のことを……）"
"33170-77-ミカ" = "（だから、だから……）"
"33170-78-ミカ" = "（こうしているために、そしてゲヘナを一掃するために、これくらいの犠牲は仕方のないことだった）"
"33170-79-ミカ" = "（そうだった、はずなのに……）"
"33170-80-ミカ" = "わ、私は……。"
"33170-81-ミカ" = "……。"
"33170-82-ミカ" = "ごめん、セイアちゃん…………。"
"33170-83-ミカ" = "どうして、こうなったのかな……。"
"33170-84-ミカ" = "ごめん……ごめんね……。"
"33170-85-ミカ" = "こんなにバカで、ごめん……。"
"33170-86" = "[s] \"ミカ……。\""
"33170-87-ミカ" = "先生……私、セイアちゃんに会いたい……。"
"33170-88-ミカ" = "ナギちゃんにも、もう一度会いたい……。"
"33170-89-ミカ" = "こんな私じゃ、もうダメかもしれないけど……。"
"33170-90-セイア" = "……。"
"33170-91-セイア" = "ミカ、君は……。"
"33170-92-セイア" = "そうか、理由を求めていたのか……。"
"33170-93-セイア" = "嫌いであることに何かしっかりしたものが必要なのではと、どこかで合理化しようと……。"
"33170-94-セイア" = "そうして間違いが合わさって……相変わらず、馬鹿なことを……。"
"33170-95-セイア" = "……。"
"33170-96-セイア" = "私は君のことを、分かったつもりでいた。きっとまだこれだけじゃない……君の抱えていたものを、幼気な感情を、考えていたことを、その状況を……それらを知ろうとする努力を、私は怠っていた。"
"33170-97-セイア" = "……そうか。"
"33170-98-セイア" = "私はまだ、君のことをあまりにも知らない……。"
"33170-99-セイア" = "……そして、気が付いた時には君も私と同じように。間違った物語の真ん中に置かれていたのか。"
"33170-100-セイア" = "殺人、死、裏切り、抗争……。"
"33170-101-セイア" = "君のような少女が身を置くには、あまりにも残酷な話だった。本来であれば許されるべき我儘が、君を……"
"33170-102-セイア" = "……ミカ。"
"33170-103-セイア" = "君も、ずっと……。"
"33170-104-セイア" = "……とにかく私は、君を許そう。"
"33170-105-セイア" = "そして私もまた、君に許しを乞わなくてはならないのかもしれない。"
"33170-106-セイア" = "私たちはもう一度お互いに伝えあって、それで……もしかしたらその先は……"
"33170-107" = "[ns] \"……任せて、ミカ。\""
"33170-108-ティーパーティーの行政官" = "せ、先生だ……。"
"33170-109-シスターフッドの行政官" = "先生……。"
"33170-110-正義実現委員会部員" = "先生……！？"
"33170-111" = "[s] \"みんな、待たせてごめん。\""
"33170-112-ハナコ" = "先生……。"
"33170-113-マリー" = "先生……！"
"33170-114-コハル" = "……っ。"
"33170-115" = "[ns] \"ここにいてくれて、待っててくれてありがとう。\""
"33170-116" = "[ns] \"ここから先は、私に任せて。\""
"33170-117" = "次回;迷わずに"
