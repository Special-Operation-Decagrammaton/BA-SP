[translation]
"33210-1" = "第21話;楽園の名前は（２）"
"33210-2-ホシノ" = "さーて、次はこっちの番かな～？"
"33210-3-シロコ" = "準備はできてる。"
"33210-4-セリカ" = "よし、行くわよ！"
"33210-5-アコ" = "対策委員会のみなさん。私の方であちら側の情報を分析しました、データをお送りしますね。"
"33210-6-アヤネ" = "行政官の……！"
"33210-7-アコ" = "はい、お久しぶりですね[ruby=おくそら]奥空[/ruby]アヤネさん。お元気でしたか？"
"33210-8-アヤネ" = "えっと、はいまあ、おかげさまで……？"
"33210-9" = "なんだこの同窓会みたいな雰囲気……。"
"33210-10-ノノミ" = "良いですねー、仲良きことは美しきかなです☆"
"33210-11-チナツ" = "支援の準備も完了しました、いつでも行けます。"
"33210-12" = "さーて、じゃあ行こっか！"
