[translation]
"21190-1" = "第19話;ダブルオー"
"21190-2" = "ミレニアム・ゲーム開発部"
"21190-3-ミドリ" = "お姉ちゃん！まだ！？"
"21190-4-モモイ" = "ま、待って、急かさないで！あとこれだけ入力すれば終わりだから……！"
"21190-5-ミドリ" = "あと2分だよ！？急かさずにはいられないって！"
"21190-6-アリス" = "正確には96秒です、そう言ってる間に残り92秒……"
"21190-7-モモイ" = "わ、分かった分かった！もうできたから！"
"21190-8-ユズ" = "こっちは簡単なテストだけやって……うんっ。"
"21190-9-ユズ" = "エラーは出てない、モモイ！"
"21190-10-モモイ" = "オッケー！ファイルをアップロード、完了まで予想時間……15秒！アリス、あと何秒！？"
"21190-11" = "残り19秒です……！"
"21190-12-ミドリ" = "お、お願い……！"
"21190-13-モモイ" = "転送完了……"
"21190-14" = "ミレニアムプライスへの参加受付が完了しました。"
"21190-15-モモイ" = "間に合ったああぁぁあ！"
"21190-16-ユズ" = "ギリギリ……心臓止まるかと思った……。"
"21190-17" = "あとは……3日後の発表を待つだけ、だね。"
"21190-18-モモイ" = "とりあえず間に合ったけど、まだ結果が出たわけじゃない。"
"21190-19-モモイ" = "3日後には……このままこの部室にいられるのか、そうじゃないのかが決まる。"
"21190-20-モモイ" = "……でも3日って結構長いじゃん？そこで提案なんだけどさ、"
"21190-21-モモイ" = "先に、web版の『テイルズ・サガ・クロニクル２』をアップロードしてみるのはどう？"
"21190-22-ユズ" = "！？"
"21190-23-ミドリ" = "ど、どうして？"
"21190-24-モモイ" = "3日間も待てないよ！それに、審査員の評価より先に、ユーザーの反応を見たくない！？"
"21190-25-ミドリ" = "うーん、でもちょっと怖いかも……低評価コメントも心配だし。"
"21190-26-モモイ" = "何言ってるのさ！そもそも、ミレニアムプライスに出品するため[ruby=・・]だけ[/ruby]に作ったゲームじゃないでしょ！"
"21190-27-モモイ" = "自信を持って、見てもらおうよ！私たちはベストを尽くしたんだから！"
"21190-28-ミドリ" = "そ、それはそうだけど……。"
"21190-29-ユズ" = "……うん、アップしよう。"
"21190-30-ミドリ" = "え？"
"21190-31-ユズ" = "作品っていうのは……見てくれる人、遊んでくれる人がいてこそ、完成されるものだと思うから。"
"21190-32-ユズ" = "わたしは……わたしたちのゲームを、きちんと完成させたい。"
"21190-33-ミドリ" = "ユズちゃん……。"
"21190-34-ユズ" = "大丈夫。もし前みたいに、低評価コメントのオンパレードになったとしても……。"
"21190-35-ユズ" = "全力で頑張ったから。それに……みんなが一緒だから、きっと受け止められる。"
"21190-36-ユズ" = "わたしはもう、大丈夫。"
"21190-37-ミドリ" = "……。"
"21190-38-モモイ" = "それじゃあ今すぐアップロードー！"
"21190-39-ミドリ" = "ああっ！ま、待って！心の準備が……！"
"21190-40-モモイ" = "転送完了！プレイして感想が貰えるまで少なくとも2、3時間はかかるだろうし、後はしばしの休憩ってことで！"
"21190-41-ミドリ" = "……はあ、そうだね。"
"21190-42-アリス" = "……。"
"21190-43" = "……。"
"21190-44-モモイ" = "ん、アリス？なんでコンピューターの前に座ってるの？"
"21190-45-アリス" = "待機します。"
"21190-46-アリス" = "みなさんがダウンロードを始めたようです、気になります。"
"21190-47-ミドリ" = "これからゲームをプレイするのにまた時間がかかるだろうし、待っててもそんなにすぐは来ないと思うよ？"
"21190-48-アリス" = "はい、それでも待ちます。"
"21190-49-ユズ" = "わ、わたしも……。"
"21190-50-ユズ" = "どっちにしろ、緊張で眠れないし……。"
"21190-51-ユズ" = "わたしも、待ってる。"
"21190-52-ミドリ" = "……うん。"
"21190-53-ミドリ" = "ダメ、私もドキドキしてきちゃった。"
"21190-54-モモイ" = "私は心配でドキドキが止まらないよ……うぅっ、自分で言い出したのに緊張でおかしくなりそう！"
"21190-55" = "（ピロン）"
"21190-56-ミドリ" = "あっ、初コメ。"
"21190-57-モモイ" = "何て！？何て！？"
"21190-58" = "＜hermet021：わお、これ前回クソゲーランキング1位を取った、あれの続編？もうゲーム作りはやめたと思ってたけど、懲りないねえ＞"
"21190-59-アリス" = "……。"
"21190-60-モモイ" = "あ、アリス、こういうのはあんまり気にせず……"
"21190-61-アリス" = "……。"
"21190-62-アリス" = "マキに連絡。該当IPアドレスの方角に対して、最大出力のビーム砲を食らわせてきます。"
"21190-63-ミドリ" = "そ、それはダメ！"
"21190-64-ユズ" = "……大丈夫。"
"21190-65-ユズ" = "ゲームをやってもいない人の発言だから……気にしないで、ね？"
"21190-66" = "（ピロン）"
"21190-67" = "＜Kotoha0507：前回の『TSC』は確かに、手放しで賞賛できる作品ではなかったかもしれません。ですが新鮮味があり、少なくともありふれた作品ではありませんでした。今回の2ではどんな目新しさを見せてくれるのか、楽しみです＞"
"21190-68-モモイ" = "おっ、徐々にちゃんとした反応が……。"
"21190-69" = "（ピロン）"
"21190-70" = "＜QueenC：さて、鬼が出るか蛇が出るか……せっかくなら中庸なんかじゃなくて、たとえどっち側だったとしても、振り切った体験を期待したいね＞"
"21190-71" = "（ピロン）"
"21190-72" = "＜kirakiraNO1：前作はやったけど、良い思い出としては残ってない。それどころか苦い記憶がいくつも鮮明に思い出せるくらい。でも、どうしてかな……続編だって知ってるのに、ついダウンロードしちゃった＞"
"21190-73-モモイ" = "す、すごい！なんか私たちのゲーム、めちゃくちゃ期待されてない！？"
"21190-74-ミドリ" = "全体的になんか、「時限爆弾を楽しそうに解除しようとしてる」感じっていうか……。"
"21190-75-ユズ" = "怖いもの見たさ、みたいな……。"
"21190-76" = "（ピロン、ピロン）"
"21190-77" = "＜cat0808：2時間後に補習でテストがあるんだけど……そんなことより今はこのゲームがやりたい気分＞"
"21190-78" = "＜You-me：テストなんてこれから先、いくらでもあるじゃん。これを遊ぶ最高のタイミングは、アップされたばっかりの今だけなんだよ！＞"
"21190-79-ユズ" = "えっと、それはできれば……テストを受けに行ってほしいかも……。"
"21190-80-モモイ" = "だ、ダウンロード数がもう2000を超えてる！？さすがにおかしくない！？"
"21190-81-ミドリ" = "あ……有名なポータルサイトに、私たちのゲームが発表されたって記事が載ったみたい。"
"21190-82-モモイ" = "うわあぁぁ……！無関心じゃなければ良いな、くらいに思ってたのに！ここまで数が増えると急に怖くなってきた！"
"21190-83-アリス" = "……。"
"21190-84-アリス" = "……ドキドキします。"
"21190-85-モモイ" = "うぅっ！期待と不安で、心臓が爆発しそう！"
"21190-86" = "（ドカアアァァァン！）"
"21190-87-モモイ" = "！？"
"21190-88-アリス" = "ほ、本当に心臓、爆発しちゃったんですか？"
"21190-89-モモイ" = "ち、違う！私の心臓じゃない！"
"21190-90-ユズ" = "いったい何の……！ゲーム機が爆発！？"
"21190-91" = "え、長時間やり過ぎたかな……？"
"21190-92-ミドリ" = "違う！この砲撃は13.97mm砲……カリン先輩の！"
"21190-93" = "（ドゴオォォォン！）"
"21190-94-ユズ" = "ひゃっ！？"
"21190-95-アリス" = "遠距離攻撃を確認、部室正面に対して11時の方角！距離、約1km……！"
"21190-96" = "ぜ、前回の仕返し！？"
"21190-97-アリス" = "反撃を開始します！"
"21190-98-モモイ" = "ううん、アリス、一旦出よう！ここだと先生を巻き込んじゃうし、それに……。"
"21190-99-モモイ" = "このままここで戦ったら、私たちの部室が壊れちゃう！"
"21190-100-ミドリ" = "お姉ちゃん……。"
"21190-101-ユズ" = "そ、外に生徒会の人たちも……！「鏡」の件の報復……！？"
"21190-102-ミドリ" = "ちょ、ちょっとは申し訳ないと思ってたけど……！"
"21190-103-モモイ" = "ひぃっ、また来る！"
"21190-104" = "[s1] \"落ち着いて。\"\n[s2] \"リロードしてるうちに、とにかく外へ出よう。\""
"21190-105-ミドリ" = "先生……！"
"21190-106-ミドリ" = "先生……！"
"21190-107-ミドリ" = "はいっ！"
"21190-108-モモイ" = "アリス、私とユズが前に立つ！"
"21190-109-アリス" = "はい。"
"21190-110-アリス" = "アリスは、先生とみんなを守ります。"
"21190-111-モモイ" = "よし、行こう！！"
