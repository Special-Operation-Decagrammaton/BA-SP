[translation]
"21050-1" = "第5話;私はアリスです"
"21050-2" = "ミレニアム・ゲーム開発部"
"21050-3-ミドリ" = "うーん、やっぱり心配……。"
"21050-4-ミドリ" = "この子をうちの部員に偽装するなんて……本当に大丈夫？"
"21050-5-アリス" = "「大丈夫」の意味を確認……「状態が悪くなく問題が発生していない状況」のことと推定、肯定します。"
"21050-6-ミドリ" = "……いやいや、肯定できないって！この口調じゃ絶対疑われるよ！"
"21050-7-ミドリ" = "やめておこう！？これは無理だって！"
"21050-8-モモイ" = "今やめるって選択肢の方が無理だよ。何としても、私たちのゲーム開発部を守らなきゃ。"
"21050-9-モモイ" = "そうしないと、ユズの居場所が……寮に戻るわけにはいかないし……。"
"21050-10-ミドリ" = "……。"
"21050-11-ミドリ" = "そう、だったね……。"
"21050-12-モモイ" = "服装もある程度整ったし、あとは武器と……学生登録をして、学生証を手に入れないと。"
"21050-13-モモイ" = "学生証については、私の方で何とかするから。"
"21050-14-ミドリ" = "ミドリはユズと二人で、アリスに「話し方」を教えてあげて。"
"21050-15-ミドリ" = "は、話し方？"
"21050-16-モモイ" = "今のままだとミドリが言った通り、疑われちゃうかもしれないから。"
"21050-17-モモイ" = "ただでさえ「友達もいないあなたたちに、新しい部員の募集なんて出来るはずないでしょ」って言われてるし……。"
"21050-18-モモイ" = "もし、何かの拍子にユウカに「本当にゲーム開発部なのか」って聞かれたとして……"
"21050-19-モモイ" = "「肯定、あなたの質問に対し、アリスの回答を提示。私はゲーム開発部の部員」"
"21050-20" = "……なんて言っちゃった暁には、全部台無しになりかねない。"
"21050-21-ミドリ" = "いや、それはそうだけど……。"
"21050-22-ミドリ" = "はぁ……。"
"21050-23-ミドリ" = "仕方ない、やれるだけやってみるよ。"
"21050-24-モモイ" = "よし、じゃあ任せた！"
"21050-25-ミドリ" = "ちょ、ちょっと待って！"
"21050-26-ミドリ" = "うーーん……。"
"21050-27-アリス" = "？？？"
"21050-28-ミドリ" = "え、えっと……アリス、ちゃん？"
"21050-29-アリス" = "肯定。本機の名称、アリスです。"
"21050-30-ミドリ" = "うん、じゃあアリスちゃんって呼ぶね。それにしても話し方かあ……よく考えると、どうやって習得するんだろ。普通は動画を見たり、周りの言葉を真似していくうちに自然に、って感じだと思うけど。"
"21050-31-ミドリ" = "……うーん。子供用の教育プログラムって、インターネットに落ちてるかな……。"
"21050-32-アリス" = "（キョロキョロ）"
"21050-33-アリス" = "？"
"21050-34-アリス" = "正体不明の物を発見、確認を行います。"
"21050-35-アリス" = "ん？"
"21050-36-アリス" = "あっ、そ、それは……っ！？"
"21050-37-アリス" = "えっと……ちょっと恥ずかしいけど、実はその中に、私たちが作ったゲームが載ってるの。まあ、すごい酷評されちゃったんだけどね。"
"21050-38-ミドリ" = "あ、そうだ！"
"21050-39-ミドリ" = "クソゲーランキングでは1位になっちゃったし、アリスちゃんがどう思うかは分からないけど……"
"21050-40-ミドリ" = "アリスちゃん、私たちのゲーム……やってみない？"
"21050-41-アリス" = "「会話」をしながら進められるから、ゲームをやってみるのも勉強になるかも。"
"21050-42-アリス" = "……？"
"21050-43-アリス" = "ここまでの言動の意図、完璧には把握しかねます。しかし……"
"21050-44-アリス" = "……肯定、アリスはゲームをします。"
"21050-45-ミドリ" = "ほ、本当に！？ちょ、ちょっと待ってて、すぐにセッティングするから！"
"21050-46-ミドリ" = "よし、準備完了！"
"21050-47-アリス" = "……。"
"21050-48-アリス" = "アリス、ゲームを開始します……"
"21050-49-ミドリ" = "タイトルから分かるかもしれないけど、このゲームは童話テイストで、色彩豊かな王道ファンタジーRPGなの。"
"21050-50" = "[56cd7b]コスモス世紀2354年、人類は劫火の炎に包まれた……"
"21050-51-アリス" = "……？"
"21050-52-ミドリ" = "えっと、王道とは言っても、色々な要素を混ぜてたりするんだけどね。トレンドそのままでもダメだけど、王道に拘りすぎても古くなるからってことで。"
"21050-53-アリス" = "……。"
"21050-54-アリス" = "ボタンを押します……"
"21050-55" = "[56cd7b]チュートリアルを開始します。"
"21050-56" = "[56cd7b]まずはBボタンを押して、目の前の武器を装着してみてください。"
"21050-57-アリス" = "Bボタン……"
"21050-58" = "（ドカーーーーン！！）"
"21050-59-アリス" = "？？？"
"21050-60" = "[FF6666]＜GAME OVER＞"
"21050-61-アリス" = "！？！？"
"21050-62-モモイ" = "あははははっ！"
"21050-63-モモイ" = "予想できる展開ほどつまらないものはないよね！本当はここで指示通りじゃなくて、Aボタンを押さなきゃいけないの！"
"21050-64-ミドリ" = "お姉ちゃん……？学生証を作りに行くって言ってなかった？"
"21050-65-モモイ" = "行ってきたんだけど、遅い時間だったからか誰もいなかったの。また明日行く。"
"21050-66-ミドリ" = "それはさておき、あらためて見てもこの部分はちょっと酷いと思う。"
"21050-67-アリス" = "……。"
"21050-68-アリス" = "も、もう一度始めます……。"
"21050-69-アリス" = "再開……テキストでは説明不可能な感情が発生しています。"
"21050-70-アリス" = "あっ、私それ分かるかも！きっと「興味」とか「期待」とか、そういう感情だと思う！"
"21050-71-アリス" = "どう考えても「怒り」か「困惑」だと思うけど……。"
"21050-72" = "[56cd7b]武器を装備しました。"
"21050-73-アリス" = "装備完了……。"
"21050-74-モモイ" = "お、良い感じ。そのまま進めば、RPGの花である戦闘が……"
"21050-75" = "[FF6666]エンカウントが発生しました！"
"21050-76-アリス" = "！？"
"21050-77" = "[56cd7b]野生のプニプニが現れた！"
"21050-78-アリス" = "緊張、高揚、興味。"
"21050-79-モモイ" = "Aボタンを押して！今度は嘘じゃないから！"
"21050-80-アリス" = "Aボタン……「秘剣つばめ返し：敵に対して2回攻撃をする」"
"21050-81-アリス" = "行きます、プニプニに対して……"
"21050-82-アリス" = "秘剣！つばめ――"
"21050-83" = "[56cd7b]ッダーン！"
"21050-84" = "[56cd7b]攻撃が命中、 即死しました"
"21050-85" = "[FF6666]＜GAME OVER＞"
"21050-86-アリス" = "！？！？"
"21050-87" = "[56cd7b]プニプニ：どれだけ剣術を鍛えたところで、我が銃の前では無力……ふっ。"
"21050-88-モモイ" = "うーん、やっぱりプニプニが「ふっ」って言うのは不自然かな。"
"21050-89-ミドリ" = "……ツッコみどころはそこじゃないと思う。"
"21050-90-アリス" = "思考停止、電算処理が追いつきません。"
"21050-91-アリス" = "あ、アリスちゃん？大丈夫？"
"21050-92-アリス" = "……。"
"21050-93-アリス" = "リブート、再開します。"
"21050-94-アリス" = "今度は銃の射程距離把握に努めながら、接近しすぎないようにプニプニを排除します。"
"21050-95-モモイ" = "そう、まさにそれ！諦めずに繰り返し挑戦して、試行錯誤の末に答えを見つける！それがレトロチックなゲームのロマンだよ！"
"21050-96" = "（2時間後……）"
"21050-97-アリス" = "……電算処理系統、および意思表示システムに致命的なエラーが発生。"
"21050-98-アリス" = "頑張ってアリス、ここさえ乗り越えれば待望のクライマックスだよ！"
"21050-99-ミドリ" = "うう……っ！"
"21050-100-ミドリ" = "今のはどう考えても、「草食系」って言葉が思い出せないからって、それを「植物人間」って書いたお姉ちゃんのせいでしょ！？"
"21050-101-ミドリ" = "「ごめんなさい。私は植物人間ですので、女性に対して気軽に声をかけることはできません」ってテキストを読んだ瞬間に、アリスちゃんが一瞬意識を失ってたじゃん！"
"21050-102-アリス" = "……質問。どうして母親がヒロインで、それでいて実は前世の妻で、"
"21050-103-アリス" = "さらにどうしてその妻の元に、子供の頃に別れたきりの腹違いの友人がタイムリープしてきているのか……#nいえ、そもそも「腹違いの友人」という表現はキヴォトスの辞書データに登載されていな――"
"21050-104-アリス" = "エラー発生、エラー発生！"
"21050-105-ミドリ" = "が、頑張ってアリスちゃん！クライマックスまでもう少しだから！"
"21050-106-アリス" = "……リブート。"
"21050-107-アリス" = "プロセスを回復。"
"21050-108-アリス" = "……ふぅ。"
"21050-109-アリス" = "これが、ゲーム……。"
"21050-110-アリス" = "再開します。"
"21050-111" = "（1時間後……）"
"21050-112-アリス" = "こ、ろ、し、て……"
"21050-113-モモイ" = "すごいよアリス！開発者二人が一緒とはいえ、3時間でトゥルーエンドなんて！"
"21050-114-ミドリ" = "そ、それもそうだけど、"
"21050-115-ミドリ" = "もしかして、本当にゲームをやればやるほど……"
"21050-116-ミドリ" = "アリスちゃんの喋り方のパターンが、どんどん多彩になってきてる……！？"
"21050-117-アリス" = "勇者よ、汝が同意を求めるならば、私はそれを肯定しよう。"
"21050-118-モモイ" = "うん、確かにそう……かも？"
"21050-119-ミドリ" = "ゲームからそのまま覚えたせいで、ちょっとまだ不自然かもだけど……言葉を羅列してただけの時よりは、かなり良くなったと思う！"
"21050-120-ミドリ" = "と、ところでその……"
"21050-121-ミドリ" = "こういうのを面と向かって聞くのは緊張するんだけど……"
"21050-122-アリス" = "わ、私たちのゲーム、どうだった？面白かった！？"
"21050-123-モモイ" = "……。"
"21050-124-モモイ" = "……説明不可。"
"21050-125-アリス" = "え、ええっ！？なんで！？"
"21050-126-モモイ" = "……類似表現を検索。"
"21050-127-モモイ" = "ロード中……"
"21050-128-アリス" = "も、もしかして、悪口を探してる……？そんなこと無いよね？"
"21050-129-モモイ" = "……面白さ、"
"21050-130-モモイ" = "それは、明確に存在……"
"21050-131-アリス" = "おおっ！"
"21050-132-ミドリ" = "プレイを進めれば進めるほど……"
"21050-133-ミドリ" = "まるで、別の世界を旅しているような……"
"21050-134-ミドリ" = "夢を見ているような、そんな気分……もう一度……"
"21050-135-アリス" = "もう一度……"
"21050-136-アリス" = "……"
"21050-137-アリス" = "（ポロッ）"
"21050-138-モモイ" = "ええっ！？"
"21050-139" = "あ、アリスちゃん！？どうして泣いてるの！？"
"21050-140-モモイ" = "決まってるじゃん！それぐらい、私たちのゲームが感動的だったってことでしょ！"
"21050-141-ミドリ" = "い、いくらなんでもそれは……というかこのゲーム、ギャグ寄りのRPGのはずだし……。"
"21050-142-モモイ" = "ありがとうアリス！その辺の評論家の言葉なんかより、その涙の方が100倍嬉しいよ！あー、早くユズにも教えてあげたい……！"
"21050-143-？？？" = "……ちゃ、ちゃんと、全部見てた。"
"21050-144" = "（ギギーッ）"
"21050-145-モモイ" = "え？ロッカーが勝手に開いて……"
"21050-146-ミドリ" = "きゃあああっ！お、お、お化け！？"
"21050-147-モモイ" = "落ち着いて、ミドリ！プライステーションを投げちゃダメ！そろそろ壊れる！"
"21050-148-アリス" = "……。"
"21050-149-アリス" = "……？"
"21050-150-モモイ" = "ユズ！"
"21050-151-ミドリ" = "ユズちゃん、あれだけ探しても見つからなかったのに！いつからロッカーの中にいたの？"
"21050-152-ユズ" = "み、みんなが、廃墟から帰ってきた時から……。"
"21050-153-ミドリ" = "だいぶ前じゃん！？その時からずっとロッカーの中にいたの？あ、もしかしてアリスちゃんが怖かったから？"
"21050-154-ミドリ" = "モモトークか何かで伝えてくれれば良かったのに、びっくりしたよ……。"
"21050-155-モモイ" = "あ、アリスは初めてだよね。この人が私たちゲーム開発部の部長、ユズだよ。"
"21050-156-ユズ" = "（スッ）"
"21050-157-アリス" = "？"
"21050-158-ユズ" = "えっと、あの、その……。"
"21050-159-ユズ" = "あ、あ、あ……"
"21050-160-アリス" = "あ……？"
"21050-161-ユズ" = "……ありがとう。"
"21050-162-ユズ" = "ゲーム、面白いって言ってくれて……もう一度やりたいって言ってくれて……。"
"21050-163-ユズ" = "泣いてくれて……本当に、ありがとう。"
"21050-164-アリス" = "？？？"
"21050-165-ユズ" = "面白いとか、もう一度とか……そういう言葉が、ずっと聞きたかったの。"
"21050-166-アリス" = "ユズちゃん……。"
"21050-167" = "次回;言葉を学ぶ方法"
