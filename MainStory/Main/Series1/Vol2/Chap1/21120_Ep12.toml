[translation]
"21120-1" = "第12話;「鏡」を探して"
"21120-2" = "ミレニアム・ヴェリタス"
"21120-3-ハレ" = "依頼された「データ」について、結果が出たよ。"
"21120-4-ミドリ" = "い、いよいよ……！"
"21120-5-アリス" = "ドキドキ……。"
"21120-6-ハレ" = "知っての通り私たち「ヴェリタス」は、キヴォトス最高のハッカー集団だと自負してる。"
"21120-7-ハレ" = "システムやデータの復旧については、それこそ数えきれないほど解決をしてきた……。"
"21120-8-ハレ" = "その上で、単刀直入に言うね。"
"21120-9-ユズ" = "（ごくり……）"
"21120-10-ハレ" = "モモイ、あなたのゲームのセーブデータを復活させるのは無理。"
"21120-11-モモイ" = "うわぁぁぁぁん！もうダメだーーーー！"
"21120-12-ミドリ" = "そっちじゃないでしょ！？G.Bibleのパスワードの解除はどうしたのさ！？"
"21120-13-コタマ" = "それなら、マキが作業中ですよ。"
"21120-14-ミドリ" = "マキちゃんが？"
"21120-15-マキ" = "あ、おはようミド！"
"21120-16-マキ" = "来てくれたんだね、ありがと。"
"21120-17" = "うぅ、私のセーブデータが、涙と汗の結晶が……！"
"21120-18-マキ" = "モモはどうしてこんなに泣いてるの？"
"21120-19-ミドリ" = "気にしないで大丈夫……それより、G.Bibleはどうだった？"
"21120-20-マキ" = "うん、ちゃんと分析できたよ。あれはかの伝説のゲーム開発者が作った神ゲーマニュアル……G.Bibleで間違いないね。"
"21120-21-ミドリ" = "や、やっぱりそうなんだ！"
"21120-22-マキ" = "ファイルの作成日や最後に転送された日時、ファイル形式から考えても確実。作業者についても、噂の伝説のゲーム開発者のIPと一致してた。それと、あのデータはこれまでに一回しか転送された形跡がない。"
"21120-23-ミドリ" = "っていうことは……。"
"21120-24-マキ" = "うん、オリジナルの「G.Bible」だろうね。"
"21120-25-ミドリ" = "す、すごい！！"
"21120-26-マキ" = "でも問題があって……ファイルのパスワードについてはまだ解析できてないの。"
"21120-27-マキ" = "えぇっ、じゃあ結局見られないってことじゃん！？ガッカリだよ！"
"21120-28" = "うっ！だってあたしはあくまでクラッカーであって、ホワイトハッカーじゃないし……とにかく！"
"21120-29-マキ" = "そうは言っても、方法が無いわけじゃない。"
"21120-30-モモイ" = "そうなの？"
"21120-31-マキ" = "あのファイルのパスワードを直接解析するのは、多分ほぼ不可能。でも、セキュリティファイルを取り除いて丸ごとコピーするって手段なら、きっと出来るんじゃないかな……。"
"21120-32-マキ" = "で、そのためにはOptimus Mirror System……通称「鏡」って呼ばれるツールが必要なの。"
"21120-33-モモイ" = "ぜ、全然話についていけない……。"
"21120-34-ミドリ" = "つまり……G.Bibleを見るためには、その「鏡」っていうプログラムが必要だってことだよね？それはどこにあるの？"
"21120-35-マキ" = "あたしたち、ヴェリタスが持って……た。"
"21120-36-モモイ" = "何だ、それなら今すぐ……ん、待って？過去形！？"
"21120-37-マキ" = "……そう、今は持ってない。生徒会に押収されちゃったの、もうっ！"
"21120-38" = "この間ユウカが急に押し入ってきて、「不法な用途の機器の所持は禁止」って。"
"21120-39-コタマ" = "「鏡」もそうですし、色々と持って行かれてしまいましたね……私の盗聴器とかも。"
"21120-40-ミドリ" = "その「鏡」って……そんなに危険なものなの？"
"21120-41-ハレ" = "そんなことは無いよ。ただ暗号化されたシステムを開くのに最適化されたツールってだけ。"
"21120-42-ハレ" = "ただ……世界に一つしかない、私たちの部長が直々に製作したハッキングツールで。"
"21120-43-ミドリ" = "部長っていうと……ヒマリ先輩？"
"21120-44-アリス" = "ヒマリ……？"
"21120-45" = "アリスちゃんはまだ会ったことないよね、ヴェリタスの部長さんなの。ちょっと体が不自由で車椅子に乗ってるから、見かけたらすぐ分かると思う。"
"21120-46-ミドリ" = "すごい人でね。身体のことはあるけど、それであの人に同情したり軽視したりするような人は、少なくともこのミレニアムにはいない。天才……って言うのかな。ミレニアム史上、まだたった三人しか貰えてない学位、「全知」を持ってる人なの。"
"21120-47-モモイ" = "うん、本当にすごい……けど、それはそうとして。その先輩がせっかく作った装備を、どうして取られちゃったのさ。"
"21120-48-コタマ" = "……私はただ、先生のスマホのメッセージを確認したかっただけです。そのために、「鏡」が必要で……。"
"21120-49-コタマ" = "不純な意図は、全く無かったのですが。"
"21120-50-ミドリ" = "私には、不純な意図しか感じられないけど……。"
"21120-51-マキ" = "うわあぁん！早く「鏡」を探さないと、部長に怒られちゃう！！"
"21120-52-ハレ" = "とにかく……整理すると、私たちも「鏡」を取り戻したい。"
"21120-53-ハレ" = "それに、G.Bibleのパスワードを解くためには、あなたたちにとっても「鏡」は必要……そうでしょ？"
"21120-54-モモイ" = "なるほどね……呼び出された時点で、何かあるのかなとは思ってたけど。だいたい分かったよ。"
"21120-55-ミドリ" = "え、も、もしかして……？"
"21120-56" = "ふふ、さすがモモ。話が早いね。"
"21120-57-モモイ" = "目的地が一緒なんだし、旅は道連れってね。"
"21120-58-アリス" = "共にレイドバトルを始めるのであれば、私たちはパーティーメンバーです。"
"21120-59-ミドリ" = "あの、お姉ちゃん、もしかしてだけど……"
"21120-60-ミドリ" = "まさかヴェリタスと組んで、生徒会を襲撃するつもりじゃ……！？"
"21120-61" = "ミレニアム・屋上"
"21120-62-ユウカ" = "……そのまさかよ。"
"21120-63-アカネ" = "なるほど、にわかには信じがたいお話ですね。"
"21120-64-アカネ" = "ゲーム開発部については、私も知らないわけではありません。"
"21120-65-アカネ" = "あんなに可愛らしいのに……ミレニアムの生徒会を襲撃しようだなんて、人は見かけによりませんね？"
"21120-66-ユウカ" = "純粋な子たちよ。でもだからこそ、時にはとんでもない悪戯をしたりもする。"
"21120-67-ユウカ" = "それに、今回はヴェリタスも絡んでるの。"
"21120-68-アカネ" = "ヴェリタス……あのハッキングに特化した、クラッカー集団ですよね？"
"21120-69-ユウカ" = "ええ、そうよ。共通点は無さそうに見えるけど、大事な物のためには手段を選ばない……という点で、ゲーム開発部とよく似ているわ。"
"21120-70-アカネ" = "そうでしたか。まあ何であれ依頼である以上、私たちは受けるつもりでいますが……"
"21120-71-アカネ" = "一つだけ、ちょっとした問題があります。"
"21120-72" = "ミレニアム・ヴェリタス"
"21120-73-モモイ" = "問題？"
"21120-74-マキ" = "「鏡」は生徒会の「差押品保管所」に保管されてるんだけど。そこを守ってるのが実は……"
"21120-75-マキ" = "メイド部、なんだよね。"
"21120-76-ミドリ" = "……え？メイド部って、もしかして……"
"21120-77-モモイ" = "ああ、C&Cのことだよね？ミレニアムの武力集団、メイド服で優雅に相手を「清掃」しちゃうことで有名なあの……"
"21120-78-マキ" = "そうそう！まあ些細な問題なんだけどさ～。"
"21120-79-モモイ" = "そっか～！そうだねー、うーんなるほど～……"
"21120-80-モモイ" = "諦めよう！！！ゲーム開発部、回れ右！前進っ！！"
"21120-81-モモイ" = "待って待って待って！諦めちゃダメだよモモ！G.Bibleが欲しいんでしょ！？"
"21120-82-モモイ" = "そりゃ欲しいよ！でもだからって、メイド部と戦うなんて冗談じゃない！"
"21120-83-モモイ" = "そんなの、走ってる列車に乗り込めとか、燃え盛る火山に飛び込めって言われた方がまだマシ！"
"21120-84-マキ" = "で、でもこのままじゃあたし部長に怒られ……じゃなくて！ゲーム開発部も終わりだよ！このままじゃ廃部になっちゃうんでしょ！？"
"21120-85-モモイ" = "廃部は嫌だけど……でもこれは、話の次元が違う。"
"21120-86-モモイ" = "C&Cの「ご奉仕」によって壊滅させられた過激団体や武装サークルは数え切れない……知ってるでしょ？"
"21120-87-ハレ" = "……最後には痕跡すら残さず、綺麗に掃除される。有名な話だね。"
"21120-88-モモイ" = "そりゃ部活は守りたいけど、ミドリにアリス、ユズの方が圧倒的に大事！危険すぎる！"
"21120-89-マキ" = "待って待って、C&Cが危険なのは分かってるって！でもあたしたちはゲヘナの風紀委員会でもなければ、トリニティの正義実現委員会でもないんだから、何も真正面から喧嘩しようってわけじゃないよ。"
"21120-90-マキ" = "あたしたちの目標は「メイド部を倒す」ことじゃなくて、差押品保管所から「鏡」を取ってくることなんだから～……"
"21120-91" = "そんなに変わらないじゃん！"
"21120-92-ハレ" = "……でも、可能性の無い話じゃない。"
"21120-93-モモイ" = "私の盗ちょ……情報によると、現在のメイド部は完全な状態ではありません。"
"21120-94-モモイ" = "えっ？"
"21120-95-ハレ" = "もちろん、メイド部はミレニアム最強の武力集団。"
"21120-96-ハレ" = "どうして「最強」と呼ばれているのか……それはもちろん、素晴らしいエージェントのメイドが揃っているからというのもあるけれど……"
"21120-97-ハレ" = "何よりも大きいのは、「彼女」の存在。"
"21120-98-ミドリ" = "メイド部の部長、コールサイン・ダブルオー……ネル先輩。"
"21120-99-ハレ" = "そう。"
"21120-100-ハレ" = "けど、今彼女は……"
"21120-101" = "ミレニアム・屋上"
"21120-102-ユウカ" = "ね、ネル先輩がいない！？"
"21120-103-アカネ" = "はい、ミレニアムの外郭に個人的な用事があるそうでして。"
"21120-104-アカネ" = "ですが、ご心配なく。"
"21120-105" = "厳密に言うと私たちのリーダーは、守ることより「壊すこと」に特化した人ですから。"
"21120-106-アカネ" = "もちろん、リーダーがいる時のC&Cが一番強い……というのは紛れもない事実です。"
"21120-107-アカネ" = "ただ、「守る」ことに関しては……もしかしたら、私たちだけの方が良いかもしれません。"
"21120-108-アカネ" = "ではあらためまして、依頼はお受けします。"
"21120-109" = "約束の時間まで、ゲーム開発部を生徒会の差押品保管所に近づけないこと……お約束いたしましょう。"
"21120-110" = "ミレニアム・ヴェリタス"
"21120-111-モモイ" = "正面衝突を避けて、「鏡」だけを奪って逃げる……うーん……。"
"21120-112-ミドリ" = "……。"
"21120-113-ミドリ" = "やってみよう、お姉ちゃん。"
"21120-114-モモイ" = "えぇっ！？でもネル先輩がいないからって、相手はあのメイド部だよ！？"
"21120-115-ミドリ" = "分かってる、でも……このままゲーム開発部を無くすわけにはいかない。"
"21120-116" = "ボロボロだし、狭いし、たまに雨漏りもするような部室だけど……"
"21120-117" = "もう今は、私たちがただゲームをするだけの場所じゃない。"
"21120-118" = "……みんなで一緒にいるための、大切な場所だから。"
"21120-119-ミドリ" = "だから、少しでも可能性があるなら……私はやってみたい。"
"21120-120-ミドリ" = "ううん、もしメイド部と対峙することになっても、それがどれだけ危険だとしても……！"
"21120-121-ミドリ" = "守りたいの。"
"21120-122-ミドリ" = "アリスちゃんのために、ユズちゃんのために……私たち、全員のために！"
"21120-123-モモイ" = "ミドリ……。"
"21120-124-アリス" = "私たちならできます。"
"21120-125-アリス" = "伝説の勇者は……世界の滅亡を食い止めるために、魔王を倒します。"
"21120-126-アリス" = "アリスは計45個のRPGをやって……勇者たちが魔王を倒すために必要な、一番強力な力を知りました。"
"21120-127-モモイ" = "一番強力な力……レベルアップ？あ、装備の強化？"
"21120-128-コタマ" = "盗聴ですか？"
"21120-129-マキ" = "EMPショックとか！？"
"21120-130-アリス" = "ち、違います……。"
"21120-131-アリス" = "一緒にいる、仲間です。"
"21120-132-モモイ" = "アリス……。"
"21120-133-モモイ" = "……。"
"21120-134-モモイ" = "うん、よし。"
"21120-135-モモイ" = "やろう！生徒会に潜入して、「鏡」を取り戻す！"
"21120-136-モモイ" = "ハレ！何か良い計画とか無い！？"
"21120-137-ハレ" = "任せて。"
"21120-138-ハレ" = "ただ、その計画を実行するためには……"
"21120-139-ハレ" = "いくつかの準備が必要だね。"
"21120-140-ハレ" = "さっき言ってた盗聴もそうだし、EMPショックもそう……それに……"
"21120-141-ハレ" = "あとはやっぱり……「仲間」、かな。"
"21120-142-モモイ" = "仲間？"
"21120-143-アリス" = "（キラキラ）"
"21120-144-ハレ" = "でも、私たちとはそんなに親しい仲ってわけじゃないから……先生にお願いしないとね。"
"21120-145" = "[s1] \"私？\"\n[s2] \"私にできることなら、任せて。\""
"21120-146" = "うん。"
"21120-147-ハレ" = "恐らく彼女たちの力無しに、この作戦は成立しない。"
"21120-148-ウタハ" = "なるほど、それは確かに的確な判断だ。"
"21120-149-ウタハ" = "君の言う通り、その方法なら私たちじゃないと難しいだろうね。"
"21120-150-ウタハ" = "うん、分かった。協力しよう。"
"21120-151-ミドリ" = "ほ、本当に良いんですか？"
"21120-152-ミドリ" = "エンジニア部は実績もたくさんありますし、こんな危ない橋を渡る必要は……。"
"21120-153" = "そうだね、そうかもしれない。"
"21120-154-ミドリ" = "それなのにどうして、メイド部と戦うなんていう危険な計画に乗ってくれるんですか？"
"21120-155-ウタハ" = "それは……。"
"21120-156-ヒビキ" = "……うん、その方が面白そうだから、かな。"
"21120-157-コトリ" = "そうです！それに私たちも、もっと先生と仲良くなりたいですから！"
"21120-158-アリス" = "そうだね、それと……"
"21120-159-アリス" = "？"
"21120-160-アリス" = "……？"
"21120-161-アリス" = "……いや、今は良いさ。よろしく。"
"21120-162-アリス" = "あ、はい。"
"21120-163-アリス" = "こちらこそ、よろしくお願いします……！"
"21120-164" = "ミレニアム・ヴェリタス"
"21120-165-モモイ" = "これで、メンバーは揃ったよね？"
"21120-166-ハレ" = "うん、準備も出来てる。"
"21120-167-モモイ" = "よしっ！"
"21120-168-モモイ" = "あ、そういえば、作戦はいつ始まるの？"
"21120-169-ハレ" = "いつ……？"
"21120-170-ハレ" = "もう始まってるよ。"
"21120-171" = "ミレニアム・屋上"
"21120-172-アカネ" = "あ、一つだけ質問をしたいのですが。"
"21120-173-アカネ" = "ゲーム開発部とヴェリタスが生徒会を襲撃する……そのことを、あなたたちはどこから知ったのですか？"
"21120-174-アカネ" = "情報戦に関して、ミレニアムでヴェリタスを超える集団はいないと思っていましたが……。"
"21120-175" = "……その通りよ。"
"21120-176-ユウカ" = "だから、ヴェリタスが教えてくれた。それだけの話。"
"21120-177-アカネ" = "……はい？"
"21120-178-ユウカ" = "私たちに、ヴェリタスとゲーム開発部がやって来ることを教えてくれたのは……"
"21120-179-ユウカ" = "ヴェリタスの部長、ヒマリだもの。"
"21120-180" = "次回;Nerd VS Maid"
