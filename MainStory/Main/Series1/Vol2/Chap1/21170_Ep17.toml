[translation]
"21170-1" = "第17話;終わらない戦い"
"21170-2" = "ミレニアム・校舎廊下"
"21170-3-アスナ" = "……。"
"21170-4-カリン" = "……。"
"21170-5-アカネ" = "……。"
"21170-6-ネル" = "……。"
"21170-7-ネル" = "なるほどな……。"
"21170-8-ネル" = "ゲーム開発部、か。知らねぇ部活だったが……。"
"21170-9-ネル" = "そいつらにしてやられた、ってことだな？"
"21170-10-アカネ" = "……申し訳ありません。"
"21170-11-アカネ" = "この依頼を受諾して、作戦を準備したのは私です。 "
"21170-12-アカネ" = "メイド部の名に、傷をつけてしまいました……。"
"21170-13-ネル" = "んなこたぁどうでもいい。"
"21170-14-アカネ" = "……え？"
"21170-15-ネル" = "それに、あたしがここに戻ってきた時にリオから連絡が来た。"
"21170-16-カリン" = "セミナーの……ミレニアムの生徒会長から？"
"21170-17-ネル" = "あぁ。"
"21170-18-ネル" = "依頼は撤回。無かったことに、だとよ。"
"21170-19-カリン" = "！？"
"21170-20-アカネ" = "それは、いったいなぜ……？"
"21170-21-ネル" = "あたしの知ったことかよ……けど多分、リオもヒマリも確かめてみたかったんじゃねぇのか？"
"21170-22-アカネ" = "確かめる……私たちの力を、ですか？"
"21170-23-ネル" = "逆だ。"
"21170-24-ネル" = "あの、アリスとかいう奴の方だろ。"
"21170-25-ネル" = "ま、その辺の事情は知ったこっちゃねえ。"
"21170-26-ネル" = "依頼とは関係なくなったが……"
"21170-27-ネル" = "アカネ、調べておいてくれ。"
"21170-28-アカネ" = "はい？何をですか？"
"21170-29-ネル" = "ゲーム開発部だ、関係者もまとめてな。"
"21170-30-アカネ" = "いきなり何故……リベンジ、ですか？"
"21170-31-ネル" = "その表現はなんか癪だが……まぁちっと興味があってな。"
"21170-32-ネル" = "一通り情報が洗えたら、そいつらんところに行くぞ。"
"21170-33-アカネ" = "はい、望むところです。今頃あの子たちは、メイド部に一泡吹かせたと喜んでいるはず。"
"21170-34-アカネ" = "ふふっ、次にお会いする時はどんな表情を見せてくれるのか……楽しみですね。"
"21170-35" = "ミレニアム・ゲーム開発部"
"21170-36-ユズ" = "……。"
"21170-37-ユズ" = "……。"
"21170-38-ユズ" = "……。"
"21170-39-ユズ" = "こんなに落ち込んだのは……『テイルズ・サガ・クロニクル』のプロトタイプをアップロードした時以来……。"
"21170-40-アリス" = "あ、あの、モモイ……？"
"21170-41-モモイ" = "ふふっ、ふへへへへ、全部終わった！おしまいだぁ！！！"
"21170-42" = "み、ミドリ？その、大丈夫ですか？"
"21170-43-ミドリ" = "アリスちゃん、ごめん……今は何も話したくない気分なの……。"
"21170-44" = "えっと、ユズ――"
"21170-45-ユズ" = "怒り、破滅、腐食、絶望、虚脱……世界は今、破滅に向かって……"
"21170-46-アリス" = "あ、あの！えっと、私はあまり理解できてないのですが……"
"21170-47-アリス" = "もしかしてこの状況は、"
"21170-48-アリス" = "G.Bibleのせい、ですか？"
"21170-49-モモイ" = "……。"
"21170-50-ミドリ" = "……。"
"21170-51-アリス" = "えっと、G.Bibleは、嘘は言ってないと思いますが……。"
"21170-52-モモイ" = "そ う い う 問 題 じ ゃ な い っ ！ ！"
"21170-53-アリス" = "！？"
"21170-54-モモイ" = "いっそのこと嘘って言ってくれた方がまだマシ！"
"21170-55-モモイ" = "うああああん、終わった！私たちはもう廃部なんだ！ふえぇぇぇぇぇん！"
"21170-56-アリス" = "？？？"
"21170-57" = "ミレニアム・ゲーム開発部"
"21170-58" = "（2時間前……）"
"21170-59-マキ" = "ハ～イ、ゲーム開発部のちびっ子たち！マキちゃんからプレセントのお届けだよ！"
"21170-60-マキ" = "遂に！"
"21170-61-マキ" = "ジャジャーン！"
"21170-62" = "G.Bible.exe……実行準備完了"
"21170-63-ミドリ" = "ようやく、G.Bibleが私たちの手に……！"
"21170-64-マキ" = "遅れてごめんねー。「鏡」をセミナーに返すことになって、その件でちょっとバタバタしちゃって。"
"21170-65-モモイ" = "ええっ、「鏡」返しちゃったの！？"
"21170-66-マキ" = "実は、ヒマリ先輩は最初から全部知ってたみたい。それくらいあげてもいいから、これからはあんまり無理しないでって。えへへっ。"
"21170-67-マキ" = "あ、それでね。G.Bibleを開いてた時にこの、＜Key＞っていうフォルダを見つけたの。"
"21170-68-モモイ" = "何これ……ケイ、って読むのかな？"
"21170-69-アリス" = "……ケイ？"
"21170-70-ミドリ" = "「キー」でしょ！お姉ちゃんは本当に高校受験合格したの！？"
"21170-71-マキ" = "実は、こっちについては何一つ分からなくって。ファイルは壊れてなさそうだけど……私たちの知ってる機械語じゃ解読できない、信じられないような構成をしてる。"
"21170-72-マキ" = "G.Bibleの方はきちんと開けたけど、こっちはちょっと見ただけじゃ何にも分からなかったの。この＜Key＞のこと、何か知ってたりする？"
"21170-73-モモイ" = "いや、私たちも全然……。"
"21170-74-マキ" = "……。"
"21170-75-マキ" = "もしかして、＜Key＞って……。"
"21170-76" = "[56cd7b]あなたはAL-1Sですか？"
"21170-77" = "ミレニアム・ゲーム開発部"
"21170-78-マキ" = "まさか、あの時の……？"
"21170-79-マキ" = "ふうん、何かあったの？ま、でもとりあえず今はG.Bibleの方でしょ。"
"21170-80-マキ" = "＜Key＞についてはまた今度ね。時間があったら頑張って分析してみるよ。"
"21170-81-マキ" = "じゃ、間違いなく渡したから。またね！"
"21170-82-ミドリ" = "マキちゃん、ありがとね！"
"21170-83-モモイ" = "今度会う時は、秘書を通して連絡してね！なにせ私たちは、『TSC2』で大ヒットする予定だから！"
"21170-84-マキ" = "あははっ、楽しみにしてるよ！"
"21170-85-モモイ" = "みんな、集まって！"
"21170-86-モモイ" = "あらためて……G.Bible、見よっか。"
"21170-87-モモイ" = "みんな知ってる通り、この中に何が入ってるのかについては、ほとんど誰も知らない。ただ最後にG.Bibleを見たと噂される、あるカリスマ開発者によると……"
"21170-88-モモイ" = "「ゲーム開発における秘技。みんなが知っているようで、誰も知らなかった奇跡」……って言われてる。"
"21170-89-モモイ" = "私は、それが知りたい。"
"21170-90-ミドリ" = "うん……最高のゲームを作るために。"
"21170-91-モモイ" = "そう。それが出来れば、これからもみんなでこの場所にいられる。"
"21170-92-モモイ" = "もし失敗したら……ユズは寮に戻って、会いたくもないやつらに会わなきゃいけなくなる。それに、アリスは……。"
"21170-93-ミドリ" = "……もしものことは考えたくないけど。その時はきっと先生が、シャーレが助けてくれるよ。"
"21170-94-アリス" = "シャーレ……？先生と一緒なのは、とっても嬉しいのですが……。"
"21170-95-アリス" = "アリスはもうここに……みんなと一緒には、いられないのですか？"
"21170-96-モモイ" = "……っ！"
"21170-97-モモイ" = "そんなことはない！私たちは絶対に、最高のゲームを作るんだから！"
"21170-98-モモイ" = "大丈夫、『TSC2』もアリスにとっての「神ゲー」になるよ。"
"21170-99-モモイ" = "さて、それじゃあ……。"
"21170-100-モモイ" = "始めよう、アリス！"
"21170-101-アリス" = "はい。"
"21170-102-アリス" = "G.Bible……"
"21170-103-アリス" = "起動！"
"21170-104" = "次回;G.Bible"
