[translation]
"21195-1" = "ミレニアム・旧校舎廊下"
"21195-2-モモイ" = "はぁ、はぁ……。"
"21195-3-モモイ" = "な、何とか逃げ切れた？"
"21195-4-ユズ" = "こ、これからどうする……？"
"21195-5-ミドリ" = "もうミレニアムプライスへの出品は終わってるんだし……"
"21195-6-ミドリ" = "とりあえず結果が出るまで、このまま逃げ続けよう！"
"21195-7-？？？" = "逃げ切れるとでも思ったか？"
"21195-8-ミドリ" = "！？"
"21195-9" = "（ダダダッ！）"
"21195-10-ミドリ" = "きゃぁっ！"
"21195-11" = "ミドリ！"
"21195-12-ネル" = "……。"
"21195-13-ネル" = "なるほどな。"
"21195-14-ネル" = "どうりで、いちいち良い判断だと思ったぜ。"
"21195-15-ネル" = "さっきこのチビたちを指揮したのも、ミレニアムの差押品保管所を襲撃したのも。"
"21195-16-ネル" = "あんただったか。"
"21195-17-ネル" = "先生……って呼べばいいのか？"
"21195-18-ネル" = "アカネが調査した、例の「先生」……噂は大げさじゃなかったみてぇだな……。"
"21195-19" = "[s1] \"どういう用件？リベンジ？\"\n[s2] \"チビって、身長はこっちのみんなと同じくらいじゃ……？\""
"21195-20-ネル" = "はっ！そんなくだらない理由で来るわけねぇだろうが。"
"21195-21-ユズ" = "強いて言うならまずは……そこの、でこ出してるあんた。"
"21195-22-ネル" = "あの時は、よくもあたしを騙してくれたな……？"
"21195-23-ユズ" = "ひっ……！す、すみません！"
"21195-24-ネル" = "やるじゃねえか、褒めてやるぜ。"
"21195-25-ユズ" = "……え？"
"21195-26-ネル" = "怯えたふりをしてブルブル震えながら、あたしを騙すなんてな。大した演技力だ。"
"21195-27-モモイ" = "（怯えてたのは、演技じゃなかったと思うけど……多分）"
"21195-28-ネル" = "まあそれは良いとして……そっちのバカみたいにデケぇ武器持ってるあんた。"
"21195-29-ネル" = "んなこたねぇよ！あたしは3年生だぞ！？あたしの身長に言及した奴らが、最後にはどうなったか教えてやろうか！？"
"21195-30-カリン" = "……落ち着いて、リーダー。"
"21195-31-アカネ" = "なんだか最早新鮮ですね。まだネル先輩に対して、身長の話ができる人がいたなんて。"
"21195-32-カリン" = "ふぅ、ふぅ……。"
"21195-33" = "危うく冷静さを失うところだったが……まあ、こんな話はどうでも良い。おい、そこの無駄にデケぇ武器持ってるあんた。"
"21195-34-アリス" = "（キョロキョロ）"
"21195-35-ネル" = "あんただよ、あんた！"
"21195-36" = "アリスのことですか？"
"21195-37-ネル" = "そうだ、てめぇには用がある。"
"21195-38-ネル" = "C&Cに、一発食らわせてくれたらしいじゃねえか……？"
"21195-39-ネル" = "ちっと面貸せや。"
"21195-40-アリス" = "あ、アリス、このパターンは知っています。"
"21195-41-アリス" = "「私にあんなことをしたのは、あなたが初めてよ……っ」"
"21195-42-アリス" = "告白イベントですね。チビメイド様はアリスに惚れていると。スチル獲得です。"
"21195-43-ネル" = "ふ、ふっざけんなこの野郎っ！ってか、誰がチビメイド様だ！？ぶっ殺されてぇのか！？"
"21195-44-アリス" = "ひっ……！"
"21195-45-モモイ" = "こ、怖っ！！"
"21195-46-ネル" = "はぁ……。"
"21195-47-ネル" = "なかなかイラつかせてくれるじゃねぇか、まあ良い。"
"21195-48-ネル" = "誤解してるかもしれねぇから一応言っとくが、別にC&Cに一発食らわせた分の復讐ってわけじゃねぇ。"
"21195-49-ネル" = "あちこちに怪しい部分はあったが、こっちとしては正当な依頼の中での出来事だった。そっちはそっちで、あたしらを相手に目標を達成しただけだ。"
"21195-50-ネル" = "別にそこに恨みはねぇが……俄然、興味が湧いてきてな。"
"21195-51-モモイ" = "興味……？"
"21195-52-ネル" = "確認、って言った方が良いかもしれねぇが……。"
"21195-53-ネル" = "さあ、ちょっくら相手してもらおうか。"
"21195-54-ネル" = "あたしと戦って勝てたら、このまま大人しく引き下がってやる。"
"21195-55-ネル" = "お互いを理解するには、これが一番手っ取り早いからな。どうだ、難しい話じゃねえだろ？"
"21195-56" = "……。"
"21195-57-アリス" = "分かりました。"
"21195-58-ネル" = "お、やる気満々と来たか。"
"21195-59-アリス" = "一騎打ちのイベント戦闘……みたいなものですね、理解しました。"
"21195-60-ネル" = "イベ……なんつった？"
"21195-61-アリス" = "あの時は狭かったですし、「鏡」を持って帰るという使命がありましたが……"
"21195-62-アリス" = "今なら……！"
"21195-63-アリス" = "行きます、魔力充電100%……！"
"21195-64" = "ちっ、これは……！"
"21195-65-アリス" = "光よ！！"
"21195-66" = "ドカアアァァァン！！"
"21195-67-カリン" = "くっ！"
"21195-68-アスナ" = "わぉ！"
"21195-69-アカネ" = "何という威力……！"
"21195-70-アカネ" = "校舎の壁を、こうも簡単に消し飛ばすほどの……！"
"21195-71-モモイ" = "す、すごい……。"
"21195-72-ミドリ" = "こんな火力、見たことない……。"
"21195-73-アリス" = "……やったか？"
"21195-74-アリス" = "アリスちゃん！そのセリフは無闇に言っちゃダメ！"
"21195-75-アリス" = "あ、ネル先輩は3年生でした。言い直します。"
"21195-76-アリス" = "や、やっつけられましたか……？"
"21195-77-アリス" = "いや、敬語の問題じゃなくて……！"
"21195-78" = "[ns] \"まだだよ。\""
"21195-79" = "（ダダダッ！）"
"21195-80-アリス" = "うぁっ！？"
"21195-81-ネル" = "確かに、並大抵の火力じゃねぇが……。"
"21195-82-ネル" = "ただ、それだけだ。"
"21195-83-アリス" = "も、もう一度、魔力を充電……！"
"21195-84-アリス" = "遅ぇよ。"
"21195-85-アリス" = "あっ……！"
"21195-86" = "（ガッ！）"
"21195-87-アリス" = "きゃぁっ！"
"21195-88-ネル" = "てめぇの武器は確かに強い。だが引き金を引いた後、発射まで最低でもコンマ数秒はかかる。"
"21195-89-ネル" = "その上、その強すぎる火力のせいで、相手にある程度の距離まで入られたら撃てねぇ。"
"21195-90-ネル" = "爆圧に、[ruby=てめぇ]自分[/ruby]まで巻き込まれるからな。"
"21195-91-ネル" = "そしてこの間合いであたしに勝てる奴なんざ、キヴォトス全体でもそう多くは……"
"21195-92" = "……いや、一人もいねぇ。"
"21195-93" = "うぅ……。"
"21195-94" = "アリス！"
"21195-95" = "思った以上にがっかりだったな。この程度で、あいつらがやられたとは到底……"
"21195-96-アリス" = "……。"
"21195-97-アリス" = "（ブォンッ！）"
"21195-98-ネル" = "ぐっ！"
"21195-99-ミドリ" = "銃身を、振り回した……！？"
"21195-100" = "はっ、近接戦としては悪くねぇ判断だ……けどな。"
"21195-101-ネル" = "相変わらずこの距離じゃ、あたしの方が圧倒的に有利。"
"21195-102-ネル" = "てめぇは発射しようにも、あたしに照準を合わせられねぇ。"
"21195-103-アリス" = "……照準は、必要ありません。"
"21195-104-アリス" = "行きます！"
"21195-105-ネル" = "だから無理だって……ん？"
"21195-106-ネル" = "この状況で発射準備……？おい、まさかてめぇ……！？"
"21195-107-ネル" = "あたしじゃなく……床に！？"
"21195-108-ネル" = "正気か！？そのまま撃ったらてめぇも……！"
"21195-109" = "光よ！！"
"21195-110" = "（ドカアアァァン！）"
"21195-111-ミドリ" = "アリスちゃん！うっ、煙で視界が……！"
"21195-112-モモイ" = "床がほぼ崩れて……見つけた、アリス！"
"21195-113-アリス" = "に、肉体損傷48%……後退を望みます！"
"21195-114" = "[s] \"私が背負う。\""
"21195-115-ミドリ" = "お願いします、急いで！"
"21195-116" = "（サササッ――）"
"21195-117-カリン" = "リーダー！"
"21195-118-アカネ" = "だ、大丈夫でしょうか、まさか瓦礫に巻き込まれて……。"
"21195-119-アスナ" = "さっき一瞬アリスちゃんが見えたけど、だいぶダメージ受けてたよ。今頃きっと、うちの小っちゃいリーダーもぺちゃんこに……"
"21195-120-ネル" = "……誰が小っちゃいって！？"
"21195-121-ネル" = "あっ。"
"21195-122-アスナ" = "わ～お、さすがうちのリーダー！全然ピンピンしてるじゃん！"
"21195-123-ネル" = "てめぇはいったいどっちの味方なんだよ……！"
"21195-124-カリン" = "今のアリスは戦闘力を失った状態だけど、このまま追いかける？だいぶ負傷してたし、保健室に向かってるはず。"
"21195-125-アカネ" = "はい、ミレニアムには二桁以上の保健室があるとはいえ……すぐに見つかるでしょう。"
"21195-126-ネル" = "……。"
"21195-127-ネル" = "…………。"
"21195-128-アスナ" = "リーダー？"
"21195-129-ネル" = "……ああ。"
"21195-130-ネル" = "いや、いい。追撃は無し、もう戻る。"
"21195-131-ネル" = "一通り暴れたら、すっきりしたしな。"
"21195-132-カリン" = "……。"
"21195-133-ネル" = "目的は概ね達成した。リオがゲーム開発部に興味を持つ理由も分かったし……。"
"21195-134-ネル" = "それに……"
"21195-135-アスナ" = "分かった！気になっちゃったんでしょ～、先生のこと！"
"21195-136-ネル" = "ばっ、違ぇよ！そ、そういうんじゃなくてだな……！"
"21195-137-アカネ" = "ふふ、お気持ちは分かります。でも、少々心配ですね。"
"21195-138-アカネ" = "あの子たちの体躯を見るに、先生の好みはおそらく……。"
"21195-139" = "少なくともリーダーにとっては、悪い情報じゃない。"
"21195-140-ネル" = "うるせぇ！いつまでもそういうこと言ってっとぶっ飛ばすぞ！？"
"21195-141-ネル" = "はぁ……。"
"21195-142-ネル" = "先生、それにゲーム開発部か……。"
"21195-143-ネル" = "はっ。"
"21195-144-ネル" = "楽しみにしてろよ。あたしをチビ扱いした償い、絶対にさせてやっからな。"
"21195-145-ネル" = "……思いっきり暴れたら腹減ったな。なぁ、ラーメンでも食いに行こうぜ。"
"21195-146-カリン" = "良いですねー。"
"21195-147-カリン" = "賛成賛成～！"
"21195-148-アカネ" = "……そういえばリーダーは成長期だった。"
"21195-149-ネル" = "いい加減にしろやぁっ！！"
"21195-150" = "次回;ミレニアムプライス"
