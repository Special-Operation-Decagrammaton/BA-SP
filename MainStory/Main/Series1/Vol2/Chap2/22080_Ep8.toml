[translation]
"22080-1" = "第8話;崩れた日常"
"22080-2-モモイ" = "…………"
"22080-3" = "[s] \"モモイ……。\""
"22080-4" = "（――モモイが倒れた）"
"22080-5" = "（アリスが暴走したあの日、）"
"22080-6" = "（モモイは騒動に巻き込まれ、意識を失った。）"
"22080-7" = "（急いでモモイをシャーレの医務室に連れてきたものの……）"
"22080-8" = "（それからまる二日が経過しても、）"
"22080-9" = "（モモイの意識はまだ戻らない――）"
"22080-10" = "（アリスの暴走と同時に動き始めた正体不明のロボット………あっという間に部室は火の海となり……）"
"22080-11" = "（幸い、駆けつけてくれたC&Cのおかげで、事態は落ち着いたが……）"
"22080-12" = "[ns] （あのアリスの姿は一体……）"
"22080-13" = "（状況が収束したからといって、すべてが終わったわけではない。あの事件は数々の疑問と傷痕を残していった）"
"22080-14" = "（ハレは、）"
"22080-15" = "（『アリスの行動は、あのロボットと「接触」したのが原因だろう』と）"
"22080-16" = "（ミドリは、）"
"22080-17" = "（『アリスの雰囲気が変わったあの時、）"
"22080-18" = "（モモイが持っていた「ゲーム機」が急に起動した』と）"
"22080-19" = "[ns] \"モモイのゲーム機は……たしか廃墟から……。\""
"22080-20" = "……"
"22080-21" = "（ピピッ）"
"22080-22" = "［Divi:Sion Systemへ、ようこそお越しくださいました。お探しの項目を入力してください］"
"22080-23" = "＜あなたはAL-1Sですか？＞"
"22080-24" = "[ns] \"廃墟……コンピューター……そして……Divi:Sion System……。\""
"22080-25" = "（アリスが暴走した理由は何だろう？ロボットとアリスの関係性は一体……？）"
"22080-26" = "（あの時、急に起動したモモイのゲーム機は一体……）"
"22080-27" = "（廃墟にあった＜Key＞というフォルダとなにか関係があるのだろうか？）"
"22080-28" = "[ns] \"モモイのゲーム機を確認してみたものの……。\""
"22080-29" = "（電源すら入らなかった。まるで元からそうであったかのように――）"
"22080-30" = "（まるで、中身自体が空っぽになってしまったかのように――）"
"22080-31" = "（そうやって何も答えが見つからないまま、思考だけが渦巻いていた時）"
"22080-32-ミドリ" = "先生……アリスちゃんが……。"
"22080-33-ミドリ" = "あ……先生……"
"22080-34" = "[ns] \"アリスはどうしたの？\""
"22080-35-ユズ" = "その……アリスちゃんは……まだ……"
"22080-36-ミドリ" = "部室から、出てきません。"
"22080-37" = "[s] \"……そっか。\""
"22080-38-ミドリ" = "何度も声をかけてみましたけど……どうにも……。"
"22080-39-ユズ" = "こ、こんな時……どうすればいいのか、分からなくて……"
"22080-40-ユズ" = "ううっ……"
"22080-41" = "[s] \"大丈夫。\""
"22080-42-ミドリ" = "……先生？"
"22080-43-ユズ" = "…………！"
"22080-44" = "[s] \"大丈夫。ここは私に任せて。\""
"22080-45" = "[ns] \"………ふう。\""
"22080-46" = "[ns] \"アリス、ちょっと入ってもいいかな？\""
"22080-47" = "[ns] \"入るよ。\""
"22080-48" = "[ns] \"アリス。\""
"22080-49" = "[ns] \"……大丈夫？\""
"22080-50-アリス" = "………………"
"22080-51" = "[s] \"ご飯も食べないでずっと篭ってるって聞いたよ。\""
"22080-52-アリス" = "せ、先生……"
"22080-53" = "[s] \"みんな心配してるよ。行こう……？\""
"22080-54-アリス" = "アリスには、できません。"
"22080-55" = "[s] \"……どうしてかな？\""
"22080-56-アリス" = "アリスは……アリスの……せいで……"
"22080-57-アリス" = "アリスの……せいで……モモイが怪我をしました……。"
"22080-58" = "[s] \"アリス………。\""
"22080-59-アリス" = "全部、アリスが……やったことです。"
"22080-60-アリス" = "どうして、こうなってるのか……アリスにも……わかりません。"
"22080-61-アリス" = "あの時……何かが……"
"22080-62-アリス" = "まるで………#nまるでアリスの知らない「セーブデータ」が、アリスの中にあるかのような……"
"22080-63" = "[s] \"……あ。\""
"22080-64-アリス" = "アリスの記憶にはありませんが……まるで「セーブデータ」を持っているみたいです。"
"22080-65-アリス" = "この身体が、反応しています。"
"22080-66-アリス" = "例えるなら、そう、チュートリアルや説明が無くても進められるような……或いはまるで、何度もプレイしたことのあるゲームを遊んでいるかのような……。"
"22080-67-アリス" = "……アリスの体が、反応しました。#n動きました。"
"22080-68-アリス" = "あの時、アリスが何をしたのか……何も、思い出せませんが……。"
"22080-69-アリス" = "それでもひとつ、確かなのは……アリスが……アリスが…………"
"22080-70-アリス" = "アリスが、モモイを……！"
"22080-71" = "[s] \"アリス、落ち着いて……！\""
"22080-72-アリス" = "先生、アリスは……アリスは一体どうすれば……！"
"22080-73-？？？" = "そう、貴女が怪我をさせた。#n――それは逃れられない真実。"
"22080-74" = "[ns] \"誰……！？\""
"22080-75-ユズ" = "先生！"
"22080-76-ミドリ" = "か、会長が……！"
"22080-77-リオ" = "ああ、やはり――危惧していた通りになってしまったようね。"
"22080-78" = "[s] \"会長……？\""
"22080-79-リオ" = "――貴方が、噂のシャーレの先生？"
"22080-80-リオ" = "……先生との記録的な出会いがこうなってしまったのは極めて残念だわ。"
"22080-81-リオ" = "私の名は[ruby=つかつき]調月[/ruby]リオ。"
"22080-82-リオ" = "貴方――そして、彼女たちに……"
"22080-83-リオ" = "「真実」を教えにきたの。"
"22080-84" = "次回;残酷な真実（１）"
