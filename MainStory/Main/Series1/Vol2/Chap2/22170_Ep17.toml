[translation]
"22170-1" = "第17話;逆転の踏み台"
"22170-2-チヒロ" = "チヒロ先輩！?"
"22170-3-ハレ" = "うわぁ～ん！副部長～！"
"22170-4-コタマ" = "流石です。待っていました。"
"22170-5-ハレ" = "でも……どうやって？"
"22170-6-コトリ" = "そうですよね！だって、エリドゥの通信網は……！"
"22170-7-コトリ" = "リオ会長が掌握してるんじゃなかった？"
"22170-8-チヒロ" = "うん、リオ会長が掌握してる。#nでも、こういう時のためにヒマリが「秘密兵器」を用意してくれてたみたい。"
"22170-9" = "[s] \"秘密兵器……？\""
"22170-10-ミドリ" = "あ……お姉ちゃん！アレ！だよアレ！"
"22170-11-モモイ" = "あ、アレって何！？"
"22170-12-ミドリ" = "前にG.Bibleを解析しようとした時に見つけたヤツ！"
"22170-13" = "[ns] \"「鏡」……！\""
"22170-14-チヒロ" = "ご明察。そう、「鏡」を使ってエリドゥのネットワークをハッキングしたの。"
"22170-15-チヒロ" = "ついでに、会長にも退場してもらったよ。"
"22170-16-マキ" = "え、ど、どういうこと！？もしかして、ヒマリ部長が生徒会に「鏡」を差し押さえられてたのって……！"
"22170-17-ウタハ" = "こういう場合に備えてたって事なのかな？"
"22170-18-ウタハ" = "さすが元ヴェリタスの部長だ。侮れないね。"
"22170-19" = "[s] \"さすがチヒロ！ヴェリタスの女神！\""
"22170-20-チヒロ" = "め、女神って……先生……それはちょっと大袈裟すぎ。"
"22170-21-モモイ" = "あれ！？で、でも差押品保管所に行くのってすっごく大変だよね！"
"22170-22-モモイ" = "一人じゃ絶対……。"
"22170-23-モモイ" = "ああ、それなら助けてくれた人がいたの。"
"22170-24-モモイ" = "運良く、会長の監視から抜けられていた部活の――"
"22170-25-スミレ" = "こんにちは、トレーナー。"
"22170-26" = "[s] \"スミレ！？\""
"22170-27-スミレ" = "アリスさんのことを伺って、居ても立っても居られず……#n僭越ながら、協力させていただきました。"
"22170-28-チヒロ" = "うん、本当に助かったよ。ありがとう。"
"22170-29-チヒロ" = "……とまぁ、こんな感じで、絶賛ドローン相手に抗戦中なんだけど。"
"22170-30-チヒロ" = "どれくらい持つかは正直分からない……#nけどまぁ、やれるだけやってみるよ。"
"22170-31-スミレ" = "持久戦ならお任せください。"
"22170-32" = "[s] \"スミレ、ありがとう。とても頼もしいよ。\""
"22170-33-チヒロ" = "やっぱり……。#n「鏡」を使ったとはいえ、ファイアウォールが反応してる。"
"22170-34-チヒロ" = "パスが切れる前に先手を打つ必要があるね。"
"22170-35-チヒロ" = "こういう時こそ、「ヴェリタス」――私たちの出番だよ。"
"22170-36-マキ" = "うん、任せて副部長。"
"22170-37-マキ" = "私たちのリソースを全部使い切ったとしても！#nネットワークを維持してみせるよ！"
"22170-38-コタマ" = "はい、全力を尽くします。"
"22170-39-チヒロ" = "うん。維持は任せた。#n代わりに、ここからは先生のナビゲートを私が引き受けるよ。"
"22170-40-チヒロ" = "みんな――まだ戦えるよね？"
"22170-41" = "[ns] \"うん、いけるよ。\""
"22170-42-チヒロ" = "じゃあ反撃開始。いくよ！"
