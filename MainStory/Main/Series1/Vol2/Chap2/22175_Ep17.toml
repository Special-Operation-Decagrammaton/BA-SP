[translation]
"22175-1-ウタハ" = "アバンギャルド君の動きが鈍った今がチャンスだ！#nいくよ、エンジニア部！"
"22175-2-コトリ" = "はい！ラジャー！"
"22175-3-ヒビキ" = "分かった。アレを設置するね。"
"22175-4" = "[ns] \"い、一体何が始まるの！？\""
"22175-5-ウタハ" = "自律追跡機能に加え、防水防塵も完備。"
"22175-6-コトリ" = "さらに、絶対零度や3千度を超える高温下でも安定性を誇る#n超超超超安全認証を保証した……！"
"22175-7-ヒビキ" = "半年分の予算をつぎ込んで作った最強の――"
"22175-8-ウタハ&コトリ&ヒビキ" = "最新式遠隔スピーカー！"
"22175-9-モモイ&ミドリ" = "……。"
"22175-10-ユズ" = "（困惑）"
"22175-11" = "[ns] \"…………スピーカーになんでそんな機能が？\""
"22175-12-ウタハ" = "それは愚問だよ、先生。"
"22175-13-コトリ" = "そもそも機能というのはですね！つけられそうな時に――"
"22175-14-ヒビキ" = "……目一杯つけておくのが鉄則。"
"22175-15-ウタハ" = "そういう事だよ。"
"22175-16-ウタハ" = "それでは――"
"22175-17-ウタハ" = "発射！"
"22175-18-モモイ" = "（……ごくっ）"
"22175-19-モモイ" = "……わ、私、あのセリフ言いたくてムズムズする……！"
"22175-20-ミドリ" = "お姉ちゃん、それはちょっと我慢して！"
"22175-21-ユズ" = "……ぜ、絶対言う必要ないよ。"
"22175-22-ウタハ" = "……やはり、私たちが作ったスピーカーは響きが良いね！"
"22175-23" = "[s] \"そういう意味のスピーカーだったの！？\""
"22175-24-ウタハ" = "まぁまぁ細かい事は置いておきましょう！#nとにかく、これで……！"
"22175-25-ヒビキ" = "……うん。やっと倒せたね。"
"22175-26-モモイ" = "やったー！倒したよー！"
"22175-27" = "[s1] \"何がなんだかよく分からないうちに終わってしまった……。\"\n[s2] \"いやぁ……強敵だったね、アバンギャルド君。\""
"22175-28-ユズ" = "……み、みんなで力を合わせたおかげで、た、倒すことができました。"
"22175-29-ユズ" = "……み、みんなで力を合わせたおかげで、た、倒すことができました。"
"22175-30-ミドリ" = "そうだね。その、何というか……。"
"22175-31-モモイ" = "レイドボスの討伐に成功した、みたいな！！"
"22175-32-チヒロ" = "みんなお疲れ様。でも、本番はこれから。"
"22175-33-チヒロ" = "まだ「鏡」でネットワークを維持できているうちに移動しないと……#nとりあえずナビするよ。"
"22175-34-ヒビキ" = "あ、その話なのだが……"
"22175-35-ウタハ" = "その……"
"22175-36-コトリ" = "……ごめん、私たちはここまでみたい。"
"22175-37" = "[ns] \"だ、大丈夫！？"
"22175-38-ウタハ" = "……あの瞬間、スピーカー設置するまでは良かったのだが。"
"22175-39-コトリ" = "インドア派には……あ、あまりにも無茶な動きをしてしまい……"
"22175-40-ヒビキ" = "…………もう、指一本動かせない。"
"22175-41-ウタハ" = "見ての通りだ。最後までついていけず面目ないが、私たちはここでお別れだ。"
"22175-42-モモイ" = "ウタハ先輩……。"
"22175-43-モモイ" = "ううん！大丈夫！助けてくれてありがとう！#nさっきのスピーカー！すごくカッコよかった！"
"22175-44-モモイ" = "この先は私たちでどうにか頑張るね！"
"22175-45" = "[ns] \"心配しないで。みんなで必ずアリスを連れ戻してくるよ。\""
"22175-46-ウタハ" = "……そうだね。そこまで言うのなら。"
"22175-47-ウタハ" = "モモイ。"
"22175-48-モモイ" = "ん？"
"22175-49-ウタハ" = "これをあげる。#nいざという時に役に立つはずだよ。"
"22175-50-モモイ" = "これは……"
"22175-51-モモイ" = "うん、分かった。"
"22175-52-ヒビキ" = "それでは、皆さん……この先の事、よろしくお願いします！"
"22175-53-ヒビキ" = "みんな、頑張ってね。"
"22175-54" = "次回;それでも越えられない壁"
