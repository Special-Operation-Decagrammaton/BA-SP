[translation]
"22100-1" = "第10話;残酷な真実（２）"
"22100-2-ネル" = "んなザコで足止めになるわけねぇだろうがよ！"
"22100-3-リオ" = "――さすがネル。AMAS程度では、貴方を止められないというわけね。"
"22100-4-リオ" = "こんな事はしたくなかったけれど――"
"22100-5-リオ" = "……トキ。"
"22100-6-トキ" = "イエス、マム。"
"22100-7-リオ" = "「武装」の使用を許可します。"
"22100-8-トキ" = "承知しました。"
"22100-9-ネル" = "準備完了。「モード2」に移行します。"
"22100-10-トキ" = "はぁ？何をゴチャゴチャと――"
"22100-11-ミドリ" = "あれ？服が……"
"22100-12" = "[ns] \"……「姿」が変わった？\""
"22100-13-トキ" = "……！"
"22100-14-ネル" = "そっちか！？"
"22100-15-ネル" = "逃すか……！"
"22100-16-ネル" = "チッ、クソ……当たんねぇ……"
"22100-17-ミドリ" = "あ、あっという間に消えちゃった……。"
"22100-18" = "てめぇ、一体どこに………"
"22100-19-ユズ" = "ネル先輩、後ろ……！"
"22100-20-トキ" = "……何？"
"22100-21-ネル" = "ぐあっ！！？"
"22100-22" = "[s] \"ネルがあっという間に……\""
"22100-23-ユズ" = "気づいたら……突然、現れて……"
"22100-24-ミドリ" = "あ、あうぅ………"
"22100-25-ネル" = "クソッ！離せ！？ぶっ壊されてぇのか！？"
"22100-26-トキ" = "そうやって暴れたら、曲がってはいけない方向に腕が曲がりますよ、先輩。"
"22100-27-トキ" = "みなさんも、下手に動かないでくださいね。#n無駄な抵抗はおすすめしません。"
"22100-28-ユズ" = "……うっ！"
"22100-29-ミドリ" = "……！"
"22100-30" = "[ns] \"それは、一体……。\""
"22100-31-リオ" = "私の作った特殊武装よ。"
"22100-32-リオ" = "――こんな所で出すつもりはなかったのだけれど。"
"22100-33-リオ" = "さあ、AMAS。#nアリスを回収しなさい。"
"22100-34-ユズ" = "！！"
"22100-35-ミドリ" = "ちょ、ちょっと待っ……！"
"22100-36-リオ" = "下手に動かない方がいい。"
"22100-37-リオ" = "無関係な子を傷つけたくない。"
"22100-38-ミドリ＆ユズ" = "（ビクッ！）"
"22100-39" = "[ns] \"やめて、リオ。\""
"22100-40-リオ" = "――それは私のセリフよ。"
"22100-41-リオ" = "私も対立などしたくないわ。"
"22100-42-リオ" = "貴方と敵対する気も、憎まれる気もない。"
"22100-43-リオ" = "むしろ、貴方に聞きたいくらい。"
"22100-44-リオ" = "こういった事態に於いて、シャーレの先生、"
"22100-45-リオ" = "大人である貴方が真っ先に動くべきなのではなくて？"
"22100-46" = "[s] \"……それは、どういう？\""
"22100-47-リオ" = "子供より感情に支配されず、#n冷静に状況を判断できる――"
"22100-48-リオ" = "そういった大人である貴方が動くべきだったのでは？"
"22100-49" = "[s] \"生徒を傷つけるなんて………。\""
"22100-50-リオ" = "――いつまでそんな寝言を吐き続けるつもりなの！"
"22100-51" = "[s] \"……！！\""
"22100-52-リオ" = "――勘違いしないでちょうだい、先生。"
"22100-53-リオ" = "「アレ」は生命体ではないの――貴方が背負うべき生徒ではない。"
"22100-54-リオ" = "もし、そう感じるのであれば、それは「エライザ効果」に過ぎない。"
"22100-55-リオ" = "「アレ」はこの世界を終焉へと至らせる恐るべき兵器。"
"22100-56-リオ" = "[ruby=アリス]アレ[/ruby]とキヴォトスの全生徒を秤にかけろと問われたら、答えは明白でしょう？"
"22100-57-リオ" = "……それでもなお、貴方が動かないというのなら。"
"22100-58-アリス" = "アリスのヘイローは私の手で破壊する。#n準備は既に整っているわ。"
"22100-59-アリス" = "……。"
"22100-60-リオ" = "違う……。"
"22100-61-リオ" = "違うよ！アリスちゃんは兵器なんかじゃない！"
"22100-62-リオ" = "アリスちゃんは……勇者だよ！#nだって――"
"22100-63" = "アリスちゃんは、光の剣を……勇者の証である「スーパーノヴァ」を持っているもの！"
"22100-64-リオ" = "光の剣……エンジニア部が作ったあのおもちゃ？"
"22100-65-リオ" = "そう……貴方たちがそう言うのなら……"
"22100-66-リオ" = "そうね。"
"22100-67" = "[ns] \"スーパーノヴァの電源が……消えた？\""
"22100-68-ミドリ" = "……！"
"22100-69-リオ" = "これでいいかしら？"
"22100-70-リオ" = "光の剣はもうないわ。"
"22100-71-リオ" = "これで証明は終わり。"
"22100-72-アリス" = "アリスの、剣が……ゆうしゃの、あかしが………"
"22100-73-アリス" = "あ、う……うぅ……"
"22100-74-アリス" = "ミドリ……ユズ………"
"22100-75-トキ" = "くそっ！離せ！"
"22100-76-トキ" = "おい、チビ！じっとしてないで、反撃しろよ！"
"22100-77-トキ" = "………"
"22100-78-アリス" = "ネル先輩…………"
"22100-79-アリス" = "先生…………"
"22100-80" = "[s] \"……アリス。\""
"22100-81-アリス" = "……！！"
"22100-82-アリス" = "…………モモイ。"
"22100-83-アリス" = "ぜんぶ……アリスが、いるから……？"
"22100-84-アリス" = "アリスが「魔王」だから……おきた、ことですか？"
"22100-85-リオ" = "……。"
"22100-86-アリス" = "アリスが……ここにいたら……#n同じことが……"
"22100-87-アリス" = "…………"
"22100-88-アリス" = "…………アリスが。"
"22100-89-アリス" = "………………アリスが、勇者じゃないなら……。"
"22100-90-アリス" = "………そう、ですね。"
"22100-91" = "[ns] \"アリス……？\""
"22100-92-アリス" = "はい……アリス、すべて理解しました。"
"22100-93-アリス" = "…………アリスが消えるとします。"
"22100-94-ミドリ" = "ダメ！アリスちゃん！"
"22100-95-ユズ" = "アリ、ス……ちゃん……。"
"22100-96-ネル" = "なっ……チビ、てめぇ……！"
"22100-97" = "[ns] \"その必要はないよ、アリス。\""
"22100-98-アリス" = "いいえ、大丈夫です。"
"22100-99-アリス" = "アリスは……先生に怪我させたくないです。"
"22100-100-アリス" = "アリスは……。"
"22100-101-アリス" = "ミドリもユズも、ネル先輩も、他のみんなも……。"
"22100-102-アリス" = "怪我、させたくないです。"
"22100-103-アリス" = "……モモイが、アリスのせいで怪我したとき……胸がとても痛かったです。"
"22100-104-アリス" = "どうして……なんでこんな事になってしまったのか、アリスにはよく分かりません。"
"22100-105-アリス" = "でも、それでも……その話を、聞いて……やっと、理解しました。"
"22100-106-アリス" = "すべては……アリスのせいで起きたということを……"
"22100-107-アリス" = "アリスがこのままずっといたら……"
"22100-108-アリス" = "いつか……皆が怪我してしまう。"
"22100-109" = "[s] \"リオの言葉を鵜呑みにしなくていい。ちゃんと話し合おう、アリス。\""
"22100-110-アリス" = "先生……心配しなくても大丈夫です。"
"22100-111-アリス" = "大丈夫です。アリスは生命体ではないのですから。"
"22100-112-アリス" = "アリスは、ミレニアムの生徒ではないから。#nいなくなっても、大丈夫です。"
"22100-113-アリス" = "アリスは……勇者、ではないから………"
"22100-114-アリス" = "アリスは………だい……じょうぶです。"
"22100-115-アリス" = "先生、今までありがとうございました。"
"22100-116-アリス" = "みんな、アリスと一緒に冒険してくれて、ありがとうございました。"
"22100-117-アリス" = "アリスは………"
"22100-118-アリス" = "今まで本当に幸せ……でした。"
"22100-119-リオ" = "それでは――失礼するわ。"
"22100-120-リオ" = "もしも――先生が、私の行動や言動に傷ついたのであれば……"
"22100-121-リオ" = "すべてが終わった後、改めて謝罪をさせてちょうだい。"
"22100-122-リオ" = "では、また――"
"22100-123" = "（リオとアリスが完全にその場を去るまで、）"
"22100-124" = "（AMASに制圧された私たちは、指一本動かす事もできず――）"
"22100-125" = "（そうして、ただただ無力感に打ちひしがれる私たちの前から――）"
"22100-126" = "（――アリスは、姿を消した）"
"22100-127" = "次回;そんな事どうでもいいの！"
