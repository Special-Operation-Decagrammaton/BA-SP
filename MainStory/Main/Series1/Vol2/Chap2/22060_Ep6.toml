[translation]
"22060-1" = "第6話;不思議な機械（１）"
"22060-2" = "（ある日、ヴェリタスから連絡が届き――）"
"22060-3" = "[ns] \"急にどうしたの？\""
"22060-4-コタマ" = "先生聞いて！「世紀の大発見」があって！！"
"22060-5-マキ" = "それがすっごくてさ……！！キヴォトス史に残るような歴史的な発見かもしれないの！！"
"22060-6" = "[s] \"……歴史的な発見？\""
"22060-7-ハレ" = "マキ、いくらなんでもそれは大げさ。"
"22060-8-コタマ" = "ハレの言う通りです。#n変わったものを発見したのは事実ですが……。"
"22060-9-コタマ" = "普段、ミレニアムで見つかる物の大半がガラクタですから、#n統計的にコレもそうである可能性が高いです。"
"22060-10-マキ" = "も～！みんなちょっとくらいはロマンを持った方がいいんじゃない？#n色んな人に聞いても見たことないって言ってたし。"
"22060-11-ハレ" = "まあ、そうだね……。"
"22060-12-コタマ" = "マキの言い分にも一理ありますが……。"
"22060-13" = "[s] \"いったい何を見つけたの？\""
"22060-14-ハレ" = "うーん……ちょっと言葉だと説明しづらい。"
"22060-15-コタマ" = "マキの言う通り、今まで見たことがないような物体で……"
"22060-16-コタマ" = "私たちでは判断が難しいため、先生に直接お越し願おうかと。"
"22060-17-ハレ" = "そういう訳なんだけど……先生、時間大丈夫？"
"22060-18" = "[s] \"大丈夫だよ。\""
"22060-19-ハレ" = "じゃあ、ヴェリタスの部室で待ってるね。"
"22060-20-マキ" = "やったー！先生来るならパーティーしよ！"
"22060-21-コタマ" = "はい。ピザを注文するとしましょう。"
"22060-22-ハレ" = "いや、大げさすぎ……"
"22060-23" = "（そうしてヴェリタスの部室に到着すると――）"
"22060-24-アリス" = "あっ！アリス、先生を発見しました！"
"22060-25" = "……あれ？"
"22060-26-ミドリ" = "こ、こんにちは……。"
"22060-27-モモイ" = "やっほー先生！"
"22060-28-モモイ" = "……どうしてここに？"
"22060-29" = "[s] \"やほ。ヴェリタスに呼ばれてね……ゲーム開発部も？\""
"22060-30-モモイ" = "うん！マキが面白いもの見つけたらしくて！"
"22060-31-ミドリ" = "もしかしたら、何かインスピレーションをもらえるんじゃないかと思って。"
"22060-32-アリス" = "重要なイベントが発生するかもしれないので、今日はユズもいます！"
"22060-33-ユズ" = "はい……い、いいアイデアに繋がるなら……#nでも、こ、ここまで来るのは……ちょっと……"
"22060-34-ユズ" = "……すごく、大変だったけど……。"
"22060-35-モモイ" = "あとちょっとだよ、ユズ！"
"22060-36-ミドリ" = "うん、頑張ろう。"
"22060-37-アリス" = "ユズが倒れないよう、アリスがしっかり支えます！"
"22060-38-アリス" = "み、みんな、ありがとう……。"
"22060-39" = "[s] \"じゃあ、入ろうか？\""
"22060-40-マキ" = "はーい！どうぞー！"
"22060-41-モモイ" = "やっほー！お邪魔します！"
"22060-42-モモイ" = "途中で合流したパーティーメンバー、先生も一緒です。"
"22060-43-ハレ" = "ちょうど間に合ったみたいだね。"
"22060-44-マキ" = "やっほ～！久しぶりだね。"
"22060-45-コタマ" = "（ぺこり）"
"22060-46" = "[s] \"やっほ～。\""
"22060-47-モモイ" = "それで、ハレ先輩。例のブツって？"
"22060-48-ハレ" = "ああ、それなら……"
"22060-49-ハレ" = "これ。"
"22060-50" = "（ハレが見せてくれたのは、奇妙な形をしたロボットだった）"
"22060-51" = "（よく見ると、部室のあちこちに、合計5体のロボットが置かれている）"
"22060-52" = "[s] \"これは……どこにあったの？\""
"22060-53-コタマ" = "すべてミレニアム学区の郊外で発見されたものです。"
"22060-54-マキ" = "これで全部じゃなくて、少なくともまだあと20体はあったよ！"
"22060-55" = "[s] \"なんだか外見が……。\""
"22060-56-マキ" = "なんか、深海魚みたいな見た目してるよね。"
"22060-57-ハレ" = "まぁ、ロボットっぽくはあるけど……。"
"22060-58-マキ" = "でもちょっと変だよね？#nミレニアムで作ったドローンの中に、こんな形状のはなかったし。"
"22060-59-コタマ" = "かなり個性的な見た目です。"
"22060-60-ハレ" = "うーん、個性的というか……なんか……。"
"22060-61" = "[ns] （奇怪な感じというか……）"
"22060-62-モモイ" = "び、びっくりしたー！なんか想像してたのと全然違うんだけど！"
"22060-63-無名の守護者" = "コメディー映画だと思って見てたら急にホラーになったみたいな……！#nなにこれ！！"
"22060-64-ユズ" = "これって、本当にミレニアムで作られたロボット……なのかな？"
"22060-65-ミドリ" = "ハレ先輩、これって今どんな状態なんですか？"
"22060-66-ミドリ" = "頑張ったら起動させる事ってできたり……"
"22060-67-アリス" = "…………。"
"22060-68-ハレ" = "私たちの方でも一通り調べてみたんだけど。"
"22060-69-マキ" = "結構きれいだったから、起動できないかなーって思ったんだけどね。"
"22060-70-マキ" = "でも、結局何も見つけられなかったんだ。"
"22060-71" = "[s] \"というと……？\""
"22060-72-コタマ" = "調べた結果、電源ボタンはおろか接続ポートすら見つかりませんでした。"
"22060-73-ハレ" = "それ以前に、表面に継ぎ目すらない。"
"22060-74-ハレ" = "開ける事ができないから、起動しない理由がハードなのかソフトなのか――"
"22060-75-ハレ" = "そもそも、本当に故障なのかさえも分からなくて……。"
"22060-76-マキ" = "だから先生を呼んだんだ。"
"22060-77-コタマ" = "はい。もし危険物であれば、シャーレにご協力いただこうと思いまして。"
"22060-78-ハレ" = "そういう意味だと、ゲーム開発部も呼んだのはちょっと違う気がするけどね。"
"22060-79-マキ" = "あははっ。まあ、ついでってことで。#nこういうのはみんなで見た方が面白いし？"
"22060-80-アリス" = "…………。"
"22060-81-モモイ" = "どう、先生？何か分かったりする？"
"22060-82" = "[s] \"……うーん、分からないかも。\""
"22060-83-マキ" = "やっぱダメかぁ。#n先生ならもしかしたら……って思ったんだけど。"
"22060-84-マキ" = "部長に聞くしかないのかなぁ……。#nたしか、オカルトとかそういうのが好きだったし。"
"22060-85-マキ" = "オカルトかぁ……。"
"22060-86-マキ" = "もしくは副部長とか？#n副部長なら情報とか見つけてきてくれそうなのになぁ～！"
"22060-87-マキ" = "今ここにいない人の事を話しても仕方ないですよ。"
"22060-88-ハレ" = "ここにいないっていうか、部長はそもそも全然来てないし。"
"22060-89-アリス" = "……あ。"
"22060-90-モモイ" = "どしたの？何かあった？"
"22060-91-アリス" = "アリス……"
"22060-92-アリス" = "アリス…………見たことあります。"
"22060-93-ユズ" = "アリスちゃん……？"
"22060-94-アリス" = "これ、は……。"
"22060-95-モモイ" = "え！？何！？電源入った！？"
"22060-96-ハレ" = "えっ！？"
"22060-97-マキ" = "え？なになに！？"
"22060-98-ミドリ" = "この音……"
"22060-99-ミドリ" = "お姉ちゃん、ゲーム機の音出てるよ？"
"22060-100-ミドリ" = "え？"
"22060-101-モモイ" = "あ、本当だ。#n今まで起動しなかったのに……どうしてだろ。"
"22060-102-ユズ" = "ま、待って……アリスちゃんの様子が……おかしい。"
"22060-103-ミドリ" = "アリス……？"
"22060-104-アリス" = "………………"
"22060-105" = "＜＜＜私の…………＞＞＞"
"22060-106" = "[ns] \"アリス？\""
"22060-107" = "＜＜＜私の大切な…………＞＞＞"
"22060-108-アリス" = "…………起動開始。"
"22060-109-モモイ" = "……アリス？"
"22060-110-マキ" = "わわっ！なんで急に動くの！？#nコタマ先輩、何かした！？"
"22060-111-コタマ" = "マキ、違います。私は何も……。"
"22060-112-ハレ" = "……気をつけて！何か様子がおかしい！"
"22060-113" = "＜＜＜私の大切な…………よ。＞＞＞"
"22060-114" = "[ns] \"一体、これは……\""
"22060-115-無名の守護者" = "……コードネーム「AL-1S」起動完了。"
"22060-116-アリス" = "プロトコルATRAHASISを実行します。"
"22060-117" = "[ns] \"……！\""
