[translation]
"22070-1" = "第7話;不思議な機械（２）"
"22070-2-ハレ" = "ゲホッゲホッ………"
"22070-3-マキ" = "い、一体何が起きてるの！？"
"22070-4-コタマ" = "突然眠っていたロボットが起動……。"
"22070-5-コタマ" = "そして爆発が……あれは、明確な攻撃です。"
"22070-6-ハレ" = "攻撃命令を出してたのは……"
"22070-7-アリス" = "……有機体の生存反応を確認。"
"22070-8-アリス" = "失敗を確認しました。"
"22070-9" = "[s] \"アリス……！\""
"22070-10-ユズ" = "あ、アリスちゃん！？"
"22070-11-アリス" = "……プロトコルを再実行します。武装のリロード開始。"
"22070-12-コタマ" = "また……レールガンの充電を始めました！"
"22070-13" = "[ns] \"……早く止めないと！\""
"22070-14" = "[ns] \"みんな、アリスをお願い……！\""
"22070-15-マキ" = "アリスちゃん！！ごめん！！！"
"22070-16-マキ" = "妨害を確認、充電失敗。"
"22070-17-アリス" = "よし！止まった！"
"22070-18-マキ" = "……妨害要素を排除します。"
"22070-19-アリス" = "……え？"
"22070-20-ハレ" = "マキ！危ない！"
"22070-21-マキ" = "……！！"
"22070-22-コタマ" = "マキ！！"
"22070-23-アリス" = "プロトコルを再実行します。武装のリロード開始。"
"22070-24-ユズ" = "あ、ああ……"
"22070-25-ミドリ" = "い、一体なに……アリスちゃん！ねえ、アリスちゃん！"
"22070-26" = "[ns] \"くっ！アリス……！\""
"22070-27" = "[ns] （一体……どうすれば……！）"
"22070-28-アリス" = "発――"
"22070-29-？？？" = "おい、チビ。#nそこまでだ。"
"22070-30-アリス" = "………！！"
"22070-31-ネル" = "大人しく寝てろ。"
"22070-32-ネル" = "こいつら、ここにもいやがったのか……。"
"22070-33-ネル" = "はぁ……片付けるか。"
"22070-34-ネル" = "おい、行くぞ。"
"22070-35-アカネ" = "はーい！部長！"
"22070-36-カリン" = "支援する。"
"22070-37-アカネ" = "ええ、後方はお任せください。"
"22070-38-アスナ" = "これで終わり！"
"22070-39-カリン" = "作戦終了。"
"22070-40-アカネ" = "お疲れ様でした。"
"22070-41-ネル" = "……これでいいか？先生。"
"22070-42" = "[s] \"ネル、みんな！ありがとう！\""
"22070-43-ネル" = "んで、何があったんだ？"
"22070-44-ネル" = "すげぇ音がしたから来てみたら、部室がボロボロじゃねぇか。"
"22070-45-ネル" = "それに、チビのあの姿は一体……。"
"22070-46" = "[s] \"ごめん、ちょっと待ってね……みんな大丈夫！？\""
"22070-47-コタマ" = "うっ……な、なんとか……"
"22070-48-マキ" = "うえぇぇ……内臓飛び出ちゃうかと思ったぁああ……。"
"22070-49-コタマ" = "軽口が言えるのだから、とりあえず無事ですね。"
"22070-50" = "[s] \"それなら良かった……。\""
"22070-51-ミドリ" = "先生……！先生！"
"22070-52-ユズ" = "あ、ああ、モ、モモイ………"
"22070-53" = "[s] \"ミドリ、ユズ……どうしたの……？\""
"22070-54-ミドリ" = "お姉ちゃんが……お姉ちゃんが……！"
"22070-55-ネル" = "……。"
"22070-56" = "次回;崩れた日常"
