[translation]
"22110-1" = "第11話;そんな事どうでもいいの！"
"22110-2-ハレ" = "……結局、会長がアリスを連れて行ったんだね。"
"22110-3-マキ" = "ねぇ……これって結構ヤバいんじゃない……？"
"22110-4-コタマ" = "はい、非常事態です。"
"22110-5-カリン" = "では、リオ会長が部長以外を呼び出さなかったのは……。"
"22110-6-アカネ" = "おそらく、最初からリーダーが裏切ると想定していたのだろう。"
"22110-7-カリン" = "ひどい！アリスちゃんを連れてった上にリーダーの事もいじめるなんて！"
"22110-8-ネル" = "…………はあ。"
"22110-9-アカネ" = "……部長？"
"22110-10" = "[s] \"ネル……？まだどこか痛む……？\""
"22110-11-ネル" = "眼の前であいつが連れて行かれるのを……#nあたしは、ただ見てる事しかできなかった……。"
"22110-12-アカネ" = "それは……。"
"22110-13-カリン" = "リーダー、気に病む必要はない。正面から戦ったわけじゃないんだろう？"
"22110-14-アカネ" = "そうだよ！あんなの無効だよ！無効！"
"22110-15-ネル" = "……お前らは、任務が失敗してもそんな言い訳をするのか？"
"22110-16-アカネ" = "それは……。"
"22110-17-ネル" = "あたしを物ともしないでアリスを連れて行ったアイツ……"
"22110-18-ネル" = "アイツは、自分の事を「コールサインゼロフォー」って言ってた。"
"22110-19-ネル" = "トキっつったっけ？#n――アカネ、知ってるか？"
"22110-20-アカネ" = "……そうですね。"
"22110-21-アカネ" = "存在は、知っておりました。"
"22110-22-アカネ" = "コールサインゼロフォー。#n「C&C」所属でありながらリオ会長専属のメンバー。"
"22110-23-アカネ" = "いわば、リオ会長のボディーガード……。"
"22110-24-アカネ" = "ですが、私も実際に対面したのは初めてです……"
"22110-25-アカネ" = "まさか……会長が彼女を使ってまでこのような事をしてくるとは……"
"22110-26-アカネ" = "それに、奇襲とはいえ部長を圧倒するだなんて……。"
"22110-27-ネル" = "……あいつ、なんか変なモン使ってやがった。"
"22110-28" = "[s] \"……リオがくれた「武装」だと言ってたね。\""
"22110-29-ネル" = "なあ、先生。"
"22110-30-ネル" = "あのチビはどうして……"
"22110-31-ネル" = "……ヘイローを壊すなんて話をされたのに、リオについて行ったんだ？"
"22110-32-ネル" = "言葉の意味を理解して、納得した上でついて行ってるのか？"
"22110-33-ネル" = "なぁ……ゲームがちょっとできる程度のチビに、なんでリオはあんな事を言ったんだ？"
"22110-34-ネル" = "あたしだけが理解できてないのか？#nなぁ、教えてくれよ……一体これは何なんだ？"
"22110-35-ミドリ" = "ネル先輩……。"
"22110-36" = "[s] \"とりあえず……状況を整理しよう。\""
"22110-37" = "（モモイの意識が戻らない間に、アリスがリオに誘拐され――）"
"22110-38" = "（そして、リオはアリスのヘイローを破壊することが目的だと私たちに告げた）"
"22110-39-リオ" = "つまり、「アリス」。#n貴女は――"
"22110-40-リオ" = "この世界を滅ぼすために生まれた「魔王」なのよ。"
"22110-41-リオ" = "ああ……分かりづらかったかしら？"
"22110-42-リオ" = "つまり――貴女のヘイローを破壊すれば解決する、という事よ。"
"22110-43-ミドリ" = "先生、アリスちゃんは……#n会長の言う通り、本当に……"
"22110-44-ミドリ" = "……「魔王」なんでしょうか？"
"22110-45" = "[s] \"ミドリ……\""
"22110-46-ユズ" = "わたし………"
"22110-47-ユズ" = "わたし、には……"
"22110-48-ユズ" = "よく……わからない……"
"22110-49-ユズ" = "アリスちゃんの気持ちを、ちゃんと聞いて、お話したいよ……。"
"22110-50-ユズ" = "アリスちゃんは、そんなんじゃないって……。#n「魔王」なんかじゃないって……会長を、説得したい……。"
"22110-51-ユズ" = "わたし、は……。"
"22110-52-ユズ" = "わたし達、は………"
"22110-53-ハレ" = "先生、私たちはどうすればいいかな？"
"22110-54" = "[ns] \"…………。\""
"22110-55-モモイ" = "モモイ………………"
"22110-56-モモイ" = "降臨！"
"22110-57-ミドリ" = "お姉ちゃん！？"
"22110-58" = "[s] \"モモイ……！身体は大丈夫！？傷は！？\""
"22110-59-モモイ" = "身体なら大丈夫！ぐっすり寝たから体力も全快！"
"22110-60-モモイ" = "そう……今の私は、棚からポーションを手に入れ、#n次ステージの推奨レベル以上にレベルを上げ終えた戦士……！"
"22110-61-モモイ" = "怖いものなんて何もない、超強化女子生徒状態だよ！"
"22110-62-モモイ" = "おねえちゃん……"
"22110-63-ミドリ" = "お姉ちゃん……アリスちゃん……アリスちゃんが！"
"22110-64-モモイ" = "うわっ！！？なになに！？"
"22110-65-モモイ" = "ミドリがアンチコメを読んだ翌日の「一日限定甘えん坊モード」になってるんだけど！？なんで！？"
"22110-66-ユズ" = "モモイ、アリスちゃんが……"
"22110-67-モモイ" = "このおバカさんが！！"
"22110-68-ユズ" = "お、お姉ちゃん？"
"22110-69-ユズ" = "モモイ……？"
"22110-70-モモイ" = "正直、難しい事はよく分かんないけど……！"
"22110-71-モモイ" = "みんなの話を聞いてたら胸がぎゅっとしちゃって……#nあんまり言葉がまとまらないんだけどさ……"
"22110-72-モモイ" = "でも1つだけ確かなことはあるよ！"
"22110-73-ネル" = "……確かなこと？"
"22110-74-モモイ" = "私たちがこの事態に納得できてないって事！！"
"22110-75-モモイ" = "正直、アリスが「魔王」だろうがなんだろうが、そんな事どうでもいいの！"
"22110-76-モモイ" = "私はアリスとこのままお別れなんて嫌だよ！"
"22110-77-モモイ" = "アリスの最後の言葉、別れの挨拶でもなんでも無いじゃない！"
"22110-78-モモイ" = "まともなエンディングですらない！最悪だよ！"
"22110-79-モモイ" = "だから私はアリスを連れ戻したい！連れ戻しに行くよ！#nみんな、そうじゃないの！？"
"22110-80-ミドリ" = "お姉ちゃん……。"
"22110-81-ユズ" = "モモイ……。"
"22110-82-ハレ" = "……うん、そうだね。"
"22110-83-モモイ" = "おい、チビ。"
"22110-84-モモイ" = "わっ！？な、なに……ネル先輩？"
"22110-85-ネル" = "あんた――"
"22110-86-ネル" = "なかなか、いい事言うじゃねぇか！"
"22110-87-モモイ" = "う、うん……？"
"22110-88-ネル" = "あんたの言う通りだ。ゴチャゴチャ考える必要はねぇ。#n殴られたら殴り返せばいい。"
"22110-89-ネル" = "奪われたモンがあんなら、取り戻せばいい。単純明快だ。"
"22110-90-ネル" = "なぁ、お前たちはどうだ？#nアカネ、アスナ、カリン。"
"22110-91-アカネ" = "ふふ……言葉にする必要がありますか？"
"22110-92-アカネ" = "それが部長の決定なら。"
"22110-93-カリン" = "ついてくよ～♪"
"22110-94-モモイ" = "……先生、"
"22110-95-モモイ" = "お願い！私たちに力を貸して！"
"22110-96" = "[ns] \"モモイ……みんな……。\""
"22110-97" = "[ns] \"分かった。一緒にアリスを連れ戻す方法を考えようか。\""
"22110-98" = "次回;作戦会議"
