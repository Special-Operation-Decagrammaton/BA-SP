[translation]
"22180-1" = "第18話;それでも越えられない壁"
"22180-2-トキ" = "……！"
"22180-3" = "遅ぇ、遅ぇ、遅ぇ……"
"22180-4" = "おせぇんだよ、後輩！"
"22180-5-トキ" = "（スピードは明らかに「武装」を使う私の方が上……なのに）"
"22180-6-トキ" = "（データは間違っていないはず――#n　リオ様の命令通り、戦場の地形を変更したというのに）"
"22180-7-トキ" = "（それでも勝敗がつかないというのは……まさか、データが間違っている？）"
"22180-8-トキ" = "（いや、これはそういう次元の問題では……）"
"22180-9-トキ" = "彼女の射程に入るたびに、データが……#nリアルタイムで更新されている……！？"
"22180-10-トキ" = "（間合いを詰められると……危険……！）"
"22180-11-トキ" = "くっ……！！"
"22180-12-トキ" = "これほどの超長距離からの……狙撃……まさか……！"
"22180-13-カリン" = "こちらコールサインゼロツー。"
"22180-14-カリン" = "……先輩の背中は任せてくれ。"
"22180-15-アスナ" = "あれ？道に迷ってたと思ったんだけどー……意外とそんな事なかった？"
"22180-16-アカネ" = "それはアスナ先輩が幸運だからですよ……普通は抜け出せません。"
"22180-17-トキ" = "要塞都市の迷路を……いとも容易く……！？"
"22180-18-トキ" = "そんな事、確率的にあり得ない……。"
"22180-19-ネル" = "ケッ！偉そうに分断だの何だの御託を並べてたクセによぉ。"
"22180-20-ネル" = "結局言葉だけだったのか？あぁ？"
"22180-21-トキ" = "……。"
"22180-22-リオ" = "トキ、一旦退きなさい。"
"22180-23-トキ" = "……！"
"22180-24-トキ" = "リオ様、私は……。"
"22180-25-リオ" = "貴女を責めているわけではないわ。#nヴェリタスの干渉で、アバンギャルド君の制御権が奪われてしまった。"
"22180-26-リオ" = "これはあくまで、私の予測不足による失敗……#nまずは撤退して、状況を立て直しましょう。"
"22180-27-トキ" = "……イエス、マム。"
"22180-28-トキ" = "――現場から離脱します。"
"22180-29-リオ" = "ハァ！？ざけんなコラ！"
"22180-30-ネル" = "おい！逃げんじゃねえ！！"
"22180-31-アスナ" = "えっ、なになに？トキちゃん行っちゃったの？"
"22180-32-アスナ" = "……逃してしまったようです。"
"22180-33-カリン" = "あー！クソッ！#nこの場でケリつけたかったのに！"
"22180-34-アカネ" = "仕方ないですよ部長、想定外の交戦でしたし……"
"22180-35-アカネ" = "戦況そのものが変わってしまいましたから。"
"22180-36-アカネ" = "陽動作戦は一旦中断して……まずは先生と合流しましょう。"
"22180-37-アカネ" = "この作戦は、アリスちゃんを連れ出すためのものですからね。"
"22180-38-アカネ" = "そうですよね、部長？"
"22180-39-ネル" = "うっ……。"
"22180-40-ネル" = "……あぁ、わ～った。わ～ったって。"
"22180-41-ネル" = "うし、行くか。"
"22180-42" = "[ns] \"えっと、ここを曲がったら……次はどこに向かえばいい？\""
"22180-43" = "右に曲がって、直進！そこが目的地だよ。"
"22180-44" = "よーし、行っくよ～！"
"22180-45" = "ここにアリスが……！"
"22180-46" = "[ns] \"ここが要塞都市「エリドゥ」の中央タワー……。\""
"22180-47-ユズ" = "アリスちゃんが……ここに……。"
"22180-48-モモイ" = "……行こう！"
"22180-49-ミドリ" = "うん！"
"22180-50-モモイ" = "え？"
"22180-51-アスナ" = "あっ！ご主人様とみんな～！#nやほやほ！"
"22180-52-カリン" = "皆さん到着されていたのですね。"
"22180-53-モモイ" = "先輩！"
"22180-54" = "[s] \"ネル達がここにいるという事は……トキは？\""
"22180-55-アカネ" = "……ぐっ！！"
"22180-56-カリン" = "あはは、それがね～"
"22180-57-カリン" = "……はぁ。"
"22180-58-アカネ" = "残念ながら、逃げられてしまいました。"
"22180-59-ネル" = "あとちょっとでぶちのめせたのによ！"
"22180-60" = "（その後、トキとの戦いについて、アカネから一部始終を聞いた）"
"22180-61" = "[ns] \"さっきの地震はそれだったんだね……。\""
"22180-62-アカネ" = "ええ……そのせいで陽動自体の意味がなくなってしまったわけです。"
"22180-63" = "[s] \"地形が変わるなんて、普通は想像できないから仕方ないよ……。\""
"22180-64-カリン" = "先生の方も、何か起きていたように見えるが……。"
"22180-65-アスナ" = "あ、たしかに。一緒にいたエンジニア部は？"
"22180-66-ミドリ" = "う～ん、何か起きていたというか……。"
"22180-67-ミドリ" = "たしかに大変といえば大変だったけど、その……。"
"22180-68" = "[s] \"強かったね、アバンギャルド君……。\""
"22180-69" = "[ns] \"チヒロ、このタワーにアリスがいるの？\""
"22180-70-チヒロ" = "その……会長が言ってたんだよね？#nアリスのヘイローを破壊するって。"
"22180-71-チヒロ" = "そのためには、相応の施設が必要なんじゃないかな。"
"22180-72-チヒロ" = "そして、ここエリドゥは全ての電力がこのタワーに集中するような構造になっている。"
"22180-73-チヒロ" = "これほどの規模の施設が、会長の手によって作られた理由……そして、会長の動機……#n答えは明白だろうね。"
"22180-74-モモイ" = "本当に……アリスがあそこに……"
"22180-75-ネル" = "つまり、後はこのバカデカいタワーを登りゃあいいんだろ？"
"22180-76" = "[s] \"そうだね、あとは登るだけ……。\""
"22180-77-チヒロ" = "ただ、残念だけど――"
"22180-78-チヒロ" = "あの会長が、門番を用意しないわけがないよね。"
"22180-79-トキ" = "お待ちしておりました、先輩方、先生。"
"22180-80" = "[s] \"やっぱり、トキが門番なんだね……。\""
"22180-81-アスナ" = "あっ！また会えたね～！トキちゃんやほ！"
"22180-82-ネル" = "あぁん？んだよ、さっきは尻尾巻いて逃げ出したくせに……"
"22180-83-ネル" = "一体どのツラ下げてあたしらの前に現れてんだ？"
"22180-84-リオ" = "作戦を変更したのは、貴女たちだけだと思って？"
"22180-85-ネル" = "……リオ。"
"22180-86-リオ" = "貴女たちが来ることを見越していくつもの計画を準備してきたけれど――"
"22180-87-リオ" = "まさか、防衛システムをすべて壊して、ここまで到達するなんて……。"
"22180-88-リオ" = "変数として機能し、私の計算を狂わせたのも、すべては――"
"22180-89-リオ" = "シャーレの先生、貴方が関わったからかしら？"
"22180-90" = "[s] \"…………リオ。\""
"22180-91-リオ" = "それならそれで構わないのよ。#n貴方が規格外の力を見せるのなら、こちらもそれ相応の切り札を出すまで。"
"22180-92-リオ" = "トキ。現時刻をもって[ruby=Abi-Eshuh]「アビ・エシュフ」[/ruby]の使用を許可するわ。"
"22180-93-トキ" = "……リオ様、それは。"
"22180-94-リオ" = "ええ、本来は「名もなき神々の王女」との戦闘用だけど……仕方ないわ。"
"22180-95-リオ" = "ここでこの子たちを阻止できなければ、すべてが無に帰してしまうのだから。"
"22180-96-トキ" = "……イエス、マム。"
"22180-97-トキ" = "パワードスーツシステム「アビ・エシュフ」へ移行します。"
"22180-98" = "[s] \"アビ……エシュフ？\""
"22180-99-ミドリ" = "この音は……。"
"22180-100-チヒロ" = "……ッ！#n上！"
"22180-101" = "呼出信号確認。"
"22180-102-みんな" = "わ、わぁっ！？一体なにっ！？"
"22180-103" = "パワードスーツシステム[wa:1000]「アビ・エシュフ」[wa:1500]起動"
"22180-104" = "戦闘、[wa:1500]開始します。"
"22180-105" = "[ns] \"………来る！\""
