[translation]
"22040-1" = "第4話;～アリスと導かれる者たち～（１）"
"22040-2" = "（アリスと一緒に歩いていると……）"
"22040-3-？？？" = "いち、に、いち、に。"
"22040-4-アリス" = "あっ！"
"22040-5" = "[s] \"どうしたの？\""
"22040-6-？？？" = "いち、に、#nいち、に。"
"22040-7-アリス" = "先生、どこかでただならぬ声が聞こえてきます。"
"22040-8-？？？" = "いち、に、#nいち、に。"
"22040-9" = "[s] \"誰だろう……？\""
"22040-10-アリス" = "これは……"
"22040-11-アリス" = "ハッ……！アリス、分かりました！"
"22040-12-アリス" = "ミレニアムのキャンパスで発生する特殊イベント……。"
"22040-13-アリス" = "「ミレニアム・ランダムエンカウントイベント」の前兆です！"
"22040-14" = "[s] \"ラ、ランダムエンカウント……？前兆……？\""
"22040-15-アリス" = "はい！冒険中に遭遇するフィールドイベントです。"
"22040-16-アリス" = "何が起こるか分かりません。#n先生、油断は禁物です！"
"22040-17-？？？" = "いち、に、#nいち、に。"
"22040-18-？？？" = "いち、に、#nいち、に、いち、に。"
"22040-19" = "[ns] \"い、一体どんなイベントが……！？\""
"22040-20-？？？" = "いち、に、#nいち、に！！"
"22040-21" = "[ns] \"で、出た……！\""
"22040-22" = "あれ？こんにちは。"
"22040-23-スミレ" = "今日も、良い運動日和ですね。"
"22040-24" = "[s] \"す、スミレ……？こ、こんにちは。\""
"22040-25-アリス" = "これはスミレ先輩との遭遇イベントだったんですね！"
"22040-26-アリス" = "スミレ先輩は、今日も「運動冒険」中ですか？"
"22040-27" = "[s] \"「運動冒険」……？\""
"22040-28-スミレ" = "はい。軽くジョギングでもしようかと思いまして。"
"22040-29-スミレ" = "アリスちゃんも「冒険運動」中ですか？"
"22040-30" = "[s] \"「冒険運動」……？\""
"22040-31-スミレ" = "はい！今日は、先生と一緒に見習い勇者の冒険中です！"
"22040-32-スミレ" = "なるほど、今日はトレーナーと一緒に……。"
"22040-33-スミレ" = "毎日運動していて偉いですね。"
"22040-34-アリス" = "冒険は継続が大事ですから！#nサボったらすぐにレベルが下がってしまいます。"
"22040-35-アリス" = "デイリークエストを忘れるのは罪だと、モモイも言っていました。"
"22040-36-スミレ" = "ええ、運動は地道にコツコツ続けるのが肝要です。"
"22040-37-スミレ" = "それに、今日はトレーナーが一緒なのも、とても素晴らしいです。"
"22040-38" = "[s] \"二人はよく会ってるの？\""
"22040-39-アリス" = "はい。スミレ先輩は主なエンカウントイベントの一人です！"
"22040-40-スミレ" = "アリスさんとは、ジョギングしているとよく会うんです。"
"22040-41-スミレ" = "キャンパス内で……。"
"22040-42-アリス" = "スミレ先輩は、「運動冒険」をするアリスの仲間ですからね！"
"22040-43-スミレ" = "ふふ、はい。#nアリスさんは、共に運動する仲間です。"
"22040-44" = "[s1] \"「運動冒険」……って何？\"\n[s2] \"「冒険運動」……って何？\""
"22040-45-スミレ" = "冒険の一種です！"
"22040-46-アリス" = "スミレ先輩は、ジョギングで筋力と素早さ……#nさらに、持久力を上げていると聞きました。"
"22040-47-スミレ" = "ええ、運動しながら身体を鍛えるのは楽しいですから。"
"22040-48-アリス" = "主要ステータスを鍛え、普段からジョギングを続けるその姿勢……"
"22040-49-アリス" = "これこそ立派な勇者の冒険なのです！"
"22040-50-アリス" = "そんな……改めて褒められると照れますね。"
"22040-51" = "[s] \"そ、そうなんだ……。\""
"22040-52-アリス" = "アリスさんは、いつも「冒険？」をすると聞きまして。"
"22040-53-スミレ" = "曰く、冒険の主な目的は、心身を鍛え……"
"22040-54-アリス" = "はい！レベルアップしてHPとMPを増加させるのです！"
"22040-55-スミレ" = "……鍛錬を通じて、できなかった事を克服するのだと言っていました。"
"22040-56-アリス" = "レベルが上がったら新しいスキルを覚えられます！"
"22040-57-アリス" = "なるほど……その心構え、素晴らしいです！"
"22040-58-アリス" = "普段からコツコツと頑張るその姿勢……偉いですね、アリスさん！"
"22040-59" = "[s] \"そ、そうなんだ……？\""
"22040-60" = "[ns] \"なんだか……会話が噛み合ってるような、そうでもないような……。\""
"22040-61-アリス" = "トレーナーと一緒にいるアリスさんを見ていると……なんだか……"
"22040-62-スミレ" = "……私も負けられなくなってきました。"
"22040-63-アリス" = "あっ、アリスもです！#nスミレ先輩に負けないよう、レベル上げを頑張ります！"
"22040-64-スミレ" = "よし……それでは、まずはジョギング20km！参ります！"
"22040-65-スミレ" = "お先に失礼しますね、トレーナー！アリスさん！"
"22040-66" = "[s] \"あ、えっと……頑張って。\""
"22040-67-スミレ" = "いち！に！#nいち！に！"
"22040-68-アリス" = "アリスも負けられません！"
"22040-69-アリス" = "先生、次のクエストに進みましょう！"
"22040-70" = "[s] \"あ、う、うん……。\""
"22040-71" = "（アリスの後を追っていたら、いつの間にかミレニアム郊外に出ていた）"
"22040-72" = "[s3] \"キャンパスの外に出てしまったね……。\"\n[s4] \"アリスの冒険範囲は広いんだね……。\""
"22040-73-アリス" = "はい。アリスの辞書に「止まれ」はありません。"
"22040-74-アリス" = "それに、遠出をしたら、きっと予想外のイベントも起こるはずです！"
"22040-75" = "[s] \"予想外のイベントかぁ……。\""
"22040-76-アスナ" = "あっ！ご主人様とアリスちゃんだ！"
"22040-77-アスナ" = "やっほー、こんにちは～！"
"22040-78" = "[s] \"やっほー！？本当に予想外のイベントに……！？\""
"22040-79-カリン" = "……あれ、先生？#n急にどうしたんだ？"
"22040-80-アスナ" = "あはは！なになに？何かあったー？"
"22040-81" = "[s] \"いや、その……二人とも、あまり見ない格好だと思って。\""
"22040-82-アリス" = "いつもと違う服装……新ジョブへの転職……"
"22040-83-アリス" = "はっ！アリス、気が付きました！#n二人はメイドから新しいジョブ……"
"22040-84-アリス" = "「女子高生」に転職したんですね！"
"22040-85-カリン" = "いや……私も生徒だから。#nこれが普段の格好というか……。"
"22040-86-アリス" = "「女子高生」は強いジョブだとアリスは知っています！#nモモイもよく言っていました。"
"22040-87-アリス" = "そう、「女子高生」は寝る前にアイスクリームを食べても#n体重計が怖くないジョブなのだと！"
"22040-88" = "[s] \"そんな事はないんじゃないかな……？\""
"22040-89-アスナ" = "あははっ、その通り！アリスちゃん鋭いね！"
"22040-90-アスナ" = "私たちは今、ジョブチェンジして秘密のクエストを進行中なんだ！#nこれはそのためのユニフォーム！"
"22040-91" = "[s] \"秘密のクエスト……？\""
"22040-92-アスナ" = "うん！最近のゲヘナの情勢が気になるって、リオ会長が言っててね～"
"22040-93-アスナ" = "何だっけ？なにか動き？がないか調べてほしいって言われちゃって！"
"22040-94-カリン" = "アスナ先輩、ちょっと……。"
"22040-95-アスナ" = "だから制服を着てね……#n通りすがりのゲヘナ生いないかな～って。"
"22040-96-アスナ" = "見かけたら声かけよ～！って思って！"
"22040-97-アリス" = "なるほど、アスナ先輩もクエストを受けて冒険しているのですね。"
"22040-98-アリス" = "アリスと同じです！"
"22040-99-カリン" = "本当？#nアリスちゃんと同じだ～！おそろい！"
"22040-100-カリン" = "ちょっと、アスナ先輩。#nアカネがそれは秘密だって……。"
"22040-101-アスナ" = "あ、そうだった！"
"22040-102-アスナ" = "アリスちゃん、ご主人様！さっきのは秘密だよ？"
"22040-103" = "[s] \"あ、うん……分かった。\""
"22040-104-カリン" = "はぁ……。#nまあ、先生とアリスなら……いいか。"
"22040-105-アリス" = "はい！アリス、秘密は守ります！#nゲームでも、秘密を漏らすと呪いを受けたりしますから！"
"22040-106-アスナ" = "あはは！そうそう！#nアリスちゃんはいつも元気だね！"
"22040-107" = "[s] \"とはいえ、二人の制服姿かぁ……。\""
"22040-108-カリン" = "いや、私たちも生徒だから。#n普通に制服着るというか……"
"22040-109-カリン" = "ただ、その……これは潜入用の格好というか……"
"22040-110-カリン" = "任務で、普段の制服を着るようにと言われて……その……"
"22040-111-カリン" = "その……"
"22040-112" = "[s] \"そうなんだね……似合ってるよ。\""
"22040-113-カリン" = "…………"
"22040-114-カリン" = "……うっ。"
"22040-115-カリン" = "あ、あまり見ないでくれ先生。"
"22040-116-カリン" = "その……ちょっと恥ずかしい、から……。"
"22040-117" = "[s] \"ご、ごめん！不躾だったね……。\""
"22040-118" = "[ns] \"その、いつもと違うから新鮮で……似合ってると思うよ！\""
"22040-119-カリン" = "ところで、アリスちゃんとご主人様は何してたの？"
"22040-120-アリス" = "先生とアリスは冒険中でした。"
"22040-121-アリス" = "おお、冒険！面白そうー！#nそれ！私もやりたい！"
"22040-122-アリス" = "はぁ……先輩、任務を忘れないで……。"
"22040-123-アリス" = "パーティーメンバーが増えるのはいつでも歓迎です！"
"22040-124-アリス" = "メンバーが増えたら、使える戦術の幅が広がりますから！"
"22040-125-アリス" = "パンパカパーン！#nアスナ先輩も、カリン先輩も！次の冒険では仲間です！"
"22040-126-アリス" = "わぁい！パーティーに入った～！"
"22040-127-アリス" = "わ、私も……？"
"22040-128-アリス" = "はい！"
"22040-129-アリス" = "そっか……よろしくね。"
"22040-130" = "それじゃ……アリス、先生。"
"22040-131-カリン" = "私たちは先に失礼する。"
"22040-132" = "[s] \"うん、任務頑張ってね。\""
"22040-133-アスナ" = "うん、ありがとうご主人様！頑張るね～！"
"22040-134-アスナ" = "だから、それは秘密だって……#nいや、今更か。"
"22040-135-アスナ" = "ああ、そうだアリス。#nネル先輩が探していた。"
"22040-136-アリス" = "えっ！？ち、チビメイド様がアリスのことをですか！？"
"22040-137-カリン" = "何か用事があるそうだけど……"
"22040-138-カリン" = "まぁ、会ったらよろしくね。"
"22040-139-カリン" = "先輩は、アリスの事を本当に気に入っているみたいだから。"
"22040-140-アリス" = "あ、うぅ……。"
"22040-141-カリン" = "それじゃ、バイバイ～"
"22040-142-アスナ" = "あっ、そこのゲヘナの子！"
"22040-143-キララ" = "え～、誰？……あたし達になんか用？"
"22040-144-カリン" = "私たちはゲヘナに編入予定なんだが……。"
"22040-145-アスナ" = "編入前に気になることがあってね～！"
"22040-146-キララ" = "……え？今の万魔殿のリーダー？"
"22040-147-キララ" = "ねぇ、知ってる？"
"22040-148-エリカ" = "え、さあ？#nイブキちゃんじゃないの？"
"22040-149-キララ" = "マコト？#n誰それ。"
"22040-150" = "[ns] \"任務……大丈夫だろうか……？\""
"22040-151-アリス" = "先生！こうしている場合じゃないです！"
"22040-152-アリス" = "ネル先輩がいつ現れるか分かりません！#nひとまず退却しましょう！"
"22040-153" = "[ns] \"あっ、アリス！待って！\""
"22040-154" = "次回;～アリスと導かれる者たち～（２）"
