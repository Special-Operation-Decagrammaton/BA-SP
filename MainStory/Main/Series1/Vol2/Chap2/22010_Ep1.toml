[translation]
"22010-1" = "第1話;密やかなる会談"
"22010-2" = "ミレニアム・セミナー執務室"
"22010-3-ヒマリ" = "あら……超天才清楚系病弱美少女の来訪を、#n電気もつけずに迎えるなんて……。"
"22010-4-ヒマリ" = "来客をもてなす気がこれっぽっちも無いという点、#nとてもあなたらしいとは思いますけど……。"
"22010-5-ヒマリ" = "ですが、暗い部屋でモニターをつけていると目が悪くなりますよ？"
"22010-6-ヒマリ" = "――リオ。"
"22010-7-リオ" = "万全を期しているだけよ――この会談を外部に知られてはならないもの。"
"22010-8-リオ" = "そのためであれば、この程度問題ではないわ。"
"22010-9-リオ" = "この訪問はデータベースには残らない。#nつまり、記録上私たちは会ってなどいない事になっている。"
"22010-10-リオ" = "すべては――これから話す内容の機密を守るため。"
"22010-11-ヒマリ" = "リオったら、真面目なんですから……#n「貴女は私の姉なの？」くらいの軽口を返せないと、ユーモアからは程遠いですよ。"
"22010-12-ヒマリ" = "今のだって、超天才清楚系病弱美少女の軽い冗談なんですから。#nふふ。"
"22010-13-リオ" = "……貴女は私の姉ではないわ。#n急にそんな非合理的な話をするなんて……どうしたの、ヒマリ。"
"22010-14-ヒマリ" = "……ええ、ええ。そうでした。#nあなたはそういう人でしたね。"
"22010-15-ヒマリ" = "ユーモアを解さずに「合理」だなんて……あなたの好きな表現でしたね、それ。"
"22010-16-リオ" = "好悪の話ではないのだけれど……事実でしょう？"
"22010-17-リオ" = "この会合が秘匿されている事くらいは、あなたも理解しているものだと思っていたのだけれど。"
"22010-18-ヒマリ" = "それはどうでしょう？#n――そもそも、人目を気にするのであれば、他の場所にすれば良かったのでは？"
"22010-19-リオ" = "……他の場所？"
"22010-20-ヒマリ" = "ええ、例えば……"
"22010-21-ヒマリ" = "誰かさんがこっそり作っている――"
"22010-22-ヒマリ" = "[ruby=悪趣味]「セーフハウス」[/ruby]……とか？"
"22010-23-リオ" = "……。"
"22010-24-リオ" = "……本題に入りましょう。"
"22010-25-ヒマリ" = "あらあら、話を逸らすつもりですか？#nふふ……ええ、構いませんが。"
"22010-26-リオ" = "まず、お互いの認識のすり合わせを。"
"22010-27-リオ" = "前回、「鏡」を巡ってミレニアム生が起こした一連の騒動――"
"22010-28-リオ" = "それは私たちが共に仕掛けたことだったわね。"
"22010-29-ヒマリ" = "ええ。私が「鏡」という手段を用意し、リオが「C&C」という危機を提供する――。"
"22010-30-ヒマリ" = "珍しく、一つの目的のためにあなたと私が協力した事でした。"
"22010-31-ヒマリ" = "そう――[ruby=AL-1S]アリス[/ruby]の正体を明かすために。"
"22010-32-リオ" = "あれから随分と経つけれど……#n解釈の結論は出たかしら？"
"22010-33-ヒマリ" = "もちろんです。"
"22010-34-ヒマリ" = "アリスの正体……#nそれは――"
"22010-35-ヒマリ" = "無名の司祭が崇拝する「オーパーツ」であり――"
"22010-36-リオ" = "――遥か昔の記録に存在する、"
"22010-37-リオ" = "「名もなき神々の王女」。"
"22010-38-ヒマリ" = "……。"
"22010-39-リオ" = "……。"
"22010-40-リオ" = "そう……同じ解釈になったようね。"
"22010-41-リオ" = "つまり……「あの存在」の本質は……。"
"22010-42-ヒマリ" = "ええ。アリス、あの子は――"
"22010-43" = "「世界を終焉に導く兵器」"
"22010-44" = "「『かわいい後輩』ですよね♪」"
"22010-45-リオ" = "……？"
"22010-46-ヒマリ" = "……あら。"
"22010-47-リオ" = "……あなたは一体、何を言っているの？"
"22010-48-ヒマリ" = "リオこそ、一体何を言っているのですか……？"
"22010-49-リオ" = "……。"
"22010-50-ヒマリ" = "……。"
"22010-51-リオ" = "……そう。じゃあ、私たちの同盟はここで終わりという事ね。"
"22010-52-ヒマリ" = "そうですね。#n同盟ではなく、休戦でしたが……。"
"22010-53-リオ" = "………………。"
"22010-54-ヒマリ" = "……………………。"
"22010-55-ヒマリ" = "ああ、これが噂の……最近あなたが作っているおもちゃですね。"
"22010-56-AMAS A" = "同盟を解除した以上、貴女をこのまま帰すわけにはいかないわ。"
"22010-57-ヒマリ" = "まぁ……そうでしょうね。#nあなたならそうすると思っていました。"
"22010-58-リオ" = "ッ……！？#n私のオフィスが……ハッキングされた……！？"
"22010-59-ヒマリ" = "あらあら……ビッグシスターの部屋は無敵だとでも？"
"22010-60-リオ" = "AMAS、ヒマリを捕らえなさい……！"
"22010-61-ヒマリ" = "ふふ、病弱美少女に不可能なんてないんですよ。"
"22010-62-リオ" = "（AMASの全個体が、動作を停止した……？）"
"22010-63-リオ" = "（まさか、照明システムがダウンした瞬間に……！？#n　あの一瞬でこれだけの規模のハッキングを……？）"
"22010-64-リオ" = "（……感心してる場合じゃない。ドローンの制御権を復旧させないと）"
"22010-65-リオ" = "ん、なんで照明システムが反応……。"
"22010-66-リオ" = "うっ……！"
"22010-67-リオ" = "ヒマリは……"
"22010-68-リオ" = "……そう、抜け出したのね。"
"22010-69-リオ" = "さすがはヴェリタスの部長……。"
"22010-70-リオ" = "できることなら、味方にしておきたかったけれど……"
"22010-71-リオ" = "本当に、残念よ。"
"22010-72-リオ" = "はぁ……非合理的なこの方法だけは、選びたくなかったのに――"
"22010-73-ヒマリ" = "自分と意見が違うと気づくや否や、躊躇いなく行動するその姿……"
"22010-74-ヒマリ" = "久々に見ましたが……相変わらずですね、リオ。"
"22010-75-ヒマリ" = "まぁ、超天才病弱美少女の私には無意味ですが♪"
"22010-76-ヒマリ" = "さてさて……これでリオより先に……"
"22010-77-ヒマリ" = "ん……？"
"22010-78-ヒマリ" = "くっ……！？#nあなたは……だれ……？"
"22010-79-ヒマリ" = "あなたは……"
"22010-80-ヒマリ" = "まさか……5番目のC&C……"
"22010-81" = "次回;ゲーム開発部の平凡な日常"
