[translation]
"22250-1" = "第25話;ミレニアムサイエンススクール"
"22250-2" = "（そうして、みんなが力を合わせる事によってエリドゥを……）"
"22250-3" = "（ミレニアムを――#nひいてはキヴォトスの脅威になったかもしれない危機を解決することができたのでした。めでたしめでたし）"
"22250-4-ヒマリ" = "……エリドゥの施設は、私が責任を持って閉鎖する事にいたしました。"
"22250-5" = "[s] \"お疲れ様。ありがとうね、ヒマリ。\""
"22250-6-ヒマリ" = "……あの時の脅威はどうにか防ぐ事ができましたが、#nまだ何も解決していませんからね。"
"22250-7-ヒマリ" = "特異現象捜査部の部長として、看過できないことでもありますし……#nはぁ……一体誰のせいでこんな事を、と思ったりもしますが。"
"22250-8-ヒマリ" = "まぁ、その誰かさんのためにやっている……としておきましょうか？"
"22250-9-ヒマリ" = "超天才病弱美少女ハッカーは、いつも忙しいんですけどね……まったく。"
"22250-10" = "[s] \"あはは、よろしくね。\""
"22250-11" = "セミナー・執務室"
"22250-12" = "（そして、当事者であるリオはといえば――）"
"22250-13-ユウカ" = "リオ会長！？急に何を言ってるんですか！？#n会長を辞めるだなんて！"
"22250-14-ユウカ" = "ちょっと会長！？会長は一体どこに！？"
"22250-15-ノア" = "……あ。"
"22250-16-ノア" = "ユウカちゃん、ここに会長からのメッセージが。"
"22250-17-ユウカ" = "え？メッセージ！？#nどれどれ……"
"22250-18-ユウカ" = "「ごめんなさい」……？"
"22250-19-ユウカ" = "…………………"
"22250-20-ノア" = "……あ、謝って済む問題じゃないでしょう！？会長ーー！？！？"
"22250-21" = "（一方、C&Cでは……）"
"22250-22-アスナ" = "部長の退院を祝って～！乾杯！"
"22250-23-カリン" = "乾杯。"
"22250-24-アカネ" = "はい、乾杯です～"
"22250-25-ネル" = "……これは一体なんの騒ぎだ？"
"22250-26-アカネ" = "ふふっ。#n部長が無事退院したので、お祝いに打ち上げをすることにしたんですよ。"
"22250-27-アスナ" = "だから今日は、こうしてC&Cが全員集合したんだよ！"
"22250-28-ネル" = "いや、それは分かるけど……なんで先生がいんだよ？"
"22250-29" = "[s1] \"招待されたんだよ。ネル、退院おめでとう。\"\n[s2] \"やっぱり、私がいたら迷惑だったかな？\""
"22250-30-ネル" = "あ、ああ……ありがとう……"
"22250-31-ネル" = "うっ……！いや、別にそういう訳じゃねぇけどよ……。"
"22250-32-アスナ" = "さあさあ、ご主人様も飲んで！飲んで！"
"22250-33-アスナ" = "ヴェリタスが用意してくれた妖怪MAXならい～っぱいあるからね！"
"22250-34" = "[s] \"……あ、うん。妖怪MAXなんだねコレ。\""
"22250-35-カリン" = "アスナ先輩、そんな風に勧めたら先生も困ってしまうから……。"
"22250-36-アカネ" = "ふふっ。カリン、今日くらいはいいんじゃないですか？"
"22250-37-アカネ" = "ですよね、先生？"
"22250-38" = "[s] \"私はかまわないけど……。\""
"22250-39-カリン" = "う～ん、これじゃテンション上がらなかったかな？"
"22250-40-アスナ" = "あ！"
"22250-41-アスナ" = "そうだ！みんなバニー姿の方が良かったりした？"
"22250-42-アスナ" = "ねえ？ご主人様。"
"22250-43-カリン" = "バニー姿なんて……それは、ちょっと困る……"
"22250-44-カリン" = "いや……でも、先生が見たいっていうのなら……できなくも……"
"22250-45" = "[s] \"だ、大丈夫だよ！変な目で見られちゃうから！\""
"22250-46-ネル" = "はぁ……一体誰のための打ち上げなんだか……"
"22250-47-カリン" = "なるほど……打ち上げさえもバニー姿で。"
"22250-48-アスナ" = "それがC&Cスタイルということですね。一つ賢くなりました。"
"22250-49-ネル" = "……は？"
"22250-50-アカネ" = "あら。"
"22250-51-カリン" = "……！"
"22250-52-アスナ" = "あはっ♪"
"22250-53-トキ" = "遅くなりました、先輩方。"
"22250-54-アスナ" = "やほ～トキちゃん！"
"22250-55-ネル" = "な、なっ……いや……てめぇがどうして……ここに……！？"
"22250-56-トキ" = "C&C全員が集合する打ち上げの席だと伺ったので、来てみました。"
"22250-57-ネル" = "あんたは会長専属だろ！？"
"22250-58-トキ" = "……残念ながら、その会長が失踪してしまいまして。"
"22250-59-トキ" = "どうしたものかと立ち尽くしていたところ……C&Cの事を思い出したのです。"
"22250-60-ネル" = "だからって、自分が殴った相手の退院打ち上げに参加するヤツがどこにいんだよ！？"
"22250-61-トキ" = "……はい？"
"22250-62-ネル" = "んだよ！あたしが間違ってるみたいな顔すんなよ！"
"22250-63-アスナ" = "あっ！部長ひどい！せっかくトキちゃんが来てくれたのに！"
"22250-64-アスナ" = "いやいや……あいつ、この前まで敵だっただろうがよ！？"
"22250-65" = "[s] \"ケンカするほど仲が良いっていうし……。\""
"22250-66-ネル" = "ちょっ！先生まであいつ庇うのかよ！？"
"22250-67-トキ" = "あ、トキちゃん。寄ったついでにお菓子でも食べていきますか？"
"22250-68-アカネ" = "ありがとうございます。"
"22250-69-アスナ" = "はい！次はこれ！"
"22250-70-カリン" = "……うーん、妖怪MAXの味は奥が深い。"
"22250-71-ネル" = "はぁああ！？！？"
"22250-72-ネル" = "…………"
"22250-73-ネル" = "はぁ……まあ、いい。"
"22250-74" = "[s] \"ネル……？\""
"22250-75-ネル" = "まあ、結局上から命令された事をやるのがC&Cだからな。"
"22250-76-ネル" = "――あんたも結局、会長の依頼を遂行しただけだろうし。"
"22250-77-ネル" = "ネル先輩は、思ったより聞き分けがいいんですね。"
"22250-78-ネル" = "誰のせいだと思ってんだよ！？"
"22250-79-ネル" = "それにしても……なかなかやるよな、お前。#n戦い方に無駄がないというか。"
"22250-80-ネル" = "はい、万全の状態ならネル先輩くらいでしたら……"
"22250-81-ネル" = "さあ、トキちゃん。この妖怪MAXも召し上がってみてください。"
"22250-82-アカネ" = "はい、ちょ、……アカネ先輩、その、うっ……"
"22250-83-ネル" = "……あぁ？んだって？"
"22250-84" = "[s] \"……これから賑やかになりそうだね。\""
"22250-85" = "（あれほどの事件があった後でも、変わらず時間は流れていく――）"
"22250-86" = "（それはここでも同じ――）"
"22250-87" = "[ns] \"……ってことで、呼ばれたんだけど。\""
"22250-88-モモイ" = "あ！先生！いらっしゃい！"
"22250-89-モモイ" = "ちょうどみんなで勉強会してたとこなんだ！"
"22250-90" = "[s] \"……何の勉強？\""
"22250-91-モモイ" = "それはもちろん！"
"22250-92-モモイ" = "私たちの次回作である#n「道端の可愛いモンスターを味方にしながら世界を征服する収集型育成戦略RPG」#nを作るための勉強だよ！"
"22250-93" = "[s] \"この前言ってたジャンルから変わってない！？\""
"22250-94-モモイ" = "ああ、それでしたら、ちょっと発想が行き詰まってしまったので……#nちゃぶ台をひっくり返して……"
"22250-95-ミドリ" = "お姉ちゃんが、新しいジャンルに挑戦してみたい、と……。"
"22250-96" = "[s] \"……また？\""
"22250-97-モモイ" = "ま、まただなんて酷い……！#nゲーム開発ってそういうものなんだよ！？"
"22250-98-アリス" = "うわぁーん！アリス、この可愛いモンスターさんを友達にすることができません！"
"22250-99-アリス" = "あっ！アリス！まずバトルで体力を削らないと！"
"22250-100-アリス" = "そうしたら捕獲しやすくなるからね！"
"22250-101-アリス" = "モンスターさんは何もしていないのに……#nアリスが先に殴るんですか？"
"22250-102-アリス" = "うーん、言われてみればたしかに……ちょっとおかしいのかも……？"
"22250-103-アリス" = "ううう、でもゲームって元々そういうシステムっていうか……。"
"22250-104-アリス" = "そこ！変な話ばっかしないで！ちゃんと分析するよ！"
"22250-105-ユズ" = "その、ゆ、ゆっくりでいいから……。"
"22250-106" = "[s] \"よし。じゃあ、一緒にやろうか。\""
"22250-107-アリス" = "はい！先生はここ！アリスの隣に座ってください！"
"22250-108-モモイ" = "よーし！みんな集まったからチームバトルを始めるよ！"
"22250-109-ミドリ" = "はぁ……もう。"
"22250-110-ユズ" = "ふふっ、うん……。"
"22250-111" = "（数多くの壁にぶつかって、#n　時にはケンカして傷ついたり挫折する事もあるけれど――）"
"22250-112" = "（それでも、勇者と仲間たちの冒険はこれからも続いていく――）"
"22250-113" = "（そう、いつまでもずっと――）"
"22250-114" = "#video;11000"
