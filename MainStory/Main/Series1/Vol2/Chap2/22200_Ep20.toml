[translation]
"22200-1" = "第20話;ゲーマーとして、友達として"
"22200-2-チヒロ" = "とりあえず近くの建物に逃げたけど……。"
"22200-3" = "[ns] \"みんな大丈夫？怪我は！？\""
"22200-4-モモイ" = "……私たちは大丈夫だけど。"
"22200-5-ミドリ" = "ネル先輩が……。"
"22200-6-アカネ" = "部長の意識がまだ……戻っておりません。"
"22200-7-カリン" = "負傷が思ったより深刻なようだ。"
"22200-8-アスナ" = "最後、落下の衝撃で大怪我しちゃったみたい……どうしよう、ご主人様……。"
"22200-9" = "[s] \"ネル……。\""
"22200-10-チヒロ" = "……最悪の状況だね。"
"22200-11-チヒロ" = "アバンギャルド君との戦いで、エンジニア部はリタイア……。"
"22200-12-チヒロ" = "私たちヴェリタスがネットワークに接続したところまではよかったけど……#nそもそも、遠距離支援には限界がある。"
"22200-13-チヒロ" = "ゲーム開発部に至っては……正直、戦力外だろうね。"
"22200-14-ミドリ" = "ううぅ！そ、それはそうだけど！"
"22200-15-ミドリ" = "否定できません……。"
"22200-16-チヒロ" = "実際、戦力と呼べるC&Cは……"
"22200-17" = "[s] \"……ネルだけじゃない、みんなもう限界だ。\""
"22200-18-チヒロ" = "……はぁ、あんまりこんなことは言いたくないけど。"
"22200-19-チヒロ" = "ここまで、なのかもしれない……もう、ここから打てる手なんて……。"
"22200-20-モモイ" = "やっぱり、私たち……"
"22200-21-モモイ" = "……私たちだけじゃ、力不足なのかな？"
"22200-22" = "[s] \"モモイ……。\""
"22200-23-ミドリ" = "私たちだけじゃ……アリスちゃんを、助けられないの、でしょうか？"
"22200-24-ミドリ" = "アリスちゃんも、私たちも……#n誰も、悪いことなんかしてないのに……。"
"22200-25-ミドリ" = "なのに、どうして……どうしてなの……。"
"22200-26-ユズ" = "ミドリ……"
"22200-27-モモイ" = "ここまで……みんなが助けてくれた……"
"22200-28-モモイ" = "みんなの努力が重なって……やっと、ここまで来られたのに……！"
"22200-29-モモイ" = "このまま諦めるしか、ないの…………？"
"22200-30-モモイ" = "……こんな……こんなバッドエンドは……#n絶対……絶対に……！"
"22200-31-ネル" = "んなもん納得できっかよ！！"
"22200-32-モモイ" = "うわああっ！？"
"22200-33-アスナ" = "あっ！部長！"
"22200-34-アスナ" = "気がついたんだな！？"
"22200-35" = "[s] \"ネル、身体は大丈夫？\""
"22200-36-ネル" = "あぁ……？"
"22200-37-アカネ" = "部長！無理しないでください！#nかなり傷が深いんですから！"
"22200-38-ネル" = "ぴーぴー騒ぐんじゃねぇ……大丈夫だ。"
"22200-39-チヒロ" = "いや、見た目は全然大丈夫じゃないんだけど……。"
"22200-40-ネル" = "んなことより……何があった？#nなんでみんな葬式みてぇなツラしてんだ？"
"22200-41" = "[s] \"それが……。\""
"22200-42-ネル" = "はぁ……つまり、状況的にもうダメなんじゃないかって？"
"22200-43-ネル" = "……。"
"22200-44-ネル" = "は？ふざけてる。"
"22200-45-モモイ" = "え……？"
"22200-46-ネル" = "おい、チビども。"
"22200-47-ネル" = "てめぇらの想いは、所詮その程度だったのか？"
"22200-48-モモイ" = "しょ、所詮……って……そんな言い方ないじゃん！"
"22200-49-ネル" = "まぁ、たしかに腕は動かせそうにもねぇし、"
"22200-50-ネル" = "足も靭帯が切れてるな、こりゃ……"
"22200-51-ネル" = "マジで、一歩でも動いたら吐きそうになるけどよ……"
"22200-52-モモイ" = "それもう満身創痍っていうんだよ！？"
"22200-53-ネル" = "だがなぁ……たかだかその程度で諦めるほど……。"
"22200-54-ネル" = "てめぇらの決心は脆いのかよ？"
"22200-55-ミドリ" = "で、でもネル先輩、もう身体が……！"
"22200-56-ネル" = "は！らしくもなく他人の心配するんじゃねぇ。"
"22200-57-ネル" = "こんくらい、根性で耐えてやんよ。"
"22200-58-ネル" = "せっかく、アリスを救うためにここまで来たんだろ？"
"22200-59-ネル" = "じゃあ最後まで諦めずに押し通せっての。わかったか？"
"22200-60-モモイ" = "わ、私たちだって諦めたくないよ！"
"22200-61-モモイ" = "で、でもあんなチートキャラ相手に……どうやって勝てばいいの……？"
"22200-62-ネル" = "そうだな……"
"22200-63-ユズ" = "もしかしたら……方法が、あるかも……しれない。"
"22200-64-みんな" = "ええっ！？"
"22200-65" = "[s] \"ユズ、ほ、本当に！？\""
"22200-66-ユズ" = "はい、あの時本当に一瞬……刹那の瞬間だったんですが。"
"22200-67-ユズ" = "（今……！）"
"22200-68-ユズ" = "ネル先輩の攻撃が通ってるのを見ました。"
"22200-69" = "[s] \"あの短い時間の中で……？\""
"22200-70-モモイ" = "さすがユズだよ！UZQueen！動体視力の申し子！"
"22200-71-アカネ" = "でもなぜ効いたのでしょう？#n会長の言葉通りなら、トキちゃんの「武装」には何も通用しないはずなのでは？"
"22200-72-ユズ" = "そ、それはわたしにもよく……。"
"22200-73-チヒロ" = "……これは、もしもの話だけど。"
"22200-74-チヒロ" = "……あくまでもしも、の本当にただの仮定に過ぎない話なんだけど。"
"22200-75-チヒロ" = "トキの「武装」に隙があるとしたら？"
"22200-76-カリン" = "……隙？"
"22200-77-チヒロ" = "会長は言ってたよね。エリドゥのネットワークからサポートを受ける「武装」は、#n演算によってどんな攻撃でも撃墜し、回避することが可能だと。"
"22200-78" = "[s] \"うん。実際もそんな感じだったね。\""
"22200-79-チヒロ" = "そうだね。この目で見た限りでも、それは嘘じゃない。#nただ……。"
"22200-80-チヒロ" = "これまで、その二つを同時にこなしているところを見たことがないと思って。"
"22200-81-アカネ" = "……！#nなるほど、そういうことなのですね。"
"22200-82-モモイ" = "え？ん？えっ……？"
"22200-83-モモイ" = "えっと……どういう意味ですか？"
"22200-84-チヒロ" = "「武装」の能力は、たしかにチートと呼んでもいいくらいだけど。"
"22200-85-チヒロ" = "でも、もしかしたらそう見えているだけで、#n「武装」にも限界が……できない事があるかもしれないって話。"
"22200-86-チヒロ" = "ビルから落ちた時、会長はその墜落さえ計算に入れていたと言ってたよね。"
"22200-87-カリン" = "つまり、あの時は墜落に演算能力を使っていたから……。"
"22200-88" = "[s] \"ネルの攻撃を防ぎきれず……隙ができた……？\""
"22200-89-モモイ" = "あ！そういうこと！"
"22200-90-ミドリ" = "そ、それならあの時みたいに隙を作ることができれば……！"
"22200-91-ユズ" = "倒せるかも、しれない……？"
"22200-92-カリン" = "でもどうやって？相手がこの弱点を理解してないとは思えない。"
"22200-93-カリン" = "屋上から落とす方法が二度も通じるはずが……"
"22200-94-ユズ" = "ね、ネル先輩は、近距離なら……勝てる……そう、言いましたよね？"
"22200-95-ネル" = "……ああ、勝てる。#nその前に、あのチート能力をどうにかする必要はあるだろうがな。"
"22200-96-ユズ" = "そ、それならわたしにアイデアがあります。"
"22200-97-ユズ" = "チート相手に……"
"22200-98-ユズ" = "与えられたルールの中で、わたしたちが使える……「ハメ技」が。"
"22200-99-トキ" = "ネル先輩……"
"22200-100-リオ" = "……何を企んでいるか知らないけど、無駄よ。"
"22200-101-リオ" = "トキ。"
"22200-102-トキ" = "……イエス、マム。"
"22200-103-ネル" = "ああ、そう来なくっちゃな……。"
"22200-104-ネル" = "今度こそお互い、決着をつけようじゃねぇの！"
"22200-105" = "次回;その名が示すのは。"
