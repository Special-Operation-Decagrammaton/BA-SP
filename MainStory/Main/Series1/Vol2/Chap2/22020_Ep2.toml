[translation]
"22020-1" = "第2話;ゲーム開発部の平凡な日常"
"22020-2" = "（珍しくシャーレの仕事がなく、ちょうど時間ができたある日）"
"22020-3" = "（ゲーム開発部から、部活動に付き合ってほしいという連絡があった）"
"22020-4" = "（部活動といっても、何をするのか具体的な話は聞けずじまいで……）"
"22020-5" = "ミレニアム・ゲーム開発部"
"22020-6" = "おりゃあーっ！#n先生、覚悟して！"
"22020-7" = "今から、とっておきの必殺技……！"
"22020-8" = "モモイスプラッシュを見せてあげるんだから！！"
"22020-9" = "（気がついたら、部室でモモイと格ゲーをしていた）"
"22020-10" = "[s] \"とっておきの必殺技っ……！！\""
"22020-11-モモイ" = "ふっふっふっ！私のコンボに死角はないよ！#n先生の！HPがなくなるまで！止まらない！"
"22020-12-モモイ" = "やあーーっ！"
"22020-13" = "（ドン！バタン！）"
"22020-14" = "「Player MOMORIA LOSE！」"
"22020-15" = "「WINNER！ Player [USERNAME]！」"
"22020-16-モモイ" = "うわーん！なんで私のコンボが当たらないの！？"
"22020-17" = "[s1] \"モモイは焦るとレバガチャしちゃうから……。\"\n[s2] \"そんな甘々コンボなんて通じないよ、モモイ！\""
"22020-18-モモイ" = "そんなっ！？#nもう私の攻撃パターンを見切ったの！？"
"22020-19-モモイ" = "というか、お姉ちゃん……先生は今日始めたばっかりの初心者だって言ってたよね。"
"22020-20-モモイ" = "うわっミドリ！！？あんまり辛い現実を突きつけないで！"
"22020-21-モモイ" = "今のは無効！無効だから！"
"22020-22-ミドリ" = "もう一回！もう一回やって先生！#n今度は正真正銘とっておきのコンボを……。"
"22020-23" = "[s] \"その言葉、もう8回目……。\""
"22020-24-モモイ" = "え！？もうそんなに！？"
"22020-25-モモイ" = "そうだよお姉ちゃん。その辺にしておこう？#n先生が困ってるでしょ。"
"22020-26-モモイ" = "で、でも負けたまま終わるのは、げ、ゲーマーとしてのプライドが……。"
"22020-27-ミドリ" = "またそんな事言って……"
"22020-28-ミドリ" = "じゃあ先生は負けたまま終わってもいいってこと？"
"22020-29-モモイ" = "うにゃあっ！？#nそれは……そ、そう、なる……？"
"22020-30" = "[s] \"私は別に大丈夫だよ。\""
"22020-31-ミドリ" = "はあ。先生、あまりお姉ちゃんのこと甘やかしちゃダメですよ？"
"22020-32-ミドリ" = "というか、こんなに遊んでばっかりで……#nお姉ちゃん……"
"22020-33-モモイ" = "今日の部活の目的、覚えてる？"
"22020-34-モモイ" = "あっ、そうだった……！"
"22020-35-ミドリ" = "……そうだった？"
"22020-36-モモイ" = "ち、違う！違うのミドリ！#nちゃんと覚えてるから！ね！"
"22020-37" = "[s] \"そういえば、まだちゃんと話聞いてなかったね。\""
"22020-38-モモイ" = "えっ、お姉ちゃん……先生に何も説明してないの……？"
"22020-39-ミドリ" = "おね～～ちゃ～～ん？"
"22020-40-ミドリ" = "い、今！#n今から言うから！"
"22020-41-モモイ" = "今日は、"
"22020-42-モモイ" = "次回作のアイデア出しをしようと思って！"
"22020-43" = "[s] \"次回作……？\""
"22020-44-ミドリ" = "はい。うちもそろそろ次回作の準備をしようという話が出たんです。"
"22020-45-ミドリ" = "そう！しかも、いつも捕まらない先生の手が空いたって聞いたから、#nこれはと思って呼んでみたの！"
"22020-46" = "[s3] \"……あんまり顔出せてなくてごめんね。\"\n[s4] \"たしかに、ちょうど手が空いたところだね。\""
"22020-47-ミドリ" = "まぁ、先生が忙しいのは知ってるから……#n来てくれてありがとう！"
"22020-48-モモイ" = "とにかく！こうして先生に来てもらえたのだから、#n次回作の意見を聞けるんじゃないかな～って。"
"22020-49-モモイ" = "それに、先生ならすごいアイデアをいっぱい出してくれるんじゃないかな～って……。"
"22020-50-モモイ" = "そういうわけで、部室に来てもらいました！"
"22020-51" = "[s] \"う、うん……ちょっと期待が重いような……。\""
"22020-52" = "[ns] \"というか、ずっと格ゲーばっかやってるような……？\""
"22020-53-モモイ" = "あ、それはお姉ちゃんのアイデアなんです。"
"22020-54-モモイ" = "そう、ゲームを分析しようと思って！"
"22020-55-モモイ" = "何も浮かんでない状態でぐるぐる悩んだって、いいアイデアは出て来ないじゃない？"
"22020-56-ミドリ" = "だからいろんな人気作をプレイして、その上でアイデアを出してみよう。#nという事になったんです。"
"22020-57" = "[s] \"なるほど、一理あるね。\""
"22020-58-ミドリ" = "ふふふ！でしょ？#n特にさっき先生とやってたこのゲーム。"
"22020-59-モモイ" = "『カシオペアの拳～ウーパールーパー大列伝～』は、#n格ゲー界隈でも色んな意味で異端児と呼ばれてる人気ゲームなんだ！"
"22020-60" = "参考になる点が多いゲームだから、これを分析したらきっと……"
"22020-61-モモイ" = "次回作に役立つ素晴らしいアイデアが浮かんでくる！はず！"
"22020-62-ミドリ" = "うちの次回作は「まったりスローライフ系ダンジョン探索型RPG」なんです。"
"22020-63" = "[s] \"それなのに格ゲー要素が入るの！？\""
"22020-64-モモイ" = "何を言ってるの先生！"
"22020-65-モモイ" = "たしかに一般人から見たら、ダンジョン探索型RPGと格ゲーに接点がなさそうに見えるかもしれないけど……。"
"22020-66" = "[s] \"なさそうに見えるかもしれないけど……？\""
"22020-67-モモイ" = "ふっふっふっ！見た目で判断するのはNGだよ！"
"22020-68-モモイ" = "次のミレニアムプライスを狙うなら、誰にも予想がつかないような新しい挑戦が必須！"
"22020-69-モモイ" = "そう、つまり！先入観を捨て、あらゆる偏見を乗り越えてこそ、#n新しい地平線の向こうへ行けるというもの……！"
"22020-70-ミドリ" = "全く関係なさそうなジャンルの要素を組み合わせたら、#n意外と面白いゲームになるかもしれませんし。"
"22020-71-モモイ" = "あっ！ミドリ！私のセリフを奪わないでよ！"
"22020-72-モモイ" = "お姉ちゃんがもったいぶって言わないからだよ。"
"22020-73-モモイ" = "うわ～ん#nひどいよ～！"
"22020-74" = "[s] \"みんな新作開発に全力なんだね。\""
"22020-75-モモイ" = "ん？"
"22020-76-ミドリ" = "あ……。"
"22020-77-モモイ" = "ふふふ！"
"22020-78-モモイ" = "そりゃあ、もちろん！"
"22020-79-ミドリ" = "はい。私とお姉ちゃんだけじゃなく、ユズちゃんとアリスちゃんも。#nみんなで一緒に……。"
"22020-80-ミドリ" = "今度こそ、ミレニアムプライスを取ると約束しましたから。"
"22020-81-モモイ" = "うん。#nそれが、今私たちに与えられた「クエスト」なんだ！"
"22020-82-ミドリ" = "モモイ！ミドリ！先生！#n非常事態です！"
"22020-83" = "[s] \"こんにちは、アリス。どうしたの？\""
"22020-84-モモイ" = "あれ、どうしたのアリス？"
"22020-85-アリス" = "ついに、ユズがオンライン10連勝を超えました！"
"22020-86-ミドリ" = "え？本当！？"
"22020-87-モモイ" = "このバランスが終わったゲームで10連勝も！？"
"22020-88" = "「WINNER！Player UZQueen！」"
"22020-89-ユズ" = "ふあぁ……"
"22020-90-モモイ" = "かっこよかったよ、ユズ！"
"22020-91-ミドリ" = "ユズちゃんはすごいね。"
"22020-92-アリス" = "アリスは感動しました！#nさすが伝説の勇者「UZQueen」です！"
"22020-93-ユズ" = "あっ、う、うん……？"
"22020-94" = "[s] \"ユズおめでとう！完璧な勝利だったね！\""
"22020-95-モモイ" = "でしょ！これがユズのパーフェクトスタイル「UZQueenモード」だよ！"
"22020-96" = "[s] \"「UZQueen」モード……？\""
"22020-97-モモイ" = "説明しよう！「UZQueenモード」とは！#n特定の状況下で発動するユズのバフスキルだよ！"
"22020-98-モモイ" = "いつもよりちょっと大胆になって、頭の回転は普段の1.5倍！#n動体視力は2.8倍も上昇するの！"
"22020-99-ミドリ" = "そんな設定、いつの間につけたの？"
"22020-100-アリス" = "アリスも知っています！こういう時のユズはすごく強いです！#nアリスも「UZQueenモード」が欲しいです！"
"22020-101" = "[s] \"「UZQueenモード」ってすごいんだね……！\""
"22020-102-ユズ" = "せ、先生まで！？"
"22020-103-ユズ" = "そ、その……あうぅ……！"
"22020-104-ユズ" = "ふ、普通に頑張っただけ、なんだけど……。"
"22020-105-アリス" = "ユズの活躍を見ていたら、アリスもやる気が出てきました！"
"22020-106-アリス" = "次はアリスの番です！"
"22020-107" = "（そうしてみんなが見守る中、アリスの格ゲー挑戦が始まった）"
"22020-108" = "モモイ、ミドリ、ユズ――そして先生みたいに、#nアリスも格ゲーで勇者になります！"
"22020-109" = "お姉ちゃんは勇者というより、勇者に倒される役だと思うけど。"
"22020-110" = "妹よ！時には真実が痛い時もあるんだよ！？"
"22020-111" = "あ、アリスちゃん……が、がんばれ！"
"22020-112" = "はい！アリス、頑張ります！"
"22020-113" = "（Challengers Next Battle！！）"
"22020-114" = "[ns] \"あっ、挑戦者が現れたみたいだね。\""
"22020-115-アリス" = "モモイ相手に鍛えてきた腕前、見せます！"
"22020-116-アリス" = "やあっ！"
"22020-117-アリス" = "えい！やあっ！はっ！"
"22020-118-ユズ" = "全部回避されてる……。"
"22020-119-アリス" = "いいえ！まだアリスの攻撃は終わっていません！"
"22020-120-アリス" = "いきます！"
"22020-121-アリス" = "え！？#n今のは……"
"22020-122-モモイ" = "今、アリスが攻撃したのに、アリス側のHPが減ってなかった？"
"22020-123-アリス" = "ま、まだ！#nアリスはでき……"
"22020-124" = "[ns] \"今度はキャラクターが……消えた……？\""
"22020-125-アリス" = "え、ええっ！？"
"22020-126-ミドリ" = "アリスの後ろに……現れた！？"
"22020-127-アリス" = "あっ、ひゃっ……！#nあうっ！こ、攻撃！"
"22020-128-アリス" = "アリスの攻撃が相手を通過してしまいました！"
"22020-129-モモイ" = "うわっ！？今度はキャラクターが透明になってる！？"
"22020-130-ミドリ" = "それに……巨大化して画面全体を隠してるね。"
"22020-131-ユズ" = "こ、今度は……は、判定が消えちゃったみたい。"
"22020-132-アリス" = "う、うわーん！#nこのプレイヤーに勝てません！"
"22020-133" = "[s] \"これって、どう見ても……。\""
"22020-134-モモイ" = "何なのこいつ！どう見てもチート使ってるじゃん！"
"22020-135-ミドリ" = "ひどい……こんな方法で勝って、楽しいのかな。"
"22020-136" = "（Challengers Next Battle Again！！）"
"22020-137-モモイ" = "再戦要求！？#nどうせまたチートを使うつもりだよ！"
"22020-138-アリス" = "……どうしましょう？"
"22020-139" = "[s] \"相手がチートを使っているなら……勝つのは難しいかも……。\""
"22020-140-アリス" = "もう断っちゃおうよ！こんなチーターに付き合う必要ないよ！"
"22020-141-ミドリ" = "うん……アリスちゃん、残念だけど今回ばかりは……。"
"22020-142-ユズ" = "ま、まだ方法はあるよ……。"
"22020-143" = "[ns] \"ユズ？\""
"22020-144-アリス" = "……わたしに任せて。#nら、乱入するね。"
"22020-145" = "3"
"22020-146" = "2"
"22020-147" = "1"
"22020-148" = "（Battle！ START！）"
"22020-149-ユズ" = "！！！"
"22020-150-モモイ" = "あっ！また透明になるチートを使ったよ！"
"22020-151-モモイ" = "大丈夫。#nさっき見てたら、キャラクターは透明になるけど、影はそのままだったから……"
"22020-152-ユズ" = "影の長さを見て対処すればいい。"
"22020-153" = "[s] \"す、すごい……！そんな方法があったなんて！\""
"22020-154-ミドリ" = "どうみても当たってるのに、ダメージが通ってない！"
"22020-155-ミドリ" = "また無敵チートを……"
"22020-156-ユズ" = "多分、これは当たり判定を調整するチート。"
"22020-157-ユズ" = "それなら、当たり判定が関係ない、確定ダメージを与えればいい。"
"22020-158-ユズ" = "このキャラが持ってる挑発スキルは、#n妨害されなければ確定ダメージを与えられるから……"
"22020-159-アリス" = "モモイ！ミドリ！#nい、今の見ましたか！？"
"22020-160-モモイ" = "本当だ……。"
"22020-161-ミドリ" = "ダメージが通った！"
"22020-162" = "[ns] \"あっ！相手が急に猛攻撃を始めたよ！\""
"22020-163-ユズ" = "大丈夫。#n端でガードしたまま待機、フレームを読んで……"
"22020-164-ユズ" = "相手が攻撃した瞬間に……"
"22020-165-ユズ" = "後ろにジャンプ！#nそして強キックを出せば……"
"22020-166-モモイ" = "相手のキャラがダウン状態に！"
"22020-167-ユズ" = "これで牽制した時は、確定反撃ができないと絶対に近付けない。"
"22020-168-ユズ" = "相手の実力的に、多分できないと思ったから……"
"22020-169-ユズ" = "こうやって、一つ一つ相手の弱点を突いていけば……"
"22020-170-ユズ" = "勝てるよ。"
"22020-171" = "「WINNER！Player UZQueen！」"
"22020-172-ユズ" = "ふう……"
"22020-173-ユズ" = "これで……勝った、よね？"
"22020-174" = "[s] \"これが………UZQueen……！\""
"22020-175-モモイ" = "すごい！すごいよユズ！#n「すごい」って言葉じゃ全然足りないくらいすごい！"
"22020-176-アリス" = "はい！アリスも！ずっと夢中で見守ってました！"
"22020-177-ミドリ" = "相手がいくらチートを使っても、"
"22020-178-ミドリ" = "私たちには「ハメ技」がある……ってことだね。"
"22020-179-ユズ" = "うん……つ、使いすぎたらゲームが楽しくなくなっちゃうし、#nその……友達同士だと……ケンカになっちゃうから、好きじゃないけど……"
"22020-180-ユズ" = "相手がチート使いなら遠慮は要らないかなって……#nこ、これも、ゲーム要素の一つだし。"
"22020-181-アリス" = "なるほど！ハメ技もゲーム要素の一部！#nアリス、理解しました！"
"22020-182-ユズ" = "もしかしたら、再戦した時にハメ技を無力化するチートを使ってくるかもしれないけど……"
"22020-183-ユズ" = "……それでも、戦えば勝てるよ。"
"22020-184-ユズ" = "うん……わたし達は、ゲーマーだから。"
"22020-185" = "[s] \"ユズは本当にすごいよ。\""
"22020-186-ユズ" = "あっ、せ、先生まで……その、た、大したことではないです。"
"22020-187-モモイ" = "でも最後に勝てて、すごくスッキリしたー！"
"22020-188-ミドリ" = "これでゲームの分析もできた事だし……"
"22020-189-ミドリ" = "お姉ちゃん、企画会議を始めよっか？"
"22020-190-ミドリ" = "……ん、企画会議？何の？"
"22020-191-ミドリ" = "…………。"
"22020-192-モモイ" = "おね～ちゃ～ん！"
"22020-193-モモイ" = "そ、そ、そうだ！#nそうだったね！"
"22020-194-モモイ" = "も、もちろん、やるってば！"
"22020-195" = "（そうして、いつものようにゲーム開発部の日常は流れていく）"
"22020-196" = "次回;～アリス、冒険を始めます！～"
