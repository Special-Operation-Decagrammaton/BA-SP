[translation]
"22240-1" = "第24話;自分がなりたいもの"
"22240-2-モモイ" = "ここがアリスの……。"
"22240-3-ユズ" = "……心の中？"
"22240-4-ミドリ" = "ねえ、お姉ちゃん！ユズ！"
"22240-5-ミドリ" = "あそこ……！"
"22240-6-モモイ" = "アリス！！"
"22240-7-アリス" = "…………だれ？"
"22240-8-モモイ" = "私たちだよ！"
"22240-9-アリス" = "アリスちゃん！私たちが来たよ！"
"22240-10-ユズ" = "アリスちゃん！"
"22240-11" = "[s] \"アリス、大丈夫？\""
"22240-12-モモイ" = "モモイにミドリ……ユズ……？先生まで……？"
"22240-13-アリス" = "どうして、ここに……？"
"22240-14-ユズ" = "そりゃ、家出したアリスを迎えに来たんだよ！"
"22240-15-ミドリ" = "アリスちゃん、早くここから出よう！"
"22240-16-ユズ" = "帰ろう、アリスちゃん。"
"22240-17-アリス" = "あ……。"
"22240-18-アリス" = "アリスは……アリス、は……。"
"22240-19-？？？" = "王女よ、あなたが見てきた光景を忘れましたか？"
"22240-20-モモイ" = "だれ！？"
"22240-21" = "[ns] \"……＜Key＞。\""
"22240-22-ユズ" = "つまり、あれが……！"
"22240-23-ミドリ" = "アリスちゃんと同じ顔をしたあの人が……？"
"22240-24-ユズ" = "アリスちゃんを、ここに閉じ込めた元凶……？"
"22240-25" = "[ns] \"アリスが見てきた光景って、一体何の話？\""
"22240-26-Key" = "文字通りの意味です。"
"22240-27-Key" = "「王女様が」この空間で見聞きした光景の数々。"
"22240-28" = "[ns] \"これって……。\""
"22240-29-モモイ" = "私たちが……戦ってきた、姿……？"
"22240-30-モモイ" = "なんでこんなものを……。"
"22240-31-Key" = "エリドゥの監視網から見てきた光景。"
"22240-32-Key" = "それらすべて、あなた達がこの場に足を踏み入れるまでに戦い、#n走り、転んで、傷ついてきた光景です。"
"22240-33-Key" = "何故このような事が起きてしまうのか……。"
"22240-34-Key" = "その答えを、「王女」は既にご存知なのではないでしょうか？"
"22240-35-アリス" = "…………アリスは。"
"22240-36-アリス" = "アリスは、帰れません。"
"22240-37" = "[s] \"アリス……？\""
"22240-38-アリス" = "アリスがみんなのそばに居たら……"
"22240-39-アリス" = "みんなはその分、傷ついてしまいます。"
"22240-40-ミドリ" = "アリスちゃん、違う！そうじゃないよ！"
"22240-41-ミドリ" = "ミドリの言う通りだよ、アリスちゃん。わたしたちはそんな事……。"
"22240-42-アリス" = "ミドリ……ユズ……#nでも、アリスのせいでみんな怪我をしてしまいました……。"
"22240-43-アリス" = "モモイも……"
"22240-44-アリス" = "ミドリも、ユズも……"
"22240-45-アリス" = "ネル……先輩も……"
"22240-46-アリス" = "アリスは……勇者ではなく、魔王ですから。"
"22240-47-アリス" = "いつか世界を……"
"22240-48-アリス" = "キヴォトスを滅ぼすかもしれない、魔王として、生まれた……から……"
"22240-49-アリス" = "アリスが、いるから………そこに、居たいと、願ってしまうから………"
"22240-50-アリス" = "そんな……魔王は……みんなのそばにいては、いけません。"
"22240-51-アリス" = "大切な人たちが……苦しんで傷つくのなら……"
"22240-52-アリス" = "いっそ………"
"22240-53-アリス" = "アリスは……"
"22240-54-アリス" = "アリス、はこのまま消えるのが正しいのです。"
"22240-55-モモイ" = "『テイルズ・サガ・クロニクル2』は……！"
"22240-56-モモイ" = "私たちが、一緒に作ったゲームは！！#n特別賞をもらったよ！！！"
"22240-57" = "[ns] \"も、モモイ？\""
"22240-58-モモイ" = "キヴォトスの終焉？なに言ってるの？"
"22240-59-モモイ" = "アリスがいるだけでみんなが傷つく？"
"22240-60-モモイ" = "誰がそんなバカなことを言ってるの！？"
"22240-61-モモイ" = "アリスに会って……"
"22240-62-モモイ" = "アリスが居たから……！"
"22240-63-モモイ" = "私たちはゲームが作れて！#nミレニアムプライスで賞をもらって、部活を守る事ができたんだよ！"
"22240-64-ミドリ" = "うん、そうだよ。"
"22240-65-ユズ" = "……うん！"
"22240-66" = "[ns] \"そうだね、アリスがいたからできた事だよ。\""
"22240-67-アリス" = "モモイ……？"
"22240-68-モモイ" = "部活を守れたことも……ゲームを作って、一緒に遊んだ事も！"
"22240-69-モモイ" = "ただ怖いだけだったネル先輩と、一緒にゲームをするような仲になれたのも！"
"22240-70-モモイ" = "全部！ぜーんぶ！#nアリスがいてくれたからだよ！"
"22240-71-モモイ" = "それなのに、アリスが魔王だとか、そう生まれついただとか……。#nだから消えなきゃいけないとか！そんなの、全ッ然意味分かんない！！"
"22240-72-モモイ" = "そんなの絶対納得するもんか！"
"22240-73-ミドリ" = "うん、絶対に。"
"22240-74-ユズ" = "消えるのを……放ってなんか……おけないよ……"
"22240-75-アリス" = "……な、な、なぜ、ですか？#nみんな……どうして……"
"22240-76-アリス" = "アリスは……魔王なのに……"
"22240-77-アリス" = "アリスのせいで……みんな、怪我したのに……"
"22240-78-アリス" = "なんで、みんな……アリスを怖がったり……憎んだりしないで……"
"22240-79-アリス" = "そうやって……"
"22240-80-ユズ" = "だって！アリスちゃんは……"
"22240-81-ユズ" = "わたしたちの[ruby=友達]仲間[/ruby]だから……！"
"22240-82-アリス" = "……！"
"22240-83-ミドリ" = "この前……アリスちゃんが言ってくれたことがあったよね？"
"22240-84-ミドリ" = "『ファイナルファンタジア』、『ドラゴンテスト』、『トールズ・オブ・フェイト』、#n『竜騎伝統』、『英雄神話』、『アイズエターナル』……#nそして――『テイルズ・サガ・クロニクル』……。"
"22240-85-ミドリ" = "どんなゲームでも、主人公たちは……"
"22240-86" = "[s] \"決して、仲間を諦めないと。\""
"22240-87-モモイ" = "たとえアリスが魔王だったしても、そんなの関係ないよ……！"
"22240-88-モモイ" = "そんなの、ただのジョブにすぎない！"
"22240-89-モモイ" = "自分が誰なのか、それは自分自身で決めるものだよ！"
"22240-90-モモイ" = "アリスは、ただ自分がなりたいジョブを選んで転職すればいいんだよ！"
"22240-91-ミドリ" = "戦士、騎士、魔法使い、僧侶――なんでもいいよ、アリスちゃん。"
"22240-92-ミドリ" = "もちろん、他の職業でも。"
"22240-93-ユズ" = "その……勇者も、いるよ。"
"22240-94" = "[ns] \"だから、アリスの本音を聞かせてほしいな。\""
"22240-95-アリス" = "アリスは……魔王なのに……"
"22240-96-アリス" = "世界を……滅ぼしてしまう……のに……"
"22240-97-アリス" = "…………なのに……"
"22240-98-アリス" = "……それでも…………アリスは……"
"22240-99-アリス" = "そんなでも、いいんですか？"
"22240-100-アリス" = "冒険を……みんなと一緒に……"
"22240-101-アリス" = "クエストを、続けても……いいんですか？"
"22240-102-アリス" = "こんなアリスでも……？#n本当に……？"
"22240-103" = "[ns] \"うん。\""
"22240-104" = "[ns] \"もちろん。\""
"22240-105-アリス" = "それなら……も……がしたいです……"
"22240-106-アリス" = "アリスも！勇者になって……！#nみんなと……"
"22240-107-アリス" = "モモイ、ミドリ、ユズ。#nそして先生と……冒険を続けたいです……！"
"22240-108-アリス" = "魔王である……アリスが、そうしても、許されるのなら……！"
"22240-109-モモイ" = "うん！アリスがしたいならそれで十分！"
"22240-110-ミドリ" = "魔王だって、勇者になれるよ。"
"22240-111-モモイ" = "むしろ、最近だとそういうお話がヒットしてるからね！"
"22240-112-モモイ" = "もし……そういうブームがなかったとしても……#nわたしたちが、次回作として作ればいい……。"
"22240-113-モモイ" = "だって、私たち4人は、いろいろな想像を形にする事ができる……！"
"22240-114-ミドリ" = "何でも作る事ができる………！"
"22240-115" = "「ゲーム開発部」だから！"
"22240-116-アリス" = "――では、アリスは勇者になりたいです。"
"22240-117" = "[ns] \"うん。勇者になっていいんだよ。\""
"22240-118-アリス" = "アリスは……アリスになりたいです……！"
"22240-119" = "[ns] \"君がなりたい存在は、君自身が決めていいんだよ――アリス。\""
"22240-120-アリス" = "これは……！"
"22240-121-モモイ" = "勇者の剣……アリス！これ！"
"22240-122-ミドリ" = "勇者の剣を……！"
"22240-123-ユズ" = "抜くんだよ、アリスちゃん！"
"22240-124-アリス" = "……！"
"22240-125-アリス" = "……はい！"
"22240-126-Key" = "それは……！「王女」よ……あなたのその能力は……！"
"22240-127-Key" = "あなたのその力は、世界を滅ぼすために存在するというのに……！"
"22240-128-アリス" = "違います！アリスのこれは勇者の武器です！"
"22240-129-アリス" = "なぜなら！アリスがそう決めたからです！"
"22240-130-アリス" = "今のアリスは光属性の勇者……！"
"22240-131-アリス" = "光よ――――――！！！！"
"22240-132-Key" = "王女よ……あなた……は……。"
"22240-133-アリス" = "アリスのクラスは「王女」ではありません！"
"22240-134-アリス" = "アリスは……"
"22240-135-アリス" = "「勇者」です！！"
"22240-136-Key" = "理解……不能……。"
"22240-137-Key" = "……。"
"22240-138-リオ" = "……本当に、こんなことが可能だなんて……。"
"22240-139" = "[s] \"うん、できるよ。\""
"22240-140-リオ" = "しかし、私の計算では……こんな………"
"22240-141-リオ" = "どうやって……そんなバカな……"
"22240-142" = "[s] \"あの子たちに不可能はない。\""
"22240-143" = "[ns] \"それもそう、誰が何を言ったとしても……。\""
"22240-144-モモイ" = "はっ！？アリスは！？"
"22240-145-ミドリ" = "アリスちゃん！起きた！？"
"22240-146-ユズ" = "……アリスちゃん！"
"22240-147" = "[ns] \"あの子たちは、勇者とその[ruby=ゲーム開発部]パーティーメンバー[/ruby]だからね。\""
"22240-148" = "次回;ミレニアムサイエンススクール"
