[translation]
"22220-1" = "第22話;王女のためのパヴァーヌ（１）"
"22220-2-モモイ" = "あっ！あそこ！見て！"
"22220-3-チヒロ" = "……本当に倒すなんて。"
"22220-4-モモイ" = "ネル先輩すごい！"
"22220-5-モモイ" = "ユズちゃんもすごかった！全部、ユズちゃんの作戦のおかげだからね！"
"22220-6-ユズ" = "わ、わたしは……と、特に何か、したわけじゃ、ないから……"
"22220-7-ネル" = "…………。"
"22220-8" = "[ns] \"ネル……！大丈夫！？\""
"22220-9-ネル" = "……しびれる。"
"22220-10" = "[s] \"……え？\""
"22220-11-ネル" = "身体がしびれて……動けねぇ……。"
"22220-12-ネル" = "クソ、あんま騒ぐな……頭に響く……#n……大丈夫だ、ちょっと休んだら良くなる。"
"22220-13-ネル" = "つーか、うちの連中は？"
"22220-14" = "[s1] \"みんな無事だよ。しばらくは動けないと思うけど。\"\n[s2] \"先に上がって、ネルの世話を頼んだって言ってたよ。\""
"22220-15-ネル" = "……そうか。#nは、誰が誰の世話をしろっていうのやら。"
"22220-16-ネル" = "……そうか。#nは、誰が誰の世話をしろっていうのやら。"
"22220-17-ネル" = "……おい、チビども。"
"22220-18-モモイ" = "う、うん？"
"22220-19-ネル" = "アカネやアスナ、カリンと……あたしらがここまで繋いできた。"
"22220-20-ネル" = "あとはもう一つだけだろ。"
"22220-21-ネル" = "そいつ、ぜってぇ連れ戻せよ。"
"22220-22-モモイ" = "うん！"
"22220-23" = "[s] \"ありがとう、ネル……みんな、行こう！\""
"22220-24-モモイ" = "着いた！"
"22220-25-ミドリ" = "ここがエリドゥ中央タワーの最上階……"
"22220-26-ユズ" = "（……ゴクッ）"
"22220-27-チヒロ" = "地図によると、ここのどこかにアリスがいるはず。"
"22220-28-リオ" = "そう、アリスならここにいるわ。"
"22220-29-ユズ" = "会長……！"
"22220-30-ミドリ" = "……！"
"22220-31-モモイ" = "まだ戦うつもり！？"
"22220-32-リオ" = "いいえ。トキが倒れた時点で、私が持っている手札はすべて消えた。"
"22220-33-リオ" = "認めましょう……私の負けよ。"
"22220-34" = "[s] \"リオ……。\""
"22220-35-リオ" = "本当に……貴女たちはここまで来たのね。"
"22220-36-リオ" = "近い将来、キヴォトスの脅威になる事が確定しているあの子を救うために……"
"22220-37-リオ" = "遮るものをすべてを薙ぎ払って……。"
"22220-38-リオ" = "当たり前だよ！最初からそう決めてたからね！"
"22220-39-リオ" = "アリスが、[ruby=  ・    ・    ・    ・    ・    ・    ・    ・    ・    ・    ・  ]キヴォトスに終焉を招く[/ruby]としても？"
"22220-40-モモイ" = "急に何？アリスの事そんな風に言わないでよ！"
"22220-41-モモイ" = "私は、ただ……"
"22220-42" = "[ns3] \"リオが何を根拠に動いたのかは分からない。\"\n[ns4] \"でも、一つだけはっきりと言えるよ。\""
"22220-43" = "[ns5] \"リオは、誰にも相談せず、一人で全てを判断して結論づけた。\"\n[ns6] \"そして、君が正しいと信じる事を他人に強要した。\""
"22220-44-リオ" = "……！！"
"22220-45-リオ" = "……！！"
"22220-46-リオ" = "先生……貴方も、私の行動が独善だと言うの……？"
"22220-47-リオ" = "でも……私は……！！"
"22220-48-リオ" = "私、は……"
"22220-49-チヒロ" = "先生、アリスの場所が分かったよ。"
"22220-50-チヒロ" = "その部屋の隅に、電力が集中する施設があるはず。アリスはそこにいる。"
"22220-51-モモイ" = "ミドリ！ユズ！"
"22220-52-ユズ" = "うん！お姉ちゃん！"
"22220-53" = "[ns] \"リオ、続きはこの後にしようか。\""
"22220-54-リオ" = "…………。"
"22220-55-モモイ" = "アリス！お待たせ！"
"22220-56-アリス" = "アリスちゃん！"
"22220-57-ユズ" = "アリスちゃん……。"
"22220-58-アリス" = "…………。"
"22220-59" = "[ns] \"アリス……？\""
"22220-60-モモイ" = "な、なにが起きてるの！？"
"22220-61-ミドリ" = "あ、あそこのモニターが……！"
"22220-62-リオ" = "これは………！！"
"22220-63-チヒロ" = "ぃま……急に……な…が……！？"
"22220-64-チヒロ" = "通信が……き……"
"22220-65-チヒロ" = "……み…な……応答……！？"
"22220-66" = "[ns] \"チヒロ……！\""
"22220-67-リオ" = "エリドゥのシステム全体が……ハッキング…………"
"22220-68-リオ" = "いえ、これは単純なハッキングではない……"
"22220-69-リオ" = "都市全体が「何か」に変質していっている？"
"22220-70-モモイ" = "こんな事してる場合じゃない！早くケーブルを外してアリスを……！"
"22220-71-？？？" = "その行為は推奨しません。"
"22220-72-モモイ" = "！！"
"22220-73-？？？" = "現在「王女」の表層人格は内部データベースの深層部に隔離されています。"
"22220-74-？？？" = "強制的に接続を解除すると、取り返しのつかない損傷が起こるでしょう。"
"22220-75-モモイ" = "アリス……！？一体何を……？"
"22220-76-ミドリ" = "お姉ちゃん、これアリスじゃないよ……"
"22220-77-？？？" = "アリス……？"
"22220-78-？？？" = "それは、あなた達が私たちの「王女」を呼ぶ際の名称……。"
"22220-79-？？？" = "「王女」に名前は不要です。#n名前は存在の目的と本質を乱します。"
"22220-80-ミドリ" = "何を言ってるの！？ねえ、あなたは誰！アリスちゃんを返して！"
"22220-81" = "私の個体名は＜Key＞。"
"22220-82-Key" = "王女を助ける無名の司祭たちが残した修行者であり、#n彼女が戴冠する玉座を継ぐ「鍵」＜Key＞です。"
"22220-83" = "[s] \"……なに？\""
"22220-84-Key" = "彼女は「王女」であり、私は「鍵」。#nそれが私たちの存在であり目的。"
"22220-85-Key" = "今、我々を妨害していた攻撃が止まったことを確認しました。"
"22220-86-Key" = "只今よりエラーを修正し、本来あるべき玉座に「王女」を導かせていただきます。"
"22220-87-Key" = "AL-1Sに接続された利用可能リソースを確保するため、全体検索を実行。"
"22220-88-Key" = "リソース領域の拡大。"
"22220-89-Key" = "リソース名、要塞都市「エリドゥ」の全体リソース――1万エクサバイトのデータを確認。"
"22220-90-Key" = "………現時刻をもって、プロトコルATRAHASIS稼動。"
"22220-91-Key" = "コード名「アトラ・ハシースの箱舟」起動プロセスを開始します。"
"22220-92-リオ" = "……！！#nアトラ・ハシース……！？"
"22220-93-Key" = "プロセスサポートのため[ruby=Divi:Sion]追従者[/ruby]を呼び出します。"
"22220-94-リオ" = "……エリドゥ各地で、[ruby=Divi:Sion]追従者[/ruby]の出現……？"
"22220-95" = "[s] \"リオ……一体これは何が起きてるの？アリスは……。\""
"22220-96-リオ" = "いえ、そんなはずが……私の計算は……でも……！"
"22220-97-リオ" = "私は……キヴォトスに終焉がもたらされることを懸念して、#nこの要塞都市エリドゥを建設した。"
"22220-98-リオ" = "私が動員できるミレニアムのすべての技術と力、エネルギー、#nそして資源をここに集めたというのに……。"
"22220-99-リオ" = "けれど……むしろ、そのせいで……この都市が……"
"22220-100-リオ" = "終焉の発端に……？"
"22220-101-リオ" = "私は……"
"22220-102-リオ" = "――間違っていた？"
"22220-103-Key" = "箱舟製作に必要なリソース確保23%…………。"
"22220-104-Key" = "……46%…………。"
"22220-105-リオ" = "先生！このままでは……！"
"22220-106-リオ" = "このまま、エリドゥのすべてのリソースを奪われてしまったら、#nキヴォトスが終わってしまう。"
"22220-107-リオ" = "決断を下さなければ……！"
"22220-108" = "[s] \"……決断？\""
"22220-109-Key" = "王女は鍵を手に入れ、箱舟は用意された。"
"22220-110-Key" = "無名の司祭の要請により、この地に新しい「サンクトゥム」を建立する。"
"22220-111-Key" = "その到来で初めて、すべての神秘はアーカイブ化され――"
"22220-112-リオ" = "このままでは、世界が滅びる……！！"
"22220-113-AMAS A" = "みんなと一緒に逃げてちょうだい、先生。"
"22220-114" = "[s] \"逃げてって、リオ……いったい何を。\""
"22220-115-AMAS A" = "今からこの都市自体が変貌し、箱舟という新しい概念に歪曲される。#nそうしたら……このキヴォトスは……。"
"22220-116-AMAS A" = "私のせいよ……。"
"22220-117-AMAS A" = "私がこの都市を作らなかったら、最初からこんな事にならなかったのに……。"
"22220-118-AMAS A" = "私が……私のせいで……。"
"22220-119-AMAS A" = "だから私が、止めないと……。"
"22220-120-ユズ" = "ど、どういう意味ですか……？"
"22220-121-AMAS A" = "……私一人で、システムを止めてみせるわ。"
"22220-122" = "[s] \"……リオ。\""
"22220-123-AMAS A" = "私の命一つで……世界の終焉を防ぐことができるというのなら#nそうするわ――そうしなければならない。"
"22220-124-AMAS A" = "……早く！！これは極めて論理的な選択よ、先生！"
"22220-125" = "[ns] \"トロッコ問題について……話してたよね。\""
"22220-126" = "[ns7] \"トロッコ問題には二つの選択肢しかない。\"\n[ns8] \"君はそこで犠牲の少ない方を選ぼうとしたわけだし。\""
"22220-127-AMAS A" = "私は……。"
"22220-128-AMAS A" = "私は……。"
"22220-129" = "[ns] \"……それが君の優しさなんだね、リオ。\""
"22220-130" = "[ns] \"でも二つの選択は、誰かが犠牲になる結果しかないのであれば……。\""
"22220-131" = "[ns] \"私はその質問自体が間違っていると答えるよ。\""
"22220-132-AMAS A" = "それは……問題の答えではないわ、先生。ただの詭弁よ。"
"22220-133-AMAS A" = "思考実験の前提条件を否定するのは、ただの屁理屈でしかないわ。"
"22220-134" = "[s] \"レバーを引く人が、見落としたものがあるんじゃないのかな？\""
"22220-135-AMAS A" = "……！？"
"22220-136" = "[s] \"本当に周囲に手を差し伸べてくれる人がいなかったのか、とか。\""
"22220-137-AMAS A" = "……！？"
"22220-138-Key" = "……73%………………89%…………"
"22220-139-Key" = "リソース確保99%……………………。"
"22220-140" = "[ns] \"私は、全員で力を合わせて「全てを救う」選択肢を選びたい。\""
"22220-141-リオ" = "そ、そんな選択肢はないわ……。"
"22220-142-ユウカ" = "ノア！今よ！#n電力という電力を全部落としちゃって！"
"22220-143-ノア" = "は～い、ユウカちゃん。#nその言葉を待ってました♪"
"22220-144-ノア" = "えいっ！"
"22220-145" = "次回;王女のためのパヴァーヌ（２）"
