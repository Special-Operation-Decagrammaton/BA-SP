"102145-7-ハスミ" = "うん。コハルちゃんは大丈夫だよ。#nちょっと怪我してるけど。"
"102145-8-ハスミ" = "……。"
"102145-9-ハスミ" = "……え？なになに？#n本当に、今度は何もしてないってば☆"
"102145-10" = "そ、そうです……ハスミ先輩……#nその、この方は……私を助けてくれて……"
"102145-11-マシロ" = "行きましょう、コハルさん。"
