"102145-3-コハル" = "は、ハスミ先輩……マシロ……"
"102145-4-トリニティの生徒D" = "よかった！正義実現委員会だ！"
"102145-5-トリニティの生徒C" = "助けに来てくれたんですね！あの魔女が――"
