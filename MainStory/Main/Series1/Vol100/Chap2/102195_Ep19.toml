[translation]
"102195-1-カイテンレッド" = "はっはっはっはっ！こちらも無事に片付いたな！"
"102195-2-カイテンピンク" = "では、皆の衆！また機会があれば会いたいものだな！"
"102195-3-カイテンピンク" = "回り続けるレールはやがて……正義の未来へと繋がる！"
"102195-4-カイテンピンク" = "無限回転寿司戦隊・カイテンジャー！退場！"
"102195-5-ヒフミ" = "……。"
"102195-6-アズサ" = "彼女らは一体何者だったんだろう……。"
"102195-7-トキ" = "こちら、処理完了しています。ヒマリ部長。"
"102195-8-エイミ" = "トキ……？"
"102195-9-ヒマリ" = "……あら早い。なかなか優秀ですね。#nそれでは、次の座標を指定しますので、そちらに移動していただけますか？"
"102195-10-トキ" = "イエス、マム。"
"102195-11" = "……トキ、大丈夫？無理してない？"
"102195-12-トキ" = "心配してくださりありがとうございます、エイミ。私は大丈夫です。#nまだ「武装」のエネルギーも残っていますから。"
"102195-13-ヒマリ" = "トキ、「[ruby=Abi-Eshuh]アビ・エシュフ[/ruby]」の能力は……「名もなき神」の技術が一部反映されていると仮定しても、要塞都市「エリドゥ」があったからこそ発揮できたものです。"
"102195-14-ヒマリ" = "未知の領域が多い技術を制御すべく、都市一つをまるごと使用したからこそ、破壊的な性能を――いえ、悪趣味と言える性能を引き出せたのです。"
"102195-15-ヒマリ" = "それを用いて「名もなき神々の王女」と戦うというリオの計画も、決して無謀な話ではなかったのかもしれません……"
"102195-16-ヒマリ" = "ですが「エリドゥ」が解体されてしまった今、その「武装」に以前と同等の性能は期待できないでしょう。"
"102195-17-ヒマリ" = "今は平凡なスーツと考えるべきかと……いいですね？"
"102195-18-トキ" = "……イエス、マム。"
"102195-19-ヒマリ" = "……いえ、平凡なスーツではありませんね。超天才ハッカーの私が手を加えたのですから……反則レベルとまではいかないものの、天才の息吹を感じられる……素晴らしいマスターピースと言えるでしょう。"
"102195-20-トキ" = "はい。ありがとうございます、ヒマリ部長。"
"102195-21" = "……トキ、私も手伝おうか？"
"102195-22-トキ" = "大丈夫です、エイミ。一人で戦うのには慣れていますから。"
"102195-23-トキ" = "目標地点に到着次第、再び連絡します。それでは。"
"102195-24-エイミ" = "なんか、寂しいね。"
"102195-25-エイミ" = "元々トキはC&Cですから。#nもしかしたら、エージェントと一緒に戦いたかったのかもしれません。"
"102195-26-エイミ" = "一緒に戦えばいいんじゃないの？"
"102195-27-ヒマリ" = "そうですね……自分にそんな資格は無い、と悩んでいるのかもしれません。"
"102195-28-エイミ" = "ん－……でも、トキは命令に従っただけだよ。"
"102195-29-ヒマリ" = "ええ。元凶はビッグシスターにあります。"
"102195-30-ヒマリ" = "……とはいえ、自分に全く非が無い、とも割り切れないのでしょう。"
"102195-31-エイミ" = "そっか……難しいね。"
"102195-32-ヒマリ" = "……ええ。不器用な人たちです。#nトキも、リオも。"
"102195-33" = "次回;最終防衛戦「シャーレ」"
