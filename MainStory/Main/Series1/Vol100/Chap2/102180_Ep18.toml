[translation]
"102180-1" = "第18話;大雪原の中で"
"102180-2-イズナ" = "う、うわぁっ！部長！こっちも塞がれてしまいました！"
"102180-3-ミチル" = "うっ、一体どうなってるの……大雪原は比較的安全だって聞いてたのに……"
"102180-4-ミチル" = "敵がこんなにいるなんて聞いてないよー！"
"102180-5-ツクヨ" = "ま、まさか……私たちの後をつけて来たのでしょうか……？"
"102180-6-イズナ" = "イズナたちをですか！？#nどうやって特別任務のことを――"
"102180-7-ミチル" = "いや、この任務の事は誰にも言ってないし、そもそもそんな時間もなかったよ！"
"102180-8-マコト" = "……キキキッ。"
"102180-9-イズナ" = "こ、こっちも……！囲まれてしまいました！#nど、どうしましょう、部長？"
"102180-10-ツクヨ" = "こ、このままじゃ、私たち……"
"102180-11-イズナ" = "だぁーっ！弱音を吐くんじゃない！！"
"102180-12-イズナ" = "部長……"
"102180-13-ツクヨ" = "部長……！"
"102180-14-ツクヨ" = "先生が、私たち忍術研究部を信じて任せてくれた任務だよ！#nこの程度のトラブルで失敗するわけにはいかないの！"
"102180-15-ツクヨ" = "そう――「忍者とは、一度交わした約束は必ず守るもの」！"
"102180-16-ミチル" = "ツクヨ、イズナ！「忍者」の絆を、見せつけるよ！"
"102180-17-ツクヨ" = "……絆の力、ですね！はいっ、部長！"
"102180-18-イズナ" = "はい！イズナも主殿との約束、必ず守ってみせます！"
"102180-19-ミチル" = "よし、いっくよー！！"
"102180-20-ミチル" = "ミチル流忍法っ！！"
"102180-21-ミチル" = "イズナ流忍法！"
"102180-22-ミチル" = "つ、ツクヨ流、忍法……！"
"102180-23-マコト" = "今だ、いくぞ！！"
"102180-24-マコト" = "「超無敵鉄甲「[ruby=とらまる]虎丸[/ruby]」」！！"
"102180-25-マコト" = "降下！！！"
"102180-26-イロハ" = "そのネーミングはもうちょっとなんとか……はぁ……"
"102180-27-イロハ" = "はい、降下しますね。"
"102180-28-ツクヨ" = "……？#nあ、あれ……？"
"102180-29-ツクヨ" = "この音は……"
"102180-30-イズナ" = "部長、ツクヨ殿！！#n上を見てください、飛行船です！"
"102180-31-ミチル" = "な、何あれ！？何かが降ってきてる！？"
"102180-32-ミチル" = "なっ、何……"
"102180-33-イズナ" = "こ、これは……！"
"102180-34-ツクヨ" = "戦車が……！？#n降って、きました……！"
"102180-35-マコト" = "キキキッ！バッチリのタイミングだったぞ、イロハ！"
"102180-36-イブキ" = "あははっ！すっご～い！降下～！"
"102180-37-イロハ" = "……ああ、はい。#nところで先輩、何でここに来たんですか？"
"102180-38-マコト" = "知らないのか？危機に瀕した仲間を助けるために決まってるだろう！"
"102180-39-イロハ" = "……はい？"
"102180-40-マコト" = "ああ、そうだ！正義の味方になるためだとも！！#nイブキが愛してやまない忍者のためにな！！"
"102180-41-イブキ" = "こんにちは、忍者のおねえちゃんたち！#nイブキが助けに来たよ～！！"
"102180-42-ツクヨ" = "あっ、あの声は……！"
"102180-43-ツクヨ" = "い、イブキ……！？"
"102180-44-イズナ" = "イロハさん、まで……どうして、ここに……？"
"102180-45-マコト" = "キキキッ……このマコト様の情報網を甘く見てもらっては困る。#n危険な任務に忍者があたるという情報を掴んでいたのだ！"
"102180-46-マコト" = "イブキの愛する忍者たちが怪我でもしたら、イブキが悲しむことは目に見えている。"
"102180-47-マコト" = "だから上空で見守りつつ、危機一髪の瞬間を狙っていたのだ！"
"102180-48-イロハ" = "……はぁ。"
"102180-49-イロハ" = "じゃあ、ここに来たのも……イブキのために？"
"102180-50-マコト" = "ああ、そうだとも！！イブキの好感度を上げるための絶好のチャンスを、みすみす逃すわけがあるまい！！"
"102180-51-マコト" = "前回のプリン事件以降、イブキが目も合わせてくれないのだからな！"
"102180-52-イロハ" = "……イブキが大事に取っておいたプリンを食べるからでしょ。"
"102180-53-マコト" = "お前のプリンだと思っていたのだ！"
"102180-54-イロハ" = "私のプリンでも良くないですよ……？"
"102180-55-イブキ" = "あの時のマコト先輩は嫌いだったけど、もう大丈夫！マコト先輩だーい好き！！"
"102180-56-マコト" = "キャハハハハハハハッ――！！聞いたかイロハ？#n分かったら今すぐあの忍者たちを助けろ！！"
"102180-57" = "超無敵鉄甲「[ruby=とらまる]虎丸[/ruby]」！！"
"102180-58" = "はぁ、分かりましたよ……出撃。"
"102180-59" = "おねえちゃんたち！イブキが助けるからね！"
"102180-60-ツクヨ" = "た、助けに、来てくれたのですね！ありがとう、ございます！"
"102180-61-ミチル" = "それじゃ！行くよ！"
"102180-62-イズナ" = "はい！！"
