"102040-171-アユム" = "ありがとうございます……第6サンクトゥムの守護者はまだ確認できていませんが、6つのサンクトゥムの中では最も強力なエネルギーを持っていますので……"
"102040-172-モモカ" = "守護者が現れたら避難完了したエリアに誘導して、そこで作戦を開始するよ～"
"102040-173-アズサ" = "ヒフミ、私たちはD.U.の外郭を巡回し、守護者を探す――[ruby=いわゆる]所謂[/ruby]、偵察部隊だ。"
"102040-174-アズサ" = "あう……どうして私たちが……"
"102040-175-アズサ" = "それはヒフミの操縦の腕がすごいからだろう。#nヒフミを守るのは私一人で十分だからな。"
"102040-176-アズサ" = "あの時は30人の正義実現委員会を一掃できたが……今ならその2倍来ようと問題ない。"
"102040-177-アズサ" = "そ、そういうつもりではなかったのですが……あうう……"
