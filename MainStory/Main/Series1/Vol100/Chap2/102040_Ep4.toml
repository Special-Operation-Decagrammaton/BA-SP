[translation]
"102040-1" = "第4話;作戦準備（２）"
"102040-2-ミサキ" = "これは…… "
"102040-3-ミサキ" = "そ、空が赤く染まって……な、何が起こっているんでしょうか……"
"102040-4-ミサキ" = "……先生からメッセージが届いたよ。#n手伝いが必要みたい。"
"102040-5-ミサキ" = "で、でも……私たちが行って助けになるのでしょうか？#n追われている身なのに……むしろ、先生に迷惑をかけるんじゃ……"
"102040-6-アツコ" = "そんなことないよ、きっと大丈夫。#nなんとか手伝えないか、方法を探そう。"
"102040-7-ミサキ" = "私たちでも、手伝えること……"
"102040-8-ミサキ" = "……そこにいるのは誰？"
"102040-9-ヒヨリ" = "ま、まさか追手が！？"
"102040-10-アツコ" = "……。"
"102040-11-怪しいヘルメット団" = "……。 "
"102040-12-ヒヨリ" = "！？"
"102040-13-アツコ" = "……。"
"102040-14-アツコ" = "……。"
"102040-15-怪しいヘルメット団" = "やっと見つけた。#nここにいたのか……"
"102040-16-ヒヨリ" = "み、ミサキさん！？いきなりそんな……"
"102040-17-ミサキ" = "誰？あんた。"
"102040-18-アツコ" = "すごく怪しい人……。"
"102040-19-怪しいヘルメット団" = "ま、待て。私は……！"
"102040-20-怪しいヘルメット団" = "ああ、そうか。このヘルメットはアルバイトで――"
"102040-21-アツコ" = "……なんてね。おはよう、サッちゃん。#n自分探しはお休み中？"
"102040-22-サオリ" = "……ああ。"
"102040-23-ミサキ" = "自分探しだなんて、よく言うよ。#nただの家出でしょ。"
"102040-24-ヒヨリ" = "リーダー……。"
"102040-25-サオリ" = "すまない……積もる話をしたいところだが、今は時間が無い。#n先生を助けなくては。"
"102040-26-ミサキ" = "うん。私たちにも連絡来たよ。"
"102040-27-ミサキ" = "は、はい！そうなんです！"
"102040-28-ミサキ" = "元気そうでよかった、リーダー。"
"102040-29-サオリ" = "……ああ。"
"102040-30-ミサキ" = "じゃ、行こうか。"
"102040-31-ハナコ" = "第4サンクトゥムの作戦担当、[ruby=うらわ]浦和[/ruby]ハナコです♡"
"102040-32-ハナコ" = "みなさん、準備はできましたか？ "
"102040-33-ヒナタ" = "……はい。#nシスターフッド部隊、サンクトゥムのカタコンベ前で待機中です。"
"102040-34-シスターフッド" = "ところで……サクラコ様は一体、どちらに……"
"102040-35-ミネ" = "救護騎士団、作戦地点にて待機しております。"
"102040-36-ミネ" = "よ、よろしくお願いします！"
"102040-37-ノア" = "第5サンクトゥムはいかがですか？#n報告をお願いします。"
"102040-38-チヒロ" = "……こっちは少し問題発生中。"
"102040-39-チヒロ" = "あら、どうされました？"
"102040-40-コタマ" = "「ホド」が要塞都市の地下に潜った。#n現在位置を確認してるけど……"
"102040-41-コタマ" = "要塞都市エリドゥの地下は、リオ会長が作った暗号で保護されています。#nハッキングも、振動も、音の感知も不可能でした。"
"102040-42-ノア" = "……リオ会長の？#nですが、会長はいま……"
"102040-43-ハレ" = "そう。#nだから、今暗号を解読するために演算を進めているところ。"
"102040-44-チヒロ" = "幸い、暗号はそこまで難しくないと思う……でも、時間がかなりかかってしまうのが問題。"
"102040-45-ハレ" = "はぁ……このままだと作戦時間に間に合わないかも……"
"102040-46-ノア" = "えっ、一大事じゃん！#nでも、こっちはサンクトゥムの分析をやってるから手伝えないし――"
"102040-47-ノア" = "マキさんは今まで通り第1サンクトゥムに集中を。#nエンジニア部の皆さん、余力はありますか？"
"102040-48-ウタハ" = "いや、こちらも各エリアのインベイドピラーを破壊しようとしてるけど……こっちも難航してるところでね。"
"102040-49-ヒビキ" = "はぁ……答えが見つからない……近づくことすらできないよ。"
"102040-50-ウタハ" = "サンクトゥムの素材分析も並行しているから、体力的にも限界でね……すまないが、これ以上の仕事は請け負えない。"
"102040-51-ヒビキ" = "もっと睡眠を～……いえ、カフェイン摂取で……妖怪MAXを……"
"102040-52-ヒビキ" = "やっぱ、普段からもうちょっと運動して体力つけておけば良かった……"
"102040-53-ウタハ" = "いま言っても仕方ないさ。"
"102040-54-ノア" = "困りましたね……あちらも余力は無さそうです。 "
"102040-55-ノア" = "流石はビッグシスター……いなくなってなお、問題の種を生むだなんて――"
"102040-56-チヒロ" = "ヒマリ！"
"102040-57-チヒロ" = "以前、ミレニアムの債券が偽造されたことがありましたよね？"
"102040-58-ヒマリ" = "債券発行のセキュリティシステムも、リオが構築したものですが――#nあの時はどのように解決したのですか？"
"102040-59-ヒマリ" = "ん？あれはヒマリの仕業じゃないの？#n私たちは倫理に背くようなことはしないよ。"
"102040-60-ヒマリ" = "あら、心外ですね。私だってしません。#nあの時は忙しくて、そんなイタズラをする暇もありませんでしたので……"
"102040-61-チヒロ" = "……じゃあ、あれは一体誰の仕業なの？"
"102040-62-ノア" = "……ユウカちゃん、聞いていましたか？ "
"102040-63-ユウカ" = "はぁ……聞いてるわよ。"
"102040-64-ユウカ" = "ノア、今から反省部屋の前に来て！"
"102040-65-ノア" = "はい。#n――それでは後ほど。"
"102040-66-ヒビキ" = "……インベイドピラーの攻略は……これが限界、かも。"
"102040-67-ヒビキ" = "……ピラー周辺に穴を掘って、地面から分離……そして焼き尽くす――"
"102040-68-ウタハ" = "本当にこの方法しか無いのかい？"
"102040-69-ヒビキ" = "他の方法を模索したかったけど……現状だとこれが精一杯の最善策、かな……"
"102040-70-ヒビキ" = "だが、この規模の工事は、もはや都市開発レベルの……"
"102040-71-ウタハ" = "うーん、何か別の手は無いだろうか……土木工事用のドローンを今から作るのは――"
"102040-72-コトリ" = "雷ちゃんに火炎放射器を付けるのはどうでしょう？#nスコップとハンマーを……"
"102040-73-ウタハ" = "それだけだと少し……"
"102040-74-？？？" = "はぁ～い！"
"102040-75-コトリ" = "あ、あなた達は一体！？"
"102040-76-温泉部の部員A" = "今日も今日とて、温泉開発日和だねー！"
"102040-77-ヒビキ" = "温泉……"
"102040-78-ウタハ" = "開発部……！？"
"102040-79-コトリ" = "お、温泉ですか？ここにそんなものは――"
"102040-80-？？？" = "ハーハッハッハッハ！そこに温泉があるから我々がいる！いや、たとえ温泉がなくても我々がいる！"
"102040-81-カスミ" = "細かいことは気にするな。#nそこは我々が担当しよう。"
"102040-82-ウタハ" = "う、うん……？"
"102040-83-メグ" = "掘って掘りまくって、建物を撤去して、全てを燃やし尽くしちゃえばいいんだよね？#nさあ温泉開発の時間だよ～！！"
"102040-84-メグ" = "最終的に温泉にたどり着ければ良いのだからな！難しく考える必要など無い！"
"102040-85-温泉部の部員A" = "それに、ミレニアムの地下にはどんな温泉があるのかずっと気になっていてね。つまり、絶好の機会というわけだ！"
"102040-86-一同" = "「「ハーッハッハッハッハ！！！」」"
