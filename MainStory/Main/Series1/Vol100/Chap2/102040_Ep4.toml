"102040-164-フウカ" = "いや、そんな仲じゃないけど……"
"102040-165-フウカ" = "……まぁいいや。#n助けてもらったのは事実だし……ありがとね。"
"102040-166-アカリ" = "ふふっ、とんでもありません。"
