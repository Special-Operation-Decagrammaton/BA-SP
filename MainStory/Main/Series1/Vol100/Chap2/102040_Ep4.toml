"102040-193-ツクヨ" = "ツクヨ、忍術研究部の参戦を知らせる場面だよ！#nもっと存在感アピールしてこ！"
"102040-194-ツクヨ" = "そ、そうなんですか……？#nわ、私は、今でも十分、存在感がある気が……"
