"102040-100-ノア" = "ふふ、仕方ないですね。"
"102040-101-？？？" = "うわああっ！？こ、来ないで！#n先輩怖い！やだ！無理！パワハラ反対！！"
"102040-102-ユウカ" = "な、なんなんですか！今まで大人しくしてたじゃないですか！#n問題も起こしてないし、脱出だってしてないのになんで！酷い！暴力反対！冤罪ですよ！！"
"102040-103-ノア" = "あのねぇ……あんたがここにいるのは、自分で起こした問題のせいでしょうが！#nどこが冤罪だって言うのよ！？"
