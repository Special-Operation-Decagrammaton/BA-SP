"102040-112-コユキ" = "へ、へっ……？えっと、その‥…最初から[ruby=ずさん]杜撰[/ruby]な暗号システムがいけないんじゃないですか？なので――"
"102040-113-ノア" = "コ～ユ～キ～ちゃ～ん？"
"102040-114-コユキ" = "ええっと……その……"
"102040-115-コユキ" = "せ、先輩……その顔、マジで怖いんでやめてください……"
"102040-116-コユキ" = "先輩の言う通り、私が間違ってました……"
"102040-117-ノア" = "反省は？"
"102040-118-コユキ" = "は、はい……反省してます……"
"102040-119-ノア" = "ふふっ、いい子ですね。"
"102040-120-ノア" = "ほら、ユウカちゃん。#n見ての通りコユキちゃんも反省しているみたいですよ？"
"102040-121-ユウカ" = "なんでノアに対しては大人しいわけ！？"
