"102040-189-ツクヨ" = "と、到着しました……"
"102040-190-ミチル" = "コホン！忍術研究部の部長、[ruby=ちどり]千鳥[/ruby]ミチル見参！#nここに参戦の意志を宣言するよ！"
"102040-191-イズナ" = "け、見参……ここに……宣言を……"
