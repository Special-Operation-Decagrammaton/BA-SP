[translation]
"102100-1" = "第10話;「百鬼夜行」自治区防衛"
"102100-2-カホ" = "いよいよ、私たちの番ですね。 "
"102100-3-カホ" = "百鬼夜行自治区の防衛戦を、始めます！"
"102100-4-ツバキ" = "うん～行こっか。"
"102100-5-チセ" = "しゅっぱ～つ。"
"102100-6-フィーナ" = "任侠への第一歩！スタート、デス！"
"102100-7-魑魅一座A" = "あたしらも行くよ！突撃ー！"
"102100-8-魑魅一座" = "うおおお――！"
"102100-9-シズコ" = "避難所は準備万端です！各種補給も、私たちお祭り運営委員会で支援しますよ～！"
"102100-10-ウミカ" = "はい、社長！#nお祭りみたいに賑やかになってきて、なんだかワクワクしちゃいます！"
