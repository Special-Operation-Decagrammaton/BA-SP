[translation]
"102090-1" = "第9話;第2サンクトゥム「ミレニアム郊外の閉鎖地域」"
"102090-2-エイミ" = "第2サンクトゥムの攻略、始めるよ。#n防衛隊、準備できた？"
"102090-3-ツルギ" = "準備完了。"
"102090-4-ツルギ" = "私はツルギ先輩の後方支援っすね。#nまぁ、先輩一人でも大丈夫な気はしますが……準備おっけーっす。"
"102090-5-エイミ" = "OK。パラシュート隊はどう？"
"102090-6-アカネ" = "はい、先ほどダクトから潜入できました。"
"102090-7-カリン" = "今は軍需工場の中心部に向かっている。"
"102090-8-アスナ" = "あははっ！パラシュート、久々で楽しかったね～！"
"102090-9-ネル" = "こっちはいつでも行けるぞ。さあ、とっとと始めようぜ！"
"102090-10-エイミ" = "うん。改めて、作戦内容の確認――防衛隊が敵の進行を食い止めている間に、パラシュート隊が軍需工場の中心部に攻め込む。"
"102090-11-エイミ" = "そうしたら、奇襲を受けた敵の防衛体制が混乱すると思うから……#nその後、防衛隊は中に侵入するよ。"
"102090-12-エイミ" = "それじゃ……作戦開始！#nみんな、ケセド前でまた。"
