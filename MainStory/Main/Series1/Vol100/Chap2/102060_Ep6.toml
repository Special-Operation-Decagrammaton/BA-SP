[translation]
"102060-1" = "第6話;第1サンクトゥム「アビドス砂漠」"
"102060-2-アヤネ" = "みなさん！作戦開始です！"
"102060-3-アヤネ" = "私たちはランデブーポイントに向かい――その後、第2部隊が砂漠横断鉄道に目標を誘導し合流。「守護者」までの道を確保します！"
"102060-4-アヤネ" = "さっきも言ったかもだけど、ビナーのレーザーには気を付けてね！"
"102060-5-ホシノ" = "はい、わかりました☆"
"102060-6-ホシノ" = "じゃ、出発しよっか～"
"102060-7-セリカ" = "やってやるんだから！"
"102060-8-カヨコ" = "こっちも始めよっか。準備はいい？"
"102060-9-アル" = "おっけ～"
"102060-10-ハルカ" = "は、はいっ！"
"102060-11-アル" = "始めていいわよ、カヨコ。"
"102060-12-カヨコ" = "OK。じゃ、列車を動かすね。"
"102060-13-ムツキ" = "あ、ああっ！#nあ、あちらに何かが……！"
"102060-14-カヨコ" = "襲撃……！？"
"102060-15-ムツキ" = "へぇ～私たちを狙って来たの？やるじゃん♪"
"102060-16-アル" = "ふん、こんなものじゃ私たちは止められないわ。#n誤算だったってこと、教えてあげないとね。"
"102060-17-アル" = "さぁ、ハードボイルドに決めるわよ！"
