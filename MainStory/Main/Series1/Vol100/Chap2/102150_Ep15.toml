[translation]
"102150-1" = "第15話;第4サンクトゥム「カタコンベ内バシリカ」"
"102150-2-ハナコ" = "第4サンクトゥムに向かう道は、今のところ1つだけです。#n火力を集中させるのは容易ではないと思いますが……他に方法がありません。"
"102150-3-ミネ" = "大丈夫です、ハナコさんの指揮を信じております。"
"102150-4-ミネ" = "ええ。ハナコさん、どうぞ遠慮なく私たちにご命令を。"
"102150-5" = "あらあら……♡マリーちゃんは悪気なくそんな言葉を使うから、#n余計ダメなんですよ。"
"102150-6-ハナコ" = "ですが……この状況では後方の防衛が手薄に……"
"102150-7-ハナコ" = "リスクを冒して進めるしか――"
"102150-8-？？？" = "私たちに、手伝わせてもらえないだろうか。"
"102150-9-ハナコ" = "……あなたは。"
"102150-10-アツコ" = "後方の防衛を任せてほしい。"
"102150-11-ハナコ" = "……。"
"102150-12-サオリ" = "私たちの事は、あまり信用できないだろうが……それでも――"
"102150-13-ハナコ" = "もちろんです、サオリさん。#n「スクワッド」には後方の防衛をお願いしますね。"
"102150-14-サオリ" = "……！"
"102150-15-ミサキ" = "ほ、本当ですか？#nこんな簡単に信じていただいて良いのでしょうか……！？"
"102150-16-ヒヨリ" = "……私たちが何者かは知ってるはずだけど……一体どういうつもり？"
"102150-17-ハナコ" = "あなた達も「シャーレの先生」の要請を受けたから手伝ってくださるのでしょう？#nそれを私が断ることはできません……それに――"
"102150-18-ハナコ" = "……私たちには、共通の大切な友人がいますから。"
"102150-19-アツコ" = "……。"
"102150-20-ハナコ" = "あなた達を信用する理由は、それで十分です。"
"102150-21-サオリ" = "そうか……理解した。"
"102150-22-アツコ" = "……。"
"102150-23-ハナコ" = "ですが、防衛だけをお願いするわけでは無いので、ご覚悟を。うふふっ♡"
"102150-24-ミサキ" = "いったい何を……"
"102150-25-ヒヨリ" = "は、はい！きっと、辛くて苦しいんでしょうけど……#n頑張ります……よろしくお願いします……！"
"102150-26-ハナコ" = "みなさん、準備はできたようですね。"
"102150-27-ハナコ" = "……ええっと、サクラコさんの姿が見えませんが……一体どちらに？"
"102150-28" = "遅れて申し訳ありません。"
"102150-29" = "さ、サクラコ様……？#nそ、その格好は……いったい……！？"
"102150-30-マリー" = "……そ、その衣装は……"
"102150-31" = "さ……サクラコさん！？"
"102150-32-サクラコ" = "これは最後の聖徒会長が残した、ユスティナ聖徒会の礼装……"
"102150-33-サクラコ" = "……ええ。これが私の覚悟です。"
"102150-34-サクラコ" = "これまで続いてきた憎悪の連鎖を断ち切り、新しく――"
"102150-35" = "――サクラコさん。"
"102150-36-サクラコ" = "それが……「覚悟」なのですか！？"
"102150-37" = "その、[ruby=・   ・   ・]破廉恥[/ruby]な衣装が！？"
"102150-38-ハナコ" = "それが本当に！シスターフッドが引き継いだ、聖徒会の意志なのですか！？"
"102150-39-ハナコ" = "その……つまり、これから、シスターのみなさんにその衣装を着用させるということなのでしょうか！？"
"102150-40-ヒナタ" = "そ、そう……なのですか！？ "
"102150-41-マリー" = "わ、私は……そのような格好は……あう……。"
"102150-42-サクラコ" = "え、ええっと、いったい何をおっしゃっているのか……！？"
"102150-43-ハナコ" = "着るのにかなりの覚悟が必要とされる、#nギリギリラインのハイレグレオタードを……！？"
"102150-44-ハナコ" = "歩くたびに後ろ姿が気になって仕方がないであろう、#n非合理的な布面積のデザインを……！？"
"102150-45-ハナコ" = "それが本当に……サクラコさんの覚悟だとおっしゃるのですか！？"
"102150-46" = "は、はい……？#nそ、それは……"
"102150-47-サクラコ" = "サクラコさん、正直におっしゃってください。私すごく気になっているのです。中に下着は？いえ――よく考えれば、物理的に存在できない……なるほど。理解しました。"
"102150-48-サクラコ" = "つまりサクラコさんは今――#nその薄い布一枚でここに居るということなのですね！！"
"102150-49-ハナコ" = "い、いったい何をおっしゃっているのでしょうか！？"
"102150-50" = "……。 "
"102150-51-マリー" = "私たちの罪をお赦しください……"
"102150-52-ハナコ" = "ええ……私、偉大なる意志の前に、またもや自身の至らなさを悟りました。"
"102150-53-ハナコ" = "……サクラコさんの覚悟、しかと受け取りました。#n私もまた、至らなさゆえの覚悟を決めなくてはなりませんね……"
"102150-54-サクラコ" = "……。"
"102150-55-マリー" = "……。"
"102150-56-ヒナタ" = "……。"
"102150-57" = "これで、全ての準備が整いました。"
"102150-58-マリー" = "は、はいっ？じゅ、準備が整ったって……"
"102150-59-ハナコ" = "では、これより第4サンクトゥムの攻略を開始します！！"
"102150-60-マリー" = "ほ、本当にこのまま開始して良いのでしょうか……？"
