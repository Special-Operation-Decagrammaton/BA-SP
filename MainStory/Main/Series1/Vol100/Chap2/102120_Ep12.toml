[translation]
"102120-1" = "第12話;第3サンクトゥム「廃墟化した遊園地」"
"102120-2" = "私たちも始めよう。準備はいい？"
"102120-3" = "はい！みなさん、ボスの前で会いましょう！ "
"102120-4-ミドリ" = "う、うん……気をつけてね、アリスちゃん……"
"102120-5-サキ" = "あの二人だけで本当に大丈夫なのか……？"
"102120-6-ミヤコ" = "……はい、問題ないと思います。"
"102120-7-ユズ" = "そ、それじゃ……"
"102120-8-ユズ" = "アバンギャルド君……出動！"
"102120-9-サキ" = "あれは何だ！？ "
"102120-10-アリス" = "出ました！この間、仲間になったアバンギャルド君です！！"
"102120-11-コトリ" = "おおっ！ここでアバンギャルド君Mk.3の出番ですか！"
"102120-12-コトリ" = "ちなみに、Mk.1はリオ会長オリジナル、Mk.2はヴェリタスが改造、そしてこのMk.3はなんと！#nユズ専用の機体なんです！"
"102120-13-コトリ" = "アバンギャルド君Mk.3の特徴はですね！フレーム単位で入力ができるユズの動体視力に合わせて特注されたコントローラーで操作ができるんです！"
"102120-14-アリス" = "そうです！最強のゲーマー「UZQueen」の専用機なのです！"
"102120-15-ヒナ" = "えっと……"
"102120-16-ユズ" = "うう……プレッシャー、が……"
"102120-17" = "コトリ！説明はその辺で……こっちのデータ解析を頼む！"
"102120-18-コトリ" = "まるで格闘ゲームのような操作感と――あっ、誰かがまた私の説明を要してますね！それでは、これで！健闘を祈りますよ、UZQueen！"
"102120-19-ユズ" = "……では、始めようか。"
"102120-20-ユズ" = "は、はい……！"
"102120-21-ユズ" = "第3サンクトゥムの攻略……"
"102120-22-ユズ" = "始めます……！！"
