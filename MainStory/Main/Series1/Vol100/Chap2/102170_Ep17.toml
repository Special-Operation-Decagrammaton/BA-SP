[translation]
"102170-1" = "第17話;第5サンクトゥム「要塞都市エリドゥ近郊」"
"102170-2-ユウカ" = "よし、準備はいいかしら？"
"102170-3-ノア" = "はーい。"
"102170-4-コユキ" = "ちょーっと待った！！"
"102170-5" = "何よコユキ。"
"102170-6-コユキ" = "「はーい」じゃないですよ！"
"102170-7-ユウカ" = "何で私がここにいるんですか！#nなんで流れるように準備の有無を聞くんですか！"
"102170-8" = "何でって、コユキちゃん。#n「守護者」を倒しに行くからですよ？"
"102170-9-コユキ" = "いや、だから！#nリオ会長のセキュリティシステムの件、解決したじゃないですか！"
"102170-10-ノア" = "ええ、そうですね。お疲れ様でしたコユキちゃん。"
"102170-11-ユウカ" = "ほんと、いつ見ても超人的な才能なのよね……"
"102170-12-コユキ" = "つまり、私の役目は終わりましたよね！？#n大人しく反省部屋に帰っちゃダメですか？壁に向かって正座してますから！"
"102170-13-ユウカ" = "ダメよ。第5サンクトゥムを攻略するには、ホドを地上に誘導しなきゃいけないの。"
"102170-14-コユキ" = "だーかーら！！それを何で私たちがやるんですか！#n他にも人はいっぱいいるでしょう！？"
"102170-15-ノア" = "それはですね……この要塞都市には、リオ会長が作った防壁があるんです。#nホドを誘導しつつ、防壁を解体しなければならないのですが――"
"102170-16-ノア" = "それは、コユキちゃんにしかできないことですから。"
"102170-17-コユキ" = "駄々をこねるのはその辺にしなさい。#nこれを解決できるのは私たちしかいないの。"
"102170-18-ユウカ" = "出発～"
"102170-19-ユウカ" = "うあぁああああ――なんで――！"
"102170-20-温泉部の部員A" = "ここに杭を打て！"
"102170-21-温泉部の部員A" = "了解！！"
"102170-22-温泉部の部員C" = "粉砕完了！ガハハハッ！！#nこれでこの高速道路も綺麗に取り壊せるな！！"
"102170-23-メグ" = "おおーっ！良い感じー！#nいい外観になってきたねぇ～"
"102170-24-メグ" = "カスミ部長、こっちはだいたい終わったよー！#n次の場所に移るね！"
"102170-25" = "ハーハッハッハ、良いぞ！建物は全部撤去してしまえ！"
"102170-26-カスミ" = "OK、任せてー！ "
"102170-27-温泉部の部員" = "開発だ！開発だー！！"
"102170-28" = "ハッハッハ！いいぞいいぞ！#nミレニアムの地下で温泉が見つかるまで、好きなだけ爆破してツルハシを振るうんだ！"
"102170-29" = "ああ、都市が……建物が……"
"102170-30" = "一応、念のために聞くんだけど……インベイドピラーを撤去するフリして、#nミレニアム自治区を破壊したいわけじゃ、ないんだよね？"
"102170-31" = "ハーハッハッハ、何をおっしゃる！全ては温泉のためだ！ついでに「サンクトゥム」も撤去できて一石二鳥じゃないか！開発とは効率的にやるものだからな！"
"102170-32" = "……。"
"102170-33" = "温泉……？この自治区の地下に温泉なんてないですが……#n少し地層を分析すれば分かることでは……"
"102170-34-カスミ" = "バカ者が！温泉というのはな、皆の心の中にあるものなのだよ！"
"102170-35" = "信じろ！信ずればそこに温泉は存在する！#nハーハッハッハッハッハ！"
"102170-36" = "……。"
"102170-37" = "……。"
