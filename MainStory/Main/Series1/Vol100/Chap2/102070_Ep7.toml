[translation]
"102070-1" = "第7話;「山海経」自治区防衛"
"102070-2-市民A" = "う、うわああ！！化け物だ！！"
"102070-3-サヤ" = "敵がやってきたのだ！ "
"102070-4-シュン" = "こちらは梅花園にお任せを！#nココナちゃんは市民の避難誘導をお願いします！"
"102070-5-ココナ" = "う、うん！分かった！シュン姉さん。"
"102070-6-店主" = "それじゃ、行こっかー！"
"102070-7-？？？" = "ずいぶんと賑わっているのう。"
"102070-8-ルミ" = "き、キサキ会長……！？"
"102070-9-キサキ" = "仮にも門主じゃからな。山海経の危機を静観しているわけにもいかぬじゃろうて。"
"102070-10-キサキ" = "ああ、そうじゃ。守りが薄い場所に執行部長を送っておいた。好きに使うと良かろう。"
"102070-11-キサキ" = "門主様……ありがとうございます。"
"102070-12-玄龍門の生徒A" = "ふっ……まさに「友は近くに、敵はもっと近くに置け」――だな。"
"102070-13-玄龍門の生徒A" = "え？……いきなり何の話ですか？"
"102070-14-玄龍門の生徒B" = "どうせまた、何かの映画の受け売りでしょ。"
"102070-15-玄龍門の生徒A" = "やかましい！不朽の名作、「ゴッドマーザー」のセリフじゃい！"
"102070-16-玄龍門の生徒A" = "まったく……そら、行くぞ！門主様のご命令だ！"
