[translation]
"102080-1" = "第8話;「レッドウィンター」自治区防衛"
"102080-2-トモエ" = "今度は私たちの番、ですか。#n皆さん、どうぞよろしくお願いいたします。"
"102080-3-親衛隊" = "よし……突撃ー！#n突撃開始だ！！"
"102080-4-ミノリ" = "同志よ、行くぞ！労働者の権利のために！"
"102080-5-工務部員たち" = "プリンのために！"
"102080-6-トモエ" = "……チェリノ会長は「用事がある」と席を外されたのですが、少々心配ですね。"
"102080-7-トモエ" = "先に避難所に向かわれたのでしょうか……"
"102080-8-ノドカ" = "はい、みなさん！避難所はこちらの旧校舎になります！ "
"102080-9-ノドカ" = "あれ……ここ、廃墟ですよね？#n温泉は一体どこに……？"
"102080-10-ノドカ" = "そ、それはちょっと事情がありまして……#n温泉は……その、廃業といいますか、あの……"
"102080-11-モミジ" = "ええっ、そうなんですか？楽しみにしてたのに……！"
"102080-12-モミジ" = "でもでも、密室にいたら新刊のアイデアがたくさん浮かぶかもよ？"
"102080-13-メル" = "ここでゆっくり過ごして、次の「コミセン」の新刊構想を練るんだよ。ふふっ。"
"102080-14-モミジ" = "なるほど……これがカンヅメってやつですね！分かりました！"
"102080-15-シグレ" = "ノドカ、チェリノ会長見なかった？"
"102080-16-ノドカ" = "いや、こっちには来てないと思う。"
"102080-17-ノドカ" = "私も、特別クラスの待遇について話そうと思ってたんだけど……"
"102080-18-シグレ" = "そっか……"
"102080-19-シグレ" = "どこ行ったんだろ……？"
