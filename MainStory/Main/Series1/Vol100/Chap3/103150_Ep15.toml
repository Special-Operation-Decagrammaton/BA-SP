[translation]
"103150-1" = "第15話;アトラ・ハシースの箱舟占領戦 "
"103150-2-アユム" = "敵の撃退を確認！無事、防衛に成功しました！！ "
"103150-3-モモカ" = "先生、おつかれさん～"
"103150-4-モモカ" = "他は特に変な動きもなさそうだし――"
"103150-5-モモカ" = "ななな、なに！！？#nば、爆発！！？"
"103150-6-モモカ" = "ば、爆発、ですか……？い、一体どこで……！？"
"103150-7-リン" = "！！"
"103150-8-アユム" = "あ、ああっ……い、いつの間に中へ……！？"
"103150-9" = "[ns] \"シロコ……！？\""
"103150-10-シロコ" = "そっか……うん。#n結局、ここまで来たんだ。"
"103150-11-シロコ" = "警告したのに、どうして……？ "
"103150-12-シロコ" = "……ここには、命の終わりしかないのに。"
"103150-13-アヤネ" = "シロコ先輩！！！"
"103150-14-ノノミ" = "――止まれ！！"
"103150-15-ノノミ" = "シロコ、ちゃん……！？ "
"103150-16-セリカ" = "し、シロコ先輩、なのよね……！？ "
"103150-17-シロコ" = "ダメです！#nし、シロコちゃん……！"
"103150-18-シロコ" = "待って、シロコちゃん――！！"
"103150-19-アヤネ" = "しゅ、手榴弾……！？"
"103150-20" = "[ns] \"ホシノ！！\""
"103150-21-ホシノ" = "げほっ、げほっ……"
"103150-22-ホシノ" = "先生、大丈夫？"
"103150-23" = "[s] \"うん。\""
"103150-24-セリカ" = "ゲホゲホ……シロコ先輩は？ "
"103150-25-アヤネ" = "いなくなりました…… "
"103150-26-ホシノ" = "やっぱり……シロコちゃんは、ここにいたんだね。"
"103150-27-アヤネ" = "でも……どうして、こんな……。"
"103150-28-ノノミ" = "……。"
"103150-29-ユウカ" = "はぁ……今ので、事態がさらに悪化したわね。"
"103150-30-ユウカ" = "エンジニア部、聞こえる？#n船の状態を見てもらえるかしら？"
"103150-31-ウタハ" = "ふぅ……みんな、怪我がないようで何より。"
"103150-32-ウタハ" = "戦艦の状態は今確認しているけど……"
"103150-33-ヒビキ" = "結構ボロボロ。 "
"103150-34-ウタハ" = "箱舟との衝突でかなり様々なところに問題が生じてしまったようだね。#nそれと、今の爆発も……更に追い打ちをかけてしまったみたいだ。"
"103150-35-ウタハ" = "今からシステムの診断とダメージ分析作業に入ります！#nですが、あまり心配しないでください。"
"103150-36-ウタハ" = "根本的に直すことは不可能だとしても、再起動くらいはなんとかできるはずですから。"
"103150-37-ヒビキ" = "そうだね。これを復旧しないと、君たちが地上に戻れない。#n私たちも全力で頑張ってみるよ。"
"103150-38-ヒビキ" = "ただ、私たちだけでは時間が掛かってしまうから、そちらの手も借りたいのだけど……"
"103150-39-ウタハ" = "誰か、手が空いている人はいるかい？"
"103150-40-ウタハ" = "……私がやるよ。必要なことがあれば言って。"
"103150-41-コトリ" = "おおっ、分かりました！ありがとうございます！ "
"103150-42-リン" = "はい。それでは、よろしくお願いします。 "
"103150-43-リオ" = "……ヒマリ。 "
"103150-44-リオ" = "今のシロコの空間移動――おそらく、この箱舟の演算能力を利用したものよ。"
"103150-45" = "ええ……あり得る話ですね。"
"103150-46-リオ" = "この「アトラ・ハシースの箱舟」は、次元を計算する演算装置……これを利用して、空間を移動できるのでしょう。"
"103150-47-リオ" = "彼女は――ずいぶんと、箱舟の能力を利用することに慣れているようね。"
"103150-48-ヒマリ" = "……と、言いますと？"
"103150-49-リオ" = "つまり、箱舟の演算能力を確保できれば……おそらくあれと同等の、物理的な空間跳躍シーケンスを作れるはずよ。"
"103150-50-ヒマリ" = "空間跳躍、シーケンス……？"
"103150-51-リオ" = "私は「名もなき神」の技術について、キヴォトスいち詳しいつもりなのだけれど。#n未来の予知も、一部とはいえ実現させたことがあるわ。"
"103150-52-リオ" = "おそらく一度しか使えないでしょうけれど――空間跳躍シーケンスが完成すれば、艦内の全員を地上に移動させる事ができるはずよ。"
"103150-53-ヒマリ" = "ふむ……なるほど。 "
"103150-54-ヒマリ" = "つまり……リオ、あなたはエンジニア部が修理を完遂できないと考えているのですね？"
"103150-55-リオ" = "エンジニア部を信用できないから、という話ではないわ――"
"103150-56-ヒマリ" = "そうですね……あなたは、「ビッグシスター」ですもの。"
"103150-57-ヒマリ" = "全てに精通しているが故に、全てのことに疑念を抱く――"
"103150-58-ヒマリ" = "まるで神託を受けた王のように……"
"103150-59-リオ" = "……？"
"103150-60-ヒマリ" = "あなたの不安や執念……その感情の大半は、様々な問題を招きました。"
"103150-61-ヒマリ" = "仲間を信頼できず、自分こそが正しいという独善的な思考に溺れていたから――"
"103150-62-リオ" = "そうね……否定はしないわ。私はそういう人間よ、ヒマリ。 "
"103150-63-リオ" = "それらは、私を形作っているモノ。これからもきっと、変わる事はないと思うわ――軽蔑されたとしても構わない。"
"103150-64-リオ" = "でも、この船は――貴女や先生、そしてここにいる全員の命を乗せた存在なのよ。"
"103150-65-リオ" = "であれば、計画が失敗した時に備えなくてはならないでしょう？#n絶対に起こり得ない確率だとしても、打てる策は講じておくべきよ……"
"103150-66-リオ" = "こんな状況だからこそ、私は――"
"103150-67-ヒマリ" = "軽蔑などしませんよ。私はあなたが嫌いなだけです――"
"103150-68-ヒマリ" = "この差は、結構大きいんですよ？"
"103150-69-ヒマリ" = "……心配してくださり、ありがとうございます、リオ。"
"103150-70-リオ" = "今、なんて――"
"103150-71-ヒマリ" = "エンジニア部のみなさんもあなたに感謝する事でしょう。"
"103150-72-ヒマリ" = "自分たちの失敗に備えてくれる、力強い存在がいてくれるのですから。"
"103150-73-リオ" = "……。"
"103150-74-ヒマリ" = "「ウトナピシュティムの本船」無しにここから生還する……#nそんな方法があるのであれば、それは大きな励みになります。"
"103150-75-ヒマリ" = "ですから――よろしくお願いしますね、リオ。"
"103150-76-リオ" = "ええ、分かったわ。少し時間をちょうだい。#n貴女たちが占領戦を進めている間に、確認しておくから。"
"103150-77-リオ" = "それでは――"
"103150-78-ヒマリ" = "……。"
"103150-79-リン" = "「アトラ・ハシースの箱舟」への進入はなんとか成功しましたが…… "
"103150-80-リン" = "今の私たちは、敵の本拠地にいる状況です。#nいつ攻撃が始まってもおかしくありません。"
"103150-81-リン" = "先ほどのような襲撃が続くかもしれません――"
"103150-82-リン" = "つまり、船の防衛にも同時に気を配る必要があります。"
"103150-83-リン" = "エンジニア部が復旧作業をしている間、"
"103150-84-リン" = "ゲーム開発部や対策委員会、美食研究会の方々には、襲撃から船を守る役割を担っていただきたいです。"
"103150-85-リン" = "そして、オペレーターやシャーレには、次の作戦をお願いします。"
"103150-86-リン" = "次の作戦……。"
"103150-87-リン" = "ここからが本番かぁ……。"
"103150-88-アユム" = "はい。これより、私たちは"
"103150-89-アユム" = "「アトラ・ハシースの箱舟」を占領し奪取します。"
