[translation]
"103160-1" = "第16話;逆襲"
"103160-2-ユウカ" = "はやく……早く戻って来て。"
"103160-3-アコ" = "急いでください！"
"103160-4-ハナコ" = "……。"
"103160-5-リン" = "……。"
"103160-6-モモカ" = "みんな、はやく……。"
"103160-7-アユム" = "……。"
"103160-8-ハレ" = "「自爆シーケンス」の構成、完了。あとは実行ボタンを押すだけ。"
"103160-9-コタマ" = "シミュレーション結果も問題ありません。#nこれであれば、「アトラ・ハシースの箱舟」は確実に破壊できます。"
"103160-10-マキ" = "すっごい爆発が起きるんじゃない？#n箱舟の破片が、キヴォトスのあちこちに降ってきちゃうかも。"
"103160-11-チヒロ" = "……こっちの準備は完了してるよ。#n脱出の用意ができたら教えて。"
"103160-12-リオ" = "ちょっと待ってちょうだい！！"
"103160-13-リオ" = "……リオ？"
"103160-14-リオ" = "何かがおかしいわ――今、私たちは箱舟を掌握しているはずなのに……"
"103160-15-リオ" = "……ヒマリ！#n今すぐ「ウトナピシュティム」の中枢システムを見てちょうだい。 "
"103160-16-ヒマリ" = "……中枢システム、ですか？"
"103160-17-リオ" = "……。"
"103160-18-ヒマリ" = "……こ、これは一体？"
"103160-19-ヒマリ" = "……[ruby=・   ・   ・   ・   ・]ハッキング[/ruby]されたのよ。"
"103160-20-リオ" = "こんな数値では……一体、誰が……いつの間に……"
"103160-21-リオ" = "「ウトナピシュティムの本船」が――ハッキングされているわ！！"
"103160-22-チヒロ" = "こ、れは……どういう……！？"
"103160-23-コタマ" = "な、何かがおかしいです……！#nどうして今「自爆シーケンス」が起動するんですか……！？"
"103160-24-マキ" = "な、なんで……？もうボタン押したの？#nまだ脱出準備、終わってないんじゃないの！？"
"103160-25-ハレ" = "いや、これは……！ "
"103160-26-SYSTEM" = "「自爆シーケンス」を実行します。"
"103160-27-みんな" = "――――！？！？"
"103160-28-ユウカ" = "え……？「自爆シーケンス」が起動？"
"103160-29-アコ" = "はい……？今なんと……？"
"103160-30-ハナコ" = "これは……一体？"
"103160-31-カヨコ" = "みんな、伏せて！！ "
"103160-32-チヒロ" = "……。"
"103160-33-マキ" = "いったい、どうして……。"
"103160-34-ハレ" = "何が起きてるの……？"
"103160-35-コタマ" = "これは……船の、自爆……？#nな、何故……？"
"103160-36-チヒロ" = "一体、何が……どうなってるの……。"
"103160-37-アユム" = "げほっ、げほっ……みなさん、ご無事ですか……？ "
"103160-38-モモカ" = "ちょっと、何事！？"
"103160-39-リン" = "ぐっ……！！"
"103160-40-ユウカ" = "幸い、爆発はそれほど大きくなかったけど……"
"103160-41-ユウカ" = "この状態……大丈夫なのよ、ね……？"
"103160-42-ユウカ" = "ヒマリ部長。現状の説明をお願いしてもいいかしら？"
"103160-43-ヒマリ" = "……やられました。"
"103160-44-ユウカ" = "えっ、やられたって……何によ？"
"103160-45-ヒマリ" = "……私たちが、「アトラ・ハシースの箱舟」の占領を進めている間、敵は……"
"103160-46-ヒマリ" = "――バックドアから「ウトナピシュティム」の掌握を進めていたのです。"
"103160-47-ユウカ" = "……なっ！？"
"103160-48-ヒマリ" = "……現在、「ウトナピシュティムの本船」の所有権は、敵に渡っています。"
"103160-49-ユウカ" = "い、いつの間に……！というか、それを実行するには、内部からの物理的な接触が必要でしょ！？"
"103160-50-ユウカ" = "内部に誰も入れた覚えは――"
"103160-51-ユウカ" = "ま……まさか、あの時……"
"103160-52-ヒマリ" = "箱舟の自爆どころか……「アトラ・ハシース箱舟」の多次元解釈を、「ウトナピシュティムの本船」が助けた形になりました。"
"103160-53-ヒマリ" = "このままでは、また「虚妄のサンクトゥム」が……"
"103160-54-リン" = "……これは。"
"103160-55-モモカ" = "そ、空が……！？ "
"103160-56-アユム" = "また……虚妄のサンクトゥムが……！？"
"103160-57-イオリ" = "な、何……！？"
"103160-58-チナツ" = "ま、また空が……"
"103160-59-ヒナ" = "……。"
"103160-60-トキ" = "……。"
"103160-61-トキ" = "……非常事態を確認。 "
"103160-62-ニヤ" = "……。"
"103160-63-カホ" = "先生……"
"103160-64-コユキ" = "そ、空が……！せ、先輩どうしましょ！？"
"103160-65-ノア" = "ユウカちゃん……先生……"
"103160-66-サキ" = "空が……"
"103160-67-ミユ" = "せ、先生に何かあったんじゃ……"
"103160-68-モエ" = "これって……"
"103160-69-ミヤコ" = "……。"
"103160-70-ナギサ" = "せ、セイアさん、ミカさん！"
"103160-71-ミカ" = "遅かったね、ナギちゃん。#nセイアちゃんは、さっきどこかに行っちゃった。　"
"103160-72-ナギサ" = "……ええっと？　"
"103160-73-ミカ" = "なんだか不吉な「気配」を感じるからそれに備えたいって言ってたよ？"
"103160-74-ミカ" = "――「自分が居ない間、何か起きた時は後を頼む」ってさ。"
"103160-75-ナギサ" = "そうですか……では、私たちもすぐに取り掛かりましょう。 "
"103160-76-ミカ" = "うん。了解☆"
"103160-77-ナギサ" = "先生が帰ってきた時、うまく対処できてなかったら、きっとガッカリしちゃうよね！"
"103160-78-ミカ" = "――だから、先生の心配は後回し。"
"103160-79-ヒヨリ" = "そ、空が――！？"
"103160-80-ヒヨリ" = "ヒヨリ、あれは言わなくていいからね。"
"103160-81-ヒヨリ" = "な、何のことですかミサキさん……そんなに私は「もう人生終わりだ」とか、「この世は苦痛だらけです」とか、ネガティブ発言ばかりの印象なんですか……？うぅ……いえ、事実ではありますが……！"
"103160-82-アツコ" = "……行くぞ。"
"103160-83-アツコ" = "うん――どんなことがあっても、努力を止めるべきじゃない、からね。"
"103160-84-ヒヨリ" = "はい……い、行きましょう！ "
"103160-85-ミサキ" = "……うん。私たちにできることをやろう。"
"103160-86-ハレ" = "今の「ウトナピシュティム」の制御権は、相手に渡っている状態……。"
"103160-87-コタマ" = "現在ハッキング位置を追跡中です……"
"103160-88-コタマ" = "……確認完了。「アトラ・ハシースの箱舟」第4エリアの中央部です。 "
"103160-89-マキ" = "……え？これがその場所の名前？"
"103160-90-チヒロ" = "多次元解釈エンジン管制室、「ナラム・シンの玉座」――"
"103160-91-ハレ" = "ここから「ウトナピシュティム」をハッキングしてる……止めないと！！"
"103160-92-アヤネ" = "みなさん、大丈夫ですか？ "
"103160-93-セリカ" = "うん……大丈夫。特に怪我はないけど……"
"103160-94-セリカ" = "これって要は、そういうことなのよね……？"
"103160-95-アヤネ" = "……。 "
"103160-96-ホシノ" = "……あの「シロコ」が、何度も私たちを邪魔していたのは――"
"103160-97-ノノミ" = "……時間稼ぎがしたかっただけ、ということでしょうか。"
"103160-98-ホシノ" = "そ、そんな……じゃあ、私たちは今まで……"
"103160-99-アヤネ" = "作戦は失敗……。今までの努力は全部、水の泡――"
"103160-100-シロコ" = "ううん。まだだよ。"
"103160-101-アヤネ" = "し、シロコ先輩……？"
"103160-102" = "[ns] \"まだ諦めるには早いよ。\""
"103160-103-アヤネ" = "せ、先生まで……シロコ先輩とご一緒なのですか？#n今はどちらに……！？ "
"103160-104-シロコ" = "ん。第4エリア中央の「ウトナピシュティム」をハッキングしてる場所に先生と向かってるよ。"
"103160-105-アヤネ" = "……えぇっ！？"
"103160-106" = "[s] \"私とシロコがハッキングを止めてみる。後のことは、お願い。\""
"103160-107-アヤネ" = "……！！"
"103160-108-モモカ" = "なっ、えっ！？"
"103160-109-アユム" = "……！！"
"103160-110-リン" = "……先生。"
"103160-111" = "管制室が見えてきた。"
"103160-112" = "突入したら、敵の制圧に回るね。 "
"103160-113" = "[s] \"……よし、行こう！\""
"103160-114" = "[ns] （ここは……）"
"103160-115-シロコ" = "敵、発見。"
"103160-116-シロコ" = "私を拉致した、あいつ……！"
"103160-117-シロコ" = "止まれ――！！"
"103160-118-シロコ" = "少しでも動いたら……撃つ！！"
"103160-119-シロコ" = "下手な抵抗はやめた方がいい。"
"103160-120-シロコ" = "ここには……「シャーレの先生」がいる。#nだからもう、全部終わり。 "
"103160-121-シロコ" = "大人しく降参して、すぐに……"
"103160-122-プレナパテス" = "\"…………。\""
"103160-123-シロコ" = "う、動くな……！手を上げろ！！"
"103160-124" = "さもないと……撃つ。"
"103160-125" = "……と、止まれ！"
"103160-126-プレナパテス" = "\"……我々は望む、ジェリコの[ruby=なげ]嘆[/ruby]きを。\"#n\"……我々は覚えている、七つの[ruby=こそく]古則[/ruby]を。\""
"103160-127-シロコ" = "くっ――――――！？"
"103160-128-シロコ" = "銃弾が……全部、外れた……？"
"103160-129-シロコ" = "この距離で、何故……？"
"103160-130" = "[ns1] （あれは……）\n[ns2] （聞き間違いでなければ――）"
"103160-131-シロコ" = "せ、先生……？"
"103160-132-シロコ" = "せ、先生……？"
"103160-133-シロコ" = "先生……ダメ、何か……何かが、おかしい。"
"103160-134" = "[s] \"……シロコ、下がった方がいい。\""
"103160-135-シロコ" = "え……？"
"103160-136-？？？" = "[USERNAME]先生の生体認証、完了。"
"103160-137" = "[s3] \"私の……名前？\"\n[s4] \"私を、呼んだ……？\""
"103160-138" = "この「シッテムの箱」に常駐しているシステム管理者であり、メインOS――"
"103160-139-？？？" = "――A.R.O.N.A、命令待機中。"
"103160-140" = "[s5] \"……………………\"\n[s6] \"……………ア……ロナ？\""
"103160-141-A.R.O.N.A" = "「アトラ・ハシースの箱舟」、復旧システムを起動。 "
"103160-142-A.R.O.N.A" = "「シッテムの箱」の権限により、破壊された「アトラ・ハシースの箱舟」を多次元の同一存在と交代・修復します。 "
"103160-143-A.R.O.N.A" = "約30分後、100%修復を想定。"
"103160-144-A.R.O.N.A" = "箱舟に侵入した「ウトナピシュティムの本船」は800秒後、最終自爆シーケンスに移行。"
"103160-145-？？？" = "……だから言ったでしょう。 "
"103160-146-シロコ" = "定められた運命を変えることはできない、と。"
"103160-147-シロコ" = "キヴォトスは予定通り、終焉を迎える。"
"103160-148-シロコ" = "私の――[USERNAME]先生。"
"103160-149" = "Final.;To be Continued in Chapter 4"
