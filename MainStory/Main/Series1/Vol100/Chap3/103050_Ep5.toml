[translation]
"103050-1" = "第5話;アビドスに在るもの（２）"
"103050-2" = "対策委員会・教室"
"103050-3-ヒマリ" = "ふむ……。"
"103050-4-アヤネ" = "えっと……その……アビドスに、ようこそ……？"
"103050-5-リン" = "失礼いたします。"
"103050-6-リン" = "カイザーコーポレーションがサンクトゥムタワーを襲撃した際……#nプレジデントは私に言いました。"
"103050-7-プレジデント" = "サンクトゥムタワーを掌握するのだよ。 "
"103050-8-プレジデント" = "……超古代兵器が手に入ったものでね。サンクトゥムタワーの力が必要になった、というわけさ。"
"103050-9-プレジデント" = "これでキヴォトスは、カイザーコーポレーションの支配下になる。#nゲマトリアでも、連邦生徒会でもない……我々が学園都市の主となるのだ。"
"103050-10-リン" = "当時は余裕がなかったので、その意味を考える時間もありませんでしたが……今思うと不自然な物言いです。"
"103050-11-リン" = "「超古代兵器」……私企業のトップが口にする単語とは思えません。"
"103050-12-リン" = "そして、平時であれば気付くことはなかったでしょう……#n「カイザーコーポレーション」と「超古代兵器」――この2つの接点など。"
"103050-13-アヤネ" = "はい……その2つは――"
"103050-14-ホシノ" = "なるほどねぇ～"
"103050-15-アヤネ" = "ホシノ先輩？"
"103050-16-ホシノ" = "カイザーがアビドス砂漠で探してたのって、#n「超古代兵器」だったって事だよね？"
"103050-17" = "アビドス砂漠・発掘区域付近"
"103050-18-ホシノ" = "おじさん、ずっと気になってたんだよね。#nカイザーがアビドス自治区の土地を奪った理由……"
"103050-19-ホシノ" = "砂漠化しちゃってるのにどうして、って思ってたんだけど……#nそういう事だったんだねぇ～"
"103050-20-ノノミ" = "というか、「超古代兵器」って何よ！？#nそんな物のためにあんな事したっていうの！？"
"103050-21-ノノミ" = "カイザーが言っていた「宝探し」も、その事だったんですね……"
"103050-22-ホシノ" = "……まぁ、それだけ強力な武器なんでしょ。#nそんなもの、お店で売ってないからねぇ。"
"103050-23-リン" = "ええ。そして、カイザーコーポレーションは「超古代兵器」を起動させるために連邦生徒会を襲撃しました。 "
"103050-24-リン" = "最早、キヴォトス全土を敵に回しても構わない――#nとでも言わんばかりの勢いで……。"
"103050-25-ホシノ" = "最近、砂漠にカイザーPMCが多かったのもそれが理由なんだとしたら……"
"103050-26-ホシノ" = "おじさんたちも、今からアビドス砂漠に行って「超古代兵器」を手に入れたらいいわけだ。"
"103050-27-アヤネ" = "で、ですが……あの場所はカイザーの私有地で――"
"103050-28-ホシノ" = "うん、でも緊急事態だからさ。#nここからはシロコちゃんスタイルで行こうか。"
"103050-29-アヤネ" = "シロコ先輩……スタイル！？"
"103050-30-アヤネ" = "ま、待ってください！そういう意味ではなくて――"
"103050-31-ノノミ" = "はぁ、あんまり気は乗らないけど……#n要はバレなきゃいいんでしょ？ちゃちゃっとやるわよ。"
"103050-32-ノノミ" = "シロコちゃんを捕まえるために、ちょ～っと借りるだけですから☆"
"103050-33-アヤネ" = "はぁ……分かりました。事態の収拾のために、借りるだけ……#nカイザーPMCは既に基地から撤収していますので、今は無人のはずです。"
"103050-34-アヤネ" = "ありゃ、そうなの？ "
"103050-35-アヤネ" = "はい。ですが、カイザーの私有地であることに変わりはありません。#nそれに、ひょっこり戻ってくるかもしれませんので、気をつけてくださいね。"
"103050-36-ホシノ" = "うへ～、戦う事を想定してたから、ちょっと拍子抜けだよ。"
"103050-37-ノノミ" = "うふふっ、ちゃんと覆面をつけてくれるアヤネちゃん、可愛いです☆"
"103050-38-アヤネ" = "あ、あう……そ、それは……"
"103050-39-セリカ" = "じゃあ、ここに「超古代兵器」を持ってくればいいのよね？"
"103050-40-セリカ" = "思ったより大したことないわね……"
"103050-41-ヒマリ" = "いえ――おそらく、持ってくるのは難しいかと。"
"103050-42-アヤネ" = "ヒマリさん……？"
"103050-43-ヒマリ" = "ですので私たちも後から参ります。#n皆さんは、全員が到着するまでの間、安全の確保をお願いできればと。"
"103050-44-ホシノ" = "「超古代兵器」ってそんなに大きいんだねぇ～"
"103050-45-ヒマリ" = "ええ。"
"103050-46-ヒマリ" = "先生によると、かの「超古代兵器」は――"
"103050-47-ヒマリ" = "[ruby=・   ・   ・   ・]宇宙戦艦[/ruby]、なのだそうです。"
"103050-48-一同" = "宇宙戦艦！？"
"103050-49-PMC兵士B" = "なっ、何だお前らは！？ "
"103050-50-PMC兵士B" = "これは……一体！？"
"103050-51-ホシノ" = "そっか。サンクトゥムが消えたから戻ってきてるんだね。"
"103050-52-ノノミ" = "ですが、ここは元々[ruby=私たち]アビドス[/ruby]の自治区です！"
"103050-53-セリカ" = "そうよ！カイザーは勝手に居座ってるだけじゃない！"
"103050-54-アヤネ" = "で、ですが、書類上は……"
"103050-55-アヤネ" = "うう、大丈夫でしょうか……"
"103050-56-ホシノ" = "まあ、キヴォトス全域はまだ混乱の真っ只中だし、#n何かあったとしても、先生がなんとかしてくれるんじゃない？"
"103050-57-ノノミ" = "これが大人のパワー、ですね☆"
"103050-58-アヤネ" = "あ、あはは……"
"103050-59-セリカ" = "わっ、"
"103050-60-セリカ" = "まだいたの！？ "
"103050-61-ホシノ" = "よ～し、気合入れていくよ～！"
"103050-62-アヤネ" = "はい！指定座標に移動します。"
"103050-63-アヤネ" = "先生、指揮をお願いします！"
"103050-64" = "[ns] \"それじゃ、始めるよ！\""
