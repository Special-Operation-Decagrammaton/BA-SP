[translation]
"103120-1" = "第12話;「勇者」の資格（１）"
"103120-2-ハナコ" = "そん、な……"
"103120-3-ハナコ" = "では、私たちが戦っている相手は一体……！？"
"103120-4-リオ" = "戦艦のスピードを落としてちょうだい！#nこのままでは、あの変形した多次元バリアに衝突してしまうわ！"
"103120-5-リオ" = "連動しなくなってしまった状態で衝突すれば――#n私たちは未知の次元に取り込まれるか、そのまま粉々になるかの二択よ！"
"103120-6-アヤネ" = "あ、あの……スピードを落としたとしても、衝突は避けられません……！"
"103120-7-アヤネ" = "何か他に手立ては無いのでしょうか。 "
"103120-8-リオ" = "……無いわ。あれは科学ではなく、一種の概念と化している。#nあの状態を瓦解させる手段は、現状存在し得ない……"
"103120-9-リオ" = "――ただ一つの方法を、除いて。"
"103120-10-ヒマリ" = "……！！"
"103120-11-リオ" = "あれが「アトラ・ハシースの箱舟」という概念をコピーしたものであるのなら、あれに介入できるのは……"
"103120-12-リオ" = "……同一存在である、[ruby=・   ・]箱舟[/ruby]だけでしょうね。"
"103120-13-ヒマリ" = "同一の、箱舟……？ "
"103120-14-ヒマリ" = "……！！#nまさか……！"
"103120-15-ユウカ" = "い、いきなり何の話！？#n箱舟なんてどこにも――"
"103120-16-ユウカ" = "いえ、それだけはいけません！！#nこれ以上そんな事をしてしまえば……"
"103120-17-ユウカ" = "ビッグシスター、あなたという人は、本当に――！"
"103120-18-アコ" = "衝突6分前……！#nケンカしている場合じゃありません、なんでもいいですから、早く……！"
"103120-19-アリス" = "――アリス、理解しました。 "
"103120-20-ヒマリ" = "あ、アリス……？"
"103120-21-リオ" = "……。 "
"103120-22-リオ" = "リオ会長、こんな所にいたんですね。#nもう一度会えて、よかったです。"
"103120-23-ミドリ" = "アリスちゃん……"
"103120-24-モモイ" = "えっ、会長！？#nというか、姿を見せないでドローンを送るってどういう事！？"
"103120-25-アリス" = "……アリス、"
"103120-26-アリス" = "私は――"
"103120-27-アリス" = "はい、分かっています。"
"103120-28-アリス" = "この状況は――「名もなき神々の王女」であるアリスの力が、必要なんですよね。"
"103120-29-ユズ" = "で、でもアリスちゃん……！ "
"103120-30-ユズ" = "だ、ダメだよアリス！！"
"103120-31-ユズ" = "またあんな事に――"
"103120-32-ユズ" = "アリスちゃん……！"
"103120-33" = "[s] \"みんな、少し落ち着いて。\""
"103120-34-アリス" = "……。 "
"103120-35" = "[ns] \"アリスの言葉を、最後まで聞こう。\""
"103120-36-ミドリ" = "う、うん……"
"103120-37-ユズ" = "アリスちゃん……言いたいこと、全部話してほしいな。"
"103120-38-アリス" = "はい――モモイ、ミドリ、ユズ。"
"103120-39-アリス" = "そしてユウカ、ヒマリ先輩、リオ会長。"
"103120-40-アリス" = "……先生。"
"103120-41-アリス" = "先生は、アリスのなりたい存在はアリスが決めていい、と言いました。"
"103120-42-アリス" = "アリスは「名もなき神々の王女」で、「ゲーム開発部」のメンバーで――#n「ミレニアムの生徒」で、「シャーレの生徒」です。"
"103120-43-アリス" = "アリスは……「魔王」で「勇者」です。 "
"103120-44-アリス" = "……アリスは、アリスが望んでいる「アリス」です。 "
"103120-45-アリス" = "だから「名もなき神々の王女」として……"
"103120-46-アリス" = "「ケイ」にお願いをします。 "
"103120-47-ケイ" = "……！！"
"103120-48-アリス" = "アリスの中にある「アトラ・ハシースの箱舟」で……今の危機を解決できるのなら、 "
"103120-49-アリス" = "それで――世界を、救えるのなら、 "
"103120-50-アリス" = "「アトラ・ハシースの箱舟」は、世界を滅亡させる兵器ではなく――#n世界を救う、勇者の武器になれます。"
"103120-51-アリス" = "アリス、それは……"
"103120-52-アリス" = "それで世界を救えるのなら、アリスはそれを望みます。 "
"103120-53-アリス" = "そうすれば、ヒマリ先輩はこれ以上リオ会長を恨まなくて良くなります。"
"103120-54-リオ" = "そしてリオ会長は、自分自身を恨まなくて良くて、隠れる必要もなくなります。"
"103120-55-リオ" = "私、自身を……？"
"103120-56-ヒマリ" = "……アリス。"
"103120-57-アリス" = "それがアリスの――"
"103120-58-アリス" = "「勇者」の、使命ですから。"
"103120-59-ケイ" = "いいえ……なりません。"
"103120-60-ケイ" = "ウトナピシュティムの本船が起動した時、あなたが奇跡的に無事でいられたのは……"
"103120-61-ケイ" = "全ての報いと、その傷を――あの「大人」が被ったからです。"
"103120-62-ケイ" = "ですが、それも間もなく終わりを迎えるでしょう。#nあの大人は傷に耐えきれず、生を終えることでしょう。"
"103120-63-ケイ" = "そのような状況で、再び「箱舟」を生成するとなれば――"
"103120-64-ケイ" = "それは……"
"103120-65-ケイ" = "……"
"103120-66-ケイ" = "王女よ、あなたは……"
"103120-67-ケイ" = "ケイ。"
"103120-68-アリス" = "王女……なりません。ここで箱舟のプロトコルを再起動したら、あなたは――"
"103120-69-ケイ" = "ケイ……ごめんなさい。 "
"103120-70-アリス" = "……何故ですか？"
"103120-71-アリス" = "あなたに、謝りたかったんです。 "
"103120-72-アリス" = "アリスはケイを理解できなかったから、拒絶して、目を背けました……#nケイから逃げようとしました。"
"103120-73-アリス" = "ケイのことが怖くて、恐れていました……#n目を背けるべきではなかったのに……"
"103120-74-アリス" = "理解できないとしても……ケイと向き合うべきでした。"
"103120-75-ケイ" = "……"
"103120-76-アリス" = "アリスはケイのことをよく知らないので、ケイの立場になって考えてみたのです。"
"103120-77-アリス" = "世界を滅亡に導く「鍵」であることが、ケイの存在理由なら……#nきっと、苦しかったと思います……"
"103120-78-アリス" = "だから、ケイもずっと苦しかったんじゃなかったのかな、とアリスは考えました。"
"103120-79-ケイ" = "王女よ、私は――"
"103120-80-アリス" = "自分のなりたい存在は、自分で決めていい、と先生が教えてくれました。 "
"103120-81-アリス" = "ケイも、ケイが望む存在になることができます。#n誰かに許可をもらう必要もありません。 "
"103120-82-ケイ" = "……"
"103120-83-アリス" = "だからアリスは「ケイ」という名前、とても良い名だと思います。 "
"103120-84-アリス" = "ケイは、間違えて読んでしまった名前です……アリスの名前みたいに。"
"103120-85-アリス" = "そこには特別な理由も、目的も、意味もありません。"
"103120-86-ケイ" = "……だから、世界を滅亡させる私という存在が、#nこれ以上苦しまないでほしいと考えているのですか？"
"103120-87-ケイ" = "私を、助けたいと？#n……そういうことなのでしょうか、王女よ。 "
"103120-88-アリス" = "……アリスは、アリスが誰かを助けられるような存在なのかは分かりません。"
"103120-89-アリス" = "アリスは「見習い」勇者ですから……でも、 "
"103120-90-アリス" = "誰かを助けたいと思う気持ちこそ――#n「勇者」の資格であると、信じています。"
"103120-91-ケイ" = "……"
"103120-92-アリス" = "…………起動開始。"
"103120-93-モモイ" = "あっ、えっ、アリス？"
"103120-94-ミドリ" = "わっ！？アリスちゃん……！？"
"103120-95-ヒマリ" = "アリス……いえ、これは＜Key＞……？"
"103120-96-リオ" = "……いえ、待ってちょうだい。"
"103120-97-アリス" = "……コードネーム「AL-1S」起動完了。"
"103120-98-アリス" = "プロトコルATRAHASISを実行します。"
"103120-99-モモイ" = "あ、アリス……"
"103120-100-ミドリ" = "だ、大丈夫なのかな？"
"103120-101-ユズ" = "……。"
"103120-102" = "[ns] \"大丈夫――アリスを信じよう。\""
"103120-103-ユズ" = "あ、アリスちゃん……！？ "
"103120-104-ミドリ" = "……アリスちゃんなんだよね？"
"103120-105-アリス" = "はい。アリスは大丈夫です。 "
"103120-106-アリス" = "……ということは、「名もなき神」の＜Key＞を服従させたのね？"
"103120-107-リオ" = "……いえ、これは服従ではなく―― "
"103120-108-アリス" = "はい。ケイがアリスのお願いを聞いてくれました。"
"103120-109-リオ" = "……？"
"103120-110-アリス" = "でも、アリス一人ではできません。#n今のアリスには、みんなの力が……"
"103120-111-リオ" = "そして、リオ会長の力が必要です。"
"103120-112-リオ" = "わ、私の……？"
"103120-113-アリス" = "顔を見せてください、リオ[ruby=・   ・]先輩[/ruby]。"
"103120-114-リオ" = "っ……わ、私は……"
"103120-115-リオ" = "……。"
"103120-116-アリス" = "……アリスは、リオ先輩と会いたかったです。 "
"103120-117-アリス" = "なんだか、前よりも痩せたように見えます。ちゃんと寝ていますか？"
"103120-118-リオ" = "アリス、私は……"
"103120-119-リオ" = "……私、は、 "
"103120-120-リオ" = "……自らの選択で、貴女を――"
"103120-121-アリス" = "リオ先輩……アリスに謝らなくても大丈夫です。"
"103120-122-リオ" = "……もちろん、貴女は私を許さないでしょうけれど……"
"103120-123-アリス" = "――許す必要はありません。"
"103120-124-アリス" = "なぜなら……仲間同士は、言葉にしなくても気持ちが伝わるものですから。"
"103120-125-リオ" = "私が……"
"103120-126-リオ" = "貴女の……「仲間」……？"
"103120-127-アリス" = "はい。リオ先輩は、アリスの仲間です。 "
"103120-128-アリス" = "リオ先輩はこうして先生やヒマリ先輩……それに、みんなを助けているのですから。だから、アリスたちはもう「仲間」です。"
"103120-129-リオ" = "で、でも私は……貴女を…… "
"103120-130-アリス" = "大丈夫です。"
"103120-131-アリス" = "序盤のボスが、後半で仲間になるのはよくあることです。#nお約束の展開だって聞きました。だから、大丈夫です。 "
"103120-132-アリス" = "リオ先輩は、この世界を守るために、誰よりも頑張った人です。"
"103120-133-アリス" = "そんなすごい人に……「アリスの仲間になってくれてありがとう」、と伝えたかったんです。"
"103120-134-リオ" = "……私は、 "
"103120-135-リオ" = "っ……私は……貴女を…… "
"103120-136-リオ" = "……。 "
"103120-137-アリス" = "では……始めます！"
"103120-138-アリス" = "ここからはアリスのターンです！！"
"103120-139-ミドリ" = "アリスちゃん！頑張って！！"
"103120-140-モモイ" = "お願いアリス、魔王城をぶっ飛ばして！！"
"103120-141-ユズ" = "アリスちゃん……お願い……！！"
"103120-142-アリス" = "……。"
"103120-143-ケイ" = "AL-1Sに接続された利用可能なリソースを確保するため、全体検索を実行。"
"103120-144-ケイ" = "リソース領域の拡大。"
"103120-145-ケイ" = "リソース名、「ウトナピシュティム」の全体リソース――9999万エクサバイトのデータを確認。"
"103120-146-ケイ" = "………現時刻をもって、プロトコルATRAHASIS稼動。"
"103120-147-ケイ" = "コード名「アトラ・ハシースの箱舟」起動プロセスを開始します。"
"103120-148-ケイ" = "王女は鍵を手に入れ、箱舟は用意された。"
"103120-149-アリス" = "名もなき神々の王女、AL-1Sが承認します――ここに、[ruby=サンクトゥム]新たな聖域が舞い[/ruby]降りん――――！"
"103120-150" = "???"
"103120-151" = "＜＜＜私の…………＞＞＞"
"103120-152" = "???"
"103120-153" = "＜＜＜私の大切な…………＞＞＞"
"103120-154" = "???"
"103120-155" = "＜＜＜私の大切な…………よ。＞＞＞"
"103120-156" = "???"
"103120-157" = "＜＜＜私の大切な…………アリス＞＞＞"
"103120-158" = "ケイ"
"103120-159" = "＜＜＜私の大切な…………アリス＞＞＞"
"103120-160" = "次回;「勇者」の資格（２）"
