[translation]
"103100-1" = "第10話;天上の遥か彼方へ"
"103100-2-ヒビキ" = "先生に、良いニュースがある。"
"103100-3-ヒビキ" = "なんと―― "
"103100-4-ヒビキ" = "オペレーターの衣装が、間に合ったよ。"
"103100-5" = "[s] \"おお……！？\""
"103100-6" = "[ns] \"これがオペレーターの衣装！！\""
"103100-7-ユウカ" = "えっと……これって、本当に必要なの？ "
"103100-8-ユウカ" = "うふふっ♡宇宙戦艦のオペレーターなら、ジャンルのルールは絶対、という強力な要請を受けまして……"
"103100-9-アコ" = "誰の要請ですか、それ。"
"103100-10-アヤネ" = "あの……これは宇宙戦艦ではない、という結論だった気がしますが……"
"103100-11-カヨコ" = "はぁ……なんで私まで……"
"103100-12-モモカ" = "まあまあ、運命を受け入れなって。#nこーんな分厚いマニュアルを覚えられて、かつ、この船に乗ってたのが運の尽きだよ。"
"103100-13-アユム" = "リン先輩……コート、お似合いです。"
"103100-14-リン" = "……なぜ、私だけデザインが違うのでしょうか。"
"103100-15" = "[s] \"そりゃあ、リンは[ruby=キャプテン]船長[/ruby]だからね！ロングコートじゃなきゃ！！\""
"103100-16" = "はぁ……。"
"103100-17-アヤネ" = "あ、あはは……少しの間なら、この格好も悪くないと思います……"
"103100-18-アヤネ" = "ふふ……さて、ここにいる方には多次元解釈を計算・検証する重要な役を担ってもらいます。"
"103100-19-アヤネ" = "ちなみに、この衣装は着用者の脳波や脈拍など、身体のコンディションを記録し――更には、任務遂行に支障が出ないよう、サポートする機能も搭載しております。"
"103100-20-ヒマリ" = "他にも、防炎・防爆・防水などなど――様々な機能が盛りだくさんの、「オペレーター専用装備」だと思ってください♪"
"103100-21-アコ" = "……「余計な機能しかないリモコン」ではなく？"
"103100-22-アコ" = "これに防水機能を……？#n何か意味あるの？"
"103100-23-カヨコ" = "まあまあ♡私たちには時間が無いのですから、細かいことは気にしないで、本題に移りましょう。"
"103100-24-リン" = "……そうですね。 "
"103100-25-リン" = "今から私たちは「ウトナピシュティムの本船」に乗り、キヴォトスの上空75,000mにある「アトラ・ハシースの箱舟」に突入…… "
"103100-26-リン" = "箱舟を占領し、機能を無力化――そして、無事地上に戻らなくてはなりません。"
"103100-27-リン" = "それでは、点呼をとります――"
"103100-28-リン" = "オペレーター、[ruby=うらわ]浦和[/ruby]ハナコ、[ruby=あまう]天雨[/ruby]アコ。"
"103100-29-リン" = "オペレーター、[ruby=おくそら]奥空[/ruby]アヤネ、[ruby=はやせ]早瀬[/ruby]ユウカ。"
"103100-30-リン" = "オペレーター、[ruby=おにかた]鬼方[/ruby]カヨコ、[ruby=あけぼし]明星[/ruby]ヒマリ。"
"103100-31-リン" = "オペレーター、[ruby=ゆらき]由良木[/ruby]モモカ、[ruby=いわびつ]岩櫃[/ruby]アユム。"
"103100-32-アユム" = "……そして私「ウトナピシュティムの本船」の統括責任者――[ruby=なながみ]七神[/ruby]リンです。"
"103100-33" = "[s] \"よろしくね、みんな。\""
"103100-34-アユム" = "「ウトナピシュティムの本船」の発進後、地上で航空管制および技術支援を担当するのは――"
"103100-35-リン" = "ミレニアムサイエンススクールのヴェリタス、[ruby=おとせ]音瀬[/ruby]コタマ、[ruby=おまがり]小鈎[/ruby]ハレ。"
"103100-36-リン" = "[ruby=こぬり]小塗[/ruby]マキ、[ruby=かがみ]各務[/ruby]チヒロ。そして――"
"103100-37-リン" = "エンジニア部、[ruby=ねこづか]猫塚[/ruby]ヒビキ、[ruby=しらいし]白石[/ruby]ウタハ、[ruby=とよみ]豊見[/ruby]コトリ。"
"103100-38-リン" = "箱舟の突入後、襲撃に備え占領戦のサポートをするのは――"
"103100-39-リン" = "アビドス対策委員会の[ruby=たかなし]小鳥遊[/ruby]ホシノ、[ruby=くろみ]黒見[/ruby]セリカ、[ruby=いざよい]十六夜[/ruby]ノノミ。"
"103100-40" = "よ、よろしくお願いします……！ "
"103100-41-ノノミ" = "おっけ～任せなって。 "
"103100-42-ノノミ" = "よし、準備は完璧！"
"103100-43-ホシノ" = "うんうん！みんなでシロコちゃんを助けに行きますよ☆"
"103100-44-リン" = "はい。対策委員会の皆さ[ruby=すなおおかみ]んは、砂狼シロコ[/ruby]の確保をするという事で、志願してくださりました。"
"103100-45-リン" = "……そして、"
"103100-46-リン" = "現在、この船唯一の武装であるレールガンの所有者、ゲーム開発部の[ruby=てんどう]天童[/ruby]アリス――"
"103100-47-リン" = "そして、[ruby=さいば]才羽[/ruby]モモイ、[ruby=さいば]才羽[/ruby]ミドリ、[ruby=はなおか]花岡[/ruby]ユズ……こちらの4名が、占領戦のサポートおよび、力を貸してくれるとのことです。"
"103100-48-ミドリ" = "よ、よろしくお願いします……"
"103100-49-ユウカ" = "はぁ……しょうがない、私が面倒を見ればいいのね。"
"103100-50-ユウカ" = "……絶対に無茶は禁物よ。安全が最優先だからね、いい？ "
"103100-51-リン" = "そして最後に――"
"103100-52-モモカ" = "ん～？まだいるの？"
"103100-53-リン" = "皆さんの食事を担当する、ゲヘナ給食部の[ruby=あいきよ]愛清[/ruby]フウカと……美食研究会。"
"103100-54-ハルナ" = "まってまって！なんか流れおかしくない！？"
"103100-55-ハルナ" = "うふふっ、皆さん、よろしくお願いしますね。"
"103100-56-フウカ" = "いや、なんで私がここにいるの！？"
"103100-57-フウカ" = "全然意味分かんない……宇宙戦艦って何！？"
"103100-58-フウカ" = "百歩譲って、料理を作るためっていうのは理解できるけど……#nそれなら、なんでジュリがいないのに美食研究会がいるのよ？ "
"103100-59-フウカ" = "ふふっ……そんなの、当然でしょう？"
"103100-60-フウカ" = "一生に一度、口にできるかどうかの料理を食べるチャンスが――目の前にあるからですわ。"
"103100-61-フウカ" = "一生に一度……？"
"103100-62-ハルナ" = "ええ。私たちが動く理由はいつだって同じ――"
"103100-63-ハルナ" = "美食を追求するためなのですから！"
"103100-64-ハルナ" = "――宇宙で口にする食事は、どれほど美味なのでしょうね？"
"103100-65-イズミ" = "そうだよ～！宇宙でご飯食べる機会なんて、もう二度とないかもしれないじゃん！"
"103100-66-イズミ" = "映画で観た空中に浮かんでる液体をストローで吸うヤツ、やってみたいのよね。"
"103100-67-イズミ" = "と～っても楽しみです★"
"103100-68-ハルナ" = "そう――宇宙食は、無重力状態を想定して作られる、特別な食べ物。 "
"103100-69-ハルナ" = "液体類の取り扱いはもちろん、調理が不可能な環境、食中毒防止のための殺菌過程など……気を配らなければならないことがたくさんある、奥深いジャンルです。"
"103100-70-ハルナ" = "であるが故に…… "
"103100-71-ハルナ" = "フウカさんが、ここにいるのです！！"
"103100-72-フウカ" = "だから、何で私――！？"
"103100-73-アカリ" = "もしもの時に備えて、給食部のトラックも乗せておきました★#nなので、フウカさんがいないとダメなんです。"
"103100-74-フウカ" = "えっ、給食部のトラックまで……！？いっ、いつの間に……！？"
"103100-75-フウカ" = "もっと自信持ちなさいよ。山、川……そして今度は宇宙でしょ？なかなかそんな体験できないわよ。"
"103100-76-フウカ" = "そうそう！こんな経験豊富なトラック見たことないよ！今度は無重力だよ！？"
"103100-77-ジュンコ" = "いや……そんな経験、いらないから……"
"103100-78" = "[s1] （…………）\n[s2] （無重力の高度までは行かないけど、それは内緒にしておこう……）"
"103100-79-アユム" = "……先生、「ウトナピシュティムの本船」の起動に関してですが――#n本来はサンクトゥムタワーによって起動するのだと聞きました。"
"103100-80-リン" = "カイザーPMCがこの船を見つけた直後に、サンクトゥムタワーを掌握しようとした一連の流れも、その理由からでしょう。"
"103100-81-リン" = "サンクトゥムタワーが破壊された今、これを起動できるのは、#n「シッテムの箱」を所有している先生――あなただけです。"
"103100-82" = "[s] \"うん、任せて。\""
"103100-83-リン" = "はい……では、よろしくお願いします。"
"103100-84-アロナ" = "……はい。私の能力でこのオーパーツを起動する事は……可能です。"
"103100-85-アロナ" = "でも……これは、今までとは異なります。私は大丈夫でも…… "
"103100-86-アロナ" = "このオーパーツに宿っている力は……「シッテムの箱」の所有者である先生に、影響を及ぼします……"
"103100-87" = "[s] \"大丈夫だよ、アロナ。\""
"103100-88-アロナ" = "せ、先生の肉体は普通の人と変わりません……！#n銃弾1つで、危険な状況に陥るかもしれないんですよ！ "
"103100-89" = "[s] \"でも、いつもアロナが守ってくれたよね。\" "
"103100-90-アロナ" = "で、でも、これは……今までとは違うんです……"
"103100-91-アロナ" = "もう一度考え直してください、先生……#nどれだけの負担がかかるのか、私でさえ把握できていないんです……"
"103100-92-黒服" = "……その前に、一つ警告を。"
"103100-93-黒服" = "[USERNAME]先生の肉体は、これを使用した瞬間――#n取り返しのつかない被害に遭うでしょう。"
"103100-94-黒服" = "二度と、以前の状態に戻る事はできません。#n――死に至る事さえ、有り得るのです。 "
"103100-95-黒服" = "――それでも、よろしいのですか？"
"103100-96-黒服" = "その結末が、火を見るよりも明らかだとしても？"
"103100-97" = "[ns] \"大丈夫だよ、アロナ。よろしくね。\""
"103100-98-アロナ" = "ど、どうしてそこまで――"
"103100-99-黒服" = "……何故、そこまでするのですか？"
"103100-100-黒服" = "この破滅を逃れることなどできません――#nこれは、古より定まっていた事象……それが私の結論です。"
"103100-101-黒服" = "[ruby=すなおおかみ]そう、砂狼シロコ[/ruby]――彼女がこの世界に存在した瞬間から、決定された結末。"
"103100-102-黒服" = "時間は連続する事なく、決まりきった因果を繰り返すのみ―― "
"103100-103-黒服" = "我々――全ての存在は、そうした決定論の下にある布石でしかないのです。"
"103100-104-黒服" = "……。"
"103100-105-黒服" = "これを防ぎたいというのであれば――"
"103100-106-黒服" = "あなたは、過去に戻って彼女を殺すべきでした……クックックッ。"
"103100-107-黒服" = "あなたは、絶対に己を理解できないだろうと豪語しておりましたね……ええ。私は今もなお、あなたという存在を理解する事などできません。 "
"103100-108-黒服" = "何故、既に定められた運命を変えられると考えるのですか？#n何故、破滅を迎える未来にあえて突き進むのでしょうか？"
"103100-109-黒服" = "……今一度、お聞きします。 "
"103100-110-黒服" = "……何故？と。"
"103100-111" = "[ns] \"…………。\""
"103100-112" = "[ns3] \"大人として――子供を守り、先生として生徒を守るため。\"\n[ns4] \"大人の責任――先生の義務を、果たすためだよ。\""
"103100-113-黒服" = "それがどのような方法であろうと……"
"103100-114-黒服" = "いかなる代償を支払うことになろうと？"
"103100-115" = "[s5] \"そう。どんな方法だったとしても、\"\n[s6] \"いかなる代償を支払うことになったとしても。\""
"103100-116-黒服" = "……。 "
"103100-117-黒服" = "――生徒を、助けに行くのですね？[USERNAME]先生。"
"103100-118" = "[ns] \"そうだよ。\""
"103100-119-リン" = "……先生？"
"103100-120" = "[ns] \"リン、一つ聞きたいことがあるんだ。\""
"103100-121-リン" = "……？#nはい、どうぞ。"
"103100-122" = "[s] \"「二つ目の古則」についてなんだけど。\""
"103100-123-リン" = "「理解できないものを通じて、理解を得ることができるのか」――連邦生徒会長が言っていた、あの質問ですか……？……はい。覚えております。"
"103100-124" = "[s] \"……リンはその時、何と答えたの？\""
"103100-125-リン" = "なぜ、そのような質問を……"
"103100-126-リン" = "いえ……私はあの時、"
"103100-127-リン" = "……。"
"103100-128-？？？" = "……リンちゃん。"
"103100-129-連邦生徒会長" = "きっと私たちは、永遠にお互いを理解する事なんて、できないと思う。 "
"103100-130-連邦生徒会長" = "リンちゃんにとっての私は、きっと理解ができない不思議な存在――"
"103100-131-連邦生徒会長" = "そして、私たちはお互いが交わらないまま――別々の道を歩むしかないんだと思うの。"
"103100-132-連邦生徒会長" = "それがきっと――この世界の真意なんだ。"
"103100-133-連邦生徒会長" = "……でも、それでも構わない。"
"103100-134-連邦生徒会長" = "たとえ、理解できない存在だったとしても、"
"103100-135-連邦生徒会長" = "お互いにとって、相手が実体のない風のような……"
"103100-136-連邦生徒会長" = "隙間を通り過ぎていく――そんな存在だったとしても構わないの。"
"103100-137-連邦生徒会長" = "だからこそ……私は、リンちゃんが完成させてくれた文が好きなんだ。"
"103100-138-連邦生徒会長" = "だからね、その質問の答えは……私が大事にしまっておくね。"
"103100-139-連邦生徒会長" = "そう……私たちは、"
"103100-140" = "「理解できない[ruby=もの]他人[/ruby]を通じて、[ruby=たがい]己[/ruby]の理解を得ることができるのか」"
"103100-141-リン" = "――その答えは、地上に戻ってからでも……よろしいでしょうか？"
"103100-142" = "[s] \"うん、それで十分だよ。ありがとう。\""
"103100-143" = "[ns] \"それじゃあ、出発しよっか。\""
"103100-144" = "[ns] ウトナピシュティムの起動装置にシッテムの箱を繋げる。"
"103100-145-アコ" = "メインパワーの起動を確認しました！"
"103100-146-アユム" = "メインコントロールシステムの稼働、完了……！！"
"103100-147-モモカ" = "各エリアの通信システム、演算システムのチェック、オールクリア――#nここまではマニュアル通り、ばっちりだね。"
"103100-148-カヨコ" = "エンジンシステム、クリア。"
"103100-149-ハナコ" = "多次元解釈システムのチェック、クリア。#nオールクリアです！ "
"103100-150-ユウカ" = "管制システムチェック、オールクリア……#nよし！これで全部使えるわよ！"
"103100-151-アコ" = "発進準備、完了！命令待機中です！"
"103100-152-リン" = "先生、発進の号令をお願いします……！"
"103100-153" = "[ns7] \"ウトナピシュティムの本船、発進！！\"\n[ns8] \"宇宙戦艦「ウトナピシュティム」、発進！！\""
"103100-154-アヤネ" = "これより「ウトナピシュティムの本船」――離陸します！！"
"103100-155-アヤネ" = "高度上昇……現在、780m！ "
"103100-156-アヤネ" = "多次元解釈システムの起動は今でいいのよね？"
"103100-157-ヒマリ" = "計算は終わりました。ハナコさん、お願いします。"
"103100-158-ハナコ" = "計算完了……多次元解釈システム、起動します！"
"103100-159" = "[ns9] \"…………！！！\"\n[ns10] （体に衝撃が伝わってくる……）"
"103100-160-リン" = "……先生？ "
"103100-161-リン" = "せ、先生？顔色があまり良くありません。大丈夫ですか……？"
"103100-162-リン" = "あれ、震えてない……？#nどうしたの、先生……？"
"103100-163" = "[s] \"ちょっと乗り物酔いがね……\""
"103100-164-アユム" = "……申し訳ありません、もう少しの辛抱です。 "
"103100-165" = "システムの正常動作を確認！ "
"103100-166-ハナコ" = "現在、私たちのウトナピシュティムの本船は、箱舟と同じ「確率的な存在」となりました。"
"103100-167-ハナコ" = "えっと、どういうこと？"
"103100-168" = "多分だけど……確率的に存在可能なあらゆる宇宙に、私たちが同時に存在する……って事だと思う。"
"103100-169-アコ" = "並行宇宙というものがあれば、ですが。"
"103100-170-アヤネ" = "あはは……次元パラドックスが発生しないといいのですが……"
"103100-171-ユウカ" = "大丈夫。もしそうなったとしても、衛星の一つとしか認知されないはずよ。"
"103100-172-リン" = "雑談はそこまでに。#n――航路の目標設定をお願いします！"
"103100-173-カヨコ" = "目標高度75,000mにある箱舟までの航路を計算……設定、完了。"
"103100-174-モモカ" = "わ～、めっちゃ揺れる……"
"103100-175-モモカ" = "も、もう少しだけ耐えてください、先生。"
"103100-176-リン" = "これより、「アトラ・ハシースの箱舟」に向かって加速します。"
"103100-177-モモカ" = "うわっ、みんなしっかり掴まってね！#nマニュアル通りなら、尋常じゃない速度が出るはずだから！"
"103100-178-アヤネ" = "最大出力……加速します！！"
"103100-179-ユウカ" = "さあ、「オーパーツ」の性能とやらをチェックさせてもらうわよ。"
