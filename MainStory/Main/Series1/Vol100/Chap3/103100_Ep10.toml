"103100-187" = "[ns] （意識が、遠のいて……）"
"103100-188" = "[ns] （体が……言うことを聞かない……）"
"103100-189-黒服" = "何故、既に定められた運命を変えられると考えるのですか？#n何故、破滅を迎える未来にあえて突き進むのでしょうか？"
"103100-190" = "[ns] （ここは……）"
"103100-191" = "[ns] （なんだか、懐かしい感覚がする……）"
"103100-192" = "次回;はじまりの物語"
