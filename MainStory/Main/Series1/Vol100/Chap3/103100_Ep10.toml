"103100-181-ユウカ" = "だ、大丈夫ですかユウカさん？"
"103100-182-ユウカ" = "な、なんとか……。 "
"103100-183-カヨコ" = "すごいスピード…… "
"103100-184-ハナコ" = "た、多次元解釈の波動値が不安定です！予想を遥かに上回っています！"
