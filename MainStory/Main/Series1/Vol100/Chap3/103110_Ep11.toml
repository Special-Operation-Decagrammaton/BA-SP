[translation]
"103110-1" = "第11話;はじまりの物語"
"103110-2-連邦生徒会長" = "……私のミスでした。"
"103110-3-連邦生徒会長" = "私の選択、そしてそれによって招かれたこの全ての状況。"
"103110-4-連邦生徒会長" = "結局、この結果にたどり着いて初めて、あなたの方が正しかったことを悟るだなんて……。"
"103110-5-連邦生徒会長" = "……今更図々しいですが、お願いします。"
"103110-6-連邦生徒会長" = "[USERNAME]先生。"
"103110-7-連邦生徒会長" = "きっと私の話は忘れてしまうでしょうが、それでも構いません。"
"103110-8-連邦生徒会長" = "何も思い出せなくても、おそらくあなたは同じ状況で、同じ選択をされるでしょうから……。"
"103110-9-連邦生徒会長" = "ですから……大事なのは経験ではなく、選択。 "
"103110-10-連邦生徒会長" = "あなたにしかできない選択の数々。"
"103110-11" = "責任を負う者について、話したことがありましたね。"
"103110-12" = "あの時の私には分かりませんでしたが……。今なら理解できます。"
"103110-13-連邦生徒会長" = "大人としての、責任と義務。そして、その延長線上にあった、あなたの選択。 "
"103110-14-連邦生徒会長" = "それが意味する心延えも。"
"103110-15" = "― ……。"
"103110-16" = "― ですから、[wa:900]先生。"
"103110-17" = "― 私が信じられる大人である、[wa:1800]あなたになら、"
"103110-18" = "― この[ruby=ね]捻[/ruby]じれて歪んだ先の終着点とは、"
"103110-19" = "― この[ruby=ね]捻[/ruby]じれて歪んだ先の終着点とは、[wa:150]また別の結果を……。"
"103110-20" = "― そこへ繋がる選択肢は……"
"103110-21" = "― きっと見つかるはずです。"
"103110-22-連邦生徒会長" = "だから先生、どうか……。"
"103110-23-連邦生徒会長" = "この、絆を――"
"103110-24-連邦生徒会長" = "私たちとの思い出……過ごしてきたそのすべての日々を……どうか……。"
"103110-25-ユウカ" = "なっ、何！？"
"103110-26-ハナコ" = "多次元解釈システムに、エラー発生……！！ "
"103110-27-ハナコ" = "「ウトナピシュティム」の状態が……箱舟と一致しません！"
"103110-28-ユウカ" = "どういう事！？システムの故障！？"
"103110-29-ユウカ" = "い、いえ……これは―― "
"103110-30-リオ" = "違うわ！値が変わったのは「アトラ・ハシースの箱舟」の方よ！！"
"103110-31-リオ" = "り、リオ会長！？"
"103110-32-ハナコ" = "……！！"
"103110-33-ヒマリ" = "そ、そんな……あり得ません…… "
"103110-34-ヒマリ" = "「アトラ・ハシースの箱舟」に変化が？……まさか、私たちから逃れるために……！？"
"103110-35-リオ" = "私たちが認知している多次元ではなく……別の新しい軸を作ったのね。 "
"103110-36-リオ" = "二次元の存在に対して、三次元を説明できないのと同じように……#n私たちには知覚できない次元へと退避したのでしょう。"
"103110-37-ユウカ" = "そ、そんな……"
"103110-38-ハナコ" = "……多次元解析を凌駕する計算など、造作もないと……？ "
"103110-39-ヒマリ" = "まさか、今までの分析が全て――"
"103110-40-ヒマリ" = "無駄であった、と……？"
"103110-41" = "次回;「勇者」の資格（１）"
