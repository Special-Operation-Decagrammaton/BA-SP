[translation]
"103130-1" = "第13話;「勇者」の資格（２）"
"103130-2-リオ" = "……始まったのね。"
"103130-3-リオ" = "「アトラ・ハシースの箱舟」の基本概念は、周りのデータを「収集」し、「変形」させること。"
"103130-4-リオ" = "それに対し、コピーではなくオリジナルの存在が介入したのなら……多次元解釈とは関係なく、あのバリアを貫通できるはずよ。"
"103130-5-リオ" = "あの時、要塞都市のデータで生み出されようとしていた箱舟は……#n巨大なシェルターの形をしていました。"
"103130-6-ヒマリ" = "おそらく……リオ、あなたの心に巣食った恐怖が投影された要塞都市を基盤として構築されたからでしょう。 "
"103130-7-リオ" = "……であれば、今アリスが生み出した箱舟は……？"
"103130-8-ヒマリ" = "……ふふっ、答えはもう出ていますよ♪"
"103130-9-ウタハ" = "「ウトナピシュティム」のデータが分解されて――再構築されている！？本当に、これでいいのかい？"
"103130-10-ヒビキ" = "あ、あれ……"
"103130-11-ヒビキ" = "銃とは思えないあの大きさ……もしかして――"
"103130-12-コトリ" = "！？あれは、私たちエンジニア部の会心作……"
"103130-13-コトリ" = "って、大きさが桁違いじゃないですか！"
"103130-14-ウタハ" = "あれは……"
"103130-15" = "光の剣……！？"
"103130-16-ヒマリ" = "ええ。あれが本来の「アトラ・ハシースの箱舟」であり、#nアリスの[ruby=こころ]勇気[/ruby]を基盤として構築された、「勇者の証」――"
"103130-17-ヒマリ" = "そうですね……名付けるとすれば"
"103130-18-ヒマリ" = "「光の剣：アトラ・ハシースのスーパーノヴァ」でしょうか？"
"103130-19-アリス" = "ターゲット確認。出力臨界点突破……！"
"103130-20-アリス" = "魔力充電……100%、行きます！"
"103130-21-アリス" = "悪を打ち砕く正義の一撃……"
"103130-22-リオ" = "……そうね、アリス。"
"103130-23-リオ" = "ここは――貴女たちの表現を借りるとしましょう。"
"103130-24-リオ" = "行け、勇者よ……！#n私たちの世界を救いなさい！！！"
"103130-25-アリス" = "もちろんです！#nアリスは、仲間の期待に応えます！！"
"103130-26" = "光――――――"
"103130-27-アリス" = "――――よ！！！！！！"
"103130-28-ユウカ" = "光の剣から……超高濃度エネルギーの発射を確認！！"
"103130-29-カヨコ" = "エネルギーが、箱舟に真っ直ぐ向かってる……！！"
"103130-30-アコ" = "ビームの軌道を計算中――誤差は0.003%！問題ありません！！"
"103130-31-アコ" = "発射されたエネルギーは、まもなく箱舟の中央に届きます！#n……ですが――"
"103130-32-ハナコ" = "……そうですね。#n果たして、箱舟の「多次元バリア」を、光の剣が貫通できるでしょうか……"
"103130-33-ヒマリ" = "アリス……！！"
"103130-34-リオ" = "アリス――――！！"
"103130-35-ハナコ" = "直撃です！多次元バリア、粉砕！！！"
"103130-36" = "[s] \"やった！！！\""
"103130-37-リオ" = "っ…………！！！"
"103130-38-ヒマリ" = "本当に――多次元バリアを貫通したのですね……！ "
"103130-39-ハナコ" = "多次元バリアが「状態の共存」を維持できず、崩壊を開始しました――！ "
"103130-40-ユズ" = "あ、ああっ……！？"
"103130-41-モモイ" = "あ、アリス！？"
"103130-42-ミドリ" = "アリスちゃん！！しっかりして……！"
"103130-43-ユウカ" = "あ、アリスちゃんは……！？大丈夫なの！？"
"103130-44-モモイ" = "い、今、安全な場所に連れて行ってるとこ！"
"103130-45-ヒマリ" = "……！？#nそ、そんな……"
"103130-46-ミドリ" = "いえ……！意識は失っていますが、アリスちゃんは無事です！ "
"103130-47-ユズ" = "はい。眠っているだけです……医務室に連れて行って、わたしたちが様子を見ます……！"
"103130-48-ユウカ" = "え、ええ、頼んだわよ……！"
"103130-49-アコ" = "約5秒後、こちらに衝撃波が来ます！#nみなさん衝撃に備えてください！！"
"103130-50-カヨコ" = "多次元バリアの「状態の共存」が消失！#n最終機能の停止を確認したよ！！ "
"103130-51-ユウカ" = "よし……という事は、箱舟はもう無防備ってことよね？"
"103130-52-モモカ" = "ぐううっ……！！"
"103130-53-アユム" = "り、リン先輩……！"
"103130-54-リン" = "このチャンスを、逃してはなりません……！！"
"103130-55-モモカ" = "えっ、えっ？"
"103130-56-リン" = "ウトナピシュティム、最大速力で突進します！！"
"103130-57-アコ" = "い、今ですか……！？"
"103130-58-カヨコ" = "それで合ってる！#n敵に先手を打たれる前に突入しないと！"
"103130-59-アヤネ" = "は、はい！分かりました！！"
"103130-60-アヤネ" = "最高出力で……突進します――！！！"
"103130-61-アユム" = "ば、バリア衝突まで約3秒……！！"
"103130-62-モモカ" = "うあああ……だ、大丈夫なんだよね！？ "
"103130-63-アユム" = "今は多次元バリアが無力化された状態ですから、きっと大丈夫です……！"
"103130-64-リン" = "はい。バリアを突破し、このまま箱舟内部に侵入します！！"
"103130-65" = "……しょ、衝撃来るよ！！しっかり掴まって！！"
"103130-66-アコ" = "バリア、突破！！！アヤネさん、緊急制御を！"
"103130-67-アヤネ" = "はい！緊急制御シーケンス、稼働！！"
"103130-68-カヨコ" = "「ウトナピシュティムの本船」、逆推力装置を稼働！#nエンジンへの過負荷に注意して！"
"103130-69-ハナコ" = "まもなく、箱舟本体と衝突します！！#nみなさん、さらなる衝撃に備えてください！！"
"103130-70-アヤネ" = "は、箱舟の外壁と衝突！！"
"103130-71-リン" = "……。"
"103130-72-モモカ" = "はぁ……はぁ…… "
"103130-73-モモカ" = "せ、成功したの……？"
"103130-74-モモカ" = "そ、そうみたいです……。"
"103130-75" = "ここが……箱舟の中？"
"103130-76-アユム" = "……はい。#nようやく……内部に侵入できました。"
"103130-77" = "[s] \"よかった……大成功だね。\""
"103130-78-アヤネ" = "はぁ……寿命が縮みました……。"
"103130-79-カヨコ" = "まさか、本当にこんなやり方で成功するとはね……。"
"103130-80-ハナコ" = "はぁぁ……脚に力が入りません……。"
"103130-81-ヒマリ" = "本当に、箱舟を対処しきるだなんて……#nこのような方法で乗り切れるとは、想像もしておりませんでした。 "
"103130-82-リオ" = "そうね……本当に、アリスが世界を救ったわ。"
"103130-83-リオ" = "……いいえ。アリスならこう答えるでしょう――"
"103130-84-ヒマリ" = "「仲間がいたから、やり遂げられた」、と。"
"103130-85-リオ" = "……。"
"103130-86-ヒマリ" = "正確には……リオ、あなたがいたから。#nあなたの発想があったから、と。 "
"103130-87-ヒマリ" = "超天才美少女の私でさえも、あのような発想はできなかったと思います。"
"103130-88-リオ" = "……ヒマリ、私は――"
"103130-89-ヒマリ" = "……今はまだ、ですが。#nもしも――私たちが世界を救うことに成功したのであれば、"
"103130-90-ヒマリ" = "それはきっと、リオ――あなたのおかげでしょう。"
"103130-91" = "[s] \"そうだよ。リオが世界を救ったんだ。\""
"103130-92-リオ" = "私は……"
"103130-93-リオ" = "………… "
"103130-94-リオ" = "……。"
"103130-95-ヒマリ" = "リオ……？"
"103130-96-アリス" = "王女……。"
"103130-97-ケイ" = "さようなら、ケイ……"
"103130-98-ケイ" = "これでアリスは……"
"103130-99-アリス" = "ごめんなさい……アリスに、教えて、くれたのに……。"
"103130-100-ケイ" = "……王女よ。 "
"103130-101-ケイ" = "あなたは……その力を使えば、自らが危険に晒されると分かっていて……"
"103130-102-ケイ" = "……"
"103130-103-ケイ" = "自身の存在が消えるかも――命を落とすかも、しれないというのに……"
"103130-104-ケイ" = "私を――皆を救うためであれば、死をも恐れないのでしょうか。 "
"103130-105-ケイ" = "それが、あなたの勇気……それが、「勇者」なのでしょうか。"
"103130-106-ケイ" = "……いいえ。あなたは消えてはなりません。#n私はそれを拒否します。"
"103130-107-ケイ" = "……心配しないでください、あなたは消えません……私がそれをさせません。"
"103130-108-ケイ" = "消えるべき存在は、勇者ではなく――世界を滅ぼす「道具」であるべきなのですから。 "
"103130-109-ケイ" = "それが正しいのです。#nですから――"
"103130-110-ケイ" = "――これで、大丈夫です。 "
"103130-111-ケイ" = "……それと、"
"103130-112-ケイ" = "私に、謝らないでください――アリス。"
"103130-113-アリス" = "ケイ……。"
"103130-114-モモイ" = "アリス……夢を見てるのかな？#n優しい顔をしてる。"
"103130-115-アリス" = "……。"
"103130-116-ミドリ" = "あれ……？い、今アリスちゃんが何か言ってたような……"
"103130-117-ユズ" = "あ、アリスちゃん？#n「ケ」……？"
"103130-118-モモイ" = "アリス……？#n泣いてるの……？"
"103130-119" = "次回;突入"
