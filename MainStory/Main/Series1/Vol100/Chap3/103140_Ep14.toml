[translation]
"103140-1" = "第14話;突入"
"103140-2-アユム" = "今、私たちは箱舟の外壁に、頭を半分埋めているような状態です。"
"103140-3-アユム" = "遠くから観測したとすれば、リンゴに爪楊枝が刺さったような姿かと……"
"103140-4-モモカ" = "はぁあ……つ、つかれたぁ～"
"103140-5-リン" = "皆さんご無事でしょうか。状況の報告をお願いします。"
"103140-6-リン" = "多次元解釈システム、問題ありません。#nただ、衝突の影響で中枢システムがダメージを受けたようです。"
"103140-7-アヤネ" = "エンジンは完全にシャットダウンしてしまって……再起動シーケンスも動きません…… "
"103140-8-アコ" = "メインコントロールシステムも動作不能ですね……。"
"103140-9-カヨコ" = "各エリアの通信もダメ……それに、演算システムもボロボロ。"
"103140-10-アユム" = "な、何でしょうか！？ "
"103140-11-アユム" = "うわっ、サンクトゥムにいた敵じゃん！？#nこっちに向かってきてるよ！"
"103140-12-ユウカ" = "ちょっと……全方向から来てるじゃない！"
"103140-13-ヒマリ" = "想定はしておりましたが、これほどまでに早く……！？#nまるで、待ち構えていたかのような……"
"103140-14-アコ" = "まぁ、私たち……敵の本拠地にいますからね……"
"103140-15-カヨコ" = "なんとかして止めないと……船が壊れたら、一巻の終わりだよ。#n交戦できる人は？"
"103140-16-ユウカ" = "そ、そうね！交戦できる人は……"
"103140-17-？？？" = "うへ～、おじさんたちの出番かな？"
"103140-18-アヤネ" = "……ホシノ先輩！ "
"103140-19-ノノミ" = "うんうん、準備万端ですよ！いつでも行けます！"
"103140-20-アヤネ" = "はい！それでは私がサポートします。#n先輩方は、東側の通路の防衛をお願いします！"
"103140-21-ホシノ" = "それじゃ、行こっか～"
"103140-22-セリカ" = "いくわよ！！"
"103140-23-ハルナ" = "ふふっ。それでは、ここは私たちにお任せを。"
"103140-24-ハルナ" = "うう……酔ったぁ。"
"103140-25-フウカ" = "何でまた私が……はぁ……。"
"103140-26-アコ" = "美食研究会……いつの間に？"
"103140-27-イズミ" = "詳しいことは分かりませんが、ここでドッカーン★とすればいいんですよね？"
"103140-28-イズミ" = "ええ。私たち美食研究会は……探求を邪魔する者に背を向けたことはありません。 "
"103140-29-アカリ" = "そうだよ！宇宙食への旅路は、まだ始まったばかりだからね！"
"103140-30-アコ" = "（その旅路、終わらないと思いますけど……）"
"103140-31-アコ" = "はぁ……まあ、猫の手も借りたい状況ですし、"
"103140-32-アコ" = "行きましょうか。#n私がサポートします。 "
"103140-33-ハルナ" = "ありがとうございます、アコさん。 "
"103140-34-アカリ" = "では始めましょっか★"
"103140-35-ユズ" = "こ、ここはわたし達が守ります……。"
"103140-36-ユウカ" = "ゲーム開発部！？い、いつからそこにいたの？"
"103140-37-ミドリ" = "えっと……アリスちゃんはまだ寝てるけど、私たちが力になれたらと思って……"
"103140-38-ミドリ" = "そう！私たちと先生なら、なんとかなるって！"
"103140-39-ユウカ" = "……わ、分かったわよ！#nじゃあ私がサポートに回るけど、くれぐれも無茶はしないでよね？ "
"103140-40-モモイ" = "ユウカがサポートしてくれるなら、もう無敵じゃない？#nよぉし、いっくよ～！！"
"103140-41-ミドリ" = "はい、よろしくお願いします！"
"103140-42-ユズ" = "い、行こう……！頑張ろうね……！"
"103140-43-リン" = "では先生。#n「ウトナピシュティムの本船」の防衛戦、総指揮をお願い致します！"
"103140-44" = "[ns] \"対策委員会、ゲーム開発部、美食研究会のみんな……行こう！！\""
