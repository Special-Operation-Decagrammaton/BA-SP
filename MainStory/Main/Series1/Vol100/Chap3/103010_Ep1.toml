[translation]
"103010-1" = "第1話;役割"
"103010-2" = "百鬼夜行・大雪原のどこか"
"103010-3-ミチル" = "ニヤが言ってた場所……もうすぐだと思うんだけど……"
"103010-4-イズナ" = "その……先ほどから、怪物の姿を見ないような……イズナの気のせいでしょうか？"
"103010-5-ミチル" = "たしかにそんな気も……#nするような……しないような……"
"103010-6" = "そ、そうですね……！#nここに来てから、敵と会わなくなりました。"
"103010-7-イズナ" = "部長、空が……！"
"103010-8-ツクヨ" = "あ…… "
"103010-9-ミチル" = "空が……"
"103010-10-イズナ" = "も、元の色に……"
"103010-11-イズナ" = "主殿がやり遂げてくださったのですね！ "
"103010-12-ミチル" = "そっか……"
"103010-13-ミチル" = "先生殿、ついに……！"
"103010-14-ミチル" = "う、うにゃああぁっ！？#nな、何！？敵！？"
"103010-15-ツクヨ" = "い、いえ……これはただの、銃声……！"
"103010-16-？？？" = "……敵じゃなかったんだ。#nごめんね。"
"103010-17-ミチル" = "！！"
"103010-18-ミチル" = "んにゃっ、"
"103010-19-ミチル" = "人に銃口を向けておいて「ごめん」で済ませるつもり！？"
"103010-20-ミチル" = "……って、あれ？"
"103010-21-イズナ" = "[ruby=なにやつ]何奴[/ruby]……！？"
"103010-22-？？？" = "そういうあなた達は……？#n百鬼夜行の生徒に見えるけど……ここに一体何の用？"
"103010-23-ツクヨ" = "わ、私たちは……"
"103010-24-イズナ" = "イズナ達は、百花繚乱の委員長に用があり、「黄昏の寺院」を探しております！ニンニン！"
"103010-25-ツクヨ" = "はい……そう、です。#n「シャーレの先生」の、お願いで……。"
"103010-26-？？？" = "……そうなんだ。"
"103010-27-ミチル" = "ああっ！！思い出した！"
"103010-28-ツクヨ" = "ぶ、部長……？"
"103010-29-ミチル" = "その格好……見覚えがあるよ！！"
"103010-30-ミチル" = "百花繚乱の制服だよね？そうでしょ！？"
"103010-31-イズナ" = "ええっ！百花繚乱……！？ "
"103010-32-ツクヨ" = "それでは……あなたが……？"
"103010-33-ミチル" = "いや、待って……"
"103010-34-ミチル" = "あなた、百花繚乱の委員長だったアヤメじゃないよね？あの子、クールっていうより、どっちかっていうとキラキラした陽キャっぽい感じだったし。"
"103010-35-ミチル" = "……あっ、でも逆に副委員長は陰キャっぽかったかも？#n二人セットで陰と陽みたいな！"
"103010-36-ツクヨ" = "副委員長、ですか？"
"103010-37-ツクヨ" = "それでは……あなたが百花繚乱の、副委員長なのでしょうか……？"
"103010-38-？？？" = "ううん、違うよ。"
"103010-39-ミチル" = "……ええっ、うっそ！？"
"103010-40-？？？" = "違うってば。人の話を聞いてよ。"
"103010-41-ミチル" = "いやいや待ってよ！その格好は百花繚乱だけが袖を通せる制服でしょ！？#nじゃあ、一体どこで手に入れたの？"
"103010-42-？？？" = "これは――"
"103010-43-？？？" = "――コスプレ。"
"103010-44-イズナ" = "なるほど、"
"103010-45-イズナ" = "そうだったのですね……！#nすみません、人違いで――"
"103010-46-？？？" = "いやいやいや！#nそんな都合のいい偶然、あるわけないでしょ！？"
"103010-47-？？？" = "ううん、あるよ。"
"103010-48-？？？" = "コスプレイヤーは、奇跡の一枚のためなら百鬼夜行の大雪原だろうと、アビドスの大砂漠だろうと、オデュッセイアの大海洋だろうと、ロケに行くもの。"
"103010-49-イズナ" = "お、おお……コスプレイヤーの鑑ですね！"
"103010-50-ツクヨ" = "す、すごいです……！"
"103010-51-ミチル" = "そ、そういうことなら……"
"103010-52-ミチル" = "じゃなくて！#nあなた、カメラもなにも持ってないじゃない！"
"103010-53-？？？" = "それは……"
"103010-54-？？？" = "カメラはなくてもいいの。#n本当に大切な思い出は、心のカメラで撮影しているから。"
"103010-55-ミチル" = "いや……コスプレなんだから心のカメラじゃ自分の姿撮れなくない？"
"103010-56-ミチル" = "もしかして……適当なこといってたりするんじゃ……？"
"103010-57-？？？" = "……！"
"103010-58-？？？" = "……うう。"
"103010-59-イズナ" = "ぶ、部長！きっと、彼女にも何か事情があるのだと思います！"
"103010-60-ミチル" = "あ、いや、別に傷つけるつもりじゃ……#nその、カメラがない事が気になっちゃっただけで……#n持ってないなら貸そうかな～なんて……"
"103010-61-？？？" = "でも、私は…………"
"103010-62-？？？" = "っ……ぐすっ。"
"103010-63-ツクヨ" = "あの……だ、大丈夫でしょうか……？"
"103010-64-ツクヨ" = "私はいいと思いますよ……衣装を着る、だけでも気持ちが変わったりしますし……"
"103010-65-？？？" = "……一人にして。"
"103010-66-ミチル" = "な、なんかごめん……。"
"103010-67-ナグサ" = "私は[ruby=ごりょう]御稜[/ruby]ナグサ。"
"103010-68-ナグサ" = "百花繚乱の副委員長――今は事情があって、一人でここにいるの。"
"103010-69-ミチル" = "……やっぱり百花繚乱だったんじゃん！！"
"103010-70-ナグサ" = "あなた達の事情は分かった。でも、無駄だから帰って。"
"103010-71" = "ど、どうしてですか……！？"
"103010-72-ナグサ" = "「黄昏の寺院」は、破壊されてから随分と経つの。#n今はもう、雪に埋もれてしまってるんじゃないかな。"
"103010-73-ツクヨ" = "……そ、そんな。"
"103010-74-ミチル" = "じゃあ、委員長を探す方法は――"
"103010-75-ナグサ" = "無いよ。 "
"103010-76-ナグサ" = "だから帰って。#n……あと、ここで私と会ったことは誰にも言わないでほしい。 "
"103010-77-ツクヨ" = "で、ですが、私たちは「シャーレ」の要請で……"
"103010-78-ナグサ" = "シャーレ……名前を聞いたことはあるけど……"
"103010-79-ナグサ" = "たしか――#nいや、それなら……"
"103010-80-ナグサ" = "これを先生に渡してほしい。"
"103010-81-ミチル" = "……巻物？ずいぶんと古いね。"
"103010-82-ナグサ" = "……内容は私も知らない。"
"103010-83-ナグサ" = "元はと言えば委員長――#nアヤメがやることだけど……彼女がシャーレの先生宛の言葉を残したと聞いたから。"
"103010-84-ツクヨ" = "ど、どなたが、ですか……？#n一体どうやって、私たちがここに来ることを……"
"103010-85-ナグサ" = "……。 "
"103010-86-ナグサ" = "それじゃ、渡したから。"
"103010-87-イズナ" = "行ってしまいました……"
"103010-88-ミチル" = "なんて書いてあるんだろ？"
"103010-89" = "わ、私たちが読んでもいいのでしょうか？ "
"103010-90-ミチル" = "ま、大丈夫でしょ。#n見ちゃダメとは言われてないし……"
"103010-91-ミチル" = "どれどれ――"
"103010-92" = "[ns] \"シロコ……？\""
"103010-93-シロコ" = "……。 "
"103010-94-シロコ" = "……先生、ここまで来たんだ。流石だね。"
"103010-95-シロコ" = "でも、未来を変えることはできない。#nキヴォトスが終焉を迎える事は、決まっている。"
"103010-96" = "[s] \"待って……！シロコは、本当は――\""
"103010-97-シロコ" = "――違う。"
"103010-98" = "[s] \"…………！！\""
"103010-99-シロコ" = "私は、色彩に操られてなんかない……違うよ、先生。"
"103010-100-シロコ" = "これは私自身の「[ruby=いし]本質[/ruby]」。 "
"103010-101-シロコ" = "この世界を、定められた未来へと導く――その役割を私が担当しただけ。#n色彩はその手段の1つに過ぎない。"
"103010-102-シロコ" = "……むしろ、私の方が色彩を利用しているのかも。"
"103010-103" = "[s] \"……！！\""
"103010-104-シロコ" = "私の役割は、すべての命を「[ruby=あのよ]別の場所[/ruby]」に導くこと――#n――[ruby=すなおおかみ]これは砂狼シロコ[/ruby]が、この世界に存在した時点で確定した未来。"
"103010-105-シロコ" = "定められた運命を変えることはできない――それが、この世界のルール。"
"103010-106-シロコ" = "……でも、私は先生を傷つけたくない。#nだから、キヴォトスからいなくなってほしい。"
"103010-107-シロコ" = "そうすれば、先生に銃を向けなくて済む。"
"103010-108" = "[s] \"シロコ…………。\""
"103010-109-シロコ" = "……最初に先生を「[ruby=ここ]キヴォトス[/ruby]」に導いたのも、#n最期を見送るのも――それが、私に与えられた「[ruby=やくわり]本質[/ruby]」なんだと思う。"
"103010-110-シロコ" = "いつ、その時が来たとしても……私は迷わないよ。"
"103010-111-シロコ" = "だから――"
"103010-112-リン" = "先生、問題が発生しました！！"
"103010-113-リン" = "現在、キヴォトス全域でエネルギー反応が再び検知され――"
"103010-114-リン" = "……くっ！？"
"103010-115-リン" = "あ、あなたはアビドスの……！？ "
"103010-116-モモカ" = "えっ！今、リン先輩が撃ったの！？めっちゃレアじゃん！？一体どうしたの！？"
"103010-117-アユム" = "し、侵入者です！#nい、今、応援を要請しました……！！"
"103010-118-アヤネ" = "侵入者、ですか？"
"103010-119-アヤネ" = "――あ、れ……？"
"103010-120-アヤネ" = "……し、シロコ……先輩……？"
"103010-121-シロコ" = "……。"
"103010-122" = "[ns] \"待って、シロコ！！\""
"103010-123-リン" = "お待ちください先生！#n彼女を追ってはなりません！！"
"103010-124-モモカ" = "うわっ、何！？"
"103010-125" = "[ns] シロコが消えた空間に飛び込む。"
"103010-126-シロコ" = "……。"
"103010-127" = "[ns] （ここは……？）"
"103010-128" = "[ns] \"……！！\""
"103010-129" = "[ns] \"あなたが、「色彩」の[ruby=きょうどうしゃ]嚮導者[/ruby]……！？\""
"103010-130-リン" = "――先生っ！！"
"103010-131-モモカ" = "わわっ！？先生、大丈夫？"
"103010-132-アヤネ" = "せ、先生……シロコ先輩は……いったい……"
"103010-133-アユム" = "つ、通路が……消えて、しまいました…… "
"103010-134-アヤネ" = "シロコ先輩――！！"
"103010-135" = "次回;異変"
