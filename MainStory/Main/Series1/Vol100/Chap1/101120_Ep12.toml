[translation]
"101120-1" = "第12話;脱出（２）"
"101120-2-キリノ" = "こっちです！"
"101120-3" = "[ns] \"アロナ、他の生徒と連絡取れたりしない？\""
"101120-4-アロナ" = "難しいです……#n通信網のシャットダウンは、サンクトゥムタワーから出された命令なので……"
"101120-5-アロナ" = "でも、このスーパーアロナがサンクトゥムタワーに劣るはずがありません！#n試してみます……！"
"101120-6-アロナ" = "ううっ……"
"101120-7-アロナ" = "ぐぬぬぬ……。"
"101120-8-アロナ" = "はぁ、はぁ……ダメです。#n物理的に近い場所ならまだ、なんとかなりそうですが……"
"101120-9-アロナ" = "この状況では……ううう……"
"101120-10-アロナ" = "あっ！繋がった！"
"101120-11-アロナ" = "1秒だけでも、どうか……！！どうか……！！"
"101120-12-アロナ" = "……はぁ、切れちゃいました。"
"101120-13-アロナ" = "一番近くにいる人になら、なんとか届いたかもしれません……"
"101120-14-アロナ" = "お役に立てず、すみません……。"
"101120-15" = "[s1] \"ううん、それで十分だよ。\"\n[s2] \"ありがとう。とても助かったよ、アロナ。\""
"101120-16-アロナ" = "そ、そうなんですか……？"
"101120-17-キリノ" = "たったた大変です……！#nこ、こっちにも……！！"
"101120-18-フブキ" = "す、すごい数……"
"101120-19-カンナ" = "ここまでか……。"
"101120-20-PMCの指揮官" = "速やかに投降しろ。#n投降しないのであれば、掃射する。"
"101120-21-PMCの指揮官" = "……なんだこれは。#nドローン……？"
"101120-22-？？？" = "ドローン稼働中。小隊は爆発に注意を。"
"101120-23-PMCの指揮官" = "ぐ、ぐはっっ！？な、何だ……！？"
"101120-24-？？？" = "どりゃあぁぁぁ――！！！"
"101120-25-サキ" = "この煙幕弾は痛いだろう？#nRABBIT2、現場に到着！"
"101120-26-サキ" = "RABBIT1、先生と要人を確保。#nRABBIT3、敵ターゲットの位置を確認してください。"
"101120-27-PMCの指揮官" = "な、何だお前たちは！？"
"101120-28" = "RABBIT3、受信完了！今ポインターで座標を送る。#nRABBIT4、敵指揮官から処理お願い！"
"101120-29-PMCの指揮官" = "全部隊、一斉――"
"101120-30-ミユ" = "[ruby=Tango]タンゴー[/ruby]、ダウン……み、みんな大丈夫？"
"101120-31" = "[s] \"RABBIT小隊！！来てくれたんだ！ありがとう！\""
"101120-32-サキ" = "勘違いするな。#n別に、先生が助けを求めたから来たわけではない。"
"101120-33-モエ" = "そうそう。先生から連絡があったから、食後の運動がてらに寄っただけ。"
"101120-34-ミユ" = "そ、それにしてはみんなすごい急いでたけど……"
"101120-35-ミヤコ" = "RABBIT小隊。先生の救助要請を確認し、参上いたしました。"
"101120-36-フブキ" = "へぇ～ここで援軍だなんて、先生もやるじゃん♪"
"101120-37-キリノ" = "SRTの方々がご一緒してくださるのなら、もう怖いもの無しです！"
"101120-38-PMC幹部" = "ここから逃げられると思うな！ "
"101120-39-ミヤコ" = "ヘリまで動員しているのですか……それにこの兵力は……？#n先生、一体何があったのですか？"
"101120-40-サキ" = "どうせ、いつもみたいに変なトラブルに巻き込まれたんだろ。"
"101120-41-モエ" = "ふふっ……まーた何かやらかしたの？#n危険なにおいがするなぁ……くひひっ。"
"101120-42-ミヤコ" = "……そうですね。[USERNAME]先生のことですし、妙に納得しました。"
"101120-43-ミユ" = "う、うん……先生のことだもんね……。"
"101120-44" = "[s] \"そう言われるとちょっと傷つくなぁ……。\""
"101120-45-ミヤコ" = "――カンナ局長。 "
"101120-46" = "RABBIT小隊……。"
"101120-47-ミヤコ" = "この間は、お世話になりました。#nまたお会いできてよかったです。"
"101120-48-カンナ" = "……今は戒厳令で行政の兵は動かせないのでは……"
"101120-49-ミヤコ" = "えっと……私たちは今、公園で野宿中ですので……"
"101120-50" = "正式な指揮系統も整ってないし……"
"101120-51-モエ" = "戒厳令？一部のサイトが接続できないと思ったら、そういうことだったんだ。"
"101120-52-サキ" = "し、知らなくても仕方ないだろ。#nなんたって、誰からも聞いてないからな！"
"101120-53-ミユ" = "連絡をくれるのは先生だけですし……"
"101120-54-ミヤコ" = "まずここを抜けて、先生と局長を安全な場所まで護衛します。#nRABBIT小隊、戦闘準備。"
"101120-55-サキ" = "ラジャー。"
"101120-56-ミユ" = "う、うん……私も準備できた。"
"101120-57-モエ" = "はぁ、はぁ……火力支援、準備完了。#nこれで……もっと派手な花火が撃てる。"
"101120-58-ミヤコ" = "申し訳ありませんが、生活安全局のヴァルキューレの方々も、#n一旦こちらの指示に従っていただければと思います。"
"101120-59-キリノ" = "はい、分かりました！"
"101120-60-フブキ" = "ま、この間世話になったし。いいよ。"
"101120-61" = "では、交戦を開始します。"
