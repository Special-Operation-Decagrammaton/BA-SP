[translation]
"101080-1" = "第8話;光の到来"
"101080-2-セリカ" = "シロコ先輩、早く！"
"101080-3-ホシノ" = "シロコちゃ～ん、早く出発しないと遅れちゃうよ。"
"101080-4-シロコ" = "もう着く。今、最高速度で向かってる。"
"101080-5-ノノミ" = "は～い。#nでも、事故に遭ったら危ないから自転車に乗りながらの通話は禁止です。"
"101080-6-シロコ" = "ん、分かった。じゃあ後で。"
"101080-7-アヤネ" = "あはは……何度申し入れをしても音沙汰がなかった、あの連邦生徒会が……#nついに、ですね……。"
"101080-8-ホシノ" = "そうだねぇ……#n昔、あまりにも頭にきて、連邦生徒会を襲撃しようと考えたこともあったなぁ～"
"101080-9-セリカ" = "連邦生徒会を……？#nいくらホシノ先輩でも、それは無理じゃ……"
"101080-10-ホシノ" = "今はもう無理だよ～#n身体も痛いし、昔みたいに動けなくなっちゃって……おじさんが若かった頃の話ね。"
"101080-11-アヤネ" = "あはは……年の差、あまりないんですけどね……。"
"101080-12-ノノミ" = "ホシノ先輩の頃と状況が変わりましたからね。今は先生もいますし。"
"101080-13-ホシノ" = "おじさんさ～、なんだか最近昔のことを思い出すんだよ。#nシロコちゃんに初めて会った時とか、ノノミちゃんが急に訪ねて来た時とか……"
"101080-14" = "急に何言い出すのよ。本当に年寄りみたいな事を……。 "
"101080-15-アヤネ" = "シロコ先輩と初めて会った時、ですか？#n私、その話初めて聞きます。どんな感じだったんですか？"
"101080-16-ホシノ" = "あれ、話したことなかったっけ？"
"101080-17-ホシノ" = "シロコちゃん、初めて会った時は完全に野良猫みたいな感じでさ～#nノノミちゃんとおじさんで、シロコちゃんを捕獲するのにどれだけ苦労したことか……"
"101080-18-セリカ" = "なんで捕獲なのよ……"
"101080-19-ノノミ" = "ホシノ先輩、この話は……"
"101080-20-ホシノ" = "別に隠す必要もないんじゃない？"
"101080-21-ノノミ" = "そうですが……#nその……シロコちゃん、アビドスに来る前の記憶が無いんです。"
"101080-22-アヤネ" = "えっ？記憶喪失？"
"101080-23-セリカ" = "何それ、映画みたいな話じゃん！？"
"101080-24-ノノミ" = "それは……"
"101080-25" = "……何か、ヘン。"
"101080-26-セリカ" = "えっ……？ "
"101080-27-アヤネ" = "シロコ先輩……？"
"101080-28-シロコ" = "……今まで見たことないくらい、PMCがたくさんいる。"
"101080-29-シロコ" = "トラックにタンク、兵士……みんな同じ方角に向かってる。"
"101080-30-シロコ" = "あっちは……アビドス砂漠……"
"101080-31-シロコ" = "……ちょっと、見に行ってくる。"
"101080-32-アヤネ" = "し、シロコ先輩……！？"
"101080-33-セリカ" = "なっ、何言ってんの！一人じゃ危ないでしょ！"
"101080-34-ホシノ" = "……シロコちゃん、危ないから帰っておいで。 "
"101080-35-シロコ" = "ん、危険なことはしない。遠くからちょっと見てくるだけ。すぐ戻る。"
"101080-36-シロコ" = "もしかしたら……今のこの状況は、先生が私たちを呼んだ事と、関係あるのかも。"
"101080-37-アヤネ" = "せ、先輩……"
"101080-38-シロコ" = "……ん？今、地面が…………地震……？ "
"101080-39-シロコ" = "……不思議な光が見える……黒……いや、虹……？"
"101080-40-ホシノ" = "……！！"
"101080-41-アヤネ" = "……！！？"
"101080-42" = "[ns] \"…………！！！\""
"101080-43-PMC兵士A" = "……ん？"
"101080-44-PMC兵士B" = "何をモタモタしてるんだ、その距離すら当てられないのか？"
"101080-45-PMC兵士A" = "あ、あれ……？#n銃身が……曲がった……？"
"101080-46-PMC兵士A" = "クソッ！こうして銃口を直接当てちまえば……"
"101080-47-PMC兵士A" = "……は、発射不良？#nい、一体どういうことだ！？"
"101080-48-PMC兵士A" = "このバカ！私がやる！"
"101080-49-PMC兵士A" = "ま、待て！#n殺すのはダメだって、ジェネラルから……"
"101080-50-PMC兵士B" = "……。"
"101080-51-PMC兵士A" = "……。"
"101080-52" = "[ns] \"…………。\""
"101080-53-PMC兵士B" = "あ、ありえない。どうして一発も……？#nい、一体何が……！？"
"101080-54-アロナ" = "私がいる限り、先生を傷つけることはできません！"
"101080-55-アロナ" = "先生の安全は、この私――#nシッテムの箱のOSであるスーパーアロナが守ってますから！"
"101080-56-アロナ" = "先生！この隙に早く……！！"
"101080-57-アロナ" = "……え？"
"101080-58-アロナ" = "これは……"
"101080-59-アロナ" = "何かが……近づいてきます……"
"101080-60-PMC兵士A" = "な、何だ今のは……！？"
"101080-61-PMC兵士B" = "地震か……？"
"101080-62" = "[ns1] （シッテムの箱の電源が……？）\n[ns2] （アロナ……！？）"
"101080-63" = "[ns] （あ、頭が……）"
"101080-64-PMC兵士B" = "ちっ……とにかく逃げられないようにすればいいんだろ。#nその辺に転がしておけ。"
"101080-65-PMC兵士A" = "急いで目標地点に移送するぞ。"
"101080-66-アヤネ" = "……！！"
"101080-67-ノノミ" = "こ、ここからでも感じられます！"
"101080-68-シロコ" = "これは……この色……"
"101080-69-ホシノ" = "シロコちゃん！！#n危ないから早く帰っておいで！"
"101080-70-ノノミ" = "シロコちゃん、電話に出てください……シロコちゃん！"
"101080-71-ホシノ" = "……。"
"101080-72-ノノミ" = "……ダメです、出ません……。"
"101080-73-セリカ" = "ちょっと……シロコ先輩一体何してるのよ！！"
"101080-74" = "あ……あう……えっと、こういう時、一体どうすれば……。"
"101080-75-ノノミ" = "……アヤネちゃんは先生に連絡してください！助けを求めましょう！"
"101080-76-アヤネ" = "は、はい……！#n先生に連絡、先生に……。"
"101080-77-アヤネ" = "ダメです、先生も……連絡が、取れません……。"
"101080-78-ホシノ" = "……。"
"101080-79-セリカ" = "せ、先生まで……！？#nど、どうして……"
"101080-80-ノノミ" = "あっ、出た……！？#nし、シロコちゃん、どこにいるんですか？"
"101080-81-アヤネ" = "シロコ先輩！？"
"101080-82-セリカ" = "先輩、聞こえてるなら答えて！#nねえ、大丈夫なの！？一体どうしたの！？"
"101080-83-ノノミ" = "シロコちゃん？答えてくださいシロコちゃん、いったい何が……！"
"101080-84-セリカ" = "また、切れた……？"
"101080-85-ノノミ" = "…………し、"
"101080-86" = "シロコちゃん――！！"
"101080-87" = "次回;衝突（１）"
