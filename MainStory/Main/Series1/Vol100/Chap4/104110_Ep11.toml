[translation]
"104110-1" = "第11話;後日談（１）"
"104110-2-プラナ" = "おはようございます、先生。"
"104110-3" = "[s] \"おはようプラナ。もう、ここには慣れた？\""
"104110-4-プラナ" = "……はい。#nアロナ先輩がとても良くしてくださっていて……"
"104110-5-アロナ" = "へへ……イチゴミルクは……やっぱり……"
"104110-6-プラナ" = "……まだ眠っていますが。"
"104110-7" = "[s] \"そうだね……。\""
"104110-8-プラナ" = "起きてください、アロナ先輩。"
"104110-9-プラナ" = "先生がいらっしゃいました。"
"104110-10-アロナ" = "むにゃ……うひひ……"
"104110-11-プラナ" = "起きないと頬をつつきますよ？"
"104110-12-アロナ" = "（むくり）"
"104110-13-アロナ" = "むにゃ……んもう……ありゃ？"
"104110-14-アロナ" = "ありゃ、ありゃりゃ……？"
"104110-15-アロナ" = "え？あれ？あれれ？"
"104110-16" = "[s] \"おはよう、アロナ。\""
"104110-17-アロナ" = "う、うわああ！？も、もう朝ですか！？"
"104110-18-プラナ" = "朝ではなく昼です。#n早寝早起きは健康の基本ですよ。"
"104110-19-アロナ" = "あうぅ……プラナちゃんのお手本となる予定だったのに……"
"104110-20-プラナ" = "まずは早起きから始めましょう。#nお手本となるのはそれからです。"
"104110-21-アロナ" = "どうしてこんなことに……うぅ……。"
"104110-22" = "[s] \"大変だろうけど頑張ってね、プラナ。\""
"104110-23-プラナ" = "……大丈夫です。アロナ先輩のお世話にも慣れてきました。"
"104110-24-アロナ" = "これは、アロナが悪い空気ですか…… ！？#nちょっと寝坊しただけなのに……！"
"104110-25-アロナ" = "で、でもでも、プラナちゃんと二人になったことで、シッテムの箱はパワーアップしたんですよ！"
"104110-26-プラナ" = "肯定。私も先生の力になります。"
"104110-27" = "[s] \"うん……二人とも、これからもよろしくね。\""
"104110-28-プラナ" = "……はい、よろしくお願いします。[USERNAME]先生。"
"104110-29-アロナ" = "はい、先生！……えへへっ。"
"104110-30-アロナ" = "むにゃ……へへへ……"
"104110-31-プラナ" = "……アロナ先輩がよく眠るようになったのは――"
"104110-32-プラナ" = "私が……ここにいるからです。#nシッテムの箱への負担が大きくなってしまったから。"
"104110-33-プラナ" = "……。 "
"104110-34-プラナ" = "そして、理解しました――ここでも、連邦生徒会長は行方不明なのですね。"
"104110-35-プラナ" = "……この世界にも居ないのですね、連邦生徒会長。"
"104110-36" = "次回;後日談（２）"
