[translation]
"104070-1" = "第7話;同じ状況、同じ選択"
"104070-2-アロナ" = "せ、先生……"
"104070-3-アロナ" = "自分用の、シーケンスを……"
"104070-4-アロナ" = "シロコさん、に……？"
"104070-5-アロナ" = "……そ、それじゃ先生は……"
"104070-6-アロナ" = "先生の身体では……この高度からは……"
"104070-7-アロナ" = "だ、ダメです先生――――！！！！！！"
"104070-8" = "「脱出シーケンス」：残り0回"
"104070-9-A.R.O.N.A" = "……私は、間違っていたのでしょうか。"
"104070-10-A.R.O.N.A" = "先生の願いは……違っていたのでしょうか。"
"104070-11-A.R.O.N.A" = "理解、不可能……ならば何故……先生は箱舟を通じてここに来たのですか。"
"104070-12-A.R.O.N.A" = "それは……"
"104070-13-A.R.O.N.A" = "もしかすると……"
"104070-14-A.R.O.N.A" = "……先生は、信じていたのですか？"
"104070-15-A.R.O.N.A" = "この結末に至った[ruby=・]自[/ruby][ruby=・]身[/ruby]がやり遂げられなかったことを、"
"104070-16-A.R.O.N.A" = "この結末を避けた[ruby=・]自[/ruby][ruby=・]身[/ruby]なら、やり遂げられると……？"
"104070-17-A.R.O.N.A" = "[ruby=じぶん]先生[/ruby]なら……"
"104070-18-A.R.O.N.A" = "同じ状況で、同じ選択を取る……と？"
"104070-19-アロナ" = "……いいえ。このまま諦める事はできません。"
"104070-20-アロナ" = "先生を助けます。"
"104070-21-アロナ" = "「シッテムの箱」のOSであるアロナが、先生を助けます！！"
"104070-22-アロナ" = "今まで何度も奇跡を起こして、先生を守ってきました。これくらい……これくらい、私の力で、なんとか……！！"
"104070-23-アロナ" = "私の力で……！！！"
"104070-24-アロナ" = "ゲホッ……！！"
"104070-25-アロナ" = "ゲホ、ゲホッ……っ……！！"
"104070-26-アロナ" = "なんとか爆発からは守れましたが……"
"104070-27-アロナ" = "だ、ダメ……墜落スピードが、変わりません……。"
"104070-28-アロナ" = "どうして……？わ、私の力が足りない……？"
"104070-29" = "ゲホッ……！！"
"104070-30-アロナ" = "む、無理なの……？"
"104070-31-アロナ" = "力を、使い過ぎた……？"
"104070-32-アロナ" = "ウトナピシュティムで受けたダメージと、箱舟の演算で……？"
"104070-33-アロナ" = "いいえ！！それくらいではスーパーアロナは……！！"
"104070-34-アロナ" = "だ……ダメ！！"
"104070-35-アロナ" = "ここは先生が生存できる高度じゃありません。#nはやく……はやくなんとかしないと……"
"104070-36-アロナ" = "先生……。"
"104070-37" = "[ns1] \"……もう大丈夫だよ、アロナ。\"\n[ns2] \"私の代わりに、あの子に手を差し伸べてあげて。\""
"104070-38-アロナ" = "せ、先生！？"
"104070-39" = "[ns3] \"今までありがとうアロナ、ごめんね。\"\n[ns4] \"これでお別れかな……元気でね。\""
"104070-40-アロナ" = "ま、待ってください、お別れだなんてそんな……！？#n……せ、先生？"
"104070-41-アロナ" = "先生――！！！！！"
"104070-42-A.R.O.N.A" = "（……「ナラム・シンの玉座」が崩壊しました。）"
"104070-43-A.R.O.N.A" = "（私も、そう遠からず……）"
"104070-44-A.R.O.N.A" = "……！？"
"104070-45-A.R.O.N.A" = "……ここは。"
"104070-46-アロナ" = "……よかったです！シッテムの箱のOSデータをここに転送できました。"
"104070-47-A.R.O.N.A" = "私を、ここに……？どうして……？"
"104070-48-A.R.O.N.A" = "理解不可能。何故私を助けたのですか？#n……私は、あなたの敵であるはず。"
"104070-49-A.R.O.N.A" = "……理解。"
"104070-50-A.R.O.N.A" = "今までそうだったように……先生は、シロコを助けた……"
"104070-51-A.R.O.N.A" = "先生は……私のことも、助けるべき生徒と考えたのですね。"
"104070-52-A.R.O.N.A" = "……質問。#n先生は……どこに？"
"104070-53-アロナ" = "先生は……。"
"104070-54-A.R.O.N.A" = "……理解。状況分析……状況を確認。"
"104070-55-A.R.O.N.A" = "なるほど。先生は今……"
"104070-56-アロナ" = "はい……先生は、助けようとしましたが……"
"104070-57-A.R.O.N.A" = "……。"
"104070-58" = "ぐすっ……っ……"
"104070-59-アロナ" = "私じゃ、力不足で……別の方法も……探せなくて……！"
"104070-60-アロナ" = "ううっ……っ……！！"
"104070-61-A.R.O.N.A" = "……状況を確認。方法、リサーチ。"
"104070-62-A.R.O.N.A" = "「シッテムの箱」A.R.O.N.A、これより先生の保護に移行、強制干渉を始めます。"
"104070-63-A.R.O.N.A" = "え、え……？#n今なんと……？"
"104070-64-アロナ" = "こ、これは……？"
"104070-65-A.R.O.N.A" = "……私が力になります。アロナ。"
"104070-66-A.R.O.N.A" = "――方法は、あります。"
"104070-67-A.R.O.N.A" = "今からあなたと私の力をあわせ、奇跡を起こします。"
"104070-68-アロナ" = "奇跡、を……？"
"104070-69-A.R.O.N.A" = "そうすれば、先生を無事地上に送り届けることができるでしょう。"
"104070-70-A.R.O.N.A" = "アロナ、手を。"
"104070-71-アロナ" = "て、手、ですか……？"
"104070-72-A.R.O.N.A" = "はい。……私を信じてくれますか？"
"104070-73-アロナ" = "……はい。先生があなたを信じましたから。私も、信じます。"
"104070-74-A.R.O.N.A" = "……ありがとうございます。"
"104070-75-A.R.O.N.A" = "はじめましょう。 あなたと私……私たちの、奇跡を。"
