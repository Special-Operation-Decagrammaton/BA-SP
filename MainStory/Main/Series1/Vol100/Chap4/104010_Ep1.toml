[translation]
"104010-1" = "第1話;定められた運命"
"104010-2-ユウカ" = "「ウトナピシュティムの[ruby=もとぶね]本船[/ruby]」が、「箱舟」にハッキングされた……？"
"104010-3-ヒマリ" = "……はい。私たちは現在、「アトラ・ハシースの箱舟」に接続された状態です。"
"104010-4-ヒマリ" = "――この船は、「箱舟」の演算装置となりました。"
"104010-5-ヒマリ" = "そう――「箱舟」はこの船の演算機能を使って、再び「多次元解釈」を試みているのです。"
"104010-6-ユウカ" = "そんな……じゃあ、私たちはどうすればいいのよ……？"
"104010-7-ヒマリ" = "今は、この接続を絶つことが最優先です。#n敵はこの船のエネルギーを利用して「次元エンジン」を修復しているのですから。"
"104010-8-ヒマリ" = "それに、「虚妄のサンクトゥム」に流入しているエネルギー量が増加していて――#nいつサンクトゥムが顕現してもおかしくない状態です。"
"104010-9-SYSTEM" = "ウトナピシュティムの本船、最終処理実行。#n「自爆シーケンス」を再起動。"
"104010-10-ハナコ" = "ま、また自爆シーケンスが……！？"
"104010-11" = "800秒後、「自爆シーケンス」が起動します。#n搭乗者は急いで避難してください。"
"104010-12-アコ" = "こ、これ……止められないんですか？"
"104010-13-SYSTEM" = "繰り返します――搭乗者は急いで避難してください。#n793秒後、「自爆シーケンス」が――"
"104010-14-カヨコ" = "ダメ、システムが動かない……！！#nハッキングをどうにかしない限り――"
"104010-15-ヒマリ" = "現在、対応中です！！#nチーちゃん、箱舟との接続を強制解除しますよ！"
"104010-16-チヒロ" = "分かった、サポートする！"
"104010-17-マキ" = "ちょっと……待って、なにコレ！？"
"104010-18-コタマ" = "これは、流石に……"
"104010-19-ハレ" = "り、リアルタイムでアルゴリズムを変更してる……？"
"104010-20-チヒロ" = "うちも、スピードでは負けないよ……！よし、解除してヒマリ！"
"104010-21-ヒマリ" = "接続、解除！"
"104010-22-チヒロ" = "……ぐっ！"
"104010-23-ヒマリ" = "……拒否されました。"
"104010-24" = "繰り返します。搭乗者は急いで避難してください。#n533秒後、「自爆シーケンス」が――"
"104010-25-リン" = "……。"
"104010-26-アユム" = "こ、このままでは……！"
"104010-27-モモカ" = "どどどうしよ！？"
"104010-28" = "一体、これは……。"
"104010-29-ヒマリ" = "ほとんどの演算装置を失った状態で私たちをハッキングし、次元エンジンを修復――さらにサンクトゥムの多次元解釈を加速化……？"
"104010-30-ヒマリ" = "これほどの演算処理性能を持つ管制システムが「箱舟」にあったなんて……。"
"104010-31" = "このシステムの存在に気づけなかった時点で、私たちの敗北は決まっていたのかもしれません……。"
"104010-32-シロコ" = "あれは……私？"
"104010-33-A.R.O.N.A" = "肯定[ruby=すなおおかみ]。砂狼シ[/ruby]ロコ、別時間軸の同一存在。"
"104010-34" = "[s1] \"別時間軸の……\"\n[s2] \"同一存在……？\""
"104010-35-A.R.O.N.A" = "肯定。そうです、[USERNAME]先生。"
"104010-36" = "[s] \"それじゃあ君は……アロナ？\""
"104010-37-A.R.O.N.A" = "一部肯定。この「シッテムの箱」に常駐しているシステム管理者であり、メインOSの「A.R.O.N.A」です。"
"104010-38-アロナ" = "え、ええっ！？"
"104010-39-アロナ" = "な、何を言っているんですか！「シッテムの箱」に常駐しているシステム管理者は……私、ですよね……？わ、私が二人……？"
"104010-40-アロナ" = "シロコさんも二人……？そ、それじゃあ……！"
"104010-41-アロナ" = "……いいえ！それでもおかしいです！"
"104010-42-アロナ" = "それならどうして、「シッテムの箱」のOSがここに居るのでしょうか！#nなにか……なにかズルでもしない限り……！"
"104010-43-A.R.O.N.A" = "回答。それは、ここが「状態の共存」を維持している「アトラ・ハシースの箱舟」の内部であるためです。"
"104010-44-A.R.O.N.A" = "この「ナラム・シンの玉座」は、次元、時間、実在の有無が確定されずに混ざり合う、混沌の領域。"
"104010-45-A.R.O.N.A" = "私が教室を有しない今、[USERNAME]先生がこの場所を歪曲したからここにいるのです。ズルではありません。"
"104010-46-アロナ" = "いっ、今……"
"104010-47-アロナ" = "私の質問に答えた……？#nわ、私の声は先生にしか聞こえないはずなのに……どうやって……？"
"104010-48-A.R.O.N.A" = "肯定。聞こえています。"
"104010-49-アロナ" = "わあっ！！？"
"104010-50-アロナ" = "ここにも、接続できるんですか……！？"
"104010-51-A.R.O.N.A" = "……。"
"104010-52-アロナ" = "……？"
"104010-53-A.R.O.N.A" = "……肯定。#n……「A.R.O.N.A」ですので。"
"104010-54-A.R.O.N.A" = "私たちは、同じ「シッテムの箱」のOSであるため、相互干渉ができるものと推測します。"
"104010-55" = "……。"
"104010-56-？？？" = "私はあくまで、「シッテムの箱」の所有者である[USERNAME]先生を助け、サポートするだけの存在。"
"104010-57-？？？" = "先生、ご命令を。"
"104010-58" = "[ns] \"………………それは、つまり。\""
"104010-59" = "[ns] \"プレナパテスが……別の時間軸の「私」ということ？\""
"104010-60" = "一部肯定。対象が、連邦捜査部「シャーレ」の顧問[USERNAME]先生と同一存在であることを確認。"
"104010-61" = "[s] \"………………………………！！！\""
"104010-62-A.R.O.N.A" = "……しかし、一部差異が存在します。"
"104010-63-アロナ" = "せ、先生……！！"
"104010-64" = "[s] \"アロナ……？\""
"104010-65-アロナ" = "そ、そうです……そう、と言うか、違う、と言うか……。"
"104010-66-アロナ" = "今私の方でもプレナパテスの生体情報を確認してみましたが……#nたしかに、一致します……外見こそ変わりましたが……"
"104010-67-アロナ" = "「プレナパテス」は……別の時間軸の、先生です……。#n……で、でも、"
"104010-68-アロナ" = "プレナパテス――いえ、あの時間軸の先生は……"
"104010-69-アロナ" = "すでに……"
"104010-70" = "生きて、いません……。"
"104010-71" = "[ns3] \"プレナパテスが、生きていない……？\"\n[ns4] \"死んでいる……？\""
"104010-72-シロコ" = "ええ、そう。"
"104010-73-シロコ" = "――先生を殺したのは、私だから。"
"104010-74-シロコ" = "……え？"
"104010-75-シロコ" = "そうしたら、先生は「色彩の[ruby=きょうどうしゃ]嚮導者[/ruby]」になった。"
"104010-76-？？？" = "これは……おそらく「色彩」の影響だろうね。"
"104010-77" = "[ns] \"……………………。\""
"104010-78-シロコ" = "そして私を、ここに連れてきたの。#n世界を終焉に導くという、私の運命を実現させるために。"
"104010-79-シロコ" = "……あなたが、私？"
"104010-80-シロコ" = "うん。"
"104010-81-シロコ" = "……私が……先生を……ころ、した……？"
"104010-82-シロコ" = "ええ。"
"104010-83-シロコ" = "……世界を、滅亡……？"
"104010-84-シロコ" = "そう。"
"104010-85" = "ふざけ、ないで――――――！！！"
"104010-86-シロコ" = "そんなの、信じない――！！"
"104010-87" = "世界を滅亡させて、先生を殺す……？#nそんなわけない！！"
"104010-88-シロコ" = "先生を殺して、あなたの存在の道具として利用？"
"104010-89-シロコ" = "私が、そんなことするわけ――――！！"
"104010-90-シロコ" = "あなたがいくら否定したところで、これは既に定められたこと。"
"104010-91-シロコ" = "あなたは――[ruby=・]そ[/ruby][ruby=・]う[/ruby][ruby=・]な[/ruby][ruby=・]る[/ruby]。"
"104010-92-シロコ" = "この世界に存在する以上、そう定められているの。"
"104010-93-シロコ" = "ゴホッ……っ……うぅっ……。"
"104010-94-シロコ" = "それ[ruby=すなおおかみ]が砂狼シ[/ruby]ロコという存在の運命。#n世界を死に導く神。それが――私たちの「本質」。"
"104010-95-シロコ" = "[ns] \"シロコ……！！\""
"104010-96-シロコ" = "だ、め……先生……来ない、で……"
"104010-97-シロコ" = "私はあなたより強い。"
"104010-98-シロコ" = "あなたにはない事を経験し、知らないことを知っている。この差は埋まらない。"
"104010-99" = "ゴホッ……あなたは……"
"104010-100-シロコ" = "……どうして……そんな……"
"104010-101-シロコ" = "「砂狼シロコ」は――"
"104010-102-シロコ" = "――プレナパテスの計画にとって、どんな変数になるのか想定できなかった。世界を終焉に導く「崇高」は、1つの世界に1つしか存在できない。"
"104010-103-シロコ" = "私がこの世界で安定して活動するためには、同一存在であるあなたを、この世界に[ruby= ・   ・   ・   ・   ・ ]存在しない[/ruby]状態にしなければならなかった。"
"104010-104-シロコ" = "だから先にあなたを誘拐し、実在と非実在が混ざり合ったこの「箱舟」に閉じ込めたの。"
"104010-105-シロコ" = "でも、それ以上に――"
"104010-106-シロコ" = "――私はあなたに同情するよ、シロコ。"
"104010-107-シロコ" = "ここで、誰にも知られずに終焉を迎えられたら良かったのに。"
"104010-108-シロコ" = "そうすれば、あなたは自身の愛する人たちの死を知らずに消えられたのにね。"
"104010-109-シロコ" = "こんな事をするから――あなたはまた、苦しむことになる。"
"104010-110-？？？" = "それで……どうする？先生。"
"104010-111-？？？" = "[ns] \"…………………………………………。\""
"104010-112" = "次回;抵抗（１）"
