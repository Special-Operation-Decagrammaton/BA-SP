[translation]
"104040-1" = "第4話;抵抗（３）"
"104040-2-チヒロ" = "まずい、「抑制」時間の減少がまた加速してる……！"
"104040-3-コタマ" = "先程よりも速いです……！"
"104040-4-マキ" = "4分58秒……4分11秒……3分19秒……！#nちょ、ちょっと速すぎない！？"
"104040-5-チヒロ" = "残り、60秒――！！"
"104040-6-ヒマリ" = "加速している、ということは……"
"104040-7-リオ" = "……トキ！！"
"104040-8-トキ" = "はぁ……はぁ……"
"104040-9-トキ" = "くっ……！"
"104040-10-トキ" = "はぁ、はぁ……。"
"104040-11-リオ" = "「箱舟」との連結さえ解除できれば、抑制状態を維持できる……#n早くしないと……トキが……！！"
"104040-12-フウカ" = "到着したわよ！#n今、「セキュリティシステム」の前！！"
"104040-13-アコ" = "美食研究会……お願いします！！"
"104040-14-ハルナ" = "さあ皆さん、セキュリティシステムの「解除装置」を破壊してくださいな！"
"104040-15" = "ホシノ先輩、今です！！"
"104040-16-ユウカ" = "ゲーム開発部、今よ……！"
"104040-17-ホシノ" = "了解～、待ってました！"
"104040-18-ノノミ" = "はい！東側の解除装置、破壊完了です☆"
"104040-19-アリス" = "光よ――――！"
"104040-20-ユズ" = "に、西側の解除装置も、破壊完了です……！"
"104040-21" = "うふふっ、セキュリティシステムが開きました。"
"104040-22-イズミ" = "わわっ、アレを壊せばいいんだよね？"
"104040-23-ジュンコ" = "急ぐわよ！！これ、5秒で閉まっちゃうんだからね！？"
"104040-24-ハルナ" = "では、フィナーレをお願いします、アカリさん。"
"104040-25-アカリ" = "ふふっ。ついにドッカ～ン★をする時間ですね。"
"104040-26" = "急いで……！#n時間がもう――"
"104040-27" = "「多次元解釈」の抑制終了まで残り、9秒……！"
"104040-28" = "うう……。"
"104040-29" = "早く……！"
"104040-30-アカリ" = "装填完了、 照準合わせます……！"
"104040-31" = "スペシャルな一発、行きます！"
"104040-32" = "……残り7秒！"
"104040-33" = "きた！端末、破壊！！"
"104040-34-アカリ" = "熱いうちに召し上がれ～"
"104040-35-イズミ" = "うああ、熱すぎるよ～！？"
"104040-36-ユウカ" = "連結を解除して！！"
"104040-37-コタマ" = "……1秒！！"
"104040-38-チヒロ" = "連結、解除！！"
"104040-39-カヨコ" = "連結解除、承認！！"
"104040-40-リオ" = "……！#n「抑制」が安定化したわ！！"
"104040-41-シロコ" = "……。"
"104040-42-アユム" = "……どう、なったのでしょうか？"
"104040-43-モモカ" = "い、イケた？"
"104040-44" = "……はい。成功しました。"
"104040-45-ユウカ" = "やったわ！！連結解除、完了よ！！！"
"104040-46-アコ" = "ふぅ……。"
"104040-47-アヤネ" = "はぁ……。"
"104040-48-モモカ" = "ひゃー……10年くらい、寿命縮んだ……。"
"104040-49" = "次回;安易な解"
