[translation]
"104020-1" = "第2話;抵抗（１）"
"104020-2-ハルカ" = "あ、アル様……また空が……。"
"104020-3-ムツキ" = "これ、ちょっとヤバいんじゃな～い？"
"104020-4-アル" = "……急ぐわよ。"
"104020-5-ムツキ" = "アルちゃん……？"
"104020-6-アル" = "今、先生とカヨコが頑張っているのよ！！"
"104020-7" = "私達が立ち止まってどうするのよ！#nそんなんじゃ、二人に顔向けできないじゃない！！"
"104020-8-ハルカ" = "あ、アル様……！"
"104020-9-ムツキ" = "……へぇ。"
"104020-10-アル" = "さ、行くわよ！今私達にできることをやらなくちゃ！"
"104020-11-ハルカ" = "は、はい！！どこまでもついていきます、アル様！！"
"104020-12-ムツキ" = "……やっぱ、ここぞって時のアルちゃんはカッコイイ♪"
"104020-13-トキ" = "……遠方に不自然な光を確認。"
"104020-14-トキ" = "データ上、測定不能な位置……。"
"104020-15-トキ" = "……万が一に備え、調査を実行します。"
"104020-16-ヒナ" = "――状況は？"
"104020-17-ミヤコ" = "……再びサンクトゥムが出現したようです。"
"104020-18" = "むぅ……。"
"104020-19-ミユ" = "せ、先生……大丈夫かな……。"
"104020-20-ヒナ" = "……了解、急ごう。敵の出現に備えて。"
"104020-21-ヒナ" = "狙撃手は次の位置で待機。RABBIT小隊長は指揮をお願い。#nアリスがいない分、火力支援は私が担当する。"
"104020-22-サキ" = "了解。やってみよう。"
"104020-23-ミヤコ" = "了解です。"
"104020-24-SYSTEM" = "繰り返します。搭乗者は急いで避難してください。#n17秒後、「自爆シーケンス」が――"
"104020-25-ユウカ" = "ひ、ヒマリ先輩……これって、本当に止められるんですよね？"
"104020-26-ヒマリ" = "少々、お待ち下さい……。"
"104020-27-SYSTEM" = "搭乗者は急いで避難してください。#n9秒後、「自爆シーケンス」が――"
"104020-28-ヒマリ" = "くっ…………これ以上は、流石の私でも……もう……"
"104020-29" = "――諦めるのはまだ早いわ。"
"104020-30-ヒマリ" = "り、リオ！？"
"104020-31-ヒマリ" = "「これ以上はもう？」――「天才」の貴女らしくない台詞ね、ヒマリ。"
"104020-32-SYSTEM" = "9秒後、「自爆シーケンス」が発動――9秒後、「自爆シーケンス」が発動――9秒後、「自爆シーケンス」が発動――"
"104020-33" = "と……止まった？"
"104020-34-リオ" = "「多次元解釈」の抑制機能を利用して、強制的にウトナピシュティムを停止させたわ。"
"104020-35-リオ" = "――ただ、あくまで足止めに過ぎない。"
"104020-36-ヒマリ" = "……そうですね。抑制が解けてしまえば、いずれにせよ船は深刻な被害を受けるでしょう。"
"104020-37-ヒマリ" = "――ですが、時間稼ぎにはなりますね。ありがとうございます、リオ。"
"104020-38-リオ" = "どういたしまして……さあ、足止めが効いている間に解決しなくては。#n厄介なシステムとはいえ、攻略法は必ずあるはずよ。"
"104020-39-リオ" = "――でも、私一人での攻略は不可能。#nだから、不本意かもしれないけれど皆の力を貸してちょうだい。"
"104020-40-ヒマリ" = "……それは、[ruby= ・    ・    ・    ・    ・    ・    ・    ・ ]あなたらしくない[/ruby]台詞ですね、リオ。"
"104020-41-ヒマリ" = "そうですね――これだけの規模の船ですから、命令を中継する「端末」がどこかに存在しているはず。"
"104020-42-ヒマリ" = "であれば、中継端末を破壊する事で、この状態を解除できると思います。"
"104020-43-リオ" = "物理的な通信を断つ手法ね。もちろん、それで解決はできるでしょうけれど――"
"104020-44-ヒマリ" = "ええ、一時的しのぎにしかなりません。#n予備の「端末」もあるでしょうし……"
"104020-45-ヒマリ" = "ですが、その間にウトナピシュティムのシステムを復旧させ、#n「箱舟」の管制権を取り戻せれば……"
"104020-46-ヒマリ" = "「箱舟」の「自爆シーケンス」を起動できます。"
"104020-47-リオ" = "そうね……そうすれば、念のために用意しておいた「脱出シーケンス」も使えるようになるはずよ。"
"104020-48-リオ" = "……あなたという人は、本当に。"
"104020-49-リオ" = "……不要だったのなら、謝罪するわ。"
"104020-50-ヒマリ" = "いいえ。あなたの事は嫌いなままですが――今回ばかりは助かりましたよ、リオ。#nチーちゃん！「端末」の位置は分かりますか？"
"104020-51-チヒロ" = "……了解、いま確認中。#n「箱舟」内部の通信が集中している場所が分かれば――"
"104020-52-マキ" = "ハードウェアの探知はハッキングじゃ限度があるよ！#n私たちの専門分野じゃなくない！？"
"104020-53-コタマ" = "そうですね……正確な探知を行うには、「箱舟」そのものの設計図が必要です。"
"104020-54-ハレ" = "……エンジニア部の力が必要かな。"
"104020-55-ヒビキ" = "――そういう事なら、任せてくれ。#n今確認しているよ。"
"104020-56-コトリ" = "「箱舟」の設計図を解析、構造図と「箱舟」の3D空間スキャンデータを分析中……"
"104020-57-ウタハ" = "はい。通信量が多い場所から順に、ですね！#n――もうしばらくお待ちを！"
"104020-58-ヒヨリ" = "リーダー……。"
"104020-59-サオリ" = "不安なのは同じだ。#nだが――"
"104020-60" = "うん……信じて待とう。"
"104020-61-ミサキ" = "……。"
"104020-62-風紀委員" = "うーん……。"
"104020-63" = "キキキッ……そう緊張するな。"
"104020-64-イオリ" = "だ、誰が緊張してるって！？"
"104020-65-シロコ" = "はぁ……はぁ……。"
"104020-66" = "[ns] \"まだ、終わってないよ。\""
"104020-67-シロコ" = "……うん。まだ、いける。"
"104020-68-シロコ" = "……。"
"104020-69-ヒビキ" = "……見つけた！信号、ここから出てる！"
"104020-70-ウタハ" = "チーちゃん、位置情報を送ったよ！#n「シャル・カリ・シャッリ回廊」だ！"
"104020-71" = "「箱舟」の最下層セクションです！！"
"104020-72-チヒロ" = "位置を確認したよ、ありがとう。#nナビゲーションデータに切り替えて転送するね。"
"104020-73-チヒロ" = "ヒマリ、これを破壊すれば、箱舟との接続を解除できるはず。"
"104020-74-ヒマリ" = "「箱舟」最下層セクションに「シャル・カリ・シャッリ回廊」を確認。#nこれは……ここから1,200mほど下りなくてはなりませんね……。"
"104020-75-ウタハ" = "その上、そこのセキュリティシステムが難解でね……！#n今から解除方法を説明する――"
"104020-76" = "私にお任せください…………"
"104020-77-ハナコ" = "…………システムの全容、把握しました！"
"104020-78-ウタハ" = "いつの間に……！？"
"104020-79-ハナコ" = "一度状況を整理いたします……「箱舟」の最下層「シャル・カリ・シャッリ回廊」にある「端末」を破壊するためには、セキュリティシステムを突破しなくてはなりません。"
"104020-80-ハナコ" = "現在、ウトナピシュティムはハッキングされた状態……ここからセキュリティシステムを突破するのは不可能です。"
"104020-81-ハナコ" = "まだ可能性があるとすれば……「箱舟」最東端と、最西端のセクションに存在する解除装置を同時に破壊すること。"
"104020-82-ハナコ" = "上手くいけば、約5秒ほどセキュリティシステムを停止させることができます。#nその間に端末を破壊すれば、あるいは――"
"104020-83-ハナコ" = "5秒……？"
"104020-84-ハナコ" = "ああもう！それしか無いのでしたら、すぐにチームを分けましょう。#n箱舟の東と西、最下層を担当するメンバーを――"
"104020-85-カヨコ" = "問題は最下層担当です。#n1,200mをこの短時間で駆け抜けられる方なんて――"
"104020-86-ハルナ" = "……うふふっ。"
"104020-87-ハルナ" = "フウカさん。ついに、やってまいりましたわ。"
"104020-88-フウカ" = "え？何が？……まさか、アレじゃないよね？"
"104020-89-ハルナ" = "ええ、その通り。アレですよ……#nついに、フウカさんの才能が花開く時です。"
"104020-90-ハルナ" = "私は知っております……#nフウカさんが、どれほど自身の才能を磨き、努力してきたかを――"
"104020-91-ハルナ" = "日々の鍛錬と精進を怠らない、その姿勢――"
"104020-92-ハルナ" = "そう！！その才能――実力を、ついに発揮する時が来たのです！#nこれを運命といわずしてなんと言うのでしょう！！"
"104020-93-アカリ" = "はい、運転のお時間です～★"
"104020-94-イズミ" = "あ！給食部の部長が一番得意なやつだね！！"
"104020-95-ジュンコ" = "こういう時の適任といえば、フウカよね。"
"104020-96-フウカ" = "ハルナ……？これ、わざとだよね？そうなんだよね？"
"104020-97-ハルナ" = "うふふっ、故意かどうかなど、さして重要ではありませんわ。#nフウカさんは、このために船に乗ったのでしょう？"
"104020-98-フウカ" = "……いや、宇宙食は？"
"104020-99-ジュンコ" = "とにかく！#n破壊は私たちに任せてちょうだい！！"
"104020-100-イズミ" = "うんうん！セキュリティシステムの方はよろしくね～！！"
"104020-101-ホシノ" = "はいはい、わかったよ。"
"104020-102-ホシノ" = "東の解除装置は私たちが担当するわ！"
"104020-103-ノノミ" = "はい！ここから向かうのが一番早いので☆"
"104020-104" = "ささっと片付けちゃおっか。#n先生とシロコちゃんのところに行かないとだからね。"
"104020-105-アヤネ" = "はい！では、私がサポートします。#n行きましょう！"
"104020-106" = "では、西はアリスたちに任せてください！"
"104020-107-ユウカ" = "ちょっ……ゲーム開発部！？"
"104020-108-ユズ" = "は、はい……！た、たぶんわたし達が、一番近いと思います……。"
"104020-109-ユウカ" = "そう……なら、私が案内するわ！"
"104020-110-モモイ" = "よし、行くよ！"
"104020-111-ミドリ" = "お、お姉ちゃん、待って……！"
"104020-112-ヒマリ" = "アリス、本当に大丈夫なんですね？"
"104020-113-アリス" = "はい！問題ありません！"
"104020-114-アリス" = "それに、「光の剣：アトラ・ハシースのスーパーノヴァ」もまだ壊れていませんから。"
"104020-115-ヒマリ" = "……その名前になったのですね。"
"104020-116-アリス" = "はい。もし良かったら、後でヒマリ先輩に見てもらいたいです。#nもしかしたら何か――"
"104020-117-ヒマリ" = "そうですね。何か、お力になれるかもしれません……#nでは、気をつけてくださいね、アリス。"
"104020-118-アリス" = "はい！行ってきます、ヒマリ先輩！"
"104020-119" = "フウカさん、準備はよろしいでしょうか？"
"104020-120" = "はぁ……何でこんなことに……"
"104020-121" = "私たちも準備OKだよ～！"
"104020-122-アカリ" = "「箱舟」でひと暴れできるなんて！ドキドキしちゃいます★"
"104020-123-ジュンコ" = "全員乗ったなら早く出発するわよ！時間がないんだってば！！"
"104020-124" = "はぁ……1,200m下まで行くんだっけ……？#nまぁ、いつものデリバリーだと思えば――"
"104020-125" = "さあ、出発ですよフウカさん！#n全てを終えたら最後に「グッ！」と親指を立てるのです！"
"104020-126" = "イヤ。絶対やらないわよ。"
"104020-127-フウカ" = "それじゃ……行くわよ！！"
"104020-128-一同" = "うりゃああああああ――――！！！"
"104020-129" = "次回;抵抗（２）"
