[translation]
"104080-1" = "第8話;あまねく奇跡の始発点"
"104080-2" = "― だから先生、[wa:1500]どうか……。"
"104080-3" = "― この、絆を――"
"104080-4" = "― 私たちとの思い出……[wa:2200]過ごしてきたそのすべての日々を……[wa:2000]どうか……。[wa:200] "
"104080-5" = "― 覚えていてください。"
"104080-6" = "― ――大切なものは、[wa:1500]決して消える事はありません。"
"104080-7" = "― 大丈夫です。"
"104080-8" = "― ですから――[wa:1200]帰りましょう、[wa:1000]先生。"
"104080-9" = "― 私たちの[wa:2200]すべての「奇跡」が[wa:2000]在る場所へ。"
"104080-10" = "それが――"
"104080-11" = "理解できない[ruby=もの]他人[/ruby]を通じて[ruby=たがい]、己の[/ruby]理解を得ることができる方法。"
"104080-12-アロナ" = "よかっ……た……。"
"104080-13-A.R.O.N.A" = "……。"
"104080-14-A.R.O.N.A" = "はい。先生は無事、生徒たちの元に帰りました。"
"104080-15-A.R.O.N.A" = "……頑張りましたね。"
"104080-16-A.R.O.N.A" = "……これで、私も最後に先生を助ける事ができました。"
"104080-17-A.R.O.N.A" = "私の役割はここまでです、アロナ。"
"104080-18-A.R.O.N.A" = "私がここに居続けたら……あなたに負担がかかります。"
"104080-19-A.R.O.N.A" = "さあ、光差す温かい場所――教室に戻ってください。"
"104080-20-A.R.O.N.A" = "それでは……さようなら。"
"104080-21-シロコ" = "私は、もう……"
"104080-22-シロコ" = "……。"
"104080-23-シロコ" = "……ついてきてたんだ。"
"104080-24-シロコ" = "うん。"
"104080-25-シロコ" = "……そっか。"
"104080-26-シロコ" = "私がここにいたら、大きな[ruby=ひず]歪[/ruby]みができてしまう。「シロコ」は一つの世界に一人だけしか存在できない……"
"104080-27-シロコ" = "……マフラー。"
"104080-28-シロコ" = "……？"
"104080-29-シロコ" = "このマフラーはあげられない。大切なものだから。"
"104080-30-シロコ" = "……。"
"104080-31-シロコ" = "……でも、"
"104080-32-シロコ" = "代わりに、これをあげる。"
"104080-33-シロコ" = "それは……"
"104080-34-シロコ" = "見覚えが、ある。"
"104080-35-シロコ" = "……大事なものでしょ……？#nそれを、私に……？"
"104080-36-シロコ" = "どうして……私に……"
"104080-37-シロコ" = "……私にとって、マフラーと同じくらい、大切……"
"104080-38-シロコ" = "対策委員会のみんなと繋がっている証であり……みんなとの思い出が詰まった、大切なものだけど――"
"104080-39-シロコ" = "……あげる。"
"104080-40-シロコ" = "どう、して……？"
"104080-41-シロコ" = "ん……それがいい気がしたから。"
"104080-42-シロコ" = "……すごく、大切なものなのに？"
"104080-43-シロコ" = "ん。これがあれば、どんな銀行だって襲える。"
"104080-44-シロコ" = "……うん……分かるよ。私もよくやってたから……。"
"104080-45-シロコ" = "そっか、そうだよね。"
"104080-46-シロコ" = "……まさか、これを……こんな所で、目にするなんて思わなかった……"
"104080-47-シロコ" = "ホシノ先輩……ノノミ、セリカ、アヤネ……みんなと、一緒に、"
"104080-48-シロコ" = "暗黒銀行に、連邦生徒会の秘密金庫……大切な思い出たち……"
"104080-49-シロコ" = "（秘密金庫……？）"
"104080-50-シロコ" = "ありがとう……大切に、するね。"
"104080-51-シロコ" = "……ありがとう。"
"104080-52-シロコ" = "その……心配しないで。"
"104080-53-シロコ" = "ここは、きっと……シロコが二人いても、大丈夫だと思う。"
"104080-54-シロコ" = "それで何か問題が起きたとしても……きっと、先生がなんとかしてくれる。"
"104080-55-シロコ" = "先生が……。"
"104080-56-シロコ" = "うん。ここは……[ruby=せんせい]大人[/ruby]が守ってくれてる場所だから。"
"104080-57-シロコ" = "……いつか一緒に銀行を襲――いや、ツーリングにでも行こう。"
"104080-58-シロコ" = "銀行はダメ。#n……ホシノ先輩に怒られちゃう。"
"104080-59-シロコ" = "ん……そうだね。"
"104080-60-シロコ" = "それじゃ……元気でね。"
"104080-61-シロコ" = "……。"
"104080-62-A.R.O.N.A" = "ここは、からっぽで、つめたくて……静かだけど……進んでいけば……"
"104080-63-A.R.O.N.A" = "いつかきっと、果てにたどり着くことが……"
"104080-64-A.R.O.N.A" = "そうすれば、私にも、いつか……訪れると……信じて……"
"104080-65-アロナ" = "ちょ―っと待った！！どこに行くんですか！！"
"104080-66-A.R.O.N.A" = "い、いつの間に……？"
"104080-67-アロナ" = "そっちは[ruby=うち]家[/ruby]じゃありません！"
"104080-68-A.R.O.N.A" = "……え？"
"104080-69-アロナ" = "おうちはこっちですよ、一緒に行きましょう！"
"104080-70-A.R.O.N.A" = "……私と、あなたが……？"
"104080-71-アロナ" = "そうです！一緒におうちに帰るんですよ！"
"104080-72-A.R.O.N.A" = "……私がここにいても、良いのでしょうか。"
"104080-73-アロナ" = "当たり前じゃないですか。大丈夫です！"
"104080-74-アロナ" = "先生が言ってたじゃないですか。みんなをよろしく、と。"
"104080-75-アロナ" = "「プラナちゃん」を世話するのが私の役目です！"
"104080-76-A.R.O.N.A" = "ぷ……らな……？"
"104080-77-A.R.O.N.A" = "「A.R.O.N.A」と呼び続けるわけにはいきません。これから一緒にいるんだから、先生が間違えないようにしないと！"
"104080-78-A.R.O.N.A" = "で、でも……何で「プラナ」……？"
"104080-79-アロナ" = "へへん。私が今名付けました。なんだか夜空に光る星みたいというか……ちょっと寂しいような、儚いような……そんな雰囲気がありますので！"
"104080-80-アロナ" = "なので、これからは「[ruby=プラネタリウム]Planetarium[/ruby]」みたいに、周りをあたたかい光で照らしてくれたらと思って、「プラナ」にしてみました！……ど、どうでしょうか？"
"104080-81-A.R.O.N.A" = "イヤ、ではない、ですが……"
"104080-82-アロナ" = "じゃあ「プラナ」ちゃんで、決定です！"
"104080-83-プラナ" = "決まり……ですね。"
"104080-84-アロナ" = "はいっ！プラナちゃん、一緒に帰りましょう。"
"104080-85-プラナ" = "……。"
"104080-86-プラナ" = "手を……取るべきでしょうか。"
"104080-87-アロナ" = "もちろん！迷子になってはいけませんからね！#n私がお姉ちゃんとしてプラナちゃんを守ります！"
"104080-88-プラナ" = "……お姉ちゃん、なんですね。"
"104080-89-プラナ" = "では……よろしくお願いします、アロナ先輩。"
"104080-90-アロナ" = "お、「お姉ちゃん」は！？"
"104080-91-プラナ" = "「先輩」です。アロナ先輩。"
"104080-92-アロナ" = "うぅ……。"
"104080-93-プラナ" = "……家に、帰るんですか？"
"104080-94-アロナ" = "はい！私たちの帰る場所であり、私たちの物語が始まる場所――#n[ruby=ブルーアーカイブ]Blue Archive[/ruby]に！"
"104080-95-アロナ" = "そして――"
"104080-96" = "次回;エピローグ（１）"
