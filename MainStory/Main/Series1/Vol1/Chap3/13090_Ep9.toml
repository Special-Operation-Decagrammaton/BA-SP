[translation]
"13090-1" = "第9話;アビドス生徒会（２）"
"13090-2" = "アビドス砂漠閉鎖地区セクター35-9"
"13090-3-ホシノ" = "ユメ先輩、何も見つかりませんよ。"
"13090-4-ユメ" = "……こっちもハズレみたい、うぅ。"
"13090-5-ユメ" = "ごめんね、ホシノちゃん。#nもう、ここまでみたい……。"
"13090-6-ホシノ" = "……良いから立ってください。"
"13090-7-ホシノ" = "私のことは置いていって良いから……今までありがとね、ホシノちゃん。"
"13090-8-ホシノ" = "ああ、もう！#nなんの真似ですか！"
"13090-9-ユメ" = "ふふっ。ごめんねホシノちゃん、冗談だから。#n次の駅には何かあるかもしれないし、行ってみよっか。"
"13090-10-ホシノ" = "……はぁ。"
"13090-11-ホシノ" = "どこも同じだと思いますよ。"
"13090-12-ホシノ" = "高価な展示品があったとしても、とっくに前生徒会が売り払ってますから。"
"13090-13-ユメ" = "う～ん……。"
"13090-14-ホシノ" = "もう帰りましょう。#n宝探しなんて、時間の無駄です。"
"13090-15-ユメ" = "えっ！？"
"13090-16-ユメ" = "ホシノちゃんも、最初はすっごいノリノリだったよね？"
"13090-17-ホシノ" = "そ、それは……！"
"13090-18-ホシノ" = "……って、先輩。#n手帳、落としましたよ。"
"13090-19-ユメ" = "あ、ありがとう！"
"13090-20-ユメ" = "良かった～。#n危うくホシノちゃんの大事な手帳を失くしちゃうところだったよ。"
"13090-21-ホシノ" = "……いつから私の手帳になったんですか。"
"13090-22-ユメ" = "え、えーっと……。"
"13090-23-ユメ" = "見て見て、ホシノちゃん。リュックサック型の水筒だって！#n便利そうじゃない？"
"13090-24-ホシノ" = "いえ。むしろ動く時、邪魔になります。#nしかも、高い割にクオリティも微妙そうですし……。"
"13090-25-ユメ" = "た、たしかに……。"
"13090-26-ユメ" = "ちょっと高すぎるかも。"
"13090-27-ホシノ" = "そんな物を買うくらいなら、弾丸を補充しませんか？"
"13090-28-ユメ" = "……その通り、だね。"
"13090-29-ホシノ" = "ひとつ気になったんですが……。"
"13090-30-ユメ" = "どうしたの？"
"13090-31-ホシノ" = "先輩は、どうやって生徒会長になったんですか？#n一人しかいない生徒会なんて、聞いたことありませんよ。"
"13090-32-ユメ" = "……あはは。やっぱり、気になるよね。#n実は、ちゃんとした選挙が開催されたわけじゃないの。"
"13090-33-ホシノ" = "そ、そうなんですか？"
"13090-34-ユメ" = "挙手投票で私を会長に選任したら、#n前の役員は全員いなくなっちゃったんだ。"
"13090-35-ホシノ" = "そんなやり方で……！？"
"13090-36-ユメ" = "……あの時のアビドスは、もうまともな状態じゃなかったから。"
"13090-37-ホシノ" = "ユメ先輩は、面倒事を押し付けられたんですね。"
"13090-38-ユメ" = "それは違うよ、ホシノちゃん。"
"13090-39-ユメ" = "私は望んで受け入れたの。"
"13090-40-ホシノ" = "……どうしてですか？"
"13090-41-ユメ" = "生徒会長としての権限があれば、#nアビドスを守れるかもしれないと思ったからだよ。"
"13090-42-ユメ" = "いざ会長になってみたら、そんなことはなかったんだけどね。"
"13090-43-ユメ" = "でも……これがあれば大丈夫！"
"13090-44-ホシノ" = "……これって？"
"13090-45-ユメ" = "じゃーん！生徒会長手帳だよ！"
"13090-46-ユメ" = "これでも毎日ちゃんと書いてるんだから！"
"13090-47-ホシノ" = "どこにでも売ってる学習帳じゃないですか……。"
"13090-48-ユメ" = "が、学習帳じゃなくて、生徒会長手帳！#nほとんど私の日記みたいなものだけど……。"
"13090-49-ユメ" = "いつか、ホシノちゃんに受け継いでもらうんだ！"
"13090-50-ホシノ" = "そんな未来は訪れませんよ。"
"13090-51-ユメ" = "ど、どうして！？ "
"13090-52-ユメ" = "って、そうだよね。#nホシノちゃんは生徒会でもないし……。"
"13090-53-ユメ" = "もう何回も断られてるのに、#nいつも一緒にいてくれるから勘違いしちゃってた……。"
"13090-54-ホシノ" = "い、いや……そうじゃなくて！！"
"13090-55-ホシノ" = "……あまりにもダサいのが、ちょっと。"
"13090-56-ユメ" = "え、そう？#n可愛いと思うけど……。"
"13090-57-ホシノ" = "どこがですか！？"
"13090-58-ユメ" = "あ、そっか。#nホシノちゃんはお魚さんが好きだもんね。"
"13090-59-ホシノ" = "な、何のことですか？"
"13090-60-ユメ" = "この前、可愛いクジラさんのノートをずっと見てたでしょ？#nホシノちゃんの目、すっごくキラキラしてたよ。"
"13090-61-ホシノ" = "気のせいです！#nあと、クジラは魚じゃありません！"
"13090-62-ユメ" = "ふふっ、やっぱり好きなんだね。"
"13090-63-ホシノ" = "もう知りません、先輩！"
"13090-64-ホシノ" = "先輩？"
"13090-65-ユメ" = "……。"
"13090-66-ホシノ" = "ユメ先輩！"
"13090-67-ユメ" = "……あ、ごめんね。"
"13090-68-ホシノ" = "何してるんですか？#n早く見つけて帰りますよ。"
"13090-69-ユメ" = "……見て、ホシノちゃん。"
"13090-70-ユメ" = "アビドスの夜は、星がきれいだね。"
"13090-71-ホシノ" = "周りに何もないですから。"
"13090-72-ユメ" = "それだけが理由なのかな……？"
"13090-73-ホシノ" = "というか、星なんかより足元を見てください！#nそんなんだから、いつまでも落とし物が見つからないんですよ！"
"13090-74-ホシノ" = "この近くにあるはずなんですよね？#nああ、もう。どうしてこんな面倒くさいお願いを……。"
"13090-75-ユメ" = "だって……困っている人は見過ごせないから。"
"13090-76-ユメ" = "あれ……？ "
"13090-77-ホシノ" = "急に風が……。"
"13090-78-ユメ" = "ほ、ホシノちゃん、早く帰ろう！砂嵐だよ！"
"13090-79-ユメ" = "もう道が……あれ、コンパスどこに入れたかな……。"
"13090-80-ユメ" = "……ひぃん、また忘れちゃったみたい。"
"13090-81-ユメ" = "あれほど忘れないよう言ったのに……！#n砂嵐が来たら遭難することくらい、分かってるじゃないですか！"
"13090-82-ユメ" = "うぅ、ごめんね……。"
"13090-83-ホシノ" = "はぁ、もう……念のため持ってきておいて正解でした。"
"13090-84-ユメ" = "わあっ、さすがホシノちゃん！#n持つべきものは頼れる後輩だね！"
"13090-85-ホシノ" = "余計なこと言ってないで、早く行きますよ！"
"13090-86-セリカ" = "先生もホシノ先輩も、連絡がつかないわね。#nいつまで待たせるのよ。"
"13090-87-アヤネ" = "セリカちゃん、そこの工具を取ってくれる？"
"13090-88-セリカ" = "ノノミ先輩とシロコ先輩も、どっか行っちゃったし。"
"13090-89-アヤネ" = "セリカちゃん、ハンマーもお願い。"
"13090-90-セリカ" = "生徒会長とホシノ先輩の間には、何があったんだろ……。"
"13090-91-アヤネ" = "……それは、先輩にしか分からないよ。"
"13090-92-セリカ" = "はぁ……でも、話してくれそうにないし。"
"13090-93-アヤネ" = "そうだね……。"
"13090-94-アヤネ" = "……よし、できた。"
"13090-95-セリカ" = "腰、大丈夫？"
"13090-96-アヤネ" = "うん、大丈夫。#nそれに、こういう時は手を動かしてるほうが、気持ちが楽になるから。"
"13090-97-セリカ" = "なら良いんだけど……。"
"13090-98-アヤネ" = "……ねえ、セリカちゃん。"
"13090-99-アヤネ" = "私たちだけで、生徒会室に行ってみよう。"
"13090-100-セリカ" = "……生徒会室って、あの鍵がかかってる部屋よね？"
"13090-101-セリカ" = "きっと、あそこには生徒会長の秘密が隠されてるはず。"
"13090-102-セリカ" = "そうかもしれないけど……大丈夫かな、勝手に入っても。"
"13090-103-アヤネ" = "セリカちゃんが心配してるように、怒られるかもしれないね。"
"13090-104-アヤネ" = "……でも、これ以上ホシノ先輩を待っている余裕はないから。"
"13090-105-アヤネ" = "確認、しよう。"
"13090-106-セリカ" = "ま、待ってよ！アヤネちゃん！"
"13090-107-ホシノ" = "……ふぅ。"
"13090-108-ホシノ" = "あれ……？"
"13090-109-ホシノ" = "なんで雨雲号が出てるんだろ。"
"13090-110-ホシノ" = "……アヤネちゃん、怒ってるかなぁ。"
"13090-111-ホシノ" = "ホシノちゃん、ここが新しい校舎だよ！"
"13090-112-ホシノ" = "新しいって……ただの別館じゃないですか。"
"13090-113-ユメ" = "それはそうだけど……。"
"13090-114-ユメ" = "……もう、私たちだけになっちゃったね。"
"13090-115-ホシノ" = "いなくなった人たちのことは忘れましょう。#n期待するだけ無駄だったんです。"
"13090-116-ユメ" = "そういう言い方は良くないと思うの。#nだって、悪いのは砂漠化でしょ？"
"13090-117-ホシノ" = "……。 "
"13090-118-ユメ" = "自分の自治区を離れるのは、誰しもつらいんだよ。"
"13090-119-ホシノ" = "……でも、結局みんなアビドスを捨てたじゃないですか！"
"13090-120-ユメ" = "みんなじゃないよ、ホシノちゃんがいる。"
"13090-121-ホシノ" = "……。 "
"13090-122-ユメ" = "それに……私も、ね？"
"13090-123-ホシノ" = "……先輩。"
"13090-124-ユメ" = "これからは、二人で頑張っていこう。"
"13090-125-ユメ" = "私がホシノちゃんを守るから、ホシノちゃんは私を守ってね？"
"13090-126-ホシノ" = "……先輩は自分のことだけ考えてください。#n弱いんですから。"
"13090-127-ユメ" = "そ、"
"13090-128-ユメ" = "そんな言い方しなくてもぉ……。"
"13090-129-ユメ" = "というか、ホシノちゃんが特別強いだけじゃない？"
"13090-130-ホシノ" = "……いえ。#nもっと、強くならないと。"
"13090-131-ホシノ" = "そのためにも……まずは先輩、これを受け取ってください。"
"13090-132-ユメ" = "うん……？"
"13090-133-ユメ" = "生徒会に入ってくれるの！？"
"13090-134-ユメ" = "やっ……って、どうして……？"
"13090-135-ユメ" = "生徒会かどうかに拘ってる意味がないと思ったので。"
"13090-136-ホシノ" = "……どうせ、先輩とはこれからもずっと一緒でしょうし。"
"13090-137-ホシノ" = "……あ、でもあのダサい手帳は受け取りませんから。"
"13090-138-ユメ" = "やったぁ！ありがとう、ホシノちゃん！"
"13090-139-ユメ" = "夢……？ううん、奇跡だよ！"
"13090-140-ホシノ" = "……先輩、苦しいです。#n夢じゃないので、そんなに抱きしめられたら死んじゃいますよ。"
"13090-141-ユメ" = "そうだ、記念に写真撮ろうよ！"
"13090-142-ホシノ" = "別に、わざわざ撮らなくても……。"
"13090-143-ユメ" = "お祝いの時は、"
"13090-144-ユメ" = "記念に写真を撮るものだから！"
"13090-145-ユメ" = "ほら、ホシノちゃん。ちゃんとカメラ見て？"
"13090-146-ホシノ" = "ち、近いです先輩。#n……あ、当たってるんですが。"
"13090-147-ユメ" = "恥ずかしがってないで、もっと近くおいで？"
"13090-148-ホシノ" = "いやいや、苦しいですって。"
"13090-149-ユメ" = "ふふっ。それじゃ、はいチーズ！"
"13090-150-ユメ" = "ここが新しい生徒会室だよ！"
"13090-151-ホシノ" = "……狭いですね。"
"13090-152-ユメ" = "うっ……。"
"13090-153-ユメ" = "でも、今日からここでアビドス生徒会は生まれ変わるの！#n今は二人しかいないけど、いつかは……。"
"13090-154-ホシノ" = "……いつかは？"
"13090-155-ユメ" = "えへへ。"
"13090-156-ユメ" = "いつかは後輩も入ってきて、きっと賑やかになると思うの！"
"13090-157-アヤネ" = "失礼、します……。"
"13090-158-セリカ" = "ま、待ってよアヤネちゃん。"
"13090-159-セリカ" = "あれ……。 "
"13090-160-セリカ" = "思ったよりきれいね？"
"13090-161-アヤネ" = "……うん。#n誰かが掃除してたんだと思う。"
"13090-162-セリカ" = "もしかして、ホシノ先輩が？"
"13090-163-シロコ" = "ん……。"
"13090-164-セリカ" = "シロコ先輩！？ "
"13090-165-ノノミ" = "あれ……？"
"13090-166-セリカ" = "の、ノノミ先輩！？"
"13090-167-セリカ" = "……もしかして、先輩がここの掃除をしてたの？"
"13090-168-ノノミ" = "そうですが……皆さんは何を？"
"13090-169-アヤネ" = "先輩たちも、気になってたんですね。"
"13090-170" = "うん……生徒会長に何があったのか、知りたくて。"
"13090-171-ノノミ" = "……。"
"13090-172-アヤネ" = "あはは……みんな、同じことを考えていたとは。"
"13090-173-ノノミ" = "私は、掃除をしておこうと思って……。"
"13090-174-アヤネ" = "……。"
"13090-175-ノノミ" = "と言っても、自己満足ですけどね。"
"13090-176-シロコ" = "何かあるよ。"
"13090-177-セリカ" = "キャビネット……？ "
"13090-178-ノノミ" = "あっ、それは……。"
"13090-179-シロコ" = "……生徒会長とホシノ先輩の個人ロッカーみたい。"
"13090-180-アヤネ" = "生徒会長のキャビネットは、扉が開いてますね。"
"13090-181-ノノミ" = "……何も入っていないようです。"
"13090-182-シロコ" = "ホシノ先輩のほうも開けてみる。"
"13090-183-セリカ" = "シロコ先輩！？#nどうしてピッキングツールなんて持ち歩いてるのよ！"
"13090-184-シロコ" = "……ん、ちょっとした趣味。"
"13090-185-ノノミ" = "あれ、鍵はかかっていないみたいですよ。"
"13090-186-セリカ" = "ん……。"
"13090-187-セリカ" = "良かった……ホシノ先輩に怒られるところだった。"
"13090-188-ノノミ" = "勝手に入ってる時点で、怒られるような気もしますが……。"
"13090-189-アヤネ" = "何か入ってましたか？"
"13090-190-シロコ" = "……装備品。"
"13090-191-アヤネ" = "防弾チョッキにサイドアーム……。"
"13090-192-シロコ" = "ホシノ先輩の物だと思う。#n使い込まれてるけど、手入れがされてる。"
"13090-193-セリカ" = "こんなにすごそうな装備……。"
"13090-194-セリカ" = "当時のホシノ先輩、何してたんだろ……。"
"13090-195-ノノミ" = "ほ、ホシノ先輩！？"
"13090-196-アヤネ" = "うわあっ！"
"13090-197-アヤネ" = "ほ、ホシノ先輩、これは……。"
"13090-198-シロコ" = "……ん。"
"13090-199-ホシノ" = "勝手に開けちゃダメでしょ～！"
"13090-200" = "次回;あの日"
