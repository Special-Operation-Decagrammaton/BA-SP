[translation]
"13200-1" = "第20話;宝探し"
"13200-2-ホシノ" = "……。"
"13200-3-シロコ" = "ホシノ先輩！"
"13200-4-アヤネ" = "プレジデントはどこに……？"
"13200-5-プレジデント" = "ふっ……。"
"13200-6-スオウ" = "……。"
"13200-7-セリカ" = "ヘリ……！？"
"13200-8-ホシノ" = "……っ！"
"13200-9-プレジデント" = "惜しかったな。"
"13200-10-プレジデント" = "これで列車砲は私の物だ。"
"13200-11-プレジデント" = "スオウ君、例の物は？"
"13200-12-スオウ" = "ここに。"
"13200-13-ノノミ" = "い、いつの間に私のカードを……！"
"13200-14-プレジデント" = "「生徒会の谷」に行くためには、これが必要だからな。"
"13200-15-アヤネ" = "生徒会の谷……？"
"13200-16-プレジデント" = "ああ。そこへ行くには、どうやらネフティスグループの権限が必要らしい。"
"13200-17-プレジデント" = "本人を連れていきたいところだが、#n生憎とそれは叶わなかった。"
"13200-18-スオウ" = "……しかし、このカードさえあれば問題ない。"
"13200-19-アヤネ" = "列車砲は「生徒会の谷」という場所にあるのですか……？"
"13200-20-プレジデント" = "まさか、君たちも来ようとでも？"
"13200-21-プレジデント" = "「列車砲シェマタ」は戦略的価値や技術的価値、歴史的価値を考慮すると――"
"13200-22-プレジデント" = "その価値は、約800億円にも[ruby=のぼ]上[/ruby]る！"
"13200-23-アヤネ" = "は、800億円……！？"
"13200-24-セリカ" = "で、デタラメに決まってるわ！"
"13200-25-プレジデント" = "もし列車砲に傷ひとつでも付けたら、#n多額の賠償金を支払ってもらおう。"
"13200-26-プレジデント" = "それだけの覚悟はあるのか？"
"13200-27-スオウ" = "そうだな。賠償金の支払いが済むまで、ホシノ君には働いてもらおう。#nきっと、黒服も喜ぶはずだ。"
"13200-28-スオウ" = "……それとも、法に則って戦うかね？#n相手になってやっても構わないぞ。"
"13200-29-スオウ" = "君たちが卒業したら、今度は新入生をいたぶってやろう。#nもっとも、アビドスに未来があるとしたらの話だがな。#nハッハッハッハッハ！"
"13200-30-スオウ" = "……ん？"
"13200-31-スオウ" = "どうした、スオウ君？"
"13200-32-プレジデント" = "なっ……。"
"13200-33-プレジデント" = "う、うおおおおおっ！？"
"13200-34-カイザーヘリのパイロット" = "プレジデント！？"
"13200-35" = "ぐああぁぁっ！"
"13200-36-アヤネ" = "仲間割れでしょうか……！？"
"13200-37-ホシノ" = "……！"
"13200-38-セリカ" = "えっ、どういうこと！？"
"13200-39-ノノミ" = "いったい、これは……。"
"13200-40-プレジデント" = "ぐ……。"
"13200-41-プレジデント" = "うっ……！"
"13200-42-PMC兵士B" = "プレジデント！"
"13200-43-PMC兵士B" = "お怪我は！？"
"13200-44-プレジデント" = "うっ……げほっ、げほっ。"
"13200-45-PMC兵士B" = "い、急いで本社に連絡を！"
"13200-46-スオウ" = "……[ruby=たかなし]小鳥遊[/ruby]ホシノ。#n生徒会の谷がどこを指しているのか、あんたなら知っているだろう？"
"13200-47-スオウ" = "列車砲を止めたいのなら、そこに来い。"
"13200-48-ホシノ" = "君は……。"
"13200-49-スオウ" = "もし来なければ、列車砲は私が動かす。"
"13200-50-ホシノ" = "……。"
"13200-51-アヤネ" = "どこなのでしょうか……？"
"13200-52-セリカ" = "私も知らないわ。"
"13200-53-ホシノ" = "（生徒会の谷……）"
"13200-54-ホシノ" = "（そうだ、セクター35-9！）"
"13200-55-ホシノ" = "どこも同じだと思いますよ。"
"13200-56-ホシノ" = "高価な展示品があったとしても、とっくに前生徒会が売り払ってますから。"
"13200-57-ホシノ" = "かつてアビドス生徒会が、砂漠に展示館を建てたんだ。#nその場所が、生徒会の谷。"
"13200-58-ホシノ" = "そっか、あそこに隠されてたんだ。"
"13200-59-シロコ" = "待って、ホシノ先輩！"
"13200-60-セリカ" = "そうよ、先輩！"
"13200-61-アヤネ" = "待ってください、話があるんです！"
"13200-62-ノノミ" = "ホシノ先輩！"
"13200-63-アヤネ" = "ノノミ先輩は助かったんです！"
"13200-64-シロコ" = "アビドス生徒会もなくならずに済んだ。"
"13200-65-アヤネ" = "そうです、だから落ち着いてください！#nみんなで作戦を考えましょう！"
"13200-66-ホシノ" = "……ごめんね。"
"13200-67-アヤネ" = "っ！？"
"13200-68-セリカ" = "ホシノ先輩……。"
"13200-69" = "[s] \"ホシノ、待って。\""
"13200-70-ホシノ" = "私が対策委員会にいたら、列車砲を破壊できなくなる。"
"13200-71-ノノミ" = "……！"
"13200-72-ホシノ" = "……私は対策委員会じゃない。#nアビドス生徒会なんだ。"
"13200-73-アヤネ" = "もう違います！"
"13200-74-アヤネ" = "対策委員会は、アビドス生徒――"
"13200-75-ホシノ" = "――契約を継続できなかった以上、その決定に意味はなくなる。"
"13200-76-ホシノ" = "この問題に、対策委員会は関わるべきじゃない。"
"13200-77-アヤネ" = "……！"
"13200-78-ホシノ" = "これは生徒会を自称している小鳥遊ホシノによる、#n独断の犯行じゃないといけないんだ。"
"13200-79" = "[ns] \"待って、ホシノ！\""
"13200-80-アヤネ" = "きゃっ！？"
"13200-81-ホシノ" = "ごめん、シロコちゃん。"
"13200-82-シロコ" = "くっ！"
"13200-83-ホシノ" = "列車砲は、アビドスにあっちゃいけないんだ。"
"13200-84-ホシノ" = "だから、私が壊す。#n可愛い後輩たちの、未来を守るために。"
"13200-85-ホシノ" = "……ユメ先輩と過ごした思い出を守ろうとしてくれて、ありがとう。"
"13200-86-シロコ" = "ホシノ先輩！！"
"13200-87-PMC兵士A" = "も、もう少しです！"
"13200-88-プレジデント" = "ぐっ……早くアビドスから離れるぞ。"
"13200-89-プレジデント" = "……それと、カイザーグループの全社員を招集しろ。"
"13200-90-PMC兵士A" = "ぜ、全社員ですか！？"
"13200-91-プレジデント" = "そうだ！"
"13200-92-プレジデント" = "カイザー・インダストリー。"
"13200-93-プレジデント" = "カイザーローン。"
"13200-94-プレジデント" = "カイザーコンストラクション。"
"13200-95-プレジデント" = "カイザーコンビニエンス。"
"13200-96-プレジデント" = "カイザーPMC。"
"13200-97-プレジデント" = "我が社の全勢力をもって、総力戦に臨むのだ……！"
"13200-98-PMC兵士B" = "総力戦……！"
"13200-99-プレジデント" = "目標は生徒会の谷だ……！#n良いか、ごほっごほっ……！"
"13200-100-プレジデント" = "必ずや、列車砲を手に入れろ！"
"13200-101-PMC兵士A" = "しょ、承知しました！"
"13200-102-アヤネ" = "……。"
"13200-103-ノノミ" = "ホシノ先輩……。"
"13200-104-シロコ" = "……。"
"13200-105-ホシノ" = "……。"
"13200-106" = "次回;二度目の追跡"
