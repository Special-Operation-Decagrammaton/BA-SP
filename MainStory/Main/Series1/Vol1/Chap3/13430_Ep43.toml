[translation]
"13430-1" = "第43話;エピローグ（２）"
"13430-2-セリカ" = "ありがとうございました、またお待ちしています！"
"13430-3-セリカ" = "……あっ、いらっしゃいませ！"
"13430-4-セリカ" = "二名様ですね、こちらに名前を記入してお待ちください！"
"13430-5-柴大将" = "セリカちゃん、これも頼めるかな？"
"13430-6-セリカ" = "はい、すぐ行きます！"
"13430-7" = "[ns] \"忙しそうだね、セリカ。\""
"13430-8-シロコ" = "最近、人が増えた気がする。"
"13430-9-アヤネ" = "新しいお店もできてきましたし。"
"13430-10-ノノミ" = "うんうん！#nとっても良いことだと思います！"
"13430-11-ホシノ" = "けど、その分トラブルは増えるからねぇ。#nふあぁ……おかげで寝不足だよ。"
"13430-12-ホシノ" = "まぁ、今のところそこまでじゃないけどさ。"
"13430-13" = "ドロボーだ！"
"13430-14-強盗" = "おいっ、[ruby=ど]退[/ruby]け！"
"13430-15-市民" = "だ、誰か捕まえてください！"
"13430-16-シロコ" = "行ってくる！"
"13430-17-セリカ" = "あっ、ラーメンが伸びる前に戻ってきてよねー！？"
"13430-18-ノノミ" = "シロコちゃん……！"
"13430-19-ホシノ" = "へーきへーき。#n最近のシロコちゃんは、ますます強くなったからね。"
"13430-20" = "[ns] \"……。\""
"13430-21-アヤネ" = "先生、どうかしましたか……？"
"13430-22" = "[s] \"私も行ってくるよ。\""
"13430-23-アヤネ" = "あっ、はい。"
"13430-24-強盗" = "ひひっ、ここまで来ちまえば……。"
"13430-25-シロコ" = "……。"
"13430-26" = "[ns] \"シロコ！\""
"13430-27-シロコ" = "先生……？"
"13430-28-シロコ" = "……気づかれた。"
"13430-29-シロコ" = "……。"
"13430-30-シロコ" = "……ん、私は持ち主に届けてくる。"
"13430-31-シロコ" = "大丈夫、逃げないから。"
"13430-32-シロコ" = "私の動きは、あなたにお見通しみたいだし。"
"13430-33-シロコ" = "先生……。"
"13430-34" = "[s] \"いってらっしゃい。私はこっちのシロコと少し話があるから。\""
"13430-35-強盗" = "（……）"
"13430-36-シロコ" = "……久しぶり、でもないか。"
"13430-37" = "[s] \"ずっとアビドス自治区にいたの？\""
"13430-38-シロコ" = "うん……知ってる場所は、ここくらいだから。"
"13430-39-シロコ" = "いろんな空き家を転々としてた。"
"13430-40-シロコ" = "意外と水も電気も使えるところが多いから。"
"13430-41" = "[s] \"食事は困ったりしてない？\""
"13430-42-シロコ" = "廃品を回収してお金に変えてるから、大丈夫。#nこうやって自警団としての活動もしてるし……"
"13430-43-シロコ" = "……一人は慣れてる。"
"13430-44" = "[ns1] \"よかったら、一緒にラーメンを食べない？\"\n[ns2] \"みんなも心配してるよ。\""
"13430-45-シロコ" = "……いや、大丈夫。"
"13430-46-シロコ" = "みんなに合わせる顔が……。"
"13430-47" = "[s] \"そっか。それなら今度でも大丈夫だよ。\""
"13430-48-シロコ" = "……。"
"13430-49-シロコ" = "聞かないの？"
"13430-50" = "[s] \"……何のこと？\""
"13430-51-シロコ" = "私に何が起こったのか。"
"13430-52-シロコ" = "疑問なら、いくらでもあるはず。"
"13430-53" = "[s] \"ある程度分かってるよ。\""
"13430-54-シロコ" = "……ん。"
"13430-55" = "[s] \"それに、また苦しめちゃうんじゃないかと思って。\""
"13430-56-シロコ" = "……ありがとう。"
"13430-57-シロコ" = "でも、私はもう大丈夫。"
"13430-58-シロコ" = "……ホシノ先輩が、どうして反転した状態から戻ってこられたのか。"
"13430-59" = "[s] \"……。\""
"13430-60-シロコ" = "たぶん、まだ不完全な状態だったからじゃないかと思う。"
"13430-61-シロコ" = "それに、先輩は自身の本質の一部を棄てたから……"
"13430-62-シロコ" = "……だから、前に進めたんだと思う。"
"13430-63-クズノハ" = "「色彩」によって反転した者を元に戻す方法など、存在せぬ。"
"13430-64-クズノハ" = "其れは――死者が生き返らないのと同様に。#nこの世界の絶対的なルールである。"
"13430-65-クズノハ" = "だがそれでも……助けたい者が居ると申すのなら――妾を訪ねてくりゃれ。"
"13430-66" = "[ns] \"亡くなった人は、生き返らない。\""
"13430-67" = "[ns3] （クズノハを追うのは、もうやめよう……）\n[ns4] \"……だから、シロコの力になりたいんだ。\""
"13430-68-シロコ" = "でも、私がここにいたら大きな[ruby=ひず]歪[/ruby]みができてしまう。#n「シロコ」は一つの世界に一人だけしか存在できない……。"
"13430-69" = "[s] \"私が何とかするよ。\""
"13430-70-シロコ" = "……ふふっ。"
"13430-71" = "[s] \"シロコ……？\""
"13430-72-シロコ" = "前にも聞いたなって。"
"13430-73-シロコ" = "うん。ここは……[ruby=せんせい]大人[/ruby]が守ってくれてる場所だから。"
"13430-74-シロコ" = "やっぱり、先生は先生だね……。"
"13430-75-シロコ" = "……それもそうだよね、私があの子であるように。"
"13430-76" = "[s] \"私が[ruby=・]私[/ruby]であるように。\""
"13430-77-シロコ" = "ん……先生は、いつだって私たちを助けてくれた。#n同じような状況で、同じ選択をして……。"
"13430-78" = "[ns] \"……これ、渡しておくよ。\""
"13430-79-シロコ" = "スマートフォン……？"
"13430-80-シロコ" = "……懐かしい。"
"13430-81" = "[s] \"[ruby=・   ・]また[/ruby]、いつでも連絡して。私の、手の届くところで。\""
"13430-82-シロコ" = "……ん。"
"13430-83-シロコ" = "そろそろ行くよ、先生。"
"13430-84-シロコ" = "また連絡する。"
"13430-85" = "[ns] \"シロコ！\""
"13430-86" = "[ns] \"……大丈夫だよ。ちゃんと君は変わってる。\""
"13430-87-シロコ" = "……？"
"13430-88" = "[s5] \"みんな、変わっていけるから。\"\n[s6] \"たとえ、一歩一歩は小さかったとしても。\""
"13430-89-シロコ" = "……うん、分かってる。"
"13430-90" = "……この苦しみも、幸せも、私の人生にとってどれも大切なもの。"
"13430-91-ホシノ" = "……だから。"
"13430-92-シロコ" = "……きっと、大丈夫。"
"13430-93" = "#videons2;11008"
"13430-94-アヤネ" = "目視できる距離まで来ました！"
"13430-95-セリカ" = "分かってるわ！"
"13430-96-ノノミ" = "前に戦った時は、砂漠の真ん中でしたね！"
"13430-97-アヤネ" = "ですが、あの時は色彩で――"
"13430-98-セリカ" = "要するに、放っておいたらアビドスがめちゃくちゃになるんでしょ！？"
"13430-99-シロコ" = "ん、制圧する。"
"13430-100" = "側面に回り込みましょう。#n私も援護するので、攻撃の準備を！"
"13430-101" = "了解。"
"13430-102" = "突撃です～☆"
"13430-103" = "それより、ホシノ先輩はどこなの！？"
"13430-104" = "……えっ？"
"13430-105-ホシノ" = "とっくに着いてるよ。"
"13430-106-セリカ" = "えっ、いつの間に！？"
"13430-107-ホシノ" = "みんなも早く～。#nおじさん、もう歳だからそんなに待てないよ？"
"13430-108-シロコ" = "ん、すぐ行く。"
"13430-109-セリカ" = "先輩、お待たせ！"
"13430-110-ノノミ" = "あっ……！？"
"13430-111-シロコ" = "遅かったね。"
"13430-112-シロコ" = "……！"
"13430-113-ノノミ" = "あなたは……。"
"13430-114-セリカ" = "もう一人のシロコ先輩！#n……助けに来てくれたのよね？"
"13430-115" = "ん、今回だけ。"
"13430-116-ホシノ" = "とりあえず、今は目の前のあいつに集中しよっか。"
"13430-117-シロコ" = "それじゃあ、作戦Bで。"
"13430-118-セリカ" = "……って、何よそれ。"
"13430-119-ノノミ" = "うんうん！#nセリカちゃんも早く準備してください～☆"
"13430-120-アヤネ" = "遊んでいる場合じゃありません！#nビナーがこちらに気づいたようです！"
"13430-121-セリカ" = "アヤネちゃんも遊んでるじゃない……。"
"13430-122-シロコ" = "う、うーん……。"
"13430-123-セリカ" = "シロコ先輩、どうしたの？"
"13430-124-シロコ" = "この覆面はあげないよ。#n大切なものだから。"
"13430-125-ホシノ" = "よし、それじゃ……。"
"13430-126" = "ホシノ"
"13430-127" = "[7cd0ff]対策委員会[-]"
"13430-128" = "[log=호시노]アビドス、行くよ！[/log]"
