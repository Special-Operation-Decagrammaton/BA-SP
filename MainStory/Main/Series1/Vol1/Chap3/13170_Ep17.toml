[translation]
"13170-1" = "第17話;追跡"
"13170-2-地下生活者" = "……良いでしょう。 "
"13170-3-地下生活者" = "次は[USERNAME]先生……あなたのターンです。"
"13170-4-地下生活者" = "ゲームとは、攻守が入れ替わるもの。 "
"13170-5-地下生活者" = "もちろん、防戦一方でいるつもりはありませんがね。#nヒッ、ヒヒヒッ……。"
"13170-6-地下生活者" = "このキャンペーンは、あくまでも小生の求道。#n実験でも研究でも、儀式でもないですから。#nルールに縛られる必要性もないのです。"
"13170-7-地下生活者" = "攻略法3つ目――「心は予測も制御もできない」。"
"13170-8-地下生活者" = "欲望や罪悪、恐怖、執念、悲嘆……。"
"13170-9-地下生活者" = "……それらが衝突し生み出された混沌が、#nあなたの前にのしかかってくることでしょう。"
"13170-10-地下生活者" = "さて、プレイヤーとなったあなたが、どう攻略していくのか見ものです。"
"13170-11" = "本作で登場する法解釈は実際のものとは#n一切関係のないフィクションです。"
"13170-12" = "[ns] \"ノノミの位置が分かったよ。\""
"13170-13-アヤネ" = "どこですか！？"
"13170-14" = "[ns] \"アビドス中央駅旧庁舎。\" "
"13170-15-アヤネ" = "そこは……。"
"13170-16-シロコ" = "債権者団体の総会が開催される場所。 "
"13170-17-アヤネ" = "二手に分かれることも想定していましたが……#n助かりましたね。"
"13170-18-シロコ" = "ありがとう、先生。"
"13170-19-シロコ" = "これでホシノ先輩の捕獲、契約の継続、ノノミの救出……#n全部まとめて解決できる。"
"13170-20-セリカ" = "やっぱり、先生はすごいわね。"
"13170-21-シロコ" = "うん。セリカがヘルメット団に連れて行かれた時も、#nこうやって先生が助けてくれた。"
"13170-22-セリカ" = "い、いつの話よ！#nもう忘れてってば！"
"13170-23-シロコ" = "……だって、心配だったから。"
"13170-24-セリカ" = "そう言われると、ちょっと恥ずかしいわね……。"
"13170-25-アヤネ" = "あはは……#nでも、本当に驚いたんだよ？"
"13170-26-シロコ" = "ん、ホシノ先輩が内心一番焦ってた。"
"13170-27-シロコ" = "先生にお願いするって言って、一人で出ていっちゃうくらい。"
"13170-28-セリカ" = "それ、本当……？"
"13170-29" = "[ns1] \"それだけセリカのことが大事なんだよ。\"\n[ns2] \"普段は言葉にしてないみたいだけど。\""
"13170-30-ノノミ" = "電話はしてみました？"
"13170-31-アヤネ" = "……はい。でも数時間前から、電源が入ってないみたいで……。"
"13170-32-シロコ" = "バイト先では定時に店を出たみたい。その後、家に帰ってないってことかな。"
"13170-33-ノノミ" = "こんな遅くまで帰らないなんてこと、これまでなかったですよね……？"
"13170-34-シロコ" = "まさか……ヘルメット団の連中？"
"13170-35-アヤネ" = "えっ！？ヘルメット団がセリカちゃんを……！？"
"13170-36-シロコ" = "とりあえず待とう。ホシノ先輩と先生が調べてるから。"
"13170-37-アヤネ" = "……。"
"13170-38" = "（ガチャッ）"
"13170-39-ホシノ" = "みんな、お待たせー。"
"13170-40-アヤネ" = "ホシノ先輩！先生！"
"13170-41" = "[s] \"ただいま。\""
"13170-42-シロコ" = "どうだった、先輩？"
"13170-43-ホシノ" = "先生が持ってる権限を使って、連邦生徒会が管理するセントラルネットワークにアクセスできた。"
"13170-44-アヤネ" = "セントラルネットワークに……#n先生、そんな権限までお持ちなのですね……。"
"13170-45-ホシノ" = "うへ～もちろんこっそりだけどね。バレたら始末書だよー？"
"13170-46-セリカ" = "そうだったんだ……。"
"13170-47-シロコ" = "先輩は、わざわざ言わなかったけど。"
"13170-48-アヤネ" = "……何だか、すごく昔のように感じますね。"
"13170-49-シロコ" = "ん。"
"13170-50-セリカ" = "……ありがとう、みんな。"
"13170-51" = "[ns] \"先生として当然だよ。\""
"13170-52" = "AM 08:5X"
"13170-53-アヤネ" = "では、会議を始めます！"
"13170-54-アヤネ" = "私たちは、アビドス中央駅旧庁舎で開催される#n「債権者団体の総会」に出席しなければなりません。#nタイムリミットは、本日正午。"
"13170-55-アヤネ" = "目標は、捕らわれているノノミ先輩の救出。"
"13170-56-アヤネ" = "そして、ホシノ先輩がアビドス生徒会の存在を否定する前に、#n対策委員会の正当性を主張します。"
"13170-57-シロコ" = "了解、生徒会長。"
"13170-58-アヤネ" = "……。"
"13170-59-セリカ" = "どうしたのよ、アヤネちゃん。#n生徒会長なんだから、早く慣れないと。"
"13170-60-アヤネ" = "わ、私が生徒会長になったのは、あくまでも契約のためで……。"
"13170-61" = "[s3] \"アヤネ会長の力を見せてやろう！\"\n[s4] \"任せたよ、アヤネ会長。\""
"13170-62-アヤネ" = "……総会で発言する必要があるため、今回は私も現場へ向かいます。"
"13170-63-シロコ" = "あっ、誤魔化した。"
"13170-64-シロコ" = "逃げた。"
"13170-65-アヤネ" = "次の作戦会議に移ります！"
"13170-66-アヤネ" = "現在、アビドス中央駅に続くルートは、#n私募ファンドの兵力によって封鎖されています。"
"13170-67" = "中央駅旧庁舎・東地区"
"13170-68-アヤネ" = "東地区は、ふわふわヘルメット団が守っています。"
"13170-69-アヤネ" = "単体の戦力はさておき、数が圧倒的です。"
"13170-70-アヤネ" = "時間が限られている以上、このルートは避けましょう。"
"13170-71" = "中央駅旧庁舎・西地区"
"13170-72-アヤネ" = "西地区は、マーケットガードが集中しています。"
"13170-73-アヤネ" = "戦闘ヘリやタンク、強力な重火器を使用している可能性が高いです。"
"13170-74-アヤネ" = "戦術的な優位に立てない限り、ここも避けたいですね。"
"13170-75" = "中央駅旧庁舎・南地区"
"13170-76-アヤネ" = "南地区は、黒亀組です。"
"13170-77-アヤネ" = "無人砲塔を大量に保有しているため、容易には近づけないかと……。"
"13170-78" = "中央駅旧庁舎・北地区"
"13170-79-アヤネ" = "北地区は雇われ傭兵の集まりと思われますが、#n特殊なバリケードが設置されているようです。"
"13170-80-アヤネ" = "戦闘能力はそれほど高くありませんが、#n通常の装備で突破するのは困難でしょう。"
"13170-81-シロコ" = "……どのルートにしよう。"
"13170-82-セリカ" = "ホシノ先輩が通る場所にすれば良いんじゃないの？"
"13170-83" = "となると、先輩の立場で考える必要が……。"
"13170-84-セリカ" = "シロコ先輩なら分かるでしょ！"
"13170-85-シロコ" = "んー……。"
"13170-86-アヤネ" = "そうですね……#nシロコ先輩から見て、どのルートだと思いますか？"
"13170-87-シロコ" = "……ホシノ先輩の強さは、白兵戦。"
"13170-88-シロコ" = "昔は、もっと自分の身を顧みない戦闘スタイルだったって聞いた。"
"13170-89-シロコ" = "たぶん、大量の重火器を持った相手との戦いにも慣れているはず。"
"13170-90-シロコ" = "だから……。"
"13170-91" = "中央駅旧庁舎・西地区"
"13170-92-マーケットガード１" = "誰だ！"
"13170-93-マーケットガード２" = "あ、あいつは……！"
"13170-94-マーケットガード１" = "来たぞ、[ruby=たかなし]小鳥遊[/ruby]ホシノだ！"
"13170-95-マーケットガード２" = "ど、どこへ行った！？"
"13170-96-シロコ" = "……西地区だと思う。"
"13170-97-セリカ" = "それじゃ、行くわよ！"
"13170-98-押収品競売組合長" = "全兵力を小鳥遊ホシノに集中させろ！"
"13170-99-押収品競売組合長" = "総会が始まるまで、絶対に通すな！"
"13170-100-マーケットガード３" = "はっ、はい！"
"13170-101-ホシノ" = "……またヘリ？"
"13170-102-マーケットガード１" = "ターゲットの位置を確認！"
"13170-103-マーケットガード１" = "6時の方向です！！"
"13170-104-マーケットガードのパイロット" = "ターゲット確認、ロックオン。"
"13170-105-マーケットガードのパイロット" = "AGM-114空対地ミサイル、発射！"
"13170-106-マーケットガードのパイロット" = "ターゲットに命中！"
"13170-107-マーケットガードのパイロット" = "なっ……！？"
"13170-108-マーケットガード１" = "こちらに向かってきます……！"
"13170-109-マーケットガードのパイロット" = "なに言ってんだよ。#nこっちは空中に――"
"13170-110-マーケットガード１" = "ど、どこに消えた！？"
"13170-111-マーケットガード２" = "し、下です！#nヘリの足にぶら下がっています！"
"13170-112-マーケットガード１" = "う、うああっ！？"
"13170-113-私債労働組合長" = "何が起きてるんだ……。"
"13170-114-債権者団体の代表" = "くっ……。"
"13170-115-ネフティス幹部" = "失敗したようですね。"
"13170-116-押収品競売組合長" = "黙れ、ネフティス！"
"13170-117-ネフティス幹部" = "何の真似でしょうか？"
"13170-118-押収品競売組合長" = "お前たちの企みなど、とっくに知っている。"
"13170-119-ネフティス幹部" = "企み、ですか……。"
"13170-120-債権者団体の代表" = "[ruby=われわれ]私募ファンド[/ruby]を裏切ろうとしているのだろう？"
"13170-121-債権者団体の代表" = "か、カイザーPMC！？"
"13170-122-PMC兵士A" = "言葉には気をつけてください。"
"13170-123-PMC兵士A" = "列車砲は、最初から私たちの物です。"
"13170-124-マーケットガード１" = "や、やれっ！"
"13170-125-ノノミ" = "こ、この音は……？"
"13170-126-スオウ" = "……。"
"13170-127" = "中央駅旧庁舎・西地区"
"13170-128-マーケットガード１" = "と、捕らえろ！"
"13170-129" = "AM 09:4X"
"13170-130-セリカ" = "どうなってるのよ、これ！"
"13170-131-シロコ" = "ホシノ先輩は……。"
"13170-132-アヤネ" = "……見つけました、600m先です！"
"13170-133-アヤネ" = "700m、750m……どんどん遠ざかっています！"
"13170-134-シロコ" = "は、速すぎない……！？"
"13170-135-シロコ" = "追いかける。"
