[translation]
"13270-1" = "第27話;紙一重の勝負"
"13270-2-ホシノ" = "……強くなったね、シロコちゃん。"
"13270-3-シロコ" = "はぁ……はぁ……。"
"13270-4-シロコ" = "先生が一緒だから。"
"13270-5-シロコ" = "……それでも、本当に強くなったよ。"
"13270-6-ホシノ" = "まさか、こんなに早く「いつか」が訪れるとは思わなかったけどね。"
"13270-7-シロコ" = "……。"
"13270-8-セリカ" = "ホシノ先輩……。"
"13270-9-アヤネ" = "……。"
"13270-10-ノノミ" = "先輩……。"
"13270-11" = "[ns] \"もう充分じゃないかな、ホシノ。\""
"13270-12-ホシノ" = "……そうかな。"
"13270-13-アヤネ" = "カイザーは列車砲の所有権を主張していますが、こじつけに過ぎません。#nほかに方法はあるはずです。"
"13270-14-アヤネ" = "……そうだね、先生も一緒にいるわけだし。"
"13270-15-ホシノ" = "……あの時みたいに、でしょ？"
"13270-16" = "[ns] \"うん、方法ならみんなで探そう。\""
"13270-17-ホシノ" = "……。"
"13270-18-ノノミ" = "ホシノ先輩……。"
"13270-19-ノノミ" = "ノノミちゃんの意見は？"
"13270-20-ノノミ" = "私は……。"
"13270-21-ノノミ" = "ホシノ先輩に対して……勝手に、自分の姿を重ねていました。"
"13270-22-ノノミ" = "でも亡くなった人は帰ってこなくて、#n時間を巻き戻すこともできなくて……。"
"13270-23-ノノミ" = "ホシノ先輩に解放されてほしいって、願うと同時に。"
"13270-24-ノノミ" = "私自身も……。"
"13270-25-ノノミ" = "罪悪感から、解放されたかったのかもしれません。"
"13270-26-ノノミ" = "……。"
"13270-27-シロコ" = "私はユメ会長のことを知らないし、"
"13270-28-シロコ" = "なんて声をかけたら良いのか……ごめん。"
"13270-29-シロコ" = "シロコちゃん……。"
"13270-30-シロコ" = "でも……聞かせて、先輩の話。"
"13270-31-セリカ" = "そうよ。"
"13270-32-セリカ" = "一人で責任を負う必要はないわ！"
"13270-33-セリカ" = "セリカちゃん……。"
"13270-34-アヤネ" = "これは先輩だけの問題じゃありません！"
"13270-35-アヤネ" = "対策委員会の……いえ、アビドスの問題です！"
"13270-36-アヤネ" = "話してくれていれば、一緒に考えられたのに……。"
"13270-37-アヤネ" = "アヤネちゃ……ううん、アヤネ会長。"
"13270-38-アヤネ" = "アヤネちゃん、で良いです……。"
"13270-39-アヤネ" = "アヤネ、ちゃん……。"
"13270-40-ホシノ" = "先生、みんな……｡"
"13270-41-ホシノ" = "……ユメ先輩を殺したのは私なんだ。"
"13270-42-ノノミ" = "……先輩。"
"13270-43-ノノミ" = "それは……！"
"13270-44-ホシノ" = "……分かってる。#nあれは事故で、私のせいじゃない。"
"13270-45-ホシノ" = "ずっと、そう思おうとしてた。"
"13270-46-ホシノ" = "ユメ先輩は、どんな時も生徒会長として頑張ってくれてたんだ。"
"13270-47-ホシノ" = "優しくて、心配性で、何があっても私を抱きしめてくれてた。"
"13270-48-ホシノ" = "でも、そんなユメ先輩が残したものを、私は何も守れなかった。#nいつも不満を漏らして、怒ってばかり。"
"13270-49-ホシノ" = "あれだけ思い出を受け取ったのに、#nお礼を言う機会すらないなんて。"
"13270-50-ホシノ" = "……先輩は、もう死んじゃったから。"
"13270-51-ホシノ" = "もう、二度と会えないから……。"
"13270-52" = "[ns] \"ホシノのせいじゃないよ。\""
"13270-53-ホシノ" = "……うん、頭では分かってるんだ。"
"13270-54-ホシノ" = "それでも、私は……。"
"13270-55-ホシノ" = "私は……っ。"
"13270-56" = "[ns] \"帰ろう、ホシノ。\""
"13270-57-ホシノ" = "……先生。"
"13270-58" = "[s] \"もう充分苦しんだよ。\""
"13270-59-アヤネ" = "帰りましょう、対策委員会に。"
"13270-60-アヤネ" = "そうよ、先輩。"
"13270-61-ノノミ" = "私たちが一緒にいます。"
"13270-62-シロコ" = "ん。"
"13270-63-シロコ" = "……うん。"
"13270-64-シロコ" = "ありがとう、みん――"
"13270-65-地下生活者" = "おやおや……誰がそのような選択を許しましたか？"
"13270-66-アヤネ" = "この音は！？"
"13270-67-セリカ" = "か、雷……？"
"13270-68-ノノミ" = "あ、あちらを見てください！"
"13270-69-シロコ" = "っ！？"
"13270-70-アヤネ" = "ど、どうして……！？"
"13270-71-ノノミ" = "あっ、私のカード……！？"
"13270-72-スオウ" = "[ruby=たかなし]小鳥遊[/ruby]ホシノ！"
"13270-73-ホシノ" = "……！"
"13270-74-スオウ" = "まずはあんたらの学校を吹き飛ばしてやる！"
"13270-75-スオウ" = "列車砲を止めたいのならば、来ると良い！"
"13270-76-アヤネ" = "！？"
"13270-77-ホシノ" = "……！"
"13270-78-スオウ" = "「大オアシス駅」で待っている。"
"13270-79-スオウ" = "もし来なければ……。"
"13270-80-シロコ" = "待って、ホシノ先輩……！"
"13270-81-シロコ" = "くっ……！"
"13270-82-アヤネ" = "ほ、ホシノ先輩……！"
"13270-83" = "[s] \"ホシノ……！\""
"13270-84-ホシノ" = "……ありがとね、みんな。"
"13270-85-ホシノ" = "でも、この苦しみは私の物だから。"
"13270-86-ホシノ" = "列車砲は、私が壊す。"
"13270-87-ホシノ" = "ユメ先輩も、きっと同じ選択をしたはず。"
"13270-88-ホシノ" = "本当は、二年前に解決しなくちゃいけなかったんだ。"
"13270-89" = "[ns] \"待って、ホシノ！\""
"13270-90-セリカ" = "追いかけないと！"
"13270-91-ノノミ" = "ホシノ、先輩……。"
"13270-92-アロナ" = "確認できました、先生！"
"13270-93-アロナ" = "列車砲シェマタには、#n現在のキヴォトスに存在しない技術が使われています！"
"13270-94-アロナ" = "どうやら、太陽と同じ温度のプラズマを発射する構造になっているようです！"
"13270-95-アロナ" = "ただし、完全には再現できていないようで……。"
"13270-96-アロナ" = "無理に壊そうとすれば、#nエネルギーが拡散して広範囲に被害が及ぶかもしれません！"
"13270-97-アロナ" = "ホシノさんやスオウさんだけでなく、#n皆さんまで巻き込まれてしまいます！"
"13270-98-地下生活者" = "ヒッ、ヒヒッ！"
"13270-99-地下生活者" = "ヒヒ、ヒヒヒヒヒッ……！！"
"13270-100-地下生活者" = "いやはや、1秒でも遅れていれば小生の負けでした。"
"13270-101-地下生活者" = "これこそ、紙一重の勝負。"
"13270-102-地下生活者" = "[USERNAME]先生、あなたは今まで戦っていたどの相手よりも手強いです。"
"13270-103-地下生活者" = "しかし、もう奇跡は起きません。#nあなたの力は無効化されました。"
"13270-104-地下生活者" = "そろそろクライマックスと行きましょうか。"
"13270-105-地下生活者" = "さあ、"
"13270-106-地下生活者" = "咎人よ。"
"13270-107-地下生活者" = "実態なき虚を追う求道者よ。"
"13270-108-地下生活者" = "この世に存在せずとも[ruby=ことわり]、理を[/ruby]支配する真実よ。"
"13270-109-地下生活者" = "ああ、それこそ――死なのです。"
"13270-110-地下生活者" = "死。"
"13270-111-地下生活者" = "死。"
"13270-112-地下生活者" = "死。"
"13270-113-地下生活者" = "死。死。死。死。死。死。死。死。死。死。死。死。"
"13270-114-地下生活者" = "決して逃れられぬ真実を。"
"13270-115-地下生活者" = "小生の前に掲示したまえ。"
"13270-116-地下生活者" = "六つ目の古則、「[ruby=ひう]非有[/ruby]の真実は真実であるか」。#nその答えを、導きたまえ――！"
"13270-117-？？？" = "索敵完了。"
"13270-118-地下生活者" = "なっ……！？"
"13270-119-プラナ" = "ターゲット、分析開始。"
"13270-120-地下生活者" = "何者だ、貴様ァ！#nなぜ小生の領域に……！？"
"13270-121-プラナ" = "……所属ゲマトリア、個体名「地下生活者」。#n検索を継続します。"
"13270-122-地下生活者" = "ここは実在と非実在が確定していない領域。#nなのに、何故……！"
"13270-123-プラナ" = "……検索失敗。#nこの世には存在しない異質な存在です。"
"13270-124-地下生活者" = "ヒッ、ヒヒッ、神聖の器ですか。#nしかし、何かに汚染されていますね。"
"13270-125-地下生活者" = "いずれにせよ、[ruby=なんびと]何人[/ruby]にも小生の邪魔を許すつもりはありません。#n――消えてもらいましょう。"
"13270-126" = "この場所に勘付くとは……"
"13270-127-地下生活者" = "……まあ、構いません。#nここからは時間の勝負。"
"13270-128-プラナ" = "……発見しました。"
"13270-129-アロナ" = "プラナちゃん！？"
"13270-130" = "[s] \"プラナ！\""
"13270-131-プラナ" = "今まで感じていた視線の正体が分かりました。"
"13270-132-プラナ" = "あの者は「混沌の領域」に身を潜めています。"
"13270-133-アロナ" = "混沌の領域……。"
"13270-134-プラナ" = "実在と非実在が確定していない空間、#n「ナラム・シンの玉座」に適応していたおかげで、あの者の存在を感知できました。"
"13270-135-プラナ" = "正体はゲマトリア所属の「地下生活者」です。"
"13270-136" = "[s] \"地下生活者……！\""
"13270-137-アロナ" = "知っているのですか、プラナちゃん？"
"13270-138-プラナ" = "否定。あの者の目的も、計画も分かりません。"
"13270-139-プラナ" = "……しかし、能力はある程度把握できました。"
"13270-140-プラナ" = "混沌の領域から、こちらの世界に介入できるようです。"
"13270-141-アロナ" = "じゃあ、シャーレを爆破したのも……？"
"13270-142-プラナ" = "はい。ですが、おそらく私たちの存在はイレギュラーなのでしょう。"
"13270-143" = "[s] \"アロナとプラナがいたから……。\""
"13270-144-プラナ" = "……はい。"
"13270-145-プラナ" = "先生、地下生活者は先生に勝負を挑んでいるようです。"
"13270-146" = "[s] \"勝負……。\""
"13270-147-プラナ" = "油断してはいけません。"
"13270-148-プラナ" = "地下生活者は……。"
"13270-149-プラナ" = "[ruby=キヴォトス最高の神秘]小鳥遊ホシノさん[/ruby]を利用して、何か企んでいるのだと思います。"
"13270-150" = "[s] \"黒服と同じ目的だね。\""
"13270-151-プラナ" = "……あの能力が及ぶ対象は、アビドスだけに限りません。"
"13270-152-プラナ" = "アレは……。"
"13270-153-プラナ" = "……キヴォトス全域にまで問題が発展する可能性もあります。"
"13270-154-プラナ" = "先生、ホシノさんを止めてください。"
"13270-155" = "[s] \"任せて。\""
"13270-156" = "[ns] \"ホシノを止めないと……。\""
"13270-157-アヤネ" = "ですが、これ以上は……。"
"13270-158-シロコ" = "先輩は、"
"13270-159-シロコ" = "もう列車に乗って峡谷を離れたから……。"
"13270-160-ノノミ" = "私たちには……。"
"13270-161-セリカ" = "どうやって止められるのよ……。"
"13270-162" = "[s] \"ちょっと頼めそうな子に連絡してみるね。\""
"13270-163-シロコ" = "……？"
"13270-164-シロコ" = "でも、この問題は……。"
"13270-165" = "[s1] \"無関係な子じゃないから、大丈夫。\"\n[s2] \"あの子なら、きっとホシノを止められる。\""
"13270-166" = "[ns] \"助けてほしいんだ。\""
"13270-167-？？？" = "分かったわ。"
"13270-168" = "[s] \"ありがとう、状況なんだけど……。\""
"13270-169-？？？" = "大丈夫よ、全部知っているから。"
"13270-170-アヤネ" = "ホシノ先輩は今、列車で「セクター35-9」の分岐駅に戻っているはずです。"
"13270-171-ノノミ" = "そこで乗り換えをするのが、#n「大オアシス駅」に向かう唯一のルートですからね。"
"13270-172-アヤネ" = "ただ……あそこにはカイザーPMCが待ち受けている可能性が高いです。"
"13270-173-セリカ" = "こんなにずっと戦ってたら、いくら先輩でも……。"
"13270-174" = "……大丈夫だと思う。"
"13270-175-シロコ" = "さっきの先輩は、全力を出してない。"
"13270-176-セリカ" = "……なのに、止められなかったなんて。"
"13270-177" = "[s3] \"ホシノを追いかけよう。\"\n[s4] \"ホシノもスオウも止めるよ。\""
"13270-178-アヤネ" = "はい、先生。"
"13270-179-セリカ" = "……日が暮れ始めたわね。"
"13270-180-ノノミ" = "もう限界かもしれませんが……頑張りましょう。"
"13270-181-シロコ" = "……ん。"
"13270-182-ホシノ" = "カイザーはどこにいるんだろ？"
"13270-183-ホシノ" = "……静かすぎるね。"
"13270-184-ホシノ" = "そうだ。#nまずは管制室のレバーを操作して、列車を動かさないと。"
"13270-185-ホシノ" = "……。"
"13270-186-ホシノ" = "……誰？"
"13270-187-ヒナ" = "待ってたわ、小鳥遊ホシノ。"
"13270-188-ホシノ" = "あれ？"
"13270-189-ホシノ" = "えっと……たしかゲヘナの風紀委員長ちゃん、だよね？"
"13270-190-ホシノ" = "迷子なら、帰り道を教えてあげようか？"
"13270-191-ヒナ" = "あの列車砲を一人で破壊するのは無理よ。#nほかの方法を探して。"
"13270-192-ホシノ" = "へぇ……でも、おじさんはいつもこうやって解決してきたからさ。"
"13270-193-ホシノ" = "早く[ruby=ど]退[/ruby]いてもらっても良いかな？#n迷子の相手をしてる余裕はないんだよね。"
"13270-194-ヒナ" = "……そう。"
"13270-195-ヒナ" = "力尽くで止めるしかないようね。"
"13270-196-ホシノ" = "そっか。"
"13270-197-ホシノ" = "じゃあ、仕方ないね。"
"13270-198-ヒナ" = "……私の名前は[ruby=そらさき]、空崎ヒ[/ruby]ナよ。"
"13270-199" = "次回;激戦（１）"
