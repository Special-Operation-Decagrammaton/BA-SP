[translation]
"13330-1" = "第33話;顕現"
"13330-2-ホシノ" = "……。"
"13330-3" = "ゆめ、せんぱ……。"
"13330-4" = "[ns] \"いったい何が……！\""
"13330-5-アロナ" = "ホ、ホシノさんは……。"
"13330-6-プラナ" = "……存在が反転しました。 "
"13330-7-プラナ" = "もう、これでは……。"
"13330-8-アロナ" = "ほ、方法はないのでしょうか！？"
"13330-9" = "……肯定。ありません。"
"13330-10" = "[ns] \"……！？\""
"13330-11-アロナ" = "そ、そんな……！"
"13330-12-プラナ" = "死んでしまった人を、蘇らせるようなものです……。"
"13330-13" = "[ns] \"ホシノ……！\""
"13330-14-地下生活者" = "最初から、列車砲は餌に過ぎなかった。"
"13330-15-地下生活者" = "真のターゲットは、あのキヴォトス最高の神秘。"
"13330-16-地下生活者" = "六つ目の古則、「[ruby=ひう]非有[/ruby]の真実は真実であるか」――"
"13330-17-地下生活者" = "いつか我々は死ぬ。#nそれは、定められし運命。"
"13330-18-地下生活者" = "しかし、自分自身の死を人は認識できない。"
"13330-19-地下生活者" = "ただ、他人の死を認識するだけ。#nゆえに、我々は死に対して理解が及ばぬ！"
"13330-20-地下生活者" = "……だが、あの神秘からひとつの解を得た。"
"13330-21-地下生活者" = "我々は、「死」と並びうる概念を知っていたのだ。"
"13330-22" = "――「苦しみ」。"
"13330-23-地下生活者" = "[ruby=おの]己[/ruby]が苦しみは他人に理解できないように、#n他人の苦しみを真に理解することも、また不可能。"
"13330-24-地下生活者" = "……そう、これは苦しみによって反転した神秘。#n言わば、「恐怖」の顕現。"
"13330-25" = "神聖の頂点に立ち、最も古く、最も偉大な神々の原点――「ホルス」よ。 "
"13330-26-プラナ" = "……それでも、止めなければなりません。"
"13330-27-アロナ" = "えっ？ "
"13330-28-プラナ" = "今のホシノさんは、恐怖へと反転しホルスになりました。"
"13330-29-プラナ" = "このままでは、本質に導かれ、世界を崩壊させていくでしょう。"
"13330-30-アロナ" = "……！"
"13330-31" = "[ns] \"……！？\""
"13330-32-ホシノ" = "……ん、ぱい。"
"13330-33-ホシノ" = "ゆめ……せん、ぱい。"
"13330-34-アヤネ" = "……！"
"13330-35-シロコ" = "……ホシノ先輩。"
"13330-36" = "あ、アレがホシノ先輩なの……！？"
"13330-37-ノノミ" = "何が起きて……。"
"13330-38" = "[ns] \"ヒナ！\""
"13330-39-ヒナ" = "せん、せ……。 "
"13330-40" = "[s] \"ヒナ、大丈夫！？\""
"13330-41-ヒナ" = "止められ、なかっ……。"
"13330-42" = "[ns] \"……！\""
"13330-43-セリカ" = "先輩！"
"13330-44-ホシノ" = "て……ちょう……。 "
"13330-45-シロコ" = "ホシノ先輩、しっかりして！ "
"13330-46-アヤネ" = "きゃああっ！？"
"13330-47" = "[ns] \"ホシノ――！\""
"13330-48-ホシノ" = "……。"
"13330-49-アロナ" = "気をつけてください！#nあの攻撃は、私たちでも……！"
"13330-50-プラナ" = "先輩、手を！"
"13330-51" = "[ns] （ダメだ……）"
"13330-52" = "[ns] （私は何もできなかった……）"
"13330-53" = "[ns] （……何も）"
"13330-54" = "[ns1] （私には、死んだ人を蘇らせることも）\n[ns2] （過去を変えることも、できない）"
"13330-55" = "[ns] （プラナ……私は、どうすれば、良かったんだろう）"
"13330-56-地下生活者" = "オ、オオオオオ！ "
"13330-57-地下生活者" = "オオオオオオオオオ――！"
"13330-58-地下生活者" = "今度はあなたが！"
"13330-59-地下生活者" = "そうか、ホルスの神格に応じて！"
"13330-60-地下生活者" = "原初の神格ホルスの宿敵であり、#nこの世界の創造を巡り対立していた存在……。"
"13330-61-地下生活者" = "「セトの[ruby=ふんぬ]憤怒[/ruby]」よ！"
"13330-62-地下生活者" = "ルールを変える前のテクスチャーだが、良いだろう。"
"13330-63-地下生活者" = "「セトの憤怒」と「暁のホルス」の激突。#nこれこそ、まさに世界創造の戦い！"
"13330-64-地下生活者" = "早く、早く小生に見せてくれたまえ！#n語り継がれし神秘と恐怖の[ruby=ものがたり]神話[/ruby]を！"
"13330-65-地下生活者" = "[ruby=ひう]非有[/ruby]の真実は真実であるか――"
"13330-66-地下生活者" = "この不可解な問いに対して、あの神秘と恐怖は答えているのだ！"
"13330-67-地下生活者" = "真実は常に観測されてきたが、#nそれらすべてを自らは経験できない。"
"13330-68-地下生活者" = "それゆえ、我々が真実に至る日は来なかった。嗚呼ッ！そうだ！"
"13330-69-地下生活者" = "この世界は滅びる。"
"13330-70-地下生活者" = "他人の苦しみを理解できぬような存在は、#nもとより滅びゆく運命にあったのだ。"
"13330-71-地下生活者" = "黒服よ、代わりに小生が叶えてやったぞ。"
"13330-72-地下生活者" = "これこそが、貴様の見たかった光景――"
"13330-73-地下生活者" = "――世界の滅亡だ！"
"13330-74-プラナ" = "状況確認。#n[USERNAME]先生、このままでは世界が滅びてしまいます。"
"13330-75" = "[s] ホシノを止める手段はある？"
"13330-76-プラナ" = "回答。#n……ホシノさんのヘイローを破壊するしかありません。"
"13330-77-プラナ" = "[ns] それはダメだ。"
"13330-78-プラナ" = "いずれにせよ、ホルスとなったホシノさんを止めるには、#n対抗できるだけの力を持つ神聖がいなければ……。"
"13330-79" = "[s] ……神聖。"
"13330-80-プラナ" = "ですが、そんな存在はここに……。"
"13330-81-プラナ" = "……「恐怖」に匹敵する「恐怖」。"
"13330-82" = "[s] ダメだ、ホシノ……。"
"13330-83-プラナ" = "アロナ先輩。このままでは、先生が……。"
"13330-84-セリカ" = "ごほっ、ごほっ……シロコ先輩。"
"13330-85-アヤネ" = "逃げ、ましょう……。"
"13330-86-ノノミ" = "シロコちゃん……。"
"13330-87-ホシノ" = "ゆめ、せんぱい……。"
"13330-88-シロコ" = "……。"
"13330-89" = "私が弱いせいで、こうなった。"
"13330-90-シロコ" = "でも、分かった気がする。"
"13330-91-シロコ" = "今、ホシノ先輩を止められるのは私だけ。"
"13330-92-シロコ" = "アヤネも、セリカも、ノノミも、ホシノ先輩も……。"
"13330-93-シロコ" = "それに、先生も。絶対、助ける。"
"13330-94" = "そのために、私はここに存在してるから。"
"13330-95-アロナ" = "「色彩」が観測されました！"
"13330-96-アロナ" = "ど、どうして……このタイミングで！？ "
"13330-97-プラナ" = "せ、先生！"
"13330-98-プラナ" = "確認。意識を失ってしまいました。#n脈拍、不安定。"
"13330-99-プラナ" = "先生の命が危険です、アロナ先輩……！"
"13330-100-アロナ" = "……！"
"13330-101-シロコ" = "私が、止めないと……！"
"13330-102-シロコ" = "私が。"
"13330-103-柔らかい声" = "……あの～。"
"13330-104-柔らかい声" = "そろそろ起きないと……。"
"13330-105-柔らかい声" = "[USERNAME]先生？"
"13330-106" = "次回;謝罪"
