[translation]
"13035-1-ノゾミ" = "うわあっ！？#nこいつら、めちゃくちゃ強いじゃん！"
"13035-2-ノゾミ" = "損傷大きめー……。"
"13035-3-シロコ" = "しかも囲まれてるし……もしかしてこれ、納期間に合わない感じ？"
"13035-4-ヒカリ" = "詰みかなー？"
"13035-5-セリカ" = "何なのよ、こいつら……"
"13035-6-アヤネ" = "お願いです、説明してください……"
"13035-7-アヤネ" = "ハイランダー鉄道学園の皆さん。#nアビドス自治区で何をしていたんですか？"
"13035-8" = "大方、そちらも察しがついているのでは？"
"13035-9-ヒカリ" = "監督官！"
"13035-10-ヒカリ" = "ヘルプミー。"
"13035-11-アヤネ" = "……どなたですか？"
"13035-12-アヤネ" = "へぇ、助けに来たんだ？"
"13035-13-スオウ" = "……いや、そうではない。"
"13035-14-ヒカリ" = "嘘ぉ！？"
"13035-15-ヒカリ" = "裏切りー？"
"13035-16-スオウ" = "裏切りじゃない。#nだが、仲間だと思われても困るからな。"
"13035-17-スオウ" = "私の名は、[ruby=あさぎり]朝霧[/ruby]スオウ。#nハイランダー鉄道学園、理事会直属の管理監督官だ。"
"13035-18-アヤネ" = "管理監督官……？"
"13035-19-スオウ" = "お上の使い走りだと思ってくれて構わない。そこのバ……"
"13035-20-スオウ" = "双子[ruby=たちばな]は橘ヒ[/ruby]カリ[ruby=たちばな]と橘ノ[/ruby]ゾミ。#n二人とも[ruby=Central Control Center]中央管制センター[/ruby]の幹部だ。"
"13035-21-スオウ" = "私とあいつらは互いに監視、牽制し合う関係にある……#nそこだけ理解してもらえれば。"
"13035-22-ヒカリ" = "っていうか敵！工事の敵で納期の敵！"
"13035-23-ノゾミ" = "あとさっき、バカとか言いかけてなかったか！？"
"13035-24-ヒカリ" = "双子じゃなくてバカなんだけどー？#nあれー？"
"13035-25-スオウ" = "我々の学園では、いずれの組織も独立した権限を持っている。#n同じ学園だからといって、あんたたちと仲良しごっこをしてたまるか。"
"13035-26-スオウ" = "各組織が管理する路線――つまり、地域ごとに派閥があると思ってもらって構わない。"
"13035-27-スオウ" = "長々と話してしまったが、まずは謝罪が先だったな。"
"13035-28-スオウ" = "責任の所在は中央管制センター、つまりこのバカどもにあるとはいえ、#n監督官として謝罪する。迷惑をかけた。"
"13035-29-アヤネ" = "……。"
"13035-30-スオウ" = "だが、あんたたちもすでに知っているだろう？#n現在アビドス砂漠横断鉄道の開発権は、我々のもとにある、と。"
"13035-31-アヤネ" = "えっ！？"
"13035-32-통신 아야네" = "それは、ネフティスのはずでは？"
"13035-33-スオウ" = "ああ――認識が異なっているようだな。#nあらためて説明しよう。"
"13035-34-スオウ" = "前提として、ハイランダー鉄道学園が私企業と提携することはよくある。"
"13035-35-スオウ" = "そして今は、その相手がネフティスというだけ。#nあんたなら詳しいんじゃないか？#n――[ruby=いざよい]十六夜[/ruby]ノノミ。"
"13035-36-ノノミ" = "知り合い？"
"13035-37-ノノミ" = "い、いえ。#nですが……"
"13035-38-スオウ" = "とにかく、そのバカどもを解放してもらえないか。#n本件の詳細説明は後日、正式にアビドスで行なうことを約束する。"
"13035-39-アヤネ" = "そ、それは……"
"13035-40-ホシノ" = "……放してあげて。"
"13035-41-ノゾミ" = "助かったぁ！"
"13035-42-ヒカリ" = "ビビったー。"
"13035-43-スオウ" = "質問があれば当日までにまとめておいてほしい。"
"13035-44-スオウ" = "では、失礼する。"
"13035-45-セリカ" = "行っちゃった……"
"13035-46-ノノミ" = "……。"
"13035-47-シロコ" = "とりあえず、私たちも帰ろっか。#n向こうから説明に来てくれるって言ってたしさ。"
"13035-48" = "[ns] 対策委員会の部室に戻る。"
"13035-49" = "次回;流れ行くものたち"
