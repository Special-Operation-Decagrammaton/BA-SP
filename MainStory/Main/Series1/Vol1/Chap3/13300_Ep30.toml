[translation]
"13300-1" = "第30話;手帳の存在"
"13300-2-ホシノ" = "もう、何やってるんですか！"
"13300-3-ユメ" = "ほ、ホシノちゃん、ごめんね。#n私のせいで……。"
"13300-4-ホシノ" = "ごめんじゃありません！#nなんで毎回毎回騙されるんですか！？"
"13300-5-ユメ" = "そ、それは……。"
"13300-6-ホシノ" = "こんな体たらくで「夢と希望に満ちたアビドス」なんて、よく言えたものですね……。#nはぁ、もう一人で勝手にやってください！"
"13300-7-ユメ" = "ほ、ホシノちゃん……？"
"13300-8-ホシノ" = "もう付き合ってられません！#n生徒会は終わりです！"
"13300-9-ホシノ" = "先輩なんて知りません！"
"13300-10-ユメ" = "……。"
"13300-11-ホシノ" = "違うんです、先輩。#nあれは、本心じゃなくて……。"
"13300-12-ホシノ" = "勢いで、ちょっと強く言ってしまっただけなんです。"
"13300-13-ホシノ" = "すぐ戻るつもりだったのに……。"
"13300-14-ホシノ" = "まさか……あれが最後になるとは、思わなくって。"
"13300-15-ホシノ" = "ユメ先輩、戻りましたよ。"
"13300-16-ホシノ" = "次は気をつければ良いですから。"
"13300-17-ホシノ" = "それより……。"
"13300-18" = "……ユメ先輩？"
"13300-19" = "どこ行ってるんだろう、帰ってきてると思ったのに。"
"13300-20" = "こんなメモ、あったかな……？"
"13300-21" = "「いつもありがとう、ホシノちゃん！！お元気でね！」……？"
"13300-22" = "……ユメ先輩？"
"13300-23-ホシノ" = "ユメ先輩……。"
"13300-24-ホシノ" = "ユメ先輩！"
"13300-25-ホシノ" = "ユメ先輩！？"
"13300-26-ユメ" = "ごめんね、ホシノちゃん#n電波がうまく@#$%"
"13300-27-ユメ" = "砂漠にいたら@#&%砂嵐に遭って&#@"
"13300-28-ユメ" = "ホシノちゃん……ごめんね"
"13300-29-ユメ" = "またコンパスを忘れちゃった"
"13300-30-ユメ" = "メモも残したけど、ここでも送るね#n#n私の手帳は、あそこにあるから"
"13300-31-ユメ" = "ホシノちゃんもよく知っている@$^$%@#$#n目立つ場所に置いたから、すぐわかると思う"
"13300-32-ユメ" = "ホシノちゃん、私は"
"13300-33-ホシノ" = "ユメ先輩……。"
"13300-34-ホシノ" = "どうして砂漠に行ったんですか……？"
"13300-35-ホシノ" = "……「用事」ってなんですか？#n私がいない間に何があったんですか……？"
"13300-36-ホシノ" = "……手帳はどこにあるんですか？"
"13300-37-ホシノ" = "手帳には……何が書かれているんですか？"
"13300-38-ホシノ" = "……私は……手帳を見れないんですか……？"
"13300-39-ホシノ" = "もう付き合ってられません！#n生徒会は終わりです！"
"13300-40-ホシノ" = "私のせいですよね？"
"13300-41-ホシノ" = "あの言葉が先輩を傷つけた……先輩を追いやった……。"
"13300-42-ホシノ" = "「ホシノちゃん、私は」 。"
"13300-43-ホシノ" = "あのメッセージの続きはなんだったんですか？"
"13300-44-ホシノ" = "私には……分からなくて……。"
"13300-45-ホシノ" = "……ユメ先輩。"
"13300-46-ホシノ" = "どうして、どうして私は……。"
"13300-47-ホシノ" = "……。"
"13300-48-ホシノ" = "あれ……。"
"13300-49-ホシノ" = "……風紀委員長ちゃんは！？"
"13300-50-ホシノ" = "たしか、一緒に落ちたはず……。 "
"13300-51-ホシノ" = "まあ、今は他人の心配をしてる場合じゃないか。"
"13300-52-ホシノ" = "……大オアシス駅から、そう離れてないはず。"
"13300-53-ホシノ" = "ユメ先輩と一緒に来たから、覚えてる。"
"13300-54-ホシノ" = "もう少し進めば、かつてのオアシスがあって……。"
"13300-55-ホシノ" = "そこに、列車砲があるはず。"
"13300-56" = "早く、破壊するんだ。"
"13300-57-ホシノ" = "じゃないと……。"
"13300-58-ホシノ" = "私は――"
"13300-59-ホシノ" = "そろそろオアシスが……。"
"13300-60-ヒナ" = "そこまでよ、小鳥遊ホシノ。"
"13300-61-ホシノ" = "……！？"
"13300-62-ヒナ" = "……ぐっ。"
"13300-63-ヒナ" = "ごほっ、ごほっ……！"
"13300-64-ホシノ" = "ゆ、ユメ先輩……。"
"13300-65-ヒナ" = "……。 "
"13300-66-ヒナ" = "[ruby=くちなし]梔子[/ruby]ユメ……アビドスの生徒会長ね。"
"13300-67" = "次回;唯一の真実（１）"
