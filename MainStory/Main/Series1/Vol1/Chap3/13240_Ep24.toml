[translation]
"13240-1" = "第24話;列車砲シェマタ"
"13240-2-スオウ" = "くっ！"
"13240-3-スオウ" = "……ここまでだとは。"
"13240-4-ホシノ" = "さっさと[ruby=ど]退[/ruby]いてもらって良いかな、眼帯ちゃん。"
"13240-5-ホシノ" = "後輩たちが来る前に、破壊したいんだよね。"
"13240-6-スオウ" = "ああ、そうだろうな。"
"13240-7-スオウ" = "……だが、まだ私は負けてなどいない！"
"13240-8-ホシノ" = "……邪魔だよ。"
"13240-9-スオウ" = "行かせるものか！"
"13240-10-地下生活者" = "……攻略は、いよいよ最終段階です。"
"13240-11-地下生活者" = "攻略法1つ目、「既に起きた出来事は変えられない」。"
"13240-12-地下生活者" = "2つ目、「肉体には物理的な限界がある」。"
"13240-13-地下生活者" = "3つ目、「心は予測も制御もできない」。"
"13240-14-地下生活者" = "そして4つ目、「小さな傷が致命傷となる」。"
"13240-15-地下生活者" = "これは欲望と罪悪に苛まれる過程で、心理を追求するキャンペーン。"
"13240-16-地下生活者" = "この混沌が終わりを迎えたその時、#n私は「六つ目の古則」に到達することでしょう。"
"13240-17-地下生活者" = "……ん？"
"13240-18-地下生活者" = "何かが……。"
"13240-19-セリカ" = "着いたのね……？"
"13240-20-シロコ" = "ん、ここにホシノ先輩がいるはず。"
"13240-21" = "スオウさんも、列車砲も……。"
"13240-22-アヤネ" = "あちらです、急ぎましょう！"
"13240-23-アヤネ" = "……。"
"13240-24-セリカ" = "なんか、想像と違うんだけど……？"
"13240-25-アヤネ" = "数百年前のアビドス生徒会が建てた展示館……#nのようなところだと聞いていましたが。"
"13240-26-セリカ" = "機関砲に対空砲まであるじゃない。"
"13240-27" = "ゲヘナのマークがある。"
"13240-28-セリカ" = "ど、どうしてアビドス砂漠にゲヘナのマークが？"
"13240-29-ノノミ" = "……。"
"13240-30-シロコ" = "見て。"
"13240-31-セリカ" = "なっ。"
"13240-32-アヤネ" = "アレが……。"
"13240-33" = "[ns] \"アレが例の……。\""
"13240-34-ノノミ" = "列車砲……。"
"13240-35-セリカ" = "ま、待って。あんなに大きいとか聞いてないわよ。#n遠近感がおかしくなるんだけど！？"
"13240-36-アヤネ" = "……こ、こんなに大きいなんて。"
"13240-37-シロコ" = "ん……。"
"13240-38" = "[ns] \"なるほど、ゲヘナも……。\""
"13240-39-ノノミ" = "砂漠横断鉄道事業に入れ知恵した人物が、おそらくそうなのかと。"
"13240-40-アヤネ" = "でも、あの大きさは理解できません……。#nキヴォトスにこんな技術があるなんて……。"
"13240-41-セリカ" = "なら、どうやって作ったのかしら……。"
"13240-42-シロコ" = "……。"
"13240-43-アロナ" = "先生！"
"13240-44-アロナ" = "アレは現時点のキヴォトスに存在しない技術が使われています！"
"13240-45-アロナ" = "古代兵器、もしくはそれに並ぶ……！"
"13240-46-アロナ" = "まさか……！？"
"13240-47" = "[s] \"……ゲマトリアかもしれない。\""
"13240-48-アロナ" = "もう少し調べてみます！"
"13240-49-アロナ" = "うう……こういう時、プラナちゃんがいれば……。"
"13240-50" = "[s] \"プラナの調子はどう？\""
"13240-51-アロナ" = "まだ眠っています。#nなんだかすごく疲れているみたいで……。"
"13240-52-アロナ" = "ぷ、プラナちゃん！？"
"13240-53-アロナ" = "アロナ、先輩……先生。"
"13240-54-アロナ" = "プラナちゃん、大丈夫ですか？#nどこか痛みませんか！？"
"13240-55" = "[s] \"プラナ、大丈夫？\""
"13240-56-プラナ" = "……眠っている最中に、視線を感じました。"
"13240-57-アロナ" = "視線……？"
"13240-58-プラナ" = "……はい。#n今も私たちは、誰かに観測されています。"
"13240-59" = "[s] \"……。\""
"13240-60-アロナ" = "ええっ！？#nここには誰もいませんが……。"
"13240-61-アロナ" = "プラナちゃん……？"
"13240-62-プラナ" = "この視線は……。"
"13240-63-アロナ" = "プラナちゃん……！？"
"13240-64-アヤネ" = "これは……！？"
"13240-65-ノノミ" = "あっちです！"
"13240-66-シロコ" = "ホシノ先輩の銃声！"
"13240-67-セリカ" = "行くわよ！"
"13240-68-セリカ" = "先生も早く！"
"13240-69" = "[ns] \"……分かった！\""
