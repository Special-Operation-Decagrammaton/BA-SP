[translation]
"13190-1" = "第19話;債権者団体の総会"
"13190-2-PMC兵士A" = "プレジデント、列車砲の位置が判明しました。"
"13190-3-プレジデント" = "ほう。"
"13190-4-PMC兵士A" = "ここから約480km先の閉鎖地区です！"
"13190-5-プレジデント" = "……うむ。"
"13190-6-プレジデント" = "いつでも出られるように準備をしておけ。"
"13190-7-プレジデント" = "あのネフティスの令嬢も連れていく。"
"13190-8-スオウ" = "了解。"
"13190-9-プレジデント" = "正確な位置まで割り出せ。#n移動手段も用意しろ。"
"13190-10-PMC兵士A" = "はっ！"
"13190-11-プレジデント" = "よく来てくれた、ネフティスのご令嬢。"
"13190-12-ノノミ" = "……プレジデント。"
"13190-13-ノノミ" = "執事さん……ネフティスはカイザーと手を組んでいたのですね。"
"13190-14-プレジデント" = "ハッハッハ、理解が早い。"
"13190-15-プレジデント" = "さすがは大企業の後継者と言ったところか。"
"13190-16-ノノミ" = "どうしてそんな……！"
"13190-17-ネフティス幹部" = "全部、アビドスのためだったんです！"
"13190-18-ネフティス幹部" = "列車砲を手に入れさえすれば、あの絶対的な力があれば！#nかつての栄光を取り戻せると……！"
"13190-19-ノノミ" = "そんなわけ、ないじゃないですか！"
"13190-20-ノノミ" = "こんなに多くの人を巻き込んで……。"
"13190-21-ノノミ" = "混乱を起こすだなんて……！"
"13190-22-ネフティス幹部" = "それは……。"
"13190-23-ノノミ" = "ホシノ先輩の言う通りでした。#n目的のために手段を選ばなくなってしまえば、自分たちを見失ってしまう……。"
"13190-24-スオウ" = "アビドスこそ、以前は手段を選んでいなかっただろう。"
"13190-25-ノノミ" = "……！？"
"13190-26-スオウ" = "あのトリニティでさえ、#n昔は敵の爪を剥いでいたと言われているくらいだ。"
"13190-27-スオウ" = "圧倒的な力を持っていたアビドスが、#n似たようなことをしていてもおかしくない。"
"13190-28-ノノミ" = "それは……。"
"13190-29-PMC兵士B" = "プレジデント、侵入者です！"
"13190-30-プレジデント" = "シャーレか？"
"13190-31-PMC兵士B" = "い、いえ！#n侵入者は[ruby=たかなし]小鳥遊[/ruby]ホシノ単独です！"
"13190-32-ノノミ" = "ホシノ先輩……！？"
"13190-33" = "AM 11:30"
"13190-34-プレジデント" = "時間は……。"
"13190-35-プレジデント" = "やれやれ、まだ30分もあるじゃないか。#nしかし、ジェネラルですら相手にならないとはな。"
"13190-36-ノノミ" = "どうして先輩だけ……？"
"13190-37-スオウ" = "対策委員会とシャーレの先生は、小鳥遊ホシノと別で動いている。"
"13190-38-スオウ" = "理由までは知らないがな。"
"13190-39-ノノミ" = "みんな……。"
"13190-40-PMC兵士B" = "こ、これ以上持ちこたえるのは厳しいかと！"
"13190-41-プレジデント" = "まったく、これではカイザーの名折れだ。"
"13190-42-PMC兵士B" = "ご、ご指示を！"
"13190-43-プレジデント" = "列車砲は見つかったか？"
"13190-44-PMC兵士A" = "もう少しお待ちください！"
"13190-45-PMC兵士B" = "移動手段の用意は？"
"13190-46-PMC兵士B" = "20分後には、屋上にヘリが到着します！"
"13190-47-プレジデント" = "……そうか。#n仕方ない、それまで相手をしてやろう。"
"13190-48-PMC兵士A" = "座標を特定しました！"
"13190-49-プレジデント" = "……アビドス砂漠閉鎖地区セクター35-9？#nここに列車砲が隠されているのか。"
"13190-50" = "AM 11:45"
"13190-51-ホシノ" = "はぁっ、はぁ……。"
"13190-52-ノノミ" = "ホシノ先輩……！"
"13190-53-ホシノ" = "（セクター35-9？）"
"13190-54-ホシノ" = "遅くなってごめんね、ノノミちゃん。#n怪我してない？"
"13190-55-ノノミ" = "はい、私は大丈夫です……。"
"13190-56-ホシノ" = "……カイザーコーポレーション。"
"13190-57-プレジデント" = "こうして会うのは初めてか、小鳥遊ホシノ君。#n私はプレジデントだ。"
"13190-58-プレジデント" = "噂はよく聞いているとも。#nあの黒服が目を付けていたようだな。"
"13190-59-ホシノ" = "……それより、総会は始まってないよね？"
"13190-60-プレジデント" = "もちろんだ。#n私募ファンドの代表は、私に変わったがね。"
"13190-61-プレジデント" = "安心してくれ、君には発言権を与えよう。"
"13190-62-ホシノ" = "……。"
"13190-63-プレジデント" = "では、総会の開始を宣言しようか。"
"13190-64-プレジデント" = "これより、債権者団体の総会を始める。"
"13190-65-プレジデント" = "さっそくだが、何か言いたいことはあるかね。"
"13190-66-ホシノ" = "「アビドス生徒会」の正当性を否定すれば、"
"13190-67-ホシノ" = "ノノミちゃんを解放してくれるんだよね？"
"13190-68-ホシノ" = "……プレジデント。"
"13190-69-プレジデント" = "答えはノーだ。#nもし正当性がなかったとしたら、列車砲の所有権はネフティスに渡ってしまう。"
"13190-70-プレジデント" = "それは我々にとって困るのだよ。"
"13190-71-ホシノ" = "……。"
"13190-72-プレジデント" = "[ruby=いざよい]十六夜[/ruby]ノノミを無事に返してほしいのならば、#n「契約の解除」を申し出ると良い。"
"13190-73-プレジデント" = "そうすれば、列車砲の所有権は私の物になる。"
"13190-74-ホシノ" = "……。"
"13190-75-PMC兵士A" = "ダメです、ホシノ先輩！#nネフティスにも、カイザーにも列車砲を渡してはいけません！"
"13190-76-PMC兵士A" = "ユメ会長と過ごした時間を否定しないでください……！"
"13190-77-プレジデント" = "……と彼女は言っているが、どうするかね？"
"13190-78-ネフティス幹部" = "いけません！"
"13190-79-ネフティス幹部" = "カイザーの手に渡るくらいなら、ネフティスが所有するべきです！"
"13190-80-ネフティス幹部" = "どうか賢明なご判断を！#nアビドスの未来のためにも！"
"13190-81-ノノミ" = "執事さん……！"
"13190-82-ネフティス幹部" = "お嬢様、転校の件をお忘れですか？"
"13190-83-ネフティス幹部" = "まだ今からでも可能で――"
"13190-84-ノノミ" = "――私はアビドスを退学します！"
"13190-85-ノノミ" = "これで、もう人質としての価値はありません！"
"13190-86-ノノミ" = "だから先輩、私のために自分を犠牲にしないでください！"
"13190-87-ホシノ" = "心配しないで。#nノノミちゃんが学校を辞める必要なんてない。"
"13190-88-ノノミ" = "え……？"
"13190-89-ホシノ" = "もちろん、[ruby=・   ・   ・   ・]そのまま[/ruby]列車砲を渡すつもりもないから。"
"13190-90-ノノミ" = "ま、まさか……。"
"13190-91-ホシノ" = "プレジデント。"
"13190-92-ホシノ" = "契約の当事者として、アビドス生徒会は非認可の組織だったことを認めるよ。"
"13190-93-プレジデント" = "……！"
"13190-94-ノノミ" = "……！"
"13190-95-ホシノ" = "これで、砂漠横断鉄道に関する契約書の効力は――"
"13190-96-？？？" = "待ってください！！"
"13190-97" = "AM 11:57"
"13190-98" = "[ns] \"その発言は無効だよ！\""
"13190-99-ノノミ" = "み、みんな……！"
"13190-100-アヤネ" = "今のホシノ先輩に、アビドス生徒会としての権限はありません！"
"13190-101-ホシノ" = "う、うぇ……！？"
"13190-102-アヤネ" = "なぜなら、私がアビドス生徒会の会長になったからです！"
"13190-103-ホシノ" = "あ、アヤネちゃんが生徒会長に！？"
"13190-104" = "[ns1] \"うん、今はアヤネが生徒会長だよ。\"\n[ns2] \"投票で選ばれたんだ。\""
"13190-105" = "[ns] \"私が証人になってる。\""
"13190-106-ホシノ" = "ど、どういうこと……？"
"13190-107-シロコ" = "ん、みんなで決めた。"
"13190-108-セリカ" = "一人で解決しようとか思わないで！"
"13190-109-ホシノ" = "……。"
"13190-110-アヤネ" = "それと、先輩は副生徒会長から書記に降格しました！"
"13190-111-アヤネ" = "ただの書記が、こんなトラブルを起こすだなんて……！"
"13190-112-セリカ" = "（ついさっきまで、自分が書記だったのに……）"
"13190-113-ホシノ" = "ホシノ先輩にも説明をします！"
"13190-114-アヤネ" = "先生のもと承認された私たち「対策委員会」は、#n「アビドス生徒会」と合併しました！"
"13190-115-ホシノ" = "……。"
"13190-116-ノノミ" = "アヤネちゃん……。"
"13190-117-アヤネ" = "そのため、現在の契約当事者は「対策委員会」になります！"
"13190-118" = "[ns] \"それとノノミ……。\""
"13190-119" = "[ns] \"委員会を辞めるなら私の許可が必要だよ。\""
"13190-120-ノノミ" = "先生……。"
"13190-121" = "PM 12:00"
"13190-122-プレジデント" = "なるほど、こう来たか。"
"13190-123-プレジデント" = "シャーレを相手にすること自体、間違っていたのかもしれんな。"
"13190-124-プレジデント" = "まあ、構わない。#n時間稼ぎは済んだ。"
"13190-125-プレジデント" = "総会は終わりとする。"
"13190-126" = "[ns] \"なっ……！\""
"13190-127-プレジデント" = "そもそも、誰が君に発言を認めた？"
"13190-128-アヤネ" = "そ、そんなっ……！"
"13190-129-ホシノ" = "……！"
"13190-130-プレジデント" = "所詮、君たちの頑張りなど無駄だったのさ。"
"13190-131-プレジデント" = "この売買契約書は、効力を失ったものとして破棄する。"
"13190-132-プレジデント" = "列車砲は最初からカイザーの所有物だった。#nそうだろう？"
"13190-133-プレジデント" = "異論は一切認めない。"
"13190-134-アヤネ" = "そんな横暴が許されると思っているんですか！？"
"13190-135-PMC兵士" = "……プレジデント、間もなくヘリが到着します。"
"13190-136-プレジデント" = "ここにいる者どもを処理しておけ。#n良いか、一人残らず全員だ。"
"13190-137-プレジデント" = "ただし、ネフティスのご令嬢……君には来てもらう。"
"13190-138-ホシノ" = "待てっ！"
"13190-139-シロコ" = "ホシノ先輩！ノノミ！"
"13190-140-セリカ" = "シロコ先輩、孤立すると囲まれるよ！"
"13190-141-アヤネ" = "先生、このままではノノミ先輩が……！"
"13190-142-アヤネ" = "……どうか指揮を！"
