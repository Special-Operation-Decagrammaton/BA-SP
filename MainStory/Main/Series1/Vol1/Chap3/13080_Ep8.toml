[translation]
"13080-1" = "第8話;アビドス生徒会（１）"
"13080-2" = "[ns1] 集めた資料を整理する。\n[ns2] \"……これで準備は完了かな。\""
"13080-3-プラナ" = "待機中。#n先生、必要なものはありませんか？"
"13080-4" = "[s] \"ありがとう、プラナ。アロナは？\""
"13080-5-プラナ" = "アロナ先輩なら、寝ています。寝坊助です。#n何か仕事があれば、私に命令をしてください。"
"13080-6" = "[s3] \"それじゃあ……。\"\n[s4] プラナにいくつか頼み事をする。"
"13080-7-プラナ" = "理解。#nすぐに処理します。"
"13080-8-プラナ" = "それより、先生は少しでも寝るべきです。#n徹夜は健康に良くありません。"
"13080-9" = "[s] \"でも、そろそろ出発しないといけないんだ。\""
"13080-10-プラナ" = "分かりました。#nでは、また何かあったら連絡をします。"
"13080-11-プラナ" = "異常発生。"
"13080-12" = "[ns] \"プラナ、どうしたの？\""
"13080-13-地下生活者" = "……。"
"13080-14-地下生活者" = "なぜだ？"
"13080-15-地下生活者" = "小生の計算が間違っていたのか……？"
"13080-16" = "[ns] \"な、何が起きたの！？\""
"13080-17" = "[ns] \"この衝撃は！？\" "
"13080-18-アロナ" = "先生、先生！"
"13080-19" = "[s] \"アロナ、状況を教えてくれる？\""
"13080-20-アロナ" = "シャーレが爆発しました！"
"13080-21-アロナ" = "ですが、それよりもプラナちゃんが……！"
"13080-22-プラナ" = "先生の保護は、"
"13080-23-プラナ" = "間に合いました……。"
"13080-24-アロナ" = "ぷ、プラナちゃん！？"
"13080-25-プラナ" = "先生が傷付く姿は、もう二度と……。"
"13080-26" = "[s] \"プラナ、大丈夫！？\""
"13080-27-アロナ" = "気を失っているだけみたいです！"
"13080-28" = "[ns] \"……！\""
"13080-29" = "[ns] （意識が……） "
"13080-30-地下生活者" = "……なるほど。 "
"13080-31-地下生活者" = "私の計算以上ですね。"
"13080-32-地下生活者" = "あの不可解な奇跡を起こす[ruby=ARK]聖櫃[/ruby]は、#nジェリコの城壁でさえ崩した兵器だというのに、過小評価していました。"
"13080-33-地下生活者" = "……ですが、構いません。#n攻略法を修正すれば良いだけのこと。"
"13080-34-地下生活者" = "攻略法、その2……「肉体には物理的限界がある」。#nこの前提条件は、崩れていないのですから。"
"13080-35-地下生活者" = "最も重要な物語は、先生が関与できない場所で進行されています。#n目を覚ました頃には、すでに手遅れ。"
"13080-36-地下生活者" = "では、ゲームを続けましょう。"
"13080-37-アヤネ" = "……先生に連絡がつきません。"
"13080-38-シロコ" = "うーん。"
"13080-39-ノノミ" = "何かあったのでしょうか？"
"13080-40-セリカ" = "寝てるんじゃないの？"
"13080-41-アヤネ" = "今日に限って、それはないと思うけど……。"
"13080-42-シロコ" = "ホシノ先輩は？"
"13080-43-アヤネ" = "それが、先輩も音沙汰がありません。"
"13080-44-セリカ" = "まったく、何してるのよ。"
"13080-45-ノノミ" = "……。"
"13080-46-ホシノ" = "……もう朝か。 "
"13080-47-ホシノ" = "そろそろ戻らないと。#n先生もシロコちゃんも……みんな、待ってるはずだし。"
"13080-48-ホシノ" = "最近のシロコちゃんは、どんどん強くなってきて大変だよ。#nあっという間に、勝てなくなっちゃうのかな。"
"13080-49-ホシノ" = "はぁ、おじさんも歳には勝てないねぇ。"
"13080-50-ホシノ" = "ここは変わらないなぁ。"
"13080-51-ホシノ" = "まあ、もう捨てられた街だし、それもそっか。"
"13080-52-ホシノ" = "お願いします！どうか署名を！"
"13080-53-ユメ" = "アビドスの環境を改善するために、署名を集めています！"
"13080-54-ユメ" = "皆さんの協力が必要なんです！"
"13080-55-アビドス市民A" = "……チッ。"
"13080-56-アビドス市民C" = "今さら何かしたところで……。"
"13080-57-アビドス市民C" = "あ、あの、すみません。#nよければ、こちらに署名を……。"
"13080-58-アビドス市民C" = "いよいよネフティスまで自治区を去るっていうのに、#n署名が何の役に立つんだよ！"
"13080-59-ユメ" = "あっ！ちょ、ちょっと待って！"
"13080-60-ユメ" = "えへへ……最近入学してくれた子だよね？#nえっと、たしか名前は……。"
"13080-61-ユメ" = "……ホシノちゃん、だよね！#nあれ、違った？"
"13080-62-ユメ" = "ま、待って、ホシノちゃん！"
"13080-63-ホシノ" = "はあ……。 "
"13080-64-ユメ" = "アビドス治安維持強化方針の説明会を開催します！#n皆さん、どうかご参加ください！"
"13080-65-ユメ" = "説明会のプリントです！#n目を通していただくだけでも……。"
"13080-66-ホシノ" = "……あっ、ホシノちゃん！"
"13080-67-ユメ" = "待って！"
"13080-68-ユメ" = "……ひんっ！？"
"13080-69-ホシノ" = "……はぁ。"
"13080-70-ユメ" = "あ、ありがとう。"
"13080-71-ユメ" = "わっ、握手しちゃった……。"
"13080-72-ホシノ" = "どうして私を知ってるんですか？"
"13080-73-ユメ" = "もちろん！すっごく強い新入生がいるって、噂になってるよ？#n……あと、ちょっぴりイジワルだとか何とか。"
"13080-74-ユメ" = "って、私が一人で言ってるだけなんだけど……。"
"13080-75-ユメ" = "この前、暴力集団の喧嘩を止めたのって、ホシノちゃんだよね？"
"13080-76-ユメ" = "アビドスのために、ありがとう。#n生徒会長として、お礼がしたかったの。"
"13080-77-ホシノ" = "……さっさと帰ったほうが良いですよ[ruby=くちなし]、梔子ユ[/ruby]メ会長。#n暗くなったら、ここは危険なので。"
"13080-78-ユメ" = "でも、まだやることが……。"
"13080-79-ユメ" = "……あれ？ "
"13080-80-ユメ" = "私、ホシノちゃんに名前教えたっけ……？"
"13080-81-ユメ" = "もうこんな時間になっちゃった。"
"13080-82-ユメ" = "署名は全然集まってないし、プリントはこんなに余ってるし……。"
"13080-83-ユメ" = "今週中に署名を集めないといけないのに。"
"13080-84-ユメ" = "……そうだ、早く帰るようホシノちゃんに言われたんだった。"
"13080-85-チンピラ2" = "なんだコイツ？"
"13080-86-ユメ" = "ひゃうっ。"
"13080-87-チンピラ2" = "説明会、だぁ？#nお前、もしかしてアビドスの生徒だな？"
"13080-88-チンピラ1" = "おい、分かってんのか？#nお前たちが金を払わないせいで、上からとばっちりを受けたんだぞ！"
"13080-89-ユメ" = "わ、私は、その……。"
"13080-90-チンピラ2" = "どうやって責任取るつもりだよ！#nあぁん！？"
"13080-91-ユメ" = "しょ、署名用紙が……。"
"13080-92-チンピラ2" = "んだよ、この邪魔なゴミは。"
"13080-93-ユメ" = "や、やめてくださいっ！"
"13080-94-チンピラ2" = "知るかよ！"
"13080-95-チンピラ2" = "あーあ、気分わりーな。#nちょっとツラ貸せや。"
"13080-96-ユメ" = "ほ、ホシノちゃん……？"
"13080-97-ホシノ" = "だから言ったじゃないですか！#n早く帰ってください、って！"
"13080-98-ホシノ" = "なんで帰らなかったんですか？#nバカなんですか！？"
"13080-99-ユメ" = "ご、ごめんなさい……。"
"13080-100-ホシノ" = "今のアビドスは無法地帯なんですよ！？"
"13080-101-ユメ" = "……。"
"13080-102-チンピラ2" = "お、ウチらに逆らうつもりか？"
"13080-103-チンピラ2" = "その顔、覚えたからな！"
"13080-104-ホシノ" = "はあ……。"
"13080-105-ホシノ" = "……怪我してませんか、梔子ユメ会長。"
"13080-106-ユメ" = "う、うん……ありがとう、ホシノちゃん。"
"13080-107-ホシノ" = "どうして戦わなかったんですか？"
"13080-108-ユメ" = "戦って問題を解決しても、それは次の争いの火種になるだけ……。"
"13080-109-ユメ" = "それに、何でも武力で解決するようになったら、#nいつか自分を見失っちゃうと思うの……。"
"13080-110-ホシノ" = "……何を言ってるのか分かりません。"
"13080-111-ホシノ" = "じゃあ、どうやって解決するんですか？"
"13080-112-ユメ" = "……。"
"13080-113-ホシノ" = "……早く帰ってください。#nあいつらが仲間を連れてくるかもしれないですから。"
"13080-114-ユメ" = "ま、待って、ホシノちゃん！"
"13080-115-ユメ" = "住民の皆さん、"
"13080-116-ユメ" = "署名をお願いします！"
"13080-117-ホシノ" = "……。"
"13080-118-ユメ" = "み、皆さんの力が必要なんです……！"
"13080-119-ユメ" = "……あれ。#nホシノちゃん、今日はどうしたの？"
"13080-120-ホシノ" = "昨日の奴らが、仕返しに来るかもしれないと思ったので。"
"13080-121-ユメ" = "私を守るために来てくれたの？"
"13080-122-ホシノ" = "いえ、会長に釣られたところをまとめて倒したほうが楽かなと。"
"13080-123-ユメ" = "餌ってこと！？"
"13080-124-ホシノ" = "……アビドス生徒会を狙う人たちは多いですから。"
"13080-125-ユメ" = "そっかそっか～。"
"13080-126-ユメ" = "ホシノちゃんは素直じゃないんだね！#n実は、心配してくれてるんでしょう？"
"13080-127-ホシノ" = "だ、誰が心配なんか……！"
"13080-128-ユメ" = "ホシノちゃん、いつも顔をしかめてるけど……。"
"13080-129-ユメ" = "こんなに可愛いんだから、もったいないよ？"
"13080-130-ホシノ" = "な、なに言ってるんですか！#n余計なこと言うなら、もう知りませんよ！"
"13080-131-ユメ" = "ふふっ……ありがとう。ホシノちゃん。 "
"13080-132-ユメ" = "こんなに頼もしい後輩が力になってくれるなんて、心強いよ……！"
"13080-133-ホシノ" = "良いから集中してください。"
"13080-134-ホシノ" = "それと、生徒会の仕事を手伝うのは、これが最初で最後です。"
"13080-135-ユメ" = "ふふっ、ありがとう。#nでも、梔子ユメ会長じゃなくてユメ先輩って呼んでくれたら、#nも～っと嬉しいかも、みたいな……。"
"13080-136-ホシノ" = "……私の話、聞いてましたか？"
"13080-137" = "次回;アビドス生徒会（２）"
