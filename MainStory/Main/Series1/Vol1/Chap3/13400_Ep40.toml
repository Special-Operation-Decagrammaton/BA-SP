[translation]
"13400-1" = "第40話;夢が残した足跡"
"13400-2-ノノミ" = "雷が……。"
"13400-3-シロコ" = "オアシス全体に……。"
"13400-4-ホシノ" = "ヒナちゃん、立てる？"
"13400-5-ホシノ" = "……ええ、大丈夫。"
"13400-6-アヤネ" = "これは……。"
"13400-7-ノノミ" = "……花火？"
"13400-8-ヒナ" = "雷に反応したのかな……。"
"13400-9-アヤネ" = "……これは。"
"13400-10-セリカ" = "アレ、魚の形してない？"
"13400-11-ノノミ" = "きれい……まるで海みたいです！"
"13400-12-ホシノ" = "……。"
"13400-13-ヒナ" = "もしかして……#n何らかの刺激が加わると、プラズマを発生する鉱物じゃないかしら。"
"13400-14-ヒナ" = "でも、超高価で希少な金属のはず。"
"13400-15-ホシノ" = "……。"
"13400-16-シロコ" = "（超高価……？）"
"13400-17-シロコ" = "……日が昇る。"
"13400-18-ホシノ" = "……先輩の言う通りでした。"
"13400-19-ホシノ" = "見つけましたよ、お宝。"
"13400-20-ホシノ" = "まさか、本当に見つけられるとは思いませんでしたけど。"
"13400-21-ホシノ" = "私が間違ってました……。"
"13400-22-ホシノ" = "……先輩。"
"13400-23-セリカ" = "う、うわっ！#nさっきより勢いが！"
"13400-24-ヒナ" = "……なるほど、100g1000万円の価値を持ってるだけあるわ。"
"13400-25-セリカ" = "へ！？"
"13400-26-シロコ" = "え？"
"13400-27-ヒナ" = "ここ二年くらいの間に、十倍くらい相場が上がったのよ。"
"13400-28-セリカ" = "ちょ、ちょっと、この連鎖どうにかして止めないと！#nダメ、お金がっ！"
"13400-29-セリカ" = "少しでも確保するわよ！#nアヤネちゃん、スコップは！？"
"13400-30-アヤネ" = "いきなり言われても……。"
"13400-31-セリカ" = "もう、ちゃんと持ってきておかないから！"
"13400-32-シロコ" = "いや、たぶんツルハシじゃないと――"
"13400-33-シロコ" = "この爆発を止める方法は？"
"13400-34-ヒナ" = "……無理じゃないかしら。#n連鎖反応は、一帯の鉱物が燃え尽きるまで続く。"
"13400-35-ノノミ" = "わあ！#n幻想的ですね～☆"
"13400-36-シロコ" = "シロコ、私があげた覆面を袋にしないで。"
"13400-37-シロコ" = "でも……。"
"13400-38-セリカ" = "シロコ先輩、呼び方が一緒だと混乱するんだけど、何とかならない？"
"13400-39-シロコ" = "じゃあ、私は「ちびシロコ」って呼ぶよ。"
"13400-40-シロコ" = "ん、すぐに大きくなる。"
"13400-41-シロコ" = "なら、「よわシロコ」。"
"13400-42-セリカ" = "ちょっと、危ないでしょ！"
"13400-43-シロコ" = "無駄だよ。私はあなたにはない事を経験し、知らないことを知っている。この差は――"
"13400-44-シロコ" = "ん、今度こそ負けない。"
"13400-45-アヤネ" = "もう、落ち着いてください！"
"13400-46-ノノミ" = "わあ～、そろそろフィナーレですかね？"
"13400-47-ホシノ" = "うーん……。"
"13400-48-ホシノ" = "……まぁ、いっか。"
"13400-49-ホシノ" = "おじさんがカッコつけようとすると、いつもこんな感じだよね～。"
"13400-50-ホシノ" = "……うへ～。"
"13400-51" = "次回;残されたもの"
