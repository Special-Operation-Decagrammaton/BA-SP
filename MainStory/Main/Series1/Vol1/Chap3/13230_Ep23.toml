[translation]
"13230-1" = "第23話;生徒会の谷"
"13230-2-ホシノ" = "……列車砲シェマタ。"
"13230-3-ホシノ" = "でも、どうして……。"
"13230-4-ホシノ" = "ゲヘナのエンブレムが？"
"13230-5-ホシノ" = "それに、"
"13230-6-ホシノ" = "これじゃあまるで……。"
"13230-7-スオウ" = "軍事要塞のようだ、とでも言いたいのか？"
"13230-8-ホシノ" = "……眼帯ちゃん。"
"13230-9-スオウ" = "（眼帯ちゃん……？）"
"13230-10-スオウ" = "当初はこんな様相ではなかったが……#n以前、大きく作り替えられてな。"
"13230-11-ネフティス幹部" = "お嬢様、それは違います。#nあくまでも非対称戦力兵器計画は、#n鉄道事業が動き出してから話に出たものです。"
"13230-12-ネフティス幹部" = "おそらく、アビドス生徒会に入れ知恵をした者がいたのでしょう。"
"13230-13-ノノミ" = "誰がそのようなことを……！"
"13230-14-スオウ" = "アビドス生徒会もネフティスも、あいつに踊らされただけだ。"
"13230-15-ホシノ" = "……黒幕がいるの？"
"13230-16-スオウ" = "いや、黒幕ではない。#n今は卒業して、キヴォトスを離れているからな。"
"13230-17-ホシノ" = "……卒業？"
"13230-18-スオウ" = "ああ。二年前、キヴォトスを混沌に陥れたゲヘナの暴君「雷帝」だ。"
"13230-19-ホシノ" = "……雷帝？"
"13230-20-スオウ" = "天才戦略家でもあり発明家でもあると同時に、政治家でもあった。#n連邦生徒会長が準備していたエデン条約も、#n実は雷帝のために用意した奇策だったとか。"
"13230-21-ホシノ" = "私は聞いたことないけど。"
"13230-22-スオウ" = "……そうか、まあ良い。"
"13230-23-スオウ" = "何はともあれ、単なる鉄道事業のはずが、#n雷帝の手によって紛争の種になった。"
"13230-24-ホシノ" = "それで、その雷帝って人はどうしてそんなことを？"
"13230-25-スオウ" = "……分からない。"
"13230-26-スオウ" = "雷帝が何を考えているのかなど、知る由もない。"
"13230-27-スオウ" = "天才の考えをいくら探ろうとしたところで無駄だ。"
"13230-28-スオウ" = "アビドスに接近したのも、ただの気まぐれだったかもしれないからな。"
"13230-29-スオウ" = "事実、雷帝は列車砲の一件が中断されてから、#nアビドスと関わりすらしなかったらしい。"
"13230-30-ホシノ" = "……。"
"13230-31-スオウ" = "結局、部下たちのせいですぐに失脚し、鉄拳政治は幕を閉じた。#nだが、彼女が残した発明品は、今もキヴォトスに残っている。"
"13230-32-スオウ" = "そのどれもが、キヴォトスを一瞬で危険に陥れるレベルの物。#n……列車砲のようにな。"
"13230-33-ホシノ" = "眼帯ちゃん、もう良いかな？#nおじさん、昔話に付き合ってる暇はないんだ。"
"13230-34-スオウ" = "（おじさん……？）"
"13230-35-ホシノ" = "それで、ここに呼んだ理由は？#nその雷帝って人は、ユメ先輩と関係があるの？"
"13230-36-スオウ" = "……いいや、まったく。"
"13230-37-ホシノ" = "じゃあ、契約と関係してるとか？"
"13230-38-スオウ" = "……。"
"13230-39-ホシノ" = "眼帯ちゃんが実はゲヘナの生徒で、#n雷帝の発明品を回収したかったとか？"
"13230-40-ホシノ" = "君は何者なの？#n何が狙い？"
"13230-41-スオウ" = "……。"
"13230-42-ホシノ" = "はぁ……まぁいっか。"
"13230-43-ホシノ" = "これから私は、列車砲を破壊する。#n雷帝だとかゲヘナだとか、そんなのはどうだって良い。"
"13230-44-ホシノ" = "あれはユメ先輩の意志を真っ向から否定する物。#nだから、放っておくわけにはいかない。"
"13230-45-ホシノ" = "絶対……そう、絶対に。"
"13230-46-スオウ" = "……好きにしたら良い。"
"13230-47-スオウ" = "だが、そのためにはまず私からカードを奪わなくてはな。"
"13230-48-ホシノ" = "ノノミちゃんのゴールドカード……？"
"13230-49-スオウ" = "列車砲を起動するには、このカードが必要だ。#nもちろん、破壊するためにも。"
"13230-50-スオウ" = "先ほどの質問に答えていなかったな。#n私の真の目的は、[ruby=たかなし]小鳥遊[/ruby]ホシノ――あんただ。"
"13230-51-スオウ" = "列車を破壊したいのなら、私を倒してカードを奪うが良い。"
"13230-52-ホシノ" = "……それで、何者なの？"
"13230-53-スオウ" = "ああ、私もそれを知りたかったんだ。"
"13230-54-スオウ" = "学校に所属しない流れ者、カイザーの傭兵、ネフティスの使い走り、#nハイランダーの異邦人……そして、私募ファンドの二重スパイ。"
"13230-55-スオウ" = "回り道をしてここにたどり着いた意味が、ようやく分かった。"
"13230-56-スオウ" = "あんたと戦うためだったんだ。"
"13230-57-スオウ" = "アビドスの恐怖と狂気を否定するために、私はここにいる。"
"13230-58-スオウ" = "何がそこまであんたを本気にさせる？#n私は、その理由が知りたい。"
"13230-59-スオウ" = "……そうだな。#nもし私を倒せたら、あの手帳の在り処を教えてやろう。"
"13230-60-ホシノ" = "……痛い目に遭わないと分からないみたいだね。"
"13230-61-ホシノ" = "ふっ、良い顔になったな。"
"13230-62-スオウ" = "では、始めようか。"
