[translation]
"13185-1" = "中央駅旧庁舎・東地区"
"13185-2-PMC兵士" = "エリアE、クリア。"
"13185-3" = "中央駅旧庁舎・南地区"
"13185-4-PMC兵士" = "エリアS、クリア。"
"13185-5" = "中央駅旧庁舎・北地区"
"13185-6-PMC兵士" = "エリアN、クリア。"
"13185-7-PMC兵士" = "ジェネラル、残るはそちらのエリアだけです。"
"13185-8-PMC兵士" = "……ジェネラル？"
"13185-9-ジェネラル" = "ぐっ……。"
"13185-10-ホシノ" = "うへ～、結構しつこかったなぁ。"
"13185-11-ヒカリ" = "助かったー。"
"13185-12-ノゾミ" = "パヒャヒャッ、これでピンチ脱出っしょ？"
"13185-13-シロコ" = "ん……。"
"13185-14-セリカ" = "こいつら、まったく緊張感がないわね。"
"13185-15-ハイランダーの生徒A" = "た、助けていただきありがとうございました。"
"13185-16" = "大丈夫でしたか？"
"13185-17" = "PMCが私募ファンドを襲っているようですが……。"
"13185-18-ノゾミ" = "こっちが聞きたいくらいだし！#n何が起きてんのさ？"
"13185-19-アヤネ" = "皆さんも知らないのですか？"
"13185-20-ノゾミ" = "なんか戦いが始まるとか聞いたような気もするけど……なんだっけ？"
"13185-21-ヒカリ" = "眠くて聞いてなかったー。"
"13185-22-ノゾミ" = "とりあえず、監督官と連絡が取れない間に、#nちゃっちゃと工事進めちゃうか！"
"13185-23-ヒカリ" = "イエース、超ラッキー。"
"13185-24-アヤネ" = "えっと、ひとまず工事は中断して避難したほうが良いかと。"
"13185-25-ハイランダーの生徒A" = "ほ、ほら、お二人とも！#n早くこんな呪われた場所から逃げましょう！"
"13185-26-アヤネ" = "だ、誰もそこまでは言っていませんが……。"
"13185-27-セリカ" = "はぁ、ちゃんと忠告したからね？"
"13185-28" = "[ns] \"旧庁舎に急ごう。\""
"13185-29-アヤネ" = "カイザーの目的は分かりませんが……そうですね。"
"13185-30-アヤネ" = "総会に遅れるわけにはいきません！"
"13185-31-シロコ" = "急ごう、ホシノ先輩もいるはず。"
"13185-32" = "次回;債権者団体の総会"
