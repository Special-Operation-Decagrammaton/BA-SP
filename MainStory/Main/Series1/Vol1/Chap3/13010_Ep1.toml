[translation]
"13010-1" = "第1話;プロローグ"
"13010-2-フランシス" = "……ここか。"
"13010-3-フランシス" = "[ruby=われわれ]ゲマトリア[/ruby]から追放され埋もれてしまった――封印されし同胞よ。"
"13010-4-？？？" = "くるしい……くるしい……。"
"13010-5-フランシス" = "お前の苦行はこれで終わりだ。#n起きよ、「地下生活者」。"
"13010-6-？？？" = "……。"
"13010-7-？？？" = "……この声。"
"13010-8-？？？" = "「匿名の行人」、貴方ですね……。 "
"13010-9-フランシス" = "いや――今は「フランシス」と呼べ。"
"13010-10-？？？" = "なんだっていいのです……小生には、構わないでください…… "
"13010-11-？？？" = "理由が何であれ……興味はありません……ヒヒッ、ヒ……"
"13010-12-？？？" = "小生はこれ以上……"
"13010-13-フランシス" = "――ゲマトリアが壊滅した。"
"13010-14-？？？" = "……。 "
"13010-15-？？？" = "それはどういう……？"
"13010-16-フランシス" = "ゲマトリアはもう存在しない。解体、もしくは解散と見ていいだろう。"
"13010-17-フランシス" = "……原因は1つ。"
"13010-18-フランシス" = "シャーレの[USERNAME]先生という存在が居たからだ。あの者が、因果とジャンルを捻じ曲げた。 "
"13010-19-フランシス" = "今あの者を相手するのは――"
"13010-20-？？？" = "しっ！……静かに。 "
"13010-21-地下生活者" = "ふむ……。 "
"13010-22-地下生活者" = "なるほど……[ruby=コデックス]「RULE BOOK」[/ruby]が更新されたのですね？"
"13010-23-地下生活者" = "新しい世界……ええ、感じます。#nこの世界の異物感を……"
"13010-24-地下生活者" = "書が変更されルールが変わったのなら、これは……また新しい[ruby=・   ・   ・   ・   ・   ・]キャンペーン[/ruby]が始まったということで……。"
"13010-25-地下生活者" = "そ、そう、ですか……ヒヒッ、ヒ！……ならば話は変わります。 "
"13010-26-地下生活者" = "こ、今度の書は……！小生に、どんな気付きを与えてくれるのでしょう。 "
"13010-27-地下生活者" = "どれ、どれ……[USERNAME]と言いましたか……？ "
"13010-28-地下生活者" = "この者が、キャンペーンのボス……？"
"13010-29-地下生活者" = "新しい[ruby=コデックス]「RULE BOOK」[/ruby]は――"
"13010-30-地下生活者" = "学園都市……"
"13010-31-地下生活者" = "それに、先生？ "
"13010-32-地下生活者" = "ン、ンン……？こ、これは！思ったよりも難易度がた、高いじゃありませんか……！"
"13010-33-地下生活者" = "し、しかし、万物に攻略法は存在する……！どれ、どれ……盲点、弱点……欠点……何だっていい……！"
"13010-34-フランシス" = "あの者を見くびるな、地下生活者。 "
"13010-35-フランシス" = "お前がこの世界をどう認識しているかなど、興味はない。#nしかし、いつまでもボードゲームかなんかだと思っていては、正しい勝利にはたどり着けないだろう。"
"13010-36-地下生活者" = "……。"
"13010-37-フランシス" = "私が答えを教えてやろう。あの者に勝利するためには……"
"13010-38-地下生活者" = "邪魔をするなァアッ！！クズがッッ！！！！"
"13010-39-地下生活者" = "「死」を知らない貴様ごときがア！ええッッ！？ "
"13010-40-地下生活者" = "小生の苦しみ、孤独を……恐怖を、理解できるのかア！！？"
"13010-41-地下生活者" = "匿名の行人のクセに出しゃばるなァッ！！これは小生のキャンペーン！！ "
"13010-42-地下生活者" = "苦行を通じて、小生が、どんな気付きを得られるかがッ、それが重要なんだよォ！！"
"13010-43" = "それを貴様がッ、邪魔をするんじゃねぇえッッ！！！！！"
"13010-44" = "小生のキャンペーンに、割り込むなァ――！！！"
"13010-45-地下生活者" = "ハァ……ハァ……。"
"13010-46-地下生活者" = "勝利ィ……？#n何故にみな、そんなものに執着する？"
"13010-47-地下生活者" = "結果はすでに決まっている！！#n我々はいつか死ぬ、それは不変の真理！ "
"13010-48-地下生活者" = "結局はみな敗北する運命……大事なのはそれじゃねぇのさ！！"
"13010-49-地下生活者" = "そうだ……大事なのは過程……！#nその過程で、小生が何を経験し、気付きを得られるか――ただそのことに意味がある……"
"13010-50-地下生活者" = "貴様らごときが、「ゲマトリア」という崇高なる求道を名乗るぅ……？#nそ、そんなの、ゲマトリアの名が……！！"
"13010-51-地下生活者" = "名が、廃るだろうが――！？！！！"
"13010-52-地下生活者" = "ハァ……ハァ……"
"13010-53-地下生活者" = "お、お、落ち着くのだ……落ち着かねば……"
"13010-54-地下生活者" = "これから何をすべきか……き、決めなくては…… "
"13010-55-地下生活者" = "ゲマトリアが……壊滅？"
"13010-56-地下生活者" = "いや――本当のゲマトリアはこの小生。"
"13010-57-地下生活者" = "小生が、ゲマトリアの真の姿を見せてやらねば……"
"13010-58-地下生活者" = "ヒヒッ、ヒ……い、いいだろう。まずはこの世界を、知ることから始めなくては……#n新しいコデックス、新しいキャンペーン…… "
"13010-59-地下生活者" = "アア、そう……。ならば小生の求道は[ruby=・   ・   ・   ・]そこから[/ruby]始めよう。"
"13010-60-地下生活者" = "……アビドス。"
"13010-61-地下生活者" = "太古の「神秘」らが誕生したあの帝国……果たして、今回のコデックスではどんな形になっているものか……"
"13010-62-地下生活者" = "ヒヒッ、ヒヒッ……。"
"13010-63-地下生活者" = "どうか、小生を愉しませてくださいね。"
"13010-64-ユメ" = "見て見て、ホシノちゃん！"
"13010-65-ユメ" = "昔の生徒会が、アビドスの「大オアシス」にすっごいものを埋めたらしいの！！"
"13010-66-ホシノ" = "すごいもの、ですか？"
"13010-67-ユメ" = "そう！花火なんだけど、希少鉱物が入った花火らしくて……"
"13010-68-ユメ" = "これに刺激を与えると、プラズマになった火花が発生して空を彩る――っていう技術が使われてるんだって。"
"13010-69-ユメ" = "こ～んな形の花火もあるんだよっ！かわいいよね～！"
"13010-70-ユメ" = "元々はお祭りの時に使う予定だったらしいんだけど、なぜかうまく動かなくて余ったのを湖に捨てたんだって。"
"13010-71-ホシノ" = "……なるほど。 "
"13010-72-ユメ" = "すごいよね、100gで100万円以上もする鉱物が入った物を捨てちゃうんだよ？"
"13010-73-ユメ" = "さすがはアビドス生徒会……羽毛の体操マットを使う方々なだけあるよね……。"
"13010-74-ユメ" = "その100分の1でいいから、私たちに残してくれてもよかったのに……ひぃん。"
"13010-75-ユメ" = "……でも、そのオアシスはとっくの前に干からびたじゃないですか。 "
"13010-76-ユメ" = "うん、そうなんだよね。"
"13010-77-ホシノ" = "今はただの砂原で、そんなのどこにもなかったはず。"
"13010-78-ユメ" = "ふっふっふ……ホシノちゃんはまだまだだね！"
"13010-79-ユメ" = "これは湖があった頃の話だから、かなり昔のことでしょ？"
"13010-80-ホシノ" = "つまり……？ "
"13010-81-ユメ" = "つまり、その花火は……干からびたオアシス――"
"13010-82-ユメ" = "あの下に存在するってこと。"
"13010-83-ホシノ" = "「大オアシス」の下に希少鉱物が埋まってる、ってことですか？"
"13010-84-ユメ" = "そっ！ "
"13010-85-ホシノ" = "……ユメ先輩は、自分がいま何を言っているのか分かってますか？"
"13010-86-ユメ" = "えっ……？その……。"
"13010-87-ホシノ" = "こうしてる場合じゃないですよ！今すぐ探しに行きますよ！！"
"13010-88-ユメ" = "そう！！私もそれを言いたかったの！……お宝探し、スタートっ！ "
"13010-89-ホシノ" = "うへへ、行きましょう先輩！！"
"13010-90-ユメ" = "うん！これで私たちも大富豪だよ、ホシノちゃん！ "
"13010-91" = "ホシノちゃん……あのね……。"
"13010-92" = "それ以上言わないでください！私も薄々感じてるんですから！"
"13010-93" = "そうだよね？私だけじゃないよね……？そろそろ止めるべき？"
"13010-94" = "も、もうちょっと頑張ってから……！ "
"13010-95" = "……ごめんねホシノちゃん。これは詰んじゃったよー。"
"13010-96" = "く、くうっ……。"
"13010-97-ユメ" = "ねえ、ホシノちゃん……私たち、どこから間違えたんだろ……。"
"13010-98-ホシノ" = "先輩が変な計画を持ち込んだ時から、じゃないですかね。"
"13010-99-ユメ" = "ひぃん……ホシノちゃんも喜んでたのに……私のせい？そうなの？"
"13010-100-ホシノ" = "……そ、それは私だって知ってますから！言わないでくださいよ！"
"13010-101-ユメ" = "今思えば、水着を着る必要もなかった気がするし……"
"13010-102-ユメ" = "やっぱ何も考えてなかったんですね！？#nなんで着ようって言ったんですか！"
"13010-103-ユメ" = "え、だってぇ……地面を掘ってたらドカーンって地下水が湧き出るかも、と思って…… "
"13010-104-ホシノ" = "そもそもそんな確率、存在しました！？ "
"13010-105-ユメ" = "それで砂漠化も解決して、めでたしめでたし～って……"
"13010-106-ホシノ" = "そんなわけないでしょ！"
"13010-107-ユメ" = "ひぃん……。 "
"13010-108" = "んー……反省として今日の出来事を書いておかないと……。"
"13010-109" = "ちょ、ちょっと先輩、何を書いて…… "
"13010-110" = "こんな失態の記録とかやめてくださいよ！"
"13010-111" = "でも、生徒会長としての義務というかさ……後々ホシノちゃんの役にも立つと思うし……"
"13010-112" = "それ、失敗の記録しかないでしょ！というかそんなボロい手帳誰が貰うかっ！私は新しいヤツ買いますからね！"
"13010-113" = "ひぃぃん……。"
"13010-114" = "対策委員会・教室"
"13010-115-アヤネ" = "それでは、アビドス対策委員会の定例会議を……"
"13010-116-アヤネ" = "……始めたいところですが、1人見当たりませんね。 "
"13010-117-ノノミ" = "うんうん！いつもの人ですね～☆"
"13010-118-シロコ" = "ん、ホシノ先輩がいない。"
"13010-119-セリカ" = "今度はどこに行ったのよ！またどっかで昼寝でもしてるの？"
"13010-120-シロコ" = "さっき、隣の教室で寝てたよ。"
"13010-121-セリカ" = "なら連れて来ないとでしょシロコ先輩！会議始まるんだから！"
"13010-122-シロコ" = "う、うん……でも、起こしづらくて……。"
"13010-123-セリカ" = "何でよ、またニヤニヤしながら寝てたから？ "
"13010-124-ノノミ" = "シロコちゃんはホシノ先輩に甘いですからね。 "
"13010-125-シロコ" = "今連れてくる。 "
"13010-126-ノノミ" = "あっ、私も行きます！シロコちゃん。"
"13010-127-セリカ" = "だからって二人して行かなくてもいいじゃない。 "
"13010-128-セリカ" = "あはは……みなさん、ホシノ先輩が大好きですからね……。"
"13010-129-シロコ" = "ホシノ先輩、会議始まるよ。"
"13010-130-シロコ" = "うんうん、そろそろ起きる時間ですよ～☆ "
"13010-131-シロコ" = "……あれ？"
"13010-132-ノノミ" = "ホシノ先輩？"
"13010-133-シロコ" = "起きてたんだ。"
"13010-134-シロコ" = "……あっ。 "
"13010-135-ホシノ" = "そうだ……会議だったよね。 "
"13010-136-ホシノ" = "うへ～ごめんごめん。おじさんももう歳だからか、最近忘れっぽくて。 "
"13010-137-シロコ" = "う、うん。 "
"13010-138-ホシノ" = "あれ？そんなに歳変わらないでしょ！とかいうツッコミはなし？"
"13010-139-ホシノ" = "ほらほら、行くよ～。アヤネちゃん、怒ると怖いからね。 "
"13010-140-シロコ" = "待って先輩。"
"13010-141-ノノミ" = "……。"
"13010-142" = "[ns] \"みんな揃ってる？\""
"13010-143-アヤネ" = "はい。それでは全員揃ったので、会議を始めたいと思います。"
"13010-144-アヤネ" = "まず、この頃アビドス自治区周りで不自然な動向があったので、共有します。 "
"13010-145-ノノミ" = "不自然な動向？"
"13010-146-ノノミ" = "何かありましたか？"
"13010-147-アヤネ" = "……はい。まだ要注意程度のことだとは思いますが……。"
"13010-148-ノノミ" = "どうしたんですか、アヤネちゃん？"
"13010-149-アヤネ" = "まず……発端は、カイザーグループです。"
"13010-150-アヤネ" = "みなさんご存じの通り、カイザーコーポレーションは最近までアビドス砂漠で発掘を行なっていました。"
"13010-151-アヤネ" = "カイザーがそこで何を探しているのか、私たちは分かっていませんでしたが……"
"13010-152-ノノミ" = "まあ……結局そういうことだったって、明らかになったわね。 "
"13010-153-ノノミ" = "バラバラになってしまいましたけどね……。"
"13010-154-アヤネ" = "はい。結局「ウトナピシュティムの本船」は成層圏で破壊され、その残骸や痕跡は発見さえできませんでした。"
"13010-155-アヤネ" = "そしてカイザーは、その船が破壊された時点でアビドス砂漠を占拠する理由がなくなったんだと思います。"
"13010-156-アヤネ" = "カイザーは砂漠から徐々に撤退していき、今はもう廃墟同然です。"
"13010-157-セリカ" = "うん。発掘区域から撤退するのを見た。"
"13010-158-セリカ" = "本当スッキリしたんだからあれ！もう絶対二度と来ないでよね！"
"13010-159-ノノミ" = "でも、カイザーへの借金がなくなったわけじゃないんですよね……。"
"13010-160-アヤネ" = "はい……アビドスの借金自体はカイザーが握っているので、私たちの状況は何も変わりません……。"
"13010-161-ノノミ" = "カイザーコーポレーションのプレジデントは、アビドス砂漠よりも再建中のサンクトゥムタワーに興味を持っているようですし……。"
"13010-162-アヤネ" = "ですが、ここからが本題です。"
"13010-163-シロコ" = "本題……。 "
"13010-164-シロコ" = "うん。"
"13010-165-ノノミ" = "どうしたんですか、アヤネちゃん？"
"13010-166-アヤネ" = "結論から言いますと……カイザーグループは、アビドスの借金を債権に切り替え、債券市場に売ろうとしています。"
"13010-167-ノノミ" = "えっ、債権ですか……？"
"13010-168-ホシノ" = "債券市場……？って、な、何よそれ？"
"13010-169-ノノミ" = "私たちから借金を受け取る権利を、有価証券にして――"
"13010-170-ホシノ" = "……要は、私たちから借金を受け取る権利を他の人に売るってこと。"
"13010-171-セリカ" = "えっ、じゃあ何がどうなるの！？ "
"13010-172-ノノミ" = "債権を買った人がアビドスから借金を受け取るので……"
"13010-173-セリカ" = "これから他の人に借金を返すってこと？それって私たちにとって吉なの？"
"13010-174-アヤネ" = "それは……。"
"13010-175-ホシノ" = "いや、それはあり得ない。"
"13010-176-ノノミ" = "ホシノ先輩……？"
"13010-177-ホシノ" = "債権を取引するってことは、利益を見出せるということ。"
"13010-178-ホシノ" = "でも、こんな……いつ無くなってもおかしくない学校の債権を買い入れるなんて、ハイリスクでしかない。"
"13010-179-ホシノ" = "5人で借金を返してるような学校の債権を買う人なんて居ないと思うよ。"
"13010-180-アヤネ" = "……。 "
"13010-181-アヤネ" = "それは……そうですが……。"
"13010-182-ホシノ" = "カイザーが私たちから完全に手を引くとも捉えられるけど、それも買い手が居た場合の話。"
"13010-183-ホシノ" = "……まあ、安く売り払っちゃおうっていう魂胆かもね。 "
"13010-184-セリカ" = "じゃ、じゃあ、私たちが返済する額も減るの？"
"13010-185-アヤネ" = "ううん、セリカちゃん。権利を安く売るだけで、私たちの借金に影響はないよ。"
"13010-186-シロコ" = "100万円受け取る権利を90万円で買うってことだから、私たちの借金の額はそのまま。"
"13010-187-セリカ" = "そ、それ以上説明しなくても分かったから、シロコ先輩！ "
"13010-188-シロコ" = "う、うん……ごめん。"
"13010-189-ホシノ" = "アヤネちゃん。カイザーはどのくらい債権に変えたんだろ？きっと全部ではないよね。"
"13010-190-アヤネ" = "はい。現時点で公表された額は……カイザーコーポレーションが保有中の、アビドスの負債約45%です。"
"13010-191-アヤネ" = "ふむ……なるほどね……。"
"13010-192-セリカ" = "あ……それなら私たちが安く買ってしまえば……！？"
"13010-193-セリカ" = "……そうね！？私たちが買っちゃえばいいじゃない！ "
"13010-194-アヤネ" = "はい。私もその件でみなさんにご相談したいと思い…… "
"13010-195-アヤネ" = "債券市場が開かれたら、私たちの貯蓄で買い入れるのはどうかなと。"
"13010-196-セリカ" = "いいね、やっちゃおうアヤネちゃん！"
"13010-197-ノノミ" = "まずは株式市場同様、騰落をよく見て……。"
"13010-198-アヤネ" = "はい、それでは――"
"13010-199-アヤネ" = "あ、あれ……？"
"13010-200-セリカ" = "どうしたの？"
"13010-201-アヤネ" = "わ、私たちの債券が……暴騰しています！"
"13010-202-セリカ" = "ぼ、暴騰！？"
"13010-203-アヤネ" = "債券の額の200%……300%……450%！？#nだ、誰かがすごい勢いで買い占めてます！！"
"13010-204-セリカ" = "え、えっ……？？"
"13010-205-ノノミ" = "いったい、誰が……！？"
"13010-206-アヤネ" = "それが……すごい数で、特定は難しく……。 "
"13010-207-アヤネ" = "……売り切れ、ました。 "
"13010-208-アヤネ" = "アビドスの債権……完売です……。 "
"13010-209-ノノミ" = "そ、そんな……。 "
"13010-210-アヤネ" = "ま、まず……今分かったことを共有しますと……"
"13010-211-アヤネ" = "アビドスの派生証券を買い占めたのは―― "
"13010-212-アヤネ" = "――ネフティスグループ、だそうです……。 "
"13010-213-セリカ" = "……。"
"13010-214-セリカ" = "……！？"
"13010-215-シロコ" = "……。"
