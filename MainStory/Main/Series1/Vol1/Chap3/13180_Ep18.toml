[translation]
"13180-1" = "第18話;大混乱"
"13180-2-ネフティス幹部" = "これで終わりでしょうか？"
"13180-3-質屋連合長" = "用意した戦力が、すべて……。"
"13180-4-債権者団体の代表" = "まさか、これほどの強さとは……。"
"13180-5-私債労働組合長" = "いや、あり得ない。#nネフティスがカイザーと手を組むだなんて！"
"13180-6-私債労働組合長" = "どういうことだ！#n犬猿の仲じゃなかったのか？"
"13180-7-ネフティス幹部" = "ええ、たしかに仰る通りです。"
"13180-8-ネフティス幹部" = "しかし、あの者たちが何も見返りを求めず、#n砂漠横断鉄道の債権を差し出したとでもお思いで？"
"13180-9-ネフティス幹部" = "取り引きをしていたのですよ、裏で。"
"13180-10-押収品競売組合長" = "だ、だとしても、自分たちの令嬢を人質にするとは！"
"13180-11-ネフティス幹部" = "致し方なかった、それだけです。"
"13180-12-ネフティス幹部" = "後ほど謝るとします。"
"13180-13-ネフティス幹部" = "ですが、かつてお嬢様が与えた損害を考えると……#nこれでも足りないくらいでしょう。"
"13180-14-ネフティス幹部" = "あとは[ruby=たかなし]小鳥遊[/ruby]ホシノが契約の無効を申し出さえすれば、#n列車砲の所有権は我々ネフティスの物に。"
"13180-15-ネフティス幹部" = "そして、お嬢様はアビドスの生徒として、#n卒業まで幸せな日々を送れることでしょう。"
"13180-16-債権者団体の代表" = "ネフティス……？#nカイザーの物になるのではなく？"
"13180-17-ネフティス幹部" = "……カイザーは列車砲に興味がないのかと。"
"13180-18-ネフティス幹部" = "ちなみに、私が裏切ったという情報はどちらから？"
"13180-19-債権者団体の代表" = "そ、それは……。"
"13180-20-スオウ" = "私だ。"
"13180-21-ネフティス幹部" = "スオウさん……！？"
"13180-22-ネフティス幹部" = "なっ……ま、まさか寝返って！？"
"13180-23-？？？" = "いいや、そうじゃない。"
"13180-24-ネフティス幹部" = "ぷ、プレジデント……？"
"13180-25-プレジデント" = "彼女は、もともとカイザーPMCに所属していた。"
"13180-26-スオウ" = "……昔の話だ。"
"13180-27-ネフティス幹部" = "行く当てのないあなたを誰が拾ったと！？#nまさか、恩を仇で返すとは……！"
"13180-28-ジェネラル" = "誰が助けてほしいだなんて頼んだ？"
"13180-29-プレジデント" = "……ジェネラル。"
"13180-30-ジェネラル" = "大人しくしてもらおう。"
"13180-31-債権者団体の代表" = "ううっ……。"
"13180-32-ネフティス幹部" = "くっ……。"
"13180-33-プレジデント" = "ご苦労だったな。"
"13180-34-プレジデント" = "おかげで莫大な利益を得られたよ。"
"13180-35-ジェネラル" = "プレジデント、こちらが例の情報です。"
"13180-36-プレジデント" = "ほう。"
"13180-37-プレジデント" = "列車砲……面白そうじゃないか。#nこんなに素晴らしい物がアビドスにあるとは。"
"13180-38-プレジデント" = "……なぜ、私に教えなかった？"
"13180-39-ネフティス幹部" = "ぐっ……。"
"13180-40-プレジデント" = "宇宙戦艦などという荒唐無稽な代物より、#nよっぽど現実的じゃないか。"
"13180-41-ジェネラル" = "分析によると、類を見ないほど強力な非対称戦力兵器のようです。"
"13180-42-プレジデント" = "「黒服」と連絡が途絶えてから、ずいぶんと経つ。#n新しい力を探していた矢先に、雷帝の遺産が見つかるとは。"
"13180-43-ジェネラル" = "はい。これがあれば、例のアレも……。"
"13180-44-プレジデント" = "……うむ。"
"13180-45-プレジデント" = "良いだろう、列車砲は我々の物とする。"
"13180-46-ネフティス幹部" = "なっ！"
"13180-47-プレジデント" = "大至急、列車砲の位置を割り出せ。#n線路沿いのどこかにあるはずだ。"
"13180-48-ジェネラル" = "分かりました。"
"13180-49-ネフティス幹部" = "あなたたちに列車砲の所有権はありません！"
"13180-50" = "ほう？"
"13180-51-ネフティス幹部" = "カイザーは債権を私募ファンドに売却したでしょう！"
"13180-52-ネフティス幹部" = "列車砲の権利は、アビドス生徒会と交わした契約書次第です！"
"13180-53-プレジデント" = "まったく、君は私を何だと思っているのかね。"
"13180-54-プレジデント" = "カイザーコーポレーションのトップに、契約の話で駆け引きしようとは。"
"13180-55-ネフティス幹部" = "そ、それは……！"
"13180-56-プレジデント" = "なぜ私募ファンドは、総会を開いた？"
"13180-57-債権者団体の代表" = "っ……。"
"13180-58-プレジデント" = "私が説明してやろう。"
"13180-59-プレジデント" = "予測できる未来は3つ。"
"13180-60-プレジデント" = "1つ目、アビドス生徒会が総会に出席し、売買契約の継続を申し出る。"
"13180-61-プレジデント" = "すると、列車砲はアビドス生徒会の手に渡るわけだ。"
"13180-62-プレジデント" = "これだけは避けようと、躍起になっていたのだろう？"
"13180-63-ネフティス幹部" = "……。"
"13180-64-ネフティス幹部" = "……。"
"13180-65-プレジデント" = "2つ目、「アビドス生徒会」は生徒会としての権限を持たなかったと述べ、#n契約の無効を主張する。"
"13180-66-プレジデント" = "そうなると、列車砲の権利は契約前の所有者であったネフティスに渡る。"
"13180-67-プレジデント" = "これが君の望んでいた未来だろう、違うかね？"
"13180-68-ネフティス幹部" = "……。"
"13180-69-プレジデント" = "そのためにネフティスのご令嬢を拘束し、小鳥遊ホシノを脅すとは……。"
"13180-70-プレジデント" = "ハッハッハ。#nいやはや、まさかそこまでするとは私も驚いたよ。"
"13180-71-ネフティス幹部" = "……。"
"13180-72-プレジデント" = "やはり、アビドス出身の者は油断ならないな。#nネフティスもなかなかやるじゃないか。"
"13180-73-ネフティス幹部" = "……ぐっ。"
"13180-74-プレジデント" = "そして3つ目、アビドス生徒会が総会を欠席。"
"13180-75-プレジデント" = "もしくは出席し、契約の解除を申し出る。"
"13180-76-プレジデント" = "総会が無事に終了すれば……。"
"13180-77-プレジデント" = "砂漠横断鉄道の所有権は、私募ファンドの物となる。"
"13180-78-プレジデント" = "鉄道の関連施設に含まれるであろう、列車砲と共に。"
"13180-79-プレジデント" = "これが、君たちの思い描いた当初の目的だろう？"
"13180-80-ジェネラル" = "だが、こんな疑問は残らないかね？"
"13180-81-プレジデント" = "なけなしの金を[ruby=はた]叩[/ruby]いて兵を雇ってまで、#nなぜ総会を開催する必要があったのか。"
"13180-82-プレジデント" = "売買契約書は、今日の12時を過ぎれば効力を失う。"
"13180-83-プレジデント" = "アビドスは契約の存在など忘れていたはずだ。"
"13180-84-プレジデント" = "なのに、なぜ彼女たちを巻き込んだのか……。"
"13180-85-プレジデント" = "その理由は、おそらくこうだろう？"
"13180-86-プレジデント" = "――列車砲の存在を、我々に知られないため。"
"13180-87-債権者団体の代表" = "くっ……。"
"13180-88-プレジデント" = "しかし、詰めが甘かったな。"
"13180-89-プレジデント" = "我々と手を組んだ以上、どんな情報も筒抜けだ。"
"13180-90-プレジデント" = "ハハッ。"
"13180-91-プレジデント" = "ハッ、ハーッハッハッハ！"
"13180-92-プレジデント" = "……さて、状況が整理できたところで、#nこの書類にサインをしてもらおうか。"
"13180-93-私債労働組合長" = "こ、これは……？"
"13180-94-私債労働組合長" = "買収だと！？#nう、ウチのタヌキダイスキ工業を……！？"
"13180-95-私債労働組合長" = "そ、そんなっ！"
"13180-96-プレジデント" = "今から君たちは、我々の子会社となる。"
"13180-97-プレジデント" = "もちろん、それ相応の金額は提示しよう。#nそうだな……1000円と言ったところか。"
"13180-98-押収品競売組合長" = "な、何だと！？"
"13180-99-質屋連合長" = "私たちをバカにしてるのか……！？"
"13180-100-質屋連合長" = "っ……！"
"13180-101-プレジデント" = "なに、心配しなくても良い。#nM&Aは我々の専売特許だ。事業はしっかりと継承する。"
"13180-102-プレジデント" = "それと、知らなかったのなら教えてやろう。"
"13180-103-プレジデント" = "カイザーのエンブレムが「タコ」である理由は、それだけ多くの会社を従えているからだ。"
"13180-104-プレジデント" = "良かったではないか。#nこれで今日から君たちは、我々カイザーグループの一員になれる。"
"13180-105-プレジデント" = "早くそこにサインしたまえ。"
"13180-106-質屋連合長" = "こ、こんな横暴が許されるのか……！"
"13180-107-私債労働組合長" = "最初から首を突っ込むんじゃなかった……。"
"13180-108-プレジデント" = "これで私募ファンドは、我々カイザーグループの一員だ！#nあぁ、実に喜ばしいな。"
"13180-109-プレジデント" = "当然、代表権限も私の物となるわけだが、異論はあるかね？"
"13180-110-PMC兵士" = "……っ、ありません。"
"13180-111-プレジデント" = "ご苦労だったな。#n総会が終わるまで、その辺で待っていろ。"
"13180-112-プレジデント" = "一応、この場にいてもらわなくては困るのでね。"
"13180-113-プレジデント" = "あとは正午まで守り通せば、列車砲は私の物に。"
"13180-114-プレジデント" = "ほかにも手段などいくらでもあるが、#nせっかくなら活かさない手はない。"
"13180-115-プレジデント" = "ジェネラル、12時までアビドスを足止めしろ。"
"13180-116-PMC兵士" = "分かりました。"
"13180-117-プレジデント" = "油断はするな。#n特に、あの小鳥遊ホシノは黒服が欲しがっていた人材だ。#n並大抵の力ではないだろう。"
"13180-118-PMC兵士" = "心配には及びません。#n必ずや、ご期待に応えましょう。"
"13180-119-プレジデント" = "さすがは私が見込んだだけはある。#nでは、任せたぞ。"
"13180-120-PMC兵士" = "はっ！"
"13180-121-ジェネラル" = "準備しろ、すぐに出発する。"
"13180-122-プレジデント" = "残るは列車砲の位置か。#n見つかり次第、すぐに報告しろ。"
"13180-123-PMC兵士" = "はい！"
"13180-124-プレジデント" = "では、お手並み拝見といこうじゃないか。"
"13180-125-黒亀組の組員A" = "な、なぜボスから連絡がない？"
"13180-126-黒亀組の組員B" = "おかしいぞ……？"
"13180-127-黒亀組の組員A" = "うっ……！"
"13180-128-ジェネラル" = "邪魔な者は排除して、配置につけ！"
"13180-129-ジェネラル" = "ここから先は一人も通してはならん！"
"13180-130" = "AM 10:4X"
"13180-131-アヤネ" = "新しい兵力を確認！#nか、カイザーPMCです！"
"13180-132-シロコ" = "カイザー……？"
"13180-133-アヤネ" = "それも、かなりの人数が駅に向かっています……！#nなぜか私募ファンドの勢力と交戦中です！"
"13180-134-セリカ" = "ど、どうなってるのよ。"
"13180-135-シロコ" = "仲間割れ？"
"13180-136-アヤネ" = "いえ、そもそもカイザーは参加していなかったはずです。"
"13180-137-アヤネ" = "……"
"13180-138-アヤネ" = "えっ！？"
"13180-139-ヒカリ" = "うぉー、何これー。"
"13180-140-ノゾミ" = "どうなってんの？"
"13180-141-ヒカリ" = "囲まれてるー？"
"13180-142-PMC兵士" = "私募ファンドの兵力を確認！"
"13180-143-ハイランダーの生徒A" = "ひっ！"
"13180-144-ハイランダーの生徒A" = "わ、私たちは何も知りません！"
"13180-145-アヤネ" = "ハイランダーもカイザーに包囲されているようです。"
"13180-146-シロコ" = "えっ、もしかしてあの双子？"
"13180-147-シロコ" = "ホシノ先輩は？"
"13180-148-ホシノ" = "カイザー？"
"13180-149-ジェネラル" = "ふっ。見つけたぞ、小鳥遊ホシノ。"
"13180-150-ホシノ" = "……[ruby=ど]退[/ruby]いてもらうよ。"
"13180-151-アヤネ" = "ホシノ先輩は、カイザーPMCの特殊部隊と交戦中です！"
"13180-152-シロコ" = "先生、どうする？"
"13180-153" = "[s1] \"大丈夫、ジェネラルが相手ならホシノが勝つ。\"\n[s2] \"私たちはハイランダーを助けよう。\""
"13180-154" = "AM 10:5X"
"13180-155-アヤネ" = "総会まで、あと1時間ちょっとしかありません……。"
"13180-156-シロコ" = "大丈夫、絶対に間に合う。"
"13180-157" = "はぁ……ま、仕方ないわね。#nあいつらも見過ごせないし。"
"13180-158-アヤネ" = "……分かりました。"
"13180-159-アヤネ" = "では、これよりハイランダー鉄道学園の手助けに回ります！"
