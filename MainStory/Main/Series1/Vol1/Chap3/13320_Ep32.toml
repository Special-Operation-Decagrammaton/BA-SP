"13320-75" = "殺したんだ。"
"13320-76" = "殺したんだ。"
"13320-77" = "……この苦しみは、誰にも分かるはずない。"
"13320-78" = "何も知らないくせに。"
"13320-79-地下生活者" = "ウオオオオオオオオ――！"
"13320-80-地下生活者" = "ついに、ついにやったぞ！"
"13320-81-地下生活者" = "これこそが、古則の答え！"
"13320-82" = "[ns] \"……！\""
"13320-83-アヤネ" = "な、何が起きて……？"
"13320-84-セリカ" = "あっちで爆発が！#nっていうか、空が……。"
"13320-85" = "……！"
"13320-86-ノノミ" = "これは……。 "
"13320-87-スオウ" = "ぐっ……。"
"13320-88-ノゾミ" = "おい、しっかりしろって監督官！#n寝てる場合じゃないけど！？"
"13320-89-ヒカリ" = "むーりー、完全に伸びてるー。"
"13320-90-シロコ" = "先生……。"
"13320-91-アヤネ" = "ひとまず、列車砲は停止できましたが、今度は何が……？"
"13320-92-セリカ" = "も、もはや列車砲どころじゃなさそうだけど！？"
"13320-93" = "[ns] \"ホシノ、ヒナ……！\""
"13320-94" = "次回;顕現"
