[translation]
"13320-1" = "第32話;唯一の真実（２）"
"13320-2-ヒナ" = "雷帝の遺産は厄介だろうけど……先生たちなら、何とかしてくれる。"
"13320-3-ヒナ" = "[ruby=あさぎり]朝霧[/ruby]スオウの安全を確保したら、こっちに合流すると思う。#nそれまでおとなしく待ってることね。"
"13320-4-ヒナ" = "……最初からこれで良かったって、#nあなたも分かっているんじゃないの？"
"13320-5-ホシノ" = "……。"
"13320-6-ホシノ" = "知ったような口ぶりだね、風紀委員長ちゃん。"
"13320-7-ホシノ" = "でも、最初から絶対って言い切れた？"
"13320-8-ホシノ" = "すべてが思い通りに行くわけがない。むしろ、思い通りに行かないことのほうが多い。"
"13320-9-ヒナ" = "……。"
"13320-10" = "亡くなった人は蘇らないし。"
"13320-11" = "過去は変えられない。"
"13320-12" = "ユメ先輩の死が、決し[ruby=くつがえ]て覆ら[/ruby]ないように。"
"13320-13" = "それは……。"
"13320-14" = "……どうして？"
"13320-15-ホシノ" = "なんで、先輩が死ななくちゃいけなかったの？"
"13320-16-ホシノ" = "一体どこから間違えちゃったんだろ……あんな最期になるなんて……。"
"13320-17-ホシノ" = "……ねぇ、どうして？"
"13320-18-ヒナ" = "（幻覚を見ている……？）"
"13320-19-ホシノ" = "手帳、手帳は？"
"13320-20-ヒナ" = "……？"
"13320-21-ホシノ" = "どこ？"
"13320-22-ホシノ" = "先輩が言う「あそこ」って？"
"13320-23-ホシノ" = "いったい、あの手帳には何が書いてあるの？"
"13320-24-ヒナ" = "……？"
"13320-25-ホシノ" = "私はずっと、最後の言葉を知らないまま生きていくの……？"
"13320-26-ヒナ" = "（……明らかに様子がおかしいわ） "
"13320-27-地下生活者" = "オオッ……あと少し、あと少しだ！"
"13320-28-地下生活者" = "邪魔者は、もういなくなった。"
"13320-29-地下生活者" = "たとえ、手帳が見つかったとしても。"
"13320-30-地下生活者" = "小鳥遊ホシノが、梔子ユメの死の真実を知る余地はない。"
"13320-31" = "梔子ユメの死は、すでに遠い過去のもの！"
"13320-32-地下生活者" = "「死」という絶対的な真実に、我々はたどり着けない。"
"13320-33-地下生活者" = "それが不変の真理だからだ！"
"13320-34-地下生活者" = "だが、たしかに小鳥遊ホシノはこの世界で死に最も迫った存在となった。#n――キヴォトス最高の神秘、暁に囚われし太陽の神よ！"
"13320-35-地下生活者" = "あなたは6つ目の古則の答えへの手がかりとなる。"
"13320-36-地下生活者" = "これほどまでの神聖が「死」に晒された時に、#n何が起きるのか見せてくれたまえ！"
"13320-37-地下生活者" = "それが、勝利者たる小生に与えられし報酬だ！"
"13320-38-ホシノ" = "あの手帳には、書いてあるはずなんだ。"
"13320-39-地下生活者" = "（ええ……あなたは真実を知るべき存在です）"
"13320-40" = "……そう。必ず、見つけないと。"
"13320-41" = "（そこには、長らく欲してきた答えがあるでしょう）"
"13320-42" = "ねえ、さっきから誰と会話を……？"
"13320-43-ホシノ" = "もう付き合ってられません！#n生徒会は終わりです！"
"13320-44" = "あの時、私が怒らなければ……。"
"13320-45-ユメ" = "見て見て、ホシノちゃん。リュックサック型の水筒だって！#n便利そうじゃない？"
"13320-46" = "あの時、私が反対しなければ……。"
"13320-47-ホシノ" = "そのためにも……まずは先輩、これを受け取ってください。"
"13320-48-ユメ" = "うん……？"
"13320-49" = "あの時、私が生徒会に入らなければ……。"
"13320-50-ユメ" = "待って！"
"13320-51-ユメ" = "……ひんっ！？"
"13320-52" = "あの時、私が手を差し出さなければ……。"
"13320-53-ユメ" = "住民の皆さん！"
"13320-54-ユメ" = "署名をお願いします！"
"13320-55-ホシノ" = "……。"
"13320-56" = "そもそも、私がいなければ――"
"13320-57-ホシノ" = "――ユメ先輩は、死なずに済んだ。"
"13320-58-ホシノ" = "……あぁ。"
"13320-59-ホシノ" = "――やっぱり。"
"13320-60-ホシノ" = "ユメ先輩を殺したのは――"
"13320-61-ホシノ" = "――私だ。"
"13320-62-ホシノ" = "私のせいだ。"
"13320-63-ホシノ" = "私が殺したんだ。"
"13320-64-ホシノ" = "私が、私が……私が。"
"13320-65" = "私が。"
