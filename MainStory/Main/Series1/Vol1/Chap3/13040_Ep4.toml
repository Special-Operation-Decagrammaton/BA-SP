[translation]
"13040-1" = "第4話;流れ行くものたち"
"13040-2-ユメ" = "ひぃん、どうしてこうなっちゃったんだろ……"
"13040-3-ユメ" = "どうしてもこうしても、人を簡単に信じるのが悪い。"
"13040-4-ユメ" = "だってぇ……#n週90時間の労働で沢山お給料がもらえるって……"
"13040-5-詐欺師B" = "こんな廃れた自治区で、まともな仕事があると思ってるほうがどうかしてるぜ。"
"13040-6-詐欺師A" = "ハハッ、そんな頭でよく生きてられたな。#nちったぁ考えろよ！"
"13040-7-ユメ" = "お、お金はぁ……？"
"13040-8-詐欺師A" = "んなもん最初からあるわけねーだろ！#nバカじゃねーの！"
"13040-9-ユメ" = "こ、困ります、それじゃあ学校の借金が……！#nそれに早く帰らないと、後輩の子に心配されちゃう……"
"13040-10-詐欺師A" = "学校の前に、まずは自分の心配をしたらどうだ？"
"13040-11-詐欺師B" = "この建物は、我々が占拠してるんだからな！"
"13040-12-詐欺師A" = "後輩だか何だか知らねぇが、#nお仲間が助けにきてくれると思ってんなら諦め――"
"13040-13-詐欺師A" = "……ん？"
"13040-14-詐欺師B" = "チッ……#nなんだ、この揺れ……地震か？"
"13040-15-ホシノ" = "どけっ！！"
"13040-16-詐欺師A" = "なっ……！"
"13040-17-詐欺師B" = "なんだコイツ！？"
"13040-18-ユメ" = "ほ、ホシノちゃん……！？"
"13040-19-ホシノ" = "探しましたよ、先輩！#nこんな忙しい時にいなくならないでください！"
"13040-20-ホシノ" = "早く帰りましょう！"
"13040-21-詐欺師A" = "な、何しやがんだテメェ！"
"13040-22-詐欺師B" = "おい、さっさと奴らに連絡しろ！#nったく、あいつら寝てんじゃねえよなあ！？"
"13040-23-ホシノ" = "応援なら誰も来ない。#n下にいた奴らなら、全員倒したから。"
"13040-24-詐欺師A" = "何だと！？"
"13040-25-詐欺師A" = "あ、あれだけの人数を、たった一人で……！？"
"13040-26-詐欺師A" = "うああああぁっ！"
"13040-27-詐欺師B" = "ぐあああぁぁぁっ！？"
"13040-28-ユメ" = "ひ、ひぃぃいん……怖かったよぉ、ホシノちゃん……"
"13040-29-ユメ" = "また変な大人に騙されて、いい加減学習してくださいよ……"
"13040-30-ユメ" = "でもぉ……"
"13040-31-ホシノ" = "どんどん人が減って、不良ばっかりのスラムになって……。"
"13040-32-ホシノ" = "今のアビドスは無法地帯なんですよ。"
"13040-33-ホシノ" = "知らない人は、全員悪い奴だと思ってください。"
"13040-34-ユメ" = "……でも、もし本当に困ってる人だったらどうするの？"
"13040-35-ホシノ" = "そんな人はいません！#n誰もかれも、みんな悪党です！"
"13040-36-ユメ" = "そう、なのかな……。"
"13040-37-ホシノ" = "手を差し伸べたって、すぐ裏切られるんです！#nそんなんじゃ学校を守れません！"
"13040-38-ホシノ" = "先輩、今からでも……"
"13040-39-ユメ" = "ホシノちゃん。"
"13040-40-ユメ" = "……？"
"13040-41-ユメ" = "違うよ、ホシノちゃん。#nそれは違う。"
"13040-42-ホシノ" = "ゆ、ユメ先輩……？"
"13040-43-ユメ" = "大事な話だから、よく聞いて。"
"13040-44-ユメ" = "あの……ちょっと、近いんじゃ……"
"13040-45-ユメ" = "疑念、不信、暴力、嘘……#nそういうものを当たり前だと思うようになったら、"
"13040-46-ユメ" = "私たちもいつか、自分を見失っちゃうよ。"
"13040-47-ユメ" = "……。"
"13040-48-ユメ" = "そうやってアビドスを取り戻しても、#nそれは私たちが思い描いたアビドスにはならない。"
"13040-49-ユメ" = "もし、アビドスに人が帰ってきてくれたとして……#nそんな街になっちゃってたら……私は悲しいよ。"
"13040-50-ユメ" = "だからね、ホシノちゃん。#n困ってる人がいたら、手を差し伸べるの。#nお腹を空かせてたり、寒さに凍えてる人がいたら助けてあげるの。"
"13040-51-ユメ" = "……。"
"13040-52-ユメ" = "うまく伝えられてる自信は無いけど……"
"13040-53-ユメ" = "ホシノちゃんなら私が何を言いたいのか、分かってくれるよね？"
"13040-54-ホシノ" = "……それで裏切られたら、どうするんですか？#n今日みたいに、また危険な目に遭ったら？"
"13040-55-ユメ" = "……その時は、ホシノちゃんが助けてくれるでしょ？"
"13040-56-ホシノ" = "…………まあ、行きますけど。"
"13040-57-ユメ" = "ふふっ。"
"13040-58-ホシノ" = "な、なにを笑ってるんですか！"
"13040-59-ユメ" = "んー？#nホシノちゃんの言葉を忘れないように、メモしておこうかなって思って！"
"13040-60-ホシノ" = "はぁ！？"
"13040-61-ホシノ" = "ちょっ、書かないでください！#nっていうか何ですかその変な手帳！"
"13040-62-ホシノ" = "いい加減、新しいのに替えないんですか？#nもう小学生じゃないんですから……"
"13040-63-ユメ" = "そうだ、ユメ先輩。#n一つ良い作戦を思いつきまして……"
"13040-64-ホシノ" = "これなら、アビドスの治安も良くなると思うんです！"
"13040-65-ホシノ" = "……ユメ先輩？"
"13040-66-ホシノ" = "……ユメ先輩？"
"13040-67-ホシノ" = "……。"
"13040-68-ホシノ" = "ユメ先輩……"
"13040-69-ホシノ" = "……。"
"13040-70-ホシノ" = "…………。"
"13040-71-ホシノ" = "こ、ここは……"
"13040-72-ホシノ" = "…………。"
"13040-73-ホシノ" = "ああ、そっか……"
"13040-74-ホシノ" = "……そうだ。"
"13040-75-ホシノ" = "生徒会室を、閉めに来たんだった……"
"13040-76-ホシノ" = "どれくらい寝てたんだろう……"
"13040-77-ホシノ" = "……。"
"13040-78-ホシノ" = "閉めないと、いけないのに……"
"13040-79-ホシノ" = "……。"
"13040-80-ホシノ" = "……明日にしよう。"
"13040-81-ホシノ" = "明日こそ、閉めますから…………先輩。"
"13040-82-ノノミ" = "あれ、君は……"
"13040-83-ノノミ" = "お待ちしてました！#n副生徒会長さん！"
"13040-84-ホシノ" = "えっ……私？"
"13040-85-ノノミ" = "はい！お話があるんです！"
"13040-86-ホシノ" = "……話って？"
"13040-87-ノノミ" = "わ、私は……私は確かに、ネフティスグループの者です。"
"13040-88-ノノミ" = "その事実を変えることはできませんが……#nこんな私でも、できることがあります！"
"13040-89-ホシノ" = "できること……？"
"13040-90-ノノミ" = "このゴールドカードで、学校の借金を全て返済するんです！"
"13040-91-ホシノ" = "え、えっと……何？#nゴールドカード……？"
"13040-92-ノノミ" = "あっ、その……これは私専用のクレジットカードで……#nこれを使えば、ネフティスの資金を引き出せるんです。"
"13040-93-ホシノ" = "……あのさ、ちゃんと考えて話してる？"
"13040-94-ノノミ" = "……！！"
"13040-95-ホシノ" = "そのカードで借金を返済するって意味、ちゃんと分かってるの？"
"13040-96-ノノミ" = "い、意味、というのは……"
"13040-97-ノノミ" = "善意から言ってるのは分かる。#nでも、他の人はそれをどう受け取ると思う？"
"13040-98-ノノミ" = "そのカードはネフティスの物でしょ。#nつまり、学校の借金を返したのはネフティスってことになる、君じゃなくて。"
"13040-99-ノノミ" = "わ、私は……"
"13040-100-ホシノ" = "自由に使えるからといって、そのお金は君の物じゃないんだよ、お嬢さん。"
"13040-101-ホシノ" = "これまで、自分でお金を稼いだことは？#n家のお手伝いでも良いけどさ。"
"13040-102-ノノミ" = "それは……"
"13040-103-ホシノ" = "そのお金は誰が用意したものなのか、よく考えた方が良い。"
"13040-104-ホシノ" = "そのカードで借金を返済した瞬間、#nこの学校の所有権はネフティスのものになる。少なくとも連中はそう思うだろうね。"
"13040-105-ホシノ" = "で、では……"
"13040-106-ノノミ" = "どうすれば、アビドスの借金を返せるのでしょうか？"
"13040-107-ホシノ" = "……。"
"13040-108-ホシノ" = "アビドスの生徒として稼いだお金で、返せばいいんじゃない？"
"13040-109-ホシノ" = "……。"
"13040-110-ノノミ" = "……あなたのように、ですか？"
"13040-111-ノノミ" = "……うん？"
"13040-112-ホシノ" = "……分かりました。#n出直してきます。"
"13040-113-ノノミ" = "それと、私は「お嬢さん」じゃありません。"
"13040-114-ノノミ" = "ノノミです、ホシノ先輩。"
"13040-115-ホシノ" = "……え？"
"13040-116-ホシノ" = "では、また来ますね。"
"13040-117-ホシノ" = "えぇ……？"
"13040-118-ホシノ" = "せ、先輩！？どこですか！？"
"13040-119-ホシノ" = "ユメ先輩！#nここです！先輩！！"
"13040-120-ホシノ" = "ユメ先輩！！！"
"13040-121-ノノミ" = "……！！"
"13040-122-ホシノ" = "……。"
"13040-123-ノノミ" = "ほ、ホシノ先輩……"
"13040-124-ホシノ" = "………………………………。"
"13040-125-ホシノ" = "……なんだ、また君か。"
"13040-126-ノノミ" = "あ、あの……だ、大丈夫ですか……？"
"13040-127-ホシノ" = "……。"
"13040-128-ホシノ" = "入って良いって、誰が言ったの？#n中学生はお呼びじゃないよ。"
"13040-129-ノノミ" = "悲鳴が、聞こえたので……"
"13040-130-ノノミ" = "……あと。もう卒業したので、中学生じゃありません。"
"13040-131-ノノミ" = "ネフティスと協力関係にある学園に、進学することが決まりました。#nハイランダー鉄道学園……#nそろそろ、家に入学書類が届いているはずです。"
"13040-132-ホシノ" = "じゃあ、君は早くそっちに行くといい。#nこんなところで油売ってないでさ。"
"13040-133-ノノミ" = "……はい。#nなので最後に、ここを見ておきたくて。"
"13040-134-ノノミ" = "それで、校庭にいたら悲鳴が聞こえて……"
"13040-135-ノノミ" = "け、決してストーカーとかではありませんから！"
"13040-136-ホシノ" = "……そう。"
"13040-137-ホシノ" = "じゃあ、適当に見たら帰るんだよ。"
"13040-138-ノノミ" = "……聞きました。"
"13040-139-ノノミ" = "生徒会長の失踪事件……#nたしか、ユメさん……ですよね。"
"13040-140-ノノミ" = "問題が多かったから逃げた、と言う方もいますが……"
"13040-141-ノノミ" = "極秘とのお達しでしたが、私の耳にも入ってきました。#n生徒会長は、失踪したのではなく……"
"13040-142-ホシノ" = "それに、第一発見者は……"
"13040-143-ノノミ" = "す、すみません！#nこんな話を、先輩の前で……"
"13040-144-ホシノ" = "いいよ、そんなに気を遣わなくても。"
"13040-145-ホシノ" = "あの……"
"13040-146-ノノミ" = "もう砂漠に行くのは、やめたんですか……？"
"13040-147-ノノミ" = "生徒会長が発見されてからもずっと砂漠にいたのは、何かを……"
"13040-148-ノノミ" = "何かを、探していたからなんじゃ……？"
"13040-149-ノノミ" = "そ、そういえば、ここはアビドスの生徒会室ですよね？#n前は閉まっていたはずですが……"
"13040-150-ノノミ" = "もしかして、何か探し物ですか？"
"13040-151-ホシノ" = "……もう行くよ。"
"13040-152-ノノミ" = "あっ！ま、待ってください、先輩！"
"13040-153-ノノミ" = "ごほっ、ごほっ……埃が、こんなに……"
"13040-154-ホシノ" = "……もう随分と、掃除をしてないからね。#n一人でやる気も起きないし。#nそこ……気をつけて、床が傷んでるから。"
"13040-155-ホシノ" = "もともと別館は、そこまできちんと管理されてなかったけど。"
"13040-156-ノノミ" = "……はい、私も聞きました。#nキヴォトスで最も長い歴史を誇った本館は、もう砂漠の中に埋もれてしまったと……"
"13040-157-ホシノ" = "そうだね。#n私が入学したときの建物も、今は砂に埋もれてる。"
"13040-158-ノノミ" = "ホシノ先輩が入学してから、すぐこちらに移ったんですよね？"
"13040-159-ホシノ" = "……よく知ってるね？"
"13040-160-ノノミ" = "……まあ、それなりに。#nそれにしても別館なのに、だいぶ設備は整ってますね。"
"13040-161-ノノミ" = "あれ、学園祭の事務局……こんな部屋もあったんですね。"
"13040-162-ノノミ" = "「学園祭」というのは……もしかして、オアシス砂祭りのことでしょうか？"
"13040-163-ホシノ" = "ちょっ、勝手に……"
"13040-164-ノノミ" = "お祭りなら、私にも良いアイデアがあります！#nたとえば、新しいイベントを作ってみるとか！"
"13040-165-ノノミ" = "あとは……#nアイドルのライブなんてどうでしょう？"
"13040-166-ノノミ" = "……あれ。"
"13040-167-ノノミ" = "……何も、ありませんね。"
"13040-168-ホシノ" = "当然でしょ。#n砂祭りなんて、とっくの昔に無くなってる。"
"13040-169-ノノミ" = "……そうですね。#n確かに、そうでした……"
"13040-170-ホシノ" = "はあ……"
"13040-171-ホシノ" = "……それで、何のために来たの？"
"13040-172-ノノミ" = "え、先輩とアイドルを……"
"13040-173-ホシノ" = "そうじゃない。どうして私について来るのかってこと。"
"13040-174-ホシノ" = "学校の違う君に、先輩だなんて呼ばれる筋合いもないし。"
"13040-175-ホシノ" = "ハイランダー鉄道学園、だっけ？#nそこに入学するんじゃなかった？"
"13040-176-ノノミ" = "そ、それは……"
"13040-177-ホシノ" = "……このまま進学したら、ずっと後悔すると思うんです。"
"13040-178-ホシノ" = "なんで？#nネフティスとコネがある学園なんでしょ？"
"13040-179-ノノミ" = "はい。きっと、素晴らしい待遇で迎えてくれるでしょう。#n生徒会長にもなれると思いますし……"
"13040-180-ホシノ" = "へぇ、生徒会長に？#nいいんじゃない？"
"13040-181-ノノミ" = "……。"
"13040-182-ノノミ" = "……まあ、お嬢さんにも事情があるのは分かったよ。"
"13040-183-ホシノ" = "でも、ここに来たところで後悔するのは一緒。#nこんな何もない学校に来てどうするの？"
"13040-184-ホシノ" = "お嬢さ――いや、ノノミちゃんはまだ若いんだから。#nおじさんの言うことを素直に聞いておきなよ。"
"13040-185-ノノミ" = "（おじさん……？）"
"13040-186-ノノミ" = "おじさん、って……#n私と年の差はほとんど無いと思うんですが……"
"13040-187-ホシノ" = "中学生でしょ？"
"13040-188-ノノミ" = "もう卒業しましたけど……"
"13040-189-ホシノ" = "まあ、どっちでもいいよ。"
"13040-190-アヤネ" = "時間が無いので、ハイランダー鉄道学園について簡潔に説明します！"
"13040-191" = "鉄道の管理とそれに関する教育に特化した学園、ハイランダー。#nキヴォトス内の路線を一部管理していたり、#nそれ以外にも様々な事業を行なっています。"
"13040-192" = "ハイランダー鉄道学園に、自治区は存在しません。#nその代わり、彼女たちが管理している路線そのものが自治区としての役割を果たしています。"
"13040-193" = "たしかに珍しい形だねぇ。"
"13040-194" = "はい……#nあの監督官が話されていたように、#n組織間で何らかの軋轢があるのも本当のようです。"
"13040-195" = "鉄道を維持管理する事務組織と治安組織が、それぞれ独立しています。#n学園の行政を管理する集団は、[ruby=Central Control Center]中央管制センター[/ruby]……通称「CCC」と呼ばれているそうです。"
"13040-196" = "ハイランダーの生徒会って感じ？"
"13040-197-アヤネ" = "うん、あの双子は生徒会の役員みたい。"
"13040-198-アヤネ" = "最後に現れた[ruby=あさぎり]朝霧[/ruby]スオウさんは、#nそのCCCを牽制するために理事会から派遣された監督官のようで……"
"13040-199-アヤネ" = "お互いに牽制しているように見えたけど、#n確かなことはまだ何も……"
"13040-200-アヤネ" = "以上が、今わかっているハイランダー鉄道学園の情報です。"
"13040-201-ノノミ" = "あれ……？"
"13040-202-アヤネ" = "えっ……？"
"13040-203-アヤネ" = "い、一体誰が……？#nチャイムなんて、長いことずっと……"
"13040-204-ノゾミ" = "推参ー。"
"13040-205-ノゾミ" = "ハイランダーから来たCCCだけど、早く入れてくんない？#n……あれ、返事すら無いし。#nヒカリ、あれやっちゃって。"
"13040-206-ヒカリ" = "ヒカリ選手の必殺ピンポンダッシュ秒間16連打ー。"
"13040-207-アヤネ" = "ええぇっ！？"
"13040-208-セリカ" = "な、何よこいつら？"
"13040-209-ホシノ" = "うへ～、噂をすれば何とやらってやつかな？#nこんなにすぐ来るとは思わなかったけどね。"
"13040-210-スオウ" = "……話をややこしくするな[ruby=ダッシュする]、退く[/ruby]んだったら[ruby=ど]退[/ruby]け。"
"13040-211-ヒカリ" = "おぉー？"
"13040-212-ノゾミ" = "押すなって！"
"13040-213-スオウ" = "……失礼する。#n管理監督官の朝霧スオウだ。"
"13040-214-スオウ" = "……争うつもりで来たわけではないから安心してくれ。#nだが、こちらの時間も限られている。#n早いところ開けてもらえないだろうか。"
"13040-215-アヤネ" = "ど、どうしましょう……？"
"13040-216-ホシノ" = "……入ってもらおっか。#nチャイムを壊されるのも困るし。"
"13040-217" = "次回;砂漠横断鉄道"
