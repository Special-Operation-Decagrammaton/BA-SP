[translation]
"13380-1" = "第38話;約束"
"13380-2-ホシノ" = "ユメ、先輩……？"
"13380-3-ユメ" = "この手紙は、未来のホシノちゃんに送る手紙だよ。"
"13380-4-ユメ" = "私は3年生になったホシノちゃんを見られないけど……。"
"13380-5-ユメ" = "きっと、立派な先輩になってるんだろうなぁ。"
"13380-6-ホシノ" = "…………先輩。"
"13380-7-ユメ" = "どうどう？#n良い先輩になれた？"
"13380-8-ユメ" = "後輩の面倒は見られてる？#n守れるくらい頼もしい先輩になれたかな？"
"13380-9-ユメ" = "みんなと協力はできてる？"
"13380-10-ユメ" = "困った時に手を貸してくれる友達はできた？#nちゃんと未来に向かって進めてる？"
"13380-11-ユメ" = "……ちゃんと、「うへ～」って笑えてる？"
"13380-12-ホシノ" = "ユメ先輩っ！！"
"13380-13-ホシノ" = "せんぱい……せんぱいっ……！"
"13380-14-ホシノ" = "私……わたし、ずっと……。"
"13380-15-ホシノ" = "わ、わたし……っ……わたしっっ……！"
"13380-16-ホシノ" = "ユメ、ぜんぱいっ……！"
"13380-17-ホシノ" = "うっ……ううっ……！"
"13380-18-ホシノ" = "うあああああああああっっ――！！"
"13380-19-ホシノ" = "……いえ。"
"13380-20-ホシノ" = "トラブルを起こしたり、心配をかけてばっかりです……。"
"13380-21-ホシノ" = "役立たずで、バカな私は……。"
"13380-22-ホシノ" = "後輩に、いつも迷惑を……。"
"13380-23-ユメ" = "何だか、私と似てるような……。"
"13380-24-ホシノ" = "……ふふっ。#nそうですね、先輩みたいです。"
"13380-25-ユメ" = "良かった。#nやっと笑ってくれたね、ホシノちゃん。"
"13380-26-ユメ" = "……でも、私は知ってるよ？"
"13380-27-ユメ" = "ホシノちゃんは後輩のことをちゃんと守ってくれて、#n本当に困った時は、絶対に助けてくれる頼もしい子だって。"
"13380-28-ユメ" = "私の大切な後輩は、ちょっぴり意地悪だけど……。#n本当は誰よりも優しいんだって……ちゃんと、分かってるよ。"
"13380-29" = "全然、違います……。"
"13380-30-ユメ" = "めっ。"
"13380-31-ホシノ" = "……？"
"13380-32-ユメ" = "自分を責めないの。#nホシノちゃんはいつも頑張ってる、良い先輩だよ。"
"13380-33-ホシノ" = "……。"
"13380-34-ユメ" = "お疲れ様、ホシノちゃん。"
"13380-35-ユメ" = "大変だったよね……ずっと、一人で頑張って。"
"13380-36-ホシノ" = "……はい。"
"13380-37-ホシノ" = "みんなのためになれば良いなと思って……ずっと、ずっと。"
"13380-38-ホシノ" = "努力してきた、つもりです……。"
"13380-39-ホシノ" = "先輩がいなくなって、つらかったですけど……それでも、私は……。"
"13380-40-ユメ" = "よしよし、ホシノちゃん。#nいっぱい頑張ってきたんだね。"
"13380-41-ホシノ" = "……。"
"13380-42-ユメ" = "大丈夫……？#n息苦しくない？"
"13380-43-ホシノ" = "ユメ先輩……。"
"13380-44-ホシノ" = "会いたいです……。"
"13380-45-ホシノ" = "……会いたいです、先輩。"
"13380-46" = "うん……知ってるよ。"
"13380-47" = "でも、ホシノちゃんにはまだやることがあるでしょ？"
"13380-48" = "……やること。"
"13380-49" = "うん。"
"13380-50" = "後輩を守ってあげないと、ね。"
"13380-51" = "ホシノ"
"13380-52" = "[7cd0ff]対策委員会[-]"
"13380-53" = "[log=호시노]先輩……。[/log]"
