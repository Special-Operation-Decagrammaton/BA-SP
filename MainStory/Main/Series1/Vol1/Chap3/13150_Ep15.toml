[translation]
"13150-1" = "第15話;副生徒会長の命令"
"13150-2-ユメ" = "ねえ、ホシノちゃん。"
"13150-3-ユメ" = "私はね。ホシノちゃんと初めて会った時、これは夢なんじゃないかなって思って、何度も頬をつねったの。"
"13150-4-ユメ" = "ホシノちゃんみたいな、可愛くて強くて、頼れる後輩がそばにいてくれるなんていう夢みたいなことが、本当に嬉しくて……。 "
"13150-5-ユメ" = "うーん、上手く説明できてないかもしれないけど……。"
"13150-6-ユメ" = "ただ、こうしてホシノちゃんと一緒にいられることが、私にとっては奇跡みたいなものなの。"
"13150-7-ホシノ" = "……毎日毎日、こうして一緒にいるじゃないですか。 "
"13150-8-ホシノ" = "昨日も今日も、明日もそうです。こんな当たり前なことで、何を大袈裟なことを。"
"13150-9-ユメ" = "はぅ……だって……。"
"13150-10-ホシノ" = "「奇跡」というのはもっとすごくて、珍しいもののことですよ。"
"13150-11-ユメ" = "……ううん、"
"13150-12-ユメ" = "ホシノちゃん。"
"13150-13-ユメ" = "私は、そうは思わないよ。"
"13150-14-ユメ" = "ねえ、ホシノちゃん。いつかホシノちゃんにも可愛い後輩ができたら、その時は――"
"13150-15-ユメ" = "いつも、そばにいてあげてね？#nそういう時間こそ、奇跡みたいなものだから。"
"13150-16-ユメ" = "きっと、いつかホシノちゃんにも分かるよ。"
"13150-17-ホシノ" = "こんな学校に後輩が来るなんて、"
"13150-18-ホシノ" = "たしかに奇跡ですね。"
"13150-19-ユメ" = "もう、そうじゃないよホシノちゃん。"
"13150-20-ホシノ" = "はいはい、分かりましたって。"
"13150-21-ユメ" = "……ふふっ。#nじゃあ、もしホシノちゃんに後輩ができたら……。"
"13150-22-ユメ" = "何があっても、必ず守ってあげるんだよ？"
"13150-23-ホシノ" = "まあ、善処しますよ。"
"13150-24-セリカ" = "うっ……。"
"13150-25-アヤネ" = "あれだけ攻撃したのに、"
"13150-26-アヤネ" = "息すら上がってないなんて……。"
"13150-27-ホシノ" = "……ごめんね。"
"13150-28-ホシノ" = "ヘリ3台が相手じゃ、うまく手加減できなくってさ。"
"13150-29-ホシノ" = "……これでアヤネちゃんの言う通り、前と同じことの繰り返しになっちゃったね。"
"13150-30-ホシノ" = "先生にも、謝っておいてもらえるかな。"
"13150-31-ホシノ" = "せっかく助けてもらったのに、ごめんって。"
"13150-32-アヤネ" = "……。"
"13150-33-セリカ" = "……。"
"13150-34-ホシノ" = "……二人はアビドスの「未来」だよ。"
"13150-35-ホシノ" = "こんな状態の学校に来てくれて、私は嬉しかったんだ。"
"13150-36-ホシノ" = "だから、守らなくちゃいけない。#n先輩は後輩のことを守ってあげるものだからね。"
"13150-37-アヤネ" = "……。"
"13150-38-セリカ" = "でも、"
"13150-39-セリカ" = "それじゃあ先輩が……！"
"13150-40-ホシノ" = "大丈夫だよ、セリカちゃん。"
"13150-41-ホシノ" = "私は三年だから、どっちにしろ卒業が近いしね。"
"13150-42-ホシノ" = "今度はアヤネちゃんとセリカちゃんが、後輩を守ってあげて。"
"13150-43-ホシノ" = "みんなには、アビドスの未来を背負う役目がある。"
"13150-44-ホシノ" = "列車砲さえなくなれば……きっと、全部解決するから。"
"13150-45-ホシノ" = "いなくなるのは、おじさんだけで良い。"
"13150-46-ホシノ" = "ノノミちゃん、シロコちゃん、アヤネちゃん、セリカちゃん……#nみんなで力を合わせれば、大丈夫。"
"13150-47-ホシノ" = "ユメ先輩と私のアビドス生徒会は、今日をもって解散。#nでも対策委員会は、これからも続くから。"
"13150-48-ホシノ" = "そしたら、次の後輩にもバトンをつないであげて。"
"13150-49-ホシノ" = "これが、アビドス生徒会長・[ruby=くちなし]梔子[/ruby]ユメの意志を継いだ……。"
"13150-50-ホシノ" = "副生徒会長・[ruby=たかなし]小鳥遊[/ruby]ホシノからの、最後の命令。"
"13150-51-シロコ" = "みんな、大丈夫？"
"13150-52-セリカ" = "シロコ先輩……。 "
"13150-53-セリカ" = "先輩が一番怪我してるじゃん……。"
"13150-54-シロコ" = "……ん。ホシノ先輩は？"
"13150-55-アヤネ" = "止められませんでした……。"
"13150-56-シロコ" = "……力不足。"
"13150-57-セリカ" = "シロコ先輩、これからどうしたら良いのかな……？"
"13150-58-シロコ" = "私も、分からない……。"
"13150-59-アヤネ" = "こんな先輩の姿、"
"13150-60-アヤネ" = "初めて見るような気がしますね……。"
"13150-61-シロコ" = "……。"
"13150-62-アヤネ" = "そういえば、生徒会長の契約書……。"
"13150-63-シロコ" = "あれがどうかしたの？"
"13150-64-アヤネ" = "今日で、あの契約書が結ばれてから二年が経ちます。"
"13150-65-シロコ" = "ということは……。"
"13150-66-アヤネ" = "会長が失踪したのは、二年前の今日……。"
"13150-67-ホシノ" = "……ノノミちゃん、待っててね。"
"13150-68-ホシノ" = "もう二度と……。"
"13150-69-ホシノ" = "……あの過ちは、繰り返さない。"
"13150-70" = "次回;反撃"
