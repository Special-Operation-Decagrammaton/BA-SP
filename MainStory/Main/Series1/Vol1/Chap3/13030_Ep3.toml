[translation]
"13030-1" = "第3話;ハイランダー鉄道学園"
"13030-2-ノゾミ" = "あはははっ、良いね良いねぇ！"
"13030-3-ノゾミ" = "うるさーい……。"
"13030-4-ノゾミ" = "でもスカッとしたっしょ？#nで、どんな感じ？"
"13030-5-ヒカリ" = "線路を塞いでいた岩の破砕、完了です！#n事業書の記載通り、線路も続いています。"
"13030-6-列車整備工の生徒A" = "列車の修理も済んでいるので、すぐに走り出せますよ！"
"13030-7-ノゾミ" = "オッケー、じゃあちゃっちゃと仕上げちゃおうか。試運転お願い。"
"13030-8-列車整備工の生徒A" = "はい、お任せください！"
"13030-9-ヒカリ" = "うぉー、動いた～。"
"13030-10-ノゾミ" = "パヒャヒャッ、良い調子じゃん！納期は一週間くらい前倒しできそう！"
"13030-11-ヒカリ" = "その、ところで……#nこれ、本当に大丈夫なんですか？"
"13030-12-ノゾミ" = "ん？"
"13030-13-ヒカリ" = "何がー……？"
"13030-14-ヒカリ" = "こ、ここって、他所の自治区ですよね……？"
"13030-15-ヒカリ" = "それが？"
"13030-16-ノゾミ" = "だからー？"
"13030-17-事務官" = "だ、だからー、じゃないですよ！"
"13030-18-事務官" = "許可も無くこんな工事をしたら、#nいったい何を言われることか……"
"13030-19-事務官" = "このままじゃ、武力衝突の可能性も……"
"13030-20-ヒカリ" = "まー良いんじゃなーい？"
"13030-21-ノゾミ" = "あはっ、そうそう。#nこの「砂漠横断鉄道」は、もう私らのものなんだし。"
"13030-22-事務官" = "はい！？"
"13030-23-事務官" = "アビドス砂漠横断鉄道、51％以上かくほー。"
"13030-24-ノゾミ" = "即ち、この鉄道は、もう私らCCCの所有物。#nまあ正確にはちょっと違うけど気にしなーい。"
"13030-25-ヒカリ" = "で、ですが契約書も無しに工事を進めるだなんて……"
"13030-26-ヒカリ" = "良いの良いの！"
"13030-27-ノゾミ" = "そんなこと言ってたら、工期に間に合わないっしょ？時は金なりってね。"
"13030-28-ヒカリ" = "工事はシュバっと、行政はそれなりに、だねー。"
"13030-29-事務官" = "CCCがそのように判断したなら、大丈夫ってことで……"
"13030-30-事務官" = "ほ、本当にいいんですよね？"
"13030-31-ヒカリ" = "メイビー。"
"13030-32-ノゾミ" = "大丈夫だって、ほら進めるよ！"
"13030-33" = "何してるの、あんた達！"
"13030-34-ノゾミ" = "バレたー。"
"13030-35-ノゾミ" = "わお、思ったより早かったじゃん。"
"13030-36-事務官" = "やっぱり問題になったじゃないですか！"
"13030-37-アヤネ" = "ハイランダー鉄道学園の皆さん！ここはアビドス自治区です！#n今すぐ止まってください！"
"13030-38-ヒカリ" = "へぇ？"
"13030-39-アヤネ" = "私たちの許可無しに、アビドス自治区で行政活動なんて言語道断！"
"13030-40-アヤネ" = "ゲヘナの皆さんといい、どうしてこう……"
"13030-41-アヤネ" = "常識が通じない方が多すぎませんか！？"
"13030-42-アヤネ" = "お、落ち着いて、アヤネちゃん……"
"13030-43-ノゾミ" = "怒ってるー？"
"13030-44-ノゾミ" = "だね。"
"13030-45" = "[s] \"何をしてるのか、聞かせてもらってもいいかな？\""
"13030-46-ヒカリ" = "どなたー？"
"13030-47-ノゾミ" = "大人ぁ……？"
"13030-48-ヒカリ" = "あ、あの方は……シャーレの先生です！"
"13030-49-ヒカリ" = "シャーレ？"
"13030-50-ノゾミ" = "先生？"
"13030-51-ヒカリ" = "学園間の問題解決、という名目で破壊活動をしている人です！"
"13030-52" = "[s] \"…………。\""
"13030-53-事務官" = "前に私たちの列車を吹き飛ばしたのも、#nシャーレの先生とのこと！"
"13030-54-事務官" = "他にも恐ろしい噂がありまして、#nなんと、裸で……"
"13030-55" = "[s1] \"ひ、人違いじゃないかな……\"\n[s2] \"う、噂って怖いね……\""
"13030-56-ホシノ" = "おじさんの知らないとこで何してるのさ、先生……。"
"13030-57-シロコ" = "ん、さすが先生。"
"13030-58-セリカ" = "シロコ先輩がどうして自慢げなのよ。"
"13030-59-ノノミ" = "とにかく、ここは私たちの自治区です！#n止まってください！"
"13030-60-ノノミ" = "どんな理由があるにせよ、協議から入るのが筋では！？"
"13030-61-ノゾミ" = "ノゾミ、どうする？"
"13030-62-ノゾミ" = "どうするも何も、いつも通りでしょ。"
"13030-63-アヤネ" = "……え？#nな、何を……？"
"13030-64-セリカ" = "う、うわっ！？危ないじゃないの！？"
"13030-65-ヒカリ" = "いつも通り、後始末は事務官が何とかするでしょ。#nパヒャッ、気にしない気にしなーい。"
"13030-66-ヒカリ" = "妙案妙案ー。"
"13030-67-ノノミ" = "これは、砂漠横断鉄道が動いて……！？"
"13030-68-アヤネ" = "ハイランダーが列車に乗り込みました！#nこのままでは逃げられてしまいます！"
"13030-69-セリカ" = "どうするの！？"
"13030-70-シロコ" = "――追いかける。"
"13030-71-ホシノ" = "……ああ、列車を修理してたんだ。#n理由はあとで聞くとして……#nまずは追いかけようか。"
"13030-72-ノノミ" = "アビドスでの身勝手な行為、見過ごすわけにはいきません！#n……きちんと説明してもらいます！"
"13030-73-アヤネ" = "先生、指揮を！"
"13030-74" = "[s3] \"そろそろ何か起こると思ってたよ……\"\n[s4] \"行こう、みんな！\""
