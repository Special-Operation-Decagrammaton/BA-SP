[translation]
"13355-1-ホシノ" = "きみたちに、このくるしみは……。"
"13355-2-シロコ" = "ううん、知ってる。"
"13355-3-シロコ" = "だって、私は……。"
"13355-4-地下生活者" = "あ、ああっ……なんだ、アレは……？"
"13355-5-地下生活者" = "……死の神、アヌビス？"
"13355-6-地下生活者" = "あ、あんなもの、無理に決まっている。"
"13355-7-地下生活者" = "なぜ二つの神聖が同時に？"
"13355-8-地下生活者" = "それも、ホルスに匹敵するほどの存在が……。"
"13355-9-地下生活者" = "……なぜ、なぜ、なぜ！"
"13355-10-地下生活者" = "なぜだッ――！！"
"13355-11-地下生活者" = "こんなチートが許されるのか！？"
"13355-12-地下生活者" = "コデックスに反している！ルール違反だろこんなの……！#nクソッ、匿名の行人は何をしている……あの役立たずが！"
"13355-13-地下生活者" = "こんな存在がいるなら先に言えよッ！"
"13355-14-地下生活者" = "「セトの[ruby=ふんぬ]憤怒[/ruby]」の顕現が、止まってしまった……。"
"13355-15-地下生活者" = "……これでは、エンディングにたどり着けない。"
"13355-16-地下生活者" = "いや、今こそ五つ目の攻略法の出番だ。"
"13355-17-地下生活者" = "まさか、ここまで手こずらせてくるとは……[USERNAME]よ！"
"13355-18" = "だが、最後に笑うのは――"
"13355-19-地下生活者" = "この小生に決まっているッッ！"
"13355-20" = "次回;手帳"
