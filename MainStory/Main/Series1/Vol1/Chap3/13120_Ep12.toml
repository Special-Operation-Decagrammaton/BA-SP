[translation]
"13120-1" = "第12話;対策委員会の始まり"
"13120-2" = "アビドス高等学校・駐輪場"
"13120-3-ホシノ" = "いやぁ、ちょっと乱暴だったかなぁ……。 "
"13120-4-ホシノ" = "お名前は？"
"13120-5-？？？" = "……シロコ[ruby=すなおおかみ]。砂狼シ[/ruby]ロコ。"
"13120-6-ホシノ" = "へぇ……シロコちゃんっていうんだ。#nそれで、シロコちゃんはここで何をしてたんだい？ "
"13120-7-シロコ" = "……。"
"13120-8-ホシノ" = "ここさ、廃墟に見えるけど……一応アビドス分校――#nいや、アビドス本校なんだよ。"
"13120-9-ノノミ" = "その制服……初めて見ました。"
"13120-10-ホシノ" = "ね。それに、そんな薄着じゃ寒いよ。 "
"13120-11-ホシノ" = "えっと、シロコちゃんはどこの学園？"
"13120-12-シロコ" = "……分からない。"
"13120-13-ノノミ" = "……？"
"13120-14-シロコ" = "気づいたら、ここにいた。#n名前以外……分からない……"
"13120-15-ホシノ" = "そ、それって……もしかして記憶喪失！？#n最近流行ってるっていうアレ？おじさん、そういうのちょっと疎いんだよな～"
"13120-16-ノノミ" = "（おじさん……？）"
"13120-17-ノノミ" = "では……シロコちゃんは、名前以外何も分からない、と……？#n通っている学園も、電話番号も、メールアドレスも……？"
"13120-18-シロコ" = "（こくり）"
"13120-19-ノノミ" = "ほ、ホシノ先輩、どうしましょう？"
"13120-20-ノノミ" = "ん～困ったねぇ。 "
"13120-21-ホシノ" = "とりあえず……なか入ろっか、シロコちゃん。 "
"13120-22-ノノミ" = "えっ！？い、一緒に行くんですか？"
"13120-23-ホシノ" = "これ、巻いておきな～"
"13120-24-シロコ" = "マフラー……？"
"13120-25-ホシノ" = "うん。無いよりはいいかなって。 "
"13120-26-ノノミ" = "……。"
"13120-27-ホシノ" = "どう？ちょっとはマシになったでしょ？"
"13120-28-シロコ" = "……うん。 "
"13120-29-シロコ" = "あったかい。"
"13120-30-ホシノ" = "うへ～。よく似合ってるよ、シロコちゃん。#nそのマフラー、おじさんがセールで買ったものなんだけどさ、大事に使ってよね？"
"13120-31-シロコ" = "ん、分かった。"
"13120-32-ノノミ" = "……。 "
"13120-33-ホシノ" = "どうしたの、ノノミちゃん。 "
"13120-34-ノノミ" = "ホシノ先輩、今おじさんって……？"
"13120-35-ホシノ" = "……ん？"
"13120-36-ノノミ" = "それに、うへ～って……。"
"13120-37-ホシノ" = "……なに言ってるの、いつも通りのおじさんだよ。"
"13120-38-ノノミ" = "また……。"
"13120-39-ホシノ" = "あ～……。"
"13120-40-シロコ" = "っくしゅん。"
"13120-41-ホシノ" = "と、とにかく早く入ろっか。#nシロコちゃん鼻水垂らしてるし。"
"13120-42-ノノミ" = "あ、はい！#nシロコちゃん、行きましょう。"
"13120-43-ホシノ" = "うへ～、ピッタリだね。#n予備の制服が残ってて良かったよ。"
"13120-44-シロコ" = "ん。"
"13120-45-ノノミ" = "ひとまず、これで我慢してください。#nあとで新しいお洋服を用意しますから。"
"13120-46-シロコ" = "大丈夫。 "
"13120-47-ノノミ" = "でも、これはアビドスの旧制服なので……。"
"13120-48-シロコ" = "（ふるふる）"
"13120-49-ホシノ" = "それ、気に入ったの？"
"13120-50-ノノミ" = "うーん、シロコちゃんが良いのであれば、構いませんが……。"
"13120-51-シロコ" = "やっぱり、強行突破しかない。"
"13120-52-セリカ" = "いやいや、いくら何でも無茶よ。"
"13120-53-シロコ" = "私が偵察に行って、#n兵士の数や配置、補給路、監視カメラの場所を調べれば……。"
"13120-54-セリカ" = "銀行とは規模が違うでしょ。"
"13120-55-シロコ" = "……ホシノ先輩がいれば、勝てる。"
"13120-56-シロコ" = "……先輩？ "
"13120-57-ホシノ" = "うへ～、ごめんごめん。#nちょっと昔のことを思い出して、ぼーっとしちゃってたよ。"
"13120-58-ホシノ" = "鼻水を垂らしてたシロコちゃんも可愛かったな～って。#nいつの間にか、こんな恐ろしいセリフを言うようになっちゃったけど。"
"13120-59-ノノミ" = "そんな時もありましたね☆"
"13120-60-シロコ" = "恥ずかしいから、その話は……。"
"13120-61-ホシノ" = "あの頃のシロコちゃんはどこに行ったんだろ……。"
"13120-62-セリカ" = "先輩たちの出会いって、そんな昔じゃないでしょ！"
"13120-63-ノノミ" = "大丈夫ですよ、シロコちゃんは今も可愛いですから。"
"13120-64-シロコ" = "……ん。"
"13120-65-ホシノ" = "あれから一瞬だったけど、#n対策委員会ができてから、まだ一年しか経ってないんだよね。"
"13120-66-ノノミ" = "……。"
"13120-67-シロコ" = "……うん。 "
"13120-68-ホシノ" = "あれ、シロコちゃん？ "
"13120-69-シロコ" = "ホシノ、勝負しよ。"
"13120-70-ノノミ" = "しょ、勝負って！？"
"13120-71-ホシノ" = "私は自分より強い人の言葉しか聞かない。"
"13120-72-ホシノ" = "だから、勝負。"
"13120-73-ホシノ" = "……元気良いねぇ。"
"13120-74-ホシノ" = "ま、付き合ってあげるよ。"
"13120-75-ノノミ" = "良いんですか、ホシノ先輩！？ "
"13120-76-ホシノ" = "前にも言ったけど、1対1の戦いでおじさんは負けたことないんだよね。#nなのに、またやりたいんだ？"
"13120-77-シロコ" = "ん、今度こそ負けない。"
"13120-78-ホシノ" = "へぇ、じゃあ負けたらどうする？#nシロコちゃんは何をしてくれるの？"
"13120-79-シロコ" = "何でも言うこと聞く。"
"13120-80-ホシノ" = "じゃあ、負けたらアビドスに入学して、おじさんのことを先輩って呼んでもらおうかな。"
"13120-81-シロコ" = "ん、分かった。"
"13120-82-ノノミ" = "ほ、ホシノ先輩！"
"13120-83-ホシノ" = "シロコちゃん、これ何！？"
"13120-84-ノノミ" = "ネジにボルト、薬莢まで……どこから持ってきたんですか？"
"13120-85-シロコ" = "ん、奪った。"
"13120-86-ノノミ" = "はい！？"
"13120-87-ノノミ" = "う、奪ったってどこから！？"
"13120-88-シロコ" = "街の古鉄屋。#n今度は奪ってきたところに売って、学校の借金を返す。"
"13120-89-ホシノ" = "売って、奪って、"
"13120-90-ホシノ" = "また売るってこと……？"
"13120-91-ノノミ" = "……えっ！？"
"13120-92-シロコ" = "シロコちゃん、それはダメだよ。"
"13120-93-シロコ" = "なんで？"
"13120-94-ホシノ" = "なんでって、えっと……。"
"13120-95-？？？" = "ここにいたのか！#nウチのトラックを奪いやがって！"
"13120-96-ノノミ" = "えっ！？ "
"13120-97-シロコ" = "シロコちゃん、トラックまで奪ってきたの！？"
"13120-98-シロコ" = "ん、ついでに。"
"13120-99-ホシノ" = "すみません。#nこの子、まだ色々よく分かってなくって……。"
"13120-100-ノノミ" = "私が弁償しますので……！"
"13120-101-ホシノ" = "ノノミちゃん、まずは謝ろう！"
"13120-102-ノノミ" = "は、はい！申し訳ありませんでした……"
"13120-103-ノノミ" = "シロコちゃんも！"
"13120-104-シロコ" = "……ん、ごめんなさい。"
"13120-105-廃品回収業者" = "謝って済むわけねぇだろ！"
"13120-106-廃品回収業者" = "……ったく、今回だけだからな。"
"13120-107-ノノミ" = "はい……。"
"13120-108-ホシノ" = "何とかなって良かったね、"
"13120-109-ホシノ" = "シロコちゃん。"
"13120-110" = "ん、次はバレないようにする。"
"13120-111-ホシノ" = "シロコちゃん！？"
"13120-112-廃品回収業者" = "本当に反省してるんだろうな！？"
"13120-113-廃品回収業者" = "まあ、今回はアビドスの生徒だったから許してやるよ。#nにしても、まだ残ってる人がいたとはな。"
"13120-114-ホシノ" = "……。"
"13120-115-廃品回収業者" = "不要な鉄があったら、いつでも連絡してくれ。"
"13120-116-廃品回収業者" = "そんじゃ、またな。"
"13120-117-ノノミ" = "……。"
"13120-118-ノノミ" = "……あれ？ "
"13120-119-ノノミ" = "見てください、ホシノ先輩、シロコちゃん！#n桜の蕾が開いてます！"
"13120-120-ホシノ" = "……本当だ。"
"13120-121-ノノミ" = "あっという間に、冬が終わってしまいますね。"
"13120-122-ホシノ" = "……うん。"
"13120-123-ノノミ" = "楽しい時間、でしたのに……。"
"13120-124-ホシノ" = "……そしたら、ノノミちゃんとはお別れだね。"
"13120-125-ノノミ" = "……。"
"13120-126-ホシノ" = "ハイランダーに入学するんだから、色々準備が必要なんじゃない？"
"13120-127-ホシノ" = "ほらほら、シロコちゃんノノミちゃん！笑って～！"
"13120-128-シロコ" = "ん。"
"13120-129-ノノミ" = "わ、わざわざ撮る必要、ありますか……？"
"13120-130-ホシノ" = "なに言ってるのさ、当たり前でしょ！#nお祝いの時は、記念に写真を撮るものだから！"
"13120-131-ホシノ" = "シロコちゃん、そのマフラー暑くない？#nそろそろ外したら？"
"13120-132-シロコ" = "ううん、大丈夫。"
"13120-133-ホシノ" = "今日から、ここがアビドス廃校対策委員会の教室だよ。"
"13120-134-ノノミ" = "はい！"
"13120-135-シロコ" = "任せて、計画ならたくさんある。"
"13120-136-ノノミ" = "もしかして……。"
"13120-137-ホシノ" = "銀行強盗は却下だよ。"
"13120-138-ノノミ" = "私にも良い案があります！"
"13120-139-ノノミ" = "このゴールドカードで――"
"13120-140-ホシノ" = "それもダメ。"
"13120-141-ノノミ" = "……ですよね。"
"13120-142-ノノミ" = "……。"
"13120-143-シロコ" = "……。 "
"13120-144-アヤネ" = "急に黙ってどうしたの、先輩たち！"
"13120-145-セリカ" = "アヤネちゃんも何か言ってよ！"
"13120-146-アヤネ" = "あはは……先輩たちには、それだけ思い出があるでしょうから。"
"13120-147-ホシノ" = "うへへ、ごめんね。#nアヤネちゃんとセリカちゃんが来た時のことも、#nおじさんにとって大切な思い出だよ。"
"13120-148-ノノミ" = "うんうん。二人とも、すっごく可愛かったです。"
"13120-149-シロコ" = "ん。"
"13120-150-アヤネ" = "あ、あの失礼します！#n皆さんがアビドス高校の生徒で合っていますか？"
"13120-151-セリカ" = "私たちも、ここに入学したいの。"
"13120-152-アヤネ" = "アビドスのために、何かしたいんです……！"
"13120-153-セリカ" = "たしか、復旧委員会よね？"
"13120-154-アヤネ" = "対策委員会だよ、セリカちゃん。"
"13120-155-セリカ" = "そう、それ！#nとにかく、これからよろしくね、先輩！"
"13120-156-アヤネ" = "よろしくお願いします！"
"13120-157-セリカ" = "わ、私たちのことは良いから……！"
"13120-158-アヤネ" = "あはは……まあ、色々ありましたね。"
"13120-159-ノノミ" = "アヤネちゃんとセリカちゃんのおかげで、#nアビドス高校アイドル計画も夢じゃ……！"
"13120-160-ホシノ" = "おじさんには無理かな～。#nそういうのは、若い子に任せるよ。"
"13120-161-ノノミ" = "では、アヤネちゃんとセリカちゃんの二人ユニットなら……？"
"13120-162-シロコ" = "うん、良いと思う。"
"13120-163-ホシノ" = "それは楽しみだなぁ～。"
"13120-164-アヤネ" = "なに勝手に進めてるのよ！"
"13120-165-アヤネ" = "そ、そうです。#nやるのならみんな一緒に……。"
"13120-166-ノノミ" = "……「対策委員会」がなくなるのは、嫌です。"
"13120-167-アヤネ" = "ノノミ先輩？"
"13120-168-ノノミ" = "名前が消えても、私たちの思い出までなかったことにはなりませんが……。"
"13120-169-ノノミ" = "それでも、私は嫌なんです。"
"13120-170-ノノミ" = "シロコちゃんのおかげで、私はアビドスに残る決心がつきました。"
"13120-171-ノノミ" = "シロコちゃんのおかげで、ホシノ先輩にまた笑顔が戻ってきました。"
"13120-172-ノノミ" = "なのに、こんな形で解散なんて……。"
"13120-173-セリカ" = "……ノノミ先輩。"
"13120-174-シロコ" = "……。"
"13120-175-ノノミ" = "シロコちゃんはどう思いますか？"
"13120-176-シロコ" = "……私は。"
"13120-177-シロコ" = "私にとって、対策委員会は……。"
"13120-178-ホシノ" = "言わなくても分かるよ。#nシロコちゃんにとっても、ここは始まりの場所。"
"13120-179-シロコ" = "……ん。"
"13120-180-ノノミ" = "それは、ホシノ先輩にとっても、ですよね？"
"13120-181-ホシノ" = "もちろん、そうだけど……？"
"13120-182-ノノミ" = "「アビドス生徒会」には、生徒会長とホシノ先輩の思い出があるはずです……。"
"13120-183-ノノミ" = "ホシノ先輩にだけ、悲しい思いをさせるわけにはいきません。"
"13120-184-ホシノ" = "……うへへ、おじさんなら大丈夫だよ。"
"13120-185-シロコ" = "ホシノ先輩は、今もアビドス生徒会の名前を残してる。"
"13120-186-シロコ" = "生徒会長とのつながりを失わないため、だよね？"
"13120-187-シロコ" = "本当に諦めて良いの？"
"13120-188-ホシノ" = "気にしてないって言ったら、嘘になるかもしれないけど……。"
"13120-189-シロコ" = "先輩が生徒会長になりたがらなかったのは、#n前の会長がいるからじゃない？"
"13120-190-ホシノ" = "私が生徒会長になると、#nユメ先輩の死を認めることになるから、って言いたいんだよね。"
"13120-191-ホシノ" = "……まあ、それも否定はしないよ。"
"13120-192-ホシノ" = "でも……。"
"13120-193" = "今のおじさんにとっては……列車砲の行方のほうが、ずっと大事。"
"13120-194-シロコ" = "……。"
"13120-195-ノノミ" = "……。"
"13120-196-ホシノ" = "ユメ先輩が鉄道を取り戻そうとした理由は分からないけど……。"
"13120-197-ユメ" = "疑念、不信、暴力、嘘……#nそういうものを当たり前だと思うようになったら、"
"13120-198-ユメ" = "私たちもいつか、自分を見失っちゃうよ。"
"13120-199-ユメ" = "そうやってアビドスを取り戻しても、#nそれは私たちが思い描いたアビドスにはならない。"
"13120-200-ユメ" = "もし、アビドスに人が帰ってきてくれたとして……#nそんな街になっちゃってたら……"
"13120-201-ユメ" = "……私は悲しいよ。"
"13120-202-ホシノ" = "列車砲は、アビドスに存在しちゃいけない。"
"13120-203-ホシノ" = "絶対に見つけ出して、破壊する。"
"13120-204-ホシノ" = "だから、もう良いんだ。#n名前になんて拘らなくても。"
"13120-205-ノノミ" = "……。"
"13120-206-シロコ" = "……。"
"13120-207-アヤネ" = "……。"
"13120-208-セリカ" = "……。"
"13120-209-ホシノ" = "それに、対策委員会も大事な思い出だしね。"
"13120-210-ホシノ" = "ノノミちゃん、シロコちゃん、アヤネちゃん、セリカちゃん……#nみんなと過ごす今が、おじさんは楽しいんだよ。"
"13120-211-ノノミ" = "ですが……。"
"13120-212-ホシノ" = "おじさんが良いって言ってるんだから、これで良いの。"
"13120-213-ホシノ" = "というか、まずは会場にたどり着かないと始まらないし。"
"13120-214-ホシノ" = "どうやって警備を突破するか考えないとね。"
"13120-215-ノノミ" = "……はい、先輩。"
"13120-216-シロコ" = "ん、分かった。"
"13120-217-セリカ" = "それじゃ、方向性は決まったわね？"
"13120-218-アヤネ" = "はい、明日の12時までにアビドス中央駅旧庁舎に行き、警備を突破。"
"13120-219-アヤネ" = "その後、契約続行の意思表示をします。"
"13120-220-セリカ" = "けど、私たち五人だけで、どうやって……。"
"13120-221-アヤネ" = "それを今から考えましょう。"
"13120-222-アヤネ" = "ただ、先ほどから一向に先生と連絡がつかないんです。"
"13120-223-セリカ" = "昨日は来てくれるって言ってたのに……。"
"13120-224-アヤネ" = "いつも忙しいから、こういうこともあるだろうけど……。"
"13120-225-ノノミ" = "うーん……。"
"13120-226-ノノミ" = "まさか、何かトラブルに巻き込まれていたり……。"
"13120-227-アヤネ" = "えっ！？"
"13120-228-セリカ" = "ど、どうしたのアヤネちゃん？"
"13120-229-ホシノ" = "な、何があったの！？ "
"13120-230-ノノミ" = "……ニュースですか？"
"13120-231-ニュース" = "……今朝、D.U.内のシャーレで原因不明の爆発が発生しました。"
"13120-232-セリカ" = "えぇ！？"
"13120-233-ノノミ" = "！！"
"13120-234-ニュース" = "負傷した[USERNAME]先生は、病院に緊急搬送されたようです。#n爆発の原因は、現在も究明中と……。"
"13120-235" = "次回;人質"
