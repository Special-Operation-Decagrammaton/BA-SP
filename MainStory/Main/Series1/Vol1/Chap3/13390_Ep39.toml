[translation]
"13390-1" = "第39話;制約解除"
"13390-2-シロコ" = "ホシノ先輩！"
"13390-3-セリカ" = "先輩！"
"13390-4-ノノミ" = "ホシノ先輩っ！"
"13390-5-アヤネ" = "先輩……。"
"13390-6-シロコ" = "まさか、本当に……。"
"13390-7-ホシノ" = "シロコちゃん、セリカちゃん、ノノミちゃん、アヤネちゃん……。#nそれと、シロコちゃん？"
"13390-8-ホシノ" = "風紀……いや、ヒナちゃんも。"
"13390-9-ヒナ" = "再会の挨拶は、あとにしましょう。"
"13390-10" = "そうだね……まずは、アレを何とかしよっか。"
"13390-11-地下生活者" = "……よくも小汚いマネを！！"
"13390-12-地下生活者" = "だが、[USERNAME]先生よ！"
"13390-13-地下生活者" = "小生には、五つ目の攻略法が残っています。"
"13390-14" = "「チートにはチートで対抗する」。"
"13390-15-地下生活者" = "イヒッ、ヒヒッ……ヒヒヒヒヒッ！！"
"13390-16-地下生活者" = "あなたの力、解析できましたよ。"
"13390-17-地下生活者" = "チートにも限界がある……そうでしょう？"
"13390-18" = "一度に指揮を行える対象は、最大で六人。"
"13390-19-地下生活者" = "それ以上は、統制が乱れる。"
"13390-20-地下生活者" = "これが、今まで得た情報を分析して得た結果！"
"13390-21-地下生活者" = "果たして、先生の指揮と小生の「神々の星座」……どちらが強いのか。"
"13390-22-地下生活者" = "ヒヒ、ヒヒヒヒヒッ……。#nたとえ何人でかかってこようと、相手になりませんがね。"
"13390-23-地下生活者" = "「セトの[ruby=ふんぬ]憤怒[/ruby]」には、どうやっても勝ち得ない！"
"13390-24-地下生活者" = "これこそが、真のチートだッッ！"
"13390-25" = "[ns1] \"お待たせ。\"\n[ns2] \"これからは、私の番だね。\""
"13390-26-アロナ" = "はい、先生！"
"13390-27-アロナ" = "プラナちゃんが「シッテムの箱」の奥にあった新しいプロセスを発見してくれました！"
"13390-28-プラナ" = "説明。#n「シッテムの箱」に私とアロナ先輩、二人のOSが存在することにより……。"
"13390-29-プラナ" = "今までの制約を解除し、さらなる演算処理が行えるようになりました。"
"13390-30-プラナ" = "先生、ご命令を。"
"13390-31" = "[ns] \"いこうか、これが私達の新しい[ruby=技術]コンテンツ[/ruby]だよ。\""
"13390-32-プラナ" = "命令確認。"
"13390-33-プラナ" = "シッテムの箱、制約解除。#nプロセス「ペレツ･ウザ」限定稼働開始。"
"13390-34-プラナ" = "認証完了。"
"13390-35-プラナ" = "先生の接続プロセスを確認。#nよろしくお願いします。"
"13390-36-プラナ" = "シッテムの箱、制約解除。#nプロセス「ペレツ･ウザ」限定稼働中。"
"13390-37-プラナ" = "待機中。#n先生、ご命令を。"
"13390-38-プラナ" = "今の私は無敵です。#n普段の2倍は強いです。"
"13390-39-プラナ" = "アロナ先輩と力を合わせて、先生をサポートします。"
"13390-40-地下生活者" = "……！"
"13390-41-地下生活者" = "何ィッ……？"
"13390-42-地下生活者" = "システムの改変だと……！？"
"13390-43-地下生活者" = "これまでの制約を解除……そんな事が！？"
"13390-44" = "[ns3] \"今度こそ、終わりだよ。\"\n[ns4] \"これ以上、アビドスで誰も死なせはしない。\""
"13390-45" = "[ns] \"……これ以上、アビドスの誰も悲しませはしない。\""
"13390-46-地下生活者" = "何を言っている……？"
"13390-47-地下生活者" = "それがこの勝敗に一体何の関係があるというのだ……！？"
"13390-48" = "[ns] \"「世界で」苦しんでいる「子ども」がいて……。\""
"13390-49" = "[ns] 助けてほしい、と手を伸ばしているのなら……。"
"13390-50" = "[ns5] \"いつ、いかなる時であっても――。\"\n[ns6] いつ、いかなる時であっても――。"
"13390-51" = "[ns7] \"子どもと共に生きていく[ruby=・   ・]大人[/ruby]として責任を負わなければならない。\"\n[ns8] 子どもと共に生きていく[ruby=・   ・]大人[/ruby]として責任を負わなければならない。"
"13390-52" = "[ns9] \"[ruby=こども]生徒[/ruby]が責任を負う世界なんて、あってはならないからね。\"\n[ns10] [ruby=こども]生徒[/ruby]が責任を負う世界なんて、あってはならないからね。"
"13390-53" = "[ns11] 大人のカードを取り出す。\n[ns12] 大人のカードを取り出す。"
"13390-54-地下生活者" = "なんだソレは！？"
"13390-55-地下生活者" = "……ンンッ？"
"13390-56-地下生活者" = "いったい……。"
"13390-57-地下生活者" = "……何なのだ！？"
"13390-58-地下生活者" = "お、おお――"
"13390-59-地下生活者" = "大人のカードッ……！？"
"13390-60" = "そ、そんなものが……どうして……。"
"13390-61-地下生活者" = "ルールは？コデックスは？#nそんな力に敵うわけがないだろう！？"
"13390-62-地下生活者" = "反則だッッ！"
"13390-63-地下生活者" = "あんなもの……あんなもの、許されるものか！"
"13390-64-地下生活者" = "そんなのナシだろ……カードなんて……ゲームでこれは、ズルだろう……？はあ……？？"
"13390-65-地下生活者" = "こんなの、チートだ……。"
"13390-66-地下生活者" = "チートだ、チート！"
"13390-67-地下生活者" = "チートだァァァァァッ！"
"13390-68-地下生活者" = "小生を、騙すとはッ！"
"13390-69-地下生活者" = "ノーゲームだ！"
"13390-70-地下生活者" = "分かったかッ！？"
"13390-71" = "接続を確認。"
"13390-72-プラナ" = "――なっ！？"
"13390-73-プラナ" = "先生からのメッセージを伝えます。"
"13390-74" = "[ns13] \"この世界を勝利と敗北でしか定義できない青二才に――\"\n[ns14] \"先生として、負けるわけにはいかないからね。\""
"13390-75-地下生活者" = "何だと……！？"
"13390-76-プラナ" = "つまり、大人になりきれなかったあなたのような者に構っている時間はない、#nという意味です。"
"13390-77-地下生活者" = "……！！！！"
"13390-78-プラナ" = "先生は忙しいので。#nちなみに、昨日も徹夜をしました。"
"13390-79-アロナ" = "（プラナちゃんが何だか怖いです……）"
