[translation]
"13410-1" = "第41話;残されたもの"
"13410-2" = "アビドスのとある中学校"
"13410-3-中学生A" = "ねぇ見た？#n廃校、決まったらしいよ。"
"13410-4-中学生B" = "……私たち、どうなるんだろ。"
"13410-5-中学生C" = "出ていくしかないんじゃない？"
"13410-6-中学生B" = "でも、まだアビドス高校が……。"
"13410-7-中学生A" = "あそこも生徒会が解散したって。#n自治区ごと、おしまいでしょ。"
"13410-8-中学生C" = "ネフティスもいなくなったわけだし。"
"13410-9-中学生B" = "けど、あそこの令嬢は卒業まで残るって……。"
"13410-10-中学生A" = "その人、学校で見かけた記憶なくない？"
"13410-11-中学生C" = "いい加減、ほかの進路を考えたほうが良いでしょ。"
"13410-12-スオウ" = "……もう、日が昇る時間か？"
"13410-13-スオウ" = "くっ……。"
"13410-14-スオウ" = "私は、まだ何も……#nいや、何を……"
"13410-15" = "何を、証明したかったんだろうな……。"
"13410-16-ノゾミ" = "おーい、かんとくかーん？"
"13410-17-ヒカリ" = "どこ行ったのー。"
"13410-18-アコ" = "いったい何があったんですか！？"
"13410-19-アコ" = "なぜ委員長がアビドスに？#nそれも治療中だなんて！？"
"13410-20" = "[s] \"アコ、まずは落ち着いて……。\""
"13410-21-アコ" = "落ち着いていられるわけがないでしょう！#nというか、先生のほうも大丈夫なんですか！？#n病院を抜け出したって聞きましたよ！"
"13410-22" = "[s1] \"私は大丈夫だよ。\"\n[s2] \"ちょっと疲れが溜まってただけみたい。\""
"13410-23-アコ" = "はぁ……委員長から事前に連絡はもらっていましたが、#nこんな事態になっているとは。"
"13410-24-アコ" = "……それも、先生から助けを求められていたなんて。"
"13410-25-アコ" = "委員長には、いつ連絡を？"
"13410-26" = "[ns] \"それは……。\""
"13410-27" = "[ns3] 集めた資料を整理する。\n[ns4] \"……これで準備は完了かな。\""
"13410-28-プラナ" = "待機中。先生、必要なものはありませんか？"
"13410-29" = "[s] \"ありがとう、プラナ。アロナは？\""
"13410-30-プラナ" = "アロナ先輩なら、寝ています。寝坊助です。#n何か仕事があれば、私に命令をしてください。"
"13410-31" = "[s5] \"それじゃあ……。\"\n[s6] プラナにいくつか頼み事をする。"
"13410-32" = "[ns] \"列車砲にはゲヘナが関わってるみたいだし、ヒナに連絡してもらえる？\""
"13410-33-プラナ" = "理解。すぐに処理します。"
"13410-34-アコ" = "とにかく、そこで待っていてくださいね！？"
"13410-35-アコ" = "私もすぐ向かいますから！"
"13410-36-アコ" = "自分から行く、ですか……？#nい、委員長、無理はなさらないで！"
"13410-37-アコ" = "良いから待っていてください！#n先生、またご連絡します！"
"13410-38" = "[ns] \"……どうやって謝ろうかな。\""
"13410-39-ノノミ" = "あら、先生。#nこんなところにいたんですね。"
"13410-40" = "[s] \"ノノミこそ、どこに行ってたの？\""
"13410-41-ノノミ" = "コインランドリーです！#nこの格好で、ずっと過ごすわけにはいきませんから☆"
"13410-42-ノノミ" = "ついでに風紀委員長さんのお洋服も洗ってきたのですが……#n大丈夫だったでしょうか？"
"13410-43" = "[s] \"大丈夫だと思うよ。\""
"13410-44-ノノミ" = "……そうですよね。#n噂よりも、ずっと優しそうな方ですし。"
"13410-45-ノノミ" = "もうすぐ会議ですから、そろそろ行きましょう、先生？"
"13410-46" = "[s] ノノミと教室に入る。"
"13410-47-ノノミ" = "ふわふわのお洋服ですよ～！"
"13410-48-シロコ" = "ん……ありがとう、ノノミ。"
"13410-49-アヤネ" = "すみません、ノノミ先輩。"
"13410-50-ノノミ" = "いえいえ、洗濯物を入れたら、ボタンを押すだけですし☆"
"13410-51-ノノミ" = "それに、これくらいの量なら一人で持てますから。"
"13410-52-セリカ" = "まぁ、私たちとしてはありがたいけど。"
"13410-53-ノノミ" = "あれ、そういえばホシノ先輩は……？"
"13410-54-アヤネ" = "保健室に向かいました。#nおそらく、風紀委員長さんも一緒かと。"
"13410-55-セリカ" = "えーっと……これは私ので……こっちはシロコ先輩のだよね？#nはい、持ってって。"
"13410-56-シロコ" = "う、うん。"
"13410-57-セリカ" = "どうしたの、先輩？"
"13410-58-アヤネ" = "あっ……。"
"13410-59" = "[ns] \"……………………。\""
"13410-60-セリカ" = "ちょっと先生！？#nなに生徒の洗濯物をジッと見てるのよ！"
"13410-61" = "[s] \"えっ、私は何も……。\""
"13410-62" = "本当にデリカシーがないんだからっ！#nシロコ先輩が恥ずかしがってるでしょ！"
"13410-63-シロコ" = "いや、別に……。"
"13410-64-ノノミ" = "あっ、先生……。#n良かったら、ホシノ先輩たちを呼んできていただけませんか？"
"13410-65-セリカ" = "早く出てってよね！#nはい、行った行った！"
"13410-66" = "[s] \"無罪を主張します……。\""
"13410-67" = "[ns7] \"ヒナ、ホシノ。\"\n[ns8] \"入っても良いかな？\""
"13410-68-ヒナ" = "……大丈夫、先生。"
"13410-69-ヒナ" = "……。"
"13410-70" = "[s] \"えっと……。\""
"13410-71-ヒナ" = "[ruby=たかなし]小鳥遊[/ruby]ホシノが寝ちゃったから、動けなくて。"
"13410-72" = "[s] \"うーん……。\""
"13410-73-ヒナ" = "アコを待たせてるし、そろそろ帰りたいのだけど……。"
"13410-74" = "[s] \"……もったいないような。\""
"13410-75-ヒナ" = "もう、いいから手伝って……！"
"13410-76" = "困っているヒナを助けるために、ホシノを起こした。"
"13410-77-アヤネ" = "皆さん、準備は良いですか？"
"13410-78-セリカ" = "もちろんよ！"
"13410-79" = "ん。"
"13410-80-ノノミ" = "うんうん。全員、揃いましたね☆"
"13410-81-ホシノ" = "ふわぁ……。"
"13410-82-セリカ" = "ところで、ホシノ先輩はずっとその格好でいるつもり？"
"13410-83-ホシノ" = "うん、着替えるのも面倒だからね～。"
"13410-84-ホシノ" = "あれ、ヒナちゃんは？"
"13410-85-アヤネ" = "風紀委員長さんは、少し前にゲヘナへ帰りました。"
"13410-86-ホシノ" = "えー、もう？"
"13410-87-セリカ" = "気づいたら帰ってたわね。"
"13410-88-セリカ" = "どこかの誰かさんと違って、それはもうテキパキと！"
"13410-89-ホシノ" = "そっか……お礼、ちゃんと言いそびれちゃったな。"
"13410-90-ヒナ" = "……お世話になったわ。"
"13410-91-アヤネ" = "まだ、ホシノ先輩が……。"
"13410-92-ヒナ" = "みんな、待ってると思うから。"
"13410-93-ヒナ" = "列車砲のことを調べるために、また近いうち来るわ。"
"13410-94-ヒナ" = "挨拶なら、その時でも大丈夫でしょう。"
"13410-95-アヤネ" = "あの……。"
"13410-96-アヤネ" = "助けていただき、ありがとうございます。"
"13410-97-ノノミ" = "風紀委員長さんがいなかったら、ホシノ先輩を止められませんでした。"
"13410-98-シロコ" = "ん、助かった。"
"13410-99-セリカ" = "ホシノ先輩と戦った時の話、今度教えてね。"
"13410-100-シロコ" = "私も知りたい。"
"13410-101" = "[ns] \"私からも……ありがとう、ヒナ。\""
"13410-102-ヒナ" = "……そろそろ行くわ。"
"13410-103-ヒナ" = "じゃあ、また会いましょう。"
"13410-104-ホシノ" = "そんなあっさり行っちゃったんだ。"
"13410-105-ノノミ" = "あっ……ホシノ先輩の服は、洗ってから返すと言っていました。"
"13410-106-ホシノ" = "そのまま返してくれても良かったのに。"
"13410-107-アヤネ" = "きちんとした方ですね。"
"13410-108-ホシノ" = "なら、下着も洗って返してくれるのかな～？"
"13410-109-セリカ" = "いや、そういうのは直接本人に聞きなさいよ……。"
"13410-110-ホシノ" = "というか、返してもらおうにも連絡先を知らないんだよね。"
"13410-111-セリカ" = "先生に聞けば良いじゃない、面倒くさがってるだけでしょ！"
"13410-112-ホシノ" = "……うへ～。"
"13410-113-ノノミ" = "ひとまず、会議を始める前に着替えてきてください。"
"13410-114-ホシノ" = "おじさんはこのままで良いんだけどなぁ……。"
"13410-115-セリカ" = "もう、週末にリビングでダラダラしてるおじさんじゃない！"
"13410-116-ホシノ" = "ふあぁ……仕方ないなぁ。"
"13410-117-アヤネ" = "では、アビドス廃校対策委員会でもあり、#nアビドス生徒会でもある「対策委員会」の定例会議を始めます！"
"13410-118-アヤネ" = "最初の議題は……。"
"13410-119" = "待って、アヤネちゃん……みんなに話があるんだ。"
"13410-120-アヤネ" = "……ホシノ先輩？"
"13410-121-シロコ" = "話……？"
"13410-122" = "どうかしましたか？"
"13410-123-セリカ" = "次変なこと言ったら、今度こそタダじゃおかないからね、先輩。"
"13410-124" = "こほん……。"
"13410-125-ホシノ" = "ノノミちゃん、シロコちゃん、アヤネちゃん、セリカちゃん……そして先生。"
"13410-126-ホシノ" = "あらためて、ちゃんと伝えておこうと思って……。"
"13410-127-ホシノ" = "えっと……。"
"13410-128" = "その……。"
"13410-129-ホシノ" = "……みんな、ごめん。"
"13410-130" = "あら、よく聞こえませんでしたね。#nシロコちゃんもそうですよね？"
"13410-131-シロコ" = "ん、何も。"
"13410-132" = "……！"
"13410-133" = "ねえ、ホシノ先輩。#n私も聞こえなかったんだよね。"
"13410-134" = "[s] \"私もよく聞こえなかったな～。\""
"13410-135" = "先生まで……。"
"13410-136-ホシノ" = "だから……。"
"13410-137-ホシノ" = "……みんな、本当にごめん！#n一度ならず二度までも……！"
"13410-138-ホシノ" = "また一人で突っ走って……。"
"13410-139-ホシノ" = "……心配も、迷惑もかけたよね。"
"13410-140-アヤネ" = "……そうですね。"
"13410-141-セリカ" = "でも、こうして帰ってきてくれたじゃない！"
"13410-142-シロコ" = "ん、帰ってきてくれてよかった。"
"13410-143-ノノミ" = "はい、そうです。"
"13410-144-ホシノ" = "実は、記憶が曖昧なんだけど……。"
"13410-145-ホシノ" = "……暗闇のなかで、みんなの声が聞こえたんだ。"
"13410-146-ホシノ" = "アヤネちゃんとセリカちゃんが――"
"13410-147-ホシノ" = "アイドルデビューするって！"
"13410-148-ノノミ" = "えっ？"
"13410-149-シロコ" = "アイドル？"
"13410-150-アヤネ" = "ええっ！？"
"13410-151-セリカ" = "な、何言ってるのよ！！"
"13410-152-ホシノ" = "いや～、まさかセリカちゃんは約束を破ったりしないよね？"
"13410-153-セリカ" = "あ、アレは……勢いで言っちゃっただけというか！"
"13410-154-アヤネ" = "セリカちゃん！？"
"13410-155-セリカ" = "だって、仕方ないじゃない！"
"13410-156-ホシノ" = "うへ～。"
"13410-157-ホシノ" = "今さらできないなんて言わないでよー？"
"13410-158-セリカ" = "いやいやいや……。"
"13410-159-ノノミ" = "その時のプロデューサーは私に任せてください☆"
"13410-160-アヤネ" = "アイドルだなんて……。"
"13410-161-アヤネ" = "大丈夫だよ、本当にやるわけないって。"
"13410-162-アヤネ" = "そ、そうだよね、セリカちゃん。"
"13410-163-シロコ" = "私が実現させてみせる。"
"13410-164-セリカ" = "お願いだから、シロコ先輩はおとなしくしてて……。"
"13410-165-シロコ" = "……ホシノ先輩。#nいつかユメ会長のこと、教えて。"
"13410-166-セリカ" = "そうね、私も聞きたいわ。"
"13410-167-アヤネ" = "私も、お願いします。"
"13410-168-ノノミ" = "うんうん、聞きたいです！"
"13410-169-ホシノ" = "へえ、そっか～#nおじさんの手に汗握る冒険譚、みんな聞きたいんだねぇ。"
"13410-170-ホシノ" = "じゃあ、まずは大オアシスを水着で探索した時の話をしようかな。"
"13410-171" = "えっ、なんで水着！？"
"13410-172-ホシノ" = "ふふふ、実はそこに秘密が――"
"13410-173" = "[ns] \"ホシノ、もう大丈夫なの？\""
"13410-174-ホシノ" = "……。"
"13410-175-ホシノ" = "大丈夫、とは違うけどね。"
"13410-176-シロコ" = "ホシノ先輩……。"
"13410-177-シロコ" = "その苦しみを抱えて生きてくのは、つらいよね。"
"13410-178-ホシノ" = "……毎日毎日、後悔を繰り返してばかりだよ。"
"13410-179-ホシノ" = "でも、手を差し伸べてくれる子たちがいた。"
"13410-180-ホシノ" = "あの時間があったおかげで、#nノノミちゃんやシロコちゃん、アヤネちゃん、セリカちゃん……#nそれと、もう一人のシロコちゃんにも会えたから。"
"13410-181-ホシノ" = "……この苦しみも、幸せも、私の人生にとってどれも大切なもの。"
"13410-182-ホシノ" = "だから……。"
"13410-183-ホシノ" = "苦しんで、後悔して、立ち止まるんじゃなくて……前に進むべきなんだ。"
"13410-184-シロコ" = "……失った大切なものが、戻らなくても？"
"13410-185-シロコ" = "それを手放して良いの？"
"13410-186-ホシノ" = "手放す必要は、ないんじゃないかな。"
"13410-187-ホシノ" = "けど、いつまでも後ろを見てたら……。"
"13410-188-ホシノ" = "みんなが差し伸べてくれた手を、握り返せないからね。"
"13410-189-ホシノ" = "……だからさ。"
"13410-190-ホシノ" = "だから、きっと……。"
"13410-191-地下生活者" = "終わりだ……もう、終わりです。"
"13410-192-地下生活者" = "まさか、こうなるとは……。"
"13410-193-地下生活者" = "小生は、間違った場所に放り込まれただけ……。"
"13410-194-地下生活者" = "……こんな世界は、ゲマトリアの小生にふさわしくありません。"
"13410-195-？？？" = "ゲマトリア。"
"13410-196-地下生活者" = "……！"
"13410-197-地下生活者" = "ひっ、ヒィィイイイッ！？#n死の神が、どうしてここに……！？"
"13410-198-シロコ" = "ゲマトリアは全員倒したはずだけど、まだ残ってたんだ。"
"13410-199-地下生活者" = "この光は……もしや、小生を追跡してきたのか？"
"13410-200-地下生活者" = "あの者たちは、何を……？#nこの世界に、なんて存在を呼び寄せたのだ……！"
"13410-201-シロコ" = "死の秘密を求めているなら、私が手伝うよ。"
"13410-202-地下生活者" = "ヒッ、ヒィイイイッ――！？"
"13410-203-シロコ" = "自分で体験すれば、すぐに分かるはず。"
"13410-204" = "い、イヤだ、やめてくれッッ！"
"13410-205" = "い、イヤだ、やめてくれッッ！"
"13410-206" = "それだけは……！"
"13410-207-シロコ" = "……殺しはしない。"
"13410-208-シロコ" = "今日のところは、見逃す。"
"13410-209-シロコ" = "だから、早く消えて。#nあなたの地下へ――そして二度と戻ってこないで。"
"13410-210-シロコ" = "ただし……[ruby=ゆめゆめ]努々[/ruby]、忘れないように。"
"13410-211-シロコ" = "アビドスにいる……[ruby=アヌビス]「死の神」[/ruby]の存在を。"
"13410-212-地下生活者" = "……くるしい。"
"13410-213-地下生活者" = "ヒィッ……くるしい、くるしい。"
"13410-214-地下生活者" = "くるしい……くるしい……。"
"13410-215-地下生活者" = "くるしい……。"
"13410-216-プラナ" = "確認。#n地下生活者との接続が完全に途絶えました。"
"13410-217-アロナ" = "これで、もう二度と戻ってこられないはずです。"
"13410-218" = "[s] \"お疲れ様、二人とも。\""
"13410-219-プラナ" = "先ほど、「色彩」の力も確認できなくなりました。"
"13410-220-アロナ" = "ですが、もう一人のシロコさんは――"
"13410-221-プラナ" = "――確認。#n[ruby=すなおおかみ]砂狼シ[/ruby]ロコさんとの接続が……。"
"13410-222-プラナ" = "……。"
"13410-223-アロナ" = "プラナちゃん……？"
"13410-224-プラナ" = "……切断されました。"
"13410-225-アロナ" = "えっ！？"
"13410-226" = "[s] \"何があったの！？\""
"13410-227" = "……それが、一方的に切られてしまいました。"
"13410-228" = "探さないでほしい、ということでしょうか……？"
"13410-229" = "アビドス砂漠"
"13410-230-シロコ" = "……。"
"13410-231" = "次回;エピローグ（１）"
