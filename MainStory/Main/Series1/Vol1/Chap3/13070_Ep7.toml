[translation]
"13070-1" = "第7話;肉体の限界"
"13070-2-ホシノ" = "……シロコちゃん？"
"13070-3-ホシノ" = "さっきからずっと付いてきてるけど、おじさんに何の用事かなー？"
"13070-4-シロコ" = "ん、尾行してるだけ。"
"13070-5-ホシノ" = "それはちょっと困るなー……#nそもそも女子高生がおじさんを尾行だなんて、逆にどういう状況？"
"13070-6-シロコ" = "……どうしてここに来たの？#nもう誰も住んでないのに……"
"13070-7-ホシノ" = "……うん。"
"13070-8-ホシノ" = "もう……誰もいないね。"
"13070-9-ホシノ" = "ここは、ユメ先輩と初めて会った場所でさ。"
"13070-10-シロコ" = "前の、生徒会長……。"
"13070-11-ホシノ" = "だから、気づいたら足が向いてたっていうか……うん、そんな感じ。"
"13070-12-シロコ" = "先輩に何があったのか、私も知らない。"
"13070-13-ホシノ" = "……。"
"13070-14-シロコ" = "でも、これ以上みんなに隠し事をするのは良くないと思う。"
"13070-15-ホシノ" = "……。"
"13070-16-シロコ" = "アヤネもノノミもセリカも、みんな不安がってる。#nそれも、失踪した生徒会長に関係あること？"
"13070-17-ホシノ" = "あぁっ！#nあんなところに誰も護送してない現金輸送車が！"
"13070-18-シロコ" = "ホシノ先輩！"
"13070-19-シロコ" = "逃さない。"
"13070-20-ホシノ" = "のああぁっ！？#nまた速くなったねぇシロコちゃん！？"
"13070-21-ホシノ" = "っていうかさっきの、おじさんなりの思いやりなんだけどなあ……！#nちょっとは空気読んでくれない！？"
"13070-22-シロコ" = "やだ、捕まえる。"
"13070-23-ホシノ" = "ああもう……っ！#nちょっと一人にしてほしいんだけど！？"
"13070-24-セリカ" = "シロコ先輩、遅いわね……"
"13070-25-ノノミ" = "……やっぱり、執事さんに連絡してみます。"
"13070-26-ノノミ" = "……ネフティスの、ですよね？"
"13070-27-ノノミ" = "はい、ネフティスなら何か知っているはずです。#n今はそれ以外に、手がかりもありませんし……"
"13070-28-アヤネ" = "だ、大丈夫ですか？#nあの時は、なんだか気まずそうでしたけど……"
"13070-29-ノノミ" = "長いこと、家と連絡を取っていなかったので……#nあまり良くは思われていないのでしょう。"
"13070-30-ノノミ" = "……私はあまり、気にしてないのですが。#n連絡先は、たしか……"
"13070-31-アヤネ" = "……無理はしないでくださいね、ノノミ先輩。"
"13070-32-ノノミ" = "……はい。"
"13070-33-アヤネ" = "ごめん、逃げられた。"
"13070-34-セリカ" = "シロコ先輩っ！"
"13070-35-シロコ" = "そうでしたか……"
"13070-36-シロコ" = "ん……まだまだ力不足。"
"13070-37-セリカ" = "お、落ち込んじゃった……"
"13070-38-セリカ" = "シロコ先輩で無理だったら、誰も追いつけませんから。"
"13070-39-アヤネ" = "……ホシノ先輩が言ってた。#n明日は学校に行くから心配しないで、って。"
"13070-40-アヤネ" = "そう、でしたか……"
"13070-41-アヤネ" = "……今のホシノ先輩には、時間が必要なのかもしれません。"
"13070-42-アヤネ" = "……。"
"13070-43-ノノミ" = "……あっ。"
"13070-44-ノノミ" = "……お嬢様。"
"13070-45-ノノミ" = "執事さん、あの……"
"13070-46-ネフティス幹部" = "砂漠横断鉄道について、お知りになりたいと？"
"13070-47-ノノミ" = "……はい。"
"13070-48-ノノミ" = "やっぱり、何か知っているんですね？"
"13070-49-ネフティス幹部" = "勿論、存じております。"
"13070-50-ノノミ" = "ネフティスは何を企んでいるんですか？#n私募ファンドの目的は？"
"13070-51-ノノミ" = "前生徒会長の失踪と、契約書の関係は……？"
"13070-52-ノノミ" = "存じてはおります――#nですが仕事に関する内容を、お嬢様が気にされる必要は無いのでは？"
"13070-53-ノノミ" = "……それは。"
"13070-54-ノノミ" = "そうかも、しれませんが……"
"13070-55-ネフティス幹部" = "……こうしてきちんとお話をするのは二年ぶりですね。#nお変わりはありませんか？"
"13070-56-ノノミ" = "……はい。"
"13070-57-ネフティス幹部" = "カードの限度額は足りていますか？#n必要でしたら、上限を引き上げた新しいカードをお渡ししますので、#nいつでも仰ってくださいね。"
"13070-58-ノノミ" = "い、いえ……大丈夫です。#n今でも、困ってはいないので……"
"13070-59-ノノミ" = "……。"
"13070-60-ノノミ" = "私のことは、大丈夫です……#n執事さん、ネフティ――"
"13070-61-ネフティス幹部" = "お嬢様は何もせずに、これまで通りにお過ごしください。#n……あれだけの損害を与えたこと、お忘れではないでしょう？"
"13070-62-ノノミ" = "……。"
"13070-63-シロコ" = "ん……"
"13070-64-ノノミ" = "お言葉ですが、お嬢様はネフティスを常々非難しておられました。#n今になってというのは、「虫がいい」と思われる方も多いと思いますが……？"
"13070-65-ノノミ" = "それは……"
"13070-66-ネフティス幹部" = "……厳しい物言いになってしまい、申し訳ございません。#nですがネフティスは、現在危機に陥っているのです。"
"13070-67-ノノミ" = "……えっ？"
"13070-68-ネフティス幹部" = "二日後の総会で、#n社の存亡が決まると言っても過言ではございません。"
"13070-69-ノノミ" = "その総会で、いったい何が……"
"13070-70-ネフティス幹部" = "……今、アビドスの皆様もいらっしゃいますか？"
"13070-71-アヤネ" = "……。"
"13070-72-ノノミ" = "明日、そちらへ直接お伺いします。#n今日はもう遅いですから、詳しいお話はその時に。"
"13070-73-ネフティス幹部" = "それとお嬢様は、カードをお忘れなく。交換いたしますので。#nでは、今日のところは失礼いたします。"
"13070-74-ノノミ" = "え？それは大丈――"
"13070-75-ノノミ" = "……。"
"13070-76-セリカ" = "ノノミ先輩……"
"13070-77-ノノミ" = "……気にしないでください。#nそれよりも、ネフティスの存亡が懸かっているだなんて……"
"13070-78-ノノミ" = "思っていた以上に、複雑な状況なのかもしれません……"
"13070-79-ノノミ" = "私も情報を集めてみます。"
"13070-80-アヤネ" = "大丈夫……？#nアヤネちゃんも疲れてるでしょ。"
"13070-81-アヤネ" = "それは……でも……！"
"13070-82" = "[s] \"今日は早めに帰って休もう。\""
"13070-83-アヤネ" = "先生？"
"13070-84-アヤネ" = "……そうしましょう、アヤネちゃん。#nこういう時は、休むことも大切ですから。"
"13070-85-ノノミ" = "シロコちゃんも、セリカちゃんも、そして先生も……"
"13070-86-シロコ" = "私は大丈夫。"
"13070-87-シロコ" = "いやいや、シロコ先輩も顔疲れてるから。#n帰ってちゃんと休んでよね？"
"13070-88-シロコ" = "……ん。"
"13070-89-セリカ" = "あはは……ホシノ先輩を全力で追いかけたわけですし……"
"13070-90" = "[s1] \"私もシャーレに戻って色々と調べてみるよ。\"\n[s2] \"また明日、みんなで集まろう。\""
"13070-91-シロコ" = "ん、分かった。"
"13070-92-ノノミ" = "では皆さん、また明日。"
"13070-93-セリカ" = "うん、またね。"
"13070-94" = "……。"
"13070-95-セリカ" = "どうかしたの、アヤネちゃん？"
"13070-96-アヤネ" = "……何だか、変な感じがしませんか？"
"13070-97-セリカ" = "変な感じって？"
"13070-98-アヤネ" = "砂漠横断鉄道、債権者団体の総会、アビドス生徒会……"
"13070-99-アヤネ" = "偶然発見された契約書の日付と、ユメ先輩の失踪日……"
"13070-100-アヤネ" = "私たちの知らない、大きな何かが動いているような……"
"13070-101-セリカ" = "うん、だから明日また集まるんでしょ？"
"13070-102-アヤネ" = "そうなんだけど、そうじゃなくて……"
"13070-103-セリカ" = "何だろ、違和感っていうのかな……"
"13070-104" = "[s] \"違和感？\""
"13070-105-アヤネ" = "……はい。"
"13070-106-アヤネ" = "誰かの、まだ見えてない意図と言いますか……#n悪意を感じるような……"
"13070-107-セリカ" = "悪意って……いったい誰が？"
"13070-108" = "[s] \"……。\""
"13070-109-アヤネ" = "……そう、だよね。#n私の考えすぎかも。"
"13070-110-アヤネ" = "先生も、気にしないでください。"
"13070-111-アヤネ" = "……恐らく情報が足りないせいで、混乱しているんだと思います。"
"13070-112-アヤネ" = "明日はネフティス側と会う予定ですし、#n少しでも情報収集をしておきます。"
"13070-113" = "[s] \"分かった、でもあんまり無理しないでね。\""
"13070-114-アヤネ" = "……はい。#n帰ろう、セリカちゃん。"
"13070-115-アヤネ" = "ま、待ってよアヤネちゃん。"
"13070-116" = "[ns] シャーレに戻る。"
"13070-117-地下生活者" = "攻略法その1――「既に起きた出来事は変えられない」。"
"13070-118-地下生活者" = "先生が未来をことごとく変えてしまうというのなら、#n過去を利用すれば良いだけのこと。"
"13070-119-地下生活者" = "例え先生であっても、過去を変えることは不可能でしょう。"
"13070-120-地下生活者" = "つまり、攻略の鍵は――「過去」にあるのです。"
"13070-121-ノノミ" = "私は……"
"13070-122-地下生活者" = "さあ、先生よ……ヒヒ、ヒヒヒッ……。"
"13070-123-地下生活者" = "攻略法は、全部で4つ。"
"13070-124-地下生活者" = "1つ目は既に進行中……#nそして2つ目もまた、じきに……ヒヒッ。"
"13070-125-地下生活者" = "いやはや、4つ目の攻略法は出る幕も無いかもしれませんね。果たして……"
"13070-126-地下生活者" = "その選択、楽しませてもらうとしましょう……ヒヒッ、ヒヒヒヒッ……"
"13070-127" = "[ns] \"アロナ、プラナ。\""
"13070-128-プラナ" = "はい、先生！"
"13070-129-アロナ" = "確認、命令待機中。"
"13070-130" = "[ns] \"朝までにやらなきゃいけないことがあるんだ。\""
"13070-131" = "[ns5] \"もし途中で寝ちゃってたら、\"\n[ns6] \"どうにか起こしてもらえるかな？\""
"13070-132-アロナ" = "徹夜だなんて……だ、大丈夫ですか、先生？"
"13070-133-アロナ" = "う、ううっ……分かりました！#nでも、ちゃんと休憩を挟んでくださいね！"
"13070-134-プラナ" = "理解。#nモーニングコールですね、お任せください。"
"13070-135" = "[ns] \"……あ、それと。\""
"13070-136" = "[ns] \"……ゲマトリアに何か動きはある？\""
"13070-137-プラナ" = "ゲマトリア、ですか？#nあれ以来、特には……"
"13070-138-プラナ" = "どのような用件でしょうか、先生？"
"13070-139" = "[s] \"……ううん、それなら大丈夫。\""
"13070-140-アヤネ" = "おはよ～。"
"13070-141-アヤネ" = "おはようございます。"
"13070-142-アヤネ" = "うんうん☆#nアヤネちゃんもセリカちゃんも、元気そうで何よりです。"
"13070-143-アヤネ" = "……ノノミ先輩、寝られなかったんですか？"
"13070-144-ノノミ" = "ふふっ……すみません、少しは寝たのですが。"
"13070-145-シロコ" = "おはよう。"
"13070-146-セリカ" = "シロコ先輩は問題なさそうね。"
"13070-147-シロコ" = "ん？"
"13070-148-セリカ" = "元気そうで良かったってだけ。#nそれで、ホシノ先輩は？"
"13070-149-シロコ" = "まだ連絡は来てない。#nでも、来るって言ってたから。"
"13070-150-セリカ" = "ところで、先生は……？"
"13070-151-アヤネ" = "先生のことですから、#nきっと何か調べているんだと思います。"
"13070-152-セリカ" = "……まさか、夕方頃にふらふら来るつもりじゃないわよね？"
"13070-153-ノノミ" = "明日は総会当日、あまりに遅くなると準備が……"
"13070-154-アロナ" = "むにゃ……んん、ふひひ……"
"13070-155-プラナ" = "……先輩、アロナ先輩。"
"13070-156-アロナ" = "ふあぁ……プラナちゃん？#nどうかしました……？"
"13070-157-アロナ" = "のあっ、もう朝ですか！？#n先生を起こしてあげないと……！"
"13070-158-プラナ" = "問題ありません。#n先生は朝までずっと起きていました。"
"13070-159-アロナ" = "なら良か……"
"13070-160-アロナ" = "いえ、また徹夜だなんて、良いことではないんですけど……"
"13070-161-プラナ" = "それは確かに……ところでアロナ先輩。#n本日、工事の予定なんてありましたでしょうか？"
"13070-162-アロナ" = "工事？いえ、無いはずですが……？"
"13070-163-プラナ" = "……ガスの配管システムに、異常が検知されました。"
"13070-164-アロナ" = "……え？"
"13070-165-プラナ" = "混乱、初めて見る現象です……#nガスの配管が、変わっています。"
"13070-166-プラナ" = "まるで何者かが強制的に介入しているような……捻じれて、歪んでいて、不快な……"
"13070-167-アロナ" = "……ま、待ってください！"
"13070-168" = "先生っ！！！"
"13070-169-地下生活者" = "……攻略法、その2。"
"13070-170-地下生活者" = "奇跡の担い手とはいえ、肉体には物理的な限界がある。"
"13070-171-地下生活者" = "それが先生……あなたの弱点でしょう？#nヒヒッ、ヒッ……"
"13070-172-地下生活者" = "ヒヒヒッ、ヒヒヒヒヒッ！"
"13070-173-地下生活者" = "イヒヒヒヒヒヒヒヒヒッ！！"
"13070-174" = "\n次回;アビドス生徒会（１）"
