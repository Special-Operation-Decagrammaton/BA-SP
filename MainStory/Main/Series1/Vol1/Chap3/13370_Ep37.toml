[translation]
"13370-1" = "第37話;伝えなければならないこと"
"13370-2-ノノミ" = "……ホシノ先輩。"
"13370-3" = "ユメ先輩は、最後になんて言おうとしたんだろう。"
"13370-4" = "手帳には、何が書いてあったんだろう。"
"13370-5" = "……もう、二度と知る機会は訪れない。"
"13370-6" = "分かっていても、諦められない。"
"13370-7" = "けど、この苦しみは……。"
"13370-8" = "ううん、この苦しみこそ……。"
"13370-9" = "私に与えられた「罪」。"
"13370-10-ノノミ" = "違いますよね、先輩。"
"13370-11-ノノミ" = "手帳を見つけられなかったから後悔しているんじゃなくて……。"
"13370-12-ノノミ" = "ユメ会長に気持ちを伝えられなかったから……。"
"13370-13-ノノミ" = "だから、今も苦しんでいるんですよね？"
"13370-14" = "アレが最後だと分かっていたら……。"
"13370-15" = "……違う。そんなの関係なく、普段から気持ちを伝えておくべきだったんだ。"
"13370-16-ノノミ" = "急に会えなくなるだなんて……誰も、思いもしませんから。"
"13370-17-シロコ" = "あれは事故だよ、先輩。"
"13370-18" = "だとしても、受け入れられるかどうかは別。"
"13370-19-シロコ" = "先輩のせいじゃない。"
"13370-20" = "頭では理解してる……けど、納得はできないんだ。"
"13370-21" = "私が間違ってた。"
"13370-22-シロコ" = "ホシノ先輩がいなかったら……。"
"13370-23-シロコ" = "あの日、私は死んでいたはず。"
"13370-24-シロコ" = "……でも、先輩がマフラーをくれたから。"
"13370-25" = "ユメ先輩が、そうしろって……。"
"13370-26-シロコ" = "ん。なら、ユメ先輩にもお礼を言わないと。"
"13370-27" = "……。"
"13370-28" = "私たちは、苦しんで、意味もなく死んでいく。#nそういう定めにあるんだろうね。"
"13370-29" = "だって、「死」に意味があるというのなら――"
"13370-30" = "先輩があんな風に死んだことに、一体どんな意味があるの？"
"13370-31-アヤネ" = "ホシノ先輩……。"
"13370-32" = "ユメ先輩は、砂漠で迷って力尽きた。"
"13370-33" = "水も、コンパスも、通信機もない状態で。#nあの日は、星ひとつ見えないくらいの悪天候だった。"
"13370-34" = "せめて、スマホが最新だったなら……。#nそうしたら、先輩の言葉を受け取れたかもしれないのに……。#nもっと早く、発見できたかもしれないのに。"
"13370-35" = "でも、先輩は借金を返済するからって機種変更を後回しにして……。"
"13370-36" = "私が……もっとちゃんと話をしていたら……。"
"13370-37-アヤネ" = "ホシノ先輩！"
"13370-38" = "……。"
"13370-39-アヤネ" = "ホシノ先輩とユメ会長の事情に、#n私は口を挟むべきじゃないのかもしれません。"
"13370-40-アヤネ" = "ですが、そうやって自分をずっと苦しめていたら、先輩が……。"
"13370-41" = "……学校の水道。"
"13370-42" = "直してくれたの、アヤネちゃんだよね。"
"13370-43-アヤネ" = "え……？"
"13370-44" = "ありがとう。#n本当は、もっと前に言おうと思ってたんだけどさ。"
"13370-45-アヤネ" = "……ホシノ先輩。"
"13370-46-セリカ" = "……。"
"13370-47-セリカ" = "ふぅ……ごめん、うまく言葉にできないや。"
"13370-48-セリカ" = "……早く帰ってきてよ、先輩のバカ！"
"13370-49-セリカ" = "それで、また一緒にラーメン食べに行くわよ！"
"13370-50-セリカ" = "もし帰ってきてくれたら、アヤネちゃんと一緒にアイドルやるから！"
"13370-51" = "……セリカちゃん。"
"13370-52" = "やっぱり、セリカちゃんは可愛いね～。"
"13370-53-セリカ" = "ちょ、ちょっとぉ！？"
"13370-54-シロコ" = "…………。"
"13370-55-シロコ" = "――もう、十分。"
"13370-56-シロコ" = "過去は過去として――そのままでいい。"
"13370-57" = "シロコ、ちゃん……？"
"13370-58-シロコ" = "これからを……セリカやアヤネのように彼女を知らない生徒が増えていく未来を、大切に。"
"13370-59-シロコ" = "彼女を知らない子たちも、今、笑顔でいられることは、悪いことじゃない。"
"13370-60-シロコ" = "だから……。"
"13370-61-シロコ" = "死に囚われるんじゃなくて、思い出を未来に連れていこう。"
"13370-62-シロコ" = "生徒会長がどんな人だったのかは、先輩が一番よく知っているんでしょう？"
"13370-63-シロコ" = "だから、その手を、離してあげて。"
"13370-64" = "……ありがとう。"
"13370-65" = "君のこと、よく知らないけど……分かるんだ。"
"13370-66" = "……同じ過ちを繰り返してほしくないんだよね。"
"13370-67" = "シロコちゃんは優しいから。"
"13370-68" = "……それに。"
"13370-69" = "――君も、手放せてないんでしょ？"
"13370-70-シロコ" = "……！"
"13370-71" = "……みんなが使ってた武器を。"
"13370-72" = "今も、まだ持ってるよね？"
"13370-73-シロコ" = "私は……。"
"13370-74" = "それを捨てられる？"
"13370-75" = "段々と記憶が薄れていくなか、[ruby=武器]思い出[/ruby]まで手放せる？"
"13370-76-シロコ" = "……。"
"13370-77-シロコ" = "…………。"
"13370-78" = "分からない。"
"13370-79-シロコ" = "……できるのかな。"
"13370-80-シロコ" = "私たちは……。"
"13370-81-シロコ" = "「罪」から……「悲しみ」から、「苦しみ」から、抜け出せるのかな？"
"13370-82-シロコ" = "……きっと、死んだ人を生き返らせるのと同じくらい、難しいと思う。"
"13370-83" = "……。"
"13370-84-地下生活者" = "完成だ！"
"13370-85-地下生活者" = "ついに「セトの[ruby=ふんぬ]憤怒[/ruby]」が顕現する！"
"13370-86-地下生活者" = "オオオオオッ、雷撃の怒りよ……！"
"13370-87-地下生活者" = "地上を燃やし尽くせ――！！"
"13370-88-アロナ" = "先生、気をつけてください！"
"13370-89-アロナ" = "巨大なエネルギー反応が……！"
"13370-90" = "……。"
"13370-91" = "私には……。"
"13370-92" = "……できない。"
"13370-93" = "先輩が最期に残したもの。"
"13370-94" = "その意味が何なのか確認しないと。"
"13370-95" = "でないと、私は……。"
"13370-96-アロナ" = "避けてください、先生！"
"13370-97-アロナ" = "あの攻撃は、今の私じゃ防げません！"
"13370-98-アロナ" = "せ、生徒の皆さんも……！"
"13370-99-アロナ" = "うわあああああっ！？"
"13370-100" = "[ns] \"ホシノは手帳に何が書いてあると思う？\""
"13370-101" = "分からない。#nだから、それを知るために――"
"13370-102" = "[s] \"うん。それは誰にも分からないものだから。\""
"13370-103" = "……。"
"13370-104" = "[s] \"それでも、信じてるんだよね。\""
"13370-105" = "……ユメ先輩は、どんな言葉を残したんだろう。"
"13370-106" = "[s] \"彼女を一番知っているのは、ホシノなんでしょ？\""
"13370-107" = "……。"
"13370-108" = "[ns1] \"なら、そこにはきっと……。\"\n[ns2] \"ホシノの信じる言葉が残されていたはずだよ。\""
"13370-109" = "[ns3] \"事実は分からないかもしれない。\"\n[ns4] \"でも真実はそこにある。\""
"13370-110" = "[ns] \"存在しないとしても、それが真実であることは変わらないから。\""
"13370-111" = "[ns] \"それが、私たちにできる唯一の選択。\""
"13370-112" = "[ns5] \"死を、時間を巻き戻せない……。\"\n[ns6] \"平凡な私たちにとって……。\""
"13370-113" = "[ns7] \"たったひとつの――奇跡だから。\"\n[ns8] たったひとつの――奇跡だから。"
"13370-114-ホシノ" = "……。"
"13370-115-ホシノ" = "ここは……。"
"13370-116-ホシノ" = "……ん？"
"13370-117-ホシノ" = "……手帳？"
"13370-118-ホシノ" = "えっ。"
"13370-119" = "ど、どうして！"
"13370-120" = "ど、どうして！#n……どうして、こんなところに！？"
"13370-121-？？？" = "ホシノちゃん、元気にしてる？"
"13370-122-ユメ" = "えへへっ。3年生になったホシノちゃんは、どんな風に成長してるんだろうね。"
"13370-123" = "次回;約束"
