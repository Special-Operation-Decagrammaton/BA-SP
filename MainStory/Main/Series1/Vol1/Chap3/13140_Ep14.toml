[translation]
"13140-1" = "第14話;[ruby=みんな]対策委員会[/ruby]"
"13140-2-セリカ" = "……。"
"13140-3-セリカ" = "げほっ……。"
"13140-4-シロコ" = "くっ、うぅ……。"
"13140-5-セリカ" = "し、シロコ先輩！"
"13140-6-セリカ" = "大丈夫！？"
"13140-7-アヤネ" = "こんなに強かったなんて……。"
"13140-8-ホシノ" = "……やっぱり、シロコちゃんは強いね。#nいつか追い越されちゃうんだろうなぁ。"
"13140-9-シロコ" = "はあっ、はぁ……。 "
"13140-10-ホシノ" = "……でも、その[ruby=・   ・   ・]いつか[/ruby]は今じゃない。"
"13140-11-シロコ" = "ホシノ、先輩……。"
"13140-12-ホシノ" = "世界のすべてが敵に見えてた、あの頃の私を救ってくれたのは、ノノミちゃんだった。"
"13140-13-ホシノ" = "もしノノミちゃんに会えてなかったら、私に「今」はない。"
"13140-14-シロコ" = "……。"
"13140-15-ホシノ" = "だから、今度は私が救う番。"
"13140-16-ホシノ" = "ノノミちゃんを加害者にさせちゃいけない。"
"13140-17-ホシノ" = "みんなで過ごした時間を、なかったことにはさせない。"
"13140-18-セリカ" = "……。"
"13140-19-ホシノ" = "……大丈夫、おじさんを信じてよ。"
"13140-20-アヤネ" = "……。"
"13140-21-シロコ" = "何か、方法ならあると思う……きっと。"
"13140-22-シロコ" = "先生が来てくれるはずだから。"
"13140-23-ホシノ" = "……たしかに、先生が一緒にいれば状況は違ったかもね。"
"13140-24-ホシノ" = "でも、先生は来られない。#n病院にいるから。"
"13140-25-シロコ" = "……。"
"13140-26-ホシノ" = "ユメ先輩の理想を否定する列車砲の存在も……。"
"13140-27-ホシノ" = "私募ファンドが起こそうとしている争いの火種も……。"
"13140-28-ホシノ" = "元を辿れば、アビドス生徒会に行き着く。"
"13140-29-ホシノ" = "どうして先輩が、こんな契約をしたのかは分からない。"
"13140-30-ホシノ" = "その時、私はそばにいなかったから……。"
"13140-31-ホシノ" = "……でも、もしユメ先輩が列車砲の存在を知ったら、#n必ず計画を止めに行く。"
"13140-32-ホシノ" = "だから、私は行かなくちゃいけないんだ。"
"13140-33-ホシノ" = "事の始まりは、アビドス生徒会が結んだ契約にあるよ。"
"13140-34-ホシノ" = "[ruby=みんな]対策委員会[/ruby]は、関係ない。"
"13140-35-ホシノ" = "この問題は、私が一人で終わらせる。"
"13140-36-シロコ" = "……行かないで、先輩。"
"13140-37-シロコ" = "私は……生徒会長がどんな人か知らない。"
"13140-38-シロコ" = "だから、先輩がアビドス生徒会で過ごしてた頃の気持ちは、#n分かってあげられない。"
"13140-39-シロコ" = "私には、対策委員会に来てからの記憶しかないから……。"
"13140-40-シロコ" = "対策委員会で過ごした思い出が、私にとっての世界なんだよ。"
"13140-41-シロコ" = "なのに、どうしてそんな寂しいこと言うの……？"
"13140-42-ホシノ" = "シロコちゃん……。"
"13140-43-ホシノ" = "ホシノ先輩も、[ruby=・   ・   ・]みんな[/ruby]でしょ？"
"13140-44-ホシノ" = "……ごめんね、シロコちゃん。#nそれでも行かなきゃいけないんだ。"
"13140-45-アヤネ" = "笑わせないでください！！！"
"13140-46-アヤネ" = "……つまり、私たちを置いていくってことですよね？"
"13140-47-アヤネ" = "それでは、前と変わらないじゃないですか……！！"
"13140-48-ホシノ" = "いつの間に、雨雲号を何台も……。"
"13140-49-アヤネ" = "またあの時と同じ行動を取るんですか！？#nホシノ先輩には学習能力がないんですか！？"
"13140-50-アヤネ" = "先生のおかげで、こうして一緒にいられるようになったのに！"
"13140-51-ホシノ" = "……ごめんね、"
"13140-52-ホシノ" = "アヤネちゃん。"
"13140-53-ホシノ" = "これだけは譲れないよ。"
"13140-54" = "……分からず屋のホシノ先輩には、力尽くで理解してもらいます！"
"13140-55-セリカ" = "覚悟して、先輩！！"
"13140-56" = "次回;副生徒会長の命令"
