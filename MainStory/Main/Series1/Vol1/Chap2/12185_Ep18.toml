[translation]
"12185-1-アヤネ" = "目標の座標地点に到着！"
"12185-2-アヤネ" = "この辺りに、ホシノ先輩が閉じ込められているはずです！この周囲のどこかに、きっと……！"
"12185-3-シロコ" = "……。"
"12185-4-ノノミ" = "ここは……。"
"12185-5-セリカ" = "……ここ、学校？"
"12185-6-セリカ" = "この痕跡……多分学校、だよね？"
"12185-7-シロコ" = "砂漠の真ん中に学校……もしかして。"
"12185-8" = "ああ。ここは、本来のアビドス高等学校本館だ。"
"12185-9-アヤネ" = "！！"
"12185-10-シロコ" = "……。"
"12185-11-セリカ" = "あんたは……！！"
"12185-12-カイザーPMC理事" = "よくぞここまで来たものだ、アビドス対策委員会。"
"12185-13-アヤネ" = "敵の増援多数……！"
"12185-14-アヤネ" = "この数字……おそらく敵側の動ける全兵力が……。"
"12185-15-アヤネ" = "カイザーPMCはきっと、ここで総力戦に持ち込むつもりです……！"
"12185-16-カイザーPMC理事" = "砂漠化が進行し、捨て去られたアビドスの廃墟……ここが、元々はアビドスの中心だった。"
"12185-17-カイザーPMC理事" = "……かつてキヴォトスで一番大きく、そして強大だった学校の残骸が、この砂の下に埋もれている。"
"12185-18-カイザーPMC理事" = "ゲマトリアは、ここに実験室を立てることを要求した。"
"12185-19-アヤネ" = "実験室……！？"
"12185-20-ノノミ" = "そんなことよりも、ホシノ先輩はどこですか！"
"12185-21-カイザーPMC理事" = "あの副生徒会長なら、向こうの建物にいる。"
"12185-22-カイザーPMC理事" = "もしかしたら、すでに実験が始まっているかもしれないが……。"
"12185-23-シロコ" = "……っ！"
"12185-24-カイザーPMC理事" = "彼女の元に行きたいのであれば、私たちのことを振り切って行けば良い。君たちにそれができるなら、の話だが。"
"12185-25-アヤネ" = "この兵力、容易に通してくれそうにはありませんね……。"
"12185-26-シロコ" = "……ん、じゃあここは私に――"
"12185-27" = "（ドカアアァァァァン！！）"
"12185-28-アヤネ" = "また爆発！？こ、今度は何ですか？"
"12185-29-カヨコ" = "じゃーん！やっほ～☆"
"12185-30-ハルカ" = "……。"
"12185-31-アル" = "お、お邪魔します！"
"12185-32-アヤネ" = "べ、便利屋の皆さん……！？"
"12185-33-カヨコ" = "やーっと追いついた！けどなんかこれみんな集まってるし、もしかして大事なシーンに割り込んじゃった感じ？"
"12185-34-カヨコ" = "……ふん、こっそり助太刀しようと思ったのに、そう上手くはいかなかったわね。"
"12185-35" = "あ、あんたたち……！"
"12185-36-ノノミ" = "このタイミングに登場、ということは……！"
"12185-37-シロコ" = "……なるほど、そういうことだね。"
"12185-38-カヨコ" = "……ん？何、この期待に満ちた目線は？"
"12185-39-ハルカ" = "社長、なんか嫌な予感がするから、まずは状況を整理してから……。"
"12185-40-ハルカ" = "……。"
"12185-41-ハルカ" = "ふふっ、勘だけは鈍ってないようね、対策委員会。私たちがここに来た理由なんて、決まってるでしょう？"
"12185-42-アル" = "ここは私たちに任せて、先に行きなさい！！！"
"12185-43-シロコ" = "！"
"12185-44-ノノミ" = "！！"
"12185-45-ムツキ" = "！！！"
"12185-46-カヨコ" = "……はあ。"
"12185-47-アル" = "（言っちゃったああぁぁぁーー！！！！）"
"12185-48-ムツキ" = "うっわー……それは惚れちゃうよ、アルちゃん……。"
"12185-49-ハルカ" = "さ、流石です！い、一生ついていきます！アル様！！"
"12185-50-セリカ" = "……もうっ。"
"12185-51-セリカ" = "べ、別に、お礼は言わないからねっ！！"
"12185-52-セリカ" = "でも、全部終わったら……その時は一緒に、ラーメンでも食べに行くわよ、便利屋！！"
"12185-53-ノノミ" = "はい、このご恩は必ず！"
"12185-54-シロコ" = "ん、ありがと。"
"12185-55-カヨコ" = "はあ……こうなったら仕方ないか。"
"12185-56-アル" = "い、勢いに任せちゃったけど、この後はどうしたら……！？攻撃！？いや、逃げ……！？"
"12185-57" = "あはははは！面白くなってきたね、アルちゃん！あんなにかっこいい台詞言っちゃったら、もうやるしかないでしょ！"
"12185-58-ムツキ" = "じゃっ、始めようかっっ！！！"
"12185-59" = "次回;それでも手放さなかったもの（２）"
