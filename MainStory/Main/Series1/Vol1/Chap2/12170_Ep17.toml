[translation]
"12170-1" = "第17話;守りたいもの"
"12170-2" = "ゲヘナ学園・正門"
"12170-3-イオリ" = "はぁ？風紀委員長に会いたい？ゲヘナの風紀委員長に、そんなに容易く会えるとでも思ってるのか？"
"12170-4-イオリ" = "そうだな、じゃあ土下座して私の足でも舐めたら……"
"12170-5-イオリ" = "ひゃんっ！？"
"12170-6-イオリ" = "ちょっ、まだ話しの途中……んっ！ちょっと！？"
"12170-7-イオリ" = "大人としてのプライドとか、人としての迷いとかは無いのか！？"
"12170-8" = "[s1] \"そんなものは無い。\"\n[s2] \"元々はあったけど……。\""
"12170-9-イオリ" = "おかしい！ヘンタイ！歪んでる！"
"12170-10-イオリ" = "おかしい！ヘンタイ！歪んでる！"
"12170-11-イオリ" = "こんなヘンタイの大人に――"
"12170-12-ヒナ" = "何だか楽しそうね？"
"12170-13-イオリ" = "い、委員長……？"
"12170-14-ヒナ" = "……自分の望みのために膝をつく姿なら、これまで何度も見てきた。でも、生徒のために跪く先生を見たのは初めて。"
"12170-15-ヒナ" = "顔を上げてちょうだい、先生。"
"12170-16" = "言ってみて、私に何をしてほしい？"
"12170-17-イオリ" = "いや、その、委員長……先生は跪いてるんじゃなくて、その、足を、舐め……"
"12170-18-ヒナ" = "……？"
"12170-19-ヒナ" = "！！！！？？？"
"12170-20-ナギサ" = "……。"
"12170-21-ナギサ" = "なるほど、ご説明ありがとうございます。ヒフミさんが仰っていることはよく分かりました。"
"12170-22-ナギサ" = "その先生の言葉が本当だとすると、このまま聞き流すわけにはいかなそうです。"
"12170-23-ナギサ" = "例の条約も目前に迫っていますし、今は下手に動くわけにはいかないのですが……。"
"12170-24-ナギサ" = "……ただ、そのPMCという企業の存在が、我が校の生徒たちに良くない影響を及ぼしそうなことは確かですね。"
"12170-25-ナギサ" = "今回はちょっとした例外ということで、何か考えた方が良さそうです。"
"12170-26-ヒフミ" = "あ、ありがとうございます、ナギサ様……。"
"12170-27-ナギサ" = "そうですね……確かちょうど、牽引式榴弾砲を扱う屋外授業の予定があったはずです。"
"12170-28-ナギサ" = "せっかくですし、ちょっとしたピクニックなどいかがでしょう。"
"12170-29-ヒフミ" = "えっと、牽引式榴弾砲ということは……L118の……？"
"12170-30-ナギサ" = "はい。他ならないヒフミさんですし、全てお任せします。細かいことは私の方で。"
"12170-31-ナギサ" = "愛は巡り巡るもの……ヒフミさんがいつか私に愛をお返してくれる時を、楽しみにしてますね。ふふっ。"
"12170-32-ヒフミ" = "あ、あぅ……。"
"12170-33" = "それにきっと……いえ、間違いなく、「シャーレの先生」には借りを作っておいた方が良さそうですからね……。"
"12170-34" = "（テキパキ）"
"12170-35-柴大将" = "うん、大体こんなもんかな。"
"12170-36-ムツキ" = "わっ、屋台も良い感じじゃん！"
"12170-37-柴大将" = "元々、柴関ラーメンは屋台から始めたこともあってな。懐かしい気分だよ。"
"12170-38-ハルカ" = "わ、私が……私のせいでお店が……し、死にましょうか？死んでもいいですか？死にますっ！！！"
"12170-39-ムツキ" = "まあまあ。それにしてもやめるって聞いてたけど、またお店を開くことにしてくれて良かったよ～。"
"12170-40-柴大将" = "ああ、ちょっと前にどっかの誰かさんが、お店の前にお金を置いて行ってくれたこともあったからな。"
"12170-41-アル" = "……。"
"12170-42-柴大将" = "本当なら引退して、ゆっくりしようと思ってたんだが……営業してほしいと言われちゃあ仕方ない。"
"12170-43-アル" = "……。"
"12170-44-柴大将" = "580円の柴関ラーメン4杯、お待ち！"
"12170-45-カヨコ" = "これ、また量を間違ってる気が……？"
"12170-46-ムツキ" = "あはっ、まあ良いじゃん良いじゃ～ん。"
"12170-47-カヨコ" = "いただきまーす！"
"12170-48-ムツキ" = "あー美味しかった。さて、じゃあそろそろ行く？"
"12170-49-カヨコ" = "……社長、本当に行くの？"
"12170-50-アル" = "この戦い、私たちには何のメリットもない。報酬も無しに、PMCと戦うなんて……。"
"12170-51-アル" = "……ふん。"
"12170-52-ムツキ" = "カヨコちゃん、よく見てみなよ。"
"12170-53-カヨコ" = "ん？"
"12170-54-ムツキ" = "アルちゃんのその顔を見れば分かるでしょ、「依頼料なんて、このラーメンが味わえただけで十分よ」って今にも言い出しそうじゃん！"
"12170-55-カヨコ" = "……。"
"12170-56-ムツキ" = "……。"
"12170-57-ハルカ" = "な、なるほど！さすがアル様です！多くは語らず、一杯のラーメンで地獄へと赴くその姿、まさにハードボイルドです！"
"12170-58-ハルカ" = "わ、私も真のアウトローになるために頑張ります！今度こそ、ちゃんと全部消してみせますっ！！"
"12170-59-アル" = "……ふふっ。"
"12170-60-アル" = "さあ、私と一緒に地獄の底までついてくる覚悟はできたかしら？"
"12170-61-ムツキ" = "くふふっ……！"
"12170-62-アル" = "（言っちゃったーーーーー！！！）"
"12170-63-アル" = "（元々ラーメン食べたら帰るつもりだったのに、何だか流されてカッコいい台詞をーーー！！？）"
"12170-64-アル" = "（こ、これはもう今さら「やっぱ無しで」とか言えない雰囲気だし……！？）"
"12170-65-アル" = "（今から逃げるって手は……うぅ……で、でも……）"
"12170-66-アル" = "（あの後アビドスの連中から、「ありがとう」とか「見直した」とか、色々言ってもらっちゃったし……）"
"12170-67-アル" = "（それに今回の相手はマーケットガードどころかPMC……勝敗なんて目に見えてるじゃない！？）"
"12170-68-アル" = "（ど、どうすればいいのよこの状況！？）"
"12170-69-ムツキ" = "ほら、じゃあ行こ！アルちゃん！"
"12170-70-ハルカ" = "じ、地獄の底までお供します！"
"12170-71-カヨコ" = "はぁ、何だか損してばっかりだけど……仕方ないね。"
"12170-72-シロコ" = "ん、準備完了。"
"12170-73-ノノミ" = "補給も十分、おやつもたっぷり入れておきました！"
"12170-74-セリカ" = "こっちも準備できたわ！睡眠もしっかり取ったし、お腹もいっぱい！どっからでもかかってきなさい！"
"12170-75-アヤネ" = "私の方も、アビドスの古い地図を全て最新化しておきました。"
"12170-76-アヤネ" = "先生に教えていただいた情報ですと、ホシノ先輩はカイザーPMCの第51地区の中央あたりにいるはずです。"
"12170-77-アヤネ" = "一番安全なルートで案内します、行きましょう！"
"12170-78" = "[s] \"それじゃ、出発！\""
"12170-79-アヤネ" = "はい！ホシノ先輩救出作戦……！"
"12170-80" = "開始です！！"
"12170-81-柴大将" = "……そうだったな。"
"12170-82-柴大将" = "忘れていたよ……ダメになったんなら、またやり直せばいい。"
"12170-83-柴大将" = "大事なのは、ラーメンを食べに来てくれる人の方だ。"
"12170-84-柴大将" = "お客さんがいる限り、店は消えない。そういうもんだ。だから……"
"12170-85-柴大将" = "……行ってこい、対策委員会。"
