[translation]
"12090-1" = "第9話;カイザーPMC（１）"
"12090-2-ホシノ" = "うへ～、結局何なのこいつら？"
"12090-3-セリカ" = "そんなに強くないけど邪魔っていうか、めんどくさいっていうか……なんか、今まで戦ってきたやつらの中でもひと際「厄介」って感じ。"
"12090-4-シロコ" = "ん、下手したら風紀委員会より面倒……。"
"12090-5-ノノミ" = "何なのでしょう、この方たちは……それに、こんなところで一体何をしてるんでしょうか？"
"12090-6-アヤネ" = "施設に、何らかのマークを発見しました！"
"12090-7" = "これって……"
"12090-8" = "少々お待ちください、今確認を……"
"12090-9" = "……確認が取れました。このマーク、この集団は……"
"12090-10-ホシノ" = "……カイザーPMC。"
"12090-11" = "っ！？……はい。ホシノ先輩の仰る通り、カイザーPMCです。"
"12090-12" = "カイザー……？こいつらもカイザーコーポレーションってこと！？"
"12090-13" = "はい、カイザーコーポレーションの系列会社で……。"
"12090-14" = "もうどこに行ってもカイザー、カイザー、カイザー！一体何なの！？"
"12090-15-ノノミ" = "それに、「PMC」ということは……"
"12090-16-セリカ" = "え、何かマズい言葉なの？"
"12090-17-ノノミ" = "PMCとは、[ruby=Private Military Company]民間軍事会社[/ruby]のことです……。"
"12090-18-セリカ" = "ぐ、軍事……！？"
"12090-19" = "……。"
"12090-20-アヤネ" = "ヘルメット団のようなチンピラとはレベルが違います。本当に組織化されたプロの……文字通り、軍隊のようなものです！"
"12090-21-シロコ" = "……！"
"12090-22-セリカ" = "軍隊ぃ！？"
"12090-23-ノノミ" = "退学した生徒や不良の生徒たちを集めて、企業が私設兵として雇っているという噂がありましたが、まさか……"
"12090-24" = "（ヴイイイィィィ―――ン！！）"
"12090-25-ノノミ" = "け、警報音……！？"
"12090-26-セリカ" = "これ、何だか大ごとになりそうな予感なんだけど……。"
"12090-27-ノノミ" = "これは……ヘリの音……？"
"12090-28-シロコ" = "それに、この地面の揺れ……恐らく戦車。"
"12090-29-アヤネ" = "大規模な兵力が接近中！こちらを包囲しに来ています！"
"12090-30-アヤネ" = "仰る通り、装甲車以外にも戦車やヘリまで……！ものすごい数です！"
"12090-31-アヤネ" = "包囲が完成する前に離脱してください！まずは急いで、その場から脱出を……！"
"12090-32" = "先生、指示をお願いします！"
