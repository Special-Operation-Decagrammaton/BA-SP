[translation]
"12100-1" = "第10話;カイザーPMC（２）"
"12100-2-セリカ" = "はぁ、はぁ……。"
"12100-3-シロコ" = "……ふぅ。"
"12100-4-ホシノ" = "キリが無いなあ、これは……。"
"12100-5-アヤネ" = "……せい、聞こえますか？包囲網を抜け……また……"
"12100-6-アヤネ" = "……が不安定……早く……退却……"
"12100-7-アヤネ" = "……が……接近……"
"12100-8-シロコ" = "……絶体絶命？"
"12100-9-ホシノ" = "包囲されちゃったかー……。"
"12100-10-ノノミ" = "……。"
"12100-11-カイザーPMC理事" = "侵入者とは聞いていたが……アビドスだったとは。"
"12100-12-セリカ" = "な、何よこいつ……。"
"12100-13-ノノミ" = "……。"
"12100-14-ホシノ" = "（あいつは……）"
"12100-15-カイザーPMC理事" = "まさかここに来るとは思っていなかったが……まあ良い。"
"12100-16-カイザーPMC理事" = "生徒会長がいない今、副会長であるあなたが借金を返していく、ということでよろしいでしょうか？[ruby=たかなし]小鳥遊[/ruby]ホシノさん？"
"12100-17-黒服" = "それとも……私の提案を受け入れますか？"
"12100-18-ホシノ" = "（あの時の……）"
"12100-19-カイザーPMC理事" = "勝手に人の私有地に入り、暴れたことによるこれらの被害額。"
"12100-20-カイザーPMC理事" = "君たちの学校の借金に加えても良いのだが、まあ、大して額は変わらないな……。"
"12100-21-ホシノ" = "あんたは、あの時の……。"
"12100-22-カイザーPMC理事" = "……確か、例のゲマトリアが狙っていた生徒会長……いや、副会長だったか？"
"12100-23-カイザーPMC理事" = "……ふむ、面白いアイディアが浮かんだ。便利屋やヘルメット団を雇うよりも良さそうだ。"
"12100-24-セリカ" = "便利屋……？な、何を言ってるの？"
"12100-25-ノノミ" = "……あなたたちは、誰ですか？"
"12100-26-カイザーPMC理事" = "……まさか私のことを知らないとは。アビドス、君たちならよく知っている相手だと思うがね。"
"12100-27-カイザーPMC理事" = "私は、カイザーコーポレーションの理事を務めている者だ。"
"12100-28-カイザーPMC理事" = "そして君たち、アビドス高等学校が借金をしている相手でもある。"
"12100-29-シロコ" = "！！"
"12100-30-セリカ" = "……嘘っ！？"
"12100-31-カイザーPMC理事" = "では、古くから続くこの借金について、話し合いでもするとしようか。"
"12100-32" = "次回;負け戦"
