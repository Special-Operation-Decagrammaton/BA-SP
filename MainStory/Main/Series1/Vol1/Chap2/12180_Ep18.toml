[translation]
"12180-1" = "第18話;それでも手放さなかったもの（１）"
"12180-2-アヤネ" = "みなさん、大丈夫ですか？"
"12180-3-シロコ" = "ん。"
"12180-4-セリカ" = "全っ然大丈夫！"
"12180-5-アヤネ" = "先生に教えていただいた座標はもう目の前なので、もう少しの辛抱です……！"
"12180-6-ノノミ" = "まだまだ行けますよ～！"
"12180-7-アヤネ" = "……っ！"
"12180-8-アヤネ" = "前方に敵を発見しました！！"
"12180-9-アヤネ" = "距離は2km、もうすぐ接敵します！みなさん、対応の準備を……"
"12180-10" = "（ドゴオォォォン！！）"
"12180-11-アヤネ" = "！？"
"12180-12-アヤネ" = "あれは……。"
"12180-13-シロコ" = "支援射撃？"
"12180-14-アヤネ" = "……L118、トリニティの牽引式榴弾砲です！一体どうして……"
"12180-15-？？？" = "あ、あぅ……わ、私です……。"
"12180-16-セリカ" = "あっ！ヒフ――"
"12180-17-ファウスト" = "ち、違います！私はヒフミではなく、ファウストです！"
"12180-18-アヤネ" = "……。"
"12180-19-ノノミ" = "わあ、ファウストさん！お久しぶりです！ご自分で名前を言っちゃってましたが、そこはご愛嬌ということで☆"
"12180-20-ファウスト" = "あ、あれ！？あぅぅ……！"
"12180-21-ファウスト" = "その、このL118は、トリニティの牽引式榴弾砲ですが……"
"12180-22-ファウスト" = "と、トリニティ総合学園とは一切関係ありません！射撃を担当している皆さんにも、そう伝えておきましたので……。"
"12180-23-ファウスト" = "す、すみません、これくらいしかお役に立てず……。"
"12180-24-シロコ" = "ううん、すごく助かった。"
"12180-25-ノノミ" = "はい！ありがとうございます、ファウストちゃん！"
"12180-26-ファウスト" = "あはは……えっと、みなさん、が、頑張ってください！"
"12180-27-シロコ" = "火力支援の直後に突撃、定石通りだね。"
"12180-28-アヤネ" = "はい！敵は砲撃により混乱状態です、今のうちに突破しましょう！"
