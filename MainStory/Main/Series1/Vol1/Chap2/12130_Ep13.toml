[translation]
"12130-1" = "第13話;手をすり抜けたもの"
"12130-2-ホシノ" = "アビドス対策委員会のみんなへ"
"12130-3-ホシノ" = "まずは、こうやって手紙でお別れの挨拶をすることになったこと、許してほしい。おじさんにはこういう、古いやり方が性に合っててさ。"
"12130-4-ホシノ" = "みんなには、ずっと話してなかったことがあって。"
"12130-5-ホシノ" = "実は私、昔からずっとスカウトを受けてたんだ。"
"12130-6-ホシノ" = "カイザーPMCの傭兵として働く、その代わりにアビドスが背負っている借金の大半を肩代わりする……そういう話でね。"
"12130-7-ホシノ" = "……うへ、中々良い条件だと思わない？おじさんこう見えて、実は結構能力を買われててさ～。"
"12130-8-ホシノ" = "借金のことは、私がどうにかする。すぐに全部を解決はできないけど、まずはこれでそれなりに負担が減ると思う。"
"12130-9-ホシノ" = "ブラックマーケットでは急に生意気なことを言っちゃったけど、あの言葉を私が守れなくてごめんね。"
"12130-10" = "（スッ）"
"12130-11-ホシノ" = "……これで良い？"
"12130-12-黒服" = "……はい、確かに。"
"12130-13-黒服" = "契約書にサインも頂いたことですし……これで、ホシノさんがお持ちの生徒としての全権利は、私の元に移譲されました。"
"12130-14-黒服" = "これで正式に、アビドス高校が背負っている借金の大半は、こちらで負担することにしましょう。"
"12130-15-ホシノ" = "これで対策委員会も、少しは楽になるはず。"
"12130-16-ホシノ" = "アビドス高校からも、キヴォトスからも離れることになったけど、私のことは気にしないで。"
"12130-17-ホシノ" = "勝手なことをしてごめんね。"
"12130-18-ホシノ" = "でもこれは全部、私が責任を取るべきこと。"
"12130-19-ホシノ" = "私は、アビドスの最後の生徒会だから。"
"12130-20-ホシノ" = "だから、ここでお別れ。じゃあね。"
"12130-21-ホシノ" = "先生へ"
"12130-22-ホシノ" = "実は私、大人が嫌いだった。あんまり信じてなかった。"
"12130-23-ホシノ" = "シロコちゃんが先生をおんぶして来たあの時だって、「なんかダメな大人が来たな」って思ったくらいだし？"
"12130-24-ホシノ" = "でも、先生みたいな大人と最後に出会えて、私は……いや、照れ臭い言葉はもういいよね。"
"12130-25-ホシノ" = "先生。"
"12130-26-ホシノ" = "最後に我がままを言って悪いんだけど、お願い。シロコちゃんは良い子だけど、横で誰かが支えてないと、どうなっちゃうか分からない子で。"
"12130-27-ホシノ" = "悪い道に逸れちゃったりしないように、支えてあげてほしい。"
"12130-28-ホシノ" = "先生なら、きっと大丈夫だと思うから。"
"12130-29-PMC兵士" = "さあ、乗れ。"
"12130-30-ホシノ" = "……どこに行くの？"
"12130-31-PMC兵士" = "アビドス砂漠だ。"
"12130-32-ホシノ" = "シロコちゃん、ノノミちゃん、セリカちゃん、アヤネちゃん"
"12130-33-ホシノ" = "お願い、私たちの学校を守ってほしい。"
"12130-34-ホシノ" = "砂だらけのこんな場所だけど……私に残された、唯一意味のある場所だから。"
"12130-35-ホシノ" = "それから、もしこの先どこかで万が一、敵として相対することになったら……"
"12130-36-ホシノ" = "その時は、私のヘイローを「壊して」。"
"12130-37-ホシノ" = "よろしくね。"
"12130-38-セリカ" = "ホシノ先輩っっっ！！！！"
"12130-39-セリカ" = "何なの！？あれだけ偉そうに話しておいて！！切羽詰まったら何でもしちゃうって、自分で分かってたくせにっ！！"
"12130-40-セリカ" = "こんなの、受け入れられるわけないじゃない！！"
"12130-41-シロコ" = "……助けないと。"
"12130-42-シロコ" = "私が行く。対策委員会に迷惑がかかるし、私一人で……"
"12130-43-アヤネ" = "落ち着いてください、今はまず足並みをそろえないと……！"
"12130-44" = "ドカアァァァァン！！！"
"12130-45-セリカ" = "うわあっ！？"
"12130-46-シロコ" = "爆発音……！？"
"12130-47-アヤネ" = "近いです、場所は……！？"
"12130-48-アヤネ" = "……。"
"12130-49-アヤネ" = "……そ、そんな！？"
"12130-50" = "ドカアァァァァン！！！"
"12130-51-PMC兵士" = "行け、行け！"
"12130-52-PMC兵士" = "進め！"
"12130-53-アビドス市民A" = "うわあぁぁぁっ！？"
"12130-54-アビドス市民B" = "早くっ、早く逃げろっ！！"
"12130-55" = "……この自治区にはもう、退去命令が下った。"
"12130-56-カイザーPMC理事" = "ふふふっ、ふふふふふふふ……。"
"12130-57-カイザーPMC理事" = "ついに、条件は全てクリアした。"
"12130-58-カイザーPMC理事" = "最後の生徒会がアビドスを退学……これで実質的に、アビドス高等学校は消えた！！"
"12130-59" = "あとは我らカイザーコーポレーションが、アビドスを吸収合併するのみ！"
"12130-60-カイザーPMC理事" = "さあ、アビドス高等学校を占拠せよ！"
"12130-61-アヤネ" = "こちらに向かって、数百近いPMCの兵力が進攻中！同時に、市街地に無差別攻撃をしています！"
"12130-62-セリカ" = "カイザーPMC！？なんでこのタイミングで……！？"
"12130-63-ノノミ" = "お、応戦しないとです！！何はともあれ、アビドスが攻撃されているのを見過ごすわけには……！"
"12130-64-シロコ" = "考えてる時間が惜しい、すぐに行こう！"
"12130-65-アヤネ" = "で、ですが、私たちで撃退するにはあまりにも数が……！"
"12130-66-アヤネ" = "と、とにかくまずは、市民の皆さんを避難させましょう！"
"12130-67-アヤネ" = "こんな大規模な攻撃……一体どうして、急に……。"
"12130-68-PMC兵士" = "対策委員会を発見！こっちだ！！"
"12130-69-PMC兵士" = "ぐあっ！？"
"12130-70-シロコ" = "斥候が、もうこんなところにまで……。"
"12130-71-アヤネ" = "アビドス高校周辺に、カイザーPMCの兵を多数確認！すでに校内にもかなり侵入されています！"
"12130-72-セリカ" = "とりあえず、学校に侵入したやつからやっつけよう！アヤネちゃん、お願い！"
"12130-73-アヤネ" = "はい！先生の安全を確保しつつ、学校に侵入した敵を撃退します！"
"12130-74-アヤネ" = "校内の安全を確保した後は、市民の皆さんの避難を！"
