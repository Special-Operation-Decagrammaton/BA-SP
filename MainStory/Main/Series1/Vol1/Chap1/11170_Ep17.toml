[translation]
"11170-1" = "第17話;立ち込める暗雲"
"11170-2" = "便利屋・オフィス"
"11170-3-ムツキ" = "おはよー。"
"11170-4-アル" = "（げっそり）おはよう……。"
"11170-5-ムツキ" = "うわっ、ビックリした！アルちゃん、徹夜でもした？"
"11170-6-アル" = "ううん、ちゃんと寝たわ……。"
"11170-7-カヨコ" = "社長、何か悩みでもあるの？"
"11170-8-ムツキ" = "計画はしっかり立てたじゃん？#n人をこれまでの2倍雇って、地の利を生かせる戦場にアビドスを誘き出す。"
"11170-9-カヨコ" = "ハルカは爆弾を設置しに、朝早く出かけた。#n計画では、爆弾を数十か所埋設したゾーンでアビドスを#nコテンパンにするって感じだよね。"
"11170-10" = "（ガチャッ）"
"11170-11-ハルカ" = "ただいま戻りました。"
"11170-12-カヨコ" = "お帰り、ハルカ。お疲れ様。"
"11170-13-ハルカ" = "主要ポイントに爆弾を埋めておきました。あとは、このボタンを押すだけで……。"
"11170-14-ムツキ" = "よしよし、頑張ったねー。場所だけは忘れずに、しっかり覚えといて。"
"11170-15-ハルカ" = "いつでも言ってください。私がこの手で、全部吹っ飛ばしてやりますから……この手で……。"
"11170-16" = "はあ……。"
"11170-17-ムツキ" = "なぁに死にそうな顔してんの？#nそれなら最初から、例のクライアントから手付金をもらって、それを資金に充てれば良かったじゃん。"
"11170-18-アル" = "……手付金はもらわない。それがうちの鉄則よ。"
"11170-19-カヨコ" = "手付金をもらうと、クライアントの命令に従わざるを得なくなるから……って理由だったっけ？"
"11170-20-アル" = "その通り。華麗に仕事を終えてから依頼料を受け取る。#nこの順番が崩れたら、私たちが追求するビジョンは達成できないの。"
"11170-21-ムツキ" = "ビジョン？そんなのあったっけ？"
"11170-22-アル" = "あるわよ！！法律と規律に縛られない、ハードボイルドなアウトロー！#nそれが便利屋68のビジョンでしょう！！"
"11170-23-ムツキ" = "そうだっけ？ああ、思い出した、思い出した。"
"11170-24-アル" = "さっきカヨコが言ったように、クライアントの依頼も同じ。#nそれが私たちを縛り付ける足枷になることもあるわ。#n私たちが望まない行動を強いられるかもしれないのよ。"
"11170-25-アル" = "だから依頼料は、絶対に成功報酬として受け取るの。"
"11170-26-カヨコ" = "……。"
"11170-27-カヨコ" = "そこまでプレッシャーを感じてるなら、全部投げ捨ててゲヘナに帰るのも手だよ、社長。"
"11170-28-アル" = "はあ！？"
"11170-29-アル" = "ぷ、プレッシャーだなんて言ってないわよ！ただ……ちょっとだけ……。"
"11170-30-ムツキ" = "うーん、今更帰るのは無理なんじゃ？風紀委員のやつらが黙っちゃいないよ？"
"11170-31-カヨコ" = "風紀委員会……か。"
"11170-32-カヨコ" = "確かに風紀委員会は、私たちを目の上のたんこぶみたいに思ってはいるけど……。#n今の私たちは、やつらから逃げてきたわけじゃない。"
"11170-33-カヨコ" = "それと、そもそもうちの風紀委員会が時にキヴォトス最強とも言われてる理由は……。"
"11170-34-ヒナ" = "風紀委員長、ヒナの存在があるから。"
"11170-35-ヒナ" = "風紀委員会の戦力の大半は、ほとんど彼女が担っていると言っても過言じゃない。#n百人力って言葉を体現しているような人。"
"11170-36-ヒナ" = "言い換えるなら、"
"11170-37-カヨコ" = "ヒナ以外の風紀委員は、大したことないってこと。"
"11170-38-カヨコ" = "計画さえきちんと練れば、十分勝算はある。"
"11170-39-ムツキ" = "そうなの？カヨコっち、そこまで考えてたんだ？"
"11170-40-カヨコ" = "いつか必ず相まみえることになるだろうから。ヒナ抜きの風紀委員会なら#n今アビドスにかけている労力を考えれば、難なく戦えるよ。"
"11170-41-カヨコ" = "逆に言えば、アビドスはそれぐらい侮れない相手ってこと。#n生徒の数が少ないってことが最大の弱点だけどね。"
"11170-42-ムツキ" = "え？そんなに強いかな……。"
"11170-43-アル" = "……。"
"11170-44-アル" = "……いえ、今更ゲヘナに戻るっていう選択肢はないわ。"
"11170-45-アル" = "かといって……はあ。"
"11170-46-カヨコ" = "……一体何がひっかかってるの？"
"11170-47-ムツキ" = "わかったわかった。つまらない話はこれぐらいにして、アルちゃん、#nご飯食べに行こうよ。#nお腹空いたし。"
"11170-48-ムツキ" = "ラーメン屋にする？柴関？"
"11170-49-カヨコ" = "また？"
"11170-50-ムツキ" = "気にしない気にしない。バイトちゃんは午後から入るみたいだし。#n鉢合わせなきゃ問題ないじゃん？"
"11170-51-カヨコ" = "まあ……美味しかったしね。とにかく、社長を元気づけないと……。"
"11170-52-ムツキ" = "じゃあ決まりー。行こ行こ♪"
"11170-53" = "対策委員会・教室"
"11170-54" = "（教室に入ると、ホシノがノノミの膝枕で横になっていた）"
"11170-55-ホシノ" = "おはよー、先生。"
"11170-56-ノノミ" = "先生、おはようございます。今日は早いですね？"
"11170-57-ノノミ" = "ん？リラックスしてるねって？うへ～ノノミちゃんの膝枕は柔らかくてサイコーなんだよー。#n私だけの特等席だもんねー。"
"11170-58-ノノミ" = "先生もいかがです？はい、どうぞ～☆"
"11170-59-ノノミ" = "ダメだよー。ここは私の場所なんだから、先生はあっちの座り心地悪そうな#n椅子にでも座ってねー。"
"11170-60-ノノミ" = "私の膝は先輩専用じゃないですよう……。"
"11170-61-ノノミ" = "（ぼそっ）今度、誰もいない時にしましょうね、先生。"
"11170-62-ホシノ" = "よいしょっと。"
"11170-63-ホシノ" = "ふあぁ～、みんな朝早くから元気だなあ。"
"11170-64-ノノミ" = "のんびりできるのは久しぶりですから……今はみんな、#nやりたいことをやってるんでしょうね。"
"11170-65-ノノミ" = "んー、シロコちゃんはきっとトレーニングでしょうし、#nアヤネちゃんは多分勉強しに図書館でしょうか……。"
"11170-66-ホシノ" = "ノノミちゃんは学校の掃除と教室の整頓をしてくれたよねー。#nうへ～、みんな真面目だなー。"
"11170-67-ホシノ" = "ん？私？うへ～、私は当然ここでダラダラしてただけだよー。"
"11170-68-ノノミ" = "先輩も何か始めてみてはどうでしょう？アルバイトとか、筋トレとか。"
"11170-69-ホシノ" = "無理無理ー、おじさんは年齢的に無理がきかない体になっちゃったもんでねー。"
"11170-70-ノノミ" = "歳は私とほぼ変わらないですよ？"
"11170-71-ホシノ" = "うへ～。とにかく先生も来たし、他のみんなもそろそろじゃない？#nそんじゃ、私ゃこの辺でドロン。"
"11170-72-ノノミ" = "あら先輩、どちらへ？"
"11170-73-ホシノ" = "うへ～今日おじさんはオフなんでね。#nてきとうにサボってるから、何かあったら連絡ちょーだい、ノノミちゃん。"
"11170-74" = "ホシノ先輩……またお昼寝しに行くみたいですね。"
"11170-75-ノノミ" = "うーん、まあいいんじゃないでしょうか。会議はアヤネちゃんがしっかり進めてくれますから。"
"11170-76-ノノミ" = "あはは……それにしてもホシノ先輩も、以前に比べてだいぶ変わりました。"
"11170-77-ノノミ" = "え？以前はどうだったかって？"
"11170-78-ノノミ" = "今はいつも寝ぼけているような感じですが……#n初めて出会った頃のホシノ先輩は、常に何かに追われているようでした。"
"11170-79-ノノミ" = "何に追われていたかというと……んと、ありとあらゆることに、と言いましょうか。"
"11170-80-ノノミ" = "聞いた話ですが、以前とある先輩がいたそうで……。"
"11170-81-ノノミ" = "アビドス最後の生徒会長だったらしいんですがとても頼りない人で、その人がここを去ってからはすべてをホシノ先輩が引き受けることになった、と……。"
"11170-82-ノノミ" = "ホシノ先輩は当時1年生だったとか……#n詳しくは、私も知らないのですが。"
"11170-83-ノノミ" = "でも今は、先生もいますし、他の学園の生徒たちとも交流できますし……。"
"11170-84-ノノミ" = "以前だったら、他の学園と関わること自体嫌がっていたはずが……#nかなり丸くなりましたね。"
"11170-85-ノノミ" = "うん、きっと先生のおかげですね☆"
"11170-86-ホシノ" = "……。"
"11170-87-ホシノ" = "……。"
"11170-88-？？？" = "これはこれは。"
"11170-89-黒服" = "お待ちしておりましたよ、暁のホル……#nいや、ホシノさんでしたね。これは失礼。"
"11170-90-黒服" = "いやいや、キヴォトスにはまだ馴染めていなくて。#nこちらへどうぞ、ホシノさん。"
"11170-91-ホシノ" = "……黒服の人、今度は何の用なのさ？"
"11170-92-黒服" = "……ふふ、状況が変わりましてね。#n今回は再度、アビドス最高の神秘をお持ちのホシノさんにご提案をしようと思いまして。"
"11170-93-ホシノ" = "提案？ふざけるな！！！それはもう……！！"
"11170-94-黒服" = "まあまあ、落ち着いてください。"
"11170-95-ホシノ" = "……！？"
"11170-96-黒服" = "……お気に入りの映画の台詞がありましてね。今回はそれを引用してみましょう。"
"11170-97" = "（トサッ）"
"11170-98-黒服" = "あなたに、決して拒めないであろう提案をひとつ。"
"11170-99-黒服" = "興味深い提案だと思いますので、どうかご清聴ください。"
"11170-100-黒服" = "ククッ、クックックックッ……"
"11170-101" = "次回;友だちなんかじゃないわよ！"
