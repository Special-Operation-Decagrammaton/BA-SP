[translation]
"11150-1" = "第15話;行こう、夕日に向かって！"
"11150-2" = "市街地"
"11150-3-セリカ" = "はひー、息苦しい。もう脱いでいいよね？"
"11150-4-ホシノ" = "のんびりしてらんないよー、急げ急げ。追っ手がすぐ来るだろうからー。"
"11150-5" = "できるだけ早く離れないと……間もなく道路が封鎖されるはずです……。"
"11150-6-ノノミ" = "ご心配なく。万全の準備を整えておきましたから☆"
"11150-7-シロコ" = "こっち、急いで。"
"11150-8-セリカ" = "あの、シロコ先輩……覆面脱がないの？邪魔じゃない？"
"11150-9-ホシノ" = "天職を感じちゃったって言うか、もう魂の一部みたいなものになっちゃって、脱ぎたくないんじゃなーい？"
"11150-10-セリカ" = "シロコ先輩はアビドスに来て正解だわ……#n他の学校だったら、ものすごい事をやらかしてたかも……。"
"11150-11-シロコ" = "そ、そうかな……。"
"11150-12-アヤネ" = "……！？"
"11150-13-アヤネ" = "……。"
"11150-14-アヤネ" = "封鎖地点を突破。この先は安全です。"
"11150-15" = "やった！大成功！"
"11150-16-アヤネ" = "本当にブラックマーケットの闇銀行を襲っちゃうなんて……ふう……。"
"11150-17-ホシノ" = "シロコちゃん、集金記録の書類はちゃんと持ってるよね？"
"11150-18" = "う、うん……バッグの中に。"
"11150-19" = "（カチャッ）"
"11150-20-ホシノ" = "……へ？なんじゃこりゃ！？カバンの中に……札束が……！？"
"11150-21-セリカ" = "うえええええっ！？シロコ先輩、現金を盗んじゃったの！？"
"11150-22-シロコ" = "ち、違う……目当ての書類はちゃんとある。#nこのお金は、銀行の人が勝手に勘違いして入れただけで……。"
"11150-23-ホシノ" = "どれどれ……うへ、軽く1億はあるね。本当に5分で1億稼いじゃったよー。"
"11150-24-セリカ" = "やったあ！！何ぼーっとしてるの！運ぶわよ！"
"11150-25-シロコ" = "……。"
"11150-26" = "ちょ、ちょっと待ってください！そのお金、使うつもりですか！？"
"11150-27-セリカ" = "アヤネちゃん、なんで？借金を返さなきゃ！"
"11150-28-アヤネ" = "そんなことしたら……本当に犯罪だよ、セリカちゃん！！"
"11150-29-セリカ" = "は、犯罪だから何！？このお金はそもそも、#n私たちが汗水流して稼いだお金なんだよ！#nそれがあの闇銀行に流れてったんだよ！"
"11150-30-セリカ" = "それに、そのままにしておいたら、犯罪者の武器や兵器に変えられてたかもしれない！#n悪人のお金を盗んで、何が悪いの！？"
"11150-31-ヒフミ" = "……。"
"11150-32-ノノミ" = "私はセリカちゃんの意見に賛成です。#n犯罪者の資金ですし、私たちが正しい使い方をした方がいいと思います。"
"11150-33-セリカ" = "ほらね！これさえあれば、学校の借金をかなり減らせるんだよ！？"
"11150-34-ホシノ" = "んむ……それはそうなんだけど……シロコちゃんはどう思う？"
"11150-35-シロコ" = "……自分の意見を述べるまでもない、ホシノ先輩が反対するだろうから。"
"11150-36-セリカ" = "へ！？"
"11150-37-ホシノ" = "さすがはシロコちゃん。私のこと、わかってるねー。"
"11150-38-ホシノ" = "私たちに必要なのは書類だけ。お金じゃない。"
"11150-39" = "今回のは悪人の犯罪資金だからいいとして、次はどうする？その次は？"
"11150-40" = "……。"
"11150-41-ホシノ" = "こんな方法に慣れちゃうと……#nゆくゆくは、きっと平気で同じことをするようになるよ。"
"11150-42-シロコ" = "……。"
"11150-43-ホシノ" = "そしたら、この先またピンチになった時……#n「仕方ないよね」とか言いながら、やっちゃいけないことに手を出すと思う。"
"11150-44-ホシノ" = "うへ～、このおじさんとしては、カワイイ後輩がそうなっちゃうのはイヤだなー。"
"11150-45-ホシノ" = "そうやって学校を守ったって、何の意味があるのさ。"
"11150-46-アヤネ" = "……。"
"11150-47-ホシノ" = "こんな方法を使うくらいなら、最初からノノミちゃんが持ってる燦然と輝くゴールドカードに頼ってたはずー。"
"11150-48-ノノミ" = "……私もそう提案しましたが、ホシノ先輩が反対されて……。"
"11150-49-ノノミ" = "先輩の気持ち、わかります。いくら頑張ったって、きちんとした方法で返済をしない限り、アビドスはアビドスじゃなくなってしまう……。"
"11150-50-ホシノ" = "うへ、そういうこと。"
"11150-51-ホシノ" = "だから、このバッグは置いてくよ。頂くのは必要な書類だけね。これは委員長としての命令だよー。"
"11150-52-セリカ" = "うわああっ！！もどかしい！意味わかんない！こんな大金を捨ててく！？変なところで真面目なんだから！！"
"11150-53-シロコ" = "うん、委員長としての命令なら。"
"11150-54" = "私はアビドスさんの事情をよく知りませんが……このお金を持っていると、何か他のトラブルに巻き込まれるかもしれません。"
"11150-55-ヒフミ" = "災いの種、みたいなものでしょうから……。"
"11150-56-ノノミ" = "あは……仕方ないですよね。このバッグは、私が適当に処分します。"
"11150-57-ホシノ" = "ほい、頼んだよー。"
"11150-58-アヤネ" = "……！！待ってください！何者かがそちらに接近しています！"
"11150-59-シロコ" = "……！！追っ手のマーケットガード！？"
"11150-60-アヤネ" = "……い、いえ。敵意はない様子です。"
"11150-61" = "調べますね……あれは……"
"11150-62" = "べ、便利屋のアルさん！？"
"11150-63-アル" = "はあ、ふう……ま、待って！！"
"11150-64-シロコ" = "……！！"
"11150-65-アル" = "あ、落ち着いて。私は敵じゃないから……。"
"11150-66-セリカ" = "（何であいつが……？）"
"11150-67-シロコ" = "（撃退する？）"
"11150-68-ホシノ" = "（どうかな。戦う気がないって相手を叩くのもねえ）"
"11150-69-ヒフミ" = "（お知り合いですか……？）"
"11150-70-ホシノ" = "（まあねー、そこそこー）"
"11150-71-アル" = "あ、あの……た、大したことじゃないんだけど……。"
"11150-72-アル" = "銀行の襲撃、見せてもらったわ……。#nブラックマーケットの銀行をものの5分で攻略して見事に撤収……あなたたち、稀に見るアウトローっぷりだったわ。"
"11150-73-シロコ" = "……！？"
"11150-74-アル" = "正直、すごく衝撃的だったというか、このご時世にあんな大胆なことができるなんて……#n感動的というか。"
"11150-75-アル" = "わ、私も頑張るわ！法律や規律に縛られない、本当の意味での自由な魂！#nそんなアウトローになりたいから！"
"11150-76-セリカ" = "（一体……何の話？）"
"11150-77-アル" = "そ、そういうことだから……な、名前を教えて！！"
"11150-78-シロコ" = "名前……！？"
"11150-79-アル" = "その、組織っていうか、チーム名とかあるでしょ？#n正式な名称じゃなくてもいいから……私が今日の雄姿を心に深く刻んでおけるように！！"
"11150-80-ホシノ" = "（うへ……なんか盛大に勘違いしてるみたいだねー……）"
"11150-81-ノノミ" = "……はいっ！おっしゃることは、よーくわかりましたっ！"
"11150-82-セリカ" = "（のっ、ノノミ先輩！？）"
"11150-83-ノノミ" = "私たちは、人呼んで……覆面水着団！"
"11150-84-アル" = "……覆面水着団！？"
"11150-85-アル" = "や、ヤバい……！！超クール！！カッコ良すぎるわ！！"
"11150-86-セリカ" = "（……）"
"11150-87-ホシノ" = "うへ～本来スクール水着に覆面が正装なんだけどね、ちょっと緊急だったもんで、今日は覆面だけなんだー。 "
"11150-88-セリカ" = "（なんか妙な設定を付け足してる！？）"
"11150-89-ノノミ" = "そうなんです！普段はアイドルとして活動してて、夜になると悪人を倒す正義の怪盗に変身するんです！"
"11150-90-ノノミ" = "そして私はクリスティーナだお♧"
"11150-91-アル" = "「だ、だお♧」……！？きゃ、キャラも立ってる……！？"
"11150-92-ホシノ" = "うへ、目には目を、歯には歯を。無慈悲に、孤高に、#n我が道の如く[ruby=まきょう]魔境[/ruby]を行く。#nこれが私らのモットーだよ！！"
"11150-93-アル" = "な、なんですってー！！"
"11150-94-カヨコ" = "……何してるの、あの子たち……。"
"11150-95-ムツキ" = "わー、アルちゃんドはまりしちゃってるじゃん。#n特撮モノのイベントに連れてってもらった子供みたいな顔してる！"
"11150-96-ノノミ" = "（もういいでしょ？てきとうに逃げようよ！）"
"11150-97-ノノミ" = "それじゃあこの辺で。アディオス～☆"
"11150-98-ホシノ" = "行こう！夕日に向かって！"
"11150-99-ヒフミ" = "夕日、まだですけど……。"
"11150-100" = "（ササーッ）"
"11150-101" = "……。"
"11150-102" = "よし！我が道の如く魔境を……その言葉、魂に刻むわ！私も頑張る！"
"11150-103-ムツキ" = "……。"
"11150-104-ムツキ" = "……。"
"11150-105-ムツキ" = "（事実を伝えるべきなんだろうけど……いつ言おうか？）"
"11150-106-ムツキ" = "（面白いからしばらく放置で）"
"11150-107-ハルカ" = "あ、あの……。"
"11150-108-ハルカ" = "このバッグ、どうしましょう？あの人たちが置いて行ったみたいなんですけど……。"
"11150-109-アル" = "ん？これはまさか……覆面水着団が私のために……？"
"11150-110" = "いや、それはないわ……ただの忘れ物じゃない？"
"11150-111-ムツキ" = "結構重いよ？何が入ってるんだろ。"
"11150-112" = "（カチャ）"
"11150-113-ムツキ" = "……！！"
"11150-114-ムツキ" = "ひょええ！？"
"11150-115-カヨコ" = "！！こ、これは……！！"
"11150-116-ノノミ" = "……あれ？現金のバッグ……置いてきちゃいました。"
"11150-117-セリカ" = "えーっ！？"
"11150-118-ホシノ" = "うへ～いいんじゃない？どうせ捨てるつもりだったんだし。気にしない、気にしない。"
"11150-119-シロコ" = "うん。誰かに拾われるでしょ、きっと。"
"11150-120-ノノミ" = "ですよね☆お金に困ってる人が拾ってくれるといいですね。"
"11150-121" = "あはは……良いことしたって思いましょう。#nお腹を空かせた人が、あのお金でお腹いっぱいになれると思えば……。"
"11150-122-セリカ" = "うう……もったいない……どう考えてももったいなさすぎる！！まったくもう、みんなお人好しなんだから！！"
"11150-123-アル" = "ええええーっ！？"
"11150-124-ムツキ" = "うわわわわーっ！？"
"11150-125-カヨコ" = "これって……"
"11150-126-ハルカ" = "……？"
"11150-127-ハルカ" = "……もしかしてこれで、もう食事抜かなくてもいいんですか？"
"11150-128" = "（便利屋オフィス）"
"11150-129-アル" = "なあああああにいいいいーーっ！！？？"
"11150-130-アル" = "覆面水着団がアビドスだったですってええ！！？？"
"11150-131-ムツキ" = "あはははー、アルちゃんショック受けてるー！超ウケる！"
"11150-132-カヨコ" = "はあ……。"
"11150-133" = "（結局教えてあげた）"
"11150-134" = "次回;明かされる真実"
