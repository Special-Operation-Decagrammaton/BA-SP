[translation]
"11070-1" = "第7話;新たなる脅威？"
"11070-2" = "対策委員会・教室"
"11070-3-アヤネ" = "みなさん、お疲れ様です。"
"11070-4-アヤネ" = "セリカちゃん、ケガはない？"
"11070-5-セリカ" = "うん、私は大丈夫。見てよ、ピンピンして……"
"11070-6-セリカ" = "（ぐらっ……）"
"11070-7" = "（バタンッ）"
"11070-8-ノノミ" = "セリカちゃん！"
"11070-9-ノノミ" = "私が保健室に連れていく。"
"11070-10-ホシノ" = "Flak41の対空砲を食らったんだもん、歩けるほうがおかしいって。ゆっくり休ませてあげよー。"
"11070-11-アヤネ" = "大変なことになるところでした。先生がいなかったら……。"
"11070-12-ノノミ" = "うんうん。先生のおかげでセリカちゃんの居場所を逃さず追跡できました。やっぱりすごいです☆"
"11070-13-ホシノ" = "確かに、ただのストーカーじゃなかったってことだね。"
"11070-14-アヤネ" = "……それと、皆さんこれを見てください。"
"11070-15-アヤネ" = "戦闘中に回収した、散らばった戦車の部品を確認したところ、キヴォトスでは使用が禁止されている違法機種と判明しました。"
"11070-16" = "もう少し調べる必要はありますが……ヘルメット団は、自分たちでは入手できない武器まで保有しているそうです。"
"11070-17" = "この部品の流通ルートを分析すれば、ヘルメット団の裏にいる存在を探し出せますね！"
"11070-18-アヤネ" = "はい。ただのチンピラが、なぜここまで執拗に私たちの学校を狙っているのかも、明らかになるかもしれません。"
"11070-19-ホシノ" = "うん、わかった。じっくり調べてみよっかー。"
"11070-20" = "高層オフィスビル"
"11070-21-カイザーPMC理事" = "……。"
"11070-22" = "……格下のチンピラごときでは、あの程度が限界か。#n主力戦車まで送り出したというのに、このザマとは。"
"11070-23-？？？" = "ふむ……となると、目には目を、生徒には生徒を……か。#n専門家に依頼するとしよう。"
"11070-24" = "（プルルル、プルルル）"
"11070-25" = "（ガチャ）"
"11070-26-？？？" = "はい、どんなことでも解決します。便利屋68です。"
"11070-27-カイザーPMC理事" = "仕事を頼みたい、便利屋。"
"11070-28-カイザーPMC理事" = "……"
"11070-29" = "カタカタヘルメット団のアジト"
"11070-30-ヘルメット団B" = "はあ……はあ……。"
"11070-31-ヘルメット団B" = "うわああっ！！"
"11070-32" = "（タタタタタタタタンッ！！）"
"11070-33-ヘルメット団B" = "ぐうっ！！"
"11070-34-ヘルメット団B" = "！"
"11070-35" = "（バタッ）"
"11070-36-ムツキ" = "あーあー、こっちは終わったよー。"
"11070-37" = "こっちも制圧完了だ、ボス。"
"11070-38-ヘルメット団A" = "う、うう……何者だ、貴様らは……。"
"11070-39" = "……ふふふ。"
"11070-40" = "（グリッ）"
"11070-41-ヘルメット団A" = "うあああっ！！ま、まさか、アビドスの！？よくも我々を……。"
"11070-42-アル" = "はあ、こんな不潔で変な匂いのする場所がアジトだなんて。#nあなたたちも冴えないわね。"
"11070-43-アル" = "……いいわ。あなたたちを、労働から解放してあげる。"
"11070-44-ヘルメット団A" = "なっ、何だって！？"
"11070-45-アル" = "要するにクビってこと。現時刻をもって、アビドスは私たちが引き受けるわ。"
"11070-46-ヘルメット団A" = "ふっ、ふざけた真似を！貴様らは一体……。"
"11070-47" = "（ガツッ！！）"
"11070-48-ヘルメット団A" = "うわああっ！！"
"11070-49" = "……"
"11070-50" = "……"
"11070-51" = "私たちは、[ruby=シックスティーエイト]便利屋68。       [/ruby]"
"11070-52" = "金さえもらえれば、何でもする……。"
"11070-53" = "なんでも屋よ。"
"11070-54" = "（ガラッ）"
"11070-55-セリカ" = "はあ……。"
"11070-56-セリカ" = "あ、れ……？先生！？ど、どうしたの？"
"11070-57" = "[s] \"お見舞いに来たよ。\""
"11070-58-セリカ" = "……ああ、私なら大丈夫。いつまでもこうしちゃいられないし。"
"11070-59-セリカ" = "アヤネちゃんや他のみんなも心配してるし……バイトにも行かなきゃだし。"
"11070-60-セリカ" = "だ、だから、お見舞いとかいいから！ほら見て、元気だし。"
"11070-61" = "[s] \"それは良かった。\""
"11070-62-セリカ" = "……。"
"11070-63-セリカ" = "あ、あの！！"
"11070-64-セリカ" = "……え、ええとね……。"
"11070-65-セリカ" = "そういえば、先生にちゃんとお礼を言ってなかったなあって、思って……。"
"11070-66-セリカ" = "あ、ありがとう……色々と……。"
"11070-67-セリカ" = "……でもっ！この程度でアビドスの役に立てたなんて思わないでよね！#nこの借りはいつか必ず返すんだから！"
"11070-68-セリカ" = "……。"
"11070-69-セリカ" = "な、何よ！？何ヘラヘラ笑ってんの！？"
"11070-70-セリカ" = "はあ、まったく。"
"11070-71-セリカ" = "じゃあ……また明日ね！"
"11070-72-セリカ" = "えっと、せ……"
"11070-73-セリカ" = "……先生。"
"11070-74" = "次回;便利屋参上！"
