[translation]
"11100-1" = "第10話;手がかりを探して"
"11100-2" = "アビドス・住宅街"
"11100-3-アヤネ" = "あ、先生。おはようございます。"
"11100-4-アヤネ" = "え？こんな朝早くからどこへ、ですか？"
"11100-5-アヤネ" = "えっと、今日は利息を返済する日でして……色々と準備があるんです。"
"11100-6-アヤネ" = "早めに登校して返済の準備もしないとですし、今後の計画も見直さないとなので……。"
"11100-7-アヤネ" = "あ、そういえば。昨日の方々の情報が見つかりました。#n後ほど学校で詳細をご確認いただけますか？"
"11100-8-アヤネ" = "ゲヘナ学園の生徒だったのですが、"
"11100-9-ムツキ" = "あっ、先生じゃん！おっはよー！"
"11100-10" = "な、ななっ！？"
"11100-11-ムツキ" = "じゃじゃーん！どもどもー！こんなところで会うなんて、偶然だね！"
"11100-12-ムツキ" = "（すりすり）あははー！ん？重い？苦しい？ちょっとだけガマンだよー、先生。"
"11100-13-ムツキ" = "な、何してるんですか！離れてください！"
"11100-14-ムツキ" = "おっと、引っ張らないでよー。"
"11100-15-ムツキ" = "……誰かと思いきや、アビドスのメガネっ娘ちゃんじゃーん？"
"11100-16-ムツキ" = "おっはよー、昨日ラーメン屋で会ったよね？"
"11100-17-アヤネ" = "その後の学校の襲撃でもお会いしました！どういうことですか？#nいきなりなれなれしく振舞って……。"
"11100-18-アヤネ" = "それに、メガネっ娘じゃなくて、アヤネです！"
"11100-19-ムツキ" = "ん？だって私たち、別にメガネっ娘ちゃんたちのことが嫌いなわけじゃないし。"
"11100-20-ムツキ" = "ただ、部活で請け負ってる仕事だからさ。仕事以外の時は仲良くしたっていいじゃん？"
"11100-21-アヤネ" = "いっ、今さら公私を区別しようということですか！？"
"11100-22-ムツキ" = "別にいいじゃん。それに「シャーレ」の先生は、あんたたちだけのモンじゃないでしょ？だよね、先生？"
"11100-23" = "[s]\"ケンカしないで仲良くしてくれると嬉しいな。\""
"11100-24-ムツキ" = "あはは、それはムリかなー。こっちも仕事だからね。アルちゃんがモチベ高くてさ、てきとうにやると怒られちゃうから。"
"11100-25-ムツキ" = "ま、いつかうちの便利屋に遊びにおいでよ、先生。アルちゃんもみんなも、きっと喜ぶからさ。"
"11100-26-ムツキ" = "そんじゃ、バイバ～イ。アヤネちゃんもまた今度ね。"
"11100-27-アヤネ" = "また今度なんてありません！！今度会ったらその場で撃ちます！"
"11100-28-ムツキ" = "はいはーい。"
"11100-29-アヤネ" = "はあ……はあ……。"
"11100-30-アヤネ" = "何ですか、あの人は……！"
"11100-31-銀行員" = "……お待たせしました。変動金利等を諸々適用し、利息は788万3250円ですね。"
"11100-32-銀行員" = "全て現金でお支払いいただきました、以上となります。"
"11100-33-銀行員" = "カイザーローンとお取引いただき、毎度ありがとうございます。来月もよろしくお願いいたします。"
"11100-34" = "（ブロロロ……）"
"11100-35-アヤネ" = "……。"
"11100-36-ノノミ" = "……。"
"11100-37-ホシノ" = "はぁ、今月も何とか乗り切ったねー。"
"11100-38-シロコ" = "……完済まであとどれぐらい？"
"11100-39-アヤネ" = "309年返済なので……今までの分を入れると……。"
"11100-40-セリカ" = "言わなくていいわよ、正確な数字で言われるとさらにストレス溜まりそう……。"
"11100-41" = "どうせ死ぬまで完済できないんだし！計算してもムダでしょ！！"
"11100-42-アヤネ" = "……。"
"11100-43-ノノミ" = "ところで、カイザーローンはなぜ現金でしか受け付けないのでしょうね？#nわざわざ現金輸送車まで手配して……。"
"11100-44-シロコ" = "……。"
"11100-45-セリカ" = "シロコ先輩、あの車は襲っちゃダメだよ。"
"11100-46-シロコ" = "うん、わかってる。"
"11100-47-セリカ" = "計画もしちゃダメ！"
"11100-48-シロコ" = "うん……。"
"11100-49-ホシノ" = "ま、とりあえず先に解決するべきは、目の前の問題の方でしょ。"
"11100-50-ホシノ" = "とにかく教室に戻ろうー。"
"11100-51-アヤネ" = "全員揃ったようなので始めます。まずは、2つの事案についてお話ししたいと思います。"
"11100-52-アヤネ" = "最初に、昨晩の襲撃の件です。"
"11100-53-アヤネ" = "私たちを襲ったのは「便利屋68」という部活です。"
"11100-54-アヤネ" = "ゲヘナでは、かなり危険で素行の悪い生徒たちとして知られています。"
"11100-55-アヤネ" = "便利屋とは頼まれたことは何でもこなすサービス業者で……。"
"11100-56-アル" = "部活のリーダーの名前はアルさん。"
"11100-57-アル" = "自らを「社長」と称しているようです。"
"11100-58-ムツキ" = "彼女の下には3人の部員がいて、#nそれぞれ室長、課長、平社員の肩書があるとのことです。"
"11100-59-ホシノ" = "いやぁー、本格的だねー。"
"11100-60-ノノミ" = "社長さんだったんですね☆すごいです！"
"11100-61-アヤネ" = "いえ、あくまでも「自称」なので……それで今はアビドスのどこかのエリアに入り込んでいるようです。今朝も会いましたし……。"
"11100-62-シロコ" = "ゲヘナ学園では、起業が許可されているの？"
"11100-63-アヤネ" = "それはないと思いますが……勝手に起業したのではないでしょうか。"
"11100-64-ノノミ" = "あら……校則違反ってことですね。悪い子たちには見えませんでしたが……。"
"11100-65-アヤネ" = "いえ、それが今までかなり非行の限りを尽くしたようで、ゲヘナでも問題児扱いされているようです。"
"11100-66-アヤネ" = "そんな危険な組織が私たちの学校を狙っているのです！もっと気を引き締めないといけません！"
"11100-67-ホシノ" = "次は取っ捕まえて取り調べでもするかー。"
"11100-68-アヤネ" = "はい、機会があればぜひ……。"
"11100-69-セリカ" = "ところでアヤネちゃん、何かあったの？並々ならぬ恨みを感じるんだけど……。"
"11100-70-アヤネ" = "……いえ、特に何も。続きまして、セリカちゃんを襲ったヘルメット団の黒幕についてです！"
"11100-71-アヤネ" = "先日の戦闘で手に入れた戦略兵器の破片を分析した結果……#n現在は取引されていない型番だということが判明しました。"
"11100-72-ホシノ" = "もう生産してないってこと？"
"11100-73-セリカ" = "それをどうやって手に入れたのかしら。"
"11100-74-アヤネ" = "生産が中止された型番を手に入れる方法は……キヴォトスでは「ブラックマーケット」しかありません。"
"11100-75-ノノミ" = "ブラックマーケット……とっても危ない場所じゃないですか。"
"11100-76-アヤネ" = "そうです。あそこでは中退、休学、退学……様々な理由で学校を辞めた生徒たちが集団を形成しており、連邦生徒会の許可を得ていない非認可の部活もたくさん活動していると聞きました。"
"11100-77-シロコ" = "便利屋68みたいに？"
"11100-78-アヤネ" = "はい。それから便利屋68も、ブラックマーケットで#n何度か騒ぎを起こしていると聞きました。"
"11100-79-ノノミ" = "では、そこが重要ポイントですね！"
"11100-80-アヤネ" = "はい。ふたつの出来事の関連性を探すのも、ひとつの方法かもしれません。"
"11100-81-ホシノ" = "よし、じゃあ決まりだねー。ブラックマーケットを調べてみよう。"
"11100-82-ホシノ" = "意外な手がかりがあるかもしれないしね。"
"11100-83" = "次回;ブラックマーケットへ（１）"
