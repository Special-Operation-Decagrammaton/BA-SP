[translation]
"63100-1" = "第10話;遺された未来のためのエクレシア"
"63100-2" = "[log]総合試験当日[/log]"
"63100-3-アリウスの生徒たち" = "……どう？"
"63100-4-アリウスの生徒A" = "うん。"
"63100-5-アリウスの生徒A" = "分かんないけどさ。"
"63100-6-アリウスの生徒A" = "すっごい自信あるんだよね。"
"63100-7-アリウスの生徒A" = "まぁ、根拠は無いんだけど。"
"63100-8-アリウスの生徒B" = "それってつまり、全然勉強してないってことじゃん……。"
"63100-9-アリウスの生徒C" = "でもさ。"
"63100-10-アリウスの生徒D" = "ん？"
"63100-11-アリウスの生徒C" = "教科書って、勉強のための本でしょ？"
"63100-12-アリウスの生徒D" = "そうだね。"
"63100-13-アリウスの生徒C" = "ってことは、私たちの教科書は失敗作なんだよ。"
"63100-14-アリウスの生徒C" = "だって、私を教えるのに失敗してるからさ。"
"63100-15-アリウスの生徒D" = "わぁ、斬新な発想……。"
"63100-16-アリウスの生徒D" = "とにかく、試験頑張ろうね……。"
"63100-17-アリウスの生徒C" = "そっちもね……。"
"63100-18-アリウスの生徒C" = "……みんながケアレスミスしますように。"
"63100-19-アリウスの生徒D" = "お互いに頑張るんじゃなかったの……？"
"63100-20" = "[ns] \"みんな！ちゃんと勉強してきたかな？\""
"63100-21-アリウスの生徒B" = "あ、先生！"
"63100-22-アリウスの生徒B" = "先生……。"
"63100-23-アリウスの生徒B" = "どう考えても赤点取りそうな時って……どうしたらいいですか……？"
"63100-24" = "[s1] \"心配しなくても大丈夫。\"\n[s2] \"やってみなきゃ分からないよ。\"\n[s3] \"だって、結果が出るまでは赤点じゃないからね。\""
"63100-25-アリウスの生徒D" = "わあ……すっごい励まされる一言だ……。"
"63100-26" = "[s] \"とにかく、みんな頑張ってね！\""
"63100-27-アリウスの生徒D" = "はい……。"
"63100-28-アツコ" = "先生、おはよう。もしかして、見送りに来てくれたの？"
"63100-29-ミサキ" = "心配しなくても、試験はちゃんと受けるよ。これまでの苦労がもったいないし。"
"63100-30-サオリ" = "ん？先生は応援しに来てくれたんだと思ったが……。"
"63100-31-ヒヨリ" = "あ……。み、ミサキさんも、それは分かってて……#nあ、あえてそう言ったんじゃ……。"
"63100-32-サオリ" = "そうだったのか？すまない、気づけなくて……。"
"63100-33-ミサキ" = "いや、そうじゃなくて……！"
"63100-34-ミサキ" = "はあ……もういいよ。"
"63100-35-アツコ" = "それじゃあ、行ってきます。"
"63100-36-ヒヨリ" = "が、頑張ってきますね……。"
"63100-37-マイア" = "おはようございます、先生。"
"63100-38-マイア" = "お、おはようございます……。#n……あれ？今日はお休み……なんですか？"
"63100-39" = "[s4] \"今日はここで仕事があるんだ。\"\n[s5] \"みんなの応援っていう仕事がね。\""
"63100-40-マイア" = "そ、そうなんですね……。"
"63100-41-スバル" = "……先生、なんですか？私のことをじっと見て。"
"63100-42-スバル" = "はい？試験を受けることに抵抗があるか、ですか……。"
"63100-43-スバル" = "……正直、ないとは言えません。"
"63100-44-スバル" = "でも……信じてみることにしました。"
"63100-45-スバル" = "もう一度やってみようと声を上げた、[ruby=あの子たち]アリウス[/ruby]の声を。"
"63100-46-スバル" = "……そして、先生を。"
"63100-47" = "[s] \"……ありがとう。\""
"63100-48-スバル" = "な、なんですか急に！？"
"63100-49" = "[s] \"私を信じてくれて、ありがとう。\""
"63100-50-スバル" = "そ、れは……。"
"63100-51-スバル" = "え？先生だって、生徒に信じてもらえなきゃ、実は不安になってブレることもある……？"
"63100-52-スバル" = "……。"
"63100-53-スバル" = "それはちょっと……想定外の答えですね……。"
"63100-54-マイア" = "それじゃ私も、先生の役に立ててますか！？"
"63100-55" = "[s] \"もちろん。マイアも、ありがとう。\""
"63100-56" = "（マイアの頭を撫でた）"
"63100-57-マイア" = "えへへ……。なんか……嬉しいです……。ありがとうございます、先生。"
"63100-58-スバル" = "……。"
"63100-59-スバル" = "私も――"
"63100-60-マイア" = "あ、先輩！もう時間みたいです！急ぎましょう！"
"63100-61-スバル" = "えっ、あ、あぁ……。"
"63100-62-スバル" = "はい、行きましょう……。"
"63100-63" = "[ns] \"そろそろ……トリニティの方も、試験が始まってる頃かな……。\""
"63100-64" = "（大人でよかったと思えることが一つあるとすれば）"
"63100-65" = "（試験を受けなくていいということかもしれない。なんてことを考えながら）"
"63100-66" = "（近くのカフェで仕事をして、試験が終わるのを待つことにした）"
"63100-67-アリウスの生徒A" = "あぁ……これで終わりなんだね……。"
"63100-68-アリウスの生徒B" = "どうだった？"
"63100-69-アリウスの生徒C" = "……。"
"63100-70-アリウスの生徒D" = "……。"
"63100-71-アリウスの生徒D" = "……全滅。"
"63100-72-アリウスの生徒A" = "まだ自己採点もしてないのに！？"
"63100-73-アリウスの生徒D" = "なんていうか……感覚ってあるじゃん。"
"63100-74-アリウスの生徒B" = "まぁ……実は、私もそんな感じなんだけど……。"
"63100-75-アリウスの生徒D" = "心の友よ……。"
"63100-76" = "[ns] \"みんな、おかえり！\""
"63100-77-アリウスの生徒A" = "先生……。"
"63100-78-アリウスの生徒B" = "うぅ……。"
"63100-79-アリウスの生徒C" = "試験……ダメでしたぁぁぁぁ！"
"63100-80" = "[s6] \"言ったでしょ？結果が出るまでは赤点じゃないって。\"\n[s7] \"だから今は、試験が終わった後の伝統行事をやりに行こう！\""
"63100-81-アリウスの生徒D" = "試験が終わった後の……伝統行事？"
"63100-82-アリウスの生徒A" = "何ですか、それ？"
"63100-83" = "[s8] \"それはね……「テストの打ち上げ」だよ！\"\n[s9] \"美味しいものを食べて、思いっきり遊ぶ！\"\n[s10] \"絶対に守り抜くべき、伝統なんだ！\""
"63100-84-アリウスの生徒B" = "そんな素敵な伝統があったなんて……！"
"63100-85-アリウスの生徒C" = "試験も、意外と悪くないかもしれませんね！"
"63100-86-アリウスの生徒D" = "いや、それはちょっと考え直したほうが……#n準備、あんなに大変だったじゃん……。"
"63100-87-アリウスの生徒A" = "でもそれはもう終わったこと！#nつまり――！"
"63100-88-アリウスの生徒A" = "喉元過ぎれば熱さ忘れる！"
"63100-89-アリウスの生徒D" = "……！"
"63100-90-アリウスの生徒D" = "これこそアリウス流だね！"
"63100-91-アリウスの生徒B" = "だね！"
"63100-92-アリウスの生徒B" = "先生！たくさん食べても……いいですか？"
"63100-93" = "[s11] \"もちろん！\"\n[s12] \"じゃあ、他の子たちも呼んでおいで！\""
"63100-94-アリウスの生徒たち" = "はい！"
"63100-95" = "（こうして、アリウスの子たちにとって初めての試験は）"
"63100-96" = "（派手な打ち上げで、幕を閉じたのだった……）"
"63100-97-アツコ" = "こんにちは、スバル。マイアも、どうぞ座って。"
"63100-98-マイア" = "こんにちは、アツコさん。"
"63100-99-マイア" = "あ、こ、こんにちは……アツコ、姫様……。"
"63100-100-アツコ" = "ふふっ。もっと気軽に呼んでくれていいのに。"
"63100-101-アツコ" = "そう決めたでしょ？二人で。"
"63100-102-マイア" = "そ、そうは言っても……！でも、でも……うぅ……。"
"63100-103-マイア" = "あ……アツコ、さん……。"
"63100-104-アツコ" = "うん。ありがとう。"
"63100-105-スバル" = "それで……今日は、どういうご用件ですか？"
"63100-106-マイア" = "「外」では普通、試験が終わったらこうするって聞いたから。"
"63100-107-アツコ" = "さ、まずは食べよう？このカフェ、ペカンパイが有名なんだって。"
"63100-108-マイア" = "は、はい……いただきます……。"
"63100-109-アツコ" = "ふふっ、後はね、こうやってお茶をしながら、試験の感想を言い合うらしいんだけど……二人はどうだった？"
"63100-110-マイア" = "分かるところは全部書きました！"
"63100-111-マイア" = "分からないことの方が多かったですけど……。"
"63100-112-アツコ" = "スバルは？"
"63100-113-スバル" = "これが3年生なのか、と。少しギャップを感じましたね。"
"63100-114-アツコ" = "ふふ。でも、自分の実力を知るための模試だからね。"
"63100-115-アツコ" = "ペナルティとか処分もないし、気楽に結果を受け止めればいいと思うよ。"
"63100-116-マイア" = "えっ？ほ、本当の試験だと処分とかあるんですか！？"
"63100-117-アツコ" = "結果が悪かったら補習が入ったり――"
"63100-118-アツコ" = "ずっと成績が低いと……留年とか、卒業できなくなることもあるみたい。"
"63100-119-マイア" = "あ……処分って、そういう……。"
"63100-120-アツコ" = "……うん。"
"63100-121-アツコ" = "ある意味、優しい世界とも言えるかな。"
"63100-122-スバル" = "……。"
"63100-123-アツコ" = "……。"
"63100-124-スバル" = "これから……スクワッドはどうするんですか？"
"63100-125-アツコ" = "やっぱり気になるよね。まぁ、当然かな。"
"63100-126-アツコ" = "……。"
"63100-127-アツコ" = "アリウスへの責任を取ろうと思ってるよ。"
"63100-128-スバル" = "……具体的には？"
"63100-129-アツコ" = "アリウスにも生徒会ができるまで、私たちは臨時生徒会の役割を担いたいと思ってる。"
"63100-130-マイア" = "スクワッドが……生徒会に？じゃ、じゃあ――！"
"63100-131-マイア" = "私たちの学園も……やっと……ちゃんとした学園に戻れるんですか！？"
"63100-132-マイア" = "何百年ぶりに！？"
"63100-133-アツコ" = "そうなれるように、精一杯頑張るよ。"
"63100-134-アツコ" = "――アリウスの臨時生徒会長として。"
"63100-135-マイア" = "生徒会長！？"
"63100-136-スバル" = "マイア、声が大きいですよ。"
"63100-137-マイア" = "あ、す、すみません……。"
"63100-138-スバル" = "……実際、アリウスの伝統に則れば、その役目はあなたを置いて他にいません。"
"63100-139-スバル" = "それで、他のメンバーは？"
"63100-140" = "多分、ミサキが会計をやることになると思う。"
"63100-141-アツコ" = "「なんで私が……はぁ、やればいいんでしょ……」って本人は言ってたけど。"
"63100-142-アツコ" = "言い換えれば、「やるからには、ちゃんと頑張る」って意味だから。"
"63100-143-スバル" = "そうなんですか……？"
"63100-144-アツコ" = "ミサキは素直じゃないからね。#nあ、これ本人に言うとすっごく怒るから、内緒にしてね。"
"63100-145-スバル" = "……はぁ。"
"63100-146-アツコ" = "あとは……サッちゃんが総務兼副会長。"
"63100-147-スバル" = "妥当ですね。"
"63100-148-アツコ" = "学校の運営方針で、こういう提案も出してたよ。 「みんなできるだけアルバイトをしよう」って。"
"63100-149-スバル" = "なんでまた……？"
"63100-150-アツコ" = "社会のことを学べるし、お小遣いも稼げる。#nそれがアリウスの復興にもつながる、って言ってたかな。"
"63100-151-アツコ" = "みんなが慣れるまでは、契約書は全部目を通させろ、とも言ってたね。"
"63100-152-スバル" = "……自分の経験を押し付けてるだけじゃないですか。"
"63100-153-アツコ" = "ほら、人は経験から学ぶ生き物だから。#nでも、それ以外の提案もあったんだ。"
"63100-154-スバル" = "というと？"
"63100-155-アツコ" = "……。"
"63100-156-サオリ" = "これで、おおよその方向性は見えてきたな。"
"63100-157-サオリ" = "部活動設立の申請については、予算と妥当性を勘案して#n許可する必要はあるが……。"
"63100-158-サオリ" = "それは実際の状況を見ながら進めればいいだろう。"
"63100-159-サオリ" = "……ん？アツコ、もっと個人的な希望を聞きたい……とはどういう意味だ？"
"63100-160-サオリ" = "私たちは今、学園のことについて話をしているはずだ。"
"63100-161-サオリ" = "生徒会長としてのお願い……？"
"63100-162-サオリ" = "……。"
"63100-163-サオリ" = "そういうことなら……。#nいや、これは聞き流してもらって構わないのだが……。"
"63100-164-サオリ" = "制服を……作ってもいいんじゃないか……と。"
"63100-165-サオリ" = "可愛くて、お洒落だったら……いいなって……。"
"63100-166-アツコ" = "ありがとう、サッちゃん。そういうのを聞きたかったんだ。"
"63100-167-アツコ" = "ごめん、これはもう少し整理してから話すね。"
"63100-168-スバル" = "え？あ……そうですか。"
"63100-169-アツコ" = "えっと、それで……あとはヒヨリだね。"
"63100-170-アツコ" = "ヒヨリは……。"
"63100-171-アツコ" = "……書記？"
"63100-172-スバル" = "まさに、記録係としての書記でしょうね。それは……。"
"63100-173-アツコ" = "うん……本人もそれを自覚してたのか、最初は「うわあぁぁん」って泣いちゃってさ。"
"63100-174-アツコ" = "でもすぐに気を取り直して、本気で頑張るってやる気を見せてくれて。"
"63100-175-アツコ" = "ヒヨリがやる気出すのはいいことだから、私も嬉しかったな。"
"63100-176-マイア" = "わ、私にはよく分かりませんけど……でも、いいですね……ヒヨリさん、優しいですし……。"
"63100-177-スバル" = "そうですね……まあ、あなたがそう思うなら……。"
"63100-178-アツコ" = "それでね、「ニコメディアトゥループ」にもお願いしたいことがあるの。"
"63100-179-スバル" = "……私たちに？"
"63100-180-アツコ" = "風紀委員としての役割を引き受けてもらえないかな。"
"63100-181-スバル" = "風紀……委員、ですか……？"
"63100-182-アツコ" = "うん。学園の治安や風紀を守るお仕事だね。"
"63100-183-アツコ" = "これは、スバルじゃなきゃ頼めないと思うんだ。"
"63100-184-スバル" = "……もし私が断ったら？"
"63100-185-アツコ" = "断るの？"
"63100-186-スバル" = "……。"
"63100-187-マイア" = "せ、先輩……？"
"63100-188-スバル" = "……はぁ。"
"63100-189-スバル" = "そういう言い方はどうかと思いますよ。"
"63100-190-アツコ" = "そうかな？でも、臨時とはいえ生徒会長だし。"
"63100-191-スバル" = "はぁ、構いませんよ。"
"63100-192-スバル" = "（なんだかんだ人がついて行くのは……才能ですね）"
"63100-193-スバル" = "……。"
"63100-194-スバル" = "で、最終的にはどうするつもりですか？"
"63100-195-アツコ" = "アリウスを素敵な学園にしたい。"
"63100-196-スバル" = "……その点は、意見が一致しているようですね。"
"63100-197-アツコ" = "アリウスに残った生徒なら、みんな似たような気持ちなんじゃないかな。"
"63100-198-スバル" = "……それはそうかもしれません。#nただ……実現するためには、やるべきことが山積みでは？"
"63100-199-アツコ" = "分かってる。だからこそ、今度は責任を放棄したくないの。#n……この話、前にもしたよね。"
"63100-200-スバル" = "自信はあるんですか？"
"63100-201-アツコ" = "全然。私1人じゃ、できないと思うんだ。#nだから、手を貸してほしいの。"
"63100-202-スバル" = "手を取り合って、みんなで転ぶことになったら……？"
"63100-203-アツコ" = "逆に、転んだ誰かを起こしてあげられるかもしれない。"
"63100-204-アツコ" = "どうせ未来は分からないし、悪い方にばかり考えたくないんだ。"
"63100-205-スバル" = "それこそ、根拠のない楽観主義では？"
"63100-206-アツコ" = "でも、[ruby=・]動[/ruby][ruby=・]く[/ruby][ruby=・]こ[/ruby][ruby=・]と[/ruby]に意味があるんじゃないかな。"
"63100-207-アツコ" = "私は、それが一番大事だと思ってる。"
"63100-208-アツコ" = "そのためには、未来への漠然とした希望が必要でしょ？"
"63100-209-アツコ" = "みんなと一緒に、前へ進みたいんだ。"
"63100-210-スバル" = "……。"
"63100-211-スバル" = "……分かりました。"
"63100-212-スバル" = "私も、最大限協力しましょう。"
"63100-213-スバル" = "何が起こるか、何が待っているかなんて、私たちには分かりませんから。"
"63100-214-スバル" = "……試験を受けることになるとすら、思いもしませんでしたし。"
"63100-215-アツコ" = "ふふっ。私もびっくりだったな。"
"63100-216-マイア" = "そ、そういえば……トリニティの団長さん、ですけど……。"
"63100-217-アツコ" = "ミネさん？そっか、その話もしないとだね。"
"63100-218-マイア" = "き、聞いた話だと、あの日は意識が戻らなかったって……。"
"63100-219-アツコ" = "うん、そうだったみたい。"
"63100-220-アツコ" = "でも心配しないで。もう完全に回復したって。"
"63100-221-マイア" = "ほ、本当ですか！？よかった……！"
"63100-222-アツコ" = "しかも、その間は試験勉強できてなかったのに、大きな影響は無いらしいよ。"
"63100-223-スバル" = "そうですか……それは何よりですね。"
"63100-224-アツコ" = "すごいよね。「黙示録の天使」4人分の力を、自分の中に封じ込めてるようなものだったのに。"
"63100-225-スバル" = "はい！？"
"63100-226-アツコ" = "ミネさんは4人の天使を倒して、自分も気を失ったでしょ？"
"63100-227-アツコ" = "そのおかげで、7人の天使が全て調和して力を解放する――なんてことにはならずに済んだの。"
"63100-228-スバル" = "じゃあ……天使を4人も抱えたまま耐えてたってことですか！？"
"63100-229-マイア" = "す、スバル先輩……？"
"63100-230-スバル" = "あ、すみません。取り乱しました……。"
"63100-231-アツコ" = "スバルが最後の天使として撃退されたとき、ほぼ同時にミネさんも目を覚ましたみたい。"
"63100-232-スバル" = "そんな、まさか……。1人分でも意識を持ってかれかけたのに……ミネさんの精神力はどうなってるんですか……？"
