[translation]
"63080-1" = "第8話;ティータイム"
"63080-2-ナギサ" = "まずは今回の件について、改めて心より感謝申し上げます。"
"63080-3" = "[s] \"ナギサも本当にお疲れ様。\""
"63080-4-ナギサ" = "とんでもありません。私は……。"
"63080-5-ナギサ" = "……いえ、今は先生のお言葉をありがたく受け取っておきますね。"
"63080-6-ナギサ" = "アリウスの生徒たちが勉強して、試験を受ける場所については……#nどうかご心配なく。"
"63080-7-ナギサ" = "トリニティに、今は使われていない旧校舎がありますので。"
"63080-8-ナギサ" = "そちらを、無償でお貸しできるよう手配させていただきます。"
"63080-9" = "[s1] \"使われていない旧校舎……。\"\n[s2] \"無償で貸す……。\""
"63080-10-ナギサ" = "何か、気にかかることでも……？"
"63080-11-ナギサ" = "準備が手早くてびっくりした、と？"
"63080-12-ナギサ" = "何を仰るのかと思えば。#nすべてのものは、あるべき形で役目を果たしてこそ、光輝くものですから。"
"63080-13-ナギサ" = "はい？試験ですか？#n当然、ティーパーティーのメンバーも受けますが……。"
"63080-14-ナギサ" = "私たちこそ、成績が悪ければ、その資格を疑われる立場なのですよ？"
"63080-15-ナギサ" = "ですがお二人とも優秀ですから。特に心配はしていません。"
"63080-16-ナギサ" = "……え、ミカさんの成績ですか？"
"63080-17-ナギサ" = "……。"
"63080-18-ナギサ" = "先生。"
"63080-19-ナギサ" = "ミカさんは、なんと言いますか……。"
"63080-20-ナギサ" = "「地頭は良いのに、努力をしない」の典型例でして。"
"63080-21-ナギサ" = "ミカさんは頭が悪いどころか、むしろその逆です。"
"63080-22-ナギサ" = "ただ……それを進んで使おうとはしないだけで。"
"63080-23-ナギサ" = "私の推測ですが……細かいことを考えるのが面倒なのでしょうね……。"
"63080-24-ナギサ" = "まぁ、ですので。試験は大丈夫です……いつもそうでしたから……。#nはあ……。"
"63080-25-ナギサ" = "そもそも成績が悪かったら、ティーパーティーに選ばれるはずがないじゃないですか。"
"63080-26" = "[s] \"ナギサも苦労してるんだね……。\""
"63080-27-ナギサ" = "そのお言葉だけでも救われます……。"
"63080-28-ナギサ" = "さて、前置きはこのくらいにいたしましょう。"
"63080-29-ナギサ" = "今回の顛末ですが……トリニティとアリウスの問題は、両校の歴史そのものと言っても過言ではありません。"
"63080-30-ナギサ" = "同じ事象を基にしながら、それぞれがまったく異なる解釈で、歴史を受け継いできました。"
"63080-31-ナギサ" = "歴史とは、起きた事実の積み重ねですが、それを記録するのは人ですから。"
"63080-32-ナギサ" = "……。"
"63080-33-ナギサ" = "問題は、異なる解釈が存在していること。"
"63080-34-ナギサ" = "だからこそ、お互いの歴史を一つひとつ照合していこうと思っています。#n最終的には、誰もが閲覧できる状態にまで取りまとめようかと。"
"63080-35" = "[s] \"上手くいくかな……。\""
"63080-36-ナギサ" = "もちろん、両者は大きく食い違っているでしょうし……すり合わせる過程で、摩擦や衝突も一時的には増えるはずです。"
"63080-37-ナギサ" = "ですが過去を乗り越えるとは、それを曇りなく見つめようとする、勇気ある眼差しのことですから。"
"63080-38-ナギサ" = "それに、専門家の視点も借りるつもりです。"
"63080-39-ナギサ" = "記録の照合や研究であれば……喜んで引き受けてくださる方もいますので。"
"63080-40-ナギサ" = "きっとこれから、色々なことが変わっていきます。#nですが……それを乗り越えていけると、私は信じています。"
"63080-41-ナギサ" = "私の知るトリニティは、それほど脆くはありませんから。"
"63080-42-ナギサ" = "その過程で、内部での政治的ないざこざは起きるかもしれませんが……。"
"63080-43-ナギサ" = "……。"
"63080-44-ナギサ" = "ティーパーティーのホストにとっては、得意分野とも言えますし。"
"63080-45" = "[s] \"……。\""
"63080-46-ナギサ" = "政治とは、そういうものです。"
"63080-47-ナギサ" = "誰かから何かを得るために、自分が持っている何かを差し出す。"
"63080-48-ナギサ" = "そうして妥協と交換を繰り返しながら――"
"63080-49-ナギサ" = "自分が[ruby=・]本[/ruby][ruby=・]当[/ruby][ruby=・]に[/ruby][ruby=・]守[/ruby][ruby=・]り[/ruby][ruby=・]た[/ruby][ruby=・]い[/ruby][ruby=・]も[/ruby][ruby=・]の[/ruby]だけは、最後まで手放さない。"
"63080-50-ナギサ" = "ですが往々にして、初心を見失いがちです。"
"63080-51-ナギサ" = "自分が何者で、何を為そうとしていたのかすら、忘れてしまいます。"
"63080-52" = "[s] \"ナギサが守りたいものは、何？\""
"63080-53-ナギサ" = "私は……。"
"63080-54-ナギサ" = "トリニティが、最高の学園であってほしいと思っています。"
"63080-55-ナギサ" = "生徒たちが、自分の通う学園を誇らしいと思える……そんな学園であってほしい。"
"63080-56-ナギサ" = "そしていつか、トリニティでの学園生活を振り返ったとき――"
"63080-57-ナギサ" = "かけがえのない大切な時間だったと、笑って思い出せるように。"
"63080-58-ナギサ" = "ここで得た経験が、大切な宝物になってくれたらいいなと願っています。"
"63080-59-ナギサ" = "まだまだ道のりは遠いですけどね。"
"63080-60-ナギサ" = "斯くいう私自身……少しくらいは、宝物が欲しいのですが……。"
"63080-61-ナギサ" = "そのためには、やはり……。"
"63080-62-ナギサ" = "自分たちを取り巻くすべてを、より冷静な目で見つめることが必要なのだと思います。"
"63080-63-ナギサ" = "これは、先生が教えてくれたことですけどね。"
"63080-64" = "[s] \"……ナギサ。\""
"63080-65-ナギサ" = "はい？"
"63080-66" = "[s] \"あの時は、ごめん。\""
"63080-67-ナギサ" = "……え？"
"63080-68" = "[s] \"ナギサを、なかなか信じようとしなかったこと。\""
"63080-69" = "[ns] \"そして……ナギサに、酷いことを言ってしまったこと。\""
"63080-70" = "[ns3] \"私は……。\"\n[ns4] \"あんな言い方をするべきじゃなかった。\""
"63080-71-ナギサ" = "先生……？"
"63080-72-ナギサ" = "どうして……今、そんなことを……？"
"63080-73-ナギサ" = "はい？ずっと、言えてなかったから……ですか。"
"63080-74-ナギサ" = "せ、先生！そんなに深く頭を下げなくても……！"
"63080-75-ナギサ" = "……あれ？"
"63080-76-ナギサ" = "す、すみません……私……。"
"63080-77" = "[s5] \"我慢しなくていいんだよ。\"\n[s6] \"悪いのは、私なんだから。\""
"63080-78" = "[ns7] \"私も早く、立派な大人にならないと。\"\n[ns8] \"未熟な先生で、本当にごめんね。\""
"63080-79-ナギサ" = "先、生……。"
"63080-80-ナギサ" = "先生……。"
"63080-81-ナギサ" = "……。"
"63080-82-ナギサ" = "申し訳、ありません。"
"63080-83-ナギサ" = "少しの間だけ……後ろを向いていて……いただけますか……？"
"63080-84" = "（ナギサの頼み通り、後ろを向いた）"
"63080-85" = "（そのまましばらく立っていると……）"
"63080-86" = "（小さな重みが、「トン」と背中に預けられた）"
"63080-87-ナギサ" = "……辛かったです。"
"63080-88" = "[s] \"……ごめんね。\""
"63080-89-ナギサ" = "今まで、ずっと、ずっと……。"
"63080-90" = "[s] \"うん……。\""
"63080-91-ナギサ" = "何度も考えました。"
"63080-92-ナギサ" = "もちろん、私のしたことは、私の責任です。"
"63080-93-ナギサ" = "ですが……。"
"63080-94-ナギサ" = "どうして私にだけ、あんなにも厳しかったのか、と……。"
"63080-95-ナギサ" = "たしかに、ティーパーティーのホストとは、そういう立場です。"
"63080-96-ナギサ" = "補習授業部の件は、もっと酷い誹りを受けても仕方ないと思います……。"
"63080-97-ナギサ" = "それでも……。"
"63080-98-ナギサ" = "うぅっ……。"
"63080-99" = "（まるで今までの苦しみを吐き出すように……ナギサの手は、何度も私の背中を軽く叩いた）"
"63080-100" = "（か細いその手つきが……）"
"63080-101" = "（一つひとつ、私の胸に染み入ってきた……）"
"63080-102" = "[ns] \"……落ち着いた？\""
"63080-103-ナギサ" = "はい。"
"63080-104-ナギサ" = "……お見苦しいところをお見せしてしまって、申し訳ありません。"
"63080-105" = "[s] \"改めて、本当に……ごめん。\""
"63080-106-ナギサ" = "先生も、あまり気になさらないでくださいね。#nあんまりそう言われると、私も……。"
"63080-107-ナギサ" = "……。"
"63080-108-ナギサ" = "では、こうしましょう。"
"63080-109-ナギサ" = "同じ轍を踏まぬよう、お互い、これからはもう少し気をつける。"
"63080-110-ナギサ" = "そしてこの話題は、よほどのことがない限り出さない。"
"63080-111-ナギサ" = "その約束を込めて……紅茶で乾杯いたしましょう。"
"63080-112" = "[s] \"いただくよ。\""
"63080-113-ナギサ" = "では――"
"63080-114" = "[s] \"……乾杯。\""
"63080-115-ナギサ" = "乾杯。"
"63080-116" = "[ns] \"いい香りだね……。\""
"63080-117-ナギサ" = "当然です。そうでなければ困ります。"
"63080-118-ナギサ" = "……ああ、そういえば。#n何か、私に話したいことがあるとおっしゃっていませんでしたか……？"
"63080-119" = "（スバルにも話した――いや、思考を覗かれた、エデン条約事件直後の出来事）"
"63080-120" = "（パテル派とサンクトゥス派の、いわゆる「総意」についての話をした）"
"63080-121-ナギサ" = "……。"
"63080-122-ナギサ" = "…………。"
"63080-123-ナギサ" = "………………。"
"63080-124" = "[s] \"ナギサ……？\""
"63080-125-ナギサ" = "ふっ。"
"63080-126" = "[s] \"ふっ……？\""
"63080-127-ナギサ" = "……ふふっ。"
"63080-128-ナギサ" = "ふふふふふ……。"
"63080-129-ナギサ" = "なるほど、そういうことでしたか。"
"63080-130-ナギサ" = "そのお二人が誰なのか、おおよその察しはつきます。#n私のもとにも、関連報告は上がっておりましたので。"
"63080-131-ナギサ" = "本当に……。"
"63080-132-ナギサ" = "心から、感謝いたします。"
"63080-133-ナギサ" = "とても、貴重な情報でした。ふふふふふ……。"
"63080-134" = "[s] \"ひぃっ……。\""
"63080-135-ナギサ" = "うまくやっておくと自分で言っておきながら、この程度の仕事ぶり。"
"63080-136-ナギサ" = "だというのに、報告書の内容だけは[ruby=・   ・   ・]整えて[/ruby]提出していた、と。"
"63080-137" = "[s] \"ナギサ……？\""
"63080-138-ナギサ" = "ご安心ください。"
"63080-139-ナギサ" = "この件は、[ruby=・]円[/ruby][ruby=・]満[/ruby][ruby=・]に[/ruby]処理しておきます。"
"63080-140-ナギサ" = "ええ、先生が心配せずとも済むよう、[ruby=・]最[/ruby][ruby=・]善[/ruby][ruby=・]を[/ruby][ruby=・]尽[/ruby][ruby=・]く[/ruby][ruby=・]し[/ruby]ましょう。"
"63080-141-ナギサ" = "政治とは、大義名分とタイミングですから。"
"63080-142-ナギサ" = "例えば、こうした欺瞞行為を許してしまったのも……各分派の[ruby=・]代[/ruby][ruby=・]表[/ruby]の権威が回復していない証左だと見ることもできます。"
"63080-143-ナギサ" = "特に、ミカさんの立場や待遇が悩ましいですね。"
"63080-144-ナギサ" = "元通りは難しくとも、状況の[ruby=・]改[/ruby][ruby=・]善[/ruby]は提案するべきでしょうか……。"
"63080-145" = "（そう語るナギサの笑顔は……）"
"63080-146" = "（笑っているのに、笑っていなかった）"
"63080-147-ナギサ" = "……さて、重たくて頭が痛くなるような話題は、ここまでにいたしましょう。"
"63080-148-ナギサ" = "残りの時間は……ティータイムにお付き合いいただけませんか？"
"63080-149" = "[s] \"私は構わないけど……改まってどうしたの？\""
"63080-150-ナギサ" = "それは……。"
"63080-151-ナギサ" = "やっと一段落ついたわけですから。"
"63080-152-ナギサ" = "私と先生の……これまでの関係性とか……。"
"63080-153-ナギサ" = "その距離感を生み出した様々な要因だとか。"
"63080-154-ナギサ" = "そういうものに対する――"
"63080-155-ナギサ" = "[ruby=・]埋[/ruby][ruby=・]め[/ruby][ruby=・]合[/ruby][ruby=・]わ[/ruby][ruby=・]せ[/ruby]があっても良いとは思いませんか？"
"63080-156" = "[s] \"……！\""
"63080-157" = "[ns] \"その話はしないって約束したよね！？\""
"63080-158-ナギサ" = "あら。"
"63080-159-ナギサ" = "私は具体的に何かを申し上げたつもりはございませんが……。"
"63080-160" = "[s] \"言ったようなもんじゃなかったかなぁ？\""
"63080-161-ナギサ" = "ふふっ。それはどうでしょうね……？"
"63080-162-ナギサ" = "それでは、先生。"
"63080-163-ナギサ" = "あ～ん？"
"63080-164" = "[s] \"なっ！？\""
"63080-165-ナギサ" = "そんな風に拒絶されると……私のこと、お嫌いですか……？"
"63080-166" = "[s] \"そういう言い方されたら……。\""
"63080-167-ナギサ" = "ふふっ。"
"63080-168-ナギサ" = "これも、ある意味では「政治」かもしれませんね？"
"63080-169" = "（ナギサの掌の上で転がされていると認めつつ……）"
"63080-170" = "（腹を決めようとした、その時――）"
"63080-171-ミカ" = "やっほー☆#nナギちゃん、遊びに来たよ！"
"63080-172-ナギサ" = "ミカさん！？#nそれにセイアさんまで……！？"
"63080-173-ミカ" = "あれっ、先生！？#nわわっ、知ってれば、もっと色々――！"
"63080-174-セイア" = "ほう？愉快なことになりそうな予感に従って、戯れに訪れてみれば……。"
"63080-175-セイア" = "まさか、これほどのものに出くわすとは。"
"63080-176-ナギサ" = "せ、先生？どうしましょう！？#nお二人……特にミカさんには聞かれたくない話題が……！"
"63080-177" = "[s] （落ち着いて。その話自体はもう終わってたから！）"
"63080-178-ナギサ" = "！！！"
"63080-179-ナギサ" = "……そうでしたね。"
"63080-180-ナギサ" = "……こほん。お二人とも、ようこそ。#n次からは、せめてノックくらいしてください。#n先生という客人の前なのですよ？"
"63080-181-ミカ" = "はーい……というか、それならちゃんと場を用意すればいいのに。"
"63080-182-ミカ" = "先に教えてほしかったなぁ……。"
"63080-183" = "（ナギサがウィンクして合図を送ってきた）"
"63080-184" = "[ns9] \"そうだね。私からも伝えておけばよかったね。\"\n[ns10] \"ミカをびっくりさせようと思ってたんだ。\""
"63080-185-ミカ" = "ええっ！？ほんとに！？#nそれ、すっごく嬉しいんだけど……。"
"63080-186-ミカ" = "えへへ、先生ってば、もー。"
"63080-187-セイア" = "……。"
"63080-188-セイア" = "先生は本当に……罪深いね。"
"63080-189" = "[s11] \"そ、そこまで言わなくても……。\"\n[s12] \"ええっ？なんでそうなるの！？\""
"63080-190-セイア" = "君は少々、自覚が足りないからな。"
"63080-191-セイア" = "それは、自分の胸に手を当てて考えてみたらどうだい？"
"63080-192-ナギサ" = "はぁ……こうなった以上、久しぶりに……皆さんそろっての「ティータイム」にいたしましょう。"
"63080-193-ナギサ" = "せっかく先生がいらしていることですし。"
"63080-194-ミカ" = "うん！賛成！"
"63080-195-ミカ" = "あれ？もしかして……4人一緒のティータイムって初めてかも？"
"63080-196-ミカ" = "いや、違ったっけ？"
"63080-197-セイア" = "どちらだって構わないさ。"
"63080-198-セイア" = "肝要たるは、こうして一堂に会している。その事実だけだ。"
"63080-199-セイア" = "もっとも、ミカには、おそらく世のほとんどの出来事がいつだって新鮮に映るのだろうけれど。"
"63080-200-ミカ" = "せ～い～あ～ちゃ～ん？#nそれ、私が忘れっぽいって言いたいのかなぁ？"
"63080-201-セイア" = "君がそう思うのなら、そうなのだろうね。"
"63080-202-ミカ" = "あんまりひねくれたことばっかり言ってたら、そのうちみんなに距離置かれちゃうかもよ？"
"63080-203-セイア" = "実際にその状況に陥ってから、方策を検討するとしよう。"
"63080-204-セイア" = "私自身、未来を読むことは叶わなくなった身だからね。"
"63080-205-ミカ" = "ほんっと、屁理屈ばっかり！"
"63080-206-セイア" = "……ふふっ。"
"63080-207-ナギサ" = "はぁ……お二人とも。先生もご一緒だということ、お忘れじゃないですか？"
"63080-208" = "[ns13] \"仲良くやってるみたいで嬉しいよ。\"\n[ns14] \"喧嘩するほど仲が良いって言うもんね。\""
"63080-209-ナギサ" = "そう言っていただけると……本当に、申し訳ありません……。"
"63080-210" = "次回;試験勉強"
