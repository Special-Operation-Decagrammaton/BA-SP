[translation]
"63010-1" = "第1話;私たちの憎悪"
"63010-2-スバル" = "正直……少し、驚いています。#nまさかこのポルタパシスに先生がいらっしゃるとは。"
"63010-3" = "[s] \"生徒が急にいなくなったら、探しに行くものだからね。”"
"63010-4-スバル" = "……随分と面倒見が良いのですね。"
"63010-5-スバル" = "黙っていなくなる生徒なんて、放っておけばいいじゃないですか。"
"63010-6" = "[s] \"……無断欠席の生徒がいたら、心配にもなるよ。\""
"63010-7-スバル" = "……そもそも、授業なんてお願いした覚えもありませんが。"
"63010-8" = "[s1] \"生徒はどうして生徒なんだと思う？\"\n[s2] \"学園に通って、勉強するから生徒なんだと思っているよ。\""
"63010-9" = "[ns] \"学ぶからこそ、生徒なんだよ。\""
"63010-10-スバル" = "ですがそれは……[ruby=・]先[/ruby][ruby=・]生[/ruby][ruby=・]の[/ruby][ruby=・]基[/ruby][ruby=・]準[/ruby][ruby=・]で[/ruby][ruby=・]定[/ruby][ruby=・]め[/ruby][ruby=・]ら[/ruby][ruby=・]れ[/ruby][ruby=・]た[/ruby]勉強ですよね？"
"63010-11-スバル" = "アリウスには、アリウスなりのやり方があります。"
"63010-12-スバル" = "私たちの意思を否定して……トリニティの勉強を押しつけるおつもりなのですか？"
"63010-13-スバル" = "……「そんなつもりはない」とでも？"
"63010-14-スバル" = "ふふっ。おっしゃらずとも分かりますよ、そのくらい。"
"63010-15-スバル" = "今の私は、ええ……そういうことが理解できるようになったみたいでして。"
"63010-16-スバル" = "少なくとも――アリウス分校での出来事については。"
"63010-17-スバル" = "まぁ、それはそれとして。#nアリウス[ruby=・   ・]分校[/ruby]。私はこの呼び方があまり好きではありません。"
"63010-18-スバル" = "だって……それは、どこかに属する学園であることを意味するでしょう？"
"63010-19-スバル" = "ではここで、一つ質問です。"
"63010-20-スバル" = "どうして、あの日――"
"63010-21-スバル" = "トリニティが、何百年ぶりかに……アリウスに土足で踏み込んだ――あの日。"
"63010-22-スバル" = "[ruby=みその]聖園[/ruby]ミカ、ベアトリーチェ、そして……スクワッドが、勝手に自分たちの運命を決めてしまった――あの日。"
"63010-23-スバル" = "その陰で……[ruby=私たち]他のアリウス生たち[/ruby]は、自らの道すら選べなくなってしまった――あの日。"
"63010-24-スバル" = "先生はどうして……[ruby=みその]聖園[/ruby]ミカやスクワッドに対しては、あれほどまで慈しんでくださったのに――"
"63010-25-スバル" = "[ruby=私たち]他のアリウス生たち[/ruby]には、同じように手を差し伸べてくれなかったのですか？"
"63010-26" = "[ns] \"それは……。\""
"63010-27" = "（その瞬間、「あの日」の直後に交わした会話を思い出した）"
"63010-28-ティーパーティーの生徒A" = "このようなことを申し上げるのは、大変心苦しいのですが――"
"63010-29-ティーパーティーの生徒A" = "先生には、アリウス分校の件から手を引いていただきたいのです。"
"63010-30-ティーパーティーの生徒B" = "本来、この問題は[ruby=自分たち]トリニティ[/ruby]で解決すべきもの。"
"63010-31-ティーパーティーの生徒B" = "だというのに……先生の力をお借りする結果となってしまって、面目次第もございません。"
"63010-32-ティーパーティーの生徒A" = "パテル分派の[ruby=・]臨[/ruby][ruby=・]時[/ruby][ruby=・]代[/ruby][ruby=・]表[/ruby]として――"
"63010-33-ティーパーティーの生徒B" = "そして、サンクトゥス分派の[ruby=・]臨[/ruby][ruby=・]時[/ruby][ruby=・]代[/ruby][ruby=・]表[/ruby]として――"
"63010-34-ティーパーティーの生徒A" = "心より、お詫び申し上げます。"
"63010-35-ティーパーティーの生徒A" = "……重ねて、申し訳ございません。ご説明を失念しておりました。#nパテル分派の[ruby=・]代[/ruby][ruby=・]表[/ruby]は、今なおミカ様ですが――"
"63010-36-ティーパーティーの生徒A" = "しばらくは、第一線から退かざるを得ないでしょう。#n先生もご存知の通り、聴聞会は中断されたままですから。"
"63010-37-ティーパーティーの生徒B" = "セイア様についても同様です。"
"63010-38-ティーパーティーの生徒B" = "今回のアリウス攻防戦に参加こそされましたが、未だ全快とは言えません。#nしばらくは療養を続けられる予定です。"
"63010-39-ティーパーティーの生徒A" = "ですので、[ruby=・]臨[/ruby][ruby=・]時[/ruby][ruby=・]代[/ruby][ruby=・]表[/ruby]である私たちの言葉を以って、パテル分派及びサンクトゥス分派の総意だと捉えていただいて構いません。"
"63010-40-ティーパーティーの生徒B" = "あるいは……ナギサ様率いるフィリウス分派は、また別の意見を出されるかもしれませんが。"
"63010-41-ティーパーティーの生徒B" = "ですが、ティーパーティーの意思は、多数決によって決定されます。"
"63010-42-ティーパーティーの生徒A" = "これほどの大事ですし、少数意見も尊重されてしかるべきですが……過半数の意見を覆すには至りません。"
"63010-43-ティーパーティーの生徒B" = "ですから……先生。どうか、私たちの行く末を見守っていていただきたいのです。"
"63010-44-ティーパーティーの生徒B" = "私たちの問題を、私たち自身で解決させてください。"
"63010-45-ティーパーティーの生徒A" = "もちろん、先生が動いてくだされば――"
"63010-46-ティーパーティーの生徒A" = "ずっと早く、もっと良い形で、決着するのかもしれません。"
"63010-47-ティーパーティーの生徒B" = "けれど、大人に頼り切ってしまえば……生徒の成長する機会がなくなってしまいますから。"
"63010-48-スバル" = "……そういうことだったのですね。"
"63010-49" = "[ns] \"！？\""
"63010-50-スバル" = "ふふっ、そんなに驚かないでください。"
"63010-51-スバル" = "およそ分かる、と言ったではないですか。"
"63010-52-スバル" = "ですが……先生は少しばかり信じすぎているのでは？#n生徒を――それも、トリニティの上層部を。"
"63010-53-スバル" = "サンクトゥス分派とパテル分派、それぞれの臨時代表。"
"63010-54-スバル" = "代表が職務を離れた途端、その座に収まった生徒たち。"
"63010-55-スバル" = "何の後ろ盾もなく、そんなことができたとでも？"
"63010-56-スバル" = "あそこは……いつ何時だって、生馬の目を抜くような場所だというのに。"
"63010-57-スバル" = "ともあれ、理解はしました。そういう事情であれば、先生に大きな責任は無い――#nどころか、全く無いとさえ言えるかもしれません。"
"63010-58-スバル" = "まあ、あの日以降も変わらず、アリウスは地獄の渦中だったという事実は変わりませんが。"
"63010-59" = "[s] \"……。\""
"63010-60-スバル" = "今後は気をつけたほうが良いかと。"
"63010-61-スバル" = "先生の立場では、悪意をもって近づく生徒がいたとして……#nその罠から逃れるのは難しいでしょうから。"
"63010-62-スバル" = "事実、先生は見落とされていたわけですから。"
"63010-63-スバル" = "アリウスに残された子が、勇気を振り絞って踏み出した外の世界で――"
"63010-64-スバル" = "どこにも馴染めず、周囲の視線に耐え切れず……結局、「[ruby=自分]アリウス[/ruby]は、[ruby=自分]アリウス[/ruby]の生き方しかできない」と挫折してしまうかもしれない。"
"63010-65-スバル" = "この世界のどこにも、[ruby=自分]アリウス[/ruby]の居場所はないのだと。#n大きな傷を負って、アリウスに戻らざるをえないかもしれない。"
"63010-66-スバル" = "その可能性を、見落としたんです。"
"63010-67-スバル" = "あろうことか、トリニティの上層部を信じる――という選択の結果として。#n……何か間違っていますか？"
"63010-68-スバル" = "それとも……他の学園に掛かりきりで、#nアリウスなんて端から気にも留めていなかったのでしょうか。"
"63010-69" = "[s] \"……。\""
"63010-70-スバル" = "[ruby=いま]現在[/ruby]は、過去を礎にした建築物です。#nすべての過去は、現在と無関係ではありません。"
"63010-71-スバル" = "……過去は過去。過去の憎悪は、現在を生きる者には関係ない。そう言う人だっているでしょう。"
"63010-72-スバル" = "ですが私は、その意見にはどうしても賛同できません。"
"63010-73-スバル" = "過去の結果として、現在のアリウスがあり……#nいま現在、アリウスは雁字搦めにされているのですから。"
"63010-74-スバル" = "先生は言いましたよね。"
"63010-75-スバル" = "学園に通って勉強をするのが生徒だ、と。"
"63010-76-スバル" = "でしたら、私はこう答えましょう。"
"63010-77-スバル" = "ポルタパシス――ここに記録されているすべてが、#n私たちにとっての「勉強」です。"
"63010-78-スバル" = "生徒の本分が「勉強」であるならば……私はちゃんと行動してきたと思いますよ。"
"63010-79-スバル" = "その本分を守るために、ここへ来たのですから。"
"63010-80-スバル" = "もしも、「これは勉強じゃない」と先生がおっしゃるのなら。"
"63010-81-スバル" = "私は聞きたい。#n勉強に優劣や区別をつけることが、教育者の姿勢なのですか――と。"
"63010-82-スバル" = "罰は、受け継がれていくものです。"
"63010-83-スバル" = "その事実だけは――誰もが認めなければならない。"
"63010-84-スバル" = "過去の「恩恵」だけを享受して、「罰」を背負わない。#n……そんなことは認められません。"
"63010-85-スバル" = "「罰」を背負わないと言うのなら、過去が残したあらゆるものすべて――"
"63010-86-スバル" = "知識、知恵、資産、すべての権利や権力をも――「罰」と同じように、拒むべきでしょう。"
"63010-87-スバル" = "……欲しいものだけを選び取る？"
"63010-88-スバル" = "[ruby=私たち]アリウス[/ruby]からすれば、吐き気をもよおすような傲慢でしかありません。"
"63010-89-スバル" = "あの日、先生はトリニティのやり方を尊重することにし……#nだから、アリウスには干渉しなかった。"
"63010-90-スバル" = "そんな先生を……私は許しません。#n[ruby=・]罪[/ruby][ruby=・]の[/ruby][ruby=・]無[/ruby][ruby=・]い[/ruby][ruby=・]者[/ruby]を、許すことはできませんから。"
"63010-91-スバル" = "ですがその代わり……アリウスにも、「アリウスのやり方」で生きる自由を、認めてほしいのです。"
"63010-92-スバル" = "トリニティには、トリニティのやり方があったように。"
"63010-93-スバル" = "まさか、一方だけ尊重して、もう一方は認めないなどとは……おっしゃいませんよね？"
"63010-94" = "[s] \"……。\""
"63010-95-スバル" = "[ruby=私たち]アリウス[/ruby]は――馴染めないんです。"
"63010-96-スバル" = "外の世界は、魅力的かもしれません。#nですが、そこに[ruby=私たち]アリウス[/ruby]の居場所はありませんでした。"
"63010-97-スバル" = "実際、適応できずに戻ってきた子はたくさんいます。"
"63010-98-スバル" = "だから私は、その子たちを受け入れて、アリウスのやり方で進む道を示しました。"
"63010-99-スバル" = "試験も、勉強も、要りません。#n[ruby=私たち]アリウス[/ruby]は、[ruby=私たち]アリウス[/ruby]の生き方で生きていきます。"
"63010-100-スバル" = "だから……お願いします。"
"63010-101-スバル" = "スクワッドを連れて、アリウスから立ち去ってください。"
"63010-102-スバル" = "そうしていただけるなら、先生やスクワッドに、決して危害を加えません。"
"63010-103-スバル" = "「黙示録の天使」については……。"
"63010-104-スバル" = "……。"
"63010-105-スバル" = "こちらで、どうにかします。"
"63010-106-スバル" = "少なくとも「ラッパ吹きの天使」は、私が確実に対処できますから。"
"63010-107" = "[s] \"「ラッパ吹きの天使」……？\""
"63010-108-スバル" = "おや、この名を聞いて、先生にも心当たりが？"
"63010-109-スバル" = "さすがです。生徒のこととなれば、何であれ察しがいい。"
"63010-110-スバル" = "であるならば、私たちの願いも……理解していただけると信じています。"
"63010-111" = "[s] \"……。\""
"63010-112-スバル" = "さあ、お帰りはあちらです。"
"63010-113-スバル" = "後ろで控えているスクワッドの皆さんも、ご一緒に。"
"63010-114-スバル" = "そして――"
"63010-115-スバル" = "もう二度と、この地を訪れないでください。"
"63010-116-スバル" = "……今まで、お疲れ様でした。"
"63010-117-サオリ" = "スバル。アリウスのやり方、と言っていたな。"
"63010-118-スバル" = "……サオリ。"
"63010-119-スバル" = "言い残したことがあるのなら、伺いましょう。"
"63010-120-スバル" = "それを口実に戻ってこられても、面倒なだけですから。"
"63010-121-サオリ" = "言い残したこと……ではないな。一つ、聞きたいことがあるんだ。"
"63010-122-サオリ" = "お前の言うアリウスのやり方――"
"63010-123-サオリ" = "その先には……何があるんだ？"
"63010-124-スバル" = "……！"
"63010-125" = "次回;それでも"
