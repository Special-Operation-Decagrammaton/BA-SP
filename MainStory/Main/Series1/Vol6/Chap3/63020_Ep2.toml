[translation]
"63020-1" = "第2話;それでも"
"63020-2-サオリ" = "その先には……何があるんだ？"
"63020-3-スバル" = "……！"
"63020-4-サオリ" = "話を聞きながら、昔のことを思い出したんだ。それで、つい気になってな。"
"63020-5-スバル" = "……過去の思い出にしがみつくのは、老いと弱さの証だそうですよ。#n衰えたのではないですか？"
"63020-6-サオリ" = "そうかもしれない。昔に比べれば、鈍くなった感覚はある。"
"63020-7-サオリ" = "だが、それと引き換えに得たものも、確かにあったんだ。"
"63020-8-サオリ" = "こんなものは、先生の前でするような話じゃないが――"
"63020-9-サオリ" = "スバル。「厳格な教官と、親切な百人隊長」の話は知っているか？"
"63020-10-スバル" = "当然です。組織の運営には不可欠とも言える概念ですから。"
"63020-11-スバル" = "……自分がその「親切な百人隊長」だった、などと言うつもりではないですよね？"
"63020-12-サオリ" = "まさか。その役割はお前だっただろう？#nどう考えても、私は「厳格な教官」だった。"
"63020-13-スバル" = "人は、生きてきたようにしか生きられませんからね。"
"63020-14-サオリ" = "そうだな。私は、学び、経験した通りにしか、周囲と接することができなかった。"
"63020-15-サオリ" = "スクワッドは、精鋭だったからな。#nリーダーともなれば、他よりも厳しい訓練が課されたものだ。"
"63020-16-サオリ" = "……私は結局、自分の過去を超えることができなかった。"
"63020-17-サオリ" = "……つくづく、情けない話だ。"
"63020-18-スバル" = "まったく……あなたを慰める羽目になるとは思いませんでしたが……卑下する必要はありませんよ。"
"63020-19-スバル" = "言ったでしょう？人は、生きてきたようにしか生きられないものです。"
"63020-20-サオリ" = "ああ。私もそう思っていた。"
"63020-21-サオリ" = "――アリウスにいた頃まではな。"
"63020-22-スバル" = "……それは、どういう意味で？"
"63020-23-サオリ" = "おおよそ人の考え方は、それまでの人生に左右される。#nそして、そうやって身についた考え方が、自分の人生を再生産していく。"
"63020-24-サオリ" = "この観点で見れば、お前の意見も間違いとは言えないだろう。"
"63020-25-サオリ" = "だがな。[ruby=・   ・   ・   ・   ・   ・   ・   ・   ・   ・   ・   ・]望みに任せて生きる可能性[/ruby]だって、人は持っているんだ。"
"63020-26-サオリ" = "これは……アリウスを出てから学んだことだ。"
"63020-27-スバル" = "……だからなんだと言うのですか？"
"63020-28-サオリ" = "お前の考えはよく理解できる、ということだ。私も同じだったからな。"
"63020-29-サオリ" = "道を見失った子供たちに、進むべき道を示し、生きる意志を吹き込んでやる。"
"63020-30-サオリ" = "それは同時に、お前自身の生きる意味や意志にもなっていたはずだ。"
"63020-31-サオリ" = "だが……その先には何がある？#nお前の言う「アリウスのやり方」で、その行き着く先は？"
"63020-32-サオリ" = "……答えなくていい。私にも分かっていることだからな。#nそこにあるのは……憎悪と怒りだけだ。"
"63020-33-サオリ" = "それ以外には何もない。意味なんかないんだ。何も残らない。そういうやり方だからな。"
"63020-34-サオリ" = "私だってアリウスに残ったまま、別の世界があるなんて知らずにいたら――"
"63020-35-サオリ" = "「先生」に出会えなかったら……お前と何ひとつ変わらない生き方をしていただろう。"
"63020-36-サオリ" = "ずっと「厳格な教官」を演じ続けて、自分の知らないことは、全部否定して。"
"63020-37-サオリ" = "――自分たちのものだと思い込んだ憎悪を、果てしなく胸に抱き続けながら。"
"63020-38-スバル" = "このやり方が間違っていると、今さら非難するつもりですか？"
"63020-39-サオリ" = "そもそも正しいか否かを判断できるようなものじゃない。"
"63020-40-サオリ" = "ただ……「他」を知るというのも、役に立つかもしれないという話だ。"
"63020-41-サオリ" = "自分の知らない外の世界。#nそれを、ほんの少しでも「学んで」から、改めて考え直してはみないか？"
"63020-42-サオリ" = "……考え方なんてのは、思いのほか簡単に変わったり揺らいだりするからな。"
"63020-43-サオリ" = "これを、何も知らない連中……例えばお前の言うところの、トリニティのお嬢様が言ったなら。"
"63020-44-サオリ" = "それこそ偽善と欺瞞に満ちた、能天気な楽観主義者の戯言に聞こえるだろう。"
"63020-45-サオリ" = "だが……私やスクワッドの意見ならどうだ？"
"63020-46-サオリ" = "……底辺で這いずり回ったのは、私たちも同じだったはずだ。"
"63020-47-サオリ" = "……能天気な楽観主義者なんて、私も好きじゃなかった。"
"63020-48-サオリ" = "正直に言えば、嫌いだった。憎しみしか持てなかった。"
"63020-49-サオリ" = "世の中の醜い部分には目もくれず。"
"63020-50-サオリ" = "むやみやたらに自分の主張を押し付けてくるのが、本当に嫌いだった。"
"63020-51-サオリ" = "だが、例外はいた。むしろ――"
"63020-52" = "[log]私はサオリと、対等に話がしたい。[/log]"
"63020-53" = "[log]チャンスは、なければ作り出せばいいからね。[/log]"
"63020-54" = "[log]もしそれがダメでも、次のチャンスを作ればいい。[/log]"
"63020-55-サオリ" = "世界のおぞましさを知りながら――"
"63020-56-サオリ" = "世界は元から醜いものだと認めながら――"
"63020-57-サオリ" = "それでも、決して諦めない人がいた。"
"63020-58-サオリ" = "結局、私は説得されてしまった。"
"63020-59-サオリ" = "「それでも」#n――この言葉は、あまり好きではなかったんだがな。"
"63020-60-サオリ" = "不利な状況にさらされながら、[ruby=・]そ[/ruby][ruby=・]れ[/ruby][ruby=・]で[/ruby][ruby=・]も[/ruby]と諦めず前を向く。#nこの言葉にも、意味があるのだと思うようになった。"
"63020-61-スバル" = "偉そうに語っていますが……あなただって大差ないでしょう？"
"63020-62-スバル" = "コソコソ逃げ回る、お尋ね者のくせに！"
"63020-63-サオリ" = "ああ、その通りだ。"
"63020-64-サオリ" = "だから……もうやめるつもりだ。"
"63020-65-スバル" = "……はい！？"
"63020-66" = "[ns] \"……え！？\""
"63020-67-サオリ" = "他の三人とも話はついている。"
"63020-68-ミサキ" = "……まあ、そういうこと。"
"63020-69-ミサキ" = "えへへ……。#nサオリ姉さんが、そう決めたのなら……。"
"63020-70-ミサキ" = "こんな生活は、いつまでも続けられるわけじゃないからね。"
"63020-71-ミサキ" = "先生……何も言わず決めてしまってすまない。#n話そうとは思っていたんだが、なかなかタイミングが合わなくてな。"
"63020-72" = "[s1] \"それは……構わないけど。\"\n[s2] \"みんな、本当に大丈夫なの……？\""
"63020-73-ミサキ" = "ああ。この件が終わったら、私たちは自首する。"
"63020-74-ミサキ" = "……もう、疲れたんだ。"
"63020-75-ミサキ" = "影を探してコソコソするのも、陽の下を堂々と歩けないのも。"
"63020-76-スバル" = "忘れたんですか？あなた達はテロリストです。"
"63020-77-スバル" = "「殺意」と「悪意」を持って、テロを起こした。"
"63020-78-スバル" = "どれほどの刑罰が科されるか、想像もつきませんよ？"
"63020-79-サオリ" = "そうだろうな。#n……だが、その方がマシだ。"
"63020-80-サオリ" = "自分でやったことのケジメを、自分でつける。"
"63020-81-サオリ" = "これ以上、自分自身から逃げるのは嫌なんだ。"
"63020-82-サオリ" = "他のアリウス生たちについては、心配しなくていい。"
"63020-83-サオリ" = "すべて私が主導し、私が実行したことにする。"
"63020-84-サオリ" = "……まあ、全くのウソというわけでもないからな。"
"63020-85-サオリ" = "だから、お前も――"
"63020-86" = "[log=니코 스바루][FF6666]何が言いたいの、[-][ruby=[FF6666]じょうまえ[-]][FF6666]錠前[-][/ruby][FF6666]サオリ。[-][/log]"
"63020-87-サオリ" = "……何？"
"63020-88-スバル" = "何を言いたいのかって聞いてるの。"
"63020-89-スバル" = "……いや、答えなくてもいい。あまりにも見え透いてるから。"
"63020-90-スバル" = "自首する？もう逃げたくない？"
"63020-91-スバル" = "今さら善人ぶるつもり？"
"63020-92-スバル" = "それとも真理を悟った賢者にでもなったつもり？"
"63020-93-スバル" = "世界を憐れんで、すべてを諦観しているつもり？"
"63020-94-スバル" = "お前が世界のすべてを知り尽くしたとでも？"
"63020-95-スバル" = "そんな風に分かった顔をして、アリウスをお前のものみたいに見下すな。"
"63020-96-スバル" = "それは……トリニティの連中と何一つ変わらない……！"
"63020-97-スバル" = "ふざけるのも大概にして！"
"63020-98-スバル" = "目がついているの[ruby=ここ]ならアリウスを見[/ruby]ろ！#nお前が出て行ったときと、何が変わったというの？"
"63020-99-スバル" = "相変わらず廃墟のまま！あの頃よりひどくなった場所だってある！"
"63020-100-スバル" = "お前に……[ruby=ここ]マダムが去った後のアリウス[/ruby]の何が分かるって言うんだ！"
"63020-101-スバル" = "お前たちも先生と同じだ。何も！気にかけてこなかった！"
"63020-102-スバル" = "それでもずっと！[ruby=ここ]マダムが去った後のアリウス[/ruby]を守ってきたのは私だ！#n――私たちなんだよ！"
"63020-103-スバル" = "[ruby=お前ら]スクワッド[/ruby]は全部放り投げて逃げ出したくせに！"
"63020-104-サオリ" = "違うんだ。そんな大それた話をするつもりはない。"
"63020-105-サオリ" = "真理を悟った賢者だなんて、私はそんなものを気取るつもりもないし、そんな資格もない。"
"63020-106-サオリ" = "私は、ただ……。"
"63020-107-サオリ" = "ただ――"
"63020-108-サオリ" = "（あの日以来、初めて見上げた空は、ただ青く澄んでいた）"
"63020-109-サオリ" = "（だからこそ、改めて思い知らされた）"
"63020-110-サオリ" = "（ああ――きっとこの世界は、ずっと前から変わらずに、そこにあったのだと）"
"63020-111-サオリ" = "（目は見ることに飽きることがなく、耳は聞くことに満足することがない）"
"63020-112-サオリ" = "（すでにあるものは、後にもまたある）"
"63020-113-サオリ" = "（先になされた事は、また後にもなされる。日のもとに新しきことなし）"
"63020-114-サオリ" = "（幸せなこと、辛いこと。傲慢も、謙遜も。#n……怒りや憎しみさえも）"
"63020-115-サオリ" = "（それこそ――）"
"63020-116" = "[ruby=Vanitas vanitatum et omnia vanitas]全ては虚しい。どこまで行こうとも、全てはただ虚しいものだ[/ruby]。"
"63020-117-サオリ" = "――自分の人生が[ruby=・]惜[/ruby][ruby=・]し[/ruby][ruby=・]い[/ruby]と、思うようになっただけだ。"
"63020-118-スバル" = "……！"
"63020-119" = "[log=니코 스바루]そんな風に[/log]"
"63020-120" = "[log=니코 스바루]言うな。[/log]"
"63020-121" = "[log=니코 스바루]裏切って[/log]"
"63020-122" = "[log=니코 스바루]逃げ出したくせに、[/log]"
"63020-123" = "[log=니코 스바루]どうして[/log]"
"63020-124" = "[log=니코 스바루]そんなことを言うの。[/log]"
"63020-125" = "[log=니코 스바루][FF6666]人生が惜しい？[-][/log]"
"63020-126" = "[log=니코 스바루][FF6666]それなら、ここにいる[-][ruby=[FF6666]私たち[-]][FF6666]アリウス[-][/ruby][FF6666]は？[-][/log]"
"63020-127" = "[log=니코 스바루][FF6666]……何があっても、いつか帰ってくる子供たちのために[-][/log]"
"63020-128" = "[log=니코 스바루][FF6666]この巣を守ろうとした私は？[-][/log]"
"63020-129-スバル" = "過去は！決して消えやしない！！"
"63020-130-サオリ" = "スバル！？"
"63020-131-スバル" = "過去はいつまでも残る！過去が現在を証明している！"
"63020-132-スバル" = "これが！このポルタパシスが！#nここに絡みついたアリウス分校の過去こそ、私そのものなんだ！"
"63020-133-スバル" = "結局、この世で一番大切なのは自分自身だ。#n自分が死ねば、世界だって死ぬ！"
"63020-134-スバル" = "それなら……自分の生き方や在り方こそ――世界そのものだ！"
"63020-135-スバル" = "誰も、人生の責任を取ってくれやしない。#nだから私は、子供たちから不安を取り除いた！"
"63020-136-スバル" = "どんなことが起きても、ちゃんと生き抜けるように！"
"63020-137-スバル" = "あなたは間違っていましたよ、マダム。それは変わらない事実です。"
"63020-138-スバル" = "でもあなたが遺したすべてが……完全に間違いだったわけじゃない。"
"63020-139-スバル" = "意味のない事は起こらない。出来事は、起きることで意味を得る。"
"63020-140-スバル" = "だから――意味のない苦しみなんて、ないのでしょう。"
"63020-141-スバル" = "意味のない過去が存在しないのと、同じように。"
"63020-142-ヒヨリ" = "な、なんかちょっと……変じゃないですか……？"
"63020-143-サオリ" = "先生！私たちの後ろへ！"
"63020-144-ミサキ" = "……リーダー、ちょっと煽りすぎたね。"
"63020-145-サオリ" = "ち、違う……私はそんなつもりなんて――"
"63020-146-アツコ" = "この話は後にしよっか。"
"63020-147-アツコ" = "今は――"
"63020-148" = "[log]第七の御使が吹き鳴らすラッパの音がする時。[/log]"
"63020-149" = "[log]地を滅ぼす者、偽りし者。[/log]"
"63020-150" = "[log]その名を汚す者どもを[/log]"
"63020-151" = "[log]ついに滅ぼされる時が来ました。[/log]"
"63020-152-アツコ" = "――目の前のことから片づけよう。"
"63020-153" = "次回;ラッパ吹きの天使"
