[translation]
"63070-1" = "第7話;試み"
"63070-2-スバル" = "……。"
"63070-3-スバル" = "慣れませんね……。"
"63070-4-スバル" = "こんにちは、スバルさん！午後の検診に来ました。"
"63070-5-セリナ" = "ごめんなさい、午前中は授業があってどうしても……。"
"63070-6-スバル" = "授業、ですか。"
"63070-7-スバル" = "それが、[ruby=・]普[/ruby][ruby=・]通[/ruby]なんでしょうね。"
"63070-8-セリナ" = "……。"
"63070-9-セリナ" = "救護騎士団の病室は、ご不便ないですか？"
"63070-10-スバル" = "……ええ。こんなに整った設備は見たこともありません。"
"63070-11-スバル" = "おかげで、皆さんの回復も早いようです。"
"63070-12-アリウスの生徒たち" = "体がウズウズしてきたな〜"
"63070-13-アリウスの生徒たち" = "もう退院していいんじゃない……？"
"63070-14-ハナエ" = "ダメですよ！治りかけが危ないんですから！"
"63070-15-ハナエ" = "団長の許可が出るまでは我慢です！"
"63070-16-スバル" = "ああやって言ってくれますし。"
"63070-17-セリナ" = "……。"
"63070-18-セリナ" = "あの、スバルさん？"
"63070-19-スバル" = "はい？"
"63070-20-セリナ" = "私たちのこと……憎んでいたり、しませんか？"
"63070-21-スバル" = "急にどうしたんですか？#nこうして治療をしていただいて、感謝こそすれ……。"
"63070-22-スバル" = "……。"
"63070-23-スバル" = "そういうこと、ですか。"
"63070-24-セリナ" = "はい……。"
"63070-25-スバル" = "（あの日）"
"63070-26-スバル" = "（天使のラッパが止まった、あの日）"
"63070-27-スバル" = "（多くの生徒が、アリウス分校を訪れた）"
"63070-28-スバル" = "（ゲヘナの救急医学部、トリニティの救護騎士団。その他にもたくさん）"
"63070-29-スバル" = "（私たちは、救護騎士団の本館に搬送された）"
"63070-30-スバル" = "（今に至るまで、ここで治療を受けながら回復を待っている）"
"63070-31-スバル" = "……トリニティやゲヘナの助けを受けたという事実に、まだ戸惑っている生徒もいます。"
"63070-32-スバル" = "助けてもらっておいて何を。という話ではあるのですが……。"
"63070-33-スバル" = "もう少しだけ、気持ちを整理する時間をいただけるとありがたいです。#nすみません。"
"63070-34-セリナ" = "いえ！むしろ私たちの方こそ……。"
"63070-35-スバル" = "はい……。"
"63070-36-スバル" = "それはそれとして。"
"63070-37-スバル" = "私たちを看てくださったことについては、感謝しています。"
"63070-38-セリナ" = "いえいえ！とんでもないです！"
"63070-39-ミネ" = "容体の方は？"
"63070-40-スバル" = "私は平気です。ですがミネさんこそ……。"
"63070-41-ミネ" = "ご心配なく。非力ではありますが、これでも救護騎士団の団長ですので。"
"63070-42-スバル" = "……あの日、ミネさんに何があったのですか？"
"63070-43-ミネ" = "はい？"
"63070-44-ミネ" = "ああ、私が倒れた日のことですね。"
"63070-45-ミネ" = "……。"
"63070-46-ミネ" = "私はただ、皆さんを守っただけです。"
"63070-47-ミネ" = "こうして元気にお話しできて、良かった。"
"63070-48-ミネ" = "スバルさんは……どうお考えですか……？#nこれまでと、これからのアリウスのことを……。"
"63070-49-スバル" = "心に何の感情も湧かないかと言えば、嘘になります。"
"63070-50-ミネ" = "……。"
"63070-51-スバル" = "ですが……この気持ちを抱えたままでも、生きていこうと思います。"
"63070-52-スバル" = "この感情が膨れ上がるかもしれないし、少しずつ沈んでいくかもしれない。#nあるいは燃え尽きて、灰だけが残るかもしれない。"
"63070-53-スバル" = "……それでも、生きていかなければならないのですから。"
"63070-54-ミネ" = "……そうですか。その強い覚悟、私も学ばせていただきます。"
"63070-55-ミネ" = "ええ、学び――"
"63070-56-ミネ" = "ここからは試験勉強の時間です！！！"
"63070-57-スバル" = "はい！？"
"63070-58-ミネ" = "気を引き締めてください！試験まで、残された時間はわずかです！"
"63070-59-ミネ" = "心身が落ち着いたのなら、この機会に試験勉強に集中するべきです。#nそれこそが、生徒として正しい在り方ではありませんか！"
"63070-60-ミネ" = "私たち救護騎士団も、それは変わりません。"
"63070-61-ミネ" = "救護と学業の両立！救護騎士団の在り方を示すのです！"
"63070-62-ミネ" = "そうですよね、皆さん！"
"63070-63-ミネ" = "はい、団長！"
"63070-64-ミネ" = "ふふっ、良い返事です。"
"63070-65-ミネ" = "では、スバルさん。そしてアリウスの皆さんも。"
"63070-66-ミネ" = "試験、頑張ってくださいね。"
"63070-67-スバル" = "良い話だったはずが……なぜこんな結論に……。"
"63070-68-スバル" = "勉強かぁ……。"
"63070-69-スバル" = "やっぱりやりたくないなぁ……。"
"63070-70-スバル" = "……正直、私もです。"
"63070-71-マイア" = "私は頑張りたいです！"
"63070-72-スバル" = "やる気があるのは良いことですね……。#n今回は、私がマイアさんから学ぶ番かもしれません……。"
"63070-73-スバル" = "おや？アレは……？"
"63070-74-編入したアリウスの生徒A" = "はい、ここま[ruby=アリウス式近接戦闘射撃術]で。CQBの基[/ruby]礎はこんなところです。"
"63070-75-編入したアリウスの生徒B" = "近接戦闘に持ち込まれないのが一番ですが、現場では何が起きるか分かりませんから。"
"63070-76-トリニティの生徒B" = "す、すごい……。"
"63070-77-トリニティの生徒B" = "かっこいい……！"
"63070-78-編入したアリウスの生徒A" = "えぇ……？こんなに拍手をもらえるなんて……。"
"63070-79-編入したアリウスの生徒B" = "アリウスじゃ、覚えて当然だったのに……。"
"63070-80-トリニティの生徒B" = "あ、あのっ！その……近接？戦闘射撃術？私たちにも教えてもらえませんか？"
"63070-81-編入したアリウスの生徒B" = "えっ？でも皆さんは別に……。"
"63070-82-トリニティの生徒A" = "おっしゃったではありませんか。何があるか分かりませんから！"
"63070-83-トリニティの生徒B" = "私たちにだって、護身術は必須の時代だと思います！"
"63070-84-トリニティの生徒B" = "そう！淑女たるもの――"
"63070-85-トリニティの生徒A" = "自分の身は自分で守って、無礼な相手には礼儀を教えて差し上げませんと！"
"63070-86-トリニティの生徒B" = "はい！その通りです！"
"63070-87-編入したアリウスの生徒B" = "トリニティ、大丈夫なのかな……。"
"63070-88-編入したアリウスの生徒B" = "もしかして、とんでもないものを目覚めさせちゃった……？"
"63070-89-トリニティの生徒B" = "そうです！CQB研究部を創設いたしましょう！"
"63070-90-トリニティの生徒B" = "いいですね！では、部長と副部長は……。"
"63070-91-トリニティの生徒A" = "もちろん、専門家の方々にやってもらうべきですよね！"
"63070-92-トリニティの生徒B" = "異議無しです！よろしくお願いします！"
"63070-93-編入したアリウスの生徒A" = "私たちですか！？でもそんな大役、とても……。"
"63070-94-編入したアリウスの生徒B" = "ひ、ひゃああ……。"
"63070-95-トリニティの生徒B" = "大丈夫ですよ！慣れないことがあったら、何でもお手伝いしますから！"
"63070-96-トリニティの生徒B" = "では皆さん！もう一度拍手をお願いします！"
"63070-97-編入したアリウスの生徒A" = "よ、よろしくお願いします……。"
"63070-98-編入したアリウスの生徒B" = "どうしてこんなことに……。"
"63070-99-マイア" = "あの……先輩？"
"63070-100-スバル" = "はい？どうかしましたか？"
"63070-101-マイア" = "……。"
"63070-102-マイア" = "私たちにも、できるでしょうか……？"
"63070-103-マイア" = "今までとは、色んなことが違うかもしれませんが……。"
"63070-104-マイア" = "新しい巣を、自分たちで作れると思いますか？"
"63070-105-スバル" = "……。"
"63070-106-スバル" = "やってみましょう。"
"63070-107-スバル" = "私は、何がしたかったんでしょうか。"
"63070-108" = "アリウスを、懸命に守ろうとしてたよ。"
"63070-109-スバル" = "こんな結末なら、何もしないほうがよかった……。"
"63070-110" = "そんなことない。"
"63070-111" = "やってみたことに、意味があるんだよ。"
"63070-112" = "たしかに、努力しても変わらないことはある。"
"63070-113" = "失敗するかもしれない。今よりも悪くなるかもしれない。"
"63070-114" = "でも、考えてみて？"
"63070-115" = "今が底辺なら、上がるしかないよね？"
"63070-116-スバル" = "結果が、どうであっても。"
"63070-117" = "次回;ティータイム"
