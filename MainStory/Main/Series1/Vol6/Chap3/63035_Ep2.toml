[translation]
"63035-1" = "第3話;ラッパ吹きの天使"
"63035-2-サオリ" = "くっ……！"
"63035-3" = "[ns] \"サオリ！\""
"63035-4-ヒヨリ" = "サオリ姉さん！"
"63035-5-サオリ" = "問題ない……かすり傷だ。"
"63035-6-ミサキ" = "大丈夫には見えないけど……リーダーがそう言うなら……。"
"63035-7-ミサキ" = "で、本当にどうする？#n「ああいうの」には勝てたためしがないけど……。"
"63035-8-ミサキ" = "しかも、今回のは次元が違う。"
"63035-9-アリウスの生徒C" = "え……？ラッパの音……？#nあっ！前に言ってたのってこれのこと……！？"
"63035-10-アリウスの生徒A" = "そうだよ！#nでも……なんか、空が暗くなってきてない……？"
"63035-11-アリウスの生徒B" = "まだお昼なのに……！？"
"63035-12-アリウスの生徒D" = "何が起きてるの……？"
"63035-13-アリウスの生徒A" = "いきなり夜になっちゃった、ってこと……！？"
"63035-14-アリウスの生徒B" = "これ……私知ってる！経典に書いてあるやつだよ……！"
"63035-15-アリウスの生徒B" = "太陽の三分の一と、月の三分の一と、星の三分の一とが打たれて、これらのものの三分の一は暗くなり――"
"63035-16-アリウスの生徒B" = "昼の三分の一は明るくなくなり、夜も同じようになった。#n……って！"
"63035-17-アリウスの生徒C" = "また……！？"
"63035-18-アリウスの生徒D" = "これで6回目……！"
"63035-19-アリウスの生徒D" = "でも、おかしくない？何でまた鳴ってるの……？"
"63035-20-アリウスの生徒A" = "そうだよね……このままだと7回どころか、14回のラッパになっちゃうよ……？"
"63035-21-ヒヨリ" = "き、急に暗くなりましたね……何が起こってるんですか……？"
"63035-22-サオリ" = "スバル！やめろ！何を考えているんだ！#nお前に……何があったんだ！"
"63035-23-サオリ" = "……こっちの声は聞こえてないっぽいね。"
"63035-24-マイア" = "……。"
"63035-25-マイア" = "せ、先輩……！"
"63035-26-マイア" = "スバル先輩！！！"
"63035-27-スバル" = "……。"
"63035-28-スバル" = "どう、して……？"
"63035-29-スバル" = "今まで……どこに……なぜ、ここに……？"
"63035-30-アツコ" = "この子は、ずっとここにいたよ。"
"63035-31-アツコ" = "この場所に、私たちと一緒に。"
"63035-32-アツコ" = "どうして気づけなかったのかって？それはね……。"
"63035-33-アツコ" = "あなたが、この子を見ようとしなかったから。"
"63035-34-アツコ" = "そうだよね、スバル？"
"63035-35-アツコ" = "ううん……今はもう、「現象」になってしまった。#n「ラッパ吹きの天使」って呼ぶべきかな？"
"63035-36-サオリ" = "アツコ……何か、知っているのか？"
"63035-37-アツコ" = "今まではただの推測だったけど……これで、確信に変わった。"
"63035-38-アツコ" = "ちゃんと、順番に話すね。"
"63035-39-アツコ" = "それと。こうなった以上、はっきり言っておくよ。"
"63035-40-アツコ" = "スバル。#nあなた一人だけが「アリウス」な訳じゃないんだよ。"
"63035-41" = "次回;ロイヤルブラッド"
