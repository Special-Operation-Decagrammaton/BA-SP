[translation]
"62010-1" = "第1話;名もなき奉仕活動部"
"62010-2-ミネ" = "救護が必要な予感を察知しましたので――#n救護騎士団一同、参りました！"
"62010-3-スバル" = "どういう意味ですか！？"
"62010-4" = "[s] \"言葉の通りというか……それが救護というか……。\""
"62010-5-スバル" = "あの……よく分からないのですが……。"
"62010-6-マイア" = "あっ、先輩！この方々は――"
"62010-7" = "[s] \"ちょ、ちょっと待って！\""
"62010-8" = "[ns] \"全員……集合！\""
"62010-9" = "[ns] \"みんな集まったかな……？\""
"62010-10-マイア" = "は、はい……。"
"62010-11-サオリ" = "先生、急にどうしたんだ……？"
"62010-12-ミネ" = "手を引っ張らずとも、言っていただければ参りますので……。"
"62010-13-アツコ" = "それで、どうしたの？#n先生がそんな顔するなんて、よっぽどのことだよね。"
"62010-14-ハナエ" = "何かあったんですか？私が何か応援したら元気出ますか？"
"62010-15" = "[s] \"……マイア。この子たちが誰か知ってる？\""
"62010-16-マイア" = "それは、えっと……。"
"62010-17-マイア" = "救護騎士団……の方々ですよね。"
"62010-18-マイア" = "――トリニティの。"
"62010-19-アツコ" = "こんにちは。第４サンクトゥムの時ぶりだね。"
"62010-20-セリナ" = "あの時は何かとバタバタしていて、ご挨拶もできず……その節はお世話になりました。"
"62010-21" = "すごい格好のシスターもいた気がするけど……今日は来てないんだね。"
"62010-22-ミネ" = "サクラコ様は救護騎士団ではなく、シスターフッドの――"
"62010-23-ミサキ" = "い、今はちょっとお忙しくて！はい！#nえっと……試験前ですし！"
"62010-24-ヒヨリ" = "あ、試験……皆さんもそうなんですね……。"
"62010-25-ヒヨリ" = "……あれ？皆さんは勉強してなくていいんですか？"
"62010-26-セリナ" = "えっと、それは――"
"62010-27-ミネ" = "試験と同等に、救護の手を差し伸べることも重要事項ですので！"
"62010-28-ミネ" = "それに、救護騎士団の皆さんなら救護と試験を両立できると思っております。"
"62010-29-ミネ" = "信じること。#nそれもまた、救護の精神といえましょう。"
"62010-30-ミネ" = "もちろん私自身も常にトップを維持し続けております。"
"62010-31" = "[s] \"すごいね！さすがミネだよ。\""
"62010-32-ミネ" = "そ、それほどでもありません……。"
"62010-33" = "[s1] \"でも、ここではちょっとみんなにお願いがあって……。\"\n[s2] \"トリニティの救護騎士団であることを、伏せておいてほしいんだ。\""
"62010-34-マイア" = "どうしてですか？"
"62010-35-ミネ" = "わざわざ隠す必要があるのでしょうか……？"
"62010-36-セリナ" = "団長、今は先生の言う通りにしましょう。"
"62010-37-ハナエ" = "えっ？でも私たちは「救護」しに来たんですよね……？"
"62010-38-セリナ" = "「救護」のために、隠す必要があるんだと思います。"
"62010-39-ミネ" = "そう……なのですか？"
"62010-40-セリナ" = "えっと、経典にもあるじゃないですか。#n「右手のやることを左手に知らせてはならぬ」って。"
"62010-41-ミネ" = "その教えは理解しておりますが……。#n救護騎士団はシスターフッドのような秘密主義ではありません。"
"62010-42-セリナ" = "ですが、先生にもお考えあってのことでしょうから。#n今は従ったほうが良い気がするんです。"
"62010-43-ミネ" = "……そこまでおっしゃるのであれば、分かりました。#nそのようにいたしましょう。"
"62010-44" = "[s] \"分かってくれて嬉しいよ。セリナも、ありがとね。\""
"62010-45-セリナ" = "お力になれて良かったです。"
"62010-46-ミネ" = "……理解はいたしました。"
"62010-47-ミネ" = "とはいえ、やはりこういう時にこそ救護の精神を広く伝えるべきだと思います。"
"62010-48-ミネ" = "なので、納得しきれない部分は多々ありますが……。"
"62010-49" = "[s] \"無茶なお願いをしてごめんね。\""
"62010-50-ミネ" = "構いません。それが必要なことなのであれば。"
"62010-51-ミネ" = "トリニティや救護騎士団の呼称は使わないようにいたします。"
"62010-52" = "[s] \"みんなも、それでお願いできるかな。\""
"62010-53-マイア" = "わ、分かりました……。"
"62010-54-セリナ" = "あっ、でしたら団長に提案があるのですが……。"
"62010-55-セリナ" = "「団長」と呼ぶと、「救護騎士団」っぽさが出てしまうと思うんです。"
"62010-56-セリナ" = "なので、ここでだけは――「先輩」と呼ぶのはどうでしょうか？"
"62010-57-ミネ" = "それは……。"
"62010-58-ミネ" = "……たしかに、その通りですね。"
"62010-59-ミネ" = "では、そのようにお願いいたします。"
"62010-60-ハナエ" = "はい！ミネ団――ミネ先輩！"
"62010-61-ミネ" = "ミネ……先輩……。"
"62010-62-セリナ" = "ミネ先輩……。"
"62010-63-セリナ" = "少し、馴れ馴れしいでしょうか……#nこ、ここだけにしますので！"
"62010-64-ミネ" = "いえ、大丈夫です。それに――"
"62010-65-ミネ" = "このほうが親しみやすくて……良いかもしれませんね。"
"62010-66-サオリ" = "おおよそ話はまとまったようだな。"
"62010-67-サオリ" = "善意のボランティア団体が、救護の精神を広めるためにアリウス分校を訪れた――"
"62010-68-サオリ" = "この認識で間違いないか？"
"62010-69-セリナ" = "はい、問題ありません。#nですが……。"
"62010-70-セリナ" = "スクワッドの皆さんもアリウスの方なのに……。#n私たちがご一緒して、その……大丈夫ですか……？"
"62010-71-アツコ" = "……うん。気にしないで大丈夫だよ。"
"62010-72-アツコ" = "それに、たしかにアリウス分校の生徒ではあるんだけど……。"
"62010-73-アツコ" = "はぐれ者だからね、今の私たちは。"
"62010-74-ミサキ" = "……はぐれ者で済めばいいけど。"
"62010-75-ハナエ" = "じゃあ……これで全部解決ってことですよね？よかったです！"
"62010-76-アツコ" = "ふふっ、ハナエさん……だっけ。これからよろしくね。"
"62010-77-ハナエ" = "はい！！"
"62010-78-アツコ" = "……。"
"62010-79-アツコ" = "なんだかハナエさんを見てると、こっちまで元気をもらえる気がする……#nねえ、ちょっとの間、うちに来ない？"
"62010-80-セリナ" = "えっ？ええっ！？"
"62010-81-ヒヨリ" = "！！！"
"62010-82-ヒヨリ" = "……そうすると、そちらが寂しくなってしまいますよね。"
"62010-83-ヒヨリ" = "よ、よろしくお願いします。セリナさん、ミネさん……。"
"62010-84-ミネ" = "せ、先生？これも救護……なのでしょうか……？"
"62010-85-アツコ" = "え？私はこれからアリウス生になるんですか？"
"62010-86-アツコ" = "ふふっ、冗談だよ。#nハナエちゃん、まっすぐで明るいから、つい……。"
"62010-87-セリナ" = "たしかに、ハナエちゃんは「元気いっぱいのアサガオ」って感じがしますもんね。#nでも、救護騎士団のなくてはならない存在なので、ごめんなさい。"
"62010-88-ヒヨリ" = "えへへ……私は冗談だと分かってましたよ……！"
"62010-89-マイア" = "うぅ……。"
"62010-90" = "[s] \"……大丈夫？\""
"62010-91-マイア" = "な、なんだかエネルギッシュな方々ですね……。"
"62010-92" = "[s] \"慣れてないと大変だよね……。\""
"62010-93" = "[ns] \"それで、これから何をするつもりなの？\""
"62010-94-ミネ" = "良い質問ですね。"
"62010-95-ミネ" = "活動のためには、まずは拠点が必要です。"
"62010-96-ミネ" = "救護騎――いえ、[ruby=・]名[/ruby][ruby=・]も[/ruby][ruby=・]な[/ruby][ruby=・]き[/ruby][ruby=・]奉[/ruby][ruby=・]仕[/ruby][ruby=・]活[/ruby][ruby=・]動[/ruby][ruby=・]部[/ruby]は、救護所の設営から始めたいと思います！"
"62010-97" = "臨時救護所"
"62010-98-ハナエ" = "完成です！"
"62010-99-セリナ" = "先生もミネ先輩も、お疲れ様でした。"
"62010-100-ミネ" = "先輩……。"
"62010-101-ハナエ" = "え？良い手際だった……？#nもちろんです。慣れてますから！"
"62010-102-？？？" = "お疲れ様です、先生。そして……。"
"62010-103-スバル" = "……。"
"62010-104-スバル" = "「ボランティア」の皆さん。"
"62010-105-セリナ" = "こんにちは。あなたは、さっきの……。"
"62010-106-スバル" = "名乗るほどの者ではありませんよ。#nそれより、あなた方は何をしにアリウスまで？"
"62010-107-セリナ" = "す、すみません……。#n私たち、そういうのはちょっと……よく分かってなくて……。"
"62010-108-ミネ" = "え……？"
"62010-109-ミネ" = "……？"
"62010-110" = "（何か言いかけた2人を、かろうじて止めた）"
"62010-111-スバル" = "――つまり「救護が必要な予感」とやらを頼りに、ここまでいらした、と。"
"62010-112-セリナ" = "そ、それは……！"
"62010-113-ミネ" = "……。"
"62010-114-ミネ" = "何か、問題でもありましたでしょうか？"
"62010-115-セリナ" = "団ち――先輩……！？"
"62010-116-スバル" = "いえ、問題というほどでは。#nただ……とても勇敢だな、と思いまして。"
"62010-117-スバル" = "どんな危険があるかも、何が起こるかも分からない場所に――"
"62010-118-スバル" = "ただ「可哀想に見えるから」と無鉄砲に入り込んでいるのですから。"
"62010-119-ミネ" = "何をおっしゃるかと思えば……そうですね、そうも見えるでしょう。#nですが、事情はもっと単純です。"
"62010-120-スバル" = "はい？"
"62010-121-ミネ" = "私達の行動はすべて「救護」のために行っているのですから。"
"62010-122-スバル" = "救護……？"
"62010-123-ミネ" = "救護の足りぬ場に救護を。#n満たすだけでなく、溢れ返るほどに注ぎ込み――"
"62010-124-ミネ" = "一人でも多く、悲しみと苦しみから救い出すこと。"
"62010-125-ミネ" = "それこそが救護活動――私達のボランティアの理念です。"
"62010-126-ミネ" = "そこに、危険であるかどうか、私達がどのように映るかなど関係ありません。"
"62010-127-セリナ" = "あ、あはは……。"
"62010-128-ハナエ" = "さすが先輩です……！"
"62010-129-スバル" = "……。"
"62010-130-スバル" = "なるほど、噂に違わぬ方々ですね。"
"62010-131-セリナ" = "（噂……？）"
"62010-132-スバル" = "トリニティの――救護騎士団の皆さん。"
"62010-133" = "[s] \"！？\""
"62010-134-ハナエ" = "は、はいっ！？あっ、いやっ、私たちは、その、あの……！"
"62010-135-スバル" = "無理して取り繕わなくていいですよ。"
"62010-136-スバル" = "……気づかないとでも思っているんですかね。#nトリニティの気配を。"
"62010-137-スバル" = "……。"
"62010-138-スバル" = "お互い、回りくどい話はやめにしましょう。#n長々と議論したところで、疲れるだけですから。"
"62010-139-スバル" = "結論から申し上げますと、身分を伏せてボランティア活動に徹すると言うならば、事を構えるつもりはありません。"
"62010-140-スバル" = "ただし――"
"62010-141-スバル" = "あなた方が「ティーパーティー」や「シスターフッド」の回し者でなければ……#nですが。"
"62010-142-スバル" = "……まぁ、トリニティの中でも特異な組織であるとは聞いていますので。"
"62010-143-セリナ" = "よく……ご存知なんですね。"
"62010-144-スバル" = "おかしな話ではないと思いますよ。"
"62010-145-スバル" = "元を辿れば……私たちは一つの学園だったじゃないですか。"
"62010-146-セリナ" = "……！"
"62010-147-スバル" = "ともあれ、秘密は秘密のままに。#nそれであれば、とやかくは言いません。"
"62010-148-スバル" = "お約束いただけますか？"
"62010-149-ミネ" = "……分かりました。その条件であれば。"
"62010-150-スバル" = "ありがとうございます。"
"62010-151-スバル" = "……それにしても、あなた方の団長さんはいらしていないようですね。"
"62010-152-スバル" = "まぁ、大所帯を束ねている以上、すべての活動に顔を出す訳にもいかないのでしょう。"
"62010-153-ミネ" = "！？"
"62010-154-ハナエ" = "えっ？あ、それは……。"
"62010-155-セリナ" = "そ、そうです！団長はお忙しいので！#nそれで今回の件を、私たちに任せてくださったんです！あはははは……！"
"62010-156-ミネ" = "そ、そうです、ね。#nそう、ということに……いえ、そうなのですよ。"
"62010-157-スバル" = "何か事情があるようですが……これはこれで良かったのではないでしょうか。"
"62010-158-スバル" = "自分が正しいと思ったら、遮るものを全て跳ねのけてでも突き進むような方だ、と聞いていますし。"
"62010-159-スバル" = "この場に居合わせていたかもしれない……そう考えるだけで恐ろしいです。"
"62010-160-ミネ" = "……少し、誤解があるようですね。"
"62010-161-ミネ" = "救護騎士団の……団長、様は、救護の精神を広めるためならば、他の全てを犠牲にできる方です……！"
"62010-162-スバル" = "それはつまり……石のように頑固で融通が利かない、ということでは？"
"62010-163-ミネ" = "言葉選びは慎重になさることをお勧めします。#n確固たる意志を、まるでただの重しかのように言うのは――"
"62010-164-ミネ" = "この場にいない方に対して、礼を欠いた行為かと。"
"62010-165-スバル" = "救護騎士団の皆さんは互いへの信頼が厚いそうですが……#nええ、よく伝わってきます。"
"62010-166-スバル" = "分かりました。この話はここまでにしておきましょう。"
"62010-167-スバル" = "これ以上私がここにいたら、皆さんの「ボランティア」の邪魔になりそうですし。#nそろそろ失礼します。"
"62010-168-スバル" = "ああ、何か助けが必要なときは……#nそうですね、気軽にお声がけください。"
"62010-169-ハナエ" = "み、ミネ先輩……。"
"62010-170-ハナエ" = "ミネ先輩……。"
"62010-171-ミネ" = "……。"
"62010-172-ミネ" = "セリナ、ハナエ。私は大丈夫です。救護活動に尽力できるのですから。#nこういう時こそ、初心を疎かにせず活動に徹するべきです。"
"62010-173-ハナエ" = "は、はい……！"
"62010-174-ミネ" = "ですが……その前に少しだけ。#n申し訳ありませんが、休憩をいただいてもよろしいでしょうか……？"
"62010-175-ハナエ" = "もちろんです！こちらのことは心配しないでください！#n……ハナエちゃん、ちょっと手伝ってくれる？"
"62010-176-ハナエ" = "はい！任せてください！"
"62010-177-ミネ" = "……。"
"62010-178" = "[s] \"大丈夫……？\""
"62010-179-ミネ" = "もちろんです。私は……。"
"62010-180-ミネ" = "……。"
"62010-181-ミネ" = "いえ……先生に隠し事をしても、きっと意味はありませんね。"
"62010-182-ミネ" = "……終わりが見えない。けれど[ruby=かろ]辛[/ruby]うじて抑え込まれている怒り。#nそれを前にして……果たして、私に何ができるのでしょうか。"
"62010-183" = "[s] \"……そんな風に感じたんだね？\""
"62010-184-ミネ" = "……はい。"
"62010-185-ミネ" = "――これも救護である。"
"62010-186-ミネ" = "私はそう考えています。"
"62010-187-ミネ" = "……あの方々の憎しみを受け止めることも、その一つです。"
"62010-188-ミネ" = "ですが、その感情が留まり続ける限り、何も変わりません。"
"62010-189-ミネ" = "……一方的な救護は、やがて意味を失ってしまいます。"
"62010-190-ミネ" = "これは持論ですが……ある程度[ruby=・]説[/ruby][ruby=・]得[/ruby][ruby=・]さ[/ruby][ruby=・]れ[/ruby][ruby=・]る[/ruby][ruby=・]準[/ruby][ruby=・]備[/ruby][ruby=・]が[/ruby][ruby=・]で[/ruby][ruby=・]き[/ruby][ruby=・]て[/ruby][ruby=・]い[/ruby][ruby=・]る[/ruby]相手でなければ、説得することはできません。"
"62010-191-ミネ" = "誰かに止めてほしいと願いながら、けれど限界まで突き進んでしまう。#n……そんな方もいますから。"
"62010-192-ミネ" = "……？#n……先生？……大丈夫ですか？顔色が……。"
"62010-193" = "[s3] \"あ、うん……あの時、私はしっかりできなかったから……。\"\n[s4] \"ちゃんと最後まで気を配ってあげるべきだったのに。\""
"62010-194-ミネ" = "……そんなことはありません。"
"62010-195-ミネ" = "先生は最善を尽くされました。それは私が保証します。"
"62010-196-ミネ" = "ですが……今、私には何ができるのか、分からなくなってしまい……。"
"62010-197-ミネ" = "私は、救護騎士団である以前に、トリニティの生徒です。#nアリウスのことを「理解できる」とは到底――"
"62010-198-ミネ" = "それを口にすれば、アリウスの皆さんの怒りを買うでしょう。"
"62010-199-ミネ" = "「理解」という言葉を口にすること自体、傲慢なのかもしれません。"
"62010-200-ミネ" = "……それでも信じたいのです。#n私たちは、互いに理解し合うことができるのだと。"
"62010-201-ミネ" = "そう信じて行動すれば……明日は、きっと今日より良い日になります。#nたとえ、それがほんの少しずつの変化で、僅かな可能性だったとしても。"
"62010-202-ミネ" = "それでも、私は……。"
"62010-203" = "[s] \"ミネがそんな顔をしているの、初めて見た。\""
"62010-204-ミネ" = "ふふっ、そうですか？"
"62010-205-ミネ" = "それをいうのなら……先生もどこか、普段と違う気がします。"
"62010-206-ミネ" = "……一つ、お尋ねしてもいいですか？"
"62010-207-ミネ" = "全てに絶望しきった時……それでも自分を支えてくれるもの。#nそれは……何なのでしょうか。"
"62010-208" = "[s] \"……。\""
"62010-209-スバル" = "先生、あの……。"
"62010-210-スバル" = "もし仮に、誰かが……。"
"62010-211-スバル" = "本当に、本当に、本当に……#n自分の人生を諦めたいと願っていたら。"
"62010-212-スバル" = "その人を止める術はあるのでしょうか……。"
"62010-213" = "[ns] \"その人が信じているもの……かな。\""
"62010-214-ミネ" = "信じているもの、ですか？"
"62010-215-ミネ" = "ふふ……ちょっと意外でした。#n先生でしたら……そうですね。"
"62010-216-ミネ" = "もっと「理性的」なものを挙げられるかと思っていました。"
"62010-217" = "[s5] \"人を突き動かすのは、感情であり、信念だからね。\"\n[s6] \"理屈で割り切れるとは限らないんだよ。\""
"62010-218" = "[ns7] \"それが、偉大な存在への信仰でも。\"\n[ns8] \"……自身の内側にある何かへの信頼だとしても。\""
"62010-219-ミネ" = "……なるほど。"
"62010-220-ミネ" = "感情とは……人を縛る鎖ではなく、行動のトリガーとなり得るものである、と。"
"62010-221-ミネ" = "たしかに感情は判断に影響を与えやすいです。#n先生はそれを、深層意識に紐づいているものだからとお考えなのですね。"
"62010-222-ミネ" = "……そうですね。それこそ「授業」なのかもしれません。"
"62010-223-ミネ" = "……。"
"62010-224" = "[s9] \"だからこそ、これまで歩んできた道が――\"\n[s10] \"間違っていなかったのだと思えるなら。\""
"62010-225-ミネ" = "……その道を信じて進めばいい、ということですか？"
"62010-226-ミネ" = "ですが、その道が本当に正しいかどうかは……誰にも分からないのでは？"
"62010-227" = "[s11] \"それは、自分で証明していくしかないんだ。\"\n[s12] \"……私も、多少なりそうしてきたつもりだよ。\""
"62010-228-ミネ" = "先生が……何の証明を……？"
"62010-229" = "[s13] \"助けを求める生徒の声に背を向けたら――\"\n[s14] \"教師を名乗る資格はないってこと。\""
"62010-230-ミネ" = "……！"
"62010-231-ミネ" = "ふふっ……先生はそういう方でしたね。"
"62010-232-ミネ" = "そんな先生に、救われた生徒はたくさんいます。"
"62010-233-ミネ" = "本当に……ありがとうございます。"
"62010-234" = "（ミネが、静かにもたれかかってきた……）"
"62010-235-ミネ" = "すみません……少しだけ。"
"62010-236-ミネ" = "長くお時間はとらせませんので……。"
"62010-237-ミネ" = "……しばらくの間、こうさせてください。"
"62010-238" = "（目を閉じたミネは、穏やかな表情をしていた）"
"62010-239" = "（時が止まったように感じたその瞬間――）"
"62010-240-ミネ" = "今の音は……？#n先生にも聞こえましたか？"
"62010-241" = "[s] \"うん。何の音だろう……？\""
"62010-242-ハナエ" = "い、今のって、ラッパ……でしょうか？#nすごい音でしたね！"
"62010-243-ミネ" = "アリウス側の……何かの「合図」なのでしょうか？"
"62010-244-ハナエ" = "分かりません。でも――"
"62010-245-ハナエ" = "ちょっとだけ、嫌な感じがします……。"
"62010-246-セリナ" = "先輩、どうしますか……？"
"62010-247-ミネ" = "……。"
"62010-248-ミネ" = "それでも。"
"62010-249-ミネ" = "私たちは、やるべきことをやりましょう。"
"62010-250" = "次回;ラッパの音"
