[translation]
"62080-1" = "第8話;ポルタパシス（２）"
"62080-2-ウイ" = "秘儀……？"
"62080-3-ウイ" = "あまり良いものではなさそうですね。"
"62080-4-ウイ" = "委員長！"
"62080-5-ウイ" = "う、うぅ……。"
"62080-6-サオリ" = "たしかに、私も聞いたことがない。"
"62080-7-アツコ" = "これはたぶん、私しか知らないことだと思うから。"
"62080-8-アツコ" = "私も最初は、怪談とか伝説の類だと思ってたんだけど……。"
"62080-9-アツコ" = "「エデン条約」が結ばれる少し前。#nベアトリーチェは、ポルタパシスの記録保管庫に行ってたの。"
"62080-10-アツコ" = "私以外の誰にも、何も言わずに、こっそりと。"
"62080-11-ヒヨリ" = "！"
"62080-12-ヒヨリ" = "ええぇっ！？"
"62080-13-マイア" = "で、でも、あそこって……入っちゃいけないはずじゃ……。"
"62080-14-アツコ" = "ベアトリーチェが、そんなこと気にすると思う？"
"62080-15-マイア" = "そ、それは……そうかもしれないですけど……。"
"62080-16-アツコ" = "ベアトリーチェには多くの秘密があった。その一つがそれ。"
"62080-17-アツコ" = "まさか……ユスティナ聖徒会の[ruby=ミメシス]複製[/ruby]が顕現したのも？"
"62080-18-アツコ" = "どうだろう。もう、その真実を知る方法はほとんどないけど……。"
"62080-19-サオリ" = "まったく無関係だったとは思えないかな。"
"62080-20-アツコ" = "だって、アリウスで異常現象が増え始めたのは、その頃からだから。"
"62080-21-マイア" = "覚えています……。いつの間にか、見たことのないものがいっぱい転がってて……武器だけなら潤沢に支給されていたりして……。"
"62080-22-マイア" = "あの頃は……やっぱり大人ってすごいなって、思うだけで……疑問にも思わなかったですけど……。"
"62080-23" = "[s] \"……。\""
"62080-24-アツコ" = "ここで大事なのは「増え始めた」って部分なの。"
"62080-25-アツコ" = "えっ……？まさか……？"
"62080-26-アツコ" = "そのまさかだよ。"
"62080-27-ウイ" = "元々、アリウスでは変なことが起こっていたんだ。#nあまり頻度は高くないんだけどね。"
"62080-28-ミサキ" = "どの学園にも怪談のひとつやふたつはあるものだが……#nアリウスはそのレベルを遥かに超えていた。"
"62080-29-ミサキ" = "アリウスを出てから分かったよ。あれは「ちょっと」とかそういう次元じゃなかったって。"
"62080-30" = "[ns] \"それは……どうして？\""
"62080-31-アツコ" = "正確な理由は、私もよく分からない。"
"62080-32-アツコ" = "だけど……。"
"62080-33-アツコ" = "アリウスは、そういう「場所」になっちゃってた気がするんだ。"
"62080-34-アツコ" = "ここには、もともと「何か」があった。"
"62080-35-アツコ" = "怒り、嘆き、恨み、絶望、諦念……そういう思念が積もり積もって、ここに集まってる。"
"62080-36-アツコ" = "強い想いって、何かの形で現れるって言うでしょ？"
"62080-37-ヒヨリ" = "そ、それって……ただの例え話、なんじゃ……。"
"62080-38-アツコ" = "でも、私たちはもう見てるはずだよ。ユスティナ聖徒会とか、バルバラとか。"
"62080-39-ヒヨリ" = "すべてマダム……ベアトリーチェの仕業だと思っていたが……。"
"62080-40-サオリ" = "いや、そう考えることで、アリウスの「裏の真実」から無意識に目を逸らしていたのかもしれないな……。"
"62080-41-ヒヨリ" = "そこまで決めつけたくはないけど……でも、時々怖くなる。"
"62080-42-ヒヨリ" = "積もり積もった強い想いの奥底には、何があるんだろうって。"
"62080-43-アツコ" = "想像するだけで……怖い。"
"62080-44-ミサキ" = "……。"
"62080-45-マイア" = "ううう……。"
"62080-46-シミコ" = "こほん。#n……では、黙示録の話をしましょう。"
"62080-47-シミコ" = "どうやら、アリウスで起きている「現象」の核心に関わるようですから。"
"62080-48-アツコ" = "うん、ありがとう……シミコさん。"
"62080-49-シミコ" = "いえ、お気になさらずアツコさん。#nそれでは、まずは概要から。"
"62080-50-シミコ" = "黙示録とは、トリニティとアリウスの両校に伝わる経典の最終章を指します。"
"62080-51-シミコ" = "二つの学園が持つ経典は、もとは同一のものでした。その解釈が異なるだけで、ルーツは同じなんです。"
"62080-52-ウイ" = "トリニティにおいて黙示録は、あくまで参考文献のような扱いをされています。"
"62080-53-ウイ" = "教訓や助言を集めた[ruby=しんげんしゅう]箴言集[/ruby]として……それ以上の重みは、ほとんどありません。"
"62080-54-サオリ" = "だがアリウスでは、黙示録の研究が特に重視されていた。"
"62080-55-サオリ" = "なにしろ……「世界の滅亡」について記されているからな。"
"62080-56" = "[s] \"つまり、それって……！\""
"62080-57-ミサキ" = "アリウスは世界の滅亡を望んでいたのか、って？"
"62080-58-ミサキ" = "……。"
"62080-59-ミサキ" = "その通りだよ。"
"62080-60-ミサキ" = "み、みみみみみ、ミサキさんっ！？"
"62080-61-ミサキ" = "驚くことじゃないでしょ。事実だし。"
"62080-62-ウイ" = "……理解はできる気がします。"
"62080-63-ウイ" = "温もりを得られなかった子どもが、温もりを得るために村を燃やす――そんな話があるくらいですから。"
"62080-64-ウイ" = "失うものがない人にとって……世界の終わりは「救済」なのかもしれません。"
"62080-65-ウイ" = "少なくとも、全てが「公平」になったような気がするのでしょう。"
"62080-66-アツコ" = "自分が消えることと、世界が終わること。どっちも、[ruby=・]自[/ruby][ruby=・]分[/ruby][ruby=・]に[/ruby][ruby=・]と[/ruby][ruby=・]っ[/ruby][ruby=・]て[/ruby][ruby=・]の[/ruby]結果としては同じだもんね。"
"62080-67-アツコ" = "……だったら、どこかの時点で、その前後が入れ替わっちゃうのも、不思議じゃないと思うな。"
"62080-68-シミコ" = "手段と目的を取り違えてしまうことはよくありますから……。"
"62080-69-シミコ" = "……。"
"62080-70-シミコ" = "……。"
"62080-71-シミコ" = "黙示録には、7人の天使が3組登場します。それを総称して、「黙示録の天使」と呼ぶんです。"
"62080-72-ミサキ" = "まさか……実在する、というのか？"
"62080-73-サオリ" = "恐怖や苦痛を煽るような……あくまで、物語に過ぎないと思っていたが……。"
"62080-74-ミサキ" = "さっきの話だけど……強い想いは、いつか形を成すってやつ？"
"62080-75-アツコ" = "黙示録に記されている、世界の終わりを告げる天使。"
"62080-76-アツコ" = "最初は「封印を解く天使」の七人。次が「ラッパを吹く天使」の七人。そして最後が「鉢を注ぐ天使」の七人。"
"62080-77-アツコ" = "その中でも、今回は「ラッパを吹く天使」なんだと思う。"
"62080-78-アツコ" = "確認されているラッパの音は、4回。"
"62080-79-アツコ" = "それは空から聞こえてきた声とも一致する。"
"62080-80-アツコ" = "「なお三人の御使がラッパを吹き鳴らそうとしている」って言葉とね。"
"62080-81" = "[s] \"7人全員がラッパを吹いたら……どうなるの？\""
"62080-82-アツコ" = "ふふっ、どうなるんだろうね。"
"62080-83-アツコ" = "黙示録の内容が、そのまま現実になったとしたら……。"
"62080-84-アツコ" = "次は、「激しい怒りが盛られた7つの金の鉢を持つ天使」たちの番になる。"
"62080-85-ミサキ" = "それが終わったら、今の世界は滅んで……信仰ある者のために、新しい世界が訪れる。"
"62080-86-ミサキ" = "……って、私たちは教わった。"
"62080-87-アツコ" = "……うん。黙示録の通りなら、そうなるね。"
"62080-88-アツコ" = "でも……あれは本当に「ラッパを吹く天使」だったのかな？"
"62080-89-サオリ" = "……他の「何か」かもしれないということか？"
"62080-90-アツコ" = "うーん……今はまだ、何とも言えない。"
"62080-91-アツコ" = "そもそもアリウスは、何かがあって、何かが起こる場所だから。"
"62080-92-アリウスの生徒A" = "ほ、本当に来ちゃった……。"
"62080-93-アリウスの生徒B" = "うわ……うわあああ……。"
"62080-94-スバル" = "皆さん、静かにしてください。ただの建物です。不安がる必要はありません。"
"62080-95-アリウスの生徒D" = "は、はい……！"
"62080-96-スバル" = "確認します。私たちの目的地は、ここ――ポルタパシスの地下にあるとされる記録保管庫。"
"62080-97-スバル" = "そこには、アリウスの「真実」が眠っているそうです。"
"62080-98-スバル" = "だとすれば、「ラッパ吹きの天使」についても、何か手がかりを得られるかもしれません。"
"62080-99-スバル" = "問題は、ここが100年以上も封鎖されているということですが……。"
"62080-100-アリウスの生徒C" = "せ、先輩？#n扉……開いてますけど……？"
"62080-101-スバル" = "……本当ですか？#nまさか、誰かがすでに……？"
"62080-102-スバル" = "……ふむ、むしろ好都合です。"
"62080-103-スバル" = "閉ざされた扉を開く者は、何かを失うことになる――"
"62080-104-スバル" = "誰かが開いてくれたのなら、これで懸念が一つ減りましたね。"
"62080-105-アリウスの生徒B" = "それじゃあ、私たち、本当に……。"
"62080-106-アリウスの生徒A" = "この下に……降りるんですか……？"
"62080-107-スバル" = "……。"
"62080-108-スバル" = "いえ、進むのは私一人です。"
"62080-109-スバル" = "……恐ろしいことが起きるかもしれませんから。"
"62080-110-アリウスの生徒D" = "……！"
"62080-111-アリウスの生徒C" = "わ、分かりました……！"
"62080-112-アリウスの生徒D" = "では、私たちは何をすれば……？"
"62080-113-スバル" = "ここに陣地を築いてください。"
"62080-114-アリウスの生徒B" = "陣地……ですか？"
"62080-115-スバル" = "はい。作り方は分かりますよね？"
"62080-116-スバル" = "ああでも、外部からの攻撃に加えて――"
"62080-117-スバル" = "内部からの攻撃にも対応できる形でお願いします。"
"62080-118-アリウスの生徒A" = "そ、それって……！"
"62080-119-アリウスの生徒B" = "先輩に何かあった時のために……？"
"62080-120-スバル" = "……二度言わせないでください。"
"62080-121-アリウスの生徒D" = "！！！"
"62080-122-アリウスの生徒D" = "わ、分かりました！"
"62080-123" = "[ns] \"ラッパの聞こえ方に……違いがあった？\""
"62080-124-マイア" = "はい。ラッパが聞こえた子と……。"
"62080-125-マイア" = "……。"
"62080-126-マイア" = "聞こえなかった子がいました。"
"62080-127-サオリ" = "理由は分かるのか？"
"62080-128-マイア" = "い、いえ……そこまでは……。#nあっ、わ、私は……聞こえた側で……。"
"62080-129-マイア" = "……。"
"62080-130-マイア" = "スバル先輩は、たぶん……聞こえてなかったと思います……。"
"62080-131-マイア" = "……うぅっ。"
"62080-132-マイア" = "急に泣かないでよ……。"
"62080-133-マイア" = "す、すみません……でも……。"
"62080-134-マイア" = "やっぱり、昨日……何かあったんだね。"
"62080-135-マイア" = "！？"
"62080-136-アツコ" = "あっ、ごめんね。びっくりさせるつもりはなかったの。"
"62080-137-ミサキ" = "でも……よかったら教えてほしいな。"
"62080-138-アツコ" = "どうしてあなただけが先生のところに来て、他の子たちは何も言わずに姿を消してしまったのか――"
"62080-139-マイア" = "どうして、あの子たちがポルタパシスに向かったって分かったのか。"
"62080-140" = "[s] \"アツコ、それは……。\""
"62080-141-アツコ" = "うん？"
"62080-142-アツコ" = "……。"
"62080-143-アツコ" = "そっか。先生は待つつもりなんだね。"
"62080-144" = "（マイアはしゃがみ込んでしまった。その体は……小さく震えていた）"
"62080-145" = "（誰も、言葉をかけられずにいたが……）"
"62080-146-ヒヨリ" = "あ、あの……先生には……#n話しても、きっと大丈夫だと思うんです……。"
"62080-147-ヒヨリ" = "ヒヨリ……？"
"62080-148-ヒヨリ" = "しーっ。"
"62080-149-ヒヨリ" = "す、すみません……。私、話すのがその……あんまり得意じゃなくて……え、えへへ……。"
"62080-150-ヒヨリ" = "でも、えっと……すっごく辛いこととか……苦しいことがあったときって……。"
"62080-151-ヒヨリ" = "誰でもいいから……思ってることを話しちゃうんです。#nそ、そしたら……少し、楽になります……。"
"62080-152-ヒヨリ" = "誰でも……？"
"62080-153-ヒヨリ" = "誰でもです。だ、だけど……こういう時は、先生がおすすめですよ！#n……あっ、邪魔なら、私たちはあっちに行ってるので……！"
"62080-154-ウイ" = "……こちらも、しばらく通話を切りましょうか。"
"62080-155-シミコ" = "そうですね。"
"62080-156-ヒヨリ" = "だ、大丈夫です！先生は……信頼できる人です。#n少なくとも、私にとっては……。"
"62080-157-ヒヨリ" = "何を話しても、ちゃんと聞いてくれて……全力で助けてくれるんです。#n胃薬をくれたし、雑誌も買ってくれたし……。"
"62080-158-マイア" = "で、でも！先生は……全部[ruby=・・・・・・]やってくれる[/ruby]訳じゃなくて……。#n自分でできることは……自分で頑張らないといけないんですけど……。"
"62080-159-ヒヨリ" = "ちょっと、それは残念だなぁ……って思ったりするんですけどね。"
"62080-160-ヒヨリ" = "でも……そうすることで、生徒が自立できるようになるって……先生が言うので……。"
"62080-161-ヒヨリ" = "うぅ……うまく言えないんですけど……。#nとっ、とにかく！こういうのって……。"
"62080-162-ヒヨリ" = "一人で抱えて悩んでも……辛いことがどんどん増えてくだけなんです……。"
"62080-163-ヒヨリ" = "アリウスの子は、誰かに頼ったり、話したりするのが苦手ですから……。#n私もそうでしたし……今も、ちょっと……。"
"62080-164-ヒヨリ" = "そ、それで、少しでも助けになればと思って……！え、えへへ……。"
"62080-165-マイア" = "ヒヨリさん……。"
"62080-166-ヒヨリ" = "じゃ、じゃあ、私たちはあっちに行ってるので……。人に聞かれたくない話って、いっぱいありますし……。"
"62080-167-ミサキ" = "ついでに、外の様子を見てこようか。"
"62080-168-サオリ" = "ああ、そうしよう。それじゃ――"
"62080-169-マイア" = "ちょ、ちょっと待ってください……！"
"62080-170-ミサキ" = "え？"
"62080-171-ミサキ" = "は、はい？"
"62080-172-マイア" = "……。"
"62080-173-マイア" = "皆さんにも……お話したいです……。"
"62080-174-シミコ" = "そ、そこまで無理しなくても……。"
"62080-175-シミコ" = "やっとの思いで出した勇気ですし、聞いてあげましょうよ。"
"62080-176-ウイ" = "わ、私なら絶対しないですけどね……。"
"62080-177" = "[ns] \"……大丈夫？\""
"62080-178-マイア" = "……はい。"
"62080-179-マイア" = "たくさんの人の意見を聞けた方が……私も、どうすればいいのか……ちゃんと決められると思うので……！"
"62080-180" = "（マイアは、ゆっくりと昨晩の出来事を語りはじめた）"
"62080-181" = "（みんな、固唾をのんで聞いていた……）"
"62080-182-サオリ" = "……。"
"62080-183-ミサキ" = "……。"
"62080-184-ウイ" = "……。"
"62080-185-ヒヨリ" = "うっ、うぅっ……うわああああん！！！"
"62080-186-ヒヨリ" = "ヒヨリ！？そんなに泣いちゃったら……！"
"62080-187-ヒヨリ" = "でもでも！こんなのあんまりですっ！悲しすぎますよおおおっ！#nこんなの聞いて、平気でいられる訳ないじゃないですか！うわあああああああん！！"
"62080-188-マイア" = "ひ、ひひひひ、ヒヨリさん！？く、苦しい……です……。"
"62080-189-ヒヨリ" = "うわあああん！"
"62080-190-マイア" = "わ、私、なんとか、泣かずに、いたのに……。"
"62080-191-ヒヨリ" = "だからこそなんですよぉぉぉぉぉぉ〜〜〜〜〜〜っ！！！"
"62080-192-アツコ" = "ヒヨリって、やっぱり優しいよね。"
"62080-193-サオリ" = "ああ……いつもそうだった。#n……ミサキ？"
"62080-194-ミサキ" = "なっ、なんでもないから。こっち見ないで。"
"62080-195-アツコ" = "ふふっ。いいんだよ、我慢しなくても。"
"62080-196-サオリ" = "泣いてないってば！！"
"62080-197" = "[ns] \"話してくれて、ありがとう。\""
"62080-198-マイア" = "えっ、いや……こっちこそ……聞いてくださって……ありがとうございます……。"
"62080-199-マイア" = "でも、こうして話してみて改めて思うんです。ラッパの音……どうして私は聞こえたんでしょうか……。"
"62080-200-マイア" = "……ラッパが聞こえている方には、何らかの共通項があるはずです。"
"62080-201-ウイ" = "得られた情報からの推論にすぎませんが……。"
"62080-202-マイア" = "その共通項って……。"
"62080-203-ウイ" = "――おそらくは、先生の授業です。"
"62080-204-マイア" = "えっ？でも、授業ならみんな一緒に……。"
"62080-205-ウイ" = "授業を受けただけで、すべてを理解できるとは限りませんからね……。#n本を読んでも、斜め読みでは理解できないのと同じです。"
"62080-206-マイア" = "いるんですよ……斜め読みしかしてないのに、さも理解したかのように語りだす人や――"
"62080-207-ウイ" = "本をインテリアにしか思ってない人……！"
"62080-208-ウイ" = "そもそも本は、著者と読者が対話するための媒体なんですよ！#nそれを適当に読んで！通じ合えるわけないじゃないですか！"
"62080-209-ウイ" = "もっとこう！この子たちに敬意を払うべきで――"
"62080-210-シミコ" = "委員長、話が脱線しています。"
"62080-211-ウイ" = "えっ！？あ……うぅ……。"
"62080-212-ウイ" = "し、失礼しました……。とにかく……読書と同じで、授業もまたそういうものなんです。"
"62080-213-ウイ" = "勉強とは、自分の知識外のものを、中に取り入れる行為ですから……。"
"62080-214-ウイ" = "勉強を補助するために、先生が導いてくれる時間というのが授業なんです。"
"62080-215-ウイ" = "だから、どれだけ授業を受けたとしても……。"
"62080-216-ウイ" = "聞き流したり、終わった後に忘れたりするようなら……#nそれは授業を受けたとは言えません。"
"62080-217-マイア" = "あ……！"
"62080-218-ウイ" = "なので、ラッパの音を聞いた生徒。つまり黙示録の言葉を借りるなら、「世界の終わりの兆し」を感じ取った生徒は――"
"62080-219-ウイ" = "「アリウスの外の知識」を、抵抗なく受け入れられた生徒だったのではないか、と考えています。"
"62080-220-ウイ" = "言い換えると、「新しい考え方」に対して拒否反応が少なかった生徒です。"
"62080-221-ウイ" = "もちろん、これはあくまで仮説です。#nそして、これを証明できるのは……あなたしかいません。"
"62080-222-ウイ" = "い、いかがでしょうか？"
"62080-223-マイア" = "そうです！たしかにそうかもしれません！#nすごいです、ウイさん！"
"62080-224-ウイ" = "い、いえ……か、勝手に推測しただけなので……。"
"62080-225-ウイ" = "称賛は、素直に受け取ったほうがいいって、いつも言っていますよね？"
"62080-226-ウイ" = "う、あ、うぅ……。"
"62080-227-ウイ" = "そ、それに……「アリウスの外」を受け入れ始めたのだとしたら……。"
"62080-228-シミコ" = "きっと、「今のアリウス」に疑問を持ち始めてもいるはず……。"
"62080-229-ウイ" = "……知識は、人を変える力を持ってますから。"
"62080-230-シミコ" = "それは、つまり……。"
"62080-231-シミコ" = "はい。"
"62080-232-シミコ" = "他の子も、遅かれ早かれ……。"
"62080-233-シミコ" = "アリウスを変えたくないと考える生徒から――#n「敵」と見なされる可能性がある、ということです。"
"62080-234-ミサキ" = "まさかと思うけど、ラッパ吹きの天使って……。"
"62080-235-ウイ" = "それは分かりません。#nもしかしたら本当に……黙示録に出てくる天使そのもの、なのかもしれませんし。"
"62080-236-ウイ" = "ですが、別の解釈もできると思いませんか？"
"62080-237-ウイ" = "「外の世界」に対するアリウスの敵意、不安、怒り……そういったものが集まって――"
"62080-238-ウイ" = "一つの「現象」として現れた……そんな可能性も……。"
"62080-239-アツコ" = "……。"
"62080-240-アツコ" = "たしかに、それもあり得るかも。"
"62080-241-アツコ" = "でも……もしも「ラッパ吹きの天使」がそういう存在だとしたら――"
"62080-242-アツコ" = "それは――ウイさんが想像してる以上に……。"
"62080-243-アツコ" = "計り知れないほど、重くて根深い存在かもしれないよ。"
"62080-244" = "次回;Apocrypha"
