[translation]
"62100-1" = "第10話;巣"
"62100-2-アリウスの生徒A" = "お願いです、サオリ先輩！どうかお引き取りください！"
"62100-3-アリウスの生徒B" = "私たちはここを守るよう、命令されてるんです！誰も中に入れちゃいけないって！"
"62100-4-サオリ" = "お前たちから快く思われていないことは、よく分かっている。"
"62100-5-サオリ" = "だが、対立してばかりでは何も変わらない……！"
"62100-6-サオリ" = "私たちは、スバルと話をしに来ただけなんだ！"
"62100-7-サオリ" = "そもそも、ここへの立ち入りは強く禁じられているはずじゃなかったのか？"
"62100-8-アリウスの生徒B" = "そ、そう言われても……！"
"62100-9-アリウスの生徒B" = "どうしよう……？"
"62100-10-アリウスの生徒A" = "でも、スバル先輩は……ここを守れって。"
"62100-11-アリウスの生徒B" = "あれ……？でも、陣地を作っておけって言ってたよね……？"
"62100-12-アリウスの生徒A" = "出入りさせるなって言ってたから、同じことだよね！"
"62100-13-アリウスの生徒B" = "やっぱり引き返してください！#nそうじゃないと、私たちも発砲するしか――"
"62100-14-アリウスの生徒A" = "だ、誰！？"
"62100-15-アリウスの生徒A" = "あっ、ごめん……。#n発砲って言葉が聞こえたから、つい……。"
"62100-16-ミサキ" = "……撃たれたな。"
"62100-17-ミサキ" = "うん、撃たれたね。"
"62100-18-ヒヨリ" = "なんか、そんな気はしてましたけど……。"
"62100-19-マイア" = "だ、大丈夫なんですか！？相手が多すぎるんじゃ……。"
"62100-20-マイア" = "心配いらないよ。"
"62100-21-マイア" = "……なっ、なんでそんなに自信があるんですか！？"
"62100-22-ミサキ" = "そんなこと言われても……。"
"62100-23-アツコ" = "見せた方が早いんじゃないかな。"
"62100-24-アツコ" = "それじゃあ、先生。お願いね。"
"62100-25" = "[s] \"なんで毎回こうなっちゃうのかなぁ……。\""
"62100-26-アツコ" = "それは……。"
"62100-27-アツコ" = "これがアリウス流だから、かな。"
