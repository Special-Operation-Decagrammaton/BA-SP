"62105-36-スバル" = "……。"
"62105-37-スバル" = "それでも今は……この巣を守りたいと思っています。"
"62105-38-スバル" = "ここにいる小さな雛鳥たちが、ほんの少しでも。"
"62105-39-スバル" = "生きててよかった、って思えるような場所にしていきたいんです。"
"62105-40-スバル" = "そう。"
"62105-41-スバル" = "私は巣を守りたかった。"
