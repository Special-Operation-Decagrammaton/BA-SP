"62105-59-スバル" = "力が――"
"62105-60-スバル" = "力が必要だ。"
"62105-61-スバル" = "何にも揺るがぬ力が。"
"62105-62-スバル" = "世界を塗り替えられるような力が。"
"62105-63-スバル" = "そうなれるのなら――"
"62105-64" = "[log][FF6666][i]我らの怒りを解き放て。[/i][-][/log]"
"62105-65-スバル" = "……！？"
"62105-66" = "[log][FF6666][i]トリニティに報復を。ゲヘナに破滅を。[/i][-][/log]"
