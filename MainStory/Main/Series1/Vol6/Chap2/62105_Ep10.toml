"62105-27-アリウスの生徒C" = "思い出してください。"
"62105-28-スバル" = "すべての始まりは……先生がトリニティを、アリウスに招いたことだったのですから。"
"62105-29-アリウスの生徒C" = "……！"
"62105-30-アリウスの生徒D" = "そ、そうだ！あいつらを完全に追い出さなきゃ！"
"62105-31-アリウスの生徒C" = "私たち、やれるだけやってきます！"
