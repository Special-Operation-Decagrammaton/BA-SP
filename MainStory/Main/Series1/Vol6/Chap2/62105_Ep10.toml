"62105-46-スバル" = "……。"
"62105-47-スバル" = "先生は、巣を壊しに来た人だ。"
"62105-48-スバル" = "スクワッドは、巣を見捨てて去っていった人たちだ。"
"62105-49-スバル" = "その背後には……おそらくトリニティがいるのだろう。"
"62105-50-スバル" = "……。"
"62105-51-スバル" = "ここを守らなければいけない。"
"62105-52-スバル" = "そのために――"
"62105-53-スバル" = "あの子を追い出してしまったのだから。"
