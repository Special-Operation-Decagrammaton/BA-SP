"62105-68-スバル" = "この声は……？"
"62105-69" = "[log][i][FF6666]断罪の[/i][-][ruby=[FF6666]ちから[-]][FF6666][i]権能[/i][-][/ruby][FF6666][i]を授けよう。[/i][-][/log]"
"62105-70" = "[log][FF6666][i]あまねく敵に、滅びのラッパを。[/i][-][/log]"
"62105-71-スバル" = "！！！！！"
