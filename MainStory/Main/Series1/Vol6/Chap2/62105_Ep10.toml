"62105-12-スバル" = "（今のは……一体……？）"
"62105-13-スバル" = "（いや、だとしたら……）"
"62105-14-スバル" = "……！"
"62105-15-？？？" = "先輩！"
"62105-16-アリウスの生徒C" = "うわっ！？だっ、大丈夫ですか！？"
"62105-17-アリウスの生徒D" = "汗びっしょりですよ……？何か、あったんですか？"
