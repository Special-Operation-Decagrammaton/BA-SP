[translation]
"62090-1" = "第9話;Apocrypha"
"62090-2-スバル" = "本当に、あったのですね……。"
"62090-3-スバル" = "トリニティが偽典と断じ、常に目を背け……無かったことにしようとしてきた――"
"62090-4-スバル" = "[ruby=apocrypha]外典[/ruby]……！"
"62090-5-？？？" = "いつまであなたは、さばくことをなさらず、また地に住む者に対して、わたしたちの血の報復をなさらないのですか。"
"62090-6-？？？" = "いつまで、「真理はどこにあるのか」と、彼女ら[ruby=あざけ]が嘲る[/ruby]声を聞かねばならないのでしょうか。"
"62090-7-スバル" = "「血の報復」とは……冒頭から強烈ですね。"
"62090-8-？？？" = "これは、すべての悪しき者と不敬なる者が追放される患難の時に――"
"62090-9-？？？" = "選ばれし者と、義なる者のための言葉である。"
"62090-10-スバル" = "……おや？ここからは内容が変わるみたいですね……？"
"62090-11-スバル" = "……なるほど。"
"62090-12-スバル" = "外典の記述と並んで、アリウスの歴史も記されているのですか。"
"62090-13-？？？" = "トリニティは我らに破門を宣告した。だが、彼女らは知らないのだ。"
"62090-14-？？？" = "それはむしろ、彼女ら自身への破門であるということを。"
"62090-15-？？？" = "己の内なる姉妹を抱けぬ者が、どうして己の外たる他者を抱けようか。"
"62090-16-？？？" = "彼女らは我らを[ruby=この地]ニコメディア[/ruby]に追いやった。"
"62090-17-？？？" = "なればこそ、この地にアリウスの礎を築くのだ。"
"62090-18-スバル" = "ニコメディア……？"
"62090-19-スバル" = "それがここの、本来の名称だったのでしょうか。"
"62090-20-？？？" = "トリニティが最初に銃口を向けたのは、我らアリウスであった。"
"62090-21-？？？" = "武器を持った子どもとは、何よりもまず、その力を試したがるもの。"
"62090-22-？？？" = "異端とされたアリウスは、格好の的だったのだろう。"
"62090-23-スバル" = "……これは、私たちもよく知る話ですね。"
"62090-24-スバル" = "……おや、また外典の記述に戻るのですか。"
"62090-25-？？？" = "予言され[ruby=しるし]た徴が[/ruby]現れるその日が来れば。"
"62090-26-？？？" = "今はまだ見えぬ都が――隠されていた地が顕現するだろう。"
"62090-27-？？？" = "真理は人々と共にあり、その日まで残っていた者たちは、永遠に歓喜することになる。"
"62090-28-スバル" = "これは……黙示録？"
"62090-29-スバル" = "……いえ、共通の経典の黙示録とは少し内容が異なりますね。"
"62090-30-スバル" = "まあ……「外典」という言葉の意味を考えれば、当然なのかもしれませんが。"
"62090-31-？？？" = "世界が覚醒し、朽ち果てるべきものは消え去るだろう。"
"62090-32-？？？" = "正しき者はわずかにして、不敬なる者は数知れず。"
"62090-33-？？？" = "汝は、救われる少数のために喜びを感じれど――"
"62090-34-？？？" = "滅びゆく数多のために悲しむ事なかれ。"
"62090-35-スバル" = "「滅びゆく数多のために悲しむ事なかれ」……。"
"62090-36-スバル" = "……。"
"62090-37-スバル" = "皆さん？どうかしましたか？"
"62090-38-アリウスの生徒D" = "陣地の設営が完了したので、ご報告に来ました！"
"62090-39-スバル" = "そうですか。ご苦労さまでした。"
"62090-40-アリウスの生徒C" = "先輩の方は何か分かりましたか？"
"62090-41-スバル" = "手がかり……とまではいかないかもしれませんが、隠されていた経典を見つけました。"
"62090-42-スバル" = "おそらくはトリニティでも扱われていない……アリウスだけの経典です。"
"62090-43-アリウスの生徒D" = "すごいです！新しい何かが書かれているのでしょうか？"
"62090-44-アリウスの生徒C" = "あ、その前に……#nその、ちょっと皆で話してたことがあって……。"
"62090-45-アリウスの生徒D" = "いま言うことじゃないかもしれないんですけど……。"
"62090-46-アリウスの生徒D" = "でも、決めるなら先輩が適任なので……。"
"62090-47-スバル" = "……何かあったのですね。#nどうぞ、話してください。"
"62090-48-アリウスの生徒D" = "はい……その……。"
"62090-49-アリウスの生徒C" = "えっと……私たちのことなんですけど……。"
"62090-50-アリウスの生徒D" = "集まってる人数的には、小隊より多くて、中隊よりはやや少ないくらいで……。"
"62090-51-アリウスの生徒D" = "もちろんここ以外にも、別で集まってる子たちもいますけど……。"
"62090-52-アリウスの生徒C" = "そろそろ、私たちのグループに、名前が必要なんじゃないかって話になってて……。"
"62090-53-アリウスの生徒D" = "その……「アリウススクワッド」みたいに。"
"62090-54-アリウスの生徒D" = "……って、名前を言うだけでちょっとイラッとしちゃいましたけど！とにかく！"
"62090-55-スバル" = "なるほど、話は分かりました。#nでも、今それを……。"
"62090-56-スバル" = "……。"
"62090-57-スバル" = "いえ。名前は大事ですね。"
"62090-58-アリウスの生徒D" = "分かっていただけて嬉しいです！"
"62090-59-アリウスの生徒D" = "先輩、何か良い案はありますか……？"
"62090-60-スバル" = "……。"
"62090-61-スバル" = "……ニコメディア。"
"62090-62-アリウスの生徒D" = "ニコ……メディア？"
"62090-63-スバル" = "ええ。ニコメディアトゥループ。"
"62090-64-スバル" = "これを、今ここに集まっている皆さんの所属名にしましょう。"
"62090-65-アリウスの生徒D" = "分かりました！"
"62090-66-アリウスの生徒D" = "意味はよく分からないけど……なんかカッコいいし気に入りました！"
"62090-67-マイア" = "本当に大丈夫でしょうか……？#n先生が直接行くなんて……。"
"62090-68" = "[s1] \"大丈夫かどうかじゃないんだ。\"\n[s2] \"……行かなきゃならないんだよ。\""
"62090-69-マイア" = "あの……先生？"
"62090-70-マイア" = "もし、スバル先輩が私たちを……。"
"62090-71-マイア" = "先生のことを、どうしても許せないって言ったら……。"
"62090-72-マイア" = "先生がポルタパシスに行くこと自体が――"
"62090-73-マイア" = "無意味になっちゃうんじゃ……ないですか……？"
"62090-74" = "[s3] \"それでも、行かなきゃ。\"\n[s4] \"たとえ最後まで許してもらえなかったとしても。\""
"62090-75" = "[ns] \"何も言わずに終わるのだけは、絶対にやっちゃいけない。\""
"62090-76-マイア" = "そうすれば、未来に可能性を残せるから……ですか……？"
"62090-77-マイア" = "……。"
"62090-78-マイア" = "やっぱり先生って、すごいです。私も……。"
"62090-79-マイア" = "私も……。"
"62090-80-マイア" = "先生みたいに。そしてスバル先輩みたいに……。"
"62090-81-マイア" = "ちゃんとした人になりたいです……。"
"62090-82-マイア" = "もちろん、スバル先輩は私のこと……。"
"62090-83-マイア" = "……うぅ。"
"62090-84-ミサキ" = "あれだけのことがあったのに、まだスバルの肩を持つのか……。"
"62090-85-ミサキ" = "[ruby=あの人]スバル先輩[/ruby]はそういうタイプでしょ。いつの間にか、相手を従わせてる。"
"62090-86-ミサキ" = "厄介なのは、そうしてるって自覚がないところ。"
"62090-87-ミサキ" = "……そうだったな。"
"62090-88-ヒヨリ" = "え、えへへ……。私は、サオリ姉さんがいてくれて……良かったなって思ってます……。"
"62090-89-アツコ" = "うん。サッちゃんはいいリーダーだよ。"
"62090-90-サオリ" = "……。"
"62090-91-アツコ" = "でも、スバルもスバルなりに、一生懸命やってるとは思うけどね。"
"62090-92-ミサキ" = "……それだけじゃ足りないってこと、分かってるでしょ？"
"62090-93-アツコ" = "……うん。そうだね。"
"62090-94" = "[s] \"……あれ？大丈夫？ちょっとペース落とそうか？\""
"62090-95-アツコ" = "ううん、気にしないで。ごめんね、すぐ追いつくから。"
"62090-96-サオリ" = "先生の足を止めさせてしまっては申し訳ない。"
"62090-97-サオリ" = "何が起きるかも分からない。先を急ごう。"
"62090-98-スバル" = "（次のページは……）"
"62090-99-？？？" = "ゲヘナと共存できるという思想こそ、異端である。"
"62090-100-？？？" = "その思想を掲げ、あらゆる教派を弾圧し、取り込もうとする。"
"62090-101-？？？" = "そんなトリニティもまた、異端である。"
"62090-102-？？？" = "栄光にあると自称する者たちよ。"
"62090-103-？？？" = "全てを知ると驕る者たちよ。"
"62090-104-？？？" = "謙遜は初めから、お前たちの美徳ではなかった。"
"62090-105-？？？" = "[ruby=Vanitas vanitatum et omnia vanitas]全ては虚しい。どこまで行こうとも、全てはただ虚しいものだ[/ruby]。"
"62090-106-スバル" = "（何度も入れ替わったアリウスの支配層に関する記録。そして、トリニティとゲヘナへの、呪詛にも等しい言葉の数々……）"
"62090-107-スバル" = "（そんなものは、もう十分だ。嫌というほど感じてきたことだから）"
"62090-108-スバル" = "（今必要なのは、何をすべきか、何ができるか。そして……）"
"62090-109-スバル" = "（あの天使に関する記述……）"
"62090-110-？？？" = "目は見ても飽くことはなく、耳は聞いても満ち足りることはない。"
"62090-111-？？？" = "かつて起きたことは、これからもまた起きる。#nかつて成されたことは、これからもまた成される。"
"62090-112-？？？" = "日の下に、新しきものなど何ひとつとして無い。"
"62090-113" = "[ruby=Vanitas vanitatum et omnia vanitas]全ては虚しい。どこまで行こうとも、全てはただ虚しいものだ[/ruby]。"
"62090-114-スバル" = "（また……経典の一節……）"
"62090-115-スバル" = "（[ruby=Vanitas vanitatum et omnia vanitas]全ては虚しい。どこまで行こうとも、全てはただ虚しいものだ[/ruby]）"
"62090-116-スバル" = "（偶然にしては、あまりに一致しすぎている……？）"
"62090-117-？？？" = "この世は屍を喰らう者なり。喰われし者、すなわち死に至る。"
"62090-118-？？？" = "されど、真理は命を養う者なり。真理により育まれし者、死に至ることなし。"
"62090-119-？？？" = "言うなれば、天使とは、汝ら自身を象徴する存在に過ぎぬ。"
"62090-120-スバル" = "（ん……？）"
"62090-121-スバル" = "（天使が、私たちの象徴……？）"
"62090-122-スバル" = "（この解釈は初めて見るような……）"
"62090-123-スバル" = "（なっ……何！？）"
"62090-124-？？？" = "公会議の決議をここに宣言する。"
"62090-125-？？？" = "アリウスに、今より永劫の破門を言い渡す。"
"62090-126-？？？" = "――聖なる魂の名において。"
"62090-127-？？？" = "道はなかった。故に我らは、傷だらけの手で進む先をこじ開けた。"
"62090-128-？？？" = "光は我らから去り、こだまする[ruby=どうこく]慟哭[/ruby]の中に身を沈めた。"
"62090-129-？？？" = "天の最も高きところから、地の最も低きところに至るまで――"
"62090-130-？？？" = "[ruby=彼女たち]トリニティ[/ruby]は、私たちを「存在しなかったこと」にしようとした。"
"62090-131-？？？" = "多くの者が消えた。"
"62090-132-？？？" = "消える必要のない者が消え――"
"62090-133-？？？" = "憎み合う必要のなかった者たちが、憎しみ合った。"
"62090-134-？？？" = "その果ては――"
"62090-135-声" = "[ruby=Vanitas vanitatum et omnia vanitas]全ては虚しい。どこまで行こうとも、全てはただ虚しいものだ[/ruby]。"
"62090-136-スバル" = "……！？この声は……！？"
"62090-137-スバル" = "[ruby=いま]現在[/ruby]は、過去を礎にした建築物だ。すべての過去は、現在と無関係ではない。"
"62090-138-声" = "過去に――公会議で少しでも違う結論が下されていたのなら。「異なる解釈」などという理由で、[ruby=我々]アリウス[/ruby]が追放されていなかったのなら。"
"62090-139-声" = "現在……[ruby=我々]アリウス[/ruby]はどんな生き方をしていただろうか。"
"62090-140-スバル" = "アリウスは、考え続けねばならなかった。"
"62090-141-スバル" = "……あなたは……誰、ですか？"
"62090-142-スバル" = "[ruby=我々]アリウス[/ruby]は、[ruby=アリウス]我々[/ruby]に残された――"
"62090-143" = "次回;巣"
