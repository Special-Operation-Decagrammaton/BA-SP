[translation]
"62050-1" = "第5話;アリウス・バシリカ"
"62050-2-アリウスの生徒B" = "先輩、[ruby=バシリカ]大聖殿[/ruby]に集合って言ってたけど……。"
"62050-3-アリウスの生徒B" = "あの日以降、ほとんど使ってなかったのに……。"
"62050-4-アリウスの生徒D" = "アリウス・バシリカ……。"
"62050-5-アリウスの生徒D" = "ずっと昔……アリウスが追放された後に、ここを使い始めたんだよね。"
"62050-6-アリウスの生徒B" = "そう。バシリカって名前も、その時につけたんだっけ。"
"62050-7-アリウスの生徒B" = "でも、なんで今さら……。"
"62050-8-アリウスの生徒たち" = "……よく、分からない。"
"62050-9-アリウスの生徒たち" = "ここは……今の[ruby=アリウス]私たち[/ruby]にとって、何なんだろう。"
"62050-10-アリウスの生徒たち" = "……なんで先輩は、私たちをここに集めたんだろう。"
"62050-11-スバル" = "皆さん、揃いましたか？"
"62050-12-スバル" = "……不安そうですね。"
"62050-13-スバル" = "大丈夫です。私も同じですから。"
"62050-14-スバル" = "まず、ひとつ確認したいことがあります。"
"62050-15-スバル" = "私の認識が正しければ、ここにいる皆さんは今日――"
"62050-16-スバル" = "「黙示録」に記された声を、聞いたはずです。"
"62050-17-スバル" = "聞いていないという方がいれば、遠慮なくおっしゃってください。"
"62050-18-スバル" = "……いないようですね。#nでは、あの声は私たち全員に届いていた、と。"
"62050-19-スバル" = "……ですが私は、あの声が「黙示録」そのものを意味するのかどうか、まだ確信を持てていません。"
"62050-20-スバル" = "え……？どうしてですか？#nあれだけはっきり……みんな聞いてたのに……？"
"62050-21-スバル" = "黙示録の記述はあれだけではありません。"
"62050-22-スバル" = "「またわたしが見ていると、一羽の[ruby=わし]鷲[/ruby]が中空を飛び、大きな声でこう言うのを聞いた」"
"62050-23-スバル" = "「ああ、わざわいだ、わざわいだ、地に住む人々は、わざわいだ」"
"62050-24-スバル" = "「なお三人の御使がラッパを吹き鳴らそうとしている」"
"62050-25-スバル" = "……私が確信を持てない理由は、前半の部分――空を飛ぶ「[ruby=わし]鷲[/ruby]」のくだりです。"
"62050-26-スバル" = "鷲どころか、鳥の姿すら私は見ていません。"
"62050-27-スバル" = "鷲……あるいは鳥のようなものを見た、という方はいますか？"
"62050-28-スバル" = "……こちらも、いないようですね。分かりました。"
"62050-29-スバル" = "それと、もうひとつ。#n……ラッパの音は、7回鳴り響くとされていますよね？"
"62050-30-アリウスの生徒A" = "はい……そうだったはずです。"
"62050-31-スバル" = "そして声によれば、すでにラッパの音は4回鳴り響いたことになっている。#nこれも、あっていますよね？"
"62050-32-アリウスの生徒B" = "……その通りです。"
"62050-33-スバル" = "……ですが、私は今まで一度もラッパの音を聞いていません。#n皆さんは、どうですか？"
"62050-34-アリウスの生徒A" = "私は聞こえましたよ？"
"62050-35-アリウスの生徒C" = "私には聞こえなかったです！"
"62050-36-アリウスの生徒A" = "えっ、あんなに大きな音だったのに！？"
"62050-37-アリウスの生徒C" = "だから前にも言ったじゃん！#nそっちの聞き間違いじゃないかって……！"
"62050-38-アリウスの生徒A" = "でも、声は全員に聞こえてるんだよ？"
"62050-39-スバル" = "分かりました。それでは……。"
"62050-40-スバル" = "……。"
"62050-41-スバル" = "皆さん？これから行うのはただの確認ですので、お気になさらず。"
"62050-42-スバル" = "ラッパの音が聞こえたという方は左へ、聞こえなかったという方は右へ分かれてください。"
"62050-43-スバル" = "（……聞こえた側の人数が、明らかに少ないですね）"
"62050-44-スバル" = "（よく見ると、他にも共通点があるような……？）"
"62050-45-スバル" = "はい、ありがとうございます。"
"62050-46-スバル" = "それでは、現時点での結論をお話します。"
"62050-47-スバル" = "「ポルタパシス」へ向かい、今回の出来事の真相を調査すべきだ、と私は考えています。"
"62050-48-アリウスの生徒A" = "ポルタパシス！？先輩、本気なの……？"
"62050-49-アリウスの生徒B" = "先輩はいつだって本気だったよ……しかも、こういうときは特にね。"
"62050-50-アリウスの生徒D" = "あそこって、マダムですら中に入らなかった場所じゃ……？"
"62050-51-アリウスの生徒D" = "でも、もうマダムはいないし……。"
"62050-52-アリウスの生徒D" = "マダムの言ってたことが、全部正しかった訳でもないし……。"
"62050-53-アリウスの生徒A" = "それはそうだけどさ……。"
"62050-54-スバル" = "皆さんの不安は分かっています。"
"62050-55-スバル" = "ですが、手がかりがあるとしたら……#n少なくともアリウスの中では「ポルタパシス」をおいて他にないというのも、また事実です。"
"62050-56-スバル" = "……あそこには、アリウスの歴史と、経典の様々な解釈が保管されているのですから。"
"62050-57-アリウスの生徒A" = "で、でも「ポルタパシス」に入ったら……。"
"62050-58-スバル" = "……そうですね。"
"62050-59-スバル" = "資格なき者、信仰を持たぬ者、信仰を失った者が入れば――"
"62050-60-スバル" = "その果てで己を見失い、アリウスを永遠に彷徨うことになる。#nそう言われています。"
"62050-61-スバル" = "それでも、私たちは向き合わねばなりません。#n他でもない、私たちのアリウスで起こっている現象に。"
"62050-62-スバル" = "……人知の及ばぬことが起きる場所。"
"62050-63-スバル" = "それがアリウスですから。"
"62050-64-スバル" = "ましてや……真実から目を背け、自分たちの罪を隠すために、私たちを「存在しなかったこと」にしようとした――"
"62050-65-スバル" = "あの不道徳なトリニティと、同じ道を進むわけにはいきません。"
"62050-66-スバル" = "まだ仮説の域を出ませんが、黙示録の内容が現実になったのは、トリニティと――"
"62050-67-スバル" = "シャーレの「先生」の影響かもしれません。"
"62050-68-アリウスの生徒B" = "せ、先生が！？トリニティはともかく、先生は……。"
"62050-69-アリウスの生徒B" = "先生って、良い人に見えたのに……。"
"62050-70-スバル" = "ええ。先生は、良い方だと思います。それは、私も認めます。"
"62050-71-スバル" = "……ですが善意がいつも良い結果を生むとは限りません。#nそれは、皆さんもよく知っているはずです。"
"62050-72-スバル" = "……。"
"62050-73-スバル" = "どうあれ、[ruby=トリニティ]救護騎士団[/ruby]は再び、アリウスの地に足を踏み入れました。"
"62050-74-スバル" = "事実、黙示録が発現したのは、その直後です。"
"62050-75-スバル" = "つまり、トリニティを呼び込んだのが「先生」である以上――"
"62050-76-スバル" = "今回の件の原因も、やはりトリニティ……ひいては先生にあると考えるのが自然でしょう。"
"62050-77-アリウスの生徒C" = "そ、それはそうかも……。"
"62050-78-アリウスの生徒D" = "勉強とか試験とか……そんな余計なことをしなくたって……。"
"62050-79-アリウスの生徒D" = "私たちは私たちで、どうにか生きていけたはずだよね。"
"62050-80-アリウスの生徒C" = "そもそも、勉強って何？意味あるの？"
"62050-81-アリウスの生徒C" = "難しいし、分かんないし、眠くなるし。"
"62050-82-アリウスの生徒D" = "時間の無駄じゃん。もったいないって。"
"62050-83-アリウスの生徒D" = "まぁ、他にやることなかったのはそうだけどさ……。"
"62050-84-スバル" = "（こちらは……ラッパの音が「聞こえなかった」側ですね）"
"62050-85-アリウスの生徒B" = "……でも、私は勉強、嫌いじゃなかったかも。"
"62050-86-アリウスの生徒B" = "私も。外の世界がどうなってるかも、少しは分かったし……。"
"62050-87-アリウスの生徒B" = "誰かを傷つける方法の訓練をするよりは……。"
"62050-88-アリウスの生徒A" = "正直、勉強の内容は全然分かんなかったし……つまんないし。#n退屈だし、眠かったけど……。"
"62050-89-アリウスの生徒A" = "それでも……よかったんだ。"
"62050-90-アリウスの生徒A" = "自分の話をちゃんと聞いてもらえて、自分の言葉を伝えられるっていうのが……。"
"62050-91-スバル" = "（こちらはラッパの音が「聞こえた」側……？）"
"62050-92-スバル" = "（……まさか！？）"
"62050-93-スバル" = "（いえ……もう少し様子を見るべきですね……）"
"62050-94-スバル" = "ところで皆さん。"
"62050-95-スバル" = "万が一、天使が7つのラッパをすべて吹いたとしたら……どうなると思いますか？"
"62050-96-アリウスの生徒B" = "えっ？そ、それって……！"
"62050-97-アリウスの生徒B" = "そんなはずないよ！"
"62050-98-アリウスの生徒D" = "でも黙示録には……。"
"62050-99-アリウスの生徒D" = "そうだよ。私たち、黙示録だけはいっぱい勉強してきたじゃん。#nだから、7つのラッパが鳴っていたら……。"
"62050-100-アリウスの生徒たち" = "アリウスは……滅亡する？"
"62050-101-スバル" = "……。"
"62050-102-スバル" = "ええ。#n経典の記述が正しいのなら、世界が滅び始めるはずです。"
"62050-103-スバル" = "アリウスは、その始まりを告げる場所に過ぎない。"
"62050-104-スバル" = "記述通り進むのであれば……次は、7人の天使が鉢を地に傾ける番でしょうか。"
"62050-105-アリウスの生徒C" = "ど、どどどうしよう！？"
"62050-106-アリウスの生徒D" = "い、今ならまだ……！"
"62050-107-アリウスの生徒D" = "！！！"
"62050-108-アリウスの生徒D" = "アリウスを「浄化」しなきゃ！"
"62050-109-アリウスの生徒C" = "浄化……？"
"62050-110-アリウスの生徒C" = "！！！"
"62050-111-アリウスの生徒C" = "そうだ！先生やスクワッドを……#nみんなアリウスから追い出さなきゃ！"
"62050-112-アリウスの生徒A" = "で、でも勉強は？それに、試験も……。"
"62050-113-アリウスの生徒D" = "今はそれどころじゃないでしょ！？"
"62050-114-アリウスの生徒D" = "そんなこと気にしてる場合じゃないって！"
"62050-115-スバル" = "はい……だから私は、この状況下で皆さんの意見を聞きたかったんです。"
"62050-116-スバル" = "なので、長らく使われていなかったアリウス・バシリカの扉を開けました。"
"62050-117-スバル" = "ここは偽りの礼拝堂であり……マダムによって歪められた地でもありますが……。"
"62050-118-スバル" = "……それでもずっと、[ruby=アリウス]追放された者たち[/ruby]の礼拝堂だった場所です。"
"62050-119-アリウスの生徒D" = "私たちのアリウスに戻さなきゃ！"
"62050-120-アリウスの生徒D" = "ラッパはあと3回残ってるんですよね！？"
"62050-121-アリウスの生徒C" = "で、でも……それ、私たちは聞いてないけど……？"
"62050-122-アリウスの生徒D" = "全部「浄化」しちゃえば聞こえなくなるんだし、そんなの気にする必要ないって！"
"62050-123-アリウスの生徒B" = "で、でも……。"
"62050-124-アリウスの生徒B" = "（私、復習もちゃんとしてたのに……）"
"62050-125-アリウスの生徒B" = "（こんな中途半端なところで終わりなのは……ちょっと……）"
"62050-126-？？？" = "あ、あの……トリニティや先生のせいじゃないかも……しれない、とは思いませんか……？"
"62050-127-アリウスの生徒D" = "は？"
"62050-128-アリウスの生徒D" = "誰、今の？"
"62050-129-アリウスの生徒C" = "あの子は……。"
"62050-130-スバル" = "……続きを話していただけますか？"
"62050-131-マイア" = "は、はいっ。#nあの……これは、私が思うだけ、なんですけど……。"
"62050-132-マイア" = "黙示録に書かれてることが、そのまま起きるって……#n確証は、ないじゃないですか……？"
"62050-133-アリウスの生徒D" = "！！！"
"62050-134-アリウスの生徒D" = "何あの子……！？"
"62050-135-アリウスの生徒C" = "そ、そんなの経典への冒涜だ……！"
"62050-136-スバル" = "……どうして、そう思うんですか？"
"62050-137-マイア" = "だって、やっぱり鷲を見てないですし……。"
"62050-138-マイア" = "ラッパの音が鳴るたびに、ひどい災厄が起きるって書かれてましたけど……。"
"62050-139-マイア" = "そんな気配もなかったし……。"
"62050-140-アリウスの生徒D" = "ふざけないでよ！"
"62050-141-アリウスの生徒D" = "トリニティがここに踏み込んできたこと自体が、災厄じゃないの！？"
"62050-142-アリウスの生徒C" = "思い返してみてよ、先生だってそうじゃん！"
"62050-143-アリウスの生徒D" = "スクワッドも！"
"62050-144-アリウスの生徒C" = "そう！スクワッドのやつら！"
"62050-145-アリウスの生徒C" = "正直、トリニティよりムカつく……。"
"62050-146-アリウスの生徒D" = "そうだよ……#nなんか自分たちだけ、全部分かってるような顔して……！"
"62050-147-アリウスの生徒D" = "もともとあいつら、アリウスから逃げたくせに！！！"
"62050-148-アリウスの生徒たち" = "あいつらならできたはずなんだ！"
"62050-149-アリウスの生徒たち" = "あいつらならやれたはずなんだ！"
"62050-150-アリウスの生徒たち" = "スクワッドだったら、私たちを導けたはずでしょ！？"
"62050-151-アリウスの生徒たち" = "ロイヤルブラッドって呼ばれてたくせに！！！"
"62050-152-アリウスの生徒たち" = "どうして……？サオリ先輩……なんで行っちゃったの……？"
"62050-153-アリウスの生徒たち" = "どうして……私たちから逃げちゃったの……？"
"62050-154-アリウスの生徒たち" = "先輩に憧れてた子も、たくさんいたのに……！"
"62050-155-アリウスの生徒たち" = "虚しいって、何が虚しいって言うの……？"
"62050-156-アリウスの生徒たち" = "あんたも、ここにいたじゃん。私たちと同じだったじゃん……。"
"62050-157-アリウスの生徒たち" = "今さら救われたみたいな顔して、一人で……一人だけ……！"
"62050-158-アリウスの生徒たち" = "……。"
"62050-159-アリウスの生徒たち" = "…………。"
"62050-160-アリウスの生徒たち" = "………………。"
"62050-161-アリウスの生徒たち" = "あの子たちを見てると、ふと思っちゃうんだ。"
"62050-162-アリウスの生徒たち" = "このままでいいのかなって。#nこんな風に生きてていいのかなって。"
"62050-163-アリウスの生徒たち" = "私達の未来って、どうなるんだろうって……。"
"62050-164-アリウスの生徒たち" = "ああ、本当は。"
"62050-165-アリウスの生徒たち" = "[ruby=私も]私たちも[/ruby]そうやって。"
"62050-166-アリウスの生徒たち" = "今とは違う道を、生きてみたかったんだ。"
"62050-167-アリウスの生徒たち" = "でも、そんなことは――"
"62050-168-アリウスの生徒たち" = "もう、できないから……！"
"62050-169-マイア" = "できます！！"
"62050-170-アリウスの生徒A" = "！！！"
"62050-171-マイア" = "きっと……きっとできます！#n多分……おそらく、きっと……。"
"62050-172-アリウスの生徒B" = "……どうやって？"
"62050-173-マイア" = "そ、それは、先生に聞くことになりますが……。"
"62050-174-マイア" = "わ、私はよく分からないけど……先生ならきっと、私たちが知らないことを知ってるはずです！"
"62050-175-アリウスの生徒C" = "……。"
"62050-176-アリウスの生徒C" = "また先生？"
"62050-177-アリウスの生徒D" = "先生、先生って、もううんざりだよ！"
"62050-178-アリウスの生徒D" = "先生が何？あの人の言う通りにしてたら、なんでもうまくいくの？"
"62050-179-アリウスの生徒たち" = "そんな訳ないでしょ！！！！"
"62050-180-アリウスの生徒C" = "あんたさ、さっきから……あっちの肩ばっか持ってるよね？"
"62050-181-アリウスの生徒D" = "外に出て戻ってきたんでしょ？#n絶対、妙な考えに染まってるよ！"
"62050-182-アリウスの生徒C" = "アリウスはずっとこのままだった。#n先生は私達に何かしてくれた？トリニティは――？"
"62050-183-アリウスの生徒D" = "トリニティ……！！！"
"62050-184-アリウスの生徒D" = "そもそも！トリニティが！私たちをこんな風にしたんだ！！！"
"62050-185-アリウスの生徒D" = "……先輩。"
"62050-186-アリウスの生徒D" = "その子の言うことを聞くんですか？"
"62050-187-スバル" = "それは……。"
"62050-188-アリウスの生徒D" = "先輩は、[ruby=・]私[/ruby][ruby=・]た[/ruby][ruby=・]ち[/ruby]の味方ですよね？そうですよね？"
"62050-189-アリウスの生徒D" = "[ruby=・]ア[/ruby][ruby=・]リ[/ruby][ruby=・]ウ[/ruby][ruby=・]ス[/ruby]を守ってくれるんですよね？"
"62050-190-アリウスの生徒たち" = "証明してください、先輩！！！"
"62050-191-スバル" = "す、少し……時間をください。"
"62050-192" = "[log]証明[/log]"
"62050-193" = "[log]証明[/log]"
"62050-194" = "[log]証明証明[/log]"
"62050-195" = "[log]証明証明[/log]"
"62050-196" = "[log]証明証明証明[/log]"
"62050-197" = "[log]証明証明証明証明[/log]"
"62050-198" = "[log]証明証明証明証明証明証明[/log]"
"62050-199" = "[log]証明！！！[/log]"
"62050-200-マイア" = "せ、先……輩……。"
"62050-201-マイア" = "わ、私……ちが……うんです……。"
"62050-202-マイア" = "ほんとに、ほんとにちがうんです……私は、ただ……。"
"62050-203-マイア" = "先輩、ここ……みんなの家を……#n巣を守るって、言ってたじゃないですか……？"
"62050-204-スバル" = "……！"
"62050-205-スバル" = "一つだけ、聞いてもいいですか？"
"62050-206-マイア" = "は、はいっ！"
"62050-207-スバル" = "ラッパの音は……聞こえましたか？"
"62050-208-マイア" = "…………はい。"
"62050-209-スバル" = "そうですか。"
"62050-210-スバル" = "……ごめんなさい。"
"62050-211-マイア" = "！！！"
