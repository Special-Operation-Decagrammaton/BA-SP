[translation]
"62030-1" = "第3話;信じているもの"
"62030-2-セリナ" = "きゃあっ！"
"62030-3-ハナエ" = "うわああんっ！？"
"62030-4-ミサキ" = "アツコ、下がって！"
"62030-5-ミサキ" = "くっ……！？"
"62030-6-ヒヨリ" = "ミサキさんっ！？"
"62030-7-サオリ" = "うぐっ……！？"
"62030-8-ミネ" = "危険です！"
"62030-9-アツコ" = "ミネさんっ！？"
"62030-10-ミネ" = "ぐっ……！？"
"62030-11-ミネ" = "（これは……？）"
"62030-12-ミネ" = "（底知れない沼に、沈み込んでいくような……！）"
"62030-13-ミネ" = "――！！"
"62030-14-？？？" = "それは、異なる解釈によるものだった。"
"62030-15-？？？" = "見る者によっては単純で――"
"62030-16-？？？" = "見る者によっては取るに足らないことだった。"
"62030-17-？？？" = "彼女たちは、自分こそが「真理を解する者」だと信じていた。"
"62030-18-？？？" = "「正しき者」であることの証明をしたがっていた。"
"62030-19-？？？" = "しかし、それを掲げることは、他のすべてに「誤り」のレッテルを貼ることである。"
"62030-20" = "公会議の決議をここに宣言する。"
"62030-21" = "アリウスに、今より永劫の破門を言い渡す。"
"62030-22" = "――聖なる魂の名において。"
"62030-23" = "[log]それが、[/log]"
"62030-24" = "[log]果てなき迫害の始まりであった。[/log]"
"62030-25-ミネ" = "（これは……アリウスの……）"
"62030-26-？？？" = "道はなかった。故に我らは、傷だらけの手で進む先をこじ開けた。"
"62030-27-？？？" = "光は我らから去り、こだまする[ruby=どうこく]慟哭[/ruby]の中に身を沈めた。"
"62030-28-？？？" = "天の最も高きところから、地の最も低きところに至るまで――"
"62030-29-？？？" = "[ruby=彼女たち]トリニティ[/ruby]は、私たちを「存在しなかったこと」にしようとした。"
"62030-30-？？？" = "故に「生き延びる」ことが唯一の抵抗となり、崇高となった。"
"62030-31-？？？" = "されど、外に向けられぬ憎しみは、自らに還る他なかった。"
"62030-32-？？？" = "多くの者が消えた。"
"62030-33-？？？" = "消える必要のない者が消え――"
"62030-34-？？？" = "憎み合う必要のなかった者たちが、憎しみ合った。"
"62030-35" = "[log]その果ては――[/log]"
"62030-36" = "[log][ruby=Vanitas vanitatum et omnia vanitas]全ては虚しい。どこまで行こうとも、全てはただ虚しいものだ[/ruby]。[/log]"
"62030-37-ミネ" = "……！"
"62030-38-？？？" = "[ruby=トリニティ]追放した者たち[/ruby]は言った――#nお前たちは、なるべくして追放されたのだ、と。"
"62030-39-？？？" = "[ruby=トリニティ]追放した者たち[/ruby]は言った――#nお前たちは、自らその結果を招いたのだ、と。"
"62030-40-？？？" = "[ruby=トリニティ]追放した者たち[/ruby]は言った――#nお前たちは、そうあるべくして苦しんでいるのだ、と。"
"62030-41-？？？" = "だが、ここに述べる。"
"62030-42-？？？" = "初めからそうあるべき者など、どこにも存在しない。"
"62030-43-？？？" = "[ruby=トリニティ]追放した者たち[/ruby]は答えねばならない――#n自らの作った過去がなければ、[ruby=アリウス]追放された者たち[/ruby]はどこに立っていたのか。"
"62030-44-？？？" = "[ruby=トリニティ]追放した者たち[/ruby]は答えねばならない――#n自らの紡いだ歴史がなければ、[ruby=アリウス]追放された者たち[/ruby]はどんな明日を夢見られたのか。"
"62030-45-？？？" = "[ruby=トリニティ]追放した者たち[/ruby]は答えねばならない――#n自らの撒いた憎しみがなければ、[ruby=アリウス]追放された者たち[/ruby]はどんな愛を与えられたのか。"
"62030-46-子供の声" = "ごめんなさい……ゆるして……ごめんなさい……。"
"62030-47-子供の声" = "ごめんなさい……ごめんなさい……もう二度としませんから……！"
"62030-48-ミネ" = "……！"
"62030-49-？？？" = "希望を抱くことが、罪とされる世界がある。"
"62030-50-？？？" = "幸せになりたいと願う子どもが、罰を受ける世界がある。"
"62030-51-子供の声" = "もう二度と逆らいません……希望なんて、持ちません……。"
"62030-52-子供の声" = "もう二度と、幸せになりたいなんて、願いません……#nそんなこと……しませんから……。"
"62030-53-？？？" = "その世界では慈悲すらも、意味を失い色褪せる。"
"62030-54-子供の声" = "お願いです……どうかご慈悲を……。"
"62030-55-子供の声" = "ご慈悲を……。"
"62030-56" = "答えるがいい。"
"62030-57" = "子どもたちを消し去ったその真理に、いかなる威徳が宿るというのか。"
"62030-58" = "飢えをしのぐために盗みを働く子どもがいる。凍えた手足を息で温める子どもがいる。その涙の前で、いかなる正しさが標榜できるというのか。"
"62030-59" = "人生とは無意味な苦痛しかない。そう語る子どもの前で――いかなる正義が、公平を語れるというのか。"
"62030-60-ミネ" = "それ、は……。"
"62030-61" = "答えるがいい！"
"62030-62" = "お前には答える義務がある。"
"62030-63" = "すべての「[ruby=いま]現在[/ruby]」は、「過去」を礎にして築かれる。"
"62030-64-？？？" = "それはただの「異なる解釈」だった。#n単純で、些細で、意味すらなかった。"
"62030-65-？？？" = "だが、それがすべての憤怒と憎悪の導火線となった。"
"62030-66-？？？" = "この地の子どもは、誰よりも死に近づいた。"
"62030-67" = "[ruby=お前]追放した者[/ruby]は、何を以って生きていこうとするのか――"
"62030-68" = "答えるがいい！！"
"62030-69-ミネ" = "私、には――"
"62030-70-ミネ" = "答えられ……ません。"
"62030-71-ミネ" = "それは、そもそも答えがあってはならない……そういう、問いですから……。"
"62030-72-ミネ" = "ぐすっ……。"
"62030-73-ミネ" = "ううっ……うううっ……。"
"62030-74" = "[log]天の星も月も、[/log]"
"62030-75" = "[log]己の罪に耐えきれず、その光を隠した。[/log]"
"62030-76" = "[log][ruby=Quovadis,Domine.]何処へ行かれるのですか？[/ruby] [/log]"
"62030-77" = "[log]……一つ、[/log]"
"62030-78" = "[log]お尋ねしてもいいですか？[/log]"
"62030-79" = "[log]全てに絶望しきった時……[/log]"
"62030-80" = "[log]それでも自分を支えてくれるもの。[/log]"
"62030-81" = "[log]それは……何なのでしょうか。[/log]"
"62030-82-ミネ" = "（これは……？）"
"62030-83-ミネ" = "（ああ……私はあのとき、先生に問いかけて……）"
"62030-84-ミネ" = "（そして先生は、なんと……？）"
"62030-85" = "\"その人が信じているもの……かな。\""
"62030-86" = "\"人を突き動かすのは、感情であり、信念だからね。\""
"62030-87" = "\"理屈で割り切れるとは限らないんだよ。\""
"62030-88" = "\"それが、偉大な存在への信仰でも。\""
"62030-89" = "\"……自身の内側にある何かへの信頼だとしても。\""
"62030-90-ミネ" = "（けれど、先生）"
"62030-91-ミネ" = "（私は今、何を信じればよいのでしょうか）"
"62030-92-ミネ" = "（教えてください、先生）"
"62030-93-ミネ" = "（[ruby=私たち]トリニティ[/ruby]が生み出してしまった悲しみと惨禍に対して、私たちは……一体何ができるのでしょうか……？）"
"62030-94" = "[log]……信じることをしなさい。[/log]"
"62030-95-ミネ" = "（先生……？そのようなことはおっしゃっていなかったはず……）"
"62030-96" = "[ruby=・]信[/ruby][ruby=・]じ[/ruby][ruby=・]て[/ruby][ruby=・]き[/ruby][ruby=・]た[/ruby]こと。"
"62030-97" = "そして、ミネを支え、歩ませ、生かしてきたもの。#nそれを信じなさい。"
"62030-98-ミネ" = "（いいえ……）"
"62030-99-ミネ" = "（先生ならきっと、こうおっしゃってくださるはず……！）"
"62030-100" = "私たちは、過去を変えることはできない。"
"62030-101" = "でもそれは、「現在」を生きない理由には決してならない。"
"62030-102" = "その歩んできた道が、間違っていないと信じるのなら――"
"62030-103" = "道を貫くことで、自分を証明しなさい。"
"62030-104-ミネ" = "（私が、歩んできた道）"
"62030-105-ミネ" = "（それは……）"
"62030-106" = "[log]助けを求める声に、[/log]"
"62030-107" = "[log]耳を塞ぐなら――[/log]"
"62030-108" = "[log]自身は、何者であるというのか。[/log]"
"62030-109-ミネ" = "……！！"
"62030-110-ミネ" = "（……そうですね。[ruby=あなた]先生[/ruby]は、きっと……！）"
"62030-111-ミネ" = "……。"
"62030-112-ミネ" = "失礼いたしました。……あなたの問いに、お答えいたします。"
"62030-113-ミネ" = "ですがこれは、完璧な回答ではないかもしれません。"
"62030-114-ミネ" = "それでも……「何を以って生きていこうとするのか」という問いには足りるかと。"
"62030-115-ミネ" = "……この世界は悲しみに満ちています。#nそれは、揺るぎない事実。"
"62030-116-ミネ" = "現在は、過去を礎に築かれる。それもまた、疑いようもありません。"
"62030-117-ミネ" = "ですが……私の拙く、取るに足らない行為であっても――"
"62030-118-ミネ" = "その悲しみを、たとえ一匙でも減らすことができるのなら。"
"62030-119-ミネ" = "私は……それ以上、何も望みません。"
"62030-120" = "守るべきものがある。"
"62030-121" = "見返りなど望まない。"
"62030-122" = "信じたことを為す。"
"62030-123" = "それこそが、誇りなのだから。"
"62030-124-ミネ" = "誇りと信念を胸に刻み――"
"62030-125" = "振り返れば、どこにでも救いを求める声があった。"
"62030-126" = "けれど、その全てには応えられなかった。"
"62030-127" = "なぜ身体は一つしか持てないのか。"
"62030-128" = "私にできるのは……"
"62030-129" = "少しでも多く、その声に耳を傾けること。"
"62030-130" = "せめて、手の届く範囲だけでも――この手を差し伸べること。"
"62030-131" = "その小さく、人によっては取るに足らない選択が積み重なって――"
"62030-132" = "ほんのわずかでもいい。"
"62030-133" = "いつか皆が、より広い世界へと歩み出せるように。"
"62030-134-ミネ" = "――救護が必要な場に救護を。"
"62030-135-ミネ" = "皆さん、私の後ろに下がってください！"
"62030-136-ハナエ" = "団長！？"
"62030-137-ハナエ" = "団長！！"
"62030-138-ミネ" = "これより救護騎士団が、皆さんをお守りします！"
