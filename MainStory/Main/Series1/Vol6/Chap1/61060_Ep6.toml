[translation]
"61060-1" = "第6話;向こう側の椅子"
"61060-2-サオリ" = "……もうすぐ、日が沈む。"
"61060-3-アツコ" = "そうだね。少し急ごうか。"
"61060-4-ヒヨリ" = "……。"
"61060-5-ヒヨリ" = "ヒヨリ？どうかしたの？"
"61060-6-ヒヨリ" = "その……ほ、本当にアリウスに帰るんだなって……#n実感が湧いてきて、えへへ……。"
"61060-7-ヒヨリ" = "決まったことはしょうがないよ。やるべきことをやるだけ。"
"61060-8-ヒヨリ" = "私はもう、出来事にいちいち意味を見出すのはやめたの。"
"61060-9-サオリ" = "いい心構えだ。成長したな。"
"61060-10-ミサキ" = "リーダー、うるさい。いつも勝手にいなくなるくせに。"
"61060-11-サオリ" = "ぐっ……。"
"61060-12-アツコ" = "でも、またサッちゃんがリーダーをやってくれて、ちょっと嬉しかったりするんじゃない？"
"61060-13-アツコ" = "あくまで臨時だけどね。"
"61060-14-ミサキ" = "そ、それは……！"
"61060-15-ミサキ" = "……もういい。#nどうせ何言っても、姫の考えは変わらないんだろうし。"
"61060-16-アツコ" = "素直じゃないんだから。"
"61060-17-ミサキ" = "だから、違うってば！"
"61060-18" = "[ns]\"みんなの仲が良いのは素敵だよね。\""
"61060-19-ミサキ" = "先生まで……そんなこと言ってると置いてくよ。"
"61060-20-アツコ" = "ふふ。最初はびっくりしたけど……先生が一緒に来てくれて嬉しいよ。"
"61060-21-ヒヨリ" = "ご、護衛は、お任せ……ください。えへへ……。"
"61060-22-ナギサ" = "先生に、お願いがあります。"
"61060-23-ナギサ" = "アリウスの皆さんに、授業をしていただけないでしょうか？"
"61060-24-ナギサ" = "もちろん、優先されるべきは先生の安全です。"
"61060-25-ナギサ" = "リモート授業でも間接的な形でも。#nお望みの方法を実現するために協力は惜しみません。"
"61060-26-ナギサ" = "アリウスの皆さんの意思を無視する行為にもなり得るのかもしれませんが……。"
"61060-27-ナギサ" = "……はい？#n現地で授業を……！？"
"61060-28-サオリ" = "……。"
"61060-29-サオリ" = "てっきり、任務はリモート授業の準備を手伝うことだと思っていた。"
"61060-30-サオリ" = "私たちがアリウスに向かい、残っている生徒を説得するのだと。"
"61060-31-サオリ" = "それがまさか、護衛任務になるとはな……。"
"61060-32" = "[ns]\"ごめん、仕事増やしちゃったね。\""
"61060-33-サオリ" = "い、いやっ……先生が気にすることではない。"
"61060-34-サオリ" = "むしろ……#nかつてアリウスにいた者として、先生に迷惑をかけてしまうのではないかと……。"
"61060-35-サオリ" = "先生に気を遣わせてしまって、申し訳ない。"
"61060-36-ミサキ" = "ついでに、一応確認させて。"
"61060-37-ミサキ" = "なんでわざわざ危険な場所に行こうと思ったわけ？"
"61060-38" = "[ns1]\"大した理由じゃないよ。\"\n[ns2]\"そこに……生徒がいるから、かな。\""
"61060-39" = "[ns]\"……どうかな。ちょっとカッコよくなかった？\""
"61060-40-ヒヨリ" = "あっ、えっ？えぇ……？"
"61060-41-ミサキ" = "……ひとつだけ、よく分かった。"
"61060-42-ミサキ" = "先生って……たまに、すごくしょうもないよね……。"
"61060-43" = "[ns]\"そんな……。\""
"61060-44-ヒヨリ" = "うーん……。"
"61060-45-アツコ" = "でも、それが先生らしいんじゃないかな。"
"61060-46-アツコ" = "優しさが、逆に胸に刺さることってあるよね？"
"61060-47-アツコ" = "うん、それも分かってて、あえて言ったんだから。"
"61060-48-サオリ" = "あ、アツコ……！？"
"61060-49-ヒヨリ" = "せ、先生……分かりますよ……胸が苦しくって、うずくまっちゃうこと、ありますよね……。"
"61060-50-ミサキ" = "はいはい、茶番はいいから立って。まだ先は長いんだから。"
"61060-51-スバル" = "では皆さん、拍手をお願いします。"
"61060-52-スバル" = "――大切な友人の帰還を祝して。"
"61060-53-マイア" = "あ、あはは……もう、ボロボロなんですけどね……。"
"61060-54-スバル" = "それでも、ヘイローは無事じゃないですか。"
"61060-55-スバル" = "替えの利かないものを守り抜いたのです。#n他は後からどうとでもなりますよ。"
"61060-56-スバル" = "私たちには……まだ、時間がありますから。"
"61060-57-スバル" = "……マイア。無事でいてくれてありがとう。#nそして……おかえりなさい。"
"61060-58-マイア" = "た、ただいま……です……！先輩！"
"61060-59-スバル" = "復帰祝い……と言っても、大したことはできずすみません。"
"61060-60-マイア" = "そ、そんなことは！#nむしろ、こういう雰囲気が、恋しかったので……。"
"61060-61-スバル" = "そういえば、「外」はどうでした？#nマイアの言葉で聞いてみたいです。"
"61060-62-マイア" = "外……ですか？#nそうですね……。"
"61060-63-マイア" = "……不思議、でした。"
"61060-64-マイア" = "それに、綺麗で……。"
"61060-65-スバル" = "……。"
"61060-66-マイア" = "いろいろなものを見ました。#nすごく高いガラス張りのビルだったり。"
"61060-67-マイア" = "大きな川があって、その上に橋がかかっていたり。"
"61060-68-マイア" = "夜になると、ビルや街の灯りが川に映っていて……。"
"61060-69-マイア" = "水に揺れて、まるで夢の中にいるみたいでした。"
"61060-70-マイア" = "音楽を演奏するために作られた建物もありました。"
"61060-71-マイア" = "ここだと……「マダム」がいない隙を見て、こっそり弾くのがやっとだったのに。"
"61060-72-マイア" = "しかも、演奏は昼より夜にやるほうが多いそうです。"
"61060-73-マイア" = "だから最初から、暗いときにきれいに見えるように設計されているのだとか。"
"61060-74-マイア" = "世界には……生き延びるためとか、利益のためじゃなくて……。"
"61060-75-マイア" = "ただ「きれいだから」……。#nそれだけの理由で、何かを作ったり、時間をかけたりする人がいるんですね……。"
"61060-76-マイア" = "屋台が並ぶ市場は、見たこともない料理ばっかりでした。"
"61060-77-マイア" = "見て、香りを感じるだけで……#nなんだか、幸せな気分になれました。"
"61060-78-マイア" = "……それ以上のことは、できませんでしたけど。"
"61060-79-マイア" = "飲めるくらい綺麗な水が、遊ぶためだけにたくさん使われている場所もありました。"
"61060-80-マイア" = "しかも屋内と屋外で世界が違うみたいに作られていて、まるで異世界みたいで……。"
"61060-81-マイア" = "それから、他にも――"
"61060-82-マイア" = "……。"
"61060-83-スバル" = "……。"
"61060-84-マイア" = "でも、どこにも……私が居ていい場所は、なかった気がするんです。"
"61060-85-スバル" = "ええ……その気持ち、よく分かります。"
"61060-86-スバル" = "どこもまぶしくて……みんな幸せそうで。"
"61060-87-マイア" = "でも、「自分たちだけ違う」って感じで……。"
"61060-88-マイア" = "だから……。"
"61060-89-マイア" = "あの街の片隅で倒れて、意識を失っても……。"
"61060-90-マイア" = "きっと誰にも、気づかれないんだろうなって……思ったんです。"
"61060-91-スバル" = "この世界のどこかでは、誰かが幸せを感じていて。"
"61060-92-スバル" = "この世界のどこかでは、別の誰かが――満ち足りた生活を送っている。"
"61060-93-スバル" = "でもそれって……裏を返せば――"
"61060-94-スバル" = "この世界のどこかには、[ruby=・   ・   ・   ・   ・   ・]そうではない[/ruby]誰かがいる。"
"61060-95-マイア" = "「なんでもできる」という言葉は――"
"61060-96-マイア" = "どうしていいか分からない、ってことだったのかもしれません。"
"61060-97-マイア" = "生き方なんて……誰も教えてくれませんでしたから。"
"61060-98-スバル" = "人生に正解なんてない。だから、自分の思うままに生きなさい。"
"61060-99-スバル" = "聞こえはいいですが、なんて無責任で都合のいい励ましなんでしょうか。"
"61060-100-スバル" = "……お疲れ様でした。#nよく帰ってきてくれましたね。"
"61060-101-マイア" = "先輩……。"
"61060-102-スバル" = "分かります……その気持ち、よく分かりますよ。"
"61060-103-スバル" = "一度外に出て、帰ってきた子が……ここには、たくさんいますから。"
"61060-104-スバル" = "……中には、トリニティに行ったまま、消息が途絶えた子もいましたけど。"
"61060-105-マイア" = "……。"
"61060-106-マイア" = "トリニティ……。"
"61060-107-スバル" = "どうしました？マイアも行ってみたいのですか？"
"61060-108-マイア" = "い、いえいえいえっ！？そんな、私は別に！"
"61060-109-スバル" = "大丈夫ですよ。引き止めたりはしません。#nですが私は……たぶん、無理なんです。"
"61060-110-スバル" = "まだ――トリニティを許せそうにないので。"
"61060-111-マイア" = "そ、そうですよね！簡単に許せるわけ、ないですよね！"
"61060-112-マイア" = "私も……先輩と同じ気持ち、ですから……！"
"61060-113-スバル" = "ありがとう。#n……とても心強いです。"
"61060-114-スバル" = "そうです。許すことなどできません。"
"61060-115-スバル" = "すべてを導ける立場にいながら、ただ「消える」という選択をしたスクワッド――"
"61060-116-スバル" = "特に[ruby=じょうまえ]錠前[/ruby]サオリ――彼女のことを。"
"61060-117" = "次回;ハーモニカ"
