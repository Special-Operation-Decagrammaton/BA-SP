[translation]
"61080-1" = "第8話;アリウス流"
"61080-2-ヒヨリ" = "本物だ……。"
"61080-3-不安げなアリウスの生徒A" = "スクワッド……本当に来たんだ……。"
"61080-4-不安げなアリウスの生徒B" = "何のつもりで戻ってきたの？ここを捨てていったくせに……。"
"61080-5-不安げなアリウスの生徒A" = "昔から、特別扱いばっかりされてたのに……。"
"61080-6-不安げなアリウスの生徒B" = "今思えば、その「特別扱い」も別に大したもんじゃなかったけどさ……。"
"61080-7-不安げなアリウスの生徒A" = "あの大人がシャーレの先生……？#n直接見るのは初めてかも……。"
"61080-8-不安げなアリウスの生徒B" = "私は見たことある。あの時は気にも留めなかったけど……。"
"61080-9-ミサキ" = "……視線が痛いね。#n肌がピリピリする。"
"61080-10-ヒヨリ" = "だ、大丈夫ですか！？保湿クリームならまだちょっとだけ残ってますけど……！"
"61080-11-アツコ" = "大丈夫だよ、ヒヨリ。ミサキが言ってるのは、そういう意味じゃないから。"
"61080-12-アツコ" = "この……「敵意」のことだよ。"
"61080-13-スバル" = "スクワッド――[ruby=じょうまえ]錠前[/ruby]サオリ。"
"61080-14-サオリ" = "……スバル。"
"61080-15-スバル" = "単刀直入に聞きます。#n……ここには、何の目的で？"
"61080-16-サオリ" = "仕事だ。"
"61080-17-スバル" = "指名手配のまま、逃げ回っていると聞いてましたけど。"
"61080-18-サオリ" = "今も似たようなものだ。"
"61080-19-スバル" = "その生活に嫌気が差した……とでも言うつもりですか？"
"61080-20-サオリ" = "……まあ、少し疲れてはいるな。"
"61080-21-アツコ" = "サッちゃん……？"
"61080-22-サオリ" = "すまない。この場では……嘘をつきたくないんだ。"
"61080-23-サオリ" = "この、アリウス分校という場ではな。"
"61080-24-アツコ" = "……うん。分かる気がする。"
"61080-25-スバル" = "……そうですか。#nでは、[ruby=・   ・   ・   ・   ・   ・   ・   ・   ・]逃亡生活から逃げる[/ruby]ために戻って来たと？"
"61080-26-スバル" = "あいにくですが、あなたたちの居場所はもう、残ってないような気がしますが。"
"61080-27-サオリ" = "そうとも限らない。"
"61080-28-サオリ" = "ただ……そうだな。"
"61080-29-サオリ" = "……ふふっ。"
"61080-30-スバル" = "何がおかしいのですか？"
"61080-31-サオリ" = "いや、すまない。"
"61080-32-サオリ" = "今から話す内容を思うと……笑いが込み上げてきてな。"
"61080-33-スバル" = "……見ないうちに、他人の神経を逆なでする腕を上げましたね。"
"61080-34-スバル" = "前から、そういうところはありましたけど。"
"61080-35-サオリ" = "そうか？それは謝罪させてくれ。#n過去をなかったことにはできないが――"
"61080-36-スバル" = "そういうところだって言ってるんです！！！"
"61080-37-スバル" = "すぅ……はぁ……。"
"61080-38-スバル" = "……話を戻しましょう。#n仕事と言っていましたが……アリウスに、何の用ですか。"
"61080-39-サオリ" = "それは――"
"61080-40-サオリ" = "みんなで「試験」を受けるためだ！"
"61080-41-スバル" = "……はい？"
"61080-42-不安げなアリウスの生徒A" = "な、なに言ってんの、あれ……。#nし、け、ん……試験……？今の、聞き間違いじゃないよね？"
"61080-43-不安げなアリウスの生徒B" = "私もそう聞こえたよ。たぶん合ってると思う。"
"61080-44-不安げなアリウスの生徒A" = "意味わかんない。外の空気を吸いすぎて変になったんじゃないの……？"
"61080-45-スバル" = "ちょ、ちょっと待ってください！話についていけないんですけど……。#nえっと……え？しけん？それは、つまり……。"
"61080-46-スバル" = "……。"
"61080-47-スバル" = "……やっぱり、理解できません！！"
"61080-48-アツコ" = "ふっ、ふふっ……。"
"61080-49-アツコ" = "ミサキ？"
"61080-50-ミサキ" = "ごめん、姫。でも、リーダーの気持ちもちょっと分かるというか。"
"61080-51-ミサキ" = "だって……ふふっ、こんなの笑うしかないでしょ。"
"61080-52-ミサキ" = "あのスバル先輩が状況を飲み込めてないし。"
"61080-53-サオリ" = "ふむ……伝え方が悪かったか……。"
"61080-54-サオリ" = "「結論ファースト」と言ってな、結論から先に述べると会話のテンポが良くなる……らしいのだが。"
"61080-55-サオリ" = "いや、違うな。状況と文脈を読まずにやるものではないな。"
"61080-56-スバル" = "気づいたなら、改めて、ちゃんと、説明してもらえますか！？"
"61080-57-サオリ" = "うむ……。"
"61080-58-サオリ" = "つまり、だ。"
"61080-59-サオリ" = "……。"
"61080-60-サオリ" = "みんなで「試験」を受けようという話だ。"
"61080-61-スバル" = "あなたバカですか！？"
"61080-62-サオリ" = "だが、これ以外に説明することが無いんだ。"
"61080-63-サオリ" = "ほら、試験は持ってきている。"
"61080-64-スバル" = "だから！どうして！私たちがそんな試験を受けなきゃいけないんですか！？"
"61080-65-サオリ" = "うーん……。"
"61080-66-サオリ" = "生徒だから？"
"61080-67-スバル" = "……どこまでコケにするんですか、[ruby=じょうまえ]錠前[/ruby]サオリ！"
"61080-68-スバル" = "先輩があんな風になるの、久しぶりに見た……。"
"61080-69-アリウスの生徒たち" = "昔からだよ、あの2人。相性最悪ってやつ。"
"61080-70-ヒヨリ" = "だ、大丈夫なんでしょうかぁ……。"
"61080-71-ヒヨリ" = "別にいいんじゃない。間違ったこと言ってるわけでもないし。"
"61080-72-ヒヨリ" = "むしろ、もっとやれって言いたいくらいだけど。"
"61080-73-アツコ" = "うん、私も賛成。がんばれ、サッちゃん。"
"61080-74-ヒヨリ" = "ひ、ひいいいぃぃ……。"
"61080-75" = "[ns]\"少しだけ、助け舟を出そうかな。\""
"61080-76-サオリ" = "せ、先生……？"
"61080-77-サオリ" = "……あなたが、シャーレの「先生」ですか。"
"61080-78-スバル" = "初めまして。そして……。"
"61080-79-スバル" = "ようこそ、アリウスへ。[USERNAME]先生。"
"61080-80-スバル" = "まあ、今のところは、ですが。"
"61080-81" = "[s]\"サオリから、スバルの話は聞いてるよ。\""
"61080-82-スバル" = "……は？どうして彼女から？"
"61080-83" = "[s]\"も、もちろん、他のスクワッドの子たちからもね！\""
"61080-84-スバル" = "……なぜよりによって。"
"61080-85-スバル" = "……まあいいでしょう。そんなことより。"
"61080-86-スバル" = "突然来て、試験を受けろと言われているものですから。#nこちらとしては納得いたしかねます。"
"61080-87" = "[s]\"前提の話をしたいんだ。生徒の本分は勉強だからね。\""
"61080-88-スバル" = "それが、アリウスにも通用するとでも？"
"61080-89" = "[s1]\"アリウスも学園だよ。\"\n[s2]\"みんなは、アリウス分校の「生徒」なんだから。\""
"61080-90-スバル" = "……！"
"61080-91-スバル" = "わ、私たちが……[ruby=・   ・]生徒[/ruby]？"
"61080-92-不安げなアリウスの生徒B" = "い、一応はそうなる……よね？"
"61080-93-不安げなアリウスの生徒B" = "キヴォトスは学園都市で、アリウスもその一部だし……。"
"61080-94-不安げなアリウスの生徒A" = "で、でも……。"
"61080-95-不安げなアリウスの生徒B" = "わかってる。私たちみたいなのが……。"
"61080-96-不安げなアリウスの生徒B" = "他の子みたいに、「生徒」でいられるのかって……。"
"61080-97-スバル" = "……そもそも、すべての生徒に勉強が必要とは限りません。"
"61080-98-スバル" = "私たちが出せる答えは、以上です。"
"61080-99" = "[s]\"……そうだね。それも、答えとしては正しいよ。\""
"61080-100-スバル" = "はい……？"
"61080-101" = "[s3]\"でも、一旦考えてみるのはどうかな？\"\n[s4]\"まずは一回、やってみる。それでも無意味だと思ったなら。\"\n[s5]\"そのときは、全部やめればいい。\""
"61080-102-スバル" = "……どうせ結果は変わりませんよ。#nなのに、どうして面倒な過程を踏まなきゃいけないんですか？"
"61080-103-スバル" = "経験してないことに挑戦するのも青春……？"
"61080-104-スバル" = "……とてもきれいな理想論ですね。"
"61080-105" = "[s6]\"でも、「先生」はね。\"\n[s7]\"夢見がちなくらいが、ちょうどいいんだよ。\""
"61080-106-スバル" = "なんですか、それ……。"
"61080-107-スバル" = "はぁ……分かりました。"
"61080-108" = "[s]\"じゃあ……！\""
"61080-109-スバル" = "はい。"
"61080-110-スバル" = "私たちの議論は平行線だと、よく分かりました。"
"61080-111-スバル" = "……露骨にガッカリした顔をしないでくださいよ。大人なんですから。"
"61080-112-スバル" = "とにかく、そういうことですので。#nこちらから、「試験」をさせていただきます。"
"61080-113-スバル" = "あなた方が――アリウスに入る資格があるかどうかを。"
"61080-114" = "[ns]\"え……！？\""
"61080-115-スバル" = "スクワッド……アリウスの裏切り者――！"
"61080-116-スバル" = "私たちの認識は……あの時からずっと変わっていない。#n再びアリウスに足を踏み入れたいと言うのなら……存在価値を証明してもらいます！"
"61080-117-スバル" = "――セーフティ、解除！"
"61080-118-サオリ" = "……やはり、こうなるか。"
"61080-119" = "[ns]\"みんな……何してるの！？\""
"61080-120-ヒヨリ" = "心配無用だ。アリウスではよくあることだからな。"
"61080-121-ヒヨリ" = "これがアリウスのやり方で、私たちはずっとこうして生きてきたんだ。"
"61080-122-ヒヨリ" = "子どもはケンカしながら育つって言うでしょ？"
"61080-123-ヒヨリ" = "え？私が言うと、他の意味に聞こえるって？#nふふっ、褒め言葉として受け取っておくね。"
"61080-124-ヒヨリ" = "なんだか懐かしいですね……戻ってきた実感が、ちょっと湧いてきました。"
"61080-125-ヒヨリ" = "アツコ、マスクをしなくて大丈夫なのか？"
"61080-126-ヒヨリ" = "うん。あれつけてると話しづらいし。"
"61080-127-ヒヨリ" = "それに……私はもう、守られてばかりじゃないよ。"
"61080-128-ヒヨリ" = "……分かった。"
"61080-129-ヒヨリ" = "先生は少しでも安全な場所に下がって。"
"61080-130-ヒヨリ" = "それから……指揮をお願い。"
"61080-131" = "[ns]\"もう、戦うしかないんだね……。\""
"61080-132-スバル" = "ここはアリウス！"
"61080-133-スバル" = "ここはアリウス！"
"61080-134-スバル" = "己の意見は、己の力で押し通せ！"
"61080-135-スバル" = "己の力で押し通せ！"
"61080-136-スバル" = "力なき正義は、空虚な叫びに過ぎず！"
"61080-137-スバル" = "己が人生に責任を持てるのは、己を置いて他にいない！！"
"61080-138-アリウスの生徒たち" = "ウオオオオオオ！！"
"61080-139-サオリ" = "……。"
"61080-140-サオリ" = "アリウススクワッド。"
"61080-141-サオリ" = "応戦準備！"
