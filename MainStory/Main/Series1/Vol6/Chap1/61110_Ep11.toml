[translation]
"61110-1" = "第11話;校外学習（１）"
"61110-2" = "[ns1]\"それじゃあ今日も授業を始めるよ！\"\n[ns2]\"楽しく勉強しようね！\""
"61110-3-ヒヨリ" = "楽しいかどうかは人によるでしょ……。"
"61110-4-ヒヨリ" = "私……がんばって、ちょっとだけ勉強してきました……！"
"61110-5" = "[s]\"おっ、予習してきて偉いね！\""
"61110-6-ヒヨリ" = "えへへ……頭……撫でてもらっちゃいました……。"
"61110-7-ヒヨリ" = "でも、明日も同じように過ごせる保証なんて……#nどこにもないんですよね……。"
"61110-8-ヒヨリ" = "今日東から日が昇ったからといって……#n明日も同じように東から昇るとは限らない……みたいに……。"
"61110-9" = "[s3]\"よく勉強してるね。\"\n[s4]\"それが懐疑的経験論ってやつだよ。\""
"61110-10-ヒヨリ" = "えへへ……先生がくれた本で勉強したので……！"
"61110-11-アツコ" = "これから小テストをやるよ。"
"61110-12-アリウスの生徒A" = "え……小……テスト？"
"61110-13-アリウスの生徒B" = "小テストって……テストってこと……？"
"61110-14-サオリ" = "そうだ。簡略化されたテストだと思ってくれ。"
"61110-15-アツコ" = "今から問題を読み上げるから、答えをノートに書いてね。"
"61110-16-アリウスの生徒A" = "えっと……？たしか習ったはずなんだけど……。"
"61110-17-アリウスの生徒B" = "うぅ……思い出せそうで思い出せない……。"
"61110-18-アリウスの生徒C" = "あ、そうだ！分からなかったら聞けばいいんだっけ。ねえ、答え教えて。"
"61110-19-アリウスの生徒C" = "それ？えーと、たしか……。"
"61110-20-ミサキ" = "そこ、カンニング禁止。"
"61110-21-アリウスの生徒A" = "カンニング……って何ですか？"
"61110-22-アツコ" = "試験中にズルをすることだよ。他の人に聞くのもダメ。"
"61110-23-アリウスの生徒B" = "でも分からない時は聞けって……！"
"61110-24-ミサキ" = "それは勉強の時の話で……。"
"61110-25-アリウスの生徒C" = "勉強とテストって違うの！？最初に言ってよ！"
"61110-26-ミサキ" = "いや、自分の学力を確認するものだからちょっと考えたら分かるでしょ……#nはぁ、心配になってきたな……。"
"61110-27" = "[ns]\"……今日さ。\""
"61110-28" = "[ns]\"良い天気だよね。\""
"61110-29-スバル" = "晴れ間一つない曇り空ですけど。"
"61110-30" = "[ns5]\"感じ方は人それぞれだから……。\"\n[ns6]\"私は良い天気だなって思うよ。\""
"61110-31-スバル" = "そうですか……。"
"61110-32-スバル" = "それで、何か用ですか？"
"61110-33" = "[s]\"天気が良いと、何かもったいなくてさ。\""
"61110-34-スバル" = "すみません、話の流れがいまいち――"
"61110-35" = "[ns]\"よし、今日は校外学習に行こうか。\""
"61110-36-スバル" = "校外学習……？"
"61110-37-スバル" = "……本当に、これで良かったんでしょうか。"
"61110-38-スバル" = "……はい？"
"61110-39-スバル" = "教室では学べないものがある……？#n授業中にやることは、すべて授業の延長……？"
"61110-40-スバル" = "ずいぶん都合の良い説明ですね。"
"61110-41" = "[s]\"実際にその通りだからね。\""
"61110-42-スバル" = "なんだか釈然としませんが……。"
"61110-43" = "[s]\"これが、大人の特権ってやつだよ。\""
"61110-44-アリウスの生徒A" = "先輩は座らないんですか？ずっと立ってますけど……。"
"61110-45-アリウスの生徒B" = "先生もです。足、痛くないですか？"
"61110-46-スバル" = "ありがとうございます。私は大丈夫です。"
"61110-47-マイア" = "……なんだか、不思議な気分です。"
"61110-48-マイア" = "また「外」に出るなんて……。"
"61110-49-マイア" = "……。"
"61110-50-マイア" = "でも、前とは全然違う感じで……。"
"61110-51-マイア" = "うっ……！"
"61110-52-マイア" = "大丈夫ですか？"
"61110-53-マイア" = "だ、大丈夫です。#n少し、昔のことを思い出しちゃって……え、えへへ……。"
"61110-54-スバル" = "……。"
"61110-55" = "[s]\"昔のこと？\""
"61110-56-マイア" = "……。"
"61110-57-スバル" = "何でもありませんよ、先生。"
"61110-58-スバル" = "……。"
"61110-59-スバル" = "昨晩、マイアが悪夢を見たそうでして。"
"61110-60" = "[s]\"でも……。\""
"61110-61-スバル" = "ご心配には及びません。"
"61110-62" = "[ns]\"本当に？\""
"61110-63-スバル" = "はい。"
"61110-64-スバル" = "この子たちの相談にのるのは、もともと私の役目でしたから。"
"61110-65-マイア" = "は、はい……大丈夫、ですから……。"
"61110-66-アリウスの生徒A" = "それで、先生。今日はどこに行くんですか？"
"61110-67-アリウスの生徒C" = "何がなんだか全然分からなくて……。"
"61110-68-スバル" = "……。"
"61110-69-スバル" = "すべて先生が上手くやってくれるんですよね？"
"61110-70-スバル" = "「校外学習」に行こうと言い出したのも、先生ですし。"
"61110-71" = "[s]\"任せてよ！\""
"61110-72-スバル" = "あの建物……ガラスでできてるのかな？#nすっごくキラキラしてる……。"
"61110-73-スバル" = "私たちの学園であんなの建てても、すぐ割れたり汚したりしちゃいそう……。"
"61110-74-スバル" = "スクワッドの皆さんは、こんなのを毎日のように見てたんでしょうね……。"
"61110-75-スバル" = "一緒に来ればよかったのに。"
"61110-76-スバル" = "仕方ありません。アリウスを空けるわけにはいきませんから。"
"61110-77-スバル" = "でも、スクワッドの皆さんに任せても大丈夫なんでしょうか……？"
"61110-78-スバル" = "……。"
"61110-79-スバル" = "それも……先生が責任をもってくれます。"
"61110-80-スバル" = "そうですよね？"
"61110-81" = "[s]\"任せて！\""
"61110-82-スバル" = "……。"
"61110-83-スバル" = "はぁ……。"
"61110-84" = "（スクワッドは「お留守番」という名目でアリウスに残っている）"
"61110-85" = "（しかし、校外学習に同行しなかった理由は別にあった）"
"61110-86-ミサキ" = "私たちが指名手配中なの忘れてない？"
"61110-87-ミサキ" = "存在を晒すのは、できるだけ避けたいんだ。#n自ずと、自由に動ける範囲は限られてしまう。"
"61110-88-ミサキ" = "先生と校外学習、行きたかったな……。"
"61110-89-ミサキ" = "でも、仕方ないですよね……大丈夫です。#nこういうの、慣れてますから……。"
"61110-90-スバル" = "私たちのほうが自由に動けるというのも、皮肉な話ですね。"
"61110-91-スバル" = "ところで……いつまでそんな風に、隠れて生き続けるつもりなんですか？"
"61110-92-ミサキ" = "ケンカ売ってる……？"
"61110-93-サオリ" = "……。"
"61110-94-サオリ" = "やめろ、ミサキ。"
"61110-95-ミサキ" = "……チッ。"
"61110-96-スバル" = "スクワッドのことを考えていたんですか？"
"61110-97" = "[s]\"！？\""
"61110-98-スバル" = "どうして分かったのか、という顔をされていますね。"
"61110-99-スバル" = "先生は顔に出やすいんですよ。特に、こういう時は。"
"61110-100-スバル" = "……。"
"61110-101-スバル" = "一つ、お聞きしてもいいですか？"
"61110-102-スバル" = "先生にとって、スクワッドはアリウスですか？#nそれとも……。"
"61110-103-スバル" = "いえ、特に意味はありません。ただ、ふと気になっただけです。"
"61110-104" = "[s]\"それは……。\""
"61110-105-通りすがりの通行人" = "おや、仲の良さそうな先生たちだ。#n生徒の面倒を見るのは大変だろうに、ご苦労さんだねぇ。"
"61110-106-スバル" = "はい……？"
"61110-107-スバル" = "はい！？"
"61110-108-スバル" = "なっ、何を言ってるんですか！？"
"61110-109-通りすがりの通行人" = "なるほど……君は教育実習生なのかな？#n先生の仕事ぶりを見て、よく学ぶんだよ。"
"61110-110-スバル" = "私はそもそも先生では……！ちょっと！先生も一緒に訂正してください！"
"61110-111-スバル" = "って、なんで優しく微笑んでいるんですか！"
"61110-112-通りすがりの通行人" = "はっはっは、初々しくていいこった。仕事の邪魔をして悪かったね。"
"61110-113-通りすがりの通行人" = "本当に違うんですってば！！"
"61110-114-アリウスの生徒A" = "……。"
"61110-115-アリウスの生徒B" = "……。"
"61110-116-アリウスの生徒A" = "すっ、すごい……！"
"61110-117-アリウスの生徒B" = "壊れた建物が一個もないよ！？"
"61110-118-アリウスの生徒B" = "いつもは、ボロボロなのをなんとか補修しながら使ってるのに……。"
"61110-119-アリウスの生徒B" = "崩れ落ちるまで、何年使い続けられるんだろう……。"
"61110-120" = "[s]\"さあ、みんなで道路を渡るよ！\""
"61110-121-アリウスの生徒A" = "あっちに行くんで――ぐえっ。"
"61110-122-アリウスの生徒D" = "先生！なんで急に掴むんですか！"
"61110-123" = "[s]\"赤信号のときは渡っちゃダメだよ！\""
"61110-124-アリウスの生徒A" = "あかしんごう……？"
"61110-125-アリウスの生徒B" = "ここではそうしないといけないんですね……。"
"61110-126-アリウスの生徒C" = "でも私たち、ちょっとやそっとじゃケガしないですよ？#n結構頑丈ですし……。"
"61110-127-アリウスの生徒D" = "えっ？車とか、運転してる人のことも考えろって？#n分かるような……分からないような……。"
"61110-128-アリウスの生徒A" = "ここ……プールって言うんですか……？"
"61110-129-アリウスの生徒B" = "何をするところなんだろう……。"
"61110-130-アリウスの生徒C" = "えっ！？泳ぐために使う施設なんだって！"
"61110-131-アリウスの生徒D" = "きれいな水がこんなに……飲み放題じゃん……！"
"61110-132-アリウスの生徒D" = "えっ？先生、どうしてそんな顔を……？"
"61110-133" = "[s]\"プールの水はね、飲んじゃダメなんだよ……。\" "
"61110-134-アリウスの生徒A" = "こんなにあるのに！？"
"61110-135-アリウスの生徒A" = "飲んでもお腹を壊さなさそうだし、なんか新鮮なにおいもするし……。"
"61110-136-アリウスの生徒B" = "え？これは塩素っていう消毒の匂いなの？"
"61110-137-アリウスの生徒B" = "水って、消毒するんですか！？"
"61110-138-アリウスの生徒A" = "高い！！！！"
"61110-139-アリウスの生徒A" = "空を見て！すっごく青いよ……！"
"61110-140-アリウスの生徒A" = "あれが川なんだね……。わぁ……。"
"61110-141-アリウスの生徒A" = "じゃあもしかして、あれが橋なのかな？どうやって作ったんだろう……。"
"61110-142" = "[s7]\"周りに迷惑はかけないように気をつけようね。\"\n[s8]\"あんまり大きな声で騒がないようにしようね。\""
"61110-143-アリウスの生徒A" = "は～い！"
"61110-144-アリウスの生徒A" = "先生、どうしたんですか？今度は泣きそうな顔して。"
"61110-145-アリウスの生徒A" = "素直に言うこと聞いてくれて、すごく嬉しい……？"
"61110-146-アリウスの生徒A" = "そういえば、不思議ですね……。#n前は大人の言うことなんて、聞きたくもなかったのに……。"
"61110-147-アリウスの生徒A" = "だって、あの頃は殴るか脅すかしかされなかったから……。"
"61110-148-アリウスの生徒C" = "これ知ってる！ハンバーガーだよね！"
"61110-149-アリウスの生徒D" = "あっ！食べたことある！先輩がたまに買ってきてくれるやつだ！"
"61110-150-アリウスの生徒C" = "味は同じはずなのに……なんか違う感じがするね。なんでだろう……？"
"61110-151-アリウスの生徒D" = "食べる場所が違うからかな……？"
"61110-152-アリウスの生徒C" = "うん、それはあるかもね。"
"61110-153" = "[ns9]\"ちょっと待って！ストップ！\"\n[ns10]\"ディスペンサーに直接口をつけちゃダメだよ！\" "
"61110-154-アリウスの生徒A" = "自由に飲んでいいって言ってたのに……。"
"61110-155-アリウスの生徒A" = "……他の人も使うから、ってことですか？"
"61110-156-アリウスの生徒A" = "……。"
"61110-157-アリウスの生徒A" = "言われてみれば……そうかも……。"
"61110-158-アリウスの生徒B" = "えっ、ちゃんと並べて偉いね……って？"
"61110-159-アリウスの生徒B" = "そんな当たり前のことを褒められると……ちょっと恥ずかしいです。"
"61110-160-アリウスの生徒A" = "だって逆に、配給の時にちゃんと並ばなかったり、割り込んだりすると……#n気絶するまで罰を受けてたから……。"
"61110-161-アリウスの生徒C" = "せ、先生……？ここって、何なんですか……？"
"61110-162-アリウスの生徒C" = "すっごくうるさくて、ピカピカしてて……うわぁぁぁ……。"
"61110-163-アリウスの生徒D" = "ゲームセンター……？って……なんですか？"
"61110-164-アリウスの生徒D" = "……。"
"61110-165-アリウスの生徒D" = "う、嘘つかないでください先生！#n娯楽のための電子装置なんて、あるわけないじゃないですか！"
"61110-166-アリウスの生徒C" = "え……？ここにあるのが、全部……？"
"61110-167-アリウスの生徒D" = "ちょっ、ちょっと待ってください！これ、一回遊ぶごとにお金がかかるんですか！？"
"61110-168-アリウスの生徒D" = "貴重なお金を、こんなことに使うなんて……いいんでしょうか……？"
"61110-169" = "[s]\"今日は私がお金を出すから、気にせず遊んでいこう！\""
"61110-170-アリウスの生徒C" = "ほんとですかっ！？"
"61110-171-スバル" = "私も正直、理解しかねるんですが……#nこれ、本当に校外学習なんですか……？"
"61110-172-スバル" = "……はい？関数の概念を身体で学ぶ授業……？#nえっと、何を言ってるんですか？"
"61110-173-スバル" = "え？関数とはインプットに対してアウトプットが定まる仕組みのことだから……？#nだから、なんなんです……？"
"61110-174-スバル" = "プレイヤーの操作がもたらす結果を、直感的に体験できるゲームセンターこそ――"
"61110-175-スバル" = "関数の概念を「身体で学ぶ」のに最適な場所……と？"
"61110-176-スバル" = "……。"
"61110-177-スバル" = "それは独創的で、斬新な……でたらめですね……。"
"61110-178-スバル" = "え？世の中はこんなもんじゃない……？"
"61110-179-スバル" = "……。"
"61110-180-スバル" = "それなら、知らないままの方が幸せな気がしますね……。"
"61110-181-アリウスの生徒たち" = "うわぁぁぁ！？何これ！？信じられない！！"
"61110-182-アリウスの生徒たち" = "もう一回！あと一回だけ！！！"
"61110-183" = "[ns]\"つ、疲れた……。\""
"61110-184-スバル" = "お疲れ様でした。"
"61110-185-スバル" = "……ひとまずは。"
"61110-186-スバル" = "それで、この公園にはどんな学びが？"
"61110-187-スバル" = "「休むときはしっかり休む」……たしかに、必要なことですね……。"
"61110-188-スバル" = "アリウスの「訓練」でも、休憩時間だけは確保していましたから。"
"61110-189" = "[ns]\"みんな、元気だなぁ……。\""
"61110-190-スバル" = "先生も混ざってきてはいかがですか？"
"61110-191-スバル" = "まぁ、はい……無理だと分かったうえで言っていますが。"
"61110-192-スバル" = "え、私ですか……？"
"61110-193-スバル" = "……。"
"61110-194-スバル" = "……はい、私もそれなりに楽しんでますよ。"
"61110-195-スバル" = "今は、ですが。"
"61110-196" = "（短い沈黙が訪れた）"
"61110-197" = "（何を言うでもなく、隣に並んで、空を見上げていた）"
"61110-198-スバル" = "空……青いですね。"
"61110-199-スバル" = "土地柄、アリウスの空は灰色が多いんです。"
"61110-200-スバル" = "……。"
"61110-201-スバル" = "先生、あの……。"
"61110-202-スバル" = "もし仮に、誰かが……。"
"61110-203-スバル" = "本当に、本当に、本当に……#n自分の人生を諦めたいと願っていたら。"
"61110-204-スバル" = "その人を止める術はあるのでしょうか……。"
"61110-205" = "[ns]\"……！？\""
"61110-206-スバル" = "ふふっ、すごい表情をされますね。"
"61110-207-スバル" = "急にどうしてこんな話をするのかって？#n……ただなんとなく、ですかね。"
"61110-208-スバル" = "話を振るのに、特別な理由なんて必要ないでしょう？"
"61110-209-スバル" = "え？うーん、そうですね……。"
"61110-210-スバル" = "少なくとも、私は真剣です。"
"61110-211-スバル" = "なので先生も、真剣に答えていただけると嬉しいのですが。"
"61110-212-スバル" = "ほら、これも「授業」だと思ってください。"
"61110-213" = "（一瞬、誰かの顔が頭をよぎった）"
"61110-214" = "（授業の一環として、ちゃんと向き合うことにした）"
"61110-215" = "[ns11]\"正直に言えば――\"\n[ns12]\"そんなもの、ないと思う。\""
"61110-216-スバル" = "は……？"
"61110-217-スバル" = "ちょっと待ってください、それが教育者の言うことですか！？"
"61110-218" = "[s]\"返答に困ってる私が見たかったのかな？\""
"61110-219-スバル" = "え？い、いえっ！別にそんなつもりじゃ……。"
"61110-220-スバル" = "……。"
"61110-221-スバル" = "まったく無かったわけでも、ないですけど……。"
"61110-222-スバル" = "で、でも！"
"61110-223" = "[s13]\"そういうのは普通、「幸せ」に関する話だから。\"\n[s14]\"幸せでなくとも生きるべきか、とかね。\""
"61110-224-スバル" = "そう……ですね。"
"61110-225-スバル" = "え……？#n「幸せ」は、ある意味で理想郷みたいなもの……？"
"61110-226-スバル" = "理想郷は、いつか辿り着くべき場所ではあるけど――"
"61110-227-スバル" = "今すぐには……なかなか届かない。#n幸せになるために生きるのも、同じこと……。"
"61110-228-スバル" = "……。"
"61110-229-スバル" = "では、現実は？"
"61110-230" = "[s15]\"生きるためには、幸せが必要なんだと思う。\"\n[s16]\"でも、なかなか手に入るものじゃない。\""
"61110-231-スバル" = "……本当ですね。"
"61110-232-スバル" = "努力しても、必ずしも報われるとは限りませんから。"
