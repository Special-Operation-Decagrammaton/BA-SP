[translation]
"61050-1" = "第5話;謝罪"
"61050-2-ミサキ" = "スポンサーって……あの[ruby=きりふじ]桐藤[/ruby]ナギサ……？"
"61050-3-ミサキ" = "先生……なんでこんな大事なことを黙ってたわけ？"
"61050-4-ヒヨリ" = "うわぁぁぁぁぁぁああん！もうダメです！おしまいです！#nこのままトリニティに連れていかれて、爪を剥がされるんです……！"
"61050-5-ナギサ" = "いえ……今はもう、そういうのはしておりませんので……。"
"61050-6-ミサキ" = "今は……？それ、やってたことはあるってことでしょ？#nアリウス外典にも、それっぽい記述はあったけど……。"
"61050-7-サオリ" = "せ、先生……？"
"61050-8-アツコ" = "先生？"
"61050-9" = "[ns1]\"みんな、落ち着いて。\"\n[ns2]\"私もナギサも、怪しいこと考えてるわけじゃないから。\""
"61050-10-ミサキ" = "全然説得力ないんだけど！"
"61050-11-ヒヨリ" = "うわぁぁぁぁぁぁああん！"
"61050-12-ナギサ" = "コホン、では改めてご挨拶を。こんにちは、アリウススクワッドの皆さん。"
"61050-13-ナギサ" = "ティーパーティーのホスト、[ruby=きりふじ]桐藤[/ruby]ナギサと申します。"
"61050-14-アツコ" = "こんにちは、ナギサさん。#nアリウススクワッド[ruby=はかり]の秤ア[/ruby]ツコだよ。"
"61050-15-ナギサ" = "よろしくお願いいたしますね、アツコさん。"
"61050-16-ミサキ" = "[ruby=いましの]戒野[/ruby]ミサキ。"
"61050-17-ヒヨリ" = "つ、[ruby=つちなが]槌永[/ruby]ヒヨリ……です。えへへ。"
"61050-18-サオリ" = "……[ruby=じょうまえ]錠前[/ruby]サオリだ。"
"61050-19-サオリ" = "私のことは、よく知っているだろう？"
"61050-20-ナギサ" = "はい。サオリさんだけでなく、皆さんのことも。#n少なくとも書類上では、すべて把握しております。"
"61050-21-ナギサ" = "ですが皆さんも、私の[ruby=いきさつ]経緯[/ruby]についてはご存じですよね。"
"61050-22-ミサキ" = "……なんでそういう言い方するかな。"
"61050-23-ヒヨリ" = "ひ、ひいぃ……。"
"61050-24-ヒヨリ" = "ミサキ、もう少し話を聞こう？#n――サオリもだよ。"
"61050-25-サオリ" = "……分かった。"
"61050-26-サオリ" = "……気をつけよう。"
"61050-27-ナギサ" = "少し場を移しましょうか。皆さん、中へどうぞ。"
"61050-28-ヒヨリ" = "な、中って……船の中ですか……？"
"61050-29-ナギサ" = "はい。今日一日貸し切っていますので、他人の目を気にする必要はありませんよ。"
"61050-30-ミサキ" = "！？"
"61050-31-サオリ" = "！？"
"61050-32-アツコ" = "……。"
"61050-33" = "[ns3]\"クルーズ船を貸し切りにしたの！？\"\n[ns4]\"さすがに無理しすぎなんじゃ……。\""
"61050-34-ナギサ" = "停泊させたまま施設と空間を借りているだけですから。"
"61050-35-ナギサ" = "この程度は、通常の支出の範囲内ですのでお構いなく。#nさあ、どうぞ。"
"61050-36-ヒヨリ" = "こ、こわい……こわすぎます……これがお金持ち……。#nこれ……夢じゃないですよね……？"
"61050-37-ミサキ" = "スケールが違いすぎる……。"
"61050-38-サオリ" = "こういう時はどうすれば……。"
"61050-39" = "[ns]\"とりあえず……ご厚意ってことにしておこうか……。\""
"61050-40-アツコ" = "そうだね。ほら、早く行かないとナギサさんに置いていかれちゃう。"
"61050-41-アツコ" = "え？落ち着いてる？私が？"
"61050-42-アツコ" = "ふふっ、先生まであたふたしてるのを見たら、本当に想定外のことなんだなって思えたんだ。"
"61050-43-アツコ" = "それなら、流れに身を任せるのが一番でしょ？"
"61050-44" = "[ns]\"アツコを見習わせてもらうよ……。\""
"61050-45-ヒヨリ" = "わ、わあぁ……。"
"61050-46-ナギサ" = "さて、本題に入る前に……お腹は空いていませんか？このレストランにメニューはありませんので、何でもお好きなものをご注文ください。"
"61050-47-ミサキ" = "どういう意味……？メニューがないのに、どうやって注文するの？"
"61050-48" = "[ns5]\"違うよ……これは……。\"\n[ns6]\"どんな注文にも応えられるってことだよ……！\""
"61050-49-サオリ" = "そんなことが本当に可能なのか……？"
"61050-50-ミサキ" = "これが「最後の晩餐」じゃないといいけど。#nほんと、何なんだか……。"
"61050-51-ナギサ" = "い、いえ、そんなつもりでは……。"
"61050-52-アツコ" = "ごめんなさい。私たち、こういう場所には慣れてないんだ。"
"61050-53-アツコ" = "だから、ナギサさんにお任せしてもいい？"
"61050-54-ナギサ" = "ええ、もちろんです。マスター、よろしいですか？"
"61050-55-マスター" = "ご希望をなんなりと。"
"61050-56-ナギサ" = "それでは――"
"61050-57" = "（しばらくすると、コース料理が次々と運ばれてきた）"
"61050-58" = "（ナギサは手慣れた様子で料理を楽しんでいたが、慣れていない私たちは、味がよく分からなくなっていた）"
"61050-59" = "（……一人を除いて）"
"61050-60-ヒヨリ" = "お、おいひぃでふぅ～……！んふ～～！"
"61050-61-アツコ" = "ヒヨリ？食べながらしゃべるのは……ちょっとお行儀が悪いよ……？"
"61050-62-ヒヨリ" = "も、もぐもぐっ、ごっくん！す、すみません……！#nでも、すっごく美味しいんです……！こんなの初めてです！"
"61050-63-ナギサ" = "ええ、たくさん召し上がってくださいね。私も嬉しいです。"
"61050-64-ナギサ" = "お食事はいかがでしたか？"
"61050-65" = "[s]\"すごかった……。\""
"61050-66-サオリ" = "……ごちそうさまでした。"
"61050-67-サオリ" = "私たちだけでこんな贅沢をしてしまっていいのだろうか……。"
"61050-68-ヒヨリ" = "あ、あの……少しだけ、持って帰ったりとか……できますか……？"
"61050-69-アツコ" = "気持ちは分かるけど、ここは我慢だよ。"
"61050-70-ヒヨリ" = "うぅぅ……は、はいぃ……。"
"61050-71-ナギサ" = "では、食後のティータイムをご一緒にいかがですか？"
"61050-72-ナギサ" = "私が贔屓にしているトワイライト社の茶葉をご用意しました。#n香り高いのが特徴でして。"
"61050-73-マスター" = "お淹れしましょうか？"
"61050-74-ナギサ" = "いえ、結構です。#n皆さん。準備しますので、少々お待ちくださいね。"
"61050-75" = "（ナギサは見事な手際で紅茶を淹れはじめた）"
"61050-76" = "（芳しい香りが部屋全体を優しく包んだ）"
"61050-77-ナギサ" = "お待たせしました。粗茶ですが、どうぞ召し上がってください。"
"61050-78-ヒヨリ" = "えへへ……あったかくて、おいしいです……。#nうぅぅ……昔の「ウォータータイム」を思い出しますね……。"
"61050-79-ヒヨリ" = "……あったね。そんなのも。"
"61050-80-ナギサ" = "ウォータータイム、ですか……？"
"61050-81-ヒヨリ" = "アリウスだと、訓練の優秀者には[ruby=・   ・   ・   ・]温かい水[/ruby]が支給されてたの。"
"61050-82-ヒヨリ" = "ちょうど今くらいの時間だったはず。"
"61050-83" = "[ns]（温かい……水？）"
"61050-84-ヒヨリ" = "あ、あのときは……一口ずつ大事に……大事に飲んでましたね……。"
"61050-85-ヒヨリ" = "ただのお湯だったのに……何よりも美味しくて……。#n不思議ですよね……。"
"61050-86-ヒヨリ" = "あっ！もちろん、ナギサ……さん……？#nナギサ様……？のお茶の方が、美味しいです！"
"61050-87-ナギサ" = "好きに呼んでいただいて構いませんよ。"
"61050-88-ナギサ" = "皆さんをお呼び立てしているのは、こちらなのですし。"
"61050-89-ミサキ" = "……それ、どういうこと？#nこの集まりは先生の発案じゃなかったの？"
"61050-90-ナギサ" = "……。"
"61050-91-ミサキ" = "この話……編入生が先生に相談したのがきっかけだったんでしょ？#nなんでそれをあなたが知ってるわけ。"
"61050-92" = "[ns]\"そ、それについてなんだけど……。\""
"61050-93-ナギサ" = "いえ、先生。これは私からお話しすべきことだと思っています。"
"61050-94-ナギサ" = "少なくとも、そのためにこの席を設けていただいたのですから。"
"61050-95-ナギサ" = "どこからお話ししましょうか……。"
"61050-96-ナギサ" = "誤解を恐れずに言うならば、トリニティの情報部は優秀なので。#nご理解いただけますでしょうか。"
"61050-97-ミサキ" = "……編入生が先生に会った時点で、報告は上がってたんだ。"
"61050-98-ミサキ" = "それ、監視がついてるってことでいいの？"
"61050-99-ナギサ" = "それは……。"
"61050-100" = "[ns7]\"ここから先は、私が説明するね。\"\n[ns8]\"ちょっと早い気もするけど、話がこじれる前にね。\""
"61050-101-ナギサ" = "せ、先生？"
"61050-102" = "[s9]\"こういうのは、本人が言うとかえって逆効果だから。\"\n[s10]\"話は聞いてるし、私もちゃんと事実確認したからね。\""
"61050-103-ナギサ" = "……お願いします。"
"61050-104" = "[ns11]\"編入生に、担当の生徒がついてるのは事実だよ。\"\n[ns12]\"「監視」じゃなくて、「サポート役」としてね。\""
"61050-105" = "[ns13]\"それに、私に相談したことは――\"\n[ns14]\"編入生の子たちが自分で報告したんだよ。\""
"61050-106-ミサキ" = "……それ、信じられると思う？"
"61050-107-ナギサ" = "皆さんがトリニティを……それも、ティーパーティーである私を信用できないことは理解しています。ですが……。"
"61050-108" = "[ns]\"せめて私のことは、信じてくれないかな？\""
"61050-109-ヒヨリ" = "……。"
"61050-110-ヒヨリ" = "わ、私は信じます……先生、ですから……。"
"61050-111-サオリ" = "ヒヨリ……。"
"61050-112-ヒヨリ" = "だ、だって先生は、いつも私たちのことを助けてくれましたし……。"
"61050-113-ヒヨリ" = "それに本気を出せば、ヴァルキューレとか、あちこちに連絡して……。"
"61050-114-ヒヨリ" = "今からでも私たちを矯正局とか、もっと怖いところに送り込めるわけですし……。"
"61050-115-ヒヨリ" = "……はっ！？ま、まさかそういうことだったんですか！？#n今まで優しくしてくれたのは、そのための罠……！？"
"61050-116-ヒヨリ" = "うわぁぁぁぁぁぁああん！もうダメです！終わりです！やっぱり夢も希望もなかったんです！せめて、最後にこの紅茶だけは飲み干してから――！"
"61050-117-ナギサ" = "あ、あの……先生？これは……。"
"61050-118" = "[s15]\"いつものことだから……。\"\n[s16]\"安心して大丈夫だよ。\""
"61050-119-ナギサ" = "そ、そうですか……。"
"61050-120-ナギサ" = "え……？気にせず、自分の決めたことをやれ、ですか？"
"61050-121-ナギサ" = "……。"
"61050-122-ナギサ" = "はい、そうですね。#nでなければ……トリニティの皆さんには内緒にしてまで、この場を設けた意味がなくなってしまいます。"
"61050-123-ナギサ" = "皆さん。#n私は「個人として来た」などと、都合のいい言い訳はしません。"
"61050-124-ナギサ" = "どのみち何をしても、どう言っても、それに込めた意図を問われるものです。#n生徒会長というのは、そういう立場ですから。"
"61050-125-ナギサ" = "ですから……。"
"61050-126-ナギサ" = "……申し訳ございませんでした。"
"61050-127-ヒヨリ" = "……え？"
"61050-128-ヒヨリ" = "えぇっ……！？"
"61050-129-ヒヨリ" = "……。"
"61050-130-ヒヨリ" = "どんな言動にも真意を問われる立場……あなたはそう言ったよね。"
"61050-131-ヒヨリ" = "それなら、謝罪の真意を聞いてもいい？"
"61050-132-ナギサ" = "……言葉の通りですよ。"
"61050-133-ナギサ" = "一人のトリニティ生として。そして、ティーパーティーのホストとして。"
"61050-134-ナギサ" = "……今のトリニティを代表する者としても。"
"61050-135-ナギサ" = "私は皆さん、そしてアリウス分校に、謝罪を申し上げます。"
"61050-136-アツコ" = "どうしてあなたが謝るの？#nテロを起こしたのは、[ruby=私たち]アリウススクワッド[/ruby]だったはずだけど。"
"61050-137-ナギサ" = "たしかに、あの事件だけを見ればアツコさんのおっしゃる通りです。"
"61050-138-ナギサ" = "ですが……そうせざるを得なかった理由があったことを、私は知っています。"
"61050-139-ナギサ" = "いいえ、「あった」のではなく、「今もあり続けている」と言うべきでしょうか。"
"61050-140-ナギサ" = "「公会議」を境に、トリニティとアリウスの関係は変わってしまいました。"
"61050-141-ナギサ" = "しかし今なお私たちの間には、「一つだった」と言える部分が残されているはずです。"
"61050-142-ミサキ" = "それで謝罪？今さら罪悪感でも湧いたの？"
"61050-143-アツコ" = "――ミサキ。"
"61050-144-ナギサ" = "構いません。皆さんには、その言葉を投げかける資格があると思っています。"
"61050-145-ナギサ" = "解釈の違いという理由で、アリウスを追放した。#nそれは紛れもなく、トリニティの……過ちだったのですから。"
"61050-146-ナギサ" = "ですがそれは、私が目を背けていい理由にはなりません。#n……ならないはずでした。"
"61050-147-ナギサ" = "すぐ傍で苦しんでいた方々を……政治的な事情や立場という理由で、[ruby=・   ・]私が[/ruby]軽んじていたのではないかと、そんな考えがよぎったのです。"
"61050-148-ナギサ" = "その苦しみや痛みが、今もなお続いているというのに……#nそれを放っておいたままでいるというのは、正しくない行いであると。"
"61050-149-ヒヨリ" = "それだと納得はできないよね。"
"61050-150-ヒヨリ" = "え、えぇっ！？"
"61050-151-ヒヨリ" = "終わったことを今さら掘り返すのは、あんまり好きじゃないけど。"
"61050-152-ヒヨリ" = "あの事件での被害者は、[ruby=きりふじ]桐藤[/ruby]ナギサ……あなただよ。"
"61050-153-ミサキ" = "言うまでも無く、[ruby=私たち]アリウススクワッド[/ruby]が加害者だった。"
"61050-154-ミサキ" = "おかしいでしょ？被害者が、加害者に。それも、先に謝るなんて。#n普通に考えて、理屈が通らない。"
"61050-155-ミサキ" = "こういう筋の通らない話には、どうせ……何か裏がある。"
"61050-156-サオリ" = "……ミサキ、言葉を慎め。"
"61050-157-ミサキ" = "……。"
"61050-158-ナギサ" = "ミサキさんの疑問は、もっともです。"
"61050-159-ナギサ" = "そして私は……「誰もが納得できる」返答とそうでないもの両方を持っています。"
"61050-160-アツコ" = "「誰もが納得できる返答」から聞かせてほしいな。"
"61050-161-ナギサ" = "そうですね……。"
"61050-162-ナギサ" = "「アリウス分校の残存生徒」という、トリニティの火種。#nその懸念を、私一人の謝罪で消すことが叶うのならば――"
"61050-163-ナギサ" = "それは、非常にコストパフォーマンスの良い政治的手段だとは思いませんか？"
"61050-164-ミサキ" = "……最初からそう言えばよかったのに。"
"61050-165-アツコ" = "待って。まだナギサさんの話は終わってないよ。"
"61050-166-アツコ" = "もう一つ、「そうでない返答」というのは？"
"61050-167-ナギサ" = "……。"
"61050-168-ナギサ" = "ティーパーティーのホストを務める一生徒は、考えていました。"
"61050-169-ナギサ" = "エデン条約という特異な事件は、なぜあのような顛末になってしまったのか、と。"
"61050-170-ナギサ" = "ティーパーティー以外の者では触れられない……過去の記録にまで手を伸ばして、始まりから見つめ直した末に――"
"61050-171-ナギサ" = "ふと、トリニティの校庭を見下ろしながら「そうすべきだ」と思ったのです。"
"61050-172-ナギサ" = "この2校は……今のままの関係を続けてはいけない。"
"61050-173-ナギサ" = "関係を正すのならば、その根本から。"
"61050-174-ナギサ" = "「過去の過ち」を抱えるトリニティから、何らかの形で、和解の意思を示すべきだと……そう思ったのです。"
"61050-175-ミサキ" = "……ピンク色のお姫様が言いそうな話だね。"
"61050-176-ナギサ" = "はい……。ようやく、彼女の気持ちが少しだけ分かってきたのかもしれません。"
"61050-177-ヒヨリ" = "……。"
"61050-178-ヒヨリ" = "……。"
"61050-179-ヒヨリ" = "えへへ……。"
"61050-180-アツコ" = "じゃあ、次は私の番だね。"
"61050-181-サオリ" = "……！"
"61050-182-アツコ" = "かつてロイヤルブラッドと呼ばれた者として。"
"61050-183-アツコ" = "あるいは……あなたと同じ生徒会長という立場に――"
"61050-184-アツコ" = "アリウス分校で、最も近かったかもしれない者として。"
"61050-185-アツコ" = "私たちが起こしたすべてのテロ行為を、謝罪します。"
"61050-186-ナギサ" = "そのように言っていただき、ありがとうございます。"
"61050-187-ナギサ" = "もちろん……[ruby=皆さん]アリウススクワッド[/ruby]に謝るだけで、すべてが解決するとは思っておりません。"
"61050-188-アツコ" = "トリニティに編入されたアリウスの皆さんにも。"
"61050-189-ナギサ" = "まだ分校に残っている皆さんにも、いずれは謝罪の機会を設けなければならないでしょう。"
"61050-190-ナギサ" = "そして、謝罪には――責任が伴います。"
"61050-191-ナギサ" = "責任は、往々にして「行動」で示さなければならないもの。"
"61050-192-ナギサ" = "これは……他でもない先生から教わったことです。"
"61050-193-サオリ" = "……話は理解した。#n私からも謝るべきことが山ほどあるが……。"
"61050-194-サオリ" = "それを話し出したら、今日はそれだけで終わってしまいそうだ。#n話を先に進めよう。"
"61050-195-サオリ" = "わざわざこの「相談」に介入したということは……#nなにか、他に私たちに言いたいことでもあるのか？"
"61050-196-サオリ" = "「相談」の内容を知りたいだけなら、後からいくらでもやりようがあったはずだ。#nわざわざ先生を使ってまで、場を設ける必要はないだろう？"
"61050-197-ナギサ" = "ご推察のとおりです。"
"61050-198-ナギサ" = "では、ここからは本題に入らせていただきます。"
"61050-199-ナギサ" = "先ほど、先生から「試験」の話があったかと思います。"
"61050-200-サオリ" = "……まさか。"
"61050-201-ナギサ" = "はい。"
