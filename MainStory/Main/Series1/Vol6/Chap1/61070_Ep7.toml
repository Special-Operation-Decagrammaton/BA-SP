[translation]
"61070-1" = "第7話;ハーモニカ"
"61070-2-アツコ" = "ねぇ、先生。"
"61070-3-アツコ" = "先生の計画は、アリウスの生徒に試験を受けてもらうことだよね？"
"61070-4-アツコ" = "この「トリニティ総合試験」を。"
"61070-5" = "[ns]\"うん。できれば「アリウス総合試験」って名前でね。\""
"61070-6-アツコ" = "名前は大事だよね。"
"61070-7-アツコ" = "ナギサさんも、そう言ってた。"
"61070-8-ナギサ" = "アリウスの皆さんが、「トリニティ総合試験」という名前を受け入れられるかを考えると……。"
"61070-9-ナギサ" = "やはり、難しいでしょうね。"
"61070-10-ナギサ" = "ですが、もし何かの偶然で……。"
"61070-11-ナギサ" = "「トリニティ総合試験」の予備印刷分が、「アリウス分校」に流れ着くことがあったとしたら？"
"61070-12-ナギサ" = "それも、「アリウススクワッド」という運び手を通じて。"
"61070-13-ナギサ" = "もちろんこの件に関して、トリニティは一切の見解を示しません。"
"61070-14-ナギサ" = "印刷ミスや配送ミスというのは、往々にして起こりうることです。#nうーん……学園の運営費を少しでも節約するためとはいえ、仁志川センター経由にしたのは失敗でしたね。"
"61070-15-ナギサ" = "まったく……学園の運営とは大変なものです。"
"61070-16-サオリ" = "配送ミス、か……。#n今回の仕事は配達員兼ボディーガードということだな。"
"61070-17-ミサキ" = "……で、報酬は？聞き忘れてたけど。"
"61070-18" = "[s]\"心配しないで。それなりの額を用意するよ。\""
"61070-19-ミサキ" = "……。"
"61070-20-ミサキ" = "先生がそれでいいなら。"
"61070-21" = "[s]\"でも、実はそれ以外の作戦も考えてるんだよね。\""
"61070-22-ヒヨリ" = "べ、別の作戦……ですか！？"
"61070-23-ヒヨリ" = "どうせ、またろくでもないことなんでしょ。#n気にするだけ無駄だよ。"
"61070-24-アツコ" = "私はちょっと楽しみだけどな。#n期待してもいいんだよね、先生？"
"61070-25-ナギサ" = "……とはいえ、問題は他にも山積みです。"
"61070-26-ナギサ" = "一つ。試験を受けるにあたって、十分な勉強が前提となります。"
"61070-27-ナギサ" = "アリウスの皆さんは、果たして一般的な教育を受けていたのか……。"
"61070-28-ナギサ" = "やはりそこは……無理があるでしょうね。#nだからこそ、先生に授業をお願いしたのですから……。"
"61070-29-ナギサ" = "改めて、先生には感謝しています。#nそして……申し訳ありません。アリウススクワッドの皆さん。"
"61070-30-ナギサ" = "……このお願いは、そもそも成り立っていないのかもしれません。"
"61070-31-ナギサ" = "これはアリウス分校の運営に、トリニティが口を出すということ。"
"61070-32-ナギサ" = "別の学園の方針に干渉するなど、本来あってはならないことですから。"
"61070-33-アツコ" = "「別の学園」ね……。"
"61070-34-ナギサ" = "アツコさんはどうお考えですか？"
"61070-35-アツコ" = "……ありがとう、ナギサさん。"
"61070-36-ナギサ" = "今はその判断に、素直に感謝しているよ。"
"61070-37-アツコ" = "だってトリニティは、いつでもアリウス分校の所有権を主張できたはずなんだから。"
"61070-38-アツコ" = "あの事件の時……一時的とはいえ、アリウスはトリニティの支配下にあった。"
"61070-39-ナギサ" = "[ruby=・   ・   ・   ・   ・]主張できた[/ruby]だけですよ。#n実際に行うのも、それが実現するのも、全く別の話です。"
"61070-40-ナギサ" = "だからこそ、先生……いえ、シャーレに[ruby=きりふじ]桐藤[/ruby]ナギサという「個人」が「お願い」せざるを得なかったんです。"
"61070-41-ヒヨリ" = "すごく面倒くさいやり方するよね。単純な話なのに。"
"61070-42-ヒヨリ" = "これが……政治ってやつなんですか……。こ、怖いです……怖すぎます……。"
"61070-43-サオリ" = "これもまた、世の中の一面ということだろう。#n細かいことは置いておくとしても、桐藤ナギサの立ち回りには、正直感心させられた。"
"61070-44-サオリ" = "いい勉強になったな。"
"61070-45-ミサキ" = "何それ。もしかして、ティーパーティーの肩を持つつもり？"
"61070-46-サオリ" = "そ、それは……。"
"61070-47-アツコ" = "でも、学べるところがあるなら、誰からだって学ぶべきだと思うよ。"
"61070-48-アツコ" = "……私たちは、知らないことばかりなんだから。"
"61070-49-ミサキ" = "はぁ……。"
"61070-50-スバル" = "先輩、先輩！ハーモニカ吹いてくださいよ！"
"61070-51-ウキウキしたアリウスの生徒B" = "あっ！私も聞きたいです！先輩の演奏、大好きなんです！"
"61070-52-スバル" = "えっ！？そ、それは……。"
"61070-53-スバル" = "えー、いいじゃないですか！#n聞かせてくださいよ～！"
"61070-54-スバル" = "い、いえ。その……ですね……。"
"61070-55-スバル" = "最近、ふと思ったんですが……。"
"61070-56-スバル" = "廃墟で、ひとり感傷にひたりながらハーモニカを吹くなんて……。"
"61070-57-スバル" = "それって、ちょっと……カッコつけすぎのような……。"
"61070-58-スバル" = "わあっ！先輩が照れてる！"
"61070-59-ウキウキしたアリウスの生徒A" = "珍しいよね！照れた顔……ふふっ、今日はラッキーかも！"
"61070-60-マイア" = "あの、私も……先輩の演奏……聴きたいです。#n久しぶり、ですし……。"
"61070-61-スバル" = "ぐっ……！それはちょっと卑怯じゃないですか……！？"
"61070-62-マイア" = "ダメ……ですか？"
"61070-63-スバル" = "そっ……れは、ほんとにずるいですよ！"
"61070-64-スバル" = "……絶対にダメというわけじゃ……ないですけど。"
"61070-65-スバル" = "やったー！！！"
"61070-66-スバル" = "まったく……こういうときだけ、みんな意地悪なんですから……。"
"61070-67-スバル" = "しょうがないですね……それでは……。"
"61070-68-スバル" = "変な音が入っても、あんまり笑わないでくださいね……？"
"61070-69-スバル" = "え〜、またそうやって〜"
"61070-70-ウキウキしたアリウスの生徒B" = "先輩が変な音を鳴らしたことなんて、一度もないじゃないですか～！"
"61070-71-マイア" = "前はマダムが禁止してたから、あんまり聴けなかったけど……。"
"61070-72-マイア" = "でも、マダムがいない時に、こっそり演奏してくれましたよね？"
"61070-73-マイア" = "下手とか変だなって思ったことなんて、一度もないです。"
"61070-74-マイア" = "私、あまり詳しくはないですが……才能があると思いますよ？"
"61070-75-スバル" = "そんなに褒めても、何も出ませんからね！？"
"61070-76-スバル" = "……。"
"61070-77-スバル" = "はぁ……。"
"61070-78-スバル" = "では、演奏します……ね。"
"61070-79" = "わあああ……。"
"61070-80" = "ふふ……やっぱりこの音が好きだなぁ。"
"61070-81-マイア" = "（……なんだろう）"
"61070-82-マイア" = "（やっと、帰ってきた実感が湧いた気がする……）"
"61070-83-ミサキ" = "……帰って来たね。"
"61070-84-サオリ" = "……ああ。"
"61070-85-ミサキ" = "すぅ……ふぅ……。"
"61070-86-サオリ" = "……どうしたんだ？"
"61070-87-ミサキ" = "いや……なんとなく、ね。"
"61070-88-ミサキ" = "……。"
"61070-89-サオリ" = "……そうか。そうだな。"
"61070-90-ミサキ" = "……うん。"
"61070-91-ヒヨリ" = "うぅ……私たちがアリウスに戻って……#n本当に大丈夫なんでしょうか……？"
"61070-92-ヒヨリ" = "この話、前にもした……気はするんですけど……。"
"61070-93-ヒヨリ" = "やっぱり戻ってきてみると、なんだか……#nモヤモヤするというか……。"
"61070-94" = "[ns]\"私も、同じような気持ちだよ。\""
"61070-95-ヒヨリ" = "あ……先生も、ここは初めてじゃないですもんね……。"
"61070-96-ミサキ" = "でも、まぁ、私たちがアリウスに戻るとなれば……。"
"61070-97-ミサキ" = "十中八九……歓迎されないよね。"
"61070-98-アツコ" = "そうだな。残っている連中にとって、私たちは裏切り者も同然だろう。"
"61070-99-アツコ" = "きっと、そうだと思う。"
"61070-100-アツコ" = "……もしかしたら、盛大なお出迎えをしてくれるかもね。"
"61070-101-サオリ" = "たしか今のまとめ役は、スバルだったな。"
"61070-102-アツコ" = "うん……。"
"61070-103-ナギサ" = "以前から、何度か内密に使者を送り……#n話し合いの機会を持とうと試みてきました。"
"61070-104-サオリ" = "結果は？"
"61070-105-ナギサ" = "……救護騎士団が、救護活動に専念する他なかった。#nとだけ申し上げます。"
"61070-106-ナギサ" = "唯一掴めたのは、あちらに残っている方々をまとめている生徒の名前だけ。#nその生徒は――"
"61070-107-ナギサ" = "―[ruby=かけはし]―梯ス[/ruby]バル。"
"61070-108-サオリ" = "……！"
"61070-109" = "[ns]\"スバルって、どんな子だったの？\""
"61070-110-アツコ" = "それはたぶん、サッちゃんが一番詳しいんじゃないかな。"
"61070-111-アツコ" = "……。"
"61070-112-サオリ" = "人柄を一言で語るのは簡単なことではないが、私の記憶では……。"
"61070-113-サオリ" = "話が通じるようで、どこかズレるタイプだったな。"
"61070-114-ミサキ" = "そうだっけ？"
"61070-115-ミサキ" = "でも、よく考えたら……間違ってはないか。"
"61070-116" = "[ns]\"話ができないわけじゃないってことだね？\""
"61070-117-サオリ" = "そういう見方もできるが……。"
"61070-118-サオリ" = "いや、先生のことだ。#nどんな相手でも、まずは会話を試みるのだろうな。"
"61070-119-サオリ" = "――止まってくれ。#n……これより作戦体制に移行する。準備は良いな？"
"61070-120-サオリ" = "アリウススクワッド、任務開始だ。"
"61070-121-アツコ" = "この感じ……懐かしいね。"
"61070-122-サオリ" = "その……先生。"
"61070-123-サオリ" = "ゆっくり話ができるのは、これが最後になるかもしれない。#nだから、聞いておきたいことがあるんだ。"
"61070-124-サオリ" = "どうして……いつも、そんな風に自分を後回しにして……損な役回りばかり引き受けようとするんだ？"
"61070-125-サオリ" = "あっ、いや。別に、それを責めるつもりじゃない。ただ……。"
"61070-126-サオリ" = "……。"
"61070-127-サオリ" = "私は、先生が傷ついたり、苦しんだりするのを……もう見たくない。"
"61070-128-サオリ" = "それが心の傷でも、身体の傷でも……同じことだ。"
"61070-129" = "[s]\"その気持ちだけで、なんだか元気が出てくるよ。そのためかな。\""
"61070-130-サオリ" = "そ、そうか？#nそれなら、今後も私が先生の心配をし続ければ――"
"61070-131-サオリ" = "……いや、ないな。#nそんなに都合よくいくわけがないことはよく知っている。"
"61070-132-サオリ" = "ん？どうして急にこんなことを……か。"
"61070-133-サオリ" = "……。"
"61070-134-サオリ" = "この場所に来ると、いろいろと思い出してしまうんだ。"
"61070-135-サオリ" = "いろいろなことがあったからな……。"
"61070-136-サオリ" = "……。"
"61070-137-サオリ" = "その、先生？"
"61070-138-サオリ" = "……。"
"61070-139-サオリ" = "私はやはり、先生にちゃんと謝ってな――"
"61070-140" = "[ns]\"あっ、そうだ！トリニティに編入した子の話だけどさ！\""
"61070-141-サオリ" = "えっ、あっ、あぁ。 "
"61070-142" = "[s]\"あの子たち、みんなに感謝してたよ。\""
"61070-143-サオリ" = "え……？"
"61070-144-ミサキ" = "……どうして？"
"61070-145-ミサキ" = "[ruby=スクワッド]私たち[/ruby]があの作戦を実行したから、なんて。そんなの、結果論でしょ。"
"61070-146-サオリ" = "それでも、あの子たちがアリウスの外で学園生活を送れるきっかけにはなったのか……。"
"61070-147-ヒヨリ" = "でも……それって……#n私たちがやったことですけど、でも……。"
"61070-148-ヒヨリ" = "すっごく、悪いこと……だったんじゃないでしょうか……？"
"61070-149-アツコ" = "うん。テロだよ。絶対にやっちゃいけないことだった。"
"61070-150-ヒヨリ" = "うわぁぁぁぁぁぁああん！やっぱりそうなんですねぇ～！"
"61070-151" = "[ns3]\"でもね。\"\n[ns4]\"編入した子たちから、感謝の言葉を預かった。\"\n[ns5]\"これだって、れっきとした事実だよ。\""
"61070-152-ヒヨリ" = "……。"
"61070-153-アツコ" = "先生……？事実って、なに？"
"61070-154-アツコ" = "……歴史ってなんなのかな。"
"61070-155" = "[s6]\"直接的な答えじゃなくて申し訳ないけど。\"\n[s7]\"それを知るために、私たちは勉強するんじゃないかな。\""
"61070-156-アツコ" = "ふふっ、一本取られちゃった。"
"61070-157-アツコ" = "今のは先生らしくて、ちょっとカッコよかったよ。"
"61070-158-アツコ" = "えっ？先生らしさついでに、もうひとつ聞きたいことがあるって？"
"61070-159" = "[s]\"みんなは普段、ちゃんと勉強してる？\""
"61070-160-アツコ" = "それなら心配いらないよ。勉強するの、私は結構好きなんだ。"
"61070-161-ヒヨリ" = "えへへ……。先生がこっそり、教育用のBDとかを送ってくれてましたし……。"
"61070-162-ヒヨリ" = "……まあ、やって損するものでもないし。#n時間ができたときに少しずつね。"
"61070-163-ヒヨリ" = "ああ。私も同じだ。世の中の仕組みを知っておいて損はない。"
"61070-164-ヒヨリ" = "……今思えば、これも先生の言った通りだったな。"
"61070-165" = "[ns8]\"よかった。これでまた一歩、完成に近づいたよ。\"\n[ns9]\"私の壮大な計画がね……！\""
"61070-166-ヒヨリ" = "先生がそういうテンションのときって、一番不安になるんだけど……。"
"61070-167-ヒヨリ" = "ま、待ってください……！"
"61070-168-ヒヨリ" = "どうした？"
"61070-169-ヒヨリ" = "……ああ、なるほど。そういうことか。"
"61070-170-ヒヨリ" = "はい……。"
"61070-171-ヒヨリ" = "ついに……。"
"61070-172-ヒヨリ" = "帰ってきたんですね……。"
"61070-173-スバル" = "はぁ……最高でした、先輩。"
"61070-174-スバル" = "アンコール！アンコール！"
"61070-175-スバル" = "……お断りします。"
"61070-176-スバル" = "照れないでくださいよ！カッコよかったのに！"
"61070-177-スバル" = "いや、それがですね……。"
"61070-178-スバル" = "実はもう、これ以上吹ける曲がないんです……。"
"61070-179-スバル" = "あっ……楽譜って、あんまり手に入らないですもんね……。"
"61070-180-ウキウキしたアリウスの生徒B" = "じゃあ、しょうがないですね……。"
"61070-181-動揺したアリウスの生徒A" = "せ、先輩！た、大変です！"
"61070-182-スバル" = "落ち着いてください。#n順を追ってゆっくりお願いします。"
"61070-183-動揺したアリウスの生徒A" = "は、はいっ！"
"61070-184-動揺したアリウスの生徒A" = "……スクワッドが、アリウスに入りました。#nシャーレの先生と一緒です。"
"61070-185-スバル" = "スクワッドが……！？"
"61070-186-動揺したアリウスの生徒C" = "あいつら、どの面下げて……！"
"61070-187-動揺したアリウスの生徒C" = "私はまだ、スクワッドのこと……。"
"61070-188-動揺したアリウスの生徒B" = "……。"
"61070-189-動揺したアリウスの生徒B" = "無理だよ……顔も見たくない……。"
"61070-190-動揺したアリウスの生徒C" = "そう、会いたくない。"
"61070-191-動揺したアリウスの生徒C" = "トリニティが来たかと思えば、次はスクワッド……？#n一体何しにきたんだ……！"
"61070-192-スバル" = "ちょっと待ってください。"
"61070-193-スバル" = "……シャーレの先生も一緒だと言いましたよね？"
"61070-194-動揺したアリウスの生徒A" = "そ、そうです！"
"61070-195-スバル" = "……。"
"61070-196-スバル" = "なるほど……そういうことですか。"
"61070-197-スバル" = "スクワッドは巻き込まれた可能性も……？"
"61070-198-動揺したアリウスの生徒A" = "ど、どういうことですか、先輩？"
"61070-199-スバル" = "皆さん。"
"61070-200-スバル" = "スクワッドだけであれば、大した問題にはならなかったでしょう。"
"61070-201-スバル" = "ですが、問題は「シャーレの先生」と呼ばれる、あの大人です。"
"61070-202-スバル" = "その大人がアリウスに現れた以上、今までのやり方では通じません。"
"61070-203-動揺したアリウスの生徒B" = "な、なんでですか……？"
"61070-204-動揺したアリウスの生徒C" = "なんでって……考えてみなよ。#nあの大人のせいで、結局……。"
"61070-205-動揺したアリウスの生徒C" = "マダムが……いなくなったんでしょ……？"
"61070-206-動揺したアリウスの生徒B" = "そ、それは、でも……あっ！"
"61070-207-動揺したアリウスの生徒C" = "そう。"
"61070-208-動揺したアリウスの生徒C" = "あの大人は何をするかわかんない。どんな力を持ってるかも。"
"61070-209-動揺したアリウスの生徒C" = "どんな結果をもたらすかも……予測がつかない。#n大人って、そういうものでしょ？"
"61070-210-動揺したアリウスの生徒B" = "……たしかに。"
"61070-211-動揺したアリウスの生徒B" = "いつだって、私たちじゃ想像もできないことをやるんだから。"
"61070-212-スバル" = "せ、先輩……これからどうすれば……？"
"61070-213-スバル" = "ひとまず、落ち着きましょう。それから……。"
"61070-214-スバル" = "……。"
"61070-215-スバル" = "「お出迎え」に、出てみましょうか。"
"61070-216-動揺したアリウスの生徒A" = "そっ、それって……大丈夫なんですか……！？"
"61070-217-スバル" = "正直なところ、大丈夫かどうかは私にもまだ判断がついていません。"
"61070-218-スバル" = "ですが……やってみなければ分からないでしょう？そうではありませんか？"
"61070-219-スバル" = "差し当たって、各自の銃のセーフティは、外さないでおいてください。"
"61070-220-スバル" = "……今は、まだ。"
"61070-221-スバル" = "分かりました、先輩！"
"61070-222" = "次回;アリウス流"
