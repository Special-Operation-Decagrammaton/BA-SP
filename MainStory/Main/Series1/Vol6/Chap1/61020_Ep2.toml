[translation]
"61020-1" = "第2話;生徒の本分"
"61020-2-ヒフミ" = "お久しぶりです、先生！"
"61020-3-ヒフミ" = "だいぶ久しぶりにお会いした気がします。#n先生、私のことを覚えていますか？"
"61020-4-アズサ" = "私は先生の顔も耳も忘れていない。もちろん、ヒフミのもだ。"
"61020-5-アズサ" = "ターゲットの外見的特徴を記憶しておくことは、任務遂行において重要だからな。"
"61020-6-コハル" = "……先生のこと、任務ターゲットかなにかと勘違いしてない？"
"61020-7-ハナコ" = "うふふ、そんな物騒な話ではないと思いますよ。#nアブない任務のターゲットではあるかもしれませんが。#n例えば……夜の補習授業とか。"
"61020-8-コハル" = "よ、夜の補習授業！？何いってんの！？#nエッチなのはダメ！死刑！"
"61020-9-コハル" = "というか！なんでいっつも話をそっちに持っていこうとするわけ！？#nエッチな話にしないと気が済まないの！？"
"61020-10-ハナコ" = "いやん♡"
"61020-11-コハル" = "変な声出すのも禁止！"
"61020-12-ヒフミ" = "あ、あはは……でも、今のうちに先生とお会いできてよかったです。#n来週から忙しくなってしまいますので……。"
"61020-13" = "[s]\"来週から何かあるの？\""
"61020-14-コハル" = "あれ、先生知らないの？"
"61020-15-ヒフミ" = "もうすぐ、トリニティ総合試験なんです。"
"61020-16-ヒフミ" = "なのでそろそろ、本格的に準備を始めないといけなくて……あうぅ……。"
"61020-17" = "[s]\"トリニティ総合試験？\""
"61020-18-ハナコ" = "はい♡トリニティの全生徒を対象に行われる試験で……。"
"61020-19-ハナコ" = "国語や保健、数学に――体育。#n他にも物理や――保健体育まで。全科目、全範囲が対象の――"
"61020-20-ハナコ" = "まさに「総合」の名にふさわしい試験なんです♡"
"61020-21-コハル" = "なんでそんなに保健体育を強調するの！？#nいや、別に説明しなくていいけど。"
"61020-22" = "[s]\"普通の試験とどう違うの？\""
"61020-23-アズサ" = "それは私も気になっていた。#n試験については、特別学力試験である程度理解したつもりだが……。"
"61020-24-ヒフミ" = "えっとですね……トリニティ総合試験の問題は外部の機関が作成するんです。"
"61020-25-コハル" = "たしか公正性？客観性？そんな感じの理由だったはず？"
"61020-26-ハナコ" = "簡単に言えば……『トリニティ』という視点を抜いて、純粋な学力を測るためのものです。"
"61020-27-ハナコ" = "内部で問題を作ると出題傾向に偏りがあったり、難易度の客観性に欠けたりする恐れがありますから。"
"61020-28-ハナコ" = "副次的なものですが、応用音楽が出題範囲に入らない、というのはちょっとした利点ですね。"
"61020-29-ハナコ" = "もっとも、「試験の作問者は、当該試験をどのように受けるべきか？」という内部システム的な問いへの回答でもあるのですが。"
"61020-30" = "[s]\"あ……なるほど。外部模試ってことだね……。\""
"61020-31-コハル" = "外部……模試？なにそれ？"
"61020-32-コハル" = "なんか、分かるような分からないような……。"
"61020-33-アズサ" = "名称はさておき、その表情を見るに、先生も試験はあまり好きじゃないようだな。"
"61020-34-コハル" = "ふふっ、試験が好きという方は、そう多くないでしょうね。#nもちろん、私も。"
"61020-35-ハナコ" = "あら、意外でしたか？私も至って普通の女子高生ですから。"
"61020-36-コハル" = "普通の……？"
"61020-37-ハナコ" = "でも、先生との「保健体育の実技試験」でしたら……#nうふふ……むしろ喜んで……♡"
"61020-38-コハル" = "あんたはもう黙ってて！！"
"61020-39-ハナコ" = "そんなこと言わずに……コハルちゃんも一緒にいかがですか？"
"61020-40-コハル" = "三人で実技！？そんなエッチなのはダメ！死刑！！"
"61020-41-ハナコ" = "きゃあ♡"
"61020-42-ヒフミ" = "あはは……。"
"61020-43-アズサ" = "なるほど。今回の試験では、落第することはないんだな。"
"61020-44-ヒフミ" = "外部の機関が実施する試験なので、そういう措置はないみたいです。#nでも、手を抜いていいわけではなくて……。"
"61020-45-コハル" = "ひどい点数を取ったら笑いものになるでしょ？#n私はエリートなんだから、ちゃんとするわよ！"
"61020-46-ヒフミ" = "それに、あまりにも成績が悪いと「特別補習」を受けることになっちゃいます……。"
"61020-47-アズサ" = "落第しないのに補習を受ける必要があるのか？"
"61020-48-ヒフミ" = "それは、えっと……#nつまり、試験の結果が悪くても退学にはならないというだけで……。"
"61020-49-ヒフミ" = "ちゃんと再試験で一定以上の点数を取らなければなりません。"
"61020-50-ヒフミ" = "とはいっても……#n決められた時間以上の補習授業は行われないはずですが。"
"61020-51-ハナコ" = "ふふっ。成績が悪いと、貴重な放課後の時間が奪われてしまうというわけです。"
"61020-52" = "[ns]\"今回は補習を受けなくて済むように頑張ろう！\""
"61020-53-ヒフミ" = "あうぅ……。"
"61020-54-ハナコ" = "うふふ。#nもしも私だけ、一人寂しく補習対象になってしまったら――"
"61020-55-ヒフミ" = "担当教師は……先生にお願いしましょうか。"
"61020-56-ハナコ" = "誰もいない放課後の教室。茜色に染まる空。#n半開きの窓から入る夕風。ひらひらと揺れるカーテン……。"
"61020-57-ハナコ" = "つい気が散って、窓の外をぼーっと眺めてしまう私。#n先生は「集中しなさい」と言って近づいてくる。"
"61020-58-ハナコ" = "その時、ちょうど風が吹いて……#n教室には私と先生……2人だけの世界に。"
"61020-59-ハナコ" = "カーテンの向こう側……2人の影は、少しずつ距離が縮まっていき――"
"61020-60-ヒフミ" = "あ、あわわわわ！？"
"61020-61-アズサ" = "？"
"61020-62-コハル" = "！？！？！！！！"
"61020-63-コハル" = "しゃべるの禁止！！！！！"
"61020-64-ハナコ" = "そんなぁ～♡"
"61020-65" = "[ns1]（そういえば……）\n[ns2]（他の子は、どう過ごしているんだろう……）"
"61020-66" = "[ns]\"試験期間中でも自警団の活動は続けるの？\""
"61020-67-レイサ" = "はい！勉強も、街の平和も、どちらも疎かにはできません！"
"61020-68-レイサ" = "両立こそが自警団の不屈の意志であり、行動理念ですから！"
"61020-69-レイサ" = "……ですよね？スズミさん！"
"61020-70-スズミ" = "えっと、自警団に特別な理念はないのですが……。"
"61020-71-スズミ" = "勉強も生徒の本分ですから、レイサさんの言っていることも間違いではありません。"
"61020-72-スズミ" = "え？私を見ると安心する……？#n先生、それはどういう意味でしょうか……？"
"61020-73-レイサ" = "私にはよく分かりませんが……たぶん、良いことだと思います！"
"61020-74-ウイ" = "うわっ！？だ、誰かと思えば、シミコと先生……てっきり、また外の方かと……。#nな、何か用事ですか……？"
"61020-75-シミコ" = "試験の準備をしているか、様子を見に来てくださったんです。#n委員長、ちゃんと勉強していますか？"
"61020-76-ウイ" = "試験程度、国語ならどうとでも……。"
"61020-77-シミコ" = "今回は「総合」試験ですから。国語以外の科目も試験の対象ですよ。"
"61020-78-シミコ" = "ほ、本にはすべてが書かれているので……私は別に、問題ない、はず……。"
"61020-79-シミコ" = "数学もですか？"
"61020-80-ウイ" = "うっ、あっ……！"
"61020-81-シミコ" = "委員長、なんだかんだ言って読む本が偏っていますからね……。"
"61020-82-シミコ" = "う、うぅ……。"
"61020-83" = "[ns]\"シミコは数学大丈夫なの？\""
"61020-84-シミコ" = "私ですか？#n私は……まぁ、なんとか。"
"61020-85-シミコ" = "3年生に比べれば、1年生の内容は難しくありませんから。#n基礎固めをするだけで、勉強量は少なくて済むんです。"
"61020-86-ウイ" = "……ずるい。"
"61020-87-カズサ" = "あ、先生。いらっしゃい。#nうん？……うん、そう。みんなで勉強するって話だったんだけど……。"
"61020-88-ナツ" = "聞くがよい、冒険者たちよ！#n勉強の能率を上げるには、脳を活性化させることが必要不可欠！"
"61020-89-ナツ" = "だが、我々の脳は「ブドウ糖」という高級燃料しか受けつけない……。"
"61020-90-ナツ" = "故に今！我々がスイーツを食するのは、まさしく義務であると言えよう！"
"61020-91-ヨシミ" = "おっ、ナツもたまにはいいこと言うじゃん！#nやっぱ甘いもの食べないと頭回んないよね。"
"61020-92-アイリ" = "ずっとこんな調子なんだよね……。"
"61020-93-アイリ" = "す、すみません、先生。せっかく来てくださったのに……。"
"61020-94" = "[ns]\"いつも通りで安心したかな。\""
"61020-95-ミネ" = "試験だからといって、救護の手を緩めるわけにはいきません。#n救護騎士団としての基本理念です。"
"61020-96-ミネ" = "いえ、[ruby=・   ・   ・   ・   ・   ・]試験そのもの[/ruby]が「救護」であると言えるでしょう！"
"61020-97" = "[s]\"えっと、それってどういう意味……？\""
"61020-98-ミネ" = "試験も救護も、どちらも人々の助けとなる行いです。"
"61020-99-ミネ" = "その本質を見失わず、誠実に臨むことで――#n私たちの「救護の精神」は証明されるでしょう。"
"61020-100-ミネ" = "例えば、見返りを求めずに善意で他者を助ける行い――これは救護です。"
"61020-101-ミネ" = "不正のある場を、物理的手段をもって是正する――これもまた救護です。"
"61020-102-ミネ" = "利益追求のために原価を削り、質の低い医療品を作る悪徳企業を懲罰する。#nこれも救護なのです。"
"61020-103-ミネ" = "――すべての道は、救護に通ず。"
"61020-104-ミネ" = "従って試験もまた、すなわち救護なのです！"
"61020-105-セリナ" = "え？救護とは何か、ですか？あはは……。"
"61020-106-セリナ" = "私たち救護騎士団にとって一番大切な理念……でしょうか？"
"61020-107-セリナ" = "あれ？そういえば、どうしてトリニティ独自の医療技術は#n試験範囲になってないんでしょう……？"
"61020-108-セリナ" = "え、ええと……それは、色んな意味で斬新すぎるから……じゃないかな……。"
"61020-109-ツルギ" = "せ、せせせ先生！？#nど、どうしてこちらに……！？"
"61020-110-ツルギ" = "べ、勉強の様子を見に……？#nそ、そそ、それは嬉しい、ですが……！"
"61020-111-ツルギ" = "ひひ……ひゃはっ……！"
"61020-112-ハスミ" = "……ツルギ、落ち着いてください。"
"61020-113-ハスミ" = "あ、ああ……。"
"61020-114-ハスミ" = "そ、そのっ……ありがとう……ございます、先生……。#nこ、こうして、気にかけていただいて……。"
"61020-115" = "[ns]\"勉強の邪魔しちゃったかな……。\""
"61020-116-ハスミ" = "いえ、そんなことはありません。#nちょうど、休憩しようと思っていたところです。"
"61020-117-ハスミ" = "実はここ数日、食事や任務の時間以外は、みんな勉強漬けでして。"
"61020-118-ハスミ" = "正義実現委員会は、自分の時間が少なくなりがちなので……。"
"61020-119-イチカ" = "まあでも、そんなに心配しなくても大丈夫っすよ。#nそういうものだって理解した上で、私たちは活動してるっすから。"
"61020-120-マシロ" = "どんな困難があっても、揺るがずに自分の正義を貫くこと――"
"61020-121-マシロ" = "それが正義実現委員会の本質だと思っています。"
"61020-122-イチカ" = "ふふ、マシロらしいっすね！#n……んじゃ、そろそろ勉強に戻るっすよ。#n次は……「道徳と倫理の相対性」の部分っすね。"
"61020-123-マシロ" = "……やっぱり、ここは納得できないです。#n相対性ということは、条件で変わるということですよね？#nでも……それはあり得ないような……。"
"61020-124-イチカ" = "言うほど簡単に線を引けるわけじゃないんすよ……。#nまぁ難しいなら、まずは暗記っすね。理屈は後からついてくるっすから。"
"61020-125-サクラコ" = "……ということで、大講堂に集まって共に学ぶ時間を設けることにしたのです。"
"61020-126" = "[s3]\"ひとりで勉強したい子もいるんじゃないかな……？\"\n[s4]\"恥ずかしいとか、集中できないとか……。\""
"61020-127-サクラコ" = "そんなことはありません。#n「この空の下、恥じること無きよう努力すること」こそ、シスターフッドの心得。"
"61020-128-サクラコ" = "それに、勉学という「生徒の本分」を果たす行為に、どうして恥じらいが伴うのでしょうか。"
"61020-129-サクラコ" = "私はトリニティの誰よりも、シスターの皆様を深く信頼しておりますから。"
"61020-130-サクラコ" = "もちろん、不安やためらいがあるのでしたら、できる限りの便宜を図るともお伝えしております。"
"61020-131-サクラコ" = "ですので「気軽に」相談していただければ……。"
"61020-132-ヒナタ" = "サ、サクラコ様との個人面談、ですか……。"
"61020-133-サクラコ" = "ええ、そうです。#nこれもまた、世界へ広く届けるべき、慈愛のかたちではありませんか？"
"61020-134-マリー" = "そういう側面も、たしかにあるかもしれませんが……。"
"61020-135" = "（その後、サクラコをどうにか説得し――）"
"61020-136" = "（みんなと一緒に勉強したい生徒は大講堂で。一人で勉強したい生徒は寮で自習するという妥協案に落ち着いた）"
"61020-137" = "（説得は、ヒナタとマリーがとても頑張ってくれた……）"
"61020-138-トリニティの生徒A" = "あっ、先生！こんにちは！"
"61020-139-トリニティの生徒B" = "試験……？#nちゃんと頑張るに決まってるじゃないですか～"
"61020-140-トリニティの生徒A" = "えっ？成績が良かったら美味しいものをご馳走してくれるんですか！？#n絶対ですよ？約束ですからねっ！"
"61020-141-トリニティの生徒B" = "よーっし、本気で試験勉強しよっかな！"
"61020-142-トリニティの生徒A" = "どうせまた、プリント1枚解いて寝るんじゃない？"
"61020-143-トリニティの生徒B" = "あの時はあんたも一緒に寝てたでしょ！"
"61020-144" = "（楽しげに去っていく生徒たちを見守っていると……）"
"61020-145" = "（そっと様子を伺うように、2人の生徒が近づいてきた）"
"61020-146-控えめなトリニティの生徒A" = "あ、あの、先生……？"
"61020-147-控えめなトリニティの生徒B" = "少し、お時間いただけますか……？"
"61020-148" = "次回;夢のような日々"
