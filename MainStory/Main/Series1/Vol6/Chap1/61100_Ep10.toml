[translation]
"61100-1" = "第10話;傷と痕跡"
"61100-2-サオリ" = "今日のことも含めて、相談したいことがあるんだが……いいだろうか。"
"61100-3" = "[s1]\"もちろん。何か飲みながら話す？\"\n[s2]\"ペットボトルのミルクティーか麦茶くらいしかないけど。\""
"61100-4-サオリ" = "……ああ。"
"61100-5" = "（2人で並んで座って、ペットボトルの飲み物を飲んだ）"
"61100-6" = "（サオリはどこか緊張しているようだった）"
"61100-7" = "[ns]\"そういえば、今日の授業すごくよかったよ。\""
"61100-8-サオリ" = "そ、そうか……？"
"61100-9-サオリ" = "なんとか形になっていたならよかったが……。"
"61100-10-サオリ" = "え？いや……あんまり褒められても……困る。"
"61100-11-サオリ" = "目に狂いはなかった……って？"
"61100-12-サオリ" = "う、うむ……。"
"61100-13-サオリ" = "昔、教官をやっていたからな。その経験が活きたのかもしれない。"
"61100-14-サオリ" = "とはいえ私自身、もっと勉強が必要だ。"
"61100-15-サオリ" = "ああ……「教えること」から学ぶことも多いのだな。"
"61100-16-サオリ" = "教える過程で、自分の知識が整理されるから……か。"
"61100-17-サオリ" = "たしかに……そんな感じだった。"
"61100-18-サオリ" = "……それだけじゃないのか？"
"61100-19" = "[s]\"私も、みんなから学ぶことが多いんだ。\""
"61100-20-サオリ" = "それは……どういう意味だ？"
"61100-21-サオリ" = "未熟な者を導くのが、先生の役割だろう？"
"61100-22" = "[s]\"私も結局は、ただの未熟者だよ。\""
"61100-23" = "[ns3]\"年を重ねるなかで、私が見落としてきたものを……。\"\n[ns4]\"まだ持ってるみんなから、学ばせてもらってるんだ。\""
"61100-24-サオリ" = "そう……か。"
"61100-25-サオリ" = "なら、それは今の私には分からないのだろうな。"
"61100-26-サオリ" = "でも、いつか分かるときが来る……そういうことか？"
"61100-27-サオリ" = "ふふ……今の先生は、なんと言うか……。"
"61100-28-サオリ" = "年寄り臭く感じるな。"
"61100-29" = "[s]\"ぐふっ！ごほっ！げほっ……！\""
"61100-30-サオリ" = "ど、どうしたんだ、先生！？"
"61100-31-サオリ" = "え、心配ない……？そうは見えないが……。"
"61100-32-サオリ" = "すまない……まさかここまでダメージのある言葉だったとは……。"
"61100-33-サオリ" = "よく理解もせずに言葉を使うものでは無いな。"
"61100-34" = "[s5]\"いや、間違ってないよ……。\"\n[s6]\"先生は……年寄り臭い生き物だからね……。\""
"61100-35-サオリ" = "ほ、本当にすまない！先生が良くても、私は……！"
"61100-36-サオリ" = "私、は……。"
"61100-37-サオリ" = "……。"
"61100-38" = "（しばらくの間、無言の時間が流れた）"
"61100-39" = "（飲み物を飲む音だけが、数回、静かに響いた）"
"61100-40-サオリ" = "先生。"
"61100-41-サオリ" = "私は……ずっと……。"
"61100-42-サオリ" = "……ずっと、謝りたいと思っていた。"
"61100-43-サオリ" = "あっ、いや、違う。これでは何を謝罪しているのかがよく分からないな……。"
"61100-44-サオリ" = "ふぅ……。"
"61100-45-サオリ" = "先生。#nこれから私は……とても失礼なお願いをすると思う。"
"61100-46-サオリ" = "でも、これしか方法が思いつかないんだ。"
"61100-47-サオリ" = "……ようやく、自分の犯したことと向き合う決心がついた。"
"61100-48-サオリ" = "ここに来て、やっと……。"
"61100-49-サオリ" = "私はまだ……先生に「謝罪」をできていないことに改めて気づいたんだ。"
"61100-50" = "[s7]\"気にしなくていいのに。\"\n[s8]\"あの時も、その気持ちは分かってたから……。\""
"61100-51-サオリ" = "あの時……？"
"61100-52-サオリ" = "この場所に来ると、いろいろと思い出してしまうんだ。"
"61100-53-サオリ" = "いろいろなことがあったからな……。"
"61100-54-サオリ" = "……。"
"61100-55-サオリ" = "その、先生？"
"61100-56-サオリ" = "……。"
"61100-57-サオリ" = "私はやはり、先生にちゃんと謝ってな――"
"61100-58" = "[log]あっ、そうだ！トリニティに編入した子たちの話だけどさ！[/log]"
"61100-59-サオリ" = "思えば……あの話題の変え方には無理があったな。"
"61100-60-サオリ" = "でも……。"
"61100-61-サオリ" = "申し訳ないが、今だけは……私のわがままに付き合ってくれると嬉しい。"
"61100-62-サオリ" = "これは、私が乗り越えなきゃいけない「過去」なんだと……そう思うんだ。"
"61100-63-サオリ" = "このアリウスの地でも、あの出来事と向き合わなかったら……。"
"61100-64-サオリ" = "アリウスのみんなに合わせる顔がない。#nこの先に進む勇気も……全部なくなってしまいそうで。"
"61100-65" = "[s]\"……分かった。\""
"61100-66-サオリ" = "……ありがとう。"
"61100-67-サオリ" = "それじゃあ……。"
"61100-68-サオリ" = "先生の……お腹を、見せてもらえるだろうか？"
"61100-69" = "[s9]\"……！？\"\n[s10]\"サオリ……！？\""
"61100-70-サオリ" = "ち、違うんだ！そういう反応は予想していたが……。"
"61100-71-サオリ" = "だから前置きをちゃんと……話した、つもりだった。#nすまない……。"
"61100-72-サオリ" = "……。"
"61100-73-サオリ" = "私の――罪を。"
"61100-74-サオリ" = "先生に刻んでしまった、[ruby=痕跡]消えない傷[/ruby]を……この目で確かめさせてほしいんだ。"
"61100-75" = "[ns]\"……！\""
"61100-76" = "（ようやく、サオリの意図を理解した）"
"61100-77" = "（サオリの頼みに応えて、お腹の痕を見せた……）"
"61100-78-サオリ" = "あ……。"
"61100-79-サオリ" = "これが……。"
"61100-80-サオリ" = "……。"
"61100-81" = "（サオリの指先が、傷跡をそっとなぞる）"
"61100-82" = "（その手は……ひどく震えていた）"
"61100-83-サオリ" = "すま……ない……。"
"61100-84-サオリ" = "すまない……。"
"61100-85-サオリ" = "ごめん……。"
"61100-86-サオリ" = "ごめん、なさい……。"
"61100-87-サオリ" = "ごめんなさい。ごめんなさい……ごめんなさい。"
"61100-88-サオリ" = "本当に、私は……。私は……どうすれば……。"
"61100-89-サオリ" = "先生……。"
"61100-90-サオリ" = "……先生。"
"61100-91-サオリ" = "私なんか……。"
"61100-92-サオリ" = "私が、そんな……。"
"61100-93-サオリ" = "くっ……。"
"61100-94-サオリ" = "ひぐっ……っ……。"
"61100-95-サオリ" = "うぅ、うあああ、ああああああ……！"
"61100-96" = "（崩れ落ちるようにうずくまるサオリの肩に――）"
"61100-97" = "（そっと、手を置いた）"
"61100-98" = "[ns]\"大丈夫だよ。\""
"61100-99-サオリ" = "せ、先生……？"
"61100-100" = "[s11]\"大丈夫。もう治ってるよ。\"\n[s12]\"痛くも、なんともないんだ。\""
"61100-101-サオリ" = "だが、でも……！"
"61100-102-サオリ" = "傷跡は、残っているじゃないか……！"
"61100-103-サオリ" = "もう分かってるんだ。知っている！"
"61100-104-サオリ" = "どんな行為も結果を残す。過去は決して覆らない！"
"61100-105-サオリ" = "どんな形であれ痕跡を残して……未来までずっと影響を及ぼし続ける……！"
"61100-106-サオリ" = "いっそ……。"
"61100-107-サオリ" = "いっそのこと……。"
"61100-108" = "[s13]\"何もしない方がよかった、とは言わないでほしい。\"\n[s14]\"私の生徒に、そんな悲しい言葉は言わせたくない。\""
"61100-109-サオリ" = "先生……？"
"61100-110" = "[s15]\"サオリの言う通りだよ。\"\n[s16]\"残ってしまう傷も、たしかにあると思う。\""
"61100-111-サオリ" = "……！"
"61100-112" = "[s17]\"でもね、痕が残っても……。\"\n[s18]\"それと共に生きていけるくらいには……強い生き物なんだよ。\""
"61100-113-サオリ" = "それと、一緒に……？"
"61100-114-サオリ" = "……。"
"61100-115-サオリ" = "それが、先生の……生き方ってことなのか……？"
"61100-116-サオリ" = "でも……。"
"61100-117-サオリ" = "私には、よく分からない……。"
"61100-118-サオリ" = "本当に、何も分からないんだ……。"
"61100-119-サオリ" = "自分の目でそれを確かめれば――"
"61100-120-サオリ" = "自分の犯した罪と向き合えば……少しは前に進めると思った……。"
"61100-121-サオリ" = "でも、それは……。"
"61100-122-サオリ" = "私の勝手な……思い違いだったのかもしれない……。"
"61100-123" = "[s]\"ねえ、サオリ。\""
"61100-124-サオリ" = "……？"
"61100-125" = "[s19]\"もしもサオリがあの時に戻れて――\"\n[s20]\"あの時の自分と向き合えるなら、どう声をかける？\""
"61100-126-サオリ" = "……。"
"61100-127-サオリ" = "……ふふっ。"
"61100-128-サオリ" = "不思議な話だ。"
"61100-129-サオリ" = "私も、似たようなことをよく考える。何度も……何度も。"
"61100-130-サオリ" = "……。"
"61100-131-サオリ" = "後悔しなかった日は、一日だってなかった。"
"61100-132-サオリ" = "未熟で、馬鹿な子どもが……取り返しのつかない罪を犯した。"
"61100-133-サオリ" = "自分の行動の結果、どれほど多くの「日常」を壊すことになるのかも……何も分かってなかった。"
"61100-134-サオリ" = "できることなら、あの頃の自分に本気で言ってやりたい。"
"61100-135-サオリ" = "いや、話しかける前に、一発ぶん殴ってやりたい。"
"61100-136-サオリ" = "「自分が何をしようとしているか、ちゃんと分かっているのか」と。"
"61100-137-サオリ" = "「そのままじゃ……取り返しがつかなくなるぞ」と。"
"61100-138-サオリ" = "……。"
"61100-139-サオリ" = "でも、そんなことはできない。"
"61100-140-サオリ" = "今、ここにいるのは……選択し、行動した後の私だけだ。"
"61100-141-サオリ" = "だからせめて、その事実を背負って生きていくしかない。"
"61100-142-サオリ" = "それだけのことだ。"
"61100-143-サオリ" = "……。"
"61100-144-サオリ" = "ああ、それだけのことだな。"
"61100-145" = "[s]\"それでいいんだよ。\""
"61100-146-サオリ" = "先生……？"
"61100-147" = "[ns]\"うん、それでいい。\""
"61100-148" = "[ns]\"もし世界中が、サオリを罪人だと責めたとしても。\""
"61100-149-サオリ" = "やはり私は罪人なんだな……。"
"61100-150" = "[s21]\"いや、そうじゃなくて……。\"\n[s22]\"今から言うことを、復唱してくれる？\""
"61100-151-サオリ" = "今後、同じ状況に置かれた時……より良い選択ができるようになって……。"
"61100-152-サオリ" = "行動する前に……立ち止まって考えるようにする……。"
"61100-153-サオリ" = "それを約束してほしい……。"
"61100-154-サオリ" = "そうしたら、先生は、いつだって……何度だって……。"
"61100-155-サオリ" = "う、うぅ……。"
"61100-156" = "（サオリは、小さな子どものように泣き始めた）"
"61100-157" = "（落ち着くまで、優しく背中を撫でてあげた……）"
"61100-158-サオリ" = "そういえば、アリウスの環境に……少し変化があったんだ。"
"61100-159" = "[s]\"変化？\""
"61100-160-サオリ" = "ああ。"
"61100-161-サオリ" = "授業のお陰で、少し打ち解けられたみたいでな。"
"61100-162-サオリ" = "休み時間にいろんな話をする機会が増えて。"
"61100-163-サオリ" = "以前に比べて、生活が良くなったと言っていた。"
"61100-164-サオリ" = "少なくとも、食うに困ってはいないようだ。#n「ウォータータイム」も、今じゃ「ティータイム」になったらしい。"
"61100-165-サオリ" = "建物や設備は……見ての通りだけどな。"
"61100-166-サオリ" = "どうやら、外部から金銭や物資が入るようになったみたいで……。"
"61100-167-サオリ" = "その資金の出どころや流れまでは……まだ分からないが。"
"61100-168-サオリ" = "それでも、アリウスに何かしらの変化が起きているのは確かだ。"
"61100-169-サオリ" = "……考えてみれば、当然か。"
"61100-170-サオリ" = "変わらないものなど無いのだから。"
"61100-171" = "[s]\"不安？\""
"61100-172-サオリ" = "分からない。だが……。"
"61100-173-サオリ" = "生活が良くなっているのは、良いことだ。#n少し、安心した。"
"61100-174-サオリ" = "……。"
"61100-175-サオリ" = "先生。"
"61100-176-サオリ" = "私たちも……変われるのだろうか。"
"61100-177" = "[s23]\"きっと、大丈夫だよ。\"\n[s24]\"一歩一歩が小さかったとしても。\"\n[s25]\"遠くまで来た、っていつか振り返るときが来るよ。\""
"61100-178-サオリ" = "……そうか。"
"61100-179-サオリ" = "私は、先生に出会えてよかったと思っている。"
"61100-180-サオリ" = "先生がいてくれて……本当に幸運だった。"
"61100-181-サオリ" = "もし、先生がいなかったら私は……。"
"61100-182-サオリ" = "私たちはきっと……。"
"61100-183-サオリ" = "だから……先生。"
"61100-184-サオリ" = "これは、その……ダメだったら断ってくれて構わないのだが――"
"61100-185-サオリ" = "今夜……一緒に寝てもいいだろうか？"
"61100-186" = "[s]\"！？\""
"61100-187-サオリ" = "ふふっ、冗談だ。そんなに驚かないでくれ。"
"61100-188" = "[s]\"冗談を言わない人が言うと、破壊力は倍になるんだよ……。\""
"61100-189-サオリ" = "そうか。今後の参考にしよう。"
"61100-190" = "[s]\"もしかして……今の、私が自爆したやつ？\""
"61100-191-サオリ" = "ふふっ、どうかな。"
"61100-192-サオリ" = "……それじゃ、あまり快適な場所とは言えないけど……。"
"61100-193-サオリ" = "そろそろ私は、戻るとしよう。"
"61100-194" = "[s]\"おやすみ、サオリ。\""
"61100-195" = "ドアを閉めてから、サオリは一人、壁にもたれかかった。"
"61100-196-サオリ" = "冗談……か。"
"61100-197-サオリ" = "半分、本当だったんだが。"
"61100-198-サオリ" = "……ふふっ。"
"61100-199-サオリ" = "ゆっくり休んでくれ、先生。"
"61100-200-マイア" = "あ、あの……先輩？#nもう寝ちゃってますか……？"
"61100-201-スバル" = "まだ起きています。#n……こんな時間にどうしました？"
"61100-202-マイア" = "あっ、いえっ！#nその……大丈夫かな……って、思って……。"
"61100-203-スバル" = "ああ、なるほど。#n今日、スクワッドと先生に負かされたから……一人でいじけているんじゃないかと心配してくれたんですね？"
"61100-204-マイア" = "あ、ああああ、あのっ！ち、違います！そんなこと思ってないです！"
"61100-205-スバル" = "大丈夫です。そう思われても仕方ないですから。"
"61100-206-マイア" = "ち、違いますって！"
"61100-207-スバル" = "あはは。ごめんなさい。つい、言ってみたくなっただけで。#nもちろん……私は大丈夫ですよ。"
"61100-208-マイア" = "ほ、本当ですか……？"
"61100-209-スバル" = "ええ、本当です。#nこんなことでは何も変わりません。"
"61100-210-スバル" = "――アリウスの憎しみは、簡単に消え去るものではありませんから。"
"61100-211-マイア" = "……！！"
"61100-212-スバル" = "ところで……授業はどうでした？"
"61100-213-マイア" = "え？授業……ですか？えっと……。"
"61100-214-マイア" = "せ、先輩は……どうだったんですか……？"
"61100-215-マイア" = "質問に質問で返すと、会話が成り立たなくなりますよ。#n……前にも言いましたよね？"
"61100-216-マイア" = "す、すみません、先輩！"
"61100-217-マイア" = "でっ、でも、なんというか……。"
"61100-218-マイア" = "初めてのことで、よく分からなくて……頭の中がぐるぐるしてて……。"
"61100-219-スバル" = "でも……。"
"61100-220-マイア" = "不思議な気分でした。"
"61100-221-マイア" = "私の知らない外の世界の話を聞いて……。"
"61100-222-マイア" = "私たち……まったく別の世界にいたんだなって。"
"61100-223-マイア" = "あ、いや……。"
"61100-224-マイア" = "今も、変わっていないんですが。"
"61100-225-スバル" = "……そうですね。"
"61100-226-スバル" = "でも、前よりは少しずつ……。"
"61100-227-スバル" = "私たちも前に進めているのではないでしょうか。#n少なくとも、食べ物には困らなくなりましたから。"
"61100-228-スバル" = "はいっ！私も、そこが一番嬉しいです！"
"61100-229-マイア" = "で、でも……ちょっと気になってたんですけど……。"
"61100-230-マイア" = "ごはんとか、おやつとか……やっぱりお金がいりますよね？"
"61100-231-マイア" = "それを、どうやって……。"
"61100-232-スバル" = "……。"
"61100-233-スバル" = "本当に知りたいのですか……？"
"61100-234-マイア" = "えっ……？は、はい……。"
"61100-235-スバル" = "知ってしまったら……もう無邪気な目では、物事を見られなくなるかもしれません……それでも、聞きたいですか？"
"61100-236-マイア" = "そ、そんなに怖い話だったんですか！？"
"61100-237-スバル" = "ふふっ、冗談ですよ、ごめんなさい。"
"61100-238-マイア" = "もう先輩～"
"61100-239-スバル" = "知らなかったことを知るというのは、視野が広がる代わりに――"
"61100-240-スバル" = "見なくてもよかったものまで、見えてくるということでもあります。"
"61100-241-スバル" = "そう……先生が言っていた、「勉強」のように。"
"61100-242-マイア" = "先輩……？"
"61100-243-スバル" = "変化には、どうしたってお金が必要です。"
"61100-244-スバル" = "誰だって、より良い生活を望むもの。#nだけど、悲しいですね……全員の欲望を満たそうにも、財貨には限りがあります。"
"61100-245-スバル" = "だから競争が生まれ、互いにいがみあう……。"
"61100-246-スバル" = "そして……必ず敗者が生まれ、いずれは存在すら忘れ去られていく……。"
"61100-247-スバル" = "……まるで、私たちのように。"
"61100-248-スバル" = "知っていますか？キヴォトスには、アリウスにしかできない――"
"61100-249-スバル" = "アリウスならではの仕事があるんですよ。"
"61100-250-スバル" = "独占市場って素敵です。だって、報酬は言い値ですから。"
"61100-251-マイア" = "え？仕事……？独占市場……？アリウスだけにできること……？"
"61100-252-マイア" = "せ、先輩、それって！？"
"61100-253-組織のボス" = "戻ったか。ちゃんと「処理」してきたんだろうな？"
