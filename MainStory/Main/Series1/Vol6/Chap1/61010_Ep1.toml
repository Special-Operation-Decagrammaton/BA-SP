[translation]
"61010-1" = "第1話;私たちの居場所"
"61010-2-？？？" = "はぁ……はぁ……#nっく……はぁ……。"
"61010-3-？？？" = "はあっ、はあっ……うぅっ……。"
"61010-4-？？？" = "くっ……！#nゴホッ、ゴホッ！ゲホッ、ゲホッ……！"
"61010-5-？？？" = "……少し、休んでから行こうかな。"
"61010-6-？？？" = "ふぅ……はぁ……#nはぁ……。"
"61010-7-？？？" = "……あは。"
"61010-8-？？？" = "外なら、なんとかなると思ってたのに。"
"61010-9-？？？" = "……そう。"
"61010-10-？？？" = "外に出たら、きっと何かが変わると思ってた。"
"61010-11-？？？" = "あの子たちが――"
"61010-12-？？？" = "スクワッドが選んだ道なら――きっと。"
"61010-13-？？？" = "私でも、歩いていけると思ったんだ。"
"61010-14-？？？" = "……雨。"
"61010-15-？？？" = "（寒い……）"
"61010-16-？？？" = "（指先の感覚が……）"
"61010-17-？？？" = "ダメ……行かなきゃ。#nまだ……。"
"61010-18-作業班長" = "ん？給料？何の話だ？"
"61010-19-作業班長" = "言っている意味がよく分からないな。#nそんな契約書を交わした覚えはないぞ。"
"61010-20-消費者金融" = "アリウスだぁ？聞いたこともねぇな？"
"61010-21-消費者金融" = "ってことはつまり、学籍がないも同然ってことだよな？#nへへ……こりゃ好き勝手できそうだな。"
"61010-22-組織のボス" = "これをやってこい。"
"61010-23-組織のボス" = "……できない？はぁ……期待外れだな。#nその手の訓練を積んできたんじゃないのか？"
"61010-24-組織のボス" = "どうして知ってるのかって？#n裏には裏の情報網があるってだけだよ。"
"61010-25-組織のボス" = "……はぁ？そういうことはしたくない？#n二度と裏の仕事には関わりたくない？"
"61010-26-組織のボス" = "ははっ、笑わせるなよ。#n仕事を選べる立場だとでも思ってるのか？"
"61010-27-組織のボス" = "唯一できることから逃げてどうする。"
"61010-28-組織のボス" = "……失せろ。仕事を受ける気がないなら、時間の無駄だ。"
"61010-29-？？？" = "……全部、思い上がりだった。"
"61010-30-？？？" = "うまくいくわけなんてないのに。"
"61010-31-？？？" = "世の中、そんなに簡単にいくわけなんてないのに。"
"61010-32-？？？" = "思い通りになんて……なるはずないのに……。"
"61010-33-？？？" = "思い上がって勘違いしてもいい……#nでも、代償は伴ってくるもの。"
"61010-34" = "[log=마이아 언노운]逃げた先に楽園なんてない。[/log]"
"61010-35" = "[log=마이아 언노운]そんなこと、分かってたはずなのに。[/log]"
"61010-36" = "[log=마이아 언노운]それでも……夢を見たかった。[/log]"
"61010-37" = "[log=마이아 언노운]希望はあるんだ、って……私も、信じてみたかった。[/log]"
"61010-38" = "[log=마이아 언노운][ff4444]でも……もしかしたら、それ自体が夢だったのかもしれない。[-][/log]"
"61010-39-？？？" = "ああ……。"
"61010-40-？？？" = "それでも、帰ってこれた。"
"61010-41-？？？" = "何かが変わったわけじゃないけど、気持ちは落ち着く……。"
"61010-42-？？？" = "――アリウス分校。"
"61010-43-？？？" = "私が育った場所――"
"61010-44-？？？" = "私が耐えてきた場所――"
"61010-45-？？？" = "私が――教えを受けた場所。"
"61010-46-？？？" = "私たちの――学園。"
"61010-47-？？？" = "……戻ったのですね。"
"61010-48-？？？" = "……え？"
"61010-49-？？？" = "まずはゆっくり休んでください。#n話はその後で。"
"61010-50-？？？" = "せん、ぱい……。"
"61010-51-？？？" = "スバル先輩……！"
"61010-52-スバル" = "はい、私です[ruby=かけはし]。梯ス[/ruby]バルですよ。"
"61010-53-スバル" = "もう大丈夫です、[ruby=たちぎ]立木[/ruby]マイアさん。#n安心してください。"
"61010-54-スバル" = "たとえ世界があなたを拒んでも……#n私とアリウスは、あなたを見捨てません。"
"61010-55-マイア" = "はい……っ、はい……！"
"61010-56" = "[log=스바루]おかえりなさい。[/log]"
"61010-57" = "[log=스바루][ff4444]私たちの――アリウスへ。[-][/log]"
"61010-58" = "次回;生徒の本分"
