[translation]
"61090-1" = "第9話;授業の時間"
"61090-2-サオリ" = "ふぅ……。"
"61090-3-スバル" = "うっ、ううっ……！"
"61090-4-サオリ" = "僅かな差だったが……。"
"61090-5-サオリ" = "これで、決着はついたはずだ。"
"61090-6-スバル" = "スクワッド……少し、鈍りましたか？"
"61090-7-サオリ" = "そうかもしれないな。"
"61090-8-サオリ" = "だが、お前たちほどじゃない。#n動きが全体的に精彩を欠いている。"
"61090-9-スバル" = "……！"
"61090-10-ミサキ" = "で、どうするつもりなの？"
"61090-11-ミサキ" = "「存在価値」は証明できたと思うけど。"
"61090-12-不安げなアリウスの生徒C" = "まあ、しょうがないとは思うけど……。"
"61090-13-不安げなアリウスの生徒B" = "あいつら、調子に乗って……！"
"61090-14-不安げなアリウスの生徒C" = "どうせ「外」でいろいろ経験してきたんでしょ。#n最初から勝敗なんて見えてたんだし。"
"61090-15-不安げなアリウスの生徒A" = "アリウスを捨てたくせに、今さら口出ししないでよ……！"
"61090-16-ミサキ" = "はぁ……。"
"61090-17-ミサキ" = "落ち着いて、ミサキ。"
"61090-18-ミサキ" = "これは、私たちが受け止めるべきことだよ。"
"61090-19-ミサキ" = "先生って大人もそう。#n勝手で、強引で……。"
"61090-20-ミサキ" = "「アリウスのため」とか言いながら、どうせ裏では別のこと考えてるんでしょ……。"
"61090-21-不安げなアリウスの生徒C" = "うわっ！？"
"61090-22-不安げなアリウスの生徒C" = "ちょ、ちょっと！？大丈夫！？"
"61090-23-不安げなアリウスの生徒B" = "気絶してる……。"
"61090-24-不安げなアリウスの生徒C" = "予備動作もなしに、胸へのダブルタップからのヘッドショット……。"
"61090-25-不安げなアリウスの生徒B" = "スバル先輩は鈍ったって言ってたけど……全然そんな感じじゃないよ……。"
"61090-26-アツコ" = "アツコ！？"
"61090-27-ヒヨリ" = "ひいいいぃぃっ！？"
"61090-28-アツコ" = "私たちのことは何と言おうと構わない。#nでも、先生のことも悪く言うのはやめてくれる？"
"61090-29-アツコ" = "そのくらいの分別は、あると思ってるよ。"
"61090-30-アツコ" = "私も、まだアリウスの一員なんだからね？"
"61090-31-不安げなアリウスの生徒C" = "は、はいっ！"
"61090-32-スバル" = "……。"
"61090-33" = "（みんな、どこか怯えたような顔で縮こまっている）"
"61090-34" = "（もう少し、明るい雰囲気で話をするためには……） "
"61090-35" = "[ns]\"よし、みんな！勉強をしよう！\""
"61090-36-スバル" = "勉強って……一体何をしろっていうんですか！？#n私たちにはなにもないんですよ！"
"61090-37-スバル" = "知識はない、教室もボロボロ。#n道具も、教える人すら……。"
"61090-38-スバル" = "……言葉にすると悲しくなりますね。"
"61090-39" = "[s1]\"大丈夫だよ。\"\n[s2]\"椅子と机と黒板さえあれば、どうとでもなるから。\""
"61090-40" = "[ns]\"それに、教える人もちゃんといるよ。\""
"61090-41-スバル" = "……本当にここでやるんですか？"
"61090-42" = "[s3]\"机はあるし、椅子も起こせば問題ない。\"\n[s4]\"教卓も黒板もある！完璧な教室じゃないかな？\""
"61090-43-スバル" = "「完璧」という言葉の定義が、私の知らない間に大きく変わったんでしょうか……。"
"61090-44-スバル" = "意味を調べようにも、辞書なんてアリウスにはほとんど残っていないわけですが……。"
"61090-45-スバル" = "いずれにせよ、今日はもういい時間です。#nもうすぐ夜になりますし……。"
"61090-46" = "[s5]\"初回は短めだから大丈夫だよ。\"\n[s6]\"出席を取って、軽くガイダンスをして終わりかな。\""
"61090-47-サオリ" = "それで本当に大丈夫なのか……？"
"61090-48" = "[s]\"大丈夫。私はサオリを信じてるよ！\""
"61090-49-ミサキ" = "！？"
"61090-50-ヒヨリ" = "！？"
"61090-51-サオリ" = "なぜこの流れで私の名前が出てくるんだ……？"
"61090-52" = "[s7]\"それは……選抜された教育実習の先生方が！\"\n[s8]\"1時間目の授業を行うからです！\""
"61090-53-アツコ" = "その選抜はいつの間に行われてたの？"
"61090-54-アツコ" = "今……？……ああ、なるほどね。"
"61090-55-サオリ" = "まさか、先生の話していた「壮大な計画」はこれのことだったのか！？"
"61090-56-ミサキ" = "勉強はちゃんとやってる？って、このための確認だったんだ……。"
"61090-57-ミサキ" = "もっと事前に打ち合わせするとかできたでしょ……はぁ……。"
"61090-58-サオリ" = "では、私は……私が……？"
"61090-59" = "[s]\"教えてください、サオリ先生！\""
"61090-60-アツコ" = "うん、教えてくださいな。サオリ先生。"
"61090-61-サオリ" = "アツコまで……！？"
"61090-62" = "（サオリは、ぎこちない表情ながらも教壇に立った）"
"61090-63-サオリ" = "（何をどう教えれば……）"
"61090-64-サオリ" = "（ん？これは……社会の教科書か。……社会文化、社会契約論？）"
"61090-65-サオリ" = "（できる……これなら！）"
"61090-66-サオリ" = "授業を始める！着席！"
"61090-67-アリウスの生徒B" = "え、本当に座らなきゃダメ？"
"61090-68-アリウスの生徒B" = "あ、私……もう座ってるんだけど……。"
"61090-69-サオリ" = "ノートを開け。無ければ生徒手帳でもいい！#nそれなら全員一冊ずつ持っているはずだ。"
"61090-70-サオリ" = "それすら無いなら、隣のやつのを後で写しておけ。"
"61090-71-サオリ" = "聞くだけと、手を動かすのとでは、残る知識の量がまったく違うからな。"
"61090-72-アリウスの生徒B" = "は、はいっ！"
"61090-73-アリウスの生徒B" = "まんま、教官やってた頃のサオリ先輩だ……。"
"61090-74-サオリ" = "授業に入る前に、一つ言っておくことがある。"
"61090-75-サオリ" = "契約書は！本当に重要だ！！"
"61090-76-サオリ" = "けいやくしょ……？"
"61090-77-アリウスの生徒B" = "なにそれ……外の文化……？"
"61090-78-サオリ" = "契約書とは、約束を忘れないために、相手と取り交わす書類のことだ。"
"61090-79-サオリ" = "これがなければ！どれだけ仕事こなしても！報酬を受け取れない！"
"61090-80-サオリ" = "苦労だけして、手ぶらで帰ってくるなんてザラだということだ！！"
"61090-81-アリウスの生徒B" = "魂のこもった叫びだ……。"
"61090-82-アリウスの生徒B" = "まさか……実体験……？"
"61090-83-ヒヨリ" = "頑張って、サッちゃん……！"
"61090-84-ヒヨリ" = "サオリ姉さん……！"
"61090-85-サオリ" = "……社会とは、実体のないものだ。#n構成員の契約で成り立っている、人工的な仕組みというのが「社会契約論」のメインだ。"
"61090-86-サオリ" = "つまり、最初から社会というものはなく、全ての人には生まれながらに与えられた固有の権利がある、ということだ。"
"61090-87-サオリ" = "あ、あのっ……質問、してもいいですか？"
"61090-88-サオリ" = "言ってみろ。"
"61090-89-マイア" = "最初からないって言いましたけど、それなら……生まれつきの権利も存在しないんですか……？"
"61090-90-サオリ" = "いい質問だ。たしかに一見、矛盾しているように聞こえるかもしれない。"
"61090-91-マイア" = "だが、こういう前提があると思ってほしい。"
"61090-92-サオリ" = "人間には生まれながらに権利がある、と「仮定する」ことが――"
"61090-93-サオリ" = "より良い社会を作る可能性を高めるのだと。"
"61090-94-アリウスの生徒B" = "実際は違っても、そうだと「考えてしまった方が」結果的にはいいってこと……？"
"61090-95-アリウスの生徒B" = "そんな風に考えたことなかった……！"
"61090-96-サオリ" = "時間だな。今日の授業はここまでだ。"
"61090-97-サオリ" = "質問があれば、次の授業で尋ねるといい。"
"61090-98-サオリ" = "予習は……まだ難しいだろうが、復習はしっかりやっておくように。"
"61090-99-サオリ" = "学習効果は、予習より復習のほうが高いからな。"
"61090-100-サオリ" = "その……どうだっただろうか……？"
"61090-101" = "[s9]\"最高でした、サオリ先生……。\"\n[s10]\"感動しました、サオリ先生……。\""
"61090-102-サオリ" = "「先生」と呼ばれるほど、私はまだ……。"
"61090-103-サオリ" = "ともかく、うまくやれていたなら、よかった。"
"61090-104" = "[ns]\"それじゃあ次は、物理担当のミサキ先生です！\""
"61090-105-ミサキ" = "……私？しかも物理って……冗談でしょ？"
"61090-106-ミサキ" = "は？弾道学は古典力学と近い……？"
"61090-107-ミサキ" = "……。"
"61090-108-ミサキ" = "完全に無関係でもないけどさ……。"
"61090-109-ミサキ" = "はぁ……やればいいんでしょ。"
"61090-110-ミサキ" = "まずは公式を覚えて。どうせ頭のスイッチ入ってないだろうし？"
"61090-111-ミサキ" = "内容の理解までは求めてないから！その領域にないし。"
"61090-112-ミサキ" = "数学も物理も、とりあえず暗記することが始まりだからね！"
"61090-113-ミサキ" = "まあ……もし最初から理解できるなら、そっちの道をおすすめするけど。"
"61090-114-ミサキ" = "でも、そういうタイプの子って、数値と統計で人を見ようとしたり――"
"61090-115-ミサキ" = "他人の気持ちを理解できなくて、余計な騒ぎを起こすこともあるけどね……。"
"61090-116-アツコ" = "こんにちは。生物の授業を担当する[ruby=はかり]秤[/ruby]アツコです。"
"61090-117-アツコ" = "早速授業を始めようか。#n生物学は楽しいし、とても大切な分野なんだよ。"
"61090-118-アツコ" = "例えば「細胞」とは何か？"
"61090-119-アツコ" = "打撲がどんなプロセスを経て治っていくのか――実例を見ながら。"
"61090-120" = "[s]\"アツコ！ストップ！ストップ！\""
"61090-121-アツコ" = "どうして止めるの？これは、すごく大事な話なんだよ？"
"61090-122-アツコ" = "ふふ、大丈夫。ちゃんと加減はわかってるつもり。"
"61090-123-アツコ" = "じゃあまずは「白血球と赤血球」から始めようか。"
"61090-124-アツコ" = "これで、細胞の構成要素とその役割についてはざっくり説明できたかな。"
"61090-125-アツコ" = "細胞は、生き物の一番基本になる単位とも言えるものだから、しっかり覚えておいてね。"
"61090-126-ヒヨリ" = "……。"
"61090-127-ヒヨリ" = "あ、あの……皆さん。えへへ……お久しぶりですね……。"
"61090-128-ヒヨリ" = "えっと、それで……。"
"61090-129-ヒヨリ" = "せ、先生！？わ、私はどうしたらいいんでしょうか……？"
"61090-130-ヒヨリ" = "私、普段は雑誌くらいしか読んでないですし……専門的に知ってることなんて……。"
"61090-131" = "[ns]\"……！\""
"61090-132" = "[ns]（雑誌と聞いて、ひらめいた）"
"61090-133-ヒヨリ" = "えっ？外の世界の暮らしについて話してみたら……って？"
"61090-134-ヒヨリ" = "雑誌で見た服とか……食べものとか……？"
"61090-135-ヒヨリ" = "……。"
"61090-136-ヒヨリ" = "はい！それなら……話せそうです……！"
"61090-137-ヒヨリ" = "あ、あらためて……こんにちは……。"
"61090-138-ヒヨリ" = "突然でびっくりしちゃうかもしれないんですけど……あの……。"
"61090-139-ヒヨリ" = "「ファッション」って、どう思いますか？"
"61090-140-ヒヨリ" = "えへへ……そ、そうですよね。突拍子もない話題ですよね……。"
"61090-141-ヒヨリ" = "でも、ファッションって……ただ服を着るんじゃなくて……#n他人からどう見られたいかを、自分で決めること……だと思うんです……。"
"61090-142-ヒヨリ" = "そういうのって意外と……大事なんじゃないかなって……。"
"61090-143-ヒヨリ" = "そ、それと……「外」の人たちの暮らし方とか……#n「生活」のことも……！"
"61090-144" = "（ヒヨリの講義は、4人の中で一番好評だった）"
"61090-145" = "（スクワッドのみんなが先生として活躍してくれたおかげか）"
"61090-146" = "（アリウスの生徒たちから「授業」への警戒心が薄れていくのを感じた）"
"61090-147" = "（まさに、この瞬間を待っていた！）"
"61090-148" = "[ns11]\"――なので、こういう結論が導き出せます。\"\n[ns12]\"自明であるということは――\""
"61090-149" = "（少なくない生徒たちが、しっかりと授業についてきてくれた）"
"61090-150" = "（……もちろん、真逆の生徒もいたけれど）"
"61090-151" = "（そのどちらもが「学園生活」なのだろうと思った）"
"61090-152" = "[ns]\"今日の授業はここまで！お疲れさまでした！\""
"61090-153-アリウスの生徒B" = "お疲れさまでした……。"
"61090-154-アリウスの生徒B" = "うーん……頭痛い……。"
"61090-155-アリウスの生徒A" = "でも、意外とやる価値あったかも？"
"61090-156-アリウスの生徒B" = "ちょっとノート見せて。"
"61090-157-アリウスの生徒A" = "さっき何やってたんだよ？"
"61090-158-アリウスの生徒B" = "いや、ちょっとボーッとしてて……。"
"61090-159-スバル" = "……。"
"61090-160-サオリ" = "とりあえず……ここは先生が自由に使ってくれ。"
"61090-161-サオリ" = "……すまない。こんな場所しか用意できなくて。"
"61090-162" = "[s13]\"寝袋を持ってきたから大丈夫だよ。\"\n[s14]\"ほら。うん、悪くない。\""
"61090-163" = "[ns]\"……サオリ？\""
"61090-164-サオリ" = "……先生。"
"61090-165-サオリ" = "ほんの少しでいい。"
"61090-166-サオリ" = "今日のことも含めて、相談したいことがあるんだが……いいだろうか。"
"61090-167" = "次回;傷と痕跡"
