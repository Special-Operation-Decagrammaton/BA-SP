[translation]
"42205-1-サキ" = "うりゃああああ――！！"
"42205-2-オトギ" = "FOX3、君の後輩、急に飛び出してきたよ？"
"42205-3-オトギ" = "狙撃手がいるのを知っていながら突撃するなんて……元気いっぱいでいいねぇ！"
"42205-4-クルミ" = "……あのバカ、一体何のつもり？"
"42205-5-オトギ" = "狙撃する？"
"42205-6-クルミ" = "いや、待って。相手が狙撃対策を講じているかもしれないと言ってたわよね。"
"42205-7-クルミ" = "それに……ポイントマンにはポイントマンが相手してあげないと。"
"42205-8-クルミ" = "FOX4、ここは私が引き受けるわ。後方支援をお願い。"
"42205-9-オトギ" = "承知。"
"42205-10-サキ" = "また会ったな、「先輩」。"
"42205-11-クルミ" = "……敵陣に進入する時は、相手に気づかれないよう隠れて突入しろって何回も言ったわよね。"
"42205-12-クルミ" = "はぁ……追加訓練が必要みたいね！"
"42205-13-サキ" = "進路が制限された状況下で敵の視野に入る場合、隠密行動は意味がない上に……"
"42205-14-サキ" = "先輩が使う45口径の拳銃では、私の防弾装備を貫通できないからな。"
"42205-15-クルミ" = "そうね。多少の被弾を覚悟して距離を縮めたのはいい判断よ。"
"42205-16-クルミ" = "でも、今の私は[ruby=つち]鎚[/ruby]じゃなくて、[ruby=かなとこ]鉄床[/ruby]なの。"
"42205-17-クルミ" = "狙撃にやられないよう、後頭部に気をつけることね！"
"42205-18-クルミ" = "……CQC、結構上達したわね。"
"42205-19-クルミ" = "懐に入って、副武装の代わりにストックを振るなんて……なかなかやるじゃない。"
"42205-20-サキ" = "先輩が教えてくれた事だからな。"
"42205-21-クルミ" = "一度教えたことは忘れないのね。さすが筆記満点の模範生。"
"42205-22-クルミ" = "こんなに優秀な後輩と一緒にいられないなんて……残念ね……"
"42205-23-サキ" = "それはこっちのセリフだ。"
"42205-24-サキ" = "SRTの復活のためとはいえ、先輩が市民の安全を脅かす選択をとるなんて……信じられない。"
"42205-25-クルミ" = "――鉄床や鎚が何を叩いているのか、考える必要なんてないわ。"
"42205-26-クルミ" = "銃口を向ける時は迷っちゃダメよ！"
"42205-27-クルミ" = "（……よし、このまま時間を稼いで弾丸の枯渇を誘導してからの――）"
"42205-28-クルミ" = "ほら、こっちを見なさい――"
"42205-29-クルミ" = "はいっ、チーズ！"
"42205-30-サキ" = "くっ……！"
"42205-31-クルミ" = "……サキ、あんたは真面目すぎる。"
"42205-32-クルミ" = "射撃も、隠れる場所も教範通りだから、#nあんたが次に打つ手は手にとるように分かるわ。"
"42205-33-クルミ" = "そういうヤツが多いから、ベテランになるのは容易じゃないって言われてるわけ。"
"42205-34-サキ" = "……これで勝ったとでも？"
"42205-35-クルミ" = "へぇ……まだアテがあるの？"
"42205-36-クルミ" = "あ、もしかして……あの気弱な狙撃手の支援射撃を期待してるの？"
"42205-37-クルミ" = "私に怪我を負わせるくらいはできると思うけど、狙撃で戦況を覆すのは難しいわよ。"
"42205-38-クルミ" = "むしろ、そんな事したら逆狙撃されるかもしれないわけだし……"
"42205-39-サキ" = "……先輩は、同じ小隊の戦友をどの程度信頼しているんだ？"
"42205-40-クルミ" = "急に何？"
"42205-41-サキ" = "うちのミユは、本気で隠れたら誰にも見つけられないんだ。"
"42205-42-サキ" = "CQBとか対人戦術ならともかく、狙撃は絶対に失敗しないという確信がある。"
"42205-43-サキ" = "……本当に何とも思わないのか？#n今頃、オトギ先輩が支援射撃をしていてもおかしくないはずなのに。"
"42205-44-サキ" = "ああ、もしかしたら――うちの暗殺者が、もうオトギ先輩を始末し終えたのかもな。"
"42205-45-クルミ" = "………！"
"42205-46-クルミ" = "FOX4、無事なの？FOX4！"
"42205-47-オトギ" = "……ん？なんともないよ？"
"42205-48-オトギ" = "狙撃対策があるかもしれないから発砲しないで待機、だよね？"
"42205-49-クルミ" = "よかった、オトギがやられたのかもと思って……"
"42205-50-クルミ" = "あ。"
"42205-51-サキ" = "さっき先輩が教えてくれた言葉、そのまま返す。#n銃口を向ける時は迷わない――"
"42205-52-サキ" = "……隊員を最後まで信頼できなかったのは、先輩の方みたいだな。"
"42205-53-オトギ" = "FOX3、ダウン。"
"42205-54-オトギ" = "クルミ、後輩の前だからってカッコつけすぎたんじゃない？#nこんな簡単にやられちゃうなんて。"
"42205-55-オトギ" = "……ま、仕方ないか。#n残りのターゲットは、バックアップの私が処理しますよっと。"
"42205-56-オトギ" = "デコイドローン、設置完了。ECCM対策も万全……#nこれで逆狙撃される心配はない。"
"42205-57-オトギ" = "さて、と。#nとりあえず、ポイントマンから処理しよっかな。"
"42205-58-オトギ" = "……そういや、RABBIT小隊の狙撃手はどこだろ？"
"42205-59-ミユ" = "あの……ここです……"
"42205-60-ミユ" = "う、うわっ……？"
"42205-61-オトギ" = "い、いつの間に……？というか、どうしてここに……！？"
"42205-62-ミユ" = "その……私も支援射撃のために狙撃ポイントを探してて……"
"42205-63-ミユ" = "先輩が先に来ていたので……後ろで話しかけるタイミングをずっと伺ってました……。"
"42205-64-ミユ" = "でも……色々とお取り込み中でしたので……なかなか話しかけられなくて……"
"42205-65-オトギ" = "敵の視界を避けて接近するとかでもなく、ずっと背後で待っていたの……？"
"42205-66-オトギ" = "ミユ、恐ろしい子……"
"42205-67-ミユ" = "やっぱり、私なんて誰にも気づかれないから……いつかはみんなの記憶から消えてしまうんです……"
"42205-68-ミユ" = "でも……この体質で良かったと思っています。"
"42205-69-ミユ" = "誰にも気づかれなかったおかげで……小隊のみんなを、助けられました。"
"42205-70-ミユ" = "……ごめんなさい、先輩。"
"42205-71-オトギ" = "ちょ、ちょっと待って……！"
"42205-72-ニコ" = "……FOX3、FOX4、ダウン。"
"42205-73-ニコ" = "まさかここまで後輩たちに追い詰められるなんて思わなかった。"
"42205-74-ニコ" = "事前に中央エレベーターの制御コンソールを止めておいて良かった……"
"42205-75-モエ" = "うわ、何これ。反応するノードが一個もないんだけど？"
"42205-76-モエ" = "まさか、オフラインモードに強制的に切り替えてる！？"
"42205-77-ニコ" = "ごめんね、モエちゃん。このエレベーターは使用禁止なんだ。"
"42205-78-ニコ" = "今日は先約があるからね。"
"42205-79-モエ" = "……ニコ先輩？これ、先輩の仕業だよね？"
"42205-80-ニコ" = "モエちゃんのハッキングの腕は私もよく知ってるよ。時間さえあれば、このコンソールのセキュリティホールを見つけちゃうだろうから……"
"42205-81-ニコ" = "外部から接続できないよう、物理的に回線を切らせてもらったの。ごめんね。"
"42205-82-モエ" = "こんな卑怯な手を使うなんて……"
"42205-83-ニコ" = "……オペレーションルームに向かうこの通路は、ハッキングじゃどんな手を使っても開けられないよ。"
"42205-84-ニコ" = "それと……そこにいたらカイザーセキュリティの増援がやってくる。"
"42205-85-ニコ" = "悪い事は言わないから、その前に他の後輩と一緒に帰って。"
"42205-86-モエ" = "……先輩の言う通りなら、このドアは電子的な方法では絶対に開かないってことだよね？"
"42205-87-モエ" = "くひひ……最高じゃん。むしろ望むところだよ。"
"42205-88-ニコ" = "あの、モエちゃん……？いったい何を考えて……"
"42205-89-モエ" = "どんなに命令しても開かない堅牢なドアを……圧倒的な力で無理矢理こじ開けるとか……"
"42205-90-モエ" = "めちゃくちゃになっちゃいそうで……想像するだけでゾクゾクする……はぁ、はぁ……"
"42205-91-ニコ" = "このエレベーターは電子ドアだから、物理的な方法では開かないよ？"
"42205-92-モエ" = "物理的な方法が通じないっていうのはさ……通じるまでぶち込めばいいってことだよね？"
"42205-93-モエ" = "爆薬なら山ほどあるからさぁ！"
"42205-94-モエ" = "どれどれぇ……今1ポンドのセムテックスが10個くらいあるから……"
"42205-95-モエ" = "これ、ぜーんぶドアに貼って爆発させちゃお！"
"42205-96-ニコ" = "そ、そんなに爆薬をいっぱい使ったら……ドアにダメージは入るかもだけど……"
"42205-97-ニコ" = "その前に、君たちまで爆発に巻き込まれるかもしれないよ！？"
"42205-98-モエ" = "大丈夫！うちの隊員はこういうの、慣れてるし！"
"42205-99-ニコ" = "慣れているとしても、自分が危険に晒されるかもしれないのにブリーチングを試みるなんて……"
"42205-100-ニコ" = "常識的に考えてあり得な――"
"42205-101-モエ" = "けほ、けほっ……開いたぁ♪"
"42205-102-ミヤコ" = "あ……開いたというより……"
"42205-103-ミヤコ" = "無理やりこじ開けたというのが、正しいですが……"
"42205-104-ミヤコ" = "信じて任せるとは言いましたが……ありったけのプラスチック爆薬をここで全部使ってしまうなんて思いませんでした。"
"42205-105-サキ" = "まあ、FOXの先輩もこんなバカみたいなブリーチングは初めて見ただろうな。"
"42205-106-サキ" = "まさか破滅を恐れないモエの気質がこんなところで役に立つとは……"
"42205-107-モエ" = "何それ、バカにしてるの？"
"42205-108-サキ" = "褒め言葉だよ、褒め言葉。"
"42205-109-サキ" = "……グッジョブ、RABBIT3。"
"42205-110-モエ" = "ま、そっちもすごかったよ。RABBIT2。"
"42205-111-ミヤコ" = "エレベーターへの道が確保されましたので、ラペルリングでオペレーションルームの前まで降下します！"
"42205-112-ミヤコ" = "みなさん、ケーブルにハーネスを結んでください。"
"42205-113-ミヤコ" = "それでは……引き続き進入します！"
"42205-114" = "次回;カルバノグの洞窟（２）"
