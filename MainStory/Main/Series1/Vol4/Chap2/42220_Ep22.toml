[translation]
"42220-1" = "第22話;昨日と明日の私たち"
"42220-2" = "<警告！侵入者自動迎撃システムが無力化されました。>"
"42220-3" = "<サイロの保安担当者は主要隔壁を閉鎖し、機密文書を破棄した後、侵入者の措置を……>"
"42220-4-ユキノ" = "（……私は、何のためにここに残っているんだ？）"
"42220-5-ユキノ" = "（ただ、SRT特殊学園を復活させるために……命令を遂行し続けただけなのに……）"
"42220-6-ユキノ" = "（……どうして、ここで自爆ボタンを持って立っているんだ？）"
"42220-7" = "<繰り返し警告します。態勢Zを発令します。サイロの保安担当者は主要隔壁を閉鎖し……>"
"42220-8-ユキノ" = "……そうだ。深く考える必要はない。"
"42220-9-ユキノ" = "これまでもそうしてきたように……作戦を成功させるために必要なものだけを残して、後は捨てればいい。"
"42220-10-ユキノ" = "今回の作戦の目標は……"
"42220-11-ユキノ" = "……この弾頭を起爆させること。"
"42220-12-？？？" = "……お待たせ！"
"42220-13-ユキノ" = "FOX4……？#nどうしてここに……"
"42220-14-オトギ" = "後輩に会わないよう、ダクトで迂回してきたからちょっと遅れちゃった。"
"42220-15-オトギ" = "やっぱり非常時でもWエリアは閉鎖されてないみたいだよ。"
"42220-16-クルミ" = "いたたっ……サキ、あいつ私が倒れてるっていうのに、お腹に5発も撃つとか最悪！"
"42220-17-クルミ" = "相手が動かなくなるまで制圧しろとは教えたけど……ちょっとひどすぎない？"
"42220-18-ニコ" = "倒れた敵を下手に処理して逆襲されるなんて、屋内戦あるあるだからね。"
"42220-19-ニコ" = "サキちゃんが教範通りちゃんと処理したんだから、あまり怒らないであげて。"
"42220-20-ユキノ" = "なぜ……"
"42220-21-ユキノ" = "なぜ戻らなかった？"
"42220-22-オトギ" = "えっ……"
"42220-23-オトギ" = "……隊長がここにいるから？"
"42220-24-ユキノ" = "敵が防御を突破したら、地上に出ろと命令したはずだが――"
"42220-25-クルミ" = "……ユキノ。あんた、ここで責任を負って弾頭を起爆させるつもりよね？"
"42220-26-クルミ" = "――命を落とすかもしれないっていうのに。"
"42220-27-ユキノ" = "………。"
"42220-28-ユキノ" = "……作戦に不要な情報だ。#n君たちが知る必要は――"
"42220-29-クルミ" = "ある！"
"42220-30-クルミ" = "ユキノはFOX小隊の隊長である前に……私たちの親友でしょ？"
"42220-31-クルミ" = "親友が、一人で責任を負うために深淵に飛び込もうとしてるっていうのに……そのまま放ってなんておけないわよ。"
"42220-32-ユキノ" = "ベテラン特殊部隊員らしからぬ発言だな。"
"42220-33-ユキノ" = "それを判断するのは隊員個人ではなく、責任を取れる――"
"42220-34-ニコ" = "ユキノ。"
"42220-35-ニコ" = "この作戦は、最初から倒れていたよ。"
"42220-36-ニコ" = "私たちはSRTを復活させるという大義のために、手を汚しすぎた。"
"42220-37-ニコ" = "こんなに汚れちゃった手で、SRTの正義を論じるのは難しいけど……"
"42220-38-ニコ" = "責任から逃れるために……友達を犠牲にしたなんて罪まで背負いたくないよ。"
"42220-39-ニコ" = "もちろん、後輩にこの責任を押しつけるのはもっと嫌。"
"42220-40-ニコ" = "この汚名は、私たちが背負って……あの子たちを帰してあげよう。"
"42220-41-ユキノ" = "……そうか。"
"42220-42-オトギ" = "すべては……"
"42220-43-一同" = "SRT特殊学園復活のために！"
