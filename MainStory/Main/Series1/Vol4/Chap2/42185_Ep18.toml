[translation]
"42185-1-カイザーセキュリティガードA" = "な、何だこいつら！一体どこから現れてどこに消えてるんだ！？"
"42185-2-カイザーセキュリティガードA" = "駅の構内図は完璧に把握しているはずなのに……ヤツらだけが知っている隠し通路があるとでもいうのか！？"
"42185-3-キリノ" = "もちろんです！"
"42185-4-カイザーセキュリティガードA" = "いつの間に――"
"42185-5-キリノ" = "古い駅は増築を重ねていますから、地図に載っていない通路やスペースがたくさんあるのです！"
"42185-6-キリノ" = "こういう場所は犯罪が起こりやすい傾向にありますので、#n生活安全局の生徒は把握しておりまして……#nまさか、こんな所で役に立つとは思いませんでしたが！"
"42185-7-キリノ" = "あっ、フブキ！2階に敵……いえ、不良乗客が向かっています！"
"42185-8-フブキ" = "うんうん、見てるよ～"
"42185-9-フブキ" = "エスカレーターを突っ切るつもりなのかな？危ないよ～"
"42185-10-カイザーセキュリティガードB" = "クソッ！目に物見せてやる！"
"42185-11-フブキ" = "あ、ちょっとたんま。#nこのエスカレーター、古すぎるからさぁ。"
"42185-12-フブキ" = "たま～に緊急停止しちゃうんだ。"
"42185-13-カイザーセキュリティガードB" = "う、うわぁっ！？"
"42185-14-フブキ" = "だから、安全のためにエスカレーターは立ち止まって利用してね。#n文化市民の常識だよ。"
"42185-15-カイザーセキュリティガードC" = "この生活安全局の寄せ集めどもめ……こんなやり方で我々を弄ぶなんて……"
"42185-16-カイザーセキュリティガードC" = "許さんぞッ！"
"42185-17-フブキ" = "あっ、危な――"
"42185-18-デカルト" = "「所確幸」を忘れるなんて、カイザーコーポレーションのエリートもまだまだですね！"
"42185-19-デカルト" = "我々に対する侮蔑と迫害が続いたとしても……団員が全員逃げて私一人だけ取り残されたとしても……「所確幸」の闘争は続くのです。"
"42185-20-デカルト" = "キヴォトスの誰もが働かず、所有しない――無所有の悦びに気付くその日まで！"
"42185-21-フブキ" = "働かないで済む生き方を追求するなんて、素敵な話じゃん。"
"42185-22-デカルト" = "お、無所有の生き方に興味があるのですか？#n我々はいつだって新しい修道者を歓迎します！"
"42185-23-デカルト" = "……ただ、「所確幸」に入るためには、己の無所有を証明するために所持品を[ruby=・  ・]少し[/ruby]降ろさないといけませんがね。"
"42185-24-フブキ" = "（う～ん、なんだか雲行きが怪しく……）"
"42185-25-ミヤコ" = "……クリア。上りホーム側も片付けました。"
"42185-26-ミヤコ" = "生活安全局の皆さん、ありがとうございました。#nおかげさまで怪我せず、無事ホームにたどり着けました。"
"42185-27-キリノ" = "いえいえ！本官は駅構内でトラブルを起こす不良乗客を取り締まっただけですから。"
"42185-28-キリノ" = "むしろ業務へのご協力、感謝します！"
"42185-29-ミヤコ" = "……今日、キリノさんが披露された[ruby=近接戦闘]CQB[/ruby]の腕前は、なかなか印象的でした。"
"42185-30-キリノ" = "C、CQBですか……？#n本官は習った覚えがないのですが……"
"42185-31-ミヤコ" = "出入口が封鎖された状況で素早く経路を把握し、#n犯人が対応する前に奇襲するのはCQBの基本。"
"42185-32-ミヤコ" = "以前から思っていたのですが、キリノさんの対応能力はSRTの誰よりも優れていると思います。"
"42185-33-ミヤコ" = "犯罪発生時に誰よりも早く現場に現れるという生活安全局の話は嘘ではなかったんですね。"
"42185-34-キリノ" = "そ、そうなのですか……？"
"42185-35-キリノ" = "本官はただ、パトロールを早く終わらせて美味しいものを食べようと……"
"42185-36-キリノ" = "……。"
"42185-37-キリノ" = "……まあ、でも！#n生活安全局の一員として、それなりの誇りは持っております！"
"42185-38-ミヤコ" = "ええ。公園の住人として、いつもお世話になっています。"
"42185-39-ミヤコ" = "それでは……引続きよろしくお願いしますね。"
"42185-40-キリノ" = "はいっ！"
"42185-41" = "次回;アビス"
