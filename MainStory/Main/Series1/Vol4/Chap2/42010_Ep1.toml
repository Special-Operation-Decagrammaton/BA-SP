[translation]
"42010-1" = "第1話;キツネの見る夢"
"42010-2" = "D.U.郊外、カイザーインダストリー第2工場前"
"42010-3" = "（――2年前）"
"42010-4-クロノスの記者生徒" = "みなさん、こんにちは！キヴォトスいち正確なニュースを#nいち早くお届けするクロノス報道部です！"
"42010-5-クロノスの記者生徒" = "本日はここ、カイザーインダストリー第2工場前から生中継で#nお伝えします。"
"42010-6-クロノスの記者生徒" = "第2工場はカイザーインダストリーの弾薬生産の約3割を占める工場ですが――"
"42010-7-クロノスの記者生徒" = "近年、この工場で連邦生徒会条例に反する大量破壊兵器が開発されているのではないかという疑惑が広まっております。"
"42010-8-クロノスの記者生徒" = "カイザーインダストリー側はこの事実を強く否定しておりますが、#n反証の証拠もなく、市民の不安は晴れません。"
"42010-9-クロノスの記者生徒" = "早期解決が求められておりますが、ヴァルキューレ警察学校の捜査は難航しているようです。また、連邦生徒会長が特別捜査チームを派遣したという噂も囁かれており――"
"42010-10-クロノスの記者生徒" = "わわっ！い、いま工場から爆発が……！"
"42010-11-クロノスの記者生徒" = "一体何があったのでしょうか？#nまさか、噂の大量破壊兵器が――"
"42010-12-クルミ" = "けほっ、けほっ……。"
"42010-13-クルミ" = "オトギ、ちょっとコレどういうこと？#n出口にブービートラップがあるなんて聞いてないんだけど！"
"42010-14-オトギ" = "それ、今言おうとしてたんだけどねぇ。"
"42010-15-クルミ" = "もっと早く言って！"
"42010-16-ニコ" = "はぁ、はぁ……クルミちゃん、突っ走りすぎだよ……。"
"42010-17-ユキノ" = "全員、怪我は……大丈夫そうだな。#n作戦終了後でよかった。"
"42010-18-クロノスの記者生徒" = "たった今、弾薬工場から武装した生徒が現れました！"
"42010-19-クロノスの記者生徒" = "彼女らが、例の特別捜査チームなのでしょうか！？"
"42010-20-クロノスの記者生徒" = "こちらクロノス報道部です！#n――すみません！何か一言お願いします！"
"42010-21" = "あはは……囲まれちゃったみたいだね？"
"42010-22" = "……仕方ない。#nこれを機にSRTの紹介をするのも悪くない、か。"
"42010-23" = "SRTといえば……連邦生徒会長が発足したという特殊部隊でしたね？"
"42010-24" = "ええ、その通りです。"
"42010-25" = "――キヴォトスの皆様、はじめまして。#nSRT特殊学園、FOX小隊の小隊長、[ruby=しちど]七度[/ruby]ユキノと申します。"
"42010-26" = "SRT特殊学園は、連邦生徒会長の認可の下、#nヴァルキューレ警察学校や各自治区の風紀委員では対応が難しい#nD.U.地区の犯罪に対応するべく設立されました。"
"42010-27" = "D.U.の犯罪に対応する……ということは、#nこれからはSRT特殊学園がヴァルキューレ警察学校の代わりになるのでしょうか？"
"42010-28" = "……いいえ。#n私たちはあくまでヴァルキューレ警察学校の手の届かない所で起こる犯罪や、#n今回のように機先を制する必要がある事件に対応するチームに過ぎません。"
"42010-29" = "なるほど、ご説明ありがとうございます。#n次に、この第2工場のことをお伺いしたいと思います。"
"42010-30" = "ずばり、ここで法に反する大量破壊兵器が開発されているというのは事実でしょうか？"
"42010-31" = "ええと……。"
"42010-32" = "まあ今回の事件については口止めされてないし大丈夫かな。"
"42010-33" = "……数日前、匿名の情報提供があり、カイザーインダストリー第2工場にて#n条例に違反する強力な爆弾の保管を示す有力な証拠を入手しました。"
"42010-34" = "カイザーインダストリーは昨年発表した<A.N.T.I.O.C.H.>、#n旧型サーモバリック手榴弾の改良事業の際、弾道ミサイル用サーモバリック弾を#n製作していました。ここに保管されているのは、その試作品だったのです。"
"42010-35-クルミ" = "でも、私たちが無力化させてきたから、もう大丈夫。"
"42010-36-クロノスの記者生徒" = "弾道ミサイル用サーモバリック弾……#nそれは一体、どれほどの威力を持つのでしょうか？"
"42010-37-ニコ" = "試作品ですから、正確な数字は不明ですが――"
"42010-38-ニコ" = "弾頭の大きさと既存の研究データから推測するに、#n爆発の影響範囲は半径数kmに達するかと。"
"42010-39-クロノスの記者生徒" = "そ、それほどの爆弾を、小隊規模で処理するなんて……#nさすがに危険過ぎるのでは……？"
"42010-40-クロノスの記者生徒" = "防護服の工兵中隊を投入すべき案件に思えますが……。"
"42010-41-ユキノ" = "いえ……逆に、この規模の爆弾はどれほど多くの兵を投入しても無意味です。"
"42010-42-オトギ" = "そ・こ・で！#n私たちSRTの出番というわけなんですよ！"
"42010-43-オトギ" = "SRTの小隊は少数精鋭のチームで構成されています。#nなので、今回のように相手に気付かれる前にターゲットを確保したり、制圧できるんです。"
"42010-44-ニコ" = "実際、今回の作戦でも3分足らずで弾頭の確保ができましたからね。"
"42010-45-クルミ" = "……2分45秒。"
"42010-46-クルミ" = "途中の交戦がなかったら、更に15秒は短縮できたはずよ。"
"42010-47-オトギ" = "あ～、クルミが警備兵に煙幕弾を閃光弾と間違えて投げちゃったからねぇ？"
"42010-48-クルミ" = "別に間違ってないわよ！#nあいつ、閃光対策の特殊バイザー着けてたの。"
"42010-49-クルミ" = "それに、ダブルタップしてなかったら、逆にこっちがやられてたじゃない。"
"42010-50-クルミ" = "というか、オトギが先に警備兵を倒してくれてたら済んだ話でしょ？"
"42010-51-オトギ" = "あれは……弾薬を数え忘れちゃっててつい……"
"42010-52-オトギ" = "敵の数が予測できない状況でやらかしちゃう#nキュートな狙撃手あるあるっていうかぁ……"
"42010-53-クルミ" = "真面目にやりなさいよ！"
"42010-54-ニコ" = "オトギちゃん、クルミちゃん……カメラの前でケンカするのはちょっと……。"
"42010-55" = "……コホン。#nとにかく、今回の作戦は少数の人員で進められたため、#n犯人確保と真相の把握を迅速に行うことができたのです。"
"42010-56" = "今回の作戦中に入手した機密文書……#nそこには、複数のメンバーが金品を受け取り、弾薬工場の安全報告書を捏造していたことが書かれていました。"
"42010-57" = "そしてそのメンバーには、カイザーグループの幹部だけでなく、#n防衛室の関係者も挙げられていたのです。"
"42010-58" = "防衛室といえば……連邦生徒会ではありませんか？"
"42010-59-クロノスの記者生徒" = "結果として連邦生徒会の安全保障に穴が発見されたわけですが……#n連邦生徒会長の指示で動くSRTがこういった情報を開示しても良いのでしょうか？"
"42010-60-ユキノ" = "……問題ありません。"
"42010-61-ユキノ" = "正義とは、理にかなった正しい道理のこと。"
"42010-62" = "SRTの正義は、いかなる状況でも揺らぎはしません。"
"42010-63-ユキノ" = "………。"
"42010-64-ニコ" = "あっ、ユキノちゃん。おはよう。"
"42010-65-ユキノ" = "……時刻は？"
"42010-66-ニコ" = "キヴォトス標準時で……0315。"
"42010-67-ニコ" = "まだ最後の[ruby=ねずのばん]不寝番[/ruby]まで時間あるよ。もう少し寝たら？"
"42010-68-ユキノ" = "いい、睡眠は十分に取れた。"
"42010-69-ニコ" = "……良い夢を見たんだね。"
"42010-70-ユキノ" = "どうしてそう思うんだ？"
"42010-71-ニコ" = "寝ている間、幸せそうだったから。"
"42010-72-ユキノ" = "……いや、悪夢だった。"
"42010-73-ユキノ" = "温室の中で過ごしていた時に見た、甘い悪夢。"
"42010-74-ニコ" = "……そっか。"
"42010-75-ユキノ" = "――FOX4、報告を。"
"42010-76-ユキノ" = "はいはーい、こちらFOX4。#n現在、連邦生徒会に変わった動向なし。"
"42010-77-オトギ" = "相変わらずパニック状態だよ。#n巨大な塔が落ちてからずっとだねぇ。"
"42010-78-オトギ" = "特に連邦生徒会長代行のリン行政官は、一番混乱していた状況にいなかったから、#n連邦生徒会内でも非難の的だよ。"
"42010-79-オトギ" = "それもあって、彼女が提案したD.U.総合復旧政策も難航してるみたい。"
"42010-80-オトギ" = "まあ……私たちがSRT特殊学園閉鎖直前にサンクトゥムタワーを襲撃した時、#nリン行政官の支持派を念入りに攻撃したから、彼女を[ruby=ひご]庇護[/ruby]する人があまり残っていないっていうのもあるだろうけど。"
"42010-81-ユキノ" = "了解した。#n――行政委員会の主要部署の現状は？"
"42010-82-オトギ" = "うーん、そっちも前と同じかなぁ。#n文化室と保健室は前回の襲撃で室長が怪我をしたから、今は次長が業務を代行してるよ。"
"42010-83-オトギ" = "でもまあ、次長って立場じゃ発言権は期待できないと思うけどね。#n業務自体の支障はないだろうけど。"
"42010-84-ユキノ" = "なら安心だな……引き続き監視を頼む。"
"42010-85-オトギ" = "その……小隊長、いやFOX1。"
"42010-86-オトギ" = "もしもの話だけどさぁ……"
"42010-87-オトギ" = "休職中の室長たちが復帰したらどうするの？"
"42010-88-オトギ" = "そうなったら……カヤ室長、かなり困っちゃうよね……？"
"42010-89-ユキノ" = "はぁ……非常時に備えた緊急プロトコルは前に伝えたはずだろう。"
"42010-90-ユキノ" = "「行政委員会の役員のうち、[ruby=なながみ]七神[/ruby]行政官を支持する役員は、#n[ruby=・   ・]常に[/ruby][ruby=しらぬい]不知火[/ruby]室長を支持する役員より多くならない。」"
"42010-91-ユキノ" = "[ruby=なながみ]七神[/ruby]行政官を支持する勢力が復帰しようとしたら、#n「動けなくなる程度」に措置すること。"
"42010-92-オトギ" = "……FOX4、了解。"
"42010-93-ユキノ" = "――FOX3、報告を。"
"42010-94-ユキノ" = "こちらFOX3、予定通り北山区の鉄道車両基地にEMP爆弾を設置して運行管理システムを無力化。主要電子設備の[ruby=サボタージュ]破壊工作[/ruby]も完了してる。"
"42010-95-クルミ" = "EMP爆弾は起爆後すぐに回収したから、#n当分はエンジニアたちも故障の原因を突き止められないはずよ。"
"42010-96-ユキノ" = "ご苦労。市民の反応は？"
"42010-97-クルミ" = "事故の原因が発表されていないから、#n連邦生徒会のミスだと思っているみたい。"
"42010-98-クルミ" = "今SNSの投稿を確認してるけど、結構炎上してるわね。#n交通室長と連邦生徒会長代行の批判で溢れかえってる。"
"42010-99-ユキノ" = "了解。#nでは、FOX3は直ちにHQに復帰せよ。"
"42010-100-クルミ" = "ねえ、変なこと言うかもしれないけど……本当にこのまま進めて大丈夫なの……？"
"42010-101-クルミ" = "さっきも電車が止まっちゃって、病院に行けずに困ってる人が……"
"42010-102-ユキノ" = "――それは、作戦進行に重要な事項か？"
"42010-103-クルミ" = "……なんでもない。#nFOX3、報告は以上。"
"42010-104-ニコ" = "ユキノちゃん……私たち、本当にこのままでいいのかな？"
"42010-105-ユキノ" = "……何が？"
"42010-106-ニコ" = "SRT特殊学園を復活させるためだとしても、市民にこれだけ危害を加えるのは……"
"42010-107-ニコ" = "やっぱり……正義じゃない気がするよ。"
"42010-108-ユキノ" = "……その疑問は、作戦進行に不要だ。"
"42010-109-ユキノ" = "私たちは命令に従い、作戦を遂行する武器。#nそして刃の先を向ける相手を選ぶのは武器ではなく[ruby=つか]柄[/ruby]を持つ者の役目。"
"42010-110-ユキノ" = "相手を見て躊躇う武器など――武器としての価値がない。"
"42010-111-ユキノ" = "物事の善悪とは、責任を持てる者だけが判断するものだ。"
"42010-112-ニコ" = "………。"
"42010-113-ユキノ" = "気が引けるなら辞めても構わない。#n私は――FOX小隊は、作戦を続行する。"
"42010-114-ニコ" = "……FOX2、承知しました。"
"42010-115-ユキノ" = "さて、残るは……。"
"42010-116-ユキノ" = "RABBIT小隊の処理だけか。"
"42010-117-クルミ" = "RABBIT小隊？"
"42010-118-オトギ" = "なになに、もしかして後輩の話？"
"42010-119-ユキノ" = "……FOX3、FOX4。今は呼び出していないんだが。"
"42010-120-ユキノ" = "ごめん、急に面白そうな話が聞こえちゃったからさ～"
"42010-121-クルミ" = "後輩に会いに行くの？#n私も一緒に行きたい！"
"42010-122-ユキノ" = "はぁ……。"
"42010-123-ニコ" = "まあ、ちょうど落ち着いたところだし、#n久々にみんなで一緒に動くのもいいんじゃない？"
"42010-124-ニコ" = "FOX3の作戦は終わったし、#nFOX4もD-Dayの後は特に動く必要はないし……。"
"42010-125-オトギ" = "あっ！そういえばさ、RABBIT小隊は例の歓迎会もやっていないんじゃない？"
"42010-126-クルミ" = "ああ、SRT慣例の新入りと「遊んで」あげる会ね。"
"42010-127-ニコ" = "ふふっ、そうだったね。#nならパーティ用においなりさんいっぱい作ろっと！"
"42010-128-ユキノ" = "……まあ人数は多い方がいいか。"
"42010-129-ユキノ" = "なら、FOX3とFOX4は今の任務を終え次第HQに復帰、#n再整備してすぐに「ウェルカムパーティー」の準備を始めるように。"
"42010-130-オトギ＆クルミ" = "了解！"
"42010-131-ユキノ" = "久方ぶりの[ruby=かいこう]邂逅[/ruby]だ、後輩たちを盛大に迎えてやろう。"
"42010-132" = "次回;ウサギの見る夢"
