[translation]
"41185-1" = "[ruby=Tango]T3[/ruby]、ダウン！"
"41185-2" = "確認しました、RABBIT2は次の遮蔽物まで前進を！"
"41185-3" = "了解！"
"41185-4" = "それ以外の隊員は、5秒間現在地で！"
"41185-5" = "3……2……1……"
"41185-6" = "サキ、今です！フォックストロット投下！"
"41185-7" = "了解！閃光弾、いくぞっ！"
"41185-8-ミヤコ" = "ミユ、5時の方向にスナイパーです！"
"41185-9-ミユ" = "あ、了解……！"
"41185-10-ミユ" = "ごめん、その前にリロードする……！"
"41185-11-ミヤコ" = "了解です。サキ、援護射撃を！"
"41185-12-サキ" = "任せろ！"
"41185-13-警備局の生徒A" = "あいつら何者！？"
"41185-14-警備局の生徒A" = "くそっ、この数で圧倒できないって……どういう状況なわけ！？"
"41185-15-警備局の生徒B" = "こっちのホームで押されてるとか、意味が分からない……！"
"41185-16-警備局の生徒B" = "このままじゃエントランスまで押される！"
"41185-17-警備局の生徒A" = "大丈夫、もうすぐ警備局の増援が来るはず！"
"41185-18-警備局の生徒A" = "到着し次第、波状攻撃で押し出すよ！"
"41185-19-ミヤコ" = "……西側から多数の足音を確認。"
"41185-20-ミヤコ" = "モエ、ヴァルキューレの室温感知器はハッキングできますか？"
"41185-21-モエ" = "セキュリティ全体ならともかく、それくらいなら問題無し！"
"41185-22-ミヤコ" = "数値を操作してください、誤作動を誘発させます。"
"41185-23-モエ" = "何度にする？"
"41185-24-ミヤコ" = "摂氏900度で。"
"41185-25-モエ" = "OK！"
"41185-26-警備局の生徒A" = "なっ、水……！？"
"41185-27-警備局の生徒B" = "スプリンクラーが故障！？"
"41185-28-警備局の生徒A" = "ってことは……"
"41185-29-警備局の生徒A" = "まずい、防火扉が……！"
"41185-30-警備局の生徒B" = "自分たちの学校に閉じ込められるとか……。"
"41185-31-警備局の生徒B" = "これじゃ警備局も合流できないじゃん。"
"41185-32-警備局の生徒A" = "あ、でもこれは手動で開けられるんじゃ？"
"41185-33-警備局の生徒A" = "よし、じゃあさっさと……"
"41185-34-警備局の生徒B" = "……何これ？あいつらの忘れ物？"
"41185-35-警備局の生徒A" = "C4じゃない？何かリチウムバッテリーみたいのが付いてるけど。"
"41185-36-警備局の生徒B" = "……待って、リチウム？ってことは水に触れたら……"
"41185-37-警備局の生徒A" = "……あ。"
"41185-38-フブキ" = "ふぁ、ねっむ……。"
"41185-39-フブキ" = "全くこんな夜中に騒ぎとか……。"
"41185-40-フブキ" = "警察学校の本館に侵入するとか、大胆なやつもいたもんだ……。"
"41185-41-フブキ" = "でもどうして私たちまで……警備局の方で何とかしてくれれば良いのに……。"
"41185-42-フブキ" = "てきとうにパトロールっぽい動きでもして、さっさと帰ろっと……。"
"41185-43-フブキ" = "……何あれ？"
"41185-44-フブキ" = "……え、馬鹿にされてる？"
"41185-45-フブキ" = "にしても、何て悪質な罠……。"
"41185-46-フブキ" = "相当なバカじゃない限り、こんなのに引っ掛かるやつは――"
"41185-47-サキ" = "それ、「マスタードーナッツ」の限定ドーナッツ。しかもマシュマロ入り。"
"41185-48-フブキ" = "……マジで？"
"41185-49-フブキ" = "いっただっきま――"
"41185-50-フブキ" = "だよね～！？"
"41185-51-サキ" = "……まさか本当に行けるとはな。"
"41185-52-ミユ" = "私もどうかと思ったけど、ミヤコちゃんの命令だったし……。"
"41185-53-ミユ" = "……でも、成功だね。"
"41185-54-ミヤコ" = "まあ、私としても賭けでしたが……。"
"41185-55-ミヤコ" = "どうにかなっているのも、みんなのおかげです。"
"41185-56-ミヤコ" = "恐らく私以外の誰かが指揮を執っても、結果は同じだったと思いますが……。"
"41185-57-サキ" = "だから誤魔化すなっての。"
"41185-58-ミヤコ" = "えっ、と……すみません……？"
"41185-59-サキ" = "そうじゃない、これは明らかにミヤコが出した結果だ。他の誰かとかじゃない、誤魔化すな！"
"41185-60-サキ" = "最適解を出したのはお前だ、それは間違いないだろ？"
"41185-61-モエ" = "そうだよ、あんたの言う通りに動いた結果なんだから。"
"41185-62-ミユ" = "ミヤコちゃんのことを、信じたからこそだよ。"
"41185-63-サキ" = "まあ、今まで色々言ったのはその……悪かったよ。"
"41185-64-サキ" = "でも少なくとも今のお前は隊長だ、それは保証する。"
"41185-65-ミヤコ" = "……そうでしたか。"
"41185-66-ミヤコ" = "ですが、やはり私だけの功績ではありません。"
"41185-67-ミヤコ" = "みんなで動いてるからこそ、ですから。"
"41185-68-ミユ" = "ほんっと話の通じない……。"
"41185-69-モエ" = "ま、いつも通りでしょ。"
"41185-70-ミヤコ" = "話が長くなってしまいましたね……"
"41185-71-ミヤコ" = "先を急ぎましょう！"
"41185-72-キリノ" = "止まってください！"
"41185-73-キリノ" = "まさかとは思いましたが……侵入者とは、"
"41185-74-キリノ" = "あなたたちのことでしたか！"
"41185-75-ミヤコ" = "あなたは、確か……"
"41185-76-キリノ" = "先日はお世話になりました。生活安全局のエース、キリノです！"
"41185-77-キリノ" = "こんな夜中に校舎への不法侵入など、本官は許しませんよ！"
"41185-78-ミユ" = "……熱血っぽいのが来ちゃったな。"
"41185-79-ミユ" = "……ミヤコちゃん、どうする？"
"41185-80-キリノ" = "（先日は撃たれましたが……たしか情報だと、この方の射撃は……）"
"41185-81-ミヤコ" = "……無視します。引き続き前進。"
"41185-82-キリノ" = "え、えっ？ちょっ、どういうことですか！？"
"41185-83-キリノ" = "ほ、本当に撃ちますよ！？撃たないといけないんですけど！？"
"41185-84-キリノ" = "え、えぇぃっ……！"
"41185-85-キリノ" = "全弾命中せず、かぁ……。"
"41185-86-キリノ" = "うぅ……この間はカッコよく当てられたのに……。"
"41185-87-キリノ" = "目の前まで来た相手を、みすみす逃してしまうだなんて……。"
"41185-88-キリノ" = "……ところでフブキは、どうしてそこで段ボールを被ったまま倒れてたんです？"
"41185-89-フブキ" = "まあ、めんどくさくてって言うかなんて言うか……あんまり記憶に無い。"
"41185-90-フブキ" = "とりあえずキリノ、これ食べる？"
"41185-91" = "次回;大人の時間"
