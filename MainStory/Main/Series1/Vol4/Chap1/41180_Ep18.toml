[translation]
"41180-1" = "第18話;クローバー作戦（２）"
"41180-2-サキ" = "くっ、ぐぅっ……！"
"41180-3" = "……ダメだ、開く気がしない。"
"41180-4" = "で、証拠も確保したのに何やってるわけ？"
"41180-5" = "もう時間無いけど、さっさと出たら？"
"41180-6" = "聞こえてなかったのか？扉が開かないんだよ。"
"41180-7" = "……は？そもそもどうして閉めたのさ？"
"41180-8" = "金庫の扉なんか普通オートロックに決まってるじゃん！"
"41180-9" = "あ、開けておいたら、誰かに見つかっちゃうかなって……。"
"41180-10" = "私がその辺はちゃんと見てるってのに……。"
"41180-11" = "なーんでそこで不安がるかなぁ？"
"41180-12" = "ご、ごめんなさい……"
"41180-13" = "せめてドアストッパー的なものでも挟んでおけば良かったものを……。"
"41180-14" = "うう、ううう……。"
"41180-15" = "やっぱり私なんかが、SRTに入るべきじゃなかったんだ……。"
"41180-16" = "怖がってばかりで、みんなの足を引っ張って……。"
"41180-17" = "私なんか、生まれてこなければ……。"
"41180-18" = "ミユ、そんなことを言わないでください。狙撃手が屋内行動に慣れていないのは仕方ありません。"
"41180-19" = "むしろそれを考慮できていなかった私の落ち度です。"
"41180-20" = "……本当にそうか？"
"41180-21" = "誤魔化すなよ、ミユのミスに違いは無いだろ。"
"41180-22" = "誰のせいとか言ってる場合じゃないでしょ、時間制限も近いんだよ？"
"41180-23" = "じゃあどうしろって言うんだ。さっき私が言ったように、無理やりブチ抜くか？"
"41180-24" = "っていうか、さっきみたいにハッキングすれば良い話じゃ？"
"41180-25" = "電子ロック外しただけじゃ意味ないでしょ、物理的に扉が開かないんだから。"
"41180-26" = "うぅ、死にたい……逃げたい……。"
"41180-27" = "み、みんな、まずは落ち着いて……。"
"41180-28" = "ミヤコ、何か良い方法無いの？もう5分も残ってないよ？"
"41180-29" = "仮にも小隊長なんだろ。"
"41180-30" = "ミヤコちゃん……。"
"41180-31" = "わ、私は……。"
"41180-32" = "早く決めて、ミヤコ。時間が無い！"
"41180-33" = "ミヤコ！"
"41180-34" = "……。"
"41180-35" = "（……思えばSRTを離れて以来、私が指揮をした作戦は全部失敗してる）"
"41180-36" = "（公園の時も、キャンプが浸水した時も……）"
"41180-37" = "（……私には先生みたいな戦略眼も、統率力も無い）"
"41180-38" = "（この絶体絶命の状況で……）"
"41180-39" = "（私に一体、何が……？）"
"41180-40" = "[s1] \"ミヤコ、落ち着いて。\"\n[s2] \"まだ終わってないよ。\""
"41180-41" = "……先生。"
"41180-42" = "……先生。"
"41180-43" = "この状況……私には、どうにもできません。"
"41180-44" = "先生がここにいたら、どうにかできたかもしれませんが……。"
"41180-45" = "私は、先生とは違います。そんな力はありません。"
"41180-46" = "たとえあったとしても、今はもう何も分からないんです……！"
"41180-47" = "私だけじゃ、何もできません！"
"41180-48" = "私は、私自身を信じられない……！"
"41180-49" = "[s] \"全部をひとりで背負わなくても大丈夫。\""
"41180-50" = "[ns] \"みんなのことを信じてあげて。\""
"41180-51" = "……？"
"41180-52" = "お前がやるんだろ。"
"41180-53" = "教範にこんなシチュエーション載ってないんだから、私には無理。"
"41180-54" = "任務はいつも、怖いことばかりだけど……。"
"41180-55" = "でも、ミヤコちゃんがいるから……。"
"41180-56" = "っていうか私にはもう何もできないし。オペレーションだけで手いっぱい。"
"41180-57" = "だから……"
"41180-58" = "[s] \"よろしく、ミヤコ。\""
"41180-59" = "……はい、了解です。"
"41180-60" = "あらためて、作戦を開始します。この先、指示に気になる点も出てくるかもしれませんが、どうか迷わず従ってください。"
"41180-61" = "状況は良くありません、この先いくつも困難があるでしょう。それでも……"
"41180-62" = "どうにかこの「クローバー」を持って……[ruby=子ウサギ公園]私たちの居場所[/ruby]に戻りましょう。"
"41180-63" = "良いですね？"
"41180-64" = "了解！"
"41180-65" = "（それから約5分後……）"
"41180-66-ヴァルキューレの生徒A" = "警報だ！！"
"41180-67-ヴァルキューレの生徒B" = "監視カメラには何も映ってないけど？"
"41180-68-ヴァルキューレの生徒B" = "野良猫とか、ネズミとかじゃないの？"
"41180-69-ヴァルキューレの生徒A" = "保管庫の警報だぞ、どうやって猫が入り込むんだ。"
"41180-70-ヴァルキューレの生徒B" = "穴でも掘ったんじゃない？"
"41180-71" = "猫ちゃーん、出ておいてー。ネズミはちょっとあれだけど～……"
"41180-72" = "……え？"
"41180-73" = "異変が生じた時には、最悪の場合を想定するのが基本。"
"41180-74" = "そんな心構えだから、キヴォトスにトラブルが絶えないんだ。"
"41180-75" = "し、侵入者だ！"
"41180-76-サキ" = "わざと警報機を鳴らすとか……教範には無い、ミヤコらしい戦略だな。向こうに扉を開けさせるわけか。"
"41180-77-サキ" = "にしても、一緒にキヴォトスの治安を担う部隊がこの練度とか……幸いのような、落ち込むような……。"
"41180-78-ミユ" = "こ、これ、本当に大丈夫……？"
"41180-79-ミユ" = "警報、ずっと鳴ってるけど……。"
"41180-80-ミヤコ" = "はい、他の生徒たちも次々に集まって来るでしょう。"
"41180-81-ミヤコ" = "視界が開けたところでは遭遇しないように。基本的に接敵する際はこちら側から、意表を突く形で。"
"41180-82-ミヤコ" = "遮蔽物が多い、東側の廊下を使いましょう。"
"41180-83-ミヤコ" = "待ち伏せに注意しつつ[ruby=Objective Rally Point]、ORPま[/ruby]で移動します！"
