[translation]
"41090-1" = "第9話;這い寄る影"
"41090-2" = "子ウサギ公園付近・市場"
"41090-3" = "（近くの市場まで、買い物に来ていた）"
"41090-4-？？？" = "あっ、先生……！？"
"41090-5-キリノ" = "このようなところでお会いするとは、奇遇ですね！"
"41090-6" = "[s1] \"あ、キリノ。お疲れ様。\"\n[s2] \"ここでもパトロール？\""
"41090-7-キリノ" = "はい、その通りです！今日も市民の安全のために！"
"41090-8-キリノ" = "はい、その通りです！今日も市民の安全のために！"
"41090-9-キリノ" = "それにこの辺りは、美味しい屋台がたくさんありまして……。"
"41090-10-キリノ" = "特にあそこのお肉屋さんのカツサンドは絶品で、何かを買うといつも揚げたてのコロッケをおまけしてくれたり……！"
"41090-11-キリノ" = "も、もちろん、それだけが目的というわけではありません！この辺は、不良たちがうろついているということもあってですね……！"
"41090-12" = "[s] \"キリノの頑張りは知ってるよ、お疲れさま。\""
"41090-13-キリノ" = "あ、あははは……。"
"41090-14-キリノ" = "ところで、先日そこの公園で騒ぎを起こしたSRTの生徒たちについて、「後のことは全てシャーレに任せた」と伺ったのですが……"
"41090-15-キリノ" = "あれから大丈夫でしたか？何かトラブルなどが起きてなければ良いのですが。"
"41090-16-キリノ" = "例えば銃やトラップで先生を威嚇して、食べ物を奪ったり……"
"41090-17-キリノ" = "何か大きな要求をしたり、暴れたりですとか……！"
"41090-18" = "[s3] \"だ、大丈夫……うん。\"\n[s4] \"みんな良い子たちだから。\""
"41090-19-キリノ" = "そうでしたか、なら良かったです。"
"41090-20-キリノ" = "そうでしたか、なら良かったです。"
"41090-21-キリノ" = "デモを起こし、ヴァルキューレに対抗するほどの方々でしたので、もしかしたら危ないのではと思っていたのですが……。"
"41090-22-キリノ" = "流石は先生、というところでしょうか！"
"41090-23-キリノ" = "私も先生のような立派な大人になるため、今日もまた精進します！"
"41090-24" = "[s] \"まあ、私も全部が上手く行ってるわけじゃないけどね……。\""
"41090-25-キリノ" = "あ、そうなんですね。もし何かありましたらいつでも本官に、もしくはヴァルキューレ警察学校に連絡してください。"
"41090-26-キリノ" = "我々は年中無休24時間、市民の安全のために動きますので！"
"41090-27-キリノ" = "あ、ところで最近この辺りで、変な噂があるんですよ。それも原因でパトロールに来ていたのですが……。"
"41090-28" = "[s] \"噂……？\""
"41090-29-キリノ" = "はい。どうやらこの辺で、武装した放浪者集団の方々が歩き回っているとか。"
"41090-30-キリノ" = "荒っぽい服装をした、定住地を持たない集団とのことなのですが……"
"41090-31-キリノ" = "どこで手に入れたか分からない強力な銃火器を持ち歩いており、市民の方々から不安の声が上がっているとのことで。"
"41090-32-キリノ" = "それに先日は、湾岸地帯に入り込んで廃材を盗んだというお話もありました。"
"41090-33-キリノ" = "一体何が目的なのでしょうか……？"
"41090-34" = "[s] \"んん……？\""
"41090-35-キリノ" = "先生？何か思い当たることでもありましたか？"
"41090-36" = "[s] \"いや、その情報だと多分違うはず……。\""
"41090-37-キリノ" = "そうでしたか。もし何か分かりましたら、ご連絡をお願いします！"
"41090-38-キリノ" = "それにしても以前のSRTの件はさておき、「強力な銃火器を持った放浪者集団」だなんて……。"
"41090-39-キリノ" = "何だかこのままでは、ヴァルキューレ警察学校の武装がまるで貧弱みたいに見えてしまいそうです。"
"41090-40-キリノ" = "この機にヴァルキューレも、より最新式の銃器に変えてもらうというのは……？"
"41090-41" = "[s] \"なるほど？\""
"41090-42-キリノ" = "とはいえ、まあ難しいでしょうね……そもそも生活安全局の基本業務に、犯罪者の制圧は含まれていませんし……。"
"41090-43-キリノ" = "そもそもどうやらヴァルキューレ全体として、財政状況が良くないそうで……弾丸の補充にも一苦労です。"
"41090-44-キリノ" = "ですがご安心ください、いざとなれば徒手空拳でも市民の安全はお守りします！"
"41090-45-キリノ" = "それに前回の功績で、警備局に転科できるかもしれませんし……。"
"41090-46-キリノ" = "これからも引き続き、頑張っていこうと思います！"
"41090-47" = "[s] \"うん、応援してるね。\""
"41090-48-キリノ" = "ありがとうございます！これも先生のおかげです！"
"41090-49-キリノ" = "では本官は引き続きグル……"
"41090-50-キリノ" = "いえ、パトロールに戻ります！"
"41090-51" = "[ns] 買い物を終えてシャーレに帰る。"
"41090-52-？？？" = "……。"
"41090-53-？？？" = "……そこの君。"
"41090-54-？？？" = "[USERNAME]先生かね？"
"41090-55" = "[s] \"そうですけど……。\""
"41090-56-？？？" = "君に用事があるんだ。"
"41090-57-？？？" = "ついて来てくれるね？"
"41090-58" = "[ns] \"（これ、麻酔……！？）\""
"41090-59" = "（放たれた煙を吸ってしまい、目の前がぼやけて……）"
"41090-60" = "（意識は闇の中へと沈んだ）"
"41090-61" = "次回;無所有と焼肉弁当"
