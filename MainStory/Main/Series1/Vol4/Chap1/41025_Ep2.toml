[translation]
"41025-1-サキ" = "……ん？"
"41025-2-モエ" = "どしたの？何か問題でもあった？"
"41025-3-サキ" = "何か、また兵が出てきた。"
"41025-4-サキ" = "もう誰も残ってないと思ってたけど……"
"41025-5-サキ" = "まさかとは思うが、生活安全局……？"
"41025-6-モエ" = "じゃあザコじゃん、聞いて損した。"
"41025-7-モエ" = "それくらいだったら、ミユがてきとうに処理してくれるでしょ。"
"41025-8-サキ" = "そうなんだけど、何か気になるっていうか……。"
"41025-9-サキ" = "……まあ、心配し過ぎか。"
"41025-10-ミユ" = "暗い、怖い……早く学校に帰りたい……。"
"41025-11-ミユ" = "……もう学校、閉鎖されたんだった。私が帰れる場所は……。"
"41025-12-ミユ" = "こうなったら今さらもう、ヴァルキューレにも……。"
"41025-13-ミユ" = "このまま私は、寂しく忘れられていくんだろうな……。"
"41025-14-ミユ" = "私たち、いつまでこうやって……"
"41025-15-ミユ" = "……？"
"41025-16-ミユ" = "え、煙幕弾……？"
"41025-17-ミユ" = "きゃあっ！？"
"41025-18-ミユ" = "ど、どこから……？だって相手はもう……"
"41025-19-ミユ" = "連絡も何も無かったのに……と、とにかく状況の報告を……！"
"41025-20-ミユ" = "だ、誰ですか……！？"
"41025-21-不審者" = "えーっと……"
"41025-22-不審者" = "ほら、私だよ私。RABBIT小隊の……"
"41025-23-ミユ" = "RABBIT小隊……"
"41025-24-ミユ" = "え、サキちゃん？"
"41025-25-不審者" = "そうそう！"
"41025-26-不審者" = "何か間違って煙幕弾が爆発してたみたいだから、様子を見に来たって感じ。"
"41025-27-ミユ" = "で、でもサキちゃん、さっき「持ち場から絶対離れるな」って言ってたような……？"
"41025-28-ミユ" = "それに、声が……"
"41025-29-不審者" = "あー、ちょっと煙を吸ったせいで……げほっ、げほっ！"
"41025-30-不審者" = "ま、とにかく大丈夫だよ。だから銃は一旦置いておこう？"
"41025-31-ミユ" = "（……怪しい。口調も声も、サキちゃんとは全然……）"
"41025-32-ミユ" = "（こういう時こそ、合言葉を……）"
"41025-33-ミユ" = "……「クローバー」。"
"41025-34-不審者" = "……え？"
"41025-35-ミユ" = "サキちゃんは、ちゃんと知ってるでしょ？"
"41025-36-ミユ" = "こ、答えられなかったら、すぐに撃ちます……！"
"41025-37-不審者" = "「クローバー」！"
"41025-38-ミユ" = "……え、えっ？"
"41025-39-不審者" = "何か言った？この辺雑音が多くてよく聞こえなくてさ。ところで……この言葉に対する答え、ちゃんと知ってるよね？"
"41025-40-ミユ" = "え、そ、そんな……！？"
"41025-41-不審者" = "答えられなかったら、撃っちゃうよ？"
"41025-42-ミユ" = "に、「ニンジン」！"
"41025-43-不審者" = "ふーん、なるほどね。了解。"
"41025-44-ミユ" = "え、あ、あっ……？"
"41025-45-不審者" = "心理戦で追い込まれると弱いかも……先生の言う通りだったね。"
"41025-46-フブキ" = "合言葉、教えてくれてありがと。じゃあね、ウサギの狙撃手ちゃん。"
"41025-47-ミユ" = "だ、騙された……！？"
"41025-48-サキ" = "……何だ、今の銃声？近くないか？"
"41025-49-サキ" = "まさか、ミユがやられた……？"
"41025-50-モエ" = "まっさかぁ、生活安全局でしょ？装備とかの面も含めて、ミユがやられるレベルじゃないよ。"
"41025-51-サキ" = "それはそうだろうけど……ミユとの連絡が取れない。"
"41025-52-サキ" = "行ってくる。"
"41025-53-サキ" = "モエ、支援は頼んだ。"
"41025-54-モエ" = "いや支援も何も、もう弾薬残ってないけど？"
"41025-55-サキ" = "……は、どうして？"
"41025-56-モエ" = "さっき言ったじゃん、「ド派手に」「全部使って」って。"
"41025-57-モエ" = "ドローン追撃する時に、全部パーッとね♪"
"41025-58-サキ" = "はぁ！？おまっ、嘘だろ！？"
"41025-59-モエ" = "後のことなんて考え無しに、全部一回につぎ込む……"
"41025-60-モエ" = "その火花はそりゃあ美しいよね、興奮する……はあ、はあ……。"
"41025-61-サキ" = "本当に文字通り「全部」使うやつがいるかバカ！後のこと考える必要があるだろ、今は！"
"41025-62-サキ" = "この状況で弾薬がゼロって、後はどうしたら――"
"41025-63-ミヤコ" = "今の爆発は……？"
"41025-64-ミヤコ" = "サキ、モエ、どういう状況ですか？報告を！"
"41025-65-ミヤコ" = "応答が無い……奇襲されましたか。"
"41025-66-ミヤコ" = "ですから警戒をと言ったのですが……"
"41025-67-ミヤコ" = "仕方ありません、まずは拠点を移して応戦を……"
"41025-68-キリノ" = "止まってください！"
"41025-69-キリノ" = "先生の言った通り、ここでしたか……！動かないように！"
"41025-70-キリノ" = "市民の皆さんが使う公園の占拠、そして違法な武器を用いてのデモ……"
"41025-71-キリノ" = "申し訳ありませんが、拘束させていただきます！"
"41025-72-キリノ" = "本官の指示に従い、手を上げて投降してください！"
"41025-73-ミヤコ" = "（面倒なことになりましたね……もうここまで来ていたとは）"
"41025-74-ミヤコ" = "（武装は制式拳銃だけ……恐らく、初弾は回避できるはず……）"
"41025-75-キリノ" = "う、動かないでください！本当に撃ちますよ！？"
"41025-76-ミヤコ" = "……言いなりには、なりません！"
"41025-77-キリノ" = "は、発砲します！"
"41025-78-ミヤコ" = "っ！！銃口の向きは、見えていたのに……！？"
"41025-79-ミヤコ" = "回避されること前提で、直前までわざと違う方向を……？"
"41025-80-ミヤコ" = "油断したのは、私も……でしたか……。"
"41025-81-キリノ" = "……め、命中しました！？！？"
"41025-82-キリノ" = "も、もしかして本官も、遂に射撃能力が向上したのでしょうか……？"
"41025-83-キリノ" = "やはり努力は実を結ぶもの……。"
"41025-84-キリノ" = "そして正義もまた、いつだって勝利するもの……ということですね！"
"41025-85-カンナ" = "信じられません……。"
"41025-86-カンナ" = "まさか本当に生活安全局の生徒だけで、SRTを制圧するとは……。"
"41025-87" = "[s] \"二人とも頑張ってくれたからね。\""
"41025-88-カンナ" = "なるほど……これが[USERNAME]先生のお力。その上、姿勢も謙虚と来るとは。"
"41025-89-カンナ" = "生徒たちの噂もまた、本当だったということですね。"
"41025-90-カンナ" = "……ヴァルキューレ警察学校を代表して、感謝いたします。"
"41025-91-フブキ" = "見ましたか、先生！？私の完璧な射撃！"
"41025-92-フブキ" = "まさに警備局のみなさんのような、鮮やかな一撃でした……！"
"41025-93-フブキ" = "いやー、あんな古い手法がまだ通じるとはね……。"
"41025-94-フブキ" = "ま、先生の作戦ありきとはいえ……上手くできたみたいで何より。"
"41025-95-フブキ" = "これはもう、20日分くらい特別休暇を貰えるんじゃないんかな。ふふっ……。"
"41025-96-カンナ" = "……はぁ。"
"41025-97-カンナ" = "貴様らの殊勲は認めよう。しかしそれは、私のような立場に決められるようなことではない。もっと上層部の方々の管轄だ。"
"41025-98-カンナ" = "ご苦労だった。報酬については、来月の賞罰の発表を待つように。"
"41025-99-キリノ" = "何だ、すぐ貰えるわけじゃないのか……"
"41025-100-フブキ" = "ガッカリだよ。"
"41025-101-キリノ" = "ですが来月なんてもうすぐです！もしかしたら本当に警備局に……！"
"41025-102-フブキ" = "いやー、私そっちは要らない……"
"41025-103-フブキ" = "むしろ断る……。"
"41025-104-モエ" = "あんな頭の悪そうなやつらに、私たちが……？"
"41025-105-サキ" = "お前が言うな、弾薬を一気に使い果たす、なんて相当頭の悪い行動をしたくせに。"
"41025-106-モエ" = "何言ってるのさ、一瞬の輝きより大事なものなんて無いっての！"
"41025-107-ミユ" = "もう終わりなんだ……"
"41025-108-ミユ" = "SRTも、RABBIT小隊も、私も……全部奪われて、寂しく消える運命なんだ……。"
"41025-109-ミヤコ" = "……。"
"41025-110" = "[s1] \"初めまして。\"\n[s2] \"SRT特殊学園の生徒たち……だよね？\""
"41025-111-サキ" = "……お前と話すことなんて一つも無い！"
"41025-112-サキ" = "……お前と話すことなんて一つも無い！"
"41025-113-モエ" = "何なに、冷やかし？それともバカにしに来たの？"
"41025-114-ミヤコ" = "……あなたがあの生活安全局を指揮した、「大人」ですか？"
"41025-115" = "[s] \"うん、そうだよ。\""
"41025-116-ミヤコ" = "……そうですか。あなたがあの、多くの生徒たちの悩みを解決し、生徒たちから信頼されている、超法規的捜査権を持った「シャーレの先生」……。"
"41025-117-ミヤコ" = "……先生。私たちは、あなたのような大人が一番嫌いです。"
"41025-118-サキ" = "地獄に落ちろ。"
"41025-119-モエ" = "もう二度と会わないだろうね。"
"41025-120" = "[ns] \"うーん、元気だ。\""
"41025-121-カンナ" = "気にする必要はありません。負かされたことでイライラしてるんでしょう。"
"41025-122" = "[s] \"あの子たちは、これからどうなるの？\""
"41025-123-カンナ" = "まずは取り調べです。"
"41025-124-カンナ" = "普段ならその後、ヴァルキューレが処罰を決める流れなのですが……。"
"41025-125-カンナ" = "ある程度連邦生徒会が関わりましたので、恐らくそうはなりませんね。防衛室長が処遇を決めることになるかと。"
"41025-126-カンナ" = "ご希望でしたら、取り調べの様子を見ることも可能かと思います。"
"41025-127-カンナ" = "では、ひとまずお疲れ様でした。"
"41025-128" = "次回;それぞれの事情"
