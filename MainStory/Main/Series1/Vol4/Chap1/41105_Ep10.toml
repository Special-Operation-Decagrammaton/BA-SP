[translation]
"41105-1-所確幸のメンバーA" = "ぐあぁっ！？"
"41105-2-所確幸のメンバーB" = "で、でたらめな強さだ……逃げろ！"
"41105-3-デカルト" = "み、みなさん！どこに行くのですか？まだ敵は……"
"41105-4-所確幸のメンバーA" = "そもそも何もしたくないのに、戦闘なんかできるわけないだろ！？"
"41105-5-所確幸のメンバーB" = "もう帰る、"
"41105-6-所確幸のメンバーB" = "こんな生活懲り懲りだ！"
"41105-7-デカルト" = "ま、待ちなさい！！"
"41105-8-デカルト" = "ああ、「所確幸」のアジトが……せっかく集めた高い装飾品も、全部燃えて……"
"41105-9" = "[s] \"何度も申し訳ないんだけど、「所有」に執着しないんじゃ……？\""
"41105-10-デカルト" = "うるさい！！贅沢するのは人間の本質だろう！？"
"41105-11-デカルト" = "あなたたちが、あなたたちさえいなければ……！"
"41105-12-ミユ" = "……Aサイト、クリア。"
"41105-13-ミユ" = "2階の狙撃手も全員無力化……"
"41105-14-サキ" = "Bサイトもクリア。"
"41105-15-サキ" = "何人か逃げられたけど、それ以外は全員制圧した。"
"41105-16-ミヤコ" = "はい、お疲れ様でした。"
"41105-17-ミヤコ" = "得るものはありませんでしたが、怪我などは無いようで何より……"
"41105-18-サキ" = "……ん？ミヤコ、これ缶詰じゃないか？賞味期限は切れてるけど……"
"41105-19-サキ" = "燻製のサーモンにベーコン……"
"41105-20-サキ" = "オイル漬けのホタテまである！"
"41105-21-サキ" = "おぉ……これさえあれば普通の弁当も、一気に高級な感じに……！"
"41105-22-ミヤコ" = "ま、待て、触るな！"
"41105-23-デカルト" = "そこの高級缶詰は、後でお酒のつまみにしようと私が大事に……！"
"41105-24-ミユ" = "ミヤコちゃん、ここに寝袋とか撥水加工のシートがたくさん……。"
"41105-25-ミユ" = "雨が降るたびに困ってたけど、これさえあれば……。"
"41105-26-ミヤコ" = "……なるほど、そうですね。"
"41105-27-ミヤコ" = "モエ、今すぐ車両を手配してもらえますか？"
"41105-28-ミヤコ" = "思ったより戦利品が多くなりそうです。"
"41105-29-デカルト" = "な、何をいつの間に「戦利品」扱いしてるんだ！"
"41105-30-デカルト" = "これは全部私のものだ！私の所有物に手を出すな！"
"41105-31" = "[s] \"「無所有」の話は一体どこに……。\""
"41105-32-サキ" = "でもこれ、ほとんど賞味期限切れかけだぞ？"
"41105-33-サキ" = "お前の部下はもういなくなっちゃったし……食べきれなくないか？"
"41105-34-ミヤコ" = "最初に威嚇射撃をしてきたのはそちらです。"
"41105-35-ミヤコ" = "その分の損失として、全部ではないにせよ頂けないでしょうか。"
"41105-36-デカルト" = "うっ、くうっ……。"
"41105-37-デカルト" = "穀潰し！社会の膿！そんなに欲しいならどうして真っ当に働かない！？"
"41105-38-デカルト" = "そんなに強ければ、廃棄弁当なんか当てにしなくても生活できるだろう！傭兵にでも何にでもなれるじゃないか！"
"41105-39-デカルト" = "私たちは傭兵ではなく、SRTですから。"
"41105-40-デカルト" = "知るか！とにかく真っ当な所属があるなら、弁当くらい譲ったらどうなんだ！！"
"41105-41-デカルト" = "生存をかけて戦ってるところに、最先端の武器やら正義の理屈やらを持ち込んで……"
"41105-42-デカルト" = "あなたたちの言っていることは全て詭弁だ！"
"41105-43-サキ" = "詭弁だらけなのはお前の方だろ！？"
"41105-44-サキ" = "「無所有」だの「求道者」だの言ってるくせに、行動は欲望に忠実だし……"
"41105-45-サキ" = "求道者なら求道者らしく、もやし弁当でも食ってろ！"
"41105-46-デカルト" = "うるさい！求道者だって焼肉弁当が食べたいんだ！！"
"41105-47" = "[s] \"どうどう……。\""
"41105-48" = "[s1] \"とにかく今回は私も悪いし、必要なシートとかは私が買うから。\"\n[s2] \"みんなも、ここにある物は持っていかないであげて。\""
"41105-49-一同" = "……。"
"41105-50-ミヤコ" = "もう一度言いますが、先生の助けは不要です。"
"41105-51-ミヤコ" = "先生が何を言おうと、私たちが考えを変えることはありませんし……。"
"41105-52-サキ" = "……疲れた。もう食欲すらほぼ無い。"
"41105-53-サキ" = "帰って、もやし弁当でも食べて寝よう……。"
"41105-54-ミユ" = "わ、私も……。"
"41105-55-ミヤコ" = "……そうですね。急に脂っぽい物を食べたら胃に悪そうですし……。"
"41105-56-ミヤコ" = "キャンプRABBITへ、こちらRABBIT1。"
"41105-57-ミヤコ" = "作戦は終了、帰投します。"
"41105-58-モエ" = "え、戦利品は？和牛ステーキ弁当は！？"
"41105-59-ミヤコ" = "残念ですが、無かったことになりました。"
"41105-60-ミヤコ" = "今日はもやし弁当でも食べるとしましょう。"
"41105-61-モエ" = "えぇー！？せっかく車両の手配したのに！？"
"41105-62-サキ" = "うるさい、ダイエットだと思え。"
"41105-63-デカルト" = "ふ、ふふ、その欲望に満ちた眼差し……"
"41105-64-デカルト" = "やはり「所有」は人の目を見えなくし、心を凶悪に……"
"41105-65" = "[s] \"あなたも大体同じ眼だと思うけど……。\""
"41105-66-デカルト" = "わ、"
"41105-67-デカルト" = "私はそんなことありませんが！？"
"41105-68-デカルト" = "私はこの澄んだ眼で、全ての価値を見極めることができるのです！その結果、多くの同志たちが……"
"41105-69-デカルト" = "そ、そういえば同志たちはいなくなったんでした……。"
"41105-70-デカルト" = "……この際ですし、先生も「所確幸」に参加されませんか？"
"41105-71-デカルト" = "さあ先生の所有物を手放し、共に精神の在り処を……。"
"41105-72" = "[s] \"遠慮します……。\""
"41105-73" = "次回;大雨注意報"
