[translation]
"41160-1" = "第16話;リベート"
"41160-2-サキ" = "あなたは……。"
"41160-3-サキ" = "ヴァルキューレ警察学校の「狂犬」……。"
"41160-4-カンナ" = "……カンナだ。せめて公安局長と呼べ。"
"41160-5-カンナ" = "嫌いなあだ名ではないが、そもそも私たちはあだ名で呼び合うような仲ではないだろう。"
"41160-6-ミヤコ" = "公安局長、ここには何のご用で？"
"41160-7-カンナ" = "自分たちの行いを理解した上で、その質問をしているのか？"
"41160-8-カンナ" = "市民たちが使うための公園を不法占拠し、地域社会に不安をもたらしている存在がいる……そう聞いて、取締りに来ただけだ。"
"41160-9-モエ" = "とはいえ、ここにいて良いって言ったのは防衛室長なんだよ？まあシャーレ経由だけど。"
"41160-10-モエ" = "ヴァルキューレの公安局長が、上官の命令に逆らって良いわけ？"
"41160-11-カンナ" = "何か勘違いをしているようだな。"
"41160-12-カンナ" = "防衛室長が、「この公園に滞在して良い」と仰ったことは無い。"
"41160-13-カンナ" = "ただ、「貴様らの処罰を保留する」と言っただけだ。"
"41160-14-ミヤコ" = "……さらに言えば、公園の管理は防衛室の管轄ではありません。"
"41160-15-ミヤコ" = "つまり、私たちに立ち退きを要求することは正当である……そういうことでしょうか？"
"41160-16-モエ" = "……帰る場所が無いって知ってるくせに。"
"41160-17-モエ" = "良い性格してんね、公安局長さん？"
"41160-18-ミユ" = "で、ですが、公安局が直接……？"
"41160-19-ミユ" = "治安関連でしたら、警備局の管轄なのでは……。"
"41160-20-カンナ" = "ああ、基本的にはそうだ。"
"41160-21-カンナ" = "……普通の状況だったらな。"
"41160-22-サキ" = "よく分からないけど、無理やり追い出しに来たわけ？"
"41160-23-モエ" = "別に良いけど、前回は散々な結果だったのを忘れたわけ？"
"41160-24-カンナ" = "[ruby=かぜくら]風倉[/ruby]、言葉は慎重に選んだ方が良い。"
"41160-25-カンナ" = "聞いたところによると先日の大雨で、RABBIT小隊の装備はほとんど浸水したらしいな？"
"41160-26-モエ" = "……。"
"41160-27-カンナ" = "中古品を売って、新しい装備を手に入れたことも聞いている。しかし公園全体をカバーするには心許ないのではないか？"
"41160-28-カンナ" = "公安局は今回、スポンサーの協力を得て大量の火器を確保した。"
"41160-29-カンナ" = "貴様らがエリートだということは知っている、しかし数的優位を覆せるかどうかは別の話だ。"
"41160-30-カンナ" = "さあ、早めに決めろ。"
"41160-31-カンナ" = "おとなしくこの公園を去るか、それとも試しにその粗悪な銃器で戦いを挑むか。"
"41160-32-ミユ" = "はっ、本当にやる気みたいだな。"
"41160-33-モエ" = "武器が足りなくたって、あんたたちに一泡吹かせることはできるけど？"
"41160-34-ミユ" = "で、でも、実際勝てるかな……？"
"41160-35-ミユ" = "ど、どうしよう、ミヤコちゃん……。"
"41160-36-ミヤコ" = "私たちは……"
"41160-37" = "[s] \"ちょっと待ってもらえる？\""
"41160-38-カンナ" = "……シャーレの先生？どうしてここに……。"
"41160-39-カンナ" = "……防衛室長から聞きました、RABBIT小隊の待遇はシャーレに一任すると。"
"41160-40-カンナ" = "しかし、これは別件です。先生の指示だとしても、決定を覆すことはできません。"
"41160-41-カンナ" = "子ウサギタウンの再開発は、すでに決定事項ですから。"
"41160-42" = "[s1] \"でも、いきなり出ていけと言われてもちょっと困る。\"\n[s2] \"少しで良いから、みんなが考える時間をくれない？\""
"41160-43-カンナ" = "時間なら、これまで十分あったかと思いますが……。"
"41160-44-カンナ" = "時間なら、これまで十分あったかと思いますが……。"
"41160-45-カンナ" = "……良いでしょう。"
"41160-46-カンナ" = "先生には借りがありますので……今日は引き上げることにします。"
"41160-47-カンナ" = "しかし、いつまでも放置することはできません。"
"41160-48-カンナ" = "ざっくり計算して、今月末までかと思います。そのタイミングにまだこの公園にいるようであれば、こちらも武力行使せざるをえません。"
"41160-49-カンナ" = "……私たちにも「守るべきライン」がありますので。"
"41160-50-カンナ" = "……撤収！"
"41160-51-サキ" = "前回もシャーレありきだったくせに、偉そうに。"
"41160-52-ミヤコ" = "ですが、武装が強化されていたのは事実のようです。"
"41160-53-ミヤコ" = "モエ、あれは「カイザーインダストリー」の銃器で間違いないですか？"
"41160-54-モエ" = "だね。"
"41160-55-モエ" = "にしてもほんと、あのケチなヴァルキューレがどうしてカイザーのを買えたんだか。理解できないね。"
"41160-56-ミユ" = "そういえばさっき、「スポンサー」って……。"
"41160-57" = "[s] \"……リベートかな。\""
"41160-58-ミヤコ" = "……「リベート」？"
"41160-59-モエ" = "それって「割り戻し」のこと？支払った分の一部が返って来るやつ？"
"41160-60-モエ" = "たとえそうだとして、「カイザーインダストリー」は何の得があってヴァルキューレにそんなことを……？"
"41160-61" = "（考えていることを、RABBIT小隊のみんなに話してみた）"
"41160-62-ミヤコ" = "……なるほど。"
"41160-63-ミヤコ" = "子ウサギタウンの開発を手がけている「カイザーコンストラクション」は、武器を扱う「カイザーインダストリー」と同じ系列会社。"
"41160-64-ミヤコ" = "資金の移動は比較的簡単です。もし「カイザーコンストラクション」が子ウサギタウンの開発によって得られるであろう利益を、「カイザーインダストリー」が事前に武器として還元することで公安局へと流していたら……。"
"41160-65-サキ" = "公安局はその武器の対価として、放浪者たちを追い出せば良いと。"
"41160-66-サキ" = "……それ、違法じゃないのか？"
"41160-67-ミヤコ" = "はい、もちろん違法です。"
"41160-68-ミヤコ" = "市民に奉仕すべき警察学校が、私企業のために働いているわけですから。"
"41160-69-サキ" = "警察と企業が結託して市民を攻撃とか……"
"41160-70-サキ" = "意味分かんないなもう。"
"41160-71" = "わ、私たちも何とも言えない立場だけど……。"
"41160-72" = "[s] \"もちろん、まだ色々と推測の域だけど……。\""
"41160-73-ミヤコ" = "そうですね、"
"41160-74-ミヤコ" = "公安局が本当にカイザーインダストリーと取引をしたのかどうかも分かりません。"
"41160-75-ミユ" = "ヴァルキューレの記録ってことは、多分ローカルサーバーでしょ。外からのハッキングは無理っぽいな。"
"41160-76-サキ" = "ちっ、何か決定的な証拠があれば良いのに……。"
"41160-77-ミユ" = "何か、方法は……。"
"41160-78-ミヤコ" = "……ヴァルキューレに潜入すれば、取引記録があるのではないでしょうか。"
"41160-79-サキ" = "ミヤコ、お前正気か？"
"41160-80-サキ" = "ヴァルキューレの本館ってことだろ？あの要塞、何百人いると思ってるんだ？"
"41160-81-ミユ" = "ちゃんとした支援があっても、難しいんじゃ……？"
"41160-82-ミユ" = "今の私たちの力じゃ、多分……。"
"41160-83-モエ" = "普通に通報するってことで良いんじゃないの？"
"41160-84" = "[s] \"警察の問題を、警察に？\""
"41160-85-モエ" = "……確かに。どっちもヴァルキューレだったわ。"
"41160-86-サキ" = "ヴァルキューレでトラブルがあった時、これを調査する上位機関……。"
"41160-87-ミヤコ" = "それが、SRTのはずです。"
"41160-88-モエ" = "確かに、そういやそうだね。"
"41160-89-サキ" = "私たちがやるしかない、か……じゃないと、他に誰も解決できない。"
"41160-90-ミユ" = "でも、良いのかな……。"
"41160-91-ミユ" = "今の私たちは、学校も無いし……"
"41160-92" = "[s] \"……君たちがそう信じるなら。\""
"41160-93-ミヤコ" = "……先生？"
"41160-94" = "[ns3] \"いってらっしゃい、いざという時は責任取るから。\"\n[ns4] \"できるだけ、怪我の無いようにね。\""
"41160-95-ミヤコ" = "……変な人ですね。"
"41160-96-ミヤコ" = "先生、本当に「責任」って言葉の意味分かってる？"
"41160-97-サキ" = "はっ、やっぱりバカだったか。"
"41160-98-ミユ" = "ふふっ……。"
"41160-99-ミヤコ" = "ですが、おかげさまで決意は固まりました。"
"41160-100-ミヤコ" = "……私たちはSRT。キヴォトスにおける込み入った犯罪行為に対し、真っ先に投入される特殊部隊。"
"41160-101-モエ" = "秩序維持のため、犯罪者を速やかに制圧し……"
"41160-102-モエ" = "可能な限り全火力を瞬く間に投下し……"
"41160-103-ミユ" = "……気づかれる前にその場を去る。"
"41160-104-ミヤコ" = "ヴァルキューレが私企業と結託して、不法行為を行おうとしている……その可能性がどれだけ高くても、正規の手続きでは解明できないでしょう。"
"41160-105-ミヤコ" = "まさに、SRTとして介入するべき任務です。"
"41160-106-ミヤコ" = "みなさん、作戦の準備を。"
"41160-107-ミヤコ" = "これより、ヴァルキューレ公安局の違法リベートに関する証拠を確保するため……"
"41160-108-ミヤコ" = "「クローバー作戦」を、開始します！"
"41160-109" = "次回;クローバー作戦（１）"
