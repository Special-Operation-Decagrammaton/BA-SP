[translation]
"41110-1" = "第11話;大雨注意報"
"41110-2" = "シャーレ・オフィス"
"41110-3" = "数日後、キヴォトス広域に大雨が降っていた。"
"41110-4-アロナ" = "すごい雨ですね……。"
"41110-5-アロナ" = "それぞれの自治区で、被害が出ていないと良いのですが……。"
"41110-6-アロナ" = "各学園の生徒会や、委員会のみなさんに任せれば大丈夫でしょうか。"
"41110-7-アロナ" = "あっ、でも……今公園にいるSRTの生徒さんたちは……。"
"41110-8-アロナ" = "この大雨では、テントも……。"
"41110-9-アロナ" = "風邪を引いてしまわないか心配ですし、それに……。"
"41110-10" = "[ns] RABBIT小隊の様子を見に行く。"
"41110-11" = "子ウサギ公園"
"41110-12-サキ" = "こっちもタープが破れた！"
"41110-13-サキ" = "ミユ！防水シートが足りない！"
"41110-14-ミユ" = "も、もう予備は無くって……！"
"41110-15-サキ" = "くそっ、もっと色々と資材があれば……。"
"41110-16-サキ" = "モエ、こっちを手伝え！"
"41110-17-サキ" = "いつまでも機械を抱きしめてる場合か！"
"41110-18-モエ" = "いやいやいや、通信装備が浸水したらヤバいでしょ！？"
"41110-19-モエ" = "この辺の機器、全部合わせていくらだと思ってるの？"
"41110-20-サキ" = "知るか！どうにかしろ！！"
"41110-21-サキ" = "くそっ、いつまで続くんだこの雨……！"
"41110-22-ミヤコ" = "防水周りが補強できたら、次は排水路の方を！"
"41110-23-ミヤコ" = "土砂が詰まっているのか、水が溢れてて……"
"41110-24-ミヤコ" = "このままでは、周囲一帯が全て浸水しかねません！"
"41110-25-サキ" = "分かってる！でもこっちも補強が間に合わないんだ！"
"41110-26-サキ" = "手を離したら、すぐに崩れそうなレベルで――"
"41110-27-ミユ" = "今のって……？"
"41110-28-ミユ" = "こ、公園の中央に、雷が……！"
"41110-29-サキ" = "まずい、"
"41110-30-サキ" = "テントの支柱が倒れる……！"
"41110-31-一同" = "……。"
"41110-32-ミユ" = "て、テントが……。"
"41110-33-サキ" = "弾薬、全部ダメになったな……。"
"41110-34-モエ" = "通信機器類も……。"
"41110-35-サキ" = "全部終わり、か……。"
"41110-36-ミヤコ" = "いえ、諦めるにはまだ早いです。"
"41110-37-ミヤコ" = "排水路をどうにかして、浸水の少ない装備から回収して――"
"41110-38" = "装備だけの話じゃない！！"
"41110-39" = "全部、全部だ……！私たちSRTは、もう……！！"
"41110-40" = "サキちゃん……。"
"41110-41" = "はぁ……こうなると分かってたら、最初っから……。"
"41110-42" = "な、何を言ってるのですか……？"
"41110-43" = "最初にみんなで、言ったじゃないですか。"
"41110-44" = "私たちが諦めない限り、SRTの名前は――"
"41110-45" = "ミヤコだって、分かってたんじゃないの？"
"41110-46-モエ" = "こんなバカみたいなこと、いつまでも続けるわけにはいかないって。"
"41110-47-サキ" = "今の私たちは治安維持どころか、食料品を探し回る毎日……。"
"41110-48-サキ" = "正義がどうとか、犯罪者がどうとかそんなレベルじゃない。"
"41110-49-サキ" = "こんな状態で、SRTの名前が守れてるとは思えない……！"
"41110-50-サキ" = "……もう、自分が何をしてるのか分からなくなってきた。"
"41110-51-モエ" = "ほんと、何やってんだろね……。"
"41110-52-モエ" = "何もかも水浸しだし、野宿生活も疲れたし……。"
"41110-53-ミユ" = "ミヤコちゃん……もう、諦めようよ……。"
"41110-54-ミヤコ" = "……。"
"41110-55-サキ" = "……ミヤコ、どこに行くんだ？"
"41110-56-サキ" = "こんなバカげたことを、まだ続ける気か！？"
"41110-57-ミヤコ" = "……はい、そうです。"
"41110-58-ミヤコ" = "諦められません、SRTのためにも。"
"41110-59-ミヤコ" = "（水圧が強い……もう手の感覚も……）"
"41110-60-ミヤコ" = "（確かに、意味の無いことかもしれない……）"
"41110-61-ミヤコ" = "（でも私はSRTを、私の思う理想を……）"
"41110-62-ミヤコ" = "諦め、られないっ……！"
"41110-63-ミヤコ" = "……先生？"
"41110-64-ミヤコ" = "……今日は何の用ですか？"
"41110-65-ミヤコ" = "見て分かると思いますが、冗談を言っていられる状況ではありません。"
"41110-66-ミヤコ" = "今すぐ対処できないと、周囲が全部……。"
"41110-67" = "[ns] シャベルを持って排水路に向かう。"
"41110-68-ミヤコ" = "先生……？"
"41110-69-ミヤコ" = "どうして……。"
"41110-70" = "[s] \"ここの土を片付ければ良いんだよね？\""
"41110-71-ミヤコ" = "はい、お願いします。"
"41110-72-サキ" = "はぁ……シャベルの使い方が下手か、貸せ。"
"41110-73-ミユ" = "……ほんと、何やってんだか。"
"41110-74-ミユ" = "……手伝います。"
"41110-75" = "その後、RABBIT小隊員たちと必死に排水路を整備した。"
"41110-76-ミヤコ" = "……雨、ようやく止みましたね。"
"41110-77" = "[s] \"みんな、お疲れ様。\""
"41110-78-ミヤコ" = "……。"
"41110-79-ミヤコ" = "……どうして私たちを助けるんですか？"
"41110-80-ミヤコ" = "何度も、何度も言ったはずです。何も変わらないと。"
"41110-81-ミヤコ" = "先生が私たちに何を望んでいるのか、私には全く分かりません。"
"41110-82" = "[s] \"何かを望んでるわけじゃないよ。\""
"41110-83" = "[s] \"私は先生だから。\""
"41110-84-ミヤコ" = "……そうですか。"
"41110-85-ミヤコ" = "装備はほとんどダメになってしまいましたが……。"
"41110-86-ミヤコ" = "どうにか、公園そのものは完全に浸水せずにすみました。"
"41110-87-モエ" = "全く、ミヤコにも色々と言いたいことはあるけど……"
"41110-88-サキ" = "先生は、この公園での生活をやめてほしいんじゃなかったのか？"
"41110-89-サキ" = "何の得にもならないのに、こんな……筋金入りのバカだな。"
"41110-90-モエ" = "ま、バカなのは最初から知ってたけどね。くひひ……。"
"41110-91-ミユ" = "も、モエちゃん……せっかく助けてくれたのに……。"
"41110-92-ミヤコ" = "助けは要らないと言い続けてきましたが……助けられてしまったのは事実ですね。"
"41110-93-ミヤコ" = "……ありがとうございます、先生。"
"41110-94" = "（その後、濡れた体でシャーレに戻った）"
"41110-95" = "（雨に濡れて風邪を引いたものの、とりあえずどうにかなって良かった……）"
"41110-96" = "次回;雨に濡れた請求書"
