[translation]
"41200-1" = "第20話;狐穴"
"41200-2" = "ヴァルキューレ警察学校・本館前"
"41200-3-シノン" = "私は今、カイザーグループとの癒着問題が噂になっているヴァルキューレ警察学校、その本館の前に来ています！"
"41200-4-シノン" = "とある匿名希望の方からの情報によりますと……"
"41200-5-シノン" = "どうやら公安局の生徒たちがカイザーグループから金品を受け取り、そのために権力を行使したのだとか！"
"41200-6-シノン" = "市民を保護し正義を守るべきヴァルキューレが私企業と手を取っていたというのは、かなり衝撃的な情報です！"
"41200-7-シノン" = "それに加えて先日、どうやら謎の集団がヴァルキューレ警察学校に侵入。施設の一部を破壊したとの情報も入ってきています。"
"41200-8-マイ" = "ヴァルキューレの権威が揺らぐ事件が、立て続けに発生しています！"
"41200-9-シノン" = "果たして真相はどうなのでしょうか！？"
"41200-10-マイ" = "これらの件について解明するため、私たちは……！"
"41200-11-カンナ" = "\\"
"41200-12-カンナ" = "……何の騒ぎだ。"
"41200-13-シノン" = "あっ、カンナ公安局長です！"
"41200-14-シノン" = "突然ですが、今回の違法リベートの件につきまして一言頂けますでしょうか！"
"41200-15-カンナ" = "待て、それはどこからの情報で……"
"41200-16-カンナ" = "そもそもここは敷地内だ、許可は得ているのか？"
"41200-17-マイ" = "おおっと、やはりマスコミと権力とは衝突する運命なのか！しかし私たちクロノスは決して――"
"41200-18-カンナ" = "良いからさっさと出ていけ！"
"41200-19" = "子ウサギ公園"
"41200-20-ミヤコ" = "……すごいニュースになっていますね。"
"41200-21-ミユ" = "う、うん。朝からずっとそのニュースが……。"
"41200-22-ミユ" = "も、もしこれで公安局が襲撃しに来たら、どうすれば……？"
"41200-23-サキ" = "別に関係無い。私たちはやるべきことをやっただけだ。"
"41200-24-サキ" = "それにどうせ今は、クロノス含めて色々と対応しないといけないだろ。私たちに構ってる暇は無いはず。"
"41200-25-モエ" = "それはそうなんだけど、何か引っかかるって言うか……。"
"41200-26-サキ" = "どういうことだ？"
"41200-27-モエ" = "何て言うか、めちゃくちゃ対応が速い。"
"41200-28-モエ" = "連邦生徒会が調査チームを組織したのもそうだし、相当金がかかってたはずなのにカイザーもスッパリ再開発の中止を宣言するし……。"
"41200-29-モエ" = "……先生、連邦生徒会に脅迫でもした？"
"41200-30" = "[s1] \"いや、脅迫とかは別に……。\"\n[s2] \"……色々、込み入った事情があるみたいだね。\""
"41200-31-ミヤコ" = "……？とにかく、安心しました。"
"41200-32-ミヤコ" = "再開発が中止されるなら、放浪者の方々を追い出すことも無いでしょうし……。"
"41200-33-ミヤコ" = "……私たちも、ここにいられます。"
"41200-34-？？？" = "あー、その……。"
"41200-35-モエ" = "うわ、侵入者だ。"
"41200-36-モエ" = "サキ、手榴弾ちょうだい。"
"41200-37-モエ" = "朝のトレーニングがてら、軽く一発。"
"41200-38-デカルト" = "待て待て待て！侵入じゃない、あいさつに来たんだ！"
"41200-39-サキ" = "……挨拶？"
"41200-40-モエ" = "ああ、何か昔の本で読んだことある。「ちょっとした挨拶だぜ！」って言いながら鉛玉と爆薬をくらわせるあの……"
"41200-41-デカルト" = "これだから無法者は！！！"
"41200-42-デカルト" = "ああもう、とはいえ助けてもらった手前、何も言わないわけにも……。"
"41200-43-デカルト" = "……君たちには助けられてしまいました。"
"41200-44-デカルト" = "どうやら危険を顧みずヴァルキューレに潜入し、彼女たちの陰謀を暴いたのだとか。"
"41200-45-デカルト" = "おかげで私たちの聖所……子ウサギタウンも脅かされることがなくなり、「所確幸」の仲間たちも戻ってきています。"
"41200-46-デカルト" = "私たちのためではなかったのかもしれません。それでも恩を受けて知らぬ存ぜぬは、求道者としてできませんので……。"
"41200-47-デカルト" = "君たちのために、特別な食べ物をプレゼントしに来たのです。"
"41200-48-モエ" = "特別な食べ物！？何それ！？"
"41200-49-サキ" = "……まさかモヤシ弁当じゃないよな？"
"41200-50-デカルト" = "いえいえ、まさか。私たちが持っている中で最も貴重なものです。それはこちら……"
"41200-51-デカルト" = "鶏の骨を揚げた、"
"41200-52-デカルト" = "唐揚げです！"
"41200-53-ミヤコ" = "……唐揚げ、ですか？"
"41200-54-デカルト" = "はい。普通の唐揚げとは違って「鶏の骨」を揚げたものですので、そのまま食べることはできません。"
"41200-55-デカルト" = "しかしその香りはまさに普通の唐揚げ。この匂いを存分に味わうことで、楽しい気分を味わいながら、その実カロリーはゼロ。まさに革命的な食材です。"
"41200-56-デカルト" = "これ一つで、ビール3缶は飲めます！もちろんご飯にも相性はバッチリ。"
"41200-57-デカルト" = "さあ、存分に味わってください。"
"41200-58-ミユ" = "つ、つまりこれは「唐揚げ」じゃなくて……"
"41200-59-サキ" = "……生ゴミか？"
"41200-60-デカルト" = "な、生ゴミ！？違いますよ、れっきとした唐揚げです！パーツが違うだけで！"
"41200-61-デカルト" = "まだ十分に楽しめる物を「生ゴミ」とは、失礼千万！"
"41200-62-モエ" = "まあ、確かに生ゴミじゃないな。"
"41200-63-モエ" = "この辺のゴミ出し規定によると、鶏の骨は「燃えるゴミ」に分類されるみたいだし。"
"41200-64-デカルト" = "さ、さっきから生ゴミだの、燃えるゴミだの……"
"41200-65-デカルト" = "こんな貴重な食べ物を前に、何たることを……！"
"41200-66-デカルト" = "やはり我々「所確幸」は、あなたたちとは相容れない！"
"41200-67-デカルト" = "それはこっちの台詞だ！"
"41200-68-サキ" = "モエ、榴弾あるだけ持って来い！"
"41200-69-モエ" = "よっしゃ、派手に爆発させよう！"
"41200-70-ミヤコ" = "……またこうなるんですか。"
"41200-71" = "防衛室・オフィス"
"41200-72-カヤ" = "……やはりこうなってしまいましたか。"
"41200-73-カヤ" = "ヴァルキューレはしばらく動けそうにありませんね、クロノスもしつこそうですし……。"
"41200-74-カヤ" = "相変わらず、私は人に恵まれませんねぇ……。"
"41200-75-？？？" = "……それは前にも聞いた。"
"41200-76-カヤ" = "ふふっ……とはいえ、カイザーとこちら側についての件は見つかってないようですし……。"
"41200-77-カヤ" = "計画に支障は無さそうですね。"
"41200-78-？？？" = "その辺に気を遣っている暇があったら、信じられる仲間を増やすことに時間を使うべきでは？"
"41200-79-カヤ" = "信じられる仲間、ですか……。"
"41200-80-カヤ" = "そういえば、あなたの後輩たち……中々良さそうですね？"
"41200-81-カヤ" = "腐っても鯛と言いますか。熟練度は足りませんが、やはりSRTに入れただけのことはあります。"
"41200-82-ユキノ" = "私からしたら、まだSRTを名乗るには未熟。"
"41200-83-ニコ" = "ユキノちゃんは厳しいねぇ。"
"41200-84-ユキノ" = "ニコが甘いだけ。"
"41200-85-ユキノ" = "もし私だったら、警報を鳴らさずに1分で脱出できた。"
"41200-86-カヤ" = "まあ、まだ1年生ですものね。みなさんのようなベテランの実績を期待するのも酷というものでしょう。"
"41200-87-カヤ" = "とはいえ、そうですね……使わないのは勿体ないですし。"
"41200-88-カヤ" = "私たちの「クーデター」計画に、彼女たちも参加させる……というのはどうでしょうか？"
"41200-89-カヤ" = "先輩としてどうですか？SRT特殊学園、「FOX小隊」のみなさん？"
"41200-90-オトギ" = "まあ、良いんじゃないかねぇ。"
"41200-91-クルミ" = "こうなったら、それくらいの埋め合わせはしてもらわないと。"
"41200-92-ニコ" = "可愛い後輩たちの手は汚したくなかったけど……仕方ないかな？"
"41200-93-ユキノ" = "……仮にもSRTに入った身、最初から覚悟はしてたはず。"
"41200-94-ユキノ" = "全ては、SRTの復活。そして――"
"41200-95-ユキノ" = "シャーレ廃絶のために。"
"41200-96" = "カルバノグの兎編;To be Continued in Chapter 2"
