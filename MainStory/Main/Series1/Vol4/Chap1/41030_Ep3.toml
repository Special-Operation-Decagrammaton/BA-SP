[translation]
"41030-1" = "第3話;それぞれの事情"
"41030-2" = "取調記録：977-R-1"
"41030-3" = "担当者：ヴァルキューレ警察学校 3年 [ruby=おがた]尾刃[/ruby]カンナ"
"41030-4" = "容疑者：SRT特殊学園 1年 [ruby=そらい]空井[/ruby]サキ"
"41030-5" = "ヴァルキューレ警察学校・取調べ室"
"41030-6-カンナ" = "……名前は。"
"41030-7-サキ" = "……。"
"41030-8-カンナ" = "名前を言え！"
"41030-9-サキ" = "……とっくに知ってるだろ、聞く必要あるか？"
"41030-10-カンナ" = "質問は許可してない。"
"41030-11-カンナ" = "もう一度聞く、名前は？"
"41030-12-サキ" = "……空井サキだ。"
"41030-13-カンナ" = "所属は？"
"41030-14-サキ" = "SRT特殊学園、RABBIT小隊所属……だった。お前たちが勝手に閉鎖するまではな。"
"41030-15-カンナ" = "……良い態度だな。自分の状況を理解してるのか？"
"41030-16-カンナ" = "私がヴァルキューレ警察学校の「狂犬」と呼ばれていること……そちらこそ、知らないわけではないだろう？"
"41030-17-サキ" = "今さらそんな脅しが効くとでも思ってるのか？本当にそう考えてるならガッカリだ。"
"41030-18-サキ" = "SRTでの訓練には、捕虜になった時のことも想定された内容が組まれている。機密の取り扱いも少なくない。"
"41030-19-サキ" = "たとえお前が何をしようと、何かを聞き出せると思ったら大間違いだ。"
"41030-20-カンナ" = "……連邦生徒会からの資料も読んだ。どうやらSRTの中でも、相当優秀な成績を収めていたようだな。"
"41030-21-カンナ" = "筆記試験はほぼ満点、演習における実技もほぼ問題無い。"
"41030-22-カンナ" = "学校でも校則違反ひとつ犯していない……間違いなく優等生だ。"
"41030-23-カンナ" = "そんな貴様がなぜヴァルキューレへの編入を拒み、デモなんてものを起こした？"
"41030-24-サキ" = "……ヴァルキューレ警察学校と、SRT特殊学園とは違う。"
"41030-25-カンナ" = "答えになってない。"
"41030-26-サキ" = "SRT特殊学園では、放課後でも厳格な規則の下で生活をすることになる。"
"41030-27-サキ" = "定時に起床して寝具を整理し、一日の訓練と座学を行う。放課後だって寮の中で気を緩めずに訓練や整備をすることが求められる。その[ruby=じょうざいせんじょう]常在戦場[/ruby]の心構えが、SRTがSRTたる[ruby=ゆえん]所以[/ruby]。"
"41030-28-サキ" = "……ヴァルキューレ警察学校とは違う。"
"41030-29-サキ" = "最も規律に厳しいと言われる公安局でさえも、放課後には私服で自由なことができるんだろ？市民に緊張感を与えないという理由があったとしても。"
"41030-30-サキ" = "私は、そんな生き方はしない。のうのうと自由を与えられ[ruby=ヴァルキューレ]た犬に[/ruby]なるくらいなら、厳しい環境下でも[ruby=SRT]狼[/ruby]として誇りを持って生きる。"
"41030-31-サキ" = "……それが貴様の答えか。"
"41030-32-カンナ" = "……もう一つ聞こう。"
"41030-33-カンナ" = "交戦中、[ruby=かぜくら]風倉[/ruby]が中継用のドローンを破壊した。あの時、意味も無く弾丸を浪費したはずだ。"
"41030-34-カンナ" = "どうして止めなかった？貴様ほどの優等生だったら、ああいった防衛戦において弾薬がどれだけ貴重なものか、知っていたはずだろう？"
"41030-35-カンナ" = "それも何か、SRTなりの規律だったのか？"
"41030-36-サキ" = "……。"
"41030-37-サキ" = "訓練では弾薬の無駄撃ちとかできなかったし、一回くらいやってみたくて……。"
"41030-38" = "空"
"41030-39" = "井"
"41030-40" = "サ"
"41030-41" = "キ"
"41030-42" = "不適格"
"41030-43" = "取調記録：977-R-2"
"41030-44" = "担当者：ヴァルキューレ警察学校 1年生 [ruby=なかつかさ]中務[/ruby]キリノ"
"41030-45" = "容疑者：SRT特殊学園 1年生 [ruby=かぜくら]風倉[/ruby]モエ"
"41030-46-キリノ" = "えっと……風倉モエさん。"
"41030-47-モエ" = "んー？"
"41030-48-モエ" = "っていうかそろそろ聞いておきたいんだけど、これ何時間くらいやるの？"
"41030-49-モエ" = "早めに終わらせてくんないかな。予備の飴も少なくなってきたし。"
"41030-50-キリノ" = "そ、そうは行きません！"
"41030-51-キリノ" = "この状況で、飴の話をしている場合ですか？"
"41030-52-キリノ" = "そういった態度でしたら、その残った飴も没収してしまいますよ！"
"41030-53-モエ" = "めんどくさいなあ……。"
"41030-54-キリノ" = "風倉さん、単刀直入にお聞きします。どうしてあの時、公園を占拠したのですか？どうしてヴァルキューレの呼びかけに応じなかったのですか？"
"41030-55-キリノ" = "最初から武器を捨てて素直に投降していたら、事態はここまで大きくならなかったはずです。"
"41030-56-モエ" = "……SRTから、出ていきたくなかったから。"
"41030-57-キリノ" = "な、なるほど……確かに本官も、突然「ヴァルキューレ警察学校から出ていけ」と言われたら悩んでしまいます。"
"41030-58-キリノ" = "苦楽を共にした仲間との思い出、それを簡単に捨て去ることなどできません……承知しました。その点については情状酌量の――"
"41030-59-モエ" = "いや、それは別にどーでも良いんだけど。"
"41030-60-モエ" = "むしろあのRABBIT小隊とはさっさとお別れしたいところだよ。"
"41030-61-モエ" = "サキは毎日小言ばっかりだし、ミユはすぐ泣くし……。"
"41030-62-キリノ" = "で、では、どうしてSRTを離れたくないと……？"
"41030-63-モエ" = "そりゃあ勿論、あの大量の武器のためだよ！"
"41030-64-キリノ" = "ぶ、武器でしたら、ヴァルキューレ警察学校にも色々とありますが……？"
"41030-65-モエ" = "いやいやいや、ヴァルキューレなんかとはレベルが違うんだって！"
"41030-66-モエ" = "区画をひとつ丸ごと焼き尽くせるようなミサイルとか、戦車の装甲をものともしない弾薬とか……！"
"41030-67-モエ" = "あんなに強力な火力を好きなだけ振り回せるのは、SRT特殊学園だけでしょ！"
"41030-68-キリノ" = "い、いえ、SRT特殊学園でも「好きなだけ」はダメですよ！？"
"41030-69-キリノ" = "（そういえばこの方、いつか無差別乱射で商店街を半壊にさせたとか……）"
"41030-70-キリノ" = "SRTもまたヴァルキューレと同じで、本来は市民の安全を守るための組織じゃないですか……。"
"41030-71-キリノ" = "それなのに、武器が一番大事とは……"
"41030-72-キリノ" = "風倉さんはまさか、市民の安全はどうでも良いと仰るのですか！？"
"41030-73-モエ" = "うん。"
"41030-74-キリノ" = "……。"
"41030-75" = "風"
"41030-76" = "倉"
"41030-77" = "モ"
"41030-78" = "エ"
"41030-79" = "不適格"
"41030-80" = "取調記録：977-R-3"
"41030-81" = "担当者：ヴァルキューレ警察学校 1年生 [ruby=ねむがき]合歓垣[/ruby]フブキ"
"41030-82" = "容疑者：SRT特殊学園 1年生 [ruby=かすみざわ]霞沢[/ruby]ミユ"
"41030-83-フブキ" = "えっと、名前は……"
"41030-84-ミユ" = "か、霞沢ミユ、です。SRT特殊学園の1年生で……RABBIT小隊では、狙撃手を担当しています……。"
"41030-85-ミユ" = "15歳で、誕生日は7月12日……しゅ、趣味は小石探し、です。"
"41030-86-フブキ" = "いや、そこまでは別にいらないけど……。"
"41030-87-ミユ" = "わ、私、これからどうなるんでしょうか……？"
"41030-88-ミユ" = "もしかして、恐ろしい拷問とか……！？"
"41030-89-ミユ" = "一日中同じ曲を聴かされるですとか、一晩中くすぐられるとか……！"
"41030-90-ミユ" = "お、お願いです許してください！し、知ってることは全部言いますので……！"
"41030-91-フブキ" = "いや、それも別にしないし……。"
"41030-92-フブキ" = "言ってくれるんなら、まず理由を説明してくれると嬉しいかな。どうしてヴァルキューレへの編入を拒否したのか、どうしてあの公園でデモを起こしたのか。"
"41030-93-ミユ" = "へ、編入はその……怖くって……。"
"41030-94-フブキ" = "怖いって……別にうちの学校、不良とかほとんどいないと思うけど？"
"41030-95-ミユ" = "いえ、その、そういった意味ではなくって……。"
"41030-96-ミユ" = "私、その、誰かと仲良くなるのが、怖いんです……。"
"41030-97-ミユ" = "今のRABBIT小隊でも、そんなに仲が良いわけではありませんが……ミヤコちゃんとか、時々面倒を見てくれたりしてますし……。"
"41030-98-ミユ" = "でも、新しいところに編入することになったら……。"
"41030-99-ミユ" = "全部、初めからになって……こんな影の薄い私になんて、誰も話しかけてくれないでしょうし……。"
"41030-100-ミユ" = "そんなことになるくらいなら、いっそのこと公園で野宿でもした方が……。"
"41030-101-フブキ" = "……変な子だね。新しい人に会うのは怖い？"
"41030-102-ミユ" = "会うことが怖いと言いますか……人から忘れられるのが、怖いです。"
"41030-103-ミユ" = "誰にも認識されなくなったら……そう考えると、もう……。"
"41030-104-ミユ" = "この性格を直したくてSRTに入ったのに、学校が閉鎖なんて……私、どうすれば良いのでしょうか？"
"41030-105-フブキ" = "なるほどねぇ……"
"41030-106-フブキ" = "じゃあ、うちの生活安全局にでも来たら？編入試験も難しくないし、数もそれほど多くないし。"
"41030-107-フブキ" = "多分忘れられるとか無いんじゃないかな。面倒ごとも少ないし、人に会うこともそんなに無い部署だからさ。"
"41030-108-ミユ" = "そ、そうなんですか……？"
"41030-109-ミユ" = "ほとんど誰とも会わずに、静かに学校生活が……？"
"41030-110-フブキ" = "うーん、「ほとんど誰とも」は無理かな。"
"41030-111-フブキ" = "生活安全局には、色んな市民から苦情とか入って来るし……。"
"41030-112-ミユ" = "あ、じゃあ無理です……。"
"41030-113" = "霞"
"41030-114" = "沢"
"41030-115" = "ミ"
"41030-116" = "ユ"
"41030-117" = "不適格"
"41030-118" = "取調記録：977-R-4"
"41030-119" = "担当者：シャーレ [USERNAME]先生"
"41030-120" = "容疑者：SRT特殊学園 1年生 [ruby=つきゆき]月雪[/ruby]ミヤコ"
"41030-121-ミヤコ" = "……あの時の。"
"41030-122" = "[s1] \"ミヤコ……だよね？\"\n[s2] \"びっくりした？\""
"41030-123-ミヤコ" = "つまり、取り調べの担当者が先生ということですよね。"
"41030-124-ミヤコ" = "……正直、少し驚きました。まさか先生がいるとは。"
"41030-125-ミヤコ" = "つまり、取り調べの担当者が先生ということですよね。"
"41030-126-ミヤコ" = "まあ、誰だって構いません。相手が誰であろうと、答えは変わりませんから。"
"41030-127-ミヤコ" = "何か聞きたいことがあればどうぞ。"
"41030-128" = "[s] \"そこでの生活、何か不便なこととか無い？\""
"41030-129-ミヤコ" = "……最初から変な質問ですね。"
"41030-130-ミヤコ" = "お気になさらず。仮にあったとしても、捕虜の立場で何か言うつもりもありません。"
"41030-131-ミヤコ" = "それともあれでしょうか？環境を改善する代わりに、何か情報を引き出そうと？"
"41030-132-ミヤコ" = "心変わりでもさせようとしているのでしたら、諦めた方が良いです。"
"41030-133-ミヤコ" = "仮に何を提案されても、私たちのSRTへの気持ちは変わりません。"
"41030-134" = "[s] \"そっか。ところで質問なんだけど、ミヤコはヴァルキューレが嫌い？\""
"41030-135-ミヤコ" = "……何か勘違いされているかもしれませんが。"
"41030-136-ミヤコ" = "特段、ヴァルキューレが嫌いだったから転校を拒否したわけではありません。"
"41030-137-ミヤコ" = "嫌なのは、SRTを去ることです。"
"41030-138" = "[s] \"なるほど。その理由を聞いても良いかな？\""
"41030-139-ミヤコ" = "……SRTには、そこにしかない「正義」があるからです。"
"41030-140" = "[s] \"「正義」……。\""
"41030-141-ミヤコ" = "あらためて話すと、難しい概念ではあります。"
"41030-142-ミヤコ" = "しかし先生も、「正義」について耳にする機会はあるでしょう。"
"41030-143-ミヤコ" = "他の学園もそういった集団はあると聞きますが……ここヴァルキューレもまた、生徒たちは自らの行動が「正義」だと信じているかと思います。"
"41030-144-ミヤコ" = "……しかし私にとって、彼女たちの正義は「本当の正義」ではないと考えています。"
"41030-145-ミヤコ" = "「正義」とは、理にかなった正しい道理のこと。"
"41030-146-ミヤコ" = "その道理は真理に基づくものです。であるならば、相手や状況によって変わるものではありません。"
"41030-147-ミヤコ" = "しかしキヴォトスにおける各所の治安組織は、様々な利害関係の中にあります。その結果、「正義」というものを自分たち独自に歪曲し続けてきました。"
"41030-148-ミヤコ" = "しかしSRT特殊学園だけは……学園間の関係や利害の問題に左右されず、自らが信じる正義を実行していました。"
"41030-149-ミヤコ" = "時と場所を選ばず、相手が誰であっても同じ基準で、ひとつの正義を追求する組織……。"
"41030-150-ミヤコ" = "そんなSRT特殊学園に、私は憧れたのです。"
"41030-151-ミヤコ" = "そういった、屈強な正義に。"
"41030-152-ミヤコ" = "しかし、SRT特殊学園は閉鎖……。"
"41030-153-ミヤコ" = "私がもう少し上手くやれていれば……きちんと彼女たちの能力を上手く発揮できていれば……。"
"41030-154" = "[s] \"聞く限り、ミヤコは十分頑張ってたと思うけど……。\""
"41030-155-ミヤコ" = "……ほとんど初対面の人にそう言われましても。"
"41030-156-ミヤコ" = "先生からそんな誉め言葉を聞いたところで、何にもなりません。"
"41030-157-ミヤコ" = "先生はあの時、短い時間で味方の長所を最大化し、私たちの弱みを突いて戦況を変えました。それに比べて……"
"41030-158-ミヤコ" = "私は、全然上手くできず……。"
"41030-159" = "[s] \"そこまで自分を責めなくても良いんじゃないかな……？\""
"41030-160" = "[s] \"……話は変わるけど、何か必要な物とか無い？欲しい物でも。\""
"41030-161-ミヤコ" = "……他に話すことはありません。先ほどお伝えした通り、不満もありませんし。"
"41030-162-ミヤコ" = "強いて言うとすれば、SRT特殊学園の閉鎖命令を撤回していただきたいのですが？"
"41030-163" = "[s] \"今すぐ私だけでどうにかするのは、ちょっと難しいかも……。\""
"41030-164-ミヤコ" = "……でしたら私たちは戦い続けます、SRT特殊学園の復活のために。"
"41030-165-ミヤコ" = "諦めない限り、SRTの名前は無くなりませんので。"
"41030-166" = "[s] \"……仮に、勝算が薄いとしても？\""
"41030-167-ミヤコ" = "はい。"
"41030-168" = "月"
"41030-169" = "雪"
"41030-170" = "ミ"
"41030-171" = "ヤ"
"41030-172" = "コ"
"41030-173" = "保留"
"41030-174" = "ヴァルキューレ警察学校・公安局オフィス"
"41030-175-カンナ" = "……以上が、今回の記録です。"
"41030-176-カンナ" = "先生にもお忙しい中ご協力いただいてしまい、ありがとうございました。おかげ様で手間が省けました。"
"41030-177" = "[s] \"あの子たちは、これからどうなるの？\""
"41030-178-カンナ" = "一定期間の拘禁の後、本来であれば再度ヴァルキューレへの編入を薦める手はずだったのですが……。"
"41030-179-カンナ" = "連邦生徒会からの要望が強いため、そちらで処罰が下されるでしょう。事件の被害が大きかったこともあり、重いものになりそうです。"
"41030-180-カンナ" = "最悪の場合、どの学校にも編入できない状態に……。"
"41030-181" = "[s] \"SRT特殊学園の復活って、やっぱりあり得ないのかな？\""
"41030-182-カンナ" = "……そもそも私としては、彼女たちの要求を飲むこと自体が気に入らないのですが。"
"41030-183-カンナ" = "それはさておき、「SRT特殊学園の閉鎖」は連邦生徒会の決定です。少なくとも私のような存在がどうこう言えることではありませんし……"
"41030-184-カンナ" = "「超法規的権限」を持つシャーレだとしても、これを覆すことは難しいかと。"
"41030-185" = "[s] \"じゃあ、連邦生徒会の誰かに聞いてみるとか……？\""
"41030-186-カンナ" = "それは、私からは何とも……。"
"41030-187" = "では、私が代わりにお答えしましょうか。"
"41030-188-カンナ" = "こ、この声は……。"
"41030-189-カヤ" = "初めまして……ですね、先生。"
"41030-190-カヤ" = "キヴォトス連邦生徒会所属、防衛室のカヤと申します。"
"41030-191" = "次回;別側面の事情"
