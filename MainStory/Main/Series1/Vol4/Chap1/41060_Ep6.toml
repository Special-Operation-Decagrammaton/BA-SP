[translation]
"41060-1" = "第6話;食料調達を始めよう"
"41060-2" = "（翌朝、みんなが無事に過ごせているかを確認するため公園を訪れていた）"
"41060-3" = "子ウサギ公園前"
"41060-4" = "[ns1] \"うわっ！？\"\n[ns2] \"と、トラップ……！？\""
"41060-5-サキ" = "……なんだ、先生か。"
"41060-6-サキ" = "何か変な動きしてるから、不審者か野良犬と思った。"
"41060-7" = "[s3] \"野良犬って……。\"\n[s4] \"公園に罠とか危ないでしょ！？\""
"41060-8-サキ" = "そうは言っても仕方ないだろ。"
"41060-9-サキ" = "そうは言っても仕方ないだろ。"
"41060-10-サキ" = "侵入者を防ぐためには、これくらいやらないと。"
"41060-11-モエ" = "あ、先生じゃん。"
"41060-12-モエ" = "そこの足元、気を付けた方が良いよ。地雷埋まってるから。"
"41060-13" = "[s5] \"えぇ！？\"\n[s6] \"待って待って、一歩も動けない！地雷どの辺！？\""
"41060-14-モエ" = "どの辺だったかな……具体的な場所は忘れちゃった。"
"41060-15-モエ" = "どの辺だったかな……具体的な場所は忘れちゃった。"
"41060-16-モエ" = "まあ、爆発したらそこにあるよ。"
"41060-17" = "[s] \"どうしてそんな危険なものを次々と……！？\""
"41060-18-サキ" = "危険も何も、最小限の自衛手段だ。"
"41060-19-モエ" = "そうそう、何ならこれじゃ全然足りないくらいだよ！"
"41060-20-モエ" = "できれば公園の外周部分に、対戦車地雷とか色んなトラップを仕掛けておきたいところなのに。"
"41060-21" = "[s] \"明らかにやり過ぎなのでは……。\""
"41060-22-サキ" = "警戒において「やり過ぎ」なんてことはない。常に万全の準備をしておかないと。"
"41060-23-モエ" = "少し油断したら、またあのワンコみたいな警察がやってくるとも分からないしね。"
"41060-24-ミヤコ" = "サキ、モエ、"
"41060-25-ミヤコ" = "何か問題でもありましたか？"
"41060-26-ミユ" = "ひっ、せせ、先生……！？"
"41060-27-ミヤコ" = "……おはようございます。"
"41060-28-ミヤコ" = "早朝から何か用ですか？"
"41060-29" = "[s7] \"大丈夫かなって思って。\"\n[s8] \"何か困ってることとかある？\""
"41060-30-ミヤコ" = "見ての通り、何の問題もありません。"
"41060-31-ミヤコ" = "見ての通り、何の問題もありません。"
"41060-32-ミヤコ" = "SRT特殊学園は、キャンプ生活に慣れてますから。"
"41060-33-サキ" = "これくらい、SRTなら朝飯前。"
"41060-34-サキ" = "当然の素養だ。"
"41060-35-ミユ" = "それにここは水が使えるし、むしろ快適なくらいだね。"
"41060-36-ミユ" = "日陰も多くて、隠れやすいですし……。"
"41060-37-サキ" = "ですので、気にしなくても大丈夫です。"
"41060-38-サキ" = "別に何も問題無いから、さっさと帰れ！"
"41060-39" = "[ns] \"今のって……。\""
"41060-40-サキ" = "……雷が近いのかもしれないな。"
"41060-41-ミユ" = "それは無理があるでしょ……どうして我慢できなかったのさ……。"
"41060-42-サキ" = "仕方ないだろ、生理現象なんだから！"
"41060-43-ミユ" = "うぅ……。"
"41060-44-ミヤコ" = "……あらためてですが、何も問題はありませんので――"
"41060-45" = "[ns] \"……本当に？\""
"41060-46-ミヤコ" = "……。"
"41060-47-サキ" = "あーもう、イライラしたら余計にお腹空いてきた……。"
"41060-48-ミユ" = "そ、その実は……。"
"41060-49-サキ" = "ああもう、何も食べてないんだよ！悪かったな！？"
"41060-50-ミヤコ" = "水はありますが、逆に言うと水しかありませんから……。"
"41060-51-ミヤコ" = "補給も何も、あてにはできませんし……。"
"41060-52-サキ" = "くそっ、こうなるならSRTから食料を持ってくるんだった……。"
"41060-53-サキ" = "対空ミサイルを持ってくるなら、普通に考えて食料の方が……"
"41060-54" = "何言ってんの、ミサイルだって大事じゃん！"
"41060-55-モエ" = "何よりも綺麗だし！"
"41060-56-モエ" = "それより、その地味に重い教範の方が問題でしょ。それを捨てて食べ物を入れとけば良かったのに……。"
"41060-57-サキ" = "バカ！"
"41060-58-サキ" = "学生が教範を捨てるわけにいかないだろ！"
"41060-59-ミユ" = "お店で買おうにも、学校の口座が停止されてしまってるので……。"
"41060-60-ミユ" = "私たちきっと、このまま飢え死するんだ……。"
"41060-61-ミユ" = "うぅ、SRTに帰りたい……。"
"41060-62" = "[ns] カバンからカップ麺を取り出す。"
"41060-63-ミユ" = "あ、あれって……。"
"41060-64-サキ" = "……カップ麺？"
"41060-65-モエ" = "ミッシンの鶏ガラ醤油ラーメン……！私の大好物……！"
"41060-66" = "[s9] \"他にも色々持ってきたから。\"\n[s10] \"一緒に食べない？\""
"41060-67-モエ" = "……ま、まあ？先生がどうしてもって言うんなら？"
"41060-68-モエ" = "……ま、まあ？先生がどうしてもって言うんなら？"
"41060-69-ミヤコ" = "……待ってください。"
"41060-70-ミヤコ" = "簡単に受け取ってはいけません。"
"41060-71-ミヤコ" = "追い詰められた環境において、重要な物資を提供する素振りを見せ、その見返りとしてさらに大事なものを要求する……"
"41060-72-ミヤコ" = "よくある手口です、真意も分からない段階で受け取るわけにはいきません。"
"41060-73" = "[s] \"いや、特に見返りとかは……。\""
"41060-74-サキ" = "はっ、信じられるとでも思ったか？"
"41060-75-サキ" = "元々作戦時は、持参したもの以外は胃に入れないなんてのは普通のこと。"
"41060-76-サキ" = "安全性も保障されてない食べ物を、やすやすと口にするわけ無いだろ。"
"41060-77" = "[s] カップ麺の蓋を開ける。"
"41060-78-サキ" = "なっ……！"
"41060-79-サキ" = "おい、食べないって言ってるだろ！？"
"41060-80" = "[ns] お湯を注ぐ。"
"41060-81-サキ" = "くぅっ……！"
"41060-82-ミユ" = "良い匂い……ますますお腹空いてきた……。"
"41060-83" = "[s11] \"せっかくだし、食べたら？\"\n[s12] \"冷めちゃうよ？\""
"41060-84-ミヤコ" = "……結構です。そんな形で私たちの意志を折ろうとしても無駄なこと。"
"41060-85-ミヤコ" = "一度引っ掛かってしまえば、先生の策略に巻き込まれ続けることになりますし。"
"41060-86-サキ" = "た、"
"41060-87-サキ" = "たかがカップ麺で降参してたまるか！"
"41060-88" = "ま、まあ、もっとご馳走とかで釣られるならまだしも……"
"41060-89" = "[s] \"じゃあとりあえずお先に……\""
"41060-90-モエ" = "うっ、ぐっ……！"
"41060-91-モエ" = "めちゃくちゃ良い匂いが……！"
"41060-92-サキ" = "ま、負けてたまるか……！"
"41060-93-サキ" = "こういう時こそ深呼吸！！"
"41060-94-サキ" = "薬物を使った拷問への対処として、学園で習っただろ！"
"41060-95-サキ" = "脳が刺激されたところで、意志が折れなければ問題無い！別の方法で誤魔化すんだ！"
"41060-96-ミユ" = "うぅ、耐えないと……。"
"41060-97-ミヤコ" = "私たちは決して、拷問には屈しません……！"
"41060-98" = "[ns] 温泉卵を入れる。"
"41060-99-ミヤコ" = "……あ。"
"41060-100-サキ" = "今の、もしかして……。"
"41060-101-モエ" = "この段階で卵は反則だわ……。"
"41060-102-ミヤコ" = "うぅ、絶対美味しい……。"
"41060-103-ミヤコ" = "あそこまでされたら、もう……"
"41060-104-サキ" = "……っ、我慢できない！"
"41060-105" = "[s] \"……食べる？\""
"41060-106-一同" = "食べる！！"
"41060-107" = "[s13] \"はい。ところで……やっぱり、ヴァルキューレに行くって手は無し？\"\n[s14] \"少なくとも食糧問題は一旦そうした方が……。\""
"41060-108-ミヤコ" = "やはり私たちの忍耐力を揺さぶった上で、交渉をしようと。"
"41060-109-サキ" = "本当の姿を現したな、この下種め。"
"41060-110-ミユ" = "やっぱり、世の中は醜いもの……。"
"41060-111-モエ" = "おぞましい手段を使ってくるじゃん………。"
"41060-112-ミヤコ" = "何をされても、私たちの学園に対する気持ちは変わりません。"
"41060-113-ミヤコ" = "確かに空腹もあります、不便です。それでもこうしなければ、私たちの信念は守れません。"
"41060-114-ミヤコ" = "それを差し出してまで、悠々自適な生活など要らないのです。"
"41060-115" = "[ns] 持ってきたメモを渡す。"
"41060-116-ミヤコ" = "……これは？"
"41060-117" = "[s15] \"情けに見える形が嫌なら、これはどうかなって思って。\"\n[s16] \"とりあえず私からって形じゃなくて、食べ物を貰えるよ。\""
"41060-118-ミヤコ" = "……ここに行けば、何かがあると？"
"41060-119-ミヤコ" = "……ここに行けば、何かがあると？"
"41060-120-ミヤコ" = "何をされても心は変わらないと、既に何度も言ったはずですが……。"
"41060-121-ミヤコ" = "（本当に、何を考えているのか……）"
"41060-122-ミヤコ" = "……分かりました。どういった内容かは分かりませんが、これは受け取っておきます。"
"41060-123-ミヤコ" = "あくまで、受け取るだけです。"
"41060-124-サキ" = "あいつ、本当に何を考えてるんだ……。"
"41060-125-ミユ" = "先生も、私たちのことを分かってくれようとしてるのかな……。"
"41060-126-モエ" = "甘いよ、ミユ。そんな簡単に心を許したら、危ない目に遭うよ？"
"41060-127-サキ" = "でも、さっきの表情は割と真剣だった。てきとうなことを考えてるわけじゃなさそうだ。"
"41060-128-サキ" = "もしかしたら今後、SRTを復活させるのに手を貸してくれたり……"
"41060-129-ミヤコ" = "書かれてた住所、ここですね。"
"41060-130-モエ" = "もうお腹が空きすぎて一歩も歩けない……"
"41060-131" = "……ここ、シャーレのオフィスじゃないか？"
"41060-132-サキ" = "ここに呼んで、一体何を……？"
"41060-133-ソラ" = "あれ、確かそろそろ……？"
"41060-134-サキ" = "えっと、[USERNAME]先生の紹介で来たんだけど。"
"41060-135-ソラ" = "あっ、お待ちしておりました……！"
"41060-136-ソラ" = "先生からお話は聞いています。"
"41060-137-ソラ" = "「廃棄品」を、代わりに処分してくださるんですよね！"
"41060-138-サキ" = "……は？"
"41060-139-ソラ" = "ここはあんまりお客さんも来ないので、廃棄品が多いんです……勿体ないのですが……。"
"41060-140-ソラ" = "毎回生ゴミ用のビニール袋に入れて処理するのですが、それも結構手間でして……"
"41060-141-ソラ" = "それを代わりにやってくださる……？というようなことを先生から聞きまして、助かりました。こちらに集めておきましたので。"
"41060-142-一同" = "………。"
"41060-143-ソラ" = "……あ、あれ？もしかして何か手違いが……？"
"41060-144-モエ" = "いや、大丈夫大丈夫！"
"41060-145-モエ" = "あとは任せて！"
"41060-146-ソラ" = "そ、そうでしたか。えっと……それとは関係ありませんが、体調は大丈夫ですか？何だか顔色が悪いような……？"
"41060-147-モエ" = "それはお腹が空……いや、まあ色々とあってね！"
"41060-148-モエ" = "他に何か、賞味期限切れのものとかあるかな？全部持っていくけど。"
"41060-149-ソラ" = "あっ、はい！ありますので、ちょっと待っててください……！"
"41060-150-サキ" = "待て待て待て！モエ、これは色々ダメだろ！？"
"41060-151-サキ" = "廃棄弁当を貰うなんて、そんな……！"
"41060-152-モエ" = "でもこれ捨てられちゃうんでしょ。まだ食べられるのに、勿体ないじゃん。確かにこれは「情け」って感じじゃないし。"
"41060-153-サキ" = "で、でも私たちSRTが、こんな……！"
"41060-154-モエ" = "ま、サキが食べないなら別に良いけど。"
"41060-155-モエ" = "私が美味しく頂くから！"
"41060-156-サキ" = "た、食べないとは言ってないだろ！"
"41060-157-ミユ" = "うっ、うっ……"
"41060-158-ミユ" = "私たち、これからはこうして廃棄弁当を貰いながら過ごしていくんだ……。"
"41060-159-ミヤコ" = "[USERNAME]先生……。"
"41060-160" = "この屈辱、忘れませんからね……。"
"41060-161" = "次回;ニンジン作戦（１）"
