[translation]
"3401-1" = "山海経のちょっと特別な朝（１）"
"3401-2-キサキ" = "いち、に、さん、し……#nにーに、さん、し……"
"3401-3-キサキ" = "ふぅ……[ruby=びゃっこ]白虎[/ruby]公園といえど、この時間には誰もおらぬのじゃな。"
"3401-4-キサキ" = "かような姿を誰にも見られずに済むのは良いことじゃ。"
"3401-5-キサキ" = "ふふ……朝早くから身体を動かすのは気持ち良いのう。"
"3401-6-キサキ" = "護衛もおらぬゆえ、自由の身になったような気分……#nうむ。早起きは三文の徳、じゃな。"
"3401-7-キサキ" = "まぁ……目が覚めてしまうだけなのじゃが。#n……たまには、寝坊してみたくもある。"
"3401-8-キサキ" = "……。"
"3401-9-キサキ" = "さて、そろそろ戻るとしよう。"
"3401-10-レイジョ" = "今のは、もしかして……"
"3401-11-レイジョ" = "いえ、もしかしなくとも……カンフーの練習では！？"
"3401-12-レイジョ" = "あの門主様が……！？"
"3401-13-カグヤ" = "[ruby=うるしばら]漆原カ[/ruby]グヤ、感激いたしました……っ！"
"3401-14-カグヤ" = "最初は我が目を疑っておりましたが……"
"3401-15-カグヤ" = "[ruby=てんがいひりん]天涯比隣[/ruby]――この世で理解し合える者が居れば、たとえ地の果てに居ようとも、隣人のように感ずるものである……"
"3401-16-カグヤ" = "門主様……！#nついに我々の忠誠心を理解し、京劇の稽古を始めて下さったのですね！"
"3401-17-レイジョ" = "玄龍門の事は未だに苦手です。"
"3401-18-レイジョ" = "うるさいし、無礼だし、傲慢だし……#nまるで自分たちが法だと言わんばかりの態度……"
"3401-19-レイジョ" = "……もちろん、それが必要な場面があることは承知しています。"
"3401-20-レイジョ" = "ああでも、門主様だけは例外です。#n基本的に話が通じますし、時には私たちに寄り添ってくれる方です。"
"3401-21-レイジョ" = "そんな門主様が……まさか、こっそりカンフーの練習をしていたとは！"
"3401-22-レイジョ" = "朝練をしに来た甲斐がありました。#n普段より早く目覚めたのも何かの導きだったのですね……#nすべてはこの場面を目撃するための！"
"3401-23-レイジョ" = "まさに運命と言えるでしょう！#nこれを機に門主様と共に……！"
"3401-24-レイジョ" = "いえ、先にこの事実を皆さんに知ってもらわねば……！#nまずは……ルミ会長に！"
"3401-25-カグヤ" = "……京劇部は例の事件を受け、一定期間、活動を自粛することになりました。"
"3401-26-カグヤ" = "無論、門主様の決定に不服などありません。"
"3401-27-カグヤ" = "むしろ、門主様に見放され、もう二度と忠義を示せなくなるのではないかと懸念していたくらいです。"
"3401-28-カグヤ" = "ですが、門主様は自ら京劇の稽古をしてくださり……実はま[ruby=わたし]だ私た[/ruby]ちのことを見捨ててないのだと示して下さりました！"
"3401-29-カグヤ" = "嗚呼――身に余る光栄！"
"3401-30-カグヤ" = "これで京劇部は世間[ruby=はばか]に憚る[/ruby]ことなく、劇を披露することができます！"
"3401-31-カグヤ" = "ええ、部にとっても朗報です！#n早く皆にこの事実を伝えねば！"
"3401-32-レイジョ" = "それで――キサキが朝早くに公園でカンフーの練習をしていた、と？"
"3401-33-レイジョ" = "はい！まさか、私以外にもカンフーの素晴らしさに気づいてくれる人がいたとは！#nそれも、あの門主様が……！"
"3401-34-レイジョ" = "カンフーを愛し、修行に勤しむ身として、嬉しい限りです！"
"3401-35-ルミ" = "えっと……それは多分だけど……"
"3401-36-ルミ" = "……。"
"3401-37-ルミ" = "うん、そうだよね。"
"3401-38-レイジョ" = "どうかしましたか、会長？"
"3401-39-ルミ" = "ううん、なんでもないよ。"
"3401-40-ルミ" = "（あたしの知る限り、キサキはカンフーに興味ないと思うんだけどね……）"
"3401-41-ルミ" = "それで……これからどうするの？"
"3401-42-レイジョ" = "そうですね……カンフーを愛する同志にも、それを共有しようと思っているところです。"
"3401-43-レイジョ" = "ご存知の通り、山海経だけでなくキヴォトス全土を見わたしても、武術を極める者は少ないです。"
"3401-44-レイジョ" = "ですので、同志が一人増えるというのは、とてもめでたいことなのです！"
"3401-45-レイジョ" = "いち早く皆に伝えねば……！それでは、お先に失礼します！"
"3401-46-ルミ" = "元気なのは良いんだけどさ……"
"3401-47-ルミ" = "ま、本人が喜んでるし別にいっか！"
"3401-48-ルミ" = "しかし、あのキサキがねぇ……うーん、やっぱり妙というか……"
"3401-49-ルミ" = "でも、本当にカンフーの練習をしてたのなら……"
"3401-50-ルミ" = "後でこっそり、お菓子でも差し入れてあげようかな。"
"3401-51-京劇部員" = "本当なのですか？部長。"
"3401-52-カグヤ" = "ええ、この目でしかと見ました！"
"3401-53-京劇部員" = "無論……見つからぬよう遠くから見ていたので、勘違いだと主張する者もいるでしょう……"
"3401-54-カグヤ" = "しかし、これだけは断言できます――この漆原カグヤの目に狂いは無し！"
"3401-55-カグヤ" = "円を[ruby=えが]描[/ruby]くような振り付け……#nそして両の腕を大きく伸ばし、全身をそらす動作！ええ、まさに……！"
"3401-56-カグヤ" = "我ら京劇部の「京劇舞踊」そのものでした！"
"3401-57-京劇部員" = "京劇舞踊……それは京劇の基本的な動きを応用して作られた――"
"3401-58-京劇部員" = "私たち京劇部特有の舞踊……！"
"3401-59-京劇部員" = "でも、おかしくないですか？#n我々京劇部の舞踊をなぜ門主様がご存知なのでしょう。"
"3401-60-カグヤ" = "おかしくなどありません。よく考えてみてください。"
"3401-61-カグヤ" = "門主様は――全てを知っているお方なのですよ？"
"3401-62-京劇部員" = "た、たしかに！"
"3401-63-カグヤ" = "しかし、いくら美しい至宝でも、多少の[ruby=かし]瑕疵[/ruby]はあるというもの……。"
"3401-64-カグヤ" = "門主様の京劇舞踊は、ところどころ未熟な箇所が見受けられました。"
"3401-65-カグヤ" = "――であれば！我々が門主様に手ほどきすればよいのです！"
"3401-66-京劇部員" = "そうですね！#n京劇部一同、門主様のために頑張りましょう！"
"3401-67-山海経の生徒A" = "ねぇねぇ、聞いた？門主様がさぁ……"
"3401-68-山海経の生徒B" = "聞いた聞いた！ほんとビックリしたんだから……#nってか、この話聞かれたらマズいんじゃないの……？"
"3401-69-山海経の生徒A" = "バレなきゃいいんじゃない？#nすごいよね……門主様が早朝からあんな練習をしているなんて……"
"3401-70-山海経の生徒B" = "たしかにね……でも、この話が広まったら門主様のお立場とか色々大変になっちゃうかも……。"
"3401-71-レイジョ" = "おや、武術研究部の皆さんではありませんか。#n何か御用でしょうか？"
"3401-72-武術研究部員" = "お久しぶりです、レイジョさん。"
"3401-73-武術研究部員" = "その……門主様の「例の件」なんですが……。"
"3401-74-武術研究部員" = "どうか、私たち武術研究部に協力してくれませんか？#n一瞬で構いませんので！"
"3401-75-レイジョ" = "……。"
"3401-76-レイジョ" = "いいでしょう。武術研究部の皆さんには、昔からずっとお世話になっていますからね。"
"3401-77-レイジョ" = "むしろ、私の方から助力を申し出たいくらいです。"
"3401-78-レイジョ" = "修行と鍛錬のために、ご教示願えますか？"
"3401-79-武術研究部員" = "はい！もちろん喜んで！"
"3401-80-武術研究部員" = "それと……"
"3401-81-武術研究部員" = "よろしければ、これを機に……レイジョさんを武術研究部の部員とし[ruby=しょうへい]て招聘し[/ruby]たいのですが……！"
"3401-82-レイジョ" = "……ごめんなさい。#n今は商会の仕事で忙しくて……。"
"3401-83-武術研究部員" = "やっぱり、そうですよね……。"
"3401-84-カグヤ" = "全員、集まりましたね？"
"3401-85-京劇部員" = "はい、部長！"
"3401-86-カグヤ" = "ここが――門主様が早朝から京劇舞踊に励んでいた白虎公園……。"
"3401-87-カグヤ" = "京劇披露の場として――我々にとっては縁のある地。"
"3401-88-カグヤ" = "しかし――其処に立つ者が誰なのか、また、どのような目的で使用していたかによって、此処が持つ意味は大きく異なります！"
"3401-89-カグヤ" = "高きに登るにはまず低きより――門主様は自ら、お手本となって下さりました。"
"3401-90-カグヤ" = "私たちは今ここで……その崇高な志に、最大の敬意を示すのです。"
"3401-91-カグヤ" = "さあ！我々京劇部が誇る[ruby=みやび]、雅や[/ruby]かな京劇舞踊をお見せすると致しましょう！"
"3401-92-京劇部員" = "はいっ！部長！"
