[translation]
"2902-1" = "そうして一堂に会して（２）"
"2902-2-イズナ" = "わぁ、すごいですっ！"
"2902-3-イズナ" = "ここが噂の、忍術研究部……！"
"2902-4-ミチル" = "……ツクヨ、ちょっと来て。"
"2902-5-ツクヨ" = "えっと……？"
"2902-6-ミチル" = "どうしようツクヨ！怪しい子来ちゃった！いや見た目は可愛いけど！"
"2902-7-ツクヨ" = "えっと、怪しい、でしょうか……？"
"2902-8-ミチル" = "いや自分で言うのもなんだけど、「忍術研究部」だよ？"
"2902-9-ミチル" = "こんな正体不明の部活に「入部希望」なんて、普通いる？"
"2902-10-ツクヨ" = "怪しいよ、怪しさが服を着て歩いてると言っても過言じゃないよ！"
"2902-11-ツクヨ" = "でも、私も入部、しましたよ……？"
"2902-12-ミチル" = "ツクヨはノーカン！私が直接スカウトしたんだし！"
"2902-13-ツクヨ" = "そう、でした。"
"2902-14-ミチル" = "もしかして……陰陽部、あるいは百花繚乱からの刺客とか！？"
"2902-15-ミチル" = "いや、でもそんな悪い子には見えない……！"
"2902-16-ツクヨ" = "初対面で、怖くはありますが、せっかくいらっしゃってくれましたし……。"
"2902-17-ツクヨ" = "正式な部活への、"
"2902-18-ツクヨ" = "第一歩かも、しれません……！"
"2902-19-ミチル" = "んー……部員は欲しいけど、どんな子か分からないまま入部してもらうのはちょっと……。"
"2902-20-ミチル" = "……よし、決めた。"
"2902-21-ミチル" = "面接をしよう！"
"2902-22-ツクヨ" = "面接……？"
"2902-23-ミチル" = "そう、あの子が忍術研究部の部員としてふさわしいか！それを確認させてもらおう！"
"2902-24-ミチル" = "というわけで、面接をさせてもらおうと思ってるんだけど……えっと、イズナさん？どう、かな？"
"2902-25-イズナ" = "なるほど、中途半端では忍者としての任務に支障をきたす……そういうことですね！"
"2902-26-イズナ" = "イズナは全く問題ありません！"
"2902-27-ミチル" = "えっと……？ま、まあ、良いか。"
"2902-28-ツクヨ" = "あ、そうだツクヨ。せっかくのお客様だし、飲み物を出してくれる？"
"2902-29-ミチル" = "はいっ……！"
"2902-30-ツクヨ" = "あの、えっと……。"
"2902-31-ツクヨ" = "お飲み物を、お持ち、しました……！"
"2902-32-イズナ" = "はい、ありがとうございます！"
"2902-33-ツクヨ" = "つまらないものですが、その、どうぞ……！"
"2902-34-イズナ" = "感謝します！ニンニン！"
"2902-35-ツクヨ" = "わぁっ……私それ、実際に聞いたのは初めてかもしれません……！"
"2902-36-ツクヨ" = "あ、すみませんえっと……こちら、お茶とかが無くて、申し訳ないのですが……。"
"2902-37-ツクヨ" = "ただの水道水で、その、ごめんなさい……。"
"2902-38-イズナ" = "なるほど、これがおもてなしの水……。"
"2902-39-ツクヨ" = "あ、ごめんなさい……！せっかくのお客様、なのに、お水だなんて……！？"
"2902-40-ツクヨ" = "嫌がらせのつもりでは、なかったの、ですが……！えっと、茶葉とかも、無くて、その……！"
"2902-41-ツクヨ" = "部費が、無いので……。"
"2902-42-ツクヨ" = "だ、大丈夫！"
"2902-43-ミチル" = "水道水も、水道ってシステムを整備してくれてる人たちのおかげで成り立ってる、立派な飲み物！だから大丈夫！多分！"
"2902-44-ツクヨ" = "ごめんなさい、よく、分かりません……！"
"2902-45-イズナ" = "……なるほど！"
"2902-46-ツクヨ" = "えっ？"
"2902-47-ツクヨ" = "……？"
"2902-48-ミチル" = "イズナ、忍者の時代劇で似たようなものを見たことがあります！"
"2902-49-イズナ" = "真の忍者であれば、水さえあれば十分……！それ以上の贅沢を求むべからず、と！"
"2902-50-イズナ" = "それを日常から実践しているとは、噂で聞いた以上です……これが忍術研究部！イズナ、感激しました！"
"2902-51-ミチル" = "……そ、そうかな？"
"2902-52-ミチル" = "えっと、とにかく本題に入ろうか……"
"2902-53-ミチル" = "イズナさんは、どうやって私たちのことを知ったの？"
"2902-54-ミチル" = "自分で言うのもなんだけど、この部室ってその……百鬼夜行でも、結構辺鄙なところにあるでしょ？"
"2902-55-ミチル" = "交通も不便だし、近くに施設とかもあんまり無いし……。"
"2902-56-ミチル" = "（まあ百花繚乱とか陰陽部に見つからないようにするためだから、仕方ないんだけど……）"
"2902-57-ミチル" = "そうですね、不便ですし、行き来も大変ですし……バスを一本逃したら、学校に行くのも一苦労で……。"
"2902-58-ツクヨ" = "時々電気とか、水も切れますし……コンビニも、かなり遠いですし……。"
"2902-59-ミチル" = "ツクヨ、もしかして今までずっと辛かった！？"
"2902-60-ツクヨ" = "でも、良いところ、なので……！"
"2902-61-ツクヨ" = "夜になると、星もよく見えますし……静かなので、忍術の撮影とかも、やりやすくて……。"
"2902-62-ミチル" = "だね、確かにクレームとかが入らないのは利点かも。"
"2902-63-ミチル" = "私の作った「忍法・キラキラファイアーの術」とかも、近くに人がいたらクレームものだし……"
"2902-64-イズナ" = "じ、自作の忍術……！！"
"2902-65-ミチル" = "？"
"2902-66-イズナ" = "あ、えっと、ここに来られた理由でしたね！イズナ、これを見つけたんです！"
"2902-67-ツクヨ" = "それって……。"
"2902-68-ミチル" = "あっ、思い出した！私が半年くらい前に作った、広報用のチラシ！"
"2902-69-イズナ" = "このチラシに書かれている暗号、柴犬ワン蔵監督の代表作『犬連れ忍者』に出てきたものと同じですよね？"
"2902-70-ミチル" = "えっ、それに気づいたの！？"
"2902-71-ツクヨ" = "すごい、ですね……！"
"2902-72-ミチル" = "（確かに、この仕組みが分かるってことは同じような映画が好きってこと……それを狙って作ったところはあるけど……）"
"2902-73-ミチル" = "（そのチラシを見て来たのは、今まで「こういうのを勝手に貼らないで」って言いに来た百花繚乱だけだったし、失敗したと思ってたら……）"
"2902-74-ミチル" = "（まさか、この子……！？）"
"2902-75-ミチル" = "……ふふっ、中々やるねぇ！じゃあ、二つ目の質問良いかな。"
"2902-76-ミチル" = "これがもしかしたら、一番大事な質問かもしれないけど……。"
"2902-77-イズナ" = "あ、はいっ！"
"2902-78-ミチル" = "イズナさんが「忍術研究部」に入りたい理由を、教えてほしいな。"
"2902-79-イズナ" = "あっ……"
"2902-80-イズナ" = "イズナは……忍術研究部のみなさんのように、立派な忍者になりたいと思ったからです！"
"2902-81-ミチル" = "私たち、みたいに……？"
"2902-82-ツクヨ" = "え……？"
"2902-83-イズナ" = "「少女忍法帖ミチルっち」チャンネル！"
"2902-84-イズナ" = "あの「見よ、岩をも砕く超絶忍術！」の回を見て、イズナはとても感動しました！"
"2902-85-ミチル" = "それって……。"
"2902-86-ツクヨ" = "私たちのチャンネルで、一番伸びてる、あの動画……！"
"2902-87-ミチル" = "なるほど、確かにあれは上手く撮れたやつだったね。"
"2902-88-ミチル" = "（事前に岩を薄くしておいて、タイミング良く爆薬の演出を重ねただけだけど……ビジュアルが派手だったせいで、そういえば割と伸びたんだった）"
"2902-89-ミチル" = "（そっか……私たちのチャンネル、見てくれたんだ）"
"2902-90-ミチル" = "（それでファンになってくれて、私たちみたいになりたくて忍術研究部に入ろうと……？）"
"2902-91-ツクヨ" = "……え、待った。っていうことはイズナさん……チャンネル登録してくれてるの！？"
"2902-92-イズナ" = "はい！"
"2902-93-ツクヨ" = "部長……！実際に登録してくれる方、私、初めて会いました……！"
"2902-94-ツクヨ" = "どうしましょう、写真とか、撮りますか……！？天然記念物みたいな方なのでは……！？"
"2902-95-ミチル" = "いやいや、ツチノコみたいな言い方しないの！それなりに登録してくれる人もいるんだから、あり得ない事態ってほどじゃないでしょ！嬉しいけど！"
"2902-96-イズナ" = "その映像を見てイズナはみなさんと一緒なら、キヴォトス最高の忍者になれるのではと思いました！"
"2902-97-ミチル" = "……ん？"
"2902-98-ツクヨ" = "キヴォトス最高の、忍者……。"
"2902-99-ツクヨ" = "えっと、よく分かりませんが、凄いですね……！"
"2902-100-イズナ" = "キヴォトス最高の忍者ねぇ……。"
"2902-101-イズナ" = "うん、良いね！せっかくの忍者なんだし、それくらいでっかい目標の方が良いと思う！"
"2902-102-ミチル" = "柴犬ワン蔵監督の暗号を見抜き、私たちと同じものに喜んでくれるその感性、"
"2902-103-ミチル" = "そして強い決意……！"
"2902-104-ミチル" = "イズナさん、あなたは確かに私たちの同志かも！"
"2902-105-イズナ" = "はい、お会いできて嬉しいです！"
"2902-106-ツクヨ" = "まさに、部長が探していた、人材……！"
"2902-107-ミチル" = "もちろんイズナは、まだ忍術研究部のみなさんに及ぶような中忍ではありませんが！"
"2902-108-ミチル" = "ま、まあ私たちも、それほどじゃないと思うけどね！"
"2902-109-ミチル" = "イズナさんも私たちも、一緒だよ。"
"2902-110-イズナ" = "ですが、イズナはまだ修行が足りない身で……"
"2902-111-ミチル" = "私たちのチラシを見て、ここまで来てくれたんでしょ？イズナさんも私たちと同じで、忍者のことがすっごく好きだってことは分かる。それなら十分、同じ立場の仲間だよ。"
"2902-112-イズナ" = "……！！"
"2902-113-イズナ" = "……はい！イズナは、忍者が大好きです！"
"2902-114-イズナ" = "以前は誰にも理解していただけず、ずっとひとりでしたが……"
"2902-115-イズナ" = "祭りを台無しにしようとする方々に、利用されてしまったこともありましたが……。"
"2902-116-ミチル" = "（祭りを台無しに……？利用……？）"
"2902-117-ミチル" = "（……コミセンの話？）"
"2902-118-ミチル" = "（コミセンを台無しにってことは……）"
"2902-119-ミチル" = "イズナさん、それって……"
"2902-120-ミチル" = "自分たちの利益のために、お祭りの場で好き勝手暴れるようなやつらのこと？"
"2902-121-イズナ" = "はい、そうです！もしかして、ご存知でしたか？"
"2902-122-ミチル" = "まあ、どこの会場にでもいるもんだよね。"
"2902-123-ミチル" = "自分たちがメインストリームだからって、あるいはハイカルチャーだからって、相手をバカにするような輩が！"
"2902-124-ミチル" = "全く、趣味を楽しむなら他ジャンルにもリスペクトを持ってほしいもんだよ。それによって苦労するのは自分たちか、自分の仲間たちだってのに。"
"2902-125-ミチル" = "な、なるほど……！世の中には、ニャン天丸のような存在がたくさんいるのですね……！"
"2902-126-イズナ" = "忍者の世界がそこまでのものだったとは……イズナ、また一つ賢くなりました！"
"2902-127-ミチル" = "そんな目に遭っても、今でも忍者が好きなんだよね？それはすごいことだし、良いことだと思う。"
"2902-128-ツクヨ" = "そんなことが起きたら、私、逃げてしまうと思います……"
"2902-129-ツクヨ" = "イズナさんは、その、すごいです。"
"2902-130-イズナ" = "イズナは、"
"2902-131-イズナ" = "主殿と出会うことができましたので！"
"2902-132-ミチル" = "……主殿？"
"2902-133" = "（説明中）"
"2902-134-イズナ" = "……というわけでイズナは、主殿の忍者になったのでした！"
"2902-135-ミチル" = "な、なるほど……？"
"2902-136-ミチル" = "（……え、何その忍者もビックリな冒険活劇。）"
"2902-137-ミチル" = "（っていうか主殿？何そのプレ……関係？）"
"2902-138-ミチル" = "っていうか「シャーレの先生」って、どこかで聞いたような……"
"2902-139-ツクヨ" = "うっ、うぅっ……。"
"2902-140-ミチル" = "え、ツクヨ？どうして泣いて……？"
"2902-141-ツクヨ" = "イズナさん、大変、だったのですね……そんな逆境を、乗り越えて、きただなんて……。"
"2902-142-ツクヨ" = "感動、してしまいました……！"
"2902-143-ミチル" = "少し辛かったですが、イズナは大丈夫です！"
"2902-144-イズナ" = "そのおかげで主殿にも出会い、夢を追い続けられるようになりましたので！"
"2902-145-ツクヨ" = "良いお話、ですね……！部長も、そう思いませんか……？"
"2902-146-ミチル" = "あ、うん、えっと……全部は理解できなかったかもだけど……。"
"2902-147-ミチル" = "でも、イズナさんの気持ちは伝わってきた。大変だったね。"
"2902-148-ミチル" = "イズナさんの主殿って人にも、いつか会ってみたいな！"
"2902-149-イズナ" = "そうですね、機会があればぜひ！"
"2902-150-イズナ" = "そんなこんなでイズナは、この忍術研究部にやってきたのです！"
"2902-151-イズナ" = "これで、答えになってますでしょうか？"
"2902-152-ツクヨ" = "部長……？"
"2902-153-ミチル" = "イズナさん……ううん、イズナ！"
"2902-154-ミチル" = "君が経験してきたこと、これまでの軌跡のその全てと、君の掲げる夢！"
"2902-155-ミチル" = "それらに我々忍術研究部は大いに同意し、歓迎しよう！"
"2902-156-ツクヨ" = "忍術研究部にようこそ、イズナ！ってことで良いよね、ツクヨ？"
"2902-157-ツクヨ" = "はい、もちろん、です……！イズナさん、いえ、イズナちゃん！忍術研究部へ、ようこそ……！"
"2902-158-イズナ" = "あっ……。"
"2902-159-イズナ" = "はい！忍術研究部の部員として、これからどうぞよろしくお願いします！"
"2902-160-イズナ" = "部長！そしてツクヨ殿！"
"2902-161-ミチル" = "ぶ、部長？何だかツクヨ以外に言われるのは慣れないけど……"
"2902-162-ミチル" = "うん、良いね！"
"2902-163-ツクヨ" = "つ、ツクヨ殿、だなんて……えへ、えへへっ……。"
"2902-164-ツクヨ" = "こちらこそ、よろしくね、イズナちゃん。"
"2902-165-イズナ" = "はい！イズナはここでみなさんと一緒に、"
"2902-166-イズナ" = "引き続きキヴォトス最高の忍者を目指して邁進していきます！"
"2902-167-ミチル" = "よーし、このまま目指せ「部活の正式な認可」！あと「少女忍法帖ミチルっち」のチャンネル登録者数100人突破！"
"2902-168-ツクヨ" = "はい、頑張りましょう……！"
"2902-169-イズナ" = "ニンニン！"
"2902-170" = "（こうして、それぞれに夢を抱いた少女たちが集まった。イズナが「主殿」と呼ぶ存在に彼女たちが出会うのは、もう少し後のお話……）"
"2902-171" = "そうして一堂に会して"
