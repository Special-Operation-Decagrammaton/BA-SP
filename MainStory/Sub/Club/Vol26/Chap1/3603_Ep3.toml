[translation]
"3603-1" = "おかしなノスタルジー（３）"
"3603-2" = "（ブウウーーン）"
"3603-3-セイア" = "……。"
"3603-4-ミカ" = "……。"
"3603-5-ナギサ" = "……。"
"3603-6-ミカ" = "ナギちゃん、大丈夫？"
"3603-7-ナギサ" = "私は……大丈夫です……。"
"3603-8-ナギサ" = "おかげさまで、楽しかったです……とても……。"
"3603-9-ミカ" = "そんな顔で言われても説得力ないんだけど！？"
"3603-10-ミカ" = "う～ん……。"
"3603-11-ミカ" = "遊園地とかの方が良かったのかなぁ……。"
"3603-12-ミカ" = "……あれ？"
"3603-13-ミカ" = "公園だ。"
"3603-14-ミカ" = "ねえねえナギちゃん、ほら見て。懐かしくない？"
"3603-15-ミカ" = "小さい頃、何かあった時はよく公園に行ったよね。"
"3603-16-セイア" = "公園……。"
"3603-17-セイア" = "それだ。"
"3603-18" = "（キキーーッ！）"
"3603-19-ナギサ" = "！？"
"3603-20-ミカ" = "急ブレーキなんてどうしたの！？"
"3603-21-セイア" = "済まない。急に眠気を催してしまった。"
"3603-22-セイア" = "居眠り運転をするわけにもいくまい。少し公園で休ませてくれ。"
"3603-23-ミカ" = "……。"
"3603-24-ミカ" = "ふぅ～ん……？"
"3603-25-ミカ" = "りょーかいっ☆"
"3603-26-ナギサ" = "……？"
"3603-27-ミカ" = "ここ、昔の公園にそっくりじゃない？"
"3603-28-ミカ" = "人気がなくて、雑草だらけってところを除けば……だけど。"
"3603-29-ナギサ" = "ほらナギちゃんも！こっち！"
"3603-30-ナギサ" = "私は……このままで……。"
"3603-31-ミカ" = "だーめっ☆"
"3603-32-ナギサ" = "えっ……。"
"3603-33" = "（ナギサはミカに手を引かれるまま公園へと向かった）"
"3603-34-ナギサ" = "……。"
"3603-35-ナギサ" = "（どこか、座れる場所は……）"
"3603-36-ナギサ" = "（あ、すべり台……）"
"3603-37" = "ジュッ……！"
"3603-38-ナギサ" = "きゃっ！？"
"3603-39-ナギサ" = "熱っ……！"
"3603-40-ナギサ" = "あははっ！ナギちゃん、思った通り！"
"3603-41-ナギサ" = "笑い事ではありません！滑り台が熱せられていて――"
"3603-42-ナギサ" = "火傷するところだったんですよ！"
"3603-43-ミカ" = "でも、ちょっと元気出たみたいだね？"
"3603-44-ナギサ" = "えっ……？ああ……。"
"3603-45-ナギサ" = "そう……ですね。"
"3603-46-ナギサ" = "よかったぁ～"
"3603-47-ナギサ" = "本当に心配したんだよ？#nさっきなんてお茶になろうとしてたし……。"
"3603-48-ナギサ" = "何の話ですか……？"
"3603-49-ナギサ" = "ですが……たしかに。#nいつも元気をもらう場所でしたね、公園は。"
"3603-50-ナギサ" = "消費過多になれば、元気は容易に枯渇するものだ。"
"3603-51-ナギサ" = "だから……これを。"
"3603-52-ナギサ" = "……？"
"3603-53-ナギサ" = "これは……駄菓子？"
"3603-54-ナギサ" = "二人がじゃれ合っている間に、近くで買ってきたんだ。"
"3603-55-ナギサ" = "今日はせいぜい紅茶くらいしか、胃にものを入れていないだろう？"
"3603-56-ナギサ" = "あ……で、では……。"
"3603-57-ナギサ" = "……甘すぎます。"
"3603-58-ナギサ" = "中も、外も。全部甘いです。"
"3603-59-ナギサ" = "こっちは……塩っ辛いです。"
"3603-60-ナギサ" = "こちらは苦みが強すぎる印象が。"
"3603-61-ナギサ" = "どれも単純で、粗末な味です。"
"3603-62-セイア" = "だが……幼き時分には美味しく感じていたはず。"
"3603-63-セイア" = "違うかい？"
"3603-64-ナギサ" = "……そうですね。あの頃は最高のお菓子だと思っていました。  "
"3603-65-ミカ" = "昔のこと、思い出すなぁ。"
"3603-66-ミカ" = "あーあ、あの頃のナギちゃんは可愛かったのに～"
"3603-67-ナギサ" = "なっ、何の話ですか！？"
"3603-68-セイア" = "駄菓子の味は変わっていない。"
"3603-69-セイア" = "変わったのは、ナギサだ。"
"3603-70-セイア" = "優雅で、繊細で、味の機微が分かるようになった。"
"3603-71-ナギサ" = "……？"
"3603-72-ミカ" = "つまり、昔は良かったことも、#n後で振り返ったら普通に思えたりするよね、ってこと。"
"3603-73-ミカ" = "この駄菓子みたいにね。"
"3603-74-ミカ" = "……。"
"3603-75-ミカ" = "逆に、今の辛い記憶が、未来には良い思い出になるかもしれない。"
"3603-76-ミカ" = "ナギちゃんも、私たちも。#nずっと成長し続けるし、変わっていくから。"
"3603-77-ナギサ" = "それはつまり……。"
"3603-78-ナギサ" = "「いつかは良い思い出になるから頑張れ」というアドバイスでしょうか？"
"3603-79-ナギサ" = "……ありきたりな言葉ですね。"
"3603-80-ミカ" = "えー、きびしーなぁ。"
"3603-81-ナギサ" = "ふふっ……。#nとはいえ、真実は往々にしてありきたりなものです。"
"3603-82-ナギサ" = "だからついつい、忘れてしまうのですが……。"
"3603-83-ナギサ" = "ですから、これも。#nその……忘れてしまう前に。"
"3603-84-ナギサ" = "ミカさん、セイアさん……ありがとうございます。"
"3603-85-セイア" = "……。"
"3603-86-ミカ" = "じゃあさ！忘れられないようにしたらいいんじゃない？#nこれからもたまに、こうやって遊びに行けば思い出せるよ！"
"3603-87-ミカ" = "たしか、ティーパーティーのプライベートビーチとかもあったよね？#n次はそこ行こっ！"
"3603-88-ナギサ" = "……ふふっ、いいですね。"
"3603-89-ミカ" = "じゃっ、約束！#n……忘れないでよ？"
"3603-90-ナギサ" = "ええ、もちろん。#nではそろそろ、帰りましょうか。"
"3603-91-ナギサ" = "私たちの[ruby=家]トリニティ[/ruby]に。"
"3603-92-ナギサ" = "最高級の茶葉に、やたらと甘いお菓子がありますから。#n戻ったら、お茶会にいたしましょう。"
"3603-93-ミカ" = "うまくいったみたいだね？"
"3603-94-セイア" = "ああ。"
"3603-95-セイア" = "ただ――"
"3603-96-ミカ" = "あくまで一時しのぎだ、って言いたいんでしょ？"
"3603-97-セイア" = "……すこし、周りが見えるようになったじゃないか。"
"3603-98-ミカ" = "これだけで、きれいさっぱりストレスが無くなるわけないし。"
"3603-99-ミカ" = "それに、帰ったらまた仕事が山積みだもんね。"
"3603-100-ミカ" = "……でも、いいんじゃない？一時しのぎでも。"
"3603-101-ミカ" = "ナギちゃんが大変な時は、私たちが助けてあげればいいんだし。"
"3603-102-ミカ" = "今度は……思い切って長いお休みを取ってみたり？#nさっき言った、プライベートビーチとか！"
"3603-103-セイア" = "……。"
"3603-104-ミカ" = "だから毎日を頑張るの。"
"3603-105-ミカ" = "今日みたいな日のために。"
"3603-106-セイア" = "……。"
"3603-107-ミカ" = "なに？私の顔になにか付いてる？"
"3603-108-セイア" = "いいや、今日は驚かされてばかりだな。#n君の言葉に、完全に同意できる日がくるとはね。"
"3603-109-ミカ" = "それ、褒めてるってことでいいんだよね……！？"
"3603-110-セイア" = "……先にエンジンを温めておく。#n好きに戻ってきてくれ。"
"3603-111" = "おかしなノスタルジー"
