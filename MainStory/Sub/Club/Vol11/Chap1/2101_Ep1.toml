[translation]
"2101-1" = "呼ばれた人は残ってください（１）"
"2101-2" = "アビドス・外郭"
"2101-3-セリカ" = "はあ、はあ……。"
"2101-4-セリカ" = "あっつい……！もう結構歩いてない？この道で合ってるの？"
"2101-5-セリカ" = "そんな大した距離じゃなかったはずなんだけど……。"
"2101-6-ノノミ" = "地図ですとこの方向で合っているようなのですが……30kmぐらい歩いたはずなのに、まだ見えてきませんね。"
"2101-7-セリカ" = "30km！？もうマラソンの距離じゃん！？"
"2101-8-シロコ" = "……でも、30kmぐらいだったら、"
"2101-9-セリカ" = "シロコ先輩の基準は参考にならないから黙ってて。"
"2101-10-シロコ" = "……うーん。"
"2101-11-ホシノ" = "おじさん腰が悪いし、もうこんな元気に強行軍できる歳じゃないんだけどな～。"
"2101-12-セリカ" = "だから、ほとんど歳変わらないでしょ！！"
"2101-13-セリカ" = "っていうか、こんなことになった原因分かってる！？"
"2101-14-セリカ" = "自分たちのせいでしょ！？"
"2101-15" = "ん……。"
"2101-16-ホシノ" = "うへ～。"
"2101-17-ノノミ" = "あは～☆"
"2101-18" = "ちょっとは申し訳なさそうな顔をして！！"
"2101-19-セリカ" = "まあ、その「自分たち」の中には私も、多少入ってるかもしれないけど……。"
"2101-20-セリカ" = "全く、あんなに怒ってるアヤネちゃん久しぶりに見たわよ……！"
"2101-21" = "（一日遡って、対策委員会の教室）"
"2101-22-アヤネ" = "……。"
"2101-23-ノノミ" = "……。"
"2101-24-シロコ" = "……。"
"2101-25-アヤネ" = "……。"
"2101-26-アヤネ" = "……。"
"2101-27-ノノミ" = "……えっと。"
"2101-28" = "「残ってる資金を宝くじに全投入、人生は一発勝負だよね～作戦」を提出された方？"
"2101-29-ホシノ" = "おじさんの出したやつだ！"
"2101-30-アヤネ" = "……。"
"2101-31-アヤネ" = "「作戦：生徒を人質として大量に捕獲して、強制的に転校させる15の方法」を提出された方？"
"2101-32" = "私。"
"2101-33-アヤネ" = "…………。"
"2101-34-シロコ" = "実現性は検討済み。隣の学校の朝礼の時間を狙って、講堂を襲撃して……"
"2101-35-シロコ" = "えっと、アヤネ……？"
"2101-36-アヤネ" = "「旅行計画表：今週末みんなでピクニックに行きましょう☆」を提出された方？"
"2101-37" = "は～い、私です！"
"2101-38-アヤネ" = "………………。"
"2101-39-ノノミ" = "あれ、何か違いましたか？"
"2101-40-ホシノ" = "おじさんが見るにこれ、ちょ～っと危ない雰囲気かもね～。"
"2101-41-セリカ" = "先輩たち、ふざけてるの！？"
"2101-42" = "これからの委員会の活動方針を持ってきてって言われたのに、何で宝くじとか犯罪計画とか旅行の話なわけ！？"
"2101-43" = "もっと真面目に考えて！アヤネちゃんの眉間が大変なことになってるでしょ！"
"2101-44" = "……黒見セリカさん、まだもう一つありますから。"
"2101-45-セリカ" = "あ、アヤネちゃん……？何で急に敬語……？"
"2101-46-アヤネ" = "最後に、「再生可能石油農場への事業投資説明書」を持ってきた方？"
"2101-47-セリカ" = "わ、私だけど……。"
"2101-48-アヤネ" = "……。"
"2101-49-セリカ" = "で、でもアヤネちゃん！これちゃんとした事業だし、説明会でもらったパンフレットでも確実な利益がって……。"
"2101-50-アヤネ" = "セリカちゃん、石油は農場で育てるものじゃなくて、地面を掘って出てくるもので……。"
"2101-51-セリカ" = "そ、それは私も知ってる！でも最近見つかったポンジー石油っていう――"
"2101-52-アヤネ" = "……。"
"2101-53" = "いい加減にしてくださいっ！！！！！"
"2101-54" = "……"
"2101-55-ホシノ" = "……まあ、"
"2101-56-ホシノ" = "こうなるよね～。"
"2101-57-ホシノ" = "いやぁ～久々に怖かったねえ、あのアヤネちゃん。"
"2101-58-シロコ" = "うーん……ちゃんとシミュレーションまでしてあったのに……。"
"2101-59-ノノミ" = "私は、みんなに心の余裕を持ってもらおうと……。"
"2101-60" = "真面目な話をする場でそうやってふざけてるからこうなったんでしょ！"
"2101-61-ホシノ" = "うへ～、でもトリガーになったのはセリカちゃんっぽくない？アヤネちゃんに最後の引き金を引かせた感じだったし？"
"2101-62-セリカ" = "わ、私！？"
"2101-63-ホシノ" = "「信じてたのに、セリカちゃんまで……」みたいな顔してたよ？"
"2101-64-セリカ" = "そ、それは……っ！"
"2101-65-ホシノ" = "アヤネちゃんはセリカちゃんにベタベタだからな～、ショックが大きかったかもね～。"
"2101-66-セリカ" = "……っ！！"
"2101-67-アヤネ" = "はぁ……はぁ……。"
"2101-68-アヤネ" = "皆さん……。"
"2101-69-アヤネ" = "もう少し、ちゃんとしてください……。"
"2101-70-ホシノ" = "って、まるで仕事もしないで家でダラダラしてる子どもに対する親、みたいな雰囲気だったね～。"
"2101-71-シロコ" = "それでその「ちゃんと」の具体例が、この掃除のアルバイト、と。"
"2101-72-ノノミ" = "明日の学芸祭のために、体育館に溜まってるゴミを掃除……というお話でしたよね？"
"2101-73-ホシノ" = "こんなアルバイト、いつの間に探してたんだろうね～？いやあ、アヤネちゃんは計画的で良い子だー。"
"2101-74-ノノミ" = "アヤネちゃん、いつも一人で頑張ってくれてますが、時々無理してそうで心配ですね……。"
"2101-75" = "だからその結果今日みたいに、アヤネちゃんがストレスで寝込んじゃったんでしょ！"
"2101-76-セリカ" = "予定通りアヤネちゃんも一緒に来てたら、こうして迷うことも無かったのに！"
"2101-77-ホシノ" = "大丈夫大丈夫～、せっかくだしアヤネちゃんには家でゆっくり休んでもらって～。"
"2101-78-ホシノ" = "逆に考えると、アヤネちゃんに「やればできるじゃないですか！」って言ってもらえるチャンスかもよ？"
"2101-79-ホシノ" = "せっかくなんだしたまには、私たちだけでもちゃんとできるってところを見せてあげなきゃ。"
"2101-80-ホシノ" = "……とは本当に思ってるんだけど、遠すぎる～。誰でもいいからおんぶして～。"
"2101-81-セリカ" = "みんな同じくらい疲れてるの！もう、何時間歩いてることやら……。"
"2101-82" = "あっ！あれ見てください！"
"2101-83-シロコ" = "……！"
"2101-84" = "違法改築された体育館"
"2101-85" = "……"
"2101-86" = "？"
"2101-87-セリカ" = "……？"
"2101-88-セリカ" = "（な、なにこれ？これが体育館？）"
"2101-89-ホシノ" = "うへー、これが目的地の体育館……で合ってる？体育館っていうか……。"
"2101-90" = "なんだお前ら！どこから来たんだ！！"
"2101-91-セリカ" = "……！！"
"2101-92-チンピラA" = "何の用だ！もしかしてお前ら、この体育館の持ち主か！？"
"2101-93-チンピラB" = "残念だったな、ここは俺たちが占領済みだ！ひどい目に遭いたくなければこの体育館のことは諦めるんだな！"
"2101-94-チンピラA" = "相手が誰であれ、こちとら容赦しないぜ！？げへへへへっ！"
"2101-95-セリカ" = "……な、何よあいつら？急に喧嘩腰で……。"
"2101-96-ホシノ" = "ああ～……。"
"2101-97-ホシノ" = "そっかあ、そういうことか～。"
"2101-98-シロコ" = "……なるほど、私も理解した。"
"2101-99-セリカ" = "し、シロコ先輩？何で爆弾取り出したの！？"
"2101-100-ノノミ" = "……あは☆私も分かりました～。"
"2101-101-セリカ" = "えっ……？"
"2101-102-アヤネ" = "皆さんにちゃんとしたお仕事をしてもらいます。"
"2101-103-アヤネ" = "体育館のゴミ掃除のアルバイトです。簡単なお仕事ですので。"
"2101-104-シロコ" = "「体育館のゴミ掃除」、アヤネはそう言ってた。"
"2101-105-セリカ" = "……ゴミ？"
"2101-106-ホシノ" = "いや～、アヤネちゃんも言うねえ。これは確かに私たちにとっては、簡単なお仕事かも？"
"2101-107-セリカ" = "……ま、待って！？も、もしかして……？"
"2101-108-セリカ" = "先輩たち！？"
"2101-109-シロコ" = "時間がもったいないから、始めよっか。"
"2101-110-シロコ" = "[ruby=悪党退治]ゴミ掃除[/ruby]。"
"2101-111-ノノミ" = "お仕置きの時間ですよ～☆"
"2101-112" = "ヒューン……！"
"2101-113" = "ドカァァァアン☆"
