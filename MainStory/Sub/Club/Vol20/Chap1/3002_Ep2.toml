[translation]
"3002-1" = "缶詰の残影（２）"
"3002-2-モエ" = "今の音なに！？"
"3002-3-モエ" = "間違いありません、ミユの声です。"
"3002-4-モエ" = "もしかして、襲撃されたんじゃ……？"
"3002-5-サキ" = "ミユ、大丈夫か！何があった！"
"3002-6-サキ" = "あ、あそこ…… 食糧倉庫に……"
"3002-7-サキ" = "食糧倉庫？襲撃されたのか？"
"3002-8-ミユ" = "そ、そうじゃなくて…… あの缶詰……"
"3002-9-サキ" = "……缶詰？あの海鮮混ぜソースがどうかしたのか？"
"3002-10-サキ" = "あの缶詰が……自分で動いたの……"
"3002-11-サキ" = "……寝ぼけてるのか？"
"3002-12-モエ" = "事件かと思ったら、缶詰が自分で動いた、ねぇ……"
"3002-13-ミヤコ" = "最近、疲れているのではありませんか？"
"3002-14-ミユ" = "ほ、本当なの……！"
"3002-15-ミユ" = "あの缶詰が自分でガタンガタンって動いたの……本当に……"
"3002-16-サキ" = "どれ……"
"3002-17-サキ" = "……動かないぞ？"
"3002-18-ミヤコ" = "……やはり、疲れが溜まっているのですね。"
"3002-19-ミユ" = "あれ……？さっきまであんなに激しく動いていたのに……。"
"3002-20-ミユ" = "幻覚でも見たのか？よっぽど疲れてるんだな……。"
"3002-21-サキ" = "残りの警戒勤務は私に任せて、ミユはもう休め。"
"3002-22-ミユ" = "でも……"
"3002-23-モエ" = "気にしない、気にしない。"
"3002-24-モエ" = "サキは毎日早朝に目が覚めるみたいだし、大丈夫だよ。"
"3002-25-サキ" = "うるさい。"
"3002-26-サキ" = "……それでは、残りの警戒勤務をお願いしますね、サキ。"
"3002-27-ミヤコ" = "他の隊員はテントに戻って身体を休めましょう。"
"3002-28-ミユ" = "……ありがとう、サキちゃん。じゃあ、よろしくね。"
"3002-29" = "……ガタン。"
"3002-30" = "（……翌朝）"
"3002-31-サキ" = "ふふ、やはり[ruby=ふしんばん]不寝番[/ruby]の後の朝ごはんは格別だな。"
"3002-32-サキ" = "特に今朝は、昨日手に入れた戦闘食糧を選べる楽しみがあって良いな。"
"3002-33-ミヤコ" = "早朝の警戒勤務お疲れ様でした、サキ。"
"3002-34-ミヤコ" = "よろしければ、先にどうぞ。"
"3002-35-ミヤコ" = "それじゃあ私は…… このチキンヌードルスープ缶にしようかな。"
"3002-36-モエ" = "私は赤飯とサバの味噌漬け！"
"3002-37-ミヤコ" = "それでは私は、ヨークシャープディングと野菜オムレツにします。"
"3002-38-ミユ" = "わ、私はオートミールとチョコレートクッキー……"
"3002-39-サキ" = "みんな被らなかったな。これで残るメニューは……"
"3002-40-サキ" = "この海鮮混ぜソース缶、誰も食べないのか？"
"3002-41-ミユ" = "ひっ、ひいぃ……"
"3002-42-ミユ" = "ミユは、昨夜のことをまだ気にしているみたいだし……"
"3002-43-モエ" = "モエ、食べるか？臭いはするけど、白米と一緒に飲み込めば味はまぁ悪くない。"
"3002-44-サキ" = "んー、缶詰めの海鮮はちょっとなぁ……"
"3002-45-モエ" = "サバの味噌漬けだって海鮮じゃないか。"
"3002-46-ミヤコ" = "……ミヤコはどうだ？"
"3002-47-サキ" = "私も、今日は少し……"
"3002-48-サキ" = "そうか……まぁ、これはまた今度食べるとして。"
"3002-49-サキ" = "では、朝食にしよう。"
"3002-50-一同" = "いただきます！"
"3002-51" = "（その後、海鮮混ぜソースの缶詰は忘れられたまま放置され……）"
"3002-52" = "（……やがて、賞味期限が訪れてしまった）"
