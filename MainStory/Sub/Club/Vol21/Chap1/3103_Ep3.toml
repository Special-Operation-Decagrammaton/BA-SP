[translation]
"3103-1" = "価値の証明（３）"
"3103-2" = "ミレニアム・実習室"
"3103-3-ユウカ" = "や、やっと完成した……。"
"3103-4-ユウカ" = "これがヒマリ部長の設計した、未来観測機関「讖」！"
"3103-5-ユウカ" = "お疲れ様～。"
"3103-6-ノア" = "ふぅ、だいぶ時間がかかったわね……。"
"3103-7-ユウカ" = "やっぱり工学系の作業は大変だわ……。"
"3103-8-ユウカ" = "ノアが助けてくれなかったら、きっと完成する前に挫折してたわ。ありがとね。"
"3103-9-ノア" = "いえいえ、感謝されるようなことでは。"
"3103-10-ノア" = "こんな面白そ――"
"3103-11-ノア" = "おっといけない。"
"3103-12-ノア" = "セミナーの一員として、ミレニアムの技術と可能性のためですから。"
"3103-13-ユウカ" = "流石というか何と言うか、本当に真面目ね。"
"3103-14-ユウカ" = "とにかく、まずは動かしてみましょうか。"
"3103-15" = "＜大規模変数分析装置――a.k.a. 未来観測機関「[ruby=しん]讖[/ruby]」――が実行されました＞"
"3103-16-未来観測機関「讖」" = "＜この機関は収集したデータをもとに変化やそこから生まれる予測値を計算し、#n　実現の可能性が最も高い結果を出力します＞"
"3103-17-未来観測機関「讖」" = "＜どんな未来が知りたいか、何でもお聞きください＞"
"3103-18-ユウカ" = "本当に動いてる、流石はヒマリ部長……！"
"3103-19-ユウカ" = "とはいえ、「どんな未来が知りたい」って言われても……。"
"3103-20-ユウカ" = "量子力学的な観点からすると、観測すれば未来は変わってしまう……#nとなると、質問も慎重に選ばないといけないわね。"
"3103-21-ユウカ" = "ぱっと34個くらい思い浮かぶけど、えっと……。"
"3103-22-ユウカ" = "これから先、先生との関係がどうなるか――とか？"
"3103-23-ユウカ" = "そ、そんな個人的な質問を、こんな風に聞けるわけないでしょ！？"
"3103-24-ユウカ" = "せっかくお金をかけて作った貴重な装置なんだから、#nもっとこう、公的なことに……！"
"3103-25-ノア" = "気になること自体は否定しないんですね？"
"3103-26-ユウカ" = "ああもう……！"
"3103-27-ユウカ" = "と、とにかくまずは、制作費用を回収しないと……#n予測でお金を稼げるとしたら……。"
"3103-28-ユウカ" = "えっと、じゃあこれから1ヶ月間で希少金属の価格がどうやって変化するか……#nそれを教えてもらえる？"
"3103-29-未来観測機関「讖」" = "＜リクエストを受け取りました＞"
"3103-30-未来観測機関「讖」" = "＜まずはあなたの生年月日を入力してください＞"
"3103-31-ユウカ" = "……？市場価格変化の予測に、使用者の生年月日が必要なロジックが……？"
"3103-32-ユウカ" = "まあ良いけど……えっと、3月14日……"
"3103-33-未来観測機関「讖」" = "＜未来を演算しています、少々お待ちください……＞"
"3103-34-未来観測機関「讖」" = "＜演算が完了しました＞"
"3103-35-未来観測機関「讖」" = "＜おめでとうございます！うお座のあなた、今月の運勢は大吉です！＞"
"3103-36-未来観測機関「讖」" = "＜問題は解決し、たくさんの良いことが起こる一か月でしょう！＞"
"3103-37-未来観測機関「讖」" = "＜今月の幸運アイテムは丈夫なチタニウム！#n　持ち歩けば、良いことが起こるかも！？＞"
"3103-38-ユウカ" = "……？"
"3103-39-ノア" = "あら……。"
"3103-40-ユウカ" = "……え、終わり？"
"3103-41-ユウカ" = "嘘でしょ、終わりなの！？"
"3103-42-ヒマリ" = "チーちゃん。ここにあった本、知りません？"
"3103-43-チヒロ" = "モニターの横にあった、あの分厚い天文学の？"
"3103-44-チヒロ" = "見てみたら返却期限が近かったから、代わりに図書館に返しておいたけど。"
"3103-45-ヒマリ" = "……あら、そうでしたか。"
"3103-46-チヒロ" = "何かあったの？"
"3103-47-ヒマリ" = "それがですね……。"
"3103-48-ヒマリ" = "私が新しく設計した最先端の演算装置、未来観測機関「讖」の設計図をその本に挟んだままでして。"
"3103-49-ヒマリ" = "まあ無くなったところで、特にそれほど困るわけではないのですが……。"
"3103-50-ヒマリ" = "あれは未来を垣間見る事ができる、危険な能力を持った発明品……#nもしも悪い人の手に渡ってしまったら、と思うと……。"
"3103-51-チヒロ" = "未来観測機関「讖」って……。"
"3103-52-チヒロ" = "前に言ってた、あの「星座占い」のやつ？"
"3103-53-ヒマリ" = "科学的な統計解析とビッグデータに基づく最先端の演算装置ですよ？"
"3103-54-ヒマリ" = "なにせ、この私の偉大な発明品なのですから。#nただの「星座占い」と同じにしないでください。"
"3103-55-チヒロ" = "でも「空の星が同じ位置にいるときに生まれた」ってだけで、#nその人たちが同じ運命を共有する……。"
"3103-56-チヒロ" = "その考え方は、だいぶ非科学的じゃない？"
"3103-57-ヒマリ" = "占星術を舐めてはいけませんよ、チーちゃん。"
"3103-58-ヒマリ" = "「占星術」……それは古代の天文学者たちが長きに渡って研究してきた、#n黄道十二宮の流れと人間の生涯との連動性を観測するビッグデータ……。"
"3103-59-ヒマリ" = "まだ論理的な説明はつかずとも、統計が示す傾向性は無視できません。"
"3103-60-ヒマリ" = "何より……私の属する「へびつかい座」の星が、私にそう囁いていますから！"
"3103-61-チヒロ" = "……ヒマリ。"
"3103-62-チヒロ" = "へびつかい座って、黄道十二宮に含まれてないけど？"
"3103-63-ヒマリ" = "……そ、そうなのですか！？"
"3103-64-ユウカ" = "つまりこれって、「未来を予測する装置」というか……"
"3103-65-ユウカ" = "単なる、星座占いの機械だったってこと！？"
"3103-66-ユウカ" = "そ、そんな……ヒマリ部長の発明品がこんな役に立たないものだったなんて……。"
"3103-67-ユウカ" = "も、もしかして何か、制作過程にミスが……？"
"3103-68-ユウカ" = "いえ、完璧に設計図通りです。"
"3103-69-ノア" = "そういえば、最近の図書館の貸し出し記録からして……#nヒマリ部長、占星術周りの本をたくさん借りられていましたね。"
"3103-70-ノア" = "これはおそらく、ヒマリ部長がお遊びで作ったおもちゃなのではないでしょうか？"
"3103-71-ユウカ" = "おもちゃ……あれだけの予算を、おもちゃに……。"
"3103-72-ユウカ" = "……ちょっと待って。"
"3103-73-ユウカ" = "ノア、その言い方……もしかしてあなた、最初から気づいてたんじゃ……？"
"3103-74-ノア" = "まあ、確信はありませんでしたが。"
"3103-75-ユウカ" = "じゃ、じゃあどうして言ってくれなかったの！？"
"3103-76-ノア" = "どうしてって……。"
"3103-77-ノア" = "……聞かれてませんし？"
"3103-78-ユウカ" = "……ノアぁ！！"
"3103-79" = "（結局ユウカは予定通り、未来観測機関「讖」にかかった金額を自腹で負担することになってしまったものの……)"
"3103-80" = "（幸いにも、先物取引で購入したチタニウムの価格が暴騰したおかげで、#n　お金周りは何とかなったらしい）"
"3103-81" = "価値の証明"
