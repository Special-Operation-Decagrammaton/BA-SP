[translation]
"3302-1" = "全力で振り抜いて（２）"
"3302-2-レイ" = "はぁ、はぁ……じゅう……よん！"
"3302-3-レイ" = "さあ、もう少しです、レイさん。"
"3302-4-スミレ" = "このワンセットで終わりですから！"
"3302-5-レイ" = "うっ……"
"3302-6-レイ" = "……じゅう、ご！"
"3302-7-スミレ" = "よくできました！"
"3302-8-スミレ" = "では、最後にもうワンセット！"
"3302-9-レイ" = "待ってください！今のが最後じゃなかったんですか？"
"3302-10-レイ" = "増えてませんか！？増えてますよね！？"
"3302-11-スミレ" = "気のせいでしょう、次で最後ですから！"
"3302-12-スミレ" = "今日の痛みは、明日の筋肉につながるもの……"
"3302-13-スミレ" = "さあ、頑張りましょう！#nこれで明日には、きっと素敵な筋肉が手に入ります！"
"3302-14-レイ" = "それ！さっきも聞きました！"
"3302-15-レイ" = "いつの間にかワンセット増えてるし……"
"3302-16-レイ" = "こ、これ以上は無理です！"
"3302-17-スミレ" = "分かりました。では、一度休憩しましょう！"
"3302-18-スミレ" = "水分を補給したら、身体が冷える前に次のトレーニングに移ります！"
"3302-19-レイ" = "ふぅ……"
"3302-20-レイ" = "……スミレ先輩。このトレーニングで本当にホームランが打てるようになるんですか？"
"3302-21-レイ" = "腕や肩の筋肉よりも、足に負荷がかかっているような……"
"3302-22-レイ" = "心配いりません。#nバーピーは足だけでなく、全身を鍛えられますから！"
"3302-23-スミレ" = "これを繰り返せば、腕や肩はもちろん、持久力までつきます！"
"3302-24-スミレ" = "レイさんの場合、まずは基礎体力を上げつつ全身を鍛えるためにも、バーピーが効率的なんです。"
"3302-25-レイ" = "でも……"
"3302-26-レイ" = "私はホームランを打ちたいだけで、体力をつけたり全身を鍛えるのが目的じゃないんですが……"
"3302-27-レイ" = "腕力だけで打球を飛ばす有名なスラッガーも存在するのに……"
"3302-28-スミレ" = "……レイさん。"
"3302-29-スミレ" = "レイさんは、どうしてホームランを打ちたいんですか？"
"3302-30-レイ" = "それは……カッコいいからです。"
"3302-31-スミレ" = "一回のスイングで試合をひっくり返せるって思うと……"
"3302-32-スミレ" = "それに、ダイヤモンドを一周してる時間は、自分だけのものじゃないですか。"
"3302-33-レイ" = "だから、バッターとしてホームランに憧れるのは当然です。"
"3302-34-レイ" = "……自分は野球部に入ると決めたとき、思ったんです。"
"3302-35-レイ" = "いつか絶対にホームランを打って、試合に勝ってみせると！"
"3302-36-スミレ" = "最後にホームランを見たのは、いつですか？"
"3302-37-レイ" = "えっと……たしか去年のシーズン終わりに、友達と見たのが最後です。"
"3302-38-レイ" = "今でも、スタンドに吸い込まれるきれいなアーチが忘れられません。"
"3302-39-レイ" = "あの一発で、チームは逆転勝利を……"
"3302-40-レイ" = "……って、あれ？#n試合自体は負けたんだっけ……"
"3302-41-レイ" = "（おかしいな……）"
"3302-42-レイ" = "（あれだけ感動したはずなのに、球場の景色がよく思い出せない……）"
"3302-43-レイ" = "（大きなアーチはしっかり覚えてるのに、試合結果は……）"
"3302-44-レイ" = "……今日のトレーニングは、ここまでにしましょうか。"
"3302-45-レイ" = "あ、はい……お疲れ様でした。"
"3302-46-スミレ" = "レイさん、今日のナイターはどこで行われますか？"
"3302-47-レイ" = "今日は月曜日なので、レギュラーシーズンの試合は無いんですけど……#nゲヘナ自治区のスタジアムで二軍のリーグ戦がありますね。"
"3302-48-スミレ" = "では、一緒にその試合を見に行きましょう！"
"3302-49-レイ" = "え？こ、こんな急に……！？"
"3302-50-スミレ" = "せっかく時間があるのですから、楽しみましょう。"
"3302-51-スミレ" = "そうと決まれば……"
"3302-52-スミレ" = "ゲヘナ自治区まで走っていきましょう！"
"3302-53-レイ" = "それじゃ、今日中に会場までたどり着けませんって！"
