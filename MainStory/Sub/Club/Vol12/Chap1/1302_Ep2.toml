[translation]
"1302-1" = "会長はいつも正しい（２）"
"1302-2-マリナ" = "……というわけで、お前にはペロロになってもらう。"
"1302-3-ノドカ" = "何が「というわけで」なんですか！？何も理解できないんですけど！？"
"1302-4-マリナ" = "本校舎に呼び出されたから、ようやく旧校舎での停学処分期間が終わるのかと喜んでたのに……。"
"1302-5-ノドカ" = "いきなり「ペロロになれ」って、そんな冗談を言うために私を呼び出したんですか！？"
"1302-6-マリナ" = "残念ながら冗談ではない。この提案を飲んでさえくれれば、お前たちが本校舎に戻れるように全力で取り計らおう。何ならプリンも2つずつ支給するように交渉もする。"
"1302-7-マリナ" = "……ただしばらくの間、このペロロの着ぐるみに入って、語尾に「ペロ～」をつけて生活してくれれば良いんだ。"
"1302-8-ノドカ" = "そんな変な着ぐるみ、絶対に嫌なんですけど！？"
"1302-9-ノドカ" = "そもそもどうして私なんですか？それだけで良いなら、他の保安委員の方たちにやらせればいいじゃないですか。"
"1302-10-マリナ" = "それは無理だ、この着ぐるみに入れる身長の保安委員はいない。"
"1302-11-マリナ" = "これはお前みたいに、小さくて素早いちびっ子じゃないと実行できない作戦なんだ。"
"1302-12-ノドカ" = "誰がちびっ子ですか！！それが人に物を頼む態度ですか！？"
"1302-13-ノドカ" = "……そもそも「仮想のキャラクターを生徒として学校に編入させよう」だなんて、どうして承諾したんですか？"
"1302-14-ノドカ" = "いくら会長の命令とは言え、委員長もダメなのはダメとはっきり言ってくださいよ！"
"1302-15-マリナ" = "そ、それはそうなのだが……。"
"1302-16-マリナ" = "……いや、同志ノドカ。お前はまさか、「チェリノ会長が間違っている」とでも主張しているのか？"
"1302-17-マリナ" = "この保安委員長の前で、そのような不遜な発言……粛清されてもやむを得ないぞ！"
"1302-18-マリナ" = "ふーんだ。どうせ停学中の身ですから、そんな脅しなんか効きません！"
"1302-19-ノドカ" = "と・に・か・く！こんな変な着ぐるみを着て、謎の語尾で話すだなんて絶対に嫌です！　たとえ停学が取り消されるとしても断固拒否します！"
"1302-20-マリナ" = "くっ……。"
"1302-21-マリナ" = "この方法だけは使いたくなかったが……仕方あるまい。"
"1302-22-マリナ" = "お前たち、例のブツを持ってこい！"
"1302-23-ノドカ" = "そ、それは……「ルワゾー・ブッレ」の最高級プリン？"
"1302-24-ノドカ" = "確か、1個1000円くらいするはずの……その最高級プリンで、私を買収する気ですか？"
"1302-25-ノドカ" = "も、もちろん、ままま全くまったく心が動かないわけでは、ないですけど？こ、この程度で私の決心をゆゆ揺さぶることができるなんてお考えでしたら、あ、甘く見られたものですね……？"
"1302-26-マリナ" = "くく……考えが甘いのはお前の方だ。"
"1302-27-マリナ" = "これは買収するための物ではなく……お前の意志を挫くための、極悪非道な拷問道具だ！"
"1302-28-マリナ" = "ぷ、プリンで拷問……！？　それは一体どういう……"
"1302-29-マリナ" = "パクっ。"
"1302-30-ノドカ" = "た、食べた！？しかも一口であんなに！？"
"1302-31-ノドカ" = "そ、そんな……私だったら一口ずつ……いえ、ひとかけらずつ舐めるように味わうのに……それを一口で！？"
"1302-32-ノドカ" = "な、何てことを……しかし、その程度で屈するわけには……。"
"1302-33-マリナ" = "まあ、悪くは無いな。"
"1302-34-ノドカ" = "なっ、まだ残ってるのに捨てた！？"
"1302-35-ノドカ" = "ご、ご自分が何をしてるのか分かってるんですか！？なんて勿体ないことを……！"
"1302-36-マリナ" = "ふふっ……お前をここに呼んだ時点で、身辺調査はあらかた済ませてある。"
"1302-37-マリナ" = "旧校舎の生活で節約が身についたお前にとって、甘味は大切に味わうものだろう。それを目の前でこんな雑に食べられて、そのショックはさぞかし大きかろう。"
"1302-38-マリナ" = "これ以上悲惨な思いをしたくないなら、大人しく私に協力することだな！"
"1302-39-ノドカ" = "な、何て残酷なことを……やはりチェリノ会長の番犬、血も涙も無いマリナ委員長ですね。"
"1302-40-ノドカ" = "でも私にだってプライドがあります……これくらいの拷問では屈しません！何があっても、ペロロの格好なんてしません！"
"1302-41-マリナ" = "流石、あの227号特別クラスで長く生活してるだけはあるな。しかしその決心も、いつまで続くかな……？"
"1302-42-マリナ" = "さあ保安委員たちよ、どんどん次のおやつを持ってこい！"
"1302-43" = "その後も、マリナの拷問という名の暴飲暴食は続いた……。"
"1302-44-マリナ" = "ふむ。これが同志ノドカの大切にしている天体望遠鏡か……なるほど、噂通り大きくて立派だな……付いているレンズもそれに比例してかなりのものだ。"
"1302-45-マリナ" = "くくっ。もしもこの望遠鏡のレンズに、素手で触れたら……お前はどんな反応をするのかな？"
"1302-46-ノドカ" = "なっ、何をしようとしてるんですか！？そんなことをしたら、指紋がっ……！！"
"1302-47-マリナ" = "次はくすぐりの刑だ！事務局から持ってきたこの柔らかい羽箒で、首や腹をくすぐりまくってやろう。"
"1302-48-ノドカ" = "（こしょこしょこしょこしょ…….）"
"1302-49-ノドカ" = "うひゃっ！？ひっ、いひっ、や、やめっ、ひゃぁあっ！？"
"1302-50-ノドカ" = "わ、分かりましたっ！ひっ、い、言われた通りするのでやめっ、あはははははっ！？"
"1302-51-マリナ" = "それならばペロロらしく鳴いてみせろ！さあ「ペロ～」と叫ぶのだ！"
"1302-52-マリナ" = "次は、そうだな……この「ミントチョコをのせたパイナップルの天ぷら」でも食べてみるか？"
"1302-53-ノドカ" = "い、いっそ楽にして……"
"1302-54-ノドカ" = "うっ、うぅ……。"
"1302-55-マリナ" = "ふう。これくらいで勘弁してやろう。"
"1302-56-マリナ" = "さあもう一度聞こうか、お前は誰だ？"
"1302-57-ノドカ" = "ノド……いえ、ぺ、ペロロです。"
"1302-58-ノドカ" = "兎でも熊でもなく、れっきとしたペロロです、ペロペロ……。"
"1302-59-マリナ" = "素晴らしい、まさにペロロそのものだ！"
"1302-60-マリナ" = "これなら問題なくチェリノ会長を騙せ……いや、チェリノ会長に報告できそうだな。"
"1302-61-マリナ" = "この「偽ペロロ」を事務局へと編入させ、「特別黄金ひげ勲章」を貰い、それを足がかりにしてさらに高い地位へとのし上がっていくのだ……くくく。"
"1302-62-ノドカ" = "さあ、同志ノド……いや、ペロロよ。今すぐチェリノ会長に謁見しに行こうではないか。"
"1302-63-マリナ" = "レッドウィンター連邦学園の威信をかけた、大事な任務の始まりだ！学園の趨勢がその両肩に乗っているつもりで、気合を入れろ！"
"1302-64-ノドカ" = "ぺ、ペロ～……。"
