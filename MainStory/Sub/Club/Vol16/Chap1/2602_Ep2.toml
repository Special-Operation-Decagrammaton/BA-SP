[translation]
"2602-1" = "大人のオモチャ（２）"
"2602-2" = "山海経・お茶屋さん「桃源郷」"
"2602-3-シュン" = "ふふっ。こんなに仕事が早く終わって余裕ができるなんて、久しぶりですね。"
"2602-4-シュン" = "今日は一日、こうしてお茶を飲みながらのんびり過ごして……"
"2602-5-山海経の生徒A" = "……あの人だよね？「例のアレ」を買った梅花園の教官……。"
"2602-6-山海経の生徒B" = "優しくて良い人そうだなって思ってたのに……人は見かけによらないね。"
"2602-7-山海経の生徒A" = "それより、その……玄武商会は頼んだら、やっぱりそういうのも融通してくれるんだ……？"
"2602-8-山海経の生徒B" = "みたいだね、流石はかの有名な玄武商会……。"
"2602-9-シュン" = "……？なんだか、視線が……？"
"2602-10-シュン" = "なんでしょう。この頃こうして外にいると、他の生徒たちからの視線が……？"
"2602-11-シュン" = "誰からも恨みを買うようなことはしていないはずですが……。"
"2602-12" = "[s] \"おはよう、シュン。\""
"2602-13-シュン" = "あら、先生。お疲れ様です、何だかお久しぶりですね。"
"2602-14-シュン" = "先生も、お茶を頂きに？"
"2602-15" = "[s] \"うん、シュンも休憩中？\""
"2602-16-シュン" = "はい。久しぶりに仕事が早く終わったので、少しゆっくりしようかと。"
"2602-17-シュン" = "その割には浮かない表情……ですか？"
"2602-18-シュン" = "ふふっ……流石は先生、鋭いですね。"
"2602-19-シュン" = "実は、悩みごと……と言いますか、ちょっと気にかかってることがありまして。"
"2602-20" = "[s1] \"それ、私が聞いても良いかな？\"\n[s2] \"先生として、生徒のためにできることがあれば喜んで。\""
"2602-21-シュン" = "……ありがとうございます、先生。"
"2602-22-シュン" = "……ありがとうございます、先生。"
"2602-23-シュン" = "実は……何だか最近、変な視線を感じる気がする、と言いますか。"
"2602-24-シュン" = "いつも仲良くしてくださった方に、どうしてか少し距離を取られてしまったり……こうして座っているだけでも、通りすがりの方々がこちらを見て何か話されているような気がしまして……。"
"2602-25-シュン" = "このところの自分の行いを振り返ってみたのですが、特に思い当たることも無く……。"
"2602-26" = "[s3] \"えっと……。\"\n[s4] \"それは、多分……。\""
"2602-27-シュン" = "先生、何かご存知なんですか？"
"2602-28-シュン" = "先生、何かご存知なんですか？"
"2602-29-シュン" = "教えてください！私に何か悪いところがありましたら、直しますので……！"
"2602-30" = "[s] 最近噂になっているシュンの話を、本人に伝えてみる。"
"2602-31-シュン" = "わっ、私が「大人のオモチャ」を買った！？"
"2602-32" = "[s] \"声が大きい……！\""
"2602-33-シュン" = "ああっ、すみません……つ、つい、興奮してしまって……。"
"2602-34-シュン" = "それより何故そんな、い、いやらしい噂が……！？私、大人のオモチャどころか、そういった類のものは一度も買ったこと……！"
"2602-35" = "[s] 「玄武商会で買った物」について聞いてみる。"
"2602-36-シュン" = "……？あら、先生がどうしてその件を……？"
"2602-37-シュン" = "えっ、それが「大人のオモチャ」だという噂が……？"
"2602-38-シュン" = "ううっ、そういうことでしたか……！確かに秘密にしてとは伝えましたが、こんなことになるだなんて……！"
"2602-39-シュン" = "ち、違うんです先生！"
"2602-40-シュン" = "あれはただの、ただの……"
"2602-41-シュン" = "……ただの、お肌に使うマッサージローラーです。"
"2602-42" = "[s] \"マッサージローラー？\""
"2602-43-シュン" = "はい……何だか最近、お肌が荒れてきてしまって。なので、玄武商会に「お肌に効く」と噂のマッサージローラーを注文したのですが……"
"2602-44-シュン" = "梅花園の教官が美容を気にしているなんて、あまり良くは思われないかなと思いまして、秘密にしていただこうかと……。"
"2602-45-シュン" = "それだけでしたのに、まさか、まさかそんな、淫らな噂になってしまうなんて……うぅ……。"
"2602-46-シュン" = "……仕方ありません。私が秘密にしたのが発端ですし、少しずつ誤解を解いていくしか……。"
"2602-47-シュン" = "……ところで先生。その「大人のオモチャ」という話は、そもそも誰に聞いたのですか？"
"2602-48-シュン" = "いくら何でもここまでの速さで広がるのは流石におかしいですし……もしかして、誰かが今も積極的に話を広めている可能性が……！"
"2602-49-シュン" = "先生！知っていることを、全部話してください！"
"2602-50" = "（シュンの勢いに圧されてしまい、実際のところは分からないけど……といくつか前置きをしつつ、ココナと会った時のことを話した）"
"2602-51-梅花園の園児C" = "ねーねーココナちゃん。シュンおねえちゃんが「恐ろしい大人のオモチャ」を持ってるってほんとー？"
"2602-52-ココナ" = "だからココナちゃんじゃなくて、ココナ教官！"
"2602-53-ココナ" = "……で、これは秘密なんだけど。シュン姉さんが玄武商会で「大人のオモチャ」を買ったのは本当。"
"2602-54-ココナ" = "子どもはもう見るだけで失神しちゃうような、それはもう恐ろしい形のグロテスクなオモチャが――"
"2602-55-シュン" = "……ココナちゃん？"
"2602-56-シュン" = "今されていたお話、詳しく聞かせていただいてもよろしいですか？"
"2602-57-ココナ" = "うぁぅっ！？"
"2602-58-ココナ" = "しゅ、シュン姉さん！？きょ、今日はもうお休みじゃ……！？"
"2602-59-シュン" = "はい。ですがどうやら可愛い妹が、私のことであらぬ噂を広めているかもしれない、と知りまして……。"
"2602-60-ココナ" = "え、嘘！？それじゃあ、あの中に入っていたのは「大人のオモチャ」じゃなかったの……！？"
"2602-61-シュン" = "そんなことあるわけないでしょう！？"
"2602-62-シュン" = "ああもう、いっそあの時に中身を確認してもらっておけば、こんなことには……。"
"2602-63-シュン" = "それはさておき。梅花園の教官ともあろう者が、他人の秘密を守れずに言いふらすだなんて……子どもたちがそんな様子を見て育ったらどうなるかくらい、ココナちゃんも分かりますよね？"
"2602-64-シュン" = "そんなココナちゃんには……"
"2602-65-シュン" = "お姉さんとして、特別な「教育」をしないといけませんね……？"
"2602-66-ココナ" = "うわぁぁぁん！それはいやぁっ！？許してぇぇぇぇっ！！！"
"2602-67" = "とりあえず、噂の大本を止めることには成功したものの……"
"2602-68" = "シュンが「とんでもない大人のオモチャ」を持っているという誤解は、山海経の生徒たちの間でしばらく残り続けた……。"
"2602-69" = "大人のオモチャ"
