[translation]
"1702-1" = "無人フロアの幽霊さん（２）"
"1702-2" = "聖テレサ総合病院・4階無人フロア"
"1702-3-？？？" = "うふふ……うらめしや～、うらめしや～！！"
"1702-4-？？？" = "うらめしやぁ……。"
"1702-5-？？？" = "……ちっ、見てる人もいないし、ベタベタな幽霊の演技なんてもうやめるか。"
"1702-6-偽物の幽霊" = "ふふ、計画は成功だな。真夜中に幽霊の真似をしただけで、こんなに早く人がいなくなるとは……。"
"1702-7-偽物の幽霊" = "患者はもちろん、医者と看護師たちも幽霊が怖くて、この辺りにはもう誰一人近寄らない。これで好き勝手に動ける！"
"1702-8-偽物の幽霊" = "どれどれ、まずは売って金になりそうな物でもないか調べてみるか……。"
"1702-9-偽物の幽霊" = "……ん？足音？"
"1702-10-セリナ" = "は、ハナエちゃん……本当に探索を続けるつもりなんですか？#nと、特に何もなさそうですが……。"
"1702-11-ハナエ" = "ダメです！このフロアに幽霊がいないことをきちんと証明するまで帰れません！#nこうしている今も患者さんたちは怖がってるんですから！"
"1702-12-セリナ" = "どうしてハナエちゃんはこういう時だけ勇敢なんですか、ううぅ……。"
"1702-13-偽物の幽霊" = "誰だ？この病院の看護師たちではなさそうだが……#nボランティアの生徒たちか？"
"1702-14" = "まあいい、誰であろうとこの私の計画を邪魔するやつは許さない。#n幽霊の真似をして、びっくりさせてやるとするか！"
"1702-15-セリナ" = "ひいっ！？い、今の聞きましたか、ハナエちゃん！？カーテンの向こうで何かが動きましたよ！"
"1702-16-ハナエ" = "あれれ？そこは、さっきまで何もいなかったはずなのですが……窓から猫さんでも入ってきたんでしょうか？"
"1702-17-ハナエ" = "猫さん、猫さーん。出てきてくださ～い。"
"1702-18-ハナエ" = "ふふふっ、うらめしや～、うらめしや～！"
"1702-19-ハナエ" = "キャアアアアァァァァッッ！ゆ、幽霊ですっ！幽霊っっっ！！"
"1702-20-偽物の幽霊" = "今すぐ出て行かないと、お前らの魂を奪ってやるぞ～！"
"1702-21-セリナ" = "先輩！青色の弾倉を！#nその中にシスターフッドで貰ってきた、銀の弾丸が入ってます！"
"1702-22-ハナエ" = "これだけは使いたくなかったのですが……"
"1702-23-セリナ" = "す、すみません、幽霊さん！これで、成仏してください！"
"1702-24-偽物の幽霊" = "え、うわっ！？#nい、いきなり銃を撃つなんて、なんてことを！"
"1702-25-偽物の幽霊" = "それにここは病院だぞ！？そんな危ない物を振り回して、誰か怪我でもしたらどうするんだ！"
"1702-26-ハナエ" = "へ？銃は病院でもとっても役立ちますよ。怪我した患者さんのための松葉杖としても使えますし、仮病の患者さんを立ち上がらせるためにも使えますし！"
"1702-27-ハナエ" = "銃は病院でも必須の、魔法道具のようなものです！"
"1702-28-セリナ" = "そ、それに、幽霊さんは生きてる方ではないのですから、銃で撃たれても何ともないでは……？"
"1702-29-偽物の幽霊" = "そ、それはそう、だが……。"
"1702-30-偽物の幽霊" = "痛っ！ちょ、ちょっと待て！"
"1702-31-偽物の幽霊" = "いくら除霊用の銀の弾丸だと言っても、生きてる人に無害だなんてわけないだろう！当たったら怪我するだろうし、一歩間違ったら死ぬかもしれないんだぞ！？"
"1702-32-セリナ" = "んん？幽霊さんはもう死んでるはずなのに、また死んでしまうんですか？"
"1702-33-セリナ" = "生前への未練は分かりますが、ここはあなたがいる場所ではありません！#n素直に成仏してください！"
"1702-34-偽物の幽霊" = "や、やめろ！分かったから！"
"1702-35-偽物の幽霊" = "わ、私の負けだ！頼むからやめてくれー！"
"1702-36" = "その後、幽霊（？）が降参を宣言してからも、しばらくの間銃弾を浴びせられ続けた……。"
