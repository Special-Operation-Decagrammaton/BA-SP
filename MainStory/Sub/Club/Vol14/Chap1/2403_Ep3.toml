[translation]
"2403-1" = "夜は短し、走れよ乙女（１）"
"2403-2" = "（それは、午前1時すぎの深夜のこと……）"
"2403-3-カエデ" = "んんんんんんん……。"
"2403-4-カエデ" = "（むにゃ……んぅ……）"
"2403-5-カエデ" = "（……？この音、何……？）"
"2403-6-ツバキ" = "ミモリ、どう？準備終わった？"
"2403-7-ミモリ" = "えっと……これとあれと、この辺りで大丈夫ですよね？"
"2403-8-ツバキ" = "うん、それで大丈夫。"
"2403-9-ツバキ" = "……じゃあ、行こっか？"
"2403-10-ミモリ" = "はい。カエデちゃんを起こしてしまわないように、静かに出ましょう。"
"2403-11-カエデ" = "（んん、ツバキ先輩……ミモリ先輩……？）"
"2403-12-カエデ" = "二人で、一体どこに……Zzz……"
"2403-13-カエデ" = "はっ！？"
"2403-14-カエデ" = "……夢？"
"2403-15-ミモリ" = "あ、カエデちゃん。おはようございます。"
"2403-16-ミモリ" = "ちょうど朝ご飯もできますから、顔を洗ってきては如何ですか？"
"2403-17-カエデ" = "あ、うん。"
"2403-18-ツバキ" = "ふあぁ……。"
"2403-19-ミモリ" = "ツバキちゃんも、立ったまま器用に二度寝しないでくださいね？"
"2403-20-ミモリ" = "さあさあ、カエデちゃんと一緒に。"
"2403-21-ツバキ" = "ふぁぅ……うん、お母さん……。"
"2403-22-ミモリ" = "わっ、私はお母さんではありませんよ！？"
"2403-23-ツバキ" = "くぅ……。"
"2403-24-ミモリ" = "……ツバキちゃん？え、もしかして本格的に寝てしまったんですか？起きてください、ツバキちゃん！？"
"2403-25-カエデ" = "……。"
"2403-26" = "百夜堂"
"2403-27-カエデ" = "先生はどう思う！？"
"2403-28" = "[s1] \"どういうこと……？\"\n[s2] \"急に「どう思う」って言われても……。\""
"2403-29-カエデ" = "何でそんなにリアクションが薄いのさ！？"
"2403-30-カエデ" = "何でそんなにリアクションが薄いのさ！？"
"2403-31-カエデ" = "先生分かってる？これは深刻なことなんだよ、大事件なんだよ！？"
"2403-32-フィーナ" = "そ、それほどのことなのデスカ！？フィーナ、今の話では何も分かりませんデシタ！"
"2403-33" = "[s] \"大丈夫、私も分かってない。\""
"2403-34-カエデ" = "どうして！？こんな大事件なのに！"
"2403-35-カエデ" = "先輩たちが私だけを置いて、二人っきりで深夜に外出なんて……！"
"2403-36-フィーナ" = "確かにそう聞くと、怪しいかもデスね？"
"2403-37-カエデ" = "でしょ！？"
"2403-38-カエデ" = "怪しいよ！もう怪しさしかないよ！"
"2403-39-カエデ" = "それも、しっかり私が眠った頃を見計らって……これは何か、とんでもない秘密を隠してるに違いない！"
"2403-40-フィーナ" = "ナルホド。部員には内緒で、幹部二人だけが夜な夜な……怪しい事件の匂いがしてキマシタ！"
"2403-41-カエデ" = "そうだよね！さっすがフィーナ、分かってるぅ！はい、そんなフィーナには花丸シールあげちゃう！"
"2403-42-フィーナ" = "ヤリマシタ！ありがとうゴザイマス！"
"2403-43" = "[s] \"うーん……。\""
"2403-44-カエデ" = "先生、そんなんじゃ名探偵にはなれないよ！"
"2403-45" = "嵐の中の離島とか、橋が落ちた山奥の山荘なんかに孤立しちゃったらどうするの！？"
"2403-46" = "[s] \"特に名探偵は目指してないから……。\""
"2403-47-カエデ" = "と・に・か・く！このカッコよくて可愛くて、すごい推理力を持ってて、将来はキヴォトスいちの美少女名探偵として名を馳せることになるこの私の天才的な頭脳によると……！"
"2403-48-シズコ" = "何だかすごい壮大な形容詞が聞こえたけど……"
"2403-49-シズコ" = "はい、ご注文のイチゴ餡蜜ですよー。"
"2403-50-シズコ" = "アッ、委員長！"
"2403-51-シズコ" = "わーい！美味しそー！"
"2403-52" = "[s] \"ありがとね、シズコ。\""
"2403-53-フィーナ" = "いえ、ご注文いただいたものを持ってきただけですから、そんなお礼を言われるようなことでは。"
"2403-54-フィーナ" = "ところでフィーナ。いくらお店が空いてる時間帯とはいえ、あんまり先生を困らせないようにね。"
"2403-55-カエデ" = "そこはご心配なく！これは遊んでいるわけではなく、[ruby=ももよどう]百夜堂[/ruby]の店員として、お客さんのお悩みをお聞きしているだけデスので！"
"2403-56-フィーナ" = "任侠映画でも序盤によく出てくる、ちょっとこじれた事情を聴く役デス！"
"2403-57-カエデ" = "そうそう、お客さんには親切にしないと！もぐもぐ……。"
"2403-58-シズコ" = "それをお客さん側から言うのもちょっとどうかと思うけど……まあ確かにそうね。"
"2403-59-シズコ" = "それじゃあ、せっかくだし……。"
"2403-60-シズコ" = "さぁご主人様っ！このご注文のイチゴ餡蜜セットがも～っと美味しくなるように、今からシズコが魔法をかけちゃいますね！"
"2403-61-シズコ" = "美味しくな――"
"2403-62-カエデ" = "あっ、それは大丈夫！"
"2403-63-シズコ" = "ぁ……え？"
"2403-64-カエデ" = "そういうのって、タンカ？を高くするために、お店が勝手にたくさん付けるサービスなんでしょ？"
"2403-65-カエデ" = "この間そう聞いたの！一人前のレディーとして、そういう手には乗らないんだから！"
"2403-66-シズコ" = "ちょっ、待って！その言い方は悪意があるでしょ！？うちはそういうのは――"
"2403-67" = "[s] \"お店によっては、そういう闇の側面も時々……。\""
"2403-68-シズコ" = "先生！？"
"2403-69-カエデ" = "とにかくさっきの続きだけど、先輩たちは私に何かを隠してるに違いないの……もぐもぐ。"
"2403-70-カエデ" = "もぐもぐ……はむはむ……だから、あむっ……。"
"2403-71-シズコ" = "とりあえず全部食べ終わってからにしたら？"
"2403-72-カエデ" = "はむっ……ごっくん！ふぅ、だからつまりっ！"
"2403-73-カエデ" = "先輩たちは私に隠れて、例えば……修行部の秘密のミッションとかをしてるのかもしれない！"
"2403-74-シズコ" = "秘密のミッションって……ちょっと考えすぎじゃない？"
"2403-75-カエデ" = "うーん……でも、今回だけってわけじゃなさそうだし……。"
"2403-76-カエデ" = "一昨日も、三日前も、先週も……うん、週に五回くらいはある気がする。"
"2403-77-シズコ" = "もうほとんど毎日じゃん……。"
"2403-78-カエデ" = "でも、なんで私にだけバレないように、それも夜中に……？"
"2403-79" = "[s] \"うーん、きっと何か理由が……。\""
"2403-80-カエデ" = "はっ！今、私のこの天才的な頭脳にビビビッと来た！"
"2403-81-カエデ" = "もしかして、大人の女性なら誰もが嗜んでるっていう……「夜遊び」を！？"
"2403-82" = "やっぱり素敵なレディーとして、夜遊びは普通のことなの！？私はまだ素敵なレディーになれてないから、だから連れて行ってくれないってこと！？"
"2403-83" = "絶対に違うと思うけど……。"
"2403-84-カエデ" = "えー、でもそんなの分かんないじゃん。あっ、もしかして……自分はお祭り運営委員会の委員長として、夜遊びしてるから分かるってこと！？"
"2403-85-フィーナ" = "そうなんデスカ委員長！？"
"2403-86-フィーナ" = "委員長のヨアソビ……"
"2403-87-フィーナ" = "つまり百夜堂のオーナーとして、夜な夜な任侠入り乱れる百鬼夜行の街の平和を守っていたのデスカ！？さすがは委員長、フィーナ感動しマシタ！"
"2403-88" = "[s] \"シズコのパンチならできるかも。\""
"2403-89-シズコ" = "そんな訳ないでしょ！？それに多分「夜遊び」って言ったら、普通はそういうのじゃなくて、えっと……。"
"2403-90-カエデ" = "でも、他に私を置いていく理由なんて……。"
"2403-91-カエデ" = "もしかして……私が、頼りない後輩だから？"
"2403-92-カエデ" = "私、もう先輩たちにとって……要らない後輩、なのかな……。"
"2403-93-フィーナ" = "カエデ……。"
"2403-94-シズコ" = "……はあ。そこまで気になるなら、実際に確かめてみればいいでしょ？"
"2403-95-カエデ" = "えっ？"
"2403-96-シズコ" = "うじうじ考えてばっかいないで、そういう時はさっさと確認するのが一番良いの。"
"2403-97-シズコ" = "そういうところから誤解は生まれるんだから。"
"2403-98-カエデ" = "実際に、確かめる……？"
"2403-99-シズコ" = "ほら、この抹茶ラムネもあげるから。早く行ってきたらどう？"
"2403-100-フィーナ" = "サスガ委員長！不器用ながらも相手を気遣う優しさ、これぞ百夜堂のオーナー！"
"2403-101" = "[s] \"やっぱりシズコは優しいね。\""
"2403-102-シズコ" = "いっ、いえその、これはただそんな顔をされるとお店としても困ると言いますか、他のお客さんも気になってしまうからと言いますか……そう、それだけです！"
"2403-103-カエデ" = "……うん！"
"2403-104-カエデ" = "確かにそうかも、やっぱりお祭り運営委員会の委員長は伊達じゃないね！仕方ないからこの花丸シールあげちゃう！"
"2403-105" = "いや、別に要らないけど……これ何？どこのシール？"
"2403-106-カエデ" = "私のお手製！このシールをたくさん集めると、なんと豪華賞品をプレゼント！"
"2403-107-シズコ" = "へえ……賞品ってどんなの？"
"2403-108-カエデ" = "シールを10枚集めたら、お誕生日に私がお歌を歌ってあげる！"
"2403-109-シズコ" = "……すごくコメントに困る賞品！"
"2403-110-シズコ" = "まあそれはともかく……これで悩みは解決したでしょ？帰って先輩たちに直接理由を聞いて――"
"2403-111-カエデ" = "よしっ！じゃあ早速今夜、先輩たちを尾行して直接真相を確かめないと！"
"2403-112-シズコ" = "私の話聞いてた！？"
"2403-113-カエデ" = "夜な夜な私に隠れて何をしてるのか……一人前のレディーになるためにも、ちゃんとそれを自分の手で解明しないと！"
"2403-114" = "良いデスね！フィーナも応援してマス！"
"2403-115-カエデ" = "あっ、もちろん先生も協力してくれるよね？可愛い生徒のお願い、断ったりしないよね？"
"2403-116" = "[s] \"え？ま、まあ全然協力するけど……。\""
"2403-117" = "よし、そうと決まれば善は急げだよ！あ、イチゴ餡蜜ごちそう様ー！"
"2403-118-シズコ" = "もう、慌ただしいんだから……。"
"2403-119-シズコ" = "あ、先生。カエデの分と合わせて、お会計お願いしますね♡"
"2403-120" = "[s] \"まあそうなるよね！\""
"2403-121" = "（そうして夜になって……）"
"2403-122-カエデ" = "…………。"
"2403-123-カエデ" = "……！"
"2403-124-カエデ" = "ツバキ先輩とミモリ先輩は……もう行ったかな？"
"2403-125-カエデ" = "よし、じゃあ私も……シュババッ！"
"2403-126-カエデ" = "先生！こっちこっち！"
"2403-127" = "[s] \"お待たせ。結構もう夜遅いけど、大丈夫？眠くない？\""
"2403-128-カエデ" = "自分で言ったんだもん！それに私はこう見えて一人前のレディー……になる予定なんだから！"
"2403-129-カエデ" = "ミモリ先輩にダメって言われてたブラックコーヒーを5杯も飲んだし、お目目ぱっちり！"
"2403-130-カエデ" = "普段は「眠れなくなって生活サイクルが崩れてしまうので、飲んではいけませんよ」って言われてるけど、今日は非常事態だから仕方ない！"
"2403-131-カエデ" = "完璧！やっぱり私、賢い！"
"2403-132-カエデ" = "ふぁ……。"
"2403-133" = "[s] \"本当に大丈夫かな……。\""
"2403-134-カエデ" = "……ん？先生どうしたの？"
"2403-135-カエデ" = "はっ、こんなにゆっくりしてる場合じゃない！"
"2403-136-カエデ" = "ほら、先輩たちを追いかけないと！いざ、尾行開始！"
