[translation]
"2502-1" = "ゲームの道はマナーから（２）"
"2502-2" = "ミレニアム近隣・大型ゲームセンター"
"2502-3-ミドリ" = "何だか、前に来た時よりもだいぶ広くなったね。改築工事でもしたのかな？"
"2502-4-ミドリ" = "確かにそうかも。あっ、『スペースキャット』の新作アーケードも入ってる！"
"2502-5-アリス" = "ユズ、あそこに新しい据え置き型ゲーム機の試遊台があります。"
"2502-6-ユズ" = "あぁ……！ついに、第15世代ゲームコンソールの時代が……"
"2502-7-ユズ" = "えっと……あ、側面に新しい方式の冷却装置……前の問題点がちゃんと改善されてる。"
"2502-8" = "メモリの部分も全然違うかも、反応速度がだいぶ速くなって……。"
"2502-9-モモイ" = "あはは……やっぱりユズはゲームに触れると人が変わったみたいになるね。"
"2502-10-ミドリ" = "お姉ちゃん、私たちも『スペースキャット』やってみようよ。"
"2502-11-モモイ" = "うんっ、じゃあ手加減無しで……"
"2502-12-モモイ" = "……じゃなくて！こんなことしてる場合じゃないよ！"
"2502-13-モモイ" = "ここに来た目的を忘れたの？早くあのマナーのなってないゲーマーを見つけなきゃ！"
"2502-14-ミドリ" = "いや、そもそも私は新しいコントローラーを買いに来たんだけど……。"
"2502-15-アリス" = "モモイ、倒すべきモンスターがたくさんです。どのゲームからやりましょう？"
"2502-16-ユズ" = "わたしも、喧嘩なんてしないで……ずっと新しいゲーム機を見てたい……。"
"2502-17-モモイ" = "ダメダメ！こうしてる間にも、あのユーザーがまたどこかで暴言を吐いているかもしれないんだよ！？"
"2502-18-モモイ" = "それで落ち込んじゃったユーザーがゲームから離れて、また別のユーザーも……ってなったら、いつかは対戦型ゲームそのものが廃れちゃう！"
"2502-19-モモイ" = "それは流石に、悲観的すぎない……？"
"2502-20-アリス" = "なるほど、これは世界を救うための崇高な戦い……"
"2502-21-アリス" = "勇者たちよ、早速魔王の根城に向かうとしよう！"
"2502-22-モモイ" = "うん、とりあえず『スチューデントファイター2』があるところに行こっか！"
"2502-23-ミドリ" = "思ったより人が少ないね、もしかしてもう帰っちゃったんじゃない？"
"2502-24-モモイ" = "ううん、まだ分からないよ。画面のIDを見てみて。"
"2502-25-モモイ" = "このユーザーは違う……"
"2502-26-モモイ" = "こっちも違う……。"
"2502-27-悪質なゲーマー" = "いやっほーぅ、また勝った！連戦連勝ぉ！"
"2502-28-敗北したゲーマー" = "うぅ、また負けた……せっかく練習したのに……。"
"2502-29-悪質なゲーマー" = "練習って、あの「偶然出た」みたいな連携技っぽいやつ？それ本気で言ってんの？"
"2502-30-悪質なゲーマー" = "これなら足で操作したって勝てそうだよ！くくっ、あははっ！！"
"2502-31-敗北したゲーマー" = "ちょっ、ゲームでそこまで言わなくてもいいじゃん！"
"2502-32-敗北したゲーマー" = "今言ったこと、取り消して！"
"2502-33-悪質なゲーマー" = "ヤダよバ～カ、ゲームもできないのに何ができるの？楽しいことでも頑張れないのに、他の何なら頑張れるわけ？勉強？スポーツ？恋愛？"
"2502-34-敗北したゲーマー" = "うぅ……ママに言いつけてやるっ！"
"2502-35-ミドリ" = "うわ、ひっどいね。オフラインでもあんな暴言を吐くゲーマーがいるなんて。"
"2502-36-モモイ" = "ああっ、見つけた！あのID！"
"2502-37-悪質なゲーマー" = "ん？何だ、お前たちもあたしに挑戦するつもりか？"
"2502-38-モモイ" = "あんた、「Sukeban312」だよね？昨日オンライン対戦で、私のことを「おばあちゃん」って言ったでしょ！"
"2502-39-悪質なゲーマー" = "ってことは……お前が「Peach_Figther」？"
"2502-40-悪質なゲーマー" = "ははっ、なんだ、予想通りやっぱりガキじゃん。"
"2502-41-悪質なゲーマー" = "が、ガキじゃないし！？"
"2502-42-ミドリ" = "対面でもこれって、本当に失礼な人……。"
"2502-43-アリス" = "……モモイ。[ruby=スーパーノヴァ]「光の剣」[/ruby]でこの邪悪な魔王、浄化しますか？"
"2502-44-モモイ" = "昨日の暴言について今すぐ謝らないと、痛い目にあうよ！早く謝って！"
"2502-45-悪質なゲーマー" = "やーだよーだ。"
"2502-46-モモイ" = "何でっ！"
"2502-47-悪質なゲーマー" = "あたしは、自分より弱い相手なんかには謝らない。"
"2502-48-悪質なゲーマー" = "どうして自分より下手な人に頭を下げなきゃいけないわけ？意味もなくプライドが傷つくじゃん。"
"2502-49-モモイ" = "こんっの……！"
"2502-50-ミドリ" = "……お姉ちゃん、撃っていい？"
"2502-51" = "勇者よ、汝が許可するのであれば、私はいつでもこ[ruby=レールガン]の剣を[/ruby]抜こう。"
"2502-52-悪質なゲーマー" = "はっ、そこまで言うならあらためて『スチューデントファイター2』で勝負を決めるのはどうだ？一度でも私に勝てたら、昨日のことは謝ってやるよ。"
"2502-53-モモイ" = "言ったね、よしっ。今度は手加減しないんだから……！"
"2502-54-モモイ" = "謝罪の言葉でも考えておいた方が良いよ！"
"2502-55-悪質なゲーマー" = "んじゃ……"
"2502-56-モモイ&悪質なゲーマー" = "勝負！"
"2502-57" = "<SYSTEM> 「Sukeban312」選手の勝利！"
"2502-58-悪質なゲーマー" = "ふはっ、何だよ！自信満々で再挑戦しておいて、こんなもんか？"
"2502-59-悪質なゲーマー" = "お前、本当にゲームの才能無いんじゃない？くくっ……！"
"2502-60-モモイ" = "ちょっとぉ！画面隅のしゃがみガードでガン待ちとか反則でしょ！"
"2502-61-モモイ" = "牽制技だけで勝つとか卑怯だよ！"
"2502-62-悪質なゲーマー" = "いやいや、これだってれっきとしたゲームの技じゃん。悔しかったらちゃんと攻略法でも見つけてくるべきだし、自分ルールを押し付けて駄々をこねるとか幼稚すぎない？"
"2502-63-モモイ" = "うぅぅ……もうっ！"
"2502-64-ミドリ" = "牽制技は一旦置いておくとして……お姉ちゃんの方の、ガードされてもある程度ダメージが入るはずの特殊技が、全く効いてなかったような……？"
"2502-65-ミドリ" = "何かおかしくない……？"
"2502-66-アリス" = "……恐らく、バグ技を利用しているのだと思います。"
"2502-67-ミドリ" = "バグ技？"
"2502-68-アリス" = "はい、『スチューデントファイター2』では特殊な操作をすることで、ほんの一瞬ですが画面がフリーズするバグがあります。"
"2502-69-アリス" = "恐らくですがそのバグを悪用して、モモイの攻撃を回避しているのかと。アリスにはそう見えました。"
"2502-70-ミドリ" = "そ、そんなの勝てっこないじゃん！？"
"2502-71-アリス" = "相手との実力差が大きければまだしも、あっちも普通に強いこの状況じゃ……。"
"2502-72-ユズ" = "……。"
"2502-73-ユズ" = "えっと……すみません、モモイの代わりにわたしでも、良いですか……？"
"2502-74-悪質なゲーマー" = "ん、新しいチャレンジャーか？"
"2502-75-悪質なゲーマー" = "OK、受けて立つよ。ま、何人来ても結果は変わんねえけどな。はははっ！"
"2502-76-ユズ" = "……ふぅ。ちょっとだけ……。"
"2502-77" = "<SYSTEM> 試合、開始！"
"2502-78" = "<SYSTEM> パーフェクト！「UZQueen」選手の勝利！"
"2502-79-悪質なゲーマー" = "あ、ありえない……こんなガキに、あたしが負けただと？"
"2502-80-悪質なゲーマー" = "しかもノーダメージ……！ほとんど何もできないまま連続コンボで……！"
"2502-81-ユズ" = "……謝って。"
"2502-82-悪質なゲーマー" = "……は？"
"2502-83-ユズ" = "約束通り、モモイに謝って……。"
"2502-84-悪質なゲーマー" = "ちっ……まあ、約束だったからな。"
"2502-85" = "……悪かった。昨日といいさっきといい、ちっとあたしが言い過ぎた。"
"2502-86-モモイ" = "ユズすごい！一回でやっちゃった！"
"2502-87-ミドリ" = "それにパーフェクト勝利なんて……さすがユズちゃん！"
"2502-88-アリス" = "さすがは伝説の勇者、「UZQueen」です！"
"2502-89-ユズ" = "ちょ、ちょっと、みんな大袈裟……そんなに言われると、恥ずかしい……。"
"2502-90-悪質なゲーマー" = "ま、待ってくれ！あ、あんたが「UZQueen」なのか？"
"2502-91-悪質なゲーマー" = "オンライン対戦ランキングで、ただの一度も頂点の座を譲ったことが無い……しかしその姿を誰も見たことがないという、あの伝説のゲーマーの！？"
"2502-92-ユズ" = "伝説のゲーマーかどうかは、知らないけど……うん。UZQueenは、わたし。"
"2502-93-ゲーマーA" = "えっ？あの子がUZQueen！？"
"2502-94-ゲーマーB" = "UZQueenって……対戦型アクションゲームはもちろん、リズムゲームでも常にランキング1位の、あの伝説のゲーマー！？"
"2502-95-ゲーマーC" = "UZQueen、本当に実在したんだ……。"
"2502-96-ゲーマーA" = "UZQueen様、サインください！"
"2502-97-ゲーマーB" = "ちょっ、ちょっと、順番は守って！撃つよ！？私が先にサインをもらうの！"
"2502-98-ユズ" = "う、うぁ……ひ、人がいっぱい……。"
"2502-99-ユズ" = "も、モモイ、ミドリ、アリスちゃん！た、助けて……！"
"2502-100-モモイ" = "あー、やっぱりゲーセンだもんね。みんな知ってるか。"
"2502-101-ミドリ" = "ユズちゃんのことを好きな人が、こんなにたくさんいてくれるなんて。何だか、私もすっごく嬉しい。"
"2502-102-アリス" = "立派な王になるためには、王冠の重さに耐えねばなりません。"
"2502-103-ユズ" = "わ、わたしは、別にこうなりたくて、ゲームをしてるわけじゃ……！"
"2502-104-ゲーマーB" = "UZQueen様、せっかくですし上達法を教えてください！"
"2502-105-ゲーマーC" = "私とぜひお手合わせを……！"
"2502-106-ユズ" = "人がどんどん……"
"2502-107-ユズ" = "あぁ、あぁぁぁ……！！"
"2502-108" = "その後ユズはあわあわしながらも、押し寄せたファンの一人一人全員と頑張ってどうにか挨拶を交わした後、ようやくゲームセンターから出ることができた……。"
"2502-109" = "ゲームの道はマナーから"
