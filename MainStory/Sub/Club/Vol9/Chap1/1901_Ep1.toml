[translation]
"1901-1" = "風紀委員会・週次定例"
"1901-2-アコ" = "では、今週の定例会を始めます。"
"1901-3-ヒナ" = "……はあ。"
"1901-4-ヒナ" = "……アコ、今[ruby=パンデモニウムソサエティー]日は「万魔殿」のや[/ruby]つらとミーティングがあるから、早めにお願い。"
"1901-5-アコ" = "はい、承知しました。15分後だったはずですので、その前には終わらせましょう。"
"1901-6-アコ" = "まず、97-44区域で起きた正体不明の爆発について報告です。"
"1901-7-アコ" = "検証の結果、この爆発は多目的榴弾が原因だったことが確認されました。"
"1901-8-アコ" = "犯行グループは温泉開発部と判明していますが現在は逃走中、風紀委員会の3個小隊が確保に向かっています。"
"1901-9-ヒナ" = "理由は？"
"1901-10-アコ" = "……いつも通り、温泉開発です。"
"1901-11-ヒナ" = "……待って、97-44区域って高速道路のど真ん中でしょう？そこに温泉を開発しようとして？"
"1901-12-アコ" = "はい、そうです。あそこの部はそういった事情を鑑みたりはしないので……。"
"1901-13-チナツ" = "念のためお聞きしますが、どういった理由でこのようなことを……。"
"1901-14-温泉部の部員A" = "そこに温泉があるからだよ！それ以外に理由なんてない！"
"1901-15-温泉部の部員B" = "そうだ、とにかく掘るんだ！そこに温泉の可能性がある限り！"
"1901-16-温泉部の部員C" = "ブルドーザーで撤去だ！すべては開発から始まる！"
"1901-17-チナツ" = "（……何を言ってるのか全く分かりませんね。どうしろと……）"
"1901-18-アコ" = "……というのが、チナツさんからの報告書の要旨です。意味は分かりませんが。"
"1901-19-アコ" = "思うに高速道路のサービスエリア……のようなものを作りたかったのではないでしょうか、温泉付きで。"
"1901-20-ヒナ" = "……はあ、もういい。"
"1901-21-アコ" = "その高速道路ですが、以後約3か月間の渋滞が予想されるため、物流の54%近くが……。"
"1901-22-ヒナ" = "その辺りの処理は万魔殿のやつらに任せればいいわ、次。"
"1901-23-アコ" = "はい、では次、第3学生食堂が爆破された件ですが……。"
"1901-24-ヒナ" = "学食が爆破……美食研究会？"
"1901-25-アコ" = "そうです。"
"1901-26-ヒナ" = "理由は？"
"1901-27-アコ" = "今回の理由は……「唐揚げにレモンを添えてくれなかったから」、だそうです。"
"1901-28-ヒナ" = "レモン……。"
"1901-29-アコ" = "美食研究会は給食部部長のフウカさんを人質にし、それを制圧しに向かった風紀委員会と戦闘になりました。"
"1901-30-ハルナ" = "風紀委員のみなさんにお聞きしますわ、これはとても大事な問題です。"
"1901-31-ハルナ" = "唐揚げにレモンは有りか、無しか！！！！"
"1901-32-ハルナ" = "さあ、みなさんのご意見はいかがでしょう？"
"1901-33-イオリ" = "わ、私はどちらかというと、あった方が……。"
"1901-34-風紀委員" = "そんなことしたらせっかくの揚げ物がべちゃべちゃになるでしょ！なんでそんなひどいことができるの！？"
"1901-35-イオリ" = "何だと！？さっぱりするレモンがあってこそ、揚げ物の脂っこさが引き締まるんだろ！？"
"1901-36-ハルナ" = "ふふふ、良いですね、美食についての真剣な討議！これぞ私たち美食研究会が求めていたもの！"
"1901-37-ハルナ" = "何が正しいのでしょう、何が真理なのでしょう！さあ、話し合おうではありませんか！"
"1901-38-風紀委員たち" = "だから、レモンなんてかけると……"
"1901-39-風紀委員たち" = "いや、衣はどんどん途中から……"
"1901-40-風紀委員たち" = "だったら塩は？"
"1901-41-風紀委員たち" = "急に話題を変えないで！でも私は塩よりソース派！"
"1901-42-ハルナ" = "ふふふっ、素晴らしいですわね……！"
"1901-43-フウカ" = "（何でもいいから早く助けて……）"
"1901-44-アコ" = "その後、激論は争いへと発展し、イオリを含む多数の風紀委員が入院。一方で美食研究会は逃走し……。"
"1901-45-ヒナ" = "……はあ。"
"1901-46-ヒナ" = "分かった。給食部の部長に、被害額を把握したらこっちに報告するように伝えて。"
"1901-47-ヒナ" = "このまま放置すると、そのうち給食がおにぎりだけになるかもしれない。"
"1901-48-アコ" = "承知しました。"
"1901-49-アコ" = "次です。欠席届を偽造し、1枚2千円で販売するという不法行為を……"
"1901-50-ヒナ" = "便利屋？"
"1901-51-アコ" = "はい、便利屋68です。どうやら職員室に侵入して欠席届用の印鑑をコピーし……"
"1901-52-アコ" = "学園の掲示板に堂々と、「欠席届売ります、これで好きなだけ欠席が可能」という広告文を貼ったようです。"
"1901-53-ヒナ" = "欠席届……この学園で、わざわざ許可を得て欠席するような人、いる？"
"1901-54-アル" = "ど、どうして一枚も売れないのよ！"
"1901-55-ムツキ" = "あははははは！相変わらずだねー、アルちゃん！"
"1901-56-ハルカ" = "（ソワソワ……）"
"1901-57-カヨコ" = "はあ……。"
"1901-58-アコ" = "いませんね、実際に全く売れなかったそうで。罪状は不法侵入と公文書偽装です。"
"1901-59-ヒナ" = "はあ……。"
"1901-60-アコ" = "次ですが――"
"1901-61-ヒナ" = "待って、あといくつあるの？"
"1901-62-アコ" = "あと18件ですね。"
"1901-63-ヒナ" = "……この一週間で、18件？"
"1901-64-アコ" = "いえ、実際には2日分です。情報部のお休みの関係で、残り5日分の報告書は来週の定例会議に持ってくるそうで。"
"1901-65-ヒナ" = "……。"
"1901-66-アコ" = "……。"
"1901-67-アコ" = "頑張ってください、委員長。"
"1901-68-ヒナ" = "はあ……。"
"1901-69" = "風紀委員会・週次定例"
