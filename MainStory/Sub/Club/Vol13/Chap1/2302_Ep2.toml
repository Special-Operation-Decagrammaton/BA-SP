[translation]
"2302-1" = "もう一度！お祭り運営委員会定例会議！"
"2302-2" = "（とある休日の午後。百夜堂の片隅に、お祭り運営委員会が集まっていた）"
"2302-3-シズコ" = "ホワイトボードOK、マーカーも新品。#nうん、完璧ね！"
"2302-4-シズコ" = "じゃあ、フィーナ。"
"2302-5-フィーナ" = "ハイっ！それでは委員長からの命令も受けマシタのでっ！"
"2302-6-フィーナ" = "これより、お祭り運営委員会の定例会議を始めマースっ！"
"2302-7-シズコ" = "ふふ、ふふふふふふふっ……"
"2302-8-シズコ" = "この間は修行部に思いっきり振り回されたけど……"
"2302-9-シズコ" = "今回はひと味違うわ！"
"2302-10-シズコ" = "そう、私たちの切り札……"
"2302-11-シズコ" = "ウミカが帰ってきたもの！"
"2302-12-シズコ" = "お帰りなさい、ウミカ！"
"2302-13-フィーナ" = "フィーナも待ってマシタっ！"
"2302-14-ウミカ" = "こんにちは、社長！"
"2302-15-ウミカ" = "フィーナもお久しぶりです！"
"2302-16-シズコ" = "「社長」じゃなくて「委員長」！"
"2302-17-シズコ" = "はぁ……"
"2302-18-シズコ" = "皆どうして社長って呼ぶのかしら……。"
"2302-19-シズコ" = "まあいいわ。来月「狐踊り商店街」でお祭りが開催されるんだけど――"
"2302-20-シズコ" = "そのお祭りの案を一緒に考えて欲しいの。#n特にウミカ！"
"2302-21-シズコ" = "なんたって、ウミカは百鬼夜行の外でお祭り調査に出ていたのだし……素敵なアイデアを期待してるわよ。"
"2302-22-フィーナ" = "イェーイ！"
"2302-23-ウミカ" = "任せてください！#nそれでは、各自治区で調査したお祭りの結果をお伝えしますね。"
"2302-24-ウミカ" = "まず、先日ゲヘナ地区で開催された「血まみれ祭り」について、今まで秘匿されてきた情報を調べてきました！"
"2302-25-シズコ" = "（血まみれってことは……例の「トマト祭り」のことね）"
"2302-26-シズコ" = "（トマトを投げ合う姿が、まるで血まみれに見えることから名付けられたお祭り……いかにもゲヘナっぽいセンスだわ……）"
"2302-27-シズコ" = "（そんなお祭りに隠されていた情報って、一体……）"
"2302-28-シズコ" = "え、ええ！"
"2302-29-シズコ" = "ウミカがそこまで言うのなら、気になるわね……それで、どうだったの？"
"2302-30-ウミカ" = "はい。"
"2302-31-ウミカ" = "「血まみれ祭り」の起源は、文字通り、相手が血まみれになるまで銃撃戦を繰り広げたことに由来するそうです！"
"2302-32-シズコ" = "え……？"
"2302-33-フィーナ" = "それは……まるで組織間の抗争みたいデスね。"
"2302-34-フィーナ" = "さすがゲヘナ！怖いデスっ！"
"2302-35-シズコ" = "いやいやいや。そんなのがお祭りの起源なわけないでしょ！一体どこで聞いたのよソレ。"
"2302-36" = "えっと……現地調査を行なった際に、街のヘルメット団に教えてもらったのですが……"
"2302-37-ウミカ" = "1000円くれたら「血まみれ祭り」に隠された機密情報を教えてくれると言っていたので……！"
"2302-38-シズコ" = "それ、詐欺だよね！？観光客を騙す現地住民のよくある手口じゃないの！？"
"2302-39-ウミカ" = "えっ？"
"2302-40-ウミカ" = "と、とにかく……そのお祭りは時間の経過に伴い―[ruby=こんにち]―今日で[/ruby]はトマトを投げ合う形に変貌したそうですよ！"
"2302-41-ウミカ" = "あらゆる手段を駆使し、全力でトマトを投げるお祭りなんですね！"
"2302-42-ウミカ" = "トマト投擲機にトマト機関砲、対戦車トマト砲まで！"
"2302-43-ウミカ" = "なんて素晴らしい想像力なんでしょう！"
"2302-44-ウミカ" = "トマトを投擲するために用いられる手段を見ていると、もう……うっとりしちゃって……！"
"2302-45-シズコ" = "対戦車トマト砲って何なの！？"
"2302-46-ウミカ" = "しかもですよ！あのミレニアムサイエンススクールとコネクションがあるって噂があるくらい、大規模なお祭りなんです！"
"2302-47-ウミカ" = "ですから、私たちもあの「血まみれ祭り」を指標にしてみましょうよ！社長！"
"2302-48-シズコ" = "えっ？し、指標？"
"2302-49-ウミカ" = "血まみれ祭りは、単にトマトを投げるだけのお祭りではありません。"
"2302-50-ウミカ" = "市場には売り出せないトマトを処分すると共に、人々をたくさん呼び寄せる効果もあるらしいですから！"
"2302-51-ウミカ" = "どうですか？社長！"
"2302-52-ウミカ" = "これを取り入れたら……"
"2302-53-ウミカ" = "トマトの処分に困っている百鬼夜行の農家のみなさんを助けるだけでなく……"
"2302-54-ウミカ" = "町興しにもなるんですよ！"
"2302-55-ウミカ" = "あっ！トマト料理を提供するのも良さそうですね！"
"2302-56-ウミカ" = "もう売り物にならないトマトを購入し、経済を回す。"
"2302-57-ウミカ" = "そして、農家さんと連携し、トマト料理を提供する！"
"2302-58-ウミカ" = "そうすれば、トマトの消費を促進させることもできちゃいますね！まさに一石二鳥です！"
"2302-59-ウミカ" = "閉幕後、トマトを掃除したり、衣類を洗濯する業者さんも必要となりますから……"
"2302-60-ウミカ" = "その分野も、より賑わうこと間違いなしです！"
"2302-61-フィーナ" = "さすがウミカ！"
"2302-62-フィーナ" = "現地調査で見聞を広めたんデスね！"
"2302-63-フィーナ" = "フィーナ、そこまでは思い至りませんデシタっ！"
"2302-64-シズコ" = "そ、そう……？"
"2302-65-シズコ" = "消費の活性化と掃除関連事業の活性化ねぇ……意外と、良いのかも……？"
"2302-66-シズコ" = "いや、やっぱり違うわ！"
"2302-67-シズコ" = "何より予算が足りないんだから！そもそも、怪我人が発生したらどうするの！他はないの？"
"2302-68-ウミカ" = "では、次の案です！"
"2302-69-ウミカ" = "ワイルドハント芸術学院では特別な学園祭が開催されるそうです！全学園が参加するビッグイベントですね！"
"2302-70-シズコ" = "学園祭。いい響きだわ。しかも、普通で良い。"
"2302-71-ウミカ" = "でしょう？でしょう？"
"2302-72-ウミカ" = "でも、ワイルドハントは少し特殊だそうです。仮に、演劇の場合は……"
"2302-73" = "場合は……？"
"2302-74-ウミカ" = "リアリティが命！"
"2302-75-ウミカ" = "なので舞台ではMG5の実弾を使用します！100発全弾発射です！"
"2302-76-ウミカ" = "それに負けず、反対側[ruby=しょういだん]は焼夷弾を[/ruby]発射！"
"2302-77-ウミカ" = "舞台は燃え盛り、最後は爆発エンド！#nドッカーン！真の演劇が完成されるのです！"
"2302-78-ウミカ" = "そうやって、あらゆる部活が各自の芸術を発揮し……"
"2302-79-ウミカ" = "すべてが一か所に集まって、爆発！ドッカーン！破壊！ドゴーン！するのです！"
"2302-80-フィーナ" = "流石はウミカ！芸術は爆発だ、デスね！"
"2302-81-フィーナ" = "いえ、破壊デシタっけ？"
"2302-82-シズコ" = "それ、学園祭で使っちゃいけない単語じゃない！？"
"2302-83-シズコ" = "ちなみに、その情報はどこから……？"
"2302-84-ウミカ" = "インターネットです！"
"2302-85-シズコ" = "ネットには信用できない情報がたくさんあるから、あまり鵜呑みにしないでね！？"
"2302-86-ウミカ" = "えっと、それじゃあ！田舎の学園で開催される競走のお祭りとかはどうですか？"
"2302-87-シズコ" = "田舎の学園……いい響きね。ゆったりしていて、どこか癒される気分だわ。競走といえば……短距離走みたいな感じなの？"
"2302-88-ウミカ" = "それは……テクニカルレース祭りです！"
"2302-89-シズコ" = "て、テクニカル！？"
"2302-90-ウミカ" = "はい！まず、チューニングしたトラックに各種の武器を取り付けるんですね！対空砲、多連装ロケット砲、重機関銃など……車両に乗っけるものなら何でもありです！"
"2302-91-ウミカ" = "重さのバランスが不安定でも、車両が転覆されないよう常に気をつけながらドライブする！それに、8気筒エンジンを使い、車両の限界まで挑戦する……"
"2302-92-ウミカ" = "私はきっと！その姿が！"
"2302-93-ウミカ" = "街に活気をもたらすに違いないと信じています！"
"2302-94-フィーナ" = "おぉ～！フィーナもそのレースが見たいデス！"
"2302-95-フィーナ" = "きっと迫力満点デスよね！"
"2302-96-シズコ" = "ダメ！そもそも、そんなの不正改造だから！それに、百鬼夜行でそういう武器の扱いは禁止されているんだから！"
"2302-97-シズコ" = "却下っ！"
"2302-98-シズコ" = "……ねぇ、ウミカ。その……もっと百夜堂のコンセプトに合いそうなアイデアはないの……？"
"2302-99-ウミカ" = "うーん……残りのアイデアは、地味というか……大した内容じゃなくて……"
"2302-100-ウミカ" = "あまり役に立つとは思わないんですよね……なにより規模も小さいですし……"
"2302-101-ウミカ" = "商店街を劇的にドーン！と復興できそうなアイデアじゃないと思うんですが……"
"2302-102-ウミカ" = "それでもいいって、おっしゃるのであれば……"
"2302-103-ウミカ" = "「ヤナギ祭り」というのがありましたよ。"
"2302-104-シズコ" = "それはどんなお祭りデスカ？"
"2302-105-ウミカ" = "えっと……参加者たちがヤナギの枝の形をした装飾をつくって、水辺を散策するお祭りです。"
"2302-106-ウミカ" = "風に揺れるヤナギの枝と葉っぱを見ながら、川辺を歩き……"
"2302-107-ウミカ" = "ゆったりとした、静かな時間を楽しむ。そんなお祭りですね。"
"2302-108-ウミカ" = "そして、お腹が空いてきたら、お祭りの屋台で食べ物を食べる。そこには、ヤナギの形をした飴やお菓子も用意されているんです。"
"2302-109-ウミカ" = "実はですね？ヤナギの枝には活力を高める効果がたくさんあるらしいですよ！"
"2302-110-ウミカ" = "このお祭りも、そこから由来されたって言い伝えられるぐらいですからね！"
"2302-111-シズコ" = "オォ、ヤナギにそんな話があったなんて、初めて知りマシタ！"
"2302-112-ウミカ" = "はい！それと、ヤナギには水質浄化の効果もありますし、"
"2302-113-ウミカ" = "さらに、樹皮には薬の成分があるとも言われています！サリチル酸と呼ばれる物質ですね！"
"2302-114-ウミカ" = "それを無水酢酸によりアセチル化すれば、アセチルサリチル酸、つまり解熱鎮痛剤が出来上がるらしいです！"
"2302-115-ウミカ" = "その他にはですね。昔、喉が乾いた旅人がおり、女の人は旅人が水でむせるのを心配し、一葉のヤナギの葉っぱを水に入れてゆっくり飲むよう配慮した逸話もあるらしいです。"
"2302-116-フィーナ" = "ロマンティックな話デス！"
"2302-117-ウミカ" = "ふふっ、私もとっても気に入ってるお話です！"
"2302-118-ウミカ" = "とにかく、昔はヤナギの枝を手に持って、川辺を散策する様なお祭りでしたけど……"
"2302-119-ウミカ" = "今は枝を折るのは悪いから、代わりに模型品を作ってお祭りを楽しむ形になったそうですよ！"
"2302-120-シズコ" = "それよ！それ！"
"2302-121-シズコ" = "流石はウミカ！最高じゃない！"
"2302-122-フィーナ" = "ウミカ！すごいデス！なんだか心がズキューン！ってなりマシタ！フィーナも大賛成デス！"
"2302-123-ウミカ" = "ほ、本当ですか？"
"2302-124-ウミカ" = "えへへっ、良かったです！"
"2302-125-ウミカ" = "では、せっかくですし超大型のヤナギの枝模型を作りましょう！莫大な予算をつぎ込んだら、きっと……！"
"2302-126-シズコ" = "いや！それはいい！もう十分だから！"
"2302-127-ウミカ" = "え？"
"2302-128-ウミカ" = "でも……"
"2302-129-シズコ" = "いいからっ！"
"2302-130-ウミカ" = "は、はい……。"
"2302-131-シズコ" = "では、これにて会議終了ね！"
"2302-132-フィーナ" = "ハイ！ウミカのアイデアを元に、お祭りの準備開始デース！"
"2302-133-ウミカ" = "え？ほ、本当に私の案でいいんですか……？"
"2302-134-フィーナ" = "問題ありマセン！ウミカならできマス！なにせ、私たちも付いてますカラ！"
"2302-135-フィーナ" = "お祭り運営委員会は、いつも一緒なのデス！"
"2302-136-シズコ" = "そう！お祭りは皆で楽しむものだからね！"
"2302-137-シズコ" = "行こう！フィーナ！ウミカ！お祭り運営委員会の腕の見せ所よ！"
"2302-138-フィーナ" = "ウミカも行きまショウ！"
"2302-139-フィーナ" = "は、はいっ！"
"2302-140" = "（そうやってお祭り運営委員会の本格的な活動が……今まさに始まるのであった！）"
"2302-141" = "もう一度！お祭り運営委員会定例会議！"
