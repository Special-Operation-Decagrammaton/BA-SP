[translation]
"3703-1" = "怪しいリミナルスペース（２）"
"3703-2-レナ" = "こんなの絶対誰かのイタズラだから！#n調査終わり！1階に下りてさっさと帰ろ！！"
"3703-7-レナ" = "なんで反応しないの！？"
"3703-8-カノエ" = "「異常現象を調べる」ってルールを満たしてないからかも……。"
"3703-11-ツムギ" = "調査をしなければ帰してくれなさそうですね。"
"3703-12-ツムギ" = "ふふ。どんな異常があるのか楽しみです。"
"3703-13-エリ" = "では近くの部屋から行ってみましょう。"
"3703-20-エリ" = "これは……さみしい部屋ですね。"
"3703-21-レナ" = "変わったことは無さそうだけど――"
"3703-25-レナ" = "――って、なんでこのパソコン電源ついてるの！？"
"3703-26-ツムギ" = "スリープ状態を解除してみましょうか？"
"3703-27-レナ" = "私はやりたくないわよ……？"
"3703-29-ツムギ" = "えいっ。"
"3703-33-レナ" = "うわぁっ！？なんか真っ赤なんだけどっ！？"
"3703-34-カノエ" = "……部屋を出よう。急いで。"
"3703-39-エリ" = "おお……一瞬ですがビックリしました。"
"3703-40-ツムギ" = "ふふ。この要領で部屋を調べていけばいいのですね？"
"3703-41-ツムギ" = "実に面白いです。"
"3703-42-レナ" = "シャーッ！何が面白いのよ！失敗したら永遠に8階をさまようことになるんだよ！？"
"3703-43-レナ" = "うぅ……やっぱついてくるんじゃなかった……。"
"3703-44-エリ" = "異常現象があったら上の階に行くんでしたよね？"
"3703-45-カノエ" = "うん……行こうかぁ。"
"3703-52" = "怪しげな建物・5階廊下"
"3703-57-エリ" = "おおっ？この階はすでに雰囲気が出てますね！"
"3703-58-カノエ" = "イヒッ……今にも何か飛び出してきそうだねぇ。"
"3703-59-レナ" = "……！！"
"3703-60-ツムギ" = "レナちゃん、私の後ろにどうぞ。守ってあげますから。"
"3703-61-レナ" = "別に怖くないけど！？"
"3703-62-エリ" = "さて、ここには何があるんでしょうか？"
"3703-67-エリ" = "……あれ？部屋は綺麗ですね。"
"3703-68-エリ" = "他にも特に何もなさそうですし……。"
"3703-69-ツムギ" = "では隣の部屋に行ってみましょう。"
"3703-73-ツムギ" = "あら……こちらも綺麗ですね。"
"3703-74-カノエ" = "古い廊下と、綺麗な部屋……。"
"3703-76" = "他の部屋も同様に綺麗だった。"
"3703-77" = "隅々まで調べてもこれといった異変は起きなかった。"
"3703-79-エリ" = "さあ、選択の時間です。"
"3703-80-エリ" = "目立つ異変こそありませんでしたが、強いて言えば廊下と部屋の様子は違っていました。"
"3703-81-エリ" = "これを「異常現象」と定義するか否か、という話でしょうか。"
"3703-82-ツムギ" = "リミナルスペースは元々が違和感を感じさせる場所ですし、難しいですね。"
"3703-83-カノエ" = "レナちゃんは……どう思う？"
"3703-84-レナ" = "難しいなら下にしない？8階に行ったらゲームオーバーなんでしょ？私ヤだよ。"
"3703-85-エリ" = "では下がるということで。もう一度4階に行きましょう！"
"3703-92" = "怪しげな建物・4階廊下"
"3703-95-レナ" = "なにこれ！？さっきと全然違うじゃん！？"
"3703-96-ツムギ" = "ふふ……外が見えないのでは、状況がまったく分かりませんね。"
"3703-97-レナ" = "うあああああ……！"
"3703-99" = "こうして、リミナルスペース脱出のための冒険が続いた。"
"3703-101" = "怪しげな建物・6階廊下"
"3703-112" = "怪しげな建物・2階の部屋"
"3703-118" = "怪しげな建物・3階の部屋"
"3703-127" = "怪しげな建物・7階の部屋"
"3703-136" = "異常現象は絶え間なく発生し続け――"
"3703-137" = "オカルト研究会一同は、ついに7階のエレベーターで最後の選択を迫られていた。"
"3703-139" = "怪しげな建物・7階のエレベーター"
"3703-140-レナ" = "もうやだ～っ！いよいよエレベーターの電気まで消えたんだけど！？"
"3703-141-カノエ" = "8階行きのボタンだけが動くみたいだねぇ……。"
"3703-142-カノエ" = "やっぱり、怪しい影の仕業かなぁ……？"
"3703-143-レナ" = "何の影！？"
"3703-144-カノエ" = "分からない……すぐ逃げちゃったから。"
"3703-145-レナ" = "ひぃぃっ……！！"
"3703-146-レナ" = "やっぱついてくるんじゃなかった！おとなしく寮で寝てればよかったんだ！！"
"3703-147-レナ" = "終わりよ……もう全部終わり……！！"
"3703-148-エリ" = "怖がる必要はありません！これでオカルトの実在を証明できたのですから！"
"3703-149-エリ" = "私たちの冒険はここからです！"
"3703-150-レナ" = "こんな冒険求めてないのにぃ……！"
"3703-151-レナ" = "だって聞いてないもん！「リミナルスペース」が本当にあるなんて！！"
"3703-152-レナ" = "出して！ここから出してよぉーーっ！！"
"3703-156-ツムギ" = "残された選択肢は1つ――"
"3703-157-ツムギ" = "上に行きましょう。#nこの先に待ち受けるは絶望か希望か……まだ分かりませんから。"
"3703-158-レナ" = "8階で終わりなんでしょ？#nそしたら永遠にさまようって……！！"
"3703-159-ツムギ" = "私は怖くありません。#n今回の事件はみんなのハートを強くする。そう信じておりますので。"
"3703-163-ツムギ" = "どんな時も恐れず、冷静に立ち向かう心こそ――"
"3703-164-カノエ" = "――「ブレイブ」。"
"3703-165-エリ" = "……ですから！"
"3703-166-レナ" = "シャーッ！みんなおかしいんじゃないの！？"
"3703-167-ツムギ" = "ふふ。#nそれでは……上へ参ります。"
"3703-174" = "怪しげな建物・8階廊下"
"3703-176-エリ" = "……やっぱり雰囲気ありますね。今にも何かが飛び出してきそうです。"
"3703-177-レナ" = "で、ど、どうするの？"
"3703-178-カノエ" = "対策なら……あるよぉ。"
"3703-179-エリ" = "にゅふふ。こんな時に備えて退魔のまじないを用意してきました。"
"3703-180-レナ" = "そういうのがあるなら早くやって！？"
"3703-181-エリ" = "これは特殊なまじないなので、使えるのは1度きり。#nここぞという時のために、大事に大事に取っておいたんです。"
"3703-182-カノエ" = "今がその時だと思う……。"
"3703-183-エリ" = "……はい。私もそう思います。"
"3703-186-エリ" = "覚悟は決まりました。みなさん、準備はいいですか？"
"3703-187-ツムギ" = "ふふ、もちろんです。"
"3703-188-レナ" = "そ、それで何とかなるのよね！？"
"3703-189-エリ" = "これは紛れもなく悪魔の仕業……！#nツムギは悪魔の誘き出しをお願いします！"
"3703-190-ツムギ" = "誘き出し……「あれ」のことですね。"
"3703-191-エリ" = "カノエ先輩は私と一緒に悪魔の退治を！"
"3703-192-カノエ" = "イヒッ……任せてぇ。"
"3703-193-エリ" = "最後に、レナちゃんは応援で勇気づけてください……！"
"3703-196-レナ" = "応援？どうすればいいの？"
"3703-197-エリ" = "かわいいネコのモノマネです！"
"3703-198-レナ" = "なんで！？"
"3703-199-エリ" = "元気が出るからです！"
"3703-200-カノエ" = "私もぉ……。"
"3703-201-ツムギ" = "私もです。"
"3703-204-レナ" = "うぅぅ……もう！分かった！とことんやってやろうじゃないの！！"
"3703-205-ツムギ" = "では、私から始めます。"
"3703-209-エリ" = "いい感じです！次はレナちゃん！"
"3703-212-レナ" = "み、みゃ～！みゃあみゃああ～……！！"
"3703-216-カノエ" = "あはぁ……元気出てきた……。"
"3703-217-エリ" = "はい……マナが満ちてきました……。"
"3703-218-レナ" = "にゃああ～お……！！"
"3703-219-レナ" = "（シャーッ！何なのよこれ！）"
"3703-220-エリ" = "これで発動条件は整いました！"
"3703-221-エリ" = "悪魔よ、出てきなさい！私たちがお相手します！"
"3703-230-カノエ" = "あれは……さっき見た影……。"
"3703-231-エリ" = "ついに姿を現しましたね！"
"3703-232-カノエ" = "それじゃあ、いくよぉ……。"
"3703-235-エリ" = "アブラ……！"
"3703-236-カノエ" = "カダブラ――！"
"3703-251-エリ" = "やりました！"
"3703-252-レナ" = "――って、ただの銃と閃光弾じゃん！"
"3703-253-ツムギ" = "ですが倒せましたよ？"
"3703-254-カノエ" = "もう降参したらどうかなぁ……？勝負はついたと思うよ。"
"3703-257-？？？" = "くぅっ……！"
"3703-260-映像学科の生徒" = "誠に申し訳ございませんでしたーっ！！#nお願いだからセットだけは壊さないでぇ……！"
"3703-263-レナ" = "せ、セット……？"
"3703-265" = "事件の全容はこうだった――"
"3703-267-エリ" = "撮影用のセット……これ全部ですか？"
"3703-268-映像学科の生徒" = "はい。#n私たちは監督になることを夢見て、CGを排除した超写実主義で映像を作っています。"
"3703-269-映像学科の生徒" = "その理想を実現すべく、志を共にする仲間と作ったのがここのセットです。"
"3703-270-映像学科の生徒" = "セットの点検をしていたら皆さんがいらしたので……。"
"3703-271-映像学科の生徒" = "最初は、少し出来栄えを確認しようとしただけだったのですが……#nえへへ……皆さんの反応があまりにも良くって、ついここまで。"
"3703-272-レナ" = "あのエレベーターはどうやったの？連続で起きた異常現象は！？"
"3703-273-映像学科の生徒" = "詳細は営業秘密ですが、こちらを見ていただくのが早いかと。"
"3703-277-映像学科の生徒" = "じゃじゃーん。"
"3703-278-ツムギ" = "これで操作していたのですね。#nずっと感じていた違和感の正体はこれですか。"
"3703-279-レナ" = "シャーッ！！ずっとからかわれてたってこと……！？"
"3703-280-カノエ" = "オカルトじゃなかったねぇ。"
"3703-281-エリ" = "にゅふふ。構いません。"
"3703-282-エリ" = "まるで魔法のような、楽しい時間でしたから！"
"3703-283-ツムギ" = "はい、私も楽しかったです。"
"3703-284-ツムギ" = "やはり私たちを待ち受けるのは、絶望ではなく希望でしたね。"
"3703-285-レナ" = "一瞬だけでも、みんなして信じてたって事実が絶望的じゃない！？"
"3703-286-映像学科の生徒" = "ふふっ。ご好評のようで何よりです。"
"3703-287-映像学科の生徒" = "はい、私の連絡先をお渡ししておきます。何かあればご連絡ください。"
"3703-288-映像学科の生徒" = "それと、今日の録画は映画制作の資料として使わせていただきます！"
"3703-289-レナ" = "資料！？ダメ！絶対消して！！"
"3703-290-映像学科の生徒" = "もちろん、タダでとは言いません。#n……これを。"
"3703-291-レナ" = "お金で釣るつもり？バカにしないでよ！"
"3703-294" = "――と言うには、なかなか良い金額だった。"
"3703-296-映像学科の生徒" = "それでは皆さん、お気をつけて！"
"3703-298" = "1階に下りるエレベーターの中――"
"3703-299-レナ" = "はあ……何でこんな目に……。"
"3703-300-レナ" = "次は絶対騙されないんだから。"
"3703-306-レナ" = "何よその表情！#n言いたいことがあるなら、はっきり言えばいいじゃない。"
"3703-309-カノエ" = "にゃー……。"
"3703-312-エリ" = "にゃあ～"
"3703-313-ツムギ" = "みゃあ～お。"
"3703-314-レナ" = "だーっ！それはもう忘れてってば～～っ！！"
"3703-318" = "怪しげな建物・4階"
"3703-320-レナ" = "な、なに？なんで4階に止まるの？"
"3703-321-エリ" = "故障でしょうか？まあ、こんなこともありますよ。"
"3703-329" = "怪しげな建物の外"
"3703-335-レナ" = "はぁ……やっと出られた……。"
"3703-336-エリ" = "本物のリミナルスペースだと思ってたので……途中からビクビクでした！"
"3703-337-ツムギ" = "噂に忠実と言いますか、見事な再現性でした。#nね、レナちゃん？"
"3703-338-レナ" = "私に聞かないで！もう思い出したくもないんだから！"
"3703-339-カノエ" = "イヒッ……帰ったらおいしいもの食べようねぇ。"
"3703-340-エリ" = "……あっ！#nそういえばさっき、4階でエレベーターが止まったじゃないですか。"
"3703-341-エリ" = "廊下の向こうに立っていた血まみれの女の子、見ました？"
"3703-342-ツムギ" = "とても上手なメイクでしたね。あれには私も少しばかり驚きました。"
"3703-343-レナ" = "ふんっ、あんなの全然怖くないけど？結局作り物でしょ？"
"3703-344-カノエ" = "ん……？なんだか変だね。"
"3703-349-映像学科の生徒" = "どうされました？何か忘れ物でも？"
"3703-350-カノエ" = "聞きたいことがあるんだけど……4階にさ、血まみれの女の子っていたかなぁ？"
"3703-353-映像学科の生徒" = "はい？そんな演出は使ってないですよ。"
"3703-357-カノエ" = "……だってぇ。"
"3703-361-ツムギ" = "あらま。"
"3703-362-エリ" = "ホンモノってことですか！？#nおお……やっぱりオカルトは存在しました……！！"
"3703-363-レナ" = "う、ウソだ！お願い！ウソって言って！！"
"3703-365" = "とある建物の4階で目撃された、血に染まった少女。"
"3703-366" = "それは「境界」に呼び寄せられた異次元の存在だったのだろうか――"
"3703-367-レナ" = "わーーーっ！ウソウソウソウソ！そんなの全部ウソ～～っ！！！"
"3703-368" = "怪しいリミナルスペース"
