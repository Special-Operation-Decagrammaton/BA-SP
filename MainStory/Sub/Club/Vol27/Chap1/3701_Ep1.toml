[translation]
"3701-1" = "怪しい占い"
"3701-4-レナ" = "はぁぁぁぁ～～……。"
"3701-8-エリ" = "大きなため息ですね。どうかしましたか？"
"3701-9-カノエ" = "ごめんねぇ……全部、私が悪かったの……。"
"3701-10-レナ" = "シャーッ！！なんでそうやって適当なこと言うのよ！"
"3701-11-レナ" = "……別に先輩たちが何かしたとかじゃないから、気にしないで。"
"3701-12-ツムギ" = "とはいえ、可愛い後輩のため息は見過ごせません。"
"3701-13-ツムギ" = "悩みがあれば聞きますよ？"
"3701-16-レナ" = "……なんか、最近ツイてないっていうか、嫌なこと続きでさ。"
"3701-17-レナ" = "靴底が剥がれたり、大事にしてたバッグの紐が切れたり……。"
"3701-18-レナ" = "手鏡が割れたり、蜘蛛の巣に顔から突っ込んだり……。"
"3701-21-レナ" = "あー、も～っ！口に出すと余計ムカついてきた！"
"3701-22-ツムギ" = "ふむ……不吉な前兆のようにも思えますね。"
"3701-23-レナ" = "でしょ？なんかヤな感じでさ。"
"3701-24-レナ" = "このままだと、もっと大変なことに巻き込まれる……ような感じがするっていうか……。"
"3701-25-レナ" = "もちろんオカルトなんて信じてないけどさ。気味が悪いじゃん？"
"3701-28-カノエ" = "もしかして……悪霊の仕業かも……。"
"3701-29-カラス" = "ガァッ！ガァァッ……！"
"3701-30-レナ" = "きゃぁっ！？またカラス入ってきてるんだけど！？"
"3701-31-カノエ" = "きっと悪霊の気配を感じて、忠告に来たんだよぉ……。"
"3701-32-レナ" = "そんなわけない！絶対ない！"
"3701-33-エリ" = "でも悪い事が続いているのは確かなんですよね？"
"3701-34-エリ" = "レナちゃんが凶事を避けられるように、私が占ってみます！"
"3701-35-レナ" = "いや、占いも信じてないから、私。気持ちだけもらっとく。"
"3701-36-ツムギ" = "そう言わずに。遊びだと思ってやってみましょう？#n損はしないはずですよ。"
"3701-40-レナ" = "まあ、みんなが言うなら……。"
"3701-45-レナ" = "電気消すの！？"
"3701-49-エリ" = "にゅふふふ……アルカナに導かれし者よ、これより汝の運命を占いましょう。"
"3701-50-エリ" = "運命とは自分で切り開くもの。結果を恐れる必要はありません。"
"3701-51-エリ" = "無意識に身をゆだね、カードを3枚めくってください。"
"3701-52-レナ" = "分かった。"
"3701-58-レナ" = "ど、どう……？良い事ありそう？"
"3701-59-エリ" = "これは……。"
"3701-60-エリ" = "お世辞にも良い運勢とは言えません……。"
"3701-61-レナ" = "そんなに酷いの！？"
"3701-62-エリ" = "私の口から言うには恐ろしいといいますか……。"
"3701-63-ツムギ" = "エリがそこまで言うなんて、本当によろしくなさそうですね。"
"3701-64-レナ" = "じゃあ私はどうしたらいいの！？"
"3701-65-エリ" = "にゅふふ。ご安心ください、まだ方法はあります。"
"3701-66-エリ" = "さあ、もう一度カードを3枚引いてください。#n不安を消し去る新たな道を示してくれます！"
"3701-67-レナ" = "うぅぅ……！！"
"3701-68-レナ" = "分かったわよ！引けばいいんでしょ！"
"3701-72-レナ" = "はいっ！今度はなんて？"
"3701-73-エリ" = "ほぉ……これは。"
"3701-74-エリ" = "ふむふむ……？"
"3701-75-レナ" = "もったいぶらないで早く言ってよ！"
"3701-76-エリ" = "……今まで数え切れないほどの組み合わせを見てきましたが、こんな結果は初めてです。"
"3701-77-エリ" = "お伝えします。#n凶事を逃れるために、レナちゃんがすべきことは――"
"3701-81-エリ" = "――「猫のモノマネ」です。"
"3701-85-レナ" = "……え？"
"3701-86-エリ" = "カードによると「月のない夜の午前0時に猫のモノマネ」をすれば凶事は消え失せ、#n幸運が巡ってくる……らしいです。"
"3701-87-レナ" = "午前0時……それ、寮の中でやれってこと？"
"3701-88-カノエ" = "イヒッ……楽しくなりそうだねぇ。"
"3701-89-ツムギ" = "あらま。"
"3701-92-レナ" = "……。"
"3701-93-レナ" = "う、うぅ……うぅっ……！"
"3701-94-レナ" = "やるわけないでしょ！？しかも先輩たちの前でなんて！絶対やらないから！"
"3701-95-レナ" = "シャーッ！！やっぱりからかってるんだ！ちょっとでも期待した私がバカみたい！"
"3701-96-レナ" = "もうこの話は終わり！解散っ！！"
"3701-101-ツムギ" = "ふふっ、残念です。レナちゃんの可愛い姿が見れると思ったのですが。"
"3701-102-カラス" = "ガァッ！ガァァッ……！"
"3701-103-カノエ" = "この子も、そうみたい……。"
"3701-104-エリ" = "にゅふ、私は信じています。"
"3701-105-エリ" = "レナちゃんには、私たちの思いが伝わっていると！"
"3701-107" = "時は流れ――"
"3701-113" = "月のない夜の、午前0時。"
"3701-117-レナ" = "みんな……寝てる？"
"3701-120-レナ" = "……。"
"3701-121-レナ" = "……寝てる、よね？"
"3701-122-レナ" = "もしも起きてるなら正直に言って。今なら怒らないから。"
"3701-126-レナ" = "……。"
"3701-127-レナ" = "（よし、みんな寝てる）"
"3701-128-レナ" = "（はぁ……深夜に猫のモノマネって……）"
"3701-129-レナ" = "（でも、まあ？一応。一応、気休めにね）"
"3701-130-レナ" = "（最近ツイてなさすぎて猫の手も借りたいくらいだし）"
"3701-131-レナ" = "（じゃあ……やるぞ――！）"
"3701-134-レナ" = "に、にゃあーお。にゃああ～お。"
"3701-135-レナ" = "みゃ～、みゃあみゃあ～……。"
"3701-136-レナ" = "……。"
"3701-137-レナ" = "（や、やっぱり恥ずかしい！！）"
"3701-138-猫" = "みゃ？"
"3701-141-レナ" = "（ん？いま、窓の外に猫が……？）"
"3701-142-レナ" = "み、みゃあー？"
"3701-143-猫" = "みゃー、みゃあみゃあー。"
"3701-144-レナ" = "（あれっ！？会話できてる！？）"
"3701-145-レナ" = "にゃーお！にゃあーお！"
"3701-146-猫" = "シャーーーッ！！"
"3701-147-レナ" = "（にゃぁーっ！？機嫌悪そうなんだけど！？）"
"3701-148-猫" = "ンミャァァオアーッ！！"
"3701-149-レナ" = "わ、分かった！私が悪かったってば！ごめん！！謝るから落ち着いて！！"
"3701-150-猫" = "みゃああ……。"
"3701-153-レナ" = "（はぁ……私、何やってんだろ……）"
"3701-154-レナ" = "（まさか今ので失敗扱いになって、もっと大事になったりしないよね？）"
"3701-157-レナ" = "（なんか不安になってきた……もう少しやっとく……？）"
"3701-159" = "その後も、レナは小さな声で猫のモノマネを続けた。"
"3701-162-ツムギ" = "（ふふ、やっぱり可愛いです）"
"3701-163-エリ" = "（頑張ってください、レナちゃん！）"
"3701-164-カノエ" = "（応援してるよぉ……）"
"3701-168" = "翌日の午後――"
"3701-171-レナ" = "はぁ……。"
"3701-172-レナ" = "……疲れた。"
"3701-173-レナ" = "昨夜あんなことしてたから……。"
"3701-174-レナ" = "夜中に猫のモノマネって……うぅっ、二度とやるかっ。"
"3701-180-エリ" = "レナちゃん、こんにちは。"
"3701-181-レナ" = "えっ？あ、うん！"
"3701-182-エリ" = "下校中ですか？"
"3701-183-エリ" = "なんという偶然……やはり私たちはルームメイト！互いを呼び合う運命なんですね！"
"3701-184-レナ" = "いや、偶然は偶然でしょ。"
"3701-185-エリ" = "にゅふふ。それで、今日はどうでしたか？#n何か嫌なことはありませんでしたか？"
"3701-186-レナ" = "特に何もなかったけど……。"
"3701-187-レナ" = "（……ん？何もなかったのって……もしかして昨日のあれのおかげ？）"
"3701-190-レナ" = "（いや、そんなわけないか。偶然は偶然でしょ）"
"3701-191-レナ" = "（エリ先輩の占い通りなら良い事があるはずなのに、何もなかったし）"
"3701-192-エリ" = "その様子だと何もなかったみたいでよかったです！"
"3701-193-エリ" = "では寮に帰りましょう！みんなが待ってますよ。"
"3701-194-レナ" = "なんで？"
"3701-195-エリ" = "にゅふふ。行けば分かります。"
"3701-202-カノエ" = "いらっしゃい……待ってたよぉ。"
"3701-203-ツムギ" = "心が落ち着く音楽を用意しますね。"
"3701-210-レナ" = "え、みんなしてどうしたの？"
"3701-213-レナ" = "くんくん……なんか美味しそうな匂いもするような……。"
"3701-214-カノエ" = "これ、あげる……疲れが取れるはず。"
"3701-215-レナ" = "飲み物……？見るからに怪しいんだけど……。"
"3701-216-カノエ" = "特製のブドウエード……飲めば頭スッキリ……イヒッ……。"
"3701-217-レナ" = "ん……？なんか入ってる？"
"3701-220-レナ" = "シャーッ！？これっ、目玉みたいなの何っ！？"
"3701-221-カノエ" = "ライチとブルーベリー……ちょっとした遊び心だよぉ。"
"3701-222-ツムギ" = "はい、クッキーもどうぞ。みんなで心を込めて作りました。"
"3701-223-レナ" = "カボチャのクッキー？"
"3701-224-ツムギ" = "ふふ、可愛いでしょう？"
"3701-225-レナ" = "かわいいとは思うけど……今日って何かの記念日だっけ？#nもしかして私、忘れてる？"
"3701-226-エリ" = "大丈夫、普通の日ですよ。#n単に、みんなでお茶をしたいな、と思いまして！"
"3701-227-エリ" = "いかがでしょう？ハッピーな気持ちが湧いてきませんか？"
"3701-228-エリ" = "ほらほら、「良い事」があった気がしません！？"
"3701-231-レナ" = "……。"
"3701-232-レナ" = "……うん。たしかに。"
"3701-233-カノエ" = "クッキーに色々入れてみたよぉ。"
"3701-234-カノエ" = "どれも美味しいものを、ね……イヒヒ。"
"3701-235-ツムギ" = "何味かはお楽しみです。"
"3701-236-レナ" = "ほらほら、みんな座ろ！"
"3701-237-レナ" = "んー、どれにしよっかな～？"
"3701-246" = "お茶会は和気あいあいと進んだ。"
"3701-248-レナ" = "（もう、こういうことされるから憎めないんだよね）"
"3701-249" = "この後に起こる出来事を知らずに――"
"3701-252-レナ" = "ひぃぃっ……！！"
"3701-253-レナ" = "やっぱついてくるんじゃなかった！おとなしく寮で寝てればよかったんだ！！"
"3701-254-レナ" = "終わりよ……もう全部終わり……！！"
"3701-255-エリ" = "怖がる必要はありません！これでオカルトの実在を証明できたのですから！"
"3701-262-エリ" = "私たちの冒険はここからです！"
"3701-263-レナ" = "こんな冒険求めてないのにぃ……！"
"3701-264-レナ" = "だって聞いてないもん！「リミナルスペース」が本当にあるなんて！！"
"3701-265-レナ" = "出して！ここから出してよぉーーっ！！"
"3701-268" = "怪しい占い"
