[translation]
"3502-1" = "プレゼント？"
"3502-2-メグ" = "うわぁ……あっつい～"
"3502-3-メグ" = "でも、ゴリゴリ君があるから大丈夫！"
"3502-4-メグ" = "食後のおやつに～ゴ～リゴ～リ～君～"
"3502-5-メグ" = "あれ……？"
"3502-6-メグ" = "……風紀委員長！？"
"3502-7-メグ" = "……？"
"3502-8-ヒナ" = "ああ、メグね。ここにはどんな用で……？"
"3502-9-ヒナ" = "……もしかして、温泉を掘りに？"
"3502-10-メグ" = "え？ううん、違うよ～！おやつにゴリゴリ君を買いにきたの！"
"3502-11-ヒナ" = "「ゴリゴリ君」……？"
"3502-12-ヒナ" = "ああ、そういえばそういった名前のアイスがあったわね。"
"3502-13-ヒナ" = "じゃあ、今日は温泉を掘るわけではないのね？"
"3502-14-メグ" = "えっとねぇ……"
"3502-15-メグ" = "……あ！そうだ！"
"3502-16-メグ" = "思い出した！カスミ部長が言ってた#n「風紀委員会かヴァルキューレに会った時の対処法」！#n相手はヒナ委員長だから……！"
"3502-17-ヒナ" = "……？"
"3502-18-ヒナ" = "……うーん、えっと。#nどうやるんだっけ……。"
"3502-19-ヒナ" = "その……。"
"3502-20-メグ" = "……あ！"
"3502-21-メグ" = "そうそう！まずはこれを出して……！"
"3502-22-メグ" = "じゃじゃーん！#nはい、どうぞ！"
"3502-23-ヒナ" = "そして――"
"3502-24-ヒナ" = "「いつもご苦労様です。ささやかながら心ばかりのプレゼントです。これからも何卒よろしくお願いいたします。」"
"3502-25-ヒナ" = "…………。"
"3502-26-ヒナ" = "……………………。"
"3502-27-ヒナ" = "……でいいんだよね？"
"3502-28-ヒナ" = "よし！完了！"
"3502-29-ヒナ" = "あ、さっき委員長が言っていた温泉についてだけど……私は分かんないや！#n多分そのうち部長が教えてくれると思う！"
"3502-30-ヒナ" = "なるほど……これが……。"
"3502-31-ヒナ" = "ふぅ……。"
"3502-32-ヒナ" = "……メグ。"
"3502-33-ヒナ" = "カスミから教わったこれ、他の人にもやったことある？"
"3502-34-ヒナ" = "……うん？まだだよ？"
"3502-35-ヒナ" = "実際に試したのはヒナ委員長が初めて！それがどうかしたの？"
"3502-36-ヒナ" = "そう……ならいいわ。"
"3502-37-ヒナ" = "一つ、頼みがあるのだけど。聞いてくれないかしら。"
"3502-38-ヒナ" = "頼み……？"
"3502-39-ヒナ" = "もちろん！なんでも言って！"
"3502-40-ヒナ" = "ありがとう。じゃあ……"
"3502-41-ヒナ" = "今から私がやることを、カスミにそのまま伝えてあげて。"
"3502-42-メグ" = "……はっ！？"
"3502-43-メグ" = "袋が、粉々に……！？"
"3502-44-ヒナ" = "彼女ならこれだけで十分伝わるはずよ。もしも上手くいかなかったら……"
"3502-45-ヒナ" = "「次にこのような行為が発覚したら、その時は確実に制裁を受けてもらう。」"
"3502-46-ヒナ" = "「ゲヘナでは、昔の悪癖は慎むように。」"
"3502-47-ヒナ" = "……と言ってあげて。"
"3502-48-メグ" = "プレゼントを渡したのに、それが壊されたと……部長に伝える……。"
"3502-49-メグ" = "うーん、よく分かんないけど……。"
"3502-50-メグ" = "ま、ヒナ委員長もカスミ部長も頭いいんだし、なにか理由があるんだよね！#nうん！分かった！"
"3502-51-メグ" = "ふふ、ありがとう。"
"3502-52-ヒナ" = "……あ、そうだ！"
"3502-53-ヒナ" = "ちょっと待っててね、風紀委員長！すぐ行ってくるから！！"
"3502-54-ヒナ" = "お待たせ！"
"3502-55-ヒナ" = "はい、これ！"
"3502-56-ヒナ" = "これは……アイス？"
"3502-57-ヒナ" = "……ゴリゴリ君を、私にくれるの？"
"3502-58-ヒナ" = "うん！いっぱい買って、みんなに分けようと思ってたんだ。#nヒナ委員長にも1個あげる！"
"3502-59-ヒナ" = "今日暑いし、こういう日はゴリゴリ君に限るよね！"
"3502-60-ヒナ" = "……あっ。"
"3502-61-ヒナ" = "そういえば、さっきプレゼント壊してたよね……もしかして、こういうのイヤだった？"
"3502-62-ヒナ" = "ご、ごめんね！ついクセで……。"
"3502-63-ヒナ" = "……ううん。違うわ。"
"3502-64-ヒナ" = "ありがとう、メグ。"
"3502-65-ヒナ" = "……うん？これはいいの？さっきと何が違うんだろう……？"
"3502-66-ヒナ" = "それはカスミに聞けば分かるはずよ。"
"3502-67-ヒナ" = "…………。"
"3502-68-ヒナ" = "……メグ。"
"3502-69-メグ" = "うん？"
"3502-70-ヒナ" = "あなたは今、3年生よね？#nカスミとは随分と仲良さそうだけど……。"
"3502-71-ヒナ" = "温泉開発部は以前から存在している部活……#n部員の数は今よりだいぶ少なくて、15名くらいだったはず。"
"3502-72-ヒナ" = "以前はメグが部長を務めていたと思うのだけど。#nカスミは後から入部したのよね？"
"3502-73-メグ" = "うん、そうだよ！カスミ部長が、自分が部長をやるって言ったから、お願いしたの。"
"3502-74-メグ" = "さすが風紀委員長！何でも知ってるんだね！"
"3502-75-ヒナ" = "何でもってわけじゃないわ……。"
"3502-76-ヒナ" = "……。"
"3502-77-ヒナ" = "じゃあ、カスミが先に「部長をやる」って言ったのね？"
"3502-78-ヒナ" = "うん。"
"3502-79-ヒナ" = "……そう。"
"3502-80-メグ" = "……あ、ちょっと違うかも？"
"3502-81-ヒナ" = "……？"
"3502-82-ヒナ" = "正確には「何がしたい？」って言われて、「温泉だけ掘ってたい！」って答えたの。"
"3502-83-メグ" = "そしたら、カスミ部長が「じゃあ、そうさせてやろう」って言ってくれて。"
"3502-84-メグ" = "その後からは、本当に温泉を掘るだけの仕事を任されたんだ！#n部員もいっぱい増えたよ！"
"3502-85-ヒナ" = "……そうなのね。"
"3502-86-ヒナ" = "だいたい予想通りだわ。[ruby=・]あ[/ruby][ruby=・]そ[/ruby][ruby=・]こ[/ruby]の連中は、そういった口約束を重視してきたもの。"
"3502-87-メグ" = "……うん？どういうこと？"
"3502-88-メグ" = "いえ、なんでもないわ。こっちの話。"
"3502-89-ヒナ" = "では先に失礼するわね。今日は暑いし、メグも熱中症には気をつけて。#nそれとカスミには……"
"3502-90-ヒナ" = "……あまり騒ぎを起こさないように、と伝えておいて。"
"3502-91-メグ" = "うん！分かった～！風紀委員長も気をつけてね！"
"3502-92-メグ" = "んじゃ、部長のところに帰ろっと。"
"3502-93-メグ" = "……って事があってね！"
"3502-94-メグ" = "あ、風紀委員長にこう言われたの。"
"3502-95-メグ" = "「次にこのような行為が発覚したら、その時は確実に制裁を与える。」"
"3502-96-メグ" = "「ゲヘナでは、昔の悪癖は慎むように。」――だって！"
"3502-97-カスミ" = "ひいいいいっ！！！"
"3502-98" = "プレゼント？"
